base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/010.yaml
  text: Ben-hadad sent to him and said[a], “May the gods do so to me, and more also, if the dust of Samaria will be enough for handfuls for all the people who are at my feet.”
translation:
  language: de
  text: 'Ben-Hadad schickte zu ihm und ließ ihm sagen: »Die Götter sollen mir dies und noch mehr antun, wenn der Staub Samarias ausreicht, damit jeder von all den Leuten in meinem Gefolge[b] auch nur eine Handvoll[a] bekommt!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort ist selten und in seiner genauen Bedeutung unsicher; im Zusammenhang wird es meist als »Handvoll« oder »Handhöhlung« verstanden.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »die an meinen Füßen sind«; gemeint sind die Leute, die Ben-Hadad begleiten oder unter seinem Befehl stehen.'
    reason: idiom
lexical_decisions:
- source_word: וַיִּשְׁלַח אֵלָיו בֶּן הֲדַד וַיֹּאמֶר
  choice: Ben-Hadad schickte zu ihm und ließ ihm sagen
  rationale: Das Hebräische nennt keinen ausdrücklichen Gegenstand oder Boten. Die deutsche Wendung gibt die diplomatische Nachrichtenübermittlung natürlich wieder, ohne bestimmte Boten in den Text einzutragen.
- source_word: כֹּה יַעֲשׂוּן לִי אֱלֹהִים וְכֹה יוֹסִפוּ
  choice: Die Götter sollen mir dies und noch Schlimmeres antun
  rationale: Die geläufige Schwur- und Fluchformel wird in würdigem, verständlichem Deutsch wiedergegeben. Der Plural »die Götter« entspricht sowohl der Verbform als auch dem nichtisraelitischen Sprecher.
- source_word: אִם
  choice: wenn
  rationale: In der Schwurformel leitet אִם den Fall ein, bei dessen Eintreten der Sprecher den Selbstfluch auf sich nimmt. »wenn« bewahrt die konditionale Form und ist im Deutschen idiomatisch.
- source_word: יִשְׂפֹּק עֲפַר שֹׁמְרוֹן לִשְׁעָלִים
  choice: wenn der Staub von Samaria ausreicht, damit … auch nur eine Handvoll bekommt
  rationale: ספק bezeichnet das Ausreichen. שְׁעָלִים meint hier im Kontext Handvoll beziehungsweise hohle Hände; die Formulierung verdeutlicht Ben-Hadads prahlerische Übertreibung, ohne die Aussage übermäßig auszulegen.
- source_word: לְכָל הָעָם אֲשֶׁר בְּרַגְלָי
  choice: jeder von all den Leuten in meinem Gefolge
  rationale: Wörtlich stehen die Leute »an meinen Füßen«. Im Kontext bezeichnet die Wendung diejenigen, die dem König folgen beziehungsweise unter seinem Befehl stehen. »in meinem Gefolge« bewahrt das Bild nicht formal, vermittelt aber den gemeinten Sinn klar und knapp.
theological_decisions:
- issue: Bedeutung von אֱלֹהִים im Schwur eines aramäischen Königs
  choice: die Götter
  alternative: Gott
  rationale: Die pluralische Verbform יַעֲשׂוּן und der heidnische Sprecher sprechen dafür, dass Ben-Hadad seine Gottheiten anruft. Die Übersetzung vermeidet daher eine nicht geforderte Identifizierung mit dem Gott Israels.
- issue: Grad der Explizierung von Ben-Hadads Drohung
  choice: Die hyperbolische Aussage wird als Verteilung je einer Handvoll wiedergegeben
  alternative: 'Wörtlichere Wiedergabe: »wenn der Staub Samarias für Handhöhlungen ausreicht«'
  rationale: 'Der Satz prahlt mit der gewaltigen Zahl seines Heeres: Selbst Samarias gesamter Staub ergäbe nicht für jeden Mann eine Handvoll. Die Übersetzung macht die syntaktische Beziehung verständlich, ohne das Bild durch eine zusätzliche Erklärung im Vers zu ersetzen.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der drohende, prahlerische Ton des königlichen Schwurs bleibt erhalten. Ben-Hadads Name wird nach verbreiteter deutscher Bibelkonvention mit Bindestrich geschrieben. Keine Fußnote ist nötig, da die idiomatische Wiedergabe das schwierige Bild im Haupttext verständlich macht.
