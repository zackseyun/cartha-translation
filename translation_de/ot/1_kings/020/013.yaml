source:
  edition: WLC
  text: וְ/הִנֵּ֣ה נָבִ֣יא אֶחָ֗ד נִגַּשׁ֮ אֶל אַחְאָ֣ב מֶֽלֶךְ יִשְׂרָאֵל֒ וַ/יֹּ֗אמֶר כֹּ֚ה אָמַ֣ר יְהוָ֔ה הְֽ/רָאִ֔יתָ אֵ֛ת כָּל הֶ/הָמ֥וֹן הַ/גָּד֖וֹל הַ/זֶּ֑ה הִנְ/נִ֨י נֹתְנ֤/וֹ בְ/יָֽדְ/ךָ֙ הַ/יּ֔וֹם וְ/יָדַעְתָּ֖ כִּֽי אֲנִ֥י יְהוָֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/013.yaml
  text: 'And behold[a], a certain prophet came near to Ahab king of Israel and said, “Thus says Yahweh: Have you seen all this great multitude? Behold, I am giving it into your hand today, and you shall know that I am Yahweh.”'
translation:
  language: de
  text: 'Und siehe, ein Prophet trat an Ahab, den König von Israel, heran und sagte: »So spricht Yahweh: Hast du dieses ganze gewaltige Heer[a] gesehen? Sieh, ich gebe es heute in deine Hand. Und du wirst erkennen, dass ich Yahweh bin.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »diese ganze gewaltige Menge« oder »diese ganze riesige Schar«. Das hebräische Wort bezeichnet eine große Menschenmenge oder Heeresmasse und meint hier die feindlichen Streitkräfte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Da
  rationale: Das deutsche narrative »Da« markiert das überraschende Eintreten der Szene natürlich und würdevoll; ein wörtliches »Und siehe« wäre im modernen Standarddeutsch unnötig altertümlich.
- source_word: נָבִיא אֶחָד
  choice: ein Prophet
  rationale: Das Zahlwort אֶחָד führt hier idiomatisch eine unbestimmte Einzelperson ein. »Ein gewisser Prophet« wäre möglich, klänge aber im Deutschen distanzierter als nötig.
- source_word: נִגַּשׁ אֶל
  choice: trat an … heran
  rationale: Gibt die konkrete Bewegung des Sich-Näherns wieder und ist im Deutschen natürlicher als »näherte sich« in dieser Erzählszene.
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Yahweh
  rationale: Bewahrt die feste prophetische Botenformel und gibt das Tetragramm als Eigennamen wieder.
- source_word: הֲרָאִיתָ
  choice: Hast du … gesehen?
  rationale: Der interrogative Perfekt wird als Frage nach der bereits wahrgenommenen, vor Augen stehenden Bedrohung wiedergegeben.
- source_word: כָּל הֶהָמוֹן הַגָּדוֹל הַזֶּה
  choice: dieses ganze gewaltige Heer
  rationale: הָמוֹן bezeichnet eine große Menschenmenge oder Heeresmasse; im unmittelbaren militärischen Kontext ist »Heer« klar und natürlich, während die Fußnote die breitere lexikalische Spannweite erhält.
- source_word: הִנְנִי
  choice: Sieh, ich
  rationale: »Sieh« bewahrt den hervorhebenden und vergegenwärtigenden Charakter, ohne das altertümlichere »Siehe« zu verwenden.
- source_word: נֹתְנוֹ בְיָדְךָ
  choice: gebe es … in deine Hand
  rationale: Der Partizipialausdruck vermittelt die unmittelbar bevorstehende und als gewiss dargestellte Handlung; das deutsche Idiom bewahrt das hebräische Bild der Übergabe in jemandes Gewalt.
- source_word: וְיָדַעְתָּ כִּי אֲנִי יְהוָה
  choice: Dann wirst du erkennen, dass ich Yahweh bin
  rationale: »Dann« macht die resultative Verbindung zur angekündigten Übergabe deutlich. »Erkennen« kann sowohl Einsicht als auch durch Erfahrung gewonnene Anerkenntnis bezeichnen und bewahrt so die theologische Spannung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR / Jahwe
  rationale: Der Quelltext verwendet ausdrücklich das Tetragramm. »Yahweh« behandelt es als Gottes Eigennamen und ersetzt es nicht durch einen Titel.
- issue: Bedeutung der Erkenntnisformel וְיָדַעְתָּ כִּי אֲנִי יְהוָה
  choice: »Dann wirst du erkennen, dass ich Yahweh bin«
  alternative: »Dann wirst du anerkennen, dass ich Yahweh bin«
  rationale: »Erkennen« lässt offen, ob die Aussage vor allem kognitive Einsicht, erfahrungsbezogene Erkenntnis oder Anerkennung der Herrschaft Yahwehs meint; sie legt Ahab nicht ausdrücklich eine innere Bekehrung bei.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Archaismen wie »siehe« und »ein gewisser« werden vermieden; die hebräische Bildsprache »in deine Hand« bleibt erhalten.
