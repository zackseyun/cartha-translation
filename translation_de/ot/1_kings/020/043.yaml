  text: וַ/יֵּ֧לֶךְ מֶֽלֶךְ יִשְׂרָאֵ֛ל עַל בֵּית֖/וֹ סַ֣ר וְ/זָעֵ֑ף וַ/יָּבֹ֖א שֹׁמְרֽוֹנָ/ה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/043.yaml
  text: So the king of Israel went to his house sullen and angry[a], and he came to Samaria.
translation:
  language: de
  text: Da ging der König von Israel missmutig und zornig[a] nach Hause und kam nach Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »verdrossen und verärgert«. Das hebräische Wortpaar סַר וְזָעֵף verbindet inneren Missmut mit erkennbarem Unmut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: ging
  rationale: Das narrative Wayyiqtol von הלך wird im modernen deutschen Erzählstil schlicht mit dem Präteritum wiedergegeben.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: der König von Israel
  rationale: Die Constructusverbindung wird klar und idiomatisch wiedergegeben.
- source_word: עַל בֵּיתוֹ
  choice: nach Hause
  rationale: על bezeichnet hier bei einem Bewegungsverb das Ziel. »Nach Hause« ist im Deutschen natürlicher als »zu seinem Haus« und legt den königlichen Wohnsitz nicht unnötig als Palast fest.
- source_word: סַר
  choice: missmutig
  rationale: Im Zusammenhang mit זָעֵף bezeichnet das seltene Wort eine nach innen gekehrte, verdrießliche oder widerwillige Haltung. »Missmutig« wahrt diese Bedeutung, ohne das Wort übermäßig zu präzisieren.
- source_word: וְזָעֵף
  choice: und zornig
  rationale: Das Adjektiv bezeichnet sichtbaren Unmut, Verärgerung oder Erbitterung. »Zornig« ist verständlich und erhält die zweigliedrige Beschreibung.
- source_word: וַיָּבֹא
  choice: und kam
  rationale: Die einfache narrative Fortsetzung mit בוא wird direkt und natürlich wiedergegeben.
- source_word: שֹׁמְרוֹנָה
  choice: nach Samaria
  rationale: Das Richtungs-He bezeichnet eine Bewegung auf Samaria zu; Deutsch drückt dies idiomatisch mit »nach« aus.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller Erzählstil. »Da ging« gibt den folgernden Übergang des hebräischen וַ wieder; »nach Hause« klingt natürlich, ohne den königlichen Wohnort als »Palast« auszudeuten.
