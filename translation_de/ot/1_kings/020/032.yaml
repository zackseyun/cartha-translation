  text: וַ/יַּחְגְּרוּ֩ שַׂקִּ֨ים בְּ/מָתְנֵי/הֶ֜ם וַ/חֲבָלִ֣ים בְּ/רָאשֵׁי/הֶ֗ם וַ/יָּבֹ֨אוּ֙ אֶל מֶ֣לֶךְ יִשְׂרָאֵ֔ל וַ/יֹּ֣אמְר֔וּ עַבְדְּ/ךָ֧ בֶן הֲדַ֛ד אָמַ֖ר תְּחִֽי נָ֣א נַפְשִׁ֑/י וַ/יֹּ֛אמֶר הַ/עוֹדֶ֥/נּוּ חַ֖י אָחִ֥/י הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/032.yaml
  text: So they tied sackcloth around their waists and ropes on their heads[a], and they came to the king of Israel and said, “Your servant Ben-hadad says, ‘Please let me live.’” And he said[b], “Is he still alive? He is my brother.”
translation:
  language: de
  text: 'Da gürteten sie Sacktuch um ihre Hüften und legten sich Stricke auf ihre Köpfe. Dann kamen sie zum König von Israel und sagten: „Dein Knecht Ben-Hadad lässt dir sagen: ‚Bitte lass mich am Leben!‘“[a] Er erwiderte: „Lebt er noch? Er ist mein Bruder.“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Möge doch mein Leben leben!“'
    reason: lexical_alternative
  - marker: b
    text: „Mein Bruder“ bezeichnet hier wahrscheinlich politische oder bündnishafte Verbundenheit, nicht eine leibliche Verwandtschaft.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּחְגְּרוּ שַׂקִּים בְּמָתְנֵיהֶם
  choice: Da gürteten sie Sacktuch um ihre Hüften
  rationale: חגר bezeichnet das Umschnallen oder Umgürten; „gürteten … um ihre Hüften“ bewahrt das konkrete Bild. שַׂקִּים wird als Stoff- bzw. Kleidungsbezeichnung idiomatisch mit „Sacktuch“ wiedergegeben.
- source_word: וַחֲבָלִים בְּרָאשֵׁיהֶם
  choice: und legten sich Stricke auf den Kopf
  rationale: חֲבָלִים sind Stricke oder Seile. Die Präposition ב legt hier eine Lage am oder auf dem Kopf nahe; „auf den Kopf“ vermeidet eine unbelegte Festlegung darauf, dass sie darumgebunden waren.
- source_word: עַבְדְּךָ
  choice: Dein Knecht
  rationale: Im höfisch-diplomatischen Zusammenhang ist dies eine konventionelle, sich erniedrigende Selbstbezeichnung; „Knecht“ erhält den historischen und würdevollen Ton.
- source_word: בֶן הֲדַד
  choice: Ben-Hadad
  rationale: Der Personenname wird in der im Deutschen geläufigen Form transliteriert.
- source_word: אָמַר
  choice: lässt dir sagen
  rationale: Im Deutschen gibt „lässt dir sagen“ die durch Boten übermittelte Rede natürlich wieder, ohne ihren Inhalt zu verändern.
- source_word: תְּחִי נָא נַפְשִׁי
  choice: Lass mich doch am Leben!
  rationale: Wörtlich heißt die Wendung etwa „Möge doch mein Leben leben“. Gemeint ist die dringende Bitte, das Leben zu verschonen; die deutsche Formulierung gibt diesen Sinn idiomatisch wieder.
- source_word: הַעוֹדֶנּוּ חַי
  choice: Lebt er noch?
  rationale: Die Frage erkundigt sich knapp danach, ob Ben-Hadad weiterhin am Leben ist.
- source_word: אָחִי הוּא
  choice: Er ist mein Bruder
  rationale: Die direkte Wiedergabe erhält sowohl das Verwandtschaftsbild als auch seine im Kontext mögliche politische Bedeutung, ohne diese festzulegen.
theological_decisions:
- issue: Bedeutung von „Bruder“ in Ahabs Antwort
  choice: 'Die Verwandtschaftsbezeichnung wird wörtlich beibehalten: „Er ist mein Bruder.“'
  alternative: „Er ist mein Verbündeter“ oder „Er ist mir wie ein Bruder“
  rationale: אָחִי ist die gewöhnliche Bezeichnung für „mein Bruder“. Im Zusammenhang kann sie politische oder bündnishafte Verbundenheit ausdrücken, doch der Text erklärt sie nicht ausdrücklich so. Die wörtliche Wiedergabe bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erzählerisch klarer Satzführung. Konkrete Zeichen der Erniedrigung werden ohne zusätzliche Deutung wiedergegeben; die diplomatische Rede bleibt erkennbar.
