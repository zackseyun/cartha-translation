  text: וַ/יִּגַּ֤שׁ הַ/נָּבִיא֙ אֶל מֶ֣לֶךְ יִשְׂרָאֵ֔ל וַ/יֹּ֤אמֶר ל/וֹ֙ לֵ֣ךְ הִתְחַזַּ֔ק וְ/דַ֥ע וּ/רְאֵ֖ה אֵ֣ת אֲשֶֽׁר תַּעֲשֶׂ֑ה כִּ֚י לִ/תְשׁוּבַ֣ת הַ/שָּׁנָ֔ה מֶ֥לֶךְ אֲרָ֖ם עֹלֶ֥ה עָלֶֽי/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/022.yaml
  text: Then the prophet came near to the king of Israel and said to him[a], “Go, strengthen yourself, and know and see what you should do[c][b], because at the turn of the year the king of Aram will come up against you.”
translation:
  language: de
  text: 'Dann trat der Prophet an den König von Israel heran und sagte zu ihm: »Geh, stärke dich und bedenke wohl, was du tun sollst,[a] denn wenn das Jahr sich wendet,[b] wird der König von Aram[c] gegen dich heraufziehen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »was du tun wirst«.'
    reason: Die hebräische Form ist wörtlich futurisch, kann hier aber ausdrücken, was der König zur Vorbereitung tun soll.
  - marker: b
    text: 'Die hebräische Wendung bezeichnet die Wiederkehr beziehungsweise Wende des Jahres, oft die Jahreszeit, in der Feldzüge wieder aufgenommen wurden; sinngemäß: »im nächsten Frühjahr«.'
    reason: Erläutert den kulturellen und zeitlichen Hintergrund des hebräischen Idioms, ohne ihn im Haupttext festzulegen.
  - marker: c
    text: 'Traditionell: »der König von Syrien«; im Hebräischen steht »Aram«.'
    reason: Dokumentiert die verbreitete traditionelle Wiedergabe des Ortsnamens.
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: trat … zu
  rationale: Gibt das konkrete Herantreten in natürlichem, gehobenem deutschem Erzählstil wieder.
- source_word: הִתְחַזַּק
  choice: rüste dich
  rationale: Der reflexive Imperativ fordert hier angesichts des nächsten Feldzugs nicht nur Mut, sondern tätige Stärkung und Vorbereitung; „rüste dich“ bringt dies idiomatisch zum Ausdruck.
- source_word: וְדַע וּרְאֵה
  choice: überlege genau
  rationale: Die wörtliche Paarung „erkenne und sieh“ bezeichnet hier eine sorgfältige Prüfung. Die deutsche Wendung bewahrt deren praktischen Nachdruck, ohne unnatürlich zu klingen.
- source_word: אֵת אֲשֶׁר תַּעֲשֶׂה
  choice: was du tun sollst
  rationale: Die Verbform ist formal futurisch („was du tun wirst“), hat im Zusammenhang der Aufforderung aber wahrscheinlich deliberativ-praktischen Sinn.
- source_word: לִתְשׁוּבַת הַשָּׁנָה
  choice: wenn das Jahr sich wendet
  rationale: Bewahrt das hebräische Zeitbild und klingt im Deutschen natürlicher als „bei der Rückkehr des Jahres“.
- source_word: מֶלֶךְ אֲרָם
  choice: der König von Aram
  rationale: Gibt den hebräischen Namen direkt wieder, statt ihn durch die traditionelle Bezeichnung „Syrien“ zu ersetzen.
- source_word: עֹלֶה עָלֶיךָ
  choice: wird … gegen dich heraufziehen
  rationale: Die militärische Wendung und das Bild des Hinaufziehens bleiben erhalten; das deutsche Futur vermittelt die im Partizip liegende bevorstehende Handlung.
