base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/019.yaml
  text: 'These went out from the city: the young men of the commanders of the provinces[a], and the army that was behind them.'
translation:
  language: de
  text: 'Diese gingen aus der Stadt hinaus: die jungen Männer der Obersten der Provinzen[a] und das Heer, das hinter ihnen herkam.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Diener/Begleiter der Obersten der Provinzen“. Das hebräische Wort kann sowohl junge Männer als auch persönliche Diener oder Begleiter bezeichnen; hier können beide Vorstellungen mitschwingen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Diese
  rationale: Das pluralische Demonstrativpronomen verweist auf die im vorigen Vers genannte Gruppe; die Konjunktion muss im Deutschen nicht eigens wiedergegeben werden.
- source_word: יָצְאוּ מִן הָעִיר
  choice: zogen aus der Stadt hinaus
  rationale: Gibt die Bewegung aus der Stadt natürlich und ohne den nicht ausdrücklich bezeichneten Zusatz eines militärischen Marschierens wieder.
- source_word: נַעֲרֵי
  choice: die jungen Männer
  rationale: נַעַר kann einen jungen Mann, Diener oder persönlichen Begleiter bezeichnen. Die Grundbedeutung bleibt im Haupttext erhalten; die kontextuell mögliche Funktionsbezeichnung steht in der Fußnote.
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: der Provinzobersten
  rationale: שַׂר bezeichnet einen Obersten, Führer oder Amtsträger; מְדִינוֹת sind Verwaltungsgebiete beziehungsweise Provinzen. Das deutsche Kompositum bildet die Zugehörigkeitskonstruktion knapp ab, ohne eine präzise militärische Amtsbezeichnung zu behaupten.
- source_word: וְהַחַיִל
  choice: und das Heer
  rationale: חַיִל bezeichnet hier die nachrückende Streitmacht; „Heer“ ist im erzählerischen und militärischen Zusammenhang klar und würdig.
- source_word: אֲשֶׁר אַחֲרֵיהֶם
  choice: das ihnen folgte
  rationale: Das Hebräische beschreibt die Streitmacht als hinter ihnen befindlich beziehungsweise nach ihnen kommend. „Ihnen folgte“ gibt diese räumlich-dynamische Beziehung im Deutschen natürlich wieder.
