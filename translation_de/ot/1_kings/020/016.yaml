  text: וַ/יֵּצְא֖וּ בַּֽ/צָּהֳרָ֑יִם וּ/בֶן הֲדַד֩ שֹׁתֶ֨ה שִׁכּ֜וֹר בַּ/סֻּכּ֗וֹת ה֧וּא וְ/הַ/מְּלָכִ֛ים שְׁלֹשִֽׁים וּ/שְׁנַ֥יִם מֶ֖לֶךְ עֹזֵ֥ר אֹתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/016.yaml
  text: They went out at noon[a], while Ben-hadad was drinking himself drunk in the booths, he and the thirty-two kings who were helping him.
translation:
  language: de
  text: Sie zogen am Mittag aus, während Ben-Hadad sich in den Hütten[a] betrank, er und die zweiunddreißig Könige, die ihm halfen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in den Schutzdächern“ oder „in den Pavillons“. Wörtlich steht im Hebräischen „in den Hütten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: Sie zogen … aus
  rationale: Das Qal-Wayyiqtol von יצא führt die Erzählung fort und bezeichnet hier im militärischen Zusammenhang das Hinausziehen aus der Stadt, ohne zusätzliche Färbung.
- source_word: בַּצָּהֳרָיִם
  choice: am Mittag
  rationale: Die Form bezeichnet die Tagesmitte; „am Mittag“ ist im modernen Standarddeutsch natürlich und präzise.
- source_word: וּבֶן הֲדַד
  choice: während Ben-Hadad
  rationale: Das Waw leitet hier sinnvoll einen gleichzeitigen Begleitumstand ein; „während“ macht diesen Zusammenhang im Deutschen deutlich.
- source_word: שֹׁתֶה שִׁכּוֹר
  choice: sich … betrank
  rationale: Das Partizip שֹׁתֶה bezeichnet einen andauernden Vorgang, während שִׁכּוֹר dessen Ergebniszustand ausdrückt. „Sich betrank“ gibt beides knapp und idiomatisch wieder, ohne ein nicht ausdrücklich genanntes Getränk hinzuzufügen.
- source_word: בַּסֻּכּוֹת
  choice: in den Hütten
  rationale: סֻכּוֹת bezeichnet einfache Hütten oder Schutzbauten. „Hütten“ bewahrt das konkrete hebräische Bild; mögliche kontextuelle Deutungen werden in der Fußnote genannt.
- source_word: הוּא וְהַמְּלָכִים
  choice: er und die … Könige
  rationale: Das ausdrücklich gesetzte Pronomen schließt Ben-Hadad zusammen mit den Königen ein und bleibt in der deutschen Formulierung sichtbar.
- source_word: שְׁלֹשִׁים וּשְׁנַיִם מֶלֶךְ
  choice: die zweiunddreißig Könige
  rationale: Die hebräische Verbindung aus Zahlwort und formal singularischem Nomen wird nach deutscher Grammatik mit dem Plural wiedergegeben.
- source_word: עֹזֵר אֹתוֹ
  choice: die ihm halfen
  rationale: Das Partizip von עזר bezeichnet die fortdauernde Unterstützung der Könige; der Relativsatz ist im Deutschen natürlich und wahrt den Bezug.
