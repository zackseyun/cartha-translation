  register: Modernes, würdiges Standarddeutsch. Die parallelen Aufforderungen bleiben knapp und nachdrücklich; die semantische Nähe zu Gehorsam beziehungsweise Zustimmung wird nicht konfessionell oder theologisch zugespitzt.
