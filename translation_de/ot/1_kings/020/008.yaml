  text: וַ/יֹּאמְר֥וּ אֵלָ֛י/ו כָּל הַ/זְּקֵנִ֖ים וְ/כָל הָ/עָ֑ם אַל תִּשְׁמַ֖ע וְ/ל֥וֹא תֹאבֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/008.yaml
  text: Then all the elders and all the people said to him[a], “Do not listen, and do not consent.”
translation:
  language: de
  text: 'Da sagten alle Ältesten und das ganze Volk zu ihm: „Hör nicht auf ihn und willige nicht ein.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Da sagten
  rationale: Das Wayyiqtol führt die Erzählung weiter; „Da“ gibt die zeitlich-folgernde Funktion in natürlichem Deutsch wieder.
- source_word: אֵלָיו
  choice: zu ihm
  rationale: Der hebräische Text verwendet ein Pronomen. Obwohl sich dieses im Zusammenhang auf den König bezieht, wird der Name nicht eingesetzt.
- source_word: כָּל הַזְּקֵנִים
  choice: alle Ältesten
  rationale: זְקֵנִים bezeichnet hier die führenden beziehungsweise beratenden Männer des Volkes, nicht lediglich Menschen hohen Alters.
- source_word: וְכָל הָעָם
  choice: und das ganze Volk
  rationale: עָם bezeichnet neben den Ältesten die breitere Gemeinschaft; „das ganze Volk“ ist die idiomatische deutsche Wiedergabe.
- source_word: אַל תִּשְׁמַע
  choice: Hör nicht auf ihn
  rationale: שׁמע kann hören, auf jemanden hören oder gehorchen bedeuten. „Auf ihn hören“ bewahrt im Deutschen die Spannung zwischen Anhören und Befolgen und ergänzt das aus dem Kontext erschließbare Objekt natürlich.
- source_word: וְלֹא תֹאבֶה
  choice: und willige nicht ein
  rationale: אבה bezeichnet Bereitwilligkeit oder Zustimmung. „Einwilligen“ passt zu der Reaktion auf eine politische Forderung und bleibt nahe an diesem Bedeutungsfeld.
theological_decisions: []
