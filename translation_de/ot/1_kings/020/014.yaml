source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אַחְאָב֙ בְּ/מִ֔י וַ/יֹּ֨אמֶר֙ כֹּֽה אָמַ֣ר יְהוָ֔ה בְּ/נַעֲרֵ֖י שָׂרֵ֣י הַ/מְּדִינ֑וֹת וַ/יֹּ֛אמֶר מִֽי יֶאְסֹ֥ר הַ/מִּלְחָמָ֖ה וַ/יֹּ֥אמֶר אָֽתָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/014.yaml
  text: 'And Ahab said[a], “By whom?” And he said, “Thus says Yahweh: By the young men of the provincial officials.” Then he said, “Who will begin the battle?” And he said, “You.”'
translation:
  language: de
  text: 'Und Ahab fragte: „Durch wen?“ Er antwortete: „So spricht Jahwe: Durch die jungen Männer[a] der Provinzbeamten.“ Da fragte Ahab: „Wer soll den Kampf eröffnen?“ Er antwortete: „Du.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Diener“ beziehungsweise „die Gefolgsleute der Provinzbeamten“. Das hebräische Wort kann sowohl junge Männer als auch Diener oder Begleiter im Dienst eines Amtsträgers bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִי
  choice: Durch wen?
  rationale: Die Präposition בְּ mit מִי fragt nach der Person, durch die Jahwe handeln wird. „Durch wen?“ gibt diese Mittel- bzw. Vermittlungsbedeutung knapp und natürlich wieder.
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Die geläufige deutsche Botenformel bewahrt den feierlichen prophetischen Ton; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: בְּנַעֲרֵי
  choice: durch die jungen Männer
  rationale: נַעַר kann sowohl einen jungen Mann als auch einen Diener, Begleiter oder Gefolgsmann bezeichnen. Die Grundbedeutung bleibt im Haupttext erhalten, während die mögliche dienstliche Funktion in der Fußnote genannt wird.
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: der Provinzbeamten
  rationale: שָׂרִים bezeichnet hier leitende Amtsträger, מְדִינוֹת administrative Bezirke oder Provinzen. „Provinzbeamte“ ist verständlich und legt keinen bestimmten militärischen oder erblichen Rang fest.
- source_word: מִי יֶאְסֹר הַמִּלְחָמָה
  choice: Wer soll den Kampf eröffnen?
  rationale: אָסַר bedeutet wörtlich „binden“, bezeichnet in dieser Verbindung aber idiomatisch das Einleiten oder Eröffnen des Kampfes. Die deutsche Formulierung gibt diesen Sinn natürlich wieder.
- source_word: אָתָּה
  choice: Du
  rationale: Das selbstständige Pronomen antwortet knapp und betont auf Ahabs Frage.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Abfolge von Frage und Antwort bleibt erhalten. Ahab wird im dritten Redeeinsatz erneut genannt, um die wechselnden Sprecher im Deutschen eindeutig zu kennzeichnen, ohne den Sinn zu erweitern.
