  text: וַ/יִּמְצָא֙ אִ֣ישׁ אַחֵ֔ר וַ/יֹּ֖אמֶר הַכֵּ֣י/נִי נָ֑א וַ/יַּכֵּ֥/הוּ הָ/אִ֖ישׁ הַכֵּ֥ה וּ/פָצֹֽעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/037.yaml
  text: Then he found another man and said[a], “Please strike me.” So the man struck him and wounded him.
translation:
  language: de
  text: 'Dann fand er einen anderen Mann und sagte: »Schlag mich bitte!« Da schlug der Mann ihn und verwundete ihn.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Hebräische wiederholt das Verb »schlagen« zur Verstärkung; wörtlich etwa: »Der Mann schlug ihn, schlug ihn und verwundete ihn.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצָא
  choice: Dann fand er
  rationale: Die Wayyiqtol-Form führt die Erzählung weiter; »Dann« gibt die zeitliche Abfolge im modernen Deutschen natürlich wieder.
- source_word: אִישׁ אַחֵר
  choice: einen anderen Mann
  rationale: אִישׁ bezeichnet hier einen einzelnen Mann, אַחֵר kennzeichnet ihn als einen weiteren beziehungsweise anderen Mann.
- source_word: הַכֵּינִי נָא
  choice: Schlag mich bitte!
  rationale: Der Imperativ von נכה mit Suffix der ersten Person Singular bedeutet »schlag mich«; נָא verleiht der Aufforderung einen bittenden Ton, der durch »bitte« wiedergegeben wird.
- source_word: וַיַּכֵּהוּ הָאִישׁ
  choice: Da schlug der Mann ihn
  rationale: Das Objektsuffix bezeichnet den zuvor sprechenden Mann; das ausdrückliche Subjekt הָאִישׁ ist »der Mann«. »Da« stellt den unmittelbaren Fortgang und die Reaktion auf die Bitte idiomatisch dar.
- source_word: הַכֵּה וּפָצֹעַ
  choice: und verwundete ihn
  rationale: Die hebräische Verbindung wiederholt das Schlagen und nennt dessen verletzende Wirkung. Im Haupttext wird sie natürlich und knapp wiedergegeben; die ungewöhnliche Wiederholung bleibt in der Fußnote sichtbar.
theological_decisions: []
translation_notes:
  register: Moderne, klare und zugleich würdevolle Erzählsprache. Die direkte Bitte bleibt knapp; die schwer nachzubildende hebräische Verbwiederholung wird nicht künstlich geglättet, sondern durch eine Fußnote offengelegt.
