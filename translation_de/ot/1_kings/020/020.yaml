  register: Moderne, würdige Erzählsprache. Kurze Hauptsätze bewahren das schnelle Tempo des Kampfberichts. „Aramäer“ vermeidet die im Deutschen unnatürliche Personifizierung des Landesnamens beim fliehenden Heer; „Aram“ bleibt im Königstitel stehen.
