source:
  edition: WLC
  text: וַ/יַּכּוּ֙ אִ֣ישׁ אִישׁ֔/וֹ וַ/יָּנֻ֣סוּ אֲרָ֔ם וַֽ/יִּרְדְּפֵ֖/ם יִשְׂרָאֵ֑ל וַ/יִּמָּלֵ֗ט בֶּן הֲדַד֙ מֶ֣לֶךְ אֲרָ֔ם עַל ס֖וּס וּ/פָרָשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/020.yaml
  text: And each man struck down his man[a], and Aram fled, and Israel pursued them[b]. But Ben-hadad king of Aram escaped on a horse with horsemen.
translation:
  language: de
  text: Da schlug jeder den Mann nieder, der ihm gegenüberstand[a]. Die Aramäer flohen, und Israel verfolgte sie. Ben-Hadad aber, der König von Aram, entkam auf einem Pferd zusammen mit Reitern[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Da schlugen sie, jeder seinen Mann.“ Gemeint ist jeweils der Gegner, der ihm gegenüberstand.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „entkam zu Pferd und mit Reitern“. Das Hebräische kann Ben-Hadad als beritten und von Reitern begleitet darstellen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: schlug ... nieder
  rationale: נכה bezeichnet im Kampfzusammenhang ein Niederschlagen oder Besiegen; „schlug nieder“ gibt die Wucht wieder, ohne ausdrücklich den Tod zu behaupten.
- source_word: אִישׁ אִישׁוֹ
  choice: jeder den Mann ..., der ihm gegenüberstand
  rationale: Die wörtliche Wendung „jeder seinen Mann“ meint hier den jeweiligen gegnerischen Kämpfer. Die Übersetzung macht den idiomatischen Sinn natürlich verständlich; die wörtliche Form bleibt in der Fußnote erhalten.
- source_word: אֲרָם
  choice: die Aramäer / Aram
  rationale: Beim fliehenden Heer wird der Volksname „die Aramäer“ natürlich wiedergegeben; im Königstitel bleibt der Landesname „Aram“ erhalten.
- source_word: וַיָּנֻסוּ
  choice: flohen
  rationale: Das Verb bezeichnet eine unmittelbare Flucht und passt zum militärischen Zusammenhang.
- source_word: וַיִּרְדְּפֵם
  choice: verfolgte sie
  rationale: רדף ist der übliche Ausdruck für militärisches Verfolgen.
- source_word: וַיִּמָּלֵט
  choice: entkam
  rationale: Im Zusammenhang bezeichnet das Verb die erfolgreiche Flucht aus der Gefahr, ohne eine ausdrücklich theologische Ursache anzugeben.
- source_word: בֶּן הֲדַד
  choice: Ben-Hadad
  rationale: Der Personenname wird in einer im Deutschen geläufigen Transliteration wiedergegeben.
- source_word: עַל סוּס
  choice: auf einem Pferd
  rationale: Die Übersetzung bildet das singularische סוּס direkt ab.
- source_word: וּפָרָשִׁים
  choice: zusammen mit Reitern
  rationale: פָרָשִׁים bezeichnet berittene Männer. „Zusammen mit“ deutet die syntaktische Verbindung als Begleitung, lässt die alternative Auffassung aber in der Fußnote erkennen.
theological_decisions: []
