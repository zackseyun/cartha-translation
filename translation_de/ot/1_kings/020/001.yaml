  variant: modern standard German
source:
  edition: WLC
  text: וּ/בֶן הֲדַ֣ד מֶֽלֶךְ אֲרָ֗ם קָבַץ֙ אֶת כָּל חֵיל֔/וֹ וּ/שְׁלֹשִׁ֨ים וּ/שְׁנַ֥יִם מֶ֛לֶךְ אִתּ֖/וֹ וְ/ס֣וּס וָ/רָ֑כֶב וַ/יַּ֗עַל וַ/יָּ֨צַר֙ עַל שֹׁ֣מְר֔וֹן וַ/יִּלָּ֖חֶם בָּֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/001.yaml
  text: Ben-hadad king of Aram gathered all his army[a], and thirty-two kings with him, and horses and chariots[b]; then he went up and besieged Samaria and fought against it.
translation:
  language: de
  text: Ben-Hadad, der König von Aram, zog sein ganzes Heer zusammen. Mit ihm waren zweiunddreißig Könige sowie Pferde und Streitwagen. Dann zog er hinauf, belagerte Samaria und kämpfte gegen die Stadt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבֶן הֲדַד
  choice: Ben-Hadad
  rationale: Der Personenname wird direkt aus dem Hebräischen wiedergegeben. Das einleitende וּ markiert hier den erzählerischen Anschluss und muss im Deutschen nicht eigens mit „und“ ausgedrückt werden.
- source_word: מֶלֶךְ אֲרָם
  choice: der König von Aram
  rationale: „Aram“ gibt den hebräischen Ortsnamen unmittelbar wieder; das traditionelle „Syrien“ würde eine spätere geografische Bezeichnung eintragen.
- source_word: קָבַץ אֶת כָּל חֵילוֹ
  choice: zog sein ganzes Heer zusammen
  rationale: קבץ bezeichnet das Sammeln oder Zusammenziehen; חַיִל meint hier die gesamte militärische Streitmacht.
- source_word: וּשְׁלֹשִׁים וּשְׁנַיִם מֶלֶךְ אִתּוֹ
  choice: Mit ihm waren zweiunddreißig Könige
  rationale: Die Formulierung gibt die Begleitung durch verbündete oder untergeordnete Könige klar wieder, ohne ihr genaues politisches Verhältnis näher zu bestimmen.
- source_word: וְסוּס וָרָכֶב
  choice: sowie Pferde und Streitwagen
  rationale: Die hebräischen Singularformen sind kollektisch gebraucht und werden im natürlichen Deutschen als Plurale wiedergegeben.
- source_word: וַיַּעַל
  choice: Dann zog er hinauf
  rationale: עלה bewahrt die räumliche Vorstellung des Hinaufziehens; „dann“ gibt die Erzählfolge des waw consecutivum wieder.
- source_word: וַיָּצַר עַל שֹׁמְרוֹן
  choice: belagerte Samaria
  rationale: צור על ist im militärischen Zusammenhang die übliche Wendung für das Belagern einer Stadt.
- source_word: וַיִּלָּחֶם בָּהּ
  choice: kämpfte gegen die Stadt
  rationale: לחם ב bedeutet, gegen jemanden oder etwas zu kämpfen. „Die Stadt“ macht den weiblichen Rückverweis auf Samaria im Deutschen eindeutig.
theological_decisions: []
