base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/036.yaml
  text: Then he said to him, “Because you have not listened to the voice of the LORD, look, when you depart from me, the lion will strike you down.” And when he departed from him, the lion found him and struck him down.
translation:
  language: de
  text: 'Da sagte er zu ihm: „Weil du nicht auf die Stimme des HERRN gehört hast: Siehe, wenn du von mir fortgehst, wird der Löwe dich niederstrecken.“ Als er von ihm fortgegangen war, fand ihn der Löwe und streckte ihn nieder.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמַעְתָּ בְּקוֹל
  choice: auf die Stimme … gehört hast
  rationale: Bewahrt die hebräische Wendung und bringt zugleich ihren Sinn des Hörens und Gehorchens im Deutschen natürlich zum Ausdruck.
- source_word: הִנְּךָ
  choice: sieh
  rationale: Gibt das aufmerksamkeitslenkende hebräische Signal wieder, ohne es zu einer bloßen Schlussfolgerung umzudeuten.
- source_word: הָאַרְיֵה
  choice: der Löwe
  rationale: Bewahrt den bestimmten Artikel des hebräischen Textes in beiden Vorkommen.
- source_word: הִכְּךָ / וַיַּכֵּהוּ
  choice: dich niederstrecken / streckte ihn nieder
  rationale: Gibt das Verb נכה in beiden Vorkommen konsistent und im Zusammenhang mit einem tödlichen Löwenangriff natürlich wieder.
- source_word: מֵאִתִּי / מֵאֶצְלוֹ
  choice: von mir fortgehst / von ihm fortgegangen war
  rationale: Unterscheidet die leicht verschiedenen hebräischen Präpositionalausdrücke nicht künstlich, da beide hier räumliche Entfernung bezeichnen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: HERR
  alternative: JHWH / Jahwe
  rationale: Folgt der etablierten deutschsprachigen Bibelkonvention; die Großschreibung kennzeichnet, dass im Hebräischen der Eigenname Gottes steht.
- issue: Gewissheit der angekündigten Folge
  choice: wird der Löwe dich niederstrecken
  alternative: möge der Löwe dich niederstrecken
  rationale: Der Kontext und die anschließende Erfüllung weisen auf eine prophetische Ankündigung hin, nicht auf einen Wunsch oder Fluch.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und eindringlich; die Wiederholung von „der Löwe“ und „niederstrecken“ spiegelt die enge Entsprechung zwischen Ankündigung und Erfüllung.
