  text: וַ/יֵּצֵא֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל וַ/יַּ֥ךְ אֶת הַ/סּ֖וּס וְ/אֶת הָ/רָ֑כֶב וְ/הִכָּ֥ה בַ/אֲרָ֖ם מַכָּ֥ה גְדוֹלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/021.yaml
  text: Then the king of Israel went out and struck the horses and the chariots[a], and inflicted a great blow on Aram.
translation:
  language: de
  text: Dann zog der König von Israel aus, schlug die Pferde und Streitwagen und versetzte Aram einen schweren Schlag.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Aramäern“. Hebräisch „Aram“ kann hier das Reich oder dessen Streitkräfte bezeichnen; wörtlich: „und schlug Aram einen großen Schlag“.'
    reason: Die Anmerkung erläutert die mögliche kollektive Bedeutung von „Aram“ und wahrt zugleich die hebräische Wendung „großer Schlag“.
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: zog … aus
  rationale: יצא bezeichnet hier im militärischen Erzählzusammenhang das Ausziehen des Königs, ohne die stärkere Präzisierung „marschierte“ einzutragen.
- source_word: וַיַּךְ אֶת הַסּוּס וְאֶת הָרָכֶב
  choice: schlug die Pferde und die Streitwagen
  rationale: נכה bleibt zunächst konkret als „schlug“ erhalten. Die morphologisch singularischen Bezeichnungen סוס und רכב werden kollektiv verstanden; „Pferde“ und „Streitwagen“ sind im Deutschen natürlich.
- source_word: בַאֲרָם
  choice: Aram
  rationale: Der hebräische Eigenname wird als „Aram“ wiedergegeben und nicht durch das traditionelle „Syrien“ ersetzt; gemeint sein können das Reich oder seine Streitkräfte.
- source_word: מַכָּה גְדוֹלָה
  choice: eine schwere Niederlage
  rationale: Wörtlich bezeichnet die Wendung einen „großen Schlag“. Im militärischen Zusammenhang gibt „schwere Niederlage“ die idiomatische Bedeutung natürlich wieder, ohne ausdrücklich ein Blutbad zu behaupten.
