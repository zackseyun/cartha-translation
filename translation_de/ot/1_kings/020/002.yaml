  text: And he sent messengers into the city[a], to Ahab king of Israel.
translation:
  language: de
  text: Und er schickte Boten in die Stadt[a] zu Ahab, dem König von Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zur Stadt“. Die hebräische Form von „Stadt“ trägt eine Richtungsendung und bezeichnet eine Bewegung auf die Stadt zu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Und er schickte
  rationale: Das Wayyiqtol führt die Erzählung mit einer vergangenen Handlung fort. „Und er schickte“ bewahrt diese Anschluss- und Erzählfunktion in natürlichem Deutsch.
- source_word: מַלְאָכִים
  choice: Boten
  rationale: Im politischen und militärischen Zusammenhang sind menschliche Überbringer einer Botschaft gemeint, nicht himmlische Wesen.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition bezeichnet hier das Ziel beziehungsweise den Empfänger der Sendung.
- source_word: אַחְאָב
  choice: Ahab
  rationale: Der Personenname wird nach der etablierten deutschen Bibeltradition wiedergegeben.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: dem König von Israel
  rationale: Die Konstruktverbindung bezeichnet Ahabs Amt. Im Deutschen ist die Apposition mit bestimmtem Artikel und angeglichenem Kasus natürlich und eindeutig.
- source_word: הָעִירָה
  choice: in die Stadt
  rationale: Das lokale He bezeichnet eine Bewegung zur Stadt hin. „In die Stadt“ gibt die Zielrichtung idiomatisch wieder, ohne mehr Präzision vorzutäuschen, als die Form zwingend verlangt.
