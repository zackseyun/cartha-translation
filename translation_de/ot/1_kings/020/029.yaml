  text: וַֽ/יַּחֲנ֧וּ אֵ֦לֶּה נֹ֥כַח אֵ֖לֶּה שִׁבְעַ֣ת יָמִ֑ים וַ/יְהִ֣י בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֗י וַ/תִּקְרַב֙ הַ/מִּלְחָמָ֔ה וַ/יַּכּ֨וּ בְנֵֽי יִשְׂרָאֵ֧ל אֶת אֲרָ֛ם מֵאָה אֶ֥לֶף רַגְלִ֖י בְּ/י֥וֹם אֶחָֽד׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/029.yaml
  text: And these camped opposite those for seven days[a]. Then on the seventh day the battle drew near[c][b], and the sons of Israel struck down Aram—one hundred thousand foot soldiers in one day.
translation:
  language: de
  text: Sieben Tage lang lagerten die einen den anderen gegenüber. Am siebten Tag kam es zur Schlacht, und die Israeliten[a] schlugen von Aram[b] hunderttausend Fußsoldaten[c] an einem Tag nieder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Söhne Israels“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Aramäer“. „Aram“ kann hier das aramäische Reich, sein Volk oder sein Heer bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Fußvolk“ oder „Infanterie“. Das hebräische Wort bezeichnet Truppen, die zu Fuß kämpfen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲנוּ
  choice: lagerten
  rationale: Das Verb חנה bezeichnet das Aufschlagen bzw. Beziehen eines Lagers; „lagerten“ ist im Deutschen natürlich und dem militärischen Zusammenhang angemessen.
- source_word: אֵלֶּה נֹכַח אֵלֶּה
  choice: die einen den anderen gegenüber
  rationale: Die Formulierung bewahrt den knappen Gegensatz der beiden Heere und gibt נֹכַח räumlich als „gegenüber“ wieder.
- source_word: שִׁבְעַת יָמִים
  choice: Sieben Tage lang
  rationale: Diese idiomatische deutsche Zeitangabe gibt die Dauer präzise wieder.
- source_word: וַיְהִי בַּיּוֹם הַשְּׁבִיעִי
  choice: Am siebten Tag
  rationale: Die hebräische Erzählungsformel wird ohne altertümliche Füllformel natürlich wiedergegeben; die zeitliche Angabe bleibt vollständig erhalten.
- source_word: וַתִּקְרַב הַמִּלְחָמָה
  choice: kam es zur Schlacht
  rationale: קרב bedeutet wörtlich „sich nähern“. In Verbindung mit „Schlacht/Krieg“ bezeichnet die Wendung hier den Beginn des Kampfgeschehens; „kam es zur Schlacht“ bildet dieses Idiom natürlich ab, ohne einen zusätzlichen Siegerfolg vorwegzunehmen.
- source_word: וַיַּכּוּ
  choice: schlugen ... nieder
  rationale: נכה ist ein weiter militärischer Ausdruck für schlagen bzw. vernichtend treffen. „Niederschlagen“ wahrt die martialische Stärke, ohne ausdrücklich mehr als den Kontext festzulegen.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die wörtliche männliche Kollektivbezeichnung bleibt erhalten und bezeichnet hier Israels kämpfende Truppe; die geläufigere Wiedergabe „Israeliten“ wird in einer Fußnote genannt.
- source_word: אֲרָם
  choice: Aram
  rationale: Der hebräische Eigenname wird beibehalten; er kann in diesem Zusammenhang zugleich für das aramäische Reich bzw. dessen Volk oder Heer stehen.
- source_word: מֵאָה אֶלֶף
  choice: hunderttausend
  rationale: Direkte Wiedergabe der Kardinalzahl.
- source_word: רַגְלִי
  choice: Fußsoldaten
  rationale: Der Ausdruck bezeichnet im militärischen Zusammenhang Kämpfer zu Fuß; „Fußsoldaten“ ist transparent und allgemein verständlich.
- source_word: בְּיוֹם אֶחָד
  choice: an einem einzigen Tag
  rationale: „Einzigen“ verdeutlicht idiomatisch die im Hebräischen betonte kurze Zeitspanne, ohne den Sinn zu erweitern.
theological_decisions:
- issue: Wiedergabe von בְנֵי יִשְׂרָאֵל als männliche Kollektivbezeichnung
  choice: die Söhne Israels
  alternative: die Israeliten; das Volk Israel
  rationale: Der Ausgangstext verwendet ausdrücklich die maskuline Konstruktion „Söhne Israels“. Im militärischen Erzählzusammenhang verweist sie auf Israels kämpfende Männer; die wörtliche Form bewahrt diese Quellenformulierung.
- issue: Wiedergabe von אֲרָם als Eigenname oder Volksbezeichnung
  choice: Aram
  alternative: die Aramäer; das aramäische Heer
  rationale: Der Ausgangstext nennt den Eigennamen אֲרָם. „Aram“ wahrt diese Form und lässt die echte metonymische Offenheit zwischen Land, Volk und Heer bestehen; die Fußnote erläutert die mögliche deutsche Auflösung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper erzählerischer Syntax. Die erste Satzhälfte wahrt die zugespitzte Gegenüberstellung der beiden Heere; unnötig altertümliche Formeln werden vermieden. Alle textkritisch bzw. lexikalisch relevanten Alternativen stehen direkt am zugehörigen Ausdruck.
