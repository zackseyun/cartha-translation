base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/025.yaml
  text: And you, muster for yourself an army like the army that fell from you, and horse for horse and chariot for chariot; then let us fight against them on the plain. Surely we will be stronger than they are.” So he listened to their voice and did so.
translation:
  language: de
  text: Du aber stell dir ein Heer auf wie das Heer, das du verloren hast, Pferd für Pferd und Streitwagen für Streitwagen. Dann wollen wir in der Ebene gegen sie kämpfen. Wir werden ihnen gewiss überlegen sein.« Er hörte auf ihren Rat und machte es so.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִמְנֶה לְךָ חַיִל
  choice: stell dir ein Heer auf
  rationale: תמנה bezeichnet hier das Aufstellen beziehungsweise Bereitstellen einer entsprechenden Streitmacht; die idiomatische deutsche Wendung gibt den militärischen Kontext natürlich wieder.
- source_word: הַחַיִל הַנֹּפֵל מֵאוֹתָךְ
  choice: das Heer, das du verloren hast
  rationale: Wörtlich ist es das Heer, das 'von dir gefallen' ist. Gemeint sind die in der Niederlage ausgefallenen Truppen; 'verloren hast' ist im Deutschen klar und bewahrt den Sinn.
- source_word: וְסוּס כַּסּוּס וְרֶכֶב כָּרֶכֶב
  choice: Pferd für Pferd und Wagen für Wagen
  rationale: Die knappe proportionale Formulierung des Hebräischen wird formal und idiomatisch beibehalten.
- source_word: בַּמִּישׁוֹר
  choice: in der Ebene
  rationale: מישור bezeichnet hier flaches, offenes Gelände im Gegensatz zum Bergland.
- source_word: אִם לֹא נֶחֱזַק מֵהֶם
  choice: Dort werden wir ihnen gewiss überlegen sein
  rationale: Die Schwur- beziehungsweise Beteuerungsformel אם לא wird als starke Gewissheit wiedergegeben; חזק מן meint im Kampf stärker beziehungsweise überlegen sein.
- source_word: וַיִּשְׁמַע לְקֹלָם
  choice: Er hörte auf ihren Rat
  rationale: Die Wendung bedeutet hier nicht bloß akustisches Hören, sondern das Befolgen ihrer Empfehlung.
