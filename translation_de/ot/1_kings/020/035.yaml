  text: וְ/אִ֨ישׁ אֶחָ֜ד מִ/בְּנֵ֣י הַ/נְּבִיאִ֗ים אָמַ֧ר אֶל רֵעֵ֛/הוּ בִּ/דְבַ֥ר יְהוָ֖ה הַכֵּ֣י/נִי נָ֑א וַ/יְמָאֵ֥ן הָ/אִ֖ישׁ לְ/הַכֹּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/035.yaml
  text: A certain man from the sons of the prophets said to his companion by the word of Yahweh[b][a], “Please strike me.” But the man refused to strike him.
translation:
  language: de
  text: 'Einer von den Prophetensöhnen[a] sagte auf das Wort Jahwes hin[b] zu seinem Gefährten: »Schlag mich bitte!« Doch der Mann weigerte sich, ihn zu schlagen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »von den Söhnen der Propheten«. Gemeint sind wohl Angehörige einer prophetischen Gemeinschaft, möglicherweise Schüler der Propheten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »durch das Wort Jahwes«; sinngemäß auch: »auf Befehl Jahwes«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֶחָד
  choice: Ein Mann
  rationale: Die hebräische Erzählungsformel führt eine einzelne, zunächst nicht näher bestimmte Person ein. Im Deutschen ist »Ein Mann« natürlich und ausreichend; das anknüpfende וְ muss nicht eigens mit »und« wiedergegeben werden.
- source_word: מִבְּנֵי הַנְּבִיאִים
  choice: aus dem Kreis der Prophetenschüler
  rationale: Wörtlich steht »von den Söhnen der Propheten«. Die feste Bezeichnung meint wahrscheinlich Angehörige einer prophetischen Gemeinschaft; »Prophetenschüler« vermittelt dies verständlich, während die Fußnote die Bildform und weitere Deutungsmöglichkeiten bewahrt.
- source_word: רֵעֵהוּ
  choice: seinem Gefährten
  rationale: רֵעַ bezeichnet hier einen Gefährten oder Mitmenschen, ohne zwingend die persönliche Nähe von »Freund« auszudrücken.
- source_word: בִּדְבַר יְהוָה
  choice: auf das Wort Jahwes hin
  rationale: Die Wendung bezeichnet das Wort Jahwes als Anlass und Vollmacht der Aufforderung. Die Formulierung wahrt den hebräischen Wortlaut, ohne sie ausdrücklich und ausschließlich als »Befehl« auszulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt. »Jahwe« ist die im Deutschen geläufige Form.
- source_word: הַכֵּינִי נָא
  choice: Schlag mich bitte!
  rationale: נכה bedeutet hier »schlagen«; dass die Schläge eine Verletzung bewirken sollen, wird erst im Fortgang deutlich. נָא wird durch »bitte« wiedergegeben.
- source_word: וַיְמָאֵן
  choice: weigerte sich
  rationale: Das Verb drückt eine klare Weigerung aus, nicht bloß Zögern oder Unwillen.
- source_word: לְהַכֹּתוֹ
  choice: ihn zu schlagen
  rationale: Die Wiederholung von »schlagen« entspricht der Wiederaufnahme desselben hebräischen Verbs und vermeidet, das Ergebnis als Verwundung vorwegzunehmen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Tetragrammaton ausdrücklich. Die Wiedergabe als »Jahwe« bewahrt den persönlichen Gottesnamen, statt ihn durch den traditionellen Titel »der HERR« zu ersetzen.
- issue: Soziale Bedeutung von בְּנֵי הַנְּבִיאִים
  choice: Prophetenschüler
  alternative: Prophetensöhne / Angehörige einer Prophetengemeinschaft
  rationale: Die Wendung bezeichnet wahrscheinlich eine organisierte prophetische Gemeinschaft. Die verständliche Haupttextfassung legt weder biologische Abstammung noch eine genau bekannte institutionelle Struktur fest; die echte Bedeutungsbreite wird in der Fußnote offengelegt.
- issue: Kraft von בִּדְבַר יְהוָה
  choice: auf das Wort Jahwes hin
  alternative: auf Befehl Jahwes
  rationale: Die Formulierung lässt offen, ob der Akzent auf prophetischer Offenbarung, Beauftragung oder ausdrücklichem Befehl liegt, und vermeidet daher eine unnötige theologische Präzisierung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzführung ist erzählerisch klar; »Gefährte« und »auf das Wort Jahwes hin« bewahren den leicht gehobenen biblischen Ton. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Wendungen.
