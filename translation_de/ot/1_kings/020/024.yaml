  text: וְ/אֶת הַ/דָּבָ֥ר הַ/זֶּ֖ה עֲשֵׂ֑ה הָסֵ֤ר הַ/מְּלָכִים֙ אִ֣ישׁ מִ/מְּקֹמ֔/וֹ וְ/שִׂ֥ים פַּח֖וֹת תַּחְתֵּי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/024.yaml
  text: 'And do this thing: remove the kings[a], each from his place, and put governors in their place.'
translation:
  language: de
  text: 'Und tu Folgendes: Entferne die Könige, jeden von seinem Platz, und setze an ihrer Stelle Statthalter[a] ein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Provinzstatthalter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת הַדָּבָר הַזֶּה עֲשֵׂה
  choice: Und tu Folgendes
  rationale: Die vorangestellte Objektphrase mit dem Imperativ wird in natürlichem Deutsch als einleitende Handlungsanweisung wiedergegeben. „Folgendes“ vermittelt den Sinn von דָּבָר als Sache oder Maßnahme, ohne unnötig wörtlich „dieses Ding“ zu sagen.
- source_word: הָסֵר
  choice: Entferne
  rationale: Der Hifil-Imperativ bezeichnet das Veranlassen einer Entfernung. „Entferne“ lässt offen, ob die Könige vollständig abgesetzt oder lediglich ihrer jeweiligen Stellung im Feldzug enthoben werden.
- source_word: הַמְּלָכִים אִישׁ מִמְּקֹמוֹ
  choice: die Könige, jeden von seinem Posten
  rationale: אִישׁ hat nach dem Plural distributive Bedeutung. „Posten“ erfasst hier die kontextuelle Bedeutung von מָקוֹם als zugewiesene Stellung oder Funktion besser als das räumlich enger wirkende „Ort“.
- source_word: וְשִׂים
  choice: und setze … ein
  rationale: שים bedeutet grundsätzlich „setzen/stellen“; bei der Besetzung eines Amtes ist „einsetzen“ die natürliche deutsche Entsprechung.
- source_word: פַּחוֹת
  choice: Statthalter
  rationale: Das Wort bezeichnet eingesetzte Verwaltungsbeamte beziehungsweise Provinzstatthalter. „Statthalter“ wahrt den administrativen Rang, ohne den Begriff auf eine rein militärische Funktion zu verengen.
- source_word: תַּחְתֵּיהֶם
  choice: an ihrer Stelle
  rationale: Die Wendung bezeichnet hier die Ersetzung der Könige durch andere Amtsträger. „An ihrer Stelle“ gibt dieses Verhältnis idiomatisch und eindeutig wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Befehlsform und die distributive Formulierung des Hebräischen bleiben erhalten; „Posten“ und „einsetzen“ machen den militärisch-administrativen Zusammenhang verständlich, ohne die Art der Absetzung näher festzulegen.
