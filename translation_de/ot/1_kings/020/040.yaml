base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/040.yaml
  text: And as your servant was busy here and there[a], he was gone. Then the king of Israel said to him, “So shall your judgment be[c][b]; you yourself have decided it.”
translation:
  language: de
  text: 'Während dein Diener hier und da beschäftigt war[a], war er nicht mehr da[b]. Da sagte der König von Israel zu ihm: »So lautet dein Urteil[c]; du selbst hast es gefällt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dies und das tat«. Die hebräische Wendung bezeichnet, dass jemand mit verschiedenen Dingen oder in verschiedene Richtungen beschäftigt ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »und er war nicht«, das heißt, der bewachte Mann war nicht mehr da.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »So ist dein Urteil« oder »dein Rechtsspruch«. Der König wendet den vom Sprecher selbst genannten Maßstab gegen ihn an.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדְּךָ
  choice: dein Diener
  rationale: Die ehrerbietige Selbstbezeichnung gegenüber dem König wird im Deutschen natürlich und sozial angemessen mit »dein Diener« wiedergegeben; »Sklave« wäre hier zu eng.
- source_word: עֹשֵׂה הֵנָּה וָהֵנָּה
  choice: hier und da beschäftigt war
  rationale: Die hebräische Wendung bezeichnet eine Beschäftigung in verschiedenen Richtungen oder mit verschiedenen Dingen. Die deutsche Formulierung bewahrt sowohl das Bild als auch den Sinn der Ablenkung.
- source_word: וְהוּא אֵינֶנּוּ
  choice: war der Mann verschwunden
  rationale: Wörtlich heißt es »und er war nicht«. Im Zusammenhang ist der Bewachte nicht mehr anwesend; »verschwunden« drückt dies idiomatisch aus, ohne ausdrücklich zu behaupten, wie er fortkam.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: der König von Israel
  rationale: Direkte und im Deutschen übliche Wiedergabe des Titels.
- source_word: כֵּן מִשְׁפָּטֶךָ
  choice: So lautet dein Urteil
  rationale: כֵּן leitet den richterlichen Schluss ein, während מִשְׁפָּט hier die geltende gerichtliche Entscheidung bezeichnet.
- source_word: אַתָּה חָרָצְתָּ
  choice: du selbst hast es gefällt
  rationale: Das ausdrückliche Pronomen trägt Nachdruck. Im gerichtlichen Zusammenhang ist »ein Urteil fällen« eine natürliche Wiedergabe von חרץ im Sinn von entscheiden oder festsetzen.
