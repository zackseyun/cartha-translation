source:
  edition: WLC
  text: וְ/עַבְדֵ֨י מֶֽלֶךְ אֲרָ֜ם אָמְר֣וּ אֵלָ֗י/ו אֱלֹהֵ֤י הָרִים֙ אֱלֹ֣הֵי/הֶ֔ם עַל כֵּ֖ן חָזְק֣וּ מִמֶּ֑/נּוּ וְ/אוּלָ֗ם נִלָּחֵ֤ם אִתָּ/ם֙ בַּ/מִּישׁ֔וֹר אִם לֹ֥א נֶחֱזַ֖ק מֵ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/023.yaml
  text: And the servants of the king of Aram said to him[a], “Their gods are gods of the hills; therefore they were stronger than we were. But if we fight against them on the plain, surely we will be stronger than they are.”
translation:
  language: de
  text: 'Die Diener des Königs von Aram sagten zu ihm: »Ihre Götter[a] sind Götter der Berge. Darum waren sie stärker als wir. Doch wenn wir in der Ebene gegen sie kämpfen, werden wir ganz gewiss stärker sein als sie.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ihr Gott ist ein Gott der Berge.« Die hebräischen Formen können auch vom einen Gott Israels gebraucht werden; hier gibt der Plural wahrscheinlich die polytheistische Redeweise der Aramäer wieder.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַבְדֵי
  choice: Diener
  rationale: Im Umfeld eines Königshofs kann das Wort Diener oder Amtsträger bezeichnen. »Diener« gibt den Ausdruck unmittelbar wieder, ohne ein bestimmtes Hofamt vorauszusetzen.
- source_word: אֲרָם
  choice: Aram
  rationale: Der historische Eigenname wird beibehalten und nicht durch die spätere Gebietsbezeichnung »Syrien« ersetzt.
- source_word: אֱלֹהֵי הָרִים / אֱלֹהֵיהֶם
  choice: Ihre Götter sind Götter der Berge
  rationale: Die Pluralwiedergabe bewahrt die polytheistische Sichtweise der aramäischen Sprecher und entspricht in diesem Zusammenhang am natürlichsten den hebräischen Formen. »Götter der Berge« erhält zudem die Gegenüberstellung zur Ebene.
- source_word: עַל כֵּן
  choice: Darum
  rationale: Die knappe kausale Verknüpfung entspricht dem Hebräischen und klingt in modernem Deutsch natürlich und würdig.
- source_word: חָזְקוּ מִמֶּנּוּ
  choice: waren sie stärker als wir
  rationale: חזק mit מן bezeichnet hier vergleichende Stärke. Die Formulierung bewahrt zugleich die Wiederholung im letzten Satzteil.
- source_word: וְאוּלָם
  choice: Doch
  rationale: Kennzeichnet prägnant den Gegensatz zwischen der bisherigen Niederlage und der vorgeschlagenen neuen Kampfstrategie.
- source_word: נִלָּחֵם אִתָּם
  choice: wenn wir gegen sie kämpfen
  rationale: Im Zusammenhang drückt die Form den vorgeschlagenen Kampf unter einer bestimmten Bedingung aus.
- source_word: בַּמִּישׁוֹר
  choice: in der Ebene
  rationale: מִישׁוֹר bezeichnet ebenes Land und bildet den beabsichtigten Gegensatz zu den Bergen.
- source_word: אִם לֹא
  choice: ganz gewiss
  rationale: Die Wendung dient hier als nachdrückliche Beteuerung, nicht als gewöhnlicher verneinter Bedingungssatz.
- source_word: נֶחֱזַק מֵהֶם
  choice: werden wir stärker sein als sie
  rationale: Die vergleichende Wiedergabe entspricht der Konstruktion חזק mit מן und erhält die lexikalische Wiederholung des Verses.
theological_decisions:
- issue: Bezeichnung des Gottes Israels durch die Aramäer
  choice: Ihre Götter sind Götter der Berge
  alternative: Ihr Gott ist ein Gott der Berge
  rationale: Der Erzähler gibt hier die Rede heidnischer Aramäer wieder. Der Plural lässt deren polytheistisches Missverständnis stehen, statt ihre Aussage stillschweigend mit dem israelitischen Monotheismus in Einklang zu bringen. Da die hebräischen Formen auch singularisch auf den Gott Israels bezogen werden können, wird die Singularlesart in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp und selbstbewusst; die Wiederholung von »stärker« bildet die hebräische Wiederholung ab.
