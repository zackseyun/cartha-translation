base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/007.yaml
  text: Then the king of Israel called all the elders of the land and said, “Please know and see that this man is seeking trouble, for he sent to me for my wives, my sons, my silver, and my gold, and I did not withhold them from him.”
translation:
  language: de
  text: 'Da rief der König von Israel alle Ältesten des Landes zusammen und sagte: »Erkennt doch und seht, dass dieser Mann auf Unheil aus ist! Denn er hat von mir meine Frauen, meine Söhne, mein Silber und mein Gold gefordert, und ich habe sie ihm nicht vorenthalten.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָעָה
  choice: Unheil
  rationale: Das Wort bezeichnet hier schädliche, böse Absichten beziehungsweise drohendes Unheil. „Unheil“ bewahrt die moralische und praktische Bedeutungsbreite besser als das umgangssprachlichere „Ärger“.
- source_word: מְבַקֵּשׁ
  choice: sucht
  rationale: 'Die direkte Wiedergabe hält die zugespitzte Aussage des Königs fest: Ben-Hadad verfolgt bewusst weiteres Unheil.'
- source_word: שָׁלַח אֵלַי לְ־
  choice: hat … von mir gefordert
  rationale: Wörtlich steht „sandte zu mir wegen/nach“. Im Kontext einer Forderung ist „von mir gefordert“ natürlich und macht die Funktion der Botschaft deutlich, ohne ihren Inhalt zu erweitern.
- source_word: לֹא מָנַעְתִּי מִמֶּנּוּ
  choice: ich habe ihm nichts davon verweigert
  rationale: Die Negation mit dem Verb „vorenthalten/verweigern“ wird idiomatisch wiedergegeben; „davon“ bezieht sich klar auf die zuvor aufgezählten Personen und Güter.
theological_decisions:
- issue: Bedeutungsumfang von רָעָה
  choice: Unheil
  alternative: Böses / Ärger
  rationale: „Unheil“ lässt offen, ob vor allem die böse Absicht, die schädliche Tat oder deren Folgen gemeint sind, und löst die Spannung nicht unnötig auf.
translation_notes:
  register: Moderne, würdevolle Standardsprache. „Erkennt doch und seht“ bewahrt die doppelte hebräische Aufforderung, während „zusammen“ beim Rufen der Ältesten den deutschen Satz natürlich gestaltet.
