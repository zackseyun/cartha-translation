    rationale: Das hebräische Suffix bezieht sich auf die zuvor genannten Personen und Güter. Das Pluralpronomen „sie“ stellt diesen Bezug im Deutschen unmittelbarer her; „vorenthalten“ entspricht מָנַע idiomatisch.
