base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/027.yaml
  text: And the sons of Israel were mustered and supplied[a], and they went to meet them. The sons of Israel camped opposite them like two little flocks of goats[c][b], but Aram filled the land.
translation:
  language: de
  text: Die Israeliten wurden gemustert und mit Vorräten versorgt[a]; dann zogen sie ihnen entgegen. Die Israeliten lagerten ihnen gegenüber wie zwei kleine Ziegenherden[b], während die Aramäer das Land füllten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wurden gemustert und verproviantiert“. Das Verb meint wahrscheinlich, dass sie für den Feldzug mit dem Nötigen versorgt wurden.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „wie zwei חֲשִׂפֵי von Ziegen“. Die genaue Bedeutung des seltenen Wortes ist unsicher; die Wendung betont offenbar den Gegensatz zwischen der kleinen israelitischen Aufstellung und dem gewaltigen aramäischen Heer.'
    reason: cultural_note
lexical_decisions:
- source_word: הָתְפָּקְדוּ
  choice: wurden gemustert
  rationale: Die Form von פקד bezeichnet hier im militärischen Zusammenhang das Erfassen und Aufstellen der Streitkräfte; „gemustert“ gibt dies knapp und sachgerecht wieder.
- source_word: וְכָלְכְּלוּ
  choice: mit Vorräten versorgt
  rationale: כלכל bezeichnet hier wahrscheinlich die Versorgung für den Feldzug. Die Formulierung ist im Deutschen natürlicher und genauer als das allgemeinere „versorgt“.
- source_word: לִקְרָאתָם
  choice: zogen sie ihnen entgegen
  rationale: Die Wendung bezeichnet das Entgegengehen zu einer Begegnung, hier im militärischen Sinn, ohne dass „angreifen“ ausdrücklich gesagt wird.
- source_word: נֶגְדָּם
  choice: ihnen gegenüber
  rationale: נגד beschreibt die Stellung vor beziehungsweise gegenüber dem gegnerischen Heer.
- source_word: כִּשְׁנֵי חֲשִׂפֵי עִזִּים
  choice: wie zwei kleine Ziegenherden
  rationale: Das seltene חֲשִׂפֵי bezeichnet offenbar kleine, abgesonderte Gruppen. Die Wiedergabe bewahrt das Bild und macht den starken Größenkontrast verständlich.
- source_word: וַאֲרָם מִלְאוּ אֶת־הָאָרֶץ
  choice: während die Aramäer das Land füllten
  rationale: Der Kollektivname Aram steht für die aramäischen Truppen. „Während“ lässt den aus dem Zusammenhang entstehenden Kontrast hervortreten, ohne das einfache hebräische Waw zu stark adversativ festzulegen.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Wörtlich steht „die Söhne Israels“. Im modernen deutschen Erzählstil bezeichnet „die Israeliten“ dieselbe Volksgemeinschaft natürlich und eindeutig.
