  text: וַ/יֵּצְא֗וּ נַעֲרֵ֛י שָׂרֵ֥י הַ/מְּדִינ֖וֹת בָּ/רִֽאשֹׁנָ֑ה וַ/יִּשְׁלַ֣ח בֶּן הֲדַ֗ד וַ/יַּגִּ֤ידוּ ל/וֹ֙ לֵ/אמֹ֔ר אֲנָשִׁ֕ים יָצְא֖וּ מִ/שֹּׁמְרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/017.yaml
  text: Then the young men of the commanders of the provinces went out first[a], and Ben-hadad sent, and they reported to him, saying, “Men have come out from Samaria.”
translation:
  language: de
  text: 'Da zogen die jungen Männer der Provinzobersten zuerst aus. Ben-Hadad sandte Männer aus,[a] und sie meldeten ihm: »Männer sind aus Samaria herausgekommen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Hebräischen nur: »Ben-Hadad sandte«; wen er sandte, wird nicht ausdrücklich gesagt. Die folgende Meldung setzt jedoch voraus, dass er Personen ausgesandt hatte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲרֵי
  choice: die jungen Männer
  rationale: Bewahrt den Grundsinn von נַעַר; im militärischen Zusammenhang bezeichnet der Ausdruck die den Provinzobersten zugeordneten jungen Gefolgsleute oder Diener.
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: der Provinzobersten
  rationale: Gibt die Zugehörigkeit zu den Leitern der Verwaltungsbezirke knapp und idiomatisch wieder; שַׂר kann einen Obersten, Befehlshaber oder Amtsträger bezeichnen.
- source_word: בָּרִאשֹׁנָה
  choice: zuerst
  rationale: Drückt den zeitlichen beziehungsweise taktischen Vorrang aus, ohne die nicht ausdrücklich genannte Vorstellung einer ersten Angriffswelle einzutragen.
- source_word: וַיִּשְׁלַח
  choice: sandte Kundschafter aus
  rationale: Das hebräische Verb bedeutet wörtlich nur „sandte“ und lässt das Objekt unausgesprochen; aus der unmittelbar folgenden Meldung ergibt sich im militärischen Kontext, dass ausgesandte Beobachter gemeint sind.
- source_word: וַיַּגִּידוּ לוֹ לֵאמֹר
  choice: und sie meldeten ihm
  rationale: „Meldeten“ entspricht dem militärischen Berichtskontext. Das formelhafte לֵאמֹר muss vor direkter Rede im natürlichen Deutschen nicht eigens mit „indem sie sagten“ wiedergegeben werden.
- source_word: אֲנָשִׁים
  choice: Männer
  rationale: Entspricht der maskulinen Personenbezeichnung und passt zu den aus der Stadt kommenden Beteiligten im Kampfgeschehen.
- source_word: יָצְאוּ מִשֹּׁמְרוֹן
  choice: sind aus Samaria herausgekommen
  rationale: Gibt die vollendete Bewegung aus der Stadt und die Perspektive der Meldenden natürlich wieder.
- source_word: בֶּן הֲדַד
  choice: Ben-Hadad
  rationale: Im Deutschen gebräuchliche Umschrift des Eigennamens.
