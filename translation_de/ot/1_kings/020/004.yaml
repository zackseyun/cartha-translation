  text: וַ/יַּ֤עַן מֶֽלֶךְ יִשְׂרָאֵל֙ וַ/יֹּ֔אמֶר כִּ/דְבָרְ/ךָ֖ אֲדֹנִ֣/י הַ/מֶּ֑לֶךְ לְ/ךָ֥ אֲנִ֖י וְ/כָל אֲשֶׁר לִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/004.yaml
  text: The king of Israel answered and said[a], “According to your word, my lord the king, I am yours, and all that is mine.”
translation:
  language: de
  text: 'Der König von Israel antwortete: „Wie du sagst, mein Herr, der König: Ich gehöre dir, und alles, was ich habe, gehört dir.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: antwortete
  rationale: Die hebräische Doppelwendung aus ‚antworten‘ und ‚sagen‘ leitet eine Erwiderung ein. Im natürlichen modernen Deutsch genügt ‚antwortete‘, ohne einen Bedeutungsbestandteil zu verlieren.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: Der König von Israel
  rationale: Die transparente Wiedergabe der hebräischen Status- bzw. Zugehörigkeitsverbindung ist im deutschen Erzählstil idiomatisch.
- source_word: כִּדְבָרְךָ
  choice: Wie du gesagt hast
  rationale: Die Wendung gibt die Zustimmung zu den Worten des Gegenübers natürlich und zugleich respektvoll wieder; das wörtlichere ‚nach deinem Wort‘ wäre im heutigen Deutsch unnötig steif.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: mein Herr und König
  rationale: אֲדֹנִי ist hier eine höfische Anrede an einen menschlichen Herrscher. Die koordinierte deutsche Form bewahrt Anrede und Königstitel und vermeidet das missverständliche Kompositum ‚Herrenkönig‘.
- source_word: לְךָ אֲנִי
  choice: Ich gehöre dir
  rationale: Der Dativ mit selbstständigem Pronomen bezeichnet hier Besitz bzw. Unterordnung. ‚Ich gehöre dir‘ drückt die Unterwerfung eindeutiger aus als das im Deutschen möglicherweise nur solidarisch klingende ‚Ich bin dein‘.
- source_word: וְכָל אֲשֶׁר לִי
  choice: und alles, was ich habe
  rationale: Diese idiomatische Wiedergabe bewahrt den umfassenden Sinn der hebräischen Wendung und schließt materiellen Besitz wie alles ihm Zugehörige ein.
theological_decisions:
- issue: Bedeutung von אֲדֹנִי bei der Anrede eines menschlichen Königs
  choice: mein Herr
  alternative: mein Gebieter
  rationale: Der Bezug gilt Ben-Hadad als menschlichem Monarchen. Daher wird die höfische Unterordnung ausgedrückt, ohne einen göttlichen Titel oder eine konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die formelhafte Unterwerfung bleibt deutlich, während die im Deutschen schwerfällige Verdoppelung ‚antwortete und sagte‘ geglättet wird.
