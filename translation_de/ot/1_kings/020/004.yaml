  source_fidelity: 'Die Grundbedeutung ist zutreffend wiedergegeben: Israels König erklärt gegenüber Ben-Hadad seine Unterordnung und die Überlassung alles Eigenen. Die Anrede אֲדֹנִי הַמֶּלֶךְ ist jedoch appositionell („mein Herr, der König“) und nicht koordinierend im Sinn zweier gleichrangiger Anreden („mein Herr und König“).'
  naturalness: Der Satz ist grundsätzlich modernes, verständliches Standarddeutsch. „Wie du sagst“ entspricht der gegenwärtig geltenden, formelhaften Zustimmung unmittelbarer und idiomatischer als das Perfekt „Wie du gesagt hast“. Die Wiederaufnahme von „gehört dir“ macht die im Hebräischen elliptische zweite Hälfte im Deutschen glatt lesbar.
  terminology: „Mein Herr“ ist als höfische Anrede eines menschlichen Königs angemessen. „König“ wird als königlicher Titel beibehalten, ohne eine göttliche oder konfessionelle Bedeutung einzutragen.
