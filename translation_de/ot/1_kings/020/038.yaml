  text: So the prophet went and stood by the road for the king[a], and disguised himself with a bandage over his eyes.
translation:
  language: de
  text: Da ging der Prophet und stellte sich am Weg auf, um den König zu erwarten. Er verkleidete sich mit einer Binde über den Augen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „mit Asche über seinen Augen“. Das Wort kann im Zusammenhang auch eine Bedeckung oder Binde bezeichnen, die als Verkleidung dient.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Da ging
  rationale: Das narrative Wayyiqtol führt die Handlung fort; „Da“ gibt die Abfolge im Deutschen natürlich wieder.
- source_word: הַנָּבִיא
  choice: der Prophet
  rationale: Direkte Wiedergabe des bestimmten Substantivs.
- source_word: וַיַּעֲמֹד לַמֶּלֶךְ עַל הַדָּרֶךְ
  choice: stellte sich am Weg auf, um auf den König zu warten
  rationale: Die Formulierung macht die im Kontext erkennbare Absicht deutlich, den vorbeikommenden König abzufangen, ohne den Ort unnötig zu präzisieren.
- source_word: וַיִּתְחַפֵּשׂ
  choice: machte sich unkenntlich
  rationale: Das Hitpael bezeichnet hier das Verkleiden beziehungsweise Verbergen der eigenen Identität; die gewählte Formulierung klingt im modernen Deutsch natürlich.
- source_word: בָּאֲפֵר עַל עֵינָיו
  choice: indem er sich eine Binde über die Augen legte
  rationale: אֲפֵר wird gewöhnlich als „Asche“ verstanden, kann hier jedoch im Zusammenhang mit der Verkleidung eine Bedeckung oder Binde bezeichnen. Die weniger sichere lexikalische Entscheidung wird in der Fußnote offengelegt.
