translation_notes:
  register: Moderne, würdevolle Erzählsprache. »Streitwagen« ist im Deutschen eindeutiger als das allgemeine »Wagen«. Die etwas erklärende Formulierung »günstiges Zeichen« vermittelt im Haupttext die situationsbezogene Bedeutung, während die Fußnote den möglichen Bezug auf Vorzeichendeutung offenhält.
