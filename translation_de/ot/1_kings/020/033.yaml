base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/033.yaml
  text: The men were watching for an omen[a], and they quickly seized on it from him and said, “Ben-hadad is your brother.” And he said, “Come, take him.” Then Ben-hadad came out to him[c][b], and he had him come up into the chariot.
translation:
  language: de
  text: 'Die Männer hielten nach einem Vorzeichen[a] Ausschau. Sie beeilten sich und griffen seine Worte auf[b] und sagten: »Ben-Hadad ist dein Bruder.« Da sagte er: »Kommt und holt ihn.« Ben-Hadad kam zu ihm heraus, und Ahab ließ ihn zu sich auf den Streitwagen steigen[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »suchten nach einem Vorzeichen« beziehungsweise »deuteten es als Vorzeichen«. Das hebräische Verb kann das Suchen oder Deuten von Vorzeichen bezeichnen. Hier achteten die Männer offenbar auf ein für Ben-Hadad günstiges Signal in Ahabs Worten.'
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Wendung ist schwierig. Gemeint ist wohl, dass sie Ahabs Wort »Bruder« sofort aufgriffen und als günstiges Zugeständnis verstanden.
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Verb ist kausativ; Ahab veranlasste Ben-Hadad, auf den Streitwagen zu steigen.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְנַחֲשׁוּ
  choice: hielten Ausschau nach einem günstigen Zeichen
  rationale: Das Piel von נחשׁ kann das Deuten oder Suchen nach Vorzeichen bezeichnen. Im Zusammenhang achten die Männer auf ein für Ben-Hadad günstiges Signal in Ahabs Worten; die Formulierung bewahrt diesen Sinn, ohne eine förmliche Wahrsagehandlung zu unterstellen.
- source_word: וַיְמַהֲרוּ
  choice: Schnell
  rationale: Gibt das eilige Reagieren knapp und natürlich wieder.
- source_word: וַיַּחְלְטוּ הֲמִמֶּנּוּ
  choice: griffen sie seine Worte auf
  rationale: Die schwierige hebräische Wendung meint wahrscheinlich, dass die Männer Ahabs Bezeichnung »Bruder« sofort aufgriffen und als verbindliches Zugeständnis nutzten. Das im Hebräischen unausgesprochene Objekt wird aus dem Kontext als »seine Worte« ergänzt.
- source_word: אָחִיךָ
  choice: dein Bruder
  rationale: Die wörtliche Wiedergabe bewahrt die diplomatisch bedeutsame Anrede, auf welche die Männer sich berufen.
- source_word: בֹּאוּ קָחֻהוּ
  choice: Geht und holt ihn
  rationale: Im Kontext fordert Ahab die Männer auf, Ben-Hadad zu ihm zu bringen. Das graphisch mehrdeutige בֹּאוּ wird hier als Pluralimperativ »Geht« verstanden.
- source_word: וַיַּעֲלֵהוּ עַל הַמֶּרְכָּבָה
  choice: Ahab ließ ihn zu sich auf den Streitwagen steigen
  rationale: 'Die Hifil-Form ist kausativ: Ahab veranlasste Ben-Hadad hinaufzusteigen. »Zu sich« macht den im Zusammenhang klaren Bezug verständlich, ohne ein körperliches Hinaufheben anzudeuten.'
- source_word: הַמֶּרְכָּבָה
  choice: den Streitwagen
  rationale: Der bestimmte Artikel wird bewahrt; aus dem Kontext ist es Ahabs Streitwagen, doch ein Possessiv steht nicht ausdrücklich im Hebräischen.
