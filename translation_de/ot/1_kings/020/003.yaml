base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/003.yaml
  text: 'And he said to him[a], “Thus says Ben-hadad: Your silver and your gold are mine; your wives and your sons, the best, are mine.”'
translation:
  language: de
  text: 'Und er sagte zu ihm: »So spricht Ben-Hadad: Dein Silber und dein Gold gehören mir; deine Frauen und deine Söhne – die Besten[a] – gehören mir.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »deine Frauen und deine vorzüglichsten Söhne gehören mir.« Das hebräische Adjektiv kann hier »gut«, »die besten« oder »auserlesen« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ
  choice: Und er sagte zu ihm
  rationale: Gibt die übliche hebräische Erzählform mit אמר und indirektem Objekt transparent und natürlich wieder.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Bewahrt die formelhafte Einleitung einer übermittelten förmlichen Botschaft; das deutsche Präsens ist hier idiomatisch.
- source_word: בֶּן הֲדַד
  choice: Ben-Hadad
  rationale: Der Personenname wird in der im Deutschen üblichen Form transliteriert.
- source_word: כַּסְפְּךָ וּזְהָבְךָ
  choice: dein Silber und dein Gold
  rationale: Bewahrt die konkret genannten Wertgegenstände, statt Silber zu Geld zu verallgemeinern.
- source_word: לִי הוּא
  choice: gehören mir
  rationale: Gibt den Besitzanspruch auf das zusammengesetzte Subjekt in natürlichem Deutsch wieder.
- source_word: וְנָשֶׁיךָ
  choice: deine Frauen
  rationale: Im familiären Besitzkontext sind Ehefrauen gemeint; »Frauen« ist im Deutschen als possessive Familienbezeichnung natürlich.
- source_word: וּבָנֶיךָ
  choice: deine Söhne
  rationale: Bewahrt die spezifische Bedeutung männlicher Nachkommen.
- source_word: הַטּוֹבִים
  choice: die besten
  rationale: Der bestimmte attributive Ausdruck kann hier die Besten beziehungsweise Auserlesensten bezeichnen; die nachgestellte Form wahrt Wortfolge und Apposition.
- source_word: לִי הֵם
  choice: gehören mir
  rationale: Die Wiederholung bewahrt den nachdrücklichen parallelen Besitzanspruch.
