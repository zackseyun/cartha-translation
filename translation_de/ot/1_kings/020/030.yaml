  text: וַ/יָּנֻ֨סוּ הַ/נּוֹתָרִ֥ים אֲפֵקָ/ה֮ אֶל הָ/עִיר֒ וַ/תִּפֹּל֙ הַ/חוֹמָ֔ה עַל עֶשְׂרִ֨ים וְ/שִׁבְעָ֥ה אֶ֛לֶף אִ֖ישׁ הַ/נּוֹתָרִ֑ים וּ/בֶן הֲדַ֣ד נָ֔ס וַ/יָּבֹ֥א אֶל הָ/עִ֖יר חֶ֥דֶר בְּ/חָֽדֶר׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/030.yaml
  text: The survivors fled to Aphek[a], into the city, and the wall fell on twenty-seven thousand of the remaining men. Ben-hadad also fled and entered the city, into an inner room.
translation:
  language: de
  text: Die Überlebenden flohen nach Afek in die Stadt, und die Mauer fiel auf siebenundzwanzigtausend der übrigen Männer. Auch Ben-Hadad floh und ging in die Stadt, in eine innere Kammer[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „eine Kammer in einer Kammer“; gemeint sein kann auch die innerste Kammer.'
    reason: Die ungewöhnliche hebräische Wendung lässt offen, ob ein innerer Raum oder ausdrücklich der innerste Raum bezeichnet wird.
lexical_decisions:
- source_word: הַנּוֹתָרִים
  choice: die Überlebenden / die noch übrig waren
  rationale: Das Partizip bezeichnet im militärischen Zusammenhang diejenigen, die nach der Schlacht am Leben geblieben waren. Die zweite Wiedergabe variiert natürlich, bewahrt aber die Wiederholung des hebräischen Begriffs.
- source_word: אֲפֵקָה
  choice: nach Afek
  rationale: Das direktionale He bezeichnet die Bewegung nach Afek; der Ortsname wird in geläufiger deutscher Form wiedergegeben.
- source_word: וַתִּפֹּל הַחוֹמָה
  choice: Da stürzte die Mauer
  rationale: Der bestimmte Artikel wird beibehalten, ohne näher festzulegen, ob die ganze Stadtmauer oder ein Abschnitt davon gemeint ist. „Da“ stellt den erzählerischen Anschluss natürlich her.
- source_word: עַל עֶשְׂרִים וְשִׁבְעָה אֶלֶף אִישׁ
  choice: auf 27.000 der Männer
  rationale: עַל wird räumlich mit „auf“ wiedergegeben; אִישׁ bezeichnet hier im Kriegskontext Männer.
- source_word: וּבֶן הֲדַד נָס
  choice: Auch Ben-Hadad floh
  rationale: „Auch“ macht die parallele Flucht Ben-Hadads idiomatisch deutlich; „floh“ bewahrt die Verbindung zum gleichstämmigen Verb am Versanfang.
- source_word: חֶדֶר בְּחָדֶר
  choice: in eine innere Kammer
  rationale: Die knappe hebräische Wendung lautet wörtlich „eine Kammer in einer Kammer“ und bezeichnet wahrscheinlich einen besonders innen gelegenen, geschützten Raum. Die flüssige Wiedergabe vermeidet eine unnatürliche Festlegung; der Wortlaut steht in der Fußnote.
