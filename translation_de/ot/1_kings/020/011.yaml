  text: And the king of Israel answered and said[a], “Tell him, ‘Let not the one who girds on his armor boast like the one who takes it off.’”
translation:
  language: de
  text: 'Da antwortete der König von Israel: „Richtet ihm aus: ‚Wer die Rüstung anlegt, soll sich nicht rühmen wie einer, der sie ablegt.‘“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Nicht soll sich derjenige, der sich gürtet, rühmen wie derjenige, der löst.“ Die Kampfausrüstung ist im Hebräischen nicht ausdrücklich genannt, wird aber durch den militärischen Zusammenhang nahegelegt. Das Sprichwort stellt das Rüsten dem Ablegen der Ausrüstung gegenüber.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן מֶלֶךְ יִשְׂרָאֵל וַיֹּאמֶר
  choice: Da antwortete der König von Israel
  rationale: Die doppelte hebräische Redeformel ‚antwortete und sagte‘ wird im natürlichen modernen Deutsch zu ‚antwortete‘ zusammengezogen, ohne den Sinnverlust einer eigenständigen zweiten Aussage.
- source_word: דַּבְּרוּ
  choice: Richtet ihm aus
  rationale: Der Imperativ steht im Plural und richtet sich im Kontext an die Boten; ‚ihm‘ macht den aus dem Zusammenhang erschließbaren Empfänger deutlich.
- source_word: אַל יִתְהַלֵּל
  choice: soll sich nicht rühmen
  rationale: Gibt die verneinte Jussivform und die reflexive Bedeutung des Hitpael von הלל würdig und sprichwortartig wieder.
- source_word: חֹגֵר
  choice: wer die Rüstung anlegt
  rationale: Wörtlich bezeichnet das Partizip einen, der sich gürtet. Im militärischen Zusammenhang ist das Anlegen der Kampfausrüstung gemeint; ‚Rüstung‘ macht das implizite Objekt verständlich.
- source_word: כִּמְפַתֵּחַ
  choice: wie einer, der sie ablegt
  rationale: Das Partizip bezeichnet hier das Lösen oder Abschnallen im Gegensatz zum Gürten. Das Pronomen bezieht sich auf die ergänzte Rüstung; die Wendung wahrt den Gegensatz zwischen Beginn und erfolgreichem Ende des Kampfes.
