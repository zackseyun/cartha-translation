  variant: modern standard German
source:
  edition: WLC
  text: כִּ֣י אִם כָּ/עֵ֣ת מָחָ֗ר אֶשְׁלַ֤ח אֶת עֲבָדַ/י֙ אֵלֶ֔י/ךָ וְ/חִפְּשׂוּ֙ אֶת בֵּ֣יתְ/ךָ֔ וְ/אֵ֖ת בָּתֵּ֣י עֲבָדֶ֑י/ךָ וְ/הָיָה֙ כָּל מַחְמַ֣ד עֵינֶ֔י/ךָ יָשִׂ֥ימוּ בְ/יָדָ֖/ם וְ/לָקָֽחוּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/006.yaml
  text: No[a], but about this time tomorrow I will send my servants to you, and they will search your house and the houses of your servants; and whatever is desirable in your eyes[b], they will put into their hands and take away.
translation:
  language: de
  text: Nein, vielmehr werde ich morgen um diese Zeit meine Diener zu dir schicken. Sie werden dein Haus und die Häuser deiner Diener durchsuchen. Alles, was in deinen Augen kostbar ist,[a] werden sie an sich nehmen und wegtragen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alles, woran deine Augen Gefallen haben“, das heißt alles, was dir besonders wertvoll ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „werden sie in ihre Hand legen und nehmen“; gemeint ist, dass sie es beschlagnahmen und fortschaffen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Nein, vielmehr
  rationale: Die Verbindung korrigiert und verschärft im Zusammenhang die zuvor genannte Forderung. „Nein, vielmehr“ gibt diesen adversativen Nachdruck im Deutschen natürlich wieder.
- source_word: כָּעֵת מָחָר
  choice: morgen um diese Zeit
  rationale: Die idiomatische Zeitangabe bezeichnet ungefähr denselben Zeitpunkt am folgenden Tag; die gewählte Formulierung ist im modernen Deutsch geläufig.
- source_word: עֲבָדַי
  choice: meine Diener
  rationale: Gemeint sind hier Beauftragte oder Gefolgsleute des Königs. „Diener“ passt zum politischen Zusammenhang, ohne einen rechtlichen Sklavenstatus hervorzuheben.
- source_word: וְחִפְּשׂוּ
  choice: sie werden ... durchsuchen
  rationale: Das Verb bezeichnet ein gründliches Suchen oder Untersuchen. „Durchsuchen“ wahrt den Sinn, ohne die angedrohte Gewalt durch „plündern“ vorwegzunehmen.
- source_word: בֵּיתְךָ ... בָּתֵּי עֲבָדֶיךָ
  choice: dein Haus und die Häuser deiner Diener
  rationale: בַּיִת kann auch einen Palast bezeichnen; „Haus“ erhält jedoch die hebräische Parallele zu den Häusern der Diener und lässt die mögliche Bedeutungsweite bestehen.
- source_word: כָּל מַחְמַד עֵינֶיךָ
  choice: alles, was in deinen Augen kostbar ist
  rationale: Die Wendung bezeichnet alles, was jemand als begehrenswert, wertvoll oder erfreulich ansieht. Die Übersetzung bewahrt das Bild der Augen und bleibt gut verständlich.
- source_word: יָשִׂימוּ בְיָדָם וְלָקָחוּ
  choice: werden sie an sich nehmen und wegtragen
  rationale: Wörtlich wird das Kostbare „in ihre Hand“ gelegt und dann genommen. Die idiomatische deutsche Wiedergabe macht die Besitzergreifung und das Fortschaffen klar; eine Fußnote bewahrt die konkrete hebräische Ausdrucksweise.
