base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/026.yaml
  text: At the turn of the year[c][b][a], Ben-hadad mustered Aram and went up to Aphek for battle with Israel.
translation:
  language: de
  text: Als der Jahreslauf von Neuem begann[a], bot Ben-Hadad Aram[b] auf und zog hinauf nach Afek zum Kampf gegen Israel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »bei der Wiederkehr des Jahres«; gemeint ist, dass der Jahreszyklus wieder an diesen Punkt gelangte. Manche übersetzen: »im Frühling«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »die Aramäer«. »Aram« kann hier das Reich oder dessen Volk beziehungsweise Heer bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »mit Israel«; im Zusammenhang eines Kampfes ist gemeint: »gegen Israel«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִתְשׁוּבַת הַשָּׁנָה
  choice: als der Jahreslauf von Neuem begann
  rationale: Die Wendung bedeutet wörtlich etwa »bei der Wiederkehr des Jahres«. Die gewählte Formulierung gibt den wiederkehrenden Jahreszyklus verständlich wieder, ohne ihn im Haupttext ausdrücklich mit dem Frühling gleichzusetzen.
- source_word: וַיִּפְקֹד
  choice: bot … auf
  rationale: פקד bezeichnet hier im militärischen Zusammenhang das Mustern beziehungsweise Aufbieten von Streitkräften. »Aufbieten« ist im Deutschen präzise und idiomatisch.
- source_word: אֶת אֲרָם
  choice: Aram
  rationale: Der hebräische Text nennt Aram; im Zusammenhang sind damit das Reich beziehungsweise dessen Streitkräfte gemeint. Der Eigenname bleibt erhalten, statt durch die spätere Bezeichnung »Syrien« ersetzt zu werden.
- source_word: וַיַּעַל
  choice: zog hinauf
  rationale: Die Übersetzung bewahrt sowohl die Bewegung als auch die Aufwärtsrichtung von עלה und passt zugleich zu einem militärischen Zug.
- source_word: אֲפֵקָה
  choice: nach Afek
  rationale: Das Richtungs-he am Ortsnamen bezeichnet die Bewegung auf Afek zu; im Deutschen wird dies natürlich mit »nach Afek« ausgedrückt.
- source_word: לַמִּלְחָמָה
  choice: zum Kampf
  rationale: מלחמה kann Krieg oder Kampf bezeichnen. Im unmittelbaren Feldzugskontext ist »zum Kampf« knapp und treffend.
- source_word: עִם יִשְׂרָאֵל
  choice: gegen Israel
  rationale: עִם bedeutet wörtlich »mit«, bezeichnet in dieser Kampfverbindung jedoch den Gegner. »Gegen Israel« macht das Verhältnis im modernen Deutschen eindeutig; die wörtliche Form wird in der Fußnote dokumentiert.
