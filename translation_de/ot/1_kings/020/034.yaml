source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלָ֡י/ו הֶ/עָרִ֣ים אֲשֶׁר לָֽקַח אָבִ/י֩ מֵ/אֵ֨ת אָבִ֜י/ךָ אָשִׁ֗יב וְ֠/חוּצוֹת תָּשִׂ֨ים לְ/ךָ֤ בְ/דַמֶּ֨שֶׂק֙ כַּ/אֲשֶׁר שָׂ֤ם אָבִ/י֙ בְּ/שֹׁ֣מְר֔וֹן וַ/אֲנִ֖י בַּ/בְּרִ֣ית אֲשַׁלְּחֶ֑/ךָּ וַ/יִּכְרָת ל֥/וֹ בְרִ֖ית וַֽ/יְשַׁלְּחֵֽ/הוּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/034.yaml
  text: Then he said to him[a], “The cities that my father took from your father I will restore, and you may establish streets for yourself in Damascus, as my father established them in Samaria.” And I, in the treaty[c][b], will let you go.” So he made a treaty with him and let him go.
translation:
  language: de
  text: 'Da sagte er zu ihm: „Die Städte, die mein Vater deinem Vater abgenommen hat, werde ich zurückgeben. Du darfst dir in Damaskus Straßen[a] anlegen, wie mein Vater sie in Samaria angelegt hat.“ – „Und ich werde dich im Rahmen dieses Abkommens[b] ziehen lassen.“ Darauf schloss er mit ihm ein Abkommen[c] und ließ ihn ziehen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Straßen“ oder „offene Plätze“. Im Zusammenhang dieses Vertrags können damit auch vertraglich zugestandene Handelsstraßen, Märkte oder Stadtviertel gemeint sein.
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „mit diesem Bund“ oder „unter dieser Vereinbarung“. Das hebräische Wort kann „Bund“ bedeuten, bezeichnet hier aber ein politisches Abkommen.'
    reason: alternative_reading
  - marker: c
    text: Wörtlich steht hier die feste hebräische Wendung „einen Bund schneiden“, das heißt eine bindende Vereinbarung feierlich schließen.
    reason: cultural_note
lexical_decisions:
- source_word: הֶעָרִים
  choice: die Städte
  rationale: עִיר bezeichnet eine Stadt oder Ortschaft; im Zusammenhang territorialer Rückgabe zwischen Königen ist „Städte“ angemessen.
- source_word: לָקַח ... אָשִׁיב
  choice: abgenommen hat ... werde ich zurückgeben
  rationale: Die Verben bezeichnen den früheren Besitzentzug und dessen Umkehr. „Abgenommen“ lässt offen, ob Eroberung oder anderweitige Aneignung gemeint ist; „zurückgeben“ ist im Deutschen klar und natürlich.
- source_word: וְחוּצוֹת
  choice: Handelsbezirke
  rationale: חוּצוֹת bedeutet wörtlich Straßen oder offene Plätze, bezeichnet in diesem diplomatischen Zusammenhang aber wahrscheinlich städtische Bereiche mit wirtschaftlichen Rechten. Die konkrete Bildlichkeit und andere Möglichkeiten werden in der Fußnote bewahrt.
- source_word: תָּשִׂים לְךָ בְדַמֶּשֶׂק ... כַּאֲשֶׁר שָׂם אָבִי בְּשֹׁמְרוֹן
  choice: du darfst dir in Damaskus ... einrichten, wie mein Vater sie in Samaria eingerichtet hat
  rationale: שׂים bedeutet setzen, anlegen oder einrichten. „Einrichten“ passt zu anerkannten städtischen Handelsbezirken; „darfst“ bringt den gewährten Vertragsanspruch natürlich zum Ausdruck.
- source_word: בַּבְּרִית
  choice: aufgrund eines Abkommens
  rationale: בְּרִית bezeichnet hier eine politische Vereinbarung zwischen Königen. Die Präposition kann das Abkommen als Grundlage oder Bedingung der Freilassung kennzeichnen.
- source_word: אֲשַׁלְּחֶךָּ ... וַיְשַׁלְּחֵהוּ
  choice: werde dich ... ziehen lassen ... ließ ihn ziehen
  rationale: שלח bezeichnet hier die Freilassung des besiegten Königs. Die wiederholte Formulierung bildet Zusage und Erfüllung ab.
- source_word: וַיִּכְרָת לוֹ בְרִית
  choice: schloss er mit ihm ein Abkommen
  rationale: כרת ברית ist die feste hebräische Wendung für den formellen Abschluss einer bindenden Vereinbarung; „ein Abkommen schließen“ ist die entsprechende natürliche deutsche Wendung.
theological_decisions:
- issue: Wiedergabe von בְּרִית im politischen Zusammenhang
  choice: Abkommen
  alternative: Bund
  rationale: Hier handelt es sich um eine ausgehandelte Vereinbarung zwischen zwei Königen. „Abkommen“ gibt diese politische Funktion wieder, ohne die lexikalisch ebenfalls mögliche und häufig theologisch geprägte Wiedergabe „Bund“ auszuschließen.
- issue: Nicht ausdrücklich markierter Sprecherwechsel vor וַאֲנִי
  choice: Der Sprecherwechsel wird durch getrennte Rede und Gedankenstrich angezeigt, ohne einen zusätzlichen Redeeinleiter einzufügen.
  alternative: Die gesamte Rede Ben-Hadad zuschreiben oder ausdrücklich „Ahab antwortete“ ergänzen
  rationale: Inhalt und anschließende Handlung sprechen dafür, dass Ahab mit „Und ich“ antwortet. Da der hebräische Text den Wechsel jedoch nicht ausdrücklich einleitet, vermeidet die Fassung sowohl eine falsche Zuschreibung als auch eine unnötige Namenergänzung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Rede bleibt knapp und diplomatisch. Der Gedankenstrich macht den wahrscheinlich gemeinten Sprecherwechsel erkennbar, ohne dem hebräischen Text einen ausdrücklichen Redeeinleiter hinzuzufügen.
