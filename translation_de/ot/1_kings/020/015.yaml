source:
  edition: WLC
  text: וַ/יִּפְקֹ֗ד אֶֽת נַעֲרֵי֙ שָׂרֵ֣י הַ/מְּדִינ֔וֹת וַ/יִּהְי֕וּ מָאתַ֖יִם שְׁנַ֣יִם וּ/שְׁלֹשִׁ֑ים וְ/אַחֲרֵי/הֶ֗ם פָּקַ֧ד אֶת כָּל הָ/עָ֛ם כָּל בְּנֵ֥י יִשְׂרָאֵ֖ל שִׁבְעַ֥ת אֲלָפִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/015.yaml
  text: So he mustered the young men of the provincial commanders[a], and they were two hundred and thirty-two; and after them he mustered all the people, all the sons of Israel, seven thousand.
translation:
  language: de
  text: 'Dann musterte er die jungen Männer der Provinzobersten; es waren zweihundertzweiunddreißig. Und nach ihnen musterte er das ganze Volk, alle Söhne Israels[a]: siebentausend.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle Israeliten“. Wörtlich steht im Hebräischen „alle Söhne Israels“, eine männliche familiäre Bezeichnung für die Israeliten.'
    reason: Die Formulierung erläutert den idiomatischen Ausdruck, ohne seine Referenz im militärischen Kontext über die Quelle hinaus festzulegen.
lexical_decisions:
- source_word: וַיִּפְקֹד / פָּקַד
  choice: musterte
  rationale: Im militärischen Zusammenhang bezeichnet פקד das Erfassen und Aufstellen der verfügbaren Männer; „mustern“ gibt sowohl das Zählen als auch die Mobilisierung wieder.
- source_word: נַעֲרֵי
  choice: die jungen Männer
  rationale: נַעַר kann einen jungen Mann, Diener oder Gefolgsmann bezeichnen. „Junge Männer“ bewahrt die Grundbedeutung, ohne ihre gesellschaftliche Stellung näher festzulegen.
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: der Provinzobersten
  rationale: שַׂר bezeichnet einen führenden Amtsträger, מְדִינָה einen Verwaltungsbezirk. „Provinzoberste“ ist im Deutschen knapp und lässt offen, ob ihre Funktion primär politisch oder militärisch war.
- source_word: מָאתַיִם שְׁנַיִם וּשְׁלֹשִׁים
  choice: '232'
  rationale: Direkte Wiedergabe der Zahl in einer gut lesbaren modernen Schreibweise.
- source_word: וְאַחֲרֵיהֶם
  choice: Nach ihnen
  rationale: 'Bewahrt die konkrete Reihenfolge: Zuerst wurde die kleinere Gruppe, danach die Gesamtheit aufgeboten.'
- source_word: כָּל הָעָם
  choice: das ganze Volk
  rationale: Die Wiedergabe folgt dem allgemeinen Ausdruck הָעָם und verengt ihn trotz des militärischen Zusammenhangs nicht auf „Heer“ oder „Truppen“.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: alle Söhne Israels
  rationale: Die familiäre, grammatisch maskuline Formulierung des Hebräischen bleibt sichtbar; eine Fußnote erläutert die idiomatische Bedeutung.
- source_word: שִׁבְעַת אֲלָפִים
  choice: '7000'
  rationale: Direkte Wiedergabe der abschließenden Gesamtzahl.
theological_decisions: []
