source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה יַ֛עַן שִׁלַּ֥חְתָּ אֶת אִישׁ חֶרְמִ֖/י מִ/יָּ֑ד וְ/הָיְתָ֤ה נַפְשְׁ/ךָ֙ תַּ֣חַת נַפְשׁ֔/וֹ וְ/עַמְּ/ךָ֖ תַּ֥חַת עַמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/042.yaml
  text: 'And he said to him[a], “Thus says Yahweh: Because you have let go from your hand the man I had devoted to destruction, your life shall be for his life, and your people for his people.”'
translation:
  language: de
  text: 'Und er sagte zu ihm: »So spricht Jahwe: Weil du den Mann, den ich dem Untergang geweiht hatte[a], aus deiner Hand freigelassen hast, soll dein Leben an die Stelle seines Lebens treten und dein Volk an die Stelle seines Volkes.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Mann, der unter meinem Bann stand«. Das hebräische Wort bezeichnet hier jemanden, der aufgrund des göttlichen Gerichts dem Untergang geweiht ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den persönlichen Gottesnamen in einer im Deutschen etablierten Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: יַעַן
  choice: Weil
  rationale: Leitet den Grund für das folgende Gerichtsurteil knapp und natürlich ein.
- source_word: שִׁלַּחְתָּ ... מִיָּד
  choice: aus deiner Hand freigelassen hast
  rationale: שׁלח bezeichnet hier die Freilassung des gefangenen Königs; „aus deiner Hand“ bewahrt zugleich das hebräische Bild für Gewahrsam oder Verfügungsgewalt, ohne ein Entkommen gegen Ahabs Willen anzudeuten.
- source_word: אִישׁ חֶרְמִי
  choice: den Mann, den ich dem Untergang geweiht hatte
  rationale: Die Formulierung gibt sowohl das göttliche Verfügen in der 1. Person als auch die auf Vernichtung zielende חֵרֶם-Terminologie verständlich wieder.
- source_word: נַפְשְׁךָ תַּחַת נַפְשׁוֹ
  choice: dein Leben an die Stelle seines Lebens
  rationale: נֶפֶשׁ meint hier das Leben; תַּחַת drückt den stellvertretenden Austausch im Gerichtsurteil aus.
- source_word: וְעַמְּךָ תַּחַת עַמּוֹ
  choice: und dein Volk an die Stelle seines Volkes
  rationale: Wahrt den Parallelismus und den Gedanken, dass Ahab und sein Volk das Los des freigelassenen Königs und dessen Volkes treffen wird.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Entspricht der festen prophetischen Botenformel und ist zugleich würdig und gut verständlich.
theological_decisions:
- issue: Wiedergabe der חֵרֶם-Terminologie im göttlichen Gerichtswort
  choice: dem Untergang geweiht
  alternative: unter meinen Bann gestellt
  rationale: „Dem Untergang geweiht“ bewahrt den Gedanken einer durch Gottes Gericht festgelegten Vernichtung, ohne das für heutige Leser leicht missverständliche Wort „Bann“ unkommentiert in den Haupttext zu setzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die prophetische Formel bleibt bewusst knapp und formell. Der parallele Aufbau des Urteilsspruchs wird erhalten; „an die Stelle … treten“ macht die mit תַּחַת bezeichnete Stellvertretung idiomatisch deutlich.
