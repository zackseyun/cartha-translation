  text: וַ/יֹּ֜אמֶר לְ/מַלְאֲכֵ֣י בֶן הֲדַ֗ד אִמְר֞וּ לַֽ/אדֹנִ֤/י הַ/מֶּ֨לֶךְ֙ כֹּל֩ אֲשֶׁר שָׁלַ֨חְתָּ אֶל עַבְדְּ/ךָ֤ בָ/רִֽאשֹׁנָה֙ אֶעֱשֶׂ֔ה וְ/הַ/דָּבָ֣ר הַ/זֶּ֔ה לֹ֥א אוּכַ֖ל לַ/עֲשׂ֑וֹת וַ/יֵּֽלְכוּ֙ הַ/מַּלְאָכִ֔ים וַ/יְשִׁבֻ֖/הוּ דָּבָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/009.yaml
  text: So he said to the messengers of Ben-hadad[a], “Say to my lord the king, ‘All that you sent to your servant the first time, I will do; but this thing I cannot do.’” And the messengers went and brought back word to him.
translation:
  language: de
  text: 'Da sagte er zu den Boten Ben-Hadads: „Sagt meinem Herrn, dem König: Alles, was du deinem Diener zuerst gesandt hast, will ich tun; aber diese Sache[a] kann ich nicht tun.“ Da gingen die Boten und brachten ihm die Antwort zurück.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „diese Angelegenheit“; das hebräische Wort דָּבָר kann je nach Zusammenhang „Sache“, „Angelegenheit“, „Wort“ oder „Botschaft“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאֲכֵי
  choice: Boten
  rationale: Im politischen Zusammenhang sind menschliche Abgesandte gemeint. „Boten“ ist allgemein verständlich und bewahrt die Grundbedeutung.
- source_word: בֶן הֲדַד
  choice: Ben-Hadad
  rationale: Der Personenname wird nach gängiger deutscher Bibeltradition wiedergegeben.
- source_word: לַאדֹנִי הַמֶּלֶךְ
  choice: meinem Herrn, dem König
  rationale: Die Formulierung bewahrt die höfische Unterordnung und macht durch die Apposition deutlich, dass der König angeredet wird.
- source_word: כֹּל אֲשֶׁר שָׁלַחְתָּ אֶל עַבְדְּךָ
  choice: Alles, was du deinem Diener … ausrichten ließest
  rationale: Das hebräische „sandtest“ bezeichnet hier den Inhalt einer übermittelten Botschaft. „Ausrichten ließest“ ist im Deutschen natürlich, ohne den Inhalt ausdrücklich als Forderung auszudeuten.
- source_word: עַבְדְּךָ
  choice: deinem Diener
  rationale: Es handelt sich um eine konventionelle höfische Selbstbezeichnung. „Diener“ wahrt diesen diplomatischen Ton besser als „Sklave“.
- source_word: בָרִאשֹׁנָה
  choice: beim ersten Mal
  rationale: Die Wendung verweist auf die vorausgegangene erste Botschaft Ben-Hadads.
- source_word: אֶעֱשֶׂה
  choice: will ich tun
  rationale: Die direkte Wiedergabe bewahrt sowohl die Zusage als auch die knappe Ausdrucksweise des Hebräischen.
- source_word: וְהַדָּבָר הַזֶּה
  choice: aber diese Sache
  rationale: דָּבָר bezeichnet hier die neu hinzugekommene Angelegenheit oder Forderung. „Sache“ wahrt die lexikalische Offenheit besser als das deutendere „Forderung“.
- source_word: לֹא אוּכַל לַעֲשׂוֹת
  choice: kann ich nicht tun
  rationale: Die Formulierung gibt die ausdrücklich behauptete Unfähigkeit eng und idiomatisch wieder.
- source_word: וַיְשִׁבֻהוּ דָּבָר
  choice: brachten ihm die Antwort zurück
  rationale: Die hebräische Redewendung beschreibt die Rückübermittlung einer Antwort. Die deutsche Formulierung ist natürlich und erhält die Rückkehrbewegung.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit höfisch-diplomatischem Ton. Die direkte Rede und die Selbstbezeichnung „deinem Diener“ bleiben nah an der hebräischen Form; schwerfällige Wörtlichkeit wird bei „ausrichten ließest“ idiomatisch geglättet.
