id: 1KI.20.18
reference: 1 Kings 20:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֛אמֶר אִם לְ/שָׁל֥וֹם יָצָ֖אוּ תִּפְשׂ֣וּ/ם חַיִּ֑ים וְ/אִ֧ם לְ/מִלְחָמָ֛ה יָצָ֖אוּ חַיִּ֥ים תִּפְשֽׂוּ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/018.yaml
  text: And he said[a], “If they have come out for peace, seize them alive; and if they have come out for battle, seize them alive.”
translation:
  language: de
  text: 'Da sagte er: »Wenn sie in friedlicher Absicht herausgekommen sind, nehmt sie lebend gefangen; und wenn sie zum Kampf herausgekommen sind, nehmt sie lebend gefangen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte er
  rationale: Gibt das narrative Wayyiqtol von אמר in natürlichem modernem Deutsch wieder, ohne eine stärkere zeitliche Folgerung einzutragen.
- source_word: אִם
  choice: wenn
  rationale: Die Partikel leitet jeweils eine Bedingung ein; „wenn“ ist im Deutschen die direkte und idiomatische Entsprechung.
- source_word: לְשָׁלוֹם
  choice: in friedlicher Absicht
  rationale: שָׁלוֹם bezeichnet hier wahrscheinlich den friedlichen Zweck bzw. die friedliche Haltung des Herauskommens; diese Wiedergabe ist natürlicher und eindeutiger als das im Deutschen schwerfällige „zum Frieden“.
- source_word: יָצָאוּ
  choice: herausgekommen sind
  rationale: Das Perfekt beschreibt die bereits erfolgte, für die gegenwärtige Lage relevante Bewegung aus der Stadt; „herausgekommen sind“ wahrt diese Perspektive.
- source_word: תִּפְשׂוּם
  choice: nehmt sie gefangen
  rationale: תפשׂ bedeutet im militärischen Zusammenhang ergreifen bzw. gefangen nehmen; die gewählte Formulierung ist kräftig und zugleich idiomatisch.
- source_word: חַיִּים
  choice: lebend
  rationale: Das Wort bezeichnet prädikativ den Zustand, in dem die Männer gefangen genommen werden sollen.
- source_word: וְאִם
  choice: und wenn
  rationale: Bewahrt die einfache koordinierende Verbindung des Hebräischen, ohne einen zusätzlichen Gegensatz einzutragen.
- source_word: לְמִלְחָמָה
  choice: zum Kampf
  rationale: מִלְחָמָה bezeichnet hier die kriegerische Auseinandersetzung; „zum Kampf“ bildet einen natürlichen Gegensatz zu „in friedlicher Absicht“.
- source_word: חַיִּים תִּפְשׂוּם
  choice: nehmt sie lebend gefangen
  rationale: Die Wiederholung des Befehls wird beibehalten. Die markierte hebräische Wortstellung der zweiten Klausel wird zugunsten eines natürlichen deutschen Satzbaus nicht mechanisch nachgebildet.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die auffällige Wiederholung desselben Befehls in beiden Bedingungssätzen bleibt erhalten; sie unterstreicht, dass die Männer unabhängig von ihrer Absicht lebend gefangen genommen werden sollen.
