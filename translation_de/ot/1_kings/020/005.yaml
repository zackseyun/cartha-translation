source:
  edition: WLC
  text: וַ/יָּשֻׁ֨בוּ֙ הַ/מַּלְאָכִ֔ים וַ/יֹּ֣אמְר֔וּ כֹּֽה אָמַ֥ר בֶּן הֲדַ֖ד לֵ/אמֹ֑ר כִּֽי שָׁלַ֤חְתִּי אֵלֶ֨י/ךָ֙ לֵ/אמֹ֔ר כַּסְפְּ/ךָ֧ וּ/זְהָבְ/ךָ֛ וְ/נָשֶׁ֥י/ךָ וּ/בָנֶ֖י/ךָ לִ֥/י תִתֵּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/005.yaml
  text: 'The messengers returned and said[a], “Thus says Ben-hadad: ‘Though I sent to you, saying, “You shall give me your silver and your gold and your wives and your sons,”’”'
translation:
  language: de
  text: 'Die Boten kehrten zurück und sagten: „So spricht Ben-Hadad: ‚Obwohl ich dir sagen ließ: Dein Silber und dein Gold, deine Frauen und deine Söhne sollst du mir geben,[a]‘“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn ich ließ dir sagen …“ Die hebräische Partikel כִּי kann unterschiedlich verstanden werden; hier wird sie wegen der in Vers 6 folgenden Steigerung konzessiv wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: kehrten zurück
  rationale: Das Verb שׁוב bezeichnet hier die Rückkehr der Boten und führt die Erzählung fort.
- source_word: הַמַּלְאָכִים
  choice: die Boten
  rationale: Im politischen Zusammenhang sind menschliche Abgesandte gemeint; „Boten“ ist natürlich und hinreichend genau.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die feste Botenformel wird in würdigem, verständlichem Deutsch mit präsentischem „So spricht“ wiedergegeben.
- source_word: בֶּן הֲדַד
  choice: Ben-Hadad
  rationale: Der Personenname wird in der im Deutschen üblichen Form transliteriert.
- source_word: כִּי
  choice: Obwohl
  rationale: Die Partikel wird im Blick auf die in Vers 6 folgende Steigerung konzessiv verstanden; ihre mögliche kausale Deutung bleibt in der Fußnote erhalten.
- source_word: שָׁלַחְתִּי אֵלֶיךָ לֵאמֹר
  choice: ich dir sagen ließ
  rationale: Die idiomatische Formulierung macht deutlich, dass Ben-Hadad zuvor eine Botschaft an Ahab gesandt hatte, ohne den Sinn auszuweiten.
- source_word: כַּסְפְּךָ וּזְהָבְךָ
  choice: dein Silber und dein Gold
  rationale: Die konkreten Wertgegenstände werden lexikalisch direkt und in ihrer parallelen Form wiedergegeben.
- source_word: וְנָשֶׁיךָ
  choice: deine Frauen
  rationale: „Frauen“ ist im modernen Deutschen die natürliche Bezeichnung für Ahabs Ehefrauen in diesem Zusammenhang.
- source_word: וּבָנֶיךָ
  choice: deine Söhne
  rationale: בנים bezeichnet hier ausdrücklich die Söhne und wird nicht verallgemeinernd als „Kinder“ wiedergegeben.
- source_word: לִי תִתֵּן
  choice: sollst du mir geben
  rationale: Die Formulierung gibt den verpflichtenden, ultimativ fordernden Sinn des Imperfekts in natürlichem Deutsch wieder.
