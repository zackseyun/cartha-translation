source:
  edition: WLC
  text: וַ/יִּגַּ֞שׁ אִ֣ישׁ הָ/אֱלֹהִ֗ים וַ/יֹּאמֶר֮ אֶל מֶ֣לֶךְ יִשְׂרָאֵל֒ וַ/יֹּ֜אמֶר כֹּֽה אָמַ֣ר יְהוָ֗ה יַ֠עַן אֲשֶׁ֨ר אָמְר֤וּ אֲרָם֙ אֱלֹהֵ֤י הָרִים֙ יְהוָ֔ה וְ/לֹֽא אֱלֹהֵ֥י עֲמָקִ֖ים ה֑וּא וְ֠/נָתַתִּי אֶת כָּל הֶ/הָמ֨וֹן הַ/גָּ֤דוֹל הַ/זֶּה֙ בְּ/יָדֶ֔/ךָ וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/028.yaml
  text: 'Then the man of God came near and said to the king of Israel[a], “Thus says Yahweh: Because Aram has said, ‘Yahweh is a god of the mountains, but he is not a god of the valleys,’ I will give all this great multitude into your hand[c][b], and you shall know that I am Yahweh.”'
translation:
  language: de
  text: 'Da trat der Mann Gottes heran und sagte zum König von Israel: „So spricht Jahwe: Weil Aram[a] gesagt hat: ‚Jahwe ist ein Gott der Berge, aber kein Gott der Täler[b]‘, werde ich diese ganze große Menge in deine Hand geben. Dann werdet ihr[c] erkennen, dass ich Jahwe bin.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aram bezeichnet hier das aramäische Königreich; traditionell wird auch „Syrien“ übersetzt.
    reason: alternative_reading
  - marker: b
    text: 'Auch möglich: „der Höhen … der Ebenen“. Das Hebräische stellt erhöhtes Gelände und tiefer liegendes Land einander gegenüber.'
    reason: lexical_alternative
  - marker: c
    text: „Ihr“ steht im Hebräischen im Plural. Die Aussage gilt daher nicht nur dem unmittelbar angesprochenen König, sondern Israel insgesamt.
    reason: grammatical_clarification
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: der Mann Gottes
  rationale: Die bestimmte Form bezeichnet hier den bereits bekannten prophetischen Boten und entspricht der festen biblischen Bezeichnung.
- source_word: וַיִּגַּשׁ
  choice: trat heran
  rationale: Gibt die konkrete Bewegung des Sichnäherns knapp und in natürlichem erzählerischem Deutsch wieder.
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Bewahrt die geläufige prophetische Botenformel im Deutschen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder; die Schreibweise „Jahwe“ ist im Deutschen geläufig.
- source_word: יַעַן אֲשֶׁר
  choice: Weil
  rationale: Leitet den Grund für das angekündigte Handeln Gottes klar und idiomatisch ein.
- source_word: אֲרָם
  choice: Aram
  rationale: Bewahrt die hebräische Bezeichnung des Landes beziehungsweise Volkes und vermeidet die spätere geografische Bezeichnung „Syrien“ im Haupttext.
- source_word: אֱלֹהֵי הָרִים ... וְלֹא אֱלֹהֵי עֲמָקִים
  choice: ein Gott der Berge, aber kein Gott der Täler
  rationale: Der unbestimmte Artikel bringt die aramäische Vorstellung von Jahwe als einer räumlich begrenzten Gottheit zum Ausdruck, ohne sie als zutreffend zu bestätigen. „Berge“ und „Täler“ geben den Geländekontrast direkt wieder.
- source_word: כָּל הֶהָמוֹן הַגָּדוֹל הַזֶּה
  choice: diese ganze große Menge
  rationale: Bewahrt die Grundbedeutung von הָמוֹן als große Menschenmasse; der militärische Zusammenhang bleibt erkennbar, ohne das Wort enger mit „Heer“ festzulegen.
- source_word: בְּיָדֶךָ
  choice: in deine Hand geben
  rationale: Erhält das verständliche hebräische Bild für Auslieferung und Sieg; das Pronomen steht wie im Hebräischen im Singular und richtet sich an den König.
- source_word: וִידַעְתֶּם
  choice: werdet ihr erkennen
  rationale: Gibt die zweite Person Plural ausdrücklich wieder und macht sichtbar, dass die Aussage über den König hinaus Israel als Gemeinschaft betrifft.
- source_word: כִּי אֲנִי יְהוָה
  choice: dass ich Jahwe bin
  rationale: Bewahrt die feierliche göttliche Selbsterkennungsformel und den Gottesnamen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen. Seine Wiedergabe als „Jahwe“ erhält den Charakter eines Eigennamens statt ihn durch einen Titel zu ersetzen.
- issue: Aramäische Vorstellung von Jahwe als örtlich begrenzter Gottheit
  choice: ein Gott der Berge, aber kein Gott der Täler
  alternative: der Gott der Berge, aber nicht der Gott der Täler
  rationale: Die unbestimmte Form spiegelt am besten die im Kontext vorausgesetzte polytheistische Einordnung Jahwes durch die Aramäer. Der Text führt diese Auffassung als fremde Behauptung an und widerlegt sie durch Jahwes Handeln.
- issue: Numerus der angesprochenen Personen in וִידַעְתֶּם
  choice: 'Plural: „werdet ihr erkennen“'
  alternative: 'Singular: „wirst du erkennen“'
  rationale: Obwohl der Bote unmittelbar zum König spricht und „deine Hand“ im Singular steht, ist das Verb „erkennen“ im Hebräischen Plural. Dieser Wechsel wird bewahrt und auf Israel insgesamt bezogen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht biblisch-prophetischem Klang. Die doppelte Redeeinleitung des Hebräischen wird durch zwei Sätze („sprach … Er sagte“) sichtbar erhalten. Die Anrede wechselt bewusst vom Singular „deine“ zum Plural „ihr“, entsprechend dem hebräischen Text.
