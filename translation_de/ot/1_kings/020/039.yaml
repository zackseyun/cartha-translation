  source_fidelity: 'Die wesentlichen Sinnelemente des Hebräischen sind zutreffend wiedergegeben: die im Hintergrund verlaufende Bewegung des Königs, der dringliche Ruf, die ehrerbietige Selbstbezeichnung, die Übergabe eines Gefangenen, die nachdrückliche Bedingung, die Ersatzformel und die nach Gewicht zu entrichtende Silberzahlung. Die Konditionalsatzform „Sollte er tatsächlich verschwunden sein“ klingt jedoch, als sei das Verschwinden bereits eingetreten; das Hebräische setzt eine mögliche spätere Entweichung bzw. ein Vermisstwerden voraus.'
