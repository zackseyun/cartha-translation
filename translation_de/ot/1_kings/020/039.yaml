  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt lebendig, ohne archaisierende Wörter wie „siehe“. Die syntaktische Mehrdeutigkeit von אִישׁ סָר wird nicht durch eine spekulative Herkunftsangabe aufgelöst.
