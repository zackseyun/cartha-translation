source:
  edition: WLC
  text: וַ/יְהִ֤י הַ/מֶּ֨לֶךְ֙ עֹבֵ֔ר וְ/ה֖וּא צָעַ֣ק אֶל הַ/מֶּ֑לֶךְ וַ/יֹּ֜אמֶר עַבְדְּ/ךָ֣ יָצָ֣א בְ/קֶֽרֶב הַ/מִּלְחָמָ֗ה וְ/הִנֵּֽה אִ֨ישׁ סָ֜ר וַ/יָּבֵ֧א אֵלַ֣/י אִ֗ישׁ וַ/יֹּ֨אמֶר֙ שְׁמֹר֙ אֶת הָ/אִ֣ישׁ הַ/זֶּ֔ה אִם הִפָּקֵד֙ יִפָּקֵ֔ד וְ/הָיְתָ֤ה נַפְשְׁ/ךָ֙ תַּ֣חַת נַפְשׁ֔/וֹ א֥וֹ כִכַּר כֶּ֖סֶף תִּשְׁקֽוֹל־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/039.yaml
  text: As the king was passing by[a], he cried out to the king and said, “Your servant went out into the midst of the battle, and behold, a man turned aside and brought a man to me and said, ‘Guard this man. If he is ever missing, then your life shall be for his life[b], or you shall weigh out a talent of silver.’”
translation:
  language: de
  text: 'Als der König vorbeikam, rief der Mann dem König zu und sagte: „Dein Diener zog mitten ins Kampfgeschehen. Da trat ein Mann beiseite, brachte einen Mann zu mir und sagte: ›Bewache diesen Mann! Wenn er irgendwie vermisst wird[a], soll dein Leben an die Stelle seines Lebens treten[b], oder du musst ein Talent Silber[c] abwiegen.‹“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn er auf irgendeine Weise abhandenkommt“. Im Hebräischen wird die Aussage durch die Verbindung eines Infinitivs mit einer finiten Verbform nachdrücklich hervorgehoben.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „dein Leben anstelle seines Lebens“; eine rechtliche Ersatzformel.'
    reason: lexical_alternative
  - marker: c
    text: Ein Talent war eine große antike Gewichtseinheit; sein genauer Wert schwankte je nach Zeit und Ort.
    reason: historical_context
lexical_decisions:
- source_word: עֹבֵר
  choice: vorüberging
  rationale: Das Partizip bezeichnet zusammen mit ויהי eine im Hintergrund andauernde Handlung; der deutsche Nebensatz gibt dies natürlich wieder.
- source_word: צָעַק
  choice: rief ... zu
  rationale: Das Verb bezeichnet einen lauten oder dringlichen Ruf. „Zurufen“ passt zur Anrede des vorbeigehenden Königs, ohne den Ton unnötig als Schreien festzulegen.
- source_word: עַבְדְּךָ
  choice: Dein Diener
  rationale: Hier handelt es sich um die übliche ehrerbietige Selbstbezeichnung gegenüber einem König, nicht notwendig um eine Aussage über den rechtlichen Sklavenstatus.
- source_word: בְּקֶרֶב הַמִּלְחָמָה
  choice: mitten in die Schlacht
  rationale: קֶרֶב bezeichnet das Innere beziehungsweise die Mitte; die Formulierung bewahrt das Bild, dass der Sprecher in das Kampfgeschehen hineinzog.
- source_word: וְהִנֵּה
  choice: Da ... auf einmal
  rationale: Die Wendung markiert eine lebhafte, überraschende Wendung im Bericht und wird in natürlichem modernem Deutsch entsprechend wiedergegeben.
- source_word: אִישׁ סָר
  choice: ein Mann trat beiseite
  rationale: סור bedeutet sich abwenden oder beiseitetreten. Die Übersetzung bleibt bewusst offen, woher oder wovon genau der Mann beiseitetrat.
- source_word: וַיָּבֵא אֵלַי אִישׁ
  choice: brachte einen Mann zu mir
  rationale: 'Der zweite אִישׁ ist das direkte Objekt: Der erste Mann übergibt einen anderen der Obhut des Sprechers.'
- source_word: שְׁמֹר
  choice: Bewache
  rationale: Der Imperativ verlangt, den übergebenen Mann in sicherem Gewahrsam zu halten; „bewachen“ ist im militärischen Zusammenhang knapp und klar.
- source_word: אִם הִפָּקֵד יִפָּקֵד
  choice: Sollte er tatsächlich verschwunden sein
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt das Vermisstsein beziehungsweise Verschwinden. „Tatsächlich“ bildet diese Hervorhebung ab.
- source_word: נַפְשְׁךָ תַּחַת נַפְשׁוֹ
  choice: dein Leben an die Stelle seines Lebens
  rationale: נֶפֶשׁ bezeichnet hier das Leben; תַּחַת formuliert einen rechtlichen Ersatz beziehungsweise Austausch.
- source_word: כִּכַּר כֶּסֶף
  choice: ein Talent Silber
  rationale: כִּכַּר ist eine antike Gewichtseinheit. Die traditionelle Bezeichnung „Talent“ bewahrt die historische Maßeinheit, ohne eine unsichere moderne Umrechnung in den Text einzutragen.
- source_word: תִּשְׁקוֹל
  choice: abwiegen
  rationale: Das Verb bedeutet wörtlich „wiegen“ und spiegelt wider, dass Silber nach Gewicht entrichtet wurde.
