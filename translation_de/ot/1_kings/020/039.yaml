  terminology: „Dein Diener“, „bewache“, „Leben an die Stelle seines Lebens“ und „Talent Silber abwiegen“ sind sachgerecht. Die Fußnoten erläutern die hebräische Verstärkung, die Rechtsformel und die historische Gewichtseinheit angemessen.
