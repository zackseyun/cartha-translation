base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/041.yaml
  text: Then he quickly removed the bandage from over his eyes[a], and the king of Israel recognized him, that he was one of the prophets.
translation:
  language: de
  text: Da nahm er schnell die Binde über seinen Augen ab[a]. Der König von Israel erkannte ihn als einen der Propheten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort הָאֲפֵר bedeutet gewöhnlich „Asche“. Im Zusammenhang kann es sich jedoch um eine Bedeckung oder Binde handeln, die als Verkleidung über den Augen getragen wurde.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: Da nahm er schnell … ab
  rationale: מהר bezeichnet hastiges Handeln; „schnell“ gibt dies natürlich wieder, während „Da“ die Fortführung der Erzählung ausdrückt.
- source_word: וַיָּסַר
  choice: nahm … ab
  rationale: Das Hifil von סור bedeutet hier, einen getragenen Gegenstand zu entfernen; bei einer Binde ist „abnehmen“ idiomatisches Deutsch.
- source_word: הָאֲפֵר
  choice: die Binde
  rationale: Obwohl אֵפֶר gewöhnlich „Asche“ bedeutet, verlangt der Zusammenhang in 1 Könige 20,38.41 wahrscheinlich eine über den Augen getragene Verkleidung. „Binde“ gibt diese Funktion verständlich wieder; die überlieferte Deutung wird in der Fußnote bewahrt.
- source_word: מֵעַל עֵינָיו
  choice: über seinen Augen
  rationale: Die Verbindung מן־על bezeichnet die Entfernung von einer Position über beziehungsweise auf den Augen. Mit „abnehmen“ ist der Ausgangspunkt im Deutschen bereits ausgedrückt.
- source_word: וַיַּכֵּר אֹתוֹ
  choice: Der König von Israel erkannte
  rationale: Das Hifil von נכר bedeutet „erkennen/wiedererkennen“. Im Deutschen kann der folgende dass-Satz den Inhalt der Erkenntnis unmittelbar ausdrücken, ohne das Pronomen „ihn“ unnatürlich zu verdoppeln.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt des Erkennens ein, nicht eine Begründung.
- source_word: מֵהַנְּבִאִים
  choice: einer von den Propheten
  rationale: Das partitive מן bezeichnet die Zugehörigkeit zu der Gruppe der Propheten.
- source_word: הוּא
  choice: war
  rationale: Der hebräische Nominalsatz enthält keine ausdrückliche Kopula; im deutschen Erzählzusammenhang ist die Vergangenheitsform erforderlich.
