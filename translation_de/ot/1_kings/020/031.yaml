  text: וַ/יֹּאמְר֣וּ אֵלָי/ו֮ עֲבָדָי/ו֒ הִנֵּֽה נָ֣א שָׁמַ֔עְנוּ כִּ֗י מַלְכֵי֙ בֵּ֣ית יִשְׂרָאֵ֔ל כִּֽי מַלְכֵ֥י חֶ֖סֶד הֵ֑ם נָשִׂ֣ימָה נָּא֩ שַׂקִּ֨ים בְּ/מָתְנֵ֜י/נוּ וַ/חֲבָלִ֣ים בְּ/רֹאשֵׁ֗/נוּ וְ/נֵצֵא֙ אֶל מֶ֣לֶךְ יִשְׂרָאֵ֔ל אוּלַ֖י יְחַיֶּ֥ה אֶת נַפְשֶֽׁ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/031.yaml
  text: And his servants said to him, “Look, please, we have heard that the kings of the house of Israel are merciful kings. Please let us put sackcloth around our waists and ropes on our heads, and let us go out to the king of Israel; perhaps he will let you live.”
translation:
  language: de
  text: 'Da sagten seine Diener zu ihm: „Schau doch, wir haben gehört, dass die Könige des Hauses Israel barmherzige Könige sind. Lass uns doch Sacktuch um die Hüften legen und Stricke auf unsere Köpfe und zum König von Israel hinausgehen. Vielleicht lässt er dich am Leben.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְכֵי חֶסֶד
  choice: barmherzige Könige
  rationale: חֶסֶד bezeichnet hier eine erwartete gnädige beziehungsweise barmherzige Haltung gegenüber Besiegten; „barmherzig“ ist im Deutschen natürlich und bewahrt den ethischen Gehalt.
- source_word: שַׂקִּים בְּמָתְנֵינוּ
  choice: Sacktuch um die Hüften
  rationale: Die Wendung beschreibt Sacktuch als Zeichen der Demütigung beziehungsweise Trauer, das um die Körpermitte getragen wird.
- source_word: חֲבָלִים בְּרֹאשֵׁנוּ
  choice: Stricke um den Kopf
  rationale: Die ungewöhnliche, bildhafte Unterwerfungsgeste wird ohne erklärende Glättung wörtlich-natürlich wiedergegeben.
- source_word: יְחַיֶּה אֶת נַפְשֶׁךָ
  choice: lässt er dich am Leben
  rationale: Die hebräische Idiomatik bedeutet hier, jemandes Leben zu verschonen; diese deutsche Formulierung gibt den Sinn präzise wieder.
- source_word: הִנֵּה נָא שָׁמַעְנוּ
  choice: Wir haben gehört
  rationale: הִנֵּה und נָא markieren Aufmerksamkeit und höfliches Drängen; im natürlichen deutschen Dialog wird diese Funktion zusammen mit dem folgenden „doch“ ausgedrückt, statt durch ein steifes „Sieh doch“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholten hebräischen Höflichkeits- und Dringlichkeitspartikeln werden idiomatisch gebündelt. „Haus Israel“ bleibt als dynastisch-volkliche Bezeichnung erhalten; die auffällige Geste mit Stricken um den Kopf wird nicht interpretiert oder harmonisiert.
