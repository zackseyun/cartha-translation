  naturalness: Der Dialog ist überwiegend natürliches, würdiges Standarddeutsch. „Schau doch“ gibt die Gesprächseröffnung idiomatisch wieder; „auf unsere Köpfe“ bewahrt die absichtlich ungewöhnliche Unterwerfungsgeste ohne unnatürliche Überinterpretation.
  terminology: „barmherzige Könige“ ist für מַלְכֵי חֶסֶד hier vertretbar, ebenso „Sacktuch“ für die Trauer- und Demütigungsgeste. „das Haus Israel“ bleibt angemessen erhalten. Die Pluralform bei „unsere Köpfe“ folgt dem hebräischen Ausdruck.
