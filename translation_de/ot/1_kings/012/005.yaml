  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֗ם לְכ֥וּ עֹ֛ד שְׁלֹשָׁ֥ה יָמִ֖ים וְ/שׁ֣וּבוּ אֵלָ֑/י וַ/יֵּלְכ֖וּ הָ/עָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/005.yaml
  text: He said to them[a], “Go away for three more days, then return to me.” So the people went away.
translation:
  language: de
  text: 'Er sagte zu ihnen: „Geht für weitere drei Tage fort und kommt dann wieder zu mir.“ Da ging das Volk fort.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: Er sagte zu ihnen
  rationale: Die übliche deutsche Wiedergabe der hebräischen Erzählform mit ausdrücklicher Bezeichnung der Angesprochenen; das einleitende וַ wird im flüssigen deutschen Erzählstil nicht eigens wiedergegeben.
- source_word: לְכוּ
  choice: Geht … fort
  rationale: Der Pluralimperativ von הלך fordert die Abordnung hier auf, sich vorübergehend zu entfernen. „Fortgehen“ verdeutlicht diese kontextuelle Richtung, ohne eine endgültige Entlassung anzudeuten.
- source_word: עֹד שְׁלֹשָׁה יָמִים
  choice: für weitere drei Tage
  rationale: עֹד bezeichnet zusammen mit der Zeitangabe einen zusätzlichen Zeitraum. Die Formulierung ist im modernen Deutschen natürlich und wahrt die zeitliche Aussage.
- source_word: וְשׁוּבוּ אֵלָי
  choice: und kommt dann wieder zu mir
  rationale: שוב bezeichnet die Rückkehr zum Sprecher; „dann“ macht die Abfolge der beiden Aufforderungen natürlich deutlich, während „wieder zu mir“ das Richtungsziel אֵלַי wiedergibt.
- source_word: וַיֵּלְכוּ הָעָם
  choice: Da ging das Volk fort
  rationale: Die kollektive Singularform הָעָם wird im Deutschen natürlich mit „das Volk“ und singularischem Verb wiedergegeben. „Da“ führt die anschließende Reaktion erzählerisch ein, und „fort“ nimmt die vorherige Aufforderung auf.
