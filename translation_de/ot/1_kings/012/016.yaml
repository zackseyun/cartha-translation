  text: וַ/יַּ֣רְא כָּל יִשְׂרָאֵ֗ל כִּ֠י לֹֽא שָׁמַ֣ע הַ/מֶּלֶךְ֮ אֲלֵי/הֶם֒ וַ/יָּשִׁ֣בוּ הָ/עָ֣ם אֶת הַ/מֶּ֣לֶךְ דָּבָ֣ר לֵ/אמֹ֡ר מַה לָּ/נוּ֩ חֵ֨לֶק בְּ/דָוִ֜ד וְ/לֹֽא נַחֲלָ֣ה בְּ/בֶן יִשַׁ֗י לְ/אֹהָלֶ֨י/ךָ֙ יִשְׂרָאֵ֔ל עַתָּ֕ה רְאֵ֥ה בֵיתְ/ךָ֖ דָּוִ֑ד וַ/יֵּ֥לֶךְ יִשְׂרָאֵ֖ל לְ/אֹהָלָֽי/ו־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/016.yaml
  text: When all Israel saw that the king had not listened to them[a], the people answered the king, saying, “What share do we have in David? We have no inheritance in the son of Jesse. To your tents, O Israel! Now see to your own house[b], David.” So Israel went to their tents.
translation:
  language: de
  text: 'Als ganz Israel sah, dass der König nicht auf sie gehört hatte, antwortete das Volk dem König: »Welchen Anteil haben wir an David? Wir haben keinen Erbteil am Sohn Isais. Zu deinen Zelten, Israel![a] Kümmere dich nun um dein eigenes Haus[b], David!« So zog Israel zu seinen Zelten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich »Zu deinen Zelten, Israel!« Die Wendung ist ein Aufruf, auseinanderzugehen und die Gefolgschaft aufzukündigen; sinngemäß: »Nach Hause, Israel!«'
    reason: lexical_alternative
  - marker: b
    text: »Haus« kann hier auch das Königshaus beziehungsweise die Dynastie Davids bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא כָּל יִשְׂרָאֵל
  choice: Als ganz Israel sah
  rationale: Bewahrt das kollektive politische Subjekt und die Grundbedeutung von ראה; »sah« schließt hier das Erkennen der königlichen Weigerung ein.
- source_word: לֹא שָׁמַע ... אֲלֵיהֶם
  choice: nicht auf sie gehört hatte
  rationale: שׁמע mit אֶל bezeichnet hier nicht bloß akustisches Hören, sondern das Beachten beziehungsweise Erhören ihres Anliegens.
- source_word: וַיָּשִׁבוּ הָעָם אֶת־הַמֶּלֶךְ דָּבָר
  choice: antwortete das Volk dem König
  rationale: Gibt die hebräische Wendung »ein Wort zurückgeben« natürlich und präzise als Antwort wieder.
- source_word: מַה לָּנוּ חֵלֶק בְּדָוִד
  choice: Welchen Anteil haben wir an David?
  rationale: »Anteil« wahrt die politische und besitzrechtliche Bildsprache von חֵלֶק, ohne sie zur bloßen Redensart abzuschwächen.
- source_word: וְלֹא נַחֲלָה בְּבֶן־יִשַׁי
  choice: Wir haben kein Erbe am Sohn Isais
  rationale: »Erbe« erhält den Anklang an Stammesbesitz und Zugehörigkeit; »Sohn Isais« bewahrt die demonstrativ nichtkönigliche Bezeichnung Davids.
- source_word: לְאֹהָלֶיךָ יִשְׂרָאֵל
  choice: Zu deinen Zelten, Israel!
  rationale: Die wörtliche Wiedergabe erhält den historischen Aufruf zum Auseinandergehen und zum Entzug politischer Gefolgschaft; die idiomatische Bedeutung wird in einer Fußnote erläutert.
- source_word: עַתָּה רְאֵה בֵיתְךָ דָּוִד
  choice: Kümmere dich nun um dein eigenes Haus, David!
  rationale: ראה hat hier den Sinn »sich um etwas kümmern / nach etwas sehen«. »Haus« bewahrt zugleich die mögliche Bedeutung Haushalt oder Dynastie.
- source_word: וַיֵּלֶךְ יִשְׂרָאֵל לְאֹהָלָיו
  choice: So zog Israel zu seinen Zelten
  rationale: Die Wiederholung von »Zelten« bleibt erhalten; »zog« passt zum kollektiven Subjekt und bezeichnet das Weggehen der Stämme.
theological_decisions:
- issue: Politischer Losspruch vom davidischen Königshaus
  choice: Die Worte werden als scharfer politischer Bruch mit der davidischen Herrschaft wiedergegeben, ohne zusätzliche theologische Wertung.
  alternative: Die Aussage ausdrücklich als Ablehnung des davidischen Bundes oder messianischer Verheißungen deuten.
  rationale: Der Vers schildert den Aufstand gegen Rehabeam und sein Königshaus. Die Übersetzung wahrt diese Tragweite, ohne spätere theologische Folgerungen in den Wortlaut einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die politische Parole bleibt knapp und rhythmisch. Das kollektive »Israel« wird mit dem grammatisch passenden Singularpronomen »seinen« aufgenommen; historische Bildsprache und die Mehrdeutigkeit von »Haus« bleiben erhalten.
