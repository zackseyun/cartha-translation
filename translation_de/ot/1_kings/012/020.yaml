  text: וַ/יְהִ֞י כִּ/שְׁמֹ֤עַ כָּל יִשְׂרָאֵל֙ כִּֽי שָׁ֣ב יָרָבְעָ֔ם וַֽ/יִּשְׁלְח֗וּ וַ/יִּקְרְא֤וּ אֹת/וֹ֙ אֶל הָ֣/עֵדָ֔ה וַ/יַּמְלִ֥יכוּ אֹת֖/וֹ עַל כָּל יִשְׂרָאֵ֑ל לֹ֤א הָיָה֙ אַחֲרֵ֣י בֵית דָּוִ֔ד זוּלָתִ֥י שֵֽׁבֶט יְהוּדָ֖ה לְ/בַדּֽ/וֹ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/020.yaml
  text: And when all Israel heard that Jeroboam had returned[a], they sent and called him to the assembly and made him king over all Israel. None followed the house of David except the tribe of Judah alone.
translation:
  language: de
  text: Als ganz Israel hörte, dass Jerobeam zurückgekehrt war, sandten sie nach ihm und riefen ihn zur Versammlung. Dann machten sie ihn zum König über ganz Israel. Niemand hielt zum Haus David[a] außer dem Stamm Juda allein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Niemand blieb beim Haus David außer dem Stamm Juda allein.“ Wörtlich steht im Hebräischen eine Wendung wie „hinter dem Haus David sein“; sie bezeichnet Zugehörigkeit oder Gefolgschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Als ... hörte
  rationale: Die Konstruktion leitet einen zeitlichen Erzählübergang ein; die deutsche Wiedergabe bewahrt diesen Sinn ohne das schwerfällige „Und es geschah, als“.
- source_word: כָּל יִשְׂרָאֵל
  choice: ganz Israel
  rationale: Bewahrt den kollektiven nationalen Ausdruck und ist im historischen Kontext natürlich.
- source_word: כִּי שָׁב יָרָבְעָם
  choice: dass Jerobeam zurückgekehrt war
  rationale: שׁוּב bezeichnet hier die Rückkehr; das Plusquamperfekt macht deutlich, dass sie dem folgenden Handeln vorausging.
- source_word: וַיִּשְׁלְחוּ
  choice: sandten sie nach ihm
  rationale: Im Zusammenhang mit dem anschließenden Rufen Jerobeams ist das idiomatisches Deutsch. Es benennt keine ausdrücklich nicht erwähnten Boten.
- source_word: וַיִּקְרְאוּ אֹתוֹ אֶל הָעֵדָה
  choice: riefen ihn zur Versammlung
  rationale: קרא mit אֶל drückt hier das Herbeirufen zu einer Zusammenkunft aus; „Versammlung“ vermeidet eine unnötig kirchliche Färbung.
- source_word: וַיַּמְלִיכוּ אֹתוֹ
  choice: machten sie ihn zum König
  rationale: Der Hifil von מלך bedeutet, jemanden zum König zu machen beziehungsweise als König einzusetzen; eine Krönungszeremonie wird nicht vorausgesetzt.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: über ganz Israel
  rationale: Gibt den Herrschaftsbereich mit עַל direkt wieder.
- source_word: לֹא הָיָה אַחֲרֵי בֵית דָּוִד
  choice: Niemand hielt zum Haus David
  rationale: Die hebräische Wendung „hinter/nach jemandem sein“ bezeichnet hier politische Zugehörigkeit oder Gefolgschaft. „Zu jemandem halten“ ist dafür klares modernes Deutsch.
- source_word: זוּלָתִי שֵׁבֶט יְהוּדָה לְבַדּוֹ
  choice: außer dem Stamm Juda allein
  rationale: זוּלָתִי bezeichnet die Ausnahme, während לְבַדּוֹ deren Ausschließlichkeit nachdrücklich hervorhebt.
theological_decisions:
- issue: Politische Loyalitätsformel nach der Reichsteilung
  choice: Niemand hielt zum Haus David
  alternative: Niemand blieb beim Haus David
  rationale: Die gewählte Fassung bewahrt den Sinn politischer Gefolgschaft in אַחֲרֵי, ohne die Aussage theologisch auszuweiten. Die alternative Deutung als Verbleiben ist möglich und wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Eröffnung wurde flüssig temporal gefasst; kurze Hauptsätze halten den Erzählstil klar. Der Fußnotenmarker steht unmittelbar bei der mehrdeutigen Loyalitätsformel.
