  text: ו/יבו יָרָבְעָ֧ם וְ/כָל הָ/עָ֛ם אֶל רְחַבְעָ֖ם בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֑י כַּ/אֲשֶׁ֨ר דִּבֶּ֤ר הַ/מֶּ֨לֶךְ֙ לֵ/אמֹ֔ר שׁ֥וּבוּ אֵלַ֖/י בַּ/יּ֥וֹם הַ/שְּׁלִישִֽׁי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/012.yaml
  text: So Jeroboam and all the people came to Rehoboam on the third day[a], just as the king had spoken, saying, “Return to me on the third day.”
translation:
  language: de
  text: 'Da kamen Jerobeam und das ganze Volk am dritten Tag zu Rehabeam, genau wie der König gesagt hatte: »Kommt am dritten Tag wieder zu mir.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Da kamen
  rationale: בוא bezeichnet je nach Perspektive »kommen« oder »gehen«. Mit אֶל רְחַבְעָם ist »zu Rehabeam kommen« im Deutschen natürlich; »da« führt die Erzählung fort.
- source_word: יָרָבְעָם
  choice: Jerobeam
  rationale: Eingebürgerte deutsche Namensform.
- source_word: וְכָל הָעָם
  choice: und das ganze Volk
  rationale: עָם bezeichnet hier die Gesamtheit der Menschen, die vor dem König auftreten; »das ganze Volk« ist klar und quellennah.
- source_word: אֶל רְחַבְעָם
  choice: zu Rehabeam
  rationale: אֶל bezeichnet die Bewegung auf eine Person zu.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: am dritten Tag
  rationale: Entspricht der hebräischen Zeitangabe in natürlichem Standarddeutsch.
- source_word: כַּאֲשֶׁר
  choice: genau wie
  rationale: Die Wendung hebt hervor, dass ihr Handeln der vorherigen Anweisung des Königs entsprach.
- source_word: דִּבֶּר הַמֶּלֶךְ לֵאמֹר
  choice: wie der König gesagt hatte
  rationale: Das Plusquamperfekt macht die zeitliche Vorordnung der Rede deutlich; der hebräische Zitateinleiter לֵאמֹר wird im Deutschen idiomatisch durch den Doppelpunkt wiedergegeben.
- source_word: שׁוּבוּ אֵלַי
  choice: Kommt … wieder zu mir
  rationale: שׁוב bedeutet zurückkehren oder umkehren. In der direkten Aufforderung des Königs gibt »wieder zu mir kommen« den Rückkehrgedanken und die Sprecherperspektive natürlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt eng am hebräischen Erzählgang, während der formelhafte Zitateinleiter idiomatisch als Doppelpunkt erscheint. Keine Fußnote ist nötig, da die möglichen Richtungsvarianten von בוא und שוב im Kontext keine inhaltlich bedeutsame Mehrdeutigkeit erzeugen.
