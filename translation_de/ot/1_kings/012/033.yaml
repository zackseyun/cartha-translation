source:
  edition: WLC
  text: וַ/יַּ֜עַל עַֽל הַ/מִּזְבֵּ֣חַ אֲשֶׁר עָשָׂ֣ה בְּ/בֵֽית אֵ֗ל בַּ/חֲמִשָּׁ֨ה עָשָׂ֥ר יוֹם֙ בַּ/חֹ֣דֶשׁ הַ/שְּׁמִינִ֔י בַּ/חֹ֖דֶשׁ אֲשֶׁר בָּדָ֣א מ/ל/בד וַ/יַּ֤עַשׂ חָג֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל וַ/יַּ֥עַל עַל הַ/מִּזְבֵּ֖חַ לְ/הַקְטִֽיר־׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/033.yaml
  text: And he went up to the altar that he had made in Bethel on the fifteenth day in the eighth month[a], in the month that he had devised from his own heart, and he made a feast for the sons of Israel[b]; and he went up to the altar to burn incense.
translation:
  language: de
  text: Und er stieg zu dem Altar hinauf, den er in Bethel errichtet hatte, am fünfzehnten Tag des achten Monats – in dem Monat, den er sich selbst ausgedacht hatte[a]. So veranstaltete er für die Israeliten ein Fest[b] und stieg zum Altar hinauf, um Räucherwerk zu verbrennen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den er von sich aus festgesetzt hatte“; der hebräische Ausdruck ist ungewöhnlich und betont, dass Jerobeam den Monat selbst bestimmte.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „für die Söhne Israels“, eine übliche Bezeichnung für das Volk Israel.'
    reason: source_form
  - marker: c
    text: 'Oder allgemeiner: „um Opfergaben in Rauch aufgehen zu lassen“.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וַיַּעַל עַל הַמִּזְבֵּחַ
  choice: er stieg zu dem Altar hinauf
  rationale: עלה bedeutet grundsätzlich „hinaufsteigen/hinaufgehen“. „Zum Altar hinaufsteigen“ ist im Deutschen natürlich und bewahrt die im Vers wiederholte Formulierung, ohne ausdrücklich ein Besteigen der Altaroberfläche zu behaupten.
- source_word: אֲשֶׁר עָשָׂה בְּבֵית אֵל
  choice: den er in Bethel errichtet hatte
  rationale: Bei einem Altar gibt „errichtet“ das allgemeine עשה idiomatisch und präzise wieder; ב bezeichnet hier den Ort.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם בַּחֹדֶשׁ הַשְּׁמִינִי
  choice: am fünfzehnten Tag des achten Monats
  rationale: Natürliche deutsche Datumsangabe, die beide hebräischen Zeitbestimmungen vollständig wiedergibt.
- source_word: בַּחֹדֶשׁ אֲשֶׁר בָּדָא מִלְּבַד
  choice: in dem Monat, den er sich selbst ausgedacht hatte
  rationale: בדא bezeichnet hier das eigenmächtige Ersinnen oder Erfinden. Der schwierige Ausdruck מִלְּבַד wird im Zusammenhang am besten als „von sich aus/selbst“ verstanden; die Formulierung bewahrt die implizite Kritik, ohne das unsichere Bild „aus seinem Herzen“ in den Text einzutragen.
- source_word: וַיַּעַשׂ חָג
  choice: So veranstaltete er ... ein Fest
  rationale: עשה mit חג bezeichnet das Abhalten oder Veranstalten eines Festes. „Veranstaltete“ ist im modernen Deutsch natürlicher als das wörtliche „machte“.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: für die Israeliten
  rationale: בני ישראל ist hier die feste nationale Bezeichnung für das Volk Israel und meint nicht ausschließlich männliche Nachkommen. „Israeliten“ gibt die Referenz klar und knapp wieder.
- source_word: לְהַקְטִיר
  choice: um Räucherwerk zu verbrennen
  rationale: Das Hifil von קטר bezeichnet kultisch das Aufsteigenlassen von Rauch und kann je nach Objekt Opfergaben oder Räucherwerk betreffen. Die traditionelle kontextuelle Wiedergabe wird im Haupttext verwendet; eine Fußnote wahrt die weitere lexikalische Möglichkeit.
theological_decisions:
- issue: Die eigenmächtige Festsetzung des Festmonats durch Jerobeam
  choice: den er sich selbst ausgedacht hatte
  alternative: den er von sich aus festgesetzt hatte; den er in seinem eigenen Herzen ersonnen hatte
  rationale: Die Übersetzung lässt die erzählerische Kritik erkennen, legt aber keine über den hebräischen Ausdruck hinausgehende psychologische oder konfessionelle Deutung fest.
- issue: Nationale Bezeichnung בני ישראל
  choice: Israeliten
  alternative: Söhne Israels; Volk Israel
  rationale: Der Ausdruck bezeichnet kollektiv die Nation. „Israeliten“ ist inklusiv, präzise und im heutigen Standarddeutsch verständlich, ohne eine Aussage über die Geschlechterzusammensetzung der Feier zu erzwingen.
- issue: Bedeutungsumfang von להקטיר
  choice: Räucherwerk zu verbrennen
  alternative: Opfergaben in Rauch aufgehen zu lassen
  rationale: Im kultischen Zusammenhang ist Räuchern wahrscheinlich und entspricht dem unmittelbaren Kontext der Jerobeam-Erzählung; da das Verb allein semantisch weiter sein kann, wird die Alternative in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zweimalige Wendung „stieg ... zum Altar hinauf“ bewahrt die hebräische Wiederholung. Der Gedankenstrich gliedert die verschachtelte Datumsangabe, ohne ihren Zusammenhang zu verändern.
