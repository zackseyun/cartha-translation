  source_fidelity: Die Übersetzung gibt die Abfolge und die wiederholte Bewegung zum Altar zuverlässig wieder. „am fünfzehnten Tag des achten Monats“ entspricht der hebräischen Datierung. „den er sich selbst ausgedacht hatte“ trifft בדא und die Aussage von מִלִּבּוֹ/„aus seinem eigenen Inneren“ idiomatisch, ohne eine zusätzliche Bewertung einzutragen. „Räucherwerk zu verbrennen“ ist für להקטיר im gegebenen kultischen Kontext eine vertretbare kontextuelle Konkretisierung; die Fußnote wahrt den weiteren Bedeutungsumfang.
