  terminology: „Altar“, „Bethel“, „Fest“, „Israeliten“ und „Räucherwerk“ sind treffend und registergerecht. „Israeliten“ gibt בני ישראל als etablierte nationale Sammelbezeichnung natürlich wieder; Fußnote b dokumentiert die wörtliche Form. Die Fußnoten sind korrekt verankert und behandeln jeweils tatsächlich im Text vorhandene Übersetzungsentscheidungen.
