  text: וַ/יְדַבְּר֣וּ אֵלָ֗י/ו הַ/יְלָדִים֙ אֲשֶׁ֨ר גָּדְל֣וּ אִתּ/וֹ֮ לֵ/אמֹר֒ כֹּֽה תֹאמַ֣ר לָ/עָ֣ם הַ/זֶּ֡ה אֲשֶׁר֩ דִּבְּר֨וּ אֵלֶ֜י/ךָ לֵ/אמֹ֗ר אָבִ֨י/ךָ֙ הִכְבִּ֣יד אֶת עֻלֵּ֔/נוּ וְ/אַתָּ֖ה הָקֵ֣ל מֵ/עָלֵ֑י/נוּ כֹּ֚ה תְּדַבֵּ֣ר אֲלֵי/הֶ֔ם קָֽטָנִּ֥/י עָבָ֖ה מִ/מָּתְנֵ֥י אָבִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/010.yaml
  text: 'The young men who had grown up with him spoke to him, saying, “This is what you shall say to this people who spoke to you, saying, ‘Your father made our yoke heavy, but you, make it lighter for us’: this is what you shall say to them, ‘My little finger is thicker than my father’s waist.’”'
translation:
  language: de
  text: 'Die jungen Männer, die mit ihm aufgewachsen waren, sagten zu ihm: »So sollst du zu diesem Volk sagen, das zu dir gesagt hat: ›Dein Vater hat uns ein schweres Joch auferlegt; du aber erleichtere es uns!‹ So sollst du zu ihnen sagen: ›Mein kleiner Finger[a] ist dicker als die Hüften meines Vaters.‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »mein Kleiner«; wahrscheinlich ist der kleine Finger gemeint.'
    reason: Das hebräische Substantiv nennt das Körperteil nicht ausdrücklich; die Fußnote bewahrt diese sprachliche Offenheit.
lexical_decisions:
- source_word: הַיְלָדִים
  choice: die jungen Männer
  rationale: Im Kontext bezeichnet das Wort Rehabeams gleichaltrige, inzwischen erwachsene Ratgeber, nicht kleine Kinder.
- source_word: הִכְבִּיד אֶת־עֻלֵּנוּ
  choice: hat uns ein schweres Joch auferlegt
  rationale: Gibt das hebräische Bild vom Schwer-Machen des Jochs natürlich und anschaulich wieder.
- source_word: קָטָנִּי
  choice: mein kleiner Finger
  rationale: Die knappe hebräische Form bedeutet wörtlich etwa »mein Kleiner«; im Vergleich mit den Hüften ist »kleiner Finger« die traditionelle und kontextuell plausible Ergänzung, während die wörtliche Unbestimmtheit in der Fußnote erhalten bleibt.
- source_word: מָתְנֵי אָבִי
  choice: die Hüften meines Vaters
  rationale: מָתְנַיִם bezeichnet den Hüft- beziehungsweise Lendenbereich; »Hüften« ist im modernen Deutsch verständlich und bewahrt den körperlichen Größenvergleich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist klar gestaffelt; die Wiederholung »So sollst du ... sagen« folgt der hebräischen Rhetorik. Der Imperativ »erleichtere es uns« erhält die nachdrückliche Bitte des Volkes.
