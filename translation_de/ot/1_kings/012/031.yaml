base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/031.yaml
  text: He made houses of high places[a], and he appointed priests from among all the people[b], who were not from the sons of Levi.
translation:
  language: de
  text: Er errichtete ein Höhenheiligtum[a] und setzte Priester aus dem ganzen Volk ein, die nicht zu den Nachkommen Levis gehörten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ein Haus der Kulthöhen“; eine Bezeichnung für ein Heiligtum im Zusammenhang mit Kulthöhen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die keine Leviten waren“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: er errichtete / setzte … ein
  rationale: 'עשה ist ein weit gefasstes Verb („machen, tun“). Im Deutschen verlangt der jeweilige Zusammenhang eine natürliche Konkretisierung: Ein Heiligtum wird „errichtet“, Priester werden „eingesetzt“. Beide Wiedergaben bleiben innerhalb des Bedeutungsspektrums.'
- source_word: בֵּית בָּמוֹת
  choice: ein Höhenheiligtum
  rationale: Die wörtliche Verbindung „Haus der Höhen“ bezeichnet idiomatisch ein Heiligtum für den Kult auf einer Kulthöhe. Der Singular des hebräischen Textes bleibt erhalten; „Höhenheiligtum“ ist im Deutschen prägnant und verständlich.
- source_word: כֹּהֲנִים
  choice: Priester
  rationale: Dies ist die übliche und sachlich passende Wiedergabe im kultischen Zusammenhang.
- source_word: מִקְצוֹת הָעָם
  choice: aus allen Teilen des Volkes
  rationale: Die Wendung bezeichnet hier eine Auswahl aus der gesamten Breite der Bevölkerung, nicht nur von den geografischen „Enden“ her. Die Formulierung wahrt diesen umfassenden Sinn, ohne eine bestimmte gesellschaftliche Schichtung vorauszusetzen.
- source_word: אֲשֶׁר לֹא הָיוּ מִבְּנֵי לֵוִי
  choice: die nicht zu den Nachkommen Levis gehörten
  rationale: Die Wiedergabe bewahrt die Abstammungssprache von „Söhne Levis“ in natürlichem modernem Deutsch und kennzeichnet die Priester als nichtlevitisch.
theological_decisions:
- issue: Bezeichnung der von Jerobeam eingerichteten Kultstätte
  choice: ein Höhenheiligtum
  alternative: ein Haus der Kulthöhen
  rationale: Die idiomatische Wiedergabe macht den kultischen Ort deutlich, ohne die im Kontext erkennbare Bewertung durch zusätzliche wertende Begriffe wie „Götzentempel“ zu verstärken.
- issue: Nichtlevitische Herkunft der eingesetzten Priester
  choice: die nicht zu den Nachkommen Levis gehörten
  alternative: die keine Leviten waren
  rationale: Die gewählte Form bewahrt den ausdrücklichen Abstammungsbezug des hebräischen Textes, ohne darüber hinausgehende Aussagen über Amt, Weihe oder Legitimität einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt knapp und erzählend. Kultische Fachsprache wird nur dort verwendet, wo sie für die Genauigkeit nötig ist; die hebräischen Abstammungs- und Auswahlformulierungen werden natürlich, aber nicht interpretierend wiedergegeben.
