source:
  edition: WLC
  text: וַ/יְהִ֛י הַ/דָּבָ֥ר הַ/זֶּ֖ה לְ/חַטָּ֑את וַ/יֵּלְכ֥וּ הָ/עָ֛ם לִ/פְנֵ֥י הָ/אֶחָ֖ד עַד דָּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/030.yaml
  text: And this thing became a sin[a], and the people went before the one as far as Dan.
translation:
  language: de
  text: Und diese Sache wurde zur Sünde, und das Volk ging vor den einen[a] bis nach Dan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „vor den einen“. Gemeint ist wahrscheinlich eines der beiden Kälber, die Jerobeam aufgestellt hatte, besonders das Kalb in Dan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: wurde
  rationale: 'Mit לְחַטָּאת bezeichnet היה hier ein Ergebnis beziehungsweise eine Entwicklung: Die Sache wurde zur Sünde.'
- source_word: הַדָּבָר הַזֶּה
  choice: diese Sache
  rationale: דָּבָר ist semantisch weit und verweist hier auf die zuvor beschriebene Kultanordnung Jerobeams. „Diese Sache“ bewahrt den demonstrativen und sachlichen Charakter.
- source_word: לְחַטָּאת
  choice: zur Sünde
  rationale: Die Wendung bezeichnet hier Sünde, nicht ein Sündopfer. Die substantivische Wiedergabe erhält die Form und die knappe Wertung des Hebräischen.
- source_word: וַיֵּלְכוּ הָעָם
  choice: das Volk ging
  rationale: הלך bezeichnet im Erzählzusammenhang schlicht das Gehen. Eine Ergänzung wie „um anzubeten“ wäre kontextuell plausibel, steht aber nicht ausdrücklich im Text.
- source_word: לִפְנֵי
  choice: vor
  rationale: לִפְנֵי bedeutet wörtlich „vor“ beziehungsweise „in die Gegenwart von“. Die knappe Wiedergabe vermeidet eine unnötige interpretierende Erweiterung.
- source_word: הָאֶחָד
  choice: den einen
  rationale: Der hebräische Text lässt das Bezugswort aus und sagt wörtlich „den einen“. Diese Ellipse und die daraus entstehende Spannung bleiben im Haupttext erhalten; der wahrscheinliche Bezug wird in der Fußnote erläutert.
- source_word: עַד דָּן
  choice: bis nach Dan
  rationale: עַד bezeichnet den räumlichen Endpunkt. „Bis nach Dan“ ist im Deutschen eine natürliche Angabe der zurückgelegten Entfernung.
theological_decisions:
- issue: Art der Sünde in Jerobeams Kultordnung
  choice: Die Kultanordnung selbst wird knapp als etwas bezeichnet, das zur Sünde wurde.
  alternative: Die Kultanordnung wurde lediglich zu einem Anlass für weitere Sünden.
  rationale: חַטָּאת bedeutet hier aufgrund des Zusammenhangs „Sünde“, nicht „Sündopfer“. Der Text wird nicht durch eine spätere dogmatische Kategorie oder eine ausführlichere Erklärung erweitert.
- issue: Bezugswort von „den einen“
  choice: Die substantivierte Form bleibt im Haupttext erhalten und wird in einer Fußnote wahrscheinlich auf eines der beiden Kälber, besonders das in Dan, bezogen.
  alternative: „Das eine Kalb“ ausdrücklich in den Haupttext einsetzen.
  rationale: Das Hebräische ist knapp und syntaktisch auffällig. Die Übersetzung bewahrt diese echte Uneindeutigkeit, ohne den im Zusammenhang sehr wahrscheinlichen Bezug zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die hebräische Satzstruktur. Die ungewöhnliche Formulierung „vor den einen“ ist bewusst beibehalten und durch eine Fußnote erläutert.
