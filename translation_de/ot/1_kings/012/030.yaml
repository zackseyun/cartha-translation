  source_fidelity: 'Die Übersetzung gibt die hebräische Abfolge und die Kernelemente genau wieder: וַיְהִי als Ergebnis („wurde“), הַדָּבָר הַזֶּה als „diese Sache“, לְחַטָּאת als „zur Sünde“, die Bewegung des Volkes sowie den räumlichen Endpunkt Dan. „Vor den einen“ bewahrt die im Hebräischen elliptische und syntaktisch auffällige Formulierung, ohne das ausgelassene Bezugswort im Haupttext zu ergänzen.'
  naturalness: „Diese Sache wurde zur Sünde“ ist würdiges, verständliches Standarddeutsch. „Vor den einen“ ist im Deutschen bewusst ungewohnt, bildet aber die textliche Ellipse angemessen nach und wird unmittelbar durch die Fußnote verständlich gemacht. Eine Glättung zu „vor das eine Kalb“ oder „zu dem einen Kalb“ wäre interpretativer.
  terminology: „Sünde“ ist im Kontext die zutreffende Wiedergabe von חַטָּאת; ein Verständnis als „Sündopfer“ ist hier ausgeschlossen. Die Namensform „Jerobeam“ und „Dan“ entsprechen dem üblichen deutschen Bibelgebrauch. Die Fußnote erläutert den wahrscheinlichen Bezug auf eines der Kälber, ohne ihn als ausdrücklichen Wortlaut auszugeben.
