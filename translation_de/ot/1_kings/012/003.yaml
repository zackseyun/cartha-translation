source:
  edition: WLC
  text: וַֽ/יִּשְׁלְחוּ֙ וַ/יִּקְרְאוּ ל֔/וֹ ו/יבאו יָרָבְעָ֖ם וְ/כָל קְהַ֣ל יִשְׂרָאֵ֑ל וַֽ/יְדַבְּר֔וּ אֶל רְחַבְעָ֖ם לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/003.yaml
  text: So they sent and called for him[a], and Jeroboam and all the assembly of Israel came and spoke to Rehoboam, saying[b],
translation:
  language: de
  text: 'Da schickten sie nach ihm und ließen ihn rufen.[a] Jerobeam und die ganze Versammlung Israels[b] kamen und sprachen zu Rehabeam:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und ließen ihn kommen«. Gemeint ist, dass sie nach Jerobeam schickten, um ihn herbeizurufen.'
    reason: lexical_alternative
  - marker: b
    text: »Versammlung« kann auch mit »Gemeinde« wiedergegeben werden; hier ist die versammelte Gesamtheit Israels in einem öffentlichen und politischen Sinn gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ וַיִּקְרְאוּ לוֹ
  choice: Da schickten sie nach ihm und ließen ihn rufen
  rationale: Die Formulierung gibt die Abfolge »senden« und »rufen lassen« natürlich wieder. »Nach ihm schicken« macht im Deutschen die im Hebräischen aus dem Zusammenhang erschließbare Absicht deutlich, ohne ausdrücklich Boten einzuführen.
- source_word: וַיָּבֹאוּ
  choice: kamen
  rationale: Die einfache narrative Bedeutung von בוא wird direkt und idiomatisch wiedergegeben.
- source_word: יָרָבְעָם
  choice: Jerobeam
  rationale: Der Personenname folgt der etablierten deutschen Bibelnamenform.
- source_word: וְכָל־קְהַל יִשְׂרָאֵל
  choice: und die ganze Versammlung Israels
  rationale: קהל bezeichnet hier die versammelte Gesamtheit Israels in einem öffentlichen und politischen Zusammenhang. »Versammlung« ist neutraler als das stärker religiös geprägte »Gemeinde«.
- source_word: וַיְדַבְּרוּ אֶל־רְחַבְעָם לֵאמֹר
  choice: 'und sprachen zu Rehabeam:'
  rationale: Der Doppel-Ausdruck »sprachen …, indem sie sagten« wird im Deutschen idiomatisch durch ein redeeinleitendes Verb mit Doppelpunkt wiedergegeben; der Doppelpunkt weist auf die folgende direkte Rede voraus.
- source_word: רְחַבְעָם
  choice: Rehabeam
  rationale: Der Personenname folgt der etablierten deutschen Bibelnamenform.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Namen stehen in ihren gebräuchlichen deutschen Bibelformen. Das redeeinleitende לֵאמֹר wird ohne schwerfällige wörtliche Doppelung durch den Doppelpunkt ausgedrückt.
