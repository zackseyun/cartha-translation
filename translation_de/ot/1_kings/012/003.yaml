  source_fidelity: 'Die Übersetzung gibt die hebräische Handlungsfolge sachgerecht wieder: Es wird nach Jerobeam gesandt und er wird herbeigerufen; danach kommen Jerobeam und die gesamte Versammlung Israels und richten sich an Rehabeam. Der Doppelpunkt bildet die mit לֵאמֹר eingeleitete folgende Rede idiomatisch ab.'
