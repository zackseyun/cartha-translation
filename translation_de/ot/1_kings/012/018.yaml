  naturalness: Der Text ist überwiegend modernes, verständliches Standarddeutsch. »Ganz Israel« und »Zwangsarbeit« sind idiomatisch. Die revidierte Formulierung zu Rehabeams Eile ist zugleich natürlicher und näher am hebräischen Bewegungsablauf.
  terminology: Rehabeam und Adoram entsprechen dem masoretischen Text; die Namensvariante Adoniram ist angemessen in der Fußnote vermerkt. »Zwangsarbeit« gibt מַס im Kontext zutreffend wieder. »Wagen« ist für מֶרְכָּבָה möglich und verständlich.
