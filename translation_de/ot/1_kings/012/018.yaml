  to: Da sandte König Rehabeam Adoram[a], den Aufseher über die Zwangsarbeit, und ganz Israel steinigte ihn, sodass er starb. König Rehabeam beeilte sich[b], auf den Wagen zu steigen, um nach Jerusalem zu fliehen.
