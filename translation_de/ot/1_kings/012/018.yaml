  text: וַ/יִּשְׁלַ֞ח הַ/מֶּ֣לֶךְ רְחַבְעָ֗ם אֶת אֲדֹרָם֙ אֲשֶׁ֣ר עַל הַ/מַּ֔ס וַ/יִּרְגְּמ֨וּ כָל יִשְׂרָאֵ֥ל בּ֛/וֹ אֶ֖בֶן וַ/יָּמֹ֑ת וְ/הַ/מֶּ֣לֶךְ רְחַבְעָ֗ם הִתְאַמֵּץ֙ לַ/עֲל֣וֹת בַּ/מֶּרְכָּבָ֔ה לָ/נ֖וּס יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/018.yaml
  text: Then King Rehoboam sent Adoram[a], who was over the forced labor, and all Israel stoned him with stones, and he died[c][b]. And King Rehoboam made haste to get up into the chariot to flee to Jerusalem.
translation:
  language: de
  text: Da sandte König Rehabeam Adoram[a], den Aufseher über die Zwangsarbeit, und ganz Israel steinigte ihn, sodass er starb. König Rehabeam beeilte sich[b], auf den Wagen zu steigen, um nach Jerusalem zu fliehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: Adoram; in verwandten Stellen steht die Namensform Adoniram.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich etwa: »strengte sich an«. Das hebräische Verb kann hier die dringliche, angestrengte Eile beim Besteigen des Wagens ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: sandte
  rationale: Die übliche deutsche Erzählform für das wayyiqtol von שלח; sie bezeichnet Rehabeams Entsendung Adorams.
- source_word: אֲדֹרָם
  choice: Adoram
  rationale: Der masoretische Text liest hier ausdrücklich Adoram; die verwandte Namensform Adoniram wird in einer Fußnote genannt.
- source_word: אֲשֶׁר עַל הַמַּס
  choice: den Aufseher über die Zwangsarbeit
  rationale: Die Wendung bezeichnet Adorams Amt als Leiter des staatlich auferlegten Frondienstes. Die appositionelle Wiedergabe ist im Deutschen natürlich.
- source_word: הַמַּס
  choice: Zwangsarbeit
  rationale: מַס meint hier eine staatlich auferlegte Arbeitsleistung, nicht primär eine Geldabgabe.
- source_word: וַיִּרְגְּמוּ ... אֶבֶן
  choice: steinigte ihn
  rationale: Das deutsche Verb »steinigen« gibt den hebräischen Ausdruck vollständig und idiomatisch wieder; »mit Steinen steinigen« wäre unnötig redundant.
- source_word: כָל יִשְׂרָאֵל
  choice: ganz Israel
  rationale: Bewahrt die kollektive politische Bezeichnung des hebräischen Textes und klingt im Deutschen natürlicher als »alles Israel«.
- source_word: וַיָּמֹת
  choice: sodass er starb
  rationale: Macht den im Erzählzusammenhang eindeutigen tödlichen Ausgang der Steinigung klar, ohne zusätzliche Aussage einzutragen.
- source_word: הִתְאַמֵּץ
  choice: konnte sich gerade noch ... retten
  rationale: Das Hitpael von אמץ bezeichnet hier entschlossene beziehungsweise angestrengte Selbstbehauptung in einer akuten Fluchtsituation. Die kontextuelle deutsche Wiedergabe vermittelt Dringlichkeit und Anstrengung natürlicher als das missverständliche »stärkte sich«.
- source_word: לַעֲלוֹת בַּמֶּרְכָּבָה
  choice: auf den Wagen
  rationale: עלה mit מֶרְכָּבָה bedeutet, den Wagen zu besteigen. In Verbindung mit »sich retten« bleibt die Bewegung auf das Fahrzeug hin klar.
- source_word: לָנוּס יְרוּשָׁלָם
  choice: nach Jerusalem fliehen
  rationale: נוּס bezeichnet eine dringliche Flucht, nicht bloß eine Abreise.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kurze narrative Sätze bewahren die Dringlichkeit. »Zwangsarbeit« macht den historischen Frondienst verständlich; »Wagen« ist hier der königliche Streit- oder Reisewagen. Die adversativen Anschlüsse »doch« und »aber« geben den offenkundigen Handlungsgegensatz idiomatisch wieder, obwohl das Hebräische jeweils mit וַ־ beziehungsweise וְ־ fortfährt.
