source:
  edition: WLC
  text: וַ/יְהִי֙ דְּבַ֣ר הָֽ/אֱלֹהִ֔ים אֶל שְׁמַעְיָ֥ה אִישׁ הָ/אֱלֹהִ֖ים לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/022.yaml
  text: And the word of God came to Shemaiah the man of God[a], saying,
translation:
  language: de
  text: Da erging das Wort Gottes an Schemaja, den Mann Gottes:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »Da erging das Wort Gottes an Schemaja.« In ähnlichen Formeln steht häufig »das Wort des HERRN«; hier lautet der Text jedoch ausdrücklich »Gott« (אֱלֹהִים), nicht der Gottesname JHWH.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי ... דְּבַר ... אֶל
  choice: Da erging das Wort ... an
  rationale: Die feste prophetische Wendung wird im Deutschen natürlich und würdig mit »das Wort erging an« wiedergegeben; »da« nimmt den fortlaufenden Erzählzusammenhang von וַיְהִי auf.
- source_word: דְּבַר
  choice: Wort
  rationale: Im Zusammenhang göttlicher Offenbarung bezeichnet דָּבָר eine göttliche Mitteilung. »Wort« bewahrt zugleich die biblische Ausdrucksweise und ihre theologische Resonanz.
- source_word: הָאֱלֹהִים
  choice: Gottes
  rationale: אֱלֹהִים bezeichnet hier den wahren Gott. Der Text verwendet ausdrücklich nicht den Gottesnamen JHWH.
- source_word: שְׁמַעְיָה
  choice: Schemaja
  rationale: Der Personenname wird nach geläufiger deutscher Bibeltradition transliteriert.
- source_word: אִישׁ הָאֱלֹהִים
  choice: den Mann Gottes
  rationale: Die appositionelle Wendung bezeichnet Schemaja in seiner anerkannten prophetischen Rolle; »Mann Gottes« bewahrt den etablierten biblischen Titel.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv leitet die unmittelbar folgende Gottesrede ein. Im modernen Deutschen erfüllt ein Doppelpunkt diese Funktion natürlicher als das formelhafte »indem er sprach« oder »mit den Worten«.
theological_decisions:
- issue: Wiedergabe von אֱלֹהִים in der Offenbarungsformel
  choice: Gott
  alternative: der HERR
  rationale: Der hebräische Ausgangstext hat אֱלֹהִים und nicht den Gottesnamen JHWH. Die Übersetzung folgt daher dem tatsächlich bezeugten Ausdruck, ohne ihn an häufigere prophetische Formeln anzugleichen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle prophetische Formel »das Wort erging an« bleibt erhalten. Der Doppelpunkt gibt לֵאמֹר idiomatisch wieder und verbindet den Vers mit der folgenden direkten Rede. Der Fußnotenmarker steht nach der vollständigen Rollenbezeichnung, auf die sich die textkritisch-lexikalische Erläuterung bezieht.
