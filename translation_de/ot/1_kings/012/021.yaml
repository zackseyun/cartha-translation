source:
  edition: WLC
  text: ו/יבאו רְחַבְעָם֮ יְרוּשָׁלִַם֒ וַ/יַּקְהֵל֩ אֶת כָּל בֵּ֨ית יְהוּדָ֜ה וְ/אֶת שֵׁ֣בֶט בִּנְיָמִ֗ן מֵאָ֨ה וּ/שְׁמֹנִ֥ים אֶ֛לֶף בָּח֖וּר עֹשֵׂ֣ה מִלְחָמָ֑ה לְ/הִלָּחֵם֙ עִם בֵּ֣ית יִשְׂרָאֵ֔ל לְ/הָשִׁיב֙ אֶת הַ/מְּלוּכָ֔ה לִ/רְחַבְעָ֖ם בֶּן שְׁלֹמֹֽה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/021.yaml
  text: When Rehoboam came to Jerusalem[a], he assembled all the house of Judah and the tribe of Benjamin, one hundred eighty thousand chosen warriors, to fight against the house of Israel, to restore the kingdom to Rehoboam son of Solomon.
translation:
  language: de
  text: Als Rehabeam nach Jerusalem kam, versammelte er das ganze Haus Juda und den Stamm Benjamin, 180.000 ausgewählte Krieger, um gegen das Haus Israel zu kämpfen und das Königtum für Rehabeam, den Sohn Salomos, wiederherzustellen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um das Königreich Rehabeam, dem Sohn Salomos, zurückzugeben“.'
    reason: מַמְלָכָה kann hier sowohl die Königsherrschaft als auch das Reich beziehungsweise die politische Herrschaftsordnung bezeichnen.
lexical_decisions:
- source_word: וַיָּבֹאוּ / ויבאו
  choice: Als Rehabeam ... kam
  rationale: Der überlieferte Konsonantentext weist eine Pluralform auf, doch Rehabeam ist das singularische Subjekt, und das folgende Verb steht ebenfalls im Singular. בוא mit Jerusalem als Ziel wird natürlich mit „nach Jerusalem kommen“ wiedergegeben.
- source_word: וַיַּקְהֵל
  choice: versammelte er
  rationale: Das Hifil von קהל bezeichnet das Zusammenrufen oder Versammeln einer Gruppe und wird so natürlich und kausativ wiedergegeben.
- source_word: כָּל בֵּית יְהוּדָה
  choice: das ganze Haus Juda
  rationale: Die politisch-kollektive Wendung „Haus Juda“ bleibt erhalten und entspricht dem späteren „Haus Israel“.
- source_word: שֵׁבֶט בִּנְיָמִן
  choice: den Stamm Benjamin
  rationale: שֵׁבֶט wird ausdrücklich übersetzt und bewahrt die stammespolitische Unterscheidung.
- source_word: מֵאָה וּשְׁמֹנִים אֶלֶף
  choice: '180.000'
  rationale: Die Zahl wird in geläufiger moderner deutscher Schreibweise wiedergegeben.
- source_word: בָּחוּר עֹשֵׂה מִלְחָמָה
  choice: ausgewählte, kampffähige Männer
  rationale: בָּחוּר kann in militärischem Zusammenhang ausgewählte Männer bezeichnen; עֹשֵׂה מִלְחָמָה beschreibt Männer, die Krieg führen können. Die Wiedergabe erhält beide Aspekte, ohne sie auf einen bloßen Altersbegriff zu reduzieren.
- source_word: לְהִלָּחֵם עִם
  choice: gegen ... kämpfen
  rationale: Im feindlichen Zusammenhang bezeichnet die Konstruktion den Kampf gegen die andere Partei.
- source_word: בֵּית יִשְׂרָאֵל
  choice: das Haus Israel
  rationale: Die politisch-kollektive Ausdrucksweise wird parallel zu „Haus Juda“ bewahrt.
- source_word: לְהָשִׁיב אֶת הַמְּלוּכָה
  choice: das Königtum ... zurückgewinnen
  rationale: Das Hifil von שׁוב bezeichnet hier das Zurückbringen beziehungsweise Wiederherstellen; מַמְלָכָה meint in diesem Zusammenhang besonders die Königsherrschaft.
- source_word: לִרְחַבְעָם בֶּן שְׁלֹמֹה
  choice: für Rehabeam, den Sohn Salomos
  rationale: Die Präposition ל kennzeichnet Rehabeam als Begünstigten der wiederzugewinnenden Königsherrschaft.
theological_decisions:
- issue: Politische Bedeutung von מַמְלָכָה
  choice: Königtum
  alternative: Königreich
  rationale: Der Zusammenhang betrifft die Wiederherstellung der königlichen Herrschaft Rehabeams, nicht primär die Rückgewinnung eines Territoriums. „Königtum“ erhält diese Nuance; „Königreich“ bleibt als mögliche kontextuelle Wiedergabe in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die politisch-kollektiven Ausdrücke „Haus Juda“ und „Haus Israel“ bleiben bewusst erhalten. Ein Doppelpunkt und zwei Sätze entlasten den langen hebräischen Satz, ohne seine inhaltliche Abfolge zu verändern.
