base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/014.yaml
  text: He spoke to them according to the advice of the young men[a], saying, “My father made your yoke heavy, and I will add to your yoke. My father disciplined you with whips, but I will discipline you with scorpions.”
translation:
  language: de
  text: 'Er sprach zu ihnen nach dem Rat der jungen Männer und sagte: »Mein Vater hat euer Joch schwer gemacht, und ich werde eurem Joch noch mehr hinzufügen. Mein Vater hat euch mit Peitschen gezüchtigt; ich aber werde euch mit Skorpionen[a] züchtigen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: »Skorpionpeitschen«, das heißt Peitschen mit scharfen Spitzen oder Widerhaken; wörtlich steht im Hebräischen: »mit Skorpionen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Er redete
  rationale: Das Piel von דבר bedeutet gewöhnlich »reden/sprechen«. Im Zusammenhang handelt es sich um Rehabeams Antwort, doch »redete« bleibt näher am hebräischen Wortlaut als »antwortete«.
- source_word: כַּעֲצַת הַיְלָדִים
  choice: nach dem Rat der jungen Männer
  rationale: עֵצָה bezeichnet Rat oder Ratschlag; הַיְלָדִים meint hier die jüngeren Ratgeber im Gegensatz zu den Ältesten. »Junge Männer« gibt ihre gesellschaftliche Rolle natürlich wieder.
- source_word: הִכְבִּיד אֶת עֻלְּכֶם
  choice: hat euer Joch schwer gemacht
  rationale: Die konkrete Jochmetapher des Hebräischen bleibt erhalten; sie bezeichnet die auferlegte Last der Herrschaft und Arbeit.
- source_word: אֹסִיף עַל עֻלְּכֶם
  choice: ich werde euer Joch noch schwerer machen
  rationale: Wörtlich steht »ich werde zu eurem Joch hinzufügen«. Die gewählte deutsche Form gibt den Sinn natürlich wieder und führt die Jochmetapher fort.
- source_word: יִסַּר / אֲיַסֵּר
  choice: hat ... gezüchtigt / werde ... züchtigen
  rationale: יסר kann korrigierende Züchtigung oder strafende Disziplinierung bezeichnen. »Züchtigen« bewahrt hier sowohl die körperliche als auch die strafende Dimension und passt zur Nennung der Peitschen.
- source_word: בַּשּׁוֹטִים
  choice: mit Peitschen
  rationale: שׁוֹט bezeichnet eine Peitsche oder Geißel; »Peitschen« ist die klare, geläufige Entsprechung.
- source_word: בָּעַקְרַבִּים
  choice: mit Skorpionen
  rationale: Der hebräische Text nennt wörtlich »Skorpione«. Das konkrete Bild bleibt im Haupttext stehen; die mögliche Bezeichnung besonderer Peitschen wird in der Fußnote erläutert.
theological_decisions:
- issue: Bedeutung des Strafbildes »Skorpione«
  choice: Das wörtliche Bild »Skorpione« bleibt im Haupttext erhalten.
  alternative: Idiomatologisch als »Skorpionpeitschen« wiedergeben.
  rationale: Ob tatsächliche Skorpione bildlich gemeint sind oder mit Spitzen beziehungsweise Widerhaken versehene Peitschen bezeichnet werden, ist nicht völlig eindeutig. Die Übersetzung entscheidet diese Spannung nicht stillschweigend, sondern nennt die wahrscheinliche Sachbedeutung in einer Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkrete Jochmetapher und das drastische Bild der Skorpione werden bewahrt; die Satzverknüpfung ist natürlich und folgt zugleich eng dem hebräischen Aufbau.
