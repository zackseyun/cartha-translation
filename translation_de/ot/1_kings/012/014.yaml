  to: 'Er sprach zu ihnen nach dem Rat der jungen Männer und sagte: »Mein Vater hat euer Joch schwer gemacht, und ich werde eurem Joch noch mehr hinzufügen. Mein Vater hat euch mit Peitschen gezüchtigt; ich aber werde euch mit Skorpionen[a] züchtigen.«'
