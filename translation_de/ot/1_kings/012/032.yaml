source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ יָרָבְעָ֣ם חָ֡ג בַּ/חֹ֣דֶשׁ הַ/שְּׁמִינִ֣י בַּ/חֲמִשָּֽׁה עָשָׂר֩ י֨וֹם לַ/חֹ֜דֶשׁ כֶּ/חָ֣ג אֲשֶׁ֣ר בִּ/יהוּדָ֗ה וַ/יַּ֨עַל֙ עַל הַ/מִּזְבֵּ֔חַ כֵּ֤ן עָשָׂה֙ בְּ/בֵֽית אֵ֔ל לְ/זַבֵּ֖חַ לָ/עֲגָלִ֣ים אֲשֶׁר עָשָׂ֑ה וְ/הֶעֱמִיד֙ בְּ/בֵ֣ית אֵ֔ל אֶת כֹּהֲנֵ֥י הַ/בָּמ֖וֹת אֲשֶׁ֥ר עָשָֽׂה׀־׀׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/032.yaml
  text: Jeroboam made a feast in the eighth month[a], on the fifteenth day of the month, like the feast that was in Judah, and he went up to the altar. So he did in Bethel, sacrificing to the calves that he had made[b]; and he installed in Bethel the priests of the high places that he had made.
translation:
  language: de
  text: 'Jerobeam führte im achten Monat[a], am fünfzehnten Tag des Monats, ein Fest ein, wie das Fest in Juda, und stieg zum Altar hinauf.[b] So tat er es in Bethel: Er brachte den Kälbern, die er gemacht hatte, Schlachtopfer dar und setzte in Bethel die Priester der von ihm errichteten Kulthöhen ein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Fest in Juda ist wahrscheinlich das Laubhüttenfest, das am fünfzehnten Tag des siebten Monats gefeiert wurde. Jerobeam legte sein konkurrierendes Fest auf einen Monat später.
    reason: cross_reference
  - marker: b
    text: 'Wörtlich auch möglich: „stieg auf den Altar hinauf“. Im Zusammenhang kann die hebräische Wendung das Hinaufsteigen zum Altar bezeichnen, um dort den Kult zu vollziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... חָג
  choice: setzte ... ein Fest ein
  rationale: עשה mit חג kann das Veranstalten oder Einrichten eines Festes bezeichnen. Im Kontext von Jerobeams neuer Kultordnung bringt „setzte ... ein“ den initiierenden Charakter zum Ausdruck, ohne über den Text hinauszugehen.
- source_word: בַּחֹדֶשׁ הַשְּׁמִינִי
  choice: im achten Monat
  rationale: Direkte und natürliche Wiedergabe der hebräischen Zeitangabe.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: am fünfzehnten Tag des Monats
  rationale: Entspricht der hebräischen Datumsformel in idiomatischem Deutsch.
- source_word: כֶּחָג אֲשֶׁר בִּיהוּדָה
  choice: wie das Fest in Juda
  rationale: Bewahrt den ausdrücklichen Vergleich, ohne das Fest im Haupttext näher zu bestimmen.
- source_word: וַיַּעַל עַל הַמִּזְבֵּחַ
  choice: stieg zum Altar hinauf
  rationale: Gibt עלה räumlich-kultisch wieder. „Zum Altar“ vermeidet die im Deutschen naheliegende, aber möglicherweise irreführende Vorstellung, er sei auf die Oberfläche des Altars gestiegen; die wörtlichere Möglichkeit wird in einer Fußnote genannt.
- source_word: כֵּן עָשָׂה בְּבֵית אֵל
  choice: So tat er es in Bethel
  rationale: כֵּן bezeichnet die Entsprechung zum zuvor beschriebenen Handeln; die Formulierung bleibt knapp und würdevoll.
- source_word: לְזַבֵּחַ לָעֲגָלִים
  choice: brachte den Kälbern ... Schlachtopfer dar
  rationale: זבח bezeichnet das Darbringen von Schlachtopfern; ל markiert hier die Ausrichtung der Opfer auf die Kälber.
- source_word: הָעֲגָלִים
  choice: die Kälber
  rationale: Wörtliche Wiedergabe; die wertende Bezeichnung „Götzenbilder“ wird nicht in den Haupttext eingeführt.
- source_word: וְהֶעֱמִיד
  choice: setzte ... ein
  rationale: Im Zusammenhang mit Priestern bezeichnet das Hifil von עמד deren Einsetzung beziehungsweise feste Bestellung; „einsetzen“ ist im Deutschen für ein kultisches Amt natürlich.
- source_word: כֹּהֲנֵי הַבָּמוֹת
  choice: die Priester der Kulthöhen
  rationale: „Kulthöhen“ bezeichnet die lokalen erhöhten oder höhenartig verstandenen Kultstätten präziser und verständlicher als das missverständliche bloße „Höhen“.
- source_word: אֲשֶׁר עָשָׂה
  choice: die er errichtet hatte
  rationale: Bei den במות bedeutet עשה sachgerecht das Anlegen oder Errichten der Kultstätten; das Plusquamperfekt verdeutlicht die zeitliche Folge.
theological_decisions:
- issue: Bestimmung des Festes in Juda
  choice: Im Haupttext bleibt es allgemein „das Fest in Juda“.
  alternative: Ausdrückliche Benennung als Laubhüttenfest.
  rationale: Der fünfzehnte Tag und der Vergleich mit Juda legen das Laubhüttenfest nahe, doch der hebräische Vers nennt es nicht. Die wahrscheinliche Identifikation steht daher nur in der Fußnote.
- issue: Bewertung von Jerobeams Kult
  choice: Die Handlungen werden ohne zusätzliche verurteilende Bezeichnungen beschrieben.
  alternative: Die Kälber als „Götzenbilder“ und die Priester als unrechtmäßig bezeichnen.
  rationale: Der weitere Erzählzusammenhang bewertet Jerobeams Kult negativ; dieser Vers selbst formuliert jedoch beschreibend. Diese Spannung soll nicht durch Zusätze aufgelöst werden.
- issue: Richtung der Schlachtopfer
  choice: „den Kälbern ... Schlachtopfer dar“
  alternative: Die Kälber lediglich als Ort oder Anlass der Opfer verstehen.
  rationale: Die Konstruktion לְזַבֵּחַ לָעֲגָלִים stellt die Kälber als Empfänger beziehungsweise kultische Bezugsgröße der Opfer dar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Schlachtopfer darbringen“, „Kulthöhen“ und „einsetzen“ bewahren den kultischen Gehalt, bleiben aber für heutige Leser verständlich. Die Satzgliederung folgt dem hebräischen Ablauf, ohne unnatürlich zu wirken.
