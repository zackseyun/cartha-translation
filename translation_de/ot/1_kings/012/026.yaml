  text: וַ/יֹּ֥אמֶר יָרָבְעָ֖ם בְּ/לִבּ֑/וֹ עַתָּ֛ה תָּשׁ֥וּב הַ/מַּמְלָכָ֖ה לְ/בֵ֥ית דָּוִֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/026.yaml
  text: And Jeroboam said in his heart[a], “Now the kingdom will return to the house of David.”
translation:
  language: de
  text: 'Da sagte Jerobeam sich[a]: »Nun wird das Königreich zum Haus Davids zurückkehren.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »in seinem Herzen«; oder: »bei sich«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter. „Da sagte“ gibt diesen Fortgang in natürlichem Deutsch wieder.
- source_word: יָרָבְעָם
  choice: Jerobeam
  rationale: Der Personenname folgt der im Deutschen gebräuchlichen biblischen Namensform.
- source_word: בְּלִבּוֹ
  choice: in seinem Herzen
  rationale: Die wörtliche Wiedergabe bewahrt das hebräische Bild für einen inneren Gedanken; die Bedeutung „zu sich selbst“ wird in der Fußnote erläutert.
- source_word: עַתָּה
  choice: Nun
  rationale: „Nun“ bewahrt knapp und natürlich den unmittelbaren zeitlichen beziehungsweise situativen Bezug.
- source_word: תָּשׁוּב
  choice: wird … zurückkehren
  rationale: Das Verb שוב bezeichnet hier die erwartete Rückkehr der Königsherrschaft zur früheren Dynastie.
- source_word: הַמַּמְלָכָה
  choice: das Königreich
  rationale: Im Kontext bezeichnet das Wort den politisch-königlichen Herrschaftsbereich.
- source_word: לְבֵית דָּוִד
  choice: zum Haus Davids
  rationale: Die feste biblische Wendung bewahrt den dynastischen Sinn und die Bezüge, die mit dem „Haus Davids“ verbunden sind.
theological_decisions:
- issue: Wiedergabe der Wendung בְּלִבּוֹ für inneres Reden
  choice: in seinem Herzen
  alternative: bei sich / zu sich selbst
  rationale: Die bildhafte Ausdrucksweise des Hebräischen bleibt erhalten, ohne den inneren Charakter der Aussage zu verschleiern; die idiomatische Alternative steht in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Bildsprache und die traditionelle dynastische Wendung „Haus Davids“ werden bewahrt.
