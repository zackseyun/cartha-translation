source:
  edition: WLC
  text: וְ/לֹֽא שָׁמַ֥ע הַ/מֶּ֖לֶךְ אֶל הָ/עָ֑ם כִּֽי הָיְתָ֤ה סִבָּה֙ מֵ/עִ֣ם יְהוָ֔ה לְמַ֜עַן הָקִ֣ים אֶת דְּבָר֗/וֹ אֲשֶׁ֨ר דִּבֶּ֤ר יְהוָה֙ בְּ/יַד֙ אֲחִיָּ֣ה הַ/שִּׁילֹנִ֔י אֶל יָרָבְעָ֖ם בֶּן נְבָֽט־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/015.yaml
  text: So the king did not listen to the people[a], for it was a turn of events from Yahweh[b], in order to establish his word that Yahweh had spoken by the hand of Ahijah the Shilonite to Jeroboam son of Nebat.
translation:
  language: de
  text: Der König hörte also nicht auf das Volk; denn dies war eine Wendung der Ereignisse von Yahweh, damit er sein Wort erfüllte, das Yahweh durch Ahija, den Schiloniter, zu Jerobeam, dem Sohn Nebats, gesprochen hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמַע אֶל
  choice: auf … hören
  rationale: Mit אֶל bezeichnet das Verb hier nicht bloß akustisches Hören, sondern das Beachten einer Bitte. „Auf das Volk hören“ ist im Deutschen natürlich und bewahrt diesen Sinn.
- source_word: הָעָם
  choice: das Volk
  rationale: Die übliche und kontextgemäße Wiedergabe für die versammelten Israeliten.
- source_word: סִבָּה
  choice: Wendung
  rationale: Das seltene Substantiv kann Ursache, Anlass oder eine Wendung der Umstände bezeichnen. „Wendung“ passt zum erzählten Geschehensablauf, ohne die bestehende Mehrdeutigkeit ganz aufzulösen.
- source_word: מֵעִם יְהוָה
  choice: kam von Yahweh
  rationale: מֵעִם kennzeichnet Yahweh als Ursprung des Geschehens. Die Formulierung wahrt die Aussage göttlicher Lenkung, ohne deren genaue Wirkungsweise auszudeuten.
- source_word: לְמַעַן הָקִים אֶת דְּבָרוֹ
  choice: So sollte sein Wort wahr werden
  rationale: לְמַעַן bezeichnet Zweck beziehungsweise Ziel, und הֵקִים mit „Wort“ meint dessen Bestätigung oder Verwirklichung. Die deutsche Wendung ist verständlich und gibt prophetische Erfüllung wieder, ohne דָּבָר zu „Verheißung“ zu verengen.
- source_word: דִּבֶּר
  choice: gesprochen hatte
  rationale: Das Plusquamperfekt verdeutlicht im Deutschen, dass Yahwehs Wort zeitlich vor dem gegenwärtigen Geschehen ergangen war.
- source_word: בְּיַד
  choice: durch
  rationale: Die wörtliche Bedeutung „durch die Hand“ ist hier ein hebräisches Idiom für Vermittlung beziehungsweise Beauftragung. „Durch“ gibt die gemeinte Funktion natürlich wieder.
- source_word: הַשִּׁילֹנִי
  choice: aus Schilo
  rationale: Das Gentiliz bezeichnet Ahija nach seiner Herkunft oder Zugehörigkeit zu Schilo. „Aus Schilo“ ist im heutigen Deutsch verständlicher als „der Schiloniter“.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jerobeam, dem Sohn Nebats
  rationale: Bewahrt Name und Patronym in idiomatischer deutscher Form.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname „Yahweh“ wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Göttliche Lenkung und menschliches Handeln
  choice: Die Wendung des Geschehens kommt von Yahweh und dient dazu, sein zuvor gesprochenes Wort zu verwirklichen.
  alternative: Das Geschehen lediglich als von Yahweh zugelassen darzustellen oder Yahweh ausdrücklich zum unmittelbaren Verursacher der Weigerung des Königs zu erklären.
  rationale: Der hebräische Text nennt Yahweh ausdrücklich als Ursprung der סִבָּה und verbindet dies mit einem Zwecksatz. Er legt jedoch nicht näher dar, wie göttliches Wirken und die Verantwortung des Königs zueinander stehen; diese Spannung bleibt erhalten.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der im Ausgangstext stehende Eigenname wird als „Yahweh“ wiedergegeben.
- issue: Zweck und Erfüllung des prophetischen Wortes
  choice: „So sollte sein Wort wahr werden“ gibt das Ziel des Geschehens wieder.
  alternative: „damit er sein Wort bestätigte“ oder „damit sich sein Wort erfüllte“
  rationale: Die gewählte Formulierung wahrt den Zweckcharakter von לְמַעַן und die Verwirklichung des Wortes durch הֵקִים, ohne einen unpersönlichen Erfüllungsablauf zu suggerieren oder eine technische Bundesformel zu erzwingen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der erste Satz folgt dem hebräischen Begründungszusammenhang eng; der zweite teilt den langen Ausgangssatz zugunsten guter Verständlichkeit. „Auf das Volk hören“ und „sein Wort wahr werden“ sind allgemein verständlich, ohne die theologische Spannung des Verses zu glätten.
