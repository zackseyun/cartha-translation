base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/007.yaml
  text: And he spoke to him[a], saying, “If today you will be a servant to this people, and serve them, and answer them, and speak good words to them[b], then they will be your servants all your days.”
translation:
  language: de
  text: 'Und er sprach zu ihm: »Wenn du heute diesem Volk ein Diener wirst und ihnen dienst, ihnen antwortest und gute Worte zu ihnen sprichst[a], dann werden sie dir allezeit Diener sein.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »freundlich zu ihnen redest«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »dann werden sie dir für immer dienen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶבֶד
  choice: Diener
  rationale: Das Wort bezeichnet je nach Zusammenhang einen Sklaven oder Diener. Hier geht es bildhaft um die dienende Haltung des Königs gegenüber dem Volk; »Diener« trifft diesen politischen und relationalen Sinn.
- source_word: וַעֲבַדְתָּם
  choice: ihnen dienst
  rationale: Bewahrt die Wortverbindung mit עֶבֶד und damit den beabsichtigten Gegensatz zwischen dem gegenwärtigen Dienst des Königs und dem späteren Dienst des Volkes.
- source_word: וַעֲנִיתָם
  choice: ihnen antwortest
  rationale: ענה bedeutet hier im Zusammenhang mit der Bitte des Volkes »antworten« oder »erwidern«, nicht »bedrängen«.
- source_word: דְּבָרִים טוֹבִים
  choice: gute Worte
  rationale: Die relativ formale Wiedergabe bleibt im Deutschen verständlich und erhält die offene Bedeutung des Hebräischen; gemeint sein können auch freundliche oder entgegenkommende Worte.
- source_word: וְהָיוּ לְךָ עֲבָדִים
  choice: werden sie dir Diener sein
  rationale: Die substantivische Form wird beibehalten, sodass die wechselseitige Diener-Metaphorik des Verses sichtbar bleibt.
- source_word: כָּל הַיָּמִים
  choice: allezeit
  rationale: Gibt die hebräische Zeitangabe idiomatisch und würdevoll als dauerhafte Bindung wieder, ohne sie ausdrücklich auf Rehabeams Lebenszeit einzuengen.
- source_word: אִם הַיּוֹם
  choice: Wenn du heute
  rationale: 'Erhält die zeitliche Zuspitzung: Der König soll sich in der gegenwärtigen Krise sofort für eine dienende Haltung entscheiden.'
- source_word: וַיְדַבֵּר אֵלָיו לֵאמֹר
  choice: Und er sprach zu ihm
  rationale: Folgt der im bereitgestellten Ausgangstext vorliegenden Singularform und gibt die hebräische Redeeinleitung in natürlichem, gehobenem Deutsch wieder.
theological_decisions:
- issue: Politisches Bild vom Königtum als Dienst
  choice: Die Sprache von Diener und Dienen wird unmittelbar und wechselseitig wiedergegeben.
  alternative: Mit rein politisch-administrativen Ausdrücken wie »dem Volk entgegenkommen« oder »seine Untertanen gewinnen« übersetzen.
  rationale: Der Vers erteilt praktischen politischen Rat, formuliert ihn aber bewusst als Umkehrung des Dienstverhältnisses. Die Übersetzung bewahrt diese Spannung, ohne spätere theologische Vorstellungen einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdevoller biblischer Erzählweise. Die parallelen Formen »Diener« und »dienen« bewahren das zentrale Wortspiel; »allezeit« ist gehoben, aber geläufig. Sämtliche Fußnotenmarker stehen unmittelbar an der jeweils erläuterten Wendung.
