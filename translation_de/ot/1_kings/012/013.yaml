  text: וַ/יַּ֧עַן הַ/מֶּ֛לֶךְ אֶת הָ/עָ֖ם קָשָׁ֑ה וַֽ/יַּעֲזֹ֛ב אֶת עֲצַ֥ת הַ/זְּקֵנִ֖ים אֲשֶׁ֥ר יְעָצֻֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/013.yaml
  text: And the king answered the people harshly, and he abandoned the counsel of the elders who had advised him.
translation:
  language: de
  text: Doch der König antwortete dem Volk hart und verwarf den Rat der Ältesten, den sie ihm gegeben hatten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: antwortete
  rationale: Das Qal von ענה bezeichnet hier die Antwort auf die zuvor vorgetragene Bitte des Volkes; „antwortete“ gibt den Erzählzusammenhang natürlich wieder.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Der bestimmte Ausdruck verweist auf den aus dem Zusammenhang bekannten König.
- source_word: הָעָם
  choice: dem Volk
  rationale: עם bezeichnet hier das versammelte Volk Israel; wegen der deutschen Rektion von „antworten“ steht der Dativ.
- source_word: קָשָׁה
  choice: hart
  rationale: Das Wort beschreibt adverbial die Art der Antwort. „Hart“ ist knapp, verständlich und bewahrt die Schärfe des Hebräischen.
- source_word: וַיַּעֲזֹב
  choice: verwarf
  rationale: עזב bedeutet grundsätzlich „verlassen, aufgeben“. Im Zusammenhang eines erteilten Rates drückt „verwarf“ das entschiedene Beiseitesetzen idiomatisch aus.
- source_word: עֲצַת
  choice: den Rat
  rationale: עצה bezeichnet hier den beratenden Rat der königlichen Ratgeber; „Rat“ ist im modernen Deutschen natürlicher als „Ratschluss“.
- source_word: הַזְּקֵנִים
  choice: der Ältesten
  rationale: זקנים bezeichnet die anerkannten älteren Berater des Königs und nicht lediglich alte Männer; „Älteste“ erhält diese gesellschaftlich-politische Funktion.
- source_word: אֲשֶׁר יְעָצֻהוּ
  choice: den sie ihm gegeben hatten
  rationale: Der Relativsatz bezieht sich grammatisch am natürlichsten auf „Rat“. Das Plusquamperfekt macht deutlich, dass die Beratung der Verwerfung vorausging.
