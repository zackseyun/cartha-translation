  text: וַ/יְהִ֞י כִּ/שְׁמֹ֣עַ יָרָבְעָ֣ם בֶּן נְבָ֗ט וְ/הוּא֙ עוֹדֶ֣/נּוּ בְ/מִצְרַ֔יִם אֲשֶׁ֣ר בָּרַ֔ח מִ/פְּנֵ֖י הַ/מֶּ֣לֶךְ שְׁלֹמֹ֑ה וַ/יֵּ֥שֶׁב יָרָבְעָ֖ם בְּ/מִצְרָֽיִם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/002.yaml
  text: When Jeroboam son of Nebat heard of it—while he was still in Egypt[a], where he had fled from King Solomon—Jeroboam was still living in Egypt.
translation:
  language: de
  text: Als Jerobeam, der Sohn Nebats, davon[a] hörte – er war noch in Ägypten, wohin er vor König Salomo geflohen war –, blieb Jerobeam in Ägypten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Hebräischen nur »als Jerobeam … hörte«; was er hörte, ergibt sich aus dem Zusammenhang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Als ... davon hörte
  rationale: Die Konstruktion mit כ und Infinitiv bildet einen temporalen Nebensatz. Das im Hebräischen nicht ausgedrückte Objekt von »hören« wird im Deutschen kontextgemäß und ohne nähere Festlegung mit »davon« wiedergegeben.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jerobeam, der Sohn Nebats
  rationale: Die traditionellen deutschen Namensformen werden verwendet; die Abstammungsangabe bleibt vollständig erhalten.
- source_word: וְהוּא עוֹדֶנּוּ בְמִצְרַיִם
  choice: er war noch in Ägypten
  rationale: Die eingeschobene Umstandsangabe bezeichnet Jerobeams fortdauernden Aufenthaltsort zu diesem Zeitpunkt.
- source_word: אֲשֶׁר בָּרַח מִפְּנֵי הַמֶּלֶךְ שְׁלֹמֹה
  choice: wohin er vor König Salomo geflohen war
  rationale: Das relative אֲשֶׁר bezieht sich sinngemäß auf Ägypten als Ziel der Flucht. »Vor ... fliehen« gibt מִפְּנֵי idiomatisch und präzise wieder.
- source_word: וַיֵּשֶׁב יָרָבְעָם בְּמִצְרָיִם
  choice: blieb Jerobeam in Ägypten
  rationale: ישב kann wohnen, sich aufhalten oder bleiben bedeuten. Hier hebt der Erzähler den fortgesetzten Aufenthalt in Ägypten hervor; »blieb« vermeidet zugleich eine unnatürliche Wiederholung von »war noch«.
theological_decisions: []
