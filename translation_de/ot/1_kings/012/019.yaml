  text: So Israel has rebelled against the house of David to this day[a].
translation:
  language: de
  text: So lehnte sich Israel gegen das Haus Davids auf bis zum heutigen Tag.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „So lehnte sich Israel gegen das Haus Davids auf bis zum heutigen Tag.“'
    reason: Die hebräische Formulierung verbindet die Auflehnung unmittelbar mit der Zeitangabe; sie kann sowohl den fortbestehenden Bruch als auch dessen Geltung bis zur Gegenwart des Erzählers einschließen.
lexical_decisions:
- source_word: וַיִּפְשְׁעוּ
  choice: lehnte sich … auf
  rationale: פשע bezeichnet hier im politischen Zusammenhang Auflehnung beziehungsweise Rebellion. Die Formulierung ist im modernen Deutschen natürlich und wahrt den politischen Sinn.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Eigenname bleibt erhalten und bezeichnet hier kollektiv die nördlichen Stämme im Gegensatz zur davidischen Dynastie.
- source_word: בְּבֵית דָּוִד
  choice: gegen das Haus David
  rationale: Die Präposition בְּ bezeichnet bei פשע die Partei, gegen die sich die Auflehnung richtet. „Haus David“ bewahrt den dynastischen Sinn.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: und so ist es bis zum heutigen Tag geblieben
  rationale: Die hebräische Wendung bezeichnet das Fortbestehen des durch die Auflehnung entstandenen Zustands bis in die Gegenwart des Erzählers. Die deutsche Ergänzung macht diesen durativen Bezug natürlich verständlich.
