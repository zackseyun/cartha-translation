source:
  edition: WLC
  text: וְ/עַתָּ֗ה אָבִ/י֙ הֶעְמִ֤יס עֲלֵי/כֶם֙ עֹ֣ל כָּבֵ֔ד וַ/אֲנִ֖י אוֹסִ֣יף עַֽל עֻלְּ/כֶ֑ם אָבִ֗/י יִסַּ֤ר אֶתְ/כֶם֙ בַּ/שּׁוֹטִ֔ים וַ/אֲנִ֕י אֲיַסֵּ֥ר אֶתְ/כֶ֖ם בָּ/עַקְרַבִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/011.yaml
  text: And now[a], my father made your yoke heavy, but I will add to your yoke. My father disciplined you with whips, but I will discipline you with scorpions.
translation:
  language: de
  text: 'Und nun: Mein Vater hat euch ein schweres Joch auferlegt; ich aber werde euer Joch noch schwerer machen. Mein Vater hat euch mit Peitschen gezüchtigt; ich aber werde euch mit Skorpionen züchtigen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Möglicherweise sind „Skorpionpeitschen“ gemeint, also besonders schmerzhafte Peitschen oder Geißeln; wörtlich steht im Hebräischen „mit Skorpionen“.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעְמִיס ... עֹל כָּבֵד
  choice: hat euch ein schweres Joch auferlegt
  rationale: Das Hifil von עמס bezeichnet das Aufladen beziehungsweise Auferlegen einer Last. Die Formulierung bewahrt mit „Joch“ und „schwer“ das konkrete hebräische Herrschaftsbild und klingt zugleich natürlich auf Deutsch.
- source_word: עֹל / עֻלְּכֶם
  choice: Joch / euer Joch
  rationale: „Joch“ erhält die konkrete Metapher für bedrückende Herrschaft oder Fronarbeit; die Wiederholung trägt die rhetorische Steigerung.
- source_word: אוֹסִיף עַל עֻלְּכֶם
  choice: werde euer Joch noch schwerer machen
  rationale: Wörtlich steht „werde zu eurem Joch hinzufügen“. Die gewählte idiomatische Wiedergabe macht die gemeinte Verschärfung deutlich, ohne die Jochmetapher aufzugeben.
- source_word: יִסַּר / אֲיַסֵּר
  choice: hat ... gezüchtigt / werde ... züchtigen
  rationale: יסר kann erziehen, zurechtweisen oder körperlich züchtigen bedeuten. Im Zusammenhang mit Peitschen und einer königlichen Drohung gibt „züchtigen“ die körperliche Härte genauer wieder als das im Deutschen oft pädagogisch verstandene „disziplinieren“.
- source_word: בַּשּׁוֹטִים
  choice: mit Peitschen
  rationale: שׁוֹטִים bezeichnet Peitschen oder Geißeln; „Peitschen“ ist direkt und allgemein verständlich.
- source_word: בָּעַקְרַבִּים
  choice: mit Skorpionen
  rationale: Der hebräische Ausdruck bedeutet wörtlich „mit Skorpionen“. Die möglicherweise übertragene Bezeichnung besonders schmerzhafter Peitschen wird nicht in den Haupttext eingetragen, sondern in einer Fußnote erläutert.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Drohstruktur wird durch „Mein Vater ...; ich aber ...“ erhalten. „Züchtigen“ ist wegen des ausdrücklich körperlichen Mittels kontextuell präzise, obwohl es gehobener klingt als Alltagssprache.
