  to: 'So spricht Jahwe: »Zieht nicht hinauf und kämpft nicht gegen eure Brüder, die Israeliten.[a] Kehrt um, jeder in sein Haus; denn diese Sache ist von mir her geschehen.«[b] Da hörten sie auf das Wort Jahwes und kehrten um, um dem Wort Jahwes gemäß zu handeln.'
  rationale: Die Revision berichtigt die unzutreffende Angabe zur wörtlichen Form in Fußnote a, vermeidet mit „heimzugehen“ eine nicht ausdrücklich wiederholte Zielangabe und fasst die Schlusswendung so, dass sie sowohl die Umkehr als auch die Ausrichtung am Wort Jahwes natürlich und quellennah ausdrückt. Die Ambiguität hinsichtlich der genauen Weise des göttlichen Ursprungs bleibt gewahrt.
