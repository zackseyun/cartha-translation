    rationale: Das Verb bedeutet „zu gehen“. Obwohl die vorherige Aufforderung zur Rückkehr ins jeweilige Haus den Kontext bildet, wiederholt der Schlusssatz kein Ziel. Eine allgemeinere Formulierung bewahrt den Wortlaut besser.
  - severity: low
    issue: „ist von mir ausgegangen“ ist als Umschreibung möglich, aber weniger nah an נִהְיָה als „ist von mir her geschehen“.
    rationale: Die revidierte Formulierung wahrt den göttlichen Ursprung des Geschehens, ohne eine Art von Verursachung näher festzulegen.
