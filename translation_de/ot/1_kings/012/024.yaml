    issue: Fußnote a bezeichnet „gegen eure Brüder“ fälschlich als wörtliche Wiedergabe.
    rationale: Im hebräischen Text steht עִם, wörtlich „mit“. Bei לחם („kämpfen“) ist die idiomatische deutsche Wiedergabe „gegen“ sachlich richtig, darf aber nicht als wörtlich ausgegeben werden.
  - severity: low
