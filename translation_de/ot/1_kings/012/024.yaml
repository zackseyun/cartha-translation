  text: כֹּ֣ה אָמַ֣ר יְהוָ֡ה לֹֽא תַעֲלוּ֩ וְ/לֹא תִלָּ֨חֲמ֜וּ/ן עִם אֲחֵי/כֶ֣ם בְּנֵֽי יִשְׂרָאֵ֗ל שׁ֚וּבוּ אִ֣ישׁ לְ/בֵית֔/וֹ כִּ֧י מֵ/אִתִּ֛/י נִהְיָ֖ה הַ/דָּבָ֣ר הַ/זֶּ֑ה וַ/יִּשְׁמְעוּ֙ אֶת דְּבַ֣ר יְהוָ֔ה וַ/יָּשֻׁ֥בוּ לָ/לֶ֖כֶת כִּ/דְבַ֥ר יְהוָֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/024.yaml
  text: 'Thus says Yahweh: ‘Do not go up or fight against your brothers[a], the sons of Israel. Return, each man to his house[c][b], for this thing is from me.’ So they listened to the word of Yahweh and turned back to go according to the word of Yahweh.'
translation:
  language: de
  text: 'So spricht Jahwe: »Zieht nicht hinauf und kämpft nicht gegen eure Brüder, die Israeliten.[a] Kehrt um, jeder in sein Haus; denn diese Sache ist von mir her geschehen.«[b] Da hörten sie auf das Wort Jahwes und kehrten um, um dem Wort Jahwes gemäß zu handeln.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »mit euren Brüdern, den Söhnen Israels«. Im Zusammenhang mit »kämpfen« bedeutet »mit« hier idiomatisch »gegen«. Das Verwandtschaftswort betont, dass sie gegen Angehörige ihres eigenen Volkes kämpfen würden.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »denn diese Angelegenheit ist von mir« oder »denn diese Sache ist von mir her geschehen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Bewahrt die feste prophetische Botenformel und gibt den Gottesnamen direkt wieder.
- source_word: לֹא תַעֲלוּ וְלֹא תִלָּחֲמוּן
  choice: Zieht nicht hinauf und kämpft nicht
  rationale: „Hinaufziehen“ erhält die räumliche und militärische Färbung von עלה; לחם wird im Zusammenhang direkt mit „kämpfen“ wiedergegeben.
- source_word: עִם אֲחֵיכֶם בְּנֵי יִשְׂרָאֵל
  choice: gegen eure Brüder, die Israeliten
  rationale: עִם bedeutet bei לחם idiomatisch „gegen“. „Brüder“ bewahrt die wichtige Verwandtschaftssprache; „die Israeliten“ gibt die Apposition natürlich wieder.
- source_word: שׁוּבוּ אִישׁ לְבֵיתוֹ
  choice: Kehrt um, jeder in sein Haus
  rationale: Der distributive Sinn von אִישׁ bleibt erhalten, ebenso das konkrete „Haus“.
- source_word: כִּי מֵאִתִּי נִהְיָה הַדָּבָר הַזֶּה
  choice: denn diese Sache ist von mir ausgegangen
  rationale: Die Formulierung bewahrt sowohl das Geschehen als auch dessen Ursprung bei Jahwe, ohne die genaue Art seiner Verursachung weiter festzulegen.
- source_word: וַיִּשְׁמְעוּ אֶת דְּבַר יְהוָה
  choice: Da hörten sie auf das Wort Jahwes
  rationale: „Auf jemanden hören“ verbindet im Deutschen Hören und Gehorchen und lässt beide Bedeutungsanteile von שׁמע anklingen.
- source_word: וַיָּשֻׁבוּ לָלֶכֶת כִּדְבַר יְהוָה
  choice: und kehrten um, um nach dem Wort Jahwes heimzugehen
  rationale: Erhält die Verbindung von Umkehren und Gehen sowie die Übereinstimmung mit Jahwes Weisung in natürlichem Deutsch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird transparent wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Verwandtschaftsbezeichnung אֲחֵיכֶם
  choice: eure Brüder
  alternative: eure israelitischen Landsleute
  rationale: Die wörtliche Verwandtschaftssprache unterstreicht, dass ein Kampf gegen Angehörige desselben Volkes befohlen werden sollte zu unterbleiben.
- issue: Göttlicher Ursprung des politischen Geschehens
  choice: diese Sache ist von mir ausgegangen
  alternative: diese Sache ist durch mich geschehen
  rationale: „Von mir ausgegangen“ wahrt die Aussage göttlichen Ursprungs, ohne „durch mich“ als stärkere Aussage unmittelbarer Verursachung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit erkennbarer prophetischer Sprachform. Leicht formelle Wendungen wie „So spricht“ und „nach dem Wort“ bewahren den biblischen Ton, ohne unnötig altertümlich zu wirken.
