base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/006.yaml
  text: Then King Rehoboam consulted the elders who had stood before Solomon his father while he was still alive[a], saying[b], “How do you advise me to answer this people?”
translation:
  language: de
  text: 'Da beriet sich König Rehabeam mit den Ältesten, die zu Lebzeiten seines Vaters Salomo in dessen Dienst gestanden hatten.[a] Er fragte sie: „Wie ratet ihr mir, diesem Volk zu antworten?“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die vor dem Angesicht Salomos, seines Vaters, gestanden hatten, als er lebte“. „Vor jemandem stehen“ kann hier den Dienst in seiner Gegenwart bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Wie ratet ihr, diesem Volk ein Wort zu erwidern?“ Gemeint ist, ihm eine Antwort zu geben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: beriet sich … mit
  rationale: Das Nifal von יעץ bezeichnet hier das Einholen von Rat; die deutsche Wendung ist natürlich und bewahrt den beratenden Charakter.
- source_word: הַזְּקֵנִים
  choice: die Ältesten
  rationale: Im höfischen Zusammenhang sind erfahrene Würdenträger oder Ratgeber gemeint, nicht lediglich alte Männer.
- source_word: אֲשֶׁר הָיוּ עֹמְדִים אֶת־פְּנֵי שְׁלֹמֹה
  choice: die … in dessen Dienst gestanden hatten
  rationale: Die hebräische Wendung »vor jemandem stehen« bezeichnet hier den Dienst beziehungsweise die persönliche Anwesenheit am königlichen Hof. Die Übersetzung gibt den idiomatischen Sinn wieder.
- source_word: בִּהְיֹתוֹ חַי
  choice: zu Lebzeiten
  rationale: Die knappe deutsche Formulierung gibt den temporalen Nebensatz präzise und natürlich wieder.
- source_word: אֵיךְ אַתֶּם נוֹעָצִים
  choice: Was ratet ihr mir
  rationale: Das Fragewort אֵיךְ ist wörtlich »wie«; im Deutschen wird eine Bitte um einen konkreten Rat idiomatisch mit »was« formuliert. »Mir« ist aus der Beratungssituation erschlossen.
- source_word: לְהָשִׁיב אֶת־הָעָם הַזֶּה דָּבָר
  choice: diesem Volk zu antworten
  rationale: Die Konstruktion bedeutet wörtlich, dem Volk »ein Wort zurückzugeben«, also ihm eine Antwort zu erteilen. Die deutsche Formulierung vermeidet eine unnötige Doppelung.
