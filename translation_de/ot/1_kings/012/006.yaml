translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die höfische Funktion der Ältesten wird idiomatisch ausgedrückt; die konkretere hebräische Bildsprache und die wörtliche Form der abschließenden Frage werden in den Fußnoten bewahrt.
