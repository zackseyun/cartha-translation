id: 1KI.12.23
reference: 1 Kings 12:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֱמֹ֗ר אֶל רְחַבְעָ֤ם בֶּן שְׁלֹמֹה֙ מֶ֣לֶךְ יְהוּדָ֔ה וְ/אֶל כָּל בֵּ֥ית יְהוּדָ֖ה וּ/בִנְיָמִ֑ין וְ/יֶ֥תֶר הָ/עָ֖ם לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/023.yaml
  text: Speak to Rehoboam son of Solomon[a], king of Judah, and to all the house of Judah and Benjamin, and the rest of the people, saying[c][b],
translation:
  language: de
  text: Sprich zu Rehabeam, dem Sohn Salomos, dem König von Juda, und zum ganzen Haus Juda und zu Benjamin sowie zum übrigen Volk:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »… und zum übrigen Volk, indem du sagst«. Die Botschaft folgt in Vers 24.'
    reason: Der Doppelpunkt gibt die Funktion des hebräischen Quotativs לֵאמֹר in natürlichem Deutsch wieder.
lexical_decisions:
- source_word: אֱמֹר
  choice: Sprich
  rationale: Der Imperativ von אמר beauftragt zur Übermittlung einer Botschaft; »Sprich zu« ist im Deutschen natürlich und bewahrt den feierlichen Befehlston.
- source_word: בֶּן שְׁלֹמֹה
  choice: dem Sohn Salomos
  rationale: Die hebräische Constructusverbindung bezeichnet Rehabeams Abstammung; nach »zu Rehabeam« stehen die Appositionen idiomatisch im Dativ.
- source_word: מֶלֶךְ יְהוּדָה
  choice: dem König von Juda
  rationale: Der Königstitel wird direkt und in natürlichem Deutsch wiedergegeben.
- source_word: כָּל בֵּית יְהוּדָה
  choice: zum ganzen Haus Juda
  rationale: »Haus Juda« bewahrt die politische und gemeinschaftliche Kollektivbezeichnung des Hebräischen, ohne sie auf ein bloßes Gebiet zu reduzieren.
- source_word: וּבִנְיָמִין
  choice: und zu Benjamin
  rationale: Der Stammesname steht im Hebräischen selbstständig; die wiederholte Präposition macht im Deutschen deutlich, dass auch Benjamin Adressat ist.
- source_word: וְיֶתֶר הָעָם
  choice: sowie zum übrigen Volk
  rationale: יֶתֶר bezeichnet den verbleibenden Teil, הָעָם das Volk. »Übriges Volk« wahrt, dass der Text hier nicht ausdrücklich »Heer« sagt.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der hebräische Quotativ leitet die in Vers 24 folgende Botschaft ein. Im modernen Deutschen erfüllt ein Doppelpunkt diese Funktion natürlicher als das schwerfällige »und sprich:«.
theological_decisions:
- issue: Bezug von הָעָם im Kriegskontext
  choice: Volk
  alternative: Heer
  rationale: Obwohl der Kontext die zum Kampf Versammelten meint, bezeichnet das hebräische Wort sie in diesem Vers allgemein als »Volk«; die Übersetzung vermeidet eine unnötige Präzisierung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle und zugleich verständliche Kollektivbezeichnung »Haus Juda« bleibt erhalten; die Satzstellung wurde für klare deutsche Dativbezüge geglättet.
