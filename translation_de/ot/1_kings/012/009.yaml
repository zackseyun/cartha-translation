base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/009.yaml
  text: And he said to them[a], “What do you advise, that we may answer this people who have spoken to me, saying[b], ‘Lighten the yoke that your father put on us’?”
translation:
  language: de
  text: 'Und er sagte zu ihnen: „Was ratet ihr, damit wir diesem Volk antworten, das zu mir gesagt hat: ‚Mache das Joch[a] leichter, das dein Vater uns auferlegt hat!‘?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das „Joch“ ist hier ein Bild für die schwere Arbeit und die Verpflichtungen, die der König dem Volk auferlegt hatte.
    reason: cultural_note
lexical_decisions:
- source_word: מָה אַתֶּם נוֹעָצִים
  choice: Was ratet ihr
  rationale: Die partizipiale Form fragt nach dem gegenwärtigen Rat der Angesprochenen; die Wendung ist im modernen Deutschen natürlich und direkt.
- source_word: וְנָשִׁיב דָּבָר
  choice: damit wir … antworten können
  rationale: Die hebräische Wendung bedeutet wörtlich etwa „ein Wort zurückbringen“ und idiomatisch „eine Antwort geben“. „Damit“ gibt den Zweckzusammenhang natürlich wieder.
- source_word: הָעָם הַזֶּה
  choice: diesem Volk
  rationale: Bewahrt das kollektive Singularwort עָם und den demonstrativen, möglicherweise distanzierenden Ton.
- source_word: אֲשֶׁר דִּבְּרוּ אֵלַי לֵאמֹר
  choice: das zu mir gesagt hat
  rationale: Gibt die einleitende Redewendung idiomatisch wieder, ohne die im Deutschen schwerfällige wörtliche Doppelung „sprach … und sagte“.
- source_word: הָקֵל מִן הָעֹל
  choice: Mache das Joch leichter
  rationale: Erhält das konkrete Bild des Jochs und gibt den Imperativ הָקֵל präzise als Verringerung der Last wieder.
- source_word: אֲשֶׁר נָתַן אָבִיךָ עָלֵינוּ
  choice: das dein Vater uns auferlegt hat
  rationale: „Auferlegt“ ist eine natürliche deutsche Wiedergabe von נתן על und passt sowohl zum konkreten Jochbild als auch zu seiner übertragenen Bedeutung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt klar und mündlich; das Jochbild wird nicht zu „Last“ verflacht. Auf eine Fußnote zur hebräischen Antwort-Wendung wird verzichtet, da sie für deutschsprachige Leser keinen wesentlichen zusätzlichen Sinngehalt bietet.
