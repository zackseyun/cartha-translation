id: 1KI.12.29
reference: 1 Kings 12:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יָּ֥שֶׂם אֶת הָ/אֶחָ֖ד בְּ/בֵֽית אֵ֑ל וְ/אֶת הָ/אֶחָ֖ד נָתַ֥ן בְּ/דָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/029.yaml
  text: He set one in Bethel[a], and the other he put in Dan.
translation:
  language: de
  text: Er stellte das eine in Bethel[a] auf und das andere in Dan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gemeint ist eines der beiden im vorherigen Vers genannten Kälber. Möglich ist daher auch: »Er stellte das eine Kalb in Bethel auf und das andere in Dan.«'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Er stellte … auf
  rationale: שׂים bedeutet hier »setzen, stellen, aufstellen«. Bei einem Kultbild ist »aufstellen« im Deutschen natürlich und gibt die beabsichtigte Platzierung treffend wieder.
- source_word: אֶת הָאֶחָד
  choice: das eine
  rationale: Die bestimmte Form bezeichnet in der Gegenüberstellung eines von zwei zuvor genannten Objekten. »Das eine« bewahrt den impliziten Rückverweis, ohne »Kalb« zu ergänzen.
- source_word: בְּבֵית אֵל
  choice: in Bethel
  rationale: בְּ bezeichnet hier den Ort; der etablierte deutsche Ortsname lautet »Bethel«.
- source_word: וְאֶת הָאֶחָד
  choice: und das andere
  rationale: Wörtlich steht erneut »und das eine«; in der deutschen paarweisen Gegenüberstellung ist »und das andere« idiomatisch und eindeutig.
- source_word: נָתַן
  choice: '[stellte] … in Dan'
  rationale: נתן kann in räumlichem Zusammenhang »setzen, stellen, platzieren« bedeuten. Das gemeinsame Verb »stellte … auf« wird im Deutschen über beide Satzglieder geführt und vermeidet eine unnatürliche Wiedergabe mit »geben«.
- source_word: בְּדָן
  choice: in Dan
  rationale: Die Präposition בְּ wird mit dem Ortsnamen direkt und natürlich durch »in« wiedergegeben.
theological_decisions:
- issue: Bezugswort von »das eine« und »das andere«
  choice: Der Gegenstand bleibt wie im Hebräischen unausgesprochen und verweist auf die beiden Kälber des vorherigen Verses.
  alternative: »Er stellte das eine Kalb in Bethel auf und das andere in Dan.«
  rationale: Der Bezug ist aus dem Kontext klar, doch der hebräische Vers wiederholt das Substantiv nicht. Die Ellipse bleibt deshalb im Haupttext erhalten; die Fußnote erläutert sie.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Aufstellen« passt natürlich zu einem Kultbild; die knappe hebräische Gegenüberstellung und ihr impliziter Rückverweis bleiben erhalten.
