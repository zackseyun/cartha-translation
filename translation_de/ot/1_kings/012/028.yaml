  text: וַ/יִּוָּעַ֣ץ הַ/מֶּ֔לֶךְ וַ/יַּ֕עַשׂ שְׁנֵ֖י עֶגְלֵ֣י זָהָ֑ב וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם רַב לָ/כֶם֙ מֵ/עֲל֣וֹת יְרוּשָׁלִַ֔ם הִנֵּ֤ה אֱלֹהֶ֨י/ךָ֙ יִשְׂרָאֵ֔ל אֲשֶׁ֥ר הֶעֱל֖וּ/ךָ מֵ/אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/028.yaml
  text: So the king took counsel and made two calves of gold[a], and he said to them, “It is too much for you to go up to Jerusalem. Behold your gods, O Israel[b], who brought you up from the land of Egypt.”
translation:
  language: de
  text: 'Da beriet sich der König und machte zwei goldene Kälber. Dann sagte er zum Volk: »Es ist zu viel für euch, nach Jerusalem hinaufzuziehen.[a] Seht, das sind eure Götter, Israel,[b] die euch aus dem Land Ägypten heraufgeführt haben!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ihr seid lange genug nach Jerusalem hinaufgezogen.«'
    reason: Die hebräische Wendung kann entweder die Belastung des Hinaufziehens oder dessen bisherige Dauer als ausreichend bezeichnen.
  - marker: b
    text: 'Oder: »Seht, das ist dein Gott, Israel.« Das hebräische Wort kann trotz seiner pluralischen Form einen einzigen Gott bezeichnen. Hier sprechen jedoch die zwei Kälber und das pluralische Verb für »Götter«; die Aussage erinnert an 2. Mose 32,4.'
    reason: Die Fußnote bewahrt die grammatische und theologische Mehrdeutigkeit, ohne die im Kontext bevorzugte pluralische Lesart aufzugeben.
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: Da beriet sich der König
  rationale: Der Niphal von יעץ bezeichnet hier Beratung bzw. Überlegung. »beriet sich« ist natürlich und bleibt nah an der hebräischen Form.
- source_word: וַיַּעַשׂ שְׁנֵי עֶגְלֵי זָהָב
  choice: ließ zwei goldene Kälber anfertigen
  rationale: עשה kann im königlichen Handlungskontext veranlassend verstanden werden. Die Formulierung klingt im Deutschen natürlich und bezeichnet die Herstellung zweier Kultbilder, ohne den Gegenstand umzudeuten.
- source_word: רַב לָכֶם מֵעֲלוֹת יְרוּשָׁלִַם
  choice: Es ist zu viel für euch, immer wieder nach Jerusalem hinaufzuziehen
  rationale: Die Wendung kann eine übermäßige Belastung oder ein »lange/genug« ausdrücken. Im Kontext der beabsichtigten Kultentlastung ist »zu viel für euch« besonders naheliegend; »immer wieder« verdeutlicht idiomatisch den wiederholten Pilgergang.
- source_word: הִנֵּה
  choice: Seht
  rationale: »Seht« gibt die hinweisende und präsentierende Kraft von הִנֵּה in gegenwärtigem, würdigem Deutsch wieder.
- source_word: אֱלֹהֶיךָ יִשְׂרָאֵל
  choice: das sind eure Götter, Israel
  rationale: Die zwei unmittelbar genannten Kälber und das folgende pluralische Verb sprechen für den Plural. Der kollektive Singular des Hebräischen wird im Deutschen als Anrede des Volkes idiomatisch mit »eure« wiedergegeben.
- source_word: הֶעֱלוּךָ
  choice: die euch ... heraufgeführt haben
  rationale: Das Verb steht im Plural und stützt die Wiedergabe »Götter«. »heraufgeführt« wahrt zugleich die Exodusformel und die Bewegungsvorstellung.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: aus dem Land Ägypten
  rationale: Die Formulierung bildet die hebräische Exodusformel eng und verständlich ab.
theological_decisions:
- issue: Singular oder Plural bei אֱלֹהֶיךָ
  choice: 'Plural: »eure Götter, Israel«'
  alternative: 'Singular: »dein Gott, Israel« bzw. idiomatisch »euer Gott, Israel«'
  rationale: אֱלֹהִים kann trotz pluralischer Form einen singularischen Gott bezeichnen. Hier begünstigen jedoch die zwei Kälber und besonders das pluralische Verb הֶעֱלוּ die Mehrzahl. Eine Fußnote bewahrt die echte lexikalisch-theologische Mehrdeutigkeit und den Anklang an Exodus 32,4.
- issue: Deutung von רַב לָכֶם מֵעֲלוֹת
  choice: »Es ist zu viel für euch ... hinaufzuziehen«
  alternative: »Ihr seid lange genug nach Jerusalem hinaufgezogen«
  rationale: Beide Deutungen sind sprachlich möglich. Die Hauptfassung folgt der im unmittelbaren politischen Kontext plausiblen Belastungsrhetorik, während die Fußnote die zeitliche Deutung offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Seht« ist kräftiger und gegenwärtiger als das altertümliche »Siehe«. Die direkte Rede bleibt rhetorisch zugespitzt; der kollektive hebräische Singular wird in der deutschen Volksanrede idiomatisch als Plural wiedergegeben.
