  text: וַ/יִּ֨בֶן יָרָבְעָ֧ם אֶת שְׁכֶ֛ם בְּ/הַ֥ר אֶפְרַ֖יִם וַ/יֵּ֣שֶׁב בָּ֑/הּ וַ/יֵּצֵ֣א מִ/שָּׁ֔ם וַ/יִּ֖בֶן אֶת פְּנוּאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/025.yaml
  text: Then Jeroboam built Shechem in the hill country of Ephraim and lived there[a]; and he went out from there and built Penuel.
translation:
  language: de
  text: Dann baute Jerobeam Sichem im Bergland Ephraim und wohnte dort. Von dort zog er fort und baute Pnuël[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Ortsname Pnuël erscheint in verwandten Bibelstellen auch in der Form Pniël.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: baute … aus
  rationale: בנה bedeutet grundsätzlich »bauen«. Bei bereits bekannten Städten kann der Ausdruck auch Wiederaufbau, Ausbau oder Befestigung bezeichnen. »baute … aus« ist im Deutschen natürlich und vermeidet die missverständliche Aussage, Jerobeam habe die Orte erstmals gegründet.
- source_word: שְׁכֶם
  choice: Sichem
  rationale: Für den Ortsnamen wird die im deutschen Bibelgebrauch etablierte Form »Sichem« verwendet.
- source_word: בְּהַר אֶפְרַיִם
  choice: im Bergland Ephraim
  rationale: הַר bezeichnet hier wahrscheinlich die gebirgige Region Ephraims und nicht einen einzelnen Berg. »Bergland Ephraim« ist eine geläufige und geografisch passende Wiedergabe.
- source_word: וַיֵּשֶׁב בָּהּ
  choice: und wohnte dort
  rationale: ישב kann »sitzen«, »wohnen« oder »sich niederlassen« bedeuten. Das feminine Suffix bezieht sich auf Sichem; idiomatisches Deutsch gibt dies mit »dort« wieder.
- source_word: וַיֵּצֵא מִשָּׁם
  choice: Danach zog er von dort weiter
  rationale: יצא bedeutet wörtlich »hinausgehen«. Im erzählerischen Zusammenhang bezeichnet die Wendung das Verlassen Sichems; »zog … weiter« gibt die Bewegung natürlich wieder, ohne ein endgültiges Aufgeben des Wohnsitzes zu behaupten.
- source_word: פְּנוּאֵל
  choice: Pnuël
  rationale: Der Ortsname wird entsprechend seiner hebräischen Form in einer im deutschen Bibelgebrauch bekannten Schreibweise wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Verbform וַיִּבֶן wird einheitlich mit »baute … aus« wiedergegeben; dadurch bleibt die Parallelität erhalten, während der städtische Kontext angemessen berücksichtigt wird. Der Fußnotenmarker steht unmittelbar beim betreffenden Ortsnamen.
