base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/004.yaml
  text: Your father made our yoke heavy[a]. So now, lighten the hard service of your father and his heavy yoke that he put on us[b], and we will serve you.
translation:
  language: de
  text: Dein Vater hat unser Joch hart gemacht.[a] Mach nun die harte Dienstpflicht deines Vaters[b] und sein schweres Joch, das er uns auferlegt hat, leichter; dann werden wir dir dienen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hat unser Joch schwer gemacht“. Das Joch steht bildlich für belastende Pflichten und Abgaben.'
    reason: lexical_alternative
  - marker: b
    text: „Harte Dienstpflicht“ kann auch mit „harter Dienst“, „harte Arbeit“ oder „drückender Frondienst“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְשָׁה אֶת־עֻלֵּנוּ
  choice: hat unser Joch hart gemacht
  rationale: Bewahrt den Kausativ von קשׁה und die Jochmetapher. „Hart“ gibt zudem das hebräische Wortspiel mit dem später genannten „harten Dienst“ wieder.
- source_word: עֻלֵּנוּ
  choice: unser Joch
  rationale: Die konkrete Metapher für belastende Dienst-, Arbeits- und Abgabenpflichten bleibt erhalten.
- source_word: הָקֵל
  choice: mach … leichter
  rationale: Der Imperativ fordert eine Erleichterung und steht im bewussten Gegensatz zum „schweren Joch“.
- source_word: מֵעֲבֹדַת אָבִיךָ הַקָּשָׁה
  choice: den harten Dienst, den dein Vater uns auferlegt hat
  rationale: עֲבֹדָה kann Dienst oder Arbeit bezeichnen. „Dienst“ bewahrt die mögliche politische Dienstpflicht; die Ergänzung „uns auferlegt hat“ macht die syntaktische Beziehung im Deutschen verständlich und wird durch den folgenden Relativsatz gestützt.
- source_word: וּמֵעֻלּוֹ הַכָּבֵד
  choice: und sein schweres Joch
  rationale: Bewahrt das Possessivsuffix und den Gegensatz zwischen „schwer“ und „leichter“.
- source_word: אֲשֶׁר נָתַן עָלֵינוּ
  choice: den … uns auferlegt hat
  rationale: נתן על bezeichnet hier idiomatisch das Auferlegen einer Last. Der Relativsatz kann sich grammatisch auf den harten Dienst und das schwere Joch als zusammengehörige Belastung beziehen.
- source_word: וְנַעַבְדֶךָּ
  choice: dann werden wir dir dienen
  rationale: Das Waw drückt hier die zugesagte Folge der geforderten Erleichterung aus; „dann“ macht diesen Zusammenhang natürlich deutlich.
- source_word: עַתָּה
  choice: nun
  rationale: Markiert den Übergang von der Klage zur Aufforderung in knappem, natürlichem Deutsch.
