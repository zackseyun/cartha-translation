source:
  edition: WLC
  text: אִֽם יַעֲלֶ֣ה הָ/עָ֣ם הַ/זֶּ֗ה לַ/עֲשׂ֨וֹת זְבָחִ֤ים בְּ/בֵית יְהוָה֙ בִּ/יר֣וּשָׁלִַ֔ם וְ֠/שָׁב לֵ֣ב הָ/עָ֤ם הַ/זֶּה֙ אֶל אֲדֹ֣נֵי/הֶ֔ם אֶל רְחַבְעָ֖ם מֶ֣לֶךְ יְהוּדָ֑ה וַ/הֲרָגֻ֕/נִי וְ/שָׁ֖בוּ אֶל רְחַבְעָ֥ם מֶֽלֶךְ יְהוּדָֽה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/027.yaml
  text: If this people goes up to offer sacrifices in the house of Yahweh in Jerusalem[a], then the heart of this people will return to their lord, to Rehoboam king of Judah[c][b], and they will kill me and return to Rehoboam king of Judah.
translation:
  language: de
  text: Wenn dieses Volk hinaufzieht[a], um im Haus Jahwes in Jerusalem Opfer darzubringen, dann wird das Herz dieses Volkes zu ihrem Herrn, Rehabeam, dem König von Juda, zurückkehren[b]; sie werden mich töten und zu Rehabeam, dem König von Juda, zurückkehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sobald dieses Volk hinaufzieht …“ Die hebräische Partikel kann auch einen zeitlichen Sinn annehmen; hier bezeichnet sie wahrscheinlich die von Jerobeam befürchtete Bedingung.'
    reason: lexical_alternative
  - marker: b
    text: „Herr“ kann hier auch „Gebieter“ bedeuten. Gemeint ist Rehabeam, wie der folgende Zusatz ausdrücklich klarstellt.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Wenn
  rationale: Die Partikel leitet hier Jerobeams befürchtete Bedingung ein; „wenn“ bewahrt diesen Sinn, ohne sie unnötig zeitlich festzulegen.
- source_word: יַעֲלֶה
  choice: hinaufzieht
  rationale: Bewahrt die übliche topografische und kultische Wendung für den Weg nach Jerusalem.
- source_word: לַעֲשׂוֹת זְבָחִים
  choice: um … Opfer darzubringen
  rationale: Gibt die hebräische Wendung idiomatisch und in einem würdigen modernen Deutsch wieder.
- source_word: בְּבֵית יְהוָה
  choice: im Haus Jahwes
  rationale: Bewahrt das hebräische Bild vom „Haus“ und bezeichnet hier den Tempel in Jerusalem.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im Ausgangstext stehenden Gottesnamen als Eigennamen wieder.
- source_word: וְשָׁב לֵב הָעָם הַזֶּה
  choice: wird sich das Herz dieses Volkes wieder … zuwenden
  rationale: Erhält das konkrete Bild des Herzens als Sitz der Loyalität und gibt שׁוב mit einer natürlichen deutschen Wendung wieder.
- source_word: אֶל אֲדֹנֵיהֶם
  choice: ihrem Herrn
  rationale: Der formal besondere Ausdruck bezeichnet hier einen einzelnen Herrscher, wie die folgende Apposition Rehabeam eindeutig zeigt.
- source_word: רְחַבְעָם מֶלֶךְ יְהוּדָה
  choice: Rehabeam, dem König von Juda
  rationale: Natürliche deutsche Wiedergabe des Namens mit der appositionellen Herrscherbezeichnung.
- source_word: וַהֲרָגֻנִי
  choice: Dann werden sie mich töten
  rationale: הרג bedeutet klar „töten“; „dann“ macht die im Zusammenhang erwartete Folge verständlich.
- source_word: וְשָׁבוּ
  choice: und … zurückkehren
  rationale: Greift die Wiederholung von שׁוב auf; die Vorsilbe „zurück-“ verdeutlicht die politische Rückkehr zu Rehabeam.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich; „Jahwe“ behandelt es als Gottes Eigennamen und folgt der vorgegebenen Projektentscheidung.
- issue: Das Herz des Volkes kehrt zu Rehabeam zurück
  choice: Das Bild des Herzens und der Hinwendung wird bewahrt
  alternative: Das Volk wird Rehabeam wieder treu sein
  rationale: Eine rein politische Paraphrase wäre verständlich, würde aber das hebräische Bild und dessen innere, loyale Dimension auflösen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die kultische Wendung „hinaufziehen“ und das hebräische Bild vom Herzen bleiben erhalten; die Satzgliederung wurde für natürliche deutsche Lesbarkeit leicht geglättet.
