  text: וּ/בְנֵ֣י יִשְׂרָאֵ֔ל הַ/יֹּשְׁבִ֖ים בְּ/עָרֵ֣י יְהוּדָ֑ה וַ/יִּמְלֹ֥ךְ עֲלֵי/הֶ֖ם רְחַבְעָֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/017.yaml
  text: But Rehoboam reigned over the Israelites who lived in the cities of Judah.
translation:
  language: de
  text: Über die Israeliten aber, die in den Städten Judas wohnten, regierte Rehabeam als König.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי יִשְׂרָאֵל
  choice: über die Israeliten aber
  rationale: בני ישראל bezeichnet hier idiomatisch die Angehörigen Israels; „Israeliten“ ist im modernen Deutschen natürlich und schließt beide Geschlechter ein. Das vorangestellte „aber“ gibt den Gegensatz zum Abfall der nördlichen Stämme wieder.
- source_word: הַ/יֹּשְׁבִים
  choice: die … wohnten
  rationale: Das Partizip von ישׁב beschreibt den fortdauernden Wohnsitz. „wohnten“ ist präzise und in erzählender Prosa natürlich.
- source_word: בְּ/עָרֵי יְהוּדָה
  choice: in den Städten Judas
  rationale: Die Genitivverbindung bewahrt den territorialen Bezug, ohne genauer festzulegen, ob ausschließlich befestigte Städte oder allgemein Ortschaften gemeint sind.
- source_word: וַ/יִּמְלֹךְ
  choice: regierte … als König
  rationale: מלך bezeichnet hier die Ausübung der Königsherrschaft. „regierte als König“ klingt im Deutschen natürlicher als das heute seltene absolute „herrschte“ und macht die königliche Funktion deutlich.
- source_word: עֲלֵי/הֶם
  choice: über die Israeliten
  rationale: Die mit על markierte Herrschaftsbeziehung wird durch die deutsche Konstruktion „über … regieren“ wiedergegeben; das pronominale Objekt bezieht sich auf die zuvor genannten Israeliten.
- source_word: רְחַבְעָם
  choice: Rehabeam
  rationale: Verwendet wird die im Deutschen etablierte biblische Namensform.
