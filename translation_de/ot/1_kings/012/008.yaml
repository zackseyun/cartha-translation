source:
  edition: WLC
  text: וַֽ/יַּעֲזֹ֛ב אֶת עֲצַ֥ת הַ/זְּקֵנִ֖ים אֲשֶׁ֣ר יְעָצֻ֑/הוּ וַ/יִּוָּעַ֗ץ אֶת הַ/יְלָדִים֙ אֲשֶׁ֣ר גָּדְל֣וּ אִתּ֔/וֹ אֲשֶׁ֥ר הָ/עֹמְדִ֖ים לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/008.yaml
  text: But he abandoned the advice of the elders that they had given him[a], and consulted with the young men who had grown up with him, who stood before him.
translation:
  language: de
  text: Doch er verwarf den Rat der Ältesten, den sie ihm gegeben hatten, und beriet sich mit den jungen Männern, die mit ihm aufgewachsen waren und vor ihm standen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihm aufwarteten“ / „ihm dienten“. Die hebräische Wendung „vor ihm stehen“ kann den Dienst am königlichen Hof bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: verwarf
  rationale: עזב bedeutet verlassen, aufgeben oder im gegebenen Zusammenhang bewusst beiseitesetzen. „Verwarf“ macht deutlich, dass Rehabeam den bereits erteilten Rat nicht annahm.
- source_word: עֲצַת הַזְּקֵנִים
  choice: den Rat der Ältesten
  rationale: עֵצָה bezeichnet hier den erteilten Rat; זְקֵנִים meint die älteren, angesehenen Ratgeber. „Älteste“ bewahrt sowohl den Altersbezug als auch ihre gesellschaftliche Stellung.
- source_word: אֲשֶׁר יְעָצֻהוּ
  choice: den sie ihm gegeben hatten
  rationale: In Verbindung mit „Rat“ ist „den sie ihm gegeben hatten“ natürliches Deutsch und gibt den Rückbezug des Relativsatzes klar wieder.
- source_word: וַיִּוָּעַץ
  choice: beriet sich mit
  rationale: Die Niphalform von יעץ bezeichnet hier das Einholen beziehungsweise Austauschen von Rat. „Beriet sich mit“ ist idiomatisch und erhält den wechselseitigen Sinn.
- source_word: הַיְלָדִים
  choice: die jungen Männer
  rationale: יְלָדִים kann Jungen oder junge Leute bezeichnen. Hier sind Rehabeams gleichaltrige Hofleute gemeint; „junge Männer“ vermeidet die irreführende Vorstellung von Kindern.
- source_word: אֲשֶׁר גָּדְלוּ אִתּוֹ
  choice: die mit ihm aufgewachsen waren
  rationale: Die Wendung bezeichnet eine gemeinsame Jugend beziehungsweise Entwicklung und wird im Deutschen natürlich mit „mit ihm aufgewachsen“ wiedergegeben.
- source_word: אֲשֶׁר הָעֹמְדִים לְפָנָיו
  choice: und vor ihm standen
  rationale: Die Formulierung bewahrt das hebräische Bild. „Vor jemandem stehen“ kann im höfischen Zusammenhang zugleich bedeuten, ihm aufzuwarten oder zu dienen; diese mögliche Funktionsbedeutung wird in der Fußnote erläutert.
