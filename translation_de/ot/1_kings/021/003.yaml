base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/003.yaml
  text: But Naboth said to Ahab[a], “Far be it from me by Yahweh to give you the inheritance of my fathers.”
translation:
  language: de
  text: 'Doch Nabot sagte zu Ahab: „Jahwe bewahre mich davor, dir den Erbbesitz meiner Väter zu geben!“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Fern sei es mir von Jahwe, dir den Erbbesitz meiner Väter zu geben.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Doch … sagte
  rationale: Das Waw führt die Erzählung weiter; „doch“ macht zugleich den Gegensatz zu Ahabs Angebot im vorigen Vers deutlich.
- source_word: נָבוֹת
  choice: Nabot
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: חָלִילָה לִּי מֵיְהוָה
  choice: Bei Jahwe sei es mir fern
  rationale: Die Wendung drückt entschiedene Zurückweisung aus. „Bei Jahwe“ bewahrt den Bezug auf den Gottesnamen und lässt den eidähnlichen beziehungsweise religiös verpflichtenden Charakter der Aussage erkennen, ohne die Formulierung vollständig in „Jahwe bewahre“ aufzulösen.
- source_word: מִתִּתִּי
  choice: zu geben
  rationale: Der Infinitiv bezeichnet die Handlung, die Nabot entschieden von sich weist.
- source_word: נַחֲלַת
  choice: das Erbe
  rationale: Gemeint ist der ererbte Familienbesitz; „Erbe“ erhält sowohl den rechtlichen als auch den familiären Sinn.
- source_word: אֲבֹתַי
  choice: meiner Väter
  rationale: Die maskuline Pluralform wird genau wiedergegeben und bezeichnet Nabots väterliche Vorfahren beziehungsweise die Familienlinie.
- source_word: לָךְ
  choice: dir
  rationale: Der deutsche Dativ gibt den hebräischen Empfängerbezug natürlich und präzise wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den offenbarten Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Deutung der Wendung חָלִילָה לִּי מֵיְהוָה
  choice: Bei Jahwe sei es mir fern
  alternative: Jahwe bewahre mich davor
  rationale: 'Die Hauptfassung bleibt näher an der hebräischen Ausdrucksweise und bewahrt deren Spannung: Nabot weist die Tat entschieden zurück und stellt diese Ablehnung zugleich in Beziehung zu Jahwe. Die idiomatischere Alternative wird in der Fußnote genannt.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Bei Jahwe sei es mir fern“ ist bewusst etwas feierlich, um die starke, religiös gebundene Zurückweisung des Hebräischen zu erhalten; die Fußnote bietet eine geläufigere deutsche Formulierung.
