source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אַחְאָב֙ אֶל אֵ֣לִיָּ֔הוּ הַֽ/מְצָאתַ֖/נִי אֹיְבִ֑/י וַ/יֹּ֣אמֶר מָצָ֔אתִי יַ֚עַן הִתְמַכֶּרְ/ךָ֔ לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/020.yaml
  text: Ahab said to Elijah[a], “Have you found me, O my enemy?” And he said, “I have found you, because you have sold yourself to do what is evil in the eyes of Yahweh.”
translation:
  language: de
  text: 'Ahab sagte zu Elia: „Hast du mich gefunden, mein Feind?“ Er antwortete: „Ich habe dich gefunden, weil du dich selbst verkauft hast, um zu tun, was in den Augen Jahwes[a] böse ist.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH. Hier mit „Jahwe“ wiedergegeben; traditionell „der HERR“, weitere Wiedergabe: „Jehova“.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַמְצָאתַנִי
  choice: Hast du mich gefunden
  rationale: Die direkte Wiedergabe von מצא bewahrt den konfrontativen Ton und ermöglicht die Wiederholung desselben Verbs in Elias Antwort.
- source_word: אֹיְבִי
  choice: mein Feind
  rationale: Das Substantiv mit Suffix der 1. Person Singular ist eine direkte Anrede. Im modernen Deutschen wirkt „mein Feind“ würdig und natürlich; ein zusätzliches „o“ wäre unnötig altertümlich.
- source_word: מָצָאתִי
  choice: Ich habe dich gefunden
  rationale: Die Form wiederholt מצא aus Ahabs Frage. Die einheitliche Übersetzung erhält das pointierte Wortspiel des Dialogs.
- source_word: יַעַן
  choice: weil
  rationale: Die Konjunktion leitet die Begründung für Elias Feststellung ein; „weil“ gibt ihre kausale Funktion klar wieder.
- source_word: הִתְמַכֶּרְךָ
  choice: du dich selbst verkauft hast
  rationale: Der Hitpael von מכר bezeichnet reflexiv das Sich-selbst-Verkaufen. Die Formulierung bewahrt das starke Bild freiwilliger Selbstpreisgabe beziehungsweise Selbstversklavung.
- source_word: לַעֲשׂוֹת הָרַע
  choice: um zu tun, was böse ist
  rationale: Der Infinitiv mit substantiviertem Adjektiv bezeichnet das Tun des Bösen. Die deutsche Formulierung ist natürlich und erhält zugleich die moralische Wertung.
- source_word: בְּעֵינֵי יְהוָה
  choice: in den Augen Jahwes
  rationale: Die geläufige hebräische Metapher für Gottes Beurteilung wird im Deutschen verständlich und bildhaft beibehalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben statt durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. „Jahwe“ ist die im modernen Deutschen übliche wissenschaftliche Umschrift und bewahrt den Charakter als Gottesname.
- issue: Bedeutung von הִתְמַכֶּרְךָ
  choice: du dich selbst verkauft hast
  alternative: du dich hingegeben hast
  rationale: Die wörtlichere Fassung erhält das theologisch und moralisch starke Bild, dass Ahab sich aus eigenem Entschluss dem Bösen ausgeliefert hat, ohne über den Text hinaus festzulegen, worin diese Bindung genau besteht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Konfrontation und die Wiederholung von „finden“ bleiben erhalten. „O mein Feind“ wurde vermieden, da die bloße Anrede „mein Feind“ im heutigen Deutschen natürlicher ist. Das hebräische Bild des Sich-selbst-Verkaufens sowie die Wendung „in den Augen“ wurden bewusst bewahrt.
