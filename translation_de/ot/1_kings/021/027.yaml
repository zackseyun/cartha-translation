base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/027.yaml
  text: And it happened[a], when Ahab heard these words, that he tore his clothes and put sackcloth on his flesh and fasted and lay in sackcloth and went about softly.
translation:
  language: de
  text: Als Ahab diese Worte hörte, zerriss er seine Kleider, legte Sacktuch auf seinen Leib, fastete, lag im Sacktuch und ging gedämpft umher.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ging langsam umher“, „ging leise umher“ oder „ging niedergeschlagen umher“. Das hebräische Wort bezeichnet eine langsame, sanfte oder gedämpfte Art der Bewegung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִשְׁמֹעַ
  choice: Als … hörte
  rationale: Die temporale Konstruktion wird in natürlichem modernem Deutsch wiedergegeben. Das einleitende וַיְהִי führt hier die folgende Situation erzählerisch ein und muss nicht eigens mit „es geschah“ abgebildet werden.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: diese Worte
  rationale: דְּבָרִים bezeichnet hier die zuvor ausgesprochene Gerichtsbotschaft; „Worte“ bewahrt den sprachlichen Bezug.
- source_word: וַיִּקְרַע בְּגָדָיו
  choice: zerriss er seine Kleider
  rationale: Die geläufige deutsche Formulierung bezeichnet die berichtete Trauer- und Demutsgeste klar und ohne zusätzliche Deutung.
- source_word: וַיָּשֶׂם שַׂק עַל בְּשָׂרוֹ
  choice: legte Sacktuch auf seinen Leib
  rationale: „Sacktuch“ bezeichnet das grobe Trauergewand; „auf seinen Leib“ erhält das konkrete Bild des Hebräischen, ohne ausdrücklich mehr zu sagen als der Ausgangstext.
- source_word: וַיָּצֹם
  choice: fastete
  rationale: Direkte und idiomatische Wiedergabe von צום.
- source_word: וַיִּשְׁכַּב בַּשָּׂק
  choice: lag im Sacktuch
  rationale: Die Formulierung bewahrt die Körperhaltung, ohne den Vorgang als Schlafen zu präzisieren.
- source_word: וַיְהַלֵּךְ אַט
  choice: ging still umher
  rationale: אַט beschreibt hier eine langsame, sanfte oder gedämpfte Art des Gehens. „Still“ gibt das äußerlich gedämpfte Verhalten wieder, während die Fußnote die lexikalische Spannweite offenhält.
theological_decisions:
- issue: Art von Ahabs Reaktion
  choice: Nur die berichteten äußeren Zeichen von Trauer und Demütigung wiedergeben
  alternative: Die Reaktion ausdrücklich als echte Buße oder lediglich als äußerliche Inszenierung bezeichnen
  rationale: Der Vers schildert Ahabs Handlungen, beurteilt aber an dieser Stelle nicht ausdrücklich die Aufrichtigkeit seiner inneren Umkehr. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Reihung der Handlungen folgt der knappen hebräischen Erzählweise; „Sacktuch“ bleibt als etablierter biblischer Ausdruck für ein grobes Trauergewand erhalten.
