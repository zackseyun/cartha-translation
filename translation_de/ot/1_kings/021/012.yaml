  text: They proclaimed a fast and seated Naboth at the head of the people[a].
translation:
  language: de
  text: Sie riefen ein Fasten aus und ließen Nabot an der Spitze des Volkes[a] Platz nehmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor dem Volk“ oder „an vorderster Stelle unter dem Volk“. Wörtlich: „am Kopf des Volkes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְאוּ
  choice: sie riefen … aus
  rationale: קרא mit צוֹם als Objekt bezeichnet die öffentliche Ausrufung eines Fastens; „ein Fasten ausrufen“ ist im Deutschen idiomatisch und bewahrt den offiziellen Charakter.
- source_word: צוֹם
  choice: ein Fasten
  rationale: Das Substantiv bezeichnet ein förmlich angesetztes, öffentlich begangenes Fasten.
- source_word: וְהֹשִׁיבוּ
  choice: und ließen … Platz nehmen
  rationale: Der Hifil von ישׁב bedeutet hier, jemanden an einem bestimmten Platz sitzen zu lassen; die deutsche Formulierung ist natürlich und bildet den kausativen Sinn ab.
- source_word: אֶת נָבוֹת
  choice: Nabot
  rationale: אֶת kennzeichnet Nabot als bestimmtes direktes Objekt; der Name wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: בְּרֹאשׁ
  choice: an der Spitze
  rationale: Die Wendung bedeutet wörtlich „am Kopf/an der Spitze“ und bezeichnet hier eine hervorgehobene Stellung; mögliche kontextuelle Bedeutungen werden in der Fußnote offengehalten.
- source_word: הָעָם
  choice: des Volkes
  rationale: עַם bezeichnet hier das versammelte Volk beziehungsweise die Bürgerversammlung; „Volk“ ist die unmittelbarste Wiedergabe.
