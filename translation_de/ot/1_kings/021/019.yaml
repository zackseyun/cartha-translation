source:
  edition: WLC
  text: וְ/דִבַּרְתָּ֨ אֵלָ֜י/ו לֵ/אמֹ֗ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה הֲ/רָצַ֖חְתָּ וְ/גַם יָרָ֑שְׁתָּ וְ/דִבַּרְתָּ֨ אֵלָ֜י/ו לֵ/אמֹ֗ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה בִּ/מְק֗וֹם אֲשֶׁ֨ר לָקְק֤וּ הַ/כְּלָבִים֙ אֶת דַּ֣ם נָב֔וֹת יָלֹ֧קּוּ הַ/כְּלָבִ֛ים אֶת דָּמְ/ךָ֖ גַּם אָֽתָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/019.yaml
  text: 'And you shall speak to him[a], saying, ‘Thus says Yahweh: Have you murdered and also taken possession?’ And you shall speak to him, saying, ‘Thus says Yahweh: In the place where the dogs licked the blood of Naboth[b], the dogs shall lick your blood—you also.’'
translation:
  language: de
  text: 'Und du sollst zu ihm sagen: »So spricht Jahwe: Hast du gemordet und auch noch Besitz ergriffen?«[a] Und du sollst zu ihm sagen: »So spricht Jahwe: An dem Ort, wo die Hunde Nabots Blut geleckt haben, werden die Hunde dein Blut lecken – auch dir wird es so ergehen.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb kann allgemeiner mit „töten“ wiedergegeben werden; hier bezeichnet es wahrscheinlich schuldhaftes, widerrechtliches Töten, also Mord.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich endet der Satz betont mit „auch du“. Die Formulierung hebt hervor, dass Ahab selbst dasselbe Geschick treffen wird.
    reason: rhetorical_emphasis
lexical_decisions:
- source_word: וְדִבַּרְתָּ אֵלָיו לֵאמֹר
  choice: Und du sollst zu ihm sagen
  rationale: Die natürliche deutsche Wiedergabe bewahrt den feierlichen Auftragscharakter und die im Hebräischen auffällige Wiederholung, ohne die redundante Formulierung „sprechen und sagen“ nachzuahmen.
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Die geläufige deutsche Prophetenformel gibt das hebräische Perfekt idiomatisch als gegenwärtig autoritative Botschaft wieder; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: הֲרָצַחְתָּ
  choice: Hast du gemordet
  rationale: רצח bezeichnet hier schuldhaftes, widerrechtliches Töten. „Morden“ bewahrt die rechtliche und moralische Schärfe der Anklage.
- source_word: וְגַם יָרָשְׁתָּ
  choice: und auch noch Besitz ergriffen
  rationale: ירש kann erben, in Besitz nehmen oder Besitz ergreifen bedeuten. Im Zusammenhang geht es um Ahabs Aneignung des Weinbergs; „Besitz ergriffen“ lässt das Objekt wie im Hebräischen unausgesprochen, während „auch noch“ die Steigerung von גם natürlich ausdrückt.
- source_word: בִּמְקוֹם אֲשֶׁר
  choice: An dem Ort, wo
  rationale: Eine direkte und im modernen Deutsch natürliche Wiedergabe der Ortsangabe.
- source_word: לָקְקוּ ... יָלֹקּוּ
  choice: geleckt haben ... werden ... lecken
  rationale: Die Wiederholung desselben deutschen Verbs erhält die rhetorische Entsprechung von Vergangenheit und Zukunft.
- source_word: דַּם נָבוֹת
  choice: Nabots Blut
  rationale: Der hebräische Status constructus wird knapp und idiomatisch als deutscher Genitiv wiedergegeben.
- source_word: אֶת דָּמְךָ גַּם אָתָּה
  choice: auch dein Blut ... ja, deins
  rationale: „Auch dein Blut“ gibt גם zunächst syntaktisch wieder; „ja, deins“ erhält den abrupt nachgestellten, emphatischen Personalbezug von גַּם אָתָּה.
theological_decisions:
- issue: Moralische Tragweite von הֲרָצַחְתָּ
  choice: „Hast du gemordet“
  alternative: „Hast du getötet“
  rationale: Der Kontext ist eine prophetische Anklage wegen Nabots widerrechtlicher Tötung. „Gemordet“ bewahrt diese ethisch-rechtliche Schärfe, ohne Ahabs genaue Form der Beteiligung über den Text hinaus festzulegen.
- issue: Emphase der Schlusswendung גַּם אָתָּה
  choice: „auch dein Blut ... ja, deins“
  alternative: „dein Blut, auch dich“ / „sogar dein Blut“
  rationale: Die gewählte Form erhält die persönliche Zuspitzung auf Ahab und vermeidet zugleich die im Deutschen mögliche falsche Vorstellung, die Hunde würden nicht Blut, sondern Ahab selbst lecken.
- issue: Identität des Ortes der angekündigten Vergeltung
  choice: Die Ortsangabe wird ohne Harmonisierung wörtlich beibehalten.
  alternative: Eine erklärende Präzisierung anhand von 1 Könige 22,38 oder 2 Könige 9,25–26
  rationale: Der Vers bezeichnet ausdrücklich den Ort, an dem Hunde Nabots Blut leckten. Mögliche Spannungen zu späteren Erfüllungsberichten werden nicht stillschweigend aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die doppelte Botenformel wurde bewusst erhalten. „Auch noch“ trägt den anklagenden Steigerungston; der Gedankenstrich vor „ja, deins“ bildet die abrupte hebräische Schlussbetonung nach.
