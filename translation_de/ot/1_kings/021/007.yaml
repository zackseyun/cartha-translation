source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר אֵלָי/ו֙ אִיזֶ֣בֶל אִשְׁתּ֔/וֹ אַתָּ֕ה עַתָּ֛ה תַּעֲשֶׂ֥ה מְלוּכָ֖ה עַל יִשְׂרָאֵ֑ל ק֤וּם אֱכָל לֶ֨חֶם֙ וְ/יִטַ֣ב לִבֶּ֔/ךָ אֲנִי֙ אֶתֵּ֣ן לְ/ךָ֔ אֶת כֶּ֖רֶם נָב֥וֹת הַ/יִּזְרְעֵאלִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/007.yaml
  text: Then Jezebel his wife said to him[a], “Do you now govern Israel as king? Get up, eat bread, and let your heart be cheerful[b]; I will give you the vineyard of Naboth the Jezreelite.”
translation:
  language: de
  text: 'Da sagte seine Frau Isebel zu ihm[a]: »Übst du jetzt die Königsherrschaft über Israel aus? Steh auf, iss etwas und sei guten Mutes[b]! Ich werde dir den Weinberg des Jesreeliters Nabot geben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder als spöttische Aussage: »Du übst doch jetzt die Königsherrschaft über Israel aus!« Das Hebräische kann hier als Frage oder als Aussage verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: »Iss Brot, und dein Herz sei gut.« »Brot essen« kann allgemein bedeuten, eine Mahlzeit einzunehmen.'
    reason: cultural_note
lexical_decisions:
- source_word: וַתֹּאמֶר אֵלָיו
  choice: Da sagte ... zu ihm
  rationale: Das Narrativ-Waw führt die Handlung weiter; »Da« gibt die zeitliche Folge im modernen deutschen Erzählstil natürlich wieder.
- source_word: אִיזֶבֶל אִשְׁתּוֹ
  choice: seine Frau Isebel
  rationale: Gibt die Apposition idiomatisch wieder und bewahrt sowohl den Namen als auch die Beziehung zu Ahab.
- source_word: אַתָּה עַתָּה תַּעֲשֶׂה מְלוּכָה עַל יִשְׂרָאֵל
  choice: Übst du jetzt die Königsherrschaft über Israel aus?
  rationale: תעשה מלוכה bedeutet wörtlich etwa »Königsherrschaft ausüben«. Die rhetorische Frage passt zum Zusammenhang, während eine Fußnote die mögliche aussagende oder spöttische Lesart bewahrt.
- source_word: קוּם
  choice: Steh auf
  rationale: Direkte, natürliche Wiedergabe des Imperativs.
- source_word: אֱכָל לֶחֶם
  choice: iss etwas
  rationale: Die wörtliche Wendung »Brot essen« bezeichnet hier allgemein das Einnehmen einer Mahlzeit; die idiomatische Bedeutung wird im Haupttext natürlich wiedergegeben und in der Fußnote erläutert.
- source_word: וְיִטַב לִבֶּךָ
  choice: sei wieder guten Mutes
  rationale: Die hebräische Wendung bedeutet wörtlich, dass das Herz gut oder froh werden soll. Die deutsche Formulierung vermittelt die innere Aufmunterung, ohne eine rein körperliche Bedeutung nahezulegen.
- source_word: אֲנִי אֶתֵּן לְךָ
  choice: Ich werde dir ... geben
  rationale: Bewahrt das ausdrücklich gesetzte und dadurch betonte אֲנִי sowie die Zusage.
- source_word: כֶּרֶם נָבוֹת הַיִּזְרְעֵאלִי
  choice: den Weinberg des Jesreeliters Nabot
  rationale: Natürliche Wiedergabe der hebräischen Constructusverbindung; »Jesreeliter« bezeichnet Nabots Herkunft beziehungsweise Zugehörigkeit zu Jesreel.
theological_decisions:
- issue: Aussagekraft von Isebels einleitender Frage
  choice: 'Als rhetorische Frage: »Übst du jetzt die Königsherrschaft über Israel aus?«'
  alternative: 'Als Aussage oder Spott: »Du übst doch jetzt die Königsherrschaft über Israel aus!«'
  rationale: Im Hebräischen fehlt ein ausdrückliches Fragewort. Der Zusammenhang legt eine spöttisch-vorwurfsvolle rhetorische Frage nahe, doch die grammatisch mögliche Aussage wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede klingt scharf und antreibend. »Königsherrschaft ausüben« bewahrt die ungewöhnliche hebräische Verbindung, während »iss etwas« den Speiseidiom natürlich wiedergibt.
