id: 1KI.21.23
reference: 1 Kings 21:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/גַ֨ם לְ/אִיזֶ֔בֶל דִּבֶּ֥ר יְהוָ֖ה לֵ/אמֹ֑ר הַ/כְּלָבִ֛ים יֹאכְל֥וּ אֶת אִיזֶ֖בֶל בְּ/חֵ֥ל יִזְרְעֶֽאל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/023.yaml
  text: And also concerning Jezebel[a], Yahweh spoke, saying, ‘The dogs will eat Jezebel in the territory of Jezreel.’
translation:
  language: de
  text: 'Auch über Isebel sprach Jahwe: »Die Hunde werden Isebel im Gebiet von Jesreel[a] fressen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »am Wall von Jesreel«. Das hier verwendete hebräische Wort ist schwer zu deuten und kann genauer den befestigten Außenbereich der Stadt bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Auch
  rationale: Bewahrt die additive Verknüpfung mit dem vorausgehenden Gerichtswort; im Deutschen ist „Auch“ ohne zusätzliches „und“ natürlich und präzise.
- source_word: לְאִיזֶבֶל
  choice: über Isebel
  rationale: Die Präposition ל bei דבר bezeichnet hier die Person, auf die sich der Ausspruch bezieht; Isebel wird im Erzählzusammenhang nicht als unmittelbare Adressatin dargestellt.
- source_word: דִּבֶּר יְהוָה לֵאמֹר
  choice: sprach Jahwe
  rationale: Gibt die Redeformel würdig und idiomatisch wieder. Das hebräische לֵאמֹר wird durch den anschließenden Doppelpunkt funktional ausgedrückt, statt mit dem schwerfälligen „indem er sagte“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder und ersetzt ihn nicht durch einen Titel.
- source_word: הַכְּלָבִים
  choice: Die Hunde
  rationale: Entspricht dem bestimmten Artikel im Hebräischen und ist im Deutschen natürlich.
- source_word: יֹאכְלוּ
  choice: werden … fressen
  rationale: Drückt die zukünftige prophetische Ankündigung aus; bei Hunden ist „fressen“ die gewöhnliche und sachlich passende deutsche Entsprechung, ohne die Aussage unnötig zu verstärken.
- source_word: בְּחֵל יִזְרְעֶאל
  choice: im Gebiet von Jesreel
  rationale: חֵל ist an dieser Stelle schwierig. „Gebiet“ bewahrt die sichere Ortsangabe, ohne sich im Haupttext auf eine unsichere bauliche Bedeutung festzulegen; die engere Deutung steht in der Fußnote.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen; die Transliteration bewahrt diesen Unterschied gegenüber einem Titel.
- issue: Bezug von לְאִיזֶבֶל bei דִּבֶּר
  choice: über Isebel
  alternative: zu Isebel / gegen Isebel
  rationale: Im Kontext übermittelt Elia einen göttlichen Urteilsspruch über Isebel, ohne dass sie selbst als direkte Empfängerin der Rede erscheint.
- issue: Deutung von בְּחֵל יִזְרְעֶאל
  choice: im Gebiet von Jesreel
  alternative: am Wall von Jesreel
  rationale: Die genaue Bedeutung von חֵל ist hier unsicher. Die Hauptfassung gibt den klaren lokalen Sinn wieder; die mögliche architektonische Bedeutung wird offengehalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Der Doppelpunkt ersetzt die im Deutschen schwerfällige wörtliche Wiedergabe der hebräischen Redeformel. Die Fußnotenmarke steht unmittelbar bei der strittigen Ortsangabe.
