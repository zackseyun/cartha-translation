base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/006.yaml
  text: And he spoke to her, because I spoke to Naboth the Jezreelite and said to him, ‘Give me your vineyard for silver, or, if you prefer, I will give you a vineyard in place of it,’ but he said, ‘I will not give you my vineyard.’
translation:
  language: de
  text: 'Und er sagte zu ihr: »Weil ich mit Nabot, dem Jesreeliter, gesprochen und zu ihm gesagt habe: ›Gib mir deinen Weinberg für Silber; oder, wenn du es vorziehst, gebe ich dir einen Weinberg an seiner Stelle.‹ Doch er sagte: ›Ich werde dir meinen Weinberg nicht geben.‹«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֶּסֶף
  choice: Geld
  rationale: Das hebräische Wort bezeichnet wörtlich Silber, dient hier aber als Zahlungsmittel; „für Geld“ gibt den gemeinten Kaufpreis in natürlichem modernem Deutsch wieder.
- source_word: אִם חָפֵץ אַתָּה
  choice: wenn es dir lieber ist
  rationale: Die Wendung bezeichnet Nabots Wunsch oder Vorliebe; diese idiomatische Formulierung bewahrt den Sinn ohne unnötige Wörtlichkeit.
- source_word: כֶּרֶם תַּחְתָּיו
  choice: stattdessen einen anderen Weinberg
  rationale: תַּחְתָּיו bedeutet hier „an seiner Stelle“; „stattdessen“ drückt den angebotenen Tausch klar aus, während „einen anderen“ im Deutschen zur eindeutigen Bezugnahme ergänzt wird.
- source_word: הַיִּזְרְעֵאלִי
  choice: der Jesreeliter
  rationale: Die Herkunftsbezeichnung wird mit der im Deutschen üblichen Einwohnerbildung wiedergegeben.
theological_decisions:
- issue: Funktion von כִּי nach „er sagte zu ihr“
  choice: als Einleitung des Inhalts seiner Antwort wiedergegeben
  alternative: „denn/weil ich mit Nabot … gesprochen habe“
  rationale: כִּי kann begründend oder redeeinleitend gebraucht werden. Im Kontext beantwortet Ahab Isebels Frage; eine deutsche direkte Rede gibt diese Funktion natürlich wieder, ohne eine zusätzliche theologische Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klar verschachtelter direkter Rede. Die altertümliche Währungsvorstellung wird verständlich als „Geld“ ausgedrückt; Satzbau und Wortwahl bleiben nah am hebräischen Erzählstil.
