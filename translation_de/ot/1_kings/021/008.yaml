  text: וַ/תִּכְתֹּ֤ב סְפָרִים֙ בְּ/שֵׁ֣ם אַחְאָ֔ב וַ/תַּחְתֹּ֖ם בְּ/חֹתָמ֑/וֹ וַ/תִּשְׁלַ֣ח ה/ספרים אֶל הַ/זְקֵנִ֤ים וְ/אֶל הַֽ/חֹרִים֙ אֲשֶׁ֣ר בְּ/עִיר֔/וֹ הַ/יֹּשְׁבִ֖ים אֶת נָבֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/008.yaml
  text: So she wrote letters in Ahab’s name[a], sealed them with his seal, and sent the letters to the elders and to the nobles who were in his city, who were living with Naboth.
translation:
  language: de
  text: Da schrieb sie Briefe im Namen Ahabs, versiegelte sie mit seinem Siegel und sandte die Briefe an die Ältesten und an die Vornehmen, die in seiner Stadt[a] wohnten, in der auch Nabot wohnte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die in Ahabs Stadt wohnten“. Das hebräische Suffix in „seiner Stadt“ kann sich entweder auf Nabot oder auf Ahab beziehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּכְתֹּב
  choice: Da schrieb sie
  rationale: Das Narrativ-Waw führt die Handlung weiter; „Da“ gibt die zeitlich-folgernde Erzählbewegung natürlich wieder. Das feminine Subjekt verweist im Kontext auf Isebel.
- source_word: סְפָרִים / הַספרים
  choice: Briefe / die Briefe
  rationale: סֵפֶר bezeichnet hier schriftliche Mitteilungen an örtliche Führungspersonen; „Briefe“ ist im Deutschen sachlich und idiomatisch.
- source_word: בְּשֵׁם אַחְאָב
  choice: im Namen Ahabs
  rationale: Die Wendung bezeichnet Handeln unter Ahabs Namen beziehungsweise beanspruchter Autorität und bleibt nahe am hebräischen Ausdruck.
- source_word: וַתַּחְתֹּם בְּחֹתָמוֹ
  choice: versiegelte sie mit seinem Siegel
  rationale: חתם mit חותם beschreibt das Beglaubigen von Schriftstücken durch ein offizielles Siegel.
- source_word: הַזְקֵנִים
  choice: die Ältesten
  rationale: זקנים bezeichnet hier die örtlichen Leitungspersonen; „Älteste“ ist die geläufige und formnahe Wiedergabe.
- source_word: הַחֹרִים
  choice: die Vornehmen
  rationale: חֹרִים bezeichnet gesellschaftlich hochgestellte Männer. „Vornehme“ ist verständlich und vermeidet die möglicherweise zu eng ständische Konnotation von „Adlige“.
- source_word: אֲשֶׁר בְּעִירוֹ
  choice: die in seiner Stadt wohnten
  rationale: Das maskuline Suffix wird im Haupttext auf Nabot bezogen, dessen Name die Ortsgemeinschaft am Ende der Klausel bestimmt; da auch Ahab als Bezug möglich ist, wird die Mehrdeutigkeit durch eine Fußnote bewahrt.
- source_word: הַיֹּשְׁבִים אֶת נָבוֹת
  choice: zusammen mit Nabot
  rationale: ישב mit אֶת bezeichnet hier das Wohnen beziehungsweise Ansässigsein bei oder zusammen mit Nabot. Die Formulierung macht deutlich, dass dieselben örtlichen Führungspersonen gemeint sind, ohne eine persönliche Hausgemeinschaft zu unterstellen.
theological_decisions:
- issue: Bezugswort des Pronominalsuffixes in בְּעִירוֹ
  choice: „seiner Stadt“ wird im Haupttext auf Nabot bezogen
  alternative: „seiner Stadt“ kann auf Ahab bezogen werden
  rationale: Die Verbindung mit „die zusammen mit Nabot wohnten“ legt Nabots Stadt als örtlichen Bezug nahe. Grammatisch bleibt jedoch auch Ahab als zuvor genannter maskuliner Bezug möglich; deshalb wird diese Spannung nicht stillschweigend aufgelöst, sondern in der Fußnote vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer narrativer Syntax. „Vornehme“ gibt den gesellschaftlichen Rang verständlich wieder. Die Stellung der Fußnotenmarke kennzeichnet genau die mehrdeutige Wendung.
