source:
  edition: WLC
  text: וַ/יְהִ֛י כִּ/שְׁמֹ֥עַ אַחְאָ֖ב כִּ֣י מֵ֣ת נָב֑וֹת וַ/יָּ֣קָם אַחְאָ֗ב לָ/רֶ֛דֶת אֶל כֶּ֛רֶם נָב֥וֹת הַ/יִּזְרְעֵאלִ֖י לְ/רִשְׁתּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/016.yaml
  text: And when Ahab heard that Naboth was dead[a], Ahab arose to go down to the vineyard of Naboth the Jezreelite[b], to take possession of it.
translation:
  language: de
  text: Und als Ahab hörte, dass Nabot tot war[a], stand Ahab auf, um zum Weinberg Nabots, des Jesreeliters, hinabzugehen und ihn in Besitz zu nehmen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gestorben war“. Das Hebräische kann sowohl den eingetretenen Zustand („tot war“) als auch das abgeschlossene Ereignis („gestorben war“) ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „um ihn zu besitzen“ oder „um ihn zu erben“. Das hebräische Verb kann je nach Zusammenhang bedeuten, etwas in Besitz zu nehmen, es zu besitzen oder es zu erben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Und als
  rationale: Die Form leitet den nächsten Erzählabschnitt ein und verbindet ihn mit dem zeitlichen Nebensatz; „Und als“ gibt diese Funktion in natürlichem modernem Deutsch wieder.
- source_word: כִּשְׁמֹעַ
  choice: als Ahab hörte
  rationale: כ mit dem Infinitiv constructus von שׁמע bildet hier eine Zeitangabe. „Als … hörte“ wahrt die zeitliche Abfolge, ohne besondere Unmittelbarkeit hinzuzufügen.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt dessen ein, was Ahab hörte.
- source_word: מֵת
  choice: tot war
  rationale: Die Verbform bezeichnet hier den eingetretenen Zustand Nabots. „Gestorben war“ bleibt als ereignisbezogene Wiedergabe möglich und wird in der Fußnote genannt.
- source_word: וַיָּקָם
  choice: stand Ahab auf
  rationale: קום bezeichnet in diesem Erzählzusammenhang das Aufstehen als Beginn einer zielgerichteten Handlung; die direkte Wiedergabe bewahrt den knappen Erzählton.
- source_word: לָרֶדֶת
  choice: hinabzugehen
  rationale: ירד enthält eine Richtungsangabe. „Hinabzugehen“ bewahrt diese, ohne sie geografisch näher auszudeuten.
- source_word: כֶּרֶם
  choice: Weinberg
  rationale: „Weinberg“ ist die übliche und genaue deutsche Entsprechung.
- source_word: הַיִּזְרְעֵאלִי
  choice: des Jesreeliters
  rationale: Das Gentiliz bezeichnet Nabot nach Herkunft oder Wohnort; „Jesreeliter“ lässt diese Beziehung offen.
- source_word: לְרִשְׁתּוֹ
  choice: um ihn in Besitz zu nehmen
  rationale: ירשׁ kann je nach Zusammenhang „in Besitz nehmen“, „besitzen“ oder „erben“ bedeuten. Hier bezeichnet es Ahabs beabsichtigte Aneignung des Weinbergs, ohne dass die Gewaltkomponente eigens in das Verb hineingelesen werden muss.
