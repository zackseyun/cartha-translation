source:
  edition: WLC
  text: וַ/יַּתְעֵ֣ב מְאֹ֔ד לָ/לֶ֖כֶת אַחֲרֵ֣י הַ/גִּלֻּלִ֑ים כְּ/כֹל֙ אֲשֶׁ֣ר עָשׂ֣וּ הָ/אֱמֹרִ֔י אֲשֶׁר֙ הוֹרִ֣ישׁ יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/026.yaml
  text: He acted very abominably by going after idols[a], according to all that the Amorites had done[b], whom Yahweh drove out before the sons of Israel.
translation:
  language: de
  text: Er handelte äußerst abscheulich, indem er den Götzen[a] nachlief, ganz so, wie die Amoriter in allem gehandelt hatten, die Jahwe vor den Söhnen Israels[b] vertrieben hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Wort ist eine stark verächtliche Bezeichnung für Götzen; sinngemäß auch: „abscheuliche Götzen“, sehr wörtlich etwa: „Mistgötzen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „den Israeliten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּתְעֵב מְאֹד
  choice: Er handelte äußerst abscheulich
  rationale: Die reflexiv-mediale Verbform beschreibt hier sein verabscheuungswürdiges Verhalten. Die Wiedergabe bewahrt sowohl den verbalen Charakter als auch die starke Wertung durch מְאֹד.
- source_word: לָלֶכֶת אַחֲרֵי
  choice: indem er … nachlief
  rationale: Die Infinitivkonstruktion erläutert, worin sein abscheuliches Handeln bestand. „Nachlaufen“ bewahrt das hebräische Bild einer bewusst gewählten Gefolgschaft.
- source_word: הַגִּלֻּלִים
  choice: den Götzen
  rationale: גִּלֻּלִים ist eine stark verächtliche Bezeichnung für Götzenbilder. „Götzen“ ist im Haupttext klar und idiomatisch; die noch gröbere Konnotation wird in einer Fußnote erläutert.
- source_word: כְּכֹל אֲשֶׁר עָשׂוּ
  choice: ganz so, wie es … getan hatten
  rationale: Diese natürliche deutsche Vergleichskonstruktion gibt den Bezug von Ahabs Verhalten auf die Gesamtheit des amoritischen Tuns wieder.
- source_word: הָאֱמֹרִי
  choice: die Amoriter
  rationale: Das morphologisch singularische Volkswort wird kollektiv gebraucht und daher im Deutschen natürlich im Plural wiedergegeben.
- source_word: הוֹרִישׁ
  choice: vertrieben hatte
  rationale: Der Hifil von ירשׁ bezeichnet hier, dass die früheren Bewohner aus ihrem Besitzgebiet entfernt wurden. „Vertreiben“ ist verständlich und entspricht dem Kontext.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מִפְּנֵי
  choice: vor
  rationale: Die Präposition bezeichnet hier die Entfernung der Amoriter aus dem Gebiet vor beziehungsweise angesichts Israels.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: den Söhnen Israels
  rationale: Die Wiedergabe bewahrt die konkrete maskuline Form des hebräischen Ausdrucks; das idiomatischere „den Israeliten“ wird als Alternative vermerkt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich den persönlichen Gottesnamen. „Jahwe“ bewahrt diesen, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Israeliten
  rationale: Der Haupttext erhält die wörtliche, grammatisch maskuline Bezeichnung des Bundesvolkes; die natürliche kollektive deutsche Entsprechung bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Äußerst abscheulich“ erhält die starke moralische Wertung; „nachlief“ bewahrt das anschauliche Bild religiöser Gefolgschaft. Die Satzstruktur bleibt eng am Hebräischen, ohne im Deutschen unnatürlich zu wirken.
