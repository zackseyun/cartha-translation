base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/009.yaml
  text: She wrote in the letters[a], saying, “Proclaim a fast, and seat Naboth at the head of the people.”
translation:
  language: de
  text: 'Sie schrieb in den Briefen[a]: »Ruft ein Fasten aus und setzt Nabot an die Spitze des Volkes.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »vor dem Volk« oder »an einen hervorgehobenen Platz unter dem Volk«. Wörtlich: »an das Haupt des Volkes«; die genaue räumliche oder soziale Bedeutung bleibt offen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכְתֹּב
  choice: Sie schrieb
  rationale: Das Wayyiqtol in der 3. Person Feminin Singular führt die Handlung mit Isebel als Subjekt fort. Im Deutschen gibt »Sie schrieb« dies natürlich wieder, ohne ein zusätzliches »dann« zu verlangen.
- source_word: בַּסְּפָרִים
  choice: in die Briefe
  rationale: סְפָרִים bezeichnet hier die an die führenden Männer der Stadt gerichteten Schreiben, nicht Bücher. Bei »schreiben« bezeichnet die Präposition ב hier idiomatisch das Medium beziehungsweise den Textträger; auf Deutsch ist »in die Briefe schreiben« natürlich.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Die hebräische Zitatformel wird im Deutschen am natürlichsten durch einen Doppelpunkt vor der direkten Rede wiedergegeben.
- source_word: קִרְאוּ צוֹם
  choice: Ruft ein Fasten aus
  rationale: Der pluralische Imperativ bezeichnet die öffentliche Anordnung eines gemeinschaftlichen Fastens. »Ein Fasten ausrufen« bewahrt den offiziellen und öffentlichen Charakter.
- source_word: וְהוֹשִׁיבוּ
  choice: und setzt
  rationale: Der Hifil-Imperativ Plural von ישׁב bedeutet, jemanden sitzen zu lassen beziehungsweise ihm einen Sitz zuzuweisen. »Setzt« gibt diese kausative Handlung knapp und natürlich wieder.
- source_word: אֶת נָבוֹת
  choice: Nabot
  rationale: Der Eigenname wird in der im Deutschen etablierten biblischen Form »Nabot« wiedergegeben; אֶת markiert das direkte Objekt.
- source_word: בְּרֹאשׁ הָעָם
  choice: an die Spitze des Volkes
  rationale: Die Wiedergabe bewahrt das Bild von רֹאשׁ, ohne festzulegen, ob eine führende Stellung, ein Platz vorn oder allgemein eine auffällige Position in der Versammlung gemeint ist.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede wird mit deutschen Anführungszeichen gesetzt. Die auffällige Bildsprache »an die Spitze des Volkes« bleibt erhalten, damit die räumliche beziehungsweise gesellschaftliche Nuance des Hebräischen nicht vorschnell aufgelöst wird.
