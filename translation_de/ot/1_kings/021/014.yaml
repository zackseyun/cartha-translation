  text: Then they sent word to Jezebel[a], saying, “Naboth has been stoned and is dead.”
translation:
  language: de
  text: 'Da schickten sie Isebel die Nachricht: »Nabot wurde gesteinigt und starb.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: Da schickten sie … die Nachricht
  rationale: Das Waw consecutivum führt die Erzählung weiter; »Da« gibt diesen Fortgang natürlich wieder. Mit »die Nachricht schicken« wird der durch לֵאמֹר eingeführte Mitteilungscharakter idiomatisch ausgedrückt.
- source_word: אֶל
  choice: Isebel
  rationale: Die Zielrichtung der Präposition wird im Deutschen durch den Dativ beim Verb »schicken« ausgedrückt.
- source_word: אִיזֶבֶל
  choice: Isebel
  rationale: Der Personenname folgt der im Deutschen üblichen biblischen Namensform.
- source_word: לֵאמֹר
  choice: 'die Nachricht:'
  rationale: Die hebräische Redeeinleitungsformel wird im Zusammenhang natürlich durch die Bezeichnung der Mitteilung und einen Doppelpunkt wiedergegeben; ein zusätzliches »und ließen sagen« wäre unnötig schwerfällig.
- source_word: סֻקַּל
  choice: ist gesteinigt worden
  rationale: Die passive Pual-Form wird ausdrücklich passiv wiedergegeben. »Zu Tode« wird nicht ergänzt, weil der Tod erst in der folgenden Aussage genannt wird.
- source_word: נָבוֹת
  choice: Nabot
  rationale: Der Personenname folgt der im Deutschen üblichen biblischen Namensform.
- source_word: וַיָּמֹת
  choice: und ist tot
  rationale: Wörtlich bezeichnet die Form das Eintreten des Todes (»und er starb«); im unmittelbaren Nachrichtenkontext gibt »ist tot« den gemeldeten Ergebniszustand natürlich wieder.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Die knappe Meldung und das Passiv des hebräischen Textes bleiben erhalten; es bestehen keine textlich begründeten theologischen Präzisierungen.
