  source_fidelity: Der Entwurf gibt die hebräische Erzählungsfortsetzung וַיְהִי idiomatisch mit „Da“ wieder und bewahrt die prophetische Formel דְּבַר־יְהוָה präzise als „das Wort Jahwes“. „An Elija, den Tischbiter“ entspricht sowohl der Präposition אֶל als auch der appositiven Herkunftsbezeichnung הַתִּשְׁבִּי. Der abschließende Doppelpunkt bildet die vorausweisende Funktion von לֵאמֹר korrekt ab, da die Rede im folgenden Vers beginnt.
