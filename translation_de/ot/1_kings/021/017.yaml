  text: וַ/יְהִי֙ דְּבַר יְהוָ֔ה אֶל אֵלִיָּ֥הוּ הַ/תִּשְׁבִּ֖י לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/017.yaml
  text: Then the word of Yahweh came to Elijah the Tishbite[a], saying,
translation:
  language: de
  text: 'Da erging das Wort Jahwes an Elija, den Tischbiter:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Da erging
  rationale: Die Verbfolge führt das nächste Ereignis der Erzählung ein. „Da erging“ gibt den zeitlichen Fortgang natürlich wieder und verbindet sich idiomatisch mit der prophetischen Wortereignisformel.
- source_word: דְּבַר יְהוָה
  choice: das Wort Jahwes
  rationale: „Wort“ bewahrt die feste prophetische Formel und ihre Bedeutung als göttliche Offenbarung, ohne sie deutend zu „Botschaft“ zu erweitern.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in der im Deutschen etablierten Form „Jahwe“ wiedergegeben statt durch den Titel „der HERR“ ersetzt.
- source_word: אֶל
  choice: an
  rationale: Bei der deutschen Wendung „das Wort erging“ bezeichnet „an“ idiomatisch den Empfänger der Offenbarung.
- source_word: אֵלִיָּהוּ
  choice: Elija
  rationale: Der Personenname wird in der gebräuchlichen modernen deutschen Bibelform wiedergegeben.
- source_word: הַתִּשְׁבִּי
  choice: den Tischbiter
  rationale: Die kompakte Herkunftsbezeichnung des Hebräischen bleibt erhalten; „Tischbiter“ ist die traditionelle und verständliche deutsche Form.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der hebräische Infinitiv leitet die im nächsten Vers folgende direkte Rede ein. Im natürlichen Deutschen erfüllt ein Doppelpunkt dieselbe Funktion, ohne das schwerfällige „indem er sprach“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen unmittelbar. „Jahwe“ bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Formel דְּבַר יְהוָה
  choice: das Wort Jahwes
  alternative: die Botschaft Jahwes
  rationale: „Wort“ wahrt die traditionelle prophetische Offenbarungsformel und legt ihren Inhalt nicht enger als bloße Mitteilung aus.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feste prophetische Formel „das Wort Jahwes erging an“ klingt bibelsprachlich, bleibt aber heutigen Lesern verständlich. Der Doppelpunkt gibt לֵאמֹר funktional und natürlich wieder.
