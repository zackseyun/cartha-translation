  terminology: „Jahwe“ gibt den Gottesnamen konsequent als Namen wieder. „Elija“ und „Tischbiter“ sind etablierte deutsche Bibelformen. „Wort Jahwes“ wahrt die formelhafte und theologisch wichtige Ausdrucksweise, ohne sie interpretierend zu erweitern.
