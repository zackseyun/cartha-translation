  text: הִנְ/נִ֨י מבי אֵלֶ֨י/ךָ֙ רָעָ֔ה וּ/בִעַרְתִּ֖י אַחֲרֶ֑י/ךָ וְ/הִכְרַתִּ֤י לְ/אַחְאָב֙ מַשְׁתִּ֣ין בְּ/קִ֔יר וְ/עָצ֥וּר וְ/עָז֖וּב בְּ/יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/021.yaml
  text: Behold[a], I am bringing disaster upon you, and I will sweep away after you, and I will cut off from Ahab every male, both bond and free in Israel.
translation:
  language: de
  text: Sieh, ich bringe Unheil über dich. Ich werde deine Nachkommen wegfegen und von Ahab jeden Mann in Israel ausrotten – sowohl Gebundene als auch Freie.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »jeden, der an eine Wand uriniert«; eine derbe hebräische Umschreibung für männliche Personen.'
    reason: lexical_alternative
  - marker: b
    text: 'Die genaue Bedeutung des hebräischen Wortpaars ist unsicher; möglich ist auch: »Unmündige wie Mündige«. Gemeint sind jedenfalls alle ohne Ausnahme.'
    reason: textual_or_lexical_ambiguity
lexical_decisions:
- source_word: הִנְנִי
  choice: Sieh
  rationale: Bewahrt die nachdrückliche prophetische Ankündigungsformel und klingt im heutigen Standarddeutsch natürlicher als das stärker altertümliche »Siehe«.
- source_word: מֵבִיא ... רָעָה
  choice: ich bringe Unheil
  rationale: רָעָה bezeichnet hier angekündigtes Strafgericht bzw. Verderben, nicht moralische Bosheit. »Unheil« erhält die Schwere und ist im Deutschen idiomatisch.
- source_word: אֵלֶיךָ
  choice: über dich
  rationale: Die Verbindung »Unheil über jemanden bringen« gibt die gegen Ahab gerichtete Wirkung natürlich wieder.
- source_word: וּבִעַרְתִּי אַחֲרֶיךָ
  choice: Ich werde wegfegen, was nach dir kommt
  rationale: בער im Piel bezeichnet gründliches Beseitigen; אַחֲרֶיךָ bleibt als »nach dir« erkennbar. Die Formulierung deutet den Bezug auf Ahabs Nachkommenschaft an, legt ihn aber nicht mit einem ausdrücklich im Hebräischen fehlenden Substantiv vollständig fest.
- source_word: וְהִכְרַתִּי לְאַחְאָב
  choice: alles ... das zu Ahab gehört, ... ausrotten
  rationale: Die Zugehörigkeitskonstruktion mit לְ wird im Deutschen klar wiedergegeben; »ausrotten« entspricht כרת in dieser Vernichtungsformel besser als das unnatürliche »von Ahab abschneiden«.
- source_word: מַשְׁתִּין בְּקִיר
  choice: alles Männliche
  rationale: Die derbe wörtliche Wendung bezeichnet männliche Personen. Der Haupttext vermittelt den idiomatischen Sinn, während die Fußnote den Wortlaut transparent macht.
- source_word: וְעָצוּר וְעָזוּב
  choice: Gebundene wie Freie
  rationale: Die gegensätzliche Paarung drückt umfassende Vernichtung aus. Diese Wiedergabe bleibt näher an den möglichen Grundbedeutungen »festgehalten/gebunden« und »losgelassen/frei«, ohne eine bestimmte soziale oder rechtliche Einordnung zu erzwingen.
- source_word: בְּיִשְׂרָאֵל
  choice: in Israel
  rationale: Schlichte lokative Wiedergabe des hebräischen Ausdrucks.
theological_decisions:
- issue: רָעָה als von Gott angekündigtes Gericht
  choice: Unheil
  alternative: Böses
  rationale: Im Zusammenhang bezeichnet das Wort die verhängte Katastrophe. »Unheil« vermeidet die sachlich irreführende Behauptung moralischer Bosheit, ohne die Härte des Gerichts abzuschwächen.
- issue: Bezug von וּבִעַרְתִּי אַחֲרֶיךָ
  choice: was nach dir kommt
  alternative: deine Nachkommenschaft
  rationale: Der Kontext legt Ahabs Linie bzw. Nachkommenschaft nahe, doch das hebräische Satzglied nennt sie nicht ausdrücklich. Die gewählte Form bewahrt diese Spannung.
- issue: Umfang der Vernichtungsformel וְעָצוּר וְעָזוּב
  choice: Gebundene wie Freie
  alternative: Unmündige wie Mündige
  rationale: Die genaue idiomatische Zuordnung des Wortpaars ist umstritten. Die gewählte Fassung erhält den Gegensatz und damit die Aussage der Ausnahmslosigkeit, ohne eine nicht sichere Alters- oder Rechtskategorie festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit der feierlichen Unmittelbarkeit prophetischer Gerichtssprache. Archaismen werden vermieden; die Derbheit des hebräischen Idioms und die Unsicherheit des abschließenden Wortpaars bleiben durch Fußnoten sichtbar.
