base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/001.yaml
  text: After these things[a], Naboth the Jezreelite had a vineyard in Jezreel, beside the palace of Ahab king of Samaria.
translation:
  language: de
  text: Nach diesen Ereignissen hatte Nabot, der Jesreeliter, der in Jesreel lebte, einen Weinberg neben dem Palast Ahabs, des Königs von Samaria.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: nicht gesondert wiedergegeben
  rationale: Die Form eröffnet die neue Erzähleinheit. Ihr Fortgang ist im Deutschen durch den einleitenden Zeitausdruck natürlich erkennbar; ein zusätzliches „Und es geschah“ wäre unnötig schwerfällig.
- source_word: אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: Nach diesen Ereignissen
  rationale: Die Wendung ist eine zeitliche Übergangsformel. „Ereignisse“ gibt den gemeinten Sachverhalt im heutigen Deutsch natürlicher wieder als das wörtlichere „Dinge“.
- source_word: כֶּרֶם
  choice: Weinberg
  rationale: Dies ist die übliche und kontextgemäße Bedeutung.
- source_word: הָיָה לְנָבוֹת
  choice: hatte Nabot
  rationale: Die hebräische Existenz- und Besitzkonstruktion bedeutet wörtlich etwa „Nabot war ein Weinberg zu eigen“. Die deutsche Besitzkonstruktion ist natürlich und inhaltlich genau.
- source_word: נָבוֹת הַיִּזְרְעֵאלִי
  choice: Nabot, der Jesreeliter
  rationale: Der Personenname und die Herkunftsbezeichnung werden nach gängiger deutscher Bibelnamenkonvention wiedergegeben.
- source_word: אֲשֶׁר בְּיִזְרְעֶאל
  choice: in Jesreel
  rationale: Der Relativsatz lokalisiert den Weinberg und lässt sich ohne Bedeutungsverlust knapp wiedergeben.
- source_word: אֵצֶל
  choice: neben
  rationale: Das Wort bezeichnet unmittelbare oder enge räumliche Nähe; „neben“ ist präzise und idiomatisch.
- source_word: הֵיכַל
  choice: Palast
  rationale: Im königlichen Zusammenhang bezeichnet das Wort Ahabs Residenz, nicht einen Tempel.
- source_word: מֶלֶךְ שֹׁמְרוֹן
  choice: des Königs von Samaria
  rationale: Die Apposition wird im Deutschen durch den Genitiv eindeutig und flüssig an „Ahabs“ angeschlossen.
