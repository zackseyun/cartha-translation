source:
  edition: WLC
  text: וְ/נָתַתִּ֣י אֶת בֵּיתְ/ךָ֗ כְּ/בֵית֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט וּ/כְ/בֵ֖ית בַּעְשָׁ֣א בֶן אֲחִיָּ֑ה אֶל הַ/כַּ֨עַס֙ אֲשֶׁ֣ר הִכְעַ֔סְתָּ וַֽ/תַּחֲטִ֖א אֶת יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/022.yaml
  text: And I will make your house like the house of Jeroboam son of Nebat and like the house of Baasha son of Ahijah[a], because of the provocation with which you have provoked me and caused Israel to sin.
translation:
  language: de
  text: Und ich werde dein Haus[a] dem Haus Jerobeams, des Sohnes Nebats, und dem Haus Baschas, des Sohnes Ahijas, gleichmachen, weil du mich zum Zorn gereizt und Israel zur Sünde verleitet hast.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dein Königshaus“ beziehungsweise „deine Dynastie“. Mit „Haus“ ist hier Ahabs königliche Linie gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי אֶת־בֵּיתְךָ כְּבֵית
  choice: ich werde dein Haus … gleichmachen
  rationale: נתן bedeutet wörtlich „geben“ oder „setzen“. In dieser Gerichtsformel bezeichnet die Konstruktion jedoch, dass Ahabs Haus dasselbe Schicksal wie die zuvor vernichteten Königshäuser erfahren wird. „gleichmachen“ gibt diesen resultativen Vergleich im Deutschen natürlich wieder.
- source_word: בֵּיתְךָ
  choice: dein Haus
  rationale: בַּיִת kann Haus, Haushalt oder Dynastie bezeichnen. „Haus“ bewahrt die hebräische Metapher; eine Fußnote erläutert den Bezug auf Ahabs Königshaus.
- source_word: יָרָבְעָם בֶּן־נְבָט
  choice: Jerobeam, der Sohn Nebats
  rationale: Die Namen folgen den im Deutschen eingebürgerten biblischen Formen; die hebräische Abstammungsangabe wird direkt wiedergegeben.
- source_word: בַּעְשָׁא בֶן־אֲחִיָּה
  choice: Bascha, der Sohn Ahijas
  rationale: Die Namen folgen den im Deutschen eingebürgerten biblischen Formen; die Abstammungsangabe bleibt erhalten.
- source_word: אֶל־הַכַּעַס אֲשֶׁר הִכְעַסְתָּ
  choice: weil du mich zum Zorn gereizt hast
  rationale: Die Wendung nennt den Anlass des Gerichts. Der Hifil von כעס bedeutet, jemanden zum Zorn zu reizen; das im Kontext eindeutige göttliche Objekt wird im Deutschen ausdrücklich als „mich“ wiedergegeben.
- source_word: וַתַּחֲטִא אֶת־יִשְׂרָאֵל
  choice: und Israel zur Sünde verleitet hast
  rationale: Der Hifil von חטא bezeichnet das Veranlassen zum Sündigen. „zur Sünde verleiten“ ist im modernen Deutschen klar und bewahrt Ahabs verantwortlichen Einfluss, ohne Israels eigene Verantwortung auszuschließen.
theological_decisions:
- issue: Das unausgesprochene Objekt bei הִכְעַסְתָּ
  choice: „mich“ ausdrücklich wiedergeben
  alternative: „zum Zorn gereizt hast“ ohne genanntes Objekt
  rationale: Der HERR ist der Sprecher, und die Wendung bezieht sich im Zusammenhang eindeutig darauf, dass Ahab ihn zum Zorn gereizt hat. Die Ergänzung dient der natürlichen deutschen Syntax und löst keine echte inhaltliche Mehrdeutigkeit auf.
- issue: Bedeutung von בַּיִת im königlichen Gerichtswort
  choice: Die Metapher „Haus“ im Haupttext bewahren
  alternative: Direkt mit „Dynastie“ oder „Königshaus“ übersetzen
  rationale: „Haus“ bezeichnet hier Ahabs Herrscherlinie und stellt sie den Königshäusern Jerobeams und Baschas gegenüber. Die Metapher ist auch auf Deutsch verständlich und wird durch die Fußnote präzisiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bewahrt die feierliche Gerichtsankündigung, vermeidet aber die im Deutschen unnatürliche wörtliche Formulierung „wegen der Provokation, mit der du mich provoziert hast“.
