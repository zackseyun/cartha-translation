source:
  edition: WLC
  text: וַ֠/יָּבֹאוּ שְׁנֵ֨י הָ/אֲנָשִׁ֥ים בְּנֵֽי בְלִיַּעַל֮ וַ/יֵּשְׁב֣וּ נֶגְדּ/וֹ֒ וַ/יְעִדֻ/הוּ֩ אַנְשֵׁ֨י הַ/בְּלִיַּ֜עַל אֶת נָב֗וֹת נֶ֤גֶד הָ/עָם֙ לֵ/אמֹ֔ר בֵּרַ֥ךְ נָב֛וֹת אֱלֹהִ֖ים וָ/מֶ֑לֶךְ וַ/יֹּצִאֻ֨/הוּ֙ מִ/ח֣וּץ לָ/עִ֔יר וַ/יִּסְקְלֻ֥/הוּ בָ/אֲבָנִ֖ים וַ/יָּמֹֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/013.yaml
  text: Then the two worthless men came in and sat opposite him[a], and the worthless men testified against Naboth before the people, saying, “Naboth cursed God and the king.” So they brought him outside the city and stoned him with stones[b], and he died.
translation:
  language: de
  text: 'Da kamen die beiden niederträchtigen Männer und setzten sich ihm gegenüber. Die niederträchtigen Männer sagten vor dem Volk gegen Nabot aus: »Nabot hat Gott und dem König geflucht.[a]« Darauf führten sie ihn vor die Stadt hinaus, steinigten ihn, und er starb.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb lautet wörtlich »segnen«, ist hier jedoch als ehrerbietige Verhüllung für »fluchen« gebraucht.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי בְלִיַּעַל / אַנְשֵׁי הַבְּלִיַּעַל
  choice: niederträchtige Männer
  rationale: Die Wendungen bezeichnen sittlich verworfene, gewissenlose Männer und keine leibliche Abstammung. »Niederträchtig« gibt die moralische Wertung in natürlichem Deutsch wieder, ohne »Belial« als späteren Eigennamen einzutragen.
- source_word: נֶגְדּוֹ
  choice: ihm gegenüber
  rationale: Die Präposition beschreibt die Stellung der Männer vor beziehungsweise gegenüber Nabot; »ihm gegenüber« bewahrt die räumliche Aussage knapp und idiomatisch.
- source_word: וַיְעִדֻהוּ
  choice: sagten ... gegen Nabot aus
  rationale: Der Hifil von עוּד bezeichnet hier belastendes Zeugnis in einem gerichtlichen Rahmen. Die Formulierung macht sowohl den Aussageakt als auch seine belastende Richtung deutlich.
- source_word: נֶגֶד הָעָם
  choice: vor dem Volk
  rationale: Die Wendung kennzeichnet den öffentlichen Rahmen der Anklage und wird knapp sowie quellennah wiedergegeben.
- source_word: בֵּרַךְ
  choice: geflucht
  rationale: בֵּרַךְ, wörtlich »segnen«, dient hier als ehrerbietige Verhüllung für »fluchen«. Im Haupttext steht der gemeinte Anklageinhalt; die wörtliche Form wird in der Fußnote offengelegt.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Im israelitischen Rechtskontext ist Israels Gott gemeint; der Singular entspricht dem intendierten Referenten.
- source_word: וָמֶלֶךְ
  choice: und dem König
  rationale: Die Konjunktion verbindet Gott und den König als die beiden Objekte des angeblichen Fluches.
- source_word: וַיֹּצִאֻהוּ מִחוּץ לָעִיר
  choice: führten sie ihn vor die Stadt hinaus
  rationale: Die Formulierung beschreibt Nabots Entfernung aus dem Stadtgebiet zur Hinrichtung. »Vor die Stadt hinausführen« ist natürliches Deutsch und wahrt die räumliche Aussage.
- source_word: וַיִּסְקְלֻהוּ בָאֲבָנִים
  choice: steinigten ihn
  rationale: Das deutsche Verb »steinigen« enthält bereits das im Hebräischen ausdrücklich genannte Mittel »mit Steinen«; eine zusätzliche Wiederholung wäre im modernen Deutsch unnötig schwerfällig.
- source_word: וַיָּמֹת
  choice: und er starb
  rationale: Der abschließende Narrativsatz wird direkt wiedergegeben und lässt Tod und Vollzug der Hinrichtung als aufeinanderfolgende Ereignisse stehen.
theological_decisions:
- issue: Wiedergabe des euphemistischen Verbs בֵּרַךְ in der Gotteslästerungsanklage
  choice: Im Haupttext sinngemäß mit »geflucht« übersetzen
  alternative: Formal mit »gesegnet« übersetzen und den Euphemismus erklären
  rationale: Die hebräische Form ist eine ehrerbietige Verhüllung, doch die Anklage lautet inhaltlich, Nabot habe Gott und dem König geflucht. Die Sinnwiedergabe verhindert ein Missverständnis; die Fußnote erhält die formale Besonderheit und damit die Nachprüfbarkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählführung. Die juristische Färbung bleibt durch »gegen Nabot aussagen« und »vor dem Volk« erhalten. Der idiomatische Ausdruck mit Belial wird verständlich wiedergegeben; die hebräische Euphemie bei der Anklage wird transparent in einer Fußnote erklärt.
