base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/004.yaml
  text: So Ahab went into his house sullen and angry because of the word that Naboth the Jezreelite had spoken to him[a], saying, “I will not give you the inheritance of my fathers.” And he lay down on his bed and turned his face away[c][b], and he would not eat bread.
translation:
  language: de
  text: 'Da ging Ahab missmutig und zornig in sein Haus, weil Nabot, der Jesreeliter, zu ihm gesagt hatte[a]: »Ich werde dir den Erbbesitz meiner Väter[b] nicht geben.« Dann legte er sich auf sein Bett, wandte sein Gesicht ab und wollte nichts essen.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »wegen des Wortes, das Nabot, der Jesreeliter, zu ihm geredet hatte«. Das hebräische Wort kann »Wort«, »Sache« oder »Angelegenheit« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »das Erbe meiner Vorfahren«. Hebräisch: »meiner Väter«.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »und er aß kein Brot«. »Brot essen« kann im Hebräischen das Essen allgemein bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סַר וְזָעֵף
  choice: missmutig und zornig
  rationale: Die Verbindung beschreibt Ahabs verdrossene, zurückgezogene und zugleich verärgerte Stimmung. Die deutsche Wortpaarung ist natürlich und bewahrt beide Gefühlsnuancen.
- source_word: עַל הַדָּבָר אֲשֶׁר דִּבֶּר אֵלָיו
  choice: wegen dessen, was ... zu ihm gesagt hatte
  rationale: דבר kann »Wort«, »Sache« oder »Äußerung« bedeuten. Die gewählte Formulierung gibt den Bezug auf Nabots Aussage in natürlichem Deutsch wieder; die wörtlichere Alternative wird in der Fußnote genannt.
- source_word: נָבוֹת הַיִּזְרְעֵאלִי
  choice: Nabot, der Jesreeliter
  rationale: Der Personenname wird in der etablierten deutschen Form wiedergegeben, die Herkunftsbezeichnung als »Jesreeliter«.
- source_word: נַחֲלַת אֲבוֹתָי
  choice: das Erbe meiner Väter
  rationale: נחלה bezeichnet den ererbten Familienbesitz, hier das angestammte Land. »Erbe meiner Väter« bewahrt sowohl den Erbcharakter als auch die ausdrücklich männliche Vorfahrenbezeichnung.
- source_word: וַיִּשְׁכַּב עַל מִטָּתוֹ
  choice: Er legte sich auf sein Bett
  rationale: Die Formulierung gibt den einsetzenden Erzählvorgang idiomatisch und quellennah wieder.
- source_word: וַיַּסֵּב אֶת פָּנָיו
  choice: wandte sein Gesicht ab
  rationale: Die Wendung bezeichnet sowohl die körperliche Bewegung als auch Ahabs demonstrativen Rückzug.
- source_word: וְלֹא אָכַל לָחֶם
  choice: und wollte nichts essen
  rationale: Wörtlich steht »und er aß kein Brot«. לחם kann idiomatisch Nahrung allgemein bezeichnen; die deutsche Formulierung bringt zudem die im Kontext erkennbare Verweigerung zum Ausdruck.
theological_decisions:
- issue: Geschlechtsspezifische Vorfahrensprache in Nabots Aussage
  choice: meiner Väter
  alternative: meiner Vorfahren
  rationale: Das Hebräische verwendet ausdrücklich den maskulinen Plural אֲבוֹתָי. Im Zusammenhang mit dem über die väterliche Linie überlieferten Landbesitz erhält »Väter« die familiäre und patrimoniale Färbung des Ausgangstextes.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Erzählfolge bleibt eng am Hebräischen, während idiomatische deutsche Wendungen unnötige Steifheit vermeiden. Die direkte Rede und Ahabs demonstrativer Rückzug bleiben prägnant.
