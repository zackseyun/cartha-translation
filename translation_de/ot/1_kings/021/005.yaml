base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/005.yaml
  text: Then Jezebel his wife came to him and said to him[a], “Why is your spirit so sullen that you are not eating bread?”
translation:
  language: de
  text: 'Da kam seine Frau Isebel zu ihm und sagte zu ihm[a]: »Warum bist du so missmutig, dass du kein Brot isst?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Was ist das, dass dein Geist missmutig ist und du kein Brot isst?«'
    reason: Bewahrt die ungewöhnliche hebräische Frageform sowie die wörtlichen Ausdrücke »dein Geist« und »Brot essen«.
lexical_decisions:
- source_word: וַתָּבֹא
  choice: Da kam
  rationale: Das Narrativ-Waw führt die Handlung weiter; »Da« gibt die zeitliche Abfolge im Deutschen natürlich wieder.
- source_word: אִיזֶבֶל
  choice: Isebel
  rationale: Verwendet die im Deutschen übliche biblische Namensform.
- source_word: אִשְׁתּוֹ
  choice: seine Frau
  rationale: Gibt das Substantiv mit dem Possessivsuffix unmittelbar und natürlich wieder.
- source_word: וַתְּדַבֵּר אֵלָיו
  choice: fragte ihn
  rationale: Da unmittelbar eine Frage folgt, ist »fragte ihn« im Deutschen idiomatischer als das formalere »sprach zu ihm«.
- source_word: מַה זֶּה
  choice: Warum
  rationale: Die wörtliche Wendung »Was ist dies?« erfragt hier idiomatisch den Grund für Ahabs Zustand.
- source_word: רוּחֲךָ סָרָה
  choice: bist du so missmutig
  rationale: רוּחַ bezeichnet hier die innere Verfassung; סָרָה beschreibt eine verdrossene, düstere Stimmung. Die deutsche Wendung gibt den Sinn natürlich wieder, ohne einen eigenständigen Geistbegriff zu erzwingen.
- source_word: וְאֵינְךָ אֹכֵל לָחֶם
  choice: dass du nichts isst
  rationale: »Brot essen« bezeichnet idiomatisch das Einnehmen einer Mahlzeit. »Nichts isst« ist im modernen Deutsch natürlich und bewahrt den Zusammenhang zwischen Stimmung und Nahrungsverweigerung.
