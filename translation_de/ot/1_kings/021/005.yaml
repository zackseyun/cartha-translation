  source_fidelity: 'Die Übersetzung erfasst den Sinn der hebräischen Frage gut. »fragte ihn« ist jedoch gegenüber וַתְּדַבֵּר אֵלָיו („redete/sagte zu ihm“) eine unnötige Verengung: Die anschließende direkte Frage erlaubt im Deutschen natürlich »sagte zu ihm«, ohne das hebräische Sprechverb umzudeuten. »nichts isst« gibt den Kontext zwar wieder, lässt aber das ausdrücklich vorhandene לָחֶם („Brot“) aus.'
  naturalness: Die vorgeschlagene Fassung ist modernes, verständliches Standarddeutsch. »Warum bist du so missmutig, dass du kein Brot isst?« ist idiomatisch und wahrt zugleich die Bild- und Wortwahl des Ausgangstextes.
  terminology: »Isebel« ist die etablierte deutsche biblische Namensform. »missmutig« ist für רוּחֲךָ סָרָה eine angemessene, nicht überinterpretierende Wiedergabe. »kein Brot isst« erhält das hebräische Idiom, ohne seine Bedeutung konfessionell aufzuladen.
