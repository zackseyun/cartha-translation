  - severity: low
    issue: לָחֶם („Brot“) fehlt im Haupttext.
    rationale: »nichts isst« trifft die erzählerische Implikation der Nahrungsverweigerung, tilgt aber das im Hebräischen ausdrücklich genannte „Brot“. »kein Brot isst« ist im Deutschen verständlich und quellennäher.
