  text: ק֣וּם רֵ֗ד לִ/קְרַ֛את אַחְאָ֥ב מֶֽלֶךְ יִשְׂרָאֵ֖ל אֲשֶׁ֣ר בְּ/שֹׁמְר֑וֹן הִנֵּה֙ בְּ/כֶ֣רֶם נָב֔וֹת אֲשֶׁר יָ֥רַד שָׁ֖ם לְ/רִשְׁתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/018.yaml
  text: Arise[a], go down to meet Ahab king of Israel, who is in Samaria. Look, he is in the vineyard of Naboth, where he has gone down to take possession of it.
translation:
  language: de
  text: Steh auf, geh hinab, Ahab, dem König von Israel, entgegen, der in Samaria ist. Sieh, er ist im Weinberg Nabots, wohin er hinabgegangen ist, um ihn in Besitz zu nehmen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um ihn zu besitzen“ oder „zu erben“. Das hebräische Verb kann je nach Zusammenhang das Inbesitznehmen, Besitzen oder Erben bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וּם
  choice: Steh auf
  rationale: Der Imperativ von קום fordert zum Aufstehen und unmittelbaren Handeln auf; „Steh auf“ ist im modernen Deutsch natürlich und bewahrt den entschiedenen Ton.
- source_word: רֵד
  choice: geh hinab
  rationale: Der Imperativ von ירד bezeichnet eine abwärts gerichtete Bewegung. „Geh hinab“ gibt diese Richtung ausdrücklich wieder.
- source_word: לִקְרַאת
  choice: entgegen
  rationale: Die Verbindung bezeichnet das Entgegengehen beziehungsweise Begegnen. „Entgegen“ lässt offen, welchen Charakter die bevorstehende Begegnung hat, statt bereits „konfrontieren“ einzutragen.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: dem König von Israel
  rationale: Der hebräische Herrschertitel wird direkt wiedergegeben; der Dativ ergibt sich aus der deutschen Fügung „jemandem entgegengehen“.
- source_word: אֲשֶׁר בְּשֹׁמְרוֹן
  choice: der in Samaria ist
  rationale: Der verblosen hebräischen Relativkonstruktion wird im Deutschen „ist“ hinzugefügt. Die Ortsangabe bleibt entsprechend dem überlieferten Text erhalten.
- source_word: הִנֵּה
  choice: Sieh
  rationale: Die deiktische Partikel lenkt nachdrücklich die Aufmerksamkeit auf Ahabs gegenwärtigen Aufenthaltsort. „Sieh“ ist würdig, verständlich und weniger altertümlich als „Siehe“.
- source_word: בְּכֶרֶם נָבוֹת
  choice: im Weinberg Nabots
  rationale: Die Präposition bezeichnet hier den Aufenthaltsort; der Genitiv „Nabots“ ist eine natürliche und genaue deutsche Wiedergabe.
- source_word: אֲשֶׁר יָרַד שָׁם
  choice: wohin er hinabgegangen ist
  rationale: Das Relativwort bezieht sich auf den Weinberg. „Wohin“ nimmt die gerichtete Bewegung von ירד auf; das Perfekt verbindet den vollzogenen Weg mit Ahabs dortiger Anwesenheit.
- source_word: לְרִשְׁתּוֹ
  choice: um ihn in Besitz zu nehmen
  rationale: ירשׁ kann je nach Zusammenhang „in Besitz nehmen“, „besitzen“ oder „erben“ bedeuten. Hier bezeichnet es Ahabs Aneignung des Weinbergs; „in Besitz nehmen“ wahrt den konkret-rechtlichen Sinn, ohne zusätzliche Gewalt ausdrücklich in das Verb hineinzulesen.
