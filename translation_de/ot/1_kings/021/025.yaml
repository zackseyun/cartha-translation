  text: רַ֚ק לֹֽא הָיָ֣ה כְ/אַחְאָ֔ב אֲשֶׁ֣ר הִתְמַכֵּ֔ר לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה אֲשֶׁר הֵסַ֥תָּה אֹת֖/וֹ אִיזֶ֥בֶל אִשְׁתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/025.yaml
  text: Surely there was no one like Ahab, who sold himself to do what was evil in the sight of Yahweh, because Jezebel his wife incited him.
translation:
  language: de
  text: Doch es gab keinen wie Ahab, der sich selbst verkaufte, um das zu tun, was in den Augen Jahwes böse war, den seine Frau Isebel dazu anstiftete.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: „weil seine Frau Isebel ihn dazu anstiftete“. Wörtlich ist der letzte Satz ein Relativsatz: „den seine Frau Isebel anstiftete“.'
    reason: Die Anmerkung bewahrt die mögliche kausale Sinnwiedergabe, kennzeichnet aber den unmittelbaren hebräischen Relativanschluss an Ahab genau.
lexical_decisions:
- source_word: רַק
  choice: Ja
  rationale: Die Partikel leitet hier eine nachdrückliche Feststellung ein; „Ja“ gibt diesen bekräftigenden Ton in natürlichem Deutsch wieder.
- source_word: לֹא הָיָה כְאַחְאָב
  choice: es gab niemanden wie Ahab
  rationale: Die hebräische Wendung bezeichnet Ahabs Unvergleichlichkeit und wird so idiomatisch und klar wiedergegeben.
- source_word: הִתְמַכֵּר
  choice: sich verkaufte
  rationale: Das Hitpael von מכר zeichnet bildhaft, dass Ahab sich dem Bösen auslieferte; die Metapher bleibt bewusst erhalten.
- source_word: לַעֲשׂוֹת הָרַע
  choice: um zu tun, was böse war
  rationale: Die Formulierung gibt sowohl die Zweckrichtung des Infinitivs als auch die moralische Wertung natürlich wieder.
- source_word: בְּעֵינֵי יְהוָה
  choice: in den Augen Jahwes
  rationale: Die geläufige hebräische Beurteilungsformel wird mit ihrem Bild bewahrt und bleibt im Deutschen verständlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben statt durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: הֵסַתָּה
  choice: anstiftete
  rationale: Das Hifil von סות bezeichnet hier ein provozierendes Verleiten zum Bösen; „anstiften“ trifft den negativen Zusammenhang prägnant.
- source_word: אֲשֶׁר הֵסַתָּה אֹתוֹ אִיזֶבֶל אִשְׁתּוֹ
  choice: wozu seine Frau Isebel ihn anstiftete
  rationale: Die relative Verknüpfung wird bewahrt und zugleich in idiomatischem Deutsch auf Ahabs böses Tun bezogen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen ausdrücklich. Die Wiedergabe als „Jahwe“ bewahrt den Eigennamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Verhältnis zwischen Ahabs Verantwortung und Isebels Einfluss
  choice: Ahab verkauft sich selbst; Isebel stiftet ihn dazu an
  alternative: Isebel verursacht Ahabs Handeln vollständig
  rationale: 'Der Vers hält beides zusammen: Ahabs eigenverantwortliche Hingabe an das Böse und Isebels wirksame Anstiftung. Die Übersetzung löst diese Spannung nicht einseitig auf.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die markante Metapher „sich verkaufen“ und das hebräische Bild „in den Augen“ bleiben erhalten; der Satzbau wurde für gute Verständlichkeit moderat geglättet.
