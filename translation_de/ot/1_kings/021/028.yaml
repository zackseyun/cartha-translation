  text: וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה אֶל אֵלִיָּ֥הוּ הַ/תִּשְׁבִּ֖י לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/028.yaml
  text: And the word of Yahweh came to Elijah the Tishbite[a], saying,
translation:
  language: de
  text: 'Und das Wort Jahwes erging an Elija, den Tischbiter[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „YHWH“; traditionell wiedergegeben als „der HERR“.'
    reason: Dokumentiert die Übersetzung des Tetragramms יְהוָה als „Jahwe“ entsprechend dem englischen Audit trail.
lexical_decisions:
- source_word: וַיְהִי
  choice: Da kam
  rationale: In der festen Offenbarungsformel ויהי דבר־יהוה אל gibt „Da kam …“ den erzählerischen Anschluss und das Eintreffen des göttlichen Wortes natürlich wieder.
- source_word: דְּבַר יְהוָה
  choice: das Wort Jahwes
  rationale: „Wort“ bewahrt die lexikalische Bedeutung von דָּבָר und den wiederkehrenden Klang der prophetischen Offenbarungsformel.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Umschrift.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition bezeichnet hier den Empfänger, zu dem das Offenbarungswort gelangt.
- source_word: אֵלִיָּהוּ
  choice: Elija
  rationale: Verwendet die heute gebräuchliche deutsche Namensform.
- source_word: הַתִּשְׁבִּי
  choice: dem Tischbiter
  rationale: Die substantivierte Herkunftsbezeichnung wird knapp und traditionsnah wiedergegeben, ohne den nicht ausdrücklich genannten Ortsnamen erklärend einzusetzen.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der hebräische Redeintroduktor leitet den Wortlaut im folgenden Vers ein; im natürlichen modernen Deutsch erfüllt ein Doppelpunkt dieselbe Funktion besser als das schwerfällige „indem er sprach“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen YHWH. Die Wiedergabe „Jahwe“ bewahrt diesen Namen, während „der HERR“ die traditionelle Ersatzlesung darstellt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die geläufige prophetische Formel bleibt erkennbar; der Redeanschluss wird idiomatisch durch einen Doppelpunkt ausgedrückt.
