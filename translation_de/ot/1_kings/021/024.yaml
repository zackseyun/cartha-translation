  text: הַ/מֵּ֤ת לְ/אַחְאָב֙ בָּ/עִ֔יר יֹאכְל֖וּ הַ/כְּלָבִ֑ים וְ/הַ/מֵּת֙ בַּ/שָּׂדֶ֔ה יֹאכְל֖וּ ע֥וֹף הַ/שָּׁמָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/024.yaml
  text: Anyone belonging to Ahab who dies in the city the dogs will eat[b][a], and anyone who dies in the field the birds of the sky will eat.
translation:
  language: de
  text: Wer zu Ahabs Haus gehört und in der Stadt stirbt, den werden die Hunde fressen; und wer auf dem Feld stirbt, den werden die Vögel des Himmels fressen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der Tote, der zu Ahab gehört“; gemeint ist jeder, der zu Ahabs Haus gehört und stirbt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֵּת לְאַחְאָב
  choice: Wer von Ahabs Haus ... stirbt
  rationale: Der substantivierte Partizipialausdruck ist generisch. „Von Ahabs Haus“ gibt die Zugehörigkeit zu Ahabs Haushalt beziehungsweise Dynastie idiomatisch wieder, ohne nur einen bestimmten Toten zu meinen.
- source_word: בָּעִיר
  choice: in der Stadt
  rationale: Direkte und natürliche Wiedergabe der Ortsangabe.
- source_word: יֹאכְלוּ הַכְּלָבִים
  choice: den werden die Hunde fressen
  rationale: „Fressen“ entspricht אכל im Zusammenhang mit Tieren und bewahrt die drastische Aussage; das vorangestellte Objekt bildet die hebräische Satzstruktur verständlich nach.
- source_word: וְהַמֵּת בַּשָּׂדֶה
  choice: und wer auf dem Feld stirbt
  rationale: Die wiederholte generische Konstruktion wird parallel wiedergegeben. „Auf dem Feld“ ist im modernen Deutschen die natürliche Ortsangabe und erhält den Gegensatz zwischen Stadt und Feld.
- source_word: עוֹף הַשָּׁמָיִם
  choice: die Vögel des Himmels
  rationale: Die traditionelle, würdevolle Formulierung bewahrt die hebräische Genitivverbindung; gemeint sind die Vögel am Himmel.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Parallelstruktur. „Ahabs Haus“ bezeichnet seinen Haushalt beziehungsweise seine Dynastie. Die drastische Bildsprache des Gerichts wird ohne Abschwächung bewahrt.
