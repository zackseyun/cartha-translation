source:
  edition: WLC
  text: וַֽ/יְהִי֙ כִּ/שְׁמֹ֣עַ אִיזֶ֔בֶל כִּֽי סֻקַּ֥ל נָב֖וֹת וַ/יָּמֹ֑ת וַ/תֹּ֨אמֶר אִיזֶ֜בֶל אֶל אַחְאָ֗ב ק֣וּם רֵ֞שׁ אֶת כֶּ֣רֶם נָב֣וֹת הַ/יִּזְרְעֵאלִ֗י אֲשֶׁ֤ר מֵאֵן֙ לָ/תֶת לְ/ךָ֣ בְ/כֶ֔סֶף כִּ֣י אֵ֥ין נָב֛וֹת חַ֖י כִּי מֵֽת־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/015.yaml
  text: When Jezebel heard that Naboth had been stoned and had died[a], Jezebel said to Ahab, “Get up, take possession of the vineyard of Naboth the Jezreelite, which he refused to give you for silver, because Naboth is not alive; he is dead.”
translation:
  language: de
  text: 'Als Isebel hörte, dass Nabot gesteinigt worden und gestorben war, sagte sie zu Ahab: »Steh auf und nimm den Weinberg Nabots, des Jesreeliters, in Besitz, den er dir nicht für Silber geben wollte[a]. Denn Nabot lebt nicht mehr; er ist tot.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den er dir nicht für Geld verkaufen wollte«. Wörtlich: »den er dir nicht für Silber geben wollte«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Als ... hörte
  rationale: Die hebräische Erzählungsformel leitet das nächste Geschehen ein. Im modernen Deutschen gibt »Als ... hörte« ihre zeitliche Funktion natürlich wieder.
- source_word: סֻקַּל
  choice: gesteinigt worden
  rationale: Das Passiv von סקל bezeichnet konkret die Steinigung; die passive Form bleibt erhalten.
- source_word: וַיָּמֹת
  choice: und gestorben war
  rationale: Das Plusquamperfekt ordnet Nabots Tod zeitlich vor Isebels anschließender Rede ein und bewahrt die Abfolge »gesteinigt ... und gestorben«.
- source_word: קוּם
  choice: Steh auf
  rationale: Der Imperativ wird unmittelbar, würdig und in heutigem Standarddeutsch wiedergegeben.
- source_word: רֵשׁ
  choice: nimm ... in Besitz
  rationale: ירש kann Besitzergreifung, Erben oder Verdrängen bezeichnen. Hier fordert Isebel Ahab dazu auf, den nun verfügbaren Weinberg in Besitz zu nehmen, ohne ausdrücklich eine Erbrechtsregel vorauszusetzen.
- source_word: כֶּרֶם
  choice: Weinberg
  rationale: Dies ist die übliche und kontextgerechte deutsche Entsprechung.
- source_word: הַיִּזְרְעֵאלִי
  choice: des Jesreeliters
  rationale: Das Gentiliz bezeichnet Nabot als Mann aus beziehungsweise Bewohner von Jesreel; »Jesreeliter« gibt diese Form direkt wieder.
- source_word: מֵאֵן לָתֵת לְךָ בְכֶסֶף
  choice: den er dir nicht für Silber geben wollte
  rationale: Die Formulierung bleibt nahe am Hebräischen »dir für Silber geben« und vermeidet es, das allgemeinere נתן im Haupttext ausdrücklich mit »verkaufen« festzulegen.
- source_word: בְכֶסֶף
  choice: für Silber
  rationale: כֶּסֶף bedeutet wörtlich »Silber« und kann Zahlungsmittel beziehungsweise Geld bezeichnen. »Silber« bewahrt die konkrete hebräische Ausdrucksweise.
- source_word: אֵין נָבוֹת חַי
  choice: Nabot lebt nicht mehr
  rationale: Die eigenständige erste Aussage über Nabots Tod bleibt vor dem nachfolgenden, zugespitzten »er ist tot« erhalten; »nicht mehr« klingt im Deutschen natürlicher als »ist nicht lebendig«.
- source_word: כִּי מֵת
  choice: er ist tot
  rationale: Die knappe Schlussaussage wird bewusst unverhüllt und parallel zur vorangehenden Feststellung wiedergegeben.
theological_decisions:
- issue: Bedeutung von רֵשׁ für Ahabs Erwerb des Weinbergs
  choice: nimm ... in Besitz
  alternative: erbe / bemächtige dich
  rationale: Der Vers beschreibt Isebels Aufforderung zur Besitzergreifung, legt aber weder eindeutig einen rechtmäßigen Erbgang noch ausdrücklich gewaltsames Ergreifen fest. Die Übersetzung wahrt diese Spannung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp und hart. Der Name איזבל wird in der im Deutschen etablierten biblischen Form »Isebel« wiedergegeben; נבות als »Nabot« und אחאב als »Ahab«.
