id: 1KI.21.10
reference: 1 Kings 21:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ֠/הוֹשִׁיבוּ שְׁנַ֨יִם אֲנָשִׁ֥ים בְּנֵֽי בְלִיַּעַל֮ נֶגְדּ/וֹ֒ וִ/יעִדֻ֣/הוּ לֵ/אמֹ֔ר בֵּרַ֥כְתָּ אֱלֹהִ֖ים וָ/מֶ֑לֶךְ וְ/הוֹצִיאֻ֥/הוּ וְ/סִקְלֻ֖/הוּ וְ/יָמֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/010.yaml
  text: And seat two worthless men opposite him[a], and let them testify against him, saying, ‘You have cursed God and the king.’ Then bring him out and stone him, so that he dies.
translation:
  language: de
  text: 'Und setzt ihm gegenüber zwei nichtswürdige Männer hin. Sie sollen gegen ihn aussagen: »Du hast Gott und den König verflucht[a].« Dann führt ihn hinaus und steinigt ihn, sodass er stirbt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »gesegnet«. Das hebräische Wort wird hier aus Ehrfurcht als verhüllende Bezeichnung für »verflucht« gebraucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹשִׁיבוּ
  choice: setzt … hin
  rationale: Die Kausativform von ישׁב fordert dazu auf, jemanden Platz nehmen zu lassen. „Setzt … hin“ gibt dies im modernen Deutsch knapp und natürlich wieder.
- source_word: שְׁנַיִם אֲנָשִׁים
  choice: zwei … Männer
  rationale: Der hebräische Text nennt ausdrücklich zwei männliche Zeugen und entspricht damit dem rechtlichen Erfordernis zweier Zeugen.
- source_word: בְּנֵי בְלִיַּעַל
  choice: nichtswürdige Männer
  rationale: Die idiomatische Wendung bezeichnet moralisch verdorbene, gewissenlose Menschen. „Nichtswürdige Männer“ bewahrt die abwertende Charakterisierung, ohne „Belial“ als Eigennamen zu deuten.
- source_word: נֶגְדּוֹ
  choice: ihm gegenüber
  rationale: Die Präposition bezeichnet hier eine Platzierung vor beziehungsweise gegenüber Nabot in einer förmlichen Versammlung.
- source_word: וִיעִדֻהוּ
  choice: Sie sollen gegen ihn aussagen
  rationale: Die Hifilform von עוד hat im rechtlichen Zusammenhang den Sinn „als Zeuge aussagen“. Die Formulierung macht den forensischen Charakter deutlich.
- source_word: בֵּרַכְתָּ
  choice: du hast … verflucht
  rationale: ברך bedeutet gewöhnlich „segnen“, wird hier aber als ehrfurchtsbedingter Euphemismus für „verfluchen“ gebraucht. Der Zusammenhang verlangt eine Anklage wegen Gotteslästerung und Majestätsbeleidigung.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Im Zusammenhang der Anklage ist der Gott Israels als singularischer Bezug gemeint.
- source_word: וָמֶלֶךְ
  choice: und den König
  rationale: Die Anklage verbindet das Vergehen gegen Gott mit dem Vergehen gegen die königliche Autorität.
- source_word: וְהוֹצִיאֻהוּ
  choice: führt ihn hinaus
  rationale: Das Verb bezeichnet das Hinausbringen, hier zur Hinrichtung, wahrscheinlich aus der Stadt hinaus.
- source_word: וְסִקְלֻהוּ
  choice: steinigt ihn
  rationale: Dies ist die übliche und genaue deutsche Bezeichnung für die hier angeordnete Hinrichtungsart.
- source_word: וְיָמֹת
  choice: sodass er stirbt
  rationale: Die abschließende Verbform bezeichnet das beabsichtigte beziehungsweise eintretende Ergebnis der Steinigung.
theological_decisions:
- issue: Euphemistischer Gebrauch von ברך mit Gott als Objekt
  choice: Im Haupttext mit „verflucht“ wiedergeben
  alternative: Wörtlich „gesegnet“ schreiben und die euphemistische Bedeutung nur in einer Fußnote erklären
  rationale: Der hebräische Wortlaut verwendet aus Ehrfurcht einen Euphemismus; gemeint ist jedoch eindeutig eine erfundene Anklage wegen Verfluchung beziehungsweise Lästerung Gottes und des Königs. „Gesegnet“ würde den Sinn im deutschen Haupttext irreführend wiedergeben. Die wörtliche Form bleibt in der Fußnote sichtbar.
- issue: Deutung von בְּנֵי בְלִיַּעַל
  choice: nichtswürdige Männer
  alternative: Söhne Belials
  rationale: Die Wendung ist hier eine Charakterisierung verdorbener Männer und kein eindeutiger Eigenname. Die Übersetzung vermeidet daher, spätere dämonologische Vorstellungen in den Text einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die pluralischen Aufforderungen und der rechtliche Charakter der falschen Zeugenaussage bleiben erhalten; der hebräische Euphemismus wird transparent in einer Fußnote erläutert.
