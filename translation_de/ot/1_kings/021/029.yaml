id: 1KI.21.29
reference: 1 Kings 21:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הֲֽ/רָאִ֔יתָ כִּֽי נִכְנַ֥ע אַחְאָ֖ב מִ/לְּ/פָנָ֑/י יַ֜עַן כִּֽי נִכְנַ֣ע מִ/פָּנַ֗/י לֹֽא אבי הָֽ/רָעָה֙ בְּ/יָמָ֔י/ו בִּ/ימֵ֣י בְנ֔/וֹ אָבִ֥יא הָ/רָעָ֖ה עַל בֵּיתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/029.yaml
  text: Have you seen that Ahab has humbled himself before me? Because he has humbled himself before me[a], I will not bring the disaster in his days[b]; in his son's days I will bring the disaster on his house.
translation:
  language: de
  text: Hast du gesehen, dass Ahab sich vor mir gedemütigt hat? Weil er sich vor mir gedemütigt hat, werde ich das Unheil[a] nicht zu seinen Lebzeiten bringen. In den Tagen seines Sohnes werde ich das Unheil über sein Haus[b] bringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Katastrophe“. Das hebräische Wort kann auch „das Böse“ bedeuten; hier bezeichnet es das als Gericht angekündigte Unheil.'
    reason: lexical_alternative
  - marker: b
    text: „Haus“ kann hier Ahabs Familie, Haushalt oder Dynastie bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲרָאִיתָ
  choice: Hast du gesehen
  rationale: Das Qal Perfekt 2. Person Singular steht in einer direkten Frage Gottes an Elia. Das deutsche Perfekt gibt die wahrgenommene Handlung mit gegenwärtiger Bedeutung natürlich wieder.
- source_word: נִכְנַע
  choice: hat sich gedemütigt
  rationale: Das Nifal von כנע bezeichnet hier Ahabs Selbsterniedrigung beziehungsweise Unterwerfung als Reaktion auf das Gerichtswort, ohne ausdrücklich vollständige Umkehr zu behaupten.
- source_word: מִלְּפָנַי / מִפָּנַי
  choice: vor mir
  rationale: Die Wendung bezeichnet eine Haltung in Gottes Gegenwart. „Vor mir“ ist im Deutschen knapp, idiomatisch und sachlich genau.
- source_word: יַעַן כִּי
  choice: Weil
  rationale: Die Konjunktion nennt den Grund dafür, dass das angekündigte Gericht aufgeschoben wird.
- source_word: לֹא אָבִיא
  choice: werde ich … nicht bringen
  rationale: Das Hifil von בוא mit רָעָה als Objekt bedeutet, etwas kommen zu lassen beziehungsweise herbeizuführen; „bringen“ bewahrt die Bildsprache und klingt natürlich.
- source_word: הָרָעָה
  choice: das Unheil
  rationale: רָעָה bezeichnet in diesem Gerichtszusammenhang eine von Gott verhängte Katastrophe, nicht moralische Bosheit. „Unheil“ bewahrt zugleich die Schwere und den gerichtlichen Charakter.
- source_word: בְּיָמָיו
  choice: zu seinen Lebzeiten
  rationale: Die idiomatische Wiedergabe macht deutlich, dass Ahabs eigene Lebenszeit gemeint ist.
- source_word: בִּימֵי בְנוֹ
  choice: In den Tagen seines Sohnes
  rationale: Die Formulierung bewahrt die hebräische zeitliche Wendung und den Kontrast zu Ahabs Lebzeiten.
- source_word: עַל בֵּיתוֹ
  choice: über sein Haus
  rationale: „Haus“ bewahrt die konkrete hebräische Metapher, die im königlichen Zusammenhang Haushalt, Familie oder Dynastie bezeichnen kann.
theological_decisions:
- issue: Art von Ahabs Reaktion
  choice: „hat sich … gedemütigt“
  alternative: „hat Buße getan“ oder „hat sich unterworfen“
  rationale: Der Vers beschreibt Ahabs Demütigung vor Gott und den dadurch bewirkten Aufschub des Gerichts. Er verwendet jedoch nicht ausdrücklich die übliche Terminologie für Umkehr; deshalb wird keine umfassendere Aussage über seine Buße in den Text eingetragen.
- issue: Bedeutung von רָעָה als von Gott gebrachtes Gericht
  choice: „Unheil“
  alternative: „Böses“ oder „Katastrophe“
  rationale: Im Kontext ist strafendes Gericht gemeint, nicht moralisches Böses. „Unheil“ vermeidet eine irreführende moralische Aussage und erhält dennoch den Ernst der Ankündigung.
- issue: Zeitpunkt und Aufschub des Gerichts
  choice: Das Gericht wird für Ahabs Lebenszeit verneint und für die Tage seines Sohnes angekündigt.
  alternative: Die Ankündigung als vollständige Aufhebung des Gerichts zu verstehen.
  rationale: Der Parallelismus stellt keinen Erlass, sondern einen Aufschub dar; diese Spannung bleibt ohne zusätzliche Erklärung im Haupttext erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung „sich vor mir gedemütigt hat“ und „das Unheil … bringen“ folgt der hebräischen Hervorhebung. „Zu seinen Lebzeiten“ ist eine idiomatische Wiedergabe, während „in den Tagen seines Sohnes“ die kontrastierende hebräische Formulierung bewusst stärker bewahrt.
