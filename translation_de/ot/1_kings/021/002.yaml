  register: Modernes, würdiges Standarddeutsch mit direkter, gut verständlicher Rede. Die königliche Forderung wird nicht durch Höflichkeitszusätze abgeschwächt; zugleich wird die angebotene Wahl zwischen Ersatzland und Bezahlung klar bewahrt.
