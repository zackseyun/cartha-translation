base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/002.yaml
  text: And Ahab spoke to Naboth[a], saying, “Give me your vineyard, so that it may become a vegetable garden for me, because it is near my house; and in its place I will give you a better vineyard than it. Or, if it seems good in your eyes, I will give you its price in silver.”
translation:
  language: de
  text: 'Ahab sagte zu Nabot: „Gib mir deinen Weinberg, damit er mir zu einem Gemüsegarten wird; denn er liegt nahe bei meinem Haus. Dafür gebe ich dir einen besseren Weinberg als diesen. Oder, wenn es dir lieber ist[a], zahle ich dir seinen Preis in Silber.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wenn es gut ist in deinen Augen“, eine hebräische Redewendung für Zustimmung oder Vorzug.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר ... אֶל
  choice: sagte zu
  rationale: Die Konstruktion bezeichnet hier die direkte Anrede; „sagte zu“ ist im deutschen Erzählstil natürlich und führt die folgende wörtliche Rede angemessen ein.
- source_word: תְּנָה לִּי אֶת כַּרְמְךָ
  choice: Gib mir deinen Weinberg
  rationale: Die direkte Bitte im Imperativ und die übliche Bedeutung von כֶּרֶם werden knapp und unverändert wiedergegeben.
- source_word: וִיהִי לִי לְגַן יָרָק
  choice: damit er mir als Gemüsegarten dient
  rationale: Die Form von היה bezeichnet hier den beabsichtigten Zweck. „Gemüsegarten“ gibt גַן יָרָק in heutigem Deutsch präzise wieder.
- source_word: כִּי הוּא קָרוֹב אֵצֶל בֵּיתִי
  choice: denn er liegt nahe bei meinem Haus
  rationale: Die Begründung und die räumliche Nähe bleiben ausdrücklich erhalten; „liegt“ ist bei einem Grundstück idiomatisch.
- source_word: וְאֶתְּנָה לְךָ תַּחְתָּיו
  choice: Dafür gebe ich dir
  rationale: תַּחְתָּיו bezeichnet Ersatz beziehungsweise Tausch. „Dafür“ drückt dies natürlich und knapp aus.
- source_word: כֶּרֶם טוֹב מִמֶּנּוּ
  choice: einen besseren Weinberg
  rationale: Der durch מִן ausgedrückte Vergleich wird im deutschen Komparativ natürlich wiedergegeben; das Vergleichsobjekt ist aus dem unmittelbaren Kontext eindeutig.
- source_word: אִם טוֹב בְּעֵינֶיךָ
  choice: wenn es dir lieber ist
  rationale: Die hebräische Wendung bedeutet, dass die Alternative Nabots Zustimmung oder Vorzug entspricht. Die idiomatische deutsche Wiedergabe bewahrt den Wahlcharakter.
- source_word: אֶתְּנָה לְךָ כֶסֶף מְחִיר זֶה
  choice: zahle ich dir seinen Preis in Silber
  rationale: Die Formulierung bezeichnet eine Geldzahlung im Wert des Weinbergs. „In Silber“ erhält die konkrete Ausdrucksweise des Hebräischen.
theological_decisions: []
