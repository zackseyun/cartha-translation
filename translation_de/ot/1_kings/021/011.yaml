base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/011.yaml
  text: So the men of his city—the elders and the nobles who lived in his city—did as Jezebel had sent to them[a], as it was written in the letters that she had sent to them.
translation:
  language: de
  text: Da handelten die Männer seiner Stadt – die Ältesten und die Vornehmen, die in seiner Stadt wohnten – so, wie Isebel ihnen geschrieben hatte[a], wie es in den Briefen stand, die sie ihnen geschickt hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Würdenträger“. Das hebräische Wort für „Vornehme“ kann gesellschaftlich angesehene Männer oder hochrangige Amtsträger bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: da handelten ... so
  rationale: Das häufige Verb עשה bezeichnet hier die Ausführung von Isebels Anweisungen. Die Konstruktion „so handeln, wie“ ist im Deutschen natürlich und gibt den erzählerischen Zusammenhang präzise wieder.
- source_word: אַנְשֵׁי עִירוֹ
  choice: die Männer seiner Stadt
  rationale: Wörtlich „die Männer seiner Stadt“. Die anschließende Apposition nennt männliche städtische Führungspersonen, sodass die geschlechtsspezifische Wiedergabe hier sachgerecht ist.
- source_word: הַזְּקֵנִים
  choice: die Ältesten
  rationale: Im städtischen Zusammenhang sind anerkannte Gemeindeleiter gemeint, nicht lediglich ältere Männer.
- source_word: הַחֹרִים
  choice: die Vornehmen
  rationale: Der Ausdruck bezeichnet hier Männer von hohem gesellschaftlichem Rang oder einflussreiche Amtsträger. „Vornehme“ ist verständlich und bewahrt die soziale Bedeutung, ohne einen erblichen Adel vorauszusetzen.
- source_word: הַיֹּשְׁבִים בְּעִירוֹ
  choice: die in seiner Stadt wohnten
  rationale: ישב bedeutet hier „wohnen, ansässig sein“ und bezeichnet die örtliche Zugehörigkeit der genannten Führungspersonen.
- source_word: כַּאֲשֶׁר שָׁלְחָה אֲלֵיהֶם אִיזָבֶל
  choice: so, wie Isebel ihnen aufgetragen hatte
  rationale: Wörtlich steht „wie Isebel zu ihnen gesandt hatte“, wobei das versandte Schreiben beziehungsweise dessen Weisung aus dem folgenden Satzteil hervorgeht. „Aufgetragen hatte“ macht die beabsichtigte Befolgung im Deutschen deutlich, ohne zusätzlichen Inhalt einzuführen.
- source_word: כָּתוּב בַּסְּפָרִים
  choice: wie es in den Briefen stand
  rationale: סְפָרִים bezeichnet hier aufgrund des unmittelbaren Kontextes die von Isebel versandten Briefe. „Stand“ ist eine natürliche deutsche Wiedergabe des passiven Partizips „geschrieben“.
- source_word: אֲשֶׁר שָׁלְחָה אֲלֵיהֶם
  choice: die sie ihnen geschickt hatte
  rationale: Der Relativsatz bestimmt die Briefe näher und bewahrt die Vorzeitigkeit der Sendung.
