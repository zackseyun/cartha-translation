id: 1KI.17.6
reference: 1 Kings 17:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הָ/עֹרְבִ֗ים מְבִיאִ֨ים ל֜/וֹ לֶ֤חֶם וּ/בָשָׂר֙ בַּ/בֹּ֔קֶר וְ/לֶ֥חֶם וּ/בָשָׂ֖ר בָּ/עָ֑רֶב וּ/מִן הַ/נַּ֖חַל יִשְׁתֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/006.yaml
  text: And the ravens were bringing him bread and meat in the morning[a], and bread and meat in the evening, and he would drink from the wadi.
translation:
  language: de
  text: Und die Raben brachten ihm morgens Brot und Fleisch und abends Brot und Fleisch; aus dem Wadi[a] trank er.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bach“ beziehungsweise „Wasserlauf“. Das hebräische Wort bezeichnet ein Bach- oder Flussbett, das auch nur zeitweise Wasser führen kann.'
    reason: lexikalische Alternative und Erläuterung des Landschaftsbegriffs
lexical_decisions:
- source_word: וְהָעֹרְבִים
  choice: Und die Raben
  rationale: עֹרְבִים bezeichnet gewöhnlich Raben. Die Konjunktion וְ wird als „Und“ wiedergegeben und knüpft den Vers an den vorherigen Erzählzusammenhang an.
- source_word: מְבִיאִים לוֹ
  choice: brachten ihm
  rationale: Das Partizip beschreibt hier eine fortgesetzte beziehungsweise regelmäßig wiederholte Handlung. In Verbindung mit „morgens“ und „abends“ vermittelt das deutsche Präteritum diesen wiederkehrenden Vorgang natürlich.
- source_word: לֶחֶם וּבָשָׂר
  choice: Brot und Fleisch
  rationale: Die konkreten Begriffe werden beibehalten; לֶחֶם wird nicht zum allgemeineren „Nahrung“ erweitert, und בָשָׂר bezeichnet hier essbares Fleisch.
- source_word: בַּבֹּקֶר ... בָּעָרֶב
  choice: morgens ... abends
  rationale: Die adverbialen Formen sind im modernen Deutsch idiomatisch und geben die regelmäßigen Tageszeiten knapp wieder.
- source_word: וְלֶחֶם וּבָשָׂר
  choice: und abends Brot und Fleisch
  rationale: Die Wiederholung von „Brot und Fleisch“ bleibt erhalten, um Rhythmus und Nachdruck des hebräischen Textes zu bewahren.
- source_word: וּמִן הַנַּחַל
  choice: aus dem Wadi
  rationale: נַחַל bezeichnet einen Wasserlauf beziehungsweise ein Bach- oder Flussbett, das saisonal Wasser führen kann. „Wadi“ bewahrt die landschaftliche Besonderheit genauer als das allgemeinere „Bach“.
- source_word: יִשְׁתֶּה
  choice: trank er
  rationale: Das Imperfekt hat im Zusammenhang habituelle Bedeutung. Zusammen mit der parallel beschriebenen regelmäßigen Versorgung bezeichnet das Präteritum natürlich sein wiederholtes Trinken.
theological_decisions:
- issue: Wesen der Versorgung Elias durch עֹרְבִים
  choice: wörtlich „Raben“
  alternative: menschliche Überbringer, etwa Araber oder Händler
  rationale: Die gewöhnliche lexikalische Bedeutung von עֹרְבִים ist „Raben“. Der unmittelbare Zusammenhang gibt keinen hinreichenden Grund, den Ausdruck zur Vermeidung des wunderhaften Geschehens umzudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Formulierung „Brot und Fleisch“ bleibt erhalten. Das Semikolon gliedert die Versorgung durch die Raben und das Trinken aus dem Wadi, ohne die enge Verbindung beider Aussagen aufzulösen.
