base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/003.yaml
  text: Go from here and turn yourself eastward[a], and hide yourself by the Wadi Cherith[c][b], which is east of the Jordan.
translation:
  language: de
  text: Geh von hier fort, wende dich nach Osten und verbirg dich am Wadi[a] Krit, das dem Jordan gegenüberliegt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „am Bach Krit“. Das hebräische Wort kann ein Trockental, einen jahreszeitlich wasserführenden Bachlauf oder einen Bach bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „das vor dem Angesicht des Jordan liegt“. Gemeint sein kann die Ostseite des Jordan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ מִזֶּה
  choice: Geh von hier fort
  rationale: Der Imperativ von הלך mit מִזֶּה fordert Elia auf, seinen gegenwärtigen Ort zu verlassen. „Geh von hier fort“ ist direkt und natürlich.
- source_word: וּפָנִיתָ לְּךָ קֵדְמָה
  choice: wende dich nach Osten
  rationale: פנה mit dem Richtungsadverb קֵדְמָה bezeichnet eine Wendung nach Osten. Das ethische bzw. reflexiv gefärbte לְךָ wird durch das deutsche „dich“ hinreichend wiedergegeben.
- source_word: וְנִסְתַּרְתָּ
  choice: verbirg dich
  rationale: 'Der Nifal von סתר hat hier einen reflexiven Sinn: Elia soll sich verborgen halten.'
- source_word: בְּנַחַל
  choice: am Wadi
  rationale: נחל kann ein Tal mit zeitweiligem oder ständigem Wasserlauf bezeichnen. „Wadi“ bewahrt den geografischen Charakter, ohne einen dauerhaft fließenden Bach vorauszusetzen.
- source_word: כְּרִית
  choice: Krit
  rationale: Der Ortsname wird in einer knappen, am hebräischen Konsonantenbestand orientierten deutschen Form wiedergegeben.
- source_word: אֲשֶׁר עַל פְּנֵי הַיַּרְדֵּן
  choice: der dem Jordan gegenüberliegt
  rationale: עַל־פְּנֵי bezeichnet räumlich etwas, das vor bzw. gegenüber etwas anderem liegt. „Gegenüber“ wahrt diese relationale Aussage, ohne die im Hebräischen nicht ausdrücklich genannte Ostseite in den Haupttext einzutragen.
theological_decisions: []
translation_notes:
  register: Moderne, klare und würdige Standardsprache. Die knappen Imperative des Hebräischen bleiben erhalten. Die geografische Wendung wird bewusst nicht eindeutig als „östlich des Jordan“ aufgelöst, da der Ausgangstext nur eine relationale Lageangabe bietet.
