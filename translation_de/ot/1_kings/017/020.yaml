base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/020.yaml
  text: Then he cried out to Yahweh and said[a], “O Yahweh my God, have you also brought harm on the widow with whom I am staying[b], by causing her son to die?”
translation:
  language: de
  text: 'Da rief er zu Jahwe und sagte: »Jahwe, mein Gott, hast du auch der Witwe, bei der ich als Gast wohne[b], Unheil zugefügt[a], indem du ihren Sohn sterben ließest?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Witwe Böses angetan«. Das hebräische Verb kann bedeuten, jemandem zu schaden, Unheil herbeizuführen oder jemandem übel mitzuspielen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »bei der ich als Fremder wohne«. Das hebräische Wort bezeichnet ein Wohnen als Gast, Fremder oder Abhängiger.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֶל־יְהוָה
  choice: Da rief er zu Jahwe
  rationale: קרא mit אֶל in diesem Gebetszusammenhang bezeichnet einen eindringlichen Ruf an Gott; »rief zu« gibt die Dringlichkeit wieder, ohne sie übermäßig auszumalen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: יְהוָה אֱלֹהָי
  choice: Jahwe, mein Gott
  rationale: Die direkte Anrede und das Possessivsuffix werden knapp und natürlich bewahrt.
- source_word: הֲגַם
  choice: hast du nun auch
  rationale: »Auch« erhält die erschrockene Ausweitung auf ein weiteres Unglück; »nun« macht diese Nuance im modernen Deutschen idiomatisch hörbar.
- source_word: מִתְגּוֹרֵר עִמָּהּ
  choice: bei der ich als Gast wohne
  rationale: Die Hitpael-Form von גור bezeichnet hier das Wohnen bei jemandem als Fremder, Gast oder Abhängiger; die Formulierung ist verständlich und wahrt den vorläufigen Gaststatus.
- source_word: הֲרֵעוֹתָ
  choice: Unheil gebracht
  rationale: Das Hiphil von רעע kann das Zufügen von Schaden oder das Herbeiführen von Unheil bezeichnen, ohne zwingend moralische Bosheit auszusagen.
- source_word: לְהָמִית אֶת־בְּנָהּ
  choice: indem du ihren Sohn sterben ließest
  rationale: Die Infinitivkonstruktion beschreibt Mittel oder Folge des Unheils. Die deutsche Formulierung bewahrt die im Gebet ausgesprochene göttliche Verursachung, ohne das Verb unnötig als vorsätzliche Tötung zuzuspitzen.
theological_decisions:
- issue: Ob Elija Gott moralisch Böses vorwirft oder das von Gott herbeigeführte Unheil beklagt
  choice: »über die Witwe … Unheil gebracht«
  alternative: »der Witwe Böses angetan«
  rationale: רעע lässt beide sprachlichen Richtungen zu. »Unheil gebracht« bewahrt Elijas kühne Klage und die Zuschreibung des Geschehens an Gott, ohne die Aussage eindeutig als Vorwurf moralischer Bosheit festzulegen.
- issue: Stärke der göttlichen Verursachung beim Tod des Sohnes
  choice: »indem du ihren Sohn sterben ließest«
  alternative: »indem du ihren Sohn getötet hast«
  rationale: Das kausative לְהָמִית schreibt Gott den Tod deutlich zu. »Sterben ließest« erhält diese Kausalität, vermeidet aber eine stärkere Aussage über Art und Absicht der Tötung, als der Zusammenhang verlangt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Gebetssprache bleibt unmittelbar und eindringlich; der Gottesname erscheint als »Jahwe«. Die Satzstellung folgt natürlichem Deutsch, während die erschütternde theologische Spannung der Frage erhalten bleibt.
