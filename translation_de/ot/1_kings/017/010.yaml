  text: וַ/יָּ֣קָם וַ/יֵּ֣לֶךְ צָרְפַ֗תָ/ה וַ/יָּבֹא֙ אֶל פֶּ֣תַח הָ/עִ֔יר וְ/הִנֵּֽה שָׁ֛ם אִשָּׁ֥ה אַלְמָנָ֖ה מְקֹשֶׁ֣שֶׁת עֵצִ֑ים וַ/יִּקְרָ֤א אֵלֶ֨י/הָ֙ וַ/יֹּאמַ֔ר קְחִי נָ֨א לִ֧/י מְעַט מַ֛יִם בַּ/כְּלִ֖י וְ/אֶשְׁתֶּֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/010.yaml
  text: So he arose and went to Zarephath. When he came to the entrance of the city[a], behold, a widow was there gathering sticks. He called to her and said, “Please bring me a little water in a vessel, so that I may drink.”
translation:
  language: de
  text: 'Da stand er auf und ging nach Zarefat. Als er an den Eingang der Stadt[a] kam, war dort eine Witwe, die Holz sammelte. Er rief ihr zu: »Bring mir bitte ein wenig Wasser in einem Gefäß, damit ich trinken kann.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »an das Stadttor«. Im Hebräischen steht ein allgemeineres Wort für »Eingang/Öffnung« (פֶּתַח), nicht das spezifische Wort für »Tor«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: Da stand er auf und ging
  rationale: Die beiden aufeinanderfolgenden Erzählverben werden in ihrer Abfolge bewahrt. „Da“ gibt den fortschreitenden Erzählstil natürlich wieder.
- source_word: צָרְפַתָה
  choice: nach Zarefat
  rationale: Das Richtungs-he bezeichnet die Bewegung zum Ort hin; im Deutschen wird dies idiomatisch mit „nach“ ausgedrückt. Die Form „Zarefat“ folgt einer quellennahen Umschrift des Ortsnamens.
- source_word: וַיָּבֹא אֶל פֶּתַח הָעִיר
  choice: Als er an den Eingang der Stadt kam
  rationale: פֶּתַח bedeutet allgemein „Öffnung/Eingang“ und ist weniger spezifisch als das hebräische Wort für „Tor“. Die temporale Satzfügung ist im Deutschen natürlich und erhält den Sinn der Erzählfolge.
- source_word: וְהִנֵּה
  choice: war dort
  rationale: Die Aufmerksamkeitspartikel hebt das überraschende Vorfinden der Witwe hervor. Eine wörtliche Wiedergabe mit „siehe“ wäre möglich, wirkt hier jedoch im modernen deutschen Erzählstil unnötig altertümlich; die präsentative Wirkung wird durch die Satzstellung teilweise erhalten.
- source_word: אִשָּׁה אַלְמָנָה
  choice: eine Witwe
  rationale: Die wörtliche Fügung „eine Frau, eine Witwe“ wird idiomatisch und ohne Bedeutungsverlust als „eine Witwe“ wiedergegeben.
- source_word: מְקֹשֶׁשֶׁת עֵצִים
  choice: die Holzstücke sammelte
  rationale: קשׁשׁ bezeichnet das Auflesen oder Sammeln kleiner Brennmaterialien; „Holzstücke“ vermeidet die Vorstellung von Bau- oder Nutzholz und ist im Deutschen natürlicher als ein zu enges „Stöcke“.
- source_word: וַיִּקְרָא אֵלֶיהָ
  choice: Er rief ihr zu
  rationale: קרא mit אֶל bezeichnet hier das an jemanden gerichtete Rufen. „Rief ihr zu“ klingt natürlich und lässt erkennen, dass er sie aus einer gewissen Entfernung anspricht.
- source_word: קְחִי נָא
  choice: Bring mir bitte
  rationale: לקח bedeutet grundsätzlich „nehmen“, hat in dieser Bitte aber den pragmatischen Sinn, etwas für den Sprecher zu holen beziehungsweise zu bringen. נָא wird durch „bitte“ wiedergegeben.
- source_word: מְעַט מַיִם
  choice: ein wenig Wasser
  rationale: Die Formulierung bildet die geringe Menge schlicht und würdig ab.
- source_word: בַּכְּלִי
  choice: in einem Gefäß
  rationale: כְּלִי ist ein allgemeiner Begriff für Behälter oder Gerät. „Gefäß“ bewahrt diese Unbestimmtheit; „Krug“ wäre spezifischer als der Ausgangstext.
- source_word: וְאֶשְׁתֶּה
  choice: damit ich trinken kann
  rationale: Die Kohortativform drückt den beabsichtigten Zweck der Bitte aus. „Damit ich trinken kann“ ist im modernen Deutsch natürlich und erhält diesen Zweckbezug.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der hebräische Kettenstil wurde moderat geglättet, ohne die Handlungsabfolge zu verändern. Altertümliches „siehe“ wurde vermieden; die lexikalische Unschärfe bei Stadteingang und Gefäß bleibt erhalten.
