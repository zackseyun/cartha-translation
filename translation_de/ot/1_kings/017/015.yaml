  variant: modern standard German
source:
  edition: WLC
  text: וַ/תֵּ֥לֶךְ וַ/תַּעֲשֶׂ֖ה כִּ/דְבַ֣ר אֵלִיָּ֑הוּ וַ/תֹּ֧אכַל הוא ו/היא וּ/בֵיתָ֖/הּ יָמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/015.yaml
  text: So she went and did according to the word of Elijah[a], and she ate—he and she and her household—for many days.
translation:
  language: de
  text: Da ging sie hin und handelte nach Elijas Wort. Und sie aß – er und sie und ihr Haushalt – viele Tage lang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Und sie aß – er und sie und ihr Haushalt – Tage.“ Im Hebräischen steht das Verb in der Einzahl und in weiblicher Form; danach werden die Essenden ausdrücklich aufgezählt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ
  choice: Da ging sie hin
  rationale: Das Wayyiqtol führt die Erzählung weiter. „Da“ gibt die Folgewirkung natürlich wieder, während „ging sie hin“ die Bewegung ausdrückt.
- source_word: וַתַּעֲשֶׂה כִּדְבַר אֵלִיָּהוּ
  choice: und handelte nach Elijas Wort
  rationale: עשה bezeichnet hier das Ausführen der Anweisung; „nach Elijas Wort handeln“ bleibt der hebräischen Wendung nahe und ist im Deutschen verständlich.
- source_word: וַתֹּאכַל
  choice: Und sie aß
  rationale: Das Verb steht ausdrücklich in der 3. Person Singular feminin und bezieht sich formal auf die Witwe. Die ungewöhnliche Einzahl bleibt erhalten, statt sie stillschweigend zu „sie aßen“ zu glätten.
- source_word: הוא וְהִיא וּבֵיתָהּ
  choice: er und sie und ihr Haushalt
  rationale: Die ausdrücklich genannte Reihenfolge „er und sie und ihr Haus“ wird bewahrt. „Er“ verweist im Zusammenhang am ehesten auf Elija; „Haushalt“ gibt בַּיִת hier als häusliche Gemeinschaft wieder.
- source_word: יָמִים
  choice: viele Tage lang
  rationale: Der adverbial gebrauchte Plural bezeichnet eine längere Dauer. „Viele Tage lang“ ist natürliches Deutsch und wahrt diesen Zeitaspekt.
theological_decisions:
- issue: Bezug des männlichen Pronomens הוא
  choice: „er“ bleibt als Pronomen stehen
  alternative: „Elija“ ausdrücklich einsetzen
  rationale: Der Zusammenhang legt Elija nahe, doch der hebräische Text nennt an dieser Stelle nur das Pronomen. Die Übersetzung vermeidet eine unnötige Explizierung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die auffällige hebräische Konstruktion mit femininem Verb in der Einzahl und anschließender Aufzählung wird bewusst durch Gedankenstriche sichtbar gemacht; die Fußnote erläutert sie.
