  source_fidelity: 'Der Entwurf gibt die narrative Abfolge korrekt wieder: Sie geht, handelt gemäß Elijas Anweisung, und die auffällige hebräische Konstruktion mit 3. Person Singular feminin vor der expliziten Teilnehmerliste bleibt sichtbar. „Er und sie und ihr Haushalt“ wahrt die Reihenfolge von הוּא וְהִיא וּבֵיתָהּ, ohne den pronominalen Bezug über den Text hinaus zu explizieren. „Viele Tage lang“ ist als idiomatische Wiedergabe des adverbialen Plurals יָמִים vertretbar.'
  naturalness: „Da ging sie hin und handelte nach Elijas Wort“ ist modernes, würdiges Standarddeutsch. Die zweite Satzhälfte ist absichtlich markiert und im gewöhnlichen Deutsch ungewöhnlich; die Gedankenstriche und die Fußnote machen jedoch deutlich, dass dies eine bewusste Wiedergabe der hebräischen Syntax und kein unbeabsichtigter Stilbruch ist.
  terminology: „Elija“ ist eine zulässige moderne deutsche Namensform. „Wort“ gibt דָּבָר im Sinn einer Anweisung angemessen wieder; „Haushalt“ trifft בַּיִת im Kontext der versorgten Personengruppe. Keine theologisch oder konfessionell lenkende Terminologie liegt vor.
