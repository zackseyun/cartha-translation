source:
  edition: WLC
  text: וַ/יְהִ֛י מִ/קֵּ֥ץ יָמִ֖ים וַ/יִּיבַ֣שׁ הַ/נָּ֑חַל כִּ֛י לֹֽא הָיָ֥ה גֶ֖שֶׁם בָּ/אָֽרֶץ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/007.yaml
  text: And it happened after some days that the wadi dried up[a], because there was no rain in the land.
translation:
  language: de
  text: Nach einiger Zeit trocknete der Wadi[a] aus, weil es im Land nicht geregnet hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Bach«. Das hebräische Wort bezeichnet einen zeitweise wasserführenden Wasserlauf oder Wadi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Nach einiger Zeit …
  rationale: Die Erzählformel leitet das nächste Geschehen ein. Im natürlichen modernen Deutsch wird sie in den folgenden Zeitsatz aufgenommen, statt wörtlich mit »Und es geschah« wiedergegeben zu werden.
- source_word: מִקֵּץ יָמִים
  choice: nach einiger Zeit
  rationale: Die Wendung bezeichnet im Erzählzusammenhang den Ablauf eines unbestimmten Zeitraums; »nach einiger Zeit« bewahrt diese Unbestimmtheit idiomatisch.
- source_word: וַיִּיבַשׁ
  choice: trocknete … aus
  rationale: Das Verb beschreibt hier, dass das Wasser im Wasserlauf versiegte; »austrocknen« ist dafür die natürliche deutsche Formulierung.
- source_word: הַנָּחַל
  choice: der Wadi
  rationale: נחל bezeichnet hier einen zeitweise wasserführenden Wasserlauf beziehungsweise dessen Talbett. »Wadi« bildet den nahöstlichen geografischen Sachverhalt präzise ab; die Fußnote nennt eine geläufige Alternative.
- source_word: כִּי
  choice: weil
  rationale: Die Konjunktion führt den Grund für das Austrocknen des Wadis an.
- source_word: לֹא הָיָה גֶשֶׁם
  choice: es … nicht geregnet hatte
  rationale: Das deutsche Plusquamperfekt macht natürlich deutlich, dass der ausbleibende Regen dem Austrocknen vorausging, ohne die kausale Aussage zu verändern.
- source_word: בָּאָרֶץ
  choice: im Land
  rationale: אֶרֶץ bezeichnet hier das von der Dürre betroffene Land beziehungsweise Gebiet, nicht die gesamte Erde.
theological_decisions: []
