  yaml_path: translation/ot/1_kings/017/011.yaml
  text: As she went to get it[a], he called to her and said[b], “Please bring me a piece of bread in your hand.”
translation:
  language: de
  text: 'Als sie hinging, um es zu holen, rief er ihr zu: „Bring mir bitte ein Stück Brot mit.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶךְ לָקַחַת
  choice: Als sie hinging, um es zu holen
  rationale: Die Fortsetzung der Erzählung und der anschließende Ruf legen eine gleichzeitig einsetzende Handlung nahe. Das Pronomen „es“ verweist im Zusammenhang auf das zuvor erbetene Wasser.
- source_word: וַיִּקְרָא אֵלֶיהָ
  choice: rief er ihr nach
  rationale: קרא mit אֶל bezeichnet einen an jemanden gerichteten Ruf. Da die Frau bereits fortgeht, gibt „ihr nachrufen“ die Szene im Deutschen natürlich wieder.
- source_word: לִקְחִי נָא לִי
  choice: Bring mir bitte … mit
  rationale: Der Imperativ von לקח bezeichnet hier das Aufnehmen und Herbeibringen; נָא mildert die Aufforderung höflich ab, und לִי nennt den Empfänger.
- source_word: פַּת לֶחֶם
  choice: ein Stück Brot
  rationale: Die Verbindung bezeichnet ein Stück oder einen Bissen Brot. „Ein Stück Brot“ ist verständlich, gegenwärtig und wahrt die konkrete Bedeutung.
- source_word: בְּיָדֵךְ
  choice: mit
  rationale: Wörtlich „in deiner Hand“; in diesem Zusammenhang drückt das Deutsche die gemeinte Mitnahme idiomatisch mit „mitbringen“ aus.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache mit natürlichem Erzählfluss. Die konkrete Bitte bleibt knapp; die hebräische Höflichkeitspartikel wird mit „bitte“ wiedergegeben.
