  text: Then the word of Yahweh came to him[a], saying,
translation:
  language: de
  text: 'Da kam das Wort Jahwes zu ihm:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Da kam
  rationale: Die Wayyiqtol-Form führt das nächste Ereignis der Erzählung ein. Im modernen Deutschen gibt „Da“ die zeitliche Fortführung natürlich wieder; zusammen mit „kam“ wird die hebräische Konstruktion idiomatisch abgebildet.
- source_word: דְבַר
  choice: das Wort
  rationale: In der festen prophetischen Wendung דְבַר יְהוָה bezeichnet das Wort die göttliche Mitteilung. „Wort“ bewahrt die biblische Ausdrucksweise und ihre theologische Prägung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, der im modernen Deutschen üblichen wissenschaftlichen Umschrift des persönlichen Namens.
- source_word: אֵלָיו
  choice: zu ihm
  rationale: Die Präposition אֶל mit dem Suffix der dritten Person Singular maskulin bedeutet unmittelbar „zu ihm“ und verweist im Kontext auf Elia.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv לֵאמֹר leitet die unmittelbar folgende direkte Rede ein. Im natürlichen modernen Deutsch erfüllt ein Doppelpunkt diese Funktion besser als das schwerfällige „indem er sprach“ oder ein zusätzliches „und sprach“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. „Jahwe“ bewahrt ihn als persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Formel דְבַר יְהוָה
  choice: das Wort Jahwes
  alternative: die Botschaft Jahwes
  rationale: „Wort“ hält die traditionelle prophetische Formel offen und vermeidet die interpretierende Verengung auf den Inhalt einer Botschaft.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe prophetische Formel bleibt erhalten; der Doppelpunkt leitet idiomatisch die Rede des folgenden Verses ein.
