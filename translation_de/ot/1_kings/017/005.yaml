  source_fidelity: Die Wiedergabe von וַיֵּלֶךְ וַיַּעַשׂ כִּדְבַר יְהוָה als „Da ging er und handelte nach dem Wort Jahwes“ gibt die Abfolge und den Gehorsam sachgerecht wieder. „dem Jordan gegenüber“ bewahrt die geografische Offenheit von אֲשֶׁר עַל־פְּנֵי הַיַּרְדֵּן; „östlich“ wäre stärker interpretierend. Der zweite Ortsausdruck בְּנַחַל verlangt jedoch eine Ortsangabe („am/in dem Wadi“), nicht die Bewegungsrichtung „zum Wadi“.
  naturalness: Die Sprache ist modernes, würdiges Standarddeutsch. „Er ging und ließ sich am Wadi Krit nieder“ ist idiomatisch und gibt die Verbindung von „ging“ und „wohnte/blieb“ flüssig wieder.
  terminology: „Jahwe“ ist als deutsche Form des Gottesnamens konsistent. „Wadi“ ist als geografischer Begriff treffend; die Fußnote erläutert die möglichen Bedeutungen von נחל angemessen. „Krit“ ist eine vertretbare deutsche Namensform.
  issues:
  - severity: medium
    issue: „Er ging zum Wadi Krit“ verschiebt die Ortsrelation von בְּנַחַל („an/in dem Wadi“) zu einer bloßen Zielbewegung.
    rationale: Der hebräische Text sagt, dass Elija sich am Wadi niederließ bzw. dort wohnte. Die Zielbewegung ist zwar durch das vorangehende „ging“ impliziert, sollte aber nicht den expliziten Lokativ ersetzen.
