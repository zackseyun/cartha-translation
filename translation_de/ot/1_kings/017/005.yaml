  text: וַ/יֵּ֥לֶךְ וַ/יַּ֖עַשׂ כִּ/דְבַ֣ר יְהוָ֑ה וַ/יֵּ֗לֶךְ וַ/יֵּ֨שֶׁב֙ בְּ/נַ֣חַל כְּרִ֔ית אֲשֶׁ֖ר עַל פְּנֵ֥י הַ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/005.yaml
  text: So he went and did according to the word of Yahweh[a], and he went and stayed by the Wadi Cherith[b], which is before the Jordan.
translation:
  language: de
  text: Da ging er und handelte nach dem Wort Jahwes. Er ging und ließ sich am Wadi Krit nieder, das dem Jordan gegenüberliegt.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »am Bach Krit« beziehungsweise »an dem Wasserlauf Krit«. Das hebräische Wort kann ein Wadi, eine Schlucht oder einen zeitweise wasserführenden Bach bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »das vor/gegenüber dem Jordan liegt«; eine bestimmte Himmelsrichtung wird nicht ausdrücklich genannt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Da ging er
  rationale: Das narrative Waw führt die Handlung als Reaktion auf den vorausgehenden Auftrag fort; „Da“ bildet diesen Zusammenhang im Deutschen natürlich ab.
- source_word: וַיַּעַשׂ כִּדְבַר יְהוָה
  choice: und handelte nach dem Wort Jahwes
  rationale: Die Formulierung bewahrt sowohl den Gehorsamsgedanken als auch den ausdrücklichen Bezug auf das gesprochene Wort.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: וַיֵּשֶׁב
  choice: hielt sich dort auf
  rationale: ישׁב bezeichnet hier das Bleiben beziehungsweise vorübergehende Wohnen an einem Ort; die deutsche Wendung passt zum zeitlich begrenzten Aufenthalt.
- source_word: בְּנַחַל כְּרִית
  choice: zum Wadi Krit
  rationale: נחל kann ein Wadi, eine Schlucht oder einen zeitweise wasserführenden Bach bezeichnen. „Wadi“ erhält die geografische Eigenart; Krit ist der Ortsname.
- source_word: אֲשֶׁר עַל פְּנֵי הַיַּרְדֵּן
  choice: dem Jordan gegenüber
  rationale: Die Wiedergabe bleibt nahe bei der räumlichen Wendung „vor/gegenüber“ und vermeidet die im Hebräischen nicht ausdrücklich genannte Festlegung auf „östlich“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. Die Transliteration bewahrt ihn als persönlichen Namen, ohne ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Geografische Bedeutung von עַל פְּנֵי הַיַּרְדֵּן
  choice: dem Jordan gegenüber
  alternative: östlich des Jordan
  rationale: Die hebräische Wendung bezeichnet eine Lage „vor“ oder „gegenüber“ dem Jordan, nennt aber keine Himmelsrichtung. Die Übersetzung wahrt diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „er ging“ bleibt als Merkmal der hebräischen Erzählfolge erhalten, während „hielt sich dort auf“ den vorübergehenden Aufenthalt natürlich ausdrückt.
