revisions:
- from: Da ging er und handelte nach dem Wort Jahwes. Er ging zum Wadi Krit[a] und hielt sich dort auf, dem Jordan gegenüber.[b]
  to: Da ging er und handelte nach dem Wort Jahwes. Er ging und ließ sich am Wadi Krit nieder, das dem Jordan gegenüberliegt.[a][b]
  rationale: Die Revision ersetzt die richtungsbezogene Formulierung „zum Wadi“ durch „am Wadi“ und macht mit „ließ sich ... nieder“ den durch וַיֵּשֶׁב bezeichneten Aufenthalt deutlich. Die Fußnotenanker wurden an die jeweiligen Bezugsausdrücke gesetzt; die Bedeutung des Verses bleibt unverändert.
