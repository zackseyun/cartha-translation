  text: וַ/יִּתְמֹדֵ֤ד עַל הַ/יֶּ֨לֶד֙ שָׁלֹ֣שׁ פְּעָמִ֔ים וַ/יִּקְרָ֥א אֶל יְהוָ֖ה וַ/יֹּאמַ֑ר יְהוָ֣ה אֱלֹהָ֔/י תָּ֥שָׁב נָ֛א נֶֽפֶשׁ הַ/יֶּ֥לֶד הַ/זֶּ֖ה עַל קִרְבּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/021.yaml
  text: Then he stretched himself out over the boy three times[a], and he cried out to Yahweh and said, “Yahweh my God, please let this boy’s life return to him.”
translation:
  language: de
  text: 'Dann streckte er sich dreimal über den Jungen aus und rief zu Jahwe: »Jahwe, mein Gott, lass doch das Leben[a] dieses Jungen in ihn zurückkehren!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Seele«. Wörtlich: »Lass doch die נֶפֶשׁ dieses Jungen in sein Inneres zurückkehren.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְמֹדֵד
  choice: streckte er sich … aus
  rationale: Das seltene reflexive Verb beschreibt hier, wie Elia seinen Körper über dem Jungen ausstreckt. Die Formulierung ist im Deutschen anschaulich und wahrt die körperliche Handlung.
- source_word: עַל הַיֶּלֶד
  choice: über den Jungen
  rationale: עַל bezeichnet hier die körperliche Position Elias in Bezug auf den Jungen; »über den Jungen« passt natürlich zur Handlung des Ausstreckens.
- source_word: שָׁלֹשׁ פְּעָמִים
  choice: dreimal
  rationale: Natürliche deutsche Wiedergabe der hebräischen Wendung »drei Male«.
- source_word: וַיִּקְרָא אֶל יְהוָה
  choice: rief zu Jahwe
  rationale: קרא אל bezeichnet hier den eindringlichen Gebetsruf. »Rief zu« bewahrt sowohl die Dringlichkeit als auch die Gebetsrichtung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: יְהוָה אֱלֹהָי
  choice: Jahwe, mein Gott
  rationale: Die Anrede bewahrt den Gottesnamen und das persönliche Bekenntnis »mein Gott«.
- source_word: תָּשָׁב נָא
  choice: lass doch … zurückkehren
  rationale: Der Jussiv mit נָא drückt eine dringliche, bittende Aufforderung aus; »lass doch« gibt diesen Ton im modernen Deutschen angemessen wieder.
- source_word: נֶפֶשׁ
  choice: Leben
  rationale: Im Zusammenhang der Wiederbelebung bezeichnet נֶפֶשׁ das Leben des Jungen. »Leben« ist kontextuell klar, ohne eine bestimmte Lehre über die menschliche Seele vorauszusetzen; die mögliche Wiedergabe »Seele« wird in der Fußnote bewahrt.
- source_word: הַיֶּלֶד הַזֶּה
  choice: dieses Jungen
  rationale: יַלֶד bezeichnet hier konkret den männlichen Sohn der Witwe; »Junge« ist eindeutig und natürlich.
- source_word: עַל קִרְבּוֹ
  choice: in ihn
  rationale: Die wörtliche Wendung »in/auf sein Inneres« beschreibt die Rückkehr des Lebens in den Jungen. »In ihn« bleibt dem räumlichen Bild näher als bloßes »zu ihm«, ohne unnatürlich anatomisch zu klingen.
theological_decisions:
- issue: Wiedergabe von נֶפֶשׁ bei der Wiederbelebung des Jungen
  choice: Leben
  alternative: Seele
  rationale: »Leben« trifft in der Erzählung die belebende Lebenskraft, ohne die anthropologische Frage stillschweigend zu entscheiden. Da »Seele« lexikalisch und traditionell möglich ist, wird diese Lesart in einer Fußnote ausdrücklich offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gebetsruf ist knapp und eindringlich; der Eigenname Jahwe bleibt erhalten. Die seltene körperliche Handlung wird verständlich wiedergegeben, während die Mehrdeutigkeit von נֶפֶשׁ durch die Fußnote transparent bleibt.
