  text: וַ/תֹּ֤אמֶר הָֽ/אִשָּׁה֙ אֶל אֵ֣לִיָּ֔הוּ עַתָּה֙ זֶ֣ה יָדַ֔עְתִּי כִּ֛י אִ֥ישׁ אֱלֹהִ֖ים אָ֑תָּה וּ/דְבַר יְהוָ֥ה בְּ/פִ֖י/ךָ אֱמֶֽת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/024.yaml
  text: Then the woman said to Elijah[a], “Now I know that you are a man of God, and that the word of Yahweh in your mouth is truth.”
translation:
  language: de
  text: 'Da sagte die Frau zu Elia: »Jetzt weiß ich, dass du ein Mann Gottes bist und dass das Wort Jahwes in deinem Mund Wahrheit[a] ist.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »… dass das Wort Jahwes in deinem Mund wahr ist.« Das hebräische Substantiv kann Wahrheit, Wahrhaftigkeit oder Verlässlichkeit hervorheben.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Da sagte
  rationale: Das Narrativ-Waw führt die Handlung weiter; »Da sagte« gibt die zeitliche Folge in natürlichem deutschem Erzählstil wieder.
- source_word: הָאִשָּׁה
  choice: die Frau
  rationale: Obwohl sie im Kontext die Witwe ist, steht hier das allgemeine Wort für »Frau«; die Übersetzung führt keine zusätzliche Bezeichnung ein.
- source_word: אֶל אֵלִיָּהוּ
  choice: zu Elia
  rationale: Entspricht der üblichen deutschen Form der Anredekonstruktion und verwendet die etablierte deutsche Namensform.
- source_word: עַתָּה זֶה
  choice: Jetzt
  rationale: Die emphatische hebräische Verbindung bezeichnet ihre nun gewonnene Gewissheit; »Jetzt« gibt diese Funktion idiomatisch wieder.
- source_word: יָדַעְתִּי
  choice: weiß ich
  rationale: Das Perfekt beschreibt hier eine durch das Geschehen erlangte, gegenwärtig feststehende Erkenntnis.
- source_word: אִישׁ אֱלֹהִים
  choice: ein Mann Gottes
  rationale: Bewahrt die geläufige hebräische Bezeichnung für einen Menschen, der Gott angehört und in seinem Auftrag spricht.
- source_word: וּדְבַר יְהוָה
  choice: und dass das Wort Jahwes
  rationale: »Wort« erhält die prophetische Formel und ihre theologische Prägung; der Gottesname wird als »Jahwe« wiedergegeben.
- source_word: בְּפִיךָ
  choice: in deinem Mund
  rationale: Bewahrt das konkrete hebräische Bild für das von Elia ausgesprochene Gotteswort und ist im Deutschen verständlich.
- source_word: אֱמֶת
  choice: Wahrheit ist
  rationale: Die substantivische Form bleibt erhalten und kann Wahrheit, Wahrhaftigkeit sowie Verlässlichkeit ausdrücken, ohne diese Bedeutungsbreite vorschnell aufzulösen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. »Jahwe« gibt den persönlichen Bundesnamen in der im Deutschen gebräuchlichen Form wieder.
- issue: Aussage über das durch Elia gesprochene Wort
  choice: das Wort Jahwes in deinem Mund Wahrheit ist
  alternative: das Wort Jahwes in deinem Mund wahr ist
  rationale: Die Hauptfassung bewahrt das hebräische Substantiv אֱמֶת und damit die gewichtige Aussage, ohne die ebenfalls mögliche adjektivische Wiedergabe auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am hebräischen Aussageschwerpunkt, während »Da sagte« und »Jetzt weiß ich« einen natürlichen deutschen Erzählfluss schaffen.
