  text: כַּ֤ד הַ/קֶּ֨מַח֙ לֹ֣א כָלָ֔תָה וְ/צַפַּ֥חַת הַ/שֶּׁ֖מֶן לֹ֣א חָסֵ֑ר כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֥ר דִּבֶּ֖ר בְּ/יַ֥ד אֵלִיָּֽהוּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/016.yaml
  text: The jar of flour was not used up[a], and the jug of oil did not run out, according to the word of Yahweh that he had spoken by the hand of Elijah.
translation:
  language: de
  text: Der Mehltopf wurde nicht leer, und der Ölkrug wurde nicht leer, gemäß dem Wort Jahwes, das er durch Elia gesprochen hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּד הַקֶּמַח
  choice: der Mehltopf
  rationale: כַּד bezeichnet ein Haushaltsgefäß; die knappe deutsche Zusammensetzung »Mehltopf« gibt Gefäß und Inhalt natürlich wieder.
- source_word: לֹא כָלָתָה
  choice: wurde nicht leer
  rationale: כלה bezeichnet hier das Zu-Ende-Gehen beziehungsweise Aufgebrauchtwerden des Vorrats. Auf das Gefäß bezogen ist »wurde nicht leer« im Deutschen anschaulich und idiomatisch.
- source_word: צַפַּחַת הַשֶּׁמֶן
  choice: der Ölkrug
  rationale: צַפַּחַת ist ein kleineres Gefäß für Flüssigkeit. »Ölkrug« unterscheidet es klar vom Mehlgefäß, ohne die nicht ausdrücklich genannte Ölsorte festzulegen.
- source_word: לֹא חָסֵר
  choice: versiegte nicht
  rationale: חסר meint hier, dass der Ölvorrat nicht abnahm oder ausging. »Versiegte nicht« ist eine natürliche, prägnante Wiedergabe für eine fortdauernde Flüssigkeitsquelle.
- source_word: כִּדְבַר יְהוָה
  choice: gemäß dem Wort Jahwes
  rationale: Die Formulierung bewahrt den ausdrücklichen Zusammenhang zwischen dem Geschehen und Jahwes zuvor gesprochenem Wort.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; »Jahwe« ist die geläufige deutsche Form.
- source_word: אֲשֶׁר דִּבֶּר
  choice: das er … gesprochen hatte
  rationale: Das Plusquamperfekt macht deutlich, dass Jahwes Wort dem beschriebenen fortdauernden Geschehen vorausging.
- source_word: בְּיַד אֵלִיָּהוּ
  choice: durch Elia
  rationale: Die hebräische Wendung bezeichnet Elia als vermittelnden Boten. »Durch Elia« gibt ihre Funktion in natürlichem modernem Deutsch wieder; die wörtliche Bildform bleibt in der Fußnote erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Transliteration bewahrt ihn als persönlichen Namen, ohne ihn durch einen Titel zu ersetzen.
- issue: Prophetische Vermittlung in בְּיַד אֵלִיָּהוּ
  choice: durch Elia
  alternative: durch die Hand Elias
  rationale: Jahwe bleibt der Sprecher, während Elia als menschlicher Vermittler bezeichnet wird. Die Übersetzung wahrt diese Rollenverteilung, ohne der idiomatischen Wendung eine zusätzliche Lehraussage zu entnehmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Aussagen über Mehl und Öl bleiben erhalten; »gemäß dem Wort Jahwes« bewahrt den formellen Erfüllungsbezug des hebräischen Textes.
