base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/019.yaml
  text: And he said to her[a], “Give me your son.” Then he took him from her bosom, carried him up to the upper room where he was staying[b], and laid him on his own bed.
translation:
  language: de
  text: 'Er sagte zu ihr: »Gib mir deinen Sohn.« Dann nahm er ihn aus ihrem Schoß, trug ihn hinauf in das obere Zimmer[a], in dem er wohnte, und legte ihn auf sein eigenes Bett.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in den Dachraum«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנִי לִי
  choice: Gib mir
  rationale: Der Imperativ von נתן mit לִי wird im Deutschen unmittelbar und natürlich mit »Gib mir« wiedergegeben; die Dringlichkeit bleibt erhalten, ohne unnötige Härte einzutragen.
- source_word: בְּנֵךְ
  choice: deinen Sohn
  rationale: בֵּן bezeichnet hier ausdrücklich den Sohn und nicht allgemein ein Kind.
- source_word: מֵחֵיקָהּ
  choice: von ihrem Schoß
  rationale: חֵיק bezeichnet den Brust- beziehungsweise Schoßbereich, in dem jemand eng gehalten wird. »Von ihrem Schoß« ist im heutigen Deutsch natürlich und wahrt das Bild mütterlicher Nähe.
- source_word: וַיַּעֲלֵהוּ
  choice: trug ihn hinauf
  rationale: Die Verbform bezeichnet hier das Hinaufbringen des Jungen; aus dem Zusammenhang ergibt sich, dass Elija ihn dabei trägt.
- source_word: הָעֲלִיָּה
  choice: das Obergemach
  rationale: עֲלִיָּה bezeichnet einen oben gelegenen Raum beziehungsweise Dachraum. »Obergemach« ist präzise, würdig und in biblischem Zusammenhang verständlich.
- source_word: אֲשֶׁר הוּא יֹשֵׁב שָׁם
  choice: in dem er wohnte
  rationale: ישב bezeichnet in diesem Zusammenhang den Aufenthalt beziehungsweise das Wohnen, nicht bloß das Sitzen.
- source_word: וַיַּשְׁכִּבֵהוּ
  choice: legte ihn
  rationale: Der Hifil von שׁכב bedeutet, jemanden hinzulegen; »legte ihn« ist knapp und idiomatisch.
- source_word: עַל מִטָּתוֹ
  choice: auf sein Bett
  rationale: Das Suffix verweist im Satzfluss auf Elija. Das Deutsche bewahrt die grammatische Form des Hebräischen, ohne das erläuternde »eigenes« hinzuzufügen.
