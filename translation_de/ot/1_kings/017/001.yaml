source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ אֵלִיָּ֨הוּ הַ/תִּשְׁבִּ֜י מִ/תֹּשָׁבֵ֣י גִלְעָד֮ אֶל אַחְאָב֒ חַי יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ אֲשֶׁ֣ר עָמַ֣דְתִּי לְ/פָנָ֔י/ו אִם יִהְיֶ֛ה הַ/שָּׁנִ֥ים הָ/אֵ֖לֶּה טַ֣ל וּ/מָטָ֑ר כִּ֖י אִם לְ/פִ֥י דְבָרִֽ/י־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/001.yaml
  text: And Elijah the Tishbite[a], from the inhabitants of Gilead, said to Ahab, “As Yahweh, the God of Israel, lives, before whom I stand, there will be neither dew nor rain in these years[c][b], except by my word.”
translation:
  language: de
  text: 'Und Elia, der Tischbiter[a], einer von den Bewohnern Gileads, sagte zu Ahab: »So wahr Jahwe, der Gott Israels, lebt, vor dem ich stehe: In diesen Jahren wird es weder Tau noch Regen geben[b], außer auf mein Wort hin[c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Mann aus Tischbe«. Die hebräische Form ist eine Herkunfts- oder Zugehörigkeitsbezeichnung.'
    reason: lexical_alternative
  - marker: b
    text: 'Im Hebräischen steht eine Schwurformel, die wörtlich mit »wenn es … geben wird« beginnt und hier nachdrücklich bedeutet: »Es wird nicht … geben.«'
    reason: cultural_note
  - marker: c
    text: 'Auch möglich: »nach meinem Wort« oder »auf mein Wort«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתִּשְׁבִּי
  choice: der Tischbiter
  rationale: Die Herkunfts- beziehungsweise Zugehörigkeitsbezeichnung wird als knappe, eigennamenähnliche Benennung bewahrt; die mögliche Umschreibung »der Mann aus Tischbe« steht in der Fußnote.
- source_word: מִתֹּשָׁבֵי גִלְעָד
  choice: einer von den Bewohnern Gileads
  rationale: תּוֹשָׁב bezeichnet hier einen Bewohner oder ansässigen Siedler. Die Formulierung gibt das partitive מִן verständlich wieder, ohne Elia ausdrücklich als gebürtigen Gileaditer festzulegen.
- source_word: חַי יְהוָה
  choice: So wahr Jahwe … lebt
  rationale: Die feste hebräische Schwurformel wird in einer natürlichen deutschen Eidesformel wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen ausdrücklich stehende Gottesname wird in der im Deutschen geläufigen Form »Jahwe« wiedergegeben.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Die theologisch bedeutsame Genitivverbindung wird direkt und klar wiedergegeben.
- source_word: אֲשֶׁר עָמַדְתִּי לְפָנָיו
  choice: vor dem ich stehe
  rationale: Die konkrete hebräische Wendung bleibt erhalten; ihre mögliche Bedeutung des Dienstes vor Gott wird nicht in den Haupttext hineingedeutet.
- source_word: אִם יִהְיֶה
  choice: wird es weder … noch … geben
  rationale: Im Zusammenhang des Schwurs drückt אִם eine nachdrückliche Verneinung aus. Diese muss im Deutschen ausdrücklich formuliert werden.
- source_word: טַל וּמָטָר
  choice: weder Tau noch Regen
  rationale: Beide Wettererscheinungen werden unterschieden und unter der Verneinung idiomatisch verbunden.
- source_word: הַשָּׁנִים הָאֵלֶּה
  choice: In diesen Jahren
  rationale: Die zeitliche Wendung wird nah am Hebräischen und zugleich natürlich wiedergegeben.
- source_word: כִּי אִם
  choice: außer
  rationale: Die Verbindung kennzeichnet nach der Verneinung eine Ausnahme.
- source_word: לְפִי דְבָרִי
  choice: auf mein Wort hin
  rationale: Die Formulierung bewahrt den Gedanken, dass Tau oder Regen nur entsprechend Elias prophetischem Wort eintreten, ohne eine unabhängige Macht des Propheten zu behaupten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Eigenname steht im Ausgangstext ausdrücklich da. »Jahwe« bewahrt ihn als Namen und ist die geläufige deutsche Form.
- issue: Elias prophetische Vollmacht in לְפִי דְבָרִי
  choice: außer auf mein Wort hin
  alternative: außer nach meinem Wort; es sei denn auf mein Wort
  rationale: Der Text stellt Elias Wort als Bedingung für das erneute Eintreten von Tau oder Regen dar. Die Übersetzung wahrt diese starke Aussage, erklärt sie aber nicht als vom Handeln Gottes unabhängige Macht.
- issue: Bedeutung von עמד לפני
  choice: vor dem ich stehe
  alternative: dem ich diene; in dessen Gegenwart ich stehe
  rationale: Die konkrete Gegenwarts- und Dienstformel bleibt offen genug, um sowohl Anwesenheit vor Gott als auch den darin anklingenden Dienst einzuschließen.
translation_notes:
  register: Moderne, verständliche Standardsprache mit würdigem erzählerischem Ton. Die direkte Rede verwendet eine natürliche deutsche Schwurformel; die konkreten Bilder »vor dem ich stehe«, »Tau« und »Regen« bleiben erhalten.
