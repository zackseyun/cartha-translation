base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/023.yaml
  text: Then Elijah took the boy[a], brought him down from the upper room into the house, and gave him to his mother. And Elijah said, “See, your son is alive.”
translation:
  language: de
  text: 'Dann nahm Elia den Jungen, brachte ihn aus dem oberen Raum ins Haus hinunter und gab ihn seiner Mutter. Elia sagte: »Sieh, dein Sohn lebt![a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Dein Sohn ist am Leben.«'
    reason: Die hebräische Wendung חַי בְּנֵךְ kann im Deutschen sowohl verbal mit »lebt« als auch zustandsbezogen mit »ist am Leben« wiedergegeben werden.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: nahm
  rationale: Das häufige hebräische Erzählverb לקח wird hier schlicht und natürlich mit »nahm« wiedergegeben.
- source_word: הַיֶּלֶד
  choice: den Jungen
  rationale: יֶלֶד kann »Kind« oder »Junge« bedeuten; im Zusammenhang mit dem Sohn der Frau ist »Junge« eine natürliche, nicht altersmäßig überpräzise Wiedergabe.
- source_word: וַיֹּרִדֵהוּ
  choice: brachte ihn … hinunter
  rationale: Die Kausativform von ירד bezeichnet das Hinabbringen. Die Formulierung gibt die Bewegung wieder, ohne festzulegen, ob Elia den Jungen trug.
- source_word: הָעֲלִיָּה
  choice: dem Obergemach
  rationale: עֲלִיָּה bezeichnet einen oberen Raum beziehungsweise Dachraum; »Obergemach« ist präzise und im biblischen Erzählstil verständlich.
- source_word: הַבַּיְתָה
  choice: ins Haus
  rationale: Die Richtungsendung bezeichnet eine Bewegung zum beziehungsweise in das Haus hinein; »ins Haus« bildet diese Nuance idiomatisch ab.
- source_word: וַיִּתְּנֵהוּ לְאִמּוֹ
  choice: gab ihn seiner Mutter
  rationale: נתן mit indirektem Objekt bedeutet direkt »jemandem geben«. »Gab ihn seiner Mutter zurück« wäre kontextuell plausibel, fügte aber ein im Hebräischen nicht ausdrücklich vorhandenes Element hinzu.
- source_word: רְאִי
  choice: Sieh
  rationale: Der feminine Singularimperativ von ראה richtet sich unmittelbar an die Mutter. »Sieh« bewahrt die knappe, hinweisende Kraft.
- source_word: חַי בְּנֵךְ
  choice: dein Sohn lebt
  rationale: Die knappe hebräische Nominalkonstruktion stellt fest, dass der Sohn lebendig ist. »Dein Sohn lebt« ist natürlich und bewahrt die dramatische Kürze.
theological_decisions:
- issue: Grad der ausdrücklichen Benennung des Auferweckungswunders
  choice: »dein Sohn lebt« ohne erläuternden Zusatz
  alternative: »dein Sohn ist wieder lebendig geworden« oder »dein Sohn wurde ins Leben zurückgebracht«
  rationale: Der hebräische Text stellt unmittelbar fest, dass der Sohn lebt, erklärt aber an dieser Stelle nicht zusätzlich die Art des Wunders. Die Übersetzung vermeidet daher eine theologische Ausdeutung über den Wortlaut hinaus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper Erzählführung. »Obergemach« wahrt die architektonische Bedeutung und den gehobenen biblischen Ton, ohne altertümliche Verbformen zu verwenden.
