  text: וַ/יְהִ֗י אַחַר֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה חָלָ֕ה בֶּן הָ/אִשָּׁ֖ה בַּעֲלַ֣ת הַ/בָּ֑יִת וַ/יְהִ֤י חָלְי/וֹ֙ חָזָ֣ק מְאֹ֔ד עַ֛ד אֲשֶׁ֥ר לֹא נֽוֹתְרָה בּ֖/וֹ נְשָׁמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/017.yaml
  text: After these things[a], the son of the woman who owned the house became sick, and his illness became very severe, until no breath was left in him.
translation:
  language: de
  text: Nach diesen Ereignissen wurde der Sohn der Frau, der Herrin des Hauses, krank. Seine Krankheit wurde sehr schwer, bis kein Atem mehr in ihm blieb.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bis kein Leben mehr in ihm war“. Das Hebräische sagt wörtlich: „bis kein Atem mehr in ihm blieb“.'
    reason: 'Lexikalische Alternative: נְשָׁמָה bezeichnet wörtlich den Atem und kann hier zugleich das noch vorhandene Leben meinen.'
lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: Nach diesen Ereignissen
  rationale: Gibt die hebräische Erzählüberleitung und den zeitlichen Bezug natürlich wieder; der Plural von הַדְּבָרִים bleibt in „Ereignissen“ erhalten.
- source_word: חָלָה
  choice: wurde … krank
  rationale: Bewahrt den ingressiven Sinn des Verbs, das den Eintritt der Erkrankung bezeichnet.
- source_word: בֶּן הָאִשָּׁה בַּעֲלַת הַבָּיִת
  choice: der Sohn der Frau, der das Haus gehörte
  rationale: Gibt בַּעֲלַת הַבָּיִת als Eigentümerin beziehungsweise Herrin des Hauses in klarem, modernem Deutsch wieder, ohne die altertümliche Bezeichnung „Hausherrin“ zu verlangen.
- source_word: וַיְהִי חָלְיוֹ חָזָק מְאֹד
  choice: Seine Krankheit wurde sehr schwer
  rationale: Entspricht eng der Zustandsveränderung im Hebräischen und klingt zugleich natürlich und würdig.
- source_word: עַד אֲשֶׁר לֹא נוֹתְרָה בוֹ נְשָׁמָה
  choice: bis kein Atem mehr in ihm blieb
  rationale: Bewahrt die konkrete hebräische Formulierung mit נְשָׁמָה („Atem“) und lässt ihre Aussage über das Erlöschen des Lebens stehen, ohne sie im Haupttext durch eine ausdrückliche Todesformel zu ersetzen.
theological_decisions:
- issue: Ob der letzte Satzteil ausdrücklich als Tod formuliert oder das hebräische Bild bewahrt werden soll
  choice: Das Bild „bis kein Atem mehr in ihm blieb“ wird bewahrt.
  alternative: bis kein Leben mehr in ihm war; bis er starb
  rationale: Der hebräische Text sagt, dass keine נְשָׁמָה mehr in ihm blieb. Die konkrete Wendung wird beibehalten, damit die Aussage nicht stärker festgelegt wird, als es der Wortlaut verlangt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die längere hebräische Satzfolge wurde zur besseren deutschen Lesbarkeit in zwei Sätze gegliedert; die inhaltliche Abfolge bleibt unverändert.
