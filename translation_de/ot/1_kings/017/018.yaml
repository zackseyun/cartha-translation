base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/018.yaml
  text: She said to Elijah[a], “What do I have to do with you, man of God? Have you come to me to bring my iniquity to remembrance and to cause my son to die?”
translation:
  language: de
  text: 'Sie sagte zu Elia: „Was habe ich mit dir zu schaffen, Mann Gottes? Bist du zu mir gekommen, um meine Schuld[a] in Erinnerung zu rufen und meinen Sohn zu töten?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Sünde“, „meine Verfehlung“ oder „meine Schuldlast“. Das hebräische Wort kann das Unrecht selbst, die daraus erwachsende Schuld oder deren Folgen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה לִּי וָלָךְ
  choice: Was habe ich mit dir zu schaffen?
  rationale: Die deutsche Wendung gibt die idiomatische Distanzierung, Klage und den vorwurfsvollen Ton wieder, ohne sie zu einer bloßen Informationsfrage abzuschwächen.
- source_word: אִישׁ הָאֱלֹהִים
  choice: Mann Gottes
  rationale: Dies bewahrt den im Hebräischen etablierten Titel für einen Propheten beziehungsweise göttlichen Boten.
- source_word: בָּאתָ אֵלַי
  choice: Bist du zu mir gekommen
  rationale: Das Perfekt steht in einer rhetorischen, anklagenden Frage; das deutsche Perfekt entspricht hier dem natürlichen Erzähl- und Dialogstil.
- source_word: לְהַזְכִּיר
  choice: in Erinnerung zu rufen
  rationale: Die Form ist kausativ. Die Formulierung lässt wie der hebräische Text offen, bei wem die Schuld in Erinnerung gerufen wird.
- source_word: עֲוֺנִי
  choice: meine Schuld
  rationale: עָוֹן kann Verfehlung, Schuldzustand oder Schuldfolge bezeichnen. „Schuld“ ist im heutigen Deutsch würdevoll und lässt mehr von dieser Bedeutungsbreite offen als eine eindeutig auf die Tat beschränkte Wiedergabe.
- source_word: וּלְהָמִית
  choice: und meinen Sohn sterben zu lassen
  rationale: Die kausative Form von מות wird ausdrücklich wiedergegeben, ohne vorschnell das direktere „töten“ zu wählen.
- source_word: בְּנִי
  choice: meinen Sohn
  rationale: Das hebräische Substantiv bezeichnet ausdrücklich den Sohn.
theological_decisions:
- issue: Bedeutungsumfang von עֲוֺנִי im Vorwurf der Witwe
  choice: meine Schuld
  alternative: meine Sünde / meine Verfehlung
  rationale: Die Witwe setzt den Tod ihres Sohnes mit ihrer eigenen moralischen Belastung in Beziehung. „Schuld“ bewahrt die Spannung zwischen begangenem Unrecht, daraus erwachsener Schuld und möglicher Schuldfolge, statt den Ausdruck auf nur einen Aspekt festzulegen.
- issue: Wer an die Schuld erinnert wird
  choice: meine Schuld in Erinnerung zu rufen
  alternative: mich an meine Schuld zu erinnern / Gott an meine Schuld zu erinnern
  rationale: Der hebräische Text nennt nicht ausdrücklich, wessen Erinnerung angesprochen ist. Die Übersetzung ergänzt daher weder die Witwe noch Gott als Objekt und erhält die echte Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt emotional und vorwurfsvoll; traditionelle biblische Titel werden beibehalten, während unnötig altertümliche Formulierungen vermieden werden.
