base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/013.yaml
  text: And Elijah said to her[a], “Do not fear. Go, do as you have said. But first make me a small cake from there and bring it out to me[b], and afterward make some for yourself and for your son.”
translation:
  language: de
  text: 'Elia sagte zu ihr: »Fürchte dich nicht! Geh und tu, was du gesagt hast. Doch bereite mir zuerst von dem, was da ist, einen kleinen Fladen[a] zu und bring ihn mir heraus[b]. Danach bereite für dich und deinen Sohn etwas zu.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »einen kleinen Brotfladen«; das hebräische Wort bezeichnet ein kleines gebackenes Brot oder Backwerk.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »bring ihn für mich heraus«; das Verb kann die Nuance des Herausbringens an einen anderen Ort ausdrücken.'
    reason: literal_rendering
lexical_decisions:
- source_word: אַל תִּירְאִי
  choice: Fürchte dich nicht
  rationale: Die verneinte Form von ירא bezeichnet Angst oder Furcht; die gewählte Wendung ist prägnant, würdevoll und im modernen Deutsch verständlich.
- source_word: בֹּאִי
  choice: Geh
  rationale: Wörtlich bedeutet das Verb »komm«, dient hier in der Abfolge der Aufforderungen jedoch idiomatisch als Anstoß, mit dem Vorhaben fortzufahren. Im Deutschen passt »Geh« zur anschließenden Zubereitung.
- source_word: עֲשִׂי כִדְבָרֵךְ
  choice: tu, was du gesagt hast
  rationale: Die Formulierung gibt das Handeln entsprechend ihrer zuvor geäußerten Absicht natürlich wieder.
- source_word: אַךְ
  choice: Doch
  rationale: Die Partikel schränkt die vorangehende Aufforderung ein und leitet Elias zusätzliche, vorrangige Bitte ein.
- source_word: מִשָּׁם
  choice: von dem, was da ist
  rationale: Das wörtliche »von dort« verweist im Zusammenhang auf den vorhandenen Vorrat. Die Wiedergabe macht diesen Bezug im Deutschen verständlich, ohne einen bestimmten Bestandteil hinzuzufügen.
- source_word: עֻגָה קְטַנָּה
  choice: einen kleinen Fladen
  rationale: עֻגָה bezeichnet ein kleines, rundes oder flaches Backwerk; »Fladen« vermeidet die moderne Assoziation eines süßen Kuchens.
- source_word: בָרִאשֹׁנָה
  choice: zuerst
  rationale: Das Wort kennzeichnet eindeutig die zeitliche Priorität von Elias Anteil.
- source_word: וְהוֹצֵאתְ לִי
  choice: und bring ihn mir heraus
  rationale: Der Hifil von יצא bedeutet »herausbringen«. »Ihn« nimmt den grammatisch maskulinen Fladen auf.
- source_word: וְלָךְ וְלִבְנֵךְ תַּעֲשִׂי
  choice: kannst du für dich und deinen Sohn etwas zubereiten
  rationale: Das im Hebräischen ausgelassene Objekt wird aus dem vorhergehenden Satz ergänzt. Das Modalverb gibt die im Kontext erlaubende beziehungsweise anweisende Fortsetzung natürlich wieder, ohne die Reihenfolge abzuschwächen.
- source_word: בָּאַחֲרֹנָה
  choice: Danach
  rationale: Der Ausdruck bezeichnet hier die nachfolgende Reihenfolge.
theological_decisions:
- issue: Mögliche ethische oder theologische Irritation darüber, dass Elia zuerst versorgt werden soll
  choice: Die zeitliche Priorität wird mit »zuerst« und »Danach« unverändert wiedergegeben.
  alternative: Elias Forderung abschwächen oder durch eine erklärende Paraphrase rechtfertigen.
  rationale: Der hebräische Text stellt die Reihenfolge ausdrücklich heraus. Die Übersetzung bewahrt diese Spannung und überlässt ihre Einordnung dem Zusammenhang.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp und bestimmt. »Fladen« vermeidet das im heutigen Deutsch meist süß verstandene »Kuchen«. Sämtliche Fußnotenmarker stehen im Haupttext.
