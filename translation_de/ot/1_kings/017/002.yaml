base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/002.yaml
  text: And the word of Yahweh came to him[a], saying,
translation:
  language: de
  text: 'Da erging das Wort Jahwes an ihn[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zu ihm“. Gemeint ist Elia.'
    reason: Das deutsche Pronomen folgt dem hebräischen Text; der Bezug auf Elia ergibt sich aus dem vorhergehenden Vers.
lexical_decisions:
- source_word: וַיְהִי
  choice: Da erging
  rationale: Die Wayyiqtol-Form führt die nächste Handlung der Erzählung ein. „Da erging“ gibt sowohl die narrative Folge als auch die im Deutschen übliche prophetische Formel natürlich wieder.
- source_word: דְבַר
  choice: das Wort
  rationale: Die Constructusverbindung mit dem Gottesnamen bildet die feste Offenbarungsformel „das Wort Jahwes“. „Wort“ bewahrt deren formelhaften und offenbarungsbezogenen Charakter.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֵלָיו
  choice: an ihn
  rationale: אֶל mit Pronominalsuffix bezeichnet hier die Ausrichtung der göttlichen Mitteilung auf Elia. In der deutschen Offenbarungsformel ist „erging … an ihn“ idiomatisch.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv leitet die unmittelbar folgende direkte Rede ein. Im modernen Deutschen erfüllt ein Doppelpunkt diese Funktion natürlicher als das wörtliche „indem er sprach“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet das Tetragramm als persönlichen Gottesnamen. „Jahwe“ wahrt den Eigennamen, während „der HERR“ die traditionelle Ersatzlesung darstellt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feste prophetische Wendung „das Wort Jahwes erging an …“ bleibt erkennbar; der Doppelpunkt leitet die folgende direkte Rede idiomatisch ein.
