id: 1KI.17.4
reference: 1 Kings 17:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הָיָ֖ה מֵ/הַ/נַּ֣חַל תִּשְׁתֶּ֑ה וְ/אֶת הָ/עֹרְבִ֣ים צִוִּ֔יתִי לְ/כַלְכֶּלְ/ךָ֖ שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/004.yaml
  text: And it shall be that you will drink from the brook[c][b][a], and I have commanded the ravens to provide for you there.
translation:
  language: de
  text: Aus dem Bach[a] sollst du trinken, und ich habe den Raben[b] geboten, dich dort zu versorgen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wasserlauf« oder »Wadi«.'
    reason: lexical_alternative
  - marker: b
    text: Vereinzelt wurde hier eine Bezeichnung für Nichtvögel vorgeschlagen; der gewöhnliche hebräische Wortsinn meint jedoch Raben, und der folgende Zusammenhang stützt dieses Verständnis.
    reason: alternative_reading
  - marker: c
    text: 'Oder: »dich zu ernähren« oder »für deinen Unterhalt zu sorgen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: nicht eigens wiedergegeben
  rationale: Die hebräische Einleitungsformel führt hier den folgenden Umstand ein. Im modernen Deutschen ergibt die direkte Satzfolge denselben Zusammenhang natürlicher als eine formelhafte Wiedergabe wie »Und es wird geschehen«.
- source_word: מֵהַנַּחַל
  choice: aus dem Bach
  rationale: נַחַל kann einen Bach, Wasserlauf oder ein Wadi bezeichnen. »Bach« ist allgemein verständlich und passt zum erzählten Zusammenhang; die geografisch genauere Alternative wird in einer Fußnote genannt.
- source_word: תִּשְׁתֶּה
  choice: sollst du trinken
  rationale: Das Imperfekt 2. Person Maskulin Singular bezeichnet die bevorstehende Handlung im Zusammenhang einer göttlichen Anweisung. »Sollst du trinken« gibt im Deutschen sowohl Zukunft als auch Bestimmung natürlich wieder.
- source_word: הָעֹרְבִים
  choice: den Raben
  rationale: Die gewöhnliche Bedeutung des Substantivs ist »Raben« beziehungsweise Rabenvögel. Auch der folgende Erzählzusammenhang, in dem sie Nahrung bringen, stützt dieses Verständnis.
- source_word: צִוִּיתִי
  choice: ich habe ... geboten
  rationale: Das Perfekt bezeichnet einen bereits ergangenen Befehl mit fortdauernder Bedeutung für Elia.
- source_word: לְכַלְכֶּלְךָ
  choice: dich zu versorgen
  rationale: Das Verb bedeutet ernähren, unterhalten oder versorgen. »Versorgen« bewahrt die semantische Breite und passt zur folgenden Bereitstellung von Nahrung.
- source_word: שָׁם
  choice: dort
  rationale: Direkte und natürliche Wiedergabe des Ortsadverbs.
theological_decisions:
- issue: Wesen der beauftragten Raben
  choice: Gemeint sind buchstäblich Raben als von Gott beauftragte Tiere.
  alternative: Gelegentlich wurde statt der Vögel ein Ortsname oder eine Menschengruppe vorgeschlagen.
  rationale: Der gewöhnliche hebräische Wortsinn bezeichnet Raben, und der folgende Kontext berichtet, dass sie Brot und Fleisch bringen. Die Übersetzung bewahrt daher den naheliegenden Sinn, ohne das ungewöhnliche Geschehen umzudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Einleitungsformel wird zugunsten eines natürlichen deutschen Satzes implizit wiedergegeben; die Wortstellung stellt die angewiesene Wasserquelle klar heraus.
