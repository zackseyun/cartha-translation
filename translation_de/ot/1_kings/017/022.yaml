  source_fidelity: 'Die Übersetzung gibt die Satzfolge und die wesentlichen hebräischen Ausdrücke treffend wieder: Jahwe reagiert auf Elijas Stimme; die nefesch/das Leben des Kindes kehrt in sein Inneres zurück; darauf lebt das Kind. „hörte auf“ ist als Reaktion auf die Bitte vertretbar, ohne das stärker interpretierende „erhörte“ zu wählen. Die Wiedergabe von עַל־קִרְבּוֹ als „in sein Inneres“ ist idiomatisch und bewahrt die Körper-/Innenraumvorstellung hinreichend.'
  naturalness: Modernes, verständliches und würdiges Standarddeutsch. Der Wechsel zu „Da“ im zweiten Satz bildet die hebräische Erzählfolge natürlich ab. Das neutrale Pronomen „es“ ist mit „das Kind“ grammatisch korrekt und stilistisch unauffällig.
  terminology: „Jahwe“ wahrt den im Ausgangstext stehenden Gottesnamen. „Leben“ für נפש vermeidet eine unnötige anthropologische Festlegung; die Fußnote dokumentiert mit „Seele“ die wichtige lexikalische Alternative. Elija ist die im Deutschen übliche Namensform.
