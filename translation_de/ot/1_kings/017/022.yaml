id: 1KI.17.22
reference: 1 Kings 17:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֥ע יְהוָ֖ה בְּ/ק֣וֹל אֵלִיָּ֑הוּ וַ/תָּ֧שָׁב נֶֽפֶשׁ הַ/יֶּ֛לֶד עַל קִרְבּ֖/וֹ וַ/יֶּֽחִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/022.yaml
  text: And Yahweh listened to the voice of Elijah[a], and the life of the child returned to his inner being, and he lived.
translation:
  language: de
  text: Und Jahwe hörte auf Elijas Stimme. Da kehrte das Leben[a] des Kindes in sein Inneres zurück, und es lebte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Seele“. Das hebräische Wort nefesch kann je nach Zusammenhang „Leben“, „Seele“ oder „Selbst“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: hörte auf
  rationale: שׁמע bezeichnet hier nicht nur akustisches Hören, sondern das zustimmende Hören und Reagieren auf Elijas Bitte. „Hörte auf“ gibt dies natürlich wieder, ohne das Verb ausdrücklich als „erhörte“ auszudeuten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, damit der im Hebräischen stehende Eigenname erhalten bleibt und nicht durch einen Titel ersetzt wird.
- source_word: בְּקוֹל אֵלִיָּהוּ
  choice: auf Elijas Stimme
  rationale: Die konkrete hebräische Wendung „auf die Stimme Elijas“ bleibt erhalten; „Gebet“ oder „Flehen“ wären sinnentsprechend, aber stärker deutend.
- source_word: וַתָּשָׁב
  choice: kehrte … zurück
  rationale: שׁוב bezeichnet hier die Rückkehr beziehungsweise Wiederherstellung des Lebens. „Kehrte zurück“ entspricht dem Bild und ist im Deutschen idiomatisch.
- source_word: נֶפֶשׁ
  choice: das Leben
  rationale: נֶפֶשׁ kann unter anderem Leben, Seele oder Selbst bezeichnen. Im Zusammenhang mit der Wiederbelebung des gestorbenen Kindes gibt „das Leben“ den unmittelbaren Erzählsinn wieder, ohne eine bestimmte Leib-Seele-Lehre vorauszusetzen.
- source_word: הַיֶּלֶד
  choice: des Kindes
  rationale: יֶלֶד bezeichnet ein Kind beziehungsweise einen Jungen. „Kind“ passt zum Erzählzusammenhang und gibt den Begriff ohne unnötige Präzisierung wieder.
- source_word: עַל קִרְבּוֹ
  choice: in sein Inneres
  rationale: קֶרֶב bezeichnet das Innere oder die inneren Teile. Die Formulierung bewahrt die räumlich-körperliche Bildsprache des Hebräischen besser als das glattere „in es“.
- source_word: וַיֶּחִי
  choice: und es lebte
  rationale: 'חיה stellt das Ergebnis knapp fest: Das Kind lebte. Das grammatische Neutrum „es“ bezieht sich im Deutschen natürlich auf „das Kind“.'
theological_decisions:
- issue: Wiedergabe von נֶפֶשׁ bei der Wiederbelebung des Kindes
  choice: das Leben
  alternative: die Seele
  rationale: „Das Leben“ entspricht hier am unmittelbarsten dem erzählten Geschehen und legt keine über den hebräischen Wortlaut hinausgehende Anthropologie fest. Die traditionelle und lexikalisch mögliche Wiedergabe „Seele“ wird in der Fußnote offengelegt, damit die echte Bedeutungsbreite sichtbar bleibt.
translation_notes:
  register: Moderne, würdige Standardsprache. Der erste hebräische Satzanschluss wird als neuer deutscher Satz mit „Da“ gestaltet, um die Ereignisfolge natürlich auszudrücken. Die konkreten Bilder „Stimme“ und „Inneres“ bleiben erhalten; zugleich wird unnötig altertümliche oder konfessionell geprägte Sprache vermieden.
