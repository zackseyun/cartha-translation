  text: ק֣וּם לֵ֤ךְ צָרְפַ֨תָ/ה֙ אֲשֶׁ֣ר לְ/צִיד֔וֹן וְ/יָשַׁבְתָּ֖ שָׁ֑ם הִנֵּ֨ה צִוִּ֥יתִי שָׁ֛ם אִשָּׁ֥ה אַלְמָנָ֖ה לְ/כַלְכְּלֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/009.yaml
  text: Get up[a], go to Zarephath, which belongs to Sidon, and stay there. Look[b], I have commanded a widow there to provide for you.
translation:
  language: de
  text: Steh auf und geh nach Sarepta, das zu Sidon gehört,[a] und bleib dort. Sieh, ich habe dort einer Witwe geboten, dich zu versorgen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das in Sidon liegt« oder »das bei Sidon liegt«. Im Hebräischen wird Sarepta wörtlicher Sidon zugeordnet; wahrscheinlich ist eine regionale oder politische Zugehörigkeit gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Ich habe dort eine Witwe dazu bestimmt, dich zu versorgen«. Im Hebräischen steht »ich habe geboten«. Das kann Gottes souveräne Weisung bezeichnen, auch wenn die Erzählung noch nicht erkennen lässt, dass die Witwe sich eines solchen Gebots bewusst ist.'
    reason: alternative_reading
lexical_decisions:
- source_word: ק֣וּם
  choice: Steh auf
  rationale: Der Imperativ von קום fordert zum Aufstehen beziehungsweise Aufbruch auf. »Steh auf« ist natürliches modernes Deutsch und bewahrt die Kraft des Befehls.
- source_word: לֵ֤ךְ
  choice: geh
  rationale: Der Imperativ von הלך bezeichnet hier die zielgerichtete Bewegung. »Geh« ist die direkte und idiomatische Wiedergabe.
- source_word: צָרְפַתָה
  choice: Sarepta
  rationale: Für den Ortsnamen wird die im Deutschen etablierte biblische Namensform verwendet.
- source_word: אֲשֶׁר לְצִידוֹן
  choice: das zu Sidon gehört
  rationale: Die Präposition ל ordnet Sarepta Sidon zu und kann eine regionale oder politische Zugehörigkeit ausdrücken. Die Formulierung bewahrt diese Beziehung, ohne sie enger als nötig geografisch festzulegen.
- source_word: וְיָשַׁבְתָּ שָׁם
  choice: und bleib dort
  rationale: Die Verbform setzt die vorausgehenden Imperative als weitere Anweisung fort. »Bleib dort« gibt den beabsichtigten Aufenthalt natürlich wieder.
- source_word: הִנֵּה
  choice: Sieh
  rationale: Die Aufmerksamkeitspartikel hebt die folgende göttliche Aussage hervor. »Sieh« erfüllt diese Diskursfunktion in würdigem, verständlichem Deutsch.
- source_word: צִוִּיתִי
  choice: ich habe … geboten
  rationale: Das Piel von צוה bedeutet gewöhnlich »befehlen/gebieten«. »Geboten« bewahrt die unmittelbare Aussage und glättet die Spannung des Erzählverlaufs nicht.
- source_word: אִשָּׁה אַלְמָנָה
  choice: einer Witwe
  rationale: Die appositionelle Wendung »eine Frau, eine Witwe« wird im Deutschen ohne Bedeutungsverlust knapp als »eine Witwe« wiedergegeben.
- source_word: לְכַלְכְּלֶךָ
  choice: dich zu versorgen
  rationale: כלכל bezeichnet das Unterhalten oder Versorgen mit dem Lebensnotwendigen. »Dich zu versorgen« ist hinreichend weit und passt zum folgenden Kontext.
theological_decisions:
- issue: Bedeutung der Aussage Gottes, er habe der Witwe »geboten«
  choice: Die direkte Formulierung »ich habe … geboten« bleibt erhalten.
  alternative: »Ich habe dort eine Witwe bestimmt« oder »Ich habe dort für eine Witwe gesorgt, die dich versorgen wird.«
  rationale: צוה bedeutet unmittelbar »gebieten«. Dass die Witwe im folgenden Bericht nicht ausdrücklich von einem zuvor bewusst empfangenen Gebot spricht, erzeugt eine echte erzählerische und theologische Spannung. Die Übersetzung bewahrt sie, statt sie durch »bestimmt« oder »vorbereitet« aufzulösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Kurze Imperative erhalten die Dringlichkeit. »Sieh« wahrt die aufmerksamkeitslenkende Funktion von הִנֵּה, ohne das altertümlichere »siehe« zu verlangen. Die Fußnotenmarker stehen jeweils an der sachlich zugehörigen Stelle.
