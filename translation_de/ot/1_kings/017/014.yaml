source:
  edition: WLC
  text: כִּ֣י כֹה֩ אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל כַּ֤ד הַ/קֶּ֨מַח֙ לֹ֣א תִכְלָ֔ה וְ/צַפַּ֥חַת הַ/שֶּׁ֖מֶן לֹ֣א תֶחְסָ֑ר עַ֠ד י֧וֹם תתן יְהוָ֛ה גֶּ֖שֶׁם עַל פְּנֵ֥י הָ/אֲדָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/014.yaml
  text: 'For this is what Yahweh[a], the God of Israel, says: ‘The jar of flour will not be used up, and the jug of oil will not run dry[c][b], until the day Yahweh gives rain on the face of the ground.’'
translation:
  language: de
  text: 'Denn so spricht Jahwe[a], der Gott Israels: »Der Mehltopf wird nicht leer werden, und im Ölkrug wird das Öl nicht ausgehen, bis zu dem Tag, an dem Jahwe Regen auf den Erdboden fallen lässt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH (יהוה), der persönliche Name Gottes; traditionell oft mit »der HERR« wiedergegeben.'
    reason: textual_clarification
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird in seiner im Deutschen geläufigen wissenschaftlichen Form wiedergegeben, statt ihn durch den Titel »HERR« zu ersetzen.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Die hebräische Genitivverbindung wird unmittelbar und idiomatisch wiedergegeben.
- source_word: כַּד הַקֶּמַח
  choice: der Mehltopf
  rationale: כַּד bezeichnet ein Haushaltsgefäß; die Zusammensetzung »Mehltopf« ist im Deutschen natürlich und macht deutlich, dass das Gefäß Mehl enthält.
- source_word: לֹא תִכְלָה
  choice: wird nicht leer werden
  rationale: כלה bezeichnet hier das Zu-Ende-Gehen eines Vorrats. Bezogen auf das Gefäß gibt »nicht leer werden« den Sinn klar und idiomatisch wieder.
- source_word: צַפַּחַת הַשֶּׁמֶן
  choice: der Ölkrug
  rationale: צַפַּחַת bezeichnet ein kleineres Gefäß. »Ölkrug« unterscheidet es sprachlich vom Mehltopf, ohne die genaue Gefäßform überzubestimmen.
- source_word: לֹא תֶחְסָר
  choice: wird nicht versiegen
  rationale: חסר bedeutet fehlen oder abnehmen. Bei einem flüssigen Vorrat vermittelt »versiegen« das gemeinte Ausbleiben beziehungsweise Aufgebrauchtwerden natürlich.
- source_word: עַד יוֹם
  choice: bis zu dem Tag
  rationale: Die ausdrückliche Zeitangabe des Hebräischen bleibt erhalten.
- source_word: תתן יְהוָה גֶּשֶׁם
  choice: Jahwe Regen gibt
  rationale: נתן bedeutet wörtlich »geben«; diese schlichte Formulierung ist auch im Deutschen verständlich und bewahrt die Aussageform des Ausgangstextes.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: auf den Erdboden
  rationale: Die Wendung bezeichnet die Oberfläche des landwirtschaftlich relevanten Bodens. »Auf den Erdboden« ist natürlich, ohne das hebräische Bild »auf das Angesicht des Erdbodens« unverständlich wörtlich nachzubilden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext gebraucht den persönlichen Gottesnamen. Die Transliteration bewahrt diese Unterscheidung gegenüber einem bloßen Titel.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die prophetische Botenformel »So spricht …« bleibt erhalten. Die beiden Verheißungen sind parallel und anschaulich formuliert; unnötige Archaismen und eine übergenaue Festlegung der Gefäßformen werden vermieden.
