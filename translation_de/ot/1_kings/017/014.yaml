  to: 'Denn so spricht Jahwe[a], der Gott Israels: »Der Mehltopf wird nicht leer werden, und im Ölkrug wird das Öl nicht ausgehen, bis zu dem Tag, an dem Jahwe Regen auf den Erdboden fallen lässt.«'
  rationale: Die Revision ersetzt allein die im Deutschen unübliche Prädikation eines Gefäßes durch eine idiomatische Formulierung für den unerschöpflichen Ölvorrat. Die Regenformulierung wird zugleich idiomatisch geglättet; beide Änderungen bewahren den hebräischen Sinn und die zeitliche Begrenzung unverändert.
