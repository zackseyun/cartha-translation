  text: וַ/תֹּ֗אמֶר חַי יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אִם יֶשׁ לִ֣/י מָע֔וֹג כִּ֣י אִם מְלֹ֤א כַף קֶ֨מַח֙ בַּ/כַּ֔ד וּ/מְעַט שֶׁ֖מֶן בַּ/צַּפָּ֑חַת וְ/הִנְ/נִ֨י מְקֹשֶׁ֜שֶׁת שְׁנַ֣יִם עֵצִ֗ים וּ/בָ֨אתִי֙ וַ/עֲשִׂיתִ֨י/הוּ֙ לִ֣/י וְ/לִ/בְנִ֔/י וַ/אֲכַלְנֻ֖/הוּ וָ/מָֽתְנוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/012.yaml
  text: And she said[a], “As Yahweh your God lives, I have no bread-cake, only a handful of flour in the jar and a little oil in the jug. And look, I am gathering two sticks, so that I may go in and prepare it for myself and for my son, and we may eat it and die.”
translation:
  language: de
  text: 'Sie antwortete: »So wahr Jahwe, dein Gott, lebt: Ich habe keinen Brotfladen[a], sondern nur eine Handvoll Mehl im Vorratskrug und ein wenig Öl im Krug. Sieh, ich sammle gerade zwei Holzstücke; dann gehe ich hinein und bereite es für mich und meinen Sohn zu. Wir werden es essen und sterben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »kein kleines Brot« oder »kein gebackenes Brot«. Das hebräische Wort bezeichnet ein kleines Brotgebäck bzw. einen kleinen Brotfladen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה אֱלֹהֶיךָ
  choice: So wahr Jahwe, dein Gott, lebt
  rationale: Gibt die hebräische Schwurformel natürlich und feierlich wieder und bewahrt den Gottesnamen Jahwe.
- source_word: אִם יֶשׁ לִי מָעוֹג
  choice: Ich habe keinen Brotfladen
  rationale: אִם dient im Schwurzusammenhang als nachdrückliche Verneinung; מָעוֹג bezeichnet ein kleines, flaches Backstück und nicht Brot im Allgemeinen.
- source_word: מְלֹא כַף קֶמַח
  choice: eine Handvoll Mehl
  rationale: Natürliche deutsche Entsprechung des wörtlichen Ausdrucks »eine Füllung der Handfläche«; die äußerst geringe Menge bleibt deutlich.
- source_word: כַּד
  choice: Vorratskrug
  rationale: Das Gefäß enthält Mehl; »Vorratskrug« macht seine Funktion verständlich, ohne ein bestimmtes Material vorauszusetzen.
- source_word: צַפַּחַת
  choice: Krug
  rationale: Bezeichnet ein kleineres Gefäß für Flüssigkeit; »Krug« ist im Deutschen verständlich und kontextgerecht.
- source_word: וְהִנְנִי מְקֹשֶׁשֶׁת
  choice: Sieh, ich sammle gerade
  rationale: וְהִנְנִי lenkt die Aufmerksamkeit auf die gegenwärtige Handlung, während das Partizip deren Verlauf ausdrückt.
- source_word: שְׁנַיִם עֵצִים
  choice: zwei Holzstücke
  rationale: Bezeichnet hier eine minimale Menge Brennholz; »Holzstücke« klingt im Deutschen natürlicher als »zwei Hölzer« und legt keine großen Scheite nahe.
- source_word: וּבָאתִי
  choice: Dann will ich nach Hause gehen
  rationale: Das Verb bedeutet wörtlich »hineingehen/kommen«; im Zusammenhang ist das Betreten des Hauses zur Zubereitung gemeint.
- source_word: וַאֲכַלְנֻהוּ וָמָתְנוּ
  choice: Wir werden es essen und danach sterben
  rationale: Bewahrt die schonungslose Abfolge der letzten Mahlzeit und des erwarteten Todes; »danach« verdeutlicht die im Hebräischen koordinierte zeitliche Folge.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה in der Schwurformel der sidonischen Witwe
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. »Jahwe« bewahrt den persönlichen Gottesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bezug von »dein Gott«
  choice: dein Gott
  alternative: der Gott Israels
  rationale: Der Possessivausdruck richtet sich unmittelbar an Elia. Die Formulierung wird nicht zu einer weitergehenden Aussage über den eigenen Glauben der Witwe ausgeweitet.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt schlicht und eindringlich; die existentielle Not wird ohne zusätzliche Dramatisierung wiedergegeben.
