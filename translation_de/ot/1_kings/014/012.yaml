  text: וְ/אַ֥תְּ ק֖וּמִי לְכִ֣י לְ/בֵיתֵ֑/ךְ בְּ/בֹאָ֥ה רַגְלַ֛יִ/ךְ הָ/עִ֖ירָ/ה וּ/מֵ֥ת הַ/יָּֽלֶד׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/012.yaml
  text: But as for you[a], arise, go to your house. When your feet enter the city, the child will die.
translation:
  language: de
  text: Du aber, steh auf und geh nach Hause. Wenn deine Füße die Stadt betreten, wird das Kind sterben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַתְּ
  choice: Du aber
  rationale: Die Konjunktion mit dem selbstständigen Pronomen der 2. Person Singular feminin setzt die angesprochene Frau betont und kontrastierend ab. „Du aber“ gibt dies knapp und natürlich wieder.
- source_word: ק֖וּמִי
  choice: steh auf
  rationale: Der Imperativ von קום bezeichnet hier das Sich-Erheben zum Aufbruch. „Steh auf“ ist im heutigen Deutsch natürlich und wahrt den gebietenden Ton.
- source_word: לְכִ֣י
  choice: geh
  rationale: Der Imperativ von הלך wird schlicht und unmittelbar mit „geh“ wiedergegeben.
- source_word: לְ/בֵיתֵ֑/ךְ
  choice: nach Hause
  rationale: בַּיִת bezeichnet das Haus beziehungsweise Zuhause. In Verbindung mit dem Bewegungsverb ist „nach Hause“ die idiomatische deutsche Richtungsangabe.
- source_word: בְּ/בֹאָ֥ה
  choice: Sobald … betreten
  rationale: ב mit dem Infinitiv constructus von בוא bildet eine temporale Angabe. Im Zusammenhang markiert sie den Zeitpunkt des Eintreffens; „sobald“ bringt die unmittelbare zeitliche Verknüpfung natürlich zum Ausdruck.
- source_word: רַגְלַ֛יִ/ךְ
  choice: deine Füße
  rationale: Die konkrete Körperteilbezeichnung des Hebräischen wird bewahrt, statt das Idiom bloß mit „du“ aufzulösen.
- source_word: הָ/עִ֖ירָ/ה
  choice: die Stadt
  rationale: Die Richtungsendung zeigt eine Bewegung in die Stadt hinein an; im Deutschen wird diese Bedeutung durch „die Stadt betreten“ ausgedrückt.
- source_word: וּ/מֵ֥ת
  choice: wird … sterben
  rationale: Die verbundene Perfektform bezeichnet in dieser prophetischen Aussage das sicher eintretende zukünftige Geschehen. Das deutsche Futur gibt dies klar wieder.
- source_word: הַ/יָּֽלֶד
  choice: das Kind
  rationale: יֶלֶד kann „Kind“, „Junge“ oder „Knabe“ bedeuten. Hier steht die Beziehung als Kind im Vordergrund; „das Kind“ ist sachlich und kontextgemäß.
