id: 1KI.14.7
reference: 1 Kings 14:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לְכִ֞י אִמְרִ֣י לְ/יָרָבְעָ֗ם כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל יַ֛עַן אֲשֶׁ֥ר הֲרִימֹתִ֖י/ךָ מִ/תּ֣וֹךְ הָ/עָ֑ם וָ/אֶתֶּנְ/ךָ֣ נָגִ֔יד עַ֖ל עַמִּ֥/י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/007.yaml
  text: 'Go and say to Jeroboam[a], ‘Thus says Yahweh[b], the God of Israel: Because I raised you up from among the people and made you ruler over my people Israel,’'
translation:
  language: de
  text: 'Geh und sage Jerobeam: »So spricht Jahwe, der Gott Israels: Weil ich dich aus der Mitte des Volkes emporgehoben[a] und dich als Herrscher über mein Volk Israel eingesetzt habe[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »erhöht« beziehungsweise »hochgestellt«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »dich als Herrscher gegeben«; sinngemäß auch: »dich zum Anführer bestimmt«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכִי אִמְרִי
  choice: Geh und sage
  rationale: Die beiden femininen Imperative richten sich an Jerobeams Frau. Die geläufige deutsche Botenformel gibt die Aufforderung klar und unmittelbar wieder.
- source_word: לְיָרָבְעָם
  choice: Jerobeam
  rationale: Die Präposition kennzeichnet den Empfänger der Botschaft; der Name wird in seiner im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die traditionelle und zugleich verständliche deutsche Wiedergabe bewahrt den formelhaften Charakter der prophetischen Botenrede.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Die Status-constructus-Verbindung wird direkt und idiomatisch wiedergegeben.
- source_word: יַעַן אֲשֶׁר
  choice: Weil
  rationale: Die Wendung leitet die Begründung des folgenden Gerichtswortes ein. Der unvollständige Weil-Satz macht erkennbar, dass die Rede im nächsten Vers weitergeht.
- source_word: הֲרִימֹתִיךָ
  choice: ich dich ... emporgehoben
  rationale: Das Hifil von רום bezeichnet hier die Erhebung aus dem Volk in eine hohe politische Stellung. »Emporgehoben« bewahrt sowohl das Bild als auch den übertragenen Sinn.
- source_word: מִתּוֹךְ הָעָם
  choice: aus der Mitte des Volkes
  rationale: Die Formulierung bildet das räumliche Bild des Hebräischen ab und bezeichnet zugleich die Auswahl aus dem Volk.
- source_word: וָאֶתֶּנְךָ נָגִיד
  choice: und dich als Herrscher ... eingesetzt habe
  rationale: Wörtlich steht »und ich gab dich als Herrscher«. »Einsetzen« gibt die idiomatische Bedeutung einer von Gott verliehenen Amtsstellung natürlich wieder.
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: über mein Volk Israel
  rationale: Die Wiedergabe erhält sowohl Jerobeams Autoritätsbereich als auch Gottes Besitzbezeichnung »mein Volk«.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. »Jahwe« bewahrt den persönlichen Gottesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Amtsbezeichnung נָגִיד
  choice: Herrscher
  alternative: Anführer; Fürst
  rationale: Das Wort bezeichnet hier eine von Gott verliehene Leitungs- und Regierungsstellung. »Herrscher« vermittelt die amtliche Autorität, ohne eine erbliche Prinzenwürde vorauszusetzen.
- issue: Syntaktisch noch nicht abgeschlossene Begründung
  choice: Der Vers endet mit einem Komma nach dem Weil-Satz
  alternative: Abschluss als selbstständiger Satz
  rationale: יַעַן אֲשֶׁר eröffnet die Begründung für das anschließend ausgesprochene Gericht; Vers 7 ist syntaktisch nicht abgeschlossen. Die Zeichensetzung bewahrt diesen Zusammenhang.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die prophetische Formel »So spricht Jahwe« bleibt bewusst formelhaft. Der angefangene Kausalsatz und das abschließende Komma zeigen, dass die Gottesrede im folgenden Vers weitergeführt wird.
