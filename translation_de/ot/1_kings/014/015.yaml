source:
  edition: WLC
  text: וְ/הִכָּ֨ה יְהוָ֜ה אֶת יִשְׂרָאֵ֗ל כַּ/אֲשֶׁ֨ר יָנ֣וּד הַ/קָּנֶה֮ בַּ/מַּיִם֒ וְ/נָתַ֣שׁ אֶת יִשְׂרָאֵ֗ל מֵ֠/עַל הָ/אֲדָמָ֨ה הַ/טּוֹבָ֤ה הַ/זֹּאת֙ אֲשֶׁ֤ר נָתַן֙ לַ/אֲב֣וֹתֵי/הֶ֔ם וְ/זֵרָ֖/ם מֵ/עֵ֣בֶר לַ/נָּהָ֑ר יַ֗עַן אֲשֶׁ֤ר עָשׂוּ֙ אֶת אֲשֵׁ֣רֵי/הֶ֔ם מַכְעִיסִ֖ים אֶת יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/015.yaml
  text: And Yahweh will strike Israel[a], as a reed sways in the water, and he will uproot Israel from this good land that he gave to their fathers, and scatter them beyond the River, because they made their Asherim[b], provoking Yahweh.
translation:
  language: de
  text: Und Jahwe wird Israel schlagen, wie das Schilfrohr im Wasser schwankt. Er wird Israel aus diesem guten Land herausreißen, das er ihren Vorfahren gegeben hat, und sie jenseits des Stroms[a] zerstreuen, weil sie ihre Ascheren[b] gemacht und damit Jahwe zum Zorn gereizt haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: jenseits des Euphrat; mit „dem Strom“ ist in diesem Zusammenhang der Euphrat gemeint.'
    reason: cross_reference
  - marker: b
    text: 'Hebräisch: ihre Ascherim; damit sind Kultobjekte gemeint, die mit der Göttin Aschera verbunden sind und oft als hölzerne Pfähle oder Bilder verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכָּה
  choice: Und … wird … schlagen
  rationale: Das Verb bezeichnet hier im prophetischen Zusammenhang ein künftiges Gericht; „schlagen“ wahrt die Bildkraft, ohne altertümlich zu wirken.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כַּאֲשֶׁר יָנוּד הַקָּנֶה בַּמַּיִם
  choice: sodass es schwankt wie das Schilfrohr im Wasser
  rationale: יָנוּד beschreibt eine schwankende Bewegung. Die Konstruktion kann hier die Wirkung des Schlagens ausdrücken; „Schilfrohr“ gibt den Kollektivbegriff קָנֶה natürlich wieder.
- source_word: וְנָתַשׁ
  choice: Er wird … ausreißen
  rationale: Das Verb bezeichnet ein Herausreißen oder Entwurzeln und bewahrt so das anschauliche Bild der gewaltsamen Entfernung aus dem Land.
- source_word: הָאֲדָמָה הַטּוֹבָה הַזֹּאת
  choice: diesem guten Land
  rationale: Im Zusammenhang ist das von Gott gegebene Land gemeint; diese geläufige deutsche Formulierung wahrt auch die Wertung „gut“.
- source_word: אֲשֶׁר נָתַן לַאֲבוֹתֵיהֶם
  choice: das er ihren Vorfahren gegeben hat
  rationale: „Vorfahren“ ist modernes, natürliches Deutsch und bezeichnet hier die früheren Generationen Israels, ohne den Sinn einzuengen.
- source_word: וְזֵרָם
  choice: und sie … zerstreuen
  rationale: Das Verb bezeichnet das Verstreuen oder Versprengen und passt zum angekündigten Exil.
- source_word: מֵעֵבֶר לַנָּהָר
  choice: jenseits des Stromes
  rationale: Der Haupttext bewahrt die konventionelle hebräische Bezeichnung „der Strom“; der historische Bezug auf den Euphrat wird in einer Fußnote erläutert.
- source_word: יַעַן אֲשֶׁר
  choice: weil
  rationale: Die Wendung leitet den Grund für das angekündigte Gericht ein.
- source_word: עָשׂוּ אֶת אֲשֵׁרֵיהֶם
  choice: sie sich ihre Ascheren gemacht
  rationale: Der eingedeutschte Plural „Ascheren“ bewahrt die Mehrzahl und vermeidet die umstrittene Festlegung auf „Pfahl“ oder „Bild“; die Fußnote erklärt den kultischen Bezug.
- source_word: מַכְעִיסִים אֶת יְהוָה
  choice: damit Jahwe zum Zorn gereizt haben
  rationale: Die deutsche Wendung macht die im Verb enthaltene Bedeutung des Zorn-Erregens ausdrücklich und verbindet das Partizip natürlich mit der vorausgehenden Handlung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. „Jahwe“ gibt ihn im modernen Deutschen als Namen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Bezug von „dem Strom“
  choice: Im Haupttext „der Strom“, mit Fußnote zum Euphrat
  alternative: jenseits des Euphrat
  rationale: Die hebräische Formulierung bleibt sichtbar, während die Fußnote modernen Lesern ihren geographischen Bezug erschließt.
- issue: Bedeutung von אֲשֵׁרֵיהֶם
  choice: Ascheren
  alternative: Aschera-Pfähle; Aschera-Bilder; Kultobjekte der Aschera
  rationale: Die genaue Gestalt dieser Kultobjekte ist nicht in jedem Kontext sicher. Die Transliteration wahrt diese Unschärfe und die Fußnote nennt die wichtigsten Deutungsmöglichkeiten.
- issue: Syntaktisches Verhältnis des Schilfrohrvergleichs
  choice: 'Folge des göttlichen Schlagens: „sodass es schwankt“'
  alternative: 'bloßer Vergleich: „wie ein Schilfrohr im Wasser schwankt“'
  rationale: כַּאֲשֶׁר kann „wie“ oder kontextuell „sodass“ wiedergegeben werden. Die gewählte Fassung ergibt im Deutschen ein klares Bild, ohne die Instabilität Israels abzuschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz wurde zur besseren Verständlichkeit in zwei Hauptsätze gegliedert. Die Gottesbezeichnung „Jahwe“ und die kultische Bezeichnung „Ascheren“ bleiben als Eigennamen beziehungsweise Fachbegriff erkennbar; erklärungsbedürftige historische und lexikalische Angaben stehen in Fußnoten.
