  text: וְ/יֶ֛תֶר דִּבְרֵ֥י רְחַבְעָ֖ם וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣מָּה כְתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/029.yaml
  text: The rest of the acts of Rehoboam[a], and all that he did, are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: de
  text: 'Die übrigen Taten Rehabeams und alles, was er tat: Sind sie nicht im Buch der Chronik der Könige von Juda[a] aufgeschrieben?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »im Buch der Annalen der Könige von Juda«. Der hebräische Ausdruck bezeichnet eine königliche Aufzeichnung von Ereignissen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי רְחַבְעָם
  choice: Was sonst noch über Rehabeam zu berichten ist
  rationale: Die historiografische Formel bezeichnet die übrigen Angelegenheiten bzw. Taten des Königs. Die deutsche Wendung gibt den Sinn natürlich wieder, ohne דִּבְרֵי auf gesprochene »Worte« einzuengen.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: und alles, was er tat
  rationale: Direkte, semantisch breite Wiedergabe von עשה ohne zusätzliche Wertung.
- source_word: הֲלֹא הֵמָּה כְתוּבִים
  choice: ist das nicht … aufgeschrieben?
  rationale: Bewahrt die rhetorische, eine bejahende Antwort erwartende Frage. Das zusammenfassende Singularpronomen »das« ist im Deutschen ein natürlicher Rückbezug auf den gesamten vorangehenden Inhalt.
- source_word: עַל סֵפֶר
  choice: im Buch
  rationale: Obwohl עַל wörtlich »auf« heißen kann und סֵפֶר auch eine Schriftrolle bezeichnet, ist »im Buch aufgeschrieben« die idiomatische deutsche Dokumentenangabe.
- source_word: דִּבְרֵי הַיָּמִים
  choice: Chronik
  rationale: Die Wendung bezeichnet hier eine annalistische Aufzeichnung von Ereignissen; »Chronik« ist im Deutschen präzise und vermeidet eine Verwechslung mit dem kanonischen Buchtitel »Chronik« im Plural.
- source_word: לְמַלְכֵי יְהוּדָה
  choice: der Könige von Juda
  rationale: Das ל wird in der Quellenbezeichnung idiomatisch als Zugehörigkeitsangabe wiedergegeben.
