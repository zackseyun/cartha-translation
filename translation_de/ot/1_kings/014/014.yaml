  variant: modern standard German
source:
  edition: WLC
  text: וְ/הֵקִים֩ יְהוָ֨ה ל֥/וֹ מֶ֨לֶךְ֙ עַל יִשְׂרָאֵ֔ל אֲשֶׁ֥ר יַכְרִ֛ית אֶת בֵּ֥ית יָרָבְעָ֖ם זֶ֣ה הַ/יּ֑וֹם וּ/מֶ֖ה גַּם עָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/014.yaml
  text: And Yahweh will raise up for himself a king over Israel who will cut off the house of Jeroboam this day[a]. But what? Even now.
translation:
  language: de
  text: Und Jahwe wird sich einen König über Israel erstehen lassen, der das Haus Jerobeams an diesem Tag ausrotten wird. Und was? Auch jetzt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Schluss ist abrupt und schwer verständlich; wörtlich etwa: „und was? auch jetzt“. Möglich sind auch Deutungen wie „Und was noch? Schon jetzt!“ oder eine Ausrufung, die die Unmittelbarkeit des Gerichts betont.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵקִים
  choice: wird … erstehen lassen
  rationale: Das Hifil von קום bezeichnet hier, dass Jahwe einen Herrscher auftreten lässt. „Erstehen lassen“ bewahrt dieses biblische Idiom, ohne den Vorgang vorschnell auf eine formelle Ernennung zu verengen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לּוֹ
  choice: sich
  rationale: 'Das Suffix bezieht sich am natürlichsten reflexiv auf Jahwe: Er lässt für sich selbst einen König erstehen. Im Deutschen gibt „sich“ dies klar und knapp wieder.'
- source_word: מֶלֶךְ עַל יִשְׂרָאֵל
  choice: einen König über Israel
  rationale: עַל bezeichnet in Verbindung mit königlicher Herrschaft den Herrschaftsbereich; „über Israel“ entspricht dem politischen Sinn.
- source_word: אֲשֶׁר יַכְרִית
  choice: der … ausrotten wird
  rationale: Das Hifil von כרת kann „abschneiden“, „beseitigen“ oder „ausrotten“ bedeuten. Bei einem Herrscherhaus bezeichnet „ausrotten“ im heutigen Deutsch verständlich dessen vollständige Beseitigung.
- source_word: בֵּית יָרָבְעָם
  choice: das Haus Jerobeams
  rationale: „Haus“ bewahrt den dynastischen Familienbegriff des Hebräischen, ohne ihn interpretierend durch „Dynastie“ zu ersetzen.
- source_word: זֶה הַיּוֹם
  choice: an diesem Tag
  rationale: Die Wendung bedeutet wörtlich „dieser Tag“ und ist hier zeitlich zu verstehen. „An diesem Tag“ bewahrt die demonstrative Betonung und fügt sich natürlich in den deutschen Satz.
- source_word: וּמֶה גַּם עָתָּה
  choice: Doch was? Schon jetzt.
  rationale: Die hebräische Schlusswendung ist abrupt und elliptisch. Die Übersetzung bewahrt den abgebrochenen, schwer deutbaren Charakter; „schon jetzt“ gibt גַּם עָתָּה als Betonung der unmittelbaren Gegenwart wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext nennt den Tetragrammaton ausdrücklich. Die Transliteration bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Deutung der schwierigen Schlusswendung וּמֶה גַּם עָתָּה
  choice: Die hebräische Abruptheit bleibt als „Doch was? Schon jetzt.“ erhalten.
  alternative: „Aber was noch? Bereits jetzt.“; „Das Gericht beginnt schon jetzt.“
  rationale: Die Syntax ist stark verkürzt und ihre genaue Funktion unsicher. Eine ausformulierte Aussage über den Beginn des Gerichts würde die Mehrdeutigkeit auflösen und mehr behaupten, als der Wortlaut sicher erkennen lässt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht biblischer Prägung. „Erstehen lassen“ und „Haus Jerobeams“ bewahren zentrale hebräische Bilder; die ungewöhnliche Schlussfolge bleibt bewusst sperrig, weil auch der Ausgangstext elliptisch und unsicher ist.
