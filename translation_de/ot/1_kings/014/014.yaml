  source_fidelity: 'Die Hauptaussage wird treffend wiedergegeben: Jahwe setzt/erweckt einen König über Israel, der das Haus Jerobeams beseitigen wird. „Haus Jerobeams“ bewahrt die dynastische Metapher, und „ausrotten“ ist für הִכְרִית in diesem Gerichtskontext vertretbar. Die Schlusssequenz ist jedoch bewusst elliptisch; „Und was? Auch jetzt.“ bildet sowohl die koordinierende Einleitung וְ/וּ als auch גַּם im Sinn von „auch/sogar“ zurückhaltender ab als „Doch was? Schon jetzt.“.'
  naturalness: Der Hauptsatz ist würdig und verständlich; „sich einen König ... erstehen lassen“ ist leicht biblisch geprägt, aber noch idiomatisch und für den angestrebten Registerton vertretbar. Die Sperrigkeit des Schlusssatzes ist absichtlich und durch den hebräischen Befund gerechtfertigt.
  terminology: „Jahwe“, „König über Israel“ und „Haus Jerobeams“ sind konsistent und sachgerecht. Die Fußnote soll unmittelbar an der schwierigen Schlusswendung verankert sein, nicht bei „an diesem Tag“.
