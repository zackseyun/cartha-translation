base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/030.yaml
  text: And there was war between Rehoboam and Jeroboam all their days[a].
translation:
  language: de
  text: Und zwischen Rehabeam und Jerobeam herrschte die ganze Zeit über Krieg.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „alle Tage“. Gemeint ist, dass der Konflikt während ihrer gesamten Lebens- oder Regierungszeit fortbestand.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִלְחָמָה הָיְתָה
  choice: Und … herrschte … Krieg
  rationale: Die Verbindung aus מִלְחָמָה und der Qal-Form von היה bezeichnet das Bestehen eines Kriegszustands. „Es war Krieg“ wäre ebenfalls möglich; „herrschte Krieg“ ist im Deutschen natürlich und fügt keine besondere Art der Kriegführung hinzu.
- source_word: בֵין רְחַבְעָם וּבֵין יָרָבְעָם
  choice: zwischen Rehabeam und Jerobeam
  rationale: Die wiederholte Präposition בֵין kennzeichnet die beiden einander gegenüberstehenden Parteien. Die Personennamen folgen der etablierten deutschen Bibelnamensform.
- source_word: כָּל הַיָּמִים
  choice: die ganze Zeit über
  rationale: Wörtlich steht „alle Tage“. Die idiomatische deutsche Wiedergabe bezeichnet einen fortdauernden Konflikt, ohne ausdrücklich festzulegen, ob die Lebenszeit, die Regierungszeit oder der Zeitraum ihrer gleichzeitigen Herrschaft gemeint ist.
