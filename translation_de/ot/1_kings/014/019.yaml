  text: וְ/יֶ֨תֶר֙ דִּבְרֵ֣י יָֽרָבְעָ֔ם אֲשֶׁ֥ר נִלְחַ֖ם וַ/אֲשֶׁ֣ר מָלָ֑ךְ הִנָּ֣/ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/019.yaml
  text: The rest of the acts of Jeroboam[a], how he fought and how he reigned, behold[c][b], they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: de
  text: Die übrigen Taten Jerobeams[a], wie er Krieg führte und wie er regierte – siehe, sie sind im Buch der Chronik der Könige Israels verzeichnet.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „die übrigen Angelegenheiten Jerobeams“. In dieser königlichen Schlussformel sind damit seine überlieferten Taten und Regierungsgeschäfte gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Gemeint ist eine königliche Annalenschrift, nicht das biblische Buch der Chronik. Wörtlich: „Siehe, sie sind geschrieben im Buch der Chronik der Könige Israels.“'
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יָרָבְעָם
  choice: Die übrigen Taten Jerobeams
  rationale: דְּבָרִים bezeichnet in dieser königlichen Schlussformel nicht bloß Worte, sondern die berichteten Angelegenheiten und Taten des Königs. „Die übrigen Taten“ ist im Deutschen natürlich und sachlich präzise.
- source_word: אֲשֶׁר נִלְחַם
  choice: wie er Krieg führte
  rationale: נלחם bedeutet kämpfen beziehungsweise Krieg führen. Die mit אֲשֶׁר angeschlossene Formulierung erläutert den Inhalt der übrigen Taten; „wie“ gibt diese Funktion idiomatisch wieder.
- source_word: וַאֲשֶׁר מָלָךְ
  choice: und wie er regierte
  rationale: מלך bezeichnet hier Jerobeams Herrschaftsausübung. „regierte“ ist in modernem Deutsch natürlicher als „als König herrschte“ und bleibt inhaltlich offen.
- source_word: הִנָּם כְּתוּבִים
  choice: sind … aufgezeichnet
  rationale: Das hebräische הִנָּם lenkt präsentierend die Aufmerksamkeit auf den vorhandenen schriftlichen Bericht. Eine wörtliche Wiedergabe mit „siehe“ wäre in dieser deutschen Satzform schwerfällig; „aufgezeichnet“ gibt zusammen mit dem Präsens die archivalische Aussage natürlich wieder.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: in der Chronik
  rationale: Der Ausdruck bezeichnet hier eine annalistische schriftliche Quelle. „Chronik“ vermittelt dies knapp und vermeidet die unnatürliche wörtliche Form „Buch der Begebenheiten der Tage“.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: der Könige von Israel
  rationale: Das לְ kennzeichnet in der Quellenbezeichnung die Zuordnung zu den Königen Israels; der deutsche Genitiv gibt diese Beziehung idiomatisch wieder.
theological_decisions:
- issue: Identität der genannten Chronik
  choice: Die Fußnote kennzeichnet sie als königliche Annalen.
  alternative: Die Bezeichnung könnte ohne Erläuterung mit dem biblischen Buch der Chronik verwechselt werden.
  rationale: Im Kontext der Königsbücher verweist die Formel auf eine anderweitige historische beziehungsweise amtliche Quelle, nicht auf das spätere kanonische Chronikbuch.
translation_notes:
  register: Moderne, würdige Standardsprache. Die formelhafte Quellenangabe bleibt erkennbar, wird aber idiomatisch als „Chronik“ wiedergegeben. Das präsentierende הִנָּם wird nicht mit dem im heutigen Deutsch markierten „siehe“ in den Haupttext übernommen, sondern in der Fußnote transparent gemacht.
