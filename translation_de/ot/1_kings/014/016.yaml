source:
  edition: WLC
  text: וְ/יִתֵּ֖ן אֶת יִשְׂרָאֵ֑ל בִּ/גְלַ֞ל חַטֹּ֤אות יָֽרָבְעָם֙ אֲשֶׁ֣ר חָטָ֔א וַ/אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/016.yaml
  text: And he will give up Israel because of the sins of Jeroboam[a], which he committed and by which he caused Israel to sin.
translation:
  language: de
  text: Und er wird Israel preisgeben[a] wegen der Sünden Jerobeams, die er beging und durch die er Israel zur Sünde verleitete.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ausliefern“. Das hebräische Verb bedeutet wörtlich „geben“, bezeichnet hier im Zusammenhang des Gerichts aber das Preisgeben an Unheil oder Feinde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתֵּן
  choice: Und er wird … preisgeben
  rationale: נתן bedeutet wörtlich „geben“, bezeichnet hier im Gerichtskontext aber das Ausliefern beziehungsweise Preisgeben an Unheil oder Feinde, ohne das Mittel des Gerichts näher zu bestimmen.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israel
  rationale: Der Eigenname bezeichnet kollektiv das Nordreich beziehungsweise dessen Volk.
- source_word: בִּגְלַל
  choice: wegen
  rationale: Die Präposition gibt den Grund oder die Ursache an; „wegen“ ist im Deutschen klar und natürlich.
- source_word: חַטֹּאות יָרָבְעָם
  choice: der Sünden Jerobeams
  rationale: Der Plural חַטֹּאות wird transparent mit „Sünden“ wiedergegeben; der Personenname erscheint in seiner etablierten deutschen Form.
- source_word: אֲשֶׁר חָטָא
  choice: die er beging
  rationale: Die Wendung bezieht sich auf Jerobeams Sünden. Im Deutschen ist „Sünden begehen“ idiomatischer als eine formale Wiedergabe wie „die er sündigte“.
- source_word: וַאֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: und zu denen er Israel verführte
  rationale: 'Der Hifil von חטא hat kausative Bedeutung: Jerobeam brachte Israel zum Sündigen. „Zu Sünden verführen“ bewahrt diese Verursachung in natürlichem, würdigem Deutsch; das Relativpronomen bezieht beide Aussagen auf die genannten Sünden.'
theological_decisions:
- issue: Göttliches Handeln im Gericht
  choice: er wird Israel preisgeben
  alternative: er wird Israel ausliefern
  rationale: Das Subjekt ist im Zusammenhang Gott. Die Formulierung wahrt die Gerichtsaussage, ohne in diesem Vers Feinde oder eine konkrete Katastrophe als Vollstrecker hinzuzufügen.
- issue: Jerobeams eigene Schuld und seine Verführung Israels
  choice: die er beging und zu denen er Israel verführte
  alternative: mit denen er sündigte und Israel zur Sünde verleitete
  rationale: Die Übersetzung hält sowohl Jerobeams persönliche Schuld als auch seine kausale Rolle bei Israels Sünde fest, ohne die Verantwortung Israels aufzuheben oder näher zu systematisieren.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. „Preisgeben“ trägt den gerichtlichen Sinn von נתן, ohne das im Vers nicht genannte Mittel des Gerichts zu ergänzen.
