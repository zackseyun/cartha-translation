base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/003.yaml
  text: And take in your hand ten loaves of bread, some cakes, and a jar of honey, and go to him. He will tell you what will happen to the boy.
translation:
  language: de
  text: Nimm zehn Brote, Gebäck und einen Krug Honig mit und geh zu ihm. Er wird dir sagen, was mit dem Jungen geschehen wird.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲשָׂרָה לֶחֶם
  choice: zehn Brote
  rationale: Die Konstruktion bezeichnet zehn Brotlaibe; im natürlichen modernen Deutsch genügt „zehn Brote“.
- source_word: נִקֻּדִים
  choice: Gebäck
  rationale: Das seltene Wort bezeichnet wahrscheinlich punktierte beziehungsweise mit Zutaten versehene Backwaren; „Gebäck“ bewahrt die sachliche Unbestimmtheit besser als eine genauere, unsichere Bezeichnung.
- source_word: בַּקְבֻּק דְּבַשׁ
  choice: einen Krug Honig
  rationale: בַּקְבֻּק ist ein kleines Gefäß beziehungsweise ein Krug; דְּבַשׁ bedeutet hier Honig.
- source_word: מַה יִּהְיֶה לַנָּעַר
  choice: was mit dem Jungen geschehen wird
  rationale: Gibt die idiomatische Bedeutung der hebräischen Wendung wieder, ohne den Ausgang vorwegzunehmen.
