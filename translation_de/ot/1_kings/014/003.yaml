  source_fidelity: 'Der Entwurf gibt alle Sinnbestandteile des Hebräischen zuverlässig wieder: die drei Gaben (zehn Brote, Backwaren, ein Honiggefäß), die Aufforderung, zu ihm zu gehen, und die Aussage über das künftige Ergehen des Jungen. „Mitnehmen“ ist eine idiomatische Entsprechung für die Verbindung von „nehmen“ mit „in deiner Hand“ und lässt keinen wesentlichen Inhalt aus.'
