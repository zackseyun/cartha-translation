id: 1KI.14.23
reference: 1 Kings 14:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּבְנ֨וּ גַם הֵ֧מָּה לָ/הֶ֛ם בָּמ֥וֹת וּ/מַצֵּב֖וֹת וַ/אֲשֵׁרִ֑ים עַ֚ל כָּל גִּבְעָ֣ה גְבֹהָ֔ה וְ/תַ֖חַת כָּל עֵ֥ץ רַעֲנָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/023.yaml
  text: They too built for themselves high places[a], pillars, and Asherah poles on every high hill and under every green tree.
translation:
  language: de
  text: Auch sie bauten sich Kulthöhen, Steinmale und Aschera-Pfähle[a] auf jedem hohen Hügel und unter jedem üppig grünen Baum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ascherim« beziehungsweise »Aschera-Kultmale«; das hebräische Wort bezeichnet Kultgegenstände, die mit der Göttin Aschera verbunden waren. Ihre genaue Gestalt ist nicht sicher.'
    reason: Lexikalische Alternative und sachliche Präzisierung
lexical_decisions:
- source_word: וַיִּבְנוּ
  choice: bauten
  rationale: בנה bedeutet gewöhnlich »bauen«. Das Verb kann hier die gesamte Reihe der errichteten Kultanlagen und Kultgegenstände zusammenfassen.
- source_word: גַם הֵמָּה
  choice: Auch sie
  rationale: Die Wiedergabe bewahrt sowohl die additive als auch die leicht nachdrückliche Funktion der hebräischen Wortgruppe im Zusammenhang.
- source_word: לָהֶם
  choice: sich
  rationale: 'Das Präpositionalpronomen hat hier reflexiven Sinn: Sie errichteten diese Kultstätten und Kultgegenstände für den eigenen Gebrauch.'
- source_word: בָּמוֹת
  choice: Kulthöhen
  rationale: במות bezeichnet örtliche Kultstätten, die häufig auf Anhöhen lagen, aber nicht allein topografisch definiert waren. »Kulthöhen« ist knapp, verständlich und kultisch eindeutig.
- source_word: מַצֵּבוֹת
  choice: Steinmale
  rationale: מצבות sind aufgerichtete Steine mit kultischer Funktion. »Steinmale« gibt Material und Gestalt natürlicher wieder als das mehrdeutige »Säulen«.
- source_word: אֲשֵׁרִים
  choice: Aschera-Pfähle
  rationale: Der Plural bezeichnet hier im Zusammenhang mit anderen errichteten Kultgegenständen wahrscheinlich Objekte, die mit Aschera verbunden waren. Die Übersetzung macht diesen Bezug erkennbar, während die Fußnote die sachliche Unsicherheit offenhält.
- source_word: עַל כָּל גִּבְעָה גְבֹהָה
  choice: auf jedem hohen Hügel
  rationale: Die Formulierung gibt die stereotype Ortsangabe direkt und idiomatisch wieder.
- source_word: וְתַחַת כָּל עֵץ רַעֲנָן
  choice: und unter jedem üppig grünen Baum
  rationale: רענן bezeichnet frisches, kräftiges Grün beziehungsweise üppigen Wuchs. »Üppig grün« bewahrt diesen Sinn deutlicher als nur »grün«.
theological_decisions:
- issue: Ob אֲשֵׁרִים die Göttin Aschera selbst oder mit ihr verbundene Kultgegenstände bezeichnet
  choice: Kultgegenstände, wiedergegeben als »Aschera-Pfähle«
  alternative: Ascherim; Aschera-Bilder; Ascheren
  rationale: Die Aufzählung neben Kulthöhen und Steinmalen legt konkrete Kultgegenstände nahe. Da ihre genaue Gestalt nicht sicher bestimmt ist, wird die geläufige Wiedergabe im Text durch eine erklärende Fußnote qualifiziert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle, aber für viele unklare Bezeichnung »Höhen« wird als »Kulthöhen« verdeutlicht; »Steinmale« benennt die kultischen aufgerichteten Steine. Der formelhafte Schluss bleibt bildhaft und rhetorisch erhalten.
