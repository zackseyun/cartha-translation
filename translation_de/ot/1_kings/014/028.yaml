  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְהִ֛י מִ/דֵּי בֹ֥א הַ/מֶּ֖לֶךְ בֵּ֣ית יְהוָ֑ה יִשָּׂאוּ/ם֙ הָֽ/רָצִ֔ים וֶ/הֱשִׁיב֖וּ/ם אֶל תָּ֥א הָ/רָצִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/028.yaml
  text: And whenever the king entered the house of Yahweh[b][a], the guards would carry them and then return them to the guards’ chamber.
translation:
  language: de
  text: Und sooft der König in das Haus Jahwes ging, trugen die Leibwächter[a] sie[b] und brachten sie danach wieder in die Kammer der Leibwächter zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Läufer“; im königlichen Umfeld sind damit die Leibwächter des Königs gemeint.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint sind die bronzenen Schilde, die Rehabeam als Ersatz für die von Schischak geraubten goldenen Schilde anfertigen ließ (siehe 1. Könige 14,27).
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי מִדֵּי בֹא
  choice: Und sooft ... ging
  rationale: Die Verbindung מִדֵּי mit dem Infinitiv bezeichnet einen wiederkehrenden Vorgang. „Sooft“ gibt diesen gewohnheitsmäßigen Sinn knapp und natürlich wieder; וַיְהִי dient hier dem Erzählfluss und wird nicht unnötig wörtlich entfaltet.
- source_word: בֵּית יְהוָה
  choice: das Haus Jahwes
  rationale: „Haus“ bewahrt die hebräische Bezeichnung des Heiligtums, während „Jahwe“ den im Ausgangstext stehenden Gottesnamen wiedergibt.
- source_word: הָרָצִים
  choice: die Leibwächter
  rationale: Wörtlich sind es „die Läufer“. Im königlichen Umfeld bezeichnet das Wort jedoch die den König begleitende Schutztruppe; „Leibwächter“ macht diese Funktion im Deutschen verständlich.
- source_word: יִשָּׂאוּם
  choice: trugen sie
  rationale: Das Imperfekt erhält durch die iterative Zeitangabe gewohnheitsmäßige Bedeutung. Das Suffix verweist auf die bronzenen Schilde aus Vers 27.
- source_word: וֶהֱשִׁיבוּם
  choice: und brachten sie danach ... zurück
  rationale: Der Hifil von שׁוב bedeutet hier, etwas zurückzubringen. „Danach“ verdeutlicht den Ablauf, ohne den Sinn zu verändern.
- source_word: אֶל תָּא הָרָצִים
  choice: in die Kammer der Leibwächter
  rationale: תָּא bezeichnet einen Raum oder eine Kammer. Die Genitivverbindung bleibt erhalten; „Kammer“ passt zum würdigen Erzählregister.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die wiederholte Handlung wird durch „sooft“ ausgedrückt. Der Gottesname wird als „Jahwe“ wiedergegeben; die traditionelle Tempelbezeichnung „Haus Jahwes“ bleibt erhalten.
