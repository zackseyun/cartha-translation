lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: Zu jener Zeit
  rationale: Die Wendung bezeichnet einen erzählerischen Zeitpunkt. „Zu jener Zeit“ ist im modernen Deutschen natürlich und bewahrt den zeitlichen Rückverweis.
- source_word: חָלָה
  choice: wurde … krank
  rationale: Das Verb kann sowohl den Zustand des Krankseins als auch dessen Eintritt bezeichnen. Im Erzählfortgang gibt „wurde krank“ den einsetzenden Krankheitsfall knapp und idiomatisch wieder.
- source_word: אֲבִיָּה
  choice: Abija
  rationale: „Abija“ entspricht der im Deutschen üblichen biblischen Namensform.
- source_word: בֶן יָרָבְעָם
  choice: der Sohn Jerobeams
  rationale: Die hebräische Genitivverbindung wird formal genau und zugleich natürlich wiedergegeben; der Artikel erleichtert die Einfügung als Apposition.
