base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/009.yaml
  text: and have done evil above all who were before you. You went and made for yourself other gods and molten images to provoke me to anger[a], and you have cast me behind your back.
translation:
  language: de
  text: Du hast mehr Böses getan als alle, die vor dir waren. Du bist hingegangen und hast dir andere Götter und Gussbilder gemacht, um mich zum Zorn zu reizen, und mich hast du hinter deinen Rücken geworfen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּרַע לַעֲשׂוֹת מִכֹּל
  choice: Du aber hast schlimmer gehandelt als alle
  rationale: Die Verbindung von רעה mit לעשות bezeichnet böses beziehungsweise gottloses Handeln; מִכֹּל verlangt einen Vergleich. „Schlimmer gehandelt“ ist im Deutschen natürlicher als „mehr Böses getan“ und bewahrt die Steigerung.
- source_word: אֲשֶׁר הָיוּ לְפָנֶיךָ
  choice: die vor dir waren
  rationale: Die Wendung ist hier zeitlich auf Jerobeams Vorgänger bezogen. Die knappe Form erhält zugleich den hebräischen Ausdruck.
- source_word: וַתֵּלֶךְ
  choice: Du bist hingegangen
  rationale: הלך leitet die folgende bewusste Handlung nachdrücklich ein. „Bist hingegangen“ gibt diese sequenzielle und vorwurfsvolle Färbung idiomatisch wieder.
- source_word: וַתַּעֲשֶׂה לְּךָ
  choice: hast dir … gemacht
  rationale: Das לְּךָ hat reflexiv-benefaktive Funktion und wird durch das deutsche Dativpronomen präzise und natürlich ausgedrückt.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: andere Götter
  rationale: Dies ist die direkte, etablierte Wiedergabe der bundesbezogenen Bezeichnung für unerlaubte Gottheiten; „fremde“ würde eine nicht zwingend vorhandene ethnische Nuance hinzufügen.
- source_word: וּמַסֵּכוֹת
  choice: gegossene Götterbilder
  rationale: מַסֵּכוֹת bezeichnet durch Gießen hergestellte Kultbilder. „Gegossene Götterbilder“ macht sowohl Herstellungsweise als auch kultische Funktion verständlich, ohne das Wort mit den „anderen Göttern“ gleichzusetzen.
- source_word: לְהַכְעִיסֵנִי
  choice: um mich zum Zorn zu reizen
  rationale: Die Wiedergabe erhält den kausativen Sinn des Hifil und das persönliche Objektsuffix.
- source_word: וְאֹתִי הִשְׁלַכְתָּ אַחֲרֵי גַוֶּךָ
  choice: und mich hast du hinter deinen Rücken geworfen
  rationale: Die vorangestellte Form אֹתִי wird durch „mich“ betont. Das körperhafte Bild bewusster, verächtlicher Zurückweisung bleibt erhalten und wird nicht zu „mich missachtet“ abgeflacht.
theological_decisions:
- issue: Götzendienst als Verehrung anderer Götter und Herstellung konkreter Kultbilder
  choice: andere Götter und gegossene Götterbilder
  alternative: fremde Götter und Götzen
  rationale: 'Die Übersetzung bewahrt beide hebräischen Kategorien: die konkurrierenden Gottheiten und die materiellen, gegossenen Kultobjekte. Sie fasst beides nicht unterschiedslos als „Götzen“ zusammen.'
- issue: Bildhafte Zurückweisung Gottes
  choice: mich hast du hinter deinen Rücken geworfen
  alternative: du hast mich missachtet
  rationale: Das drastische hebräische Bild wird bewahrt, sodass die Schwere der Zurückweisung nicht durch eine abstrakte Deutung abgeschwächt wird.
- issue: Vergleich mit den Vorgängern
  choice: schlimmer gehandelt als alle, die vor dir waren
  alternative: Böses getan vor allen, die vor dir waren
  rationale: מִן trägt klar vergleichende Bedeutung. Die Übersetzung lässt offen, welche einzelnen Vorgänger gemeint sind, und ergänzt keine historische Identifizierung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede und bewahrter Bildsprache. Die adversative Nuance zu Beginn wird mit „aber“ wiedergegeben. Keine Fußnote ist nötig, da „gegossene Götterbilder“ die lexikalische Herstellungsnuance bereits transparent im Haupttext ausdrückt.
