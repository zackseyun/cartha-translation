  variant: modern standard German
source:
  edition: WLC
  text: וַ/תָּ֨קָם֙ אֵ֣שֶׁת יָרָבְעָ֔ם וַ/תֵּ֖לֶךְ וַ/תָּבֹ֣א תִרְצָ֑תָ/ה הִ֛יא בָּאָ֥ה בְ/סַף הַ/בַּ֖יִת וְ/הַ/נַּ֥עַר מֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/017.yaml
  text: Then Jeroboam’s wife arose and went and came to Tirzah. As she came to the threshold of the house[a], the boy died.
translation:
  language: de
  text: Da stand Jerobeams Frau auf, ging fort und kam nach Tirza. Als sie die Schwelle des Hauses erreichte,[a] starb der Junge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Als sie an die Schwelle des Hauses kam“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּקָם
  choice: stand ... auf
  rationale: Das Qal-Wayyiqtol von קום führt die Handlung in der Erzählfolge weiter. „stand ... auf“ wahrt das hebräische Bewegungsbild und klingt im Deutschen natürlich.
- source_word: אֵשֶׁת יָרָבְעָם
  choice: Jerobeams Frau
  rationale: Die Constructusverbindung bezeichnet eindeutig die Ehebeziehung; die deutsche Genitivkonstruktion ist knapp und natürlich.
- source_word: וַתֵּלֶךְ
  choice: ging fort
  rationale: הלך bezeichnet hier die anschließende Bewegung. „ging fort“ unterscheidet diesen Schritt sinnvoll von ihrer Ankunft in Tirza, ohne eine bestimmte Reiseart einzutragen.
- source_word: וַתָּבֹא תִרְצָתָה
  choice: kam nach Tirza
  rationale: בוא mit dem Richtungs-He an תִרְצָתָה bezeichnet die Bewegung zum Ziel Tirza. „kam nach Tirza“ ist die übliche deutsche Wiedergabe für die Ankunft an einem Ort.
- source_word: הִיא בָּאָה
  choice: Als sie ... erreichte
  rationale: Das selbstständige Pronomen mit Partizip bildet eine temporale beziehungsweise umstandsbezogene Aussage. Im Deutschen gibt „als sie ... erreichte“ den entscheidenden Zeitpunkt idiomatisch wieder.
- source_word: בְסַף הַבַּיִת
  choice: die Schwelle des Hauses
  rationale: סַף bezeichnet präzise die Schwelle beziehungsweise Türschwelle. Wegen des Bewegungszusammenhangs wird בְ idiomatisch durch das Verb „erreichte“ aufgenommen.
- source_word: וְהַנַּעַר
  choice: der Junge
  rationale: נַעַר kann je nach Zusammenhang Junge, Kind, junger Mann oder Diener bedeuten. Hier ist Jerobeams Sohn gemeint; „der Junge“ wahrt die altersbezogene, aber nicht genauer bestimmte Bezeichnung.
- source_word: מֵת
  choice: starb
  rationale: Obwohl מֵת formal eine finite Vergangenheitsform ist, bezeichnet es hier im Erzählzusammenhang das in diesem Augenblick eintretende Ereignis und die Erfüllung der vorausgehenden Ankündigung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählfolge. Die leichte Häufung der Bewegungsverben des Hebräischen bleibt erkennbar, wird jedoch durch „ging fort“ und „erreichte“ natürlich gestaltet. Der Fußnotenmarker steht unmittelbar nach der betroffenen Wendung.
