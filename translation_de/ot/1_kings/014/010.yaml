  verdict: revise
  source_fidelity: Der Entwurf gibt die Gerichtsankündigung, die Ausrottungsformel und den drastischen Kotvergleich grundsätzlich treffend wieder. „männlichen Angehörigen“ verengt מַשְׁתִּין בְּקִיר jedoch unnötig auf Familienangehörige, während die Wendung schlicht alle männlichen Personen bezeichnet. „bei Jerobeam“ und besonders „Hinter dem Haus Jerobeams werde ich herfegen“ sind im modernen Deutsch nicht hinreichend klar bzw. natürlich. Die revidierte Fassung gibt die umfassende Tilgung und das Bild des gründlichen Wegfegens wieder, ohne eine umstrittene Einzeldeutung der Paarformel als sicher auszugeben.
  naturalness: Die Satzführung wird als zusammenhängende Gerichtsaussage gestaltet. „Aus Jerobeams Haus“ ist idiomatischer als „bei Jerobeam“, „jede männliche Person“ klarer als „jeden männlichen Angehörigen“, und „das Haus Jerobeams wegfegen“ ist modernes, kräftiges Deutsch. Die Wiederholung von „wegfegen“ bewahrt die Wiederholung von בער im Hebräischen.
  terminology: „Unheil“, „ausrotten“ und „Kot“ bewahren den harten Registerton. „Unfreie wie Freie“ ist als wahrscheinliche soziale Auslegung der unsicheren Formel verständlich; die Fußnote kennzeichnet diese Deutung ausdrücklich und bietet die wörtlichere Alternative. Der Gottesname bzw. die Namensform „Jerobeam“ bleibt konsistent.
