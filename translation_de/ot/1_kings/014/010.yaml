  to: 'Darum: Sieh, ich bringe Unheil über das Haus Jerobeams. Ich werde aus Jerobeams Haus jede männliche Person[a] ausrotten, Unfreie wie Freie[b] in Israel. Ich werde das Haus Jerobeams wegfegen, wie man Kot wegfegt, bis nichts mehr davon übrig ist.'
