source:
  edition: WLC
  text: לָ/כֵ֗ן הִנְ/נִ֨י מֵבִ֤יא רָעָה֙ אֶל בֵּ֣ית יָרָבְעָ֔ם וְ/הִכְרַתִּ֤י לְ/יָֽרָבְעָם֙ מַשְׁתִּ֣ין בְּ/קִ֔יר עָצ֥וּר וְ/עָז֖וּב בְּ/יִשְׂרָאֵ֑ל וּ/בִֽעַרְתִּי֙ אַחֲרֵ֣י בֵית יָרָבְעָ֔ם כַּ/אֲשֶׁ֛ר יְבַעֵ֥ר הַ/גָּלָ֖ל עַד תֻּמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/010.yaml
  text: Therefore[a], behold, I am bringing disaster on the house of Jeroboam, and I will cut off from Jeroboam every male, bond and free in Israel, and I will burn away after the house of Jeroboam[b], just as one burns away dung until it is all gone.
translation:
  language: de
  text: 'Darum: Sieh, ich bringe Unheil über das Haus Jerobeams. Ich werde aus Jerobeams Haus jede männliche Person[a] ausrotten, Unfreie wie Freie[b] in Israel. Ich werde das Haus Jerobeams wegfegen, wie man Kot wegfegt, bis nichts mehr davon übrig ist.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich: „jeden, der an die Wand uriniert“ – eine derbe Bezeichnung für männliche Personen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder wörtlicher: „Gebundene und Freigelassene“. Die Bedeutung der hebräischen Paarformel ist unsicher; wahrscheinlich bezeichnet sie alle ohne Ausnahme.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָה
  choice: Unheil
  rationale: Im Zusammenhang des Gerichts bezeichnet das Wort das von Gott herbeigeführte Verderben, nicht moralische Bosheit. „Unheil“ ist im Deutschen natürlich und bewahrt den Ernst der Ankündigung.
- source_word: וְהִכְרַתִּי
  choice: ich werde … ausrotten
  rationale: כרת bezeichnet hier die vollständige Beseitigung der männlichen Angehörigen und damit das Ende der Dynastie. „Ausrotten“ gibt die Schärfe des Gerichtswortes wieder.
- source_word: מַשְׁתִּין בְּקִיר
  choice: jeden männlichen Angehörigen
  rationale: Die wörtlich derbe Wendung „der an die Wand uriniert“ bezeichnet männliche Personen. Der Haupttext vermittelt den gemeinten Personenkreis; die Bildhaftigkeit bleibt in der Fußnote dokumentiert.
- source_word: עָצוּר וְעָזוּב
  choice: ob unfrei oder frei
  rationale: Die schwierige feste Wortverbindung bildet wahrscheinlich eine umfassende Paarformel. Die Wiedergabe lässt beide gesellschaftlichen Gruppen erkennen, ohne die Aussage auf eine einzelne, unsichere Deutung zu verengen.
- source_word: וּבִעַרְתִּי אַחֲרֵי בֵית יָרָבְעָם
  choice: Hinter dem Haus Jerobeams werde ich herfegen
  rationale: Die Formulierung bewahrt das ungewöhnliche אַחֲרֵי („hinter … her“) und versteht בער im Licht des Kotvergleichs als gründliches Beseitigen. Das Bild bezeichnet die restlose Entfernung der Dynastie.
- source_word: הַגָּלָל
  choice: Kot
  rationale: „Kot“ wahrt den bewusst verächtlichen und drastischen Charakter des Vergleichs, ohne ihn unnötig abzuschwächen.
- source_word: עַד תֻּמּוֹ
  choice: bis nichts mehr davon übrig ist
  rationale: Die Wendung betont die Vollständigkeit der Beseitigung; die deutsche Formulierung gibt dies klar und idiomatisch wieder.
theological_decisions:
- issue: Die Härte des göttlichen Gerichtswortes
  choice: Direkte, scharfe Gerichtssprache mit „Unheil“, „ausrotten“ und dem ungemilderten Kotvergleich
  alternative: Abschwächende Begriffe wie „Not“, „entfernen“ oder „Unrat“
  rationale: Der hebräische Text kündigt die vollständige Beseitigung der Dynastie in bewusst drastischer Sprache an. Die Übersetzung wahrt diese Schärfe, ohne sie konfessionell auszudeuten.
- issue: Reichweite der Paarformel עָצוּר וְעָזוּב
  choice: „ob unfrei oder frei“ als umfassende Paarformel
  alternative: Wörtlich „Festgehaltenen und Losgelassenen“ oder andere unsichere Einzeldeutungen
  rationale: Die Formel soll offenbar ausnahmslose Gesamtheit ausdrücken. Die Übersetzung bewahrt diese Funktion und weist in einer Fußnote auf die sprachliche Unsicherheit hin.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener Drastik. Der Gedankenstrich nach „Darum“ gibt den hervorgehobenen Übergang wieder; „sieh“ bewahrt das prophetische Aufmerksamkeitssignal הִנְנִי. Die ungewöhnliche Wendung „hinter … herfegen“ hält die Bildstruktur des Hebräischen sichtbar, während der Schluss ihre Bedeutung als restlose Beseitigung verständlich macht.
