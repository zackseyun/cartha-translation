  - severity: medium
    issue: „bei Jerobeam“
    rationale: Die Formulierung ist im modernen Standarddeutsch semantisch unscharf. Gemeint ist die Beseitigung männlicher Personen aus Jerobeams Haus bzw. Herrschaftsbereich.
  - severity: medium
    issue: „Hinter dem Haus Jerobeams werde ich herfegen“
    rationale: Die sehr wörtliche Wiedergabe von אַחֲרֵי ist im Deutschen ungewöhnlich und kann missverständlich sein. Der Kontext und der folgende Vergleich verlangen die Vorstellung vollständigen Wegfegens; die besondere hebräische Konstruktion muss nicht unidiomatisch nachgebildet werden.
  - severity: low
