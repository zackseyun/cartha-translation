  text: וַ/יהוָ֞ה אָמַ֣ר אֶל אֲחִיָּ֗הוּ הִנֵּ֣ה אֵ֣שֶׁת יָרָבְעָ֡ם בָּאָ֣ה לִ/דְרֹשׁ֩ דָּבָ֨ר מֵ/עִמְּ/ךָ֤ אֶל בְּנָ/הּ֙ כִּֽי חֹלֶ֣ה ה֔וּא כָּ/זֹ֥ה וְ/כָ/זֶ֖ה תְּדַבֵּ֣ר אֵלֶ֑י/הָ וִ/יהִ֣י כְ/בֹאָ֔/הּ וְ/הִ֖יא מִתְנַכֵּרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/005.yaml
  text: And Yahweh said to Ahijah[a], “Look, Jeroboam’s wife is coming to ask you about her son, because he is sick. You shall speak to her like this and like that. And when she comes[b], she will be disguising herself.”
translation:
  language: de
  text: 'Und Jahwe sprach zu Ahija: „Sieh, Jerobeams Frau kommt, um dich wegen ihres Sohnes zu befragen, denn er ist krank. So und so sollst du zu ihr sprechen.[a] Wenn sie kommt, wird sie sich unkenntlich machen.[b]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „So und so“; die hebräische Wendung bezeichnet eine bestimmte Botschaft, deren Inhalt hier noch nicht ausdrücklich genannt wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wird sie sich als eine andere ausgeben“. Das hebräische Verb bezeichnet, dass sie ihre Identität verbirgt oder sich unerkennbar macht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: Und Jahwe
  rationale: Gibt den Gottesnamen יהוה als Eigennamen wieder und bewahrt mit „Und“ den erzählerischen Anschluss.
- source_word: הִנֵּה
  choice: Sieh
  rationale: Bewahrt den aufmerksamkeitslenkenden und unmittelbaren Charakter, ohne die altertümliche Form „Siehe“ zu verwenden.
- source_word: לִדְרֹשׁ דָּבָר מֵעִמְּךָ אֶל בְּנָהּ
  choice: um dich wegen ihres Sohnes zu befragen
  rationale: Gibt die Bitte um Auskunft beziehungsweise prophetische Weisung natürlich wieder, ohne den Kontext zu stark als förmliche Orakelbefragung festzulegen.
- source_word: כִּי חֹלֶה הוּא
  choice: denn er ist krank
  rationale: Direkte, idiomatische Wiedergabe des begründenden Satzes.
- source_word: כָּזֹה וְכָזֶה
  choice: So und so
  rationale: Die deutsche Wendung bewahrt die hebräische Formel für eine bestimmte, an dieser Stelle jedoch noch nicht ausdrücklich mitgeteilte Botschaft.
- source_word: תְּדַבֵּר אֵלֶיהָ
  choice: sollst du zu ihr sprechen
  rationale: Bewahrt sowohl den Redevorgang als auch den an Ahija gerichteten anweisenden Charakter.
- source_word: וְהִיא מִתְנַכֵּרָה
  choice: wird sie sich als eine andere ausgeben
  rationale: 'Erfasst die reflexive Bedeutung des Hitpael: Sie macht ihre Identität unkenntlich beziehungsweise gibt sich als jemand anderes aus.'
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname bleibt als solcher sichtbar; die Form „Jahwe“ ist im modernen Deutschen verständlich und vermeidet, den Namen durch einen Titel zu ersetzen.
- issue: Art der Befragung Ahijas
  choice: dich wegen ihres Sohnes zu befragen
  alternative: bei dir ein Wort über ihren Sohn zu suchen
  rationale: Die Formulierung lässt den prophetischen Zusammenhang erkennen, legt aber nicht über den hebräischen Wortlaut hinaus fest, welche konkrete Form der Auskunft erwartet wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählprosa. „Sieh“ erhält die aufmerksamkeitslenkende Funktion von הִנֵּה, ohne archaisch zu wirken. Die idiomatische Formel „So und so“ wahrt die absichtliche Unbestimmtheit des Ausgangstextes.
