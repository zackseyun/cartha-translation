  text: וַ/יְהִ֛י בַּ/שָּׁנָ֥ה הַ/חֲמִישִׁ֖ית לַ/מֶּ֣לֶךְ רְחַבְעָ֑ם עָלָ֛ה שושק מֶֽלֶךְ מִצְרַ֖יִם עַל יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/025.yaml
  text: In the fifth year of King Rehoboam[a], Shishak king of Egypt came up against Jerusalem.
translation:
  language: de
  text: Im fünften Regierungsjahr König Rehabeams zog Schischak, der König von Ägypten, gegen Jerusalem hinauf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb bedeutet wörtlich »hinaufziehen« und kann bei einem militärischen Zug auch im Sinn von »gegen Jerusalem vorrücken« verstanden werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: nicht eigens wiedergegeben
  rationale: Die Wayyiqtol-Form eröffnet die nächste Erzählentwicklung. Im modernen Deutschen wird diese Verknüpfung durch den Satzanschluss ausreichend ausgedrückt; ein zusätzliches »Und es geschah« wäre unnötig schwerfällig.
- source_word: בַּשָּׁנָה הַחֲמִישִׁית לַמֶּלֶךְ רְחַבְעָם
  choice: Im fünften Regierungsjahr König Rehabeams
  rationale: Die übliche Datierungsformel bezieht sich auf Rehabeams Herrschaft. »Regierungsjahr« macht diesen im Hebräischen vorausgesetzten Bezug im Deutschen eindeutig und idiomatisch.
- source_word: עָלָה
  choice: zog … hinauf
  rationale: Das Verb bezeichnet hier den militärischen Zug gegen eine Stadt und bewahrt zugleich die im Hebräischen ausgedrückte Aufwärtsbewegung. »Griff an« wäre stärker festlegend, als der Vers verlangt.
- source_word: שושק
  choice: Schischak
  rationale: Die Form folgt der im Deutschen üblichen biblischen Wiedergabe des hebräischen Namens, ohne die historische Identifizierung mit Scheschonq in den Text einzutragen.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: der König von Ägypten
  rationale: Die Apposition nennt Schischaks Amt und Herrschaftsgebiet; mit Artikel klingt sie im modernen Deutschen natürlich.
- source_word: עַל יְרוּשָׁלִָם
  choice: gegen Jerusalem
  rationale: In Verbindung mit dem militärisch gebrauchten עָלָה hat עַל hier gegnerische Bedeutung. »Gegen« gibt diese Zielrichtung klar wieder.
theological_decisions: []
