  variant: modern standard German
source:
  edition: WLC
  text: הַ/מֵּ֨ת לְ/יָֽרָבְעָ֤ם בָּ/עִיר֙ יֹאכְל֣וּ הַ/כְּלָבִ֔ים וְ/הַ/מֵּת֙ בַּ/שָּׂדֶ֔ה יֹאכְל֖וּ ע֣וֹף הַ/שָּׁמָ֑יִם כִּ֥י יְהוָ֖ה דִּבֵּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/011.yaml
  text: Anyone belonging to Jeroboam who dies in the city[a], the dogs will eat; and anyone who dies in the field, the birds of the sky will eat[b], for Yahweh has spoken.
translation:
  language: de
  text: Wer von Jerobeams Haus in der Stadt stirbt,[a] den werden die Hunde fressen; und wer auf dem Feld stirbt, den werden die Vögel des Himmels fressen.[b] Denn Jahwe hat gesprochen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »der Tote Jerobeams«; gemeint ist jeder, der zu Jerobeams Haus gehört und stirbt.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »die Vögel des Himmelsraums«; traditionell: »die Vögel unter dem Himmel« beziehungsweise »die Vögel der Luft«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֵּת לְיָרָבְעָם
  choice: Wer von Jerobeams Haus … stirbt
  rationale: Die wörtlich knappe Wendung »der Tote Jerobeams« bezeichnet idiomatisch einen Angehörigen seines Hauses. Die distributive deutsche Form gibt den Sinn natürlich wieder; »Haus« macht die gemeinte Zugehörigkeit deutlich.
- source_word: בָּעִיר
  choice: in der Stadt
  rationale: Direkte Wiedergabe der Ortsangabe; der bestimmte Singular bleibt erhalten.
- source_word: יֹאכְלוּ הַכְּלָבִים
  choice: den werden die Hunde fressen
  rationale: אָכַל bedeutet hier »essen/fressen«; bei Tieren und menschlichen Leichen ist »fressen« im Deutschen natürlich und bewahrt das grausame Bild ohne zusätzliche Verstärkung.
- source_word: וְהַמֵּת בַּשָּׂדֶה
  choice: und wer auf dem Feld stirbt
  rationale: Die parallele distributive Form wird beibehalten. »Feld« entspricht שָׂדֶה und bildet den örtlichen Gegensatz zur Stadt.
- source_word: עוֹף הַשָּׁמָיִם
  choice: die Vögel des Himmels
  rationale: עוֹף ist kollektiv gebraucht; »Vögel des Himmels« gibt die traditionelle Bildsprache und den direkten Bezug zu שָׁמַיִם wieder.
- source_word: כִּי יְהוָה דִּבֵּר
  choice: Denn Jahwe hat gesprochen
  rationale: כִּי nennt den Grund beziehungsweise die Gewissheit des Urteils. Das Perfekt wird mit »hat gesprochen« wiedergegeben; der Gottesname erscheint als »Jahwe«.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen יהוה. »Jahwe« gibt ihn als Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Umfang der Wendung לְיָרָבְעָם
  choice: Jerobeams Haus
  alternative: wer Jerobeam gehört; Jerobeams Nachkommen
  rationale: Der Kontext zielt auf die Angehörigen der Dynastie beziehungsweise des Hauses Jerobeams. »Haus« ist hinreichend weit und legt die Beziehung nicht unnötig auf biologischen Nachwuchs fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Satzbau und die drastische Gerichtssprache des Hebräischen bleiben erhalten. »Fressen« ist im Deutschen bei Tieren idiomatischer als »essen« und verstärkt den Ausgangstext nicht künstlich.
