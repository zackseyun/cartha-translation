  text: וַ/יִּקְבְּר֥וּ אֹת֛/וֹ וַ/יִּסְפְּדוּ ל֖/וֹ כָּל יִשְׂרָאֵ֑ל כִּ/דְבַ֤ר יְהוָה֙ אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַד עַבְדּ֖/וֹ אֲחִיָּ֥הוּ הַ/נָּבִֽיא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/018.yaml
  text: They buried him[a], and all Israel mourned for him, according to the word of Yahweh that he had spoken through his servant Ahijah the prophet.
translation:
  language: de
  text: Sie begruben ihn, und ganz Israel hielt Totenklage um ihn, entsprechend dem Wort Jahwes, das er durch seinen Diener, den Propheten Ahija, gesprochen hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: Sie begruben ihn
  rationale: Das Qal-Wayyiqtol von קבר bezeichnet im fortlaufenden Bericht die Bestattung; das Objektpronomen verweist auf den verstorbenen Sohn. Die wiederholte hebräische Konjunktion muss im Deutschen nicht eigens mit „und“ wiedergegeben werden.
- source_word: וַיִּסְפְּדוּ לוֹ
  choice: hielt die Totenklage um ihn
  rationale: ספד bezeichnet öffentliche Trauer beziehungsweise Totenklage. Die gewählte Formulierung bewahrt diesen konkreteren Sinn und klingt zugleich natürlich.
- source_word: כָּל יִשְׂרָאֵל
  choice: ganz Israel
  rationale: Die kollektive Bezeichnung für das Volk wird im Deutschen knapp und idiomatisch wiedergegeben.
- source_word: כִּדְבַר יְהוָה
  choice: entsprechend dem Wort Jahwes
  rationale: כְּ mit דָבָר bezeichnet die Übereinstimmung des Geschehens mit dem zuvor ergangenen Gotteswort; „Wort“ erhält die prophetische Erfüllungsformel.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname transliteriert und nicht durch einen Titel ersetzt.
- source_word: אֲשֶׁר דִּבֶּר
  choice: das er … gesprochen hatte
  rationale: Der Relativsatz bezieht sich auf „Wort“. Das Plusquamperfekt macht im Deutschen deutlich, dass die prophetische Rede dem berichteten Geschehen vorausging.
- source_word: בְּיַד עַבְדּוֹ
  choice: durch seinen Diener
  rationale: Wörtlich steht „durch die Hand seines Dieners“; בְּיַד ist hier eine geläufige Formel für Vermittlung beziehungsweise Beauftragung. „Durch“ gibt sie in heutigem Deutsch klar wieder.
- source_word: אֲחִיָּהוּ הַנָּבִיא
  choice: den Propheten Ahija
  rationale: Der Personenname wird nach üblicher deutscher Form als „Ahija“ wiedergegeben; der bestimmte Titel kennzeichnet seine Funktion.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. Die Transliteration bewahrt diese sprachliche Unterscheidung, ohne einen ersetzenden Titel einzuführen.
- issue: Prophetische Vermittlungsformel בְּיַד עַבְדּוֹ
  choice: durch seinen Diener
  alternative: durch die Hand seines Dieners
  rationale: Die natürliche deutsche Wiedergabe hält fest, dass Jahwes Wort durch Ahija vermittelt wurde, ohne über den Wortlaut hinaus eine besondere Inspirationslehre zu formulieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkrete öffentliche Trauerhandlung wird mit „Totenklage halten“ ausgedrückt. Der Satzbau bleibt nahe am hebräischen Ablauf, vermeidet aber eine unnatürliche wörtliche Wiedergabe der Vermittlungsformel.
