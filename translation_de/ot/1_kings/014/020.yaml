source:
  edition: WLC
  text: וְ/הַ/יָּמִים֙ אֲשֶׁ֣ר מָלַ֣ךְ יָרָבְעָ֔ם עֶשְׂרִ֥ים וּ/שְׁתַּ֖יִם שָׁנָ֑ה וַ/יִּשְׁכַּב֙ עִם אֲבֹתָ֔י/ו וַ/יִּמְלֹ֛ךְ נָדָ֥ב בְּנ֖/וֹ תַּחְתָּֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/020.yaml
  text: The days that Jeroboam reigned were twenty-two years. Then he lay down with his fathers[a], and Nadab his son became king in his place.
translation:
  language: de
  text: Die Zeit, in der Jerobeam König war, betrug zweiundzwanzig Jahre. Dann legte er sich zu seinen Vorfahren[a], und sein Sohn Nadab wurde an seiner Stelle König.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell auch: „Er entschlief zu seinen Vätern.“ Die hebräische Wendung bezeichnet in dieser königlichen Thronfolgeformel seinen Tod.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיָּמִים אֲשֶׁר מָלַךְ יָרָבְעָם
  choice: Die Zeit, in der Jerobeam König war
  rationale: Gibt die übliche hebräische Regierungsformel in natürlichem modernem Deutsch wieder; das einleitende וְ muss hier nicht eigens mit „und“ übersetzt werden.
- source_word: עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: zweiundzwanzig Jahre
  rationale: Idiومatische deutsche Wiedergabe der hebräischen Zahlform.
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: Dann legte er sich zu seinen Vorfahren
  rationale: Bewahrt das Bild der hebräischen Todesformel, ohne über den Text hinaus Tod und Bestattung ausdrücklich zu ergänzen. „Vorfahren“ ist im heutigen Deutsch natürlicher und inklusiver für die Ahnenreihe als das wörtliche „Väter“.
- source_word: וַיִּמְלֹךְ
  choice: wurde ... König
  rationale: Kennzeichnet in der Thronfolgeformel klar den Regierungsantritt.
- source_word: נָדָב בְּנוֹ
  choice: sein Sohn Nadab
  rationale: Natürliche deutsche Wortstellung, welche die ausdrücklich genannte Sohnschaft bewahrt.
- source_word: תַּחְתָּיו
  choice: an seiner Stelle
  rationale: Gibt im Zusammenhang der Thronfolge die Ablösung beziehungsweise Nachfolge präzise wieder.
theological_decisions:
- issue: Todesformel im Königsbericht
  choice: Das hebräische Bild „legte er sich zu seinen Vorfahren“ wird im Haupttext bewahrt.
  alternative: „Er starb“ oder traditionell „er entschlief zu seinen Vätern“.
  rationale: Die Wendung ist eine feste erzählerische Todesformel und keine ausgeführte Lehraussage über das Jenseits. Eine bildhafte Wiedergabe erhält die Eigenart des Ausgangstextes, während die Fußnote ihre Bedeutung erläutert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist gut verständlich, bewahrt aber durch „legte er sich zu seinen Vorfahren“ bewusst das Bild der hebräischen Todesformel.
