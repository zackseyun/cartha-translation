  text: וַ/יַּ֨עַשׂ הַ/מֶּ֤לֶךְ רְחַבְעָם֙ תַּחְתָּ֔/ם מָגִנֵּ֖י נְחֹ֑שֶׁת וְ/הִפְקִ֗יד עַל יַד֙ שָׂרֵ֣י הָ/רָצִ֔ים הַ/שֹּׁ֣מְרִ֔ים פֶּ֖תַח בֵּ֥ית הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/027.yaml
  text: So King Rehoboam made bronze shields in their place and committed them into the hand of the commanders of the runners[b][a], who guarded the entrance of the king’s house.
translation:
  language: de
  text: Da machte König Rehabeam an ihrer Stelle bronzene Schilde und übergab sie den Befehlshabern der Läufer[a]. Diese bewachten den Eingang des Palastes des Königs[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Deutend auch: „den Befehlshabern der Wache“. Wörtlich steht im Hebräischen „den Befehlshabern der Läufer“; vermutlich handelte es sich um eine königliche Leibwache oder eine Kuriertruppe.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „das Haus des Königs“; gemeint ist hier der königliche Palast.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ließ … anfertigen
  rationale: Das Verb עשה bedeutet hier „machen/anfertigen“. Die kausative deutsche Wendung passt natürlich zu einem König, ohne auszuschließen, dass er die Herstellung veranlasste.
- source_word: הַמֶּלֶךְ רְחַבְעָם
  choice: König Rehabeam
  rationale: Die im Deutschen übliche Reihenfolge von Titel und Name gibt den hebräischen Ausdruck natürlich wieder.
- source_word: תַּחְתָּם
  choice: an ihrer Stelle
  rationale: Das Suffix verweist auf die im vorigen Vers weggenommenen goldenen Schilde; die Formulierung drückt ihren Ersatz aus.
- source_word: מָגִנֵּי נְחֹשֶׁת
  choice: bronzene Schilde
  rationale: נְחֹשֶׁת kann Kupfer oder Bronze bezeichnen. Bei antiken Metallarbeiten ist „Bronze“ hier die naheliegende, konventionelle Wiedergabe.
- source_word: וְהִפְקִיד עַל יַד
  choice: vertraute sie … an
  rationale: Die Verbindung bezeichnet die Übergabe in die Obhut oder Verantwortung anderer. „Anvertrauen“ bildet die Bedeutung idiomatisch und präzise ab.
- source_word: שָׂרֵי הָרָצִים
  choice: Befehlshaber der Läufer
  rationale: Die Wiedergabe bewahrt die wörtliche Bezeichnung der königlichen Gruppe, statt ihre genaue Funktion einseitig als Leibwache oder Kurierdienst festzulegen.
- source_word: הַשֹּׁמְרִים
  choice: die … bewachten
  rationale: Der Partizipialsatz beschreibt ihre fortdauernde Aufgabe und wird im Deutschen natürlich als Relativsatz wiedergegeben.
- source_word: פֶּתַח בֵּית הַמֶּלֶךְ
  choice: den Eingang des Königshauses
  rationale: Die Formulierung bleibt nahe am Hebräischen; „Königshaus“ bezeichnet hier konkret den königlichen Palast.
