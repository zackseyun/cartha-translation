- from: Da ließ König Rehabeam an ihrer Stelle bronzene Schilde anfertigen und vertraute sie den Befehlshabern der Läufer[a] an, die den Eingang des Königshauses[b] bewachten.
  to: Da machte König Rehabeam an ihrer Stelle bronzene Schilde und übergab sie den Befehlshabern der Läufer[a]. Diese bewachten den Eingang des Palastes des Königs[b].
  rationale: Die Revision beseitigt den möglichen falschen Bezug des Bewachungsdienstes und die moderne deutsche Mehrdeutigkeit von „Königshaus“. Sie gibt עשה unmittelbarer wieder und glättet die Fußnote, ohne die historische Funktion der Läufer im Haupttext einseitig festzulegen.
