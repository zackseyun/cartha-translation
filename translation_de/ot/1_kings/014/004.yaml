base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/004.yaml
  text: Jeroboam’s wife did so. She arose and went to Shiloh[a], and came to Ahijah’s house. Now Ahijah could not see, because his eyes were dim because of his old age.
translation:
  language: de
  text: Jerobeams Frau tat es. Sie machte sich auf, ging nach Schilo und kam zum Haus Ahijas. Ahija aber konnte nicht sehen, denn seine Augen waren wegen seines hohen Alters schwach geworden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Seine Augen standen wegen seines hohen Alters.« Die hebräische Wendung beschreibt altersbedingte Sehschwäche.'
    reason: Die wörtliche Bildsprache ist im Deutschen missverständlich; die Anmerkung dokumentiert sie und erläutert ihren idiomatischen Sinn.
lexical_decisions:
- source_word: וַתַּעַשׂ כֵּן
  choice: tat es
  rationale: Die knappe deutsche Wendung gibt die hebräische Erzählformel wieder und verweist natürlich auf die zuvor erteilte Anweisung.
- source_word: אֵשֶׁת יָרָבְעָם
  choice: Jerobeams Frau
  rationale: Die deutsche Genitivkonstruktion gibt die hebräische Status-constructus-Verbindung klar und natürlich wieder.
- source_word: וַתָּקָם
  choice: Sie machte sich auf
  rationale: In Verbindung mit dem anschließenden Gehen bezeichnet קום hier den Aufbruch; die Wendung bewahrt die Abfolge, ohne altertümlich zu klingen.
- source_word: וַתֵּלֶךְ שִׁלֹה
  choice: ging nach Schilo
  rationale: Das Ziel wird im Hebräischen durch die Richtungsendung bezeichnet; „nach Schilo“ ist die idiomatische deutsche Wiedergabe.
- source_word: וַתָּבֹא בֵּית אֲחִיָּה
  choice: kam zum Haus Ahijas
  rationale: Die Formulierung bezeichnet sicher das Erreichen von Ahijas Haus, ohne unnötig festzulegen, ob ausdrücklich das Betreten des Innenraums gemeint ist.
- source_word: וַאֲחִיָּהוּ
  choice: Ahija aber
  rationale: Das Waw lenkt den Blick auf Ahija und markiert einen leichten Themenwechsel; „aber“ gibt diesen Übergang im Deutschen flüssig wieder.
- source_word: לֹא יָכֹל לִרְאוֹת
  choice: konnte nicht sehen
  rationale: Direkte und natürliche Wiedergabe der Konstruktion aus Fähigkeitsverb und Infinitiv.
- source_word: קָמוּ עֵינָיו
  choice: seine Augen waren … starr geworden
  rationale: Die ungewöhnliche hebräische Wendung lautet wörtlich, dass seine Augen „standen“. „Starr geworden“ bewahrt das konkrete Bild und bezeichnet im Zusammenhang den altersbedingten Verlust des Sehvermögens.
- source_word: מִשֵּׂיבוֹ
  choice: infolge seines hohen Alters
  rationale: Die Präposition bezeichnet hier die Ursache; „hohes Alter“ gibt den Sinn des Substantivs שֵׂיבָה in diesem Zusammenhang idiomatisch wieder.
