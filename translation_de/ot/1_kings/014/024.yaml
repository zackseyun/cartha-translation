source:
  edition: WLC
  text: וְ/גַם קָדֵ֖שׁ הָיָ֣ה בָ/אָ֑רֶץ עָשׂ֗וּ כְּ/כֹל֙ הַ/תּוֹעֲבֹ֣ת הַ/גּוֹיִ֔ם אֲשֶׁר֙ הוֹרִ֣ישׁ יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/024.yaml
  text: There were also cult prostitutes in the land[a]. They did according to all the abominations of the nations that Yahweh had driven out before the sons of Israel.
translation:
  language: de
  text: Auch gab es Kultprostituierte im Land.[a] Sie handelten nach all den abscheulichen Praktiken der Völker, die Jahwe vor den Israeliten vertrieben hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, im Singular: „einen männlichen Kultprostituierten“. Das hebräische Wort קָדֵשׁ steht im maskulinen Singular, kann hier jedoch kollektiv gebraucht sein. Es bezeichnet vermutlich eine Person im Zusammenhang mit verbotener kultischer Sexualpraxis; die genaue kultische Funktion ist unsicher.'
    reason: Lexikalische Alternative sowie Bewahrung der Unsicherheit hinsichtlich Numerus und genauer Kultfunktion; die maskuline Form des Hebräischen wird korrekt berücksichtigt.
lexical_decisions:
- source_word: וְגַם
  choice: Auch gab es
  rationale: Gibt den additiven Anschluss und die Existenzkonstruktion in natürlichem Deutsch wieder.
- source_word: קָדֵשׁ
  choice: Kultprostituierte
  rationale: Der maskuline Singular bezeichnet hier in einer Existenzkonstruktion kollektiv Personen, die mit unerlaubter kultischer Sexualpraxis verbunden waren. Der Plural ist im Deutschen natürlich; die Fußnote wahrt die formale und lexikalische Unschärfe.
- source_word: הָיָה בָאָרֶץ
  choice: gab es … im Land
  rationale: Natürliche deutsche Wiedergabe der existenziellen Verwendung von היה mit Ortsangabe.
- source_word: עָשׂוּ כְּכֹל
  choice: Sie handelten nach all
  rationale: Bewahrt das breite Verb und bringt die Übereinstimmung mit den genannten Praktiken idiomatisch zum Ausdruck.
- source_word: הַתּוֹעֲבֹת
  choice: abscheulichen Bräuchen
  rationale: Vermittelt die starke moralisch-religiöse Wertung des hebräischen Begriffs und passt syntaktisch zu dem, was praktiziert wurde.
- source_word: הַגּוֹיִם
  choice: der Völker
  rationale: Bezeichnet hier die nichtisraelitischen Völker Kanaans, ohne spätere neutestamentliche Konnotationen einzutragen.
- source_word: הוֹרִישׁ
  choice: vertrieben hatte
  rationale: Das Hifil von ירשׁ bezeichnet hier die Vertreibung beziehungsweise Besitzentziehung der früheren Bewohner; das Plusquamperfekt markiert die Vorzeitigkeit.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen im modernen deutschen Bibelregister als Eigennamen wieder.
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: vor den Israeliten
  rationale: Idiomatiches Deutsch für die Vertreibungsformel; „Israeliten“ gibt den etablierten Volksnamen wieder, der mit בני ישראל gemeint ist.
theological_decisions:
- issue: Bedeutung von קָדֵשׁ im Zusammenhang unerlaubter Kultpraxis
  choice: Kultprostituierte
  alternative: männlicher Kultprostituierter; Tempelprostituierte
  rationale: Der Ausdruck bezeichnet eine dem unerlaubten Kult zugeordnete Person und ist grammatisch maskulin Singular, wird hier aber wahrscheinlich kollektiv gebraucht. „Kultprostituierte“ vermeidet die sachlich irreführende traditionelle Wiedergabe „Sodomiter“; die Fußnote erhält Unsicherheiten zu Geschlecht und genauer institutioneller Zuordnung.
- issue: Wiedergabe von בני ישראל
  choice: Israeliten
  alternative: Söhne Israels
  rationale: Die feste ethnische Bezeichnung meint das Volk Israel. „Israeliten“ ist im heutigen Deutsch präzise und natürlich, ohne die genealogische Herkunft zu bestreiten.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Eigenname bleibt sichtbar und wird in einer im Deutschen geläufigen wissenschaftlichen Form wiedergegeben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Abscheuliche Bräuche“ vermittelt die religiös-moralische Schärfe, klingt aber natürlicher als das substantivische „Gräuel“. Der zweite Plural („Sie handelten“) bezieht sich im Kontext am natürlichsten auf die Bewohner Judas insgesamt, nicht ausschließlich auf die unmittelbar zuvor genannten Kultprostituierten.
