  text: וְ/סָֽפְדוּ ל֤/וֹ כָל יִשְׂרָאֵל֙ וְ/קָבְר֣וּ אֹת֔/וֹ כִּֽי זֶ֣ה לְ/בַדּ֔/וֹ יָבֹ֥א לְ/יָרָבְעָ֖ם אֶל קָ֑בֶר יַ֣עַן נִמְצָא ב֞/וֹ דָּבָ֣ר ט֗וֹב אֶל יְהוָ֛ה אֱלֹהֵ֥י יִשְׂרָאֵ֖ל בְּ/בֵ֥ית יָרָבְעָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/013.yaml
  text: All Israel will mourn for him and bury him[a], because he alone of Jeroboam’s house will come to the grave, since in him something good toward Yahweh, the God of Israel[c][b], has been found in the house of Jeroboam.
translation:
  language: de
  text: Ganz Israel wird um ihn trauern und ihn begraben.[a] Denn nur er aus dem Haus Jerobeams wird zu einem Grab kommen, weil sich bei ihm, im Haus Jerobeams, etwas Gutes gegenüber Jahwe, dem Gott Israels, gefunden hat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Denn dieser allein wird für Jerobeam zu einem Grab kommen.“ Die ungewöhnliche hebräische Formulierung meint im Zusammenhang, dass nur er aus Jerobeams Haus ein Grab und damit eine ordentliche Bestattung erhalten wird.'
    reason: Die schwierige Konstruktion לְיָרָבְעָם אֶל־קָבֶר wird transparent erläutert, ohne לְ fälschlich als „von“ wiederzugeben.
  - marker: b
    text: „Gegenüber Jahwe“ kann sowohl eine auf Jahwe gerichtete gute Haltung als auch etwas bezeichnen, das in Beziehung zu ihm gut war bzw. ihm gefiel.
    reason: Die Bedeutung der Verbindung דָּבָר טוֹב אֶל יְהוָה bleibt offen; die Fußnote vermeidet eine einseitige theologische Festlegung.
lexical_decisions:
- source_word: וְסָפְדוּ לוֹ
  choice: wird um ihn die Totenklage halten
  rationale: ספד bezeichnet ausdrücklich die Klage um einen Verstorbenen. „Die Totenklage halten“ ist präziser als das allgemeinere „trauern“, bleibt aber in modernem Deutsch verständlich.
- source_word: וְקָבְרוּ אֹתוֹ
  choice: und ihn begraben
  rationale: Die Wendung bezeichnet schlicht die Bestattung; das Subjekt „ganz Israel“ gilt auch für das zweite Verb.
- source_word: כִּי זֶה לְבַדּוֹ
  choice: Denn er allein
  rationale: Die Formulierung hebt diesen Sohn im Gegensatz zu allen übrigen Angehörigen Jerobeams hervor.
- source_word: יָבֹא לְיָרָבְעָם אֶל קָבֶר
  choice: aus dem Haus Jerobeams wird in ein Grab kommen
  rationale: Die schwerfällige hebräische Formulierung kennzeichnet ihn als den einzigen Jerobeam Zugehörigen, der ein Grab und damit eine ordentliche Bestattung erhalten wird. „In ein Grab kommen“ bewahrt das Bild des Ausgangstextes.
- source_word: נִמְצָא בוֹ דָּבָר טוֹב
  choice: hat sich an ihm etwas Gutes gefunden
  rationale: Die unbestimmte Formulierung lässt offen, worin das Gute genau bestand, und gibt das passive נִמְצָא angemessen wieder.
- source_word: אֶל יְהוָה
  choice: in Bezug auf Jahwe
  rationale: אֶל drückt hier eine Ausrichtung oder Beziehung zu Jahwe aus. Die Wiedergabe vermeidet eine vorschnelle Festlegung darauf, ob eine innere Haltung oder etwas Gott Wohlgefälliges gemeint ist.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der göttliche Eigenname wird in der im Deutschen geläufigen Form „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: בְּבֵית יָרָבְעָם
  choice: im Haus Jerobeams
  rationale: „Haus“ bezeichnet hier Familie beziehungsweise Dynastie und bewahrt zugleich die für die Königebücher typische Ausdrucksweise.
theological_decisions:
- issue: Bedeutung von דָּבָר טוֹב אֶל יְהוָה
  choice: etwas Gutes in Bezug auf Jahwe
  alternative: etwas, das Jahwe gefiel; eine gute Haltung gegenüber Jahwe
  rationale: Der hebräische Ausdruck benennt das Gute und seine Beziehung zu Jahwe, legt jedoch nicht eindeutig fest, ob eine innere Ausrichtung, eine konkrete Handlung oder Gottes Wohlgefallen im Vordergrund steht.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Da im Ausgangstext der Eigenname steht, wird er als Eigenname wiedergegeben; die deutsche Form „Jahwe“ ist dafür geläufig.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Totenklage halten“ wahrt den konkreten Bestattungskontext; „Haus Jerobeams“ erhält den familiär-dynastischen Klang. Die etwas offene Formulierung „etwas Gutes in Bezug auf Jahwe“ bewahrt die semantische und theologische Spannung des Hebräischen.
