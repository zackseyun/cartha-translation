source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֨ב רְחַבְעָ֜ם עִם אֲבֹתָ֗י/ו וַ/יִּקָּבֵ֤ר עִם אֲבֹתָי/ו֙ בְּ/עִ֣יר דָּוִ֔ד וְ/שֵׁ֣ם אִמּ֔/וֹ נַעֲמָ֖ה הָ/עַמֹּנִ֑ית וַ/יִּמְלֹ֛ךְ אֲבִיָּ֥ם בְּנ֖/וֹ תַּחְתָּֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/031.yaml
  text: And Rehoboam slept with his fathers and was buried with his fathers in the city of David[a]. And his mother's name was Naamah the Ammonite[b]. And Abijam his son reigned in his place.
translation:
  language: de
  text: Und Rehabeam legte sich zu seinen Vätern[a] und wurde bei seinen Vätern in der Stadt Davids begraben. Seine Mutter hieß Naama, die Ammoniterin. Und sein Sohn Abijam[b] wurde an seiner Stelle König.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Legte sich zu seinen Vätern“ ist eine feste hebräische Wendung für seinen Tod.
    reason: idiom_clarification
  - marker: b
    text: Derselbe König wird an anderen Stellen Abija genannt; hier steht im hebräischen Text Abijam.
    reason: name_variant
lexical_decisions:
- source_word: וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  choice: legte sich zu seinen Vätern
  rationale: Die königliche Todesformel wird nahe am hebräischen Bild wiedergegeben. Sie bezeichnet Rehabeams Tod, ohne das formelhafte Verb einfach durch „starb“ zu ersetzen.
- source_word: וַיִּקָּבֵר עִם אֲבֹתָיו
  choice: wurde bei seinen Vätern begraben
  rationale: Die Passivform und die Wiederholung von „seinen Vätern“ bleiben erhalten; „bei“ bezeichnet hier die Bestattung zusammen mit den Vorfahren.
- source_word: בְּעִיר דָּוִד
  choice: in der Stadt Davids
  rationale: Natürliche deutsche Form des feststehenden Ortsnamens bei zugleich enger Entsprechung zum Hebräischen.
- source_word: וְשֵׁם אִמּוֹ נַעֲמָה
  choice: Seine Mutter hieß Naama
  rationale: Die hebräische Namensformel wird in gegenwärtigem, natürlichem Deutsch wiedergegeben.
- source_word: הָעַמֹּנִית
  choice: die Ammoniterin
  rationale: Das feminine Gentilizium bezeichnet Naama ausdrücklich als ammonitische Frau; „Ammoniterin“ gibt Geschlecht und Herkunft knapp und idiomatisch wieder.
- source_word: וַיִּמְלֹךְ
  choice: wurde König
  rationale: In der Thronfolgeformel bezeichnet das Verb hier den Herrschaftsantritt. „Wurde König“ klingt im Deutschen natürlicher als ein isoliertes „regierte“ und verbindet sich klar mit „an seiner Stelle“.
- source_word: אֲבִיָּם
  choice: Abijam
  rationale: Der masoretische Text dieses Verses bietet ausdrücklich die Namensform אֲבִיָּם; sie wird nicht an die anderswo vorkommende Form Abija angeglichen.
- source_word: תַּחְתָּיו
  choice: an seiner Stelle
  rationale: Die Wendung bezeichnet die Nachfolge im Königtum und wird formal wie idiomatisch angemessen wiedergegeben.
theological_decisions:
- issue: Bedeutung der königlichen Todesformel
  choice: Das hebräische Bild „legte sich zu seinen Vätern“ bleibt im Haupttext erhalten.
  alternative: „starb“
  rationale: Die Formel bezeichnet zwar den Tod, verbindet ihn aber sprachlich mit den Vorfahren. Die bildhafte und dynastische Spannung soll nicht durch eine rein erklärende Wiedergabe eingeebnet werden.
- issue: Namensform des Nachfolgers
  choice: Abijam
  alternative: Abija
  rationale: Obwohl derselbe König an anderen Stellen Abija heißt, wird die konkrete Lesart dieses Verses bewahrt, ohne die Namensformen stillschweigend zu harmonisieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die formelhafte Sprache des königlichen Todesberichts und die Wiederholung von „seinen Vätern“ bleiben bewusst erhalten; weniger natürliche Satzanfänge mit wiederholtem „Und“ wurden teilweise geglättet, ohne den Erzählablauf zu verändern.
