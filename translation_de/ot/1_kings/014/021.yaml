  text: וּ/רְחַבְעָם֙ בֶּן שְׁלֹמֹ֔ה מָלַ֖ךְ בִּֽ/יהוּדָ֑ה בֶּן אַרְבָּעִ֣ים וְ/אַחַ֣ת שָׁנָה֩ רְחַבְעָ֨ם בְּ/מָלְכ֜/וֹ וּֽ/שֲׁבַ֨ע עֶשְׂרֵ֥ה שָׁנָ֣ה מָלַ֣ךְ בִּ/ירוּשָׁלִַ֗ם הָ֠/עִיר אֲשֶׁר בָּחַ֨ר יְהוָ֜ה לָ/שׂ֨וּם אֶת שְׁמ֥/וֹ שָׁם֙ מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל וְ/שֵׁ֣ם אִמּ֔/וֹ נַעֲמָ֖ה הָ/עַמֹּנִֽית־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/021.yaml
  text: Rehoboam the son of Solomon reigned in Judah[a]. Rehoboam was forty-one years old when he became king, and he reigned seventeen years in Jerusalem, the city that Yahweh had chosen from all the tribes of Israel to put his name there[b]. And his mother’s name was Naamah the Ammonite woman.
translation:
  language: de
  text: Rehabeam, der Sohn Salomos, regierte in Juda.[a] Rehabeam war einundvierzig Jahre alt, als er König wurde, und regierte siebzehn Jahre in Jerusalem, der Stadt, die Jahwe aus allen Stämmen Israels erwählt hatte, um dort seinen Namen zu setzen.[b] Seine Mutter hieß Naama; sie war eine Ammoniterin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über Juda“.'
    reason: lexical_alternative
  - marker: b
    text: Die Wendung „seinen Namen dort setzen“ ist eine kultische Formel für den Ort, der in besonderer Weise mit Jahwes Gegenwart und Verehrung verbunden ist.
    reason: cultural_note
lexical_decisions:
- source_word: מָלַךְ
  choice: regierte
  rationale: Das Verb bezeichnet die Ausübung der Königsherrschaft; „regierte“ ist im modernen Deutschen natürlich und lässt sich an beiden Stellen verwenden.
- source_word: בִּיהוּדָה
  choice: in Juda
  rationale: Die Präposition ב wird räumlich mit „in“ wiedergegeben; im königlichen Zusammenhang ist auch „über Juda“ möglich.
- source_word: בְּמָלְכוֹ
  choice: als er König wurde
  rationale: Präposition plus Infinitivus constructus bezeichnet hier den Zeitpunkt des Herrschaftsantritts und unterscheidet diesen vom Zeitraum der Regierung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לָשׂוּם אֶת־שְׁמוֹ שָׁם
  choice: um dort seinen Namen wohnen zu lassen
  rationale: Die Formulierung gibt die kultisch-bundestheologische Bedeutung der hebräischen Wendung in verständlichem Deutsch wieder; die wörtlichere Alternative wird in der Fußnote genannt.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: aus allen Stämmen Israels
  rationale: מִן bezeichnet die Auswahl aus der Gesamtheit der israelitischen Stämme.
- source_word: וְשֵׁם אִמּוֹ
  choice: Seine Mutter hieß
  rationale: Dies ist eine natürliche moderne Wiedergabe der wiederkehrenden Namensformel.
- source_word: הָעַמֹּנִית
  choice: sie war eine Ammoniterin
  rationale: Das feminine Gentiliz bezeichnet Naamas ethnische Herkunft; die eigenständige Aussage ist im Deutschen klar und idiomatisch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Eigennamen, ohne ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Bedeutung der Namensformel לָשׂוּם אֶת־שְׁמוֹ שָׁם
  choice: um dort seinen Namen wohnen zu lassen
  alternative: um dort seinen Namen hinzusetzen
  rationale: Die gewählte Fassung vermittelt die besondere Verbindung Jerusalems mit Jahwes Gegenwart und Verehrung, ohne eine leibliche Begrenzung Gottes auf den Ort zu behaupten; die formale Bedeutung bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers folgt der hebräischen Abfolge, vermeidet jedoch schwerfällige Nominalformulierungen. „Jahwe“ steht für das Tetragramm; die kultische Namensformel wird verständlich wiedergegeben und zugleich wörtlich erläutert.
