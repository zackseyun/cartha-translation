  to: Und ich riss das Königreich vom Haus Davids[a] los und gab es dir. Doch du bist nicht wie mein Diener David gewesen, der meine Gebote hielt und mir von ganzem Herzen folgte[b], um nur zu tun, was in meinen Augen recht war.
