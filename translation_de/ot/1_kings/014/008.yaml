source:
  edition: WLC
  text: וָ/אֶקְרַ֤ע אֶת הַ/מַּמְלָכָה֙ מִ/בֵּ֣ית דָּוִ֔ד וָ/אֶתְּנֶ֖/הָ לָ֑/ךְ וְ/לֹֽא הָיִ֜יתָ כְּ/עַבְדִּ֣/י דָוִ֗ד אֲשֶׁר֩ שָׁמַ֨ר מִצְוֺתַ֜/י וַ/אֲשֶׁר הָלַ֤ךְ אַחֲרַ/י֙ בְּ/כָל לְבָב֔/וֹ לַ/עֲשׂ֕וֹת רַ֖ק הַ/יָּשָׁ֥ר בְּ/עֵינָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/008.yaml
  text: and I tore the kingdom away from the house of David and gave it to you[a]. But you have not been like my servant David, who kept my commandments and who walked after me with all his heart[b], to do only what was right in my eyes.
translation:
  language: de
  text: Und ich riss das Königreich vom Haus Davids[a] los und gab es dir. Doch du bist nicht wie mein Diener David gewesen, der meine Gebote hielt und mir von ganzem Herzen folgte[b], um nur zu tun, was in meinen Augen recht war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Haus Davids“ bezeichnet hier Davids Königshaus, also seine Dynastie.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: „hinter mir herging“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקְרַע
  choice: ich riss … los
  rationale: קָרַע bezeichnet wörtlich ein Zerreißen. In Verbindung mit מִן gibt „vom Haus Davids losreißen“ die gewaltsame Wegnahme des Königreichs bildhaft und zugleich natürlich wieder.
- source_word: הַמַּמְלָכָה
  choice: das Königreich
  rationale: מַמְלָכָה bezeichnet hier das politische Herrschaftsgebiet beziehungsweise Reich; „Königreich“ ist im Kontext die klare und übliche Wiedergabe.
- source_word: מִבֵּית דָּוִד
  choice: vom Haus Davids
  rationale: Die hebräische Wendung „Haus Davids“ wird beibehalten; sie bezeichnet in diesem Zusammenhang Davids Königshaus beziehungsweise Dynastie.
- source_word: וָאֶתְּנֶהָ לָךְ
  choice: und gab es dir
  rationale: Die Erzählform beschreibt eine abgeschlossene Handlung in der Vergangenheit; das Pronomen bezieht sich auf das Königreich.
- source_word: וְלֹא הָיִיתָ כְּעַבְדִּי דָוִד
  choice: Doch du warst nicht wie mein Diener David
  rationale: Das Perfekt wird im historischen Rückblick natürlich mit dem Präteritum wiedergegeben. עֶבֶד ist hier die ehrende Bezeichnung für einen im Dienst Gottes stehenden König, daher „Diener“ statt „Sklave“.
- source_word: שָׁמַר מִצְוֺתַי
  choice: meine Gebote hielt
  rationale: שׁמר bedeutet bei Geboten „halten“ oder „befolgen“; „Gebote halten“ bewahrt die vertraute Sprache des Bundesgehorsams.
- source_word: הָלַךְ אַחֲרַי
  choice: mir … folgte
  rationale: Die wörtliche Wendung lautet „hinter mir herging“. „Mir folgte“ gibt das hebräische Bild in natürlichem, heutigem Deutsch wieder; die wörtliche Ausdrucksweise wird in einer Fußnote vermerkt.
- source_word: בְּכָל לְבָבוֹ
  choice: von ganzem Herzen
  rationale: Die deutsche Wendung bezeichnet wie das Hebräische ungeteilte innere Hingabe und klingt zugleich natürlich.
- source_word: לַעֲשׂוֹת רַק הַיָּשָׁר בְּעֵינָי
  choice: um nur zu tun, was in meinen Augen recht war
  rationale: Die Infinitivkonstruktion wird mit „um … zu tun“ abgebildet, רַק ausdrücklich mit „nur“ und die anschauliche Bewertungsformel „in meinen Augen“ beibehalten.
theological_decisions:
- issue: David als Vorbild trotz seiner an anderer Stelle berichteten Sünden
  choice: Die uneingeschränkt formulierte Bewertung dieses Verses bleibt stehen.
  alternative: Eine abschwächende Ergänzung wie „im Großen und Ganzen“ oder „meistens“ einfügen.
  rationale: Der Vers stellt Davids Gehorsam ohne Einschränkung dem Verhalten Jerobeams gegenüber. Andere biblische Aussagen über Davids Sünde dürfen diese konkrete rhetorische Aussage nicht durch nicht vorhandene Zusätze harmonisieren.
- issue: Bedeutung des Nachfolgens
  choice: „mir folgen“ als Ausdruck treuer Ausrichtung auf Gott
  alternative: „hinter mir hergehen“ als streng wörtliche Wiedergabe
  rationale: Die hebräische Wegmetapher wird in verständlichem Deutsch wiedergegeben, ohne sie konfessionell oder lehrmäßig weiter auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kräftige Metapher des Losreißens und die hebräische Formel „in meinen Augen“ bleiben erhalten; eine schwerfällige wörtliche Wiedergabe von „hinter mir gehen“ wird zugunsten des natürlichen „folgen“ in die Fußnote verlegt.
