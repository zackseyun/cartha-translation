  source_fidelity: 'Der deutsche Text gibt die hebräische Satzfolge und die wesentlichen Aussagen zuverlässig wieder: Ahijas Hören der Schritte, ihr Eintreten am Eingang, die direkte Anrede als Jerobeams Frau, die Frage nach ihrer Verstellung sowie die elliptische Aussage über eine harte Botschaft. Der nicht genannte Sender bleibt zutreffend ungenannt. Die Ergänzung „Botschaft“ ist im Deutschen erforderlich und wird durch die Fußnote angemessen als Ergänzung kenntlich gemacht.'
  naturalness: Modernes Standarddeutsch, flüssig und dem erzählerisch-prophetischen Register angemessen. „Das Geräusch ihrer Schritte“, „Komm herein“ und „Warum gibst du dich als eine andere aus?“ sind idiomatisch. „Frau Jerobeams“ ist als direkte Anrede verständlich und stilistisch passend.
  terminology: Die Eigennamen Ahija und Jerobeam sind konsistent. „Gesandt“ bewahrt die passive, auftragsbezogene Formulierung ohne den Sender dogmatisch zu bestimmen. „Harte Botschaft“ hält die Kürze und Schwere von קָשָׁה aufrecht, ohne die Aussage zu eng als Gerichtswort zu deuten.
