base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/006.yaml
  text: And when Ahijah heard the sound of her feet as she came in at the doorway[a], he said, “Come in, wife of Jeroboam[b]. Why are you disguising yourself? For I am sent to you with a hard message.”
translation:
  language: de
  text: 'Als Ahija das Geräusch ihrer Schritte hörte, während sie durch den Eingang hereinkam, sagte er: »Komm herein, Frau Jerobeams! Warum gibst du dich als eine andere aus?[a] Ich bin mit einer harten Botschaft zu dir gesandt.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Warum machst du dich unkenntlich?«'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Ich bin zu dir gesandt – Hartes.« Das Hebräische lässt das Bezugswort unausgesprochen; gemeint ist vermutlich eine harte Botschaft oder schwere Nachricht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל רַגְלֶיהָ
  choice: das Geräusch ihrer Schritte
  rationale: Die Wendung gibt das hebräische Bild genau und zugleich in natürlichem modernem Deutsch wieder.
- source_word: בָּאָה בַפֶּתַח
  choice: während sie durch den Eingang hereinkam
  rationale: Der Eingang bzw. die Türöffnung ist gemeint; die Formulierung stellt ihr Eintreten als gleichzeitig mit dem Hören dar.
- source_word: בֹּאִי
  choice: Komm herein
  rationale: Der feminine Imperativ wird im Deutschen idiomatisch und der Szene angemessen wiedergegeben.
- source_word: אֵשֶׁת יָרָבְעָם
  choice: Frau Jerobeams
  rationale: Die deutsche Genitivkonstruktion bewahrt die direkte Anrede und klingt würdig und natürlich.
- source_word: לָמָּה זֶּה אַתְּ מִתְנַכֵּרָה
  choice: Warum gibst du dich als eine andere aus?
  rationale: Das Hitpael von נכר bezeichnet hier das Annehmen einer fremden Identität bzw. das Sich-unkenntlich-Machen; diese Wiedergabe wahrt die konkrete Bildhaftigkeit.
- source_word: שָׁלוּחַ אֵלַיִךְ
  choice: Ich bin … zu dir gesandt
  rationale: Das passive Partizip bezeichnet Ahijas gegenwärtigen Zustand als Gesandter und lässt den nicht ausdrücklich genannten Sender unbestimmt.
- source_word: קָשָׁה
  choice: mit einer harten Botschaft
  rationale: Das feminine Adjektiv steht elliptisch. „Botschaft“ ergänzt den im prophetischen Zusammenhang naheliegenden, aber im Hebräischen unausgesprochenen Sinn; „hart“ bewahrt die knappe Ausdrucksweise.
theological_decisions:
- issue: Unausgesprochenes Bezugswort zu קָשָׁה
  choice: mit einer harten Botschaft
  alternative: mit schwerer Nachricht; zu etwas Hartem
  rationale: Der hebräische Text nennt kein Substantiv. „Botschaft“ macht den wahrscheinlich gemeinten prophetischen Bescheid verständlich, ohne ihn enger als „Orakel“ oder ausdrücklich als göttliches Gericht festzulegen.
- issue: Nicht genannter Sender bei שָׁלוּחַ
  choice: Passivform ohne ausdrückliche Nennung Gottes
  alternative: Gott hat mich zu dir gesandt
  rationale: Obwohl der Erzählzusammenhang einen göttlichen Auftrag nahelegt, nennt dieser Satz den Sender nicht; die Übersetzung bewahrt diese Zurückhaltung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp und eindringlich; keine konfessionell geprägte Terminologie wurde ergänzt.
