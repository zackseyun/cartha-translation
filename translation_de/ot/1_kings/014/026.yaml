source:
  edition: WLC
  text: וַ/יִּקַּ֞ח אֶת אֹצְר֣וֹת בֵּית יְהוָ֗ה וְ/אֶת אֽוֹצְרוֹת֙ בֵּ֣ית הַ/מֶּ֔לֶךְ וְ/אֶת הַ/כֹּ֖ל לָקָ֑ח וַ/יִּקַּח֙ אֶת כָּל מָגִנֵּ֣י הַ/זָּהָ֔ב אֲשֶׁ֥ר עָשָׂ֖ה שְׁלֹמֹֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/026.yaml
  text: He took the treasures of the house of Yahweh and the treasures of the king’s house; he took everything[a]. He also took all the gold shields that Solomon had made.
translation:
  language: de
  text: Er nahm die Schätze des Hauses Jahwes[a] und die Schätze des Königspalasts; er nahm alles. Er nahm auch alle goldenen Schilde, die Salomo gemacht hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das »Haus Jahwes« bezeichnet den Tempel.
    reason: Erläuterung der hebräischen Bezeichnung
lexical_decisions:
- source_word: וַיִּקַּח / לָקָח
  choice: nahm … mit
  rationale: Das wiederholte לקח bedeutet grundsätzlich »nehmen«. Im Zusammenhang einer Plünderung gibt »mitnehmen« den Vorgang im Deutschen natürlich wieder, ohne die stärkere Nuance von »rauben« oder »beschlagnahmen« ausdrücklich hinzuzufügen.
- source_word: אֹצְרוֹת
  choice: Schätze
  rationale: Das Wort kann auch Schatzkammern oder Vorratsräume bezeichnen; da hier das Genommene gemeint ist, passt »Schätze« am besten.
- source_word: בֵּית יְהוָה
  choice: Haus Jahwes
  rationale: Die wörtliche Wendung »Haus Jahwes« bleibt erhalten; gemeint ist der Tempel.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in seiner im Deutschen geläufigen Form »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בֵּית הַמֶּלֶךְ
  choice: Königspalast
  rationale: Wörtlich steht »Haus des Königs«. »Königspalast« bezeichnet im heutigen Deutsch eindeutig und natürlich die hier gemeinte königliche Residenz.
- source_word: וְאֶת הַכֹּל לָקָח
  choice: alles nahm er mit
  rationale: Die eigene, zusammenfassende Klausel bewahrt die nachdrückliche Aussage, dass nichts verschont blieb.
- source_word: מָגִנֵּי הַזָּהָב
  choice: goldene Schilde
  rationale: Dies ist die natürliche deutsche Wiedergabe der hebräischen Konstruktverbindung »Schilde aus Gold«.
- source_word: אֲשֶׁר עָשָׂה שְׁלֹמֹה
  choice: die Salomo angefertigt hatte
  rationale: Das Plusquamperfekt macht deutlich, dass Salomo die Schilde bereits vor den erzählten Ereignissen hatte herstellen lassen beziehungsweise angefertigt hatte.
- source_word: וַיִּקַּח ... וַיִּקַּח
  choice: nahm … mit … nahm er mit
  rationale: Die Wiederholung des Verbs wird beibehalten, damit der nachdrückliche Erzählrhythmus des Hebräischen hörbar bleibt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im Ausgangstext steht der Eigenname Gottes. »Jahwe« bewahrt ihn als Namen, während »der HERR« ihn durch einen Titel ersetzen würde.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wortstellung »alles nahm er mit« bewahrt die Hervorhebung des hebräischen Summarsatzes; »Königspalast« vermeidet das im Deutschen missverständliche »Königshaus«.
