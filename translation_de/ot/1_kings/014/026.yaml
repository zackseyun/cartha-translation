revisions:
- from: Er nahm die Schätze aus dem Haus Jahwes[a] und die Schätze aus dem Königspalast; alles nahm er mit. Auch alle goldenen Schilde, die Salomo angefertigt hatte, nahm er mit.
  to: Er nahm die Schätze des Hauses Jahwes[a] und die Schätze des Königspalasts; er nahm alles. Er nahm auch alle goldenen Schilde, die Salomo gemacht hatte.
  rationale: Die Revision stellt die possessive hebräische Konstruktion bei beiden Schatzbeständen unmittelbar dar, bewahrt die Verbwiederholung ohne zusätzliche Bewegungsnuance und formuliert die Tempelerklärung der Fußnote nicht redundant. Der zusammenfassende Satz und die anschließende Nennung der goldenen Schilde bleiben wie im Ausgangstext getrennt.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T11:54:31Z'
review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt die Gegenstände, die wiederholte Aussage des Nehmens, die Totalität von הַכֹּל und den Bezug der Schilde auf Salomo grundsätzlich zutreffend wieder. »aus dem Haus« verschiebt jedoch die possessive Verbindung »Schätze des Hauses« unnötig in eine Herkunftsangabe; die direkte Genitivverbindung ist näher am Hebräischen.
  naturalness: »Er nahm alles« und »Er nahm auch alle …« sind modernes, klares Standarddeutsch. Die bisherige doppelte Formulierung »nahm … mit« ist nicht falsch, fügt aber eine im Hebräischen nicht ausdrücklich bezeichnete Fortbewegungsnuance hinzu und klingt im zweiten Satz etwas schwerfällig.
  terminology: »Jahwe«, »Königspalast« und »goldene Schilde« sind angemessen. »gemacht hatte« gibt עָשָׂה ohne die mögliche Zusatznuance von handwerklichem »angefertigt« wieder.
