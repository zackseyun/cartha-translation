    issue: Possessive Konstruktion bei den Schätzen
    rationale: אֹצְרוֹת בֵּית ... bedeutet unmittelbar »die Schätze des Hauses ...«. »Schätze aus dem Haus« ist kontextuell möglich, aber weniger formnah und semantisch enger als eine reine Zugehörigkeitsangabe.
  - severity: low
    issue: Zusatznuance durch »mitnehmen«
    rationale: לקח bedeutet hier »nehmen«. »mitnehmen« ist im Plünderungskontext plausibel, bezeichnet aber stärker das Wegführen; »nehmen« wahrt die neutrale Wiederholung des hebräischen Verbs.
  - severity: low
    issue: Fußnote erläutert die Bezeichnung nicht optimal
    rationale: 'Da der Text bereits »Haus Jahwes« bietet, ist »Wörtlich: Haus Jahwes« redundant. Die Anmerkung sollte knapp erklären, dass damit der Tempel gemeint ist.'
  revised_text: Er nahm die Schätze des Hauses Jahwes[a] und die Schätze des Königspalasts; er nahm alles. Er nahm auch alle goldenen Schilde, die Salomo gemacht hatte.
