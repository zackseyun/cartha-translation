base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/022.yaml
  text: And Judah did what was evil in the eyes of Yahweh[a], and they provoked him to jealousy more than all that their fathers had done, by the sins that they committed.
translation:
  language: de
  text: Juda tat, was in den Augen Jahwes böse war, und sie reizten ihn durch die Sünden, die sie begingen, stärker zur Eifersucht als durch alles, was ihre Vorfahren getan hatten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »machten ihn eifersüchtig« oder »weckten seine Eifersucht«. Das Hebräische gebraucht hier die Sprache der Bundeseifersucht für Jahwes Reaktion auf die Untreue Judas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוּדָה
  choice: Juda
  rationale: Der Eigenname bezeichnet hier kollektiv das Südreich beziehungsweise dessen Bevölkerung; deshalb folgt im Hebräischen anschließend ein Verb im Plural.
- source_word: הָרַע
  choice: was … böse war
  rationale: Die feste Verbindung עשה + הרע wird im Deutschen natürlich als »tun, was böse war« wiedergegeben.
- source_word: בְּעֵינֵי יְהוָה
  choice: in den Augen Jahwes
  rationale: Die hebräische Metapher für Jahwes Beurteilung bleibt erhalten und ist im Deutschen verständlich.
- source_word: וַיְקַנְאוּ אֹתוֹ
  choice: sie reizten ihn … zur Eifersucht
  rationale: Die Form von קנא bezeichnet hier das Hervorrufen göttlicher Eifersucht als Reaktion auf die Untreue Judas; »zur Eifersucht reizen« bewahrt diese Bundesvorstellung.
- source_word: מִכֹּל אֲשֶׁר עָשׂוּ אֲבֹתָם
  choice: stärker … als ihre Vorfahren mit allem, was diese getan hatten
  rationale: Die vergleichende Konstruktion wird in natürliches Deutsch übertragen; אבות bezeichnet hier frühere Generationen beziehungsweise Vorfahren.
- source_word: בְּחַטֹּאתָם אֲשֶׁר חָטָאוּ
  choice: mit den Sünden, die sie begingen
  rationale: Die hebräische Verbindung aus stammverwandtem Substantiv und Verb wird verständlich wiedergegeben, während die instrumentale Bedeutung von בְּ durch »mit« erhalten bleibt.
theological_decisions:
- issue: Göttliche Eifersucht
  choice: reizten sie ihn … zur Eifersucht
  alternative: machten sie ihn eifersüchtig; weckten sie seine Eifersucht
  rationale: Die Formulierung bewahrt die biblische Bundesvorstellung von Jahwes Eifersucht angesichts der Untreue seines Volkes, ohne sie zu bloßem Zorn umzudeuten oder mit sündhaftem Neid gleichzusetzen.
- issue: Der Gottesname יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als »Jahwe« wiedergegeben, sodass die persönliche Benennung Gottes im Ausgangstext sichtbar bleibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Wechsel vom kollektiv gebrauchten Singular »Juda« zum Plural »sie« wird wie im Hebräischen bewahrt. Die Satzstellung wurde leicht geglättet, ohne die vergleichende Aussage oder die theologische Spannung der Eifersuchtsmetaphorik aufzulösen.
