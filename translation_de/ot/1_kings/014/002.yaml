source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יָרָבְעָ֜ם לְ/אִשְׁתּ֗/וֹ ק֤וּמִי נָא֙ וְ/הִשְׁתַּנִּ֔ית וְ/לֹ֣א יֵֽדְע֔וּ כִּי אתי אֵ֣שֶׁת יָרָבְעָ֑ם וְ/הָלַ֣כְתְּ שִׁלֹ֗ה הִנֵּה שָׁם֙ אֲחִיָּ֣ה הַ/נָּבִ֔יא הֽוּא דִבֶּ֥ר עָלַ֛/י לְ/מֶ֖לֶךְ עַל הָ/עָ֥ם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/002.yaml
  text: Jeroboam said to his wife[a], “Please get up and disguise yourself, so that they will not know that you are the wife of Jeroboam, and go to Shiloh. Behold, Ahijah the prophet is there; he is the one who spoke concerning me[b], that I would be king over this people.”
translation:
  language: de
  text: 'Jerobeam sagte zu seiner Frau: „Steh bitte auf und verkleide dich, damit man nicht erkennt, dass du Jerobeams Frau bist. Dann geh nach Schilo. Sieh, dort ist Ahija, der Prophet. Er ist es, der über mich gesagt hat, dass ich König über dieses Volk werden würde.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קוּמִי נָא
  choice: Steh bitte auf
  rationale: Der Imperativ mit נָא verbindet Aufforderung und höfliche Bitte; die Formulierung ist modern und wahrt beides.
- source_word: וְהִשְׁתַּנִּית
  choice: verkleide dich
  rationale: Der Hitpael von שנה bezeichnet hier eine Veränderung des Erscheinungsbildes, um nicht erkannt zu werden.
- source_word: וְלֹא יֵדְעוּ
  choice: damit man nicht erkennt
  rationale: Die unbestimmte dritte Person Plural wird im Deutschen natürlich durch das unpersönliche „man“ wiedergegeben; der Zusammenhang legt Zweck beziehungsweise Folge nahe.
- source_word: וְהָלַכְתְּ שִׁלֹה
  choice: Dann geh nach Schilo
  rationale: Die auf den Imperativ folgende Verbform setzt die Anweisung fort; „dann“ macht die Abfolge im Deutschen natürlich deutlich.
- source_word: הִנֵּה שָׁם
  choice: Dort ist
  rationale: Die deiktische Hervorhebung wird in modernem Deutsch ohne das altertümlich wirkende „siehe“ knapp und verständlich ausgedrückt.
- source_word: הוּא דִבֶּר
  choice: Er ist es, der ... gesagt hat
  rationale: Die selbstständige Pronominalform הוּא hebt Ahija hervor; die deutsche Spaltsatzkonstruktion bewahrt diesen Nachdruck.
- source_word: עָלַי לְמֶלֶךְ
  choice: über mich gesagt hat, dass ich König über dieses Volk werden sollte
  rationale: עָלַי wird als Bezug der prophetischen Aussage verstanden; לְמֶלֶךְ bezeichnet das Königsamt beziehungsweise das Königwerden. Die Formulierung wahrt zugleich die syntaktische Spannung des knappen Hebräisch.
theological_decisions:
- issue: Bezug und Funktion von עָלַי לְמֶלֶךְ
  choice: „über mich gesagt hat, dass ich König über dieses Volk werden sollte“
  alternative: „der zu mir davon gesprochen hat, König über dieses Volk zu werden“
  rationale: Mit דבר kann עַל „über/betreffs“ bedeuten. Diese Deutung passt zum Rückverweis auf Ahijas prophetische Ankündigung, ohne über den Text hinaus eine spezifische theologische Nuance festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Steh bitte auf“ und „Dort ist“ vermeiden unnötig altertümliche Ausdrucksweisen; Eigennamen folgen den im Deutschen üblichen biblischen Formen.
