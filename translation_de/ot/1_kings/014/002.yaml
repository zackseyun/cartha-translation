  to: 'Jerobeam sagte zu seiner Frau: „Steh bitte auf und verkleide dich, damit man nicht erkennt, dass du Jerobeams Frau bist. Dann geh nach Schilo. Sieh, dort ist Ahija, der Prophet. Er ist es, der über mich gesagt hat, dass ich König über dieses Volk werden würde.“'
  rationale: Die Revision beseitigt die nicht gedeckte Sollensnuance und gibt die Ankündigung von Jerobeams Königtum idiomatisch wieder. Die entbehrliche und unpräzise Fußnote wird entfernt; die knappe hebräische Konstruktion wird im deutschen Satz ohne unzulässige dogmatische oder interpretative Ergänzung wiedergegeben.
