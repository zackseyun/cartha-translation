source:
  edition: WLC
  text: לְמַ֨עַן֙ יִֽרָא֔וּ/ךָ כָּל הַ֨/יָּמִ֔ים אֲשֶׁר הֵ֥ם חַיִּ֖ים עַל פְּנֵ֣י הָ/אֲדָמָ֑ה אֲשֶׁ֥ר נָתַ֖תָּה לַ/אֲבֹתֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/040.yaml
  text: so that they may fear you all the days that they live on the face of the land that you gave to our fathers[a][b][c].
translation:
  language: de
  text: damit sie dich fürchten, solange sie auf dem Land leben, das du unseren Vätern gegeben hast.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »solange sie auf der Erde leben«. Wörtlich: »alle Tage, die sie leben, auf dem Angesicht des Landes/der Erde«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »unseren Vorfahren«. Hebräisch: »unseren Vätern«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: damit
  rationale: Leitet den Zweck beziehungsweise das beabsichtigte Ergebnis ein und gibt die hebräische Konstruktion natürlich wieder.
- source_word: יִרָאוּךָ
  choice: sie dich fürchten
  rationale: Bewahrt das theologisch gewichtige Motiv der Gottesfurcht; »verehren« wäre möglich, würde den Bedeutungsumfang jedoch abschwächen.
- source_word: כָּל הַיָּמִים אֲשֶׁר הֵם חַיִּים
  choice: solange sie … leben
  rationale: Gibt die zeitliche Gesamtdauer idiomatisch und präzise wieder; wörtlicher wäre »alle Tage, die sie leben«.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: auf dem Land
  rationale: אֲדָמָה kann Erde, Boden oder Land bezeichnen. Der folgende Relativsatz über das den Vätern gegebene Gebiet legt hier »Land« nahe; die hebräische Wendung »auf dem Angesicht« wird im Deutschen nicht mechanisch nachgebildet.
- source_word: אֲשֶׁר נָתַתָּה
  choice: das du … gegeben hast
  rationale: Das Perfekt entspricht im Deutschen natürlich der vergangenen Schenkung mit fortdauernder Bedeutung.
- source_word: לַאֲבֹתֵינוּ
  choice: unseren Vätern
  rationale: Entspricht der ausdrücklichen hebräischen Formulierung und bewahrt die biblische Bundesrede; »unseren Vorfahren« ist eine mögliche inklusive Wiedergabe.
theological_decisions:
- issue: Bedeutung von ירא gegenüber Gott
  choice: fürchten
  alternative: verehren; Ehrfurcht vor dir haben
  rationale: »Fürchten« erhält die Spannung des biblischen Begriffs zwischen Furcht, Ehrfurcht und gehorsamer Gottesbeziehung, ohne ihn auf bloße Verehrung zu verengen.
- issue: Bezugsbereich von הָאֲדָמָה
  choice: das Land
  alternative: die Erde
  rationale: Der unmittelbar folgende Hinweis auf das den Vätern gegebene Gebiet spricht für das verheißene Land, obwohl das Wort grundsätzlich auch weiter als »Erde« verstanden werden kann.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kompakte Formulierung »solange sie … leben« vermeidet ein im Deutschen schwerfälliges Nachbilden der hebräischen Zeitangabe; Gottesfurcht und die mögliche Mehrdeutigkeit von אֲדָמָה bleiben erhalten.
