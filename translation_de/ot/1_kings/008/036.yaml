  text: וְ/אַתָּ֣ה תִּשְׁמַ֣ע הַ/שָּׁמַ֗יִם וְ/סָ֨לַחְתָּ֜ לְ/חַטַּ֤את עֲבָדֶ֨י/ךָ֙ וְ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל כִּ֥י תוֹרֵ֛/ם אֶת הַ/דֶּ֥רֶךְ הַ/טּוֹבָ֖ה אֲשֶׁ֣ר יֵֽלְכוּ בָ֑/הּ וְ/נָתַתָּ֤ה מָטָר֙ עַל אַרְצְ/ךָ֔ אֲשֶׁר נָתַ֥תָּה לְ/עַמְּ/ךָ֖ לְ/נַחֲלָֽה׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/036.yaml
  text: then may you hear in heaven and forgive the sin of your servants[a], your people Israel, when you teach them the good way in which they should walk. And may you give rain on your land[b], which you have given to your people as an inheritance.
translation:
  language: de
  text: Dann höre du im Himmel[a] und vergib die Sünde deiner Diener und deines Volkes Israel, wenn du sie den guten Weg lehrst, auf dem sie gehen sollen.[b] Und gib Regen auf dein Land, das du deinem Volk als Erbbesitz gegeben hast.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vom Himmel her“. Wörtlich steht im Hebräischen „höre den Himmel/die Himmel“; die für das Deutsche nötige Präposition ist nicht ausdrücklich genannt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „denn du lehrst sie den guten Weg, auf dem sie gehen sollen“. Das hebräische Bindewort kann hier zeitlich („wenn“) oder begründend („denn/weil“) verstanden werden.'
    reason: source_ambiguity
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  choice: höre du im Himmel
  rationale: Die hebräische Wendung steht ohne ausdrückliche Präposition. „Im Himmel“ ergibt im Deutschen eine natürliche Gebetsformulierung und wahrt den Himmel als Ort des göttlichen Hörens; „vom Himmel her“ bleibt als mögliche Deutung in der Fußnote erhalten.
- source_word: וְסָלַחְתָּ לְחַטַּאת
  choice: und vergib die Sünde
  rationale: חַטָּאת bezeichnet hier das schuldhafte Handeln, für das Vergebung erbeten wird, nicht ein Sündopfer.
- source_word: עֲבָדֶיךָ
  choice: deiner Diener
  rationale: עֶבֶד kann Sklave oder Diener bedeuten. Im Gebets- und Bundeszusammenhang ist „Diener“ die angemessene, nicht unnötig verengende Wiedergabe.
- source_word: וְעַמְּךָ יִשְׂרָאֵל
  choice: deines Volkes Israel
  rationale: Die Apposition bestimmt die Diener näher als Gottes Volk Israel. Die deutsche Genitivfügung ist klar und bewahrt diese Identifikation.
- source_word: כִּי תוֹרֵם
  choice: wenn du sie … lehrst
  rationale: כִּי ist mehrdeutig und kann unter anderem zeitlich oder begründend verstanden werden. Hier fügt sich die zeitliche Wiedergabe gut in die Folge der Bitten; die mögliche begründende Lesart wird in der Fußnote genannt. Der Hifil von ירה bedeutet „lehren, unterweisen“.
- source_word: הַדֶּרֶךְ הַטּוֹבָה אֲשֶׁר יֵלְכוּ בָהּ
  choice: den guten Weg …, auf dem sie gehen sollen
  rationale: Die Wegmetapher für die Lebensführung wird erhalten. „Sollen“ bringt die im Kontext vorausgesetzte verbindliche Ausrichtung zum Ausdruck, ohne die Metapher aufzulösen.
- source_word: וְנָתַתָּה מָטָר
  choice: Und gib Regen
  rationale: Die direkte Bitte gibt נתן präzise und natürlich wieder. Der deutsche Imperativ entspricht dem bittenden Sinn der hebräischen Gebetsform.
- source_word: עַל אַרְצְךָ
  choice: auf dein Land
  rationale: Das Suffix bezeichnet das Land ausdrücklich als Gottes Land; dieser Gedanke wird nicht durch die allgemeinere Formulierung „auf das Land“ abgeschwächt.
- source_word: אֲשֶׁר נָתַתָּה לְעַמְּךָ לְנַחֲלָה
  choice: das du deinem Volk als Erbbesitz gegeben hast
  rationale: נַחֲלָה bezeichnet den bleibenden, zugeteilten Erbbesitz. „Erbbesitz“ ist im Deutschen präziser als bloßes „Erbe“, weil hier das Land selbst gemeint ist.
theological_decisions:
- issue: Gottes Eigentum am Land und Israels empfangener Erbbesitz
  choice: dein Land, das du deinem Volk als Erbbesitz gegeben hast
  alternative: das Land, das du deinem Volk zum Erbe gegeben hast
  rationale: Der hebräische Text nennt das Land zugleich Gottes Land und eine Gabe an Israel. Die gewählte Fassung erhält diese Spannung zwischen fortbestehendem göttlichem Eigentum und dem Israel gewährten Erbbesitz.
- issue: Zusammenhang von Vergebung und göttlicher Unterweisung
  choice: wenn du sie den guten Weg lehrst
  alternative: denn du lehrst sie den guten Weg
  rationale: כִּי lässt sowohl eine zeitlich-begleitende als auch eine begründende Beziehung zu. Der Haupttext wählt die im Gebetsablauf gut passende zeitliche Lesart; die Alternative wird offengelegt, damit die theologische Beziehung nicht stillschweigend festgelegt wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter biblischer Wegmetapher. „Diener“ ist im Gebetskontext allgemein verständlich; „Erbbesitz“ hält den land- und bundesbezogenen Sinn präzise fest. Die Satzstruktur folgt dem hebräischen Gebetsgang, ohne im Deutschen gekünstelt zu wirken.
