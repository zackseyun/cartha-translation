  text: אָ֖ז אָמַ֣ר שְׁלֹמֹ֑ה יְהוָ֣ה אָמַ֔ר לִ/שְׁכֹּ֖ן בָּ/עֲרָפֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/012.yaml
  text: Then Solomon said[a], “Yahweh said that he would dwell in the thick darkness.”
translation:
  language: de
  text: 'Da sagte Salomo: „Jahwe hat gesagt, er wolle im dichten Dunkel wohnen.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in der dunklen Wolke“. Das hebräische Wort עֲרָפֶל kann dichtes Dunkel oder eine dunkle Wolke bezeichnen, besonders in Beschreibungen der Gegenwart Jahwes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Da
  rationale: Als temporaler Erzählmarker führt אָז Salomos Aussage ein. „Da“ gibt die zeitliche Abfolge im modernen deutschen Erzählstil natürlich wieder.
- source_word: אָמַר
  choice: sagte / hat gesagt
  rationale: אמר bezeichnet gewöhnlich das Sagen. Im Erzählsatz steht das Präteritum „sagte“, während im Zitat das Perfekt „hat gesagt“ die vorausgehende Äußerung Jahwes idiomatisch wiedergibt.
- source_word: שְׁלֹמֹה
  choice: Salomo
  rationale: Gebräuchliche deutsche Namensform.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לִשְׁכֹּן
  choice: er wolle … wohnen
  rationale: Der Infinitiv mit ל nach אָמַר gibt den Inhalt der göttlichen Aussage wieder. Der Konjunktiv I markiert im Deutschen die indirekte Rede, ohne zusätzliche Gewissheits- oder Absichtsnuancen einzutragen.
- source_word: בָּעֲרָפֶל
  choice: im dichten Dunkel
  rationale: עֲרָפֶל bezeichnet dichtes Dunkel oder eine dunkle Wolke, besonders im Zusammenhang mit der erfahrbaren Gegenwart Gottes. „Dichtes Dunkel“ bewahrt das Bild der verhüllten Gegenwart.
theological_decisions:
- issue: Jahwes Wohnen im עֲרָפֶל
  choice: Jahwe hat gesagt, er wolle im dichten Dunkel wohnen
  alternative: Jahwe hat gesagt, er wolle in der dunklen Wolke wohnen
  rationale: „Dichtes Dunkel“ bewahrt die Spannung zwischen Gottes Gegenwart und ihrer Verborgenheit, ohne das Bild ausschließlich meteorologisch als Wolke festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Konjunktiv I gibt die indirekte Rede natürlich wieder; „wohnen“ bleibt bewusst schlicht und konkret. Der Fußnotenmarker steht unmittelbar nach dem Satz, auf den sich die Bedeutungsalternative bezieht.
