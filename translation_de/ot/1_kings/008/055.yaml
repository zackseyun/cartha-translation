  yaml_path: translation/ot/1_kings/008/055.yaml
  text: 'And he stood and blessed all the assembly of Israel with a loud voice[b][a], saying:'
translation:
  language: de
  text: 'Da stand er auf und segnete die ganze Versammlung Israels mit lauter Stimme und sprach:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעְמֹד
  choice: Dann trat er hin
  rationale: Das wayyiqtol führt die nächste Handlung der Erzählung ein. עמד bedeutet hier, dass Salomo sich zum öffentlichen Reden hinstellt; „trat er hin“ ist im Deutschen natürlich und würdevoll.
- source_word: וַיְבָרֶךְ
  choice: und segnete
  rationale: ברך bezeichnet hier das Aussprechen eines Segens über die versammelte Gemeinschaft. „segnete“ bewahrt die knappe Ausdrucksweise des Hebräischen, ohne die Wirkungsweise des Segens näher festzulegen.
- source_word: כָּל קְהַל יִשְׂרָאֵל
  choice: die ganze Versammlung Israels
  rationale: קהל bezeichnet die zusammengerufene beziehungsweise versammelte Gemeinschaft; „Versammlung“ gibt den öffentlichen und gemeinschaftlichen Sinn wieder. כָּל wird idiomatisch durch „die ganze“ ausgedrückt.
- source_word: קוֹל גָּדוֹל
  choice: mit lauter Stimme
  rationale: Wörtlich steht „mit großer Stimme“; die hebräische Wendung bezeichnet hier deutlich hörbare Lautstärke. „mit lauter Stimme“ ist die natürliche deutsche Entsprechung.
- source_word: לֵאמֹר
  choice: 'und sprach:'
  rationale: Der Infinitiv leitet den nachfolgenden Wortlaut ein. Das idiomatische deutsche „und sprach:“ wahrt die formelle und erzählerische Verknüpfung mit dem folgenden Vers.
theological_decisions:
- issue: Art des Segnens Israels
  choice: Salomo sprach einen Segen über die versammelte Gemeinschaft aus; die Übersetzung lässt offen, wie dieser Segen wirksam wird.
  alternative: Eine stärker sakramentale oder unmittelbar verursachende Deutung von „segnete“.
  rationale: ברך kann in einem öffentlichen und liturgischen Zusammenhang das Aussprechen eines Segens bezeichnen. Der Text selbst erläutert hier keinen theologischen Wirkmechanismus; deshalb bleibt die knappe Formulierung „segnete“ stehen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. „Dann trat er hin“ bildet den Handlungsfortschritt natürlich ab; „und sprach:“ ist im biblischen Kontext geläufig, ohne altertümlich zu wirken.
