  text: כִּי יֵצֵ֨א עַמְּ/ךָ֤ לַ/מִּלְחָמָה֙ עַל אֹ֣יְב֔/וֹ בַּ/דֶּ֖רֶךְ אֲשֶׁ֣ר תִּשְׁלָחֵ֑/ם וְ/הִתְפַּֽלְל֣וּ אֶל יְהוָ֗ה דֶּ֤רֶךְ הָ/עִיר֙ אֲשֶׁ֣ר בָּחַ֣רְתָּ בָּ֔/הּ וְ/הַ/בַּ֖יִת אֲשֶׁר בָּנִ֥תִי לִ/שְׁמֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/044.yaml
  text: When your people go out to battle against their enemy by the way you send them[a], and they pray to Yahweh toward the city that you have chosen and the house that I have built for your name[b],
translation:
  language: de
  text: Wenn dein Volk gegen seinen Feind in den Kampf zieht, auf den Weg, den du es sendest, und sie zu Jahwe beten in Richtung der Stadt, die du erwählt hast, und des Hauses[a], das ich für deinen Namen gebaut habe,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit dem „Haus“ ist der Tempel gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Wenn
  rationale: כִּי leitet hier innerhalb von Salomos Gebet einen möglichen künftigen Fall ein. „Wenn“ gibt diesen konditional-temporalen Sinn im Deutschen natürlich wieder.
- source_word: יֵצֵא עַמְּךָ לַמִּלְחָמָה
  choice: dein Volk … in den Kampf zieht
  rationale: Die Wendung bewahrt das konkrete Bild des Ausziehens zum Kampf und klingt zugleich in modernem Deutsch natürlich.
- source_word: עַל אֹיְבוֹ
  choice: gegen seinen Feind
  rationale: Das hebräische Suffix bei „Feind“ steht im maskulinen Singular und bezieht sich auf das Kollektiv „dein Volk“. Die deutsche Singularform erhält diese Struktur.
- source_word: בַּדֶּרֶךְ אֲשֶׁר תִּשְׁלָחֵם
  choice: auf dem Weg, auf den du es sendest
  rationale: דֶּרֶךְ bezeichnet konkret den Weg oder Kurs, und שׁלח drückt aus, dass Gott das Volk aussendet. Das grammatische Singularpronomen bezieht sich im Deutschen auf „Volk“.
- source_word: וְהִתְפַּלְלוּ אֶל יְהוָה
  choice: und sie zu Jahwe beten
  rationale: Der Wechsel zum Plural entspricht der hebräischen Form und nimmt die Angehörigen des kollektiv bezeichneten Volkes in den Blick. Der Gottesname יְהוָה wird als „Jahwe“ wiedergegeben.
- source_word: דֶּרֶךְ הָעִיר
  choice: zur Stadt hin
  rationale: דֶּרֶךְ bezeichnet hier die Gebetsrichtung. „Zur Stadt hin“ drückt die räumliche Ausrichtung knapp und idiomatisch aus.
- source_word: הָעִיר אֲשֶׁר בָּחַרְתָּ בָּהּ
  choice: die Stadt, die du erwählt hast
  rationale: Die Übersetzung bleibt bei der ausdrücklichen Aussage des Hebräischen und ergänzt nicht, wozu Gott die Stadt erwählt hat.
- source_word: וְהַבַּיִת
  choice: und zu dem Haus
  rationale: בַּיִת bedeutet wörtlich „Haus“ und bezeichnet hier den Tempel. „Haus“ erhält die für diesen Abschnitt prägende biblische Ausdrucksweise.
- source_word: אֲשֶׁר בָּנִתִי לִשְׁמֶךָ
  choice: das ich für deinen Namen gebaut habe
  rationale: Die Formulierung „für deinen Namen“ bewahrt die theologisch gewichtige, aber nicht weiter aufgelöste hebräische Redeweise.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. Die Transliteration „Jahwe“ macht diesen sichtbar, statt ihn durch einen Titel zu ersetzen.
- issue: Bezeichnung des Tempels als הַבַּיִת
  choice: das Haus
  alternative: der Tempel
  rationale: Obwohl sachlich der Tempel gemeint ist, verwendet der hebräische Text „Haus“. Diese Wiedergabe bewahrt die Ausdrucksweise „ein Haus für deinen Namen“, ohne den Bezug im Text selbst auszudeuten.
- issue: Numeruswechsel beim kollektiv gebrauchten עַם
  choice: „dein Volk … du es sendest, und sie … beten“
  alternative: durchgehend grammatischer Singular oder umschreibender Plural
  rationale: Der hebräische Text bezeichnet das Volk zunächst kollektiv im Singular, verwendet beim Senden und Beten aber Pluralformen. Die deutsche Fassung lässt diesen bedeutungsvollen Wechsel erkennbar, soweit es natürlich möglich ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzform bleibt als Nebensatz offen, weil der Vers inhaltlich und syntaktisch im folgenden Vers weitergeführt wird. Der Wechsel vom grammatischen Singular „Volk“ zum sinngemäßen Plural „sie“ folgt dem hebräischen Kollektivgebrauch.
