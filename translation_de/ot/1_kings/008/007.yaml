source:
  edition: WLC
  text: כִּ֤י הַ/כְּרוּבִים֙ פֹּרְשִׂ֣ים כְּנָפַ֔יִם אֶל מְק֖וֹם הָֽ/אָר֑וֹן וַ/יָּסֹ֧כּוּ הַ/כְּרֻבִ֛ים עַל הָ/אָר֥וֹן וְ/עַל בַּדָּ֖י/ו מִ/לְ/מָֽעְלָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/007.yaml
  text: For the cherubim spread out their wings over the place of the ark[a], and the cherubim overshadowed the ark and its poles from above.
translation:
  language: de
  text: Denn die Kerubim hielten ihre Flügel über dem Platz der Lade ausgebreitet[a] und überschirmten die Lade und ihre Tragstangen von oben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zum Platz der Lade hin«. Die hebräische Präposition bezeichnet häufig eine Richtung; der Zusammenhang legt hier jedoch nahe, dass sich die Flügel über den Standort der Lade erstreckten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet eine begründende Erklärung zum vorhergehenden Vers ein und bewahrt den Zusammenhang in natürlichem Deutsch.
- source_word: הַכְּרוּבִים
  choice: die Kerubim
  rationale: Die im Deutschen etablierte biblische Bezeichnung passt zum Heiligtumskontext und gibt den hebräischen Plural angemessen wieder.
- source_word: פֹּרְשִׂים כְּנָפַיִם
  choice: hielten ihre Flügel … ausgebreitet
  rationale: Das Partizip beschreibt hier vor allem eine andauernde Haltung beziehungsweise räumliche Anordnung, nicht den Verlauf einer gerade ausgeführten Bewegung.
- source_word: אֶל מְקוֹם הָאָרוֹן
  choice: über dem Platz der Lade
  rationale: Im räumlichen Zusammenhang und angesichts des folgenden Verbs bezeichnet die Wendung am ehesten die Ausdehnung der Flügel über den Standort der Lade; die grundsätzlich mögliche Richtungsbedeutung von אֶל bleibt in der Fußnote erhalten.
- source_word: וַיָּסֹכּוּ
  choice: überschirmten
  rationale: Gibt die Bedeutung des schützenden oder überdeckenden Ausbreitens von oben prägnant wieder und passt zum Bild der Flügel.
- source_word: בַּדָּיו
  choice: ihre Tragstangen
  rationale: Macht die Funktion der Stangen in klarem modernem Deutsch ausdrücklich, ohne einen altertümlichen Ausdruck zu verwenden.
- source_word: מִלְמָעְלָה
  choice: von oben
  rationale: Bewahrt die räumliche Perspektive des hebräischen Ausdrucks.
