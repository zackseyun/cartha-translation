  terminology: „Menschen“ für אָדָם ist hier inklusiv, natürlich und dem generischen Singular des Hebräischen angemessen. „zornig auf sie wirst“, „einem Feind preisgibst“ und „Land des Feindes“ sind treffend. Für שֹׁבֵיהֶם ist „Gefangennehmer“ genauer als „Bezwinger“; „als Gefangene“ gibt die etymologische Wiederaufnahme von Gefangennehmen und Gefangennehmer verständlich wieder.
