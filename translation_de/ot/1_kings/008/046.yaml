  text: כִּ֣י יֶֽחֶטְאוּ לָ֗/ךְ כִּ֣י אֵ֤ין אָדָם֙ אֲשֶׁ֣ר לֹא יֶחֱטָ֔א וְ/אָנַפְתָּ֣ בָ֔/ם וּ/נְתַתָּ֖/ם לִ/פְנֵ֣י אוֹיֵ֑ב וְ/שָׁב֤וּ/ם שֹֽׁבֵי/הֶם֙ אֶל אֶ֣רֶץ הָ/אוֹיֵ֔ב רְחוֹקָ֖ה א֥וֹ קְרוֹבָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/046.yaml
  text: When they sin against you—for there is no one who does not sin—and you become angry with them and give them over to an enemy[a], and their captors carry them away captive to the land of the enemy, whether far away or near,
translation:
  language: de
  text: Wenn sie gegen dich sündigen – denn es gibt keinen Menschen, der nicht sündigt – und du zornig auf sie wirst und sie einem Feind preisgibst und ihre Gefangennehmer sie als Gefangene in das Land des Feindes wegführen, sei es fern oder nah,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: Wenn sie gegen dich sündigen
  rationale: Das einleitende כִּי eröffnet hier einen möglichen beziehungsweise erwartbaren Fall innerhalb von Salomos Gebet. „Wenn“ gibt diese konditionale Funktion im Deutschen natürlich wieder; לָךְ bezeichnet die gegen Gott gerichtete Verfehlung.
- source_word: כִּי אֵין אָדָם אֲשֶׁר לֹא יֶחֱטָא
  choice: denn es gibt keinen Menschen, der nicht sündigt
  rationale: Das zweite כִּי begründet die vorausgesetzte Möglichkeit des Sündigens. אָדָם ist hier generisch und bezeichnet den Menschen als solchen; „Mensch“ bewahrt den Singular und ist im heutigen Deutschen inklusiv und idiomatisch.
- source_word: וְאָנַפְתָּ בָם
  choice: und du zornig auf sie wirst
  rationale: Die Verbform bezeichnet das Entbrennen beziehungsweise Eintreten göttlichen Zorns. „zornig auf sie wirst“ wahrt die dynamische Abfolge und den würdigen biblischen Ton.
- source_word: וּנְתַתָּם לִפְנֵי אוֹיֵב
  choice: und sie einem Feind preisgibst
  rationale: נתן לפני bezeichnet in diesem feindlichen Zusammenhang die Auslieferung in die Gewalt eines Gegners. „preisgeben“ ist natürliches, prägnantes Deutsch; der artikellose Singular אוֹיֵב wird als „einem Feind“ wiedergegeben.
- source_word: וְשָׁבוּם שֹׁבֵיהֶם
  choice: sodass ihre Bezwinger sie gefangen … wegführen
  rationale: Die figura etymologica verbindet das Verb des Gefangennehmens mit der Bezeichnung der Gefangennehmer. Die Wiedergabe hält sowohl die Gefangenschaft als auch die anschließende Verschleppung fest, ohne im Deutschen schwerfällig zu klingen.
- source_word: אֶל אֶרֶץ הָאוֹיֵב
  choice: in das Land des Feindes
  rationale: Die Zielangabe wird direkt wiedergegeben; beim zweiten Vorkommen steht אוֹיֵב mit Artikel, daher „des Feindes“.
- source_word: רְחוֹקָה אוֹ קְרוֹבָה
  choice: sei es fern oder nah
  rationale: Die Adjektive beziehen sich auf „Land“. Die feste deutsche Wendung bewahrt den Gegensatz und den knappen Ausdruck des Hebräischen.
theological_decisions:
- issue: Generischer Gebrauch von אָדָם
  choice: Mensch
  alternative: jemand / ein Mensch
  rationale: אָדָם bezeichnet hier nicht einen männlichen Einzelnen, sondern jeden Menschen. „Mensch“ wahrt die anthropologische Allgemeingültigkeit, ohne dem Text eine geschlechtsspezifische Aussage aufzuzwingen.
- issue: Göttlicher Zorn als Reaktion auf Sünde
  choice: du zornig auf sie wirst
  alternative: du ihnen zürnst
  rationale: Die Übersetzung bewahrt die ausdrückliche Aussage über Gottes Zorn und schwächt sie nicht ab; zugleich fügt sie keine Aussage über Dauer oder Intensität hinzu.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Gebetston. Die Gedankenstriche markieren die begründende Parenthese. Der Satz endet mit Komma, weil der Vers syntaktisch in den folgenden Vers hineinführt.
