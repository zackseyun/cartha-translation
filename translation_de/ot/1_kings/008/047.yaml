source:
  edition: WLC
  text: וְ/הֵשִׁ֨יבוּ֙ אֶל לִבָּ֔/ם בָּ/אָ֖רֶץ אֲשֶׁ֣ר נִשְׁבּוּ שָׁ֑ם וְ/שָׁ֣בוּ וְ/הִֽתְחַנְּנ֣וּ אֵלֶ֗י/ךָ בְּ/אֶ֤רֶץ שֹֽׁבֵי/הֶם֙ לֵ/אמֹ֔ר חָטָ֥אנוּ וְ/הֶעֱוִ֖ינוּ רָשָֽׁעְנוּ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/047.yaml
  text: and if they come to their senses in the land where they were taken captive, and return and plead with you in the land of those who took them captive, saying, ‘We have sinned and acted perversely; we have acted wickedly,’
translation:
  language: de
  text: 'und wenn sie in dem Land, in das man sie verschleppt hat, zur Besinnung kommen, umkehren und dich im Land ihrer Verschlepper um Gnade anflehen und sagen: »Wir haben gesündigt und Unrecht getan; wir haben böse gehandelt«,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵשִׁיבוּ אֶל־לִבָּם
  choice: und wenn sie … zur Besinnung kommen
  rationale: Die hebräische Wendung bedeutet wörtlich, dass sie es sich zu Herzen zurückbringen; idiomatisch bezeichnet sie das Wieder-zur-Besinnung-Kommen bzw. Sich-bewusst-Werden.
- source_word: וְשָׁבוּ
  choice: umkehren
  rationale: Das Verb שׁוב bedeutet hier zurückkehren bzw. umkehren. „Umkehren“ wahrt sowohl die Richtungsänderung als auch den Zusammenhang von Schuld und erneuter Hinwendung zu Gott, ohne ausdrücklich „bereuen“ einzutragen.
- source_word: וְהִתְחַנְּנוּ אֵלֶיךָ
  choice: dich … um Gnade anflehen
  rationale: Das Hitpael von חנן bezeichnet ein inständiges Flehen um Gunst oder Erbarmen; „um Gnade anflehen“ gibt dies natürlich und präzise wieder.
- source_word: נִשְׁבּוּ / שֹׁבֵיהֶם
  choice: verschleppt / Verschlepper
  rationale: Die Formen bezeichnen Gefangennahme und die Gefangennehmer. „Verschleppen“ passt zum Exilkontext und ermöglicht, die Wortverwandtschaft im Deutschen teilweise abzubilden.
- source_word: חָטָאנוּ וְהֶעֱוִינוּ רָשָׁעְנוּ
  choice: Wir haben gesündigt und Unrecht getan; wir haben gottlos gehandelt
  rationale: 'Die dreifache Schuldbekennung bleibt als Steigerung erhalten: sündigen, verkehrt bzw. unrecht handeln und sich gottlos bzw. schuldig verhalten.'
theological_decisions:
- issue: Bedeutung von וְשָׁבוּ im Zusammenhang von Exil und Schuldbekenntnis
  choice: umkehren
  alternative: zurückkehren; bereuen
  rationale: „Umkehren“ erhält die genuine Spannweite zwischen tatsächlicher Rückwendung und innerer Hinwendung zu Gott. „Bereuen“ würde die Bedeutung stärker psychologisieren, während „zurückkehren“ im Deutschen hier ein ungenanntes räumliches Ziel nahelegen könnte.
- issue: Wiedergabe von רָשָׁעְנוּ
  choice: wir haben gottlos gehandelt
  alternative: wir haben böse gehandelt; wir sind schuldig geworden
  rationale: Die Form bezeichnet schuldhaftes, frevelhaftes Handeln. „Gottlos gehandelt“ passt zum Gebets- und Bundeszusammenhang, ohne eine Aussage über eine unveränderliche Wesensart der Betenden zu machen.
translation_notes:
  register: Moderner, würdevoller Gebets- und Erzählstil. Die Satzform bleibt als abhängiger Konditionalsatz offen, da der Vers innerhalb von Salomos längerem Gebet syntaktisch fortgeführt wird. Die dreigliedrige Schuldbekennung und ihre rhetorische Steigerung wurden bewahrt.
