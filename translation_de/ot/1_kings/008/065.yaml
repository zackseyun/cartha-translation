  naturalness: Die revidierte Fassung verbindet die Angaben wieder in einem klaren deutschen Satz. Der Doppelpunkt stellt »eine große Versammlung« natürlich als Erläuterung zu »ganz Israel« dar, ohne die geographische Spannweite oder die zeitliche Wiederholung zu glätten.
