source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ שְׁלֹמֹ֣ה בָֽ/עֵת הַ/הִ֣יא אֶת הֶ/חָ֡ג וְ/כָל יִשְׂרָאֵ֣ל עִמּ/וֹ֩ קָהָ֨ל גָּד֜וֹל מִ/לְּב֥וֹא חֲמָ֣ת עַד נַ֣חַל מִצְרַ֗יִם לִ/פְנֵי֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ שִׁבְעַ֥ת יָמִ֖ים וְ/שִׁבְעַ֣ת יָמִ֑ים אַרְבָּעָ֥ה עָשָׂ֖ר יֽוֹם־׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/065.yaml
  text: At that time Solomon held the feast[a], and all Israel with him, a great assembly from Lebo-hamath to the Brook of Egypt, before Yahweh our God, seven days and seven days[b], fourteen days.
translation:
  language: de
  text: 'Damals feierte Salomo zusammen mit ganz Israel das Fest: eine große Versammlung von Lebo-Hamat[a] bis zum Bach Ägyptens[b], vor Yahweh, unserem Gott, sieben Tage und sieben Tage, vierzehn Tage.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »vom Zugang nach Hamat«. Das Hebräische kann als beschreibende Grenzangabe oder als Ortsname Lebo-Hamat verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »bis zum Wadi Ägyptens«. Das hebräische Wort bezeichnet oft einen nur zeitweise Wasser führenden Bachlauf.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... אֶת הֶחָג
  choice: feierte ... das Fest
  rationale: Das wörtliche »machte das Fest« ist im Deutschen unidiomatisch. In Verbindung mit חָג bezeichnet עשה das Begehen oder Feiern eines Festes.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: und ganz Israel war bei ihm
  rationale: Bewahrt Salomo als grammatisches Hauptsubjekt und gibt zugleich die Teilnahme des ganzen Volkes natürlich wieder.
- source_word: קָהָל גָּדוֹל
  choice: eine große Versammlung
  rationale: קָהָל bezeichnet die versammelte Gemeinschaft; »Versammlung« wahrt den formellen gemeinschaftlichen Sinn ohne unnötige kirchliche Färbung.
- source_word: מִלְּבוֹא חֲמָת
  choice: von Lebo-Hamat
  rationale: Die Wendung dient häufig als fester geografischer Grenzname. Die mögliche beschreibende Lesart wird in einer Fußnote erhalten.
- source_word: נַחַל מִצְרַיִם
  choice: bis zum Bach Ägyptens
  rationale: נַחַל bezeichnet gewöhnlich einen Bachlauf, ein Wadi oder ein zeitweise trockenes Flussbett, nicht zwingend einen großen Fluss; »Bach Ägyptens« vermeidet zudem eine Verwechslung mit dem Nil.
- source_word: לִפְנֵי יְהוָה אֱלֹהֵינוּ
  choice: vor Yahweh, unserem Gott
  rationale: »Vor« gibt die räumlich-relationale Bedeutung von לִפְנֵי knapp wieder; der Gottesname יהוה wird als »Yahweh« wiedergegeben.
- source_word: שִׁבְעַת יָמִים וְשִׁבְעַת יָמִים אַרְבָּעָה עָשָׂר יוֹם
  choice: sieben Tage und sieben Tage, insgesamt vierzehn Tage
  rationale: Die auffällige Wiederholung der beiden Siebentagezeiträume bleibt sichtbar; »insgesamt« verdeutlicht lediglich die im hebräischen Text folgende Summenangabe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR
  rationale: Der Ausgangstext nennt das Tetragramm ausdrücklich. »Yahweh« gibt den persönlichen Bundesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Beziehung der beiden Siebentagezeiträume
  choice: sieben Tage und sieben Tage, insgesamt vierzehn Tage
  alternative: vierzehn Tage lang
  rationale: Der Text unterscheidet ausdrücklich zwei Siebentagezeiträume und fasst sie anschließend als vierzehn Tage zusammen. Die Übersetzung bewahrt diese Struktur, ohne die genaue kultische Zuordnung der beiden Zeiträume im Vers selbst festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung entlastet die lange hebräische Reihung, während Reihenfolge, geografische Spannweite und die auffällige Zeitangabe erhalten bleiben.
