  text: וַֽ/יַּעֲל֞וּ אֶת אֲר֤וֹן יְהוָה֙ וְ/אֶת אֹ֣הֶל מוֹעֵ֔ד וְ/אֶֽת כָּל כְּלֵ֥י הַ/קֹּ֖דֶשׁ אֲשֶׁ֣ר בָּ/אֹ֑הֶל וַ/יַּעֲל֣וּ אֹתָ֔/ם הַ/כֹּהֲנִ֖ים וְ/הַ/לְוִיִּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/004.yaml
  text: They brought up the ark of Yahweh[a], the tent of meeting, and all the holy vessels that were in the tent[b]; the priests and the Levites brought them up.
translation:
  language: de
  text: Sie brachten die Lade Jahwes, das Zelt der Begegnung und alle heiligen Geräte, die sich im Zelt befanden, hinauf[a]. Die Priester und die Leviten brachten sie hinauf[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »trugen … hinauf«. Das hebräische Verb bezeichnet ein Hinaufbringen und kann in diesem Prozessionszusammenhang auch das Hinauftragen einschließen.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich nennt der hebräische Text »die Priester und die Leviten«. Manche verstehen die Formulierung enger als Bezeichnung der levitischen Priesterschaft; der Wortlaut nennt jedoch beide Gruppen.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: sie brachten … hinauf
  rationale: Die Hifil-Form von עלה bezeichnet hier ein Hinaufbringen. Die Wiedergabe bewahrt die räumliche beziehungsweise prozessionale Richtung, ohne die Art des Transports unnötig festzulegen.
- source_word: אֲרוֹן יְהוָה
  choice: die Lade Jahwes
  rationale: אֲרוֹן bezeichnet hier die heilige Lade; der Gottesname יהוה wird als persönlicher Name „Jahwe“ wiedergegeben.
- source_word: אֹהֶל מוֹעֵד
  choice: das Zelt der Begegnung
  rationale: Die Wendung wird nahe am Hebräischen und zugleich in einer im Deutschen verständlichen Form wiedergegeben. „Stiftshütte“ wäre traditionell, aber weniger transparent.
- source_word: כָּל כְּלֵי הַקֹּדֶשׁ
  choice: alle heiligen Geräte
  rationale: כְּלִים ist ein weiter Begriff für Geräte, Gegenstände oder Utensilien. „Heilige Geräte“ wahrt die kultische Bestimmung, ohne Größe oder genaue Art festzulegen.
- source_word: אֲשֶׁר בָּאֹהֶל
  choice: die sich im Zelt befanden
  rationale: Der Relativsatz bezieht sich am natürlichsten auf die unmittelbar zuvor genannten heiligen Geräte; „im Zelt“ vermeidet eine schwerfällige Wiederholung.
- source_word: וַיַּעֲלוּ אֹתָם
  choice: brachten sie hinauf
  rationale: Die Wiederholung des Verbs im Hebräischen wird beibehalten. Das pluralische Pronomen fasst die zuvor genannten Gegenstände zusammen.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: die Priester und die Leviten
  rationale: Der hebräische Wortlaut nennt beide Gruppen ausdrücklich und wird daher nicht interpretierend zu einer einzigen Bezeichnung zusammengezogen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Quelltext enthält den Gottesnamen. „Jahwe“ ist die geläufige deutsche Transliteration und bewahrt den Charakter als Eigenname statt ihn durch einen Titel zu ersetzen.
- issue: Verhältnis von Priestern und Leviten bei der Transporthandlung
  choice: Beide Gruppen ausdrücklich nennen
  alternative: die levitischen Priester
  rationale: Der masoretische Text nennt „die Priester und die Leviten“. Die Übersetzung bewahrt diese Formulierung und damit eine mögliche Spannung zu anderen Aussagen über ihre jeweiligen Aufgaben, statt sie harmonisierend aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzwiederholung folgt bewusst dem hebräischen Aufbau. „Zelt der Begegnung“ ist transparent und quellennah; „heilige Geräte“ bleibt hinsichtlich Art und Größe der Gegenstände offen.
