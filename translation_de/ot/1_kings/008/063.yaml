source:
  edition: WLC
  text: וַ/יִּזְבַּ֣ח שְׁלֹמֹ֗ה אֵ֣ת זֶ֣בַח הַ/שְּׁלָמִים֮ אֲשֶׁ֣ר זָבַ֣ח לַ/יהוָה֒ בָּקָ֗ר עֶשְׂרִ֤ים וּ/שְׁנַ֨יִם֙ אֶ֔לֶף וְ/צֹ֕אן מֵאָ֥ה וְ/עֶשְׂרִ֖ים אָ֑לֶף וַֽ/יַּחְנְכוּ֙ אֶת בֵּ֣ית יְהוָ֔ה הַ/מֶּ֖לֶךְ וְ/כָל בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/063.yaml
  text: 'And Solomon sacrificed the sacrifice of peace offerings that he sacrificed to Yahweh: twenty-two thousand cattle and one hundred twenty thousand sheep[b][a]. So the king and all the sons of Israel dedicated the house of Yahweh.'
translation:
  language: de
  text: Salomo brachte Jahwe 22.000 Rinder und 120.000 Stück Kleinvieh als Friedensopfer[a] dar. So weihten der König und alle Söhne Israels[b] das Haus Jahwes ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch „Gemeinschaftsopfer“ oder „Heilsopfer“.
    reason: lexical_alternative
  - marker: b
    text: Hebräisch „Söhne Israels“; gemeint sind die Israeliten als Volk.
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: schlachtete
  rationale: Im Opferkontext bezeichnet זבח ausdrücklich das rituelle Schlachten; „schlachtete“ gibt den konkreten Vorgang genauer wieder als das allgemeinere „opferte“.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: Friedensopfer
  rationale: „Friedensopfer“ ist der etablierte deutsche Kultbegriff und bewahrt die Verbindung von שְׁלָמִים mit Frieden, Heil und Wohlergehen; weitere Bedeutungsaspekte werden in der Fußnote genannt.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname יהוה wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בָּקָר
  choice: Rinder
  rationale: בָּקָר ist eine kollektive Bezeichnung für Rindvieh; „Rinder“ ist im modernen Deutschen natürlich und umfasst die Tiergruppe ohne unnötige Verengung.
- source_word: צֹאן
  choice: Stück Kleinvieh
  rationale: צֹאן kann Schafe und Ziegen gemeinsam bezeichnen. „Kleinvieh“ erhält diese sachliche Breite, die bei „Schafe“ verloren ginge.
- source_word: וַיַּחְנְכוּ
  choice: weihten ... ein
  rationale: חנך bezeichnet hier die feierliche Bestimmung und Ingebrauchnahme des Heiligtums; „einweihen“ ist dafür die natürliche deutsche Entsprechung.
- source_word: בֵּית יְהוָה
  choice: das Haus Jahwes
  rationale: Die formale Wendung „Haus Jahwes“ bewahrt das hebräische Bild; „Tempel“ wäre verständlich, aber stärker deutend.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  rationale: Die formale Bundes- und Volksbezeichnung wird erhalten; dass sie hier die Israeliten insgesamt meint, wird in der Fußnote erläutert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Eigennamen Gottes. „Jahwe“ macht diesen Namen im Haupttext sichtbar, statt ihn durch den Titel „der HERR“ zu ersetzen.
- issue: Bedeutungsumfang von שְׁלָמִים
  choice: Friedensopfer
  alternative: Gemeinschaftsopfer oder Heilsopfer
  rationale: Der traditionelle Ausdruck ist verständlich und lexikalisch eng mit שלום verbunden, legt den vielschichtigen Opferbegriff aber nicht abschließend auf nur eine Deutung fest; die Alternativen stehen in der Fußnote.
- issue: Kollektive Bedeutung von בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  alternative: Israeliten
  rationale: Die konkrete hebräische Formulierung bleibt im Text erhalten, ohne ihre inklusive volkliche Referenz zu verschweigen; diese wird in der Fußnote erklärt.
translation_notes:
  register: Moderne, würdige Standardsprache mit moderater formaler Nähe zum Hebräischen. Die ungewöhnlich große Opferzahl und die kultischen Fachbegriffe werden nicht geglättet. „Kleinvieh“ bewahrt die mögliche Einbeziehung von Schafen und Ziegen.
