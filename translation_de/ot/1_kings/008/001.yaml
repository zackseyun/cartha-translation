  variant: modern standard German
source:
  edition: WLC
  text: אָ֣ז יַקְהֵ֣ל שְׁלֹמֹ֣ה אֶת זִקְנֵ֣י יִשְׂרָאֵ֡ל אֶת כָּל רָאשֵׁ֣י הַ/מַּטּוֹת֩ נְשִׂיאֵ֨י הָ/אָב֜וֹת לִ/בְנֵ֧י יִשְׂרָאֵ֛ל אֶל הַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה יְרוּשָׁלִָ֑ם לְֽ/הַעֲל֞וֹת אֶת אֲר֧וֹן בְּרִית יְהוָ֛ה מֵ/עִ֥יר דָּוִ֖ד הִ֥יא צִיּֽוֹן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/001.yaml
  text: Then Solomon assembled the elders of Israel[a], all the heads of the tribes, the leaders of the fathers’ houses of the sons of Israel, to King Solomon in Jerusalem, to bring up the ark of the covenant of Yahweh from the city of David, that is, Zion.
translation:
  language: de
  text: Damals versammelte Salomo die Ältesten Israels, alle Oberhäupter der Stämme und die Anführer der israelitischen Sippen[a] zu König Salomo nach Jerusalem, um die Lade des Bundes Jahwes aus der Stadt Davids, das heißt Zion, heraufzubringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „die Anführer der Vaterhäuser der Söhne Israels“. Gemeint sind die leitenden Vertreter der angestammten Familienverbände Israels.'
    reason: Die Fußnote bewahrt die familiär-patriarchale Bildstruktur des Hebräischen, während der Haupttext ihre gesellschaftliche Funktion in natürlichem Deutsch ausdrückt.
lexical_decisions:
- source_word: אָז
  choice: Damals
  rationale: Kennzeichnet den zeitlichen Übergang zum folgenden Ereignis und klingt im deutschen Erzählfluss natürlich.
- source_word: יַקְהֵל
  choice: versammelte
  rationale: Der Hifil von קהל bezeichnet das Veranlassen einer Versammlung; „versammelte“ passt zur förmlichen Einberufung durch den König.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: die Ältesten Israels
  rationale: Bewahrt die etablierte Bezeichnung für anerkannte leitende Repräsentanten.
- source_word: כָּל רָאשֵׁי הַמַּטּוֹת
  choice: alle Oberhäupter der Stämme
  rationale: מַטּוֹת bezeichnet hier die Stämme, nicht wörtliche Stäbe; „Oberhäupter“ gibt die leitende Stellung von רָאשֵׁי wieder.
- source_word: נְשִׂיאֵי הָאָבוֹת לִבְנֵי יִשְׂרָאֵל
  choice: die Anführer der israelitischen Sippen
  rationale: הָאָבוֹת meint in diesem gesellschaftlichen Zusammenhang väterliche beziehungsweise angestammte Familienverbände. Die natürliche deutsche Formulierung macht die institutionelle Bedeutung verständlich, ohne ein biologisches Vaterverhältnis zu behaupten.
- source_word: אֶל הַמֶּלֶךְ שְׁלֹמֹה יְרוּשָׁלִָם
  choice: bei König Salomo in Jerusalem
  rationale: אֶל bezeichnet das Zusammenkommen zum König hin. „Bei“ bildet das Ergebnis dieser Bewegung idiomatisch ab und vermeidet die im Deutschen schwerfällige Wiederholung „zu König Salomo“ nach „versammelte“.
- source_word: לְהַעֲלוֹת
  choice: heraufzubringen
  rationale: Bewahrt die gerichtete Bewegung hinauf nach Jerusalem und den kausativen Sinn.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: die Lade des Bundes Jahwes
  rationale: Gibt die hebräische Konstruktverbindung knapp und unmittelbar wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen übliche Wiedergabe des göttlichen Eigennamens erhält dessen Namenscharakter statt ihn durch einen Titel zu ersetzen.
- source_word: מֵעִיר דָּוִד הִיא צִיּוֹן
  choice: aus der Stadt Davids, das heißt aus Zion
  rationale: Die identifizierende Apposition wird klar wiedergegeben; das wiederholte „aus“ verdeutlicht im Deutschen, dass Zion die Stadt Davids bezeichnet.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen. „Jahwe“ bewahrt diesen, während „der HERR“ ihn durch einen traditionellen Titel ersetzt.
- issue: Wiedergabe von לִבְנֵי יִשְׂרָאֵל im Ausdruck über die Sippenführer
  choice: israelitischen Sippen
  alternative: Vaterhäuser der Söhne Israels
  rationale: Die Wendung bezeichnet hier die familiär-stammesbezogene Gliederung Israels. Die gewählte Form wahrt den korporativen Sinn und vermeidet im Deutschen eine missverständliche, unnatürliche Wortfolge; die wörtliche Struktur wird in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Reihe der israelitischen Führungsträger bleibt erkennbar, wird aber ohne unnötig sperrige Hebraismen formuliert. Der Gottesname erscheint in der im Deutschen geläufigen Form „Jahwe“.
