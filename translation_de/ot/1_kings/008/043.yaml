  to: Höre du im Himmel, deiner Wohnstätte, und handle entsprechend allem, worum der Ausländer dich bittet, damit alle Völker der Erde deinen Namen kennen, dich fürchten, wie dein Volk Israel es tut, und erkennen, dass dieses Haus, das ich gebaut habe, deinen Namen trägt.[a]
