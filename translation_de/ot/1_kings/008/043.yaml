    issue: „tu alles, worum der Ausländer dich bittet“ verschiebt כְּכֹל אֲשֶׁר.
    rationale: Die Präposition כְ bedeutet „gemäß/entsprechend“. „Handle entsprechend allem, worum ... bittet“ bewahrt diese Relation und ist idiomatisches Deutsch.
  - severity: low
    issue: Die Fußnote bietet „ausgerufen“ als angeblich wörtliche Möglichkeit.
    rationale: נִקְרָא ist hier am neutralsten „genannt/angerufen worden bzw. wird genannt“; „ausgerufen“ engt die Formel unnötig ein.
