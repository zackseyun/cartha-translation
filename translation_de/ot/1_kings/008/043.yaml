  terminology: „Ausländer“, „Völker der Erde“ und „dich fürchten“ sind angemessen. „Deinen Namen trägt“ ist eine tragfähige idiomatische Wiedergabe der Namensformel. Die Fußnote sollte die hebräische Formel nicht mit dem engeren, nicht notwendigen „ausgerufen“ erklären, sondern neutral als „über diesem Haus genannt wird“ wiedergeben.
