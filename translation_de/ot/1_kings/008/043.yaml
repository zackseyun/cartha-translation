source:
  edition: WLC
  text: אַתָּ֞ה תִּשְׁמַ֤ע הַ/שָּׁמַ֨יִם֙ מְכ֣וֹן שִׁבְתֶּ֔/ךָ וְ/עָשִׂ֕יתָ כְּ/כֹ֛ל אֲשֶׁר יִקְרָ֥א אֵלֶ֖י/ךָ הַ/נָּכְרִ֑י לְמַ֣עַן יֵדְעוּ/ן֩ כָּל עַמֵּ֨י הָ/אָ֜רֶץ אֶת שְׁמֶ֗/ךָ לְ/יִרְאָ֤ה אֹֽתְ/ךָ֙ כְּ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל וְ/לָ/דַ֕עַת כִּי שִׁמְ/ךָ֣ נִקְרָ֔א עַל הַ/בַּ֥יִת הַ/זֶּ֖ה אֲשֶׁ֥ר בָּנִֽיתִי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/043.yaml
  text: may you hear in heaven[a], the place where you dwell, and do according to all that the foreigner calls to you for, so that all the peoples of the earth may know your name, to fear you as your people Israel do[b], and to know that your name is called on this house that I have built.
translation:
  language: de
  text: Höre du im Himmel, deiner Wohnstätte, und handle entsprechend allem, worum der Ausländer dich bittet, damit alle Völker der Erde deinen Namen kennen, dich fürchten, wie dein Volk Israel es tut, und erkennen, dass dieses Haus, das ich gebaut habe, deinen Namen trägt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „dass dein Name über diesem Haus genannt wird.“ Die Wendung bringt die besondere Verbindung dieses Hauses mit Gottes Namen zum Ausdruck.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: Dann höre du
  rationale: Das Imperfekt hat im Gebetszusammenhang bittenden beziehungsweise volitiven Sinn. Das betonte Pronomen אַתָּה wird durch „du“ wiedergegeben; „Dann“ stellt den im Kontext vorausgesetzten Anschluss her.
- source_word: הַשָּׁמַיִם מְכוֹן שִׁבְתֶּךָ
  choice: im Himmel, an dem Ort, an dem du wohnst
  rationale: מְכוֹן bezeichnet hier Gottes Wohnstätte und steht appositionell zu „Himmel“. Die Formulierung bleibt anschaulich und ist zugleich natürliches modernes Deutsch.
- source_word: וְעָשִׂיתָ כְּכֹל אֲשֶׁר יִקְרָא אֵלֶיךָ
  choice: und tu alles, worum der Ausländer dich bittet
  rationale: קרא אל bezeichnet das an Gott gerichtete Rufen. Im Gebetskontext macht „bitten“ den impliziten Inhalt verständlich, während „alles“ den umfassenden Sinn von כְּכֹל wahrt.
- source_word: הַנָּכְרִי
  choice: der Ausländer
  rationale: נָכְרִי bezeichnet hier einen Angehörigen eines anderen Volkes, nicht bloß eine unbekannte Person. „Ausländer“ gibt diesen Gegensatz zu Israel deutlich wieder.
- source_word: כָּל עַמֵּי הָאָרֶץ
  choice: alle Völker der Erde
  rationale: Der Ausdruck hat universale Reichweite; „Völker“ bewahrt den kollektiven Sinn von עַמִּים.
- source_word: לְיִרְאָה אֹתְךָ
  choice: dich fürchten
  rationale: „Fürchten“ bewahrt das Bedeutungsspektrum von Ehrfurcht, Scheu und heiliger Furcht, ohne es auf bloße Achtung zu verengen.
- source_word: שִׁמְךָ נִקְרָא עַל הַבַּיִת הַזֶּה
  choice: dieses Haus … deinen Namen trägt
  rationale: Die hebräische Wendung bezeichnet die ausdrückliche Zugehörigkeit des Tempels zu Gott beziehungsweise seine Verbindung mit Gottes Namen. „Deinen Namen trägt“ ist im Deutschen verständlich; die wörtlichere Form wird in der Fußnote erhalten.
theological_decisions:
- issue: Die Wendung שִׁמְךָ נִקְרָא עַל über dem Tempel
  choice: dass dieses Haus … deinen Namen trägt
  alternative: dass dein Name über diesem Haus ausgerufen/genannt ist
  rationale: Die idiomatische deutsche Wiedergabe vermittelt Zugehörigkeit und Benennung, ohne festzulegen, ob der Akzent ausschließlich auf Eigentum, Weihe oder öffentlicher Proklamation liegt. Die Fußnote bewahrt die konkrete hebräische Ausdrucksweise.
- issue: Bedeutung von ירא
  choice: dich fürchten
  alternative: dich verehren / Ehrfurcht vor dir haben
  rationale: Die direkte Wiedergabe wahrt die theologische Spannung zwischen Ehrfurcht, Gehorsam und Furcht und vermeidet eine abschwächende Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem Gebetscharakter des Hebräischen, vermeidet aber unnötig altertümliche Formen. Der Fußnotenmarker steht unmittelbar bei der idiomatisch wiedergegebenen hebräischen Wendung.
