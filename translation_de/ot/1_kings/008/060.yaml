source:
  edition: WLC
  text: לְמַ֗עַן דַּ֚עַת כָּל עַמֵּ֣י הָ/אָ֔רֶץ כִּ֥י יְהוָ֖ה ה֣וּא הָ/אֱלֹהִ֑ים אֵ֖ין עֽוֹד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/060.yaml
  text: so that all the peoples of the earth may know that the LORD, he is God; there is no other.
translation:
  language: de
  text: damit alle Völker der Erde erkennen, dass der HERR Gott ist und es keinen anderen gibt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַעַן דַּעַת
  choice: damit … erkennen
  rationale: Die Zweckkonstruktion mit Infinitiv wird im Deutschen natürlich als Finalsatz wiedergegeben; „erkennen“ umfasst hier ein auf Einsicht gegründetes Wissen.
- source_word: כָּל עַמֵּי הָאָרֶץ
  choice: alle Völker der Erde
  rationale: Gibt den Plural עַמֵּי und die universale Reichweite von כָּל unmittelbar wieder.
- source_word: יְהוָה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens in Kapitälchen entspricht dem vorgegebenen Publikationsstil.
- source_word: הוּא הָאֱלֹהִים
  choice: Gott ist
  rationale: Im Deutschen drückt „der HERR Gott ist“ die identifizierende Aussage idiomatisch aus; das hervorgehobene Pronomen הוּא muss nicht mit einem unnatürlichen „er ist“ nachgebildet werden.
- source_word: אֵין עוֹד
  choice: sonst keiner
  rationale: Die knappe Existenzaussage wird ebenso knapp und idiomatisch wiedergegeben und bezieht sich im Kontext auf keinen anderen Gott.
theological_decisions:
- issue: Exklusivität der Gotteserkenntnis
  choice: „und sonst keiner“
  alternative: „es gibt keinen anderen“
  rationale: Bewahrt die uneingeschränkte Exklusivitätsaussage des Hebräischen, ohne sie durch eine zusätzliche dogmatische Erläuterung zu erweitern.
- issue: Emphase von הוּא
  choice: keine gesonderte Wiedergabe des Pronomens
  alternative: „dass der HERR, er ist Gott“
  rationale: Die hebräische Identifikationsformel ist emphatisch; im natürlichen modernen Deutsch trägt die Wortstellung „der HERR Gott ist“ diese Aussage ausreichend, während die wörtliche Doppelung schwerfällig wäre.
translation_notes:
  register: Modernes, würdiges Standarddeutsch; knapp und öffentlich-proklamatorisch. Die Satzstruktur folgt dem hebräischen Zweck- und Bekenntnissatz, vermeidet aber unidiomatische pronominale Doppelung.
