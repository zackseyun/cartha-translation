  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל דָּוִ֣ד אָבִ֔/י יַ֗עַן אֲשֶׁ֤ר הָיָה֙ עִם לְבָ֣בְ/ךָ֔ לִ/בְנ֥וֹת בַּ֖יִת לִ/שְׁמִ֑/י הֱטִיבֹ֔תָ כִּ֥י הָיָ֖ה עִם לְבָבֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/018.yaml
  text: But Yahweh said to David my father[a], ‘Because it was in your heart to build a house for my name, you did well that it was in your heart.’
translation:
  language: de
  text: 'Doch Jahwe sagte zu meinem Vater David: »Weil es dir am Herzen lag, für meinen Namen ein Haus zu bauen[a], hast du gut daran getan; denn es lag dir am Herzen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »für meinen Namen einen Tempel zu bauen«. Wörtlich heißt es im Hebräischen: »für meinen Namen ein Haus zu bauen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: Die narrative Form von אמר leitet hier eine direkte Rede ein; »sagte« ist die natürliche deutsche Wiedergabe.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: דָּוִד אָבִי
  choice: meinem Vater David
  rationale: Die deutsche Wortstellung macht eindeutig, dass Salomo David als seinen Vater bezeichnet.
- source_word: יַעַן אֲשֶׁר
  choice: weil
  rationale: Die Partikelverbindung führt den Grund ein; »weil« ist klar und gegenwartssprachlich.
- source_word: הָיָה עִם לְבָבְךָ
  choice: es dir am Herzen lag
  rationale: Die idiomatische Wendung bezeichnet einen inneren Wunsch oder Vorsatz. Die deutsche Form bewahrt das Herzbild und klingt natürlich.
- source_word: לִבְנוֹת בַּיִת
  choice: ein Haus zu bauen
  rationale: בַּיִת bedeutet wörtlich »Haus«; im Zusammenhang ist der Tempel gemeint. Die Hauptlesart bewahrt das Bild des Ausgangstextes.
- source_word: לִשְׁמִי
  choice: meinem Namen
  rationale: Die knappe Wendung bewahrt die theologisch bedeutsame Zuordnung des Heiligtums zu Gottes Namen.
- source_word: הֱטִיבֹתָ
  choice: hast du gut daran getan
  rationale: Die Hifil-Form von יטב drückt Zustimmung aus; diese Wendung ist idiomatisches modernes Deutsch.
- source_word: כִּי הָיָה עִם לְבָבֶךָ
  choice: dass es dir am Herzen lag
  rationale: כִּי ergänzt hier den Inhalt dessen, woran David gut getan hat. »Dass« erhält diese syntaktische Funktion und vermeidet eine unnötige Wiederholung von »weil«.
theological_decisions:
- issue: Wiedergabe des Gottesnamens JHWH
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text hat den persönlichen Gottesnamen; seine Wiedergabe als »Jahwe« bewahrt diesen Unterschied gegenüber einem bloßen Titel.
- issue: Wiedergabe von בַּיִת im Tempelkontext
  choice: Haus
  alternative: Tempel
  rationale: »Haus« entspricht unmittelbar dem hebräischen Wortlaut und bewahrt die biblische Rede von einem Haus für Gottes Namen; die Fußnote nennt die kontextuelle Bedeutung.
- issue: Deutung der wiederholten Herzensformel
  choice: am Herzen liegen
  alternative: im Sinn haben
  rationale: Die Formulierung wahrt das Bild des Herzens und lässt sowohl Wunsch als auch feste Absicht mitschwingen, ohne die Aussage enger festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp; »am Herzen liegen« vermittelt den hebräischen Herzensausdruck verständlich, ohne ihn rein rational als bloßen Plan umzudeuten.
