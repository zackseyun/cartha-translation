base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/027.yaml
  text: For will God indeed dwell on the earth? Behold[a], the heavens, even the highest heavens, cannot contain you[c][b]; how much less this house that I have built!
translation:
  language: de
  text: Denn sollte Gott wirklich auf der Erde wohnen? Siehe, die Himmel, ja die höchsten Himmel[a], können dich nicht fassen[b]; wie viel weniger dieses Haus[c], das ich gebaut habe!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Himmel und die Himmel der Himmel“; eine hebräische Steigerungsform für die höchsten Himmel.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „können dich nicht aufnehmen“.'
    reason: lexical_alternative
  - marker: c
    text: Mit „diesem Haus“ ist der von Salomo gebaute Tempel gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי הַאֻמְנָם
  choice: Doch sollte … wirklich
  rationale: Die Verbindung leitet eine staunende rhetorische Frage ein. „Doch“ stellt den gedanklichen Gegensatz zur zuvor genannten Gegenwart Gottes heraus, während „wirklich“ die emphatische Fragepartikel wiedergibt.
- source_word: יֵשֵׁב
  choice: wohnen
  rationale: Das Verb kann „sitzen“ oder „wohnen“ bedeuten; im Zusammenhang mit Gottes Gegenwart und dem Tempel ist „wohnen“ die natürliche deutsche Entsprechung.
- source_word: עַל הָאָרֶץ
  choice: auf der Erde
  rationale: Die Wendung bildet den räumlichen Gegensatz zum Himmel und bezeichnet hier die Erde, nicht lediglich ein bestimmtes Land.
- source_word: הִנֵּה
  choice: Siehe
  rationale: „Siehe“ bewahrt den feierlichen Aufmerksamkeitsruf und passt zum gehobenen Gebetsstil.
- source_word: הַשָּׁמַיִם וּשְׁמֵי הַשָּׁמַיִם
  choice: der Himmel und selbst der höchste Himmel
  rationale: Die hebräische Verbindung „der Himmel und der Himmel der Himmel“ steigert die Aussage bis zum höchsten vorstellbaren Himmel. Die idiomatische Wiedergabe ist verständlich und erhält die Intensivierung.
- source_word: לֹא יְכַלְכְּלוּךָ
  choice: können dich nicht fassen
  rationale: Das Verb bezeichnet hier die Fähigkeit, etwas aufzunehmen oder zu umschließen. „Fassen“ ist im Deutschen prägnant und lässt sowohl räumliches Aufnehmen als auch die Unermesslichkeit Gottes anklingen, ohne den Sinn unnötig festzulegen.
- source_word: אַף כִּי
  choice: wie viel weniger
  rationale: 'Die Wendung markiert einen Schluss vom Größeren auf das Kleinere: Wenn selbst die Himmel Gott nicht fassen, dann erst recht nicht der Tempel.'
- source_word: הַבַּיִת הַזֶּה
  choice: dieses Haus
  rationale: „Haus“ erhält die konkrete hebräische Bezeichnung und das biblische Motiv des Tempels als Haus Gottes; eine Fußnote klärt den Bezug.
- source_word: אֲשֶׁר בָּנִיתִי
  choice: das ich gebaut habe
  rationale: Das deutsche Perfekt gibt die abgeschlossene Handlung mit ihrer unmittelbaren Bedeutung für Salomos gegenwärtiges Gebet natürlich wieder.
theological_decisions:
- issue: Gottes Transzendenz und seine Gegenwart im Tempel
  choice: Die rhetorische Frage und die Aussage, dass selbst die höchsten Himmel Gott nicht fassen können, bleiben nebeneinander stehen.
  alternative: Die Frage als kategorische Verneinung irdischer Gegenwart Gottes zu formulieren oder anzudeuten, der Tempel könne Gott räumlich einschließen.
  rationale: Der hebräische Text verbindet Salomos Staunen über Gottes Wohnen auf der Erde mit dem Bekenntnis, dass kein geschaffener Raum ihn fassen kann. Die Übersetzung bewahrt diese Spannung, ohne Gottes wirkliche Bundesgegenwart oder seine Transzendenz abzuschwächen.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst feierlichem „Siehe“. Die Satzführung erhält die rhetorische Steigerung des hebräischen Gebets; „Haus“ wahrt das Tempelmotiv des Ausgangstextes.
