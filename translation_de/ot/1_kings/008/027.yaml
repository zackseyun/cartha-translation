revisions:
- from: Doch sollte Gott wirklich auf der Erde wohnen? Siehe, der Himmel und selbst der höchste Himmel[a] können dich nicht fassen[b] – wie viel weniger dieses Haus, das ich gebaut habe![c]
  to: Denn sollte Gott wirklich auf der Erde wohnen? Siehe, die Himmel, ja die höchsten Himmel[a], können dich nicht fassen[b]; wie viel weniger dieses Haus[c], das ich gebaut habe!
  rationale: Die Revision ersetzt den zu stark adversativen Anschluss „Doch“ durch das begründende „Denn“, stellt die Plural- und Steigerungsstruktur von „Himmel/Himmel der Himmel“ genauer dar und verankert die Tempel-Fußnote an der Bezugsgruppe. Der Sinn und die bewusst bewahrte Spannung zwischen Gottes Gegenwart und seiner Unfassbarkeit bleiben unverändert.
