  text: בָּר֣וּךְ יְהוָ֗ה אֲשֶׁ֨ר נָתַ֤ן מְנוּחָה֙ לְ/עַמּ֣/וֹ יִשְׂרָאֵ֔ל כְּ/כֹ֖ל אֲשֶׁ֣ר דִּבֵּ֑ר לֹֽא נָפַ֞ל דָּבָ֣ר אֶחָ֗ד מִ/כֹּל֙ דְּבָר֣/וֹ הַ/טּ֔וֹב אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד מֹשֶׁ֥ה עַבְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/056.yaml
  text: Blessed be Yahweh[a], who has given rest to his people Israel, according to all that he spoke. Not one word has failed of all his good words that he spoke by the hand of Moses his servant.
translation:
  language: de
  text: Gepriesen sei Jahwe, der seinem Volk Israel Ruhe geschenkt hat, ganz wie er es gesagt hat. Kein einziges Wort von all seinen guten Worten[a], die er durch seinen Diener Mose gesprochen hat, ist unerfüllt geblieben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Keines von all seinen guten Versprechen ist unerfüllt geblieben“; „Wort“ bezeichnet hier ein gesprochenes Versprechen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Gepriesen sei
  rationale: Die prädikative Segens- und Lobformel wird im Deutschen würdig und natürlich als doxologischer Ausruf wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im modernen Deutschen geläufige Form.
- source_word: נָתַן מְנוּחָה
  choice: Ruhe geschenkt hat
  rationale: Die Wendung bezeichnet die gewährte Ruhe vor Feinden und Unsicherheit. „Ruhe geschenkt“ wahrt den Sinn und klingt im Deutschen natürlich.
- source_word: לְעַמּוֹ יִשְׂרָאֵל
  choice: seinem Volk Israel
  rationale: Die appositionale Verbindung wird knapp und idiomatisch wiedergegeben und bewahrt die Bundesbezeichnung.
- source_word: כְּכֹל אֲשֶׁר דִּבֵּר
  choice: ganz wie er es zugesagt hatte
  rationale: Wörtlich steht „gemäß allem, was er gesprochen hatte“. Im Zusammenhang ist das Gesprochene eine Zusage; „zugesagt“ gibt die Erfüllungsdimension in natürlichem Deutsch wieder.
- source_word: לֹא נָפַל דָּבָר אֶחָד
  choice: Kein einziges Wort … ist unerfüllt geblieben
  rationale: Das hebräische Idiom besagt, dass nichts vom Gesprochenen ausblieb oder wirkungslos wurde. Die Formulierung erhält „Wort“ und vermittelt zugleich den idiomatischen Sinn.
- source_word: מִכֹּל דְּבָרוֹ הַטּוֹב
  choice: von all seinen guten Worten
  rationale: Der Singular hat hier kollektiven Sinn. Der deutsche Plural ist natürlich und passt zur vorausgehenden Aussage „kein einziges Wort“.
- source_word: בְּיַד מֹשֶׁה
  choice: durch … Mose
  rationale: Die hebräische Mittlerformel „durch die Hand Moses“ bezeichnet Vermittlung. „Durch Mose“ ist im modernen Deutschen klarer, ohne den Gedanken der Beauftragung aufzugeben.
- source_word: עַבְדּוֹ
  choice: seinen Diener
  rationale: Bei Mose ist עֶבֶד eine ehrende Bezeichnung für den beauftragten Diener Gottes; „Diener“ ist daher kontextgerecht.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. Die Transliteration bewahrt den Charakter als persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von דָּבָר / דְּבָרוֹ
  choice: Wort / Worte
  alternative: Zusage / Zusagen oder Verheißung / Verheißungen
  rationale: Der Zusammenhang handelt von erfüllten Zusagen, doch der hebräische Text verwendet das allgemeinere „Wort“. Der Haupttext bewahrt diese Wortwahl; die Fußnote nennt die kontextuelle Alternative.
- issue: Aspekt der Erfüllung in לֹא נָפַל
  choice: ist unerfüllt geblieben
  alternative: ist dahingefallen / ist ausgefallen
  rationale: Die Formulierung macht die gemeinte Verlässlichkeit von Gottes Worten verständlich, ohne zu behaupten, das hebräische Verb selbst bedeute ausdrücklich „erfüllen“.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzführung. Die hebräische Bildformel „durch die Hand Moses“ wird idiomatisch als „durch seinen Diener Mose“ wiedergegeben. Der Gottesname erscheint als „Jahwe“.
