revisions:
- from: Und die Priester konnten wegen der Wolke nicht dastehen, um ihren Dienst zu verrichten[a]; denn die Herrlichkeit Jahwes erfüllte das Haus Jahwes[b].
  to: Und die Priester konnten wegen der Wolke nicht stehen, um Dienst zu tun; denn die Herrlichkeit Jahwes erfüllte das Haus Jahwes[a].
  rationale: Die Revision ersetzt das unidiomatische »dastehen, um ihren Dienst zu verrichten« durch »stehen, um Dienst zu tun«. Damit bleiben die beiden hebräischen Infinitive transparent und der priesterlich-kultische Registerwert erhalten. Die unnötige Fußnote a entfällt; die verbliebene Fußnote erläutert den Referenten von »Haus Jahwes«, ohne den Haupttext zu paraphrasieren.
