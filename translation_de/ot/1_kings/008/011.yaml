base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/011.yaml
  text: and the priests were not able to stand to minister because of the cloud[b][a], for the glory of Yahweh filled the house of Yahweh.
translation:
  language: de
  text: Und die Priester konnten wegen der Wolke nicht stehen, um Dienst zu tun; denn die Herrlichkeit Jahwes erfüllte das Haus Jahwes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist der Tempel Jahwes.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָכְלוּ
  choice: konnten nicht
  rationale: Gibt die fehlende Fähigkeit oder Möglichkeit knapp und idiomatisch wieder.
- source_word: הַכֹּהֲנִים
  choice: die Priester
  rationale: Die übliche und kontextgerechte Bezeichnung für die priesterlichen Amtsträger.
- source_word: לַעֲמֹד
  choice: dastehen
  rationale: Bewahrt die Grundbedeutung »stehen« und lässt offen, ob das Einnehmen oder Beibehalten der Dienststellung gemeint ist.
- source_word: לְשָׁרֵת
  choice: ihren Dienst zu verrichten
  rationale: Bezeichnet hier den förmlichen priesterlichen Dienst und klingt im modernen Deutsch natürlicher als das isolierte »dienen«.
- source_word: מִפְּנֵי הֶעָנָן
  choice: wegen der Wolke
  rationale: Die Präpositionalverbindung bezeichnet in diesem Zusammenhang den Grund für die Unfähigkeit der Priester.
- source_word: כִּי
  choice: denn
  rationale: Leitet die Erklärung des vorausgehenden Geschehens ein.
- source_word: מָלֵא
  choice: erfüllte
  rationale: Gibt das Perfekt als abgeschlossenes, die Situation erklärendes Geschehen wieder.
- source_word: כְבוֹד יְהוָה
  choice: die Herrlichkeit Jahwes
  rationale: Bewahrt sowohl die theologisch gewichtige Bildsprache von כבוד als auch die Genitivverbindung.
- source_word: בֵּית יְהוָה
  choice: das Haus Jahwes
  rationale: Folgt der hebräischen Formulierung wörtlich; gemeint ist der Tempel, was die Fußnote erläutert.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen im Deutschen in seiner geläufigen Form wieder, statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen. »Jahwe« bewahrt ihn als Eigennamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von כְבוֹד יְהוָה
  choice: die Herrlichkeit Jahwes
  alternative: die Gegenwart Jahwes
  rationale: »Herrlichkeit« erhält die konkrete und zugleich theologisch offene Bildsprache; eine Deutung als bloße »Gegenwart« wäre enger als der hebräische Ausdruck.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur wahrt den erklärenden Zusammenhang des Hebräischen; »Haus Jahwes« erhält die Ausgangsmetapher, während die Fußnote den gemeinten Tempel nennt.
