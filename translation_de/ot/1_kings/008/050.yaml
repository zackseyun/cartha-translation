source:
  edition: WLC
  text: וְ/סָלַחְתָּ֤ לְ/עַמְּ/ךָ֙ אֲשֶׁ֣ר חָֽטְאוּ לָ֔/ךְ וּ/לְ/כָל פִּשְׁעֵי/הֶ֖ם אֲשֶׁ֣ר פָּשְׁעוּ בָ֑/ךְ וּ/נְתַתָּ֧/ם לְ/רַחֲמִ֛ים לִ/פְנֵ֥י שֹׁבֵי/הֶ֖ם וְ/רִֽחֲמֽוּ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/050.yaml
  text: and forgive your people who have sinned against you[a], and all their transgressions that they have committed against you, and grant them compassion before those who took them captive[b], so that they may have compassion on them.
translation:
  language: de
  text: Und vergib deinem Volk, das gegen dich gesündigt hat, und vergib ihm all seine Vergehen[a], mit denen es sich gegen dich aufgelehnt hat. Lass es in den Augen derer, die es gefangen genommen haben, Erbarmen finden, sodass sie Erbarmen mit ihm haben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Vergehen“ kann hier auch mit „Auflehnungen“ oder „Rebellionen“ wiedergegeben werden; das hebräische Wort hebt den Widerstand gegen Gott hervor.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „damit sie Erbarmen mit ihm haben“; auch: „und sie werden Erbarmen mit ihm haben“. Die Schlusswendung kann als Zweck oder als Folge verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְסָלַחְתָּ
  choice: Und vergib
  rationale: Das Qal-Perfekt der 2. Person Singular steht im Gebetszusammenhang und hat hier bittenden Charakter. Der Imperativ „vergib“ gibt diese Funktion im Deutschen natürlich wieder.
- source_word: לְעַמְּךָ
  choice: deinem Volk
  rationale: Das ל kennzeichnet bei סלח die Person, der vergeben wird. Der deutsche Dativ ist dafür idiomatisch.
- source_word: חָטְאוּ לָךְ
  choice: das gegen dich gesündigt hat
  rationale: חטא mit ל bezeichnet die betroffene Person; „gegen dich sündigen“ ist die natürliche deutsche Entsprechung. Das kollektiv gebrauchte „Volk“ wird im Deutschen singularisch aufgenommen.
- source_word: וּלְכָל־פִּשְׁעֵיהֶם
  choice: und vergib ihm all seine Vergehen
  rationale: פשע bezeichnet schwere Verfehlung beziehungsweise Auflehnung. „Vergehen“ bewahrt die moralisch-theologische Tragweite, ohne die Bedeutung einseitig auf offene Rebellion festzulegen. Die Wiederholung von „vergib ihm“ macht die im Hebräischen elliptische Konstruktion im Deutschen verständlich.
- source_word: אֲשֶׁר פָּשְׁעוּ בָךְ
  choice: mit denen es sich gegen dich aufgelehnt hat
  rationale: Das Verb פשע bringt den Aspekt der Auflehnung deutlich zum Ausdruck und bewahrt, zusammen mit „Vergehen“, sowohl den allgemeinen Schuldbegriff als auch den Gedanken bewusster Rebellion gegen Gott.
- source_word: וּנְתַתָּם לְרַחֲמִים
  choice: Lass es … Erbarmen finden
  rationale: נתן mit לְרַחֲמִים bedeutet, jemanden in eine Lage zu versetzen, in der ihm Erbarmen entgegengebracht wird. Die deutsche Wendung ist natürlich und hält Gott als denjenigen fest, von dem diese günstige Zuwendung erbeten wird.
- source_word: לִפְנֵי שֹׁבֵיהֶם
  choice: bei denen, die es gefangen genommen haben
  rationale: Der Partizipialausdruck bezeichnet die Gefangennehmer. Die Umschreibung vermeidet das im heutigen Deutsch stärker politisch oder strafrechtlich gefärbte „Entführer“ und gibt לִפְנֵי hier idiomatisch mit „bei“ wieder.
- source_word: וְרִחֲמוּם
  choice: sodass sie Erbarmen mit ihm haben
  rationale: Die Form kann Folge oder Zweck ausdrücken. „Sodass“ gibt die resultative Lesart wieder, während die Fußnote die ebenso mögliche finale beziehungsweise schlichte konsekutive Wiedergabe offenhält. Die Wiederholung von „Erbarmen“ bildet das hebräische Wortspiel zwischen רחמים und רחם nach.
theological_decisions:
- issue: Zusammenhang zwischen Gottes Vergebung und dem Erbarmen der Gefangennehmer
  choice: Der Vers wird als Bitte wiedergegeben, Gott möge seinem Volk vergeben und es bei seinen Gefangennehmern Erbarmen finden lassen.
  alternative: 'Die Schlusswendung kann als erwartete Folge formuliert werden: „und sie werden Erbarmen mit ihm haben“, oder final: „damit sie Erbarmen mit ihm haben“.'
  rationale: Die hebräische Satzfolge verbindet Gottes Vergebung und sein Gewähren von Erbarmen mit der barmherzigen Behandlung durch die Gefangennehmer. Die Übersetzung wahrt diesen Zusammenhang, ohne eine weitergehende dogmatische Kausalität festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das kollektiv gebrauchte „Volk“ wird durchgehend im Singular aufgenommen. Die doppelte Verwendung von „Erbarmen“ bewahrt die Wortverwandtschaft des hebräischen Ausdrucks. Die Fußnotenmarker stehen an den inhaltlich passenden Stellen; [a] erläutert פשע, [b] die Mehrdeutigkeit der Schlussklausel.
