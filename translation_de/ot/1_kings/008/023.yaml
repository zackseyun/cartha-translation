source:
  edition: WLC
  text: וַ/יֹּאמַ֗ר יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ אֵין כָּמ֣וֹ/ךָ אֱלֹהִ֔ים בַּ/שָּׁמַ֣יִם מִ/מַּ֔עַל וְ/עַל הָ/אָ֖רֶץ מִ/תָּ֑חַת שֹׁמֵ֤ר הַ/בְּרִית֙ וְֽ/הַ/חֶ֔סֶד לַ/עֲבָדֶ֕י/ךָ הַ/הֹלְכִ֥ים לְ/פָנֶ֖י/ךָ בְּ/כָל לִבָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/023.yaml
  text: And he said[a], “O Yahweh, God of Israel, there is no God like you in heaven above or on earth beneath[b], keeping the covenant and the steadfast love for your servants who walk before you with all their heart.”
translation:
  language: de
  text: 'Und er sagte: „Jahwe, Gott Israels, kein Gott ist wie du, weder oben im Himmel noch unten auf der Erde,[a] der du den Bund und die treue Liebe[b] für deine Diener bewahrst, die vor dir mit ganzem Herzen wandeln.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „oben in den Himmeln und unten auf der Erde“.'
    reason: Die hebräische Form שָׁמַיִם ist formal ein Plural; im natürlichen Deutschen steht hier meist „Himmel“ im Singular.
  - marker: b
    text: Hebräisch chesed; das Wort kann treue Liebe, verlässliche Güte und besonders im Bundeskontext loyale Verbundenheit bezeichnen.
    reason: Der Bedeutungsumfang des hebräischen Schlüsselbegriffs lässt sich nicht vollständig mit einem einzigen deutschen Ausdruck wiedergeben.
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Und er sagte
  rationale: Gibt die fortlaufende hebräische Erzählform schlicht wieder, ohne den zeitlichen oder logischen Zusammenhang stärker festzulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֵין כָּמוֹךָ אֱלֹהִים
  choice: kein Gott ist wie du
  rationale: Bewahrt die Aussage von Jahwes Unvergleichlichkeit und lässt die sprachliche Spannung des hebräischen אֱלֹהִים bestehen, ohne sie unnötig auszudeuten.
- source_word: בַּשָּׁמַיִם מִמַּעַל וְעַל הָאָרֶץ מִתָּחַת
  choice: weder oben im Himmel noch unten auf der Erde
  rationale: Natürliches modernes Deutsch für die umfassende Gegenüberstellung der oberen und unteren Bereiche; die formale Mehrzahl von שָׁמַיִם wird in der Fußnote vermerkt.
- source_word: שֹׁמֵר הַבְּרִית וְהַחֶסֶד
  choice: Du bewahrst … den Bund und die treue Liebe
  rationale: Der partizipiale Ausdruck beschreibt Jahwes beständiges Handeln. „Bewahren“ kann im Deutschen beide Objekte umfassen und erhält ihre enge Verbindung.
- source_word: חֶסֶד
  choice: treue Liebe
  rationale: Bringt sowohl Zuwendung als auch verlässliche, bundestreue Loyalität zum Ausdruck, ohne den Begriff auf bloße Barmherzigkeit oder Gefühl zu verengen.
- source_word: לַעֲבָדֶיךָ
  choice: deinen Dienern
  rationale: „Diener“ entspricht im Gebets- und Bundeskontext der relationalen Bedeutung besser als das sozialrechtlich engere „Sklaven“.
- source_word: הַהֹלְכִים לְפָנֶיךָ
  choice: die … vor dir ihren Weg gehen
  rationale: Bewahrt das hebräische Bild des Gehens und verdeutlicht zugleich, dass es um die Lebensführung in Gottes Gegenwart geht.
- source_word: בְּכָל לִבָּם
  choice: mit ganzem Herzen
  rationale: Idiomtische deutsche Wiedergabe für ungeteilte innere Hingabe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der persönliche Name des Gottes Israels bleibt als Name erkennbar und wird nicht durch einen Titel ersetzt.
- issue: Aussage אֵין כָּמוֹךָ אֱלֹהִים
  choice: kein Gott ist wie du
  alternative: niemand unter den Göttern ist wie du
  rationale: Die gewählte Formulierung betont Jahwes Unvergleichlichkeit, ohne ausdrücklich über den ontologischen Status anderer Götter zu entscheiden.
- issue: Bundesbezogene Bedeutung von חֶסֶד
  choice: treue Liebe
  alternative: Güte; Barmherzigkeit; Bundestreue
  rationale: „Treue Liebe“ hält Zuneigung und verlässliche Loyalität zusammen und vermeidet eine konfessionell verengende Deutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede bleibt feierlich, ohne das im Hebräischen nicht ausdrücklich vorhandene „O“ einzufügen. Das Bild vom Gehen vor Gott wird in verständlicher Form erhalten.
