revisions:
- from: 'Und er sagte: „Jahwe, Gott Israels, kein Gott ist wie du, weder oben im Himmel noch unten auf der Erde.[a] Du bewahrst deinen Dienern, die mit ganzem Herzen vor dir ihren Weg gehen, den Bund und die treue Liebe.[b]“'
  to: 'Und er sagte: „Jahwe, Gott Israels, kein Gott ist wie du, weder oben im Himmel noch unten auf der Erde,[a] der du den Bund und die treue Liebe[b] für deine Diener bewahrst, die vor dir mit ganzem Herzen wandeln.“'
  rationale: 'Die Revision behält alle tragenden Entscheidungen des Entwurfs bei, stellt aber die hebräische Satzstruktur enger nach: Jahwe wird unmittelbar als derjenige beschrieben, der Bund und ḥesed für seine Diener bewahrt. Die Ergänzung „ihren Weg“ entfällt, damit das Bild des Wandelns vor Gott ohne interpretierende Ausweitung erhalten bleibt. Die Fußnotenanker stehen weiterhin bei den jeweils erläuterten Ausdrücken.'
