  to: 'Und nun, Jahwe, Gott Israels, halte deinem Diener David, meinem Vater, was du ihm zugesagt hast: »Es soll dir nicht an einem Mann fehlen, der vor mir auf dem Thron Israels sitzt – jedoch nur, wenn deine Söhne ihren Weg bewahren, indem sie vor mir leben, wie du vor mir gelebt hast.«'
