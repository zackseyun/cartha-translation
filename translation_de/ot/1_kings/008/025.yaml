    issue: „nie“ ergänzt eine zeitliche Verstärkung.
    rationale: Der hebräische Ausdruck formuliert die dynastische Zusage als künftiges Nicht-Fehlen; ein ausdrückliches „nie“ steht nicht im Text.
  - severity: low
    issue: Die Stellung von „vor mir“ kann syntaktisch missverständlich wirken.
    rationale: Im Hebräischen gehört מִלְּפָנַי zur dynastischen Nicht-Ausrottungsformel. Im Deutschen wird der Bezug klarer, wenn „vor mir“ bei dem Throninhaber steht.
  - severity: low
    issue: „auf ihren Weg achten“ gibt שׁמר ... אֶת־דַּרְכָּם nur angenähert wieder.
    rationale: Die Wendung meint das Bewahren bzw. Beachten des eigenen Lebenswegs; „ihren Weg bewahren“ bewahrt das Bild und die ethische Ausrichtung genauer.
