source:
  edition: WLC
  text: וְ/עַתָּ֞ה יְהוָ֣ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל שְׁ֠מֹר לְ/עַבְדְּ/ךָ֨ דָוִ֤ד אָבִ/י֙ אֵת֩ אֲשֶׁ֨ר דִּבַּ֤רְתָּ לּ/וֹ֙ לֵ/אמֹ֔ר לֹא יִכָּרֵ֨ת לְ/ךָ֥ אִישׁ֙ מִ/לְּ/פָנַ֔/י יֹשֵׁ֖ב עַל כִּסֵּ֣א יִשְׂרָאֵ֑ל רַ֠ק אִם יִשְׁמְר֨וּ בָנֶ֤י/ךָ אֶת דַּרְכָּ/ם֙ לָ/לֶ֣כֶת לְ/פָנַ֔/י כַּ/אֲשֶׁ֥ר הָלַ֖כְתָּ לְ/פָנָֽ/י׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/025.yaml
  text: And now[a], Yahweh, God of Israel, keep for your servant David my father what you spoke to him, saying, ‘A man shall not be cut off from before me for you, one sitting on the throne of Israel, if only your sons keep their way, by walking before me as you have walked before me.’
translation:
  language: de
  text: 'Und nun, Jahwe, Gott Israels, halte deinem Diener David, meinem Vater, was du ihm zugesagt hast: »Es soll dir nicht an einem Mann fehlen, der vor mir auf dem Thron Israels sitzt – jedoch nur, wenn deine Söhne ihren Weg bewahren, indem sie vor mir leben, wie du vor mir gelebt hast.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen im Deutschen in seiner etablierten wissenschaftlichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: שְׁמֹר ... אֵת אֲשֶׁר דִּבַּרְתָּ לוֹ
  choice: halte ... was du ihm zugesagt hast
  rationale: Im Gebetszusammenhang ist das Gesprochene eine Zusage. „Halte“ bewahrt die hebräische Verbwahl, während „zugesagt“ den Gegenstand im Deutschen natürlich bezeichnet.
- source_word: לְעַבְדְּךָ דָוִד אָבִי
  choice: deinem Diener David, meinem Vater
  rationale: „Diener“ passt zur demütigen Bundes- und Gebetssprache; die Apposition ist im Deutschen klar und würdig.
- source_word: לֹא יִכָּרֵת לְךָ אִישׁ מִלְּפָנַי
  choice: Es soll dir vor mir nie an einem Mann fehlen
  rationale: Gibt die hebräische dynastische Redewendung idiomatisch wieder. Eine wörtliche Wiedergabe mit „abgeschnitten werden“ wäre im Deutschen missverständlich und unnatürlich.
- source_word: יֹשֵׁב עַל כִּסֵּא יִשְׂרָאֵל
  choice: der auf dem Thron Israels sitzt
  rationale: Gibt das substantivierte Partizip flüssig wieder und bezeichnet den fortdauernden königlichen Nachfolger.
- source_word: רַק אִם
  choice: jedoch nur, wenn
  rationale: Bewahrt die ausdrücklich einschränkende Bedingung und vermeidet das im Deutschen mehrdeutige „wenn nur“.
- source_word: יִשְׁמְרוּ בָנֶיךָ אֶת דַּרְכָּם
  choice: deine Söhne auf ihren Weg achten
  rationale: Gibt das Bild des Wachens über den eigenen Lebenswandel verständlich wieder, ohne es auf bloßen Regelgehorsam zu verengen.
- source_word: לָלֶכֶת לְפָנַי
  choice: vor mir leben
  rationale: „Gehen/wandeln vor Gott“ ist eine hebräische Lebenswandel-Metapher; „vor mir leben“ vermittelt sie in natürlichem modernem Deutsch.
- source_word: כַּאֲשֶׁר הָלַכְתָּ לְפָנָי
  choice: wie du vor mir gelebt hast
  rationale: Bewahrt den Vergleich mit Davids Lebensführung und den Rückbezug innerhalb der zitierten Zusage.
theological_decisions:
- issue: Bedingtheit der davidischen Zusage in diesem Vers
  choice: Die Fortdauer der Dynastie wird hier ausdrücklich an den Lebenswandel von Davids Söhnen gebunden.
  alternative: Die Zusage sei an sich unbedingt, während die Bedingung nur ihre geschichtliche Erfahrung betreffe.
  rationale: רַק אִם leitet grammatisch eine deutliche Bedingung ein. Die Übersetzung bewahrt diese Spannung, ohne sie durch eine systematisch-theologische Deutung anderer Texte aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt gebetsnah, vermeidet aber unverständliche Hebraismen. Der Gottesname wird als „Jahwe“ wiedergegeben; die dynastische Redewendung wird idiomatisch übersetzt.
