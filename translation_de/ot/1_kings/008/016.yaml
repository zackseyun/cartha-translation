source:
  edition: WLC
  text: מִן הַ/יּ֗וֹם אֲשֶׁ֨ר הוֹצֵ֜אתִי אֶת עַמִּ֣/י אֶת יִשְׂרָאֵל֮ מִ/מִּצְרַיִם֒ לֹֽא בָחַ֣רְתִּי בְ/עִ֗יר מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל לִ/בְנ֣וֹת בַּ֔יִת לִ/הְי֥וֹת שְׁמִ֖/י שָׁ֑ם וָ/אֶבְחַ֣ר בְּ/דָוִ֔ד לִֽ/הְי֖וֹת עַל עַמִּ֥/י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/016.yaml
  text: From the day that I brought my people Israel out of Egypt[a], I have not chosen a city from all the tribes of Israel to build a house for my name to be there[b], but I chose David to be over my people Israel.
translation:
  language: de
  text: Seit dem Tag, an dem ich mein Volk Israel aus Ägypten herausgeführt habe, habe ich aus allen Stämmen Israels keine Stadt erwählt, um dort ein Haus zu bauen, damit mein Name dort sei.[a] Aber David habe ich erwählt, dass er über mein Volk Israel sein sollte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Ein Haus, damit mein Name dort sei“ bezeichnet ein Heiligtum, das mit dem Namen des HERRN verbunden ist; im Zusammenhang ist der Tempel gemeint.
    reason: cultural_note
  - marker: b
    text: 'Oder: „Und David habe ich erwählt.“ Die hebräische Verbindung kann nebenordnend verstanden werden; der Zusammenhang legt jedoch einen Gegensatz nahe: Keine Stadt war erwählt, David dagegen schon.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹצֵאתִי
  choice: ich ... herausgeführt habe
  rationale: Der Hifil von יצא bezeichnet das Herausführen. Die Formulierung ist im modernen Deutschen natürlich und bewahrt den kausativen Sinn.
- source_word: עַמִּי אֶת־יִשְׂרָאֵל
  choice: mein Volk Israel
  rationale: Die Apposition bestimmt das Volk als Israel; die unmarkierte deutsche Verbindung ist klar und idiomatisch.
- source_word: לֹא בָחַרְתִּי בְעִיר מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: habe ich aus allen Stämmen Israels keine Stadt erwählt
  rationale: Die Formulierung bewahrt die komprimierte Zuordnung einer Stadt zu den Stämmen und gibt die Verneinung im Deutschen natürlich wieder.
- source_word: לִבְנוֹת בַּיִת
  choice: um ein Haus zu bauen
  rationale: „Haus“ erhält das hebräische Bild, statt den Bezug bereits im Haupttext mit „Tempel“ auszudeuten.
- source_word: לִהְיוֹת שְׁמִי שָׁם
  choice: damit mein Name dort sei
  rationale: Die Übersetzung bleibt beim schlichten Verb „sein“ und vermeidet die interpretierende Erweiterung „wohnen“.
- source_word: וָאֶבְחַר בְּדָוִד
  choice: Aber David habe ich erwählt
  rationale: Das adversative „Aber“ macht den sachlichen Gegensatz zwischen der nicht erwählten Stadt und dem erwählten David deutlich; die Voranstellung Davids spiegelt den Kontrast.
- source_word: לִהְיוֹת עַל־עַמִּי יִשְׂרָאֵל
  choice: über mein Volk Israel zu sein
  rationale: Die Formulierung bewahrt die offene Bedeutung von „über ... sein“, ohne sie ausdrücklich als „herrschen“ oder „regieren“ festzulegen.
theological_decisions:
- issue: Tempeltheologie in „ein Haus ... damit mein Name dort sei“
  choice: Das hebräische Bild und die Rede vom Dortsein des Namens bleiben im Haupttext erhalten.
  alternative: „einen Tempel zu bauen, in dem mein Name wohnt“
  rationale: So bleibt die für das deuteronomistische Geschichtswerk charakteristische Namenstheologie sichtbar, ohne Gottes Gegenwart durch eine erklärende Paraphrase näher festzulegen.
- issue: Gegensatz zwischen der Erwählung einer Stadt und der Erwählung Davids
  choice: Das Waw wird mit „Aber“ adversativ wiedergegeben.
  alternative: „Und David habe ich erwählt“
  rationale: Der Kontext stellt die bislang nicht erfolgte Erwählung einer Stadt der erfolgten Erwählung Davids gegenüber. Die alternative koordinierende Lesart bleibt in einer Fußnote erkennbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Erwählt“ bewahrt den theologischen Klang von בחר, ohne konfessionelle Zusätze. Die Satzstruktur bleibt quellennah, ist aber durch zwei Hauptsätze gut lesbar.
