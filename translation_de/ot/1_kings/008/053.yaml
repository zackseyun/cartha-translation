base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/053.yaml
  text: For you set them apart for yourself as an inheritance from all the peoples of the earth[a], just as you spoke by the hand of Moses your servant when you brought our fathers out from Egypt[c][b], Lord GOD.
translation:
  language: de
  text: Denn du hast sie für dich als Erbbesitz aus allen Völkern der Erde ausgesondert, wie du durch deinen Diener Mose[a] gesagt hast, als du unsere Väter aus Ägypten herausführtest, Herr Jahwe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „durch die Hand deines Dieners Mose“.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: Adonaj JHWH, das heißt „Herr Jahwe“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִבְדַּלְתָּם
  choice: du hast sie … ausgesondert
  rationale: Der Hifil von בדל bezeichnet ein Absondern oder Aussondern. „Ausgesondert“ bewahrt den Gedanken einer bewussten Trennung, ohne eine weitergehende kultische Bedeutung einzutragen.
- source_word: לְךָ לְנַחֲלָה
  choice: für dich als Erbbesitz
  rationale: Die Wendung beschreibt das Volk als Gottes eigenen נחלה, also als zugeteilten, bleibenden Besitz. „Erbbesitz“ erhält die biblische Besitz- und Bundesmetaphorik deutlicher als das allgemeinere „Eigentum“.
- source_word: מִכֹּל עַמֵּי הָאָרֶץ
  choice: aus allen Völkern der Erde
  rationale: Der Ausdruck stellt Israel den Völkern insgesamt gegenüber. „Erde“ gibt den hier naheliegenden umfassenden Sinn von הָאָרֶץ wieder.
- source_word: כַּאֲשֶׁר דִּבַּרְתָּ
  choice: wie du … gesagt hast
  rationale: כַּאֲשֶׁר bezeichnet die Entsprechung zu Gottes früherem Reden. Im Deutschen ist „wie du gesagt hast“ natürlicher als „wie du gesprochen hast“.
- source_word: בְּיַד מֹשֶׁה עַבְדֶּךָ
  choice: durch deinen Diener Mose
  rationale: Die hebräische Wendung „durch die Hand“ bezeichnet Mose als Vermittler. Die idiomatische deutsche Wiedergabe „durch“ vermittelt diese Funktion klar; die wörtliche Form wird in der Fußnote genannt.
- source_word: בְּהוֹצִיאֲךָ
  choice: als du … herausführtest
  rationale: Die Präposition בְּ am Infinitiv bezeichnet hier den zeitlichen Umstand. „Als du … herausführtest“ gibt diesen Sinn natürlich wieder.
- source_word: אֶת אֲבֹתֵינוּ
  choice: unsere Väter
  rationale: Die maskuline Bezeichnung אֲבוֹת wird direkt wiedergegeben und bezeichnet hier die früheren Generationen Israels. „Vorfahren“ wäre ebenfalls möglich, würde die traditionelle Verwandtschaftsbezeichnung jedoch verallgemeinern.
- source_word: מִמִּצְרַיִם
  choice: aus Ägypten
  rationale: Die Präposition מִן bezeichnet die Bewegung aus Ägypten heraus; zusammen mit „herausführtest“ ist der deutsche Ausdruck klar und nicht unnötig doppelt.
- source_word: אֲדֹנָי יְהוִה
  choice: Herr, Jahwe
  rationale: Die Wiedergabe unterscheidet den Titel אֲדֹנָי vom Gottesnamen יהוה und vermeidet das missverständliche deutsche „Herr HERR“. Die Anredeform wird durch das Komma kenntlich gemacht.
theological_decisions:
- issue: Wiedergabe von נחלה für Gottes Verhältnis zu Israel
  choice: Erbbesitz
  alternative: Eigentum
  rationale: „Erbbesitz“ bewahrt die spannungsreiche biblische Metapher, nach der das Volk Gottes eigener Anteil beziehungsweise Besitz ist, ohne sie zu einer abstrakten Aussage über Eigentum zu verflachen.
- issue: Wiedergabe der Verbindung אֲדֹנָי יְהוִה
  choice: Herr, Jahwe
  alternative: Herr HERR
  rationale: Der erste Ausdruck ist ein Titel, der zweite der Gottesname. „Herr, Jahwe“ macht beide Bestandteile sichtbar und vermeidet, sie im Deutschen zu einem einzigen Titel zusammenzuziehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit moderat bibelsprachlicher Prägung. Die Satzstruktur des hebräischen Gebets bleibt erkennbar, wird aber idiomatisch gegliedert. „Erbbesitz“, „Väter“ und „Jahwe“ bewahren zentrale Begriffe des Ausgangstextes; die ungewöhnliche hebräische Vermittlungsformel wird im Haupttext natürlich und in der Fußnote wörtlich wiedergegeben.
