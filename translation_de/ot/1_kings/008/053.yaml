  terminology: Die Wiedergabe des Gottesnamens als „Jahwe“ entspricht der vorgegebenen Entscheidung. „Herr Jahwe“ erhält sowohl אֲדֹנָי als auch יהוה. Die übrigen Schlüsselbegriffe sind angemessen und ohne konfessionelle Überdeutung wiedergegeben.
