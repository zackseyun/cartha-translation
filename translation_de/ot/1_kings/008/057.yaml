id: 1KI.8.57
reference: 1 Kings 8:57
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יְהִ֨י יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ עִמָּ֔/נוּ כַּ/אֲשֶׁ֥ר הָיָ֖ה עִם אֲבֹתֵ֑י/נוּ אַל יַעַזְבֵ֖/נוּ וְ/אַֽל יִטְּשֵֽׁ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/057.yaml
  text: May Yahweh our God be with us[a], as he was with our fathers. May he not forsake us or abandon us.
translation:
  language: de
  text: Yahweh, unser Gott, sei mit uns, wie er mit unseren Vätern[a] war. Er verlasse uns nicht und gebe uns nicht preis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Vorfahren«. Wörtlich steht im Hebräischen »Väter«; gemeint sind Israels Vorväter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: sei
  rationale: Der Qal-Jussiv von היה drückt hier im Gebet einen Wunsch aus; der deutsche Konjunktiv I »sei« gibt diese Kraft knapp und würdig wieder.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהֵינוּ
  choice: unser Gott
  rationale: Die Konstruktverbindung mit dem Suffix der 1. Person Plural bedeutet unmittelbar »unser Gott«.
- source_word: עִמָּנוּ
  choice: mit uns
  rationale: עִם bezeichnet hier Gottes begleitende Gegenwart bei seinem Volk.
- source_word: כַּאֲשֶׁר
  choice: wie
  rationale: Die Konjunktion leitet den Vergleich mit Gottes Gegenwart bei den früheren Generationen ein.
- source_word: הָיָה עִם אֲבֹתֵינוּ
  choice: wie er mit unseren Vätern war
  rationale: »Väter« bewahrt die konkrete maskuline Bezeichnung des Hebräischen; eine Fußnote nennt die kontextuell mögliche Wiedergabe »Vorfahren«.
- source_word: אַל יַעַזְבֵנוּ
  choice: Er verlasse uns nicht
  rationale: Der negative Jussiv bringt die Bitte zum Ausdruck, Gott möge sein Volk nicht verlassen.
- source_word: וְאַל יִטְּשֵׁנוּ
  choice: und gebe uns nicht preis
  rationale: נטש verstärkt die vorausgehende Bitte und kann das schutzlose Zurücklassen oder Preisgeben bezeichnen; die Wiedergabe wahrt den Unterschied zu עזב.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Im Ausgangstext steht der Tetragrammaton als persönlicher Gottesname. »Yahweh« bewahrt den Namen, ohne ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von אֲבֹתֵינוּ
  choice: unsere Väter
  alternative: unsere Vorfahren
  rationale: Die Hauptfassung folgt der ausdrücklichen maskulinen Form des Hebräischen; im Zusammenhang sind Israels Vorväter beziehungsweise Vorfahren gemeint, was die Fußnote offenlegt.
- issue: Verhältnis der Verben עזב und נטש
  choice: verlassen / preisgeben
  alternative: verlassen / im Stich lassen
  rationale: Die zwei annähernd synonymen Verben werden nicht zu einer bloßen Wiederholung eingeebnet. »Preisgeben« erhält bei נטש den Gedanken des schutzlosen Zurücklassens.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch. Die jussivischen Formen werden durch den Konjunktiv I wiedergegeben; Satzbau und Wortwahl bleiben für heutige Leser verständlich.
