source:
  edition: WLC
  text: רָעָ֞ב כִּֽי יִהְיֶ֣ה בָ/אָ֗רֶץ דֶּ֣בֶר כִּֽי יִ֠הְיֶה שִׁדָּפ֨וֹן יֵרָק֜וֹן אַרְבֶּ֤ה חָסִיל֙ כִּ֣י יִהְיֶ֔ה כִּ֧י יָֽצַר ל֛/וֹ אֹיְב֖/וֹ בְּ/אֶ֣רֶץ שְׁעָרָ֑י/ו כָּל נֶ֖גַע כָּֽל מַחֲלָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/037.yaml
  text: If there is famine in the land[a], if there is pestilence, blight, mildew, locust, or caterpillar; if his enemy besieges him in the land of his gates; whatever plague[b], whatever sickness—
translation:
  language: de
  text: Wenn im Land eine Hungersnot herrscht, wenn eine Seuche ausbricht, wenn Getreidebrand, Mehltau, Heuschrecken oder Fressheuschrecken[a] auftreten, wenn sein Feind ihn im Land seiner Städte[b] belagert – welche Plage, welche Krankheit es auch sei –
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet ein gefräßiges Insekt, möglicherweise eine bestimmte Art oder Entwicklungsstufe der Heuschrecke.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „im Land seiner Tore“; die Tore stehen hier für die befestigten Orte oder Städte des Landes.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָב
  choice: Hungersnot
  rationale: In dieser Aufzählung landesweiter Katastrophen bezeichnet das Wort nicht gewöhnlichen Hunger, sondern eine Hungersnot.
- source_word: דֶּבֶר
  choice: Seuche
  rationale: Das Wort bezeichnet eine epidemische Krankheit; „Seuche“ ist im modernen Deutschen verständlich und bleibt von der späteren allgemeineren „Plage“ unterschieden.
- source_word: שִׁדָּפוֹן
  choice: Getreidebrand
  rationale: Gemeint ist eine vernichtende Schädigung der Feldfrucht, möglicherweise durch sengenden Wind; „Getreidebrand“ macht den landwirtschaftlichen Zusammenhang deutlich.
- source_word: יֵרָקוֹן
  choice: Mehltau
  rationale: Im landwirtschaftlichen Zusammenhang bezeichnet das Wort eine Vergilbung oder Pflanzenkrankheit; „Mehltau“ ist die geläufige traditionelle Wiedergabe.
- source_word: אַרְבֶּה
  choice: Heuschrecken
  rationale: Das hebräische Kollektivwort ist die übliche Bezeichnung für Heuschrecken.
- source_word: חָסִיל
  choice: Fressheuschrecken
  rationale: Das genaue Insekt ist unsicher. Die Wiedergabe betont seine verheerende Fraßtätigkeit, ohne es als Raupe festzulegen; die Unsicherheit wird in einer Fußnote offengelegt.
- source_word: כִּי יָצַר לוֹ אֹיְבוֹ
  choice: wenn sein Feind ihn … belagert
  rationale: Die Hifil-Form von צור bezeichnet hier das militärische Einschließen beziehungsweise Belagern. Die maskulinen Pronomen bleiben erhalten und beziehen sich im Zusammenhang kollektiv auf Israel beziehungsweise das Volk.
- source_word: בְּאֶרֶץ שְׁעָרָיו
  choice: in einer seiner Städte
  rationale: Wörtlich ist von „dem Land seiner Tore“ die Rede. Da Tore metonymisch für befestigte Orte oder Städte stehen, gibt die Hauptübersetzung den Sinn natürlich wieder; die Bildsprache wird in der Fußnote dokumentiert.
- source_word: כָּל נֶגַע
  choice: welche Plage … es auch sei
  rationale: כָּל verleiht der Aussage umfassenden Charakter; נֶגַע ist ein breiter Begriff für Plage, Schlag oder Heimsuchung.
- source_word: כָּל מַחֲלָה
  choice: welche Krankheit es auch sei
  rationale: Der allgemeine Begriff für Krankheit bleibt von der umfassenderen „Plage“ unterschieden und wird in eine natürliche deutsche Paarkonstruktion eingebunden.
theological_decisions:
- issue: Bezug der männlichen Pronomen in „sein Feind ihn“
  choice: Die Pronomen werden formal bewahrt und kollektiv auf Israel beziehungsweise das Volk bezogen.
  alternative: Explizit „wenn Israels Feind das Volk … belagert“
  rationale: Der hebräische Text nennt den Bezug an dieser Stelle nicht ausdrücklich. Die gewählte Fassung vermeidet eine erklärende Festlegung im Haupttext und erhält die syntaktische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Wenn-Struktur bildet den hebräischen Katastrophenkatalog nach; der abschließende Gedankenstrich zeigt an, dass der Satz im folgenden Vers weitergeführt wird. Die Fußnotenmarker [a] und [b] stehen jeweils unmittelbar bei dem erklärungsbedürftigen Ausdruck.
