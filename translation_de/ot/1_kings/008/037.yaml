  to: Wenn im Land eine Hungersnot herrscht, wenn eine Seuche ausbricht, wenn Getreidebrand, Mehltau, Heuschrecken oder Fressheuschrecken[a] auftreten, wenn sein Feind ihn im Land seiner Städte[b] belagert – welche Plage, welche Krankheit es auch sei –
  rationale: Die Übersetzung wird nur bei der Ortsangabe revidiert. „Im Land seiner Städte“ gibt die hebräische Verbindung von Land und „Toren“ näher wieder, ohne die idiomatische Deutung der Tore als Städte aufzugeben oder eine einzelne Stadt hinzuzufügen. Die fortlaufende Satzstruktur und der abschließende Gedankenstrich bleiben erhalten, da der Satz im folgenden Vers weitergeführt wird.
