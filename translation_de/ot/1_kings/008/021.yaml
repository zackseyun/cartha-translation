  text: וָ/אָשִׂ֨ם שָׁ֤ם מָקוֹם֙ לָֽ/אָר֔וֹן אֲשֶׁר שָׁ֖ם בְּרִ֣ית יְהוָ֑ה אֲשֶׁ֤ר כָּרַת֙ עִם אֲבֹתֵ֔י/נוּ בְּ/הוֹצִיא֥/וֹ אֹתָ֖/ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/021.yaml
  text: And there I have set a place for the ark[b][a], in which is the covenant of Yahweh that he made with our fathers when he brought them out of the land of Egypt.
translation:
  language: de
  text: Und dort habe ich einen Platz für die Lade eingerichtet, in der sich der Bund Jahwes befindet, den er mit unseren Vätern[b] geschlossen[a] hat, als er sie aus dem Land Ägypten herausführte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „den er mit unseren Vätern geschnitten hat“; „einen Bund schneiden“ ist die hebräische Wendung für „einen Bund schließen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mit unseren Vorfahren“. Hebräisch: „mit unseren Vätern“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָשִׂם שָׁם מָקוֹם
  choice: Und dort habe ich einen Platz … eingerichtet
  rationale: שׂים bedeutet grundsätzlich „setzen, stellen, legen“. Mit מָקוֹם ist „einen Platz einrichten“ im Deutschen natürlich und bewahrt den Gedanken einer vollendeten, gezielten Handlung.
- source_word: לָאָרוֹן
  choice: für die Lade
  rationale: אָרוֹן bezeichnet hier die heilige Lade. Der unmittelbare Zusammenhang macht einen erklärenden Zusatz wie „Bundeslade“ entbehrlich.
- source_word: אֲשֶׁר שָׁם בְּרִית יְהוָה
  choice: in der sich der Bund Jahwes befindet
  rationale: Die knappe hebräische Ortskonstruktion wird im Deutschen als Relativsatz wiedergegeben. Dabei bleibt die Aussage bestehen, dass der Bund sich in der Lade befindet, ohne ihn ausdrücklich mit den Tafeln gleichzusetzen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: כָּרַת
  choice: geschlossen
  rationale: כרת bedeutet wörtlich „schneiden“, bildet mit בְּרִית jedoch die feste Wendung „einen Bund schließen“. Die deutsche Bundesformel gibt die Bedeutung idiomatisch wieder.
- source_word: עִם אֲבֹתֵינוּ
  choice: mit unseren Vätern
  rationale: אֲבוֹת ist ausdrücklich die maskuline Pluralform „Väter“. Die mögliche umfassendere Bedeutung „Vorfahren“ wird in einer Fußnote genannt.
- source_word: בְּהוֹצִיאוֹ אֹתָם
  choice: als er sie … herausführte
  rationale: Der Infinitiv mit בְּ ist hier temporal. Der Hifil von יצא bezeichnet das Herausführen; das Pronomen bezieht sich auf die Väter beziehungsweise Vorfahren.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: aus dem Land Ägypten
  rationale: Die Formulierung gibt die Herkunfts- und Bewegungsangabe der Exodusformel direkt und natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. Die Transliteration bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von אֲבֹתֵינוּ
  choice: unsere Väter
  alternative: unsere Vorfahren
  rationale: Die Hauptfassung erhält die konkrete maskuline Bezeichnung des Hebräischen. Eine Fußnote weist darauf hin, dass „Väter“ im Zusammenhang die früheren Generationen Israels insgesamt bezeichnen kann.
- issue: Der Bund als Inhalt der Lade
  choice: in der sich der Bund Jahwes befindet
  alternative: in der sich die Tafeln des Bundes Jahwes befinden
  rationale: Der Vers selbst nennt „den Bund“ und nicht ausdrücklich die Bundestafeln. Die Übersetzung erklärt diese metonymische Ausdrucksweise nicht im Haupttext und bewahrt so die Formulierung und Spannung der Quelle.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Lade“ und „Bund“ bleiben als vertraute biblische Begriffe erhalten. Der Satzbau folgt der hebräischen Gedankenfolge, ist aber für heutige Leser flüssig gegliedert.
