  text: וְ/שָׁמַעְתָּ֙ הַ/שָּׁמַ֔יִם אֶת תְּפִלָּתָ֖/ם וְ/אֶת תְּחִנָּתָ֑/ם וְ/עָשִׂ֖יתָ מִשְׁפָּטָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/045.yaml
  text: then hear in heaven their prayer and their plea[b][a], and uphold their cause.
translation:
  language: de
  text: Dann höre im Himmel[a] ihr Gebet und ihr Flehen und verhilf ihnen zu ihrem Recht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Himmel“; in dieser Gebetsformel ist „im Himmel“ gemeint. Auch „vom Himmel her“ ist dem Sinn nach möglich, doch die entsprechende hebräische Präposition steht hier nicht.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „führe ihre Rechtssache“ oder „übe Recht für sie“. Wörtlich: „tue/vollziehe ihr Recht (oder: Gericht)“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: Dann höre
  rationale: Das Qal Perfekt 2. Person maskulin Singular steht in diesem Gebetszusammenhang als Bitte an Gott. Das einleitende וְ führt die Bedingungsfolge des vorangehenden Kontextes weiter; „dann“ gibt diesen Zusammenhang im Deutschen natürlich wieder.
- source_word: הַשָּׁמַיִם
  choice: im Himmel
  rationale: Die hebräische Form lautet wörtlich „die Himmel“. In der wiederkehrenden Gebetsformel ist „im Himmel“ im Deutschen idiomatisch und gibt den gemeinten Ort wieder, ohne das im Hebräischen nicht ausdrücklich vorhandene „vom Himmel her“ einzuführen.
- source_word: תְּפִלָּתָם
  choice: ihr Gebet
  rationale: תְּפִלָּה ist die allgemeine Bezeichnung für Gebet. Der Singular mit Pluralsuffix wird kollektiv und natürlich als „ihr Gebet“ wiedergegeben.
- source_word: תְּחִנָּתָם
  choice: ihr Flehen
  rationale: תְּחִנָּה bezeichnet eine inständige Bitte um Gunst oder Erbarmen. „Flehen“ ist gegenwärtiges, verständliches Deutsch und bewahrt die stärkere Nuance gegenüber „Gebet“.
- source_word: וְעָשִׂיתָ מִשְׁפָּטָם
  choice: und verhilf ihnen zu ihrem Recht
  rationale: Wörtlich heißt die Wendung „und tue/vollziehe ihr Recht/Gericht“. Gemeint ist, zugunsten der Betenden Recht zu schaffen beziehungsweise ihre Sache zu vertreten. Die gewählte Formulierung bewahrt den gerichtlichen Sinn in natürlichem Deutsch.
theological_decisions:
- issue: Gerichtliche Wendung in der Bitte an Gott
  choice: „verhilf ihnen zu ihrem Recht“ als Bitte, dass Gott zugunsten seines Volkes Recht schafft
  alternative: „führe ihre Rechtssache“ oder „übe Recht für sie“
  rationale: Die Wendung עשה משפט kann das Vollziehen von Recht zugunsten einer Person bezeichnen. Die Übersetzung lässt offen, auf welche konkrete Weise Gott Recht schafft, und trägt keine engere konfessionelle Deutung ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Flehen“ wahrt die Intensität der zweiten Gebetsbezeichnung; „verhilf ihnen zu ihrem Recht“ gibt die hebräische Rechtswendung verständlich wieder, ohne ihre gerichtliche Spannung aufzulösen.
