  text: וַ/יָּבִ֣אוּ הַ֠/כֹּהֲנִים אֶת אֲר֨וֹן בְּרִית יְהוָ֧ה אֶל מְקוֹמ֛/וֹ אֶל דְּבִ֥יר הַ/בַּ֖יִת אֶל קֹ֣דֶשׁ הַ/קֳּדָשִׁ֑ים אֶל תַּ֖חַת כַּנְפֵ֥י הַ/כְּרוּבִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/006.yaml
  text: Then the priests brought the ark of the covenant of Yahweh to its place[a], into the inner sanctuary of the house, into the Most Holy Place[b], under the wings of the cherubim.
translation:
  language: de
  text: Dann brachten die Priester die Bundeslade Jahwes an ihren Platz, in den innersten Raum des Hauses, in das Allerheiligste, unter die Flügel der Kerubim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבִאוּ
  choice: Dann brachten
  rationale: Das narrative Wayyiqtol führt die Handlung weiter; „Dann“ gibt diese Abfolge in natürlichem Deutsch wieder.
- source_word: הַכֹּהֲנִים
  choice: die Priester
  rationale: Direkte und im Tempelkontext eindeutige Wiedergabe des bestimmten Plurals.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: die Bundeslade Jahwes
  rationale: Die kompakte deutsche Zusammensetzung gibt die hebräische Constructusverbindung natürlich und präzise wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die etablierte deutsche Form.
- source_word: מְקוֹמוֹ
  choice: an ihren Platz
  rationale: Das Suffix bezieht sich auf die Lade; das Genus wird im Deutschen entsprechend angepasst. „Ihren Platz“ vermeidet den interpretierenden Zusatz „vorgesehenen“.
- source_word: דְּבִיר
  choice: den innersten Raum
  rationale: Im Tempelzusammenhang bezeichnet das Wort den innersten Raum. Die Formulierung ist verständlich und vermeidet das im Deutschen irreführende „Orakel“.
- source_word: הַבַּיִת
  choice: des Hauses
  rationale: Bewahrt die konkrete hebräische Bezeichnung „Haus“; der Zusammenhang macht deutlich, dass der Tempel gemeint ist.
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: das Allerheiligste
  rationale: Etablierte, klare deutsche Wiedergabe der intensivierenden hebräischen Verbindung.
- source_word: תַּחַת
  choice: unter
  rationale: Direkte räumliche Entsprechung.
- source_word: כַּנְפֵי הַכְּרוּבִים
  choice: die Flügel der Kerubim
  rationale: „Flügel“ entspricht dem Grundsinn; „Kerubim“ bewahrt die geläufige fachsprachliche Pluralform der Tempelwesen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. Die Wiedergabe „Jahwe“ erhält diesen Charakter, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch. Die gestufte Ortsangabe des Hebräischen bleibt erhalten: Platz – innerster Raum des Hauses – Allerheiligstes – unter den Flügeln der Kerubim.'
