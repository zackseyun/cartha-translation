id: 1KI.8.20
reference: 1 Kings 8:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יָּ֣קֶם יְהוָ֔ה אֶת דְּבָר֖/וֹ אֲשֶׁ֣ר דִּבֵּ֑ר וָ/אָקֻ֡ם תַּחַת֩ דָּוִ֨ד אָבִ֜/י וָ/אֵשֵׁ֣ב עַל כִּסֵּ֣א יִשְׂרָאֵ֗ל כַּֽ/אֲשֶׁר֙ דִּבֶּ֣ר יְהוָ֔ה וָ/אֶבְנֶ֣ה הַ/בַּ֔יִת לְ/שֵׁ֥ם יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/020.yaml
  text: And Yahweh has fulfilled his word that he spoke[a], and I have risen in the place of David my father and sit on the throne of Israel, just as Yahweh spoke, and I have built the house for the name of Yahweh[b], the God of Israel.
translation:
  language: de
  text: Und Jahwe hat sein Wort erfüllt, das er gesprochen hatte[a]. Ich bin an die Stelle meines Vaters David getreten und sitze auf dem Thron Israels, wie Jahwe gesagt hatte. Und ich habe das Haus[b] für den Namen Jahwes, des Gottes Israels, gebaut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sein Wort bestätigt“ oder „sein Wort ausgeführt“.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist der Tempel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: hat … erfüllt
  rationale: Das Hifil von קום bezeichnet in Verbindung mit „Wort“, dass eine Zusage in Kraft gesetzt beziehungsweise verwirklicht wird. „Erfüllt“ gibt den Sinn im Deutschen natürlich wieder; die wörtlicheren Möglichkeiten werden in der Fußnote bewahrt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: דְּבָרוֹ אֲשֶׁר דִּבֵּר
  choice: sein Wort …, das er gesprochen hatte
  rationale: Die Wiedergabe erhält sowohl das Substantiv „Wort“ als auch das zugehörige Verb „sprechen“ und deutet den Ausdruck nicht stillschweigend zu „Versprechen“ um.
- source_word: וָאָקֻם תַּחַת דָּוִד אָבִי
  choice: Ich bin an die Stelle meines Vaters David getreten
  rationale: תחת bezeichnet hier die Nachfolge an Davids Stelle. Die deutsche Wendung ist natürlich und vermittelt den dynastischen Zusammenhang.
- source_word: וָאֵשֵׁב עַל כִּסֵּא יִשְׂרָאֵל
  choice: und sitze auf dem Thron Israels
  rationale: Der Gegenwartszustand als Ergebnis der Thronbesteigung wird ebenso bewahrt wie das hebräische Bild des Sitzens auf dem Thron.
- source_word: וָאֶבְנֶה הַבַּיִת
  choice: Und ich habe das Haus gebaut
  rationale: „Haus“ entspricht dem hebräischen Wortlaut und bewahrt das biblische Motiv des Gotteshauses; der konkrete Bezug auf den Tempel wird in einer Fußnote erläutert.
- source_word: לְשֵׁם יְהוָה
  choice: für den Namen Jahwes
  rationale: Die bedeutungstragende hebräische Formulierung wird beibehalten, statt sie interpretierend mit „zu Ehren Jahwes“ wiederzugeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen ausdrücklich. Die Umschrift „Jahwe“ bewahrt seinen Charakter als Eigenname.
- issue: Wiedergabe von הַבַּיִת
  choice: das Haus
  alternative: der Tempel
  rationale: Obwohl hier eindeutig der Tempel gemeint ist, bewahrt „Haus“ den hebräischen Wortlaut und dessen theologische Bildsprache; die Fußnote klärt den Bezug.
- issue: Verheißungscharakter von דִּבֵּר
  choice: gesprochen/gesagt
  alternative: verheißen
  rationale: Der Zusammenhang hat den Sinn einer Zusage, doch das hebräische Verb bedeutet zunächst „sprechen“. Die Übersetzung lässt diesen Verheißungscharakter aus dem Kontext hervorgehen, ohne ihn ausdrücklich einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt nahe am hebräischen Aufbau, wird aber durch einen Satzpunkt und einen neuen Hauptsatz lesbarer gestaltet. Der Gottesname erscheint in der im Deutschen geläufigen Form „Jahwe“.
