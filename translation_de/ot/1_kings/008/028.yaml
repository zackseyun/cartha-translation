  text: וּ/פָנִ֜יתָ אֶל תְּפִלַּ֧ת עַבְדְּ/ךָ֛ וְ/אֶל תְּחִנָּת֖/וֹ יְהוָ֣ה אֱלֹהָ֑/י לִ/שְׁמֹ֤עַ אֶל הָֽ/רִנָּה֙ וְ/אֶל הַ/תְּפִלָּ֔ה אֲשֶׁ֧ר עַבְדְּ/ךָ֛ מִתְפַּלֵּ֥ל לְ/פָנֶ֖י/ךָ הַ/יּֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/028.yaml
  text: Yet turn toward the prayer of your servant and to his plea for favor[a], O Yahweh my God[b], to hear the cry and the prayer that your servant is praying before you today.
translation:
  language: de
  text: Doch wende dich dem Gebet deines Dieners und seinem Flehen um Gnade[a] zu, Jahwe, mein Gott, und höre den Ruf[b] und das Gebet, das dein Diener heute vor dir betet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seinem inständigen Flehen“. Das hebräische Wort bezeichnet eine eindringliche Bitte um Erbarmen oder Gnade.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann einen lauten oder klingenden Ruf, auch einen Jubelruf, bezeichnen. Hier ist ein an Gott gerichteter Ruf im Gebet gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָנִיתָ
  choice: Doch wende dich … zu
  rationale: פנה bezeichnet zunächst ein Sich-Zuwenden und im Gebetskontext Gottes aufmerksame Hinwendung. Die konkrete Bildsprache bleibt erhalten; „doch“ gibt den im Kontext leicht gegensätzlichen Anschluss wieder.
- source_word: תְּפִלַּת / הַתְּפִלָּה
  choice: Gebet / das Gebet
  rationale: תפלה wird direkt mit „Gebet“ wiedergegeben; die hebräische Wiederholung bleibt gewahrt.
- source_word: עַבְדְּךָ
  choice: dein Diener
  rationale: Im ehrfürchtigen Anreden Gottes bezeichnet עבד hier den demütigen Dienst und nicht vorrangig den rechtlichen Sklavenstand. Beide Vorkommen werden einheitlich übersetzt.
- source_word: תְּחִנָּתוֹ
  choice: seinem Flehen um Gnade
  rationale: תחנה ist eine eindringliche Bitte um Gunst, Erbarmen oder Gnade. Die Formulierung macht diesen Bedeutungsgehalt in heutigem Deutsch verständlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהָי
  choice: mein Gott
  rationale: Direkte Wiedergabe der Possessivform in der Anrede.
- source_word: לִשְׁמֹעַ
  choice: und höre
  rationale: Der Zweck beziehungsweise Inhalt der erbetenen Hinwendung wird im Deutschen natürlich als koordinierte Bitte ausgedrückt.
- source_word: הָרִנָּה
  choice: den lauten Ruf
  rationale: רנה kann einen weithin hörbaren, klingenden Ruf oder Schrei bezeichnen. Im Zusammenhang mit Gebet ist ein eindringlicher Ruf zu Gott gemeint.
- source_word: מִתְפַּלֵּל
  choice: betet
  rationale: Das Partizip bezeichnet das gegenwärtige Beten. Zusammen mit „heute“ gibt das deutsche Präsens den fortdauernden Vorgang natürlich wieder.
- source_word: לְפָנֶיךָ
  choice: vor dir
  rationale: Die räumliche Wendung wird wörtlich und zugleich idiomatisch als Beten in Gottes Gegenwart wiedergegeben.
- source_word: הַיּוֹם
  choice: heute
  rationale: Natürliche moderne Wiedergabe der Zeitangabe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Vers nennt ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von רנה im Gebetskontext
  choice: lauter Ruf
  alternative: Jubelruf; Flehen
  rationale: Das Wort kann je nach Kontext einen Jubelruf, Schrei oder klingenden Ruf bezeichnen. Hier steht es parallel zu Gebet und Flehen; daher wird die vokale Eindringlichkeit bewahrt, ohne Freude oder Verzweiflung ausdrücklich festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkrete Wendung „wende dich … zu“ und die Wiederholung von „Gebet“ bewahren die hebräische Bildsprache und Parallelität; altertümliche Wörter wie „Gebetserhörung“ oder „Flehruf“ werden vermieden.
