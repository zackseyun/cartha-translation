source:
  edition: WLC
  text: וְ/שָׁ֣בוּ אֵלֶ֗י/ךָ בְּ/כָל לְבָבָ/ם֙ וּ/בְ/כָל נַפְשָׁ֔/ם בְּ/אֶ֥רֶץ אֹיְבֵי/הֶ֖ם אֲשֶׁר שָׁב֣וּ אֹתָ֑/ם וְ/הִֽתְפַּֽלְל֣וּ אֵלֶ֗י/ךָ דֶּ֤רֶךְ אַרְצָ/ם֙ אֲשֶׁ֣ר נָתַ֣תָּה לַ/אֲבוֹתָ֔/ם הָ/עִיר֙ אֲשֶׁ֣ר בָּחַ֔רְתָּ וְ/הַ/בַּ֖יִת אֲשֶׁר בנית לִ/שְׁמֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/048.yaml
  text: and they return to you with all their heart and with all their soul in the land of their enemies who took them captive[a], and pray to you toward their land that you gave to their fathers, the city that you chose, and the house that I have built for your name[c][b],
translation:
  language: de
  text: und sie im Land ihrer Feinde, die sie in Gefangenschaft geführt haben, mit ihrem ganzen Herzen und ihrer ganzen Seele zu dir zurückkehren[a] und zu dir beten in Richtung ihres Landes[b], das du ihren Vätern gegeben hast, der Stadt, die du erwählt hast, und des Hauses, das ich für deinen Namen gebaut habe[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu dir umkehren“; in diesem Zusammenhang schließt die Wendung auch Reue und eine erneute Hinwendung zu Gott ein.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich sinngemäß: „in Richtung ihres Landes“. Gemeint ist, dass sie beim Beten ihrem Land, der erwählten Stadt und dem Haus zugewandt sind.'
    reason: lexical_alternative
  - marker: c
    text: Gemeint ist das Haus, also der Tempel, der dem Namen Gottes geweiht ist.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׁבוּ אֵלֶיךָ
  choice: und sie … zu dir zurückkehren
  rationale: שׁוּב bedeutet grundlegend „zurückkehren/umkehren“. Die relationale Richtung „zu dir“ bleibt erhalten; der im Zusammenhang mitschwingende Sinn der Umkehr wird nicht vorschnell auf einen theologischen Fachbegriff verengt.
- source_word: בְּכָל לְבָבָם וּבְכָל נַפְשָׁם
  choice: mit ihrem ganzen Herzen und ihrer ganzen Seele
  rationale: Die beiden hebräischen Bildbegriffe werden bewahrt und bezeichnen zusammen die ungeteilte Hinwendung des ganzen Menschen.
- source_word: בְּאֶרֶץ אֹיְבֵיהֶם
  choice: im Land ihrer Feinde
  rationale: „Land“ erhält den Kontrast zwischen dem feindlichen Exilsland und „ihrem Land“ im weiteren Satz.
- source_word: אֲשֶׁר שָׁבוּ אֹתָם
  choice: die sie gefangen weggeführt haben
  rationale: Das Verb שׁבה bezeichnet das Gefangennehmen beziehungsweise Wegführen in die Gefangenschaft. Die Formulierung bringt im Exilskontext beide Aspekte natürlich zum Ausdruck.
- source_word: וְהִתְפַּלְלוּ אֵלֶיךָ
  choice: und zu dir beten
  rationale: Gibt das Verb und seine persönliche Ausrichtung auf Gott knapp und unmittelbar wieder.
- source_word: דֶּרֶךְ אַרְצָם
  choice: ihrem Land zugewandt
  rationale: דֶּרֶךְ bezeichnet hier die Gebetsrichtung. „Zugewandt“ ist im Deutschen natürlicher als eine wörtliche Wiedergabe mit „Weg/Richtung“.
- source_word: אֲשֶׁר נָתַתָּה לַאֲבוֹתָם
  choice: das du ihren Vätern gegeben hast
  rationale: „Väter“ bewahrt die konkrete, bundestheologisch geprägte Ausdrucksweise des hebräischen Textes.
- source_word: הָעִיר אֲשֶׁר בָּחַרְתָּ
  choice: der Stadt, die du erwählt hast
  rationale: „Erwählt“ entspricht dem biblischen Sprachgebrauch von בחר und vermeidet eine Abschwächung zu bloßem „ausgewählt“.
- source_word: וְהַבַּיִת אֲשֶׁר בנית לִשְׁמֶךָ
  choice: und dem Haus, das ich für deinen Namen gebaut habe
  rationale: Der Konsonantentext wird im Kontext von Salomos Gebet als erste Person Singular verstanden. „Haus“ und „für deinen Namen“ bewahren die hebräische Bild- und Bundesrede.
theological_decisions:
- issue: Bedeutungsumfang von שׁוּב in der Bundes- und Exilssprache
  choice: „zu dir zurückkehren“ im Haupttext
  alternative: „zu dir umkehren“ oder „vor dir Buße tun“
  rationale: Das Verb schließt hier innere Umkehr ein, ist aber zugleich relational und richtungsbezogen. „Zurückkehren“ erhält diesen größeren Bedeutungsumfang; die Fußnote weist auf den Umkehrsinn hin.
- issue: Sprecherbezug bei בנית
  choice: 'erste Person Singular: „das ich … gebaut habe“'
  alternative: eine unpersönliche oder pluralische Wiedergabe wie „das für deinen Namen gebaut wurde“
  rationale: Im masoretischen Konsonantentext und im unmittelbaren Redezusammenhang liegt Salomo als Subjekt nahe. Die erste Person bewahrt diese konkrete Sprechsituation.
- issue: Bedeutung des Hauses für Gottes Namen
  choice: „das Haus, das ich für deinen Namen gebaut habe“
  alternative: „der Tempel, den ich dir gebaut habe“
  rationale: Die gewählte Fassung wahrt sowohl בַּיִת („Haus“) als auch die theologisch bedeutsame Namensformel, ohne daraus zu folgern, Gott selbst werde räumlich im Gebäude eingeschlossen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der Satz bleibt als abhängiger Teil des längeren Gebets syntaktisch offen und endet deshalb mit einem Komma. Die Wiederholung von „Land“, die Körpermetaphorik „Herz und Seele“ sowie die biblische Namensformel wurden bewusst erhalten.
