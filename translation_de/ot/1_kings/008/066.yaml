  variant: modern standard German
source:
  edition: WLC
  text: בַּ/יּ֤וֹם הַ/שְּׁמִינִי֙ שִׁלַּ֣ח אֶת הָ/עָ֔ם וַֽ/יְבָרֲכ֖וּ אֶת הַ/מֶּ֑לֶךְ וַ/יֵּלְכ֣וּ לְ/אָהֳלֵי/הֶ֗ם שְׂמֵחִים֙ וְ/ט֣וֹבֵי לֵ֔ב עַ֣ל כָּל הַ/טּוֹבָ֗ה אֲשֶׁ֨ר עָשָׂ֤ה יְהוָה֙ לְ/דָוִ֣ד עַבְדּ֔/וֹ וּ/לְ/יִשְׂרָאֵ֖ל עַמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/066.yaml
  text: On the eighth day he sent the people away[a], and they blessed the king and went to their tents, rejoicing and glad of heart because of all the good that Yahweh had done for David his servant and for Israel his people.
translation:
  language: de
  text: Am achten Tag entließ er das Volk[a]. Sie segneten den König und gingen zu ihren Zelten, freudig und frohen Herzens über all das Gute, das Jahwe seinem Diener David und seinem Volk Israel getan hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „schickte er das Volk fort“. „Zu ihren Zelten“ kann sinngemäß „nach Hause“ bedeuten.'
    reason: Die Fußnote nennt eine mögliche Wiedergabe von שִׁלַּח und erläutert die idiomatische Bedeutung von לְאָהֳלֵיהֶם.
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: Am achten Tag
  rationale: Die Zeitangabe wird ohne den im Vers nicht ausdrücklich genannten Zusatz „des Festes“ wiedergegeben.
- source_word: שִׁלַּח אֶת הָעָם
  choice: entließ er das Volk
  rationale: Der Piel von שלח bezeichnet hier die Entlassung beziehungsweise die Erlaubnis zum Aufbruch; „entließ“ gibt dies im Deutschen knapp und natürlich wieder.
- source_word: וַיְבָרֲכוּ אֶת הַמֶּלֶךְ
  choice: Sie segneten den König
  rationale: ברך bedeutet grundsätzlich „segnen“. Ein Abschiedsgruß kann im Zusammenhang mitschwingen, wird aber nicht an die Stelle der lexikalischen Aussage gesetzt.
- source_word: לְאָהֳלֵיהֶם
  choice: zu ihren Zelten
  rationale: Die konkrete hebräische Formulierung wird bewahrt; idiomatisch können damit ihre Wohnstätten oder ihr Zuhause gemeint sein.
- source_word: שְׂמֵחִים וְטוֹבֵי לֵב
  choice: freudig und frohen Herzens
  rationale: Die Formulierung gibt sowohl die Freude als auch das hebräische Herzbild in verständlichem, gehobenem Gegenwartsdeutsch wieder.
- source_word: עַל כָּל הַטּוֹבָה
  choice: über all das Gute
  rationale: עַל bezeichnet hier den Anlass ihrer Freude. „Über“ verbindet sich im Deutschen natürlich mit „freudig“ und erhält die umfassende Bedeutung von הַטּוֹבָה.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: לְדָוִד עַבְדּוֹ
  choice: seinem Diener David
  rationale: עבד bezeichnet David in seiner Beziehung zu Gott; „Diener“ passt zum königlich-bundestheologischen Zusammenhang, ohne sachfremde Sklavereikonnotationen einzutragen.
- source_word: וּלְיִשְׂרָאֵל עַמּוֹ
  choice: seinem Volk Israel
  rationale: Die Zugehörigkeitsbezeichnung wird in natürlicher deutscher Wortstellung wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; JHWH
  rationale: Der hebräische Text enthält den Gottesnamen selbst. Die Wiedergabe „Jahwe“ bewahrt seinen Charakter als Eigenname, statt ihn durch den Titel „der HERR“ zu ersetzen.
- issue: Bedeutung von וַיְבָרֲכוּ im Abschiedszusammenhang
  choice: Sie segneten den König
  alternative: Sie verabschiedeten sich vom König; sie wünschten dem König Segen
  rationale: Obwohl die Handlung zugleich als Abschiedsgruß dienen kann, bleibt mit „segneten“ die ausdrückliche Bedeutung von ברך und damit die mögliche religiöse Dimension des Segens erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am Hebräischen, wird aber zur besseren Lesbarkeit in zwei Sätze gegliedert. Das Herzbild und der Gottesname werden ausdrücklich bewahrt.
