source:
  edition: WLC
  text: רַ֣ק אַתָּ֔ה לֹ֥א תִבְנֶ֖ה הַ/בָּ֑יִת כִּ֤י אִם בִּנְ/ךָ֙ הַ/יֹּצֵ֣א מֵ/חֲלָצֶ֔י/ךָ הֽוּא יִבְנֶ֥ה הַ/בַּ֖יִת לִ/שְׁמִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/019.yaml
  text: Nevertheless[a], you shall not build the house; rather, your son who comes from your own body, he shall build the house for my name.
translation:
  language: de
  text: Doch du wirst das Haus nicht bauen, sondern dein Sohn, der aus deinem Leib hervorgeht[a]. Er wird das Haus für meinen Namen bauen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der aus deinen Lenden hervorgeht“; gemeint ist ein leiblicher Nachkomme.'
    reason: Die Fußnote bewahrt das konkrete hebräische Bild und erklärt zugleich seine idiomatische Bedeutung.
lexical_decisions:
- source_word: רַק
  choice: Doch
  rationale: רַק schränkt die zuvor bestätigte Absicht Davids ein. „Doch“ gibt diesen einschränkenden, gegensätzlichen Übergang im Deutschen knapp und natürlich wieder.
- source_word: לֹא תִבְנֶה
  choice: nicht du wirst ... bauen
  rationale: Die Voranstellung von „nicht du“ bewahrt zusammen mit dem Futur die Spannung zwischen göttlicher Festlegung und untersagender Aussage und bereitet den ausdrücklichen Gegensatz zum Sohn vor.
- source_word: הַבָּיִת
  choice: das Haus
  rationale: Der hebräische Text sagt „das Haus“. Obwohl der Tempel gemeint ist, bewahrt „Haus“ die prägende biblisch-theologische Ausdrucksweise.
- source_word: כִּי אִם
  choice: sondern
  rationale: 'Nach der Verneinung kennzeichnet כִּי אִם die Korrektur beziehungsweise den Gegensatz: Nicht David, sondern sein Sohn wird bauen.'
- source_word: בִּנְךָ
  choice: dein Sohn
  rationale: Der bestimmte Sinn im Zusammenhang weist auf einen konkreten Sohn Davids; die direkte Wiedergabe ist im Deutschen klar und quellennah.
- source_word: הַיֹּצֵא מֵחֲלָצֶיךָ
  choice: der aus deinem eigenen Leib hervorgeht
  rationale: Die Formulierung gibt die leibliche Abstammung natürlich wieder, ohne die konkrete Körpermetapher des Hebräischen völlig zu verallgemeinern; die wörtlichere Wendung wird in der Fußnote bewahrt.
- source_word: הוּא
  choice: er
  rationale: Das selbstständige Pronomen hebt den Sohn als denjenigen hervor, der im Gegensatz zu David tatsächlich bauen wird. Der Gedankenstrich unterstützt diese Betonung.
- source_word: יִבְנֶה הַבַּיִת
  choice: er wird das Haus bauen
  rationale: Die Wiederholung von „das Haus bauen“ folgt der hebräischen Wiederholung. Das deutsche Futur passt zur göttlichen Ankündigung, ohne zusätzlich einen ausdrücklichen Befehlscharakter einzutragen.
- source_word: לִשְׁמִי
  choice: für meinen Namen
  rationale: Die direkte Wiedergabe erhält die theologisch bedeutsame biblische Rede vom Haus für den Namen Gottes, statt sie deutend zu „zu meiner Ehre“ zu erweitern.
theological_decisions:
- issue: Wiedergabe von בַּיִת als „Haus“ oder deutend als „Tempel“
  choice: Haus
  alternative: Tempel
  rationale: „Haus“ entspricht dem Ausgangstext und bewahrt die theologisch bedeutsame Redeweise. Dass der Tempel gemeint ist, ergibt sich aus dem Zusammenhang.
- issue: Verbot oder Zukunftsaussage in לֹא תִבְנֶה
  choice: nicht du wirst ... bauen
  alternative: du sollst ... nicht bauen
  rationale: Das Futur gibt die göttliche Festlegung wieder und lässt zugleich den untersagenden Gehalt der Aussage bestehen, ohne die grammatische Mehrdeutigkeit einseitig als Gebot aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung „nicht du ... sondern dein Sohn“ und das wiederaufgenommene „er“ bilden die hebräische Hervorhebung ab; „Haus“ und „für meinen Namen“ bewahren die biblische Ausdrucksweise.
