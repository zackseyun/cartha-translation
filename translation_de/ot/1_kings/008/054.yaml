  - severity: medium
    issue: Räumliche Nuance bei מִלִּפְנֵי
    rationale: '„vor dem Altar“ bezeichnet hauptsächlich den Ort des Aufstehens. Das Präfix מִן verlangt zusätzlich die Herkunftsbewegung: Salomo erhob sich von seinem Platz vor dem Altar.'
  - severity: medium
    issue: Unnatürliche und gelockerte Wiedergabe der Handhaltung
    rationale: Die selbständige Plusquamperfekt-Konstruktion mit „Handflächen ... ausgebreitet“ klingt steif und stellt die Handhaltung weniger unmittelbar als begleitenden Umstand des Kniens dar. „Mit offenen, zum Himmel ausgebreiteten Händen“ ist idiomatischer; die Handflächennuance kann in der Fußnote erläutert werden.
  revised_text: Und als Salomo damit fertig war, all dieses Gebet und Flehen um Gnade[a] an Jahwe zu richten, erhob er sich aus seiner knienden Haltung vor dem Altar Jahwes, mit offenen, zum Himmel ausgebreiteten Händen[b].
