revisions:
- from: Und als Salomo damit fertig war, all dieses Gebet und Flehen um Gnade[a] an Jahwe zu richten, erhob er sich vor dem Altar Jahwes aus seiner knienden Haltung; seine Handflächen[b] hatte er zum Himmel ausgebreitet.
  to: Und als Salomo damit fertig war, all dieses Gebet und Flehen um Gnade[a] an Jahwe zu richten, erhob er sich aus seiner knienden Haltung vor dem Altar Jahwes, mit offenen, zum Himmel ausgebreiteten Händen[b].
  rationale: Die Revision stellt die Herkunftsbewegung beim Aufstehen klarer dar und verbindet die ausgebreiteten Hände wieder unmittelbar mit Salomos kniender Gebetshaltung. Sie vermeidet zugleich die im Deutschen unübliche Formulierung, Handflächen würden „ausgebreitet“, ohne die mögliche spezifische Bedeutung von כַּף preiszugeben.
