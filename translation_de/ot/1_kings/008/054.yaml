  text: וַ/יְהִ֣י כְּ/כַלּ֣וֹת שְׁלֹמֹ֗ה לְ/הִתְפַּלֵּל֙ אֶל יְהוָ֔ה אֵ֛ת כָּל הַ/תְּפִלָּ֥ה וְ/הַ/תְּחִנָּ֖ה הַ/זֹּ֑את קָ֞ם מִ/לִּ/פְנֵ֨י מִזְבַּ֤ח יְהוָה֙ מִ/כְּרֹ֣עַ עַל בִּרְכָּ֔י/ו וְ/כַפָּ֖י/ו פְּרֻשׂ֥וֹת הַ/שָּׁמָֽיִם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/054.yaml
  text: And when Solomon had finished praying to Yahweh with all this prayer and plea for favor[a], he rose from before the altar of Yahweh[b], from kneeling on his knees with his palms spread out toward heaven.
translation:
  language: de
  text: Und als Salomo damit fertig war, all dieses Gebet und Flehen um Gnade[a] an Jahwe zu richten, erhob er sich aus seiner knienden Haltung vor dem Altar Jahwes, mit offenen, zum Himmel ausgebreiteten Händen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „inständige Bitte“. Das hebräische Wort bezeichnet ein eindringliches Flehen um Erbarmen oder Gunst.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann genauer die Handflächen bezeichnen; die Hände sind zum Himmel hin ausgebreitet.
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת
  choice: Und als … damit fertig war
  rationale: Die Verbindung leitet einen temporalen Nebensatz ein. Die gewählte Formulierung gibt den Abschluss der Handlung in natürlichem modernem Deutsch wieder, ohne das formelhafte וַיְהִי unnötig wörtlich abzubilden.
- source_word: לְהִתְפַּלֵּל אֶל יְהוָה אֵת כָּל הַתְּפִלָּה וְהַתְּחִנָּה הַזֹּאת
  choice: all dieses Gebet und Flehen um Gnade an Jahwe zu richten
  rationale: Die im Hebräischen mögliche Verbindung des Verbs „beten“ mit dem Gebet als direktem Objekt wird im Deutschen idiomatisch mit „an … richten“ wiedergegeben. „Flehen um Gnade“ bringt bei תְּחִנָּה die nachdrückliche Bitte um Erbarmen oder Gunst zum Ausdruck.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben; „Jahwe“ ist die im Deutschen gebräuchliche wissenschaftliche Umschrift.
- source_word: קָם מִלִּפְנֵי מִזְבַּח יְהוָה
  choice: erhob er sich vor dem Altar Jahwes
  rationale: קָם bezeichnet den Wechsel aus der knienden Haltung. „Vor dem Altar“ bewahrt die räumliche Bedeutung von לִפְנֵי in natürlichem Deutsch.
- source_word: מִכְּרֹעַ עַל בִּרְכָּיו
  choice: aus seiner knienden Haltung
  rationale: Die Formulierung gibt die ausdrücklich beschriebene Körperhaltung wieder, vermeidet aber das im Deutschen schwerfällige „vom Knien auf seinen Knien“.
- source_word: וְכַפָּיו פְּרֻשׂוֹת הַשָּׁמָיִם
  choice: seine Handflächen hatte er zum Himmel ausgebreitet
  rationale: כַּף bezeichnet hier genauer die Handfläche beziehungsweise die geöffnete Hand. Das Plusquamperfekt macht deutlich, dass diese Haltung während des vorausgehenden Gebets bestand.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. Seine Wiedergabe als „Jahwe“ bewahrt diesen Charakter, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von תְּחִנָּה
  choice: Flehen um Gnade
  alternative: inständige Bitte
  rationale: Das Wort bezeichnet ein eindringliches Flehen um Erbarmen oder Gunst. „Um Gnade“ macht diese Nuance sichtbar, ohne den Gegenstand der konkreten Bitte näher festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange hebräische Satzperiode bleibt in einem Satz erhalten, wird jedoch durch ein Semikolon übersichtlich gegliedert. Unnatürliche wörtliche Wiederholungen wie „knien auf seinen Knien“ werden idiomatisch wiedergegeben.
