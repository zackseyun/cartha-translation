  text: לִ/הְי֨וֹת עֵינֶ֤י/ךָ פְתֻחוֹת֙ אֶל תְּחִנַּ֣ת עַבְדְּ/ךָ֔ וְ/אֶל תְּחִנַּ֖ת עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל לִ/שְׁמֹ֣עַ אֲלֵי/הֶ֔ם בְּ/כֹ֖ל קָרְאָ֥/ם אֵלֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/052.yaml
  text: that your eyes may be open to the plea of your servant and to the plea of your people Israel[b][a], to listen to them whenever they call to you.
translation:
  language: de
  text: Damit deine Augen offen sind für das Flehen deines Dieners und für das Flehen deines Volkes Israel und du auf sie hörst[a], sooft sie zu dir rufen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sie erhörst“. Das hebräische Verb kann je nach Zusammenhang „hören“, „auf jemanden hören“ oder „erhören“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִהְיוֹת
  choice: Damit ... offen sind
  rationale: Der Infinitiv mit ל setzt Salomos Bitte aus dem vorhergehenden Zusammenhang fort. Ein deutscher Finalsatz gibt diese Funktion natürlich wieder.
- source_word: עֵינֶיךָ פְתֻחוֹת
  choice: deine Augen offen sind
  rationale: Die anthropomorphe Wendung für Gottes aufmerksame Zuwendung bleibt bildhaft und nah am Hebräischen erhalten.
- source_word: תְּחִנַּת
  choice: Flehen
  rationale: תְּחִנָּה bezeichnet eine dringliche Bitte um Gunst oder Erbarmen. „Flehen“ ist im Deutschen verständlich, würdevoll und bringt die Eindringlichkeit zum Ausdruck.
- source_word: עַבְדְּךָ
  choice: deines Dieners
  rationale: In Salomos Gebet ist עבד eine demütige Selbstbezeichnung vor Gott; „Diener“ ist hier sachgemäßer als „Sklave“.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: deines Volkes Israel
  rationale: Die Formulierung bewahrt die Zuordnung Israels als Gottes Volk und ist natürliches Standarddeutsch.
- source_word: לִשְׁמֹעַ אֲלֵיהֶם
  choice: sodass du auf sie hörst
  rationale: שׁמע mit אֶל bezeichnet hier aufmerksames, zugewandtes Hören. „Auf sie hören“ wahrt die mögliche Nuance des Erhörens, ohne sie ausdrücklich festzulegen.
- source_word: בְּכֹל קָרְאָם אֵלֶיךָ
  choice: sooft sie zu dir rufen
  rationale: 'בְּכֹל mit der nominalisierten Verbform hat temporalen Sinn: bei jedem Rufen beziehungsweise sooft sie rufen. „Zu dir rufen“ gibt die Gebetssituation natürlich wieder.'
theological_decisions:
- issue: Anthropomorphe Rede von Gottes offenen Augen
  choice: Das Bild „deine Augen offen sind“ im Haupttext beibehalten
  alternative: „damit du aufmerksam bist“
  rationale: Der hebräische Text verwendet ausdrücklich die körperbezogene Metapher für Gottes aufmerksame Zuwendung. Ihre Beibehaltung wahrt die literarische und theologische Spannung, ohne eine Aussage über Gottes Körperlichkeit zu erzwingen.
- issue: Bedeutungsbreite von שׁמע im Gebetskontext
  choice: „auf sie hörst“
  alternative: „sie erhörst“ oder „sie hörst“
  rationale: „Erhören“ würde die Antwort Gottes stärker explizieren, während „hören“ im heutigen Deutsch rein akustisch verstanden werden kann. „Auf sie hören“ hält die Nuancen von Hören, Beachten und Erhören offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt der fortlaufenden Bitte Salomos; das hebräische Bild der offenen Augen bleibt erhalten. „Flehen“ ist bewusst eindringlicher als das allgemeinere „Bitte“.
