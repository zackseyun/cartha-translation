source:
  edition: WLC
  text: אֵ֚ין בָּֽ/אָר֔וֹן רַ֗ק שְׁנֵי֙ לֻח֣וֹת הָ/אֲבָנִ֔ים אֲשֶׁ֨ר הִנִּ֥חַ שָׁ֛ם מֹשֶׁ֖ה בְּ/חֹרֵ֑ב אֲשֶׁ֨ר כָּרַ֤ת יְהוָה֙ עִם בְּנֵ֣י יִשְׂרָאֵ֔ל בְּ/צֵאתָ֖/ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/009.yaml
  text: There was nothing in the ark except the two stone tablets that Moses had placed there at Horeb[c][b][a], where Yahweh made a covenant with the sons of Israel when they came out from the land of Egypt.
translation:
  language: de
  text: In der Lade befand sich nichts außer den beiden Steintafeln, die Mose am Horeb dort niedergelegt hatte. Dort hatte Jahwe mit den Israeliten einen Bund geschlossen, als sie aus Ägypten auszogen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „als sie aus dem Land Ägypten auszogen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין בָּאָרוֹן רַק
  choice: In der Lade befand sich nichts außer
  rationale: Die hebräische Verbindung aus Existenzverneinung und רַק wird im Deutschen natürlich und genau mit „nichts außer“ wiedergegeben.
- source_word: שְׁנֵי לֻחֹת הָאֲבָנִים
  choice: die beiden Steintafeln
  rationale: Die kompakte deutsche Zusammensetzung gibt die hebräische Genitivverbindung verständlich wieder.
- source_word: אֲשֶׁר הִנִּחַ שָׁם מֹשֶׁה
  choice: die Mose ... dort niedergelegt hatte
  rationale: „Niedergelegt“ entspricht dem Hifil von נוח in diesem Zusammenhang; das Plusquamperfekt verdeutlicht die Vorzeitigkeit.
- source_word: בְּחֹרֵב
  choice: am Horeb
  rationale: „Am Horeb“ ist die im Deutschen übliche Ortsangabe für den Berg beziehungsweise das Horebgebiet.
- source_word: אֲשֶׁר כָּרַת יְהוָה עִם
  choice: Dort hatte Jahwe mit ... einen Bund geschlossen
  rationale: כרת bezeichnet hier in der festen Verbindung mit dem aus dem Kontext ergänzten בְּרִית idiomatisch das Schließen eines Bundes. Das relative אֲשֶׁר bezieht sich sinnvoll auf Horeb und wird als neuer Satz mit „Dort“ wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die etablierte deutsche Form.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: den Israeliten
  rationale: Die hebräische Volksbezeichnung bedeutet hier idiomatisch die Angehörigen des Volkes Israel; „Israeliten“ ist im modernen Deutsch natürlich und schließt das ganze Bundesvolk ein.
- source_word: בְּצֵאתָם מֵאֶרֶץ מִצְרָיִם
  choice: als sie aus Ägypten auszogen
  rationale: Die temporale Infinitivkonstruktion wird mit „als“ wiedergegeben. „Aus Ägypten“ ist natürliches Deutsch; אֶרֶץ muss hier nicht eigens als „Land“ ausgedrückt werden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den persönlichen Gottesnamen. Seine Wiedergabe als „Jahwe“ bewahrt diesen Unterschied gegenüber dem Titel אֲדֹנָי.
- issue: Umfang von בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: Hier ist das gesamte Bundesvolk gemeint, nicht ausschließlich männliche leibliche Nachkommen. „Israeliten“ wahrt den kollektiven Sinn ohne eine unnötige geschlechtliche Verengung.
- issue: Nicht ausdrücklich wiederholtes Wort „Bund“
  choice: einen Bund geschlossen
  alternative: wörtlich nur „geschlossen/geschnitten“
  rationale: Das Objekt „Bund“ ist in der hebräischen Bundesformel elliptisch vorausgesetzt. Seine Ergänzung im Deutschen macht den gemeinten idiomatischen Ausdruck verständlich, ohne eine zusätzliche theologische Aussage einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Zwei Sätze vermeiden eine schwerfällige Kette von Relativsätzen. „Lade“, „Steintafeln“, „Bund“ und „Horeb“ bewahren die vertraute biblische Begrifflichkeit; „Israeliten“ und „aus Ägypten“ sorgen zugleich für natürliche Gegenwartssprache.
