  text: And all the elders of Israel came[b][a], and the priests carried the ark.
translation:
  language: de
  text: Da kamen alle Ältesten Israels, und die Priester trugen die Lade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist die Bundeslade; die vollständigere Bezeichnung steht nicht in diesem Vers, ergibt sich aber aus dem Zusammenhang. Das mit „trugen“ wiedergegebene Verb kann auch „hoben“ bedeuten.
    reason: cross_reference_and_lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Da kamen
  rationale: Das narrative Wayyiqtol von בוא führt die Ereignisfolge fort. „Da kamen“ gibt diesen Anschluss in natürlichem deutschem Erzählstil wieder, ohne ein im Hebräischen nicht genanntes Ziel zu ergänzen.
- source_word: כֹּל זִקְנֵי יִשְׂרָאֵל
  choice: alle Ältesten Israels
  rationale: כֹּל umfasst die gesamte bezeichnete Gruppe; die Statusbezeichnung זִקְנֵי יִשְׂרָאֵל wird im Deutschen sachgerecht und geläufig mit „Älteste Israels“ wiedergegeben.
- source_word: וַיִּשְׂאוּ
  choice: trugen
  rationale: נשׂא kann „heben“, „tragen“ oder „forttragen“ bedeuten. Im Zusammenhang mit der Beförderung der Lade ist „trugen“ die natürliche, kontextgerechte Wiedergabe und bewahrt zugleich den Grundsinn.
- source_word: הַכֹּהֲנִים
  choice: die Priester
  rationale: Die bestimmte Pluralform bezeichnet die anwesende priesterliche Gruppe ausdrücklich und wird direkt wiedergegeben.
- source_word: אֶת הָאָרוֹן
  choice: die Lade
  rationale: Der bestimmte Ausdruck nennt die aus dem Kontext bekannte Lade. Der Zusatz „des Bundes“ steht in diesem Vers nicht und wird daher nicht in den Haupttext aufgenommen.
theological_decisions: []
translation_notes:
