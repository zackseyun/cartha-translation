base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/029.yaml
  text: that your eyes may be open toward this house night and day[a], toward the place of which you said, ‘My name will be there,’ to hear the prayer that your servant prays toward this place.
translation:
  language: de
  text: 'damit deine Augen Tag und Nacht offen auf dieses Haus gerichtet sind, auf den Ort, von dem du gesagt hast: »Mein Name soll dort sein«[a], und damit du auf das Gebet hörst, das dein Diener zu diesem Ort hin betet.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '»Mein Name soll dort sein« ist Sprache der Tempeltheologie: Gott verbindet sich in besonderer, von ihm erwählter Weise mit diesem Ort. Das schließt seine bundesbezogene Gegenwart ein, ohne dass die Wendung darauf verkürzt werden darf.'
    reason: Erläuterung einer theologisch gewichtigen hebräischen Namensformel, deren Bedeutung im Haupttext bewusst nicht paraphrasiert wird.
lexical_decisions:
- source_word: לִהְיוֹת עֵינֶךָ פְתֻחוֹת
  choice: damit deine Augen … gerichtet sind
  rationale: Der Infinitiv mit לְ führt im Zusammenhang eine Zweck- beziehungsweise Ergebnisaussage fort. Die hebräische Wendung spricht wörtlich von geöffneten Augen; im Deutschen gibt »gerichtet sind« die aufmerksame Hinwendung der Augen natürlich wieder, ohne das Bild auf das abstrakte »aufmerksam sein« zu reduzieren.
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: auf dieses Haus
  rationale: אֶל bezeichnet hier die Ausrichtung der Augen. »Auf dieses Haus gerichtet« ist im Deutschen natürlicher als »zu diesem Haus hin« und bewahrt »Haus« als Bezeichnung des Tempels.
- source_word: לַיְלָה וָיוֹם
  choice: Tag und Nacht
  rationale: Die feste deutsche Wortfolge »Tag und Nacht« entspricht der hebräischen Paarformel »Nacht und Tag« und bezeichnet ununterbrochene Dauer.
- source_word: אֶל הַמָּקוֹם
  choice: auf den Ort
  rationale: Die Präposition bezeichnet erneut die Ausrichtung; »Ort« bewahrt das wiederkehrende Motiv des von Gott erwählten Tempelortes.
- source_word: אֲשֶׁר אָמַרְתָּ יִהְיֶה שְׁמִי שָׁם
  choice: 'von dem du gesagt hast: »Mein Name soll dort sein«'
  rationale: Der Relativsatz bezieht sich auf den Ort. »Soll dort sein« gibt den im Kontext als göttliche Festlegung verstandenen Imperfekt wieder und bewahrt die ausdrückliche Rede vom Namen.
- source_word: לִשְׁמֹעַ אֶל הַתְּפִלָּה
  choice: damit du auf das Gebet hörst
  rationale: Der zweite Infinitiv drückt ebenfalls den Zweck der Bitte aus. »Auf das Gebet hören« bewahrt sowohl das Verb »hören« als auch die mit אֶל ausgedrückte aufmerksame Zuwendung.
- source_word: יִתְפַּלֵּל עַבְדְּךָ
  choice: das dein Diener … betet
  rationale: Das Imperfekt kann hier eine gegenwärtige beziehungsweise wiederholte Handlung bezeichnen. »Diener« entspricht der demütigen Selbstbezeichnung Salomos vor Gott, ohne unnötig den Aspekt des Sklavenstatus hervorzuheben.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: zu diesem Ort hin
  rationale: Die Wendung bezeichnet die räumliche Ausrichtung des Gebets auf den Tempel. »Zu diesem Ort hin« macht diese Gebetsrichtung im Deutschen ausdrücklich.
theological_decisions:
- issue: Anthropomorphe Rede von Gottes offenen Augen
  choice: Das Bild der auf das Haus gerichteten Augen bleibt erhalten.
  alternative: »Achte auf dieses Haus« oder »Wache über dieses Haus«
  rationale: Der hebräische Text verwendet körperhafte Bildsprache für Gottes aufmerksame Zuwendung. Eine abstrakte oder stärker deutende Wiedergabe würde die poetisch-theologische Spannung abschwächen.
- issue: Bedeutung von »Mein Name soll dort sein«
  choice: Die Rede von Gottes Namen bleibt im Haupttext unverändert erhalten.
  alternative: »Meine Gegenwart soll dort sein« oder »Ich will dort wohnen«
  rationale: Die Namensformel bezeichnet Gottes erwählte, bundesbezogene Verbindung mit dem Tempel, ohne schlicht mit räumlichem Wohnen gleichgesetzt werden zu dürfen. Darum wird sie nicht interpretierend aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt dem Gebetscharakter des Zusammenhangs, vermeidet jedoch unnötig altertümliche Formen. Die Wiederholung von »Ort« und die räumliche Ausrichtung auf den Tempel bleiben sichtbar.
