source:
  edition: WLC
  text: וְ/יִֽהְי֨וּ דְבָרַ֜/י אֵ֗לֶּה אֲשֶׁ֤ר הִתְחַנַּ֨נְתִּי֙ לִ/פְנֵ֣י יְהוָ֔ה קְרֹבִ֛ים אֶל יְהוָ֥ה אֱלֹהֵ֖י/נוּ יוֹמָ֣ם וָ/לָ֑יְלָה לַ/עֲשׂ֣וֹת מִשְׁפַּ֣ט עַבְדּ֗/וֹ וּ/מִשְׁפַּ֛ט עַמּ֥/וֹ יִשְׂרָאֵ֖ל דְּבַר י֥וֹם בְּ/יוֹמֽ/וֹ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/059.yaml
  text: And may these words of mine[a], with which I have pleaded before Yahweh, be near Yahweh our God day and night, that he may uphold the cause of his servant and the cause of his people Israel, as each day requires[c][b],
translation:
  language: de
  text: Und mögen diese meine Worte, mit denen ich vor Jahwe um Gnade gefleht habe, Jahwe, unserem Gott, Tag und Nacht nahe sein, damit er seinem Diener und seinem Volk Israel Recht verschafft, wie es der jeweilige Tag erfordert.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Sache eines Tages an seinem Tag«; gemeint ist das, was jeweils an einem Tag erforderlich ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִהְיוּ
  choice: Und mögen ... sein
  rationale: Die Form drückt im Zusammenhang einen Wunsch beziehungsweise eine Bitte aus, nicht lediglich eine Zukunftsaussage.
- source_word: דְבָרַי אֵלֶּה
  choice: diese meine Worte
  rationale: Die leicht gehobene, aber verständliche Wortstellung bewahrt die Betonung der eigenen Gebetsworte Salomos.
- source_word: אֲשֶׁר הִתְחַנַּנְתִּי לִפְנֵי יְהוָה
  choice: mit denen ich vor Jahwe um Gnade gefleht habe
  rationale: Das Hitpael von חנן bezeichnet ein eindringliches Flehen um Gnade; „mit denen“ gibt den Bezug der Bitte auf die zuvor genannten Worte wieder.
- source_word: קְרֹבִים אֶל יְהוָה אֱלֹהֵינוּ
  choice: Jahwe, unserem Gott, ... nahe sein
  rationale: Die direkte räumliche Metapher des Hebräischen bleibt erhalten und bezeichnet hier, dass die Gebetsworte Gott beständig gegenwärtig bleiben sollen.
- source_word: יוֹמָם וָלָיְלָה
  choice: Tag und Nacht
  rationale: Die geläufige deutsche Wendung wahrt das hebräische Bild fortwährender Gegenwart.
- source_word: לַעֲשׂוֹת מִשְׁפַּט עַבְדּוֹ וּמִשְׁפַּט עַמּוֹ יִשְׂרָאֵל
  choice: damit er seinem Diener und seinem Volk Israel zu ihrem Recht verhilft
  rationale: Die Wendung עשה משפט meint, das Recht beziehungsweise die Rechtssache einer Person wirksam zur Geltung zu bringen. Die deutsche Formulierung ist idiomatisch und umfasst beide parallelen Satzglieder.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: so, wie es jeder Tag erfordert
  rationale: Die wörtliche Wendung „die Sache eines Tages an seinem Tag“ bezeichnet das jeweils täglich Anstehende oder Erforderliche.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen Gottes. „Jahwe“ gibt ihn als Namen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von לַעֲשׂוֹת מִשְׁפַּט
  choice: zu ihrem Recht verhilft
  alternative: ihre Rechtssache führt / ihnen Recht schafft
  rationale: Die gewählte Fassung bewahrt den forensischen und fürsorglichen Sinn, ohne festzulegen, ob vor allem richterliches Entscheiden, Verteidigen oder Durchsetzen gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Gebetssprache bleibt durch „mögen“ und „um Gnade gefleht“ gehoben, aber allgemein verständlich. Die Metapher, dass die Worte Gott „nahe“ sind, wurde bewusst nicht aufgelöst.
