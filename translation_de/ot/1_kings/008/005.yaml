  text: וְ/הַ/מֶּ֣לֶךְ שְׁלֹמֹ֗ה וְ/כָל עֲדַ֤ת יִשְׂרָאֵל֙ הַ/נּוֹעָדִ֣ים עָלָ֔י/ו אִתּ֖/וֹ לִ/פְנֵ֣י הָֽ/אָר֑וֹן מְזַבְּחִים֙ צֹ֣אן וּ/בָקָ֔ר אֲשֶׁ֧ר לֹֽא יִסָּפְר֛וּ וְ/לֹ֥א יִמָּנ֖וּ מֵ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/005.yaml
  text: And King Solomon[a], and all the assembly of Israel who had assembled before him, were with him before the ark, sacrificing sheep and cattle that could not be counted or numbered because of their great number.
translation:
  language: de
  text: Und König Salomo und die ganze Versammlung Israels, die sich bei ihm versammelt hatte, waren mit ihm vor der Lade und opferten Schafe und Rinder, deren Zahl wegen ihrer großen Menge weder zu zählen noch zu bestimmen war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲדַת
  choice: Versammlung
  rationale: Bezeichnet hier das zu einem öffentlichen kultischen Anlass versammelte Volk Israel und vermeidet unnötige spätere kirchliche Assoziationen.
- source_word: הַנּוֹעָדִים עָלָיו
  choice: die sich bei ihm eingefunden hatte
  rationale: Gibt das Zusammenkommen in Beziehung auf Salomo natürlich wieder, ohne die räumliche Bedeutung von עָלָיו vorschnell auf „vor ihm“ festzulegen.
- source_word: אִתּוֹ
  choice: waren mit ihm
  rationale: Macht die im Hebräischen verblos ausgedrückte Begleitung im Deutschen ausdrücklich.
- source_word: לִפְנֵי הָאָרוֹן
  choice: vor der Lade
  rationale: Bewahrt die räumliche Aussage und die etablierte Bezeichnung „Lade“ für אָרוֹן im kultischen Zusammenhang.
- source_word: מְזַבְּחִים
  choice: opferten
  rationale: Gibt die fortlaufende kultische Handlung knapp und idiomatisch wieder.
- source_word: צֹאן וּבָקָר
  choice: Schafe und Rinder
  rationale: Bezeichnet die beiden Tiergruppen im Opferzusammenhang konkret und allgemein verständlich.
- source_word: אֲשֶׁר לֹא יִסָּפְרוּ וְלֹא יִמָּנוּ
  choice: die weder gezählt noch erfasst werden konnten
  rationale: Bewahrt die rhetorische Doppelung der beiden hebräischen Verben, ohne im Deutschen zwei nahezu identische Wörter unnatürlich aneinanderzureihen.
- source_word: מֵרֹב
  choice: wegen ihrer großen Menge
  rationale: Gibt den kausalen Sinn natürlich und präzise wieder.
theological_decisions:
- issue: Bezeichnung der Lade
  choice: die Lade
  alternative: die Bundeslade
  rationale: Der hebräische Vers sagt lediglich „die Lade“; die Erweiterung „Bundeslade“ würde eine Kontextinformation in den Wortlaut eintragen.
- issue: Bezug von הַנּוֹעָדִים עָלָיו
  choice: die sich bei ihm eingefunden hatte
  alternative: die sich vor ihm versammelt hatte
  rationale: Die Formulierung bewahrt den relationalen Bezug auf Salomo, ohne die mehrdeutige Präposition enger als nötig räumlich zu bestimmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Satzreihung wird weitgehend bewahrt; der Satz bleibt dennoch verständlich. „Erfasst“ ergänzt „gezählt“ als natürliche deutsche Wiedergabe der emphatischen Verbverdopplung.
