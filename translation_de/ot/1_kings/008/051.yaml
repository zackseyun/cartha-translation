  source_fidelity: 'Die Grundstruktur wird zutreffend wiedergegeben: כִּי ist begründend, Israel ist Gottes Volk und Erbteil, und Gott hat es aus Ägypten herausgeführt. »mitten aus« gibt מִתּוֹךְ angemessen wieder. »Eisenschmelzofen« verschiebt jedoch die Metapher in Richtung eines Ofens, in dem Eisen geschmolzen wird; der hebräische Ausdruck ist besser als »Eisenofen« zu erhalten.'
  naturalness: Der Vers ist insgesamt flüssig und würdig. Bei zwei durch »und« verbundenen Bezugswörtern ist »die du … herausgeführt hast« natürlicher und eindeutiger als das singularische »das«.
  terminology: »Erbteil« ist eine treffende, im biblischen Register natürliche Wiedergabe von נַחֲלָה. »Eisenofen« bewahrt das Bild und vermeidet eine unnötig spezifische technische Deutung. Die Fußnoten bleiben sachlich und nicht konfessionell.
