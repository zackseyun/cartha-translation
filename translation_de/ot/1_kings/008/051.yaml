source:
  edition: WLC
  text: כִּֽי עַמְּ/ךָ֥ וְ/נַחֲלָתְ/ךָ֖ הֵ֑ם אֲשֶׁ֤ר הוֹצֵ֨אתָ֙ מִ/מִּצְרַ֔יִם מִ/תּ֖וֹךְ כּ֥וּר הַ/בַּרְזֶֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/051.yaml
  text: For they are your people and your inheritance[a], whom you brought out of Egypt[b], out of the midst of the iron furnace.
translation:
  language: de
  text: Denn sie sind dein Volk und dein Erbteil[a], die du aus Ägypten herausgeführt hast, mitten aus dem Eisenofen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dein Besitz« beziehungsweise »dein Eigentum«.'
    reason: lexical_alternative
  - marker: b
    text: Der »Eisenofen« ist ein Bild für Ägypten als Ort schwerer Unterdrückung und Bedrängnis; vergleiche 5. Mose 4,20.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet im Zusammenhang die Begründung für Salomos Bitte ein und gibt die erklärende Funktion natürlich wieder.
- source_word: עַמְּךָ
  choice: dein Volk
  rationale: Entspricht der üblichen und kontextgerechten Wiedergabe der Bundesbezeichnung.
- source_word: וְנַחֲלָתְךָ
  choice: und dein Erbteil
  rationale: Bewahrt die Vorstellung eines zugeteilten Besitzes und die bundestheologische Aussage, dass Israel Gott gehört.
- source_word: הֵם
  choice: sie sind
  rationale: Gibt das ausdrücklich gesetzte selbstständige Pronomen und die prädikative Aussage wieder.
- source_word: אֲשֶׁר
  choice: das
  rationale: Der Relativsatz bezieht sich grammatisch natürlich auf das singularische Sammelwort »Volk«; die Form wahrt zugleich den gemeinsamen Personenbezug von Volk und Erbteil.
- source_word: הוֹצֵאתָ
  choice: du … herausgeführt hast
  rationale: Die Hifil-Form von יצא bezeichnet hier das veranlasste Herauskommen beim Exodus; »herausgeführt« ist im Deutschen idiomatisch und traditionsnah.
- source_word: מִמִּצְרַיִם
  choice: aus Ägypten
  rationale: Entspricht der Exodusformel und verbindet sich natürlich mit »herausgeführt«.
- source_word: מִתּוֹךְ
  choice: mitten aus
  rationale: Bewahrt prägnant das räumliche Bild des Herauskommens aus dem Inneren.
- source_word: כּוּר הַבַּרְזֶל
  choice: dem Eisenschmelzofen
  rationale: Verdeutlicht innerhalb des zusammengesetzten deutschen Substantivs, dass כּוּר einen Schmelzofen bezeichnet, ohne das Bild erklärend aufzulösen.
theological_decisions:
- issue: Bundesbezeichnung Israels als Gottes נַחֲלָה
  choice: »dein Erbteil« im Haupttext
  alternative: »dein Besitz« oder »dein Eigentum«
  rationale: »Erbteil« erhält die hebräische Zuteilungs- und Zugehörigkeitssprache und ihre theologische Spannung, ohne zusätzliche Lehrannahmen einzutragen.
- issue: Bild Ägyptens als כּוּר הַבַּרְזֶל
  choice: Metapher als »Eisenschmelzofen« bewahren
  alternative: Im Haupttext als Ort schwerer Unterdrückung ausdeuten
  rationale: Der Ausgangstext nennt ein bildhaftes Geschehen; seine Deutung wird in die Fußnote gestellt, statt die Metapher im Text aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Erbteil« ist leicht gehoben, aber im biblischen Zusammenhang verständlich und semantisch genauer als eine rein besitzanzeigende Paraphrase. Die Wiederholung von »aus« wird mit »mitten aus« natürlich und bildkräftig aufgenommen.
