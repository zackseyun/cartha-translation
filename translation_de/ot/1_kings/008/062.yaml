  text: וְֽ/הַ/מֶּ֔לֶךְ וְ/כָל יִשְׂרָאֵ֖ל עִמּ֑/וֹ זֹבְחִ֥ים זֶ֖בַח לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/062.yaml
  text: And the king and all Israel with him were sacrificing sacrifices before Yahweh[a].
translation:
  language: de
  text: Und der König und ganz Israel mit ihm brachten vor Jahwe Opfer dar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »schlachteten ein Schlachtopfer«; im Hebräischen stehen ein Verb und ein Substantiv desselben Wortstamms zusammen, wodurch der Opferakt hervorgehoben wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמֶּלֶךְ
  choice: Und der König
  rationale: Das Waw führt die Erzählung fort; der bestimmte Ausdruck bezeichnet den bereits genannten König Salomo.
- source_word: וְכָל יִשְׂרָאֵל
  choice: und ganz Israel
  rationale: Die kollektive Bezeichnung für das Volk wird bewahrt und nicht deutend zu »alle Israeliten« aufgelöst.
- source_word: עִמּוֹ
  choice: mit ihm
  rationale: Die knappe Präpositionalfügung gibt die Zugehörigkeit Israels zum König in dieser Handlung unmittelbar wieder.
- source_word: זֹבְחִים זֶבַח
  choice: brachten … Opfer dar
  rationale: Die hebräische Verbindung aus stammverwandtem Verb und Substantiv bezeichnet das Vollziehen eines Opfers. Die deutsche Opferformel ist natürlich und gibt im Erzählzusammenhang die andauernde beziehungsweise gemeinschaftlich vollzogene Handlung angemessen wieder; die formale Besonderheit wird in der Fußnote genannt.
- source_word: לִפְנֵי
  choice: vor
  rationale: »Vor« bewahrt die räumlich-kultische Vorstellung der Handlung in Jahwes Gegenwart.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet das Tetragramm als persönlichen Gottesnamen; »Jahwe« bewahrt diese Funktion im Deutschen.
- issue: Art des Opfers in זֶבַח
  choice: Opfer
  alternative: Schlachtopfer
  rationale: Der Vers selbst bestimmt die genauere Opferart nicht näher. »Opfer« wahrt hier den allgemeinen Sinn, während »Schlachtopfer« die kultische Kategorie möglicherweise stärker festlegt, als dieser Satz allein verlangt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kollektive Wendung »ganz Israel« und der Gottesname »Jahwe« bleiben erhalten; die hebräische Stammfigur wird zugunsten einer natürlichen deutschen Opferformel in die Fußnote verlagert.
