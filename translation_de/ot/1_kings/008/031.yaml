  text: אֵת֩ אֲשֶׁ֨ר יֶחֱטָ֥א אִישׁ֙ לְ/רֵעֵ֔/הוּ וְ/נָֽשָׁא ב֥/וֹ אָלָ֖ה לְ/הַֽאֲלֹת֑/וֹ וּ/בָ֗א אָלָ֛ה לִ/פְנֵ֥י מִֽזְבַּחֲ/ךָ֖ בַּ/בַּ֥יִת הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/031.yaml
  text: If a man sins against his neighbor[a], and an oath is laid on him to make him swear, and the oath comes before your altar in this house,
translation:
  language: de
  text: Wenn jemand gegen seinen Nächsten sündigt und ihm ein Eid[a] auferlegt wird, um ihn schwören zu lassen, und der Eid vor deinen Altar in diesem Haus kommt,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Fluch“. Das hebräische Wort kann den Eid selbst oder den darin angerufenen Fluch für den Fall eines Eidbruchs bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶחֱטָא
  choice: sündigt
  rationale: Das Verb חטא bezeichnet hier ein schuldhaftes Vergehen gegen einen Mitmenschen. „Sündigt“ bewahrt neben dem rechtlichen auch den moralisch-religiösen Gehalt.
- source_word: אִישׁ
  choice: jemand
  rationale: אִישׁ steht im allgemeinen Bedingungssatz für eine beliebige Person. „Jemand“ gibt diese generische Funktion im heutigen Deutschen natürlich wieder.
- source_word: לְרֵעֵהוּ
  choice: gegen seinen Nächsten
  rationale: רֵעַ bezeichnet den Mitmenschen, Gefährten oder Nächsten. „Seinen Nächsten“ bewahrt den zwischenmenschlichen und ethischen Klang des Ausdrucks.
- source_word: וְנָשָׂא בוֹ אָלָה
  choice: und ihm ein Eid auferlegt wird
  rationale: Die Formulierung wahrt die passive Aussage des hebräischen Satzes und lässt אָלָה als auferlegte Verpflichtung hervortreten.
- source_word: לְהַאֲלֹתוֹ
  choice: sodass er schwören muss
  rationale: 'Der Hifil-Infinitiv von אלה hat kausative Bedeutung: Die betreffende Person wird zum Schwören veranlasst. Die deutsche Formulierung macht diese Folge klar, ohne die Aussage auf einen bloßen freiwilligen Eid zu reduzieren.'
- source_word: וּבָא אָלָה
  choice: und der Eid … kommt
  rationale: אָלָה ist am natürlichsten das Subjekt. Die Wiedergabe erhält das Bild, dass der Eid in Gottes Gegenwart vor den Altar kommt.
- source_word: לִפְנֵי מִזְבַּחֲךָ
  choice: vor deinen Altar
  rationale: Dies ist eine direkte und im Deutschen idiomatische Wiedergabe der räumlichen und zugleich gerichtlichen Wendung.
- source_word: בַּבַּיִת הַזֶּה
  choice: in diesem Haus
  rationale: בַּיִת bedeutet wörtlich „Haus“. Im Zusammenhang ist der Tempel gemeint; „Haus“ bewahrt jedoch die Ausdrucksweise und theologische Bildwelt des hebräischen Textes.
theological_decisions:
- issue: Bedeutung von אָלָה im gerichtlichen Zusammenhang des Tempels
  choice: Eid
  alternative: Fluch
  rationale: Der unmittelbare Zusammenhang beschreibt ein gerichtliches Schwören vor dem Altar, weshalb „Eid“ im Haupttext am besten passt. Da אָלָה zugleich den beim Eid angerufenen Fluch beziehungsweise die Sanktion bei Meineid bezeichnen kann, wird diese Spannung in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Bedingungssatz bleibt als offener Anschluss an den folgenden Vers stehen. „Haus“ wurde gegenüber dem erklärenden „Tempel“ bevorzugt, und die doppelte Erwähnung des Eides bildet die hebräische Struktur bewusst ab.
