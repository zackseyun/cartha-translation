id: 1KI.8.26
reference: 1 Kings 8:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/עַתָּ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל יֵאָ֤מֶן נָא֙ דברי/ך אֲשֶׁ֣ר דִּבַּ֔רְתָּ לְ/עַבְדְּ/ךָ֖ דָּוִ֥ד אָבִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/026.yaml
  text: And now[a], God of Israel[b], please let your word that you spoke to your servant David my father be confirmed.
translation:
  language: de
  text: Und nun, Gott Israels, möge sich doch dein Wort[a], das du zu deinem Diener David, meinem Vater, gesprochen hast, als wahr erweisen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „deine Worte“. Der Singular fasst die an David gerichtete Zusage als Einheit zusammen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „sich bestätigen“, „Bestand haben“ oder sinngemäß „in Erfüllung gehen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Gibt sowohl die weiterführende Konjunktion als auch die zeitliche Wendung wieder und schließt natürlich an Salomos Gebet an.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Gott Israels
  rationale: Die hebräische Status-constructus-Verbindung dient hier als direkte Anrede; die Formulierung ist im modernen Deutschen klar und würdevoll.
- source_word: יֵאָמֶן נָא
  choice: möge sich doch … als wahr erweisen
  rationale: Die Wunschform mit נָא wird durch „möge … doch“ als ehrfürchtige Bitte ausgedrückt. „Sich als wahr erweisen“ bewahrt beim Nifal von אמן den Gedanken, dass Gottes Zusage sich als zuverlässig und fest bestätigt.
- source_word: דבריך
  choice: dein Wort
  rationale: Die hebräische Form ist pluralisch („deine Worte“), bezeichnet hier jedoch zusammenfassend die an David gerichtete göttliche Zusage. Der deutsche Singular „dein Wort“ gibt diesen kollektiven Sinn natürlich wieder; die Form wird in einer Fußnote ausgewiesen.
- source_word: אֲשֶׁר דִּבַּרְתָּ
  choice: das du … gesprochen hast
  rationale: Folgt dem Relativsatz und dem gewöhnlichen Verb „sprechen“, ohne die Aussage bereits deutend mit „versprochen“ wiederzugeben.
- source_word: לְעַבְדְּךָ
  choice: zu deinem Diener
  rationale: „Diener“ entspricht in der Anrede Gottes dem relationalen und ehrenden Gebrauch von עבד besser als das hier missverständliche „Sklave“.
- source_word: דָּוִד אָבִי
  choice: David, meinem Vater
  rationale: Bewahrt die hebräische appositionelle Abfolge und macht durch die Kommas deutlich, dass David als Salomos Vater näher bestimmt wird.
theological_decisions:
- issue: Art der Bitte im Blick auf Gottes frühere Rede an David
  choice: Bitte darum, dass Gottes gesprochenes Wort sich als wahr erweist
  alternative: Bitte darum, dass Gottes Verheißung erfüllt wird
  rationale: Die Übersetzung lässt sowohl die Zuverlässigkeit als auch die erwartete Verwirklichung von Gottes Zusage anklingen, ohne den Wortlaut auf eine ausdrücklich formulierte Erfüllungstheologie zu verengen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem Gebetsregister. „Möge … doch“ vermittelt die bittende Partikel, ohne altertümlich zu wirken. Die Wortstellung bleibt gut verständlich und zugleich relativ nah an der hebräischen Struktur.
