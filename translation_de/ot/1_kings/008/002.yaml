base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/002.yaml
  text: And all the men of Israel assembled before King Solomon at the festival, in the month of Ethanim, which is the seventh month.
translation:
  language: de
  text: Und alle Männer Israels versammelten sich vor König Salomo zum Fest im Monat Etanim; das ist der siebte Monat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקָּהֲלוּ אֶל־הַמֶּלֶךְ שְׁלֹמֹה
  choice: versammelten sich beim König Salomo
  rationale: קהל bezeichnet das Zusammenkommen als Versammlung; אֶל markiert die Ausrichtung auf Salomo. Das idiomatische „beim“ wahrt diesen Bezug, ohne ein bloßes räumliches „vor“ unnötig festzulegen.
- source_word: כָּל־אִישׁ יִשְׂרָאֵל
  choice: alle Männer Israels
  rationale: Die distributive Formulierung mit אִישׁ wird als kollektive Bezeichnung der israelitischen Männer wiedergegeben.
- source_word: בְּיֶרַח הָאֵתָנִים
  choice: im Monat Etanim
  rationale: יֶרַח bedeutet „Monat“; der alte Monatsname אֵתָנִים wird als Eigenname transliteriert.
- source_word: בֶּחָג
  choice: zum Fest
  rationale: Der bestimmte Ausdruck bezeichnet hier das Fest als Anlass bzw. Zeitpunkt der Versammlung; der Kontext identifiziert es näher, ohne dass der Vers selbst den Festnamen nennt.
- source_word: הוּא הַחֹדֶשׁ הַשְּׁבִיעִי
  choice: das ist der siebte Monat
  rationale: Die erläuternde Gleichsetzung des alten Monatsnamens mit dem siebten Monat wird direkt bewahrt.
