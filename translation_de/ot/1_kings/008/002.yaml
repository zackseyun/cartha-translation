translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz folgt der hebräischen Informationsfolge weitgehend, ordnet die Zeitangaben aber natürlich. „Beim König Salomo“ vermeidet sowohl das im Deutschen unidiomatische „zu König Salomo“ als auch eine unnötige Festlegung auf eine Audienzformel.
