  text: וְ/שָׁ֨מַעְתָּ֜ אֶל תְּחִנַּ֤ת עַבְדְּ/ךָ֙ וְ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל אֲשֶׁ֥ר יִֽתְפַּֽלְל֖וּ אֶל הַ/מָּק֣וֹם הַ/זֶּ֑ה וְ֠/אַתָּה תִּשְׁמַ֞ע אֶל מְק֤וֹם שִׁבְתְּ/ךָ֙ אֶל הַ/שָּׁמַ֔יִם וְ/שָׁמַעְתָּ֖ וְ/סָלָֽחְתָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/030.yaml
  text: And hear the plea of your servant and of your people Israel when they pray toward this place[a]. And hear in heaven, the place of your dwelling[b]; hear and forgive.
translation:
  language: de
  text: Höre auf das Flehen deines Dieners und deines Volkes Israel, wenn sie zu diesem Ort hin beten.[a] Höre du im Himmel, an deiner Wohnstätte; höre und vergib.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn sie zu diesem Ort beten“. Die hebräische Wendung kann so wörtlicher wiedergegeben werden; im Zusammenhang ist wahrscheinlich das zum Tempel hin ausgerichtete Gebet gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Höre du von deiner Wohnstätte im Himmel her.“ Die hebräische Verbindung der Ortsangaben kann im Deutschen entweder mit „im Himmel“ oder mit „vom Himmel her“ wiedergegeben werden.'
    reason: lexical_and_syntactic_ambiguity
lexical_decisions:
- source_word: תְּחִנַּת
  choice: Flehen
  rationale: תְּחִנָּה bezeichnet eine dringliche Bitte um Gunst oder Erbarmen. „Flehen“ gibt den eindringlichen, bittenden Charakter in natürlichem und zugleich würdigem Deutsch wieder.
- source_word: עַבְדְּךָ
  choice: deines Dieners
  rationale: עֶבֶד kann zwar einen Sklaven bezeichnen, dient hier jedoch als demütige Selbstbezeichnung des Königs vor Gott. „Diener“ entspricht diesem Gebetskontext und wahrt die Unterordnung.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: deines Volkes Israel
  rationale: Die Wendung bezeichnet Israel unmittelbar als Gottes Volk; die deutsche Genitivkonstruktion gibt dies klar und knapp wieder.
- source_word: יִתְפַּלְלוּ
  choice: sie beten
  rationale: Das Hitpael von פלל ist das übliche Verb für beten. Die schlichte Wiedergabe ist idiomatisch und sachlich genau.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: zu diesem Ort hin
  rationale: אֶל kann „zu“ oder „auf … hin“ bedeuten. Im Kontext bezeichnet die Wendung wahrscheinlich die Ausrichtung des Gebets auf den Tempel; „zu diesem Ort hin“ bewahrt zugleich die hebräische Richtungsangabe.
- source_word: מְקוֹם שִׁבְתְּךָ
  choice: der Stätte, an der du wohnst
  rationale: Die aufgelöste Konstruktion gibt den Ort des Wohnens klar wieder. „Stätte“ vermeidet eine schwerfällige Wiederholung von „Ort“ und wahrt den gehobenen Gebetston.
- source_word: אֶל הַשָּׁמַיִם
  choice: im Himmel
  rationale: Obwohl אֶל gewöhnlich eine Richtung bezeichnet, kennzeichnet es hier zusammen mit dem Wohnort Gottes idiomatisch den Himmel als den Bereich, in dem Gott hört. Die Fußnote hält die formnähere Möglichkeit offen.
- source_word: וְשָׁמַעְתָּ
  choice: Höre
  rationale: שׁמע meint hier aufmerksames, erhörendes Hören. „Höre“ bewahrt die traditionelle und theologisch offene Gebetssprache.
- source_word: וְסָלָחְתָּ
  choice: vergib
  rationale: סלח ist das übliche Verb für Gottes Vergebung. „Vergib“ ist direkt, verständlich und theologisch transparent.
theological_decisions:
- issue: Tempelbezogene Gebetsausrichtung und Gottes Wohnen im Himmel
  choice: Das Gebet ist zu diesem Ort hin ausgerichtet, während Gott im Himmel als seiner Wohnstätte hört.
  alternative: „wenn sie an diesem Ort beten“ beziehungsweise „höre vom Himmel her“
  rationale: Der Vers verbindet den irdischen Tempel als Ausrichtungspunkt des Gebets mit dem Himmel als Gottes Wohnstätte. Die Übersetzung lässt beide Aussagen nebeneinander stehen, ohne Gottes Gegenwart auf den Tempel zu begrenzen oder die Bedeutung des Tempels abzuschwächen.
- issue: Semantik von שׁמע im abschließenden Gebet
  choice: „höre und vergib“
  alternative: „erhöre und vergib“
  rationale: „Erhöre“ könnte bereits eine positive Antwort auf jede Bitte voraussetzen. „Höre“ bewahrt die Wiederholung des hebräischen Verbs und lässt das Verhältnis zwischen Hören, Antworten und Vergeben offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit dem Gebet angemessener Erhabenheit. Die Imperative geben die hebräischen perfektischen Formen im Kontext der Bitte natürlich wieder. Die Wiederholung „Höre … höre“ bleibt als rhetorisches Merkmal des Ausgangstextes erhalten.
