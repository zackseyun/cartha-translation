id: 1KI.8.10
reference: 1 Kings 8:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְהִ֕י בְּ/צֵ֥את הַ/כֹּהֲנִ֖ים מִן הַ/קֹּ֑דֶשׁ וְ/הֶ/עָנָ֥ן מָלֵ֖א אֶת בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/010.yaml
  text: And when the priests came out from the holy place[a], the cloud filled the house of Yahweh.
translation:
  language: de
  text: Als die Priester aus dem Heiligtum[a] herauskamen, erfüllte die Wolke das Haus Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus dem Heiligen“ beziehungsweise „aus dem heiligen Ort“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּצֵאת
  choice: Als … herauskamen
  rationale: Die Verbindung aus וַיְהִי und dem Infinitiv mit בְּ leitet den nächsten Vorgang zeitlich ein. Im Deutschen gibt ein schlichter Als-Satz den hebräischen Erzählfluss natürlicher wieder als die wörtliche Formulierung „Und es geschah, als“.
- source_word: הַכֹּהֲנִים
  choice: die Priester
  rationale: Direkte Wiedergabe des bestimmten Plurals.
- source_word: מִן הַקֹּדֶשׁ
  choice: aus dem Heiligtum
  rationale: קֹדֶשׁ bezeichnet hier den heiligen Innenbereich des Tempels, aus dem die Priester nach dem Hineinbringen der Lade herauskommen. „Heiligtum“ ist im Deutschen natürlich und wahrt den sakralen räumlichen Bezug; „aus dem Heiligen“ bleibt als formnähere Möglichkeit in der Fußnote erhalten.
- source_word: וְהֶעָנָן
  choice: die Wolke
  rationale: Der bestimmte Ausdruck wird direkt wiedergegeben. Das וְ muss nach dem vorangestellten Als-Satz im Deutschen nicht zusätzlich mit „und“ übersetzt werden.
- source_word: מָלֵא
  choice: erfüllte
  rationale: Das Qal-Perfekt bezeichnet das vollständige Ausfüllen des Hauses durch die Wolke. „Erfüllte“ ist idiomatisch und behält den feierlichen Erzählton.
- source_word: בֵּית יְהוָה
  choice: das Haus Jahwes
  rationale: „Haus“ bewahrt das konkrete hebräische Bild für den Tempel. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, eine im modernen Deutschen etablierte Form des Tetragramms.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich den Eigennamen יהוה. „Jahwe“ bewahrt den Charakter als Gottesname, während „der HERR“ die traditionelle jüdische Lesetradition widerspiegelt, den Namen jedoch im Haupttext ersetzt.
- issue: Bezeichnung des heiligen Tempelbereichs
  choice: Heiligtum
  alternative: das Heilige / der heilige Ort
  rationale: Der Kontext spricht von dem sakralen Innenraum, aus dem die Priester treten. „Heiligtum“ legt keine über den Kontext hinausgehende präzise Unterteilung fest; die wörtlichere Mehrdeutigkeit wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Moderner, würdevoller deutscher Erzählstil. Der temporale Satzbau ist natürlich gehalten; „Haus Jahwes“ bewahrt zugleich das konkrete Tempelbild und den im Ausgangstext stehenden Gottesnamen.
