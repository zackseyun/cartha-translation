    rationale: Der hebräische Text lautet nicht im strengen Sinn deutsch „geredet“. Die Anmerkung sollte als Erklärung der Bildsprache formuliert sein, ohne eine scheinwörtliche deutsche Fassung als wörtlich auszugeben.
  revised_text: der du gehalten hast, was du deinem Diener David, meinem Vater, gesagt hast. Mit deinem Mund hast du es ausgesprochen, und mit deiner Hand hast du es erfüllt[b], wie es heute sichtbar ist.
