    rationale: „Jemandem gegenüber etwas halten“ ist hier kein natürlicher Ausdruck. Die Satzstellung „gehalten hast, was du deinem Diener David ... gesagt hast“ bewahrt die Bedeutung von „halten“ und lässt den Dativ natürlich zu dem zuvor Gesagten gehören.
  - severity: low
    issue: Fußnote [a] bildet keine echte lexikalische Alternative ab
    rationale: Die vorhandene Fußnote verändert nur die Wortstellung und erklärt weder eine sinnvolle Übersetzungsalternative noch eine strittige Mehrdeutigkeit. Sie kann entfallen.
  - severity: low
