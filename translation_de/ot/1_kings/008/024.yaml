- from: der du deinem Diener David, meinem Vater, gegenüber gehalten hast, was du ihm gesagt hattest[a]. Mit deinem Mund hast du es ausgesprochen, und mit deiner Hand hast du es erfüllt[b], wie es heute zu sehen ist.
  to: der du gehalten hast, was du deinem Diener David, meinem Vater, gesagt hast. Mit deinem Mund hast du es ausgesprochen, und mit deiner Hand hast du es erfüllt[b], wie es heute sichtbar ist.
  rationale: Die Umstellung beseitigt die unidiomatische Formulierung „gegenüber gehalten hast“, ohne die bewusste Unterscheidung zwischen dem Halten des gesprochenen Wortes (שׁמר) und dessen Erfüllung (מלא) aufzugeben. Die nicht aussagekräftige Fußnote [a] entfällt. Fußnote [b] erklärt die bewahrte Bildsprache präzise und ohne eine ungenaue Wörtlichkeitsbehauptung.
