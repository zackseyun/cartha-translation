base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/024.yaml
  text: who have kept for your servant David my father what you spoke to him[a]; you spoke with your mouth, and with your hand you have fulfilled it[b], as it is this day.
translation:
  language: de
  text: der du gehalten hast, was du deinem Diener David, meinem Vater, gesagt hast. Mit deinem Mund hast du es ausgesprochen, und mit deiner Hand hast du es erfüllt[b], wie es heute sichtbar ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Die Bildsprache von Gottes Mund und Hand betont: Was Gott sagte, hat er auch verwirklicht.'
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמַרְתָּ
  choice: gehalten hast
  rationale: שׁמר bezeichnet hier das Halten eines zuvor gegebenen Wortes. »Gehalten« bewahrt die Unterscheidung zu מִלֵּאתָ, das später ausdrücklich die Erfüllung bezeichnet.
- source_word: לְעַבְדְּךָ דָּוִד אָבִי
  choice: deinem Diener David, meinem Vater, gegenüber
  rationale: Die Formulierung gibt ל als Beziehung an und bewahrt sowohl die Bezeichnung Davids als Gottes Diener als auch Salomos Bezeichnung »mein Vater«. Die mögliche alternative syntaktische Zuordnung wird in Fußnote [a] genannt.
- source_word: אֵת אֲשֶׁר דִּבַּרְתָּ לוֹ
  choice: was du ihm gesagt hattest
  rationale: Das neutrale »gesagt« folgt דבר, ohne die Äußerung bereits ausdrücklich als Verheißung zu deuten, und bereitet die Wiederaufnahme des Redens im nächsten Satz vor.
- source_word: וַתְּדַבֵּר בְּפִיךָ
  choice: Mit deinem Mund hast du es ausgesprochen
  rationale: »Mit deinem Mund« erhält das konkrete Bild und den Parallelismus mit Gottes Hand; »ausgesprochen« klingt im Deutschen natürlich und macht den Bezug auf das zuvor Gesagte deutlich.
- source_word: וּבְיָדְךָ מִלֵּאתָ
  choice: und mit deiner Hand hast du es erfüllt
  rationale: מלא bedeutet hier, das Gesagte zur Erfüllung zu bringen. Das Bild der Hand bleibt als Gegenstück zum Mund erhalten.
- source_word: כַּיּוֹם הַזֶּה
  choice: wie es heute zu sehen ist
  rationale: Die hebräische Wendung verweist auf die gegenwärtig erkennbare Erfüllung; diese Wiedergabe ist im modernen Deutschen klar und idiomatisch.
theological_decisions:
- issue: Anthropomorphe Rede von Gottes »Mund« und »Hand«
  choice: Die konkreten Ausdrücke bleiben im Haupttext erhalten.
  alternative: 'Paraphrase: »Was du zugesagt hast, hast du auch vollbracht.«'
  rationale: Der hebräische Text stellt Gottes Reden und Handeln bewusst in einer bildhaften Parallele gegenüber. Eine abstrakte Paraphrase würde diese Rhetorik und die Betonung von Gottes wirksamem Wort abschwächen.
- issue: Charakter des zu David gesprochenen Wortes
  choice: »was du ihm gesagt hattest«
  alternative: »was du ihm verheißen hattest«
  rationale: Obwohl der Kontext von einer Verheißung handelt, steht hier das allgemeine Verb דבר. Die Übersetzung vermeidet es, die im Vers selbst aufgebaute Verbindung zwischen gesprochenem Wort und Erfüllung vorwegnehmend zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers bleibt als Relativsatz an den vorausgehenden Kontext angeschlossen. Die Bildsprache von Mund und Hand wird bewahrt; leicht erklärungsbedürftige Syntax und Idiomatik werden knapp in Fußnoten erläutert.
