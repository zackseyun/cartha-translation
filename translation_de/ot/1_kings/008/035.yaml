  text: בְּ/הֵעָצֵ֥ר שָׁמַ֛יִם וְ/לֹא יִהְיֶ֥ה מָטָ֖ר כִּ֣י יֶחֶטְאוּ לָ֑/ךְ וְ/הִֽתְפַּֽלְל֞וּ אֶל הַ/מָּק֤וֹם הַ/זֶּה֙ וְ/הוֹד֣וּ אֶת שְׁמֶ֔/ךָ וּ/מֵ/חַטָּאתָ֥/ם יְשׁוּב֖וּ/ן כִּ֥י תַעֲנֵֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/035.yaml
  text: When the heavens are shut up and there is no rain because they have sinned against you[a], and they pray toward this place and give thanks to your name and turn from their sin because you afflict them[b],
translation:
  language: de
  text: Wenn der Himmel verschlossen ist und kein Regen fällt, weil sie gegen dich gesündigt haben, und sie dann zu diesem Ort hin beten, deinen Namen bekennen[a] und sich von ihrer Sünde abwenden, weil du sie erhörst[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deinen Namen preisen“ oder „deinem Namen danken“. Das hebräische Verb kann offenes Bekennen beziehungsweise Anerkennen ebenso wie Lob und Dank ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Nach der masoretischen Vokalisierung: „weil du sie erhörst“. Aufgrund des Zusammenhangs wird auch übersetzt: „weil du sie demütigst“ oder „weil du sie heimsuchst“.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּהֵעָצֵר שָׁמַיִם
  choice: Wenn der Himmel verschlossen ist
  rationale: Die Präposition בְּ mit dem Infinitiv Nifal bildet einen temporalen Nebensatz. Das hebräische שָׁמַיִם steht zwar formal im Plural, wird im heutigen Standarddeutsch in dieser Bedeutung aber natürlich mit dem Singular „Himmel“ wiedergegeben.
- source_word: וְלֹא יִהְיֶה מָטָר
  choice: und kein Regen fällt
  rationale: Die idiomatische deutsche Wendung bezeichnet klar das Ausbleiben des Regens und fügt sich natürlich in den temporalen Satz ein.
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: weil sie gegen dich gesündigt haben
  rationale: כִּי ist hier kausal; לָךְ bezeichnet in diesem Zusammenhang die gegen Gott gerichtete Verfehlung. Das Perfekt beschreibt die dem Ausbleiben des Regens vorausliegende Sünde.
- source_word: וְהִתְפַּלְלוּ אֶל הַמָּקוֹם הַזֶּה
  choice: und sie dann zu diesem Ort hin beten
  rationale: אֶל bezeichnet hier die Gebetsrichtung auf den Tempel zu, nicht den Ort als Empfänger des Gebets. „zu diesem Ort hin“ wahrt diese Unterscheidung.
- source_word: וְהוֹדוּ אֶת שְׁמֶךָ
  choice: deinen Namen bekennen
  rationale: ידה im Hifil kann dankendes Preisen, Lob oder offenes Bekennen beziehungsweise Anerkennen ausdrücken. Im Zusammenhang mit Sünde und Umkehr gibt „bekennen“ die Anerkennung von Gottes Namen prägnant wieder, ohne das mögliche Lob- und Dankmoment auszuschließen.
- source_word: וּמֵחַטָּאתָם יְשׁוּבוּן
  choice: und sich von ihrer Sünde abwenden
  rationale: שׁוב mit מִן bezeichnet eine Abkehr. Die konkrete Wendung bleibt näher am hebräischen Bild als das stärker zusammenfassende „Buße tun“.
- source_word: כִּי תַעֲנֵם
  choice: weil du sie erhörst
  rationale: Nach der masoretischen Vokalisierung des WLC ist תַעֲנֵם eine Form von ענה „antworten“ mit Objektsuffix. Bei einem Gebet ist „erhören“ im Deutschen die passende kontextuelle Wiedergabe. Die kontextuell naheliegende, aber morphologisch schwierige Deutung „demütigen/heimsuchen“ wird in einer Fußnote bewahrt.
theological_decisions:
- issue: Gebetsrichtung zum Tempel
  choice: zu diesem Ort hin beten
  alternative: zu diesem Ort beten
  rationale: Die Formulierung beschreibt die räumliche Ausrichtung des Gebets, ohne den Tempel selbst zum Adressaten zu machen.
- issue: Deutung von תַעֲנֵם
  choice: weil du sie erhörst
  alternative: weil du sie demütigst / heimsuchst
  rationale: Die masoretische Punktierung stützt „antworten/erhören“, während der Zusammenhang von Dürre, Züchtigung und Umkehr für „demütigen/heimsuchen“ sprechen kann. Die Hauptfassung folgt dem vorgelegten punktierten Ausgangstext; die echte Spannung bleibt in der Fußnote sichtbar.
- issue: Bedeutung von הוֹדוּ אֶת שְׁמֶךָ
  choice: deinen Namen bekennen
  alternative: deinen Namen preisen / deinem Namen danken
  rationale: Das Verb umfasst Anerkennen, Bekennen, Preisen und Danken. Der Bußzusammenhang begünstigt „bekennen“, doch die anderen Bedeutungsnuancen werden nicht ausgeschlossen und deshalb vermerkt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers bleibt mit einem Komma offen, weil der Satz im folgenden Vers weitergeführt wird. „Himmel“ und „kein Regen fällt“ sind natürliche deutsche Entsprechungen der hebräischen Wetterformel; „zu diesem Ort hin“ macht die Gebetsrichtung unmissverständlich.
