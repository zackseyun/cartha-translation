base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/015.yaml
  text: And he said[a], “Blessed be Yahweh, the God of Israel, who spoke with his mouth to David my father and has fulfilled it with his hand, saying,”
translation:
  language: de
  text: 'Und er sagte: »Gepriesen[a] sei Jahwe, der Gott Israels, der mit seinem Mund zu David, meinem Vater, geredet und es mit seiner Hand erfüllt hat und sagte:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Gesegnet sei«; die hebräische Segensformel wird traditionell so wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Gepriesen sei
  rationale: Die hebräische Segensformel bezeichnet hier die ehrende Anerkennung Gottes. »Gepriesen sei« ist im heutigen Deutsch natürlich und würdig; die formnähere Wiedergabe wird in der Fußnote genannt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Die hebräische Genitivverbindung wird direkt und idiomatisch wiedergegeben.
- source_word: אֲשֶׁר דִּבֶּר בְּפִיו
  choice: Er hat mit seinem Mund … geredet
  rationale: Die ausdrückliche Erwähnung des Mundes bleibt erhalten, damit die beabsichtigte Entsprechung zu »mit seiner Hand« sichtbar wird.
- source_word: אֵת דָּוִד אָבִי
  choice: zu meinem Vater David
  rationale: אֵת bezeichnet beim Verb דבר hier die angesprochene Person; »zu« ist dafür im Deutschen natürlich.
- source_word: וּבְיָדוֹ מִלֵּא
  choice: und es mit seiner Hand erfüllt
  rationale: Das im Hebräischen unausgesprochene Objekt wird durch »es« aufgenommen. Die Hand-Metapher bleibt als Gegenstück zum Mund erhalten.
- source_word: לֵאמֹר
  choice: 'Er sprach:'
  rationale: Der quotative Infinitiv leitet die direkte Rede des folgenden Verses ein. Ein eigener deutscher Satz verdeutlicht ohne Bedeutungsänderung den Sprecherwechsel.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. »Jahwe« bewahrt ihn, statt ihn durch den traditionellen Ersatztitel wiederzugeben.
- issue: Segensformel בָּרוּךְ für Gott
  choice: Gepriesen sei
  alternative: Gesegnet sei
  rationale: »Gepriesen sei« gibt die Funktion der Formel im natürlichen modernen Deutsch wieder, ohne eine zusätzliche konfessionelle Deutung einzutragen; die formnähere Alternative bleibt in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die körperbezogene Parallelität »mit seinem Mund … mit seiner Hand« wurde bewusst bewahrt. Der abschließende Quotativ wurde als »Er sprach:« formuliert, da im nächsten Vers Jahwes frühere Rede folgt.
