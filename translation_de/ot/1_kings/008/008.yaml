  source_fidelity: 'Die räumliche Aussage wird im Wesentlichen korrekt wiedergegeben: Die Enden der Tragstangen waren vom äußeren heiligen Tempelraum aus vor dem inneren Heiligtum sichtbar, nicht aber von außerhalb. Auch die Fortbestandsformel ist sachgerecht. Die resultative Wiedergabe von וַיַּאֲרִכוּ mit „waren so lang“ ist vertretbar, obwohl das Verb eigentlich das Verlängern bzw. Ausziehen der Stangen ausdrückt.'
