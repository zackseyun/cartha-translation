  terminology: „Tragstangen“ ist treffend. „innerstes Heiligtum“ ist eine angemessene, nicht überinterpretierende Wiedergabe von דביר; die Fußnote bietet die traditionelle Alternative „Allerheiligstes“ korrekt an.
