  text: וַֽ/יַּאֲרִכוּ֮ הַ/בַּדִּים֒ וַ/יֵּרָאוּ֩ רָאשֵׁ֨י הַ/בַּדִּ֤ים מִן הַ/קֹּ֨דֶשׁ֙ עַל פְּנֵ֣י הַ/דְּבִ֔יר וְ/לֹ֥א יֵרָא֖וּ הַ/ח֑וּצָ/ה וַ/יִּ֣הְיוּ שָׁ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/008.yaml
  text: And the poles were so long that the ends of the poles were seen from the Holy Place before the inner sanctuary[a], but they could not be seen from outside; and they are there to this day.
translation:
  language: de
  text: Und die Tragstangen waren so lang, dass ihre Enden vom Heiligen Raum aus vor dem innersten Heiligtum[a] zu sehen waren; von draußen aber waren sie nicht zu sehen. Sie sind dort bis zum heutigen Tag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor dem Allerheiligsten“. Das hebräische Wort bezeichnet den innersten Raum des Tempels.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲרִכוּ
  choice: waren so lang
  rationale: Der resultative Sinn des Verbs wird im Deutschen natürlich wiedergegeben und stellt den Zusammenhang mit der anschließenden Sichtbarkeit her.
- source_word: הַבַּדִּים
  choice: die Tragstangen
  rationale: בַּדִּים bezeichnet hier die zum Tragen der Bundeslade bestimmten Stangen; „Tragstangen“ ist präzise und gegenwärtig verständlich.
- source_word: וַיֵּרָאוּ רָאשֵׁי הַבַּדִּים
  choice: ihre Enden … zu sehen waren
  rationale: רָאשֵׁי bedeutet wörtlich „Köpfe“, bezeichnet bei Stangen aber natürlich deren Enden. Die Konstruktion gibt das passive Sichtbarsein wieder.
- source_word: מִן הַקֹּדֶשׁ
  choice: vom Heiligen aus
  rationale: הַקֹּדֶשׁ bezeichnet hier den vorderen heiligen Tempelraum im Unterschied zum innersten Heiligtum. Die substantivische Form „das Heilige“ bewahrt diese kultisch-räumliche Bezeichnung.
- source_word: עַל פְּנֵי הַדְּבִיר
  choice: vor dem innersten Heiligtum
  rationale: דְּבִיר bezeichnet den innersten Tempelraum, in dem die Lade stand; עַל־פְּנֵי wird idiomatisch mit „vor“ wiedergegeben.
- source_word: וְלֹא יֵרָאוּ הַחוּצָה
  choice: von draußen aber waren sie nicht zu sehen
  rationale: Die Übersetzung erhält den ausdrücklichen Gegensatz zwischen der Sichtbarkeit vom Heiligen aus und der fehlenden Sichtbarkeit von draußen.
- source_word: וַיִּהְיוּ שָׁם עַד הַיּוֹם הַזֶּה
  choice: Sie sind dort bis zum heutigen Tag
  rationale: Die übliche hebräische Wendung bezeichnet einen aus Sicht des Erzählers fortbestehenden Zustand; das deutsche Präsens gibt ihn unmittelbar wieder.
theological_decisions:
- issue: Bezeichnung des דְּבִיר
  choice: innerstes Heiligtum
  alternative: Allerheiligstes
  rationale: „Innerstes Heiligtum“ beschreibt den architektonischen Bezug direkt, ohne die mögliche traditionelle Gleichsetzung sprachlich stärker festzulegen als der hebräische Ausdruck selbst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Tempelräume werden klar unterschieden; der Satzbau bleibt gut lesbar und folgt zugleich eng der räumlichen Aussage des Hebräischen.
