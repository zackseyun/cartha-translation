base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/013.yaml
  text: I have indeed built you an exalted house[b][a], a settled place for you to dwell forever.
translation:
  language: de
  text: Ja, ich habe dir ein erhabenes Haus gebaut,[a] eine feste Stätte, damit du für immer darin wohnst.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eine hohe, majestätische Wohnstätte«. Das hebräische Wort bezeichnet eine erhabene Wohnstätte.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »eine fest gegründete Stätte, damit du für immer darin thronst«. Das zugrunde liegende Verb kann sowohl »wohnen« als auch »sitzen/thronen« bedeuten.'
    reason: lexical_and_semantic_alternative
lexical_decisions:
- source_word: בָּנֹה בָנִיתִי
  choice: Ja, ich habe … gebaut
  rationale: Der vorangestellte absolute Infinitiv verstärkt das finite Verb. »Ja« gibt diese Bekräftigung im heutigen Deutsch natürlich wieder.
- source_word: בֵּית זְבֻל
  choice: ein erhabenes Haus
  rationale: בֵּית bedeutet wörtlich »Haus« und bewahrt die Tempelmetaphorik. זְבֻל bezeichnet hier eine erhabene beziehungsweise hohe Wohnstätte; die adjektivische Wiedergabe ist klar und würdevoll.
- source_word: לָךְ
  choice: dir
  rationale: Der hebräische Ausdruck bezeichnet den Nutznießer beziehungsweise Adressaten des Bauens; »dir … gebaut« ist im Deutschen idiomatisch.
- source_word: מָכוֹן
  choice: eine feste Stätte
  rationale: Das Wort bezeichnet einen fest gegründeten oder beständigen Ort. »Feste Stätte« bewahrt den Gedanken von Stabilität und Dauer.
- source_word: לְשִׁבְתְּךָ
  choice: an der du … wohnen sollst
  rationale: ישׁב kann »sitzen«, »wohnen« oder im königlichen Zusammenhang auch »thronen« bedeuten. »Wohnen« passt unmittelbar zur Hausmetaphorik; die Fußnote wahrt die mögliche Thronvorstellung.
- source_word: עוֹלָמִים
  choice: für immer
  rationale: Die Form bezeichnet unabsehbare, dauerhafte Zeit. »Für immer« ist die natürliche moderne Wiedergabe.
theological_decisions:
- issue: Das Wohnen Gottes im Tempel
  choice: Die ausdrückliche Aussage, dass Gott dort wohnen soll, bleibt ohne erklärende Abschwächung stehen.
  alternative: »Ein Ort für deinen Namen« oder »ein Ort, an dem du verehrt wirst«
  rationale: Der hebräische Vers spricht unmittelbar von Gottes Wohnen. Eine Einfügung von »Name« oder eine kultische Paraphrase würde eine Auslegung aus dem weiteren Zusammenhang in diesen Vers hineintragen.
- issue: Mögliche Bedeutung von ישׁב als Wohnen oder Thronen
  choice: Im Haupttext steht »wohnen«, die mögliche Nuance »thronen« wird in einer Fußnote genannt.
  alternative: »an der du für immer thronst«
  rationale: Die Hausmetaphorik stützt »wohnen«, doch der Tempel- und Königskontext lässt eine Thronnuance zu. Diese Spannung wird nicht stillschweigend beseitigt.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit knapper poetischer Satzform. »Haus« bleibt statt der erklärenden Bezeichnung »Tempel« erhalten. Alle Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Wendungen.
