  verdict: revise
  source_fidelity: Die Grundwiedergabe trifft die emphatische Bauaussage, »Haus«, die Erhabenheit von זְבֻל, die beständige Stätte und das dauernde Wohnen gut. »wohnen sollst« fügt jedoch eine modale Sollensnuance hinzu, die der hebräische Infinitiv mit Präposition (»für/damit du wohnst«) nicht ausdrückt.
  naturalness: Der Satz ist modernes, gehobenes Standarddeutsch. Mit »damit du für immer darin wohnst« wird die Zweckbeziehung idiomatisch ausgedrückt und zugleich der unnötige Modalton vermieden.
  terminology: »Erhabenes Haus« wahrt bewusst die wörtliche Tempelterminologie. »Feste Stätte« gibt מָכוֹן angemessen wieder. Die Fußnote zu זְבֻל sollte nicht »Wohnhaus« sagen, da dies im Deutschen leicht profan wirkt; »Wohnstätte« ist hier sachgerechter. Die Thronnuance von ישׁב bleibt zutreffend als Alternative vermerkt.
