  text: לְ/הַטּ֥וֹת לְבָבֵ֖/נוּ אֵלָ֑י/ו לָ/לֶ֣כֶת בְּ/כָל דְּרָכָ֗י/ו וְ/לִ/שְׁמֹ֨ר מִצְוֺתָ֤י/ו וְ/חֻקָּי/ו֙ וּ/מִשְׁפָּטָ֔י/ו אֲשֶׁ֥ר צִוָּ֖ה אֶת אֲבֹתֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/058.yaml
  text: that he may incline our hearts to himself[a], to walk in all his ways and to keep his commandments, his statutes, and his judgments, which he commanded our fathers.
translation:
  language: de
  text: Möge er unser Herz zu sich neigen, damit wir auf allen seinen Wegen gehen und seine Gebote, seine Satzungen und seine Rechtsbestimmungen halten, die er unseren Vätern[a] geboten hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: unseren Vorfahren. Wörtlich: unseren Vätern.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַטּוֹת
  choice: neige
  rationale: Das Hifil von נטה bezeichnet hier das Hinwenden oder Ausrichten. „Neige“ bewahrt das Bild einer von Gott bewirkten inneren Ausrichtung und passt zum Gebetszusammenhang.
- source_word: לְבָבֵנוּ
  choice: unser Herz
  rationale: Der hebräische Singular mit Pluralsuffix bezeichnet kollektiv das innere Denken, Wollen und Empfinden des Volkes. Der deutsche Singular „unser Herz“ bildet diese Form und Vorstellung ab.
- source_word: אֵלָיו
  choice: zu sich
  rationale: Die Präposition bezeichnet die Ausrichtung auf Gott. Im Deutschen ist „zu sich“ nach „unser Herz neige“ natürlich und macht den Rückbezug auf Gott deutlich.
- source_word: לָלֶכֶת בְּכָל דְּרָכָיו
  choice: damit wir auf allen seinen Wegen gehen
  rationale: „Gehen auf seinen Wegen“ bewahrt das hebräische Bundesbild für eine Lebensführung nach Gottes Willen. „Damit“ gibt den Zielzusammenhang der Infinitivkonstruktion verständlich wieder.
- source_word: וְלִשְׁמֹר
  choice: und … halten
  rationale: שׁמר bezeichnet bei Geboten deren treue Beachtung. „Halten“ ist im Deutschen klar und im biblischen Rechts- und Bundeskontext etabliert.
- source_word: מִצְוֺתָיו
  choice: seine Gebote
  rationale: מִצְוָה bezeichnet verbindliche Anweisungen. „Gebote“ gibt den formellen Charakter präzise wieder.
- source_word: וְחֻקָּיו
  choice: seine Satzungen
  rationale: חֹק/חֻקָּה bezeichnet festgesetzte Vorschriften. „Satzungen“ wahrt die Unterscheidung zu den übrigen Rechtstermini.
- source_word: וּמִשְׁפָּטָיו
  choice: seine Rechtsbestimmungen
  rationale: מִשְׁפָּט kann gerichtliche Entscheidungen, Rechtsnormen oder Ordnungen bezeichnen. „Rechtsbestimmungen“ erhält die juristische Nuance und ist im modernen Deutsch verständlicher als „Rechte“ oder „Gerichte“.
- source_word: אֲשֶׁר צִוָּה
  choice: die er … geboten hat
  rationale: Der Relativsatz bezieht sich auf die drei Gruppen göttlicher Vorschriften. „Geboten hat“ folgt dem Verb צוה eng und bleibt natürlich.
- source_word: אֶת אֲבֹתֵינוּ
  choice: unseren Vätern
  rationale: אָבוֹתֵינוּ lautet wörtlich „unsere Väter“ und verweist auf Israels frühere Generationen. Die konkrete Verwandtschaftsbezeichnung bleibt im Text erhalten; die umfassendere Wiedergabe „Vorfahren“ wird in der Fußnote genannt.
theological_decisions:
- issue: Dreigliedrige Terminologie des Bundesrechts
  choice: seine Gebote, seine Satzungen und seine Rechtsbestimmungen
  alternative: seine Weisungen, seine Ordnungen und seine Rechtssätze
  rationale: Der hebräische Text verwendet drei verschiedene Rechtstermini. Die Übersetzung unterscheidet sie, ohne eine konfessionell geprägte Systematik in die Begriffe hineinzulesen.
- issue: Göttliches Wirken und menschlicher Gehorsam
  choice: Er neige unser Herz zu sich, damit wir … gehen und … halten
  alternative: damit er unser Herz zu sich neigt, auf allen seinen Wegen zu gehen und … zu halten
  rationale: Die Formulierung bewahrt sowohl Gottes Wirken an der inneren Ausrichtung als auch den daraus folgenden menschlichen Gehorsam. Sie löst die Spannung nicht zugunsten nur einer Seite auf.
- issue: Geschlechtlich markierte Bezeichnung früherer Generationen
  choice: unseren Vätern
  alternative: unseren Vorfahren
  rationale: Die maskuline Verwandtschaftsbezeichnung des Hebräischen bleibt im Haupttext sichtbar. Da sie im Kontext zugleich frühere Generationen Israels bezeichnen kann, wird „Vorfahren“ als mögliche Wiedergabe vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter biblischer Weg- und Herzmetaphorik. Der kollektive Singular „unser Herz“ folgt der hebräischen Form. Die drei Rechtstermini werden unterscheidbar wiedergegeben, ohne unnötig altertümliche Wörter zu verwenden.
