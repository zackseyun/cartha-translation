  text: וַ/יַּסֵּ֤ב הַ/מֶּ֨לֶךְ֙ אֶת פָּנָ֔י/ו וַ/יְבָ֕רֶךְ אֵ֖ת כָּל קְהַ֣ל יִשְׂרָאֵ֑ל וְ/כָל קְהַ֥ל יִשְׂרָאֵ֖ל עֹמֵֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/014.yaml
  text: Then the king turned around and blessed all the assembly of Israel[b][a], while all the assembly of Israel was standing.
translation:
  language: de
  text: Dann wandte sich der König um und segnete die ganze Versammlung Israels[a], während die ganze Versammlung Israels dastand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die ganze Gemeinde Israels«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסֵּב אֶת־פָּנָיו
  choice: wandte sich ... um
  rationale: Die Wendung bedeutet wörtlich, dass der König »sein Gesicht wandte«. Das idiomatische deutsche »sich umwenden« gibt die körperliche Bewegung natürlich und präzise wieder.
- source_word: וַיְבָרֶךְ
  choice: segnete
  rationale: Die übliche und kontextgemäße Wiedergabe von ברך; sie kann hier einen öffentlich ausgesprochenen Segen bezeichnen, ohne dies erklärend in den Text einzutragen.
- source_word: כָּל־קְהַל יִשְׂרָאֵל
  choice: die ganze Versammlung Israels
  rationale: קהל bezeichnet hier das versammelte Volk. »Versammlung« bewahrt den gemeinschaftlichen und konkreten Charakter des Ausdrucks.
- source_word: וְכָל־קְהַל יִשְׂרָאֵל עֹמֵד
  choice: während die ganze Versammlung Israels dastand
  rationale: Der verblosen Konstruktion mit Partizip entspricht eine begleitende, andauernde Situation. »Während ... dastand« gibt Haltung und Hintergrundhandlung idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von »die ganze Versammlung Israels« bleibt als rhetorisches Merkmal des hebräischen Textes erhalten; das wörtliche »sein Gesicht wenden« wird zugunsten der natürlichen deutschen Wendung »sich umwenden« idiomatisch wiedergegeben.
