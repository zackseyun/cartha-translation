  text: בְּֽ/הִנָּגֵ֞ף עַמְּ/ךָ֧ יִשְׂרָאֵ֛ל לִ/פְנֵ֥י אוֹיֵ֖ב אֲשֶׁ֣ר יֶחֶטְאוּ לָ֑/ךְ וְ/שָׁ֤בוּ אֵלֶ֨י/ךָ֙ וְ/הוֹד֣וּ אֶת שְׁמֶ֔/ךָ וְ/הִֽתְפַּֽלְל֧וּ וְ/הִֽתְחַנְּנ֛וּ אֵלֶ֖י/ךָ בַּ/בַּ֥יִת הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/033.yaml
  text: When your people Israel are struck down before an enemy because they have sinned against you[a], and they turn back to you and confess your name and pray and plead with you in this house,
translation:
  language: de
  text: Wenn dein Volk Israel vor einem Feind geschlagen wird, weil es gegen dich gesündigt hat, und zu dir umkehrt, deinen Namen bekennt[a], in diesem Haus zu dir betet und dich anfleht,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »deinen Namen preist« oder »deinem Namen dankt«. Das hebräische Verb kann je nach Zusammenhang Bekennen, Preisen oder Danken bezeichnen.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: בְּהִנָּגֵף
  choice: geschlagen wird
  rationale: Das Niphal von נָגַף bezeichnet im militärischen Zusammenhang, dass jemand vor einem Feind geschlagen beziehungsweise besiegt wird. Die Formulierung wahrt Passiv und Bildlichkeit des Hebräischen.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: dein Volk Israel
  rationale: Bewahrt sowohl das Bundesverhältnis im Possessivpronomen als auch die Bezeichnung des Volkes als Israel.
- source_word: לִפְנֵי אוֹיֵב
  choice: vor einem Feind
  rationale: לִפְנֵי bedeutet wörtlich „vor“; in militärischen Niederlagenformeln ist dies auch im Deutschen verständlich. אוֹיֵב ist nicht determiniert, daher „einem Feind“.
- source_word: אֲשֶׁר יֶחֶטְאוּ לָךְ
  choice: weil es gegen dich gesündigt hat
  rationale: אֲשֶׁר führt hier den Grund der Niederlage ein. Das kollektive Singularpronomen „es“ nimmt „Volk“ grammatisch korrekt auf.
- source_word: וְשָׁבוּ אֵלֶיךָ
  choice: dann aber zu dir umkehrt
  rationale: שׁוּב bezeichnet die Rückwendung zu Gott. „Umkehrt“ gibt die geistliche Bewegung wieder, ohne den Begriff durch eine ausführlichere Bußformel zu erweitern.
- source_word: וְהוֹדוּ אֶת שְׁמֶךָ
  choice: deinen Namen bekennt
  rationale: ידה im Hiphil kann Bekennen, Preisen oder Danken bezeichnen. Im Zusammenhang von Sünde und Umkehr passt „bekennt“ gut; die echten lexikalischen Alternativen werden in einer Fußnote erhalten.
- source_word: וְהִתְפַּלְלוּ
  choice: betet
  rationale: Entspricht der üblichen Bedeutung des Hitpael von פלל.
- source_word: וְהִתְחַנְּנוּ אֵלֶיךָ
  choice: dich anfleht
  rationale: Das Hitpael von חנן bezeichnet ein eindringliches Flehen um Gnade oder Gunst. „Dich anfleht“ ist natürliches modernes Deutsch und vermeidet eine unnötige inhaltliche Ergänzung.
- source_word: בַּבַּיִת הַזֶּה
  choice: in diesem Haus
  rationale: Die Präposition bedeutet hier „in“, und בַּיִת bezeichnet das für den HERRN errichtete Haus. „Haus“ bleibt näher am Ausgangstext als das deutende „Tempel“.
theological_decisions:
- issue: Umkehrsprache ohne lehrmäßige Überbestimmung
  choice: zu dir umkehrt
  alternative: zu dir zurückkehrt; Buße tut und zu dir zurückkehrt
  rationale: Das hebräische שׁוּב bezeichnet Wende oder Rückkehr. „Umkehrt“ bewahrt hier die auf Gott gerichtete Bewegung, ohne eine zusätzliche dogmatische Formel einzutragen.
- issue: Mehrdeutigkeit von וְהוֹדוּ אֶת שְׁמֶךָ
  choice: deinen Namen bekennt
  alternative: deinen Namen preist; deinem Namen dankt
  rationale: Der Zusammenhang von Sünde, Niederlage und Umkehr stützt „bekennt“, doch der hebräische Ausdruck lässt auch Lob oder Dank zu. Diese Spannung wird durch die Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der kollektive Ausdruck „dein Volk Israel“ wird durchgehend mit dem grammatischen Singular aufgenommen. Der abschließende Beistrich bleibt stehen, weil der Satz im folgenden Vers fortgeführt wird.
