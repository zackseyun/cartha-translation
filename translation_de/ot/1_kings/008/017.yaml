base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/017.yaml
  text: It was in the heart of David my father to build a house for the name of Yahweh[a], the God of Israel.
translation:
  language: de
  text: Es lag David, meinem Vater, am Herzen, ein Haus für den Namen Jahwes, des Gottes Israels, zu bauen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »einen Tempel für den Namen Jahwes«; das Hebräische sagt wörtlich »ein Haus«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי עִם לְבַב
  choice: hatte sich vorgenommen
  rationale: Die hebräische Wendung bezeichnet eine im Herzen vorhandene Absicht. Die idiomatische deutsche Formulierung gibt diesen Sinn natürlich wieder, ohne die Aussage als bereits ausgeführte Handlung darzustellen.
- source_word: דָּוִד אָבִי
  choice: David, mein Vater
  rationale: Bewahrt die hebräische Wortfolge und ist durch die appositionelle Zeichensetzung im Deutschen klar und natürlich.
- source_word: לִבְנוֹת
  choice: zu bauen
  rationale: Entspricht der üblichen Bedeutung von בנה und passt zum Bau des Heiligtums.
- source_word: בַּיִת
  choice: ein Haus
  rationale: Das Hebräische sagt wörtlich »Haus«. Diese im Kontext verständliche und theologisch bedeutsame Bezeichnung wird gegenüber der deutenden Wiedergabe »Tempel« beibehalten.
- source_word: לְשֵׁם
  choice: für den Namen
  rationale: Bewahrt die charakteristische biblische Formulierung und vermeidet eine einengende Paraphrase wie »zu Ehren«.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen als im Deutschen gebräuchliche Umschrift wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: des Gottes Israels
  rationale: Die Genitivapposition identifiziert Jahwe natürlich und präzise als den Gott Israels.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich den Gottesnamen. Seine Umschrift wahrt diese Unterscheidung gegenüber einem ersetzenden Titel.
- issue: Wiedergabe von בַּיִת im Tempelkontext
  choice: Haus
  alternative: Tempel
  rationale: »Haus« entspricht unmittelbar dem hebräischen Wortlaut und erhält das Motiv des Heiligtums als Haus; »Tempel« macht den Bezug deutlicher, ist aber interpretierender.
- issue: Wiedergabe der Herzenswendung עִם לְבַב
  choice: hatte sich vorgenommen
  alternative: es lag David, meinem Vater, am Herzen
  rationale: Die gewählte Formulierung bringt die beabsichtigte Handlung im Deutschen klar zum Ausdruck. Die Alternative bewahrt die Körpermetapher stärker, kann jedoch zusätzlich den Eindruck eines besonders dringlichen Anliegens vermitteln.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die idiomatische Absichtsformulierung vermeidet eine schwerfällige Nachbildung der hebräischen Wendung; »Haus« und »für den Namen« bewahren zugleich zentrale Bilder des Ausgangstextes.
