source:
  edition: WLC
  text: וְ֠/אַתָּה תִּשְׁמַ֨ע הַ/שָּׁמַ֜יִם מְכ֤וֹן שִׁבְתֶּ֨/ךָ֙ וְ/סָלַחְתָּ֣ וְ/עָשִׂ֔יתָ וְ/נָתַתָּ֤ לָ/אִישׁ֙ כְּ/כָל דְּרָכָ֔י/ו אֲשֶׁ֥ר תֵּדַ֖ע אֶת לְבָב֑/וֹ כִּֽי אַתָּ֤ה יָדַ֨עְתָּ֙ לְ/בַדְּ/ךָ֔ אֶת לְבַ֖ב כָּל בְּנֵ֥י הָ/אָדָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/039.yaml
  text: then may you hear in heaven[a], the place where you dwell, and forgive, and act, and give to each man according to all his ways, whose heart you know—for you alone know the heart of all the sons of man—
translation:
  language: de
  text: dann höre du im Himmel, dem Ort, an dem du wohnst, und vergib und handle. Gib jedem nach all seinen Wegen, dessen Herz du kennst; denn du allein kennst das Herz aller Menschen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „aller Söhne des Menschen“; eine hebräische Wendung für alle Menschen.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: höre du
  rationale: Der Imperfekt steht im Zusammenhang von Salomos Gebet als Bitte. Der deutsche Aufforderungssatz gibt diesen petitionären Sinn wieder; „du“ bewahrt zugleich die Hervorhebung durch וְאַתָּה.
- source_word: הַשָּׁמַיִם
  choice: im Himmel
  rationale: Die Ortsangabe ist im Deutschen mit „im Himmel“ natürlich wiedergegeben und wird durch die folgende Apposition näher bestimmt.
- source_word: מְכוֹן שִׁבְתֶּךָ
  choice: dem Ort, an dem du wohnst
  rationale: מָכוֹן bezeichnet einen festen Ort. Die Formulierung bewahrt den lokalen Sinn und klingt verständlicher als das steifere „Stätte deines Wohnens“.
- source_word: וְסָלַחְתָּ וְעָשִׂיתָ
  choice: und vergib und handle
  rationale: Die mit Waw verbundenen Perfektformen führen die erbetenen Handlungen Gottes fort. „Handle“ lässt den breiten Sinn von עָשָׂה bestehen, ohne die Art des Eingreifens festzulegen.
- source_word: וְנָתַתָּ לָאִישׁ
  choice: Gib jedem
  rationale: Der Singular אִישׁ hat hier verteilenden Sinn. „Jedem“ ist im Deutschen knapp, natürlich und geschlechtlich nicht über den hebräischen Aussageumfang hinaus festgelegt.
- source_word: כְּכָל דְּרָכָיו
  choice: entsprechend allen seinen Wegen
  rationale: „Wege“ bewahrt die hebräische Metapher für Lebensführung und Verhalten; „entsprechend“ macht die Maßgabe der Vergeltung deutlich, ohne sie näher zu bestimmen.
- source_word: אֲשֶׁר תֵּדַע אֶת לְבָבוֹ
  choice: da du sein Herz kennst
  rationale: אֲשֶׁר kann hier begründend beziehungsweise umstandsangebend verstanden werden. „Da“ fügt die Herzenskenntnis als Grundlage des angemessenen Handelns an, ohne sie mit den äußerlich sichtbaren Wegen gleichzusetzen.
- source_word: לְבָב / לְבָבוֹ
  choice: Herz
  rationale: „Herz“ bewahrt das biblische Bild für das innere Denken, Wollen und Empfinden des Menschen.
- source_word: לְבַדְּךָ
  choice: du allein
  rationale: Die Wendung betont, dass ausschließlich Gott die Herzen aller Menschen kennt.
- source_word: כָּל בְּנֵי הָאָדָם
  choice: alle Menschen
  rationale: Die wörtliche Wendung „alle Söhne des Menschen“ ist im Hebräischen eine umfassende Bezeichnung für sämtliche Menschen. Die natürliche deutsche Wiedergabe steht im Haupttext; die konkrete Bildform wird in der Fußnote dokumentiert.
theological_decisions:
- issue: Gottes ausschließliches Wissen um das menschliche Herz
  choice: du allein kennst das Herz aller Menschen
  alternative: nur du erkennst das Innere aller Menschen
  rationale: „Du allein“ erhält die ausdrückliche Exklusivität von לְבַדְּךָ. „Herz“ bewahrt die biblische Anthropologie, ohne den Ausdruck auf Verstand, Gefühle oder Absichten zu verengen.
- issue: Maßstab des göttlichen Gebens beziehungsweise Vergeltens
  choice: Gib jedem entsprechend allen seinen Wegen, da du sein Herz kennst
  alternative: Vergilt jedem nach allen seinen Wegen, dessen Herz du kennst
  rationale: „Gib“ bleibt näher am breiten וְנָתַתָּ als das stärker deutende „vergilt“. Die Formulierung lässt offen, wie Gottes Kenntnis des Herzens und die Wege eines Menschen im konkreten Urteil zusammengehören.
- issue: Anthropologische Wendung כָּל בְּנֵי הָאָדָם
  choice: alle Menschen
  alternative: alle Söhne des Menschen
  rationale: Die hebräische maskuline Bildwendung bezeichnet hier die gesamte Menschheit. Eine wörtliche Wiedergabe wäre im modernen Deutschen missverständlich; die Fußnote bewahrt ihre Form und den inklusiven Sinn.
translation_notes:
  register: Moderne, würdige Gebetssprache. Die Imperative geben den bittenden Charakter wieder, ohne altertümliche Konjunktivformen wie „wollest du“ zu verwenden. Die Weg- und Herzmetaphorik des Hebräischen bleibt erhalten.
