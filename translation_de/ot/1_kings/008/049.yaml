lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: dann höre
  rationale: Das Qal Perfekt 2. Person maskulin Singular steht in der Bittfolge mit auffordernder Bedeutung. „Dann“ gibt den Anschluss an die vorausgehenden Bedingungen natürlich wieder.
- source_word: הַשָּׁמַיִם מְכוֹן שִׁבְתְּךָ
  choice: im Himmel, der Stätte, an der du wohnst
  rationale: „Im Himmel“ bewahrt die naheliegende lokale Lesart ohne ein im Hebräischen nicht ausdrücklich vorhandenes „vom“. מָכוֹן bezeichnet eine feste bzw. bestimmte Stätte; die appositionale Formulierung ist im Deutschen natürlich und würdevoll.
- source_word: תְּפִלָּתָם וְאֶת־תְּחִנָּתָם
  choice: ihr Gebet und ihr Flehen
  rationale: „Gebet“ gibt תְּפִלָּה allgemein wieder; „Flehen“ wahrt bei תְּחִנָּה den besonderen Akzent einer eindringlichen Bitte um Gunst oder Erbarmen.
- source_word: וְעָשִׂיתָ מִשְׁפָּטָם
  choice: und verhilf ihnen zu ihrem Recht
  rationale: Die Wendung bedeutet idiomatisch, für ihre Rechtssache einzutreten bzw. ihnen Recht zu verschaffen. Die deutsche Formulierung bewahrt den forensischen Sinn, ohne hölzern wörtlich zu klingen.
theological_decisions:
- issue: Bildhafte Rede von Gottes himmlischer Wohnstätte
  choice: Die Aussage, dass Gott „im Himmel“ an der Stätte hört, an der er wohnt, bleibt erhalten.
  alternative: „vom Himmel, deiner Wohnstätte, höre“
  rationale: Die Übersetzung wahrt die räumliche Bildsprache des Tempelgebets, ohne daraus zu folgern, Gott sei räumlich auf den Himmel begrenzt.
- issue: Forensischer Sinn von מִשְׁפָּטָם
  choice: „verhilf ihnen zu ihrem Recht“
  alternative: „führe ihr Gericht aus“ oder „tritt für ihre Sache ein“
  rationale: Der Text bittet Gott, zugunsten ihrer Rechtssache zu handeln. Die gewählte Fassung legt nicht fest, auf welche konkrete Weise dieses Recht verwirklicht wird.
translation_notes:
  register: Modernes Standarddeutsch in würdigem Gebetsregister. „Stätte“ erhält den gehobenen Ton und die Nuance eines fest bestimmten Ortes; „an der du wohnst“ vermeidet die schwerfällige Wendung „Stätte deines Wohnens“. Der Fußnotenmarker steht unmittelbar nach dem erklärungsbedürftigen letzten Satzglied.
