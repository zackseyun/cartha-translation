review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von הַשָּׁמַיִם mit „zum Himmel“ ist idiomatisch und gibt die durch den Kontext bestimmte Richtung zutreffend wieder. „Trat“ ist jedoch gegenüber וַיַּעֲמֹד („stand“) zu dynamisch; außerdem legt „vor die ganze Versammlung“ eine Bewegung auf die Versammlung zu nahe, während נֶגֶד die Gegenüberstellung bezeichnet.
  naturalness: „Da stand Salomo vor dem Altar Jahwes, der ganzen Versammlung Israels gegenüber“ ist modernes, würdevolles Standarddeutsch und bildet beide räumlichen Beziehungen ohne missverständliche Wiederholung ab.
  terminology: „Jahwe“, „Altar“, „Versammlung Israels“ und „Hände zum Himmel ausbreiten“ sind sachgerecht und registerangemessen. Die Fußnote sollte die hebräische Form als „die Himmel“ bezeichnen, nicht als die bereits interpretierte deutsche Präpositionalverbindung „zu den Himmeln“.
  issues:
  - severity: medium
    issue: „trat“ statt „stand“
    rationale: וַיַּעֲמֹד bezeichnet hier das Stehen. „Trat“ fügt eine Bewegung hinzu, die der hebräische Text nicht ausdrücklich nennt.
  - severity: medium
    issue: „vor die ganze Versammlung Israels“
    rationale: Bei „vor“ mit Akkusativ entsteht im Deutschen ein Bewegungsziel. נֶגֶד beschreibt Salomos Stellung gegenüber der Versammlung; „der ganzen Versammlung Israels gegenüber“ gibt dies genauer wieder.
  - severity: low
    issue: 'Fußnote „Wörtlich: ‚zu den Himmeln‘“'
    rationale: Das Hebräische enthält keine Präposition „zu“. Die idiomatische Richtungswiedergabe im Haupttext ist korrekt, aber die Fußnote sollte die lexikalische Form neutral als „die Himmel“ ausweisen.
  revised_text: Da stand Salomo vor dem Altar Jahwes, der ganzen Versammlung Israels gegenüber, und breitete seine Hände zum Himmel aus.[a]
  revised_footnotes:
