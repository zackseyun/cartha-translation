revisions:
- from: Dann trat Salomo vor den Altar Jahwes, vor die ganze Versammlung Israels, und breitete seine Hände zum Himmel aus.[a]
  to: Da stand Salomo vor dem Altar Jahwes, der ganzen Versammlung Israels gegenüber, und breitete seine Hände zum Himmel aus.[a]
  rationale: Die Revision stellt die einfache Erzählhandlung „stand“ wieder her, gibt die räumliche Gegenüberstellung zur Versammlung ohne zusätzliche Bewegungsnuance wieder und korrigiert die Fußnote zu einer neutralen Angabe der hebräischen Pluralform. Die idiomatische deutsche Wendung „zum Himmel“ bleibt erhalten.
