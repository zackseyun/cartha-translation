  text: וַ/יַּעֲמֹ֣ד שְׁלֹמֹ֗ה לִ/פְנֵי֙ מִזְבַּ֣ח יְהוָ֔ה נֶ֖גֶד כָּל קְהַ֣ל יִשְׂרָאֵ֑ל וַ/יִּפְרֹ֥שׂ כַּפָּ֖י/ו הַ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/022.yaml
  text: Then Solomon stood before the altar of Yahweh in front of all the assembly of Israel and spread out his hands toward heaven[a].
translation:
  language: de
  text: Da stand Salomo vor dem Altar Jahwes, der ganzen Versammlung Israels gegenüber, und breitete seine Hände zum Himmel aus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „die Himmel“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: trat
  rationale: עמד bezeichnet hier im Erzählablauf, dass Salomo seinen Platz einnahm bzw. sich hinstellte. „trat … vor“ ist im Deutschen natürlich und bewahrt den räumlichen Zusammenhang mit לִפְנֵי.
- source_word: לִפְנֵי מִזְבַּח יְהוָה
  choice: vor den Altar Jahwes
  rationale: לִפְנֵי hat hier eine klare räumliche Bedeutung; die Constructusverbindung wird knapp und natürlich wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: נֶגֶד כָּל קְהַל יִשְׂרָאֵל
  choice: vor die ganze Versammlung Israels
  rationale: נֶגֶד bezeichnet Salomos öffentliche Stellung gegenüber der versammelten Gemeinschaft. Die Wiederholung von „vor“ ist im Deutschen klar und bildet die parallelen räumlichen Angaben des Hebräischen ab.
- source_word: וַיִּפְרֹשׂ כַּפָּיו
  choice: und breitete seine Hände … aus
  rationale: פרשׂ mit כפים beschreibt das Ausbreiten bzw. Ausstrecken der Hände als Gebetsgeste. „Hände“ ist in diesem Ausdruck natürlicher als das wörtlichere „Handflächen“.
- source_word: הַשָּׁמָיִם
  choice: zum Himmel
  rationale: Der morphologische Plural שָׁמַיִם wird in diesem Richtungs- und Gebetskontext im modernen Deutschen idiomatisch mit dem singularischen Kollektivbegriff „Himmel“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. „Jahwe“ bewahrt seinen Charakter als Eigenname, ohne ihn durch den traditionellen Ersatztitel aufzulösen.
- issue: Bedeutung von הַשָּׁמָיִם im Gebetsgestus
  choice: Himmel
  alternative: die Himmel
  rationale: „Himmel“ ist in dieser Wendung natürliches Standarddeutsch; die formale Pluralgestalt des Hebräischen bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz folgt eng dem hebräischen Erzählablauf, verwendet jedoch natürliche deutsche Wortstellung und die geläufige Gebetswendung „die Hände zum Himmel ausbreiten“.
