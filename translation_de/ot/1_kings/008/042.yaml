base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/042.yaml
  text: for they will hear of your great name[a], and of your mighty hand and your outstretched arm, and he will come and pray toward this house—
translation:
  language: de
  text: Denn sie werden von deinem großen Namen hören, von deiner starken Hand und deinem ausgestreckten Arm; und er[a] wird kommen und in Richtung dieses Hauses beten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen wechselt das Subjekt vom Plural („sie werden hören“) zum Singular („er wird kommen und … beten“). Damit richtet sich der Blick wahrscheinlich von den Fremden im Allgemeinen auf den einzelnen Fremden.
    reason: Erklärung des im Ausgangstext bewahrten Numeruswechsels.
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet im Zusammenhang die Begründung dafür ein, dass der Fremde kommt und betet; die kausale beziehungsweise erläuternde Funktion bleibt erhalten.
- source_word: יִשְׁמְעוּן אֶת שִׁמְךָ הַגָּדוֹל
  choice: sie werden von deinem großen Namen hören
  rationale: שמע mit אֶת bezeichnet hier das Hören von Gottes Namen beziehungsweise Ruf. „Name“ bleibt als theologisch und literarisch bedeutendes Bild erhalten.
- source_word: יָדְךָ הַחֲזָקָה
  choice: deine starke Hand
  rationale: Gibt das konkrete anthropomorphe Bild und die Bedeutung des Adjektivs unmittelbar und in natürlichem Deutsch wieder.
- source_word: זְרֹעֲךָ הַנְּטוּיָה
  choice: dein ausgestreckter Arm
  rationale: Bewahrt die feste biblische Bildsprache für Gottes wirksame Macht, ohne sie durch eine abstrakte Deutung zu ersetzen.
- source_word: וּבָא וְהִתְפַּלֵּל
  choice: und er wird kommen und … beten
  rationale: Erhält den Wechsel vom Plural zum Singular und versteht die beiden aufeinanderfolgenden Verben als koordiniert.
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: zu diesem Haus hin
  rationale: Drückt die durch אֶל bezeichnete Gebetsrichtung aus, ohne nahezulegen, dass der Betende das Haus betreten muss.
theological_decisions:
- issue: Anthropomorphe Rede von Gottes Macht
  choice: „Hand“ und „Arm“ werden im Haupttext wörtlich beibehalten.
  alternative: Abstrakte Wiedergabe als „Macht“ oder „Stärke“.
  rationale: Die konkrete Bildsprache ist für den alttestamentlichen Text theologisch und literarisch prägend; eine Abstraktion würde sie verflachen.
- issue: Wechsel des Subjekts vom Plural zum Singular
  choice: „sie werden … hören; und er wird kommen“
  alternative: 'Durchgängiger Plural: „sie werden … hören und kommen und beten“.'
  rationale: Der hebräische Numeruswechsel wird transparent bewahrt; vermutlich geht der Blick von den Fremden als Gruppe zum einzelnen, stellvertretenden Fremden über.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle biblische Bildsprache bleibt erhalten; „zu diesem Haus hin beten“ macht die räumliche Ausrichtung des Gebets in natürlicher deutscher Form deutlich.
