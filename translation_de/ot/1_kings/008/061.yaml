base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/061.yaml
  text: Let your heart therefore be wholly with Yahweh our God[a], to walk in his statutes and to keep his commandments[b], as at this day.
translation:
  language: de
  text: Euer Herz sei Jahwe, unserem Gott, ungeteilt zugewandt, um nach seinen Satzungen zu leben und seine Gebote zu halten, wie an diesem Tag.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wie an diesem Tag“. Die Zeitformel bezieht sich auf den gegenwärtigen Tag; ihre genaue syntaktische Zuordnung bleibt im Hebräischen offen.'
    reason: hebrew_idiom
lexical_decisions:
- source_word: וְהָיָה
  choice: soll … sein
  rationale: Die Form steht im Zusammenhang als Aufforderung. Das deutsche „soll … sein“ gibt diesen exhortativen Sinn natürlich wieder, ohne daraus eine bloße Zukunftsaussage zu machen.
- source_word: לְבַבְכֶם
  choice: euer Herz
  rationale: לֵבָב bezeichnet den inneren Menschen einschließlich Willen und Hingabe. Der Singular bewahrt den kollektiven Ausdruck des Hebräischen.
- source_word: שָׁלֵם
  choice: ungeteilt
  rationale: Im Bundeskontext bezeichnet das Wort vollständige, ungeteilte Loyalität. „Ungeteilt“ vermeidet den möglichen Fehlschluss moralischer Sündlosigkeit.
- source_word: עִם יְהוָה אֱלֹהֵינוּ
  choice: bei Jahwe, unserem Gott
  rationale: „Bei“ bewahrt die relationale Bedeutung von עִם und klingt im Deutschen in Verbindung mit einem ungeteilten Herzen natürlicher als das wörtlichere „mit“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לָלֶכֶת בְּחֻקָּיו
  choice: nach seinen Satzungen lebt
  rationale: Das wörtliche „in seinen Satzungen gehen“ ist im heutigen Deutsch unnatürlich. „Nach seinen Satzungen leben“ gibt die hebräische Metapher des Lebenswandels verständlich wieder.
- source_word: וְלִשְׁמֹר מִצְוֺתָיו
  choice: und seine Gebote haltet
  rationale: שׁמר bezeichnet im rechtlich-bundestheologischen Zusammenhang das Beachten und Befolgen von Geboten; „Gebote halten“ ist dafür eine geläufige deutsche Wendung.
- source_word: כַּיּוֹם הַזֶּה
  choice: wie es heute der Fall ist
  rationale: Die hebräische Zeitformel verweist auf den gegenwärtigen Tag als Beispiel oder Zeugnis der geforderten Hingabe. Die Formulierung gibt diesen Sinn in natürlichem Deutsch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bundestreue in שָׁלֵם
  choice: ungeteilt
  alternative: vollkommen; ganz
  rationale: „Ungeteilt“ bezeichnet vollständige Hingabe und Treue, ohne die Aussage als Forderung nach sündloser Vollkommenheit festzulegen.
- issue: Verhältnis von Herzenshaltung und Gehorsam
  choice: damit ihr … lebt und … haltet
  alternative: indem ihr … lebt und … haltet
  rationale: Die Infinitivkonstruktion kann Ziel beziehungsweise Folge der ungeteilten Herzenshaltung ausdrücken. „Damit“ wahrt diese Ausrichtung, ohne Herzenshingabe und Gehorsam voneinander zu trennen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist allgemein verständlich, bewahrt den persönlichen Gottesnamen und gibt die hebräische Lebenswandel-Metapher sinngemäß wieder.
