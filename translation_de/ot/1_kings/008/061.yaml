  naturalness: Der Entwurf ist überwiegend modernes, würdiges Deutsch. „Euer Herz sei ... ungeteilt zugewandt“ ist als exhortative Form natürlicher und präziser als „soll ... sein“. „Wie an diesem Tag“ ist knapp, idiomatisch genug und bewahrt die offene syntaktische Zuordnung des Hebräischen besser.
  terminology: „Jahwe“, „Satzungen“ und „Gebote“ sind konsistent und dem Register angemessen. „Ungeteilt“ gibt die hier geforderte vollständige Loyalität wieder, ohne sündlose Vollkommenheit zu behaupten.
