revisions:
- from: Euer Herz soll ungeteilt[a] bei Jahwe, unserem Gott, sein, damit ihr nach seinen Satzungen lebt und seine Gebote haltet, wie es heute der Fall ist.[b]
  to: Euer Herz sei Jahwe, unserem Gott, ungeteilt zugewandt, um nach seinen Satzungen zu leben und seine Gebote zu halten, wie an diesem Tag.[a]
  rationale: Die Revision bewahrt die exhortative Kraft von וְהָיָה mit „sei“, gibt die vollständige Loyalität von שָׁלֵם durch „ungeteilt zugewandt“ idiomatisch wieder und vermeidet eine übermäßige Festlegung des Verhältnisses zwischen Herzenshaltung und Gehorsam. Die abschließende Zeitformel wird näher am Hebräischen wiedergegeben und ihre Auslegung in der Fußnote zurückhaltend formuliert.
