source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא קִדַּ֨שׁ הַ/מֶּ֜לֶךְ אֶת תּ֣וֹךְ הֶ/חָצֵ֗ר אֲשֶׁר֙ לִ/פְנֵ֣י בֵית יְהוָ֔ה כִּי עָ֣שָׂה שָׁ֗ם אֶת הָֽ/עֹלָה֙ וְ/אֶת הַ/מִּנְחָ֔ה וְ/אֵ֖ת חֶלְבֵ֣י הַ/שְּׁלָמִ֑ים כִּֽי מִזְבַּ֤ח הַ/נְּחֹ֨שֶׁת֙ אֲשֶׁ֣ר לִ/פְנֵ֣י יְהוָ֔ה קָטֹ֗ן מֵֽ/הָכִיל֙ אֶת הָ/עֹלָ֣ה וְ/אֶת הַ/מִּנְחָ֔ה וְ/אֵ֖ת חֶלְבֵ֥י הַ/שְּׁלָמִֽים־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/064.yaml
  text: On that day the king consecrated the middle of the court that was before the house of Yahweh[a], because there he offered the burnt offering and the grain offering and the fat portions of the peace offerings[c][b], because the bronze altar that was before Yahweh was too small to contain the burnt offering and the grain offering and the fat portions of the peace offerings.
translation:
  language: de
  text: An jenem Tag heiligte der König die Mitte des Vorhofs[a], der vor dem Haus Jahwes[b] lag; denn dort brachte er das Brandopfer, das Speiseopfer und die Fettstücke der Heilsopfer[c] dar. Denn der bronzene Altar, der vor Jahwe stand, war zu klein, um das Brandopfer, das Speiseopfer und die Fettstücke der Heilsopfer aufzunehmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: den inneren Bereich des Vorhofs.'
    reason: lexical_alternative
  - marker: b
    text: Das „Haus Jahwes“ ist der Tempel.
    reason: clarification
  - marker: c
    text: 'Wörtlicher: das Fett der Heilsopfer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קִדַּשׁ
  choice: heiligte
  rationale: Das Verb bezeichnet hier, dass ein Bereich für den heiligen, kultischen Gebrauch ausgesondert wurde. „Heiligte“ bewahrt diesen kultischen Sinn knapp und würdevoll.
- source_word: תּוֹךְ הֶחָצֵר
  choice: die Mitte des Vorhofs
  rationale: תּוֹךְ bezeichnet die Mitte bzw. den inneren Bereich. „Vorhof“ ist im Tempelkontext die geläufige deutsche Bezeichnung für חָצֵר.
- source_word: לִפְנֵי בֵית יְהוָה
  choice: vor dem Haus Jahwes
  rationale: Die Formulierung gibt sowohl die räumliche Bedeutung von לִפְנֵי als auch das hebräische Bild vom Tempel als „Haus“ wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen in seiner üblichen wissenschaftlichen Form wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עָשָׂה שָׁם
  choice: dort brachte er … dar
  rationale: עָשָׂה bedeutet allgemein „tun/machen“, bezeichnet im Opferkontext aber idiomatisch das Darbringen der Opfer.
- source_word: הָעֹלָה
  choice: das Brandopfer
  rationale: „Brandopfer“ ist die herkömmliche und sachlich passende Wiedergabe des kultischen Fachbegriffs עֹלָה.
- source_word: הַמִּנְחָה
  choice: das Speiseopfer
  rationale: Im Opferkontext bezeichnet מִנְחָה ein aus pflanzlichen Erzeugnissen bestehendes Opfer. „Speiseopfer“ ist die etablierte deutsche Bezeichnung.
- source_word: חֶלְבֵי הַשְּׁלָמִים
  choice: die Fettstücke der Heilsopfer
  rationale: חֶלְבֵי meint die zum Verbrennen bestimmten Fettpartien. „Heilsopfer“ gibt שְׁלָמִים wieder, ohne den mehrdeutigen Begriff allein auf Frieden oder Gemeinschaft einzuengen.
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: der bronzene Altar
  rationale: נְחֹשֶׁת kann Kupfer oder Bronze bezeichnen; für dieses Kultgerät ist „bronzener Altar“ die übliche und wahrscheinliche Wiedergabe.
- source_word: קָטֹן מֵהָכִיל
  choice: war … zu klein, um … aufzunehmen
  rationale: Die Konstruktion drückt unzureichende Kapazität aus. „Aufzunehmen“ passt natürlich dazu, dass die Opfergaben auf dem Altar Platz finden mussten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. „Jahwe“ bewahrt ihn als Namen, statt ihn durch den traditionellen Ersatztitel „der HERR“ wiederzugeben.
- issue: Bedeutungsumfang von שְׁלָמִים
  choice: Heilsopfer
  alternative: Friedensopfer oder Gemeinschaftsopfer
  rationale: Der hebräische Opferbegriff kann mit Heil, Wohlergehen, Frieden und Gemeinschaft verbunden sein. „Heilsopfer“ lässt diesen Bedeutungsumfang vergleichsweise offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kultischen Fachbegriffe bleiben erkennbar; der Satz wird zur besseren Verständlichkeit in zwei Sätze gegliedert. Alle Fußnotenmarker stehen unmittelbar bei der jeweils erläuterten Wendung.
