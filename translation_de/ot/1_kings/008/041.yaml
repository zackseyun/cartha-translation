  text: וְ/גַם֙ אֶל הַ/נָּכְרִ֔י אֲשֶׁ֛ר לֹא מֵ/עַמְּ/ךָ֥ יִשְׂרָאֵ֖ל ה֑וּא וּ/בָ֛א מֵ/אֶ֥רֶץ רְחוֹקָ֖ה לְמַ֥עַן שְׁמֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/041.yaml
  text: And also concerning the foreigner[a], who is not from your people Israel, but comes from a distant land for the sake of your name—
translation:
  language: de
  text: Und auch was den Fremden[a] betrifft, der nicht zu deinem Volk Israel gehört und aus einem fernen Land kommt um deines Namens willen —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Ausländer“ beziehungsweise „den Außenstehenden“. Das hebräische Wort bezeichnet hier einen Nichtisraeliten, nicht nur einen Reisenden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Und auch
  rationale: Bewahrt sowohl die Verknüpfung mit den vorausgehenden Bitten als auch den hinzufügenden Nachdruck.
- source_word: אֶל הַנָּכְרִי
  choice: was den Fremden betrifft
  rationale: אֶל führt hier im Gebetszusammenhang den nun behandelten Fall ein; die deutsche Wendung bildet diese thematische Funktion natürlich ab.
- source_word: הַנָּכְרִי
  choice: der Fremde
  rationale: Bezeichnet hier ausdrücklich einen Nichtisraeliten. „Fremder“ ist verständlich und lässt die ethnisch-bundestheologische Abgrenzung bestehen.
- source_word: אֲשֶׁר לֹא מֵעַמְּךָ יִשְׂרָאֵל הוּא
  choice: der nicht zu deinem Volk Israel gehört
  rationale: Gibt die Zugehörigkeitsaussage idiomatisch wieder und bewahrt Israel als Bezeichnung für Gottes Volk.
- source_word: וּבָא
  choice: sondern … kommt
  rationale: Das Waw führt die Beschreibung weiter; im Deutschen macht „sondern“ den leichten Gegensatz zwischen fehlender Zugehörigkeit zu Israel und seinem Kommen deutlich, ohne einen starken adversativen Sinn zu behaupten.
- source_word: מֵאֶרֶץ רְחוֹקָה
  choice: aus einem fernen Land
  rationale: Natürliche und genaue Wiedergabe der räumlichen Entfernung.
- source_word: לְמַעַן שְׁמֶךָ
  choice: um deines Namens willen
  rationale: Bewahrt das biblische Gewicht des Namens als Ausdruck von Gottes Offenbarung und Ansehen sowie die motivierende bzw. begründende Funktion der Wendung.
theological_decisions:
- issue: Bundesbezogene Unterscheidung zwischen Israel und dem nichtisraelitischen Beter
  choice: der Fremde, der nicht zu deinem Volk Israel gehört
  alternative: der Ausländer, der nicht aus deinem Volk Israel stammt
  rationale: Die Formulierung hält ausdrücklich fest, dass die betreffende Person nicht zu Israel gehört, und wahrt zugleich, dass auch sie wegen des Namens Gottes kommt.
- issue: Bedeutung von לְמַעַן שְׁמֶךָ
  choice: um deines Namens willen
  alternative: wegen deines Namens
  rationale: Die gewählte traditionelle, aber weiterhin verständliche Wendung erhält die mögliche Spannung zwischen Beweggrund und Zweck, statt sie einseitig festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt entsprechend dem hebräischen Zusammenhang und der Fortsetzung in Vers 42 syntaktisch offen; der Gedankenstrich zeigt dies an.
