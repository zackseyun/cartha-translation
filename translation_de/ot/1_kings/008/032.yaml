  text: וְ/אַתָּ֣ה תִּשְׁמַ֣ע הַ/שָּׁמַ֗יִם וְ/עָשִׂ֨יתָ֙ וְ/שָׁפַטְתָּ֣ אֶת עֲבָדֶ֔י/ךָ לְ/הַרְשִׁ֣יעַ רָשָׁ֔ע לָ/תֵ֥ת דַּרְכּ֖/וֹ בְּ/רֹאשׁ֑/וֹ וּ/לְ/הַצְדִּ֣יק צַדִּ֔יק לָ֥/תֶת ל֖/וֹ כְּ/צִדְקָתֽ/וֹ׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/032.yaml
  text: then hear in heaven and act[a], and judge your servants, condemning the wicked by bringing his way upon his own head[c][b], and justifying the righteous by giving to him according to his righteousness.
translation:
  language: de
  text: 'Dann höre vom Himmel her[a] und greife ein. Richte über deine Diener: Erkläre den Schuldigen für schuldig und lass sein Tun auf seinen eigenen Kopf zurückfallen[b]; erkläre den Gerechten für gerecht[c] und gib ihm, wie es seiner Gerechtigkeit entspricht.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »höre im Himmel«. Wörtlich steht im Hebräischen: »höre den Himmel/die Himmel«; in dieser Gebetsformel kann der Himmel als Ort oder Ausgangspunkt des Hörens verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: Dass jemandes »Weg« – sein Verhalten – auf seinen eigenen Kopf zurückfällt, ist ein hebräisches Bild dafür, dass ihn die Folgen seines eigenen Verhaltens treffen.
    reason: cultural_note
  - marker: c
    text: 'Oder: »sprich den Gerechten frei« beziehungsweise »verschaffe dem Gerechten Recht«. Das hebräische Verb ist hier ein gerichtlicher Ausdruck.'
    reason: alternative_reading
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  choice: höre im Himmel
  rationale: Die ungewöhnliche hebräische Verbindung verwendet »den Himmel/die Himmel« ohne Präposition und ist hier am ehesten lokal zu verstehen. »Im Himmel« bewahrt die Gebetsformel und ihre mögliche räumliche Nuance; »vom Himmel her« bleibt als Alternative in der Fußnote erhalten.
- source_word: וְעָשִׂיתָ
  choice: und greife ein
  rationale: Das breite Verb עשה bedeutet »tun, handeln«. Im Gebets- und Gerichtskontext bezeichnet es Gottes auf das Hören folgende wirksame Reaktion; »greife ein« ist im Deutschen natürlicher und konkreter als das isolierte »handle«.
- source_word: וְשָׁפַטְתָּ אֶת עֲבָדֶיךָ
  choice: Sprich deinen Dienern Recht
  rationale: שׁפט bezeichnet hier gerichtliches Entscheiden. Die deutsche Wendung »jemandem Recht sprechen« erhält den Rechtskontext, ohne das Urteil vorwegzunehmen; dessen zwei möglichen Ausgänge folgen unmittelbar.
- source_word: לְהַרְשִׁיעַ רָשָׁע
  choice: Erkläre den Schuldigen für schuldig
  rationale: 'Der Hifil von רשע ist forensisch: für schuldig erklären beziehungsweise verurteilen. Die Formulierung macht den deklarativen Gerichtssinn ausdrücklich und bildet eine klare Parallele zum folgenden Satzglied.'
- source_word: לָתֵת דַּרְכּוֹ בְּרֹאשׁוֹ
  choice: lass seinen Weg auf seinen eigenen Kopf zurückfallen
  rationale: Die bildhafte hebräische Vergeltungsformel wird weitgehend bewahrt. »Weg« bezeichnet zugleich Lebensführung beziehungsweise Verhalten; »zurückfallen« verdeutlicht, dass die Folgen den Täter selbst treffen, ohne das Bild durch eine bloße Erklärung zu ersetzen.
- source_word: וּלְהַצְדִּיק צַדִּיק
  choice: erkläre den Gerechten für gerecht
  rationale: Der Hifil von צדק hat im gerichtlichen Zusammenhang deklarativen Sinn. Diese Wiedergabe wahrt die forensische Parallelität mit »für schuldig erklären«; die idiomatischere Möglichkeit »sprich den Gerechten frei« wird in einer Fußnote genannt.
- source_word: לָתֶת לוֹ כְּצִדְקָתוֹ
  choice: gib ihm, wie es seiner Gerechtigkeit entspricht
  rationale: Die Wiedergabe bleibt nahe bei נתן und vermeidet das stärker deutende »belohne«. כְּצִדְקָתוֹ bezeichnet den Maßstab seiner Gerechtigkeit beziehungsweise Rechtschaffenheit.
theological_decisions:
- issue: Forensischer oder verwandelnder Sinn der Gerichtsverben
  choice: 'Die beiden Verben werden als gerichtliche Feststellungen wiedergegeben: »für schuldig erklären« und »für gerecht erklären«.'
  alternative: »den Schuldigen bestrafen« und »dem Gerechten Recht verschaffen«
  rationale: Der Zusammenhang ist eine gerichtliche Entscheidung unter Eid. Die hebräischen Hifil-Formen sind etablierte Rechtsbegriffe. Die deklarative Wiedergabe bewahrt diesen Sinn, ohne eine moralische Verwandlung oder eine bestimmte Rechtfertigungslehre in den Vers hineinzulesen.
- issue: Bedeutung von כְּצִדְקָתוֹ
  choice: »wie es seiner Gerechtigkeit entspricht«
  alternative: »entsprechend seiner Rechtschaffenheit« oder »nach seinem Recht«
  rationale: Der Ausdruck kann gerechtes Verhalten, Rechtschaffenheit oder den im Prozess festgestellten Rechtsstand bezeichnen. »Gerechtigkeit« hält diese Spannung offen, statt sie auf Verdienst oder bloße Unschuld zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klar erkennbarem Gerichtsrahmen. Der Satz wird nach »greife ein« geteilt, um die lange hebräische Reihung verständlich wiederzugeben. Die Parallelität von Schuldigen und Gerechten bleibt erhalten; das hebräische Bild vom Weg und Kopf wird nicht eingeebnet.
