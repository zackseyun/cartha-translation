base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/034.yaml
  text: then may you hear in heaven and forgive the sin of your people Israel[c][b][a], and bring them back to the land that you gave to their fathers.
translation:
  language: de
  text: Dann höre im Himmel[a] und vergib die Sünde deines Volkes Israel und bring sie zurück[b] in das Land, das du ihren Vätern[c] gegeben hast.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „höre vom Himmel her“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „führe sie zurück“.'
    reason: lexical_alternative
  - marker: c
    text: Gemeint sind die Vorväter, denen du das Land gegeben hast.
    reason: cultural_note
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  choice: höre du im Himmel
  rationale: Die präpositionslose hebräische Verbindung bezeichnet den Himmel als Gottes Wohn- und Hörort. „Im Himmel“ bewahrt diese naheliegende örtliche Auffassung; „vom Himmel her“ bleibt als mögliche idiomatische Deutung in der Fußnote erhalten.
- source_word: וְסָלַחְתָּ לְחַטַּאת
  choice: und vergib die Sünde
  rationale: סלח bezeichnet hier Gottes Vergebung, und חטאת meint die Sünde beziehungsweise Verfehlung, nicht ein Sündopfer. Der Singular kann das schuldhafte Handeln Israels zusammenfassend bezeichnen.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: deines Volkes Israel
  rationale: Die Formulierung gibt die Zugehörigkeit Israels zu Gott knapp und natürlich wieder, ohne zusätzliche Deutung.
- source_word: וַהֲשֵׁבֹתָם
  choice: Bring sie zurück
  rationale: 'Der Hifil von שוב ist kausativ: Gott soll das Volk zur Rückkehr veranlassen beziehungsweise zurückbringen. Die deutsche Wendung macht die räumliche Rückkehr in das Land deutlich.'
- source_word: אֶל הָאֲדָמָה
  choice: in das Land
  rationale: אֲדָמָה bezeichnet hier nicht bloß Erdboden, sondern das Israel gegebene Land als Ziel der Rückkehr.
- source_word: אֲשֶׁר נָתַתָּ לַאֲבוֹתָם
  choice: das du ihren Vätern gegeben hast
  rationale: Der Relativsatz erinnert an die Landgabe an die früheren Väter des Volkes. „Väter“ bewahrt die maskuline und bundestheologisch geprägte Ausdrucksweise des Hebräischen.
theological_decisions:
- issue: Bezeichnung der Empfänger der Landverheißung in לַאֲבוֹתָם
  choice: ihren Vätern
  alternative: ihren Vorfahren
  rationale: „Väter“ entspricht der grammatisch maskulinen Form und bewahrt die traditionelle Sprache der Landverheißung. Eine Fußnote verdeutlicht, dass die Vorväter gemeint sind, ohne den Haupttext zu verallgemeinern.
- issue: Art der Wiederherstellung in וַהֲשֵׁבֹתָם
  choice: Bring sie zurück in das Land
  alternative: Stelle sie in dem Land wieder her
  rationale: Der Vers spricht konkret von einer Rückkehr in das Land. Die gewählte Fassung wahrt den räumlichen Sinn, ohne eine weitergehende heilsgeschichtliche Deutung einzutragen.
- issue: Gebetsform der aufeinanderfolgenden Verben
  choice: höre du … vergib … Bring sie zurück
  alternative: mögest du hören … vergeben … zurückbringen
  rationale: Die Verbfolge bildet die erbetene göttliche Reaktion auf die vorausgesetzte Notlage. Deutsche Gebetsimperative geben die dringliche Bitte natürlich wieder, ohne sie als Befehl an Gott misszuverstehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Gebetsbitte wird mit natürlichen Imperativformen wiedergegeben. „Du“ bleibt kleingeschrieben; Satzteilung nach „Israel“ verbessert die Lesbarkeit, ohne die hebräische Koordination inhaltlich zu verändern.
