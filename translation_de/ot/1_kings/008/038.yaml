base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/038.yaml
  text: whatever prayer[a], whatever plea, may be made by any man or by all your people Israel, each knowing the affliction of his own heart and spreading out his hands toward this house[c][b],
translation:
  language: de
  text: Jedes Gebet, jedes Flehen, das von irgendeinem Menschen oder von deinem ganzen Volk Israel vorgebracht wird[a], wobei jeder die Plage seines eigenen Herzens kennt[b] und seine Hände zu diesem Haus hin ausbreitet[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für irgendeinen Menschen oder für dein ganzes Volk Israel“. Die hebräische Präposition kann hier unterschiedlich verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Plage seines Herzens“.'
    reason: lexical_alternative
  - marker: c
    text: Gemeint ist der Tempel, der hier „dieses Haus“ genannt wird.
    reason: cultural_note
lexical_decisions:
- source_word: כָּל תְּפִלָּה כָל תְּחִנָּה
  choice: welches Gebet, welches Flehen auch immer
  rationale: Die wiederholte Verbindung mit כָּל und dem folgenden Relativsatz bezeichnet umfassend jede nur mögliche Form des Gebets und Flehens. „Welches … auch immer“ gibt diese Reichweite in natürlichem Deutsch wieder; „Flehen“ bewahrt gegenüber „Gebet“ die gesteigerte Dringlichkeit von תְּחִנָּה.
- source_word: אֲשֶׁר תִהְיֶה
  choice: vorgebracht wird
  rationale: Wörtlich steht „das sein wird“. Im Zusammenhang mit Gebet ergänzt „vorgebracht wird“ die im Deutschen erforderliche idiomatische Aussage, ohne den Inhalt zu erweitern.
- source_word: לְכָל הָאָדָם לְכֹל עַמְּךָ יִשְׂרָאֵל
  choice: von irgendeinem Menschen oder von deinem ganzen Volk Israel
  rationale: Die Präposition לְ kann hier die Zuordnung oder den Urheber des Gebets bezeichnen. Der folgende distributive Singular („jeder“) spricht im Deutschen für die Wiedergabe mit „von“. Die mögliche alternative Deutung „für“ wird in der Fußnote bewahrt.
- source_word: אֲשֶׁר יֵדְעוּן אִישׁ
  choice: wobei jeder … kennt
  rationale: אִישׁ wirkt distributiv innerhalb der zuvor genannten Einzelperson beziehungsweise des ganzen Volkes. „Wobei jeder“ erhält diesen Bezug, ohne aus dem Relativsatz ausdrücklich einen Kausal- oder Bedingungssatz zu machen.
- source_word: נֶגַע לְבָבוֹ
  choice: die Plage seines eigenen Herzens
  rationale: נֶגַע bezeichnet eine Plage, einen Schlag oder ein Leiden. Die bewusst bildhafte Formulierung „Plage seines … Herzens“ bleibt nahe am Hebräischen und bewahrt die Spannung zwischen äußerer Not und innerer Betroffenheit.
- source_word: וּפָרַשׂ כַּפָּיו
  choice: und seine Hände … ausbreitet
  rationale: Die Wendung bezeichnet das Ausstrecken beziehungsweise Ausbreiten der Handflächen als Gebetsgeste. „Die Hände ausbreiten“ ist im Deutschen verständlich und quellennah.
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: zu diesem Haus hin
  rationale: אֶל bezeichnet hier die Gebetsrichtung. „Haus“ bewahrt die ausdrückliche Wortwahl בַּיִת und ihre theologische Resonanz; der Bezug auf den Tempel wird erläutert.
theological_decisions:
- issue: Wiedergabe von הָאָדָם im repräsentativen Singular
  choice: Mensch
  alternative: Mann
  rationale: אָדָם bezeichnet hier eine einzelne Person im Gegensatz zum gesamten Volk. Das deutsche „Mensch“ entspricht dem Lexem und behält den repräsentativen Singular bei, ohne das Geschlecht enger festzulegen, als es der Kontext verlangt.
- issue: Deutung der „Plage des Herzens“
  choice: Bildhafte Formulierung beibehalten
  alternative: Leiden des eigenen Herzens
  rationale: Die Formulierung kann persönliche Not, innere Betroffenheit oder das eigene Schuldbewusstsein umfassen. „Plage“ lässt diese theologische und anthropologische Spannung offen, statt sie auf eine einzige Deutung festzulegen.
- issue: Wiedergabe von הַבַּיִת
  choice: Haus
  alternative: Tempel
  rationale: Obwohl der Tempel gemeint ist, nennt der hebräische Text ihn ausdrücklich „dieses Haus“. Die quellennähere Wiedergabe erhält die Vorstellung vom Tempel als Haus des HERRN; eine Fußnote klärt den Bezug.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzform bleibt als abhängiger Teil des über die Versgrenze hinausgehenden Gebets erhalten. Bildhafte und kultisch geprägte Ausdrücke wie „Plage seines Herzens“, „Hände ausbreiten“ und „dieses Haus“ werden nicht unnötig geglättet.
