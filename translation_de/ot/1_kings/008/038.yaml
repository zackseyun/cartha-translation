  terminology: „Flehen“, „Plage seines eigenen Herzens“, „seine Hände ... ausbreitet“ und „dieses Haus“ sind quellentreu und im würdigen Register verständlich. „Haus“ sollte gegenüber dem interpretierenden „Tempel“ im Haupttext beibehalten werden; die Erläuterung in der Fußnote ist angemessen.
