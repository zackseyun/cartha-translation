source:
  edition: WLC
  text: וְ/הָיָ֗ה הַ/נִּמְלָ֛ט מֵ/חֶ֥רֶב חֲזָאֵ֖ל יָמִ֣ית יֵה֑וּא וְ/הַ/נִּמְלָ֛ט מֵ/חֶ֥רֶב יֵה֖וּא יָמִ֥ית אֱלִישָֽׁע׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/017.yaml
  text: And it shall be that whoever escapes from the sword of Hazael[a], Jehu shall put to death; and whoever escapes from the sword of Jehu, Elisha shall put to death.
translation:
  language: de
  text: 'Und es wird geschehen: Wer dem Schwert Hasaëls entkommt, den wird Jehu töten; und wer dem Schwert Jehus entkommt, den wird Elisa töten.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb ist kausativ und kann wörtlich mit „sterben lassen“ wiedergegeben werden. Der Wortlaut nennt Elisa unmittelbar als Handelnden; im Zusammenhang kann das Töten auch als Gericht verstanden werden, das durch seinen prophetischen Dienst bewirkt wird.
    reason: Bewahrt die direkte Aussage des hebräischen Textes und weist zugleich auf die mögliche mittelbare Art von Elisas Wirken hin.
lexical_decisions:
- source_word: וְהָיָה
  choice: Und es wird geschehen
  rationale: Die formelhafte Wendung kündigt ein zukünftiges Geschehen an. Die gewählte Form bewahrt den hebräischen Ton und ist zugleich in gehobenem modernem Deutsch verständlich.
- source_word: הַנִּמְלָט / וְהַנִּמְלָט
  choice: Wer … entkommt / und wer … entkommt
  rationale: Das substantivierte Partizip mit Artikel hat hier allgemeinen Bezug. Die deutsche Wer-Konstruktion gibt diesen Sinn natürlich und präzise wieder.
- source_word: מֵחֶרֶב
  choice: dem Schwert … entkommt
  rationale: חֶרֶב wird wörtlich als „Schwert“ wiedergegeben; zugleich kann das Wort tödliche bewaffnete Gewalt beziehungsweise Gericht bezeichnen. Das hebräische מִן nach מלט wird im Deutschen idiomatisch durch den Dativ bei „entkommen“ ausgedrückt.
- source_word: חֲזָאֵל
  choice: Hasaël
  rationale: Der Personenname wird in der etablierten deutschen Bibelschreibweise wiedergegeben.
- source_word: יָמִית
  choice: wird … töten
  rationale: Der Hifil von מות ist kausativ („sterben lassen“, „töten“). „Töten“ ist im Deutschen die natürliche aktive Wiedergabe und lässt die im Satz ausdrücklich genannte Urheberschaft bestehen.
- source_word: יֵהוּא
  choice: Jehu
  rationale: Der Personenname wird nach etablierter deutscher Bibelkonvention geschrieben.
- source_word: אֱלִישָׁע
  choice: Elisa
  rationale: Der Personenname wird nach etablierter deutscher Bibelkonvention geschrieben.
theological_decisions:
- issue: Elisas Rolle beim Töten
  choice: Die direkte Aussage, dass Elisa die Jehu Entkommenen töten wird, bleibt im Haupttext erhalten.
  alternative: Elisas prophetischer Dienst oder sein Gerichtswort bewirkt mittelbar ihren Tod.
  rationale: Die hebräische Syntax stellt Hasaël, Jehu und Elisa parallel als Vollstrecker tödlichen Gerichts dar. Eine ausschließlich mittelbare Deutung würde die Spannung des Wortlauts im Haupttext auflösen; sie wird daher nur als mögliche kontextuelle Erklärung in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzparallelität des Hebräischen bleibt erhalten; die Wer-den-Konstruktion sorgt für natürliche Lesbarkeit. Die Namen folgen gebräuchlichen deutschen Bibelformen.
