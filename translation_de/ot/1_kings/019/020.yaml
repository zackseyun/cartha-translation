base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/020.yaml
  text: So he left the oxen and ran after Elijah and said[a], “Please let me kiss my father and my mother, and then I will go after you.” And he said to him, “Go back[b], for what have I done to you?”
translation:
  language: de
  text: 'Da ließ er die Rinder stehen, lief Elia nach und sagte[a]: »Lass mich bitte meinen Vater und meine Mutter küssen; dann will ich dir nachfolgen.« Elia antwortete ihm: »Geh zurück[b]; denn was habe ich dir getan?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder allgemeiner: »Lass mich bitte von meinem Vater und meiner Mutter Abschied nehmen.« Das hebräische Verb bedeutet wörtlich »küssen«.'
    reason: lexical_alternative
  - marker: b
    text: 'Elias knappe Antwort ist schwer zu deuten. Möglich ist auch: »Geh zurück; denn was habe ich für dich getan?« Die Formulierung kann zudem elliptisch sein und die Entscheidung Elisas offenlassen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: ließ ... stehen
  rationale: עזב bedeutet hier, die Tiere zurückzulassen. „ließ ... stehen“ ist im Deutschen natürlich und deutet noch keine endgültige Aufgabe an.
- source_word: הַבָּקָר
  choice: die Rinder
  rationale: בקר bezeichnet Rindvieh. Der Kontext nennt Zugtiere beim Pflügen; „Rinder“ ist sachlich und im modernen Deutsch natürlicher als das engere „Ochsen“.
- source_word: וַיָּרָץ אַחֲרֵי
  choice: lief ... nach
  rationale: Die Wendung bezeichnet hier die konkrete Bewegung hinter Elia her und wird im Deutschen idiomatisch mit „jemandem nachlaufen“ wiedergegeben.
- source_word: אֶשְּׁקָה נָּא
  choice: Lass mich bitte ... küssen
  rationale: נשק bedeutet wörtlich „küssen“; נָא wird durch „bitte“ wiedergegeben. Der Abschiedscharakter wird nicht an die Stelle der konkreten Handlung gesetzt, sondern in einer Fußnote erläutert.
- source_word: לְאָבִי וּלְאִמִּי
  choice: meinen Vater und meine Mutter
  rationale: Die ausdrückliche Nennung beider Elternteile wird bewahrt und nicht zu „meine Eltern“ zusammengezogen.
- source_word: וְאֵלְכָה אַחֲרֶיךָ
  choice: dann will ich dir nachfolgen
  rationale: הלך אחרי kann sowohl das Hinterhergehen als auch die Aufnahme eines Gefolgschafts- oder Dienstverhältnisses ausdrücken. „nachfolgen“ ist im Deutschen natürlich und bewahrt beide Aspekte; „dann“ verdeutlicht die im Kontext erkennbare Abfolge.
- source_word: לֵךְ שׁוּב
  choice: Geh, kehr zurück
  rationale: Beide hebräischen Imperative werden erhalten. Die knappe, auffällige Formulierung spiegelt die Ellipse und vermeidet eine vorschnelle Festlegung auf das glattere „Geh zurück“.
- source_word: כִּי מֶה עָשִׂיתִי לָךְ
  choice: Denn was habe ich dir getan?
  rationale: Die direkte Wiedergabe erhält die schwer bestimmbare Nuance der Frage, statt sie als Erlaubnis, Tadel oder Mahnung auszulegen.
theological_decisions:
- issue: Deutung von Elias Antwort כִּי מֶה עָשִׂיתִי לָךְ
  choice: Die wörtliche Frage „Denn was habe ich dir getan?“ bleibt im Haupttext unaufgelöst.
  alternative: Möglich sind unter anderem „Was habe ich denn für dich getan?“, „Was habe ich dir getan, das dich hindern sollte?“ oder eine Aufforderung, die Bedeutung der Berufung zu bedenken.
  rationale: Der hebräische Satz ist wirklich mehrdeutig und kann als Erlaubnis, Distanzierung, Tadel oder Hinweis auf Elias symbolische Handlung verstanden werden. Keine dieser Deutungen soll im Haupttext exklusiv festgelegt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Erzählung bleibt knapp; die direkte Rede bewahrt die konkrete Abschiedsgeste und die Mehrdeutigkeit von Elias Erwiderung.
