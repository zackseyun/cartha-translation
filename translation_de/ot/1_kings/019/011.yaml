revisions:
- from: 'Und er sagte: »Geh hinaus und stell dich auf den Berg vor Yahweh.« Und siehe, Yahweh zog vorüber. Vor Yahweh kam ein großer, starker Wind auf, der Berge auseinanderriss und Felsen zerschmetterte; doch Yahweh war nicht im Wind[a]. Nach dem Wind kam ein Erdbeben; doch Yahweh war nicht im Erdbeben[b].'
  to: 'Und er sagte: »Geh hinaus und stell dich auf den Berg vor Yahweh.« Und siehe, Yahweh zog vorüber, und ein großer, starker Wind zerriss vor Yahweh die Berge und zerschmetterte die Felsen; doch Yahweh war nicht im Wind[a]. Nach dem Wind kam ein Erdbeben; doch Yahweh war nicht im Erdbeben[b].'
  rationale: Die Revision stellt den syntaktischen Bezug von »vor Yahweh« zu den zerstörerischen Wirkungen des Windes wieder her. Die Fußnoten werden neutralisiert, damit sie die im Hebräischen bestehende Mehrdeutigkeit erläutern, aber keine weitergehende Lehraussage formulieren.
