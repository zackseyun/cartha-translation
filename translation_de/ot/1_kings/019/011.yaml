  text: וַ/יֹּ֗אמֶר צֵ֣א וְ/עָמַדְתָּ֣ בָ/הָר֮ לִ/פְנֵ֣י יְהוָה֒ וְ/הִנֵּ֧ה יְהוָ֣ה עֹבֵ֗ר וְ/ר֣וּחַ גְּדוֹלָ֡ה וְ/חָזָ֞ק מְפָרֵק֩ הָרִ֨ים וּ/מְשַׁבֵּ֤ר סְלָעִים֙ לִ/פְנֵ֣י יְהוָ֔ה לֹ֥א בָ/ר֖וּחַ יְהוָ֑ה וְ/אַחַ֤ר הָ/ר֨וּחַ רַ֔עַשׁ לֹ֥א בָ/רַ֖עַשׁ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/011.yaml
  text: And he said[a], “Go out and stand on the mountain before Yahweh.” And behold, Yahweh was passing by, and a great and strong wind was tearing apart the mountains and shattering rocks before Yahweh, but Yahweh was not in the wind. And after the wind, an earthquake[b], but Yahweh was not in the earthquake.
translation:
  language: de
  text: 'Und er sagte: »Geh hinaus und stell dich auf den Berg vor Yahweh.« Und siehe, Yahweh zog vorüber, und ein großer, starker Wind zerriss vor Yahweh die Berge und zerschmetterte die Felsen; doch Yahweh war nicht im Wind[a]. Nach dem Wind kam ein Erdbeben; doch Yahweh war nicht im Erdbeben[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Yahweh war nicht im Wind.« Der hebräische Text erläutert nicht, in welchem Sinn Yahweh nicht »im Wind« war.'
    reason: Bewahrt die offene Formulierung des hebräischen Textes ohne sie auf Offenbarung, Gegenwart oder Wirksamkeit festzulegen.
  - marker: b
    text: 'Wörtlich: »Yahweh war nicht im Erdbeben.« Der hebräische Text erläutert nicht, in welchem Sinn Yahweh nicht »im Erdbeben« war.'
    reason: Bewahrt die offene Formulierung des hebräischen Textes ohne zusätzliche theologische Folgerung.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: צֵא וְעָמַדְתָּ
  choice: Geh hinaus und stell dich
  rationale: Die Verbindung aus Imperativ und anschließendem Verb bezeichnet die Aufforderung, den bisherigen Aufenthaltsort zu verlassen und auf dem Berg Stellung zu nehmen.
- source_word: לִפְנֵי יְהוָה
  choice: vor Yahweh
  rationale: Die knappe räumliche Formulierung bewahrt den Wortlaut und kann zugleich die Gegenwart Yahwehs anklingen lassen.
- source_word: וְהִנֵּה
  choice: Und siehe
  rationale: Die traditionelle, noch verständliche Wendung erhält das dramatische Aufmerksamkeitssignal des hebräischen Erzähltextes.
- source_word: עֹבֵר
  choice: zog vorüber
  rationale: Das Partizip schildert das Vorüberziehen anschaulich; die deutsche Vergangenheitsform fügt sich natürlich in die Erzählung ein.
- source_word: רוּחַ גְּדוֹלָה וְחָזָק
  choice: ein großer, starker Wind
  rationale: Im Zusammenhang bezeichnet רוּחַ einen Wind; beide hebräischen Adjektive bleiben ausdrücklich erhalten.
- source_word: מְפָרֵק הָרִים וּמְשַׁבֵּר סְלָעִים
  choice: der Berge auseinanderriss und Felsen zerschmetterte
  rationale: Die Wiedergabe erhält die parallelen, gewaltsamen Handlungen in lebendigem, natürlichem Deutsch.
- source_word: רַעַשׁ
  choice: Erdbeben
  rationale: Das Wort kann Erschütterung oder Beben bezeichnen; in der Abfolge gewaltiger Naturereignisse ist »Erdbeben« die naheliegende deutsche Wiedergabe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen; seine Wiedergabe als »Yahweh« bewahrt diese Unterscheidung von einem bloßen Titel.
- issue: Aussage, Yahweh sei nicht im Wind beziehungsweise im Erdbeben
  choice: die örtlich formulierte Aussage »Yahweh war nicht im …« beibehalten
  alternative: Yahweh offenbarte sich nicht im …
  rationale: Der Text erklärt nicht näher, in welchem Sinn Yahweh nicht »in« diesen Ereignissen war. Die Übersetzung bewahrt diese theologische Spannung, statt sie als Aussage nur über Offenbarung, Gegenwart oder Wirksamkeit auszulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erzählerischer Anschaulichkeit. »Und siehe« erhält bewusst den erhöhten biblischen Ton, während Satzbau und Verben für heutige Leser klar und natürlich bleiben.
