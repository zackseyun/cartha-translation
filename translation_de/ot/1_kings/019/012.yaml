  text: וְ/אַחַ֤ר הָ/רַ֨עַשׁ֙ אֵ֔שׁ לֹ֥א בָ/אֵ֖שׁ יְהוָ֑ה וְ/אַחַ֣ר הָ/אֵ֔שׁ ק֖וֹל דְּמָמָ֥ה דַקָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/012.yaml
  text: And after the earthquake[a], a fire; Yahweh was not in the fire. And after the fire, a sound of a gentle whisper.
translation:
  language: de
  text: Und nach dem Erdbeben kam ein Feuer; doch Yahweh war nicht im Feuer. Und nach dem Feuer kam der Klang einer feinen Stille.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „der Klang einer dünnen/feinen Stille“. Möglich sind auch: „eine sanft flüsternde Stimme“, „ein leises Flüstern“ oder traditionell „ein stilles, sanftes Säuseln“. Der hebräische Ausdruck ist zart und schwer eindeutig wiederzugeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַחַר
  choice: Und nach
  rationale: Bewahrt die fortlaufende Reihung der Erscheinungen und den koordinierenden Erzählfluss des Hebräischen.
- source_word: הָרַעַשׁ
  choice: dem Erdbeben
  rationale: רַעַשׁ bezeichnet ein heftiges Beben und in diesem Zusammenhang am natürlichsten ein Erdbeben.
- source_word: אֵשׁ
  choice: kam ein Feuer
  rationale: Der hebräische Nominalsatz nennt als nächste Erscheinung Feuer. Das ergänzte „kam“ ergibt einen natürlichen deutschen Satz, ohne eine zusätzliche Deutung einzuführen.
- source_word: לֹא בָאֵשׁ יְהוָה
  choice: doch Jahwe war nicht im Feuer
  rationale: Die Präposition ב wird lokal mit „im“ wiedergegeben. „Doch“ macht den im Hebräischen durch die Negation entstehenden Gegensatz im Deutschen klar.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt das Tetragramm als den persönlichen Gottesnamen wieder, statt es durch einen Titel zu ersetzen.
- source_word: קוֹל
  choice: Klang
  rationale: קוֹל kann sowohl „Stimme“ als auch „Klang“ bedeuten. „Klang“ bewahrt hier die Offenheit und setzt nicht ausdrücklich gesprochene Worte voraus.
- source_word: דְּמָמָה
  choice: Stille
  rationale: Das Wort bezeichnet Stille, Schweigen oder Ruhe. „Stille“ erhält die auffällige Spannung mit „Klang“.
- source_word: דַקָּה
  choice: feinen
  rationale: Die feminine Form bedeutet „dünn“, „fein“ oder „zart“. „Fein“ ist im Deutschen verständlich, bewahrt aber etwas von der ungewöhnlichen Bildlichkeit des Hebräischen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. „Jahwe“ bewahrt den Eigennamen, ohne ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Deutung von קוֹל דְּמָמָה דַקָּה
  choice: der Klang einer feinen Stille
  alternative: eine sanft flüsternde Stimme / ein leises Säuseln
  rationale: Die gewählte Fassung erhält das paradoxe und schwer deutbare Verhältnis von „Klang“ und „Stille“. Sie entscheidet weder vorschnell für eine sprechende Stimme noch für ein bestimmtes Naturgeräusch.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzergänzung „kam“ dient der natürlichen Lesbarkeit der hebräischen Nominalsätze; die ungewöhnliche Schlusswendung bleibt bewusst erhalten, um die Mehrdeutigkeit und Spannung des Originals nicht einzuebnen.
