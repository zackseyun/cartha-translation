base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/001.yaml
  text: Ahab told Jezebel all that Elijah had done, and how he had killed all the prophets with the sword.
translation:
  language: de
  text: Ahab erzählte Isebel alles, was Elia getan hatte, und wie er alle Propheten mit dem Schwert getötet hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: erzählte
  rationale: Gibt das hebräische Verb für das Berichten oder Mitteilen in diesem erzählerischen Zusammenhang natürlich wieder.
- source_word: וְאֵת כָּל אֲשֶׁר הָרַג
  choice: und wie er … getötet hatte
  rationale: Das zweite אֵת leitet in der vorliegenden Satzgestalt den weiteren Inhalt von Ahabs Bericht ein; „wie“ ergibt idiomatisches Deutsch, ohne den Inhalt zu erweitern.
- source_word: בֶּחָרֶב
  choice: mit dem Schwert
  rationale: Entspricht der instrumentalen Bedeutung der Präposition בְּ und bewahrt das konkrete Bild des hebräischen Textes.
theological_decisions:
- issue: Bezug des Subjekts bei „getötet hatte“
  choice: Das Pronomen „er“ bleibt stehen und bezieht sich grammatisch am naheliegendsten auf Elia.
  alternative: Eine ausdrückliche Wiederholung des Namens „Elia“ oder eine unpersönliche Formulierung.
  rationale: Der hebräische Text nennt im zweiten Teilsatz kein neues Subjekt. Die Übersetzung bewahrt diese syntaktische Kontinuität, ohne eine zusätzliche theologische Erklärung einzufügen.
- issue: Bezeichnung „alle Propheten“
  choice: „alle Propheten“ ohne erläuternden Zusatz
  alternative: „alle Baalspropheten“
  rationale: Der Vers selbst sagt lediglich „alle Propheten“. Die nähere Bestimmung aus dem Kontext wird nicht in diesen Vers hineingetragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Das Plusquamperfekt kennzeichnet die vor Ahabs Bericht abgeschlossenen Handlungen.
