base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/019.yaml
  text: So he went from there and found Elisha son of Shaphat[a], and he was plowing with twelve yoke-pairs before him, and he was with the twelfth[b]. Elijah passed by him and threw his cloak over him.
translation:
  language: de
  text: Da ging er von dort weg und fand Elisa, den Sohn Schafats. Er pflügte mit zwölf Ochsengespannen vor sich her und war selbst beim zwölften[a]. Elia ging zu ihm hinüber und warf seinen Mantel über ihn.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und er war beim zwölften“; gemeint ist das zwölfte Gespann.'
    reason: Die hebräische Formulierung ist elliptisch und nennt das Gespann beim zweiten Vorkommen nicht erneut.
  - marker: b
    text: Der Mantel ist Elias charakteristisches Obergewand; seine symbolische Bedeutung entfaltet sich aus dem Zusammenhang.
    reason: Die Fußnote weist auf den erzählerischen Symbolgehalt hin, ohne ihn als ausdrückliche Aussage dieses Verses in den Haupttext einzutragen.
lexical_decisions:
- source_word: וַיֵּלֶךְ מִשָּׁם
  choice: Da ging er von dort weg
  rationale: Das narrative וַ führt die Handlung fort; „Da“ stellt den natürlichen Anschluss her, während „von dort weg“ מִשָּׁם vollständig wiedergibt.
- source_word: וַיִּמְצָא אֶת אֱלִישָׁע בֶּן שָׁפָט
  choice: und fand Elisa, den Sohn Schafats
  rationale: מָצָא bedeutet hier schlicht „finden“; die Namen folgen der geläufigen deutschen Bibelform.
- source_word: וְהוּא חֹרֵשׁ
  choice: Er pflügte
  rationale: Das Partizip beschreibt die andauernde Tätigkeit beim Auffinden; im Deutschen gibt das Präteritum die Hintergrundhandlung natürlich wieder.
- source_word: שְׁנֵים עָשָׂר צְמָדִים
  choice: zwölf Ochsengespanne
  rationale: צֶמֶד bezeichnet hier ein zum Pflügen eingespanntes Tierpaar. „Ochsengespanne“ macht den agrarischen Sinn verständlich, ohne eine unnatürliche Lehnprägung wie „Jochpaare“ zu verwenden.
- source_word: לְפָנָיו
  choice: vor sich her
  rationale: Die Wendung bewahrt die räumliche Angabe, dass die übrigen Gespanne vor Elisa arbeiteten.
- source_word: וְהוּא בִּשְׁנֵים הֶעָשָׂר
  choice: und war selbst beim zwölften
  rationale: Die Ellipse des Hebräischen bleibt erhalten; aus dem Kontext ist „Gespann“ zu ergänzen. „selbst“ verdeutlicht den Wechsel vom vorausgehenden Plural zu Elisa.
- source_word: וַיַּעֲבֹר אֵלִיָּהוּ אֵלָיו
  choice: Elia ging zu ihm hinüber
  rationale: עָבַר mit אֶל bezeichnet hier eine Bewegung zu Elisa hin; diese Wiedergabe ist im Deutschen natürlicher und wahrt die mögliche Nuance des Hinübergehens.
- source_word: וַיַּשְׁלֵךְ אַדַּרְתּוֹ אֵלָיו
  choice: und warf seinen Mantel über ihn
  rationale: אַדֶּרֶת bezeichnet Elias markantes Obergewand. „Mantel“ ist gegenwärtig, würdig und lässt die symbolische Bedeutung unausgelegt.
theological_decisions:
- issue: Symbolische Bedeutung von Elias Mantel
  choice: Die Handlung wird wörtlich als „warf seinen Mantel über ihn“ wiedergegeben.
  alternative: Die Handlung als Berufung oder Einsetzung zum Nachfolger ausdeuten.
  rationale: Der Vers erzählt die symbolische Handlung, erklärt sie aber nicht ausdrücklich. Die Übersetzung soll die Bedeutung nicht durch eine theologische Paraphrase vorwegnehmen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Kurze Hauptsätze bilden den hebräischen Handlungsfortgang ab; unnötig altertümliche Ausdrücke werden vermieden.
