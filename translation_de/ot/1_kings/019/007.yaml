  text: וַ/יָּשָׁב֩ מַלְאַ֨ךְ יְהוָ֤ה שֵׁנִית֙ וַ/יִּגַּע בּ֔/וֹ וַ/יֹּ֖אמֶר ק֣וּם אֱכֹ֑ל כִּ֛י רַ֥ב מִמְּ/ךָ֖ הַ/דָּֽרֶךְ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/007.yaml
  text: Then the angel of Yahweh returned a second time and touched him and said[a], “Get up and eat, because the journey is too much for you.”
translation:
  language: de
  text: 'Da kehrte der Engel Jahwes[a] ein zweites Mal zurück, berührte ihn und sagte: »Steh auf und iss, denn der Weg ist zu weit für dich.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Bote Jahwes«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: kam … zurück
  rationale: שׁוב bezeichnet hier die Rückkehr des zuvor erschienenen Boten; die deutsche Verbklammer »kam … zurück« klingt im Erzählzusammenhang natürlich.
- source_word: מַלְאַךְ יְהוָה
  choice: der Engel Jahwes
  rationale: מַלְאָךְ kann »Bote« oder »Engel« bedeuten. In diesem Zusammenhang ist »Engel« die geläufige Bezeichnung für den himmlischen Gesandten; die Alternative wird in der Fußnote bewahrt.
- source_word: שֵׁנִית
  choice: ein zweites Mal
  rationale: Die Form bezeichnet ausdrücklich das zweite Auftreten und wird daher genauer als mit bloßem »wieder« wiedergegeben.
- source_word: וַיִּגַּע בּוֹ
  choice: berührte ihn
  rationale: נגע mit ב und Suffix bedeutet hier schlicht, dass der Engel ihn berührte; eine zusätzliche Wiederholungsangabe wäre unnötig.
- source_word: קוּם אֱכֹל
  choice: Steh auf und iss
  rationale: Die beiden direkten Imperative werden knapp, kraftvoll und in modernem Standarddeutsch wiedergegeben.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet die Begründung für die Aufforderung ein; »denn« ist in direkter Rede natürlich und würdevoll.
- source_word: רַב מִמְּךָ הַדָּרֶךְ
  choice: der Weg ist zu weit für dich
  rationale: Die hebräische Wendung besagt, dass der Weg Elias Kräfte übersteigt. »Zu weit für dich« bewahrt sowohl die räumliche Vorstellung von דֶּרֶךְ als auch den Gedanken der Überforderung, ohne ihn ausdrücklich auf die Weglänge zu verengen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der im hebräischen Text stehende Eigenname wird als »Jahwe« wiedergegeben, sodass sein Charakter als Gottesname sichtbar bleibt.
- issue: Identität und Bezeichnung von מַלְאַךְ יְהוָה
  choice: Engel Jahwes
  alternative: Bote Jahwes
  rationale: Der Text bezeichnet die Gestalt als מַלְאָךְ, ohne ihre ontologische Identität näher zu erklären. »Engel« ist die traditionelle und kontextuell natürliche Wiedergabe; »Bote« bleibt als echte lexikalische Alternative in der Fußnote erhalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp. »Der Weg ist zu weit für dich« ist idiomatisch, lässt aber den kontextuellen Sinn erkennen, dass die bevorstehende Reise Elias Kräfte übersteigen würde.
