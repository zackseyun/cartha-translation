    rationale: Die hebräische Wendung kann neben Nachfolge auch Ersetzung/Stellvertretung ausdrücken. Da die Hauptfassung dies bereits wiedergibt, sollte die Anmerkung beide Nuancen ausdrücklich dokumentieren.
  revised_text: Jehu, den Sohn Nimschis, sollst du zum König über Israel salben, und Elisa, den Sohn Schafats, aus Abel-Mehola, sollst du zum Propheten an deiner Stelle[a] salben.
