source:
  edition: WLC
  text: וְ/אֵת֙ יֵה֣וּא בֶן נִמְשִׁ֔י תִּמְשַׁ֥ח לְ/מֶ֖לֶךְ עַל יִשְׂרָאֵ֑ל וְ/אֶת אֱלִישָׁ֤ע בֶּן שָׁפָט֙ מֵ/אָבֵ֣ל מְחוֹלָ֔ה תִּמְשַׁ֥ח לְ/נָבִ֖יא תַּחְתֶּֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/016.yaml
  text: And you shall anoint Jehu son of Nimshi as king over Israel[a], and Elisha son of Shaphat from Abel-meholah you shall anoint as prophet in your place.
translation:
  language: de
  text: Jehu, den Sohn Nimschis, sollst du zum König über Israel salben, und Elisa, den Sohn Schafats, aus Abel-Mehola, sollst du zum Propheten an deiner Stelle[a] salben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: nach dir oder anstelle von dir. Das Hebräische kann sowohl Nachfolge als auch Ersetzung ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְשַׁח
  choice: sollst du … salben
  rationale: Das Qal-Imperfekt 2. Person maskulin Singular dient hier als göttliche Anweisung. „Sollst du salben“ bewahrt den verpflichtenden Charakter und klingt zugleich natürlich und würdig.
- source_word: לְמֶלֶךְ
  choice: zum König
  rationale: Die Präposition לְ kennzeichnet die Einsetzung in ein Amt; „zum König salben“ ist die idiomatische deutsche Wendung.
- source_word: עַל יִשְׂרָאֵל
  choice: über Israel
  rationale: עַל bezeichnet hier die Herrschaft über ein Volk; „König über Israel“ gibt dies präzise und natürlich wieder.
- source_word: אֱלִישָׁע
  choice: Elisa
  rationale: Der Personenname wird nach der etablierten deutschen Bibeltradition wiedergegeben.
- source_word: מֵאָבֵל מְחוֹלָה
  choice: aus Abel-Mehola
  rationale: Das Präfix מִן bezeichnet Herkunft. „Aus Abel-Mehola“ identifiziert Elisa natürlich nach seinem Herkunftsort.
- source_word: לְנָבִיא
  choice: zum Propheten
  rationale: Wie bei לְמֶלֶךְ bezeichnet לְ die Einsetzung in ein Amt; „zum Propheten salben“ ist im Deutschen klar und idiomatisch.
- source_word: תַּחְתֶּיךָ
  choice: an deiner Stelle
  rationale: תַּחַת kann Stellvertretung, Ersetzung oder Nachfolge ausdrücken. „An deiner Stelle“ bewahrt den Gedanken der Amtsnachfolge, ohne den zeitlichen Ablauf stärker festzulegen als der hebräische Text.
- source_word: וְאֵת … וְאֶת
  choice: Jehu … und Elisa
  rationale: Die Akkusativpartikel אֵת wird im Deutschen nicht eigens wiedergegeben; die Konjunktionen verbinden die beiden parallelen Aufträge.
- source_word: בֶן
  choice: den Sohn …
  rationale: Die patronymische Bestimmung wird ausdrücklich als „Sohn“ wiedergegeben und nicht wie ein Familienname behandelt.
theological_decisions:
- issue: Verhältnis Elias zu Elisa in תַּחְתֶּיךָ
  choice: Elisa wird als Prophet „an deiner Stelle“ eingesetzt.
  alternative: „nach dir“ mit stärker zeitlichem Akzent oder „anstelle von dir“ mit stärkerem Ersetzungsakzent
  rationale: Der Zusammenhang betrifft die von Gott bestimmte Nachfolge im Prophetenamt. Die gewählte Formulierung wahrt sowohl den Gedanken des Amtsübergangs als auch die im Hebräischen verbleibende Spannung zwischen Nachfolge und Ersetzung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die vorangestellten Objekte („Jehu …“, „Elisa …“) spiegeln die hebräische Hervorhebung, während „sollst du … salben“ den deutschen Satzbau natürlich hält. Die traditionellen deutschen Namensformen werden verwendet.
