base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/002.yaml
  text: Then Jezebel sent a messenger to Elijah[a], saying, “So may the gods do, and more also, if by this time tomorrow I do not make your life like the life of one of them.”
translation:
  language: de
  text: 'Da sandte Isebel einen Boten zu Elia mit der Botschaft: »Die Götter sollen mir dies antun und noch mehr, wenn ich nicht morgen um diese Zeit dein Leben dem Leben eines von ihnen gleichmache.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּשְׁלַח
  choice: Da sandte
  rationale: Das Wayyiqtol führt die Erzählung fort; »Da« gibt die zeitliche und narrative Folge in natürlichem Deutsch wieder.
- source_word: מַלְאָךְ
  choice: Boten
  rationale: Im höfischen Zusammenhang bezeichnet das Wort einen menschlichen Überbringer, keinen Engel.
- source_word: לֵאמֹר
  choice: und ließ ihm sagen
  rationale: Die deutsche Botenformel gibt idiomatisch wieder, dass Isebel dem Boten die folgende Botschaft an Elia aufträgt.
- source_word: כֹּה יַעֲשׂוּן אֱלֹהִים וְכֹה יוֹסִפוּן
  choice: Die Götter sollen mir dies und noch Schlimmeres antun
  rationale: Die feste Schwurformel ruft göttliche Strafe auf die Sprecherin herab. »Noch Schlimmeres« vermittelt die steigernde Wirkung des zweiten Glieds natürlich; »mir« ist als Ziel der Selbstverfluchung im Deutschen zur Verständlichkeit ergänzt.
- source_word: אֱלֹהִים
  choice: die Götter
  rationale: Die Pluralverben יַעֲשׂוּן und יוֹסִפוּן sowie Isebels religiöser Kontext sprechen hier für den Plural, obwohl die Form auch singularisch »Gott« bezeichnen kann.
- source_word: כִּי
  choice: wenn ... nicht
  rationale: In der Schwurformel leitet כִּי den Fall ein, bei dessen Nichteintreten die Selbstverfluchung gelten soll; die deutsche Konstruktion »wenn ich nicht« bildet dies idiomatisch ab.
- source_word: כָעֵת מָחָר
  choice: morgen um diese Zeit
  rationale: Die Wendung bezeichnet den entsprechenden Zeitpunkt am folgenden Tag, nicht zwingend eine Frist bis dahin.
- source_word: אָשִׂים אֶת־נַפְשְׁךָ
  choice: dein Leben ... gleichmache
  rationale: Die Formulierung bewahrt נֶפֶשׁ als »Leben« und gibt שׂים mit dem Vergleich als »gleichmachen« wieder, ohne die Drohung lediglich zu »dich töten« zu vereinfachen.
- source_word: כְּנֶפֶשׁ אַחַד מֵהֶם
  choice: dem Leben eines von ihnen
  rationale: Die Wiederholung von נֶפֶשׁ wird erhalten; gemeint ist, dass Elia dasselbe tödliche Schicksal wie einer der Getöteten erleiden soll.
theological_decisions:
- issue: Numerus und Referent von אֱלֹהִים in Isebels Schwur
  choice: 'Plural: »die Götter«'
  alternative: 'Singular: »Gott«'
  rationale: Die beiden zugehörigen Verben stehen im Plural, und Isebels erzählerischer Kontext stützt die pluralische Lesart. Da אֱלֹהִים jedoch auch den Gott Israels bezeichnen kann, wird die singularische Möglichkeit in einer Fußnote offengelegt.
- issue: Explizites »mir« in der Selbstverfluchungsformel
  choice: »mir« im Haupttext ergänzt
  alternative: 'Formal ohne Ergänzung: »Die Götter sollen dies tun und noch mehr hinzufügen«'
  rationale: Das Ziel der angedrohten Strafe ist in der hebräischen Schwurformel idiomatisch vorausgesetzt. Die Ergänzung macht die Formel im Deutschen verständlich, ohne eine besondere Lehrposition einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Botenformel und der Selbstverfluchungsschwur werden verständlich und zugleich quellenah wiedergegeben. Der Ausruf unterstreicht den Charakter der Todesdrohung.
