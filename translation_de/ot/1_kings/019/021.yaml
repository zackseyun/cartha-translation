base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/021.yaml
  text: Then he turned back from following him[a], took the pair of oxen, and sacrificed them. With the oxen’s equipment he boiled the flesh and gave it to the people, and they ate[b]. Then he arose and went after Elijah and served him.
translation:
  language: de
  text: Da kehrte er um und ging von ihm weg. Er nahm das Ochsengespann[a] und opferte es. Mit dem Geschirr der Ochsen[b] kochte er das Fleisch, gab es den Leuten, und sie aßen. Dann machte er sich auf, ging Elia nach und diente ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: das Ochsenpaar.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: Mit den Geräten beziehungsweise dem Joch der Ochsen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב מֵאַחֲרָיו
  choice: Da kehrte er um und ging von ihm weg
  rationale: Die Wendung bedeutet wörtlich etwa „er kehrte von hinter ihm zurück“. Die Übersetzung gibt die räumliche Bewegung natürlich wieder, ohne ein inneres Abwenden von Elia anzudeuten.
- source_word: צֶמֶד הַבָּקָר
  choice: das Ochsengespann
  rationale: צֶמֶד bezeichnet hier ein zusammengehöriges, gewöhnlich angespanntes Ochsenpaar. „Ochsengespann“ ist im Deutschen knapp und anschaulich; die Alternative „Ochsenpaar“ wird in der Fußnote genannt.
- source_word: וַיִּזְבָּחֵהוּ
  choice: und opferte es
  rationale: זבח bezeichnet häufig ein schlachtendes Opfern und bewahrt hier die mögliche kultische Färbung. Das singularische Pronomen entspricht dem kollektiv verstandenen „Gespann“, ohne den Empfänger oder die genaue Form des Opfers festzulegen.
- source_word: וּבִכְלִי הַבָּקָר
  choice: Mit dem Geschirr der Ochsen
  rationale: כְּלִי ist ein weiter Ausdruck für Gerät oder Ausrüstung. „Geschirr“ passt zum Arbeitsgerät eines Ochsengespanns und lässt offen, welche einzelnen Holzteile als Brennstoff dienten.
- source_word: בִּשְּׁלָם הַבָּשָׂר
  choice: kochte er das Fleisch
  rationale: בשל kann „kochen“ oder genauer „sieden“ bedeuten. „Kochen“ ist im modernen Deutsch natürlich und bewahrt die Zubereitungsart, ohne unnötig technisch zu wirken.
- source_word: לָעָם
  choice: gab es den Leuten
  rationale: עָם meint hier die anwesende örtliche Gemeinschaft. „Den Leuten“ klingt in diesem konkreten Erzählzusammenhang natürlicher als das möglicherweise umfassender wirkende „dem Volk“.
- source_word: וַיָּקָם
  choice: Dann machte er sich auf
  rationale: Die idiomatische Wiedergabe beschreibt den Übergang zum Aufbruch natürlich und behält die erzählerische Abfolge bei.
- source_word: וַיֵּלֶךְ אַחֲרֵי אֵלִיָּהוּ
  choice: ging Elia nach
  rationale: Die Formulierung wahrt das räumliche Bild des Gehens hinter Elia her und kann zugleich den Beginn der Nachfolge ausdrücken.
- source_word: וַיְשָׁרְתֵהוּ
  choice: und diente ihm
  rationale: שרת bezeichnet einen persönlichen Dienst, oft den eines Gehilfen. „Diente ihm“ bleibt bewusst weit und legt die genaue Art des Dienstes nicht fest.
theological_decisions:
- issue: Ob זבח ausdrücklich als Opferhandlung wiederzugeben ist
  choice: „opferte es“
  alternative: „schlachtete es“
  rationale: Das Verb trägt gewöhnlich Opferbedeutung, und das anschließende Gemeinschaftsmahl passt dazu. Die Übersetzung benennt jedoch weder den Empfänger noch einen bestimmten kultischen Ritus und geht damit nicht über den Text hinaus.
translation_notes:
  register: Moderne, würdige Erzählsprache mit kurzen, klaren Sätzen. Die wiederholte Handlungsfolge des Hebräischen bleibt erkennbar, wird aber in natürlichem Standarddeutsch wiedergegeben. Die Fußnoten stehen unmittelbar bei den jeweils mehrdeutigen Ausdrücken.
