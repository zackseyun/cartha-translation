  text: וַ/יָּבֹא שָׁ֥ם אֶל הַ/מְּעָרָ֖ה וַ/יָּ֣לֶן שָׁ֑ם וְ/הִנֵּ֤ה דְבַר יְהוָה֙ אֵלָ֔י/ו וַ/יֹּ֣אמֶר ל֔/וֹ מַה לְּ/ךָ֥ פֹ֖ה אֵלִיָּֽהוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/009.yaml
  text: There he came to the cave and spent the night there. And behold[a], the word of Yahweh came to him and said to him, “What are you doing here, Elijah?”
translation:
  language: de
  text: 'Dort kam er an eine Höhle und übernachtete dort. Da geschah es: Das Wort Jahwes kam zu ihm und sprach zu ihm: »Was tust du hier[a], Elia?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Warum bist du hier, Elia?« Wörtlich lautet die hebräische Wendung etwa: »Was ist dir hier, Elia?«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא שָׁם אֶל הַמְּעָרָה
  choice: Dort kam er zu der Höhle
  rationale: בוא bezeichnet hier die Bewegung zu einem Ziel. „Kam … zu der Höhle“ bewahrt sowohl die Bewegungsrichtung als auch den bestimmten Artikel, ohne ein Betreten ausdrücklich zu machen.
- source_word: וַיָּלֶן שָׁם
  choice: und übernachtete dort
  rationale: לון/לין bedeutet „die Nacht verbringen, übernachten“. „Übernachtete“ ist knappes, natürliches modernes Deutsch.
- source_word: וְהִנֵּה
  choice: Und sieh
  rationale: הִנֵּה lenkt die Aufmerksamkeit auf das plötzlich einsetzende Geschehen. „Und sieh“ erhält diese lebendige Diskursfunktion, statt den Ausdruck unmarkiert wegzulassen.
- source_word: דְבַר יְהוָה
  choice: das Wort Jahwes
  rationale: Die feste prophetische Wendung wird formal bewahrt; der Gottesname erscheint im deutschen Genitiv als „Jahwes“.
- source_word: וַיֹּאמֶר לוֹ
  choice: und sprach zu ihm
  rationale: Das nicht eigens genannte Subjekt wird syntaktisch an „das Wort Jahwes“ angeschlossen. „Sprach“ entspricht dem feierlichen Erzählregister, ohne altertümlich zu wirken.
- source_word: מַה לְּךָ פֹה
  choice: Was tust du hier?
  rationale: Die hebräische Wendung lautet wörtlich etwa „Was ist dir hier?“ und fragt im Zusammenhang nach Elias Anwesenheit beziehungsweise Tun. Die gewählte idiomatische Wiedergabe lässt mehr offen als das enger auf den Grund zielende „Warum bist du hier?“.
- source_word: אֵלִיָּהוּ
  choice: Elia
  rationale: „Elia“ ist die etablierte deutsche Namensform.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe / Jahwes
  alternative: der HERR / des HERRN
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Subjekt von וַיֹּאמֶר nach דְבַר יְהוָה
  choice: Das Wort Jahwes „sprach“ zu Elia
  alternative: Jahwe sprach zu Elia
  rationale: Das Hebräische nennt beim Verb kein neues Subjekt. Der unmittelbare syntaktische Anschluss an „das Wort Jahwes“ wird bewahrt, ohne die Aussage ausdrücklich auf Jahwe als ergänztes Subjekt festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Und sieh“ bewahrt die aufmerksamkeitslenkende Wirkung von הִנֵּה; „sprach“ hält den biblischen Erzählton, bleibt aber allgemein verständlich.
