revisions:
- from: 'Dort kam er zu der Höhle und übernachtete dort. Und sieh, das Wort Jahwes kam zu ihm und sprach zu ihm: »Was tust du hier[a], Elia?«'
  to: 'Dort kam er an eine Höhle und übernachtete dort. Da geschah es: Das Wort Jahwes kam zu ihm und sprach zu ihm: »Was tust du hier[a], Elia?«'
  rationale: Die Revision glättet die deutsche Bewegungsformulierung und gibt die ereignishervorhebende Funktion von וְהִנֵּה in modernem, würdigem Deutsch wieder. Die Quelltextambiguität der Frage bleibt durch den Haupttext und die Fußnote erhalten. Der Gottesname, die prophetische Formel und die etablierte deutsche Namensform bleiben unverändert.
