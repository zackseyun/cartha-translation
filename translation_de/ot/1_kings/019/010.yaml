revisions:
- from: 'Er sagte: „Mit leidenschaftlichem Eifer bin ich für Jahwe, den Gott der Heerscharen, eingetreten[a]. Denn die Israeliten haben deinen Bund verlassen, deine Altäre niedergerissen und deine Propheten mit dem Schwert getötet. Ich allein bin übrig geblieben, und nun trachten sie mir nach dem Leben, um es mir zu nehmen.“'
  to: 'Er sagte: „Ich habe mit großem Eifer für Jahwe, den Gott der Heerscharen, geeifert[a]. Denn die Israeliten haben deinen Bund verlassen, deine Altäre niedergerissen und deine Propheten mit dem Schwert getötet. Ich allein bin übrig geblieben, und sie sind darauf aus, mir das Leben zu nehmen.“'
  rationale: Die Revision ersetzt die leicht konkretisierende Wendung „eingetreten“ durch „geeifert“, das den Ausdruck קַנֹּא קִנֵּאתִי genauer abbildet, ohne die im Deutschen missverständliche Bedeutung von „eifersüchtig“ aufzurufen. Die Schlusswendung wird zugleich natürlicher und expliziert die im Hebräischen durch לְקַחְתָּהּ ausgedrückte Absicht, das Leben zu nehmen. Der Gottesname, der Gottestitel, die direkte Rede und Elijas unrelativierte Selbstaussage bleiben erhalten.
