source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ קַנֹּ֨א קִנֵּ֜אתִי לַ/יהוָ֣ה אֱלֹהֵ֣י צְבָא֗וֹת כִּֽי עָזְב֤וּ בְרִֽיתְ/ךָ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶת מִזְבְּחֹתֶ֣י/ךָ הָרָ֔סוּ וְ/אֶת נְבִיאֶ֖י/ךָ הָרְג֣וּ בֶ/חָ֑רֶב וָֽ/אִוָּתֵ֤ר אֲנִי֙ לְ/בַדִּ֔/י וַ/יְבַקְשׁ֥וּ אֶת נַפְשִׁ֖/י לְ/קַחְתָּֽ/הּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/010.yaml
  text: And he said[a], “I have been very zealous for Yahweh, the God of hosts, because the sons of Israel have forsaken your covenant, torn down your altars, and killed your prophets with the sword. I alone am left, and they seek my life[c][b], to take it.”
translation:
  language: de
  text: 'Er sagte: „Ich habe mit großem Eifer für Jahwe, den Gott der Heerscharen, geeifert[a]. Denn die Israeliten haben deinen Bund verlassen, deine Altäre niedergerissen und deine Propheten mit dem Schwert getötet. Ich allein bin übrig geblieben, und sie sind darauf aus, mir das Leben zu nehmen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Eifernd habe ich für Jahwe geeifert.“ Die hebräische Konstruktion verstärkt Elijas Aussage und kann auch mit „Ich habe überaus eifrig für Jahwe geeifert“ wiedergegeben werden.'
    reason: Die intensive hebräische Konstruktion und ihre formnähere Wiedergabe sollen sichtbar bleiben.
lexical_decisions:
- source_word: קַנֹּא קִנֵּאתִי
  choice: Mit leidenschaftlichem Eifer bin ich … eingetreten
  rationale: Der Infinitivus absolutus mit dem finiten Verb verstärkt die Aussage. Die Formulierung gibt sowohl den Eifer als auch die emphatische Intensität in natürlichem Deutsch wieder; „eifersüchtig gewesen“ wäre missverständlich.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition bezeichnet hier den Gegenstand von Elijas Eifer. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: den Gott der Heerscharen
  rationale: „Heerscharen“ bewahrt die Bedeutung des hebräischen צְבָאוֹת und den feierlichen biblischen Sprachklang, ohne den Titel mit „Allmächtiger“ gleichzusetzen.
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion führt die Begründung für Elijas Eifer ein. „Denn“ ist in direkter Rede natürlich und lässt zugleich die mögliche erklärende Nuance erkennen.
- source_word: עָזְבוּ בְרִיתְךָ
  choice: haben deinen Bund verlassen
  rationale: עָזַב bedeutet verlassen oder aufgeben. „Den Bund verlassen“ ist verständlich und bewahrt das konkrete Bild des Ausgangstextes.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die wörtliche Wendung „Söhne Israels“ bezeichnet hier das Volk Israel insgesamt. „Die Israeliten“ ist im modernen Deutschen natürlich und schließt die korporative Bedeutung ein.
- source_word: מִזְבְּחֹתֶיךָ הָרָסוּ
  choice: deine Altäre niedergerissen
  rationale: הָרַס bezeichnet das Einreißen oder Zerstören eines Bauwerks. „Niedergerissen“ ist konkret und idiomatisch.
- source_word: נְבִיאֶיךָ הָרְגוּ בֶחָרֶב
  choice: deine Propheten mit dem Schwert getötet
  rationale: Die Übersetzung bewahrt sowohl die Tötung als auch das ausdrücklich genannte Tatmittel.
- source_word: וָאִוָּתֵר אֲנִי לְבַדִּי
  choice: Ich allein bin übrig geblieben
  rationale: Die Stellung von אֲנִי לְבַדִּי betont Elijas behauptete Vereinzelung. Die deutsche Formulierung erhält diesen Nachdruck.
- source_word: וַיְבַקְשׁוּ אֶת נַפְשִׁי
  choice: nun trachten sie mir nach dem Leben
  rationale: נֶפֶשׁ bezeichnet hier das Leben beziehungsweise die Person, nicht eine abtrennbare „Seele“. Die deutsche Redewendung gibt die Tötungsabsicht klar wieder; „nun“ verdeutlicht den fortlaufenden erzählerischen Anschluss des Waw, ohne eine neue Sachinformation einzuführen.
- source_word: לְקַחְתָּהּ
  choice: um es mir zu nehmen
  rationale: Das feminine Suffix verweist auf נַפְשִׁי, hier „mein Leben“. Das Pronomen erhält diesen Rückbezug und vermeidet unnötige Wiederholung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Bundesnamen wieder, während „der HERR“ die traditionelle Ersatzlesung repräsentiert.
- issue: Bedeutung von Elijas קנא-Aussage
  choice: leidenschaftlicher Eifer für Jahwe
  alternative: Eifersucht für Jahwe
  rationale: Das Verb kann Eifer beziehungsweise Eifersucht ausdrücken. Im Kontext beschreibt Elija seinen entschiedenen Einsatz für Jahwes Bund und Verehrung; die Übersetzung vermeidet die im Deutschen naheliegende Bedeutung zwischenmenschlichen Neids, ohne die Intensität abzuschwächen.
- issue: Elijas Aussage, allein übrig zu sein
  choice: als Elijas eigene uneingeschränkte Aussage wiedergegeben
  alternative: durch einen erklärenden Zusatz relativieren
  rationale: Der Vers gibt Elijas Klage wieder. Obwohl der weitere Kontext seine Einschätzung korrigiert beziehungsweise nuanciert, darf dies nicht in seine Aussage hineingelesen werden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Heerscharen“ bleibt wegen des feststehenden Gottestitels und seiner militärisch-kosmischen Weite erhalten. Die direkte Rede bewahrt Elijas Nachdruck und seine theologisch spannungsvolle Selbsteinschätzung.
