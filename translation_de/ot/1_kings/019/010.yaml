    rationale: „Nun“ ist im Hebräischen nicht ausdrücklich vorhanden, und die Redewendung ist etwas gehoben. „Sie sind darauf aus, mir das Leben zu nehmen“ ist modernes Standarddeutsch und gibt sowohl „mein Leben suchen“ als auch den Zweck „es zu nehmen“ klar wieder.
