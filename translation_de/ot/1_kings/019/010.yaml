  naturalness: Der Text ist flüssiges, modernes Standarddeutsch mit angemessen würdigem Register. „Jemandem nach dem Leben trachten“ ist verständlich, wirkt aber gehobener und weniger unmittelbar als die im revidierten Text gewählte Formulierung.
  terminology: „Jahwe“ gibt den Gottesnamen angemessen wieder; „Gott der Heerscharen“ wahrt den feststehenden Titel und seine Bedeutung. „Israeliten“, „Bund“, „Altäre“, „Propheten“ und „Leben“ sind sachgerecht. Der englische Audit-Trail ist bei den Fußnoten inkonsistent (insbesondere die Markierung der Intensitätsanmerkung sowie eine Anmerkung, die dem dortigen Haupttext widerspricht); dies betrifft nicht die deutsche Textgrundlage, sollte aber redaktionell bereinigt werden.
