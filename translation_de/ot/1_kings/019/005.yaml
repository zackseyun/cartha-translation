  yaml_path: translation/ot/1_kings/019/005.yaml
  text: Then he lay down and slept under a broom tree. And behold[a], an angel touched him and said to him, “Get up, eat.”
translation:
  language: de
  text: 'Dann legte er sich unter einen Ginsterstrauch und schlief. Da berührte ihn ein Engel[a] und sagte zu ihm: »Steh auf und iss!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Bote«. Das hebräische Wort מַלְאָךְ kann sowohl einen menschlichen Boten als auch ein Engelwesen bezeichnen; hier spricht der Zusammenhang für »Engel«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב וַיִּישַׁן
  choice: Dann legte er sich … und schlief ein
  rationale: Die beiden Qal-Erzählformen beschreiben die aufeinanderfolgenden Handlungen des Hinlegens und Schlafens. »Schlief ein« ist im modernen Deutschen die natürliche Wiedergabe, ohne den Sinn auszuweiten.
- source_word: תַּחַת רֹתֶם אֶחָד
  choice: unter einen Ginsterstrauch
  rationale: רֹתֶם bezeichnet den in der Wüste wachsenden Ginster beziehungsweise Ginsterstrauch. אֶחָד dient hier idiomatisch der unbestimmten Einführung; im Deutschen genügt der unbestimmte Artikel.
- source_word: וְהִנֵּה זֶה
  choice: Doch auf einmal
  rationale: Die präsentative Wendung hebt eine überraschende neue Wahrnehmung hervor. »Doch auf einmal« gibt diese narrative Signalwirkung in natürlichem modernem Deutsch wieder, ohne ein archaisches »siehe« zu verwenden.
- source_word: מַלְאָךְ
  choice: Engel
  rationale: Das Wort kann einen menschlichen Boten oder ein übernatürliches Engelwesen bezeichnen. Die folgende wundersame Versorgung im Wüstenkontext spricht hier für »Engel«; die echte lexikalische Alternative wird in der Fußnote bewahrt.
- source_word: נֹגֵעַ בּוֹ
  choice: berührte ihn
  rationale: Das Partizip von נגע bezeichnet körperlichen Kontakt und wird im deutschen Erzählfluss natürlich als finite vergangene Handlung wiedergegeben.
- source_word: וַיֹּאמֶר לוֹ
  choice: und sagte zu ihm
  rationale: Die Wiedergabe bewahrt sowohl die übliche Erzählformel als auch das ausdrücklich genannte indirekte Objekt.
- source_word: קוּם אֱכֹל
  choice: Steh auf und iss!
  rationale: Die knappen Imperative werden ebenso knapp und in gegenwärtigem, würdigem Deutsch wiedergegeben. Das verbindende »und« ist im Deutschen idiomatisch.
theological_decisions:
- issue: Ob מַלְאָךְ als »Engel« oder »Bote« wiederzugeben ist
  choice: Engel
  alternative: Bote
  rationale: Der unmittelbare und weitere Zusammenhang schildert eine außergewöhnliche Versorgung in der Wüste und legt daher ein übernatürliches Wesen nahe. Da das hebräische Wort für sich genommen beide Bedeutungen zulässt, bleibt »Bote« als Fußnotenalternative sichtbar.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die überraschende Funktion von וְהִנֵּה wird idiomatisch statt archaisierend wiedergegeben; die direkte Rede bleibt knapp und nachdrücklich.
