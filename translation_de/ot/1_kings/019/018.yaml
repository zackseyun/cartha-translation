  text: וְ/הִשְׁאַרְתִּ֥י בְ/יִשְׂרָאֵ֖ל שִׁבְעַ֣ת אֲלָפִ֑ים כָּל הַ/בִּרְכַּ֗יִם אֲשֶׁ֤ר לֹֽא כָֽרְעוּ֙ לַ/בַּ֔עַל וְ/כָ֨ל הַ/פֶּ֔ה אֲשֶׁ֥ר לֹֽא נָשַׁ֖ק לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/018.yaml
  text: Yet I have left for myself seven thousand in Israel—all the knees that have not bowed to Baal[b][a], and every mouth that has not kissed him.
translation:
  language: de
  text: 'Doch ich habe in Israel siebentausend übrig gelassen[a]: alle Knie, die sich nicht vor Baal gebeugt haben, und jeden Mund, der ihn nicht geküsst hat[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Doch ich werde in Israel siebentausend übrig lassen“ oder „bewahren“.'
    reason: lexical_alternative
  - marker: b
    text: Das Küssen einer Gottheit oder ihres Bildes konnte eine Geste der Verehrung oder Anbetung sein.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִשְׁאַרְתִּי
  choice: Doch ich werde … übrig lassen
  rationale: Das Hifil von שׁאר bedeutet hier, jemanden verbleiben zu lassen bzw. zu bewahren. Im Anschluss an die Zukunftsaussagen in Vers 17 ist die Zukunftsform im Deutschen kontextuell am stärksten; die formal mögliche perfektische Auffassung wird in der Fußnote bewahrt. „Doch“ gibt den Gegensatz zu Elias Klage wieder. Ein ausdrückliches „für mich“ steht im masoretischen Text nicht und wird daher nicht in den Haupttext aufgenommen.
- source_word: בְיִשְׂרָאֵל
  choice: in Israel
  rationale: Direkte lokative Wiedergabe.
- source_word: שִׁבְעַת אֲלָפִים
  choice: siebentausend
  rationale: Idiomatiche Wiedergabe der hebräischen Zahlverbindung.
- source_word: כָּל הַבִּרְכַּיִם
  choice: alle Knie
  rationale: Die konkrete, kollektiv gebrauchte Körpermetapher bleibt erhalten und bezeichnet die Menschen, die sich nicht im Kult vor Baal niedergebeugt haben.
- source_word: אֲשֶׁר לֹא כָרְעוּ לַבַּעַל
  choice: die sich nicht vor Baal gebeugt haben
  rationale: כרע bezeichnet Knien oder Sichbeugen. „Sich vor Baal beugen“ ist im Deutschen natürlich und vermittelt die kultische Unterwerfung, ohne zusätzliche Deutung einzutragen.
- source_word: הַבַּעַל
  choice: Baal
  rationale: Obwohl das Hebräische den Artikel setzt, wird Baal im modernen Deutschen gewöhnlich wie ein Eigenname ohne Artikel gebraucht.
- source_word: וְכָל הַפֶּה
  choice: und jeden Mund
  rationale: Der singularische Kollektivausdruck nach כָּל wird distributiv wiedergegeben; zugleich bleibt das Körperbild parallel zu „alle Knie“ sichtbar.
- source_word: אֲשֶׁר לֹא נָשַׁק לוֹ
  choice: der ihn nicht geküsst hat
  rationale: נשׁק bedeutet „küssen“. Das Pronomen „ihn“ folgt dem hebräischen Suffix und bezieht sich eindeutig auf Baal; die kultische Bedeutung wird nicht in den Text hineinerklärt, sondern in einer Fußnote erläutert.
theological_decisions:
- issue: Zeitbezug und Bedeutung der Aussage über die siebentausend Übriggebliebenen
  choice: ich werde in Israel siebentausend übrig lassen
  alternative: ich habe in Israel siebentausend übrig gelassen / bewahrt
  rationale: Die Form kann isoliert perfektisch verstanden werden, steht hier jedoch in einer Folge von Zukunftsaussagen über das kommende Gericht. Die Übersetzung folgt deshalb dem kontextuellen Zukunftsbezug, hält aber die andere grammatisch mögliche Auffassung in der Fußnote offen. Technische remnant-theologische Begriffe werden vermieden.
- issue: Gottes persönliche Zuordnung der Übriggebliebenen
  choice: ohne ausdrückliches „für mich“
  alternative: ich werde mir siebentausend übrig lassen
  rationale: Der hebräische Satz enthält kein entsprechendes Dativpronomen. Dass die Menschen Gott treu bleiben, ergibt sich aus dem Gegensatz zum Baalskult; eine ausdrückliche Besitz- oder Zweckangabe soll nicht aus späterer Rezeption in den Ausgangstext eingetragen werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die körperlichen Bilder „Knie“ und „Mund“ bleiben trotz ihrer im Deutschen auffälligen Kollektivform erhalten. Die Satzstruktur ist klar und lesbar, ohne die kultische Bildsprache zu glätten.
