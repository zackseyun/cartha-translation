  source_fidelity: 'Die Übersetzung gibt die hebräische Satzfolge und die zentralen Aussagen zuverlässig wieder: der implizite Bezug von »hörte«, das Verhüllen des Gesichts mit dem Mantel, das Hinausgehen und Stehen am Höhleneingang sowie die idiomatische Frage מַה־לְּךָ פֹה. Das neutrale »es« bewahrt die im Hebräischen bestehende Unbestimmtheit des gehörten Gegenstands.'
  naturalness: Modernes, verständliches und zugleich würdiges Standarddeutsch. »Und sieh, da« ist leicht literarisch, aber als Wiedergabe der hervorhebenden Erzählpartikel וְהִנֵּה gut vertretbar und im gewählten Register nicht unnatürlich.
  terminology: »Elia«, »Mantel«, »Höhle« und »Stimme« entsprechen etabliertem deutschem Bibelgebrauch und sind semantisch passend. Die Frage »Was tust du hier?« ist idiomatisch und wahrt gegenüber »Warum bist du hier?« den weiteren Bedeutungsumfang der hebräischen Wendung.
