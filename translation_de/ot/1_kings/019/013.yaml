id: 1KI.19.13
reference: 1 Kings 19:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְהִ֣י כִּ/שְׁמֹ֣עַ אֵלִיָּ֗הוּ וַ/יָּ֤לֶט פָּנָי/ו֙ בְּ/אַדַּרְתּ֔/וֹ וַ/יֵּצֵ֕א וַֽ/יַּעֲמֹ֖ד פֶּ֣תַח הַ/מְּעָרָ֑ה וְ/הִנֵּ֤ה אֵלָי/ו֙ ק֔וֹל וַ/יֹּ֕אמֶר מַה לְּ/ךָ֥ פֹ֖ה אֵלִיָּֽהוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/013.yaml
  text: And when Elijah heard it[a], he wrapped his face in his cloak, and went out and stood at the entrance of the cave. And behold, a voice came to him and said, “What are you doing here[b], Elijah?”
translation:
  language: de
  text: 'Als Elia es hörte[a], hüllte er sein Gesicht in seinen Mantel, ging hinaus und stellte sich an den Eingang der Höhle. Und sieh, da kam eine Stimme zu ihm und sagte: »Was tust du hier[b], Elia?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Objekt von »hörte« bleibt im Hebräischen unausgesprochen. Aus dem Zusammenhang ist gemeint, was unmittelbar zuvor beschrieben wurde; die Formulierung legt nicht genauer fest, ob es als Laut oder als Stimme zu verstehen ist.
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich etwa: »Was ist dir hier?« Die hebräische Wendung fragt nach Elias Tun, Anliegen oder Zweck an diesem Ort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּשְׁמֹעַ
  choice: Als … es hörte
  rationale: Die Verbindung aus כ und Infinitivus constructus bildet einen Temporalsatz. Das Objekt bleibt im Hebräischen unausgesprochen; das zurückweisende »es« gibt dies im Deutschen knapp und natürlich wieder.
- source_word: וַיָּלֶט פָּנָיו בְּאַדַּרְתּוֹ
  choice: hüllte er sein Gesicht in seinen Mantel
  rationale: Das Verb bezeichnet ein enges Ein- oder Verhüllen. אַדֶּרֶת ist hier ein charakteristisches Obergewand; »Mantel« ist im modernen Deutschen verständlich und passt zur konkreten Handlung.
- source_word: וַיֵּצֵא וַיַּעֲמֹד
  choice: ging hinaus und stellte sich
  rationale: Die beiden aufeinanderfolgenden Erzählverben bezeichnen das Hinausgehen aus der Höhle und das Einnehmen eines Standorts an ihrem Eingang.
- source_word: פֶּתַח הַמְּעָרָה
  choice: an den Eingang der Höhle
  rationale: פֶּתַח bezeichnet die Öffnung beziehungsweise den Eingang. »Eingang der Höhle« ist klar und idiomatisch.
- source_word: וְהִנֵּה
  choice: Und sieh, da
  rationale: הִנֵּה dient der lebhaften Hinführung auf das nun Wahrgenommene. »Und sieh, da« bewahrt diese Erzählwirkung, ohne ein nicht ausdrücklich genanntes »plötzlich« hinzuzufügen.
- source_word: אֵלָיו קוֹל
  choice: da kam eine Stimme zu ihm
  rationale: Der hebräische Nominalsatz lautet wörtlich etwa »zu ihm eine Stimme«. Die gewählte Fassung gibt idiomatisch wieder, dass eine Stimme ihn erreichte und ansprach.
- source_word: מַה לְּךָ פֹה
  choice: Was tust du hier
  rationale: Die hebräische Wendung fragt nach Elias Anliegen, Tätigkeit oder Zweck an diesem Ort. Die Fassung bleibt weiter als das stärker auf einen Grund festgelegte »Warum bist du hier?«.
- source_word: אֵלִיָּהוּ
  choice: Elia
  rationale: Der Personenname folgt der im Deutschen etablierten biblischen Namensform.
theological_decisions:
- issue: Unausgesprochenes Objekt zu »hörte«
  choice: Als Elia es hörte
  alternative: Als Elia die Stimme hörte / Als Elia das Geräusch hörte
  rationale: Im Hebräischen steht kein ausdrückliches Objekt. Der vorausgehende Zusammenhang liefert den Bezug, lässt aber offen, ob genauer an den Laut, das leise Tönen oder die Stimme gedacht ist. Das neutrale Pronomen bewahrt diese Offenheit.
- issue: Bedeutungsumfang der Frage מַה לְּךָ פֹה
  choice: Was tust du hier?
  alternative: Warum bist du hier? / Was hast du hier zu schaffen?
  rationale: Die Wendung kann nach Elias Tun, Anliegen oder Zweck fragen. »Was tust du hier?« wahrt diesen Spielraum und legt die Frage nicht ausschließlich auf sein Motiv fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählführung. »Und sieh, da« erhält die hervorhebende Funktion von וְהִנֵּה; die beiden Fußnoten bewahren die echte sprachliche Offenheit des hebräischen Textes.
