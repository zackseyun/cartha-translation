base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/006.yaml
  text: He looked[a], and behold, at his head was a cake baked on hot stones and a jar of water. He ate and drank and lay down again.
translation:
  language: de
  text: 'Er blickte, und siehe: An seinem Kopfende lagen ein auf heißen Steinen gebackener Brotfladen[a] und ein Krug Wasser. Er aß und trank und legte sich wieder hin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Brotfladen auf Glut“. Das hebräische Wort רְצָפִים kann erhitzte Backsteine bezeichnen, wird aber auch allgemeiner als Glut verstanden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּבֵּט
  choice: Er blickte auf
  rationale: נבט bezeichnet ein gezieltes Blicken. Im Zusammenhang mit dem unmittelbar vorausgehenden Erwachen gibt „blickte auf“ die Handlung natürlich wieder, ohne ein nicht genanntes Blickziel einzuführen.
- source_word: וְהִנֵּה
  choice: und siehe
  rationale: הִנֵּה lenkt die Aufmerksamkeit lebhaft auf das nun Wahrgenommene. „Und siehe“ bewahrt diese narrative Unmittelbarkeit in würdigem, verständlichem Deutsch.
- source_word: מְרַאֲשֹׁתָיו
  choice: an seinem Kopfende
  rationale: Das Wort bezeichnet den Platz beim Kopf eines Liegenden. „An seinem Kopfende“ ist präzise und im Deutschen natürlicher als das missverständliche „an seinem Kopf“.
- source_word: עֻגַת
  choice: Brotfladen
  rationale: עֻגָה meint hier ein rundes, flaches Gebäck beziehungsweise Brot. „Brotfladen“ vermeidet die moderne Vorstellung eines süßen Kuchens.
- source_word: רְצָפִים
  choice: auf heißen Steinen gebacken
  rationale: רְצָפִים kann erhitzte Steine zum Backen bezeichnen, wird aber auch als Glut oder Kohlen verstanden. Die Hauptfassung gibt die wahrscheinliche Backweise wieder; die Fußnote bewahrt die lexikalische Alternative.
- source_word: וְצַפַּחַת מָיִם
  choice: und ein Krug Wasser
  rationale: צַפַּחַת bezeichnet ein kleines Gefäß beziehungsweise einen Krug oder eine Flasche. „Krug Wasser“ ist klar, schlicht und passt zum Erzählzusammenhang.
- source_word: וַיֹּאכַל וַיֵּשְׁתְּ
  choice: Er aß und trank
  rationale: Die aufeinanderfolgenden Erzählformen werden in ihrer knappen, rhythmischen Koordination bewahrt.
- source_word: וַיָּשָׁב וַיִּשְׁכָּב
  choice: und legte sich wieder hin
  rationale: שׁוּב mit שׁכב drückt hier die Wiederaufnahme des Liegens aus. „Legte sich wieder hin“ ist natürliches Deutsch und bewahrt den Aspekt der Wiederholung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper Erzählbewegung. Das traditionelle Aufmerksamkeitssignal „und siehe“ bleibt erhalten. „Brotfladen“ verhindert das im heutigen Deutsch naheliegende Missverständnis eines süßen Kuchens; die Unsicherheit bei רְצָפִים wird in der Fußnote offengehalten.
