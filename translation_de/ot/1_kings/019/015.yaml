id: 1KI.19.15
reference: 1 Kings 19:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלָ֔י/ו לֵ֛ךְ שׁ֥וּב לְ/דַרְכְּ/ךָ֖ מִדְבַּ֣רָ/ה דַמָּ֑שֶׂק וּ/בָ֗אתָ וּ/מָשַׁחְתָּ֧ אֶת חֲזָאֵ֛ל לְ/מֶ֖לֶךְ עַל אֲרָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/015.yaml
  text: And Yahweh said to him[a], “Go, return by your way to the wilderness of Damascus; and when you arrive[b], you shall anoint Hazael as king over Aram.”
translation:
  language: de
  text: 'Und Yahweh sagte zu ihm: »Geh, kehre auf deinem Weg zurück zur Wüste von Damaskus[a]. Wenn du dort ankommst, sollst du Hasaël zum König über Aram[b] salben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »in Richtung auf die Wüste von Damaskus«. Das hebräische Wort für »Wüste« trägt eine Richtungsendung.'
    reason: lexical_alternative
  - marker: b
    text: Aram ist der hebräische Name des Gebietes, das häufig »Syrien« genannt wird.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לֵךְ שׁוּב
  choice: Geh, kehre … zurück
  rationale: Die beiden hebräischen Imperative bleiben erkennbar, ohne im Deutschen unnatürlich zu wirken.
- source_word: לְדַרְכְּךָ
  choice: auf deinem Weg
  rationale: Die Formulierung gibt die Wegangabe idiomatisch wieder, ohne eine bestimmte Reiseroute stärker festzulegen, als es der hebräische Text tut.
- source_word: מִדְבָּרָה דַמָּשֶׂק
  choice: zur Wüste von Damaskus
  rationale: Die Richtungsendung an מִדְבָּרָה bezeichnet eine Bewegung auf das mit Damaskus verbundene Wüstengebiet zu.
- source_word: וּבָאתָ
  choice: Wenn du dort ankommst
  rationale: Die verbundene Perfektform führt im Zusammenhang die nächste Handlung nach der Ankunft ein; „dort“ verdeutlicht den Bezug auf das genannte Ziel.
- source_word: וּמָשַׁחְתָּ
  choice: sollst du … salben
  rationale: Die Form setzt die Befehlsfolge fort und wird als verbindlicher Auftrag wiedergegeben.
- source_word: חֲזָאֵל
  choice: Hasaël
  rationale: Der Personenname wird in einer im Deutschen etablierten, vokalisch eindeutigen Form wiedergegeben.
- source_word: לְמֶלֶךְ עַל אֲרָם
  choice: zum König über Aram
  rationale: Die Wendung bezeichnet die Einsetzung Hasaëls in das Königsamt über Aram.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jahwe; Jehova
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. Die Transliteration „Yahweh“ bewahrt diesen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die doppelte Aufforderung „Geh, kehre … zurück“ bewahrt die Struktur des Hebräischen; die Satzteilung macht die Abfolge der Aufträge klar. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
