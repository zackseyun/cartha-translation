base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/003.yaml
  text: And he saw, and arose and went for his life, and came to Beersheba, which belongs to Judah, and left his servant there.
translation:
  language: de
  text: Als er das sah, stand er auf und floh um sein Leben. Er kam nach Beerscheba, das zu Juda gehört, und ließ seinen Diener dort zurück.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: Als er das sah
  rationale: Der masoretische Text lautet „er sah“. Im Deutschen stellt der temporale Anschluss den Zusammenhang natürlich her, ohne das Objekt ausdrücklich zu ergänzen.
- source_word: וַיֵּלֶךְ אֶל־נַפְשׁוֹ
  choice: lief um sein Leben
  rationale: Die Wendung bezeichnet hier, dass Elia sein Leben retten wollte; „lief“ gibt im Kontext die eilige Flucht idiomatisch wieder.
- source_word: בְּאֵר שֶׁבַע
  choice: Beerscheba
  rationale: Eingebürgerte deutsche Schreibung des Ortsnamens.
- source_word: נַעֲרוֹ
  choice: seinen Diener
  rationale: נַעַר kann „Junge“, „junger Mann“ oder „Diener“ bedeuten; hier bezeichnet es Elias Begleiter in dienender Funktion.
theological_decisions:
- issue: Lesart von וַיַּרְא gegenüber der überlieferten Variante „er fürchtete sich“
  choice: Als er das sah
  alternative: Da fürchtete er sich
  rationale: Die Übersetzung folgt dem vorgegebenen WLC-Konsonanten- und Vokaltext וַיַּרְא („er sah“) und übernimmt nicht die abweichende Lesart וַיִּירָא.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die polysyndetische hebräische Erzählweise wird zugunsten natürlicher deutscher Satzführung leicht geglättet; die Ortsangabe „das zu Juda gehört“ bleibt erhalten.
