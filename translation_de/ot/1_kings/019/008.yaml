base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/008.yaml
  text: So he arose and ate and drank[a], and went in the strength of that food forty days and forty nights to Horeb, the mountain of God.
translation:
  language: de
  text: Da stand er auf, aß und trank. Gestärkt durch diese Nahrung[a] ging er vierzig Tage und vierzig Nächte bis zum Horeb, dem Berg Gottes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in der Kraft jenes Essens“. Gemeint ist die Stärkung, die er durch das Gegessene erhielt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: Da stand er auf
  rationale: Das Qal-Wayyiqtol von קום führt die Erzählung fort. „Da stand er auf“ gibt sowohl die zeitliche Folge als auch die schlichte Erzählweise natürlich wieder.
- source_word: וַיֹּאכַל וַיִּשְׁתֶּה
  choice: aß und trank
  rationale: Die beiden einfachen Erzählverben werden knapp und idiomatisch wiedergegeben.
- source_word: וַיֵּלֶךְ
  choice: ging
  rationale: הלך bedeutet hier grundsätzlich „gehen“; Dauer und Ziel der Reise werden durch die folgenden Angaben ausgedrückt.
- source_word: בְּכֹחַ הָאֲכִילָה הַהִיא
  choice: Gestärkt durch diese Nahrung
  rationale: Die Wendung bezeichnet die Kraft beziehungsweise Stärkung, die Elija durch das zuvor Gegessene erhielt. Die Formulierung ist im Deutschen natürlich, ohne die Aussage weiter auszudeuten.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לַיְלָה
  choice: vierzig Tage und vierzig Nächte
  rationale: Dies ist die genaue und geläufige Wiedergabe der hebräischen Zeitangabe.
- source_word: עַד
  choice: bis zum
  rationale: עַד bezeichnet hier den Endpunkt des Weges und wird in Verbindung mit dem Ziel idiomatisch durch „bis zum“ wiedergegeben.
- source_word: הַר הָאֱלֹהִים
  choice: dem Berg Gottes
  rationale: Die hebräische Genitivverbindung wird formal und würdevoll bewahrt.
- source_word: חֹרֵב
  choice: Horeb
  rationale: Der Ortsname wird nach der etablierten deutschen biblischen Schreibweise wiedergegeben.
theological_decisions:
- issue: Bedeutung von הָאֱלֹהִים in הַר הָאֱלֹהִים
  choice: Gottes
  alternative: des Göttlichen
  rationale: In der festen Bezeichnung des Horeb ist der Gott Israels gemeint. „Berg Gottes“ wahrt den persönlichen Bezug und die biblische Ausdrucksweise, ohne zusätzliche Deutung einzutragen.
translation_notes:
  register: Moderne, klare und zugleich würdevolle Erzählsprache. Die knappe Abfolge der hebräischen Verben bleibt erhalten; die schwerfällige wörtliche Wendung zur Kraft des Essens wird im Haupttext idiomatisch wiedergegeben und in der Fußnote transparent gemacht.
