id: 1KI.19.14
reference: 1 Kings 19:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ קַנֹּ֨א קִנֵּ֜אתִי לַ/יהוָ֣ה אֱלֹהֵ֣י צְבָא֗וֹת כִּֽי עָזְב֤וּ בְרִֽיתְ/ךָ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶת מִזְבְּחֹתֶ֣י/ךָ הָרָ֔סוּ וְ/אֶת נְבִיאֶ֖י/ךָ הָרְג֣וּ בֶ/חָ֑רֶב וָ/אִוָּתֵ֤ר אֲנִי֙ לְ/בַדִּ֔/י וַ/יְבַקְשׁ֥וּ אֶת נַפְשִׁ֖/י לְ/קַחְתָּֽ/הּ׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/014.yaml
  text: And he said[a], “I have been very zealous for Yahweh, the God of hosts, because the sons of Israel have forsaken your covenant, torn down your altars, and killed your prophets with the sword. I alone am left, and they seek my life[b], to take it.”
translation:
  language: de
  text: 'Und er sagte: „Mit großem Eifer habe ich für Jahwe, den Gott der Heerscharen, geeifert[a]; denn die Israeliten[b] haben deinen Bund verlassen, deine Altäre niedergerissen und deine Propheten mit dem Schwert getötet. Ich allein bin übrig geblieben, und sie trachten mir nach dem Leben, um es mir zu nehmen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich bin mit äußerster Eifersucht für Jahwe eingetreten.“ Im Hebräischen verstärkt ein Infinitivus absolutus neben dem finiten Verb die Aussage.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Söhne Israels“. Gemeint ist das Volk Israel, daher hier idiomatisch „die Israeliten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַנֹּא קִנֵּאתִי
  choice: Mit großem Eifer habe ich … geeifert
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt die Aussage. Die deutsche Formulierung bewahrt sowohl diese Intensität als auch den Wortstamm des hebräischen Ausdrucks.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition bezeichnet hier die Ausrichtung von Elias Eifer; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: der Gott der Heerscharen
  rationale: „Heerscharen“ erhält die Weite des festen Gottestitels und legt nicht fest, ob himmlische oder irdische Heere gemeint sind.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet Elias Begründung ein; „denn“ ist im Deutschen natürlich und wahrt den erklärenden Zusammenhang.
- source_word: עָזְבוּ בְרִיתְךָ
  choice: haben deinen Bund verlassen
  rationale: עזב bedeutet „verlassen, aufgeben“. „Den Bund verlassen“ gibt den schweren Bundesbruch klar und ohne zusätzliche Deutung wieder.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die wörtliche Form lautet „die Söhne Israels“, fungiert hier jedoch als übliche Bezeichnung des Volkes; „die Israeliten“ ist im modernen Deutschen idiomatisch und schließt das ganze Volk ein.
- source_word: מִזְבְּחֹתֶיךָ הָרָסוּ
  choice: deine Altäre niedergerissen
  rationale: הרס bezeichnet das Einreißen oder Zerstören eines Bauwerks; „niedergerissen“ ist anschaulich und präzise.
- source_word: נְבִיאֶיךָ הָרְגוּ בֶחָרֶב
  choice: deine Propheten mit dem Schwert getötet
  rationale: Die Wendung bewahrt sowohl das Töten als auch das ausdrücklich genannte Tatmittel.
- source_word: וָאִוָּתֵר אֲנִי לְבַדִּי
  choice: Ich allein bin übrig geblieben
  rationale: Die Stellung von אֲנִי und לְבַדִּי hebt Elias behauptete völlige Isolation hervor; die deutsche Formulierung erhält diesen Nachdruck.
- source_word: וַיְבַקְשׁוּ אֶת נַפְשִׁי לְקַחְתָּהּ
  choice: sie trachten mir nach dem Leben, um es mir zu nehmen
  rationale: נפש bezeichnet in dieser festen Wendung das Leben, nicht eine vom Körper getrennte Seele. „Nach dem Leben trachten“ gibt die Tötungsabsicht idiomatisch wieder; der Zwecksatz bildet לְקַחְתָּהּ ausdrücklich ab.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Bundesnamen יהוה. „Jahwe“ macht diesen Eigennamen sichtbar, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von קנא in Elias Aussage
  choice: Eifer für Jahwe
  alternative: Eifersucht für Jahwe
  rationale: Das Verb kann Eifer oder Eifersucht bezeichnen. Im Zusammenhang beschreibt Elia seinen leidenschaftlichen Einsatz für die Bundestreue; „Eifer“ ist im Deutschen verständlicher, während die mögliche Nuance von „Eifersucht“ in der Fußnote erhalten bleibt.
- issue: Umfang von צְבָאוֹת im Gottestitel
  choice: Heerscharen
  alternative: Heere
  rationale: Der Ausdruck kann himmlische wie irdische Heere umfassen. „Heerscharen“ bewahrt diese Offenheit, statt den Bezug theologisch einzuengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt der hebräischen Abfolge, bleibt aber gut verständlich. Traditionell-biblische Ausdrücke wie „Heerscharen“ und „nach dem Leben trachten“ werden dort verwendet, wo sie präzise und im heutigen Deutsch noch geläufig sind.
