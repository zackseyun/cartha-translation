  text: וְ/הֽוּא הָלַ֤ךְ בַּ/מִּדְבָּר֙ דֶּ֣רֶךְ י֔וֹם וַ/יָּבֹ֕א וַ/יֵּ֕שֶׁב תַּ֖חַת רֹ֣תֶם אחת וַ/יִּשְׁאַ֤ל אֶת נַפְשׁ/וֹ֙ לָ/מ֔וּת וַ/יֹּ֣אמֶר רַ֗ב עַתָּ֤ה יְהוָה֙ קַ֣ח נַפְשִׁ֔/י כִּֽי לֹא ט֥וֹב אָנֹכִ֖י מֵ/אֲבֹתָֽ/י־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/004.yaml
  text: But he himself went a day's journey into the wilderness[a], and came and sat down under a broom tree. And he asked that he might die, and said, “It is enough; now, Yahweh, take my life[b], for I am no better than my fathers.”
translation:
  language: de
  text: 'Er selbst aber ging eine Tagesreise weit in die Wüste hinein. Er kam zu einem Ginsterstrauch[a] und setzte sich darunter. Dann bat er um den Tod und sagte: »Es ist genug! Nun, Jahwe, nimm mein Leben, denn ich bin nicht besser als meine Vorfahren.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ginsterbaum“. Das hebräische Wort bezeichnet eine größere Wüstenpflanze, die meist als Ginsterstrauch verstanden wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמִּדְבָּר דֶּרֶךְ יוֹם
  choice: eine Tagesreise weit in die Wüste hinein
  rationale: Die Formulierung gibt sowohl die Bewegung in die Wüste als auch die idiomatische Wegangabe דֶּרֶךְ יוֹם wieder.
- source_word: רֹתֶם אֶחָת
  choice: ein Ginsterstrauch
  rationale: רֹתֶם bezeichnet eine in der Wüste wachsende, ginsterartige Pflanze. Der deutsche Ausdruck ist verständlich und botanisch angemessener als „Baum“; אֶחָת wird als unbestimmter Singular natürlich wiedergegeben.
- source_word: וַיִּשְׁאַל אֶת־נַפְשׁוֹ לָמוּת
  choice: Dann bat er darum, sterben zu dürfen
  rationale: Die hebräische Wendung bezeichnet den Wunsch beziehungsweise die Bitte, selbst zu sterben. Die Übersetzung vermeidet ein missverständliches wörtliches „bat seine Seele zu sterben“.
- source_word: רַב עַתָּה
  choice: Es ist genug! Nun
  rationale: 'רַב ist hier ein dringlicher Ausruf: „Genug!“ beziehungsweise „Es ist genug!“ עַתָּה bleibt mit „Nun“ eigens erhalten.'
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: קַח נַפְשִׁי
  choice: nimm mein Leben
  rationale: נֶפֶשׁ meint in diesem Zusammenhang das Leben Elijas, das er im Tod von Gott genommen wissen will.
- source_word: כִּי לֹא טוֹב אָנֹכִי מֵאֲבֹתָי
  choice: denn ich bin nicht besser als meine Vorfahren
  rationale: Das מִן bildet den Vergleich „besser als“. „Vorfahren“ gibt אֲבֹתַי im heutigen Deutsch natürlich wieder, ohne den Bezug unnötig auf unmittelbare Väter einzuengen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im Hebräischen steht der persönliche Gottesname. „Jahwe“ bewahrt diese Eigennamefunktion; „der HERR“ wäre die traditionelle Ersatzlesung.
- issue: Bedeutung von נֶפֶשׁ in Elijas Todesbitte
  choice: Leben
  alternative: Seele
  rationale: Der unmittelbare Zusammenhang handelt von Elijas Wunsch zu sterben. „Leben“ gibt daher den kontextuellen Sinn wieder, ohne eine bestimmte Leib-Seele-Lehre in den Vers hineinzulesen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Kurze Sätze und der Ausruf „Es ist genug!“ bewahren die Erschöpfung und Dringlichkeit der Rede.
