  text: וַ/יִּקְבֹּ֨ץ מֶֽלֶךְ יִשְׂרָאֵ֥ל אֶֽת הַ/נְּבִיאִים֮ כְּ/אַרְבַּ֣ע מֵא֣וֹת אִישׁ֒ וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם הַ/אֵלֵ֞ךְ עַל רָמֹ֥ת גִּלְעָ֛ד לַ/מִּלְחָמָ֖ה אִם אֶחְדָּ֑ל וַ/יֹּאמְר֣וּ עֲלֵ֔ה וְ/יִתֵּ֥ן אֲדֹנָ֖/י בְּ/יַ֥ד הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/006.yaml
  text: Then the king of Israel gathered the prophets[a], about four hundred men, and said to them, “Should I go against Ramoth-gilead for battle, or should I refrain?” And they said, “Go up, and the Lord will give it into the hand of the king.”
translation:
  language: de
  text: 'Da versammelte der König von Israel die Propheten, etwa vierhundert Mann, und fragte sie: »Soll ich gegen Ramot in Gilead in den Krieg ziehen, oder soll ich davon absehen?« Sie antworteten: »Zieh hinauf! Der Herr[a] wird es in die Hand des Königs geben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mein Herr«. Das hebräische אֲדֹנָי kann hier auch so verstanden werden; im Zusammenhang ist jedoch die Gottesbezeichnung »der Herr« wahrscheinlicher.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: versammelte
  rationale: Das Qal von קבץ bezeichnet das Zusammenbringen von Personen; »versammelte« ist im Deutschen natürlich und präzise.
- source_word: הַנְּבִיאִים
  choice: die Propheten
  rationale: Die übliche und kontextgemäße Wiedergabe von נְבִיאִים.
- source_word: כְּאַרְבַּע מֵאוֹת אִישׁ
  choice: etwa vierhundert Mann
  rationale: Das Präfix כ kennzeichnet eine ungefähre Zahl; אִישׁ wird als kollektive Zählbezeichnung mit »Mann« wiedergegeben.
- source_word: הַאֵלֵךְ
  choice: Soll ich ... ziehen
  rationale: Die Fragepartikel mit dem Imperfekt der ersten Person drückt eine abwägende Anfrage aus; »Soll ich« bewahrt diesen beratenden Charakter.
- source_word: עַל רָמֹת גִּלְעָד לַמִּלְחָמָה
  choice: gegen Ramot in Gilead in den Krieg ziehen
  rationale: עַל bezeichnet hier das militärische Vorgehen gegen den Ort; לַמִּלְחָמָה nennt den Zweck. »Ramot in Gilead« ist eine verständliche Wiedergabe des Ortsnamens.
- source_word: אִם אֶחְדָּל
  choice: oder soll ich davon absehen
  rationale: חדל bedeutet aufhören, unterlassen oder Abstand nehmen; »davon absehen« passt natürlich zur erwogenen Kriegshandlung.
- source_word: עֲלֵה
  choice: Zieh hinauf
  rationale: Der Imperativ von עלה ist auch in militärischem Zusammenhang wörtlich »hinaufziehen«; die hebräische Bewegungsmetapher bleibt erhalten.
- source_word: אֲדֹנָי
  choice: der Herr
  rationale: Die masoretische Form wird hier am ehesten als Gottesbezeichnung verstanden, ohne sie mit dem Gottesnamen JHWH gleichzusetzen. Die mögliche Lesart »mein Herr« wird in einer Fußnote bewahrt.
- source_word: בְּיַד הַמֶּלֶךְ
  choice: in die Hand des Königs
  rationale: Die hebräische Wendung bezeichnet die Übergabe in jemandes Macht; die deutsche Form bewahrt das verständliche Bild.
theological_decisions:
- issue: Deutung von אֲדֹנָי in der Antwort der Propheten
  choice: der Herr
  alternative: mein Herr
  rationale: Im Kontext einer prophetischen Zusage ist die Deutung als Gottesbezeichnung wahrscheinlicher. Da die Form jedoch auch »mein Herr« bedeuten kann, wird diese echte sprachliche Möglichkeit nicht beseitigt, sondern in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die militärische Bewegungssprache »hinaufziehen« und das Bild »in die Hand geben« bleiben erhalten; unnötig altertümliche Satzformen werden vermieden.
