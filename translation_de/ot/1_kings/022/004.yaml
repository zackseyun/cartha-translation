  text: וַ/יֹּ֨אמֶר֙ אֶל יְה֣וֹשָׁפָ֔ט הֲ/תֵלֵ֥ךְ אִתִּ֛/י לַ/מִּלְחָמָ֖ה רָמֹ֣ת גִּלְעָ֑ד וַ/יֹּ֤אמֶר יְהֽוֹשָׁפָט֙ אֶל מֶ֣לֶךְ יִשְׂרָאֵ֔ל כָּמ֧וֹ/נִי כָמ֛וֹ/ךָ כְּ/עַמִּ֥/י כְ/עַמֶּ֖/ךָ כְּ/סוּסַ֥/י כְּ/סוּסֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/004.yaml
  text: And he said to Jehoshaphat[a], “Will you go with me to battle at Ramoth-gilead?” And Jehoshaphat said to the king of Israel, “I am as you are, my people as your people, my horses as your horses.”
translation:
  language: de
  text: 'Er sagte zu Joschafat: „Willst du mit mir zum Kampf nach Ramot-Gilead ziehen?“ Joschafat antwortete dem König von Israel: „Ich bin wie du, mein Volk wie dein Volk und meine Pferde wie deine Pferde.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Mein Volk ist wie dein Volk, und meine Pferde sind wie deine Pferde.“ Im Hebräischen steht hier eine knappe, verblose Erklärung der Solidarität und Bündnisbereitschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתֵלֵךְ
  choice: Willst du … ziehen?
  rationale: Die Fragepartikel mit dem Qal-Imperfekt der 2. Person Singular ergibt eine direkte Frage. Im Deutschen verbindet sich „ziehen“ natürlich mit dem Aufbruch zu einem Feldzug.
- source_word: אִתִּי
  choice: mit mir
  rationale: Die Begleitungsaussage mit Suffix der 1. Person Singular wird direkt wiedergegeben.
- source_word: לַמִּלְחָמָה
  choice: zum Kampf
  rationale: Die Wendung bezeichnet das Ziehen zu einer militärischen Auseinandersetzung. „Zum Kampf“ bewahrt den konkreten Sinn, ohne ihn zu „Krieg“ auszuweiten.
- source_word: רָמֹת גִּלְעָד
  choice: Ramot-Gilead
  rationale: Der zusammengesetzte Ortsname wird in einer geläufigen deutschen Transliteration mit Bindestrich wiedergegeben.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: dem König von Israel
  rationale: Die Status-constructus-Verbindung wird ihrem bestimmten Sinn im Kontext entsprechend wiedergegeben.
- source_word: כָּמוֹנִי כָמוֹךָ
  choice: Ich bin wie du
  rationale: Für den knappen hebräischen Nominalsatz wird im Deutschen „bin“ ergänzt; die vergleichende Parallelität bleibt erhalten.
- source_word: כְּעַמִּי כְעַמֶּךָ
  choice: mein Volk wie dein Volk
  rationale: Die knappe, verblose Vergleichsformulierung wird bewahrt und drückt Solidarität beziehungsweise Bündnisbereitschaft aus.
- source_word: כְּסוּסַי כְּסוּסֶיךָ
  choice: meine Pferde wie deine Pferde
  rationale: Das konkrete Substantiv „Pferde“ bleibt erhalten; „Reiterei“ oder „Streitkräfte“ würde die militärische Bedeutung stärker ausdeuten als der Wortlaut.
