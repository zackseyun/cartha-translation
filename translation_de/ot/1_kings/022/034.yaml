  text: וְ/אִ֗ישׁ מָשַׁ֤ךְ בַּ/קֶּ֨שֶׁת֙ לְ/תֻמּ֔/וֹ וַ/יַּכֶּה֙ אֶת מֶ֣לֶךְ יִשְׂרָאֵ֔ל בֵּ֥ין הַ/דְּבָקִ֖ים וּ/בֵ֣ין הַ/שִּׁרְיָ֑ן וַ/יֹּ֣אמֶר לְ/רַכָּב֗/וֹ הֲפֹ֥ךְ יָדְ/ךָ֛ וְ/הוֹצִיאֵ֥/נִי מִן הַֽ/מַּחֲנֶ֖ה כִּ֥י הָחֳלֵֽיתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/034.yaml
  text: But a man drew his bow at random and struck the king of Israel between the scale armor and the breastplate[a]. So he said to his charioteer, “Turn your hand and take me out of the camp[d][c][b], for I am wounded.”
translation:
  language: de
  text: 'Doch ein Mann spannte seinen Bogen aufs Geratewohl[a] und traf den König von Israel zwischen den Verbindungsstücken und dem Brustpanzer[b]. Da sagte der König zu seinem Wagenlenker: »Wende den Wagen[c] und bring mich aus dem Kampf heraus, denn ich bin verwundet[d].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann auch »in seiner Arglosigkeit« oder »ohne zu zielen« bedeuten; hier ist wahrscheinlich gemeint, dass der Schütze kein bestimmtes Ziel anvisierte.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »zwischen den debaqim und dem shirjon«. Gemeint ist vermutlich eine Lücke zwischen Teilen der Rüstung; die genaue Bedeutung der beiden Fachwörter ist unsicher.'
    reason: cultural_note
  - marker: c
    text: 'Wörtlich: »Wende deine Hand« – eine Aufforderung, den Streitwagen zu wenden oder aus dem Kampf zu lenken.'
    reason: lexical_alternative
  - marker: d
    text: Das hebräische Verb kann »krank sein« oder »verwundet sein« bedeuten; nach dem Pfeiltreffer ist hier eine Verwundung gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: Doch ein Mann
  rationale: 'Das einfache ו wird kontextgemäß adversativ wiedergegeben: Der unbekannte Schütze bewirkt trotz Ahabs Verkleidung die entscheidende Wendung.'
- source_word: מָשַׁךְ בַּקֶּשֶׁת
  choice: spannte seinen Bogen
  rationale: Natürliche deutsche Wiedergabe des hebräischen Ausdrucks für das Spannen beziehungsweise Ausziehen des Bogens.
- source_word: לְתֻמּוֹ
  choice: aufs Geratewohl
  rationale: Im Kampfzusammenhang bezeichnet der Ausdruck am ehesten einen Schuss ohne bewusst gewähltes Ziel; die mögliche Grundbedeutung »in seiner Arglosigkeit« wird in der Fußnote bewahrt.
- source_word: וַיַּכֶּה
  choice: und traf
  rationale: נכה bezeichnet hier zunächst den Treffer; die daraus folgende Verwundung wird am Versende ausdrücklich genannt.
- source_word: בֵּין הַדְּבָקִים וּבֵין הַשִּׁרְיָן
  choice: zwischen den Verbindungsstücken und dem Brustpanzer
  rationale: Die seltenen technischen Bezeichnungen meinen offenbar Teile der Rüstung und eine dazwischenliegende verwundbare Stelle. »Verbindungsstücke« wahrt den Bezug von דבק auf Verbundenes, ohne eine bestimmte Rüstungsbauart als sicher vorauszusetzen.
- source_word: לְרַכָּבוֹ
  choice: zu seinem Wagenlenker
  rationale: Gemeint ist der Lenker des Streitwagens, nicht der Wagen selbst.
- source_word: הֲפֹךְ יָדְךָ
  choice: Wende den Wagen
  rationale: Die wörtliche Wendung »Wende deine Hand« ist eine Anweisung zum Manövrieren. Im Deutschen macht die funktionale Wiedergabe die gemeinte Handlung verständlich.
- source_word: וְהוֹצִיאֵנִי מִן הַמַּחֲנֶה
  choice: und bring mich aus dem Kampf heraus
  rationale: מַחֲנֶה kann Lager, Heerlager oder Heer bezeichnen. In der laufenden Schlacht ist das Herausbringen aus dem Kampf beziehungsweise Kampfverband gemeint.
- source_word: כִּי הָחֳלֵיתִי
  choice: denn ich bin verwundet
  rationale: Das Verb kann »krank oder schwach werden« bedeuten, bezeichnet nach dem Pfeiltreffer hier aber eine Verwundung. Ein verstärkendes »schwer« steht nicht ausdrücklich im Ausgangstext.
theological_decisions:
- issue: Zusammenspiel von scheinbarem Zufall und der zuvor angekündigten Gerichtserfüllung
  choice: »aufs Geratewohl« beschreibt ausschließlich die fehlende gezielte Absicht des Schützen.
  alternative: Den Schuss ausdrücklich als göttlich gelenkt zu bezeichnen.
  rationale: Der Vers nennt die Perspektive des Schützen, erklärt aber in diesem Satz nicht ausdrücklich die göttliche Kausalität. Die erzählerische Spannung zum prophetischen Kontext bleibt dadurch bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Aufs Geratewohl« ist allgemein verständlich und erhält die erzählerische Ironie. Unsichere Rüstungsterminologie wird im Text lesbar, in der Fußnote aber ausdrücklich als unsicher gekennzeichnet. Die idiomatischen Wendungen für Wagenmanöver und Schlachtverband werden natürlich statt mechanisch wörtlich übersetzt.
