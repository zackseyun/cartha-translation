base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/013.yaml
  text: And the messenger who had gone to summon Micaiah spoke to him[a], saying, “Look now, the words of the prophets are with one mouth favorable to the king. Please let your word be like the word of one of them, and speak favorably.”
translation:
  language: de
  text: 'Der Bote, der Micha holen gegangen war, sagte zu ihm: »Sieh doch, die Propheten reden alle einmütig zugunsten des Königs.[a] Lass doch dein Wort dem Wort eines von ihnen gleichen und rede Gutes!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »mit einem Mund«; das bedeutet: einmütig oder übereinstimmend.'
    reason: Die Fußnote erläutert das hebräische Bild פֶּה אֶחָד, das im deutschen Haupttext idiomatisch mit „einmütig“ wiedergegeben ist.
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: der Bote
  rationale: Im Erzählzusammenhang ist ein menschlicher Abgesandter gemeint, der Micha holen soll; »Bote« ist daher sachlich und natürlich.
- source_word: לִקְרֹא
  choice: gerufen hatte
  rationale: Das Verb bedeutet grundsätzlich »rufen«. Im Kontext schließt die Formulierung den Auftrag ein, Micha zum König zu holen, ohne stärker als nötig zu konkretisieren.
- source_word: הִנֵּה נָא
  choice: Sieh doch
  rationale: »Sieh« gibt die aufmerksamkeitslenkende Funktion von הִנֵּה wieder; »doch« vermittelt den bittenden beziehungsweise drängenden Ton von נָא.
- source_word: דִּבְרֵי הַנְּבִיאִים
  choice: die Propheten reden
  rationale: Die deutsche verbale Formulierung gibt den Sinn von »die Worte der Propheten« natürlich wieder und verbindet sich klar mit der folgenden Wendung »wie aus einem Mund«.
- source_word: פֶּה אֶחָד
  choice: wie aus einem Mund
  rationale: Diese etablierte deutsche Redewendung bewahrt das hebräische Bild und bezeichnet einmütiges Reden.
- source_word: טוֹב אֶל הַמֶּלֶךְ
  choice: Gutes für den König
  rationale: Die Formulierung bleibt nahe bei טוֹב und lässt offen, ob vorteilhafte, zustimmende oder erfreuliche Aussagen gemeint sind.
- source_word: יְהִי נָא דבריך
  choice: Lass doch dein Wort
  rationale: Der Singular »dein Wort« bewahrt die hebräische Form und bezeichnet Michas zu erwartende Botschaft als Ganzes; »doch« erhält den bittenden Druck.
- source_word: כִּדְבַר אַחַד מֵהֶם
  choice: dem Wort eines von ihnen gleichen
  rationale: Die Wiedergabe erhält die singuläre Vergleichskonstruktion und den Aufruf, sich an die übrigen Propheten anzupassen.
- source_word: וְדִבַּרְתָּ טּוֹב
  choice: und rede Gutes
  rationale: Die relativ formnahe Wendung wahrt die Wiederaufnahme von טוֹב und die Spannung zwischen einer gewünschten positiven Aussage und wahrer prophetischer Rede.
theological_decisions:
- issue: Der Bote drängt Micha zur Übereinstimmung mit den anderen Propheten.
  choice: Die Aufforderung wird ohne wertende Ergänzung wiedergegeben.
  alternative: Die Rede ausdrücklich als Aufforderung zu einer falschen Prophezeiung kennzeichnen.
  rationale: Der Vers selbst berichtet den Anpassungsdruck, bewertet ihn hier aber nicht ausdrücklich. Die Übersetzung soll diese narrative und theologische Spannung nicht vorwegnehmend auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter, gut verständlicher Rede. Die wiederholte Bittepartikel נָא wird jeweils mit »doch« wiedergegeben. Das zweimalige טוֹב erscheint bewusst als »Gutes«, um die lexikalische Wiederholung und die Offenheit des Ausdrucks zu erhalten.
