  text: וַ/יֹּ֣אמֶר מִיכָ֔יְהוּ אִם שׁ֤וֹב תָּשׁוּב֙ בְּ/שָׁל֔וֹם לֹֽא דִבֶּ֥ר יְהוָ֖ה בִּ֑/י וַ/יֹּ֕אמֶר שִׁמְע֖וּ עַמִּ֥ים כֻּלָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/028.yaml
  text: And Micaiah said[a], “If you indeed return in peace, Yahweh has not spoken by me.” And he said, “Hear[b], all you peoples!”
translation:
  language: de
  text: 'Und Michaja sagte: „Wenn du wirklich wohlbehalten zurückkehrst, dann hat Jahwe nicht durch mich gesprochen.“ Und er sagte: „Hört, ihr Völker alle!“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Text sagt wörtlich: „Hört, ihr Völker alle!“ Der Plural „Völker“ richtet den Aufruf weit über eine einzelne Gruppe hinaus.'
    reason: cultural_note
lexical_decisions:
- source_word: מִיכָיְהוּ
  choice: Michaja
  rationale: Im Deutschen gebräuchliche biblische Namensform, die den hebräischen Personennamen angemessen wiedergibt.
- source_word: אִם שׁוֹב תָּשׁוּב
  choice: Wenn du wirklich … zurückkehrst
  rationale: Der Infinitivus absolutus mit der finiten Verbform verstärkt die Bedingung; „wirklich“ gibt diese Betonung in natürlichem Deutsch wieder.
- source_word: בְּשָׁלוֹם
  choice: wohlbehalten
  rationale: Im Kontext bezeichnet שָׁלוֹם eine unversehrte, sichere Rückkehr. „Wohlbehalten“ gibt den Sinn natürlicher wieder als die im Deutschen potenziell politisch verstandene Wendung „in Frieden“.
- source_word: לֹא דִבֶּר יְהוָה בִּי
  choice: dann hat Jahwe nicht durch mich gesprochen
  rationale: Die Präposition בְּ bezeichnet Michaja hier als prophetisches Sprachrohr; „durch mich“ ist idiomatisches Deutsch und bewahrt den instrumentalen Sinn.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text ausdrücklich stehende Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: שִׁמְעוּ
  choice: Hört es
  rationale: Der Imperativ ist ein öffentlicher Aufruf, die vorausgehende prophetische Aussage als Zeugnis zu hören und zu beachten; das ergänzte „es“ klingt im Deutschen natürlich.
- source_word: עַמִּים כֻּלָּם
  choice: ihr Völker alle
  rationale: Der Plural עַמִּים wird als „Völker“ erhalten; die Wortfolge bewahrt den breit gerichteten, feierlichen Aufruf.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname steht ausdrücklich im Ausgangstext; seine Wiedergabe als „Jahwe“ bewahrt den Charakter als Gottesname.
- issue: Sprecher des abschließenden וַיֹּאמֶר
  choice: Michaja bleibt der Sprecher
  alternative: Erzählerischer Einschub oder Wechsel des Sprechers
  rationale: Die einfachste syntaktische Fortführung bezieht das Verb weiterhin auf Michaja. Der Text nennt keinen neuen Sprecher.
- issue: Reichweite des abschließenden Aufrufs
  choice: „ihr Völker alle“ als breit gerichteter öffentlicher Zeugenaufruf
  alternative: „ihr alle“ als Ansprache nur der anwesenden Personen
  rationale: Der hebräische Plural עַמִּים bedeutet ausdrücklich „Völker“ und sollte nicht auf die unmittelbar Anwesenden verengt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die prophetische Entschiedenheit und die emphatische Bedingung bleiben erhalten; die Formulierung vermeidet unnötige Archaismen.
