source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ יְה֣וֹשָׁפָ֔ט הַ/אֵ֨ין פֹּ֥ה נָבִ֛יא לַ/יהוָ֖ה ע֑וֹד וְ/נִדְרְשָׁ֖ה מֵ/אוֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/007.yaml
  text: But Jehoshaphat said[a], “Is there not still here a prophet of Yahweh, that we may inquire of him?”
translation:
  language: de
  text: 'Doch Joschafat sagte: „Gibt es hier nicht noch[a] einen Propheten Jahwes, den wir befragen können?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gibt es hier nicht einen weiteren Propheten Jahwes?“'
    reason: Das hebräische עוֹד kann sowohl „noch“ im Sinn fortdauernder Verfügbarkeit als auch kontextbedingt „einen weiteren“ ausdrücken.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Doch … sagte
  rationale: Das narrative Waw führt die Erzählung fort; im Zusammenhang setzt Joschafats Einwand jedoch einen deutlichen Gegensatz zu den zuvor befragten Propheten, den „Doch“ im Deutschen natürlich wiedergibt.
- source_word: יְהוֹשָׁפָט
  choice: Joschafat
  rationale: Gebräuchliche deutsche Form des hebräischen Personennamens.
- source_word: הַאֵין
  choice: Gibt es … nicht
  rationale: Die Verbindung aus Fragepartikel und Negation formuliert eine Frage, die mit einer bestätigenden Antwort rechnet oder nach Bestätigung sucht.
- source_word: פֹּה
  choice: hier
  rationale: Natürliche und genaue Wiedergabe des Ortsadverbs.
- source_word: נָבִיא לַיהוָה
  choice: einen Propheten Jahwes
  rationale: Der Ausdruck bezeichnet einen Propheten, der zu Jahwe gehört beziehungsweise für ihn spricht; der deutsche Genitiv gibt diese Beziehung knapp und idiomatisch wieder.
- source_word: עוֹד
  choice: noch
  rationale: Das Wort bezeichnet hier wahrscheinlich einen zusätzlich oder weiterhin verfügbaren Propheten. „Noch“ bewahrt diese Bedeutungsbreite besser als das eindeutigere „einen weiteren“.
- source_word: וְנִדְרְשָׁה מֵאוֹתוֹ
  choice: bei dem wir nachfragen können
  rationale: Der Kohortativ drückt den Wunsch beziehungsweise Zweck gemeinsamer Befragung aus. „Bei ihm nachfragen“ gibt die hebräische Konstruktion mit מן natürlich wieder, ohne den Propheten selbst zur letzten Quelle der Offenbarung zu erklären.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Tetragrammaton; „Jahwe“ bewahrt den persönlichen Bundesnamen.
- issue: Wen Joschafat befragen will
  choice: bei dem wir nachfragen können
  alternative: durch den wir Jahwe befragen können
  rationale: Die alternative Fassung macht den Propheten ausdrücklich zum Vermittler einer Anfrage an Jahwe. Der masoretische Text nennt das Ziel der Befragung jedoch nicht nochmals ausdrücklich; die gewählte Formulierung bleibt näher an dieser Kürze, ohne die theologische Vermittlerrolle zu leugnen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Doch“ macht den Kontrast im Erzählzusammenhang deutlich; „bei dem wir nachfragen können“ ist allgemeinverständlich und bewahrt die knappe Ausdrucksweise des Hebräischen.
