source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוֹשָׁפָ֖ט אֶל מֶ֣לֶךְ יִשְׂרָאֵ֑ל דְּרָשׁ נָ֥א כַ/יּ֖וֹם אֶת דְּבַ֥ר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/005.yaml
  text: And Jehoshaphat said to the king of Israel[a], “Please inquire today for the word of Yahweh.”
translation:
  language: de
  text: 'Und Joschafat sagte zum König von Israel: „Bitte erkundige dich heute nach dem Wort Jahwes.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und … sagte
  rationale: Das Waw consecutivum führt die Erzählung weiter; „Und … sagte“ bewahrt den hebräischen Erzählungsanschluss in natürlichem Deutsch.
- source_word: יְהוֹשָׁפָט
  choice: Joschafat
  rationale: Der Personenname wird nach gängiger deutscher Bibeltradition wiedergegeben.
- source_word: אֶל מֶלֶךְ יִשְׂרָאֵל
  choice: zum König von Israel
  rationale: Die Präpositionalfügung und der Königstitel werden unmittelbar und idiomatisch wiedergegeben.
- source_word: דְּרָשׁ
  choice: befrage … nach
  rationale: דרש bezeichnet hier das Einholen göttlicher Auskunft. Die deutsche Konstruktion „jemanden nach etwas befragen“ gibt sowohl den Adressaten Jahwe als auch den erbetenen Offenbarungsbescheid klar wieder.
- source_word: נָא
  choice: doch
  rationale: Die Modalpartikel drückt eine höfliche bzw. eindringliche Bitte aus; „doch“ klingt im deutschen Imperativ natürlich und würdevoll.
- source_word: כַיּוֹם
  choice: heute
  rationale: Die Wendung hat hier zeitliche und leicht drängende Kraft; „heute“ bewahrt diese ohne Überinterpretation.
- source_word: אֶת דְּבַר יְהוָה
  choice: Jahwe nach seinem Wort
  rationale: Die deutsche Rektion von „befragen“ erfordert eine Umgestaltung. „Nach seinem Wort“ bewahrt דָּבָר als „Wort“ und macht deutlich, dass eine göttliche Auskunft erbeten wird.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als persönlicher Gottesname „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ bewahrt den persönlichen Gottesnamen, während „der HERR“ ihn durch einen traditionellen Ersatztitel wiedergibt.
- issue: Bezug von דְּרָשׁ und דְּבַר יְהוָה
  choice: Jahwe nach seinem Wort befragen
  alternative: das Wort Jahwes suchen
  rationale: Die gewählte Fassung versteht die Wendung als Bitte, Jahwe zu konsultieren, um eine Botschaft von ihm zu erhalten. Die Alternative ist formal möglich, im Deutschen jedoch weniger eindeutig und idiomatisch.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die höflich-eindringliche Partikel נָא wird unarchaisch mit „doch“ wiedergegeben; der Gottesname erscheint als „Jahwe“.
