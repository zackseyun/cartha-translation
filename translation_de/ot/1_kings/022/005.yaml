  naturalness: „Befrage ... Jahwe nach seinem Wort“ ist im modernen Standarddeutsch semantisch missverständlich. „Erkundige dich ... nach dem Wort Jahwes“ ist idiomatisch und wahrt den zurückhaltenden Charakter der Bitte.
