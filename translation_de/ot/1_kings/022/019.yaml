base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/019.yaml
  text: 'Then he said[a], “Therefore hear the word of Yahweh: I saw Yahweh sitting on his throne, and all the host of heaven standing by him[b], on his right and on his left.”'
translation:
  language: de
  text: 'Da sagte er: „Darum höre das Wort Jahwes: Ich sah Jahwe auf seinem Thron sitzen und das ganze Heer des Himmels[a] bei ihm stehen[b], zu seiner Rechten und zu seiner Linken.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die ganze himmlische Schar“ beziehungsweise „das ganze Himmelsheer“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „über ihm stehen“; im Zusammenhang ist wahrscheinlich gemeint, dass sie bei ihm, zu seiner Rechten und zu seiner Linken, stehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet den folgernden Übergang aus dem vorausgehenden Wortwechsel und bewahrt den Nachdruck der prophetischen Aufforderung.
- source_word: שְׁמַע
  choice: höre
  rationale: Der Imperativ Singular richtet sich unmittelbar an Ahab; „höre“ wahrt den knappen, feierlichen Ton der prophetischen Rede.
- source_word: דְּבַר יְהוָה
  choice: das Wort Jahwes
  rationale: Bewahrt die feste prophetische Formel und gibt den Gottesnamen als Eigennamen wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt das Tetragramm als den persönlichen Gottesnamen wieder, statt es durch einen Titel zu ersetzen.
- source_word: רָאִיתִי
  choice: Ich sah
  rationale: Das Präteritum gibt den Bericht über Michas Vision im Deutschen natürlich und unmittelbar wieder.
- source_word: יֹשֵׁב עַל כִּסְאוֹ
  choice: auf seinem Thron sitzen
  rationale: Die partizipiale Konstruktion schildert Jahwe in fortdauernder königlicher Haltung; die Infinitivkonstruktion nach „sah“ ist idiomatisches Deutsch.
- source_word: כָל צְבָא הַשָּׁמַיִם
  choice: das ganze Heer des Himmels
  rationale: Bewahrt die kollektive und möglicherweise militärische Bildsprache, ohne die bezeichneten Wesen vorschnell ausschließlich als Engel zu bestimmen.
- source_word: עֹמֵד עָלָיו
  choice: bei ihm stehen
  rationale: Im Thronsaalbild bezeichnet die Wendung am ehesten die Anwesenheit im Dienst vor beziehungsweise neben Jahwe; „bei ihm“ bleibt räumlich offen und passt zur anschließenden Verteilung rechts und links.
- source_word: מִימִינוֹ וּמִשְּׂמֹאלוֹ
  choice: zu seiner Rechten und zu seiner Linken
  rationale: Gibt die räumliche Symmetrie präzise wieder und entspricht einem würdigen, zugleich verständlichen deutschen Register.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה in der Thronsaalvision
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. Die Wiedergabe als Eigenname erhält die persönliche Benennung Gottes, ohne sie durch einen Hoheitstitel zu ersetzen.
- issue: Identität des „Heeres des Himmels“
  choice: Die umfassende Bildsprache bleibt erhalten
  alternative: alle Engel des Himmels
  rationale: Der Ausdruck bezeichnet die himmlische Schar beziehungsweise den himmlischen Hofstaat, legt in diesem Vers aber nicht ausdrücklich fest, dass ausschließlich Engel gemeint sind. Die Übersetzung vermeidet daher eine unnötige ontologische Präzisierung.
- issue: Räumliche Bedeutung von עָלָיו
  choice: bei ihm
  alternative: über ihm
  rationale: Die Grundbedeutung der Präposition kann räumlich „über“ lauten; im Zusammenhang mit dem Stehen zu Jahwes Rechten und Linken liegt jedoch die dienende Anwesenheit bei seinem Thron näher. Die Fußnote hält die wörtlichere Möglichkeit sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener prophetischer Formel. „Zu seiner Rechten und zu seiner Linken“ erhält den feierlichen Thronsaalton; die Fußnoten machen echte lexikalische Offenheiten sichtbar.
