  text: וַ/יֹּ֗אמֶר רָאִ֤יתִי אֶת כָּל יִשְׂרָאֵל֙ נְפֹצִ֣ים אֶל הֶ/הָרִ֔ים כַּ/צֹּ֕אן אֲשֶׁ֥ר אֵין לָ/הֶ֖ם רֹעֶ֑ה וַ/יֹּ֤אמֶר יְהוָה֙ לֹֽא אֲדֹנִ֣ים לָ/אֵ֔לֶּה יָשׁ֥וּבוּ אִישׁ לְ/בֵית֖/וֹ בְּ/שָׁלֽוֹם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/017.yaml
  text: And he said[a], “I saw all Israel scattered on the mountains, like sheep that have no shepherd. And Yahweh said, ‘These have no master[b]; let each man return to his house in peace.’”
translation:
  language: de
  text: 'Und er sagte: »Ich sah ganz Israel auf den Bergen zerstreut, wie Schafe, die keinen Hirten haben. Und Jahwe sagte: ›Diese haben keinen Herrn[a]. Jeder soll in Frieden in sein Haus zurückkehren[b].‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Diese haben keine Herren.« Die hebräische Form steht im Plural; im Zusammenhang geht es um Israel ohne sein regierendes Oberhaupt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Jeder soll in Frieden nach Hause zurückkehren.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְפֹצִים
  choice: zerstreut
  rationale: Das Partizip von פוץ bezeichnet ein Auseinandergetriebensein bzw. Verstreutsein und bewahrt hier das Bild eines führerlosen, aufgelösten Heeres.
- source_word: אֶל הֶהָרִים
  choice: über die Berge
  rationale: Bei einem Verb des Zerstreuens bezeichnet אֶל hier die räumliche Verteilung. „Über die Berge zerstreut“ ist im Deutschen natürlich und erhält zugleich die Bewegungsnuance der Präposition.
- source_word: כַּצֹּאן אֲשֶׁר אֵין לָהֶם רֹעֶה
  choice: wie Schafe, die keinen Hirten haben
  rationale: Die vertraute Bildrede wird unmittelbar wiedergegeben; צאן bezeichnet hier dem Kontext entsprechend Schafe.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֲדֹנִים
  choice: Herrn
  rationale: Die hebräische Form ist grammatisch pluralisch, kann hier aber die Herrschaftsinstanz bezeichnen; der Kontext weist auf den fehlenden König als Oberhaupt. Der Singular ist idiomatisches Deutsch, während eine Fußnote die formale Mehrzahl offenlegt.
- source_word: יָשׁוּבוּ אִישׁ לְבֵיתוֹ
  choice: Jeder soll in sein Haus zurückkehren
  rationale: Der Imperfekt hat auffordernden Sinn. אִישׁ wird distributiv mit „jeder“ wiedergegeben; „in sein Haus“ bleibt nah an der konkreten Formulierung des Hebräischen.
- source_word: בְּשָׁלוֹם
  choice: in Frieden
  rationale: Die feste Wendung bewahrt das breite Bedeutungsspektrum von שָׁלוֹם und die mögliche Spannung zwischen Niederlage und unbehelligter Heimkehr.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. „Jahwe“ erhält seinen Charakter als Eigenname.
- issue: Numerus und Bedeutung von אֲדֹנִים
  choice: keinen Herrn
  alternative: keine Herren
  rationale: Die Pluralform bleibt als echte formale Alternative in der Fußnote sichtbar. Im Zusammenhang meint die Aussage wahrscheinlich, dass Israel nach dem Tod des Königs ohne sein regierendes Oberhaupt ist; der deutsche Singular gibt dies idiomatisch wieder, ohne auf das stärker deutende „Anführer“ auszuweichen.
- issue: Distributives אִישׁ
  choice: Jeder
  alternative: jeder Mann
  rationale: אִישׁ dient hier in der festen distributiven Verbindung als Individualisierer. „Jeder“ bildet diese Funktion im Deutschen natürlich ab; die männliche Referenz innerhalb des Heeres ergibt sich aus dem Kontext und dem Possessivpronomen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Visionssprache und das Hirtenbild bleiben schlicht und anschaulich. „Herr“ bezeichnet hier den menschlichen Herrscher, nicht Gott; die mögliche Mehrzahl des hebräischen Ausdrucks wird in der Fußnote bewahrt.
