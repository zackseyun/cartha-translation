id: 1KI.22.12
reference: 1 Kings 22:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/כָל הַ/נְּבִאִ֔ים נִבְּאִ֥ים כֵּ֖ן לֵ/אמֹ֑ר עֲלֵ֞ה רָמֹ֤ת גִּלְעָד֙ וְ/הַצְלַ֔ח וְ/נָתַ֥ן יְהוָ֖ה בְּ/יַ֥ד הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/012.yaml
  text: And all the prophets were prophesying thus[a], saying, “Go up to Ramoth-gilead and succeed, and Yahweh will give it into the hand of the king.”
translation:
  language: de
  text: 'Und alle Propheten weißagten ebenso und sagten: »Zieh hinauf nach Ramot-Gilead und hab Erfolg! Jahwe wird es in die Hand des Königs geben.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כָל הַ/נְּבִאִים
  choice: Und alle Propheten
  rationale: Bewahrt die hebräische Koordination, die Gesamtheit und den bestimmten Ausdruck in natürlichem deutschem Erzählstil.
- source_word: נִבְּאִים
  choice: weissagten
  rationale: Das Partizip bezeichnet die in der Szene gleichzeitig stattfindende prophetische Rede. Das deutsche Präteritum gibt den fortlaufenden Vorgang im Erzählkontext natürlich wieder.
- source_word: כֵּן
  choice: ebenso
  rationale: Bezeichnet die übereinstimmende Art ihrer Aussage und knüpft an die vorausgehende Weissagung an.
- source_word: לֵ/אמֹר
  choice: und sagten
  rationale: Leitet wie das hebräische לֵאמֹר die direkte Rede ein; die koordinierte deutsche Form vermeidet eine schwerfällige Partizipialkonstruktion.
- source_word: עֲלֵה
  choice: Zieh hinauf
  rationale: Gibt die Grundbedeutung von עלה wieder und lässt den militärischen Zusammenhang implizit, wie im Hebräischen.
- source_word: רָמֹת גִּלְעָד
  choice: Ramot-Gilead
  rationale: Gebräuchliche deutsche Umschrift des zusammengesetzten Ortsnamens.
- source_word: וְ/הַצְלַח
  choice: und hab Erfolg
  rationale: Das Hifil von צלח bezeichnet hier das erfolgreiche Gelingen des Vorhabens; die Formulierung ist modern und verständlich.
- source_word: וְ/נָתַן
  choice: Jahwe wird es ... geben
  rationale: Das Waw plus Perfekt wird im Zusammenhang als zugesagte zukünftige Folge wiedergegeben. Das Objekt »es« wird aus dem Ortsnamen beziehungsweise dem bevorstehenden Unternehmen erschlossen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: בְּ/יַד הַ/מֶּלֶךְ
  choice: in die Hand des Königs
  rationale: Bewahrt das verständliche hebräische Bild für die Übergabe in die Gewalt oder Verfügungsgewalt des Königs.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich; »Jahwe« wahrt seinen Charakter als Eigenname.
- issue: Status der prophetischen Zusage
  choice: Die Rede wird ohne bestätigenden Erzählerkommentar wiedergegeben
  alternative: Kennzeichnung als wahre oder falsche Weissagung
  rationale: Der Vers berichtet lediglich, was sämtliche Propheten sagten. Seine theologische Bewertung ergibt sich aus dem weiteren Kontext und wird hier nicht vorweggenommen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und eindringlich; »weissagten« bewahrt den prophetischen Charakter, während »hab Erfolg« allgemein verständlich ist.
