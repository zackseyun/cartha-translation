  naturalness: 'Die Formulierung ist insgesamt klares, würdiges modernes Standarddeutsch. Eine orthografische Anpassung ist jedoch nötig: Im bundesdeutschen standardsprachlichen Satz lautet die Schreibung „weißagten“, nicht „weissagten“.'
