lexical_decisions:
- source_word: וַיְהִי
  choice: Im dritten Jahr
  rationale: Die narrative Einleitungsformel wird im Deutschen natürlich durch die vorangestellte Zeitangabe wiedergegeben; ein wörtliches „Und es geschah“ wäre hier unnötig schwerfällig.
- source_word: בַּשָּׁנָה הַשְּׁלִישִׁית
  choice: im dritten Jahr
  rationale: Die Formulierung bewahrt Ordinalzahl und Bestimmtheit der hebräischen Zeitangabe.
- source_word: וַיֵּרֶד
  choice: zog … hinab
  rationale: Das Verb ירד bezeichnet eine Bewegung nach unten. „zog … hinab“ klingt in deutscher Erzählprosa natürlich und erhält zugleich die mögliche geografische Richtungsangabe.
- source_word: יְהוֹשָׁפָט
  choice: Joschafat
  rationale: Der Personenname folgt der im modernen deutschen Bibelgebrauch etablierten Form.
- source_word: מֶלֶךְ יְהוּדָה
  choice: der König von Juda
  rationale: Die Apposition gibt Joschafats Amt klar und idiomatisch wieder.
- source_word: אֶל מֶלֶךְ יִשְׂרָאֵל
  choice: zum König von Israel
  rationale: Die Präposition אֶל bezeichnet die Bewegung auf eine Person zu; „zum König von Israel“ ist direkt und natürlich.
