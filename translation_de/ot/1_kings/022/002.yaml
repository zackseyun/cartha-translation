  footnotes:
  - marker: a
    text: 'Oder: „reiste zum König von Israel“. Das hebräische Verb bedeutet wörtlich „hinabgehen“ und kann sowohl die geografische Höhenlage als auch einfach eine Reise bezeichnen.'
