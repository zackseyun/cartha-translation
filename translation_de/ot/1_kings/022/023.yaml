source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִנֵּ֨ה נָתַ֤ן יְהוָה֙ ר֣וּחַ שֶׁ֔קֶר בְּ/פִ֖י כָּל נְבִיאֶ֣י/ךָ אֵ֑לֶּה וַֽ/יהוָ֔ה דִּבֶּ֥ר עָלֶ֖י/ךָ רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/023.yaml
  text: And now[a], behold, Yahweh has put a lying spirit in the mouth of all these prophets of yours[b], and Yahweh has spoken disaster against you.
translation:
  language: de
  text: 'Und nun sieh: Jahwe hat allen diesen deinen Propheten einen Lügengeist[a] in den Mund gelegt, und Jahwe hat Unheil[b] über dich ausgesprochen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: einen Geist der Falschheit.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: Unglück. Das hebräische Wort bezeichnet hier Unheil im Zusammenhang mit dem angekündigten Gericht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl die fortführende Konjunktion als auch die unmittelbare zeitliche und deiktische Funktion.
- source_word: הִנֵּה
  choice: sieh
  rationale: Lenkt nachdrücklich die Aufmerksamkeit auf die folgende Aussage und klingt im modernen Deutschen natürlicher als „siehe“, ohne den feierlichen Ton aufzugeben.
- source_word: נָתַן
  choice: hat … in den Mund gelegt
  rationale: Die deutsche Wendung gibt die Verbindung des Verbs mit „Geist“ und „Mund“ idiomatisch und zugleich quellenah wieder; sie schwächt die ausgesagte göttliche Handlung nicht zu bloßer Zulassung ab.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen als Eigennamen wieder.
- source_word: רוּחַ שֶׁקֶר
  choice: einen Lügengeist
  rationale: Die knappe deutsche Zusammensetzung bewahrt sowohl den personalen Charakter von רוּחַ als auch dessen Kennzeichnung durch Lüge beziehungsweise Falschheit.
- source_word: בְּפִי
  choice: in den Mund
  rationale: Der hebräische Singular wird distributiv auf die Prophetengruppe bezogen; die deutsche feste Wendung „jemandem etwas in den Mund legen“ bildet dies natürlich ab.
- source_word: כָּל נְבִיאֶיךָ אֵלֶּה
  choice: all deinen Propheten hier
  rationale: „Deinen“ erhält die Anrede an Ahab; „hier“ gibt die hinweisende Kraft von אֵלֶּה in natürlichem modernem Deutsch wieder.
- source_word: דִּבֶּר עָלֶיךָ רָעָה
  choice: hat Unheil über dich ausgesprochen
  rationale: „Unheil“ bezeichnet hier drohendes Gericht, nicht moralische Bosheit. „Über dich ausgesprochen“ bewahrt die sprachliche Handlung und die gegen den Angeredeten gerichtete Aussage.
theological_decisions:
- issue: Gottes Handeln in Bezug auf den Lügengeist
  choice: Jahwe hat … einen Lügengeist … in den Mund gelegt
  alternative: Jahwe hat einen Lügengeist zugelassen
  rationale: נָתַן bezeichnet unmittelbar Gottes Handeln. Die Übersetzung erhält die theologische Spannung und deutet die Aussage nicht abschwächend als bloße Erlaubnis.
- issue: Bedeutung von רָעָה als Gegenstand des göttlichen Ausspruchs
  choice: Unheil
  alternative: Böses; Unglück
  rationale: Im Gerichtszusammenhang bezeichnet רָעָה drohendes schädigendes Geschehen. „Unheil“ bewahrt die Härte der Aussage, ohne Jahwe moralische Bosheit zuzuschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sieh“ erhält den prophetischen Aufmerksamkeitsruf in gegenwärtiger Sprache; „all deinen Propheten hier“ vermittelt die demonstrative Zuspitzung natürlicher als die steife Formulierung „all diesen deinen Propheten“.
