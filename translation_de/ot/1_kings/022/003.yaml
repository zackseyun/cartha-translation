  text: וַ/יֹּ֤אמֶר מֶֽלֶךְ יִשְׂרָאֵל֙ אֶל עֲבָדָ֔י/ו הַ/יְדַעְתֶּ֕ם כִּֽי לָ֖/נוּ רָמֹ֣ת גִּלְעָ֑ד וַ/אֲנַ֣חְנוּ מַחְשִׁ֔ים מִ/קַּ֣חַת אֹתָ֔/הּ מִ/יַּ֖ד מֶ֥לֶךְ אֲרָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/003.yaml
  text: And the king of Israel said to his servants[a], “Do you know that Ramoth-gilead belongs to us[b], yet we are doing nothing to take it from the hand of the king of Aram?”
translation:
  language: de
  text: 'Und der König von Israel sagte zu seinen Dienern: „Wisst ihr, dass Ramot-Gilead uns gehört? Doch wir tun nichts, um es aus der Hand des Königs von Aram zu nehmen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲבָדָיו
  choice: seinen Dienern
  rationale: עֶבֶד kann im königlichen Umfeld Diener, Gefolgsleute oder Amtsträger bezeichnen. „Diener“ bewahrt die hebräische Ausdrucksweise, ohne einen bestimmten Amtsrang vorauszusetzen.
- source_word: הַיְדַעְתֶּם
  choice: Wisst ihr
  rationale: Die Frage appelliert rhetorisch an gemeinsames Wissen. Da im Hebräischen keine Verneinung steht, wird keine ergänzt.
- source_word: כִּי לָנוּ רָמֹת גִּלְעָד
  choice: dass Ramot-Gilead uns gehört
  rationale: לָנוּ drückt hier einen Besitz- beziehungsweise Gebietsanspruch aus; „uns gehört“ gibt dies knapp und natürlich wieder.
- source_word: רָמֹת גִּלְעָד
  choice: Ramot-Gilead
  rationale: Der Ortsname wird nach dem Hebräischen transliteriert und als zusammengesetzter Name mit Bindestrich geschrieben.
- source_word: מַחְשִׁים
  choice: wir tun nichts
  rationale: Das Partizip bezeichnet wörtlich ein Schweigen oder Stillhalten; im Zusammenhang ist damit vorwurfsvolle Untätigkeit gemeint. „Wir tun nichts“ vermittelt diese idiomatische Bedeutung klar.
- source_word: מִקַּחַת אֹתָהּ
  choice: um es … zu entreißen
  rationale: Die Infinitivkonstruktion bezeichnet die unterlassene Rücknahme der Stadt. „Entreißen“ verbindet die Handlung natürlich mit der folgenden Wendung „der Hand des Königs“ und macht die gewaltsame Rückgewinnung deutlich.
- source_word: מִיַּד
  choice: der Hand … zu entreißen
  rationale: Die hebräische Wendung bezeichnet Macht, Besitz oder Kontrolle. Die deutsche Form bewahrt das Bild der Hand und bleibt idiomatisch verständlich.
- source_word: אֲרָם
  choice: Aram
  rationale: Der hebräische Volks- und Landesname wird transliteriert und nicht durch die spätere Bezeichnung „Syrien“ ersetzt.
