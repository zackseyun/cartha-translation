  source_fidelity: 'Die Übersetzung gibt die beiden hebräischen Nominalsätze präzise wieder: In Edom gab es keinen König, während ein נִצָּב als König bezeichnet wird. „Statthalter“ ist in diesem politischen Kontext eine gut vertretbare idiomatische Wiedergabe und bewahrt die knappe, spannungsvolle Prädikation „… war König“ ohne sie zu harmonisieren.'
  naturalness: „Und in Edom gab es keinen König; ein Statthalter war König“ ist knapp, verständlich und in modernem Standarddeutsch angemessen. Das Semikolon gliedert die beiden Satzteile natürlich.
  terminology: „König“ entspricht מֶלֶךְ konsequent. „Statthalter“ ist für נִצָּב kontextuell passend; die Fußnote nennt weniger spezifische Alternativen und erläutert den Grundgedanken des Eingesetzt- bzw. Bestelltseins. Weder der Text noch die Anmerkung legen eine übermäßig präzise Amtsbezeichnung fest.
