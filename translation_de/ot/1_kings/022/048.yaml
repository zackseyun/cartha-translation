  text: וּ/מֶ֥לֶךְ אֵ֛ין בֶּ/אֱד֖וֹם נִצָּ֥ב מֶֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/048.yaml
  text: And there was no king in Edom[a]; a deputy was king.
translation:
  language: de
  text: Und in Edom gab es keinen König; ein Statthalter[a] war König.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Beauftragter“ beziehungsweise „ein eingesetzter Amtsträger“. Das hebräische Wort bezeichnet wörtlich jemanden, der eingesetzt oder bestellt ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מֶלֶךְ
  choice: Und … König
  rationale: Die Konjunktion ו führt die Aussage im Erzählzusammenhang weiter; מֶלֶךְ wird unmittelbar mit „König“ wiedergegeben.
- source_word: אֵין
  choice: gab es keinen
  rationale: אֵין bezeichnet das Nichtvorhandensein; im historischen Erzählzusammenhang ist die deutsche Vergangenheitsform angemessen.
- source_word: בֶּ/אֱדוֹם
  choice: in Edom
  rationale: Die Präposition ב mit dem Ortsnamen wird am einfachsten lokal verstanden.
- source_word: נִצָּב
  choice: Statthalter
  rationale: Das Partizip bezeichnet wörtlich einen Eingesetzten oder Bestellten und hier wahrscheinlich einen von einer übergeordneten Macht eingesetzten Amtsträger. „Statthalter“ gibt diese politische Funktion natürlich wieder, ohne einen unabhängigen erblichen König vorauszusetzen.
- source_word: מֶלֶךְ
  choice: war König
  rationale: Das abschließende מֶלֶךְ steht prädikativ zu נִצָּב. Die knappe Wiedergabe bewahrt die auffällige Spannung des Hebräischen zwischen dem fehlenden König und dem als König bezeichneten Statthalter.
theological_decisions:
- issue: Verhältnis zwischen dem fehlenden König und dem eingesetzten Amtsträger
  choice: Die Spannung bleibt in der Formulierung „ein Statthalter war König“ erhalten.
  alternative: „Ein Statthalter regierte anstelle eines Königs.“
  rationale: Die Alternative erklärt den politischen Sachverhalt deutlicher, löst aber die knappe und möglicherweise bewusst paradoxe hebräische Formulierung interpretierend auf.
translation_notes:
  register: Knappe, würdige moderne Standardsprache. Das Semikolon bildet die Zweiteiligkeit des hebräischen Satzes ab. „Statthalter“ ist allgemein verständlich; die Fußnote bewahrt die lexikalische Breite von נִצָּב.
