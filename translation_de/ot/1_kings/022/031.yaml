base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/031.yaml
  text: The king of Aram had commanded the thirty-two chariot commanders who belonged to him[a], saying, “Do not fight with either small or great[c][b], but only with the king of Israel alone.”
translation:
  language: de
  text: 'Der König von Aram hatte den zweiunddreißig Befehlshabern seiner Streitwagen befohlen: »Kämpft gegen niemanden, weder gegen Geringe noch gegen Große[a], sondern allein gegen den König von Israel.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Kämpft weder gegen Geringe noch gegen Große, sondern allein gegen den König von Israel.« Die Wendung »Geringe und Große« bezeichnet Menschen jeden Ranges oder Standes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֶלֶךְ אֲרָם
  choice: Der König von Aram
  rationale: Der Anschluss mit ו wird im deutschen Erzählfluss nicht eigens wiedergegeben. אֲרָם bleibt als ursprünglicher Ortsname »Aram« erhalten und wird nicht traditionell mit »Syrien« übersetzt.
- source_word: צִוָּה
  choice: hatte … befohlen
  rationale: Das Plusquamperfekt kennzeichnet den Befehl als Hintergrundhandlung vor dem folgenden Kampfgeschehen.
- source_word: שָׂרֵי הָרֶכֶב אֲשֶׁר לוֹ
  choice: den … Befehlshabern seiner Streitwagen
  rationale: שָׂרֵי bezeichnet militärische Führer; הָרֶכֶב ist hier die Streitwagenmacht. Das Possessiv »seiner« gibt אֲשֶׁר לוֹ knapp und natürlich wieder.
- source_word: שְׁלֹשִׁים וּשְׁנַיִם
  choice: zweiunddreißig
  rationale: Direkte Wiedergabe der Kardinalzahl.
- source_word: לֵאמֹר
  choice: Doppelpunkt vor der direkten Rede
  rationale: Die hebräische Einleitungsformel wird im natürlichen modernen Deutsch typografisch durch den Doppelpunkt wiedergegeben.
- source_word: לֹא תִּלָּחֲמוּ אֶת קָטֹן וְאֶת גָּדוֹל
  choice: Kämpft gegen niemanden, weder gegen Geringe noch gegen Große
  rationale: »Geringe« und »Große« bewahrt den Rang- und Statusgegensatz des hebräischen Idioms; »niemanden« macht dessen umfassenden Sinn im Deutschen deutlich.
- source_word: כִּי אִם
  choice: sondern
  rationale: Nach der Verneinung markiert die Konstruktion eine ausschließende Ausnahme; »sondern« gibt diesen Gegensatz idiomatisch wieder.
- source_word: אֶת מֶלֶךְ יִשְׂרָאֵל לְבַדּוֹ
  choice: allein gegen den König von Israel
  rationale: »gegen« verdeutlicht das feindliche Kämpfen; »allein« erhält die nachdrückliche Ausschließlichkeit von לְבַדּוֹ.
