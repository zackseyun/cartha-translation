id: 1KI.22.52
reference: 1 Kings 22:52
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֲחַזְיָ֣הוּ בֶן אַחְאָ֗ב מָלַ֤ךְ עַל יִשְׂרָאֵל֙ בְּ/שֹׁ֣מְר֔וֹן בִּ/שְׁנַת֙ שְׁבַ֣ע עֶשְׂרֵ֔ה לִ/יהוֹשָׁפָ֖ט מֶ֣לֶךְ יְהוּדָ֑ה וַ/יִּמְלֹ֥ךְ עַל יִשְׂרָאֵ֖ל שְׁנָתָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/052.yaml
  text: Ahaziah son of Ahab became king over Israel in Samaria in the seventeenth year of Jehoshaphat king of Judah, and he reigned over Israel two years.
translation:
  language: de
  text: Ahasja, der Sohn Ahabs, wurde im siebzehnten Regierungsjahr Joschafats, des Königs von Juda, in Samaria König über Israel. Er regierte zwei Jahre über Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָלַךְ
  choice: wurde … König
  rationale: Das Qatal bezeichnet hier Ahasjas Thronbesteigung. „Wurde König“ gibt den Beginn seiner Herrschaft im Deutschen natürlich und präzise wieder.
- source_word: עַל יִשְׂרָאֵל
  choice: über Israel
  rationale: עַל bezeichnet in Verbindung mit מלך den Herrschaftsbereich.
- source_word: בְּשֹׁמְרוֹן
  choice: in Samaria
  rationale: Die Präposition ב bezeichnet hier den Ort der Königsherrschaft beziehungsweise den Regierungssitz.
- source_word: בִּשְׁנַת שְׁבַע עֶשְׂרֵה לִיהוֹשָׁפָט
  choice: im siebzehnten Regierungsjahr Joschafats
  rationale: Die übliche Königsjahrformel wird mit „Regierungsjahr“ verdeutlicht; der Bezug auf Joschafat wird idiomatisch durch den Genitiv ausgedrückt.
- source_word: וַיִּמְלֹךְ
  choice: Er regierte
  rationale: Nach der Nachricht von der Thronbesteigung fasst das Verb zusammen mit der Zeitangabe die Dauer seiner Herrschaft zusammen.
- source_word: שְׁנָתָיִם
  choice: zwei Jahre
  rationale: Die Dualform bezeichnet eine Dauer von zwei Jahren.
- source_word: אֲחַזְיָהוּ בֶן אַחְאָב
  choice: Ahasja, der Sohn Ahabs
  rationale: Die Namen folgen geläufigen deutschen Bibelnamensformen; die Abstammungsangabe bleibt ausdrücklich erhalten.
- source_word: מֶלֶךְ יְהוּדָה
  choice: des Königs von Juda
  rationale: Die Apposition identifiziert Joschafat als König von Juda und fügt sich im Deutschen natürlich in die Datierungsformel ein.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Wiederholung „über Israel“ bleibt erhalten, weil sie die hebräische Struktur und den Herrschaftsbereich in beiden Aussagen betont. Der Vers wurde zur besseren deutschen Lesbarkeit in zwei Sätze gegliedert.
