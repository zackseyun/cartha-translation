  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ הַ/מֶּ֔לֶךְ עַד כַּ/מֶּ֥ה פְעָמִ֖ים אֲנִ֣י מַשְׁבִּעֶ֑/ךָ אֲ֠שֶׁר לֹֽא תְדַבֵּ֥ר אֵלַ֛/י רַק אֱמֶ֖ת בְּ/שֵׁ֥ם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/016.yaml
  text: Then the king said to him[a], “How many times must I make you swear that you tell me nothing but the truth in the name of Yahweh?”
translation:
  language: de
  text: 'Da sagte der König zu ihm: „Wie oft muss ich dich noch unter Eid stellen[a], damit du mir im Namen Jahwes nichts als die Wahrheit sagst?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dich noch schwören lassen“. Das hebräische Verb bedeutet, jemanden schwören zu lassen oder unter Eid zu stellen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das narrative וַ־ führt die Handlung weiter; „Da“ gibt die zeitliche Folge in natürlichem Deutsch wieder.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Die bestimmte Amtsbezeichnung wird direkt wiedergegeben; der hebräische Text nennt hier keinen Eigennamen.
- source_word: עַד כַּמֶּה פְעָמִים
  choice: Wie oft ... noch
  rationale: Die Wendung ist eine ungeduldige rhetorische Frage. „Wie oft ... noch“ ist idiomatisches Deutsch und bewahrt den Ausdruck wiederholter Verärgerung.
- source_word: מַשְׁבִּעֶךָ
  choice: muss ich dich ... unter Eid stellen
  rationale: Der Hifil von שׁבע bedeutet, jemanden schwören zu lassen beziehungsweise unter Eid zu stellen. Die gewählte Formulierung ist modern und erhält den rechtlich-feierlichen Charakter.
- source_word: אֲשֶׁר לֹא תְדַבֵּר אֵלַי רַק אֱמֶת
  choice: damit du mir ... nichts als die Wahrheit sagst
  rationale: Die hebräische Konstruktion lautet wörtlich sinngemäß „dass du nicht zu mir redest außer Wahrheit“. Die deutsche Wendung bewahrt die Ausschließlichkeit und ist zugleich natürlich.
- source_word: בְּשֵׁם יְהוָה
  choice: im Namen Jahwes
  rationale: בְּשֵׁם bezeichnet das Reden unter Berufung auf den Namen und die Autorität Gottes; der im Ausgangstext stehende Gottesname wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Gottesnamen in der im Deutschen üblichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug des Eides
  choice: Der König stellt Micha unter Eid, damit er wahrheitsgemäß im Namen Jahwes redet.
  alternative: Der König fordert lediglich eine allgemeine wahrheitsgemäße Aussage.
  rationale: מַשְׁבִּיעֶךָ bezeichnet ausdrücklich das Unter-Eid-Stellen, und בְּשֵׁם יְהוָה bindet die verlangte Aussage an Jahwes Namen. Die Übersetzung erhält beide Elemente, ohne die Spannung zur vorangehenden ironischen Antwort aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Ungeduld des Königs wird durch „Wie oft ... noch“ ausgedrückt. „Nichts als die Wahrheit“ ist idiomatisch, ohne den ausschließenden Sinn des Hebräischen abzuschwächen.
