source:
  edition: WLC
  text: וִ/יהֽוֹשָׁפָט֙ בֶּן אָסָ֔א מָלַ֖ךְ עַל יְהוּדָ֑ה בִּ/שְׁנַ֣ת אַרְבַּ֔ע לְ/אַחְאָ֖ב מֶ֥לֶךְ יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/041.yaml
  text: And Jehoshaphat son of Asa became king over Judah in the fourth year of Ahab king of Israel.
translation:
  language: de
  text: Und Joschafat, der Sohn Asas, wurde im vierten Jahr Ahabs, des Königs von Israel, König über Juda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וִיהוֹשָׁפָט
  choice: Und Joschafat
  rationale: Das ו stellt die Verbindung zum vorausgehenden Erzählzusammenhang her und wird mit „Und“ wiedergegeben. Der Personenname folgt der im Deutschen etablierten biblischen Form „Joschafat“.
- source_word: בֶּן אָסָא
  choice: der Sohn Asas
  rationale: Die Status-constructus-Verbindung bezeichnet Joschafats Abstammung. „Der Sohn Asas“ ist im Deutschen natürlich und eindeutig.
- source_word: מָלַךְ
  choice: wurde … König
  rationale: Das Qal-Perfekt bezeichnet hier im Rahmen der synchronistischen Regierungsnotiz den Herrschaftsantritt; „wurde König“ gibt diesen ingressiven Sinn präziser wieder als „regierte“.
- source_word: עַל יְהוּדָה
  choice: König über Juda
  rationale: עַל bezeichnet bei מלך den Herrschaftsbereich. Die Formulierung „König über Juda“ wahrt diese Beziehung in natürlichem Deutsch.
- source_word: בִּשְׁנַת אַרְבַּע
  choice: im vierten Jahr
  rationale: Dies ist die übliche deutsche Wiedergabe der königlichen Datierungsformel; ein Zusatz wie „Regierungsjahr“ ist aus dem Zusammenhang erschließbar.
- source_word: לְאַחְאָב
  choice: Ahabs
  rationale: Das ל bezieht die Jahresangabe auf Ahabs Regierung. Der deutsche Genitiv drückt diese Zuordnung knapp und idiomatisch aus.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: des Königs von Israel
  rationale: Die Apposition identifiziert Ahab durch seinen Königstitel. Im Deutschen ist die bestimmte Form innerhalb dieser Apposition natürlich.
