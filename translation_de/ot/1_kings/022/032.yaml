  text: וַ/יְהִ֡י כִּ/רְאוֹת֩ שָׂרֵ֨י הָ/רֶ֜כֶב אֶת יְהוֹשָׁפָ֗ט וְ/הֵ֤מָּה אָֽמְרוּ֙ אַ֣ךְ מֶֽלֶךְ יִשְׂרָאֵ֣ל ה֔וּא וַ/יָּסֻ֥רוּ עָלָ֖י/ו לְ/הִלָּחֵ֑ם וַ/יִּזְעַ֖ק יְהוֹשָׁפָֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/032.yaml
  text: And it happened[a], when the commanders of the chariots saw Jehoshaphat, that they said, “Surely he is the king of Israel.” So they turned aside against him to fight[b], but Jehoshaphat cried out.
translation:
  language: de
  text: 'Als die Befehlshaber der Streitwagen Joschafat sahen, sagten sie: »Das ist gewiss der König von Israel!« Da wandten sie sich gegen ihn, um gegen ihn zu kämpfen. Joschafat aber schrie.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: Als … sahen
  rationale: Die zeitliche Konstruktion wird im modernen deutschen Erzählstil natürlich mit einem temporalen Nebensatz wiedergegeben; ein zusätzliches »Und es geschah« wäre hier schwerfällig und fügte keinen eigenen Sachgehalt hinzu.
- source_word: שָׂרֵי הָרֶכֶב
  choice: die Befehlshaber der Streitwagen
  rationale: שָׂרֵי bezeichnet militärische Anführer; הָרֶכֶב kann die Streitwagen beziehungsweise die Streitwagentruppe meinen. Die gewählte Formulierung bleibt nah am Wortlaut und ist allgemein verständlich.
- source_word: אַךְ
  choice: gewiss
  rationale: אַךְ drückt hier die sichere, wenn auch irrige Identifizierung Joschafats aus, nicht eine Einschränkung im Sinn von »nur«.
- source_word: מֶלֶךְ יִשְׂרָאֵל הוּא
  choice: Das ist … der König von Israel
  rationale: Die deutsche Identifizierungsformel mit »Das ist« gibt die Aussage natürlich wieder, ohne das grammatisch maskuline hebräische Pronomen überzubetonen.
- source_word: וַיָּסֻרוּ עָלָיו
  choice: Da wandten sie sich gegen ihn
  rationale: סור mit עַל bezeichnet hier eine feindliche Hinwendung. »Sich gegen ihn wenden« bewahrt sowohl die Bewegungsrichtung als auch die feindliche Absicht.
- source_word: לְהִלָּחֵם
  choice: um ihn anzugreifen
  rationale: Der Infinitiv von לחם bedeutet, sich in einen Kampf einzulassen. Im unmittelbaren militärischen Zusammenhang gibt »angreifen« die beabsichtigte Handlung natürlich wieder; die allgemeinere Wiedergabe steht in der Fußnote.
- source_word: וַיִּזְעַק
  choice: schrie auf
  rationale: זעק bezeichnet einen lauten, dringlichen Ruf, häufig aus Bedrängnis. »Schrie auf« bewahrt die Dringlichkeit, ohne einen im Vers nicht genannten Wortlaut zu ergänzen.
