translation_notes:
  register: Moderner, würdiger Erzählstil. Die Satzfolge ist klar und knapp; direkte Rede und Ausrufzeichen bringen die sichere Fehlidentifizierung der Befehlshaber zum Ausdruck, ohne zusätzliche Deutung einzuführen.
