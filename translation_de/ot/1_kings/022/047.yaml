  text: וְ/יֶ֨תֶר֙ הַ/קָּדֵ֔שׁ אֲשֶׁ֣ר נִשְׁאַ֔ר בִּ/ימֵ֖י אָסָ֣א אָבִ֑י/ו בִּעֵ֖ר מִן הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/047.yaml
  text: And he removed from the land the rest of the cult prostitutes who remained in the days of Asa his father[a].
translation:
  language: de
  text: Und den Rest der Kultprostituierten, die in den Tagen Asas, seines Vaters, übrig geblieben waren, entfernte er aus dem Land.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der männlichen Kultprostituierten“. Das hebräische Wort קָדֵשׁ ist eine männliche Bezeichnung für Personen, die an unerlaubten kultisch-sexuellen Praktiken beteiligt waren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר
  choice: Und den Rest
  rationale: יֶתֶר bezeichnet den verbliebenen Rest einer Gruppe; „den Rest“ ist im modernen Deutsch natürlich und präzise.
- source_word: הַקָּדֵשׁ
  choice: der Kultprostituierten
  rationale: קָדֵשׁ bezeichnet hier einen männlichen Angehörigen einer unerlaubten kultisch-sexuellen Praxis. Der deutsche Plural gibt den kollektiven Sinn im Zusammenhang natürlich wieder.
- source_word: אֲשֶׁר נִשְׁאַר
  choice: die … übrig geblieben waren
  rationale: Die Form bezeichnet Personen, die aus einer früheren Zeit noch vorhanden waren; das Plusquamperfekt verdeutlicht dieses zeitliche Verhältnis im Deutschen.
- source_word: בִּימֵי אָסָא אָבִיו
  choice: aus der Zeit seines Vaters Asa
  rationale: Wörtlich steht „in den Tagen seines Vaters Asa“; im Zusammenhang bezeichnet die Wendung die frühere Zeit, aus der die Betreffenden noch übrig waren.
- source_word: בִּעֵר
  choice: entfernte er
  rationale: בער kann beseitigen, wegschaffen oder ausrotten bedeuten. „entfernte“ passt zur Verbindung mit „aus dem Land“, ohne eine nicht ausdrücklich genannte Tötung oder Verbrennung anzunehmen.
- source_word: מִן הָאָרֶץ
  choice: aus dem Land
  rationale: הָאָרֶץ bezeichnet hier das Herrschaftsgebiet beziehungsweise Land Juda, nicht die gesamte Erde.
theological_decisions:
- issue: Wiedergabe von קָדֵשׁ in einem kultisch und moralisch belasteten Zusammenhang
  choice: Kultprostituierte
  alternative: männliche Kultprostituierte; Kultfunktionäre
  rationale: „Kultprostituierte“ bewahrt sowohl den kultischen als auch den sexuellen Bezug, ohne die traditionsgebundene und lexikalisch irreführende Bezeichnung „Sodomiter“ zu verwenden. Dass die hebräische Form männlich ist, wird in der Fußnote ausdrücklich festgehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung hält den verbliebenen Personenkreis als Thema im Vordergrund und bleibt dennoch idiomatisch. Der Fußnotenmarker steht unmittelbar nach dem vollständigen Satz.
