base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/030.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “Disguise yourself and go into the battle, but you, put on your robes.” So the king of Israel disguised himself and went into the battle.
translation:
  language: de
  text: 'Der König von Israel sagte zu Joschafat: »Ich werde mich verkleiden und in die Schlacht ziehen[a], du aber, trag deine Gewänder.« Dann verkleidete sich der König von Israel und zog in die Schlacht.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräischen Formen können auch als Aufforderung verstanden werden: „Verkleide dich und zieh in die Schlacht.“ Der folgende Satz, nach dem sich der König von Israel selbst verkleidete, spricht jedoch stark für die Wiedergabe als Ankündigung seines eigenen Vorhabens.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִתְחַפֵּשׂ וָבֹא
  choice: Ich werde mich verkleiden und in die Schlacht ziehen
  rationale: Die beiden Formen können formal als an Joschafat gerichtete Aufforderung verstanden werden. Der unmittelbare Gegensatz zu וְאַתָּה und der anschließende Bericht, dass der König von Israel sich verkleidete, sprechen jedoch stark dafür, dass der König hier seinen eigenen Plan ankündigt. Die deutsche Fassung gibt diesen Gesprächsverlauf natürlich wieder und kennzeichnet die formale Mehrdeutigkeit in einer Fußnote.
- source_word: בַמִּלְחָמָה
  choice: in die Schlacht
  rationale: Mit בוא bezeichnet die Präpositionalverbindung das Hineingehen in das Kampfgeschehen. „In die Schlacht ziehen“ ist im Deutschen idiomatisch und bewahrt die Bewegungsrichtung.
- source_word: וְאַתָּה
  choice: du aber
  rationale: 'Das ausdrücklich gesetzte Pronomen markiert einen Gegensatz: Der König von Israel will unerkannt bleiben, Joschafat dagegen soll seine erkennbare Kleidung tragen.'
- source_word: לְבַשׁ בְּגָדֶיךָ
  choice: sollst deine königlichen Gewänder tragen
  rationale: בְּגָדִים bezeichnet allgemein Kleidung oder Gewänder. Im Zusammenhang zweier Könige und im Gegensatz zur Verkleidung sind die sichtbaren königlichen Gewänder gemeint; „tragen“ gibt die beabsichtigte Erscheinung natürlicher wieder als „anziehen“.
- source_word: וַיִּתְחַפֵּשׂ
  choice: verkleidete sich
  rationale: Die reflexive Verbform berichtet unmittelbar die Ausführung des zuvor angekündigten Plans.
- source_word: וַיָּבֹא בַּמִּלְחָמָה
  choice: zog in die Schlacht
  rationale: Die Formulierung nimmt die vorherige Ankündigung auf und bezeichnet idiomatisch das Eintreten in den Kampf.
theological_decisions:
- issue: Wer soll sich verkleiden?
  choice: Der König von Israel kündigt an, sich selbst zu verkleiden.
  alternative: 'Der König befiehlt Joschafat: „Verkleide dich und zieh in die Schlacht.“'
  rationale: Die hebräischen Formen lassen formal eine Aufforderung zu. Doch „du aber“ leitet einen Gegensatz ein, und der folgende Erzählsatz sagt ausdrücklich, dass der König von Israel sich verkleidete. Die gewählte Fassung bewahrt den kohärenten Handlungsablauf, ohne die sprachliche Alternative zu verschweigen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. „Joschafat“ folgt der im Deutschen geläufigen biblischen Namensform. Der direkte Gegensatz wird mit „du aber“ klar markiert; „königliche Gewänder“ macht die im Kontext entscheidende erkennbare Amtstracht verständlich.
