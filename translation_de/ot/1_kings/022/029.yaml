lexical_decisions:
- source_word: וַיַּעַל
  choice: Da zogen … hinauf
  rationale: עלה bezeichnet hier das Hinaufziehen zu einem Ziel. „zogen … hinauf“ bewahrt die Richtungsangabe und passt zum militärischen Zusammenhang, ohne das Verb stärker als nötig auszudeuten.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: der König von Israel
  rationale: Der Ausgangstext verwendet den Titel und nicht den Namen Ahab; dies wird beibehalten.
- source_word: וִיהוֹשָׁפָט
  choice: und Joschafat
  rationale: Die im Deutschen geläufige biblische Namensform wird verwendet.
- source_word: מֶלֶךְ יְהוּדָה
  choice: der König von Juda
  rationale: Die Apposition wird im Deutschen zur Klarheit mit Artikel wiedergegeben.
- source_word: רָמֹת גִּלְעָד
  choice: Ramot in Gilead
  rationale: Diese Wiedergabe behandelt Ramot als Ortsnamen und Gilead als nähere geografische Bestimmung; sie ist im modernen Deutschen verständlicher als eine künstliche Bindestrichform.
