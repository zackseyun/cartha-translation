base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/015.yaml
  text: So he came to the king[a], and the king said to him, “Micaiah, should we go to Ramoth-gilead for battle, or should we refrain?” And he said to him, “Go up and succeed, and Yahweh will give it into the hand of the king.”
translation:
  language: de
  text: 'Da kam er zum König, und der König fragte ihn: „Micha, sollen wir nach Ramot-Gilead in den Kampf ziehen, oder sollen wir davon absehen?“ Er antwortete ihm: „Zieh hinauf und hab Erfolg! Jahwe wird es in die Hand des Königs geben.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Michas Antwort ist im Zusammenhang wahrscheinlich ironisch gemeint; im Hebräischen selbst ist der spöttische Ton jedoch nicht ausdrücklich markiert.
    reason: Die wahrscheinliche Ironie ist für das Verständnis wichtig, darf aber nicht gegen den formal unmarkierten Wortlaut in den Haupttext eingetragen werden.
lexical_decisions:
- source_word: וַיָּבוֹא
  choice: Da kam er
  rationale: Das Wayyiqtol führt das nächste Ereignis der Erzählung fort. „Da“ gibt den Handlungsfortschritt im Deutschen natürlich wieder.
- source_word: מִיכָיְהוּ
  choice: Micha
  rationale: Die im Deutschen etablierte Form des hebräischen Personennamens wird verwendet.
- source_word: הֲנֵלֵךְ
  choice: sollen wir … ziehen
  rationale: Der interrogative Imperfekt der ersten Person Plural bittet um eine Entscheidung beziehungsweise einen Rat; „sollen wir“ gibt diese abwägende Frage idiomatisch wieder.
- source_word: רָמֹת גִּלְעָד
  choice: Ramot-Gilead
  rationale: Der Ortsname wird in einer transparenten, im Deutschen verständlichen Transliteration wiedergegeben.
- source_word: לַמִּלְחָמָה
  choice: in den Kampf
  rationale: Präposition und Substantiv bezeichnen den Zweck des Hinziehens; „in den Kampf ziehen“ ist eine natürliche deutsche militärische Wendung.
- source_word: אִם נֶחְדָּל
  choice: oder sollen wir davon absehen
  rationale: Die Klausel nennt als Alternative den Verzicht auf den geplanten Feldzug. „Davon absehen“ drückt das Zurückhalten in modernem Standarddeutsch klar aus.
- source_word: עֲלֵה
  choice: Zieh hinauf
  rationale: Der Imperativ von עלה bezeichnet wörtlich das Hinaufziehen und kann im militärischen Zusammenhang den Aufbruch zum Angriff meinen; die räumliche Bildsprache bleibt erhalten.
- source_word: וְהַצְלַח
  choice: und hab Erfolg
  rationale: Die Hifil-Form von צלח bezeichnet Erfolg im Vorhaben. Die knappe imperative Form bewahrt sowohl den Wortlaut als auch die im Kontext mögliche Ironie.
- source_word: וְנָתַן יְהוָה
  choice: Jahwe wird … geben
  rationale: Das Perfekt mit ו nach den Imperativen kann das als gewiss dargestellte künftige Ergebnis bezeichnen; im Deutschen ist dafür das Futur passend.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname transliteriert und nicht durch einen Titel ersetzt.
- source_word: בְּיַד הַמֶּלֶךְ
  choice: in die Hand des Königs
  rationale: Die hebräische Wendung für die Übergabe in die Gewalt oder Verfügungsgewalt eines anderen wird bildhaft und verständlich bewahrt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. Die Transliteration bewahrt den Charakter als persönlicher Gottesname.
- issue: Ton von Michas erster Antwort
  choice: Der Wortlaut bleibt im Haupttext ohne ausdrückliche Kennzeichnung von Sarkasmus
  alternative: Die Antwort durch Zusätze oder besondere Formulierungen eindeutig als spöttisch kennzeichnen
  rationale: Der weitere Erzählzusammenhang legt Ironie nahe, doch der hebräische Satz markiert sie nicht ausdrücklich. Die Übersetzung bewahrt diese erzählerische Spannung; die Fußnote informiert über die wahrscheinliche Tonlage.
- issue: Nicht ausdrücklich genanntes Objekt von וְנָתַן
  choice: es
  alternative: das Objekt auch im Deutschen unausgesprochen lassen
  rationale: Im Hebräischen ergibt sich das Objekt aus dem Zusammenhang. Das deutsche Verb „geben“ verlangt hier für einen vollständigen, natürlichen Satz ein Objekt; das unbestimmte Pronomen „es“ macht keine zusätzliche Identifikation über den Kontext hinaus.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer erzählerischer Syntax. Die höfisch-formelle Wiederholung von „der König“ bleibt erhalten. Militärische und bildhafte hebräische Wendungen werden soweit möglich bewahrt, ohne unnatürliches Deutsch zu erzeugen.
