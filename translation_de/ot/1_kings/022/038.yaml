  text: וַ/יִּשְׁטֹ֨ף אֶת הָ/רֶ֜כֶב עַ֣ל בְּרֵכַ֣ת שֹׁמְר֗וֹן וַ/יָּלֹ֤קּוּ הַ/כְּלָבִים֙ אֶת דָּמ֔/וֹ וְ/הַ/זֹּנ֖וֹת רָחָ֑צוּ כִּ/דְבַ֥ר יְהוָ֖ה אֲשֶׁ֥ר דִּבֵּֽר־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/038.yaml
  text: And they washed the chariot at the pool of Samaria[a], and the dogs licked up his blood, and the prostitutes washed there, according to the word of Yahweh that he had spoken.
translation:
  language: de
  text: Man spülte den Streitwagen am Teich von Samaria ab. Die Hunde leckten sein Blut auf, und die Prostituierten badeten[a] – gemäß dem Wort Jahwes, das er gesprochen hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und die Prostituierten wuschen sich“. Das hebräische Verb nennt kein Objekt ausdrücklich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁטֹף
  choice: Man spülte … ab
  rationale: Die hebräische Form steht in der 3. Person Singular, doch der Handelnde bleibt ungenannt. Das unpersönliche deutsche „man“ bewahrt dies natürlich; „abspülen“ passt zur Reinigung des blutigen Wagens.
- source_word: הָרֶכֶב
  choice: den Streitwagen
  rationale: Im Kontext ist Ahabs einzelner Wagen gemeint, auf dem er in der Schlacht stand. „Streitwagen“ gibt die Funktion im Deutschen klar wieder.
- source_word: עַל בְּרֵכַת שֹׁמְרוֹן
  choice: am Teich von Samaria
  rationale: עַל bezeichnet hier idiomatisch den Ort bei der Wasseranlage. „Am Teich“ ist natürlich und legt nicht nahe, der Wagen habe sich auf dem Wasser befunden.
- source_word: וַיָּלֹקּוּ הַכְּלָבִים אֶת דָּמוֹ
  choice: Die Hunde leckten sein Blut auf
  rationale: Die bestimmte Mehrzahl und der Bezug des Suffixes auf Ahab bleiben erhalten; „auflecken“ gibt die anschauliche Handlung idiomatisch wieder.
- source_word: וְהַזֹּנוֹת
  choice: und die Prostituierten
  rationale: זוֹנָה bezeichnet eine Prostituierte. Die moderne, sachliche Bezeichnung vermeidet das veraltete und wertend klingende „Huren“.
- source_word: רָחָצוּ
  choice: badeten
  rationale: Das Verb kann „sich waschen“ oder „baden“ bedeuten. „Badeten“ ist im Deutschen ohne ergänztes Objekt grammatisch und bewahrt die Kürze der hebräischen Aussage.
- source_word: כִּדְבַר יְהוָה אֲשֶׁר דִּבֵּר
  choice: gemäß dem Wort Jahwes, das er gesprochen hatte
  rationale: Die prophetische Erfüllungsformel wird formal bewahrt; das Plusquamperfekt macht den Rückbezug auf das zuvor gesprochene Wort deutlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ ist die geläufige deutsche Form des Gottesnamens und bewahrt ihn als Namen statt ihn durch einen Titel zu ersetzen.
- issue: Deutung von וְהַזֹּנוֹת רָחָצוּ
  choice: und die Prostituierten badeten
  alternative: und die Prostituierten wuschen sich
  rationale: Die Prostituierten sind im masoretischen Text ausdrücklich das Subjekt; das Verb nennt jedoch kein Objekt. Die Übersetzung wahrt diese knappe, ungewöhnliche Aussage, während die Fußnote die naheliegende reflexive Wiedergabe nennt.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Kurze Hauptsätze bewahren die erzählerische Unmittelbarkeit; der Gedankenstrich hebt die abschließende Erfüllungsformel ab, ohne sie auszudeuten.
