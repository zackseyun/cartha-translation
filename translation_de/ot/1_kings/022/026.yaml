  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede verwendet entsprechend dem hebräischen Singular die Anrede „Nimm … bring“. Die Amtsbezeichnung bleibt bewusst offen und wird in der Fußnote erläutert.
