  source_fidelity: 'Der Vers gibt die hebräische Satzfolge und alle wesentlichen Elemente zuverlässig wieder: der Königstitel bleibt unpersonalisiert, die beiden Singularimperative entsprechen קַח und וַהֲשִׁיבֵהוּ, und die zwei durch אֶל gekennzeichneten Zielpersonen werden klar wiedergegeben. „Bring ihn zurück“ trifft den kausativen Sinn von וַהֲשִׁיבֵהוּ. Die deutsche Namensform „Micha“ ist für מִיכָיְהוּ im deutschen Bibelgebrauch etabliert.'
