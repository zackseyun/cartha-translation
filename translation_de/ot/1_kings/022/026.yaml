source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל קַ֚ח אֶת מִיכָ֔יְהוּ וַ/הֲשִׁיבֵ֖/הוּ אֶל אָמֹ֣ן שַׂר הָ/עִ֑יר וְ/אֶל יוֹאָ֖שׁ בֶּן הַ/מֶּֽלֶךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/026.yaml
  text: Then the king of Israel said[a], “Take Micaiah and return him to Amon, the governor of the city, and to Joash the king’s son.”
translation:
  language: de
  text: 'Da sagte der König von Israel: »Nimm Micha und bring ihn zurück zu Amon, dem Obersten der Stadt[a], und zu Joasch, dem Sohn des Königs.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem Statthalter der Stadt“ oder „dem Befehlshaber der Stadt“. Der hebräische Titel kann einen führenden zivilen oder militärischen Amtsträger bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Narrativ-Waw führt die Handlung fort; „Da sagte“ gibt die zeitliche Abfolge in natürlichem deutschem Erzählstil wieder.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: der König von Israel
  rationale: Die hebräische Bezeichnung wird unmittelbar wiedergegeben; der Name Ahab wird nicht ergänzt, da der Ausgangstext den Titel verwendet.
- source_word: קַח
  choice: Nimm
  rationale: Der Singular-Imperativ von לקח bedeutet hier schlicht „nimm“; eine gewaltsamere Wiedergabe wie „ergreif“ wäre nicht ausdrücklich im Verb enthalten.
- source_word: מִיכָיְהוּ
  choice: Micha
  rationale: Der Personenname wird in seiner im Deutschen geläufigen biblischen Form wiedergegeben.
- source_word: וַהֲשִׁיבֵהוּ
  choice: und bring ihn zurück
  rationale: Der Hifil von שוב bezeichnet das Veranlassen einer Rückkehr; „bring ihn zurück“ ist im Deutschen natürlich und bewahrt den Rückbezug.
- source_word: אָמֹן
  choice: Amon
  rationale: Der Personenname wird nach geläufiger deutscher Konvention transkribiert.
- source_word: שַׂר הָעִיר
  choice: dem Obersten der Stadt
  rationale: שַׂר bezeichnet einen führenden Amts- oder Befehlsträger. „Oberster der Stadt“ wahrt die im Hebräischen offene zivile oder militärische Funktion besser als eine einseitige Festlegung.
- source_word: וְאֶל יוֹאָשׁ
  choice: und zu Joasch
  rationale: Die wiederholte Präposition אֶל kennzeichnet einen zweiten Ziel- beziehungsweise Empfängerbezug und wird zur Klarheit beibehalten.
- source_word: בֶּן הַמֶּלֶךְ
  choice: dem Sohn des Königs
  rationale: Die Status-constructus-Verbindung wird direkt und idiomatisch wiedergegeben, ohne den nicht ausdrücklich genannten Titel „Prinz“ einzuführen.
theological_decisions: []
