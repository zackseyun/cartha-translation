  yaml_path: translation/ot/1_kings/022/042.yaml
  text: Jehoshaphat was thirty-five years old when he began to reign, and he reigned twenty-five years in Jerusalem. And his mother’s name was Azubah daughter of Shilhi.
translation:
  language: de
  text: Joschafat war fünfunddreißig Jahre alt, als er König wurde, und regierte fünfundzwanzig Jahre in Jerusalem. Seine Mutter hieß Asuba und war eine Tochter Schilhis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוֹשָׁפָט
  choice: Joschafat
  rationale: Der Personenname wird nach der etablierten deutschen Bibeltradition transliteriert und nicht übersetzt.
- source_word: בֶּן שְׁלֹשִׁים וְחָמֵשׁ שָׁנָה
  choice: war fünfunddreißig Jahre alt
  rationale: Die wörtliche hebräische Altersangabe ‚ein Sohn von fünfunddreißig Jahren‘ wird idiomatisch und sinngetreu ins moderne Deutsche übertragen.
- source_word: בְּמָלְכוֹ
  choice: als er König wurde
  rationale: Die Form bezeichnet im Zusammenhang der Königsnotiz den Zeitpunkt seines Regierungsantritts; diese Wiedergabe ist präzise und natürlich.
- source_word: וְעֶשְׂרִים וְחָמֵשׁ שָׁנָה מָלַךְ
  choice: regierte fünfundzwanzig Jahre
  rationale: מלך bezeichnet hier die Ausübung der Königsherrschaft; ‚regierte‘ ist im Deutschen die natürliche Formulierung einer Regierungsdauer.
- source_word: בִּירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Direkte Wiedergabe der Ortsangabe mit etablierter deutscher Namensform.
- source_word: וְשֵׁם אִמּוֹ עֲזוּבָה
  choice: Seine Mutter hieß Asuba
  rationale: Die formelhafte Wendung ‚der Name seiner Mutter war‘ wird in natürliches modernes Deutsch übertragen, ohne Information zu verlieren.
- source_word: בַּת שִׁלְחִי
  choice: sie war eine Tochter Schilhis
  rationale: Die genealogische Zuordnung wird klar wiedergegeben; der Personenname wird nach deutscher Lautkonvention transliteriert.
