source:
  edition: WLC
  text: יְהוֹשָׁפָ֡ט עשר אֳנִיּ֨וֹת תַּרְשִׁ֜ישׁ לָ/לֶ֧כֶת אוֹפִ֛ירָ/ה לַ/זָּהָ֖ב וְ/לֹ֣א הָלָ֑ךְ כִּֽי נשברה אֳנִיּ֖וֹת בְּ/עֶצְי֥וֹן גָּֽבֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/049.yaml
  text: Jehoshaphat made ships of Tarshish to go to Ophir for gold[a], but they did not go[b], because the ships were wrecked at Ezion-geber.
translation:
  language: de
  text: Joschafat ließ Tarschisch-Schiffe bauen, die nach Ofir fahren sollten, um Gold zu holen.[a] Doch sie liefen nicht aus,[b] denn die Schiffe erlitten bei Ezjon-Geber Schiffbruch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »Tarschisch-Schiffe«; möglicherweise bezeichnet der Ausdruck einen Typ großer hochseetauglicher Schiffe und nicht unbedingt Schiffe, die tatsächlich aus Tarschisch stammten.
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen stehen die Verben in »sie liefen nicht aus« und »erlitten Schiffbruch« jeweils im Singular; gemeint ist kollektiv die Flotte beziehungsweise die Gesamtheit der Schiffe.
    reason: lexical_alternative
lexical_decisions:
- source_word: עשר
  choice: ließ … bauen
  rationale: Der unpunktierte Konsonantenbestand wird im Zusammenhang als Verb im Sinn von »machen/anfertigen« verstanden. Die kausative deutsche Wendung ist bei einem König, der eine Flotte in Auftrag gibt, natürlich.
- source_word: אֳנִיּוֹת תַּרְשִׁישׁ
  choice: Tarschisch-Schiffe
  rationale: Die hebräische Status-constructus-Verbindung bleibt erkennbar. Sie kann Schiffe mit Bezug zu Tarschisch oder einen Typ großer hochseetauglicher Schiffe bezeichnen; die Mehrdeutigkeit wird in der Fußnote bewahrt.
- source_word: לָלֶכֶת אוֹפִירָה
  choice: die nach Ofir fahren sollten
  rationale: Infinitiv und Richtungsendung bezeichnen Zweck und Ziel. Bei Schiffen ist »fahren« im Deutschen idiomatischer als das formal nähere »gehen«.
- source_word: לַזָּהָב
  choice: um Gold zu holen
  rationale: ל bezeichnet hier den Zweck der Reise. Die Formulierung macht natürlich verständlich, dass Gold beschafft werden sollte.
- source_word: וְלֹא הָלָךְ
  choice: Doch sie liefen nicht aus
  rationale: Die maskuline Singularform wird kollektiv auf die Flotte bezogen. »Auslaufen« bezeichnet präzise, dass die geplante Seereise nicht begann, ohne Joschafat selbst zum Reisenden zu machen.
- source_word: נשברה
  choice: erlitten … Schiffbruch
  rationale: Der Nifal von שבר bedeutet »zerbrochen werden«. Im maritimen Zusammenhang gibt »Schiffbruch erleiden« den Sinn idiomatisch wieder; die feminine Singularform ist kollektiv auf die Schiffe beziehungsweise Flotte bezogen.
- source_word: בְּעֶצְיוֹן גָּבֶר
  choice: bei Ezjon-Geber
  rationale: Die Präposition ב bezeichnet hier den Ort des Unglücks. »Bei« ist für den Hafenort natürlich und vermeidet die unnötige Behauptung, die Schiffe seien innerhalb der Siedlung zerstört worden.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die nautischen Wendungen »auslaufen« und »Schiffbruch erleiden« sind klar und idiomatisch; traditionelle Ortsnamen werden in geläufiger deutscher Transkription wiedergegeben.
