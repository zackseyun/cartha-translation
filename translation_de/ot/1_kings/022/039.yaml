  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem historiografischem Ton. Die rhetorische Schlussfrage und die wiederholte Satzstruktur des Hebräischen bleiben erkennbar; ein nicht ausdrücklich vorhandenes einleitendes „Nun“ wurde nicht ergänzt.
