base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/039.yaml
  text: The rest of the acts of Ahab[a], and all that he did, and the ivory house that he built[b], and all the cities that he built—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: de
  text: Die übrigen Taten Ahabs und alles, was er tat, das Elfenbeinhaus[a], das er baute, und alle Städte, die er baute – sind sie nicht im Buch der Chroniken der Könige Israels[b] aufgezeichnet?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Haus aus Elfenbein“. Gemeint ist wahrscheinlich ein königliches Gebäude, das mit Elfenbein verziert war, nicht ein vollständig aus Elfenbein errichtetes Haus.'
    reason: lexical_alternative
  - marker: b
    text: Das „Buch der Chroniken der Könige Israels“ bezeichnet eine in den Königsbüchern angeführte königliche Schriftquelle und ist nicht ohne Weiteres mit dem biblischen Buch der Chronik gleichzusetzen.
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי אַחְאָב
  choice: Die übrigen Taten Ahabs
  rationale: יֶתֶר bezeichnet das Übrige beziehungsweise den verbleibenden Bericht; דִּבְרֵי meint in dieser Königsformel die Taten oder Angelegenheiten des Herrschers, nicht bloß seine Worte.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: und alles, was er tat
  rationale: Die breite Bedeutung von עָשָׂה wird ohne unnötige Präzisierung mit „tat“ wiedergegeben.
- source_word: בֵּית הַשֵּׁן
  choice: das Elfenbeinhaus
  rationale: Die knappe Zusammensetzung bewahrt die wörtliche Bezeichnung, ohne durch „Palast“ mehr festzulegen, als der hebräische Ausdruck sagt. Gemeint ist wahrscheinlich ein mit Elfenbein ausgestattetes Gebäude.
- source_word: וְכָל הֶעָרִים אֲשֶׁר בָּנָה
  choice: und alle Städte, die er baute
  rationale: עָרִים wird regulär als „Städte“ wiedergegeben; „baute“ erhält die wiederholte Formulierung des Ausgangstextes.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: ist dies nicht alles … aufgezeichnet?
  rationale: הֲלוֹא leitet eine rhetorische Frage ein, die Zustimmung erwartet. Das zusammenfassende deutsche „dies … alles“ nimmt die vorherige Aufzählung natürlich auf; „aufgezeichnet“ entspricht dem archivischen Zusammenhang von כְּתוּבִים.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: im Buch der Chronik der Könige von Israel
  rationale: „Im Buch“ entspricht dem deutschen Sprachgebrauch für schriftlich enthaltene Angaben. „Buch der Chronik“ bewahrt die historiografische Bezeichnung, während die Fußnote eine Verwechslung mit dem kanonischen Chronikbuch verhindert.
