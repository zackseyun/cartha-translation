    issue: Die Schlussfrage verwendet „ist dies nicht alles“, obwohl הֵם כְּתוּבִים grammatisch pluralisch ist.
    rationale: Die Aufzählung ist im Hebräischen mit einem pluralischen Rückverweis („sind sie nicht geschrieben?“) aufgenommen. Die deutsche Pluralform ist ebenso natürlich und vermeidet eine unnötige Umformung.
  - severity: medium
    issue: „Buch der Chronik“ gibt דִּבְרֵי הַיָּמִים nur singulär wieder.
    rationale: Die hebräische Bezeichnung steht im Plural und wird in der englischen Audit-Spur als „Book of the Chronicles“ wiedergegeben. „Buch der Chroniken“ ist angemessen und verhindert eine sachlich nicht erforderliche Singularisierung.
  - severity: low
    issue: Die Fußnote zu [a] bietet „Elfenbeinpalast“ als Alternative an.
    rationale: „Palast“ interpretiert den neutralen Begriff בַּיִת stärker als nötig. „Haus aus Elfenbein“ ist die unmittelbare lexikalische Alternative; die Erklärung zur wahrscheinlichen Elfenbeinverkleidung kann bestehen bleiben.
