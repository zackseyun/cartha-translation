- from: Die übrigen Taten Ahabs und alles, was er tat, das Elfenbeinhaus[a], das er baute, und alle Städte, die er baute – ist dies nicht alles im Buch der Chronik der Könige von Israel[b] aufgezeichnet?
  to: Die übrigen Taten Ahabs und alles, was er tat, das Elfenbeinhaus[a], das er baute, und alle Städte, die er baute – sind sie nicht im Buch der Chroniken der Könige Israels[b] aufgezeichnet?
