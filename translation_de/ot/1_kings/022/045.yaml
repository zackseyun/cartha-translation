  footnotes:
  - marker: a
    text: 'Oder: „Joschafat lebte in Frieden mit dem König von Israel.“ Das hebräische Verb kann sowohl das Schließen von Frieden als auch einen bestehenden Friedenszustand bezeichnen; im Haupttext wird die ereignishafte Bedeutung bevorzugt.'
