lexical_decisions:
- source_word: וַיַּשְׁלֵם
  choice: schloss Frieden
  rationale: Die Hifil-Form von שׁלם bezeichnet hier wahrscheinlich das Herstellen friedlicher Beziehungen. „Frieden schließen“ gibt diesen ereignishaften Sinn in natürlichem, modernem Deutsch wieder.
- source_word: יְהוֹשָׁפָט
  choice: Joschafat
  rationale: Der Personenname wird in der im Deutschen gebräuchlichen biblischen Form wiedergegeben.
- source_word: עִם
  choice: mit
  rationale: Die Präposition bezeichnet hier den Beziehungspartner, mit dem Frieden geschlossen wurde.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: dem König von Israel
  rationale: Die Status-constructus-Verbindung wird natürlich und bestimmt wiedergegeben; gemeint ist der amtierende König des Nordreichs.
