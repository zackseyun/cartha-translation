  source_fidelity: Der Entwurf gibt Jahwes direkte Frage und die ungemilderte Darstellung von Ahabs Verleitung zutreffend wieder. „Dazu verleiten“ ist für יְפַתֶּה angemessen und lässt die im Verb liegende Spannweite offen; „fallen“ bewahrt die Bildlichkeit von נפל. Die Ortspräposition בְ bezeichnet den Ort des Geschehens. „Bei Ramot-Gilead“ kann im Deutschen eine bloße Nähe zum Ort nahelegen und ist daher gegenüber „in Ramot-Gilead“ weniger präzise. Außerdem fügt „Darauf“ einen zeitlich-folgernden Bezug hinzu, den der knappe hebräische Satz nicht ausdrücklich setzt.
