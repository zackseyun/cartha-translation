  terminology: „Jahwe“, „Ahab“ und „Ramot-Gilead“ sind konsistent und im deutschen bibelwissenschaftlichen Register passend. Die Fußnote zu „verleiten“ bildet die lexikalischen Alternativen sachgerecht ab.
