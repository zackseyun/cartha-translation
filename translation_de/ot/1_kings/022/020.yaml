base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/020.yaml
  text: And Yahweh said[a], “Who will entice Ahab, so that he may go up and fall at Ramoth-gilead?” And this one said one thing, and that one said another.
translation:
  language: de
  text: 'Und Jahwe sagte: „Wer wird Ahab dazu verleiten[a], hinaufzuziehen und in Ramot-Gilead zu fallen?“ Der eine sagte dies, der andere das.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „überreden“; das Verb kann je nach Zusammenhang auch „täuschen“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Umschrift.
- source_word: יְפַתֶּה
  choice: dazu verleiten
  rationale: Das Piel von פתה kann je nach Zusammenhang „verleiten“, „überreden“ oder „täuschen“ bedeuten. „Dazu verleiten“ wahrt den Gedanken, Ahab zu einem bestimmten Handeln zu bringen, ohne die Art der Einwirkung im Haupttext völlig festzulegen.
- source_word: וְיַעַל וְיִפֹּל
  choice: hinaufzuziehen und … zu fallen
  rationale: Die Infinitivkonstruktion nach „dazu verleiten“ gibt im Deutschen den beabsichtigten Handlungsablauf natürlich wieder. „Fallen“ bewahrt das schlichte Bild des hebräischen נפל, das im militärischen Zusammenhang Niederlage und Tod einschließt.
- source_word: בְּרָמֹת גִּלְעָד
  choice: bei Ramot-Gilead
  rationale: Der Ortsname wird transliteriert; „bei“ bezeichnet natürlich den Ort der erwarteten Schlacht.
- source_word: זֶה בְּכֹה וְזֶה אֹמֵר בְּכֹה
  choice: der eine dies und der andere das
  rationale: Diese idiomatische Wiedergabe hält die Gegenüberstellung verschiedener Sprecher und Vorschläge fest und klingt im heutigen Deutsch natürlich.
theological_decisions:
- issue: Göttliche Beteiligung an Ahabs Untergang
  choice: Jahwes unmittelbare Frage, wer Ahab verleiten werde, bleibt ungemildert stehen.
  alternative: Die göttliche Beteiligung durch eine neutralere Formulierung wie „beeinflussen“ abzuschwächen.
  rationale: Der hebräische Text stellt Jahwe als denjenigen dar, der die Frage im himmlischen Rat eröffnet. Die Übersetzung bewahrt diese theologische Spannung und die Darstellung göttlichen Gerichts, ohne sie erklärend aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau ist gut verständlich, während Gottesname, Ortsname, Bildsprache und die knappe Rede des himmlischen Rates erhalten bleiben.
