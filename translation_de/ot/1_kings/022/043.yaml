base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/043.yaml
  text: He walked in all the ways of Asa his father[a]; he did not turn aside from them[b], doing what was right in the eyes of Yahweh.
translation:
  language: de
  text: Er ging ganz den Weg seines Vaters Asa[a]; er wich nicht davon ab und tat, was in den Augen Jahwes recht war.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Er folgte in allem dem Weg seines Vaters Asa“ oder „Er lebte in jeder Hinsicht nach dem Vorbild seines Vaters Asa“.'
    reason: lexical_alternative
  - marker: b
    text: '„In den Augen Jahwes“ ist eine hebräische Wendung und bedeutet: nach Jahwes Urteil beziehungsweise in seiner Sicht.'
    reason: idiom_explanation
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Er ging
  rationale: הלך bedeutet grundsätzlich „gehen“. Die Wiedergabe bewahrt hier das Wegbild für die Lebensführung, ohne es vorschnell durch eine reine Deutung wie „leben“ zu ersetzen.
- source_word: בְּכָל דֶּרֶךְ
  choice: auf dem ganzen Weg
  rationale: דֶּרֶךְ steht im Hebräischen im Singular; mit כָּל bezeichnet die Wendung den gesamten Lebensweg beziehungsweise die durchgängige Handlungsweise Asas. Die deutsche Formulierung erhält Singular und Metapher.
- source_word: אָסָא אָבִיו
  choice: seines Vaters Asa
  rationale: Dies ist die natürliche deutsche Wortstellung und gibt sowohl den Namen als auch das Verwandtschaftsverhältnis genau wieder.
- source_word: לֹא סָר מִמֶּנּוּ
  choice: er wich nicht davon ab
  rationale: סור bezeichnet das Abweichen oder Sich-Entfernen. „Davon“ nimmt wie das hebräische singularische Suffix den zuvor genannten Weg auf und führt die Wegmetapher fort.
- source_word: לַעֲשׂוֹת הַיָּשָׁר
  choice: und tat, was … recht war
  rationale: Die Infinitivkonstruktion bezeichnet hier das entsprechende Handeln beziehungsweise dessen Ziel oder Ergebnis. Die koordinierte deutsche Fassung ist verständlich und legt die genaue semantische Beziehung nicht unnötig eng fest.
- source_word: בְּעֵינֵי יְהוָה
  choice: in den Augen Jahwes
  rationale: Die wörtlich nachvollziehbare hebräische Bewertungsformel bleibt erhalten; sie bedeutet, dass etwas nach Jahwes Urteil recht ist.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen gebräuchliche Wiedergabe des göttlichen Eigennamens bewahrt den Namen, statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Königliche Bewertungsformel
  choice: Der Vers bestätigt, dass Joschafat dem Lebensweg seines Vaters Asa folgte und nach Jahwes Urteil recht handelte.
  alternative: Eine freiere Wiedergabe könnte seine Herrschaft allgemein als treu oder gottgefällig bezeichnen.
  rationale: Die Übersetzung hält sich an die konkrete Wegmetapher und die ausdrückliche göttliche Bewertung, ohne weitergehende Aussagen über Joschafats gesamte Herrschaft oder seine innere Haltung einzutragen.
- issue: Beziehung des Infinitivs לַעֲשׂוֹת zum vorhergehenden Satz
  choice: Koordination mit „und tat“
  alternative: „um zu tun“ oder „indem er tat“
  rationale: Der hebräische Infinitiv kann Ziel, Folge oder erläuternde Ausgestaltung ausdrücken. Die koordinierte Fassung gibt den Zusammenhang natürlich wieder, ohne eine einzige syntaktische Nuance dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wegmetapher und die traditionelle biblische Bewertungsformel bleiben erhalten. Der Singular „Weg“ und der singularische Rückverweis „davon“ folgen dem WLC-Text; die englische Konsultationsfassung mit „ways/them“ wurde deshalb nicht übernommen.
