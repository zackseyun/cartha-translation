  text: וַ/יֹּ֣אמֶר מֶֽלֶךְ יִשְׂרָאֵ֣ל אֶֽל יְהוֹשָׁפָ֡ט ע֣וֹד אִישׁ אֶחָ֡ד לִ/דְרֹשׁ֩ אֶת יְהוָ֨ה מֵ/אֹת֜/וֹ וַ/אֲנִ֣י שְׂנֵאתִ֗י/ו כִּ֠י לֹֽא יִתְנַבֵּ֨א עָלַ֥/י טוֹב֙ כִּ֣י אִם רָ֔ע מִיכָ֖יְהוּ בֶּן יִמְלָ֑ה וַ/יֹּ֨אמֶר֙ יְה֣וֹשָׁפָ֔ט אַל יֹאמַ֥ר הַ/מֶּ֖לֶךְ כֵּֽן־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/008.yaml
  text: 'And the king of Israel said to Jehoshaphat[a], “There is still one more man through whom to inquire of Yahweh, but I hate him, because he does not prophesy good concerning me, but only evil: Micaiah son of Imlah.” And Jehoshaphat said, “Let not the king say so.”'
translation:
  language: de
  text: 'Da sagte der König von Israel zu Joschafat: »Es gibt noch einen Mann, durch den man Jahwe befragen kann[a]. Aber ich hasse ihn, denn er weissagt über mich nichts Gutes, sondern nur Böses: Michaja, den Sohn Jimlas.« Joschafat erwiderte: »Der König soll so etwas nicht sagen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bei dem man Jahwe befragen kann«.'
    reason: Die Präposition in מֵאֹתוֹ kann im Deutschen sowohl instrumental (»durch ihn«) als auch als Bezug auf die Person verstanden werden, bei der die göttliche Auskunft eingeholt wird.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte / erwiderte
  rationale: Das häufige hebräische Erzählungsverb wird im ersten Satz mit »Da sagte« wiedergegeben; bei Joschafats Antwort macht »erwiderte« den Gesprächsverlauf im Deutschen natürlich deutlich, ohne zusätzliche Aussage einzutragen.
- source_word: עוֹד אִישׁ אֶחָד
  choice: Es gibt noch einen Mann
  rationale: עוֹד bezeichnet hier eine noch verbleibende beziehungsweise zusätzliche Person. Die Formulierung ist nah am Hebräischen und zugleich natürliches Deutsch.
- source_word: לִדְרֹשׁ אֶת־יְהוָה מֵאֹתוֹ
  choice: durch den wir Jahwe befragen können
  rationale: דָּרַשׁ bezeichnet in diesem prophetischen Zusammenhang das Einholen göttlicher Auskunft. מֵאֹתוֹ stellt den Mann als Vermittler der Befragung dar; »durch den« gibt dies idiomatisch wieder. Das im Deutschen ergänzte »wir können« erschließt die Funktion des hebräischen Infinitivs im Satz.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; »Jahwe« ist die im Deutschen geläufige Form.
- source_word: וַאֲנִי שְׂנֵאתִיו
  choice: Aber ich hasse ihn
  rationale: Das Perfekt beschreibt hier die bestehende, gefestigte Haltung des Königs. Das deutsche Präsens drückt diesen gegenwärtigen Zustand natürlich aus.
- source_word: לֹא יִתְנַבֵּא עָלַי טוֹב כִּי אִם רָע
  choice: er weissagt über mich nichts Gutes, sondern nur Böses
  rationale: עָלַי bedeutet hier »über/mich betreffend«. Die Verbindung aus Verneinung und כִּי אִם hat ausschließende Kraft. »Böses« bewahrt die Breite von רָע und legt nicht vorschnell fest, ob moralisch Böses oder angekündigtes Unheil gemeint ist.
- source_word: מִיכָיְהוּ בֶּן־יִמְלָה
  choice: Michaja, den Sohn Jimlas
  rationale: Die Namen folgen geläufigen deutschen Bibelnamensformen; der Patronymikon wird in der deutschen Satzkonstruktion als Apposition wiedergegeben.
- source_word: אַל יֹאמַר הַמֶּלֶךְ כֵּן
  choice: Der König soll so etwas nicht sagen
  rationale: אַל mit Jussiv ist eine verneinte Aufforderung. Die dritte Person und der Titel bewahren Joschafats respektvolle, höfische Redeweise; »so etwas« gibt כֵּן natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht ausdrücklich das Tetragramm. Die Wiedergabe als »Jahwe« bewahrt den Charakter als Eigenname und vermeidet, ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von רָע
  choice: Böses
  alternative: Unheil
  rationale: Die Aussage ist als Beschwerde des Königs formuliert. »Böses« wahrt die lexikalische und theologische Spannung, ohne festzulegen, ob die Weissagung moralisches Böses oder künftiges Unheil betrifft.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt klar und lebendig; Joschafats Antwort wahrt durch die Anrede in der dritten Person den höfischen Respekt. Der Fußnotenmarker [a] steht unmittelbar bei der betreffenden Wendung.
