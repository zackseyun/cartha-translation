  source_fidelity: 'Die Erzählung und die spöttische Frage sind weitgehend treffend wiedergegeben: Zedekia tritt heran, schlägt Micha auf die Wange und beansprucht den Geist Jahwes für sich. Die Präposition מֵאִתִּי („von mir“) sowie die Wegmetaphorik von אֵי זֶה עָבַר bleiben erhalten. Die Wendung לְדַבֵּר אֹתָךְ ist jedoch richtungsbezogen („zu dir reden“), nicht wechselseitig („mit dir reden“).'
  naturalness: „Da trat … heran“ und „schlug … auf die Wange“ sind natürliches modernes Erzählungsdeutsch. „Auf welchem Weg ist der Geist Jahwes von mir weggegangen, um zu dir zu reden?“ ist verständlich, würdevoll und bewahrt die absichtlich höhnische räumliche Vorstellung.
  terminology: Die geläufigen deutschen biblischen Namensformen „Zedekia“, „Kenaan“ und „Micha“ sind angemessen. „Geist Jahwes“ gibt רוּחַ יְהוָה im prophetischen Zusammenhang sachgerecht wieder; die Großschreibung legt keine zusätzliche dogmatische Deutung über den Kontext hinaus.
