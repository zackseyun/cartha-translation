  text: וַ/יִּגַּשׁ֙ צִדְקִיָּ֣הוּ בֶֽן כְּנַעֲנָ֔ה וַ/יַּכֶּ֥ה אֶת מִיכָ֖יְהוּ עַל הַ/לֶּ֑חִי וַ/יֹּ֕אמֶר אֵי זֶ֨ה עָבַ֧ר רֽוּחַ יְהוָ֛ה מֵ/אִתִּ֖/י לְ/דַבֵּ֥ר אוֹתָֽ/ךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/024.yaml
  text: Then Zedekiah son of Chenaanah came near and struck Micaiah on the cheek and said[a], “Which way did the Spirit of Yahweh pass from me to speak to you?”
translation:
  language: de
  text: 'Da trat Zedekia, der Sohn Kenaanas, heran, schlug Micha auf die Wange und sagte: »Auf welchem Weg[a] ist der Geist Jahwes von mir weggegangen, um zu dir zu reden?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wie ist der Geist Jahwes von mir weggegangen, um zu dir zu reden?“'
    reason: Die hebräische Wendung אֵי זֶה fragt wörtlich nach dem Weg, kann in diesem spöttischen Kontext jedoch auch allgemeiner nach der Weise des Übergangs fragen.
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: trat … heran
  rationale: נגשׁ bezeichnet hier das körperliche Herantreten; die Formulierung ist im Deutschen natürlich und bewahrt den konfrontativen Ton.
- source_word: צִדְקִיָּהוּ בֶן כְּנַעֲנָה
  choice: Zedekia, der Sohn Kenaanas
  rationale: Die Namen werden in ihrer im Deutschen geläufigen biblischen Form wiedergegeben; die hebräische Abstammungsangabe bleibt ausdrücklich erhalten.
- source_word: וַיַּכֶּה ... עַל הַלֶּחִי
  choice: schlug Micha auf die Wange
  rationale: נכה ist ein allgemeines Verb für schlagen. „Schlug … auf die Wange“ bleibt gegenüber dem stärker deutenden „ohrfeigte“ neutral und gibt לֶחִי regulär mit „Wange“ wieder.
- source_word: אֵי זֶה
  choice: Auf welchem Weg
  rationale: Die Wendung fragt spöttisch nach dem Weg, auf dem der Geist Zedekia verlassen und zu Micha gelangt sein soll. Die räumliche Bildhaftigkeit des Hebräischen bleibt erhalten.
- source_word: עָבַר מֵאִתִּי
  choice: ist … von mir weggegangen
  rationale: עבר bezeichnet ein Vorüber- oder Weitergehen; zusammen mit מֵאִתִּי wird die behauptete Bewegung von Zedekia weg im Deutschen verständlich ausgedrückt.
- source_word: רוּחַ יְהוָה
  choice: der Geist Jahwes
  rationale: Im prophetischen Streit ist der göttliche Geist gemeint. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, nicht durch einen Titel ersetzt.
- source_word: לְדַבֵּר אוֹתָךְ
  choice: um mit dir zu reden
  rationale: Die knappe hebräische Konstruktion bezeichnet das Reden mit beziehungsweise zu Micha. „Mit dir zu reden“ ist idiomatisches Deutsch, ohne den Inhalt der Rede zu ergänzen.
theological_decisions:
- issue: Deutung und Schreibung von רוּחַ יְהוָה
  choice: der Geist Jahwes
  alternative: der Geist des HERRN / der geist Jahwes
  rationale: Der prophetische Zusammenhang spricht für den göttlichen Geist und damit für die Großschreibung. Zugleich wird יהוה als Eigenname „Jahwe“ wiedergegeben. Zedekias Anspruch wird lediglich zitiert und nicht als wahr oder falsch vorentschieden.
- issue: Richtung der Bewegung des Geistes
  choice: von mir weggegangen, um mit dir zu reden
  alternative: von mir zu dir übergegangen
  rationale: Der Ausgangspunkt „von mir“ steht ausdrücklich im Text, während „zu dir“ nur aus dem anschließenden Reden mit Micha erschlossen wird. Die gewählte Fassung vermeidet es, diese erschlossene Zielangabe in den Wortlaut hineinzutragen.
translation_notes:
  register: Modernes, würdevolles Erzählungsdeutsch. „Trat … heran“ und „schlug … auf die Wange“ bewahren die knappe, körperlich-konfrontative Szene; die direkte Rede lässt den spöttischen räumlichen Vergleich des Hebräischen stehen.
