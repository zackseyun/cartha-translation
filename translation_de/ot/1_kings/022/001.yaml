  language: de
  text: Drei Jahre lang herrschte kein Krieg zwischen Aram und Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Sie blieben drei Jahre ohne Krieg zwischen Aram und Israel.“'
