lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: lang herrschte
  rationale: Das Verb bedeutet wörtlich „sie saßen/wohnten“, bezeichnet hier mit der Zeitangabe aber idiomatisch das Fortbestehen eines Zustands. Im Deutschen gibt „Drei Jahre lang herrschte kein Krieg“ den Sinn natürlich wieder.
- source_word: שָׁלֹשׁ שָׁנִים
  choice: Drei Jahre lang
  rationale: Die adverbiale Zeitangabe bezeichnet die Dauer des beschriebenen Zustands.
- source_word: אֵין מִלְחָמָה
  choice: kein Krieg
  rationale: Dies entspricht der hebräischen Existenzverneinung und ist im historischen Kontext klares, heutiges Deutsch.
- source_word: בֵּין ... וּבֵין
  choice: zwischen ... und ...
  rationale: Die im Hebräischen wiederholte Präposition wird im Deutschen idiomatisch nur einmal gesetzt.
- source_word: אֲרָם
  choice: Aram
  rationale: Die direkte Wiedergabe des hebräischen Eigennamens vermeidet die Gleichsetzung mit dem modernen Staat Syrien.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Gebräuchliche deutsche Form des Eigennamens.
