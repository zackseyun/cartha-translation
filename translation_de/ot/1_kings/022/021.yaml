source:
  edition: WLC
  text: וַ/יֵּצֵ֣א הָ/ר֗וּחַ וַֽ/יַּעֲמֹד֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/יֹּ֖אמֶר אֲנִ֣י אֲפַתֶּ֑/נּוּ וַ/יֹּ֧אמֶר יְהוָ֛ה אֵלָ֖י/ו בַּ/מָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/021.yaml
  text: Then the spirit came forward and stood before Yahweh and said[a], ‘I will entice him.’ And Yahweh said to him[b], ‘By what means?’
translation:
  language: de
  text: 'Da trat der Geist[a] hervor, stellte sich vor Jahwe und sagte: »Ich werde ihn verführen[b].« Jahwe sagte zu ihm: »Wodurch?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »ein Geist«. Im Hebräischen steht »der Geist«; gemeint ist wahrscheinlich eine bestimmte Geistgestalt in der himmlischen Ratsversammlung, nicht notwendigerweise der Heilige Geist.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »überreden« beziehungsweise »täuschen«. Das Verb kann ein Verführen oder Überreden bezeichnen; auf welche Weise dies geschehen soll, wird im folgenden Vers erläutert.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרוּחַ
  choice: der Geist
  rationale: Der Artikel bezeichnet in der Ratsversammlung eine bestimmte Geistgestalt. »Der Geist« wahrt diese Bestimmtheit, ohne die Gestalt ausdrücklich mit dem Heiligen Geist gleichzusetzen.
- source_word: וַיֵּצֵא
  choice: trat … hervor
  rationale: Die Grundbedeutung ist »hinaus-/herausgehen«; in der geschilderten Ratsversammlung bezeichnet die Form natürlich das Hervortreten aus der versammelten Schar.
- source_word: וַיַּעֲמֹד לִפְנֵי
  choice: stellte sich vor
  rationale: Die Wendung bezeichnet das Einnehmen eines Platzes in der Gegenwart eines Höhergestellten und passt zum förmlichen Rahmen der himmlischen Ratsversammlung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel wie »der HERR« ersetzt.
- source_word: אֲפַתֶּנּוּ
  choice: Ich werde ihn verführen
  rationale: Das Piel von פתה kann »verführen«, »überreden« oder »täuschen« bedeuten. »Verführen« bewahrt hier den Sinn eines Hinleitens zu einer verhängnisvollen Handlung, ohne die im folgenden Vers genannte Methode vorwegzunehmen.
- source_word: בַּמָּה
  choice: Wodurch?
  rationale: Die Frage zielt auf das Mittel oder die Art der Ausführung. »Wodurch?« ist knapp, idiomatisch und näher am hebräischen Ausdruck als eine ausführliche Umschreibung.
theological_decisions:
- issue: Identität von הָרוּחַ in der himmlischen Ratsversammlung
  choice: eine bestimmte Geistgestalt, im Text als »der Geist« wiedergegeben
  alternative: »der Geist« als ausdrücklicher Hinweis auf den Heiligen Geist oder die unbestimmte Wiedergabe »ein Geist«
  rationale: Die Szene schildert eine Geistgestalt, die aus der himmlischen Versammlung hervortritt. Der Artikel spricht für eine bestimmte Gestalt; der Zusammenhang verlangt jedoch keine Gleichsetzung mit dem Heiligen Geist. Die Fußnote hält diese Spannung offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen Hauptsätze bewahren den förmlichen, erzählerischen Charakter der himmlischen Ratsversammlung. »Jahwe« gibt den Gottesnamen direkt wieder; die Anführungszeichen folgen deutscher Typografie.
