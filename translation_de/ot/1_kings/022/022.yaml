revisions:
- from: 'Und er sagte: »Ich werde hinausgehen und ein Lügengeist[a] im Mund aller seiner Propheten sein.« Da sagte er: »Du wirst ihn betören[b] und wirst es auch vermögen. Geh hinaus und tu es so!«'
  to: 'Und er sagte: »Ich werde hinausgehen und ein Lügengeist[a] im Mund aller seiner Propheten sein.« Und er sagte: »Du wirst ihn verführen[b] und auch Erfolg haben. Geh hinaus und handle so!«'
  rationale: Die Revision ersetzt zwei im modernen Deutschen weniger passende Formulierungen, ohne den direkten Charakter der himmlischen Rede oder die theologische Spannung des hebräischen Textes abzuschwächen. Die Wiederholung von „Und er sagte“ folgt der hebräischen Erzählverknüpfung neutraler als „Da sagte er“.
