  text: וַ/יֹּ֗אמֶר אֵצֵא֙ וְ/הָיִ֨יתִי֙ ר֣וּחַ שֶׁ֔קֶר בְּ/פִ֖י כָּל נְבִיאָ֑י/ו וַ/יֹּ֗אמֶר תְּפַתֶּה֙ וְ/גַם תּוּכָ֔ל צֵ֖א וַ/עֲשֵׂה כֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/022.yaml
  text: And he said[a], ‘I will go out and be a lying spirit in the mouth of all his prophets.’ And he said, ‘You will entice him, and you will also prevail[b]. Go out and do so.’
translation:
  language: de
  text: 'Und er sagte: »Ich werde hinausgehen und ein Lügengeist[a] im Mund aller seiner Propheten sein.« Und er sagte: »Du wirst ihn verführen[b] und auch Erfolg haben. Geh hinaus und handle so!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein Geist der Falschheit«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »betören«, »überreden« oder »täuschen«. Das hebräische Verb kann je nach Zusammenhang diese Bedeutungsnuancen haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵצֵא
  choice: Ich werde hinausgehen
  rationale: Das Qal-Imperfekt in der 1. Person Singular bezeichnet hier die beabsichtigte künftige Handlung; »hinausgehen« bewahrt zugleich den Anklang an den folgenden Imperativ צֵא.
- source_word: וְהָיִיתִי
  choice: und … sein
  rationale: היה bezeichnet hier die Rolle, die der Geist übernehmen will. Die deutsche Konstruktion mit »werde … sein« ist natürlich und eng am Hebräischen.
- source_word: רוּחַ שֶׁקֶר
  choice: ein Lügengeist
  rationale: Die Wortverbindung bezeichnet einen Geist, der durch Lüge bzw. Falschheit gekennzeichnet ist. »Lügengeist« ist knapp, verständlich und lässt sich durch die Fußnote mit der formnäheren Alternative ergänzen.
- source_word: בְּפִי
  choice: im Mund
  rationale: Die konkrete hebräische Redeweise wird bewahrt und bezeichnet den Geist als die durch die Propheten sprechende Kraft.
- source_word: כָּל נְבִיאָיו
  choice: aller seiner Propheten
  rationale: כָּל mit dem pluralischen Substantiv und Suffix ist umfassend und bezieht sich auf die Propheten des zuvor genannten Königs.
- source_word: תְּפַתֶּה
  choice: du wirst ihn betören
  rationale: Das Piel von פתה kann verführen, überreden oder täuschen bedeuten. »Betören« hält den Aspekt verlockender Einflussnahme offen, ohne die Mehrdeutigkeit vollständig aufzulösen; das im Kontext erkennbare Objekt wird als »ihn« ausgedrückt.
- source_word: וְגַם תּוּכָל
  choice: und wirst es auch vermögen
  rationale: יכל umfasst Fähigkeit und erfolgreiches Durchsetzen. »Es vermögen« bewahrt diesen Bedeutungsspielraum genauer als eine rein erfolgsbezogene Wiedergabe.
- source_word: צֵא
  choice: Geh hinaus
  rationale: Der Imperativ greift das zuvor gebrauchte Verb יצא auf; diese verbale Entsprechung bleibt in der Übersetzung erhalten.
- source_word: וַעֲשֵׂה כֵן
  choice: und tu es so
  rationale: עשה כן fordert dazu auf, in der beschriebenen Weise zu handeln. »Tu es so« ist im Deutschen klar und bewahrt das demonstrative כן.
theological_decisions:
- issue: Göttliche Beauftragung beziehungsweise Zulassung in einer Szene der Täuschung
  choice: 'Der Dialog wird direkt wiedergegeben: Der Geist schlägt vor, als Lügengeist zu wirken, und erhält den Auftrag, hinauszugehen und entsprechend zu handeln.'
  alternative: Die Aussage als bloße Zulassung abzuschwächen oder den Bezug auf Täuschung interpretierend zu vermeiden.
  rationale: Der hebräische Wortlaut formuliert unmittelbar und lässt die theologische Spannung zwischen göttlicher Souveränität, Auftrag und dem Handeln des Geistes bestehen. Die Übersetzung löst diese Spannung nicht durch erklärende Zusätze auf.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche, aber verständliche Wendung »im Mund« bewahrt bewusst das hebräische Bild. »Betören« hält die lexikalische Mehrdeutigkeit von פתה offen; die Alternativen werden in der Fußnote genannt.
