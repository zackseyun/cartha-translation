base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/035.yaml
  text: And the battle intensified that day[a], and the king remained standing in the chariot facing Aram, and he died in the evening[c][b]; and the blood from the wound flowed into the bottom of the chariot.
translation:
  language: de
  text: An jenem Tag wurde der Kampf immer heftiger.[a] Der König wurde im Streitwagen Aram gegenüber aufrecht gehalten[b] und starb am Abend. Das Blut aus der Wunde floss in den unteren Bereich des Streitwagens.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Der Kampf stieg an«; gemeint ist, dass er an Heftigkeit zunahm.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Der König stand im Streitwagen.« Die hebräische Form kann besagen, dass er aufrecht gehalten wurde.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebräisch: »in den Schoß des Streitwagens«; gemeint ist dessen vertiefter innerer oder unterer Bereich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲלֶה הַמִּלְחָמָה
  choice: wurde der Kampf immer heftiger
  rationale: עלה bezeichnet zusammen mit »Kampf« idiomatisch dessen Steigerung. Die Formulierung gibt dies in natürlichem Deutsch wieder.
- source_word: מָעֳמָד
  choice: wurde … aufrecht gehalten
  rationale: Die passive Form legt nahe, dass der verwundete König nicht bloß stand, sondern in aufrechter Stellung gehalten wurde.
- source_word: בַּמֶּרְכָּבָה
  choice: im Streitwagen
  rationale: Dies ist die übliche und sachlich passende Bezeichnung für seine Position im Kriegswagen.
- source_word: נֹכַח אֲרָם
  choice: den Aramäern gegenüber
  rationale: נֹכַח bezeichnet die Ausrichtung gegenüber der feindlichen Seite; אֲרָם steht hier metonymisch für die aramäischen Streitkräfte.
- source_word: וַיָּמָת בָּעֶרֶב
  choice: und starb am Abend
  rationale: Die schlichte Zeitangabe wird unmittelbar und idiomatisch wiedergegeben.
- source_word: וַיִּצֶק דַּם הַמַּכָּה
  choice: Das Blut aus seiner Wunde floss
  rationale: יצק bedeutet grundsätzlich »gießen«; bei austretendem Blut gibt »floss« das konkrete Geschehen natürlich wieder. Der hebräische Genitiv wird als Herkunftsangabe verstanden.
- source_word: חֵיק הָרָכֶב
  choice: in den unteren Innenraum des Streitwagens
  rationale: חֵיק bedeutet wörtlich »Schoß/Bausch« und bezeichnet hier bildlich den vertieften inneren beziehungsweise unteren Bereich des Wagens.
