source:
  edition: WLC
  text: אָ֠ז אָמַ֞ר אֲחַזְיָ֤הוּ בֶן אַחְאָב֙ אֶל יְה֣וֹשָׁפָ֔ט יֵלְכ֧וּ עֲבָדַ֛/י עִם עֲבָדֶ֖י/ךָ בָּ/אֳנִיּ֑וֹת וְ/לֹ֥א אָבָ֖ה יְהוֹשָׁפָֽט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/050.yaml
  text: Then Ahaziah son of Ahab said to Jehoshaphat[b][a], “Let my servants go with your servants in the ships,” but Jehoshaphat was not willing.
translation:
  language: de
  text: 'Da sagte Ahasja, der Sohn Ahabs, zu Joschafat: »Lass meine Diener mit deinen Dienern auf den Schiffen fahren.« Doch Joschafat war dazu nicht bereit.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Doch Joschafat lehnte ab.« Wörtlicher heißt es, dass Joschafat nicht willens beziehungsweise nicht bereit war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Da
  rationale: Kennzeichnet in der Erzählung die zeitliche Abfolge und klingt im modernen deutschen Erzählstil natürlich.
- source_word: אֲחַזְיָהוּ בֶן אַחְאָב
  choice: Ahasja, der Sohn Ahabs
  rationale: Die Namen folgen der im Deutschen üblichen biblischen Form; die ausdrückliche Sohn-Beziehung bleibt erhalten.
- source_word: יֵלְכוּ
  choice: Lass ... fahren
  rationale: Die Verbform drückt hier eine Aufforderung beziehungsweise einen Vorschlag aus. Da es um eine Schiffsreise geht, gibt »fahren« die gemeinte Bewegung idiomatisch wieder.
- source_word: עֲבָדַי / עֲבָדֶיךָ
  choice: meine Diener / deine Diener
  rationale: עֶבֶד kann Diener, Sklave oder königlicher Bediensteter bezeichnen. »Diener« bewahrt die lexikalische Breite und die Parallelität, ohne den rechtlichen Status festzulegen.
- source_word: בָּאֳנִיּוֹת
  choice: auf den Schiffen
  rationale: Die Präposition ב steht mit אֳנִיּוֹת im Kontext der Beförderung durch Schiffe. Im Deutschen ist »auf den Schiffen fahren« die natürliche Ausdrucksweise.
- source_word: וְלֹא אָבָה
  choice: Doch ... war dazu nicht bereit
  rationale: Gibt die Grundbedeutung »nicht willens sein, nicht einwilligen« natürlich wieder, ohne sie durch das stärkere »weigerte sich« unnötig zu verschärfen.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller Erzählstil. Die direkte Rede bleibt knapp; »Diener« wahrt die soziale Unbestimmtheit des hebräischen עֶבֶד. Der Fußnotenmarker steht unmittelbar bei der betreffenden Aussage.
