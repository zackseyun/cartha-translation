  text: וַ/יֹּ֥אמֶר מֶֽלֶךְ יִשְׂרָאֵ֖ל אֶל יְהוֹשָׁפָ֑ט הֲ/לוֹא֙ אָמַ֣רְתִּי אֵלֶ֔י/ךָ לֽוֹא יִתְנַבֵּ֥א עָלַ֛/י ט֖וֹב כִּ֥י אִם רָֽע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/018.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “Did I not tell you that he would not prophesy good concerning me, but only evil?”
translation:
  language: de
  text: 'Da sagte der König von Israel zu Joschafat: „Habe ich dir nicht gesagt, dass er über mich nichts Gutes weissagen würde, sondern nur Böses[a]?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sondern nur Unheil“. Wörtlich steht im Hebräischen der scharfe Gegensatz „Gutes … sondern nur Böses“; gemeint sein kann hier eine ungünstige oder unheilvolle Weissagung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das narrative Waw führt die Handlung weiter; „Da“ gibt die zeitliche Abfolge in natürlichem Deutsch wieder.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: der König von Israel
  rationale: Die hebräische Titulierung wird beibehalten, ohne den Namen Ahab ergänzend einzusetzen.
- source_word: אֶל יְהוֹשָׁפָט
  choice: zu Joschafat
  rationale: Die Präposition kennzeichnet den Angesprochenen; ein im Hebräischen nicht vorhandener Königstitel wird nicht ergänzt.
- source_word: הֲלוֹא אָמַרְתִּי אֵלֶיךָ
  choice: Habe ich dir nicht gesagt
  rationale: Die rhetorische Frage erwartet Zustimmung und bringt den vorwurfsvollen Ton natürlich zum Ausdruck.
- source_word: לֹא יִתְנַבֵּא
  choice: dass er ... nichts ... prophezeit
  rationale: Das Imperfekt kann hier die vom König behauptete beständige beziehungsweise vorhersehbare Art von Michas Weissagungen bezeichnen. Das deutsche Präsens ist nach „gesagt“ idiomatisch und lässt diesen Aspekt offen.
- source_word: עָלַי
  choice: über mich
  rationale: 'Bei Rede und Weissagung bezeichnet עַל den Gegenstand: „über/über mich betreffend“.'
- source_word: טוֹב
  choice: Gutes
  rationale: Das substantivisch gebrauchte Adjektiv wird direkt und idiomatisch als „Gutes“ wiedergegeben.
- source_word: כִּי אִם
  choice: sondern nur
  rationale: Nach der Verneinung kennzeichnet die Wendung einen ausschließenden Gegensatz.
- source_word: רָע
  choice: Böses
  rationale: „Böses“ bewahrt den scharfen hebräischen Gegensatz zu „Gutes“, während die kontextuelle Bedeutung „Unheil“ in der Fußnote genannt wird.
theological_decisions:
- issue: Wiedergabe von רָע in der Klage über die Prophetie
  choice: Böses
  alternative: Unheil
  rationale: „Böses“ erhält das formale Gegensatzpaar טוֹב / רָע, ohne die Bedeutung vorschnell auf ein Katastrophenorakel festzulegen. Da im Kontext eine ungünstige oder unheilvolle Weissagung gemeint sein kann, wird „Unheil“ als Alternative ausgewiesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und vorwurfsvoll; der lexikalische Gegensatz „Gutes/Böses“ wird im Haupttext bewahrt.
