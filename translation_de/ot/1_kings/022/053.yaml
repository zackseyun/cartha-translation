  - severity: low
    issue: „verführen“ kann eine spezifische Methode der Einflussnahme nahelegen.
    rationale: Der Hifil von חטא bezeichnet kausativ, dass Jerobeam Israel zum Sündigen brachte. „Zur Sünde brachte“ bewahrt diese Kausalität, ohne notwendigerweise Verlockung als Mittel zu implizieren.
