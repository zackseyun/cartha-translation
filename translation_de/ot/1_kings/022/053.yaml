source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יֵּ֗לֶךְ בְּ/דֶ֤רֶךְ אָבִי/ו֙ וּ/בְ/דֶ֣רֶךְ אִמּ֔/וֹ וּ/בְ/דֶ֨רֶךְ֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/053.yaml
  text: And he did what was evil in the eyes of Yahweh and walked in the way of his father, and in the way of his mother, and in the way of Jeroboam son of Nebat, who caused Israel to sin.
translation:
  language: de
  text: Er tat, was in den Augen Jahwes böse war, und folgte dem Weg seines Vaters, dem Weg seiner Mutter und dem Weg Jerobeams, des Sohnes Nebats, der Israel zur Sünde brachte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Er tat, was … böse war
  rationale: Die geläufige Verbindung aus עשה und הָרַע bezeichnet böses Handeln. Die deutsche Formulierung bewahrt die hebräische Aussage und klingt zugleich natürlich.
- source_word: בְּעֵינֵי יְהוָה
  choice: in den Augen Jahwes
  rationale: Die bildhafte hebräische Bewertungsformel wird transparent und quellennah wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben, statt ihn durch einen Titel zu ersetzen; die Form „Jahwe“ ist im Deutschen etabliert.
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: folgte dem Weg
  rationale: Wörtlich steht „ging auf dem Weg“. „Folg­te dem Weg“ erhält das Wegbild und macht dessen Sinn als Lebensführung in natürlichem Deutsch deutlich.
- source_word: אָבִיו … אִמּוֹ
  choice: seines Vaters … seiner Mutter
  rationale: Beide ausdrücklich genannten elterlichen Vorbilder werden ohne Verkürzung bewahrt.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jerobeams, des Sohnes Nebats
  rationale: Die im Deutschen üblichen biblischen Namensformen und das hebräische Patronym werden beibehalten.
- source_word: הֶחֱטִיא אֶת־יִשְׂרָאֵל
  choice: der Israel zur Sünde verführt hatte
  rationale: Der Hifil von חטא hat kausative Bedeutung. „Zur Sünde verführt“ gibt diese verantwortlich verursachende Einflussnahme idiomatisch wieder; das Plusquamperfekt ordnet sie zeitlich vor dem beschriebenen Wandel ein.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. Die Transliteration bewahrt den Charakter als Eigenname; ein ersetzender Titel steht nicht im Konsonantentext.
- issue: Kausative Aussage über Jerobeam
  choice: der Israel zur Sünde verführt hatte
  alternative: der Israel sündigen ließ / der Israel zur Sünde brachte
  rationale: Die Wiedergabe hält an der kausativen Form fest, ohne Fragen persönlicher Verantwortung über den Wortlaut hinaus systematisch aufzulösen.
- issue: Metapher der Lebensführung
  choice: folgte dem Weg
  alternative: lebte nach dem Vorbild
  rationale: Das Wegmotiv bleibt sichtbar und wird nicht vollständig in eine abstrakte Deutung aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreifache Wiederholung von „Weg“ bildet die auffällige Struktur des Hebräischen ab; „folgte“ macht die ethische Wegmetapher verständlich, ohne sie zu beseitigen.
