  text: וּ/מֶ֣לֶךְ יִשְׂרָאֵ֡ל וִֽ/יהוֹשָׁפָ֣ט מֶֽלֶךְ יְהוּדָ֡ה יֹשְׁבִים֩ אִ֨ישׁ עַל כִּסְא֜/וֹ מְלֻבָּשִׁ֤ים בְּגָדִים֙ בְּ/גֹ֔רֶן פֶּ֖תַח שַׁ֣עַר שֹׁמְר֑וֹן וְ/כָ֨ל הַ/נְּבִיאִ֔ים מִֽתְנַבְּאִ֖ים לִ/פְנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/010.yaml
  text: The king of Israel and Jehoshaphat king of Judah were sitting[a], each on his throne, clothed in garments, at the threshing floor at the entrance of the gate of Samaria, and all the prophets were prophesying before them.
translation:
  language: de
  text: Der König von Israel und Joschafat, der König von Juda, saßen, jeder auf seinem Thron und mit Kleidern bekleidet[a], auf dem Dreschplatz am Eingang des Tores von Samaria. Alle Propheten weissagten vor ihnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mit Kleidern bekleidet“. Das Hebräische nennt die Kleidung nicht ausdrücklich königlich; der höfische Rahmen kann jedoch auf feierliche Amtskleidung hindeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֶלֶךְ יִשְׂרָאֵל
  choice: Der König von Israel
  rationale: Das einleitende ו verbindet mit dem Kontext, erfordert im Deutschen hier aber kein eigens wiedergegebenes „und“ oder „nun“.
- source_word: וִיהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: und Joschafat, der König von Juda
  rationale: Der Name und die appositionelle Herrscherbezeichnung werden klar und natürlich wiedergegeben.
- source_word: יֹשְׁבִים
  choice: saßen
  rationale: Das Partizip beschreibt die andauernde Haltung innerhalb der geschilderten Szene; das deutsche Präteritum gibt dies im Erzählzusammenhang natürlich wieder.
- source_word: אִישׁ עַל כִּסְאוֹ
  choice: jeder auf seinem Thron
  rationale: אִישׁ ist distributiv gebraucht; im königlichen Kontext bezeichnet כִּסֵּא einen Thron.
- source_word: מְלֻבָּשִׁים בְּגָדִים
  choice: in Gewänder gekleidet
  rationale: Die Formulierung bleibt nahe bei dem allgemein gehaltenen hebräischen Ausdruck und ergänzt nicht ausdrücklich „königlich“, während „Gewänder“ dem würdevollen öffentlichen Rahmen entspricht.
- source_word: בְּגֹרֶן
  choice: auf dem Dreschplatz
  rationale: גֹּרֶן bezeichnet einen Dreschplatz; „auf“ ist bei einer solchen Fläche im Deutschen idiomatisch.
- source_word: פֶּתַח שַׁעַר שֹׁמְרוֹן
  choice: am Eingang des Tores von Samaria
  rationale: Die gestufte hebräische Genitivverbindung wird formal nah und verständlich bewahrt.
- source_word: וְכָל הַנְּבִיאִים מִתְנַבְּאִים
  choice: Alle Propheten weissagten
  rationale: Das Partizip beschreibt eine gleichzeitig ablaufende prophetische Tätigkeit; „weissagten“ ist im biblischen Register geläufig und präzise.
- source_word: לִפְנֵיהֶם
  choice: vor ihnen
  rationale: Die Wendung bezeichnet sowohl die räumliche Stellung als auch das Auftreten in ihrer Gegenwart.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung „in Gewänder gekleidet“ bewahrt die bewusst allgemeine Ausdrucksweise des Hebräischen; die Fußnote hält die kontextuell mögliche, aber nicht ausdrückliche Deutung als königliche oder zeremonielle Kleidung offen.
