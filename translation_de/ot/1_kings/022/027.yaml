  text: וְ/אָמַרְתָּ֗ כֹּ֚ה אָמַ֣ר הַ/מֶּ֔לֶךְ שִׂ֥ימוּ אֶת זֶ֖ה בֵּ֣ית הַ/כֶּ֑לֶא וְ/הַאֲכִילֻ֨/הוּ לֶ֤חֶם לַ֨חַץ֙ וּ/מַ֣יִם לַ֔חַץ עַ֖ד בֹּאִ֥/י בְ/שָׁלֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/027.yaml
  text: 'and say[a], ‘Thus says the king: Put this man in the prison, and feed him with bread of affliction and water of affliction until I come in peace.’'
translation:
  language: de
  text: 'und du sollst sagen: »So spricht der König: Setzt diesen Mann ins Gefängnis und gebt ihm Brot der Bedrängnis[a] und Wasser der Bedrängnis, bis ich in Frieden zurückkomme.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »Brot der Not« und »Wasser der Not«; wahrscheinlich sind harte oder kärgliche Gefängnisrationen gemeint.'
    reason: Lexikalische Alternative und Erläuterung der hebräischen Wendung.
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: und du sollst sagen
  rationale: Gibt die an einen einzelnen Angesprochenen gerichtete, im Zusammenhang befehlende Verbform klar wieder.
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: So spricht der König
  rationale: Bewahrt die feierliche Botenformel und klingt zugleich in modernem Standarddeutsch natürlich.
- source_word: שִׂימוּ אֶת זֶה
  choice: Werft diesen Mann
  rationale: Das Demonstrativpronomen bezeichnet im Kontext Micha; „diesen Mann“ ist idiomatisch. „Werft“ bringt die schroffe Anordnung zum Ausdruck, ohne den Sinn des Einweisens ins Gefängnis zu verändern.
- source_word: בֵּית הַכֶּלֶא
  choice: ins Gefängnis
  rationale: Gibt die wörtliche Vorstellung eines „Hauses der Haft“ in geläufigem Deutsch wieder.
- source_word: וְהַאֲכִילֻהוּ
  choice: und gebt ihm
  rationale: In Verbindung mit Brot und Wasser ist „gebt ihm“ natürlicher als „füttert ihn“ und bewahrt den befehlenden Sinn.
- source_word: לֶחֶם לַחַץ
  choice: Brot der Bedrängnis
  rationale: Bewahrt die markante hebräische Genitivfügung und lässt offen, ob Not, Härte oder knappe Rationen im Vordergrund stehen.
- source_word: וּמַיִם לַחַץ
  choice: Wasser der Bedrängnis
  rationale: Erhält die Parallelität zu „Brot der Bedrängnis“ und die Mehrdeutigkeit des Ausdrucks.
- source_word: עַד בֹּאִי בְשָׁלוֹם
  choice: bis ich wohlbehalten zurückkomme
  rationale: Gibt die kontextuelle Bedeutung einer unversehrten Rückkehr idiomatisch wieder; „zurückkomme“ entspricht im Deutschen dem gemeinten Wiederkommen.
theological_decisions:
- issue: Bedeutung von בְשָׁלוֹם in Ahabs Aussage
  choice: wohlbehalten
  alternative: in Frieden; sicher
  rationale: „Wohlbehalten“ bezeichnet eine sichere, unversehrte Rückkehr, ohne den Ausgang des Feldzugs als politischen Frieden oder Erfolg festzulegen. Die erzählerische Ironie bleibt bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit feierlicher Botenformel. Die ungewöhnliche Parallelwendung „Brot der Bedrängnis und Wasser der Bedrängnis“ bleibt bewusst erhalten und wird durch eine knappe Fußnote erläutert.
