  text: So the king died and was brought to Samaria[a], and they buried the king in Samaria.
translation:
  language: de
  text: So starb der König und wurde nach Samaria gebracht[a]. Man begrub den König in Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und der König starb, und er kam nach Samaria“. Gemeint ist, dass der Leichnam des Königs nach seinem Tod nach Samaria gebracht wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: So starb
  rationale: Das Qal-Wayyiqtol von מות bezeichnet in der Erzählfolge den Eintritt des Todes. „So starb“ schließt natürlich an den vorausgehenden Zusammenhang an.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Der bestimmte Ausdruck bezeichnet den aus dem Zusammenhang bekannten König Ahab; die Bezeichnung des hebräischen Textes wird beibehalten, ohne den Eigennamen einzusetzen.
- source_word: וַיָּבֹא שֹׁמְרוֹן
  choice: wurde nach Samaria gebracht
  rationale: 'Wörtlich steht ein aktives Verb im Singular: „und er kam nach Samaria“. Da der König bereits gestorben ist, bezeichnet die Wendung im Zusammenhang die Überführung seines Leichnams. Das deutsche Passiv gibt diesen Sinn natürlich wieder; die formale Besonderheit wird in einer Fußnote ausgewiesen.'
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Übliche deutsche Form des Ortsnamens.
- source_word: וַיִּקְבְּרוּ
  choice: begrub man
  rationale: Die dritte Person Plural hat ein unbestimmtes Subjekt. Das deutsche „man“ bewahrt diese Unbestimmtheit idiomatisch.
- source_word: אֶת הַמֶּלֶךְ
  choice: den König
  rationale: Die Wiederholung des Substantivs wird entsprechend dem Hebräischen beibehalten und nicht durch ein Pronomen ersetzt.
- source_word: בְּשֹׁמְרוֹן
  choice: Dort
  rationale: „Dort“ nimmt das unmittelbar zuvor genannte Samaria eindeutig als Ort der Bestattung auf und vermeidet eine im Deutschen schwerfällige Wiederholung.
