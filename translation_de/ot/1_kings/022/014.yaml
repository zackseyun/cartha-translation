  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר מִיכָ֑יְהוּ חַי יְהוָ֕ה כִּ֠י אֶת אֲשֶׁ֨ר יֹאמַ֧ר יְהוָ֛ה אֵלַ֖/י אֹת֥/וֹ אֲדַבֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/014.yaml
  text: And Micaiah said[a], “As Yahweh lives, whatever Yahweh says to me, that I will speak.”
translation:
  language: de
  text: 'Micha sagte: „So wahr Jahwe lebt: Was Jahwe zu mir sagt, das werde ich sagen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: Die Wayyiqtol-Form führt im fortlaufenden Erzählzusammenhang Michas direkte Rede ein; im modernen Deutschen genügt dafür das Präteritum ohne ein zusätzliches „und“.
- source_word: מִיכָיְהוּ
  choice: Micha
  rationale: Die im Deutschen eingebürgerte Namensform ist natürlich und eindeutig.
- source_word: חַי יְהוָה
  choice: So wahr Jahwe lebt
  rationale: Diese idiomatische deutsche Schwurformel bewahrt den feierlichen und verpflichtenden Charakter des hebräischen Ausdrucks.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כִּי אֶת אֲשֶׁר
  choice: Was
  rationale: Die Konstruktion leitet den Inhalt des Schwurs ein; „was“ gibt den freien Relativsatz im Deutschen klar und natürlich wieder.
- source_word: יֹאמַר ... אֵלַי
  choice: zu mir sagt
  rationale: Das Präsens ist in einem freien Relativsatz idiomatisch und kann die noch ausstehende göttliche Mitteilung einschließen.
- source_word: אֹתוֹ
  choice: das
  rationale: Das wiederaufnehmende Pronomen bezieht sich ausdrücklich auf den vorausgehenden Relativsatz; die Korrespondenz „Was …, das …“ bildet die hebräische Hervorhebung gut ab.
- source_word: אֲדַבֵּר
  choice: werde ich verkünden
  rationale: Im prophetischen Kontext bezeichnet דבר hier das öffentliche Aussprechen der empfangenen Botschaft; „verkünden“ ist natürlich und bewahrt den feierlichen Aussagecharakter.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. „Jahwe“ wahrt diesen Unterschied gegenüber dem Titel „Herr“ und vermeidet eine konfessionelle Deutung.
- issue: Bindung des Propheten an die göttliche Botschaft
  choice: „Was Jahwe zu mir sagt, das werde ich verkünden“
  alternative: „Was Jahwe mir zu sagen gebietet, werde ich verkünden“
  rationale: Die Übersetzung bleibt bei der Aussage des Textes, dass Micha nur die empfangene Mitteilung aussprechen wird, und ergänzt keinen ausdrücklich formulierten Befehl.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Schwurformel bleibt feierlich; die „Was …, das …“-Konstruktion bewahrt die emphatische Wiederaufnahme des Hebräischen, ohne hölzern zu wirken.
