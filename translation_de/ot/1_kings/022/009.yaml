  verdict: revise
  source_fidelity: 'Die Wiedergabe trifft den Sinn des Hebräischen insgesamt: Der König lässt einen einzelnen Hofbediensteten rufen und befiehlt mit Dringlichkeit, Micha zu holen. „Hofbeamter“ gibt סָרִיס im Kontext angemessen wieder; die Bedeutungsalternative ist korrekt vermerkt.'
  naturalness: „Da rief der König von Israel einen Hofbeamten“ ist verständlich, klingt ohne Richtungsangabe jedoch etwas unidiomatisch. „ließ ... rufen“ ist im modernen deutschen Erzählstil für das Herbeirufen eines Bediensteten natürlicher. „Hol schnell“ ist zwar möglich, aber etwas umgangssprachlicher als der sonst würdige Registerton; „Bring ... schnell her“ verbindet idiomatisches Deutsch mit der gebotenen Dringlichkeit.
  terminology: Für מִיכָיְהוּ ist in deutschen Bibelübersetzungen und im deutschen biblischen Namensgebrauch „Micha“ die geläufige Form. „Michaja“ ist eine mögliche stärker hebräisierende Umschrift, aber hier weniger etabliert. „Jimla“ bleibt als Genitivform „Jimlas“ korrekt. Die Fußnote zu סָרִיס ist sachlich und hinreichend neutral.
