base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/009.yaml
  text: Then the king of Israel called one officer and said[a], “Bring Micaiah son of Imlah quickly.”
translation:
  language: de
  text: 'Da ließ der König von Israel einen Hofbeamten[a] rufen und sagte: »Bring Micha, den Sohn Jimlas, schnell her!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann „Eunuch“ oder allgemeiner „Hofbeamter“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: rief
  rationale: קרא bezeichnet hier das Herbeirufen bzw. Ansprechen eines königlichen Bediensteten. „rief“ ist im deutschen Erzählstil natürlich und wahrt den Anschluss der Wayyiqtol-Form.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: der König von Israel
  rationale: Die Status-constructus-Verbindung wird im Deutschen unmittelbar und bestimmt wiedergegeben.
- source_word: אֶל סָרִיס אֶחָד
  choice: einen Hofbeamten
  rationale: סָרִיס kann einen Eunuchen oder allgemeiner einen königlichen Amtsträger bezeichnen. Im vorliegenden Handlungskontext steht seine Funktion am Hof im Vordergrund; die mögliche engere Bedeutung wird in der Fußnote bewahrt.
- source_word: מַהֲרָה
  choice: schnell
  rationale: Die imperativisch-adverbiale Form drückt Dringlichkeit aus. Da im Hebräischen neben „schnell/eile“ kein ausdrückliches Verb für das Holen steht, ergänzt idiomatisches Deutsch „Hol“ aus dem Kontext.
- source_word: מִיכָיְהוּ
  choice: Michaja
  rationale: „Michaja“ ist die etablierte deutsche Form des hebräischen Personennamens.
- source_word: בֶן יִמְלָה
  choice: den Sohn Jimlas
  rationale: Die Patronymangabe wird in natürlichem Deutsch appositiv wiedergegeben; der bestimmte Artikel macht die Beziehung zum zuvor genannten Michaja eindeutig.
