    rationale: Die geläufige deutsche biblische Namensform für מִיכָיְהוּ in 1 Könige 22 ist „Micha“. Eine Umstellung verbessert Konsistenz mit dem deutschen Standardgebrauch, ohne die Namensidentität zu verändern.
  - severity: low
    issue: Formulierung „rief ... einen Hofbeamten“
    rationale: Sie ist nicht falsch, aber „ließ einen Hofbeamten rufen“ gibt die höfisch-administrative Handlung im Deutschen natürlicher wieder.
  - severity: low
    issue: „Hol schnell“ im direkten Befehl
    rationale: Die Wendung ist korrekt, wirkt aber leicht umgangssprachlich. „Bring ... schnell her“ wahrt die Dringlichkeit von מַהֲרָה in einem würdigeren modernen Register.
