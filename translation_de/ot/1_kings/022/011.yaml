  source_fidelity: 'Die Satzstruktur und das Zeichenbild sind weitgehend zutreffend wiedergegeben: Zedekia fertigt sich eiserne Hörner an, und die Formel »So spricht der HERR« entspricht כה אמר יהוה. »Aram« ist richtig als historische Bezeichnung beibehalten. Das Suffix in עַד כַּלּוֹתָם ist jedoch Plural und bezieht sich am natürlichsten auf die Angehörigen bzw. Streitkräfte Arams; »bis du es vernichtet hast« nivelliert dies zu einem Singular.'
  naturalness: Der Text ist flüssiges, würdevolles modernes Standarddeutsch. »Mit diesen wirst du Aram niederstoßen« ist als Fortführung des Hornbildes verständlich und idiomatisch.
  terminology: »Zedekia«, »Kenaanas«, »eiserne Hörner«, »Aram« und »der HERR« sind angemessen. Die Großschreibung von HERR markiert den Gottesnamen in etablierter deutscher Bibelkonvention.
