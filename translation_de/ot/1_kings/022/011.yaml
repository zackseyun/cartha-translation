  text: וַ/יַּ֥עַשׂ ל֛/וֹ צִדְקִיָּ֥ה בֶֽן כְּנַעֲנָ֖ה קַרְנֵ֣י בַרְזֶ֑ל וַ/יֹּ֨אמֶר֙ כֹּֽה אָמַ֣ר יְהוָ֔ה בְּ/אֵ֛לֶּה תְּנַגַּ֥ח אֶת אֲרָ֖ם עַד כַּלֹּתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/011.yaml
  text: 'Then Zedekiah son of Chenaanah made for himself horns of iron and said, “Thus says the LORD: With these you will gore Aram until you have finished them off.”'
translation:
  language: de
  text: 'Da machte sich Zedekia, der Sohn Kenaanas, eiserne Hörner und sagte: »So spricht der HERR: Mit diesen wirst du Aram niederstoßen, bis du sie vernichtet hast.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַרְנֵי בַרְזֶל
  choice: eiserne Hörner
  rationale: Gibt das konkrete prophetische Zeichenbild direkt und idiomatisch wieder.
- source_word: תְּנַגַּח
  choice: wirst du … niederstoßen
  rationale: Das Verb bezeichnet das Stoßen mit Hörnern; »niederstoßen« bewahrt das Bild und passt zum angekündigten Sieg.
- source_word: אֲרָם
  choice: Aram
  rationale: Bewahrt die historische Bezeichnung des aramäischen Reiches statt sie mit einer späteren geografischen Bezeichnung gleichzusetzen.
- source_word: עַד כַּלֹּתָם
  choice: bis du es vernichtet hast
  rationale: Die Verbform mit Suffix bezeichnet hier das vollständige Aufreiben Arams; der deutsche Singular bezieht sich auf das als Einheit verstandene Aram.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: der HERR
  alternative: JHWH / Jahwe
  rationale: Die traditionelle deutsche Wiedergabe »der HERR« ist im modernen Bibeldeutsch verständlich und würdig; die Großschreibung kennzeichnet den Gottesnamen.
- issue: Prophetische Botenformel כֹּה אָמַר יְהוָה
  choice: So spricht der HERR
  alternative: So hat der HERR gesprochen
  rationale: Bewahrt die feststehende prophetische Formel im Deutschen, ohne die später im Kontext erkennbare Bewertung der Aussage vorwegzunehmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die anschauliche Hornmetaphorik und die direkte Rede bleiben erhalten; »Kenaanas« folgt der üblichen deutschen Flexion des Namens.
