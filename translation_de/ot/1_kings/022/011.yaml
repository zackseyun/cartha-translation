    rationale: Das hebräische כַּלּוֹתָם bedeutet wörtlich etwa »bis zu ihrem Aufreiben/Ende« und enthält ein pluralisches Objektssuffix. Das deutsche Singularpronomen »es« legt Aram ausschließlich als abstraktes Einzelgebilde aus. »sie« bewahrt die vom Hebräischen nahegelegte kollektive bzw. personale Referenz und die verbleibende Auslegungsweite.
