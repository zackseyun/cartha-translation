  text: וְ/יֶ֨תֶר דִּבְרֵ֧י יְהוֹשָׁפָ֛ט וּ/גְבוּרָת֥/וֹ אֲשֶׁר עָשָׂ֖ה וַ/אֲשֶׁ֣ר נִלְחָ֑ם הֲ/לֹֽא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/046.yaml
  text: The rest of the acts of Jehoshaphat[a], and his might that he showed, and how he fought—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: de
  text: Die übrigen Taten Joschafats, seine Machttaten, die er vollbrachte, und wie er Krieg führte – sind sie nicht im Buch der Annalen der Könige von Juda aufgezeichnet?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seine Macht, die er erwies«. Das Hebräische verbindet »seine Macht« mit »die er tat«; damit kann erwiesene Tatkraft oder Tapferkeit gemeint sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יְהוֹשָׁפָט
  choice: Was sonst noch über Joschafat zu berichten ist
  rationale: Die feste königliche Schlussformel bezeichnet die übrigen Taten beziehungsweise Begebenheiten der Regierungszeit. Die deutsche Wendung gibt den historiografischen Sinn natürlich wieder.
- source_word: וּגְבוּרָתוֹ אֲשֶׁר עָשָׂה
  choice: seine Machttaten, die er vollbrachte
  rationale: גְּבוּרָה kann Macht, Tapferkeit oder machtvolle Taten bezeichnen. Zusammen mit עָשָׂה ist eine auf erwiesene Tatkraft bezogene Wiedergabe idiomatisch; die Fußnote bewahrt die wörtlichere Alternative.
- source_word: וַאֲשֶׁר נִלְחָם
  choice: und darüber, wie er Krieg führte
  rationale: Das Nifal von לחם bedeutet hier kämpfen beziehungsweise Krieg führen. Die Formulierung erfasst die zusammenfassende Rückschau auf seine militärische Tätigkeit.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: steht das nicht ... geschrieben?
  rationale: Die rhetorische Frage der hebräischen Quellenformel bleibt erhalten; der deutsche Singular fasst die zuvor genannten Inhalte kollektiv zusammen.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: im Buch der Chronik der Könige von Juda
  rationale: Dies gibt den Titel der zitierten königlichen Annalen verständlich und traditionsnah wieder, ohne ihn mit dem kanonischen Buch der Chronik gleichzusetzen.
