review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Vorhersage, die Zeitangabe und den Zweck des Sichverbergens im Wesentlichen zutreffend wieder. „Dich ... zurückziehst“ legt bei תבוא jedoch stärker einen Rückzug aus als das hebräische Verb „kommen/gehen/eintreten“ selbst ausdrückt. Die Wendung חֶדֶר בְּחֶדֶר sollte als räumlich-idiomatische Wiederholung erkennbar bleiben, ohne die Richtung des Rückzugs zusätzlich zu interpretieren.
  naturalness: „Von Zimmer zu Zimmer begibst“ ist modernes, gut verständliches Standarddeutsch und bewahrt die Bewegung durch bzw. in aufeinanderfolgende Räume. „Siehe“ ist in diesem knappen prophetischen Ausspruch ein angemessenes, nicht künstlich archaisches Signal für הִנְּךָ.
  terminology: „Michaja“ ist die geläufige deutsche Namensform. „Zimmer“ ist hier als moderne Wiedergabe von חֶדֶר vertretbar. Die Fußnote soll die Alternative vorsichtig als mögliche Deutung kennzeichnen, nicht als feststehende Bedeutung behaupten.
  issues:
  - severity: low
    issue: „zurückziehst“ ist im Haupttext interpretierend.
    rationale: Das Verb תבוא bezeichnet primär Kommen, Gehen oder Eintreten. Der Kontext des Versteckens legt zwar einen Rückzug nahe, doch dieser ist besser durch den Zweckinfinitiv ausgedrückt als zusätzlich im Bewegungsverb.
  - severity: low
    issue: Die Fußnote formuliert die räumliche Deutung zu bestimmt.
    rationale: Die Wiederholung חֶדֶר בְּחֶדֶר kann ein Vordringen in innere Räume oder eine Bewegung von Raum zu Raum ausdrücken. „Gemeint ist“ schränkt diese Mehrdeutigkeit unnötig ein.
  revised_text: 'Und Michaja sagte: „Siehe, du wirst es an jenem Tag sehen, wenn du dich von Zimmer zu Zimmer begibst, um dich zu verstecken.“'
  revised_footnotes:
  - marker: a
    text: 'Oder: „wenn du in ein inneres Zimmer gehst“. Wörtlich steht „Zimmer in Zimmer“; die Wiederholung kann das Vordringen in innere Räume oder eine Bewegung von Zimmer zu Zimmer bezeichnen.'
