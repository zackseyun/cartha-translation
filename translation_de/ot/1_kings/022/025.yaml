  text: And Micaiah said[a], “Behold, you will see on that day when you go into an inner room to hide.”
translation:
  language: de
  text: 'Und Michaja sagte: „Siehe, du wirst es an jenem Tag sehen, wenn du dich von Zimmer zu Zimmer begibst, um dich zu verstecken.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und … sagte
  rationale: Der Wayyiqtol führt die Erzählung fort; „Und … sagte“ gibt den hebräischen Erzählfluss schlicht wieder.
- source_word: מִיכָיְהוּ
  choice: Michaja
  rationale: Die im Deutschen geläufige biblische Namensform wird verwendet.
- source_word: הִנְּךָ רֹאֶה
  choice: du wirst es … sehen
  rationale: Die Verbindung aus הִנְּךָ und Partizip hat hier angesichts der zukünftigen Zeitangabe voraussagende Bedeutung. Ein eigenes „Siehe“ wäre im heutigen Deutsch schwerfällig; die hervorhebende Wirkung kommt durch die direkte Ankündigung zur Geltung.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Natürliche und zugleich würdige Wiedergabe der hebräischen Zeitangabe.
- source_word: אֲשֶׁר תָּבֹא
  choice: wenn du dich … zurückziehst
  rationale: אֲשֶׁר bezeichnet hier den Zeitpunkt; בוא beschreibt im Zusammenhang mit dem Verstecken das Hineingehen beziehungsweise den Rückzug in Räume.
- source_word: חֶדֶר בְּחֶדֶר
  choice: von einem Zimmer ins andere
  rationale: Die Wiederholung von חֶדֶר vermittelt eine Bewegung weiter nach innen beziehungsweise durch aufeinanderfolgende Räume. Die Formulierung bewahrt diese Bildhaftigkeit, ohne eine einzige mögliche räumliche Deutung festzuschreiben.
- source_word: לְהֵחָבֵה
  choice: um dich zu verstecken
  rationale: Der Infinitiv bezeichnet den Zweck; im Deutschen wird der auf die angesprochene Person bezogene Sinn natürlich reflexiv ausgedrückt.
