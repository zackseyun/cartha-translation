base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/044.yaml
  text: However[a], the high places were not removed[b]; the people still were sacrificing and burning incense on the high places.
translation:
  language: de
  text: Doch die Höhenheiligtümer[a] wurden nicht beseitigt; das Volk brachte weiterhin auf den Höhenheiligtümern Opfer dar und verbrannte Räucherwerk.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Höhen“. Der hebräische Ausdruck bezeichnet örtliche Kultstätten, die oft auf Anhöhen lagen.'
    reason: lexical_alternative
  - marker: b
    text: Der Vers sagt nicht ausdrücklich, ob diese Handlungen dem HERRN an nicht zugelassenen Kultstätten galten oder anderen Gottheiten.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: Doch
  rationale: Kennzeichnet knapp und natürlich den Gegensatz zur vorangehenden positiven Beurteilung des Königs.
- source_word: הַבָּמוֹת / בַּבָּמוֹת
  choice: die Höhenheiligtümer / auf den Höhenheiligtümern
  rationale: בָּמוֹת bezeichnet lokale Kultstätten, häufig auf Anhöhen. „Höhenheiligtümer“ bewahrt den historischen Kultbegriff und ist im modernen Deutsch verständlicher als das wörtlichere „Höhen“.
- source_word: לֹא סָרוּ
  choice: wurden nicht beseitigt
  rationale: Bei den Kultstätten als Subjekt bedeutet die Wendung, dass sie bestehen blieben. Die passive Form gibt den gemeinten Sinn im Deutschen idiomatisch wieder.
- source_word: עוֹד
  choice: weiterhin
  rationale: Drückt die fortdauernde, gewohnheitsmäßige Praxis aus.
- source_word: הָעָם
  choice: das Volk
  rationale: Direkte kollektive Bezeichnung der Bevölkerung.
- source_word: מְזַבְּחִים
  choice: brachte Opfer dar
  rationale: Die Partizipialform bezeichnet hier eine fortgesetzte beziehungsweise gewohnheitsmäßige Handlung; zusammen mit „weiterhin“ wird dieser Aspekt natürlich wiedergegeben.
- source_word: וּמְקַטְּרִים
  choice: und verbrannte Räucherwerk
  rationale: Im kultischen Zusammenhang bezeichnet קטר gewöhnlich das Verbrennen von Räucherwerk beziehungsweise das Aufsteigenlassen von Opferrauch. Die gewählte Formulierung entspricht der geläufigen Bedeutung in der stereotypen Wendung des Königsbuchs.
theological_decisions:
- issue: Art der Verehrung auf den Höhenheiligtümern
  choice: Der Vers wird beschreibend übersetzt, ohne den Empfänger der Opfer zu bestimmen.
  alternative: Die Opfer galten entweder dem HERRN an nicht autorisierten Kultstätten oder anderen Gottheiten im Rahmen synkretistischer beziehungsweise götzendienerischer Praxis.
  rationale: Der hebräische Text nennt nur das Opfern und Räuchern auf den Höhenheiligtümern. Er missbilligt deren Fortbestand, legt hier aber nicht ausdrücklich fest, wem die Opfer galten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „Höhenheiligtümern“ folgt dem hebräischen Text; „weiterhin“ gibt den fortdauernden Charakter der Partizipien wieder.
