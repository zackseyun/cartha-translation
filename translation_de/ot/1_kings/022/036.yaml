source:
  edition: WLC
  text: וַ/יַּעֲבֹ֤ר הָ/רִנָּה֙ בַּֽ/מַּחֲנֶ֔ה כְּ/בֹ֥א הַ/שֶּׁ֖מֶשׁ לֵ/אמֹ֑ר אִ֥ישׁ אֶל עִיר֖/וֹ וְ/אִ֥ישׁ אֶל אַרְצֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/036.yaml
  text: And a cry passed through the camp at sunset[a], saying, “Each man to his city[b], and each man to his land!”
translation:
  language: de
  text: 'Bei Sonnenuntergang ging ein Ruf durch das Lager[a]: »Jeder Mann in seine Stadt und jeder Mann in sein Land!«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Da ging der Ruf durch das Lager« beziehungsweise »Da verbreitete sich ein lauter Ruf im Lager«. Das hebräische Wort רִנָּה bezeichnet oft einen lauten, weithin hörbaren Ruf oder Schrei; hier ist damit die Bekanntmachung im ganzen Lager gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Jeder Mann in seine Stadt und jeder Mann in sein Land.« Dies ist eine formelhafte Aufforderung, nach dem Kampf heimzukehren.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: ging … durch
  rationale: Das Verb עבר bezeichnet hier, wie sich der Ruf durch das Lager bewegt bzw. ausbreitet. »ging … durch« bewahrt das konkrete Bild und klingt im Deutschen natürlich.
- source_word: הָרִנָּה
  choice: ein Ruf
  rationale: רִנָּה kann einen lauten, weithin hörbaren Ruf oder Schrei bezeichnen. Im Kontext handelt es sich um die im ganzen Lager verbreitete Aufforderung, nicht um einen Jubelruf; »Ruf« bleibt passend neutral.
- source_word: בַּמַּחֲנֶה
  choice: durch das Lager
  rationale: Die Präposition bedeutet für sich genommen »im Lager«; zusammen mit עבר ergibt sich jedoch eine Bewegung bzw. Ausbreitung durch das Lager.
- source_word: כְּבֹא הַשֶּׁמֶשׁ
  choice: Bei Sonnenuntergang
  rationale: Die Wendung mit בוא und »Sonne« ist eine übliche Bezeichnung für den Sonnenuntergang. Die Übersetzung ist knapp, idiomatisch und zeitlich hinreichend offen.
- source_word: לֵאמֹר
  choice: durch Doppelpunkt und direkte Rede wiedergegeben
  rationale: Der Infinitiv führt den Inhalt des Rufes ein. Im Deutschen übernimmt der Doppelpunkt vor der direkten Rede diese Funktion natürlicher als ein zusätzliches »sagend«.
- source_word: אִישׁ ... וְאִישׁ
  choice: Jeder Mann … und jeder Mann
  rationale: Die Wiederholung von אִישׁ hat distributive Kraft. »Mann« bleibt erhalten, weil es sich um eine formelhafte Aufforderung an die am Kampf beteiligten Männer handelt.
- source_word: אֶל עִירוֹ
  choice: in seine Stadt
  rationale: עִיר bezeichnet gewöhnlich eine Stadt oder Ortschaft. Nach einer Aufforderung zur Rückkehr ist im Deutschen »in seine Stadt« idiomatischer als »zu seiner Stadt«.
- source_word: וְאִישׁ אֶל אַרְצוֹ
  choice: und jeder Mann in sein Land
  rationale: אֶרֶץ kann hier das jeweilige Heimatgebiet oder Land bezeichnen. »Land« wahrt die Bedeutungsbreite und den Parallelismus zur Stadt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe, formelhafte Struktur der militärischen Aufforderung und die Wiederholung »jeder Mann« bleiben erhalten; der Doppelpunkt gibt לֵאמֹר idiomatisch wieder.
