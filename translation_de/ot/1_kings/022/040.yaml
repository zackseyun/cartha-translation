base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/040.yaml
  text: And Ahab slept with his fathers[a], and Ahaziah his son became king in his place.
translation:
  language: de
  text: Und Ahab legte sich zu seinen Vätern[a], und sein Sohn Ahasja wurde an seiner Stelle König.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „legte sich zu seinen Vätern“; eine übliche königliche Formel dafür, dass er starb.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: legte sich
  rationale: Bewahrt zusammen mit „zu seinen Vätern“ die formelhafte hebräische Umschreibung des Todes, ohne sie im Haupttext auf das interpretierende „starb“ zu reduzieren.
- source_word: עִם אֲבֹתָיו
  choice: zu seinen Vätern
  rationale: Die traditionelle deutsche Wendung gibt die königliche Todesformel und ihren dynastischen Charakter wieder; im Deutschen ist „zu“ in dieser festen biblischen Formulierung natürlicher als das wörtliche „mit“.
- source_word: וַיִּמְלֹךְ
  choice: wurde König
  rationale: Bezeichnet hier den Regierungsantritt und nicht lediglich die Dauer der Herrschaft.
- source_word: תַּחְתָּיו
  choice: an seiner Stelle
  rationale: Drückt die Nachfolge im selben königlichen Amt präzise und natürlich aus.
- source_word: אַחְאָב
  choice: Ahab
  rationale: Der Personenname folgt der im Deutschen etablierten biblischen Namensform.
- source_word: אֲחַזְיָהוּ
  choice: Ahasja
  rationale: Der Personenname folgt der im Deutschen etablierten biblischen Namensform.
- source_word: בְנוֹ
  choice: sein Sohn
  rationale: Bewahrt die ausdrückliche Angabe der dynastischen Beziehung.
