  text: וַ/יְהִ֗י כִּ/רְאוֹת֙ שָׂרֵ֣י הָ/רֶ֔כֶב כִּֽי לֹא מֶ֥לֶךְ יִשְׂרָאֵ֖ל ה֑וּא וַ/יָּשׁ֖וּבוּ מֵ/אַחֲרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/033.yaml
  text: And it happened[a], when the commanders of the chariots saw that he was not the king of Israel, they turned back from pursuing him.
translation:
  language: de
  text: Als die Befehlshaber der Streitwagen sahen, dass er nicht der König von Israel war, ließen sie von ihm ab.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „sie kehrten von hinter ihm zurück“; die hebräische Wendung bedeutet hier, dass sie ihm nicht weiter folgten oder ihn nicht weiter verfolgten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: Als … sahen
  rationale: Die Verbindung aus וַיְהִי und dem mit כְּ gebildeten Infinitiv leitet hier den nächsten Erzählvorgang samt zeitlichem Nebensatz ein. Im Deutschen gibt „Als … sahen“ diese Funktion natürlich wieder, ohne die hebräische Erzählungsformel schwerfällig nachzubilden.
- source_word: שָׂרֵי הָרֶכֶב
  choice: die Befehlshaber der Streitwagen
  rationale: שָׂרֵי bezeichnet militärische Führer; הָרֶכֶב kann die Streitwagen beziehungsweise die Streitwagentruppe bezeichnen. Die gewählte Formulierung ist nah am Wortlaut und im Zusammenhang verständlich.
- source_word: כִּי לֹא מֶלֶךְ יִשְׂרָאֵל הוּא
  choice: dass er nicht der König von Israel war
  rationale: כִּי führt hier den Inhalt ihrer Wahrnehmung ein; das maskuline Pronomen הוּא verweist auf den verfolgten Mann.
- source_word: וַיָּשׁוּבוּ מֵאַחֲרָיו
  choice: ließen sie von ihm ab
  rationale: Wörtlich beschreibt die Wendung ein Umkehren „hinter ihm her“ beziehungsweise „von hinter ihm weg“. Im militärischen Kontext bedeutet sie, dass die Befehlshaber die Verfolgung oder den Angriff auf ihn einstellten.
