  source_fidelity: 'Der Entwurf gibt die hebräische Königsnotiz vollständig und zutreffend wieder: die formelhafte Wendung „legte sich zu seinen Vorfahren“, die Bestattung bei den Vorfahren in der Stadt Davids, Davids genealogische Beziehung zu Joschafat sowie Jorams Thronfolge „an seiner Stelle“. Das Passiv „wurde ... begraben“ und „wurde ... König“ entsprechen den hebräischen Verbformen und dem Kontext des Regierungsantritts.'
  naturalness: Modernes, würdiges Standarddeutsch. Die bewusst formelhafte Formulierung „legte sich zu seinen Vorfahren“ ist mit der Fußnote verständlich und angemessen; „bei seinen Vorfahren“ ist im Bestattungskontext idiomatisch.
  terminology: Die Namensformen Joschafat und Joram sind im deutschen Bibelgebrauch etabliert. „Stammvater“ gibt אָבִיו in diesem genealogischen Zusammenhang sachgerecht wieder, ohne David fälschlich als unmittelbaren Vater zu bezeichnen. Die Fußnoten sind korrekt verankert und erläutern genau die beiden Übersetzungsentscheidungen.
