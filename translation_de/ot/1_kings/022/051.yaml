  text: וַ/יִּשְׁכַּ֤ב יְהֽוֹשָׁפָט֙ עִם אֲבֹתָ֔י/ו וַ/יִּקָּבֵר֙ עִם אֲבֹתָ֔י/ו בְּ/עִ֖יר דָּוִ֣ד אָבִ֑י/ו וַ/יִּמְלֹ֛ךְ יְהוֹרָ֥ם בְּנ֖/וֹ תַּחְתָּֽי/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/051.yaml
  text: And Jehoshaphat slept with his fathers and was buried with his fathers in the city of David his father[b][a], and Jehoram his son became king in his place.
translation:
  language: de
  text: Joschafat legte sich zu seinen Vorfahren[a] und wurde bei seinen Vorfahren in der Stadt Davids, seines Stammvaters,[b] begraben. Sein Sohn Joram wurde an seiner Stelle König.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „legte sich zu seinen Vätern“; eine feste hebräische Wendung für das Sterben.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort für „Vater“ kann in genealogischer Sprache auch einen Vorfahren oder Stammvater bezeichnen.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: legte sich zu seinen Vorfahren
  rationale: Die königliche Todesformel wird bildhaft bewahrt, während „Vorfahren“ im heutigen Deutsch natürlicher und sachlich genauer ist als „Väter“.
- source_word: וַיִּקָּבֵר
  choice: wurde begraben
  rationale: Das hebräische Nifal wird als natürliches deutsches Passiv wiedergegeben.
- source_word: בְּעִיר דָּוִד
  choice: in der Stadt Davids
  rationale: Die Konstruktion wird eng am Hebräischen und zugleich idiomatisch wiedergegeben.
- source_word: אָבִיו
  choice: seines Stammvaters
  rationale: David war nicht Joschafats unmittelbarer Vater. „Stammvater“ gibt den weiteren genealogischen Bedeutungsumfang von אָב verständlich wieder, ohne die dynastische Beziehung zu verwischen.
- source_word: וַיִּמְלֹךְ
  choice: wurde ... König
  rationale: Das Verb bezeichnet hier den Regierungsantritt in der Nachfolge Joschafats.
- source_word: תַּחְתָּיו
  choice: an seiner Stelle
  rationale: Die Wendung bezeichnet die Nachfolge im Königsamt und entspricht der räumlichen Metapher des Hebräischen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Todesformel bleibt erkennbar, wird aber mit „Vorfahren“ für heutige Leser verständlich formuliert. Die Namensform „Joram“ entspricht dem gebräuchlichen deutschen Bibelgebrauch für יְהוֹרָם.
