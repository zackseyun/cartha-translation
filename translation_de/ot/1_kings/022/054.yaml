base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/054.yaml
  text: He served Baal and bowed down to him[a], and he provoked Yahweh, the God of Israel, just as his father had done.
translation:
  language: de
  text: Er diente dem Baal und warf sich vor ihm nieder[a] und reizte Jahwe, den Gott Israels, zum Zorn, ganz wie es sein Vater getan hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „betete ihn an“; das hebräische Verb bezeichnet wörtlich das Niederbeugen oder Niederwerfen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹד
  choice: diente
  rationale: עבד bedeutet grundlegend „dienen“ und bezeichnet hier den kultischen Dienst für Baal. „Diente“ bewahrt den Bezug zum konkreten Gottesdienst und lässt die folgende Niederwerfung als eigene Handlung stehen.
- source_word: הַבַּעַל
  choice: dem Baal
  rationale: Obwohl im Hebräischen der Artikel steht, ist „Baal“ im Deutschen in diesem Zusammenhang die natürliche Wiedergabe des Gottesnamens beziehungsweise Titels.
- source_word: וַיִּשְׁתַּחֲוֶה לוֹ
  choice: warf sich vor ihm nieder
  rationale: Das Verb bezeichnet das Niederbeugen oder Sich-Niederwerfen, häufig als Verehrungshandlung. Die konkrete Körperhandlung bleibt erhalten, ohne sie mit „diente“ zusammenzuziehen.
- source_word: וַיַּכְעֵס
  choice: reizte … zum Zorn
  rationale: Der Hifil von כעס drückt aus, dass jemand Zorn hervorruft. Die deutsche Wendung gibt diese kausative Bedeutung klar und idiomatisch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, sodass der persönliche Name des Gottes Israels im Gegensatz zu Baal sichtbar bleibt.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: den Gott Israels
  rationale: Die Status-constructus-Verbindung wird direkt und natürlich wiedergegeben.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה אָבִיו
  choice: ganz wie es sein Vater getan hatte
  rationale: Die Formulierung bewahrt die vergleichende Aussage und gibt sie in natürlichem modernem Deutsch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Text stellt den namentlich bezeichneten Gott Israels Baal gegenüber. „Jahwe“ erhält diesen Gegensatz und gibt den Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von וַיִּשְׁתַּחֲוֶה לוֹ
  choice: konkrete Niederwerfung mit kultischer Bedeutung
  alternative: betete ihn an
  rationale: Das hebräische Verb kann allgemein eine Niederwerfung und im Kontext eine Verehrungshandlung bezeichnen. Die Hauptübersetzung bewahrt das konkrete Bild; die Fußnote nennt die funktionale Bedeutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sich vor jemandem niederwerfen“ bewahrt das konkrete hebräische Bild; „zum Zorn reizen“ gibt die kausative Verbform klar wieder.
