    rationale: נִקְרָע und וְנִשְׁפַּךְ stehen nach הִנֵּה als Partizipien und beschreiben in diesem Kontext das unmittelbar sichtbare Bestätigungszeichen. Deutsches Präsenspassiv bewahrt diese Nähe besser als »wird ... werden«.
  - severity: low
    issue: »Zeichen dafür, dass Jahwe gesprochen hat« erweitert die knappe hebräische Formulierung.
    rationale: Das Hebräische bezeichnet das Zeichen, das Jahwe gesprochen bzw. angekündigt hat. Eine direkte Relativkonstruktion ist präziser und natürlicher.
  - severity: low
    issue: Die Fußnote zu Opferasche legt »fetthaltig« zu kategorisch fest.
    rationale: דֶּשֶׁן ist im Opferkontext die Altarasche bzw. die Verbrennungsreste; die Verbindung mit fetthaltigen Resten ist eine mögliche nähere Erklärung, sollte aber nicht als zwingende stoffliche Definition erscheinen.
