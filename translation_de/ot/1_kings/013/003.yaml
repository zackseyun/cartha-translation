  text: וְ/נָתַן֩ בַּ/יּ֨וֹם הַ/ה֤וּא מוֹפֵת֙ לֵ/אמֹ֔ר זֶ֣ה הַ/מּוֹפֵ֔ת אֲשֶׁ֖ר דִּבֶּ֣ר יְהוָ֑ה הִנֵּ֤ה הַ/מִּזְבֵּ֨חַ֙ נִקְרָ֔ע וְ/נִשְׁפַּ֖ךְ הַ/דֶּ֥שֶׁן אֲשֶׁר עָלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/003.yaml
  text: 'And on that day he gave a sign[a], saying, “This is the sign that Yahweh has spoken: behold, the altar will be torn apart[b], and the ashes that are on it will be poured out.”'
translation:
  language: de
  text: 'An jenem Tag gab er ein Zeichen[a] und sagte: »Dies ist das Zeichen, das Jahwe angekündigt hat: Sieh, der Altar wird aufgerissen, und die Opferasche[b], die darauf liegt, wird ausgeschüttet.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wunderzeichen« oder »Vorzeichen« (hebräisch מוֹפֵת).'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet im Opferkontext die Asche vom Altar und kann auch die fetthaltigen Verbrennungsreste der Opfer einschließen.
    reason: cultural_note
lexical_decisions:
- source_word: וְנָתַן
  choice: gab er
  rationale: נתן bedeutet grundsätzlich »geben, setzen, hinstellen«. In Verbindung mit מוֹפֵת gibt »ein Zeichen geben« die hebräische Wendung natürlich und sachgerecht wieder.
- source_word: מוֹפֵת
  choice: Zeichen
  rationale: Das Wort kann ein Zeichen, Wunderzeichen oder Vorzeichen bezeichnen. Hier bestätigt es unmittelbar das prophetische Wort; »Zeichen« wahrt diese Funktion, ohne den Wundercharakter unnötig zu verstärken.
- source_word: דִּבֶּר יְהוָה
  choice: dass Jahwe gesprochen hat
  rationale: Der Perfekt bezeichnet das bereits ergangene Gotteswort, dessen Bestätigung nun angekündigt wird. Der deutsche Perfektsatz ist in diesem Zusammenhang natürlich.
- source_word: הִנֵּה
  choice: Sieh
  rationale: »Sieh« bewahrt die aufmerksamkeitslenkende und feierliche Kraft der deiktischen Partikel in einer heute verständlichen Form.
- source_word: נִקְרָע
  choice: wird aufgerissen werden
  rationale: Der Nifal drückt ein passives Geschehen aus; im prophetischen Zusammenhang ist eine deutsche Zukunftsform angemessen. »Aufgerissen« erhält die kräftige Bedeutung von קרע.
- source_word: וְנִשְׁפַּךְ
  choice: wird ausgeschüttet werden
  rationale: Der Nifal von שׁפך bedeutet »ausgegossen/verschüttet werden«. Bei Asche auf einem Altar ist »ausgeschüttet« im Deutschen anschaulich und idiomatisch.
- source_word: הַדֶּשֶׁן
  choice: Opferasche
  rationale: דֶּשֶׁן bezeichnet hier nicht bloß gewöhnliche Asche, sondern die fetthaltigen Verbrennungsreste der Opfer. »Opferasche« ist verständlich und bewahrt den kultischen Zusammenhang.
- source_word: אֲשֶׁר עָלָיו
  choice: die darauf liegt
  rationale: Die relative Fügung bezeichnet die auf dem Altar befindliche Opferasche. Der deutsche Singular folgt dem Kollektivum »Opferasche«.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. »Jahwe« gibt ihn in der im modernen Deutschen üblichen wissenschaftlichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Zeitbezug der angekündigten Zeichenhandlung
  choice: 'Futur: »wird … werden«'
  alternative: 'Präsent: »wird aufgerissen / ist aufgerissen«'
  rationale: Die hebräischen Nifalformen können formal als Partizipien verstanden werden, beschreiben hier aber das unmittelbar bevorstehende bestätigende Zeichen. Das Futur macht diesen prophetischen Bezug deutlich, ohne die Aussage umzudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt prophetisch-feierlich, ohne unnötig altertümliche Wendungen. »Sieh« erhält die Funktion von הִנֵּה; »Opferasche« macht den kultischen Kontext knapp verständlich.
