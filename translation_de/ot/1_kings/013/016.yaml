translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp und bestimmt; die hebräische Wiederholung wird soweit möglich bewahrt, während »weder … noch« eine natürliche deutsche Koordination schafft.
