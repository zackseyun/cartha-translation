source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר לֹ֥א אוּכַ֛ל לָ/שׁ֥וּב אִתָּ֖/ךְ וְ/לָ/ב֣וֹא אִתָּ֑/ךְ וְ/לֹֽא אֹ֣כַל לֶ֗חֶם וְ/לֹֽא אֶשְׁתֶּ֤ה אִתְּ/ךָ֙ מַ֔יִם בַּ/מָּק֖וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/016.yaml
  text: And he said[a], “I cannot return with you or go with you, and I will not eat bread or drink water with you in this place.”
translation:
  language: de
  text: 'Da sagte er[a]: »Ich kann nicht mit dir zurückkehren oder mit dir gehen. Ich werde an diesem Ort weder Brot essen noch Wasser mit dir trinken.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht bei den ersten beiden Vorkommen von »mit dir« eine feminine Form, beim Essen und Trinken dagegen eine maskuline Form. Im Deutschen lässt sich dieser Geschlechtsunterschied nicht wiedergeben.
    reason: Der unerwartete Wechsel des grammatischen Geschlechts im überlieferten hebräischen Text ist übersetzungsrelevant und im Haupttext nicht sichtbar.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte er
  rationale: Das narrative Wayyiqtol führt die direkte Rede fort. »Da sagte er« klingt im modernen Deutschen natürlich, ohne dem ו eine stärkere logische Bedeutung aufzuzwingen.
- source_word: לֹא אוּכַל
  choice: Ich kann nicht
  rationale: Die verneinte Imperfektform von יכל bezeichnet hier Unvermögen beziehungsweise eine bindende Unmöglichkeit; »Ich kann nicht« gibt dies knapp und idiomatisch wieder.
- source_word: לָשׁוּב
  choice: zurückkehren
  rationale: שׁוב bedeutet hier, den Weg mit der angesprochenen Person zurückzugehen; »zurückkehren« bewahrt diesen Richtungssinn.
- source_word: וְלָבוֹא
  choice: oder … gehen
  rationale: בוא kann je nach Perspektive »kommen«, »gehen« oder »eintreten« bedeuten. Im Deutschen passt angesichts der Aufforderung, die andere Person zu begleiten, »gehen« am natürlichsten; ein Eintreten wird vom hebräischen Ausdruck nicht zwingend ausgesagt.
- source_word: וְלֹא אֹכַל לֶחֶם
  choice: Ich werde … weder Brot essen
  rationale: Die Zukunftsform gibt die erklärte Weigerung im Kontext wieder. »Brot« bleibt entsprechend dem wiederholten Wortlaut des Abschnitts wörtlich erhalten.
- source_word: וְלֹא אֶשְׁתֶּה ... מַיִם
  choice: noch Wasser … trinken
  rationale: Die deutsche Paarformel »weder … noch« verbindet die beiden verneinten Handlungen natürlich und bewahrt »Wasser« wörtlich.
- source_word: אִתָּךְ / אִתְּךָ
  choice: mit dir
  rationale: Beide Formen bedeuten »mit dir«; das Deutsche unterscheidet beim Pronomen der zweiten Person Singular nicht zwischen feminin und maskulin. Der auffällige Wechsel im Hebräischen wird in einer Fußnote vermerkt.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: an diesem Ort
  rationale: Die Wendung gibt die Ortsangabe präzise und in würdigem, natürlichem Deutsch wieder.
