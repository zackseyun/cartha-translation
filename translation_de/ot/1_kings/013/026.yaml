  text: וַ/יִּשְׁמַ֣ע הַ/נָּבִיא֮ אֲשֶׁ֣ר הֱשִׁיב֣/וֹ מִן הַ/דֶּרֶךְ֒ וַ/יֹּ֨אמֶר֙ אִ֣ישׁ הָ/אֱלֹהִ֣ים ה֔וּא אֲשֶׁ֥ר מָרָ֖ה אֶת פִּ֣י יְהוָ֑ה וַ/יִּתְּנֵ֨/הוּ יְהוָ֜ה לָ/אַרְיֵ֗ה וַֽ/יִּשְׁבְּרֵ֨/הוּ֙ וַ/יְמִתֵ֔/הוּ כִּ/דְבַ֥ר יְהוָ֖ה אֲשֶׁ֥ר דִּבֶּר לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/026.yaml
  text: When the prophet who had brought him back from the way heard it[a], he said, “It is the man of God who rebelled against the word of Yahweh; therefore Yahweh gave him to the lion, and it mauled him and killed him, according to the word of Yahweh that he spoke to him.”
translation:
  language: de
  text: 'Als der Prophet, der ihn vom Weg zurückgebracht hatte, davon hörte, sagte er: »Das ist der Mann Gottes, der sich dem Wort Jahwes widersetzt hat.[a] Darum hat Jahwe ihn dem Löwen ausgeliefert; der hat ihn zerschmettert und getötet, gemäß dem Wort Jahwes, das er zu ihm gesprochen hatte.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »der sich dem Mund Jahwes widersetzt hat«; gemeint ist sein ausgesprochenes Wort oder sein Befehl.'
    reason: Bewahrt die konkrete hebräische Ausdrucksweise von פִּי יהוה und erläutert ihre idiomatische Bedeutung, ohne den Haupttext unnötig wörtlich zu machen.
lexical_decisions:
- source_word: הֱשִׁיבוֹ מִן הַדֶּרֶךְ
  choice: der ihn vom Weg zurückgebracht hatte
  rationale: Bewahrt den kausativen Sinn des Hifil von שוב und das wiederkehrende Weg-Motiv der Erzählung in natürlichem Deutsch.
- source_word: אִישׁ הָאֱלֹהִים
  choice: der Mann Gottes
  rationale: Die etablierte und kontextgerechte Wiedergabe der titelartigen Bezeichnung für den von Gott beauftragten Propheten.
- source_word: מָרָה אֶת־פִּי יְהוָה
  choice: sich dem Befehl Jahwes widersetzt hat
  rationale: מרה bezeichnet widerspenstigen Ungehorsam; die wörtliche Wendung »Mund Jahwes« meint hier den von Jahwe ausgesprochenen Befehl. Die Formulierung wahrt den personalen Widerstand, ohne im Deutschen unverständlich zu klingen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt das Tetragramm als persönlichen Gottesnamen wieder statt es durch einen Titel zu ersetzen.
- source_word: וַיִּתְּנֵהוּ ... לָאַרְיֵה
  choice: hat ihn dem Löwen ausgeliefert
  rationale: נתן mit ל bezeichnet hier die Übergabe in die Gewalt des Löwen; »ausgeliefert« ist im Deutschen klar und idiomatisch.
- source_word: וַיִּשְׁבְּרֵהוּ
  choice: der hat ihn zerschmettert
  rationale: שבר bedeutet grundsätzlich »brechen, zerschmettern« und beschreibt hier die tödliche Gewalt des Löwen. Die Wiedergabe bleibt näher am hebräischen Bild als das allgemeinere »zerfleischt«.
- source_word: וַיְמִתֵהוּ
  choice: und getötet
  rationale: Das Hifil von מות bedeutet direkt »töten«.
- source_word: כִּדְבַר יְהוָה אֲשֶׁר דִּבֶּר לוֹ
  choice: wie Jahwe es ihm angekündigt hatte
  rationale: Bringt idiomatisch zum Ausdruck, dass das Geschehen dem zuvor an ihn ergangenen Wort Jahwes entsprach; das Plusquamperfekt verdeutlicht den Rückbezug.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen; »Jahwe« erhält diese Unterscheidung gegenüber einem bloßen Titel.
- issue: Bedeutung von פִּי יְהוָה
  choice: dem Befehl Jahwes
  alternative: dem Wort Jahwes / dem Mund Jahwes
  rationale: »Mund Jahwes« ist eine konkrete hebräische Redeweise für das, was Jahwe ausgesprochen und geboten hat. »Befehl« passt zum Erzählkontext, während die Fußnote die Bildlichkeit und mögliche Alternative offenlegt.
- issue: Handeln Jahwes und des Löwen
  choice: Jahwe liefert aus; der Löwe zerschmettert und tötet
  alternative: Jahwe gibt ihn dem Löwen, und dieser zerfleischt und tötet ihn
  rationale: Die grammatische Abfolge und die ausdrückliche Zuschreibung an Jahwe bleiben erhalten, ohne die Spannung zwischen göttlichem Gericht und tierischem Vollzug abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Davon hörte« nimmt idiomatisch die Nachricht aus dem vorigen Vers auf. Der Gottesname wird als »Jahwe« wiedergegeben; »Mann Gottes« bleibt als feste narrative Bezeichnung erhalten.
