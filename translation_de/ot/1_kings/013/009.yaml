  text: כִּֽי כֵ֣ן צִוָּ֣ה אֹתִ֗/י בִּ/דְבַ֤ר יְהוָה֙ לֵ/אמֹ֔ר לֹא תֹ֥אכַל לֶ֖חֶם וְ/לֹ֣א תִשְׁתֶּה מָּ֑יִם וְ/לֹ֣א תָשׁ֔וּב בַּ/דֶּ֖רֶךְ אֲשֶׁ֥ר הָלָֽכְתָּ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/009.yaml
  text: For this is what he commanded me by the word of the LORD, saying, ‘You shall not eat bread, nor drink water, nor return by the way that you went.’
translation:
  language: de
  text: 'Denn so wurde mir durch das Wort des HERRN befohlen: »Du sollst kein Brot essen und kein Wasser trinken und nicht auf dem Weg zurückkehren, den du gegangen bist.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי כֵן
  choice: Denn so
  rationale: Gibt die begründende Funktion von כִּי und die rückverweisende Bedeutung von כֵן knapp und natürlich wieder.
- source_word: צִוָּה אֹתִי
  choice: wurde mir befohlen
  rationale: Das Hebräische hat wörtlich »er befahl mir«; die Passivform bewahrt im Deutschen den unausgesprochenen Handelnden, ohne ihn eigenmächtig zu bestimmen.
- source_word: בִּדְבַר יְהוָה
  choice: durch das Wort des HERRN
  rationale: בְּ wird instrumental wiedergegeben; der Gottesname יהוה folgt der etablierten deutschen Bibelkonvention als HERR in Kapitälchen.
- source_word: לֶחֶם
  choice: Brot
  rationale: Direkte und kontextgemäße Entsprechung.
- source_word: בַּדֶּרֶךְ אֲשֶׁר הָלָכְתָּ
  choice: auf dem Weg, den du gegangen bist
  rationale: Bewahrt das allgemeine Bewegungsverb הלך als »gehen« und vermeidet die engere Deutung »auf dem du gekommen bist«.
theological_decisions:
- issue: Identität des Befehlenden in צִוָּה
  choice: 'Passiv: »wurde mir ... befohlen«'
  alternative: »er befahl mir« oder »der HERR befahl mir«
  rationale: Das Verb steht zwar maskulin Singular, doch das Subjekt wird in diesem Satz nicht ausdrücklich genannt. Die passive deutsche Form vermeidet sowohl ein unklares Pronomen als auch eine ausdrückliche Ergänzung des Gottesnamens.
translation_notes:
  register: Modernes, würdiges Standarddeutsch; die direkte Rede bleibt knapp und gebotsartig. Keine Fußnoten erforderlich.
