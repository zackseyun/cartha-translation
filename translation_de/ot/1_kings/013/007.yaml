  text: Then the king said to the man of God[a], “Come home with me and eat, and I will give you a gift.”
translation:
  language: de
  text: 'Da sagte der König zu dem Mann Gottes: „Komm mit mir nach Hause und iss etwas; ich will dir ein Geschenk geben.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Da sagte
  rationale: Das Narrativ-Waw führt die Handlung weiter; „Da sagte“ gibt diese Abfolge im modernen deutschen Erzählstil natürlich wieder.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Direkte Wiedergabe des bestimmten Substantivs.
- source_word: אִישׁ הָאֱלֹהִים
  choice: Mann Gottes
  rationale: Bewahrt die feste hebräische Bezeichnung, ohne sie deutend durch „Prophet“ zu ersetzen.
- source_word: בֹּאָה
  choice: Komm
  rationale: Natürliche Wiedergabe des Imperativs; das paragogische He muss im Deutschen nicht eigens ausgedrückt werden.
- source_word: אִתִּי הַבַּיְתָה
  choice: mit mir nach Hause
  rationale: Die Richtungsendung an הַבַּיְתָה bezeichnet die Bewegung zum Haus hin; im Zusammenhang einer Einladung ist „nach Hause“ idiomatisch.
- source_word: וּסְעָדָה
  choice: und stärke dich
  rationale: סעד bezeichnet das Stärken oder Erquicken, hier wahrscheinlich durch eine Mahlzeit. „Stärke dich“ bewahrt den weiteren Sinn des Verbs und bleibt im Kontext verständlich.
- source_word: וְאֶתְּנָה לְךָ
  choice: ich will dir … geben
  rationale: Gibt die kohortative Form als angekündigtes Angebot natürlich wieder.
- source_word: מַתָּת
  choice: ein Geschenk
  rationale: Neutrale Wiedergabe für eine Gabe oder ein Präsent; „Belohnung“ würde einen im Hebräischen nicht ausdrücklich bezeichneten Vergütungscharakter eintragen.
