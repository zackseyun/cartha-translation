  - severity: low
    issue: Die Fußnote verwendet „sich ... erhalten“.
    rationale: Diese Formulierung ist im Deutschen hier semantisch und stilistisch unklar. Eine Erklärung mit „sich stärken oder erquicken“ gibt den lexikalischen Spielraum verständlicher wieder.
