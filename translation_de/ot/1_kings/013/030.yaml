source:
  edition: WLC
  text: וַ/יַּנַּ֥ח אֶת נִבְלָת֖/וֹ בְּ/קִבְר֑/וֹ וַ/יִּסְפְּד֥וּ עָלָ֖י/ו ה֥וֹי אָחִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/030.yaml
  text: And he laid his corpse in his own tomb[a], and they mourned over him, saying, “Alas[b], my brother!”
translation:
  language: de
  text: 'Dann legte er seinen Leichnam in sein eigenes Grab, und sie hielten die Totenklage um ihn: »Ach, mein Bruder!«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Mein Bruder« ist wahrscheinlich eine feste Klageformel, die Verbundenheit ausdrückt; sie muss keine leibliche Verwandtschaft bezeichnen.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּנַּח
  choice: legte
  rationale: Die Hifil-Form von נוח bedeutet hier, etwas niederzulegen bzw. an einen Ort zu bringen; »legte« ist im Bestattungskontext natürlich und quellennah.
- source_word: נִבְלָתוֹ
  choice: seinen Leichnam
  rationale: נְבֵלָה bezeichnet den toten Körper. »Leichnam« wahrt die deutliche Todesreferenz, ohne die bei Menschen unpassende Härte von »Kadaver«.
- source_word: בְּקִבְרוֹ
  choice: in sein eigenes Grab
  rationale: קֶבֶר kann Grab oder Grabstätte bedeuten. Das Possessivsuffix bezieht sich im Kontext auf das Grab des alten Propheten; »eigenes« macht diesen Bezug im Deutschen klar.
- source_word: וַיִּסְפְּדוּ
  choice: sie hielten die Totenklage
  rationale: ספד bezeichnet das Klagen um einen Verstorbenen, häufig als förmliche Totenklage. Die Wendung gibt diesen kulturellen und rituellen Gehalt präzise wieder.
- source_word: עָלָיו
  choice: um ihn
  rationale: עַל steht mit ספד für die Person, um die geklagt wird; idiomatisches Deutsch verlangt hier »um ihn«.
- source_word: הוֹי
  choice: Ach
  rationale: הוֹי ist hier ein Klageruf. »Ach« klingt im modernen Deutschen natürlich und vermeidet die mögliche Gerichts- oder Unheilsbedeutung von »Wehe«.
- source_word: אָחִי
  choice: mein Bruder
  rationale: אָח bedeutet wörtlich »Bruder« und kann in einer Totenklage Verbundenheit oder Solidarität ausdrücken; die familiäre Bildsprache bleibt erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Totenklage halten« bewahrt den formellen Bestattungskontext; der direkte Klageruf bleibt knapp und emotional.
