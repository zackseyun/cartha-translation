base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/024.yaml
  text: And he went[a], and a lion found him on the road and killed him. And his corpse was cast on the road, and the donkey was standing beside it, and the lion was standing beside the corpse.
translation:
  language: de
  text: Da ging er fort. Unterwegs traf ihn ein Löwe und tötete ihn. Sein Leichnam lag hingeworfen auf dem Weg[a]; der Esel stand daneben, und der Löwe stand neben dem Leichnam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sein Leichnam war auf dem Weg hingeworfen.“ Das hebräische passive Partizip betont, dass der Leichnam dort hingeworfen lag, nicht nur, dass er dort lag.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Da ging er fort
  rationale: Die deutsche Erzählfolge wird natürlich weitergeführt; „fort“ verdeutlicht den Aufbruch, ohne den hebräischen Ausdruck inhaltlich zu erweitern.
- source_word: וַיִּמְצָאֵהוּ אַרְיֵה
  choice: traf ihn ein Löwe
  rationale: מצא bedeutet grundsätzlich „finden“, kann bei einer Begegnung unterwegs im Deutschen jedoch natürlich mit „treffen“ wiedergegeben werden. Die Erstnennung des Löwen bleibt unbestimmt.
- source_word: בַּדֶּרֶךְ
  choice: unterwegs / auf dem Weg
  rationale: Beim Zusammentreffen ist „unterwegs“ idiomatisch; beim Leichnam bezeichnet derselbe Ausdruck den konkreten Ort und wird daher mit „auf dem Weg“ wiedergegeben.
- source_word: וַיְמִיתֵהוּ
  choice: und tötete ihn
  rationale: Der Hifil von מות bezeichnet hier unmittelbar das Verursachen des Todes; „tötete“ ist präzise und schlicht.
- source_word: נִבְלָתוֹ
  choice: sein Leichnam
  rationale: נבלה bezeichnet den toten Körper. „Leichnam“ wahrt den ernsten Erzählton und ist für einen Menschen angemessener als „Kadaver“.
- source_word: מֻשְׁלֶכֶת
  choice: lag hingeworfen
  rationale: Die Verbindung aus „lag“ und dem resultativen „hingeworfen“ ergibt im Deutschen ein klares Szenenbild und bewahrt zugleich die passive Aussage des hebräischen Partizips.
- source_word: וְהַחֲמוֹר עֹמֵד אֶצְלָהּ
  choice: der Esel stand daneben
  rationale: Das Partizip beschreibt den andauernden Zustand. „Daneben“ bezieht sich eindeutig auf den unmittelbar zuvor genannten Leichnam und vermeidet das unnatürliche „neben ihm“.
- source_word: וְהָאַרְיֵה עֹמֵד אֵצֶל הַנְּבֵלָה
  choice: der Löwe stand neben dem Leichnam
  rationale: Die Wiederholung von „Leichnam“ entspricht der ausdrücklichen Wiederaufnahme des Nomens im Hebräischen; „stand“ gibt das szenisch beschreibende Partizip natürlich wieder.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Erzählsprache. Kurze Hauptsätze erhalten die knappe Dramatik des Hebräischen; das auffällige Stillstehen von Esel und Löwe neben dem Leichnam bleibt unverändert hervorgehoben.
