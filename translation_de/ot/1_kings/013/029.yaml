source:
  edition: WLC
  text: וַ/יִּשָּׂ֨א הַ/נָּבִ֜יא אֶת נִבְלַ֧ת אִישׁ הָ/אֱלֹהִ֛ים וַ/יַּנִּחֵ֥/הוּ אֶֽל הַ/חֲמ֖וֹר וַ/יְשִׁיבֵ֑/הוּ וַ/יָּבֹ֗א אֶל עִיר֙ הַ/נָּבִ֣יא הַ/זָּקֵ֔ן לִ/סְפֹּ֖ד וּ/לְ/קָבְרֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/029.yaml
  text: Then the prophet lifted up the corpse of the man of God and laid it on the donkey and brought it back[a]. And he came to the city of the old prophet to mourn and to bury him.
translation:
  language: de
  text: Da hob der Prophet den Leichnam des Mannes Gottes auf, legte ihn auf den Esel und brachte ihn zurück. Dann kam er in die Stadt des alten Propheten, um ihn zu beklagen[a] und zu begraben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um über ihn zu trauern“. Das hebräische Verb kann besonders die Totenklage bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: hob … auf
  rationale: נשׂא bezeichnet hier das konkrete Aufheben des Leichnams; die deutsche Verbklammer gibt die Handlung natürlich und präzise wieder.
- source_word: הַנָּבִיא
  choice: der Prophet
  rationale: Der bestimmte Ausdruck verweist im Erzählzusammenhang auf den alten Propheten, der den Leichnam gefunden hat.
- source_word: נִבְלַת
  choice: den Leichnam
  rationale: נְבֵלָה bezeichnet einen toten Körper. „Leichnam“ ist im Deutschen präzise, würdig und weniger grob als „Leiche“.
- source_word: אִישׁ הָאֱלֹהִים
  choice: des Mannes Gottes
  rationale: Die etablierte biblische Bezeichnung bleibt erhalten und gibt den hebräischen Titel formal wie idiomatisch wieder.
- source_word: וַיַּנִּחֵהוּ אֶל הַחֲמוֹר
  choice: legte ihn auf den Esel
  rationale: Der Hifil von נוח bedeutet hier „hinlegen/platzieren“. Das maskuline Pronomen „ihn“ kann sich im Deutschen natürlich auf „Leichnam“ beziehen.
- source_word: וַיְשִׁיבֵהוּ
  choice: brachte ihn zurück
  rationale: Der Hifil von שׁוב bedeutet „zurückbringen“. Das Pronomen bewahrt den persönlichen Bezug zum verstorbenen Mann Gottes, ohne die Bedeutung auf einen bloßen Gegenstand zu verengen.
- source_word: וַיָּבֹא אֶל עִיר הַנָּבִיא הַזָּקֵן
  choice: Dann kam er in die Stadt des alten Propheten
  rationale: Die Konstruktion bezeichnet am natürlichsten die Stadt, in der der alte Prophet wohnte. „kam … in“ gibt בוא mit אֶל in flüssigem Deutsch wieder.
- source_word: הַזָּקֵן
  choice: alten
  rationale: Das Wort bezeichnet hier das Alter und unterscheidet diesen Propheten vom Mann Gottes; es ist kein Amtstitel.
- source_word: לִסְפֹּד
  choice: zu beklagen
  rationale: ספד bezeichnet das Trauern um einen Verstorbenen, oft ausdrücklich durch Totenklage. „beklagen“ wahrt diese konkretere Nuance.
- source_word: וּלְקָבְרוֹ
  choice: und zu begraben
  rationale: קבר bedeutet schlicht „begraben“; das Suffix bezieht sich auf den Mann Gottes.
