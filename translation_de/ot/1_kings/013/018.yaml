  text: וַ/יֹּ֣אמֶר ל֗/וֹ גַּם אֲנִ֣י נָבִיא֮ כָּמוֹ/ךָ֒ וּ/מַלְאָ֡ךְ דִּבֶּ֣ר אֵלַ/י֩ בִּ/דְבַ֨ר יְהוָ֜ה לֵ/אמֹ֗ר הֲשִׁבֵ֤/הוּ אִתְּ/ךָ֙ אֶל בֵּיתֶ֔/ךָ וְ/יֹ֥אכַל לֶ֖חֶם וְ/יֵ֣שְׁתְּ מָ֑יִם כִּחֵ֖שׁ לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/018.yaml
  text: And he said to him[a], “I also am a prophet like you, and an angel spoke to me by the word of Yahweh, saying, ‘Bring him back with you to your house, that he may eat bread and drink water.’” But he lied to him.
translation:
  language: de
  text: 'Da sagte er zu ihm: »Auch ich bin ein Prophet wie du. Ein Engel[a] hat durch das Wort Jahwes zu mir gesprochen: ›Bring ihn mit dir zurück in dein Haus, damit er Brot isst und Wasser trinkt.‹« Doch er log ihn an.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Bote«. Das hebräische Wort kann sowohl einen Engel als auch einen menschlichen Boten bezeichnen.'
    reason: Lexikalische Mehrdeutigkeit von מַלְאָךְ.
lexical_decisions:
- source_word: נָבִיא
  choice: Prophet
  rationale: Die übliche und kontextgemäße Wiedergabe für einen Menschen, der als Gottes Sprecher auftritt.
- source_word: מַלְאָךְ
  choice: Engel
  rationale: Das Wort kann einen menschlichen oder himmlischen Boten bezeichnen. Im Zusammenhang mit der behaupteten Offenbarung liegt »Engel« nahe; die weiter gefasste Alternative wird in einer Fußnote bewahrt.
- source_word: דִּבֶּר אֵלַי
  choice: hat zu mir gesprochen
  rationale: Gibt die direkte Mitteilung natürlich und ohne zusätzliche Deutung wieder.
- source_word: בִּדְבַר יְהוָה
  choice: durch das Wort Jahwes
  rationale: Bewahrt sowohl die instrumentale Präposition als auch die im Hebräischen ausdrücklich genannte göttliche Mitteilung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Eigennamen Gottes in der im Deutschen geläufigen Form wieder.
- source_word: הֲשִׁיבֵהוּ
  choice: Bring ihn … zurück
  rationale: 'Die Hifil-Form von שוב ist kausativ: Der Angesprochene soll den Mann zur Rückkehr veranlassen beziehungsweise ihn zurückbringen.'
- source_word: אִתְּךָ אֶל־בֵּיתֶךָ
  choice: mit dir zurück in dein Haus
  rationale: Bewahrt Begleitung und Ziel der Bewegung in natürlichem Deutsch.
- source_word: וְיֹאכַל לֶחֶם
  choice: damit er Brot isst
  rationale: Die Verbform bezeichnet hier den beabsichtigten Zweck der Rückkehr; »Brot essen« erhält die konkrete hebräische Wendung.
- source_word: וְיֵשְׁתְּ מָיִם
  choice: und Wasser trinkt
  rationale: Gibt den mit dem Brotessen verbundenen Zweck schlicht und parallel wieder.
- source_word: כִּחֵשׁ לוֹ
  choice: Doch er log ihn an
  rationale: Das Verb bezeichnet falsches Reden beziehungsweise Täuschung; »anlügen« ist hier direkt und idiomatisch. »Doch« macht den vom Erzähler offengelegten Gegensatz deutlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm; die Wiedergabe als »Jahwe« bewahrt den Eigennamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Identität des מַלְאָךְ
  choice: Engel
  alternative: Bote
  rationale: Der Offenbarungskontext legt einen himmlischen Boten nahe, doch das hebräische Wort selbst entscheidet nicht eindeutig zwischen »Engel« und »Bote«. Deshalb bleibt die Alternative in der Fußnote sichtbar.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Die gestaffelten deutschen Anführungszeichen machen die Rede innerhalb der Rede deutlich. Der abschließende Erzählerkommentar bleibt knapp und entlarvt die Behauptung unmittelbar.
