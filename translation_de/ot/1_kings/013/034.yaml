  text: וַ/יְהִי֙ בַּ/דָּבָ֣ר הַ/זֶּ֔ה לְ/חַטַּ֖את בֵּ֣ית יָרָבְעָ֑ם וּ/לְ/הַכְחִיד֙ וּ/לְ/הַשְׁמִ֔יד מֵ/עַ֖ל פְּנֵ֥י הָ/אֲדָמָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/034.yaml
  text: And this matter became sin for the house of Yarovam[b][a], to cut it off and to destroy it from the face of the ground.
translation:
  language: de
  text: Und diese Sache[a] wurde dem Haus Jerobeams zur Sünde, sodass es vom Erdboden[b] ausgelöscht und vernichtet wurde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „diese Angelegenheit“ beziehungsweise „dieser Vorgang“. Das hebräische Wort דָּבָר kann eine Sache, Angelegenheit oder Begebenheit bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „vom Angesicht des Erdbodens“; eine hebräische Wendung für die vollständige Entfernung aus dem Land beziehungsweise von der Erde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּדָּבָר הַזֶּה
  choice: So wurde diese Sache
  rationale: Die Formulierung gibt den zusammenfassenden Folgesatz wieder. „Sache“ bewahrt die Bedeutungsbreite von דָּבָר und bezieht sich auf den zuvor geschilderten Vorgang, ohne ihn enger als bloßes Wort oder einzelnes Ereignis festzulegen.
- source_word: לְחַטַּאת בֵּית יָרָבְעָם
  choice: dem Haus Jerobeams zur Sünde
  rationale: Die Wendung „zur Sünde werden“ bildet die hebräische Konstruktion angemessen und würdevoll ab. „Haus“ bewahrt das biblische Bild für Familie und Dynastie; „Jerobeam“ ist die im Deutschen etablierte Namensform.
- source_word: וּלְהַכְחִיד
  choice: getilgt
  rationale: Das Hifil von כחד bezeichnet das Verschwindenlassen oder vollständige Beseitigen. „Getilgt“ wahrt die Unterscheidung zum folgenden stärkeren Verb und passt zum feierlichen Gerichtswort.
- source_word: וּלְהַשְׁמִיד
  choice: vernichtet
  rationale: „Vernichtet“ gibt das Hifil von שמד als umfassende Zerstörung wieder und erhält die nachdrückliche hebräische Verbdoppelung.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: von der Oberfläche des Erdbodens
  rationale: Die Wiedergabe erhält das hebräische Bild von der „Oberfläche“ und gibt אֲדָמָה mit „Erdboden“ wieder. Gemeint ist die vollständige Entfernung aus dem Land beziehungsweise von der Erde.
theological_decisions:
- issue: Bezugswort der Vernichtungsverben
  choice: Das unausgesprochene Objekt ist das Haus Jerobeams, also seine Familie beziehungsweise Dynastie.
  alternative: Die Verben könnten allgemeiner auf die sündige Sache selbst bezogen werden.
  rationale: Satzbau und Erzählzusammenhang sprechen am stärksten dafür, dass das zuvor genannte „Haus Jerobeams“ beseitigt werden soll. Das Pronomen „es“ macht diesen im Hebräischen unausgesprochenen Bezug im Deutschen kenntlich.
- issue: Verhältnis der Infinitive zur Sünde
  choice: 'Die Infinitive werden als Folge wiedergegeben: „führte dazu, dass“.'
  alternative: Sie könnten formal näher mit „um es zu tilgen und zu vernichten“ wiedergegeben werden, was stärker nach Zweck oder Absicht klingt.
  rationale: Im Kontext benennen die Infinitive das Gericht, das aus der Sünde des Hauses Jerobeams hervorgeht. Die Folgewendung ist im modernen Deutsch klar, ohne die Aussage einer bestimmten handelnden Person zuzuschreiben.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die traditionelle Wendung „zur Sünde werden“ und das Bild vom „Haus“ bleiben erhalten; die Folgebeziehung wird für heutige Leser syntaktisch verdeutlicht.
