  text: וַ/יְדַבֵּ֤ר אֶל בָּנָי/ו֙ לֵ/אמֹ֔ר חִבְשׁוּ לִ֖/י אֶֽת הַ/חֲמ֑וֹר וַֽ/יַּחֲבֹֽשׁוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/027.yaml
  text: Then he spoke to his sons[a], saying, “Saddle the donkey for me.” So they saddled it.
translation:
  language: de
  text: 'Da sagte er zu seinen Söhnen: »Sattelt mir den Esel.« Und sie sattelten ihn.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Da sagte er
  rationale: Das narrative וַ führt die Handlung weiter. Im Deutschen gibt »Da sagte er« den Erzählfluss natürlich wieder; »sagte« ist in der Redeeinleitung idiomatischer als das ebenfalls mögliche »sprach«.
- source_word: אֶל בָּנָיו
  choice: zu seinen Söhnen
  rationale: בָּנִים mit dem Suffix der 3. Person Singular bezeichnet hier seine männlichen Nachkommen; »Söhne« ist daher die genaue und natürliche Wiedergabe.
- source_word: לֵאמֹר
  choice: durch den Doppelpunkt vor der direkten Rede wiedergegeben
  rationale: Die hebräische Einleitungsformel wird im modernen Deutschen am natürlichsten durch eine Redeeinleitung mit Doppelpunkt ausgedrückt; ein zusätzliches »indem er sagte« wäre unnötig schwerfällig.
- source_word: חִבְשׁוּ לִי
  choice: Sattelt mir
  rationale: חבשׁ bezeichnet beim Esel das Auflegen beziehungsweise Befestigen des Sattels. Der ethische Dativ לִי wird im Deutschen knapp und genau mit »mir« wiedergegeben.
- source_word: אֶת הַחֲמוֹר
  choice: den Esel
  rationale: חֲמוֹר ist die gewöhnliche Bezeichnung für einen Esel; der bestimmte Artikel wird mit »den« wiedergegeben.
- source_word: וַיַּחֲבֹשׁוּ
  choice: Und sie sattelten ihn
  rationale: Die Wiederholung von חבשׁ bleibt durch »sattelten« sichtbar. Das im Hebräischen nicht ausdrücklich wiederholte Objekt wird im Deutschen mit dem auf »den Esel« bezogenen Pronomen »ihn« natürlich ergänzt.
theological_decisions: []
