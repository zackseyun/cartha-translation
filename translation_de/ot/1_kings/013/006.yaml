  text: וַ/יַּ֨עַן הַ/מֶּ֜לֶךְ וַ/יֹּ֣אמֶר אֶל אִ֣ישׁ הָ/אֱלֹהִ֗ים חַל נָ֞א אֶת פְּנֵ֨י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ וְ/הִתְפַּלֵּ֣ל בַּעֲדִ֔/י וְ/תָשֹׁ֥ב יָדִ֖/י אֵלָ֑/י וַ/יְחַ֤ל אִישׁ הָֽ/אֱלֹהִים֙ אֶת פְּנֵ֣י יְהוָ֔ה וַ/תָּ֤שָׁב יַד הַ/מֶּ֨לֶךְ֙ אֵלָ֔י/ו וַ/תְּהִ֖י כְּ/בָ/רִֽאשֹׁנָֽה׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/006.yaml
  text: Then the king answered and said to the man of God[a], “Please entreat the favor of Yahweh your God, and pray for me, that my hand may be restored to me.” So the man of God entreated the favor of Yahweh, and the king’s hand was restored to him and became as it was before.
translation:
  language: de
  text: 'Da antwortete der König und sagte zu dem Mann Gottes: „Bitte doch Jahwe, deinen Gott,[a] um Gunst und bete für mich, damit meine Hand wiederhergestellt wird.“ Da bat der Mann Gottes Jahwe um Gunst, und die Hand des Königs kehrte zu ihm zurück und war wieder wie zuvor.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisches Idiom, wörtlich mit „das Angesicht Jahwes“; gemeint ist, Jahwe um Gunst zu bitten.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַל ... אֶת־פְּנֵי יְהוָה / וַיְחַל ... אֶת־פְּנֵי יְהוָה
  choice: Besänftige doch Jahwe / besänftigte ... Jahwe
  rationale: Die Wendung חלה את־פני bezeichnet das inständige Bemühen um die Gunst einer Person. „Besänftigen“ gibt den Zusammenhang von Gericht und erbetener Aufhebung treffend und knapp wieder; die Fußnote bewahrt das hebräische Bild und die weniger starke Alternative.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „HERR“ ersetzt.
- source_word: אֱלֹהֶיךָ
  choice: deinen Gott
  rationale: Der König bezeichnet Jahwe ausdrücklich als den Gott des Gottesmannes; diese Distanzierung wird nicht zu „unseren Gott“ harmonisiert.
- source_word: וְהִתְפַּלֵּל בַּעֲדִי
  choice: und bete für mich
  rationale: Die Hitpael-Form von פלל mit בעד bezeichnet Fürbitte; „bete für mich“ ist natürliches, klares Deutsch.
- source_word: וְתָשֹׁב יָדִי אֵלָי / וַתָּשָׁב יַד־הַמֶּלֶךְ אֵלָיו
  choice: damit meine Hand wiederhergestellt wird / die Hand des Königs wurde wiederhergestellt
  rationale: Das wörtliche „zurückkehren“ meint hier die Wiederherstellung der im vorigen Vers erstarrten Hand. Die parallele Wiedergabe bewahrt die Entsprechung von Bitte und Erfüllung.
- source_word: וַתְּהִי כְּבָרִאשֹׁנָה
  choice: und war wie zuvor
  rationale: Die Formulierung bezeichnet die Rückkehr zum früheren gesunden Zustand und klingt in modernem Deutsch natürlich.
- source_word: אִישׁ הָאֱלֹהִים
  choice: Mann Gottes
  rationale: Der feste prophetische Titel des Ausgangstextes bleibt erhalten und wird nicht deutend durch „Prophet“ ersetzt.
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: Da antwortete
  rationale: Die deutsche Erzählform „antwortete“ gibt die hebräische Doppelwendung idiomatisch wieder; „antwortete und sagte“ wäre unnötig schwerfällig.
theological_decisions:
- issue: Jahwe als „dein Gott“ in der Rede des Königs
  choice: deinen Gott
  alternative: unseren Gott
  rationale: Der Wortlaut wahrt die im Text erkennbare Distanz des Königs und die besondere Beziehung des Gottesmannes zu Jahwe, ohne eine nicht ausgesprochene Gemeinsamkeit einzutragen.
- issue: Bedeutungsstärke von חלה את־פני im Gerichtszusammenhang
  choice: besänftigen
  alternative: um die Gunst bitten
  rationale: „Besänftigen“ passt zur Bitte um Rücknahme des unmittelbar ergangenen Gerichts, ohne ausdrücklich eine bestimmte Sühnlehre einzutragen. Die Fußnote macht die idiomatische Breite transparent.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist klar und eindringlich; der traditionelle Titel „Mann Gottes“ und der Eigenname „Jahwe“ bleiben erhalten. Die Übersetzung folgt optimaler Äquivalenz und macht das schwer übertragbare Idiom in einer Fußnote sichtbar.
