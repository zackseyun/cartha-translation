  source_fidelity: Die Wiedergabe von »deinen Gott«, »bete für mich«, »Mann Gottes« und der Wiederherstellung der Hand ist quellentreu. »Besänftige Jahwe« ist für חלה את־פני jedoch zu stark und legt nahe, Jahwe sei zu beschwichtigen; das Idiom bezeichnet das inständige Erbitten bzw. Suchen seiner Gunst. Auch die bisherige Fußnotenparaphrase »Mach ... das Angesicht ... mild« ist keine verlässliche wörtliche Wiedergabe.
  naturalness: Die revidierte Fassung verwendet modernes, würdiges Standarddeutsch. »Jahwe um Gunst bitten« ist natürlich und wahrt zugleich die semantische Nuance des hebräischen Idioms.
  terminology: Jahwe wird konsequent als Gottesname wiedergegeben. »Mann Gottes« erhält den Titel des hebräischen Textes; »deinen Gott« bewahrt die auffällige Distanzierung in der Rede des Königs.
