revisions:
- from: 'Da antwortete der König dem Mann Gottes: „Besänftige doch Jahwe, deinen Gott,[a] und bete für mich, damit meine Hand wiederhergestellt wird.“ Da besänftigte der Mann Gottes Jahwe, und die Hand des Königs wurde wiederhergestellt und war wie zuvor.'
  to: 'Da antwortete der König und sagte zu dem Mann Gottes: „Bitte doch Jahwe, deinen Gott,[a] um Gunst und bete für mich, damit meine Hand wiederhergestellt wird.“ Da bat der Mann Gottes Jahwe um Gunst, und die Hand des Königs kehrte zu ihm zurück und war wieder wie zuvor.'
  rationale: Die Revision ersetzt die theologisch und semantisch zu starke Aussage »besänftigen« durch »um Gunst bitten«. Dadurch wird das Idiom חלה את־פני sachgerecht wiedergegeben, ohne eine Vorstellung von Beschwichtigung oder Sühnung einzutragen. Die Fußnote erklärt das zugrunde liegende Bild vorsichtig, statt eine irreführende Pseudowörtlichkeit zu bieten. Die abschließende Formulierung »kehrte zu ihm zurück und war wieder wie zuvor« bewahrt die bildhafte Wiederaufnahme des hebräischen Verbs und das Resultat der vollständigen Wiederherstellung.
