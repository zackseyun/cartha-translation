source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר אֲלֵ/הֶם֙ אֲבִי/הֶ֔ם אֵֽי זֶ֥ה הַ/דֶּ֖רֶךְ הָלָ֑ךְ וַ/יִּרְא֣וּ בָנָ֗י/ו אֶת הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֤ר הָלַךְ֙ אִ֣ישׁ הָ/אֱלֹהִ֔ים אֲשֶׁר בָּ֖א מִ/יהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/012.yaml
  text: And their father said to them, “Which way did he go?” For his sons had seen the way that the man of God, who came from Judah, had gone.
translation:
  language: de
  text: 'Ihr Vater sagte zu ihnen: »Welchen Weg ist er gegangen?« Denn seine Söhne hatten gesehen, welchen Weg der Mann Gottes gegangen war, der aus Juda gekommen war.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר אֲלֵיהֶם
  choice: sagte zu ihnen
  rationale: Das Verb bedeutet grundsätzlich »reden/sprechen«; vor direkter Rede ist »sagte zu ihnen« im Deutschen idiomatisch und gibt die Erzählfunktion genau wieder.
- source_word: אֲבִיהֶם
  choice: ihr Vater
  rationale: Das Suffix der 3. Person maskulin Plural bezieht sich auf die zuvor genannten Söhne; daher ist »ihr Vater« grammatisch und kontextuell präzise.
- source_word: אֵי זֶה הַדֶּרֶךְ
  choice: Welchen Weg
  rationale: Die Frage zielt auf die Bestimmung der eingeschlagenen Route. »Welchen Weg« ist dafür die natürliche deutsche Formulierung.
- source_word: הָלָךְ
  choice: ist er gegangen / gegangen war
  rationale: Dasselbe hebräische Verb wird in der direkten Frage mit deutschem Perfekt und im erklärenden Rückblick mit Plusquamperfekt wiedergegeben; so bleiben Bedeutung und zeitliche Abfolge klar.
- source_word: וַיִּרְאוּ
  choice: hatten gesehen
  rationale: Das Plusquamperfekt verdeutlicht idiomatisch, dass die Söhne den Weg bereits gesehen hatten, bevor der Vater seine Frage stellte.
- source_word: בָנָיו
  choice: seine Söhne
  rationale: Das singularische Possessivsuffix verweist auf den Vater; »seine Söhne« bewahrt diesen Bezug ausdrücklich.
- source_word: אִישׁ הָאֱלֹהִים
  choice: der Mann Gottes
  rationale: Die feste hebräische Bezeichnung wird wörtlich und traditionsgemäß wiedergegeben, ohne sie enger als »Prophet« auszulegen.
- source_word: אֲשֶׁר בָּא מִיהוּדָה
  choice: der aus Juda gekommen war
  rationale: Die Relativkonstruktion beschreibt den Mann Gottes nach seiner Herkunft beziehungsweise seinem Ausgangsort. Das Plusquamperfekt entspricht im deutschen Erzählzusammenhang der vorausliegenden Ankunft.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Wiederholung von »Weg« und »gegangen« spiegelt die hebräische Ausdrucksweise, ohne im Deutschen unnatürlich zu wirken. »Denn« gibt den erklärenden Zusammenhang des zweiten Satzteils wieder.
