  text: וַ/יֵּ֗לֶךְ אַֽחֲרֵי֙ אִ֣ישׁ הָ/אֱלֹהִ֔ים וַ/יִּ֨מְצָאֵ֔/הוּ יֹשֵׁ֖ב תַּ֣חַת הָ/אֵלָ֑ה וַ/יֹּ֣אמֶר אֵלָ֗י/ו הַ/אַתָּ֧ה אִישׁ הָ/אֱלֹהִ֛ים אֲשֶׁר בָּ֥אתָ מִֽ/יהוּדָ֖ה וַ/יֹּ֥אמֶר אָֽנִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/014.yaml
  text: So he went after the man of God and found him sitting under the terebinth[a], and he said to him, “Are you the man of God who came from Judah?” And he said, “I am.”
translation:
  language: de
  text: 'Da ging er dem Mann Gottes nach und fand ihn unter der Terebinthe[a] sitzen. Er fragte ihn: »Bist du der Mann Gottes, der aus Juda gekommen ist?« Er antwortete: »Ja, das bin ich.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »unter der Eiche«. Das hebräische Wort אֵלָה bezeichnet genauer eine Terebinthe.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ אַחֲרֵי
  choice: ging er … nach
  rationale: Die deutsche Wendung gibt sowohl die Bewegung als auch das gezielte Nachgehen im Erzählzusammenhang natürlich wieder.
- source_word: אִישׁ הָאֱלֹהִים
  choice: Mann Gottes
  rationale: Die etablierte und direkte Wiedergabe des hebräischen Titels bleibt erhalten, ohne ihn enger als »Prophet Gottes« auszulegen.
- source_word: וַיִּמְצָאֵהוּ יֹשֵׁב
  choice: fand ihn … sitzen
  rationale: Die Konstruktion gibt das Finden und die dabei angetroffene sitzende Haltung knapp und idiomatisch wieder.
- source_word: תַּחַת הָאֵלָה
  choice: unter der Terebinthe
  rationale: אֵלָה bezeichnet hier am ehesten eine Terebinthe; die mögliche allgemeinere beziehungsweise traditionelle Wiedergabe »Eiche« wird in der Fußnote genannt.
- source_word: הַאַתָּה
  choice: Bist du
  rationale: Natürliche deutsche Form der direkten Identifikationsfrage.
- source_word: אֲשֶׁר בָּאתָ מִיהוּדָה
  choice: der aus Juda gekommen ist
  rationale: Gibt Herkunft und vorangegangene Bewegung aus Juda idiomatisch wieder.
- source_word: אָנִי
  choice: Ja, das bin ich
  rationale: Das wörtlich knappe »Ich« fungiert als bejahende Antwort auf die Identifikationsfrage; die deutsche Formulierung macht diese Ellipse natürlich verständlich.
theological_decisions:
- issue: Wiedergabe von אִישׁ הָאֱלֹהִים als Titel
  choice: Mann Gottes
  alternative: Prophet Gottes
  rationale: Die direkte Titelbezeichnung bewahrt die Ausdrucksweise des Ausgangstextes und vermeidet eine Verengung auf eine ausdrücklich benannte Amtsbezeichnung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der narrative Stil ist knapp und flüssig; »Terebinthe« bewahrt die botanische Genauigkeit, während die Fußnote die geläufige Alternative nennt.
