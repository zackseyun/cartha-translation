base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/023.yaml
  text: And it happened[a], after he had eaten bread and after he had drunk, that he saddled the donkey for him, for the prophet whom he had brought back.
translation:
  language: de
  text: 'Und es geschah: Nachdem er Brot gegessen und getrunken hatte, sattelte er den Esel für den Propheten, den er zurückgebracht hatte[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den er zur Rückkehr veranlasst hatte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Und es geschah
  rationale: Bewahrt die hebräische narrative Übergangsformel in würdigem, verständlichem Deutsch; der Doppelpunkt führt natürlich in den folgenden Temporalsatz.
- source_word: אַחֲרֵי אָכְלוֹ לֶחֶם
  choice: Nachdem er Brot gegessen hatte
  rationale: Gibt die temporale Konstruktion mit Infinitiv und Suffix wieder und behält das ausdrücklich genannte לֶחֶם („Brot“) bei.
- source_word: וְאַחֲרֵי שְׁתוֹתוֹ
  choice: und getrunken hatte
  rationale: Wahrt die Parallelität zur vorherigen Zeitangabe, ohne ein im Hebräischen nicht genanntes Getränk zu ergänzen.
- source_word: וַיַּחֲבָשׁ
  choice: sattelte er
  rationale: חבש bezeichnet bei einem Reittier hier konkret das Satteln.
- source_word: לוֹ
  choice: ihm
  rationale: Der Dativ bezeichnet die Person, für deren Gebrauch der Esel gesattelt wurde.
- source_word: הַחֲמוֹר
  choice: den Esel
  rationale: Natürliche moderne Standardbezeichnung für das genannte Tier.
- source_word: לַנָּבִיא
  choice: dem Propheten
  rationale: Gibt die appositionelle Präzisierung mit dem im Hebräischen ausdrücklich verwendeten Wort „Prophet“ wieder.
- source_word: אֲשֶׁר הֱשִׁיבוֹ
  choice: den er zurückgebracht hatte
  rationale: Der Hifil von שוב bedeutet, jemanden zur Rückkehr zu bringen bzw. zurückzubringen; die gewählte Formulierung ist idiomatisch und lässt die kausative Nuance in einer Fußnote sichtbar.
