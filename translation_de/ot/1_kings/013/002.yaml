source:
  edition: WLC
  text: וַ/יִּקְרָ֤א עַל הַ/מִּזְבֵּ֨חַ֙ בִּ/דְבַ֣ר יְהוָ֔ה וַ/יֹּ֨אמֶר֙ מִזְבֵּ֣חַ מִזְבֵּ֔חַ כֹּ֖ה אָמַ֣ר יְהוָ֑ה הִנֵּֽה בֵ֞ן נוֹלָ֤ד לְ/בֵית דָּוִד֙ יֹאשִׁיָּ֣הוּ שְׁמ֔/וֹ וְ/זָבַ֣ח עָלֶ֗י/ךָ אֶת כֹּהֲנֵ֤י הַ/בָּמוֹת֙ הַ/מַּקְטִרִ֣ים עָלֶ֔י/ךָ וְ/עַצְמ֥וֹת אָדָ֖ם יִשְׂרְפ֥וּ עָלֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/002.yaml
  text: 'And he cried out against the altar by the word of Yahweh and said[a], “Altar, altar, thus says Yahweh: Behold, a son will be born to the house of David, Josiah by name, and he will sacrifice on you the priests of the high places who burn incense on you[c][b], and human bones will be burned on you.”'
translation:
  language: de
  text: 'Auf das Wort Yahwehs hin rief er gegen den Altar aus und sagte[a]: „Altar, Altar! So spricht Yahweh: Siehe, dem Haus Davids wird ein Sohn geboren werden; Josia ist sein Name. Er wird auf dir die Priester der Kulthöhen opfern[b], die auf dir Räucheropfer darbringen[c], und Menschenknochen[d] wird man auf dir verbrennen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „durch das Wort Yahwehs“ oder „gemäß dem Wort Yahwehs“. Die Wendung bezeichnet den göttlichen Auftrag oder die Vollmacht der Verkündigung.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „schlachten“. Das hebräische Verb hat kultischen Klang und unterstreicht vermutlich die Entweihung des Altars.'
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Verb kann allgemeiner bedeuten, Opferrauch aufsteigen zu lassen; je nach Zusammenhang kann es sich um Räucherwerk oder andere Opfergaben handeln.
    reason: lexical_ambiguity
  - marker: d
    text: 'Wörtlich: „Knochen von אדם (adam)“; אדם bezeichnet hier Menschen allgemein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא עַל הַמִּזְבֵּחַ
  choice: er rief ... gegen den Altar aus
  rationale: קרא mit עַל bezeichnet hier eine laute prophetische Verkündigung, die gegen den Altar gerichtet ist. „Ausrufen“ bewahrt Nachdruck und öffentliche Wirkung.
- source_word: בִּדְבַר יְהוָה
  choice: auf das Wort Yahwehs hin
  rationale: Die Formulierung lässt göttlichen Auftrag, Veranlassung oder Vollmacht anklingen. Die gewählte Wendung ist im Deutschen natürlich, ohne die hebräische Präposition zu eng festzulegen.
- source_word: מִזְבֵּחַ מִזְבֵּחַ
  choice: Altar, Altar
  rationale: Die feierliche, rhetorische Anrede und ihre Wiederholung werden vollständig bewahrt.
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Yahweh
  rationale: Dies ist die geläufige und präzise deutsche Wiedergabe der prophetischen Botenformel.
- source_word: הִנֵּה
  choice: Sieh
  rationale: „Sieh“ lenkt die Aufmerksamkeit auf die feierliche Ankündigung und klingt im heutigen Deutsch würdig, aber verständlich.
- source_word: בֵן נוֹלָד לְבֵית דָּוִד
  choice: dem Haus Davids wird ein Sohn geboren werden
  rationale: Das Partizip bezeichnet in diesem prophetischen Zusammenhang ein künftiges Geschehen. Die Zuordnung zum Haus Davids bleibt erhalten.
- source_word: יֹאשִׁיָּהוּ שְׁמוֹ
  choice: Josia ist sein Name
  rationale: Die knappe hebräische Namensformel wird nahezu formal und zugleich idiomatisch wiedergegeben.
- source_word: וְזָבַח עָלֶיךָ
  choice: er wird auf dir ... opfern
  rationale: זבח trägt ausdrücklich kultisch-sakrales Gepräge. „Opfern“ bewahrt die beabsichtigte grausame Ironie der Entweihung besser als das allgemeinere „töten“.
- source_word: כֹּהֲנֵי הַבָּמוֹת
  choice: die Priester der Kulthöhen
  rationale: „Kulthöhen“ bezeichnet die örtlichen Höhenheiligtümer präziser als das isoliert möglicherweise topografisch verstandene „Höhen“.
- source_word: הַמַּקְטִרִים עָלֶיךָ
  choice: die auf dir Räucheropfer darbringen
  rationale: Die Hifil-Form von קטר bezeichnet das Aufsteigenlassen von Opferrauch und kann besonders Räucherwerk meinen. „Räucheropfer darbringen“ ist im Altarzusammenhang klar und kultisch passend; die weitere Bedeutung wird in einer Fußnote offengehalten.
- source_word: וְעַצְמוֹת אָדָם יִשְׂרְפוּ עָלֶיךָ
  choice: Menschenknochen wird man auf dir verbrennen
  rationale: אָדָם ist generisch; „Menschenknochen“ gibt dies knapp wieder. Das unpersönliche „man“ entspricht dem nicht genannten Handlungsträger des hebräischen Plurals, ohne ihn mit Josia gleichzusetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jahwe
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Yahweh“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Kultische Bedeutung von זבח bei der Tötung der Höhenpriester
  choice: opfern
  alternative: schlachten
  rationale: Die kultische Wortwahl des Hebräischen und die entweihende Umkehrung des Altargebrauchs sollen hörbar bleiben. Eine Fußnote nennt die mögliche konkretere Wiedergabe.
- issue: Referenz von אָדָם
  choice: Menschenknochen
  alternative: Knochen eines Menschen; Gebeine von Menschen
  rationale: אָדָם bezeichnet hier Menschen allgemein und nicht ausdrücklich einen Mann oder die Person Adam.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter prophetischer Feierlichkeit. Die direkte Anrede des Altars, die Wiederholung und die kultische Ironie bleiben erhalten. „Kulthöhen“ vermeidet ein rein geografisches Missverständnis; Fußnoten machen echte lexikalische Spielräume sichtbar.
