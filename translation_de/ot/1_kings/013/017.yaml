source:
  edition: WLC
  text: כִּֽי דָבָ֤ר אֵלַ/י֙ בִּ/דְבַ֣ר יְהוָ֔ה לֹֽא תֹאכַ֣ל לֶ֔חֶם וְ/לֹֽא תִשְׁתֶּ֥ה שָׁ֖ם מָ֑יִם לֹא תָשׁ֣וּב לָ/לֶ֔כֶת בַּ/דֶּ֖רֶךְ אֲשֶׁר הָלַ֥כְתָּ בָּֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/017.yaml
  text: 'For a word came to me by the word of the LORD: ‘You shall not eat bread, and you shall not drink water there; you shall not return by going on the way by which you went.’'
translation:
  language: de
  text: 'Denn zu mir kam ein Wort durch das Wort des HERRN: »Du sollst dort kein Brot essen und kein Wasser trinken. Du sollst nicht auf dem Weg zurückgehen, auf dem du hingegangen bist.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דָבָר אֵלַי בִּדְבַר יְהוָה
  choice: zu mir kam ein Wort durch das Wort des HERRN
  rationale: Bewahrt die auffällige Wiederholung von דָבָר und gibt בִּדְבַר instrumentell mit „durch das Wort“ wieder. Das Tetragramm wird gemäß üblicher deutscher Bibelkonvention als HERR wiedergegeben.
- source_word: לֹא תֹאכַל לֶחֶם
  choice: Du sollst ... kein Brot essen
  rationale: Gibt das Verbot natürlich und zugleich eng am hebräischen Wortlaut wieder; לֶחֶם bleibt konkret „Brot“.
- source_word: וְלֹא תִשְׁתֶּה שָׁם מָיִם
  choice: und kein Wasser trinken
  rationale: Das lokale שָׁם wird im Deutschen gemeinsam auf beide Verbote bezogen und bereits nach „sollst“ als „dort“ gesetzt.
- source_word: לֹא תָשׁוּב לָלֶכֶת
  choice: Du sollst nicht ... zurückgehen
  rationale: תָשׁוּב und לָלֶכֶת bilden hier zusammen die Vorstellung des Zurückgehens; eine hölzerne Doppelung wie „zurückkehren, um zu gehen“ wäre im Deutschen missverständlich.
- source_word: בַּדֶּרֶךְ אֲשֶׁר הָלַכְתָּ בָּהּ
  choice: auf dem Weg, auf dem du hingegangen bist
  rationale: Bewahrt die Relativkonstruktion und unterscheidet das vorausgehende Hingehen vom verbotenen Zurückgehen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: HERR
  alternative: JHWH / Jahwe
  rationale: Die traditionelle Kapitälchenschreibung macht kenntlich, dass der hebräische Eigenname יהוה vorliegt, ohne eine unsichere Aussprache festzulegen.
- issue: Quelle und Vermittlung des Verbots
  choice: „ein Wort durch das Wort des HERRN“
  alternative: „mir wurde durch das Wort des HERRN gesagt“
  rationale: Die gewählte Fassung erhält die im Hebräischen ausdrücklich wiederholte Wort-Terminologie und löst die Art der Offenbarungsvermittlung nicht näher auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist klar gegliedert; die markante Wiederholung „Wort ... Wort“ bleibt als stilistisches Merkmal des Ausgangstextes erhalten.
