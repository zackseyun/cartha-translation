  source_fidelity: 'Die Übersetzung gibt die Satzfolge und den Inhalt des Hebräischen zuverlässig wieder: Die auffällige Wiederholung von דָּבָר („Wort“) bleibt erhalten, בִּדְבַר יהוה wird angemessen als „durch das Wort des HERRN“ verstanden, und die drei Verbote sind vollständig erfasst. „Dort“ steht im Deutschen vor dem koordinierten Ausdruck „kein Brot essen und kein Wasser trinken“ und bezieht sich natürlich auf beide Handlungen. „Nicht auf dem Weg zurückgehen, auf dem du hingegangen bist“ gibt לֹא תָשׁוּב לָלֶכֶת בַּדֶּרֶךְ אֲשֶׁר הָלַכְתָּ בָּהּ idiomatisch wieder, ohne die etwas markierte hebräische Infinitivkonstruktion unzulässig zu präzisieren.'
