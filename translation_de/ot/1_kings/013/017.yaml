  terminology: „HERR“ ist eine etablierte deutsche Kennzeichnung des Tetragramms. „Brot“, „Wasser“, „Weg“ und „Wort“ sind sachgerecht und registerangemessen. Es gibt keine problematischen theologischen Zusätze oder einengenden Deutungen.
