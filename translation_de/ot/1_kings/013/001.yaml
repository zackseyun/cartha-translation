source:
  edition: WLC
  text: וְ/הִנֵּ֣ה אִ֣ישׁ אֱלֹהִ֗ים בָּ֧א מִ/יהוּדָ֛ה בִּ/דְבַ֥ר יְהוָ֖ה אֶל בֵּֽית אֵ֑ל וְ/יָרָבְעָ֛ם עֹמֵ֥ד עַל הַ/מִּזְבֵּ֖חַ לְ/הַקְטִֽיר׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/001.yaml
  text: And behold[a], a man of God came from Judah to Bethel by the word of Yahweh[b], while Jeroboam was standing by the altar to burn incense.
translation:
  language: de
  text: Und siehe, ein Mann Gottes kam aus Juda auf das Wort Jahwes hin[a] nach Bethel, während[b] Jerobeam am Altar stand, um ein Rauchopfer darzubringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch das Wort Jahwes“ oder „nach dem Wort Jahwes“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und Jerobeam stand am Altar“. Die hebräische Verbindung kann auch schlicht mit „und“ wiedergegeben werden; „am Altar“ kann auch „bei dem Altar“ heißen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Und siehe
  rationale: Bewahrt sowohl die erzählerische Verknüpfung durch וְ als auch die aufmerksamkeitslenkende, vergegenwärtigende Kraft von הִנֵּה in einer würdigen deutschen Erzählweise.
- source_word: אִישׁ אֱלֹהִים
  choice: ein Mann Gottes
  rationale: Gibt die feste hebräische Bezeichnung unmittelbar wieder, ohne sie deutend auf „Prophet“ zu verengen.
- source_word: בָּא מִיהוּדָה
  choice: kam aus Juda
  rationale: Natürliche und direkte Wiedergabe der Bewegung und Herkunftsangabe.
- source_word: בִּדְבַר יְהוָה
  choice: durch das Wort Jahwes
  rationale: 'Gibt die mögliche instrumentale beziehungsweise autorisierende Bedeutung der Präposition בְּ wieder: Sein Kommen geschah aufgrund und im Auftrag des Wortes Jahwes. Andere Verhältnisbestimmungen bleiben in der Fußnote sichtbar.'
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen als im Deutschen geläufige Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֶל בֵּית אֵל
  choice: nach Bethel
  rationale: „Nach“ ist bei einer Bewegung zu einem Ortsnamen idiomatisches Deutsch; „Bethel“ ist die etablierte deutsche Namensform.
- source_word: וְיָרָבְעָם עֹמֵד
  choice: während Jerobeam … stand
  rationale: Der partizipiale Satz beschreibt eine gleichzeitig andauernde Hintergrundhandlung. „Während“ macht diesen Zusammenhang natürlich deutlich, ohne die mögliche einfache Beiordnung zu verschweigen.
- source_word: עַל הַמִּזְבֵּחַ
  choice: am Altar
  rationale: Im Zusammenhang mit עמד bezeichnet עַל die Stellung beim Altar, nicht notwendig auf dessen Oberfläche.
- source_word: לְהַקְטִיר
  choice: um Räucherwerk darzubringen
  rationale: Die Infinitivkonstruktion bezeichnet den Zweck; im kultischen Zusammenhang ist das Verb auf das Aufsteigenlassen von Rauch beziehungsweise das Darbringen von Räucherwerk bezogen. Die Formulierung ist präzise und im modernen Deutschen verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich das Tetragramm. „Jahwe“ bewahrt den Eigennamen und vermeidet, ihn stillschweigend durch den Titel „der HERR“ zu ersetzen.
- issue: Bedeutung von בִּדְבַר יְהוָה
  choice: durch das Wort Jahwes
  alternative: auf das Wort Jahwes hin; nach dem Wort Jahwes
  rationale: Die gewählte Fassung lässt Auftrag und wirksame Veranlassung erkennen. Da die hebräische Präposition mehrere nahe Verhältnisbestimmungen zulässt, werden die Alternativen in einer Fußnote bewahrt.
translation_notes:
  register: Modernes Standarddeutsch mit leicht gehobenem, erzählerisch-biblischem Ton. „Und siehe“ erhält die lebendige Aufmerksamkeitssignalisierung des Hebräischen; Satzbau und Wortwahl bleiben zugleich für heutige Leser verständlich.
