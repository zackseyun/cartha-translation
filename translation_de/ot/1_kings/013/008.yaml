  text: But the man of God said to the king[a], “If you were to give me half your house, I would not go with you, nor would I eat bread or drink water in this place.”
translation:
  language: de
  text: 'Doch der Mann Gottes sagte zum König: „Wenn du mir die Hälfte deines Hauses[a] gäbest, würde ich nicht mit dir gehen und an diesem Ort weder Brot essen noch Wasser trinken.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort für „Haus“ kann hier auch den Hausstand oder Besitz meinen. Gemeint sein kann somit ein außerordentlich großes Geschenk; der Haupttext bewahrt die wörtliche Formulierung.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: der Mann Gottes
  rationale: Die im Hebräischen feststehende Bezeichnung für einen von Gott beauftragten Boten wird quellennah bewahrt; „Prophet Gottes“ wäre deutender.
- source_word: אִם תִּתֶּן לִי אֶת חֲצִי בֵיתֶךָ
  choice: Selbst wenn du mir die Hälfte deines Hauses gäbest
  rationale: „Selbst wenn“ bringt die nachdrückliche, hypothetische Zurückweisung im Deutschen natürlich zum Ausdruck. „Haus“ erhält das konkrete und zugleich mehrdeutige Bild des Hebräischen.
- source_word: בֵיתֶךָ
  choice: deines Hauses
  rationale: בַּיִת kann Haus, Hausstand oder Besitz bezeichnen. Die wörtliche Wiedergabe wahrt diese Bedeutungsbreite, ohne sie im Haupttext vorschnell auf Besitz festzulegen.
- source_word: לֹא אָבֹא עִמָּךְ
  choice: würde ich nicht mit dir gehen
  rationale: Das hebräische Verb bedeutet wörtlich „kommen“; nach der Einladung des Königs ist „mit dir gehen“ im Deutschen die natürliche deiktische Entsprechung. Der Konjunktiv fügt sich in den hypothetischen Satz.
- source_word: לֹא אֹכַל לֶחֶם
  choice: weder Brot essen
  rationale: „Brot“ kann wie לֶחֶם auch stellvertretend für Nahrung oder eine Mahlzeit stehen und bewahrt zugleich die hebräische Bildsprache.
- source_word: וְלֹא אֶשְׁתֶּה מַּיִם
  choice: noch Wasser trinken
  rationale: Die Verbindung „weder … noch“ gibt die parallelen Verneinungen flüssig und präzise wieder.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: an diesem Ort
  rationale: Die Formulierung erhält die ausdrückliche Ortsangabe und den demonstrativen Nachdruck des hebräischen Textes.
