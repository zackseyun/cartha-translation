base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/031.yaml
  text: And it happened, after he had buried him, that he said to his sons, “When I die, bury me in the tomb where the man of God is buried; lay my bones beside his bones.”
translation:
  language: de
  text: 'Nachdem er ihn begraben hatte, sagte er zu seinen Söhnen: »Wenn ich sterbe, begrabt mich in dem Grab, in dem der Mann Gottes begraben ist. Legt meine Gebeine neben seine Gebeine.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי קָבְרוֹ אֹתוֹ
  choice: Nachdem er ihn begraben hatte
  rationale: Die hebräische Erzählungsformel leitet hier vor allem den anschließenden Zeitpunkt ein. Im Deutschen gibt ein temporaler Nebensatz den Zusammenhang natürlich und vollständig wieder, ohne die schwerfällige Formel „Und es geschah“.
- source_word: בָּנָיו
  choice: seinen Söhnen
  rationale: Das Hebräische bezeichnet ausdrücklich seine Söhne, nicht allgemein seine Kinder.
- source_word: בְּמוֹתִי
  choice: Wenn ich sterbe
  rationale: Natürliche moderne Wiedergabe der temporalen Infinitivkonstruktion mit Suffix der ersten Person.
- source_word: וּקְבַרְתֶּם אֹתִי
  choice: begrabt mich
  rationale: Das Verb hat im Kontext auffordernde Kraft; der deutsche Imperativ bringt die Anweisung klar zum Ausdruck.
- source_word: בַּקֶּבֶר
  choice: in dem Grab
  rationale: Gemeint ist eine bestimmte, mehrfach belegbare Grabstätte. „Grab“ ist im Deutschen dafür idiomatisch und weniger interpretationsgeladen als „Gruft“.
- source_word: אִישׁ הָאֱלֹהִים
  choice: der Mann Gottes
  rationale: Der feststehende Titel des Abschnitts wird wörtlich und konsistent wiedergegeben, ohne ihn enger als „Prophet“ auszulegen.
- source_word: עַצְמֹתָיו ... עַצְמֹתָי
  choice: seine Gebeine ... meine Gebeine
  rationale: „Gebeine“ bewahrt den konkreten Bezug auf die Knochen und entspricht zugleich dem würdigen Register einer Bestattungsanweisung.
- source_word: הַנִּיחוּ
  choice: Legt
  rationale: Der Imperativ bezeichnet das Niederlegen beziehungsweise Platzieren der Gebeine; „legt“ ist knapp und natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau ist flüssig, während zentrale konkrete Begriffe und der Titel „Mann Gottes“ eng am Hebräischen bleiben. Keine Fußnoten erforderlich.
