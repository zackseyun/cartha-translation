  source_fidelity: Der Entwurf gibt die zeitliche Abfolge von אַחֲרֵי קָבְרוֹ אֹתוֹ zutreffend wieder und bewahrt die Anrede an die ausdrücklich genannten Söhne. Die Bestattungsanweisung, die bestimmte Grabstätte, der Titel „Mann Gottes“ und die Wiederholung von „Gebeine“ entsprechen dem hebräischen Text. Das im Deutschen nicht eigens wiedergegebene erzählerische וַיְהִי ist in die natürliche temporale Satzverknüpfung integriert und führt zu keinem Bedeutungsverlust.
  naturalness: Flüssiges, modernes und zugleich würdiges Standarddeutsch. „Grab“, „begraben ist“ und „Gebeine“ sind in diesem Bestattungskontext idiomatisch; die direkte Rede ist klar und angemessen.
  terminology: „Mann Gottes“ übersetzt אִישׁ הָאֱלֹהִים direkt und ohne die engere Deutung „Prophet“. „Gebeine“ wahrt die konkrete Bedeutung von עֲצָמוֹת und das feierliche Register. Keine theologisch lenkende Terminologie wurde eingeführt.
