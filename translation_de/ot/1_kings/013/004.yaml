  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ הַ/מֶּ֜לֶךְ אֶת דְּבַ֣ר אִישׁ הָ/אֱלֹהִ֗ים אֲשֶׁ֨ר קָרָ֤א עַל הַ/מִּזְבֵּ֨חַ֙ בְּ/בֵֽית אֵ֔ל וַ/יִּשְׁלַ֨ח יָרָבְעָ֧ם אֶת יָד֛/וֹ מֵ/עַ֥ל הַ/מִּזְבֵּ֖חַ לֵ/אמֹ֣ר תִּפְשֻׂ֑/הוּ וַ/תִּיבַ֤שׁ יָד/וֹ֙ אֲשֶׁ֣ר שָׁלַ֣ח עָלָ֔י/ו וְ/לֹ֥א יָכֹ֖ל לַ/הֲשִׁיבָ֥/הּ אֵלָֽי/ו־־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/004.yaml
  text: And when the king heard the word of the man of God[a], who cried out against the altar at Bethel, Jeroboam stretched out his hand from the altar, saying, “Seize him!” But his hand, which he stretched out against him, dried up, and he could not draw it back to himself.
translation:
  language: de
  text: 'Als der König das Wort des Mannes Gottes hörte, der gegen den Altar in Bethel ausgerufen hatte, streckte Jerobeam seine Hand vom Altar aus und befahl: »Ergreift ihn!« Da verdorrte[a] die Hand, die er gegen ihn ausgestreckt hatte, und er konnte sie nicht mehr zu sich zurückziehen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »trocknete aus«.'
    reason: Das hebräische Verb bedeutet grundlegend »trocken sein/werden«; »verdorrte« gibt das Bild im Deutschen natürlicher wieder.
lexical_decisions:
- source_word: דְּבַר
  choice: das Wort
  rationale: Bewahrt den konkreten Singular und den im prophetischen Zusammenhang geläufigen Ausdruck, ohne ihn zu »Botschaft« zu erweitern.
- source_word: אִישׁ הָאֱלֹהִים
  choice: der Mann Gottes
  rationale: Gibt den festen hebräischen Titel unmittelbar wieder und vermeidet die interpretierende Ersetzung durch »Prophet Gottes«.
- source_word: קָרָא עַל
  choice: gegen … ausrufen
  rationale: Verbindet die hörbare, nachdrückliche Verkündigung mit der gegen den Altar gerichteten Anklage.
- source_word: בְּבֵית אֵל
  choice: in Bethel
  rationale: Die Präposition bezeichnet hier den Ort des Altars; »in Bethel« ist im Deutschen natürlich und bleibt eng am Hebräischen.
- source_word: וַיִּשְׁלַח ... אֶת יָדוֹ מֵעַל הַמִּזְבֵּחַ
  choice: streckte … seine Hand vom Altar aus
  rationale: Gibt die feindselige Gebärde idiomatisch wieder; »vom Altar aus« bewahrt die räumliche Angabe מֵעַל הַמִּזְבֵּחַ.
- source_word: תִּפְשֻׂהוּ
  choice: Ergreift ihn!
  rationale: Der Pluralimperativ richtet sich an mehrere Umstehende. Die Formulierung ist knapp und befehlend, ohne moderne rechtliche Kategorien einzutragen.
- source_word: וַתִּיבַשׁ יָדוֹ
  choice: da verdorrte die Hand
  rationale: »Verdorren« gibt das Bild des hebräischen Verbs יבש natürlich wieder und bezeichnet die plötzlich eintretende körperliche Schädigung, ohne eine Diagnose hinzuzufügen.
- source_word: אֲשֶׁר שָׁלַח עָלָיו
  choice: die er gegen ihn ausgestreckt hatte
  rationale: Die Wiederholung der Geste bleibt erhalten; »gegen ihn« bringt die feindselige Ausrichtung von עָלָיו zum Ausdruck.
- source_word: לַהֲשִׁיבָהּ אֵלָיו
  choice: sie … zu sich zurückziehen
  rationale: Gibt den Kausativ von שוב im körperlichen Zusammenhang idiomatisch wieder und macht die eingetretene Bewegungsunfähigkeit deutlich.
theological_decisions:
- issue: Art des Gerichts an Jerobeams Hand
  choice: Die plötzliche körperliche Schädigung wird schlicht als Verdorren der Hand wiedergegeben.
  alternative: Eine medizinisch näher bestimmte Lähmung oder Verkrüppelung annehmen.
  rationale: Der Text schildert eine unmittelbare, außergewöhnliche Folge von Jerobeams feindseligem Befehl, nennt aber keine medizinische Diagnose. Die Übersetzung bewahrt diese Zurückhaltung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstruktur folgt dem hebräischen Handlungsablauf, wird aber durch »befahl« und die deutsche Wortstellung idiomatisch gestaltet.
