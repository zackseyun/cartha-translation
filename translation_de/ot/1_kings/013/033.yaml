revisions:
- from: Nach diesem Geschehen kehrte Jerobeam nicht von seinem bösen Weg um. Er machte weiterhin Menschen aus allen Kreisen des Volkes zu Priestern für die Höhenheiligtümer. Jeden, der es wollte, setzte er ins Priesteramt ein[a], und so wurde er einer der Priester der Höhenheiligtümer.
  to: Nach diesem Geschehen kehrte Jerobeam nicht von seinem bösen Weg um; vielmehr machte er wieder Menschen aus allen Kreisen des Volkes zu Priestern für die Höhenheiligtümer. Jeden, der es wollte, setzte er ins Priesteramt ein[a], und dieser wurde einer der Priester der Höhenheiligtümer.
  rationale: 'Die Revision beschränkt sich auf zwei sichere Verbesserungen: Das iterative »wieder« gibt die Funktion von וַיָּשָׁב präziser wieder, und »dieser« verhindert, dass Jerobeam fälschlich als derjenige verstanden wird, der Priester wird. Bedeutung, Register, Namensform und Fußnotenanker bleiben erhalten.'
