id: 1KI.13.33
reference: 1 Kings 13:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אַחַר֙ הַ/דָּבָ֣ר הַ/זֶּ֔ה לֹֽא שָׁ֥ב יָרָבְעָ֖ם מִ/דַּרְכּ֣/וֹ הָ/רָעָ֑ה וַ֠/יָּשָׁב וַ/יַּ֜עַשׂ מִ/קְצ֤וֹת הָ/עָם֙ כֹּהֲנֵ֣י בָמ֔וֹת הֶֽ/חָפֵץ֙ יְמַלֵּ֣א אֶת יָד֔/וֹ וִ/יהִ֖י כֹּהֲנֵ֥י בָמֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/033.yaml
  text: After this event[a], Jeroboam did not turn from his evil way, but again made priests of high places from among all the people. Whoever desired it, he ordained him, and he became one of the priests of the high places.
translation:
  language: de
  text: Nach diesem Geschehen kehrte Jerobeam nicht von seinem bösen Weg um; vielmehr machte er wieder Menschen aus allen Kreisen des Volkes zu Priestern für die Höhenheiligtümer. Jeden, der es wollte, setzte er ins Priesteramt ein[a], und dieser wurde einer der Priester der Höhenheiligtümer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »füllte er seine Hand« – eine hebräische Redewendung für die Einsetzung oder Weihe zum priesterlichen Dienst.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַר הַדָּבָר הַזֶּה
  choice: Nach diesem Geschehen
  rationale: דָּבָר kann »Wort«, »Sache« oder »Begebenheit« bedeuten. Im erzählerischen Rückblick bezeichnet »Geschehen« den vorausgehenden Vorgang natürlich, ohne ihn näher auszudeuten.
- source_word: לֹא שָׁב ... מִדַּרְכּוֹ הָרָעָה
  choice: kehrte ... nicht von seinem bösen Weg um
  rationale: Die Wiedergabe bewahrt sowohl die Grundbedeutung von שׁוּב (umkehren/zurückkehren) als auch das hebräische Bild vom moralischen »Weg«; das stärker theologisch geprägte »tat nicht Buße« wird vermieden.
- source_word: וַיָּשָׁב וַיַּעַשׂ
  choice: Er machte weiterhin
  rationale: Das zweite שׁוּב kennzeichnet hier die Wiederaufnahme beziehungsweise Fortsetzung des Handelns. »Weiterhin« gibt diese Funktion in natürlichem Deutsch wieder.
- source_word: מִקְצוֹת הָעָם
  choice: aus allen Kreisen des Volkes
  rationale: Die schwierige Wendung bezeichnet hier die unbeschränkte Auswahl aus der Bevölkerung. »Aus allen Kreisen« bewahrt den Gedanken einer breiten Herkunft, ohne die missverständliche wörtliche Form »von den Enden des Volkes« oder die unbelegte Wertung »aus den Niedrigsten« zu verwenden.
- source_word: כֹּהֲנֵי בָמוֹת
  choice: Priester für die Höhenheiligtümer
  rationale: בָּמוֹת sind in diesem Zusammenhang lokale Kultstätten auf sogenannten Höhen. »Höhenheiligtümer« ist im Deutschen verständlicher als das knappe »Höhen«; »für« bezeichnet die priesterliche Zuständigkeit natürlich.
- source_word: הֶחָפֵץ
  choice: Jeden, der es wollte
  rationale: 'Das substantivierte Partizip ist generisch: Wer den Wunsch dazu hatte, konnte aufgenommen werden. Die Formulierung bringt die unterschiedslose Offenheit knapp zum Ausdruck.'
- source_word: יְמַלֵּא אֶת יָדוֹ
  choice: setzte er ins Priesteramt ein
  rationale: Die wörtliche Wendung »seine Hand füllen« ist ein hebräischer Ausdruck für die Einsetzung oder Weihe zum priesterlichen Dienst. Die funktionale Bedeutung steht im Haupttext, die konkrete Bildsprache in der Fußnote.
- source_word: וִיהִי כֹּהֲנֵי בָמוֹת
  choice: und so wurde er einer der Priester der Höhenheiligtümer
  rationale: Auf das singularische Verb folgt im Hebräischen eine pluralische Standesbezeichnung. »Einer der Priester« gibt den Eintritt des Einzelnen in diese Gruppe im Deutschen verständlich wieder.
theological_decisions:
- issue: Ob שׁוּב ausdrücklich als religiöse Buße zu übersetzen ist
  choice: kehrte ... nicht von seinem bösen Weg um
  alternative: tat nicht Buße für seinen bösen Weg
  rationale: Der Zusammenhang beschreibt eine moralisch-religiöse Umkehr, doch das hebräische Verb bewahrt das konkrete Bild des Umkehrens. Die Übersetzung lässt diese Bildsprache und damit den Wortlaut bestehen, ohne einen stärker systematisch-theologischen Begriff einzutragen.
- issue: Wie die priesterliche Einsetzungsformel יְמַלֵּא אֶת יָדוֹ wiederzugeben ist
  choice: setzte er ins Priesteramt ein
  alternative: weihte er; füllte er seine Hand
  rationale: Die Wendung bezeichnet die Aufnahme in den priesterlichen Dienst. »Ins Priesteramt einsetzen« ist konfessionell möglichst neutral und verständlich; die wörtliche Form wird zur Nachprüfbarkeit in der Fußnote genannt.
- issue: Ob בָּמוֹת neutral oder ausdrücklich als illegitime Kultstätten zu bezeichnen sind
  choice: Höhenheiligtümer
  alternative: unerlaubte Höhenheiligtümer; heidnische Kultstätten
  rationale: Der erzählerische Zusammenhang bewertet Jerobeams Vorgehen negativ, doch das Substantiv selbst bedeutet »Höhen/Kultstätten«. Eine wertende Ergänzung im Ausdruck würde die Aussage stärker festlegen als der Wortlaut dieses Satzes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gut verständlicher biblischer Bildsprache. »Jerobeam« folgt der im Deutschen etablierten Namensform. Kurze Hauptsätze vermeiden eine schwerfällige Satzperiode; »Höhenheiligtümer« erklärt die kultische Bedeutung von בָּמוֹת knapp, ohne die im Kontext erkennbare negative Wertung ausdrücklich in das Substantiv einzutragen.
