  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְהִ֕י הֵ֥ם יֹשְׁבִ֖ים אֶל הַ/שֻּׁלְחָ֑ן וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה אֶל הַ/נָּבִ֖יא אֲשֶׁ֥ר הֱשִׁיבֽ/וֹ־פ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/020.yaml
  text: And it happened, as they were sitting at the table, that the word of Yahweh came to the prophet who had brought him back.
translation:
  language: de
  text: Da erging, während sie am Tisch saßen, das Wort Jahwes an den Propheten, der ihn zurückgebracht hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: geschah es
  rationale: Die narrative Wayyiqtol-Form führt das nächste Ereignis ein. „Geschah es“ wahrt diese Funktion in würdigem, verständlichem Deutsch, ohne das altertümliche „es begab sich“.
- source_word: הֵם יֹשְׁבִים
  choice: während sie … saßen
  rationale: Pronomen und Partizip bezeichnen eine andauernde Begleithandlung; der deutsche Nebensatz gibt diesen durativen Sinn natürlich wieder.
- source_word: אֶל הַשֻּׁלְחָן
  choice: am Tisch
  rationale: In Verbindung mit ישב bezeichnet אֶל hier idiomatisch das Sitzen beim Tisch beziehungsweise bei der Mahlzeit, nicht eine Bewegung auf den Tisch zu.
- source_word: דְּבַר יְהוָה
  choice: das Wort Jahwes
  rationale: Die feste prophetische Formel wird nah an der hebräischen Konstruktion wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶל הַנָּבִיא
  choice: erging an den Propheten
  rationale: Mit דְּבַר יְהוָה bezeichnet אֶל den Empfänger der Offenbarung; „erging an“ entspricht der etablierten deutschen prophetischen Ausdrucksweise.
- source_word: אֲשֶׁר הֱשִׁיבוֹ
  choice: der ihn zurückgebracht hatte
  rationale: Der Hifil von שוב mit Suffix der 3. Person Singular maskulin bezeichnet, dass der Prophet ihn zur Rückkehr veranlasst beziehungsweise zurückgebracht hatte.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Eigennamen, statt ihn durch den traditionellen Ersatztitel wiederzugeben.
- issue: Identität des Offenbarungsempfängers
  choice: der Prophet, der ihn zurückgebracht hatte
  alternative: der Gottesmann, der zurückgebracht worden war
  rationale: Grammatisch bezieht sich אֲשֶׁר הֱשִׁיבוֹ auf הַנָּבִיא; die Hifil-Form ist aktiv-kausativ, und das Suffix bezeichnet den zurückgebrachten Mann. Daher empfängt der Prophet, der ihn zurückgebracht hatte, das Wort.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung mit Doppelpunkt macht den Ereigniseintritt klar und bewahrt zugleich den hebräischen Erzählfluss. Keine Fußnoten erforderlich.
