translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählstil. Die auffällige Wiederholung von „Leichnam“ und das statische Bild von Esel und Löwe wurden bewahrt. Die ungewöhnliche Formulierung mit שׁבר wird im Haupttext kontextgerecht und in der Fußnote wörtlich wiedergegeben.
