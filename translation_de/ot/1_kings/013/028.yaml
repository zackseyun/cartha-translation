base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/028.yaml
  text: He went and found his corpse thrown on the road[a], with the donkey and the lion standing beside the corpse. The lion had not eaten the corpse[b], nor had it torn apart the donkey.
translation:
  language: de
  text: Er ging hin und fand seinen Leichnam auf der Straße hingeworfen[a]; der Esel und der Löwe standen neben dem Leichnam. Der Löwe hatte den Leichnam nicht gefressen und den Esel nicht zerrissen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf dem Weg hingeworfen“. Das hebräische נְבֵלָה bezeichnet unverblümt einen toten Körper oder Kadaver.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „den Esel nicht zerbrochen“ oder „zerschlagen“. Im Zusammenhang ist gemeint, dass der Löwe den Esel nicht zerrissen hatte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְלָתוֹ / הַנְּבֵלָה
  choice: Leichnam
  rationale: נְבֵלָה bezeichnet einen toten Körper beziehungsweise Kadaver. Bei einem Menschen ist „Leichnam“ im Deutschen natürlich und würdevoll, bewahrt aber die nüchterne Härte des hebräischen Ausdrucks.
- source_word: מֻשְׁלֶכֶת
  choice: hingeworfen
  rationale: Das passive Partizip von שלך bezeichnet, dass der Leichnam hingeworfen oder niedergeworfen dalag. „Hingeworfen“ erhält die Kraft des Ausdrucks besser als bloßes „lag“.
- source_word: בַּדֶּרֶךְ
  choice: auf die Straße
  rationale: דֶּרֶךְ bezeichnet hier den Weg beziehungsweise die Straße. In Verbindung mit „hingeworfen“ gibt der Akkusativ im Deutschen die Lage als Ergebnis des Hinwerfens natürlich wieder.
- source_word: עֹמְדִים אֵצֶל
  choice: standen neben
  rationale: Partizip und Präposition zeichnen das sichtbare Bild, dass Esel und Löwe unmittelbar beim Leichnam stehen.
- source_word: לֹא אָכַל
  choice: hatte nicht gefressen
  rationale: אָכַל bedeutet grundsätzlich „essen“. Da ein Löwe Subjekt ist und ein Leichnam Objekt, ist „fressen“ die natürliche deutsche Entsprechung; das Plusquamperfekt beschreibt den bei der Ankunft festgestellten Zustand.
- source_word: שָׁבַר אֶת הַחֲמוֹר
  choice: hatte den Esel nicht zerfleischt
  rationale: שׁבר bedeutet wörtlich „brechen/zerschlagen“. Bei einem Raubtier und einem Tier als Objekt vermittelt „zerfleischen“ den kontextuellen Sinn verständlich, während die wörtliche Bildlichkeit in einer Fußnote erhalten bleibt.
- source_word: וַיֵּלֶךְ וַיִּמְצָא
  choice: Er ging hin und fand
  rationale: Die aufeinanderfolgenden Wayyiqtol-Formen geben eine schlichte narrative Abfolge wieder; „ging hin und fand“ entspricht diesem Verlauf natürlich.
