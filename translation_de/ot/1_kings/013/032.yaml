id: 1KI.13.32
reference: 1 Kings 13:32
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּי֩ הָיֹ֨ה יִהְיֶ֜ה הַ/דָּבָ֗ר אֲשֶׁ֤ר קָרָא֙ בִּ/דְבַ֣ר יְהוָ֔ה עַל הַ/מִּזְבֵּ֖חַ אֲשֶׁ֣ר בְּ/בֵֽית אֵ֑ל וְ/עַל֙ כָּל בָּתֵּ֣י הַ/בָּמ֔וֹת אֲשֶׁ֖ר בְּ/עָרֵ֥י שֹׁמְרֽוֹן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/032.yaml
  text: For the word that he cried out by the word of Yahweh against the altar that is in Bethel[a], and against all the houses of the high places that are in the cities of Samaria[b], will surely come to pass.
translation:
  language: de
  text: Denn das Wort, das er auf das Wort Jahwes hin gegen den Altar in Bethel und gegen alle Höhenheiligtümer[b] in den Städten Samarias ausgerufen hat, wird sich ganz gewiss erfüllen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „wird mit Gewissheit geschehen“. Im Hebräischen verstärkt ein vorangestellter Infinitiv die Gewissheit der Aussage.'
    reason: Die ungewöhnliche hebräische Intensivkonstruktion und ihre Aussagekraft werden transparent gemacht.
  - marker: b
    text: 'Wörtlich: „alle Häuser der Höhen“; gemeint sind die Heiligtümer an den Kulthöhen.'
    reason: Die natürliche deutsche Übersetzung deutet eine im Hebräischen formal bildhafte kultische Bezeichnung.
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für den vorausgehenden Bestattungswunsch ein und gibt die erklärende Funktion im Zusammenhang natürlich wieder.
- source_word: הָיֹה יִהְיֶה
  choice: wird ganz gewiss eintreffen
  rationale: Die Verbindung aus Infinitivus absolutus und Imperfekt von היה verstärkt die Gewissheit. „Ganz gewiss eintreffen“ bewahrt sowohl den Nachdruck als auch den Bezug auf die Erfüllung eines prophetischen Wortes.
- source_word: הַדָּבָר
  choice: das Wort
  rationale: Im prophetischen Zusammenhang bezeichnet דָּבָר die ausgesprochene Botschaft beziehungsweise Ankündigung, nicht lediglich eine Sache.
- source_word: אֲשֶׁר קָרָא
  choice: das er … ausgerufen hat
  rationale: קרא beschreibt hier die öffentliche, nachdrückliche Verkündigung des Gottesmannes. „Ausgerufen“ erhält die hörbare und öffentliche Dimension.
- source_word: בִּדְבַר יְהוָה
  choice: auf das Wort Jahwes hin
  rationale: Die Präposition bezeichnet hier Grundlage oder Veranlassung des prophetischen Ausrufs. Die Formulierung ist im Deutschen natürlich und bleibt nahe an „durch/aufgrund des Wortes Jahwes“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עַל
  choice: gegen
  rationale: Im Zusammenhang einer Gerichtsankündigung bezeichnet עַל das Ziel des anklagenden beziehungsweise verurteilenden Ausrufs.
- source_word: הַמִּזְבֵּחַ
  choice: den Altar
  rationale: Direkte und eindeutige Wiedergabe des kultischen Gegenstands.
- source_word: בְּבֵית אֵל
  choice: in Bethel
  rationale: בית אל ist hier ein Ortsname; „in Bethel“ fügt sich idiomatisch in die deutsche Satzstruktur ein.
- source_word: כָּל בָּתֵּי הַבָּמוֹת
  choice: alle Höhenheiligtümer
  rationale: Die wörtliche Verbindung „Häuser der Höhen“ bezeichnet Heiligtümer an den Kulthöhen. „Höhenheiligtümer“ ist verständliches modernes Deutsch; die formale Struktur wird in einer Fußnote dokumentiert.
- source_word: בְּעָרֵי שֹׁמְרוֹן
  choice: in den Städten Samarias
  rationale: Gibt die hebräische Genitivverbindung direkt wieder, ohne die mögliche historische Spannung der Bezeichnung „Samaria“ zu glätten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Text nennt den Tetragrammaton ausdrücklich. „Jahwe“ bewahrt ihn als persönlichen Gottesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Gewissheit der prophetischen Erfüllung in הָיֹה יִהְיֶה
  choice: wird ganz gewiss eintreffen
  alternative: wird geschehen; wird sich sicher erfüllen
  rationale: Die hebräische Intensivkonstruktion betont die sichere Erfüllung. Die Übersetzung erhält diesen Nachdruck, ohne eine über den Text hinausgehende theologische Erklärung einzufügen.
- issue: Deutung von בָּתֵּי הַבָּמוֹת
  choice: Höhenheiligtümer
  alternative: Häuser der Höhen; Heiligtümer auf den Höhen
  rationale: Gemeint sind kultische Gebäude beziehungsweise Heiligtümer an den Kulthöhen. Die flüssige Wiedergabe vermeidet im Haupttext eine im Deutschen missverständliche Wort-für-Wort-Form, während die Fußnote diese offenlegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt der hebräischen Begründungsstruktur, bleibt aber trotz des langen Relativsatzes gut lesbar. „Ausgerufen“ trägt den öffentlichen und nachdrücklichen Charakter der prophetischen Rede; „Höhenheiligtümer“ vermeidet die missverständliche wörtliche Form „Häuser der Höhen“.
