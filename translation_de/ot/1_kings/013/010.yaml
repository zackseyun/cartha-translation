  text: So he went by another way and did not return by the way he had come to Bethel.
translation:
  language: de
  text: So ging er auf einem anderen Weg und kehrte nicht auf dem Weg zurück, auf dem er nach Bethel gekommen war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: So ging er
  rationale: Das Narrativ- bzw. wayyiqtol führt die Handlung folgerichtig weiter; „So ging er“ gibt den Zusammenhang in natürlichem Deutsch wieder.
- source_word: בְּדֶרֶךְ אַחֵר
  choice: auf einem anderen Weg
  rationale: דֶּרֶךְ bezeichnet hier Weg oder Route. Die Formulierung bewahrt den ausdrücklichen Gegensatz zum Hinweg.
- source_word: וְלֹא שָׁב
  choice: und kehrte nicht … zurück
  rationale: שׁוּב bedeutet im Reisekontext „zurückkehren“; die deutsche Verbklammer ist idiomatisch und präzise.
- source_word: בַּדֶּרֶךְ אֲשֶׁר בָּא בָהּ
  choice: auf dem Weg, auf dem er … gekommen war
  rationale: Der Relativsatz bestimmt den früher benutzten Weg. Das Plusquamperfekt kennzeichnet die Anreise als vorzeitig gegenüber der Rückkehr.
- source_word: אֶל בֵּית אֵל
  choice: nach Bethel
  rationale: בֵּית אֵל ist der Ortsname Bethel; bei Zielangaben mit Ortsnamen ist „nach“ im Deutschen natürlich.
