base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/025.yaml
  text: And behold[a], men were passing by and saw the corpse thrown on the road, and the lion standing beside the corpse; and they came and reported it in the city where the old prophet lived.
translation:
  language: de
  text: Und siehe, da kamen Männer vorbei. Sie sahen den Leichnam auf den Weg hingeworfen und den Löwen neben dem Leichnam stehen. Darauf kamen sie in die Stadt, in der der alte Prophet wohnte, und berichteten dort davon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und redeten in der Stadt“. Im Zusammenhang ist damit gemeint, dass sie dort von dem Vorfall berichteten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Und siehe, da
  rationale: Bewahrt das hebräische Aufmerksamkeitssignal und die plötzliche Wendung der Erzählung; „da“ bindet es natürlich an den folgenden Satz an.
- source_word: אֲנָשִׁים עֹבְרִים
  choice: Männer kamen vorbei
  rationale: אֲנָשִׁים bezeichnet hier Männer; das Partizip stellt sie als gerade Vorübergehende vor. Die deutsche Verlaufsbedeutung ergibt sich idiomatisch aus „da kamen … vorbei“.
- source_word: הַנְּבֵלָה מֻשְׁלֶכֶת בַּדֶּרֶךְ
  choice: den Leichnam auf den Weg hingeworfen
  rationale: „Leichnam“ passt zum menschlichen Toten; „hingeworfen“ erhält die passive Bedeutung und die Kraft von מֻשְׁלֶכֶת, statt sie zu bloßem „liegen“ abzuschwächen.
- source_word: הָאַרְיֵה עֹמֵד אֵצֶל הַנְּבֵלָה
  choice: den Löwen neben dem Leichnam stehen
  rationale: Gibt die anschauliche Stellung des Löwen eng und zugleich natürlich wieder.
- source_word: וַיָּבֹאוּ
  choice: Darauf kamen sie in die Stadt
  rationale: Bewahrt die Grundbedeutung „kommen“ und macht im Deutschen das durch den folgenden Ortsausdruck bezeichnete Ziel deutlich.
- source_word: וַיְדַבְּרוּ בָעִיר
  choice: und berichteten dort davon
  rationale: Das Verb bedeutet wörtlich „sprechen“; im Zusammenhang geht es um das Weitergeben des beobachteten Geschehens. „Davon“ macht den im Hebräischen unausgesprochenen Bezug idiomatisch deutlich.
- source_word: אֲשֶׁר הַנָּבִיא הַזָּקֵן יֹשֵׁב בָּהּ
  choice: in der der alte Prophet wohnte
  rationale: יֹשֵׁב mit Ortsangabe bezeichnet hier den Wohnsitz; „wohnte“ ist modernes, klares Deutsch.
