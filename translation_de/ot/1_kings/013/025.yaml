  terminology: „Leichnam“ ist für den menschlichen Toten treffend; „Löwe“, „alter Prophet“ und „wohnte“ entsprechen dem Kontext und dem hebräischen Wortlaut. „Berichteten dort davon“ ist eine idiomatische, kontextgerechte Wiedergabe von „sprachen in der Stadt“.
