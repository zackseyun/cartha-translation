base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/011.yaml
  text: An old prophet was living in Bethel[a], and his sons came and told him all the deed that the man of God had done that day in Bethel, and the words that he had spoken to the king[b]; they told them to their father.
translation:
  language: de
  text: Ein alter Prophet wohnte in Bethel. Sein Sohn kam und erzählte ihm alles, was der Mann Gottes an jenem Tag in Bethel getan hatte, sowie die Worte, die er zum König gesprochen hatte; sie erzählten sie ihrem Vater.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht zunächst der Singular („sein Sohn kam und erzählte ihm“), am Versende aber Pluralformen („sie erzählten sie ihrem Vater“). Der unvermittelte Wechsel vom Singular zum Plural wird in der Übersetzung beibehalten.
    reason: textual_variant
lexical_decisions:
- source_word: נָבִיא אֶחָד זָקֵן
  choice: ein alter Prophet
  rationale: אֶחָד kennzeichnet hier wahrscheinlich eine unbestimmte Einzelperson. Im natürlichen Deutschen gibt „ein alter Prophet“ dies angemessen wieder; „ein gewisser alter Prophet“ ist ebenfalls möglich, wirkt jedoch stärker markiert.
- source_word: יֹשֵׁב בְּבֵית־אֵל
  choice: wohnte in Bethel
  rationale: Das Partizip יֹשֵׁב bezeichnet hier den Wohnsitz, nicht bloß die Körperhaltung; „wohnte“ ist im deutschen Erzählstil natürlich.
- source_word: וַיָּבֹא בְנוֹ
  choice: Dessen Sohn kam
  rationale: בְנוֹ ist morphologisch Singular. „Dessen“ macht eindeutig, dass es um den Sohn des alten Propheten geht, ohne den Satz unnötig zu beschweren.
- source_word: וַיְסַפֶּר לוֹ אֶת כָּל הַמַּעֲשֶׂה
  choice: erzählte ihm alles, was … getan hatte
  rationale: Das singularische מַעֲשֶׂה wird im Deutschen idiomatisch als Gesamtgeschehen wiedergegeben. Die Formulierung bewahrt den Bezug auf das Handeln des Mannes Gottes, ohne das unnatürliche „die ganze Tat“ zu erzwingen.
- source_word: אִישׁ הָאֱלֹהִים
  choice: der Mann Gottes
  rationale: Dies ist eine feste prophetische Bezeichnung in den Königebüchern und wird entsprechend wörtlich und konsistent wiedergegeben.
- source_word: הַיּוֹם
  choice: an jenem Tag
  rationale: Im rückblickenden deutschen Erzählzusammenhang ist „an jenem Tag“ die natürliche Entsprechung.
- source_word: אֶת הַדְּבָרִים אֲשֶׁר דִּבֶּר אֶל הַמֶּלֶךְ
  choice: und auch, was er zum König gesagt hatte
  rationale: Die idiomatische Wiedergabe hält die Rede vom zuvor genannten Handeln auseinander. „Zum König“ entspricht der Zielrichtung von אֶל.
- source_word: וַיְסַפְּרוּם לַאֲבִיהֶם
  choice: Danach erzählten sie es ihrem Vater
  rationale: Verb und Possessivsuffix sind pluralisch, während zuvor „sein Sohn“ im Singular steht. Der Haupttext bewahrt diesen Numeruswechsel; „es“ fasst Bericht und Worte natürlich zusammen.
