revisions:
- from: Ein alter Prophet wohnte in Bethel. Dessen Sohn kam und erzählte ihm alles, was der Mann Gottes an jenem Tag in Bethel getan hatte, und auch, was er zum König gesagt hatte. Danach erzählten sie es ihrem Vater.[a]
  to: Ein alter Prophet wohnte in Bethel. Sein Sohn kam und erzählte ihm alles, was der Mann Gottes an jenem Tag in Bethel getan hatte, sowie die Worte, die er zum König gesprochen hatte; sie erzählten sie ihrem Vater.[a]
  rationale: Die Revision entfernt die zusätzliche zeitliche Präzisierung, stellt die im Hebräischen gesondert genannten Worte wieder her und bildet den auffälligen Singular-Plural-Wechsel einschließlich des pluralischen Objektssuffixes am Versende transparent ab. Die Fußnote erläutert die Formulierung, ohne den Befund zu harmonisieren.
