translation_notes:
  register: Moderner, würdevoller Erzählstil. Der hebräische Singular-Plural-Wechsel wird nicht harmonisiert. Auf ein einleitendes „Nun“ wird verzichtet, da kein ausdrückliches zeitliches „nun“ im Ausgangstext steht.
