    issue: „Danach“ ergänzt eine zeitliche Abfolge.
    rationale: Der hebräische Text verbindet die Aussage mit Waw, ohne ein ausdrückliches „danach“ zu setzen. Die Ergänzung ist nicht erforderlich und sollte zur Wahrung der knappen erzählerischen Verknüpfung entfallen.
  - severity: medium
    issue: Das pluralische Objektssuffix am Versende wird mit singularischem „es“ nicht abgebildet.
    rationale: וַיְסַפְּרוּם ist als „sie erzählten sie/ihnen“ zu lesen, mit pluralischem Subjekt und Objekt. Die deutsche Fassung sollte die auffällige Pluralform, soweit idiomatisch möglich, sichtbar lassen; die Fußnote muss beide Pluralformen präzise benennen.
  - severity: low
    issue: „und auch, was er zum König gesagt hatte“ schwächt die eigenständige Nennung der „Worte“.
    rationale: אֶת־הַדְּבָרִים hebt die Worte neben der Tat ausdrücklich hervor. „sowie die Worte, die ...“ wahrt diese Struktur natürlicher und genauer.
