  text: וְ/הַ/מִּזְבֵּ֣חַ נִקְרָ֔ע וַ/יִּשָּׁפֵ֥ךְ הַ/דֶּ֖שֶׁן מִן הַ/מִּזְבֵּ֑חַ כַּ/מּוֹפֵ֗ת אֲשֶׁ֥ר נָתַ֛ן אִ֥ישׁ הָ/אֱלֹהִ֖ים בִּ/דְבַ֥ר יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/005.yaml
  text: And the altar was torn apart[a], and the ashes were poured out from the altar, according to the sign that the man of God had given by the word of Yahweh.
translation:
  language: de
  text: Und der Altar riss entzwei, und die Asche wurde vom Altar ausgeschüttet – entsprechend dem Zeichen[a], das der Mann Gottes durch das Wort Jahwes gegeben hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „entsprechend dem Wunderzeichen“ beziehungsweise „als das Zeichen“. Das hebräische Wort מוֹפֵת kann ein Zeichen, Wunderzeichen oder Vorzeichen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּזְבֵּחַ
  choice: der Altar
  rationale: Die übliche und im kultischen Zusammenhang hinreichend klare Wiedergabe von מִזְבֵּחַ.
- source_word: נִקְרָע
  choice: brach auseinander
  rationale: קרע bezeichnet ein Zerreißen oder Aufspalten. Die intransitive deutsche Form gibt das sichtbare Auseinanderbrechen des Altars natürlich wieder.
- source_word: וַיִּשָּׁפֵךְ הַדֶּשֶׁן
  choice: die Asche wurde … ausgeschüttet
  rationale: שׁפך bedeutet „ausgießen, ausschütten“; דֶּשֶׁן bezeichnet hier die Asche beziehungsweise die fetthaltigen Verbrennungsrückstände des Altars. „Asche“ ist im Deutschen klar und nicht unnötig technisch.
- source_word: מִן הַמִּזְבֵּחַ
  choice: vom Altar
  rationale: Gibt die räumliche Herkunft mit מן knapp und idiomatisch wieder.
- source_word: כַּמּוֹפֵת
  choice: entsprechend dem Zeichen
  rationale: כְּ bezeichnet hier die Übereinstimmung mit dem zuvor angekündigten Geschehen; מוֹפֵת kann „Zeichen“, „Wunderzeichen“ oder „Vorzeichen“ bedeuten.
- source_word: אֲשֶׁר נָתַן
  choice: das … gegeben hatte
  rationale: Bewahrt die Grundbedeutung von נתן und gibt das zeitliche Verhältnis zum eingetretenen Zeichen durch das Plusquamperfekt wieder.
- source_word: אִישׁ הָאֱלֹהִים
  choice: der Mann Gottes
  rationale: Die feste hebräische Bezeichnung wird beibehalten und nicht deutend durch „Prophet“ ersetzt.
- source_word: בִּדְבַר יְהוָה
  choice: durch das Wort Jahwes
  rationale: Bewahrt die formelhafte Wendung mit דָּבָר und lässt offen, ob besonders Ausspruch, Auftrag oder wirksames Wort gemeint ist.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der im hebräischen Text ausdrücklich stehende Eigenname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug und Bedeutung von מוֹפֵת
  choice: Zeichen
  alternative: Wunderzeichen / Vorzeichen
  rationale: „Zeichen“ wahrt die Funktion des Geschehens als bestätigendes, zuvor angekündigtes Zeichen, ohne den Begriff allein auf ein Wunder oder ein unheilvolles Vorzeichen festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem hebräischen Erzählfluss, während „brach auseinander“ und „vom Altar“ natürlich deutsch formuliert sind.
