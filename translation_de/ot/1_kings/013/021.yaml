source:
  edition: WLC
  text: וַ/יִּקְרָ֞א אֶל אִ֣ישׁ הָ/אֱלֹהִ֗ים אֲשֶׁר בָּ֤א מִֽ/יהוּדָה֙ לֵ/אמֹ֔ר כֹּ֖ה אָמַ֣ר יְהוָ֑ה יַ֗עַן כִּ֤י מָרִ֨יתָ֙ פִּ֣י יְהוָ֔ה וְ/לֹ֤א שָׁמַ֨רְתָּ֙ אֶת הַ/מִּצְוָ֔ה אֲשֶׁ֥ר צִוְּ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/021.yaml
  text: 'And he cried out to the man of God who had come from Judah[a], saying, “Thus says Yahweh: Because you have rebelled against the word of Yahweh and have not kept the command that Yahweh your God commanded you,”'
translation:
  language: de
  text: 'Da rief er dem Mann Gottes, der aus Juda gekommen war, zu: »So spricht Jahwe: Weil du dich gegen das Wort Jahwes[a] aufgelehnt und das Gebot nicht befolgt hast, das Jahwe, dein Gott, dir geboten hat,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „gegen den Mund Jahwes“; eine hebräische Wendung für das, was Jahwe gesprochen hat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֶל
  choice: Da rief er … zu
  rationale: קרא אל bezeichnet hier das an jemanden gerichtete, nachdrückliche Rufen. „Zurufen“ ist im Deutschen natürlich und passt zur prophetischen Strafankündigung, ohne eine öffentliche Proklamation vorauszusetzen.
- source_word: אִישׁ הָאֱלֹהִים
  choice: dem Mann Gottes
  rationale: Der feste hebräische Titel wird transparent und ohne die interpretierende Gleichsetzung mit „Prophet“ wiedergegeben.
- source_word: מִיהוּדָה
  choice: aus Juda
  rationale: Die Präposition bezeichnet die Herkunft; „aus Juda“ ist die natürliche deutsche Formulierung.
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Die feste prophetische Botenformel wird in ihrer knappen und würdevollen Gestalt bewahrt.
- source_word: יַעַן כִּי
  choice: Weil
  rationale: Die Verbindung leitet den Grund für das folgende Gerichtswort ein. „Weil“ gibt diese Funktion knapp und idiomatisch wieder.
- source_word: מָרִיתָ
  choice: du dich … aufgelehnt hast
  rationale: מרה drückt Widersetzlichkeit oder Auflehnung aus und ist stärker als ein bloßes Nichtbefolgen.
- source_word: פִּי יְהוָה
  choice: gegen das Wort Jahwes
  rationale: Wörtlich steht „gegen den Mund Jahwes“; die Wendung bezeichnet idiomatisch das von Jahwe Gesprochene. „Das Wort Jahwes“ bewahrt den Bezug auf seine Rede.
- source_word: וְלֹא שָׁמַרְתָּ
  choice: und … nicht befolgt hast
  rationale: שמר bezeichnet bei einem Gebot dessen Beachten oder Befolgen. Die deutsche Wiedergabe ist klar und gegenwärtig.
- source_word: הַמִּצְוָה
  choice: das Gebot
  rationale: Der Singular und der verbindliche Charakter der göttlichen Anweisung bleiben erhalten.
- source_word: אֲשֶׁר צִוְּךָ
  choice: das … dir gegeben hat
  rationale: Im Deutschen ist „ein Gebot geben“ eine natürliche Entsprechung zu צוה und vermeidet die schwerfällige Wiederholung „das Gebot, das … geboten hat“.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Jahwe, dein Gott
  rationale: Die bundesbezogene Verbindung wird direkt wiedergegeben; die Apposition erhält im Deutschen die persönliche Anrede.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Eigennamen JHWH. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Stärke von מָרִיתָ
  choice: du hast dich aufgelehnt
  alternative: du hast nicht gehorcht; du hast dich widersetzt
  rationale: Die Formulierung bewahrt den starken Vorwurf bewusster Auflehnung gegen Gottes Rede, ohne darüber hinaus eine besondere dogmatische Deutung einzutragen.
- issue: Bedeutung von פִּי יְהוָה
  choice: das Wort Jahwes
  alternative: der Mund Jahwes; der Befehl Jahwes
  rationale: Die wörtliche Körpermetapher ist im Hebräischen ein Idiom für das von Jahwe Gesprochene. „Wort“ wahrt diese Breite und legt die Wendung nicht ausschließlich als einzelnen Befehl aus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die prophetische Botenformel bleibt knapp und feierlich. Der Satz endet entsprechend dem hebräischen Verszuschnitt mit einem Komma, da die Strafankündigung im folgenden Vers weitergeführt wird.
