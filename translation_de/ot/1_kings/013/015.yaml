  text: Then he said to him[a], “Come home with me and eat bread.”
translation:
  language: de
  text: 'Da sagte er zu ihm: „Komm mit mir nach Hause und iss Brot.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Geh mit mir nach Hause und iss Brot.“ Das hebräische Wort für „Brot“ kann auch Nahrung oder eine Mahlzeit bezeichnen. Das Verb bedeutet wörtlich „geh“, wird bei dieser Einladung im Deutschen aber natürlich mit „komm“ wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte er
  rationale: Das konsekutive Waw führt die Erzählung weiter; „Da sagte er“ gibt die zeitliche Abfolge in natürlichem Deutsch wieder.
- source_word: אֵלָיו
  choice: zu ihm
  rationale: Direkte Wiedergabe der Präposition mit dem Suffix der 3. Person Singular maskulin.
- source_word: לֵךְ
  choice: Komm
  rationale: Das Verb bedeutet wörtlich „geh“, doch bei einer Einladung aus der Perspektive des Sprechers ist „komm mit mir“ im Deutschen idiomatisch und bewahrt den Sinn.
- source_word: אִתִּי
  choice: mit mir
  rationale: Direkte Wiedergabe der Präposition mit dem Suffix der 1. Person Singular.
- source_word: הַבָּיְתָה
  choice: nach Hause
  rationale: Die Richtungsendung bezeichnet eine Bewegung zum Haus hin; im Kontext der Einladung ist „nach Hause“ natürlich, ohne ausdrücklich „mein Haus“ hinzuzufügen.
- source_word: וֶאֱכֹל
  choice: und iss
  rationale: Die anschließende Aufforderung wird schlicht und direkt wiedergegeben.
- source_word: לָחֶם
  choice: etwas
  rationale: לֶחֶם bedeutet wörtlich „Brot“, kann aber metonymisch Nahrung oder eine Mahlzeit bezeichnen. „Iss etwas“ ist in einer deutschen Einladung natürlich; die wörtliche Form bleibt in der Fußnote sichtbar.
