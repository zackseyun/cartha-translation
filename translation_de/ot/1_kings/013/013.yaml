  verdict: approve
  source_fidelity: 'Der deutsche Text gibt alle Elemente des Hebräischen zutreffend wieder: die Anrede an seine Söhne, den Auftrag, den Esel für ihn zu satteln, die Ausführung und das anschließende Reiten auf ihm. Die Wiederholung von „Esel“ und „satteln“ bleibt erhalten. „Darauf“ ist ein natürlicher deutscher Bezug auf das Tier und entspricht רכב על.'
  naturalness: '„Und er sagte zu seinen Söhnen: ‚Sattelt mir den Esel!‘ Da sattelten sie ihm den Esel, und er ritt darauf.“ ist flüssiges, modernes Standarddeutsch bei angemessen würdigem Erzählregister. „Da“ bildet die unmittelbare narrative Folge idiomatisch ab.'
  terminology: „Söhne“ entspricht dem maskulinen Plural בָּנָיו; „Esel“ entspricht חֲמוֹר; „satteln“ trifft חבש im Kontext eines Reittiers. Es sind keine theologischen Fachbegriffe betroffen.
