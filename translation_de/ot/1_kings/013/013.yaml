base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/013.yaml
  text: And he said to his sons[a], “Saddle the donkey for me.” So they saddled the donkey for him, and he rode on it.
translation:
  language: de
  text: 'Und er sagte zu seinen Söhnen: „Sattelt mir den Esel!“ Da sattelten sie ihm den Esel, und er ritt darauf.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und er sagte
  rationale: Gibt die fortschreitende hebräische Erzählform wieder, ohne eine stärkere zeitliche Deutung einzutragen.
- source_word: בָּנָיו
  choice: seinen Söhnen
  rationale: Das hebräische Substantiv bezeichnet hier ausdrücklich die männlichen Nachkommen im Plural.
- source_word: חִבְשׁוּ לִי הַחֲמוֹר
  choice: Sattelt mir den Esel!
  rationale: חבש bezeichnet in diesem Zusammenhang das Satteln beziehungsweise Herrichten eines Reittiers; die deutsche Dativkonstruktion ist natürlich und prägnant.
- source_word: הַחֲמוֹר
  choice: den Esel
  rationale: חמור ist die gewöhnliche Bezeichnung für einen Esel.
- source_word: וַיַּחְבְּשׁוּ לוֹ הַחֲמוֹר
  choice: Da sattelten sie ihm den Esel
  rationale: Wiederholt wie im Hebräischen das Verb aus dem Befehl; „Da“ stellt die Handlung als unmittelbare Fortsetzung dar.
- source_word: וַיִּרְכַּב עָלָיו
  choice: und er ritt darauf
  rationale: רכב על bedeutet, auf einem Tier zu reiten. „Darauf“ ist im Deutschen idiomatisch und bewahrt den Bezug auf den Esel.
