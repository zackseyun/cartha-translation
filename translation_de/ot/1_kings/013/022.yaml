  yaml_path: translation/ot/1_kings/013/022.yaml
  text: but you came back and ate bread and drank water in the place about which he said to you[a], ‘Do not eat bread, and do not drink water’—your corpse shall not come to the tomb of your fathers.
translation:
  language: de
  text: 'Doch du bist umgekehrt und hast Brot gegessen und Wasser getrunken an dem Ort, von dem er dir gesagt hatte: »Iss kein Brot und trink kein Wasser!« Dein Leichnam wird nicht zum Grab deiner Väter kommen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Dein Leichnam wird nicht in das Grab deiner Väter gelangen.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּשָׁב
  choice: du bist umgekehrt
  rationale: Gibt שוב in der direkten Anrede und im Zusammenhang des vorangegangenen Verbots natürlich wieder; „umgekehrt“ bewahrt den Gedanken der Rückkehr beziehungsweise Richtungsänderung.
- source_word: וַתֹּאכַל לֶחֶם
  choice: hast Brot gegessen
  rationale: Bewahrt das konkrete Objekt „Brot“ und damit die wörtliche Wiederaufnahme des Verbots.
- source_word: וַתֵּשְׁתְּ מַיִם
  choice: hast Wasser getrunken
  rationale: Entspricht dem hebräischen Wortlaut und erhält die Wiederholung aus dem Verbot.
- source_word: בַּמָּקוֹם אֲשֶׁר דִּבֶּר אֵלֶיךָ
  choice: an dem Ort, von dem er zu dir gesagt hatte
  rationale: Bezieht den Relativsatz wie im Hebräischen auf den Ort; das Plusquamperfekt macht im Deutschen klar, dass die Anweisung zuvor ergangen war.
- source_word: אַל תֹּאכַל לֶחֶם וְאַל תֵּשְׁתְּ מָיִם
  choice: »Iss kein Brot und trink kein Wasser!«
  rationale: Gibt beide Verbote direkt und mit ihrer rhetorischen Parallelität wieder.
- source_word: נִבְלָתְךָ
  choice: dein Leichnam
  rationale: „Leichnam“ bezeichnet den toten Körper deutlich und würdevoll, ohne die Schärfe von נבלה zu beseitigen.
- source_word: לֹא תָבוֹא נִבְלָתְךָ אֶל קֶבֶר אֲבֹתֶיךָ
  choice: dein Leichnam wird nicht in das Grab deiner Väter kommen
  rationale: Bewahrt das hebräische Bild des „Kommens“ und den familiären Begräbnisort, ohne eine nicht ausdrücklich genannte passive Handlung einzufügen.
- source_word: אֲבֹתֶיךָ
  choice: deiner Väter
  rationale: Erhält die maskuline und familiäre Formulierung des Ausgangstextes; gemeint ist die väterliche Familiengrablege.
theological_decisions:
- issue: Art des Gerichtswortes
  choice: Konkrete Ankündigung, dass der Leichnam nicht in die Familiengrablege gelangen wird
  alternative: Allgemeine bildhafte Aussage über Schande nach dem Tod
  rationale: Der hebräische Wortlaut spricht unmittelbar vom Leichnam und vom Grab der Väter. Die Übersetzung erhält diese konkrete Aussage, ohne ihre weitergehende theologische Bedeutung auszudeuten.
- issue: Logische Verbindung des abschließenden Gerichtswortes
  choice: „Darum“ als im Zusammenhang klarer Folgesinn
  alternative: 'Unverbundene Wiedergabe: „Dein Leichnam wird nicht …“'
  rationale: Im Hebräischen steht keine ausdrückliche Kausalpartikel; der Folgesinn ergibt sich jedoch aus dem vorangestellten Ungehorsam. „Darum“ macht die deutsche Satzverknüpfung natürlich, ohne den Inhalt des Gerichts zu erweitern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter, eindringlicher Rede. Die konkreten Wiederholungen „Brot“ und „Wasser“ sowie das herbe „Leichnam“ bleiben erhalten. Der Fußnotenmarker [a] steht im Haupttext.
