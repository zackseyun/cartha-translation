  text: So he went back with him and ate bread in his house and drank water[a].
translation:
  language: de
  text: Da kehrte er mit ihm zurück, aß Brot in seinem Haus und trank Wasser.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „aß Brot“. Die Wendung kann allgemein bedeuten, dass jemand eine Mahlzeit einnimmt. Die wörtlichere Formulierung bleibt hier erhalten, weil Brot und Wasser für die umgebende Erzählung wichtig sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: Da kehrte er … zurück
  rationale: Das Wayyiqtol von שׁוב bezeichnet hier die nächste abgeschlossene Handlung der Erzählung. „Zurückkehren“ gibt die Rückbewegung natürlich und präzise wieder.
- source_word: אִתּוֹ
  choice: mit ihm
  rationale: Direkte Wiedergabe der Präposition mit Suffix der 3. Person Singular maskulin; sie bezeichnet die Begleitung.
- source_word: וַיֹּאכַל לֶחֶם
  choice: aß Brot
  rationale: Die Wendung kann idiomatisch „eine Mahlzeit essen“ bedeuten. Die konkrete Wiedergabe mit „Brot“ bleibt erhalten, weil Brot im Zusammenhang mit dem zuvor ausgesprochenen Verbot eine wichtige Rolle spielt.
- source_word: בְּבֵיתוֹ
  choice: in seinem Haus
  rationale: Wörtliche und klare Wiedergabe. Das Suffix bezieht sich im Kontext auf den alten Propheten.
- source_word: וַיֵּשְׁתְּ מָיִם
  choice: trank Wasser
  rationale: Direkte Wiedergabe der hebräischen Verbalphrase. „Wasser“ wird ausdrücklich genannt, weil es das im näheren Kontext verbotene Handeln aufgreift.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Erzählstruktur des Hebräischen wird bewahrt; „Da“ markiert natürlich den Fortgang der Handlung. Der konkrete Wortlaut „Brot“ und „Wasser“ bleibt wegen seiner erzählerischen Bedeutung erhalten.
