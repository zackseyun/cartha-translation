- from: Weil ich dich aus dem Staub erhoben und zum Herrscher über mein Volk Israel gemacht habe, du aber auf dem Weg Jerobeams gegangen bist und mein Volk Israel zur Sünde verleitet hast, sodass sie mich durch ihre Sünden zum Zorn reizten,
  to: Weil ich dich aus dem Staub erhoben und zum Herrscher über mein Volk Israel gemacht habe und du den Weg Jerobeams gegangen bist und mein Volk Israel zur Sünde veranlasst hast, um mich durch ihre Sünden zum Zorn zu reizen,
  rationale: Die Revision bewahrt die kausative Verantwortlichkeit Baëschas und stellt beim abschließenden Infinitiv die syntaktische und semantische Kontinuität zu ihm wieder her. Sie behält den Bezug von „ihre Sünden“ auf Israel bei und lässt den Satzanschluss an V. 3 offen.
