  text: יַ֗עַן אֲשֶׁ֤ר הֲרִימֹתִ֨י/ךָ֙ מִן הֶ֣/עָפָ֔ר וָ/אֶתֶּנְ/ךָ֣ נָגִ֔יד עַ֖ל עַמִּ֣/י יִשְׂרָאֵ֑ל וַ/תֵּ֣לֶךְ בְּ/דֶ֣רֶךְ יָרָבְעָ֗ם וַֽ/תַּחֲטִא֙ אֶת עַמִּ֣/י יִשְׂרָאֵ֔ל לְ/הַכְעִיסֵ֖/נִי בְּ/חַטֹּאתָֽ/ם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/002.yaml
  text: Because I raised you up from the dust and made you ruler over my people Israel[a], and you walked in the way of Jeroboam and caused my people Israel to sin, provoking me to anger by their sins,
translation:
  language: de
  text: Weil ich dich aus dem Staub erhoben und zum Herrscher über mein Volk Israel gemacht habe und du den Weg Jerobeams gegangen bist und mein Volk Israel zur Sünde veranlasst hast, um mich durch ihre Sünden zum Zorn zu reizen,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: Weil
  rationale: Die Wortverbindung leitet den Grund für das im folgenden Vers angekündigte Gericht ein; „Weil“ gibt diese kausale Funktion natürlich wieder.
- source_word: הֲרִימֹתִיךָ מִן הֶעָפָר
  choice: ich dich aus dem Staub erhoben
  rationale: Bewahrt das Bild des Emporhebens aus niedriger Stellung und zugleich den politischen Aufstieg Baëschas.
- source_word: וָאֶתֶּנְךָ נָגִיד עַל עַמִּי יִשְׂרָאֵל
  choice: und zum Herrscher über mein Volk Israel gemacht habe
  rationale: „Herrscher“ gibt נָגִיד im königlichen Zusammenhang verständlich wieder; „mein Volk“ bewahrt den besitzanzeigenden Nachdruck.
- source_word: וַתֵּלֶךְ בְּדֶרֶךְ יָרָבְעָם
  choice: du aber auf dem Weg Jerobeams gegangen bist
  rationale: Die Wegmetapher für eine bestimmte Lebens- und Regierungspraxis bleibt erhalten. „Aber“ macht den im Zusammenhang liegenden Gegensatz zwischen Gottes Erhebung und Baëschas Verhalten deutlich.
- source_word: וַתַּחֲטִא אֶת עַמִּי יִשְׂרָאֵל
  choice: und mein Volk Israel zur Sünde verleitet hast
  rationale: Die Form ist kausativ. „Zur Sünde verleitet“ bringt sowohl Baëschas ursächliche Verantwortung als auch das eigene Handeln des Volkes idiomatisch zum Ausdruck.
- source_word: לְהַכְעִיסֵנִי בְּחַטֹּאתָם
  choice: sodass sie mich durch ihre Sünden zum Zorn reizten
  rationale: „Sodass“ gibt hier die Folge der Verführung zur Sünde natürlich wieder; der Pluralsuffix wird entsprechend seinem nächstliegenden Bezugswort auf das Volk Israel bezogen.
theological_decisions:
- issue: Bezug des Pluralsuffixes in בְּחַטֹּאתָם („durch ihre Sünden“)
  choice: Das Suffix bezieht sich auf die von Baëscha zur Sünde verleiteten Israeliten.
  alternative: Es kann allgemeiner die mit dem Weg Jerobeams verbundenen Sündenpraktiken einschließlich Baëschas eigener Beteiligung bezeichnen.
  rationale: Das unmittelbar vorausgehende „mein Volk Israel“ ist der natürlichste Bezug. So bleiben sowohl die Verantwortung des Königs für die Verführung als auch die Verantwortung des Volkes für seine eigenen Sünden bestehen.
- issue: Verhältnis der Satzglieder nach Gottes Erhebung Baëschas
  choice: „aber“ als sinngemäße Wiedergabe des erzählerischen וַ
  alternative: Eine rein anreihende Wiedergabe mit „und“ ist formal näher am hebräischen Bindewort.
  rationale: Der Kontext stellt Baëschas Verhalten deutlich Gottes gnädiger Erhebung entgegen. Das Deutsche benötigt für diesen Gegensatz eher „aber“, ohne damit einen fremden theologischen Gedanken einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die biblische Wegmetapher und das Bild vom Staub bleiben erhalten. Der Vers endet mit einem Komma, weil der begründende Nebensatz in Vers 3 fortgeführt wird.
