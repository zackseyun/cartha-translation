  text: אֶ֚ל כָּל חַטֹּ֣אות בַּעְשָׁ֔א וְ/חַטֹּ֖אות אֵלָ֣ה בְנ֑/וֹ אֲשֶׁ֣ר חָטְא֗וּ וַ/אֲשֶׁ֤ר הֶחֱטִ֨יאוּ֙ אֶת יִשְׂרָאֵ֔ל לְ/הַכְעִ֗יס אֶת יְהוָ֛ה אֱלֹהֵ֥י יִשְׂרָאֵ֖ל בְּ/הַבְלֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/013.yaml
  text: because of all the sins of Baasha and the sins of Elah his son[a], which they committed and by which they caused Israel to sin, provoking Yahweh, the God of Israel, with their idols.
translation:
  language: de
  text: wegen all der Sünden Baaschas und der Sünden seines Sohnes Ela, die sie begingen und durch die sie Israel zum Sündigen veranlassten, um Jahwe, den Gott Israels, mit ihren nichtigen Götzen[a] zum Zorn zu reizen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mit ihren Nichtigkeiten“; eine polemische Bezeichnung für Götzen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל
  choice: wegen
  rationale: Die Präposition leitet hier rückbezüglich den Grund für das zuvor genannte Gericht ein; „wegen“ gibt diese kausale Funktion natürlich wieder.
- source_word: כָּל חַטֹּאות
  choice: all der Sünden
  rationale: Bewahrt sowohl den umfassenden Sinn von כָּל als auch die direkte Bedeutung des Plurals חַטֹּאות.
- source_word: בַּעְשָׁא
  choice: Baascha
  rationale: Im Deutschen gebräuchliche biblische Umschrift des Personennamens.
- source_word: וְחַטֹּאות אֵלָה בְנוֹ
  choice: und der Sünden seines Sohnes Ela
  rationale: Gibt das Besitz- und Verwandtschaftsverhältnis der hebräischen Fügung eindeutig und in natürlicher deutscher Wortstellung wieder.
- source_word: אֲשֶׁר חָטְאוּ
  choice: die sie begingen
  rationale: Das Relativpronomen bezieht sich auf die Sünden; im Deutschen ist „Sünden begehen“ idiomatisch.
- source_word: וַאֲשֶׁר הֶחֱטִיאוּ אֶת יִשְׂרָאֵל
  choice: und zu denen sie Israel verführten
  rationale: Der Hifil von חטא bezeichnet das Veranlassen zum Sündigen. „Zu denen“ hält den Rückbezug auf die genannten Sünden fest, während „verführten“ die ursächliche Einflussnahme natürlich ausdrückt.
- source_word: לְהַכְעִיס
  choice: So reizten sie … zum Zorn
  rationale: Der Infinitiv bezeichnet Ziel oder Folge ihres Handelns. Ein neuer deutscher Satz macht den Zusammenhang klar, ohne sich zwischen Zweck und Ergebnis enger als nötig festzulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: den Gott Israels
  rationale: Direkte und geläufige Wiedergabe der hebräischen Genitivverbindung.
- source_word: בְּהַבְלֵיהֶם
  choice: durch ihre nichtigen Götzen
  rationale: הֶבֶל bedeutet wörtlich etwas Flüchtiges oder Nichtiges und bezeichnet hier polemisch die Götzen. Die Formulierung macht den Bezug verständlich und erhält zugleich das Werturteil des hebräischen Ausdrucks.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen Gottes. „Jahwe“ bewahrt diesen Namen, statt ihn durch den traditionellen Ersatztitel wiederzugeben.
- issue: Deutung von בְּהַבְלֵיהֶם
  choice: durch ihre nichtigen Götzen
  alternative: durch ihre Nichtigkeiten
  rationale: Im Zusammenhang der Königsbücher zielt der polemische Ausdruck auf Götzen; „nichtige Götzen“ macht den Referenten deutlich, ohne die im Wort enthaltene Aussage ihrer Wertlosigkeit zu verlieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange hebräische Satz wurde zur besseren Verständlichkeit in zwei Sätze gegliedert. Die Formulierung wahrt den Rückbezug der Relativsätze und lässt offen, ob das Reizen zum Zorn primär als Zweck oder als Folge beschrieben wird.
