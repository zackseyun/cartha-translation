  to: wegen all der Sünden Baaschas und der Sünden seines Sohnes Ela, die sie begingen und durch die sie Israel zum Sündigen veranlassten, um Jahwe, den Gott Israels, mit ihren nichtigen Götzen[a] zum Zorn zu reizen.
  rationale: Die Revision gibt die kausative Bedeutung von הֶחֱטִיאוּ ausdrücklich wieder und bewahrt zugleich den Rückbezug der Relativsätze auf die genannten Sünden. Die finale Infinitivkonstruktion und die instrumentale Präposition werden in einem zusammenhängenden deutschen Satz eng am hebräischen Zusammenhang wiedergegeben. Die Fußnote dokumentiert die wörtliche, polemische Lexik von הֶבֶל.
