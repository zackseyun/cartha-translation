source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ אַחְאָ֧ב בֶּן עָמְרִ֛י הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה מִ/כֹּ֖ל אֲשֶׁ֥ר לְ/פָנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/030.yaml
  text: Ahab son of Omri did what was evil in the sight of Yahweh[b][a], more than all who were before him.
translation:
  language: de
  text: Ahab, der Sohn Omris, tat in den Augen Jahwes mehr Böses als alle seine Vorgänger[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mehr als alle, die vor ihm waren“.'
    reason: Die hebräische Wendung kann zeitlich auf Ahabs Vorgänger bezogen werden.
lexical_decisions:
- source_word: וַיַּעַשׂ ... הָרַע
  choice: tat, was ... böse war
  rationale: Die Verbindung von עשה mit dem substantivierten הָרַע bezeichnet das Tun des Bösen. Die deutsche Formulierung ist natürlich und bewahrt zugleich die moralische Wertung des hebräischen Textes.
- source_word: בְּעֵינֵי יְהוָה
  choice: in den Augen Jahwes
  rationale: Die hebräische Wendung wird im Deutschen verständlich und bildgetreu wiedergegeben; sie bezeichnet Jahwes Beurteilung von Ahabs Handeln.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Form des persönlichen Gottesnamens gibt das Tetragramm wieder, statt es durch einen Titel zu ersetzen.
- source_word: מִכֹּל אֲשֶׁר לְפָנָיו
  choice: mehr als alle, die vor ihm gewesen waren
  rationale: Das vergleichende מִן zeigt, dass Ahab hinsichtlich des Bösen alle Vorgänger übertraf. Die Formulierung bewahrt sowohl den Vergleich als auch die zeitliche Bedeutung von לְפָנָיו.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich den Gottesnamen. „Jahwe“ bewahrt im modernen Deutschen den Charakter als Eigenname, während „der HERR“ die traditionelle ersetzende Lesung darstellt.
- issue: Vergleich mit den früheren Herrschern
  choice: mehr als alle, die vor ihm gewesen waren
  alternative: schlimmer als alle seine Vorgänger
  rationale: Die gewählte Fassung hält sich enger an die offene hebräische Vergleichskonstruktion und ergänzt weder ausdrücklich „Könige“ noch wiederholt sie das Böse als Adverb.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bleibt nahe am Hebräischen, ohne unnatürlich zu wirken. Der Gottesname wird als „Jahwe“ wiedergegeben.
