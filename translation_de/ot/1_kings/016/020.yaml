base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/020.yaml
  text: The rest of the acts of Zimri[a], and his conspiracy that he carried out—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: de
  text: Die übrigen Taten Simris und seine Verschwörung, die er anzettelte[a] – sind sie nicht im Buch der Chronik der Könige von Israel aufgeschrieben?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen stehen das Wort für „Verschwörung“ und ein Verb derselben Wortwurzel zur Betonung nebeneinander.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי זִמְרִי
  choice: Die übrigen Taten Simris
  rationale: יֶתֶר bezeichnet in der wiederkehrenden Königsformel den noch nicht berichteten Rest; דְּבָרִים meint hier die Taten beziehungsweise Angelegenheiten des Königs, nicht nur seine Worte.
- source_word: וְקִשְׁרוֹ
  choice: und seine Verschwörung
  rationale: קֶשֶׁר bezeichnet im königlichen Zusammenhang eine politische Verschwörung. Das Possessivpronomen gibt das hebräische Suffix der 3. Person Singular wieder.
- source_word: אֲשֶׁר קָשָׁר
  choice: die er anzettelte
  rationale: Das Hebräische verbindet ein Substantiv mit einem stammverwandten Verb. Da sich diese Wiederholung im Deutschen nicht natürlich nachbilden lässt, gibt „anzettelte“ die aktive Durchführung des Komplotts idiomatisch wieder; die formale Besonderheit wird in der Fußnote erläutert.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: sind sie nicht … aufgeschrieben?
  rationale: Die rhetorische Frage und das Passiv des hebräischen Textes bleiben erhalten.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: im Buch der Chronik
  rationale: In der archivalischen Formel wird עַל idiomatisch mit „im“ wiedergegeben. דִּבְרֵי הַיָּמִים bezeichnet eine annalistische Chronik.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: der Könige von Israel
  rationale: Die Präposition לְ kennzeichnet hier die Zuordnung im Titel des genannten Werkes.
