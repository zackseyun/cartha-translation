  text: וַ/יֵּ֗לֶךְ בְּ/כָל דֶּ֨רֶךְ֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט ו/ב/חטאתי/ו אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵ֑ל לְ/הַכְעִ֗יס אֶת יְהוָ֛ה אֱלֹהֵ֥י יִשְׂרָאֵ֖ל בְּ/הַבְלֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/026.yaml
  text: For he walked in all the way of Jeroboam son of Nebat[a], and in his sins by which he caused Israel to sin, provoking Yahweh, the God of Israel, with their idols.
translation:
  language: de
  text: Er folgte in allem dem Weg Jerobeams, des Sohnes Nebats, und dessen Sünden, durch die Jerobeam Israel zum Sündigen gebracht hatte, um Jahwe, den Gott Israels, durch ihre nichtigen Götzen[a] zum Zorn zu reizen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „durch ihre Nichtigkeiten“ oder „durch ihre wertlosen Dinge“; das hebräische Wort ist eine polemische Bezeichnung für Götzen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּכָל דֶּרֶךְ
  choice: Er folgte in allem dem Weg
  rationale: הלך mit „Weg“ bezeichnet hier die Lebensführung. „Dem Weg folgen“ bewahrt das hebräische Bild und gibt die vollständige Übereinstimmung mit Jerobeams Verhalten natürlich wieder.
- source_word: יָרָבְעָם בֶּן־נְבָט
  choice: Jerobeam, der Sohn Nebats
  rationale: Die Namen werden in ihrer im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: וּבְחַטֹּאתָיו
  choice: und seinen Sünden
  rationale: Der Plural mit maskulinem Suffix bezieht sich auf Jerobeams Sünden; die knappe Form entspricht dem Hebräischen.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת־יִשְׂרָאֵל
  choice: zu denen er Israel verführt hatte
  rationale: Der Hifil von חטא ist kausativ. „Zu Sünden verführen“ drückt aus, dass Jerobeam Israel zum Sündigen brachte, ohne den deutschen Satz unnötig zu beschweren.
- source_word: לְהַכְעִיס
  choice: um … zum Zorn zu reizen
  rationale: Der Infinitiv kann Zweck oder Folge ausdrücken. Die deutsche Infinitivkonstruktion bewahrt diese Zielrichtung und die traditionelle Bedeutung des Verbs.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: den Gott Israels
  rationale: Direkte und natürliche Wiedergabe der hebräischen Genitivverbindung.
- source_word: בְּהַבְלֵיהֶם
  choice: durch ihre nichtigen Götzen
  rationale: הבל bezeichnet wörtlich etwas Flüchtiges, Nichtiges oder Wertloses und dient hier polemisch als Bezeichnung für Götzen. „Nichtige Götzen“ macht sowohl den Bezug als auch die Wertung sichtbar.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht der Eigenname Gottes. „Jahwe“ bewahrt diesen Namenscharakter, statt ihn durch einen Titel zu ersetzen.
- issue: Deutung von הבל im kultischen Zusammenhang
  choice: nichtige Götzen
  alternative: Nichtigkeiten / wertlose Dinge
  rationale: Der Kontext von Jerobeams Sünden legt Götzen als konkreten Bezug nahe; das Adjektiv „nichtig“ bewahrt zugleich die polemische Metapher von Wertlosigkeit und Leere.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Weg-Motiv bleibt erhalten; schwer verständliche hebräische Syntax wird behutsam geglättet. Der Fußnotenmarker steht unmittelbar bei der erklärten Wendung.
