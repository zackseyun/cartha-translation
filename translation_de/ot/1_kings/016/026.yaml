  to: Er folgte in allem dem Weg Jerobeams, des Sohnes Nebats, und dessen Sünden, durch die Jerobeam Israel zum Sündigen gebracht hatte, um Jahwe, den Gott Israels, durch ihre nichtigen Götzen[a] zum Zorn zu reizen.
