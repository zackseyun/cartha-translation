source:
  edition: WLC
  text: וַ/יַּעֲשֶׂ֥ה עָמְרִ֛י הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יָּ֕רַע מִ/כֹּ֖ל אֲשֶׁ֥ר לְ/פָנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/025.yaml
  text: Omri did what was evil in the eyes of Yahweh[a], and he did more evil than all who were before him.
translation:
  language: de
  text: Omri tat, was in den Augen Jahwes böse war, und er tat mehr Böses als alle, die vor ihm gewesen waren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und er war schlimmer als alle, die vor ihm gewesen waren.« Das hebräische Verb kann Omri selbst oder sein böses Handeln bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשֶׂה
  choice: tat
  rationale: Das Verb עשה steht mit הָרַע in der festen wertenden Wendung »tun, was böse ist«. »Tat« gibt diese Handlungsaussage im Deutschen natürlich wieder.
- source_word: הָרַע
  choice: was … böse war
  rationale: Das substantivierte Adjektiv bezeichnet hier das Böse beziehungsweise das, was böse ist. Die Relativkonstruktion ist im modernen Deutschen idiomatisch.
- source_word: בְּעֵינֵי
  choice: in den Augen
  rationale: Die Formulierung bewahrt das hebräische Bild und bezeichnet Jahwes wertende Perspektive.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; »Jahwe« ist die im Deutschen geläufige Form.
- source_word: וַיָּרַע
  choice: handelte schlimmer
  rationale: Der Hifil von רעע hat im Vergleich mit מִכֹּל einen steigernden Sinn. Die Wiedergabe beschreibt Omris böses Handeln, ohne ein im Hebräischen nicht ausdrücklich genanntes Objekt einzufügen.
- source_word: מִכֹּל אֲשֶׁר לְפָנָיו
  choice: als alle, die vor ihm gewesen waren
  rationale: Die Formulierung hält sich an den allgemeinen Ausdruck des Hebräischen. Dass damit frühere Könige gemeint sind, ergibt sich aus dem Zusammenhang und muss nicht in den Vers hineingeschrieben werden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. Die Transliteration bewahrt den Eigenname-Charakter, statt ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Bezug von וַיָּרַע
  choice: Aussage über Omris schlimmeres Handeln
  alternative: Aussage, dass Omri selbst schlimmer beziehungsweise böser war
  rationale: Im Kontext der Königsbewertungen liegt die Deutung als Handlungsaussage nahe; die knappe hebräische Verbform lässt jedoch auch eine stärker auf Omris Person bezogene Wiedergabe zu. Diese Mehrdeutigkeit wird in der Fußnote offengelegt.
translation_notes:
  register: Moderne, würdige Standardsprache. Die vertraute hebräische Bildrede »in den Augen« bleibt erhalten; der Vergleich wird bewusst nicht durch das ausdrücklichere, aber interpretierende »alle seine Vorgänger« ersetzt.
