- from: Da kam Simri herein, erschlug ihn und tötete ihn im siebenundzwanzigsten Regierungsjahr Asas, des Königs von Juda. Dann wurde er an seiner Stelle König.
  to: Da kam Simri herein, schlug ihn und tötete ihn im siebenundzwanzigsten Regierungsjahr Asas, des Königs von Juda; und er wurde an seiner Stelle König.
  rationale: Die Änderung von „erschlug“ zu „schlug“ bewahrt die im Hebräischen vorhandene Folge von Gewalthandlung und Tötung. Der übrige Wortlaut bleibt nahe am Ausgangstext; insbesondere wird die Datierungsformel präzise und idiomatisch beibehalten.
