base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/010.yaml
  text: Then Zimri came in, struck him down, and killed him, in the twenty-seventh year of Asa king of Judah; and he reigned in his place.
translation:
  language: de
  text: Da kam Simri herein, schlug ihn und tötete ihn im siebenundzwanzigsten Regierungsjahr Asas, des Königs von Juda; und er wurde an seiner Stelle König.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Da kam ... herein
  rationale: בוא bedeutet „kommen“ oder „hineingehen“. „kam herein“ gibt im Zusammenhang des Anschlags den Eintritt wieder, ohne einen im Vers nicht genannten Ort zu ergänzen; „Da“ trägt den Erzählfortgang des Waw-Konsekutivs natürlich ins Deutsche.
- source_word: זִמְרִי
  choice: Simri
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: וַיַּכֵּהוּ
  choice: erschlug ihn
  rationale: נכה bezeichnet das Schlagen oder Niederschlagen. „erschlug ihn“ gibt die tödliche Gewalttat knapp wieder; das folgende „und tötete ihn“ bewahrt zugleich die ausdrückliche Doppelung des Hebräischen.
- source_word: וַיְמִיתֵהוּ
  choice: und tötete ihn
  rationale: Die Hifil-Form von מות bedeutet „sterben lassen, töten“. Die direkte Wiedergabe erhält die im Ausgangstext ausdrücklich genannte Folgehandlung beziehungsweise Verstärkung.
- source_word: בִּשְׁנַת עֶשְׂרִים וָשֶׁבַע לְאָסָא
  choice: im siebenundzwanzigsten Regierungsjahr Asas
  rationale: Die Formulierung ist eine königliche Datierungsformel. „Regierungsjahr“ macht den im Deutschen sonst möglichen Eindruck eines Lebensjahres unmissverständlich, ohne zusätzliche Sachinformation einzuführen.
- source_word: מֶלֶךְ יְהוּדָה
  choice: des Königs von Juda
  rationale: Die Apposition wird in natürlichem, würdigem Standarddeutsch wiedergegeben.
- source_word: וַיִּמְלֹךְ
  choice: Dann wurde er ... König
  rationale: מלך kann sowohl „regieren/herrschen“ als auch „König werden“ bezeichnen. Mit תַּחְתָּיו steht hier der Herrschaftsantritt im Vordergrund; die gewählte Form ist im Deutschen natürlicher als „er regierte an seiner Stelle“.
- source_word: תַּחְתָּיו
  choice: an seiner Stelle
  rationale: תחתיו bezeichnet im Zusammenhang der Thronfolge das Einnehmen der Stellung des Vorgängers. „an seiner Stelle“ bewahrt dieses Bild transparent.
theological_decisions: []
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die knappe Erzählweise und die ausdrückliche Abfolge der Gewaltverben bleiben erhalten. Der zweite Satz vermeidet ein missverständliches Pronomengefüge und gibt den Herrschaftsantritt idiomatisch wieder.
