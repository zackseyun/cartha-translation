base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/014.yaml
  text: The rest of the acts of Elah[a], and all that he did—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: de
  text: Sind nicht die übrigen Taten Elas und alles, was er getan hat, im Buch der Chronik[a] der Könige Israels aufgezeichnet?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »im Buch der Annalen der Könige Israels«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי אֵלָה
  choice: Was es sonst noch über Ela … zu berichten gibt
  rationale: יֶתֶר bezeichnet das Übrige bzw. Weitere; דִּבְרֵי meint in dieser Königsformel die berichteten Angelegenheiten und Taten. Die deutsche Formulierung gibt den Sinn natürlich wieder, ohne ein nicht ausdrücklich vorhandenes zeitliches »nun« einzuführen.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: und alles, was er tat
  rationale: Die Wendung bewahrt den umfassenden Sinn von כֹּל und die breite Bedeutung von עשה.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: steht das nicht
  rationale: הֲלוֹא leitet eine rhetorische Frage ein, die Zustimmung erwartet. Im Deutschen bezieht sich der idiomatische Singular »das« zusammenfassend auf den zuvor genannten Berichtsinhalt; »steht … im Buch« gibt כְּתוּבִים עַל־סֵפֶר natürlich wieder.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: im Buch der Chronik
  rationale: עַל־סֵפֶר wird bei in einem Dokument verzeichnetem Inhalt idiomatisch mit »im Buch« wiedergegeben. דִּבְרֵי הַיָּמִים bezeichnet hier eine annalistische Chronik.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: der Könige von Israel
  rationale: 'Das לְ kennzeichnet hier die Zugehörigkeit bzw. den Gegenstandsbereich der Chronik: Sie betrifft die Könige Israels.'
