  text: בִּ/שְׁנַת֩ עֶשְׂרִ֨ים וָ/שֶׁ֜בַע שָׁנָ֗ה לְ/אָסָא֙ מֶ֣לֶךְ יְהוּדָ֔ה מָלַ֥ךְ זִמְרִ֛י שִׁבְעַ֥ת יָמִ֖ים בְּ/תִרְצָ֑ה וְ/הָ/עָ֣ם חֹנִ֔ים עַֽל גִּבְּת֖וֹן אֲשֶׁ֥ר לַ/פְּלִשְׁתִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/015.yaml
  text: In the twenty-seventh year of Asa king of Judah[a], Zimri became king for seven days in Tirzah, while the people were camped against Gibbethon, which belonged to the Philistines.
translation:
  language: de
  text: Im siebenundzwanzigsten Regierungsjahr Asas, des Königs von Juda, regierte Simri sieben Tage lang in Tirza, während das Volk gegen Gibbeton[a] lagerte, das den Philistern gehörte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bei Gibbeton“. Im militärischen Zusammenhang bezeichnet „gegen Gibbeton“ wahrscheinlich die feindliche Ausrichtung des Lagers auf die Stadt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת עֶשְׂרִים וָשֶׁבַע שָׁנָה
  choice: Im siebenundzwanzigsten Regierungsjahr
  rationale: Die hebräische Formel bezeichnet die Zählung eines Herrschaftsjahres. „Regierungsjahr“ macht den synchronistischen Sinn im Deutschen klar und natürlich.
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: Asas, des Königs von Juda
  rationale: Der Genitiv gibt die Zuordnung des Regierungsjahres wieder; die Apposition bewahrt Asas Königstitel.
- source_word: מָלַךְ
  choice: regierte
  rationale: Mit der unmittelbar folgenden Zeitangabe bezeichnet das Verb hier die Dauer von Simris Königtum. „Regierte“ ist im Deutschen direkter und natürlicher als „wurde für sieben Tage König“.
- source_word: שִׁבְעַת יָמִים
  choice: sieben Tage lang
  rationale: „Lang“ kennzeichnet die Zeitdauer idiomatisch und eindeutig.
- source_word: בְּתִרְצָה
  choice: in Tirza
  rationale: Schlichte Ortsangabe mit der im Deutschen üblichen Namensform.
- source_word: וְהָעָם חֹנִים
  choice: während das Volk … lagerte
  rationale: Das Partizip beschreibt den gleichzeitig andauernden Hintergrund; „während“ gibt diesen Umstand in natürlichem Deutsch wieder.
- source_word: עַל גִּבְּתוֹן
  choice: gegen Gibbeton
  rationale: עַל kann in diesem militärischen Zusammenhang die feindliche Ausrichtung gegen eine Stadt bezeichnen. Die räumliche Lesart „bei Gibbeton“ bleibt als Fußnote erhalten.
- source_word: אֲשֶׁר לַפְּלִשְׁתִּים
  choice: das den Philistern gehörte
  rationale: Die Konstruktion mit לְ bezeichnet hier Zugehörigkeit, ohne näher festzulegen, wie die Philister die Stadt kontrollierten.
