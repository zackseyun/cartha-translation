  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֤ב בַּעְשָׁא֙ עִם אֲבֹתָ֔י/ו וַ/יִּקָּבֵ֖ר בְּ/תִרְצָ֑ה וַ/יִּמְלֹ֛ךְ אֵלָ֥ה בְנ֖/וֹ תַּחְתָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/006.yaml
  text: Baasha slept with his fathers and was buried in Tirzah[a], and Elah his son reigned in his place.
translation:
  language: de
  text: Bascha legte sich zu seinen Vätern[a] und wurde in Tirza begraben. Sein Sohn Ela wurde an seiner Stelle König.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zu seinen Vorfahren«. Die hebräische Wendung »sich zu seinen Vätern legen« ist eine feste Formel für den Tod eines Königs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: legte sich
  rationale: Bewahrt im Deutschen die bildhafte königliche Todesformel, ohne sie auf das deutende »starb« zu reduzieren; zusammen mit »zu seinen Vätern« ist die Todesbedeutung erkennbar.
- source_word: עִם אֲבֹתָיו
  choice: zu seinen Vätern
  rationale: Die feste deutsche Wendung entspricht der hebräischen Todesformel und bewahrt deren wiederkehrenden, formelhaften Charakter; »Vorfahren« ist als verständlichere Alternative in der Fußnote genannt.
- source_word: וַיִּקָּבֵר
  choice: wurde begraben
  rationale: Gibt die passive Bedeutung des hebräischen Nifal natürlich und genau wieder.
- source_word: בְּתִרְצָה
  choice: in Tirza
  rationale: Die Präposition ב wird bei einer Stadt natürlich mit »in« wiedergegeben; der Ortsname wird in geläufiger deutscher Form transliteriert.
- source_word: וַיִּמְלֹךְ
  choice: wurde König
  rationale: Im Zusammenhang der Thronfolge bezeichnet das Verb hier den Herrschaftsantritt. »Wurde König« ist im modernen Deutsch natürlicher als das isolierte »regierte« und verbindet sich klar mit »an seiner Stelle«.
- source_word: אֵלָה בְנוֹ
  choice: sein Sohn Ela
  rationale: Diese Wortstellung ist im Deutschen idiomatisch und gibt sowohl das Verwandtschaftsverhältnis als auch den Namen eindeutig wieder.
- source_word: תַּחְתָּיו
  choice: an seiner Stelle
  rationale: Drückt die unmittelbare Nachfolge beziehungsweise Ablösung präzise aus und bewahrt die räumliche Metapher des Hebräischen.
