  text: וְ/אַחְאָ֣ב בֶּן עָמְרִ֗י מָלַךְ֙ עַל יִשְׂרָאֵ֔ל בִּ/שְׁנַ֨ת שְׁלֹשִׁ֤ים וּ/שְׁמֹנֶה֙ שָׁנָ֔ה לְ/אָסָ֖א מֶ֣לֶךְ יְהוּדָ֑ה וַ֠/יִּמְלֹךְ אַחְאָ֨ב בֶּן עָמְרִ֤י עַל יִשְׂרָאֵל֙ בְּ/שֹׁ֣מְר֔וֹן עֶשְׂרִ֥ים וּ/שְׁתַּ֖יִם שָׁנָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/029.yaml
  text: And Ahab son of Omri became king over Israel in the thirty-eighth year of Asa king of Judah, and Ahab son of Omri reigned over Israel in Samaria twenty-two years.
translation:
  language: de
  text: Ahab, der Sohn Omris, wurde im achtunddreißigsten Regierungsjahr Asas, des Königs von Juda, König über Israel. Ahab, der Sohn Omris, regierte in Samaria zweiundzwanzig Jahre über Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָלַךְ
  choice: wurde … König
  rationale: In der Thronbesteigungsformel bezeichnet das Qatal hier den Beginn des Königtums; die Wiedergabe unterscheidet diesen Zeitpunkt von der anschließenden Angabe der Regierungsdauer.
- source_word: בִּשְׁנַת שְׁלֹשִׁים וּשְׁמֹנֶה שָׁנָה
  choice: im achtunddreißigsten Regierungsjahr
  rationale: Die Ordnungszahl gibt die zeitliche Einordnung innerhalb der Herrschaft Asas an. „Regierungsjahr“ macht den im Deutschen sonst möglicherweise undeutlichen Bezug klar.
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: Asas, des Königs von Juda
  rationale: Der Genitiv gibt Asa als Bezugspunkt der Datierung an und bewahrt zugleich seinen Königstitel.
- source_word: וַיִּמְלֹךְ
  choice: regierte
  rationale: Das Verb leitet hier die Angabe der gesamten Regierungsdauer ein und bezeichnet daher die Ausübung der Herrschaft.
- source_word: בְּשֹׁמְרוֹן
  choice: sein Regierungssitz war Samaria
  rationale: Wörtlich steht „in Samaria“. Im Zusammenhang der Königsformel bezeichnet die Ortsangabe den Sitz, von dem aus Ahab über Israel regierte; die idiomatische Formulierung verhindert, dass „über Israel in Samaria“ fälschlich räumlich auf Israel bezogen wird.
- source_word: עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: zweiundzwanzig Jahre lang
  rationale: Die Formulierung gibt die Dauer seiner Regierung in natürlichem modernem Deutsch wieder.
- source_word: וְ
  choice: nicht eigens wiedergegeben
  rationale: Das einleitende Waw verbindet den Satz mit der vorausgehenden Königsfolge. Im modernen deutschen Fließtext ist ein eröffnendes „Und“ an dieser Stelle entbehrlich; der narrative Anschluss bleibt durch die Abfolge gewahrt.
