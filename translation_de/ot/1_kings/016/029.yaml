translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zweite Aussage wurde zur Vermeidung einer syntaktischen Fehlzuordnung mit einem Semikolon gegliedert und die Ortsangabe idiomatisch als Regierungssitz ausgedrückt. Keine Fußnoten erforderlich.
