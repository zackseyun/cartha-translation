  text: וַ/יְהִ֨י בְ/מָלְכ֜/וֹ כְּ/שִׁבְתּ֣/וֹ עַל כִּסְא֗/וֹ הִכָּה֙ אֶת כָּל בֵּ֣ית בַּעְשָׁ֔א לֹֽא הִשְׁאִ֥יר ל֖/וֹ מַשְׁתִּ֣ין בְּ/קִ֑יר וְ/גֹאֲלָ֖י/ו וְ/רֵעֵֽ/הוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/011.yaml
  text: And it happened that when he became king[a], as soon as he sat on his throne, he struck down all the house of Baasha. He did not leave him a single male[b], or any of his kinsmen or his friends.
translation:
  language: de
  text: Als er König wurde und sich auf seinen Thron setzte, erschlug er das ganze Haus Baschas. Er ließ ihm keinen einzigen Mann[a] übrig, weder einen seiner Verwandten[b] noch einen seiner Freunde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „einen, der an die Wand uriniert“; eine derbe hebräische Redewendung für eine männliche Person.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Rächer“ oder „Löser“. Das hebräische Wort bezeichnet einen nahen Verwandten mit besonderen Familienpflichten, etwa Rückkauf oder Blutrache.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְמָלְכוֹ
  choice: Als er König geworden war
  rationale: Die Verbindung aus וַיְהִי und der mit בְ eingeleiteten Infinitivkonstruktion setzt den zeitlichen Rahmen. Im Zusammenhang ist Simris Regierungsantritt gemeint; die deutsche Formulierung gibt dies natürlich wieder, ohne ein zusätzliches selbstständiges „es geschah“ zu erzwingen.
- source_word: כְשִׁבְתּוֹ עַל כִּסְאוֹ
  choice: und auf seinem Thron saß
  rationale: Die כְ-Konstruktion bezeichnet hier den Zeitpunkt seines Thronantritts. Das unmittelbare Handeln ergibt sich aus dem Zusammenhang; ein ausdrückliches „sobald“ wäre möglich, ist aber stärker als die bloße Konstruktion zwingend verlangt.
- source_word: הִכָּה
  choice: erschlug
  rationale: נכה bezeichnet hier angesichts der vollständigen Beseitigung des Hauses Baschas eindeutig tödliche Gewalt. „Erschlug“ ist präzise und in erzählender Standardsprache angemessen.
- source_word: כָּל בֵּית בַּעְשָׁא
  choice: das ganze Haus Baschas
  rationale: „Haus“ bezeichnet die Familie beziehungsweise Dynastie und bewahrt die für die Königebücher wichtige dynastische Ausdrucksweise.
- source_word: לֹא הִשְׁאִיר לוֹ
  choice: Er ließ von ihm … nicht übrig
  rationale: Die Formulierung drückt aus, dass aus Baschas Linie beziehungsweise Umfeld niemand der genannten Gruppen am Leben blieb; das Pronomen לוֹ wird durch „von ihm“ abgebildet.
- source_word: מַשְׁתִּין בְּקִיר
  choice: keinen einzigen Mann
  rationale: Die grobe wörtliche Wendung „einer, der an die Wand uriniert“ ist ein Idiom für eine männliche Person. Der Haupttext gibt die Bedeutung klar wieder; die Bildhaftigkeit bleibt in einer Fußnote erhalten.
- source_word: גֹאֲלָיו
  choice: seiner Löser
  rationale: גֹּאֵל bezeichnet einen nahen Verwandten mit rechtlich-familiären Pflichten, etwa Rückkauf oder Blutrache. „Löser“ erhält den besonderen Rollenbegriff und seine Mehrdeutigkeit besser als das allgemeinere „Verwandte“.
- source_word: רֵעֵהוּ
  choice: seiner Freunde
  rationale: רֵעַ kann Freund, Gefährte oder Vertrauter bezeichnen. „Freunde“ ist hier die direkte und natürliche Wiedergabe, ohne politische Bündnispartner ausdrücklich vorauszusetzen.
theological_decisions:
- issue: Bedeutungsumfang von גֹאֵל
  choice: „Löser“ im Haupttext mit erläuternder Fußnote
  alternative: „Verwandte“, „Rächer“ oder „Bluträcher“
  rationale: Der hebräische Begriff verbindet Verwandtschaft mit mehreren möglichen Familienpflichten. Eine Festlegung allein auf Blutrache oder Rückkauf würde die im Text vorhandene Bedeutungsbreite unnötig verengen.
translation_notes:
  register: Moderne, würdige deutsche Erzählsprache. Die dynastische Wendung „Haus Baschas“ bleibt erhalten. Das derbe Idiom wird im Haupttext verständlich wiedergegeben und in der Fußnote offengelegt; der rechtlich-familiäre Begriff גֹאֵל bleibt bewusst mehrdeutig.
