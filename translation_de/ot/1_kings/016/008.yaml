  text: בִּ/שְׁנַ֨ת עֶשְׂרִ֤ים וָ/שֵׁשׁ֙ שָׁנָ֔ה לְ/אָסָ֖א מֶ֣לֶךְ יְהוּדָ֑ה מָ֠לַךְ אֵלָ֨ה בֶן בַּעְשָׁ֧א עַל יִשְׂרָאֵ֛ל בְּ/תִרְצָ֖ה שְׁנָתָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/008.yaml
  text: In the twenty-sixth year of Asa king of Judah, Elah son of Baasha became king over Israel in Tirzah for two years.
translation:
  language: de
  text: Im sechsundzwanzigsten Regierungsjahr Asas, des Königs von Juda, wurde Ela, der Sohn Baschas, König über Israel. Er regierte zwei Jahre lang in Tirza.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת עֶשְׂרִים וָשֵׁשׁ שָׁנָה
  choice: Im sechsundzwanzigsten Regierungsjahr
  rationale: Die hebräische Datierungsformel bezeichnet das sechsundzwanzigste Jahr der Herrschaft Asas. „Regierungsjahr“ macht diesen chronologischen Bezug im Deutschen klar und idiomatisch.
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: Asas, des Königs von Juda
  rationale: Die Präposition לְ ordnet das Jahr Asas Herrschaft zu. Die Apposition im Genitiv ist natürliches, würdevolles Deutsch.
- source_word: מָלַךְ
  choice: wurde … König / regierte
  rationale: Das einmalige Verb trägt in der Thronbesteigungsnotiz sowohl die Aussage des Regierungsantritts als auch, zusammen mit der Zeitangabe, die Regierungsdauer. Im Deutschen werden beide Aspekte zur Klarheit auf zwei Sätze verteilt.
- source_word: אֵלָה
  choice: Ela
  rationale: Der Personenname wird nach geläufiger deutscher biblischer Namensform transliteriert.
- source_word: בֶן בַּעְשָׁא
  choice: der Sohn Baschas
  rationale: Die hebräische Abstammungsangabe wird in natürlichem Deutsch mit bestimmtem Artikel und Genitiv wiedergegeben.
- source_word: עַל יִשְׂרָאֵל
  choice: über Israel
  rationale: עַל bezeichnet beim Verb „König sein/regieren“ den Herrschaftsbereich; „über Israel“ bildet dies direkt ab.
- source_word: בְּתִרְצָה
  choice: in Tirza
  rationale: בְּ bezeichnet hier den Ort, von dem aus Ela regierte.
- source_word: שְׁנָתָיִם
  choice: zwei Jahre lang
  rationale: Die Dualform bedeutet „zwei Jahre“; „lang“ kennzeichnet im Deutschen idiomatisch die Regierungsdauer.
theological_decisions: []
translation_notes:
  register: Modernes, klares und würdevolles Standarddeutsch. Die Aufteilung in zwei Sätze verhindert, dass „in Tirza zwei Jahre lang“ fälschlich nur auf den Regierungsantritt bezogen wird, und bewahrt zugleich den knappen Charakter der Königsnotiz.
