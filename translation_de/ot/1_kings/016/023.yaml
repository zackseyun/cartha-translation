base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/023.yaml
  text: In the thirty-first year of Asa king of Judah[a], Omri became king over Israel for twelve years; he reigned in Tirzah six years.
translation:
  language: de
  text: Im einunddreißigsten Regierungsjahr Asas, des Königs von Juda, wurde Omri König über Israel. Er regierte zwölf Jahre, davon sechs Jahre in Tirza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Omri regierte zwölf Jahre über Israel; in Tirza regierte er sechs Jahre.“ Der Vers unterscheidet seine gesamte Regierungszeit von den sechs Jahren, in denen er in Tirza regierte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת שְׁלֹשִׁים וְאַחַת שָׁנָה
  choice: Im einunddreißigsten Regierungsjahr
  rationale: Die hebräische Datierungsformel bezeichnet das 31. Jahr einer Königsherrschaft. „Regierungsjahr“ macht den Bezug im Deutschen idiomatisch und eindeutig.
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: Asas, des Königs von Juda
  rationale: ל kennzeichnet hier den Bezug auf Asas Regierungszeit; der deutsche Genitiv gibt diese Beziehung natürlich wieder.
- source_word: מָלַךְ
  choice: wurde ... König
  rationale: Das erste Vorkommen bezeichnet im Kontext Omris Regierungsantritt und wird deshalb ingressiv wiedergegeben.
- source_word: עַל יִשְׂרָאֵל
  choice: über Israel
  rationale: Mit מלך bezeichnet עַל den Herrschaftsbereich.
- source_word: שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: Er regierte zwölf Jahre
  rationale: Die Wendung nennt die Gesamtdauer von Omris Herrschaft; ein eigener deutscher Satz sorgt für Klarheit.
- source_word: בְּתִרְצָה מָלַךְ שֵׁשׁ שָׁנִים
  choice: davon sechs Jahre in Tirza
  rationale: Die knappe Formulierung verdeutlicht natürlich, dass sechs der insgesamt zwölf Regierungsjahre mit Tirza verbunden waren, ohne zusätzliche historische Angaben einzutragen.
