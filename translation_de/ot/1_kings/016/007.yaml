base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/007.yaml
  text: And also through Jehu son of Hanani the prophet[a], the word of Yahweh came against Baasha and against his house, both because of all the evil that he did in the sight of Yahweh, provoking him to anger by the work of his hands, by becoming like the house of Jeroboam, and because he struck him down.
translation:
  language: de
  text: Und auch durch den Propheten Jehu, den Sohn Hananis, erging das Wort Jahwes gegen Bascha und gegen sein Haus, sowohl wegen all des Bösen, das er in den Augen Jahwes getan hatte, indem er ihn durch das Werk seiner Hände zum Zorn reizte, indem er dem Haus Jerobeams gleich wurde, als auch weil er es vernichtet hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und weil er ihn erschlagen hatte«. Das hebräische Pronomen steht im maskulinen Singular und kann sich auf Jerobeam persönlich oder – im Zusammenhang wahrscheinlicher – kollektiv auf sein Haus, also seine Dynastie, beziehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: Und auch
  rationale: Bewahrt den fortführenden und ergänzenden Anschluss an den vorherigen Gerichtszusammenhang.
- source_word: בְּיַד יֵהוּא בֶן חֲנָנִי הַנָּבִיא
  choice: durch den Propheten Jehu, den Sohn Hananis
  rationale: Das hebräische Idiom »durch die Hand« bezeichnet hier prophetische Vermittlung; »durch« ist im Deutschen natürlich und präzise.
- source_word: דְּבַר יְהוָה
  choice: das Wort Jahwes
  rationale: Bewahrt die feste prophetische Formel und gibt den Gottesnamen als Jahwe wieder.
- source_word: אֶל בַּעְשָׁא וְאֶל בֵּיתוֹ
  choice: gegen Bascha und gegen sein Haus
  rationale: Im Gerichtskontext hat אֶל adversative Bedeutung. »Haus« lässt sowohl Haushalt als auch Dynastie anklingen.
- source_word: וְעַל כָּל הָרָעָה
  choice: wegen all des Bösen
  rationale: עַל nennt hier den Grund für das angekündigte Gericht.
- source_word: בְּעֵינֵי יְהוָה
  choice: in den Augen Jahwes
  rationale: Die geläufige hebräische Bewertungsformel wird bildhaft und verständlich bewahrt.
- source_word: לְהַכְעִיסוֹ
  choice: indem er ihn … zum Zorn reizte
  rationale: Gibt die kausative Bedeutung wieder; das Pronomen bezieht sich im Kontext auf Jahwe.
- source_word: בְּמַעֲשֵׂה יָדָיו
  choice: durch das Werk seiner Hände
  rationale: Bewahrt das konkrete, möglicherweise auch auf Götzenwerk anspielende Bild, ohne es auf eine einzige Deutung festzulegen.
- source_word: לִהְיוֹת כְּבֵית יָרָבְעָם
  choice: dem Haus Jerobeams gleich wurde
  rationale: Drückt das Ergebnis beziehungsweise die Art seines Handelns idiomatisch aus und wahrt den dynastischen Bezug.
- source_word: וְעַל אֲשֶׁר הִכָּה אֹתוֹ
  choice: und weil er es vernichtet hatte
  rationale: Das deutsche »es« bezieht sich auf das Haus Jerobeams als Dynastie; die echte Mehrdeutigkeit des hebräischen maskulinen Singularsuffixes wird in der Fußnote offengelegt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als solcher wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug von אֹתוֹ im letzten Satzglied
  choice: das Haus Jerobeams als Dynastie
  alternative: Jerobeam persönlich
  rationale: Der nähere Kontext handelt von der Vernichtung des Hauses Jerobeams; grammatisch bleibt jedoch auch ein persönlicher Bezug möglich und wird daher nicht verschwiegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Prophetische Formel und zentrale hebräische Bilder bleiben erhalten; schwer verständliche Idiomatik wird maßvoll geglättet. Der Doppelpunkt macht die nachfolgenden Gerichtsgründe transparent.
