  text: וַ/יַּעֲלֶ֥ה עָמְרִ֛י וְ/כָל יִשְׂרָאֵ֥ל עִמּ֖/וֹ מִֽ/גִּבְּת֑וֹן וַ/יָּצֻ֖רוּ עַל תִּרְצָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/017.yaml
  text: Then Omri and all Israel with him went up from Gibbethon[a], and they laid siege to Tirzah.
translation:
  language: de
  text: Da zog Omri mit ganz Israel von Gibbeton hinauf, und sie belagerten Tirza.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲלֶה
  choice: zog … hinauf
  rationale: Gibt die Grundbedeutung von עלה und den erzählenden Bewegungscharakter wieder, ohne einen ausdrücklich militärischen Marsch in das Verb hineinzulesen.
- source_word: עָמְרִי
  choice: Omri
  rationale: Im Deutschen gebräuchliche Form des Personennamens.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: mit ganz Israel
  rationale: Bewahrt die kollektive Bezeichnung „Israel“; die deutsche Wortstellung verbindet עִמּוֹ natürlich mit Omri, ohne „Israel“ ausdrücklich als Heer oder Bevölkerung zu deuten.
- source_word: מִגִּבְּתוֹן
  choice: von Gibbeton
  rationale: Gängige deutsche Wiedergabe des Ortsnamens mit der eindeutig separativen Präposition מן.
- source_word: וַיָּצֻרוּ
  choice: sie belagerten
  rationale: Gibt צור in seinem militärischen Sinn knapp und idiomatisch wieder.
- source_word: עַל
  choice: —
  rationale: Die vom Hebräischen mit עַל markierte Zielrichtung ist im Deutschen bereits in der transitiven Konstruktion „Tirza belagern“ enthalten und benötigt keine eigene Präposition.
- source_word: תִּרְצָה
  choice: Tirza
  rationale: Im Deutschen gebräuchliche Form des Ortsnamens.
