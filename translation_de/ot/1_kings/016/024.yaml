  text: וַ/יִּ֜קֶן אֶת הָ/הָ֥ר שֹׁמְר֛וֹן מֵ֥/אֶת שֶׁ֖מֶר בְּ/כִכְּרַ֣יִם כָּ֑סֶף וַ/יִּ֨בֶן֙ אֶת הָ/הָ֔ר וַ/יִּקְרָ֗א אֶת שֵׁ֤ם הָ/עִיר֙ אֲשֶׁ֣ר בָּנָ֔ה עַ֣ל שֶׁם שֶׁ֔מֶר אֲדֹנֵ֖י הָ/הָ֥ר שֹׁמְרֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/024.yaml
  text: He bought the hill of Samaria from Shemer for two talents of silver[a], built on the hill, and called the name of the city that he built Samaria, after the name of Shemer[b], the owner of the hill.
translation:
  language: de
  text: Er kaufte den Berg Samaria von Schemer für zwei Talente Silber[a], bebaute den Berg und nannte die Stadt, die er gebaut hatte, Samaria – nach Schemer, dem Besitzer des Berges.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Talent war eine große Gewichtseinheit; gemeint sind zwei Talente Silber.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקֶן
  choice: Er kaufte
  rationale: קנה bezeichnet hier den entgeltlichen Erwerb des Grundstücks; „kaufte“ ist im modernen Deutsch natürlich und präzise.
- source_word: הָהָר
  choice: den Hügel
  rationale: הַר kann Berg oder Hügel bedeuten. Für die Anhöhe als Stadtgelände ist „Hügel“ im Deutschen sachgerecht und idiomatisch.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: „Samaria“ ist die gebräuchliche deutsche Form des Ortsnamens; im ersten Vorkommen bezeichnet er den Hügel, später die darauf errichtete Stadt.
- source_word: מֵאֵת שֶׁמֶר
  choice: von Schemer
  rationale: Die Präposition kennzeichnet Schemer als den Verkäufer beziehungsweise bisherigen Eigentümer.
- source_word: בְּכִכְּרַיִם כָּסֶף
  choice: für zwei Talente Silber
  rationale: כִּכָּר bezeichnet hier eine gewichtsmäßig bestimmte große Silbermenge; die Dualform bedeutet „zwei Talente“.
- source_word: וַיִּבֶן אֶת הָהָר
  choice: bebaute den Hügel
  rationale: Wörtlich steht „baute den Hügel“. „Bebaute den Hügel“ gibt im Deutschen knapp wieder, dass dort gebaut wurde, ohne eine Befestigung oder andere nicht ausdrücklich genannte Bauart einzutragen.
- source_word: וַיִּקְרָא אֶת שֵׁם הָעִיר
  choice: und nannte die Stadt
  rationale: Die wörtliche hebräische Wendung „rief den Namen der Stadt“ wird durch das natürliche deutsche Verb „nannte“ treffend wiedergegeben.
- source_word: אֲשֶׁר בָּנָה
  choice: die er gebaut hatte
  rationale: Das Plusquamperfekt verdeutlicht im Deutschen, dass die Benennung auf den zuvor berichteten Bau folgt.
- source_word: עַל שֵׁם שֶׁמֶר
  choice: nach Schemer
  rationale: Die Wendung bezeichnet die Benennung in Bezug auf Schemers Namen; „nach Schemer“ ist die natürliche deutsche Entsprechung.
- source_word: אֲדֹנֵי הָהָר
  choice: dem Besitzer des Hügels
  rationale: אָדוֹן bezeichnet hier den Eigentümer des Grundstücks, nicht einen Herrschertitel oder eine göttliche Anrede.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Erzählfolge bleibt erhalten, während unnatürliche Formulierungen wie „baute den Hügel“ und „rief den Namen der Stadt“ idiomatisch wiedergegeben werden. Die Namensbeziehung zwischen Schemer und Samaria wird klar, aber ohne zusätzliche etymologische Erklärung ausgedrückt.
