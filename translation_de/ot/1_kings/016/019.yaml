  text: עַל חטאת/ו אֲשֶׁ֣ר חָטָ֔א לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לָ/לֶ֨כֶת֙ בְּ/דֶ֣רֶךְ יָרָבְעָ֔ם וּ/בְ/חַטָּאת/וֹ֙ אֲשֶׁ֣ר עָשָׂ֔ה לְ/הַחֲטִ֖יא אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/019.yaml
  text: because of his sins that he committed[a], doing what was evil in the eyes of Yahweh, walking in the way of Jeroboam and in the sin that he caused Israel to commit.
translation:
  language: de
  text: wegen seiner Sünde, die er beging, indem er tat, was in den Augen Jahwes böse war, auf dem Weg Jerobeams ging und die Sünde beging, durch die er Israel zum Sündigen brachte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „und in seiner Sünde, die er tat, um Israel sündigen zu lassen“.'
    reason: Die hebräische Wendung nennt ausdrücklich seine Sünde und verbindet sie mit einem kausativen Infinitiv. Die Hauptübersetzung gibt diesen Zusammenhang im Deutschen flüssig wieder.
lexical_decisions:
- source_word: עַל חטאתו אֲשֶׁר חָטָא
  choice: wegen seiner Sünde, die er begangen hatte
  rationale: עַל bezeichnet hier den Grund für das zuvor berichtete Gericht. Der Singular חטאתו bleibt erhalten; die hebräische Verbindung mit dem verwandten Verb חָטָא wird im Deutschen idiomatisch mit „Sünde … begangen“ wiedergegeben.
- source_word: לַעֲשׂוֹת הָרַע בְּעֵינֵי יְהוָה
  choice: indem er tat, was in den Augen Jahwes böse war
  rationale: Der Infinitiv erläutert den Inhalt seiner Sünde. Die feste hebräische Bewertungsformel und ihr Bild werden verständlich und eng am Wortlaut wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name transliteriert und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: לָלֶכֶת בְּדֶרֶךְ יָרָבְעָם
  choice: auf dem Weg Jerobeams ging
  rationale: Die Weg-Metapher für Lebensführung und Verhalten bleibt erhalten und klingt im Deutschen natürlich.
- source_word: וּבְחַטָּאתוֹ אֲשֶׁר עָשָׂה לְהַחֲטִיא אֶת יִשְׂרָאֵל
  choice: und die Sünde beging, durch die er Israel zum Sündigen verführte
  rationale: Die Formulierung bewahrt sowohl das ausdrückliche Tun der Sünde als auch die kausative Bedeutung des Hifil לְהַחֲטִיא. „Verführte“ gibt hier das Veranlassen zum Sündigen natürlich wieder, ohne Israels eigene Beteiligung auszublenden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Tetragrammaton unmittelbar. Die Transliteration wahrt den persönlichen Gottesnamen, während „der HERR“ ihn durch einen Titel ersetzt.
- issue: Verantwortung für Israels Sünde im kausativen Verb לְהַחֲטִיא
  choice: Israel zum Sündigen verführte
  alternative: Israel sündigen ließ
  rationale: Die Übersetzung hält fest, dass der König Israel zur Sünde brachte, ohne die Aussage so zu formulieren, als wäre Israel dabei ohne eigene Verantwortung gewesen.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Vers ist im Hebräischen syntaktisch an die vorausgehende Todes- und Gerichtsaussage angeschlossen; deshalb bleibt die Übersetzung als begründende Satzfortsetzung formuliert. Die traditionellen Bilder „in den Augen“ und „auf dem Weg“ werden bewahrt.
