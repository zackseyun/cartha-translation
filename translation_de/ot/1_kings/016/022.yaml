  text: וַ/יֶּחֱזַ֤ק הָ/עָם֙ אֲשֶׁ֣ר אַחֲרֵ֣י עָמְרִ֔י אֶת הָ/עָ֕ם אֲשֶׁ֥ר אַחֲרֵ֖י תִּבְנִ֣י בֶן גִּינַ֑ת וַ/יָּ֣מָת תִּבְנִ֔י וַ/יִּמְלֹ֖ךְ עָמְרִֽי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/022.yaml
  text: But the people who followed Omri prevailed over the people who followed Tibni son of Ginath. So Tibni died[a], and Omri became king.
translation:
  language: de
  text: Doch die Leute, die zu Omri hielten, gewannen die Oberhand über die Leute, die zu Tibni, dem Sohn Ginats, hielten. Tibni starb, und Omri wurde König.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּחֱזַק
  choice: gewannen die Oberhand über
  rationale: חזק mit אֶת bezeichnet hier im Zusammenhang des innerisraelitischen Machtkampfs die Überlegenheit einer Partei über die andere. Die deutsche Wendung ist idiomatisch und bewahrt den politischen Sinn.
- source_word: הָעָם אֲשֶׁר אַחֲרֵי עָמְרִי
  choice: die Leute, die zu Omri hielten
  rationale: אַחֲרֵי bedeutet hier nicht bloß räumlich »hinter«, sondern bezeichnet die Anhängerschaft beziehungsweise Unterstützung Omris.
- source_word: אֶת הָעָם אֲשֶׁר אַחֲרֵי תִּבְנִי
  choice: über die Leute, die zu Tibni … hielten
  rationale: Die parallele Formulierung gibt die rivalisierende Anhängerschaft wieder; »über« gehört zur idiomatischen Wendung »die Oberhand gewinnen über«.
- source_word: תִּבְנִי בֶן גִּינַת
  choice: Tibni, dem Sohn Ginats
  rationale: Die Namen werden deutsch transliteriert; בֶן wird als genealogische Bezeichnung mit »Sohn« wiedergegeben.
- source_word: וַיָּמָת תִּבְנִי
  choice: Daraufhin starb Tibni
  rationale: Das narrative וַ führt die Handlung weiter. »Daraufhin« wahrt die zeitlich-folgernde Verbindung, ohne ausdrücklich zu behaupten, Tibnis Tod sei unmittelbar verursacht worden.
- source_word: וַיִּמְלֹךְ עָמְרִי
  choice: Omri wurde König
  rationale: מלך bezeichnet hier nach dem Tod des Rivalen Omris Erlangung des ungeteilten Königtums; »wurde König« gibt diesen Amtsantritt natürlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Zu jemandem halten« bezeichnet verständlich politische Loyalität; »die Oberhand gewinnen« vermittelt den Machtgewinn, ohne eine konkrete militärische Todesursache zu ergänzen.
