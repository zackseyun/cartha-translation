  text: וַ/יִּשְׁמַ֤ע הָ/עָם֙ הַ/חֹנִ֣ים לֵ/אמֹ֔ר קָשַׁ֣ר זִמְרִ֔י וְ/גַ֖ם הִכָּ֣ה אֶת הַ/מֶּ֑לֶךְ וַ/יַּמְלִ֣כוּ כָֽל יִ֠שְׂרָאֵל אֶת עָמְרִ֨י שַׂר צָבָ֧א עַל יִשְׂרָאֵ֛ל בַּ/יּ֥וֹם הַ/ה֖וּא בַּֽ/מַּחֲנֶֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/016.yaml
  text: And the people who were camped there heard it said, “Zimri has conspired and has also struck down the king.” So all Israel made Omri, the commander of the army over Israel, king that day in the camp.
translation:
  language: de
  text: 'Als das Volk im Lager hörte, wie man sagte: »Simri hat sich verschworen und auch den König erschlagen«, machte ganz Israel Omri, den Heerführer Israels, an jenem Tag im Lager zum König.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעָם הַחֹנִים
  choice: das Volk im Lager
  rationale: Gibt die substantivierte Partizipialform ‚das lagernde/gelagerte Volk‘ natürlich und im unmittelbaren militärischen Zusammenhang wieder.
- source_word: קָשַׁר
  choice: hat sich verschworen
  rationale: Bezeichnet hier die Bildung beziehungsweise Durchführung einer Verschwörung gegen den König.
- source_word: הִכָּה אֶת־הַמֶּלֶךְ
  choice: den König erschlagen
  rationale: Im Kontext ist nicht bloßes Schlagen, sondern die Tötung Elas gemeint; ‚erschlagen‘ wahrt den gewaltsamen Sinn.
- source_word: שַׂר צָבָא עַל־יִשְׂרָאֵל
  choice: den Heerführer Israels
  rationale: Natürliche deutsche Wiedergabe für den militärischen Oberbefehlshaber über Israel.
- source_word: וַיַּמְלִכוּ ... אֶת־עָמְרִי
  choice: machte ... Omri ... zum König
  rationale: Der Hifil drückt aus, dass das Volk Omri als König einsetzte.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Abfolge von Nachricht und unmittelbarer Königserhebung bleibt klar; ‚ganz Israel‘ wird als Bezeichnung der versammelten israelitischen Streitmacht beziehungsweise Gemeinschaft nicht erklärend verengt.
