  source_fidelity: 'Die Kernaussage wird zutreffend wiedergegeben: Das im Lager befindliche Volk erfährt von Simris Verschwörung und der Tötung des Königs und erhebt Omri zum König. „Erschlagen“ ist im erzählerischen Kontext eine angemessene Wiedergabe von הִכָּה. Die Zusätze „noch“ und „sogar“ sind jedoch gegenüber „an jenem Tag“ bzw. „auch“ leicht verstärkend.'
