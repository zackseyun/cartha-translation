source:
  edition: WLC
  text: וַ/יָּ֥קֶם מִזְבֵּ֖חַ לַ/בָּ֑עַל בֵּ֣ית הַ/בַּ֔עַל אֲשֶׁ֥ר בָּנָ֖ה בְּ/שֹׁמְרֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/032.yaml
  text: He set up an altar for Baal in the house of Baal[a], which he had built in Samaria.
translation:
  language: de
  text: Er stellte im Haus des Baal[a], das er in Samaria gebaut hatte, einen Altar für Baal auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Tempel des Baal“. Wörtlich: „Haus des Baal“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: stellte … auf
  rationale: Das Hifil von קום bezeichnet hier das Aufstellen oder Errichten des Altars. „stellte … auf“ ist im modernen Deutschen natürlich und bildet die konkrete Handlung treffend ab.
- source_word: מִזְבֵּחַ
  choice: einen Altar
  rationale: „Altar“ ist die übliche und kontextuell eindeutige Wiedergabe von מִזְבֵּחַ.
- source_word: לַבָּעַל
  choice: für Baal
  rationale: Die Präposition ל kennzeichnet hier die Widmung des Altars. „für Baal“ ist dafür im Deutschen idiomatisch.
- source_word: בֵּית הַבַּעַל
  choice: im Haus des Baal
  rationale: Die Wiedergabe bewahrt die wörtliche Bildsprache des Hebräischen („Haus des Baal“); gemeint ist ein kultisches Gebäude beziehungsweise ein Tempel.
- source_word: אֲשֶׁר בָּנָה
  choice: das er … gebaut hatte
  rationale: Das Relativpronomen bezieht sich grammatisch auf „Haus“. Das Plusquamperfekt verdeutlicht natürlich, dass dessen Bau dem Aufstellen des Altars vorausging.
- source_word: בְּשֹׁמְרוֹן
  choice: in Samaria
  rationale: Standardwiedergabe des Ortsnamens שֹׁמְרוֹן; ב bezeichnet hier den Ort.
theological_decisions:
- issue: Wiedergabe von בֵּית הַבַּעַל
  choice: Haus des Baal
  alternative: Tempel des Baal
  rationale: „Haus des Baal“ hält die hebräische Ausdrucksweise sichtbar, ohne die kultische Bedeutung festzulegen; die geläufigere Bedeutungsangabe „Tempel“ wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzglieder wurden gegenüber der hebräischen Reihenfolge so angeordnet, dass die Satzklammer „stellte … auf“ gut lesbar bleibt und der Bezug des Relativsatzes auf das Haus eindeutig ist.
