- from: Als Simri sah, dass die Stadt eingenommen worden war, ging er in die Festung des Königshauses[a], steckte das Königshaus über sich in Brand[b] und starb.
  to: Als Simri sah, dass die Stadt eingenommen worden war, ging er in die Zitadelle des Königspalasts[a], steckte den Königspalast über sich selbst in Brand[b] und starb.
  rationale: Die Revision ersetzt die missverständliche Verbindung „Festung des Königshauses“ durch eine im modernen Deutschen klarere Bezeichnung für einen befestigten königlichen Bereich. Zugleich wird die Wiederholung des königlichen Gebäudes beibehalten, die räumlich auffällige Wendung עָלָיו weiterhin sichtbar gemacht und die Fußnote näher am hebräischen Wortlaut formuliert.
