  terminology: „Simri“ entspricht der im Deutschen üblichen Namensform. „Königspalast“ bezeichnet hier eindeutig ein Gebäude und vermeidet die im gegenwärtigen Sprachgebrauch naheliegende dynastische Bedeutung von „Königshaus“. Die Fußnote wahrt die Bedeutungsbreite von אַרְמוֹן.
