  source_fidelity: 'Der Entwurf gibt Erzählfolge, Einnahme der Stadt, den Gang in den königlichen befestigten Bereich, das Verbrennen des königlichen Gebäudes „über sich“ und Simris Tod zutreffend wieder. „Festung des Königshauses“ ist jedoch im heutigen Deutsch semantisch und syntaktisch weniger passend: Eine Festung ist nicht ohne Weiteres ein Teil eines Königshauses. „Zitadelle des Königspalasts“ gibt die mögliche Bedeutung von אַרְמוֹן als befestigten inneren königlichen Bau klarer wieder, ohne die lexikalische Ambiguität aufzulösen.'
