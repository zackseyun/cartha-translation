  text: וַ/יְהִ֞י כִּ/רְא֤וֹת זִמְרִי֙ כִּֽי נִלְכְּדָ֣ה הָ/עִ֔יר וַ/יָּבֹ֖א אֶל אַרְמ֣וֹן בֵּית הַ/מֶּ֑לֶךְ וַ/יִּשְׂרֹ֨ף עָלָ֧י/ו אֶת בֵּֽית מֶ֛לֶךְ בָּ/אֵ֖שׁ וַ/יָּמֹֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/018.yaml
  text: And when Zimri saw that the city had been captured[a], he went into the citadel of the king’s house and burned the king’s house over himself with fire[b], and died.
translation:
  language: de
  text: Als Simri sah, dass die Stadt eingenommen worden war, ging er in die Zitadelle des Königspalasts[a], steckte den Königspalast über sich selbst in Brand[b] und starb.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in den befestigten Palast des Königs“. Das hebräische Wort kann eine Zitadelle, einen Palast oder eine befestigte königliche Anlage bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Er verbrannte das Königshaus über sich mit Feuer.“ Die Formulierung beschreibt, dass Simri den königlichen Bau über sich anzündete.'
    reason: cultural_note
lexical_decisions:
- source_word: כִּ/רְאוֹת
  choice: Als ... sah
  rationale: Die Verbindung von כ mit dem Infinitiv constructus bezeichnet hier den Zeitpunkt; „Als ... sah“ ist natürlich und wahrt den Erzählablauf.
- source_word: נִלְכְּדָה
  choice: eingenommen worden war
  rationale: Der Nifal von לכד bezeichnet das Eingenommen- oder Ergriffenwerden; das Plusquamperfekt verdeutlicht, dass die Einnahme vor Simris Reaktion lag.
- source_word: הָ/עִיר
  choice: die Stadt
  rationale: Direkte und eindeutige Wiedergabe von עִיר.
- source_word: אַרְמוֹן בֵּית הַ/מֶּלֶךְ
  choice: die Festung des Königshauses
  rationale: אַרְמוֹן kann einen befestigten Palastbau oder eine Zitadelle bezeichnen. „Festung“ unterscheidet den inneren befestigten Bereich vom anschließend genannten Königshaus und bewahrt die konstruktive Verbindung.
- source_word: וַ/יִּשְׂרֹף
  choice: steckte ... in Brand
  rationale: Diese natürliche deutsche Wendung gibt das absichtliche Anzünden wieder, ohne den im Hebräischen nicht ausdrücklich genannten vollständigen Einsturz hinzuzufügen.
- source_word: עָלָי/ו
  choice: über sich
  rationale: Die ungewöhnliche räumliche Formulierung des Hebräischen bleibt erhalten und macht deutlich, dass Simri das Gebäude um beziehungsweise über sich anzündete.
- source_word: אֶת בֵּית מֶלֶךְ
  choice: das Königshaus
  rationale: „Königshaus“ gibt das konkrete königliche Gebäude knapp wieder; der Kontext schließt die mögliche dynastische Bedeutung aus.
- source_word: בָּ/אֵשׁ
  choice: in Brand
  rationale: Das instrumentale „mit Feuer“ wird im Deutschen idiomatisch in die Wendung „in Brand stecken“ aufgenommen.
- source_word: וַ/יָּמֹת
  choice: und starb
  rationale: Bewahrt die einfache narrative Fortsetzung, ohne die syntaktische Beziehung ausdrücklich kausal zu deuten.
