id: 1KI.16.12
reference: 1 Kings 16:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּשְׁמֵ֣ד זִמְרִ֔י אֵ֖ת כָּל בֵּ֣ית בַּעְשָׁ֑א כִּ/דְבַ֤ר יְהוָה֙ אֲשֶׁ֣ר דִּבֶּ֣ר אֶל בַּעְשָׁ֔א בְּ/יַ֖ד יֵה֥וּא הַ/נָּבִֽיא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/012.yaml
  text: So Zimri destroyed all the house of Baasha[b][a], according to the word of Yahweh that he had spoken against Baasha through Jehu the prophet.
translation:
  language: de
  text: So vernichtete Simri das ganze Haus Baschas[a], gemäß dem Wort Jahwes, das er durch den Propheten Jehu gegen Bascha[b] geredet hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit dem »Haus Baschas« ist sein Königshaus, also seine Dynastie, gemeint und nicht nur sein persönlicher Haushalt.
    reason: cultural_note
  - marker: b
    text: 'Oder: »zu Bascha«. Die hebräische Präposition bedeutet wörtlich häufig »zu«; hier leitet sie ein gegen ihn gerichtetes Gerichtswort ein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁמֵד
  choice: vernichtete
  rationale: Der Hifil von שׁמד bezeichnet das Herbeiführen vollständiger Zerstörung. »Vernichtete« gibt die Stärke des Verbs klar und in einem würdigen Erzählstil wieder.
- source_word: כָּל בֵּית בַּעְשָׁא
  choice: das ganze Haus Baschas
  rationale: »Haus« bezeichnet im königlichen Zusammenhang das Herrscherhaus beziehungsweise die Dynastie Baschas, nicht nur ein Gebäude oder den engeren Haushalt. »Das ganze« gibt כָּל wieder.
- source_word: כִּדְבַר
  choice: gemäß dem Wort
  rationale: Die Wendung bezeichnet Übereinstimmung mit beziehungsweise Erfüllung eines zuvor ergangenen Ausspruchs. »Gemäß dem Wort« bewahrt diesen Zusammenhang prägnant.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben. »Jahwe« ist die im modernen Deutschen geläufige Form.
- source_word: אֲשֶׁר דִּבֶּר
  choice: das er … geredet hatte
  rationale: Das Plusquamperfekt verdeutlicht natürlich, dass Jahwes Wort der hier berichteten Erfüllung vorausging, ohne dem Ausgangstext zusätzliche Sachinformation hinzuzufügen.
- source_word: אֶל בַּעְשָׁא
  choice: gegen Bascha
  rationale: אֶל bedeutet häufig »zu«, kann hier aber im Zusammenhang eines Gerichtswortes dessen gegen Bascha gerichtete Ausrichtung ausdrücken. Die wörtlichere Möglichkeit wird in einer Fußnote erhalten.
- source_word: בְּיַד יֵהוּא הַנָּבִיא
  choice: durch den Propheten Jehu
  rationale: Die hebräische Wendung »durch die Hand von« bezeichnet Vermittlung oder Beauftragung. »Durch« gibt die Funktion Jehus in natürlichem modernem Deutsch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. Seine Wiedergabe als »Jahwe« bewahrt den Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Richtung des prophetischen Wortes in אֶל בַּעְשָׁא
  choice: gegen Bascha
  alternative: zu Bascha
  rationale: Der Kontext weist das Wort als Gerichtsausspruch über Bascha aus. »Gegen« macht diese kontextuelle Kraft verständlich; die echte lexikalische Alternative »zu« bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der traditionelle dynastische Ausdruck »Haus Baschas« bleibt erhalten und wird erläutert; die Mehrdeutigkeit der Präposition אֶל wird nicht verdeckt, sondern durch eine Fußnote dokumentiert.
