  text: וְ/יֶ֨תֶר דִּבְרֵ֥י בַעְשָׁ֛א וַ/אֲשֶׁ֥ר עָשָׂ֖ה וּ/גְבֽוּרָת֑/וֹ הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/005.yaml
  text: The rest of the acts of Baasha[a], and what he did, and his might—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: de
  text: Was sonst noch über Bascha zu berichten ist, was er tat und seine Macht – ist das nicht im Buch der Chronik der Könige von Israel[a] geschrieben?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »im Buch der Annalen der Könige von Israel«.'
    reason: Das hebräische סֵפֶר דִּבְרֵי הַיָּמִים bezeichnet eine schriftliche annalistische Quelle; »Annalen« ist eine mögliche alternative Wiedergabe.
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי בַעְשָׁא
  choice: Was sonst noch über Bascha zu berichten ist
  rationale: Die annalistische Formel bezeichnet die übrigen berichtenswerten Angelegenheiten beziehungsweise Taten des Königs. Die deutsche Formulierung gibt den idiomatischen Sinn natürlich wieder, ohne ein zeitliches »nun« hinzuzufügen.
- source_word: וַאֲשֶׁר עָשָׂה
  choice: was er tat
  rationale: Die schlichte Relativkonstruktion bewahrt den Wortlaut, ohne ein im Hebräischen nicht ausdrücklich vorhandenes »alles« einzufügen.
- source_word: וּגְבוּרָתוֹ
  choice: welche Macht er entfaltete
  rationale: גְּבוּרָה kann Stärke, Macht oder Machttaten bezeichnen. Im königlichen Rückblick vermittelt die Formulierung sowohl die abstrakte Macht als auch deren sichtbare Ausübung, ohne sie auf militärische Tapferkeit zu verengen.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: steht das nicht
  rationale: Die rhetorische Frage und die wiederkehrende Formel der Königebücher bleiben erhalten; der deutsche Singular bezieht sich natürlich auf den gesamten zuvor genannten Stoff.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: im Buch der Geschichte
  rationale: עַל bezeichnet hier idiomatisch die Aufnahme in eine schriftliche Quelle. דִּבְרֵי הַיָּמִים meint einen fortlaufenden historischen beziehungsweise annalistischen Bericht; »Buch der Geschichte« ist verständlich, während die alternative Fachbezeichnung in der Fußnote erscheint.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: der Könige von Israel
  rationale: Das ל kennzeichnet hier die Zugehörigkeit beziehungsweise den Gegenstandsbereich der Chronik; im Deutschen ist der Genitiv die natürliche Wiedergabe.
