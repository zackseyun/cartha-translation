  source_fidelity: Die Grundstruktur der annalistischen Abschlussformel ist erfasst. »welche Macht er entfaltete« deutet גְּבוּרָתוֹ jedoch stärker als nachweislich ausgeübte Macht und sollte durch das offenere »seine Macht« ersetzt werden. Außerdem sollte die Quelle ausdrücklich als schriftlich »geschrieben« bzw. verzeichnet bezeichnet werden.
  naturalness: Die Fassung ist grundsätzlich verständlich und modern. Die Formulierung »ist das nicht im Buch … geschrieben?« ist zugleich natürlich und näher an der formelhaften rhetorischen Frage als »steht das nicht«.
  terminology: »Buch der Chronik der Könige von Israel« gibt die annalistische Quellengattung präziser wieder als »Buch der Geschichte«. Der Fußnotenanker muss unmittelbar am erläuterten Buchtitel stehen, nicht erst nach dem Satzzeichen.
