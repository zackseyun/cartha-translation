  text: הַ/מֵּ֤ת לְ/בַעְשָׁא֙ בָּ/עִ֔יר יֹֽאכְל֖וּ הַ/כְּלָבִ֑ים וְ/הַ/מֵּ֥ת ל/וֹ֙ בַּ/שָּׂדֶ֔ה יֹאכְל֖וּ ע֥וֹף הַ/שָּׁמָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/004.yaml
  text: Whoever belonging to Baasha dies in the city[a], the dogs will eat; and whoever belonging to him dies in the field[b], the birds of the heavens will eat.
translation:
  language: de
  text: Wer von Baëscha in der Stadt stirbt,[a] den werden die Hunde fressen; und wer von ihm auf dem Feld stirbt, den werden die Vögel des Himmels fressen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: Wer zu Baëscha gehört; wahrscheinlich sind Angehörige seines Hauses oder seiner Dynastie gemeint.'
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen ist das Objekt bei „werden fressen“ nicht ausdrücklich genannt.
    reason: textual_clarity
lexical_decisions:
- source_word: הַמֵּת
  choice: wer ... stirbt
  rationale: Das substantivierte Partizip wird hier allgemein gebraucht. Die deutsche Relativkonstruktion gibt diesen Sinn natürlich wieder.
- source_word: לְבַעְשָׁא
  choice: von Baëscha
  rationale: Das ל bezeichnet hier Zugehörigkeit oder Beziehung. »Von Baëscha« bewahrt die im Hebräischen nicht näher bestimmte Zuordnung, wahrscheinlich zu seinem Haus oder seiner Dynastie.
- source_word: בָּעִיר
  choice: in der Stadt
  rationale: Direkte und natürliche Wiedergabe der lokalen Bestimmung.
- source_word: יֹאכְלוּ הַכְּלָבִים
  choice: den werden die Hunde fressen
  rationale: »Fressen« entspricht אָכַל und ist bei Tieren im Deutschen idiomatisch; das vorangestellte Objekt macht den Bezug eindeutig.
- source_word: וְהַמֵּת לוֹ
  choice: und wer von ihm ... stirbt
  rationale: Das Pronomen verweist weiterhin auf Baëscha. Die parallele Formulierung erhält die Struktur des hebräischen Satzes.
- source_word: בַּשָּׂדֶה
  choice: auf dem Feld
  rationale: Im Deutschen ist »auf dem Feld« die idiomatische Ortsangabe und bewahrt den Gegensatz zur Stadt.
- source_word: עוֹף הַשָּׁמָיִם
  choice: die Vögel des Himmels
  rationale: Das kollektive עוֹף wird natürlich als Plural wiedergegeben; »des Himmels« bewahrt die biblische Ausdrucksweise, ohne den Sinn zu verändern.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Zugehörigkeitsformulierung bleibt bewusst offen; »Haus« oder »Dynastie« wird nicht in den Haupttext eingefügt. Die beiden parallelen Gerichtsaussagen werden syntaktisch eng aufeinander bezogen.
