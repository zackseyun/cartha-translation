  text: בְּ/יָמָ֞י/ו בָּנָ֥ה חִיאֵ֛ל בֵּ֥ית הָאֱלִ֖י אֶת יְרִיחֹ֑ה בַּ/אֲבִירָ֨ם בְּכֹר֜/וֹ יִסְּדָ֗/הּ ו/ב/שגיב צְעִיר/וֹ֙ הִצִּ֣יב דְּלָתֶ֔י/הָ כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד יְהוֹשֻׁ֥עַ בִּן נֽוּן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/034.yaml
  text: In his days Hiel of Bethel rebuilt Jericho[a]. At the cost of Abiram his firstborn he laid its foundation, and at the cost of Segub his youngest he set up its gates[b], according to the word of Yahweh that he had spoken through Joshua son of Nun.
translation:
  language: de
  text: Zu seiner Zeit baute Hiël aus Bethel Jericho wieder auf.[a] Um den Preis Abirams, seines Erstgeborenen, legte er ihr Fundament, und um den Preis Segubs, seines jüngsten Sohnes, richtete er ihre Tore auf.[b] Dies geschah gemäß dem Wort Jahwes, das er durch Josua, den Sohn Nuns, gesprochen hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »baute Jericho«; da die Stadt zuvor zerstört worden war, ist hier ihr Wiederaufbau gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »mit/in Abiram, seinem Erstgeborenen, … und mit/in Segub, seinem Jüngsten«. Im Rückbezug auf Josua 6,26 liegt der Sinn nahe, dass der Wiederaufbau ihn diese Söhne kostete.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיָמָיו
  choice: Zu seiner Zeit
  rationale: Die temporale Wendung bezieht sich auf die Zeit des zuvor genannten Königs und klingt im modernen Deutschen natürlicher als das wörtliche »in seinen Tagen«.
- source_word: בָּנָה
  choice: baute … wieder auf
  rationale: Das Verb bedeutet grundsätzlich »bauen«; da Jericho zuvor zerstört worden war, gibt »wieder aufbauen« den kontextuellen Sinn wieder. Die wörtlichere Möglichkeit wird in Fußnote [a] bewahrt.
- source_word: חִיאֵל בֵּית הָאֱלִי
  choice: Hiël aus Bethel
  rationale: Die Herkunftsbezeichnung bezeichnet die Zugehörigkeit zu Bethel; »aus Bethel« ist klares, heutiges Deutsch.
- source_word: בַּאֲבִירָם בְּכֹרוֹ
  choice: Um den Preis seines Erstgeborenen Abiram
  rationale: Die Präposition ב steht hier in einer knappen Erfüllungsformel. Im Rückbezug auf Josua 6,26 bezeichnet sie am ehesten den Verlust des Sohnes, ohne die Todesumstände auszumalen.
- source_word: יִסְּדָהּ
  choice: legte er den Grund der Stadt
  rationale: יסד bezeichnet im Bauzusammenhang das Legen des Fundaments. »Der Stadt« verdeutlicht den femininen Rückbezug auf Jericho natürlich.
- source_word: וּבִשְׂגוּב צְעִירוֹ
  choice: und um den Preis seines jüngsten Sohnes Segub
  rationale: Die Formulierung ist parallel zum ersten Sohn; צעיר bezeichnet im familiären Zusammenhang den Jüngsten.
- source_word: הִצִּיב דְּלָתֶיהָ
  choice: setzte er ihre Tore ein
  rationale: דלת bezeichnet eigentlich Türflügel; bei einer Stadt sind damit die Torflügel beziehungsweise Tore gemeint. »Einsetzen« passt zum Abschluss des Baus.
- source_word: כִּדְבַר יְהוָה
  choice: So erfüllte sich das Wort Jahwes
  rationale: Wörtlich steht »gemäß dem Wort Jahwes«. Die gewählte deutsche Form macht den im Kontext bezeichneten Erfüllungszusammenhang deutlich, ohne dessen Inhalt zu erweitern.
- source_word: אֲשֶׁר דִּבֶּר בְּיַד
  choice: das er durch … gesprochen hatte
  rationale: ביד ist eine geläufige Wendung für Vermittlung oder Beauftragung; »durch« gibt sie idiomatisch wieder.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Josua, den Sohn Nuns
  rationale: Übliche deutsche Wiedergabe des Patronyms.
theological_decisions:
- issue: Bedeutung der Formeln mit Hiëls Söhnen
  choice: Der Wiederaufbau geschah um den Preis des erstgeborenen und des jüngsten Sohnes und erfüllte damit das durch Josua gesprochene Wort.
  alternative: Die Bauabschnitte könnten lediglich zeitlich mit den Söhnen verbunden sein, ohne dass ihr Tod ausdrücklich gemeint ist.
  rationale: Der deutliche Rückbezug auf Josua 6,26 legt den Verlust der Söhne als Flucherfüllung nahe. Die Übersetzung »um den Preis« bringt dies zum Ausdruck, während Fußnote [b] die ungewöhnlich knappe hebräische Form offenlegt.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Wiedergabe als Eigenname entspricht dem hebräischen Konsonantentext und unterscheidet den Gottesnamen von dem Titel »Herr«.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Erzählweise bleibt erhalten; ungebräuchliche Hebraismen werden idiomatisch wiedergegeben, während echte lexikalische Mehrdeutigkeit in den Fußnoten dokumentiert wird.
