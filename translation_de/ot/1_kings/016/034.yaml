    issue: „So erfüllte sich das Wort Jahwes“ statt „gemäß dem Wort Jahwes“
    rationale: Die hebräische Präpositionalphrase כִּדְבַר beschreibt das Geschehen als entsprechend dem Wort JHWHs. Der Erfüllungsgedanke liegt im Kontext nahe, sollte aber nicht die Formulierung der Vorlage ersetzen.
  - severity: low
    issue: „legte er den Grund der Stadt“
    rationale: Die Wiedergabe ist nicht falsch, doch „legte er ihr Fundament“ ist im modernen Deutschen idiomatischer und entspricht dem pronominalen Objekt „ihren/ihm“ im hebräischen Verb unmittelbarer.
