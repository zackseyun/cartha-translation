revisions:
- from: Zu seiner Zeit baute Hiël aus Bethel Jericho wieder auf.[a] Um den Preis seines Erstgeborenen Abiram legte er den Grund der Stadt, und um den Preis seines jüngsten Sohnes Segub setzte er ihre Tore ein.[b] So erfüllte sich das Wort Jahwes, das er durch Josua, den Sohn Nuns, gesprochen hatte.
  to: Zu seiner Zeit baute Hiël aus Bethel Jericho wieder auf.[a] Um den Preis Abirams, seines Erstgeborenen, legte er ihr Fundament, und um den Preis Segubs, seines jüngsten Sohnes, richtete er ihre Tore auf.[b] Dies geschah gemäß dem Wort Jahwes, das er durch Josua, den Sohn Nuns, gesprochen hatte.
  rationale: Die Überarbeitung stellt die Präpositionalphrase „gemäß dem Wort Jahwes“ wieder her, statt den Erfüllungsgedanken als eigenständige Aussage zu formulieren. Sie glättet außerdem zwei deutsche Bauformulierungen, ohne die knappe und hinsichtlich des Schicksals der Söhne zurückhaltende Aussage des Hebräischen über den durch die Fußnote erläuterten Umfang hinaus zu bestimmen.
