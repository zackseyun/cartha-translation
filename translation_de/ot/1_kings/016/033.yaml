  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ אַחְאָ֖ב אֶת הָ/אֲשֵׁרָ֑ה וַ/יּ֨וֹסֶף אַחְאָ֜ב לַ/עֲשׂ֗וֹת לְ/הַכְעִיס֙ אֶת יְהֹוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל מִ/כֹּ֨ל מַלְכֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר הָי֖וּ לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/033.yaml
  text: Ahab also made the Asherah[a], and Ahab went on to do more to provoke Yahweh, the God of Israel, than all the kings of Israel who were before him.
translation:
  language: de
  text: Ahab machte auch die Aschera[a]. Und Ahab tat noch mehr, um Jahwe, den Gott Israels, zum Zorn zu reizen, als alle Könige Israels, die vor ihm gewesen waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Aschera-Pfahl«. Das hebräische Wort kann die Göttin Aschera oder den mit ihr verbundenen Kultgegenstand bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: machte
  rationale: Die Grundbedeutung von עשה ist »machen/tun«. Mit הָאֲשֵׁרָה als direktem Objekt ist »machte« die engste natürliche Wiedergabe; »stellte auf« würde den Vorgang stärker präzisieren, als es das Verb selbst tut.
- source_word: הָאֲשֵׁרָה
  choice: die Aschera
  rationale: אֲשֵׁרָה kann die Göttin Aschera oder den mit ihr verbundenen Kultgegenstand bezeichnen. Die Übernahme des Namens bewahrt diese Mehrdeutigkeit.
- source_word: וַיּוֹסֶף ... לַעֲשׂוֹת
  choice: tat noch mehr
  rationale: יסף mit Infinitiv bezeichnet Fortsetzung oder Steigerung. Zusammen mit dem folgenden Vergleich bringt »tat noch mehr« die hier gemeinte Steigerung idiomatisch zum Ausdruck.
- source_word: לְהַכְעִיס
  choice: zum Zorn zu reizen
  rationale: Der Hifil von כעס bedeutet hier, jemanden zum Zorn zu reizen. Die deutsche Formulierung erhält sowohl den verursachenden Sinn als auch den Bezug auf Gottes Zorn.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: den Gott Israels
  rationale: Die Status-constructus-Verbindung wird direkt und natürlich wiedergegeben; die Apposition bestimmt Jahwe als Israels Gott.
- source_word: מִכֹּל מַלְכֵי יִשְׂרָאֵל
  choice: als alle Könige Israels
  rationale: Das vergleichende מן wird im Deutschen idiomatisch mit »als« ausgedrückt und bezieht sich auf Ahabs gesteigertes Handeln.
- source_word: אֲשֶׁר הָיוּ לְפָנָיו
  choice: die vor ihm gewesen waren
  rationale: Die Wendung bezeichnet die früheren Könige. Die gewählte Form bleibt der hebräischen Ausdrucksweise nahe und ist zugleich eindeutig.
theological_decisions:
- issue: Referent von אֲשֵׁרָה
  choice: Im Haupttext steht »die Aschera«, ohne zwischen der Göttin und ihrem Kultgegenstand zu entscheiden.
  alternative: »der Aschera-Pfahl« oder »Aschera« als ausdrückliche Bezeichnung der Göttin
  rationale: Der hebräische Ausdruck kann je nach Kontext die Gottheit oder ihre kultische Darstellung bezeichnen. Da der Vers selbst den Bezug nicht eindeutig festlegt, bleibt die sachliche und religionsgeschichtliche Mehrdeutigkeit erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung erhöht die Lesbarkeit, ohne die Abfolge oder Steigerung des Hebräischen zu verändern. »Aschera« bewahrt mit einer erklärenden Fußnote die Mehrdeutigkeit des Ausgangstextes.
