id: 1KI.16.1
reference: 1 Kings 16:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְהִ֤י דְבַר יְהוָה֙ אֶל יֵה֣וּא בֶן חֲנָ֔נִי עַל בַּעְשָׁ֖א לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/001.yaml
  text: Then the word of Yahweh came to Jehu son of Hanani against Baasha[a], saying,
translation:
  language: de
  text: 'Da erging das Wort Jahwes an Jehu, den Sohn Hananis, gegen Bascha[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über Bascha“ beziehungsweise „in Bezug auf Bascha“. Die hebräische Präposition kann weiter gefasst sein; hier leitet sie jedoch ein Gerichtswort ein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Da erging
  rationale: Die Erzählform führt eine neue, zeitlich anschließende Entwicklung ein. „Da erging“ ist eine natürliche und zugleich würdige deutsche Wiedergabe der prophetischen Formel.
- source_word: דְבַר יְהוָה
  choice: das Wort Jahwes
  rationale: „Wort“ bewahrt die feste prophetische Offenbarungsformel und ihre theologische Aussagekraft.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶל
  choice: an
  rationale: In der deutschen Wendung „das Wort erging an“ bezeichnet „an“ idiomatisch den Empfänger der Offenbarung.
- source_word: יֵהוּא בֶן חֲנָנִי
  choice: Jehu, den Sohn Hananis
  rationale: Die Namen folgen den im Deutschen üblichen biblischen Formen; die Apposition macht das Abstammungsverhältnis klar und flüssig lesbar.
- source_word: עַל
  choice: gegen
  rationale: Im folgenden Gerichtswort richtet sich die Botschaft gegen Bascha. Die grundsätzlich mögliche weitere Bedeutung der Präposition bleibt in einer Fußnote sichtbar.
- source_word: בַּעְשָׁא
  choice: Bascha
  rationale: Verwendet wird die geläufige deutsche Form des hebräischen Personennamens.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der hebräische Redeeinleiter kündigt den Inhalt der unmittelbar folgenden Rede an. Im heutigen Deutschen erfüllt ein Doppelpunkt diese Funktion natürlicher als „indem er sprach“ oder „mit den Worten“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen selbst. „Jahwe“ bewahrt ihn als persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von עַל in der prophetischen Formel
  choice: gegen Bascha
  alternative: über Bascha / in Bezug auf Bascha
  rationale: Der Kontext leitet ein Gerichtswort ein, weshalb „gegen“ die gerichtliche Stoßrichtung angemessen wiedergibt. Da die Präposition an sich weiter gefasst sein kann, wird die Alternative in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feste prophetische Formel bleibt erkennbar; der abschließende Redeeinleiter wird idiomatisch durch einen Doppelpunkt wiedergegeben.
