  source_fidelity: 'Der Text gibt die hebräische Formel präzise wieder: וַיְהִי wird angemessen als erzählender Fortschritt („Da erging“) ausgedrückt, דְבַר־יְהוָה als „das Wort Jahwes“, und אֶל als „an“. Die Empfängerangabe „Jehu, den Sohn Hananis“ entspricht dem hebräischen Patronym. „gegen Bascha“ bildet die im unmittelbaren Kontext gerichtliche Stoßrichtung von עַל sachgerecht ab, ohne die grundsätzlich weitere Bedeutung zu verschleiern. Der Doppelpunkt erfüllt die Funktion von לֵאמֹר idiomatisch.'
