  terminology: „Jahwe“ gibt den Gottesnamen konsequent als Eigenname wieder. „Wort Jahwes“ bewahrt die etablierte prophetische Terminologie. Die Namensformen Jehu, Hanani und Bascha sind im Deutschen gut verständlich und konsistent transliteriert.
