  text: וְ/יֶ֨תֶר דִּבְרֵ֤י עָמְרִי֙ אֲשֶׁ֣ר עָשָׂ֔ה וּ/גְבוּרָת֖/וֹ אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹֽא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/027.yaml
  text: The rest of the acts of Omri[a], what he did[b], and his might that he showed—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: de
  text: Die übrigen Taten Omris, die er vollbrachte, und seine Macht, die er bewies[a] – sind sie nicht im Buch der Annalen der Könige von Israel aufgezeichnet?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und seine Machttaten«. Das hebräische Wort kann sowohl Macht beziehungsweise Stärke als auch Taten bezeichnen, in denen sich diese Macht zeigt.'
    reason: lexical_alternative
  - marker: b
    text: Das »Buch der Annalen der Könige von Israel« bezeichnet eine königliche Annalenquelle; gemeint ist nicht das biblische Buch der Chronik.
    reason: cultural_note
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי עָמְרִי
  choice: Die übrigen Taten Omris
  rationale: יֶתֶר bezeichnet in der Königsformel den verbleibenden Teil des Berichts; דִּבְרֵי meint hier nicht bloß »Worte«, sondern Omris Handlungen und Angelegenheiten. Das anlautende וְ wird im Deutschen durch den fließenden Anschluss im Kontext getragen.
- source_word: אֲשֶׁר עָשָׂה
  choice: alles, was er tat
  rationale: Die freie Relativkonstruktion wird vollständig und in natürlichem Deutsch wiedergegeben; »alles« verdeutlicht den zusammenfassenden Charakter, ohne den Sinn einzuengen.
- source_word: וּגְבוּרָתוֹ אֲשֶׁר עָשָׂה
  choice: und die Macht, die er entfaltete
  rationale: גְּבוּרָה kann Macht, Stärke oder Machttaten bezeichnen. Die Hauptfassung bewahrt den abstrakten Begriff, während »entfaltete« die erneute Form von עשה idiomatisch wiedergibt und auf sichtbar gewordene Macht verweist.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: sind sie nicht ... aufgezeichnet?
  rationale: Die rhetorische Frage, die eine bejahende Antwort erwartet, sowie der Plural des hebräischen Pronomens werden bewahrt. »Aufgezeichnet« passt natürlich zum archivalischen Zusammenhang.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: im Buch der Chronik der Könige von Israel
  rationale: עַל wird in dieser Quellenformel idiomatisch mit »im« wiedergegeben. דִּבְרֵי הַיָּמִים bezeichnet eine chronikalische beziehungsweise annalistische Aufzeichnung; לְ drückt hier die Zugehörigkeit zu den Königen Israels aus.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle rhetorische Abschlussformel bleibt erkennbar, wird aber mit natürlicher deutscher Wortstellung wiedergegeben. Die lexikalische Mehrdeutigkeit von גְּבוּרָה wird nicht im Haupttext aufgelöst, sondern durch eine Fußnote offengehalten.
