base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/028.yaml
  text: And Omri slept with his fathers and was buried in Samaria[a], and Ahab his son reigned in his place.
translation:
  language: de
  text: Omri starb[a] und wurde in Samaria begraben. Sein Sohn Ahab wurde an seiner Stelle König.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Omri legte sich zu seinen Vätern“; eine feste Wendung für den Tod in den Königserzählungen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עָמְרִי עִם אֲבֹתָיו
  choice: Omri legte sich zu seinen Vorfahren
  rationale: Die hebräische Königsformel bezeichnet Omris Tod. „Legte sich zu“ bewahrt das Bild der Vorlage; „Vorfahren“ gibt אָבוֹת in diesem dynastischen Zusammenhang im heutigen Deutsch verständlich wieder.
- source_word: וַיִּקָּבֵר
  choice: wurde begraben
  rationale: Die passive Form des hebräischen Verbs wird im Deutschen natürlich als „wurde begraben“ wiedergegeben.
- source_word: בְּשֹׁמְרוֹן
  choice: in Samaria
  rationale: Die Präposition bezeichnet hier den Ort der Bestattung.
- source_word: וַיִּמְלֹךְ
  choice: wurde König
  rationale: Im Rahmen der Thronfolge bezeichnet das Verb den Antritt der Königsherrschaft. „Wurde König“ ist in modernem Deutsch natürlicher als das isolierte „regierte“ und fügt keine zeitliche Dauer hinzu.
- source_word: תַּחְתָּיו
  choice: an seiner Stelle
  rationale: Die Wendung bezeichnet Ahabs Nachfolge und bewahrt den Ersetzungsgedanken des Hebräischen.
