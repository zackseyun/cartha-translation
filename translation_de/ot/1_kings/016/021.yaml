source:
  edition: WLC
  text: אָ֧ז יֵחָלֵ֛ק הָ/עָ֥ם יִשְׂרָאֵ֖ל לַ/חֵ֑צִי חֲצִ֨י הָ/עָ֜ם הָ֠יָה אַחֲרֵ֨י תִבְנִ֤י בֶן גִּינַת֙ לְ/הַמְלִיכ֔/וֹ וְ/הַ/חֲצִ֖י אַחֲרֵ֥י עָמְרִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/021.yaml
  text: 'Then the people of Israel were divided into two parts: half of the people followed Tibni son of Ginath[a], to make him king, and half followed Omri.'
translation:
  language: de
  text: 'Damals spaltete sich das Volk Israel in zwei Hälften: Die eine Hälfte folgte Tibni, dem Sohn Ginats, um ihn zum König zu machen,[a] und die andere Hälfte folgte Omri.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die eine Hälfte stand hinter Tibni, dem Sohn Ginats, um ihn zum König zu machen, und die andere hinter Omri.“'
    reason: Die hebräische Wendung הָיָה אַחֲרֵי kann sowohl als „jemandem folgen“ als auch als „hinter jemandem stehen“ im Sinn politischer Unterstützung wiedergegeben werden.
lexical_decisions:
- source_word: יֵחָלֵק
  choice: spaltete sich
  rationale: Das Nifal von חלק bezeichnet hier das Auseinandergehen in getrennte Gruppen. Die reflexive Form ist im Deutschen natürlich und entspricht dem kollektiven Singular des hebräischen Subjekts.
- source_word: הָעָם יִשְׂרָאֵל
  choice: das Volk Israel
  rationale: Die appositionelle Verbindung bezeichnet die israelitische Bevölkerung als politisches Kollektiv; „das Volk Israel“ ist dafür die geläufige und quellennah formulierte deutsche Wendung.
- source_word: לַחֵצִי
  choice: in zwei Hälften
  rationale: Die Präposition mit חֵצִי bezeichnet die Teilung in Hälften. „In zwei Hälften“ gibt dies im heutigen Deutsch klar wieder.
- source_word: חֲצִי הָעָם
  choice: die eine Hälfte
  rationale: Nach der ausdrücklichen Teilung des Volkes in zwei Hälften ist diese Formulierung idiomatisch; das parallele „die andere Hälfte“ macht die ausgewogene Gegenüberstellung deutlich.
- source_word: הָיָה אַחֲרֵי
  choice: folgte
  rationale: Die Wendung „hinter jemandem sein“ bezeichnet in diesem politischen Zusammenhang Gefolgschaft beziehungsweise Unterstützung. „Folgte“ bewahrt das Bild und bleibt gut verständlich.
- source_word: תִבְנִי בֶן גִּינַת
  choice: Tibni, dem Sohn Ginats
  rationale: Die Namen werden in üblicher deutscher Form transliteriert; der Genitiv „Ginats“ gibt die Abstammungsangabe natürlich wieder.
- source_word: לְהַמְלִיכוֹ
  choice: um ihn zum König zu machen
  rationale: Der Hifil-Infinitiv von מלך mit Suffix bedeutet, Tibni zum Herrscher zu machen. Die Übersetzung vermeidet den nicht ausdrücklich genannten zeremoniellen Aspekt von „krönen“.
- source_word: וְהַחֲצִי אַחֲרֵי עָמְרִי
  choice: und die andere Hälfte folgte Omri
  rationale: Das Verb wird entsprechend dem hebräischen Parallelismus aus dem ersten Teilsatz ergänzt. „Andere“ ist im Deutschen zur eindeutigen Bezeichnung der zweiten der beiden Hälften sinnvoll.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der ausgewogene Satzbau bildet die beiden rivalisierenden Lager ab; die Wiederholung von „folgte“ macht den im Hebräischen elliptischen zweiten Teilsatz für heutige Leser ausdrücklich verständlich.
