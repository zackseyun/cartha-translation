base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/003.yaml
  text: Behold[a], I am sweeping away Baasha and his house, and I will make your house like the house of Jeroboam son of Nebat.
translation:
  language: de
  text: Siehe, ich werde Bascha und sein Haus hinwegfegen[a] und dein Haus dem Haus Jerobeams, des Sohnes Nebats, gleichmachen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher etwa: »Ich brenne hinter Bascha und hinter seinem Haus aus.« Die hebräische Wendung meint, dass der HERR Bascha und sein Haus vollständig beseitigen wird.'
    reason: Die Fußnote bildet die Wiederholung des Bezugs auf Bascha und sein Haus im Hebräischen vollständig ab und erläutert das sonst im Deutschen unklare Idiom.
lexical_decisions:
- source_word: הִנְנִי
  choice: Siehe
  rationale: Leitet eine feierliche göttliche Gerichtsankündigung ein und bewahrt deren prophetischen Nachdruck.
- source_word: מַבְעִיר אַחֲרֵי
  choice: werde … hinwegfegen
  rationale: Die Verbindung bezeichnet hier idiomatisch die vollständige Beseitigung Baschas und seiner Linie. »Hinwegfegen« gibt die drastische Wirkung natürlich wieder, ohne Feuer als konkrete Vollzugsart festzulegen.
- source_word: בֵיתוֹ / בֵיתְךָ
  choice: sein Haus / dein Haus
  rationale: »Haus« bewahrt das hebräische Bild und umfasst in diesem königlichen Zusammenhang Familie, Haushalt und Dynastie.
- source_word: וְנָתַתִּי … כְּבֵית
  choice: dem Haus … gleichmachen
  rationale: נתן bedeutet in dieser Konstruktion, etwas in einen bestimmten Zustand zu versetzen; die deutsche Wendung gibt den Vergleich klar und würdig wieder.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jerobeam, der Sohn Nebats
  rationale: Entspricht der im Deutschen üblichen Form des Namens und gibt das Patronym verständlich wieder.
theological_decisions:
- issue: Art des Gerichts über Baschas Linie
  choice: Die Wendung als vollständige Beseitigung des Königshauses wiedergeben, ohne im Haupttext buchstäbliches Feuer als Mittel zu behaupten.
  alternative: »Ich werde hinter Bascha her ausbrennen/vertilgen«
  rationale: Der hebräische Ausdruck kündigt umfassendes göttliches Gericht über Bascha und seine Nachkommen an. Eine streng wörtliche Wiedergabe wäre im Deutschen dunkel und könnte eine konkrete Verbrennungsart nahelegen, die der Text nicht zwingend festlegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Siehe« erhält den feierlichen prophetischen Ton; »Haus« bewahrt bewusst die familiäre und dynastische Mehrdeutigkeit.
