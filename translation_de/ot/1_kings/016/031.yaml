source:
  edition: WLC
  text: וַ/יְהִי֙ הֲ/נָקֵ֣ל לֶכְתּ֔/וֹ בְּ/חַטֹּ֖אות יָרָבְעָ֣ם בֶּן נְבָ֑ט וַ/יִּקַּ֨ח אִשָּׁ֜ה אֶת אִיזֶ֗בֶל בַּת אֶתְבַּ֨עַל֙ מֶ֣לֶךְ צִידֹנִ֔ים וַ/יֵּ֨לֶךְ֙ וַֽ/יַּעֲבֹ֣ד אֶת הַ/בַּ֔עַל וַ/יִּשְׁתַּ֖חוּ לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/031.yaml
  text: And as if it were a light thing for him to walk in the sins of Jeroboam son of Nebat[a], he took Jezebel daughter of Ethbaal, king of the Sidonians, as his wife, and went and served Baal and bowed down to him.
translation:
  language: de
  text: Und als sei es für ihn eine Kleinigkeit, in den Sünden Jerobeams, des Sohnes Nebats, zu leben,[a] nahm er Isebel, die Tochter Etbaals, des Königs der Sidonier, zur Frau. Dann ging er hin, diente dem Baal und warf sich vor ihm nieder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder als rhetorische Frage: „War es für ihn etwa eine Kleinigkeit, in den Sünden Jerobeams, des Sohnes Nebats, zu leben?“ Die hebräische Eröffnung betont, dass Ahab diese Sünden als unbedeutend behandelte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲנָקֵל
  choice: als wäre es für ihn eine Kleinigkeit gewesen
  rationale: Die idiomatisch-rhetorische Wendung stellt heraus, dass Ahab die Sünden Jerobeams wie etwas Unbedeutendes behandelte, und leitet eine Steigerung ein.
- source_word: לֶכְתּוֹ בְּחַטֹּאות
  choice: in den Sünden … zu leben
  rationale: Das hebräische Bild bedeutet hier, sein Leben beziehungsweise Verhalten an diesen Sünden auszurichten. „Zu leben“ ist im modernen Deutschen natürlicher als die formale Wiedergabe „zu wandeln“.
- source_word: וַיִּקַּח אִשָּׁה אֶת אִיזֶבֶל
  choice: nahm er Isebel … zur Frau
  rationale: Bewahrt die Struktur des Hebräischen und klingt zugleich natürlich und würdig.
- source_word: אֶתְבַּעַל
  choice: Etbaal
  rationale: Eine direkte, im Deutschen verständliche Transliteration des phönizischen Königsnamens.
- source_word: צִידֹנִים
  choice: Sidonier
  rationale: Gibt das pluralische Volksgentiliz der hebräischen Wendung „König der Sidonier“ direkt wieder.
- source_word: וַיַּעֲבֹד אֶת הַבַּעַל
  choice: diente dem Baal
  rationale: עבד bezeichnet im kultischen Zusammenhang religiösen Dienst. Diese Wiedergabe hält den Ausdruck vom folgenden Niederwerfen auseinander.
- source_word: וַיִּשְׁתַּחוּ לוֹ
  choice: warf sich vor ihm nieder
  rationale: Gibt die körperliche Handlung der Prostration präzise wieder, ohne sie lediglich mit dem allgemeineren „anbeten“ zusammenzufassen.
theological_decisions:
- issue: Ahabs Abfall im Verhältnis zu den Sünden Jerobeams
  choice: 'Die Eröffnung wird als rhetorische Steigerung wiedergegeben: Ahab behandelte Jerobeams Sünden wie eine Kleinigkeit und ging mit seinem Baalsdienst noch weiter.'
  alternative: 'Die Wendung könnte als direkte Frage formuliert werden: „War es für ihn etwa eine Kleinigkeit, in den Sünden Jerobeams … zu leben?“'
  rationale: Das hebräische הֲנָקֵל ist rhetorisch und kann formal als Frage verstanden werden. Im Zusammenhang bewertet der Vers Ahabs Handeln als Verschärfung des bisherigen Abfalls; die Übersetzung bewahrt diese Aussage, ohne die Frageform als einzig mögliche Deutung festzulegen.
- issue: „Baal“ mit oder ohne bestimmten Artikel
  choice: dem Baal
  alternative: Baal
  rationale: Das Hebräische hat den bestimmten Artikel הַבַּעַל. Im Deutschen ist „der Baal“ eine natürliche Möglichkeit, die Form des Ausgangstextes zu bewahren, wobei die Bezeichnung zugleich wie ein Eigenname wirkt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Erzählstil. „Zu leben“ vermeidet das heute altertümliche „zu wandeln“; „warf sich … nieder“ bewahrt die konkrete kultische Handlung.
