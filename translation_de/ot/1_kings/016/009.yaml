  register: Moderne, würdige Erzählsprache. Die politische Bedeutung der Verschwörung und die anschauliche Beschreibung des Trinkens bleiben erhalten. Der Name Ela wird zur Vermeidung eines missverständlichen Pronomenbezugs ausdrücklich genannt.
