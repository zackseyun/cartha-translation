base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/009.yaml
  text: But his servant Zimri[a], commander of half the chariots, conspired against him while he was in Tirzah, drinking himself drunk in the house of Arza[b], who was over the household in Tirzah.
translation:
  language: de
  text: Doch sein Diener Simri, der Befehlshaber über die Hälfte der Streitwagen, verschwor sich gegen ihn, während Ela in Tirza im Haus Arzas, der dort über den Haushalt gesetzt war,[a] trank, bis er betrunken war.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »der über das Haus gesetzt war«. Gemeint ist wahrscheinlich ein hoher Beamter, der den königlichen Haushalt oder Palast verwaltete.'
    reason: cultural_note
  - marker: b
    text: 'Der hebräische Ausdruck schildert anschaulich ein Trinken, das zur Trunkenheit führte; auch möglich: »trank und sich betrank«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשֹׁר עָלָיו
  choice: verschwor sich gegen ihn
  rationale: קשר mit עַל bezeichnet im königlichen Erzählkontext eine politische Verschwörung gegen den Herrscher; die deutsche Wendung ist präzise und idiomatisch.
- source_word: עַבְדּוֹ
  choice: sein Diener
  rationale: Die Grundbedeutung bleibt erhalten; im höfischen Kontext kann damit zugleich ein Amtsträger gemeint sein.
- source_word: זִמְרִי
  choice: Simri
  rationale: Die im Deutschen etablierte biblische Namensform wird verwendet.
- source_word: שַׂר מַחֲצִית הָרָכֶב
  choice: der Befehlshaber über die Hälfte der Streitwagen
  rationale: שַׂר bezeichnet einen Befehlshaber; רכב kann die Streitwagen beziehungsweise die Streitwagentruppe meinen. Die Übersetzung bleibt nahe an der Konstruktion und gut verständlich.
- source_word: וְהוּא
  choice: Während Ela
  rationale: Das Pronomen eröffnet eine Begleitumstandsangabe. Der Eigenname wird zur eindeutigen Auflösung des männlichen Bezugs eingesetzt, da im Deutschen sonst Simri als nächster Bezug naheläge.
- source_word: בְתִרְצָה
  choice: in Tirza
  rationale: Der Ortsname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: שֹׁתֶה שִׁכּוֹר
  choice: trank und sich betrank
  rationale: Die Formulierung gibt sowohl das fortdauernde Trinken als auch die daraus entstehende Trunkenheit natürlich und anschaulich wieder.
- source_word: בֵּית אַרְצָא
  choice: im Haus Arzas
  rationale: Die Genitivkonstruktion ist eine natürliche und quellennah formulierte deutsche Wiedergabe.
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: des Palastverwalters
  rationale: Die hebräische Amtsbezeichnung meint hier wahrscheinlich den Verantwortlichen für den königlichen Haushalt beziehungsweise Palast; die funktionsbezogene Wiedergabe ist im Deutschen klar.
- source_word: בְּתִרְצָה
  choice: in Tirza
  rationale: Die Wiederholung des Ortsnamens wird entsprechend dem Hebräischen beibehalten und auf Arzas Amtsbereich bezogen.
