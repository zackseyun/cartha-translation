  text: וּ/מוֹצָ֧א הַ/סּוּסִ֛ים אֲשֶׁ֥ר לִ/שְׁלֹמֹ֖ה מִ/מִּצְרָ֑יִם וּ/מִ/קְוֵ֕ה סֹחֲרֵ֣י הַ/מֶּ֔לֶךְ יִקְח֥וּ מִ/קְוֵ֖ה בִּ/מְחִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/028.yaml
  text: And the importation of the horses that belonged to Solomon was from Egypt and Kue[b][a]; the king’s merchants would obtain them from Kue at a price.
translation:
  language: de
  text: Die Pferde für Salomo wurden aus Ägypten und aus Kue eingeführt.[a] Die Händler des Königs bezogen sie aus Kue gegen Bezahlung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hier mit „Kue“ wiedergegebene hebräische Wort ist unsicher. Wahrscheinlich bezeichnet es Kue in Kilikien; möglicherweise bedeutet es aber „Herde“ oder „Sammlung“. Dann wäre sinngemäß zu übersetzen: „Die Pferde für Salomo wurden aus Ägypten und aus einer Herde bzw. Sammlung eingeführt; die Händler des Königs erwarben eine Herde bzw. Sammlung gegen Bezahlung.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹצָא
  choice: wurden … eingeführt
  rationale: Das Substantiv bezeichnet wörtlich Ausgang, Herkunft oder Ausfuhr. Aus Salomos Perspektive gibt der Handelszusammenhang eine Einfuhr wieder; die verbale Formulierung klingt im modernen Deutsch natürlich.
- source_word: הַסּוּסִים אֲשֶׁר לִשְׁלֹמֹה
  choice: die Pferde für Salomo
  rationale: Das ל bei Salomo kann Zugehörigkeit oder Bestimmung ausdrücken. „Für Salomo“ bewahrt diese Offenheit besser als eine eindeutige Besitzangabe.
- source_word: מִמִּצְרָיִם
  choice: aus Ägypten
  rationale: Übliche Wiedergabe des Ortsnamens mit der Herkunftspräposition.
- source_word: וּמִקְוֵה / מִקְוֵה
  choice: und aus Kue / in Kue
  rationale: Im Handelszusammenhang ist מקוה wahrscheinlich als Ortsname Kue in Kilikien zu verstehen. Da die Lesart unsicher ist, wird die gemeinnominale Alternative in der Fußnote genannt.
- source_word: סֹחֲרֵי הַמֶּלֶךְ
  choice: die Händler des Königs
  rationale: Natürliche moderne Wiedergabe für königliche Handelsbeauftragte.
- source_word: יִקְחוּ
  choice: erwarben
  rationale: לקח bedeutet grundsätzlich „nehmen“, bezeichnet hier wegen der Preisangabe aber einen Erwerb, ohne die Transaktion unnötig genauer festzulegen.
- source_word: בִּמְחִיר
  choice: zu einem bestimmten Preis
  rationale: Die Wendung bezeichnet einen entgeltlichen Erwerb; „zu einem bestimmten Preis“ gibt den bestimmten hebräischen Handelsausdruck idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die schwer verständliche hebräische Satzstruktur wurde in zwei Sätze gegliedert. Der Ortsname „Kue“ bleibt im Haupttext stehen, während die echte lexikalische Unsicherheit in einer Fußnote erhalten wird.
