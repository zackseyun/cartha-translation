base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/010.yaml
  text: And she gave the king one hundred and twenty talents of gold[a], and a very great quantity of spices, and precious stones. Never again did such an abundance of spices come as those that the queen of Sheba gave to King Solomon.
translation:
  language: de
  text: Dann gab sie dem König 120 Talente Gold, dazu eine überaus große Menge an Gewürzen und kostbare Steine. Nie wieder kamen Gewürze in solcher Fülle[a] wie die, welche die Königin von Saba König Salomo gab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht im Vergleichssatz „Gewürz“ im Singular; wahrscheinlich ist es kollektiv gemeint, daher „Gewürze“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: Dann gab sie
  rationale: Das Wayyiqtol führt die Erzählung fort; „Dann“ gibt die narrative Abfolge im Deutschen natürlich wieder.
- source_word: מֵאָה וְעֶשְׂרִים כִּכַּר זָהָב
  choice: 120 Talente Gold
  rationale: כִּכָּר bezeichnet eine antike Gewichtseinheit. „Talent“ bewahrt die historische Maßeinheit, statt eine unsichere moderne Umrechnung in den Haupttext einzutragen.
- source_word: וּבְשָׂמִים הַרְבֵּה מְאֹד
  choice: eine überaus große Menge an Gewürzen
  rationale: בְּשָׂמִים bezeichnet aromatische Gewürze beziehungsweise Duftstoffe; הַרְבֵּה מְאֹד betont ihre außergewöhnlich große Menge.
- source_word: וְאֶבֶן יְקָרָה
  choice: kostbare Steine
  rationale: Der hebräische Singular אֶבֶן ist hier in der Aufzählung am besten kollektiv zu verstehen; der deutsche Plural ist idiomatisch.
- source_word: לֹא בָא ... עוֹד
  choice: Nie wieder kamen ... ins Land
  rationale: בוא bezeichnet hier das Eintreffen beziehungsweise die Einfuhr der Waren; עוֹד mit der Verneinung ergibt „nie wieder“. „Ins Land“ macht den im Deutschen erforderlichen Zielbezug deutlich, ohne einen konkreteren Ort als den Kontext vorauszusetzen.
- source_word: כַבֹּשֶׂם הַהוּא ... לָרֹב
  choice: Gewürze in solcher Fülle
  rationale: בֹּשֶׂם steht grammatisch im Singular, kann aber kollektiv gebraucht sein; לָרֹב bezeichnet die außergewöhnliche Menge. Die Formulierung bewahrt sowohl den Vergleich als auch den Mengenakzent.
- source_word: מַלְכַּת שְׁבָא
  choice: die Königin von Saba
  rationale: „Saba“ ist die etablierte deutsche Wiedergabe von שְׁבָא in dieser Bezeichnung.
- source_word: לַמֶּלֶךְ שְׁלֹמֹה
  choice: König Salomo
  rationale: Die Verbindung aus Titel und Eigenname wird im heutigen Deutschen natürlich als „König Salomo“ wiedergegeben.
