  text: So King Solomon surpassed all the kings of the earth in wealth and wisdom[a].
translation:
  language: de
  text: König Salomo übertraf alle Könige der Erde an Reichtum und Weisheit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Formaler: „Und König Salomo wurde größer als alle Könige der Erde an Reichtum und Weisheit.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: So übertraf
  rationale: גדל mit dem vergleichenden מִן bezeichnet hier, dass Salomo größer wurde beziehungsweise größer war als andere. „Übertraf“ gibt den Vergleich im modernen Deutschen klar und natürlich wieder; „So“ fasst den resultativen Fortgang des Zusammenhangs auf.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: König Salomo
  rationale: Die appositionelle Verbindung aus bestimmtem Königstitel und Eigenname wird im Deutschen idiomatisch als „König Salomo“ wiedergegeben.
- source_word: מִכֹּל מַלְכֵי הָאָרֶץ
  choice: alle Könige der Erde
  rationale: אֶרֶץ kann „Land“ oder „Erde“ bedeuten. Im internationalen Vergleich der Könige passt die umfassendere Bedeutung „Erde“ am besten, ohne daraus eine technisch absolute Aussage zu machen.
- source_word: לְעֹשֶׁר
  choice: an Reichtum
  rationale: עֹשֶׁר bezeichnet materiellen Reichtum. Nach „übertreffen“ ist „an Reichtum“ eine natürliche deutsche Vergleichskonstruktion.
- source_word: וּלְחָכְמָה
  choice: und Weisheit
  rationale: חָכְמָה bedeutet „Weisheit“. Das einmal gesetzte „an“ gilt im Deutschen natürlich für beide verbundenen Substantive.
- source_word: וַ
  choice: So
  rationale: Das Waw führt die Erzählung fort und kann hier zugleich die zusammenfassende Folge des Vorangehenden anzeigen. „So“ bildet diese resultative Nuance natürlich ab; ein formalerer Anschluss mit „Und“ bleibt möglich.
