base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/029.yaml
  text: And a chariot was imported from Egypt for six hundred shekels of silver[a], and a horse for a hundred and fifty[c][b]; and so they exported them to all the kings of the Hittites and to the kings of Aram by their hand.
translation:
  language: de
  text: Ein Streitwagen wurde aus Ägypten für sechshundert Schekel Silber eingeführt[a], ein Pferd für hundertfünfzig Schekel[b]. In derselben Weise wurden durch sie[c] Streitwagen und Pferde an alle Könige der Hetiter und an die Könige von Aram ausgeführt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »wurde heraufgebracht und herausgeführt aus Ägypten«. Im Handelszusammenhang ist die Einfuhr gemeint.'
    reason: lexical_alternative
  - marker: b
    text: »Schekel« ist bei beiden Preisangaben sinngemäß ergänzt; der hebräische Text nennt bei der ersten Angabe wörtlich nur »sechshundert Silber« und bei der zweiten »hundertfünfzig«.
    reason: implicit_unit
  - marker: c
    text: 'Wörtlich: »durch ihre Hand«, das heißt durch ihre Vermittlung oder durch ihre Beauftragten. Der Bezug des Pronomens wird im Vers nicht ausdrücklich genannt.'
    reason: pronoun_ambiguity
lexical_decisions:
- source_word: וַתַּעֲלֶה וַתֵּצֵא
  choice: wurde … eingeführt
  rationale: Die beiden Bewegungsverben bedeuten wörtlich etwa »kam herauf und heraus«. Im Zusammenhang des Warenhandels bezeichnen sie die Einfuhr aus Ägypten; die Fußnote bewahrt die wörtliche Ausdrucksweise.
- source_word: מֶרְכָּבָה
  choice: ein Streitwagen
  rationale: מֶרְכָּבָה bezeichnet hier einen Wagen für den militärischen Gebrauch. Der Singular passt zur Preisangabe je Stück.
- source_word: בְּשֵׁשׁ מֵאוֹת כֶּסֶף
  choice: für sechshundert Schekel Silber
  rationale: Der hebräische Text nennt wörtlich »sechshundert Silber«; »Schekel« ist die im Kontext vorausgesetzte Gewichtseinheit.
- source_word: וְסוּס
  choice: ein Pferd
  rationale: Das Grundwort bedeutet allgemein »Pferd«; eine engere Wiedergabe als »Kriegspferd« wäre trotz des militärischen Umfelds nicht ausdrücklich im Hebräischen enthalten.
- source_word: בַּחֲמִשִּׁים וּמֵאָה
  choice: für hundertfünfzig Schekel
  rationale: Die natürliche deutsche Zahlenfolge gibt den Preis eines Pferdes wieder; die ergänzte Einheit ist aus der vorangehenden Silberangabe erschlossen.
- source_word: וְכֵן
  choice: ebenso
  rationale: Das Wort verbindet die Preisangabe mit der entsprechenden Weiterlieferung an andere Könige.
- source_word: לְכָל מַלְכֵי הַחִתִּים
  choice: an alle Könige der Hetiter
  rationale: Die Präposition kennzeichnet hier die Empfänger; »Hetiter« bewahrt die ethnisch-politische Bezeichnung des Ausgangstextes.
- source_word: וּלְמַלְכֵי אֲרָם
  choice: und an die Könige von Aram
  rationale: Aram ist der hebräische Eigenname und wird nicht mit dem traditionellen, aber weniger genauen »Syrien« ersetzt.
- source_word: בְּיָדָם
  choice: über sie
  rationale: Die Wendung lautet wörtlich »durch ihre Hand« und bezeichnet Vermittlung oder geschäftliche Abwicklung. Das Pronomen verweist wahrscheinlich auf die Händler des Königs aus dem vorherigen Vers, bleibt im Vers selbst aber unausgeführt.
- source_word: יֹצִאוּ
  choice: wurden … ausgeführt
  rationale: Der Hifil von יצא bedeutet »hinausbringen«. Im Handelszusammenhang ist »ausführen« idiomatisch; die passive Form ermöglicht im Deutschen eine klare Wiedergabe, ohne den nur aus dem Kontext erschließbaren Handlungsträger ausdrücklich einzusetzen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Handelsbegriffe wie »eingeführt« und »ausgeführt« geben den Kontext natürlich wieder; Fußnoten erhalten die konkreten hebräischen Bewegungsbilder und die Mehrdeutigkeit des Pronomens. Die Wiederholung »Streitwagen und Pferde« im zweiten Satz verdeutlicht den im Hebräischen ausgelassenen Gegenstand des Verbs.
