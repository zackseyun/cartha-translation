  text: וַֽ/יְהִי֙ מִשְׁקַ֣ל הַ/זָּהָ֔ב אֲשֶׁר בָּ֥א לִ/שְׁלֹמֹ֖ה בְּ/שָׁנָ֣ה אֶחָ֑ת שֵׁ֥שׁ מֵא֛וֹת שִׁשִּׁ֥ים וָ/שֵׁ֖שׁ כִּכַּ֥ר זָהָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/014.yaml
  text: The weight of the gold that came to Solomon in one year was six hundred sixty-six talents of gold,[a]
translation:
  language: de
  text: Das Gewicht des Goldes, das Salomo in einem Jahr zufloss, betrug 666 Talente Gold.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Talent war eine große Gewichtseinheit. Der Vers nennt die jährliche Menge nach antikem Maß, ohne sie in moderne Einheiten umzurechnen.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: betrug
  rationale: Die Erzählform führt die Feststellung ein; im modernen Deutschen gibt das finite Verb „betrug“ die Aussage natürlich wieder, ohne eine nicht ausdrücklich vorhandene Zeitangabe wie „nun“ einzufügen.
- source_word: מִשְׁקַל
  choice: Gewicht
  rationale: Das Substantiv bezeichnet Gewicht beziehungsweise Gewichtsmenge; „Gewicht“ ist hier direkt und idiomatisch.
- source_word: הַזָּהָב ... זָהָב
  choice: des Goldes ... Gold
  rationale: Die erste Nennung bezeichnet die gewogene Ware, die zweite bestimmt die Maßeinheit als Goldgewicht. Die Wiederholung entspricht der hebräischen Formulierung.
- source_word: אֲשֶׁר בָּא לִשְׁלֹמֹה
  choice: das Salomo ... zufloss
  rationale: בוא mit ל bezeichnet, was Salomo erreichte. „zufloss“ ist in einem Einnahmenkontext natürlich und lässt offen, durch welche Personen oder Quellen das Gold kam.
- source_word: בְּשָׁנָה אֶחָת
  choice: in einem Jahr
  rationale: Die Wendung bezeichnet die innerhalb eines Jahres eingegangene Menge und bleibt nahe am Hebräischen.
- source_word: שֵׁשׁ מֵאוֹת שִׁשִּׁים וָשֵׁשׁ
  choice: '666'
  rationale: Die Ziffernschreibung gibt die Kardinalzahl eindeutig und in einem buchhalterischen Kontext gut lesbar wieder.
- source_word: כִּכַּר
  choice: Talente
  rationale: „Talent“ ist die herkömmliche deutsche Bezeichnung der antiken Gewichtseinheit; eine moderne Umrechnung würde eine nicht völlig feste Größe vortäuschen.
