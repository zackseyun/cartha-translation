base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/002.yaml
  text: She came to Jerusalem with a very great retinue[a], with camels carrying spices and very much gold and precious stones. She came to Solomon and spoke with him about all that was in her heart.
translation:
  language: de
  text: Sie kam mit einem sehr großen Gefolge[a] nach Jerusalem, mit Kamelen, die Gewürze, sehr viel Gold und Edelsteine trugen. Sie kam zu Salomo und sprach mit ihm über alles, was sie auf dem Herzen hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit sehr großem Reichtum“ beziehungsweise „mit einer sehr großen Truppe“. Das hebräische Wort kann Vermögen, Stärke, eine Streitmacht oder ein umfangreiches Gefolge bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחַיִל כָּבֵד מְאֹד
  choice: mit einem sehr großen Gefolge
  rationale: חַיִל kann Vermögen, Stärke, Streitmacht oder eine größere Personengruppe bezeichnen. Im Zusammenhang einer königlichen Reise gibt „Gefolge“ den eindrucksvollen Begleittross wieder, ohne ihn unnötig als militärische Macht festzulegen; כָּבֵד מְאֹד bezeichnet hier die außergewöhnliche Größe.
- source_word: גְּמַלִּים נֹשְׂאִים בְּשָׂמִים
  choice: Ihre Kamele trugen Gewürze
  rationale: Die partizipiale Konstruktion bezeichnet die Kamele als Lasttiere. Ein eigener deutscher Satz ist natürlich und lässt klar erkennen, dass auch die nachfolgend genannten Kostbarkeiten zur Ladung gehören.
- source_word: וְזָהָב רַב מְאֹד
  choice: sehr viel Gold
  rationale: Die Mengenangabe רַב מְאֹד wird direkt und idiomatisch wiedergegeben und bewahrt die starke Betonung des Reichtums.
- source_word: וְאֶבֶן יְקָרָה
  choice: Edelsteine
  rationale: Der hebräische Singular kann kollektiv gebraucht sein. Der deutsche Plural ist in dieser Aufzählung natürlich und vermeidet die irreführende Vorstellung eines einzigen Steins.
- source_word: וַתָּבֹא אֶל שְׁלֹמֹה
  choice: Sie kam zu Salomo
  rationale: Die Wiederholung von וַתָּבֹא markiert nach der Ankunft in Jerusalem den nächsten Erzählabschnitt, ihre persönliche Begegnung mit Salomo; sie bleibt daher auch im Deutschen erhalten.
- source_word: וַתְּדַבֵּר אֵלָיו
  choice: und sprach mit ihm
  rationale: „Sprach mit ihm“ ist im Zusammenhang der angekündigten schwierigen Fragen natürlich und lässt ein Gespräch zu, ohne mehr Gegenseitigkeit auszudrücken, als der hebräische Wortlaut verlangt.
- source_word: אֵת כָּל אֲשֶׁר הָיָה עִם לְבָבָהּ
  choice: über alles, was sie auf dem Herzen hatte
  rationale: Die Wendung bezeichnet ihre inneren Gedanken, Anliegen oder Fragen. „Auf dem Herzen haben“ ist eine natürliche, würdige deutsche Entsprechung und bewahrt die Bildsprache des Herzens.
