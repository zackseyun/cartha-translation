source:
  edition: WLC
  text: וְ/גַם֙ אֳנִ֣י חִירָ֔ם אֲשֶׁר נָשָׂ֥א זָהָ֖ב מֵ/אוֹפִ֑יר הֵבִ֨יא מֵ/אֹפִ֜יר עֲצֵ֧י אַלְמֻגִּ֛ים הַרְבֵּ֥ה מְאֹ֖ד וְ/אֶ֥בֶן יְקָרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/011.yaml
  text: Also[a], Hiram’s fleet, which carried gold from Ophir[b], brought from Ophir a very great quantity of almug wood and precious stones.
translation:
  language: de
  text: Auch[a] Hirams Flotte, die Gold aus Ofir transportierte, brachte aus Ofir Almugholz[b] in sehr großer Menge und Edelsteine mit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Auch Hirams Schiff“. Das hebräische Substantiv steht im Singular, kann hier aber kollektiv für Hirams Schiffe oder seinen Seetransport stehen.'
    reason: lexical_alternative
  - marker: b
    text: Die genaue Art des Almugholzes ist unbekannt; andernorts erscheint eine abweichende Form des hebräischen Namens.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Auch
  rationale: Gibt die ergänzende Verknüpfung mit dem vorausgehenden Bericht knapp und natürlich wieder.
- source_word: אֳנִי חִירָם
  choice: Hirams Flotte
  rationale: Das formal singularische אֳנִי kann hier kollektiv für Hirams Seetransport beziehungsweise Schiffsverband stehen; „Flotte“ ist im Deutschen natürlich, ohne die Stelle auf nur ein Schiff festzulegen.
- source_word: אֲשֶׁר נָשָׂא זָהָב
  choice: die Gold … transportierte
  rationale: נשׂא bezeichnet das Tragen oder Befördern; „transportierte“ passt präzise zum Transport einer Schiffsladung.
- source_word: מֵאוֹפִיר
  choice: aus Ofir
  rationale: Bewahrt die Herkunftsangabe und die übliche deutsche Form des Ortsnamens.
- source_word: הֵבִיא
  choice: brachte … mit
  rationale: Gibt den Hifil von בוא im Kontext einer von einer Reise eingebrachten Ladung idiomatisch wieder.
- source_word: עֲצֵי אַלְמֻגִּים
  choice: Almugholz
  rationale: Die genaue Baumart ist unsicher; die hebraisierende Bezeichnung vermeidet eine unbelegte botanische Festlegung.
- source_word: הַרְבֵּה מְאֹד
  choice: sehr große Mengen
  rationale: Gibt sowohl die Fülle als auch die Verstärkung durch מְאֹד deutlich und in Verbindung mit Holz idiomatisch wieder.
- source_word: וְאֶבֶן יְקָרָה
  choice: und Edelsteine
  rationale: Der morphologische Singular kann kollektiv gebraucht sein; im Deutschen ist der Plural in einer Aufzählung von Handelsgütern natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem Hebräischen, während „Flotte“, „transportierte“ und „brachte … mit“ einen natürlichen deutschen Ausdruck gewährleisten. Die botanische Unsicherheit bleibt ausdrücklich erhalten.
