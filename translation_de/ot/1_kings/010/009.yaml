source:
  edition: WLC
  text: יְהִ֨י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בָּר֔וּךְ אֲשֶׁר֙ חָפֵ֣ץ בְּ/ךָ֔ לְ/תִתְּ/ךָ֖ עַל כִּסֵּ֣א יִשְׂרָאֵ֑ל בְּ/אַהֲבַ֨ת יְהוָ֤ה אֶת יִשְׂרָאֵל֙ לְ/עֹלָ֔ם וַ/יְשִֽׂימְ/ךָ֣ לְ/מֶ֔לֶךְ לַ/עֲשׂ֥וֹת מִשְׁפָּ֖ט וּ/צְדָקָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/009.yaml
  text: Blessed be Yahweh your God[a], who delighted in you to set you on the throne of Israel. Because Yahweh loved Israel forever, he has made you king to administer justice and righteousness.
translation:
  language: de
  text: Gepriesen sei Jahwe, dein Gott, der Gefallen an dir hatte und dich auf den Thron Israels setzte. Weil Jahwe Israel für immer liebt,[a] hat er dich zum König eingesetzt, damit du Recht und Gerechtigkeit übst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Aus Jahwes ewiger Liebe zu Israel.“ Im Hebräischen steht „Liebe“ als Substantiv; die Wendung kann daher auch nominal wiedergegeben werden.'
    reason: lexikalische und syntaktische Alternative
lexical_decisions:
- source_word: יְהִי ... בָּרוּךְ
  choice: Gepriesen sei
  rationale: Die deutsche Segensformel bewahrt die jussivisch-optative Kraft der hebräischen Wendung und klingt zugleich würdig und natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben, nicht durch einen Titel ersetzt.
- source_word: אֲשֶׁר חָפֵץ בְּךָ
  choice: der Gefallen an dir hatte
  rationale: חפץ mit ב bezeichnet Wohlgefallen an einer Person; die Formulierung gibt die persönliche Zuwendung ohne unnötige Deutung wieder.
- source_word: לְתִתְּךָ עַל כִּסֵּא יִשְׂרָאֵל
  choice: und dich auf den Thron Israels setzte
  rationale: Die Wendung bezeichnet die Einsetzung in die Königsherrschaft und bewahrt das Thronbild. Das verbindende „und“ ergibt im Deutschen einen natürlichen Satzfluss.
- source_word: בְּאַהֲבַת יְהוָה אֶת יִשְׂרָאֵל לְעֹלָם
  choice: Weil Jahwe Israel für immer liebt
  rationale: Das vorangestellte ב wird kontextgemäß kausal verstanden. Die verbale Wiedergabe des hebräischen Liebesnomens ist im modernen Deutsch klar; die nominale Alternative wird in der Fußnote erhalten.
- source_word: וַיְשִׂימְךָ לְמֶלֶךְ
  choice: hat er dich zum König eingesetzt
  rationale: שים mit ל bezeichnet hier die königliche Einsetzung. Das Perfekt verbindet den vollzogenen Akt natürlich mit seiner gegenwärtigen Folge.
- source_word: לַעֲשׂוֹת מִשְׁפָּט וּצְדָקָה
  choice: damit du Recht und Gerechtigkeit übst
  rationale: Die Zweckangabe bleibt erhalten. „Recht und Gerechtigkeit üben“ gibt die königliche Aufgabe sachgerecht wieder und wahrt das hebräische Begriffspaar.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst; „Jahwe“ bewahrt seinen Charakter als Eigenname.
- issue: Sinn von בְּאַהֲבַת יְהוָה
  choice: 'kausal und verbal: „Weil Jahwe Israel für immer liebt“'
  alternative: 'nominal: „Aus Jahwes ewiger Liebe zu Israel“'
  rationale: Das ב kann hier den Grund für die Einsetzung Salomos angeben. Die verbale Fassung ist natürlich, während die Fußnote die engere nominale Struktur des Hebräischen sichtbar hält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die vertraute Paarformel „Recht und Gerechtigkeit“ bleibt erhalten; altertümliche oder konfessionell geprägte Ausdrucksweisen werden vermieden.
