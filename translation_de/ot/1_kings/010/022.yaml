source:
  edition: WLC
  text: כִּי֩ אֳנִ֨י תַרְשִׁ֤ישׁ לַ/מֶּ֨לֶךְ֙ בַּ/יָּ֔ם עִ֖ם אֳנִ֣י חִירָ֑ם אַחַת֩ לְ/שָׁלֹ֨שׁ שָׁנִ֜ים תָּב֣וֹא אֳנִ֣י תַרְשִׁ֗ישׁ נֹֽשְׂאֵת֙ זָהָ֣ב וָ/כֶ֔סֶף שֶׁנְהַבִּ֥ים וְ/קֹפִ֖ים וְ/תֻכִּיִּֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/022.yaml
  text: For the king had ships of Tarshish at sea with Hiram’s ships. Once every three years the ships of Tarshish would come, carrying gold and silver, ivory, apes, and peacocks.
translation:
  language: de
  text: Denn der König hatte zusammen mit den Schiffen Hirams eine Tarschisch-Flotte auf dem Meer. Einmal in drei Jahren kam die Tarschisch-Flotte und brachte Gold und Silber, Elfenbein, Affen und Pfauen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Bedeutung des hebräischen Wortes ist unsicher; möglicherweise sind andere exotische Vögel gemeint.
    reason: Das seltene Lehnwort תֻכִּיִּים lässt sich zoologisch nicht sicher bestimmen; „Pfauen“ ist die traditionelle Übersetzung.
lexical_decisions:
- source_word: אֳנִי תַרְשִׁישׁ
  choice: Tarschisch-Flotte
  rationale: Die Verbindung bezeichnet hier wahrscheinlich eine für Fernfahrten bestimmte Flotte bzw. Schiffe vom Tarschisch-Typ, nicht zwingend Schiffe mit Tarschisch als Ziel. Der kollektive Singular wird im Deutschen natürlich mit „Flotte“ wiedergegeben.
- source_word: שֶׁנְהַבִּים
  choice: Elfenbein
  rationale: Die Form bezeichnet Elfenbein; der deutsche Stoffname passt zur Aufzählung der Handelsgüter.
- source_word: קֹפִים
  choice: Affen
  rationale: Die Bedeutung gilt als hinreichend gesichert und wird mit dem üblichen deutschen Sammelbegriff wiedergegeben.
- source_word: תֻכִּיִּים
  choice: Pfauen
  rationale: Traditionelle und im Kontext exotischer Importgüter plausible Wiedergabe; die genaue Vogelart ist jedoch unsicher und wird deshalb angemerkt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nah am Hebräischen, wird aber idiomatisch geglättet. „Einmal in drei Jahren“ bewahrt die mögliche Bedeutung eines dreijährigen Fahrtzyklus.
