source:
  edition: WLC
  text: וְ/כָ֨ל הָ/אָ֔רֶץ מְבַקְשִׁ֖ים אֶת פְּנֵ֣י שְׁלֹמֹ֑ה לִ/שְׁמֹ֨עַ֙ אֶת חָכְמָת֔/וֹ אֲשֶׁר נָתַ֥ן אֱלֹהִ֖ים בְּ/לִבּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/024.yaml
  text: And all the earth sought the presence of Solomon[a], to hear his wisdom that God had put in his heart.
translation:
  language: de
  text: Und die ganze Erde suchte Salomos Gegenwart[a], um seine Weisheit zu hören, die Gott ihm ins Herz gegeben hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „suchte Salomos Angesicht“; eine hebräische Wendung dafür, seine Gegenwart oder eine Audienz bei ihm zu suchen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל הָ/אָרֶץ
  choice: Und die ganze Erde
  rationale: Bewahrt die umfassende, im königlichen Kontext hyperbolische Ausdrucksweise des Hebräischen. Gemeint sind die Völker der damals bekannten Welt, nicht nur das Land Israel.
- source_word: מְבַקְשִׁים
  choice: suchte
  rationale: Das Partizip bezeichnet ein fortdauerndes beziehungsweise wiederholtes Geschehen; im Deutschen gibt das Präteritum den zusammenfassenden Erzählstil natürlich wieder. Das kollektive Subjekt „die ganze Erde“ steht im Singular.
- source_word: אֶת פְּנֵי שְׁלֹמֹה
  choice: Salomos Gegenwart
  rationale: Der hebräische Ausdruck bedeutet wörtlich, Salomos Angesicht zu suchen, und bezeichnet den Wunsch, in seine Gegenwart zu gelangen beziehungsweise eine Audienz bei ihm zu erhalten. „Gegenwart“ bewahrt etwas von der Bildsprache, ohne unverständlich zu sein.
- source_word: לִשְׁמֹעַ
  choice: um … zu hören
  rationale: Der Infinitiv bezeichnet den Zweck des Aufsuchens; „hören“ entspricht der Grundbedeutung und passt zur Weisheit Salomos.
- source_word: חָכְמָת/וֹ
  choice: seine Weisheit
  rationale: Die Possessivkonstruktion gibt das hebräische Suffix unmittelbar wieder.
- source_word: אֲשֶׁר נָתַן אֱלֹהִים
  choice: die Gott … gegeben hatte
  rationale: נָתַן bedeutet „geben“. Das Plusquamperfekt verdeutlicht natürlich, dass Gott Salomo die Weisheit bereits vor dem beschriebenen Aufsuchen gegeben hatte.
- source_word: בְּ/לִבּ/וֹ
  choice: ihm ins Herz
  rationale: „Herz“ bewahrt die hebräische Vorstellung vom inneren Menschen einschließlich Denken und Wollen; „ins Herz geben“ ist im Deutschen verständlich und bleibt nahe am Ausgangstext.
theological_decisions:
- issue: Wiedergabe von אֱלֹהִים
  choice: Gott
  alternative: der HERR
  rationale: Im Vers steht אֱלֹהִים und nicht der Gottesname JHWH. „Gott“ bewahrt diese lexikalische Unterscheidung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die bewusst weit gefasste Rede von der „ganzen Erde“ und das anthropologische Bild vom „Herz“ bleiben erhalten; die ungewöhnliche Formulierung „Salomos Gegenwart suchen“ wird durch eine Fußnote erläutert.
