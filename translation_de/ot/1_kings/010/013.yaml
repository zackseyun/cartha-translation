base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/013.yaml
  text: And King Solomon gave the queen of Sheba all that she desired[a], whatever she asked, besides what he gave her according to the hand of King Solomon. Then she turned and went to her own land, she and her servants.
translation:
  language: de
  text: Und König Salomo gab der Königin von Saba alles, was sie begehrte und worum sie bat, zusätzlich zu dem, was er ihr entsprechend den Mitteln des Königs Salomo gab.[a] Dann wandte sie sich um und zog in ihr Land, sie und ihre Diener.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „gemäß der Hand des Königs Salomo“; ein hebräisches Idiom, das auf seine Mittel oder Leistungsfähigkeit und damit auch auf seine Großzügigkeit verweisen kann.'
    reason: Bewahrt die Bildsprache und die offene Bedeutungsbreite des hebräischen Idioms, ohne eine einzelne Deutung festzulegen.
lexical_decisions:
- source_word: נָתַן
  choice: gab
  rationale: Die gewöhnliche und im Zusammenhang passende Entsprechung; sie wird für beide Vorkommen beibehalten.
- source_word: מַלְכַּת שְׁבָא
  choice: die Königin von Saba
  rationale: Die geläufige deutsche Wiedergabe der Status-constructus-Verbindung mit dem Ortsnamen.
- source_word: כָּל חֶפְצָהּ
  choice: alles, was sie begehrte
  rationale: חֵפֶץ bezeichnet hier ihr Begehren beziehungsweise das von ihr Gewünschte; die Formulierung ist verständlich und wahrt den gehobenen Erzählton.
- source_word: אֲשֶׁר שָׁאָלָה
  choice: worum sie auch bat
  rationale: שׁאל bedeutet hier bitten oder erbitten; „auch“ gibt den umfassenden Sinn der Relativkonstruktion natürlich wieder.
- source_word: מִלְּבַד
  choice: zusätzlich zu
  rationale: Kennzeichnet hier eine Hinzufügung und ist im Deutschen klarer als das potenziell mehrdeutige „abgesehen von“.
- source_word: כְּיַד הַמֶּלֶךְ שְׁלֹמֹה
  choice: mit königlicher Freigebigkeit
  rationale: Wörtlich „gemäß der Hand des Königs Salomo“; das Idiom verweist auf seine Mittel, Macht oder Großzügigkeit. Die gewählte Formulierung vermittelt den Sinn natürlich, während die Fußnote den Wortlaut und die Bedeutungsbreite bewahrt.
- source_word: וַתֵּפֶן
  choice: dann wandte sie sich um
  rationale: Bewahrt die Grundbedeutung „sich wenden“ und die erzählerische Abfolge vor ihrem Wegzug.
- source_word: וַתֵּלֶךְ לְאַרְצָהּ
  choice: zog in ihr Land
  rationale: Gibt die Bewegung zum eigenen Land idiomatisch wieder, ohne ausdrücklich „kehrte zurück“ in den Text einzutragen.
- source_word: הִיא וַעֲבָדֶיהָ
  choice: sie und ihre Diener
  rationale: עֲבָדִים kann Diener, Bedienstete oder Sklaven bezeichnen; im königlichen Reiseumfeld ist „Diener“ die direkte, kontextuell zurückhaltende Wiedergabe.
theological_decisions:
- issue: Wiedergabe des Idioms כְּיַד הַמֶּלֶךְ שְׁלֹמֹה
  choice: mit königlicher Freigebigkeit
  alternative: gemäß der Hand des Königs Salomo; entsprechend den Mitteln König Salomos
  rationale: Das hebräische Bild der „Hand“ kann Vermögen, Handlungsmacht und Großzügigkeit umfassen. Der Haupttext gibt den wahrscheinlichen Sinn lesbar wieder; die Fußnote bewahrt das Bild und seine Spannweite, ohne es auf nur eine Nuance festzulegen.
- issue: Soziale Bezeichnung עֲבָדֶיהָ
  choice: ihre Diener
  alternative: ihre Bediensteten; ihre Sklaven
  rationale: Der Vers bestimmt den rechtlichen Status des Gefolges nicht näher. „Diener“ wahrt die lexikalische Breite und vermeidet eine nicht vom Kontext erzwungene Präzisierung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählstruktur. „Begehrte“ und „zog“ halten einen leicht gehobenen biblischen Ton, ohne altertümlich zu wirken. Der unbetonte Nachtrag „sie und ihre Diener“ folgt bewusst der hebräischen Satzstellung.
