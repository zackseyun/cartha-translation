  source_fidelity: 'Der Vers wird insgesamt zutreffend wiedergegeben: Salomo gibt der Königin von Saba alles Erbetene; anschließend bricht sie mit ihrem Gefolge in ihr Land auf. Die Wiedergabe von כְּיַד הַמֶּלֶךְ שְׁלֹמֹה als „mit königlicher Freigebigkeit“ verengt jedoch das hebräische Idiom auf Großzügigkeit und lässt den ausdrücklich genannten König Salomo im Haupttext entfallen. Das Idiom kann auch auf Mittel bzw. Leistungsfähigkeit verweisen.'
  naturalness: Der Erzählton ist flüssig und modernes, würdiges Standarddeutsch. „Dann wandte sie sich um und zog in ihr Land“ bewahrt die Abfolge der zwei hebräischen Verben angemessen. Die Reihung „alles, was sie begehrte, worum sie auch bat“ ist verständlich, doch „auch“ kann im Deutschen additiv wirken, während es im Hebräischen die nähere Bestimmung von „alles, was sie begehrte“ einleitet.
  terminology: „Königin von Saba“, „Salomo“ und „ihre Diener“ sind sachgerecht. Für כְּיַד הַמֶּלֶךְ שְׁלֹמֹה ist eine Formulierung vorzuziehen, die weder allein „Großzügigkeit“ noch allein „Macht“ festlegt und die königlichen Mittel als naheliegende idiomatische Bedeutung erkennen lässt.
