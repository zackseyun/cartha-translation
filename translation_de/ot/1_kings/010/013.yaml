  to: Und König Salomo gab der Königin von Saba alles, was sie begehrte und worum sie bat, zusätzlich zu dem, was er ihr entsprechend den Mitteln des Königs Salomo gab.[a] Dann wandte sie sich um und zog in ihr Land, sie und ihre Diener.
