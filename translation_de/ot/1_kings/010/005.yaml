  text: וּ/מַאֲכַ֣ל שֻׁלְחָנ֡/וֹ וּ/מוֹשַׁ֣ב עֲבָדָי/ו֩ וּ/מַעֲמַ֨ד משרת/ו וּ/מַלְבֻּֽשֵׁי/הֶם֙ וּ/מַשְׁקָ֔י/ו וְ/עֹ֣לָת֔/וֹ אֲשֶׁ֥ר יַעֲלֶ֖ה בֵּ֣ית יְהוָ֑ה וְ/לֹא הָ֥יָה בָ֛/הּ ע֖וֹד רֽוּחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/005.yaml
  text: the food of his table[a], the seating of his servants, the attendance of his ministers, their clothing, his cupbearers, and his burnt offering that he offered at the house of Yahweh, there was no more breath in her.
translation:
  language: de
  text: die Speisen auf seiner Tafel, die Sitzordnung seiner Diener, das Aufwarten seiner Bediensteten und ihre Gewänder, seine Mundschenken und sein Brandopfer, das er im Haus Jahwes darbrachte[a] – da blieb ihr der Atem weg.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sein Aufgang zum Haus Jahwes“, möglicherweise die Treppe oder der feierliche Zug seines Hinaufgehens.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַאֲכַל שֻׁלְחָנוֹ
  choice: die Speisen auf seiner Tafel
  rationale: מַאֲכָל bezeichnet Speise oder Nahrung. Die Wendung gibt das konkrete Bild der reich gedeckten königlichen Tafel natürlich und quellennah wieder.
- source_word: מוֹשַׁב עֲבָדָיו
  choice: die Sitzordnung seiner Diener
  rationale: מוֹשָׁב kann das Sitzen, einen Sitz oder eine Anordnung bezeichnen. Im höfischen Zusammenhang trifft „Sitzordnung“ die geordnete Platzierung der Diener.
- source_word: מַעֲמַד מְשָׁרְתָיו
  choice: das Aufwarten seiner Bediensteten
  rationale: מַעֲמָד bezeichnet hier ihre Stellung beziehungsweise ihr Antreten, während מְשָׁרְתָיו die im Dienst stehenden Funktionsträger meint. „Aufwarten“ verbindet ihre geordnete Präsenz mit ihrer Dienstfunktion.
- source_word: מַלְבֻּשֵׁיהֶם
  choice: ihre Gewänder
  rationale: Das Wort bezeichnet Kleidung; „Gewänder“ passt zum würdevollen höfischen Kontext, ohne altertümlich unverständlich zu sein.
- source_word: מַשְׁקָיו
  choice: seine Mundschenken
  rationale: Im königlichen Zusammenhang sind damit am ehesten die für das Ausschenken zuständigen Amtsträger gemeint, nicht lediglich Getränke.
- source_word: עֹלָתוֹ אֲשֶׁר יַעֲלֶה בֵּית יְהוָה
  choice: sein Brandopfer, das er im Haus Jahwes darbrachte
  rationale: Die masoretische Vokalisierung עֹלָתוֹ bezeichnet sein Brandopfer. Das Verb wird im Deutschen kontextgemäß mit „darbrachte“ wiedergegeben; die mögliche Lesart als Aufgang oder Hinaufgehen bleibt in der Fußnote erhalten.
- source_word: בֵּית יְהוָה
  choice: das Haus Jahwes
  rationale: „Haus“ bewahrt die konkrete hebräische Bezeichnung, während „Jahwe“ den Gottesnamen יהוה als Eigennamen wiedergibt.
- source_word: וְלֹא הָיָה בָּהּ עוֹד רוּחַ
  choice: da blieb ihr der Atem weg
  rationale: Die deutsche Redewendung bewahrt das Bild von רוּחַ als Atem und vermittelt idiomatisch ihre überwältigte Bestürzung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen ausdrücklich. Die übliche deutsche Form „Jahwe“ gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Deutung von עֹלָתוֹ im höfisch-kultischen Verzeichnis
  choice: sein Brandopfer
  alternative: sein Aufgang beziehungsweise der Aufgang, auf dem er zum Haus Jahwes hinaufging
  rationale: Die masoretische Vokalisierung stützt „Brandopfer“. Da die Konsonanten auch mit einem Aufgang oder Hinaufgehen in Verbindung gebracht worden sind und alte Textzeugen beziehungsweise Parallelüberlieferungen Anlass zu dieser Deutung geben, wird die echte Auslegungsfrage in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die höfische Aufzählung bleibt kompakt; „Mundschenken“ und „Gewänder“ tragen dem königlichen Register Rechnung. Die Schlusswendung ist idiomatisch, bewahrt aber das hebräische Atembild.
