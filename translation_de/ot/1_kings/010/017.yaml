base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/017.yaml
  text: and three hundred shields of beaten gold[a]; three minas of gold went onto each shield[c][b]. And the king put them in the House of the Forest of Lebanon.
translation:
  language: de
  text: Dazu ließ er dreihundert Schilde aus gehämmertem Gold[a] anfertigen; für jeden Schild wurden drei Minen Gold verwendet[b]. Der König brachte sie in das Haus des Libanonwaldes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus ausgeschlagenem Gold“ beziehungsweise „aus dünn ausgeschlagenem Gold“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Drei Minen Gold gingen auf den einen Schild hinauf“; gemeint ist die Goldmenge, die jeweils auf einen Schild aufgebracht wurde.'
    reason: lexical_alternative
  - marker: c
    text: Das Haus des Libanonwaldes war der Name eines königlichen Gebäudes innerhalb von Salomos Palastanlage; es könnte auch als Waffenlager gedient haben. Siehe 1. Könige 7,2.
    reason: cross_reference
lexical_decisions:
- source_word: מָגִנִּים
  choice: Schilde
  rationale: מָגֵן bezeichnet hier die größeren Schilde und steht im Kontext im Unterschied zu den kleineren Schildformen des vorigen Verses. Das allgemein verständliche „Schilde“ gibt dies im Deutschen angemessen wieder.
- source_word: זָהָב שָׁחוּט
  choice: ausgeschlagenes Gold
  rationale: שָׁחוּט bezeichnet durch Hämmern beziehungsweise Ausschlagen dünn verarbeitetes Gold. „Ausgeschlagenes Gold“ bewahrt den handwerklichen Sinn und klingt im Deutschen natürlich.
- source_word: שְׁלֹשֶׁת מָנִים
  choice: drei Minen
  rationale: מָנֶה ist eine Gewichtseinheit. „Mine“ ist die etablierte deutsche Wiedergabe der antiken Einheit und vermeidet eine unbegründete Umrechnung.
- source_word: יַעֲלֶה עַל
  choice: kamen auf
  rationale: Die hebräische Wendung besagt wörtlich, dass das Gold „auf“ den Schild hinaufkam, und bezeichnet die je Schild aufgebrachte Menge. „Kamen auf“ erhält das konkrete Bild, ohne eine bestimmte Herstellungstechnik stärker festzulegen.
- source_word: הַמָּגֵן הָאֶחָת
  choice: jeden Schild
  rationale: Die formal singularische Wendung „der eine Schild“ wird distributiv gebraucht. „Jeden Schild“ ist die natürliche deutsche Entsprechung.
- source_word: וַיִּתְּנֵם
  choice: brachte sie
  rationale: נתן kann „geben, setzen, legen“ bedeuten. Im Zusammenhang bezeichnet es die Unterbringung der Schilde in einem Gebäude; „brachte sie“ ist idiomatisch und lässt die genaue Art ihrer Aufstellung offen.
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: das Libanonwaldhaus
  rationale: Die Wortverbindung ist der Eigenname eines königlichen Gebäudes. „Libanonwaldhaus“ ist eine knappe, im Deutschen verständliche Namensform und bewahrt alle Bestandteile des Hebräischen.
