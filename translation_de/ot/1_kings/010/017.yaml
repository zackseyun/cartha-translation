translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzverbindung „Dazu“ bindet den Vers an die Herstellung der Schilde im vorigen Vers. Die antike Gewichtseinheit bleibt unkonvertiert; die konkrete, etwas ungewöhnliche hebräische Mengenformel wird im Haupttext idiomatisch und in der Fußnote wörtlicher wiedergegeben.
