  text: לְ/בַד֙ מֵ/אַנְשֵׁ֣י הַ/תָּרִ֔ים וּ/מִסְחַ֖ר הָ/רֹכְלִ֑ים וְ/כָל מַלְכֵ֥י הָ/עֶ֖רֶב וּ/פַח֥וֹת הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/015.yaml
  text: besides what came from the traveling merchants and from the trade of the merchants[c][b][a], and from all the kings of Arabia and the governors of the land.
translation:
  language: de
  text: Dazu kam noch, was von den umherziehenden Händlern[a] und aus dem Handel der Kaufleute einging, sowie von allen Königen Arabiens[b] und den Statthaltern[c] des Landes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von den Männern, die umherzogen“. Die hebräische Wendung ist schwierig und kann allgemein umherreisende Händler bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „von allen Königen der Mischvölker“. Das hebräische Wort עֶרֶב kann in manchen Zusammenhängen diese Bedeutung haben; hier passt „Arabien“ jedoch wahrscheinlich besser.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: „Provinzstatthaltern“ beziehungsweise „Gouverneuren“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַד
  choice: Dazu kam noch
  rationale: Die Wendung ergänzt die zuvor genannte Summe um weitere Einnahmequellen. Im Deutschen stellt „Dazu kam noch“ diesen additiven Sinn natürlich und klar heraus.
- source_word: מֵאַנְשֵׁי הַתָּרִים
  choice: was von den umherziehenden Händlern einging
  rationale: Die schwierige Formulierung bezeichnet wahrscheinlich umherreisende Personen, im wirtschaftlichen Zusammenhang wohl Händler. „Was … einging“ gibt die im Hebräischen aus dem Kontext zu ergänzende Einnahme wieder.
- source_word: וּמִסְחַר הָרֹכְלִים
  choice: und aus dem Handel der Kaufleute
  rationale: מִסְחַר bezeichnet Handel oder Handelsverkehr, רֹכְלִים handeltreibende Kaufleute. Die Wiedergabe bewahrt die eigenständige zweite Handelsquelle des hebräischen Textes.
- source_word: וְכָל מַלְכֵי הָעֶרֶב
  choice: sowie von allen Königen Arabiens
  rationale: עֶרֶב ist in dieser geopolitischen Aufzählung am ehesten als Arabien beziehungsweise dessen Völkergebiet zu verstehen. Die mögliche Bedeutung „Mischvölker“ bleibt in der Fußnote erhalten.
- source_word: וּפַחוֹת הָאָרֶץ
  choice: und den Statthaltern des Landes
  rationale: פַחוֹת bezeichnet regionale Amtsträger unter einer übergeordneten Herrschaft. „Statthalter“ ist historisch angemessen, ohne den Ausdruck zu eng als persischen Amtstitel festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die durch den Zusammenhang vorausgesetzten Einnahmen werden mit „was … einging“ ausdrücklich gemacht; die Unsicherheit der schwierigen Handelsbezeichnung und die Mehrdeutigkeit von עֶרֶב werden in den Fußnoten bewahrt.
