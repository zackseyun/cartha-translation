base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/007.yaml
  text: But I did not believe the reports until I came and my own eyes saw it; and behold[a], not even half was told to me. You have surpassed the report that I heard in wisdom and prosperity.
translation:
  language: de
  text: Doch ich glaubte den Berichten nicht, bis ich kam und es mit eigenen Augen sah. Und siehe, nicht einmal die Hälfte war mir berichtet worden. Du hast die Kunde, die ich gehört hatte, an Weisheit und Wohlergehen[a] übertroffen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Du hast die Kunde, die ich gehört hatte, an Weisheit und Reichtum übertroffen.“ Das hebräische Wort טוֹב kann allgemeines Wohlergehen oder Gedeihen bezeichnen und hier den Reichtum als Teil von Salomos Erfolg einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאֱמַנְתִּי
  choice: ich glaubte … nicht
  rationale: Das Hifil von אמן bezeichnet hier, etwas für wahr oder glaubwürdig zu halten. „Glaubte“ gibt die Reaktion der Königin ohne zusätzliche emotionale Färbung wieder.
- source_word: לַדְּבָרִים
  choice: den Berichten
  rationale: Wörtlich sind es „Worte“ oder „Dinge“; im Zusammenhang geht es um das, was über Salomo erzählt worden war. „Berichte“ ist im Deutschen natürlich und sinngenau.
- source_word: וַתִּרְאֶינָה עֵינַי
  choice: es mit eigenen Augen sah
  rationale: Die hebräische Wendung lautet wörtlich „meine Augen sahen“. Die deutsche Redewendung bringt den Nachdruck auf die persönliche Anschauung angemessen zum Ausdruck.
- source_word: וְהִנֵּה
  choice: Und siehe
  rationale: Der Diskursmarker hebt die überraschende Feststellung hervor. „Und siehe“ bewahrt seinen feierlichen, rhetorischen Nachdruck.
- source_word: לֹא הֻגַּד לִי הַחֵצִי
  choice: nicht einmal die Hälfte war mir berichtet worden
  rationale: Die idiomatische Formulierung unterstreicht, dass die zuvor gehörten Berichte Salomos Größe bei Weitem nicht vollständig wiedergaben.
- source_word: הוֹסַפְתָּ … אֶל
  choice: übertriffst du
  rationale: יסף bezeichnet in dieser Vergleichskonstruktion ein Hinausgehen über das Gehörte. Das deutsche Präsens beschreibt den nun festgestellten Zustand natürlich; die vorangehende Wahrnehmung bleibt durch die Vergangenheitsformen markiert.
- source_word: חָכְמָה וָטוֹב
  choice: an Weisheit und Wohlergehen
  rationale: חָכְמָה bedeutet „Weisheit“. טוֹב bezeichnet hier im Umfeld königlicher Pracht umfassendes Wohlergehen beziehungsweise Gedeihen und kann Reichtum einschließen, ohne darauf beschränkt zu sein.
- source_word: הַשְּׁמוּעָה אֲשֶׁר שָׁמָעְתִּי
  choice: die Kunde, die ich gehört hatte
  rationale: שְׁמוּעָה bezeichnet eine gehörte Nachricht oder Kunde. „Kunde“ passt zum würdevollen Erzählregister; das Plusquamperfekt verdeutlicht, dass sie diese Nachricht vor ihrer Reise gehört hatte.
