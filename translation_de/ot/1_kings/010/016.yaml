  text: וַ/יַּ֨עַשׂ הַ/מֶּ֧לֶךְ שְׁלֹמֹ֛ה מָאתַ֥יִם צִנָּ֖ה זָהָ֣ב שָׁח֑וּט שֵׁשׁ מֵא֣וֹת זָהָ֔ב יַעֲלֶ֖ה עַל הַ/צִּנָּ֥ה הָ/אֶחָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/016.yaml
  text: King Solomon made two hundred large shields of beaten gold[b][a]; six hundred shekels of gold went onto each shield.
translation:
  language: de
  text: König Salomo fertigte zweihundert Großschilde aus gehämmertem Gold an.[a] Für jeden Schild wurden sechshundert Schekel Gold verwendet.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet einen großen Schild, wahrscheinlich im Unterschied zu den kleineren Schilden im folgenden Vers.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Sechshundert Gold kamen auf den einen Schild.« Die Gewichtseinheit »Schekel« ist im Hebräischen nur mitgedacht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ließ … anfertigen
  rationale: Das Verb עשה bezeichnet hier die Herstellung. Die kausative deutsche Formulierung ist bei einem König natürlich und behauptet nicht, Salomo habe die Schilde eigenhändig gefertigt.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: König Salomo
  rationale: Die übliche deutsche Verbindung von Titel und Eigenname gibt den hebräischen Ausdruck klar und knapp wieder.
- source_word: מָאתַיִם
  choice: zweihundert
  rationale: Direkte Wiedergabe der Kardinalzahl.
- source_word: צִנָּה
  choice: Großschilde
  rationale: צִנָּה bezeichnet wahrscheinlich einen großen, den Körper weitgehend deckenden Schild und unterscheidet sich von מָגֵן im folgenden Vers.
- source_word: זָהָב שָׁחוּט
  choice: gehämmertem Gold
  rationale: שָׁחוּט bezeichnet hier durch Schlagen beziehungsweise Hämmern bearbeitetes, vermutlich dünn ausgeschlagenes Gold.
- source_word: שֵׁשׁ מֵאוֹת זָהָב
  choice: sechshundert Schekel Gold
  rationale: Im Hebräischen fehlt die Maßeinheit; aus der Gewichtskonstruktion wird gewöhnlich Schekel ergänzt. Die Ergänzung wird durch eine Fußnote kenntlich gemacht.
- source_word: יַעֲלֶה עַל
  choice: wurden … verwendet
  rationale: Wörtlich bedeutet die Wendung etwa »kamen auf«. Die gewählte Formulierung gibt im Deutschen idiomatisch die für jeden Schild eingesetzte Goldmenge an, ohne eine bestimmte Herstellungstechnik festzulegen.
- source_word: הַצִּנָּה הָאֶחָת
  choice: für jeden Schild
  rationale: 'Der wörtliche Ausdruck »auf den einen Schild« hat hier distributiven Sinn: Die genannte Menge gilt jeweils für einen der zweihundert Schilde.'
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Großschilde« bewahrt die lexikalische Unterscheidung zum folgenden Vers; »ließ … anfertigen« klingt natürlich und vermeidet die unbeabsichtigte Aussage, der König habe selbst handwerklich gearbeitet. Die ergänzte Maßeinheit wird transparent ausgewiesen.
