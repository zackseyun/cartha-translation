  text: אַשְׁרֵ֣י אֲנָשֶׁ֔י/ךָ אַשְׁרֵ֖י עֲבָדֶ֣י/ךָ אֵ֑לֶּה הָֽ/עֹמְדִ֤ים לְ/פָנֶ֨י/ךָ֙ תָּמִ֔יד הַ/שֹּׁמְעִ֖ים אֶת חָכְמָתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/008.yaml
  text: Blessed are your men; blessed are these your servants, who stand before you continually and hear your wisdom.
translation:
  language: de
  text: Wie glücklich sind deine Männer! Wie glücklich sind diese deine Diener, die ständig vor dir stehen und deine Weisheit hören!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Wie glücklich sind
  rationale: Die Wendung preist einen beneidenswert guten Zustand. „Wie glücklich sind“ gibt den Ausruf natürlich und würdevoll wieder, ohne ausdrücklich einen göttlichen Segensakt zu behaupten.
- source_word: אֲנָשֶׁיךָ
  choice: deine Männer
  rationale: Der maskuline Plural bezeichnet hier am ehesten die Männer am königlichen Hof; die Wiedergabe bewahrt die Geschlechtsspezifik des Hebräischen.
- source_word: עֲבָדֶיךָ
  choice: deine Diener
  rationale: Im höfischen Zusammenhang sind damit Personen im Dienst des Königs gemeint. „Diener“ lässt den genauen sozialen Status offen und passt zum Kontext.
- source_word: אֵלֶּה
  choice: diese
  rationale: Das proximale Demonstrativpronomen hebt die anwesenden Diener hervor.
- source_word: הָעֹמְדִים לְפָנֶיךָ
  choice: die vor dir stehen
  rationale: Die konkrete höfische Wendung wird bewahrt; sie schließt den Sinn des Aufwartens und Dienstes ein, ohne ihn erläuternd in den Text einzutragen.
- source_word: תָּמִיד
  choice: ständig
  rationale: Das Wort bezeichnet hier die fortgesetzte oder regelmäßige Anwesenheit. „Ständig“ ist in modernem Deutsch natürlich und muss nicht mathematisch ausnahmslos verstanden werden.
- source_word: הַשֹּׁמְעִים
  choice: und ... hören
  rationale: Das zweite Partizip beschreibt dieselben Diener. Die koordinierte deutsche Form ist flüssig und erhält den Vorgang des Hörens.
- source_word: חָכְמָתֶךָ
  choice: deine Weisheit
  rationale: Die knappe Form entspricht dem direkten Objekt im Hebräischen und vermeidet eine nicht ausdrücklich genannte Ergänzung wie „deine weisen Worte“.
theological_decisions:
- issue: Bedeutungsumfang von אַשְׁרֵי
  choice: Wie glücklich sind
  alternative: Gesegnet sind / Wohl denen
  rationale: Der Ausdruck bezeichnet einen beneidenswerten Zustand des Wohlergehens, ohne grammatisch zu sagen, wer segnet. Die gewählte Form bewahrt diese Offenheit und klingt im heutigen Deutsch als Ausruf natürlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweifache Ausrufstruktur des Hebräischen bleibt erhalten; die höfische Bildsprache wird nicht paraphrasiert.
