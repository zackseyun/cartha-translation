  text: וְ֠/כֹל כְּלֵ֞י מַשְׁקֵ֨ה הַ/מֶּ֤לֶךְ שְׁלֹמֹה֙ זָהָ֔ב וְ/כֹ֗ל כְּלֵ֛י בֵּֽית יַ֥עַר הַ/לְּבָנ֖וֹן זָהָ֣ב סָג֑וּר אֵ֣ין כֶּ֗סֶף לֹ֥א נֶחְשָׁ֛ב בִּ/ימֵ֥י שְׁלֹמֹ֖ה לִ/מְאֽוּמָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/021.yaml
  text: All King Solomon’s drinking vessels were gold[a], and all the vessels of the House of the Forest of Lebanon were pure gold[b]. Silver was not considered anything in the days of Solomon.
translation:
  language: de
  text: Alle Trinkgefäße des Königs Salomo waren aus Gold, und alle Gefäße des Hauses des Libanonwaldes waren aus reinem Gold.[a] Silber galt zur Zeit Salomos nichts.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus geläutertem Gold“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Silber wurde in den Tagen Salomos für nichts geachtet.“'
    reason: literal_rendering
lexical_decisions:
- source_word: כְּלֵי מַשְׁקֵה
  choice: Trinkgefäße
  rationale: Der Ausdruck bezeichnet allgemein Gefäße beziehungsweise Geräte, die zum Trinken dienen. „Trinkgefäße“ bewahrt diese Breite, ohne auf Becher einzuengen.
- source_word: זָהָב
  choice: Gold
  rationale: Die direkte Materialbezeichnung gibt den wiederholten Hinweis auf Salomos Reichtum klar wieder.
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: Libanonwaldhaus
  rationale: Die kompakte deutsche Bezeichnung bewahrt den eigennamenartigen Charakter des wörtlich so genannten „Hauses des Libanonwaldes“ und vermeidet die erklärende Einengung auf „Palast“.
- source_word: זָהָב סָגוּר
  choice: reines Gold
  rationale: Die seltene Verbindung bezeichnet wahrscheinlich hochwertiges beziehungsweise geläutertes Gold. „Reines Gold“ ist natürliches Deutsch; die mögliche Wiedergabe „geläutertes Gold“ wird in der Fußnote erhalten.
- source_word: לֹא נֶחְשָׁב ... לִמְאוּמָה
  choice: galt ... nichts
  rationale: 'Die hebräische Wendung drückt eine Wertung aus: Silber war nicht buchstäblich abwesend, sondern wurde angesichts des Goldreichtums als bedeutungslos angesehen.'
- source_word: בִּימֵי שְׁלֹמֹה
  choice: zur Zeit Salomos
  rationale: Dies ist eine natürliche moderne Wiedergabe der üblichen hebräischen Zeitangabe „in den Tagen Salomos“.
