base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/027.yaml
  text: The king made silver as common in Jerusalem as stones[b][a], and he made cedars as plentiful as the sycamore trees that are in the Shephelah.
translation:
  language: de
  text: Der König machte das Silber in Jerusalem so gewöhnlich wie Steine und die Zedern so zahlreich wie die Maulbeerfeigenbäume[a] in der Schefela[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Sykomoren“; gemeint sind Maulbeerfeigenbäume.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „im Niederland“. Die Schefela ist die judäische Region zwischen dem Bergland und der Küstenebene.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתֵּן / נָתַן
  choice: machte ... so gewöhnlich / so zahlreich
  rationale: נתן bedeutet wörtlich „geben/setzen“, drückt hier aber idiomatisch aus, dass der König Silber alltäglich und Zedern in großer Menge verfügbar machte. Die deutsche Konstruktion bewahrt den verursachenden Sinn.
- source_word: הַמֶּלֶךְ
  choice: Der König
  rationale: Der hebräische Text nennt ihn in diesem Vers nur „den König“; der Kontext identifiziert ihn als Salomo.
- source_word: הַכֶּסֶף
  choice: das Silber
  rationale: Die Stoffbezeichnung bezeichnet Silber allgemein als wertvolles Material.
- source_word: בִּירוּשָׁלִַם
  choice: in Jerusalem
  rationale: Direkte Ortsangabe.
- source_word: כָּאֲבָנִים
  choice: so gewöhnlich wie Steine
  rationale: כ markiert den Vergleich. „Gewöhnlich“ macht den idiomatischen Gedanken verständlich, dass Silber so alltäglich verfügbar wurde wie Steine.
- source_word: הָאֲרָזִים
  choice: die Zedern
  rationale: Der Plural bezeichnet Zedern und kann im Zusammenhang zugleich das von ihnen gewonnene Bauholz einschließen; die Übersetzung hält die konkrete Baumbezeichnung fest.
- source_word: כַּשִּׁקְמִים
  choice: wie die Maulbeerfeigenbäume
  rationale: שקמים sind Sykomoren beziehungsweise Maulbeerfeigenbäume, nicht die im heutigen Deutschen oft mit „Bergahorn“ verbundene englische sycamore. Die gewählte Bezeichnung ist botanisch und regional sachgerecht.
- source_word: אֲשֶׁר בַּשְּׁפֵלָה
  choice: in der Schefela
  rationale: שפלה ist hier der Name der judäischen Hügelland- und Niederungszone zwischen Bergland und Küstenebene. Der Eigenname erhält die geografische Genauigkeit.
- source_word: לָרֹב
  choice: so zahlreich
  rationale: Die Wendung bezeichnet große Menge und vervollständigt im Deutschen natürlich den Vergleich der Zedern mit den verbreiteten Maulbeerfeigenbäumen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur gibt die beiden Vergleiche des Hebräischen klar wieder. Fachlich weniger eindeutiges „Sykomore“ wird im Haupttext durch das verständlichere „Maulbeerfeigenbaum“ ersetzt und in einer Fußnote dokumentiert; der geografische Eigenname „Schefela“ bleibt erhalten und wird erläutert.
