  text: וַ/יַּ֧עַשׂ הַ/מֶּ֛לֶךְ כִּסֵּא שֵׁ֖ן גָּד֑וֹל וַ/יְצַפֵּ֖/הוּ זָהָ֥ב מוּפָֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/018.yaml
  text: Then the king made a great ivory throne and overlaid it with refined gold[a].
translation:
  language: de
  text: Dann ließ der König einen großen Thron aus Elfenbein anfertigen und überzog ihn mit geläutertem Gold[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „reinem Gold“ oder „feinem Gold“.'
    reason: Lexikalische Alternativen für מוּפָז, dessen genaue Nuance nicht sicher feststeht.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Dann ließ ... anfertigen
  rationale: Das Wayyiqtol führt die Erzählung weiter. Im Zusammenhang eines königlichen Kunstwerks gibt die kausative deutsche Formulierung natürlich wieder, dass der König dessen Herstellung veranlasste, ohne zu behaupten, er habe es eigenhändig gefertigt.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Der bestimmte Ausdruck bezeichnet im Kontext Salomo; die direkte Wiedergabe ist eindeutig.
- source_word: כִּסֵּא
  choice: Thron
  rationale: Im königlichen Kontext bezeichnet das Wort den Herrschersitz, nicht bloß einen Stuhl.
- source_word: שֵׁן
  choice: aus Elfenbein
  rationale: שֵׁן bedeutet wörtlich Zahn, bezeichnet in Materialangaben jedoch Elfenbein. Die Präposition „aus“ macht die attributive Materialangabe im Deutschen natürlich verständlich.
- source_word: גָּדוֹל
  choice: großen
  rationale: „Groß“ kann sowohl die Ausmaße als auch die Pracht des Thrones ausdrücken und wahrt damit die Bedeutungsbreite.
- source_word: וַיְצַפֵּהוּ
  choice: und überzog ihn
  rationale: צפה bezeichnet hier das Überziehen beziehungsweise Verkleiden eines Gegenstands mit einem kostbaren Material.
- source_word: זָהָב מוּפָז
  choice: geläutertem Gold
  rationale: מוּפָז kennzeichnet hochwertiges Gold; „geläutert“ gibt die wahrscheinliche Vorstellung von gereinigtem beziehungsweise verfeinertem Gold wieder, ohne eine präzise technische Methode vorauszusetzen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Ließ ... anfertigen“ vermeidet die im Deutschen mögliche Fehlvorstellung, der König habe den Thron persönlich handwerklich hergestellt. Die Satzfolge bleibt knapp und erzählerisch.
