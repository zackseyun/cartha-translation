base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/019.yaml
  text: The throne had six steps[a], and the throne had a rounded top at its back, and armrests on this side and on that beside the seat[b], and two lions standing beside the armrests.
translation:
  language: de
  text: Der Thron hatte sechs Stufen und an seiner Rückseite einen abgerundeten oberen Abschluss.[a] Auf beiden Seiten des Sitzes befanden sich Armlehnen, und neben den Armlehnen standen zwei Löwen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »einen runden Kopf hinter ihm«. Die hebräische Bezeichnung kann einen gerundeten oberen Abschluss des Thrones meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלוֹת
  choice: Stufen
  rationale: Im Zusammenhang mit dem erhöhten Thron bezeichnet das Wort die hinaufführenden Stufen.
- source_word: רֹאשׁ עָגֹל
  choice: eine abgerundete Oberseite
  rationale: Wörtlich steht hier »ein runder Kopf«. Gemeint ist der obere Abschluss des Thrones; »Oberseite« wahrt diese Offenheit, ohne einen bestimmten Bauteil wie eine Kopfstütze vorauszusetzen.
- source_word: מֵאַחֲרָיו
  choice: hinten
  rationale: Die knappe Ortsangabe bezeichnet die Rückseite des Thrones und lässt sich im Deutschen natürlich mit »hinten« wiedergeben.
- source_word: יָדֹת
  choice: Armlehnen
  rationale: Das gewöhnlich mit »Hände« verwandte Wort bezeichnet hier im Möbelkontext die seitlichen Arme beziehungsweise Armlehnen des Thrones.
- source_word: מִזֶּה וּמִזֶּה אֶל מְקוֹם הַשָּׁבֶת
  choice: auf beiden Seiten des Sitzes
  rationale: Die Wendung beschreibt die beidseitige Lage der Armlehnen am wörtlichen »Ort des Sitzens«; »Sitz« gibt die Funktion knapp und natürlich wieder.
- source_word: אֲרָיוֹת עֹמְדִים
  choice: standen zwei Löwen
  rationale: Der Plural und das Partizip zeichnen zwei aufrecht stehende Löwenfiguren; die deutsche Vergangenheitsform passt zur erzählenden Beschreibung.
- source_word: אֵצֶל הַיָּדוֹת
  choice: neben den Armlehnen
  rationale: Die Ortsangabe positioniert die beiden Löwen unmittelbar bei den zuvor erwähnten Armlehnen.
