source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ הַ֠/מֶּלֶךְ אֶת עֲצֵ֨י הָ/אַלְמֻגִּ֜ים מִסְעָ֤ד לְ/בֵית יְהוָה֙ וּ/לְ/בֵ֣ית הַ/מֶּ֔לֶךְ וְ/כִנֹּר֥וֹת וּ/נְבָלִ֖ים לַ/שָּׁרִ֑ים לֹ֣א בָֽא כֵ֞ן עֲצֵ֤י אַלְמֻגִּים֙ וְ/לֹ֣א נִרְאָ֔ה עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/012.yaml
  text: The king made the almug wood into supports for the house of Yahweh and for the king’s house[a], and lyres and harps for the singers. Never before had such almug wood come[b], nor has any been seen to this day.
translation:
  language: de
  text: Der König ließ aus dem Almugholz[a] Stützen[b] für das Haus Jahwes und für das Haus des Königs sowie Leiern und Harfen für die Sänger anfertigen. Nie zuvor war solches Almugholz gekommen, und bis auf den heutigen Tag ist kein solches Almugholz gesehen worden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: An anderer Stelle begegnet für dasselbe kostbare Holz die Schreibform „Algumholz“. Die genaue Baumart ist unbekannt.
    reason: lexical_alternative
  - marker: b
    text: Das seltene hebräische Wort kann auch andere architektonische Bauteile bezeichnen, möglicherweise Stufen oder Geländer.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצֵי הָאַלְמֻגִּים
  choice: Almugholz
  rationale: Die genaue Baumart ist unbekannt. Daher wird die masoretische Form אַלְמֻגִּים als traditioneller Artname transliteriert, statt eine botanische Bestimmung zu vermuten; „Holz“ gibt die kollektive Bedeutung im Deutschen natürlich wieder.
- source_word: מִסְעָד
  choice: Stützen
  rationale: Das seltene Wort bezeichnet wahrscheinlich ein architektonisches Bauteil. „Stützen“ bleibt bewusst allgemein und legt sich nicht unbegründet auf Stufen, Geländer oder Säulen fest.
- source_word: לְבֵית יְהוָה
  choice: für das Haus Jahwes
  rationale: „Haus“ bewahrt die hebräische Ausdrucksweise und die Parallele zum Haus des Königs; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: וּלְבֵית הַמֶּלֶךְ
  choice: und für das Haus des Königs
  rationale: Die wörtliche Wiedergabe erhält die formale Parallele zu „Haus Jahwes“; gemeint ist der Königspalast.
- source_word: וְכִנֹּרוֹת וּנְבָלִים
  choice: Leiern und Harfen
  rationale: Die beiden verschiedenen Saiteninstrumente werden mit geläufigen, unterscheidbaren deutschen Bezeichnungen wiedergegeben, ohne eine vollkommen sichere instrumentenkundliche Identifizierung zu behaupten.
- source_word: לַשָּׁרִים
  choice: für die Sänger
  rationale: Die Form bezeichnet diejenigen, die singen; „Sänger“ ist präziser als das allgemeinere „Musiker“.
- source_word: לֹא בָא כֵן עֲצֵי אַלְמֻגִּים
  choice: Nie zuvor war solches Almugholz gekommen
  rationale: Diese idiomatische Formulierung gibt die Aussage wieder, dass eine solche Lieferung beziehungsweise solches Holz bis dahin ohne Beispiel war, ohne ein im Hebräischen nicht genanntes Herkunftsland einzufügen.
- source_word: וְלֹא נִרְאָה עַד הַיּוֹם הַזֶּה
  choice: und bis auf den heutigen Tag wurde keines mehr gesehen
  rationale: Die Formulierung bewahrt den Erzählerstandpunkt und ergänzt „keines“ als im Deutschen notwendige Rückaufnahme von „Almugholz“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von בֵּית bei Heiligtum und Palast
  choice: Haus Jahwes / Haus des Königs
  alternative: Tempel Jahwes / Königspalast
  rationale: Die gleiche Wiedergabe von בֵּית erhält die bewusste sprachliche Parallele des hebräischen Satzes, auch wenn im jeweiligen Zusammenhang Tempel und Palast gemeint sind.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Konstruktion „ließ … anfertigen“ gibt den königlichen Auftrag natürlich wieder. Die seltenen Sachbegriffe werden lesbar übersetzt, während ihre tatsächliche Unsicherheit in den Fußnoten erhalten bleibt.
