  text: וּ/מַֽלְכַּת שְׁבָ֗א שֹׁמַ֛עַת אֶת שֵׁ֥מַע שְׁלֹמֹ֖ה לְ/שֵׁ֣ם יְהוָ֑ה וַ/תָּבֹ֥א לְ/נַסֹּת֖/וֹ בְּ/חִידֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/001.yaml
  text: The queen of Sheba heard of Solomon’s fame concerning the name of Yahweh[b][a], and she came to test him with riddles.
translation:
  language: de
  text: Die Königin von Saba hörte von Salomos Ruhm im Zusammenhang mit dem Namen Jahwes[a], und sie kam, um ihn mit Rätseln[b] auf die Probe zu stellen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von dem Bericht über Salomo in Bezug auf den Namen Jahwes“. Die hebräische Wendung ist knapp und kann bedeuten, dass Salomos Ruhm mit Jahwes Namen oder Ansehen zusammenhing.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mit schwierigen Fragen“. Das hebräische Wort bezeichnet wörtlich Rätsel oder schwer deutbare Aussprüche.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַלְכַּת שְׁבָא
  choice: Die Königin von Saba
  rationale: Die Konstruktion bedeutet „Königin von Saba“. Das einleitende Waw setzt die Erzählung fort, muss im Deutschen am Beginn des neuen Abschnitts aber nicht eigens mit „und“ wiedergegeben werden.
- source_word: שֹׁמַעַת אֶת־שֵׁמַע שְׁלֹמֹה
  choice: hörte von Salomos Ruhm
  rationale: שֵׁמַע kann einen Bericht, Ruf oder Ruhm bezeichnen. Im Zusammenhang mit der Nachricht, die eine ferne Königin zur Reise bewegt, ist „Ruhm“ natürlich und treffend.
- source_word: לְשֵׁם יְהוָה
  choice: der mit dem Namen Jahwes verbunden war
  rationale: Die knappe hebräische Wendung bezeichnet eine Beziehung zu Jahwes Namen, ohne deren genaue Art festzulegen. Die Übersetzung bewahrt diese Offenheit und stellt den Bezug grammatisch eindeutig zu Salomos Ruhm her.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לְנַסֹּתוֹ
  choice: um ihn ... auf die Probe zu stellen
  rationale: נסה bedeutet „prüfen, erproben“. Die deutsche Wendung passt hier zur beabsichtigten Prüfung von Salomos Weisheit.
- source_word: בְּחִידוֹת
  choice: mit Rätseln
  rationale: חִידוֹת bezeichnet Rätsel oder schwer deutbare Fragen und Aussprüche. „Rätsel“ ist die unmittelbarste Entsprechung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen Gottes. „Jahwe“ bewahrt diesen, während „der HERR“ die traditionelle Ersatzlesung wiedergibt.
- issue: Beziehung zwischen Salomos Ruhm und dem Namen Jahwes
  choice: Salomos Ruhm war mit dem Namen Jahwes verbunden
  alternative: der Bericht über Salomo in Bezug auf den Namen Jahwes
  rationale: Die Präposition לְ lässt hier mehrere Beziehungsnuancen zu. Die gewählte Formulierung wahrt den Zusammenhang, ohne Ursache, Zweck oder genaue Art der Verbindung dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur wurde gegenüber dem kompakten Hebräisch leicht entfaltet, um den Bezug der schwierigen Wendung לְשֵׁם יְהוָה verständlich zu machen, ohne ihre sachliche Offenheit aufzuheben.
