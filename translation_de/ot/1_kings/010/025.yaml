  text: וְ/הֵ֣מָּה מְבִאִ֣ים אִ֣ישׁ מִנְחָת֡/וֹ כְּלֵ֣י כֶסֶף֩ וּ/כְלֵ֨י זָהָ֤ב וּ/שְׂלָמוֹת֙ וְ/נֵ֣שֶׁק וּ/בְשָׂמִ֔ים סוּסִ֖ים וּ/פְרָדִ֑ים דְּבַר שָׁנָ֖ה בְּ/שָׁנָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/025.yaml
  text: 'And they were bringing[a], each man his tribute: articles of silver, articles of gold, garments, weapons, spices, horses, and mules[c][b], year by year.'
translation:
  language: de
  text: 'Und jeder von ihnen brachte Jahr für Jahr sein Geschenk[a]: Gegenstände aus Silber, Gegenstände aus Gold, Gewänder[b], Waffen[c], Gewürze, Pferde und Maultiere.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seine Gabe«, »seinen Tribut« oder »seine Abgabe«. Das hebräische Wort kann eine freiwillige Gabe, aber auch eine einem König entrichtete Leistung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Obergewänder« beziehungsweise »Mäntel«.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »Rüstungen«; das hebräische Wort kann militärische Ausrüstung verschiedener Art bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵמָּה מְבִאִים
  choice: Und jeder von ihnen brachte Jahr für Jahr
  rationale: Das Partizip beschreibt im Zusammenhang eine regelmäßig wiederkehrende Handlung. Im Deutschen bringt die Verbindung des Präteritums mit »Jahr für Jahr« diesen gewohnheitsmäßigen Sinn natürlich zum Ausdruck; »von ihnen« nimmt das betonte Pronomen הֵמָּה auf.
- source_word: אִישׁ מִנְחָתוֹ
  choice: jeder von ihnen … sein Geschenk
  rationale: אִישׁ ist hier distributiv gebraucht. מִנְחָה bezeichnet eine einem König überbrachte Gabe und kann je nach Einschätzung des politischen Verhältnisses auch als Tribut oder Abgabe verstanden werden. »Geschenk« bewahrt, ohne Zwang vorauszusetzen, die im Kontext naheliegende Gabe an Salomo.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: Gegenstände aus Silber und Gold
  rationale: כְּלִי ist ein weiter Begriff für Gegenstände, Geräte oder Gefäße. »Gegenstände« vermeidet eine unnötige Festlegung auf Gefäße und erhält die Parallelität der beiden Ausdrücke.
- source_word: שְׂלָמוֹת
  choice: Gewänder
  rationale: Das seltene Wort bezeichnet wahrscheinlich Kleidungsstücke, möglicherweise besonders Obergewänder oder Mäntel. »Gewänder« ist in der Aufzählung verständlich und lässt die genauere Art offen.
- source_word: נֵשֶׁק
  choice: Waffen
  rationale: Das Wort bezeichnet militärische Ausrüstung und kann kontextabhängig Waffen oder Rüstung meinen. »Waffen« ist die klare, breite Wiedergabe im modernen Deutschen.
- source_word: בְשָׂמִים
  choice: Gewürze
  rationale: Gemeint sind kostbare aromatische Stoffe. »Gewürze« ist in einem Handels- und Geschenkkontext idiomatisch und ausreichend weit.
- source_word: סוּסִים וּפְרָדִים
  choice: Pferde und Maultiere
  rationale: Dies entspricht den üblichen Bedeutungen der beiden Tierbezeichnungen.
- source_word: דְּבַר שָׁנָה בְּשָׁנָה
  choice: Jahr für Jahr
  rationale: Die hebräische Wendung bezeichnet die regelmäßige jährliche Wiederholung. »Jahr für Jahr« erhält ihren wiederholenden Charakter und klingt natürlich.
theological_decisions:
- issue: Freiwillige Gabe oder politischer Tribut
  choice: Geschenk im Haupttext, mit Alternativen in der Fußnote
  alternative: Tribut oder Abgabe
  rationale: מִנְחָה kann sowohl eine Gabe als auch eine einem Herrscher entrichtete Abgabe bezeichnen. Der unmittelbare Zusammenhang schildert die Besucher Salomos mit ihren Gaben, legt aber den genauen Grad politischer Verpflichtung nicht eindeutig fest. Daher wird diese Spannung nicht zugunsten einer zwingend freiwilligen oder verpflichtenden Leistung aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzglieder wurden für einen natürlichen deutschen Satzbau umgestellt, ohne die distributive Aussage oder den jährlich wiederkehrenden Charakter zu verlieren. Die Aufzählung bleibt knapp und sachlich.
