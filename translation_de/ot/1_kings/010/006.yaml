  variant: modern standard German
source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ אֶל הַ/מֶּ֔לֶךְ אֱמֶת֙ הָיָ֣ה הַ/דָּבָ֔ר אֲשֶׁ֥ר שָׁמַ֖עְתִּי בְּ/אַרְצִ֑/י עַל דְּבָרֶ֖י/ךָ וְ/עַל חָכְמָתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/006.yaml
  text: Then she said to the king[a], “The report that I heard in my own land about your words and your wisdom was true.”
translation:
  language: de
  text: 'Da sagte sie zum König: »Der Bericht, den ich in meinem Land über deine Worte[a] und deine Weisheit gehört habe, war wahr.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »deine Angelegenheiten« oder »deine Taten«. Das hebräische Wort kann hier auch allgemeiner das bezeichnen, was über dich berichtet wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Da sagte sie
  rationale: Das Narrativ-Waw führt die Handlung weiter; »Da sagte sie« gibt die zeitliche Abfolge in natürlichem modernem Deutsch wieder.
- source_word: אֶל־הַמֶּלֶךְ
  choice: zum König
  rationale: Die Präpositionalverbindung wird direkt und idiomatisch wiedergegeben; der bestimmte Artikel bleibt erhalten.
- source_word: אֱמֶת הָיָה הַדָּבָר
  choice: Der Bericht … war wahr
  rationale: אֱמֶת steht prädikativ, während דָּבָר hier im Zusammenhang das Gehörte, also einen Bericht, bezeichnet. Die deutsche Formulierung bewahrt diese Satzstruktur sinngemäß und klingt natürlich.
- source_word: אֲשֶׁר שָׁמַעְתִּי
  choice: den ich … gehört habe
  rationale: Die hebräische Relativkonstruktion wird mit einem idiomatischen deutschen Relativsatz wiedergegeben.
- source_word: בְּאַרְצִי
  choice: in meinem Land
  rationale: Dies ist eine direkte und natürliche Wiedergabe von אֶרֶץ mit dem Suffix der ersten Person.
- source_word: עַל־דְּבָרֶיךָ
  choice: über deine Worte
  rationale: Die Wiedergabe bleibt nahe am hebräischen דְּבָרֶיךָ, ohne die im Kontext ebenfalls mögliche weitere Bedeutung »Angelegenheiten« oder »Taten« auszuschließen; diese wird in der Fußnote genannt.
- source_word: וְעַל־חָכְמָתֶךָ
  choice: und deine Weisheit
  rationale: Die zentrale Bedeutung von חָכְמָה und die koordinierte Verbindung mit dem vorhergehenden Ausdruck werden bewahrt.
