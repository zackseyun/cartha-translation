base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/020.yaml
  text: And twelve lions were standing there on the six steps[a], on this side and on that side[b]; nothing like it had been made in any kingdom.
translation:
  language: de
  text: Und zwölf Löwen standen dort auf den sechs Stufen, auf dieser und auf jener Seite[a]. Nichts Derartiges war in irgendeinem Königreich angefertigt worden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „auf den sechs Stufen, auf dieser Seite und auf jener Seite“.'
    reason: Die hebräische Wendung bezeichnet die beiden Seiten, ohne die genaue Verteilung der zwölf Löwen auf die einzelnen Stufen ausdrücklich zu bestimmen.
  - marker: b
    text: 'Wörtlich: „So war es für alle Königreiche nicht gemacht worden.“'
    reason: Die wörtliche hebräische Formulierung ist im Deutschen unidiomatisch; der Haupttext gibt ihre negative vergleichende Aussage natürlich wieder.
lexical_decisions:
- source_word: וּשְׁנֵים עָשָׂר אֲרָיִים
  choice: Und zwölf Löwen
  rationale: Die Kardinalzahl und das Substantiv werden direkt wiedergegeben; gemeint sind Löwenfiguren im Umfeld des Thrones.
- source_word: עֹמְדִים שָׁם
  choice: standen dort
  rationale: Das Qal-Partizip beschreibt die feste Aufstellung der Figuren; im erzählenden deutschen Kontext ist „standen dort“ natürlich.
- source_word: עַל שֵׁשׁ הַמַּעֲלוֹת
  choice: auf den sechs Stufen
  rationale: מַעֲלוֹת bezeichnet hier die zum Thron führenden Stufen; עַל wird räumlich mit „auf“ wiedergegeben.
- source_word: מִזֶּה וּמִזֶּה
  choice: je einer auf jeder Seite jeder Stufe
  rationale: Die Wendung bezeichnet beide Seiten. Zusammen mit zwölf Löwen und sechs Stufen liegt die distributive Anordnung von je zwei Löwen pro Stufe nahe; sie wird für ein klares deutsches Bild ausdrücklich formuliert und zugleich in einer Fußnote näher erläutert.
- source_word: לֹא נַעֲשָׂה כֵן
  choice: Etwas Derartiges war … nicht angefertigt worden
  rationale: Das Nifal von עשה bezeichnet das Anfertigen; כֵן verweist vergleichend auf die beschriebene Gestaltung.
- source_word: לְכָל מַמְלָכוֹת
  choice: für kein anderes Königreich
  rationale: Im negierten Satz hat כָל distributive Bedeutung. „Für kein anderes Königreich“ bewahrt das לְ und ergibt idiomatisches Deutsch.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Angefertigt“ passt zu den beschriebenen kunsthandwerklichen Löwenfiguren; die Satzteilung hält die Beschreibung gut verständlich.
