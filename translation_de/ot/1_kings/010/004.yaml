  text: וַ/תֵּ֨רֶא֙ מַֽלְכַּת שְׁבָ֔א אֵ֖ת כָּל חָכְמַ֣ת שְׁלֹמֹ֑ה וְ/הַ/בַּ֖יִת אֲשֶׁ֥ר בָּנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/004.yaml
  text: When the queen of Sheba saw all the wisdom of Solomon and the house that he had built,[a]
translation:
  language: de
  text: Als die Königin von Saba die ganze Weisheit Salomos und das Haus sah, das er gebaut hatte,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Palast, den er gebaut hatte“. Das hebräische Wort für „Haus“ kann in diesem Zusammenhang die königliche Residenz bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: Als … sah
  rationale: Die Wayyiqtol-Form führt die Erzählung fort; mit „Als“ wird zugleich deutlich, dass der Satz syntaktisch in den folgenden Vers hineinreicht.
- source_word: מַלְכַּת שְׁבָא
  choice: die Königin von Saba
  rationale: Die Status-constructus-Verbindung bezeichnet die Herrscherin von Saba; die Formulierung ist im modernen Standarddeutsch geläufig.
- source_word: אֵת
  choice: nicht eigens wiedergegeben
  rationale: Die Partikel kennzeichnet das bestimmte direkte Objekt und hat im Deutschen keine eigene lexikalische Entsprechung.
- source_word: כָּל חָכְמַת שְׁלֹמֹה
  choice: die ganze Weisheit Salomos
  rationale: כָּל mit dem folgenden Status constructus bezeichnet die Gesamtheit von Salomos Weisheit; der Genitiv bewahrt die hebräische Beziehung natürlich.
- source_word: וְהַבַּיִת
  choice: und das Haus
  rationale: בַּיִת bedeutet wörtlich „Haus“ und kann im königlichen Zusammenhang den Palast bezeichnen. Die transparente Wiedergabe bleibt im Text, die kontextuelle Alternative steht in der Fußnote.
- source_word: אֲשֶׁר בָּנָה
  choice: das er gebaut hatte
  rationale: Der Relativsatz bezieht sich auf das Haus; das Plusquamperfekt verdeutlicht natürlich, dass der Bau vor ihrem Sehen abgeschlossen war.
