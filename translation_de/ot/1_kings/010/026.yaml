  text: וַ/יֶּאֱסֹ֣ף שְׁלֹמֹה֮ רֶ֣כֶב וּ/פָרָשִׁים֒ וַ/יְהִי ל֗/וֹ אֶ֤לֶף וְ/אַרְבַּע מֵאוֹת֙ רֶ֔כֶב וּ/שְׁנֵים עָשָׂ֥ר אֶ֖לֶף פָּֽרָשִׁ֑ים וַ/יַּנְחֵ/ם֙ בְּ/עָרֵ֣י הָ/רֶ֔כֶב וְ/עִם הַ/מֶּ֖לֶךְ בִּ/ירוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/026.yaml
  text: Solomon gathered chariots and horsemen[a], and he had 1,400 chariots and 12,000 horsemen, and he stationed them in the chariot cities and with the king in Jerusalem.
translation:
  language: de
  text: Salomo sammelte Streitwagen und Reiter[a]. Er hatte 1.400 Streitwagen und 12.000 Reiter. Er stationierte sie in den Wagenstädten und beim König in Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Reiterei“; das hebräische Wort bezeichnet Reiter, nicht Pferde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: sammelte
  rationale: Das Verb אסף bezeichnet hier das Zusammentragen beziehungsweise Ansammeln militärischer Mittel. „Sammelte“ ist direkt, natürlich und überdeutet den Verwaltungsvorgang nicht.
- source_word: רֶכֶב
  choice: Streitwagen
  rationale: Das singularische Kollektivwort bezeichnet hier die Streitwagen beziehungsweise die Streitwagentruppe. Wegen der anschließenden Zählung ist der konkrete Plural „Streitwagen“ im Deutschen am klarsten.
- source_word: פָרָשִׁים
  choice: Reiter
  rationale: Das Substantiv bezeichnet berittene Personen, nicht bloß Pferde. „Reiter“ bewahrt diesen Wortsinn und bleibt weniger interpretierend als „Kavallerie“ oder „Reiterei“.
- source_word: וַיְהִי לוֹ
  choice: Er hatte
  rationale: Die hebräische Wendung drückt Besitz aus; „Er hatte“ ist die natürliche moderne deutsche Entsprechung.
- source_word: אֶלֶף וְאַרְבַּע מֵאוֹת רֶכֶב
  choice: 1.400 Streitwagen
  rationale: Die Zahlenangabe wird unmittelbar und nach deutscher Schreibkonvention wiedergegeben.
- source_word: וּשְׁנֵים עָשָׂר אֶלֶף פָּרָשִׁים
  choice: 12.000 Reiter
  rationale: Die Zahl wird direkt wiedergegeben; „Reiter“ entspricht der ersten Verwendung von פָרָשִׁים.
- source_word: וַיַּנְחֵם
  choice: Er stationierte sie
  rationale: Die Hifil-Form von נוח bedeutet hier, die militärischen Kräfte gezielt an bestimmten Orten unterzubringen. „Stationierte“ gibt diesen Kontext präzise wieder.
- source_word: בְּעָרֵי הָרֶכֶב
  choice: in den Wagenstädten
  rationale: Die Wendung bezeichnet eigens mit der Streitwagenmacht verbundene Städte. „Wagenstädte“ ist knapp und als militärisch-administrativer Ausdruck verständlich.
- source_word: וְעִם הַמֶּלֶךְ בִּירוּשָׁלָם
  choice: und beim König in Jerusalem
  rationale: Die direkte Formulierung bewahrt die auffällige Selbstbezeichnung Salomos als „der König“ und drückt aus, dass ein Teil der Kräfte bei ihm in Jerusalem blieb.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen Hauptsätze vermeiden eine schwerfällige Reihung. Die militärischen Fachbegriffe bleiben konkret; die ungewöhnliche Formulierung „beim König“ wird entsprechend dem Hebräischen bewahrt.
