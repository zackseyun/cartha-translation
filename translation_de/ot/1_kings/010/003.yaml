  text: And Solomon answered all her questions[a]; there was nothing hidden from the king that he did not tell her.
translation:
  language: de
  text: Und Salomo beantwortete alle ihre Fragen[a]; dem König blieb nichts verborgen, das er ihr nicht mitteilte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Und Salomo teilte ihr alle ihre Worte/Angelegenheiten mit.“ Im Zusammenhang sind damit seine Antworten auf die Fragen der Königin gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֶּד
  choice: beantwortete
  rationale: Das Verb bedeutet gewöhnlich „mitteilen, kundtun“. Zusammen mit דְּבָרֶיהָ und angesichts der schwierigen Fragen in Vers 1 bezeichnet es hier idiomatisch Salomos Antworten.
- source_word: דְּבָרֶיהָ
  choice: ihre Fragen
  rationale: דָּבָר kann „Wort, Sache, Angelegenheit“ bedeuten. Im Erzählzusammenhang sind die Fragen der Königin gemeint; die kontextuelle Präzisierung ergibt natürliches Deutsch.
- source_word: לֹא הָיָה דָּבָר נֶעְלָם מִן־הַמֶּלֶךְ
  choice: dem König blieb nichts verborgen
  rationale: Die Formulierung bewahrt das hebräische Bild des Verborgenseins und gibt die Konstruktion mit מִן idiomatisch wieder.
- source_word: אֲשֶׁר לֹא הִגִּיד לָהּ
  choice: worüber er ihr nicht Auskunft gab
  rationale: Der Relativsatz erklärt, dass es keine Angelegenheit gab, die Salomo ihr nicht darlegen konnte. „Auskunft gab“ vermeidet im Deutschen die missverständliche Wiederholung von „sagen“ und passt zum Frage-Antwort-Kontext.
