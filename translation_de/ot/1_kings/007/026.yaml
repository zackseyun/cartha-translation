base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/026.yaml
  text: Its thickness was a handbreadth[a], and its rim was made like the rim of a cup, like a lily blossom[b]. It could hold two thousand baths.
translation:
  language: de
  text: Seine Stärke betrug eine Handbreit, und sein Rand war wie der Rand eines Bechers gearbeitet, wie eine Lilienblüte. Es konnte zweitausend Bat[a] fassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In 2. Chronik 4,5 werden dreitausend Bat genannt. Dies kann einen textlichen, überlieferungsgeschichtlichen oder interpretativen Unterschied widerspiegeln; möglicherweise wird zwischen dem gesamten Fassungsvermögen und der üblichen Füllmenge unterschieden.
    reason: cross_reference
lexical_decisions:
- source_word: עָבְיוֹ טֶפַח
  choice: Seine Wand war eine Handbreit dick
  rationale: Die Formulierung gibt die Materialstärke des großen Beckens in natürlichem Deutsch wieder. טֶפַח bezeichnet das Handbreit als antikes Längenmaß.
- source_word: שְׂפָתוֹ
  choice: sein Rand
  rationale: Bei einem großen Becken bezeichnet שָׂפָה den oberen Rand; „Rand“ ist im heutigen Deutsch klarer als das ebenfalls mögliche „Lippe“.
- source_word: כְּמַעֲשֵׂה שְׂפַת כּוֹס
  choice: war wie der Rand eines Bechers gearbeitet
  rationale: כְּמַעֲשֵׂה verweist auf Form beziehungsweise Ausführung; „gearbeitet“ wahrt den handwerklichen Aspekt und klingt natürlich.
- source_word: פֶּרַח שׁוֹשָׁן
  choice: wie eine Lilienblüte
  rationale: Die knappe florale Vergleichsform wird anschaulich und ohne zusätzliche Deutung wiedergegeben.
- source_word: אַלְפַּיִם בַּת
  choice: zweitausend Bat
  rationale: Bat ist ein antikes Hohlmaß. Die Transliteration vermeidet eine unsichere moderne Umrechnung.
- source_word: יָכִיל
  choice: Es konnte ... fassen
  rationale: Die Hifil-Form bezeichnet hier das Fassungsvermögen des Beckens, nicht zwingend seinen tatsächlichen Inhalt.
theological_decisions:
- issue: Abweichende Kapazitätsangabe in 2. Chronik 4,5
  choice: Die masoretische Angabe „zweitausend Bat“ wird im Haupttext unverändert übersetzt und die Parallelstelle in einer Fußnote genannt.
  alternative: Die Angabe anhand von 2. Chronik 4,5 zu „dreitausend Bat“ harmonisieren oder beide Zahlen als Fassungsvermögen und übliche Füllmenge erklären.
  rationale: Der vorliegende hebräische Text von 1. Könige 7,26 bietet eindeutig zweitausend. Die Spannung zur Parallelstelle soll sichtbar bleiben und nicht durch eine unbelegte Harmonisierung aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Wand“ verdeutlicht, worauf sich die Dicke bezieht; „Bat“ bleibt als historisches Maß erhalten und wird durch die Fußnote zugleich mit der abweichenden Parallelangabe verbunden.
