  variant: modern standard German
source:
  edition: WLC
  text: וְ/אוּלָ֤ם הַ/כִּסֵּא֙ אֲשֶׁ֣ר יִשְׁפָּט שָׁ֔ם אֻלָ֥ם הַ/מִּשְׁפָּ֖ט עָשָׂ֑ה וְ/סָפ֣וּן בָּ/אֶ֔רֶז מֵ/הַ/קַּרְקַ֖ע עַד הַ/קַּרְקָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/007.yaml
  text: And he made the Hall of the Throne[a], where he was to judge—the Hall of Judgment—and it was paneled with cedar from floor to floor.
translation:
  language: de
  text: Auch errichtete er die Thronhalle, in der er Recht sprechen sollte – die Gerichtshalle. Sie war vom Fußboden bis zum Fußboden[a] mit Zedernholz getäfelt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vom Fußboden bis zum Fußboden“. Gemeint sein könnte: „vom Fußboden bis zur Decke“.'
    reason: Der hebräische Text wiederholt dasselbe Wort für „Fußboden/Grund“. Die verbreitete vertikale Deutung ist kontextuell plausibel, aber nicht der Wortlaut des masoretischen Textes.
lexical_decisions:
- source_word: וְאוּלָם הַכִּסֵּא
  choice: Auch errichtete er die Thronhalle
  rationale: אוּלָם bezeichnet hier einen hallenartigen Palastbereich; „Thronhalle“ gibt die Verbindung mit הַכִּסֵּא natürlich und prägnant wieder. „Errichtete“ macht das elliptische עָשָׂה im deutschen Baukontext verständlich.
- source_word: אֲשֶׁר יִשְׁפָּט שָׁם
  choice: in der er Recht sprechen sollte
  rationale: Das Imperfekt kann die vorgesehene beziehungsweise regelmäßige Funktion der Halle ausdrücken. „Recht sprechen“ ist im Deutschen idiomatischer und genauer als das mehrdeutige „richten“.
- source_word: אֻלָם הַמִּשְׁפָּט
  choice: die Gerichtshalle
  rationale: Die Konstruktverbindung benennt die Halle nach ihrer Funktion. „Gerichtshalle“ bleibt sachlich und vermeidet eine stärkere Deutung von מִשְׁפָּט als abstrakte „Gerechtigkeit“.
- source_word: וְסָפוּן בָּאֶרֶז
  choice: mit Zedernholz getäfelt
  rationale: סָפוּן beschreibt eine Verkleidung oder Täfelung. Diese Wiedergabe passt zu einer repräsentativen Innenausstattung und bewahrt Zedernholz als Materialangabe.
- source_word: מֵהַקַּרְקַע עַד הַקַּרְקָע
  choice: vom Fußboden bis zum Fußboden
  rationale: Der masoretische Text wiederholt קַרְקַע wörtlich. Die Hauptfassung bewahrt diese auffällige und möglicherweise textlich schwierige Formulierung; die kontextuelle Deutung „bis zur Decke“ steht in der Fußnote.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem beschreibenden Charakter des hebräischen Textes, während der Gedankenstrich die erläuternde Zweitbezeichnung der Halle sichtbar macht. Die schwierige Schlussformulierung bleibt im Haupttext bewusst unaufgelöst.
