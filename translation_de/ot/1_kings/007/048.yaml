id: 1KI.7.48
reference: 1 Kings 7:48
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ שְׁלֹמֹ֔ה אֵ֚ת כָּל הַ/כֵּלִ֔ים אֲשֶׁ֖ר בֵּ֣ית יְהוָ֑ה אֵ֚ת מִזְבַּ֣ח הַ/זָּהָ֔ב וְ/אֶת הַ/שֻּׁלְחָ֗ן אֲשֶׁ֥ר עָלָ֛י/ו לֶ֥חֶם הַ/פָּנִ֖ים זָהָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/048.yaml
  text: 'And Solomon made all the vessels that were in the house of Yahweh: the golden altar[a], and the table on which was the bread of the Presence[b], of gold.'
translation:
  language: de
  text: 'Und Salomo fertigte alle Geräte an, die zum Haus Jahwes gehörten: den goldenen Altar und den goldenen Tisch, auf dem das Brot der Gegenwart[a] lag.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: das Schaubrot. Wörtlich: das Brot des Angesichts beziehungsweise der Gegenwart.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fertigte … an
  rationale: עשה ist ein breites Verb für „machen/tun“; bei der Herstellung von Tempelgeräten gibt „anfertigen“ den Zusammenhang natürlich wieder, ohne eine bestimmte Handwerkstechnik vorauszusetzen.
- source_word: כָּל הַכֵּלִים
  choice: alle Geräte
  rationale: כֵּלִים bezeichnet hier die zum Heiligtum gehörenden Gegenstände. „Geräte“ ist im Deutschen verständlicher und in diesem kultischen Zusammenhang passender als „Gefäße“, da auch Altar und Tisch folgen.
- source_word: בֵּית יְהוָה
  choice: Haus Jahwes
  rationale: „Haus“ bewahrt die konkrete hebräische Ausdrucksweise; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: מִזְבַּח הַזָּהָב
  choice: den goldenen Altar
  rationale: Die attributive Wiedergabe ist im Deutschen idiomatisch und entspricht der hebräischen Bestimmung durch „Gold“.
- source_word: הַשֻּׁלְחָן … זָהָב
  choice: den goldenen Tisch
  rationale: Das abschließende זָהָב bestimmt am natürlichsten den Tisch; im Deutschen wird diese Zugehörigkeit klar und flüssig durch das Adjektiv ausgedrückt.
- source_word: אֲשֶׁר עָלָיו
  choice: auf dem … lag
  rationale: Die Konstruktion bezeichnet die Lage des Brotes auf dem Tisch; „lag“ ist im Deutschen die natürliche Ergänzung des im Hebräischen nominal formulierten Satzes.
- source_word: לֶחֶם הַפָּנִים
  choice: Brot der Gegenwart
  rationale: Die Wiedergabe bewahrt den Bezug von פָּנִים auf die göttliche Gegenwart und bleibt für heutige Leser verständlicher als der traditionelle Fachausdruck „Schaubrot“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als solcher wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von לֶחֶם הַפָּנִים
  choice: Brot der Gegenwart
  alternative: Schaubrot
  rationale: Die Formulierung hält die kultische Vorstellung fest, dass das Brot vor Gottes Gegenwart liegt, ohne die Bedeutung auf einen traditionellen, heute wenig transparenten Fachbegriff zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am hebräischen Inventarstil, wird aber durch die Stellung von „goldenen“ und das ergänzte Verb „lag“ natürlich lesbar.
