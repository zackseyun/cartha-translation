base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/006.yaml
  text: He made the Hall of Pillars fifty cubits long and thirty cubits wide[a], with a porch in front of them[b], and pillars and a threshold in front of them.
translation:
  language: de
  text: Er baute die Säulenhalle; sie war fünfzig Ellen lang und dreißig Ellen breit. Vor ihnen befand sich eine Vorhalle[a], und vor ihnen waren Säulen und ein Gebälk[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht hier dasselbe Wort wie bei „Säulenhalle“; gemeint ist wahrscheinlich eine vorgelagerte Halle oder ein Portikus.
    reason: lexical_alternative
  - marker: b
    text: Die Bedeutung des hebräischen Wortes ist in diesem architektonischen Zusammenhang unsicher. Möglich sind auch „Schwelle“, „Überdachung“ oder ein anderes Bauelement.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלָם הָעַמּוּדִים
  choice: Säulenhalle
  rationale: Die Verbindung bezeichnet eine größere, durch Säulen charakterisierte Halle. Das geläufige deutsche Kompositum gibt dies knapp und natürlich wieder.
- source_word: עָשָׂה
  choice: baute
  rationale: Wörtlich bedeutet das Verb „machen“; bei einem Bauwerk ist „baute“ im Deutschen die natürliche kontextuelle Entsprechung.
- source_word: חֲמִשִּׁים אַמָּה אָרְכּוֹ וּשְׁלֹשִׁים אַמָּה רָחְבּוֹ
  choice: sie war fünfzig Ellen lang und dreißig Ellen breit
  rationale: Die hebräische Maßformel wird in natürliches Deutsch übertragen, wobei beide Maßangaben genau erhalten bleiben.
- source_word: וְאוּלָם עַל־פְּנֵיהֶם
  choice: Vor ihnen befand sich eine Vorhalle
  rationale: Das erneut verwendete אוּלָם bezeichnet hier offenbar ein vorgelagertes Bauelement. „Vorhalle“ wahrt die lexikalische Nähe zur ersten Verwendung, ohne beide Strukturen gleichzusetzen.
- source_word: וְעַמֻּדִים
  choice: und vor ihnen standen Säulen
  rationale: Die knappe hebräische Reihung wird zu einem verständlichen deutschen Satz ergänzt, ohne die ausdrücklich genannten Säulen auszulassen.
- source_word: וְעָב
  choice: und ein Gebälk
  rationale: Das seltene Wort ist in diesem architektonischen Zusammenhang unsicher. „Gebälk“ bezeichnet zurückhaltend ein tragendes oder überdeckendes Bauelement und vermeidet eine zu genaue Rekonstruktion.
- source_word: עַל־פְּנֵיהֶם
  choice: vor ihnen
  rationale: Die räumliche Beziehung wird direkt wiedergegeben; der pluralische Bezug bleibt entsprechend dem Hebräischen bewusst erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnlichen pluralischen Bezüge „vor ihnen“ werden nicht stillschweigend auf einen vermuteten Singular geglättet. Die architektonische Unsicherheit des letzten Substantivs wird im Text lesbar wiedergegeben und in der Fußnote offengelegt.
