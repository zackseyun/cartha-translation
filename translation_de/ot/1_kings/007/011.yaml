base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/011.yaml
  text: And above were costly stones[a], cut according to measure, and cedar.
translation:
  language: de
  text: Und darüber waren kostbare Steine[a], nach Maß behauen, und Zedernholz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach den Maßen behauener Steine“.'
    reason: Die knappe hebräische Verbindung כְּמִדּוֹת גָּזִית kann formnäher als Maßangabe in Bezug auf behauene Steine verstanden werden.
lexical_decisions:
- source_word: וּמִלְמַעְלָה
  choice: Und darüber
  rationale: Die Form bezeichnet hier im architektonischen Zusammenhang den darüberliegenden Teil des Bauwerks; „darüber“ ist im Deutschen natürlich und räumlich eindeutig.
- source_word: אֲבָנִים יְקָרוֹת
  choice: kostbare Steine
  rationale: יְקָרוֹת bezeichnet wertvolle beziehungsweise aufwendige Baumaterialien. „Kostbare Steine“ bleibt nah am Hebräischen, ohne ausdrücklich Edelsteine zu unterstellen.
- source_word: כְּמִדּוֹת גָּזִית
  choice: maßgerecht behauen
  rationale: Die Wendung lautet wörtlich etwa „nach den Maßen von behauenem Stein“. Im Baukontext gibt „maßgerecht behauen“ knapp und verständlich wieder, dass die Steine nach festgelegten Abmessungen zugerichtet waren; die formale Alternative bleibt in der Fußnote erhalten.
- source_word: וָאָרֶז
  choice: und Zedernholz
  rationale: Das Hebräische nennt schlicht „Zeder“. Im Deutschen bezeichnet „Zedernholz“ das hier gemeinte Baumaterial eindeutiger und natürlicher.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Das im Hebräischen fehlende finite Verb wird für einen vollständigen deutschen Satz mit „waren“ ergänzt. Die Materialaufzählung und die knappe Bauwerksbeschreibung bleiben erhalten.
