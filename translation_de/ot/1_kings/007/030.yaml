base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/030.yaml
  text: And the one stand had four bronze wheels and bronze axles[a], and its four corners had supports for them; beneath the basin the supports were cast[c][b], each beside wreathwork.
translation:
  language: de
  text: Jedes einzelne Gestell hatte vier Räder aus Bronze und bronzene Achsen. An seinen vier Füßen waren Stützen angebracht[a]. Unter dem Becken waren die Stützen gegossen, jeweils neben Kranzverzierungen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Schultern“; gemeint sind wahrscheinlich vorspringende tragende Bauteile.
    reason: lexical_alternative
  - marker: b
    text: Das seltene hebräische Wort bezeichnet möglicherweise Kränze, Girlanden oder festonartige Verzierungen.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹפַנֵּי נְחֹשֶׁת
  choice: Räder aus Bronze
  rationale: אוֹפַנִּים bezeichnet Räder; נְחֹשֶׁת wird im Zusammenhang der Tempelgeräte sachgerecht mit „Bronze“ wiedergegeben.
- source_word: לַמְּכוֹנָה הָאַחַת
  choice: jedes einzelne Gestell
  rationale: מְכוֹנָה ist hier das fahrbare Untergestell des Beckens. Die distributive Beschreibung eines einzelnen Exemplars wird im Deutschen natürlich mit „jedes einzelne Gestell“ ausgedrückt.
- source_word: סַרְנֵי נְחֹשֶׁת
  choice: Achsen aus Bronze
  rationale: Im unmittelbaren Zusammenhang mit den Rädern bezeichnet סַרְנִים am ehesten deren Achsen.
- source_word: פַעֲמֹתָיו
  choice: seinen vier Füßen
  rationale: פַעַם kann bei einem Gegenstand dessen Fuß beziehungsweise unteren Ansatz bezeichnen. „Füße“ bewahrt das konkrete Körperbild und vermeidet die weniger direkt belegte Festlegung auf Ecken.
- source_word: כְּתֵפֹת
  choice: Schulterstücke
  rationale: Das Wort bedeutet wörtlich „Schultern“ und bezeichnet hier vorspringende tragende Bauteile. „Schulterstücke“ bewahrt das Bild und lässt ihre genaue Konstruktion offen.
- source_word: מִתַּחַת לַכִּיֹּר
  choice: unterhalb des Beckens
  rationale: כִּיּוֹר bezeichnet hier das auf dem Gestell ruhende Becken.
- source_word: יְצֻקוֹת
  choice: angegossen
  rationale: Die Passivform von יצק bezeichnet bei Metallarbeiten gegossene Teile; „angegossen“ passt zur baulichen Verbindung der Schulterstücke.
- source_word: מֵעֵבֶר אִישׁ
  choice: jedes an der Seite
  rationale: Die distributive Wendung ordnet jedes Schulterstück seitlich einem Zierelement zu, ohne die genaue Geometrie festzulegen.
- source_word: לֹיוֹת
  choice: Kranzgewinde
  rationale: Das seltene Wort bezeichnet wahrscheinlich kranz-, girlanden- oder festonartige Zierarbeit; „Kranzgewinde“ ist eine knappe architektonische Wiedergabe.
