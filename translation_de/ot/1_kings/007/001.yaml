base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/001.yaml
  text: Solomon built his own house for thirteen years[a], and he finished all his house.
translation:
  language: de
  text: Sein eigenes Haus[a] baute Salomo dreizehn Jahre lang; und er vollendete sein ganzes Haus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seinen eigenen Palast“. Das hebräische Wort für „Haus“ kann hier die königliche Residenz oder den gesamten Palastkomplex bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּיתוֹ
  choice: seinem eigenen Haus
  rationale: בַּיִת bedeutet gewöhnlich „Haus“, kann im königlichen Zusammenhang aber auch eine Residenz oder einen Palastkomplex bezeichnen. „Eigenen“ bringt den Kontrast zum zuvor behandelten Tempelbau zum Ausdruck, ohne die Bedeutungsbreite von „Haus“ einzuengen.
- source_word: בָּנָה
  choice: baute
  rationale: Das Qal Perfekt bezeichnet hier im Erzählzusammenhang den Bauvorgang; zusammen mit der Zeitangabe ist das deutsche Präteritum natürlich und klar.
- source_word: שְׁלֹשׁ עֶשְׂרֵה שָׁנָה
  choice: dreizehn Jahre
  rationale: Die Akkusativangabe bezeichnet die Dauer des Bauvorhabens; im Deutschen ist keine zusätzliche Präposition nötig.
- source_word: וַיְכַל
  choice: dann hatte er … vollendet
  rationale: Das Verb כלה bezeichnet den Abschluss des Bauvorhabens. „Dann“ gibt die erzählerische Folge wieder; das Plusquamperfekt lässt erkennen, dass das gesamte Haus nach den dreizehn Jahren fertiggestellt war.
- source_word: כָּל בֵּיתוֹ
  choice: sein ganzes Haus
  rationale: כָּל bezeichnet die Gesamtheit. Die Wiederholung von „Haus“ bewahrt die lexikalische Verbindung und lässt offen, ob ein einzelnes Gebäude oder der gesamte Residenzkomplex gemeint ist.
- source_word: וְאֶת
  choice: An seinem eigenen Haus
  rationale: Die Konjunktion mit vorangestelltem Objekt eröffnet ein verwandtes, zugleich kontrastierendes Thema. Die deutsche Voranstellung und „eigenen“ bilden diese Diskursfunktion natürlich ab.
