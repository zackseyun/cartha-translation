- from: An seinem eigenen Haus[a] baute Salomo dreizehn Jahre; dann hatte er sein ganzes Haus vollendet.
  to: Sein eigenes Haus[a] baute Salomo dreizehn Jahre lang; und er vollendete sein ganzes Haus.
  rationale: Die Revision stellt „sein Haus“ wieder als direktes Objekt zu „baute“ dar, behält die kontrastiv hervorgehobene Stellung und „eigenes“ bei, und gibt die erzählerische Abfolge mit dem Präteritum wieder. „Haus“ und die Fußnote bewahren die im Hebräischen offene Bedeutung zwischen Wohnhaus, Residenz und Palastkomplex.
