review_pass:
  verdict: revise
  source_fidelity: Die Aussage über die dreizehnjährige Bauzeit und die Vollendung des gesamten „Hauses“ ist grundsätzlich getroffen. Die Wiedergabe „dann hatte er ... vollendet“ verschiebt jedoch die hebräische Erzählfolge durch ein unbegründetes Plusquamperfekt. Außerdem kann „An seinem eigenen Haus baute“ im Deutschen eher einen Ort als das direkte Objekt des Bauens bezeichnen.
  naturalness: Die Voranstellung in „An seinem eigenen Haus baute Salomo“ ist im modernen Standarddeutsch unnatürlich und semantisch missverständlich. Eine Voranstellung des direkten Objekts ist möglich und bewahrt den hebräischen Akzent.
  terminology: „Haus“ ist als offene, quellentreue Wiedergabe von בַּיִת angemessen; die Fußnote erläutert den möglichen Residenz- bzw. Palastbezug zutreffend. „Vollendete“ gibt וַיְכַל präzise und idiomatisch wieder.
  issues:
  - severity: medium
    issue: „An seinem eigenen Haus“ verändert die syntaktische Rolle von „Haus“.
    rationale: Das hebräische אֶת markiert „sein Haus“ als direktes Objekt von „baute“, nicht als Ort. Im Deutschen legt „an seinem Haus bauen“ nahe, dass an einem bestehenden Haus gearbeitet wird.
  - severity: medium
    issue: Das Plusquamperfekt „hatte ... vollendet“ ist nicht quellentreu.
    rationale: וַיְכַל ist ein narrativer Wayyiqtol und führt die Erzählung mit einem einfachen abgeschlossenen Ereignis fort; „vollendete“ ist angemessen.
  - severity: low
    issue: Die Dauerangabe kann idiomatischer gefasst werden.
    rationale: „Dreizehn Jahre lang“ macht im Deutschen die Dauer des Bauens eindeutig, ohne zusätzlichen Sinn einzutragen.
  revised_text: Sein eigenes Haus[a] baute Salomo dreizehn Jahre lang; und er vollendete sein ganzes Haus.
  revised_footnotes:
