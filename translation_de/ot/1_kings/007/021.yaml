source:
  edition: WLC
  text: וַ/יָּ֨קֶם֙ אֶת הָֽ/עַמֻּדִ֔ים לְ/אֻלָ֖ם הַֽ/הֵיכָ֑ל וַ/יָּ֜קֶם אֶת הָ/עַמּ֣וּד הַ/יְמָנִ֗י וַ/יִּקְרָ֤א אֶת שְׁמ/וֹ֙ יָכִ֔ין וַ/יָּ֨קֶם֙ אֶת הָ/עַמּ֣וּד הַ/שְּׂמָאלִ֔י וַ/יִּקְרָ֥א אֶת שְׁמ֖/וֹ בֹּֽעַז־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/021.yaml
  text: He set up the pillars at the portico of the temple[a]. He set up the right pillar and called its name Jachin; then he set up the left pillar and called its name Boaz.
translation:
  language: de
  text: Er stellte die Säulen an der Vorhalle des Tempels auf.[a] Die rechte Säule stellte er auf und gab ihr den Namen Jachin; dann stellte er die linke Säule auf und gab ihr den Namen Boas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jachin und Boas sind die hebräischen Namen der Säulen; ihre möglichen Bedeutungen werden hier nicht übersetzt.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: stellte … auf
  rationale: Das Hifil von קום bedeutet hier, etwas zum Stehen zu bringen beziehungsweise an seinem Platz aufzurichten. „Aufstellen“ ist im Deutschen natürlich und passt zu den Säulen.
- source_word: הָעַמֻּדִים
  choice: die Säulen
  rationale: עַמּוּד bezeichnet eine Säule oder Stütze. „Säulen“ ist im Zusammenhang des Tempelbaus die übliche und konkrete Wiedergabe.
- source_word: לְאֻלָם הַהֵיכָל
  choice: an der Vorhalle des Tempels
  rationale: אוּלָם bezeichnet die Vorhalle am Eingang des Tempelgebäudes; לְ wird im Kontext örtlich verstanden. „An der Vorhalle“ lässt die genaue räumliche Anordnung offen.
- source_word: הָעַמּוּד הַיְמָנִי
  choice: die rechte Säule
  rationale: יְמָנִי bedeutet wörtlich „rechts/rechter Hand“. Die Wiedergabe vermeidet eine nicht ausdrücklich genannte Himmelsrichtung.
- source_word: וַיִּקְרָא אֶת שְׁמוֹ
  choice: gab ihr den Namen
  rationale: Die hebräische Benennungsformel lautet wörtlich „rief ihren Namen“. „Gab ihr den Namen“ ist natürliches, würdevolles Deutsch und bewahrt den ausdrücklichen Bezug auf den Namen.
- source_word: יָכִין
  choice: Jachin
  rationale: Der Säulenname wird nach etablierter deutscher Bibeltradition transkribiert und nicht nach einer möglichen Bedeutung übersetzt.
- source_word: הָעַמּוּד הַשְּׂמָאלִי
  choice: die linke Säule
  rationale: שְׂמָאלִי bedeutet „links/auf der linken Seite“ und bildet das natürliche Gegenstück zur rechten Säule.
- source_word: בֹּעַז
  choice: Boas
  rationale: „Boas“ ist die etablierte deutsche Form des hebräischen Eigennamens בֹּעַז und wird hier als Säulenname beibehalten.
