  text: Es gab drei Reihen von Fensterrahmen[a], und Fenster lagen einander gegenüber, und zwar dreimal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Es gab drei Reihen von Fenstern, wobei sich auf drei Ebenen jeweils Fenster gegenüberlagen.“ Wörtlich heißt es im zweiten Satzteil: „Fenster zu Fenster dreimal“. Gemeint ist wahrscheinlich eine Anordnung, die sich auf drei Ebenen wiederholte.'
