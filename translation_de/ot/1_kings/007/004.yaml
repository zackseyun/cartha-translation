lexical_decisions:
- source_word: שְׁקֻפִים
  choice: Fensterrahmen
  rationale: Das Substantiv bezeichnet hier wahrscheinlich gerahmte Öffnungen oder Fenstereinfassungen. „Fensterrahmen“ gibt den baulichen Sinn genauer wieder als das allgemeinere „Fenster“; „Türstürze“ wäre möglich, ist im Zusammenhang jedoch weniger wahrscheinlich.
- source_word: שְׁלֹשָׁה טוּרִים
  choice: drei Reihen
  rationale: טוּר bezeichnet eine geordnete Reihe oder Abfolge. „Drei Reihen“ ist im Deutschen eine natürliche architektonische Formulierung und lässt offen, ob horizontale Reihen oder Stockwerke gemeint sind.
- source_word: מֶחֱזָה
  choice: Fenster
  rationale: Das seltene Wort bezeichnet offenbar eine Sicht- oder Lichtöffnung. Im Zusammenhang mit den zuvor genannten Fensterrahmen ist „Fenster“ die klarste und natürlichste Wiedergabe.
- source_word: מֶחֱזָה אֶל מֶחֱזָה
  choice: Fenster gegenüber Fenster
  rationale: Die Verbindung beschreibt eine Zuordnung oder Ausrichtung der Öffnungen zueinander. „Fenster gegenüber Fenster“ bewahrt die knappe, symmetrische Struktur des Hebräischen.
- source_word: שָׁלֹשׁ פְּעָמִים
  choice: dreimal
  rationale: Dies ist die formale Bedeutung der Wendung. Da sie im architektonischen Zusammenhang möglicherweise drei Ebenen bezeichnet, wird diese Deutung in der Fußnote genannt, ohne sie im Haupttext festzuschreiben.
