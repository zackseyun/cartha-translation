source:
  edition: WLC
  text: וְ/אַרְבַּ֣ע כְּתֵפ֔וֹת אֶ֚ל אַרְבַּ֣ע פִּנּ֔וֹת הַ/מְּכֹנָ֖ה הָֽ/אֶחָ֑ת מִן הַ/מְּכֹנָ֖ה כְּתֵפֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/034.yaml
  text: And there were four supports at the four corners of the one stand; its supports were part of the stand itself.
translation:
  language: de
  text: An den vier Ecken des einen Gestells befanden sich vier Streben; seine Streben waren Teil des Gestells selbst.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְתֵפוֹת / כְתֵפֶיהָ
  choice: Streben
  rationale: Das wörtliche „Schultern“ bezeichnet hier vorspringende tragende oder stützende Teile des Gestells. „Streben“ gibt ihre bauliche Funktion in verständlichem Deutsch wieder, ohne ihre genaue, unsichere Form festzulegen.
- source_word: מְכֹנָה
  choice: Gestell
  rationale: Gemeint ist das fahrbare Untergestell der Kesselwagen; „Gestell“ passt zum Sachzusammenhang und bleibt gegenüber einer genaueren technischen Rekonstruktion zurückhaltend.
- source_word: מִן הַמְּכֹנָה
  choice: aus dem Gestell selbst gearbeitet
  rationale: 'Die Präposition מִן drückt hier Herkunft beziehungsweise stoffliche oder konstruktive Einheit aus: Die Streben waren keine angesetzten Einzelteile, sondern gingen aus dem Gestell hervor.'
- source_word: הָאֶחָת
  choice: des einen Gestells
  rationale: Die auffällige bestimmte Singularform wird entsprechend dem masoretischen Text bewahrt und nicht stillschweigend zu „jedes Gestells“ verallgemeinert.
theological_decisions: []
translation_notes:
  register: Sachlich-technischer, würdevoller Erzählstil in modernem Standarddeutsch. Die zweimalige Nennung der Streben folgt der Struktur des Hebräischen; die Formulierung wahrt die ungewöhnliche Wendung „das eine Gestell“.
