  source_fidelity: Die Singularform mit Artikel in הַמְּכֹנָה הָאַחַת („des einen Gestells“) wird zutreffend bewahrt. Auch die vier כְּתֵפוֹת an den vier Ecken sind angemessen als tragende bzw. stützende Bauteile wiedergegeben. Die Wendung מִן־הַמְּכֹנָה beschreibt jedoch am sichersten die konstruktive Zugehörigkeit der Bauteile zum Gestell, nicht ausdrücklich einen Herstellungsvorgang.
