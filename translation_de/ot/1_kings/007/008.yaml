base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/008.yaml
  text: His house where he was to live[a], in the other court farther back from the Hall, was of the same workmanship. He also made a house like this Hall for Pharaoh’s daughter[b], whom Solomon had taken as wife.
translation:
  language: de
  text: Sein Haus, in dem er wohnen sollte, lag im anderen Hof, weiter im Inneren hinter der Halle,[a] und war von derselben Machart. Auch für die Tochter des Pharaos, die Salomo zur Frau genommen hatte,[b] ließ er ein Haus wie diese Halle bauen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Ortsangabe ist schwer zu deuten. Möglich ist auch: „im anderen Hof, von der Halle aus weiter im Inneren“. Die genaue räumliche Beziehung zwischen Hof und Halle bleibt unsicher.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „die Salomo genommen hatte“; gemeint ist, dass er sie geheiratet hatte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֵיתוֹ
  choice: Sein eigenes Haus
  rationale: Das Substantiv mit Possessivsuffix bezeichnet nun Salomos Wohnhaus im Unterschied zu den zuvor beschriebenen Bauten. „Eigenes“ macht diesen Kontrast im Deutschen natürlich deutlich; die einleitende Konjunktion wird durch den fortlaufenden Zusammenhang aufgefangen.
- source_word: אֲשֶׁר יֵשֶׁב שָׁם
  choice: in dem er wohnen sollte
  rationale: ישׁב kann „sitzen“, „wohnen“ oder „sich aufhalten“ bedeuten. Im Zusammenhang eines Palastbaus bezeichnet die Wendung die vorgesehene Nutzung als Wohnhaus; „sollte“ gibt diesen prospektiv-beschreibenden Sinn wieder.
- source_word: חָצֵר הָאַחֶרֶת
  choice: im anderen Hof
  rationale: חצר bezeichnet einen Hof oder Innenhof. Der bestimmte Ausdruck weist auf einen weiteren, zum Palastkomplex gehörenden Hof.
- source_word: מִבֵּית לָאוּלָם
  choice: weiter innen als die Halle
  rationale: Die knappe hebräische Ortsangabe ist schwierig. Die Wiedergabe beschreibt das Wohnhaus als weiter im Inneren des Komplexes gelegen, ohne eine unsichere architektonische Rekonstruktion als eindeutig auszugeben.
- source_word: כַּמַּעֲשֶׂה הַזֶּה הָיָה
  choice: war von derselben Machart
  rationale: מעשׂה bezeichnet hier die Bauweise oder handwerkliche Ausführung. Die Vergleichsform verweist auf den zuvor beschriebenen Bau.
- source_word: וּבַיִת יַעֲשֶׂה
  choice: ließ er ein Haus … bauen
  rationale: Das Yiqtol setzt in dieser Baubeschreibung den Bericht über Salomos Bauvorhaben fort. Die deutsche Kausativwendung entspricht dem königlichen Baukontext, ohne zu behaupten, Salomo habe persönlich gebaut.
- source_word: לְבַת פַּרְעֹה
  choice: für die Tochter des Pharaos
  rationale: Dies gibt die hebräische Genitivverbindung klar und idiomatisch wieder.
- source_word: אֲשֶׁר לָקַח שְׁלֹמֹה
  choice: die Salomo zur Frau genommen hatte
  rationale: לקח bedeutet wörtlich „nehmen“, wird bei einer Frau in diesem Zusammenhang aber idiomatisch für die Eheschließung gebraucht. Die Formulierung wahrt zugleich die Bildlichkeit des Hebräischen.
- source_word: כָּאוּלָם הַזֶּה
  choice: wie diese Halle
  rationale: אולם kann „Vorhalle“ oder „Halle“ bezeichnen. Im königlichen Bauzusammenhang ist „Halle“ eine natürliche Wiedergabe; der Vergleich bleibt ausdrücklich erhalten.
