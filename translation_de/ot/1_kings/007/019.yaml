  text: And the capitals that were on the tops of the pillars were made like a lily blossom in the portico[c][b][a], four cubits.
translation:
  language: de
  text: Und die Kapitelle oben auf den Säulen waren in der Vorhalle[a] als Lilienwerk[b] ausgeführt und vier Ellen[c] hoch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Eingangsraum“ beziehungsweise „an der Vorhalle“. Das hebräische Wort bezeichnet die Eingangshalle oder Vorhalle des Tempels.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Lilienarbeit“ oder „lilienförmiger Blütenschmuck“. Manche verstehen das hebräische Wort hier als Bezeichnung eines lotusförmigen Blütenschmucks.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich steht im Hebräischen nur: „vier Ellen“. Gemeint ist wahrscheinlich die Höhe des lilienförmig gestalteten Teils der Kapitelle.'
    reason: measurement_ambiguity
lexical_decisions:
- source_word: כֹתָרֹת
  choice: Kapitelle
  rationale: Im architektonischen Zusammenhang bezeichnet das Wort die bekrönenden oberen Teile der Säulen; „Kapitelle“ ist der klare moderne Fachausdruck.
- source_word: רֹאשׁ הָעַמּוּדִים
  choice: oben auf den Säulen
  rationale: Das wörtliche „auf dem Kopf der Säulen“ wird im Deutschen natürlich und räumlich präzise wiedergegeben.
- source_word: מַעֲשֵׂה שׁוּשַׁן
  choice: wie Lilienblüten gestaltet
  rationale: מַעֲשֵׂה bezeichnet hier Ausführung oder Gestaltung, שׁוּשַׁן eine Blume, gewöhnlich eine Lilie. Die Formulierung gibt den floralen Entwurf verständlich wieder, ohne die mögliche Bestimmung als Lotus zu verschweigen.
- source_word: בָּאוּלָם
  choice: in der Vorhalle
  rationale: אוּלָם bezeichnet die Eingangshalle beziehungsweise Vorhalle des Tempelgebäudes. „Vorhalle“ ist im heutigen Deutschen natürlich und weniger missverständlich als „Vorbau“.
- source_word: אַרְבַּע אַמּוֹת
  choice: vier Ellen hoch
  rationale: Der hebräische Text nennt nur „vier Ellen“; aus dem Bauzusammenhang ergibt sich wahrscheinlich eine Höhenangabe. Das ergänzte „hoch“ macht die deutsche Aussage verständlich, während die Fußnote die formale Kürze und verbleibende Unsicherheit des Hebräischen festhält.
