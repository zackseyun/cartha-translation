  - severity: low
    issue: „liefen“ für die gegossenen Schmuckformen
    rationale: Die Wendung ist nicht falsch, wirkt jedoch bei unbeweglichen, integral gegossenen Verzierungen weniger präzise als eine neutrale Ortsangabe.
