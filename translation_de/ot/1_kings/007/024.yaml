base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/024.yaml
  text: And gourds were under its rim all around[a], encircling it, ten to the cubit, surrounding the Sea all around. The gourds were in two rows, cast in one piece with it.
translation:
  language: de
  text: Unterhalb des Randes des Meeres befanden sich ringsum Kürbisornamente, die es umgaben, zehn auf jede Elle; sie umgaben das Meer ringsum. Die Kürbisornamente waren in zwei Reihen in einem Stück mit ihm gegossen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפְקָעִים
  choice: Kürbisornamente
  rationale: פְקָעִים bezeichnet hier dekorative, kürbisähnliche Formen. „Kürbisornamente“ gibt sowohl die Gestalt als auch die schmückende Funktion wieder, ohne eine bestimmte Pflanzenart festzulegen.
- source_word: מִתַּחַת לִשְׂפָתוֹ
  choice: unterhalb seines Randes
  rationale: שָׂפָה bedeutet wörtlich „Lippe“ beziehungsweise „Rand“; bei einem großen Becken ist „Rand“ im Deutschen die natürliche Sachbezeichnung.
- source_word: סָבִיב סֹבְבִים אֹתוֹ
  choice: liefen ringsum … um ihn herum
  rationale: Die hebräische Wiederholung verwandter Ausdrücke wird in natürlichem Deutsch erkennbar bewahrt.
- source_word: עֶשֶׂר בָּאַמָּה
  choice: zehn auf eine Elle
  rationale: Die Wendung bezeichnet am ehesten die Anzahl der Ornamente je Elle entlang des Umfangs; die knappe Formulierung vermeidet eine weitergehende Festlegung des Messverfahrens.
- source_word: מַקִּפִים אֶת הַיָּם סָבִיב
  choice: sie umgaben das Meer ringsum
  rationale: הַיָּם ist hier die Bezeichnung des großen gegossenen Beckens; „das Meer“ bleibt als Sachname erhalten. Das wiederholte „ringsum“ entspricht der Betonung des Ausgangstextes.
- source_word: שְׁנֵי טוּרִים
  choice: in zwei Reihen
  rationale: טוּרִים bezeichnet geordnete Reihen; die Präpositionalfügung ist im Deutschen syntaktisch passend.
- source_word: יְצֻקִים בִּיצֻקָתוֹ
  choice: in einem Stück mit ihm gegossen
  rationale: Die Wortverbindung aus passivem Partizip und verwandtem Substantiv zeigt, dass die Ornamente beim Guss des Beckens mitgeformt und nicht nachträglich angebracht wurden.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Wiederholung von „ringsum“ und „um … herum“ bewahrt die nachdrückliche Ausdrucksweise des Hebräischen, ohne unverständlich zu werden.
