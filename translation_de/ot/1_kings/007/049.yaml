id: 1KI.7.49
reference: 1 Kings 7:49
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אֶת הַ֠/מְּנֹרוֹת חָמֵ֨שׁ מִ/יָּמִ֜ין וְ/חָמֵ֧שׁ מִ/שְּׂמֹ֛אול לִ/פְנֵ֥י הַ/דְּבִ֖יר זָהָ֣ב סָג֑וּר וְ/הַ/פֶּ֧רַח וְ/הַ/נֵּרֹ֛ת וְ/הַ/מֶּלְקַחַ֖יִם זָהָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/049.yaml
  text: and the lampstands[a], five on the right and five on the left, before the inner sanctuary, of pure gold; and the flowers, the lamps, and the tongs[c][b], of gold.
translation:
  language: de
  text: dazu die Leuchter[a], fünf auf der rechten und fünf auf der linken Seite vor dem innersten Heiligtum, aus reinem Gold[b], sowie die Blüten, die Lampen und die Zangen[c] aus Gold.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint sind Ständer für Öllampen, nicht Kerzenleuchter.
    reason: Sachliche Klarstellung
  - marker: b
    text: 'Oder: geläutertem Gold.'
    reason: Lexikalische Alternative
  - marker: c
    text: 'Oder: Dochtscheren.'
    reason: Lexikalische Alternative
lexical_decisions:
- source_word: מְּנֹרוֹת
  choice: Leuchter
  rationale: מְנוֹרָה bezeichnet den Ständer für Öllampen, nicht die einzelnen Lampen. „Leuchter“ ist im Deutschen präzise und vermeidet das sachlich unpassende „Kerzenleuchter“.
- source_word: מִיָּמִין ... מִשְּׂמֹאול
  choice: auf der rechten ... auf der linken Seite
  rationale: Die hebräischen Ausdrücke bezeichnen unmittelbar rechts und links. Eine Deutung als Süden und Norden ist aufgrund der Tempelausrichtung möglich, wird aber nicht in den Haupttext eingetragen.
- source_word: לִפְנֵי הַדְּבִיר
  choice: vor dem innersten Heiligtum
  rationale: דְּבִיר bezeichnet den innersten Raum des Tempels. „Innerstes Heiligtum“ ist verständlich und wahrt den räumlichen Bezug.
- source_word: זָהָב סָגוּר
  choice: aus reinem Gold
  rationale: Die Wendung bezeichnet hochwertiges beziehungsweise geläutertes Gold. „Reines Gold“ ist eine natürliche deutsche Wiedergabe; die mögliche Nuance „geläutert“ wird in einer Fußnote genannt.
- source_word: הַפֶּרַח
  choice: die Blüten
  rationale: Das morphologisch singularische פֶּרַח bezeichnet hier kollektiv den Blütenschmuck der Leuchter; der deutsche Plural gibt diese verteilte Bedeutung natürlich wieder.
- source_word: הַנֵּרֹת
  choice: die Lampen
  rationale: Gemeint sind die einzelnen Öllampen, die zu den Leuchtern gehören.
- source_word: הַמֶּלְקַחַיִם
  choice: die Zangen
  rationale: Das Wort bezeichnet ein zangenartiges Gerät zur Pflege der Lampen. „Zangen“ ist die direkte lexikalische Entsprechung; „Dochtscheren“ wäre funktional deutender.
- source_word: זָהָב
  choice: aus Gold
  rationale: Das abschließende זָהָב bezieht sich auf Blüten, Lampen und Zangen. „Aus Gold“ bewahrt den Materialhinweis und den inventarartigen Stil.
theological_decisions:
- issue: Bezeichnung des דְּבִיר
  choice: innerstes Heiligtum
  alternative: Allerheiligstes
  rationale: Die gewählte Formulierung gibt zunächst die räumliche Bedeutung wieder, ohne eine stärker traditionsgeprägte Fachbezeichnung in den Haupttext einzutragen.
translation_notes:
  register: Moderner, würdiger Inventarstil. Das einleitende „dazu“ bildet das koordinierende וְאֶת in einem fortlaufenden Verzeichnis natürlich ab. Alle sachlich relevanten Mehrdeutigkeiten bleiben entweder im Haupttext erhalten oder werden knapp in Fußnoten ausgewiesen.
