  text: And on the top of the pillars was lily-work[b][a], and the work of the pillars was finished.
translation:
  language: de
  text: Auf den oberen Enden der Säulen befand sich eine Lilienverzierung[a], und die Arbeit an den Säulen war vollendet[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
