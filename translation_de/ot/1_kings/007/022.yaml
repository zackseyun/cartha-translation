lexical_decisions:
- source_word: רֹאשׁ
  choice: oben auf
  rationale: Im architektonischen Zusammenhang bezeichnet רֹאשׁ den oberen Teil der Säulen. „Oben auf“ ist natürliches modernes Deutsch und vermeidet die technisch engere Festlegung auf „Kapitell“.
- source_word: הָעַמּוּדִים
  choice: den Säulen
  rationale: עַמּוּדִים bezeichnet Säulen oder Pfeiler; im Zusammenhang mit den beiden freistehenden Tempelsäulen ist „Säulen“ die geläufige und passende Wiedergabe.
- source_word: מַעֲשֵׂה
  choice: Verzierung
  rationale: מַעֲשֵׂה kann Werk, Arbeit oder Erzeugnis bedeuten. Zusammen mit שׁוֹשָׁן bezeichnet es hier am ehesten die ausgeführte ornamentale Gestaltung.
- source_word: שׁוֹשָׁן
  choice: in Lilienform
  rationale: שׁוֹשָׁן bezeichnet gewöhnlich eine Lilie, kann in Baubeschreibungen jedoch ein lilienförmiges Ornament meinen. „In Lilienform“ bringt diesen dekorativen Sinn klar zum Ausdruck, ohne die Pflanzenbestimmung weiter einzuengen.
- source_word: וַתִּתֹּם
  choice: waren ... abgeschlossen
  rationale: Das Verb תמם drückt Vollendung oder Abschluss aus. Die deutsche Formulierung gibt den idiomatischen Sinn des hebräischen Satzes natürlich wieder.
- source_word: מְלֶאכֶת
  choice: die Arbeiten
  rationale: מְלָאכָה bezeichnet Arbeit beziehungsweise ausgeführtes Werk. Der Plural „Arbeiten“ ist im Deutschen für Bau- und Gestaltungsarbeiten idiomatisch und bewahrt die inhaltliche Breite.
