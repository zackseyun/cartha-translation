  text: The workmanship of the wheels was like the workmanship of a chariot wheel[a]; their axles, their rims, their spokes[b], and their hubs were all cast metal.
translation:
  language: de
  text: Die Machart der Räder glich der eines Streitwagenrades. Ihre Achsen[a], ihre Felgen, ihre Speichen[b] und ihre Naben waren alle gegossen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihre Halterungen« beziehungsweise »ihre Achsteile«. Das hebräische Wort hängt mit »Hand« zusammen; seine genaue technische Bedeutung ist hier unsicher.'
    reason: lexical_alternative
  - marker: b
    text: Die mit »Speichen« und »Naben« wiedergegebenen hebräischen Fachwörter sind selten. Möglich sind für sie auch Bedeutungen wie »Bänder« sowie »Streben« oder »Befestigungen«.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲשֵׂה הָאוֹפַנִּים / כְּמַעֲשֵׂה אוֹפַן
  choice: Die Räder waren gearbeitet wie die Räder
  rationale: מַעֲשֶׂה bezeichnet hier Machart oder Ausführung. Die verbale Formulierung gibt den Vergleich natürlich wieder, ohne den handwerklichen Aspekt zu verlieren.
- source_word: הַמֶּרְכָּבָה
  choice: Streitwagen
  rationale: מֶרְכָּבָה bezeichnet in diesem antiken Zusammenhang einen Wagen, gewöhnlich einen Streitwagen; die Wiedergabe wahrt den historischen Kontext.
- source_word: יְדוֹתָם
  choice: Achsen
  rationale: Das Wort ist von יָד, »Hand«, abgeleitet, bezeichnet in der Aufzählung von Radteilen aber wahrscheinlich Achsenteile oder tragende Verbindungen. »Achsen« ist die verständlichste kontextuelle Wiedergabe.
- source_word: גַבֵּיהֶם
  choice: Felgen
  rationale: Wörtlich mit »Rücken« verbunden, bezeichnet der Ausdruck im Radkontext wahrscheinlich die äußeren Radkränze; »Felgen« ist modernes, allgemein verständliches Deutsch.
- source_word: חִשֻּׁקֵיהֶם
  choice: Speichen
  rationale: Der seltene technische Ausdruck wird im Zusammenhang der Radkonstruktion meist als die verbindenden Teile zwischen Nabe und Felge verstanden; die genaue Bedeutung bleibt unsicher und wird in einer Fußnote kenntlich gemacht.
- source_word: חִשֻּׁרֵיהֶם
  choice: Naben
  rationale: Der ebenfalls seltene Ausdruck bezeichnet wahrscheinlich zentrale Radteile oder Befestigungen. »Naben« passt zur Aufzählung der Radbestandteile, bleibt jedoch erschlossen.
- source_word: הַכֹּל מוּצָק
  choice: waren vollständig aus Metall gegossen
  rationale: מוּצָק bezeichnet gegossene Arbeit. Die Ergänzung »aus Metall« macht den im Herstellungskontext vorausgesetzten Werkstoff im Deutschen verständlich; הַכֹּל wird distributiv auf sämtliche genannten Teile bezogen.
