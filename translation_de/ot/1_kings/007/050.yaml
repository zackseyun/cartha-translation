base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/050.yaml
  text: and the basins[a], the snuffers, the bowls, the cups, and the firepans, of pure gold; and the hinges for the doors of the inner house, for the Most Holy Place, and for the doors of the house, that is, the nave[d][c][b], of gold.
translation:
  language: de
  text: dazu die Becken, die Dochtscheren, die Sprengschalen[a], die Schälchen und die Feuerpfannen aus reinem Gold sowie die Drehlager[b] für die Türen des inneren Tempelraums, des Allerheiligsten[c], und für die Türen des Tempelhauses, des Hauptraums – ebenfalls aus Gold.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die Sprengbecken.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint sind vermutlich Zapfenlager oder ähnliche Beschläge, in denen sich die Türen drehten; traditionell wird auch „Türangeln“ übersetzt.
    reason: cultural_note
  - marker: c
    text: 'Wörtlich: „des Heiligen der Heiligkeiten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּפּוֹת
  choice: die Becken
  rationale: In der Aufzählung von Tempelgeräten bezeichnet das Wort am ehesten größere Gefäße. „Becken“ unterscheidet sie von den später genannten מִזְרָקוֹת.
- source_word: הַמְזַמְּרוֹת
  choice: die Dochtscheren
  rationale: Im Heiligtumskontext sind Geräte zum Beschneiden der Lampendochte gemeint, nicht Winzermesser oder Gartenscheren.
- source_word: הַמִּזְרָקוֹת
  choice: die Sprengschalen
  rationale: Das Wort bezeichnet Schalen für den rituellen Umgang mit Flüssigkeiten, insbesondere zum Sprengen; die kultische Funktion wird im Deutschen knapp ausgedrückt.
- source_word: הַכַּפּוֹת
  choice: die Schälchen
  rationale: Das Wort bezeichnet hier kleine, hohle Gefäße. „Schälchen“ vermeidet die zu enge Festlegung auf Löffel oder Räuchergefäße.
- source_word: הַמַּחְתּוֹת
  choice: die Feuerpfannen
  rationale: Gemeint sind Pfannen zum Aufnehmen und Tragen glühender Kohlen; „Räucherpfannen“ würde den Gebrauch unnötig verengen.
- source_word: זָהָב סָגוּר
  choice: aus reinem Gold
  rationale: Die feste Verbindung bezeichnet hochwertiges beziehungsweise geläutertes Gold; „reines Gold“ ist die natürliche deutsche Wiedergabe.
- source_word: הַפֹּתוֹת
  choice: die Drehlager
  rationale: Gemeint sind die Beschläge beziehungsweise Lager, in denen sich antike Türen um ihre Zapfen drehten. „Drehlager“ ist sachlich genauer als das leicht modern missverständliche „Scharniere“.
- source_word: הַבַּיִת הַפְּנִימִי
  choice: des inneren Tempelraums
  rationale: Der Ausdruck bezeichnet den inneren Raum des Tempelhauses; „Tempelraum“ macht den Bezug im Deutschen verständlich, ohne den folgenden Namen vorwegzunehmen.
- source_word: לְקֹדֶשׁ הַקֳּדָשִׁים
  choice: des Allerheiligsten
  rationale: Die deutsche traditionelle und zugleich verständliche Bezeichnung gibt die hebräische Intensiv- beziehungsweise Superlativkonstruktion angemessen wieder.
- source_word: לְדַלְתֵי הַבַּיִת לַהֵיכָל
  choice: für die Türen des Tempelhauses, des Hauptraums
  rationale: הֵיכָל bezeichnet hier den großen Hauptraum im Unterschied zum innersten Raum. Die Apposition bleibt erhalten, ohne das im Deutschen kirchenbaulich geprägte „Schiff“ zu verwenden.
- source_word: זָהָב
  choice: ebenfalls aus Gold
  rationale: Das abschließende Nomen nennt erneut das Material, nun für die Türbeschläge; „ebenfalls“ verdeutlicht die Wiederaufnahme im deutschen Satz.
theological_decisions:
- issue: Wiedergabe von קֹדֶשׁ הַקֳּדָשִׁים
  choice: Allerheiligstes
  alternative: Heiligstes der Heiligtümer
  rationale: „Allerheiligstes“ ist im modernen Deutschen klar und gibt den hebräischen Superlativ wieder, ohne eine zusätzliche theologische Deutung einzutragen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die lange hebräische Inventarliste bleibt als ein Satz erhalten; „dazu“ bindet den Vers an den vorausgehenden Kontext an. Fachlich notwendige Bezeichnungen werden möglichst anschaulich formuliert, während unsichere Einzelheiten in Fußnoten offengelegt werden.
