base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/018.yaml
  text: He made the pillars[a], and two rows all around on the one latticework, to cover the capitals that were on top of the pomegranates[b]; and so he did for the second capital.
translation:
  language: de
  text: Er fertigte die Säulen und brachte an dem einen Flechtwerk ringsum zwei Reihen an, um die Kapitelle zu bedecken, die oben auf den Granatäpfeln[a] waren; ebenso machte er es mit dem zweiten Kapitell.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht wörtlich „die Granatäpfel“, wahrscheinlich als Bezeichnung granatapfelförmiger Zierelemente. Der hebräische Satzbau dieses Verses ist schwierig; manche verstehen die beiden Reihen als Teil des Granatapfelschmucks rings um das Flechtwerk jedes Kapitells.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Er fertigte
  rationale: Das häufige Verb עשה bedeutet „machen“ oder „anfertigen“; im Zusammenhang kunsthandwerklicher Bauarbeiten ist „fertigte“ natürlich und präzise.
- source_word: הָעַמּוּדִים
  choice: die Säulen
  rationale: Im architektonischen Zusammenhang bezeichnet עַמּוּד die Säulen des Tempelvorbaus; „Säulen“ ist der übliche deutsche Ausdruck.
- source_word: שְׁנֵי טוּרִים
  choice: zwei Reihen
  rationale: טוּר bezeichnet eine geordnete Reihe; die Wiedergabe bleibt hinsichtlich der genauen Anordnung des Schmucks offen.
- source_word: סָבִיב
  choice: ringsum
  rationale: Gibt die umlaufende räumliche Anordnung knapp und idiomatisch wieder.
- source_word: הַשְּׂבָכָה
  choice: das Flechtwerk
  rationale: Das Wort bezeichnet ein netz- oder gitterartiges Zierwerk. „Flechtwerk“ ist anschaulich und entspricht dem architektonischen Kontext.
- source_word: הָאֶחָת
  choice: das eine
  rationale: Der bestimmte Zahlbegriff verweist auf eines von zwei entsprechenden Flechtwerken, ohne ausdrücklich „das erste“ zu sagen.
- source_word: לְכַסּוֹת
  choice: um ... zu bedecken
  rationale: Der Infinitiv mit לְ drückt hier den Zweck aus; „bedecken“ bewahrt den direkten Wortsinn.
- source_word: הַכֹּתָרֹת
  choice: die Kapitelle
  rationale: כֹּתֶרֶת ist hier der architektonische Fachbegriff für den oberen Abschluss einer Säule.
- source_word: אֲשֶׁר עַל רֹאשׁ
  choice: die oben auf ... waren
  rationale: Die Formulierung gibt die räumliche Aussage des hebräischen Ausdrucks wieder, ohne die schwierige Konstruktion zu glätten.
- source_word: הָרִמֹּנִים
  choice: die Granatäpfel
  rationale: Die wörtliche Bezeichnung wird beibehalten; wahrscheinlich sind granatapfelförmige Zierelemente gemeint, was die Fußnote erläutert.
- source_word: וְכֵן עָשָׂה
  choice: ebenso machte er es
  rationale: Die Wendung zeigt, dass dieselbe Ausführung am entsprechenden zweiten Bauteil wiederholt wurde.
- source_word: לַכֹּתֶרֶת הַשֵּׁנִית
  choice: mit dem zweiten Kapitell
  rationale: Gibt den Bezug auf das entsprechende Kapitell der zweiten Säule direkt wieder.
