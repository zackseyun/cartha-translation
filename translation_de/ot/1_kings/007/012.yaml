  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/חָצֵ֨ר הַ/גְּדוֹלָ֜ה סָבִ֗יב שְׁלֹשָׁה֙ טוּרִ֣ים גָּזִ֔ית וְ/ט֖וּר כְּרֻתֹ֣ת אֲרָזִ֑ים וְ/לַ/חֲצַ֧ר בֵּית יְהוָ֛ה הַ/פְּנִימִ֖ית וּ/לְ/אֻלָ֥ם הַ/בָּֽיִת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/012.yaml
  text: And the great court all around had three rows of cut stone and a row of cedar beams[c][b][a], like the inner court of the house of Yahweh and the vestibule of the house.
translation:
  language: de
  text: Der große Vorhof war ringsum von drei Reihen behauener Steine und einer Reihe Zedernbalken umgeben[b], ebenso der innere Vorhof des Hauses Jahwes und die Vorhalle des Hauses[a][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und für den inneren Vorhof des Hauses Jahwes und für die Vorhalle des Hauses“. Die hebräische Präposition kann eine Entsprechung oder eine Zuordnung ausdrücken.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „drei Lagen aus behauenen Steinen und eine Lage aus Zedernbalken“.'
    reason: lexical_alternative
  - marker: c
    text: Gemeint ist die Eingangshalle des eigentlichen Tempelgebäudes.
    reason: cultural_note
lexical_decisions:
- source_word: חָצֵר הַגְּדוֹלָה
  choice: der große Vorhof
  rationale: חָצֵר bezeichnet einen umschlossenen Hof. Im Zusammenhang mit dem Tempel ist „Vorhof“ die natürliche und allgemein verständliche deutsche Bezeichnung.
- source_word: סָבִיב
  choice: ringsum
  rationale: Das Adverb bezeichnet die allseitige Umfassung und wird im Deutschen knapp und idiomatisch wiedergegeben.
- source_word: שְׁלֹשָׁה טוּרִים גָּזִית
  choice: drei Reihen behauener Steine
  rationale: טוּר bezeichnet hier eine Reihe beziehungsweise Mauerlage; גָּזִית sind bearbeitete, behauene Steine. „Reihen“ bleibt allgemein verständlich, während die technischere Alternative in der Fußnote genannt wird.
- source_word: וְטוּר כְּרֻתֹת אֲרָזִים
  choice: und einer Reihe Zedernbalken
  rationale: כְּרֻתֹת bezeichnet wörtlich zugeschnittene Stücke; im Bauzusammenhang sind zugeschnittene Zedernhölzer beziehungsweise Balken gemeint.
- source_word: וְלַחֲצַר בֵּית יְהוָה הַפְּנִימִית וּלְאֻלָם הַבָּיִת
  choice: ebenso der innere Vorhof des Hauses Jahwes und die Vorhalle des Hauses
  rationale: Die wiederholte Präposition ל kann hier eine Entsprechung anzeigen. „Ebenso“ macht den elliptischen Vergleich im Deutschen verständlich, ohne die mögliche relationale Lesart zu verschweigen.
- source_word: אֻלָם
  choice: Vorhalle
  rationale: Das Wort bezeichnet die dem Tempelhaus vorgelagerte Eingangshalle; „Vorhalle“ ist präzise, natürlich und verständlich.
- source_word: הַבָּיִת
  choice: das Haus
  rationale: בַּיִת meint hier das eigentliche Tempelgebäude. „Haus“ bewahrt die hebräische Ausdrucksweise; die Fußnote verdeutlicht den architektonischen Bezug.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich das Tetragramm; „Jahwe“ gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Funktion der Präposition ל bei innerem Vorhof und Vorhalle
  choice: 'als Kennzeichnung entsprechender Bauweise: „ebenso“'
  alternative: 'relationale Zuordnung: „und für den inneren Vorhof … und für die Vorhalle“'
  rationale: Im Baukontext ist die Vergleichs- beziehungsweise Entsprechungslesart wahrscheinlich. Da die hebräische Form auch relational verstanden werden kann, wird diese echte Mehrdeutigkeit in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur wurde für natürliche Lesbarkeit leicht expliziert; die architektonische und syntaktische Mehrdeutigkeit des Hebräischen bleibt durch Fußnoten sichtbar.
