base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/039.yaml
  text: He placed five stands on the right side of the house and five on the left side of the house[a], and he placed the Sea on the southeast side of the house.
translation:
  language: de
  text: Er stellte fünf Gestelle auf der rechten Seite des Hauses auf und fünf auf der linken Seite des Hauses. Das Meer stellte er auf der rechten Seite des Hauses auf, nach Osten hin, gegenüber dem Süden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die knappe hebräische Ortsangabe lautet wörtlich etwa: „an der rechten Seite des Hauses, nach Osten hin, gegenüber dem Süden“. Gemeint ist vermutlich der südöstliche Bereich des Hauses.'
    reason: Die räumliche Beziehung der drei Angaben ist im Hebräischen kompakt formuliert; die Fußnote erläutert die wahrscheinliche Lage, ohne die Mehrdeutigkeit im Haupttext aufzulösen.
lexical_decisions:
- source_word: הַמְּכֹנוֹת
  choice: Gestelle
  rationale: Im Zusammenhang bezeichnet das Wort die fahrbaren bronzenen Unterbauten der Becken. „Gestelle“ gibt ihre tragende Funktion natürlich wieder, ohne die Beweglichkeit überzubetonen.
- source_word: כֶּתֶף
  choice: Seite
  rationale: Wörtlich „Schulter“; in räumlich-architektonischer Verwendung bezeichnet es die Seite eines Bauwerks.
- source_word: הַבַּיִת
  choice: das Haus
  rationale: Bewahrt die konkrete hebräische Bezeichnung; aus dem Zusammenhang ist klar, dass das Tempelhaus gemeint ist.
- source_word: מִיָּמִין / מִשְּׂמֹאלוֹ
  choice: an die rechte Seite / an die linke Seite
  rationale: Die körperbezogene Orientierung des Hebräischen bleibt erhalten, statt sie stillschweigend in Süd und Nord umzuwandeln.
- source_word: הַיָּם
  choice: das Meer
  rationale: Traditionelle und quellennah verständliche Bezeichnung für das große gegossene Wasserbecken des Tempels.
- source_word: הַיְמָנִית קֵדְמָה מִמּוּל נֶגֶב
  choice: an der rechten Seite des Hauses, nach Osten hin, gegenüber dem Süden
  rationale: Die kompakte und etwas schwierige räumliche Folge wird möglichst formal bewahrt, statt eindeutig zu „Südostseite“ geglättet zu werden.
