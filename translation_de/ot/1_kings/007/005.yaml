lexical_decisions:
- source_word: פְּתָחִים
  choice: Türöffnungen
  rationale: פֶּתַח bezeichnet eine Öffnung oder einen Eingang. „Türöffnungen“ passt zum baulichen Zusammenhang und vermeidet die Vorstellung beweglicher Türflügel.
- source_word: מְּזוּזוֹת
  choice: Türpfosten
  rationale: מְזוּזָה bezeichnet die seitlichen Pfosten beziehungsweise Laibungen eines Durchgangs; „Türpfosten“ ist allgemein verständlich und architektonisch passend.
- source_word: רְבֻעִים
  choice: viereckige
  rationale: Das Wort bezeichnet eine vierseitige beziehungsweise rechtwinklige Form. „Viereckig“ bewahrt diese Aussage, ohne zwingend ein geometrisch vollkommenes Quadrat vorauszusetzen.
- source_word: שָׁקֶף
  choice: Rahmen
  rationale: Der seltene Architekturbegriff kann den Rahmen, besonders möglicherweise dessen oberen Teil oder den Sturz, bezeichnen. „Rahmen“ gibt den baulichen Sinn wieder, ohne ihn unnötig auf den Türsturz zu verengen.
- source_word: מֶחֱזָה
  choice: Fenster
  rationale: Im Zusammenhang der Gebäudebeschreibung bezeichnet מֶחֱזָה am wahrscheinlichsten ein Fenster beziehungsweise eine Sichtöffnung. „Fenster“ ist im Deutschen die klare architektonische Entsprechung.
- source_word: מוּל מֶחֱזָה אֶל מֶחֱזָה
  choice: lag Fenster gegenüber Fenster
  rationale: Die Formulierung bewahrt die wechselseitige Gegenüberstellung des Hebräischen und bleibt im Deutschen verständlich.
- source_word: שָׁלֹשׁ פְּעָמִים
  choice: dreimal
  rationale: Dies entspricht der formalen Aussage des Hebräischen. Die wahrscheinlich gemeinte räumliche Anordnung in drei Reihen oder Stockwerken wird in einer Fußnote erläutert, statt sie im Haupttext festzulegen.
