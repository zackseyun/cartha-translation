  text: וְ/אֶת הַ/סִּיר֨וֹת וְ/אֶת הַ/יָּעִ֜ים וְ/אֶת הַ/מִּזְרָק֗וֹת וְ/אֵת֙ כָּל הַ/כֵּלִ֣ים ה/אהל אֲשֶׁ֨ר עָשָׂ֥ה חִירָ֛ם לַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה בֵּ֣ית יְהוָ֑ה נְחֹ֖שֶׁת מְמֹרָֽט־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/045.yaml
  text: and the pots[a], the shovels, the basins[c][b], and all these vessels that Hiram made for King Solomon for the house of Yahweh were of burnished bronze.
translation:
  language: de
  text: Die Töpfe, die Schaufeln und die Sprengschalen sowie alle diese Geräte, die Hiram für König Salomo für das Haus Jahwes anfertigte, waren aus glänzend polierter Bronze.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַסִּירוֹת
  choice: die Töpfe
  rationale: סִירוֹת bezeichnet Töpfe oder Kessel; »Töpfe« ist in der Aufzählung der Tempelgeräte natürlich und nicht unnötig spezifisch.
- source_word: הַיָּעִים
  choice: die Schaufeln
  rationale: יָעִים sind Geräte zum Entfernen von Asche oder zum Bewegen von Material am Altar; »Schaufeln« trifft die Funktion.
- source_word: הַמִּזְרָקוֹת
  choice: die Sprengschalen
  rationale: מִזְרָקוֹת bezeichnet kultische Schalen zum Auffangen oder Versprengen von Flüssigkeiten; »Sprengschalen« gibt den Tempelkontext präzise wieder.
- source_word: כָּל הַכֵּלִים הָאֵלֶּה
  choice: alle diese Geräte
  rationale: כֵּלִים ist ein weiter Sammelbegriff für Gefäße und Gerätschaften; »Geräte« umfasst die zuvor genannten Gegenstände idiomatisch.
- source_word: עָשָׂה
  choice: anfertigte
  rationale: »Anfertigte« gibt das Herstellen handwerklich gefertigter Tempelgeräte natürlich wieder, ohne über den hebräischen Sinn hinauszugehen.
- source_word: חִירָם
  choice: Hiram
  rationale: Die Namensform חִירָם wird im Deutschen üblich als »Hiram« wiedergegeben.
- source_word: לַמֶּלֶךְ שְׁלֹמֹה
  choice: für König Salomo
  rationale: Das ל bezeichnet hier den Auftraggeber beziehungsweise Begünstigten; »für König Salomo« ist die natürliche deutsche Fassung.
- source_word: בֵּית יְהוָה
  choice: für das Haus Jahwes
  rationale: בֵּית bedeutet wörtlich »Haus«; die Wiederholung von »für« macht deutlich, dass die Geräte für den Gebrauch im Heiligtum bestimmt waren.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: נְחֹשֶׁת
  choice: Bronze
  rationale: Im Zusammenhang antiker Tempelgeräte ist »Bronze« die sachlich und traditionell passende Wiedergabe; »Messing« wäre historisch weniger wahrscheinlich.
- source_word: מְמֹרָט
  choice: glänzend poliert
  rationale: Das Wort bezeichnet geglättetes beziehungsweise auf Hochglanz poliertes Metall; die Formulierung gibt die sichtbare Beschaffenheit in verständlichem Deutsch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen Gottes. »Jahwe« bewahrt ihn als Namen, während »der HERR« ihn durch einen traditionellen Titel ersetzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der im Hebräischen nur nominal angefügte Werkstoff wird in einem eigenen Satz als Prädikat der gesamten Aufzählung ausgedrückt; so bleibt der Bezug eindeutig und der deutsche Satz gut lesbar.
