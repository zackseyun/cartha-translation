source:
  edition: WLC
  text: וּ/מְיֻסָּ֕ד אֲבָנִ֥ים יְקָר֖וֹת אֲבָנִ֣ים גְּדֹל֑וֹת אַבְנֵי֙ עֶ֣שֶׂר אַמּ֔וֹת וְ/אַבְנֵ֖י שְׁמֹנֶ֥ה אַמּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/010.yaml
  text: And the foundation was of costly stones[a], large stones, stones of ten cubits and stones of eight cubits.
translation:
  language: de
  text: Und das Fundament bestand aus kostbaren Steinen[a], aus großen Steinen, aus Steinen von zehn Ellen und aus Steinen von acht Ellen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wertvollen Steinen“. Das hebräische Wort betont den hohen Wert beziehungsweise die hohe Qualität der Steine; im Zusammenhang des Bauwerks bezeichnet es wahrscheinlich keine Edelsteine.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְיֻסָּד
  choice: Und das Fundament bestand
  rationale: Das passive Partizip von יסד steht hier im architektonischen Zusammenhang prädikativ beziehungsweise substantivisch. Die Wiedergabe macht das im Hebräischen vorausgesetzte Fundament natürlich kenntlich, ohne eine zusätzliche Handlung einzutragen.
- source_word: אֲבָנִים יְקָרוֹת
  choice: aus kostbaren Steinen
  rationale: יְקָרוֹת bezeichnet hohen Wert beziehungsweise hohe Qualität. „Kostbar“ bewahrt diese Bedeutung; die Fußnote stellt klar, dass hier keine Edelsteine gemeint sein müssen.
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: aus großen Steinen
  rationale: גְּדֹלוֹת bezeichnet hier die beträchtliche physische Größe der Bausteine.
- source_word: אַבְנֵי עֶשֶׂר אַמּוֹת
  choice: aus Steinen von zehn Ellen
  rationale: Die Status-constructus-Verbindung gibt ein Maß der Steine an, ohne die betreffende Ausdehnungsachse zu nennen. Die Übersetzung lässt diese Unbestimmtheit bestehen.
- source_word: וְאַבְנֵי שְׁמֹנֶה אַמּוֹת
  choice: und aus Steinen von acht Ellen
  rationale: Die parallele Formulierung bildet die hebräische Struktur ab und lässt ebenfalls offen, welche Abmessung gemeint ist.
- source_word: אַמּוֹת
  choice: Ellen
  rationale: „Elle“ ist die herkömmliche deutsche Bezeichnung für das antike Längenmaß und vermeidet eine nur annähernde moderne Umrechnung im Haupttext.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Wendung „aus Steinen“ bewahrt die aufzählende, monumentale Wirkung des Hebräischen. Die Maße werden nicht modern umgerechnet, und die im Ausgangstext nicht genannte Abmessungsrichtung wird nicht ergänzt.
