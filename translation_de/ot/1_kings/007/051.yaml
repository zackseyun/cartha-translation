  source_fidelity: 'Der Entwurf gibt Aufbau und Sinn des Hebräischen insgesamt zutreffend wieder: die Vollendung des gesamten Werks, die Einbringung der David zugeordneten heiligen Gegenstände sowie deren Lagerung in den Schatzkammern. „Am Haus Jahwes“ ist jedoch für die hebräische Konstruktion weniger klar und natürlich als „für das Haus Jahwes“.'
  naturalness: Der Satz ist gut verständlich und im würdigen modernen Standarddeutsch gehalten. „Für das Haus Jahwes“ ist idiomatischer als „am Haus Jahwes“; „die heiligen Gaben“ ist als Bezeichnung für geweihte Wertgegenstände natürlicher als „die geheiligten Dinge“.
  terminology: „Jahwe“, „Haus Jahwes“, „Silber“, „Gold“, „Geräte“ und „Schatzkammern“ sind angemessen. קָדְשֵׁי bezeichnet heilige bzw. geweihte Gegenstände; „heilige Gaben“ gibt dies knapp und idiomatisch wieder, ohne die Gegenstände funktional weiter einzuengen. Die Fußnote hält die mögliche stärker formale Wiedergabe fest.
