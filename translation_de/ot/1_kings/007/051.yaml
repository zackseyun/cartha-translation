  text: וַ/תִּשְׁלַם֙ כָּל הַ/מְּלָאכָ֔ה אֲשֶׁ֥ר עָשָׂ֛ה הַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה בֵּ֣ית יְהוָ֑ה וַ/יָּבֵ֨א שְׁלֹמֹ֜ה אֶת קָדְשֵׁ֣י דָּוִ֣ד אָבִ֗י/ו אֶת הַ/כֶּ֤סֶף וְ/אֶת הַ/זָּהָב֙ וְ/אֶת הַ/כֵּלִ֔ים נָתַ֕ן בְּ/אֹצְר֖וֹת בֵּ֥ית יְהוָֽה־־׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/051.yaml
  text: So all the work that King Solomon did for the house of Yahweh was finished. And Solomon brought in the holy things of David his father—the silver[a], the gold, and the vessels—and put them in the treasuries of the house of Yahweh.
translation:
  language: de
  text: So wurde die ganze Arbeit vollendet, die König Salomo für das Haus Jahwes ausgeführt hatte. Salomo brachte die heiligen Gaben[a] seines Vaters David hinein – das Silber, das Gold und die Geräte – und legte sie in die Schatzkammern des Hauses Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die geweihten Dinge seines Vaters David“. Gemeint sind Gegenstände, die für Jahwe ausgesondert und ihm geweiht worden waren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשְׁלַם כָּל הַמְּלָאכָה
  choice: So wurde die ganze Arbeit vollendet
  rationale: Das Verb שׁלם bezeichnet hier das Vollendetsein des gesamten Bau- und Ausstattungswerks. Die passive deutsche Form gibt das Ergebnis idiomatisch wieder.
- source_word: אֲשֶׁר עָשָׂה הַמֶּלֶךְ שְׁלֹמֹה
  choice: die König Salomo ... ausgeführt hatte
  rationale: עשׂה ist allgemein „tun/machen“; bei einem Bauvorhaben ist „Arbeit ausführen“ natürlich. Das Plusquamperfekt verdeutlicht, dass diese Arbeit bei ihrer Vollendung bereits ausgeführt war.
- source_word: בֵּית יְהוָה
  choice: Haus Jahwes
  rationale: „Haus“ bewahrt das konkrete hebräische Bild und ist im Tempelkontext verständlich. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: וַיָּבֵא
  choice: brachte ... hinein
  rationale: Der Hifil von בוא bedeutet „hineinbringen“; die Richtungsangabe passt zur anschließenden Unterbringung in den Schatzkammern.
- source_word: קָדְשֵׁי דָּוִד אָבִיו
  choice: die geheiligten Dinge seines Vaters David
  rationale: קָדְשֵׁי bezeichnet Dinge, die für Gott ausgesondert beziehungsweise geweiht wurden. „Geheiligte Dinge“ bewahrt den Bezug zum Wortfeld der Heiligkeit, ohne die Gegenstände enger zu bestimmen als der Text.
- source_word: הַכֶּסֶף וְאֶת הַזָּהָב וְאֶת הַכֵּלִים
  choice: das Silber, das Gold und die Geräte
  rationale: כְּלִים ist ein weiter Begriff für Gegenstände, Geräte oder Gefäße. „Geräte“ bleibt im Tempelkontext hinreichend offen.
- source_word: נָתַן בְּאֹצְרוֹת
  choice: legte sie in die Schatzkammern
  rationale: נתן kann in diesem Zusammenhang „legen/unterbringen“ bedeuten; אֹצְרוֹת bezeichnet mehrere Vorrats- oder Schatzräume.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich den Eigennamen יהוה. „Jahwe“ macht den Bundesnamen im deutschen Haupttext sichtbar, statt ihn durch einen Titel zu ersetzen.
- issue: Charakter der קָדְשֵׁי Davids
  choice: geheiligte Dinge
  alternative: Weihegaben
  rationale: Der Text nennt ausgesonderte heilige Gegenstände und erläutert sie als Silber, Gold und Geräte. Die gewählte Formulierung wahrt diese Breite und legt nicht fest, ob jeder Gegenstand als Gabe im engeren Sinn zu verstehen ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, wird aber durch Gedankenstriche so gegliedert, dass die erläuternde Aufzählung klar erkennbar ist.
