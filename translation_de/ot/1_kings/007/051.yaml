    issue: „die geheiligten Dinge“
    rationale: Diese Formulierung kann auf einen erfolgten Heiligungsakt fokussieren und klingt etwas technisch. „Die heiligen Gaben“ bezeichnet die im Text gemeinten David zugeordneten, für Jahwe ausgesonderten Wertgegenstände natürlicher; die Fußnote wahrt die alternative Lesart „geweihte Dinge“.
