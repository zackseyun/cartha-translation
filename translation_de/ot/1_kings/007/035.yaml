source:
  edition: WLC
  text: וּ/בְ/רֹ֣אשׁ הַ/מְּכוֹנָ֗ה חֲצִ֧י הָ/אַמָּ֛ה קוֹמָ֖ה עָגֹ֣ל סָבִ֑יב וְ/עַ֨ל רֹ֤אשׁ הַ/מְּכֹנָה֙ יְדֹתֶ֔י/הָ וּ/מִסְגְּרֹתֶ֖י/הָ מִמֶּֽ/נָּה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/035.yaml
  text: And on the top of the stand there was a round rim all around[a], half a cubit high[b]; and on the top of the stand its supports and its panels were of one piece with it.
translation:
  language: de
  text: Oben am Gestell befand sich ringsum eine runde Erhöhung von einer halben Elle Höhe. Oben am Gestell waren seine Halterungen[a] und seine Felder[b] aus einem Stück mit ihm gefertigt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Griffe«. Das hebräische Wort bedeutet wörtlich »seine Hände« und kann vorspringende Teile des Gestells bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Rahmen« beziehungsweise »Einfassungen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרֹאשׁ הַמְּכוֹנָה
  choice: Oben am Gestell
  rationale: רֹאשׁ bezeichnet hier den oberen Teil; מְכוֹנָה ist in diesem Abschnitt das bronzene fahrbare Gestell.
- source_word: חֲצִי הָאַמָּה קוֹמָה עָגֹל סָבִיב
  choice: ringsum eine runde Erhöhung von einer halben Elle Höhe
  rationale: Der hebräische Text nennt keinen ausdrücklichen Gegenstand zu »rund«; »Erhöhung« gibt die bauliche Form zurückhaltend und verständlich wieder, während עָגֹל סָבִיב und das Höhenmaß erhalten bleiben.
- source_word: יְדֹתֶיהָ
  choice: seine Halterungen
  rationale: יָד bedeutet wörtlich »Hand«, kann bei Gegenständen aber vorspringende Teile, Griffe oder tragende Halterungen bezeichnen. Im baulichen Zusammenhang ist »Halterungen« plausibel, ohne die Alternative auszuschließen.
- source_word: וּמִסְגְּרֹתֶיהָ
  choice: und seine Felder
  rationale: מִסְגְּרוֹת bezeichnet hier wahrscheinlich gerahmte Flächen oder Felder des Gestells; »Felder« ist im Deutschen für die beschriebenen Bauteile natürlich, »Rahmen« bleibt möglich.
- source_word: מִמֶּנָּה
  choice: aus einem Stück mit ihm gefertigt
  rationale: Wörtlich »aus/von ihm«; im handwerklichen Zusammenhang wird damit ausgedrückt, dass die Teile zum Gestell selbst gehörten und nicht gesondert angesetzt waren.
theological_decisions: []
translation_notes:
  register: Moderne, sachlich-würdevolle Sprache für eine technische Baubeschreibung. Die im Hebräischen nicht ausdrücklich benannte runde Konstruktion wird vorsichtig als »Erhöhung« bezeichnet; unsichere Bezeichnungen einzelner Bauteile werden in Fußnoten offengehalten.
