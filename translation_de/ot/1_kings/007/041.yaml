base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/041.yaml
  text: the two pillars[a], and the two bowls of the capitals that were on the tops of the pillars, and the two latticeworks to cover the two bowls of the capitals that were on the tops of the pillars[c][b];
translation:
  language: de
  text: die beiden Säulen, die beiden Schalen[a] der Kapitelle[b] oben auf den Säulen und die beiden Flechtwerke[c], um die beiden Schalen der Kapitelle oben auf den Säulen zu bedecken;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »Kugeln« beziehungsweise »Rundformen«. Das hebräische Wort bezeichnet abgerundete Teile der Kapitelle; ihre genaue architektonische Form ist unsicher.
    reason: lexical_alternative
  - marker: b
    text: »Kapitelle« sind die verzierten oberen Abschlüsse der Säulen.
    reason: clarification
  - marker: c
    text: Oder »Netzwerke«; gemeint sind netzartig verflochtene Zierwerke.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמֻּדִים
  choice: Säulen
  rationale: Bezeichnet die beiden großen freistehenden Säulen des Tempels; »Säulen« ist der geläufige architektonische Ausdruck.
- source_word: גֻלֹּת
  choice: Schalen
  rationale: Das Wort bezeichnet rundliche, schalen- oder kugelartige Teile der Kapitelle. »Schalen« ist verständlich, ohne die nicht sicher rekonstruierbare Form zu stark festzulegen.
- source_word: כֹּתָרֹת
  choice: Kapitelle
  rationale: Im architektonischen Zusammenhang sind die verzierten oberen Abschlüsse der Säulen gemeint; »Kapitelle« ist der präzise moderne Fachausdruck.
- source_word: רֹאשׁ
  choice: oben auf
  rationale: Das wörtliche »Kopf« bezeichnet hier die Oberseite der Säulen; »oben auf« ist im Deutschen natürlich und räumlich klar.
- source_word: שְּׂבָכוֹת
  choice: Flechtwerke
  rationale: Gemeint sind netzartig verflochtene Zierwerke. »Flechtwerke« gibt Struktur und Funktion wieder, ohne ein bestimmtes Material vorauszusetzen.
- source_word: לְכַסּוֹת
  choice: die … bedeckten
  rationale: Der Infinitiv bezeichnet die Bestimmung der Flechtwerke. Im deutschen Inventarsatz ist ein Relativsatz natürlich und eindeutig.
- source_word: שְׁנַיִם / שְׁתָּיִם / שְׁתֵּי
  choice: beiden / zwei
  rationale: Die wiederholten Zahlwörter gliedern die Aufzählung. Mit bestimmtem Artikel ist »die beiden« idiomatisches Deutsch.
- source_word: אֲשֶׁר עַל רֹאשׁ הָעַמּוּדִים
  choice: oben auf den Säulen
  rationale: Die Ortsangabe wird in natürlichem Deutsch wiedergegeben; ihre Wiederholung im hebräischen Text bleibt erhalten.
