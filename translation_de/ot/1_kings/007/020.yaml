  text: וְ/כֹתָרֹ֗ת עַל שְׁנֵי֙ הָֽ/עַמּוּדִ֔ים גַּם מִ/מַּ֨עַל֙ מִ/לְּ/עֻמַּ֣ת הַ/בֶּ֔טֶן אֲשֶׁ֖ר לְ/עֵ֣בֶר שבכה וְ/הָ/רִמּוֹנִ֤ים מָאתַ֨יִם֙ טֻרִ֣ים סָבִ֔יב עַ֖ל הַ/כֹּתֶ֥רֶת הַ/שֵּׁנִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/020.yaml
  text: And the capitals were on the two pillars[a], also above, opposite the bulge that was beside the latticework; and the pomegranates were two hundred, in rows all around[c][b], on the second capital.
translation:
  language: de
  text: Oben auf den beiden Säulen befanden sich auch Kapitelle, gegenüber der Wölbung[a], die neben dem Flechtwerk[b] lag. Zweihundert Granatäpfel waren in Reihen ringsum auf dem zweiten Kapitell[c] angebracht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »dem Bauch«; gemeint ist wahrscheinlich der gerundete, vorgewölbte Teil des Kapitells.
    reason: lexical_alternative
  - marker: b
    text: Das heißt das netz- oder gitterartige Zierwerk an den Kapitellen.
    reason: cultural_note
  - marker: c
    text: 'Oder: »auf dem anderen Kapitell«. Das hebräische Wort für »das zweite« kann hier das entsprechende Kapitell der zweiten Säule bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: כֹתָרֹת
  choice: Kapitelle
  rationale: Im architektonischen Zusammenhang bezeichnet das Wort die bekrönenden oberen Teile der Säulen; »Kapitelle« ist der geläufige moderne Fachausdruck.
- source_word: עַל שְׁנֵי הָעַמּוּדִים
  choice: an den beiden Säulen
  rationale: Gibt die räumliche Zuordnung der Kapitelle zu den zwei Säulen natürlich wieder.
- source_word: גַּם מִמַּעַל
  choice: auch … oben
  rationale: Bewahrt sowohl den ergänzenden Sinn von גַּם als auch die Höhenangabe von מִמַּעַל.
- source_word: מִלְעֻמַּת הַבֶּטֶן
  choice: gegenüber der Wölbung
  rationale: לְעֻמַּת bezeichnet ein Gegenüber; בֶּטֶן heißt wörtlich »Bauch«, meint hier jedoch wahrscheinlich den gerundeten, vorgewölbten Teil des Kapitells.
- source_word: אֲשֶׁר לְעֵבֶר שבכה
  choice: die neben dem Flechtwerk lag
  rationale: שבכה bezeichnet netz- oder gitterartiges Zierwerk. Das räumlich mehrdeutige לְעֵבֶר wird zurückhaltend mit »neben« wiedergegeben.
- source_word: הָרִמּוֹנִים
  choice: Granatäpfel
  rationale: Gemeint sind hier granatapfelförmige Zierelemente.
- source_word: מָאתַיִם
  choice: zweihundert
  rationale: Direkte Wiedergabe der Kardinalzahl.
- source_word: טֻרִים סָבִיב
  choice: in Reihen ringsum
  rationale: Gibt sowohl die geordnete Reihung als auch die umlaufende Anordnung der Verzierungen wieder.
- source_word: עַל הַכֹּתֶרֶת הַשֵּׁנִית
  choice: auf dem zweiten Kapitell
  rationale: Formale Wiedergabe von הַשֵּׁנִית; im Zusammenhang kann damit auch das jeweils andere, zugehörige Kapitell gemeint sein.
