base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/036.yaml
  text: On the panels of its supports and on its frames he engraved cherubim[a], lions, and palm trees, according to the space on each[b], with wreaths all around.
translation:
  language: de
  text: An den Platten ihrer Stützen und an ihren Rahmen gravierte er Cherubim, Löwen und Palmen, jeweils dem verfügbaren Raum entsprechend,[a] sowie ringsum Girlanden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Wendung ist schwer zu deuten. Möglich ist auch: „so, wie für jede Darstellung Platz war“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Kränze“. Gemeint sind wahrscheinlich umlaufende Ziergehänge.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְפַתַּח
  choice: gravierte er
  rationale: Das Verb bezeichnet hier das Einschneiden von Schmuckmotiven in die Bauteile; „gravieren“ ist im kunsthandwerklichen Zusammenhang präzise und natürlich.
- source_word: הַלֻּחֹת
  choice: die Platten
  rationale: Gemeint sind flächige Konstruktionsteile des Gestells, nicht Schrifttafeln. „Platten“ bewahrt den konkreten baulichen Sinn.
- source_word: יְדֹתֶיהָ
  choice: ihre Streben
  rationale: Wörtlich steht „ihre Hände“; im Konstruktionszusammenhang sind vorspringende oder tragende Seitenteile gemeint. „Streben“ gibt diese Funktion verständlich wieder.
- source_word: מַסְגְּרֹתֶיהָ
  choice: ihre Einfassungen
  rationale: Das Wort bezeichnet begrenzende Rahmen- oder Leistenteile. „Einfassungen“ lässt deren genaue bauliche Form offen.
- source_word: כְּרוּבִים
  choice: Kerubim
  rationale: Die traditionelle Transkription bezeichnet die geflügelten himmlischen Wächtergestalten und vermeidet die irreführende Vorstellung kindlicher Putten.
- source_word: אֲרָיוֹת
  choice: Löwen
  rationale: Direkte Bezeichnung des dargestellten Tiermotivs.
- source_word: תִמֹרֹת
  choice: Palmen
  rationale: In der Tempelornamentik bezeichnet das Wort stilisierte Palmenmotive; „Palmen“ ist im Deutschen knapp und eindeutig.
- source_word: כְּמַעַר אִישׁ
  choice: jeweils dem verfügbaren Raum entsprechend
  rationale: Die schwierige Wendung beschreibt wahrscheinlich die Verteilung der einzelnen Motive nach dem jeweils vorhandenen Platz. Die Übersetzung macht diesen wahrscheinlichen Sinn lesbar, kennzeichnet die Unsicherheit aber in einer Fußnote.
- source_word: לֹיֹת
  choice: Girlanden
  rationale: Das seltene Wort bezeichnet wahrscheinlich umlaufende Ziergehänge oder Festons. „Girlanden“ ist dafür im Deutschen anschaulich und vermeidet die stärkere Festlegung auf geschlossene Kränze.
- source_word: סָבִיב
  choice: ringsum
  rationale: Das Adverb bezeichnet eine umlaufende Anordnung der Verzierung.
theological_decisions: []
