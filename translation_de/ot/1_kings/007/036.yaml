  naturalness: Der Satz ist insgesamt verständlich und registergerecht. „Auf den Platten ihrer Streben“ ist jedoch etwas sperrig; „an den Platten ihrer Stützen“ ist im technischen Zusammenhang natürlicher, ohne die bauliche Unbestimmtheit des Hebräischen aufzulösen. „sowie ringsum Girlanden“ macht die abschließende Nominalgruppe flüssiger.
  terminology: „Cherubim“ ist die im modernen Standarddeutsch und in der Bibeltradition übliche Bezeichnung. „Stützen“, „Rahmen“, „Palmen“ und „Girlanden“ sind sachlich vertretbar. Die Fußnoten bewahren sowohl die Unsicherheit von כְּמַעַר אִישׁ als auch die lexikalische Unsicherheit von לֹיֹת.
