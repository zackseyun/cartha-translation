source:
  edition: WLC
  text: וַ/יִּ֜בֶן אֶת בֵּ֣ית יַ֣עַר הַ/לְּבָנ֗וֹן מֵאָ֨ה אַמָּ֤ה אָרְכּ/וֹ֙ וַ/חֲמִשִּׁ֤ים אַמָּה֙ רָחְבּ֔/וֹ וּ/שְׁלֹשִׁ֥ים אַמָּ֖ה קוֹמָת֑/וֹ עַ֗ל אַרְבָּעָה֙ טוּרֵי֙ עַמּוּדֵ֣י אֲרָזִ֔ים וּ/כְרֻת֥וֹת אֲרָזִ֖ים עַל הָ/עַמּוּדִֽים־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/002.yaml
  text: He built the House of the Forest of Lebanon[a], one hundred cubits long, fifty cubits wide, and thirty cubits high, on four rows of cedar pillars[c][b], with cedar beams on the pillars.
translation:
  language: de
  text: Er baute das Haus des Libanonwaldes. Es war hundert Ellen lang, fünfzig Ellen breit und dreißig Ellen hoch. Es stand auf vier Reihen von Zedernsäulen[a], und auf den Säulen lagen behauene Zedernhölzer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Es war mit vier Reihen von Zedernsäulen versehen.“ Die Präposition kann hier sowohl die tragende Anordnung („auf“) als auch die Ausstattung beziehungsweise Bauweise („mit“) bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „zugeschnittene Stücke aus Zedernholz“. Gemeint sein können Balken, Sparren oder andere behauene Bauteile.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Er baute
  rationale: Das Waw-Konsekutiv führt die Erzählung fort; im modernen Deutschen gibt das einfache Präteritum den Vorgang natürlich wieder.
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: das Haus des Libanonwaldes
  rationale: Die Bezeichnung wird als Eigenname des Gebäudes nahe an der hebräischen Konstruktverbindung wiedergegeben. „Haus“ vermeidet eine im Vers nicht ausdrücklich vorgenommene Funktionsbestimmung als Palast.
- source_word: מֵאָה אַמָּה אָרְכּוֹ וַחֲמִשִּׁים אַמָּה רָחְבּוֹ וּשְׁלֹשִׁים אַמָּה קוֹמָתוֹ
  choice: Es war hundert Ellen lang, fünfzig Ellen breit und dreißig Ellen hoch
  rationale: Die parallelen Maßangaben werden in natürlichem deutschen Architekturidiom ausgedrückt; die antike Maßeinheit „Elle“ bleibt erhalten.
- source_word: עַל אַרְבָּעָה טוּרֵי עַמּוּדֵי אֲרָזִים
  choice: Es stand auf vier Reihen von Zedernsäulen
  rationale: טוּרֵי bezeichnet Reihen und עַמּוּדֵי Säulen. „Auf“ bewahrt den räumlich-konstruktiven Sinn von עַל, ohne die mögliche Bedeutung „mit“ zu verschweigen.
- source_word: וּכְרֻתוֹת אֲרָזִים עַל הָעַמּוּדִים
  choice: und auf den Säulen lagen behauene Zedernhölzer
  rationale: כְרֻתוֹת bezeichnet wörtlich zugeschnittene beziehungsweise behauene Stücke. „Zedernhölzer“ bewahrt die Unbestimmtheit hinsichtlich ihrer genauen baulichen Funktion besser als die engeren Begriffe „Balken“ oder „Sparren“.
