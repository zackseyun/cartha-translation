base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/032.yaml
  text: And the four wheels were underneath the panels[a], and the axles of the wheels were on the stand[b]; and the height of each wheel was a cubit and a half.
translation:
  language: de
  text: Die vier Räder befanden sich unter den Rahmen[a], und die Achsen der Räder waren an dem Gestell[b]. Jedes Rad war eineinhalb Ellen hoch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Einfassungen« oder »Füllungen« (hebräisch מִסְגְּרוֹת).'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »die Hände der Räder«; gemeint sind wahrscheinlich die Radachsen oder tragenden Wellen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹפַנִּים / הָאוֹפַן
  choice: Räder / Rad
  rationale: Das Wort bezeichnet in dieser Beschreibung die wirklichen Räder des bronzenen Gestells.
- source_word: לְמִתַּחַת
  choice: unterhalb
  rationale: Gibt die räumliche Lage unter den Rahmen natürlich und genau wieder.
- source_word: הַמִּסְגְּרוֹת
  choice: Rahmen
  rationale: מִסְגְּרוֹת bezeichnet hier die eingefassten Seitenstrukturen; »Rahmen« bewahrt gegenüber »Füllungen« die mögliche konstruktive Bedeutung.
- source_word: וִידוֹת
  choice: Achsen
  rationale: Wörtlich »Hände«; im mechanischen Zusammenhang sind die tragenden beziehungsweise verbindenden Teile der Räder gemeint.
- source_word: בַּמְּכוֹנָה
  choice: an dem Gestell
  rationale: מְכוֹנָה ist das fahrbare bronzene Gestell; die Präposition bezeichnet hier plausibel die Befestigung daran.
- source_word: קוֹמַת הָאוֹפַן הָאֶחָד
  choice: Jedes Rad war … hoch
  rationale: Die distributive Aussage über die Höhe jedes einzelnen Rades wird in natürlichem Deutsch verbal ausgedrückt.
- source_word: אַמָּה וַחֲצִי הָאַמָּה
  choice: eineinhalb Ellen
  rationale: Die antike Maßeinheit bleibt erhalten; »eineinhalb Ellen« ist im Deutschen idiomatischer als »eine Elle und eine halbe Elle«.
