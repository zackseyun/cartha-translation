  yaml_path: translation/ot/1_kings/007/029.yaml
  text: And on the panels that were between the frames were lions[a], oxen, and cherubim; and on the frames likewise above, and beneath the lions and the oxen were wreaths[b], a work of hanging relief.
translation:
  language: de
  text: Auf den Füllungen zwischen den Rahmen waren Löwen, Rinder und Cherubim dargestellt. Auf den Rahmen befand sich oben ein Gestell; unter den Löwen und Rindern befanden sich Girlanden[a] in herabhängender Arbeit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Kränze«; das hebräische Wort ist selten, und die genaue Form des Ornaments ist ungewiss.'
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Wendung ist schwer zu deuten; möglicherweise bezeichnet sie eine nach unten hängende oder abwärts verlaufende Verzierung unter den Löwen und Rindern.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִּסְגְּרוֹת
  choice: Füllungen
  rationale: Im Zusammenhang der Gestelle bezeichnet das Wort die dekorierten Flächen innerhalb der tragenden Glieder; »Füllungen« unterscheidet sie klar von den שְׁלַבִּים.
- source_word: שְׁלַבִּים
  choice: Rahmen
  rationale: Das Wort bezeichnet hier die tragenden beziehungsweise einfassenden Glieder, zwischen denen die dekorierten Füllungen lagen.
- source_word: אֲרָיוֹת
  choice: Löwen
  rationale: Direkte und eindeutige Bezeichnung der dargestellten Tiere.
- source_word: בָּקָר
  choice: Rinder
  rationale: Der hebräische Sammelbegriff bezeichnet Rinder, ohne das Geschlecht so eng festzulegen wie »Stiere«.
- source_word: כְרוּבִים
  choice: Kerubim
  rationale: Die im Deutschen bibelsprachlich etablierte Transliteration bezeichnet diese besonderen himmlischen Wesen, ohne sie mit modernen Puttenvorstellungen zu verbinden.
- source_word: כֵּן
  choice: auch
  rationale: Das Adverb zeigt eine entsprechende Verzierung der Rahmen an; »auch« gibt diese Beziehung im Deutschen natürlich wieder.
- source_word: מִמָּעַל
  choice: darüber
  rationale: Die räumliche Angabe wird in natürlicher Verbindung mit den Rahmen wiedergegeben, wobei der knappe hebräische Satzbau erhalten bleibt.
- source_word: מִתַּחַת
  choice: unterhalb
  rationale: Gibt die Lage der Ornamente unter den Tierfiguren klar wieder.
- source_word: לֹיוֹת
  choice: Girlanden
  rationale: Das seltene Wort bezeichnet wahrscheinlich ein herabhängendes, kranz- oder girlandenartiges Ornament; die genaue Form bleibt durch eine Fußnote offen.
- source_word: מַעֲשֵׂה מוֹרָד
  choice: in herabhängender Arbeit
  rationale: Die schwierige Wendung scheint eine abwärts verlaufende oder hängende Ausführung der Verzierung zu beschreiben; die Übersetzung wahrt diese räumliche Vorstellung, ohne eine bestimmte Technik festzulegen.
