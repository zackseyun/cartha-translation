  text: 'There were lattices of latticework and twisted cords of chainwork for the capitals that were on the tops of the pillars: seven for the one capital[a], and seven for the second capital.'
translation:
  language: de
  text: 'Es gab Gittergeflechte und gedrehte Schnüre in Kettenarbeit für die Kapitelle, die oben auf den Säulen waren: sieben für das eine Kapitell[a] und sieben für das zweite Kapitell.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Netz- oder Gitterarbeit und geflochtene Stränge in Kettenarbeit.“ Das Hebräische verwendet bei beiden Zierelementen jeweils verwandte Begriffe für die kunsthandwerkliche Ausführung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂבָכִים מַעֲשֵׂה שְׂבָכָה
  choice: Gitter in Flechtarbeit
  rationale: Die Wortgruppe bezeichnet netz- oder gitterförmige Zierarbeit. Die Wiedergabe bewahrt das konkrete architektonische Bild und klingt im modernen Deutschen natürlicher als eine starre Nachbildung der hebräischen Wortwiederholung.
- source_word: גְּדִלִים מַעֲשֵׂה שַׁרְשְׁרוֹת
  choice: gedrehte Schnüre in Kettenarbeit
  rationale: גְּדִלִים bezeichnet gedrehte oder geflochtene Stränge; die folgende Wortgruppe beschreibt ihre kettenartige Ausführung. „Schnüre“ ist hier bildlich für die aus Metall gefertigten Zierelemente zu verstehen.
- source_word: כֹּתָרֹת
  choice: Kapitelle
  rationale: Im Zusammenhang des Tempelbaus sind die verzierten oberen Abschlüsse der Säulen gemeint. „Kapitelle“ ist der präzise moderne Architekturbegriff.
- source_word: אֲשֶׁר עַל רֹאשׁ הָעַמּוּדִים
  choice: oben auf den Säulen
  rationale: Die räumliche Aussage des Hebräischen wird knapp und idiomatisch wiedergegeben; רֹאשׁ bedeutet wörtlich „Kopf“, bezeichnet hier aber die Oberseite.
- source_word: שִׁבְעָה לַכֹּתֶרֶת הָאֶחָת וְשִׁבְעָה לַכֹּתֶרֶת הַשֵּׁנִית
  choice: sieben für das eine Kapitell und sieben für das zweite Kapitell
  rationale: Die ausdrückliche Verteilung von jeweils sieben Zierelementen auf beide Kapitelle bleibt erhalten.
