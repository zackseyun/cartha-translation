  text: וַ/יַּ֣עַשׂ חִיר֔וֹם אֶת הַ֨/כִּיֹּר֔וֹת וְ/אֶת הַ/יָּעִ֖ים וְ/אֶת הַ/מִּזְרָק֑וֹת וַ/יְכַ֣ל חִירָ֗ם לַֽ/עֲשׂוֹת֙ אֶת כָּל הַ/מְּלָאכָ֔ה אֲשֶׁ֥ר עָשָׂ֛ה לַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה בֵּ֥ית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/040.yaml
  text: And Hiram made the basins[a], the shovels, and the bowls. So Hiram finished doing all the work that he did for King Solomon for the house of Yahweh.
translation:
  language: de
  text: Und Hiram fertigte die Becken, die Schaufeln und die Schalen[a] an. Damit vollendete Hiram alle Arbeiten, die er im Auftrag König Salomos für das Haus Jahwes ausführte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Sprengschalen; gemeint sind Schalen, die bei Opferriten verwendet wurden.'
    reason: Lexikalische Alternative mit kultischer Bedeutungsnuance von מִזְרָקוֹת.
lexical_decisions:
- source_word: כִּיֹּרוֹת
  choice: Becken
  rationale: Das Substantiv bezeichnet hier große Gefäße, insbesondere Waschbecken im Heiligtum. „Becken“ ist im heutigen Deutsch klar und sachgerecht.
- source_word: יָּעִים
  choice: Schaufeln
  rationale: Gemeint sind Geräte zum Entfernen von Asche oder Kohlen. „Schaufeln“ gibt die Funktion natürlich und präzise wieder.
- source_word: מִּזְרָקוֹת
  choice: Schalen[a]
  rationale: Das Wort bezeichnet kultische Gefäße, die unter anderem zum Auffangen oder Versprengen von Blut beziehungsweise Flüssigkeiten dienten. „Schalen“ bleibt gut verständlich; die genauere kultische Bedeutung steht in der Fußnote.
- source_word: וַיְכַל
  choice: vollendete
  rationale: Das Verb bezeichnet den erfolgreichen Abschluss der gesamten Arbeit. „Vollendete“ passt zum würdigen Erzählstil und gibt den Abschlusscharakter deutlich wieder.
- source_word: כָּל הַמְּלָאכָה
  choice: die gesamte Arbeit
  rationale: מְלָאכָה ist ein umfassender Ausdruck für Arbeit oder Werk. „Die gesamte Arbeit“ vermeidet eine unnötige Einengung auf Handwerkskunst.
- source_word: בֵּית יְהוָה
  choice: das Haus Jahwes
  rationale: „Haus“ bewahrt die hebräische Ausdrucksweise; im Zusammenhang ist der Tempel gemeint. Der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: חִירוֹם / חִירָם
  choice: Hiram
  rationale: Die beiden Schreibvarianten beziehen sich im Kontext auf dieselbe Person. „Hiram“ ist die etablierte deutsche Namensform.
- source_word: עָשָׂה ... לַמֶּלֶךְ שְׁלֹמֹה
  choice: fertigte ... an / die er für König Salomo ... ausführte
  rationale: Das wiederholte עשה kann je nach Gegenstand „machen, anfertigen“ oder allgemeiner „tun, ausführen“ bedeuten. Die differenzierte Wiedergabe klingt natürlich und bewahrt den Sinn.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Gottesnamen im Deutschen erkennbar wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Bezeichnung des Heiligtums als בֵּית יְהוָה
  choice: Haus Jahwes
  alternative: Tempel Jahwes
  rationale: „Haus Jahwes“ bewahrt das Bild und die formale Nähe zum hebräischen Ausdruck; dass damit der Tempel gemeint ist, ergibt sich eindeutig aus dem Zusammenhang.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Fertigte … an“ ist für die hergestellten Geräte idiomatisch; „vollendete die gesamte Arbeit“ wahrt den zusammenfassenden Charakter des zweiten Satzes. Die zweimalige Präposition „für“ bildet die Zweck- und Auftraggeberbezüge des hebräischen Satzes transparent ab, ohne die Arbeit lediglich räumlich in den Tempel zu verlegen.
