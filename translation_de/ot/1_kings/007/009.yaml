id: 1KI.7.9
reference: 1 Kings 7:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כָּל אֵ֜לֶּה אֲבָנִ֤ים יְקָרֹת֙ כְּ/מִדֹּ֣ת גָּזִ֔ית מְגֹרָר֥וֹת בַּ/מְּגֵרָ֖ה מִ/בַּ֣יִת וּ/מִ/ח֑וּץ וּ/מִ/מַּסָּד֙ עַד הַ/טְּפָח֔וֹת וּ/מִ/ח֖וּץ עַד הֶ/חָצֵ֥ר הַ/גְּדוֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/009.yaml
  text: All these were costly stones[a], cut according to measure, sawed with a saw on the inside and on the outside, from the foundation to the coping[b], and on the outside as far as the great court.
translation:
  language: de
  text: Alle diese Steine waren kostbare Steine[a], nach Maß behauen und auf der Innen- wie auf der Außenseite mit der Säge gesägt, vom Fundament bis zum oberen Abschluss[b] und außen bis zum großen Vorhof.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wertvolle Steine“. Gemeint sind hier wahrscheinlich kostspielige, hochwertige Bausteine, nicht Edelsteine.'
    reason: lexical_alternative
  - marker: b
    text: Die genaue Bedeutung des hebräischen Ausdrucks ist unsicher. Gemeint sein könnte der obere Abschluss des Mauerwerks, etwa ein Deckstein oder die oberste Steinlage.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָנִים יְקָרֹת
  choice: kostbare Steine
  rationale: יְקָרֹת bezeichnet Wertvolles oder Kostbares. Im architektonischen Zusammenhang sind hochwertige, aufwendige Bausteine gemeint, nicht Edelsteine.
- source_word: כְּמִדֹּת גָּזִית
  choice: nach Maß behauen
  rationale: Die Wendung verbindet festgelegte Maße mit zugerichteten Quadersteinen; die knappe deutsche Formulierung gibt Präzision und Bearbeitung wieder.
- source_word: מְגֹרָרוֹת בַּמְּגֵרָה
  choice: mit der Säge gesägt
  rationale: Die bewusste Wiederholung bewahrt die konkrete hebräische Verbindung von Tätigkeit und Werkzeug.
- source_word: מִבַּיִת וּמִחוּץ
  choice: auf der Innen- wie auf der Außenseite
  rationale: Im Bauzusammenhang sind wahrscheinlich die innen und außen liegenden beziehungsweise sichtbaren Steinflächen gemeint.
- source_word: מִמַּסָּד
  choice: vom Fundament
  rationale: מַסָּד bezeichnet hier den tragenden Grund oder Unterbau eines Gebäudes; „Fundament“ ist der natürliche deutsche Fachausdruck.
- source_word: עַד הַטְּפָחוֹת
  choice: bis zum oberen Abschluss
  rationale: Die genaue Bedeutung des seltenen architektonischen Ausdrucks ist unsicher. Die Wiedergabe bezeichnet vorsichtig einen oberen Gebäudeabschluss, ohne ihn zu eng als bestimmte Bauteilart festzulegen.
- source_word: וּמִחוּץ עַד הֶחָצֵר הַגְּדוֹלָה
  choice: und außen bis zum großen Vorhof
  rationale: Die Formulierung führt die Beschreibung räumlich bis zum großen Hof weiter; „Vorhof“ entspricht dem üblichen biblisch-architektonischen Gebrauch von חָצֵר.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit architektonisch verständlicher Wortwahl. Die Wiederholung „mit der Säge gesägt“ folgt bewusst der konkreten Ausdrucksweise des Hebräischen; die unsichere Bezeichnung des oberen Bauteils wird im Text nicht überpräzisiert und in der Fußnote erläutert.
