  text: כָּ/זֹ֣את עָשָׂ֔ה אֵ֖ת עֶ֣שֶׂר הַ/מְּכֹנ֑וֹת מוּצָ֨ק אֶחָ֜ד מִדָּ֥ה אַחַ֛ת קֶ֥צֶב אֶחָ֖ד לְ/כֻלָּֽ/הְנָה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/037.yaml
  text: 'Thus he made the ten stands: one casting[a], one measure, one form for all of them.'
translation:
  language: de
  text: 'So fertigte er die zehn Gestelle an: Alle waren aus einem Guss[a], hatten dieselben Maße und dieselbe Form.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Alle waren einheitlich gegossen.« Die drei knappen parallelen Wendungen im Hebräischen betonen, dass alle zehn Gestelle nach derselben Ausführung gefertigt waren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּזֹאת
  choice: So
  rationale: Verweist zusammenfassend auf die zuvor beschriebene Bauart und Ausführung.
- source_word: עָשָׂה
  choice: fertigte er … an
  rationale: Passt natürlich und präzise in den handwerklichen Zusammenhang.
- source_word: עֶשֶׂר הַמְּכֹנוֹת
  choice: die zehn Gestelle
  rationale: מְכוֹנוֹת bezeichnet hier die fahrbaren Untergestelle der Becken; »Gestelle« benennt ihre Funktion, ohne sie einseitig als Wagen zu bestimmen.
- source_word: מוּצָק אֶחָד
  choice: Alle waren aus einem Guss
  rationale: Gibt den metallurgischen Sinn und die einheitliche Herstellungsweise idiomatisch wieder.
- source_word: מִדָּה אַחַת
  choice: hatten dieselben Maße
  rationale: Das wörtliche »ein Maß« bezeichnet hier übereinstimmende Abmessungen; der Plural ist im Deutschen sachlich und natürlich.
- source_word: קֶצֶב אֶחָד
  choice: dieselbe Form
  rationale: קֶצֶב kann Form, Gestaltung oder Proportion bezeichnen; »Form« bewahrt die lexikalische Offenheit.
- source_word: לְכֻלָּהְנָה
  choice: Alle … dieselben … dieselbe
  rationale: Die kollektive Aussage über alle zehn Gestelle wird im Deutschen auf die drei parallelen Merkmale verteilt.
