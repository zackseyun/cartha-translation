base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/046.yaml
  text: In the plain of the Jordan the king cast them[c][b][a], in the clay ground between Sukkoth and Zarethan.
translation:
  language: de
  text: In der Jordanebene[a] goss der König sie[b] im dichten Erdreich[c] zwischen Sukkot und Zaretan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Jordantal“. Das Hebräische bezeichnet wörtlich den ebenen Landstrich am Jordan.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „goss sie aus“; das Verb bezeichnet das Gießen von Metallgegenständen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „in der Dicke des Erdbodens“; wahrscheinlich ist dichtes, tonhaltiges Erdreich gemeint, das sich für Gussformen eignete.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכִכַּר הַיַּרְדֵּן
  choice: in der Jordanebene
  rationale: כִּכָּר bezeichnet hier den ebenen Landstrich am Jordan. „Jordanebene“ ist im Deutschen natürlich und bleibt näher an der geografischen Bezeichnung als das stärker deutende „Jordantal“.
- source_word: יְצָקָם
  choice: ließ … sie gießen
  rationale: יצק bezeichnet beim Metallhandwerk das Gießen. Die deutsche Wendung „ließ … gießen“ gibt idiomatisch wieder, dass der König die Herstellung veranlasste; das Suffix der 3. Person maskulin Plural wird mit „sie“ wiedergegeben.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Der hebräische Text nennt hier keinen Eigennamen. „Der König“ wahrt die Formulierung der Vorlage; aus dem Zusammenhang ist Salomo gemeint.
- source_word: בְּמַעֲבֵה הָאֲדָמָה
  choice: im dichten Erdreich
  rationale: מַעֲבֶה bezeichnet Dicke oder Dichte. In Verbindung mit אֲדָמָה ist dichtes, für Gussformen geeignetes Erdreich gemeint; die Wiedergabe vermeidet, „Ton“ als ausdrücklich genannten Bodenstoff auszugeben.
- source_word: בֵּין סֻכּוֹת וּבֵין צָרְתָן
  choice: zwischen Sukkot und Zaretan
  rationale: Die Ortsnamen werden in einer im Deutschen verständlichen, am Hebräischen orientierten Form wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung ist flüssig und bewahrt die beiden Ortsangaben der Vorlage. „Dichtes Erdreich“ erhält die ungewöhnliche hebräische Ausdrucksweise, ohne die plausible Deutung als Tonboden in den Haupttext einzutragen.
