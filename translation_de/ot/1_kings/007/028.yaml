source:
  edition: WLC
  text: וְ/זֶ֛ה מַעֲשֵׂ֥ה הַ/מְּכוֹנָ֖ה מִסְגְּרֹ֣ת לָ/הֶ֑ם וּ/מִסְגְּרֹ֖ת בֵּ֥ין הַ/שְׁלַבִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/028.yaml
  text: 'And this was the construction of the stand: they had frames[b][a], and there were frames between the supports.'
translation:
  language: de
  text: 'Und so waren die Gestelle gebaut: Sie hatten Rahmen[a], und zwischen den Streben[b] befanden sich ebenfalls Rahmen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Felder“ beziehungsweise „eingefasste Flächen“; die genaue Form dieser Bauteile ist nicht sicher.'
    reason: lexical_alternative
  - marker: b
    text: Auch „Querleisten“, „Pfosten“ oder „Schienen“; welches Bauteil genau gemeint ist, ist unklar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה
  choice: Und so
  rationale: Die Verbindung aus Konjunktion und Demonstrativ leitet die folgende Beschreibung ein; „Und so“ gibt den hebräischen Fortgang in natürlichem Deutsch wieder.
- source_word: מַעֲשֵׂה הַמְּכוֹנָה
  choice: waren die Gestelle gebaut
  rationale: Die substantivische Wendung bezeichnet hier die Bauweise. Eine verbale Formulierung ist im modernen Deutsch natürlich und bewahrt den architektonischen Sinn.
- source_word: הַמְּכוֹנָה
  choice: die Gestelle
  rationale: מְכוֹנָה bezeichnet in diesem Abschnitt die fahrbaren Untergestelle der Becken. Der hebräische Singular wird im Zusammenhang mit dem pluralischen Suffix לָהֶם kollektiv verstanden und daher auf Deutsch im Plural wiedergegeben.
- source_word: מִסְגְּרֹת
  choice: Rahmen
  rationale: Das Wort bezeichnet abgrenzende oder eingefasste Bauteile. „Rahmen“ bleibt lexikalisch nah und legt ihre genaue Gestalt weniger stark fest als „Füllungen“ oder „Seitenfelder“.
- source_word: לָהֶם
  choice: Sie hatten
  rationale: Die Präposition mit Suffix drückt hier idiomatisch Besitz beziehungsweise Ausstattung aus.
- source_word: בֵּין
  choice: zwischen
  rationale: Die Präposition bezeichnet die räumliche Lage der Rahmen zwischen den genannten Bauteilen.
- source_word: הַשְׁלַבִּים
  choice: den Streben
  rationale: Der seltene technische Ausdruck bezeichnet verbindende Konstruktionsteile. „Streben“ ist verständlich und hinreichend offen, während die genaue Ausrichtung ungewiss bleibt.
