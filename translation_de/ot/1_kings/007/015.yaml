source:
  edition: WLC
  text: וַ/יָּ֛צַר אֶת שְׁנֵ֥י הָ/עַמּוּדִ֖ים נְחֹ֑שֶׁת שְׁמֹנֶ֨ה עֶשְׂרֵ֜ה אַמָּ֗ה קוֹמַת֙ הָ/עַמּ֣וּד הָ/אֶחָ֔ד וְ/חוּט֙ שְׁתֵּים עֶשְׂרֵ֣ה אַמָּ֔ה יָסֹ֖ב אֶת הָ/עַמּ֥וּד הַ/שֵּׁנִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/015.yaml
  text: He cast the two bronze pillars; the height of the one pillar was eighteen cubits[a], and a line of twelve cubits measured around it.
translation:
  language: de
  text: Er goss die beiden Säulen aus Bronze. Die eine Säule war achtzehn Ellen hoch, und eine zwölf Ellen lange Schnur umspannte die zweite Säule[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Text lautet ausdrücklich „die zweite Säule“. Manche Übersetzungen beziehen die Umfangsangabe sinngemäß auf die zuvor genannte Säule und geben daher „sie“ oder „dieselbe Säule“ wieder.
    reason: textual_and_referential_ambiguity
lexical_decisions:
- source_word: וַיָּצַר
  choice: goss
  rationale: Im Zusammenhang mit bronzenen Tempelgeräten bezeichnet das Verb hier sachgerecht das Gießen von Metall.
- source_word: שְׁנֵי הָעַמּוּדִים
  choice: die beiden Säulen
  rationale: „Säulen“ ist im architektonischen Zusammenhang die natürliche deutsche Bezeichnung; „beiden“ gibt die bestimmte Zweizahl idiomatisch wieder.
- source_word: נְחֹשֶׁת
  choice: aus Bronze
  rationale: In diesem altorientalischen Metallarbeitskontext ist Bronze wahrscheinlicher als reines Kupfer; „Messing“ wäre sachlich problematisch.
- source_word: שְׁמֹנֶה עֶשְׂרֵה אַמָּה קוֹמַת הָעַמּוּד הָאֶחָד
  choice: Die eine Säule war achtzehn Ellen hoch
  rationale: Die prädikative Form ist natürliches modernes Deutsch und bewahrt sowohl das antike Maß als auch den Bezug auf die eine Säule.
- source_word: וְחוּט שְׁתֵּים עֶשְׂרֵה אַמָּה
  choice: und eine zwölf Ellen lange Schnur
  rationale: חוּט bezeichnet eine Schnur oder einen Faden. Die Längenangabe wird im Deutschen idiomatisch attributiv wiedergegeben, ohne die Schnur ausdrücklich als Messschnur zu deuten.
- source_word: יָסֹב
  choice: umspannte
  rationale: Das Verb bezeichnet hier das Herumgehen beziehungsweise Umschließen der Säule und lässt die Funktion der Schnur als Umfangsmaß erkennen.
- source_word: הָעַמּוּד הַשֵּׁנִי
  choice: die zweite Säule
  rationale: Dies entspricht unmittelbar dem masoretischen Text und bewahrt dessen auffälligen Wechsel von der einen zur zweiten Säule.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die antike Maßeinheit „Elle“ bleibt unkonvertiert. Die auffällige Referenz auf die zweite Säule wird gemäß dem WLC-Haupttext beibehalten und nicht stillschweigend harmonisiert.
