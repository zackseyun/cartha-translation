  text: וּ/שְׁתֵּ֨י כֹתָרֹ֜ת עָשָׂ֗ה לָ/תֵ֛ת עַל רָאשֵׁ֥י הָֽ/עַמּוּדִ֖ים מֻצַ֣ק נְחֹ֑שֶׁת חָמֵ֣שׁ אַמּ֗וֹת קוֹמַת֙ הַ/כֹּתֶ֣רֶת הָ/אֶחָ֔ת וְ/חָמֵ֣שׁ אַמּ֔וֹת קוֹמַ֖ת הַ/כֹּתֶ֥רֶת הַ/שֵּׁנִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/016.yaml
  text: He made two capitals of cast bronze to set on the tops of the pillars. The height of the one capital was five cubits[a], and the height of the second capital was five cubits.
translation:
  language: de
  text: Er fertigte zwei Kapitelle aus gegossener Bronze an, um sie oben auf die Säulen zu setzen. Das eine Kapitell war fünf Ellen[a] hoch, und das zweite Kapitell war ebenfalls fünf Ellen hoch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eine Elle entsprach ungefähr 45 Zentimetern; fünf Ellen waren also etwa 2,25 Meter.
    reason: measurement_clarification
lexical_decisions:
- source_word: כֹתָרֹת / הַכֹּתֶרֶת
  choice: Kapitelle / Kapitell
  rationale: Im architektonischen Zusammenhang bezeichnet das Wort den bekrönenden oberen Teil einer Säule. „Kapitell“ ist dafür der geläufige und präzise moderne Fachausdruck.
- source_word: עָשָׂה
  choice: fertigte … an
  rationale: Gibt das Herstellen der Bauteile natürlich und ohne zusätzliche Bedeutungsnuance wieder.
- source_word: לָתֵת
  choice: um sie … zu setzen
  rationale: Der Infinitiv drückt den Zweck der Anfertigung aus.
- source_word: רָאשֵׁי הָעַמּוּדִים
  choice: oben auf die Säulen
  rationale: Gibt den wörtlichen Ausdruck „auf die Köpfe der Säulen“ in natürlichem architektonischem Deutsch wieder.
- source_word: מֻצַק נְחֹשֶׁת
  choice: aus gegossener Bronze
  rationale: Bewahrt sowohl die Materialangabe als auch den Hinweis auf das Gussverfahren.
- source_word: חָמֵשׁ אַמּוֹת
  choice: fünf Ellen
  rationale: Die antike Maßeinheit wird entsprechend dem Ausgangstext beibehalten.
- source_word: קוֹמַת
  choice: … hoch
  rationale: Eine idiomatische deutsche Wiedergabe der Höhenangabe im architektonischen Kontext.
- source_word: הָאֶחָת
  choice: das eine
  rationale: Bewahrt die Formulierung des Hebräischen, das nicht ausdrücklich „das erste“ sagt.
- source_word: הַשֵּׁנִית
  choice: das zweite
  rationale: Entspricht der ausdrücklichen Kennzeichnung des zweiten Kapitells.
