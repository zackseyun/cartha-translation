  yaml_path: translation/ot/1_kings/007/031.yaml
  text: Its opening projected upward from within the capital by a cubit[a], and its opening was round, like the work of a pedestal, a cubit and a half; and also on its opening were carvings, and their panels were square[c][b], not round.
translation:
  language: de
  text: Seine Öffnung[a] erhob sich aus dem Inneren des Kapitells eine Elle nach oben. Die Öffnung war rund, nach Art eines Sockels gearbeitet[b], und maß eineinhalb Ellen. Auch an ihrer Öffnung befanden sich Verzierungen[c]; ihre Felder waren viereckig, nicht rund.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »ihr Mund«; gemeint ist die Öffnung des Bauteils.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Fachwendung ist unsicher; auch möglich: »wie ein Gestell gearbeitet« oder »in der Machart eines Fußes«.'
    reason: textual_or_technical_ambiguity
  - marker: c
    text: Das hebräische Wort kann ornamentale Schnitzereien, Flechtmuster, Kränze oder Girlanden bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִיהוּ / פִיהָ
  choice: Öffnung
  rationale: Wörtlich steht hier »Mund«. Im architektonischen Zusammenhang bezeichnet das Wort die Öffnung des Bauteils; »Öffnung« ist im Deutschen klar und natürlich.
- source_word: מִבֵּית לַכֹּתֶרֶת וָמַעְלָה
  choice: erhob sich aus dem Inneren des Kapitells … nach oben
  rationale: Die knappe hebräische Raumangabe beschreibt eine Aufwärtsbewegung beziehungsweise Ausdehnung vom Inneren des Kapitells aus. Das Verb »erhob sich« macht den im Hebräischen nur angedeuteten Zusammenhang im Deutschen verständlich.
- source_word: בָּאַמָּה
  choice: eine Elle
  rationale: Die Maßangabe bestimmt die Höhe der Aufwärtsausdehnung.
- source_word: עָגֹל
  choice: rund
  rationale: Direkte und natürliche Wiedergabe der Formbezeichnung.
- source_word: מַעֲשֵׂה כֵן
  choice: nach Art eines Sockels gearbeitet
  rationale: Die technisch schwierige Wendung bezeichnet wahrscheinlich eine Arbeit oder Form wie bei einem Gestell, Fuß oder Sockel. Die gewählte Fassung bewahrt sowohl den Vergleich als auch den handwerklichen Aspekt.
- source_word: אַמָּה וַחֲצִי הָאַמָּה
  choice: maß eineinhalb Ellen
  rationale: Gibt die Maßangabe idiomatisch wieder, ohne im Haupttext festzulegen, ob ausdrücklich Durchmesser, Breite oder eine andere Abmessung gemeint ist.
- source_word: מִקְלָעוֹת
  choice: Verzierungen
  rationale: Der seltene Ausdruck bezeichnet ornamentale Arbeit, doch das genaue Motiv ist unsicher. »Verzierungen« vermeidet eine unbelegte Festlegung auf Schnitzwerk, Kränze oder Girlanden.
- source_word: מִסְגְּרֹתֵיהֶם
  choice: ihre Felder
  rationale: In der Beschreibung der Gestelle bezeichnet das Wort gerahmte Flächen oder Paneele. »Felder« passt zur anschließenden Formangabe und ist in architektonischem Deutsch verständlich.
- source_word: מְרֻבָּעוֹת לֹא עֲגֻלּוֹת
  choice: waren viereckig, nicht rund
  rationale: »Viereckig« wahrt die Grundbedeutung, ohne die Form enger als nötig auf ein exaktes Quadrat festzulegen; der Gegensatz zu »rund« bleibt ausdrücklich erhalten.
