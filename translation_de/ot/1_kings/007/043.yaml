translation_notes:
  register: Moderne, sachliche und würdige Inventarsprache. Der fragmentarische Charakter des Verses als Fortsetzung einer Aufzählung wird durch „dazu“ bewahrt; auf eine unnötige lexikalische Fußnote wird verzichtet.
