  text: and the ten stands[a], and the ten basins on the stands,
translation:
  language: de
  text: und die zehn Untergestelle und die zehn Becken auf den Untergestellen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֶת
  choice: dazu
  rationale: אֵת kennzeichnet das bestimmte direkte Objekt und bleibt im Deutschen unübersetzt; וְ führt die Aufzählung additiv fort. „Dazu“ gibt diesen Anschluss im vorliegenden Versfragment natürlich wieder.
- source_word: הַ/מְּכֹנוֹת
  choice: die Untergestelle
  rationale: מְכֹנוֹת bezeichnet hier die in den umliegenden Versen beschriebenen fahrbaren Träger der Becken. „Untergestelle“ benennt ihre tragende Funktion klar, ohne ihre Beweglichkeit stärker hervorzuheben als der Ausdruck selbst.
- source_word: עָשֶׂר
  choice: zehn
  rationale: Die Kardinalzahl bestimmt das feminine Substantiv מְכֹנוֹת.
- source_word: הַ/כִּיֹּרֹת
  choice: die Becken
  rationale: כִּיּוֹר bezeichnet ein Waschbecken beziehungsweise Wasserbecken. „Becken“ ist modern, verständlich und im Zusammenhang sachgerecht.
- source_word: עֲשָׂרָה
  choice: zehn
  rationale: Die Kardinalzahl zählt hier die mit כִּיֹּרוֹת bezeichneten Gegenstände.
- source_word: עַל
  choice: auf
  rationale: Die Präposition bezeichnet die räumliche Anordnung der Becken auf ihren tragenden Untergestellen.
- source_word: הַ/מְּכֹנוֹת
  choice: den Untergestellen
  rationale: Der wiederholte hebräische Ausdruck wird innerhalb des Verses einheitlich wiedergegeben; der Dativ folgt auf „auf“ bei statischer Lage.
