source:
  edition: WLC
  text: עֹמֵ֞ד עַל שְׁנֵ֧י עָשָׂ֣ר בָּקָ֗ר שְׁלֹשָׁ֣ה פֹנִ֣ים צָפ֡וֹנָ/ה וּ/שְׁלֹשָׁה֩ פֹנִ֨ים יָ֜מָּ/ה וּ/שְׁלֹשָׁ֣ה פֹּנִ֣ים נֶ֗גְבָּ/ה וּ/שְׁלֹשָׁה֙ פֹּנִ֣ים מִזְרָ֔חָ/ה וְ/הַ/יָּ֥ם עֲלֵי/הֶ֖ם מִ/לְ/מָ֑עְלָ/ה וְ/כָל אֲחֹֽרֵי/הֶ֖ם בָּֽיְתָ/ה־׀׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/025.yaml
  text: 'It stood on twelve oxen: three facing north[a], three facing west, three facing south, and three facing east; and the Sea was on them above[b], and all their rear parts were inward.'
translation:
  language: de
  text: 'Es stand auf zwölf Rindern: drei waren nach Norden ausgerichtet, drei nach Westen[a], drei nach Süden und drei nach Osten. Das Meer ruhte oben auf ihnen, und die Hinterteile aller Rinder waren nach innen gerichtet.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort für „Westen“ bedeutet wörtlich „meerwärts“; dies ist eine übliche biblische Bezeichnung für den Westen.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „und all ihre rückwärtigen Teile waren einwärts“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹמֵד
  choice: Es stand
  rationale: Das Qal-Partizip beschreibt prädikativ das im vorherigen Vers genannte Meer. Im deutschen Erzählzusammenhang gibt „stand“ die Konstruktion natürlich und knapp wieder.
- source_word: בָּקָר
  choice: Rinder
  rationale: Das Substantiv bezeichnet hier die zwölf als Tragfiguren dienenden Rinder. „Rinder“ bleibt gegenüber der möglichen, aber nicht zwingenden Spezifizierung „Stiere“ lexikalisch zurückhaltend.
- source_word: פֹנִים
  choice: blickten nach
  rationale: Wörtlich ist von den „Gesichtern“ die Rede; in der wiederholten Richtungsangabe bezeichnet das Wort die Ausrichtung der Tierfiguren. „Blickten nach“ ist im Deutschen anschaulich und idiomatisch.
- source_word: צָפוֹנָה / יָמָּה / נֶגְבָּה / מִזְרָחָה
  choice: nach Norden / nach Westen / nach Süden / nach Osten
  rationale: Die Richtungsformen bezeichnen in dieser Aufzählung die vier Himmelsrichtungen. Besonders יָמָּה bedeutet wörtlich „meerwärts“, ist hier jedoch die übliche Bezeichnung für Westen.
- source_word: הַיָּם
  choice: das Meer
  rationale: „Meer“ ist die technische Bezeichnung des großen gegossenen Beckens im Tempel und bewahrt zugleich das Bild des hebräischen Ausdrucks.
- source_word: עֲלֵיהֶם מִלְמָעְלָה
  choice: ruhte oben auf ihnen
  rationale: Die hebräische Wendung besagt, dass das Meer sich oben auf den Rindern befand. „Ruhte“ macht das beschriebene Trageverhältnis natürlich deutlich, ohne eine zusätzliche Handlung wie „wurde aufgesetzt“ einzuführen.
- source_word: אֲחֹרֵיהֶם
  choice: die Hinterteile aller Rinder
  rationale: Der Ausdruck bezeichnet ihre rückwärtigen Körperteile. Die Wiederaufnahme von „Rinder“ beseitigt im Deutschen eine mögliche Unklarheit des Pronomens, ohne die räumliche Aussage zu verändern.
- source_word: בָּיְתָה
  choice: nach innen gerichtet
  rationale: Die Richtungsform bedeutet hier „einwärts“, also zum inneren Mittelpunkt unter dem Becken hin.
