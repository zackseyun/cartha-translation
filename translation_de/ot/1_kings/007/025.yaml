  register: Moderne, würdevolle Standardsprache mit klarer räumlicher Beschreibung. Die viergliedrige Wiederholung des Hebräischen bleibt erhalten. Der Fußnotenmarker [a] steht bei „Westen“, auf das die Erläuterung tatsächlich bezogen ist; [b] steht bei der Aussage über die nach innen gerichteten Hinterteile.
