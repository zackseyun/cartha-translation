  text: and the one Sea[a], and the twelve oxen under the Sea;
translation:
  language: de
  text: und das eine Meer[a] und die zwölf Rinder unter dem Meer;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das eine Becken und die zwölf Rinder unter dem Becken«. Das Hebräische nennt das große Wasserbecken „Meer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיָּם
  choice: das »Meer«
  rationale: Im Zusammenhang mit der Tempelausstattung bezeichnet יָם das große gegossene Wasserbecken. »Meer« bewahrt die traditionelle, bildhafte Bezeichnung; die Anführungszeichen machen deutlich, dass hier ein bestimmter Gegenstand gemeint ist.
- source_word: הָאֶחָד
  choice: das eine
  rationale: Der bestimmte Artikel zusammen mit dem Zahlwort hebt dieses einzelne »Meer« gegenüber den mehreren anderen Einrichtungsgegenständen der Aufzählung hervor.
- source_word: הַבָּקָר
  choice: die Rinder
  rationale: בָּקָר bezeichnet hier die zwölf Rinderfiguren, auf denen das »Meer« ruhte. »Rinder« ist geschlechtsneutral und vermeidet die nicht ausdrücklich im Wort enthaltene Festlegung auf Stiere oder Ochsen.
- source_word: שְׁנֵים עָשָׂר
  choice: zwölf
  rationale: Direkte Wiedergabe der Kardinalzahl.
- source_word: תַּחַת
  choice: unter
  rationale: Die Präposition bezeichnet die räumliche Position der Rinderfiguren unter dem Wasserbecken.
- source_word: וְאֶת
  choice: und
  rationale: Das wiederholte וְ mit dem nicht eigens zu übersetzenden Akkusativzeichen setzt die Inventarliste fort; »und« bewahrt den Anschluss an den vorangehenden Satzteil.
