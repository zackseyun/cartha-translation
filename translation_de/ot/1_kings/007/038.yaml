  register: Modernes, allgemein verständliches Standarddeutsch in sachlich-würdigem Erzählstil. Alte Maßeinheiten bleiben erhalten; eine erschlossene Maßrichtung wird im Text lesbar ausgedrückt und in der Fußnote als nicht ausdrücklich bezeichnet kenntlich gemacht.
