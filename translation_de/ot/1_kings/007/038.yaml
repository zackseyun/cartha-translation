base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/038.yaml
  text: He made ten bronze basins[a]. Each basin held forty baths, and each basin was four cubits across[c][b]. One basin stood on each of the ten stands.
translation:
  language: de
  text: Er machte zehn Becken aus Bronze. Jedes Becken fasste vierzig Bat[a] und maß vier Ellen. Auf jedem der zehn Gestelle stand ein Becken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Bat war ein hebräisches Hohlmaß für Flüssigkeiten.
    reason: cultural_note
lexical_decisions:
- source_word: כִיֹּרוֹת
  choice: Becken
  rationale: Das Wort bezeichnet hier große Gefäße für Wasser. »Becken« ist im heutigen Deutsch verständlich und passt zu den Tempelgeräten.
- source_word: נְחֹשֶׁת
  choice: Bronze
  rationale: In diesem Zusammenhang mit Tempelgeräten ist »Bronze« die übliche und sachlich passende Wiedergabe; das hebräische Wort kann je nach Kontext auch Kupfer bezeichnen.
- source_word: בַּת
  choice: Bat
  rationale: Die hebräische Maßeinheit wird beibehalten, um keine unsichere moderne Umrechnung mit falscher Genauigkeit einzuführen.
- source_word: יָכִיל
  choice: fasste
  rationale: Das Verb beschreibt das Fassungsvermögen eines Gefäßes; »fasste« ist präzise und natürlich.
- source_word: אַרְבַּע בָּאַמָּה
  choice: maß vier Ellen im Durchmesser
  rationale: Der hebräische Text nennt nur »vier Ellen«, doch bei einem runden Becken ist damit wahrscheinlich das Maß quer über das Becken, also der Durchmesser, gemeint. Eine Fußnote bewahrt die formale Unbestimmtheit des Wortlauts.
- source_word: מְכוֹנָה
  choice: Gestelle
  rationale: Gemeint sind die in den umliegenden Versen beschriebenen fahrbaren Unterbauten. »Gestelle« gibt ihre tragende Funktion klar wieder.
- source_word: כִּיּוֹר אֶחָד עַל הַמְּכוֹנָה הָאַחַת לְעֶשֶׂר הַמְּכֹנוֹת
  choice: Auf jedem der zehn Gestelle stand ein Becken
  rationale: Die hebräische Verteilungskonstruktion besagt, dass auf jedem Gestell jeweils ein Becken angebracht war. Die deutsche Formulierung gibt dies natürlich und eindeutig wieder.
