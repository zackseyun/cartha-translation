  source_fidelity: 'Der deutsche Text gibt sämtliche wesentlichen Angaben des Hebräischen wieder: das gegossene „Meer“, den Durchmesser von zehn Ellen, die runde Form, die Höhe von fünf Ellen sowie den Umfang von dreißig Ellen. Die Umschreibung „eine dreißig Ellen lange Messschnur umspannte es ringsum“ gibt die bildhafte hebräische Messformulierung angemessen wieder, ohne die rechnerische Spannung zwischen Durchmesser und Umfang zu harmonisieren.'
