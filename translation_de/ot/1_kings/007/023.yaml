source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ אֶת הַ/יָּ֖ם מוּצָ֑ק עֶ֣שֶׂר בָּ֠/אַמָּה מִ/שְּׂפָת֨/וֹ עַד שְׂפָת֜/וֹ עָגֹ֣ל סָבִ֗יב וְ/חָמֵ֤שׁ בָּֽ/אַמָּה֙ קוֹמָת֔/וֹ ו/קוה שְׁלֹשִׁ֣ים בָּֽ/אַמָּ֔ה יָסֹ֥ב אֹת֖/וֹ סָבִֽיב־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/023.yaml
  text: Then he made the cast sea[a], ten cubits from brim to brim, round all around; its height was five cubits[c][b], and a line of thirty cubits went around it all around.
translation:
  language: de
  text: Dann machte er das gegossene Meer[a]. Es maß zehn Ellen von Rand zu Rand und war ringsum rund. Seine Höhe betrug fünf Ellen, und eine dreißig Ellen lange Messschnur[c] umspannte es ringsum.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Becken“. Im Hebräischen trägt dieses große Tempelgefäß die feste Bezeichnung „das Meer“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Eine Messschnur von dreißig Ellen umgab es ringsum“; gemeint ist ein Umfang von dreißig Ellen.'
    reason: cultural_note
  - marker: c
    text: Die überlieferte Schreibform lautet קוה; traditionell wird das Wort im Sinn von „Messschnur“ gelesen. Vergleiche 2. Chronik 4,2.
    reason: textual_variant
lexical_decisions:
- source_word: הַיָּם
  choice: das Meer
  rationale: Der hebräische Text verwendet „das Meer“ als feste Bezeichnung für das große Tempelbecken. Die wörtliche Benennung bleibt im Haupttext erhalten; die funktionale Bedeutung wird in einer Fußnote erläutert.
- source_word: מוּצָק
  choice: gegossen
  rationale: Das Partizip bezeichnet einen durch Metallguss hergestellten Gegenstand. „Das gegossene Meer“ ist knapp und sachlich.
- source_word: עֶשֶׂר בָּאַמָּה מִשְּׂפָתוֹ עַד שְׂפָתוֹ
  choice: zehn Ellen von Rand zu Rand
  rationale: שָׂפָה bezeichnet hier den Rand des Gefäßes; die Wendung gibt den Durchmesser idiomatisch wieder, ohne den mathematischen Begriff in den Text einzutragen.
- source_word: עָגֹל סָבִיב
  choice: ringsum rund
  rationale: Die Formulierung bewahrt sowohl die Aussage über die runde Gestalt als auch die verstärkende räumliche Angabe.
- source_word: קוֹמָתוֹ
  choice: seine Höhe
  rationale: Im baulichen Zusammenhang ist „Höhe“ die natürliche und genaue Wiedergabe.
- source_word: ו/קוה
  choice: eine ... Messschnur
  rationale: Die schriftliche Form קוה wird im Zusammenhang als Linie beziehungsweise Messschnur verstanden. „Messschnur“ macht die Funktion im Deutschen klar und lässt die textliche Besonderheit für die Fußnote offen.
- source_word: יָסֹב אֹתוֹ סָבִיב
  choice: umspannte es ringsum
  rationale: „Umspannte“ entspricht dem Umgeben des Beckens durch die Messschnur; „ringsum“ bewahrt die Wiederholung und Betonung des Hebräischen.
- source_word: אַמָּה
  choice: Elle
  rationale: „Elle“ ist die etablierte deutsche Bezeichnung für das antike Längenmaß und wird im Haupttext nicht modern umgerechnet.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kurze Hauptsätze lösen die dichte hebräische Maßbeschreibung verständlich auf. Die traditionelle Gefäßbezeichnung „Meer“ und das antike Maß „Elle“ bleiben erhalten; die scheinbare Näherung zwischen Durchmesser und Umfang wird nicht harmonisiert.
