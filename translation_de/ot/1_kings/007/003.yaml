  - severity: low
    issue: „die auf den Säulen lagen“ ist sprachlich und bautechnisch unbeholfen.
    rationale: Das Hebräische sagt nur, dass die betreffenden Teile auf den Säulen waren. „ruhten“ gibt dies in natürlichem Deutsch wieder, ohne eine präzisere Konstruktion zu behaupten.
  revised_text: Es war von oben mit Zedernholz verkleidet, über den seitlichen Bauteilen, die auf fünfundvierzig Säulen ruhten, fünfzehn je Reihe.
