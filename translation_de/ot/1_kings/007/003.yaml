  text: It was paneled with cedar above[a], over the side chambers that were on the pillars, forty-five in all, fifteen to a row.
translation:
  language: de
  text: Es war von oben mit Zedernholz verkleidet, über den seitlichen Bauteilen, die auf fünfundvierzig Säulen ruhten, fünfzehn je Reihe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְסָפֻן
  choice: war es … verkleidet
  rationale: Das passive Partizip bezeichnet ein Bedecken oder Verkleiden mit einem Baumaterial. „Verkleidet“ passt zum Zedernholz und legt sich weniger stark als „überdacht“ auf eine bestimmte Bauweise fest.
- source_word: בָּאֶרֶז
  choice: mit Zedernholz
  rationale: Die Präposition kennzeichnet hier das Material; „mit Zedernholz“ ist im Deutschen natürlich und eindeutig.
- source_word: מִמַּעַל
  choice: oben
  rationale: Das Wort lokalisiert die Verkleidung im oberen Bereich der Konstruktion.
- source_word: עַל הַצְּלָעֹת
  choice: über den Seitenbauten
  rationale: צלעות kann wörtlich „Seiten/Rippen“ und im architektonischen Zusammenhang Seitenräume oder seitliche Bauteile bezeichnen. „Seitenbauten“ bewahrt die bauliche Unbestimmtheit besser als das engere „Seitenkammern“.
- source_word: אֲשֶׁר עַל הָעַמּוּדִים
  choice: die auf den Säulen lagen
  rationale: Die Formulierung gibt die räumliche Beziehung eng am Hebräischen wieder, ohne eine präzisere statische Konstruktion vorauszusetzen.
- source_word: אַרְבָּעִים וַחֲמִשָּׁה
  choice: insgesamt fünfundvierzig
  rationale: Die Zahl nennt offenbar die Gesamtzahl der zuvor erwähnten Bauelemente; „insgesamt“ verdeutlicht die Beziehung zur anschließenden Verteilung.
- source_word: חֲמִשָּׁה עָשָׂר הַטּוּר
  choice: fünfzehn in jeder Reihe
  rationale: טור bezeichnet eine Reihe oder Lage. Die Formulierung gibt die Aufteilung der fünfundvierzig Elemente in Reihen zu je fünfzehn verständlich wieder.
