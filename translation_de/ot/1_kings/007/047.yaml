source:
  edition: WLC
  text: וַ/יַּנַּ֤ח שְׁלֹמֹה֙ אֶת כָּל הַ/כֵּלִ֔ים מֵ/רֹ֖ב מְאֹ֣ד מְאֹ֑ד לֹ֥א נֶחְקַ֖ר מִשְׁקַ֥ל הַ/נְּחֹֽשֶׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/047.yaml
  text: And Solomon left all the vessels unweighed because they were exceedingly many[a]; the weight of the bronze was not determined.
translation:
  language: de
  text: Salomo ließ alle Geräte ungewogen, weil es überaus viele waren[a]; das Gewicht der Bronze wurde nicht ermittelt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Salomo ließ alle Geräte stehen, weil es überaus viele waren; das Gewicht der Bronze wurde nicht untersucht.“'
    reason: Die Bedeutung von וַיַּנַּח kann allgemeiner „ließ stehen/liegen“ sein; לֹא נֶחְקַר kann formaler mit „wurde nicht untersucht/erforscht“ wiedergegeben werden. Die Alternative bewahrt diese lexikalische Offenheit.
lexical_decisions:
- source_word: וַיַּנַּח
  choice: ließ … ungewogen
  rationale: Das Verb bezeichnet hier, dass Salomo von einer weiteren Handlung absah. Der folgende Satz nennt ausdrücklich das nicht ermittelte Gewicht; daher gibt „ließ … ungewogen“ den Zusammenhang natürlich wieder, ohne einen sachfremden Gedanken hinzuzufügen.
- source_word: כָּל הַכֵּלִים
  choice: alle Geräte
  rationale: כֵּלִים ist ein weiter Begriff für Geräte, Gegenstände oder Gerätschaften. Im Zusammenhang der Tempelausstattung ist „Geräte“ verständlich und sachlich angemessen.
- source_word: מֵרֹב מְאֹד מְאֹד
  choice: weil es überaus viele waren
  rationale: מִן mit רֹב gibt hier den Grund an; die Wiederholung von מְאֹד verstärkt die Aussage deutlich. „Überaus viele“ bewahrt diesen Nachdruck in flüssigem Deutsch.
- source_word: לֹא נֶחְקַר
  choice: wurde nicht ermittelt
  rationale: Der Niphal von חקר bezeichnet hier ein nicht erfolgtes Erforschen beziehungsweise Feststellen. Bei einem Gewicht ist „wurde nicht ermittelt“ die präzise und natürliche Wiedergabe.
- source_word: מִשְׁקַל
  choice: das Gewicht
  rationale: Das Substantiv bezeichnet das Gewicht oder die nach Gewicht bestimmte Menge. „Das Gewicht“ ist die direkte Entsprechung.
- source_word: הַנְּחֹשֶׁת
  choice: der Bronze
  rationale: נְחֹשֶׁת wird bei Tempelgeräten herkömmlich und sachlich passend mit „Bronze“ wiedergegeben, nicht mit reinem Kupfer.
