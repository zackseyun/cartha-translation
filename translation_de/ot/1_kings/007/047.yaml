  source_fidelity: Die Hauptfassung trifft den Sinn des hebräischen Satzes zuverlässig. „ließ … ungewogen“ macht die durch den Folgesatz nahegelegte unterlassene Gewichtsermittlung explizit; dies entspricht auch der englischen POB-Entscheidung. Die Kausalität von מֵרֹב מְאֹד מְאֹד, die starke Intensivierung und die abschließende Feststellung zum Gewicht der Bronze sind gewahrt.
