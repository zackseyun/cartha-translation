  terminology: „Geräte“, „Gewicht“ und „Bronze“ passen im Kontext der Tempelausstattung. „Bronze“ ist hier gegenüber „Kupfer“ die sachlich naheliegende Wahl. Die Fußnote dokumentiert zutreffend die allgemeinere Bedeutung von וַיַּנַּח sowie die formellere Möglichkeit für לֹא נֶחְקַר, ohne eine theologische Deutung einzutragen.
