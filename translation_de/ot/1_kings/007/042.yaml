base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/042.yaml
  text: and the four hundred pomegranates for the two latticeworks[a], two rows of pomegranates for each latticework[b], to cover the two bowl-shaped capitals that were on the tops of the pillars.
translation:
  language: de
  text: dazu die vierhundert Granatäpfel für die beiden Gitterwerke[a], je zwei Reihen Granatäpfel für jedes Gitterwerk, um die beiden Wölbungen der Kapitelle[b] zu bedecken, die oben auf den Säulen waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Netzwerke“. Gemeint ist durchbrochenes Zierwerk an den Kapitellen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „die beiden rundlichen Gebilde der Kapitelle“. Der Ausdruck bezeichnet möglicherweise schalenförmige Teile der Kapitelle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רִמֹּנִים
  choice: Granatäpfel
  rationale: Das Substantiv bezeichnet wörtlich Granatäpfel. Im Zusammenhang sind Schmuckformen gemeint, doch der konkrete Ausdruck des Hebräischen bleibt erhalten.
- source_word: שְׂבָכוֹת
  choice: Gitterwerke
  rationale: Der Ausdruck bezeichnet netz- oder gitterartig gearbeitetes Zierwerk an den Kapitellen. „Gitterwerke“ ist im Deutschen verständlich und bildet den handwerklich-ornamentalen Sinn ab.
- source_word: טוּרִים
  choice: Reihen
  rationale: Das Wort bezeichnet geordnete Reihen und passt zur Anordnung der Granatapfelverzierungen.
- source_word: לַשְּׂבָכָה הָאֶחָת
  choice: für jedes Gitterwerk
  rationale: Wörtlich steht „für das eine Gitterwerk“; bei zwei Gitterwerken hat die Formulierung hier verteilenden Sinn.
- source_word: לְכַסּוֹת
  choice: zu bedecken
  rationale: Der Infinitiv bezeichnet den Zweck der Granatapfelreihen; „bedecken“ ist die direkte und sachgerechte Wiedergabe.
- source_word: גֻּלֹּת
  choice: Wölbungen
  rationale: Das Wort bezeichnet rundliche, schalen- oder kugelartige Formen. „Wölbungen“ ist im architektonischen Zusammenhang natürlich, ohne die genaue Gestalt stärker festzulegen, als es der hebräische Ausdruck erlaubt.
- source_word: כֹּתָרֹת
  choice: Kapitelle
  rationale: Im architektonischen Zusammenhang sind die oberen Abschlüsse der Säulen gemeint; „Kapitelle“ ist der präzise deutsche Fachausdruck.
- source_word: עַל פְּנֵי הָעַמּוּדִים
  choice: oben auf den Säulen
  rationale: Die Wendung lautet formal etwa „auf der Vorderseite/Fläche der Säulen“, bezeichnet in dieser Baubeschreibung aber die Lage der Kapitelle oben auf den Säulen.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache in einem fortlaufenden Inventarsatz. „Dazu“ gibt das einleitende וְאֶת im Zusammenhang einer Aufzählung natürlich wieder. Die architektonischen Fachwörter bleiben verständlich; die unbestimmte Form von גֻּלֹּת wird nicht vorschnell auf eine einzige geometrische Gestalt festgelegt.
