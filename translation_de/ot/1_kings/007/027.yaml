  text: וַ/יַּ֧עַשׂ אֶת הַ/מְּכֹנ֛וֹת עֶ֖שֶׂר נְחֹ֑שֶׁת אַרְבַּ֣ע בָּ/אַמָּ֗ה אֹ֚רֶךְ הַ/מְּכוֹנָ֣ה הָֽ/אֶחָ֔ת וְ/אַרְבַּ֤ע בָּֽ/אַמָּה֙ רָחְבָּ֔/הּ וְ/שָׁלֹ֥שׁ בָּ/אַמָּ֖ה קוֹמָתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/027.yaml
  text: He made ten bronze stands. The length of each stand was four cubits[a], its width four cubits, and its height three cubits.
translation:
  language: de
  text: Er fertigte zehn bronzene Gestelle[a] an. Jedes Gestell war vier Ellen[b] lang, vier Ellen breit und drei Ellen hoch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Sockel. Der hebräische Ausdruck bezeichnet hier die bronzenen Trägergestelle für die Becken im Tempelbereich.'
    reason: lexical_alternative
  - marker: b
    text: Eine Elle entsprach ungefähr 45 Zentimetern.
    reason: measurement_explanation
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Er fertigte … an
  rationale: Das Wayyiqtol führt die Erzählung fort. „Anfertigen“ ist bei kunsthandwerklich hergestellten Tempelgeräten natürlicher und genauer als das allgemeinere „machen“.
- source_word: הַמְּכֹנוֹת
  choice: Gestelle
  rationale: מְכוֹנוֹת bezeichnet hier die in den folgenden Versen näher beschriebenen, mit Rädern versehenen Träger der Wasserbecken. „Gestelle“ gibt ihre Funktion verständlich wieder, ohne sie auf bloße Sockel oder gewöhnliche Wagen zu reduzieren.
- source_word: עֶשֶׂר
  choice: zehn
  rationale: Wiedergabe der Kardinalzahl.
- source_word: נְחֹשֶׁת
  choice: bronzene
  rationale: נְחֹשֶׁת kann Kupfer oder eine Kupferlegierung bezeichnen; bei Tempelgeräten ist „Bronze“ die herkömmliche und kontextuell wahrscheinliche Wiedergabe.
- source_word: הַמְּכוֹנָה הָאֶחָת
  choice: jedes Gestell
  rationale: Wörtlich „das eine Gestell“; die Formulierung hat hier distributiven Sinn und bezeichnet die Maße jedes einzelnen Gestells.
- source_word: אַרְבַּע בָּאַמָּה אֹרֶךְ … וְאַרְבַּע בָּאַמָּה רָחְבָּהּ … וְשָׁלֹשׁ בָּאַמָּה קוֹמָתָהּ
  choice: vier Ellen lang, vier Ellen breit und drei Ellen hoch
  rationale: Die idiomatische deutsche Maßangabe bewahrt alle drei Maße und ihre Zuordnung zu Länge, Breite und Höhe.
- source_word: אַמָּה
  choice: Elle
  rationale: Die alte Maßeinheit bleibt erhalten, da ihre genaue moderne Länge nicht sicher feststeht; eine ungefähre Erklärung steht in der Fußnote.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Maßbeschreibung wurde idiomatisch als „lang, breit, hoch“ formuliert; die sachliche Wiederholung und sämtliche Maßangaben des Hebräischen bleiben erhalten.
