  to: Er war der Sohn einer Witwe aus dem Stamm Naftali, und sein Vater war ein Mann aus Tyrus, ein Bronzehandwerker[a]. Er war erfüllt mit Weisheit, Verständnis und Erkenntnis, um jede Art von Arbeit in Bronze auszuführen. So kam er zu König Salomo und führte all seine Arbeit aus.
