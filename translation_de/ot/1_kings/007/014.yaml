source:
  edition: WLC
  text: בֶּן אִשָּׁה֩ אַלְמָנָ֨ה ה֜וּא מִ/מַּטֵּ֣ה נַפְתָּלִ֗י וְ/אָבִ֣י/ו אִישׁ צֹרִי֮ חֹרֵ֣שׁ נְחֹשֶׁת֒ וַ֠/יִּמָּלֵא אֶת הַ/חָכְמָ֤ה וְ/אֶת הַ/תְּבוּנָה֙ וְ/אֶת הַ/דַּ֔עַת לַ/עֲשׂ֥וֹת כָּל מְלָאכָ֖ה בַּ/נְּחֹ֑שֶׁת וַ/יָּבוֹא֙ אֶל הַ/מֶּ֣לֶךְ שְׁלֹמֹ֔ה וַ/יַּ֖עַשׂ אֶת כָּל מְלַאכְתּֽ/וֹ־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/014.yaml
  text: He was the son of a widow from the tribe of Naphtali[a], and his father was a man of Tyre, a worker in bronze. He was filled with wisdom, understanding, and knowledge to do every kind of work in bronze[b]. So he came to King Solomon and did all his work.
translation:
  language: de
  text: Er war der Sohn einer Witwe aus dem Stamm Naftali, und sein Vater war ein Mann aus Tyrus, ein Bronzehandwerker[a]. Er war erfüllt mit Weisheit, Verständnis und Erkenntnis, um jede Art von Arbeit in Bronze auszuführen. So kam er zu König Salomo und führte all seine Arbeit aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann Kupfer oder Bronze bezeichnen; im Zusammenhang der Tempelausstattung ist hier wahrscheinlich Bronze gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אִשָּׁה אַלְמָנָה
  choice: der Sohn einer Witwe
  rationale: Gibt die hebräische Konstruktion klar und natürlich wieder und bewahrt die Hervorhebung des verwitweten Standes seiner Mutter.
- source_word: מִמַּטֵּה נַפְתָּלִי
  choice: aus dem Stamm Naftali
  rationale: מַטֶּה bezeichnet hier die Stammeszugehörigkeit.
- source_word: אִישׁ צֹרִי
  choice: ein Mann aus Tyrus
  rationale: Das Gentiliz צֹרִי bezeichnet einen Mann aus Tyrus; die Formulierung ist im modernen Deutsch natürlich.
- source_word: חֹרֵשׁ נְחֹשֶׁת
  choice: ein Bronzeschmied
  rationale: חֹרֵשׁ bezeichnet einen fachkundigen Handwerker; im Zusammenhang der Tempelgeräte ist ein auf Bronze spezialisierter Metallhandwerker gemeint.
- source_word: וַיִּמָּלֵא
  choice: Er war erfüllt
  rationale: Bewahrt den passiven Sinn der hebräischen Form und stellt die Befähigung als empfangene Ausstattung dar, ohne deren Urheber ausdrücklich zu ergänzen.
- source_word: הַחָכְמָה וְאֶת הַתְּבוּנָה וְאֶת הַדַּעַת
  choice: Weisheit, Verständnis und Erkenntnis
  rationale: Gibt die dreifache Befähigung differenziert wieder; im Kontext umfasst sie besonders handwerkliches Können.
- source_word: לַעֲשׂוֹת כָּל מְלָאכָה בַּנְּחֹשֶׁת
  choice: um jede Art von Arbeit in Bronze auszuführen
  rationale: Drückt sowohl die umfassende Reichweite von כָּל מְלָאכָה als auch den Werkstoff aus.
- source_word: וַיָּבוֹא אֶל הַמֶּלֶךְ שְׁלֹמֹה
  choice: So kam er zu König Salomo
  rationale: Gibt die fortschreitende Erzählfolge in natürlichem Deutsch wieder.
- source_word: וַיַּעַשׂ אֶת כָּל מְלַאכְתּוֹ
  choice: und führte alle seine Arbeiten aus
  rationale: Bewahrt den naheliegenden Bezug des Suffixes auf die Arbeiten des Handwerkers, ohne eine ausdrückliche Zuweisung oder Vollendung hinzuzufügen.
theological_decisions:
- issue: Urheber der handwerklichen Befähigung
  choice: Die Passivform „war erfüllt“ wird ohne ausdrücklich genannten Urheber beibehalten.
  alternative: „Gott hatte ihn erfüllt“
  rationale: Der hebräische Vers nennt den Handelnden nicht ausdrücklich; eine Ergänzung würde die im Ausgangstext vorhandene Offenheit auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Bronzeschmied“ vermittelt fachkundiges Metallhandwerk prägnant; die Passivform und der mögliche Bedeutungsumfang von נְחֹשֶׁת bleiben gewahrt.
