    text: 'Wörtlicher: „Denn Hiram liebte David alle Tage.“ Gemeint ist eine dauerhaft wohlwollende Beziehung; auch möglich: „Hiram war David sein Leben lang freundschaftlich verbunden.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Da sandte
  rationale: Das narrative Wayyiqtol wird mit deutschem Präteritum wiedergegeben; „da“ markiert natürlich den Fortgang der Erzählung.
- source_word: חִירָם מֶלֶךְ צֹר
  choice: Hiram, der König von Tyrus
  rationale: Die Apposition wird im Deutschen mit bestimmtem Artikel idiomatisch und eindeutig formuliert.
- source_word: עֲבָדָיו
  choice: seine Diener
  rationale: עבד kann Diener, Untergebene oder königliche Beamte bezeichnen. „Diener“ bewahrt die lexikalische Breite, ohne den Status unnötig festzulegen.
- source_word: אֶל שְׁלֹמֹה
  choice: zu Salomo
  rationale: Die Präposition bezeichnet die Richtung beziehungsweise den Adressaten; ein nicht ausdrücklich genannter Besuchszweck wird nicht ergänzt.
- source_word: כִּי שָׁמַע
  choice: denn er hatte gehört
  rationale: כִּי begründet Hirams Handlung; das Plusquamperfekt macht deutlich, dass das Hören dem Senden vorausging.
- source_word: כִּי אֹתוֹ מָשְׁחוּ לְמֶלֶךְ
  choice: dass man ihn … zum König gesalbt hatte
  rationale: Die unbestimmte dritte Person Plural wird im Deutschen natürlich mit „man“ wiedergegeben; משׁח bezeichnet hier die königliche Salbung beziehungsweise Einsetzung.
- source_word: תַּחַת אָבִיהוּ
  choice: anstelle seines Vaters
  rationale: תחת bezeichnet im Zusammenhang der Thronfolge das Eintreten an die Stelle des Vaters.
- source_word: כִּי אֹהֵב הָיָה חִירָם לְדָוִד
  choice: Hiram war nämlich David … zugetan
  rationale: Die Konstruktion mit Partizip und היה beschreibt eine andauernde wohlwollende Beziehung. „Zugetan“ erhält die emotionale und relationale Offenheit, ohne sie ausschließlich als Freundschaft oder politische Allianz zu bestimmen.
- source_word: כָּל הַיָּמִים
  choice: allezeit
  rationale: Die Wendung bezeichnet fortdauernde Beständigkeit. „Allezeit“ ist knapp, würdig und im modernen Standarddeutsch verständlich.
