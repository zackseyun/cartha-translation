  text: Then Hiram king of Tyre sent his servants to Solomon[a], because he had heard that they had anointed him king in place of his father, for Hiram had always loved David.
translation:
  language: de
  text: Da sandte Hiram, der König von Tyrus, seine Diener zu Salomo, denn er hatte gehört, dass man ihn anstelle seines Vaters zum König gesalbt hatte. Hiram war nämlich David allezeit zugetan.[a]
  philosophy: optimal-equivalence
  footnotes:
