translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit natürlichem Erzählfluss. Die zweimalige hebräische Begründung mit כִּי wird durch „denn“ und „nämlich“ nachvollziehbar abgebildet. Der Fußnotenmarker steht unmittelbar bei der erklärungsbedürftigen Beziehungsformulierung.
