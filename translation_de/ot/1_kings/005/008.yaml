- from: Gerste und Stroh für die Pferde und die Reittiere brachten sie an den Ort, an dem der jeweils zuständige Mann war[a], wie es ihm vorgeschrieben war.[b]
  to: Gerste und Stroh für die Pferde und die Reittiere brachten sie an den Ort, wo sich jeweils der betreffende Mann aufhielt[a], jeder nach seiner Vorschrift.[b]
  rationale: Die Revision glättet die deutsche Syntax und macht die distributive Zuordnung von „jeder“ und „seiner Vorschrift“ sichtbar. Die Fußnote zu אִישׁ wurde vorsichtiger formuliert, damit die kontextuelle Identifikation nicht als Bestandteil des hebräischen Wortlauts erscheint. Die begründete Unbestimmtheit von רֶכֶשׁ bleibt erhalten.
