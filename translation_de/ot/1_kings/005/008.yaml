  source_fidelity: Die Wiedergabe von Gerste, Stroh, Pferden und רֶכֶשׁ als „Reittiere“ ist sachgerecht; Letzteres bewahrt die lexikalische Unsicherheit, ohne es auf Maultiere oder besondere Pferde festzulegen. Die distributive Funktion von אִישׁ und der administrative Sinn von כְּמִשְׁפָּטוֹ sind im Entwurf grundsätzlich richtig erfasst. Die Formulierung „wie es ihm vorgeschrieben war“ macht den Bezug von כְּמִשְׁפָּטוֹ jedoch unnötig unpersönlich und weniger transparent als eine distributive Zuordnung zu den genannten Personen.
  naturalness: Der Satz ist verständlich, doch „an dem der jeweils zuständige Mann war“ klingt im modernen Standarddeutsch hölzern. „wo sich jeweils der betreffende Mann aufhielt“ ist idiomatischer und hält die im Kontext vorausgesetzte Referenz auf die jeweiligen Verantwortlichen zurückhaltend fest.
  terminology: „Reittiere“ ist als nicht spezifizierende Lösung für רֶכֶשׁ geeignet. „Nach seiner Vorschrift“ gibt den hier administrativ verstandenen Begriff מִשְׁפָּט klarer wieder als „wie es ihm vorgeschrieben war“, ohne ihn auf eine bestimmte Art von Pflicht oder Zuteilung festzulegen.
