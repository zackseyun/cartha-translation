base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/008.yaml
  text: And the barley and the straw for the horses and the steeds were brought to the place where each man was[b][a], according to his duty.
translation:
  language: de
  text: Gerste und Stroh für die Pferde und die Reittiere brachten sie an den Ort, wo sich jeweils der betreffende Mann aufhielt[a], jeder nach seiner Vorschrift.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wo jeweils ein Mann sein wird/ist“; im Zusammenhang ist wohl jeweils der verantwortliche Versorgungsbeamte gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „nach seiner festgelegten Verpflichtung“ beziehungsweise „nach seiner Zuteilung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׂעֹרִים
  choice: Gerste
  rationale: Das Substantiv bezeichnet hier Gerste als Futter beziehungsweise Versorgungsgut; im Deutschen ist der Stoffname ohne Artikel natürlich.
- source_word: וְהַתֶּבֶן
  choice: Stroh
  rationale: תֶּבֶן bezeichnet gewöhnlich Stroh oder als Futter dienende Halme; im Parallelismus mit Gerste passt „Stroh“ am besten.
- source_word: לַסּוּסִים
  choice: für die Pferde
  rationale: Direkte und natürliche Wiedergabe der Präposition mit dem gewöhnlichen Wort für Pferde.
- source_word: וְלָרָכֶשׁ
  choice: und die Reittiere
  rationale: רֶכֶשׁ bezeichnet wohl besondere Reit- oder Zugtiere im königlichen Umfeld. „Reittiere“ bewahrt die Unbestimmtheit besser als die Festlegung auf Maultiere oder Streitwagenpferde.
- source_word: יָבִיאוּ
  choice: brachten sie
  rationale: Die aktive Verbform im Hebräischen wird formal gewahrt; das unbestimmte Pluralsubjekt ergibt sich aus dem vorausgehenden Verwaltungskontext.
- source_word: אֶל־הַמָּקוֹם
  choice: an den Ort
  rationale: Natürliche deutsche Richtungsangabe für die Lieferung zu einem bestimmten Aufenthaltsort.
- source_word: אֲשֶׁר יִהְיֶה שָּׁם אִישׁ
  choice: an dem der jeweils zuständige Mann war
  rationale: אִישׁ steht distributiv. „Jeweils zuständig“ macht verständlich, dass jeder verantwortliche Versorgungsbeamte an seinem Einsatzort gemeint ist, ohne das Singularbild aufzugeben.
- source_word: כְּמִשְׁפָּטוֹ
  choice: wie es ihm vorgeschrieben war
  rationale: מִשְׁפָּט bezeichnet hier die festgelegte Ordnung oder Verpflichtung, nicht ein Gerichtsurteil. Die Formulierung gibt den administrativen Sinn idiomatisch wieder.
