  text: וַ/יְהִ֞י כִּ/שְׁמֹ֧עַ חִירָ֛ם אֶת דִּבְרֵ֥י שְׁלֹמֹ֖ה וַ/יִּשְׂמַ֣ח מְאֹ֑ד וַ/יֹּ֗אמֶר בָּר֤וּךְ יְהוָה֙ הַ/יּ֔וֹם אֲשֶׁ֨ר נָתַ֤ן לְ/דָוִד֙ בֵּ֣ן חָכָ֔ם עַל הָ/עָ֥ם הָ/רָ֖ב הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/021.yaml
  text: And when Hiram heard the words of Solomon, he rejoiced greatly and said, “Blessed be the LORD today, who has given David a wise son over this great people.”
translation:
  language: de
  text: 'Als Hiram Salomos Worte hörte, freute er sich sehr und sagte: »Gepriesen sei der HERR heute, der David einen weisen Sohn über dieses große Volk gegeben hat.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דִּבְרֵי שְׁלֹמֹה
  choice: Salomos Worte
  rationale: Gibt die hebräische Genitivverbindung direkt und natürlich wieder.
- source_word: וַיִּשְׂמַח מְאֹד
  choice: freute er sich sehr
  rationale: Entspricht der gewöhnlichen Bedeutung und Intensivierung des hebräischen Ausdrucks.
- source_word: בָּרוּךְ יְהוָה הַיּוֹם
  choice: Gepriesen sei der HERR heute
  rationale: Bewahrt sowohl die Segensformel als auch das ausdrücklich gesetzte הַיּוֹם; das Tetragramm wird nach verbreiteter deutscher Bibeltradition mit HERR wiedergegeben.
- source_word: נָתַן לְדָוִד בֵּן חָכָם
  choice: der David einen weisen Sohn … gesetzt hat
  rationale: Das Verb נתן bedeutet wörtlich „gegeben“; zusammen mit עַל bezeichnet es hier die Einsetzung des weisen Sohnes in eine Herrschaftsstellung.
- source_word: עַל הָעָם הָרָב הַזֶּה
  choice: über dieses große Volk
  rationale: Gibt Herrschaftsbeziehung, Demonstrativum und Größenbezeichnung knapp und formal entsprechend wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: der HERR
  alternative: Jahwe
  rationale: Die traditionelle Kennzeichnung wahrt die besondere Funktion des Gottesnamens, ohne eine bestimmte Rekonstruktion seiner Aussprache in den Haupttext zu setzen.
- issue: Aussage eines phönizischen Königs über den HERRN
  choice: Als direkte Lobpreisung ohne erklärenden Zusatz wiedergegeben
  alternative: Eine distanzierende oder synkretistische Erläuterung ergänzen
  rationale: Der Vers selbst enthält keine Bewertung von Hirams Glauben; die Übersetzung soll diese theologische Offenheit nicht auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nah am Hebräischen, ohne unnötig altertümlich zu wirken. „Gepriesen sei“ erhält den feierlichen Charakter der Segensformel.
