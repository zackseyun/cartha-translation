source:
  edition: WLC
  text: וַ/יִּשְׁלָחֵ֣/ם לְבָנ֗וֹנָ/ה עֲשֶׂ֨רֶת אֲלָפִ֤ים בַּ/חֹ֨דֶשׁ֙ חֲלִיפ֔וֹת חֹ֚דֶשׁ יִהְי֣וּ בַ/לְּבָנ֔וֹן שְׁנַ֥יִם חֳדָשִׁ֖ים בְּ/בֵית֑/וֹ וַ/אֲדֹנִירָ֖ם עַל הַ/מַּֽס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/028.yaml
  text: He sent them to Lebanon[a], ten thousand a month in shifts; they would be in Lebanon one month and two months at home[c][b], and Adoniram was over the forced labor.
translation:
  language: de
  text: Er schickte sie in den Libanon, jeden Monat zehntausend Mann in wechselnden Gruppen[a]. Einen Monat waren sie im Libanon und zwei Monate zu Hause[b]. Adoniram hatte die Aufsicht über den Frondienst[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Ablösungen“ beziehungsweise „in Schichten“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „in seinem Haus“; gemeint ist das Zuhause des jeweiligen Arbeiters.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „die Zwangsarbeit“. Der hebräische Ausdruck bezeichnet staatlich auferlegte Pflichtarbeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלָחֵם
  choice: Er schickte sie
  rationale: Die Form von שׁלח mit dem Suffix der 3. Person Plural bezeichnet schlicht, dass er sie entsandte; „schickte“ ist natürlich und bewahrt den Erzählstil.
- source_word: לְבָנוֹנָה
  choice: in den Libanon
  rationale: Die Richtungsendung bezeichnet eine Bewegung zum Libanon hin; im Deutschen steht bei einem Zielgebiet idiomatisch „in den Libanon“.
- source_word: עֲשֶׂרֶת אֲלָפִים בַּחֹדֶשׁ
  choice: jeden Monat zehntausend Mann
  rationale: בַּחֹדֶשׁ ist im Zusammenhang distributiv zu verstehen. „Mann“ verdeutlicht, dass die Zahl die entsandten Arbeitskräfte bezeichnet, ohne den Sinn zu erweitern.
- source_word: חֲלִיפוֹת
  choice: in wechselnden Gruppen
  rationale: Das Substantiv bezeichnet Wechsel beziehungsweise Ablösung. Die Formulierung macht das Rotationssystem in heutigem Deutsch unmittelbar verständlich.
- source_word: חֹדֶשׁ יִהְיוּ בַלְּבָנוֹן
  choice: Einen Monat waren sie im Libanon
  rationale: Der Singular חֹדֶשׁ wird als Zeitangabe wiedergegeben; „einen“ wird im Deutschen wegen der anschließenden Gegenüberstellung mit zwei Monaten ausdrücklich gesetzt.
- source_word: שְׁנַיִם חֳדָשִׁים בְּבֵיתוֹ
  choice: und zwei Monate zu Hause
  rationale: Wörtlich steht „in seinem Haus“. Der Singular hat hier kollektiven Bezug auf den jeweiligen Arbeiter; „zu Hause“ gibt diesen Sinn natürlich wieder.
- source_word: וַאֲדֹנִירָם עַל הַמַּס
  choice: Adoniram hatte die Aufsicht über den Frondienst
  rationale: עַל bezeichnet hier die Zuständigkeit. מַס meint staatlich auferlegte Pflichtarbeit; „Frondienst“ erhält den Zwangscharakter und ist im Deutschen prägnant.
