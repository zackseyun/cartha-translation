  text: וַ/יְהִ֨י חִיר֜וֹם נֹתֵ֣ן לִ/שְׁלֹמֹ֗ה עֲצֵ֧י אֲרָזִ֛ים וַ/עֲצֵ֥י בְרוֹשִׁ֖ים כָּל חֶפְצֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/024.yaml
  text: And Hiram was giving Solomon cedar timber and cypress timber[a], according to all his desire.
translation:
  language: de
  text: Und Hiram lieferte Salomo Zedernholz und Zypressenholz[a], ganz nach dessen Wunsch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Wacholderholz; traditionell: Tannenholz. Welche Baumart mit dem hebräischen Wort berosch bezeichnet wird, ist nicht sicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי ... נֹתֵן
  choice: Und ... lieferte
  rationale: Die Verbindung aus וַיְהִי und Partizip bezeichnet im Erzählzusammenhang eine fortdauernde beziehungsweise regelmäßige Bereitstellung. Das deutsche Präteritum ist hier natürlicher als die schwerfällige Verlaufsform „war dabei, ... zu geben“; „lieferte“ entspricht zudem dem Zusammenhang von Bauholzlieferungen.
- source_word: חִירוֹם
  choice: Hiram
  rationale: Der Personenname folgt der im Deutschen üblichen biblischen Namensform.
- source_word: לִשְׁלֹמֹה
  choice: Salomo
  rationale: Der Personenname folgt der im Deutschen üblichen biblischen Namensform; die Präposition לְ wird durch das direkte Lieferungsgefüge idiomatisch wiedergegeben.
- source_word: עֲצֵי אֲרָזִים
  choice: Zedernholz
  rationale: Im Bauzusammenhang bezeichnet die Wendung Holz beziehungsweise Bauholz von Zedern, nicht vorrangig lebende Bäume. „Zedernholz“ ist präzise und natürlich.
- source_word: וַעֲצֵי בְרוֹשִׁים
  choice: und Zypressenholz[a]
  rationale: בְּרוֹשִׁים bezeichnet ein als Bauholz genutztes Nadelgehölz; die genaue Baumart ist unsicher. „Zypressenholz“ ist eine verbreitete moderne Wiedergabe, während Alternativen in der Fußnote erhalten bleiben.
- source_word: כָּל חֶפְצוֹ
  choice: ganz nach dessen Wunsch
  rationale: Die Formulierung gibt den vollen Umfang des Wunsches beziehungsweise Bedarfs idiomatisch wieder. „Dessen“ bezieht sich im unmittelbaren Satzbau eindeutig auf Salomo und vermeidet die mögliche deutsche Mehrdeutigkeit von „seinem“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Präteritum trägt den hebräischen Erzählfluss natürlich; der fortdauernde Charakter der Lieferung ergibt sich aus dem Zusammenhang. Die Unsicherheit bei der Baumart wird nicht im Haupttext aufgelöst, sondern transparent in der Fußnote bewahrt.
