  naturalness: „So behauenen“ ist im modernen Standarddeutsch ungrammatisch. „Da behauten“ ist eine natürliche, würdige narrative Wiedergabe. Die Wiederaufnahme mit „sie“ ist klar und erhält die Abfolge von Behauen und Vorbereiten.
