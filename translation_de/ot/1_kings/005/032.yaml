  to: Da behauten Salomos Bauleute, Hirams Bauleute und die Männer aus Gebal[a] das Holz und die Steine und bereiteten sie für den Bau des Hauses[b] vor.
  rationale: Die zwingende grammatische Korrektur „behauten“ stellt eine korrekte deutsche Vergangenheitsform her. Die geringfügige stilistische Anpassung der Fußnote macht ihr Verhältnis zum hebräischen Gentiliz präzise, ohne eine umstrittene historische oder theologische Deutung einzutragen. Die Haupttextformulierung bleibt eng am hebräischen Satzbau und an dessen unbestimmter Bezeichnung „das Haus“.
