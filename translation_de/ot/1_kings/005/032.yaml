  text: וַֽ/יִּפְסְל֞וּ בֹּנֵ֧י שְׁלֹמֹ֛ה וּ/בֹנֵ֥י חִיר֖וֹם וְ/הַ/גִּבְלִ֑ים וַ/יָּכִ֛ינוּ הָ/עֵצִ֥ים וְ/הָ/אֲבָנִ֖ים לִ/בְנ֥וֹת הַ/בָּֽיִת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/032.yaml
  text: So Solomon’s builders[a], Hiram’s builders[b], and the men of Gebal cut and prepared the timber and the stones to build the house.
translation:
  language: de
  text: Da behauten Salomos Bauleute, Hirams Bauleute und die Männer aus Gebal[a] das Holz und die Steine und bereiteten sie für den Bau des Hauses[b] vor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: die Gebaliter oder Gibliter, das heißt Leute aus Gebal (Byblos).'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist das Haus des HERRN, der Tempel.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּפְסְלוּ
  choice: behauenen
  rationale: Das Verb פסל bezeichnet hier das Zuschneiden oder Formen von Baumaterial. »Behauen« kann sich im Deutschen sowohl auf Holz als auch auf Stein beziehen und bewahrt die konkrete handwerkliche Aussage.
- source_word: בֹּנֵי שְׁלֹמֹה
  choice: Salomos Bauleute
  rationale: Die substantivierte Form bezeichnet die für Salomos Bau tätigen Arbeiter. »Bauleute« ist natürlich und gibt den beruflichen Sinn knapp wieder.
- source_word: וּבֹנֵי חִירוֹם
  choice: Hirams Bauleute
  rationale: Die parallele Wiedergabe zu »Salomos Bauleute« erhält die Symmetrie des hebräischen Satzes.
- source_word: וְהַגִּבְלִים
  choice: die Männer aus Gebal
  rationale: Das Gentiliz bezeichnet Menschen aus Gebal, dem späteren Byblos. Die Umschreibung ist für heutige Leser unmittelbar verständlich; die genauere ethnische Bezeichnung steht in der Fußnote.
- source_word: וַיָּכִינוּ
  choice: machten sie … bereit
  rationale: Die Hifil-Form von כון bedeutet hier »vorbereiten« oder »bereitmachen«. Die Formulierung unterscheidet diesen zweiten Arbeitsschritt klar vom vorherigen Behauen.
- source_word: הָעֵצִים
  choice: das Bauholz
  rationale: Im Zusammenhang des Tempelbaus ist »Bauholz« präziser als das allgemeinere »Holz« und bezeichnet das Material, ohne eine bestimmte Holzform vorauszusetzen.
- source_word: וְהָאֲבָנִים
  choice: die Steine
  rationale: Die schlichte Wiedergabe vermeidet es, über den hebräischen Text hinaus bestimmte Steinblöcke oder Mauersteine anzunehmen.
- source_word: לִבְנוֹת הַבָּיִת
  choice: für den Bau des Hauses
  rationale: Die Formulierung gibt den Zweck des Bereitmachens natürlich wieder und bewahrt zugleich das hebräische Bild vom Tempel als »Haus«.
theological_decisions:
- issue: Bezeichnung des Tempels als הַבָּיִת
  choice: das Haus
  alternative: der Tempel / das Haus des HERRN
  rationale: Im Zusammenhang ist der Tempel gemeint, doch der hebräische Text sagt an dieser Stelle lediglich »das Haus«. Die Übersetzung bewahrt diese Ausdrucksweise; eine Fußnote erläutert den Bezug, ohne den Gottesnamen in den Haupttext einzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Behauen« bewahrt den konkreten handwerklichen Charakter des Ausgangstextes, während »Bauleute« und »machten … bereit« allgemein verständlich bleiben. Die parallele Satzstruktur der beiden Arbeitergruppen wird erhalten.
