  terminology: „Zedern“, „Libanon“, „Diener“, „Lohn“ und „Sidonier“ sind angemessen und konsistent. Die Fußnote zu אִישׁ wahrt die wörtliche Form und erläutert den kontextuellen Sinn, ohne eine weitergehende soziale Aussage vorzunehmen.
