  text: וְ/עַתָּ֡ה צַוֵּה֩ וְ/יִכְרְתוּ לִ֨/י אֲרָזִ֜ים מִן הַ/לְּבָנ֗וֹן וַֽ/עֲבָדַ/י֙ יִהְי֣וּ עִם עֲבָדֶ֔י/ךָ וּ/שְׂכַ֤ר עֲבָדֶ֨י/ךָ֙ אֶתֵּ֣ן לְ/ךָ֔ כְּ/כֹ֖ל אֲשֶׁ֣ר תֹּאמֵ֑ר כִּ֣י אַתָּ֣ה יָדַ֗עְתָּ כִּ֣י אֵ֥ין בָּ֛/נוּ אִ֛ישׁ יֹדֵ֥עַ לִ/כְרָת עֵצִ֖ים כַּ/צִּדֹנִֽים־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/020.yaml
  text: Now command that cedars from Lebanon be cut for me[a], and let my servants be with your servants, and I will give you the wages of your servants according to all that you say[b]; for you know that among us there is no man who knows how to cut timber like the Sidonians.
translation:
  language: de
  text: Befiehl nun, dass man mir Zedern vom Libanon fällt. Meine Diener sollen bei deinen Dienern sein, und ich werde dir den Lohn deiner Diener zahlen, entsprechend allem, was du sagst. Denn du weißt, dass es bei uns niemanden[a] gibt, der sich darauf versteht, Bäume zu fällen, wie die Sidonier.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „keinen Mann unter uns“. Gemeint ist, dass sich unter Salomos Leuten niemand mit vergleichbarer Fachkenntnis befindet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Befiehl nun
  rationale: „Nun“ gibt den Übergang zur königlichen Bitte natürlich wieder; der Imperativ „befiehl“ bewahrt deren direkte Form.
- source_word: וְיִכְרְתוּ לִי אֲרָזִים מִן הַלְּבָנוֹן
  choice: dass man mir Zedern vom Libanon fällt
  rationale: Die abhängige Aufforderung nach צַוֵּה wird im Deutschen idiomatisch mit einem dass-Satz wiedergegeben; „fällen“ bezeichnet präzise das Schlagen stehender Bäume.
- source_word: וַעֲבָדַי יִהְיוּ עִם עֲבָדֶיךָ
  choice: Meine Diener sollen mit deinen Dienern zusammen sein
  rationale: Die wiederholte Bezeichnung עבד bleibt als „Diener“ erhalten; „sollen“ gibt die angeordnete beziehungsweise gewünschte Zusammenarbeit wieder, ohne eine konkrete Arbeitsform hinzuzufügen.
- source_word: וּשְׂכַר עֲבָדֶיךָ אֶתֵּן לְךָ
  choice: ich werde dir den Lohn deiner Diener zahlen
  rationale: שׂכר bezeichnet den Lohn beziehungsweise die Vergütung für ihre Arbeit. „Zahlen“ ist im Deutschen natürlicher als wörtlich „geben“.
- source_word: כְּכֹל אֲשֶׁר תֹּאמֵר
  choice: entsprechend allem, was du sagst
  rationale: Die Formulierung bewahrt die umfassende Aussage und lässt offen, ob es um Höhe, Art oder weitere Bedingungen der Entlohnung geht.
- source_word: אֵין בָּנוּ אִישׁ
  choice: bei uns niemanden
  rationale: Das idiomatische deutsche „niemanden“ gibt die Aussage wieder, dass sich unter Salomos Leuten keine entsprechend kundige Person befindet; das hebräische אִישׁ lautet wörtlich „Mann“.
- source_word: יֹדֵעַ לִכְרָת עֵצִים
  choice: der sich darauf versteht, Holz zu fällen
  rationale: יֹדֵעַ mit Infinitiv bezeichnet Können oder Sachkenntnis. עֵצִים kann „Bäume“ oder „Holz“ meinen; im Zusammenhang der Holzgewinnung ist „Holz fällen“ natürlich, während die wörtlichere Lesart in der Fußnote erhalten bleibt.
- source_word: כַּצִּדֹנִים
  choice: wie die Sidonier
  rationale: Die knappe Vergleichsform bleibt erhalten und bezeichnet die bekannte Fachkunde der Sidonier.
theological_decisions: []
