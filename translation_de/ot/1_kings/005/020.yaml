  to: Befiehl nun, dass man mir Zedern vom Libanon fällt. Meine Diener sollen bei deinen Dienern sein, und ich werde dir den Lohn deiner Diener zahlen, entsprechend allem, was du sagst. Denn du weißt, dass es bei uns niemanden[a] gibt, der sich darauf versteht, Bäume zu fällen, wie die Sidonier.
  rationale: 'Die Revision beschränkt sich auf eine sichere idiomatische und sachliche Korrektur: Bäume werden gefällt, nicht Holz. Zugleich wird die Formulierung über Salomos Diener näher an die offene hebräische Aussage „mit deinen Dienern“ angelehnt. Da „Bäume“ nun im Haupttext steht, ist die bisherige Fußnote b nicht mehr erforderlich; die Fußnote a bleibt an ihrem korrekten Anker erhalten.'
