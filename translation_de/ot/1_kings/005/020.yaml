  register: Modernes, würdevolles Standarddeutsch. Die königliche Bitte bleibt direkt, ohne altertümliche Satzstellung. Die Wiederholung von „Diener“ spiegelt den hebräischen Wortlaut; die sachliche Wendung „Holz fällen“ macht den forstwirtschaftlichen Zusammenhang klar.
