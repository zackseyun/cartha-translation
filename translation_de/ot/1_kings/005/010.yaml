source:
  edition: WLC
  text: וַ/תֵּ֨רֶב֙ חָכְמַ֣ת שְׁלֹמֹ֔ה מֵֽ/חָכְמַ֖ת כָּל בְּנֵי קֶ֑דֶם וּ/מִ/כֹּ֖ל חָכְמַ֥ת מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/010.yaml
  text: And Solomon’s wisdom surpassed the wisdom of all the people of the east and all the wisdom of Egypt[a].
translation:
  language: de
  text: Und Salomos Weisheit übertraf die Weisheit aller Menschen des Ostens[a] und alle Weisheit Ägyptens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Söhne des Ostens“; eine regionale Bezeichnung für die Menschen beziehungsweise Völker des Ostens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶב
  choice: übertraf
  rationale: Das Verb רבה steht hier mit vergleichendem מִן und bezeichnet eine Überlegenheit dem Grad nach. „Übertraf“ gibt diese Aussage im modernen Deutschen klar und natürlich wieder.
- source_word: חָכְמַת / חָכְמָה
  choice: Weisheit
  rationale: Das wiederholte Substantiv bezeichnet in diesem Zusammenhang umfassend Weisheit, Bildung und geistige Fähigkeiten; „Weisheit“ ist die sachlich und stilistisch passende Wiedergabe.
- source_word: שְׁלֹמֹה
  choice: Salomo
  rationale: Übliche deutsche Form des Personennamens.
- source_word: כָּל
  choice: aller / alle
  rationale: Die beiden grammatisch angepassten Formen bewahren jeweils den umfassenden Sinn des hebräischen Ausdrucks.
- source_word: בְּנֵי קֶדֶם
  choice: Menschen des Ostens
  rationale: Wörtlich „Söhne des Ostens“; die Wendung ist eine idiomatische Bezeichnung für die Bewohner beziehungsweise Völker des Ostens. „Menschen des Ostens“ ist natürlich verständlich und vermeidet eine irreführende Beschränkung auf leibliche Söhne.
- source_word: וּמִכֹּל חָכְמַת מִצְרָיִם
  choice: und alle Weisheit Ägyptens
  rationale: Die zweite Vergleichsgröße hängt ebenfalls von „übertraf“ ab. Die koordinierte deutsche Form bewahrt den Sinn, ohne das Verb unnötig zu wiederholen.
- source_word: מִצְרָיִם
  choice: Ägypten
  rationale: Übliche deutsche Wiedergabe des Ortsnamens; im Genitiv lautet die Form hier „Ägyptens“.
