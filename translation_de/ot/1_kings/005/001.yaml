source:
  edition: WLC
  text: וּ/שְׁלֹמֹ֗ה הָיָ֤ה מוֹשֵׁל֙ בְּ/כָל הַ/מַּמְלָכ֔וֹת מִן הַ/נָּהָר֙ אֶ֣רֶץ פְּלִשְׁתִּ֔ים וְ/עַ֖ד גְּב֣וּל מִצְרָ֑יִם מַגִּשִׁ֥ים מִנְחָ֛ה וְ/עֹבְדִ֥ים אֶת שְׁלֹמֹ֖ה כָּל יְמֵ֥י חַיָּֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/001.yaml
  text: And Solomon was ruling over all the kingdoms from the River to the land of the Philistines and as far as the border of Egypt[b][a]. They were bringing tribute and serving Solomon all the days of his life.
translation:
  language: de
  text: Salomo herrschte über alle Königreiche vom Strom[a] bis zum Land der Philister und bis an die Grenze Ägyptens. Sie brachten ihm Tribut[b] und dienten Salomo sein Leben lang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist der Euphrat.
    reason: cross_reference
  - marker: b
    text: 'Oder: „Gaben“. Das hebräische Wort kann eine Gabe, Opfergabe oder einen Tribut bezeichnen; der politische Zusammenhang spricht hier für „Tribut“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹשֵׁל
  choice: herrschte
  rationale: Das Partizip mit הָיָה bezeichnet eine fortdauernde Herrschaft in der Vergangenheit. Im Deutschen gibt „herrschte“ diesen durativen Sachverhalt natürlich wieder.
- source_word: בְּכָל הַמַּמְלָכוֹת
  choice: über alle Königreiche
  rationale: Die Präposition mit משׁל bezeichnet Herrschaft über mehrere untergeordnete politische Gebiete.
- source_word: מִן הַנָּהָר
  choice: vom Strom
  rationale: „Der Strom“ ist hier die traditionelle geopolitische Bezeichnung für den Euphrat; die ausdrückliche Identifizierung steht in einer Fußnote.
- source_word: אֶרֶץ פְּלִשְׁתִּים
  choice: das Land der Philister
  rationale: Die Wiedergabe entspricht transparent der hebräischen Genitivverbindung und bleibt allgemein verständlich.
- source_word: וְעַד גְּבוּל מִצְרָיִם
  choice: und bis an die Grenze Ägyptens
  rationale: Die Formulierung bezeichnet die räumliche Ausdehnung bis zur ägyptischen Grenze.
- source_word: מַגִּשִׁים מִנְחָה
  choice: brachten ihm Tribut
  rationale: מִנְחָה kann Gabe, Opfergabe oder Tribut bedeuten. Im Kontext abhängiger Königreiche ist „Tribut“ am wahrscheinlichsten; „ihm“ macht den im Deutschen naheliegenden Empfänger deutlich.
- source_word: וְעֹבְדִים אֶת שְׁלֹמֹה
  choice: dienten Salomo
  rationale: עבד mit persönlichem Objekt bezeichnet hier Dienst beziehungsweise politische Unterordnung, ohne dass Zwangsarbeit ausdrücklich gemeint sein muss.
- source_word: כָּל יְמֵי חַיָּיו
  choice: sein Leben lang
  rationale: Dies ist eine natürliche moderne deutsche Wiedergabe der hebräischen Wendung „alle Tage seines Lebens“.
