id: 1KI.5.18
reference: 1 Kings 5:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/עַתָּ֕ה הֵנִ֨יחַ יְהוָ֧ה אֱלֹהַ֛/י לִ֖/י מִ/סָּבִ֑יב אֵ֣ין שָׂטָ֔ן וְ/אֵ֖ין פֶּ֥גַע רָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/018.yaml
  text: But now Yahweh my God has given me rest on every side[b][a]; there is neither adversary nor evil occurrence.
translation:
  language: de
  text: Doch nun hat Jahwe, mein Gott, mir ringsum Ruhe verschafft; es gibt keinen Widersacher[a] und kein schlimmes Ereignis[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gegner“. Das hebräische Wort שָׂטָן ist hier ein Gattungsbegriff und nicht notwendigerweise der Eigenname Satan.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Unglück“, „Unheil“ oder „Katastrophe“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Doch nun
  rationale: Kennzeichnet den Gegensatz zwischen den früheren Bedrängnissen und der gegenwärtigen Ruhe; im Deutschen natürlich und kontextgerecht.
- source_word: הֵנִיחַ ... לִי
  choice: hat ... mir ... Ruhe verschafft
  rationale: Die Hifil-Form von נוח ist kausativ. „Ruhe verschafft“ gibt diesen Sinn idiomatisch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהַי
  choice: mein Gott
  rationale: Direkte und natürliche Wiedergabe der Possessivverbindung.
- source_word: מִסָּבִיב
  choice: ringsum
  rationale: Bezeichnet die Ruhe gegenüber allen Bedrohungen aus der Umgebung; „ringsum“ ist knapp und gegenwärtig.
- source_word: אֵין שָׂטָן
  choice: es gibt keinen Widersacher
  rationale: שָׂטָן ist hier im politischen Kontext ein Gattungsbegriff für einen feindlichen Gegner, nicht notwendig der Eigenname Satan.
- source_word: וְאֵין פֶּגַע רָע
  choice: und kein schlimmes Ereignis
  rationale: Bewahrt die allgemeine Bedeutung eines schädlichen oder unheilvollen Vorkommnisses, ohne sie auf Krieg, Naturkatastrophe oder moralisches Übel zu verengen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Gottesnamen. „Jahwe“ bewahrt seinen Charakter als Eigenname.
- issue: Deutung von שָׂטָן
  choice: Widersacher als Gattungsbegriff
  alternative: Satan als Eigenname
  rationale: Der unmittelbare Zusammenhang handelt von politischer Ruhe und fehlender Gegnerschaft. Eine Benennung des persönlichen Satans würde mehr festlegen, als der Text hier aussagt.
- issue: Bedeutungsumfang von פֶּגַע רָע
  choice: schlimmes Ereignis
  alternative: Unglück; Unheil; Katastrophe
  rationale: Die gewählte Formulierung hält die Aussage bewusst weit und bewahrt die mögliche Spannung zwischen einem konkreten Unglück und allgemein schädlichem Geschehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Ruhe verschafft“ ist idiomatisch und wahrt den kausativen Sinn; „Widersacher“ erhält den politischen Kontext und vermeidet eine unbegründete Personifizierung.
