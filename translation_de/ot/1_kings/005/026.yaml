  variant: modern standard German
source:
  edition: WLC
  text: וַ/יהוָ֗ה נָתַ֤ן חָכְמָה֙ לִ/שְׁלֹמֹ֔ה כַּ/אֲשֶׁ֖ר דִּבֶּר ל֑/וֹ וַ/יְהִ֣י שָׁלֹ֗ם בֵּ֤ין חִירָם֙ וּ/בֵ֣ין שְׁלֹמֹ֔ה וַ/יִּכְרְת֥וּ בְרִ֖ית שְׁנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/026.yaml
  text: And Yahweh gave wisdom to Solomon[a], just as he had spoken to him. And there was peace between Hiram and Solomon[b], and the two of them made a covenant.
translation:
  language: de
  text: Und Jahwe gab Salomo Weisheit, wie er zu ihm gesprochen hatte.[a] Zwischen Hiram und Salomo herrschte Frieden, und die beiden schlossen einen Bund.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wie er es ihm versprochen hatte«. Das hebräische Verb bedeutet wörtlich »sprechen«; im Zusammenhang kann damit Jahwes frühere Zusage an Salomo gemeint sein.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: »schnitten einen Bund«; eine hebräische Wendung für das Schließen eines Bundes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Wiedergabe des Gottesnamens bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- source_word: נָתַן חָכְמָה
  choice: gab Weisheit
  rationale: Die schlichte Formulierung gibt sowohl das Verb »geben« als auch den geläufigen Begriff »Weisheit« unmittelbar wieder.
- source_word: כַּאֲשֶׁר דִּבֶּר לוֹ
  choice: wie er zu ihm gesprochen hatte
  rationale: Diese Wiedergabe erhält die lexikalische Bedeutung von דִּבֶּר (»sprechen«), ohne die vorausgegangene göttliche Aussage ausdrücklich als Versprechen zu deuten.
- source_word: וַיְהִי שָׁלֹם בֵּין ... וּבֵין
  choice: Zwischen ... herrschte Frieden
  rationale: Das ist eine natürliche deutsche Wiedergabe friedlicher Beziehungen zwischen den beiden Herrschern.
- source_word: וַיִּכְרְתוּ בְרִית
  choice: schlossen einen Bund
  rationale: Die deutsche Wendung ist idiomatisch und bewahrt zugleich den Schlüsselbegriff בְרִית (»Bund«); die hebräische Formulierung lautet wörtlich »einen Bund schneiden«.
- source_word: שְׁנֵיהֶם
  choice: die beiden
  rationale: Die Formulierung macht die gemeinsame Beteiligung Hirams und Salomos knapp und eindeutig sichtbar.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname des Gottes Israels wird als solcher wiedergegeben und nicht durch einen traditionellen Ersatztitel verdeckt.
- issue: Bedeutung der vorausgegangenen göttlichen Rede
  choice: wie er zu ihm gesprochen hatte
  alternative: wie er es ihm versprochen hatte
  rationale: Im Kontext kann die Rede als Zusage verstanden werden; der Ausgangstext bezeichnet sie jedoch nur als Sprechen. Die Übersetzung bewahrt diese Offenheit.
- issue: Wiedergabe von בְרִית im politischen Zusammenhang
  choice: Bund
  alternative: Vertrag
  rationale: Obwohl ein zwischenstaatliches Abkommen gemeint ist, verwendet der hebräische Text den allgemeinen Bundesbegriff. »Bund« erhält diese begriffliche Verbindung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung wurde gegenüber dem Hebräischen leicht geglättet; zentrale Begriffe und die mögliche Bedeutungsweite der göttlichen Rede bleiben erhalten.
