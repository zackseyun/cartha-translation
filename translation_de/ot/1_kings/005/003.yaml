base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/003.yaml
  text: ten fattened cattle[a], and twenty pasture-fed cattle, and a hundred sheep[c][b], besides deer and gazelles and roebucks and fattened fowl.
translation:
  language: de
  text: zehn gemästete Rinder, zwanzig Weiderinder und hundert Stück Kleinvieh[a], dazu Hirsche, Gazellen, Damhirsche[b] und gemästetes Geflügel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische צֹאן kann Schafe und Ziegen gemeinsam bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Die genaue Tierart ist unsicher; möglich sind auch Rehe oder eine andere Hirschart.
    reason: lexical_alternative
  - marker: c
    text: Die genaue Vogelart ist unsicher; möglicherweise sind gemästete Gänse gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָקָר בְּרִאִים
  choice: gemästete Rinder
  rationale: בָקָר bezeichnet kollektiv Rinder; בְּרִאִים beschreibt hier wohlgenährte beziehungsweise eigens gemästete Tiere. Die Wiedergabe ist natürlich und wahrt den Gegensatz zu den Weiderindern.
- source_word: בָּקָר רְעִי
  choice: Weiderinder
  rationale: רְעִי verweist auf Weiden oder Grasen. „Weiderinder“ gibt die Haltungsweise knapp wieder und bildet den im Hebräischen angelegten Kontrast zu den gemästeten Rindern ab.
- source_word: צֹאן
  choice: Stück Kleinvieh
  rationale: צֹאן kann Schafe und Ziegen als Kleinvieh umfassen. „Stück Kleinvieh“ bewahrt diesen weiteren Umfang und passt zugleich zur Zahl hundert.
- source_word: לְבַד
  choice: dazu
  rationale: לְבַד führt weitere, über die zuvor genannten Mengen hinausgehende Speisen an. „Dazu“ ist im Deutschen knapp und idiomatisch.
- source_word: אַיָּל
  choice: Hirsche
  rationale: אַיָּל bezeichnet einen Hirsch beziehungsweise ein Tier aus der Hirschfamilie. Der Plural entspricht dem aufzählenden Sammelsinn.
- source_word: צְבִי
  choice: Gazellen
  rationale: צְבִי bezeichnet gewöhnlich Gazellen. Der deutsche Plural entspricht dem Sammelcharakter der Versorgungsliste.
- source_word: יַחְמוּר
  choice: Damhirsche
  rationale: Die zoologische Bestimmung ist nicht völlig sicher; „Damhirsche“ ist eine gut begründete moderne Wiedergabe, während die Unsicherheit in einer Fußnote offengelegt wird.
- source_word: בַרְבֻּרִים אֲבוּסִים
  choice: gemästetes Geflügel
  rationale: אֲבוּסִים bezeichnet gemästete Tiere. Die genaue Vogelart hinter בַרְבֻּרִים ist unsicher; „Geflügel“ vermeidet daher unbegründete zoologische Präzision.
