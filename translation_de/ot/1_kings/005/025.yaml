base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/025.yaml
  text: And Solomon gave Hiram twenty thousand cors of wheat as food for his household[a], and twenty cors of beaten oil[b]. Thus Solomon would give to Hiram year by year.
translation:
  language: de
  text: Und Salomo gab Hiram zwanzigtausend Kor Weizen als Nahrung für seinen Haushalt[a] und zwanzig Kor gestoßenes Öl[b]. So gab Salomo Hiram Jahr für Jahr.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »als Lebensmittel für sein Haus«. Gemeint ist wahrscheinlich die Versorgung von Hirams königlichem Haushalt beziehungsweise Hof.'
    reason: lexical_alternative
  - marker: b
    text: »Gestoßenes Öl« bezeichnet hochwertiges Öl, das aus zerstoßenen oder zerstampften Oliven gewonnen wurde.
    reason: cultural_note
lexical_decisions:
- source_word: נָתַן / יִתֵּן
  choice: gab / gab ... Jahr für Jahr
  rationale: Das Perfekt bezeichnet die vereinbarte Gabe; der Imperfekt beschreibt zusammen mit שָׁנָה בְשָׁנָה die regelmäßige jährliche Wiederholung. Im Deutschen bringt die Zeitangabe den gewohnheitsmäßigen Charakter natürlich zum Ausdruck.
- source_word: כֹּר
  choice: Kor
  rationale: Kor ist die Bezeichnung eines bestimmten antiken Hohlmaßes. Die Transliteration bewahrt die historische Maßeinheit, ohne eine unsichere moderne Umrechnung in den Text einzutragen.
- source_word: חִטִּים
  choice: Weizen
  rationale: Das hebräische Wort bezeichnet spezifisch Weizen und nicht nur Getreide im Allgemeinen.
- source_word: מַכֹּלֶת לְבֵיתוֹ
  choice: als Nahrung für sein Haus
  rationale: מַכֹּלֶת bedeutet Nahrung oder Lebensmittel; בֵּיתוֹ kann Hirams Haus im Sinn seines Haushalts beziehungsweise königlichen Hofes bezeichnen. Die wörtlich-nahe Form wahrt diese Bedeutungsbreite.
- source_word: שֶׁמֶן כָּתִית
  choice: gestoßenes Öl
  rationale: כָּתִית bezeichnet Öl, das aus zerstoßenen beziehungsweise zerschlagenen Oliven gewonnen wurde. Die knappe Wiedergabe bleibt nahe am Hebräischen; die kulturelle Bedeutung wird in einer Fußnote erklärt.
- source_word: כֹּה
  choice: So
  rationale: כֹּה bezeichnet hier die Art und Weise beziehungsweise das dargestellte Muster der wiederkehrenden Leistung.
- source_word: שָׁנָה בְשָׁנָה
  choice: Jahr für Jahr
  rationale: Die hebräische Wendung bezeichnet eine regelmäßige jährliche Wiederholung und lässt sich im Deutschen formnah und idiomatisch wiedergeben.
