base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/030.yaml
  text: besides Solomon’s chief deputies who were over the work[a], three thousand three hundred[c][b], who ruled over the people doing the work.
translation:
  language: de
  text: 'Dazu kamen Salomos oberste Aufseher[a], die für die Arbeiten zuständig waren: insgesamt 3.300, die über das Volk[b], das die Arbeiten ausführte, Aufsicht führten[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch „leitende Amtsträger“ oder „leitende Aufseher“. Die hebräischen Amtsbezeichnungen verbinden Rang und Aufsichtsfunktion.
    reason: lexical_alternative
  - marker: b
    text: Mit „Volk“ ist hier die Arbeiterschaft gemeint, die an dem Vorhaben beschäftigt war.
    reason: contextual_clarification
  - marker: c
    text: Das zugrunde liegende Verb kann „herrschen“ oder „Autorität ausüben“ bedeuten; hier bezeichnet es die Aufsicht über die Arbeitenden.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַד
  choice: außerdem
  rationale: Die Präposition fügt die folgende Gruppe zu der zuvor genannten Arbeiterschaft hinzu. „Außerdem“ gibt diesen Zusammenhang im Deutschen natürlich wieder.
- source_word: שָּׂרֵי הַנִּצָּבִים לִשְׁלֹמֹה
  choice: Salomos leitende Beauftragte
  rationale: Die Verbindung bezeichnet ranghohe, von Salomo eingesetzte Amtsträger mit Verwaltungs- und Aufsichtsfunktion. „Leitende Beauftragte“ bewahrt beide Aspekte, ohne zwei nahezu gleichbedeutende Amtsbezeichnungen aneinanderzureihen.
- source_word: אֲשֶׁר עַל הַמְּלָאכָה
  choice: die über die Arbeiten eingesetzt waren
  rationale: Die Wendung bezeichnet ihre Zuständigkeit und Autorität über das Bauvorhaben; die Formulierung bleibt nahe am Hebräischen und ist zugleich verständlich.
- source_word: שְׁלֹשֶׁת אֲלָפִים וּשְׁלֹשׁ מֵאוֹת
  choice: '3300'
  rationale: Die Zahl wird in moderner deutscher Schreibweise knapp und eindeutig wiedergegeben.
- source_word: הָרֹדִים
  choice: Aufsicht führten
  rationale: Das Verb רדה bezeichnet die Ausübung von Herrschaft oder Autorität. Im Zusammenhang der Arbeitsorganisation ist „Aufsicht führen“ idiomatisch, während die Fußnote auf die stärkere Grundbedeutung hinweist.
- source_word: בָּעָם
  choice: über das Volk
  rationale: Die Übersetzung bewahrt das ausdrücklich verwendete hebräische Wort „Volk“; aus dem folgenden Relativsatz ergibt sich, dass hier die eingesetzte Arbeiterschaft gemeint ist.
- source_word: הָעֹשִׂים בַּמְּלָאכָה
  choice: das die Arbeiten ausführte
  rationale: Die partizipiale Wendung kennzeichnet das Volk als die mit dem Vorhaben beschäftigte Arbeiterschaft. „Die Arbeiten ausführte“ ist würdig und im Deutschen natürlich.
