  text: King Solomon conscripted forced labor from all Israel[b][a], and the forced labor was thirty thousand men.
translation:
  language: de
  text: König Salomo hob aus ganz Israel Männer zum Frondienst aus[a][b]; das Aufgebot bestand aus dreißigtausend Mann.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet hier verpflichtenden Arbeitsdienst, nicht in erster Linie eine Geldsteuer.
    reason: cultural_note
  - marker: b
    text: 'Oder: »König Salomo ließ aus ganz Israel ein Arbeitsaufgebot zum Frondienst ausheben.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: hob … aus
  rationale: Das Hifil von עלה bezeichnet zusammen mit מַס das Auferlegen beziehungsweise Ausheben eines Arbeitsaufgebots. »Aushob« ist im Deutschen verständlich und gibt den Vorgang der verpflichtenden Heranziehung treffend wieder.
- source_word: מַס
  choice: Frondienst
  rationale: Im Zusammenhang mit Salomos Bauvorhaben bezeichnet מַס eine verpflichtende Arbeitsleistung, nicht in erster Linie eine Geldsteuer. »Frondienst« ist prägnant und im Deutschen geläufiger als das fachsprachliche »Korvee«.
- source_word: מִכָּל יִשְׂרָאֵל
  choice: in ganz Israel
  rationale: Die Wendung bezeichnet die Gesamtbevölkerung Israels als den Bereich, aus dem die Arbeitskräfte eingezogen wurden. Die deutsche Formulierung ist natürlich und bewahrt den umfassenden Sinn von כָּל.
- source_word: וַיְהִי הַמַּס
  choice: insgesamt waren es
  rationale: Die hebräische Konstruktion nennt anschließend die Stärke des Arbeitsaufgebots. Die idiomatische deutsche Wiedergabe vermeidet die missverständliche Wiederholung von »Frondienst« und bezieht sich klar auf die ausgehobenen Männer.
- source_word: שְׁלֹשִׁים אֶלֶף אִישׁ
  choice: dreißigtausend Mann
  rationale: אִישׁ bezeichnet hier die gezählten männlichen Arbeitskräfte. »Mann« bewahrt diese konkrete Bedeutung und ist nach einer Zahl im Deutschen idiomatisch.
theological_decisions: []
