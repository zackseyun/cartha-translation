id: 1KI.5.7
reference: 1 Kings 5:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/כִלְכְּלוּ֩ הַ/נִּצָּבִ֨ים הָ/אֵ֜לֶּה אֶת הַ/מֶּ֣לֶךְ שְׁלֹמֹ֗ה וְ/אֵ֧ת כָּל הַ/קָּרֵ֛ב אֶל שֻׁלְחַ֥ן הַ/מֶּֽלֶךְ שְׁלֹמֹ֖ה אִ֣ישׁ חָדְשׁ֑/וֹ לֹ֥א יְעַדְּר֖וּ דָּבָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/007.yaml
  text: These deputies provided for King Solomon and for all who came near the table of King Solomon[a], each in his month[b]; they lacked nothing.
translation:
  language: de
  text: Diese Verwalter[a] versorgten König Salomo und alle, die an den Tisch König Salomos kamen[b], jeder in seinem Monat; sie ließen es an nichts fehlen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Beamten“ beziehungsweise „Statthalter“. Gemeint sind eingesetzte Verwalter der Bezirke.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „die sich dem Tisch König Salomos näherten“; gemeint sind alle, die Zugang zur königlichen Tafel hatten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִלְכְּלוּ
  choice: versorgten
  rationale: Das Piel von כלכל bezeichnet hier die Versorgung mit den nötigen Lebensmitteln und Mitteln im Rahmen der königlichen Verwaltung. „Versorgten“ gibt diesen Sinn natürlich wieder, ohne die Art der Lieferungen unnötig festzulegen.
- source_word: הַנִּצָּבִים
  choice: Verwalter
  rationale: Der Ausdruck bezeichnet in diesem Zusammenhang eingesetzte Amtsträger, die Verwaltungsbezirken vorstanden. „Verwalter“ macht ihre beauftragte administrative Funktion deutlich und vermeidet die heute möglicherweise irreführenden politischen Bedeutungen von „Statthalter“ oder „Gouverneur“.
- source_word: וְאֵת כָּל הַקָּרֵב אֶל שֻׁלְחַן הַמֶּלֶךְ שְׁלֹמֹה
  choice: und alle, die an den Tisch König Salomos kamen
  rationale: Die Formulierung bewahrt das hebräische Bild des Herantretens an den königlichen Tisch. Im Zusammenhang sind damit die Personen gemeint, die Zugang zur königlichen Tafel hatten.
- source_word: אִישׁ חָדְשׁוֹ
  choice: jeder in seinem Monat
  rationale: Die knappe distributive Wendung bezeichnet die monatlich wechselnde Zuständigkeit der Verwalter und bewahrt die Ausdrucksweise des Hebräischen.
- source_word: לֹא יְעַדְּרוּ דָּבָר
  choice: sie ließen es an nichts fehlen
  rationale: Die idiomatische deutsche Formulierung bringt zum Ausdruck, dass durch ihre Versorgung nichts Benötigtes fehlte, und behält die Verwalter als handelndes Subjekt bei.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die königliche Verwaltungssprache bleibt erkennbar; das Bild vom Herantreten an Salomos Tisch wird in natürlicher deutscher Form bewahrt.
