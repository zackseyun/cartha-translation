source:
  edition: WLC
  text: וְ/הִנְ/נִ֣י אֹמֵ֔ר לִ/בְנ֣וֹת בַּ֔יִת לְ/שֵׁ֖ם יְהוָ֣ה אֱלֹהָ֑/י כַּ/אֲשֶׁ֣ר דִּבֶּ֣ר יְהוָ֗ה אֶל דָּוִ֤ד אָבִ/י֙ לֵ/אמֹ֔ר בִּנְ/ךָ֗ אֲשֶׁ֨ר אֶתֵּ֤ן תַּחְתֶּ֨י/ךָ֙ עַל כִּסְאֶ֔/ךָ הֽוּא יִבְנֶ֥ה הַ/בַּ֖יִת לִ/שְׁמִֽ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/019.yaml
  text: And behold[a], I intend to build a house for the name of Yahweh my God, just as Yahweh spoke to David my father, saying, ‘Your son, whom I will set in your place on your throne[c][b], he will build the house for my name.’
translation:
  language: de
  text: 'Und nun beabsichtige ich, ein Haus[a] für den Namen Jahwes, meines Gottes, zu bauen, so wie Jahwe zu meinem Vater David gesprochen hat: »Dein Sohn, den ich an deiner Stelle auf deinen Thron setzen werde[b], er wird das Haus für meinen Namen bauen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist der Tempel; im Hebräischen steht wörtlich „Haus“.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „den ich nach dir einsetzen werde“; wörtlich: „den ich an deiner Stelle geben werde“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנְנִי אֹמֵר
  choice: Und nun beabsichtige ich
  rationale: הִנְנִי markiert den nachdrücklichen Einsatz der Erklärung; zusammen mit dem Partizip אֹמֵר bezeichnet die Wendung hier Salomos gegenwärtigen Entschluss. „Und nun beabsichtige ich“ gibt diese Funktion in natürlichem modernem Deutsch wieder.
- source_word: לִבְנוֹת בַּיִת
  choice: ein Haus zu bauen
  rationale: בַּיִת bedeutet wörtlich „Haus“. Obwohl hier der Tempel gemeint ist, bewahrt „Haus“ die wiederholte hebräische Ausdrucksweise und ihre theologische Resonanz.
- source_word: לְשֵׁם יְהוָה אֱלֹהָי
  choice: für den Namen Jahwes, meines Gottes
  rationale: Die Formulierung bewahrt die Tempelwendung „für den Namen“ und gibt יְהוָה als persönlichen Gottesnamen „Jahwe“ wieder, statt sie zu einer bloßen Ehrungsformel umzudeuten.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: so wie ... gesprochen hat
  rationale: Die Vergleichsformel stellt Salomos Vorhaben als genaue Entsprechung zur früheren Zusage Jahwes dar.
- source_word: אֶל דָּוִד אָבִי
  choice: zu meinem Vater David
  rationale: Diese Wortstellung ist im Deutschen natürlicher als „zu David, meinem Vater“ und gibt denselben Bezug wieder.
- source_word: אֲשֶׁר אֶתֵּן תַּחְתֶּיךָ
  choice: den ich an deiner Stelle ... setzen werde
  rationale: אֶתֵּן bedeutet wörtlich „ich werde geben/setzen“, während תַּחְתֶּיךָ die Nachfolge „an deiner Stelle“ ausdrückt. Die Übersetzung bewahrt das konkrete Bild der Einsetzung.
- source_word: עַל כִּסְאֶךָ
  choice: auf deinen Thron
  rationale: Dies ist die natürliche deutsche Entsprechung der königlichen Wendung für Herrschaft und Thronfolge.
- source_word: הוּא יִבְנֶה
  choice: er wird ... bauen
  rationale: Das selbstständige Pronomen הוּא ist betont. Das ausdrücklich gesetzte „er“ erhält den Nachdruck auf dem bestimmten Sohn als Erbauer.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den persönlichen Bundesnamen und unterscheidet ihn von einem bloßen Titel.
- issue: Bedeutung der Wendung לְשֵׁם יְהוָה
  choice: für den Namen Jahwes
  alternative: zu Ehren Jahwes
  rationale: Die wörtlichere Formulierung erhält die für den Tempel bedeutsame Rede vom Namen Gottes und legt sie nicht einseitig als bloße Ehrbezeugung aus.
- issue: Königliche Nachfolge in אֲשֶׁר אֶתֵּן תַּחְתֶּיךָ
  choice: den ich an deiner Stelle auf deinen Thron setzen werde
  alternative: den ich nach dir einsetzen werde
  rationale: Die gewählte Fassung macht die göttliche Einsetzung und die Stellvertretungs- bzw. Nachfolgevorstellung sichtbar, ohne mehr über deren Art auszusagen als der Text.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Wiederholung von „Haus“ und „für meinen Namen“ bleibt erhalten. „Und nun“ vermittelt die aufmerksamkeitslenkende Funktion von הִנְנִי natürlicher als das heute altertümliche „siehe“.
