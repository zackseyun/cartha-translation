  text: עֲ֠בָדַ/י יֹרִ֨דוּ מִן הַ/לְּבָנ֜וֹן יָ֗מָּ/ה וַ֠/אֲנִי אֲשִׂימֵ֨/ם דֹּבְר֤וֹת בַּ/יָּם֙ עַֽד הַ/מָּק֞וֹם אֲשֶׁר תִּשְׁלַ֥ח אֵלַ֛/י וְ/נִפַּצְתִּ֥י/ם שָׁ֖ם וְ/אַתָּ֣ה תִשָּׂ֑א וְ/אַתָּה֙ תַּעֲשֶׂ֣ה אֶת חֶפְצִ֔/י לָ/תֵ֖ת לֶ֥חֶם בֵּיתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/023.yaml
  text: My servants will bring them down from Lebanon to the sea[a], and I will make them into rafts on the sea to the place that you direct me, and I will break them apart there, and you will carry them away[b]. And you shall do what I desire by giving food for my household.
translation:
  language: de
  text: Meine Diener werden sie vom Libanon zum Meer hinabbringen. Ich werde sie auf dem Meer zu Flößen zusammenfügen und bis zu dem Ort bringen, den du mir nennen wirst.[a] Dort werde ich die Flöße auseinandernehmen, und du wirst das Holz wegschaffen. Du aber sollst meinen Wunsch erfüllen, indem du meinem Haushalt Nahrung gibst.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Formulierung lautet etwa: „bis zu dem Ort, zu dem du [etwas] zu mir senden wirst“; das nicht genannte Gesandte ist wohl eine Nachricht oder Anweisung über den Zielort.'
    reason: Die hebräische Formulierung lässt das Objekt von „senden“ unausgesprochen.
  - marker: b
    text: 'Wörtlich: „indem du meinem Haus Brot gibst“; „Brot“ meint hier wahrscheinlich Nahrung oder Versorgungsgüter für Hirams Haushalt beziehungsweise Hof.'
    reason: Die Metonymie „Brot“ und die Bedeutung von „Haus“ sollen sichtbar bleiben.
lexical_decisions:
- source_word: עֲבָדַי
  choice: meine Diener
  rationale: Im königlich-administrativen Zusammenhang bezeichnet der Ausdruck Hirams Dienstleute bzw. Arbeiter; ihr rechtlicher Status wird nicht näher bestimmt.
- source_word: יֹרִדוּ ... יָמָּה
  choice: werden sie ... zum Meer hinabbringen
  rationale: Die Kausativform von ירד verlangt hier ein Hinabbringen; ימה bezeichnet im Kontext die Richtung bzw. das Ziel am Meer.
- source_word: אֲשִׂימֵם דֹּבְרוֹת בַּיָּם
  choice: Ich werde sie auf dem Meer zu Flößen zusammenfügen
  rationale: דֹּבְרוֹת bezeichnet für den Seetransport verbundene Holzstämme. „Zu Flößen zusammenfügen“ gibt die Konstruktion und den Vorgang in natürlichem Deutsch wieder.
- source_word: עַד הַמָּקוֹם אֲשֶׁר תִּשְׁלַח אֵלַי
  choice: bis zu dem Ort bringen, den du mir nennen wirst
  rationale: Wörtlich ist vom Senden an Hiram die Rede, ohne dass das Gesandte genannt wird. Im Zusammenhang sind eine Nachricht oder Anweisung über den Zielort gemeint; eine Fußnote bewahrt die formale Unbestimmtheit.
- source_word: וְנִפַּצְתִּים
  choice: Dort werde ich die Flöße auseinandernehmen
  rationale: נפץ bedeutet grundsätzlich zerstreuen, zerschlagen oder auseinanderbrechen; hier ist sachlich das Auflösen der Flöße am Zielort gemeint.
- source_word: וְאַתָּה תִשָּׂא
  choice: du wirst die Stämme wegschaffen
  rationale: נשא kann „heben, tragen, nehmen“ bedeuten. Nach dem Auseinandernehmen der Flöße bezeichnet es hier den Abtransport des Holzes; „die Stämme“ macht den zuvor pronominal bezeichneten Gegenstand verständlich.
- source_word: לָתֵת לֶחֶם בֵּיתִי
  choice: indem du meinem Haus Nahrung lieferst
  rationale: „Brot“ steht hier wahrscheinlich als Sammelbegriff für Nahrung oder Versorgungsgüter; „Haus“ kann Hirams Haushalt bzw. Hof bezeichnen. Die wörtliche Form wird in der Fußnote genannt.
