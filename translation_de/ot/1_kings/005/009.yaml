source:
  edition: WLC
  text: וַ/יִּתֵּן֩ אֱלֹהִ֨ים חָכְמָ֧ה לִ/שְׁלֹמֹ֛ה וּ/תְבוּנָ֖ה הַרְבֵּ֣ה מְאֹ֑ד וְ/רֹ֣חַב לֵ֔ב כַּ/ח֕וֹל אֲשֶׁ֖ר עַל שְׂפַ֥ת הַ/יָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/009.yaml
  text: And God gave Solomon wisdom and very great understanding[a], and breadth of heart like the sand that is on the seashore.
translation:
  language: de
  text: Und Gott gab Salomo Weisheit und überaus große Einsicht sowie eine Weite des Herzens[a] wie der Sand am Ufer des Meeres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Weite des Herzens“. Das hebräische Wort für „Herz“ kann auch den Verstand, das Denken und die innere Auffassungskraft bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: gab
  rationale: Die einfache Vergangenheitsform gibt das Narrativverb נתן direkt und natürlich wieder.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das Substantiv bezeichnet hier mit singularischem Verb den Gott Israels.
- source_word: חָכְמָה
  choice: Weisheit
  rationale: Dies ist die übliche und kontextgemäße Wiedergabe für Salomos praktische und königliche Weisheit.
- source_word: וּתְבוּנָה הַרְבֵּה מְאֹד
  choice: und überaus große Einsicht
  rationale: „Einsicht“ wahrt den intellektuellen und urteilsbezogenen Bedeutungsumfang von תבונה; „überaus große“ gibt die starke Intensivierung durch הרבה מאד wieder.
- source_word: וְרֹחַב לֵב
  choice: sowie eine Weite des Herzens
  rationale: Die Wiedergabe bewahrt das hebräische Bild und lässt die umfassende innere beziehungsweise geistige Aufnahmefähigkeit anklingen, ohne es auf eine einzige moderne Kategorie zu verengen.
- source_word: כַּחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם
  choice: wie der Sand am Ufer des Meeres
  rationale: Die Formulierung gibt das Vergleichsbild vollständig, verständlich und in natürlichem Deutsch wieder.
theological_decisions:
- issue: Anthropologische Ausdrucksweise in רֹחַב לֵב
  choice: Das Bild wird im Haupttext als „Weite des Herzens“ bewahrt.
  alternative: „Weite des Verstandes“ oder „umfassendes Verständnis“
  rationale: לֵב kann im Hebräischen Denken, Verstehen und die gesamte innere Person bezeichnen. Die wörtlichere Bildsprache erhält diese Bedeutungsbreite und vermeidet eine moderne Trennung von Verstand und innerem Menschen; die Fußnote erklärt den möglichen Sinn.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche, aber verständliche Wendung „Weite des Herzens“ bewahrt bewusst das hebräische Bild; die Fußnote erschließt dessen Bedeutungsumfang.
