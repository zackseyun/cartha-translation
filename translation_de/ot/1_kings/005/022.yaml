  source_fidelity: 'Der Entwurf gibt die hebräische Abfolge und den Sinn präzise wieder: Hiram sendet Salomo eine Mitteilung, bestätigt den Empfang dessen, was Salomo ihm gesandt hat, und sagt die Erfüllung von Salomos Wunsch im Blick auf Zedern- und Beroschholz zu. „Folgende Botschaft“ ist eine idiomatische Entfaltung von לֵאמֹר, ohne den Inhalt unzulässig zu erweitern. Die Voranstellung „Was ... betrifft“ gibt die sachbereichbestimmende Funktion von בְּ angemessen wieder.'
