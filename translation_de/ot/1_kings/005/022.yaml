  terminology: Die Namensformen Hiram und Salomo sind im Deutschen etabliert. „Zedernholz“ passt zum Kontext. „Zypressenholz“ ist als Wiedergabe von בְּרוֹשִׁים vertretbar, während die Fußnote die verbleibende botanische Unsicherheit sachgerecht wahrt.
