  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח חִירָם֙ אֶל שְׁלֹמֹ֣ה לֵ/אמֹ֔ר שָׁמַ֕עְתִּי אֵ֥ת אֲשֶׁר שָׁלַ֖חְתָּ אֵלָ֑/י אֲנִ֤י אֶֽעֱשֶׂה֙ אֶת כָּל חֶפְצְ/ךָ֔ בַּ/עֲצֵ֥י אֲרָזִ֖ים וּ/בַ/עֲצֵ֥י בְרוֹשִֽׁים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/022.yaml
  text: Then Hiram sent to Solomon[a], saying, “I have heard what you sent to me[b]. I will do all your desire concerning cedar timber and cypress timber.”
translation:
  language: de
  text: 'Da sandte Hiram Salomo folgende Botschaft: „Ich habe gehört, was du mir gesandt hast.[a] Was Zedernholz und Zypressenholz[b] betrifft, werde ich alles tun, was du wünschst.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „was du von mir erbeten hast“. Wörtlicher heißt es im Hebräischen: „was du mir gesandt hast“; damit kann Salomos Botschaft samt der darin enthaltenen Bitte gemeint sein.'
    reason: lexical_alternative
  - marker: b
    text: Hebräisch בְּרוֹשִׁים (beroshim); die genaue Baumart ist unsicher. Auch Wiedergaben wie „Wacholderholz“ oder „Tannenholz“ sind möglich.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Da sandte
  rationale: Das Narrativ-Waw führt die Handlung weiter. „Da“ gibt die zeitliche Folge in natürlichem deutschem Erzählstil wieder.
- source_word: חִירָם אֶל שְׁלֹמֹה
  choice: Hiram Salomo
  rationale: Die Eigennamen werden in ihrer üblichen deutschen Form wiedergegeben; das Ziel des Sendens wird im Deutschen ohne Präposition ausgedrückt.
- source_word: לֵאמֹר
  choice: folgende Botschaft
  rationale: Die hebräische Redeeinleitung wird idiomatisch wiedergegeben, ohne den Inhalt über „Botschaft“ hinaus näher zu bestimmen.
- source_word: שָׁמַעְתִּי
  choice: Ich habe gehört
  rationale: Das Perfekt bezeichnet hier Hirams bereits erfolgte Kenntnisnahme mit gegenwärtigem Ergebnis.
- source_word: אֵת אֲשֶׁר שָׁלַחְתָּ אֵלַי
  choice: was du mir gesandt hast
  rationale: Die Formulierung bleibt eng am Hebräischen und legt nicht ausdrücklich fest, ob die zugesandte Nachricht oder die darin enthaltene Bitte gemeint ist.
- source_word: אֶעֱשֶׂה אֶת כָּל חֶפְצְךָ
  choice: werde ich alles tun, was du wünschst
  rationale: Die breite Bedeutung von עשה und חפץ bleibt erhalten; zugleich ist die Formulierung im modernen Deutschen natürlich und verständlich.
- source_word: בַּעֲצֵי אֲרָזִים
  choice: Was Zedernholz ... betrifft
  rationale: Die Präposition bezeichnet hier den Sachbereich, in dem Hiram Salomos Wunsch erfüllen wird. „Zedernholz“ passt zum Baukontext.
- source_word: וּבַעֲצֵי בְרוֹשִׁים
  choice: und Zypressenholz
  rationale: „Zypresse“ ist eine verbreitete Wiedergabe des unsicher bestimmten Baumnamens בְּרוֹשׁ; die Unsicherheit wird in einer Fußnote kenntlich gemacht.
