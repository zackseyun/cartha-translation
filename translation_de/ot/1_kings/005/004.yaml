  text: כִּי ה֞וּא רֹדֶ֣ה בְּ/כָל עֵ֣בֶר הַ/נָּהָ֗ר מִ/תִּפְסַח֙ וְ/עַד עַזָּ֔ה בְּ/כָל מַלְכֵ֖י עֵ֣בֶר הַ/נָּהָ֑ר וְ/שָׁל֗וֹם הָ֥יָה ל֛/וֹ מִ/כָּל עֲבָרָ֖י/ו מִ/סָּבִֽיב־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/004.yaml
  text: For he was ruling over all the region beyond the River[a], from Tiphsah to Gaza, over all the kings beyond the River[b]; and he had peace on all sides around him.
translation:
  language: de
  text: Denn er herrschte über das ganze Gebiet jenseits des Stromes[a], von Tifsach bis Gaza, über alle Könige jenseits des Stromes; und er hatte auf allen Seiten ringsum Frieden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist der Euphrat.
    reason: cultural_note
lexical_decisions:
- source_word: רֹדֶה
  choice: herrschte
  rationale: Das Partizip bezeichnet eine fortdauernde Herrschaft. Das deutsche Präteritum „herrschte“ gibt dies im erzählenden Zusammenhang natürlich wieder.
- source_word: בְּכָל עֵבֶר הַנָּהָר
  choice: über das ganze Gebiet jenseits des Stromes
  rationale: עֵבֶר הַנָּהָר ist eine geografische Gebietsbezeichnung. „Gebiet“ verdeutlicht den territorialen Sinn, während „der Strom“ die konventionelle Bezeichnung des Euphrat im Haupttext bewahrt.
- source_word: הַנָּהָר
  choice: der Strom
  rationale: Der hebräische Text verwendet das bestimmte Gattungswort „der Strom“ als feste Bezeichnung für den Euphrat; der Bezug wird in einer Fußnote erläutert.
- source_word: מִתִּפְסַח וְעַד עַזָּה
  choice: von Tifsach bis Gaza
  rationale: Die Wendung bezeichnet die geografische Ausdehnung der Herrschaft; תִּפְסַח wird in üblicher deutscher Umschrift als „Tifsach“ wiedergegeben.
- source_word: בְּכָל מַלְכֵי עֵבֶר הַנָּהָר
  choice: über alle Könige jenseits des Stromes
  rationale: Die Präposition bezeichnet hier die Oberherrschaft über die Könige dieses Gebiets. Die knappe Form wahrt den politischen Sinn des Ausgangstextes.
- source_word: וְשָׁלוֹם הָיָה לוֹ
  choice: und er hatte … Frieden
  rationale: שָׁלוֹם bezeichnet im Zusammenhang politischen Frieden und Sicherheit. „Er hatte Frieden“ ist im Deutschen natürlich und inhaltlich offen genug.
- source_word: מִכָּל עֲבָרָיו מִסָּבִיב
  choice: ringsum auf allen Seiten
  rationale: Die Formulierung bewahrt sowohl den Gedanken aller Seiten als auch den ausdrücklichen Hinweis auf das Umgebensein, ohne עֲבָרָיו vorschnell als „Nachbarn“ oder „Grenzen“ festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die konventionelle geografische Wendung „jenseits des Stromes“ bleibt erhalten; ihr Bezug wird knapp erläutert. Auf eine zweite Fußnote zum Ortsnamen wurde verzichtet, da keine für die deutsche Übersetzung relevante Textvariante oder echte lexikalische Alternative vorliegt.
