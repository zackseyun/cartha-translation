base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/002.yaml
  text: Solomon’s provision for one day was thirty cors of fine flour and sixty cors of meal[b][a],
translation:
  language: de
  text: Salomos täglicher Lebensmittelbedarf betrug dreißig Kor Feinmehl und sechzig Kor Mehl[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Kor war ein großes antikes Hohlmaß für trockene Güter. Der hebräische Text nennt dreißig beziehungsweise sechzig Kor; eine genaue Umrechnung ist unsicher.
    reason: cultural_note
  - marker: b
    text: Wörtlich steht am Anfang „Salomos Brot für einen Tag“; „Brot“ bezeichnet hier umfassender den täglichen Lebensmittelbedarf.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: betrug
  rationale: Die Narrativform von היה leitet die Feststellung ein; zusammen mit לְיוֹם אֶחָד wird sie im Deutschen natürlich als Mengenangabe mit „betrug“ wiedergegeben, ohne ein nicht ausdrücklich vorhandenes „nun“ einzufügen.
- source_word: לֶחֶם שְׁלֹמֹה לְיוֹם אֶחָד
  choice: Salomos täglicher Lebensmittelbedarf
  rationale: לֶחֶם bedeutet wörtlich „Brot“, bezeichnet hier im Verwaltungskontext aber den täglichen Lebensmittelbedarf des königlichen Haushalts. Die kompakte deutsche Form gibt לְיוֹם אֶחָד idiomatisch wieder.
- source_word: שְׁלֹשִׁים כֹּר
  choice: dreißig Kor
  rationale: Die antike Maßeinheit כֹּר bleibt als „Kor“ transliteriert, da eine Umrechnung in moderne Maße unsicher wäre.
- source_word: סֹלֶת
  choice: Feinmehl
  rationale: סֹלֶת bezeichnet besonders fein gemahlenes beziehungsweise hochwertiges Mehl.
- source_word: וְשִׁשִּׁים כֹּר קָמַח
  choice: und sechzig Kor gewöhnliches Mehl
  rationale: קָמַח ist der allgemeinere Ausdruck für Mehl. „Gewöhnliches Mehl“ macht den Gegensatz zum Feinmehl deutlich, ohne eine bestimmte Getreideart einzutragen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Lebensmittelbedarf“ passt zum administrativen Kontext; „Kor“ bewahrt die historische Maßeinheit. Die Fußnotenmarker stehen unmittelbar nach dem betroffenen Satzteil.
