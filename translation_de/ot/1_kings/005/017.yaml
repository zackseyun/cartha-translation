source:
  edition: WLC
  text: אַתָּ֨ה יָדַ֜עְתָּ אֶת דָּוִ֣ד אָבִ֗/י כִּ֣י לֹ֤א יָכֹל֙ לִ/בְנ֣וֹת בַּ֗יִת לְ/שֵׁם֙ יְהוָ֣ה אֱלֹהָ֔י/ו מִ/פְּנֵ֥י הַ/מִּלְחָמָ֖ה אֲשֶׁ֣ר סְבָבֻ֑/הוּ עַ֤ד תֵּת יְהוָה֙ אֹתָ֔/ם תַּ֖חַת כַּפּ֥וֹת רגל/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/017.yaml
  text: You know that David my father could not build a house for the name of Yahweh his God because of the warfare that surrounded him[a], until Yahweh put them under the soles of his feet.
translation:
  language: de
  text: Du weißt, dass mein Vater David kein Haus für den Namen Jahwes, seines Gottes, bauen konnte wegen des Krieges, der ihn ringsum bedrängte, bis Jahwe sie unter die Sohlen seiner Füße legte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „bis Jahwe sie unter die Sohlen seiner Füße gab“. Wer mit „sie“ gemeint ist, wird im Hebräischen nicht ausdrücklich gesagt; aus dem Zusammenhang sind Davids Gegner zu erschließen. Das Bild bezeichnet ihre Unterwerfung.'
    reason: Bewahrt die wörtliche Nuance des hebräischen Verbs, erläutert den nicht ausdrücklich genannten Bezug von „sie“ und das Unterwerfungsbild.
lexical_decisions:
- source_word: אַתָּה יָדַעְתָּ
  choice: Du weißt
  rationale: Das Qal-Perfekt hat in dieser direkten Anrede gegenwärtige Bedeutung. Das ausdrücklich gesetzte Pronomen wird mit „du“ wiedergegeben.
- source_word: בַּיִת
  choice: ein Haus
  rationale: Das nicht determinierte Substantiv bezeichnet den noch zu errichtenden Tempel. „Haus“ bewahrt die hebräische Ausdrucksweise, ohne den Bezug vorzeitig auszudeuten.
- source_word: לְשֵׁם יְהוָה אֱלֹהָיו
  choice: für den Namen Jahwes, seines Gottes
  rationale: Die Formulierung erhält die biblische Wendung „für den Namen“ und gibt das Verhältnis von Jahwe zu David durch die Apposition eindeutig wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מִפְּנֵי הַמִּלְחָמָה
  choice: wegen des Krieges
  rationale: Der Singular bezeichnet hier das fortdauernde Kriegsgeschehen, nicht lediglich eine einzelne Schlacht.
- source_word: אֲשֶׁר סְבָבֻהוּ
  choice: mit dem sie ihn ringsum bedrängten
  rationale: Die Verbform ist pluralisch („sie umgaben ihn“), während „Krieg“ singularisch steht. Die Formulierung wahrt die nicht ausdrücklich genannten menschlichen Handelnden und vermittelt zugleich die feindliche Umzingelung.
- source_word: עַד תֵּת יְהוָה אֹתָם
  choice: bis Jahwe sie … legte
  rationale: נתן mit der Ortsangabe unter den Füßen ist ein Bild der Unterwerfung. „Legte“ bewahrt sowohl das konkrete Bild als auch den resultativen Sinn.
- source_word: תַּחַת כַּפּוֹת רגלו
  choice: unter seine Fußsohlen
  rationale: כַּפּוֹת bezeichnet hier ausdrücklich die Sohlen. Die volle Bildsprache der Unterwerfung bleibt erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Tetragrammaton als persönlichen Gottesnamen; „Jahwe“ bewahrt diese Namensfunktion.
- issue: Bezug der pluralischen Formen „sie/ihnen“
  choice: Der Bezug bleibt im Haupttext unausgesprochen
  alternative: ausdrückliche Ergänzung „seine Feinde“
  rationale: Im Hebräischen sind die Gegner als Subjekt beziehungsweise Objekt nur aus dem Kriegskontext zu erschließen. Eine ausdrückliche Ergänzung würde die syntaktische Spannung beseitigen und stärker interpretieren als der Ausgangstext.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, ohne unnatürlich zu wirken. „Ringsum bedrängten“ macht die feindliche Umzingelung verständlich; die nicht ausdrücklich genannten Gegner werden nicht in den Haupttext eingefügt.
