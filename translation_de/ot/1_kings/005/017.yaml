  rationale: Die Änderung beseitigt eine im Deutschen unnatürliche Relativkonstruktion und vermeidet, dass ein nicht eingeführtes „sie“ als Subjekt erscheint. Der kollektive Singular „Krieg“ gibt die fortdauernde Kriegslage idiomatisch wieder; die Fußnote bewahrt die relevante hebräische Mehrdeutigkeit beim folgenden „sie“.
