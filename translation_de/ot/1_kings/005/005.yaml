  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֵּשֶׁב֩ יְהוּדָ֨ה וְ/יִשְׂרָאֵ֜ל לָ/בֶ֗טַח אִ֣ישׁ תַּ֤חַת גַּפְנ/וֹ֙ וְ/תַ֣חַת תְּאֵֽנָת֔/וֹ מִ/דָּ֖ן וְ/עַד בְּאֵ֣ר שָׁ֑בַע כֹּ֖ל יְמֵ֥י שְׁלֹמֹֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/005.yaml
  text: And Judah and Israel lived in safety[a], each man under his vine and under his fig tree, from Dan to Beer-sheba[b], all the days of Solomon.
translation:
  language: de
  text: Und Juda und Israel wohnten in Sicherheit, jeder[a] unter seinem Weinstock und unter seinem Feigenbaum[b], von Dan bis Beerscheba, alle Tage Salomos hindurch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Hebräischen „jeder Mann“; die maskuline Einzahl wird hier verteilend gebraucht.
    reason: lexical_alternative
  - marker: b
    text: „Unter seinem Weinstock und unter seinem Feigenbaum“ ist ein festes Bild für Frieden, Sicherheit und Wohlstand im Land.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: wohnten
  rationale: Das Verb bezeichnet hier ein dauerhaftes, sesshaftes Wohnen; zusammen mit לָבֶטַח steht das sichere Leben im Land im Vordergrund.
- source_word: יְהוּדָה וְיִשְׂרָאֵל
  choice: Juda und Israel
  rationale: Die beiden im Hebräischen genannten politisch-geografischen Größen werden unmittelbar beibehalten und nicht verallgemeinert.
- source_word: לָבֶטַח
  choice: in Sicherheit
  rationale: Die Wendung bezeichnet ein Leben ohne akute Bedrohung und gibt den Zustand nationaler Ruhe idiomatisch wieder.
- source_word: אִישׁ
  choice: jeder
  rationale: Das maskuline Singularwort wird distributiv gebraucht. Das substantivierte „jeder“ ist im Deutschen natürlich und bewahrt diese Verteilungsfunktion.
- source_word: תַּחַת גַּפְנוֹ וְתַחַת תְּאֵנָתוֹ
  choice: unter seinem Weinstock und unter seinem Feigenbaum
  rationale: Das konkrete, traditionsreiche Bild für Frieden, Sicherheit und Wohlstand wird bewahrt statt paraphrasiert.
- source_word: מִדָּן וְעַד בְּאֵר שָׁבַע
  choice: von Dan bis Beerscheba
  rationale: Die geografische Spannweite bleibt als gebräuchliche Gesamtbezeichnung für das Land erhalten; „Beerscheba“ entspricht der etablierten deutschen Namensform.
- source_word: כֹּל יְמֵי שְׁלֹמֹה
  choice: alle Tage Salomos hindurch
  rationale: Die Wiedergabe bleibt eng an der hebräischen Zeitangabe und bezeichnet die Dauer dieses Zustands unter Salomo, ohne „Regierungszeit“ ausdrücklich in den Text einzutragen.
theological_decisions:
- issue: Distributiver Gebrauch des maskulinen אִישׁ
  choice: jeder
  alternative: alle; jeder Mensch
  rationale: Die Übersetzung erhält die distributive Einzahl und ihre grammatisch maskuline Form, ohne den Sinn auf eine moderne individualistische oder ausdrücklich geschlechtsneutrale Form festzulegen.
- issue: Bildformel vom Weinstock und Feigenbaum
  choice: Das wörtliche Bild bleibt im Haupttext erhalten.
  alternative: in Frieden und Wohlstand leben
  rationale: Die Bildsprache trägt literarische und theologische Bezüge zu unbedrohter Landnahme, Frieden und Wohlergehen. Eine Paraphrase würde diese intertextuelle Kraft abschwächen.
- issue: Zeitangabe כֹּל יְמֵי שְׁלֹמֹה
  choice: alle Tage Salomos hindurch
  alternative: während der gesamten Regierungszeit Salomos
  rationale: Die formal nähere Fassung lässt offen, ob der Ausdruck allgemein auf Salomos Lebens- oder im Kontext auf seine Regierungszeit bezogen wird, statt die kontextuelle Deutung in den Wortlaut einzubauen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit weitgehend formnaher Satzführung. Die traditionelle Bildsprache bleibt verständlich und unverändert; altertümliche Formen werden vermieden.
