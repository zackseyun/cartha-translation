  text: וַ/יְהִ֧י לִ/שְׁלֹמֹ֛ה שִׁבְעִ֥ים אֶ֖לֶף נֹשֵׂ֣א סַבָּ֑ל וּ/שְׁמֹנִ֥ים אֶ֖לֶף חֹצֵ֥ב בָּ/הָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/029.yaml
  text: And Solomon had seventy thousand burden-bearers[a], and eighty thousand stonecutters in the mountains.
translation:
  language: de
  text: Und Salomo hatte 70.000 Lastträger und 80.000 Steinhauer im Gebirge.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Hauer im Gebirge“; wahrscheinlich sind Arbeiter in den Steinbrüchen der Bergregion gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לִשְׁלֹמֹה
  choice: Und Salomo hatte
  rationale: Die Konstruktion היה + ל bezeichnet hier Besitz beziehungsweise Zugehörigkeit. „Salomo hatte“ gibt dies im Deutschen natürlich wieder und bewahrt mit „Und“ den Erzählanschluss.
- source_word: שִׁבְעִים אֶלֶף
  choice: '70.000'
  rationale: Direkte Wiedergabe der Kardinalzahl in geläufiger deutscher Zahlenschreibung.
- source_word: נֹשֵׂא סַבָּל
  choice: Lastträger
  rationale: Die Verbindung aus „tragen“ und „Last“ bezeichnet Arbeiter, deren Aufgabe das Befördern schwerer Lasten war. „Lastträger“ ist knapp, verständlich und sachlich präzise.
- source_word: וּשְׁמֹנִים אֶלֶף
  choice: und 80.000
  rationale: Direkte Wiedergabe der Kardinalzahl samt verbindender Konjunktion.
- source_word: חֹצֵב
  choice: Steinhauer
  rationale: Das Partizip bezeichnet jemanden, der Material heraushaut oder bricht. Im Zusammenhang der Bauarbeiten sind Steinbrucharbeiter gemeint; „Steinhauer“ macht den naheliegenden Gegenstand verständlich, ohne die Tätigkeit zu verallgemeinern.
- source_word: בָּהָר
  choice: im Gebirge
  rationale: Der Singular הַר kann topografisch oder kollektiv eine Bergregion bezeichnen. „Im Gebirge“ ist im Deutschen natürlich und näher an der Formulierung des Hebräischen als eine stärker deutende Ortsangabe wie „im Bergland“.
theological_decisions: []
translation_notes:
  register: Moderne, sachliche und würdige Standardsprache. Die Berufsbezeichnungen bleiben knapp; „Steinhauer“ bewahrt den konkreten Arbeitscharakter. Der Fußnotenmarker steht bei der tatsächlich erläuterten Wendung und nicht bei „Lastträger“.
