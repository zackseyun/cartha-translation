  text: He spoke three thousand proverbs[a], and his songs were one thousand and five.
translation:
  language: de
  text: Er sprach dreitausend Sprüche[a], und seine Lieder waren eintausendfünf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dreitausend Weisheitssprüche“, „dreitausend Gleichnisse“ oder „dreitausend sprichwörtliche Reden“. Das hebräische Wort מָשָׁל kann ein breiteres Bedeutungsspektrum haben als „Spruch“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Er sprach
  rationale: Das Piel von דבר bedeutet hier direkt „sprechen“ bzw. „vortragen“. „Verfassen“ mag im Zusammenhang mitgemeint sein, wird durch das Verb selbst aber nicht ausdrücklich gesagt.
- source_word: שְׁלֹשֶׁת אֲלָפִים
  choice: dreitausend
  rationale: Die Zahl wird in natürlicher deutscher Schreibweise wiedergegeben.
- source_word: מָשָׁל
  choice: Weisheitssprüche
  rationale: מָשָׁל bezeichnet einen prägnanten Spruch und kann je nach Kontext auch Gleichnis oder sprichwörtliche Rede bedeuten. „Weisheitssprüche“ passt zu Salomos Weisheitstradition, ohne den Begriff auf heutige Sprichwörter zu verengen.
- source_word: וַיְהִי
  choice: waren
  rationale: היה dient in der Zahlenangabe als Kopula und bezeichnet den Gesamtumfang; „waren“ ist im Deutschen schlicht und natürlich.
- source_word: שִׁירוֹ
  choice: seine Lieder
  rationale: Obwohl שִׁיר mit Suffix formal im Singular steht, wird es bei der Zahlenangabe kollektiv gebraucht und deshalb im Deutschen pluralisch wiedergegeben.
- source_word: חֲמִשָּׁה וָאָלֶף
  choice: tausendundfünf
  rationale: Die hebräische Reihenfolge lautet wörtlich „fünf und tausend“. Im Deutschen wird dieselbe genaue Zahl idiomatisch als „tausendundfünf“ ausgedrückt.
