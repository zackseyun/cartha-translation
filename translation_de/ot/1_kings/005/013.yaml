  text: וַ/יְדַבֵּר֮ עַל הָֽ/עֵצִים֒ מִן הָ/אֶ֨רֶז֙ אֲשֶׁ֣ר בַּ/לְּבָנ֔וֹן וְ/עַד֙ הָ/אֵז֔וֹב אֲשֶׁ֥ר יֹצֵ֖א בַּ/קִּ֑יר וַ/יְדַבֵּר֙ עַל הַ/בְּהֵמָ֣ה וְ/עַל הָ/ע֔וֹף וְ/עַל הָ/רֶ֖מֶשׂ וְ/עַל הַ/דָּגִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/013.yaml
  text: He spoke about the trees[a], from the cedar that is in Lebanon to the hyssop that grows out of the wall; he also spoke about the animals and the birds and the creeping things and the fish.
translation:
  language: de
  text: Er sprach über die Bäume, von der Zeder im Libanon bis zum Ysop[a], der aus der Mauer wächst. Er sprach auch über die Tiere, die Vögel, die Kriechtiere und die Fische.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: »eine kleine aromatische Pflanze«. Die genaue botanische Bestimmung des hebräischen אֵזוֹב ist unsicher; »Ysop« ist die traditionelle Wiedergabe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר עַל
  choice: er sprach über
  rationale: דבר mit עַל bezeichnet hier das Reden über ein Thema. Die Wiedergabe ist natürlich und vermeidet die unbelegte Präzisierung, Salomo habe die Dinge wissenschaftlich beschrieben.
- source_word: הָעֵצִים
  choice: die Bäume
  rationale: עֵץ bezeichnet hier im Rahmen der botanischen Spannweite Bäume beziehungsweise holzige Gewächse; »Bäume« ist die klare, übliche Wiedergabe.
- source_word: הָאֶרֶז אֲשֶׁר בַּלְּבָנוֹן
  choice: die Zeder im Libanon
  rationale: Die knappe deutsche Fassung gibt die bekannte Verbindung der Zeder mit dem Libanon natürlich wieder.
- source_word: מִן ... וְעַד
  choice: von ... bis
  rationale: Die deutsche Korrespondenzformel bewahrt die Spannweite vom großen Zedernbaum bis zum kleinen Mauergewächs.
- source_word: הָאֵזוֹב
  choice: der Ysop
  rationale: »Ysop« ist die traditionelle und weithin verständliche Wiedergabe; da die genaue botanische Bestimmung unsicher ist, wird diese Unsicherheit in einer Fußnote offengelegt.
- source_word: יֹצֵא בַּקִּיר
  choice: der aus der Mauer wächst
  rationale: Wörtlich kommt die Pflanze aus der Mauer hervor; »wächst aus der Mauer« gibt das Bild im botanischen Zusammenhang idiomatisch wieder.
- source_word: הַבְּהֵמָה
  choice: die Tiere
  rationale: בְּהֵמָה kann Vieh oder größere Landtiere bezeichnen. In dieser umfassenden Aufzählung ist »Tiere« eine natürliche, nicht unnötig verengende Wiedergabe.
- source_word: הָעוֹף
  choice: die Vögel
  rationale: עוֹף bezeichnet fliegende Geschöpfe und wird in dieser zoologischen Reihe am natürlichsten mit »Vögel« wiedergegeben.
- source_word: הָרֶמֶשׂ
  choice: die Kriechtiere
  rationale: רֶמֶשׂ umfasst kriechende oder sich am Boden bewegende Geschöpfe. »Kriechtiere« bewahrt die hebräische Kategorie besser als das biologisch engere »Reptilien«.
- source_word: הַדָּגִים
  choice: die Fische
  rationale: Dies ist die gewöhnliche deutsche Bezeichnung der hier genannten Tiergruppe.
