base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/014.yaml
  text: And people from all the peoples came to hear the wisdom of Solomon[b][a], from all the kings of the earth who had heard of his wisdom.
translation:
  language: de
  text: Menschen aus allen Völkern kamen, um Salomos Weisheit zu hören; sie kamen von allen Königen der Erde, die von seiner Weisheit gehört hatten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von allen Königen der Erde“. Gemeint sein kann, dass die Besucher von Königen kamen oder von ihnen entsandt worden waren; der hebräische Wortlaut legt dies nicht eindeutig fest.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: kamen
  rationale: Das Wayyiqtol von בוא führt die Erzählung in der Vergangenheit fort; „kamen“ ist direkt und natürlich.
- source_word: מִכָּל הָעַמִּים
  choice: aus allen Völkern
  rationale: Der Plural von עַם bezeichnet unterschiedliche Völker oder Volksgruppen; „Völker“ bewahrt diese Mehrzahl.
- source_word: לִשְׁמֹעַ
  choice: um … zu hören
  rationale: Der Infinitiv bezeichnet den Zweck ihres Kommens; die deutsche Konstruktion „um … zu“ gibt dies idiomatisch wieder.
- source_word: חָכְמַת שְׁלֹמֹה
  choice: Salomos Weisheit
  rationale: Die Genitivverbindung wird in natürlichem Deutsch knapp und genau wiedergegeben.
- source_word: מֵאֵת כָּל מַלְכֵי הָאָרֶץ
  choice: Sie kamen von allen Königen der Erde
  rationale: מֵאֵת bezeichnet hier Herkunft oder Ausgangspunkt. Ein eigener Satz macht die im Hebräischen gedrängte Konstruktion verständlich, ohne ausdrücklich festzulegen, ob die Besucher von den Königen entsandt wurden.
- source_word: אֲשֶׁר שָׁמְעוּ אֶת חָכְמָתוֹ
  choice: die von seiner Weisheit gehört hatten
  rationale: „Von seiner Weisheit gehört“ ist im Deutschen die natürliche Formulierung für Berichte über Salomos Weisheit; das Plusquamperfekt verdeutlicht die Vorzeitigkeit.
