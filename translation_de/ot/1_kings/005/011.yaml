  text: וַ/יֶּחְכַּם֮ מִ/כָּל הָֽ/אָדָם֒ מֵ/אֵיתָ֣ן הָ/אֶזְרָחִ֗י וְ/הֵימָ֧ן וְ/כַלְכֹּ֛ל וְ/דַרְדַּ֖ע בְּנֵ֣י מָח֑וֹל וַ/יְהִֽי שְׁמ֥/וֹ בְ/כָֽל הַ/גּוֹיִ֖ם סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/011.yaml
  text: He was wiser than every man—than Ethan the Ezrahite[a], and Heman, Kalkol, and Darda[c][b], the sons of Mahol—and his name was in all the surrounding nations.
translation:
  language: de
  text: Er war weiser als alle Menschen[a] – als Etan, den Esrachiter, Heman, Kalkol und Darda, die Söhne Mahols[b]. Sein Name war bei allen Völkern ringsum bekannt.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als jeden Menschen“ beziehungsweise „als die ganze Menschheit“. Das hebräische Wort kann einen einzelnen Menschen oder die Menschheit insgesamt bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Söhne Mahols“ ist wahrscheinlich eine Abstammungs- oder Familienbezeichnung für die vier genannten Männer. Mahol bedeutet als gewöhnliches hebräisches Wort auch „Reigentanz“.
    reason: textual_or_lexical_ambiguity
  - marker: c
    text: 'Wörtlich: „Sein Name war bei allen Völkern ringsum.“ Gemeint ist, dass er dort bekannt war oder Ansehen genoss.'
    reason: idiom_explanation
lexical_decisions:
- source_word: וַיֶּחְכַּם מִכָּל
  choice: Er war weiser als
  rationale: Die Konstruktion mit חכם und der Vergleichspräposition מִן bezeichnet hier eine Überlegenheit an Weisheit. Die deutsche Vergleichsform gibt dies natürlich und genau wieder.
- source_word: הָאָדָם
  choice: alle Menschen
  rationale: אָדָם kann den einzelnen Menschen oder die Menschheit bezeichnen. „Alle Menschen“ bewahrt den umfassenden Wortlaut, während die anschließend genannten Männer den konkreten Vergleich näher bestimmen.
- source_word: אֵיתָן הָאֶזְרָחִי
  choice: Etan, der Esrachiter
  rationale: אֵיתָן ist ein Personenname; הָאֶזְרָחִי ist hier am ehesten eine Herkunfts- oder Familienbezeichnung. Die Transliteration vermeidet eine unsichere etymologische Festlegung.
- source_word: הֵימָן וְכַלְכֹּל וְדַרְדַּע
  choice: Heman, Kalkol und Darda
  rationale: Die Personennamen werden quellennah ins Deutsche übertragen; „Kalkol“ bildet die hebräischen Konsonanten unmittelbar ab.
- source_word: בְּנֵי מָחוֹל
  choice: die Söhne Mahols
  rationale: Die Verbindung wird am natürlichsten als Familien- oder Abstammungsangabe verstanden. Im Satz bezieht sie sich auf Heman, Kalkol und Darda.
- source_word: וַיְהִי שְׁמוֹ בְּכָל הַגּוֹיִם סָבִיב
  choice: Sein Name war bei allen Völkern ringsum bekannt
  rationale: Die Formulierung behält das hebräische Idiom „sein Name war“ bei und ergänzt „bekannt“, damit dessen Bedeutung im heutigen Deutschen verständlich wird. גּוֹיִם bezeichnet hier die umliegenden Völker, ohne eine spätere theologische Bedeutung von „Heiden“ einzutragen.
theological_decisions:
- issue: Bedeutungsumfang von אָדָם im Vergleich
  choice: alle Menschen
  alternative: jeder andere Mensch / die ganze Menschheit
  rationale: Der hebräische Ausdruck kann kollektiv die Menschheit oder distributiv jeden Menschen meinen. Die gewählte Formulierung wahrt den umfassenden Vergleich, ohne ihn ausschließlich auf Männer zu begrenzen; die folgenden Namen bleiben konkrete männliche Vergleichspersonen.
- issue: „Name“ als Bezeichnung für Ansehen oder Ruhm
  choice: Sein Name war … bekannt
  alternative: Sein Ruhm verbreitete sich …
  rationale: Die gewählte Fassung bewahrt das konkrete Bild des hebräischen Textes und macht zugleich seine idiomatische Bedeutung verständlich, ohne den Ausdruck vollständig durch die Deutung „Ruhm“ zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Namensformen sind quellennah transliteriert. Der Satzbau bleibt nah an der hebräischen Vergleichsstruktur, wird jedoch zur besseren Lesbarkeit in zwei deutsche Sätze gegliedert.
