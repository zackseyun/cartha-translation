lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Da ließ … ausrichten
  rationale: Das Wayyiqtol führt die nächste Handlung der Erzählung ein. „Da“ gibt die Abfolge natürlich wieder; zusammen mit der folgenden Redeformel bezeichnet „ließ ausrichten“ idiomatisch das Senden einer Botschaft.
- source_word: שְׁלֹמֹה
  choice: Salomo
  rationale: Der Eigenname wird in seiner etablierten deutschen Bibelform wiedergegeben.
- source_word: אֶל חִירָם
  choice: Hiram
  rationale: Hiram ist der Empfänger der Botschaft. Bei der idiomatischen Konstruktion „jemandem etwas ausrichten lassen“ wird die hebräische Präposition אֶל nicht gesondert wiedergegeben.
- source_word: לֵאמֹר
  choice: 'ausrichten:'
  rationale: Der Infinitiv leitet den Wortlaut der folgenden Botschaft ein. Der Doppelpunkt erfüllt im Deutschen diese Funktion; „ausrichten“ bewahrt den Zusammenhang mit dem Verb des Sendens.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die idiomatische Wendung „ließ … ausrichten“ vermeidet das im Deutschen schwerfällige „sandte … und sagte“ und führt natürlich zur nachfolgenden direkten Rede hin.
