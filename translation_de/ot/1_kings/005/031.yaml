  yaml_path: translation/ot/1_kings/005/031.yaml
  text: Then the king commanded[a], and they quarried great stones, costly stones, cut stones[b], to lay the foundation of the house.
translation:
  language: de
  text: Da befahl der König, große, wertvolle, behauene Steine herauszubrechen, um das Fundament des Hauses[b] zu legen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Gemeint ist der Tempel; wörtlich steht im Hebräischen „das Haus“.
    reason: contextual_clarification
lexical_decisions:
- source_word: וַיְצַו הַמֶּלֶךְ
  choice: Da befahl der König
  rationale: Das Wayyiqtol führt die Handlung fort; „Da“ gibt den erzählerischen Fortgang in natürlichem Deutsch wieder. Das im Hebräischen nicht ausdrücklich genannte Objekt des Befehls bleibt auch im Deutschen offen.
- source_word: וַיַּסִּעוּ
  choice: sie ... zu brechen
  rationale: Die Kausativform von נסע bezeichnet hier im Zusammenhang des Tempelbaus wahrscheinlich das Herauslösen beziehungsweise Brechen der Steine im Steinbruch. Die Infinitivkonstruktion nach „befahl“ ist idiomatisches Deutsch.
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: große ... Steine
  rationale: Direkte und natürliche Wiedergabe von Substantiv und Adjektiv.
- source_word: אֲבָנִים יְקָרוֹת
  choice: wertvolle Steine
  rationale: יקר bezeichnet hier wertvolle beziehungsweise kostbare Baumaterialien, nicht Edelsteine. „Wertvoll“ bewahrt diesen Sinn ohne die mögliche Assoziation mit Schmucksteinen.
- source_word: לְיַסֵּד
  choice: um das Fundament ... zu legen
  rationale: Im Baukontext bezeichnet יסד das Gründen beziehungsweise Legen eines Fundaments; die gewählte Formulierung ist im modernen Deutsch geläufig.
- source_word: הַבַּיִת
  choice: des Hauses
  rationale: Die konkrete hebräische Bezeichnung „das Haus“ bleibt erhalten; aus dem Zusammenhang ist der Tempel gemeint.
- source_word: אַבְנֵי גָזִית
  choice: Quadersteine
  rationale: גזית bezeichnet behauene oder zugerichtete Steine. „Quadersteine“ ist im deutschen Baukontext präzise und lässt die Phrase appositionell die zuvor genannten Steine näher bestimmen.
