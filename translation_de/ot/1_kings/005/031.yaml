  verdict: revise
  source_fidelity: 'Die Grundbedeutung ist überwiegend getroffen: Der König gibt einen Befehl, große und wertvolle Steine werden für die Fundamentlegung des Hauses gewonnen. „Quadersteine“ ist jedoch enger als אַבְנֵי גָזִית und legt eine regelmäßig quaderförmige Bearbeitung nahe, die der hebräische Ausdruck nicht ausdrücklich verlangt. „Behauene Steine“ gibt die Bearbeitung sachgerecht wieder. „Herauszubrechen“ verdeutlicht im Baukontext das Gewinnen der Steine, ohne eine unnötig spezifische Abbaumethode zu behaupten.'
  naturalness: Die revidierte Reihung ist flüssiges modernes Standarddeutsch. Die drei Attribute stehen verständlich bei „Steine“, ohne dass der abschließende hebräische Ausdruck als zusätzliches Material oder als Werkzeug der Fundamentlegung missverstanden wird.
  terminology: „Behauene Steine“ ist für גזית ein etablierter, präziser und gegenüber „Quadersteine“ weniger spezifizierender Baubegriff. „Haus“ bleibt als Wiedergabe von הַבַּיִת erhalten; die Fußnote erläutert den kontextuell gemeinten Tempel.
  issues:
  - severity: medium
    issue: „Quadersteine“ ist als Wiedergabe von אַבְנֵי גָזִית zu spezifisch.
    rationale: Der hebräische Ausdruck bezeichnet behauene bzw. zugerichtete Steine, verlangt aber nicht, dass sie geometrisch als Quader gestaltet sind. Die deutsche Wahl kann daher eine nicht gesicherte technische Einzelheit eintragen.
  - severity: low
    issue: „Steine zu brechen“ kann ohne Richtungspräfix auch das Zerschlagen von Steinen nahelegen.
    rationale: Im Kontext ist das Herauslösen bzw. Gewinnen großer Bausteine gemeint. „Herauszubrechen“ macht dies im Deutschen klarer.
  revised_text: Da befahl der König, große, wertvolle, behauene Steine herauszubrechen, um das Fundament des Hauses[b] zu legen.
