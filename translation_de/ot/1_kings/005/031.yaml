- from: Da befahl der König, große, wertvolle Steine zu brechen – Quadersteine[a] –, um das Fundament des Hauses[b] zu legen.
  to: Da befahl der König, große, wertvolle, behauene Steine herauszubrechen, um das Fundament des Hauses[b] zu legen.
