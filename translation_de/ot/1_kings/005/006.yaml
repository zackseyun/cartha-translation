base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/006.yaml
  text: And Solomon had forty thousand stalls of horses for his chariots[a], and twelve thousand horsemen.
translation:
  language: de
  text: Und Salomo hatte vierzigtausend Stallplätze für die Pferde seiner Streitwagen[a] und zwölftausend Reiter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Stallungen«. Das hebräische Wort bezeichnet genauer Pferdestände oder Futterplätze und nicht unbedingt ganze Stallgebäude.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לִשְׁלֹמֹה
  choice: Und Salomo hatte
  rationale: Die hebräische Besitzkonstruktion ויהי ל wird im modernen Deutschen natürlich mit »hatte« wiedergegeben.
- source_word: אַרְבָּעִים אֶלֶף
  choice: vierzigtausend
  rationale: Direkte Wiedergabe der Kardinalzahl.
- source_word: אֻרְוֺת סוּסִים
  choice: Pferdeboxen
  rationale: Das Substantiv bezeichnet genauer einzelne Stände beziehungsweise Futterplätze für Pferde, nicht notwendig ganze Stallgebäude.
- source_word: לְמֶרְכָּבוֹ
  choice: für seine Streitwagen
  rationale: Der Singular mit Suffix wird kollektiv verstanden; »Streitwagen« macht den militärischen Zusammenhang im Deutschen deutlich.
- source_word: וּשְׁנֵים עָשָׂר אֶלֶף
  choice: und zwölftausend
  rationale: Direkte Wiedergabe der Zahlphrase.
- source_word: פָּרָשִׁים
  choice: Reiter
  rationale: Das Wort bezeichnet gewöhnlich berittene Männer; »Reiter« ist die direkte und natürliche deutsche Entsprechung.
