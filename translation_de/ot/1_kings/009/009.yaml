source:
  edition: WLC
  text: וְ/אָמְר֗וּ עַל֩ אֲשֶׁ֨ר עָזְב֜וּ אֶת יְהוָ֣ה אֱלֹהֵי/הֶ֗ם אֲשֶׁ֨ר הוֹצִ֣יא אֶת אֲבֹתָ/ם֮ מֵ/אֶ֣רֶץ מִצְרַיִם֒ וַֽ/יַּחֲזִ֨קוּ֙ בֵּ/אלֹהִ֣ים אֲחֵרִ֔ים ו/ישתחו לָ/הֶ֖ם וַ/יַּעַבְדֻ֑/ם עַל כֵּ֗ן הֵבִ֤יא יְהוָה֙ עֲלֵי/הֶ֔ם אֵ֥ת כָּל הָ/רָעָ֖ה הַ/זֹּֽאת־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/009.yaml
  text: And they will say[a], ‘Because they abandoned Yahweh their God, who brought their fathers out of the land of Egypt, and they held fast to other gods and bowed down to them and served them[c][b], therefore Yahweh brought all this disaster on them.’
translation:
  language: de
  text: 'Und sie werden sagen: »Weil sie Jahwe, ihren Gott, verlassen haben und an anderen Göttern festgehalten, sich vor ihnen niedergeworfen und ihnen gedient haben, hat Jahwe all dieses Unheil über sie gebracht.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: Und sie werden sagen
  rationale: Das mit וְ verbundene Perfekt bezeichnet im Zusammenhang mit der vorausgehenden Frage die künftige Antwort der Betrachter.
- source_word: עַל אֲשֶׁר
  choice: Weil
  rationale: Die Verbindung leitet den Grund für das Gericht ein; „weil“ gibt diese kausale Funktion im Deutschen natürlich wieder.
- source_word: עָזְבוּ
  choice: verlassen haben
  rationale: „Verlassen“ drückt die bewusste Abkehr von Jahwe klar und ohne altertümliche Sprache aus.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵיהֶם
  choice: ihren Gott
  rationale: Trotz der pluralischen Form bezeichnet אֱלֹהִים hier in Verbindung mit Jahwe eindeutig den einen Gott Israels.
- source_word: הוֹצִיא ... מֵאֶרֶץ מִצְרַיִם
  choice: aus dem Land Ägypten herausgeführt hatte
  rationale: Die Formulierung bewahrt die Exodus-Aussage und gibt das zeitliche Verhältnis zum Verlassen durch das Plusquamperfekt verständlich wieder.
- source_word: אֲבֹתָם
  choice: ihre Väter
  rationale: Die wörtliche Bedeutung wird im Haupttext beibehalten; die umfassendere Bedeutung „Vorfahren“ wird in einer Fußnote genannt.
- source_word: וַיַּחֲזִקוּ בֵּאלֹהִים אֲחֵרִים
  choice: an anderen Göttern festhielten
  rationale: Die Wiedergabe bewahrt das Bild eines entschlossenen Festhaltens und damit die bewusste Bindung an fremde Götter.
- source_word: וישתחו לָהֶם
  choice: sich vor ihnen niederwarfen
  rationale: Die konkrete Geste der Niederwerfung bleibt erhalten, statt sie lediglich allgemein mit „anbeten“ wiederzugeben.
- source_word: וַיַּעַבְדֻם
  choice: ihnen dienten
  rationale: „Dienen“ erhält die lexikalische Unterscheidung zur vorausgehenden Niederwerfung und bezeichnet hier kultischen Dienst.
- source_word: עַל כֵּן
  choice: darum
  rationale: „Darum“ kennzeichnet knapp und idiomatisch die Folgerung aus der Abkehr Israels.
- source_word: הֵבִיא ... אֵת כָּל הָרָעָה הַזֹּאת
  choice: all dieses Unheil über sie gebracht
  rationale: רָעָה bezeichnet hier nicht moralische Bosheit, sondern das als Gericht eintretende Unheil.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen Gottes; „Jahwe“ bewahrt diesen, während „der HERR“ ihn durch einen Titel ersetzen würde.
- issue: Bedeutungsumfang von אֲבֹתָם
  choice: ihre Väter
  alternative: ihre Vorfahren
  rationale: „Väter“ entspricht der Form des hebräischen Ausdrucks; weil er im Zusammenhang auch die früheren Generationen insgesamt bezeichnen kann, bleibt „Vorfahren“ als Fußnotenalternative sichtbar.
- issue: Bedeutung von רָעָה im Gerichtszusammenhang
  choice: Unheil
  alternative: Böses
  rationale: Hier geht es um eine von Jahwe verhängte Katastrophe und nicht um moralisch Böses; „Unheil“ wahrt den Gerichtscharakter, ohne Gott moralisches Böses zuzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreigliedrige Beschreibung des Götzendienstes – festhalten, niederwerfen, dienen – bleibt erhalten. Die kausale Wiederholung „weil … und weil“ macht den langen deutschen Satz klar, ohne die hebräische Argumentationsstruktur aufzulösen.
