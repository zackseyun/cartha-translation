  text: בְּנֵי/הֶ֗ם אֲשֶׁ֨ר נֹתְר֤וּ אַחֲרֵי/הֶם֙ בָּ/אָ֔רֶץ אֲשֶׁ֧ר לֹֽא יָכְל֛וּ בְּנֵ֥י יִשְׂרָאֵ֖ל לְ/הַֽחֲרִימָ֑/ם וַ/יַּעֲלֵ֤/ם שְׁלֹמֹה֙ לְ/מַס עֹבֵ֔ד עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/021.yaml
  text: their children who were left after them in the land[a], whom the sons of Israel had not been able to devote to destruction—Solomon conscripted them for forced labor, to this day.
translation:
  language: de
  text: Ihre Nachkommen, die nach ihnen im Land übrig geblieben waren und die die Israeliten nicht dem Bann weihen konnten[a], zog Salomo zur Zwangsarbeit heran – bis zum heutigen Tag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „dem Bann weihen“; auch möglich: „vollständig vernichten“ oder „dem Bann unterwerfen“. Das Verb bezeichnet die unwiderrufliche Aussonderung von Menschen oder Dingen unter den Bann und kann in diesem Zusammenhang Vernichtung einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵיהֶם
  choice: ihre Nachkommen
  rationale: Der Plural von בֵּן mit Suffix kann hier über leibliche Söhne hinaus die nachfolgende Generation bezeichnen. „Nachkommen“ passt zum Zusammenhang und beschränkt die Aussage nicht unnötig auf männliche Kinder.
- source_word: נֹתְרוּ אַחֲרֵיהֶם
  choice: die nach ihnen … übrig geblieben waren
  rationale: Die Form bezeichnet diejenigen, die nach der vorausgehenden Generation zurückblieben; das Plusquamperfekt gibt dieses zeitliche Verhältnis im Deutschen natürlich wieder.
- source_word: בָּאָרֶץ
  choice: im Land
  rationale: אֶרֶץ bezeichnet in diesem geschichtlichen Zusammenhang das Land Israel beziehungsweise Kanaan.
- source_word: לֹא יָכְלוּ ... לְהַחֲרִימָם
  choice: die … nicht dem Bann zur Vernichtung weihen konnten
  rationale: Die Wiedergabe bewahrt sowohl den Gedanken unwiderruflicher Bannweihe als auch den der Vernichtung, ohne den Ausdruck auf bloßes Töten zu verengen.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: „Israeliten“ ist die natürliche moderne deutsche Wiedergabe des kollektiven Ausdrucks „Söhne Israels“.
- source_word: וַיַּעֲלֵם
  choice: zog … heran
  rationale: Im Zusammenhang mit לְמַס bezeichnet der Hifil die administrative Heranziehung beziehungsweise Einteilung zu einer Arbeitsleistung.
- source_word: לְמַס עֹבֵד
  choice: zur Zwangsarbeit
  rationale: מַס bezeichnet hier eine auferlegte Arbeitsleistung; „Zwangsarbeit“ ist verständlich und legt keinen darüber hinausgehenden rechtlichen Sklavenstatus fest.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: bis zum heutigen Tag
  rationale: Die geläufige deutsche Wendung gibt die hebräische Zeitformel eng und verständlich wieder.
theological_decisions:
- issue: Wiedergabe von החרים im Zusammenhang von Eroberung und Gericht
  choice: dem Bann zur Vernichtung weihen
  alternative: vollständig vernichten; dem Bann unterwerfen
  rationale: חרים verbindet die unwiderrufliche Aussonderung unter den Bann mit Vernichtung. Die gewählte Formulierung erhält beide Aspekte und damit die theologische Spannung des Ausdrucks.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Nachkommen“ und „Israeliten“ vermeiden unnötig geschlechtsspezifische Missverständnisse; „Zwangsarbeit“ ist allgemein verständlicher als das fachsprachliche „Frondienst“ oder „Korvée“.
