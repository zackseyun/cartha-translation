  language: en
  yaml_path: translation/ot/1_kings/009/016.yaml
  text: Pharaoh king of Egypt had gone up and captured Gezer and burned it with fire[a], and he killed the Canaanites who lived in the city, and gave it as a dowry to his daughter, Solomon’s wife.
translation:
  language: de
  text: Der Pharao, der König von Ägypten, war nämlich heraufgezogen, hatte Geser erobert und mit Feuer niedergebrannt, die Kanaaniter, die in der Stadt lebten, getötet und die Stadt seiner Tochter, Salomos Frau, als Mitgift[a] gegeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: als Hochzeitsgabe. Das hebräische Wort bezeichnet eine Gabe im Zusammenhang mit der Verheiratung; ihre genaue gesellschaftliche oder rechtliche Bedeutung ist nicht sicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה
  choice: war nämlich heraufgezogen
  rationale: Das Plusquamperfekt gibt den im Zusammenhang rückblickend erklärenden Charakter wieder; „heraufziehen“ bewahrt zugleich die räumlich-militärische Ausdrucksweise des Hebräischen. „Nämlich“ macht die Begründungsfunktion in natürlichem Deutsch kenntlich.
- source_word: וַיִּלְכֹּד
  choice: hatte Geser erobert
  rationale: „Erobern“ bezeichnet im Deutschen klar die militärische Einnahme einer Stadt.
- source_word: וַיִּשְׂרְפָהּ בָּאֵשׁ
  choice: mit Feuer verbrannt
  rationale: Die Formulierung bewahrt das ausdrücklich genannte „mit Feuer“, auch wenn der Ausdruck im Deutschen stärker betont wirkt als das schlichtere „niedergebrannt“.
- source_word: הַכְּנַעֲנִי
  choice: die Kanaaniter
  rationale: Der morphologische Singular wird hier kollektiv für die kanaanitische Bevölkerung der Stadt gebraucht; der deutsche Plural gibt diesen Sinn natürlich wieder.
- source_word: הַיֹּשֵׁב בָּעִיר
  choice: die in der Stadt lebten
  rationale: Die partizipiale Wendung wird als verständlicher deutscher Relativsatz wiedergegeben.
- source_word: הָרָג
  choice: getötet
  rationale: Direkte, ungeschmückte Wiedergabe des Verbs ohne archaische oder interpretierend verstärkte Wortwahl.
- source_word: וַיִּתְּנָהּ
  choice: die Stadt … gegeben
  rationale: Das feminine Suffix bezieht sich auf Geser beziehungsweise die Stadt. Die Wiederaufnahme als „die Stadt“ verhindert im längeren deutschen Satz ein unklares Pronomen.
- source_word: שִׁלֻּחִים
  choice: als Hochzeitsgabe
  rationale: Der seltene Ausdruck bezeichnet hier eine anlässlich der Verheiratung übergebene Gabe. „Hochzeitsgabe“ ist verständlich und legt die rechtlich-soziale Form weniger eng fest als „Mitgift“.
- source_word: לְבִתּוֹ אֵשֶׁת שְׁלֹמֹה
  choice: seiner Tochter, Salomos Frau
  rationale: Die Apposition identifiziert die Tochter als die Frau Salomos; die knappe Form ist im Deutschen natürlich und wahrt die Satzstruktur.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rückblickende Erzählperspektive wird durch das Plusquamperfekt und „nämlich“ kenntlich gemacht. Die Reihung der Gewalthandlungen bleibt sachlich und nah an der hebräischen Abfolge; die ungewöhnliche Betonung „mit Feuer verbrannt“ wurde wegen des ausdrücklichen בָּאֵשׁ beibehalten.
