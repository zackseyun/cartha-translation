base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/011.yaml
  text: Hiram king of Tyre had supplied Solomon with cedar timber[a], cypress timber, and gold, according to all his desire; then King Solomon gave Hiram twenty cities in the land of Galilee.
translation:
  language: de
  text: Hiram, der König von Tyrus, hatte Salomo mit Zedernholz, Zypressenholz[a] und Gold versorgt, mit allem, was er sich wünschte. Da gab König Salomo Hiram zwanzig Städte im Land Galiläa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Wacholderholz, Tannenholz oder anderes Nadelholz; welche Baumart das hebräische Wort berosch genau bezeichnet, ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשָּׂא
  choice: hatte … versorgt
  rationale: Das Verb bedeutet gewöhnlich »heben, tragen«, bezeichnet in dieser Konstruktion mit einer Person als Objekt und den mit ב eingeführten Materialien aber kontextuell das Versorgen mit Rohstoffen. Das Plusquamperfekt kennzeichnet den Satz als Hintergrund für Salomos anschließende Gabe.
- source_word: בַּעֲצֵי אֲרָזִים
  choice: mit Zedernholz
  rationale: עֵץ mit einer Baumart bezeichnet hier im Baukontext das Holz als Material, nicht lebende Bäume.
- source_word: וּבַעֲצֵי בְרוֹשִׁים
  choice: Zypressenholz[a]
  rationale: Die genaue Baumart von בְּרוֹשׁ ist unsicher. »Zypresse« ist eine verbreitete und im Zusammenhang mit Bauholz plausible Wiedergabe; die Unsicherheit wird in einer Fußnote bewahrt.
- source_word: וּבַזָּהָב
  choice: und Gold
  rationale: Direkte Wiedergabe der Materialbezeichnung ohne erläuternden Zusatz.
- source_word: לְכָל חֶפְצוֹ
  choice: ganz nach dessen Wunsch
  rationale: חֵפֶץ bezeichnet Wunsch, Verlangen oder Gefallen. »Dessen« macht im Deutschen deutlich, dass sich das Suffix auf Salomo bezieht, wie es der Kontext nahelegt, ohne den Umfang abzuschwächen.
- source_word: אָז
  choice: Damals
  rationale: Der Ausdruck markiert den zeitlichen beziehungsweise folgerichtigen Übergang zur Haupthandlung. »Damals« wahrt den Zeitbezug natürlich.
- source_word: יִתֵּן
  choice: gab
  rationale: Obwohl formal Imperfekt, bezeichnet die Verbform nach אָז hier ein vergangenes Erzählereignis.
- source_word: עֶשְׂרִים עִיר
  choice: zwanzig Städte
  rationale: עִיר kann Stadt oder Ortschaft bedeuten; »Städte« entspricht dem politischen Zusammenhang und der üblichen deutschen Wiedergabe.
- source_word: בְּאֶרֶץ הַגָּלִיל
  choice: im Land Galiläa
  rationale: אֶרֶץ bezeichnet Land oder Gebiet. »Im Land Galiläa« bildet die hebräische Wendung transparent und idiomatisch ab.
- source_word: חִירָם ... שְׁלֹמֹה ... צֹר ... הַגָּלִיל
  choice: Hiram … Salomo … Tyrus … Galiläa
  rationale: Verwendet werden die im modernen deutschen Bibelgebrauch etablierten Namensformen.
