review_pass:
  verdict: revise
  source_fidelity: Die Grundstruktur und die zentralen Begriffe sind zutreffend wiedergegeben. Das zweite „wenn“ vor „du alles tust“ legt jedoch eine zusätzliche, im Hebräischen nicht eigenständig markierte Bedingung nahe. Der Infinitiv לַעֲשׂוֹת beschreibt vielmehr das Tun im Rahmen des Wandels. „Ungeteiltem Herzen“ ist als Deutung möglich, betont aber stärker ausschließliche Loyalität als das hier gemeinte תָּם, das vor allem Unversehrtheit bzw. Lauterkeit/Integrität bezeichnet.
  naturalness: Der Satz ist insgesamt würdig und gut verständlich. Ohne das zweite „wenn“ ist die Reihung der Bedingungen im Deutschen klarer und näher am Ausgangstext. „Mit lauterem Herzen“ ist in diesem leicht gehobenen biblischen Register idiomatisch.
  terminology: „Satzungen“ und „Rechtsbestimmungen“ bewahren sinnvoll die Unterscheidung von חֻקַּי und מִשְׁפָּטַי. „Lauterem Herzen“ und „Aufrichtigkeit“ geben die beiden ethischen Ausdrücke unterscheidbar wieder, ohne Sündlosigkeit zu behaupten.
