base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/004.yaml
  text: And as for you[a], if you walk before me as David your father walked, with integrity of heart and with uprightness, doing according to all that I have commanded you, and if you keep my statutes and my judgments[b],
translation:
  language: de
  text: 'Und du: Wenn du vor mir lebst, wie dein Vater David vor mir gelebt hat, mit lauterem Herzen[a] und in Aufrichtigkeit, alles tust, was ich dir geboten habe, und meine Satzungen und Rechtsbestimmungen[b] hältst,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit ungeteiltem Herzen«. Das hebräische Wort bezeichnet Ganzheit und Integrität, nicht notwendig absolute Sündlosigkeit.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »meine Ordnungen und Rechtssätze«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: 'Und du:'
  rationale: Hebt den Wechsel zur direkten, nachdrücklichen Anrede knapp und natürlich hervor.
- source_word: אִם
  choice: Wenn
  rationale: Gibt die einfache Bedingung unverstärkt wieder.
- source_word: תֵּלֵךְ לְפָנַי
  choice: du vor mir lebst
  rationale: Überträgt das hebräische Bild des Gehens als Lebensführung in verständliches modernes Deutsch und bewahrt zugleich das Leben in Gottes Gegenwart als Bezugspunkt.
- source_word: כַּאֲשֶׁר הָלַךְ דָּוִד אָבִיךָ
  choice: wie dein Vater David vor mir gelebt hat
  rationale: Bewahrt den Vergleich mit Davids Lebensführung; die Wiederholung „vor mir“ verdeutlicht im Deutschen den im Hebräischen mitgedachten Bezug.
- source_word: בְּתָם לֵבָב
  choice: mit ungeteiltem Herzen
  rationale: תָּם bezeichnet hier Ganzheit und Integrität; „ungeteilt“ vermittelt loyale innere Ausrichtung, ohne absolute Sündlosigkeit zu behaupten.
- source_word: וּבְיֹשֶׁר
  choice: und in Aufrichtigkeit
  rationale: Gibt die moralische Geradheit des Ausdrucks würdig und in modernem Deutsch wieder.
- source_word: לַעֲשׂוֹת כְּכֹל אֲשֶׁר צִוִּיתִיךָ
  choice: wenn du alles tust, was ich dir geboten habe
  rationale: Macht den handlungsbezogenen Sinn des Infinitivs und die umfassende Kraft von כְּכֹל natürlich deutlich.
- source_word: חֻקַּי
  choice: meine Satzungen
  rationale: Bewahrt den rechtlich-bundestheologischen Sinn sowie die begriffliche Unterscheidung vom folgenden מִשְׁפָּטַי.
- source_word: וּמִשְׁפָּטַי
  choice: und Rechtsbestimmungen
  rationale: Vermittelt den rechtlichen Gehalt von מִשְׁפָּטִים verständlicher als das im Deutschen missverständliche „Gerichte“.
- source_word: תִּשְׁמֹר
  choice: hältst
  rationale: 'Entspricht dem üblichen bundessprachlichen Sinn von שׁמר: Gebote beachten und befolgen.'
theological_decisions:
- issue: Davids Vorbildfunktion
  choice: „mit ungeteiltem Herzen und in Aufrichtigkeit“
  alternative: „mit vollkommenem/untadeligem Herzen“
  rationale: David wird als Vorbild loyaler Hingabe dargestellt, ohne dass der Vers damit völlige moralische Fehlerlosigkeit behauptet. Die Übersetzung erhält das Lob und zugleich die theologische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das traditionelle, heute altertümliche „vor mir wandeln“ wird sinngemäß mit „vor mir leben“ wiedergegeben. Der Satz bleibt als Bedingungssatz offen, da er in Vers 5 fortgeführt wird.
