    rationale: Die Formulierung ist nicht unvertretbar, kann aber spezifisch den Gegensatz geteilter Loyalität hervorrufen. „Lauterem Herzen“ gibt die Ganzheit und Integrität von תָּם unmittelbarer wieder und bleibt vom folgenden Begriff der Aufrichtigkeit unterscheidbar.
