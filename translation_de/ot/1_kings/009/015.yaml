source:
  edition: WLC
  text: וְ/זֶ֨ה דְבַר הַ/מַּ֜ס אֲשֶֽׁר הֶעֱלָ֣ה הַ/מֶּ֣לֶךְ שְׁלֹמֹ֗ה לִ/בְנוֹת֩ אֶת בֵּ֨ית יְהוָ֤ה וְ/אֶת בֵּית/וֹ֙ וְ/אֶת הַ/מִּלּ֔וֹא וְ/אֵ֖ת חוֹמַ֣ת יְרוּשָׁלִָ֑ם וְ/אֶת חָצֹ֥ר וְ/אֶת מְגִדּ֖וֹ וְ/אֶת גָּֽזֶר־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/015.yaml
  text: This is the account of the forced labor that King Solomon levied to build the house of Yahweh[a], his own house, the Millo, the wall of Jerusalem, Hazor, Megiddo[b], and Gezer.
translation:
  language: de
  text: Dies ist der Bericht über den Frondienst[a], den König Salomo auferlegte, um das Haus Jahwes, sein eigenes Haus, den Millo[b], die Mauer Jerusalems, Hazor, Megiddo und Geser zu bauen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Frondienst“ bezeichnet hier eine vom König auferlegte staatliche Arbeitspflicht, nicht eine Geldsteuer.
    reason: lexical_alternative
  - marker: b
    text: Der „Millo“ war vermutlich eine bekannte Befestigungs-, Aufschüttungs- oder Terrassenanlage in Jerusalem; die genaue Art des Bauwerks ist unsicher.
    reason: cultural_note
lexical_decisions:
- source_word: דְבַר הַמַּס
  choice: die Sache mit dem Frondienst
  rationale: דָּבָר bezeichnet hier die Angelegenheit bzw. den Sachverhalt der Arbeitsverpflichtung. Die deutsche Wendung ist natürlicher als „der Bericht über“ und bewahrt die administrative Aussage.
- source_word: הַמַּס
  choice: Frondienst
  rationale: מַס meint im Zusammenhang königlicher Bauvorhaben verpflichtende staatliche Arbeitsleistung, nicht eine Geldsteuer.
- source_word: הֶעֱלָה
  choice: auferlegte
  rationale: Der Hifil von עלה bezeichnet hier das Erheben bzw. Auferlegen der Arbeitsverpflichtung.
- source_word: לִבְנוֹת
  choice: um ... zu bauen
  rationale: Der Infinitiv drückt den Zweck der auferlegten Arbeitsleistung aus.
- source_word: בֵּית יְהוָה
  choice: das Haus Jahwes
  rationale: „Haus“ bildet בַּיִת unmittelbar ab; „Jahwe“ gibt den im Text stehenden Gottesnamen wieder.
- source_word: בֵּיתוֹ
  choice: sein eigenes Haus
  rationale: „Eigenes“ verdeutlicht idiomatisch den Kontrast zwischen Jahwes Haus und Salomos Haus, ohne „Palast“ interpretierend in den Haupttext einzutragen.
- source_word: הַמִּלּוֹא
  choice: den Millo
  rationale: Der bestimmte architektonische bzw. topografische Ausdruck bleibt transliteriert, da seine genaue Gestalt unsicher ist.
- source_word: חוֹמַת יְרוּשָׁלִָם
  choice: die Mauer Jerusalems
  rationale: Direkte und natürliche Wiedergabe der hebräischen Genitivverbindung.
- source_word: חָצֹר / מְגִדּוֹ / גָּזֶר
  choice: Hazor / Megiddo / Geser
  rationale: Gebräuchliche deutsche Schreibweisen der drei Ortsnamen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Gottesnamen wieder, während „der HERR“ die traditionelle Lesersubstitution wäre.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt der aufzählenden Anlage des Hebräischen, bleibt aber gut lesbar. „Frondienst“ ist prägnant und im Deutschen verständlich; die Fußnote schränkt mögliche feudale Nebenassoziationen ein.
