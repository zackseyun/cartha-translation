lexical_decisions:
- source_word: בָּאֳנִי
  choice: auf dem Schiff
  rationale: Die Präposition ב kann hier idiomatisch die Beförderung bzw. den Ort an Bord bezeichnen; im Deutschen ist „auf dem Schiff“ natürlich.
- source_word: אַנְשֵׁי אֳנִיּוֹת
  choice: Seeleute
  rationale: Wörtlich „Männer von Schiffen“; die geläufige deutsche Berufs- und Gruppenbezeichnung gibt den Sinn knapp und verständlich wieder.
- source_word: יֹדְעֵי הַיָּם
  choice: die sich auf dem Meer auskannten
  rationale: יודעי bezeichnet hier praktische Kenntnis oder Erfahrung. Die Formulierung bewahrt den Bezug zum Meer, ohne eine besondere Amtsbezeichnung einzutragen.
