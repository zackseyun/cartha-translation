base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/028.yaml
  text: They went to Ophir and took from there four hundred and twenty talents of gold[a], and brought it to King Solomon.
translation:
  language: de
  text: Sie kamen nach Ofir und nahmen von dort vierhundertzwanzig Talente Gold[a] und brachten es zu König Salomo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Talent war eine antike Gewichtseinheit; sein genaues Gewicht schwankte. Vierhundertzwanzig Talente entsprachen ungefähr 13 Tonnen.
    reason: historical_measure
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Sie kamen
  rationale: Das hebräische בוא bedeutet grundsätzlich »kommen/eintreffen«. Im Deutschen ist »nach Ofir kommen« natürlich und bewahrt die Perspektive des hebräischen Textes; je nach angenommener Erzählperspektive ist auch »sie fuhren« möglich.
- source_word: אוֹפִירָה
  choice: nach Ofir
  rationale: Der Ortsname trägt ein Richtungs-He und bezeichnet daher eine Bewegung nach Ofir.
- source_word: וַיִּקְחוּ מִשָּׁם
  choice: holten von dort
  rationale: לקח mit מִשָּׁם bezeichnet hier das Aufnehmen beziehungsweise Beschaffen des Goldes an diesem Ort. »Holten« verbindet dies im Deutschen natürlich mit dem anschließenden Transport zu Salomo.
- source_word: זָהָב
  choice: Gold
  rationale: Die übliche und kontextuell eindeutige Wiedergabe.
- source_word: אַרְבַּע מֵאוֹת וְעֶשְׂרִים כִּכָּר
  choice: vierhundertzwanzig Talente
  rationale: Die genaue Zahl bleibt erhalten; »Talent« ist die geläufige Bezeichnung für die antike Gewichtseinheit כִּכָּר.
- source_word: וַיָּבִאוּ
  choice: brachten
  rationale: Der Hifil von בוא bedeutet hier »bringen« und beschreibt die Übergabe beziehungsweise Beförderung des Goldes zu Salomo.
- source_word: אֶל הַמֶּלֶךְ שְׁלֹמֹה
  choice: zu König Salomo
  rationale: Natürliche moderne deutsche Wortstellung für Titel und Eigenname.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller Erzählstil. »Sie kamen nach Ofir« folgt dem Grundsinn des hebräischen Bewegungsverbs, während »holten von dort« den Zusammenhang von Entnahme und Rücktransport idiomatisch ausdrückt.
