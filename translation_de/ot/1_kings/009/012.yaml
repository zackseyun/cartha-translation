  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Abfolge und die zentralen Bedeutungen des Hebräischen zutreffend wieder: Hiram verlässt Tyrus, sieht die von Salomo gegebenen Städte an, und sie finden nicht seine Zustimmung. Das Plusquamperfekt bei „gegeben hatte“ ist kontextgerecht. Die idiomatische Wiedergabe von וְלֹא יָשְׁרוּ בְּעֵינָיו mit „gefielen ihm nicht“ ist sachlich passend und vermeidet eine unnötige moralische Engführung.'
  naturalness: „Zog … aus Tyrus hinaus“ ist im modernen Standarddeutsch wegen der doppelten Richtungsmarkierung („aus“ und „hinaus“) schwerfällig. „Zog aus Tyrus fort“ bewahrt die Bewegung vom Ausgangsort weg und klingt natürlicher. „Da“ ist in diesem narrativen Kontext eine unmarkierte, moderne Entsprechung des hebräischen Erzählanschlusses.
  terminology: Die Namensformen „Hiram“, „Tyrus“ und „Salomo“ sind im deutschen biblischen Register etabliert. „Städte“ ist für עָרִים angemessen. Die Fußnote erhält die hebräische Bildsprache transparent, ohne ihre Aussage über die fehlende Billigung zu überdehnen.
