base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/012.yaml
  text: So Hiram went out from Tyre to see the cities that Solomon had given him[a], but they were not pleasing in his eyes.
translation:
  language: de
  text: Da zog Hiram aus Tyrus fort, um die Städte anzusehen, die Salomo ihm gegeben hatte. Doch sie gefielen ihm nicht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Doch sie waren in seinen Augen nicht recht.“ Gemeint ist: Sie fanden nicht seine Zustimmung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: zog … hinaus
  rationale: Das Verb יצא bezeichnet hier im fortlaufenden Erzählzusammenhang das Hinausgehen beziehungsweise Aufbrechen; die Formulierung bewahrt die Richtung von Tyrus weg.
- source_word: מִצֹּר
  choice: aus Tyrus
  rationale: Die Präposition מן kennzeichnet den Ausgangspunkt. „Aus Tyrus“ gibt diesen örtlichen Ursprung im Deutschen natürlich wieder.
- source_word: לִרְאוֹת
  choice: um … anzusehen
  rationale: ראה bedeutet grundsätzlich „sehen“. „Ansehen“ lässt im Kontext eine Besichtigung mitschwingen, ohne die stärkere Deutung „inspizieren“ festzuschreiben.
- source_word: הֶעָרִים
  choice: die Städte
  rationale: עיר kann Stadt oder Ortschaft bezeichnen; „Städte“ ist hier die übliche und kontextgerechte Wiedergabe.
- source_word: אֲשֶׁר נָתַן לוֹ שְׁלֹמֹה
  choice: die Salomo ihm gegeben hatte
  rationale: Das Plusquamperfekt macht im Deutschen natürlich deutlich, dass die Übergabe der Besichtigung vorausging.
- source_word: וְלֹא יָשְׁרוּ בְּעֵינָיו
  choice: Doch sie gefielen ihm nicht
  rationale: Die Wendung ישר בעיני bezeichnet, was im Urteil eines Menschen recht, passend oder annehmbar ist. Die idiomatische deutsche Wiedergabe vermeidet hier den möglicherweise moralischen Beiklang von „nicht recht in seinen Augen“; die wörtlichere Bildsprache bleibt in der Fußnote sichtbar.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Zog … hinaus“ bewahrt die räumliche Bewegung des Hebräischen; „anzusehen“ bleibt näher am einfachen ראה als das stärker deutende „zu besichtigen“. Der hebräische Ausdruck am Versende wird im Haupttext natürlich wiedergegeben und in der Fußnote transparent gemacht.
