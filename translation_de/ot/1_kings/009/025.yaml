reference: 1 Kings 9:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הֶעֱלָ֣ה שְׁלֹמֹ֡ה שָׁלֹשׁ֩ פְּעָמִ֨ים בַּ/שָּׁנָ֜ה עֹל֣וֹת וּ/שְׁלָמִ֗ים עַל הַ/מִּזְבֵּ֨חַ֙ אֲשֶׁ֣ר בָּנָ֣ה לַ/יהוָ֔ה וְ/הַקְטֵ֣יר אִתּ֔/וֹ אֲשֶׁ֖ר לִ/פְנֵ֣י יְהוָ֑ה וְ/שִׁלַּ֖ם אֶת הַ/בָּֽיִת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/025.yaml
  text: And Solomon offered up burnt offerings and peace offerings on the altar that he had built for Yahweh three times a year[a], and he burned incense with it before Yahweh[b]. Thus he completed the house.
translation:
  language: de
  text: Dreimal im Jahr brachte Salomo auf dem Altar, den er für Jahwe gebaut hatte, Brandopfer und Heilsopfer dar. Außerdem verbrannte er dort vor Jahwe Räucherwerk[a]. Damit vollendete er das Haus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ließ dort Opferrauch aufsteigen“. Das hebräische Verb kann allgemein das Verbrennen einer Opfergabe bezeichnen und muss nicht ausschließlich auf Räucherwerk bezogen sein.'
    reason: lexical_alternative
  - marker: b
    text: Mit dem „Haus“ ist der Tempel gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱלָה
  choice: brachte … dar
  rationale: Die Hifil-Form von עלה bezeichnet im Opferkontext das Darbringen eines Opfers. Die deutsche Wendung ist sachlich genau und lässt offen, ob Salomo die Handlung eigenhändig vollzog oder als König veranlasste.
- source_word: עֹלוֹת
  choice: Brandopfer
  rationale: Etablierte deutsche Bezeichnung für ein Opfer, das vollständig auf dem Altar verbrannt wurde.
- source_word: שְׁלָמִים
  choice: Heilsopfer
  rationale: Der Ausdruck bezeichnet Gemeinschafts- beziehungsweise Wohlergehensopfer. „Heilsopfer“ ist im Deutschen eine gebräuchliche kultische Bezeichnung, ohne die Bedeutung auf bloßen inneren Frieden zu verengen.
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: dreimal im Jahr
  rationale: Natürliche und genaue Wiedergabe der hebräischen Zeitangabe.
- source_word: עַל הַמִּזְבֵּחַ אֲשֶׁר בָּנָה לַיהוָה
  choice: auf dem Altar, den er für Jahwe gebaut hatte
  rationale: Die relative Konstruktion wird direkt wiedergegeben; das Plusquamperfekt macht im Deutschen die zeitliche Vorordnung des Altarbaus deutlich.
- source_word: וְהַקְטֵיר
  choice: verbrannte … Räucherwerk
  rationale: קטר im Hifil kann das Erzeugen von Opferrauch und insbesondere das Verbrennen von Räucherwerk bezeichnen. Die Hauptfassung folgt hier der naheliegenden kultischen Bedeutung; die weitere Bedeutung wird in einer Fußnote bewahrt.
- source_word: אִתּוֹ אֲשֶׁר לִפְנֵי יְהוָה
  choice: dort vor Jahwe
  rationale: Die schwierige Verbindung wird idiomatisch auf den zuvor genannten Altar beziehungsweise den Kultort bezogen. „Dort“ vermeidet das im Deutschen missverständliche „mit ihm“ und legt die genaue räumliche Beziehung nicht unnötig fest.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְשִׁלַּם אֶת הַבָּיִת
  choice: Damit vollendete er das Haus
  rationale: Das Piel von שלם bedeutet hier „vollenden“ oder „fertigstellen“. „Haus“ bewahrt die Ausdrucksweise des Hebräischen; der Kontext bezeichnet den Tempel.
theological_decisions:
- issue: Art von Salomos Beteiligung an den Opferhandlungen
  choice: Die Handlungen werden entsprechend der hebräischen Oberfläche Salomo zugeschrieben, ohne festzulegen, ob er sie eigenhändig ausführte oder in königlicher Funktion veranlasste.
  alternative: Ausdrücklich formulieren, dass Salomo selbst opferte, oder ausdrücklich ergänzen, dass Priester es in seinem Auftrag taten.
  rationale: Die erzählerische Zuschreibung an den König kann persönliche Ausführung, Veranlassung oder königliche Trägerschaft bezeichnen. Die Übersetzung soll diese Spannung nicht durch eine konfessionelle oder harmonisierende Ergänzung auflösen.
- issue: Bedeutung von וְהַקְטֵיר
  choice: Im Haupttext als Verbrennen von Räucherwerk verstanden, mit der breiteren Opferrauch-Bedeutung in der Fußnote.
  alternative: „Er ließ dort Opferrauch aufsteigen.“
  rationale: Der Tempelkontext stützt die spezifische Deutung als Räucherwerk, doch der hebräische Ausdruck kann weiter gefasst sein. Die Fußnote erhält diese echte lexikalische Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit geläufiger biblischer Kultsprache. Die Satzteilung erleichtert das Verständnis, ohne den Gedankengang zu verändern. Der Gottesname wird als „Jahwe“ wiedergegeben; schwierige oder mehrdeutige Einzelheiten werden nicht dogmatisch vereindeutigt.
