source:
  edition: WLC
  text: וַ/יֵּרָ֧א יְהוָ֛ה אֶל שְׁלֹמֹ֖ה שֵׁנִ֑ית כַּ/אֲשֶׁ֛ר נִרְאָ֥ה אֵלָ֖י/ו בְּ/גִבְעֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/002.yaml
  text: Then Yahweh appeared to Solomon a second time[a], as he had appeared to him at Gibeon.
translation:
  language: de
  text: Da erschien Jahwe Salomo ein zweites Mal[a], wie er ihm in Gibeon erschienen war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wieder“; wörtlich: „ein zweites Mal“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: Da erschien
  rationale: Das Nifal von ראה bezeichnet hier eine Erscheinung Jahwes. „Da erschien“ gibt zugleich den erzählenden Anschluss von וַ wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Umschrift.
- source_word: שֵׁנִית
  choice: ein zweites Mal
  rationale: Die Form bezeichnet ausdrücklich das zweite Auftreten; diese Wiedergabe bewahrt die Reihenfolge deutlicher als nur „wieder“.
- source_word: כַּאֲשֶׁר
  choice: wie
  rationale: Die Konjunktion stellt einen Vergleich mit der früheren Erscheinung in Gibeon her.
- source_word: נִרְאָה
  choice: erschienen war
  rationale: Das deutsche Plusquamperfekt kennzeichnet die Erscheinung in Gibeon als das gegenüber dem Hauptereignis frühere Geschehen.
- source_word: אֵלָיו
  choice: ihm
  rationale: Der Dativ gibt die relationale Bedeutung von אֶל mit Suffix im Deutschen natürlich wieder.
- source_word: בְּגִבְעוֹן
  choice: in Gibeon
  rationale: Die Präposition בְּ bezeichnet den Ort der früheren Erscheinung; bei einer Ortschaft ist „in Gibeon“ im Deutschen idiomatisch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova
  rationale: Der hebräische Text verwendet das Tetragramm als Gottes persönlichen Namen. „Jahwe“ bewahrt den Namenscharakter und entspricht der heute üblichen deutschen Umschrift, ohne ihn durch „der HERR“ zu ersetzen.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Der knappe Erzählstil und der Vergleich mit der früheren Erscheinung bleiben erhalten.
