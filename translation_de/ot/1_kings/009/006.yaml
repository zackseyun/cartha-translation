  text: אִם שׁ֨וֹב תְּשֻׁב֜וּ/ן אַתֶּ֤ם וּ/בְנֵי/כֶם֙ מֵֽ/אַחֲרַ֔/י וְ/לֹ֤א תִשְׁמְרוּ֙ מִצְוֺתַ֣/י חֻקֹּתַ֔/י אֲשֶׁ֥ר נָתַ֖תִּי לִ/פְנֵי/כֶ֑ם וַ/הֲלַכְתֶּ֗ם וַ/עֲבַדְתֶּם֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וְ/הִשְׁתַּחֲוִיתֶ֖ם לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/006.yaml
  text: But if you or your sons turn away from following me[a], and do not keep my commandments and my statutes that I have set before you, and go and serve other gods and bow down to them,
translation:
  language: de
  text: Wenn aber ihr oder eure Söhne wirklich von mir abfallt[a], meine Gebote und meine Ordnungen, die ich euch vorgelegt habe, nicht haltet und hingeht, anderen Göttern dient und euch vor ihnen niederwerft,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihr und eure Söhne“. Das Hebräische kann Salomo gemeinsam mit seinen Nachkommen anreden; der Haupttext hebt hervor, dass die Warnung sowohl für Salomo als auch für seine königliche Linie gilt.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: wenn aber
  rationale: אִם leitet die Bedingung ein; „aber“ stellt im Deutschen den warnenden Gegensatz zum vorausgehenden Zusammenhang natürlich heraus.
- source_word: שׁוֹב תְּשֻׁבוּן
  choice: euch wirklich … abwendet
  rationale: Infinitivus absolutus und finites Verb verstärken gemeinsam die Aussage. Zusammen mit מֵאַחֲרַי bezeichnet die Wendung den entschiedenen Abfall davon, dem HERRN zu folgen.
- source_word: אַתֶּם וּבְנֵיכֶם
  choice: ihr oder eure Söhne
  rationale: Im königlich-dynastischen Zusammenhang sind Salomo und seine männlichen Nachkommen gemeint. „Oder“ bringt die bedingte Geltung für Salomo wie auch für seine Königslinie zum Ausdruck; die wörtliche Alternative wird in der Fußnote bewahrt.
- source_word: מֵאַחֲרַי
  choice: von mir
  rationale: Im Zusammenhang mit „sich abwenden“ gibt dies die hebräische Wendung für das Aufhören der Nachfolge idiomatisch wieder, ohne den Bundesbezug aufzulösen.
- source_word: וְלֹא תִשְׁמְרוּ
  choice: nicht haltet
  rationale: שׁמר bezeichnet bei Geboten deren Einhaltung oder Befolgung; „halten“ ist die geläufige deutsche Bundes- und Rechtssprache.
- source_word: מִצְוֺתַי חֻקֹּתַי
  choice: meine Gebote und meine Ordnungen
  rationale: Die beiden unterschiedlichen Rechtsbegriffe bleiben unterschieden. „Ordnungen“ ist für חֻקּוֹת verständlich, würdig und im biblischen Rechtskontext passend.
- source_word: אֲשֶׁר נָתַתִּי לִפְנֵיכֶם
  choice: die ich euch vorgelegt habe
  rationale: נתן mit לִפְנֵי bedeutet hier idiomatisch, Verpflichtungen jemandem vorzulegen beziehungsweise vor Augen zu stellen.
- source_word: וַהֲלַכְתֶּם
  choice: sondern hingeht
  rationale: הלך leitet die folgenden Handlungen des Götzendienstes ein. „Hingehen“ bewahrt die Bewegungsvorstellung; „sondern“ macht den sachlichen Gegensatz zur Gebotstreue im Deutschen deutlich.
- source_word: וַעֲבַדְתֶּם אֱלֹהִים אֲחֵרִים
  choice: anderen Göttern dient
  rationale: עבד bedeutet „dienen“ und bleibt so von der folgenden körperlichen Huldigung unterschieden.
- source_word: וְהִשְׁתַּחֲוִיתֶם לָהֶם
  choice: euch vor ihnen niederwerft
  rationale: Die Wiedergabe erhält das konkrete Bild des Sich-Niederwerfens und reduziert beide Formen des Götzendienstes nicht auf das allgemeine „anbeten“.
theological_decisions:
- issue: Dynastische Reichweite der Warnung
  choice: 'Die Warnung gilt Salomo oder seinen königlichen Nachkommen: „ihr oder eure Söhne“.'
  alternative: „ihr und eure Söhne“; weiter gefasst auch „ihr und eure Kinder“.
  rationale: Der unmittelbare Zusammenhang betrifft Salomo, das davidische Königshaus und den Tempel. בְּנֵיכֶם bezeichnet hier daher am ehesten die dynastischen Söhne beziehungsweise Nachkommen. Die koordinierende Form des Hebräischen bleibt als Alternative in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer konditionaler Satzführung. Die Rechtsbegriffe und die zwei verschiedenen Handlungen des Götzendienstes bleiben voneinander unterschieden; der Vers endet entsprechend dem fortlaufenden Satz mit einem Komma.
