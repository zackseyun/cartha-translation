revisions:
- from: Wenn aber ihr oder eure Söhne euch wirklich von mir abwendet[a], meine Gebote und meine Ordnungen, die ich euch vorgelegt habe, nicht haltet, sondern hingeht, anderen Göttern dient und euch vor ihnen niederwerft,
  to: Wenn aber ihr oder eure Söhne wirklich von mir abfallt[a], meine Gebote und meine Ordnungen, die ich euch vorgelegt habe, nicht haltet und hingeht, anderen Göttern dient und euch vor ihnen niederwerft,
  rationale: Die Revision behebt den grammatisch widersprüchlichen Reflexivbezug, ohne die im englischen Audit belegte Auslegung „ihr oder eure Söhne“ aufzugeben. „Von mir abfallen“ gibt im modernen, würdigen Deutsch den im Kontext gemeinten Abfall vom Folgen Gottes wieder. Die Reihung mit „und“ folgt der hebräischen Syntax enger als „sondern“; Bedeutung, Register, Fußnotenanker und Satzabschluss als fortlaufender Konditionalsatz bleiben erhalten.
