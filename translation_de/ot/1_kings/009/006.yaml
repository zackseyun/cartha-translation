  verdict: revise
  source_fidelity: 'Die zentralen Elemente sind zutreffend wiedergegeben: die verstärkte Abwendung von JHWH, das Nichtbefolgen von Geboten und Ordnungen sowie die getrennten Handlungen des Dienens und Niederwerfens vor anderen Göttern. Die interpretative Wiedergabe von אַתֶּם וּבְנֵיכֶם als „ihr oder eure Söhne“ wird durch die Fußnote transparent gemacht. Allerdings erzeugt die reflexive Konstruktion „ihr oder eure Söhne euch ... abwendet“ einen grammatischen Bezugskonflikt, weil „euch“ nicht zu „eure Söhne“ passt.'
  naturalness: Der Satz ist insgesamt würdig und verständlich, aber die Kombination aus disjunktivem Subjekt und reflexivem Pronomen ist im Deutschen nicht idiomatisch. „Von mir abfallen“ vermeidet diesen Konflikt und gibt den apostatischen Sinn von שׁוֹב תְּשֻׁבוּן מֵאַחֲרַי natürlich wieder. Das nicht im Hebräischen ausgedrückte kontrastierende „sondern“ sollte durch die einfache Reihung mit „und“ ersetzt werden.
  terminology: „Gebote“, „Ordnungen“, „dienen“ und „sich vor ihnen niederwerfen“ sind angemessen und unterscheiden die hebräischen Rechts- bzw. Kultbegriffe sinnvoll. „Vorlegen“ ist für נָתַתִּי לִפְנֵיכֶם vertretbar. Die Fußnote bewahrt die wörtlich koordinierende Alternative „ihr und eure Söhne“ und bleibt am Anker [a] korrekt verknüpft.
