base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/001.yaml
  text: And it happened[a], when Solomon had finished building the house of Yahweh and the king’s house, and all that Solomon desired to make,
translation:
  language: de
  text: Und als Salomo damit fertig war, das Haus Jahwes und das Haus des Königs zu bauen und alles auszuführen, was er zu tun wünschte,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „und den ganzen Wunsch Salomos, den er auszuführen wünschte“; auch möglich: „und jedes Vorhaben, das Salomo auszuführen wünschte“.'
    reason: Die ungewöhnliche Verbindung von חֵשֶׁק („Wunsch, Begehren; das Gewünschte“) und חָפֵץ („wünschen, Gefallen haben“) lässt sowohl eine abstrakte als auch eine auf Vorhaben bezogene Wiedergabe zu.
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת
  choice: Und als ... vollendet ... hatte
  rationale: Die Erzählungsform וַיְהִי eröffnet zusammen mit כְּ plus Infinitiv eine zeitliche Einleitung. Im Deutschen gibt eine Als-Konstruktion mit Plusquamperfekt den Ablauf natürlich wieder; ein gesondertes „es geschah“ wäre schwerfällig.
- source_word: לִבְנוֹת
  choice: den Bau ... vollendet
  rationale: Nach כלה bezeichnet der Infinitiv das abgeschlossene Bauen. Die nominale deutsche Fügung ist idiomatisch und bewahrt den Vorgangssinn.
- source_word: בֵּית יְהוָה
  choice: das Haus Jahwes
  rationale: „Haus“ erhält die konkrete hebräische Bezeichnung und die Parallele zum Königshaus; „Tempel“ wäre eine zutreffende, aber stärker deutende Wiedergabe.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben. Die im Deutschen übliche Form „Jahwe“ entspricht dem hebräischen Tetragramm.
- source_word: בֵּית הַמֶּלֶךְ
  choice: das Königshaus
  rationale: Die kompakte deutsche Form bezeichnet hier den königlichen Palast und hält zugleich die Wiederholung von בֵּית erkennbar.
- source_word: כָּל חֵשֶׁק שְׁלֹמֹה אֲשֶׁר חָפֵץ לַעֲשׂוֹת
  choice: alles verwirklicht hatte, was er zu tun wünschte
  rationale: חֵשֶׁק kann den Wunsch oder das Gewünschte bezeichnen. In Verbindung mit der Relativkonstruktion ist „alles ..., was“ natürlich; „verwirklicht“ macht verständlich, dass die gewünschten Vorhaben ausgeführt wurden, ohne sie auf Bauprojekte zu beschränken.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen. „Jahwe“ bewahrt diesen, während „der HERR“ die traditionelle Ersatzlesung wiedergibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers bleibt wie im Hebräischen ein einleitender, syntaktisch noch nicht abgeschlossener Temporalsatz, der in Vers 2 fortgeführt wird.
