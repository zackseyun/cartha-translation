lexical_decisions:
- source_word: וַיִּבֶן
  choice: baute
  rationale: Das Verb בנה im Qal bedeutet gewöhnlich „bauen“. Im Zusammenhang königlicher Bauvorhaben kann auch Wiederaufbau oder Befestigung mitgemeint sein; der Haupttext bewahrt jedoch den einfachen lexikalischen Sinn.
- source_word: שְׁלֹמֹה
  choice: Salomo
  rationale: Die im Deutschen etablierte Form des Personennamens.
- source_word: גָּזֶר
  choice: Geser
  rationale: Die im Deutschen etablierte Wiedergabe des Ortsnamens.
- source_word: בֵּית חֹרֹן תַּחְתּוֹן
  choice: Unter-Bet-Horon
  rationale: תַּחְתּוֹן unterscheidet diesen Ort vom oberen Bet-Horon. „Unter-Bet-Horon“ ist eine geläufige, knappe deutsche Ortsbezeichnung und wahrt die geografische Unterscheidung.
- source_word: אֶת / וְאֶת
  choice: nicht gesondert wiedergegeben
  rationale: Die direkten Objektmarker haben im Deutschen keine eigene lexikalische Entsprechung; ihre Funktion wird durch die Satzstruktur ausgedrückt.
