  text: And Solomon built Gezer and Lower Beth-horon,[a]
translation:
  language: de
  text: Und Salomo baute Geser und Unter-Bet-Horon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bet-Horon, das untere“.'
