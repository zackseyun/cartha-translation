  text: אַ֣ךְ בַּת פַּרְעֹ֗ה עָֽלְתָה֙ מֵ/עִ֣יר דָּוִ֔ד אֶל בֵּיתָ֖/הּ אֲשֶׁ֣ר בָּֽנָה לָ֑/הּ אָ֖ז בָּנָ֥ה אֶת הַ/מִּלּֽוֹא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/024.yaml
  text: But Pharaoh’s daughter went up from the City of David to her house that he had built for her[a]; then he built the Millo.
translation:
  language: de
  text: Doch die Tochter des Pharaos zog aus der Stadt Davids hinauf in ihr Haus, das er für sie gebaut hatte. Danach baute er den Millo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „die Aufschüttung“ oder „die Terrassenanlage“. Das hebräische Wort Millo bezeichnet wahrscheinlich eine Befestigungsanlage oder eine stützende Aufschüttungs- beziehungsweise Terrassenkonstruktion.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Doch
  rationale: Die Partikel kennzeichnet hier einen Übergang beziehungsweise eine Einschränkung im Erzählzusammenhang. „Doch“ gibt diese leicht adversative Funktion natürlich wieder.
- source_word: בַּת פַּרְעֹה
  choice: die Tochter des Pharaos
  rationale: Die hebräische Status-constructus-Verbindung bezeichnet die Frau durch ihre Beziehung zum Pharao; diese Formulierung ist im Deutschen natürlich und präzise.
- source_word: עָלְתָה
  choice: zog … hinauf
  rationale: Das Verb bezeichnet eine Aufwärtsbewegung und dürfte hier auch die Höhenlage betreffen. „Zog hinauf“ wahrt diese räumliche Aussage in idiomatischem Deutsch.
- source_word: מֵעִיר דָּוִד
  choice: aus der Stadt Davids
  rationale: Die Präposition bezeichnet den Ausgangspunkt der Bewegung. Der Ortsname wird als „Stadt Davids“ wiedergegeben.
- source_word: אֶל בֵּיתָהּ
  choice: in ihr Haus
  rationale: בַּיִת bedeutet grundsätzlich „Haus“ und kann im königlichen Kontext einen Palast bezeichnen. „Haus“ vermeidet eine unnötige interpretierende Festlegung.
- source_word: אֲשֶׁר בָּנָה לָהּ
  choice: das er für sie gebaut hatte
  rationale: Der Relativsatz bezieht sich auf das Haus. Das Plusquamperfekt macht im Deutschen deutlich, dass dessen Bau ihrem Umzug vorausging, wie es der Zusammenhang nahelegt.
- source_word: אָז
  choice: Danach
  rationale: Das Temporaladverb markiert die anschließende Handlung. „Danach“ gibt die erzählerische Abfolge klar wieder.
- source_word: בָּנָה
  choice: baute er
  rationale: Die einfache Verbform bezeichnet den Bau als Handlung; für „begann zu bauen“ gibt es im Text keinen ausdrücklichen Anhaltspunkt.
- source_word: הַמִּלּוֹא
  choice: den Millo
  rationale: Der Ausdruck ist eine technische beziehungsweise topografische Bezeichnung für eine Jerusalemer Anlage, deren genaue Beschaffenheit umstritten ist. Die Transliteration bewahrt den Referenten, ohne ihn vorschnell zu bestimmen.
