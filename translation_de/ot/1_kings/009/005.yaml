  text: וַ/הֲקִ֨מֹתִ֜י אֶת כִּסֵּ֧א מַֽמְלַכְתְּ/ךָ֛ עַל יִשְׂרָאֵ֖ל לְ/עֹלָ֑ם כַּ/אֲשֶׁ֣ר דִּבַּ֗רְתִּי עַל דָּוִ֤ד אָבִ֨י/ךָ֙ לֵ/אמֹ֔ר לֹֽא יִכָּרֵ֤ת לְ/ךָ֙ אִ֔ישׁ מֵ/עַ֖ל כִּסֵּ֥א יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/005.yaml
  text: then I will establish the throne of your kingdom over Israel forever, just as I spoke concerning David your father, saying, ‘A man of yours will not be cut off from the throne of Israel.’
translation:
  language: de
  text: 'dann werde ich den Thron deines Königtums über Israel für immer festigen, wie ich über deinen Vater David gesprochen habe: »Es wird dir kein Mann vom Thron Israels abgeschnitten werden.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: dann werde ich … festigen
  rationale: Das Hifil von קום bezeichnet hier das feste Aufrichten bzw. Bestätigen des davidischen Königsthrons; »dann« gibt den Folgezusammenhang wieder.
- source_word: כִּסֵּא מַמְלַכְתְּךָ
  choice: den Thron deines Königtums
  rationale: Die formale Verbindung von »Thron« und »Königtum« bleibt erhalten; gemeint ist die dynastische Herrschaft.
- source_word: לְעֹלָם
  choice: für immer
  rationale: Gibt die zeitlich uneingeschränkte Formulierung des Hebräischen unmittelbar wieder.
- source_word: דִּבַּרְתִּי עַל־דָּוִד אָבִיךָ
  choice: wie ich es deinem Vater David zugesagt habe
  rationale: דבר על bezeichnet hier das an David gerichtete bzw. ihn betreffende göttliche Wort; »zugesagt« macht dessen Verheißungscharakter idiomatisch deutlich.
- source_word: לֹא־יִכָּרֵת לְךָ אִישׁ
  choice: Es soll dir nie an einem Mann … fehlen
  rationale: Die hebräische Wendung bedeutet wörtlich, dass David kein Mann »abgeschnitten« werde; die gewählte deutsche Form gibt den dynastischen Sinn natürlich wieder, ohne eine bestimmte Einzelperson einzusetzen.
- source_word: מֵעַל כִּסֵּא יִשְׂרָאֵל
  choice: auf dem Thron Israels
  rationale: In Verbindung mit der idiomatischen Negativformel bezeichnet מֵעַל den Platz, von dem ein davidischer Nachkomme nicht verschwinden soll; »auf dem Thron« ist im Deutschen natürlich.
theological_decisions:
- issue: Bedingte dynastische Verheißung im Kontext
  choice: Der Vers formuliert die Zusage uneingeschränkt, ohne im Vers selbst einen Bedingungssatz zu ergänzen.
  alternative: Die in Vers 4 genannte Bedingung ausdrücklich in Vers 5 wiederholen.
  rationale: Die Bedingung ergibt sich aus dem unmittelbaren Zusammenhang, gehört syntaktisch jedoch nicht in den Wortlaut dieses Verses.
- issue: Bedeutung von »für immer«
  choice: »für immer« bleibt ohne christologische oder rein historische Präzisierung stehen.
  alternative: Die Formulierung ausdrücklich auf eine irdische Dynastie oder auf den Messias beziehen.
  rationale: Der hebräische Vers selbst lässt die Reichweite der Erfüllung offen; diese theologische Spannung soll nicht im Übersetzungstext aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, während die Schlussformel idiomatisch verständlich wiedergegeben wird. Keine Fußnoten erforderlich.
