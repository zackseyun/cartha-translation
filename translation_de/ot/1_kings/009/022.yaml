source:
  edition: WLC
  text: וּ/מִ/בְּנֵי֙ יִשְׂרָאֵ֔ל לֹֽא נָתַ֥ן שְׁלֹמֹ֖ה עָ֑בֶד כִּי הֵ֞ם אַנְשֵׁ֣י הַ/מִּלְחָמָ֗ה וַ/עֲבָדָי/ו֙ וְ/שָׂרָ֣י/ו וְ/שָׁלִשָׁ֔י/ו וְ/שָׂרֵ֥י רִכְבּ֖/וֹ וּ/פָרָשָֽׁי/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/022.yaml
  text: But from the sons of Israel Solomon made no servants[a], for they were the men of war, his servants, his commanders, his officers, and the commanders of his chariots and his horsemen.
translation:
  language: de
  text: Doch von den Israeliten machte Salomo keinen zum Sklaven; denn sie waren die Krieger, seine Diener, seine Befehlshaber, seine Offiziere[a] sowie die Befehlshaber seiner Streitwagen und seine Reiter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Adjutanten“. Das hebräische Wort bezeichnet vermutlich eine besondere Gruppe hochrangiger militärischer Gehilfen oder Streitwagenoffiziere.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי יִשְׂרָאֵל
  choice: Doch von den Israeliten
  rationale: Die Präposition מִן bezeichnet die Auswahl aus einer Gruppe; „Israeliten“ gibt בְּנֵי יִשְׂרָאֵל im modernen Deutschen natürlich wieder. „Doch“ macht den Gegensatz zu den im vorigen Vers genannten Fronarbeitern sichtbar.
- source_word: לֹא נָתַן שְׁלֹמֹה עָבֶד
  choice: machte Salomo keinen zum Sklaven
  rationale: Die Konstruktion bedeutet hier, jemanden in den Sklavenstand zu versetzen. Die singularische Form עָבֶד ist distributiv auf die Israeliten bezogen; „keinen zum Sklaven“ bildet dies idiomatisch und ohne Abschwächung ab.
- source_word: כִּי הֵם
  choice: denn sie waren
  rationale: כִּי führt die Begründung für Salomos Vorgehen ein; „denn“ ist im Deutschen klar und würdevoll.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: die Krieger
  rationale: Die Wendung bezeichnet kampffähige Männer beziehungsweise militärisches Personal. „Krieger“ ist prägnant und im Deutschen natürlicher als „Männer des Krieges“.
- source_word: וַעֲבָדָיו
  choice: seine Diener
  rationale: Im königlichen Umfeld kann עֶבֶד einen Diener oder Amtsträger bezeichnen. „Diener“ bewahrt die Breite des Ausdrucks, ohne ihn vorschnell auf ein bestimmtes Amt festzulegen.
- source_word: וְשָׂרָיו
  choice: seine Befehlshaber
  rationale: שַׂר bezeichnet einen Obersten, Anführer oder hohen Amtsträger; im militärischen Zusammenhang passt „Befehlshaber“.
- source_word: וְשָׁלִשָׁיו
  choice: seine Offiziere
  rationale: Die genaue Funktion des שָׁלִישׁ ist unsicher. „Offiziere“ gibt den hohen militärischen Rang allgemeinverständlich wieder; die mögliche speziellere Bedeutung wird in der Fußnote erhalten.
- source_word: וְשָׂרֵי רִכְבּוֹ
  choice: die Befehlshaber seiner Streitwagen
  rationale: Die Genitivverbindung bezeichnet die Führer über Salomos Streitwagen beziehungsweise Streitwagentruppe; die Übersetzung bleibt nahe an der Formulierung des Ausgangstextes.
- source_word: וּפָרָשָׁיו
  choice: seine Reiter
  rationale: פָּרָשׁ bezeichnet hier berittene Soldaten. „Reiter“ ist direkt und vermeidet das möglicherweise anachronistisch wirkende „Kavalleristen“.
theological_decisions:
- issue: Sozialer Status bei עָבֶד
  choice: machte Salomo keinen zum Sklaven
  alternative: setzte Salomo keinen als Diener ein
  rationale: Der unmittelbare Zusammenhang stellt die Israeliten den zur Fronarbeit herangezogenen nichtisraelitischen Bevölkerungsgruppen gegenüber. „Sklave“ wahrt daher den harten sozialen Status und schwächt ihn nicht zu bloßem Dienst ab.
- issue: Bedeutung von וַעֲבָדָיו innerhalb der Ämterliste
  choice: seine Diener
  alternative: seine Beamten
  rationale: Dasselbe hebräische Wortfeld kann je nach Verhältnis und Kontext Sklaven, Diener oder königliche Amtsträger bezeichnen. In der Aufzählung königlicher und militärischer Funktionen ist „Diener“ angemessen, ohne daraus eine Aussage über identischen Sklavenstatus abzuleiten.
- issue: Geschlecht der militärischen Personengruppe
  choice: die Krieger
  alternative: die Männer des Krieges
  rationale: Der hebräische Ausdruck ist grammatisch und sachlich männlich. Das deutsche Maskulinum „Krieger“ bewahrt diese historische Referenz, ohne eine künstlich wörtliche Wendung zu verwenden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstruktur bleibt quellennah, während idiomatisch unnatürliche Hebraismen vermieden werden. Die wiederholten Possessivformen erhalten die gestufte Aufzählung königlicher und militärischer Funktionen.
