revisions:
- from: Dann werde ich Israel aus dem Land ausrotten, das ich ihnen gegeben habe. Und dieses Haus, das ich für meinen Namen geheiligt habe,[a] werde ich aus meiner Gegenwart verstoßen.[b] So wird Israel bei allen Völkern zum Sprichwort und zum Spottwort.[c]
  to: Dann werde ich Israel aus dem Land, das ich ihnen gegeben habe, entfernen. Und das Haus, das ich für meinen Namen geheiligt habe,[a] werde ich aus meiner Gegenwart entfernen.[b] Israel wird unter allen Völkern zum Sprichwort und zum Spott werden.[c]
  rationale: Die Revision vermeidet bei der Ankündigung gegen Israel eine im Deutschen mögliche Übersteigerung zur vollständigen Ausrottung und hält zugleich die ausdrücklich genannte Entfernung aus dem gegebenen Land fest. Beim Haus wird die Zurückweisung mit einer semantisch näheren, modernen Formulierung wiedergegeben. Die Fußnoten bleiben an den einschlägigen Ausdrücken verankert und erläutern bzw. dokumentieren die wesentlichen Alternativen.
