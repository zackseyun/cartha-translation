source:
  edition: WLC
  text: וְ/הִכְרַתִּ֣י אֶת יִשְׂרָאֵ֗ל מֵ/עַ֨ל פְּנֵ֤י הָ/אֲדָמָה֙ אֲשֶׁ֣ר נָתַ֣תִּי לָ/הֶ֔ם וְ/אֶת הַ/בַּ֨יִת֙ אֲשֶׁ֣ר הִקְדַּ֣שְׁתִּי לִ/שְׁמִ֔/י אֲשַׁלַּ֖ח מֵ/עַ֣ל פָּנָ֑/י וְ/הָיָ֧ה יִשְׂרָאֵ֛ל לְ/מָשָׁ֥ל וְ/לִ/שְׁנִינָ֖ה בְּ/כָל הָ/עַמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/007.yaml
  text: then I will cut off Israel from the face of the land that I have given them[a], and the house that I have consecrated for my name I will cast out from before my face[d][c][b], and Israel will become a proverb and a taunt among all peoples.
translation:
  language: de
  text: Dann werde ich Israel aus dem Land, das ich ihnen gegeben habe, entfernen. Und das Haus, das ich für meinen Namen geheiligt habe,[a] werde ich aus meiner Gegenwart entfernen.[b] Israel wird unter allen Völkern zum Sprichwort und zum Spott werden.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Für meinen Namen“ bezeichnet das Haus als Gott geweiht und dazu bestimmt, seinen Namen zu tragen und zu ehren.
    reason: cultural_note
  - marker: b
    text: 'Wörtlicher: „werde ich von meinem Angesicht wegschicken“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „zum Sprichwort und zum Hohn“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכְרַתִּי
  choice: werde ich … ausrotten
  rationale: Das Hifil von כרת bezeichnet hier ein Abschneiden oder Beseitigen. „Ausrotten“ gibt die Schärfe des Gerichts wieder, ohne im Kontext zwingend eine vollständige Vernichtung jedes Einzelnen zu behaupten; Israel wird aus dem ihm gegebenen Land entfernt.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: aus dem Land
  rationale: Die ausführliche hebräische Wendung bedeutet wörtlich „von der Oberfläche des Landes“. Im Deutschen ist „aus dem Land“ natürlich und bewahrt durch den folgenden Relativsatz eindeutig den Bezug auf das Israel gegebene Land.
- source_word: הַבַּיִת
  choice: dieses Haus
  rationale: „Haus“ entspricht dem hebräischen Wortlaut und bewahrt das Leitmotiv vom Haus für Gottes Namen; der Kontext bezeichnet damit den Tempel.
- source_word: הִקְדַּשְׁתִּי לִשְׁמִי
  choice: für meinen Namen geheiligt habe
  rationale: „Geheiligt“ bezeichnet das Absondern für Gott. Die Wendung „für meinen Namen“ bleibt als prägende Ausdrucksweise des Königebuchs erhalten.
- source_word: אֲשַׁלַּח מֵעַל פָּנָי
  choice: aus meiner Gegenwart verstoßen
  rationale: שׁלח kann „fortschicken“ oder „wegschicken“ bedeuten; zusammen mit „von meinem Angesicht“ drückt es hier Zurückweisung aus. Die Wiedergabe ist im Deutschen verständlich und erhält die starke Gerichtsandrohung.
- source_word: לְמָשָׁל וְלִשְׁנִינָה
  choice: zum Sprichwort und zum Spottwort
  rationale: „Sprichwort“ gibt מָשָׁל wieder, während „Spottwort“ den verhöhnenden Sinn von שְׁנִינָה ausdrückt und die zwei hebräischen Begriffe unterscheidet.
- source_word: בְּכָל הָעַמִּים
  choice: bei allen Völkern
  rationale: עַמִּים bezeichnet hier die verschiedenen Völker; „bei“ ist in Verbindung mit „zum Sprichwort werden“ idiomatisches Deutsch.
theological_decisions:
- issue: Tragweite des angekündigten Gerichts über Israel
  choice: Israel aus dem Land ausrotten
  alternative: Israel vom Land abschneiden / Israel aus dem Land entfernen
  rationale: Die Formulierung bewahrt die Härte des Bundesgerichts, lässt aber durch die ausdrückliche Ortsangabe erkennen, dass hier vor allem die Entfernung Israels aus dem gegebenen Land angekündigt wird, nicht ausdrücklich die restlose Vernichtung des Volkes.
- issue: Bezeichnung des Heiligtums
  choice: dieses Haus
  alternative: der Tempel
  rationale: Der Ausgangstext sagt „Haus“. Diese Wiedergabe erhält die theologische Verbindung zwischen dem Bauwerk und Gottes Namen, ohne den gemeinten Tempel unkenntlich zu machen.
- issue: Bedeutung von „für meinen Namen“
  choice: die hebräische Wendung im Haupttext bewahren
  alternative: das Haus, das ich mir als Stätte meiner Gegenwart geweiht habe
  rationale: Die Wendung darf nicht vorschnell mit einer umfassenden Aussage über Gottes Wohnweise gleichgesetzt werden. Sie bezeichnet das Heiligtum als den Ort, der Gottes Namen trägt und ehrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt der hebräischen Abfolge, wird jedoch für natürliche Lesbarkeit in drei Sätze gegliedert. „Haus“, „für meinen Namen“ und die beiden parallelen Begriffe „Sprichwort“ und „Spottwort“ bewahren wesentliche Bilder und Spannungen des Ausgangstextes.
