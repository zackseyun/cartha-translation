  text: וָ/אֳנִ֡י עָשָׂה֩ הַ/מֶּ֨לֶךְ שְׁלֹמֹ֜ה בְּ/עֶצְיֽוֹן גֶּ֨בֶר אֲשֶׁ֧ר אֶת אֵל֛וֹת עַל שְׂפַ֥ת יַם ס֖וּף בְּ/אֶ֥רֶץ אֱדֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/026.yaml
  text: King Solomon also built a fleet of ships at Ezion-geber[a], which is beside Eloth on the shore of the Red Sea, in the land of Edom.
translation:
  language: de
  text: Auch König Salomo baute in Ezjon-Geber eine Flotte. Ezjon-Geber liegt neben Elot am Ufer des Roten Meeres[a], im Land Edom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Schilfmeer“; traditionell: „Rotes Meer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֳנִי
  choice: Auch … eine Flotte
  rationale: אֳנִי bezeichnet hier kollektiv eine Schiffsflotte; „Flotte“ ist im Deutschen natürlich. „Auch“ gibt die verbindende Funktion des vorangestellten ו wieder.
- source_word: עָשָׂה
  choice: baute
  rationale: Das allgemeinere Verb „machen“ bezeichnet zusammen mit אֳנִי hier den Bau beziehungsweise die Ausrüstung einer Flotte; „baute“ ist idiomatisch und sachlich klar.
- source_word: בְּעֶצְיוֹן גֶּבֶר
  choice: bei Ezjon-Geber
  rationale: Die Präposition בְּ markiert den Ort der Bautätigkeit. „Bei“ passt zur Lage eines Hafens beziehungsweise einer Küstensiedlung.
- source_word: אֲשֶׁר אֶת אֵלוֹת
  choice: Der Ort liegt bei Elot
  rationale: Die knappe hebräische Ortsangabe verbindet Ezjon-Geber räumlich mit Elot. Ein eigener Satz vermeidet im Deutschen eine schwerfällige Relativkonstruktion, ohne die Nähe genauer festzulegen, als es der Text tut.
- source_word: עַל שְׂפַת יַם סוּף
  choice: am Ufer des Roten Meeres
  rationale: שְׂפַת bedeutet wörtlich „Lippe/Rand“ und bezeichnet hier das Ufer. „Rotes Meer“ ist die geläufige geographische Bezeichnung; die quellennähere traditionelle Wiedergabe „Schilfmeer“ wird in der Fußnote bewahrt.
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: im Land Edom
  rationale: Die Wiedergabe erhält sowohl אֶרֶץ („Land“) als auch die geographische Zuordnung zu Edom.
