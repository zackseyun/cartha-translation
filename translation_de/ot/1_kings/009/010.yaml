id: 1KI.9.10
reference: 1 Kings 9:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְהִ֗י מִ/קְצֵה֙ עֶשְׂרִ֣ים שָׁנָ֔ה אֲשֶׁר בָּנָ֥ה שְׁלֹמֹ֖ה אֶת שְׁנֵ֣י הַ/בָּתִּ֑ים אֶת בֵּ֥ית יְהוָ֖ה וְ/אֶת בֵּ֥ית הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/010.yaml
  text: And it happened at the end of twenty years[b][a], in which Solomon had built the two houses—the house of Yahweh and the king's house—
translation:
  language: de
  text: 'Und es geschah nach Ablauf von zwanzig Jahren[a], in denen Salomo die beiden Häuser[b] gebaut hatte – das Haus Jahwes und das Haus des Königs –:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „am Ende von zwanzig Jahren“. Die hebräische Wendung bezeichnet den Abschluss eines Zeitraums von zwanzig Jahren.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die zwei Häuser“, nämlich das Haus Jahwes und das Haus des Königs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Und es geschah
  rationale: Die Form führt einen neuen Abschnitt der Erzählung ein. Die Wiedergabe bleibt nah am Hebräischen und ist in gehobenem modernem Deutsch verständlich.
- source_word: מִקְצֵה עֶשְׂרִים שָׁנָה
  choice: nach Ablauf von zwanzig Jahren
  rationale: Die hebräische Wendung bezeichnet den Zeitpunkt, an dem ein Zeitraum von zwanzig Jahren vollendet war. Im Deutschen ist „nach Ablauf“ natürlicher als eine wörtliche räumliche Formulierung.
- source_word: אֲשֶׁר
  choice: in denen
  rationale: Das Relativpronomen bezieht sich auf die zwanzig Jahre und leitet den Zeitraum näher bestimmend ein, ohne mehr über den genauen Verlauf der Bauarbeiten auszusagen.
- source_word: בָּנָה
  choice: gebaut hatte
  rationale: Das Plusquamperfekt macht deutlich, dass Salomos Bautätigkeit aus Sicht des erreichten Endpunkts zurückliegt.
- source_word: שְׁנֵי הַבָּתִּים
  choice: die beiden Häuser
  rationale: „Häuser“ bewahrt die Wiederholung und Parallelität der unmittelbar folgenden Bezeichnungen; „Gebäude“ wäre stärker deutend.
- source_word: בֵּית יְהוָה
  choice: das Haus Jahwes
  rationale: Die Wiedergabe erhält sowohl das konkrete Bild „Haus“ als auch den im hebräischen Text stehenden Gottesnamen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname wird als Jahwe wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בֵּית הַמֶּלֶךְ
  choice: das Haus des Königs
  rationale: Die Formulierung wahrt die lexikalische und syntaktische Parallele zu „das Haus Jahwes“; „Königspalast“ wäre kontextuell möglich, aber interpretierender.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. „Jahwe“ bewahrt ihn als Namen, während „der HERR“ ihn traditionell durch einen Titel ersetzt.
- issue: Bezeichnung des Heiligtums
  choice: das Haus Jahwes
  alternative: der Tempel Jahwes
  rationale: „Haus“ entspricht בַּיִת und erhält die bewusste Parallele zwischen Gottes Haus und dem Haus des Königs. „Tempel“ wäre sachlich zutreffend, aber explizierender.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die hebräische Satzstruktur. Der Gedankenstrich und der Doppelpunkt zeigen an, dass der Satz im folgenden Vers weitergeführt wird. Die Fußnotenmarker stehen jeweils unmittelbar bei der erläuterten Wendung.
