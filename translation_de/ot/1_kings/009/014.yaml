base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/014.yaml
  text: And Hiram sent to the king one hundred and twenty talents of gold[a][b].
translation:
  language: de
  text: Und Hiram sandte dem König 120 Talente Gold.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Talent war eine große Gewichtseinheit; gemeint sind 120 Talente an Gold.
    reason: cultural_note
  - marker: b
    text: 'Oder: „König Salomo“; im Hebräischen steht lediglich „dem König“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: sandte
  rationale: Das Waw-Konsekutiv führt die Erzählung mit Vergangenheitsbedeutung fort; „sandte“ gibt שׁלח hier direkt und in würdigem Erzählstil wieder.
- source_word: חִירָם
  choice: Hiram
  rationale: „Hiram“ entspricht der hebräischen Namensform und der etablierten deutschen Schreibweise in den Königsbüchern.
- source_word: לַמֶּלֶךְ
  choice: dem König
  rationale: Der hebräische Text nennt mit bestimmtem Artikel lediglich „den König“; aus dem Zusammenhang ist Salomo gemeint, ohne dass sein Name im Haupttext ergänzt werden muss.
- source_word: מֵאָה וְעֶשְׂרִים
  choice: '120'
  rationale: Die Ziffernschreibung ist im modernen Deutschen bei einer Gewichtsangabe klar und gut lesbar und gibt die Zahl exakt wieder.
- source_word: כִּכַּר
  choice: Talente
  rationale: כִּכָּר bezeichnet hier eine große antike Gewichtseinheit; „Talent“ ist die übliche deutsche Fachbezeichnung, im Plural „Talente“.
- source_word: זָהָב
  choice: Gold
  rationale: Das Substantiv bezeichnet Gold; zusammen mit der Gewichtseinheit ergibt sich natürlich „Talente Gold“.
theological_decisions: []
