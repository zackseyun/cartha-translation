lexical_decisions:
- source_word: וְ/אֶת
  choice: und
  rationale: אֵת kennzeichnet das bestimmte direkte Objekt und bleibt im Deutschen unübersetzt; וְ verbindet diesen Eintrag mit der fortlaufenden Ortsliste.
- source_word: בַּעֲלָת
  choice: Baalat
  rationale: Der Ortsname wird in einer dem Hebräischen nahen deutschen Umschrift wiedergegeben.
- source_word: וְ/אֶת
  choice: und
  rationale: Wie beim ersten Vorkommen bleibt der Objektmarker אֵת unübersetzt, während וְ die beiden Ortsnamen koordiniert.
- source_word: תמר
  choice: Tamar
  rationale: Der masoretische Konsonantentext lautet תמר und wird daher im Haupttext als „Tamar“ wiedergegeben; die abweichende Lesart des Paralleltexts wird in einer Fußnote bewahrt.
- source_word: בַּ/מִּדְבָּר
  choice: in der Wüste
  rationale: מִדְבָּר bezeichnet Wüsten- oder unbesiedeltes Wildnisgebiet; „Wüste“ ist hier eine natürliche und geografisch passende deutsche Wiedergabe.
- source_word: בָּ/אָֽרֶץ
  choice: im Land
  rationale: אֶרֶץ hat hier einen allgemeinen geografischen Sinn. „Land“ wahrt die unbestimmte territoriale Bezugnahme des Hebräischen.
