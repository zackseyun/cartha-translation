  language: de
  text: und Baalat und Tamar[a] in der Wüste, im Land.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Tamar“; die Parallelstelle in 2. Chronik 8,4 lautet „Tadmor“.'
