source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר מָ֚ה הֶ/עָרִ֣ים הָ/אֵ֔לֶּה אֲשֶׁר נָתַ֥תָּה לִּ֖/י אָחִ֑/י וַ/יִּקְרָ֤א לָ/הֶם֙ אֶ֣רֶץ כָּב֔וּל עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/013.yaml
  text: And he said[a], “What are these cities that you have given me, my brother?” So he called them the land of Cabul to this day.
translation:
  language: de
  text: 'Und er sagte: »Was sind das für Städte, die du mir gegeben hast, mein Bruder?« Und er nannte sie »Land Kabul«[a] – bis auf den heutigen Tag.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kabul ist wahrscheinlich ein Gebietsname. Im Hebräischen könnte jedoch zugleich ein abwertendes Wortspiel anklingen, möglicherweise im Sinn von »zu nichts nütze« oder »wie gebunden/eingeschränkt«; die genaue Herleitung ist unsicher.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה הֶעָרִים הָאֵלֶּה
  choice: Was sind das für Städte
  rationale: מָה leitet hier eine qualitative, missbilligende Frage ein. Die deutsche Wendung gibt diese Nuance natürlich wieder, ohne den Grund der Klage auszudeuten.
- source_word: אֲשֶׁר נָתַתָּה לִּי
  choice: die du mir gegeben hast
  rationale: Das Perfekt bezeichnet eine abgeschlossene Gabe mit gegenwärtiger Bedeutung; das deutsche Perfekt passt zur direkten Rede.
- source_word: אָחִי
  choice: mein Bruder
  rationale: Die ausdrückliche Anrede wird wörtlich bewahrt; sie kann zugleich die diplomatische Sprache zwischen Königen widerspiegeln.
- source_word: וַיִּקְרָא לָהֶם
  choice: Und er nannte sie
  rationale: קרא mit ל bezeichnet hier das Benennen. Das Pronomen nimmt entsprechend der hebräischen Formulierung die Städte wieder auf.
- source_word: אֶרֶץ כָּבוּל
  choice: Land Kabul
  rationale: כָּבוּל wird vorrangig als Orts- oder Gebietsname behandelt und daher transliteriert. Eine mögliche abwertende Wortbedeutung wird nicht in den Haupttext eingetragen, sondern in der Fußnote offengehalten.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: bis auf den heutigen Tag
  rationale: Die geläufige deutsche Erzählformel entspricht der zeitlichen Perspektive des hebräischen Erzählers.
theological_decisions: []
