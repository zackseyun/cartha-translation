  register: Moderne, würdevolle Erzählsprache. Die direkte Rede klingt deutlich missbilligend, bleibt aber nah an der knappen hebräischen Formulierung. Der diplomatische Ausdruck »mein Bruder« und die mögliche Mehrdeutigkeit von »Kabul« bleiben erhalten.
