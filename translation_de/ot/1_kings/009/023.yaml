base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/023.yaml
  text: 'These were the chief officers of the deputies who were over the work for Solomon: five hundred and fifty[b][a], ruling over the people who were doing the work.'
translation:
  language: de
  text: 'Dies waren die obersten Beamten der Aufseher[a], die für Salomo über die Arbeit eingesetzt waren: fünfhundertfünfzig; sie hatten Befehlsgewalt[b] über die Leute, die die Arbeit verrichteten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der eingesetzten Amtsträger“. Das hebräische Wort kann bestellte Amtsträger oder Personen bezeichnen, die über andere gesetzt sind.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Sie herrschten über“. Das hebräische Verb kann herrschen, die Leitung innehaben oder Autorität ausüben bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַנִּצָּבִים
  choice: die leitenden Beamten der Beauftragten
  rationale: 'Die Konstruktverbindung wird vollständig wiedergegeben: שָׂרֵי bezeichnet führende Amtsträger, הַנִּצָּבִים eingesetzte oder bestellte Verantwortliche. „Leitende Beamte“ passt zum Verwaltungskontext, ohne einen militärischen Rang anzudeuten.'
- source_word: אֲשֶׁר עַל הַמְּלָאכָה לִשְׁלֹמֹה
  choice: die für Salomo über die Arbeit eingesetzt waren
  rationale: Die Formulierung bewahrt das Bild des Über-der-Arbeit-Stehens und gibt לִשְׁלֹמֹה als Dienst- beziehungsweise Zuordnungsverhältnis wieder.
- source_word: חֲמִשִּׁים וַחֲמֵשׁ מֵאוֹת
  choice: '550'
  rationale: Die Zahl wird in der im modernen deutschen Fließtext üblichen Ziffernschreibweise wiedergegeben.
- source_word: הָרֹדִים
  choice: Sie hatten Befehlsgewalt
  rationale: רדה bezeichnet Herrschen beziehungsweise das Ausüben von Autorität. „Befehlsgewalt haben“ wahrt die Stärke des Verbs und ist im Kontext organisierter Arbeit natürlich.
- source_word: בָּעָם הָעֹשִׂים בַּמְּלָאכָה
  choice: über die Leute, die die Arbeit verrichteten
  rationale: עָם bleibt als „Leute“ breit wiedergegeben; erst der Relativsatz bestimmt sie als die tatsächlich Arbeitenden. „Die Arbeit verrichten“ ist klar und würdig.
