review_pass:
  verdict: revise
  source_fidelity: Der Entwurf trifft die Aufzählung der fünf Bevölkerungsgruppen, den Verbleib und die Abgrenzung von Israel grundsätzlich. »Die gesamte Bevölkerung« ist jedoch weiter und weniger präzise als כָּל־הָעָם im Kontext, das die Gesamtheit der jeweils verbliebenen Personen bezeichnet. Die Pluralform der Relativsätze bildet die Personenreferenz zudem unmittelbarer ab.
  naturalness: »Alle Menschen, die ... übrig geblieben waren« ist modernes, klares Standarddeutsch. Es vermeidet die etwas verwaltungssprachliche und inhaltlich überweite Formulierung »die gesamte Bevölkerung«. Der Gedankenstrich ist beizubehalten, da der Satz in V. 21 fortläuft.
  terminology: Die übliche deutsche biblisch-historische Schreibung lautet »Hethiter« (nicht »Hetiter«). »Amoriter«, »Perisiter«, »Hiwiter« und »Jebusiter« sind angemessen. »Israeliten« ist als idiomatische Haupttextwiedergabe von בְּנֵי יִשְׂרָאֵל vertretbar; die Fußnote soll die wörtliche Form korrekt und vollständig ausweisen.
  issues:
  - severity: medium
    issue: »die gesamte Bevölkerung«
    rationale: Die Formulierung kann die gesamte Bevölkerung der genannten Gruppen bezeichnen. Der hebräische Ausdruck meint hier alle Personen, die aus diesen Gruppen übrig geblieben waren.
  - severity: medium
    issue: »Hetitern«
    rationale: Für das biblische Ethnonym ist im modernen deutschen Bibelgebrauch »Hethiter« die etablierte Schreibung.
  - severity: low
    issue: Formulierung der wörtlichen Fußnote
    rationale: 'Die Fußnote sollte den Relativbezug und die hebräische Nominalformulierung genauer wiedergeben: »die nicht von den Söhnen Israels waren«.'
