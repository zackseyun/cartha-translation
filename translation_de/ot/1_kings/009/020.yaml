  text: כָּל הָ֠/עָם הַ/נּוֹתָ֨ר מִן הָ/אֱמֹרִ֜י הַ/חִתִּ֤י הַ/פְּרִזִּי֙ הַ/חִוִּ֣י וְ/הַ/יְבוּסִ֔י אֲשֶׁ֛ר לֹֽא מִ/בְּנֵ֥י יִשְׂרָאֵ֖ל הֵֽמָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/020.yaml
  text: All the people who remained of the Amorites[a], the Hittites, the Perizzites, the Hivites, and the Jebusites, who were not of the sons of Israel—
translation:
  language: de
  text: Alle Menschen, die von den Amoritern, den Hethitern, den Perisitern, den Hiwitern und den Jebusitern übrig geblieben waren und nicht zu den Israeliten[a] gehörten –
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die nicht von den Söhnen Israels waren«.'
    reason: Die Fußnote macht die konkrete hebräische Formulierung בְּנֵי יִשְׂרָאֵל sichtbar, während der Haupttext die Zugehörigkeitsaussage idiomatisch wiedergibt.
lexical_decisions:
- source_word: כָּל הָעָם
  choice: die gesamte Bevölkerung
  rationale: Die Verbindung bezeichnet kollektiv die Gesamtheit der betroffenen Menschen. „Bevölkerung“ gibt diesen kollektiven Sinn im modernen Deutschen natürlicher wieder als das missverständliche „das ganze Volk“.
- source_word: הַנּוֹתָר
  choice: die … übrig geblieben war
  rationale: Das Nifal-Partizip von יתר bezeichnet das, was verblieben oder übrig geblieben ist. Wegen des kollektiven Singulars „Bevölkerung“ steht das Verb im Singular.
- source_word: מִן
  choice: von
  rationale: Die Präposition bezeichnet hier die Gruppen, aus denen die verbliebene Bevölkerung stammt.
- source_word: הָאֱמֹרִי הַחִתִּי הַפְּרִזִּי הַחִוִּי וְהַיְבוּסִי
  choice: von den Amoritern, den Hetitern, den Perisitern, den Hiwitern und den Jebusitern
  rationale: Die hebräischen singularischen Volksbezeichnungen haben kollektiven Sinn und werden mit den im Deutschen üblichen pluralischen Ethnonymen wiedergegeben.
- source_word: אֲשֶׁר לֹא מִבְּנֵי יִשְׂרָאֵל הֵמָּה
  choice: und nicht zu den Israeliten gehörte
  rationale: Die Zugehörigkeitsaussage wird idiomatisch wiedergegeben. Das selbstständige Pronomen הֵמָּה unterstreicht die Abgrenzung, erfordert im Deutschen aber kein eigenes Pronomen.
theological_decisions:
- issue: Wiedergabe der Herkunfts- und Zugehörigkeitsformel בְּנֵי יִשְׂרָאֵל
  choice: Israeliten
  alternative: Söhne Israels
  rationale: „Israeliten“ bezeichnet im heutigen Deutsch eindeutig das gesamte Volk und vermeidet die unbeabsichtigte Beschränkung auf männliche Nachkommen. Die wörtliche Form bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich am Versende zeigt an, dass der Satz in Vers 21 weitergeführt wird. Die Reihung der Volksnamen und die offene Satzstruktur des Hebräischen bleiben erhalten.
