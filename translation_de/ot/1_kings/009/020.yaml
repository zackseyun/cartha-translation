revisions:
- from: Die gesamte Bevölkerung, die von den Amoritern, den Hetitern, den Perisitern, den Hiwitern und den Jebusitern übrig geblieben war und nicht zu den Israeliten[a] gehörte –
  to: Alle Menschen, die von den Amoritern, den Hethitern, den Perisitern, den Hiwitern und den Jebusitern übrig geblieben waren und nicht zu den Israeliten[a] gehörten –
  rationale: Die Revision präzisiert den Umfang von כָּל־הָעָם durch eine personenbezogene Pluralform, normalisiert die etablierte Schreibweise »Hethiter« und schärft die wörtliche Fußnote. Aussage, Aufzählung und offener Satzanschluss zum folgenden Vers bleiben erhalten.
