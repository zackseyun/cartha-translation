  text: וְ/הַ/בַּ֤יִת הַ/זֶּה֙ יִהְיֶ֣ה עֶלְי֔וֹן כָּל עֹבֵ֥ר עָלָ֖י/ו יִשֹּׁ֣ם וְ/שָׁרָ֑ק וְ/אָמְר֗וּ עַל מֶ֨ה עָשָׂ֤ה יְהוָה֙ כָּ֔כָה לָ/אָ֥רֶץ הַ/זֹּ֖את וְ/לַ/בַּ֥יִת הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/008.yaml
  text: And this house will become a ruin[a]. Everyone who passes by it will be appalled and will whistle, and they will say[b], ‘Why has Yahweh done thus to this land and to this house?’
translation:
  language: de
  text: 'Und dieses Haus wird zur Ruine werden.[a] Jeder, der daran vorbeikommt, wird sich entsetzen und pfeifen.[b] Und man wird sagen: »Warum hat Jahwe diesem Land und diesem Haus das angetan?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich nach dem überlieferten hebräischen Text: »Dieses Haus wird hoch/erhaben sein.« Im Zusammenhang wird die Aussage vielfach als Hinweis auf seine Verwüstung verstanden. Vergleiche 2. Chronik 7,21.'
    reason: textual_variant
  - marker: b
    text: 'Auch möglich: »zischen«. Das hebräische Verb bezeichnet einen scharfen Laut, der Bestürzung oder Spott ausdrücken kann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבַּיִת הַזֶּה
  choice: Und dieses Haus
  rationale: בַּיִת bedeutet wörtlich »Haus« und bezeichnet hier den Tempel. »Haus« bewahrt die hebräische Ausdrucksweise und die literarische Verbindung zum für Jahwe gebauten Haus.
- source_word: יִהְיֶה עֶלְיוֹן
  choice: wird zur Ruine werden
  rationale: Der masoretische Konsonantentext mit der überlieferten Vokalisierung bedeutet wörtlich »wird hoch/erhaben sein«, was im Gerichtskontext schwer verständlich ist. Die Wiedergabe folgt dem kontextuell naheliegenden Sinn der Verwüstung; die Textspannung bleibt in Fußnote [a] sichtbar.
- source_word: כָּל עֹבֵר עָלָיו
  choice: Jeder, der daran vorbeikommt
  rationale: Die hebräische Wendung bezeichnet jeden Vorübergehenden. Die deutsche Formulierung ist natürlich und erhält die distributive Kraft von כָּל.
- source_word: יִשֹּׁם
  choice: wird entsetzt sein
  rationale: Das Verb beschreibt eine Reaktion erschütterten Staunens beziehungsweise Entsetzens angesichts der Verwüstung.
- source_word: וְשָׁרָק
  choice: und einen schrillen Laut ausstoßen
  rationale: Das Verb bezeichnet einen scharfen Laut als Ausdruck von Bestürzung oder Spott. Die neutrale Formulierung vermeidet die im Deutschen jeweils engeren Assoziationen von »pfeifen« und »zischen«; diese stehen in Fußnote [b].
- source_word: וְאָמְרוּ
  choice: Dann wird man fragen
  rationale: Der unbestimmte Plural lässt sich im Deutschen idiomatisch mit »man« wiedergeben. Wegen des folgenden Fragesatzes ist »fragen« natürlicher als das formale »sagen«.
- source_word: עַל מֶה
  choice: Warum
  rationale: Die Wendung fragt nach dem Grund des Gerichts; »Warum« ist die direkte natürliche Entsprechung.
- source_word: עָשָׂה יְהוָה כָּכָה
  choice: hat Jahwe ... so etwas angetan
  rationale: Die Formulierung gibt die sichtbaren Folgen einer Handlung idiomatisch wieder. »So etwas« entspricht dem rückverweisenden כָּכָה und ist in modernem Deutsch natürlicher als »derart« oder »so getan«.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לָאָרֶץ הַזֹּאת וְלַבַּיִת הַזֶּה
  choice: diesem Land und diesem Haus
  rationale: »Land« bezeichnet hier das Land Israel; »Haus« bewahrt die Wiederholung des hebräischen בַּיִת und meint im Zusammenhang den Tempel.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. »Jahwe« bewahrt den persönlichen Gottesnamen und vermeidet die Ersetzung durch einen Titel.
- issue: Sinn von עֶלְיוֹן im Gerichtskontext
  choice: kontextuell als Ruine beziehungsweise Verwüstung verstanden
  alternative: wird hoch/erhaben sein
  rationale: Die wörtliche Lesart des masoretischen Textes steht in deutlicher Spannung zum Zusammenhang der angekündigten Zerstörung. 2. Chronik 7,21 bietet eine eng verwandte Formulierung mit »hoch/erhaben«, während alte Textzeugen und viele Ausleger einen Verwüstungssinn voraussetzen. Die Übersetzung gibt den wahrscheinlichen Kontext­sinn wieder, ohne die genuine Textfrage zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Haus« erhält das Leitwort des Hebräischen, obwohl der Tempel gemeint ist. Die direkte Rede ist natürlich formuliert; die schwer verständliche masoretische Lesart und die Mehrdeutigkeit der Lautäußerung werden durch markierte Fußnoten offengehalten.
