  to: 'Und dieses Haus wird zur Ruine werden.[a] Jeder, der daran vorbeikommt, wird sich entsetzen und pfeifen.[b] Und man wird sagen: »Warum hat Jahwe diesem Land und diesem Haus das angetan?«'
  rationale: Die Revision ersetzt die vage Umschreibung der Lautäußerung durch »pfeifen«, die unmittelbare deutsche Entsprechung des hebräischen Verbs, und belässt die mögliche Deutung »zischen« in der Fußnote. Sie entfernt außerdem das nicht ausdrücklich markierte »Dann« und gibt וְאָמְרוּ näher mit »Und man wird sagen« wieder. Die kontextuelle Wiedergabe von עֶלְיוֹן als »Ruine« bleibt bestehen, weil die Fußnote die wörtliche, im Kontext schwierige Lesart vollständig offenlegt.
