translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers bleibt als Fortsetzung der Aufzählung des vorherigen Verses mit „dazu“ syntaktisch anschlussfähig. Die parallelen Verwaltungsbegriffe werden knapp wiedergegeben; ein Gedankenstrich gliedert die nachgestellten Ortsangaben, ohne ihren Bezug zu Salomos Bauvorhaben zu verändern.
