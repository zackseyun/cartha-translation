base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/019.yaml
  text: also all the storage cities that belonged to Solomon[a], the chariot cities, the horsemen's cities, and whatever Solomon desired to build in Jerusalem, in Lebanon[c][b], and in all the land of his dominion.
translation:
  language: de
  text: und alle Vorratsstädte[a], die Salomo gehörten, die Städte für Streitwagen, die Städte für Reiter[b] und alles, was Salomo zu bauen begehrte[c] – in Jerusalem, im Libanon und im ganzen Gebiet seiner Herrschaft.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch „Lagerstädte“ oder „Versorgungsstädte“. Gemeint sind Städte, die zur Lagerung von Vorräten oder zur Versorgung bestimmt waren.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „Städte der Reiter“. Das hebräische Wort bezeichnet genauer Reiter beziehungsweise Kavalleristen, nicht Pferde im Allgemeinen.
    reason: lexical_alternative
  - marker: c
    text: Die hebräische Formulierung verbindet ein Substantiv und ein Verb aus derselben Wortfamilie und betont damit Salomos Wunsch, diese Bauten zu errichten.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵי הַמִּסְכְּנוֹת
  choice: Vorratsstädte
  rationale: Die Wendung bezeichnet Städte, die zur Lagerung von Vorräten oder Versorgungsgütern bestimmt waren. „Vorratsstädte“ ist im modernen Deutsch klar und bewahrt den administrativen Sinn.
- source_word: אֲשֶׁר הָיוּ לִשְׁלֹמֹה
  choice: die Salomo gehörten
  rationale: Die Konstruktion mit ל kann Besitz oder Zuordnung ausdrücken; hier gibt die natürliche deutsche Besitzformulierung den naheliegenden Sinn wieder.
- source_word: עָרֵי הָרֶכֶב
  choice: Wagenstädte
  rationale: רֶכֶב bezeichnet hier die Streitwagen beziehungsweise die Streitwagentruppe. Die knappe Zusammensetzung spiegelt die hebräische Parallelform zu „Reiterstädte“.
- source_word: עָרֵי הַפָּרָשִׁים
  choice: Reiterstädte
  rationale: פָּרָשִׁים meint spezifisch Reiter beziehungsweise Kavalleristen und nicht allgemein Pferde. „Reiterstädte“ wahrt diese Unterscheidung.
- source_word: חֵשֶׁק שְׁלֹמֹה אֲשֶׁר חָשַׁק
  choice: alles, was Salomo zu bauen begehrte
  rationale: Die Verbindung eines Nomens und eines stammverwandten Verbs verstärkt Salomos Verlangen. „Begehrte“ hält diesen Nachdruck besser fest als das neutralere „wollte“, ohne die im Deutschen unnatürliche Wiederholung nachzuahmen.
- source_word: לִבְנוֹת
  choice: zu bauen
  rationale: Dies ist die direkte und kontextgemäße Wiedergabe des Infinitivs von בנה.
- source_word: בִּירוּשָׁלִַם וּבַלְּבָנוֹן
  choice: in Jerusalem, im Libanon
  rationale: Die Präpositionen sind lokal zu verstehen. „Im Libanon“ bezeichnet am natürlichsten die Region, in der gebaut wurde.
- source_word: בְּכֹל אֶרֶץ מֶמְשַׁלְתּוֹ
  choice: im ganzen Gebiet seiner Herrschaft
  rationale: Die Formulierung verbindet den territorialen Sinn von אֶרֶץ mit dem Gedanken königlicher Herrschaft und klingt im heutigen Deutsch natürlicher als „Land seiner Herrschaft“.
