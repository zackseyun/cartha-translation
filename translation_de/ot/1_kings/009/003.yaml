revisions:
- from: 'Und JHWH sagte zu ihm: „Ich habe dein Gebet und dein Flehen[a] gehört, mit dem du vor mir um Gnade gebeten hast. Ich habe dieses Haus[b], das du gebaut hast, geheiligt, um meinen Namen dort für immer anzubringen. Meine Augen und mein Herz werden allezeit dort sein.“[c]'
  to: 'Und JHWH sagte zu ihm: „Ich habe dein Gebet und dein Flehen[a], mit dem du vor mir gefleht hast, gehört. Ich habe dieses Haus[b], das du gebaut hast, geheiligt, um meinen Namen dort für immer zu setzen. Meine Augen und mein Herz werden allezeit dort sein.“[c]'
  rationale: Die Revision ersetzt ausschließlich das missverständliche, technisch wirkende „anzubringen“ durch „zu setzen“, das die hebräische Namensformel formnah und im deutschen Bibelregister natürlich wiedergibt. Ferner wird die Satzstellung beim Flehen leicht geglättet, damit die Wiederaufnahme des hebräischen Verbs für inständiges Bitten klar erkennbar bleibt.
