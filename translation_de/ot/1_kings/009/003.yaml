  source_fidelity: Die Übersetzung gibt die Satzstruktur, die Unterscheidung von Gebet und Flehen, die Heiligung des Hauses, die Namensformel sowie das Bild von Augen und Herz insgesamt zuverlässig wieder. „Anbringen“ ist für לָשׂוּם jedoch zu gegenständlich-technisch und kann das Setzen des Namens wie das Anbringen einer Beschriftung erscheinen lassen.
  naturalness: Der Text ist modernes, würdiges Standarddeutsch. „Meinen Namen ... zu setzen“ ist im religiös-literarischen Register idiomatischer und näher am hebräischen Tempelidiom als „anzubringen“. Die Umstellung im ersten Satz verdeutlicht zudem, dass das Relativsatzverb speziell das Flehen aufnimmt.
  terminology: JHWH, „Gebet“, „Flehen“, „geheiligt“, „Haus“ und die wörtlich bewahrten Bilder „meine Augen und mein Herz“ sind angemessen. Die Fußnoten erläutern, ohne die Übersetzung konfessionell oder dogmatisch festzulegen.
