source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלָ֗י/ו שָׁ֠מַעְתִּי אֶת תְּפִלָּתְ/ךָ֣ וְ/אֶת תְּחִנָּתְ/ךָ֮ אֲשֶׁ֣ר הִתְחַנַּ֣נְתָּה לְ/פָנַ/י֒ הִקְדַּ֗שְׁתִּי אֶת הַ/בַּ֤יִת הַ/זֶּה֙ אֲשֶׁ֣ר בָּנִ֔תָה לָ/שֽׂוּם שְׁמִ֥/י שָׁ֖ם עַד עוֹלָ֑ם וְ/הָי֨וּ עֵינַ֧/י וְ/לִבִּ֛/י שָׁ֖ם כָּל הַ/יָּמִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/003.yaml
  text: And Yahweh said to him[a], “I have heard your prayer and your plea for favor that you made before me. I have consecrated this house that you built, to put my name there forever[c][b], and my eyes and my heart will be there all the days.”
translation:
  language: de
  text: 'Und JHWH sagte zu ihm: „Ich habe dein Gebet und dein Flehen[a], mit dem du vor mir gefleht hast, gehört. Ich habe dieses Haus[b], das du gebaut hast, geheiligt, um meinen Namen dort für immer zu setzen. Meine Augen und mein Herz werden allezeit dort sein.“[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Flehen“ bezeichnet hier eine demütige, inständige Bitte um Gnade oder Wohlwollen.
    reason: lexical_alternative
  - marker: b
    text: Mit „diesem Haus“ ist der von Salomo erbaute Tempel gemeint.
    reason: cultural_note
  - marker: c
    text: Die Worte „meine Augen und mein Herz“ sind eine bildhafte Aussage über JHWHs fortwährende Aufmerksamkeit und fürsorgliche Zuwendung.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: JHWH
  rationale: Die vier Konsonanten des göttlichen Namens werden in der im Deutschen geläufigen Form JHWH wiedergegeben, ohne eine unsichere Aussprache festzulegen.
- source_word: שָׁמַעְתִּי
  choice: Ich habe … gehört
  rationale: Das deutsche Perfekt gibt die abgeschlossene Handlung mit ihrer gegenwärtigen Bedeutung in Gottes Antwort natürlich wieder.
- source_word: תְּפִלָּתְךָ וְאֶת־תְּחִנָּתְךָ
  choice: dein Gebet und dein Flehen
  rationale: Die beiden Ausdrücke bleiben unterschieden; „Flehen“ bezeichnet hier eine demütige Bitte um Gnade oder Wohlwollen.
- source_word: אֲשֶׁר הִתְחַנַּנְתָּה לְפָנַי
  choice: mit dem du vor mir um Gnade gebeten hast
  rationale: Die Formulierung bewahrt den Gedanken des inständigen Bittens und gibt לְפָנַי idiomatisch als „vor mir“ wieder.
- source_word: הִקְדַּשְׁתִּי
  choice: Ich habe … geheiligt
  rationale: „Geheiligt“ drückt aus, dass das Haus für Gott als heilig ausgesondert wurde, und bewahrt zugleich den kultischen Gehalt des Verbs.
- source_word: הַבַּיִת הַזֶּה
  choice: dieses Haus
  rationale: Die Übersetzung folgt dem hebräischen Wortlaut „Haus“; im Zusammenhang ist der von Salomo erbaute Tempel gemeint.
- source_word: לָשׂוּם שְׁמִי שָׁם
  choice: um meinen Namen dort … anzubringen
  rationale: Diese bewusst formnahe Wiedergabe bewahrt die Tempel-Namens-Formel und ersetzt sie nicht durch eine weitergehende Aussage über Gottes Wohnen oder örtliche Begrenzung.
- source_word: עַד־עוֹלָם
  choice: für immer
  rationale: Die Wendung bezeichnet hier die bleibende, auf Dauer angelegte Bestimmung des Hauses.
- source_word: עֵינַי וְלִבִּי
  choice: meine Augen und mein Herz
  rationale: Das körperhafte Bild wird beibehalten, statt es erklärend zu „Aufmerksamkeit und Fürsorge“ aufzulösen.
- source_word: כָּל־הַיָּמִים
  choice: allezeit
  rationale: „Allezeit“ gibt die fortdauernde Bedeutung der konkreten hebräischen Wendung knapp und würdig wieder.
theological_decisions:
- issue: Die anthropomorphe Rede von Gottes Augen und Herz
  choice: Das Bild wird wörtlich als „meine Augen und mein Herz“ bewahrt.
  alternative: „Meine Aufmerksamkeit und Fürsorge werden immer darauf gerichtet sein.“
  rationale: Der hebräische Text gebraucht bewusst körperhafte Sprache für Gottes fortwährende Aufmerksamkeit und sein fürsorgliches Zugewandtsein. Eine Paraphrase würde die theologische Bildkraft mindern.
- issue: Die Aussage, Gottes Namen am Tempel anzubringen
  choice: Die Namensformel wird als „meinen Namen dort … anzubringen“ wiedergegeben.
  alternative: „dort für immer zu wohnen“ oder „dort für immer verehrt zu werden“
  rationale: Der Text spricht ausdrücklich vom Anbringen beziehungsweise Setzen des Namens. Die Übersetzung vermeidet es, diese Bundes- und Tempelformel in eine eindeutige Aussage über Gottes Wohnen oder die Art seiner Gegenwart umzudeuten.
- issue: Die zeitliche Tragweite von עַד־עוֹלָם
  choice: „für immer“
  alternative: „auf unabsehbare Zeit“ oder „dauerhaft“
  rationale: Die starke Dauerformulierung des Verses bleibt erhalten; ihre Beziehung zu den später im Zusammenhang genannten Bundesbedingungen wird nicht schon in die Übersetzung hineingelesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit weitgehend natürlichem Satzbau. Die kultische Sprache („geheiligt“) und die hebräischen Tempelbilder („meinen Namen … anzubringen“, „meine Augen und mein Herz“) bleiben bewusst erhalten. „Allezeit“ setzt einen leicht gehobenen, aber allgemein verständlichen Akzent.
