base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/021.yaml
  text: When I got up in the morning to nurse my son[a], behold, he was dead. But when I looked closely at him in the morning, behold, he was not my son[b], whom I had borne.
translation:
  language: de
  text: 'Als ich am Morgen aufstand, um meinen Sohn zu stillen, da war er tot. Doch als ich ihn am Morgen genau ansah, stellte ich fest: Er war nicht mein Sohn, den ich geboren hatte.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאָקֻם בַּבֹּקֶר
  choice: Als ich am Morgen aufstand
  rationale: Das Qal-Wayyiqtol von קום erzählt das Aufstehen der Frau; „als“ gibt den zeitlichen Zusammenhang mit dem folgenden Infinitiv im natürlichen Deutschen wieder.
- source_word: לְהֵינִיק אֶת־בְּנִי
  choice: um meinen Sohn zu stillen
  rationale: Der Hifil-Infinitiv von ינק bezeichnet hier das Stillen eines Säuglings; בן wird geschlechtsspezifisch als „Sohn“ wiedergegeben.
- source_word: וְהִנֵּה מֵת
  choice: war er auf einmal tot
  rationale: הִנֵּה markiert die plötzliche, erschütternde Wahrnehmung. „Auf einmal“ bewahrt diese Funktion in natürlichem modernem Deutsch, während מֵת den festgestellten Zustand bezeichnet.
- source_word: וָאֶתְבּוֹנֵן אֵלָיו
  choice: als ich ihn genau ansah
  rationale: Die reflexiv-intensive Form von בין/בון bezeichnet aufmerksames Betrachten oder Prüfen; „genau ansehen“ ist idiomatisch und bildet die sorgfältige Wahrnehmung ab.
- source_word: וְהִנֵּה לֹא הָיָה בְנִי
  choice: 'erkannte ich: Es war nicht mein Sohn'
  rationale: Das zweite הִנֵּה hebt die überraschende Feststellung hervor. „Erkannte ich“ macht diese Diskursfunktion im Deutschen deutlich, ohne den sachlichen Inhalt zu verändern.
- source_word: אֲשֶׁר יָלָדְתִּי
  choice: den ich geboren hatte
  rationale: ילד in der 1. Person bezeichnet das Gebären. Das Plusquamperfekt kennzeichnet die Geburt als der morgendlichen Erkenntnis vorausgehend.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlichem Erzählfluss. Die Wiederholung von „am Morgen“ bleibt entsprechend dem Hebräischen erhalten. Die beiden Vorkommen von הִנֵּה werden funktional, aber unterschiedlich idiomatisch wiedergegeben („auf einmal“, „erkannte ich“), um die plötzliche Wahrnehmung auszudrücken, ohne das im heutigen Deutsch stark archaische „siehe“ zu verwenden.
