  text: אָ֣ז תָּבֹ֗אנָה שְׁתַּ֛יִם נָשִׁ֥ים זֹנ֖וֹת אֶל הַ/מֶּ֑לֶךְ וַֽ/תַּעֲמֹ֖דְנָה לְ/פָנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/016.yaml
  text: Then two women who were prostitutes came to the king and stood before him[a].
translation:
  language: de
  text: Da kamen zwei Prostituierte zum König und stellten sich vor ihn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  choice: Damals
  rationale: Der temporale Diskursmarker eröffnet die folgende Begebenheit. „Damals“ ist im Deutschen natürlich und lässt offen, ob lediglich zeitliche Folge oder ein allgemeiner zeitlicher Anschluss gemeint ist.
- source_word: תָּבֹאנָה
  choice: kamen
  rationale: Das Qal Imperfekt 3. Person feminin Plural von בוא bezeichnet hier im erzählenden Zusammenhang die Bewegung zum König hin.
- source_word: שְׁתַּיִם נָשִׁים
  choice: zwei Frauen
  rationale: Die Verbindung aus Zahlwort und Substantiv wird unmittelbar und idiomatisch wiedergegeben.
- source_word: זֹנוֹת
  choice: die Prostituierte waren
  rationale: Das Partizip beschreibt die Frauen attributiv. Der Relativsatz ist verständliches modernes Deutsch und bewahrt ausdrücklich, dass beide Frauen als Prostituierte bezeichnet werden.
- source_word: אֶל הַמֶּלֶךְ
  choice: zum König
  rationale: אֶל bezeichnet die Bewegung auf den König zu; „zum König“ gibt diese Richtung knapp wieder.
- source_word: וַתַּעֲמֹדְנָה
  choice: und traten
  rationale: עמד bedeutet wörtlich „stehen“ beziehungsweise „sich hinstellen“. Im Zusammenhang einer Audienz oder Rechtssache gibt „traten vor ihn“ den Vorgang im Deutschen natürlich wieder, ohne ihn weiter auszudeuten.
- source_word: לְפָנָיו
  choice: vor ihn
  rationale: Die feste Wendung bezeichnet das Erscheinen in der Gegenwart einer ranghöheren oder richtenden Person. Mit dem Bewegungsverb „traten“ verlangt modernes Deutsch hier den Akkusativ.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Prostituierte“ vermeidet das veraltete und abwertend gefärbte „Huren“. Die Formulierung bleibt nah am hebräischen Erzählstil, klingt jedoch natürlich auf Deutsch.
