review_pass:
  verdict: revise
  source_fidelity: Die Wendung וַתַּעֲמֹדְנָה לְפָנָיו besagt, dass die Frauen vor dem König standen bzw. sich vor ihn stellten. „traten vor ihn“ ist im Deutschen idiomatisch, betont jedoch stärker das Herantreten als die im Hebräischen bezeichnete Stellung. Die Revision gibt beides unmittelbar wieder.
  naturalness: „Da kamen zwei Prostituierte zum König und stellten sich vor ihn“ ist modernes, würdiges Standarddeutsch. Die Personenbezeichnung „Prostituierte“ ist hier als feminines Substantiv ausreichend; die zusätzliche Wiederholung „Frauen, die Prostituierte waren“ ist nicht erforderlich.
  terminology: „Prostituierte“ ist eine sachliche moderne Wiedergabe von זֹנוֹת. „König“ entspricht הַמֶּלֶךְ. Der temporale Anschluss mit „Da“ gibt אָז natürlicher und knapper wieder als das stärker rückblickend-distanzierende „Damals“.
