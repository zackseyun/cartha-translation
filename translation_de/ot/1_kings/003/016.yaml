  to: Da kamen zwei Prostituierte zum König und stellten sich vor ihn.
  rationale: Die Revision ersetzt die leicht interpretierende Formulierung „traten vor ihn“ durch die quellennähere und zugleich idiomatische Wiedergabe „stellten sich vor ihn“. Außerdem wird der unnötig umständliche Relativsatz gestrafft und die nun entbehrliche Fußnote entfernt.
  reviewer_model: gpt-5.6-terra
