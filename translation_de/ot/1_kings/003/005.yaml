  variant: modern standard German
source:
  edition: WLC
  text: בְּ/גִבְע֗וֹן נִרְאָ֧ה יְהֹוָ֛ה אֶל שְׁלֹמֹ֖ה בַּ/חֲל֣וֹם הַ/לָּ֑יְלָה וַ/יֹּ֣אמֶר אֱלֹהִ֔ים שְׁאַ֖ל מָ֥ה אֶתֶּן לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/005.yaml
  text: At Gibeon Yahweh appeared to Solomon in a dream at night[a], and God said, “Ask what I should give you.”
translation:
  language: de
  text: 'In Gibeon erschien Yahweh Salomo nachts im Traum[a], und Gott sagte: »Bitte um das, was ich dir geben soll.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »im Traum der Nacht«; gemeint ist ein Traum während der Nacht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּגִבְעוֹן
  choice: In Gibeon
  rationale: Die Präposition ב bezeichnet hier den Ort; bei Städtenamen ist »in Gibeon« im Deutschen natürlich und genau.
- source_word: נִרְאָה
  choice: erschien
  rationale: Das Nifal von ראה bezeichnet hier eine göttliche Erscheinung; »erschien« gibt die Wendung natürlich wieder, ohne deren Art näher festzulegen.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶל־שְׁלֹמֹה
  choice: Salomo
  rationale: Beim deutschen Verb »erscheinen« steht die Person idiomatisch im Dativ; die Richtung beziehungsweise der Empfänger der Erscheinung bleibt dadurch gewahrt.
- source_word: בַּחֲלוֹם הַלָּיְלָה
  choice: nachts im Traum
  rationale: Die hebräische Wendung lautet wörtlich »im Traum der Nacht«; die gewählte Form ist modernes Deutsch und bewahrt sowohl Traum als auch Nachtzeit.
- source_word: וַיֹּאמֶר
  choice: und ... sagte
  rationale: Das narrative Waw führt die Handlung weiter; »und« bildet dies ohne zusätzliche zeitliche Deutung ab.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die Wiedergabe erhält den Wechsel vom Gottesnamen יהוה zur Bezeichnung אֱלֹהִים.
- source_word: שְׁאַל
  choice: Bitte
  rationale: Der Imperativ von שאל kann hier im Sinn von »bitte/erbitte« verstanden werden; »Bitte« ist im Zusammenhang einer angebotenen Gabe knapp und idiomatisch.
- source_word: מָה אֶתֶּן לָךְ
  choice: was ich dir geben soll
  rationale: Nach dem Imperativ bildet die Wendung eine abhängige Frage; »soll« bewahrt die offene Aufforderung, die gewünschte Gabe zu nennen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen ausdrücklich. Die Transliteration macht diesen sichtbar, ohne ihn durch einen Titel zu ersetzen.
- issue: Wechsel von יהוה zu אֱלֹהִים
  choice: Yahweh ... Gott
  alternative: beide Bezeichnungen angleichen
  rationale: Der lexikalische Wechsel im selben Vers bleibt erhalten; so wird keine mögliche stilistische oder theologische Spannung geglättet.
- issue: Art der nächtlichen Offenbarung
  choice: erschien ... im Traum
  alternative: offenbarte sich
  rationale: »Erschien« bleibt näher am Verb und legt nicht über den Text hinaus fest, wie die Gotteserscheinung zu verstehen ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist knapp gehalten; der Wechsel »Yahweh ... Gott« und die etwas ungewöhnliche hebräische Traumformulierung werden transparent bewahrt.
