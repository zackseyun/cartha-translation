  text: וַ/תֹּ֣אמֶר הָ/אִשָּׁה֩ אֲשֶׁר בְּנָ֨/הּ הַ/חַ֜י אֶל הַ/מֶּ֗לֶךְ כִּֽי נִכְמְר֣וּ רַחֲמֶי/הָ֮ עַל בְּנָ/הּ֒ וַ/תֹּ֣אמֶר בִּ֣י אֲדֹנִ֗/י תְּנוּ לָ/הּ֙ אֶת הַ/יָּל֣וּד הַ/חַ֔י וְ/הָמֵ֖ת אַל תְּמִיתֻ֑/הוּ וְ/זֹ֣את אֹמֶ֗רֶת גַּם לִ֥/י גַם לָ֛/ךְ לֹ֥א יִהְיֶ֖ה גְּזֹֽרוּ־־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/026.yaml
  text: Then the woman whose son was alive said to the king[a], because her compassion was stirred for her son, and she said, "Please, my lord, give her the living child, and do not put him to death." But the other said, "It shall be neither mine nor yours[b]; cut him in two."
translation:
  language: de
  text: 'Da sagte die Frau, deren Sohn noch lebte, zum König, weil sich ihr tiefes Mitgefühl für ihren Sohn regte[a]: „Bitte, mein Herr, gebt ihr das lebende Kind und tötet es auf keinen Fall[b]!“ Die andere aber sagte: „Es soll weder mir noch dir gehören. Zerschneidet es!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier eine hebräische Wendung, nach der ihr inniges Erbarmen für ihren Sohn heftig bewegt oder erwärmt wurde.
    reason: cultural_note
  - marker: b
    text: 'Die hebräische Verbverbindung verstärkt das Verbot: Sie fleht eindringlich darum, das Kind keinesfalls zu töten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִכְמְרוּ רַחֲמֶיהָ
  choice: ihr tiefes Mitgefühl … regte sich
  rationale: Die hebräische Wendung verbindet das Erwärmen beziehungsweise heftige Bewegtwerden mit innigem Erbarmen. Die deutsche Formulierung gibt die starke mütterliche Regung natürlich wieder, ohne das im Deutschen missverständliche Körperbild wörtlich zu übertragen.
- source_word: בִּי אֲדֹנִי
  choice: Bitte, mein Herr
  rationale: בִּי dient hier als dringliche, ehrerbietige Bitte und ist nicht als gewöhnliche Präpositionalphrase zu verstehen.
- source_word: הַיָּלוּד הַחַי
  choice: das lebende Kind
  rationale: יַלוּד bezeichnet das Geborene beziehungsweise Kind. „Kind“ wahrt die Altersunschärfe und den Gegensatz zu dem toten Kind.
- source_word: וְהָמֵת אַל תְּמִיתֻהוּ
  choice: tötet es auf keinen Fall
  rationale: Die Verbindung des absoluten Infinitivs mit der finiten Verbform verstärkt das Verbot. „Auf keinen Fall“ erhält diesen Nachdruck in natürlichem Deutsch.
- source_word: וְזֹאת אֹמֶרֶת
  choice: Die andere aber sagte
  rationale: Das Demonstrativpronomen hebt kontrastierend die zweite Frau hervor; „die andere“ macht diesen Bezug im Deutschen klar.
- source_word: גַּם לִי גַם לָךְ לֹא יִהְיֶה
  choice: Es soll weder mir noch dir gehören
  rationale: Das Kind ist das unausgesprochene Subjekt. Wegen des grammatisch sächlichen deutschen Wortes „Kind“ steht „es“; „gehören“ gibt die possessive Aussage idiomatisch wieder.
- source_word: גְּזֹרוּ
  choice: Zerschneidet es!
  rationale: Der abrupte Imperativ bedeutet „schneiden/zerteilen“. Das aus dem vorherigen Befehl erschließbare Objekt wird im Deutschen ergänzt, während die Härte des Ausspruchs erhalten bleibt.
theological_decisions: []
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Die Pluralformen „gebt“, „tötet“ und „zerschneidet“ entsprechen den hebräischen Imperativen und können den König samt den ausführenden Dienern beziehungsweise den angeredeten Hofkreis einschließen. Die kausale Satzverknüpfung und der abrupte Kontrast zwischen den Frauen bleiben erhalten.
