  source_fidelity: 'Der deutsche Text gibt die Satzfolge und den Kontrast der hebräischen Vorlage zuverlässig wieder: die Frau des lebenden Kindes spricht aus aufgewühltem Erbarmen, bittet darum, das Kind der anderen Frau zu geben, und verstärkt das Tötungsverbot. Die gegensätzliche Aussage der zweiten Frau sowie ihr abrupter Befehl zum Zerschneiden bleiben erhalten. Die Pluralimperative entsprechen dem Hebräischen und können den König mit seinem Hofstaat bzw. seinen Vollstreckern anreden.'
  naturalness: Modernes, gut verständliches Standarddeutsch mit einem angemessen würdevollen erzählerischen Register. „Die andere aber sagte“ und „Es soll weder mir noch dir gehören“ sind idiomatisch. „Zerschneidet es!“ bewahrt die knappe, schockierende Härte des hebräischen Imperativs.
  terminology: „Mitgefühl“, „mein Herr“, „lebendes Kind“ und „auf keinen Fall“ sind kontextgerecht. Das Neutrum „es“ folgt natürlich dem deutschen Wort „Kind“, ohne den Bezug zu verdunkeln. Die Wiedergabe vermeidet unnötige dogmatische oder interpretative Zusätze.
