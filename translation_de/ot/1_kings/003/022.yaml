  text: וַ/תֹּאמֶר֩ הָ/אִשָּׁ֨ה הָ/אַחֶ֜רֶת לֹ֣א כִ֗י בְּנִ֤/י הַ/חַי֙ וּ/בְנֵ֣/ךְ הַ/מֵּ֔ת וְ/זֹ֤את אֹמֶ֨רֶת֙ לֹ֣א כִ֔י בְּנֵ֥/ךְ הַ/מֵּ֖ת וּ/בְנִ֣/י הֶ/חָ֑י וַ/תְּדַבֵּ֖רְנָה לִ/פְנֵ֥י הַ/מֶּֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/022.yaml
  text: But the other woman said[a], “No! My son is the living one, and your son is the dead one.” And this one said, “No! Your son is the dead one, and my son is the living one.” So they spoke before the king.
translation:
  language: de
  text: 'Doch die andere Frau sagte[a]: »Nein! Mein Sohn ist der Lebende, und dein Sohn ist der Tote.« Darauf sagte diese: »Nein! Dein Sohn ist der Tote, und mein Sohn ist der Lebende.« So redeten sie vor dem König.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, idiomatischer: »Mein Sohn lebt, und dein Sohn ist tot … dein Sohn ist tot, und mein Sohn lebt.« Der Haupttext bewahrt den hebräischen Gegensatz »der Lebende / der Tote«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: sagte
  rationale: Das gewöhnliche hebräische Erzählverb für direkte Rede wird im Deutschen natürlich mit »sagte« wiedergegeben.
- source_word: הָאִשָּׁה הָאַחֶרֶת
  choice: die andere Frau
  rationale: אִשָּׁה bezeichnet hier die andere der beiden streitenden Frauen; »Frau« ist kontextgerecht und legt keine eheliche Bedeutung nahe.
- source_word: לֹא כִי
  choice: Nein!
  rationale: Die Verbindung drückt einen scharfen Widerspruch aus; »Nein!« gibt die Heftigkeit idiomatisch wieder.
- source_word: בְּנִי הַחַי
  choice: mein Sohn ist der Lebende
  rationale: Der substantivierte Ausdruck mit Artikel stellt die beiden Kinder ausdrücklich als »den Lebenden« und »den Toten« einander gegenüber.
- source_word: וּבְנֵךְ הַמֵּת
  choice: und dein Sohn ist der Tote
  rationale: Die parallele substantivierte Form wahrt den pointierten Gegensatz und den streitartigen Ton des Hebräischen.
- source_word: וְזֹאת אֹמֶרֶת
  choice: Darauf sagte diese
  rationale: »Diese« bewahrt die hinweisende Kraft von זֹאת; »darauf« macht den unmittelbaren Gegenwiderspruch im Deutschen flüssig, ohne den Sinn aufzulösen.
- source_word: וַתְּדַבֵּרְנָה
  choice: So redeten sie
  rationale: Die feminine Pluralform fasst den Wortwechsel beider Frauen zusammen; »redeten« klingt hier natürlicher als das markiertere »sprachen«.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: vor dem König
  rationale: Dies entspricht der hebräischen Formulierung wörtlich und idiomatisch; der Name Salomo muss nicht ergänzt werden.
