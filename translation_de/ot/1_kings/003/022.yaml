translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte, beinahe formelhafte Wiederholung und der scharfe Widerspruch der Frauen bleiben erhalten; die ungewöhnlichere Wendung »der Lebende / der Tote« wird wegen der ausdrücklich kontrastierenden hebräischen Form bewahrt und in einer Fußnote erläutert.
