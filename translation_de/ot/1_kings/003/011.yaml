revisions:
- from: 'Da sagte Gott zu ihm: »Weil du darum gebeten hast und nicht für dich selbst um ein langes Leben, auch nicht für dich selbst um Reichtum und auch nicht um das Leben deiner Feinde, sondern um Einsicht, um auf das Recht zu hören,'
  to: 'Da sagte Gott zu ihm: »Weil du um dies gebeten hast und nicht um ein langes Leben für dich selbst, auch nicht um Reichtum für dich selbst und auch nicht um das Leben deiner Feinde, sondern um Einsicht, um Rechtsfälle anzuhören,'
  rationale: Die Revision beseitigt die im Deutschen missverständliche Wendung »auf das Recht zu hören«, erhält aber die gerichtliche Hör-Metapher und die bewusst offene Fortsetzung in den folgenden Vers. Ferner wird »diese Sache« explizit wiedergegeben. Die Aussage über die Feinde wird nicht über den Wortlaut hinaus als Tötungswunsch paraphrasiert.
