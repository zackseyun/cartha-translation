review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Abfolge und die Kontraste des Hebräischen zutreffend wieder: Bitte um »diese Sache«, nicht um langes Leben, Reichtum oder das Leben der Feinde, sondern um Einsicht. »Langes Leben« und »das Leben deiner Feinde« sind quellentreu. Die Verbindung לִשְׁמֹעַ מִשְׁפָּט bezieht sich im königlichen Kontext auf das Anhören bzw. Beurteilen von Rechtssachen.'
  naturalness: »auf das Recht zu hören« ist im heutigen Standarddeutsch nicht idiomatisch und kann vor allem im Sinn von »dem Recht gehorchen« verstanden werden. »Rechtsfälle anzuhören« ist natürlich und gibt die richterliche Hör-Metapher ohne zusätzliche theologische Deutung wieder. Die offene Satzperiode bleibt erhalten, da der Ausspruch in Vers 12 weitergeht.
  terminology: »Einsicht« ist für הָבִין angemessen. »Rechtsfälle« konkretisiert מִשְׁפָּט nur in dem durch den Kontext nahegelegten forensischen Sinn und bewahrt den Bezug zum Hören. Gottesbezeichnung und Personenbezüge sind korrekt.
