    issue: Unidiomatische und potenziell missverständliche Wiedergabe von לִשְׁמֹעַ מִשְׁפָּט
    rationale: Die Formulierung »auf das Recht zu hören« legt im Deutschen eher nahe, das Recht zu befolgen. Gemeint ist hier die für einen König erforderliche Fähigkeit, Rechtssachen anzuhören und zu beurteilen.
  - severity: low
