  text: וַ/יֹּ֨אמֶר אֱלֹהִ֜ים אֵלָ֗י/ו יַעַן֩ אֲשֶׁ֨ר שָׁאַ֜לְתָּ אֶת הַ/דָּבָ֣ר הַ/זֶּ֗ה וְ/לֹֽא שָׁאַ֨לְתָּ לְּ/ךָ֜ יָמִ֣ים רַבִּ֗ים וְ/לֹֽא שָׁאַ֤לְתָּ לְּ/ךָ֙ עֹ֔שֶׁר וְ/לֹ֥א שָׁאַ֖לְתָּ נֶ֣פֶשׁ אֹיְבֶ֑י/ךָ וְ/שָׁאַ֧לְתָּ לְּ/ךָ֛ הָבִ֖ין לִ/שְׁמֹ֥עַ מִשְׁפָּֽט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/011.yaml
  text: And God said to him, “Because you have asked for this thing, and have not asked for yourself many days, nor have asked for yourself riches, nor have asked for the life of your enemies, but have asked for yourself understanding to hear justice,”
translation:
  language: de
  text: 'Da sagte Gott zu ihm: »Weil du um dies gebeten hast und nicht um ein langes Leben für dich selbst, auch nicht um Reichtum für dich selbst und auch nicht um das Leben deiner Feinde, sondern um Einsicht, um Rechtsfälle anzuhören,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָמִים רַבִּים
  choice: ein langes Leben
  rationale: Wörtlich »viele Tage«; im Deutschen bezeichnet die Wendung idiomatisch eine lange Lebensdauer.
- source_word: נֶפֶשׁ אֹיְבֶיךָ
  choice: das Leben deiner Feinde
  rationale: נֶפֶשׁ meint hier das Leben der Feinde, also ihren Tod beziehungsweise ihre Beseitigung zu verlangen, ohne dies expliziter als der Ausgangstext zu formulieren.
- source_word: הָבִין
  choice: Einsicht
  rationale: Der Infinitiv bezeichnet hier die Fähigkeit, verständig beziehungsweise unterscheidend zu handeln.
- source_word: לִשְׁמֹעַ מִשְׁפָּט
  choice: um auf das Recht zu hören
  rationale: Bewahrt die ungewöhnliche, aber bedeutungsvolle Verbindung von »hören« und »Recht/Rechtsentscheid«; im königlichen Kontext geht es um aufmerksames Erfassen und gerechtes Entscheiden.
theological_decisions:
- issue: Bedeutung von מִשְׁפָּט
  choice: Recht
  alternative: Urteil / Recht sprechen
  rationale: »Recht« hält die semantische Breite zwischen Gerechtigkeit, Rechtsordnung und richterlicher Entscheidung offen und vermeidet eine unnötige Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt absichtlich offen, da der göttliche Ausspruch im folgenden Vers grammatisch fortgesetzt wird. Die Wiederholung »für dich selbst« spiegelt den Nachdruck des Hebräischen, während die negativen Glieder natürlich mit »auch nicht« verbunden sind.
