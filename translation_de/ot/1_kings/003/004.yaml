  text: וַ/יֵּ֨לֶךְ הַ/מֶּ֤לֶךְ גִּבְעֹ֨נָ/ה֙ לִ/זְבֹּ֣חַ שָׁ֔ם כִּ֥י הִ֖יא הַ/בָּמָ֣ה הַ/גְּדוֹלָ֑ה אֶ֤לֶף עֹלוֹת֙ יַעֲלֶ֣ה שְׁלֹמֹ֔ה עַ֖ל הַ/מִּזְבֵּ֥חַ הַ/הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/004.yaml
  text: And the king went to Gibeon to sacrifice there[a], for that was the great high place. Solomon offered a thousand burnt offerings on that altar.
translation:
  language: de
  text: Und der König ging nach Gibeon, um dort zu opfern, denn sie war die große Kulthöhe.[a] Tausend Brandopfer brachte Salomo auf jenem Altar dar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die bedeutende Kulthöhe«. Das hebräische Adjektiv kann Größe oder Bedeutung ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: ging
  rationale: Das narrative Wayyiqtol von הלך bezeichnet hier schlicht das Gehen beziehungsweise Reisen; ein Aufstieg wird vom Verb selbst nicht ausdrücklich ausgesagt.
- source_word: גִּבְעֹנָה
  choice: nach Gibeon
  rationale: Das direktionale He am Ortsnamen bezeichnet die Bewegung auf Gibeon zu; im Deutschen ist »nach Gibeon« idiomatisch.
- source_word: לִזְבֹּחַ
  choice: um dort zu opfern
  rationale: Der Infinitiv von זבח bezeichnet allgemein das Darbringen von Opfern; die finale Konstruktion wird natürlich mit »um … zu« wiedergegeben.
- source_word: כִּי הִיא הַבָּמָה הַגְּדוֹלָה
  choice: denn dort war die bedeutendste Kulthöhe
  rationale: במה ist ein kultischer Opfer- und Verehrungsort und wird mit dem etablierten historischen Ausdruck »Kulthöhe« wiedergegeben. Das bestimmte הַגְּדוֹלָה bezeichnet im Kontext wahrscheinlich den herausragenden beziehungsweise wichtigsten Ort, nicht zwingend die räumlich größte Anlage.
- source_word: אֶלֶף עֹלוֹת
  choice: tausend Brandopfer
  rationale: עֹלוֹת bezeichnet Ganzbrandopfer und nicht Opfer im Allgemeinen; die Zahl wird wörtlich beibehalten.
- source_word: יַעֲלֶה
  choice: brachte … dar
  rationale: Der Hifil von עלה ist zusammen mit עֹלוֹת die übliche Wendung für das Darbringen von Brandopfern. Das Yiqtol hat hier im Erzählzusammenhang Vergangenheitsbezug; eine gewohnheitsmäßige Handlung muss nicht angenommen werden.
- source_word: עַל הַמִּזְבֵּחַ הַהוּא
  choice: auf jenem Altar
  rationale: Die Formulierung bewahrt sowohl die örtliche Beziehung als auch die demonstrative Hervorhebung von הַהוּא.
theological_decisions:
- issue: Wiedergabe von בָּמָה im Zusammenhang des Gottesdienstes vor dem Tempelbau
  choice: Kulthöhe
  alternative: Heiligtum; Höhenheiligtum
  rationale: »Kulthöhe« bewahrt den besonderen religionsgeschichtlichen Begriff und damit die Spannung, dass Salomo an einem solchen Ort opfert, ohne den Ausdruck zu einem neutralen »Heiligtum« abzuschwächen.
- issue: Bedeutung von הַגְּדוֹלָה
  choice: die bedeutendste
  alternative: die große; die größte
  rationale: Der Kontext kann Rang und Vorrang bezeichnen, während das Adjektiv auch Größe ausdrücken kann. Die Übersetzung setzt die kontextuell wahrscheinliche Bedeutung in den Text und weist die echte lexikalische Alternative in der Fußnote aus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Kulthöhe« ist als historisch-religiöser Fachbegriff erforderlich, bleibt aber für heutige Leser verständlich. Die Satzstellung im zweiten Satz hebt entsprechend dem Hebräischen die Zahl der Brandopfer hervor.
