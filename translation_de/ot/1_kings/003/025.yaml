  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ גִּזְר֛וּ אֶת הַ/יֶּ֥לֶד הַ/חַ֖י לִ/שְׁנָ֑יִם וּ/תְנ֤וּ אֶֽת הַ/חֲצִי֙ לְ/אַחַ֔ת וְ/אֶֽת הַ/חֲצִ֖י לְ/אֶחָֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/025.yaml
  text: Then the king said[a], “Cut the living child in two, and give half to the one and half to the other.”
translation:
  language: de
  text: 'Da sagte der König: „Schneidet das lebende Kind entzwei und gebt die eine Hälfte der einen und die andere Hälfte der anderen[a].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Hebräischen zweimal „zu einer“; die femininen Formen beziehen sich auf die beiden Frauen in der Erzählung.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; „Da sagte“ gibt die zeitlich-folgernde Bewegung in natürlichem Deutsch wieder.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Direkte Wiedergabe des bestimmten Substantivs.
- source_word: גִּזְרוּ
  choice: Schneidet
  rationale: Der Imperativ Plural von גזר bezeichnet hier das tatsächliche Durchtrennen; „schneiden“ ist unmittelbar und anschaulich.
- source_word: הַיֶּלֶד הַחַי
  choice: das lebende Kind
  rationale: Das Adjektiv unterscheidet dieses Kind vom verstorbenen Kind im unmittelbaren Kontext.
- source_word: לִשְׁנָיִם
  choice: entzwei
  rationale: Die Wendung bezeichnet die Teilung in zwei Stücke; „entzwei“ ist knapp, idiomatisch und für den feierlich-erzählerischen Zusammenhang geeignet.
- source_word: וּתְנוּ
  choice: und gebt
  rationale: Der zweite koordinierte Imperativ Plural wird in gleicher Weise bewahrt.
- source_word: הַחֲצִי ... הַחֲצִי
  choice: die eine Hälfte ... die andere Hälfte
  rationale: Diese im Deutschen natürliche Verteilung gibt die beiden im Hebräischen wiederholten Hälften eindeutig wieder.
- source_word: לְאַחַת ... לְאֶחָת
  choice: der einen ... der anderen
  rationale: Die beiden femininen Formen beziehen sich im Kontext auf die zwei Frauen. Die deutsche distributive Wendung ist klar und fügt keine sachfremde Deutung hinzu.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der drastische Wortlaut des königlichen Befehls bleibt ohne Abschwächung erhalten; „entzwei“ wahrt zugleich die knappe Erzählweise.
