source:
  edition: WLC
  text: וְ/גַ֨ם אֲשֶׁ֤ר לֹֽא שָׁאַ֨לְתָּ֙ נָתַ֣תִּי לָ֔/ךְ גַּם עֹ֖שֶׁר גַּם כָּב֑וֹד אֲ֠שֶׁר לֹא הָיָ֨ה כָמ֥וֹ/ךָ אִ֛ישׁ בַּ/מְּלָכִ֖ים כָּל יָמֶֽי/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/013.yaml
  text: And I have also given you what you did not ask for[a], both riches and honor, so that there has been no man like you among the kings all your days.
translation:
  language: de
  text: 'Auch das, worum du nicht gebeten hast, habe ich dir gegeben: Reichtum und Ehre, sodass es unter den Königen während deines ganzen Lebens niemanden wie dich geben wird.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגַם
  choice: Auch
  rationale: Die additive Partikel führt eine weitere Gabe über das Erbetene hinaus ein; „Auch“ ist im Deutschen natürlich und bewahrt diesen Anschluss.
- source_word: אֲשֶׁר לֹא שָׁאַלְתָּ
  choice: das, worum du nicht gebeten hast
  rationale: Die relative Wendung wird idiomatisch wiedergegeben; „worum bitten“ entspricht hier dem Sinn des hebräischen Verbs.
- source_word: נָתַתִּי לָךְ
  choice: habe ich dir gegeben
  rationale: Das Perfekt bezeichnet die verbindlich gewährte Gabe; das deutsche Perfekt bringt ihre gegenwärtige Geltung natürlich zum Ausdruck.
- source_word: גַּם עֹשֶׁר גַּם כָּבוֹד
  choice: Reichtum und Ehre
  rationale: Das wiederholte גַּם zählt beide zusätzlichen Gaben auf. „Ehre“ passt im königlichen Vergleich besser als „Herrlichkeit“.
- source_word: אֲשֶׁר לֹא הָיָה כָמוֹךָ אִישׁ
  choice: sodass dir … niemand gleichen wird
  rationale: Die resultative Verbindung wird mit „sodass“ ausgedrückt. Die idiomatische deutsche Vergleichsform wahrt die Aussage, ohne das unnatürliche „kein Mann wie du“ zu erzwingen; der Zukunftsbezug ergibt sich aus „solange du lebst“.
- source_word: בַּמְּלָכִים
  choice: unter den Königen
  rationale: Die Präposition bezeichnet die Vergleichsgruppe, zu der Salomo gehört.
- source_word: כָּל יָמֶיךָ
  choice: solange du lebst
  rationale: Die hebräische Wendung bedeutet hier „während deiner gesamten Lebenszeit“; die deutsche Formulierung ist klar und gegenwärtig.
theological_decisions:
- issue: Zeitbezug der Aussage לֹא הָיָה … כָּל יָמֶיךָ
  choice: niemand gleichen wird, solange du lebst
  alternative: niemand gleich gewesen ist in all deinen Tagen
  rationale: Obwohl הָיָה formal perfektisch ist, richtet sich Gottes Zusage auf Salomos noch bevorstehende Lebenszeit. Die Zukunftsform gibt diesen kontextuellen Sinn wieder; die Fußnote bewahrt die formnähere mögliche Wiedergabe.
- issue: Wiedergabe von אִישׁ im königlichen Vergleich
  choice: niemand
  alternative: kein Mann
  rationale: אִישׁ steht in einer negierten Existenz- und Vergleichsaussage idiomatisch für „niemand“. Da die Vergleichsgruppe ausdrücklich die Könige sind, geht der männliche historische Bezug nicht verloren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung hebt die zusätzliche, nicht erbetene Gabe hervor; der Doppelpunkt macht die Aufzählung von Reichtum und Ehre transparent.
