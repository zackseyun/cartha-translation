  source_fidelity: 'Die Hauptaussage wird zutreffend wiedergegeben: Gott gewährt zusätzlich zu Salomos Bitte Reichtum und Ehre und verheißt seine Unvergleichlichkeit unter den Königen für seine Lebenszeit. Die zukunftsbezogene deutsche Wiedergabe ist im Kontext einer göttlichen Zusage vertretbar, obwohl הָיָה formal ein Perfekt ist.'
