  terminology: „Reichtum und Ehre“ ist treffend. „Unter den Königen“ gibt die Vergleichsgruppe angemessen wieder. „Niemanden wie dich“ ist in dieser negierten Vergleichsaussage idiomatisches modernes Deutsch und schränkt die durch den Kontext männliche königliche Vergleichsgruppe nicht ein.
