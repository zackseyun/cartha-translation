  yaml_path: translation/ot/1_kings/003/027.yaml
  text: Then the king answered and said[a], “Give her the living child, and by no means put him to death; she is his mother.”
translation:
  language: de
  text: 'Da antwortete der König und sagte: „Gebt ihr das lebende Kind und tötet es auf keinen Fall[a]! Sie ist seine Mutter.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch mit einer nachdrücklichen Verbform: Das Verb „töten“ wird wiederholt, um das Verbot zu verstärken; gemeint ist: „Ihr dürft es keinesfalls töten.“'
    reason: Die Fußnote erklärt die Kombination von Infinitivus absolutus und finitem Verb als emphatische Verstärkung, ohne eine ungenaue wörtliche deutsche Entsprechung zu behaupten.
lexical_decisions:
- source_word: וַיַּעַן הַמֶּלֶךְ וַיֹּאמֶר
  choice: Da antwortete der König
  rationale: Die hebräische Doppelformel bedeutet wörtlich „der König antwortete und sagte“. Im modernen Deutschen gibt „antwortete“ die Redeeinleitung natürlich und vollständig wieder, ohne das schwerfällige „antwortete und sagte“.
- source_word: תְּנוּ לָהּ
  choice: Gebt ihr
  rationale: Der Pluralimperativ richtet sich an die Umstehenden oder Diener; der Dativ „ihr“ gibt das indirekte Objekt idiomatisch wieder.
- source_word: הַיָּלוּד הַחַי
  choice: das lebende Kind
  rationale: יַלוּד bezeichnet hier das geborene Kind beziehungsweise den Säugling, הַחַי kennzeichnet es als lebend. „Das lebende Kind“ ist präzise und im Kontext natürlich.
- source_word: וְהָמֵת לֹא תְמִיתֻהוּ
  choice: und tötet es auf keinen Fall
  rationale: Die Verbindung des Infinitivus absolutus mit der finiten Hifilform verstärkt das Verbot. „Auf keinen Fall“ bewahrt diesen Nachdruck in natürlichem Deutsch; das Neutrum „es“ stimmt mit „das Kind“ überein.
- source_word: הִיא אִמּוֹ
  choice: Sie ist seine Mutter
  rationale: Die verblosen hebräische Aussage identifiziert die Frau eindeutig als Mutter des Kindes. Das maskuline Suffix wird im Deutschen idiomatisch mit „seine“ wiedergegeben.
