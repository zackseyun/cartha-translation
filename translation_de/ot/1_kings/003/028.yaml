  text: And all Israel heard of the judgment that the king had rendered[a], and they feared the king[b], because they saw that the wisdom of God was within him to administer justice.
translation:
  language: de
  text: Und ganz Israel hörte von dem Urteil, das der König gefällt hatte. Da empfanden sie Ehrfurcht vor dem König[a], denn sie erkannten, dass Gottes Weisheit in ihm war, um Recht zu sprechen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Da fürchteten sie sich vor dem König“ oder „Da hatten sie Ehrfurcht vor dem König.“ Das hebräische Verb kann Furcht, ehrfürchtige Scheu oder Achtung vor anerkannter Autorität ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „um Recht zu üben“ oder „um Urteil zu fällen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: hörte von
  rationale: Das Verb bedeutet grundsätzlich „hören“; mit dem Urteil als Gegenstand gibt „von dem Urteil hören“ im Deutschen natürlich wieder, dass die Nachricht im Volk bekannt wurde.
- source_word: כָל יִשְׂרָאֵל
  choice: ganz Israel
  rationale: Bewahrt die kollektive Bezeichnung des Volkes und den biblischen Erzählstil.
- source_word: הַמִּשְׁפָּט אֲשֶׁר שָׁפַט הַמֶּלֶךְ
  choice: das Urteil, das der König gefällt hatte
  rationale: Die Verbindung aus מִשְׁפָּט und שׁפט bezeichnet hier die richterliche Entscheidung; „ein Urteil fällen“ ist die entsprechende natürliche deutsche Rechtsformulierung.
- source_word: וַיִּרְאוּ מִפְּנֵי הַמֶּלֶךְ
  choice: Da empfanden sie Ehrfurcht vor dem König
  rationale: ירא mit מִפְּנֵי umfasst Furcht, Scheu und ehrfürchtige Achtung. „Ehrfurcht empfinden“ passt zum Kontext der anerkannten, von Gott gegebenen Weisheit, ohne die Furchtnuance ganz auszuschließen; diese bleibt in der Fußnote sichtbar.
- source_word: כִּי רָאוּ
  choice: denn sie erkannten
  rationale: Wörtlich „denn/weil sie sahen“; hier bezeichnet das Sehen das Wahrnehmen und Erkennen der im Urteil offenbar gewordenen Weisheit.
- source_word: חָכְמַת אֱלֹהִים
  choice: Gottes Weisheit
  rationale: Gibt die hebräische Genitivverbindung direkt wieder und bewahrt den ausdrücklichen Bezug auf Gott.
- source_word: בְּקִרְבּוֹ
  choice: in ihm war
  rationale: Die Wendung bezeichnet die Weisheit als in Salomo gegenwärtig; „in ihm“ ist im Deutschen knapp und natürlich.
- source_word: לַעֲשׂוֹת מִשְׁפָּט
  choice: um Recht zu schaffen
  rationale: Die Infinitivverbindung beschreibt die Ausübung richterlicher Gerechtigkeit. „Recht schaffen“ bewahrt die aktive und über den einzelnen Urteilsspruch hinausgehende Bedeutung.
theological_decisions:
- issue: Wiedergabe von אֱלֹהִים im Zusammenhang königlicher Weisheit
  choice: Gott
  alternative: göttlich
  rationale: Der hebräische Text nennt ausdrücklich Gott und schreibt ihm die in Salomo wirksame Weisheit zu; eine bloß adjektivische Wiedergabe würde diesen Bezug abschwächen.
- issue: Bedeutung von וַיִּרְאוּ מִפְּנֵי הַמֶּלֶךְ
  choice: sie empfanden Ehrfurcht vor dem König
  alternative: sie fürchteten den König
  rationale: Der Zusammenhang verbindet die Reaktion des Volkes mit der erkannten Weisheit Gottes. „Ehrfurcht“ hält achtungsvolle Scheu und Furcht zusammen; die direktere Alternative wird in der Fußnote genannt.
- issue: Reichweite von לַעֲשׂוֹת מִשְׁפָּט
  choice: um Recht zu schaffen
  alternative: um Urteil zu sprechen
  rationale: Die Wendung kann sowohl konkrete Rechtsprechung als auch die umfassendere Ausübung von Gerechtigkeit bezeichnen. Die gewählte Fassung erhält diese weitere Bedeutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Rechtssprache. Die Satzteilung verbessert die Lesbarkeit, ohne den erzählerischen Zusammenhang zu verändern. „Ganz Israel“ bewahrt die kollektive biblische Ausdrucksweise; die Fußnoten halten die echte Bedeutungsbreite der zentralen hebräischen Wendungen offen.
