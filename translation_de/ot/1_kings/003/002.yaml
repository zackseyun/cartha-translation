source:
  edition: WLC
  text: רַ֣ק הָ/עָ֔ם מְזַבְּחִ֖ים בַּ/בָּמ֑וֹת כִּ֠י לֹא נִבְנָ֥ה בַ֨יִת֙ לְ/שֵׁ֣ם יְהוָ֔ה עַ֖ד הַ/יָּמִ֥ים הָ/הֵֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/002.yaml
  text: Only the people were sacrificing at the high places[a], because no house had yet been built for the name of Yahweh in those days.
translation:
  language: de
  text: Das Volk opferte allerdings auf den Höhen[a], denn bis dahin war noch kein Haus für den Namen Jahwes gebaut worden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die „Höhen“ waren örtliche Kultstätten, an denen Opfer dargebracht wurden. Mit dem „Haus für den Namen Jahwes“ ist der später in Jerusalem gebaute Tempel gemeint.
    reason: Erläuterung eines kultischen Fachbegriffs und des Tempelbezugs von „Haus“.
lexical_decisions:
- source_word: רַק
  choice: Nur
  rationale: Markiert die Einschränkung gegenüber der vorausgehenden positiven Beurteilung Salomos knapp und natürlich.
- source_word: הָעָם
  choice: das Volk
  rationale: Bezeichnet hier allgemein die Bevölkerung, ohne einen technischen Gegensatz zu den führenden Schichten vorauszusetzen.
- source_word: מְזַבְּחִים
  choice: opferte … noch
  rationale: Der Partizipialgebrauch beschreibt eine fortdauernde beziehungsweise übliche Praxis; das deutsche Präteritum mit „noch“ gibt diesen zeitlichen Zusammenhang natürlich wieder.
- source_word: בַּבָּמוֹת
  choice: auf den Höhen
  rationale: „Höhen“ ist die eingebürgerte Bezeichnung für örtliche Kultstätten und bewahrt zugleich das konkrete Bild des Hebräischen.
- source_word: כִּי
  choice: denn
  rationale: Leitet die Begründung für die Opferpraxis ein und verbindet die beiden Aussagen in einem würdigen, natürlichen Satz.
- source_word: לֹא נִבְנָה בַיִת
  choice: war noch kein Haus … gebaut worden
  rationale: Bewahrt das hebräische „Haus“ und gibt den passiven Zustand bis zu diesem Zeitpunkt wieder.
- source_word: לְשֵׁם יְהוָה
  choice: für den Namen Jahwes
  rationale: Erhält die theologisch bedeutsame Namensformel, statt sie zu „für Jahwe“ zu verflachen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text ausdrücklich stehenden Gottesnamen in der im Deutschen geläufigen Form wieder.
- source_word: עַד הַיָּמִים הָהֵם
  choice: bis zu jener Zeit
  rationale: Gibt die zeitliche Grenze idiomatisch wieder; die wörtliche Form „bis zu jenen Tagen“ wäre im Deutschen missverständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt das Tetragramm ausdrücklich; „Jahwe“ bewahrt den Eigennamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Deutung von בַיִת
  choice: Haus im Haupttext, Tempelbedeutung in der Fußnote erläutert
  alternative: Tempel
  rationale: „Haus“ entspricht unmittelbar dem hebräischen Lexem; im Zusammenhang bezeichnet es das spätere Heiligtum in Jerusalem.
- issue: Bewertung der Opfer auf den Höhen
  choice: Keine zusätzliche moralische Qualifizierung
  alternative: Die Praxis ausdrücklich als unerlaubt bezeichnen
  rationale: Der Vers erklärt die Praxis durch das Fehlen des Hauses, bewertet sie hier aber nicht ausdrücklich; diese Spannung bleibt erhalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Stellung von „nur“ und „noch“ wahrt den einschränkenden Übergang und die andauernde Opferpraxis, ohne den Vers unnötig auszudeuten.
