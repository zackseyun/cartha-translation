base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/015.yaml
  text: Then Solomon awoke[a], and behold, it was a dream. And he came to Jerusalem and stood before the ark of the covenant of the LORD, and offered up burnt offerings and made peace offerings, and made a feast for all his servants.
translation:
  language: de
  text: Da erwachte Salomo, und siehe, es war ein Traum. Dann kam er nach Jerusalem, stellte sich vor die Lade des Bundes des HERRN, brachte Brandopfer dar und opferte Friedensopfer[a]. Und er veranstaltete ein Festmahl für alle seine Diener.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Gemeinschaftsopfer“; die Bezeichnung kann die beim gemeinsamen Opfermahl erfahrene Gemeinschaft hervorheben.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַץ
  choice: erwachte
  rationale: Das Verb bezeichnet das Erwachen aus dem Schlaf; „erwachte“ ist im Deutschen eine natürliche, erzählerisch passende Wiedergabe.
- source_word: וְהִנֵּה
  choice: und siehe
  rationale: Die Aufmerksamkeitspartikel hebt Salomos plötzliche Erkenntnis hervor. „Und siehe“ bewahrt diese rhetorische Wirkung, ohne sie erklärend aufzulösen.
- source_word: חֲלוֹם
  choice: es war ein Traum
  rationale: Im Hebräischen steht knapp „siehe, ein Traum“. Die Ergänzung „es war“ ergibt einen natürlichen deutschen Satz und macht nur die im Zusammenhang erkennbare Feststellung ausdrücklich.
- source_word: וַיָּבוֹא יְרוּשָׁלִַם
  choice: Dann kam er nach Jerusalem
  rationale: בוא bedeutet hier „kommen/gelangen“. „Kam“ bleibt näher am Wortlaut als das interpretierende „kehrte zurück“.
- source_word: וַיַּעֲמֹד לִפְנֵי
  choice: trat vor
  rationale: Die Wendung bezeichnet das Sich-Hinstellen beziehungsweise Erscheinen vor jemandem oder etwas. „Trat vor“ ist im Deutschen natürlicher als „stand vor“ und bewahrt den feierlichen Vorgang.
- source_word: אֲרוֹן בְּרִית אֲדֹנָי
  choice: die Lade des Bundes des HERRN
  rationale: Die Wiedergabe bildet die hebräische Genitivverbindung transparent ab und verwendet für die Gottesbezeichnung die im Projekt vorgesehene Form „HERR“.
- source_word: עֹלוֹת
  choice: Brandopfer
  rationale: „Brandopfer“ ist die etablierte deutsche Bezeichnung für diese Opferart, bei der das Opfer vollständig auf dem Altar verbrannt wurde.
- source_word: וַיַּעַל
  choice: brachte … dar
  rationale: Der Hifil von עלה bezeichnet im Opferzusammenhang das Darbringen auf dem Altar. „Darbringen“ gibt diesen kultischen Sinn idiomatisch wieder.
- source_word: שְׁלָמִים
  choice: Friedensopfer
  rationale: „Friedensopfer“ ist die traditionelle, lexikalisch nahe Bezeichnung der Opferart; die mögliche Betonung von Gemeinschaft und gemeinsamem Opfermahl wird in der Fußnote genannt.
- source_word: מִשְׁתֶּה
  choice: Festmahl
  rationale: Das Substantiv bezeichnet ein Fest oder Bankett, oft einschließlich des Trinkens. „Festmahl“ passt zum feierlichen Zusammenhang und ist allgemein verständlich.
- source_word: לְכָל עֲבָדָיו
  choice: für alle seine Diener
  rationale: עֲבָדִים kann Diener, Bedienstete oder königliche Amtsträger bezeichnen. „Diener“ ist die direkte, bewusst breite Wiedergabe.
theological_decisions:
- issue: Wiedergabe der Gottesbezeichnung in אֲרוֹן בְּרִית אֲדֹנָי
  choice: des HERRN
  alternative: des Herrn
  rationale: Die Form wird als feierliche Bezeichnung für Israels Gott im Bundeszusammenhang wiedergegeben. „HERR“ entspricht der Projektkonvention für die covenantale Gottesbezeichnung, ohne eine weitergehende dogmatische Deutung einzutragen.
- issue: Bedeutungsumfang von שְׁלָמִים
  choice: Friedensopfer
  alternative: Gemeinschaftsopfer
  rationale: Der Ausdruck benennt eine bestimmte Opfergattung und kann sowohl Frieden beziehungsweise Wohlergehen als auch die beim Opfermahl erfahrene Gemeinschaft anklingen lassen. Der Haupttext verwendet die etablierte Bezeichnung; die Alternative bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählfolge. Das traditionelle „und siehe“ bleibt wegen der markanten hebräischen Aufmerksamkeitspartikel erhalten. Kultische Fachbegriffe werden verständlich und konsistent wiedergegeben; eine echte lexikalische Alternative wird durch die Fußnote offengehalten.
