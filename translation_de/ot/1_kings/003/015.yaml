  revised_text: Da erwachte Salomo, und siehe, es war ein Traum. Dann kam er nach Jerusalem, stellte sich vor die Lade des Bundes des HERRN, brachte Brandopfer dar und opferte Friedensopfer[a]. Und er veranstaltete ein Festmahl für alle seine Diener.
  revised_footnotes:
