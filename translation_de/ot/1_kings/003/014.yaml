source:
  edition: WLC
  text: וְ/אִ֣ם תֵּלֵ֣ךְ בִּ/דְרָכַ֗/י לִ/שְׁמֹ֤ר חֻקַּ/י֙ וּ/מִצְוֺתַ֔/י כַּ/אֲשֶׁ֥ר הָלַ֖ךְ דָּוִ֣יד אָבִ֑י/ךָ וְ/הַאַרַכְתִּ֖י אֶת יָמֶֽי/ךָ׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/014.yaml
  text: And if you walk in my ways[a], keeping my statutes and my commandments, as David your father walked, then I will lengthen your days.
translation:
  language: de
  text: Und wenn du auf meinen Wegen gehst, indem du meine Satzungen und Gebote hältst, wie dein Vater David es tat, dann werde ich dein Leben verlängern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „deine Tage verlängern“.'
    reason: Die Fußnote bewahrt die konkrete hebräische Ausdrucksweise hinter der idiomatischen Wiedergabe „dein Leben verlängern“.
lexical_decisions:
- source_word: וְאִם
  choice: Und wenn
  rationale: Bewahrt den Anschluss an die vorausgehende Gottesrede und leitet die Bedingung klar ein.
- source_word: תֵּלֵךְ בִּדְרָכַי
  choice: du auf meinen Wegen gehst
  rationale: Erhält das hebräische Bild für eine an Gottes Willen ausgerichtete Lebensführung; im Deutschen ist die Präposition „auf“ idiomatisch.
- source_word: לִשְׁמֹר
  choice: indem du … hältst
  rationale: Gibt den Infinitiv als nähere Bestimmung dazu wieder, wie das Gehen auf Gottes Wegen konkret aussieht.
- source_word: חֻקַּי וּמִצְוֺתַי
  choice: meine Satzungen und Gebote
  rationale: Bewahrt die zwei unterschiedlichen Rechtsbegriffe und den würdigen Bundeswortschatz.
- source_word: כַּאֲשֶׁר הָלַךְ
  choice: wie … es tat
  rationale: Vermeidet im Deutschen die schwerfällige unmittelbare Wiederholung von „gehen“, während der Rückbezug auf Davids Lebensführung eindeutig bleibt.
- source_word: דָּוִיד אָבִיךָ
  choice: dein Vater David
  rationale: Natürliche deutsche Wortstellung; „Vater“ bezeichnet hier den Vorfahren.
- source_word: וְהַאַרַכְתִּי אֶת יָמֶיךָ
  choice: dann werde ich dein Leben verlängern
  rationale: Gibt die hebräische Wendung „deine Tage verlängern“ in klarem modernem Deutsch wieder; „dann“ markiert idiomatisch den Folgesatz der Bedingung.
theological_decisions:
- issue: Bedingte Zusage langen Lebens aufgrund des Gehorsams
  choice: Die Bedingung und die konkrete Zusage verlängerten Lebens werden unmittelbar wiedergegeben.
  alternative: Die Aussage als unbedingte dynastische Verheißung oder nur allgemein als Segen umschreiben.
  rationale: Der hebräische Text verbindet die Zusage ausdrücklich durch וְאִם mit Salomos Wandel und Gehorsam; diese Spannung darf nicht abgeschwächt oder durch spätere Kategorien aufgelöst werden.
- issue: David als Vergleichsmaßstab
  choice: Davids Lebensführung bleibt ohne harmonisierende Erläuterung der Vergleichspunkt.
  alternative: Den Vergleich ausdrücklich auf Davids grundsätzliche Treue beschränken oder seine Verfehlungen im Text relativierend erwähnen.
  rationale: Der Vers selbst setzt David als Vergleich ein, ohne hier die Aussage näher zu qualifizieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Wegmotiv bleibt erhalten; juristisch-bundestheologische Begriffe werden als „Satzungen und Gebote“ differenziert. Die Fußnotenmarke steht unmittelbar nach der betreffenden Aussage.
