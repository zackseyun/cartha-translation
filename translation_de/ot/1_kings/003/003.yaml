  to: Salomo liebte Jahwe und lebte nach den Ordnungen seines Vaters David. Nur opferte er auf den Höhen[a] und verbrannte Räucherwerk.[b]
  rationale: Die Revision gibt die einschränkende Funktion von רַק mit „nur“ direkter wieder, vermeidet die nicht erforderliche Spezifizierung „Schlachtopfer“ und stellt die beiden kultischen Verben klar nebeneinander. Die Fußnote zu „Räucherwerk“ bewahrt die lexikalische Offenheit von קטר, ohne den deutschen Haupttext unnötig unbestimmt zu machen.
