source:
  edition: WLC
  text: וַ/יֶּאֱהַ֤ב שְׁלֹמֹה֙ אֶת יְהוָ֔ה לָ/לֶ֕כֶת בְּ/חֻקּ֖וֹת דָּוִ֣ד אָבִ֑י/ו רַ֚ק בַּ/בָּמ֔וֹת ה֥וּא מְזַבֵּ֖חַ וּ/מַקְטִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/003.yaml
  text: Solomon loved Yahweh[a], walking in the statutes of David his father; only[b], he was sacrificing and burning incense at the high places.
translation:
  language: de
  text: Salomo liebte Jahwe und lebte nach den Ordnungen seines Vaters David. Nur opferte er auf den Höhen[a] und verbrannte Räucherwerk.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Höhen“ waren örtliche Kultstätten, die häufig auf Anhöhen lagen.
    reason: cultural_note
  - marker: b
    text: Das hebräische Verb kann auch das Verbrennen anderer Opfergaben bezeichnen.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: liebte
  rationale: Das Verb אהב bezeichnet unmittelbar Liebe bzw. Zuneigung; „liebte“ bewahrt die positive Wertung des Erzählers.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לָלֶכֶת בְּחֻקּוֹת
  choice: lebte nach den Ordnungen
  rationale: Das hebräische Bild des Gehens beschreibt die Lebensführung. Die natürliche deutsche Wendung „nach den Ordnungen leben“ vermittelt sowohl den fortdauernden Lebenswandel als auch den verbindlichen Charakter von חֻקּוֹת.
- source_word: דָּוִד אָבִיו
  choice: seines Vaters David
  rationale: Diese Wortstellung ist im Deutschen natürlich und bewahrt die Beziehung Davids zu Salomo.
- source_word: רַק
  choice: allerdings
  rationale: רַק schränkt die vorausgehende positive Aussage ein. „Allerdings“ markiert diese Spannung klar, ohne die Kritik zu übersteigern.
- source_word: בַּבָּמוֹת
  choice: auf den Höhen
  rationale: במות bezeichnet örtliche Kultstätten, häufig auf Anhöhen. „Höhen“ ist die knappe traditionelle Sachbezeichnung; eine Fußnote erklärt sie.
- source_word: מְזַבֵּחַ
  choice: brachte ... Schlachtopfer dar
  rationale: Das Partizip bezeichnet eine gewohnheitsmäßige Opferpraxis; „brachte ... dar“ ist im Deutschen idiomatisch, und „Schlachtopfer“ grenzt den Vorgang von der folgenden Rauchopferhandlung ab.
- source_word: וּמַקְטִיר
  choice: ließ Opfer in Rauch aufgehen
  rationale: Das Hifil von קטר kann das Verbrennen von Räucherwerk oder anderen Opfergaben bezeichnen. Die breitere Formulierung bewahrt diese lexikalische Offenheit, statt den Gegenstand auf Weihrauch festzulegen.
theological_decisions:
- issue: Erzählerische Bewertung von Salomos Gottesverehrung
  choice: Salomos Liebe zu Jahwe wird positiv festgestellt, aber durch seine Opferpraxis auf den Höhen eingeschränkt.
  alternative: Die Anfangsaussage könnte als stark gedämpft oder ironisch verstanden werden; umgekehrt könnte die Höhenverehrung zu diesem Zeitpunkt als völlig gebilligt gelten.
  rationale: Die Satzfolge beginnt mit einer positiven Aussage und führt mit רַק eine Einschränkung ein. Die Übersetzung erhält diese Spannung zwischen Anerkennung und Vorbehalt.
- issue: Gegenstand des mit קטר bezeichneten Verbrennens
  choice: Die Übersetzung spricht allgemein davon, Opfer in Rauch aufgehen zu lassen.
  alternative: „Räucherwerk verbrennen“ oder „Weihrauch darbringen“.
  rationale: קטר kann im Kultzusammenhang Räucherwerk, aber auch andere auf dem Altar verbrannte Opfergaben betreffen. Der Kontext legt hier keine eindeutige Beschränkung auf Weihrauch fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die idiomatische Wendung „lebte nach“ gibt das hebräische Bild des Gehens verständlich wieder. „Allerdings“ erhält die einschränkende Funktion von רַק. Die beiden Partizipien werden als wiederholte bzw. übliche Praxis dargestellt; die Formulierung zu קטר wahrt die im Hebräischen vorhandene sachliche Offenheit.
