  text: וַ/יִּתְחַתֵּ֣ן שְׁלֹמֹ֔ה אֶת פַּרְעֹ֖ה מֶ֣לֶךְ מִצְרָ֑יִם וַ/יִּקַּ֣ח אֶת בַּת פַּרְעֹ֗ה וַ/יְבִיאֶ֨/הָ֙ אֶל עִ֣יר דָּוִ֔ד עַ֣ד כַּלֹּת֗/וֹ לִ/בְנ֤וֹת אֶת בֵּית/וֹ֙ וְ/אֶת בֵּ֣ית יְהוָ֔ה וְ/אֶת חוֹמַ֥ת יְרוּשָׁלִַ֖ם סָבִֽיב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/001.yaml
  text: Solomon formed a marriage alliance with Pharaoh king of Egypt[a], and he took Pharaoh’s daughter and brought her into the city of David until he had finished building his own house, and the house of Yahweh[b], and the wall around Jerusalem.
translation:
  language: de
  text: Salomo ging mit dem Pharao, dem König von Ägypten, eine Heiratsverbindung ein[a], nahm die Tochter des Pharaos zur Frau und brachte sie in die Stadt Davids, wo sie blieb, bis er den Bau seines Hauses, des Hauses Jahwes[b] und der Mauer rings um Jerusalem vollendet hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Salomo verschwägerte sich mit dem Pharao.“ Das hebräische Verb bezeichnet das Eingehen einer verwandtschaftlichen Beziehung durch Heirat und kann hier zugleich politische Bündnisabsichten anklingen lassen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „des Tempels Jahwes“. Wörtlich steht im Hebräischen „Haus Jahwes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַתֵּן
  choice: ging … eine Heiratsverbindung ein
  rationale: Das Hitpael von חתן bezeichnet das Eingehen einer verwandtschaftlichen Beziehung durch Heirat. „Heiratsverbindung“ wahrt sowohl den familiären als auch den im königlichen Kontext naheliegenden politischen Aspekt.
- source_word: אֶת פַּרְעֹה מֶלֶךְ מִצְרָיִם
  choice: mit dem Pharao, dem König von Ägypten
  rationale: Die Apposition identifiziert den Pharao als König von Ägypten; die deutsche Formulierung ist eindeutig und natürlich.
- source_word: וַיִּקַּח אֶת בַּת פַּרְעֹה
  choice: Er nahm die Tochter des Pharaos zur Frau
  rationale: לקח mit einer Frau als Objekt ist eine übliche Wendung für die Eheschließung. „Zur Frau nehmen“ gibt den idiomatischen Sinn im Deutschen klar wieder.
- source_word: וַיְבִיאֶהָ אֶל עִיר דָּוִד
  choice: und brachte sie in die Stadt Davids
  rationale: Die Formulierung gibt die Bewegung zum genannten Aufenthaltsort knapp und quellennah wieder.
- source_word: עַד כַּלֹּתוֹ לִבְנוֹת
  choice: bis er den Bau … vollendet hatte
  rationale: עַד mit dem Infinitiv und Suffix markiert den zeitlichen Endpunkt. Das Plusquamperfekt bildet die zeitliche Beziehung im Deutschen natürlich ab.
- source_word: אֶת בֵּיתוֹ
  choice: seines eigenen Hauses
  rationale: „Haus“ wahrt die Grundbedeutung von בית, während „eigenen“ den Gegensatz zum Haus Jahwes verdeutlicht, ohne ausdrücklich „Palast“ einzutragen.
- source_word: וְאֶת בֵּית יְהוָה
  choice: des Hauses Jahwes
  rationale: Die wörtliche Metapher „Haus“ bleibt erhalten; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: וְאֶת חוֹמַת יְרוּשָׁלִַם סָבִיב
  choice: und der Mauer rings um Jerusalem
  rationale: Die Wendung gibt sowohl die singularische „Mauer“ als auch den umfassenden Sinn von סָבִיב idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ gibt ihn im modernen Standarddeutsch als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von בֵּית יְהוָה
  choice: Haus Jahwes
  alternative: Tempel Jahwes
  rationale: „Haus“ bewahrt das konkrete Bild und die lexikalische Verbindung zu Salomos eigenem Haus. „Tempel“ wäre sachlich verständlich, aber interpretierender.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange hebräische Satz bleibt als ein Satz erhalten, wird jedoch durch einen Doppelpunkt und eine klare Aufzählungsstruktur lesbar gemacht. „Heiratsverbindung“ hält familiäre und politische Dimension zusammen; „zur Frau“ macht den hebräischen Heiratsausdruck auf Deutsch eindeutig.
