  naturalness: „Heiratsverbindung“ und „zur Frau nehmen“ sind modernes, würdiges Standarddeutsch. Der Doppelpunkt nach der Fußnotenmarkierung ist weniger flüssig als eine koordinierende Satzverbindung. Mit „wo sie blieb“ wird die zeitliche Beziehung idiomatisch und ohne inhaltliche Erweiterung verständlich.
