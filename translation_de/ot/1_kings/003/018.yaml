  yaml_path: translation/ot/1_kings/003/018.yaml
  text: And on the third day after I gave birth[a], this woman also gave birth. And we were together; there was no stranger with us in the house, only the two of us were in the house.
translation:
  language: de
  text: Am dritten Tag nach meiner Entbindung gebar auch diese Frau. Wir waren zusammen; kein Außenstehender war mit uns im Haus, nur wir beide waren im Haus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „kein Fremder“. Das hebräische Wort kann eine Person bezeichnen, die nicht zur betreffenden Gruppe oder zum Haushalt gehört.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשְּׁלִישִׁי לְלִדְתִּי
  choice: Am dritten Tag nach meiner Entbindung
  rationale: Die Erzählungsform וַיְהִי wird im Deutschen natürlich durch den einsetzenden Zeitausdruck wiedergegeben. לְ mit Infinitiv constructus und Suffix bezeichnet hier den zeitlichen Bezug zur Entbindung der Sprecherin.
- source_word: וַתֵּלֶד גַּם הָאִשָּׁה הַזֹּאת
  choice: gebar auch diese Frau
  rationale: „Diese Frau“ bewahrt den deiktischen und im Gerichtsrahmen pointierten Ausdruck; „auch“ gibt גַּם wieder.
- source_word: וַאֲנַחְנוּ יַחְדָּו
  choice: Wir waren zusammen
  rationale: יַחְדָּו bedeutet „zusammen“. Dass niemand sonst anwesend war, wird erst durch den folgenden Satz ausdrücklich gesagt.
- source_word: אֵין זָר אִתָּנוּ בַּבַּיִת
  choice: kein Fremder war bei uns im Haus
  rationale: זָר bezeichnet einen Fremden beziehungsweise Außenstehenden. „Fremder“ erhält die konkrete lexikalische Aussage, ohne sie zum allgemeineren „niemand sonst“ zu verflachen.
- source_word: זוּלָתִי שְׁתַּיִם אֲנַחְנוּ בַּבָּיִת
  choice: nur wir beide waren im Haus
  rationale: זוּלָתִי führt die ausschließende Ausnahme ein; „nur wir beide“ ist im Deutschen idiomatisch und bewahrt die wiederholte Ortsangabe.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung „im Haus“ bleibt erhalten, weil sie im Hebräischen die Abwesenheit weiterer Zeugen nachdrücklich unterstreicht. Die knappe parataktische Erzählweise wird durch zwei Hauptsätze und ein Semikolon bewahrt.
