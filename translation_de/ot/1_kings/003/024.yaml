  text: וַ/יֹּ֥אמֶר הַ/מֶּ֖לֶךְ קְח֣וּ לִ/י חָ֑רֶב וַ/יָּבִ֥אוּ הַ/חֶ֖רֶב לִ/פְנֵ֥י הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/024.yaml
  text: Then the king said, “Bring me a sword.” So they brought the sword before the king.
translation:
  language: de
  text: 'Da sagte der König: »Bringt mir ein Schwert!« Da brachten sie das Schwert vor den König.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das narrative Waw führt die Handlung weiter. »Da sagte« gibt die zeitliche Abfolge im modernen Deutschen natürlich wieder.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Direkte Wiedergabe des bestimmten Substantivs.
- source_word: קְחוּ לִי
  choice: Bringt mir
  rationale: לקח bedeutet grundlegend »nehmen«, bezeichnet hier aber idiomatisch das Holen und Herbeibringen eines Gegenstands zum Sprecher.
- source_word: חָרֶב
  choice: ein Schwert
  rationale: Das erste Vorkommen ist unbestimmt und führt den Gegenstand neu ein.
- source_word: וַיָּבִאוּ
  choice: Da brachten sie
  rationale: Die narrative Verbform setzt die Handlung als unmittelbare Reaktion auf den Befehl fort; »da« wahrt den schlichten Erzählfluss.
- source_word: הַחֶרֶב
  choice: das Schwert
  rationale: Der Artikel verweist auf das unmittelbar zuvor verlangte Schwert zurück.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: vor den König
  rationale: Die Wendung bezeichnet hier das Herbeibringen in die Gegenwart des Königs. Bei einem Bewegungsverb ist »vor den König« im Deutschen präzise und natürlich.
theological_decisions: []
translation_notes:
  register: Moderner, klarer und würdevoller Erzählstil. Die Wiederholung von »König« und »Schwert« bleibt entsprechend dem Hebräischen erhalten; keine Fußnote ist erforderlich.
