id: 1KI.3.10
reference: 1 Kings 3:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּיטַ֥ב הַ/דָּבָ֖ר בְּ/עֵינֵ֣י אֲדֹנָ֑/י כִּ֚י שָׁאַ֣ל שְׁלֹמֹ֔ה אֶת הַ/דָּבָ֖ר הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/010.yaml
  text: And the matter was good in the eyes of the Lord[a], because Solomon had asked this thing.
translation:
  language: de
  text: Und die Sache war gut in den Augen des Herrn[a], weil Salomo um diese Sache gebeten hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Sache gefiel dem Herrn.“'
    reason: Lexikalische Alternative, die den Sinn der hebräischen Wendung וַיִּיטַב ... בְּעֵינֵי idiomatischer ausdrückt.
lexical_decisions:
- source_word: וַיִּיטַב
  choice: war gut
  rationale: Die Wiedergabe bewahrt die hebräische Bewertung und vermeidet die stärker deutende Formulierung „gefiel“.
- source_word: הַדָּבָר
  choice: die Sache
  rationale: דבר bezeichnet hier allgemein eine Sache oder Angelegenheit und verweist im Zusammenhang auf Salomos Bitte, ohne den Ausdruck darauf zu verengen.
- source_word: בְּעֵינֵי
  choice: in den Augen
  rationale: Die geläufige hebräische Bewertungsmetapher bleibt im Deutschen verständlich erhalten.
- source_word: אֲדֹנָי
  choice: des Herrn
  rationale: Der Quelltext hat אֲדֹנָי („Herr“), nicht das Tetragramm יהוה; daher wird nicht die für JHWH vorbehaltene Form „HERR“ verwendet.
- source_word: כִּי
  choice: weil
  rationale: כִּי leitet hier den Grund für die positive Bewertung ein.
- source_word: שָׁאַל
  choice: gebeten hatte
  rationale: Das Verb bezeichnet ein Bitten oder Erbitten. Das Plusquamperfekt bildet die zeitliche Abfolge im deutschen Erzählfluss natürlich ab.
- source_word: שְׁלֹמֹה
  choice: Salomo
  rationale: Gebräuchliche deutsche Form des Personennamens.
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: um diese Sache
  rationale: Die vollständige Nominalgruppe wird wiedergegeben; „um … bitten“ ist im Deutschen die natürliche Konstruktion für das hier gemeinte Erbitten.
theological_decisions:
- issue: Wiedergabe des Gottesprädikats אֲדֹנָי
  choice: Herr
  alternative: HERR
  rationale: An dieser Stelle steht ausdrücklich אֲדֹנָי und nicht יהוה. Die Übersetzung unterscheidet deshalb zwischen „Herr“ und der für den Gottesnamen verwendeten Form „HERR“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Wendung „gut in den Augen“ wird bewusst bewahrt; die Fußnote bietet eine natürlichere deutsche Alternative.
