revisions:
- from: 'Und Salomo sagte: „Du hast deinem Diener David, meinem Vater, große Bundestreue erwiesen, weil er vor dir in Treue, in Gerechtigkeit und mit aufrichtigem Herzen lebte. Du hast ihm diese große Bundestreue bewahrt und ihm einen Sohn gegeben, der auf seinem Thron sitzt, wie es heute der Fall ist.[a]“'
  to: 'Und Salomo sagte: „Du hast deinem Diener David, meinem Vater, große Bundestreue erwiesen, wie er vor dir und mit dir in Treue, in Gerechtigkeit und mit aufrichtigem Herzen lebte. Du hast für ihn diese große Bundestreue bewahrt und ihm einen Sohn gegeben, der auf seinem Thron sitzt, wie es heute der Fall ist.[a]“'
  rationale: Die Revision stellt den ausgelassenen Ausdruck „mit dir“ wieder her, ohne den natürlichen deutschen Satzfluss wesentlich zu beeinträchtigen. „Wie“ erhält die im Hebräischen mögliche vergleichende beziehungsweise modal-entsprechende Nuance von כַּאֲשֶׁר, statt allein eine Kausalbeziehung zu behaupten. Die übrigen zentralen Begriffe und die Fußnotenverankerung bleiben sachgerecht erhalten.
