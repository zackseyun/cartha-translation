source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁלֹמֹ֗ה אַתָּ֨ה עָשִׂ֜יתָ עִם עַבְדְּ/ךָ֙ דָוִ֣ד אָבִ/י֮ חֶ֣סֶד גָּדוֹל֒ כַּ/אֲשֶׁר֩ הָלַ֨ךְ לְ/פָנֶ֜י/ךָ בֶּ/אֱמֶ֧ת וּ/בִ/צְדָקָ֛ה וּ/בְ/יִשְׁרַ֥ת לֵבָ֖ב עִמָּ֑/ךְ וַ/תִּשְׁמָר ל֗/וֹ אֶת הַ/חֶ֤סֶד הַ/גָּדוֹל֙ הַ/זֶּ֔ה וַ/תִּתֶּן ל֥/וֹ בֵ֛ן יֹשֵׁ֥ב עַל כִּסְא֖/וֹ כַּ/יּ֥וֹם הַ/זֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/006.yaml
  text: And Solomon said[a], “You have shown great covenant faithfulness to your servant David my father, because he walked before you in faithfulness, in righteousness, and in uprightness of heart with you; and you have kept for him this great covenant faithfulness and have given him a son sitting on his throne[c][b], as it is this day.”
translation:
  language: de
  text: 'Und Salomo sagte: „Du hast deinem Diener David, meinem Vater, große Bundestreue erwiesen, wie er vor dir und mit dir in Treue, in Gerechtigkeit und mit aufrichtigem Herzen lebte. Du hast für ihn diese große Bundestreue bewahrt und ihm einen Sohn gegeben, der auf seinem Thron sitzt, wie es heute der Fall ist.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wie an diesem Tag“; die hebräische Wendung weist auf die gegenwärtige Situation als sichtbare Bestätigung hin.'
    reason: cultural_note
lexical_decisions:
- source_word: חֶסֶד
  choice: Bundestreue
  rationale: Im Zusammenhang mit David und der fortdauernden Königsdynastie bezeichnet das Wort Gottes beständige, verbindliche Loyalität. „Bundestreue“ gibt diesen Beziehungs- und Verheißungsbezug prägnant wieder.
- source_word: עָשִׂיתָ עִם
  choice: hast … erwiesen
  rationale: Die Verbindung mit חֶסֶד bedeutet idiomatisch, jemandem Treue oder Güte zu erweisen.
- source_word: עַבְדְּךָ
  choice: deinem Diener
  rationale: In diesem königlichen Gebet bezeichnet das Wort Davids untergeordnete Stellung vor Gott; „Diener“ ist dafür die natürliche deutsche Entsprechung.
- source_word: כַּאֲשֶׁר
  choice: weil
  rationale: Der folgende Satz beschreibt hier den Zusammenhang beziehungsweise Grund für Gottes treues Handeln an David; die kausale Wiedergabe ist im Deutschen klar und sachgerecht.
- source_word: הָלַךְ לְפָנֶיךָ
  choice: vor dir … lebte
  rationale: Das hebräische Bild des Gehens beschreibt den Lebenswandel in Gottes Gegenwart. „Lebte“ vermittelt den Sinn in natürlichem modernem Deutsch.
- source_word: בֶּאֱמֶת
  choice: in Treue
  rationale: אֱמֶת kann Wahrheit, Verlässlichkeit oder Treue bezeichnen. Hier passt „Treue“ zu den ethischen Bestimmungen des Lebenswandels, ohne die Bedeutungsbreite vollständig aufzulösen.
- source_word: בִּצְדָקָה
  choice: in Gerechtigkeit
  rationale: Das Wort bezeichnet hier Davids rechtes Verhalten vor Gott; „Gerechtigkeit“ ist die direkte und angemessene Wiedergabe.
- source_word: וּבְיִשְׁרַת לֵבָב עִמָּךְ
  choice: und mit aufrichtigem Herzen
  rationale: Die Wendung bezeichnet innere Redlichkeit gegenüber Gott. Natürliches Deutsch fasst die beiden hebräischen Präpositionalbezüge zusammen, ohne die relationale Ausrichtung zu verlieren.
- source_word: וַתִּשְׁמָר לוֹ
  choice: hast ihm … bewahrt
  rationale: שׁמר drückt hier aus, dass Gott seine große Bundestreue für David fortbestehen ließ und konkret erfüllte.
- source_word: בֵן יֹשֵׁב עַל כִּסְאוֹ
  choice: einen Sohn …, der auf seinem Thron sitzt
  rationale: Das Partizip beschreibt die gegenwärtige Thronbesteigung als bereits verwirklichte Gabe Gottes.
- source_word: כַּיּוֹם הַזֶּה
  choice: wie es heute der Fall ist
  rationale: Die hebräische Wendung verweist auf die gegenwärtige, sichtbar bestätigte Situation; diese deutsche Formulierung gibt den deiktischen Sinn natürlich wieder.
theological_decisions:
- issue: Wiedergabe von חֶסֶד im davidischen Verheißungszusammenhang
  choice: Bundestreue
  alternative: beständige Liebe; loyale Güte
  rationale: Die Thronfolge Salomos wird als konkrete Fortsetzung von Gottes loyalem Handeln an David dargestellt. „Bundestreue“ hebt den verbindlichen und verheißungsbezogenen Charakter hervor, ohne den Beziehungsaspekt auszuschließen.
- issue: Verhältnis von Davids Lebenswandel und Gottes Bundestreue
  choice: Die kausale Form „weil“ bleibt erhalten, ohne daraus ein umfassendes Verdienstschema abzuleiten.
  alternative: „so wie“ als vergleichende Wiedergabe
  rationale: כַּאֲשֶׁר kann vergleichend oder kausal verstanden werden. Im Satz ist die kausale Lesart gut möglich; die Übersetzung soll die im Text bestehende Spannung zwischen Davids Treue und Gottes Treue nicht dogmatisch auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der hebräische Lebenswandel-Ausdruck wird zugunsten natürlicher Verständlichkeit mit „lebte“ wiedergegeben. „Bundestreue“ wird wegen des davidischen Verheißungszusammenhangs beibehalten; die ungewöhnlichere Formulierung wird durch den Kontext getragen.
