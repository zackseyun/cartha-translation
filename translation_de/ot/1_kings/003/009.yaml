  text: וְ/נָתַתָּ֨ לְ/עַבְדְּ/ךָ֜ לֵ֤ב שֹׁמֵ֨עַ֙ לִ/שְׁפֹּ֣ט אֶֽת עַמְּ/ךָ֔ לְ/הָבִ֖ין בֵּֽין ט֣וֹב לְ/רָ֑ע כִּ֣י מִ֤י יוּכַל֙ לִ/שְׁפֹּ֔ט אֶת עַמְּ/ךָ֥ הַ/כָּבֵ֖ד הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/009.yaml
  text: So give your servant a listening heart to judge your people[a], to discern between good and evil[b], for who is able to judge this great people of yours?
translation:
  language: de
  text: So gib deinem Diener ein hörendes Herz[a], um dein Volk zu richten und zwischen Gut und Böse zu unterscheiden. Denn wer wäre imstande, dieses große[b] Volk, das dir gehört, zu richten?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein verständiges Herz“; wörtlich: „ein hörendes Herz“.'
    reason: lexical_alternative
  - marker: b
    text: „Groß“ gibt ein hebräisches Wort wieder, das wörtlich „schwer“ oder „gewichtig“ bedeutet und hier die Bedeutung des Volkes oder die Last seiner Regierung ausdrücken kann.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: So gib
  rationale: Das Waw mit der Perfektform leitet hier eine aus dem vorausgehenden Gebet folgende Bitte ein. „So gib“ gibt diesen folgernden und bittenden Sinn in natürlichem Deutsch wieder.
- source_word: לְעַבְדְּךָ
  choice: deinem Diener
  rationale: עבד ist hier Salomos demütige Selbstbezeichnung gegenüber Gott als dem göttlichen König. „Diener“ ist kontextgemäß; der mögliche Aspekt unfreier Knechtschaft steht nicht im Vordergrund.
- source_word: לֵב שֹׁמֵעַ
  choice: ein hörendes Herz
  rationale: Die Wendung bedeutet wörtlich ein hörendes beziehungsweise zuhörendes Herz und bezeichnet aufmerksame, empfängliche und gehorsame Einsicht. Die Bildsprache des Hebräischen bleibt erhalten.
- source_word: לִשְׁפֹּט
  choice: zu richten
  rationale: שפט umfasst sowohl Rechtsprechung als auch königliche Leitung. „Richten“ bewahrt den lexikalischen Kern und lässt den weiteren Regierungsauftrag mitschwingen.
- source_word: עַמְּךָ
  choice: dein Volk
  rationale: Die Wiedergabe bewahrt sowohl den politischen als auch den Bundesbezug der Zugehörigkeit zu Gott.
- source_word: לְהָבִין
  choice: zu unterscheiden
  rationale: Die Hifilform von בין bezeichnet hier unterscheidende Einsicht; zusammen mit „zwischen Gut und Böse“ ist „unterscheiden“ im Deutschen präzise und natürlich.
- source_word: בֵּין טוֹב לְרָע
  choice: zwischen Gut und Böse
  rationale: Die moralisch-wertende Formulierung des Hebräischen wird bewahrt und nicht auf die engere Wendung „Recht und Unrecht“ reduziert.
- source_word: כִּי מִי יוּכַל
  choice: Denn wer wäre imstande
  rationale: Die rhetorische Frage begründet die Bitte und bringt Salomos Unzulänglichkeit angesichts der Aufgabe zum Ausdruck.
- source_word: הַכָּבֵד הַזֶּה
  choice: dieses große Volk
  rationale: כבד bedeutet wörtlich „schwer“ und übertragen „gewichtig, bedeutend, groß“. „Groß“ ist im Deutschen für ein Volk natürlich; die konkrete Bildnuance wird in einer Fußnote erläutert.
theological_decisions:
- issue: Anthropologische Bildsprache in Salomos Bitte
  choice: ein hörendes Herz
  alternative: ein verständiges Herz
  rationale: Im Hebräischen ist das Herz Zentrum von Denken, Wollen und Entscheiden. Die wörtlichere Fassung bewahrt diese biblische Anthropologie sowie den Gedanken des Hörens, ohne ihn auf bloßen Intellekt zu verengen.
- issue: Bedeutungsumfang des königlichen Richtens
  choice: richten
  alternative: regieren / Recht sprechen
  rationale: Der hebräische Ausdruck kann Rechtsprechung und Regierung umfassen. „Richten“ hält diesen Umfang offen, statt die Aussage einseitig auf Verwaltung oder gerichtliche Tätigkeit festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zentrale hebräische Bildsprache „hörendes Herz“ bleibt erhalten; die Satzstruktur ist zugleich klar und für heutige Leser gut verständlich.
