source:
  edition: WLC
  text: הִנֵּ֥ה עָשִׂ֖יתִי כִּ/דְבָרֶ֑י/ךָ הִנֵּ֣ה נָתַ֣תִּי לְ/ךָ֗ לֵ֚ב חָכָ֣ם וְ/נָב֔וֹן אֲשֶׁ֤ר כָּמ֨וֹ/ךָ֙ לֹא הָיָ֣ה לְ/פָנֶ֔י/ךָ וְ/אַחֲרֶ֖י/ךָ לֹא יָק֥וּם כָּמֽוֹ/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/012.yaml
  text: Behold[a], I have done according to your words. Behold, I have given you a wise and discerning heart, such that no one like you has been before you, and no one like you shall arise after you.
translation:
  language: de
  text: Siehe, ich habe nach deinen Worten gehandelt. Siehe, ich habe dir ein weises und verständiges Herz[a] gegeben, wie es vor dir niemandesgleichen gegeben hat und wie es nach dir niemandesgleichen geben wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort für „Herz“ bezeichnet hier auch das innere Vermögen zu denken, zu urteilen und zu unterscheiden, nicht nur den Bereich der Gefühle. Daher wäre sinngemäß auch „einsichtiges Herz“ möglich.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh
  rationale: Die Aufmerksamkeitspartikel wird ausdrücklich wiedergegeben. „Sieh“ bewahrt ihren feierlichen, hinweisenden Charakter und klingt im heutigen Deutschen natürlicher als „Siehe“.
- source_word: עָשִׂיתִי כִּדְבָרֶיךָ
  choice: ich habe nach deinen Worten gehandelt
  rationale: „Nach deinen Worten“ hält sich eng an דְבָרֶיךָ; „gehandelt“ gibt עשה in diesem Zusammenhang natürlich wieder, ohne „Worte“ als „Bitte“ auszudeuten.
- source_word: נָתַתִּי לְךָ
  choice: ich habe dir … gegeben
  rationale: Die vollendete Verbform wird als bereits vollzogene göttliche Gabe wiedergegeben; „gegeben“ entspricht נתן unmittelbar.
- source_word: לֵב חָכָם וְנָבוֹן
  choice: ein weises und verständiges Herz
  rationale: „Herz“ bewahrt die hebräische Anthropologie, in der das innere Denken und Urteilen eingeschlossen ist. „Verständig“ gibt נבון als Einsichts- und Urteilsfähigkeit wieder und bildet eine natürliche Verbindung mit „weise“.
- source_word: אֲשֶׁר כָּמוֹךָ לֹא הָיָה לְפָנֶיךָ
  choice: sodass vor dir niemand deinesgleichen gewesen ist
  rationale: אֲשֶׁר beschreibt hier die Folge beziehungsweise Beschaffenheit der verliehenen Weisheit; „sodass“ vermeidet eine bloße Zweckangabe und bewahrt den Vergleich.
- source_word: וְאַחֲרֶיךָ לֹא יָקוּם כָּמוֹךָ
  choice: und nach dir niemand deinesgleichen aufstehen wird
  rationale: „Aufstehen“ erhält das Bild von קום für das geschichtliche Auftreten einer Person und gibt die Zukunftsaussage klar wieder.
theological_decisions:
- issue: Reichweite von Salomos verheißener Einzigartigkeit
  choice: Der Vergleich bleibt grammatisch an das zuvor genannte weise und verständige Herz gebunden.
  alternative: Eine uneingeschränkte Aussage, Salomo sei in jeder Hinsicht allen Menschen überlegen.
  rationale: Der unmittelbare Zusammenhang handelt von der Gabe der Weisheit und Einsicht. Die Übersetzung weitet den Anspruch nicht über diesen Textzusammenhang hinaus aus.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zweimalige Aufmerksamkeitspartikel הִנֵּה bleibt durch „Sieh“ erhalten; der Satzbau ist nah am Hebräischen, ohne unnötig altertümlich zu wirken.
