  text: וַ/תֹּ֜אמֶר הָ/אִשָּׁ֤ה הָֽ/אַחַת֙ בִּ֣י אֲדֹנִ֔/י אֲנִי֙ וְ/הָ/אִשָּׁ֣ה הַ/זֹּ֔את יֹשְׁבֹ֖ת בְּ/בַ֣יִת אֶחָ֑ד וָ/אֵלֵ֥ד עִמָּ֖/הּ בַּ/בָּֽיִת׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/017.yaml
  text: Then one woman said, “Please, my lord, I and this woman live in one house, and I gave birth while she was in the house with me.
translation:
  language: de
  text: 'Da sagte die eine Frau: »Bitte, mein Herr! Diese Frau und ich wohnen im selben Haus. Ich brachte ein Kind zur Welt, während sie mit mir im Haus war.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּי אֲדֹנִי
  choice: Bitte, mein Herr!
  rationale: Die höfliche, eindringliche Anrede an den König wird in natürlichem, würdevollem Deutsch wiedergegeben.
- source_word: יֹשְׁבֹת בְּבַיִת אֶחָד
  choice: wohnen im selben Haus
  rationale: Das Partizip bezeichnet hier den gemeinsamen Wohnzustand; »im selben Haus« gibt idiomatisch die Einheit des Hauses wieder.
- source_word: וָאֵלֵד עִמָּהּ בַּבָּיִת
  choice: Ich brachte ein Kind zur Welt, während sie mit mir im Haus war
  rationale: »Ein Kind« ergänzt das im Deutschen nötige Objekt aus dem eindeutigen Kontext; עִמָּהּ wird als Anwesenheit der anderen Frau bei ihr verstanden.
