- from: Und nun, Yahweh, mein Gott, du hast deinen Diener anstelle meines Vaters David zum König gemacht. Ich aber bin noch ein junger Mann[a] und weiß nicht aus noch ein[b].
  to: Und nun, Yahweh, mein Gott, du hast deinen Diener anstelle meines Vaters David zum König gemacht, obwohl ich noch sehr jung bin[a] und nicht weiß, wie ich aus- und eingehen soll[b].
  rationale: Die Revision ersetzt eine deutsche Redewendung, die die konkrete hebräische Bildsprache und ihren Sinn verfälscht, durch eine idiomatisch verständliche, formal nahe Wiedergabe. Zugleich gibt »noch sehr jung« die rhetorische Verkleinerung von נַעַר קָטֹן wieder, ohne die strittige genaue Altersbestimmung festzulegen. Die Fußnoten bleiben korrekt verankert und erläutern Alternativlesart sowie idiomatischen Kontext.
