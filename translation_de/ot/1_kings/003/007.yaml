  text: וְ/עַתָּה֙ יְהוָ֣ה אֱלֹהָ֔/י אַתָּה֙ הִמְלַ֣כְתָּ אֶֽת עַבְדְּ/ךָ֔ תַּ֖חַת דָּוִ֣ד אָבִ֑/י וְ/אָֽנֹכִי֙ נַ֣עַר קָטֹ֔ן לֹ֥א אֵדַ֖ע צֵ֥את וָ/בֹֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/007.yaml
  text: And now[a], O Yahweh my God, you have made your servant king in place of David my father, though I am a little child[b]; I do not know how to go out or come in.
translation:
  language: de
  text: Und nun, Yahweh, mein Gott, du hast deinen Diener anstelle meines Vaters David zum König gemacht, obwohl ich noch sehr jung bin[a] und nicht weiß, wie ich aus- und eingehen soll[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein kleiner Junge«. Die hebräische Wendung ist eine demütige Selbstbeschreibung und betont Jugend und Unerfahrenheit.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »nicht weiß, wie ich hinausgehen und hereinkommen soll«. Die hebräische Wendung kann die Ausübung der eigenen Aufgaben bezeichnen, besonders die öffentliche Leitung des Volkes.'
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה אֱלֹהָי
  choice: Yahweh, mein Gott
  rationale: Der Gottesname wird als »Yahweh« wiedergegeben; אֱלֹהָי ist die direkte Possessivform »mein Gott«.
- source_word: הִמְלַכְתָּ אֶת עַבְדְּךָ
  choice: du hast deinen Diener … zum König gemacht
  rationale: Die Hifil-Form von מלך bezeichnet das Einsetzen zum König; »Diener« entspricht der demütigen Selbstbezeichnung im Gebet.
- source_word: תַּחַת דָּוִד אָבִי
  choice: anstelle meines Vaters David
  rationale: 'תַּחַת bezeichnet hier die Nachfolge: Salomo tritt als König an Davids Stelle.'
- source_word: נַעַר קָטֹן
  choice: noch ein junger Mann
  rationale: נַעַר kann einen Jungen oder jungen Mann bezeichnen; zusammen mit קָטֹן betont die Wendung hier demütig Jugend und Unerfahrenheit, ohne zwingend ein kleines Kind zu meinen.
- source_word: לֹא אֵדַע צֵאת וָבֹא
  choice: weiß nicht aus noch ein
  rationale: Die deutsche Redewendung bewahrt das Bild von Hinausgehen und Hereinkommen und vermittelt zugleich Hilflosigkeit beziehungsweise mangelnde Erfahrung; die besondere Bedeutung für die Amtsführung wird in der Fußnote erläutert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR
  rationale: Der im hebräischen Text stehende Eigenname wird transparent als »Yahweh« wiedergegeben und nicht durch einen Titel ersetzt.
- issue: Salomos Selbstbeschreibung נַעַר קָטֹן
  choice: noch ein junger Mann
  alternative: ein kleines Kind
  rationale: Die mögliche Bedeutungsbreite bleibt durch eine Fußnote sichtbar. Im Kontext hebt Salomo vor allem seine Jugend und Unerfahrenheit hervor; eine genaue Altersangabe liefert die Wendung nicht.
- issue: Idiom צֵאת וָבֹא
  choice: weiß nicht aus noch ein
  alternative: weiß nicht, wie ich führen soll
  rationale: Die Übersetzung vermeidet es, »führen« ausdrücklich in den Haupttext einzutragen, obwohl der Zusammenhang königliche Amtsführung nahelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede bleibt direkt und feierlich; »aus noch ein wissen« ist eine allgemein verständliche deutsche Redewendung, während die Fußnote die wörtliche hebräische Bildsprache und den Führungskontext offenlegt.
