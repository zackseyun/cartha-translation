  naturalness: „In ihren Schoß / in meinen Schoß legen“ ist im gegenwärtigen Standarddeutsch idiomatisch und beschreibt die Lage eines Kindes beim Schlafen natürlich. Die alternative Wiedergabe mit „Brust“ kann in der Fußnote transparent gemacht werden.
  terminology: „deine Magd“ wahrt die weibliche höfische Selbstbezeichnung אֲמָתְךָ. „Mitten in der Nacht“, „von meiner Seite“ und „toten Sohn“ sind angemessen. Das nicht ausdrücklich markierte „aber“ wird entfernt, damit die Koordination des Hebräischen ohne zusätzliche adversative Nuance wiedergegeben wird.
