base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/020.yaml
  text: She got up in the middle of the night and took my son from beside me while your servant was sleeping[a], and she laid him in her bosom, and laid her dead son in my bosom.
translation:
  language: de
  text: Da stand sie mitten in der Nacht auf, nahm meinen Sohn von meiner Seite, während ich, deine Magd, schlief, und legte ihn in ihren Schoß[a]. Ihren toten Sohn legte sie in meinen Schoß.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an ihre Brust … an meine Brust“. Das hebräische Wort חֵיק kann den Schoß- oder Brustbereich bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתוֹךְ הַלַּיְלָה
  choice: mitten in der Nacht
  rationale: Die Wendung bezeichnet das Innere beziehungsweise die Mitte der Nacht; die gewählte Formulierung ist im Deutschen natürlich und präzise.
- source_word: מֵאֶצְלִי
  choice: von meiner Seite
  rationale: אֵצֶל bezeichnet die unmittelbare Nähe bei einer Person. „Von meiner Seite“ passt zum gemeinsamen Schlafplatz und bleibt räumlich anschaulich.
- source_word: וַאֲמָתְךָ יְשֵׁנָה
  choice: während ich, deine Magd, schlief
  rationale: Die Zustandsangabe wird als gleichzeitiger Hintergrund wiedergegeben. „Deine Magd“ bewahrt sowohl das weibliche Selbstprädikat als auch die ehrerbietige Rede vor dem König.
- source_word: וַתַּשְׁכִּיבֵהוּ
  choice: legte ihn
  rationale: Der Hifil von שׁכב bedeutet, jemanden hinzulegen. „Legte ihn“ ist knapp, idiomatisch und dem Schlafkontext angemessen.
- source_word: בְּחֵיקָהּ / בְחֵיקִי
  choice: an ihre Brust / an meine Brust
  rationale: חֵיק bezeichnet den Brust- oder Schoßbereich. „An die Brust“ vermittelt hier die enge körperliche Lage von Mutter und Kind und wird in beiden parallelen Wendungen einheitlich verwendet.
- source_word: בְּנָהּ הַמֵּת
  choice: ihren toten Sohn
  rationale: הַמֵּת beschreibt den Sohn attributiv als tot; die deutsche Wortstellung ist natürlich und inhaltlich genau.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Die höfische Selbstbezeichnung „deine Magd“ bleibt erhalten; durch „ich, deine Magd“ ist der deutsche Satz zugleich eindeutig und flüssig. Das adversative „aber“ hebt im zweiten Satz den Austausch der Kinder hervor, ohne den Sinn zu erweitern.
