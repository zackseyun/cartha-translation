  text: And this woman's son died in the night[b][a], because she lay on him.
translation:
  language: de
  text: Und der Sohn dieser Frau starb in der Nacht[a], weil sie auf ihm lag.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nachts“.'
    reason: lexical_alternative
  - marker: b
    text: 'Das hebräische Anschlusswort kann auch zeitlich verstanden werden: „als“ oder „während sie auf ihm lag“. Der Zusammenhang legt die kausale Wiedergabe nahe: Ihr Liegen auf dem Kind verursachte dessen Tod.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: Und … starb
  rationale: Das Wayyiqtol von מוּת führt das vergangene Geschehen in der Erzählung fort; „starb“ gibt den Eintritt des Todes präzise wieder.
- source_word: בֶּן הָאִשָּׁה הַזֹּאת
  choice: der Sohn dieser Frau
  rationale: Die Konstruktion bezeichnet ausdrücklich den männlichen Nachkommen dieser Frau. Die deutsche Genitivfügung ist klar und entspricht der hebräischen Wortfolge.
- source_word: לָיְלָה
  choice: in der Nacht
  rationale: Der adverbiale Akkusativ bezeichnet den Zeitpunkt des Todes. „In der Nacht“ ist im modernen Deutschen natürlich und eng am Hebräischen.
- source_word: אֲשֶׁר
  choice: weil
  rationale: Das Relativwort leitet hier im Zusammenhang den Umstand ein, der den Tod erklärt. Die kausale Wiedergabe macht diesen Kontextbezug verständlich, ohne die formal allgemeinere hebräische Verknüpfung zu verschweigen.
- source_word: שָׁכְבָה עָלָיו
  choice: sie auf ihm gelegen hatte
  rationale: שׁכב mit עַל bezeichnet hier das Liegen auf dem Kind. Das Plusquamperfekt verdeutlicht im Deutschen, dass dies dem festgestellten Tod vorausging.
