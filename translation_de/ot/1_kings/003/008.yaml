base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/008.yaml
  text: And your servant is in the midst of your people whom you have chosen[a], a great people[b], too numerous to be counted or numbered.
translation:
  language: de
  text: Und dein Diener ist mitten unter deinem Volk, das du erwählt hast – einem großen Volk, das wegen seiner großen Menge weder gezählt noch nummeriert werden kann.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder bei „großen“: „zahlreichen“. Wörtlich: „ein Volk, das wegen seiner großen Menge nicht gezählt und nicht nummeriert werden kann“; im Hebräischen stehen zwei verschiedene, nahezu gleichbedeutende Verben.'
    reason: lexical_alternative_and_literal_rendering
lexical_decisions:
- source_word: וְעַבְדְּךָ
  choice: Und dein Diener
  rationale: עֶבֶד kann »Diener« oder »Sklave« bedeuten. In Salomos ehrfürchtiger Anrede an Gott ist »Diener« im Deutschen natürlich und bewahrt zugleich das Verhältnis der Unterordnung.
- source_word: בְּתוֹךְ עַמְּךָ
  choice: lebt mitten unter deinem Volk
  rationale: בְּתוֹךְ bezeichnet die Stellung innerhalb einer Gemeinschaft. Das im Hebräischen fehlende, aber mitgedachte Verb wird mit »lebt« natürlich ergänzt; »mitten unter« gibt die räumliche und gemeinschaftliche Nuance wieder.
- source_word: אֲשֶׁר בָּחָרְתָּ
  choice: das du erwählt hast
  rationale: Die Formulierung gibt Gottes ausdrückliche Wahl des Volkes direkt wieder, ohne die Aussage theologisch zu erweitern.
- source_word: עַם רָב
  choice: einem großen Volk
  rationale: רַב kann »groß« oder »zahlreich« bedeuten. »groß« bewahrt diese Bedeutungsbreite; der folgende Satzteil macht deutlich, dass hier besonders die große Zahl gemeint ist.
- source_word: אֲשֶׁר לֹא יִמָּנֶה וְלֹא יִסָּפֵר
  choice: das weder gezählt noch zahlenmäßig erfasst werden kann
  rationale: Die beiden parallelen Verben bezeichnen das Zählen beziehungsweise zahlenmäßige Erfassen. Die deutsche Paarung erhält den Parallelismus, ohne unnatürlich dasselbe Verb zu wiederholen.
- source_word: מֵרֹב
  choice: wegen seiner Menge
  rationale: 'Die Präposition mit רֹב nennt ausdrücklich den Grund, weshalb das Volk nicht gezählt werden kann: seine große Menge.'
theological_decisions:
- issue: Israel als Gottes erwähltes Volk
  choice: deinem Volk, das du erwählt hast
  alternative: deinem erwählten Volk
  rationale: Die Relativsatzform entspricht der ausdrücklichen hebräischen Aussage und bewahrt den Bundesbezug, ohne spätere theologische Folgerungen einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Diener« und »erwählt« bewahren den Gebetston; »mitten unter« und »zahlenmäßig erfasst« sind allgemein verständlich. Die hebräische Bedeutungsbreite von רַב sowie der parallele Ausdruck für die Unzählbarkeit werden durch Fußnoten offengehalten.
