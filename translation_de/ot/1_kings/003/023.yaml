    rationale: Die Formulierung ist verständlich, wirkt aber stärker umgangssprachlich und verwendet ein sächliches Demonstrativum. „Dies ist mein Sohn“ ist modernes Standarddeutsch und bildet die demonstrative Identifizierung des männlichen Kindes klarer ab.
