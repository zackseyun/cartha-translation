base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/023.yaml
  text: Then the king said[a], “This one says, ‘This is my son, the living one, and your son is the dead one,’ and this one says, ‘No, for your son is the dead one, and my son is the living one.’”
translation:
  language: de
  text: 'Da sagte der König: »Diese[a] sagt: ›Dies ist mein Sohn, der Lebende, und dein Sohn ist der Tote‹; und jene sagt: ›Nein, dein Sohn ist der Tote, und mein Sohn ist der Lebende.‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Hebräischen zweimal das feminine Demonstrativpronomen: »Diese … und diese …«; gemeint sind die beiden Frauen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; „Da sagte“ gibt die zeitliche Folge im Deutschen natürlich wieder.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Der bestimmte Titel wird beibehalten; der hebräische Text nennt hier keinen Eigennamen.
- source_word: זֹאת ... וְזֹאת
  choice: Diese ... und jene
  rationale: Die femininen Demonstrativpronomen beziehen sich auf die beiden Frauen. Die deutsche Gegenüberstellung wahrt die hinweisende, kontrastive Funktion, während die Fußnote den wörtlichen Gleichklang erläutert.
- source_word: אֹמֶרֶת
  choice: sagt
  rationale: Das Partizip fasst die jeweilige Behauptung anschaulich in der Gegenwart zusammen.
- source_word: זֶה
  choice: Das hier
  rationale: Die Formulierung bewahrt die hinweisende Kraft des Demonstrativpronomens bei der Identifizierung des Kindes.
- source_word: בְּנִי / בְּנֵךְ
  choice: mein Sohn / dein Sohn
  rationale: בֵּן bezeichnet hier eindeutig den Sohn; die direkten Anreden bleiben erhalten.
- source_word: הַחַי / הַמֵּת
  choice: der lebende / der tote
  rationale: Die substantivisch gebrauchten Formen werden parallel wiedergegeben und bewahren den markanten Gegensatz zwischen dem lebenden und dem toten Sohn.
- source_word: לֹא כִי
  choice: Nein!
  rationale: In diesem Zusammenhang leitet die Verbindung einen entschiedenen Widerspruch und die unmittelbar folgende Gegenbehauptung ein; ein kausales „denn“ wäre im heutigen Deutsch missverständlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Gegenüberstellung „der lebende / der tote“ und die appositionale Form des ersten Anspruchs bleiben bewusst erhalten, auch wenn sie feierlicher als gewöhnliche Alltagssprache wirken.
