base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/024.yaml
  text: And Asa slept with his fathers and was buried with his fathers in the city of David his father[b][a], and Jehoshaphat his son reigned in his place.
translation:
  language: de
  text: Asa entschlief bei seinen Vätern[a] und wurde bei seinen Vätern in der Stadt Davids, seines Vaters[b], begraben. Sein Sohn Joschafat wurde an seiner Stelle König.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bei seinen Vorfahren“. Wörtlich steht im Hebräischen „bei seinen Vätern“, eine feste königliche Formel für Tod und Begräbnis.'
    reason: lexical_alternative
  - marker: b
    text: David wird hier als Asas königlicher Vorfahr „sein Vater“ genannt; er war nicht Asas unmittelbarer Vater.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: entschlief
  rationale: Das Verb gehört hier zur festen königlichen Todesformel. „Entschlief“ bewahrt das Bild des Schlafens, macht im Deutschen aber zugleich deutlich, dass Asa starb.
- source_word: עִם אֲבֹתָיו
  choice: bei seinen Vätern
  rationale: Die traditionelle Wendung erhält den formelhaften und dynastischen Klang des Hebräischen; eine Fußnote nennt die heute geläufigere Bedeutung „bei seinen Vorfahren“.
- source_word: וַיִּקָּבֵר
  choice: wurde begraben
  rationale: Die passive Form des hebräischen Verbs wird im Deutschen natürlich und genau wiedergegeben.
- source_word: בְּעִיר דָּוִד אָבִיו
  choice: in der Stadt seines Vaters David
  rationale: Die Formulierung folgt eng der hebräischen Syntax und erhält die ausdrückliche dynastische Verbindung zu David. Eine Fußnote verhindert das Missverständnis, David sei Asas unmittelbarer Vater gewesen.
- source_word: וַיִּמְלֹךְ
  choice: wurde König
  rationale: In der deutschen Nachfolgenotiz gibt diese Formulierung den Beginn der Königsherrschaft natürlich wieder.
- source_word: תַּחְתָּיו
  choice: an seiner Stelle
  rationale: Die Wendung bezeichnet die königliche Nachfolge und nicht lediglich eine zeitliche Abfolge.
theological_decisions:
- issue: Bezeichnung Davids als Asas „Vater“
  choice: Die wörtliche dynastische Bezeichnung bleibt im Haupttext erhalten und wird erläutert.
  alternative: „Vorfahre David“ unmittelbar in den Haupttext setzen.
  rationale: Im biblischen Sprachgebrauch kann „Vater“ einen bedeutenden Ahnherrn bezeichnen. Die wörtliche Form bewahrt den dynastischen Akzent, während die Fußnote ein modernes Missverständnis vermeidet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die formelhafte Sprache der Königsbücher bleibt in „entschlief bei seinen Vätern“ erhalten; erklärende Fußnoten sichern die unmittelbare Verständlichkeit.
