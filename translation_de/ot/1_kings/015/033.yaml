id: 1KI.15.33
reference: 1 Kings 15:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בִּ/שְׁנַ֣ת שָׁלֹ֔שׁ לְ/אָסָ֖א מֶ֣לֶךְ יְהוּדָ֑ה מָ֠לַךְ בַּעְשָׁ֨א בֶן אֲחִיָּ֤ה עַל כָּל יִשְׂרָאֵל֙ בְּ/תִרְצָ֔ה עֶשְׂרִ֥ים וְ/אַרְבַּ֖ע שָׁנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/033.yaml
  text: In the third year of Asa king of Judah, Baasha son of Ahijah became king over all Israel in Tirzah, and he reigned twenty-four years.
translation:
  language: de
  text: Im dritten Regierungsjahr Asas, des Königs von Juda, wurde Bascha, der Sohn Ahijas, König über ganz Israel. In Tirza regierte er vierundzwanzig Jahre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּ/שְׁנַת שָׁלֹשׁ לְ/אָסָא
  choice: Im dritten Regierungsjahr Asas
  rationale: Die Präposition בְּ leitet die Zeitangabe ein; der mit לְ markierte Bezug nennt den Herrscher, nach dessen Regierungsjahren datiert wird. „Regierungsjahr“ macht die im Hebräischen knappe Königsjahrformel im Deutschen eindeutig und natürlich.
- source_word: מֶלֶךְ יְהוּדָה
  choice: des Königs von Juda
  rationale: Die Apposition bezeichnet Asa als König von Juda. Die deutsche Genitivfügung fügt sich klar in die Datierungsformel ein.
- source_word: מָלַךְ
  choice: wurde … König
  rationale: Das Verb bezeichnet hier im Kontext den Regierungsantritt. Die ingressive Wiedergabe vermeidet eine missverständliche Zuordnung der folgenden Orts- und Zeitangaben und unterscheidet den Regierungsbeginn von der Regierungsdauer.
- source_word: בַּעְשָׁא בֶן אֲחִיָּה
  choice: Bascha, der Sohn Ahijas
  rationale: Die Namen werden nach gängiger deutscher Bibeltradition wiedergegeben; die hebräische Herkunftsangabe wird als natürliche deutsche Apposition formuliert.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: über ganz Israel
  rationale: עַל bezeichnet zusammen mit מלך den Herrschaftsbereich. „Ganz Israel“ bewahrt den Umfangsanspruch des hebräischen Ausdrucks.
- source_word: בְּ/תִרְצָה
  choice: In Tirza
  rationale: Die Präposition בְּ bezeichnet den Ort der Regierung. Die Stellung am Anfang des zweiten Satzes verbindet Tirza natürlich mit der gesamten Regierungsdauer.
- source_word: עֶשְׂרִים וְ/אַרְבַּע שָׁנָה
  choice: vierundzwanzig Jahre
  rationale: Die Zahlengruppe gibt die Dauer der Herrschaft an; „regierte er“ macht die im hebräischen Satz elliptisch ausgedrückte Beziehung im Deutschen deutlich.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die traditionelle deutsche Namensform „Bascha“ wird verwendet. Der lange hebräische Satz ist zur besseren Verständlichkeit in zwei Sätze gegliedert, ohne die Aussagebeziehungen zu verändern.
