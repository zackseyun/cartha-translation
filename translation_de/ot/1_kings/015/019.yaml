    issue: Tempus von שָׁלַחְתִּי
    rationale: Das hebräische Verb steht im Perfekt und bezeichnet die bereits erfolgte Sendung; daher ist „ich habe dir ... geschickt“ erforderlich.
  - severity: low
    issue: Unidiomatische Wiedergabe von שֹׁחַד
    rationale: „Bestechungsgeschenk“ ist nicht falsch, aber „Bestechungsgeld“ ist die geläufigere, präzisere Bezeichnung und passt zu „Silber und Gold“.
  - severity: low
    issue: Richtung des Rückzugs
    rationale: „von mir wegzieht“ verdeutlicht den im Kontext militärisch-politischen Rückzug besser als das etwas mehrdeutige „von mir abzieht“.
