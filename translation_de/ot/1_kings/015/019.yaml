base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/019.yaml
  text: There is a covenant between me and you, between my father and your father. Look, I have sent you a bribe of silver and gold. Go, break your covenant with Baasha king of Israel, so that he may withdraw from me.
translation:
  language: de
  text: »Zwischen mir und dir besteht ein Bund, ebenso zwischen meinem Vater und deinem Vater. Sieh, ich habe dir Silber und Gold als Bestechungsgeld geschickt. Geh und brich deinen Bund mit Bascha, dem König von Israel, damit er von mir wegzieht.«
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּרִית
  choice: Bund
  rationale: Die übliche und kontextuell passende Wiedergabe für eine bindende politische Vereinbarung.
- source_word: שֹׁחַד
  choice: Bestechungsgeschenk
  rationale: Das Wort bezeichnet eine Gabe, die den Empfänger zu einem gewünschten Handeln bewegen soll. Der Kontext bestätigt diese negative beziehungsweise manipulative Funktion; „Bestechungsgeschenk“ wahrt zugleich den konkreten Gabe-Aspekt.
- source_word: הָפֵרָה
  choice: brich
  rationale: Der Hifil-Imperativ von פרר fordert dazu auf, den bestehenden Bund aufzuheben beziehungsweise zu verletzen; „brich deinen Bund“ ist im Deutschen idiomatisch und nah am Bild des Ausgangstextes.
- source_word: וְיַעֲלֶה מֵעָלָי
  choice: damit er von mir abzieht
  rationale: Das Verb עלה kann hier im militärisch-politischen Zusammenhang das Abziehen beziehungsweise Ablassen ausdrücken. „Von mir abzieht“ bewahrt die räumliche Formulierung und den Bezug auf Baschas Druck gegen Asa.
theological_decisions:
- issue: Moralische Bewertung der Zahlung
  choice: Bestechungsgeschenk
  alternative: Geschenk
  rationale: Die Übersetzung folgt der ausdrücklich wertenden Lexik שֹׁחַד und glättet Asas Vorgehen nicht zu einer neutralen diplomatischen Gabe.
- issue: Art des Bundes
  choice: Das allgemein gehaltene „Bund“ bleibt stehen
  alternative: Bündnis oder Vertrag
  rationale: Der hebräische Ausdruck bezeichnet hier zwar eine politische Vereinbarung, doch „Bund“ bewahrt die wiederholte Terminologie und ihre mögliche theologische Spannung, ohne zusätzliche Deutung einzutragen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Rede ist flüssig formuliert, bleibt aber in Satzbau und Bildsprache eng am Hebräischen. „Sieh“ gibt הִנֵּה als Aufmerksamkeitssignal wieder; „ebenso“ macht die parallele Beziehung natürlich verständlich, ohne neue Information hinzuzufügen.
