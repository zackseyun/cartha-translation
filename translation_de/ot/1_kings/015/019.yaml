  to: »Zwischen mir und dir besteht ein Bund, ebenso zwischen meinem Vater und deinem Vater. Sieh, ich habe dir Silber und Gold als Bestechungsgeld geschickt. Geh und brich deinen Bund mit Bascha, dem König von Israel, damit er von mir wegzieht.«
  rationale: Die Revision korrigiert das hebräische Perfekt, ersetzt eine im Deutschen sperrige Zusammensetzung durch die idiomatische und semantisch gleichwertige Bezeichnung „Bestechungsgeld“ und schärft die Richtungsangabe des beabsichtigten Rückzugs. Die politische und moralische Wertung des Ausgangstextes sowie die Bundes-Terminologie bleiben erhalten.
