  text: וַ/יַּעֲבֵ֥ר הַ/קְּדֵשִׁ֖ים מִן הָ/אָ֑רֶץ וַ/יָּ֨סַר֙ אֶת כָּל הַ/גִּלֻּלִ֔ים אֲשֶׁ֥ר עָשׂ֖וּ אֲבֹתָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/012.yaml
  text: He removed the male cult prostitutes from the land[d][c][b][a], and he took away all the idols that his fathers had made.
translation:
  language: de
  text: Er entfernte[a] die männlichen Kultprostituierten[b] aus dem Land und beseitigte alle Götzenbilder[c], die seine Väter[d] angefertigt hatten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »vertrieb«. Das Verb kann das Entfernen oder Ausweisen aus einem Gebiet bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch קְדֵשִׁים: Männer, die mit unerlaubter kultischer Sexualpraxis verbunden waren. Die traditionelle Wiedergabe »Sodomiter« trifft die Bedeutung hier nicht genau.'
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Wort ist eine verächtliche Bezeichnung für Götzen und kann sinngemäß auch als »abscheuliche Götzen« oder besonders drastisch als »Mistgötzen« wiedergegeben werden.
    reason: lexical_alternative
  - marker: d
    text: 'Oder: »seine Vorfahren« beziehungsweise »seine Vorväter«. »Seine Väter« ist eine hebräische Ausdrucksweise für frühere Generationen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֵר
  choice: entfernte
  rationale: Der Hifil von עבר bezeichnet hier das Entfernen beziehungsweise Vertreiben aus einem Gebiet. »Entfernte« ist im modernen Deutschen natürlich und legt die konkrete Vorgehensweise nicht fest.
- source_word: הַקְּדֵשִׁים
  choice: die männlichen Kultprostituierten
  rationale: Der maskuline Plural bezeichnet in diesem Zusammenhang Männer, die mit unerlaubter kultischer Sexualpraxis verbunden waren. Die Wiedergabe vermeidet sowohl das missverständliche traditionelle »Sodomiter« als auch die wörtliche, hier irreführende Bedeutung »Geheiligte«.
- source_word: מִן הָאָרֶץ
  choice: aus dem Land
  rationale: Die Formulierung entspricht dem hebräischen Ausdruck und meint wahrscheinlich das Herrschaftsgebiet Juda.
- source_word: וַיָּסַר
  choice: beseitigte
  rationale: Der Hifil von סור bedeutet hier »entfernen« oder »wegschaffen«. »Beseitigte« gibt den Sinn klar wieder und vermeidet eine unmittelbare Wiederholung von »entfernte«.
- source_word: כָּל הַגִּלֻּלִים
  choice: alle Götzenbilder
  rationale: גִּלּוּלִים ist eine stark verächtliche Bezeichnung für Götzen. »Götzenbilder« benennt den Gegenstand verständlich; die besonders abwertende Färbung wird in einer Fußnote erläutert.
- source_word: אֲשֶׁר עָשׂוּ אֲבֹתָיו
  choice: die seine Väter angefertigt hatten
  rationale: »Seine Väter« bewahrt die maskuline Form und die hebräische Redeweise für frühere Generationen. Das Plusquamperfekt macht deutlich, dass ihre Herstellung Asas Maßnahmen vorausging.
theological_decisions:
- issue: Wiedergabe von אֲבֹתָיו
  choice: seine Väter
  alternative: seine Vorfahren / seine Vorväter
  rationale: Die maskuline Form des Hebräischen bleibt erhalten, ohne die idiomatische Möglichkeit auszuschließen, dass frühere Generationen beziehungsweise königliche Vorgänger gemeint sind.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am Hebräischen, während »männliche Kultprostituierte« den historischen Bezug für heutige Leser verständlich ausdrückt. Die verächtliche Nebenbedeutung von גִּלּוּלִים und die möglichen Alternativen werden in den Fußnoten bewahrt.
