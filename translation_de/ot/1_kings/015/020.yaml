source:
  edition: WLC
  text: וַ/יִּשְׁמַ֨ע בֶּן הֲדַ֜ד אֶל הַ/מֶּ֣לֶךְ אָסָ֗א וַ֠/יִּשְׁלַח אֶת שָׂרֵ֨י הַ/חֲיָלִ֤ים אֲשֶׁר ל/וֹ֙ עַל עָרֵ֣י יִשְׂרָאֵ֔ל וַ/יַּךְ֙ אֶת עִיּ֣וֹן וְ/אֶת דָּ֔ן וְ/אֵ֖ת אָבֵ֣ל בֵּֽית מַעֲכָ֑ה וְ/אֵת֙ כָּל כִּנְר֔וֹת עַ֖ל כָּל אֶ֥רֶץ נַפְתָּלִֽי־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/020.yaml
  text: Ben-hadad listened to King Asa and sent the commanders of the armies that were his against the cities of Israel[a], and he struck Ijon, Dan, Abel-beth-maacah, and all Chinneroth[b], against all the land of Naphtali.
translation:
  language: de
  text: Ben-Hadad hörte auf König Asa[a] und sandte die Befehlshaber seiner Heere gegen die Städte Israels. Er schlug Ijon, Dan, Abel-Bet-Maacha und ganz Kinnerot[b] samt dem ganzen Land Naftali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „schenkte König Asa Gehör“. Die hebräische Wendung bezeichnet hier ein zustimmendes Hören, auf das eine entsprechende Handlung folgt.'
    reason: lexical_alternative
  - marker: b
    text: Kinnerot ist hier ein geografischer Name und bezeichnet wahrscheinlich einen Bezirk oder eine Landschaft.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמַע ... אֶל
  choice: hörte auf
  rationale: Die Wendung bedeutet hier, dass Ben-Hadad Asa Gehör schenkte und seinem Anliegen entsprechend handelte. „Hörte auf“ ist idiomatisches Deutsch und behauptet nicht, Asa habe Befehlsgewalt über ihn gehabt.
- source_word: שָׂרֵי הַחֲיָלִים אֲשֶׁר לוֹ
  choice: die Befehlshaber seiner Heere
  rationale: שָׂרֵי bezeichnet militärische Führer, חֲיָלִים hier Streitkräfte oder Heere; אֲשֶׁר לוֹ drückt Zugehörigkeit beziehungsweise Unterstellung aus.
- source_word: עַל עָרֵי יִשְׂרָאֵל
  choice: gegen die Städte Israels
  rationale: In Verbindung mit dem Aussenden militärischer Befehlshaber bezeichnet עַל die feindliche Stoßrichtung.
- source_word: וַיַּךְ
  choice: Er schlug
  rationale: Das Verb נכה kann schlagen, angreifen oder besiegen bedeuten. „Schlug“ bewahrt seine knappe, militärische Breite, ohne ausdrücklich Eroberung oder vollständige Niederlage zu behaupten.
- source_word: עִיּוֹן
  choice: Ijon
  rationale: Gebräuchliche deutsche Umschrift des Ortsnamens.
- source_word: אָבֵל בֵּית מַעֲכָה
  choice: Abel-Bet-Maacha
  rationale: Die Form folgt einer im Deutschen verständlichen Umschrift des zusammengesetzten Ortsnamens.
- source_word: כָּל כִּנְרוֹת
  choice: ganz Kinnerot
  rationale: Kinnerot ist hier ein geografischer Name, wahrscheinlich für einen Bezirk oder eine Landschaft; כָּל weist auf dessen Gesamtheit.
- source_word: עַל כָּל אֶרֶץ נַפְתָּלִי
  choice: samt dem ganzen Land Naftali
  rationale: Nach der Aufzählung der angegriffenen Orte und des Gebiets Kinnerot erweitert עַל die Angabe auf das gesamte Land Naftali. „Samt“ gibt diesen einschließenden Zusammenhang natürlicher wieder als ein zweites „gegen“.
