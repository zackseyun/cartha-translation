  text: וְ/יֶ֨תֶר דִּבְרֵ֤י אֲבִיָּם֙ וְ/כָל אֲשֶׁ֣ר עָשָׂ֔ה הֲ/לֽוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֣י יְהוּדָ֑ה וּ/מִלְחָמָ֥ה הָיְתָ֛ה בֵּ֥ין אֲבִיָּ֖ם וּ/בֵ֥ין יָרָבְעָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/007.yaml
  text: The rest of the acts of Abijam[a], and all that he did[b], are they not written in the Book of the Chronicles of the Kings of Judah? And there was war between Abijam and Jeroboam.
translation:
  language: de
  text: Die übrigen Taten Abijams[a] und alles, was er tat – steht das nicht im Buch der Chronik der Könige von Juda geschrieben?[b] Zwischen Abijam und Jerobeam herrschte Krieg.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Abijam wird in einigen parallelen oder verwandten Stellen Abija genannt; der hebräische Text hat hier Abijam.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „in den Annalen der Könige von Juda“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי
  choice: die übrigen Taten
  rationale: Die feste königsgeschichtliche Schlussformel bezeichnet die weiteren Taten beziehungsweise Ereignisse einer Herrschaft; diese Wiedergabe ist im Deutschen natürlich und sachgerecht.
- source_word: אֲבִיָּם
  choice: Abijam
  rationale: Der masoretische Text hat hier ausdrücklich die Namensform Abijam; sie wird nicht an die verwandte Form Abija angeglichen.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: und alles, was er tat
  rationale: Die allgemeine Aussage des Hebräischen bleibt ohne inhaltliche Präzisierung erhalten.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: steht das nicht … geschrieben?
  rationale: Bewahrt die rhetorische Frage und verwendet zugleich eine natürliche deutsche Formulierung; das zusammengefasste Geschehen wird idiomatisch mit dem singularischen „das“ aufgenommen.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים
  choice: Buch der Chronik
  rationale: Gibt den Titel eines annalistischen Geschichtswerks verständlich wieder, ohne ihn mit dem biblischen Buch Chronik gleichzusetzen.
- source_word: לְמַלְכֵי יְהוּדָה
  choice: der Könige von Juda
  rationale: Das ל bezeichnet hier idiomatisch die Zuordnung des annalistischen Werks zu den Königen von Juda.
- source_word: וּמִלְחָמָה הָיְתָה
  choice: herrschte Krieg
  rationale: Natürliche deutsche Wiedergabe der Existenzkonstruktion; sie behauptet keine ausdrücklich bezeichnete Dauer.
- source_word: יָרָבְעָם
  choice: Jerobeam
  rationale: Im modernen deutschen Bibelgebrauch etablierte Namensform.
