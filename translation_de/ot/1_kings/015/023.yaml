base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/023.yaml
  text: The rest of all the acts of Asa[a], and all his might, and all that he did[b], and the cities that he built—are they not written in the Book of the Chronicles of the Kings of Judah? Yet in the time of his old age he became diseased in his feet.
translation:
  language: de
  text: Was sonst noch über Asa zu berichten ist – über all seine Macht, über alles, was er tat, und über die Städte, die er baute –, steht das nicht geschrieben im Buch der Chronik der Könige von Juda? Doch im Alter erkrankte er an den Füßen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Hebräische nennt die Füße als betroffene Körperregion, bezeichnet aber die genaue Krankheit nicht.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר כָּל דִּבְרֵי אָסָא
  choice: Was es sonst noch über Asa zu berichten gibt
  rationale: Die Wendung gehört zur üblichen Königsformel. דְּבָרִים bezeichnet hier umfassend Begebenheiten beziehungsweise Taten; die deutsche Formulierung gibt den historiografischen Sinn natürlich wieder.
- source_word: וְכָל גְּבוּרָתוֹ
  choice: über all seine Macht
  rationale: גְּבוּרָה kann Stärke, Macht oder Machttaten bezeichnen. „Macht“ bewahrt den abstrakten Sinn und unterscheidet die Aussage von dem anschließenden „alles, was er tat“.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: über alles, was er tat
  rationale: Eine direkte und umfassende Wiedergabe des Relativsatzes.
- source_word: וְהֶעָרִים אֲשֶׁר בָּנָה
  choice: und über die Städte, die er baute
  rationale: בנה bedeutet ausdrücklich „bauen“. Eine mögliche Befestigung der Städte wird nicht in den Text hineingetragen.
- source_word: הֲלֹא הֵמָּה כְתוּבִים
  choice: steht das nicht
  rationale: Die rhetorische Frage bleibt erhalten; der deutsche Singular „das“ fasst die zuvor aufgezählten Angaben idiomatisch zusammen.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: im Buch der Chronik der Könige von Juda
  rationale: Die Formulierung bezeichnet eine schriftliche annalistische Quelle. „Chronik“ ist verständlich und wahrt den Charakter eines Quellentitels.
- source_word: רַק לְעֵת זִקְנָתוֹ
  choice: Doch im Alter
  rationale: רַק leitet hier eine einschränkende beziehungsweise kontrastierende Zusatzbemerkung ein. „Doch“ drückt diese Funktion natürlich aus; „im Alter“ gibt die Zeitangabe knapp wieder.
- source_word: חָלָה אֶת רַגְלָיו
  choice: erkrankte er an den Füßen
  rationale: Das Hebräische nennt die betroffene Körperregion, aber keine genaue Krankheit. „Erkrankte … an“ ist im Deutschen idiomatisch und erhält diese Unbestimmtheit.
