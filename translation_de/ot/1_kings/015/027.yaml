  text: וַ/יִּקְשֹׁ֨ר עָלָ֜י/ו בַּעְשָׁ֤א בֶן אֲחִיָּה֙ לְ/בֵ֣ית יִשָּׂשכָ֔ר וַ/יַּכֵּ֣/הוּ בַעְשָׁ֔א בְּ/גִבְּת֖וֹן אֲשֶׁ֣ר לַ/פְּלִשְׁתִּ֑ים וְ/נָדָב֙ וְ/כָל יִשְׂרָאֵ֔ל צָרִ֖ים עַֽל גִּבְּתֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/027.yaml
  text: Then Baasha son of Ahijah[a], of the house of Issachar, conspired against him, and Baasha struck him down at Gibbethon, which belonged to the Philistines[c][b], while Nadab and all Israel were besieging Gibbethon.
translation:
  language: de
  text: Da verschwor sich Bascha, der Sohn Ahijas, aus dem Haus Issachar, gegen ihn[a]. Bascha erschlug ihn[b] in Gibbeton, das den Philistern gehörte[c], während Nadab und ganz Israel Gibbeton belagerten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „plante ein Komplott gegen ihn“; „bildete eine Verschwörung gegen ihn“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „tötete ihn“; das hebräische Verb bedeutet wörtlich „schlug ihn“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „das von den Philistern gehalten wurde“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשֹׁר עָלָיו
  choice: Da verschwor sich … gegen ihn
  rationale: קשר mit עַל bezeichnet hier eine gegen jemanden gerichtete Verschwörung. Die deutsche Wendung bewahrt den politischen Sinn und schließt sowohl Komplott als auch Verschwörung ein.
- source_word: בַּעְשָׁא בֶן אֲחִיָּה
  choice: Bascha, der Sohn Ahijas
  rationale: Die Namen werden nach geläufiger deutscher Bibeltradition wiedergegeben; בֶן wird als gewöhnliche Abstammungsangabe übersetzt.
- source_word: לְבֵית יִשָּׂשכָר
  choice: aus dem Haus Issachar
  rationale: Die Wendung bezeichnet die familiäre beziehungsweise stammesmäßige Zugehörigkeit. „Aus dem Haus“ klingt im Deutschen natürlich und erhält dieses Herkunftsmotiv.
- source_word: וַיַּכֵּהוּ
  choice: Bascha erschlug ihn
  rationale: נכה bedeutet grundsätzlich „schlagen“; in diesem Erzählzusammenhang ist die Handlung tödlich. „Erschlug“ bewahrt sowohl das Bild des Schlagens als auch dessen hier eindeutiges Ergebnis.
- source_word: בְּגִבְּתוֹן
  choice: bei Gibbeton
  rationale: „Bei“ bezeichnet idiomatisch den Schauplatz einer militärischen Handlung an einer belagerten Stadt.
- source_word: אֲשֶׁר לַפְּלִשְׁתִּים
  choice: das den Philistern gehörte
  rationale: Die Konstruktion mit לְ kann Besitz oder Herrschaft ausdrücken. Die Hauptübersetzung gibt die naheliegende Besitzrelation wieder, während die Fußnote militärische Kontrolle als mögliche Nuance nennt.
- source_word: וְנָדָב וְכָל יִשְׂרָאֵל
  choice: während Nadab und ganz Israel
  rationale: Das וְ leitet hier zusammen mit dem Partizip plausibel einen begleitenden Umstand ein; „während“ macht diese zeitliche Hintergrundfunktion in natürlichem Deutsch deutlich.
- source_word: צָרִים עַל גִּבְּתוֹן
  choice: Gibbeton belagerten
  rationale: צור על bezeichnet im militärischen Zusammenhang das Belagern einer Stadt. Das deutsche Präteritum fügt sich in die Erzählung und gibt den andauernden Hintergrund zusammen mit „während“ wieder.
