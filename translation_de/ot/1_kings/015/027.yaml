  source_fidelity: 'Die Übersetzung gibt die politische Verschwörung (קשׁר על), Baschas Zugehörigkeit zum Haus/Stamm Issachar, die tödliche Gewalthandlung sowie die gleichzeitig andauernde Belagerung zutreffend wieder. Für die Ortsangabe בְגִבְּתוֹן ist „in Gibbeton“ im Deutschen präziser als „bei Gibbeton“: Letzteres kann einen Ort in der Nähe, aber außerhalb der Stadt, nahelegen.'
