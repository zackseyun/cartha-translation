base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/001.yaml
  text: In the eighteenth year of King Jeroboam son of Nebat[a], Abijam became king over Judah.
translation:
  language: de
  text: Im achtzehnten Regierungsjahr des Königs Jerobeam, des Sohnes Nebats, wurde Abijam[a] König über Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Abijam“; derselbe König wird an anderen Stellen „Abija“ genannt.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בִ/שְׁנַת שְׁמֹנֶה עֶשְׂרֵה
  choice: Im achtzehnten Regierungsjahr
  rationale: Die hebräische Datierungsformel wird im Deutschen natürlich und präzise mit „im ... Regierungsjahr“ wiedergegeben; das einleitende ו wird in dieser konventionellen Zeitangabe nicht eigens übersetzt.
- source_word: לַ/מֶּלֶךְ יָרָבְעָם בֶּן נְבָט
  choice: König Jerobeams, des Sohnes Nebats
  rationale: Der Genitiv bezeichnet das Regierungsjahr Jerobeams. Die Apposition bewahrt die hebräische Abstammungsangabe und klingt im modernen Standarddeutsch würdig und natürlich.
- source_word: מָלַךְ
  choice: wurde ... König
  rationale: In dieser Thronbesteigungsnotiz bezeichnet das Verb den Herrschaftsantritt, nicht allgemein die gesamte Regierungszeit.
- source_word: אֲבִיָּם
  choice: Abijam
  rationale: Der masoretische Text bietet hier ausdrücklich die Namensform Abijam; sie wird trotz der Form Abija an anderen Stellen im Haupttext bewahrt.
- source_word: עַל יְהוּדָה
  choice: König über Juda
  rationale: עַל bezeichnet hier den Herrschaftsbereich; „über Juda“ gibt diese Beziehung direkt wieder.
