id: 1KI.15.11
reference: 1 Kings 15:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּ֧עַשׂ אָסָ֛א הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/דָוִ֖ד אָבִֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/011.yaml
  text: Asa did what was right in the eyes of Yahweh[a], as David his father had done.
translation:
  language: de
  text: Asa tat, was in den Augen Jahwes richtig war, wie sein Vater David.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wie sein Vorfahr David«. »Vater« bezeichnet hier einen Vorfahren innerhalb der königlichen Linie, nicht den unmittelbaren Vater.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: tat
  rationale: עשה bedeutet gewöhnlich »tun/machen«; in der königlichen Beurteilungsformel ist »tat, was … richtig war« im Deutschen natürlich und genau.
- source_word: אָסָא
  choice: Asa
  rationale: Der Personenname wird nach der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: הַיָּשָׁר
  choice: was … richtig war
  rationale: יָשָׁר bezeichnet das Gerade, Rechte oder Aufrichtige. Die substantivierte Form wird im Zusammenhang idiomatisch als »was … richtig war« wiedergegeben.
- source_word: בְּעֵינֵי
  choice: in den Augen
  rationale: Die hebräische Wendung bezeichnet eine Beurteilung aus der Perspektive einer Person; die deutsche Form wahrt das verständliche Bild.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als der im modernen Deutschen geläufige Name »Jahwe« wiedergegeben, statt es durch einen Titel zu ersetzen.
- source_word: כְּדָוִד
  choice: wie … David
  rationale: Das Präfix כ־ kennzeichnet hier einen Vergleich; »wie« gibt ihn knapp und natürlich wieder.
- source_word: אָבִיו
  choice: sein Vater
  rationale: אָב kann sowohl den unmittelbaren Vater als auch einen Vorfahren bezeichnen. »Vater« wahrt die dynastische Ausdrucksweise des Ausgangstextes; die gemeinte weitere Abstammung wird in einer Fußnote erläutert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. Die Transliteration bewahrt den Charakter als Eigenname, während »der HERR« ihn durch einen Titel ersetzen würde.
- issue: Bedeutung von »sein Vater David« bei Asa
  choice: Die Bezeichnung »Vater« im Haupttext beibehalten
  alternative: sein Vorfahr David
  rationale: Die Formulierung bewahrt die dynastische Sprache des Hebräischen. Da David nicht Asas unmittelbarer Vater war, macht die Fußnote den hier eingeschlossenen Sinn »Vorfahr« deutlich, ohne die Mehrdeutigkeit im Haupttext aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle biblische Beurteilungsformel bleibt durch »in den Augen Jahwes« erkennbar; die knappe Vergleichsphrase folgt der Ellipse des Hebräischen.
