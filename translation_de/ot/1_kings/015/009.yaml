  text: וּ/בִ/שְׁנַ֣ת עֶשְׂרִ֔ים לְ/יָרָבְעָ֖ם מֶ֣לֶךְ יִשְׂרָאֵ֑ל מָלַ֥ךְ אָסָ֖א מֶ֥לֶךְ יְהוּדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/009.yaml
  text: In the twentieth year of Jeroboam king of Israel[b][a], Asa became king over Judah.
translation:
  language: de
  text: Im zwanzigsten Regierungsjahr Jerobeams, des Königs von Israel, wurde Asa König von Juda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „begann Asa als König von Juda zu regieren“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בִ/שְׁנַת עֶשְׂרִים
  choice: Im zwanzigsten Regierungsjahr
  rationale: Die hebräische chronologische Formel verwendet wörtlich „im Jahr zwanzig“. Im modernen Deutschen gibt „im zwanzigsten Regierungsjahr“ den ordinalen Sinn und den Bezug auf die Herrschaft eindeutig und natürlich wieder; das einleitende ו wird in dieser fortlaufenden Königsnotiz nicht eigens mit „und“ übersetzt.
- source_word: לְ/יָרָבְעָם
  choice: Jerobeams
  rationale: Das ל kennzeichnet hier den Herrscher, dessen Regierungsjahre gezählt werden. Der deutsche Genitiv ist in dieser Datierungsformel idiomatisch.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: des Königs von Israel
  rationale: Der Königstitel wird in einer natürlichen deutschen Apposition formal bewahrt.
- source_word: מָלַךְ
  choice: wurde … König
  rationale: In Königsformeln bezeichnet das Qatal von מלך hier den Regierungsantritt. „Wurde König“ ist klarer als das möglicherweise durative „regierte“.
- source_word: אָסָא
  choice: Asa
  rationale: Eingebürgerte deutsche Namensform.
- source_word: מֶלֶךְ יְהוּדָה
  choice: König von Juda
  rationale: Die hebräische Status-constructus-Verbindung bedeutet formal „König von Juda“ und klingt im Deutschen nach „wurde“ natürlich.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die knappe chronologische Königsformel bleibt erhalten; „Regierungsjahr“ verdeutlicht den im Hebräischen vorausgesetzten Bezug, ohne den Sinn zu erweitern.
