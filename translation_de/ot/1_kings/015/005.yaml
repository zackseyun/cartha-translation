source:
  edition: WLC
  text: אֲשֶׁ֨ר עָשָׂ֥ה דָוִ֛ד אֶת הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה וְ/לֹֽא סָ֞ר מִ/כֹּ֣ל אֲשֶׁר צִוָּ֗/הוּ כֹּ֚ל יְמֵ֣י חַיָּ֔י/ו רַ֕ק בִּ/דְבַ֖ר אוּרִיָּ֥ה הַ/חִתִּֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/005.yaml
  text: because David had done what was right in the eyes of Yahweh and had not turned aside from anything that he had commanded him all the days of his life[a], except in the matter of Uriah the Hittite.
translation:
  language: de
  text: denn David hatte getan, was in den Augen Jahwes recht war, und war sein Leben lang von nichts abgewichen, was er ihm geboten hatte, außer in der Sache mit Uria, dem Hetiter.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „außer im Fall Urias, des Hetiters“.'
    reason: Lexikalische Alternative für בִּדְבַר אוּרִיָּה.
lexical_decisions:
- source_word: אֲשֶׁר
  choice: denn
  rationale: Das Relativpartikel begründet im Zusammenhang die vorausgehende Aussage aus Vers 4; „denn“ gibt diese kausale Funktion im Deutschen natürlich wieder.
- source_word: עָשָׂה ... אֶת הַיָּשָׁר
  choice: hatte getan, was ... recht war
  rationale: Die hebräische Wendung bezeichnet ein Tun, das als recht beurteilt wird. Die deutsche Formulierung ist idiomatisch und bewahrt die moralische Wertung.
- source_word: בְּעֵינֵי יְהוָה
  choice: in den Augen Jahwes
  rationale: Die geläufige hebräische Bewertungsmetapher wird verständlich und quellennah beibehalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben.
- source_word: וְלֹא סָר
  choice: und war ... von nichts abgewichen
  rationale: סור bezeichnet hier das Abweichen von dem Gebotenen. „Abweichen“ ist im Deutschen klar und passt zum folgenden „von“.
- source_word: מִכֹּל אֲשֶׁר צִוָּהוּ
  choice: von nichts ..., was er ihm geboten hatte
  rationale: 'Nach der Verneinung gibt „von nichts“ die Gesamtheit von כֹּל idiomatisch wieder. Die Pronomen bleiben wie im Hebräischen stehen: Jahwe ist der Gebietende, David der Empfänger.'
- source_word: כֹּל יְמֵי חַיָּיו
  choice: sein Leben lang
  rationale: Die natürliche deutsche Zeitangabe gibt den gesamten Lebenszeitraum der hebräischen Wendung prägnant wieder.
- source_word: רַק
  choice: außer
  rationale: Das Wort führt hier die ausdrücklich genannte Ausnahme von der vorausgehenden umfassenden Würdigung ein.
- source_word: בִּדְבַר אוּרִיָּה
  choice: in der Sache mit Uria
  rationale: בִּדְבַר kann eine Angelegenheit oder einen Fall bezeichnen. „In der Sache mit“ ist in modernem Deutsch natürlich und lässt den genauen Umfang des Geschehens offen.
- source_word: אוּרִיָּה הַחִתִּי
  choice: Uria, dem Hetiter
  rationale: Der Personenname und die Volkszugehörigkeit werden in ihrer im Deutschen üblichen biblischen Form wiedergegeben.
theological_decisions:
- issue: Bewertung von Davids Gehorsam trotz seiner bekannten Sünden
  choice: Die umfassende Würdigung mit der einen ausdrücklich genannten Ausnahme bleibt unverändert stehen.
  alternative: Die Aussage durch Zusätze wie „im Allgemeinen“, durch einen Hinweis auf Davids Umkehr oder durch eine Erklärung seiner Bundestreue abschwächen beziehungsweise erläutern.
  rationale: Der Vers selbst hält die weitreichende Anerkennung und die konkrete Ausnahme spannungsvoll zusammen. Die Übersetzung darf diese Spannung nicht durch zusätzliche Theologie auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzanschluss mit „denn“ berücksichtigt den Zusammenhang mit Vers 4. Die hebräische Bildsprache „in den Augen“ bleibt erhalten; die übrige Syntax ist zugunsten natürlicher deutscher Lesbarkeit behutsam geglättet.
