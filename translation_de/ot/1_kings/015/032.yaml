lexical_decisions:
- source_word: וּ/מִלְחָמָה הָיְתָה
  choice: Und … herrschte Krieg
  rationale: Die Verbindung wird im Deutschen natürlich als fortdauernder Kriegszustand ausgedrückt. „Herrschte Krieg“ gibt die existenzielle Konstruktion idiomatisch wieder, ohne einzelne ununterbrochene Kampfhandlungen zu behaupten.
- source_word: בֵּין ... וּ/בֵין
  choice: zwischen … und
  rationale: Die korrelative hebräische Präposition wird nach üblichem deutschen Sprachgebrauch nur einmal wiedergegeben.
- source_word: אָסָא
  choice: Asa
  rationale: Gebräuchliche deutsche Namensform.
- source_word: בַּעְשָׁא
  choice: Bascha
  rationale: Gebräuchliche deutsche Namensform.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: dem König von Israel
  rationale: Die Apposition identifiziert Bascha; Kasus und Artikel entsprechen natürlichem Standarddeutsch.
- source_word: כָּל יְמֵי/הֶם
  choice: solange sie lebten
  rationale: Die hebräische Wendung bedeutet wörtlich „alle ihre Tage“ und bezeichnet hier idiomatisch die gesamte gemeinsame Lebenszeit der beiden Herrscher.
