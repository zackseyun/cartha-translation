  source_fidelity: 'Die Grundstruktur und die Sachangaben entsprechen dem Hebräischen: Asa nimmt den verbliebenen Schatzbestand aus den beiden Schatzkammern, übergibt ihn seinen Dienern und sendet ihn an Ben-Hadad. Die Wiedergabe der Abstammungsfolge als „Sohn … und Enkel“ legt jedoch eine genealogische Präzisierung nahe, die die wiederholte hebräische בן-Konstruktion nicht ausdrücklich macht. Außerdem ist „ließ ihm sagen“ gegenüber לֵאמֹר unnötig vermittelnd und führt ein singuläres Empfängerpronomen ein.'
  naturalness: Der Satz ist insgesamt modernes, würdiges Standarddeutsch. „Königshaus“ ist verständlich, kann aber sowohl Dynastie als auch Palast meinen; die Fußnote fängt die räumlich-palastartige Bedeutung ausreichend auf. „Mit den Worten:“ ist am Versende eine natürliche und knappe Einführung der im folgenden Vers fortgesetzten direkten Rede.
  terminology: „Jahwe“ gibt יהוה angemessen wieder; „Aram“ bewahrt die historische Bezeichnung. „Schatzkammern“, „Diener“ und „König von Aram“ sind treffend. Die Namensformen Ben-Hadad, Tabrimmon und Hesjon sind konsistent und gebräuchlich.
