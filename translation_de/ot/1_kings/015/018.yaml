source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אָ֠סָא אֶת כָּל הַ/כֶּ֨סֶף וְ/הַ/זָּהָ֜ב הַֽ/נּוֹתָרִ֣ים בְּ/אוֹצְר֣וֹת בֵּית יְהוָ֗ה וְ/אֶת אֽוֹצְרוֹת֙ בֵּ֣ית מלך וַֽ/יִּתְּנֵ֖/ם בְּ/יַד עֲבָדָ֑י/ו וַ/יִּשְׁלָחֵ֞/ם הַ/מֶּ֣לֶךְ אָסָ֗א אֶל בֶּן הֲ֠דַד בֶּן טַבְרִמֹּ֤ן בֶּן חֶזְיוֹן֙ מֶ֣לֶךְ אֲרָ֔ם הַ/יֹּשֵׁ֥ב בְּ/דַמֶּ֖שֶׂק לֵ/אמֹֽר־־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/018.yaml
  text: Then Asa took all the silver and the gold that remained in the treasuries of the house of Yahweh and in the treasuries of the king’s house[a], and put them into the hand of his servants. Then King Asa sent them to Ben-hadad son of Tabrimmon, son of Hezion, king of Aram, who lived in Damascus, saying[b],
translation:
  language: de
  text: 'Darauf nahm Asa alles Silber und Gold, das in den Schatzkammern des Hauses Jahwes und in den Schatzkammern des Königshauses[a] übrig geblieben war, und legte es in die Hände seiner Diener. Dann sandte König Asa das Silber und Gold an Ben-Hadad, den Sohn Tabrimmons, der ein Sohn Hesjons war, den König von Aram[b], der in Damaskus wohnte, mit den Worten:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des Königspalastes“.'
    reason: lexical_alternative
  - marker: b
    text: Hebräisch „Aram“; traditionell „Syrien“.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Darauf nahm Asa
  rationale: Das narrative Waw führt die Handlung weiter. „Darauf“ gibt die zeitliche Abfolge in natürlichem Deutsch wieder.
- source_word: כָּל הַכֶּסֶף וְהַזָּהָב הַנּוֹתָרִים
  choice: alles Silber und Gold, das … übrig geblieben war
  rationale: „Alles“ bewahrt die umfassende Aussage von כָּל; der Relativsatz gibt das Partizip הַנּוֹתָרִים als verbliebenen Restbestand wieder.
- source_word: בְּאוֹצְרוֹת בֵּית יְהוָה
  choice: in den Schatzkammern des Hauses Jahwes
  rationale: אֹצָרוֹת bezeichnet hier wegen des Silbers und Goldes Schatzkammern. „Haus Jahwes“ ist eine quellennahe Bezeichnung für den Tempel; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: וְאֶת אֹצְרוֹת בֵּית מלך
  choice: und in den Schatzkammern des Königshauses
  rationale: Wörtlich steht „Haus des Königs“. „Königshaus“ ist im Deutschen knapp und verständlich, kann hier jedoch den königlichen Palast bezeichnen; darauf weist die Fußnote hin.
- source_word: וַיִּתְּנֵם בְּיַד עֲבָדָיו
  choice: und legte es in die Hände seiner Diener
  rationale: Die hebräische Wendung „in die Hand geben“ bezeichnet die Übergabe in die Verfügungsgewalt. Der Plural „Hände“ ist im Deutschen idiomatisch; „es“ nimmt „Silber und Gold“ als Gesamtbestand auf.
- source_word: וַיִּשְׁלָחֵם
  choice: Dann sandte König Asa das Silber und Gold
  rationale: Das Objektsuffix verweist auf die Wertsachen. Die Wiederholung von „das Silber und Gold“ vermeidet im Deutschen eine unklare pronominale Rückverweisung auf die Diener.
- source_word: בֶּן הֲדַד בֶּן טַבְרִמֹּן בֶּן חֶזְיוֹן
  choice: Ben-Hadad, den Sohn Tabrimmons und Enkel Hesjons
  rationale: Die Abstammungsfolge bleibt vollständig erhalten. „Enkel“ gibt das zweite בֶּן in natürlichem Deutsch eindeutig wieder.
- source_word: מֶלֶךְ אֲרָם
  choice: den König von Aram
  rationale: „Aram“ bewahrt die historische hebräische Gebietsbezeichnung und ersetzt sie nicht durch das spätere „Syrien“.
- source_word: הַיֹּשֵׁב בְּדַמֶּשֶׂק
  choice: der in Damaskus seinen Sitz hatte
  rationale: יָשַׁב kann sowohl wohnen als auch seinen Sitz haben bedeuten. Bei einem König passt „seinen Sitz hatte“, ohne mehr als seine Residenz in Damaskus auszusagen.
- source_word: לֵאמֹר
  choice: 'und ließ ihm sagen:'
  rationale: Der Infinitiv leitet die folgende direkte Rede ein. Die deutsche Formel ist natürlicher als ein wörtliches „sprechend“ und der Doppelpunkt zeigt die Fortsetzung im nächsten Vers an.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova
  rationale: Der hebräische Text verwendet den Eigennamen Gottes. „Jahwe“ ist die im modernen Deutschen übliche wissenschaftliche Umschrift und bewahrt den Namen statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von אֲרָם
  choice: Aram
  alternative: Syrien
  rationale: „Aram“ erhält die historische und sprachliche Bezeichnung des hebräischen Textes. „Syrien“ ist die traditionelle, aber spätere geografische Benennung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt erzählerisch und quellennahe, während unklare deutsche Pronomen durch die Wiederaufnahme von „das Silber und Gold“ vermieden werden. Die Eigennamen folgen gebräuchlichen deutschen Formen.
