  text: וַֽ/יְהִי֙ כִּ/שְׁמֹ֣עַ בַּעְשָׁ֔א וַ/יֶּחְדַּ֕ל מִ/בְּנ֖וֹת אֶת הָֽ/רָמָ֑ה וַ/יֵּ֖שֶׁב בְּ/תִרְצָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/021.yaml
  text: And when Baasha heard of it[a], he stopped building Ramah and remained in Tirzah.
translation:
  language: de
  text: Als Bascha davon hörte, ließ er vom Bau Ramas ab und wohnte in Tirza.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Als … davon hörte
  rationale: Die hebräische Erzählformel mit Infinitivkonstruktion leitet einen temporalen Nebensatz ein. „Als“ gibt ihre Funktion in natürlichem modernem Deutsch wieder; „davon“ ergänzt idiomatisch den aus dem Zusammenhang erschließbaren Inhalt des Hörens.
- source_word: בַּעְשָׁא
  choice: Bascha
  rationale: Der Personenname wird nach gebräuchlicher deutscher Bibeltradition transkribiert.
- source_word: וַיֶּחְדַּל מִבְּנוֹת
  choice: hörte er auf, … auszubauen
  rationale: חדל mit מן und Infinitiv bezeichnet das Aufhören mit einer Tätigkeit. „Hörte auf“ ist die natürliche deutsche Entsprechung; „ausbauen“ passt bei einer bereits bestehenden befestigten Ortschaft besser als das missverständliche „Rama bauen“.
- source_word: אֶת הָרָמָה
  choice: Rama
  rationale: Der Ausdruck bezeichnet den Ortsnamen; der hebräische Artikel wird im Deutschen beim Eigennamen nicht wiedergegeben.
- source_word: וַיֵּשֶׁב
  choice: blieb
  rationale: ישׁב kann „sitzen“, „wohnen“, „bleiben“ oder „sich niederlassen“ bedeuten. Im Zusammenhang bezeichnet „blieb“ knapp Baschas Aufenthalt in Tirza, ohne ausdrücklich eine dauerhafte Neuansiedlung zu behaupten.
- source_word: בְּתִרְצָה
  choice: in Tirza
  rationale: Der Ortsname wird nach gebräuchlicher deutscher Form wiedergegeben; ב wird mit „in“ übersetzt.
theological_decisions: []
translation_notes:
  register: Moderne, klare und würdige Erzählsprache. Die einleitende hebräische Erzählformel wird nicht hölzern mit „Und es geschah“ wiedergegeben. Keine Fußnote ist nötig, da die mögliche Bedeutungsbreite von וַיֵּשֶׁב durch „blieb“ sachgerecht und ohne theologische Festlegung ausgedrückt wird.
