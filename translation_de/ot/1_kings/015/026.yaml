  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יֵּ֨לֶךְ֙ בְּ/דֶ֣רֶךְ אָבִ֔י/ו וּ֨/בְ/חַטָּאת֔/וֹ אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/026.yaml
  text: He did what was evil in the sight of Yahweh and walked in the way of his father and in his sin with which he caused Israel to sin.
translation:
  language: de
  text: Er tat, was in den Augen Jahwes böse war, und wandelte auf dem Weg seines Vaters und in dessen Sünde, durch die dieser Israel zur Sünde verführte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Er tat, was böse war
  rationale: Die feste Königsformel wird nah am Hebräischen und zugleich idiomatisch deutsch wiedergegeben.
- source_word: בְּעֵינֵי יְהוָה
  choice: in den Augen Jahwes
  rationale: Bewahrt das hebräische Bild der göttlichen Beurteilung; der Gottesname יהוה wird als Jahwe wiedergegeben.
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ אָבִיו
  choice: und ging auf dem Weg seines Vaters
  rationale: Erhält die Wegmetapher für die Lebensführung und das Verhalten.
- source_word: וּבְחַטָּאתוֹ
  choice: und in dessen Sünde
  rationale: Das Suffix bezieht sich im Zusammenhang auf den Vater. „Dessen“ macht diesen Bezug im Deutschen klar, ohne die Einzahl „Sünde“ aufzulösen.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: durch die dieser Israel zur Sünde verführte
  rationale: Der Hifil von חטא ist kausativ. „Zur Sünde verführen“ ist natürliches Deutsch und bezeichnet, dass der Vater Israel zum Sündigen brachte.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה; „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug der pronominalen Formen in „seiner Sünde, durch die er Israel sündigen ließ“
  choice: Bezug auf den Vater
  alternative: Bezug auf den regierenden Sohn
  rationale: Der nächste ausdrückliche Bezugsgegenstand ist „sein Vater“, und die wiederkehrende Formel in 1 Könige bezeichnet die Sünde des Vorgängers, durch die dieser Israel zur Sünde verleitete. Die deutsche Formulierung macht diesen syntaktisch naheliegenden Bezug deutlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die formelhafte Sprache der Königsbücher sowie die Bilder von Augen, Weg und Sünde bleiben weitgehend erhalten; unnötig altertümliche Formulierungen werden vermieden.
