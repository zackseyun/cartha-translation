base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/017.yaml
  text: Then Baasha king of Israel went up against Judah and built Ramah[b][a], so as not to allow anyone to go out or come in to Asa king of Judah.
translation:
  language: de
  text: Da zog Bascha, der König von Israel, gegen Juda herauf und baute Rama[a], um den Zugang zu Asa, dem König von Juda, zu unterbinden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »befestigte Rama«. Wörtlich: »baute Rama«; der strategische Zusammenhang kann auf eine militärische Baumaßnahme hindeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »um niemanden hinaus- oder hineingehen zu lassen«. Die hebräische Formel bezeichnet hier freien Personenverkehr beziehungsweise Zugang; Bascha wollte den Verkehr zu Asa, dem König von Juda, unterbinden.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל ... עַל יְהוּדָה
  choice: zog ... gegen Juda herauf
  rationale: עלה mit על bezeichnet hier im militärischen Zusammenhang einen feindlichen Aufmarsch; »heraufziehen gegen« bewahrt sowohl die Bewegungsrichtung als auch den feindlichen Sinn.
- source_word: בַּעְשָׁא מֶלֶךְ יִשְׂרָאֵל
  choice: Bascha, der König von Israel
  rationale: Der Personenname wird in der etablierten deutschen Bibelschreibung wiedergegeben; die Apposition wird zur natürlichen Lesbarkeit mit Artikel gesetzt.
- source_word: וַיִּבֶן אֶת־הָרָמָה
  choice: baute Rama aus
  rationale: בנה bedeutet wörtlich »bauen«. Da Rama bereits als Ort vorausgesetzt ist und der Zusammenhang eine militärische Sicherung nahelegt, gibt »ausbauen« den Sinn natürlicher wieder, ohne ausdrücklich das engere »befestigen« in den Haupttext zu setzen.
- source_word: לְבִלְתִּי תֵּת
  choice: um niemanden ... gehen zu lassen
  rationale: Die Konstruktion bezeichnet den Zweck der Verhinderung. Das im Hebräischen nicht ausdrücklich genannte Objekt wird im Deutschen als »niemanden« ergänzt, damit der Satz verständlich und idiomatisch ist.
- source_word: יֹצֵא וָבָא
  choice: hinaus- oder hineingehen
  rationale: Das Wortpaar bezeichnet umfassend den freien Personenverkehr beziehungsweise Zugang. Die Richtungsadverbien bewahren das konkrete Bild des hebräischen Ausdrucks.
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: zu Asa, dem König von Juda
  rationale: ל wird zurückhaltend als relationale Zielangabe »zu« wiedergegeben; der Text lässt offen, von welchem jeweiligen Ausgangspunkt das Hinaus- und Hineingehen betrachtet wird.
theological_decisions: []
