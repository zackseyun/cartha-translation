  terminology: „Jahwe“, „Leuchte“, „Bestand geben“ und die Erklärung der königsdynastischen Metapher sind angemessen. „Als Nachfolger einsetzen“ trifft die kausative Nachfolgeaussage besser als „als Nachfolger auftreten lassen“.
