  text: כִּ֚י לְמַ֣עַן דָּוִ֔ד נָתַן֩ יְהוָ֨ה אֱלֹהָ֥י/ו ל֛/וֹ נִ֖יר בִּ/ירוּשָׁלִָ֑ם לְ/הָקִ֤ים אֶת בְּנ/וֹ֙ אַחֲרָ֔י/ו וּֽ/לְ/הַעֲמִ֖יד אֶת יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/004.yaml
  text: Nevertheless[a], for David’s sake Yahweh his God gave him a lamp in Jerusalem, to raise up his son after him and to establish Jerusalem.
translation:
  language: de
  text: Doch um Davids willen gab Jahwe, sein Gott, Abijam eine Leuchte[a] in Jerusalem, um dessen Sohn als Nachfolger einzusetzen und Jerusalem Bestand zu geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Licht“. Die „Leuchte in Jerusalem“ ist ein Bild dafür, dass Davids Königslinie dort fortbestand.'
    reason: Lexikalische Alternative und Erklärung der Metapher.
lexical_decisions:
- source_word: כִּי
  choice: Doch
  rationale: Im Zusammenhang bildet der Satz einen einräumenden Gegensatz zur Untreue Abijams in Vers 3. „Doch“ gibt diese Diskursfunktion im Deutschen natürlich wieder.
- source_word: לְמַעַן דָּוִד
  choice: um Davids willen
  rationale: Die Wendung bezeichnet David als denjenigen, um dessentwillen Jahwe handelt; die traditionelle deutsche Fügung ist präzise und verständlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהָיו
  choice: sein Gott
  rationale: Die possessive Form bleibt bewusst ohne ausdrückliche Auflösung des männlichen Bezugs erhalten.
- source_word: נִיר
  choice: Leuchte
  rationale: Das konkrete Bild eines fortdauernden Lichts bleibt erhalten und bezeichnet im Zusammenhang den Fortbestand der davidischen Königslinie.
- source_word: בִּירוּשָׁלָם
  choice: in Jerusalem
  rationale: Die Ortsangabe wird direkt und idiomatisch wiedergegeben.
- source_word: לְהָקִים אֶת בְּנוֹ אַחֲרָיו
  choice: Er ließ seinen Sohn als Nachfolger auftreten
  rationale: Das Hifil von קום und אַחֲרָיו bezeichnen hier das Hervortreten beziehungsweise Einsetzen eines Sohnes in dynastischer Nachfolge. Die deutsche Formulierung macht den gemeinten Nachfolgebezug klar, ohne über den Text hinauszugehen.
- source_word: וּלְהַעֲמִיד אֶת יְרוּשָׁלָם
  choice: und gab Jerusalem Bestand
  rationale: Das Hifil von עמד bedeutet hier, Jerusalem stehen beziehungsweise fortbestehen zu lassen. „Bestand geben“ wahrt das Bild des Erhaltens und klingt im Deutschen natürlich.
theological_decisions:
- issue: Bildhafte Bedeutung von נִיר im Blick auf die davidische Königslinie
  choice: Das Bild „Leuchte“ im Haupttext beibehalten
  alternative: Dynastie; Nachkommenschaft; Licht
  rationale: Der hebräische Text spricht bildhaft vom Fortbestand des davidischen Königtums. Die Metapher wird nicht durch eine theologische Deutung ersetzt, sondern in einer Fußnote erläutert.
- issue: Bezug von „sein Gott“
  choice: Das Pronomen unaufgelöst als „sein Gott“ wiedergeben
  alternative: Jahwe, Abijams Gott; Jahwe, Davids Gott
  rationale: Der unmittelbare Zusammenhang legt Abijam nahe, doch die knappe hebräische Form benennt den Bezug nicht ausdrücklich. Die Übersetzung bewahrt diese Form.
- issue: Verhältnis der beiden Infinitive zu Jahwes Gabe
  choice: Als Erläuterung der Gabe in zwei koordinierten Hauptsätzen wiedergeben
  alternative: um seinen Sohn nach ihm auftreten zu lassen und Jerusalem zu erhalten
  rationale: Die Infinitive erläutern, worin die Gabe der „Leuchte“ konkret besteht. Der Doppelpunkt gibt diesen Zusammenhang deutlich wieder, ohne eindeutig zwischen Zweck und Ergebnis entscheiden zu müssen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Um Davids willen“ bewahrt den feierlichen biblischen Ton; „als Nachfolger auftreten“ und „Bestand geben“ machen die dynastische Aussage für heutige Leser verständlich. Der Fußnotenmarker [a] steht unmittelbar beim Bildwort.
