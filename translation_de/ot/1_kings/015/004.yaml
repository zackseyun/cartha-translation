- from: 'Doch um Davids willen gab Jahwe, sein Gott, ihm eine Leuchte[a] in Jerusalem: Er ließ seinen Sohn als Nachfolger auftreten und gab Jerusalem Bestand.'
  to: Doch um Davids willen gab Jahwe, sein Gott, Abijam eine Leuchte[a] in Jerusalem, um dessen Sohn als Nachfolger einzusetzen und Jerusalem Bestand zu geben.
  rationale: Die Revision erhält die Bildsprache und den knappen possessiven Ausdruck „sein Gott“, gibt aber die beiden hebräischen Infinitive als eng verbundene Zweck- bzw. Erläuterungsinfinitive wieder. „Als Nachfolger einsetzen“ ist für die dynastische Kausativbedeutung genauer als „auftreten lassen“. Die explizite Bezugnahme auf Abijam dient ausschließlich der im Deutschen notwendigen Klärung der Pronomenbezüge.
