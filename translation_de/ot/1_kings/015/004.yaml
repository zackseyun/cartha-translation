  source_fidelity: 'Die Übersetzung bewahrt die wesentlichen Elemente des Hebräischen: den konzessiv-kontrastiven Anschluss, das Handeln um Davids willen, den Gottesnamen, das Bild der „Leuchte“, Jerusalem sowie die doppelte Aussage über dynastische Nachfolge und den Fortbestand Jerusalems. Die Wiedergabe der beiden hebräischen Infinitive durch zwei finite Hauptsätze schwächt jedoch ihre enge Anbindung an die Gabe der „Leuchte“ und macht „ließ ... auftreten“ weniger präzise als das Einsetzen eines Nachfolgers.'
