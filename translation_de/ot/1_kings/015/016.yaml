  yaml_path: translation/ot/1_kings/015/016.yaml
  text: And there was war between Asa and Baasha king of Israel all their days[a].
translation:
  language: de
  text: Und alle ihre Tage lang herrschte Krieg zwischen Asa und Bascha, dem König von Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „alle ihre Tage“. Gemeint sein kann: „ihr ganzes Leben lang“ oder „während ihrer gesamten Regierungszeit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִלְחָמָה הָיְתָה
  choice: herrschte … Krieg
  rationale: Die Existenzkonstruktion bezeichnet einen bestehenden Kriegszustand. „Es war Krieg“ wäre möglich; „herrschte Krieg“ ist im modernen Deutschen natürlicher und gibt keine über den Kontext hinausgehende Einzelhandlung vor.
- source_word: בֵּין ... וּ/בֵין
  choice: zwischen … und
  rationale: Die paarige Präposition bezeichnet die wechselseitige Gegnerschaft zwischen den beiden Herrschern.
- source_word: אָסָא
  choice: Asa
  rationale: Der Personenname wird nach der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: בַּעְשָׁא
  choice: Bascha
  rationale: Der Personenname wird nach der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: dem König von Israel
  rationale: Die Constructusverbindung bezeichnet Baschas Amt; im Deutschen steht die Apposition nach „zwischen“ im Dativ.
- source_word: כָּל יְמֵי/הֶם
  choice: alle ihre Tage lang
  rationale: Die Wiedergabe bewahrt die hebräische Zeitangabe möglichst direkt und vermeidet eine vorschnelle Festlegung darauf, ob ausschließlich Lebenszeit oder im Zusammenhang auch Regierungszeit gemeint ist.
