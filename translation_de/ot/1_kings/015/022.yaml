  text: וְ/הַ/מֶּ֨לֶךְ אָסָ֜א הִשְׁמִ֤יעַ אֶת כָּל יְהוּדָה֙ אֵ֣ין נָקִ֔י וַ/יִּשְׂא֞וּ אֶת אַבְנֵ֤י הָֽ/רָמָה֙ וְ/אֶת עֵצֶ֔י/הָ אֲשֶׁ֥ר בָּנָ֖ה בַּעְשָׁ֑א וַ/יִּ֤בֶן בָּ/ם֙ הַ/מֶּ֣לֶךְ אָסָ֔א אֶת גֶּ֥בַע בִּנְיָמִ֖ן וְ/אֶת הַ/מִּצְפָּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/022.yaml
  text: Then King Asa summoned all Judah—no one was exempt—and they carried away the stones of Ramah and its timber[a], with which Baasha had built[c][b], and King Asa built with them Geba of Benjamin and Mizpah.
translation:
  language: de
  text: Darauf bot König Asa ganz Juda auf – niemand war davon befreit[a]. Sie trugen die Steine und das Bauholz aus Rama weg, die Bascha zum Bau Ramas verwendet hatte[b]. König Asa baute damit Geba in Benjamin und Mizpa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Keiner war frei«; niemand wurde vom verpflichtenden Arbeitsdienst ausgenommen.'
    reason: lexical_alternative
  - marker: b
    text: Der Relativsatz bezieht sich auf die Steine und das Bauholz als die Materialien, die Bascha zum Bau beziehungsweise Ausbau Ramas verwendet hatte.
    reason: syntactic_clarification
lexical_decisions:
- source_word: הִשְׁמִיעַ אֶת כָּל יְהוּדָה
  choice: ließ ganz Juda aufbieten
  rationale: Der Hifil von שׁמע bedeutet wörtlich »hören lassen«, bezeichnet hier aber einen im ganzen Land ergehenden Aufruf zur verpflichtenden Arbeit. »Aufbieten« gibt diese praktische Bedeutung knapp und idiomatisch wieder.
- source_word: אֵין נָקִי
  choice: niemand war davon befreit
  rationale: נָקִי bezeichnet in diesem Zusammenhang nicht moralische Unschuld, sondern Freiheit von einer Verpflichtung beziehungsweise Befreiung vom Arbeitsdienst.
- source_word: וַיִּשְׂאוּ
  choice: sie trugen … weg
  rationale: נשא bezeichnet hier das Abtransportieren der Baumaterialien aus Rama zur Wiederverwendung.
- source_word: אַבְנֵי הָרָמָה
  choice: die Steine von Rama
  rationale: Die Wiedergabe macht in natürlichem Deutsch deutlich, dass die Steine aus dem befestigten Ort Rama abtransportiert wurden.
- source_word: עֵצֶיהָ
  choice: das Bauholz dort
  rationale: Der hebräische Plural bezeichnet hier Holz als Baumaterial. »Dort« nimmt den femininen Rückbezug auf Rama natürlich auf, ohne Rama selbst Holz als Besitz zuzuschreiben.
- source_word: אֲשֶׁר בָּנָה בַּעְשָׁא
  choice: mit denen Bascha gebaut hatte
  rationale: 'Der Relativsatz wird instrumental auf Steine und Bauholz bezogen: Es sind die Materialien, die Bascha beim Ausbau Ramas verwendet hatte.'
- source_word: וַיִּבֶן בָּם
  choice: befestigte damit
  rationale: בנה kann beim Ausbau von Städten deren Befestigung einschließen. Im Zusammenhang der Wiederverwendung von Ramas Baumaterial gibt »befestigte damit« den gemeinten Vorgang im Deutschen klar wieder; die Fußnote bewahrt die formale Alternative.
- source_word: גֶּבַע בִּנְיָמִן
  choice: Geba in Benjamin
  rationale: Die Ortsbezeichnung wird verständlich als Geba im Gebiet beziehungsweise Stamm Benjamin wiedergegeben.
- source_word: הַמִּצְפָּה
  choice: Mizpa
  rationale: Der Artikel wird bei dem deutschen Ortsnamen nicht wiedergegeben; »Mizpa« ist eine geläufige deutsche Form.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Aufbieten« bringt den landesweiten verpflichtenden Arbeitseinsatz zum Ausdruck; »befestigte« verdeutlicht den militärischen Baukontext, während die allgemeinere Wiedergabe in einer Fußnote erhalten bleibt.
