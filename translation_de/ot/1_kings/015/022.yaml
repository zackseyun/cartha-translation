revisions:
- from: Darauf ließ König Asa ganz Juda aufbieten – niemand war davon befreit[a]. Sie trugen die Steine von Rama und das Bauholz dort weg, mit denen Bascha gebaut hatte[b]. König Asa befestigte damit Geba in Benjamin und Mizpa[c].
  to: Darauf bot König Asa ganz Juda auf – niemand war davon befreit[a]. Sie trugen die Steine und das Bauholz aus Rama weg, die Bascha zum Bau Ramas verwendet hatte[b]. König Asa baute damit Geba in Benjamin und Mizpa.
  rationale: Die Revision gibt das Mobilisieren mit einem direkten deutschen Verb wieder, verdeutlicht den Bezug des Bauholzes auf Rama und löst den problematischen Relativpronomenbezug. Vor allem ersetzt sie die interpretierende Einengung »befestigte« durch »baute«, das die Bedeutung von בנה wahrt. Die Fußnotenanker sind auf die tatsächlich erläuterten Stellen beschränkt.
