source:
  edition: WLC
  text: עַל חַטֹּ֤אות יָרָבְעָם֙ אֲשֶׁ֣ר חָטָ֔א וַ/אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵ֑ל בְּ/כַעְס֕/וֹ אֲשֶׁ֣ר הִכְעִ֔יס אֶת יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/030.yaml
  text: because of the sins of Jeroboam that he committed and by which he caused Israel to sin[a], and because of his provocation by which he provoked Yahweh, the God of Israel.
translation:
  language: de
  text: wegen der Sünden Jerobeams, die er beging und durch die er Israel zur Sünde verleitete, und wegen seiner Provokation[a], mit der er Jahwe, den Gott Israels, erzürnte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wegen seines Zorns“. Das hebräische Substantiv kann Zorn, Unwillen oder Provokation bezeichnen; hier passt „Provokation“ zum folgenden Verb „erzürnte“.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: עַל
  choice: wegen
  rationale: Die Präposition leitet hier den Grund für das zuvor berichtete Gericht ein; „wegen“ gibt diese kausale Funktion im Deutschen natürlich wieder.
- source_word: חַטֹּאות יָרָבְעָם אֲשֶׁר חָטָא
  choice: der Sünden Jerobeams, die er beging
  rationale: Die Verbindung bewahrt den Plural „Sünden“ und vermeidet durch „beging“ die schwerfällige Wiederholung „Sünden, die er sündigte“.
- source_word: הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: zu denen er Israel verleitete
  rationale: Der Hifil von חטא ist kausativ. Der Rückbezug „zu denen“ verbindet Israels Sünde mit den zuvor genannten Sünden Jerobeams, ohne die Art seiner Einflussnahme näher festzulegen.
- source_word: בְּכַעְסוֹ
  choice: wegen seiner Provokation
  rationale: כַּעַס kann Zorn, Verdruss oder Provokation bezeichnen. Im Zusammenhang mit dem folgenden kausativen Verb bezeichnet „Provokation“ am ehesten Jerobeams Handeln, das Jahwe erzürnte; die Mehrdeutigkeit wird in der Fußnote offengelegt.
- source_word: הִכְעִיס
  choice: erzürnte
  rationale: Das Hifil bedeutet, jemanden zum Zorn zu reizen. „erzürnte“ ist knapp, idiomatisch und wahrt die kausative Bedeutung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: den Gott Israels
  rationale: Die Apposition wird transparent und im Deutschen konventionell wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet das Tetragramm als persönlichen Gottesnamen; „Jahwe“ bewahrt diesen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Verhältnis zwischen Jerobeams Sünde und Israels Sünde
  choice: „zu denen er Israel verleitete“
  alternative: „durch die er Israel zur Sünde veranlasste“
  rationale: Die gewählte Fassung bewahrt Jerobeams ursächliche Verantwortung, legt aber nicht über den Text hinaus fest, durch welchen Mechanismus Israel sündigte.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist als kausale Fortsetzung des vorangehenden Satzes gestaltet; deshalb beginnt sie entsprechend dem hebräischen Versfragment mit „wegen“. „Provokation“ ist bewusst sachlich gewählt, während die Fußnote die echte lexikalische Mehrdeutigkeit bewahrt.
