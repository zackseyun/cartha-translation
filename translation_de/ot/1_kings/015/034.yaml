source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יֵּ֨לֶךְ֙ בְּ/דֶ֣רֶךְ יָרָבְעָ֔ם וּ֨/בְ/חַטָּאת֔/וֹ אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/034.yaml
  text: He did what was evil in the eyes of Yahweh and walked in the way of Jeroboam and in his sin by which he caused Israel to sin.
translation:
  language: de
  text: Er tat, was in den Augen Jahwes böse war, und ging den Weg Jerobeams und dessen Sünde, durch die er Israel sündigen ließ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Er tat, was … böse war
  rationale: Die feste Wendung עשה הרע bezeichnet ein als böse bewertetes Handeln. Die Relativkonstruktion ist im Deutschen natürlich und bewahrt den formelhaften Charakter.
- source_word: בְּעֵינֵי יְהוָה
  choice: in den Augen Jahwes
  rationale: Die transparente deutsche Wendung bewahrt das hebräische Bild der göttlichen Beurteilung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im modernen Deutschen geläufige Form.
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ יָרָבְעָם
  choice: lebte nach dem Vorbild Jerobeams
  rationale: Wörtlich steht „ging auf dem Weg Jerobeams“. Die gewählte Form gibt die Verhaltensmetapher verständlich wieder, ohne eine bloße räumliche Bewegung nahezulegen.
- source_word: וּבְחַטָּאתוֹ
  choice: und in dessen Sünde
  rationale: Das Suffix bezieht sich auf Jerobeam. „Dessen“ macht diesen Bezug im Deutschen eindeutig und bewahrt den Singular „Sünde“.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: durch die er Israel zur Sünde verführte
  rationale: Der Hifil von חטא hat kausative Bedeutung. „Zur Sünde verführen“ gibt wieder, dass Jerobeam Israel zum Sündigen brachte.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen ausdrücklich. Die Umschrift wahrt seinen Charakter als Eigenname.
- issue: Verantwortung Jerobeams für Israels Sünde
  choice: durch die er Israel zur Sünde verführte
  alternative: mit der Israel sündigte
  rationale: Die kausative Verbform schreibt Jerobeam ausdrücklich eine verursachende Rolle zu; diese darf nicht zu einer bloßen Beschreibung der Sünde Israels abgeschwächt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederkehrende königliche Bewertungsformel bleibt erkennbar; die Wegmetapher wird zugunsten unmittelbarer Verständlichkeit sinngemäß als Lebens- und Verhaltensvorbild wiedergegeben.
