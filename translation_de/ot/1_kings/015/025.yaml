  variant: modern standard German
source:
  edition: WLC
  text: וְ/נָדָ֣ב בֶּן יָרָבְעָ֗ם מָלַךְ֙ עַל יִשְׂרָאֵ֔ל בִּ/שְׁנַ֣ת שְׁתַּ֔יִם לְ/אָסָ֖א מֶ֣לֶךְ יְהוּדָ֑ה וַ/יִּמְלֹ֥ךְ עַל יִשְׂרָאֵ֖ל שְׁנָתָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/025.yaml
  text: Nadab son of Jeroboam became king over Israel in the second year of Asa king of Judah, and he reigned over Israel two years.
translation:
  language: de
  text: Nadab, der Sohn Jerobeams, wurde im zweiten Regierungsjahr Asas, des Königs von Juda, König über Israel. Er regierte zwei Jahre über Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/נָדָב
  choice: Nadab
  rationale: Die Konjunktion führt die folgende Station der Königschronik ein. Im Deutschen ist am Versanfang kein ausdrückliches „Und“ nötig; der Name wird in der etablierten deutschen Form wiedergegeben.
- source_word: בֶּן יָרָבְעָם
  choice: der Sohn Jerobeams
  rationale: Die natürliche deutsche Genitivkonstruktion bewahrt die genealogische Zuordnung.
- source_word: מָלַךְ
  choice: wurde … König
  rationale: Das erste Verb bezeichnet hier im Rahmen der Datierungsformel den Regierungsantritt, nicht die Regierungsdauer.
- source_word: עַל יִשְׂרָאֵל
  choice: über Israel
  rationale: Die Präposition bezeichnet den Herrschaftsbereich und wird idiomatisch mit „über“ wiedergegeben.
- source_word: בִּ/שְׁנַת שְׁתַּיִם
  choice: im zweiten Regierungsjahr
  rationale: Die hebräische Königschronik verwendet wörtlich „im Jahr zwei“; „im zweiten Regierungsjahr“ ist die klare deutsche Entsprechung und macht den Bezug auf Asas Herrschaft deutlich.
- source_word: לְ/אָסָא מֶלֶךְ יְהוּדָה
  choice: Asas, des Königs von Juda
  rationale: Das לְ markiert Asa als Bezugspunkt der Regierungsdatierung; die Apposition wird in natürlichem Deutsch mit Genitiv wiedergegeben.
- source_word: וַ/יִּמְלֹךְ
  choice: Er regierte
  rationale: Beim zweiten Vorkommen folgt die Dauerangabe; daher bezeichnet das Verb die Ausübung beziehungsweise Dauer der Herrschaft.
- source_word: שְׁנָתָיִם
  choice: zwei Jahre
  rationale: Der Dual bezeichnet unmittelbar eine Dauer von zwei Jahren.
