base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/008.yaml
  text: And Abijam lay down with his fathers[a], and they buried him in the city of David[b]. Then Asa his son became king in his place.
translation:
  language: de
  text: Abijam[b] legte sich zu seinen Vätern[a], und sie begruben ihn in der Stadt Davids. Und Asa, sein Sohn, wurde an seiner Stelle König.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „legte sich zu seinen Vätern“; eine übliche hebräische Ausdrucksweise für das Sterben.'
    reason: cultural_note
  - marker: b
    text: In einigen parallelen oder verwandten Stellen heißt er „Abija“; der hebräische Text hat hier „Abijam“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב … עִם אֲבֹתָיו
  choice: legte sich zu seinen Vätern
  rationale: Die feststehende hebräische Todesformel wird bildhaft bewahrt; die Fußnote erklärt ihre Bedeutung, ohne sie im Haupttext auf „starb“ zu reduzieren.
- source_word: אֲבִיָּם
  choice: Abijam
  rationale: Der Personenname folgt der in diesem Vers bezeugten hebräischen Form; verwandte Stellen verwenden teilweise die Form „Abija“.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: und sie begruben ihn
  rationale: Die aktive Pluralform des Hebräischen bleibt erhalten, ohne die nicht genannten Bestattenden näher zu bestimmen.
- source_word: בְּעִיר דָּוִד
  choice: in der Stadt Davids
  rationale: Dies ist eine natürliche und zugleich formnahe Wiedergabe der festen Ortsbezeichnung.
- source_word: וַיִּמְלֹךְ
  choice: wurde … König
  rationale: Im Zusammenhang der Thronfolge bezeichnet das Verb hier den Regierungsantritt, nicht lediglich die Dauer der Herrschaft.
- source_word: אָסָא בְנוֹ
  choice: Asa, sein Sohn
  rationale: Die hebräische Wortfolge und die verwandtschaftliche Zuordnung werden klar und idiomatisch wiedergegeben.
- source_word: תַּחְתָּיו
  choice: an seiner Stelle
  rationale: Die Wendung bezeichnet präzise die Nachfolge im Königsamt.
