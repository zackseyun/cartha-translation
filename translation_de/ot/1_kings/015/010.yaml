id: 1KI.15.10
reference: 1 Kings 15:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אַרְבָּעִ֤ים וְ/אַחַת֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ מַעֲכָ֖ה בַּת אֲבִישָׁלֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/010.yaml
  text: He reigned forty-one years in Jerusalem[b][a], and his mother’s name was Maacah daughter of Abishalom.
translation:
  language: de
  text: Einundvierzig Jahre regierte er in Jerusalem. Seine Mutter hieß Maacha, die Tochter[a] Abischaloms[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bedeutet „Tochter“, kann in genealogischen Zusammenhängen aber auch allgemeiner eine weibliche Nachfahrin bezeichnen.
    reason: alternative_reading
  - marker: b
    text: Hebräisch Abischalom; der Name wird häufig auch als „Absalom“ wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַרְבָּעִים וְאַחַת שָׁנָה
  choice: Einundvierzig Jahre
  rationale: Die hebräische Zahlfügung lautet wörtlich „vierzig und ein Jahr“; im heutigen Deutschen wird sie idiomatisch als „einundvierzig Jahre“ wiedergegeben.
- source_word: מָלַךְ
  choice: regierte er
  rationale: Das Verb bezeichnet hier die Dauer der königlichen Herrschaft. „Regierte“ gibt dies im Deutschen natürlich und präzise wieder.
- source_word: בִּירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Die Präposition bezeichnet den Ort; „in Jerusalem“ ist die natürliche deutsche Wiedergabe.
- source_word: וְשֵׁם אִמּוֹ
  choice: Seine Mutter hieß
  rationale: Die formale Wendung „und der Name seiner Mutter war“ wird ohne Bedeutungsverlust in natürliches, modernes Deutsch übertragen.
- source_word: מַעֲכָה
  choice: Maacha
  rationale: Der Personenname wird entsprechend seiner hebräischen Form transliteriert.
- source_word: בַּת
  choice: Tochter
  rationale: Die unmittelbare lexikalische Bedeutung ist „Tochter“. Eine mögliche weitere genealogische Bedeutung wird in der Fußnote offengehalten.
- source_word: אֲבִישָׁלוֹם
  choice: Abischalom
  rationale: Diese Form bildet die im hebräischen Text vorliegende Namensform genauer ab als die geläufigere Variante „Absalom“.
theological_decisions:
- issue: Verwandtschaftsbezeichnung Maachas
  choice: Die wörtliche genealogische Bezeichnung „Tochter Abischaloms“ bleibt im Haupttext erhalten.
  alternative: Enkelin oder weibliche Nachfahrin Abischaloms
  rationale: Der hebräische Text sagt ausdrücklich „Tochter“. Da die Bezeichnung in genealogischen Zusammenhängen auch eine entferntere weibliche Nachfahrin meinen kann, wird diese Möglichkeit in einer Fußnote genannt, ohne die Spannung im Haupttext aufzulösen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die Satzteilung vermeidet eine schwerfällige Nachbildung der hebräischen Reihung; die genealogische Mehrdeutigkeit bleibt durch die Fußnote gewahrt.
