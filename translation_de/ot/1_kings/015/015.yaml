    rationale: Der hebräische Ausdruck kann geweihte Sachen bzw. Heiligtumsgut bezeichnen, ohne ausdrücklich zu sagen, dass sie als Gaben dargebracht wurden. „Geweihte Dinge“ erhält diese Offenheit.
  - severity: low
    issue: Die bisherige Fußnote bietet kaum eine echte Alternative zur Hauptfassung.
    rationale: Sie expliziert lediglich das in „heilige Gaben“ bereits enthaltene Verständnis. Mit einer neutraleren Hauptfassung kann die Fußnote die spezifischere Lesart „Weihgaben“ sinnvoll als Alternative ausweisen.
