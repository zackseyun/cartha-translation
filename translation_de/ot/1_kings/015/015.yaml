  text: וַ/יָּבֵא֙ אֶת קָדְשֵׁ֣י אָבִ֔י/ו ו/קדש/ו בֵּ֣ית יְהוָ֑ה כֶּ֥סֶף וְ/זָהָ֖ב וְ/כֵלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/015.yaml
  text: And he brought into the house of Yahweh the holy things of his father and his own holy things[a], silver and gold and vessels.
translation:
  language: de
  text: 'Und er brachte die geweihten Dinge seines Vaters und seine eigenen geweihten Dinge[a] in das Haus Jahwes: Silber, Gold und Geräte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Weihgaben seines Vaters und seine eigenen Weihgaben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: er brachte … in
  rationale: Der Hifil von בוא bedeutet hier „hineinbringen“. Im Deutschen wird die Richtung durch „in das Haus Jahwes“ natürlich ausgedrückt.
- source_word: קָדְשֵׁי אָבִיו
  choice: die heiligen Gaben seines Vaters
  rationale: Der Ausdruck bezeichnet konkrete, für den Gottesdienst ausgesonderte beziehungsweise geweihte Gegenstände. „Heilige Gaben“ gibt den kultischen Sinn verständlich wieder, ohne ihre genaue Art festzulegen.
- source_word: וְקָדְשׁוֹ
  choice: seine eigenen heiligen Gaben
  rationale: Das Substantiv im Singular mit Suffix wird hier kollektiv verstanden und steht parallel zu den heiligen Gaben seines Vaters. „Eigenen“ macht den Bezug des Suffixes im Deutschen deutlich.
- source_word: בֵּית יְהוָה
  choice: das Haus Jahwes
  rationale: „Haus“ bewahrt die hebräische Bezeichnung des Heiligtums; „Tempel“ wäre kontextuell möglich, ist aber stärker deutend.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Form „Jahwe“ gibt den göttlichen Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: כֶּסֶף וְזָהָב וְכֵלִים
  choice: Silber, Gold und Geräte
  rationale: Die drei Begriffe erläutern den Inhalt der heiligen Gaben. „Geräte“ ist im Tempelkontext weit genug für Gefäße, Werkzeuge und sonstige kultische Gegenstände.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Eigennamen; „der HERR“ wäre die traditionelle ehrfürchtige Ersatzlesung.
- issue: Bedeutung von קֹדֶשׁ bei den eingebrachten Gegenständen
  choice: heilige Gaben
  alternative: geweihte Gegenstände
  rationale: „Heilige Gaben“ hält sowohl den Gedanken der Aussonderung für Gott als auch den Charakter als dargebrachter Besitz fest, ohne genauer zu bestimmen, wie oder wann sie geweiht wurden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau ist flüssig, während „Haus Jahwes“ die Bildsprache des Hebräischen bewahrt. Der Doppelpunkt kennzeichnet „Silber, Gold und Geräte“ als nähere Bestimmung der heiligen Gaben.
