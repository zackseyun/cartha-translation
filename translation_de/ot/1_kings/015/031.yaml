id: 1KI.15.31
reference: 1 Kings 15:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י נָדָ֖ב וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/031.yaml
  text: The rest of the acts of Nadab[a], and all that he did, are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: de
  text: Die übrigen Taten Nadabs und alles, was er tat – sind sie nicht im Buch der Chronik der Könige von Israel[a] aufgeschrieben?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Annalen der Könige von Israel«. Der hebräische Ausdruck bezeichnet eine königliche Aufzeichnung und nicht unbedingt das biblische Buch der Chronik.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי נָדָב
  choice: Die übrigen Taten Nadabs
  rationale: יֶתֶר bezeichnet das Übrige bzw. den Rest; דִּבְרֵי meint in dieser königlichen Schlussformel nicht bloß »Worte«, sondern die berichteten Angelegenheiten oder Taten Nadabs.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: und alles, was er tat
  rationale: Die Relativkonstruktion wird unmittelbar und idiomatisch wiedergegeben; die formelhafte Wiederholung bleibt erhalten.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: sind sie nicht … aufgeschrieben?
  rationale: הֲלֹא leitet eine rhetorische Frage ein, die Zustimmung erwartet. Der Plural הֵם כְּתוּבִים bezieht sich auf die zuvor genannten Taten und wird in Zahl und Frageform bewahrt.
- source_word: עַל סֵפֶר
  choice: im Buch
  rationale: Wörtlich steht »auf dem Buch/der Schriftrolle«; bei einem Quellenverweis ist im Deutschen »im Buch« die natürliche Wiedergabe.
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: der Chronik der Könige von Israel
  rationale: דִּבְרֵי הַיָּמִים bezeichnet hier eine annalistische königliche Quelle. »Chronik« gibt die historiografische Bedeutung knapp wieder; die Fußnote verhindert eine Verwechslung mit den kanonischen Chronikbüchern.
theological_decisions: []
