id: 1KI.15.2
reference: 1 Kings 15:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: שָׁלֹ֣שׁ שָׁנִ֔ים מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ מַעֲכָ֖ה בַּת אֲבִישָׁלֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/002.yaml
  text: He reigned three years in Jerusalem[b][a], and his mother’s name was Maacah daughter of Abishalom.
translation:
  language: de
  text: Er regierte drei Jahre in Jerusalem. Seine Mutter hieß Maacha, eine Tochter[a] Abischaloms[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort für „Tochter“ kann in genealogischen Zusammenhängen mitunter allgemeiner eine weibliche Nachfahrin bezeichnen.
    reason: alternative_reading
  - marker: b
    text: Abischalom ist die hier stehende hebräische Namensform; der Name wird auch als „Absalom“ wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלֹשׁ שָׁנִים
  choice: drei Jahre
  rationale: Die Kardinalzahl mit dem Substantiv im Plural bezeichnet die Dauer seiner Herrschaft; im Deutschen ist die adverbiale Zeitangabe ohne zusätzliche Präposition natürlich.
- source_word: מָלַךְ
  choice: regierte
  rationale: Das Qal von מלך bezeichnet hier die Ausübung der Königsherrschaft, nicht den Regierungsantritt.
- source_word: בִּירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Die Präposition ב bezeichnet den Ort; „in Jerusalem“ entspricht natürlichem modernem Deutsch.
- source_word: וְשֵׁם אִמּוֹ
  choice: Seine Mutter hieß
  rationale: Die feste Königsformel wird idiomatisch und inhaltlich genau wiedergegeben, ohne die im Deutschen schwerfällige Form „Der Name seiner Mutter war“.
- source_word: מַעֲכָה
  choice: Maacha
  rationale: Der Personenname wird in einer im Deutschen geläufigen, dem Hebräischen nahen Form wiedergegeben.
- source_word: בַּת
  choice: Tochter
  rationale: Die primäre lexikalische Bedeutung ist „Tochter“. Eine in genealogischen Zusammenhängen mögliche weitere Bedeutung wird in einer Fußnote offengehalten.
- source_word: אֲבִישָׁלוֹם
  choice: Abischalom
  rationale: „Abischalom“ gibt die hier vorliegende hebräische Namensform wieder; die im Deutschen ebenfalls bekannte Form „Absalom“ wird als Alternative vermerkt.
theological_decisions:
- issue: Genealogische Bedeutung von בַּת אֲבִישָׁלוֹם
  choice: Im Haupttext steht die wörtliche Verwandtschaftsbezeichnung „Tochter Abischaloms“.
  alternative: Enkelin beziehungsweise weibliche Nachfahrin Abischaloms
  rationale: Der hebräische Text sagt ausdrücklich „Tochter“. Da verwandtschaftliche Bezeichnungen in genealogischen Zusammenhängen mitunter weiter gefasst sein können, wird diese Möglichkeit in der Fußnote genannt, aber nicht in den Haupttext eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Königsformel bleibt erhalten, wird jedoch mit „Seine Mutter hieß“ natürlich formuliert. Die Genitivform „Abischaloms“ ist idiomatisch und vermeidet eine unnötige Umschreibung mit „von“.
