  text: וְ/גַ֣ם אֶת מַעֲכָ֣ה אִמּ֗/וֹ וַ/יְסִרֶ֨/הָ֙ מִ/גְּבִירָ֔ה אֲשֶׁר עָשְׂתָ֥ה מִפְלֶ֖צֶת לָ/אֲשֵׁרָ֑ה וַ/יִּכְרֹ֤ת אָסָא֙ אֶת מִפְלַצְתָּ֔/הּ וַ/יִּשְׂרֹ֖ף בְּ/נַ֥חַל קִדְרֽוֹן׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/013.yaml
  text: He also removed Maacah his mother from being queen mother[a], because she had made an abominable image for Asherah[c][b]. Asa cut down her image and burned it in the Kidron Valley.
translation:
  language: de
  text: Auch Maacha, seine Mutter[a], setzte er als Königinmutter ab, weil sie für Aschera[b][c] ein abscheuliches Gebilde angefertigt hatte. Asa zerstörte ihr Gebilde und verbrannte es im Kidrontal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »seine Mutter«; im königlichen Sprachgebrauch kann damit auch eine Großmutter oder eine andere weibliche Vorfahrin gemeint sein.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »ein entsetzliches Gebilde«. Die genaue Art und Gestalt dieses Gegenstands ist ungewiss.'
    reason: lexical_alternative
  - marker: c
    text: »Aschera« kann die Göttin Aschera oder ihr Kultsymbol bezeichnen, das häufig »Ascherapfahl« genannt wird.
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: Auch
  rationale: Gibt den additiven Anschluss an die zuvor genannten Reformmaßnahmen knapp und natürlich wieder.
- source_word: מַעֲכָה אִמּוֹ
  choice: Maacha, seine Mutter
  rationale: Bewahrt den ausdrücklichen hebräischen Wortlaut; dass damit im königlichen Sprachgebrauch auch eine Großmutter oder andere weibliche Vorfahrin gemeint sein kann, wird in einer Fußnote erläutert.
- source_word: וַיְסִרֶהָ מִגְּבִירָה
  choice: setzte er als Königinmutter ab
  rationale: Der Hifil von סור bezeichnet hier die Entfernung aus einer Stellung; גְּבִירָה meint im höfischen Zusammenhang die einflussreiche Königinmutter.
- source_word: אֲשֶׁר עָשְׂתָה
  choice: weil sie ... angefertigt hatte
  rationale: Der Relativanschluss trägt hier plausibel begründende Funktion. Das Plusquamperfekt macht deutlich, dass die Herstellung der Absetzung vorausging.
- source_word: מִפְלֶצֶת
  choice: ein abscheuliches Kultbild
  rationale: Die Bezeichnung bewertet den Gegenstand als erschreckend oder abstoßend, ohne seine genaue Gestalt erkennen zu lassen. „Kultbild“ markiert seine religiöse Funktion, ohne eine bestimmte Form festzulegen.
- source_word: לָאֲשֵׁרָה
  choice: für Aschera
  rationale: Die Transkription bewahrt die mögliche Beziehung zur Göttin oder zu ihrem Kultsymbol, statt den Bezug im Haupttext einseitig festzulegen.
- source_word: וַיִּכְרֹת ... אֶת מִפְלַצְתָּהּ
  choice: hieb ihr Kultbild um
  rationale: Bewahrt die konkrete Bedeutung von כרת, die ein Abhauen oder Fällen bezeichnet, und vermeidet das allgemeinere „zerstörte“.
- source_word: וַיִּשְׂרֹף
  choice: verbrannte es
  rationale: Direkte und natürliche Wiedergabe des Verbs.
- source_word: בְּנַחַל קִדְרוֹן
  choice: im Kidrontal
  rationale: נחל bezeichnet ein Bachtal oder Wadi; „Kidrontal“ ist die geläufige und geografisch passende deutsche Benennung.
theological_decisions:
- issue: Bezug von אֲשֵׁרָה
  choice: Aschera ohne nähere Festlegung
  alternative: die Göttin Aschera; ein Aschera-Kultsymbol oder Ascherapfahl
  rationale: Der hebräische Ausdruck kann die Göttin oder ihr Kultsymbol bezeichnen. Da der Vers daneben einen hergestellten Kultgegenstand nennt, würde eine nähere Festlegung die bestehende Mehrdeutigkeit unnötig auflösen.
- issue: Verwandtschaftsbezeichnung אִמּוֹ
  choice: seine Mutter
  alternative: seine Großmutter bzw. weibliche Vorfahrin
  rationale: Der Haupttext folgt der ausdrücklichen hebräischen Bezeichnung und harmonisiert sie nicht mit genealogischen Folgerungen aus dem weiteren Kontext.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Königinmutter“ benennt die höfische Stellung verständlich; „abscheuliches Kultbild“ erhält die starke negative Wertung und lässt die genaue Gestalt offen. Alle textlich relevanten Mehrdeutigkeiten werden im Haupttext bewahrt oder in Fußnoten kenntlich gemacht.
