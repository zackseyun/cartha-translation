  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְהִ֣י כְ/מָלְכ֗/וֹ הִכָּה֙ אֶת כָּל בֵּ֣ית יָרָבְעָ֔ם לֹֽא הִשְׁאִ֧יר כָּל נְשָׁמָ֛ה לְ/יָרָבְעָ֖ם עַד הִשְׁמִד֑/וֹ כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַד עַבְדּ֖/וֹ אֲחִיָּ֥ה הַ/שִּׁילֹנִֽי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/029.yaml
  text: And when he became king[a], he struck down all the house of Jeroboam. He did not leave to Jeroboam a single living thing, until he had destroyed him[b], according to the word of Yahweh that he had spoken by the hand of his servant Ahijah the Shilonite.
translation:
  language: de
  text: Und sobald er König geworden war, erschlug er das ganze Haus Jerobeams. Er ließ Jerobeam keinen einzigen Menschen am Leben, bis er es[a] vernichtet hatte, gemäß dem Wort Jahwes, das er durch seinen Diener Ahija aus Schilo gesprochen hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bis er ihn vernichtet hatte“; das hebräische Pronomen ist männlich und kann Jerobeam beziehungsweise sein Haus unter dem Namen des Stammvaters bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְמָלְכוֹ
  choice: Und sobald er König geworden war
  rationale: Die Konstruktion וַיְהִי mit temporalem כְ bezeichnet hier den Zeitpunkt des Regierungsantritts. „Sobald“ gibt den unmittelbaren zeitlichen Zusammenhang im Kontext natürlich wieder.
- source_word: הִכָּה
  choice: erschlug er
  rationale: נכה bezeichnet hier im Zusammenhang der Auslöschung einer Dynastie tödliches Niederschlagen; „erschlug“ ist prägnant und bewahrt die Gewaltsamkeit des Ausdrucks.
- source_word: אֶת כָּל בֵּית יָרָבְעָם
  choice: das ganze Haus Jerobeams
  rationale: „Haus“ bewahrt den zugleich familiären und dynastischen Sinn von בַּיִת im königlichen Kontext.
- source_word: לֹא הִשְׁאִיר כָּל נְשָׁמָה לְיָרָבְעָם
  choice: Er ließ Jerobeam keinen einzigen Menschen am Leben
  rationale: נְשָׁמָה bedeutet wörtlich „Atem“ und bezeichnet in dieser festen Wendung ein lebendes Wesen. Im Kontext sind die Angehörigen der Dynastie gemeint; die idiomatische deutsche Wiedergabe vermeidet die missverständliche Formulierung „kein lebendes Ding“.
- source_word: עַד הִשְׁמִידוֹ
  choice: bis er es vernichtet hatte
  rationale: Das maskuline Singularsuffix kann sich kollektiv auf das zuvor genannte „Haus Jerobeams“ beziehen. Im Deutschen ist „Haus“ sächlich, daher entspricht „es“ dem wahrscheinlichsten Bezug, ohne die kollektive Bedeutung aufzulösen.
- source_word: כִּדְבַר יְהוָה
  choice: gemäß dem Wort Jahwes
  rationale: Die Formulierung kennzeichnet die Erfüllung eines zuvor ergangenen göttlichen Wortes; „gemäß“ ist natürlich und formal angemessen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen ausdrücklich stehende Gottesname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: אֲשֶׁר דִּבֶּר בְּיַד עַבְדּוֹ
  choice: das er durch seinen Diener ... gesprochen hatte
  rationale: בְיַד ist eine hebräische Vermittlungsformel. Das natürliche deutsche „durch“ vermittelt ihre Bedeutung, ohne die im Deutschen ungewöhnliche Wendung „durch die Hand“ zu erzwingen.
- source_word: אֲחִיָּה הַשִּׁילֹנִי
  choice: Ahija aus Schilo
  rationale: Das Gentiliz הַשִּׁילֹנִי bezeichnet Ahijas Herkunft beziehungsweise Zugehörigkeit zu Schilo; „aus Schilo“ ist im modernen Deutsch klarer als „der Schiloniter“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn als Namen und folgt der vorgegebenen Übersetzungspraxis, ohne einen bloßen Titel einzusetzen.
- issue: Bezug des Pronominalsuffixes in הִשְׁמִידוֹ
  choice: es, bezogen auf das Haus Jerobeams als Dynastie
  alternative: ihn, bezogen auf Jerobeam beziehungsweise sein Haus unter dem Namen des Stammvaters
  rationale: Beide Bezüge sind grammatisch beziehungsweise semantisch möglich. Der unmittelbare Ausdruck „das ganze Haus Jerobeams“ spricht für den kollektiven Bezug; die Alternative wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der dynastische Fachausdruck „Haus Jerobeams“ bleibt erhalten; sonst werden schwer verständliche hebräische Idiome natürlich wiedergegeben. Der Fußnotenmarker [a] steht unmittelbar bei der mehrdeutigen Pronomenwiedergabe.
