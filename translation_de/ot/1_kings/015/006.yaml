  text: וּ/מִלְחָמָ֨ה הָיְתָ֧ה בֵין רְחַבְעָ֛ם וּ/בֵ֥ין יָרָבְעָ֖ם כָּל יְמֵ֥י חַיָּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/006.yaml
  text: And there was war between Rehoboam and Jeroboam all the days of his life[a].
translation:
  language: de
  text: Und es herrschte Krieg zwischen Rehabeam und Jerobeam alle Tage seines Lebens.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „alle Tage seines Lebens“. Das Pronomen kann sich auf Rehabeam beziehen. Manche Ausleger beziehen es aufgrund des Zusammenhangs und textkritischer Fragen stattdessen auf Abija (Abijam).'
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִלְחָמָה הָיְתָה
  choice: Und … herrschte Krieg
  rationale: Die Verbindung aus מִלְחָמָה und der Qal-Perfektform von היה bezeichnet das Bestehen eines Kriegszustands. „Herrschte Krieg“ ist im Deutschen natürlich und fügt gegenüber dem Hebräischen keine ausdrücklich fortdauernde Aktionsart hinzu.
- source_word: בֵין ... וּבֵין
  choice: zwischen … und
  rationale: Die wiederholte hebräische Präposition kennzeichnet die beiden Konfliktparteien; im idiomatischen Deutschen genügt „zwischen … und“.
- source_word: רְחַבְעָם
  choice: Rehabeam
  rationale: Der Personenname wird in seiner etablierten deutschen Bibelform wiedergegeben.
- source_word: יָרָבְעָם
  choice: Jerobeam
  rationale: Der Personenname wird in seiner etablierten deutschen Bibelform wiedergegeben.
- source_word: כָּל יְמֵי חַיָּיו
  choice: solange er lebte
  rationale: Die hebräische Wendung bedeutet idiomatisch „während seiner gesamten Lebenszeit“. „Solange er lebte“ ist natürliches, klares Deutsch und bewahrt durch das Pronomen die Unbestimmtheit des Bezugs.
theological_decisions:
- issue: Bezugswort des Pronomens in כָּל יְמֵי חַיָּיו
  choice: Das Pronomen bleibt im Haupttext mit „er“ unaufgelöst.
  alternative: „solange Rehabeam lebte“ beziehungsweise, nach anderer Auslegung im Kontext der Textüberlieferung, „solange Abija (Abijam) lebte“
  rationale: Das hebräische maskuline Singularsuffix bedeutet „sein“, nennt seinen Bezug aber in diesem Satz nicht ausdrücklich. Eine Festlegung im Haupttext würde die vorhandene Mehrdeutigkeit interpretierend auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die idiomatische Zeitangabe liest sich flüssig, während das unbestimmte Pronomen die Mehrdeutigkeit des hebräischen Textes bewahrt.
