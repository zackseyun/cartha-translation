source:
  edition: WLC
  text: וַ/יְמִתֵ֣/הוּ בַעְשָׁ֔א בִּ/שְׁנַ֣ת שָׁלֹ֔שׁ לְ/אָסָ֖א מֶ֣לֶךְ יְהוּדָ֑ה וַ/יִּמְלֹ֖ךְ תַּחְתָּֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/028.yaml
  text: Baasha put him to death in the third year of Asa king of Judah[a], and reigned in his place.
translation:
  language: de
  text: Bascha tötete ihn im dritten Regierungsjahr Asas, des Königs von Juda, und wurde an seiner Stelle König.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְמִתֵהוּ
  choice: tötete ihn
  rationale: Der Hifil von מות bedeutet hier »zu Tode bringen/töten«. »Tötete ihn« gibt die verursachende Bedeutung im Deutschen natürlich und eindeutig wieder.
- source_word: בַעְשָׁא
  choice: Bascha
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form transliteriert.
- source_word: בִּשְׁנַת שָׁלֹשׁ
  choice: im dritten Regierungsjahr
  rationale: Die Zeitangabe bezeichnet das dritte Jahr der Herrschaft Asas; »Regierungsjahr« macht die übliche Königsjahrformel im Deutschen klar.
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: Asas, des Königs von Juda
  rationale: Das ל bezeichnet in der Datierungsformel den Herrscher, nach dessen Regierungszeit gerechnet wird. Die Apposition wird im Deutschen idiomatisch im Genitiv wiedergegeben.
- source_word: וַיִּמְלֹךְ
  choice: und wurde König
  rationale: מלך kann im Qal sowohl »als König herrschen« als auch »König werden« bedeuten. Zusammen mit תַּחְתָּיו steht hier der Herrschaftsantritt als Nachfolger im Vordergrund.
- source_word: תַּחְתָּיו
  choice: an seiner Stelle
  rationale: תחת mit Suffix bezeichnet hier Nachfolge beziehungsweise Ersetzung und wird mit der natürlichen deutschen Wendung »an seiner Stelle« wiedergegeben.
theological_decisions: []
