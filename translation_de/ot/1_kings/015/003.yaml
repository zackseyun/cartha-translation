source:
  edition: WLC
  text: וַ/יֵּ֕לֶךְ בְּ/כָל חַטֹּ֥אות אָבִ֖י/ו אֲשֶׁר עָשָׂ֣ה לְ/פָנָ֑י/ו וְ/לֹא הָיָ֨ה לְבָב֤/וֹ שָׁלֵם֙ עִם יְהוָ֣ה אֱלֹהָ֔י/ו כִּ/לְבַ֖ב דָּוִ֥ד אָבִֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/003.yaml
  text: He walked in all the sins of his father that he had committed before him[a], and his heart was not wholly devoted to Yahweh his God[c][b], like the heart of David his father.
translation:
  language: de
  text: Er lebte in all den Sünden, die sein Vater vor ihm[a] begangen hatte, und sein Herz war Jahwe[c], seinem Gott, nicht ungeteilt ergeben[b], wie das Herz seines Vaters David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Vor ihm“ kann sowohl „in seiner Gegenwart“ als auch „vor seiner Zeit“ bedeuten; die Formulierung kann zugleich andeuten, dass ihm die Sünden seines Vaters als Beispiel vor Augen standen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Sein Herz war Jahwe, seinem Gott, nicht völlig treu.“'
    reason: alternative_reading
  - marker: c
    text: Hebräisch JHWH; traditionell mit „der HERR“ wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּכָל חַטֹּאות
  choice: Er lebte in all den Sünden
  rationale: הלך mit ב und einem moralischen Gegenstand beschreibt den Lebenswandel. „Lebte in“ gibt den ethischen Sinn im heutigen Deutsch natürlicher wieder als das wörtlichere „ging in“.
- source_word: אֲשֶׁר עָשָׂה לְפָנָיו
  choice: die sein Vater vor ihm begangen hatte
  rationale: „Begangen“ ist bei Sünden idiomatisch; „vor ihm“ bewahrt die mögliche räumliche und zeitliche Bedeutung von לְפָנָיו.
- source_word: לְבָבוֹ שָׁלֵם
  choice: sein Herz war … nicht ungeteilt ergeben
  rationale: שָׁלֵם bezeichnet hier ein ganzes, ungeteiltes Herz beziehungsweise uneingeschränkte Loyalität, nicht notwendigerweise sittliche Fehlerlosigkeit.
- source_word: עִם יְהוָה אֱלֹהָיו
  choice: Jahwe, seinem Gott, … ergeben
  rationale: Das wörtliche „mit Jahwe“ wird entsprechend dem deutschen Ausdruck „jemandem ergeben sein“ wiedergegeben; יְהוָה erscheint als persönlicher Name „Jahwe“.
- source_word: כִּלְבַב דָּוִד אָבִיו
  choice: wie das Herz seines Vaters David
  rationale: Die Formulierung wahrt den ausdrücklichen Vergleich der Herzen und gibt אָבִיו in natürlicher deutscher Wortstellung wieder.
theological_decisions:
- issue: Bedeutung des ungeteilten Herzens
  choice: nicht ungeteilt ergeben
  alternative: nicht vollkommen / nicht völlig treu
  rationale: Die Wiedergabe betont die fehlende uneingeschränkte Hingabe an Gott, ohne שָׁלֵם als Behauptung absoluter Sündlosigkeit zu deuten.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der persönliche Gottesname wird im Haupttext als „Jahwe“ wiedergegeben; die traditionelle Ersatzlesung wird in einer Fußnote genannt.
- issue: Vergleich mit David
  choice: wie das Herz seines Vaters David
  alternative: wie sein Vater David
  rationale: Der hebräische Text vergleicht ausdrücklich die innere Ausrichtung der Herzen; diese theologische Spannung bleibt erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Er lebte in“ vermittelt den hebräischen Wandel-Ausdruck verständlich; „ungeteilt ergeben“ wahrt den bundesbezogenen Sinn von שָׁלֵם. Alle Fußnotenmarker stehen unmittelbar an den betreffenden Aussagen.
