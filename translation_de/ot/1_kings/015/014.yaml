  variant: modern standard German
source:
  edition: WLC
  text: וְ/הַ/בָּמ֖וֹת לֹא סָ֑רוּ רַ֣ק לְבַב אָסָ֗א הָיָ֥ה שָׁלֵ֛ם עִם יְהוָ֖ה כָּל יָמָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/014.yaml
  text: But the high places were not removed; nevertheless[a], Asa’s heart was wholly devoted to Yahweh all his days.
translation:
  language: de
  text: Die Höhenheiligtümer wurden jedoch nicht beseitigt. Dennoch war Asas Herz Jahwe sein ganzes Leben lang ganz zugewandt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Asas Herz war alle seine Tage ganz mit Jahwe.“'
    reason: Die Fußnote macht die hebräische Bildsprache sichtbar. „Ganz zugewandt“ gibt die darin ausgedrückte vollständige beziehungsweise ungeteilte Loyalität idiomatisch wieder.
lexical_decisions:
- source_word: וְהַבָּמוֹת
  choice: Doch die Höhenheiligtümer
  rationale: בָּמוֹת bezeichnet hier örtliche Kultstätten, häufig auf Anhöhen. „Höhenheiligtümer“ ist im heutigen Deutsch verständlicher und präziser als das bloße „Höhen“; וְ markiert im Zusammenhang einen Gegensatz.
- source_word: לֹא סָרוּ
  choice: wurden nicht beseitigt
  rationale: סוּר bedeutet mit den Kultstätten als Subjekt idiomatisch, dass sie nicht entfernt oder abgeschafft wurden. Die passive Form entspricht dem hebräischen Sinn.
- source_word: רַק
  choice: Dennoch
  rationale: 'רַק leitet hier einen konzessiven Gegensatz ein: Trotz der nicht beseitigten Kultstätten wird Asas grundlegende Treue bekräftigt.'
- source_word: לְבַב אָסָא
  choice: Asas Herz
  rationale: לְבַב bezeichnet das innere Wollen und die Ausrichtung der Person; der deutsche Genitiv gibt die Konstruktion natürlich wieder.
- source_word: שָׁלֵם
  choice: ungeteilt
  rationale: שָׁלֵם bedeutet in Verbindung mit „Herz“ Ganzheit beziehungsweise ungeteilte Loyalität, nicht notwendigerweise moralische Fehlerlosigkeit. „Ungeteilt“ bewahrt das Bild des ganzen Herzens.
- source_word: עִם יְהוָה
  choice: bei Jahwe
  rationale: עִם heißt wörtlich „mit“. „Bei Jahwe“ ist mit „Herz“ natürliches Deutsch und bewahrt die relationale Formulierung, ohne sie vorschnell als abstrakte Hingabe auszulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כָּל יָמָיו
  choice: solange er lebte
  rationale: Die deutsche Wendung gibt das hebräische „alle seine Tage“ natürlich und vollständig als lebenslange Zeitspanne wieder.
theological_decisions:
- issue: Asas „ungeteiltes“ Herz trotz der nicht beseitigten Höhenheiligtümer
  choice: Die Aussage bekräftigt Asas grundlegende, lebenslange Loyalität zu Jahwe, ohne eine vollkommen durchgeführte Reform oder Sündlosigkeit zu behaupten.
  alternative: Asa war in jeder moralischen Hinsicht vollkommen; oder die Anerkennung seiner Treue wird wegen der Höhenheiligtümer abgeschwächt.
  rationale: Der Vers stellt beide Aussagen bewusst nebeneinander. „Ungeteilt“ erhält diese Spannung und vermeidet sowohl die Behauptung absoluter Fehlerlosigkeit als auch eine Abschwächung des positiven Urteils.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Höhenheiligtümer“ vermeidet die heute missverständliche Kurzform „Höhen“. Die Formulierung „ungeteilt bei Jahwe“ hält sich eng an das hebräische Bild und bewahrt die Spannung des Verses.
