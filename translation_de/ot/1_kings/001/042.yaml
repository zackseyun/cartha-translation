base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/042.yaml
  text: While he was still speaking[a], behold, Jonathan son of Abiathar the priest came. And Adonijah said, “Come in, for you are a worthy man and bring good news.”
translation:
  language: de
  text: 'Noch während er redete, da kam Jonatan, der Sohn des Priesters Abjatar. Adonija sagte: »Komm herein! Du bist ein angesehener Mann[a] und bringst gute Nachricht.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein tapferer Mann«; auch »ein tüchtiger Mann«. Das hebräische אִישׁ חַיִל kann je nach Zusammenhang Tapferkeit, Tüchtigkeit oder gesellschaftliches Ansehen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹדֶנּוּ מְדַבֵּר
  choice: Noch während er redete
  rationale: Die Wendung bezeichnet eine noch andauernde Handlung, in die das folgende Ereignis eintritt; die deutsche Formulierung ist natürlich und bewahrt den zeitlichen Zusammenhang.
- source_word: וְהִנֵּה
  choice: plötzlich
  rationale: הִנֵּה lenkt die Aufmerksamkeit auf Jonatans unerwartetes Eintreffen. »Plötzlich« gibt hier die narrative Signalwirkung in natürlichem modernem Deutsch wieder.
- source_word: בֶּן אֶבְיָתָר הַכֹּהֵן
  choice: der Sohn des Priesters Abjatar
  rationale: Der Titel »Priester« bezieht sich im hebräischen Ausdruck am natürlichsten auf Abjatar; die deutsche Genitivkonstruktion macht dies eindeutig.
- source_word: בֹּא
  choice: Komm herein!
  rationale: Der Imperativ ist in der Situation eine Aufforderung, zu der versammelten Gruppe hereinzukommen.
- source_word: אִישׁ חַיִל
  choice: ein angesehener Mann
  rationale: Die mehrdeutige Wendung kann Tapferkeit, Tüchtigkeit, Vermögen oder gesellschaftliches Ansehen bezeichnen. Im Kontext hebt Adonija Jonatans verlässliche Stellung als Nachrichtenüberbringer hervor, ohne dass militärische Tapferkeit im Vordergrund steht.
- source_word: וְטוֹב תְּבַשֵּׂר
  choice: und bringst gewiss gute Nachricht
  rationale: Die Aussage drückt Adonijas zuversichtliche Erwartung aus, Jonatan werde Gutes melden. »Gewiss« macht diese pragmatische Nuance deutlich, ohne die Meldung selbst vorwegzunehmen.
