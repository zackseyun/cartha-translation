  text: וּ/מָשַׁ֣ח אֹת֣/וֹ שָׁ֠ם צָד֨וֹק הַ/כֹּהֵ֜ן וְ/נָתָ֧ן הַ/נָּבִ֛יא לְ/מֶ֖לֶךְ עַל יִשְׂרָאֵ֑ל וּ/תְקַעְתֶּם֙ בַּ/שּׁוֹפָ֔ר וַ/אֲמַרְתֶּ֕ם יְחִ֖י הַ/מֶּ֥לֶךְ שְׁלֹמֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/034.yaml
  text: There Zadok the priest and Nathan the prophet shall anoint him king over Israel[a], and you shall blow the trumpet and say, ‘Long live King Solomon!’
translation:
  language: de
  text: 'Dort sollen der Priester Zadok und der Prophet Nathan ihn zum König über Israel salben. Dann sollt ihr das Horn[a] blasen und sagen: »Es lebe König Salomo!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch schofar: ein aus einem Tierhorn gefertigtes Blasinstrument, das als öffentliches Signal oder zur feierlichen Ausrufung verwendet wurde; traditionell auch mit »Trompete« wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁח
  choice: sollen … salben
  rationale: Das Qal-Perfekt mit vorangestelltem ו setzt in dieser Anweisungsfolge den Aufforderungssinn fort. Die deutsche Konstruktion mit »sollen« gibt diesen direktiven Charakter natürlich wieder.
- source_word: שָׁם
  choice: Dort
  rationale: Das Ortsadverb verweist knapp auf den zuvor genannten Ort.
- source_word: צָדוֹק הַכֹּהֵן וְנָתָן הַנָּבִיא
  choice: der Priester Zadok und der Prophet Nathan
  rationale: Die Titel werden in natürlicher deutscher Wortstellung mit den Eigennamen verbunden; beide Personen sind gemeinsam Subjekt der Salbung.
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: zum König über Israel
  rationale: לְ bezeichnet hier das Amt beziehungsweise Ergebnis der Salbung, während עַל die Herrschaft über Israel ausdrückt.
- source_word: וּתְקַעְתֶּם בַּשּׁוֹפָר
  choice: Dann sollt ihr das Horn blasen
  rationale: Die zweite Person Plural führt die Anweisungsfolge fort. שׁוֹפָר bezeichnet ein Signalhorn; »Horn« wahrt die konkrete Bedeutung besser als das im Deutschen weiter gefasste »Trompete«.
- source_word: וַאֲמַרְתֶּם
  choice: und rufen
  rationale: Im Zusammenhang einer öffentlichen Königsproklamation gibt »rufen« die Funktion des Sagens idiomatisch wieder.
- source_word: יְחִי הַמֶּלֶךְ שְׁלֹמֹה
  choice: Es lebe König Salomo!
  rationale: Der Jussiv von חיה bildet eine Akklamationsformel, deren natürliche deutsche Entsprechung »Es lebe …!« lautet.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anweisungsfolge wird mit »sollen« wiedergegeben; die abschließende Königsakklamation bleibt formelhaft und unmittelbar.
