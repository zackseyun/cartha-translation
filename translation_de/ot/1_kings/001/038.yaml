base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/038.yaml
  text: So Zadok the priest[a], Nathan the prophet, Benaiah son of Jehoiada, and the Cherethites and the Pelethites went down and had Solomon ride on King David’s mule[c][b], and they brought him to Gihon.
translation:
  language: de
  text: Da zogen der Priester Zadok, der Prophet Natan, Benaja, der Sohn Jojadas, sowie die Keretiter und Peletiter[a] hinab. Sie setzten Salomo auf die Maultierstute König Davids und führten ihn zum Gihon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Möglicherweise ist damit die königliche Leibwache gemeint; der hebräische Text verwendet jedoch die Gruppenbezeichnungen „Keretiter und Peletiter“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: zogen … hinab
  rationale: Das Verb ירד bezeichnet eine Abwärtsbewegung. „Hinabziehen“ bewahrt diese Richtungsangabe und passt zu einer gemeinsam handelnden Gruppe.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Die übliche und sachlich genaue Wiedergabe von כֹּהֵן; der Titel steht als Apposition zu Zadok.
- source_word: הַנָּבִיא
  choice: der Prophet
  rationale: Die übliche Wiedergabe von נָבִיא; der Titel steht als Apposition zu Natan.
- source_word: בֶן יְהוֹיָדָע
  choice: der Sohn Jojadas
  rationale: Der hebräische Vatersname wird in natürlichem Deutsch mit „der Sohn“ und dem Genitiv des Namens wiedergegeben.
- source_word: הַכְּרֵתִי וְהַפְּלֵתִי
  choice: die Keretiter und Peletiter
  rationale: Der hebräische Text nennt die Gruppen selbst. Ihre Bezeichnungen werden daher transliteriert, statt ihre vermutlich militärische Funktion in den Haupttext einzutragen.
- source_word: וַיַּרְכִּבוּ
  choice: sie setzten Salomo auf
  rationale: 'Der Hifil von רכב ist kausativ: Sie bewirkten, dass Salomo ritt. „Auf … setzen“ gibt dies in diesem Zusammenhang knapp und natürlich wieder.'
- source_word: פִּרְדַּת
  choice: Maultierstute
  rationale: Das Substantiv bezeichnet hier grammatisch und lexikalisch ein weibliches Maultier. „Maultierstute“ macht diese im Hebräischen vorhandene Spezifizierung ausdrücklich.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: König Davids
  rationale: Die hebräische Genitivverbindung bezeichnet das Tier als Eigentum König Davids; der deutsche Namensgenitiv bewahrt dies prägnant.
- source_word: וַיֹּלִכוּ אֹתוֹ
  choice: führten ihn
  rationale: Der Hifil von הלך bedeutet hier „gehen lassen/bringen/führen“. „Führten ihn“ passt zur geordneten Prozession, ohne die Fortbewegungsart Salomos festzulegen.
- source_word: עַל גִּחוֹן
  choice: zum Gihon
  rationale: Die Präposition עַל bezeichnet in dieser Bewegungskonstruktion das Ziel. „Zum Gihon“ ist im Deutschen idiomatisch und lässt offen, ob die Quelle oder der gleichnamige Ort im Vordergrund steht.
theological_decisions: []
