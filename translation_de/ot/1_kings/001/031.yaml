  text: וַ/תִּקֹּ֨ד בַּת שֶׁ֤בַע אַפַּ֨יִם֙ אֶ֔רֶץ וַ/תִּשְׁתַּ֖חוּ לַ/מֶּ֑לֶךְ וַ/תֹּ֕אמֶר יְחִ֗י אֲדֹנִ֛/י הַ/מֶּ֥לֶךְ דָּוִ֖ד לְ/עֹלָֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/031.yaml
  text: Then Bathsheba bowed with her face to the ground and prostrated herself before the king[a], and said, “May my lord King David live forever.”
translation:
  language: de
  text: 'Da verneigte sich Batseba mit dem Gesicht zur Erde und warf sich vor dem König nieder. Sie sagte: »Möge mein Herr, König David, ewig leben!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּקֹּד
  choice: verneigte sich
  rationale: קָדַד bezeichnet ein tiefes Beugen oder Verneigen; die Wiedergabe ist im Deutschen natürlich und legt die genaue Körperhaltung nicht unnötig fest.
- source_word: אַפַּיִם אֶרֶץ
  choice: mit dem Gesicht zur Erde
  rationale: Die hebräische Wendung verbindet ‚Gesicht/Nase‘ und ‚Erde‘ und beschreibt eine tiefe Ehrerbietung. Die gewählte Formulierung bewahrt dieses konkrete Bild.
- source_word: וַתִּשְׁתַּחוּ
  choice: warf sich … nieder
  rationale: שׁחה bezeichnet hier das Niederwerfen aus Ehrerbietung. Die Formulierung unterscheidet die Handlung vom vorhergehenden Verneigen und erhält ihre Intensität.
- source_word: לַמֶּלֶךְ
  choice: vor dem König
  rationale: Obwohl die Präposition formal ‚zum König‘ lautet, entspricht bei einer Huldigung ‚vor dem König‘ dem natürlichen deutschen Ausdruck.
- source_word: יְחִי
  choice: lebe
  rationale: Der Jussiv drückt einen Wunsch beziehungsweise eine Segensformel aus. Der deutsche Konjunktiv ‚lebe‘ gibt die feierliche Akklamation knapp wieder.
- source_word: אֲדֹנִי
  choice: mein Herr
  rationale: אֲדֹנִי ist hier die respektvolle Anrede an den König; ‚mein Herr‘ wahrt den höfischen Ton.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: König David
  rationale: Titel und Eigenname werden im modernen Deutschen natürlich als ‚König David‘ verbunden.
- source_word: לְעֹלָם
  choice: ewig
  rationale: עוֹלָם bezeichnet in dieser königlichen Wunschformel unbegrenzte Dauer. ‚Ewig‘ ist würdig, knapp und idiomatisch.
theological_decisions: []
