  text: אִ֗ם מֵ/אֵת֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ נִהְיָ֖ה הַ/דָּבָ֣ר הַ/זֶּ֑ה וְ/לֹ֤א הוֹדַ֨עְתָּ֙ אֶֽת עבדי/ך מִ֗י יֵשֵׁ֛ב עַל כִּסֵּ֥א אֲדֹנִֽ/י הַ/מֶּ֖לֶךְ אַחֲרָֽי/ו־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/027.yaml
  text: If this thing has come from my lord the king[a], have you not made known to your servants who will sit on the throne of my lord the king after him?
translation:
  language: de
  text: Wenn diese Sache von meinem Herrn, dem König, ausgegangen ist,[a] hast du dann deinen Dienern nicht mitgeteilt, wer nach ihm auf dem Thron meines Herrn, des Königs, sitzen wird?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „diese Angelegenheit“.'
    reason: Lexikalische Alternative für das weit gefasste hebräische דָּבָר; sie wahrt die Offenheit hinsichtlich des berichteten Vorgangs oder Beschlusses.
lexical_decisions:
- source_word: אִם
  choice: Ist ...?
  rationale: אִם leitet hier eine zugespitzte rhetorische Frage ein. Die deutsche Entscheidungsfrage gibt diese Funktion natürlicher wieder als ein unvollständig wirkender Wenn-Satz.
- source_word: מֵאֵת ... נִהְיָה
  choice: von ... ausgegangen
  rationale: Die Verbindung bezeichnet Ursprung beziehungsweise Autorisierung der Sache beim König. „Ausgegangen“ bewahrt diese Bedeutung idiomatisch.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: mein Herr, der König
  rationale: Bewahrt die ehrerbietige höfische Anrede in natürlichem, würdigem Deutsch.
- source_word: הַדָּבָר הַזֶּה
  choice: diese Sache
  rationale: דבר ist weit gefasst und bezeichnet hier den berichteten Vorgang oder Beschluss; „Sache“ wahrt diese Offenheit.
- source_word: וְלֹא הוֹדַעְתָּ
  choice: ohne dass du ... mitgeteilt hast
  rationale: Der Hifil von ידע bedeutet „wissen lassen, mitteilen“. In Verbindung mit der rhetorischen Frage bringt „ohne dass“ den überraschenden Gegensatz im Deutschen klar zum Ausdruck.
- source_word: עבדיך
  choice: deinen Dienern
  rationale: Im königlichen Hofkontext ist dies eine ehrerbietige Selbstbezeichnung untergeordneter Amtsträger; „Diener“ bildet die soziale Funktion ab, ohne unberechtigt Sklaverei in den Vordergrund zu rücken.
- source_word: מִי יֵשֵׁב
  choice: wer ... sitzen soll
  rationale: Die Konstruktion fragt nach der vorgesehenen Thronfolge. „Sitzen soll“ bewahrt sowohl die Zukunftsorientierung als auch die ausdrückliche Sitzmetaphorik.
- source_word: עַל כִּסֵּא
  choice: auf dem Thron
  rationale: Bewahrt die konkrete Königsthron- und Nachfolgemetaphorik des Hebräischen.
- source_word: אַחֲרָיו
  choice: nach ihm
  rationale: Bezeichnet unmittelbar die zeitliche beziehungsweise dynastische Nachfolge, ohne sie durch „an seiner Stelle“ stärker auszudeuten.
theological_decisions:
- issue: Wiedergabe von עבד im höfischen Sprachgebrauch
  choice: deinen Dienern
  alternative: deinen Sklaven
  rationale: Der Ausdruck fungiert hier als konventionelle ehrerbietige Selbstbezeichnung von Hofbeamten. Der Text stellt ihren Status als königliche Untergebene, nicht die Frage persönlichen Eigentums, in den Vordergrund.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit höfischer Anrede. Die rhetorische Bedingungskonstruktion des Hebräischen wird als natürliche deutsche Frage wiedergegeben; der leicht vorwurfsvolle Ton bleibt erhalten.
