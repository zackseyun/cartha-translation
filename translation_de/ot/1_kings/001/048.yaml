source:
  edition: WLC
  text: וְ/גַם כָּ֖כָה אָמַ֣ר הַ/מֶּ֑לֶךְ בָּר֨וּךְ יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל אֲשֶׁ֨ר נָתַ֥ן הַ/יּ֛וֹם יֹשֵׁ֥ב עַל כִּסְאִ֖/י וְ/עֵינַ֥/י רֹאֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/048.yaml
  text: 'And the king also said thus: ‘Blessed be Yahweh[a], the God of Israel, who today has given one to sit on my throne, and my eyes see it.’'
translation:
  language: de
  text: 'Auch sagte der König Folgendes: »Gepriesen sei Jahwe, der Gott Israels, der heute einen gegeben hat, der auf meinem Thron sitzt, und meine Augen sehen es.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der heute einen gegeben hat, der auf meinem Thron sitzt, und meine Augen sehen«. Das Hebräische kann das Partizip auch als »einen auf meinem Thron Sitzenden« auffassen. Was die Augen sehen, bleibt im Hebräischen unausgesprochen; »es« ist aus dem Zusammenhang ergänzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם כָּכָה אָמַר הַמֶּלֶךְ
  choice: Und außerdem sagte der König
  rationale: וְגַם führt eine weitere Aussage des Königs ein; כָּכָה verweist auf die folgende direkte Rede. Die deutsche Formulierung gibt diese Funktion natürlich wieder, ohne das schwerfällige »so sprach«.
- source_word: בָּרוּךְ
  choice: Gepriesen sei
  rationale: Die geläufige deutsche Lobpreisungsformel wahrt den doxologischen Ton und entspricht dem prädikativ gebrauchten Partizip.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; »Jahwe« ist die im Deutschen etablierte Umschrift.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Transparente Wiedergabe der hebräischen Genitivverbindung.
- source_word: אֲשֶׁר נָתַן הַיּוֹם
  choice: der heute einen gegeben hat
  rationale: »Gegeben« bildet das gewöhnliche Verb נתן ab; das Perfekt bezeichnet die vollzogene Handlung mit gegenwärtigem Ergebnis. »Einen« lässt die im Vers nicht ausdrücklich genannte Person unbestimmt.
- source_word: יֹשֵׁב עַל כִּסְאִי
  choice: der auf meinem Thron sitzt
  rationale: Das substantivische Partizip wird als Relativsatz wiedergegeben. Die präsentische Form bewahrt den möglichen Zustandssinn des Hebräischen, ohne ausdrücklich »eingesetzt« zu ergänzen.
- source_word: וְעֵינַי רֹאוֹת
  choice: und meine Augen sehen es
  rationale: Die koordinierende Struktur und das anschauliche hebräische Idiom bleiben erhalten. Das Objekt »es« wird im Deutschen aus dem Zusammenhang ergänzt.
theological_decisions:
- issue: Wiedergabe des Tetragramms יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. Die Umschrift bewahrt diesen Namen, statt ihn durch den traditionellen Ersatztitel wiederzugeben.
- issue: Bedeutung von נָתַן ... יֹשֵׁב
  choice: einen gegeben hat, der ... sitzt
  alternative: jemanden eingesetzt hat, der ... sitzen soll
  rationale: Die gewählte Fassung bleibt bei der Grundbedeutung »geben« und bewahrt die Spannung des Partizips zwischen gegenwärtigem Sitzen und resultierender Einsetzung, statt den Amtsantritt ausdrücklich auszudeuten.
translation_notes:
  register: Moderne, würdige Standardsprache. Die feierliche Lobpreisungsformel bleibt erhalten; unnötig altertümliche Satzstellung wird vermieden. Der Fußnotenmarker steht nach dem vollständigen Zitat, da er die Mehrdeutigkeit des gesamten Schlusssatzes erläutert.
