  text: וַ/עֲלִיתֶ֣ם אַחֲרָ֗י/ו וּ/בָא֙ וְ/יָשַׁ֣ב עַל כִּסְאִ֔/י וְ/ה֥וּא יִמְלֹ֖ךְ תַּחְתָּ֑/י וְ/אֹת֤/וֹ צִוִּ֨יתִי֙ לִֽ/הְי֣וֹת נָגִ֔יד עַל יִשְׂרָאֵ֖ל וְ/עַל יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/035.yaml
  text: Then you shall go up after him[a], and he shall come and sit on my throne, and he shall reign in my place; and I have appointed him to be ruler over Israel and over Judah.
translation:
  language: de
  text: Zieht dann hinter ihm hinauf. Er soll kommen und sich auf meinen Thron setzen. Er soll an meiner Stelle König sein, und ich habe ihn dazu bestimmt,[a] Herrscher über Israel und über Juda zu sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich habe ihm befohlen, Herrscher über Israel und über Juda zu sein.“ Das hebräische Verb bedeutet häufig „befehlen“; das mit „Herrscher“ wiedergegebene Wort kann auch „Fürst“ oder „Anführer“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲלִיתֶם אַחֲרָיו
  choice: Dann zieht hinter ihm hinauf
  rationale: עלה bezeichnet das Hinaufziehen; אַחֲרָיו beschreibt das Folgen im königlichen Zug. Die deutsche Form wahrt sowohl die Richtung als auch den Prozessionszusammenhang.
- source_word: וּבָא
  choice: Er soll kommen
  rationale: בוא bedeutet allgemein „kommen“ oder „hineingehen“. „Kommen“ bleibt nah am Wortlaut, ohne ein nicht ausdrücklich genanntes Ziel hinzuzufügen.
- source_word: וְיָשַׁב עַל כִּסְאִי
  choice: und sich auf meinen Thron setzen
  rationale: Die Wendung bezeichnet das Platznehmen auf dem Thron und damit im Kontext die Inthronisierung; die reflexive deutsche Form klingt natürlich und bewahrt das konkrete Bild.
- source_word: וְהוּא יִמְלֹךְ תַּחְתָּי
  choice: Er soll an meiner Stelle König sein
  rationale: מלך bezeichnet königliches Herrschen, während תַּחְתָּי die Nachfolge beziehungsweise Stelleneinnahme ausdrückt. Die Formulierung gibt beides klar wieder und unterscheidet den Ausdruck von נָגִיד.
- source_word: צִוִּיתִי
  choice: ich habe ihn dazu bestimmt
  rationale: צוה bedeutet gewöhnlich „befehlen“, kann in dieser Konstruktion aber die autoritative Bestimmung für ein Amt ausdrücken. „Bestimmt“ passt zum Einsetzungskontext; die wörtlichere Möglichkeit wird in der Fußnote bewahrt.
- source_word: לִהְיוֹת נָגִיד
  choice: Herrscher … zu sein
  rationale: נָגִיד bezeichnet einen eingesetzten Führer oder Fürsten. „Herrscher“ ist verständlich, würdevoll und bleibt von dem zuvor verwendeten königlichen Verb מלך unterschieden.
- source_word: עַל יִשְׂרָאֵל וְעַל יְהוּדָה
  choice: über Israel und über Juda
  rationale: Das wiederholte „über“ spiegelt das zweimalige עַל und hebt die Autorität über beide benannten Größen hervor.
theological_decisions:
- issue: Verhältnis der Amtsbezeichnung נָגִיד zum königlichen Verb מלך
  choice: מלך wird mit „König sein“, נָגִיד mit „Herrscher“ wiedergegeben.
  alternative: Beide Ausdrücke könnten mit königlicher Herrschaftssprache angeglichen werden; נָגִיד könnte auch „Fürst“ oder „Anführer“ heißen.
  rationale: Der hebräische Text verwendet bewusst verschiedene Wörter. Unterschiedliche deutsche Wiedergaben erhalten diese Spannung, ohne den Rang des Amtes konfessionell oder dogmatisch festzulegen.
- issue: Bedeutung von צוה bei der Einsetzung Salomos
  choice: „dazu bestimmt“ im Haupttext
  alternative: „ihm befohlen“
  rationale: Der Zusammenhang legt eine autoritative Amtsbestimmung nahe, doch die gewöhnliche Bedeutung „befehlen“ bleibt sprachlich möglich und wird deshalb ausdrücklich in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der einleitende Plural wird mit „zieht“ beibehalten; die folgenden Singularformen beziehen sich auf Salomo. Kurze Hauptsätze machen die Abfolge von Prozession, Thronbesteigung und Herrschaft klar.
