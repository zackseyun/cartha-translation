source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁלֹמֹ֔ה אִ֚ם יִהְיֶ֣ה לְ/בֶן חַ֔יִל לֹֽא יִפֹּ֥ל מִ/שַּׂעֲרָת֖/וֹ אָ֑רְצָ/ה וְ/אִם רָעָ֥ה תִמָּצֵא ב֖/וֹ וָ/מֵֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/052.yaml
  text: And Solomon said[a], “If he proves to be a worthy man, not one of his hairs will fall to the ground; but if evil is found in him[b], he shall die.”
translation:
  language: de
  text: 'Und Salomo sagte: „Wenn er sich als tüchtiger Mann erweist,[a] wird keines seiner Haare zu Boden fallen;[b] wenn sich aber Böses an ihm findet, soll er sterben.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »ein Sohn der Kraft/Tüchtigkeit«. Die hebräische Wendung kann je nach Zusammenhang einen tüchtigen, angesehenen, tapferen oder charakterlich bewährten Mann bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Redewendung bedeutet, dass ihm keinerlei Schaden geschehen wird.
    reason: idiom_explanation
lexical_decisions:
- source_word: בֶן־חַיִל
  choice: tüchtiger Mann
  rationale: Die Wendung bedeutet wörtlich »Sohn der Kraft/Tüchtigkeit« und bezeichnet hier einen Mann, der sich als charakterlich zuverlässig und bewährt erweist. »Tüchtiger Mann« bewahrt die Spannweite zwischen Befähigung und persönlicher Bewährung, ohne die Formulierung unnötig militärisch einzuengen.
- source_word: יִהְיֶה
  choice: sich … erweist
  rationale: Im Bedingungssatz geht es darum, wie sich Adonija künftig bewährt. Die Wiedergabe bringt diese kontextuelle Aussage zur Geltung, ohne das hebräische »sein/werden« inhaltlich zu überdehnen.
- source_word: לֹא יִפֹּל מִשַּׂעֲרָתוֹ אָרְצָה
  choice: wird keines seiner Haare zu Boden fallen
  rationale: Die bildhafte hebräische Redewendung wird im Haupttext bewahrt. Sie verheißt vollständige Unversehrtheit und wird in einer Fußnote erläutert.
- source_word: רָעָה
  choice: Böses
  rationale: Das breite moralische Bedeutungsfeld des hebräischen Nomens bleibt erhalten; eine Einengung auf ein bestimmtes Vergehen wird vermieden.
- source_word: תִמָּצֵא בוֹ
  choice: sich … an ihm findet
  rationale: Die Formulierung hält sich eng an die passive hebräische Konstruktion und bezeichnet Böses, das bei ihm festgestellt wird.
- source_word: וָמֵת
  choice: soll er sterben
  rationale: »Soll« gibt die feierliche, richterliche Konsequenz wieder und lässt offen, ob der Ausdruck stärker als Urteil oder als angekündigte Folge verstanden wird.
