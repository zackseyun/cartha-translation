base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/053.yaml
  text: Then King Solomon sent[a], and they brought him down from the altar. And he came and bowed down to King Solomon, and Solomon said to him, “Go to your house.”
translation:
  language: de
  text: 'Da schickte König Salomo Männer hin,[a] und sie holten ihn vom Altar herunter. Er kam und verneigte sich vor König Salomo. Salomo sagte zu ihm: »Geh in dein Haus!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich nur: »Da schickte König Salomo«; wen oder was er schickte, wird nicht ausdrücklich gesagt.'
    reason: Im Hebräischen fehlt ein ausdrückliches Objekt zu »schickte«. Die im Text ergänzten »Männer« ergeben sich aus dem folgenden Verb im Plural.
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Da schickte … Männer hin
  rationale: שׁלח bedeutet hier »senden/schicken«. Das im Hebräischen nicht genannte Objekt wird im Deutschen knapp als »Männer« ergänzt, weil der folgende Plural »sie holten ihn herunter« menschliche Beauftragte voraussetzt; die Ergänzung wird durch eine Fußnote kenntlich gemacht.
- source_word: וַיֹּרִדֻהוּ
  choice: sie holten ihn … herunter
  rationale: Die Kausativform von ירד bezeichnet, dass ungenannte Beauftragte Adonija herunterkommen ließen beziehungsweise ihn herunterholten. »Holten ihn … herunter« ist natürlich und bewahrt den kausativen Sinn.
- source_word: מֵעַל הַמִּזְבֵּחַ
  choice: vom Altar herunter
  rationale: מֵעַל bedeutet wörtlich »von oben auf/von … herab«. Im Kontext hielt Adonija sich an den Hörnern des Altars fest; die deutsche Formulierung gibt die räumliche Bewegung wieder, ohne zu behaupten, er habe auf der Altarfläche gestanden.
- source_word: וַיִּשְׁתַּחוּ
  choice: warf sich … nieder
  rationale: שׁחה bezeichnet eine tiefe Verbeugung oder Niederwerfung als Huldigung. »Sich vor jemandem niederwerfen« gibt die körperliche und höfische Dimension angemessen wieder.
- source_word: לֵךְ לְבֵיתֶךָ
  choice: Geh in dein Haus!
  rationale: Die direkte Wiedergabe erhält den förmlichen Ton des königlichen Entlassungsbefehls; »Geh nach Hause« wäre idiomatischer, aber weniger nah an der Formulierung des Hebräischen.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Kurze Hauptsätze bilden die hebräische Handlungsfolge ab. Die königliche Anrede bleibt knapp und bestimmt.
