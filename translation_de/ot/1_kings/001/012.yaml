  text: וְ/עַתָּ֕ה לְכִ֛י אִיעָצֵ֥/ךְ נָ֖א עֵצָ֑ה וּ/מַלְּטִי֙ אֶת נַפְשֵׁ֔/ךְ וְ/אֶת נֶ֥פֶשׁ בְּנֵ֖/ךְ שְׁלֹמֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/012.yaml
  text: Now come[a], please let me advise you[c][b], and save your life and the life of your son Solomon.
translation:
  language: de
  text: Und nun komm[a], lass mich dir bitte einen Rat geben[b] und rette dein Leben und das Leben deines Sohnes Salomo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »geh«; hier dient das Wort als dringende Aufforderung im Gespräch und wird deshalb mit »komm« wiedergegeben.
    reason: lexical_alternative
  - marker: b
    text: Hebräisch sinngemäß »dich einen Rat beraten«; die Verbindung eines Verbs mit einem stammverwandten Substantiv bedeutet »einen Rat geben« oder »beraten«.
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Wort נֶפֶשׁ bedeutet hier »Leben«, nicht »Seele«.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Die Konjunktion verbindet den dringenden Übergang mit dem Vorhergehenden; »Und nun« ist im Deutschen natürlich und bewahrt diese Verknüpfung.
- source_word: לְכִי
  choice: komm
  rationale: Die feminine Imperativform bedeutet wörtlich »geh«, dient hier im direkten Gespräch aber als auffordernder Gesprächseinstieg; »komm« gibt diese idiomatische Funktion natürlich wieder.
- source_word: אִיעָצֵךְ נָא עֵצָה
  choice: lass mich dir bitte einen Rat geben
  rationale: Die Wendung verbindet das Verb »raten« mit dem stammverwandten Substantiv »Rat«. Die deutsche Formulierung wahrt den Inhalt und gibt נָא mit »bitte« als höflich-dringliche Partikel wieder.
- source_word: וּמַלְּטִי
  choice: damit du ... rettest
  rationale: Der feminine Imperativ fordert Batseba auf, für die Rettung beziehungsweise Bewahrung des Lebens zu sorgen. Der deutsche Zwecksatz macht den Zusammenhang mit dem erteilten Rat idiomatisch deutlich.
- source_word: נַפְשֵׁךְ
  choice: dein Leben
  rationale: נֶפֶשׁ bezeichnet hier angesichts der politischen Lebensgefahr das konkrete Leben der Person, nicht eine vom Körper unterschiedene »Seele«.
- source_word: וְאֶת נֶפֶשׁ בְּנֵךְ שְׁלֹמֹה
  choice: und das Leben deines Sohnes Salomo
  rationale: Die Formulierung erhält die Parallele zu »dein Leben« und nennt Salomo wie im Hebräischen ausdrücklich.
theological_decisions: []
