base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/005.yaml
  text: Adonijah the son of Haggith exalted himself[a], saying, “I will reign.” So he made for himself a chariot, horsemen[b], and fifty men running before him.
translation:
  language: de
  text: 'Adonija, der Sohn Haggits, machte sich groß[a] und sagte: »Ich werde König sein[b].« Er beschaffte sich einen Wagen und Reiter sowie fünfzig Männer, die vor ihm herliefen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »erhöhte sich selbst« oder »spielte sich auf«. Das hebräische Verb bezeichnet Selbsterhöhung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Ich werde herrschen.«'
    reason: alternative_reading
lexical_decisions:
- source_word: מִתְנַשֵּׂא
  choice: erhob sich selbst
  rationale: Die reflexive Form bezeichnet Adonijas Selbsterhöhung und bewahrt den kritischen Unterton, ohne ein ausdrückliches moralisches Urteil hinzuzufügen.
- source_word: לֵאמֹר אֲנִי אֶמְלֹךְ
  choice: 'und sagte: »Ich werde König sein.«'
  rationale: Die Formulierung gibt Adonijas königlichen Anspruch natürlich wieder. Das Verb מלך kann sowohl das Königsein als auch das Herrschen bezeichnen; die Alternative wird in einer Fußnote erhalten.
- source_word: וַיַּעַשׂ לוֹ
  choice: Er beschaffte sich
  rationale: Wörtlich steht hier »er machte für sich«. Im Zusammenhang bezeichnet die Wendung das Bereitstellen beziehungsweise Beschaffen der königlichen Ausstattung, ohne festzulegen, auf welche Weise sie erlangt wurde.
- source_word: רֶכֶב
  choice: einen Wagen
  rationale: Der Singular wird beibehalten und bezeichnet hier den repräsentativen Wagen Adonijas.
- source_word: פָרָשִׁים
  choice: Reiter
  rationale: Die Wiedergabe ist gegenüber dem technischeren »Kavallerie« formal transparent und bezeichnet berittene Begleiter.
- source_word: חֲמִשִּׁים אִישׁ
  choice: fünfzig Männer
  rationale: Die ausdrücklich männliche Personenbezeichnung wird sachgerecht beibehalten.
- source_word: רָצִים לְפָנָיו
  choice: die vor ihm herliefen
  rationale: Der Relativsatz gibt die Funktion der Männer als vorauslaufendes königliches Gefolge klar und anschaulich wieder.
- source_word: וַ
  choice: aber
  rationale: Das einleitende Waw verbindet den Satz mit dem vorherigen Zusammenhang. »Aber« markiert im Deutschen passend den erzählerischen Übergang zu Adonijas eigenmächtigem Handeln, ohne ein nicht vorhandenes Zeitadverb einzuführen.
theological_decisions:
- issue: Darstellung von Adonijas Handeln
  choice: »erhob sich selbst«
  alternative: »spielte sich auf« / »machte sich selbst groß«
  rationale: Die Übersetzung erhält die im reflexiven hebräischen Verb liegende Kritik an seiner Selbsterhöhung, ohne diese durch eine stärker wertende deutsche Redewendung auszubauen.
- issue: Art von Adonijas Herrschaftsanspruch
  choice: »Ich werde König sein«
  alternative: »Ich werde herrschen«
  rationale: Beide Wiedergaben sind sprachlich möglich. Die Hauptfassung macht den Anspruch auf das Königtum im Kontext deutlich; die Fußnote bewahrt die verbale Alternative.
- issue: Geschlecht der Angehörigen des Gefolges
  choice: »fünfzig Männer«
  alternative: »fünfzig Leute« / »fünfzig Läufer«
  rationale: אִישׁ ist hier ausdrücklich männlich und bezeichnet Männer im königlichen Gefolge; eine Neutralisierung wäre weniger genau.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nah am hebräischen Erzählstil, wird aber durch einen natürlichen Relativsatz geglättet. Die Fußnotenmarker stehen jeweils unmittelbar bei dem Ausdruck, auf den sie sich beziehen; damit wird die im englischen Beratungstext offenbar verrutschte Position von [b] sachgerecht korrigiert.
