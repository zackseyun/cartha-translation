  text: וַ/תָּבֹ֨א בַת שֶׁ֤בֶע אֶל הַ/מֶּ֨לֶךְ֙ הַ/חַ֔דְרָ/ה וְ/הַ/מֶּ֖לֶךְ זָקֵ֣ן מְאֹ֑ד וַֽ/אֲבִישַׁג֙ הַ/שּׁ֣וּנַמִּ֔ית מְשָׁרַ֖ת אֶת הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/015.yaml
  text: So Bathsheba went in to the king in the chamber[a]. Now the king was very old[b], and Abishag the Shunammite was attending the king.
translation:
  language: de
  text: Da ging Batseba zum König ins Gemach[a]. Der König war sehr alt, und Abischag, die Schunemiterin, bediente den König.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »betrat das Zimmer, in dem der König war«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא
  choice: Da ging … hinein / ging … ins Gemach
  rationale: Das Wayyiqtol führt die Erzählung weiter. Im Deutschen gibt die Verbindung mit »ins Gemach« die Bewegung in den Raum natürlich wieder.
- source_word: בַת־שֶׁבַע
  choice: Batseba
  rationale: Der Personenname wird in der im Deutschen gebräuchlichen biblischen Form wiedergegeben.
- source_word: אֶל־הַמֶּלֶךְ
  choice: zum König
  rationale: אֶל bezeichnet die Bewegung auf den König zu; »zum König« ist knapp und idiomatisch.
- source_word: הַחַדְרָה
  choice: ins Gemach
  rationale: חֶדֶר bezeichnet hier den privaten Innenraum des Königs; die direktionale Endung wird durch »ins« ausgedrückt. »Gemach« wahrt den höfisch-privaten Kontext.
- source_word: וְהַמֶּלֶךְ זָקֵן מְאֹד
  choice: Der König war sehr alt
  rationale: Die Aussage liefert Hintergrundinformation. Ein neuer deutscher Satz gibt das klar wieder, ohne die hebräische Koordination unnötig nachzuahmen.
- source_word: וַאֲבִישַׁג הַשּׁוּנַמִּית
  choice: und Abischag, die Schunemiterin
  rationale: Der Name und die weibliche Herkunftsbezeichnung werden in gebräuchlicher deutscher Form wiedergegeben.
- source_word: מְשָׁרַת
  choice: bediente
  rationale: Das Partizip beschreibt eine fortdauernde dienende bzw. betreuende Tätigkeit. »Bediente« ist im höfischen Zusammenhang verständlich und vermeidet einen kirchlichen Beiklang.
- source_word: אֶת־הַמֶּלֶךְ
  choice: den König
  rationale: Die mit dem direkten Objektmarker bezeichnete Nominalgruppe wird als Akkusativobjekt wiedergegeben.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache mit leicht höfischem Ton. »Gemach« ist bewusst etwas gehobener als »Zimmer«, bleibt aber allgemein verständlich. Die hebräische Hintergrundangabe wird durch einen neuen Satz natürlich gegliedert.
