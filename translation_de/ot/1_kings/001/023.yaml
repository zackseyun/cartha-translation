  text: וַ/יַּגִּ֤ידוּ לַ/מֶּ֨לֶךְ֙ לֵ/אמֹ֔ר הִנֵּ֖ה נָתָ֣ן הַ/נָּבִ֑יא וַ/יָּבֹא֙ לִ/פְנֵ֣י הַ/מֶּ֔לֶךְ וַ/יִּשְׁתַּ֧חוּ לַ/מֶּ֛לֶךְ עַל אַפָּ֖י/ו אָֽרְצָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/023.yaml
  text: And they told the king, saying, “Look, Nathan the prophet is here.” And he came before the king and bowed down to the king with his face to the ground.
translation:
  language: de
  text: 'Da meldete man dem König: »Sieh, der Prophet Nathan ist da.« Nathan trat vor den König und warf sich vor ihm mit dem Gesicht zur Erde nieder.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh
  rationale: Gibt den präsentierenden und aufmerksamkeitslenkenden Charakter der Partikel natürlich wieder; »ist da« ergänzt den im Hebräischen nominal ausgedrückten Ankunfts- bzw. Anwesenheitssinn.
- source_word: וַיִּשְׁתַּחוּ
  choice: verneigte sich
  rationale: Bezeichnet hier die ehrerbietige körperliche Niederwerfung vor dem König; der folgende Ausdruck beschreibt deren Tiefe.
- source_word: עַל־אַפָּיו אָרְצָה
  choice: mit dem Gesicht bis zur Erde
  rationale: Bewahrt das konkrete Bild der tiefen Huldigung und entspricht der Bewegungsrichtung des hebräischen אָרְצָה.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die doppelte Nennung des Königs wird im zweiten Satz durch »ihm« idiomatisch gestrafft, ohne den Bezug zu verändern. Das einleitende לֵאמֹר wird natürlich durch den Doppelpunkt wiedergegeben.
