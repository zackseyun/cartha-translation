  text: וַ/יַּ֨עַן֙ יוֹנָתָ֔ן וַ/יֹּ֖אמֶר לַ/אֲדֹנִיָּ֑הוּ אֲבָ֕ל אֲדֹנֵ֥י/נוּ הַ/מֶּֽלֶךְ דָּוִ֖ד הִמְלִ֥יךְ אֶת שְׁלֹמֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/043.yaml
  text: Jonathan answered and said to Adonijah[a], “On the contrary, our lord King David has made Solomon king.”
translation:
  language: de
  text: 'Jonatan antwortete Adonija: „Im Gegenteil! Unser Herr, König David, hat Salomo zum König gemacht.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן וַיֹּאמֶר
  choice: antwortete
  rationale: Die hebräische Doppelwendung bedeutet wörtlich „antwortete und sagte“. Im modernen Deutschen gibt „antwortete“ die einleitende Redeformel natürlich und vollständig wieder, ohne eine schwerfällige Verdopplung.
- source_word: לַאֲדֹנִיָּהוּ
  choice: Adonija
  rationale: Die Präposition bezeichnet den Adressaten der Antwort; im Deutschen steht dieser nach „antworten“ idiomatisch im Dativ und benötigt kein „zu“.
- source_word: אֲבָל
  choice: Im Gegenteil!
  rationale: Das Adversativ korrigiert hier nachdrücklich Adonijas Erwartung. „Im Gegenteil“ bildet diese widersprechende Kraft klarer ab als ein bloßes „aber“.
- source_word: אֲדֹנֵינוּ הַמֶּלֶךְ דָּוִד
  choice: unser Herr, König David
  rationale: „Herr“ bewahrt die höfisch-königliche Bezeichnung; „König David“ steht als erläuternde Apposition dazu.
- source_word: הִמְלִיךְ אֶת־שְׁלֹמֹה
  choice: hat Salomo zum König gemacht
  rationale: Der Hifil von מלך bezeichnet das Veranlassen beziehungsweise Einsetzen als König. Die Formulierung wahrt den kausativen Sinn, ohne den Vorgang enger als „gesalbt“ oder „ausgerufen“ zu bestimmen.
