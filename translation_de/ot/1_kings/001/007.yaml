  text: וַ/יִּהְי֣וּ דְבָרָ֔י/ו עִ֚ם יוֹאָ֣ב בֶּן צְרוּיָ֔ה וְ/עִ֖ם אֶבְיָתָ֣ר הַ/כֹּהֵ֑ן וַֽ/יַּעְזְר֔וּ אַחֲרֵ֖י אֲדֹנִיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/007.yaml
  text: And he conferred with Joab son of Zeruiah and with Abiathar the priest[a], and they helped Adonijah.
translation:
  language: de
  text: Er beriet sich mit Joab, dem Sohn Zerujas, und mit dem Priester Abjatar; sie unterstützten Adonija[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »sie halfen hinter Adonija her«; gemeint ist, dass sie sich ihm anschlossen und ihn unterstützten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְבָרָיו עִם
  choice: er beriet sich mit
  rationale: Die wörtliche Formulierung »seine Worte waren mit« bezeichnet hier im Zusammenhang politischer Planung eine Beratung oder Absprache. Die gewählte Wiedergabe ist im Deutschen natürlich, ohne den Inhalt der Beratung näher festzulegen.
- source_word: יוֹאָב בֶּן צְרוּיָה
  choice: Joab, dem Sohn Zerujas
  rationale: Die Namen folgen ihren im Deutschen geläufigen biblischen Formen; die Abstammungsangabe wird idiomatisch wiedergegeben.
- source_word: אֶבְיָתָר הַכֹּהֵן
  choice: dem Priester Abjatar
  rationale: Der bestimmte Titel bezeichnet Abjatars Amt. Die deutsche Wortstellung ist natürlich und bewahrt die eindeutige Zuordnung.
- source_word: וַיַּעְזְרוּ אַחֲרֵי
  choice: sie unterstützten Adonija
  rationale: עזר bedeutet »helfen, beistehen, unterstützen«; אַחֲרֵי bedeutet wörtlich »hinter/nach«, bezeichnet hier jedoch die Gefolgschaft beziehungsweise politische Unterstützung. »unterstützten« gibt diesen Zusammenhang prägnant wieder.
- source_word: אֲדֹנִיָּה
  choice: Adonija
  rationale: Der Personenname wird in seiner geläufigen deutschen biblischen Form wiedergegeben.
theological_decisions: []
