source:
  edition: WLC
  text: וְ/הַ/מֶּ֤לֶךְ דָּוִד֙ זָקֵ֔ן בָּ֖א בַּ/יָּמִ֑ים וַ/יְכַסֻּ֨/הוּ֙ בַּ/בְּגָדִ֔ים וְ/לֹ֥א יִחַ֖ם לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/001.yaml
  text: King David was old[a], advanced in days; and they covered him with garments, but he could not get warm.
translation:
  language: de
  text: König David war alt und hochbetagt[a]. Man deckte ihn mit Kleidern zu, aber ihm wurde nicht warm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »in die Tage gekommen«; eine hebräische Wendung für ein sehr hohes Alter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/מֶּלֶךְ דָּוִד
  choice: König David
  rationale: Der Titel und der Eigenname werden im Deutschen natürlich als »König David« wiedergegeben. Das einleitende וְ verlangt hier kein eigenes deutsches Verbindungswort.
- source_word: זָקֵן בָּא בַּיָּמִים
  choice: war alt und hochbetagt
  rationale: זָקֵן bezeichnet Davids Alter; die anschließende hebräische Wendung wörtlich »in die Tage gekommen« verstärkt dies im Sinn hohen Alters. »Hochbetagt« gibt die idiomatische Bedeutung in würdigem, modernem Deutsch wieder, ohne die Wiederholung völlig einzuebnen.
- source_word: וַיְכַסֻּהוּ
  choice: Man deckte ihn ... zu
  rationale: Die unbestimmte dritte Person Plural wird im Deutschen idiomatisch mit »man« wiedergegeben. »Zudecken« entspricht in diesem Zusammenhang dem Bedecken des Körpers.
- source_word: בַּבְּגָדִים
  choice: mit Kleidern
  rationale: בְּגָדִים bedeutet gewöhnlich Kleider beziehungsweise Kleidungsstücke. »Decken« wäre kontextuell plausibel, aber lexikalisch stärker interpretierend.
- source_word: וְלֹא יִחַם לוֹ
  choice: aber ihm wurde nicht warm
  rationale: Die Wendung beschreibt, dass David trotz des Zudeckens nicht warm wurde. Die deutsche Konstruktion mit »ihm« bewahrt den Bezug des hebräischen לוֹ; »aber« drückt den im Zusammenhang klaren Gegensatz natürlich aus.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Alterswendung wird im Haupttext verständlich idiomatisch und in der Fußnote wörtlich erläutert. Der unbestimmte Handlungsträger bleibt durch »man« unbestimmt.
