  terminology: „König David“ ist die etablierte deutsche Namensform. „Kleider“ ist für בְּגָדִים lexikalisch vertretbar und vermeidet die stärker interpretierende Wiedergabe „Decken“. Die Fußnote erklärt die hebräische Altersidiomatik sachgerecht.
