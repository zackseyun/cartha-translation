  source_fidelity: 'Der Text gibt alle wesentlichen Elemente des Hebräischen angemessen wieder: David wird als König bezeichnet, sein Alter wird durch die Doppelung „alt und hochbetagt“ abgebildet, der Handelnde bei „Man deckte ihn ... zu“ bleibt unbestimmt, und das Ausbleiben von Wärme wird treffend wiedergegeben. Das einleitende וְ muss im Deutschen nicht eigens abgebildet werden.'
