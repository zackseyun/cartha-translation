id: 1KI.1.21
reference: 1 Kings 1:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הָיָ֕ה כִּ/שְׁכַ֥ב אֲדֹנִֽ/י הַ/מֶּ֖לֶךְ עִם אֲבֹתָ֑י/ו וְ/הָיִ֗יתִי אֲנִ֛י וּ/בְנִ֥/י שְׁלֹמֹ֖ה חַטָּאִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/021.yaml
  text: And when my lord the king lies down with his fathers[a], I and my son Solomon will be counted as offenders.
translation:
  language: de
  text: Wenn mein Herr, der König, sich zu seinen Vorfahren gelegt hat, werden mein Sohn Salomo und ich als Schuldige gelten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sünder«. Das hebräische Wort kann Menschen bezeichnen, die als schuldig oder strafwürdig gelten; hier ist wahrscheinlich ihr politisch-rechtlicher Status gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: werden ... gelten
  rationale: Die einleitende Wendung markiert hier die Folge des vorausgehenden Zeitumstands; im Deutschen wird sie natürlich durch den Futursatz wiedergegeben.
- source_word: כִּשְׁכַב
  choice: wenn ... sich ... gelegt hat
  rationale: Das Verb bildet zusammen mit »zu seinen Vorfahren« eine Umschreibung für den Tod. Das Perfekt bezeichnet den dem befürchteten Ergebnis vorausgehenden Vorgang.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: mein Herr, der König
  rationale: Bewahrt Batsebas ehrerbietige höfische Anrede und klingt zugleich in modernem Standarddeutsch natürlich.
- source_word: עִם אֲבֹתָיו
  choice: zu seinen Vorfahren
  rationale: Gibt die hebräische Todesformel verständlich und würdig wieder; »Vorfahren« umfasst die verstorbenen Ahnen, ohne das im Deutschen missverständliche »Väter« zu erzwingen.
- source_word: וְהָיִיתִי אֲנִי
  choice: werden ... ich ... gelten
  rationale: Das hebräische »sein« bezeichnet mit dem Prädikatsnomen den künftig zugeschriebenen Status. »Gelten« macht diese soziale und politische Einstufung deutlich, ohne eine förmliche Verurteilung vorauszusetzen.
- source_word: וּבְנִי שְׁלֹמֹה
  choice: mein Sohn Salomo und ich
  rationale: Die deutsche Wortstellung ist idiomatisch; die ausdrückliche Nennung des Ichs im Hebräischen bleibt durch das koordinierte Subjekt erkennbar.
- source_word: חַטָּאִים
  choice: Schuldige
  rationale: Der Ausdruck kann moralisch »Sünder« bedeuten, bezeichnet im Thronfolgekontext aber wahrscheinlich Menschen, die als schuldig beziehungsweise strafwürdig behandelt werden. »Schuldige« erhält beide Anklänge besser als das engere »Verbrecher«.
theological_decisions:
- issue: Bedeutung von חַטָּאִים im Zusammenhang des Thronfolgestreits
  choice: Schuldige
  alternative: Sünder
  rationale: Der politische Kontext legt einen zugeschriebenen Schuldstatus nahe, doch die moralische Bedeutung des Wortes wird nicht vollständig ausgeschlossen; eine Fußnote bewahrt diese Spannweite.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erkennbarer höfischer Anrede. Die hebräische Todesformel bleibt bildhaft, wird aber mit »Vorfahren« für heutige Leser verständlich formuliert.
