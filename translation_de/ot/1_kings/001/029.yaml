  text: וַ/יִּשָּׁבַ֥ע הַ/מֶּ֖לֶךְ וַ/יֹּאמַ֑ר חַי יְהוָ֕ה אֲשֶׁר פָּדָ֥ה אֶת נַפְשִׁ֖/י מִ/כָּל צָרָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/029.yaml
  text: And the king swore and said[a], “As Yahweh lives, who has redeemed my life from every distress,”
translation:
  language: de
  text: 'Da schwor der König und sagte: »So wahr Jahwe lebt, der mein Leben aus jeder Not erlöst hat:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: Da schwor
  rationale: Der Niphal von שׁבע bezeichnet das Ablegen eines Eides. „Schwor“ ist im deutschen Erzählstil knapp und natürlich; „da“ gibt die narrative Abfolge wieder.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Der bestimmte Titel wird entsprechend dem Hebräischen beibehalten, ohne den Namen David einzusetzen.
- source_word: וַיֹּאמַר
  choice: '[im folgenden Doppelpunkt enthalten]'
  rationale: Im Deutschen kann „schwor und sagte“ schwerfällig wirken. Der Doppelpunkt leitet den ausdrücklich gesprochenen Eid natürlich ein und bewahrt die Redeeinführung funktional.
- source_word: חַי יְהוָה
  choice: So wahr Jahwe lebt
  rationale: Diese geläufige deutsche Eidesformel gibt sowohl חַי als auch die performative Funktion der hebräischen Wendung wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird transliteriert und nicht durch den Titel „der HERR“ ersetzt.
- source_word: אֲשֶׁר
  choice: der
  rationale: Das Relativpronomen bezieht sich auf den personal verstandenen Gottesnamen und wird im Deutschen passend mit „der“ wiedergegeben.
- source_word: פָּדָה
  choice: erlöst hat
  rationale: „Erlösen“ bewahrt den Grundsinn rettender Befreiung; das Perfekt bezeichnet die zurückblickend bekannte Rettungserfahrung.
- source_word: נַפְשִׁי
  choice: mein Leben
  rationale: נֶפֶשׁ bezeichnet hier angesichts erfahrener Gefahren am natürlichsten das bewahrte Leben beziehungsweise die Person, nicht eigens eine vom Körper getrennte Seele.
- source_word: מִכָּל צָרָה
  choice: aus jeder Not
  rationale: „Not“ gibt צָרָה in diesem Zusammenhang idiomatisch als Bedrängnis oder Gefahr wieder; „jeder“ wahrt die umfassende Aussage von כָּל.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den persönlichen Gottesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von נַפְשִׁי
  choice: mein Leben
  alternative: meine Seele; mich
  rationale: Der Zusammenhang spricht von Davids Rettung aus wiederholter Not. „Mein Leben“ vermeidet eine nicht vom Text verlangte dualistische Engführung.
- issue: Wiedergabe von פדה
  choice: erlöst hat
  alternative: befreit hat; gerettet hat
  rationale: „Erlöst“ wahrt die rettende beziehungsweise auslösende Bedeutungsbreite des Verbs, ohne im Kontext einen bestimmten Sühne- oder Lösegeldmechanismus festzulegen.
translation_notes:
  register: Moderner, würdevoller deutscher Erzählstil. Die koordinierte Formel „schwor und sagte“ wird idiomatisch zu „schwor:“ verdichtet. Der abschließende Doppelpunkt zeigt, dass der Eid im folgenden Vers fortgesetzt wird.
