  terminology: Die Namensformen Zadok, Nathan, Benaja und Jojada sind im Deutschen geläufig. »Priester« und »Prophet« entsprechen den hebräischen Amtsbezeichnungen präzise. Die Formulierung »den Sohn Jojadas« gibt die genealogische Kennzeichnung בן־יהוידע sachgerecht wieder.
