base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/032.yaml
  text: Then King David said, “Call Zadok the priest, Nathan the prophet, and Benaiah son of Jehoiada to me.” And they came before the king.
translation:
  language: de
  text: 'Da sagte König David: »Ruft mir den Priester Zadok, den Propheten Nathan und Benaja, den Sohn Jojadas!« Da traten sie vor den König.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das narrative Waw mit Imperfekt führt die Handlung weiter; »Da sagte« gibt die zeitliche Abfolge in natürlichem Deutsch wieder.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: König David
  rationale: Die Verbindung aus Titel und Eigenname wird im Deutschen idiomatisch als »König David« wiedergegeben.
- source_word: קִרְאוּ לִי
  choice: Ruft mir
  rationale: Der Pluralimperativ von קרא mit לִי fordert die Angesprochenen auf, die genannten Personen zum Sprecher zu rufen. »Ruft mir« bewahrt die knappe Form des Hebräischen.
- source_word: לְצָדוֹק הַכֹּהֵן
  choice: den Priester Zadok
  rationale: Die deutsche Wortstellung nennt das bestimmte Amt vor dem Eigennamen und gibt damit die hebräische Bezeichnung präzise und natürlich wieder.
- source_word: וּלְנָתָן הַנָּבִיא
  choice: den Propheten Nathan
  rationale: נָבִיא wird mit der üblichen und sachlich genauen Amtsbezeichnung »Prophet« wiedergegeben.
- source_word: וְלִבְנָיָהוּ בֶּן יְהוֹיָדָע
  choice: und Benaja, den Sohn Jojadas
  rationale: Die Eigennamen folgen geläufigen deutschen Bibelnamensformen; die Apposition »den Sohn Jojadas« identifiziert Benaja eindeutig.
- source_word: וַיָּבֹאוּ
  choice: Da traten sie
  rationale: Das Verb בוא bezeichnet ihr Kommen in die königliche Gegenwart. »Da traten sie« setzt die Erzählung fort und klingt zusammen mit »vor den König« natürlich.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: vor den König
  rationale: לִפְנֵי bezeichnet hier das Erscheinen in der Gegenwart des Königs; mit dem Bewegungsverb ist im Deutschen der Akkusativ idiomatisch.
