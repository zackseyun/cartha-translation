  source_fidelity: 'Der Entwurf gibt sämtliche Elemente des hebräischen Textes wieder: die narrative Fortführung, König David als Sprecher, den Pluralimperativ mit Bezug auf David (»mir«), die drei genannten Personen samt Titeln bzw. Abstammungsangabe sowie ihr Kommen vor den König. »Da traten sie vor den König« ist eine idiomatische, dem Kontext entsprechende Wiedergabe von »sie kamen vor den König«.'
