  text: וַ/יַּ֨עַן בְּנָיָ֧הוּ בֶן יְהֽוֹיָדָ֛ע אֶת הַ/מֶּ֖לֶךְ וַ/יֹּ֣אמֶר אָמֵ֑ן כֵּ֚ן יֹאמַ֣ר יְהוָ֔ה אֱלֹהֵ֖י אֲדֹנִ֥/י הַ/מֶּֽלֶךְ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/036.yaml
  text: Benaiah son of Jehoiada answered the king and said[a], “Amen! May Yahweh, the God of my lord the king, say so.”
translation:
  language: de
  text: 'Benaja, der Sohn Jojadas, antwortete dem König und sagte: »Amen! So möge Jahwe, der Gott meines Herrn, des Königs, sagen.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Amen! So sage Jahwe, der Gott meines Herrn, des Königs.« Das hebräische Verb bedeutet wörtlich »sagen«; hier kann damit gemeint sein, dass Gott den Wunsch des Königs bestätigt oder wirksam bestimmt.'
    reason: lexikalische Alternative und Erläuterung der wünschenden Verbform
lexical_decisions:
- source_word: וַיַּעַן
  choice: antwortete
  rationale: Die übliche Erzählform von ענה leitet hier Benajas Erwiderung auf Davids Anordnung ein.
- source_word: בְּנָיָהוּ בֶן יְהוֹיָדָע
  choice: Benaja, der Sohn Jojadas
  rationale: Die im Deutschen gebräuchlichen Namensformen werden verwendet; die hebräische Patronymform bleibt ausdrücklich erhalten.
- source_word: וַיֹּאמֶר
  choice: und sagte
  rationale: Bewahrt die hebräische Erzählfolge, ohne im Deutschen unnatürlich zu wirken.
- source_word: אָמֵן
  choice: Amen!
  rationale: Drückt zugleich nachdrückliche Zustimmung und den Wunsch aus, dass das Gesagte Wirklichkeit wird.
- source_word: כֵּן יֹאמַר
  choice: So möge ... sprechen
  rationale: כֵּן verweist auf den zuvor geäußerten königlichen Willen; der Imperfekt יֹאמַר hat nach אָמֵן in diesem Zusammenhang wünschenden Charakter.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen in der im modernen Deutschen geläufigen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהֵי אֲדֹנִי הַמֶּלֶךְ
  choice: der Gott meines Herrn, des Königs
  rationale: Bewahrt sowohl die Genitivverbindung als auch die ehrerbietige höfische Bezeichnung Davids.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. »Jahwe« bewahrt ihn als Eigennamen; »der HERR« wäre die traditionelle ersetzende Lesung.
- issue: Bedeutung von Gottes »Sprechen« in Benajas Wunsch
  choice: Das Verb wird offen als »sprechen« wiedergegeben.
  alternative: »bestätigen« oder »so bestimmen«
  rationale: Im Zusammenhang kann Gottes Sprechen die Bestätigung oder wirksame Anordnung des königlichen Vorhabens bezeichnen. Die Übersetzung hält jedoch die konkrete Ausdrucksweise des Hebräischen fest und erläutert die Sinnweite in der Fußnote.
translation_notes:
  register: Moderne, würdige Standardsprache. Die höfische Anrede »mein Herr, der König« bleibt in der Genitivfügung erhalten. »Amen« wird wegen seiner vertrauten und zugleich quellennahen Aussagekraft nicht umschrieben.
