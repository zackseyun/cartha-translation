revisions:
- from: Und das ganze Volk zog hinter ihm hinauf. Die Menschen spielten auf Flöten[a] und jubelten voller Freude, sodass die Erde von ihrem Lärm zu bersten schien.[b]
  to: Und das ganze Volk zog hinter ihm her hinauf, und das Volk spielte auf Flöten[a] und jubelte vor großer Freude, und die Erde barst bei ihrem Schall.[b]
  rationale: Die Revision stellt die direkte, bildhafte Aussage des hebräischen Textes wieder her und entfernt sowohl die unmarkierte Abschwächung („schien“) als auch die hinzugefügte Folgerungsbeziehung („sodass“). Die mögliche Hyperbel bleibt sachgerecht in der Fußnote erläutert.
