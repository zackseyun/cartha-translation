base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/040.yaml
  text: And all the people went up after him[a], and the people were playing flutes and rejoicing with great joy[b], and the earth split apart at their sound.
translation:
  language: de
  text: Und das ganze Volk zog hinter ihm her hinauf, und das Volk spielte auf Flöten[a] und jubelte vor großer Freude, und die Erde barst bei ihrem Schall.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf Pfeifen“. Das hebräische Wort kann verschiedene flötenartige Blasinstrumente bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das Bild, dass die Erde barst, ist wahrscheinlich eine Übertreibung, die die gewaltige Lautstärke der Feier beschreibt.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: zog … hinauf
  rationale: עלה bezeichnet grundsätzlich eine Aufwärtsbewegung; im Zusammenhang ist ein hinaufziehender Festzug gemeint.
- source_word: כָל הָעָם
  choice: das ganze Volk
  rationale: Gibt das Kollektiv mit כָל unmittelbar und im Deutschen natürlich wieder.
- source_word: אַחֲרָיו
  choice: hinter ihm
  rationale: Bezeichnet hier das räumliche Folgen im Festzug und ist im modernen Deutschen natürlicher als „nach ihm“.
- source_word: מְחַלְּלִים בַּחֲלִלִים
  choice: spielten auf Flöten
  rationale: Das Verb bezeichnet hier das Spielen, חלילים flöten- oder pfeifenartige Blasinstrumente.
- source_word: וּשְׂמֵחִים שִׂמְחָה גְדוֹלָה
  choice: jubelten voller Freude
  rationale: Gibt die nachdrückliche Verbindung von Verb und stammverwandtem Substantiv idiomatisch und mit erhaltener Intensität wieder.
- source_word: וַתִּבָּקַע הָאָרֶץ
  choice: die Erde … zu bersten schien
  rationale: Bewahrt das kräftige Bild des Spaltens beziehungsweise Berstens, macht aber kenntlich, dass im Kontext wahrscheinlich eine Übertreibung für den gewaltigen Lärm vorliegt.
- source_word: בְּקוֹלָם
  choice: von ihrem Lärm
  rationale: קוֹל umfasst Stimme, Klang und Geräusch; wegen Menschenmenge und Instrumenten bezeichnet „Lärm“ hier den gesamten lauten Festklang.
