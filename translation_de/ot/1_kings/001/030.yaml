base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/030.yaml
  text: As I swore to you by Yahweh[a], the God of Israel, saying, ‘Surely Solomon your son will reign after me[b], and he will sit on my throne in my place,’ so I will do this today.
translation:
  language: de
  text: 'Wie ich dir bei Jahwe[a], dem Gott Israels, geschworen habe: »Dein Sohn Salomo wird nach mir König sein, und er wird an meiner Stelle auf meinem Thron sitzen«, so werde ich es heute tun.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; hier mit »Jahwe« wiedergegeben.'
    reason: divine_name
lexical_decisions:
- source_word: כִּי כַּאֲשֶׁר ... כִּי כֵן
  choice: So wahr ... so
  rationale: Die korrelative Formulierung verbindet den früheren Eid mit Davids nun zugesagtem Handeln. »So wahr« gibt im Deutschen den feierlichen Eidcharakter natürlich wieder.
- source_word: נִשְׁבַּעְתִּי לָךְ
  choice: ich dir ... geschworen habe
  rationale: Das Perfekt bezeichnet den bereits geleisteten Eid; im deutschen Nebensatz ist das Perfekt idiomatisch.
- source_word: בַּיהוָה
  choice: bei Jahwe
  rationale: Die Präposition bezeichnet den, bei dem geschworen wird; der Gottesname wird als »Jahwe« wiedergegeben.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: dem Gott Israels
  rationale: Direkte und geläufige Wiedergabe der hebräischen Genitivverbindung.
- source_word: לֵאמֹר
  choice: Doppelpunkt mit direkter Rede
  rationale: Die hebräische Redeeinleitung wird im modernen Deutschen natürlicherweise durch einen Doppelpunkt ausgedrückt.
- source_word: שְׁלֹמֹה בְנֵךְ
  choice: dein Sohn Salomo
  rationale: Diese Wortstellung ist im Deutschen natürlicher als die formale Nachbildung »Salomo, dein Sohn«.
- source_word: יִמְלֹךְ אַחֲרַי
  choice: wird nach mir König sein
  rationale: Bewahrt sowohl die Bedeutung des Königtums als auch die zeitliche und dynastische Nachfolge.
- source_word: וְהוּא יֵשֵׁב עַל כִּסְאִי תַּחְתָּי
  choice: und er wird an meiner Stelle auf meinem Thron sitzen
  rationale: »Auf meinem Thron sitzen« bewahrt das königliche Bild; »an meiner Stelle« gibt die Nachfolge beziehungsweise Stellvertretung von תַּחְתָּי wieder.
- source_word: הַיּוֹם הַזֶּה
  choice: noch heute
  rationale: »Noch heute« bringt im Kontext die unmittelbare Ausführung der Zusage idiomatisch zum Ausdruck.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Eigenname wird transparent als »Jahwe« wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von תַּחְתָּי in der Thronfolge
  choice: an meiner Stelle
  alternative: nach mir; statt meiner
  rationale: Die Formulierung hält den Gedanken der Ablösung und Nachfolge fest, ohne eine weitergehende theologische Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feierliche Eidesstruktur bleibt erhalten, während die Redeeinleitung und Wortstellung natürlich deutsch formuliert sind.
