  source_fidelity: 'Die Grundbedeutung wird zutreffend wiedergegeben: David bekräftigt den bei Jahwe geleisteten Eid, dass Salomo ihm als König nachfolgen und auf seinem Thron sitzen werde, und sagt die Ausführung für den heutigen Tag zu. Die korrelative hebräische Struktur כִּי כַּאֲשֶׁר … כִּי כֵן entspricht jedoch primär „Wie/so wie … so“, nicht der deutschen Schwurformel „So wahr …“.'
  naturalness: „So wahr ich dir … geschworen habe …, so“ ist im modernen Standarddeutsch semantisch und syntaktisch weniger präzise, da „so wahr“ selbst eine Beteuerungsformel bildet. „Wie ich dir … geschworen habe …, so werde ich es heute tun“ ist idiomatisch, feierlich und bildet die hebräische Vergleichsstruktur klar ab. „Heute“ ist genauer als „noch heute“, da das Hebräische keine zusätzliche Partikel im Sinn von „noch“ enthält.
  terminology: „Jahwe“, „Gott Israels“, „Salomo“, „König sein“, „Thron“ und „an meiner Stelle“ sind sachgerecht. Die Fußnote zum Gottesnamen ist korrekt verankert und entspricht der gewählten deutschen Wiedergabe.
