base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/004.yaml
  text: The young woman was very beautiful[a], and she became the king’s attendant and served him, but the king did not know her.
translation:
  language: de
  text: Die junge Frau war sehr schön. Sie wurde zur persönlichen Dienerin des Königs und diente ihm, aber der König hatte keinen Geschlechtsverkehr mit ihr.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Der König erkannte sie nicht.“ Das hebräische Verb „erkennen“ ist hier eine verhüllende Ausdrucksweise für Geschlechtsverkehr.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעֲרָה
  choice: die junge Frau
  rationale: נַעֲרָה bezeichnet eine junge weibliche Person. »Junge Frau« ist im modernen Standarddeutsch natürlich und vermeidet sowohl die möglicherweise zu junge Konnotation von »Mädchen« als auch den altertümlichen Klang von »Jungfrau«.
- source_word: יָפָה עַד מְאֹד
  choice: war überaus schön
  rationale: Die Wendung verstärkt die Aussage deutlich. »Überaus schön« gibt diese Intensität in würdigem, natürlichem Deutsch wieder.
- source_word: סֹכֶנֶת
  choice: Betreuerin
  rationale: Das seltene Wort bezeichnet hier eine Frau, die dem König persönlich zur Unterstützung zugeordnet ist. »Betreuerin« bleibt hinsichtlich der genauen Aufgaben hinreichend offen und legt weder ausschließlich Krankenpflege noch eine romantische Beziehung nahe.
- source_word: וַתְּשָׁרְתֵהוּ
  choice: und diente ihm
  rationale: שרת bedeutet in diesem Zusammenhang, einer Person Dienst zu leisten. »Diente ihm« ist klar und vermeidet den kirchlichen Beiklang von »ministrierte ihm«.
- source_word: יְדָעָהּ
  choice: erkannte sie nicht
  rationale: ידע wird hier als Euphemismus für Geschlechtsverkehr gebraucht. Die traditionelle, im Deutschen verständliche Wendung »erkannte sie nicht« bewahrt das Bild des hebräischen Textes; eine Fußnote erläutert die konkrete Bedeutung.
theological_decisions:
- issue: Sexueller Euphemismus in der Erzählung
  choice: Die idiomatische Aussage »erkannte sie nicht« steht im Haupttext und wird durch eine Fußnote erklärt.
  alternative: »hatte keinen Geschlechtsverkehr mit ihr« beziehungsweise »schlief nicht mit ihr«
  rationale: So bleibt die Ausdrucksweise des hebräischen Textes erhalten, ohne den erzählerisch bedeutsamen Hinweis zu verschleiern, dass es zwischen dem König und der jungen Frau nicht zum Geschlechtsverkehr kam.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die seltene Rollenbezeichnung סֹכֶנֶת wird nicht unnötig medizinisch oder romantisch präzisiert; der hebräische sexuelle Euphemismus bleibt im Haupttext erhalten und wird transparent erläutert.
