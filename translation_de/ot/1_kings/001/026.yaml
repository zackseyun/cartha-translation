base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/026.yaml
  text: But me—your servant—and Zadok the priest[a], and Benaiah son of Jehoiada, and Solomon your servant, he did not call.
translation:
  language: de
  text: Mich aber, deinen Diener, den Priester Zadok, Benaja, den Sohn Jojadas, und deinen Diener Salomo hat er nicht eingeladen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nicht gerufen“ beziehungsweise „nicht zu sich gerufen“. Das hebräische Verb kann rufen, herbeirufen oder einladen bedeuten; im unmittelbaren Zusammenhang mit Adonijas Opfermahl liegt „einladen“ nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִי אֲנִי עַבְדֶּךָ
  choice: Mich aber, deinen Diener
  rationale: Die vorangestellte Wendung ist betont und bildet im Zusammenhang einen Gegensatz zu den Eingeladenen. „Mich aber“ gibt diese Hervorhebung natürlich wieder; „deinen Diener“ bewahrt die höfische Selbstbezeichnung.
- source_word: צָדֹק הַכֹּהֵן
  choice: den Priester Zadok
  rationale: Der bestimmte Amtstitel wird im Deutschen idiomatisch vor den Namen gestellt.
- source_word: בְנָיָהוּ בֶן יְהוֹיָדָע
  choice: Benaja, den Sohn Jojadas
  rationale: Der hebräische Vatersname wird in geläufiger deutscher Form wiedergegeben.
- source_word: שְׁלֹמֹה עַבְדְּךָ
  choice: deinen Diener Salomo
  rationale: Die höfische Bezeichnung Salomos in seinem Verhältnis zum König bleibt erhalten.
- source_word: לֹא קָרָא
  choice: hat er nicht eingeladen
  rationale: קרא kann „rufen“, „herbeirufen“ oder „einladen“ bedeuten. Im unmittelbaren Zusammenhang mit Adonijas Opfermahl ist „einladen“ die natürlichste Wiedergabe; die lexikalische Breite wird in der Fußnote bewahrt.
