  source_fidelity: 'Der Entwurf gibt alle wesentlichen Elemente des Hebräischen zutreffend wieder: die erzählende Einleitung, die höfisch-drittpersonige Selbstbezeichnung des Königs (»eures Herrn«), die Mitnahme seiner Diener, die Kausativbedeutung von וְהִרְכַּבְתֶּם, den hervorgehobenen königlichen Besitz des Maultiers sowie die Bewegung hinab nach Gihon.'
