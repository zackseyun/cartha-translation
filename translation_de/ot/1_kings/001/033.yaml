base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/033.yaml
  text: And the king said to them[a], “Take with you the servants of your lord, and have my son Solomon ride on the mule that is mine, and bring him down to Gihon.”
translation:
  language: de
  text: 'Und der König sagte zu ihnen: »Nehmt die Diener eures Herrn mit euch, lasst meinen Sohn Salomo auf dem Maultier, das mir gehört, reiten[a] und bringt ihn hinunter zum Gihon.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »setzt meinen Sohn Salomo auf das Maultier, das mir gehört«. Das hebräische Verb steht in einer kausativen Form: Die Diener sollen bewirken, dass Salomo auf dem Tier reitet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי אֲדֹנֵיכֶם
  choice: die Diener eures Herrn
  rationale: Die Wendung bezeichnet im höfischen Zusammenhang die Bediensteten beziehungsweise Gefolgsleute des Königs. »Diener« lässt ihren genauen rechtlichen Status offen; »eures Herrn« bewahrt die förmliche Selbstbezeichnung des Königs in der dritten Person.
- source_word: וְהִרְכַּבְתֶּם
  choice: lasst … reiten
  rationale: 'Der Hifil von רכב ist kausativ: Die Angesprochenen sollen dafür sorgen, dass Salomo auf dem Tier reitet. Die gewählte Formulierung gibt dies in natürlichem Deutsch wieder.'
- source_word: הַפִּרְדָּה
  choice: das Maultier
  rationale: Das hebräische Substantiv bezeichnet hier ein Maultier und ist grammatisch feminin. Da das Geschlecht des Tieres im Zusammenhang nicht eigens hervorgehoben wird, ist der übliche deutsche Gattungsbegriff angemessen.
- source_word: אֲשֶׁר לִי
  choice: das mir gehört
  rationale: Der Relativsatz betont, dass es sich um das persönliche Tier des Königs handelt, und damit zugleich um seine öffentliche Autorisierung Salomos.
- source_word: וְהוֹרַדְתֶּם אֹתוֹ
  choice: bringt ihn hinunter
  rationale: Der Kausativ von ירד bewahrt die Bewegung abwärts zum tiefer gelegenen Gihon.
- source_word: גִּחוֹן
  choice: Gihon
  rationale: Der Ortsname wird entsprechend der geläufigen deutschen biblischen Namensform transliteriert.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Erzählstil mit höfischer Anrede. Die ungewöhnliche Rede vom König als »eurem Herrn« bleibt erhalten. Der Relativsatz »das mir gehört« bildet die hebräische Besitzkonstruktion ausdrücklich ab und unterstreicht die königliche Autorisierung.
