base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/022.yaml
  text: And behold[a], while she was still speaking with the king, Nathan the prophet came in.
translation:
  language: de
  text: 'Und sieh da[a]: Noch während sie mit dem König sprach, kam der Prophet Nathan herein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und siehe“. Die hebräische Wendung lenkt die Aufmerksamkeit auf die plötzliche Entwicklung der Szene.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Und sieh da
  rationale: Die hebräische Aufmerksamkeitsformel hebt die überraschende neue Entwicklung der Szene hervor. „Sieh da“ bewahrt diese Unmittelbarkeit in verständlichem, würdigem Deutsch.
- source_word: עוֹדֶנָּה מְדַבֶּרֶת
  choice: Noch während sie … sprach
  rationale: Das Adverb mit femininem Suffix und das Partizip bezeichnen eine noch andauernde Handlung. Die Formulierung macht die zeitliche Überschneidung natürlich deutlich.
- source_word: עִם הַמֶּלֶךְ
  choice: mit dem König
  rationale: Die Präposition עִם bedeutet hier unmittelbar „mit“ und bezeichnet Batsebas Gespräch mit dem König.
- source_word: וְנָתָן הַנָּבִיא
  choice: der Prophet Nathan
  rationale: Der Titel wird im Deutschen idiomatisch vor den Namen gestellt, ohne die sachliche Identifizierung Nathans als Prophet zu verändern.
- source_word: בָּא
  choice: kam … herein
  rationale: Im Kontext der königlichen Audienz bezeichnet das Verb Nathans Eintreten beziehungsweise Hereinkommen in die Szene.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Sieh da“ gibt den hebräischen Diskursmarker lebendig wieder; die Satzstellung betont, dass Nathan eintraf, während Batseba noch sprach.
