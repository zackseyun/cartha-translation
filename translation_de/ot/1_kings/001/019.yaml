source:
  edition: WLC
  text: וַ֠/יִּזְבַּח שׁ֥וֹר וּֽ/מְרִיא וְ/צֹאן֮ לָ/רֹב֒ וַ/יִּקְרָא֙ לְ/כָל בְּנֵ֣י הַ/מֶּ֔לֶךְ וּ/לְ/אֶבְיָתָר֙ הַ/כֹּהֵ֔ן וּ/לְ/יֹאָ֖ב שַׂ֣ר הַ/צָּבָ֑א וְ/לִ/שְׁלֹמֹ֥ה עַבְדְּ/ךָ֖ לֹ֥א קָרָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/019.yaml
  text: And he sacrificed oxen[a], fattened cattle, and sheep in abundance, and he invited all the king’s sons, Abiathar the priest, and Joab the commander of the army[b]; but he did not invite Solomon your servant.
translation:
  language: de
  text: Er opferte Rinder, Mastvieh und Kleinvieh[a] in großer Menge und lud alle Söhne des Königs, den Priester Abjatar und Joab, den Heerführer, ein; deinen Diener Salomo aber lud er nicht ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet Kleinvieh und kann sowohl Schafe als auch Ziegen umfassen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: Er opferte
  rationale: זבח bezeichnet hier das Schlachten als Opferhandlung; »opfern« gibt den kultischen Zusammenhang natürlich und präzise wieder.
- source_word: שׁוֹר
  choice: Rinder
  rationale: שׁוֹר ist eine allgemeine Bezeichnung für Rindvieh; »Rinder« vermeidet eine unbegründete Festlegung auf Geschlecht oder Nutzung.
- source_word: מְרִיא
  choice: Mastvieh
  rationale: מְרִיא bezeichnet gemästetes Vieh. Der deutsche Kollektivbegriff passt zur Aufzählung der Opfertiere.
- source_word: צֹאן
  choice: Kleinvieh
  rationale: צֹאן kann Schafe und Ziegen umfassen; »Kleinvieh« bewahrt diesen weiteren Bedeutungsumfang.
- source_word: לָרֹב
  choice: in großer Menge
  rationale: Die Wendung bezeichnet eine große Anzahl und wird in klarem, gegenwärtigem Deutsch wiedergegeben.
- source_word: וַיִּקְרָא ... לֹא קָרָא
  choice: lud ... ein; ... lud er nicht ein
  rationale: קרא bedeutet wörtlich »rufen«, bezeichnet hier aber im Zusammenhang des Opfermahls die Einladung zur Teilnahme. Die Wiederholung desselben Verbs bleibt in der Übersetzung sichtbar.
- source_word: לְכָל בְּנֵי הַמֶּלֶךְ
  choice: alle Söhne des Königs
  rationale: Die Formulierung gibt den ausdrücklich männlichen und königlichen Bezug des Hebräischen direkt wieder.
- source_word: אֶבְיָתָר הַכֹּהֵן
  choice: den Priester Abjatar
  rationale: Der Name wird in gebräuchlicher deutscher Form wiedergegeben, der Titel übersetzt.
- source_word: יֹאָב שַׂר הַצָּבָא
  choice: Joab, den Heerführer
  rationale: שַׂר הַצָּבָא bezeichnet den militärischen Befehlshaber; »Heerführer« ist knapp, verständlich und würdevoll.
- source_word: וְלִשְׁלֹמֹה עַבְדְּךָ
  choice: deinen Diener Salomo aber
  rationale: Die ehrerbietige Bezeichnung Salomos gegenüber David bleibt erhalten; »aber« macht den im Kontext angelegten Gegensatz zu den Eingeladenen deutlich.
