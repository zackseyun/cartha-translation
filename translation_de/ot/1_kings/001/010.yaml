  text: וְֽ/אֶת נָתָן֩ הַ/נָּבִ֨יא וּ/בְנָיָ֜הוּ וְ/אֶת הַ/גִּבּוֹרִ֛ים וְ/אֶת שְׁלֹמֹ֥ה אָחִ֖י/ו לֹ֥א קָרָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/010.yaml
  text: But he did not invite Nathan the prophet[a], Benaiah, the mighty men, or Solomon his brother.
translation:
  language: de
  text: Doch den Propheten Nathan[a], Benaja, die Helden und seinen Bruder Salomo lud er nicht ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Doch den Propheten Nathan, Benaja, die Helden und seinen Bruder Salomo rief er nicht.“ Das hebräische Verb bedeutet wörtlich „rufen“, hier im Sinn von „zu Adonijas Fest einladen“ oder „dazu holen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: Doch
  rationale: Das וְ führt die Aufzählung fort, hat hier im Kontrast zu den eingeladenen Gästen in Vers 9 aber eine adversative Wirkung; die Objektpartikel אֶת bleibt unübersetzt.
- source_word: נָתָן הַנָּבִיא
  choice: den Propheten Nathan
  rationale: Der Titel נָבִיא wird mit „Prophet“ wiedergegeben; die im Deutschen natürliche Stellung mit vorangestelltem Titel fügt sich klar in die Reihe der direkten Objekte ein.
- source_word: וּבְנָיָהוּ
  choice: Benaja
  rationale: Der Personenname wird nach gebräuchlicher deutscher Bibeltradition transliteriert; die vorangestellte Konjunktion wird durch die deutsche Reihung aufgenommen.
- source_word: הַגִּבּוֹרִים
  choice: die Helden
  rationale: גִּבּוֹרִים bezeichnet hier Davids besonders angesehene und kampferprobte Männer. „Die Helden“ ist im königlich-militärischen Kontext prägnant und traditionsnah, ohne die Gruppe übergenau zu bestimmen.
- source_word: שְׁלֹמֹה אָחִיו
  choice: seinen Bruder Salomo
  rationale: Das Suffix in אָחִיו bezieht sich im Kontext auf Adonija. Die deutsche Wortstellung ist natürlicher als eine formale Nachbildung der hebräischen Reihenfolge.
- source_word: לֹא קָרָא
  choice: lud er nicht ein
  rationale: קרא bedeutet wörtlich „rufen“, bezeichnet im Zusammenhang des Festmahls jedoch das Einladen. Die Übersetzung gibt diese kontextuelle Bedeutung idiomatisch wieder; die wörtlichere Möglichkeit wird in der Fußnote bewahrt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die adversative Verbindung zum vorherigen Vers wird mit „Doch“ sichtbar gemacht; die Satzstruktur bleibt knapp und erzählerisch. Der Fußnotenmarker steht unmittelbar bei der ersten von der Anmerkung betroffenen Namensgruppe, entsprechend der konsultierten Fassung.
