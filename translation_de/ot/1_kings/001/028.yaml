source:
  edition: WLC
  text: וַ/יַּ֨עַן הַ/מֶּ֤לֶךְ דָּוִד֙ וַ/יֹּ֔אמֶר קִרְאוּ לִ֖/י לְ/בַת שָׁ֑בַע וַ/תָּבֹא֙ לִ/פְנֵ֣י הַ/מֶּ֔לֶךְ וַֽ/תַּעֲמֹ֖ד לִ/פְנֵ֥י הַ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/028.yaml
  text: Then King David answered and said[a], “Call Bathsheba to me.” So she came before the king and stood before the king.
translation:
  language: de
  text: 'Da antwortete König David und sagte[a]: »Ruft mir Batseba!« Da kam sie vor den König und stellte sich vor den König.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »reagierte«. Die hebräische Erzählformel verwendet häufig »antworten«, um eine Rede einzuleiten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: antwortete
  rationale: Das Verb ענה bezeichnet hier in der Erzählformel ein Antworten oder Reagieren. »Antwortete« bewahrt die hebräische Ausdrucksweise, auch wenn unmittelbar zuvor keine ausdrückliche Frage steht.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: König David
  rationale: Die Verbindung von Titel und Eigenname wird im natürlichen Standarddeutsch als »König David« wiedergegeben.
- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: אמר ist das gewöhnliche Verb für das Sprechen; »sagte« gibt es unmittelbar wieder und erhält zusammen mit »antwortete« die hebräische Doppelformel.
- source_word: קִרְאוּ לִי
  choice: Ruft mir ...!
  rationale: קרא mit ל bezeichnet das Herbeirufen einer Person. Der Dativ »mir« gibt לִי knapp und idiomatisch wieder; der Plural des Imperativs bleibt erhalten.
- source_word: לְבַת שָׁבַע
  choice: Batseba
  rationale: Der Personenname wird in der im Deutschen verbreiteten biblischen Form »Batseba« wiedergegeben.
- source_word: וַתָּבֹא לִפְנֵי הַמֶּלֶךְ
  choice: Da kam sie vor den König
  rationale: בוא + לפני bezeichnet das Kommen in die Gegenwart einer Person. »Vor den König kommen« ist verständlich und wahrt die räumlich-höfische Formulierung.
- source_word: וַתַּעֲמֹד לִפְנֵי הַמֶּלֶךְ
  choice: und trat vor den König
  rationale: עמד bedeutet grundsätzlich »stehen« bzw. »sich hinstellen«. »Trat vor den König« bezeichnet hier natürlich das Einnehmen der förmlichen Stellung vor ihm und erhält die Wiederholung von »vor den König«.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung »vor den König« folgt bewusst dem Hebräischen und unterstreicht die förmliche Hofsituation; die Redeformel »antwortete ... und sagte« wird trotz ihrer im Deutschen auffälligen Doppelung beibehalten.
