base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/049.yaml
  text: Then all Adonijah’s invited guests trembled and rose[a], and each man went his way.
translation:
  language: de
  text: Da zitterten alle Gäste Adonijas, standen auf, und jeder ging seines Weges.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »ein Mann zu seinem Weg«; die hebräische Wendung drückt aus, dass jeder seinen eigenen Weg ging.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֶרְדוּ
  choice: erschraken
  rationale: Das Verb חרד bezeichnet eine von Furcht oder Bestürzung ausgelöste heftige Reaktion, die bis zum Zittern reichen kann. »Erschraken« gibt die Reaktion im Deutschen natürlich wieder, ohne sie zu übersteigern.
- source_word: וַיָּקֻמוּ
  choice: standen auf
  rationale: קום bedeutet hier im erzählenden Ablauf, dass die Gäste sich erhoben. »Standen auf« ist im modernen Deutschen natürlicher als »erhoben sich« und bewahrt die plötzliche Reaktion.
- source_word: כָּל הַקְּרֻאִים אֲשֶׁר לַאֲדֹנִיָּהוּ
  choice: alle Gäste Adonijas
  rationale: הַקְּרֻאִים bezeichnet die Eingeladenen; im Zusammenhang mit dem Fest sind damit die Gäste gemeint. Die Verbindung mit לַאֲדֹנִיָּהוּ wird idiomatisch als Zugehörigkeit zu Adonijas Einladung wiedergegeben.
- source_word: וַיֵּלְכוּ
  choice: ging
  rationale: 'הלך ist das gewöhnliche Verb für »gehen«. Wegen des distributiven אִישׁ steht die deutsche Wiedergabe passend im Singular: »jeder ging«.'
- source_word: אִישׁ לְדַרְכּוֹ
  choice: jeder ging seines Weges
  rationale: 'Die hebräische Wendung hat distributiven Sinn: Die Gäste zerstreuten sich und jeder ging für sich fort. »Jeder ging seines Weges« wahrt Bild und Bedeutung in idiomatischem, würdigem Deutsch.'
theological_decisions: []
