id: 1KI.1.8
reference: 1 Kings 1:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/צָד֣וֹק הַ֠/כֹּהֵן וּ/בְנָיָ֨הוּ בֶן יְהוֹיָדָ֜ע וְ/נָתָ֤ן הַ/נָּבִיא֙ וְ/שִׁמְעִ֣י וְ/רֵעִ֔י וְ/הַ/גִּבּוֹרִ֖ים אֲשֶׁ֣ר לְ/דָוִ֑ד לֹ֥א הָי֖וּ עִם אֲדֹנִיָּֽהוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/008.yaml
  text: But Zadok the priest[a], Benaiah son of Jehoiada, Nathan the prophet, Shimei, Rei, and the mighty men who belonged to David were not with Adonijah.
translation:
  language: de
  text: Doch der Priester Zadok, Benaja, der Sohn Jojadas, der Prophet Nathan, Schimi, Rei und die Helden, die zu David gehörten,[a] hielten nicht zu Adonija.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Davids Helden“. Wörtlich steht im Hebräischen: „die Helden, die zu David gehörten“ bzw. „die Helden, die David hatte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/צָד֣וֹק הַ֠/כֹּהֵן
  choice: Doch der Priester Zadok
  rationale: Das einleitende וְ markiert im Zusammenhang einen Gegensatz zur vorherigen Aufzählung der Anhänger Adonijas; „doch“ gibt diese Funktion natürlich wieder. הַכֹּהֵן bezeichnet Zadoks Amt.
- source_word: וּ/בְנָיָ֨הוּ בֶן יְהוֹיָדָ֜ע
  choice: Benaja, der Sohn Jojadas
  rationale: Die hebräische Patronymik wird ausdrücklich bewahrt; die Namensformen folgen gebräuchlicher deutscher Bibeltradition.
- source_word: וְ/נָתָ֤ן הַ/נָּבִיא֙
  choice: der Prophet Nathan
  rationale: Der appositionelle Titel wird in natürlicher deutscher Wortstellung wiedergegeben.
- source_word: וְ/שִׁמְעִ֣י וְ/רֵעִ֔י
  choice: Schimi, Rei
  rationale: Die Eigennamen werden in geläufigen deutschen Formen wiedergegeben; die wiederholten Konjunktionen werden entsprechend deutscher Aufzählungssyntax gebündelt.
- source_word: וְ/הַ/גִּבּוֹרִ֖ים אֲשֶׁ֣ר לְ/דָוִ֑ד
  choice: und die Helden, die zu David gehörten
  rationale: גִּבּוֹרִים bezeichnet hier kampferprobte Helden bzw. Elitekrieger. Die relationale Wendung אֲשֶׁר לְדָוִד wird ausdrücklich als „die zu David gehörten“ erhalten, ohne sie vorschnell nur als Besitzangabe zu verdichten.
- source_word: לֹ֥א הָי֖וּ עִם
  choice: hielten nicht zu
  rationale: Wörtlich bedeutet die Wendung „waren nicht mit“. Im politischen Erzählzusammenhang bezeichnet sie die fehlende Parteinahme; „hielten nicht zu“ gibt dies in modernem Deutsch knapp wieder.
- source_word: אֲדֹנִיָּֽהוּ
  choice: Adonija
  rationale: Gebräuchliche deutsche Form des Personennamens.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Aufzählung bleibt klar und knapp; der politische Gegensatz wird durch „doch“ und „hielten nicht zu“ verständlich ausgedrückt. Der Fußnotenmarker steht unmittelbar bei der mehrdeutigen Zugehörigkeitsformulierung.
