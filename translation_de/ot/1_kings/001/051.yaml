  text: וַ/יֻּגַּ֤ד לִ/שְׁלֹמֹה֙ לֵ/אמֹ֔ר הִנֵּה֙ אֲדֹ֣נִיָּ֔הוּ יָרֵ֖א אֶת הַ/מֶּ֣לֶךְ שְׁלֹמֹ֑ה וְ֠/הִנֵּה אָחַ֞ז בְּ/קַרְנ֤וֹת הַ/מִּזְבֵּ֨חַ֙ לֵ/אמֹ֔ר יִשָּֽׁבַֽע לִ֤/י כַ/יּוֹם֙ הַ/מֶּ֣לֶךְ שְׁלֹמֹ֔ה אִם יָמִ֥ית אֶת עַבְדּ֖/וֹ בֶּ/חָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/051.yaml
  text: And it was reported to Solomon, saying, “Look, Adonijah fears King Solomon, and look, he has taken hold of the horns of the altar, saying, ‘Let King Solomon swear to me today that he will not put his servant to death with the sword.’”
translation:
  language: de
  text: 'Man berichtete Salomo: »Siehe, Adonija fürchtet König Salomo; siehe, er hält sich an den Hörnern des Altars fest und sagt: ›König Salomo soll mir heute schwören, dass er seinen Diener nicht mit dem Schwert töten wird.‹«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד לִשְׁלֹמֹה לֵאמֹר
  choice: Salomo wurde berichtet
  rationale: Gibt die unpersönliche hebräische Passivkonstruktion natürlich und knapp wieder; לֵאמֹר leitet den Inhalt der Meldung ein und muss im Deutschen nicht eigens mit „mit den Worten“ abgebildet werden.
- source_word: הִנֵּה
  choice: nicht eigens wiedergegeben
  rationale: Das zweimalige הִנֵּה lenkt im Hebräischen die Aufmerksamkeit auf die Meldung. In der direkten deutschen Mitteilung wäre ein zweimaliges „Siehe“ oder „Schau“ unnatürlich; die Hervorhebung ergibt sich aus der Satzstellung.
- source_word: יָרֵא אֶת הַמֶּלֶךְ שְׁלֹמֹה
  choice: hat Angst vor König Salomo
  rationale: יָרֵא mit אֶת bezeichnet hier angesichts von Adonijas Flucht zum Altar konkrete Furcht, nicht ehrfürchtige Verehrung.
- source_word: אָחַז בְּקַרְנוֹת הַמִּזְבֵּחַ
  choice: hält sich an den Hörnern des Altars fest
  rationale: Bewahrt das konkrete kultische Bild der hornartigen Vorsprünge am Altar und gibt den fortdauernden Zustand idiomatisch wieder.
- source_word: כַיּוֹם
  choice: heute
  rationale: Der Ausdruck bedeutet in diesem Zusammenhang „heute“ beziehungsweise „noch heute“; „heute“ wahrt die zeitliche Dringlichkeit ohne zusätzliche Verstärkung.
- source_word: אִם יָמִית אֶת עַבְדּוֹ בֶּחָרֶב
  choice: dass er seinen Diener nicht mit dem Schwert töten lässt
  rationale: Nach einer Schwurformel hat אִם verneinende Kraft. Das Hifil יָמִית kann sowohl unmittelbares Töten als auch Veranlassen einer Hinrichtung ausdrücken; „töten lässt“ passt zur königlichen Vollstreckungsgewalt.
theological_decisions:
- issue: Adonijas Selbstbezeichnung als עַבְדּוֹ
  choice: seinen Diener
  alternative: mich
  rationale: Die wörtliche Selbstbezeichnung als „sein Diener“ bewahrt Adonijas demonstrative Unterwerfung unter Salomos Königtum.
- issue: Bedeutung der Altarthörner
  choice: ohne erklärenden Zusatz im Haupttext
  alternative: als ausdrückliche Bitte um Asyl oder Schutz erläutern
  rationale: Der Vers schildert die Handlung, erklärt aber ihre rechtliche oder theologische Bedeutung nicht ausdrücklich. Eine Deutung als garantiertes Asyl würde mehr festlegen, als der Text sagt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer direkter Rede. Die syntaktische Hebraizität von „und es wurde berichtet … indem man sagte“ wird geglättet, während kultische Bildsprache, königlicher Titel und Adonijas unterwürfige Selbstbezeichnung erhalten bleiben.
