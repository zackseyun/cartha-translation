  timestamp: '2026-07-15T11:49:58Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt den Kerninhalt zutreffend wieder: Adonijas Furcht, sein Ergreifen der Altarthörner, die Bitte um einen Eid noch am selben Tag sowie seine unterwürfige Selbstbezeichnung. Die zweimalige hervorgehobene Partikel הִנֵּה wird jedoch vollständig getilgt. Zudem legt „töten lässt“ die kausative Nuance als delegierte Hinrichtung fest, während der hebräische Hifil hier auch schlicht das Herbeiführen bzw. Vollziehen des Todes bezeichnen kann.'
  naturalness: „Salomo wurde berichtet“ ist zwar möglich, wirkt aber deutlich weniger idiomatisch als „Man berichtete Salomo“. „hat Angst vor“ ist modern, aber im würdigen Erzählregister der Königsbücher ist „fürchtet“ die passendere, keineswegs unnatürliche Wiedergabe.
  terminology: „König Salomo“, „Hörner des Altars“ und „sein Diener“ sind treffend. Die Selbstbezeichnung bleibt wichtig, weil sie Adonijas Unterordnung sprachlich sichtbar macht. Für die Schwurbitte ist „nicht ... töten wird“ gegenüber „nicht ... töten lässt“ neutraler und natürlicher.
  issues:
  - severity: medium
    issue: Die beiden הִנֵּה sind vollständig ausgelassen.
    rationale: Die Partikel markiert beide Informationen nachdrücklich. Modernes „Siehe“ kann sie ohne archaisierende Überhöhung angemessen wiedergeben und entspricht auch der englischen Audit-Trail-Wiedergabe „Look“.
  - severity: low
    issue: „töten lässt“ konkretisiert die Verbform unnötig als angeordnete Tötung.
    rationale: יַמִית ist Hifil und kann ein Herbeiführen des Todes ausdrücken, aber der Kontext verlangt keine ausdrückliche Unterscheidung zwischen eigenhändigem Töten und Veranlassen. „nicht ... töten wird“ bewahrt die Aussage ohne zusätzliche Festlegung.
  - severity: low
    issue: „Salomo wurde berichtet“ ist stilistisch schwerfällig.
    rationale: „Man berichtete Salomo“ ist modernes Standarddeutsch und bildet die unbestimmte berichtende Instanz des hebräischen Passivs ohne Bedeutungsverlust ab.
