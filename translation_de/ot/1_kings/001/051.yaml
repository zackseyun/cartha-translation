revisions:
- from: 'Salomo wurde berichtet: »Adonija hat Angst vor König Salomo. Er hält sich an den Hörnern des Altars fest und sagt: ›König Salomo soll mir heute schwören, dass er seinen Diener nicht mit dem Schwert töten lässt.‹«'
  to: 'Man berichtete Salomo: »Siehe, Adonija fürchtet König Salomo; siehe, er hält sich an den Hörnern des Altars fest und sagt: ›König Salomo soll mir heute schwören, dass er seinen Diener nicht mit dem Schwert töten wird.‹«'
  rationale: Die Revision glättet die deutsche Einleitung, erhält die zweimalige hebräische Hervorhebung mit einem im würdigen Bibelregister weiterhin verständlichen „Siehe“ und vermeidet bei יָמִית eine unnötige Festlegung auf eine befohlene Hinrichtung. Die syntaktische Verschachtelung der Meldung und der darin wiedergegebenen Bitte bleibt erhalten.
