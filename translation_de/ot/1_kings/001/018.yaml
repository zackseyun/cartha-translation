  text: וְ/עַתָּ֕ה הִנֵּ֥ה אֲדֹנִיָּ֖ה מָלָ֑ךְ וְ/עַתָּ֛ה אֲדֹנִ֥/י הַ/מֶּ֖לֶךְ לֹ֥א יָדָֽעְתָּ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/018.yaml
  text: And now, look, Adonijah has become king, and now, my lord the king, you do not know it.
translation:
  language: de
  text: 'Und nun, sieh: Adonija ist König geworden, und nun weißt du es nicht, mein Herr, o König.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Gibt die zeitliche und zugleich folgernde Wendung natürlich wieder.
- source_word: הִנֵּה
  choice: sieh
  rationale: Bewahrt das aufmerksamkeitslenkende Element des hebräischen Ausdrucks in knapper, würdiger Form.
- source_word: מָלָךְ
  choice: ist König geworden
  rationale: Der Kontext verlangt hier den Eintritt in beziehungsweise die Beanspruchung der Königsherrschaft, nicht bloß eine andauernde Regierung.
- source_word: לֹא יָדָעְתָּ
  choice: ohne dass du … davon weißt
  rationale: Natürliches modernes Deutsch; das Pronomen „davon“ nimmt Adonijas Königwerden auf.
theological_decisions:
- issue: Status von Adonijas Königsherrschaft
  choice: „ist König geworden“
  alternative: „ist König“ / „herrscht als König“
  rationale: Die Formulierung wahrt Batsebas Darstellung, ohne ausdrücklich zu entscheiden, ob Adonijas Königtum rechtmäßig oder dauerhaft ist.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die doppelte hebräische Wendung וְעַתָּה wird syntaktisch gebündelt, um im Deutschen eine schwerfällige Wiederholung zu vermeiden; die Anrede „mein Herr und König“ bleibt respektvoll und eindeutig.
