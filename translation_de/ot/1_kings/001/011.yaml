id: 1KI.1.11
reference: 1 Kings 1:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר נָתָ֗ן אֶל בַּת שֶׁ֤בַע אֵם שְׁלֹמֹה֙ לֵ/אמֹ֔ר הֲ/ל֣וֹא שָׁמַ֔עַתְּ כִּ֥י מָלַ֖ךְ אֲדֹנִיָּ֣הוּ בֶן חַגִּ֑ית וַ/אֲדֹנֵ֥י/נוּ דָוִ֖ד לֹ֥א יָדָֽע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/011.yaml
  text: Then Nathan said to Bathsheba[a], Solomon’s mother, “Have you not heard that Adonijah son of Haggith has become king, and our lord David does not know it?”
translation:
  language: de
  text: 'Da sagte Nathan zu Batseba, Salomos Mutter: „Hast du nicht gehört, dass Adonija, der Sohn Haggits, König geworden ist[a] und unser Herr David nichts davon weiß?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sich zum König gemacht hat“. Wörtlich kann das Hebräische „ist König geworden“ oder „herrscht als König“ bedeuten. Der Zusammenhang kann eine eigenmächtige Erhebung andeuten, doch die Formulierung sagt dies hier nicht ausdrücklich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw mit der Erzählform führt die Handlung weiter; „Da sagte“ gibt die zeitliche Abfolge in natürlichem deutschem Erzählstil wieder.
- source_word: בַּת שֶׁבַע
  choice: Batseba
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: אֵם שְׁלֹמֹה
  choice: Salomos Mutter
  rationale: Die hebräische Status-constructus-Verbindung wird knapp und idiomatisch wiedergegeben.
- source_word: לֵאמֹר
  choice: nicht eigens wiedergegeben
  rationale: Die hebräische Redeeinleitungsformel ist im Deutschen durch „sagte“ und die direkte Rede bereits ausgedrückt.
- source_word: הֲלוֹא שָׁמַעַתְּ
  choice: Hast du nicht gehört
  rationale: Die Formulierung bewahrt die rhetorische Frage, die eine bestätigende Antwort erwartet.
- source_word: מָלַךְ
  choice: König geworden ist
  rationale: Das Verb bezeichnet hier das Königwerden beziehungsweise den Antritt der Herrschaft. Diese Wiedergabe wahrt den Ereignischarakter, ohne ausdrücklich zu behaupten, Adonija habe sich selbst zum König gemacht.
- source_word: אֲדֹנִיָּהוּ בֶן חַגִּית
  choice: Adonija, der Sohn Haggits
  rationale: Die Namen folgen etablierten deutschen Formen; die Filiationsangabe wird im Deutschen durch Apposition natürlich ausgedrückt.
- source_word: וַאֲדֹנֵינוּ דָוִד
  choice: und unser Herr David
  rationale: „Herr“ bewahrt die höfische Ehrenbezeichnung für den König; der verbindende Satzbau folgt dem Hebräischen.
- source_word: לֹא יָדָע
  choice: nichts davon weiß
  rationale: Die hebräische Perfektform bezeichnet hier einen gegenwärtigen Kenntnisstand. „Davon“ macht den im Hebräischen aus dem Zusammenhang erschlossenen Bezug im Deutschen deutlich.
theological_decisions:
- issue: Wiedergabe von אֲדֹנֵינוּ als menschliche Ehrenbezeichnung
  choice: unser Herr David
  alternative: unser Gebieter David
  rationale: Das Wort bezeichnet hier David als königlichen Herrn und nicht Gott. „Herr“ erhält den höfischen Rangtitel, ohne eine göttliche Identifikation nahezulegen.
- issue: Deutung von מָלַךְ bei Adonijas Herrschaftsantritt
  choice: König geworden ist
  alternative: sich zum König gemacht hat
  rationale: Der Kontext kann eigenmächtige Selbsterhöhung nahelegen, doch das Verb selbst formuliert dies nicht ausdrücklich. Die Hauptübersetzung erhält diese Spannung; die stärker deutende Möglichkeit steht in der Fußnote.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die direkte Rede bleibt knapp und eindringlich; der menschliche Hoheitstitel „Herr“ wird ohne konfessionelle Zusatzdeutung verwendet.
