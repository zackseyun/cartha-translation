source:
  edition: WLC
  text: כַּ/אֲשֶׁ֨ר הָיָ֤ה יְהוָה֙ עִם אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ כֵּ֖ן יהי עִם שְׁלֹמֹ֑ה וִֽ/יגַדֵּל֙ אֶת כִּסְא֔/וֹ מִ֨/כִּסֵּ֔א אֲדֹנִ֖/י הַ/מֶּ֥לֶךְ דָּוִֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/037.yaml
  text: Just as Yahweh has been with my lord the king[a], so may he be with Solomon and make his throne greater than the throne of my lord King David.
translation:
  language: de
  text: Wie Jahwe mit meinem Herrn, dem König, gewesen ist, so sei er[a] mit Salomo und mache dessen Thron größer als der Thron meines Herrn, des Königs David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »so sei Jahwe mit Salomo«. Im Hebräischen ist das Subjekt der Wunschform nicht ausdrücklich genannt; es bezieht sich auf Jahwe im vorhergehenden Satzteil.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: Wie ... so
  rationale: Die deutsche Korrelativkonstruktion bewahrt den Vergleich zwischen Jahwes Beistand für David und dem Wunsch für Salomo.
- source_word: הָיָה ... עִם
  choice: mit ... gewesen ist
  rationale: Das Perfekt blickt auf Jahwes bisherigen Beistand zurück; die Formulierung lässt zugleich dessen fortdauernde Bedeutung erkennen.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: mein Herr, der König
  rationale: Dies gibt die höfische Ehrenbezeichnung samt Königstitel würdevoll und verständlich wieder.
- source_word: יהי
  choice: so sei er
  rationale: Der Jussiv drückt einen Wunsch beziehungsweise Segen aus; das unausgesprochene Subjekt verweist auf Jahwe im vorhergehenden Satzteil.
- source_word: וִיגַדֵּל
  choice: und mache ... größer
  rationale: Die Kausativform von גדל bedeutet hier, etwas groß beziehungsweise größer zu machen; die folgende מן-Konstruktion verlangt einen Vergleich.
- source_word: כִּסְאוֹ
  choice: dessen Thron
  rationale: Das konkrete Bild des Thrones bleibt erhalten. »Dessen« vermeidet im Deutschen eine mögliche falsche Zuordnung des Pronomens zu Jahwe.
- source_word: מִכִּסֵּא
  choice: größer als den Thron
  rationale: Die Präposition מן kennzeichnet nach גדל den Vergleich und wird im Deutschen idiomatisch mit »größer als« ausgedrückt.
- source_word: אֲדֹנִי הַמֶּלֶךְ דָּוִד
  choice: mein Herr, der König David
  rationale: Die Wiedergabe erhält sowohl Benajas ehrerbietige Bezeichnung Davids als auch dessen Namen und Königstitel.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm; »Jahwe« bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Subjekt des Jussivs יהי
  choice: Das Pronomen »er« verweist auf Jahwe
  alternative: 'Den Namen ausdrücklich wiederholen: »so sei Jahwe mit Salomo«'
  rationale: Im Hebräischen bleibt das Subjekt unausgesprochen, wird aber aus dem vorhergehenden Satzteil erschlossen. Die Übersetzung bewahrt diesen Textfluss, ohne die Bezugnahme zu verdecken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die höfische Redeweise wird beibehalten; zugleich werden unnötig altertümliche Formen vermieden.
