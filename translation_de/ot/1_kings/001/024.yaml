base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/024.yaml
  text: Then Nathan said[a], “My lord the king, have you said, ‘Adonijah will reign after me, and he will sit on my throne’?”
translation:
  language: de
  text: 'Da sagte Nathan: „Mein Herr, König, hast du gesagt: ‚Adonija wird nach mir regieren, und er wird auf meinem Thron sitzen‘?“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sagtest du“. Das hebräische Perfekt kann in dieser Frage im Deutschen sowohl mit Perfekt als auch mit Präteritum wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das narrative Waw führt die Handlung weiter; „Da sagte“ gibt die zeitliche Abfolge in natürlichem modernem Deutsch wieder.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: Mein Herr und König
  rationale: Die höfische Anrede an David wahrt sowohl den persönlichen Ehrentitel als auch den Königstitel und klingt im Deutschen natürlich.
- source_word: אַתָּה אָמַרְתָּ
  choice: hast du gesagt
  rationale: Das hebräische Perfekt steht hier in einer Frage danach, ob David eine entsprechende Anordnung getroffen hat. Das deutsche Perfekt gibt dies idiomatisch wieder; auch das Präteritum ist möglich.
- source_word: אֲדֹנִיָּהוּ
  choice: Adonija
  rationale: Der Personenname wird nach gängiger deutscher Bibeltradition wiedergegeben.
- source_word: יִמְלֹךְ
  choice: soll ... König sein
  rationale: Im Zusammenhang der Thronfolge kann das Verb sowohl das Königtum als auch die in Davids angeblicher Aussage verfügte Nachfolge ausdrücken. „Soll König sein“ klingt als zitierte königliche Festlegung natürlich.
- source_word: אַחֲרָי
  choice: nach mir
  rationale: Die knappe Formulierung bewahrt den unmittelbaren Sinn der Nachfolge, ohne „nach meinem Tod“ ausdrücklich einzutragen.
- source_word: וְהוּא יֵשֵׁב עַל כִּסְאִי
  choice: und auf meinem Thron sitzen
  rationale: Die konkrete königliche Bildsprache des Hebräischen bleibt erhalten; das Subjekt ist im Deutschen aus dem ersten Teilsatz eindeutig.
theological_decisions:
- issue: Frage oder Feststellung in אַתָּה אָמַרְתָּ
  choice: 'Als Frage wiedergegeben: „hast du gesagt“'
  alternative: 'Als erstaunte Feststellung: „Du hast also gesagt“'
  rationale: Der Kontext und die traditionelle Akzentuierung sprechen für Nathans höfische Nachfrage, ohne vorwegzunehmen, dass David die Anordnung tatsächlich erlassen hat.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die höfische Hofsprache wird verständlich wiedergegeben, während die knappe Thronfolgeformel und das Bild vom Sitzen auf dem Thron erhalten bleiben.
