    issue: „soll ... König sein“ für יִמְלֹךְ
    rationale: Die Formulierung kann im Deutschen eine Sollensforderung bzw. einen Befehl ausdrücken. Der hebräische yiqtol bezeichnet hier die zukünftige Herrschaft/Thronfolge; „wird ... regieren“ bewahrt dies ohne hinzugefügte Modalität.
  - severity: low
    issue: Ausdrückliches Subjekt im zweiten Teilsatz ausgelassen
    rationale: Das Deutsche kann das Subjekt zwar tilgen, aber וְהוּא („und er“) ist im Ausgangstext ausdrücklich gesetzt. „Und er wird ...“ erhält die Parallelität und den Nachdruck ohne unnatürlich zu wirken.
