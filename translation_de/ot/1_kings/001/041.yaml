  to: 'Adonija und alle geladenen Gäste, die bei ihm waren, hörten es, als sie gerade mit dem Essen fertig wurden.[a] Als Joab den Klang des Schofars[b] hörte, sagte er: »Warum ist so viel Lärm in der Stadt?«'
