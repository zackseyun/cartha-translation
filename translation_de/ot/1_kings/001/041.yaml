  naturalness: Modernes Standarddeutsch und würdiger Erzählstil. »Schall des Schofars« ist möglich, aber »den Klang des Schofars« ist idiomatischer. »als sie gerade mit dem Essen fertig wurden« ist natürlich, wahrt aber die zeitliche Nuance.
  terminology: Adonija und Joab sind gebräuchliche deutsche Namensformen. »Schofar« ist ein passender etablierter kulturgeschichtlicher Begriff; die Fußnote erklärt ihn ausreichend. »Lärm in der Stadt« bildet die hebräische Wortverbindung genauer und bleibt natürlich.
