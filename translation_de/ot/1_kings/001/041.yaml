base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/041.yaml
  text: Adonijah and all the invited guests who were with him heard it as they finished eating[a]. And when Joab heard the sound of the trumpet, he said[b], “Why is the sound of the city in an uproar?”
translation:
  language: de
  text: 'Adonija und alle geladenen Gäste, die bei ihm waren, hörten es, als sie gerade mit dem Essen fertig wurden.[a] Als Joab den Klang des Schofars[b] hörte, sagte er: »Warum ist so viel Lärm in der Stadt?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »als sie mit dem Essen fertig waren«. Der hebräische Satz kann entweder den Abschluss des Essens oder den Augenblick bezeichnen, in dem sie gerade fertig wurden.'
    reason: lexical_alternative
  - marker: b
    text: Ein Schofar ist ein Horn, das unter anderem als Signalinstrument verwendet wurde.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: hörten es
  rationale: Das Verb bedeutet »hören«; das im Deutschen ergänzte Objekt »es« verweist aus dem Zusammenhang auf den Lärm der Feier.
- source_word: הַקְּרֻאִים
  choice: geladenen Gäste
  rationale: Das passive Partizip von קרא bezeichnet hier im Festmahlkontext die Eingeladenen; »geladene Gäste« ist natürlich und präzise.
- source_word: וְהֵם כִּלּוּ לֶאֱכֹל
  choice: als sie gerade mit dem Essen fertig wurden
  rationale: Die Wendung ordnet das Hören zeitlich dem Abschluss des Essens zu und lässt offen, ob dieser eben eintrat oder bereits vollzogen war.
- source_word: קוֹל הַשּׁוֹפָר
  choice: den Schall des Schofars
  rationale: שׁוֹפָר bezeichnet das als Signal- und Kultinstrument verwendete Horn. »Schofar« ist im modernen Deutschen etabliert und bewahrt die kulturelle Eigenart des Instruments.
- source_word: מַדּוּעַ
  choice: Warum
  rationale: Direkte und natürliche Wiedergabe der Fragepartikel.
- source_word: קוֹל הַקִּרְיָה הוֹמָה
  choice: Warum ist die Stadt so in Aufruhr?
  rationale: Die deutsche Formulierung gibt den lärmenden, unruhigen Zustand der Stadt idiomatisch wieder, ohne den Grund des Tumults vorwegzunehmen.
- source_word: אֲדֹנִיָּהוּ
  choice: Adonija
  rationale: Im Deutschen gebräuchliche biblische Namensform.
- source_word: יוֹאָב
  choice: Joab
  rationale: Im Deutschen gebräuchliche biblische Namensform.
