base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/002.yaml
  text: So his servants said to him[a], “Let them seek for my lord the king a young virgin woman, and let her attend the king and be his caregiver, and let her lie in your bosom[c][b], so that my lord the king may be warm.”
translation:
  language: de
  text: 'Da sagten seine Diener zu ihm: »Man soll für meinen Herrn, den König, eine junge Frau suchen, die noch Jungfrau ist. Sie soll dem König zu Diensten stehen[a] und seine Pflegerin[b] sein. Sie soll an deiner Brust liegen[c], damit meinem Herrn, dem König, warm wird.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »vor dem König stehen«; die hebräische Wendung kann den Dienst vor einer ranghöheren Person bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Betreuerin« beziehungsweise »Dienerin«. Das seltene hebräische Wort bezeichnet hier offenbar eine Person, die jemanden versorgt.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »in deinem Schoß«. Das hebräische Wort bezeichnet Brust, Schoß oder den körpernahen Bereich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדָיו
  choice: seine Diener
  rationale: Im königlichen Hofkontext bezeichnet עבד hier am ehesten Diener oder Bedienstete; »Diener« ist natürlich und legt keinen rechtlichen Sklavenstatus fest.
- source_word: יְבַקְשׁוּ
  choice: Man soll ... suchen
  rationale: Der Imperfekt der 3. Person Plural hat hier auffordernden Sinn. Die unpersönliche deutsche Form gibt den Vorschlag idiomatisch wieder, ohne ein im Hebräischen nicht ausdrücklich genanntes »wir« einzuführen.
- source_word: לַאדֹנִי הַמֶּלֶךְ
  choice: für meinen Herrn, den König
  rationale: Bewahrt die höfische Anrede mit Possessivform und die Apposition »der König«.
- source_word: נַעֲרָה בְתוּלָה
  choice: eine junge Frau ..., die noch Jungfrau ist
  rationale: Die Wiedergabe macht sowohl נַעֲרָה, eine junge Frau, als auch בְתוּלָה, Jungfrau, ausdrücklich sichtbar und klingt im Deutschen natürlicher als »eine junge jungfräuliche Frau«.
- source_word: וְעָמְדָה לִפְנֵי הַמֶּלֶךְ
  choice: Sie soll dem König zu Diensten stehen
  rationale: Die Wendung bedeutet wörtlich »vor dem König stehen«, bezeichnet im höfischen Zusammenhang aber den Dienst vor ihm. Die gewählte Form bewahrt Bild und Funktion.
- source_word: סֹכֶנֶת
  choice: Pflegerin
  rationale: Das seltene Wort bezeichnet hier offenbar eine Frau, die den alten König versorgt. »Pflegerin« passt zum unmittelbaren Kontext, ohne eine sexuelle Funktion in den Begriff hineinzulesen.
- source_word: וְשָׁכְבָה בְחֵיקֶךָ
  choice: Sie soll an deiner Brust liegen
  rationale: חֵיק bezeichnet Brust, Schoß oder den engsten Körperbereich. »An deiner Brust« bewahrt die konkrete körperliche Nähe und ist im Deutschen verständlich.
- source_word: וְחַם לַאדֹנִי הַמֶּלֶךְ
  choice: damit meinem Herrn, dem König, warm wird
  rationale: Die deutsche Zweckkonstruktion gibt den beabsichtigten Erfolg der vorherigen Maßnahmen klar wieder.
