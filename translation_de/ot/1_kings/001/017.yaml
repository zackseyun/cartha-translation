  text: וַ/תֹּ֣אמֶר ל֗/וֹ אֲדֹנִ/י֙ אַתָּ֨ה נִשְׁבַּ֜עְתָּ בַּֽ/יהוָ֤ה אֱלֹהֶ֨י/ךָ֙ לַֽ/אֲמָתֶ֔/ךָ כִּֽי שְׁלֹמֹ֥ה בְנֵ֖/ךְ יִמְלֹ֣ךְ אַחֲרָ֑/י וְ/ה֖וּא יֵשֵׁ֥ב עַל כִּסְאִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/017.yaml
  text: She said to him, “My lord, you swore by the LORD your God to your female servant, ‘Surely Solomon your son will reign after me, and he will sit on my throne.’”
translation:
  language: de
  text: 'Sie sagte zu ihm: »Mein Herr, du hast deiner Dienerin beim HERRN, deinem Gott, geschworen: ›Ganz gewiss wird dein Sohn Salomo nach mir König sein, und er wird auf meinem Thron sitzen.‹«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנִי
  choice: mein Herr
  rationale: Wahrt die respektvolle Anrede Batsebas an den König in natürlichem, würdigem Deutsch.
- source_word: לַאֲמָתֶךָ
  choice: deiner Dienerin
  rationale: Gibt die demütige Selbstbezeichnung im höfischen Kontext idiomatisch wieder; das grammatische Femininum ist im Deutschen durch »Dienerin« erhalten.
- source_word: כִּי
  choice: ganz gewiss
  rationale: Gibt hier die bekräftigende Funktion der Partikel in der zitierten Schwurformel wieder, ohne den Inhalt weiter auszudeuten.
- source_word: יִמְלֹךְ
  choice: wird … König sein
  rationale: Drückt die königliche Herrschaft im Deutschen natürlich aus; im Zusammenhang bezeichnet das Verb Salomos Nachfolge als König.
- source_word: יֵשֵׁב עַל כִּסְאִי
  choice: wird auf meinem Thron sitzen
  rationale: Bewahrt das konkrete Thronbild und die parallele Satzstruktur des Hebräischen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: HERR
  alternative: JHWH / Jahwe
  rationale: Folgt der etablierten deutschsprachigen Bibelkonvention, den Gottesnamen durch »HERR« in Kapitälchen wiederzugeben, ohne eine unsichere Aussprache festzulegen.
- issue: Nachdruck der Schwuraussage durch כִּי
  choice: Ganz gewiss
  alternative: unübersetzt lassen oder »dass«
  rationale: Der Kontext einer direkten Schwurformel stützt eine bekräftigende Wiedergabe; sie erhält den Nachdruck des Ausgangstextes, ohne eine zusätzliche theologische Aussage einzuführen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem höfischem Ton. Die direkte und die darin eingebettete Rede werden klar durch deutsche Anführungszeichen unterschieden; Satzbau und Bildsprache bleiben nahe am Hebräischen.
