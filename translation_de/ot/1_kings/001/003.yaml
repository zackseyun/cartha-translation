source:
  edition: WLC
  text: וַ/יְבַקְשׁוּ֙ נַעֲרָ֣ה יָפָ֔ה בְּ/כֹ֖ל גְּב֣וּל יִשְׂרָאֵ֑ל וַֽ/יִּמְצְא֗וּ אֶת אֲבִישַׁג֙ הַ/שּׁ֣וּנַמִּ֔ית וַ/יָּבִ֥אוּ אֹתָ֖/הּ לַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/003.yaml
  text: So they searched throughout all the territory of Israel for a beautiful young woman[b][a], and they found Abishag the Shunammite and brought her to the king.
translation:
  language: de
  text: Da suchten sie im ganzen Gebiet Israels nach einer schönen jungen Frau. Sie fanden Abischag, die Schunemiterin,[a] und brachten sie zum König.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: eine Frau aus Schunem.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיְבַקְשׁוּ
  choice: Da suchten sie
  rationale: בקשׁ bezeichnet hier die gezielte Suche; „suchten“ gibt den fortlaufenden Erzählstil natürlich wieder.
- source_word: נַעֲרָה יָפָה
  choice: eine schöne junge Frau
  rationale: נַעֲרָה bezeichnet eine junge weibliche Person, hier dem Kontext nach eine junge Frau; יָפָה beschreibt ihre Schönheit unmittelbar.
- source_word: בְּכֹל גְּבוּל יִשְׂרָאֵל
  choice: im ganzen Gebiet Israels
  rationale: גְּבוּל meint hier das gesamte Territorium und nicht nur die Grenzlinie. Die deutsche Formulierung ist präzise und idiomatisch.
- source_word: וַיִּמְצְאוּ
  choice: Sie fanden
  rationale: Die schlichte Erzählform entspricht dem gewöhnlichen Sinn von מצא.
- source_word: אֲבִישַׁג הַשּׁוּנַמִּית
  choice: Abischag, die Schunemiterin
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben; das Gentilizium bewahrt die Herkunftsbezeichnung des Hebräischen.
- source_word: וַיָּבִאוּ אֹתָהּ לַמֶּלֶךְ
  choice: und brachten sie zum König
  rationale: Die Hifilform von בוא bedeutet hier „bringen“; לַמֶּלֶךְ bezeichnet das Ziel.
