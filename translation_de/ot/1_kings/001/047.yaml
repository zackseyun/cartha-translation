  text: וְ/גַם בָּ֜אוּ עַבְדֵ֣י הַ/מֶּ֗לֶךְ לְ֠/בָרֵךְ אֶת אֲדֹנֵ֜י/נוּ הַ/מֶּ֣לֶךְ דָּוִד֮ לֵ/אמֹר֒ יֵיטֵ֨ב אלהי/ך אֶת שֵׁ֤ם שְׁלֹמֹה֙ מִ/שְּׁמֶ֔/ךָ וִֽ/יגַדֵּ֥ל אֶת כִּסְא֖/וֹ מִ/כִּסְאֶ֑/ךָ וַ/יִּשְׁתַּ֥חוּ הַ/מֶּ֖לֶךְ עַל הַ/מִּשְׁכָּֽב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/047.yaml
  text: And the king’s servants also came to bless our lord King David[a], saying, ‘May your God make Solomon’s name better than your name[b], and may he make his throne greater than your throne.’ And the king bowed himself on the bed.
translation:
  language: de
  text: 'Auch die Diener des Königs kamen, um unserem Herrn, König David, Segenswünsche zu überbringen. Sie sagten: »Dein Gott lasse Salomos Namen deinen Namen übertreffen[a] und seinen Thron größer sein als deinen Thron!« Da verneigte sich der König auf dem Bett[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit »Name« ist hier auch Ruf oder Ansehen gemeint.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Da betete der König auf dem Bett an.« Das hebräische Verb kann sowohl eine Verneigung als auch Anbetung bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: Auch
  rationale: Gibt die anknüpfende und hinzufügende Funktion im Deutschen natürlich wieder.
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: die Diener des Königs
  rationale: Bezeichnet im höfischen Zusammenhang königliche Bedienstete beziehungsweise Amtsträger, ohne ihren genauen Status enger festzulegen.
- source_word: לְבָרֵךְ
  choice: Glück und Segen zu wünschen
  rationale: Im Kontext handelt es sich um einen feierlich ausgesprochenen Segenswunsch. Die Wendung ist im modernen Deutschen klarer als das missverständliche »David zu segnen« und bewahrt dennoch den Segenscharakter.
- source_word: אֶת אֲדֹנֵינוּ הַמֶּלֶךְ דָּוִד
  choice: unserem Herrn, König David
  rationale: Bewahrt die höfische Ehrenbezeichnung und setzt den Königstitel als Apposition natürlich ins Deutsche um.
- source_word: יֵיטֵב אֱלֹהֶיךָ אֶת שֵׁם שְׁלֹמֹה מִשְּׁמֶךָ
  choice: Dein Gott mache Salomos Namen angesehener als deinen Namen
  rationale: Der Hifil von יטב hat hier kausative Bedeutung; »angesehener« erschließt den mit »Name« verbundenen Sinn von Ruf und Ansehen, während das Quellbild »Name« erhalten bleibt.
- source_word: וִיגַדֵּל אֶת כִּסְאוֹ מִכִּסְאֶךָ
  choice: und seinen Thron größer als deinen Thron
  rationale: Bewahrt sowohl die Steigerung als auch das politische und dynastische Bild des Thrones.
- source_word: וַיִּשְׁתַּחוּ הַמֶּלֶךְ
  choice: Da verneigte sich der König
  rationale: Das Verb kann eine körperliche Verneigung oder anbetende Niederwerfung bezeichnen. Diese Wiedergabe wahrt die im Vers nicht ausdrücklich aufgelöste Mehrdeutigkeit möglichst weitgehend.
- source_word: עַל הַמִּשְׁכָּב
  choice: auf dem Bett
  rationale: Entspricht der konkreten Ortsangabe, ohne ein im Hebräischen nicht ausdrücklich gesetztes Possessivpronomen hinzuzufügen.
theological_decisions:
- issue: Bezeichnet וַיִּשְׁתַּחוּ ausdrücklich Anbetung oder eine körperliche Verneigung?
  choice: »Da verneigte sich der König« im Haupttext
  alternative: »Da betete der König auf dem Bett an«
  rationale: Das hebräische Verb kann je nach Zusammenhang Verneigung oder Anbetung ausdrücken. Weil in diesem Satz kein ausdrückliches Bezugsobjekt genannt wird, legt der Haupttext die Handlung nicht enger fest; die mögliche kultische Bedeutung wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt feierlich, aber verständlich. »Glück und Segen wünschen« vermeidet die im heutigen Deutsch mögliche Fehlvorstellung, die Diener verliehen David selbst göttlichen Segen. Sämtliche Fußnotenmarker stehen im Haupttext.
