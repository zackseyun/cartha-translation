  text: וְ/לֹֽא עֲצָב֨/וֹ אָבִ֤י/ו מִ/יָּמָי/ו֙ לֵ/אמֹ֔ר מַדּ֖וּעַ כָּ֣כָה עָשִׂ֑יתָ וְ/גַם ה֤וּא טֽוֹב תֹּ֨אַר֙ מְאֹ֔ד וְ/אֹת֥/וֹ יָלְדָ֖ה אַחֲרֵ֥י אַבְשָׁלֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/006.yaml
  text: His father had never displeased him at any time by saying[a], “Why have you done thus?” He was also very handsome[b], and his mother had borne him after Absalom.
translation:
  language: de
  text: 'Sein Vater hatte ihm sein Leben lang nie Verdruss bereitet, indem er zu ihm sagte: »Warum hast du das getan?« Auch er war sehr schön von Gestalt, und seine Mutter hatte ihn nach Absalom geboren.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲצָבוֹ
  choice: ihn … gekränkt
  rationale: Das Verb עצב kann im Hifil bedeuten, jemandem Schmerz, Kummer oder Verdruss zu bereiten. »Gekränkt« wahrt diese Bedeutung, während der folgende Fragesatz erkennen lässt, dass David Adonija nie zurechtwies oder zur Rede stellte.
- source_word: מִיָּמָיו
  choice: sein Leben lang nie
  rationale: Wörtlich »von seinen Tagen«; zusammen mit der Verneinung bezeichnet die Wendung keinen einzigen Zeitpunkt in seinem bisherigen Leben.
- source_word: לֵאמֹר
  choice: indem er fragte
  rationale: לֵאמֹר führt den Inhalt der unterlassenen Äußerung ein. Da die direkte Rede eine Frage ist, klingt »indem er fragte« im Deutschen natürlich.
- source_word: מַדּוּעַ כָּכָה עָשִׂיתָ
  choice: Warum hast du das getan?
  rationale: Die Formulierung gibt die direkte, kritische Nachfrage in natürlichem modernem Deutsch wieder; »das« entspricht hier idiomatisch ככה.
- source_word: טוֹב תֹּאַר מְאֹד
  choice: sah er sehr gut aus
  rationale: Die Wendung bezeichnet ein sehr ansprechendes körperliches Erscheinungsbild. Die verbale Formulierung ist natürlich und vermeidet eine unnötig technische Wiedergabe wie »von sehr schöner Gestalt«.
- source_word: וְאֹתוֹ יָלְדָה
  choice: seine Mutter hatte ihn … geboren
  rationale: Das feminine Verb enthält ein unausgesprochenes weibliches Subjekt. »Seine Mutter« macht den im Kontext notwendigen Bezug im Deutschen klar, ohne zusätzliche Sachinformation einzuführen.
- source_word: אַחֲרֵי אַבְשָׁלוֹם
  choice: nach Absalom
  rationale: 'Die Wendung bezeichnet am natürlichsten die Geburtsreihenfolge: Adonija wurde nach Absalom geboren.'
