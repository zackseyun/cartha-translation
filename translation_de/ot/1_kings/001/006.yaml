  source_fidelity: 'Die Grundstruktur und der Sinn des Hebräischen sind getroffen: väterliches Unterlassen einer korrigierenden Ansprache, Adonijas auffällige körperliche Erscheinung und seine Geburt nach Absalom. »Gekränkt« kann jedoch im heutigen Deutsch stärker eine persönliche Beleidigung oder Verletzung bezeichnen und ist für עֲצָבוֹ in diesem elterlich-korrigierenden Zusammenhang weniger treffend als eine Formulierung mit »Verdruss bereiten«.'
  naturalness: »… gekränkt, indem er fragte« wirkt semantisch und syntaktisch etwas unglücklich, weil die Frage wie die Art einer Kränkung klingt. »… Verdruss bereitet, indem er zu ihm sagte« gibt die hebräische Konstruktion natürlicher wieder. »Er war sehr schön von Gestalt« ist ein idiomatischer erzählerischer Ausdruck und wahrt den Bezug auf körperliche Erscheinung.
  terminology: Die Namen David, Adonija und Absalom sind korrekt. Die Fußnote soll die lexikalische Spannweite erläutern, ohne »zurechtgewiesen« als zwingende Hauptbedeutung auszugeben.
