  revised_text: 'Sein Vater hatte ihm sein Leben lang nie Verdruss bereitet, indem er zu ihm sagte: »Warum hast du das getan?« Auch er war sehr schön von Gestalt, und seine Mutter hatte ihn nach Absalom geboren.'
