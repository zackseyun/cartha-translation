  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die etwas ungewohnte Aussage über das Kränken bleibt nahe an der semantischen Breite des Hebräischen; die Fußnote erläutert die im Zusammenhang gemeinte unterlassene väterliche Korrektur.
