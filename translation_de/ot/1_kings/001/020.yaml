source:
  edition: WLC
  text: וְ/אַתָּה֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ עֵינֵ֥י כָל יִשְׂרָאֵ֖ל עָלֶ֑י/ךָ לְ/הַגִּ֣יד לָ/הֶ֔ם מִ֗י יֵשֵׁ֛ב עַל כִּסֵּ֥א אֲדֹנִֽ/י הַ/מֶּ֖לֶךְ אַחֲרָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/020.yaml
  text: And you[a], my lord the king, the eyes of all Israel are on you[b], to tell them who will sit on the throne of my lord the king after him.
translation:
  language: de
  text: 'Und du, mein Herr und König: Auf dich sind die Augen von ganz Israel gerichtet, damit du ihnen mitteilst, wer nach ihm auf dem Thron meines Herrn, des Königs, sitzen wird.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַתָּה
  choice: Doch auf dich
  rationale: Das vorangestellte Pronomen ist betont; zusammen mit dem folgenden Satz ergibt sich im Deutschen natürlich „Doch auf dich …“. Das וְ führt den Gedanken im Kontext weiter und kann hier leicht kontrastierend wiedergegeben werden.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: mein Herr und König
  rationale: Die höfische Anrede verbindet die ehrerbietige Bezeichnung „mein Herr“ mit dem Königstitel. „Mein Herr und König“ klingt im modernen Deutschen würdig und natürlich; bei der zweiten Nennung ist die Form grammatisch in den Genitivzusammenhang eingebunden.
- source_word: עֵינֵי כָל יִשְׂרָאֵל עָלֶיךָ
  choice: auf dich sind die Augen ganz Israels gerichtet
  rationale: Die hebräische Bildsprache wird bewahrt und zugleich in eine geläufige deutsche Wendung gefasst. Sie bezeichnet gespannte Aufmerksamkeit und Erwartung.
- source_word: לְהַגִּיד לָהֶם
  choice: damit du ihnen mitteilst
  rationale: Der Hifil-Infinitiv von נגד bezeichnet das Bekanntmachen einer Information. Die finale Wiedergabe mit „damit“ macht den Bezug der Erwartung an den König im Deutschen klar.
- source_word: מִי יֵשֵׁב
  choice: wer … sitzen soll
  rationale: Im Zusammenhang der noch ausstehenden königlichen Bestimmung drückt „sitzen soll“ die erwartete Festlegung angemessener aus als eine rein vorhersagende Zukunftsform, ohne einen zusätzlichen theologischen Akzent einzutragen.
- source_word: עַל כִּסֵּא
  choice: auf dem Thron
  rationale: כִּסֵּא bezeichnet hier eindeutig den Königsthron; עַל wird idiomatisch mit „auf“ wiedergegeben.
- source_word: אַחֲרָיו
  choice: nach dir
  rationale: Das Suffix der dritten Person bezieht sich sachlich auf den unmittelbar angesprochenen König David. Da direkte Rede im Deutschen bei gleichbleibendem Adressaten die zweite Person verlangt, ist „nach dir“ die natürliche referenztreue Wiedergabe.
theological_decisions:
- issue: Bezug des Pronomens in אַחֲרָיו
  choice: „nach dir“, das heißt nach König David
  alternative: „nach ihm“ oder unpersönlich „danach“
  rationale: Die Form trägt ein maskulines singularisches Personalsuffix und verweist im Kontext auf den König. In der direkten deutschen Anrede ist ein Wechsel zu „ihm“ unnatürlich und könnte einen anderen Referenten nahelegen; „nach dir“ bewahrt den eindeutigen Bezug auf David sowie den Sinn der Thronfolge.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrter hebräischer Augen-Metapher. Die höfische Anrede bleibt erkennbar, ohne altertümliche Formen wie „o König“ oder „soll thronen“ zu verwenden. Keine Fußnote ist nötig, weil der Pronomenbezug im Kontext klar ist und im Deutschen durch „nach dir“ sachgerecht ausgedrückt wird.
