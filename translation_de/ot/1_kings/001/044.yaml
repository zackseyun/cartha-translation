  text: וַ/יִּשְׁלַ֣ח אִתּֽ/וֹ הַ֠/מֶּלֶךְ אֶת צָד֨וֹק הַ/כֹּהֵ֜ן וְ/אֶת נָתָ֣ן הַ/נָּבִ֗יא וּ/בְנָיָ֨הוּ֙ בֶּן יְה֣וֹיָדָ֔ע וְ/הַ/כְּרֵתִ֖י וְ/הַ/פְּלֵתִ֑י וַ/יַּרְכִּ֣בוּ אֹת֔/וֹ עַ֖ל פִּרְדַּ֥ת הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/044.yaml
  text: And the king sent with him Zadok the priest[a], Nathan the prophet, Benaiah son of Jehoiada, and the Cherethites and the Pelethites; and they mounted him on the king’s mule.
translation:
  language: de
  text: Und der König sandte mit ihm den Priester Zadok, den Propheten Nathan, Benaja, den Sohn Jojadas, sowie die Keretiter und die Peletiter. Sie ließen ihn auf der Maultierstute des Königs[a] reiten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder allgemeiner: „auf dem Maultier des Königs“. Das hebräische Wort bezeichnet hier ein weibliches Maultier.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח אִתּוֹ הַמֶּלֶךְ
  choice: Und der König sandte mit ihm
  rationale: Die Verbform führt die Erzählung in der Vergangenheit fort; אִתּוֹ bezeichnet die Begleitung. Die hebräische Wortstellung wird in natürliches modernes Deutsch überführt.
- source_word: צָדוֹק הַכֹּהֵן
  choice: den Priester Zadok
  rationale: Die Apposition wird in idiomatischer deutscher Stellung wiedergegeben; der Titel bleibt ausdrücklich erhalten.
- source_word: נָתָן הַנָּבִיא
  choice: den Propheten Nathan
  rationale: נָבִיא wird direkt mit „Prophet“ übersetzt; die deutsche Appositionsstellung ist natürlich und würdevoll.
- source_word: בְּנָיָהוּ בֶּן יְהוֹיָדָע
  choice: Benaja, den Sohn Jojadas
  rationale: Der hebräische Vatersname wird transparent wiedergegeben; die eingebürgerte deutsche Namensform „Benaja“ wird verwendet.
- source_word: הַכְּרֵתִי וְהַפְּלֵתִי
  choice: die Keretiter und die Peletiter
  rationale: Die Bezeichnungen werden als Gruppennamen transliteriert, statt ihre Herkunft oder Funktion deutend festzulegen.
- source_word: וַיַּרְכִּבוּ אֹתוֹ
  choice: Sie ließen ihn … reiten
  rationale: Der Hifil von רכב ist kausativ. „Sie ließen ihn reiten“ gibt diesen Sinn im Deutschen klarer und natürlicher wieder als das missverständliche „sie ritten ihn“.
- source_word: עַל פִּרְדַּת הַמֶּלֶךְ
  choice: auf der Maultierstute des Königs
  rationale: פִּרְדָּה ist die feminine Bezeichnung für ein Maultier. „Maultierstute“ bewahrt diese Spezifizierung, ohne sie für die Auslegung weiter auszudeuten.
