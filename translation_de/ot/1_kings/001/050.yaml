  source_fidelity: 'Der Entwurf gibt die Abfolge und die wesentlichen Begriffe des Hebräischen grundsätzlich zutreffend wieder: Adonijas Furcht vor Salomo, das Aufstehen, Gehen und Ergreifen der Hörner des Altars. Das einleitende וַ („und“) trägt jedoch keinen ausdrücklich adversativen Sinn, sodass „aber“ einen nicht ausgedrückten Kontrast einführt. Außerdem ist „sich an den Hörnern ... festhalten“ im Deutschen weniger präzise als das transitive Ergreifen der Hörner und kann das bloße Sich-Festhalten zur Stütze nahelegen.'
  naturalness: Die vorgeschlagene Fassung ist modernes, würdiges Standarddeutsch. „Da stand er auf“ bildet die hebräische Erzählfolge idiomatisch ab. „Ergriff die Hörner des Altars“ ist klar, natürlich und bewahrt die konkrete Handlung.
  terminology: „Adonija“, „Salomo“, „Hörner des Altars“ und „Heiligtum“ sind passende etablierte deutsche Bibel- und Kulttermini. Die Fußnote erläutert die kulturelle Bedeutung, ohne sie in den Haupttext einzutragen oder eine bestimmte rechtliche bzw. theologische Deutung festzulegen.
  issues:
