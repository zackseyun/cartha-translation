base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/050.yaml
  text: And Adonijah was afraid because of Solomon[a], so he arose and went and took hold of the horns of the altar.
translation:
  language: de
  text: Adonija fürchtete sich vor Salomo. Da stand er auf, ging hin und ergriff die Hörner des Altars.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Ergreifen der Hörner des Altars war eine Geste, mit der man am Heiligtum Zuflucht oder Gnade suchte.
    reason: cultural_note
lexical_decisions:
- source_word: יָרֵא מִפְּנֵי
  choice: fürchtete sich vor
  rationale: Die Verbindung bezeichnet hier Salomo als Anlass beziehungsweise Gegenstand von Adonijas Furcht. Die deutsche Wendung ist natürlich und gibt sowohl das Verb als auch die Präposition wieder.
- source_word: וַיָּקָם
  choice: stand er auf
  rationale: Natürliche Wiedergabe des erzählenden Bewegungsverbs im modernen Standarddeutsch.
- source_word: וַיֵּלֶךְ
  choice: ging hin
  rationale: Gibt die anschließende Bewegung knapp wieder, ohne ein im Hebräischen nicht genanntes Ziel zu ergänzen.
- source_word: וַיַּחֲזֵק בְּ
  choice: hielt sich an … fest
  rationale: Die Konstruktion bezeichnet ein kräftiges Ergreifen beziehungsweise Festhalten; im Zusammenhang ist dies idiomatischer als eine gewaltsam klingende Formulierung.
- source_word: קַרְנוֹת הַמִּזְבֵּחַ
  choice: den Hörnern des Altars
  rationale: Bewahrt die konkrete kultische Bezeichnung für die hornartigen Vorsprünge an den Altarecken.
- source_word: וַאֲדֹנִיָּהוּ
  choice: Adonija aber
  rationale: Der Name folgt der gebräuchlichen deutschen biblischen Form. Das einleitende Waw markiert hier den Fortgang mit einem neuen Handlungsträger; „aber“ bildet den Kontrast zum vorausgehenden Geschehen natürlich ab.
theological_decisions:
- issue: Zuflucht- oder Gnadengesuch am Altar
  choice: Die körperliche Handlung wird wörtlich als Festhalten an den Hörnern des Altars wiedergegeben.
  alternative: „Er floh zum Altar, um Schutz zu suchen.“
  rationale: Der hebräische Text nennt nur die Handlung. Ihre kulturelle Bedeutung wird in einer Fußnote erklärt, ohne sie deutend in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kurzen Erzählverben bleiben klar und flüssig; der kultische Ausdruck „Hörner des Altars“ wird nicht paraphrasiert.
