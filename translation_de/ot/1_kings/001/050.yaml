  - severity: low
    issue: Reflexives „hielt sich an den Hörnern ... fest“
    rationale: Die hebräische Form bezeichnet das kräftige Ergreifen bzw. Festhalten der Hörner. Die transitive Formulierung „ergriff die Hörner“ ist im Deutschen unmittelbarer und näher an der beschriebenen Handlung.
  revised_text: Adonija fürchtete sich vor Salomo. Da stand er auf, ging hin und ergriff die Hörner des Altars.[a]
