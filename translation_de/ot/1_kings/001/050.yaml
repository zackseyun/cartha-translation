- from: Adonija aber fürchtete sich vor Salomo. Deshalb stand er auf, ging hin und hielt sich an den Hörnern des Altars fest.[a]
  to: Adonija fürchtete sich vor Salomo. Da stand er auf, ging hin und ergriff die Hörner des Altars.[a]
  rationale: Die Revision entfernt den unbegründeten adversativen Akzent von „aber“ und ersetzt das reflexive Festhalten durch „ergriff“, das die konkrete hebräische Handlung präziser wiedergibt. Die kultische Handlung und ihre vorsichtige kulturelle Erläuterung bleiben erhalten.
