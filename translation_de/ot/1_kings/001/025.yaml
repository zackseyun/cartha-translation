base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/025.yaml
  text: For he has gone down today and sacrificed oxen[a], fattened calves, and sheep in abundance, and he has invited all the king’s sons, the commanders of the army, and Abiathar the priest. And look, they are eating and drinking before him, and they are saying[b], ‘Long live King Adonijah!’
translation:
  language: de
  text: 'Denn er ist heute hinabgegangen und hat Rinder, Mastvieh[a] und Schafe in großer Zahl geopfert. Er hat alle Söhne des Königs, die Heerführer und den Priester Abjatar eingeladen. Und sieh: Sie essen und trinken vor ihm und rufen: »Es lebe König Adonija!«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet gemästetes Vieh; die genaue Tierart und das Alter bleiben offen.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Es lebe der König Adonija!“ Gemeint ist der übliche Huldigungsruf für einen König.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Warnung beziehungsweise Meldung ein, ohne den Zusammenhang stärker festzulegen.
- source_word: יָרַד הַיּוֹם
  choice: ist heute hinabgegangen
  rationale: Bewahrt die Richtungsangabe des Verbs יָרַד und gibt die kürzlich vollzogene, für die Gegenwart relevante Handlung im natürlichen deutschen Perfekt wieder.
- source_word: וַיִּזְבַּח
  choice: hat … geopfert
  rationale: זבח bezeichnet hier das kultische Schlachten im Rahmen eines Opfermahls; „geopfert“ wahrt diesen Sinn.
- source_word: שׁוֹר וּמְרִיא וְצֹאן
  choice: Rinder, Mastvieh und Schafe
  rationale: Die Sammelbezeichnungen werden im Deutschen natürlich wiedergegeben. „Mastvieh“ wahrt die Unbestimmtheit von מְרִיא hinsichtlich Tierart und Alter besser als „Mastkälber“.
- source_word: לָרֹב
  choice: in großer Zahl
  rationale: Gibt den Gedanken einer außergewöhnlich großen Menge klar und idiomatisch wieder.
- source_word: וַיִּקְרָא לְ
  choice: hat … eingeladen
  rationale: קרא mit ל bezeichnet hier im Zusammenhang des Festmahls das Herbeirufen beziehungsweise Einladen von Gästen.
- source_word: שָׂרֵי הַצָּבָא
  choice: die Heerführer
  rationale: Bezeichnet die militärischen Befehlshaber und ist zugleich knapp, verständlich und dem erzählerischen Register angemessen.
- source_word: וְהִנָּם
  choice: Und sieh nur
  rationale: Gibt den aufmerksamkeitslenkenden, gegenwartsbezogenen Charakter der Partikel wieder, ohne das veraltete „siehe“ zu verwenden.
- source_word: יְחִי הַמֶּלֶךְ אֲדֹנִיָּהוּ
  choice: Es lebe König Adonija!
  rationale: Die feste deutsche Akklamationsformel entspricht idiomatisch dem hebräischen Wunsch „Der König möge leben, Adonija“.
theological_decisions:
- issue: Adonijas Königstitel in der Akklamation
  choice: „König Adonija“ ohne relativierenden Zusatz
  alternative: „Adonija, der König“ oder eine Kennzeichnung als selbsternannter König
  rationale: Der hebräische Wortlaut gibt die Akklamation seiner Anhänger unmittelbar wieder. Eine erklärende Relativierung würde die erzählerische Spannung um die umstrittene Thronfolge vorzeitig auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Perfekt entspricht dem mündlichen Bericht über unmittelbar vorausgegangene Handlungen; der Wechsel ins Präsens bei „essen und trinken“ bewahrt die im Hebräischen hervorgehobene gegenwärtige Szene. Kurze Sätze vermeiden eine schwerfällige Kettenkonstruktion.
