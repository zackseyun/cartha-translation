  source_fidelity: Der deutsche Text gibt die beiden femininen Imperative idiomatisch als „Geh … hinein“ wieder und bewahrt die Aufforderung, David aufzusuchen. Die rhetorische Frage הֲלֹא, der feierliche Schwur, Salomos Nachfolge und Thronbesteigung sowie die folgernde Frage nach Adonijas bereits eingetretenem Königtum sind zutreffend wiedergegeben. „ist … König geworden“ wahrt die perfektische Aussage, ohne die Legitimität von Adonijas Anspruch vorwegzunehmen.
