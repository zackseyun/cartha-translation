source:
  edition: WLC
  text: לְכִ֞י וּ/בֹ֣אִי אֶל הַ/מֶּ֣לֶךְ דָּוִ֗ד וְ/אָמַ֤רְתְּ אֵלָי/ו֙ הֲ/לֹֽא אַתָּ֞ה אֲדֹנִ֣/י הַ/מֶּ֗לֶךְ נִשְׁבַּ֤עְתָּ לַ/אֲמָֽתְ/ךָ֙ לֵ/אמֹ֔ר כִּֽי שְׁלֹמֹ֤ה בְנֵ/ךְ֙ יִמְלֹ֣ךְ אַחֲרַ֔/י וְ/ה֖וּא יֵשֵׁ֣ב עַל כִּסְאִ֑/י וּ/מַדּ֖וּעַ מָלַ֥ךְ אֲדֹנִיָֽהוּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/013.yaml
  text: Please go in to King David and say to him[a], ‘My lord the king, did you not swear to your servant, saying, “Solomon your son shall reign after me, and he shall sit on my throne”? Why then has Adonijah become king?’
translation:
  language: de
  text: 'Geh zum König David hinein und sag zu ihm: »Mein Herr und König, hast du deiner Dienerin[a] nicht geschworen: ›Dein Sohn Salomo soll nach mir König sein, und er soll auf meinem Thron sitzen‹? Warum ist dann Adonija König geworden?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »deiner Magd«. Das hebräische Wort ist feminin und dient Batseba hier als ehrerbietige Selbstbezeichnung gegenüber dem König.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכִי וּבֹאִי
  choice: Geh … hinein
  rationale: Die beiden femininen Singularimperative bedeuten wörtlich etwa »geh und tritt ein«. Die deutsche Wendung bewahrt Bewegung und Eintritt, ohne unnötig schwerfällig zu wirken.
- source_word: אֶל הַמֶּלֶךְ דָּוִד
  choice: zum König David
  rationale: Die Verbindung von Titel und Eigenname wird im modernen Deutschen natürlich als »König David« wiedergegeben.
- source_word: וְאָמַרְתְּ אֵלָיו
  choice: und sag zu ihm
  rationale: Die hebräische Fortsetzung des Imperativs wird im Deutschen idiomatisch ebenfalls imperativisch ausgedrückt.
- source_word: הֲלֹא
  choice: hast du … nicht
  rationale: Die Partikel leitet eine rhetorische Frage ein, die Zustimmung erwartet; das Perfekt passt zum bereits geleisteten Schwur.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: Mein Herr und König
  rationale: Die Formulierung gibt die ehrerbietige höfische Anrede an einen menschlichen Herrscher natürlich wieder. Das verbindende »und« entspricht idiomatischem Deutsch, ohne zwei verschiedene Personen anzudeuten.
- source_word: נִשְׁבַּעְתָּ
  choice: geschworen
  rationale: Das Verb bezeichnet ausdrücklich einen feierlichen Schwur und nicht lediglich ein gewöhnliches Versprechen.
- source_word: לַאֲמָתְךָ
  choice: deiner Dienerin
  rationale: Das hebräische Substantiv ist ausdrücklich feminin und bezeichnet Batsebas ehrerbietige Selbstbezeichnung vor dem König.
- source_word: לֵאמֹר כִּי
  choice: 'geschworen:'
  rationale: Die Infinitivformel führt den Inhalt des Schwurs ein; ein Doppelpunkt gibt dies im Deutschen knapp und natürlich wieder. כִּי wird hier nicht unnötig mit einem zusätzlichen verstärkenden Wort überladen.
- source_word: שְׁלֹמֹה בְנֵךְ
  choice: Dein Sohn Salomo
  rationale: Diese Wortstellung ist im Deutschen natürlicher als »Salomo, dein Sohn« und bewahrt die familiäre Bestimmung.
- source_word: יִמְלֹךְ אַחֲרַי
  choice: soll nach mir König sein
  rationale: Die Wendung bringt sowohl das Königtum als auch die zeitliche Thronfolge zum Ausdruck; »soll« passt zum zitierten Schwur.
- source_word: וְהוּא יֵשֵׁב עַל כִּסְאִי
  choice: und er soll auf meinem Thron sitzen
  rationale: Die wörtliche Thronbesteigungsformel ist auch im Deutschen klar und verständlich.
- source_word: וּמַדּוּעַ מָלַךְ אֲדֹנִיָהוּ
  choice: Warum ist dann Adonija König geworden?
  rationale: »Dann« bringt den folgernden Bezug auf den Schwur zur Geltung. Das hebräische Perfekt bezeichnet hier Adonijas erfolgte beziehungsweise beanspruchte Königsherrschaft.
theological_decisions:
- issue: Status von Adonijas Königtum
  choice: ist … König geworden
  alternative: herrscht … als König
  rationale: Die Übersetzung wahrt die Aussage des hebräischen Perfekts, ohne theologisch oder politisch zu entscheiden, ob Adonijas Anspruch rechtmäßig oder dauerhaft war.
translation_notes:
  register: Moderne, würdige Standardsprache mit natürlicher höfischer Anrede. Die direkte Rede wird übersichtlich verschachtelt; der feminine Bezug der Imperative und der Selbstbezeichnung Batsebas bleibt erhalten.
