  terminology: „König David“, „Dienerin“, „Salomo“, „Thron“ und „Adonija“ sind angemessen und konsistent. Die Fußnote erläutert die feminine Form אֲמָתְךָ sachlich und korrekt, ohne über den Text hinauszugehen.
