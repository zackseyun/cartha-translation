base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/039.yaml
  text: Then Zadok the priest took the horn of oil from the tent and anointed Solomon[a]. Then they blew the ram’s horn, and all the people said[b], “Long live King Solomon!”
translation:
  language: de
  text: 'Da nahm der Priester Zadok das Ölhorn aus dem Zelt[b] und salbte Salomo. Dann bliesen sie das Schofarhorn[a], und das ganze Volk rief: »Es lebe König Salomo!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sie stießen ins Schofar“. Ein Schofar ist ein Horninstrument, meist aus einem Widderhorn gefertigt; sinngemäß auch: „sie bliesen die Trompete“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „aus der Stiftshütte“. Im Hebräischen steht einfach „aus dem Zelt“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Da nahm
  rationale: Gibt die fortschreitende Erzählfolge des Wayyiqtol natürlich wieder; „nahm“ entspricht der Grundbedeutung von לקח.
- source_word: צָדוֹק הַכֹּהֵן
  choice: der Priester Zadok
  rationale: Natürliches modernes Deutsch für Name und Titel, ohne den appositionellen Sinn zu verändern.
- source_word: קֶרֶן הַשֶּׁמֶן
  choice: das Ölhorn
  rationale: Bewahrt das konkrete Bild eines aus Horn bestehenden Salbgefäßes und ist knapper und natürlicher als „das Horn mit dem Öl“.
- source_word: מִן הָאֹהֶל
  choice: aus dem Zelt
  rationale: אֹהֶל bedeutet wörtlich „Zelt“; die Wiedergabe vermeidet, den nicht ausdrücklich verwendeten Fachbegriff „Stiftshütte“ in den Haupttext einzutragen.
- source_word: וַיִּמְשַׁח
  choice: salbte
  rationale: משׁח ist das übliche Verb für die rituelle Salbung und bezeichnet hier die Einsetzung des Königs.
- source_word: וַיִּתְקְעוּ בַּשּׁוֹפָר
  choice: sie bliesen das Schofarhorn
  rationale: Die Formulierung bewahrt die Bezeichnung des spezifischen Horninstruments und macht durch „-horn“ dessen Art auch Lesenden verständlich, denen „Schofar“ nicht vertraut ist.
- source_word: כָּל הָעָם
  choice: das ganze Volk
  rationale: Direkte und idiomatische Wiedergabe des hebräischen Kollektivausdrucks.
- source_word: וַיֹּאמְרוּ
  choice: rief
  rationale: Wörtlich „sagte“; im Zusammenhang der öffentlichen Akklamation gibt „rief“ die kommunikative Funktion im Deutschen natürlich wieder. Der Singular stimmt mit dem Kollektivsubjekt „das ganze Volk“ überein.
- source_word: יְחִי הַמֶּלֶךְ שְׁלֹמֹה
  choice: Es lebe König Salomo!
  rationale: Die etablierte deutsche Akklamationsformel gibt den jussivischen Wunsch prägnant und idiomatisch wieder.
theological_decisions:
- issue: Bestimmtheit von הָאֹהֶל im Zusammenhang der Königssalbung
  choice: aus dem Zelt
  alternative: aus der Stiftshütte; aus dem heiligen Zelt
  rationale: Der hebräische Text verwendet das gewöhnliche Substantiv „Zelt“ mit Artikel. Obwohl wahrscheinlich ein Heiligtumszelt gemeint ist, wahrt der Haupttext die lexikalische Offenheit; die mögliche genauere Identifikation wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählfolge. „Ölhorn“ erhält das konkrete Ritualbild; „Schofarhorn“ verbindet sachliche Genauigkeit mit Verständlichkeit. Die Fußnotenmarker wurden gegenüber der englischen Vorlage an den inhaltlich jeweils richtigen Stellen gesetzt, da deren Zuordnung dort offenbar vertauscht ist.
