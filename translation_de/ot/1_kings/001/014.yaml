source:
  edition: WLC
  text: הִנֵּ֗ה עוֹדָ֛/ךְ מְדַבֶּ֥רֶת שָׁ֖ם עִם הַ/מֶּ֑לֶךְ וַ/אֲנִי֙ אָב֣וֹא אַחֲרַ֔יִ/ךְ וּ/מִלֵּאתִ֖י אֶת דְּבָרָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/014.yaml
  text: Look[a], while you are still speaking there with the king, I will come in after you and confirm your words.
translation:
  language: de
  text: Sieh, während du dort noch mit dem König redest, werde ich nach dir hereinkommen und deine Worte bestätigen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deine Worte vervollständigen“ beziehungsweise „ergänzen, was du sagst“. Die hebräische Wendung kann bedeuten, die Aussage eines anderen durch bestätigende Einzelheiten zu ergänzen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh
  rationale: Die hinweisende Partikel lenkt unmittelbar die Aufmerksamkeit auf den geplanten Ablauf; „Sieh“ ist knapp, gegenwärtig und würdevoll.
- source_word: עוֹדָךְ מְדַבֶּרֶת
  choice: während du … noch … redest
  rationale: Das Adverb mit femininem Suffix und das Partizip bezeichnen eine noch andauernde Handlung; die deutsche Nebensatzkonstruktion gibt dies natürlich wieder.
- source_word: שָׁם עִם הַמֶּלֶךְ
  choice: dort … mit dem König
  rationale: „Dort“ bewahrt die Ortsangabe, und „mit dem König“ entspricht der gewöhnlichen Bedeutung von עִם und passt zur Gesprächssituation.
- source_word: וַאֲנִי אָבוֹא אַחֲרַיִךְ
  choice: werde ich nach dir hereinkommen
  rationale: בוא bezeichnet hier im höfischen Kontext wahrscheinlich das Eintreten in die Gegenwart des Königs; „nach dir“ wahrt die zeitliche Abfolge.
- source_word: וּמִלֵּאתִי אֶת דְּבָרָיִךְ
  choice: und deine Worte bestätigen
  rationale: Die Wendung bedeutet hier, durch ergänzende Aussage die Worte der anderen Person zu vervollständigen beziehungsweise zu bekräftigen; „bestätigen“ gibt die Funktion im Kontext treffend wieder.
