base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/045.yaml
  text: And Zadok the priest and Nathan the prophet have anointed him king at Gihon[a], and they have come up from there rejoicing, and the city is in an uproar. That is the sound that you heard.
translation:
  language: de
  text: Der Priester Zadok und der Prophet Nathan haben ihn bei Gihon zum König gesalbt. Sie sind von dort freudig hinaufgezogen, und die Stadt ist in lautem Aufruhr.[a] Das ist der Lärm, den ihr gehört habt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Die Stadt hallte davon wider« oder: »Die Stadt geriet in Bewegung«. Das hebräische Verb bezeichnet eine lautstarke Erregung oder Unruhe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְשְׁחוּ אֹתוֹ
  choice: haben ihn … gesalbt
  rationale: משׁח bezeichnet im königlichen Kontext die Salbung zur Einsetzung in das Amt. Das deutsche Perfekt passt zur berichtenden Rede und zum gegenwärtig wahrnehmbaren Ergebnis.
- source_word: צָדוֹק הַכֹּהֵן וְנָתָן הַנָּבִיא
  choice: der Priester Zadok und der Prophet Nathan
  rationale: Die Titel werden in natürlicher deutscher Wortstellung vor die Eigennamen gesetzt.
- source_word: לְמֶלֶךְ
  choice: zum König
  rationale: Die Präposition לְ kennzeichnet hier das Amt, zu dem er gesalbt wurde; »zum König salben« ist die übliche deutsche Fügung.
- source_word: בְּגִחוֹן
  choice: an der Gihonquelle
  rationale: Gihon ist hier der als Quelle bekannte Ort der Salbung. Die Verdeutlichung macht den Ortsbezug für heutige Leser verständlich.
- source_word: וַיַּעֲלוּ מִשָּׁם שְׂמֵחִים
  choice: Dann sind sie von dort unter Jubel hinaufgezogen
  rationale: עלה bewahrt die räumliche Bewegung »hinaufziehen«; שְׂמֵחִים beschreibt ihre freudige Art und wird idiomatisch mit »unter Jubel« wiedergegeben.
- source_word: וַתֵּהֹם הַקִּרְיָה
  choice: die Stadt geriet in lauten Aufruhr
  rationale: הום vermittelt geräuschvolle Erregung oder tumultartige Bewegung. »Lauter Aufruhr« erhält sowohl den akustischen als auch den bewegten Aspekt.
- source_word: הוּא הַקּוֹל אֲשֶׁר שְׁמַעְתֶּם
  choice: Das ist der Lärm, den ihr gehört habt
  rationale: קוֹל kann Stimme, Schall, Geräusch oder Lärm bedeuten. Der unmittelbare Bezug auf den lauten Aufruhr legt hier »Lärm« nahe; die Anrede ist plural.
