base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/016.yaml
  text: Bathsheba bowed down and prostrated herself before the king[a], and the king said, “What do you want?”
translation:
  language: de
  text: 'Batseba verneigte sich tief und warf sich vor dem König nieder. Der König fragte: »Was möchtest du?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּקֹּד
  choice: verneigte sich tief
  rationale: קָדַד bezeichnet ein tiefes Beugen oder Verneigen. Die Wiedergabe bewahrt die körperliche Geste, ohne ein Knien vorauszusetzen.
- source_word: בַּת שֶׁבַע
  choice: Batseba
  rationale: Der Personenname wird in der im modernen deutschen Bibelgebrauch verbreiteten Form wiedergegeben.
- source_word: וַתִּשְׁתַּחוּ
  choice: warf sich … nieder
  rationale: Die Verbform von שׁחה bezeichnet hier eine tiefe Ehrerbietung bis zum Niederwerfen. Die Formulierung unterscheidet die zweite, stärkere Geste von der vorausgehenden Verneigung.
- source_word: לַמֶּלֶךְ
  choice: vor dem König
  rationale: Bei einer Ehrerbietung gibt לַמֶּלֶךְ den Bezug beziehungsweise die Ausrichtung der Geste auf den König an; im Deutschen ist »vor dem König« idiomatisch.
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: Der König fragte
  rationale: Wörtlich steht »der König sagte«. Da die folgende Äußerung eine Frage ist, gibt »fragte« die Sprechhandlung im natürlichen Deutschen präzise wieder.
- source_word: מַה לָּךְ
  choice: Was möchtest du?
  rationale: Die wörtlich elliptische Wendung »Was [ist] dir/für dich?« ist eine kontextabhängige Frage nach einem Anliegen oder Wunsch. Im höfischen Gespräch eröffnet »Was möchtest du?« Batsebas Bitte natürlich, ohne einen Vorwurf anzudeuten.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die zwei aufeinanderfolgenden Gesten der Ehrerbietung bleiben unterscheidbar; die idiomatische Frage des Königs wird knapp und höflich wiedergegeben.
