id: 1KI.1.9
reference: 1 Kings 1:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּזְבַּ֣ח אֲדֹנִיָּ֗הוּ צֹ֤אן וּ/בָקָר֙ וּ/מְרִ֔יא עִ֚ם אֶ֣בֶן הַזֹּחֶ֔לֶת אֲשֶׁר אֵ֖צֶל עֵ֣ין רֹגֵ֑ל וַ/יִּקְרָ֗א אֶת כָּל אֶחָי/ו֙ בְּנֵ֣י הַ/מֶּ֔לֶךְ וּ/לְ/כָל אַנְשֵׁ֥י יְהוּדָ֖ה עַבְדֵ֥י הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/009.yaml
  text: Adonijah sacrificed sheep[a], cattle, and fattened animals by the stone of Zoheleth, which is beside En-rogel, and he invited all his brothers, the king’s sons, and all the men of Judah[e][d][c][b], the king’s servants.
translation:
  language: de
  text: Adonija schlachtete Schafe, Rinder und Mastvieh als Opfer bei dem Stein Sohélet[a], der neben En-Rogel liegt. Er lud alle seine Brüder, die Söhne des Königs, sowie alle Männer von Juda, die Diener des Königs[b], ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sohélet ist ein Ortsname; seine genaue Bedeutung ist unsicher.
    reason: cultural_note
  - marker: b
    text: Mit den „Dienern des Königs“ können königliche Bedienstete, Gefolgsleute oder Amtsträger gemeint sein.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: schlachtete … als Opfer
  rationale: זבח bezeichnet hier die Schlachtung für ein Opfermahl. Die Formulierung wahrt sowohl den konkreten Vorgang als auch seinen kultischen Charakter.
- source_word: צֹאן
  choice: Schafe
  rationale: Das Kollektivwort kann Kleinvieh, also Schafe und Ziegen, bezeichnen. Im Deutschen ist „Schafe“ in dieser Aufzählung eine natürliche, traditionelle Wiedergabe, ohne die Tiergruppe unnötig technisch zu benennen.
- source_word: בָקָר
  choice: Rinder
  rationale: Das Wort bezeichnet Rindvieh kollektiv; „Rinder“ ist im Deutschen umfassender und natürlicher als „Ochsen“.
- source_word: מְרִיא
  choice: Mastvieh
  rationale: Der Ausdruck bezeichnet gemästete Tiere, ohne die Tierart sicher festzulegen. „Mastvieh“ bewahrt diese Unbestimmtheit besser als „Mastkälber“.
- source_word: עִם אֶבֶן הַזֹּחֶלֶת
  choice: bei dem Stein Sohélet
  rationale: עִם ist hier örtlich zu verstehen. Der Eigenname wird transliteriert und nicht aufgrund seiner unsicheren Etymologie übersetzt.
- source_word: עֵין רֹגֵל
  choice: En-Rogel
  rationale: Der bekannte Ortsname wird transliteriert; dadurch bleibt er als geografische Bezeichnung erkennbar.
- source_word: וַיִּקְרָא
  choice: lud … ein
  rationale: Im Zusammenhang mit dem Opfermahl bezeichnet das Rufen eine Einladung zur Teilnahme; „einladen“ gibt die beabsichtigte soziale Handlung natürlich wieder.
- source_word: אֶת כָּל אֶחָיו בְּנֵי הַמֶּלֶךְ
  choice: alle seine Brüder, die Söhne des Königs
  rationale: Die Apposition wird beibehalten und identifiziert die genannten Brüder ausdrücklich als Königssöhne.
- source_word: אַנְשֵׁי יְהוּדָה
  choice: alle Männer von Juda
  rationale: Die hebräische Wendung ist ausdrücklich maskulin und wird entsprechend wiedergegeben; „von Juda“ bezeichnet ihre Zugehörigkeit zum Gebiet bzw. Stamm Juda.
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: die Diener des Königs
  rationale: Die direkte Wiedergabe lässt offen, ob Hofbedienstete, Gefolgsleute oder königliche Amtsträger gemeint sind.
theological_decisions:
- issue: Bezugsverhältnis von עַבְדֵי הַמֶּלֶךְ
  choice: 'Apposition zu „alle Männer von Juda“: „alle Männer von Juda, die Diener des Königs“'
  alternative: 'Eine weitere, eigenständige eingeladene Gruppe: „und alle Männer von Juda und die Diener des Königs“'
  rationale: Im Hebräischen fehlt vor עַבְדֵי הַמֶּלֶךְ eine zusätzliche Konjunktion. Daher liegt die appositionelle Bestimmung näher, doch die genaue syntaktische Zuordnung bleibt auslegungsfähig.
- issue: Geschlechtsspezifische Wiedergabe von אַנְשֵׁי יְהוּדָה
  choice: Männer von Juda
  alternative: Leute aus Juda / Bevölkerung Judas
  rationale: אַנְשֵׁי ist grammatisch und lexikalisch maskulin. Eine geschlechtsneutrale Verallgemeinerung würde eine mögliche breitere soziale Referenz ausdrücken, aber die Form des Ausgangstextes weniger genau abbilden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Schlachtete … als Opfer“ vermeidet das im heutigen Deutsch teils missverständliche alleinstehende „opferte“ und macht den kultischen Vorgang klar. Die Akzentsetzung in „Sohélet“ unterstützt die Aussprache; En-Rogel folgt der geläufigen deutschen Namensform.
