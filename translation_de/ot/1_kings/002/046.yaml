base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/046.yaml
  text: Then the king commanded Benaiah son of Jehoiada[a], and he went out and struck him down, and he died. So the kingdom was established in the hand of Solomon.
translation:
  language: de
  text: Da gab der König Benaja, dem Sohn Jojadas, einen Befehl. Benaja ging hinaus, erschlug ihn, und dieser starb. So wurde die Königsherrschaft in Salomos Hand gefestigt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »So war die Königsherrschaft fest in Salomos Hand.« Sinngemäß auch: »So wurde die Königsherrschaft unter Salomos Herrschaft gefestigt.« Die hebräische Wendung »in der Hand« bezeichnet hier Herrschaft oder Kontrolle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו הַמֶּלֶךְ
  choice: Da befahl der König
  rationale: צוה bezeichnet einen verbindlichen Befehl. „Da“ gibt die fortlaufende und hier abschließende Erzählfolge natürlich wieder.
- source_word: בְּנָיָהוּ בֶן יְהוֹיָדָע
  choice: Benaja, dem Sohn Jojadas
  rationale: Die Namen werden in ihrer im Deutschen etablierten biblischen Form wiedergegeben; der Empfänger des Befehls steht idiomatisch im Dativ.
- source_word: וַיֵּצֵא
  choice: Der ging hinaus
  rationale: יצא bedeutet wörtlich „hinausgehen“. Das Pronomen nimmt eindeutig Benaja auf und wahrt die Handlungsfolge.
- source_word: וַיִּפְגַּע בּוֹ
  choice: erschlug Schimi
  rationale: פגע mit ב bezeichnet hier im Hinrichtungskontext einen tödlichen Schlag. Der im Hebräischen pronominal bezeichnete Schimi wird zur eindeutigen deutschen Referenz beim Namen genannt; „erschlug“ lässt die folgende Todesfeststellung weiterhin als eigenes Glied stehen.
- source_word: וַיָּמֹת
  choice: und dieser starb
  rationale: Die ausdrückliche Feststellung des Todes und die hebräische Abfolge von Tat und Ergebnis bleiben erhalten; „dieser“ verhindert, dass der Satz auf Benaja bezogen wird.
- source_word: וְהַמַּמְלָכָה נָכוֹנָה
  choice: So wurde das Königtum … gefestigt
  rationale: ממלכה kann das Königreich oder die Königsherrschaft bezeichnen; in diesem Kontext passt „Königtum“ zur gefestigten Herrschaft Salomos. Das Nifal von כון drückt Festigung beziehungsweise gesicherten Bestand aus.
- source_word: בְּיַד שְׁלֹמֹה
  choice: in Salomos Hand
  rationale: Die hebräische Metapher wird bewahrt und bezeichnet Herrschaft, Verfügung oder Kontrolle.
theological_decisions:
- issue: Bedeutung von הַמַּמְלָכָה
  choice: das Königtum
  alternative: das Königreich / die Königsherrschaft
  rationale: Der Schluss des Abschnitts beschreibt vor allem die nun gesicherte Königsherrschaft Salomos, ohne die Bedeutung auf ein bloßes Territorium zu verengen.
- issue: Metapher בְּיַד שְׁלֹמֹה
  choice: in Salomos Hand
  alternative: unter Salomos Herrschaft
  rationale: Die bildhafte Form des Hebräischen bleibt im Text stehen; die Fußnote erklärt ihren Herrschaftssinn, ohne die mögliche Nuance von Besitz und Kontrolle einseitig festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählfolge. Die traditionelle Metapher „in Salomos Hand“ bleibt erhalten und wird in der Fußnote erläutert. Zur Vermeidung einer missverständlichen Pronomenfolge wird Schimi, der aus dem Kontext bezeichnete Hingerichtete, ausdrücklich genannt.
