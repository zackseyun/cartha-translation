source:
  edition: WLC
  text: וְ/הֵשִׁיב֩ יְהוָ֨ה אֶת דָּמ֜/וֹ עַל רֹאשׁ֗/וֹ אֲשֶׁ֣ר פָּגַ֣ע בִּ/שְׁנֵֽי אֲ֠נָשִׁים צַדִּקִ֨ים וְ/טֹבִ֤ים מִמֶּ֨/נּוּ֙ וַ/יַּהַרְגֵ֣/ם בַּ/חֶ֔רֶב וְ/אָבִ֥/י דָוִ֖ד לֹ֣א יָדָ֑ע אֶת אַבְנֵ֤ר בֶּן נֵר֙ שַׂר צְבָ֣א יִשְׂרָאֵ֔ל וְ/אֶת עֲמָשָׂ֥א בֶן יֶ֖תֶר שַׂר צְבָ֥א יְהוּדָֽה־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/032.yaml
  text: 'And Yahweh will return his blood on his own head[a], because he struck down two men more righteous and better than he, and killed them with the sword while my father David did not know it: Abner son of Ner, commander of Israel’s army, and Amasa son of Jether, commander of Judah’s army.'
translation:
  language: de
  text: 'Yahweh wird seine Blutschuld auf seinen eigenen Kopf zurückfallen lassen[a], weil er zwei Männer, die gerechter und besser waren als er, überfallen und mit dem Schwert getötet hat, ohne dass mein Vater David davon wusste: Abner, den Sohn Ners, den Befehlshaber des Heeres Israels, und Amasa, den Sohn Jeters, den Befehlshaber des Heeres Judas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „sein Blut auf seinen Kopf zurückbringen“. Die hebräische Wendung meint, dass die Verantwortung für das vergossene Blut auf den Schuldigen zurückfällt.'
    reason: Das hebräische Blut-auf-dem-Kopf-Idiom ist bei rein wörtlicher Wiedergabe im Deutschen leicht missverständlich.
lexical_decisions:
- source_word: וְהֵשִׁיב יְהוָה
  choice: Yahweh aber wird … zurückfallen lassen
  rationale: Der Hifil von שוב bezeichnet hier das Zurückbringen beziehungsweise Vergelten. Die Formulierung bewahrt das hebräische Bild und klingt im Deutschen natürlich.
- source_word: דָּמוֹ עַל רֹאשׁוֹ
  choice: dessen Blutschuld auf seinen eigenen Kopf
  rationale: דָּם bezeichnet in diesem Zusammenhang nicht bloß eigenes Blut, sondern die Verantwortung für vergossenes Blut. „Blutschuld“ macht den Sinn verständlich; „auf seinen eigenen Kopf“ erhält das Bild des hebräischen Idioms.
- source_word: פָּגַע
  choice: überfallen
  rationale: Das Verb bezeichnet hier einen feindlichen Angriff auf die beiden Männer; die anschließende Aussage nennt ausdrücklich ihre Tötung.
- source_word: צַדִּקִים וְטֹבִים מִמֶּנּוּ
  choice: gerechter und besser waren als er
  rationale: Die beiden komparativen Wertungen werden ohne Abschwächung wiedergegeben. „Gerechter“ bewahrt den moralisch-rechtlichen Gehalt von צַדִּיק.
- source_word: וַיַּהַרְגֵם בַּחֶרֶב
  choice: mit dem Schwert getötet hat
  rationale: Direkte, moderne Wiedergabe der ausdrücklichen Tötung und des genannten Tatmittels.
- source_word: וְאָבִי דָוִד לֹא יָדָע
  choice: ohne dass mein Vater David davon wusste
  rationale: Das einleitende ו wird kontextuell als Umstandsangabe verstanden. „Davon“ verdeutlicht, dass David von den Taten nichts wusste.
- source_word: שַׂר צְבָא יִשְׂרָאֵל / שַׂר צְבָא יְהוּדָה
  choice: Heerführer Israels / Heerführer Judas
  rationale: „Heerführer“ ist eine knappe, verständliche Wiedergabe des militärischen Amtes; der Genitiv lässt offen, ob צבא als Heer oder Heeresdienst akzentuiert wird.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jahwe
  rationale: Der persönliche Gottesname wird als Name wiedergegeben und nicht durch einen Titel ersetzt. Die Form „Yahweh“ entspricht der vorgegebenen Editionspraxis.
- issue: Bedeutung der Wendung vom Blut auf dem Kopf
  choice: Göttliche Vergeltung der Blutschuld unter Bewahrung des Körperbildes
  alternative: sein Blut auf seinen Kopf zurückbringen
  rationale: Im Kontext geht es um die Verantwortung für von Joab vergossenes Blut. „Blutschuld“ verhindert das Missverständnis, es sei Joabs eigenes Blut gemeint, während „auf seinen eigenen Kopf“ das hebräische Bild erhält.
- issue: Davids Unkenntnis
  choice: David wusste von den Tötungen nichts
  alternative: David billigte die Tötungen nicht
  rationale: Der Text sagt ausdrücklich nur, dass David nicht wusste; eine Aussage über Billigung oder Beteiligung wird nicht zusätzlich in den Haupttext aufgenommen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt dem feierlichen Urteilsspruch angemessen, wird aber durch „davon“ und die appositionelle Namensfolge für heutige Leser verständlich gehalten.
