  naturalness: „Dessen Blutschuld“ ist im Zusammenhang unnötig distanziert und in Verbindung mit „seinen eigenen Kopf“ pronominal weniger glatt. „Seine Blutschuld“ stellt den Bezug einheitlich her. Das adversative „aber“ ist im hebräischen Text nicht eigens markiert und sollte nicht hinzugefügt werden. „Befehlshaber des Heeres“ ist im heutigen Standarddeutsch präziser als „Heerführer Israels/Judas“.
  terminology: „Yahweh“ folgt der Editionsvorgabe. „Blutschuld“ ist als sinnklärende Wiedergabe des idiomatischen „Blut auf dem Kopf“ angemessen, sofern die wörtliche Form in der Fußnote erhalten bleibt. „Befehlshaber des Heeres Israels/Judas“ gibt שַׂר־צָבָא konsistent wieder.
