revisions:
- from: 'Zum Priester Abjatar sagte der König: »Geh nach Anatot auf deine Felder! Denn du hast den Tod verdient[a]. Doch heute werde ich dich nicht hinrichten, weil du die Lade des Herrn JHWH vor meinem Vater David getragen und bei allem mitgelitten hast, was mein Vater erlitten hat.«'
  to: 'Zum Priester Abjatar sagte der König: »Geh nach Anatot auf deine Felder! Denn du hast den Tod verdient[a]. Doch heute werde ich dich nicht hinrichten, weil du die Lade des Herrn, Yahwehs, vor meinem Vater David getragen hast und weil du in allem mitgelitten hast, was mein Vater erlitten hat.«'
  rationale: Die Revision ersetzt die im Deutschen nicht lesbare Konsonantenschreibung »JHWH« durch »Yahweh« und gestaltet die abschließende Begründung natürlicher, ohne die Wiederholung von »mitgelitten/erlitten« oder den Umfang von »in allem« aufzugeben. Die Fußnotenmarke bleibt unmittelbar an der idiomatischen Wiedergabe von אִישׁ מָוֶת verankert.
