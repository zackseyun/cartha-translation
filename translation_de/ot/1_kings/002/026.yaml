base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/026.yaml
  text: And to Abiathar the priest the king said[a], “Go to Anathoth, to your field, for you are a man deserving death; but on this day I will not put you to death, because you carried the ark of the Lord GOD before David my father, and because you shared in all the affliction with which my father was afflicted.”
translation:
  language: de
  text: 'Zum Priester Abjatar sagte der König: »Geh nach Anatot auf deine Felder! Denn du hast den Tod verdient[a]. Doch heute werde ich dich nicht hinrichten, weil du die Lade des Herrn, Yahwehs, vor meinem Vater David getragen hast und weil du in allem mitgelitten hast, was mein Vater erlitten hat.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Du bist ein Mann des Todes«; eine hebräische Wendung für jemanden, der den Tod verdient oder der Hinrichtung verfallen ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנָתֹת
  choice: Anatot
  rationale: Der Ortsname wird in einer im Deutschen üblichen, hebräisch nahen Form wiedergegeben.
- source_word: עַל שָׂדֶיךָ
  choice: auf deine Felder
  rationale: Die konkrete landwirtschaftliche Bedeutung bleibt erhalten; im Zusammenhang wird Abjatar auf seinen Grundbesitz in Anatot verwiesen.
- source_word: אִישׁ מָוֶת
  choice: du hast den Tod verdient
  rationale: Die wörtliche Wendung »Mann des Todes« bezeichnet idiomatisch jemanden, der den Tod verdient beziehungsweise der Hinrichtung verfallen ist. Die verständliche Bedeutung steht im Haupttext, die Form des Hebräischen in der Fußnote.
- source_word: אֲמִיתֶךָ
  choice: ich werde dich nicht hinrichten
  rationale: Der Hifil von מות bedeutet hier, jemanden zu Tode zu bringen; »hinrichten« entspricht dem königlichen und rechtlichen Zusammenhang.
- source_word: נָשָׂאתָ אֶת אֲרוֹן אֲדֹנָי יְהוִה
  choice: du die Lade des Herrn JHWH ... getragen
  rationale: נשא bezeichnet das Tragen der Lade. »Herrn JHWH« bewahrt beide Bestandteile des hebräischen Gottestitels, ohne sie miteinander gleichzusetzen.
- source_word: לִפְנֵי דָוִד אָבִי
  choice: vor meinem Vater David
  rationale: »Vor« wahrt die räumliche beziehungsweise relationale Offenheit von לִפְנֵי, das sowohl »vor« als auch »in Gegenwart von« bezeichnen kann.
- source_word: הִתְעַנִּיתָ ... הִתְעַנָּה
  choice: bei allem mitgelitten hast, was mein Vater erlitten hat
  rationale: Die Wiedergabe bewahrt den Gleichklang der beiden hebräischen Formen und bringt Abjatars Anteilnahme an Davids Bedrängnissen natürlich zum Ausdruck.
- source_word: כִּי ... וְכִי
  choice: weil ... und
  rationale: Beide Aussagen begründen Salomos Begnadigung; im Deutschen genügt ein gemeinsames »weil« für die koordinierten Gründe.
theological_decisions:
- issue: Wiedergabe des zusammengesetzten Gottestitels אֲדֹנָי יְהוִה
  choice: der Herr JHWH
  alternative: der Herr Jahwe
  rationale: Die Wiedergabe hält sowohl den Titel אֲדֹנָי als auch den Eigennamen יהוה sichtbar. Die Konsonantenform JHWH vermeidet eine Festlegung auf eine bestimmte Aussprache des Gottesnamens.
- issue: Rechtliche Bedeutung von אִישׁ מָוֶת
  choice: du hast den Tod verdient
  alternative: du bist ein Mann des Todes
  rationale: Die Aussage bezeichnet Abjatar als todeswürdig, nicht bereits als tot. Die idiomatische Bedeutung wird verständlich ausgedrückt, während die Fußnote die wörtliche Form dokumentiert.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Rede ist klar und bestimmt; unnötig altertümliche Formulierungen werden vermieden. »Mitgelitten« erhält die persönliche Verbundenheit Abjatars mit Davids Bedrängnissen.
