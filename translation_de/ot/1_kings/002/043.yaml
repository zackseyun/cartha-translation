source:
  edition: WLC
  text: וּ/מַדּ֕וּעַ לֹ֣א שָׁמַ֔רְתָּ אֵ֖ת שְׁבֻעַ֣ת יְהוָ֑ה וְ/אֶת הַ/מִּצְוָ֖ה אֲשֶׁר צִוִּ֥יתִי עָלֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/043.yaml
  text: Why then have you not kept the oath of Yahweh and the command that I commanded you?[a][b]
translation:
  language: de
  text: Warum hast du dann den Eid bei Jahwe und das Gebot, das ich dir auferlegt habe, nicht gehalten?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „den Eid Jahwes“; gemeint sein kann der bei Jahwe beziehungsweise in seinem Namen geleistete Eid.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Hebräische lautet wörtlich etwa: „das Gebot, das ich auf dich geboten habe“; die Wendung bezeichnet ein Gebot, das jemandem auferlegt wurde. Möglich ist auch: „das Gebot, das ich dir gegeben habe“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַדּוּעַ
  choice: Warum … dann
  rationale: מַדּוּעַ fragt nach dem Grund; das vorangestellte וּ verbindet die Frage mit dem vorherigen Vorwurf und wird im Deutschen idiomatisch durch „dann“ wiedergegeben.
- source_word: שָׁמַרְתָּ
  choice: hast du … nicht gehalten
  rationale: שׁמר bedeutet hier „halten, beachten“. „Halten“ lässt sich im Deutschen sowohl auf einen Eid als auch auf ein Gebot beziehen und bewahrt den verpflichtenden Sinn.
- source_word: שְׁבֻעַת יְהוָה
  choice: den Eid bei Jahwe
  rationale: Die Konstruktverbindung kann missverständlich als ein von Jahwe geleisteter Eid verstanden werden. Im Kontext ist der unter Anrufung Jahwes geleistete Eid gemeint; „Eid bei Jahwe“ gibt diesen Sinn natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, um den im Hebräischen stehenden Eigennamen statt eines ersetzenden Titels abzubilden.
- source_word: הַמִּצְוָה
  choice: das Gebot
  rationale: מִצְוָה bezeichnet eine bindende Anordnung. „Gebot“ ist im Deutschen natürlich und wahrt das Gewicht der königlichen Weisung.
- source_word: אֲשֶׁר צִוִּיתִי עָלֶיךָ
  choice: das ich dir auferlegt habe
  rationale: צוה bezeichnet das Gebieten, während עַל die dem Angesprochenen auferlegte Verpflichtung hervorhebt. „Auferlegt“ bildet beides idiomatisch ab.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Zugehörigkeit beziehungsweise Bezug des Eides in שְׁבֻעַת יְהוָה
  choice: Eid bei Jahwe
  alternative: Eid Jahwes / Eid gegenüber Jahwe
  rationale: Der Kontext spricht für einen von Schimi unter Anrufung Jahwes geleisteten Eid, nicht für einen Eid, den Jahwe selbst geschworen hat. Die Fußnote hält die formale Mehrdeutigkeit der Konstruktverbindung sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede im Singular bleibt erhalten. „Eid bei Jahwe“ vermeidet eine im Deutschen naheliegende Fehlzuordnung des Schwörenden; die Fußnote dokumentiert die formale hebräische Wendung. Die beiden Fußnotenzeichen stehen unmittelbar am Satzende und sind im Haupttext vollständig vorhanden.
