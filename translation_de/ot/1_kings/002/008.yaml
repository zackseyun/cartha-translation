source:
  edition: WLC
  text: וְ/הִנֵּ֣ה עִ֠מְּ/ךָ שִֽׁמְעִ֨י בֶן גֵּרָ֥א בֶן הַ/יְמִינִי֮ מִ/בַּחֻרִים֒ וְ/ה֤וּא קִֽלְלַ֨/נִי֙ קְלָלָ֣ה נִמְרֶ֔צֶת בְּ/י֖וֹם לֶכְתִּ֣/י מַחֲנָ֑יִם וְ/הֽוּא יָרַ֤ד לִ/קְרָאתִ/י֙ הַ/יַּרְדֵּ֔ן וָ/אֶשָּׁ֨בַֽע ל֤/וֹ בַֽ/יהוָה֙ לֵ/אמֹ֔ר אִם אֲמִֽיתְ/ךָ֖ בֶּ/חָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/008.yaml
  text: And behold[a], with you is Shimei son of Gera, the Benjaminite from Bahurim, and he cursed me with a grievous curse on the day I went to Mahanaim. But he came down to meet me at the Jordan, and I swore to him by Yahweh, saying, ‘I will not put you to death with the sword.’
translation:
  language: de
  text: 'Und sieh: Bei dir ist Schimi, der Sohn Geras, der Benjaminiter aus Bahurim. Er verfluchte mich mit einem schweren Fluch an dem Tag, als ich nach Mahanajim ging. Doch er kam zum Jordan hinab, mir entgegen, und ich schwor ihm bei Jahwe: »Ich werde dich nicht mit dem Schwert töten.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Wenn ich dich mit dem Schwert töte …« Das ist eine verkürzte Schwurformel, die hier bedeutet: »Ich werde dich nicht mit dem Schwert töten.«'
    reason: Die Fußnote dokumentiert die formale Gestalt und Ellipse des hebräischen Schwurs, während der Haupttext dessen idiomatischen Sinn wiedergibt.
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Und sieh
  rationale: Bewahrt die aufmerksamkeitslenkende, deiktische Funktion von הִנֵּה in natürlichem, würdigem Gegenwartsdeutsch.
- source_word: עִמְּךָ
  choice: bei dir
  rationale: Bezeichnet Schimis Anwesenheit beziehungsweise seine Erreichbarkeit in Salomos Umfeld; »bei dir« ist im Deutschen idiomatischer als ein wörtliches »mit dir«.
- source_word: שִׁמְעִי בֶן גֵּרָא בֶן הַיְמִינִי
  choice: Schimi, der Sohn Geras, der Benjaminiter
  rationale: Gibt den Eigennamen und die Abstammung wieder und versteht הַיְמִינִי als Herkunftsbezeichnung aus dem Stamm Benjamin.
- source_word: מִבַּחֻרִים
  choice: aus Bahurim
  rationale: Die Präposition bezeichnet hier den Herkunftsort.
- source_word: קִלְלַנִי קְלָלָה נִמְרֶצֶת
  choice: verfluchte mich mit einem schweren Fluch
  rationale: Erhält die betonte figura etymologica des Hebräischen; »schwer« vermittelt die Heftigkeit, ohne die Art des Fluches unnötig festzulegen.
- source_word: בְּיוֹם לֶכְתִּי מַחֲנָיִם
  choice: an dem Tag, als ich nach Mahanajim ging
  rationale: Gibt die Zeitangabe und die gerichtete Bewegung klar und natürlich wieder.
- source_word: יָרַד לִקְרָאתִי הַיַּרְדֵּן
  choice: kam zum Jordan hinab, mir entgegen
  rationale: Bewahrt sowohl die Abwärtsbewegung von ירד als auch die Bedeutung von לקראתי; die deutsche Wortstellung vermeidet den missverständlichen Eindruck, er sei in den Fluss hinabgestiegen.
- source_word: וָאֶשָּׁבַע לוֹ בַיהוָה
  choice: ich schwor ihm bei Jahwe
  rationale: Gibt die Schwurformel direkt wieder und transliteriert den Gottesnamen יהוה als »Jahwe«.
- source_word: אִם אֲמִיתְךָ בֶּחָרֶב
  choice: Ich werde dich nicht mit dem Schwert töten
  rationale: אִם steht in einer verkürzten Schwurformel, deren ausgelassene Selbstverwünschung eine nachdrückliche Verneinung ausdrückt; die idiomatische Wiedergabe macht diesen Sinn verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; JHWH
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. »Jahwe« bewahrt den Eigennamen in einer im Deutschen geläufigen Form, ohne ihn durch einen Titel zu ersetzen.
- issue: Deutung der verkürzten Schwurformel אִם אֲמִיתְךָ בֶּחָרֶב
  choice: 'als ausdrückliche negative Zusage: »Ich werde dich nicht mit dem Schwert töten«'
  alternative: 'wörtlich: »Wenn ich dich mit dem Schwert töte …«'
  rationale: Die bedingte Form ist eine elliptische Schwurformel mit ausgelassener Selbstverwünschung. Eine rein wörtliche Wiedergabe wäre im modernen Deutsch unvollständig und könnte die beabsichtigte Verneinung verdecken; die Fußnote erhält die formale Besonderheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Und sieh« erhält den Aufmerksamkeitsruf ohne das altertümlichere »siehe«. Die Eigennamen folgen gebräuchlichen deutschen Bibelformen; die Syntax bleibt klar, während Wiederholung und Ernst des hebräischen Wortlauts soweit möglich bewahrt werden.
