source:
  edition: WLC
  text: אָנֹכִ֣י הֹלֵ֔ךְ בְּ/דֶ֖רֶךְ כָּל הָ/אָ֑רֶץ וְ/חָזַקְתָּ֖ וְ/הָיִ֥יתָֽ לְ/אִֽישׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/002.yaml
  text: I am going the way of all the earth. So be strong[a], and be a man,
translation:
  language: de
  text: Ich gehe den Weg aller Menschen. Sei also stark und erweise dich als Mann.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sei ein Mann« beziehungsweise »handle mannhaft«. Die hebräische Wendung verbindet das Mannsein mit mutigem und verantwortungsbewusstem Handeln.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי
  choice: Ich
  rationale: Das selbstständige Personalpronomen bezeichnet schlicht den Sprecher; eine besondere Hervorhebung durch »ich selbst« ist im Deutschen nicht erforderlich.
- source_word: הֹלֵךְ
  choice: gehe
  rationale: Das Qal-Partizip mit vorangestelltem Pronomen beschreibt den unmittelbar bevorstehenden Weg in den Tod. Das deutsche Präsens bewahrt das Bild, ohne den zeitlichen Aspekt zu überdeuten.
- source_word: בְּדֶרֶךְ כָּל הָאָרֶץ
  choice: den Weg, den alle Welt gehen muss
  rationale: Die hebräische Wendung bezeichnet bildhaft das Sterben als das gemeinsame Geschick aller Menschen. Die deutsche idiomatische Fassung bewahrt das Wegmotiv und macht dessen allgemeine Geltung verständlich.
- source_word: וְחָזַקְתָּ
  choice: Sei also stark
  rationale: Die mit וְ verbundene Perfektform hat hier auffordernde Bedeutung. »Also« gibt den Folgerungszusammenhang natürlich wieder.
- source_word: וְהָיִיתָ לְאִישׁ
  choice: und erweise dich als Mann
  rationale: Die Wendung ist an Salomo gerichtet und verbindet Mannsein mit bewährter Stärke und verantwortlichem Handeln. »Erweise dich als Mann« wahrt die konkrete männliche Bezeichnung und den handlungsbezogenen Unterton.
theological_decisions:
- issue: Geschlechtsspezifische Formulierung der Ermahnung
  choice: erweise dich als Mann
  alternative: sei ein Mann; handle mannhaft
  rationale: אִישׁ bezeichnet hier ausdrücklich einen Mann und richtet sich an Salomo. Die Übersetzung neutralisiert die Formulierung nicht, legt sie aber auch nicht auf moderne Geschlechterklischees fest; die Fußnote erläutert den kontextuellen Sinn von Mut und Verantwortung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Sterbensmetapher bleibt erhalten, wird jedoch idiomatisch als »den Weg, den alle Welt gehen muss« formuliert. Die Anrede ist knapp und feierlich.
