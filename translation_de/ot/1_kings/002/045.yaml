id: 1KI.2.45
reference: 1 Kings 2:45
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה בָּר֑וּךְ וְ/כִסֵּ֣א דָוִ֗ד יִהְיֶ֥ה נָכ֛וֹן לִ/פְנֵ֥י יְהוָ֖ה עַד עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/045.yaml
  text: But King Solomon will be blessed[a], and the throne of David will be established before Yahweh forever.
translation:
  language: de
  text: Aber König Salomo wird gesegnet sein[a], und Davids Thron wird vor Jahwe für immer fest stehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „König Salomo ist gesegnet.“ Die hebräische Prädikatsaussage kann als gegenwärtige Feststellung verstanden werden; der Zusammenhang erlaubt jedoch auch die zukunftsbezogene Wiedergabe im Haupttext.'
    reason: lexikalische und zeitliche Alternative
lexical_decisions:
- source_word: וְ/הַ/מֶּלֶךְ
  choice: Aber König
  rationale: Das וְ markiert im Zusammenhang den Gegensatz zu dem im vorherigen Vers angekündigten Gericht über Schimi; daher gibt „aber“ den Gedankengang natürlich wieder.
- source_word: שְׁלֹמֹה
  choice: Salomo
  rationale: Die im Deutschen übliche Form des Personennamens.
- source_word: בָּרוּךְ
  choice: wird gesegnet sein
  rationale: Das prädikative Adjektiv beziehungsweise passive Partizip bedeutet „gesegnet“. Neben dem folgenden zukunftsbezogenen יִהְיֶה trägt die Aussage hier wahrscheinlich prospektiven Charakter; die mögliche präsentische Lesart bleibt in der Fußnote erhalten.
- source_word: וְ/כִסֵּא דָוִד
  choice: und Davids Thron
  rationale: Die hebräische Genitivverbindung wird im Deutschen knapp und natürlich durch den vorangestellten Genitiv wiedergegeben.
- source_word: יִהְיֶה נָכוֹן
  choice: wird fest stehen
  rationale: Die Verbindung bezeichnet einen gefestigten, sicheren Bestand. „Fest stehen“ ist im Deutschen idiomatisch und bewahrt das Bild des dauerhaft bestehenden Thrones.
- source_word: לִ/פְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי bedeutet „vor“ beziehungsweise „in der Gegenwart von“; „vor Jahwe“ ist prägnant und quellennah.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עַד עוֹלָם
  choice: für immer
  rationale: Die Wendung bezeichnet unbegrenzte Dauer; „für immer“ ist klares, modernes Deutsch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Text enthält ausdrücklich das Tetragramm; die Wiedergabe „Jahwe“ bewahrt den Eigennamen.
- issue: Zeitlicher Aussagewert von בָּרוּךְ
  choice: 'zukunftsbezogen: „wird gesegnet sein“'
  alternative: 'präsentisch: „ist gesegnet“'
  rationale: Die verblöse Prädikatsaussage ist grammatisch auch präsentisch lesbar. Der Zusammenhang und das folgende Futur „wird fest stehen“ unterstützen jedoch die zukunftsbezogene Hauptübersetzung; die echte Mehrdeutigkeit wird durch eine Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am Hebräischen, während „Davids Thron“ und „fest stehen“ natürliches Deutsch gewährleisten.
