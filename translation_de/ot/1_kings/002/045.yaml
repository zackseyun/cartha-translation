  terminology: „Salomo“, „David“ und „Jahwe“ sind passende deutsche Namensformen. „Gesegnet“, „Thron“ und „für immer“ geben die zentralen Begriffe zuverlässig wieder. Die Fußnote kennzeichnet die tatsächliche zeitliche Ambiguität der hebräischen Nominalsatzkonstruktion sachgerecht.
