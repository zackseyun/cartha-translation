  yaml_path: translation/ot/1_kings/002/018.yaml
  text: Bathsheba said[a], “Good; I will speak to the king for you.”
translation:
  language: de
  text: 'Batseba sagte: „Gut, ich werde für dich mit dem König sprechen.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über dich“. Die hebräische Wendung kann bedeuten, dass man über jemanden oder in seinem Interesse spricht; im Zusammenhang ist wahrscheinlich Fürsprache für Adonija gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: sagte
  rationale: Das Wayyiqtol von אמר leitet direkte Rede ein; „sagte“ ist die natürliche deutsche Erzählform.
- source_word: בַּת שֶׁבַע
  choice: Batseba
  rationale: Der Personenname wird in der im Deutschen geläufigen biblischen Form wiedergegeben und nicht wörtlich übersetzt.
- source_word: טוֹב
  choice: Gut
  rationale: טוֹב dient hier als knappe zustimmende Antwort. „Gut“ bewahrt die Kürze des Hebräischen.
- source_word: אָנֹכִי
  choice: ich
  rationale: Das selbstständige Pronomen bezeichnet ausdrücklich Batseba als Subjekt; im Deutschen ist „ich“ beim finiten Verb ohnehin erforderlich.
- source_word: אֲדַבֵּר
  choice: werde … sprechen
  rationale: Das Piel-Imperfekt von דבר bezeichnet hier das Sprechen mit beziehungsweise zu jemandem; eine ausdrückliche „Bitte“ wäre stärker als der Wortlaut.
- source_word: עָלֶיךָ
  choice: deinetwegen
  rationale: על mit דבר kann ein Sprechen über jemanden, ihn betreffend oder zu seinen Gunsten bezeichnen. „Deinetwegen“ lässt die Richtung teilweise offen und passt zugleich zum Kontext der Fürsprache.
- source_word: אֶל הַמֶּלֶךְ
  choice: mit dem König
  rationale: Obwohl אֶל wörtlich die Richtung „zum König“ bezeichnet, ist „mit dem König sprechen“ im heutigen Deutsch idiomatisch und gibt die beabsichtigte Anrede natürlich wieder.
