id: 1KI.2.12
reference: 1 Kings 2:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/שְׁלֹמֹ֕ה יָשַׁ֕ב עַל כִּסֵּ֖א דָּוִ֣ד אָבִ֑י/ו וַ/תִּכֹּ֥ן מַלְכֻת֖/וֹ מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/012.yaml
  text: And Solomon sat on the throne of David his father[a], and his kingdom was firmly established.
translation:
  language: de
  text: Und Salomo saß auf dem Thron seines Vaters David, und seine Königsherrschaft war sehr gefestigt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sein Königtum stand sehr fest“; auch möglich: „Seine Herrschaft war fest gegründet.“'
    reason: Lexikalische Alternativen für מַלְכוּת und וַתִּכֹּן; der hebräische Ausdruck kann die Königsherrschaft, das Königtum oder die ausgeübte Herrschaft bezeichnen.
lexical_decisions:
- source_word: יָשַׁב
  choice: saß auf
  rationale: In Verbindung mit עַל כִּסֵּא bezeichnet das Verb das Einnehmen beziehungsweise Innehaben des königlichen Throns. „Saß auf“ bewahrt das Bild des hebräischen Textes.
- source_word: כִּסֵּא
  choice: Thron
  rationale: Im Zusammenhang der königlichen Nachfolge ist die spezifische Bedeutung „Thron“ eindeutig.
- source_word: אָבִיו
  choice: seines Vaters
  rationale: David ist Salomos leiblicher Vater; daher ist die unmittelbare Verwandtschaftsbezeichnung angemessen.
- source_word: וַתִּכֹּן
  choice: war … gefestigt
  rationale: Die Niphal-Form von כון beschreibt einen erreichten Zustand des Feststehens oder Gesichertseins.
- source_word: מַלְכֻתוֹ
  choice: seine Königsherrschaft
  rationale: מַלְכוּת kann Königsherrschaft, Königtum, Herrschaftszeit oder Königreich bezeichnen. Hier steht vor allem die Stabilität von Salomos Ausübung der Königsherrschaft im Blick; „Königsherrschaft“ bewahrt die semantische Breite besser als eine rein territoriale Wiedergabe.
- source_word: מְאֹד
  choice: sehr
  rationale: Das Adverb verstärkt ausdrücklich den Grad der Festigung und wird im Deutschen natürlich mit „sehr“ wiedergegeben.
theological_decisions:
- issue: Königliche Nachfolge auf dem Thron Davids
  choice: Als historische Aussage über Salomos Thronbesteigung und die Festigung seiner Herrschaft wiedergegeben
  alternative: Eine stärker theologisch aufgeladene Formulierung, welche die dynastische oder messianische Bedeutung ausdrücklich hervorhebt
  rationale: Der Vers berichtet unmittelbar von Salomos Nachfolge und der Stabilität seiner Königsherrschaft. Weiterführende kanonische Bedeutungen werden nicht in den Wortlaut hineingetragen.
- issue: Bedeutungsumfang von מַלְכוּת
  choice: Königsherrschaft
  alternative: Königreich, Königtum oder Regierungszeit
  rationale: Die hebräische Bezeichnung lässt sowohl die Herrschaft als Institution als auch ihre konkrete Ausübung anklingen. Die Fußnote hält die genuine lexikalische Offenheit fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, während „Königsherrschaft“ die hier gemeinte politische Herrschaft präziser ausdrückt als das im Deutschen oft territorial verstandene „Königreich“.
