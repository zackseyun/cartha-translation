    issue: Die infinitivische Entfaltung des Auftrags wird als unabhängige Imperativreihe wiedergegeben.
    rationale: לָלֶכֶת und לִשְׁמֹר erklären, wie der „Auftrag Jahwes“ zu bewahren ist. „Indem du ...“ stellt diesen Zusammenhang klarer her.
  - severity: medium
    issue: „weise handeln“ steht als alleinige Hauptwiedergabe von תַשְׂכִּיל.
    rationale: In der Formel „bei allem, was du tust, und wohin du dich wendest“ liegt die Erfolgs- bzw. Gelingensnuance des Hifil von שׂכל besonders nahe. Die alternative Weisheitsnuance wird in der Fußnote bewahrt.
  - severity: low
    issue: „Gelingen haben“ in der Fußnote ist nicht idiomatisches modernes Deutsch.
    rationale: „Gelingen“ oder „Erfolg haben“ sind natürliche deutsche Ausdrücke.
