source:
  edition: WLC
  text: וְ/שָׁמַרְתָּ֞ אֶת מִשְׁמֶ֣רֶת יְהוָ֣ה אֱלֹהֶ֗י/ךָ לָ/לֶ֤כֶת בִּ/דְרָכָי/ו֙ לִ/שְׁמֹ֨ר חֻקֹּתָ֤י/ו מִצְוֺתָי/ו֙ וּ/מִשְׁפָּטָ֣י/ו וְ/עֵדְוֺתָ֔י/ו כַּ/כָּת֖וּב בְּ/תוֹרַ֣ת מֹשֶׁ֑ה לְמַ֣עַן תַּשְׂכִּ֗יל אֵ֚ת כָּל אֲשֶׁ֣ר תַּֽעֲשֶׂ֔ה וְ/אֵ֛ת כָּל אֲשֶׁ֥ר תִּפְנֶ֖ה שָֽׁם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/003.yaml
  text: And keep the charge of Yahweh your God by walking in his ways and by keeping his statutes[a], his commandments, his judgments, and his testimonies, as it is written in the Law of Moses, so that you may act wisely in all that you do and wherever you turn.
translation:
  language: de
  text: Halte dich an das, was Jahwe, dein Gott, dir aufgetragen hat, indem du auf seinen Wegen gehst und seine Satzungen, Gebote, Rechtsbestimmungen und Zeugnisse hältst, wie es im Gesetz des Mose geschrieben steht, damit du bei allem, was du tust, und überall, wohin du dich wendest, Erfolg hast.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „weise handelst“. Das hebräische Verb kann sowohl einsichtsvolles Handeln als auch den daraus erwachsenden Erfolg bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ אֶת־מִשְׁמֶרֶת
  choice: Halte dich an das, was … dir aufgetragen hat
  rationale: Die Verbindung bezeichnet das gewissenhafte Wahrnehmen einer anvertrauten Pflicht. Die deutsche Formulierung gibt den verpflichtenden Charakter natürlich wieder, ohne das im Deutschen missverständliche wörtliche Bild „eine Wache bewahren“ zu übernehmen.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Jahwe, dein Gott
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; die Verbindung mit „dein Gott“ bewahrt die persönliche Bundesformel.
- source_word: לָלֶכֶת בִּדְרָכָיו
  choice: Geh auf seinen Wegen
  rationale: Das hebräische Weg-Motiv für die Lebensführung bleibt erhalten und ist auch im modernen Deutschen verständlich.
- source_word: חֻקֹּתָיו מִצְוֺתָיו וּמִשְׁפָּטָיו וְעֵדְוֺתָיו
  choice: seine Satzungen, Gebote, Rechtsbestimmungen und Zeugnisse
  rationale: Die vier verschiedenen Rechtstermini werden auch im Deutschen unterschieden. „Rechtsbestimmungen“ verdeutlicht den rechtlichen Sinn von מִשְׁפָּטִים; „Zeugnisse“ erhält die Bundes- und Bezeugungsnuance von עֵדְוֹת.
- source_word: בְּתוֹרַת מֹשֶׁה
  choice: im Gesetz des Mose
  rationale: תּוֹרָה kann „Weisung“ bedeuten, bezeichnet hier aber die schriftlich überlieferte mosaische Rechts- und Bundesordnung; „Gesetz des Mose“ ist daher sachgerecht und verständlich.
- source_word: לְמַעַן תַּשְׂכִּיל
  choice: Dann wirst du … weise handeln
  rationale: Das Verb kann verständiges, einsichtsvolles Handeln und den daraus folgenden Erfolg bezeichnen. Die Hauptfassung stellt die Handlungsweise heraus, ohne die mögliche Erfolgsnuance zu leugnen.
- source_word: וְאֵת כָּל־אֲשֶׁר תִּפְנֶה שָׁם
  choice: und überall, wohin du dich wendest
  rationale: Die räumlich übertragene Wendung wird nahe am Hebräischen und zugleich idiomatisch wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. Die Transliteration bewahrt diesen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von תַּשְׂכִּיל
  choice: weise handeln
  alternative: Erfolg haben / Gelingen haben
  rationale: Das hebräische Verb verbindet einsichtsvolles Handeln häufig mit erfolgreichem Ausgang. Die Übersetzung entscheidet sich im Haupttext für die Weisheitsnuance; die Fußnote hält die Erfolgsnuance offen und vermeidet eine einseitige theologische Erfolgszusage.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der eröffnende Satz löst die hebräische figura etymologica שׁמר/משׁמרת verständlich auf. Die Aufzählung der Rechtsbegriffe bleibt bewusst formal differenziert; das Weg-Motiv und die Wendung „wohin du dich wendest“ bewahren die Bildsprache des Ausgangstextes.
