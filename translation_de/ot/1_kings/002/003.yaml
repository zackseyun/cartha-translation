  verdict: revise
  source_fidelity: Die Hauptaussage und die Rechtsbegriffe sind grundsätzlich zutreffend wiedergegeben. Die hebräischen Infinitive erläutern jedoch, worin das Bewahren des Auftrags besteht; die Folge von drei deutschen Imperativen schwächt diesen Zusammenhang. Außerdem bezeichnet תַשְׂכִּיל in dieser finalen Formel wahrscheinlich den Erfolg bzw. das Gelingen, wobei die Nuance verständigen Handelns als mögliche Lesart bestehen bleibt.
  naturalness: „Halte dich an das, was … dir aufgetragen hat“ ist verständlich, wirkt aber gegenüber dem folgenden Imperativ „Geh“ syntaktisch etwas uneinheitlich. Eine Formulierung mit „indem du“ bildet die hebräische Struktur im modernen Standarddeutsch natürlicher ab. „Erfolg haben“ ist hier idiomatisch; „Gelingen haben“ ist dagegen nicht üblich.
  terminology: „Jahwe“, „Gesetz des Mose“, „Satzungen“, „Gebote“, „Rechtsbestimmungen“ und „Zeugnisse“ sind im gewählten würdigen Register tragfähig und erhalten die Differenzierung der hebräischen Rechtsterminologie. Die Fußnote wird an die geänderte Hauptlesart angepasst.
