  text: וַ/יֻּגַּ֖ד לִ/שְׁלֹמֹ֑ה כִּי הָלַ֨ךְ שִׁמְעִ֧י מִ/ירוּשָׁלִַ֛ם גַּ֖ת וַ/יָּשֹֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/041.yaml
  text: And it was reported to Solomon that Shimei had gone from Jerusalem to Gath and had returned.
translation:
  language: de
  text: Man berichtete Salomo, dass Schimi von Jerusalem nach Gat gegangen und zurückgekehrt war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: wurde berichtet
  rationale: Die passive Erzählform lässt offen, wer Salomo die Nachricht überbrachte; »wurde berichtet« bewahrt diese Unbestimmtheit und klingt im Deutschen natürlich.
- source_word: לִשְׁלֹמֹה
  choice: Salomo
  rationale: 'Die Präposition ל kennzeichnet den Empfänger der Mitteilung; in der deutschen Passivkonstruktion steht er natürlich als Subjekt: »Salomo wurde berichtet«.'
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt der Mitteilung als indirekte Rede ein.
- source_word: הָלַךְ
  choice: gegangen war
  rationale: הלך bezeichnet das Gehen beziehungsweise Reisen; das Plusquamperfekt ordnet die bereits abgeschlossene Handlung vor dem Berichten ein.
- source_word: שִׁמְעִי
  choice: Schimi
  rationale: Der Personenname wird in einer im deutschen Bibelgebrauch etablierten Form wiedergegeben.
- source_word: מִירוּשָׁלִַם
  choice: von Jerusalem
  rationale: מִן bezeichnet den Ausgangspunkt der Bewegung.
- source_word: גַּת
  choice: nach Gat
  rationale: Obwohl vor dem Ortsnamen keine eigene Zielpräposition steht, fungiert Gat als Ziel von הלך; im Deutschen ist »nach« erforderlich.
- source_word: וַיָּשֹׁב
  choice: und zurückgekehrt war
  rationale: שׁוב bedeutet »zurückkehren«; das Plusquamperfekt hält beide berichteten Handlungen zeitlich vor der Mitteilung.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die unpersönliche passive Mitteilung bleibt erhalten; der Satz ist knapp und folgt der hebräischen Abfolge, ohne im Deutschen steif zu wirken.
