  text: וַ/תֹּ֗אמֶר שְׁאֵלָ֨ה אַחַ֤ת קְטַנָּה֙ אָֽנֹכִי֙ שֹׁאֶ֣לֶת מֵֽ/אִתָּ֔/ךְ אַל תָּ֖שֶׁב אֶת פָּנָ֑/י וַ/יֹּֽאמֶר לָ֤/הּ הַ/מֶּ֨לֶךְ֙ שַׁאֲלִ֣י אִמִּ֔/י כִּ֥י לֹֽא אָשִׁ֖יב אֶת פָּנָֽיִ/ךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/020.yaml
  text: She said, “I am asking one small request of you; do not turn away my face.” And the king said to her, “Ask, my mother, for I will not turn away your face.”
translation:
  language: de
  text: 'Sie sagte: »Ich möchte dich um eine kleine Sache bitten; weise mich nicht ab.« Der König antwortete ihr: »Bitte nur, meine Mutter, denn ich werde dich nicht abweisen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁאֵלָה אַחַת קְטַנָּה
  choice: eine kleine Sache
  rationale: Die Wendung bezeichnet eine einzelne, als gering dargestellte Bitte. Im Deutschen ist »um eine kleine Sache bitten« natürlich und gibt den Sinn der Konstruktion mit שׁאל wieder.
- source_word: אַל תָּשֶׁב אֶת פָּנָי / לֹא אָשִׁיב אֶת פָּנָיִךְ
  choice: weise mich nicht ab / ich werde dich nicht abweisen
  rationale: Wörtlich steht »mein/dein Gesicht nicht zurückweisen«. Die idiomatische Bedeutung ist, einer Bitte beziehungsweise der bittenden Person keine abschlägige Antwort zu geben. »Abweisen« bewahrt das Bild stärker als bloßes »ablehnen«, ohne im Deutschen unverständlich zu wirken.
- source_word: שַׁאֲלִי
  choice: Bitte nur
  rationale: Der feminine Imperativ bedeutet hier »Bitte!« im Sinn von »Trag deine Bitte vor«. »Nur« gibt die bereitwillige Erlaubnis natürlich wieder, ohne einen zusätzlichen theologischen Gehalt einzutragen.
- source_word: אִמִּי
  choice: meine Mutter
  rationale: Die direkte Anrede wird formal und würdevoll beibehalten.
theological_decisions: []
translation_notes:
  register: Moderne, verständliche Standardsprache mit würdevoller direkter Rede. Der hebräische Gesichts-Idiomismus wird nicht mechanisch als »mein Gesicht zurückweisen« wiedergegeben, da dies im heutigen Deutschen missverständlich wäre; die parallele Formulierung beider Satzhälften bleibt durch »abweisen« erhalten.
