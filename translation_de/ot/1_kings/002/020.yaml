  source_fidelity: Der Entwurf gibt die hebräische Aussage zuverlässig wieder. שְׁאֵלָה אַחַת קְטַנָּה ist angemessen als „eine kleine Sache“ beziehungsweise eine als gering dargestellte Bitte erfasst. Der Gesichts-Idiomismus („das Gesicht zurückweisen“) wird mit „abweisen“ idiomatisch und in beiden parallelen Satzteilen konsistent wiedergegeben. Die Anrede „meine Mutter“ und die Bereitschaftsformel des Königs bleiben erhalten.
  naturalness: Modernes, gut verständliches Standarddeutsch mit angemessen würdigem erzählerischem Register. „Bitte nur“ ist hier als Erlaubnis, die Bitte vorzubringen, natürlich genug und vermeidet eine unnötig wörtliche oder missverständliche Wiedergabe des hebräischen Imperativs.
