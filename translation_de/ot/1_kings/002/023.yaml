  naturalness: Die revidierte Formulierung ist modernes, würdiges Deutsch. »gegen sein eigenes Leben gesprochen« bleibt absichtlich etwas markiert, weil es die hebräische Idiomatik eng abbildet; die Fußnote erläutert sie verständlich.
