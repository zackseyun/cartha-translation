  text: וַ/יִּשָּׁבַע֙ הַ/מֶּ֣לֶךְ שְׁלֹמֹ֔ה בַּֽ/יהוָ֖ה לֵ/אמֹ֑ר כֹּ֣ה יַֽעֲשֶׂה לִּ֤/י אֱלֹהִים֙ וְ/כֹ֣ה יוֹסִ֔יף כִּ֣י בְ/נַפְשׁ֔/וֹ דִּבֶּר֙ אֲדֹ֣נִיָּ֔הוּ אֶת הַ/דָּבָ֖ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/023.yaml
  text: Then King Solomon swore by Yahweh[a], saying, “May God do so to me, and more also[b], for Adonijah has spoken this word against his own life.”
translation:
  language: de
  text: 'Da schwor König Salomo bei Jahwe und sagte: »So möge Gott mir tun und noch mehr, denn Adonija hat dieses Wort gegen sein eigenes Leben gesprochen.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »denn mit/gegen sein Leben hat Adonija dieses Wort gesprochen«. Gemeint ist, dass er durch diese Äußerung sein Leben aufs Spiel gesetzt oder verwirkt hat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: schwor
  rationale: Das Verb bezeichnet das Schwören beziehungsweise Ablegen eines Eides; »schwor« ist im deutschen Erzählstil knapp und natürlich.
- source_word: בַּיהוָה
  choice: bei Jahwe
  rationale: Die Präposition kennzeichnet den, bei dem geschworen wird; der Gottesname יהוה wird als »Jahwe« wiedergegeben.
- source_word: כֹּה יַעֲשֶׂה לִּי אֱלֹהִים וְכֹה יוֹסִיף
  choice: Gott soll mir dies antun und noch mehr
  rationale: Die feste Schwurformel ruft für den Fall des Wortbruchs ein nicht näher bestimmtes göttliches Strafgericht auf den Schwörenden herab.
- source_word: כִּי
  choice: denn
  rationale: Hier leitet כִּי am natürlichsten den bestätigenden beziehungsweise begründenden Inhalt des Schwurs ein, nicht eine verneinte Bedingung.
- source_word: בְנַפְשׁוֹ דִּבֶּר ... אֶת־הַדָּבָר הַזֶּה
  choice: mit seinem Leben hat Adonija für dieses Wort einzustehen
  rationale: Die Wendung verbindet Adonijas Äußerung mit seinem Leben und besagt im Zusammenhang, dass seine Worte ihn das Leben kosten beziehungsweise dafür haften lassen. Die deutsche Formulierung bewahrt die forensische Schärfe, ohne eine im Hebräischen nicht ausdrücklich genannte Todeshandlung einzufügen.
- source_word: אֲדֹנִיָּהוּ
  choice: Adonija
  rationale: Der Personenname wird nach geläufiger deutscher Bibeltradition transliteriert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich den Eigennamen יהוה. »Jahwe« macht diesen Namen im Haupttext sichtbar; die traditionelle Ersatzlesung wird in der Fußnote genannt.
- issue: Reichweite von בְנַפְשׁוֹ in Salomos Urteil
  choice: mit seinem Leben ... einzustehen
  alternative: gegen sein eigenes Leben gesprochen
  rationale: Die idiomatische Wendung bezeichnet, dass Adonijas Worte sein Leben verwirken oder gefährden. Die gewählte Form bewahrt diese ernste Konsequenz, ohne die anthropologische Bedeutung von נֶפֶשׁ dogmatisch als »Seele« festzulegen.
translation_notes:
  register: Moderner, würdevoller deutscher Erzählstil. Die einleitende Redebegleitsatzformel לֵאמֹר wird natürlich durch den Doppelpunkt wiedergegeben. Der Ausruf erhält die Entschiedenheit von Salomos Schwur; die idiomatische Lebensformel wird im Text verständlich und in der Fußnote formal näher erläutert.
