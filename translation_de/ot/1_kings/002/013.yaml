  text: וַ/יָּבֹ֞א אֲדֹנִיָּ֣הוּ בֶן חַגֵּ֗ית אֶל בַּת שֶׁ֨בַע֙ אֵם שְׁלֹמֹ֔ה וַ/תֹּ֖אמֶר הֲ/שָׁל֣וֹם בֹּאֶ֑/ךָ וַ/יֹּ֖אמֶר שָׁלֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/013.yaml
  text: Then Adonijah son of Haggith came to Bathsheba[a], the mother of Solomon, and she said, “Do you come in peace?” And he said, “In peace.”
translation:
  language: de
  text: 'Da kam Adonija, der Sohn Haggits, zu Batseba, der Mutter Salomos. Sie fragte: »Kommst du in Frieden?« Er antwortete: »In Frieden.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Da kam
  rationale: בוא kann je nach Perspektive »kommen« oder »gehen« bedeuten. Da Adonija sich zu Batseba begibt, ist »kam zu« im Deutschen natürlich; »da« führt die folgende Handlung knapp fort.
- source_word: אֲדֹנִיָּהוּ
  choice: Adonija
  rationale: Gebräuchliche deutsche Transliteration des Personennamens.
- source_word: בֶן חַגִּית
  choice: der Sohn Haggits
  rationale: Gibt die hebräische Abstammungsangabe natürlich und genau wieder.
- source_word: בַּת שֶׁבַע
  choice: Batseba
  rationale: Gebräuchliche deutsche Form des Personennamens.
- source_word: אֵם שְׁלֹמֹה
  choice: der Mutter Salomos
  rationale: Die Apposition bleibt erhalten und betont Batsebas Beziehung zu Salomo.
- source_word: הֲשָׁלוֹם בֹּאֶךָ
  choice: Kommst du in Frieden?
  rationale: Die idiomatische Frage erkundigt sich hier nach friedlicher Absicht; die deutsche Form bewahrt sowohl den Friedensbegriff als auch die knappe Direktheit.
- source_word: שָׁלוֹם
  choice: In Frieden
  rationale: Die elliptische Antwort greift Batsebas Wortlaut auf und bewahrt die Kürze des Hebräischen.
