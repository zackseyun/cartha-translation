  text: וַ/יְגָ֤רֶשׁ שְׁלֹמֹה֙ אֶת אֶבְיָתָ֔ר מִ/הְי֥וֹת כֹּהֵ֖ן לַֽ/יהוָ֑ה לְ/מַלֵּא֙ אֶת דְּבַ֣ר יְהוָ֔ה אֲשֶׁ֥ר דִּבֶּ֛ר עַל בֵּ֥ית עֵלִ֖י בְּ/שִׁלֹֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/027.yaml
  text: So Solomon drove Abiathar out from being priest to Yahweh[b][a], fulfilling the word of Yahweh that he had spoken concerning the house of Eli in Shiloh.
translation:
  language: de
  text: So vertrieb Salomo Abjatar aus seinem Amt als Priester Jahwes und erfüllte damit[a] das Wort Jahwes, das er in Silo über das Haus Elis gesprochen hatte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um das Wort Jahwes zu erfüllen“. Das Hebräische kann Zweck oder Folge ausdrücken.'
    reason: alternative_reading
  - marker: b
    text: Siehe 1. Samuel 2,27–36 und 3,11–14 zu dem Wort gegen das Haus Elis.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְגָרֶשׁ
  choice: vertrieb
  rationale: גרשׁ bezeichnet ein gewaltsames oder entschiedenes Entfernen beziehungsweise Vertreiben. „Vertrieb“ bewahrt die Stärke des Verbs und passt zur Absetzung Abjatars.
- source_word: מִהְיוֹת כֹּהֵן לַיהוָה
  choice: aus dem Priesterdienst für Jahwe
  rationale: Die Konstruktion מן mit dem Infinitiv von היה bezeichnet die Entfernung aus einem Zustand oder Amt. Die idiomatische deutsche Formulierung gibt sowohl die Amtsenthebung als auch die auf Jahwe bezogene priesterliche Tätigkeit wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לְמַלֵּא
  choice: Damit erfüllte sich
  rationale: Der mit לְ gebildete Infinitiv kann Zweck oder Folge ausdrücken. Die gewählte Form gibt im Erzählzusammenhang die eingetretene Erfüllung wieder, ohne Salomo ausdrücklich eine entsprechende Absicht zuzuschreiben.
- source_word: דְּבַר יְהוָה
  choice: das Wort Jahwes
  rationale: Die feste Wendung bezeichnet hier den früher ausgesprochenen göttlichen Urteilsspruch.
- source_word: אֲשֶׁר דִּבֶּר
  choice: das er ... gesprochen hatte
  rationale: Das Plusquamperfekt verdeutlicht im Deutschen, dass Jahwes Ausspruch Salomos Handlung vorausging.
- source_word: עַל בֵּית עֵלִי
  choice: über das Haus Elis
  rationale: עַל kann hier „über/betreffend“ oder im Gerichtskontext „gegen“ bedeuten. „Über“ erhält die lexikalische Offenheit; der richtende Sinn ergibt sich aus dem Kontext.
- source_word: בְּשִׁלֹה
  choice: in Silo
  rationale: Die Präposition בְּ ist hier lokal zu verstehen; „in Silo“ ist im Deutschen natürlich.
theological_decisions:
- issue: Verhältnis zwischen Salomos Handlung und der göttlichen Ankündigung
  choice: Salomos Absetzung Abjatars wird als das Geschehen dargestellt, durch das sich Jahwes früheres Wort erfüllte.
  alternative: Salomo vertrieb Abjatar, um Jahwes Wort zu erfüllen.
  rationale: לְמַלֵּא kann sowohl Zweck als auch Folge ausdrücken. Der Haupttext vermeidet eine unbelegte Festlegung auf Salomos persönliche Absicht; die Fußnote bewahrt die mögliche Zwecklesart.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Priesterdienst“ ist idiomatischer als „davon, Priester zu sein“ und bewahrt den Amtsbezug. Der Eigenname Jahwe wird durchgehend verwendet.
