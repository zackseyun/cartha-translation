  rationale: Die Revision stellt Salomos Handlung wieder als das Geschehen dar, das das zuvor ausgesprochene Wort Jahwes erfüllt, ohne die umstrittene Zweck-oder-Folge-Nuance im Haupttext einseitig als Absicht festzulegen. Die Fußnote bewahrt diese Ambiguität. Die Umformulierung des Amtsbezugs ist zugleich idiomatischeres modernes Standarddeutsch.
