base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/036.yaml
  text: Then the king sent and called for Shimei and said to him[a], “Build yourself a house in Jerusalem and live there, and do not go out from there anywhere.”
translation:
  language: de
  text: 'Da sandte der König nach Schimi und ließ ihn zu sich rufen. Er sagte zu ihm: »Bau dir ein Haus in Jerusalem und wohne dort. Du darfst von dort nirgendwohin[a] gehen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »hierhin oder dorthin«.'
    reason: Die Fußnote bewahrt die bildhafte hebräische Richtungsformel, während der Haupttext ihre idiomatische Bedeutung wiedergibt.
lexical_decisions:
- source_word: וַיִּשְׁלַח ... וַיִּקְרָא לְשִׁמְעִי
  choice: ließ ... Schimi rufen
  rationale: Die deutsche Kausativform gibt die aus zwei Verben bestehende hebräische Boten- und Rufhandlung natürlich wieder, ohne einen eigenständigen Gang des Königs anzudeuten.
- source_word: בְּנֵה לְךָ בַיִת
  choice: Bau dir ein Haus
  rationale: Der Imperativ und das persönliche לְךָ werden knapp und idiomatisch wiedergegeben; „Haus“ bezeichnet hier die konkrete Wohnstätte.
- source_word: וְיָשַׁבְתָּ שָׁם
  choice: und wohne dort
  rationale: ישׁב bezeichnet in diesem Zusammenhang den dauerhaften Aufenthalt beziehungsweise Wohnsitz; „wohne“ ist modern und zugleich würdig.
- source_word: וְלֹא תֵצֵא מִשָּׁם
  choice: Du darfst von dort ... nicht gehen
  rationale: Die verneinte Verbform hat im königlichen Gebot untersagende Kraft. Die Formulierung macht die Aufenthaltsbeschränkung im Deutschen klar.
- source_word: אָנֶה וָאָנָה
  choice: nirgendwohin
  rationale: Die hebräische Richtungsformel bedeutet wörtlich etwa „hierhin oder dorthin“ und bezeichnet im verneinten Satz jedes mögliche Ziel außerhalb Jerusalems.
