  yaml_path: translation/ot/1_kings/002/021.yaml
  text: And she said, “Let Abishag the Shunammite be given to Adonijah your brother as a wife.”
translation:
  language: de
  text: 'Da sagte sie: »Abischag, die Schunemiterin, soll deinem Bruder Adonija zur Frau gegeben werden.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Da sagte sie
  rationale: Das Narrativ-Waw führt die Handlung weiter. „Da sagte sie“ bildet den schlichten Erzählfluss im modernen Deutschen natürlich ab.
- source_word: יֻתַּן
  choice: soll … gegeben werden
  rationale: Der passive Jussiv formuliert eine Bitte beziehungsweise einen Vorschlag. „Soll … gegeben werden“ bewahrt den volitiven Sinn und klingt im Deutschen idiomatisch.
- source_word: אֶת אֲבִישַׁג
  choice: Abischag
  rationale: אֶת kennzeichnet das bestimmte direkte Objekt und wird nicht eigenständig übersetzt; der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: הַשֻּׁנַמִּית
  choice: die Schunemiterin
  rationale: Die Herkunftsbezeichnung identifiziert Abischag als Frau aus Schunem. „Schunemiterin“ ist prägnant und bewahrt die hebräische Bezeichnungsweise.
- source_word: לַאֲדֹנִיָּהוּ
  choice: deinem Bruder Adonija
  rationale: Die Präposition ל bezeichnet in dieser Konstruktion den Empfänger; im natürlichen deutschen Satz wird dieser mit dem Dativ ausgedrückt.
- source_word: אָחִיךָ
  choice: deinem Bruder
  rationale: Das maskuline Singularsuffix richtet sich unmittelbar an Salomo. Die Wiedergabe erhält sowohl die Verwandtschaftsbeziehung als auch ihre rhetorische Funktion.
- source_word: לְאִשָּׁה
  choice: zur Frau
  rationale: Die Wendung bezeichnet die Übergabe zur Eheschließung. „Zur Frau“ ist eine klare, würdevolle und im biblischen Erzählstil natürliche deutsche Formulierung.
