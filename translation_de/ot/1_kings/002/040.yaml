  text: וַ/יָּ֣קָם שִׁמְעִ֗י וַֽ/יַּחֲבֹשׁ֙ אֶת חֲמֹר֔/וֹ וַ/יֵּ֤לֶךְ גַּ֨תָ/ה֙ אֶל אָכִ֔ישׁ לְ/בַקֵּ֖שׁ אֶת עֲבָדָ֑י/ו וַ/יֵּ֣לֶךְ שִׁמְעִ֔י וַ/יָּבֵ֥א אֶת עֲבָדָ֖י/ו מִ/גַּֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/040.yaml
  text: Then Shimei arose[a], saddled his donkey, and went to Gath, to Achish, to look for his servants. Shimei went and brought his servants back from Gath.
translation:
  language: de
  text: Da stand Schimi auf, sattelte seinen Esel und ging nach Gat zu Achisch, um seine Sklaven[a] zu suchen. Schimi ging hin und brachte seine Sklaven aus Gat zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Diener“. Das hebräische Wort עֲבָדָיו kann sowohl Diener als auch Sklaven bezeichnen; hier weist der Zusammenhang auf entlaufene Unfreie hin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: Da stand … auf
  rationale: Gibt die gewöhnliche Erzählform von קום in natürlichem, aber würdigem Deutsch wieder und bewahrt die Abfolge der Handlungen.
- source_word: וַיַּחֲבֹשׁ אֶת חֲמֹרוֹ
  choice: sattelte seinen Esel
  rationale: חבש bezeichnet bei einem Reittier in diesem Reisekontext das Satteln beziehungsweise Reisebereitmachen.
- source_word: גַּתָה
  choice: nach Gat
  rationale: Das Richtungs-He zeigt die Bewegung auf Gat zu an; im Deutschen ist „nach Gat“ idiomatisch.
- source_word: אָכִישׁ
  choice: Achisch
  rationale: Der Personenname wird nach geläufiger deutscher Bibelschreibung transliteriert.
- source_word: לְבַקֵּשׁ
  choice: um … zu suchen
  rationale: בקש bedeutet hier konkret, nach den Entlaufenen zu suchen; „suchen“ ist klar, modern und nicht unnötig gehoben.
- source_word: עֲבָדָיו
  choice: seine Sklaven
  rationale: עבד kann Diener oder Sklave bezeichnen. Der Zusammenhang mit den Entlaufenen und ihrer Rückholung hebt hier ihren unfreien Status hervor; die echte lexikalische Alternative wird in der Fußnote bewahrt.
- source_word: וַיָּבֵא אֶת עֲבָדָיו מִגַּת
  choice: brachte seine Sklaven aus Gat zurück
  rationale: Das Hifil von בוא bedeutet „bringen“. „Zurück“ ist nicht eigens lexikalisiert, macht aber die im Zusammenhang vorausgesetzte Rückholung ins Deutsche idiomatisch deutlich.
