  source_fidelity: 'Der Entwurf gibt die hebräische Handlungsfolge und die wesentlichen Verben treffend wieder: Schimi steht auf, sattelt seinen Esel, geht nach Gat zu Achisch, sucht seine עבדים und bringt sie aus Gat zurück. „Zurück“ ist zwar nicht als eigenes hebräisches Lexem vorhanden, ist angesichts der Rückholung in den erzählerischen Zusammenhang jedoch eine natürliche und sachlich vertretbare deutsche Explizierung.'
