  text: וַ/תָּבֹ֤א בַת שֶׁ֨בַע֙ אֶל הַ/מֶּ֣לֶךְ שְׁלֹמֹ֔ה לְ/דַבֶּר ל֖/וֹ עַל אֲדֹנִיָּ֑הוּ וַ/יָּקָם֩ הַ/מֶּ֨לֶךְ לִ/קְרָאתָ֜/הּ וַ/יִּשְׁתַּ֣חוּ לָ֗/הּ וַ/יֵּ֨שֶׁב֙ עַל כִּסְא֔/וֹ וַ/יָּ֤שֶׂם כִּסֵּא֙ לְ/אֵ֣ם הַ/מֶּ֔לֶךְ וַ/תֵּ֖שֶׁב לִֽ/ימִינֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/019.yaml
  text: So Bathsheba went to King Solomon to speak to him on behalf of Adonijah. The king rose to meet her and bowed down before her. Then he sat on his throne and had a throne placed for the king's mother, and she sat at his right hand.
translation:
  language: de
  text: So ging Batseba zu König Salomo, um mit ihm für Adonija zu sprechen. Der König stand auf, ging ihr entgegen und verbeugte sich vor ihr. Dann setzte er sich auf seinen Thron und ließ für die Mutter des Königs einen Thron aufstellen; sie setzte sich zu seiner Rechten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל אֲדֹנִיָּהוּ
  choice: für Adonija
  rationale: עַל bezeichnet hier angesichts des erzählerischen Zusammenhangs das Eintreten für Adonijas Anliegen; die knappe deutsche Form bewahrt dies natürlich.
- source_word: וַיִּשְׁתַּחוּ לָהּ
  choice: verbeugte sich vor ihr
  rationale: Das Verb bezeichnet eine ehrerbietige körperliche Verneigung bzw. Niederwerfung. Im höfischen Kontext ist „verbeugte sich“ natürlich und vermeidet eine unnötig kultische Festlegung.
- source_word: כִּסֵּא
  choice: Thron
  rationale: Dasselbe Wort bezeichnet sowohl Salomos Sitz als auch den für die Königsmutter aufgestellten ranghohen Sitz; „Thron“ erhält die auffällige lexikalische Wiederholung.
- source_word: לִימִינוֹ
  choice: zu seiner Rechten
  rationale: Die feste Wendung gibt den Ehrenplatz an der rechten Seite des Königs wieder und entspricht dem würdigen Register.
theological_decisions:
- issue: Art der Ehrerbietung Salomos gegenüber Batseba
  choice: „verbeugte sich vor ihr“
  alternative: „warf sich vor ihr nieder“
  rationale: Der hebräische Ausdruck kann eine tiefe Niederwerfung bezeichnen, legt hier aber keine Anbetung fest. Die Übersetzung wahrt die königliche Ehrerbietung ohne kultische Überdeutung.
- issue: Status des für die Königsmutter aufgestellten Sitzes
  choice: „Thron“
  alternative: „Sitz“
  rationale: Die Wiederholung von כִּסֵּא hebt Batsebas Ehrenstellung hervor; sie sollte nicht durch eine abschwächende Wiedergabe eingeebnet werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Erzählfolge wird in kurze, natürliche Sätze gegliedert; der formelle Ausdruck „Mutter des Königs“ und die Wiederholung von „Thron“ bleiben erhalten.
