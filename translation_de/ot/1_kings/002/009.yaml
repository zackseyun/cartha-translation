source:
  edition: WLC
  text: וְ/עַתָּה֙ אַל תְּנַקֵּ֔/הוּ כִּ֛י אִ֥ישׁ חָכָ֖ם אָ֑תָּה וְ/יָֽדַעְתָּ֙ אֵ֣ת אֲשֶׁ֣ר תַּֽעֲשֶׂה לּ֔/וֹ וְ/הוֹרַדְתָּ֧ אֶת שֵׂיבָת֛/וֹ בְּ/דָ֖ם שְׁאֽוֹל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/009.yaml
  text: But now[a], do not hold him guiltless, for you are a wise man, and you will know what you should do to him; and you shall bring his gray head down to Sheol with blood.
translation:
  language: de
  text: Doch nun lass ihn nicht ungestraft davonkommen; denn du bist ein weiser Mann und wirst wissen, was du mit ihm tun sollst. Bring sein graues Haupt mit Blut ins Totenreich[a] hinab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: Scheol; auch: »Grab« oder »Bereich der Toten«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנַקֵּהוּ
  choice: lass ihn nicht ungestraft
  rationale: Das Piel von נקה mit Objektsuffix bezeichnet hier, jemanden für schuldlos zu erklären oder ohne Strafe ausgehen zu lassen. Die gewählte Formulierung gibt den richterlichen Sinn natürlich und prägnant wieder.
- source_word: אִישׁ חָכָם
  choice: ein weiser Mann
  rationale: Die Formulierung bezeichnet den ausdrücklich männlichen Adressaten Salomo und bewahrt die konkrete Ausdrucksweise des Hebräischen.
- source_word: וְיָדַעְתָּ אֵת אֲשֶׁר תַּעֲשֶׂה לוֹ
  choice: und wirst wissen, was du mit ihm tun sollst
  rationale: Das Perfekt kann im Zusammenhang zukunftsbezogen verstanden werden. »Sollst« bringt den in der königlich-richterlichen Weisung liegenden Auftrag zum Ausdruck, ohne die Aussage unnötig festzulegen.
- source_word: וְהוֹרַדְתָּ
  choice: Lass … hinabfahren
  rationale: 'Der Hifil von ירד ist kausativ: Salomo soll bewirken, dass Schimi hinabgeht. Die deutsche Aufforderung gibt diesen fortgesetzten Anweisungscharakter idiomatisch wieder.'
- source_word: שֵׂיבָתוֹ
  choice: sein graues Haupt
  rationale: Das Wort bezeichnet graues Haar beziehungsweise metonymisch das hohe Alter. »Graues Haupt« bewahrt das hebräische Bild in würdigem Deutsch.
- source_word: בְּדָם
  choice: blutig
  rationale: Die Präposition mit דם kennzeichnet hier einen gewaltsamen, von Blutvergießen begleiteten Tod. »Blutig« ist im Deutschen natürlicher als eine mechanische Wiedergabe mit »mit Blut« und erhält die Härte der Aussage.
- source_word: שְׁאוֹל
  choice: Totenreich
  rationale: »Totenreich« erhält den Bezug auf den Aufenthaltsbereich der Toten, ohne den Begriff auf das einzelne Grab zu verengen. Es ist für heutige deutschsprachige Leser verständlicher als eine bloße Transliteration.
theological_decisions:
- issue: Wiedergabe von שְׁאוֹל
  choice: Totenreich
  alternative: Scheol; Grab
  rationale: »Totenreich« wahrt die kosmologische Weite des hebräischen Ausdrucks. »Grab« könnte ihn auf die Begräbnisstätte verengen, während »Scheol« zwar formnäher, aber vielen Lesern weniger verständlich ist. Die Fußnote bewahrt beide Möglichkeiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die drastische Bildsprache des hebräischen Textes bleibt erhalten; Satzbau und Wortwahl sind zugleich für gewöhnliche heutige Leser verständlich.
