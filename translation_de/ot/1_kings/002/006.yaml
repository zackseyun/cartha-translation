  variant: modern standard German
source:
  edition: WLC
  text: וְ/עָשִׂ֖יתָ כְּ/חָכְמָתֶ֑/ךָ וְ/לֹֽא תוֹרֵ֧ד שֵׂיבָת֛/וֹ בְּ/שָׁלֹ֖ם שְׁאֹֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/006.yaml
  text: Act according to your wisdom[b][a], and do not let his gray head go down to Sheol in peace.
translation:
  language: de
  text: Handle deiner Weisheit entsprechend und bring sein graues Haupt[a] nicht in Frieden in die Scheol[b] hinab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier ein Ausdruck für sein graues Haar beziehungsweise sein hohes Alter.
    reason: lexical_alternative
  - marker: b
    text: „Scheol“ ist die hebräische Bezeichnung für den Bereich der Toten; auch „Totenreich“ oder „Grab“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Handle
  rationale: Das breite Verb עשה bezeichnet hier im Rahmen von Davids Auftrag ein entschlossenes Handeln; der deutsche Imperativ gibt die pragmatische Kraft natürlich wieder.
- source_word: כְּחָכְמָתֶךָ
  choice: deiner Weisheit entsprechend
  rationale: כְּ bezeichnet die Übereinstimmung mit Salomos eigener Einsicht. Die Formulierung bewahrt diesen Bezug, ohne den Inhalt seiner Entscheidung näher festzulegen.
- source_word: וְלֹא תוֹרֵד
  choice: bring ... nicht ... hinab
  rationale: 'Der Hifil von ירד ist kausativ: jemanden oder etwas hinabbringen. Die direkte kausative Wiedergabe erhält die Schärfe von Davids Auftrag.'
- source_word: שֵׂיבָתוֹ
  choice: sein graues Haupt
  rationale: Das Substantiv kann graues Haar beziehungsweise hohes Alter bezeichnen. „Graues Haupt“ bewahrt das anschauliche hebräische Altersbild und funktioniert im deutschen Satz idiomatisch.
- source_word: בְּשָׁלֹם
  choice: in Frieden
  rationale: Die Präpositionalphrase bezeichnet einen friedlichen, unbehelligten Ausgang und wird bewusst nicht zu „unbestraft“ ausgedeutet.
- source_word: שְׁאֹל
  choice: Scheol
  rationale: Die Transliteration bewahrt den umfassenderen hebräischen Begriff für den Bereich der Toten und verengt ihn nicht auf ein einzelnes Grab.
theological_decisions:
- issue: Wiedergabe von שְׁאֹל
  choice: Scheol
  alternative: Totenreich; Grab
  rationale: „Scheol“ erhält die Eigenart und Bedeutungsbreite des hebräischen Begriffs. Die Fußnote erklärt ihn, ohne eine bestimmte Lehre über den Zustand der Toten in den Text einzutragen.
- issue: Art des geforderten Handelns gegen Joab
  choice: bring ... nicht in Frieden ... hinab
  alternative: lass ... nicht in Frieden hinabsteigen
  rationale: Die kausative Verbform wird ausdrücklich wiedergegeben. Zugleich bleibt die Aussage beim Bild des Hinabgehens zur Scheol und erklärt nicht zusätzlich, auf welche Weise Salomo handeln soll.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Befehlsform und die hebräischen Bilder vom grauen Haupt und vom Hinabgehen zur Scheol bleiben erhalten; erläuternde Deutungen werden in die Fußnoten verwiesen.
