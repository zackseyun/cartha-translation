base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/038.yaml
  text: Shimei said to the king[a], “The word is good. Just as my lord the king has spoken, so your servant will do.” And Shimei lived in Jerusalem many days.
translation:
  language: de
  text: 'Schimi sagte zum König: »Die Sache ist gut.[a] Wie mein Herr, der König, gesagt hat, so wird dein Diener handeln.« Und Schimi wohnte lange Zeit in Jerusalem.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Das Wort ist gut« oder: »Was du gesagt hast, ist gut.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב הַדָּבָר
  choice: Das Wort ist gut
  rationale: דָּבָר kann »Wort«, »Angelegenheit« oder »Sache« bedeuten. »Das Wort ist gut« bewahrt die knappe, direkte Formulierung des Hebräischen; die Fußnote nennt im Deutschen natürlichere kontextuelle Möglichkeiten.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: mein Herr, der König
  rationale: אֲדֹנִי ist hier eine ehrerbietige höfische Anrede. »Mein Herr, der König« erhält sowohl den Respekt als auch den königlichen Titel.
- source_word: כֵּן יַעֲשֶׂה עַבְדֶּךָ
  choice: so wird dein Diener handeln
  rationale: »Dein Diener« gibt die demütige höfische Selbstbezeichnung wieder, ohne einen rechtlichen Sklavenstatus zu behaupten. Das Imperfekt bezeichnet im Zusammenhang Schimis zukünftige Befolgung.
- source_word: וַיֵּשֶׁב
  choice: wohnte
  rationale: יָשַׁב bedeutet in einem Ortszusammenhang »wohnen« oder »sich aufhalten«. »Wohnte« passt zur auferlegten Bindung an Jerusalem.
- source_word: יָמִים רַבִּים
  choice: lange Zeit
  rationale: Die wörtliche Wendung »viele Tage« bezeichnet hier eine längere, unbestimmte Zeitspanne. »Lange Zeit« ist idiomatisches modernes Deutsch.
- source_word: שִׁמְעִי
  choice: Schimi
  rationale: Die im modernen deutschen Bibelgebrauch etablierte Form des hebräischen Personennamens wird verwendet.
- source_word: בִּירוּשָׁלִַם
  choice: in Jerusalem
  rationale: Der Ortsname wird in seiner etablierten deutschen Form mit der Präposition wiedergegeben.
