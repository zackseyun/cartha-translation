  text: וְ/הַ/יָּמִ֗ים אֲשֶׁ֨ר מָלַ֤ךְ דָּוִד֙ עַל יִשְׂרָאֵ֔ל אַרְבָּעִ֖ים שָׁנָ֑ה בְּ/חֶבְר֤וֹן מָלַךְ֙ שֶׁ֣בַע שָׁנִ֔ים וּ/בִ/ירוּשָׁלִַ֣ם מָלַ֔ךְ שְׁלֹשִׁ֥ים וְ/שָׁלֹ֖שׁ שָׁנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/011.yaml
  text: The days that David reigned over Israel were forty years. In Hebron he reigned seven years, and in Jerusalem he reigned thirty-three years.
translation:
  language: de
  text: Die Zeit, die David über Israel regierte, betrug vierzig Jahre. In Hebron regierte er sieben Jahre und in Jerusalem dreiunddreißig Jahre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַיָּמִים אֲשֶׁר מָלַךְ דָּוִד
  choice: David hatte … Jahre lang regiert
  rationale: Die hebräische Zeitangabe wörtlich als »die Tage, die David regierte« wiederzugeben, wäre im modernen Deutschen unnatürlich. Die Konstruktion bezeichnet die Dauer seiner Herrschaft; diese wird mit »Jahre lang« klar und quellennah ausgedrückt. Das Plusquamperfekt passt zum erzählerischen Zusammenhang nach Davids Tod.
- source_word: מָלַךְ
  choice: regiert
  rationale: »Regieren« gibt das königliche Herrschen in diesem summarischen Zusammenhang natürlich wieder; »König sein« wäre ebenfalls möglich, bildet das Verb aber weniger direkt ab.
- source_word: עַל יִשְׂרָאֵל
  choice: über Israel
  rationale: Mit מָלַךְ bezeichnet עַל den Herrschaftsbereich. »Über Israel regieren« ist im Deutschen idiomatisch.
- source_word: אַרְבָּעִים שָׁנָה
  choice: vierzig Jahre lang
  rationale: Die Zeitdauer wird im Deutschen mit »Jahre lang« eindeutig und natürlich ausgedrückt.
- source_word: בְּחֶבְרוֹן
  choice: In Hebron
  rationale: Die Präposition בְּ bezeichnet hier den Ort; »in« ist bei einer Stadt die natürliche deutsche Entsprechung.
- source_word: שֶׁבַע שָׁנִים
  choice: sieben Jahre
  rationale: Direkte Wiedergabe der genauen Zeitangabe.
- source_word: וּבִירוּשָׁלִַם
  choice: und in Jerusalem
  rationale: Die Verbindung und die Ortsangabe des Hebräischen werden bewahrt.
- source_word: שְׁלֹשִׁים וְשָׁלֹשׁ שָׁנִים
  choice: dreiunddreißig Jahre
  rationale: Moderne deutsche Form der hebräischen zusammengesetzten Zahl, bei unverändertem Zahlenwert.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebraistische Eröffnung »Und die Tage, die …« wird zugunsten einer natürlichen deutschen Dauerangabe umstrukturiert. Die Wiederholung von »regiert« bewahrt den Aufbau des hebräischen Regnalresümees.
