base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/007.yaml
  text: But show kindness to the sons of Barzillai the Gileadite[a], and let them be among those who eat at your table[c][b], for this is how they came near to me when I fled from Absalom your brother.
translation:
  language: de
  text: Doch den Söhnen Barsillais, des Gileaditers,[a] sollst du Güte erweisen; sie sollen zu denen gehören, die an deinem Tisch essen.[b] Denn so standen sie mir bei,[c] als ich vor deinem Bruder Abschalom floh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Söhnen Barsillais, des Gileaditers, loyal begegnen“. Das hebräische Wort für „Güte“ kann auch treue, verlässliche Zuwendung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „unter den Essenden deines Tisches“. Gemeint sind dauerhafte Versorgung und Gunst am königlichen Hof.'
    reason: cultural_note
  - marker: c
    text: 'Wörtlich: „so kamen sie mir nahe“. Sinngemäß: „so standen sie mir bei“. Das hebräische Verb bezeichnet hier im Zusammenhang ihre Unterstützung während Davids Flucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנֵי
  choice: Doch den Söhnen
  rationale: Das Waw führt Davids Anweisungen fort und wirkt nach dem vorherigen negativen Auftrag zugleich kontrastierend. Der Dativ gibt die hebräische Präposition לְ natürlich wieder; בְּנֵי bezeichnet hier die Söhne beziehungsweise männlichen Nachkommen.
- source_word: בַרְזִלַּי הַגִּלְעָדִי
  choice: Barsillais, des Gileaditers
  rationale: Der Personenname wird in gebräuchlicher deutscher Bibelschreibung wiedergegeben, die Herkunftsbezeichnung als Apposition übersetzt.
- source_word: תַּעֲשֶׂה חֶסֶד
  choice: sollst du Güte erweisen
  rationale: Die Verbindung עשה חסד bezeichnet tätige Güte, die auch Treue und Loyalität einschließen kann. „Güte erweisen“ ist würdig und verständlich, ohne den Ausdruck vorschnell auf einen technischen Bundesbegriff festzulegen.
- source_word: וְהָיוּ
  choice: Sie sollen ... gehören
  rationale: Die Form hat in der testamentarischen Anweisung auffordernden Charakter. Die deutsche Soll-Konstruktion bringt Davids Auftrag an Salomo klar zum Ausdruck.
- source_word: בְּאֹכְלֵי שֻׁלְחָנֶךָ
  choice: zu denen gehören, die an deinem Tisch essen
  rationale: Die partizipiale Wendung wird bildnah wiedergegeben und bezeichnet dauerhafte Versorgung und Gunst am königlichen Tisch.
- source_word: כִּי כֵן
  choice: denn ebenso
  rationale: כִּי begründet den Auftrag; כֵן stellt eine Entsprechung zwischen der geforderten Güte und dem früheren Verhalten der Söhne Barsillais her. „Ebenso“ bewahrt diese rückbezügliche Vergleichsnuance knapp und natürlich.
- source_word: קָרְבוּ אֵלַי
  choice: kamen sie mir nahe
  rationale: Die Übersetzung hält die Grundbedeutung „sich nähern/nahe kommen“ fest. Im Zusammenhang ist unterstützendes Beistehen mitgemeint, wird aber nicht interpretierend in den Haupttext eingesetzt.
- source_word: בְּבָרְחִי מִפְּנֵי
  choice: als ich vor ... floh
  rationale: Der Infinitiv mit בְּ ist temporal; מִפְּנֵי wird im deutschen Fluchtidiom natürlich mit „vor“ wiedergegeben.
- source_word: אַבְשָׁלוֹם אָחִיךָ
  choice: deinem Bruder Abschalom
  rationale: Die ausdrückliche Verwandtschaftsbezeichnung bleibt erhalten; der Name folgt der etablierten deutschen Form „Abschalom“.
