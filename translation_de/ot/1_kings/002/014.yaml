lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Dann sagte er
  rationale: Das narrative Wayyiqtol führt die nächste Handlung ein; „Dann“ gibt die zeitliche Folge im Deutschen natürlich wieder.
- source_word: דָּבָר לִי אֵלָיִךְ
  choice: Ich habe dir etwas zu sagen
  rationale: Die wörtliche Konstruktion „Ein Wort/eine Sache ist mir zu dir“ ist eine hebräische Wendung. Die gewählte Formulierung gibt ihren Sinn idiomatisch und präzise wieder.
- source_word: וַתֹּאמֶר
  choice: Sie antwortete
  rationale: Das Verb bedeutet wörtlich „sie sagte“. Im unmittelbaren Dialogzusammenhang drückt „antwortete“ die Funktion der Äußerung im natürlichen Deutschen aus, ohne zusätzliche inhaltliche Nuance einzutragen.
- source_word: דַּבֵּר
  choice: Sprich!
  rationale: Der maskuline Singularimperativ von דּבר wird knapp und formgetreu wiedergegeben.
