  to: 'Und er sagte: „Du weißt, dass das Königtum mir gehörte und ganz Israel den Blick auf mich gerichtet hatte[a], damit ich König würde. Doch das Königtum wandte sich und fiel meinem Bruder zu; denn von Jahwe her war es ihm zuteil.[b]“'
