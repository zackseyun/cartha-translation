  text: וַ/יֹּ֗אמֶר אַ֤תְּ יָדַ֨עַתְּ֙ כִּי לִ/י֙ הָיְתָ֣ה הַ/מְּלוּכָ֔ה וְ/עָלַ֞/י שָׂ֧מוּ כָֽל יִשְׂרָאֵ֛ל פְּנֵי/הֶ֖ם לִ/מְלֹ֑ךְ וַ/תִּסֹּ֤ב הַ/מְּלוּכָה֙ וַ/תְּהִ֣י לְ/אָחִ֔/י כִּ֥י מֵ/יְהוָ֖ה הָ֥יְתָה לּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/015.yaml
  text: And he said[a], “You know that the kingdom was mine, and that all Israel had set their faces on me to reign; but the kingdom turned and became my brother’s[b], for it was his from Yahweh.”
translation:
  language: de
  text: 'Und er sagte: „Du weißt, dass das Königtum mir gehörte und ganz Israel den Blick auf mich gerichtet hatte[a], damit ich König würde. Doch das Königtum wandte sich und fiel meinem Bruder zu; denn von Jahwe her war es ihm zuteil.[b]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ganz Israel hatte seine Gesichter auf mich gerichtet“; gemeint ist eine erwartungsvolle Hinwendung.'
    reason: Die Fußnote dokumentiert das anschauliche hebräische Idiom, das im Haupttext natürlich wiedergegeben wird.
  - marker: b
    text: 'Wörtlicher: „denn von Jahwe her war es für ihn“.'
    reason: Die Fußnote bewahrt die ungewöhnlich knappe hebräische Formulierung und ihre mögliche Mehrdeutigkeit.
lexical_decisions:
- source_word: הַמְּלוּכָה
  choice: das Königtum
  rationale: Gemeint ist hier vor allem die Königswürde beziehungsweise Herrschaft, nicht das Staatsgebiet. „Königtum“ bewahrt diesen politischen Sinn und lässt sich in der Wiederholung natürlich verwenden.
- source_word: וְעָלַי שָׂמוּ כָל־יִשְׂרָאֵל פְּנֵיהֶם
  choice: ganz Israel den Blick auf mich gerichtet hatte
  rationale: Die Wiedergabe vermittelt die hebräische Wendung vom Ausrichten der Gesichter als erwartungsvolle Hinwendung, ohne im Deutschen unnatürlich zu klingen.
- source_word: לִמְלֹךְ
  choice: damit ich König würde
  rationale: Im Zusammenhang der Thronfolge bezeichnet der Infinitiv das Antreten der Königsherrschaft. Diese Formulierung ist im Deutschen klarer als „um zu herrschen“.
- source_word: וַתִּסֹּב
  choice: wandte sich
  rationale: Die Formulierung erhält das Bild einer Wendung beziehungsweise Umkehr der erwarteten Entwicklung.
- source_word: וַתְּהִי לְאָחִי
  choice: fiel meinem Bruder zu
  rationale: Dies gibt den Übergang des Königtums an Salomo idiomatisch wieder und bewahrt die Zielrichtung der Präposition לְ.
- source_word: כִּי מֵיְהוָה הָיְתָה לּוֹ
  choice: denn von Jahwe her kam es ihm zu
  rationale: Die Formulierung bewahrt den göttlichen Ursprung der Zuweisung, ohne ein im Hebräischen nicht ausdrücklich genanntes Verb wie „geben“ einzufügen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אָחִי
  choice: mein Bruder
  rationale: Die unmittelbare Verwandtschaftsbezeichnung bezieht sich aus Adonijas Sicht auf Salomo.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen. „Jahwe“ bewahrt ihn als Eigennamen, statt ihn durch den traditionellen Ersatztitel wiederzugeben.
- issue: Grad der Ausdeutung göttlicher Bestimmung im Schlusssatz
  choice: von Jahwe her kam es ihm zu
  alternative: Jahwe gab es ihm
  rationale: Der Text bezeichnet Jahwe als Ursprung des Salomo zugefallenen Königtums, verwendet aber kein ausdrückliches Verb des Gebens. Die gewählte Fassung lässt diese knappe Spannung bestehen.
translation_notes:
  register: Moderne, würdige Standardsprache. „Königtum“ bezeichnet die Königswürde und Herrschaft, während „den Blick auf mich gerichtet“ das hebräische Bild verständlich erhält. Der Wechsel der Zeitformen folgt dem erzählten Rückblick und der anschließenden Wendung.
