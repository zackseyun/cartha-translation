  text: וַ/יְהִ֗י מִ/קֵּץ֙ שָׁלֹ֣שׁ שָׁנִ֔ים וַ/יִּבְרְח֤וּ שְׁנֵֽי עֲבָדִים֙ לְ/שִׁמְעִ֔י אֶל אָכִ֥ישׁ בֶּֽן מַעֲכָ֖ה מֶ֣לֶךְ גַּ֑ת וַ/יַּגִּ֤ידוּ לְ/שִׁמְעִי֙ לֵ/אמֹ֔ר הִנֵּ֥ה עֲבָדֶ֖י/ךָ בְּ/גַֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/039.yaml
  text: At the end of three years[a], two servants of Shimei ran away to Achish son of Maacah, king of Gath. And they told Shimei, saying, “Look, your servants are in Gath.”
translation:
  language: de
  text: 'Am Ende von drei Jahren flohen zwei Sklaven Schimis zu Achisch, dem Sohn Maachas, dem König von Gat. Da berichtete man Schimi: »Deine Sklaven sind in Gat.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִקֵּץ שָׁלֹשׁ שָׁנִים
  choice: Nach drei Jahren
  rationale: Die Wendung bezeichnet den Endpunkt eines dreijährigen Zeitraums. Das natürliche deutsche »Nach drei Jahren« gibt diesen Zeitsinn präzise wieder.
- source_word: וַיִּבְרְחוּ
  choice: flohen
  rationale: ברח bezeichnet Flucht beziehungsweise Entweichen; »flohen« ist hier knapp und idiomatisch.
- source_word: עֲבָדִים / עֲבָדֶיךָ
  choice: Sklaven
  rationale: עבד kann Diener oder Sklave bedeuten. Dass die Männer ihrem Herrn entfliehen, hebt hier ihren unfreien Status hervor; die Alternative wird in einer Fußnote genannt.
- source_word: אֶל אָכִישׁ
  choice: zu Achisch
  rationale: Die Präposition bezeichnet die Bewegung auf eine Person zu.
- source_word: בֶּן מַעֲכָה מֶלֶךְ גַּת
  choice: dem Sohn Maachas, dem König von Gat
  rationale: Die Apposition erhält sowohl die Abstammungsangabe als auch Titel und Herrschaftsbereich Achischs.
- source_word: וַיַּגִּידוּ לְשִׁמְעִי לֵאמֹר
  choice: Da berichtete man Schimi
  rationale: Das unbestimmte Subjekt der dritten Person Plural wird im Deutschen natürlich durch »man« wiedergegeben. Eine zusätzliche wörtliche Wiedergabe von לֵאמֹר wäre vor direkter Rede schwerfällig.
- source_word: הִנֵּה
  choice: nicht eigens wiedergegeben
  rationale: הִנֵּה lenkt die Aufmerksamkeit auf die unmittelbar folgende Nachricht. Im idiomatischen deutschen Bericht erfüllt die direkte Aussage diese Funktion bereits; »Sieh« oder »Siehe« wäre hier unnötig markiert.
- source_word: בְּגַת
  choice: in Gat
  rationale: ב bezeichnet hier den Aufenthaltsort innerhalb der Stadt.
