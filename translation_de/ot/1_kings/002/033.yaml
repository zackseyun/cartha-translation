id: 1KI.2.33
reference: 1 Kings 2:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/שָׁ֤בוּ דְמֵי/הֶם֙ בְּ/רֹ֣אשׁ יוֹאָ֔ב וּ/בְ/רֹ֥אשׁ זַרְע֖/וֹ לְ/עֹלָ֑ם וּ/לְ/דָוִ֡ד וּ֠/לְ/זַרְע/וֹ וּ/לְ/בֵית֨/וֹ וּ/לְ/כִסְא֜/וֹ יִהְיֶ֥ה שָׁל֛וֹם עַד עוֹלָ֖ם מֵ/עִ֥ם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/033.yaml
  text: So their blood shall return on the head of Joab and on the head of his offspring forever[a], but for David and for his offspring and for his house and for his throne, there shall be peace forever from Yahweh.
translation:
  language: de
  text: So soll ihr Blut für immer auf Joabs Haupt und auf das Haupt seiner Nachkommen zurückfallen[a]. David aber und seinen Nachkommen, seinem Haus und seinem Thron soll von Jahwe für immer Frieden zuteilwerden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „ihr Blut“; gemeint ist das Blut der von Joab Getöteten und damit die Verantwortung für dieses Blut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁבוּ
  choice: soll … zurückfallen
  rationale: Das Qal-Perfekt mit וְ hat hier in Salomos Urteil futurisch-deklarative beziehungsweise jussive Kraft. „Zurückfallen“ bewahrt das Bild, dass die Folgen der Bluttat auf den Schuldigen zurückkommen.
- source_word: דְמֵיהֶם
  choice: ihr Blut
  rationale: Die wörtliche Wendung wird bewahrt; im Zusammenhang bezeichnet sie die Verantwortung für das vergossene Blut der Ermordeten. Die Fußnote erläutert den idiomatischen Sinn.
- source_word: בְּרֹאשׁ
  choice: auf … Haupt
  rationale: Die hebräische Rechtsmetapher für Schuld und deren Folgen bleibt erhalten. „Haupt“ entspricht dem würdevollen biblischen Register besser als das alltäglichere „Kopf“.
- source_word: זַרְעוֹ
  choice: seine Nachkommen
  rationale: „Nachkommen“ gibt die kollektive Bedeutung von זֶרַע im modernen Deutschen natürlich wieder, ohne das missverständliche wörtliche „Same“ zu verwenden.
- source_word: לְעֹלָם / עַד עוֹלָם
  choice: für immer
  rationale: Die Wendung bezeichnet in beiden Satzhälften eine unbegrenzte, fortdauernde Zeit. Die gleiche Wiedergabe hält die formale Gegenüberstellung sichtbar.
- source_word: יִהְיֶה שָׁלוֹם
  choice: soll … Frieden … kommen
  rationale: Diese natürliche deutsche Formulierung bewahrt den futurisch-deklarativen Charakter und die theologische Weite von שָׁלוֹם, ohne es auf Wohlstand zu verengen.
- source_word: לְדָוִד וּלְזַרְעוֹ וּלְבֵיתוֹ וּלְכִסְאוֹ
  choice: für David … und für seine Nachkommen, sein Haus und seinen Thron
  rationale: לְ wird als Begünstigtenmarkierung mit „für“ wiedergegeben. „Haus“ und „Thron“ bleiben wegen ihrer dynastischen Bedeutung wörtlich erhalten; das einmalige „für“ vor der koordinierten Reihe ist idiomatisches Deutsch.
- source_word: מֵעִם יְהוָה
  choice: vom HERRN
  rationale: מֵעִם bezeichnet hier die göttliche Quelle des Friedens. Der Gottesname wird nach deutscher Bibelkonvention als „HERR“ wiedergegeben.
theological_decisions:
- issue: Gegenüberstellung von Joabs Linie und Davids Linie
  choice: „Für David aber …“ macht den adversativen Sinn ausdrücklich.
  alternative: Eine rein additive Wiedergabe mit „und für David …“
  rationale: Obwohl ו formal „und“ bedeutet, stellt der Satz Gericht über Joab und Frieden für David klar einander gegenüber. „Aber“ gibt diese Diskursfunktion wieder, ohne zusätzliche Theologie einzutragen.
- issue: Bedeutung von שָׁלוֹם im dynastischen Zusammenhang
  choice: „Frieden“
  alternative: „Wohlergehen“ oder „Gedeihen“
  rationale: „Frieden“ bewahrt die umfassende Bedeutung von שָׁלוֹם und lässt die Aspekte von Wohlergehen, Sicherheit und dynastischer Beständigkeit mitschwingen.
- issue: Folgen für Joabs Nachkommen
  choice: Die Aussage „auf das Haupt seiner Nachkommen … für immer“ wird ohne Abschwächung beibehalten.
  alternative: Die Aussage ausdrücklich nur als Fortbestand von Joabs Ruf oder Schuldgeschichte zu deuten
  rationale: Der hebräische Text formuliert eine Spannung zwischen individueller Blutschuld und fortdauernden Folgen für die Nachkommenschaft. Die Übersetzung bewahrt diese Spannung, statt sie erklärend aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Rechtsmetaphern „Blut“, „Haupt“ und „zurückfallen“ sowie die dynastischen Begriffe „Haus“ und „Thron“ bleiben erhalten. Der Satzbau wurde gegenüber dem Hebräischen leicht geglättet, ohne die Gegenüberstellung von Gericht und Frieden aufzugeben.
