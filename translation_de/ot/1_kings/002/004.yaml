  to: 'damit Jahwe sein Wort erfüllt, das er über mich[a] gesprochen hat: »Wenn deine Söhne auf ihren Weg achten, indem sie vor mir in Treue[b] mit ihrem ganzen Herzen und ihrer ganzen Seele leben, dann soll es dir nie an einem Mann fehlen, der auf dem Thron Israels sitzt.«[c]'
