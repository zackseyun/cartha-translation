source:
  edition: WLC
  text: לְמַעַן֩ יָקִ֨ים יְהוָ֜ה אֶת דְּבָר֗/וֹ אֲשֶׁ֨ר דִּבֶּ֣ר עָלַ/י֮ לֵ/אמֹר֒ אִם יִשְׁמְר֨וּ בָנֶ֜י/ךָ אֶת דַּרְכָּ֗/ם לָ/לֶ֤כֶת לְ/פָנַ/י֙ בֶּ/אֱמֶ֔ת בְּ/כָל לְבָבָ֖/ם וּ/בְ/כָל נַפְשָׁ֑/ם לֵ/אמֹ֕ר לֹֽא יִכָּרֵ֤ת לְ/ךָ֙ אִ֔ישׁ מֵ/עַ֖ל כִּסֵּ֥א יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/004.yaml
  text: so that Yahweh may establish his word that he spoke concerning me[a], saying, ‘If your sons keep their way by walking before me in truth with all their heart and with all their soul,’ saying[c][b], ‘A man of yours shall not be cut off from upon the throne of Israel.’
translation:
  language: de
  text: 'damit Jahwe sein Wort erfüllt, das er über mich[a] gesprochen hat: »Wenn deine Söhne auf ihren Weg achten, indem sie vor mir in Treue[b] mit ihrem ganzen Herzen und ihrer ganzen Seele leben, dann soll es dir nie an einem Mann fehlen, der auf dem Thron Israels sitzt.«[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zu mir«. Das Hebräische lautet wörtlich »über mich« beziehungsweise »mich betreffend«.'
    reason: alternative_reading
  - marker: b
    text: 'Auch: »in Wahrheit« oder »aufrichtig«.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: »Dann wird dir kein Mann vom Thron Israels abgeschnitten werden.« Gemeint ist, dass es David nicht an einem männlichen Nachkommen auf Israels Thron fehlen soll.'
    reason: literal_idiom
lexical_decisions:
- source_word: לְמַעַן
  choice: damit
  rationale: Gibt den Zweck beziehungsweise die beabsichtigte Folge knapp und natürlich wieder.
- source_word: יָקִים
  choice: bestätigt
  rationale: Das Hifil von קום bezeichnet hier, dass Jahwe sein gesprochenes Wort fest bestehen lässt beziehungsweise erfüllt; „bestätigt“ ist im Deutschen natürlich und wahrt den Bezug auf die Verheißung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den hebräischen Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: דְּבָרוֹ
  choice: sein Wort
  rationale: Bewahrt die konkrete hebräische Ausdrucksweise; im Zusammenhang ist damit Jahwes Zusage gemeint.
- source_word: דִּבֶּר עָלַי
  choice: über mich gesprochen hat
  rationale: עַל bedeutet bei דבר hier am ehesten „über/betreffend“; die mögliche kontextuelle Wiedergabe „zu mir“ wird in einer Fußnote genannt.
- source_word: יִשְׁמְרוּ ... אֶת־דַּרְכָּם
  choice: auf ihren Weg achten
  rationale: שׁמר bezeichnet aufmerksames Bewahren oder Einhalten; „auf ihren Weg achten“ erhält das Wegbild und klingt im Deutschen idiomatisch.
- source_word: לָלֶכֶת לְפָנַי
  choice: vor mir ... leben
  rationale: Überträgt das hebräische Bild des Wandelns in natürliches modernes Deutsch, ohne den Gedanken eines Lebens vor Gottes Angesicht zu verlieren.
- source_word: בֶּאֱמֶת
  choice: in Treue
  rationale: אמת kann Wahrheit, Verlässlichkeit, Aufrichtigkeit oder Treue bezeichnen. „In Treue“ passt zum Verhalten im Bund, ohne die Bedeutung auf bloße Wahrhaftigkeit zu verengen.
- source_word: בְּכָל־לְבָבָם וּבְכָל־נַפְשָׁם
  choice: mit ganzem Herzen und mit ganzer Seele
  rationale: Natürliche deutsche Wiedergabe der umfassenden inneren Hingabe, wobei beide hebräischen Begriffe erhalten bleiben.
- source_word: לֹא יִכָּרֵת לְךָ אִישׁ מֵעַל כִּסֵּא יִשְׂרָאֵל
  choice: dann soll es dir nie an einem Mann fehlen, der auf dem Thron Israels sitzt
  rationale: Gibt die hebräische dynastische Redewendung verständlich wieder. Das masculine אִישׁ und der Bezug auf die Thronfolge bleiben ausdrücklich erhalten; die wörtlichere Form steht in der Fußnote.
theological_decisions:
- issue: Bedingtheit der davidischen Zusage
  choice: 'Die Zusage wird ausdrücklich an das Verhalten von Davids Söhnen gebunden: „Wenn ... dann ...“.'
  alternative: Die Bedingung als bloße Ermahnung abzuschwächen oder mit anders formulierten davidischen Verheißungen zu harmonisieren.
  rationale: Der hebräische Text führt die Zusage mit אִם als wirkliche Bedingung ein. Die Übersetzung lässt die daraus entstehende theologische Spannung bestehen.
- issue: Bedeutungsumfang von בֶּאֱמֶת
  choice: „in Treue“ im Haupttext, mit „in Wahrheit“ und „aufrichtig“ als Fußnotenalternativen
  alternative: Nur eine der Bedeutungsnuancen als alleinige Auslegung festzulegen.
  rationale: Der hebräische Ausdruck umfasst Wahrheit, Verlässlichkeit und integres Verhalten; die Fußnote bewahrt diese Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Wegmotiv bleibt erhalten, während „vor mir leben“ die im Deutschen schwerfällige Wendung „vor mir wandeln“ natürlich wiedergibt. Die zweimalige hebräische Redeeinleitung לֵאמֹר wird nicht mechanisch verdoppelt, sondern durch Doppelpunkt und die klare Wenn-dann-Struktur abgebildet.
