base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/022.yaml
  text: King Solomon answered and said to his mother[a], “Why are you asking for Abishag the Shunammite for Adonijah? Ask for the kingship for him as well, since he is my older brother—and for him, for Abiathar the priest, and for Joab son of Zeruiah!”
translation:
  language: de
  text: 'König Salomo antwortete seiner Mutter: »Warum bittest du für Adonija um Abischag, die Schunemiterin? Bitte für ihn doch auch um das Königtum[a], denn er ist mein älterer Bruder – für ihn, für den Priester Abjatar und für Joab, den Sohn der Zeruja!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Königsherrschaft«; auch »das Königreich«. Das hebräische Wort kann sowohl den Herrschaftsbereich als auch die königliche Herrschaft bezeichnen. Hier hebt »Königtum« den dynastischen Anspruch hervor, den Salomo mit Adonijas Bitte verbindet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן הַמֶּלֶךְ שְׁלֹמֹה וַיֹּאמֶר לְאִמּוֹ
  choice: König Salomo antwortete seiner Mutter
  rationale: Die im Hebräischen übliche Verbindung »antwortete und sagte« wird in natürlichem modernem Deutsch mit »antwortete« wiedergegeben; Person, Amt und Adressatin bleiben vollständig erhalten.
- source_word: וְלָמָה אַתְּ שֹׁאֶלֶת
  choice: Warum bittest du
  rationale: Die rhetorische Frage und die unmittelbare Anrede werden klar und idiomatisch wiedergegeben. Das einleitende וְ muss im Deutschen nicht eigens mit »und« ausgedrückt werden.
- source_word: אֶת אֲבִישַׁג הַשֻּׁנַמִּית לַאֲדֹנִיָּהוּ
  choice: für Adonija um Abischag, die Schunemiterin
  rationale: Die deutsche Konstruktion »für jemanden um jemanden bitten« bildet den Begünstigten der Bitte deutlich ab; der Herkunftsname wird in geläufiger biblischer Namensform wiedergegeben.
- source_word: וְשַׁאֲלִי לוֹ אֶת הַמְּלוּכָה
  choice: Bitte für ihn doch auch um das Königtum
  rationale: »Doch auch« vermittelt die steigernde, sarkastisch-rhetorische Kraft. »Königtum« bezeichnet hier den Anspruch auf königliche Herrschaft, nicht bloß ein Territorium.
- source_word: כִּי הוּא אָחִי הַגָּדוֹל מִמֶּנִּי
  choice: denn er ist mein älterer Bruder
  rationale: Die Begründung und der für den Thronanspruch bedeutsame Altersvorrang werden in natürlichem Deutsch bewahrt.
- source_word: וְלוֹ וּלְאֶבְיָתָר הַכֹּהֵן וּלְיוֹאָב בֶּן צְרוּיָה
  choice: – für ihn, für den Priester Abjatar und für Joab, den Sohn der Zeruja!
  rationale: Der Gedankenstrich wahrt den abrupten, elliptischen Nachtrag. Die wiederholte Präposition erhält die rhetorische Zuspitzung und nennt Adonijas Verbündete, ohne den ausgelassenen Satzteil erklärend zu ergänzen.
theological_decisions:
- issue: Politisch-dynastische Bedeutung der Bitte um Abischag
  choice: Salomos Erwiderung stellt die Bitte ausdrücklich einem Anspruch auf das Königtum gleich.
  alternative: Neutraler mit »Königreich« übersetzen und die dynastische Bedeutung nur aus dem Zusammenhang erschließen lassen.
  rationale: הַמְּלוּכָה kann Königreich, Königsherrschaft oder Königtum bezeichnen. Im Zusammenhang geht es um Herrschaftsrecht und Thronanspruch; »Königtum« bewahrt diese Bedeutung, ohne zusätzliche Motive oder Lehren in den Text einzutragen.
- issue: Elliptischer Schluss mit Adonijas Verbündeten
  choice: Die grammatische Ellipse bleibt durch einen Gedankenstrich und die Reihung »für ihn, für … und für …« sichtbar.
  alternative: Den Sinn durch eine Ergänzung wie »Bitte darum auch für seine Anhänger« ausdrücklich ausformulieren.
  rationale: Der hebräische Wortlaut lässt das Prädikat im Nachtrag unausgesprochen. Die gewählte Form erhält sowohl die rhetorische Schärfe als auch die syntaktische Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit geläufigen deutschen Namensformen. Die direkte Rede ist rhetorisch zugespitzt, bleibt aber nah an der hebräischen Satzstruktur. Der Fußnotenmarker steht bei dem tatsächlich erläuterten Ausdruck »Königtum«.
