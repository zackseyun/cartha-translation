  source_fidelity: 'Die Aussage wird insgesamt zutreffend wiedergegeben: Die Sprecherin/der Sprecher bringt eine einzelne Bitte vor, bittet darum, nicht abgewiesen zu werden, und die Frau fordert ihn zum Reden auf. Das hebräische Idiom in אַל־תָּשִׁיבִי אֶת־פָּנַי ist sinnvoll idiomatisch übertragen und in der Fußnote transparent erläutert. Allerdings fügt „möchte ich“ eine im Hebräischen nicht ausdrücklich markierte vorsichtige Modalität hinzu; die Konstruktion mit dem betonten אָנֹכִי und Partizip ist unmittelbarer.'
