base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/016.yaml
  text: And now I am asking one request of you; do not turn away my face. And she said to him[a], “Speak.”
translation:
  language: de
  text: 'Und nun habe ich eine Bitte an dich: Weise mich nicht ab.[a] Sie sagte zu ihm: »Sprich.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Wende mein Gesicht nicht zurück.« Das hebräische Idiom bedeutet: »Weise mich beziehungsweise meine Bitte nicht ab.«'
    reason: Bewahrung und Erläuterung des hebräischen Sprachbildes.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl den Anschluss durch וְ als auch die gesprächsgliedernde zeitliche Wendung עַתָּה.
- source_word: שְׁאֵלָה אַחַת
  choice: um eines bitten
  rationale: Gibt die einzelne Bitte in natürlichem Deutsch wieder, ohne das im Deutschen schwerfällige Substantiv »eine Bitte erbitten«.
- source_word: אָנֹכִי שֹׁאֵל מֵאִתָּךְ
  choice: möchte ich dich … bitten
  rationale: Drückt die unmittelbar vorgebrachte Bitte idiomatisch und würdevoll aus; das betonte אָנֹכִי wird durch die Wortstellung erkennbar.
- source_word: אַל תָּשִׁיבִי אֶת פָּנָי
  choice: Weise mich nicht ab
  rationale: Überträgt die Bedeutung des hebräischen Idioms klar ins moderne Deutsche; das zugrunde liegende Bild wird in der Fußnote dokumentiert.
- source_word: וַתֹּאמֶר אֵלָיו
  choice: Sie sagte zu ihm
  rationale: Gibt die narrative Verbfolge schlicht wieder; das Subjekt ist aus dem Kontext weiblich.
- source_word: דַּבֵּר
  choice: Sprich!
  rationale: Der knappe Imperativ entspricht Form und Funktion des hebräischen Ausdrucks.
