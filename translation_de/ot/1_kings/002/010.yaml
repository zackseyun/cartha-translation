  text: Then David slept with his fathers and was buried in the city of David[a].
translation:
  language: de
  text: Dann legte sich David zu seinen Vätern und wurde in der Stadt Davids begraben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „legte sich mit seinen Vätern nieder“; eine übliche hebräische Umschreibung für das Sterben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: legte sich
  rationale: Das Verb שׁכב bedeutet wörtlich „sich hinlegen“ und kann auch „schlafen“ bezeichnen. In der königlichen Todesformel ist es ein verhüllender Ausdruck für das Sterben. „Legte sich“ bewahrt das Bild und verbindet sich im Deutschen natürlich mit „zu seinen Vorfahren“.
- source_word: עִם אֲבֹתָיו
  choice: zu seinen Vorfahren
  rationale: Die hebräische Formel bedeutet wörtlich „bei/mit seinen Vätern“. Im heutigen Deutschen gibt „zu seinen Vorfahren“ die genealogische Bedeutung und die herkömmliche Todesformel verständlich wieder, ohne ausschließlich männliche Ahnen nahezulegen.
- source_word: וַיִּקָּבֵר
  choice: wurde begraben
  rationale: Die Nifal-Form bezeichnet hier den passiven Vorgang der Bestattung; „wurde begraben“ ist die direkte und natürliche deutsche Wiedergabe.
- source_word: בְּעִיר דָּוִד
  choice: in der Stadt Davids
  rationale: Die Formulierung bewahrt die feste Ortsbezeichnung und entspricht natürlichem, würdigem Standarddeutsch.
- source_word: וַ
  choice: Dann
  rationale: Das vorangestellte Waw führt die Erzählung zeitlich weiter. „Dann“ gibt diese Abfolge im Deutschen flüssig wieder.
theological_decisions:
- issue: Bedeutung der Todesformel „sich zu seinen Vorfahren legen“
  choice: Das hebräische Bild wird im Haupttext bewahrt und in der Fußnote als Umschreibung des Sterbens erläutert.
  alternative: Die Formel unmittelbar mit „David starb“ wiederzugeben.
  rationale: Die bildhafte und traditionsreiche Ausdrucksweise des hebräischen Textes soll erhalten bleiben, ohne daraus eine nähere Aussage über den Zustand nach dem Tod abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle hebräische Todesformel bleibt erkennbar, wird jedoch mit „Vorfahren“ verständlich und inklusiv im genealogischen Sinn formuliert.
