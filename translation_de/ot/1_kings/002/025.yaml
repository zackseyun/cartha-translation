  yaml_path: translation/ot/1_kings/002/025.yaml
  text: So King Solomon sent Benaiah son of Jehoiada[a], and he struck him down, and he died.
translation:
  language: de
  text: Da schickte König Salomo Benaja, den Sohn Jojadas,[a] und dieser schlug ihn nieder, und er starb.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „durch die Hand Benajas, des Sohnes Jojadas“; die Wendung bezeichnet ihn als Beauftragten des Königs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: schickte
  rationale: Das Verb שׁלח bezeichnet hier im fortlaufenden Erzählstil das Senden beziehungsweise Beauftragen. „Schickte“ ist natürlich und bewahrt die gewöhnliche Ausdrucksweise des Hebräischen.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: König Salomo
  rationale: Diese im Deutschen übliche Verbindung gibt Titel und Namen klar und würdig wieder.
- source_word: בְּיַד
  choice: schickte … Benaja
  rationale: Die Wendung bedeutet wörtlich „durch die Hand von“ und bezeichnet hier Benaja als handelnden Beauftragten. Im natürlichen Deutschen wird er deshalb als Objekt von „schickte“ wiedergegeben; die wörtliche Form steht in der Fußnote.
- source_word: בְּנָיָהוּ בֶן יְהוֹיָדָע
  choice: Benaja, den Sohn Jojadas
  rationale: Die traditionelle deutsche Namensform und der deutsche Genitiv geben das Patronym verständlich und knapp wieder.
- source_word: וַיִּפְגַּע בּוֹ
  choice: der erschlug ihn
  rationale: פגע mit ב kann ein feindliches Treffen oder Schlagen bezeichnen. Im unmittelbaren Hinrichtungskontext drückt „erschlug“ die tödliche Gewalttat natürlich aus, ohne die anschließende ausdrückliche Todesfeststellung auszulassen.
- source_word: וַיָּמֹת
  choice: sodass er starb
  rationale: Der Tod wird wie im Hebräischen ausdrücklich genannt. „Sodass“ verdeutlicht im Deutschen den hier naheliegenden Folgezusammenhang, während die hebräische Satzfolge formal auch schlicht mit „und“ wiedergegeben werden kann.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Das einleitende „Da“ führt die hebräische Erzählfolge natürlich fort. Die Pronomenbezüge werden durch „der“ bei Benaja verdeutlicht, ohne zusätzliche Namen in den Text einzutragen.
