base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/037.yaml
  text: For on the day you go out and cross the Kidron Valley[a], know for certain that you shall surely die[b]; your blood shall be on your own head.
translation:
  language: de
  text: 'Denn an dem Tag, an dem du hinausgehst und das Kidrontal[a] überquerst, sollst du mit Gewissheit wissen: Du wirst gewiss sterben. Dein Blut wird auf deinem eigenen Kopf sein.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Bach Kidron“. Das hebräische Wort kann ein Tal, ein Wadi oder einen saisonalen Wasserlauf bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Wendung „Dein Blut wird auf deinem Kopf sein“ bedeutet: Du selbst trägst die Verantwortung für deinen Tod.'
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה בְּיוֹם
  choice: Denn an dem Tag, an dem
  rationale: Die Wendung leitet hier feierlich den Zeitpunkt und die sichere Folge eines Verstoßes ein. Die Wiederaufnahme mit „an dem“ ergibt natürliches modernes Deutsch.
- source_word: צֵאתְךָ
  choice: du hinausgehst
  rationale: Der Infinitiv mit Suffix bezeichnet Schimis Verlassen des ihm zugewiesenen Bereichs; „hinausgehst“ bewahrt die räumliche Perspektive.
- source_word: וְעָבַרְתָּ אֶת נַחַל קִדְרוֹן
  choice: und das Kidrontal überquerst
  rationale: נחל kann Tal, Wadi oder saisonalen Wasserlauf bezeichnen. „Kidrontal“ ist für die geografische Bezeichnung im Deutschen natürlich; die Alternative wird in der Fußnote erhalten.
- source_word: יָדֹעַ תֵּדַע
  choice: sollst du mit Gewissheit wissen
  rationale: Infinitivus absolutus und finites Verb verstärken die Aussage. Diese Formulierung gibt den nachdrücklichen Warncharakter wieder.
- source_word: כִּי מוֹת תָּמוּת
  choice: Du musst sterben
  rationale: Die emphatische hebräische Konstruktion drückt die sichere Todesfolge aus. Im Kontext bezeichnet „musst“ keine bloße natürliche Notwendigkeit, sondern die unabwendbare Sanktion.
- source_word: דָּמְךָ יִהְיֶה בְרֹאשֶׁךָ
  choice: Dein Blut wird auf deinem eigenen Kopf sein
  rationale: Die bildhafte hebräische Haftungsformel wird beibehalten; „eigenen“ verdeutlicht, dass der Angesprochene selbst die Verantwortung trägt.
theological_decisions:
- issue: Rechtliche Todesandrohung und persönliche Verantwortlichkeit
  choice: Die hebräische Blutschuldformel bleibt im Haupttext bildhaft erhalten.
  alternative: Du trägst selbst die Verantwortung für deinen Tod.
  rationale: Die wörtlich-nahe Wiedergabe bewahrt die rechtliche und moralische Schärfe, während eine Fußnote die Bedeutung für heutige Leser erklärt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit feierlichem Warn- und Rechtston. Die hebräischen Intensivkonstruktionen werden idiomatisch wiedergegeben, ohne die sichere Todesfolge oder die persönliche Haftung abzuschwächen.
