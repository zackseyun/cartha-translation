  text: וַ/יִּתֵּ֨ן הַ/מֶּ֜לֶךְ אֶת בְּנָיָ֧הוּ בֶן יְהוֹיָדָ֛ע תַּחְתָּ֖י/ו עַל הַ/צָּבָ֑א וְ/אֶת צָד֤וֹק הַ/כֹּהֵן֙ נָתַ֣ן הַ/מֶּ֔לֶךְ תַּ֖חַת אֶבְיָתָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/035.yaml
  text: And the king appointed Benaiah son of Jehoiada in his place over the army[a], and the king appointed Zadok the priest in place of Abiathar.
translation:
  language: de
  text: Und der König setzte Benaja, den Sohn Jojadas, an seiner Stelle über das Heer ein[a]; und den Priester Zadok setzte der König an Abjatars Stelle ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „an seiner Stelle“; das Pronomen bezieht sich im unmittelbaren Zusammenhang auf den zuvor abgesetzten Heerführer Joab.'
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּתֵּן / נָתַן
  choice: setzte … ein
  rationale: Das Verb bedeutet wörtlich „geben/setzen“, bezeichnet hier aber die Einsetzung in ein Amt. „Einsetzen“ gibt den administrativen Sinn natürlich und präzise wieder.
- source_word: בְּנָיָהוּ בֶן יְהוֹיָדָע
  choice: Benaja, den Sohn Jojadas
  rationale: Die hebräische Abstammungsangabe wird in geläufiger deutscher Namensform wiedergegeben.
- source_word: תַּחְתָּיו
  choice: an seiner Stelle
  rationale: Die Form bezeichnet die Ablösung eines bisherigen Amtsinhabers; das Pronomen verweist im unmittelbaren Zusammenhang auf Joab.
- source_word: עַל הַצָּבָא
  choice: über das Heer
  rationale: צָבָא bezeichnet hier die militärische Streitmacht; die Präposition markiert Benajas Befehlsgewalt.
- source_word: צָדוֹק הַכֹּהֵן
  choice: den Priester Zadok
  rationale: Titel und Name werden in einer im Deutschen natürlichen Apposition wiedergegeben.
- source_word: תַּחַת אֶבְיָתָר
  choice: an Abjatars Stelle
  rationale: תַּחַת drückt hier die Nachfolge beziehungsweise Ersetzung in einem Amt aus.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Der im Hebräischen in beiden Satzteilen wiederholte Titel bleibt erhalten.
