  text: וַ/יַּ֗עַל בְּנָיָ֨הוּ֙ בֶּן יְה֣וֹיָדָ֔ע וַ/יִּפְגַּע בּ֖/וֹ וַ/יְמִתֵ֑/הוּ וַ/יִּקָּבֵ֥ר בְּ/בֵית֖/וֹ בַּ/מִּדְבָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/034.yaml
  text: Then Benaiah son of Jehoiada went up[a], struck him down, and put him to death[b]; and he was buried at his house in the wilderness.
translation:
  language: de
  text: Da ging Benaja, der Sohn Jojadas, hinauf[a], schlug ihn nieder und tötete ihn. Joab wurde in seinem Haus[b] in der Wüste begraben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zog hinauf«. Das Hebräische bezeichnet zunächst die Bewegung; dass Benaja gegen Joab vorging, ergibt sich aus dem Zusammenhang.'
    reason: lexical_alternative
  - marker: b
    text: »In seinem Haus« kann im Zusammenhang einer Bestattung auch den Familienbesitz oder ein Anwesen meinen und muss nicht eine Bestattung im Wohngebäude bezeichnen.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל
  choice: ging ... hinauf
  rationale: עלה bedeutet grundsätzlich »hinaufgehen«. Die räumliche bzw. erzählerische Bewegung bleibt erhalten, ohne die gegen Joab gerichtete Absicht bereits in das Verb hineinzulesen.
- source_word: וַיִּפְגַּע בּוֹ
  choice: schlug ihn nieder
  rationale: פגע mit ב kann hier ein feindliches Zusammentreffen, einen Angriff oder Schlag bezeichnen. »Schlug ihn nieder« gibt die Gewalthandlung natürlich wieder und hält sie vom folgenden ausdrücklichen Töten unterschieden.
- source_word: וַיְמִתֵהוּ
  choice: tötete ihn
  rationale: Der Hifil von מות bedeutet »sterben lassen/töten«. Im Deutschen gibt »tötete ihn« die kausative Bedeutung klar und würdig wieder; der Hinrichtungskontext ergibt sich aus dem Zusammenhang.
- source_word: וַיִּקָּבֵר
  choice: wurde ... begraben
  rationale: Der Nifal ist passiv. Die ausdrückliche Nennung Joabs beseitigt im Deutschen eine mögliche Unklarheit beim Subjektwechsel.
- source_word: בְּבֵיתוֹ
  choice: bei seinem Haus
  rationale: בית kann Haus, Wohnsitz oder Besitz bezeichnen. Bei einer Bestattung ist »bei seinem Haus« natürlicher und weniger missverständlich als »in seinem Haus«, ohne die weitere Bedeutung »auf seinem Anwesen« festzulegen.
- source_word: בַּמִּדְבָּר
  choice: in der Wüste
  rationale: מדבר bezeichnet unbesiedeltes, trockenes Land bzw. Wildnis. »Wüste« ist im modernen Standarddeutsch knapp und geläufig, ohne die genaue Geländeart weiter zu bestimmen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zwei hebräischen Verben für den gewaltsamen Zugriff und das Töten werden getrennt wiedergegeben. »Joab« wird beim passiven Subjektwechsel zur Klarheit eingesetzt.
