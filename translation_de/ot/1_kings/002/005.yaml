source:
  edition: WLC
  text: וְ/גַ֣ם אַתָּ֣ה יָדַ֡עְתָּ אֵת֩ אֲשֶׁר עָ֨שָׂה לִ֜/י יוֹאָ֣ב בֶּן צְרוּיָ֗ה אֲשֶׁ֣ר עָשָׂ֣ה לִ/שְׁנֵֽי שָׂרֵ֣י צִבְא֣וֹת יִ֠שְׂרָאֵל לְ/אַבְנֵ֨ר בֶּן נֵ֜ר וְ/לַ/עֲמָשָׂ֤א בֶן יֶ֨תֶר֙ וַ/יַּ֣הַרְגֵ֔/ם וַ/יָּ֥שֶׂם דְּמֵֽי מִלְחָמָ֖ה בְּ/שָׁלֹ֑ם וַ/יִּתֵּ֞ן דְּמֵ֣י מִלְחָמָ֗ה בַּ/חֲגֹֽרָת/וֹ֙ אֲשֶׁ֣ר בְּ/מָתְנָ֔י/ו וּֽ/בְ/נַעֲל֖/וֹ אֲשֶׁ֥ר בְּ/רַגְלָֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/005.yaml
  text: 'And you also know what Joab son of Zeruiah did to me[a], what he did to the two commanders of the armies of Israel, to Abner son of Ner and to Amasa son of Jether: he killed them and put the blood of war in peace[b], and put the blood of war on the belt that was around his waist and on the sandals that were on his feet.'
translation:
  language: de
  text: 'Auch du weißt, was Joab, der Sohn Zerujas, mir angetan hat: was er den beiden Heerführern Israels, Abner, dem Sohn Ners, und Amasa, dem Sohn Jeters, angetan hat. Er tötete sie und vergoss im Frieden Blut wie im Krieg[a] und brachte Kriegsblut an seinen Gürtel, der um seine Hüften lag, und an seine Sandalen, die an seinen Füßen waren.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Er brachte Kriegsblut in den Frieden.“ Gemeint ist, dass Joab unter friedlichen Umständen Blut vergoss, als herrschte Krieg.'
    reason: lexical_alternative
  - marker: b
    text: Das Blut an Gürtel und Sandalen kann als sichtbares Zeichen der Blutschuld verstanden werden, die durch diese Tötungen an Joab haftete.
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם אַתָּה
  choice: Auch du
  rationale: Gibt die additive Hervorhebung und die direkte Anrede knapp und natürlich wieder.
- source_word: אֵת אֲשֶׁר עָשָׂה לִי
  choice: was ... mir angetan hat
  rationale: Das deutsche „antun“ drückt den kontextuell nachteiligen Sinn von לִי natürlich aus.
- source_word: לִשְׁנֵי שָׂרֵי צִבְאוֹת יִשְׂרָאֵל
  choice: den beiden Heerführern Israels
  rationale: „Heerführer“ bezeichnet militärische Oberbefehlshaber verständlich und würdig; die kompakte Form vermeidet ein im Deutschen schwerfälliges „der Heere Israels“.
- source_word: וַיַּהַרְגֵם
  choice: Er tötete sie
  rationale: Direkte Wiedergabe des Verbs und seines pluralischen Objekts.
- source_word: וַיָּשֶׂם דְּמֵי מִלְחָמָה בְּשָׁלֹם
  choice: und vergoss im Frieden Blut wie im Krieg
  rationale: Vermittelt den Sinn, dass Joab unter friedlichen Umständen kriegsmäßiges Blutvergießen beging, und bewahrt die Spannung zwischen Krieg und Frieden; die wörtlichere Bildform steht in der Fußnote.
- source_word: וַיִּתֵּן דְּמֵי מִלְחָמָה בַּחֲגֹרָתוֹ ... וּבְנַעֲלוֹ
  choice: so brachte er Kriegsblut an den Gürtel ... und an die Sandalen
  rationale: Bewahrt das konkrete, auffällige Bild des hebräischen Textes und den kausalen Zusammenhang mit den Tötungen.
theological_decisions:
- issue: Bedeutung des Blutes an Gürtel und Sandalen
  choice: Das Bild im Haupttext stehen lassen und nur vorsichtig erläutern
  alternative: Das Bild unmittelbar als Schuld oder Blutschuld paraphrasieren
  rationale: Der hebräische Text nennt konkrete Blutspuren, erklärt ihre symbolische Bedeutung aber nicht ausdrücklich. Die Übersetzung sollte diese Offenheit nicht dogmatisch verengen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Namensformen folgen der im Deutschen üblichen biblischen Schreibweise. Das ungewöhnliche Bild „Kriegsblut“ bleibt bewusst erhalten und wird durch Fußnoten erläutert.
