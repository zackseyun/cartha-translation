  source_fidelity: Der Entwurf gibt die Personen, die beiden militärischen Befehlshaber, die Tötung und den Kontrast von Krieg und Frieden zuverlässig wieder. Das zweite Bild vom Blut an Gürtel und Sandalen bleibt grundsätzlich erhalten. Das einleitende „so“ vor dem zweiten Satzteil legt jedoch einen kausalen Zusammenhang stärker fest, als die einfache hebräische Reihung verlangt.
  naturalness: Der Text ist überwiegend modernes, würdiges Standarddeutsch. „an den Gürtel um seine Hüften“ und besonders „an die Sandalen an seinen Füßen“ sind unnötig schwerfällig. Die Relativkonstruktion kann die hebräische Konkretisierung natürlich wiedergeben.
  terminology: „Zeruja“, „Abner“, „Ner“, „Amasa“ und „Jeter“ sind im Deutschen gebräuchliche biblische Namensformen. „Heerführer Israels“ ist vertretbar. „Kriegsblut“ wahrt die bewusst ungewöhnliche Bildsprache; die Fußnoten erläutern sie zurückhaltend.
