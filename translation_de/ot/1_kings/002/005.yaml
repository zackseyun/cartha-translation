  - severity: low
    issue: Schwerfällige Ortsangaben bei Gürtel und Sandalen
    rationale: Die Formulierungen „Gürtel um seine Hüften“ und „Sandalen an seinen Füßen“ klingen im modernen Deutsch doppelt bzw. unnatürlich. Relativsätze bewahren die Angaben des hebräischen Textes ohne Stilbruch.
