  text: וַ/יֹּ֗אמֶר אִמְרִי נָא֙ לִ/שְׁלֹמֹ֣ה הַ/מֶּ֔לֶךְ כִּ֥י לֹֽא יָשִׁ֖יב אֶת פָּנָ֑יִ/ךְ וְ/יִתֶּן לִ֛/י אֶת אֲבִישַׁ֥ג הַ/שּׁוּנַמִּ֖ית לְ/אִשָּֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/017.yaml
  text: And he said[a], “Please speak to King Solomon, for he will not refuse you, and let him give me Abishag the Shunammite as a wife.”
translation:
  language: de
  text: 'Er sagte: „Bitte sprich mit König Salomo – denn er wird dich nicht abweisen[a] – und bitte ihn, mir Abischag, die Schunemiterin, zur Frau zu geben.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „dein Gesicht nicht zurückweisen“; eine hebräische Redewendung für „dich beziehungsweise deine Bitte nicht abweisen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמְרִי נָא
  choice: Bitte sprich
  rationale: Der feminine Singular des Imperativs von אמר mit נָא formuliert eine höfliche Bitte an Batseba. „Bitte sprich“ ist natürliches modernes Deutsch.
- source_word: לִשְׁלֹמֹה הַמֶּלֶךְ
  choice: mit König Salomo
  rationale: Beim deutschen Verb „sprechen“ steht die angesprochene Person idiomatisch mit „mit“; der Königstitel steht natürlich vor dem Namen.
- source_word: כִּי לֹא יָשִׁיב אֶת־פָּנָיִךְ
  choice: denn er wird dich nicht abweisen
  rationale: כִּי begründet die Bitte. Die hebräische Wendung bedeutet wörtlich, dass Salomo ihr Gesicht nicht zurückweisen werde, und bezeichnet hier die Nichtablehnung einer Bittstellerin.
- source_word: וְיִתֶּן לִי
  choice: und bitte ihn, mir … zu geben
  rationale: Der Präfixverb-Satz bezeichnet im Zusammenhang den Inhalt dessen, worum Batseba Salomo bitten soll. Die ergänzte Wiederaufnahme „bitte ihn“ macht den syntaktischen Bezug im Deutschen klar, ohne den Sinn zu erweitern.
- source_word: אֲבִישַׁג הַשּׁוּנַמִּית
  choice: Abischag, die Schunemiterin
  rationale: Der Personenname wird in der geläufigen deutschen biblischen Form wiedergegeben; die Herkunftsbezeichnung wird als Apposition übersetzt.
- source_word: לְאִשָּׁה
  choice: zur Frau
  rationale: Die Konstruktion bezeichnet die Eheschließung. „Zur Frau geben“ ist eine knappe, idiomatische und in diesem Kontext eindeutige Wiedergabe.
