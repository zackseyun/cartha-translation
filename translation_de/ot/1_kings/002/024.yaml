  variant: modern standard German
source:
  edition: WLC
  text: וְ/עַתָּ֗ה חַי יְהוָה֙ אֲשֶׁ֣ר הֱכִינַ֗/נִי ו/יושיבי/ני עַל כִּסֵּא֙ דָּוִ֣ד אָבִ֔/י וַ/אֲשֶׁ֧ר עָֽשָׂה לִ֛/י בַּ֖יִת כַּ/אֲשֶׁ֣ר דִּבֵּ֑ר כִּ֣י הַ/יּ֔וֹם יוּמַ֖ת אֲדֹנִיָּֽהוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/024.yaml
  text: And now[a], as Yahweh lives, who has established me and seated me on the throne of David my father, and who has made for me a house as he promised, surely Adonijah shall be put to death today.
translation:
  language: de
  text: 'Und nun – so wahr Jahwe lebt, der mich fest eingesetzt und mich auf den Thron meines Vaters David gesetzt hat und der mir ein Haus geschaffen hat[a], wie er es zugesagt hat: Adonija wird noch heute getötet werden!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Haus“ ist hier wahrscheinlich ein bleibendes Königshaus, also eine Dynastie, gemeint und nicht in erster Linie ein Gebäude.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה
  choice: so wahr Jahwe lebt
  rationale: Die geläufige deutsche Eidesformel gibt den hebräischen Schwurausdruck natürlich und mit seiner feierlichen Bekräftigung wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הֱכִינַנִי
  choice: mich fest eingesetzt
  rationale: Das Hifil von כון bezeichnet hier das Festigen oder dauerhafte Einsetzen Salomos in seiner königlichen Stellung; die Formulierung wahrt den Personenbezug des hebräischen Suffixes.
- source_word: וַיּוֹשִׁיבֵנִי עַל כִּסֵּא
  choice: und mich auf den Thron … gesetzt hat
  rationale: Die Wendung gibt die kausative Bedeutung des Hifil und den konkreten Akt der Thronbesteigung in idiomatischem Deutsch wieder.
- source_word: כִּסֵּא דָּוִד אָבִי
  choice: den Thron meines Vaters David
  rationale: Diese Wortstellung ist im Deutschen natürlich und bewahrt sowohl die dynastische Zuordnung als auch die Vaterbezeichnung.
- source_word: עָשָׂה לִי בַּיִת
  choice: mir ein Haus geschaffen hat
  rationale: „Haus“ bewahrt das Bild und die intertextuelle Verbindung der hebräischen Königssprache; eine Fußnote erläutert den hier naheliegenden dynastischen Sinn.
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: wie er es zugesagt hat
  rationale: Wörtlich steht „wie er geredet hat“; im Zusammenhang einer göttlichen Zusage gibt „zugesagt“ die pragmatische Bedeutung klar wieder.
- source_word: כִּי
  choice: ':'
  rationale: Die hebräische Partikel leitet hier den nachdrücklich beschworenen Inhalt ein. Im Deutschen drückt ein Doppelpunkt diese Funktion natürlicher aus als ein ausdrücklich übersetztes „denn“.
- source_word: הַיּוֹם
  choice: noch heute
  rationale: „Noch heute“ ist eine natürliche deutsche Wiedergabe, die die zeitliche Unmittelbarkeit und den Nachdruck der Ankündigung ausdrückt.
- source_word: יוּמַת
  choice: wird … getötet werden
  rationale: Die passive, kausative Form von מות bezeichnet eine angeordnete Tötung beziehungsweise Hinrichtung und nicht lediglich ein Sterben.
- source_word: אֲדֹנִיָּהוּ
  choice: Adonija
  rationale: Der Personenname wird nach geläufiger deutscher Bibeltradition transliteriert.
theological_decisions:
- issue: Bedeutung von „Haus“ in königlich-dynastischer Sprache
  choice: „Haus“ bleibt im Haupttext stehen; der dynastische Sinn wird in einer Fußnote erläutert.
  alternative: Direkte Wiedergabe mit „Dynastie“ oder „Königshaus“.
  rationale: בַּיִת kann in diesem Zusammenhang eine bleibende Herrscherfamilie bezeichnen. Die Beibehaltung des Bildworts wahrt jedoch die Mehrdeutigkeit und die Verbindung zur Verheißung an David, ohne den dynastischen Sinn zu verbergen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feierliche Eidesformel und die königliche Todesankündigung bleiben deutlich, ohne altertümliche Verbformen oder konfessionell geprägte Zusätze.
