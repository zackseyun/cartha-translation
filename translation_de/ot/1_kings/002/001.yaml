base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/001.yaml
  text: As the days of David drew near for him to die[a], he commanded Solomon his son, saying,
translation:
  language: de
  text: 'Als Davids Tage sich dem Tod näherten,[a] gebot er seinem Sohn Salomo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Als Davids Tage sich dem Sterben näherten“. Die hebräische Wendung bedeutet, dass die Zeit seines Todes näher rückte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  choice: sich näherten
  rationale: Das Qal-Verb קרב bezeichnet ein Näherkommen; die deutsche Wendung bewahrt das hebräische Bild und klingt im Zusammenhang mit einer herannahenden Todeszeit verständlich.
- source_word: יְמֵי דָוִד
  choice: Davids Tage
  rationale: Die Constructusverbindung wird knapp und formal nah wiedergegeben. Gemeint ist Davids verbleibende Lebenszeit, doch die bildhafte Ausdrucksweise bleibt erhalten.
- source_word: לָמוּת
  choice: dem Tod
  rationale: Der Infinitiv von מות mit ל bezeichnet hier das bevorstehende Sterben. Die nominale deutsche Fassung ergibt zusammen mit „sich nähern“ eine natürliche Wendung, ohne den Sinn auszudeuten.
- source_word: וַיְצַו
  choice: gebot
  rationale: צוה bezeichnet ein verbindliches Befehlen oder Anweisen. „Gebot“ trägt dem feierlichen Gewicht der letzten Weisungen Davids Rechnung, ohne so altertümlich wie „befahl ihm und sprach“ zu wirken.
- source_word: אֶת שְׁלֹמֹה בְנוֹ
  choice: seinem Sohn Salomo
  rationale: Die natürliche deutsche Wortstellung kennzeichnet Salomo eindeutig als Davids Sohn und als Objekt des Gebots.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Das hebräische לֵאמֹר leitet die unmittelbar folgende direkte Rede ein. Im modernen Deutschen erfüllt ein Doppelpunkt diese Funktion natürlicher als das formelhafte „indem er sagte“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Metapher „Davids Tage“ wird bewahrt; die Redeeinleitung wird idiomatisch durch einen Doppelpunkt wiedergegeben.
