base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/042.yaml
  text: Then the king sent and called for Shimei and said to him[a], “Did I not make you swear by Yahweh and warn you, saying, ‘On the day you go out and go anywhere at all, know for certain that you shall surely die’? And you said to me, ‘The word is good[c][b]; I have heard.’”
translation:
  language: de
  text: 'Da sandte der König hin, ließ Schimi rufen und sagte zu ihm: »Habe ich dich nicht bei Jahwe schwören lassen und dich gewarnt[a]: ›An dem Tag, an dem du hinausgehst und irgendwohin gehst[b], wisse gewiss, dass du ganz sicher sterben wirst‹? Und du hast zu mir gesagt: ›Das Wort ist gut[c]; ich habe gehört.‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dir feierlich eingeschärft« beziehungsweise »gegen dich Zeugnis abgelegt«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »hierhin oder dorthin«; gemeint ist: an irgendeinen Ort.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »Die Sache ist gut.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁבַּעְתִּיךָ בַיהוָה
  choice: dich bei Jahwe schwören lassen
  rationale: Der Hifil von שבע bezeichnet das Veranlassen eines Eides; die Formulierung bewahrt den kausativen Sinn und gibt den Gottesnamen direkt wieder.
- source_word: וָאָעִד בְּךָ
  choice: dich eindringlich gewarnt
  rationale: עוד im Hifil kann warnen, feierlich verpflichten oder gegen jemanden Zeugnis ablegen bedeuten. Im Zusammenhang steht eine förmliche Warnung, deren Ernst durch „eindringlich“ gewahrt wird; die forensische Nuance bleibt in der Fußnote erhalten.
- source_word: בְּיוֹם צֵאתְךָ
  choice: An dem Tag, an dem du hinausgehst
  rationale: Die temporale Konstruktion mit Infinitiv und Suffix wird als natürlicher deutscher Nebensatz wiedergegeben.
- source_word: וְהָלַכְתָּ אָנֶה וָאָנָה
  choice: und irgendwohin gehst
  rationale: Das Adverbpaar bedeutet wörtlich etwa „hierhin oder dorthin“ und bezeichnet im Kontext ein beliebiges Ziel.
- source_word: יָדֹעַ תֵּדַע
  choice: sollst du gewiss wissen
  rationale: Der absolute Infinitiv verstärkt das finite Verb; „gewiss“ bildet diese Nachdrücklichkeit ab.
- source_word: מוֹת תָּמוּת
  choice: dass du unweigerlich sterben musst
  rationale: Auch hier verstärkt ein absoluter Infinitiv das finite Verb. Die deutsche Formulierung vermittelt sowohl die sichere Folge als auch den rechtsverbindlichen Ton.
- source_word: טוֹב הַדָּבָר
  choice: Das Wort ist gut
  rationale: דבר kann „Wort“, „Aussage“ oder „Angelegenheit“ bedeuten. „Wort“ hält sich eng an die sprachliche Antwort, ohne die mögliche Bedeutung „Sache“ auszuschließen.
- source_word: שָׁמָעְתִּי
  choice: ich habe gehört
  rationale: Die Übersetzung bewahrt den wörtlichen Sinn. Ein mögliches Mitschwingen von Zustimmung oder Annahme wird nicht als ausdrücklicher Gehorsam festgelegt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält das Tetragramm unmittelbar. „Jahwe“ gibt den persönlichen Bundesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Rechtliche Tragweite von וָאָעִד בְּךָ
  choice: eindringlich gewarnt
  alternative: feierlich verpflichtet; gegen dich Zeugnis abgelegt
  rationale: Die Erzählung erinnert an eine eidlich bekräftigte Todesandrohung. Die Übersetzung bewahrt den Warncharakter, legt die mehrdeutige Verbform jedoch nicht ausschließlich forensisch aus.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit dem feierlich-rechtlichen Ton der königlichen Anrede. Die verstärkenden hebräischen Konstruktionen werden idiomatisch, aber hörbar nachdrücklich wiedergegeben. Die verschachtelte direkte Rede wird durch deutsche Anführungszeichen klar gegliedert.
