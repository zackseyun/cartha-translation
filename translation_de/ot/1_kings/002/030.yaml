source:
  edition: WLC
  text: וַ/יָּבֹ֨א בְנָיָ֜הוּ אֶל אֹ֣הֶל יְהוָ֗ה וַ/יֹּ֨אמֶר אֵלָ֜י/ו כֹּֽה אָמַ֤ר הַ/מֶּ֨לֶךְ֙ צֵ֔א וַ/יֹּ֥אמֶר לֹ֖א כִּ֣י פֹ֣ה אָמ֑וּת וַ/יָּ֨שֶׁב בְּנָיָ֤הוּ אֶת הַ/מֶּ֨לֶךְ֙ דָּבָ֣ר לֵ/אמֹ֔ר כֹּֽה דִבֶּ֥ר יוֹאָ֖ב וְ/כֹ֥ה עָנָֽ/נִי־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/030.yaml
  text: 'Then Benaiah came to the tent of Yahweh and said to him[a], “Thus says the king: ‘Come out.’” But he said, “No, for I will die here.” And Benaiah brought word back to the king, saying, “Thus Joab spoke, and thus he answered me.”'
translation:
  language: de
  text: 'Da kam Benaja zum Zelt Jahwes[a] und sagte zu ihm: »So spricht der König: Komm heraus!« Er aber sagte: »Nein, denn hier werde ich sterben.« Darauf brachte Benaja dem König Bericht und sagte: »So hat Joab gesprochen, und so hat er mir geantwortet.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »zur Stiftshütte Jahwes«. Wörtlich steht im Hebräischen »zum Zelt Jahwes«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֶל יְהוָה
  choice: Zelt Jahwes
  rationale: אֹהֶל bedeutet wörtlich »Zelt«. Diese Wiedergabe bleibt nahe am hebräischen Wortlaut und bezeichnet hier das Heiligtum, ohne das deutendere Traditionswort »Stiftshütte« in den Haupttext zu setzen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name »Jahwe« wiedergegeben und nicht durch den Titel »HERR« ersetzt.
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: So spricht der König
  rationale: Die geläufige Botenformel wird in knapper, würdevoller Form bewahrt.
- source_word: צֵא
  choice: Komm heraus!
  rationale: Der Imperativ von יצא fordert den im Zelt befindlichen Joab auf, den Ort zu verlassen; im Deutschen ist aus der Perspektive des Sprechers »Komm heraus!« natürlich.
- source_word: לֹא כִּי פֹה אָמוּת
  choice: Nein, denn hier werde ich sterben
  rationale: Die Übersetzung bewahrt sowohl Joabs Weigerung als auch seine Erklärung beziehungsweise entschlossene Erwartung, an diesem Ort zu sterben.
- source_word: וַיָּשֶׁב ... דָּבָר
  choice: brachte ... die Antwort
  rationale: Die hebräische Verbindung bezeichnet die Rückübermittlung einer Nachricht. »Brachte dem König die Antwort« ist idiomatisches modernes Deutsch und passt zum folgenden wörtlichen Bericht.
- source_word: כֹּה דִבֶּר יוֹאָב וְכֹה עָנָנִי
  choice: So hat Joab gesprochen, und so hat er mir geantwortet
  rationale: Das zweimalige כֹּה wird beibehalten, um den formellen, wiederholenden Charakter des Berichts wiederzugeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht der Eigenname יהוה. »Jahwe« bewahrt ihn als persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Joabs Aussage über seinen Tod am Heiligtum
  choice: »hier werde ich sterben«
  alternative: »hier will ich sterben«
  rationale: Das hebräische Imperfekt אָמוּת kann Erwartung oder Entschlossenheit ausdrücken. »Werde ich sterben« lässt diese Spannung offen und legt Joabs Aussage nicht ausschließlich als freien Todeswunsch aus.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdevoller Erzählweise. Die formelhafte Rede »So spricht der König« und die Wiederholung »so … und so« bleiben erhalten; unnötige Archaismen werden vermieden.
