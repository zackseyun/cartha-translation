source:
  edition: WLC
  text: וְ/הַ/שְּׁמֻעָה֙ בָּ֣אָה עַד יוֹאָ֔ב כִּ֣י יוֹאָ֗ב נָטָה֙ אַחֲרֵ֣י אֲדֹנִיָּ֔ה וְ/אַחֲרֵ֥י אַבְשָׁל֖וֹם לֹ֣א נָטָ֑ה וַ/יָּ֤נָס יוֹאָב֙ אֶל אֹ֣הֶל יְהוָ֔ה וַֽ/יַּחֲזֵ֖ק בְּ/קַרְנ֥וֹת הַ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/028.yaml
  text: And the report came to Joab[a], for Joab had turned after Adonijah, though he had not turned after Absalom[b]. So Joab fled to the tent of Yahweh and took hold of the horns of the altar.
translation:
  language: de
  text: Und die Nachricht erreichte Joab[a]. Denn Joab hatte sich Adonija angeschlossen, Abschalom aber hatte er sich nicht angeschlossen. Da floh Joab zum Zelt Jahwes und hielt sich an den Hörnern des Altars fest.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Denn Joab hatte sich hinter Adonija gewandt, hinter Abschalom aber hatte er sich nicht gewandt.« Gemeint ist seine politische Parteinahme.'
    reason: lexical_alternative
  - marker: b
    text: Die »Hörner« waren hornartige Vorsprünge an den Ecken des Altars. Wer sie ergriff, suchte damit Schutz oder bat um Erbarmen.
    reason: cultural_note
lexical_decisions:
- source_word: הַשְּׁמֻעָה בָּאָה עַד יוֹאָב
  choice: die Nachricht erreichte Joab
  rationale: Die Wendung bezeichnet eine Nachricht, die zu jemandem gelangt. „Erreichte“ gibt das hebräische Bewegungsbild natürlich und prägnant wieder; „Gerücht“ wäre hier unnötig unsicher.
- source_word: נָטָה אַחֲרֵי
  choice: sich … anschließen
  rationale: Wörtlich bedeutet die Wendung „sich hinter/nach jemandem neigen bzw. wenden“, bezeichnet hier jedoch politische Parteinahme. Die natürliche deutsche Entsprechung „sich anschließen“ wird in beiden Teilsätzen gleich wiedergegeben.
- source_word: אֲדֹנִיָּה / אַבְשָׁלוֹם
  choice: Adonija / Abschalom
  rationale: Die Personennamen folgen den im modernen deutschen Bibelgebrauch geläufigen Formen.
- source_word: וַיָּנָס
  choice: da floh
  rationale: Das Verb bezeichnet eine dringliche Flucht; „da“ führt die folgende Handlung im deutschen Erzählstil natürlich weiter.
- source_word: אֹהֶל יְהוָה
  choice: Zelt Jahwes
  rationale: „Zelt“ entspricht dem konkreten hebräischen Ausdruck, ohne den technischeren Begriff „Stiftshütte“ einzutragen. Der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: וַיַּחֲזֵק בְּקַרְנוֹת הַמִּזְבֵּחַ
  choice: hielt sich an den Hörnern des Altars fest
  rationale: Die Formulierung bewahrt die konkrete körperliche Handlung und ist im Deutschen idiomatischer als „ergriff die Hörner“, ohne ihre Bedeutung auszudeuten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ bewahrt ihn als persönlichen Gottesnamen statt ihn durch einen Titel zu ersetzen.
- issue: Politische Bedeutung von נָטָה אַחֲרֵי
  choice: sich jemandem anschließen
  alternative: sich jemandem zuwenden / jemandem folgen
  rationale: Im Zusammenhang geht es um Joabs Parteinahme für Thronanwärter. Die gewählte Formulierung macht diesen Sinn verständlich und bewahrt durch identische Wiedergabe die Wiederholung des hebräischen Ausdrucks.
- issue: Bedeutung des Ergreifens der Altarhörner
  choice: im Haupttext nicht ausdrücklich deuten
  alternative: als Anspruch auf Schutz oder Bitte um Erbarmen ausformulieren
  rationale: Der Text berichtet zunächst nur die Handlung. Ihre kulturelle Bedeutung wird in einer Fußnote erläutert, ohne dem Haupttext eine rechtlich oder theologisch abschließende Deutung aufzuzwingen.
translation_notes:
  register: Modernes, würdevolles Erzähldeutsch. Die politische Wendung wird verständlich wiedergegeben, ihre wörtliche Bildsprache jedoch in der Fußnote dokumentiert. Die Satzgliederung vermeidet einen missverständlichen direkten Kausalanschluss zwischen dem Eintreffen der Nachricht und Joabs früherer Parteinahme.
