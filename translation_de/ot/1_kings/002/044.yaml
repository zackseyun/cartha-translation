base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/044.yaml
  text: Then the king said to Shimei[a], “You know all the evil that your heart knows, which you did to David my father[b]; and Yahweh has returned your evil on your own head.”
translation:
  language: de
  text: 'Da sagte der König zu Schimi: „Du selbst kennst all das Böse, von dem dein Herz weiß[a] und das du David, meinem Vater, angetan hast. Und Jahwe hat dein Böses auf deinen eigenen Kopf zurückfallen lassen[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „das dir in deinem Herzen bewusst ist“. Wörtlich wird dem Herzen das Wissen zugeschrieben; damit wird Schimis inneres Wissen um seine Schuld hervorgehoben.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „hat dein Böses auf deinen eigenen Kopf zurückgebracht“ oder „hat dir dein Böses vergolten“. Das hebräische Verb beschreibt hier, dass Schimis Böses auf ihn selbst zurückkehrt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ אֶל שִׁמְעִי
  choice: Da sagte der König zu Schimi
  rationale: Das narrative וַ wird im Deutschen natürlich mit „Da“ wiedergegeben; Titel und Eigenname folgen dem hebräischen Text.
- source_word: אַתָּה יָדַעְתָּ
  choice: Du selbst kennst
  rationale: Das selbstständige Pronomen אַתָּה trägt Nachdruck. „Du selbst“ macht diesen im Deutschen hörbar; das Präsens entspricht der gegenwärtigen moralischen Kenntnis, die Salomo Schimi zuschreibt.
- source_word: כָּל הָרָעָה
  choice: all das Böse
  rationale: רָעָה bezeichnet hier schuldhaftes Unrecht, nicht bloß Unglück oder Schaden. „Das Böse“ bewahrt die moralische Bedeutung.
- source_word: אֲשֶׁר יָדַע לְבָבְךָ
  choice: von dem dein Herz weiß
  rationale: Die auffällige hebräische Personifizierung des Herzens bleibt erhalten und betont Schimis inneres Wissen um seine Schuld.
- source_word: אֲשֶׁר עָשִׂיתָ לְדָוִד אָבִי
  choice: das du David, meinem Vater, angetan hast
  rationale: „Antun“ gibt die gegen David gerichtete böse Handlung natürlich und deutlich wieder; die Apposition wird im Deutschen durch Kommas kenntlich gemacht.
- source_word: וְהֵשִׁיב יְהוָה אֶת רָעָתְךָ
  choice: Und Jahwe hat dein Böses ... zurückfallen lassen
  rationale: Der Hifil von שׁוב bezeichnet hier das Veranlassen einer Rückkehr. „Zurückfallen lassen“ bewahrt sowohl die göttliche Verursachung als auch das Bild, dass Schimis eigenes Böses zu ihm zurückkehrt.
- source_word: בְּרֹאשֶׁךָ
  choice: auf deinen eigenen Kopf
  rationale: Die körperhafte hebräische Vergeltungsformel wird beibehalten. „Eigenen“ verdeutlicht im Deutschen die Rückwirkung auf den Täter, ohne eine zusätzliche Aussage einzuführen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen יְהוָה. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Göttliche Urheberschaft der Vergeltung
  choice: Jahwe hat dein Böses auf deinen eigenen Kopf zurückfallen lassen
  alternative: Jahwe hat dir dein Böses vergolten
  rationale: Die Fassung schreibt die Rückkehr des Bösen wie der hebräische Text ausdrücklich Jahwe zu, bewahrt aber zugleich das Rückkehrbild des Verbs, statt es ausschließlich als abstrakte Vergeltung auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „wissen/kennen“ und die Rede vom wissenden Herzen spiegeln bewusst die markante hebräische Formulierung; „auf deinen eigenen Kopf“ erhält das konkrete Vergeltungsbild.
