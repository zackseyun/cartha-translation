base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/031.yaml
  text: Then the king said to him[a], “Do as he has said, and strike him down and bury him[b], and remove from me and from my father’s house the innocent blood that Joab shed.”
translation:
  language: de
  text: 'Da sagte der König zu ihm: „Tu, was er gesagt hat: Stürz dich auf ihn[a] und begrabe ihn. Nimm so von mir und vom Haus meines Vaters das unschuldige Blut[b] hinweg, das Joab vergossen hat.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Töte ihn“. Wörtlich: „Fall über ihn her“; das hebräische Verb bezeichnet hier im Zusammenhang die tödliche Vollstreckung des Urteils.'
    reason: lexical_alternative
  - marker: b
    text: „Unschuldiges Blut“ bezeichnet Blut, das ohne rechtmäßigen Grund vergossen wurde, und schließt den Gedanken der dadurch entstandenen Blutschuld ein.
    reason: cultural_note
lexical_decisions:
- source_word: עֲשֵׂה כַּאֲשֶׁר דִּבֶּר
  choice: Tu, was er gesagt hat
  rationale: Gibt die unmittelbare Aufforderung natürlich und direkt wieder; das Perfekt passt im Deutschen zum gerade zuvor Gesagten.
- source_word: וּפְגַע בּוֹ
  choice: Stoß ihn nieder
  rationale: פגע mit ב bezeichnet hier im Hinrichtungskontext einen tödlichen Angriff. „Stoß ihn nieder“ bewahrt die konkrete Gewaltsprache, ohne das Verb lediglich mit „töte“ zu verallgemeinern.
- source_word: וּקְבַרְתּוֹ
  choice: und begrabe ihn
  rationale: Entspricht der anschließenden ausdrücklichen Anweisung zur Bestattung.
- source_word: וַהֲסִירֹתָ
  choice: Beseitige so
  rationale: Bewahrt den Anschluss an die vorausgehenden Befehle und lässt zugleich den Ergebnis- beziehungsweise Zweckzusammenhang erkennen, ohne ihn eindeutig auf nur eine syntaktische Deutung festzulegen.
- source_word: דְּמֵי חִנָּם
  choice: das unschuldige Blut
  rationale: Die konkrete hebräische Rechts- und Moralsprache bleibt erhalten; gemeint ist Blut, das ohne rechtmäßigen Grund vergossen wurde, samt der daraus erwachsenden Blutschuld.
- source_word: מֵעָלַי וּמֵעַל בֵּית אָבִי
  choice: von mir und vom Haus meines Vaters
  rationale: Gibt das Bild einer auf Personen beziehungsweise einem Haus lastenden und von ihnen zu entfernenden Schuld in natürlichem Deutsch wieder.
theological_decisions:
- issue: Haftung für Joabs unschuldiges Blut
  choice: Die konkrete Formulierung „das unschuldige Blut … von mir und vom Haus meines Vaters beseitigen“ bleibt stehen.
  alternative: Abstrakt mit „uns von der Blutschuld reinigen“ übersetzen.
  rationale: Der hebräische Text verbindet unschuldig vergossenes Blut bildhaft mit einer Last auf Salomo und dem Haus seines Vaters. Die Übersetzung bewahrt diese rechtlich-theologische Spannung, statt Art und Umfang ihrer Verantwortung näher zu bestimmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Befehlsform und die konkrete Bildsprache des Hebräischen bleiben erhalten. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
