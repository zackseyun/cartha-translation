  edition: WLC
  text: וַ/יֻּגַּ֞ד לַ/מֶּ֣לֶךְ שְׁלֹמֹ֗ה כִּ֣י נָ֤ס יוֹאָב֙ אֶל אֹ֣הֶל יְהוָ֔ה וְ/הִנֵּ֖ה אֵ֣צֶל הַ/מִּזְבֵּ֑חַ וַ/יִּשְׁלַ֨ח שְׁלֹמֹ֜ה אֶת בְּנָיָ֧הוּ בֶן יְהוֹיָדָ֛ע לֵ/אמֹ֖ר לֵ֥ךְ פְּגַע בּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/029.yaml
  text: And it was reported to King Solomon that Joab had fled to the tent of Yahweh[a], and behold, he was beside the altar. So Solomon sent Benaiah son of Jehoiada, saying, “Go[b], strike him down.”
translation:
  language: de
  text: 'Dem König Salomo wurde berichtet, dass Joab zum Zelt Jahwes[a] geflohen war; und siehe, er war neben dem Altar. Da sandte Salomo Benaja, den Sohn Jojadas, und sagte zu ihm: »Geh und erschlag ihn[b]!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: »zum Zelt des HERRN«; אֹהֶל bedeutet wörtlich »Zelt«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »greif ihn an« beziehungsweise »stoß ihn nieder«. Das hebräische Verb kann einen Angriff oder Schlag bezeichnen; im Zusammenhang ist ein tödlicher Schlag gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: wurde berichtet
  rationale: Das Hophal von נגד bezeichnet hier das Übermitteln einer Nachricht und wird im Deutschen natürlich als unpersönliches Passiv wiedergegeben.
- source_word: נָס
  choice: geflohen war
  rationale: Das Plusquamperfekt macht deutlich, dass Joabs Flucht der Meldung vorausging.
- source_word: אֶל אֹהֶל יְהוָה
  choice: zum Zelt Jahwes
  rationale: אֹהֶל bedeutet wörtlich »Zelt«; der Gottesname יְהוָה wird als »Jahwe« wiedergegeben.
- source_word: וְהִנֵּה
  choice: und siehe
  rationale: Die aufmerksamkeitslenkende, erzählerisch lebhafte Funktion von הִנֵּה bleibt erhalten.
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: er war neben dem Altar
  rationale: אֵצֶל bezeichnet räumliche Nähe; »neben« ist präzise und idiomatisch.
- source_word: וַיִּשְׁלַח
  choice: Da sandte
  rationale: »Da« gibt den Fortgang und den folgernden Zusammenhang der Erzählung natürlich wieder.
- source_word: בְּנָיָהוּ בֶן יְהוֹיָדָע
  choice: Benaja, den Sohn Jojadas
  rationale: Die Apposition gibt das hebräische Patronym klar und in gebräuchlicher deutscher Form wieder.
- source_word: לֵאמֹר
  choice: und ließ ihm sagen
  rationale: Im Zusammenhang mit »sandte« ist diese deutsche Konstruktion natürlicher als das wörtliche Partizip »sagend« und bewahrt die Einführung direkter Rede.
- source_word: לֵךְ
  choice: Geh
  rationale: Direkte Wiedergabe des einfachen Imperativs von הלך.
- source_word: פְּגַע בּוֹ
  choice: erschlag ihn
  rationale: פגע mit ב bezeichnet hier im Hinrichtungskontext einen tödlichen Angriff. »Erschlag ihn« bewahrt den Aspekt des gewaltsamen Zuschlagens, ohne lediglich das Ergebnis »töte ihn« zu nennen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יְהוָה. »Jahwe« gibt ihn als Namen wieder; die traditionelle Ersatzlesung »der HERR« wird als Fußnotenalternative genannt.
- issue: Joabs Stellung am Altar
  choice: neben dem Altar
  alternative: am Altar
  rationale: Der Vers sagt mit אֵצֶל lediglich, dass Joab sich beim beziehungsweise neben dem Altar befand. Eine ausdrückliche Aussage, dass er die Hörner des Altars festhielt, wird aus dem weiteren Kontext nicht in diesen Vers hineingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erzählerischer Klarheit. »Und siehe« bewahrt bewusst den markierten biblischen Erzählton; ansonsten wurden schwerfällige Hebraismen vermieden.
