  text: וְ/הַ/בַּ֨יִת֙ בְּ/הִבָּ֣נֹת֔/וֹ אֶֽבֶן שְׁלֵמָ֥ה מַסָּ֖ע נִבְנָ֑ה וּ/מַקָּב֤וֹת וְ/הַ/גַּרְזֶן֙ כָּל כְּלִ֣י בַרְזֶ֔ל לֹֽא נִשְׁמַ֥ע בַּ/בַּ֖יִת בְּ/הִבָּנֹתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/007.yaml
  text: The house[a], when it was built, was built of finished stone quarried in advance; and no hammer or axe or any iron tool was heard in the house while it was being built.
translation:
  language: de
  text: Das Haus wurde bei seinem Bau aus vollständig zugerichteten Steinen vom Steinbruch[a] errichtet. Weder Hammer noch Axt noch irgendein eisernes Werkzeug war im Haus zu hören, während es gebaut wurde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Steinbruch fertig zugerichtet“. Der seltene hebräische Fachausdruck מַסָּע kann sich auf den Steinbruch, das Brechen der Steine oder darauf beziehen, dass sie bereits bearbeitet von dort herbeigebracht wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבַּיִת
  choice: das Haus
  rationale: Das hebräische Wort bedeutet unmittelbar „Haus“. Im Zusammenhang bezeichnet es den Tempel; „Haus“ bewahrt jedoch die Ausdrucksweise des Ausgangstextes.
- source_word: בְּהִבָּנֹתוֹ
  choice: bei seinem Bau / während es gebaut wurde
  rationale: Die Infinitivkonstruktion mit בְּ bezeichnet den zeitlichen Begleitumstand. Die beiden Wiedergaben sind idiomatisch und bewahren beim zweiten Vorkommen den durativen Sinn.
- source_word: אֶבֶן שְׁלֵמָה
  choice: vollständig zugerichtete Steine
  rationale: שְׁלֵמָה bezeichnet Vollständigkeit oder Unversehrtheit. Im Bauzusammenhang sind damit Steine gemeint, deren Bearbeitung vor dem Einbau abgeschlossen war.
- source_word: מַסָּע
  choice: vom Steinbruch
  rationale: Der seltene Fachausdruck dürfte sich auf den Steinbruch, das Brechen der Steine oder ihren Transport von dort beziehen. Die knappe Wiedergabe wahrt diese Mehrdeutigkeit; die Fußnote nennt eine mögliche präzisierende Lesart.
- source_word: נִבְנָה
  choice: wurde ... errichtet
  rationale: Das Nifal-Perfekt beschreibt, auf welche Weise der Bau ausgeführt wurde. „Errichtet“ ist in diesem Baukontext natürlich.
- source_word: מַקָּבוֹת
  choice: Hammer
  rationale: Obwohl die hebräische Form pluralisch ist, werden hier Werkzeugarten aufgezählt; der deutsche Singular ist dafür idiomatisch.
- source_word: הַגַּרְזֶן
  choice: Axt
  rationale: „Axt“ ist die naheliegende Bedeutung; eine Deutung als Dechsel bleibt möglich, ist aber weniger sicher.
- source_word: כָּל כְּלִי בַרְזֶל
  choice: irgendein eisernes Werkzeug
  rationale: כָּל hat hier distributiven Sinn. Die Formulierung bringt die umfassende Aussage idiomatisch zum Ausdruck.
- source_word: לֹא נִשְׁמַע
  choice: war ... nicht zu hören
  rationale: Das passive Nifal bedeutet „wurde nicht gehört“; mit der vorangestellten Aufzählung ist „weder ... noch ... war zu hören“ im Deutschen natürlich.
theological_decisions: []
