  text: And he overlaid the cherubim with gold[a].
translation:
  language: de
  text: Und er überzog die Kerubim mit Gold.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er bedeckte die Kerubim mit Gold“ beziehungsweise „Er vergoldete die Kerubim“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַף
  choice: überzog
  rationale: Das Verb צפה bezeichnet im Zusammenhang des Tempelbaus das Bedecken eines Gegenstands mit einer Materialschicht, hier mit Gold. „überziehen“ ist dafür im modernen Deutschen natürlich und präzise.
- source_word: אֶת
  choice: unübersetzt (Akkusativobjekt)
  rationale: אֶת kennzeichnet „die Kerubim“ als bestimmtes direktes Objekt und besitzt kein eigenständiges deutsches Äquivalent.
- source_word: הַכְּרוּבִים
  choice: die Kerubim
  rationale: „Kerubim“ ist die im Deutschen etablierte, dem Hebräischen entsprechende Pluralform und bewahrt den Bezug zu den geflügelten Gestalten der Tempelausstattung.
- source_word: זָהָב
  choice: mit Gold
  rationale: Das Substantiv bezeichnet das Material des Überzugs. Nach „überziehen“ gibt „mit Gold“ die hebräische Konstruktion idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch; knappe Satzstruktur entsprechend dem hebräischen Text. „Kerubim“ wahrt die traditionelle sachliche Bezeichnung, ohne zusätzliche Deutung.
