  text: וְ/הַ/בַּ֗יִת אֲשֶׁ֨ר בָּנָ֜ה הַ/מֶּ֤לֶךְ שְׁלֹמֹה֙ לַֽ/יהוָ֔ה שִׁשִּֽׁים אַמָּ֥ה אָרְכּ֖/וֹ וְ/עֶשְׂרִ֤ים רָחְבּ֑/וֹ וּ/שְׁלֹשִׁ֥ים אַמָּ֖ה קוֹמָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/002.yaml
  text: The house that King Solomon built for Yahweh was sixty cubits long[a], twenty cubits wide[c][b], and thirty cubits high.
translation:
  language: de
  text: Das Haus, das König Salomo für Jahwe baute, war sechzig Ellen lang, zwanzig Ellen breit[a] und dreißig Ellen hoch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und seine Breite zwanzig“; die Maßeinheit „Ellen“ steht in diesem Satzglied nicht noch einmal im Hebräischen, ist aber aus dem Zusammenhang zu ergänzen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבַּיִת
  choice: Das Haus
  rationale: בַּיִת bedeutet wörtlich „Haus“ und bezeichnet hier den Tempelbau. „Haus“ bewahrt zugleich die hebräische Ausdrucksweise und ihre theologische Resonanz. Das einleitende וְ wird im Deutschen nicht eigens wiedergegeben, da ein „Und“ im isolierten Vers unnötig schwerfällig wäre.
- source_word: אֲשֶׁר בָּנָה הַמֶּלֶךְ שְׁלֹמֹה
  choice: das König Salomo … baute
  rationale: Die Relativkonstruktion wird in natürlicher deutscher Wortstellung wiedergegeben; das Qal-Perfekt bezeichnet hier den vollzogenen Bau.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition לְ bezeichnet hier Zweck beziehungsweise Widmung; „für“ ist daher idiomatisch. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: שִׁשִּׁים אַמָּה אָרְכּוֹ
  choice: sechzig Ellen lang
  rationale: Die hebräische Maßangabe mit „seine Länge“ lässt sich im Deutschen präzise und natürlich als „sechzig Ellen lang“ ausdrücken.
- source_word: וְעֶשְׂרִים רָחְבּוֹ
  choice: zwanzig Ellen breit
  rationale: Im Hebräischen wird die Maßeinheit in diesem Glied nicht wiederholt, ist aber aus der parallelen Maßreihe eindeutig zu ergänzen. Im Deutschen vermeidet die Wiederholung von „Ellen“ eine missverständliche oder unvollständige Formulierung.
- source_word: וּשְׁלֹשִׁים אַמָּה קוֹמָתוֹ
  choice: dreißig Ellen hoch
  rationale: קוֹמָה bezeichnet hier die Höhe; die deutsche Maßkonstruktion gibt den Sinn knapp und genau wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen יהוה. „Jahwe“ macht den Namen im Haupttext sichtbar; die traditionelle Wiedergabe „der HERR“ bleibt als mögliche Übersetzungstradition zu beachten, wird hier aber nicht eingesetzt.
- issue: Bezeichnung des Tempels als בַּיִת
  choice: Haus
  alternative: Tempel
  rationale: „Haus“ ist die unmittelbare lexikalische Entsprechung und bewahrt die im Hebräischen angelegte Vorstellung eines für Jahwe errichteten Hauses, ohne den sachlich richtigen Kontextbegriff „Tempel“ in den Text einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Maße werden in der im Deutschen üblichen Form „Ellen lang/breit/hoch“ angegeben. Auf ein einleitendes „Und“ wird zugunsten eines natürlichen deutschen Satzbeginns verzichtet; die Bezeichnung „Haus“ bleibt zur Wahrung der hebräischen Bildsprache erhalten.
