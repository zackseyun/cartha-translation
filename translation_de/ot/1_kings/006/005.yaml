base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/005.yaml
  text: He built against the wall of the house a structure all around[a], against the walls of the house all around, around both the nave and the inner sanctuary[c][b]; and he made side rooms all around.
translation:
  language: de
  text: Er baute an der Wand des Tempelhauses einen umlaufenden Anbau[a], an den Wänden des Tempelhauses rings um die Haupthalle[b] und das innere Heiligtum[c]; und er baute ringsum Seitenräume.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine umlaufende Nebenanlage“. Das seltene hebräische Wort יצוע bezeichnet hier die Baustruktur rings um die Tempelwände.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort הֵיכָל bezeichnet hier die Haupthalle des Tempels, unterschieden vom inneren Heiligtum.
    reason: cultural_note
  - marker: c
    text: 'Oder: „das Allerheiligste“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Er baute
  rationale: Das Wayyiqtol von בנה wird in einer natürlichen deutschen Erzählung mit dem Präteritum wiedergegeben.
- source_word: עַל קִיר הַבַּיִת
  choice: an die Wand des Tempelhauses
  rationale: עַל bezeichnet hier im Bauzusammenhang das Anfügen an die Wand, nicht zwingend ein Bauen oben auf der Wand. „Tempelhaus“ macht den im Kontext eindeutigen Bezug verständlich.
- source_word: יצוע
  choice: einen Anbau
  rationale: Das seltene Substantiv bezeichnet hier offenbar eine umlaufende, an den Tempel angefügte Baustruktur. „Anbau“ bleibt architektonisch allgemein und nimmt die anschließend genannten Seitenräume nicht vorweg.
- source_word: סָבִיב
  choice: ringsum
  rationale: Die Wiederholung von סָבִיב wird beibehalten, um die umlaufende Anordnung hervorzuheben.
- source_word: אֶת קִירוֹת הַבַּיִת
  choice: an die Wände des Tempelhauses
  rationale: Der ausdrückliche Plural קִירוֹת wird als „Wände“ bewahrt; „an“ gibt die bauliche Angliederung idiomatisch wieder.
- source_word: לַהֵיכָל
  choice: an die Haupthalle
  rationale: הֵיכָל bezeichnet hier den Hauptraum des Tempels im Unterschied zum inneren Heiligtum. „Haupthalle“ ist verständlich und architektonisch passend.
- source_word: וְלַדְּבִיר
  choice: an das innere Heiligtum
  rationale: דְּבִיר bezeichnet den innersten Kultraum. „Inneres Heiligtum“ gibt dies klar wieder, ohne die mögliche traditionelle Benennung im Haupttext festzuschreiben.
- source_word: וַיַּעַשׂ צְלָעוֹת
  choice: er legte Seitenräume an
  rationale: צְלָעוֹת kann wörtlich „Seiten“ oder „Rippen“ bedeuten, bezeichnet im architektonischen Zusammenhang jedoch die seitlich angeordneten Räume. „Anlegen“ ist für deren bauliche Herstellung natürliches Deutsch.
theological_decisions:
- issue: Benennung des דְּבִיר
  choice: inneres Heiligtum
  alternative: Allerheiligstes
  rationale: „Inneres Heiligtum“ bildet die räumliche Bedeutung unmittelbar ab und vermeidet es, die vertraute, aber stärker traditionsgeprägte Bezeichnung „Allerheiligstes“ ohne Hinweis in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die auffällige Wiederholung von „ringsum“ folgt bewusst dem Hebräischen. Die Satzstruktur bleibt relativ quellennah, ohne die seltenen Architekturbegriffe spekulativ genauer festzulegen.
