- from: Er baute an die Wand des Tempelhauses ringsum einen Anbau[a], ringsum an die Wände des Tempelhauses, sowohl an die Haupthalle[b] als auch an das innere Heiligtum[c]; und er legte ringsum Seitenräume an.
  to: Er baute an der Wand des Tempelhauses einen umlaufenden Anbau[a], an den Wänden des Tempelhauses rings um die Haupthalle[b] und das innere Heiligtum[c]; und er baute ringsum Seitenräume.
  rationale: Die Revision ordnet die Satzglieder so, dass der Anbau an den Tempelwänden und seine umlaufende Lage um Haupthalle und inneres Heiligtum klar hervortreten. Sie bewahrt die zurückhaltenden architektonischen Bezeichnungen und die wiederholte Umschließungsangabe, ohne eine detaillierte Rekonstruktion des seltenen יצוע festzulegen.
