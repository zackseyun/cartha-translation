base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/006.yaml
  text: The lowest story was five cubits wide[a], the middle one six cubits wide, and the third seven cubits wide; for he made offsets around the outside of the temple[b], so that the beams would not be inserted into the walls of the temple.
translation:
  language: de
  text: Das unterste Stockwerk war fünf Ellen breit, das mittlere sechs Ellen und das dritte sieben Ellen. Denn er versah das Tempelhaus außen ringsum mit Rücksprüngen[a], damit die Balken nicht in den Wänden des Tempelhauses Halt fanden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Abstufungen; möglicherweise auch: Vorsprünge. Gemeint ist eine bauliche Staffelung an der Außenwand.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „damit nicht an den Wänden des Hauses Halt gefasst werde“. Die Balken sind im Hebräischen nicht ausdrücklich genannt; gemeint ist wohl, dass die Tragbalken der Seitenkonstruktion nicht in die Tempelwände eingelassen oder dort befestigt wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: היצוע הַתַּחְתֹּנָה
  choice: das unterste Stockwerk
  rationale: היצוע bezeichnet hier die mehrstöckige Seitenkonstruktion am Tempel. „Stockwerk“ gibt die jeweilige Ebene in verständlichem, modernem Deutsch wieder; „unterste“ entspricht der dreistufigen Folge.
- source_word: בָּאַמָּה רָחְבָּהּ
  choice: war … Ellen breit
  rationale: Die antike Maßeinheit bleibt erhalten; die prädikative Wendung wird im Deutschen idiomatisch mit „war … breit“ wiedergegeben.
- source_word: הַתִּיכֹנָה … הַשְּׁלִישִׁית
  choice: das mittlere … das dritte
  rationale: Die substantivierten Adjektive beziehen sich auf das zuvor genannte Stockwerk. Die knappe Form vermeidet unnötige Wiederholung.
- source_word: מִגְרָעוֹת
  choice: Absätze
  rationale: Das Wort bezeichnet bauliche Rücksprünge oder Abstufungen an der Außenwand. „Absätze“ ist verständlich und lässt die genaue architektonische Ausformung offen.
- source_word: לַבַּיִת סָבִיב חוּצָה
  choice: außen rings um das Tempelhaus
  rationale: Die räumliche Doppelangabe wird natürlich wiedergegeben. „Tempelhaus“ verdeutlicht den Bezug, ohne das wiederholte הַבַּיִת unterschiedlich zu übersetzen.
- source_word: לְבִלְתִּי אֲחֹז בְּקִירוֹת הַבָּיִת
  choice: damit man nicht in die Wände des Tempelhauses eingreifen musste
  rationale: Der hebräische Text nennt die Balken nicht ausdrücklich. Die unpersönliche Form bewahrt diese Implizitheit und gibt den Zweck der Konstruktion wieder, ohne ein nicht genanntes Subjekt in den Haupttext einzutragen.
