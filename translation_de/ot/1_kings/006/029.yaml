base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/029.yaml
  text: He carved all the walls of the house all around with engraved figures of cherubim[a], palm trees, and open flowers[c][b], on the inner and outer walls.
translation:
  language: de
  text: Alle Wände des Hauses ringsum versah er mit Schnitzereien von Keruben, Palmen und geöffneten Blüten[a], innen und außen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Blütenknospen“ beziehungsweise „aufblühende Blumen“. Gemeint sind florale Schmuckformen; ihre genaue Gestalt ist unsicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „von innen und zum Äußeren hin“. Die knappe hebräische Wendung kann sich auf innere und äußere Bereiche beziehungsweise Wandflächen des Heiligtums beziehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל קִירוֹת הַבַּיִת
  choice: alle Wände des Hauses
  rationale: Bewahrt die wörtliche Bezeichnung „Haus“, die im Zusammenhang den Tempel meint, und gibt den Plural קִירוֹת direkt wieder.
- source_word: מֵסַב
  choice: ringsum
  rationale: Natürliches, knappes Deutsch für die vollständige umlaufende Ausdehnung.
- source_word: קָלַע פִּתּוּחֵי מִקְלְעוֹת
  choice: versah er mit Schnitzereien
  rationale: Gibt die ornamental ausgeführten Schnitzarbeiten idiomatisch wieder, ohne eine technisch nicht gesicherte Reliefart festzulegen.
- source_word: כְּרוּבִים
  choice: Keruben
  rationale: Eingebürgerte deutsche Bibelbezeichnung für die himmlischen Wesen; vermeidet die kunstgeschichtlich anders geprägte Form „Putten“.
- source_word: תִמֹרֹת
  choice: Palmen
  rationale: Bezeichnet hier dekorative Palmenformen; „Palmen“ ist klar und natürlich.
- source_word: פְטוּרֵי צִצִּים
  choice: geöffnete Blüten
  rationale: Gibt das Bild sich öffnender beziehungsweise aufgeblühter floraler Ornamente wieder; die genaue künstlerische Form bleibt unsicher und wird in der Fußnote kenntlich gemacht.
- source_word: מִלִּפְנִים וְלַחִיצוֹן
  choice: im inneren wie im äußeren Bereich
  rationale: Bewahrt den räumlichen Gegensatz, ohne die grammatisch knappe und auslegungsbedürftige Wendung vorschnell auf Räume, Wandseiten oder die Außenfassade festzulegen.
