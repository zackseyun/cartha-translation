language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/לִ/פְנֵ֣י הַ/דְּבִ֡יר עֶשְׂרִים֩ אַמָּ֨ה אֹ֜רֶךְ וְ/עֶשְׂרִ֧ים אַמָּ֣ה רֹ֗חַב וְ/עֶשְׂרִ֤ים אַמָּה֙ קֽוֹמָת֔/וֹ וַ/יְצַפֵּ֖/הוּ זָהָ֣ב סָג֑וּר וַ/יְצַ֥ף מִזְבֵּ֖חַ אָֽרֶז׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/020.yaml
  text: In front of the inner sanctuary was twenty cubits in length[a], twenty cubits in width, and twenty cubits in its height. He overlaid it with pure gold[b], and he overlaid the cedar altar.
translation:
  language: de
  text: Und der Innenraum war zwanzig Ellen lang, zwanzig Ellen breit und zwanzig Ellen hoch. Er überzog ihn mit Feingold[a] und überzog den Zedernholzaltar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »reinem Gold«. Der hebräische Ausdruck bezeichnet hochwertiges, geläutertes Gold.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »einen Altar aus Zedernholz«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִפְנֵי הַדְּבִיר
  choice: Und der Innenraum
  rationale: 'Die masoretische Formulierung ist syntaktisch schwierig: לִפְנֵי bedeutet gewöhnlich »vor«, doch die folgenden Maße und das pronominale Objekt von וַיְצַפֵּהוּ beziehen sich im Kontext am ehesten auf den Innenraum selbst. Die Übersetzung folgt daher dem sachlichen Bezug, ohne ein räumliches »davor« zu ergänzen, das im Deutschen keinen klaren Gegenstand hätte.'
- source_word: הַדְּבִיר
  choice: der Innenraum
  rationale: דְּבִיר bezeichnet den innersten Kultraum des Tempels. »Innenraum« ist verständlich und wahrt die architektonische Bezeichnung, ohne die stärker deutende Benennung »Allerheiligstes« in den Haupttext einzutragen.
- source_word: עֶשְׂרִים אַמָּה ... אֹרֶךְ / רֹחַב / קוֹמָתוֹ
  choice: zwanzig Ellen lang, zwanzig Ellen breit und zwanzig Ellen hoch
  rationale: Die knappe deutsche Maßformel gibt alle drei Abmessungen genau wieder. Die historische Maßeinheit »Elle« bleibt erhalten.
- source_word: וַיְצַפֵּהוּ
  choice: Er überzog ihn
  rationale: צפה bezeichnet hier das Belegen beziehungsweise Überziehen einer Oberfläche mit Gold; »überziehen« ist im Deutschen für die Tempelbeschreibung präzise und natürlich.
- source_word: זָהָב סָגוּר
  choice: Feingold
  rationale: Die seltene Verbindung bezeichnet hochwertiges beziehungsweise geläutertes Gold. »Feingold« gibt diese Qualitätsangabe knapp wieder, ohne einen technisch exakten modernen Reinheitsgrad zu behaupten.
- source_word: וַיְצַף מִזְבֵּחַ אָרֶז
  choice: und überzog den Zedernholzaltar
  rationale: Die knappe hebräische Wortfolge bezeichnet wahrscheinlich einen aus Zedernholz gefertigten Altar. Das bestimmte deutsche Substantiv passt zum bereits bekannten Tempelgegenstand im Kontext.
theological_decisions:
- issue: Benennung des דְּבִיר
  choice: Innenraum
  alternative: Allerheiligstes
  rationale: Die architektonisch-neutrale Wiedergabe vermeidet, eine traditionelle kulttheologische Bezeichnung stärker in den Vers einzutragen, als das einzelne hebräische Wort verlangt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper architektonischer Maßformel. Die schwierige Anfangssyntax wird lesbar wiedergegeben; die seltene Goldbezeichnung und die kompakte Formulierung zum Altar werden durch Fußnoten transparent gemacht.
