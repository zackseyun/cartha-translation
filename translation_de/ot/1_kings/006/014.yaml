  text: וַ/יִּ֧בֶן שְׁלֹמֹ֛ה אֶת הַ/בַּ֖יִת וַ/יְכַלֵּֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/014.yaml
  text: So Solomon built the house and finished it[a].
translation:
  language: de
  text: So baute Salomo das Haus und vollendete es.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Tempel“. Wörtlich steht im Hebräischen „das Haus“, eine in diesem Zusammenhang übliche Bezeichnung für den Tempel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: baute
  rationale: Das Qal-Wayyiqtol von בנה schildert in der Erzählfolge eine vergangene Handlung. „Baute“ ist die natürliche und sachlich genaue deutsche Wiedergabe.
- source_word: שְׁלֹמֹה
  choice: Salomo
  rationale: Die im modernen Standarddeutsch etablierte Form des hebräischen Personennamens.
- source_word: הַבַּיִת
  choice: das Haus
  rationale: בַּיִת bedeutet wörtlich „Haus“ und bezeichnet hier den Tempel. Die Wiedergabe „das Haus“ bewahrt die Ausdrucksweise des Hebräischen; der Kontext und die Fußnote verdeutlichen den Bezug.
- source_word: וַיְכַלֵּהוּ
  choice: vollendete es
  rationale: Die Piel-Form von כלה mit Suffix der 3. Person Singular bedeutet, etwas zu Ende zu bringen. „Vollendete es“ gibt sowohl den Abschluss als auch den Rückbezug auf „das Haus“ prägnant wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe hebräische Erzählstruktur und die Wiederaufnahme des Objekts durch „es“ bleiben erhalten.
