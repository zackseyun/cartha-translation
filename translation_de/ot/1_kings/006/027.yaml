source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן אֶת הַ/כְּרוּבִ֜ים בְּ/ת֣וֹךְ הַ/בַּ֣יִת הַ/פְּנִימִ֗י וַֽ/יִּפְרְשׂוּ֮ אֶת כַּנְפֵ֣י הַ/כְּרֻבִים֒ וַ/תִּגַּ֤ע כְּנַף הָֽ/אֶחָד֙ בַּ/קִּ֔יר וּ/כְנַף֙ הַ/כְּר֣וּב הַ/שֵּׁנִ֔י נֹגַ֖עַת בַּ/קִּ֣יר הַ/שֵּׁנִ֑י וְ/כַנְפֵי/הֶם֙ אֶל תּ֣וֹךְ הַ/בַּ֔יִת נֹגְעֹ֖ת כָּנָ֥ף אֶל כָּנָֽף־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/027.yaml
  text: He placed the cherubim inside the inner house[a], and the cherubim spread out their wings, so that the wing of the one touched the wall, and the wing of the second cherub touched the other wall; and their wings toward the middle of the house were touching wing to wing.
translation:
  language: de
  text: 'Er stellte die Cherubim in das innere Haus[a]. Die Cherubim breiteten ihre Flügel aus: Der Flügel des einen berührte die Wand, und der Flügel des zweiten Cherubs berührte die andere Wand. Ihre zum Inneren des Hauses gerichteten Flügel berührten einander, Flügel an Flügel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in das innere Heiligtum“. Wörtlich steht im Hebräischen „in das innere Haus“; gemeint ist der innerste Raum des Tempels.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Er stellte
  rationale: נתן bedeutet grundsätzlich „geben, setzen, stellen“. Im architektonischen Zusammenhang bezeichnet „stellte“ natürlich und präzise das Positionieren der Cherubim.
- source_word: הַכְּרוּבִים
  choice: die Cherubim
  rationale: „Cherubim“ bewahrt die im Deutschen gebräuchliche, würdige Bezeichnung dieser himmlischen Wesen und den kultischen Sprachton.
- source_word: בְּתוֹךְ הַבַּיִת הַפְּנִימִי
  choice: mitten in das innere Haus
  rationale: Die Wiedergabe bleibt nahe bei בַּיִת „Haus“ und gibt בְּתוֹךְ als räumliche Lage im Inneren wieder. Im Kontext bezeichnet das „innere Haus“ den innersten Tempelraum.
- source_word: וַיִּפְרְשׂוּ אֶת כַּנְפֵי הַכְּרֻבִים
  choice: Die Cherubim breiteten ihre Flügel aus
  rationale: Die hebräische Formulierung lautet formal „sie breiteten die Flügel der Cherubim aus“; aus dem Zusammenhang sind die Cherubim selbst das natürliche Subjekt. Die deutsche Fassung gibt dies klar und idiomatisch wieder.
- source_word: וַתִּגַּע / נֹגַעַת / נֹגְעֹת
  choice: berührte / berührten
  rationale: נגע bezeichnet tatsächlichen Kontakt; „berühren“ wahrt dieses wiederholte räumliche Leitwort.
- source_word: כְּנַף הָאֶחָד
  choice: der Flügel des einen
  rationale: Diese Formulierung entspricht eng dem Hebräischen und vermeidet die nicht ausdrücklich genannte Ordnungszahl „ersten“.
- source_word: הַכְּרוּב הַשֵּׁנִי
  choice: der zweite Cherub
  rationale: „Der zweite Cherub“ bildet die hebräische Ordnungszahl direkt ab.
- source_word: הַקִּיר הַשֵּׁנִי
  choice: die andere Wand
  rationale: In der Gegenüberstellung zweier Wände ist „die andere Wand“ im Deutschen natürlicher als das wörtliche „die zweite Wand“ und bewahrt den räumlichen Sinn.
- source_word: וְכַנְפֵיהֶם אֶל תּוֹךְ הַבַּיִת
  choice: ihre zur Mitte des Hauses gerichteten Flügel
  rationale: אֶל תּוֹךְ beschreibt die Ausrichtung zum Inneren beziehungsweise zur Mitte. Die Formulierung macht verständlich, warum diese Flügel einander berühren.
- source_word: נֹגְעֹת כָּנָף אֶל כָּנָף
  choice: berührten einander, Flügel an Flügel
  rationale: Die idiomatische Wendung „berührten einander“ wird durch das bildhafte, quellennah wiedergegebene „Flügel an Flügel“ präzisiert.
theological_decisions: []
