  text: וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה אֶל שְׁלֹמֹ֖ה לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/011.yaml
  text: And the word of Yahweh came to Solomon[a], saying[b],
translation:
  language: de
  text: 'Da erging das Wort Jahwes an Salomo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Da erging
  rationale: Die Wayyiqtol-Form führt die Erzählung weiter. „Da erging“ gibt den hebräischen Erzählungsfortgang natürlich wieder, ohne das unpersönliche „Und es geschah“ unnötig auszuschreiben.
- source_word: דְּבַר
  choice: das Wort
  rationale: In der festen Wendung דְּבַר יְהוָה bezeichnet das Substantiv eine göttliche Mitteilung. „Das Wort“ bewahrt zugleich die wiederkehrende biblische Formel.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt. „Jahwe“ ist die im Deutschen übliche wissenschaftliche Umschrift.
- source_word: אֶל
  choice: an
  rationale: Bei der deutschen Wendung „das Wort erging“ bezeichnet „an“ idiomatisch den Empfänger der Mitteilung.
- source_word: שְׁלֹמֹה
  choice: Salomo
  rationale: Der Personenname wird nach der etablierten deutschen Namensform wiedergegeben.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv leitet den Inhalt der unmittelbar folgenden Rede ein. Im heutigen Deutsch erfüllt der Doppelpunkt diese Funktion natürlicher als das formelhafte „indem er sprach“ oder „mit den Worten“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. Die Wiedergabe „Jahwe“ erhält diesen als Namen, während „der HERR“ die traditionelle jüdisch-christliche Leseersetzung widerspiegelt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die vertraute Offenbarungsformel „das Wort Jahwes erging an“ wird bewahrt; לֵאמֹר wird vor der in Vers 12 folgenden direkten Rede idiomatisch durch einen Doppelpunkt dargestellt.
