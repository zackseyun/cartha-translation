translation:
  language: de
  text: und zwei Türen aus Zypressenholz[a]. Die eine Tür hatte zwei klappbare Türflügel[b], die zweite ebenfalls zwei klappbare Türflügel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: „Tannenholz“; das hebräische Wort bezeichnet wahrscheinlich Zypresse oder ein ähnliches Nadelholz.'
    reason: lexical_alternative
  - marker: b
    text: Die seltenen hebräischen Architekturbegriffe können auch Seitenteile oder Felder bezeichnen; die genaue Konstruktion der Türflügel ist unsicher.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַלְתוֹת
  choice: Türen
  rationale: Die Pluralform bezeichnet die beiden Türkonstruktionen; „Türen“ ist im Deutschen natürlich und entspricht dem anschließenden Singular für jede einzelne Tür.
- source_word: עֲצֵי בְרוֹשִׁים
  choice: aus Zypressenholz
  rationale: בְּרוֹשׁ bezeichnet wahrscheinlich Zypresse oder ein ähnliches Nadelholz. „Zypressenholz“ ist eine verbreitete moderne Wiedergabe, während die botanische Bestimmung unsicher bleibt.
- source_word: צְלָעִים / קְלָעִים
  choice: Türflügel
  rationale: Die seltenen Architekturbegriffe bezeichnen hier offenbar die beiden beweglichen Teile jeder Tür. Das einheitliche „Türflügel“ gibt den parallelen Aufbau verständlich wieder, ohne eine unbelegte technische Einzelheit auszubauen.
- source_word: גְּלִילִים
  choice: drehbaren
  rationale: Das Wort ist mit Rollen oder Drehen verbunden. „Drehbar“ bildet diese Bewegung unmittelbarer ab als „klappbar“ und ergibt zusammen mit „Türflügeln“ natürliches modernes Deutsch.
- source_word: הַדֶּלֶת הָאַחַת / הַדֶּלֶת הַשֵּׁנִית
  choice: die eine Tür / die zweite Tür
  rationale: Die Formulierung bewahrt die hebräische Gegenüberstellung der beiden Türen; „ebenso“ macht die elliptische Parallelkonstruktion im Deutschen lesbar.
