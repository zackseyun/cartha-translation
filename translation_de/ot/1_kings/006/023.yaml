source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ בַּ/דְּבִ֔יר שְׁנֵ֥י כְרוּבִ֖ים עֲצֵי שָׁ֑מֶן עֶ֥שֶׂר אַמּ֖וֹת קוֹמָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/023.yaml
  text: In the inner sanctuary he made two cherubim of olivewood[b][a], each ten cubits high.
translation:
  language: de
  text: Im innersten Heiligtum fertigte er zwei Kerubim aus Olivenholz an. Jeder war zehn Ellen hoch.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Seine Höhe betrug zehn Ellen.« Der Singular bezieht sich hier sinngemäß auf jeden der beiden Kerubim.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּדְּבִיר
  choice: im innersten Heiligtum
  rationale: דְּבִיר bezeichnet den innersten Raum des Tempels. »Innerstes Heiligtum« ist verständlich, würdevoll und gibt die räumliche wie kultische Funktion wieder, ohne die mögliche Wiedergabe »Allerheiligstes« zwingend festzulegen.
- source_word: כְרוּבִים
  choice: Kerubim
  rationale: Die eingedeutschte biblische Fachbezeichnung »Kerubim« bewahrt den spezifischen Wesenstyp und entspricht der hebräischen Pluralform.
- source_word: עֲצֵי שָׁמֶן
  choice: aus Olivenholz
  rationale: Die Wendung bezeichnet hier Holz des Ölbaums; im Tempelbaukontext ist »Olivenholz« die natürliche und sachlich passende Wiedergabe.
- source_word: עֶשֶׂר אַמּוֹת
  choice: zehn Ellen
  rationale: »Elle« ist die geläufige deutsche Bezeichnung für das antike Längenmaß אַמָּה.
- source_word: קוֹמָתוֹ
  choice: Jeder war zehn Ellen hoch
  rationale: Der hebräische Singular lautet wörtlich »seine Höhe«, wird bei den zwei Kerubim jedoch distributiv verstanden. Ein eigener Satz gibt diesen Sinn im Deutschen klar wieder.
- source_word: וַיַּעַשׂ
  choice: fertigte er … an
  rationale: עשה bedeutet grundsätzlich »machen/herstellen«. »Anfertigen« passt natürlich zur Herstellung der großen Holzfiguren.
theological_decisions: []
translation_notes:
  register: Modernes Standarddeutsch in einem klaren, würdevollen Erzählstil. Die Satzteilung vermeidet eine schwerfällige Konstruktion und macht den distributiven Sinn des hebräischen Singulars transparent. »Innerstes Heiligtum« wahrt gegenüber »Allerheiligstes« die lexikalische Offenheit.
