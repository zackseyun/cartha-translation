base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/008.yaml
  text: The entrance to the middle side chamber was on the right side of the house[a], and by winding stairs they went up to the middle story[b], and from the middle to the third.
translation:
  language: de
  text: Der Eingang zum mittleren Seitenraum lag an der rechten Seite des Hauses. Über gewundene Treppen[a] stieg man zum mittleren Stockwerk hinauf und vom mittleren zum dritten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »über Wendeltreppen«. Das seltene hebräische Wort bezeichnet wahrscheinlich gewundene oder spiralförmige Treppen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »vom mittleren zum dritten«, das heißt: vom mittleren Stockwerk zum dritten Stockwerk.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּתַח
  choice: Eingang
  rationale: Bezeichnet hier die Öffnung beziehungsweise den Zugang; »Eingang« ist im architektonischen Zusammenhang natürlich und klar.
- source_word: הַצֵּלָע הַתִּיכֹנָה
  choice: der mittlere Seitenraum
  rationale: צֵלָע bezeichnet beim Tempelbau einen seitlichen Raum oder Anbau, nicht wörtlich eine Rippe. Der Singular und die Bestimmung »mittlere« bleiben erhalten.
- source_word: אֶל כֶּתֶף הַבַּיִת הַיְמָנִית
  choice: lag an der rechten Seite des Hauses
  rationale: כֶּתֶף bedeutet wörtlich »Schulter«, bezeichnet architektonisch jedoch die Seite. יְמָנִית wird räumlich als »rechts« wiedergegeben, ohne es ausdrücklich als Himmelsrichtung »Süden« festzulegen.
- source_word: וּבְלוּלִּים
  choice: über Wendeltreppen
  rationale: Das seltene Wort wird traditionell und im Kontext plausibel als gewundene beziehungsweise spiralförmige Treppenanlage verstanden; die genaue Bauform bleibt unsicher und wird in der Fußnote kenntlich gemacht.
- source_word: יַעֲלוּ
  choice: stieg man hinauf
  rationale: Die dritte Person Plural hat hier unpersönlichen Sinn. Das deutsche »man« beschreibt natürlich, wie die oberen Ebenen erreicht wurden.
- source_word: עַל הַתִּיכֹנָה
  choice: zum mittleren Stockwerk
  rationale: Die Abfolge bis zum dritten Stockwerk zeigt, dass תִּיכֹנָה hier die mittlere Ebene des Seitenbaus bezeichnet.
- source_word: וּמִן הַתִּיכֹנָה אֶל הַשְּׁלִשִׁים
  choice: und vom mittleren zum dritten
  rationale: Die knappe hebräische Formulierung »vom mittleren zum dritten« wird beibehalten; »Stockwerk« ist aus dem unmittelbaren Zusammenhang zu ergänzen.
theological_decisions: []
