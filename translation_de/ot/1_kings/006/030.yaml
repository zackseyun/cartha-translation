  text: וְ/אֶת קַרְקַ֥ע הַ/בַּ֖יִת צִפָּ֣ה זָהָ֑ב לִ/פְנִ֖ימָה וְ/לַ/חִיצֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/030.yaml
  text: He overlaid the floor of the house with gold[b][a], on the inside and on the outside.
translation:
  language: de
  text: Den Fußboden des Hauses überzog er mit Gold, innen und außen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die knappe hebräische Wendung „innen und außen“ meint wahrscheinlich, dass der Fußboden durchgehend mit Gold überzogen war, vom inneren bis zum äußeren Bereich des Hauses.
    reason: cultural_note
lexical_decisions:
- source_word: קַרְקַע
  choice: Fußboden
  rationale: Im Zusammenhang mit dem Tempelbau bezeichnet das Wort die begehbare Bodenfläche des Gebäudes; „Fußboden“ ist im modernen Deutschen architektonisch eindeutig.
- source_word: הַבַּיִת
  choice: des Hauses
  rationale: Die hebräische Bezeichnung „das Haus“ wird bewahrt; im Kontext ist damit der Tempel gemeint.
- source_word: צִפָּה
  choice: überzog
  rationale: Das Verb bezeichnet das Belegen beziehungsweise Überziehen einer Oberfläche mit einem Material und passt zu den beschriebenen Bauarbeiten.
- source_word: זָהָב
  choice: mit Gold
  rationale: Die gewöhnliche und kontextuell eindeutige Bezeichnung des Materials.
- source_word: לִפְנִימָה וְלַחִיצוֹן
  choice: innen wie außen
  rationale: Die knappe räumliche Gegenüberstellung des Hebräischen wird natürlich wiedergegeben, ohne ihre genaue Reichweite im Haupttext festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wörtliche Tempelbezeichnung „Haus“ bleibt erhalten; „Fußboden“ vermeidet die im Deutschen mögliche Deutung von „Boden“ als Erdgrund. Die unklare räumliche Wendung wird knapp im Haupttext bewahrt und in der Fußnote erläutert.
