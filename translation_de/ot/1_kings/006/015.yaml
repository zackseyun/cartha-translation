base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/015.yaml
  text: He built the walls of the house on the inside with cedar boards[a]; from the floor of the house to the walls of the ceiling he covered them with wood on the inside[b], and he overlaid the floor of the house with boards of cypress.
translation:
  language: de
  text: Er baute die Wände des Hauses innen mit Zedernbrettern aus. Vom Fußboden des Hauses bis zu den Wänden der Decke[a] verkleidete er sie innen mit Holz. Den Fußboden des Hauses belegte er mit Zypressenbrettern[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die ungewöhnliche Wendung meint wahrscheinlich: bis zur Decke beziehungsweise zur inneren Dachverschalung.'
    reason: cultural_note
  - marker: b
    text: Die genaue Baumart ist unsicher; möglich sind auch Wacholder oder, nach traditioneller Übersetzung, Tanne.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן אֶת קִירוֹת הַבַּיִת מִבַּיְתָה
  choice: Er verkleidete die Wände des Hauses innen
  rationale: בנה bedeutet grundsätzlich »bauen«, bezeichnet hier zusammen mit der Holzangabe aber die bauliche Innenverkleidung der bereits errichteten Wände. »Verkleidete« gibt die konkrete Tätigkeit im Deutschen klar wieder.
- source_word: בְּצַלְעוֹת אֲרָזִים
  choice: mit Zedernbrettern
  rationale: צלעות kann Seitenteile, Rippen oder Bretter bezeichnen; im Zusammenhang der Wandverkleidung sind Bretter gemeint. ארזים bezeichnet Zedern.
- source_word: מִקַּרְקַע הַבַּיִת
  choice: vom Fußboden des Hauses
  rationale: קרקע bezeichnet hier die Bodenfläche im Inneren des Gebäudes; »Fußboden« ist der passende architektonische Ausdruck.
- source_word: עַד קִירוֹת הַסִּפֻּן
  choice: bis zu den Wänden der Decke
  rationale: Die ungewöhnliche hebräische Formulierung wird bewusst nahe am Wortlaut wiedergegeben. Gemeint ist wahrscheinlich die obere Begrenzung der Innenverkleidung an der Decke oder Dachverschalung.
- source_word: צִפָּה עֵץ מִבָּיִת
  choice: überzog er das Innere mit Holz
  rationale: צפה bezeichnet das Überziehen oder Verkleiden einer Oberfläche. »Das Innere« gibt die Ortsangabe מבית natürlich wieder, ohne ein im Hebräischen nicht ausdrücklich genanntes Objekt zu stark festzulegen.
- source_word: וַיְצַף אֶת קַרְקַע הַבַּיִת
  choice: Den Fußboden des Hauses belegte er
  rationale: Beim Boden klingt »belegen« im Deutschen natürlicher als »überziehen« und beschreibt das Anbringen der Bretter als Bodenbelag.
- source_word: בְּצַלְעוֹת בְּרוֹשִׁים
  choice: mit Zypressenbrettern
  rationale: צלעות bezeichnet hier Bretter. Die genaue Baumart von ברוש ist unsicher; »Zypresse« ist eine verbreitete moderne Wiedergabe, während traditionell auch »Tanne« und lexikalisch »Wacholder« vertreten werden.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Haus« bleibt als Bezeichnung des Tempelgebäudes erhalten und spiegelt den hebräischen Wortlaut. Die Wiederholung von »Haus« und die ungewöhnliche Deckenformulierung werden nicht eingeebnet; zugleich werden die Bautätigkeiten mit im Deutschen üblichen Verben ausgedrückt.
