  text: וְ/הָ/אוּלָ֗ם עַל פְּנֵי֙ הֵיכַ֣ל הַ/בַּ֔יִת עֶשְׂרִ֣ים אַמָּה֙ אָרְכּ֔/וֹ עַל פְּנֵ֖י רֹ֣חַב הַ/בָּ֑יִת עֶ֧שֶׂר בָּ/אַמָּ֛ה רָחְבּ֖/וֹ עַל פְּנֵ֥י הַ/בָּֽיִת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/003.yaml
  text: The portico in front of the nave of the house was twenty cubits long[a], across the width of the house[c][b], and ten cubits deep in front of the house.
translation:
  language: de
  text: Die Vorhalle vor dem Hauptraum des Hauses war zwanzig Ellen lang, entsprechend der Breite des Hauses, und zehn Ellen tief vor dem Haus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Ihre Breite vor dem Haus betrug zehn Ellen.« Gemeint ist die Ausdehnung der Vorhalle von vorn nach hinten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאוּלָם
  choice: die Vorhalle
  rationale: אוּלָם bezeichnet hier den vorgelagerten Eingangsbereich des Tempelgebäudes. »Vorhalle« ist im Deutschen natürlich und architektonisch passend.
- source_word: עַל־פְּנֵי הֵיכַל הַבַּיִת
  choice: vor dem Hauptraum des Hauses
  rationale: עַל־פְּנֵי bezeichnet die räumliche Lage davor; הֵיכַל meint hier den Hauptraum des Tempelgebäudes, nicht das gesamte Bauwerk.
- source_word: עֶשְׂרִים אַמָּה אָרְכּוֹ
  choice: war zwanzig Ellen lang
  rationale: Die antike Maßeinheit wird beibehalten; die prädikative Form gibt das Hebräische in natürlichem Deutsch wieder.
- source_word: עַל־פְּנֵי רֹחַב הַבָּיִת
  choice: erstreckte sich über die ganze Breite des Hauses
  rationale: Die Formulierung verdeutlicht, dass die Länge der Vorhalle entlang der Vorderseite der Breite des Hauses entsprach.
- source_word: עֶשֶׂר בָּאַמָּה רָחְבּוֹ
  choice: Ihre Tiefe … betrug zehn Ellen
  rationale: רֹחַב bedeutet wörtlich »Breite«; bei der vorgelagerten Halle bezeichnet das Maß räumlich jedoch deren Ausdehnung von vorn nach hinten. »Tiefe« verhindert eine Verwechslung mit der zuvor genannten Gebäudebreite.
- source_word: עַל־פְּנֵי הַבָּיִת
  choice: vor dem Haus
  rationale: Die räumliche Zuordnung wird knapp und entsprechend der wiederholten hebräischen Wendung wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Haus« bewahrt die hebräische Bezeichnung für den Tempelbau; »Hauptraum« unterscheidet הֵיכַל klar von Vorhalle und innerstem Heiligtum.
