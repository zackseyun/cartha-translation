base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/012.yaml
  text: As for this house that you are building[a], if you walk in my statutes, carry out my judgments, and keep all my commandments by walking in them, then I will establish my word with you, which I spoke to David your father.
translation:
  language: de
  text: 'Was dieses Haus betrifft, das du baust: Wenn du nach meinen Satzungen lebst, meine Rechtsbestimmungen ausführst und alle meine Gebote hältst, indem du dich nach ihnen richtest, dann werde ich mein Wort, das ich zu deinem Vater David gesprochen habe, an dir erfüllen[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mein Wort mit dir bestätigen“ oder „meine Zusage an dir erfüllen“. Die hebräische Wendung bezeichnet das Bestätigen oder Erfüllen dessen, was Gott zuvor gesagt hat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבַּיִת הַזֶּה אֲשֶׁר אַתָּה בֹנֶה
  choice: Was dieses Haus betrifft, das du baust
  rationale: „Haus“ bewahrt die konkrete hebräische Bezeichnung; im Zusammenhang ist der Tempel gemeint. Die Voranstellung wird mit „Was … betrifft“ wiedergegeben, und das Partizip bezeichnet den laufenden Bau.
- source_word: אִם תֵּלֵךְ בְּחֻקֹּתַי
  choice: Wenn du nach meinen Satzungen lebst
  rationale: הלך mit ב beschreibt die Lebensführung. „Nach … leben“ gibt die Bedeutung im heutigen Deutsch natürlich wieder, während „Satzungen“ den verbindlichen Charakter von חֻקּוֹת wahrt.
- source_word: וְאֶת מִשְׁפָּטַי תַּעֲשֶׂה
  choice: meine Rechtsbestimmungen ausführst
  rationale: מִשְׁפָּטִים bezeichnet hier verbindliche rechtliche Anordnungen. „Ausführen“ gibt תעשה idiomatisch wieder, ohne den Ausdruck auf bloßes Hören oder Anerkennen abzuschwächen.
- source_word: וְשָׁמַרְתָּ אֶת כָּל מִצְוֺתַי
  choice: und alle meine Gebote hältst
  rationale: שׁמר in Verbindung mit Geboten bedeutet „halten“ oder „befolgen“. „Gebote halten“ ist knapp, verständlich und im Deutschen als Bundessprache geläufig.
- source_word: לָלֶכֶת בָּהֶם
  choice: indem du dich nach ihnen richtest
  rationale: Der Infinitiv erläutert, wie das Halten der Gebote praktisch Gestalt annimmt. Die Formulierung vermeidet das unnatürliche deutsche „in ihnen gehen“, bewahrt aber den Gedanken einer an ihnen ausgerichteten Lebensführung.
- source_word: וַהֲקִמֹתִי אֶת דְּבָרִי אִתָּךְ
  choice: dann werde ich mein Wort an dir bestätigen
  rationale: הקים דבר bezeichnet das Bestätigen beziehungsweise Wirksamwerdenlassen eines zuvor gesprochenen Wortes. „Mein Wort“ erhält die Verbindung zum folgenden דִּבַּרְתִּי; „an dir“ gibt den Bezug auf Salomo wieder, ohne ihn vorschnell als bloßen Nutznießer zu deuten.
- source_word: אֲשֶׁר דִּבַּרְתִּי אֶל דָּוִד אָבִיךָ
  choice: das ich zu deinem Vater David gesprochen habe
  rationale: Die Wiedergabe mit „Wort“ und „gesprochen“ erhält die hebräische Wortverbindung דבר—דבר und vermeidet es, die Aussage bereits im Haupttext ausschließlich als „Versprechen“ auszulegen.
theological_decisions:
- issue: Bedingter Zusammenhang zwischen Tempelbau, Gehorsam und dem David zugesagten Wort
  choice: Die Bestätigung des göttlichen Wortes an Salomo wird in diesem Vers ausdrücklich an seinen Bundesgehorsam gebunden.
  alternative: Die Aussage könnte als bloße Bekräftigung einer in jeder Hinsicht unbedingten Verheißung oder als vollständige Ersetzung aller unbedingten Aspekte durch eine bedingte Zusage verstanden werden.
  rationale: Die hebräische Syntax enthält klar eine Wenn-dann-Struktur. Die Übersetzung lässt die Spannung zu anderen Aussagen über die Davidverheißung bestehen und löst sie nicht systematisch auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bewahrt die hervorgehobene Anfangsstellung des Hauses, bleibt aber gut lesbar. Rechtlich-bundestheologische Begriffe werden nicht konfessionell zugespitzt; die hebräische Geh-Metapher wird wegen deutscher Idiomatik sinngemäß als Lebensführung und Ausrichtung wiedergegeben.
