revisions:
- from: Und er baute die zwanzig Ellen im hinteren Teil des Hauses mit Zedernbrettern aus, vom Fußboden bis zu den Wänden[a]. So richtete er im Inneren den innersten Heiligtumsraum[b] ein, das Allerheiligste[c].
  to: Er trennte im hinteren Teil des Hauses zwanzig Ellen mit Zedernbrettern ab, vom Fußboden bis zu den Wänden[a], und schuf darin das innere Heiligtum[b], das Allerheiligste[c].
  rationale: Die erste Bauhandlung wird als Abtrennung des hinteren zwanzig Ellen tiefen Abschnitts wiedergegeben. Das ist im Deutschen klarer und entspricht dem architektonischen Kontext, ohne über die genaue Konstruktion der Zedernteile zu entscheiden. Die schwierige Lesart „bis zu den Wänden“ bleibt unverändert im Haupttext und ist mit einer textkritisch zurückhaltenden Alternative erläutert. Die beiden hebräischen Raumbezeichnungen bleiben als technische Benennung („inneres Heiligtum“) und kultische Bestimmung („Allerheiligstes“) unterscheidbar.
