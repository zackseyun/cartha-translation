  text: וַ/יִּבֶן֩ אֶת עֶשְׂרִ֨ים אַמָּ֜ה מ/ירכותי הַ/בַּ֨יִת֙ בְּ/צַלְע֣וֹת אֲרָזִ֔ים מִן הַ/קַּרְקַ֖ע עַד הַ/קִּיר֑וֹת וַ/יִּ֤בֶן ל/וֹ֙ מִ/בַּ֣יִת לִ/דְבִ֔יר לְ/קֹ֖דֶשׁ הַ/קֳּדָשִֽׁים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/016.yaml
  text: He built twenty cubits at the rear of the house with cedar boards[a], from the floor to the walls, and he built it within as an inner sanctuary[c][b], as the Most Holy Place.
translation:
  language: de
  text: Er trennte im hinteren Teil des Hauses zwanzig Ellen mit Zedernbrettern ab, vom Fußboden bis zu den Wänden[a], und schuf darin das innere Heiligtum[b], das Allerheiligste[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vom Fußboden bis zu den Balken/Sparren“. Der hebräische Text lautet „bis zu den Wänden“; diese Lesart steht daher im Haupttext.'
    reason: alternative_reading
  - marker: b
    text: 'Hebräisch debir: der innere Heiligtumsraum des Tempels.'
    reason: cultural_note
  - marker: c
    text: 'Wörtlich: „das Heilige der Heiligen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִירְכְּתֵי הַבַּיִת
  choice: im hinteren Teil des Hauses
  rationale: Die Wendung bezeichnet den abgelegenen bzw. rückwärtigen Bereich des Tempelhauses; die deutsche Formulierung ist räumlich klar und natürlich.
- source_word: בְּצַלְעוֹת אֲרָזִים
  choice: mit Zedernbrettern
  rationale: צלעות kann hier architektonische Seitenteile, Planken oder Bretter bezeichnen. Im Zusammenhang der hölzernen Abtrennung gibt „Zedernbretter“ Material und Funktion verständlich wieder.
- source_word: מִן הַקַּרְקַע עַד הַקִּירוֹת
  choice: vom Fußboden bis zu den Wänden
  rationale: Der masoretische Text lautet wörtlich „bis zu den Wänden“. Obwohl dies architektonisch schwierig ist und häufig „bis zu den Balken/Sparren“ angenommen wird, bleibt die überlieferte Lesart im Haupttext erhalten.
- source_word: וַיִּבֶן לוֹ מִבַּיִת
  choice: So richtete er im Inneren … ein
  rationale: Die gedrängte hebräische Konstruktion beschreibt die Errichtung eines Innenraums. „richtete … ein“ vermeidet im Deutschen die unklare Wiederholung von „bauen“ und bewahrt den räumlichen Sinn.
- source_word: לִדְבִיר
  choice: den innersten Heiligtumsraum
  rationale: דביר ist der Fachausdruck für den innersten Raum des Tempels. Die funktionale Übersetzung ist verständlicher als eine bloße Transliteration und unterscheidet den Raum zugleich vom gesamten Heiligtum.
- source_word: לְקֹדֶשׁ הַקֳּדָשִׁים
  choice: das Allerheiligste
  rationale: Die hebräische Superlativverbindung bezeichnet den heiligsten Bereich. „das Allerheiligste“ ist im Deutschen die natürliche, traditionsübergreifend verständliche Wiedergabe.
- source_word: אַמָּה
  choice: Ellen
  rationale: Die antike Maßeinheit wird formal beibehalten, statt im Haupttext in ein modernes und nur annäherndes Maß umgerechnet zu werden.
theological_decisions:
- issue: Verhältnis von דביר und קֹדֶשׁ הַקֳּדָשִׁים
  choice: Die beiden Ausdrücke werden als funktionale Benennung und anschließende nähere Bestimmung desselben Innenraums wiedergegeben.
  alternative: Beide mit nahezu gleichlautenden Bezeichnungen wie „inneres Heiligtum, das Heiligste der Heiligen“ übersetzen.
  rationale: Der Vers benennt den Raum zunächst mit dem technischen Tempelbegriff דביר und bestimmt ihn dann kultisch als קֹדֶשׁ הַקֳּדָשִׁים. Die unterschiedliche deutsche Wortwahl erhält diese Spannung, ohne zwei verschiedene Räume anzunehmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Haus“ bleibt als Tempelbezeichnung erhalten. Der Satzbau wurde für gute Verständlichkeit leicht gegliedert; die schwierige masoretische Lesart „bis zu den Wänden“ und die Unterscheidung zwischen dem technischen Raumbegriff debir und seiner kultischen Bezeichnung bleiben sichtbar.
