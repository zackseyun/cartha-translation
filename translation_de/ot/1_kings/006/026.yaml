  text: קוֹמַת֙ הַ/כְּר֣וּב הָֽ/אֶחָ֔ד עֶ֖שֶׂר בָּֽ/אַמָּ֑ה וְ/כֵ֖ן הַ/כְּר֥וּב הַ/שֵּׁנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/026.yaml
  text: The height of the one cherub was ten cubits[a], and so it was with the second cherub.
translation:
  language: de
  text: Die Höhe des einen Cherubs betrug zehn Ellen[a], und ebenso war es bei dem zweiten Cherub.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eine Elle war ein antikes Längenmaß, ungefähr die Strecke vom Ellenbogen bis zu den Fingerspitzen.
    reason: cultural_note
lexical_decisions:
- source_word: קוֹמַת
  choice: Die Höhe
  rationale: קוֹמָה bezeichnet Höhe oder Gestalt; im Zusammenhang mit den Tempelausstattungsstücken ist „Höhe“ die natürliche und genaue Wiedergabe.
- source_word: הַכְּרוּב
  choice: des … Kerubs
  rationale: Die Einzahl כְּרוּב bezeichnet hier eine einzelne Kerubfigur. „Kerub“ ist die etablierte deutsche Singularform.
- source_word: הָאֶחָד
  choice: des einen
  rationale: Das Hebräische sagt wörtlich „der eine“ und unterscheidet diesen Kerub vom zweiten, ohne ausdrücklich eine zeitliche oder räumliche Reihenfolge als „erster“ festzulegen.
- source_word: עֶשֶׂר בָּאַמָּה
  choice: zehn Ellen
  rationale: Die Wendung nennt das Maß. Da „Höhe“ bereits im Satz steht, ist eine zusätzliche Wiederholung wie „zehn Ellen hoch“ unnötig.
- source_word: וְכֵן
  choice: und ebenso war es bei
  rationale: וְכֵן drückt die Übereinstimmung des zweiten Kerubs mit dem ersten hinsichtlich der genannten Höhe aus; die Formulierung ist quellennah und zugleich natürlich.
- source_word: הַכְּרוּב הַשֵּׁנִי
  choice: dem zweiten Kerub
  rationale: Das Hebräische bezeichnet ihn ausdrücklich als „den zweiten“; diese Unterscheidung bleibt erhalten.
theological_decisions: []
