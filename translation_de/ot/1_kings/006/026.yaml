  register: Modernes, würdevolles Standarddeutsch. „Betrug“ formuliert eine Maßangabe idiomatisch; „Kerub“ bewahrt den etablierten biblischen Fachbegriff. Die Fußnote erklärt das antike Längenmaß, ohne einen exakten modernen Wert vorzugeben.
