  text: For the entrance of the inner sanctuary he made doors of olivewood[a]; the doorposts and jambs were five-sided.
translation:
  language: de
  text: Für den Eingang zum innersten Heiligtum fertigte er Türen aus Ölbaumholz an; der Türrahmen und die Pfosten bildeten ein Fünftel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der Rahmen, die Pfosten: ein Fünftel“. Die genaue architektonische Bedeutung ist unsicher; möglicherweise bezieht sich die Angabe auf ein Größenverhältnis. Oder: „waren fünfseitig“.'
    reason: alternative_reading
lexical_decisions:
- source_word: פֶּתַח
  choice: Eingang
  rationale: Bezeichnet die Öffnung beziehungsweise den Zugang und wird so von den anschließend genannten Türen unterschieden.
- source_word: הַדְּבִיר
  choice: das innerste Heiligtum
  rationale: Bezeichnet im Tempelkontext den innersten Raum; die Wiedergabe ist verständlich und vermeidet eine unnötige Festlegung auf spätere kultische Terminologie.
- source_word: דַּלְתּוֹת
  choice: Türen
  rationale: Der Plural bezeichnet die paarigen Türflügel; „Türen“ ist im Deutschen natürlicher als der technische Ausdruck „Türflügel“.
- source_word: עֲצֵי שָׁמֶן
  choice: Ölbaumholz
  rationale: Die Wendung bezeichnet Holz vom Ölbaum beziehungsweise Olivenbaum; „Ölbaumholz“ ist eine präzise und würdige Materialbezeichnung.
- source_word: הָאַיִל
  choice: der Türrahmen
  rationale: אַיִל kann hier ein tragendes Bauteil oder den Rahmen der Türöffnung bezeichnen. „Türrahmen“ wahrt die Unterscheidung zu מְזוּזוֹת.
- source_word: מְזוּזוֹת
  choice: die Pfosten
  rationale: Das Wort bezeichnet gewöhnlich Türpfosten. „Pfosten“ ist verständlich und ergänzt „Türrahmen“, ohne beide Architekturbegriffe gleichzusetzen.
- source_word: חֲמִשִׁית
  choice: waren fünfseitig
  rationale: Die knappe, elliptische Formulierung wird wahrscheinlich als Beschreibung der Gestalt der Türrahmenkonstruktion verstanden; die grammatisch mögliche traditionelle Deutung als „ein Fünftel“ bleibt in der Fußnote erhalten.
