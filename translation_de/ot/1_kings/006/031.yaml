  source_fidelity: Die Wiedergabe von Eingang, innerstem Heiligtum, Türen und Ölbaumholz ist quellentreu. Die Schlusswendung חֲמִשִׁית bedeutet jedoch zunächst „ein Fünftel“ und steht wahrscheinlich in einem architektonischen Größenverhältnis, wie der parallele Ausdruck „ein Viertel“ in V. 33. „waren fünfseitig“ ist eine mögliche, aber deutlich stärker interpretierende Deutung und sollte nicht den Haupttext bestimmen.
  naturalness: Der Satz ist in modernem, würdigem Standarddeutsch gut lesbar. „Bildeten ein Fünftel“ gibt die knappe architektonische Aussage natürlich wieder, ohne einen im Hebräischen nicht ausdrücklich genannten Bezug zu ergänzen.
