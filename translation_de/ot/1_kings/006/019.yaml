id: 1KI.6.19
reference: 1 Kings 6:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/דְבִ֧יר בְּ/תוֹךְ הַ/בַּ֛יִת מִ/פְּנִ֖ימָה הֵכִ֑ין לְ/תִתֵּ֣ן שָׁ֔ם אֶת אֲר֖וֹן בְּרִ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/019.yaml
  text: And he prepared the inner sanctuary within the house[a], to place there the ark of the covenant of Yahweh.
translation:
  language: de
  text: Und den innersten Raum im Inneren des Hauses[a] bereitete er vor, um dort die Lade des Bundes Jahwes aufzustellen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch debir, traditionell auch „Orakel“ genannt; gemeint ist hier der innerste Raum des Tempels, das Allerheiligste.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְבִיר
  choice: innerster Raum
  rationale: Im Tempelkontext bezeichnet דְבִיר den innersten Raum, also das Allerheiligste. „Innerster Raum“ ist im modernen Deutschen verständlich und vermeidet das missverständliche traditionelle „Orakel“.
- source_word: בְּתוֹךְ הַבַּיִת מִפְּנִימָה
  choice: im Inneren des Hauses
  rationale: Die Ortsangaben werden natürlich verbunden; „Haus“ bewahrt das tatsächlich verwendete בַּיִת, während der Kontext den Tempel erkennen lässt.
- source_word: הֵכִין
  choice: bereitete ... vor
  rationale: Das Verb bezeichnet das Bereitmachen für einen bestimmten Zweck und passt zur folgenden Zweckangabe.
- source_word: לְתִתֵּן
  choice: um ... aufzustellen
  rationale: Der Infinitiv drückt den Zweck aus. Bei der Bundeslade bezeichnet „aufstellen“ ihre vorgesehene Platzierung würdig und idiomatisch.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: die Lade des Bundes Jahwes
  rationale: Die Formulierung gibt die hebräische Status-constructus-Kette transparent wieder und bewahrt den persönlichen Gottesnamen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Tetragrammaton wird als persönlicher Gottesname „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich den Tetragrammaton. „Jahwe“ bewahrt ihn als persönlichen Bundesnamen; „der HERR“ wäre eine traditionelle Ersatzlesung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht markierte Voranstellung des Objekts folgt der hebräischen Hervorhebung, bleibt aber gut verständlich. „Haus“ wird gegenüber der erklärenden Übersetzung „Tempel“ beibehalten.
