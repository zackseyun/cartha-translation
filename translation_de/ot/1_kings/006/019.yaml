  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und den Zweckinfinitiv zuverlässig wieder: Der innerste Raum wird zur Aufstellung der Lade des Bundes Jahwes vorbereitet. „Innerster Raum“ trägt die Bedeutung von דביר im Tempelkontext; „im Inneren des Hauses“ bildet בְּתוֹךְ הַבַּיִת מִפְּנִימָה angemessen ab. „Haus“ bewahrt die Ausdrucksweise des hebräischen Textes.'
  naturalness: Modernes, gut verständliches und würdiges Standarddeutsch. Die Voranstellung des Objekts ist leicht literarisch, aber im Kontext einer Bibelübersetzung natürlich. Die Kombination „innersten Raum im Inneren“ ist eine vertretbare Wiedergabe der im Hebräischen ebenfalls nachdrücklich gestaffelten Ortsangabe.
  terminology: „Lade des Bundes Jahwes“ ist eine transparente Wiedergabe von אֲרוֹן בְּרִית יְהוָה. „Jahwe“ gibt den Gottesnamen konsistent wieder. Die Fußnote erläutert דביר sachlich und bewahrt mit „Orakel“ die traditionelle lexikalische Alternative, ohne diese als Kontextbedeutung auszugeben.
