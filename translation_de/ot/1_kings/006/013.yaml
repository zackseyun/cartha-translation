reference: 1 Kings 6:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/שָׁ֣כַנְתִּ֔י בְּ/ת֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/לֹ֥א אֶעֱזֹ֖ב אֶת עַמִּ֥/י יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/013.yaml
  text: And I will dwell among the children of Israel[a], and I will not forsake my people Israel.
translation:
  language: de
  text: Und ich werde mitten unter den Israeliten[a] wohnen und mein Volk Israel nicht verlassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »mitten unter den Kindern Israels«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁכַנְתִּי
  choice: Und ich werde … wohnen
  rationale: שׁכן bezeichnet das Wohnen bzw. Verweilen und trägt hier im Tempelzusammenhang den Sinn der bleibenden Gegenwart Gottes, ohne diese räumlich zu verengen.
- source_word: בְּתוֹךְ
  choice: mitten unter
  rationale: Die Wendung gibt die Gegenwart innerhalb der Gemeinschaft natürlich und zugleich quellennah wieder.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: den Israeliten
  rationale: Die feste hebräische Volksbezeichnung bedeutet wörtlich »den Söhnen/Kindern Israels«; »den Israeliten« ist im modernen Deutschen natürlich und schließt das ganze Volk ein.
- source_word: וְלֹא אֶעֱזֹב
  choice: und … nicht verlassen
  rationale: עזב kann »verlassen« oder »im Stich lassen« bedeuten. »Nicht verlassen« bewahrt die relationale und bundestheologische Aussage in würdigem, aktuellem Deutsch.
- source_word: עַמִּי
  choice: mein Volk
  rationale: Direkte Wiedergabe der possessiven Bundesformel.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Eigenname wird nach der üblichen deutschen Form wiedergegeben.
theological_decisions:
- issue: Gottes Wohnen im Tempelzusammenhang
  choice: »mitten unter den Israeliten wohnen«
  alternative: »inmitten der Kinder Israels wohnen«
  rationale: Die Formulierung bringt Gottes Gegenwart bei seinem Volk zum Ausdruck, ohne sie metaphysisch auf das Tempelgebäude zu beschränken. So bleibt die Spannung zwischen Tempelkontext und Gegenwart unter dem Volk erhalten.
- issue: Bedeutungsumfang von עזב
  choice: »nicht verlassen«
  alternative: »nicht im Stich lassen«
  rationale: »Verlassen« bewahrt sowohl die schlichte räumliche als auch die stärkere relationale Bedeutung und legt den Akzent nicht einseitig fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Mitten unter« wahrt die Bildhaftigkeit des Hebräischen; »Israeliten« vermeidet eine im Deutschen missverständliche Beschränkung auf männliche Nachkommen.
