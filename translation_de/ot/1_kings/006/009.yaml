  text: So he built the house and finished it, and he covered the house with beams and rows of cedar.
translation:
  language: de
  text: So baute er das Haus und vollendete es. Er deckte das Haus mit Balken und Reihen aus Zedernholz.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבַּיִת
  choice: das Haus
  rationale: Im Kontext bezeichnet »Haus« den Tempel; die Wiederholung des hebräischen Ausdrucks wird bewahrt.
- source_word: וַיְכַלֵּהוּ
  choice: und vollendete es
  rationale: Gibt das Abschließen des Baus knapp und eng am hebräischen Wortlaut wieder.
- source_word: וַיִּסְפֹּן
  choice: Er deckte
  rationale: Das Verb bezeichnet hier das Verkleiden beziehungsweise Abdecken des Gebäudes; »deckte« bleibt natürlich und lässt die genaue Bauweise offen.
- source_word: גֵּבִים
  choice: Balken
  rationale: Der seltene architektonische Ausdruck wird im Zusammenhang mit der Dach- oder Deckenanlage plausibel als »Balken« wiedergegeben.
- source_word: שְׂדֵרֹת בָּאֲרָזִים
  choice: Reihen aus Zedernholz
  rationale: Bewahrt die konkrete Bedeutung »Reihen« und die Materialangabe, ohne die unsichere bauliche Einzelgestaltung näher festzulegen.
theological_decisions: []
