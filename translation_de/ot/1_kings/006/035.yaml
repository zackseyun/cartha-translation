  text: וְ/קָלַ֤ע כְּרוּבִים֙ וְ/תִ֣מֹר֔וֹת וּ/פְטֻרֵ֖י צִצִּ֑ים וְ/צִפָּ֣ה זָהָ֔ב מְיֻשָּׁ֖ר עַל הַ/מְּחֻקֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/035.yaml
  text: He carved cherubim and palm trees and open flowers, and overlaid them with gold, fitted over the carved work.
translation:
  language: de
  text: Er schnitzte Cherubim, Palmen und geöffnete Blüten ein und überzog sie mit Gold, das genau den geschnitzten Formen folgte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְקָלַע
  choice: Er ließ … einschnitzen
  rationale: Das Verb bezeichnet das Ausführen eingeschnittener bzw. erhabener Zierarbeit. Der Kontext setzt Salomo als Bauherrn voraus; die deutsche Veranlassungskonstruktion gibt dies natürlich wieder.
- source_word: כְרוּבִים
  choice: Kerubim
  rationale: Die etablierte deutsche Wiedergabe bewahrt die Bezeichnung der geflügelten himmlischen Wesen.
- source_word: וְתִמֹרוֹת
  choice: Palmen
  rationale: תִּמֹרָה bezeichnet in der Tempelornamentik ein Palmen- beziehungsweise Palmbaum-Motiv; „Palmen“ ist klar und idiomatisch.
- source_word: וּפְטֻרֵי צִצִּים
  choice: und aufbrechende Blüten
  rationale: Die Wendung beschreibt Blütenmotive, die geöffnet beziehungsweise im Aufblühen dargestellt sind. „Aufbrechende Blüten“ erhält den bildhaften Charakter, ohne eine bestimmte Pflanzenart hinzuzufügen.
- source_word: וְצִפָּה זָהָב
  choice: und überzog … mit Gold
  rationale: Die übliche und sachlich genaue Wiedergabe für das Bekleiden beziehungsweise Überziehen einer Oberfläche mit Gold.
- source_word: מְיֻשָּׁר עַל הַמְחֻקֶּה
  choice: das Schnitzwerk passgenau
  rationale: מְיֻשָּׁר vermittelt hier die Anpassung beziehungsweise genaue Ausrichtung des Goldüberzugs an der eingeschnittenen Arbeit. „Passgenau“ gibt diese schwer wörtlich übertragbare räumliche Beziehung knapp wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kompakte Satzstruktur folgt dem hebräischen Baubericht; „passgenau“ verdeutlicht, dass der Goldüberzug den Konturen des Schnitzwerks angepasst war.
