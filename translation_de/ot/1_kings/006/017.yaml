  text: וְ/אַרְבָּעִ֥ים בָּ/אַמָּ֖ה הָיָ֣ה הַ/בָּ֑יִת ה֖וּא הַ/הֵיכָ֥ל לִ/פְנָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/017.yaml
  text: And the house[a], that is, the nave before the inner sanctuary, was forty cubits long.
translation:
  language: de
  text: Und das Haus[a], das heißt die Haupthalle vor dem innersten Heiligtum, war vierzig Ellen lang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Haupthalle davor«. Das Hebräische bestimmt »das Haus« näher als הֵיכָל, den Hauptraum vor dem innersten Heiligtum.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַרְבָּעִים
  choice: Und … vierzig
  rationale: Die Konjunktion verbindet den Vers mit der vorausgehenden Beschreibung; die Zahl wird unmittelbar mit »vierzig« wiedergegeben.
- source_word: בָּ/אַמָּה
  choice: Ellen lang
  rationale: אַמָּה bezeichnet die Elle als Längenmaß. »Lang« wird für eine natürliche deutsche Maßangabe aus dem Zusammenhang ergänzt.
- source_word: הָיָה
  choice: war
  rationale: Die einfache Kopula gibt das hebräische Verb in dieser Baubeschreibung angemessen wieder.
- source_word: הַ/בָּיִת
  choice: das Haus
  rationale: בַּיִת bedeutet wörtlich »Haus« und bezeichnet hier den Tempelbau beziehungsweise den anschließend näher bestimmten Hauptraum. Die wörtliche Bezeichnung bleibt erhalten.
- source_word: ה֖וּא
  choice: das heißt
  rationale: Das Pronomen hat hier erläuternde beziehungsweise appositionelle Funktion und bestimmt »das Haus« näher.
- source_word: הַ/הֵיכָל
  choice: die Haupthalle
  rationale: הֵיכָל bezeichnet hier den großen Hauptraum des Tempels im Unterschied zum innersten Heiligtum. »Haupthalle« ist im heutigen Deutsch verständlicher als das fachsprachliche »Langhaus« und vermeidet die interpretierende Bezeichnung »Heiliger Raum«.
- source_word: לִ/פְנָֽ/י
  choice: vor dem innersten Heiligtum
  rationale: Die Form bedeutet »vor« beziehungsweise »davor« und verweist im Kontext auf das im vorherigen Vers beschriebene innere Heiligtum. Das Bezugswort wird zur Verständlichkeit ausdrücklich genannt.
theological_decisions: []
