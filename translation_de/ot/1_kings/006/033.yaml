  yaml_path: translation/ot/1_kings/006/033.yaml
  text: And so he made for the entrance of the nave doorposts of olivewood[a], four-sided.
translation:
  language: de
  text: Und ebenso machte er für den Eingang der Tempelhalle vierseitige Türpfosten aus Olivenholz[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „mit vierseitiger Rahmung“ oder „quadratisch“. Die hebräische Wendung lautet wörtlich etwa „von einem vierten Teil“; ihre architektonische Bedeutung ist unsicher und könnte die Form der Türöffnung oder der Türpfosten beschreiben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְכֵן
  choice: Und ebenso
  rationale: Kennzeichnet die Entsprechung zur vorher beschriebenen Türanlage und wahrt den fortführenden Vergleich.
- source_word: עָשָׂה
  choice: machte er
  rationale: Gibt das allgemeine Verb im Bauzusammenhang schlicht und direkt wieder.
- source_word: לְפֶתַח הַהֵיכָל
  choice: für den Eingang der Tempelhalle
  rationale: הֵיכָל bezeichnet hier den Hauptraum des Tempelgebäudes im Unterschied zum innersten Heiligtum; „Tempelhalle“ ist verständlicher als das fachsprachliche „Langhaus“.
- source_word: מְזוּזוֹת
  choice: Türpfosten
  rationale: Bezeichnet die senkrechten seitlichen Pfosten einer Türöffnung.
- source_word: עֲצֵי שָׁמֶן
  choice: Olivenholz
  rationale: Die wörtliche Wendung „Ölbaumholz“ wird idiomatisch als Holz des Olivenbaums verstanden.
- source_word: מֵאֵת רְבִעִית
  choice: vierseitig
  rationale: Die schwierige architektonische Wendung bedeutet wörtlich etwa „von einem vierten Teil“ und wird wahrscheinlich als Beschreibung einer vierseitigen Form oder Rahmung gebraucht; die Unsicherheit wird in der Fußnote bewahrt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Tempelhalle“ vermeidet das im Deutschen kirchenbaulich geprägte „Langhaus“. Die ungewöhnliche Schlussangabe wird lesbar wiedergegeben, während die echte Unsicherheit des Hebräischen ausdrücklich in der Fußnote erhalten bleibt.
