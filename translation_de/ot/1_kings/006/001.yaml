  text: וַ/יְהִ֣י בִ/שְׁמוֹנִ֣ים שָׁנָ֣ה וְ/אַרְבַּ֣ע מֵא֣וֹת שָׁנָ֡ה לְ/צֵ֣את בְּנֵֽי יִשְׂרָאֵ֣ל מֵ/אֶֽרֶץ מִצְרַיִם֩ בַּ/שָּׁנָ֨ה הָ/רְבִיעִ֜ית בְּ/חֹ֣דֶשׁ זִ֗ו ה֚וּא הַ/חֹ֣דֶשׁ הַ/שֵּׁנִ֔י לִ/מְלֹ֥ךְ שְׁלֹמֹ֖ה עַל יִשְׂרָאֵ֑ל וַ/יִּ֥בֶן הַ/בַּ֖יִת לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/001.yaml
  text: And it came about in the four hundred eightieth year after the sons of Israel came out from the land of Egypt[a], in the fourth year, in the month of Ziv (that is, the second month), of Solomon’s reign over Israel[c][b], that he built the house for Yahweh.
translation:
  language: de
  text: Im vierhundertachtzigsten Jahr nach dem Auszug der Söhne Israels aus dem Land Ägypten[a], im vierten Jahr der Herrschaft Salomos über Israel, im Monat Siw – das ist der zweite Monat[b] –, baute er das Haus für Jahwe.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der Söhne Israels“; gemeint ist das Volk Israel.'
    reason: lexical_alternative
  - marker: b
    text: Siw war die alte Bezeichnung für den zweiten Monat des hebräischen Kalenders.
    reason: cultural_note
  - marker: c
    text: Der Zusammenhang zeigt, dass hier der Beginn des Baus datiert wird; das hebräische Verb selbst lautet schlicht „baute“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Im … Jahr
  rationale: Die narrative Einleitungsformel eröffnet hier eine Zeitangabe. Im modernen Deutschen lässt sie sich natürlich in den vorangestellten Datierungsrahmen integrieren, ohne inhaltlichen Verlust.
- source_word: בִשְׁמוֹנִים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: im vierhundertachtzigsten Jahr
  rationale: Die hebräische Konstruktion bezeichnet das 480. Jahr, nicht lediglich eine ungefähre Dauer von 480 Jahren.
- source_word: לְצֵאת בְּנֵי יִשְׂרָאֵל
  choice: nach dem Auszug der Söhne Israels
  rationale: Die Infinitivkonstruktion setzt den Auszug als zeitlichen Bezugspunkt. „Söhne Israels“ bewahrt die familiale Ausdrucksweise des Hebräischen.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: aus dem Land Ägypten
  rationale: Die Übersetzung gibt אֶרֶץ ausdrücklich mit „Land“ wieder.
- source_word: בַּשָּׁנָה הָרְבִיעִית … לִמְלֹךְ שְׁלֹמֹה עַל יִשְׂרָאֵל
  choice: im vierten Jahr der Herrschaft Salomos über Israel
  rationale: Die Wendung ist eine Regierungsdatierung und wird im Deutschen knapp und eindeutig wiedergegeben.
- source_word: בְּחֹדֶשׁ זִו
  choice: im Monat Siw
  rationale: Der historische Monatsname wird als Eigenname beibehalten und deutsch transkribiert.
- source_word: הוּא הַחֹדֶשׁ הַשֵּׁנִי
  choice: das ist der zweite Monat
  rationale: Die erklärende Apposition des Ausgangstextes bleibt ausdrücklich erhalten.
- source_word: וַיִּבֶן
  choice: baute
  rationale: Das einfache Verb bedeutet unmittelbar „baute“. Dass hier der Baubeginn datiert wird, ergibt sich aus dem Kontext und wird nicht in das Verb hineingetragen.
- source_word: הַבַּיִת
  choice: das Haus
  rationale: „Haus“ entspricht dem hebräischen Wortlaut und ist hier die traditionelle Bezeichnung für das Heiligtum.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Der im Ausgangstext stehende Gottesname wird als Eigenname wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den Charakter als Gottesname, ohne ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  alternative: Israeliten / Volk Israel
  rationale: Die formnahe Wiedergabe erhält das familiale und gemeinschaftliche Bild des Hebräischen; eine Fußnote erläutert den kollektiven Bezug.
- issue: Aspekt des Tempelbaus in וַיִּבֶן
  choice: baute
  alternative: begann zu bauen
  rationale: Der unmittelbare Wortlaut sagt schlicht „baute“. Der Vers bezeichnet im Zusammenhang zwar den Beginn des Bauprojekts, doch diese Kontextinformation wird nicht als Bestandteil des Verbs ausgegeben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der lange hebräische Datierungssatz wurde durch klare Stellung der Zeitangaben und Gedankenstriche lesbar gegliedert. „Siw“ folgt einer geläufigen deutschen Transkription; „Haus“ bewahrt die bildhafte Tempelbezeichnung des Ausgangstextes.
