  text: וְ/חָמֵ֣שׁ אַמּ֗וֹת כְּנַ֤ף הַ/כְּרוּב֙ הָֽ/אֶחָ֔ת וְ/חָמֵ֣שׁ אַמּ֔וֹת כְּנַ֥ף הַ/כְּר֖וּב הַ/שֵּׁנִ֑ית עֶ֣שֶׂר אַמּ֔וֹת מִ/קְצ֥וֹת כְּנָפָ֖י/ו וְ/עַד קְצ֥וֹת כְּנָפָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/024.yaml
  text: And five cubits was the one wing of the cherub[a], and five cubits the second wing of the cherub; ten cubits from the end of its wings to the end of its wings.
translation:
  language: de
  text: Der eine Flügel des Kerubs war fünf Ellen lang, und der zweite Flügel des Kerubs war fünf Ellen lang. Von einem Ende seiner Flügel bis zum anderen Ende waren es zehn Ellen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: Die gesamte Spannweite von einer Flügelspitze bis zur anderen betrug zehn Ellen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָמֵשׁ אַמּוֹת
  choice: fünf Ellen lang
  rationale: Die Elle ist die übliche deutsche Wiedergabe von אַמָּה. Das ergänzte „lang“ macht die Maßangabe in natürlichem Deutsch verständlich.
- source_word: כְּנַף
  choice: Flügel
  rationale: Im Zusammenhang mit den Kerubfiguren bezeichnet כָּנָף eindeutig einen Flügel.
- source_word: הַכְּרוּב
  choice: des Kerubs
  rationale: Der Singular bezeichnet jeweils eine einzelne Kerubfigur; „Kerub“ ist die etablierte deutsche Form.
- source_word: הָאֶחָת
  choice: der eine
  rationale: Bewahrt die Formulierung „der eine“ des Hebräischen, statt sie ausdrücklich als „der erste“ zu deuten.
- source_word: הַשֵּׁנִית
  choice: der zweite
  rationale: Direkte Wiedergabe des femininen Ordinalzahlworts, das sich auf „Flügel“ bezieht.
- source_word: עֶשֶׂר אַמּוֹת
  choice: zehn Ellen
  rationale: Direkte Wiedergabe des Gesamtmaßes der Flügelspannweite.
- source_word: מִקְצוֹת ... וְעַד קְצוֹת
  choice: von einem Ende ... bis zum anderen Ende
  rationale: Gibt die Ausdehnung von einem äußersten Ende zum anderen idiomatisch wieder; „Spitze“ bleibt als konkretere Alternative in der Fußnote erhalten.
- source_word: כְּנָפָיו
  choice: seiner Flügel
  rationale: Der maskuline Singularsuffix bezieht sich auf den Kerub. Das deutsche Possessivpronomen folgt diesem grammatischen Bezug natürlich.
