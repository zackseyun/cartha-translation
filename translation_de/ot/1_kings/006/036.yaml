  text: And he built the inner court with three rows of cut stone and a row of cedar beams[a].
translation:
  language: de
  text: Und er baute den inneren Vorhof aus drei Reihen behauener Steine und einer Reihe Zedernbalken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: aus drei Lagen von Quadersteinen und einer Lage von Zedernbalken.'
    reason: Lexikalische und bautechnische Alternative für טוּר und גָזִית.
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Und er baute
  rationale: Das Wayyiqtol von בנה führt die nächste Handlung der Erzählung fort; „Und er baute“ bewahrt diesen Anschluss, ohne eine stärkere zeitliche Nuance einzutragen.
- source_word: הֶחָצֵר הַפְּנִימִית
  choice: den inneren Vorhof
  rationale: חָצֵר bezeichnet hier den Hofbereich des Tempels; „innerer Vorhof“ ist im Deutschen klar, würdig und im Tempelkontext geläufig.
- source_word: שְׁלֹשָׁה טוּרֵי
  choice: aus drei Reihen
  rationale: טוּר kann eine Reihe beziehungsweise eine waagerechte Mauerlage bezeichnen. „Reihen“ ist allgemein verständlich; die bautechnisch genauere Alternative „Lagen“ wird in der Fußnote genannt.
- source_word: גָזִית
  choice: behauener Steine
  rationale: גָזִית bezeichnet bearbeitete beziehungsweise behauene Bausteine. Die Wiedergabe ist verständlich und lässt offen, wie genau die Steine zugerichtet waren.
- source_word: וְטוּר
  choice: und einer Reihe
  rationale: Das hebräische Singularwort bezeichnet nach den drei Reihen eine weitere Reihe, enthält aber kein ausdrückliches Zahlwort „eins“; der unbestimmte Artikel bildet dies im Deutschen angemessen ab.
- source_word: כְּרֻתֹת אֲרָזִים
  choice: Zedernbalken
  rationale: Die Wendung bezeichnet zugeschnittene Stücke aus Zedernholz. „Zedernbalken“ gibt ihre wahrscheinliche bauliche Funktion natürlich wieder, ohne das im Deutschen überflüssige „geschnitten“ hinzuzufügen.
