source:
  edition: WLC
  text: וּ/בַ/שָּׁנָה֩ הָ/אַחַ֨ת עֶשְׂרֵ֜ה בְּ/יֶ֣רַח בּ֗וּל ה֚וּא הַ/חֹ֣דֶשׁ הַ/שְּׁמִינִ֔י כָּלָ֣ה הַ/בַּ֔יִת לְ/כָל דְּבָרָ֖י/ו וּ/לְ/כָל משפט/ו וַ/יִּבְנֵ֖/הוּ שֶׁ֥בַע שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/038.yaml
  text: And in the eleventh year[a], in the month of Bul (that is, the eighth month), the house was finished in all its parts and according to all its specifications[b]. So he built it in seven years.
translation:
  language: de
  text: Im elften Jahr[a], im Monat Bul – das ist der achte Monat –, wurde das Haus in allen seinen Einzelheiten und nach allen seinen Vorschriften[b] vollendet. So baute er sieben Jahre daran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bul war der ältere Name des achten Monats im israelitischen Kalender.
    reason: cultural_note
  - marker: b
    text: 'Oder: „in allen seinen Teilen und nach seinem ganzen vorgeschriebenen Plan“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשָּׁנָה הָאַחַת עֶשְׂרֵה
  choice: Im elften Jahr
  rationale: Gibt die hebräische Ordnungszahl idiomatisch und präzise wieder.
- source_word: בְּיֶרַח בּוּל
  choice: im Monat Bul
  rationale: יֶרַח bezeichnet hier einen Monat; der alte Monatsname Bul wird transliteriert.
- source_word: הוּא הַחֹדֶשׁ הַשְּׁמִינִי
  choice: das ist der achte Monat
  rationale: Die erklärende Apposition wird in natürlichem Deutsch wiedergegeben.
- source_word: כָּלָה הַבַּיִת
  choice: wurde das Haus ... vollendet
  rationale: כלה bezeichnet den Abschluss der Bauarbeiten; „Haus“ bewahrt die hebräische Bezeichnung für den Tempel.
- source_word: לְכָל דְּבָרָיו
  choice: in allen seinen Einzelheiten
  rationale: דברים meint im Baukontext die einzelnen Bestandteile oder Details, nicht gesprochene Worte.
- source_word: וּלְכָל מִשְׁפָּטוֹ
  choice: nach allen seinen Vorschriften
  rationale: מִשְׁפָּט bezeichnet hier die maßgebenden Vorgaben oder den vorgeschriebenen Plan; „Vorschriften“ bewahrt die normative Nuance.
- source_word: וַיִּבְנֵהוּ שֶׁבַע שָׁנִים
  choice: So baute er sieben Jahre daran
  rationale: Die Formulierung fasst die Bauzeit zusammen und gibt die Dauer idiomatisch wieder, ohne zu behaupten, das Projekt sei erst nach vollen sieben Jahren abgeschlossen worden.
