  text: He built the side structure against the whole house[a], five cubits high[b], and it was fastened to the house with cedar timbers.
translation:
  language: de
  text: Er baute den Seitenbau am ganzen Haus entlang[a]. Er war fünf Ellen hoch und mit dem Haus durch Zedernhölzer verbunden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Seitenkammern rings um das ganze Haus“. Der hebräische Ausdruck bezeichnet wahrscheinlich den an den Tempel angefügten Seitenkomplex.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „und er fasste das Haus mit Zedernhölzern“. Gemeint ist offenbar die bauliche Verbindung des Seitenbaus mit dem Tempelhaus.'
    reason: lexical_and_syntactic_ambiguity
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Er baute
  rationale: Das Wayyiqtol von בנה bezeichnet die nächste Handlung in der Erzählfolge. Im Deutschen ist der Anschluss auch ohne ein ausdrückliches „und“ natürlich.
- source_word: היצוע
  choice: den Seitenbau
  rationale: Der Ausdruck bezeichnet hier wahrscheinlich den an den Tempel angefügten, umlaufenden Bauteil. „Seitenbau“ wahrt den kollektiven Singular und legt sich nicht unnötig auf einzelne Kammern fest.
- source_word: עַל כָּל הַבַּיִת
  choice: am ganzen Haus entlang
  rationale: עַל hat hier räumliche Bedeutung. Die Wiedergabe bringt sowohl die Anfügung an das Tempelhaus als auch die durch כָּל bezeichnete Ausdehnung zum Ausdruck.
- source_word: חָמֵשׁ אַמּוֹת קוֹמָתוֹ
  choice: Er war fünf Ellen hoch
  rationale: Die Maßangabe wird in natürlichem Deutsch wiedergegeben; das Suffix an „Höhe“ bezieht sich auf den Seitenbau.
- source_word: וַיֶּאֱחֹז אֶת הַבַּיִת
  choice: mit dem Haus verbunden
  rationale: אחז bedeutet grundsätzlich „ergreifen, festhalten“ und bezeichnet im baulichen Zusammenhang die feste Verbindung. Die passive Formulierung macht die gemeinte konstruktive Anfügung verständlich, ohne eine unklare wörtliche Metapher einzuführen.
- source_word: בַּעֲצֵי אֲרָזִים
  choice: durch Zedernbalken
  rationale: עֲצֵי bezeichnet Holz beziehungsweise Bauhölzer. Im architektonischen Zusammenhang gibt „Zedernbalken“ die tragenden oder verbindenden Holzelemente idiomatisch wieder.
