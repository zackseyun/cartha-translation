  text: וְ/עֶ֨שֶׂר֙ בָּֽ/אַמָּ֔ה הַ/כְּר֖וּב הַ/שֵּׁנִ֑י מִדָּ֥ה אַחַ֛ת וְ/קֶ֥צֶב אֶחָ֖ד לִ/שְׁנֵ֥י הַ/כְּרֻבִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/025.yaml
  text: And the second cherub was ten cubits[a]; both cherubim had one measure and one form.
translation:
  language: de
  text: Und der zweite Cherub maß zehn Ellen; beide Cherubim hatten dasselbe Maß und dieselbe Gestalt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעֶשֶׂר בָּאַמָּה
  choice: maß zehn Ellen
  rationale: Die elliptische Maßangabe wird im Deutschen idiomatisch mit „maß“ wiedergegeben. Eine bestimmte Richtung wie „hoch“ nennt der hebräische Text hier nicht ausdrücklich.
- source_word: הַכְּרוּב הַשֵּׁנִי
  choice: der zweite Cherub
  rationale: Entspricht unmittelbar dem bestimmten Substantiv mit Ordinalzahl; der Singular des hebräischen Textes bleibt erhalten.
- source_word: מִדָּה אַחַת
  choice: dasselbe Maß
  rationale: Wörtlich „ein Maß“; im Bezug auf beide Cherubim bezeichnet die Wendung eindeutig ein übereinstimmendes Maß. „Dasselbe“ ist im heutigen Deutsch natürlich.
- source_word: וְקֶצֶב אֶחָד
  choice: und dieselbe Gestalt
  rationale: קֶצֶב bezeichnet hier Form, Umriss oder Proportion. „Gestalt“ ist verständlich, würdig und lässt die genaue Art der Übereinstimmung offen.
- source_word: לִשְׁנֵי הַכְּרֻבִים
  choice: beide Cherubim hatten
  rationale: Das Hebräische lautet formal „für die beiden Cherubim“. Die deutsche Satzkonstruktion drückt denselben gemeinsamen Bezug idiomatisch aus.
theological_decisions: []
