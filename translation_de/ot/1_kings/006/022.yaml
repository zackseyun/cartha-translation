  terminology: »Haus«, »Gold«, »Altar« und »innerstes Heiligtum« sind sachgerecht. »Innerstes Heiligtum« ist eine klare moderne Wiedergabe von דְּבִיר, ohne die traditionellere Bezeichnung »Allerheiligstes« zwingend in den Haupttext einzutragen. Die Fußnote erläutert diese traditionelle Alternative angemessen.
