  source_fidelity: 'Die Übersetzung gibt die hebräische Satzstruktur und die zentralen Aussagen zuverlässig wieder: vollständige Goldverkleidung des Hauses, Abschluss des gesamten Hauses und Goldüberzug des ganzen dem Debir zugeordneten Altars. »Bis das ganze Haus vollendet war« entspricht עַד תֹּם כָּל־הַבָּיִת angemessen. Die Zuordnung des Altars zum Debir wird ohne unzulässige räumliche Präzisierung wiedergegeben.'
