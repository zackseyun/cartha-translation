id: 1KI.6.22
reference: 1 Kings 6:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אֶת כָּל הַ/בַּ֛יִת צִפָּ֥ה זָהָ֖ב עַד תֹּ֣ם כָּל הַ/בָּ֑יִת וְ/כָל הַ/מִּזְבֵּ֥חַ אֲֽשֶׁר לַ/דְּבִ֖יר צִפָּ֥ה זָהָֽב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/022.yaml
  text: He overlaid the whole house with gold[a], until the whole house was finished[b]; and he overlaid with gold the whole altar that belonged to the inner sanctuary.
translation:
  language: de
  text: Das ganze Haus überzog er mit Gold, bis das ganze Haus vollendet war. Auch den ganzen Altar, der zum innersten Heiligtum[a] gehörte[b], überzog er mit Gold.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch debir: der innerste Raum des Tempels; traditionell »das Allerheiligste«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »der beim innersten Heiligtum stand«; der hebräische Ausdruck bezeichnet die Beziehung oder Zuordnung des Altars zum innersten Heiligtum, ohne seine genaue Lage eindeutig festzulegen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבַּיִת
  choice: das Haus
  rationale: בַּיִת bedeutet wörtlich »Haus« und bezeichnet hier den Tempelbau. »Haus« bewahrt zugleich die in den Königsbüchern prägende Rede vom Haus des HERRN.
- source_word: צִפָּה
  choice: überzog
  rationale: Das Verb bezeichnet hier das Überziehen einer Oberfläche mit einem Material, nämlich Gold; »überzog« ist im Deutschen für diese Bauarbeit präzise und natürlich.
- source_word: זָהָב
  choice: Gold
  rationale: Die übliche und kontextuell eindeutige Bezeichnung des Materials.
- source_word: עַד תֹּם כָּל הַבָּיִת
  choice: bis das ganze Haus vollendet war
  rationale: Die Formulierung gibt den Abschluss der Arbeiten am gesamten Haus wieder und wahrt die temporale Gestalt von עַד.
- source_word: כָּל
  choice: ganz / ganze
  rationale: Die wiederholte Totalitätsaussage wird im Deutschen idiomatisch durch »ganz« wiedergegeben.
- source_word: הַמִּזְבֵּחַ
  choice: Altar
  rationale: Standardentsprechung für מִזְבֵּחַ.
- source_word: אֲשֶׁר לַדְּבִיר
  choice: der zum innersten Heiligtum gehörte
  rationale: Die Präposition ל bezeichnet eine Beziehung oder Zuordnung zum דְּבִיר. Die Wiedergabe vermeidet es, eine räumliche Lage festzulegen, die der hebräische Ausdruck nicht eindeutig bestimmt.
- source_word: דְּבִיר
  choice: innerstes Heiligtum
  rationale: Der Ausdruck bezeichnet den innersten Tempelraum. Diese Wiedergabe ist in modernem Deutsch verständlich und weniger traditionell festgelegt als »Allerheiligstes«.
theological_decisions:
- issue: Beziehung des Altars zum innersten Heiligtum
  choice: zum innersten Heiligtum gehörte
  alternative: im innersten Heiligtum stand / vor dem innersten Heiligtum stand
  rationale: Das hebräische לַדְּבִיר bezeichnet die Zuordnung, lässt aber die genaue räumliche Beziehung offen. Die Übersetzung bewahrt diese Mehrdeutigkeit.
translation_notes:
  register: Moderne, würdevolle Standardsprache. »Haus« bewahrt die hebräische Ausdrucksweise für den Tempel; die Wiederholung von »das ganze Haus« und »überzog er mit Gold« erhält die emphatische Struktur des Verses.
