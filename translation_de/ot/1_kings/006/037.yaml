  text: בַּ/שָּׁנָה֙ הָֽ/רְבִיעִ֔ית יֻסַּ֖ד בֵּ֣ית יְהוָ֑ה בְּ/יֶ֖רַח זִֽו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/037.yaml
  text: In the fourth year[a], the house of Yahweh was founded in the month of Ziv.
translation:
  language: de
  text: Im vierten Jahr wurde im Monat Siw das Fundament des Hauses Jahwes gelegt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּשָּׁנָה הָרְבִיעִית
  choice: Im vierten Jahr
  rationale: Die hebräische Zeitangabe wird ohne Ergänzung wiedergegeben. Dass es um Salomos Regierungsjahr geht, ergibt sich aus dem Kontext, steht aber nicht ausdrücklich in diesem Vers.
- source_word: יֻסַּד
  choice: wurde … das Fundament … gelegt
  rationale: Das passive Verb von יסד bezeichnet hier das Gründen beziehungsweise Legen eines Fundaments. Im Deutschen ist die explizite Formulierung mit »Fundament« natürlich und macht den Bauvorgang klar.
- source_word: בֵּית יְהוָה
  choice: des Hauses Jahwes
  rationale: »Haus« bewahrt die hebräische Bildsprache für den Tempel; der Gottesname wird als »Jahwe« wiedergegeben.
- source_word: בְּיֶרַח זִו
  choice: im Monat Siw
  rationale: יֶרַח bedeutet »Monat«, und זִו ist dessen Eigenname. »Siw« entspricht einer im Deutschen gebräuchlichen Umschrift.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als solcher erkennbar wiedergegeben; »Jahwe« ist die übliche moderne deutsche Form. Die traditionelle Ersatzlesung »der HERR« wird nicht in den Haupttext eingesetzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung stellt die Zeitangaben voran und hält den Bauvorgang klar und idiomatisch fest.
