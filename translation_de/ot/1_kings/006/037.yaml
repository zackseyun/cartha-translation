  source_fidelity: 'Der Entwurf gibt die hebräischen Angaben vollständig und zutreffend wieder: die Zeitangabe („im vierten Jahr“), das passive יסד im Sinn des Legens der Gründung beziehungsweise des Fundaments, „das Haus Jahwes“ und den Monatsnamen Siw. Die explizite Nennung des Fundaments macht im Deutschen den bei „legen“ mitverstandenen Gegenstand idiomatisch sichtbar, ohne den Sinn zu verändern.'
