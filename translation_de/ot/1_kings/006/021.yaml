base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/021.yaml
  text: Solomon overlaid the inside of the house with pure gold[a], and he drew gold chains across the front of the inner sanctuary[c][b], and overlaid it with gold.
translation:
  language: de
  text: Salomo überzog das Innere des Hauses mit reinem Gold[a]. Er zog goldene Ketten vor dem innersten Heiligtum[c] entlang[b] und überzog es mit Gold.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »geläutertem Gold«. Wörtlich lautet der hebräische Ausdruck etwa »verschlossenes Gold«; gemeint ist hochwertiges Gold.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »zog er goldene Ketten quer vor dem innersten Heiligtum entlang«. Die genaue Anordnung der Ketten ist im Hebräischen nicht eindeutig.'
    reason: alternative_reading
  - marker: c
    text: Das »innerste Heiligtum« ist der innerste Raum des Tempels, der später als das Allerheiligste bezeichnet wurde.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְצַף
  choice: überzog
  rationale: צפה bezeichnet hier das Bedecken einer Fläche mit einer Metallschicht; »überziehen« ist im Bauzusammenhang präzise und natürlich.
- source_word: הַבַּיִת
  choice: das Haus
  rationale: Der hebräische Text sagt wörtlich »das Haus«. Im Zusammenhang ist der Tempel gemeint; die Wiedergabe bewahrt jedoch die Ausdrucksweise des Königsbuchs.
- source_word: מִפְּנִימָה
  choice: das Innere
  rationale: Die adverbiale Form bezeichnet den Innenbereich des Hauses; »das Innere« gibt den räumlichen Sinn knapp und idiomatisch wieder.
- source_word: זָהָב סָגוּר
  choice: reines Gold
  rationale: Die ungewöhnliche Wendung, wörtlich etwa »verschlossenes Gold«, bezeichnet offenbar hochwertiges oder geläutertes Gold. »Reines Gold« vermittelt den wahrscheinlichen Sinn.
- source_word: וַיַּעְבֵּר
  choice: ließ ... entlangführen
  rationale: Die Kausativform von עבר bedeutet wörtlich »hinüber-/vorbeiführen lassen«. Die Formulierung beschreibt verständlich das Anbringen der Ketten, ohne ihre genaue räumliche Anordnung sicherer darzustellen, als der Text erlaubt.
- source_word: בְרַתּוּקוֹת
  choice: Ketten
  rationale: Das seltene Substantiv bezeichnet im Kontext am wahrscheinlichsten goldene Ketten; ihre genaue bauliche oder dekorative Funktion bleibt offen.
- source_word: לִפְנֵי הַדְּבִיר
  choice: vor dem innersten Heiligtum
  rationale: לִפְנֵי bedeutet »vor« beziehungsweise »an der Vorderseite von«. Diese Wiedergabe erhält die räumliche Offenheit des Hebräischen.
- source_word: הַדְּבִיר
  choice: das innerste Heiligtum
  rationale: דְּבִיר bezeichnet den innersten Raum des Tempels. »Innerstes Heiligtum« ist verständlich und vermeidet, eine spätere feste Bezeichnung unmittelbar in den Haupttext einzutragen.
- source_word: וַיְצַפֵּהוּ
  choice: überzog es
  rationale: Das maskuline Singularsuffix wird formal mit »es« wiedergegeben. Sein genauer Bezug – wahrscheinlich das innerste Heiligtum oder dessen Vorderbereich – wird nicht ausdrücklich festgelegt.
theological_decisions:
- issue: Bezeichnung des דְּבִיר
  choice: innerstes Heiligtum
  alternative: Allerheiligstes
  rationale: Die gewählte Form bezeichnet den Tempelinnenraum sachlich, ohne die spätere traditionelle Benennung in den Haupttext einzutragen; eine erklärende Fußnote stellt den Bezug her.
- issue: Bezug des Suffixes in וַיְצַפֵּהוּ
  choice: Das unbestimmte Pronomen »es« bleibt erhalten.
  alternative: Explizite Auflösung als »das innerste Heiligtum« oder »seine Vorderseite«
  rationale: Der hebräische Singularbezug ist nicht völlig eindeutig. Eine explizite Auflösung würde eine textliche Spannung beseitigen, die im Ausgangstext bestehen bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Haus« bewahrt die konkrete hebräische Bezeichnung für den Tempel. Die Satzteilung erhöht die Lesbarkeit; räumliche und pronominale Mehrdeutigkeiten werden nicht stillschweigend aufgelöst.
