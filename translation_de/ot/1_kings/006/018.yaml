  text: The cedar on the inside of the house was carved with gourds and open flowers[a]. Everything was cedar[b]; no stone was visible.
translation:
  language: de
  text: Die Zedernverkleidung im Inneren des Hauses war mit Kürbisformen[a] und geöffneten Blüten[b] beschnitzt. Alles war Zedernholz; kein Stein war zu sehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Knospen“. Das hebräische Wort bezeichnet rundliche Zierformen und meint hier möglicherweise kürbisförmige Schnitzereien.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Blüten“ oder „Blütenformen“. Das Hebräische beschreibt wahrscheinlich geschnitzte florale Formen, wohl geöffnete oder sich entfaltende Blüten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶז
  choice: Zedernverkleidung / Zedernholz
  rationale: Das Wort bezeichnet hier das Zedernholz, mit dem der Innenraum verkleidet war. „Zedernverkleidung“ verdeutlicht im ersten Satz die bauliche Funktion; „Zedernholz“ benennt im zweiten Satz natürlich das Material.
- source_word: אֶל־הַבַּיִת פְּנִימָה
  choice: im Inneren des Hauses
  rationale: Die Wendung bezeichnet die nach innen gelegene Oberfläche des Tempelgebäudes. Die Formulierung ist knapp und macht deutlich, dass es um die Innenverkleidung geht.
- source_word: מִקְלַעַת
  choice: beschnitzt
  rationale: Der Ausdruck bezeichnet eingeschnitzte oder eingravierte Verzierung. „Beschnitzt“ gibt die dekorative Bearbeitung des Zedernholzes prägnant wieder.
- source_word: פְּקָעִים
  choice: Kürbisformen
  rationale: Das Wort bezeichnet runde Zierformen, die in diesem Tempelkontext wahrscheinlich kürbisförmig waren. „Kürbisformen“ ist verständlicher als ein bloßes „Kürbisse“ und lässt erkennen, dass es sich um Ornamente handelt.
- source_word: וּפְטוּרֵי צִצִּים
  choice: und geöffneten Blüten
  rationale: Die Wortgruppe beschreibt wahrscheinlich florale Schnitzereien in Gestalt aufgeblühter oder sich öffnender Blüten. „Geöffnete Blüten“ bewahrt das Bild und bleibt natürlich.
- source_word: הַכֹּל אֶרֶז
  choice: Alles war Zedernholz
  rationale: Die Aussage fasst zusammen, dass sämtliche sichtbaren Innenflächen mit Zedernholz bedeckt waren. Die knappe Form entspricht der Betonung des Hebräischen.
- source_word: אֵין אֶבֶן נִרְאָה
  choice: kein Stein war zu sehen
  rationale: Die idiomatische deutsche Formulierung bewahrt den Sinn, dass das Mauerwerk vollständig von der Holzverkleidung verdeckt wurde.
