    rationale: Der hebräische Ausdruck beschreibt nach der Oberflächenstruktur die Fenster; die genaue architektonische Beziehung der seltenen Wörter bleibt umstritten. Außerdem ist ein „geschlossener Rahmen“ im Deutschen semantisch unklar und kann eine unzutreffende technische Aussage nahelegen.
