  text: He made for the house windows with recessed frames[a].
translation:
  language: de
  text: Er ließ für das Haus zurückgesetzte, verschlossene Fenster anbringen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die beiden hebräischen Fachwörter für die Bauweise dieser Fenster sind selten und in ihrer Bedeutung unsicher. Die Übersetzung gibt nur ihre wahrscheinlichen Grundbedeutungen wieder. Möglich sind auch Wiedergaben wie „Fenster mit abgeschrägten Rahmen“, „Fenster mit sich verengenden Laibungen“ oder „Fenster, die innen weit und außen schmal waren“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Er ließ … anbringen
  rationale: Das Wayyiqtol von עשה bezeichnet hier die Herstellung als Teil des Baugeschehens. Im Deutschen gibt die Konstruktion mit „ließ … anbringen“ den natürlichen architektonischen Sinn wieder, ohne auszuschließen, dass Salomo als Bauherr handelt.
- source_word: לַבָּיִת
  choice: für das Haus
  rationale: ל wird als Angabe des Bestimmungszwecks verstanden. „Haus“ bewahrt die im Kontext auf den Tempel bezogene hebräische Bezeichnung בית.
- source_word: חַלּוֹנֵי
  choice: Fenster
  rationale: Die Constructus-Pluralform von חלון bezeichnet regulär Fenster beziehungsweise Fensteröffnungen.
- source_word: שְׁקֻפִים
  choice: mit zurückgesetzten … Rahmen
  rationale: Der seltene architektonische Ausdruck ist unsicher. „Zurückgesetzte Rahmen“ bietet eine verständliche Annäherung, ohne eine genaue bautechnische Rekonstruktion zu behaupten.
- source_word: אֲטֻמִים
  choice: geschlossenen
  rationale: Das passive Partizip von אטם hat die Grundbedeutung „verschlossen/geschlossen“. Die attributive Wiedergabe bewahrt beide seltenen Bestimmungen als Beschreibung der Fensterkonstruktion.
