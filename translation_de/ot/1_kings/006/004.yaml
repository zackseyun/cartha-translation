  source_fidelity: 'Die Grundbedeutungen werden getroffen: עשה kann im Baukontext mit „ließ ... anbringen“ wiedergegeben werden, לַבַּיִת mit „für das Haus“, und חַלּוֹנֵי mit „Fenster“. Die seltenen Partizipien שְׁקֻפִים und אֲטֻמִים sind jedoch im Entwurf zu eng und syntaktisch wenig überzeugend beiden auf „Rahmen“ bezogen. Insbesondere sind „geschlossene Rahmen“ im Deutschen keine klare architektonische Beschreibung. Eine Wiedergabe, die beide Bestimmungen unmittelbar bei den Fenstern belässt, wahrt die unsichere hebräische Konstruktion besser.'
  naturalness: „Zurückgesetzte, verschlossene Fenster“ ist modernes, verständliches Deutsch. Es vermeidet die sachlich und sprachlich missverständliche Formulierung „geschlossene Rahmen“. Die Fußnote erläutert, dass weder die genaue Bauform noch die präzise Zuordnung der seltenen Begriffe sicher ist.
  terminology: „Haus“ ist im unmittelbaren Kontext als Bezeichnung des Tempelbaus angemessen. Die architektonische Unklarheit wird nicht durch eine vermeintlich technische Rekonstruktion aufgelöst. „Verschlossen“ gibt die Grundbedeutung von אטם wieder, ohne daraus ausdrücklich Fensterläden, Gitter oder eine bestimmte Konstruktion abzuleiten.
  issues:
