base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/032.yaml
  text: Also[a], the two doors were of olivewood, and he carved on them engravings of cherubim and palm trees and open flowers, and overlaid them with gold[b]; and he spread the gold over the cherubim and over the palm trees.
translation:
  language: de
  text: Auch die beiden Türflügel waren aus Olivenholz. Auf ihnen schnitzte er Darstellungen von Kerubim, Palmen und geöffneten Blüten und überzog sie mit Gold. Das Gold brachte er auf den Kerubim und auf den Palmen an.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Er ließ das Gold über die Kerubim und über die Palmen hinabgehen.“ Die ungewöhnliche hebräische Formulierung beschreibt das Aufbringen des Goldes auf die geschnitzten Figuren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁתֵּי דַּלְתוֹת עֲצֵי שֶׁמֶן
  choice: Auch die beiden Türflügel waren aus Olivenholz
  rationale: ו verbindet den Satz additiv mit der vorherigen Baubeschreibung. דַּלְתוֹת bezeichnet hier die beiden beweglichen Türflügel; עֲצֵי שֶׁמֶן ist die übliche Bezeichnung für Olivenholz.
- source_word: וְקָלַע עֲלֵיהֶם מִקְלְעוֹת
  choice: Auf ihnen schnitzte er Darstellungen
  rationale: Das Verb und das verwandte Substantiv bezeichnen eingeschnitzte Zierarbeit. Die Wiedergabe vermeidet im Deutschen die schwerfällige Wiederholung „schnitzte Schnitzereien“, bewahrt aber den konkreten Charakter des Reliefschmucks.
- source_word: כְּרוּבִים
  choice: Kerubim
  rationale: Die traditionelle Transliteration bezeichnet die himmlischen Wächtergestalten der Tempelsymbolik, ohne die irreführenden Assoziationen von „Putten“ oder verniedlichten „Engeln“.
- source_word: תִמֹרוֹת
  choice: Palmen
  rationale: Das Wort bezeichnet in diesem Zusammenhang dekorative Palmendarstellungen; „Palmen“ ist klar und natürlich.
- source_word: וּפְטוּרֵי צִצִּים
  choice: geöffnete Blüten
  rationale: Die Wendung beschreibt florale Ornamente in aufgeblühter beziehungsweise geöffneter Form, ohne eine bestimmte Pflanzenart festzulegen.
- source_word: וְצִפָּה זָהָב
  choice: überzog sie mit Gold
  rationale: צפה bezeichnet hier das Belegen oder Überziehen der geschnitzten Holzflächen mit Gold.
- source_word: וַיָּרֶד ... אֶת־הַזָּהָב
  choice: Das Gold ließ er sich ... ausbreiten
  rationale: Die ungewöhnliche Kausativform von ירד enthält wörtlich die Vorstellung des Herabführens. Die gewählte Formulierung bleibt näher an diesem Bild als ein bloßes „auftragen“, ergibt im Deutschen jedoch einen verständlichen Vorgang des Vergoldens.
- source_word: עַל הַכְּרוּבִים וְעַל הַתִּמֹרוֹת
  choice: über die Kerubim und die Palmen
  rationale: Das wiederholte עַל hebt beide Gruppen der vergoldeten Motive gesondert hervor; im Deutschen genügt eine gemeinsame Präposition, ohne den Bezug zu verändern.
