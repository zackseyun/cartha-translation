id: 1KI.11.11
reference: 1 Kings 11:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה לִ/שְׁלֹמֹ֗ה יַ֚עַן אֲשֶׁ֣ר הָֽיְתָה זֹּ֣את עִמָּ֔/ךְ וְ/לֹ֤א שָׁמַ֨רְתָּ֙ בְּרִיתִ֣/י וְ/חֻקֹּתַ֔/י אֲשֶׁ֥ר צִוִּ֖יתִי עָלֶ֑י/ךָ קָרֹ֨עַ אֶקְרַ֤ע אֶת הַ/מַּמְלָכָה֙ מֵֽ/עָלֶ֔י/ךָ וּ/נְתַתִּ֖י/הָ לְ/עַבְדֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/011.yaml
  text: So Yahweh said to Solomon[a], “Because this has been with you, and you have not kept my covenant and my statutes that I commanded you, I will surely tear the kingdom away from you and give it to your servant.”
translation:
  language: de
  text: 'Da sagte Jahwe zu Salomo: „Weil es so mit dir steht[a] und du meinen Bund und meine Ordnungen, die ich dir geboten habe, nicht eingehalten hast, werde ich dir das Königreich ganz gewiss entreißen und es deinem Diener geben.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Weil dies bei dir gewesen ist.“ Der hebräische Ausdruck kann auf Salomos Zustand oder sein anhaltendes Verhalten hinweisen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen geläufige Wiedergabe des Gottesnamens bewahrt den Eigennamen statt ihn durch einen Titel zu ersetzen.
- source_word: יַעַן אֲשֶׁר
  choice: Weil
  rationale: Gibt die kausale Begründung des folgenden Gerichts natürlich und präzise wieder.
- source_word: הָיְתָה זֹּאת עִמָּךְ
  choice: es so mit dir steht
  rationale: Bewahrt die offene, zustandsbezogene Ausdrucksweise des elliptischen hebräischen Idioms, ohne sie eindeutig auf Gewohnheit oder einzelne Tat festzulegen.
- source_word: שָׁמַרְתָּ בְּרִיתִי
  choice: meinen Bund ... eingehalten hast
  rationale: „Einhalten“ ist mit Bund und Ordnungen idiomatisch und erhält den Gedanken treuer Beachtung.
- source_word: חֻקֹּתַי
  choice: meine Ordnungen
  rationale: „Ordnungen“ ist verständliches, würdevolles Deutsch für verbindliche göttliche Satzungen.
- source_word: צִוִּיתִי עָלֶיךָ
  choice: die ich dir geboten habe
  rationale: Gibt den Inhalt als an Salomo gerichtetes verbindliches Gebot natürlich wieder.
- source_word: קָרֹעַ אֶקְרַע
  choice: werde ... ganz gewiss entreißen
  rationale: Die Verstärkung durch Infinitivus absolutus und finites Verb wird mit „ganz gewiss“ ausgedrückt.
- source_word: הַמַּמְלָכָה
  choice: das Königreich
  rationale: Bezeichnet hier Salomos Herrschaftsgebiet beziehungsweise Reich.
- source_word: מֵעָלֶיךָ
  choice: dir ... entreißen
  rationale: Die Entfernung aus Salomos Herrschaft wird im Deutschen knapp und idiomatisch durch den Dativ bei „entreißen“ ausgedrückt.
- source_word: לְעַבְדֶּךָ
  choice: deinem Diener
  rationale: Im höfisch-politischen Zusammenhang bezeichnet עֶבֶד einen Salomo untergeordneten Diener, nicht notwendig einen Sklaven.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt den Gottesnamen; „Jahwe“ bewahrt ihn in der üblichen deutschen Form, ohne ihn durch einen Titel zu ersetzen.
- issue: Deutung von הָיְתָה זֹּאת עִמָּךְ
  choice: es so mit dir steht
  alternative: dies deine Handlungsweise gewesen ist; dies bei dir gewesen ist
  rationale: Die gewählte Fassung lässt die im Hebräischen vorhandene Spannung zwischen Zustand und dauerhaftem Verhalten bestehen und bleibt zugleich verständlich.
- issue: Reich oder Königsherrschaft bei הַמַּמְלָכָה
  choice: das Königreich
  alternative: die Königsherrschaft
  rationale: Der Kontext betrifft sowohl Salomos Herrschaft als auch das ihm unterstehende Reich. „Königreich“ ist die natürliche Wiedergabe, ohne den politischen Sinn unnötig einzuengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzführung bleibt nahe am Hebräischen, vermeidet aber unnatürliche Wörtlichkeit. Die emphatische Gerichtsankündigung wird hörbar bewahrt.
