id: 1KI.11.13
reference: 1 Kings 11:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: רַ֤ק אֶת כָּל הַ/מַּמְלָכָה֙ לֹ֣א אֶקְרָ֔ע שֵׁ֥בֶט אֶחָ֖ד אֶתֵּ֣ן לִ/בְנֶ֑/ךָ לְמַ֨עַן֙ דָּוִ֣ד עַבְדִּ֔/י וּ/לְמַ֥עַן יְרוּשָׁלִַ֖ם אֲשֶׁ֥ר בָּחָֽרְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/013.yaml
  text: Yet I will not tear away the whole kingdom; I will give one tribe to your son[a], for the sake of David my servant and for the sake of Jerusalem, which I have chosen.
translation:
  language: de
  text: Doch werde ich nicht das ganze Königreich wegreißen.[a] Einen Stamm werde ich deinem Sohn geben – um meines Dieners David willen und um Jerusalems willen, das ich erwählt habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Nur werde ich nicht das ganze Königreich wegreißen.“'
    reason: רַק kann hier neben dem adversativen „doch“ auch enger mit „nur“ wiedergegeben werden; beide Lesarten kennzeichnen eine Einschränkung des zuvor angekündigten Gerichts.
lexical_decisions:
- source_word: רַק
  choice: Doch
  rationale: רַק schränkt die zuvor angekündigte Gerichtsentscheidung ein. „Doch“ gibt diese adversative Einschränkung in natürlichem Deutsch wieder, ohne sie stärker auszudeuten.
- source_word: כָּל הַמַּמְלָכָה
  choice: das ganze Königreich
  rationale: כָּל bezeichnet hier die Gesamtheit des Reiches; „das ganze Königreich“ ist klar und idiomatisch.
- source_word: אֶקְרָע
  choice: werde ich … wegreißen
  rationale: קָרַע bezeichnet wörtlich ein Reißen oder Zerreißen. „Wegreißen“ bewahrt das kräftige Bild und bezeichnet zugleich den politischen Entzug des Reiches.
- source_word: שֵׁבֶט אֶחָד
  choice: einen Stamm
  rationale: שֵׁבֶט meint in diesem Zusammenhang eine Stammesgemeinschaft Israels, nicht den wörtlichen Stab oder das Zepter.
- source_word: אֶתֵּן לִבְנֶךָ
  choice: werde ich deinem Sohn geben
  rationale: Die einfache Aussage des Gebens wird direkt und ohne zusätzliche Deutung wiedergegeben.
- source_word: לְמַעַן דָּוִד עַבְדִּי
  choice: um meines Dieners David willen
  rationale: Die traditionelle, weiterhin verständliche Wendung „um … willen“ gibt den Beweggrund bzw. die Rücksichtnahme von לְמַעַן präzise wieder.
- source_word: וּלְמַעַן יְרוּשָׁלַם
  choice: und um Jerusalems willen
  rationale: Die Wiederholung der parallelen לְמַעַן-Konstruktion bleibt erhalten und wahrt so die hebräische Gewichtung beider Gründe.
- source_word: אֲשֶׁר בָּחָרְתִּי
  choice: das ich erwählt habe
  rationale: Das Perfekt bezeichnet Gottes bereits vollzogene und weiterhin maßgebliche Wahl Jerusalems. „Erwählt habe“ bewahrt zudem den theologischen Klang, ohne ihn näher festzulegen.
theological_decisions:
- issue: Grund für die Bewahrung eines Stammes
  choice: Die begrenzte Bewahrung wird gleichermaßen mit Gottes Rücksicht auf David und auf das von ihm erwählte Jerusalem begründet.
  alternative: Die Bewahrung ausschließlich auf den davidischen Bund oder vorrangig auf Jerusalem und den Tempel zurückzuführen.
  rationale: Der hebräische Text nennt in zwei parallelen לְמַעַן-Wendungen sowohl David als auch Jerusalem. Die Übersetzung wahrt beide Gründe, ohne ihr Verhältnis dogmatisch aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kräftige Reißmetapher und die parallele Formulierung „um … willen“ bleiben erhalten; der Gedankenstrich macht die Begründung gut lesbar, ohne die Satzstruktur inhaltlich zu verändern.
