source:
  edition: WLC
  text: וְ/צִוָּ֤ה אֵלָי/ו֙ עַל הַ/דָּבָ֣ר הַ/זֶּ֔ה לְ/בִ֨לְתִּי לֶ֔כֶת אַחֲרֵ֖י אֱלֹהִ֣ים אֲחֵרִ֑ים וְ/לֹ֣א שָׁמַ֔ר אֵ֥ת אֲשֶׁר צִוָּ֖ה יְהוָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/010.yaml
  text: and had commanded him concerning this matter[a], not to go after other gods, but he did not keep what Yahweh had commanded.
translation:
  language: de
  text: und ihm in dieser Sache geboten hatte, nicht anderen Göttern nachzulaufen[a]. Doch er hielt sich nicht an das, was Jahwe geboten hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Anderen Göttern nachlaufen“ ist eine im Alten Testament gebräuchliche Wendung dafür, sich anderen Gottheiten zuzuwenden und sie zu verehren.
    reason: cultural_note
lexical_decisions:
- source_word: וְצִוָּה אֵלָיו
  choice: und ihm … geboten hatte
  rationale: Das Perfekt bezeichnet im Zusammenhang ein vorausliegendes Gebot. Die Stellung des indirekten Objekts entspricht natürlichem Deutsch.
- source_word: עַל הַדָּבָר הַזֶּה
  choice: in dieser Sache
  rationale: דָּבָר bezeichnet hier die zuvor behandelte Angelegenheit; „Sache“ ist präzise und gegenwärtiges Standarddeutsch.
- source_word: לְבִלְתִּי לֶכֶת אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: nicht anderen Göttern nachzulaufen
  rationale: 'Die Formulierung bewahrt das hebräische Bild des Hinterhergehens und zugleich seinen bundestheologischen Sinn: sich anderen Gottheiten zuzuwenden und sie zu verehren.'
- source_word: וְלֹא שָׁמַר
  choice: Doch er hielt sich nicht an
  rationale: שׁמר bedeutet bei einem Gebot, es zu beachten beziehungsweise zu befolgen. „Doch“ gibt den im Zusammenhang deutlichen Gegensatz idiomatisch wieder.
- source_word: אֵת אֲשֶׁר צִוָּה יְהוָה
  choice: das, was Jahwe geboten hatte
  rationale: Die Formulierung gibt den Inhalt des göttlichen Gebots wieder, ohne ein im Hebräischen an dieser Stelle nicht ausdrücklich wiederholtes Objekt einzufügen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen JHWH; „Jahwe“ wahrt diese Funktion als persönlichen Gottesnamen.
- issue: Bundessprachliche Wendung „anderen Göttern nachlaufen“
  choice: Das Bild des Nachlaufens im Haupttext bewahren
  alternative: andere Götter verehren
  rationale: Die bildhafte und theologisch gespannte Ausdrucksweise des Hebräischen soll nicht auf ihre gemeinte Handlung reduziert werden; eine Fußnote erläutert den kultischen Sinn.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers setzt syntaktisch den vorhergehenden Vers fort; deshalb beginnt die Übersetzung entsprechend mit „und“. Der zweite Satz wird zur besseren Lesbarkeit abgesetzt, ohne den Sinnzusammenhang zu verändern.
