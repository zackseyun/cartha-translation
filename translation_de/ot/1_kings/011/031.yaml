source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ לְ/יָֽרָבְעָ֔ם קַח לְ/ךָ֖ עֲשָׂרָ֣ה קְרָעִ֑ים כִּ֣י כֹה֩ אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל הִנְ/נִ֨י קֹרֵ֤עַ אֶת הַ/מַּמְלָכָה֙ מִ/יַּ֣ד שְׁלֹמֹ֔ה וְ/נָתַתִּ֣י לְ/ךָ֔ אֵ֖ת עֲשָׂרָ֥ה הַ/שְּׁבָטִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/031.yaml
  text: 'And he said to Jeroboam[a], “Take for yourself ten pieces, for this is what Yahweh, the God of Israel, says: ‘Look, I am tearing the kingdom out of the hand of Solomon, and I will give you ten tribes.’”'
translation:
  language: de
  text: 'Und er sagte zu Jerobeam: »Nimm dir zehn Stücke[a], denn so spricht Jahwe, der Gott Israels: ›Sieh, ich reiße das Königreich aus der Hand Salomos und werde dir zehn Stämme geben.‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »zehn abgerissene Stücke«. Das hebräische Wort bezeichnet Stücke, die durch Zerreißen entstanden sind, und knüpft damit an Ahijas symbolische Handlung mit dem Gewand an.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח לְךָ
  choice: Nimm dir
  rationale: Der Imperativ קַח bedeutet »nimm«; לְךָ verleiht ihm die persönliche Nuance »für dich«, die im Deutschen idiomatisch durch »dir« wiedergegeben wird.
- source_word: קְרָעִים
  choice: Stücke
  rationale: Das von קרע (»zerreißen«) abgeleitete Substantiv bezeichnet die durch das Zerreißen des Gewandes entstandenen Stücke. »Stücke« ist im Deutschen natürlich; die Herkunft vom Verb wird in der Fußnote erläutert.
- source_word: כִּי כֹה אָמַר
  choice: denn so spricht
  rationale: Die prophetische Botenformel wird knapp, würdevoll und im Deutschen geläufig wiedergegeben. Das präsentische »spricht« entspricht der Funktion der Formel im unmittelbaren Gotteswort.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. »Jahwe« ist die im modernen Deutschen übliche Form.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Die Constructusverbindung wird in natürlichem Deutsch als identifizierende Bezeichnung wiedergegeben.
- source_word: הִנְנִי
  choice: Sieh, ich
  rationale: »Sieh« bewahrt die aufmerksamkeitslenkende und vergegenwärtigende Funktion von הִנְנִי, ohne das heute altertümlich wirkende »siehe« zu verwenden.
- source_word: קֹרֵעַ
  choice: reiße
  rationale: Das Partizip stellt Gottes Eingreifen anschaulich als unmittelbar einsetzende Handlung dar. Das deutsche Präsens wahrt diese prophetische Lebendigkeit.
- source_word: הַמַּמְלָכָה
  choice: das Königreich
  rationale: »Königreich« bezeichnet hier die von Salomo beherrschte politische Herrschaftseinheit präzise und allgemein verständlich.
- source_word: מִיַּד שְׁלֹמֹה
  choice: aus der Hand Salomos
  rationale: Die hebräische Hand-Metapher für Macht und Besitz bleibt erhalten; die Formulierung ist auch im Deutschen verständlich.
- source_word: וְנָתַתִּי לְךָ
  choice: und werde dir … geben
  rationale: Die Verbfolge bezeichnet die angekündigte Folgehandlung. Das deutsche Futur macht den Zukunftsbezug klar.
- source_word: עֲשָׂרָה הַשְּׁבָטִים
  choice: zehn Stämme
  rationale: Nach einer Zahl steht das Substantiv im Deutschen natürlicherweise ohne Artikel. Gemeint sind zehn der israelitischen Stämme.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. Die Wiedergabe »Jahwe« erhält diesen als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Zeitlicher Aspekt von קֹרֵעַ
  choice: ich reiße
  alternative: ich werde entreißen / ich bin im Begriff zu entreißen
  rationale: Das Präsens bewahrt die anschauliche Spannung des hebräischen Partizips zwischen unmittelbar bevorstehendem und als gegenwärtig dargestelltem göttlichem Handeln, ohne sie auf ein bloßes Futur festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist mit deutschen Anführungszeichen und verschachtelter Rede markiert. »Sieh« vermeidet sowohl das archaische »siehe« als auch eine umgangssprachliche Aufforderung. Die Hand-Metapher des Hebräischen bleibt bewusst erhalten.
