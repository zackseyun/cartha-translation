  text: וַ/יְהִ֗י בִּֽ/הְי֤וֹת דָּוִד֙ אֶת אֱד֔וֹם בַּ/עֲל֗וֹת יוֹאָב֙ שַׂ֣ר הַ/צָּבָ֔א לְ/קַבֵּ֖ר אֶת הַ/חֲלָלִ֑ים וַ/יַּ֥ךְ כָּל זָכָ֖ר בֶּ/אֱדֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/015.yaml
  text: And it happened[a], when David was in Edom, when Joab the commander of the army had gone up to bury the slain[b], that he struck down every male in Edom—
translation:
  language: de
  text: Es geschah nämlich[a], als David in Edom war[b], als Joab, der Befehlshaber des Heeres, hinaufzog, um die Erschlagenen zu begraben, dass er alles Männliche in Edom erschlug —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „Und es geschah“. Die hebräische Erzählformel führt hier eine Hintergrundangabe ein.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich steht hier ungewöhnlich: „als David mit Edom war“. Im Zusammenhang ist wohl Davids Aufenthalt oder Feldzug in Edom gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Es geschah nämlich
  rationale: Die übliche hebräische Erzählformel leitet hier eine Hintergrundangabe ein. „Nämlich“ macht den erklärenden Anschluss im Deutschen natürlich kenntlich, ohne den Ereignischarakter aufzugeben.
- source_word: בִּהְיוֹת דָּוִד אֶת אֱדוֹם
  choice: als David in Edom war
  rationale: ב mit dem Infinitiv von היה bildet einen Temporalsatz. Das ungewöhnliche אֶת אֱדוֹם bezeichnet im militärischen Zusammenhang wahrscheinlich Davids Anwesenheit beziehungsweise Feldzug in Bezug auf Edom; „in Edom“ ist die sachlich naheliegende, aber nicht alternativlose Wiedergabe.
- source_word: בַּעֲלוֹת יוֹאָב
  choice: und Joab ... hinaufzog
  rationale: Der temporale Infinitiv wird im Deutschen als koordinierte Hintergrundhandlung wiedergegeben. „Hinaufzog“ bewahrt die Bewegungsrichtung des Verbs עלה und passt zum militärischen Kontext.
- source_word: שַׂר הַצָּבָא
  choice: der Heerführer
  rationale: Der Ausdruck bezeichnet den obersten militärischen Befehlshaber. „Heerführer“ ist knapp, verständlich und würdevoll.
- source_word: לְקַבֵּר
  choice: um ... zu begraben
  rationale: Der Infinitiv mit לְ bezeichnet hier den Zweck von Joabs Hinaufziehen.
- source_word: הַחֲלָלִים
  choice: die Erschlagenen
  rationale: Das Wort bezeichnet gewaltsam Getötete, besonders Gefallene. „Erschlagene“ erhält diese kriegerische Nuance besser als das allgemeinere „Tote“.
- source_word: וַיַּךְ
  choice: Er erschlug
  rationale: נכה bezeichnet in diesem militärischen Zusammenhang tödliches Schlagen. Die direkte Wiedergabe vermeidet sowohl Beschönigung als auch erklärende Erweiterung.
- source_word: כָּל זָכָר
  choice: alle männlichen Personen
  rationale: זָכָר bezeichnet das männliche Geschlecht und ist nicht auf erwachsene Männer beschränkt. Die Formulierung bewahrt diese Reichweite, ohne sie enger als der hebräische Text zu fassen.
- source_word: בֶּאֱדוֹם
  choice: in Edom
  rationale: Die Präposition ב wird schlicht lokal wiedergegeben. Eine verstärkende Übersetzung wie „in ganz Edom“ würde über den Wortlaut hinausgehen.
theological_decisions:
- issue: Darstellung der berichteten militärischen Gewalt
  choice: Die Aussage, dass alle männlichen Personen in Edom erschlagen wurden, bleibt direkt und ungeschönt stehen.
  alternative: Die Aussage zu „die Edomiter besiegen“ abschwächen oder im Haupttext als vollständige Ausrottung auslegen.
  rationale: Der hebräische Text berichtet schwere Gewalt ausdrücklich. Die Übersetzung darf sie weder euphemistisch mildern noch über den genauen Wortlaut hinaus theologisch oder historisch ausdeuten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Der Doppelpunkt bildet den Übergang von den temporalen Hintergrundangaben zur Haupthandlung ab; der Gedankenstrich am Ende wahrt den offenen Anschluss an Vers 16.
