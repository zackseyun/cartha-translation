base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/017.yaml
  text: Hadad fled to Egypt[a], he and some Edomite men from among his father's servants with him[b]; and Hadad was a young boy.
translation:
  language: de
  text: Hadad floh nach Ägypten[a], zusammen mit einigen Edomitern aus dem Kreis der Diener seines Vaters; Hadad war noch ein kleiner Junge.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „um nach Ägypten zu kommen“. Das Hebräische verwendet hier „kommen“, wo man im Deutschen einfach das Ziel der Flucht nennt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ein sehr junger Knabe“. Die hebräische Wendung betont, dass Hadad noch sehr jung war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: floh
  rationale: Das Qal von ברח bezeichnet hier die Flucht vor einer Gefahr; „floh“ ist präzise und im deutschen Erzählstil natürlich.
- source_word: אֲדַד
  choice: Hadad
  rationale: Der Personenname wird nach der üblichen deutschen Form wiedergegeben.
- source_word: הוּא וַאֲנָשִׁים אֲדֹמִיִּים
  choice: zusammen mit einigen Edomitern
  rationale: Das selbstständige Pronomen hebt Hadad als Hauptperson hervor, während die Männer ihn begleiten. „Einige“ gibt die unbestimmte, nicht allumfassende Gruppe idiomatisch wieder; „Edomiter“ macht das zusätzliche „Männer“ im Deutschen entbehrlich.
- source_word: מֵעַבְדֵי אָבִיו
  choice: aus dem Kreis der Diener seines Vaters
  rationale: „Aus dem Kreis“ wahrt die partitive Bedeutung von מִן; עֶבֶד wird im Kontext des väterlichen Haushalts bzw. Hofes neutral mit „Diener“ übersetzt.
- source_word: אִתּוֹ
  choice: zusammen mit
  rationale: Die Begleitung Hadads wird im Deutschen natürlich in die vorangehende Wortgruppe eingebunden.
- source_word: לָבוֹא מִצְרָיִם
  choice: nach Ägypten
  rationale: Nach einem Bewegungsverb bezeichnet die Konstruktion das Ziel der Flucht. Deutsch sagt idiomatisch „nach Ägypten“, während eine wörtliche Wiedergabe „um nach Ägypten zu kommen“ schwerfälliger wäre.
- source_word: נַעַר קָטָן
  choice: noch ein kleiner Junge
  rationale: נַעַר bezeichnet einen Jungen bzw. jungen Menschen, und קָטָן betont sein geringes Alter. „Noch ein kleiner Junge“ bringt diese Altersangabe in natürlichem Deutsch zum Ausdruck.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die umständliche hebräische Reihung wurde behutsam gegliedert, ohne Angaben auszulassen. „Aber“ nimmt den erzählerischen Gegensatz des וַ auf; „damals“ verdeutlicht idiomatisch die begleitende Zustandsangabe, ohne eine neue Sachinformation einzuführen.
