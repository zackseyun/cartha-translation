  yaml_path: translation/ot/1_kings/011/041.yaml
  text: The rest of the acts of Solomon[a], and all that he did, and his wisdom—are they not written in the Book of the Acts of Solomon?
translation:
  language: de
  text: Die übrigen Taten Salomos[a], alles, was er getan hat, und seine Weisheit – sind sie nicht im Buch der Taten Salomos aufgeschrieben?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die übrigen Angelegenheiten Salomos“. Wörtlich: „die übrigen Worte Salomos“; in dieser geschichtlichen Schlussformel bezeichnet der Ausdruck die überlieferten Angelegenheiten beziehungsweise Taten des Königs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי שְׁלֹמֹה
  choice: Was sonst noch über Salomo zu berichten ist
  rationale: יֶתֶר bezeichnet das Übrige; דִּבְרֵי meint in der königlichen Schlussformel nicht nur Worte, sondern die überlieferten Angelegenheiten und Taten des Königs. Die deutsche Formulierung gibt die historiografische Bedeutung natürlich wieder.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: alles, was er tat
  rationale: Die breite Bedeutung von עשה bleibt erhalten, ohne Leistung oder Erfolg zusätzlich auszudrücken.
- source_word: וְחָכְמָתוֹ
  choice: und seine Weisheit
  rationale: Direkte Wiedergabe des Substantivs mit Suffix; Salomos Weisheit bleibt als eigener Gegenstand der Überlieferung hervorgehoben.
- source_word: הֲלוֹא הֵם כְּתֻבִים
  choice: steht das nicht … geschrieben?
  rationale: Bewahrt die rhetorische Frage, die eine bejahende Antwort erwartet. Der deutsche Singular fasst die zuvor genannten Inhalte kollektiv als Überlieferungsstoff auf.
- source_word: עַל סֵפֶר
  choice: im Buch
  rationale: עַל wird bei einem schriftlichen Quellenverweis im Deutschen idiomatisch mit „im“ wiedergegeben; סֵפֶר kann hier Buch beziehungsweise Schriftrolle bezeichnen.
- source_word: סֵפֶר דִּבְרֵי שְׁלֹמֹה
  choice: Buch der Geschichte Salomos
  rationale: Der Titel bezeichnet offenbar eine Quelle über Salomos Regierung. „Geschichte“ gibt דִּבְרֵי idiomatisch als Bericht über Angelegenheiten und Taten wieder, ohne eine Gleichsetzung mit dem biblischen Buch der Chronik nahezulegen.
