source:
  edition: WLC
  text: וַ/יִּתְאַנַּ֥ף יְהוָ֖ה בִּ/שְׁלֹמֹ֑ה כִּֽי נָטָ֣ה לְבָב֗/וֹ מֵ/עִ֤ם יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הַ/נִּרְאָ֥ה אֵלָ֖י/ו פַּעֲמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/009.yaml
  text: And Yahweh became angry with Solomon, because his heart had turned away from Yahweh, the God of Israel, who had appeared to him twice.
translation:
  language: de
  text: Und Jahwe wurde zornig auf Salomo, weil sich sein Herz von Jahwe, dem Gott Israels, abgewandt hatte, der ihm zweimal erschienen war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְאַנַּף
  choice: wurde zornig
  rationale: Die Form bezeichnet hier das Aufkommen beziehungsweise die Äußerung von Zorn. „Wurde zornig“ gibt diesen dynamischen Verbalaspekt natürlich wieder, ohne die Aussage zu verstärken.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: בִּשְׁלֹמֹה
  choice: auf Salomo
  rationale: Die Präposition בְּ wird bei einem Verb des Zorns im Deutschen idiomatisch mit „zornig auf“ wiedergegeben.
- source_word: כִּי
  choice: weil
  rationale: כִּי leitet den Grund für Jahwes Zorn ein; „weil“ stellt diesen Zusammenhang im Deutschen klar dar.
- source_word: נָטָה לְבָבוֹ
  choice: sich sein Herz … abgewandt hatte
  rationale: Die Wendung bewahrt das biblische Herz-Motiv und gibt die Abkehr in gut verständlichem Deutsch wieder. Das Plusquamperfekt ordnet die Abwendung zeitlich vor dem Zorn ein.
- source_word: מֵעִם
  choice: von
  rationale: Die Präposition bezeichnet hier die Trennung von Jahwe; zusammen mit „abgewandt“ ist „von“ die natürliche deutsche Entsprechung.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: dem Gott Israels
  rationale: Die Genitivverbindung ist eine klare und traditionelle Wiedergabe der hebräischen Constructus-Verbindung.
- source_word: הַנִּרְאָה אֵלָיו
  choice: der ihm … erschienen war
  rationale: Das attributive Partizip wird natürlich als Relativsatz wiedergegeben. Das Plusquamperfekt verweist auf die vorausgegangenen Erscheinungen.
- source_word: פַּעֲמָיִם
  choice: zweimal
  rationale: „Zweimal“ ist die idiomatische deutsche Wiedergabe der hebräischen Dualform.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Text nennt den Gottesnamen unmittelbar. „Jahwe“ bewahrt ihn als persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Anthropopathische Rede vom Zorn Gottes
  choice: wurde zornig
  alternative: war zornig; geriet in Zorn
  rationale: Die Übersetzung lässt die direkte Aussage des Textes über Jahwes Zorn stehen, ohne sie abzuschwächen oder über das Hebräische hinaus zu intensivieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am Hebräischen, klingt jedoch natürlich; das Herz-Motiv und die zweimalige Gotteserscheinung bleiben ausdrücklich erhalten.
