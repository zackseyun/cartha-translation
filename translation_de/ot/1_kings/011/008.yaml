  text: And so he did for all his foreign wives[a], who were burning incense and sacrificing to their gods.
translation:
  language: de
  text: Und ebenso tat er es für alle seine ausländischen Frauen[a], die ihren Göttern Räucheropfer darbrachten und opferten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Und so tat er es für alle seine ausländischen Frauen.« Das Hebräische lässt die konkrete Handlung unausgesprochen und verweist damit auf den vorigen Vers.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֵן
  choice: Und ebenso
  rationale: Die Wendung knüpft an den vorigen Vers an und bezeichnet ein entsprechendes Vorgehen, ohne die dort genannte Handlung ausdrücklich zu wiederholen.
- source_word: עָשָׂה
  choice: handelte er
  rationale: Das breite Verb »tun/handeln« bleibt hier, wie im Hebräischen, ohne ausdrückliches Objekt; »handelte er« ist im Deutschen verständlicher als das isolierte »tat er«.
- source_word: לְכָל נָשָׁיו הַנָּכְרִיּוֹת
  choice: für alle seine ausländischen Frauen
  rationale: לְ bezeichnet hier die Begünstigten seines Handelns. נָשִׁים meint im Kontext Ehefrauen; »Frauen« ist dafür im Deutschen natürlich. »Ausländisch« bezeichnet ihre Herkunft außerhalb Israels.
- source_word: מַקְטִירוֹת
  choice: Räucherwerk verbrannten
  rationale: Das feminine Pluralpartizip stimmt mit den ausländischen Frauen überein und bezeichnet im kultischen Zusammenhang das Verbrennen von Räucherwerk. Das deutsche Präteritum gibt die fortgesetzte bzw. wiederholte Tätigkeit im Erzählzusammenhang natürlich wieder.
- source_word: וּמְזַבְּחוֹת
  choice: und Opfer darbrachten
  rationale: Das feminine Pluralpartizip bezeichnet das Vollziehen von Opfern; »Opfer darbringen« ist gegenwärtiges, würdevolles Deutsch.
- source_word: לֵאלֹהֵיהֶן
  choice: ihren Göttern
  rationale: Die Pluralform mit femininem Pluralsuffix verweist auf die Gottheiten der Frauen; die Kleinschreibung unterscheidet sie vom Gott Israels.
theological_decisions:
- issue: Bezug der Partizipien מַקְטִירוֹת וּמְזַבְּחוֹת
  choice: Die ausländischen Frauen sind diejenigen, die Räucherwerk verbrennen und Opfer darbringen.
  alternative: Die Partizipien könnten lockerer die Kulthandlungen bezeichnen, die mit den von Salomo eingerichteten Höhen verbunden waren.
  rationale: Die femininen Pluralpartizipien stimmen grammatisch unmittelbar mit »seinen ausländischen Frauen« überein. Die Übersetzung bewahrt diesen naheliegenden Bezug und verlagert die Handlungen nicht auf Salomo.
- issue: Auslassung des Gegenstands von עָשָׂה
  choice: Die konkrete Handlung bleibt unausgesprochen und wird aus dem vorigen Vers ergänzt.
  alternative: »Er baute Höhen für alle seine ausländischen Frauen« oder »Dasselbe tat er …«
  rationale: Der hebräische Text setzt die vorausgehende Handlung voraus, nennt sie in diesem Vers aber nicht erneut. Die Übersetzung bewahrt diese Ellipse, statt »Höhen bauen« ausdrücklich einzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die etwas markierte Formulierung »Und ebenso handelte er« bewahrt die Ellipse des Hebräischen; die Fußnote bietet eine idiomatische Alternative. Die fortdauernde bzw. wiederholte Bedeutung der hebräischen Partizipien ergibt sich im Deutschen aus dem kultischen Zusammenhang.
