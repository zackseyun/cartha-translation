  source_fidelity: Der Bezug der femininen Pluralpartizipien auf die ausländischen Frauen und die Wiedergabe von לֵאלֹהֵיהֶן mit „ihren Göttern“ sind sachgerecht. Auch die im Hebräischen elliptische Bezugnahme auf die vorangehende Handlung bleibt mit „tat er es“ kontextabhängig, ohne den Bau der Höhen ausdrücklich einzutragen.
  naturalness: „Und ebenso handelte er für“ ist im modernen Standarddeutsch unidiomatisch und lässt die Konstruktion unnötig abstrakt wirken. „Und ebenso tat er es für“ ist die natürliche deutsche Entsprechung, die zugleich die hebräische Ellipse wahrt. „Räucheropfer darbrachten und opferten“ ist im kultischen Kontext idiomatischer als „Räucherwerk verbrannten und Opfer darbrachten“.
  terminology: „Ausländische Frauen“ kann im Kontext weiterhin „ausländische Ehefrauen“ bezeichnen und bewahrt die knappe Form des Ausgangstextes. „Räucheropfer“ und „opfern“ bilden die beiden unterschiedlichen kultischen Verben klar und ohne unzulässige Spezifizierung ab.
