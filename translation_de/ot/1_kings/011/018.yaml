source:
  edition: WLC
  text: וַ/יָּקֻ֨מוּ֙ מִ/מִּדְיָ֔ן וַ/יָּבֹ֖אוּ פָּארָ֑ן וַ/יִּקְחוּ֩ אֲנָשִׁ֨ים עִמָּ֜/ם מִ/פָּארָ֗ן וַ/יָּבֹ֤אוּ מִצְרַ֨יִם֙ אֶל פַּרְעֹ֣ה מֶֽלֶךְ מִצְרַ֔יִם וַ/יִּתֶּן ל֣/וֹ בַ֗יִת וְ/לֶ֨חֶם֙ אָ֣מַר ל֔/וֹ וְ/אֶ֖רֶץ נָ֥תַן לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/018.yaml
  text: They arose from Midian and came to Paran[a], and they took men with them from Paran, and they came to Egypt, to Pharaoh king of Egypt, and he gave him a house and assigned him food, and gave him land.
translation:
  language: de
  text: Sie brachen von Midian auf und kamen nach Paran. Aus Paran nahmen sie Männer mit sich und kamen nach Ägypten zum Pharao, dem König von Ägypten. Dieser gab ihm ein Haus, wies ihm Nahrung zu[a] und gab ihm Land.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und Brot sagte er ihm“; gemeint ist offenbar, dass der Pharao ihm Versorgung anordnete oder zuwies.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: sie brachen auf
  rationale: קום bedeutet wörtlich „aufstehen“, wird in Reiseerzählungen jedoch idiomatisch für das Aufbrechen verwendet. „Sie brachen auf“ gibt hier den natürlichen deutschen Sinn wieder.
- source_word: מִמִּדְיָן
  choice: von Midian
  rationale: Der Ortsname wird in seiner im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: פָּארָן
  choice: Paran
  rationale: Der Eigenname wird transliteriert und nicht übersetzt.
- source_word: וַיִּקְחוּ אֲנָשִׁים עִמָּם מִפָּארָן
  choice: Aus Paran nahmen sie Männer mit sich
  rationale: אֲנָשִׁים bezeichnet hier Männer; die deutsche Wortstellung macht deutlich, dass sie diese Begleiter in Paran mitnahmen.
- source_word: מִצְרַיִם
  choice: Ägypten
  rationale: Verwendet wird die gebräuchliche deutsche Form des Ländernamens.
- source_word: אֶל־פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: zum Pharao, dem König von Ägypten
  rationale: Die Apposition des Hebräischen wird im Deutschen natürlich und eindeutig wiedergegeben.
- source_word: וַיִּתֶּן לוֹ בַיִת
  choice: Dieser gab ihm ein Haus
  rationale: „Dieser“ nimmt eindeutig den unmittelbar zuvor genannten Pharao als Subjekt auf; בַּיִת wird ohne unnötige Erweiterung als „Haus“ übersetzt.
- source_word: וְלֶחֶם אָמַר לוֹ
  choice: wies ihm Nahrung zu
  rationale: Die ungewöhnliche Wendung lautet wörtlich etwa „und Brot sagte er ihm“. Im Zusammenhang bezeichnet sie offenbar eine Anordnung beziehungsweise Zuweisung von Versorgung; „Nahrung“ gibt den weiteren Sinn von לֶחֶם wieder. Eine Fußnote macht die auffällige hebräische Formulierung sichtbar.
- source_word: וְאֶרֶץ נָתַן לוֹ
  choice: und gab ihm Land
  rationale: אֶרֶץ bezeichnet hier am ehesten zugewiesenen Landbesitz oder Grund und Boden, nicht ein ganzes Land im politischen Sinn.
theological_decisions: []
