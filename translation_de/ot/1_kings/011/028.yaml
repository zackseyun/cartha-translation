  text: וְ/הָ/אִ֥ישׁ יָרָבְעָ֖ם גִּבּ֣וֹר חָ֑יִל וַ/יַּ֨רְא שְׁלֹמֹ֜ה אֶת הַ/נַּ֗עַר כִּֽי עֹשֵׂ֤ה מְלָאכָה֙ ה֔וּא וַ/יַּפְקֵ֣ד אֹת֔/וֹ לְ/כָל סֵ֖בֶל בֵּ֥ית יוֹסֵֽף־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/028.yaml
  text: The man Jeroboam was a mighty man of valor[a], and Solomon saw that the young man was industrious[b], so he appointed him over all the labor force of the house of Joseph.
translation:
  language: de
  text: Jerobeam war ein tüchtiger Mann[a], und Salomo sah, dass der junge Mann arbeitsam war; deshalb setzte er ihn über die gesamte Fronarbeit des Hauses Josef[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein tapferer Mann«, »ein starker Mann« oder »ein besonders fähiger Mann«. Die hebräische Wendung kann Stärke, Tapferkeit oder bemerkenswerte Tüchtigkeit bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Mit dem »Haus Josef« sind die von Josef abstammenden Stämme gemeint, besonders Ephraim und Manasse.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָאִישׁ יָרָבְעָם
  choice: Der Mann Jerobeam
  rationale: Die Nominalphrase wird eng am Hebräischen wiedergegeben; das vorangestellte וְ führt die Erzählung weiter, ohne ein ausdrückliches zeitliches »nun« zu verlangen.
- source_word: גִּבּוֹר חָיִל
  choice: ein tüchtiger Mann
  rationale: Die Wendung bezeichnet je nach Zusammenhang Stärke, Tapferkeit, Tüchtigkeit oder besondere Befähigung. Da hier Jerobeams Eignung für eine Verwaltungsaufgabe im Vordergrund steht, ist »tüchtig« kontextgerecht; die weitere Bedeutungsbreite bleibt in der Fußnote sichtbar.
- source_word: הַנַּעַר
  choice: der junge Mann
  rationale: נַעַר kann einen Jungen, jungen Mann oder Diener bezeichnen. Jerobeams übertragene Verantwortung spricht hier für »junger Mann«.
- source_word: כִּי עֹשֵׂה מְלָאכָה הוּא
  choice: dass der junge Mann seine Arbeit geschickt ausführte
  rationale: 'Wörtlich etwa: »dass er einer war, der Arbeit verrichtete«. Die Formulierung drückt im Kontext erkennbare Arbeitsfähigkeit aus; »geschickt ausführte« vermeidet die zu enge Festlegung allein auf Fleiß.'
- source_word: וַיַּפְקֵד אֹתוֹ
  choice: setzte er ihn über
  rationale: Die Hifil-Form von פקד bezeichnet hier die Einsetzung in eine Aufsichtsfunktion.
- source_word: לְכָל סֵבֶל
  choice: über den gesamten Frondienst
  rationale: סֵבֶל bezeichnet Lastarbeit beziehungsweise den organisierten Arbeitsdienst für königliche Bauvorhaben. »Frondienst« bringt den belastenden, verpflichtenden Charakter im damaligen Verwaltungskontext prägnant zum Ausdruck.
- source_word: בֵּית יוֹסֵף
  choice: des Hauses Josef
  rationale: Die traditionelle Stammesbezeichnung wird formal bewahrt und in einer Fußnote erklärt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt nah an der hebräischen Erzählstruktur, verwendet aber eine natürliche deutsche Satzverknüpfung. »Frondienst« ist historisch verständlich und genauer als das mehrdeutige »Arbeitsheer« oder das neutrale »Arbeitskräfte«.
