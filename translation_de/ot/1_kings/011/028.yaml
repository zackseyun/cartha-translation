    issue: »seine Arbeit geschickt ausführte« ist zu spezifisch.
    rationale: Das Hebräische sagt wörtlich, dass er Arbeit verrichtete bzw. ein Arbeitender war. Geschicklichkeit kann kontextuell vermutet werden, ist aber nicht ausdrücklich bezeichnet. »arbeitsam war« bewahrt die aus dem Zusammenhang hervorgehende positive Einschätzung ohne diese zusätzliche Festlegung.
  - severity: low
    issue: »Der Mann Jerobeam war ein tüchtiger Mann« ist stilistisch redundant.
    rationale: Die Wiederholung von »Mann« ist zwar formal am Hebräischen orientiert, im modernen Standarddeutsch aber schwerfällig. Der Eigenname kann den Bezug ohne Bedeutungsverlust tragen.
