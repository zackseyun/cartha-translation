revisions:
- from: Der Mann Jerobeam war ein tüchtiger Mann[a]. Als Salomo sah, dass der junge Mann seine Arbeit geschickt ausführte, setzte er ihn über den gesamten Frondienst des Hauses Josef[b].
  to: Jerobeam war ein tüchtiger Mann[a], und Salomo sah, dass der junge Mann arbeitsam war; deshalb setzte er ihn über die gesamte Fronarbeit des Hauses Josef[b].
  rationale: Die Revision beseitigt die deutsche Tautologie, gibt die narrative Verknüpfung ohne zusätzliche Zeitrelation wieder und ersetzt die nicht ausdrücklich im Hebräischen enthaltene Geschicklichkeit durch »arbeitsam«. Die historische und administrative Bedeutung von סֵבֶל bleibt mit »Fronarbeit« klar erkennbar. Fußnotenanker und Fußnoten bleiben vollständig und korrekt zugeordnet.
