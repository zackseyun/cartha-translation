base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/043.yaml
  text: And Solomon slept with his fathers and was buried in the city of David his father[a], and Rehoboam his son reigned in his place.
translation:
  language: de
  text: Und Salomo legte sich zu seinen Vätern[a] und wurde in der Stadt Davids, seines Vaters, begraben. Und sein Sohn Rehabeam wurde an seiner Stelle König.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »legte sich zu seinen Vätern«; eine übliche Umschreibung für das Sterben und die Zugehörigkeit zu den Vorfahren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: legte sich zu seinen Vätern
  rationale: Die traditionelle deutsche Wendung bewahrt das hebräische Sterbeidiom und dessen dynastischen Bezug, ohne es auf das schlichte »starb« zu reduzieren.
- source_word: וַיִּקָּבֵר
  choice: wurde begraben
  rationale: Die passive Wiedergabe entspricht dem Nifal und ist im Deutschen natürlich.
- source_word: בְּעִיר דָּוִד אָבִיו
  choice: in der Stadt seines Vaters David
  rationale: Diese Wortstellung bezeichnet den Ort als Davidsstadt und bewahrt zugleich die ausdrückliche Identifikation Davids als Salomos Vater.
- source_word: וַיִּמְלֹךְ
  choice: wurde … König
  rationale: Im Deutschen gibt die Formulierung den Regierungsantritt in dieser Nachfolgenotiz natürlicher wieder als »regierte«, ohne den königlichen Sinn abzuschwächen.
- source_word: תַּחְתָּיו
  choice: an seiner Stelle
  rationale: Die Wendung bewahrt den Gedanken der Nachfolge und Ablösung genauer als das nur zeitliche »nach ihm«.
theological_decisions:
- issue: Bedeutung des Sterbeidioms שׁכב עם־אבות
  choice: Das Bild »legte sich zu seinen Vätern« wird im Text bewahrt und in der Fußnote als übliche Umschreibung des Todes erklärt.
  alternative: Direkte Wiedergabe mit »starb« oder deutende Festlegung auf eine bestimmte Jenseitsvorstellung.
  rationale: Der hebräische Wortlaut bezeichnet den Tod und die Zuordnung zu den Vorfahren, ohne hier eine ausgearbeitete Lehre über den Zustand nach dem Tod zu formulieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die königliche Todes- und Nachfolgeformel bleibt erkennbar; das ungewohnte hebräische Sterbeidiom wird durch eine knappe Fußnote erschlossen.
