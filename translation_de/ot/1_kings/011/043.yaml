  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Abfolge und die wesentlichen Aussagen des Hebräischen zutreffend wieder: Salomos Todesformel, sein Begräbnis, der Begräbnisort und Rehabeams Nachfolge. Die Wendung „Stadt seines Vaters David“ ist jedoch im heutigen Deutsch syntaktisch unnötig schwer verständlich und kann den appositiven Bezug verwischen. „Stadt Davids, seines Vaters“ bildet בְּעִיר דָּוִד אָבִיו klarer ab.'
  naturalness: „Legte sich zu seinen Vätern“ ist als bewusst formelhafte, biblisch geprägte Ausdrucksweise mit Fußnote vertretbar. Die Umstellung zu „in der Stadt Davids, seines Vaters“ ist deutlich natürlicher und eindeutiger als „in der Stadt seines Vaters David“.
  terminology: Die Eigennamen Salomo und Rehabeam sind korrekt. „wurde König“ gibt die Nachfolge sachgerecht wieder; „an seiner Stelle“ entspricht תַּחְתָּיו. Die Fußnote sollte nicht von einer metaphysischen „Vereinigung“ sprechen, sondern die konventionelle Todes- und Vorfahrenformel neutral erklären.
  issues:
  - severity: medium
    issue: Unklare deutsche Wiedergabe des Begräbnisorts
    rationale: „in der Stadt seines Vaters David“ ist zwar grundsätzlich analysierbar, doch die Zuordnung von „David“ als Apposition zu „Vaters“ ist im modernen Deutsch weniger klar. Das Hebräische nennt ausdrücklich die Stadt Davids und fügt „seines Vaters“ appositiv hinzu.
  - severity: low
    issue: Fußnote formuliert die Bedeutung des Idioms leicht zu stark
    rationale: „Vereinigung mit den Vorfahren“ kann eine über das formelhafte Sterbeidiom hinausgehende Aussage nahelegen. Eine neutrale Erklärung als Umschreibung des Sterbens und der Zugehörigkeit zu den Vorfahren wahrt die Offenheit des Ausdrucks.
