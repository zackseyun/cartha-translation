  text: וַ/יִּתְפֹּ֣שׂ אֲחִיָּ֔ה בַּ/שַּׂלְמָ֥ה הַ/חֲדָשָׁ֖ה אֲשֶׁ֣ר עָלָ֑י/ו וַ/יִּ֨קְרָעֶ֔/הָ שְׁנֵ֥ים עָשָׂ֖ר קְרָעִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/030.yaml
  text: Then Ahijah took hold of the new cloak that was on him and tore it into twelve pieces[a].
translation:
  language: de
  text: Da ergriff Ahija den neuen Mantel, der auf ihm war,[a] und zerriss ihn in zwölf Stücke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der auf ihm war“. Der Bezug von „ihm“ ist im Hebräischen nicht ausdrücklich geklärt; gemeint sein kann Ahija oder Jerobeam.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפֹּשׂ
  choice: ergriff
  rationale: Das Verb bezeichnet ein konkretes Ergreifen oder Festhalten. „Ergriff“ ist im Deutschen knapp, natürlich und lässt keine unnötig gewaltsame Nuance anklingen.
- source_word: שַׂלְמָה
  choice: Mantel
  rationale: Das Substantiv bezeichnet ein Obergewand. „Mantel“ ist allgemein verständlich und passt zu einem Kleidungsstück, das in Stücke gerissen wird.
- source_word: הַחֲדָשָׁה
  choice: neu
  rationale: Das Adjektiv bedeutet direkt „neu“; das erzählerisch auffällige Detail bleibt erhalten.
- source_word: אֲשֶׁר עָלָיו
  choice: den er anhatte
  rationale: Die hebräische Wendung lautet wörtlich „der auf ihm war“. „Den er anhatte“ gibt dies in natürlichem modernem Deutsch wieder, ohne festzulegen, ob Ahija oder nach dem weiteren Kontext Jerobeam der Träger war.
- source_word: וַיִּקְרָעֶהָ
  choice: zerriss ihn
  rationale: Das Verb bedeutet „zerreißen“; das feminine Objektsuffix bezieht sich auf das Kleidungsstück, das im Deutschen als „Mantel“ maskulin ist.
- source_word: שְׁנֵים עָשָׂר קְרָעִים
  choice: in zwölf Stücke
  rationale: Die Wendung bezeichnet zwölf abgerissene beziehungsweise zerrissene Teile. „In zwölf Stücke“ drückt das Ergebnis idiomatisch und präzise aus.
theological_decisions:
- issue: Bezug des Pronomens in אֲשֶׁר עָלָיו
  choice: Die Übersetzung lässt den Träger mit „den er anhatte“ ebenso offen wie das Hebräische.
  alternative: „den Ahija anhatte“ oder „den Jerobeam anhatte“
  rationale: Das maskuline Suffix kann im unmittelbaren Zusammenhang auf Ahija oder Jerobeam bezogen werden. Eine ausdrückliche Namensnennung würde die echte syntaktische Mehrdeutigkeit beseitigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bildet die hebräische Erzählbewegung ab; die echte Mehrdeutigkeit beim Träger des Mantels wird im Text bewahrt und in der Fußnote erläutert.
