source:
  edition: WLC
  text: וְ/לֹֽא אֶקַּ֥ח אֶת כָּל הַ/מַּמְלָכָ֖ה מִ/יָּד֑/וֹ כִּ֣י נָשִׂ֣יא אֲשִׁתֶ֗/נּוּ כֹּ֚ל יְמֵ֣י חַיָּ֔י/ו לְמַ֨עַן דָּוִ֤ד עַבְדִּ/י֙ אֲשֶׁ֣ר בָּחַ֣רְתִּי אֹת֔/וֹ אֲשֶׁ֥ר שָׁמַ֖ר מִצְוֺתַ֥/י וְ/חֻקֹּתָֽ/י־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/034.yaml
  text: But I will not take the whole kingdom out of his hand, because I will make him ruler all the days of his life, for the sake of David my servant, whom I chose, who kept my commandments and my statutes.
translation:
  language: de
  text: Doch ich werde ihm nicht das ganze Königreich aus der Hand nehmen, denn ich werde ihn sein Leben lang als Herrscher einsetzen – um meines Dieners David willen, den ich erwählt habe und der meine Gebote und Satzungen gehalten hat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָשִׂיא
  choice: Herrscher
  rationale: Bezeichnet hier allgemein den Regierenden. „Herrscher“ gibt die Funktion im Kontext klar wieder, ohne den spezielleren modernen Rang „Fürst“ aufzudrängen.
- source_word: מַמְלָכָה
  choice: Königreich
  rationale: Entspricht im Zusammenhang dem von Salomo regierten Reich und bewahrt den königlichen Bezug.
- source_word: חֻקּוֹת
  choice: Satzungen
  rationale: Bewahrt neben „Gebote“ die rechtlich geprägte zweite Bezeichnung für Gottes verbindliche Bestimmungen.
theological_decisions:
- issue: Begründung für Salomos lebenslange Herrschaft
  choice: „um meines Dieners David willen“ bleibt ausdrücklich als göttliches Motiv erhalten
  alternative: Eine Deutung als Verdienst Davids oder als bloßer Hinweis auf die davidische Dynastie
  rationale: Der hebräische Text nennt David als Beweggrund, entfaltet aber an dieser Stelle nicht, wie dieser Grund theologisch genau zu verstehen ist.
- issue: Aussage über Davids Gehorsam
  choice: Die uneingeschränkte Formulierung „der meine Gebote und Satzungen gehalten hat“ wird bewahrt
  alternative: Eine abschwächende Formulierung wie „der grundsätzlich ... gehalten hat“
  rationale: Die Spannung zu Erzählungen über Davids Versagen darf nicht durch einen erklärenden Zusatz im Vers aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzverbindung mit „sondern“ gibt den hebräischen Kontrast natürlich wieder; der Gedankenstrich gliedert die Begründung, ohne ihren Sinn zu verändern.
