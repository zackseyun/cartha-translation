  source_fidelity: 'Die Übersetzung bildet die hebräische Satzfolge und die wesentlichen Bedeutungen zuverlässig ab: Reson sammelt Männer um sich, wird Anführer einer bewaffneten Schar, und der Text behält bei den folgenden Verben den auffälligen Plural. „Als David sie tötete“ gibt die temporale Konstruktion בַּהֲרֹג angemessen wieder, ohne den nicht völlig eindeutigen Bezug von „sie“ aufzulösen.'
