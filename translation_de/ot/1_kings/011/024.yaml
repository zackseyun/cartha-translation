  text: וַ/יִּקְבֹּ֤ץ עָלָי/ו֙ אֲנָשִׁ֔ים וַ/יְהִ֣י שַׂר גְּד֔וּד בַּ/הֲרֹ֥ג דָּוִ֖ד אֹתָ֑/ם וַ/יֵּלְכ֤וּ דַמֶּ֨שֶׂק֙ וַ/יֵּ֣שְׁבוּ בָ֔/הּ וַֽ/יִּמְלְכ֖וּ בְּ/דַמָּֽשֶׂק־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/024.yaml
  text: He gathered men to himself and became commander of a band when David killed them. They went to Damascus[a], settled there, and reigned in Damascus.
translation:
  language: de
  text: Er sammelte Männer um sich und wurde Anführer einer Schar, als David sie tötete. Sie zogen nach Damaskus[a], ließen sich dort nieder und herrschten in Damaskus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen stehen in der zweiten Hälfte des Verses durchgehend Verben im Plural: „Sie zogen … ließen sich nieder … herrschten.“ Manche Übersetzungen glätten zum Singular („er“), weil der Zusammenhang Reson in den Mittelpunkt stellt.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְבֹּץ עָלָיו אֲנָשִׁים
  choice: Er sammelte Männer um sich
  rationale: קבץ mit עַל und Pronominalsuffix bezeichnet hier das Sammeln von Anhängern um die eigene Person; die deutsche Wendung gibt dies natürlich und quellennah wieder.
- source_word: שַׂר גְּדוּד
  choice: Anführer einer Schar
  rationale: שַׂר bezeichnet den Anführer, גְּדוּד eine bewaffnete Truppe oder Schar. „Schar“ bleibt neutral und vermeidet, einen ausdrücklich nicht genannten Räubercharakter einzutragen.
- source_word: בַּהֲרֹג דָּוִד אֹתָם
  choice: als David sie tötete
  rationale: ב mit dem Infinitivus constructus bezeichnet den zeitlichen Umstand. Das pluralische Objekt wird als „sie“ bewahrt, auch wenn sein genauer Bezug im unmittelbaren Wortlaut nicht völlig eindeutig ist.
- source_word: וַיֵּלְכוּ דַמֶּשֶׂק
  choice: Sie zogen nach Damaskus
  rationale: Der Plural des hebräischen Verbs bleibt erhalten; „zogen“ passt natürlich zur Bewegung einer bewaffneten Schar.
- source_word: וַיֵּשְׁבוּ בָהּ
  choice: ließen sich dort nieder
  rationale: ישב kann in diesem Zusammenhang dauerhaften Aufenthalt beziehungsweise Ansiedlung bezeichnen.
- source_word: וַיִּמְלְכוּ בְּדַמָּשֶׂק
  choice: und herrschten in Damaskus
  rationale: Die pluralische Verbform wird nicht zum Singular geglättet. „Herrschten“ gibt מלך wieder, ohne mehrere ausdrücklich als Könige bezeichnete Personen vorauszusetzen.
theological_decisions:
- issue: Pluralische Verbformen in der zweiten Vershälfte trotz der Konzentration des Zusammenhangs auf Reson
  choice: 'Den Plural bewahren: „Sie zogen … ließen sich … herrschten“'
  alternative: 'Auf Reson bezogen in den Singular glätten: „Er zog … ließ sich … herrschte“'
  rationale: Der masoretische Text hat durchgehend pluralische Verbformen. Ihre Beibehaltung wahrt die textliche Spannung, statt sie durch eine kontextbezogene Deutung aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Schar“ ist bewusst neutraler als „Räuberbande“ oder „Streifschar“; der ungewöhnliche Plural der Schlussklauseln wird samt Fußnote bewahrt.
