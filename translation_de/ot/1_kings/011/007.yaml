source:
  edition: WLC
  text: אָז֩ יִבְנֶ֨ה שְׁלֹמֹ֜ה בָּמָ֗ה לִ/כְמוֹשׁ֙ שִׁקֻּ֣ץ מוֹאָ֔ב בָּ/הָ֕ר אֲשֶׁ֖ר עַל פְּנֵ֣י יְרוּשָׁלִָ֑ם וּ/לְ/מֹ֕לֶךְ שִׁקֻּ֖ץ בְּנֵ֥י עַמּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/007.yaml
  text: Then Solomon built a high place for Chemosh[a], the abomination of Moab, on the mountain that is opposite Jerusalem, and for Molech, the abomination of the Ammonites.
translation:
  language: de
  text: Damals baute Salomo auf dem Berg, der Jerusalem gegenüberliegt, eine Kulthöhe für Kemosch, den Gräuel Moabs, und für Molech[a], den Gräuel der Ammoniter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Milkom“. Die hebräische Form wird hier traditionell als „Molech“ gelesen; manche bringen sie jedoch mit der ammonitischen Gottheit Milkom in Verbindung.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָז
  choice: Damals
  rationale: Die Zeitangabe leitet das folgende Geschehen ein. „Damals“ ist im Deutschen natürlich und lässt den Bezug zum zuvor geschilderten Zusammenhang erkennen.
- source_word: יִבְנֶה
  choice: baute
  rationale: Obwohl die Verbform morphologisch ein Imperfekt ist, bezeichnet sie nach אָז in diesem Erzählzusammenhang eine vergangene Handlung; das deutsche Präteritum gibt dies angemessen wieder.
- source_word: בָּמָה
  choice: Kulthöhe
  rationale: Der Ausdruck bezeichnet eine kultische Stätte, häufig auf einer Anhöhe. „Kulthöhe“ bewahrt den fachsprachlichen religiösen Sinn, ohne lediglich eine natürliche Erhebung zu bezeichnen.
- source_word: לִכְמוֹשׁ
  choice: für Kemosch
  rationale: Die Präposition kennzeichnet die Widmung der Kultstätte; der Eigenname wird in geläufiger deutscher Form wiedergegeben.
- source_word: שִׁקֻּץ מוֹאָב
  choice: den Gräuel Moabs
  rationale: שִׁקֻּץ ist eine stark abwertende Bezeichnung für eine Gottheit, ein Götzenbild oder einen verabscheuten Kult. „Gräuel“ bewahrt die wertende Kraft und lässt die knappe Mehrdeutigkeit des Hebräischen bestehen.
- source_word: בָּהָר אֲשֶׁר עַל־פְּנֵי יְרוּשָׁלִָם
  choice: auf dem Berg, der Jerusalem gegenüberliegt
  rationale: הַר bedeutet „Berg“ oder „Hügel“; עַל־פְּנֵי bezeichnet hier die Lage gegenüber beziehungsweise vor Jerusalem. Die Wiedergabe vermeidet eine nicht ausdrücklich genannte geografische Präzisierung.
- source_word: וּלְמֹלֶךְ
  choice: und für Molech
  rationale: Der masoretisch vokalisierte Text bietet Molech. Die mögliche Verbindung mit Milkom wird wegen der textlichen und auslegungsgeschichtlichen Unsicherheit in einer Fußnote genannt.
- source_word: שִׁקֻּץ בְּנֵי עַמּוֹן
  choice: den Gräuel der Ammoniter
  rationale: Die Formulierung steht parallel zu „den Gräuel Moabs“. „Ammoniter“ ist die natürliche deutsche Wiedergabe von „Söhne Ammons“ als Volksbezeichnung.
theological_decisions:
- issue: Abwertende Bezeichnung der fremden Gottheiten
  choice: שִׁקֻּץ wird an beiden Stellen mit „Gräuel“ wiedergegeben.
  alternative: „abscheulicher Gott“ oder „Abscheulichkeit“
  rationale: Die Verurteilung stammt aus dem hebräischen Text selbst. „Gräuel“ erhält diese theologische Wertung, ohne durch das ergänzte Wort „Gott“ die mögliche Bezugsspanne auf Gottheit, Götzenbild oder Kult künstlich einzuengen.
- issue: Identität von מֹלֶךְ
  choice: Im Haupttext steht „Molech“.
  alternative: „Milkom“
  rationale: Die masoretische Lesetradition stützt „Molech“, während der Name in verwandten Zusammenhängen mit der ammonitischen Gottheit Milkom verbunden wird. Der Haupttext folgt der überlieferten Vokalisierung; die umstrittene Alternative bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Kulthöhe“ dient als verständlicher kultischer Fachbegriff; „Gräuel“ bewahrt die scharfe Wertung des Erzählers. Die deutsche Satzstellung stellt den Ortsbezug früh heraus und hält die beiden parallelen Widmungen eng zusammen.
