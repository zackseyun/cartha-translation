  text: וַ/יָּ֨קֶם אֱלֹהִ֥ים ל/וֹ֙ שָׂטָ֔ן אֶת רְז֖וֹן בֶּן אֶלְיָדָ֑ע אֲשֶׁ֣ר בָּרַ֗ח מֵ/אֵ֛ת הֲדַדְעֶ֥זֶר מֶֽלֶךְ צוֹבָ֖ה אֲדֹנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/023.yaml
  text: And God raised up for him an adversary[a], Rezon son of Eliada, who had fled from Hadadezer king of Zobah, his master.
translation:
  language: de
  text: Und Gott ließ ihm Reson, den Sohn Eljadas, als Widersacher[a] erstehen. Reson war vor Hadad-Eser, dem König von Zoba, seinem Herrn, geflohen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch satan; hier eine Gattungsbezeichnung mit der Bedeutung „Widersacher“ oder „Gegner“, nicht der Eigenname Satan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: ließ erstehen
  rationale: Der Hifil von קום bezeichnet hier, dass Gott einen Gegner auftreten lässt. „Ließ erstehen“ bewahrt die kausative Bedeutung und klingt im erzählenden Kontext würdig und natürlich.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Im Erzählzusammenhang ist der Gott Israels gemeint.
- source_word: לוֹ
  choice: ihm
  rationale: Die Präposition ל mit Suffix wird formal als „ihm“ wiedergegeben; die gegen ihn gerichtete Beziehung ergibt sich aus „Widersacher“.
- source_word: שָׂטָן
  choice: einen Widersacher
  rationale: שָׂטָן ist hier eine Gattungsbezeichnung für einen menschlichen politischen Gegner, kein Eigenname.
- source_word: רְזוֹן
  choice: Reson
  rationale: Der Personenname wird in einer im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: בֶּן אֶלְיָדָע
  choice: den Sohn Eljadas
  rationale: Die hebräische Sohnesangabe wird idiomatisch deutsch formuliert; der Name steht im Genitiv.
- source_word: אֲשֶׁר בָּרַח
  choice: Dieser war ... geflohen
  rationale: Das Plusquamperfekt kennzeichnet die Flucht als vorausliegende Hintergrundhandlung; ein neuer Satz vermeidet eine schwer verständliche Kette von Bezügen.
- source_word: מֵאֵת הֲדַדְעֶזֶר
  choice: vor Hadad-Eser
  rationale: Bei dem Verb „fliehen“ bezeichnet מֵאֵת die Person, vor der jemand flieht. „Vor“ gibt diese Beziehung im Deutschen natürlicher und genauer wieder als „von“.
- source_word: מֶלֶךְ צוֹבָה
  choice: dem König von Zoba
  rationale: Die Status- und Ortsangabe wird als deutsche Apposition wiedergegeben.
- source_word: אֲדֹנָיו
  choice: seinem Herrn
  rationale: „Herr“ bezeichnet hier Hadad-Esers politische beziehungsweise persönliche Autorität über Reson, ohne einen göttlichen Titel zu implizieren.
theological_decisions:
- issue: Bedeutung von שָׂטָן im Kontext
  choice: Gattungsbezeichnung „Widersacher“
  alternative: Eigenname „Satan“
  rationale: Der Vers nennt Reson als menschlichen politischen Gegner. Die Wiedergabe als Eigenname würde eine dämonologische Aussage eintragen, die der Kontext nicht macht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung klärt, dass Hadad-Eser sowohl König von Zoba als auch Resons Herr war; die leicht gehobenen Wörter „Widersacher“ und „erstehen“ entsprechen dem historischen Erzählregister.
