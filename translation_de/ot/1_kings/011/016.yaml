source:
  edition: WLC
  text: כִּ֣י שֵׁ֧שֶׁת חֳדָשִׁ֛ים יָֽשַׁב שָׁ֥ם יוֹאָ֖ב וְ/כָל יִשְׂרָאֵ֑ל עַד הִכְרִ֥ית כָּל זָכָ֖ר בֶּ/אֱדֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/016.yaml
  text: For Joab and all Israel had remained there six months[b][a], until he had cut off every male in Edom.
translation:
  language: de
  text: Denn Joab und ganz Israel[a] blieben sechs Monate dort, bis er in Edom alles Männliche ausgerottet hatte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit »ganz Israel« ist hier wahrscheinlich die israelitische Streitmacht gemeint, die Joab begleitete, nicht ausnahmslos jeder Angehörige des Volkes.
    reason: cultural_note
  - marker: b
    text: 'Oder: »alles Männliche vernichtet«. Das hebräische Verb bedeutet wörtlich »abschneiden« und bezeichnet hier die Beseitigung einer Bevölkerungsgruppe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion leitet hier eine erklärende Begründung zum vorausgehenden Zusammenhang ein.
- source_word: שֵׁשֶׁת חֳדָשִׁים
  choice: sechs Monate
  rationale: Die Zeitdauer wird im Deutschen natürlich durch die Nominalgruppe beim Verb »blieben« ausgedrückt.
- source_word: יָשַׁב
  choice: blieben
  rationale: Im militärischen Zusammenhang bezeichnet das Verb den fortgesetzten Aufenthalt, nicht eine dauerhafte Ansiedlung.
- source_word: שָׁם
  choice: dort
  rationale: Natürliche deutsche Wiedergabe der Ortsangabe.
- source_word: יוֹאָב
  choice: Joab
  rationale: Im Deutschen übliche Form des Personennamens.
- source_word: וְכָל יִשְׂרָאֵל
  choice: und ganz Israel
  rationale: Bewahrt die kollektive Ausdrucksweise des Hebräischen; der Zusammenhang legt die mit Joab eingesetzte israelitische Streitmacht nahe.
- source_word: עַד
  choice: bis
  rationale: Kennzeichnet den zeitlichen Endpunkt des Aufenthalts.
- source_word: הִכְרִית
  choice: ausgerottet hatte
  rationale: Das Hifil von כרת bezeichnet hier die gewaltsame Beseitigung einer Bevölkerungsgruppe. »Ausrotten« gibt den populationsbezogenen Sinn im heutigen Deutsch klarer wieder als das missverständliche wörtliche »abschneiden«.
- source_word: כָּל זָכָר
  choice: alles Männliche
  rationale: Gibt die distributive Gesamtheit und das Geschlecht wieder, ohne das im Hebräischen nicht angegebene Erwachsenenalter vorauszusetzen.
- source_word: בֶּאֱדוֹם
  choice: in Edom
  rationale: Die Präposition ist hier örtlich gebraucht.
