base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/026.yaml
  text: Jeroboam son of Nebat[a], an Ephraimite from Zeredah—his mother's name was Zeruah, a widow—was a servant of Solomon[c][b], and he raised his hand against the king.
translation:
  language: de
  text: Jerobeam, der Sohn Nebats, ein Ephraimiter[a] aus Zereda – seine Mutter hieß Zerua und war Witwe –, war ein Diener Salomos. Er erhob seine Hand gegen den König[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Efratiter“. Hier ist wahrscheinlich die Zugehörigkeit zu Ephraim gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Das ist eine hebräische Wendung für feindliches Vorgehen oder Auflehnung gegen den König; daher auch: „Er lehnte sich gegen den König auf.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְרָתִי
  choice: Ephraimiter
  rationale: Im Kontext der Königsbücher bezeichnet der Ausdruck am ehesten die Zugehörigkeit zum Stamm Ephraim. Die mögliche Wiedergabe „Efratiter“ bleibt in einer Fußnote erhalten.
- source_word: הַצְּרֵדָה
  choice: Zereda
  rationale: Der Ortsname wird nach üblicher deutscher Bibeltradition transliteriert.
- source_word: צְרוּעָה
  choice: Zerua
  rationale: Der Personenname wird in einer im Deutschen geläufigen Transliteration wiedergegeben.
- source_word: אִשָּׁה אַלְמָנָה
  choice: war Witwe
  rationale: Das natürliche deutsche „war Witwe“ gibt die volle Bedeutung der hebräischen Wortgruppe wieder; eine wörtliche Doppelung wie „eine Frau, eine Witwe“ wäre unnötig schwerfällig.
- source_word: עֶבֶד לִשְׁלֹמֹה
  choice: stand als Diener in Salomos Dienst
  rationale: עֶבֶד kann Knecht, Diener oder Amtsträger bezeichnen. Der weitere Kontext legt eine königliche Dienst- beziehungsweise Verwaltungsstellung nahe, ohne dass der Vers den rechtlichen Status eindeutig bestimmt.
- source_word: וַיָּרֶם יָד בַּמֶּלֶךְ
  choice: Er erhob seine Hand gegen den König
  rationale: Die Wiedergabe bewahrt das hebräische Bild und lässt offen, welche konkrete Form der Auflehnung gemeint ist.
theological_decisions:
- issue: Art von Jerobeams Vorgehen gegen den König
  choice: bildhafte Formulierung „erhob seine Hand gegen den König“
  alternative: „er lehnte sich gegen den König auf“ / „er rebellierte gegen den König“
  rationale: Das Hebräische verwendet eine offene, feindliche Handlung oder Auflehnung bezeichnende Redewendung. Die bildhafte Übersetzung vermeidet es, den genauen Sinn stärker festzulegen als der Ausgangstext.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange hebräische Satz wurde zur besseren Verständlichkeit in zwei Sätze gegliedert. Die Parenthese zur Mutter bleibt erhalten, und die bildhafte Schlusswendung wird nicht vorschnell auf „rebellieren“ verengt.
