id: 1KI.11.5
reference: 1 Kings 11:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ שְׁלֹמֹ֔ה אַחֲרֵ֣י עַשְׁתֹּ֔רֶת אֱלֹהֵ֖י צִדֹנִ֑ים וְ/אַחֲרֵ֣י מִלְכֹּ֔ם שִׁקֻּ֖ץ עַמֹּנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/005.yaml
  text: Solomon went after Ashtoreth[a], the god of the Sidonians, and after Milcom[c][b], the abomination of the Ammonites.
translation:
  language: de
  text: Salomo folgte Astarte[a], der Göttin der Sidonier[b], und Milkom[c], dem Gräuel der Ammoniter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch Aschtoret; Astarte ist die im Deutschen geläufigere Namensform.
    reason: lexical_alternative
  - marker: b
    text: Formal steht im Hebräischen „Gott/Götter der Sidonier“; auf die weibliche Gottheit Astarte bezogen ist der Sinn „Göttin der Sidonier“.
    reason: lexical_alternative
  - marker: c
    text: Milkom wird bisweilen mit Molech in Verbindung gebracht; der hebräische Text lautet hier jedoch „Milkom“.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ ... אַחֲרֵי
  choice: folgte
  rationale: Die Wendung הלך אחרי bezeichnet hier nicht bloß eine körperliche Bewegung, sondern Gefolgschaft und religiöse Hinwendung. „Folg­te“ gibt den Sinn im Deutschen natürlich wieder, ohne ausdrücklich „verehrte“ einzusetzen.
- source_word: עַשְׁתֹּרֶת
  choice: Astarte
  rationale: „Astarte“ ist die im modernen Deutschen geläufige Namensform der im Hebräischen als Aschtoret bezeichneten Göttin; die hebräische Namensform wird in einer Fußnote bewahrt.
- source_word: אֱלֹהֵי צִדֹנִים
  choice: der Göttin der Sidonier
  rationale: אֱלֹהֵי kann formal „Gott/Götter von“ wiedergeben, bezeichnet hier aber appositionell die namentlich genannte weibliche Gottheit. „Göttin“ macht den konkreten Bezug im Deutschen deutlich; die formnähere Wiedergabe wird angemerkt.
- source_word: מִלְכֹּם
  choice: Milkom
  rationale: Der masoretische Text nennt hier Milkom. Die Form wird als Eigenname transliteriert und nicht mit Molech gleichgesetzt.
- source_word: שִׁקֻּץ עַמֹּנִים
  choice: dem Gräuel der Ammoniter
  rationale: שִׁקֻּץ ist eine starke abwertende Bezeichnung für etwas religiös oder moralisch Verabscheuungswürdiges, häufig einen Götzen. „Gräuel“ bewahrt Gewicht und wertende Perspektive des Textes.
theological_decisions:
- issue: Ob Salomos Handlung ausdrücklich als Götzenverehrung bezeichnet werden soll
  choice: Die hebräische Wendung wird mit „folgte“ wiedergegeben.
  alternative: „verehrte“ oder „diente“
  rationale: Der Zusammenhang handelt eindeutig von Abfall und Götzendienst; der Vers selbst verwendet jedoch die Wendung „hinter jemandem hergehen“. „Folg­te“ wahrt das Bild und lässt den Kontext dessen religiöse Tragweite bestimmen.
- issue: Geschlechtsbezeichnung für Astarte bei אֱלֹהֵי
  choice: „Göttin“ im Haupttext
  alternative: „Gott“ oder „Gottheit“
  rationale: Die appositionelle Bezeichnung bezieht sich auf die namentlich genannte weibliche Gottheit. Die Übersetzung macht diesen Referenzbezug verständlich, während eine Fußnote die formale Besonderheit des Hebräischen offenlegt.
- issue: Verhältnis von Milkom und Molech
  choice: Milkom bleibt als eigener Name stehen.
  alternative: Molech
  rationale: Eine mögliche religionsgeschichtliche Verbindung darf nicht die konkrete Lesart des masoretischen Textes ersetzen.
translation_notes:
  register: Moderne, würdige Standardsprache. „Folg­te“ ist idiomatisch und wahrt zugleich das hebräische Bild; „Gräuel“ behält den starken wertenden Ton des Ausgangstextes. Die Fußnoten dokumentieren Namensform, grammatische Spannung und die mögliche, aber nicht in den Haupttext übernommene Verbindung zu Molech.
