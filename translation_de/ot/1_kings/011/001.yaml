source:
  edition: WLC
  text: וְ/הַ/מֶּ֣לֶךְ שְׁלֹמֹ֗ה אָהַ֞ב נָשִׁ֧ים נָכְרִיּ֛וֹת רַבּ֖וֹת וְ/אֶת בַּת פַּרְעֹ֑ה מוֹאֲבִיּ֤וֹת עַמֳּנִיּוֹת֙ אֲדֹ֣מִיֹּ֔ת צֵדְנִיֹּ֖ת חִתִּיֹּֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/001.yaml
  text: 'King Solomon loved many foreign women[a], including Pharaoh’s daughter: Moabite, Ammonite, Edomite, Sidonian, and Hittite women.'
translation:
  language: de
  text: 'König Salomo liebte viele ausländische Frauen[a], darunter die Tochter des Pharaos: Moabiterinnen, Ammoniterinnen, Edomiterinnen, Sidonierinnen und Hetiterinnen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „viele ausländische Ehefrauen“. Wörtlich steht im Hebräischen „viele ausländische Frauen“; aus dem Zusammenhang geht hervor, dass Salomo sie als Ehefrauen oder Gefährtinnen zu sich nahm.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: וְהַמֶּלֶךְ שְׁלֹמֹה
  choice: König Salomo
  rationale: Der Titel und der Eigenname werden direkt wiedergegeben. Das einleitende וְ führt die Erzählung weiter; im Deutschen muss dafür kein eigenes „und“ oder „nun“ stehen.
- source_word: אָהַב
  choice: liebte
  rationale: „Lieben“ entspricht der gewöhnlichen Bedeutung des Verbs und bewahrt die im folgenden Zusammenhang bedeutsame persönliche Bindung, ohne sie abzuschwächen.
- source_word: נָשִׁים נָכְרִיּוֹת רַבּוֹת
  choice: viele ausländische Frauen
  rationale: Die Formulierung gibt נָשִׁים als „Frauen“, נָכְרִיּוֹת als „ausländische“ und רַבּוֹת als „viele“ wieder. „Frauen“ bewahrt die lexikalische Offenheit des Hebräischen; der Zusammenhang zeigt, dass Ehefrauen beziehungsweise Gefährtinnen gemeint sind.
- source_word: וְאֶת בַּת פַּרְעֹה
  choice: darunter die Tochter des Pharaos
  rationale: Die Wendung fügt die Tochter des Pharaos zu den bereits genannten Frauen hinzu. „Darunter“ bringt diese einschließende Beziehung in natürlichem Deutsch zum Ausdruck.
- source_word: מוֹאֲבִיּוֹת עַמֳּנִיּוֹת אֲדֹמִיֹּת צֵדְנִיֹּת חִתִּיֹּת
  choice: Moabiterinnen, Ammoniterinnen, Edomiterinnen, Sidonierinnen und Hetiterinnen
  rationale: Die weiblichen Herkunftsbezeichnungen werden mit den üblichen deutschen Völkernamen wiedergegeben. „Sidonierinnen“ bewahrt den konkreten Bezug auf Sidon, statt ihn zu „Phönizierinnen“ zu verallgemeinern.
theological_decisions:
- issue: Ob נָשִׁים mit „Frauen“ oder „Ehefrauen“ wiederzugeben ist
  choice: Frauen
  alternative: Ehefrauen
  rationale: Der hebräische Text sagt ausdrücklich „Frauen“. Obwohl der Zusammenhang ihre Stellung als Ehefrauen beziehungsweise Gefährtinnen erkennen lässt, wird diese Präzisierung nicht stillschweigend in den Haupttext eingetragen.
- issue: Ob die Tochter des Pharaos zu den ausländischen Frauen gerechnet oder als eigene, davon getrennte Kategorie genannt wird
  choice: Sie wird mit „darunter“ in die genannte Gruppe einbezogen.
  alternative: Sie wird mit „und außerdem“ als gesonderte Kategorie angefügt.
  rationale: Die additive Syntax nennt sie zusammen mit den vielen ausländischen Frauen. „Darunter“ gibt die naheliegende Einordnung wieder, ohne über ihre in diesem Vers nicht genannte Volkszugehörigkeit hinauszugehen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die weiblichen Völkernamen halten die knappe Aufzählungsform des Hebräischen fest; auf ein nicht ausdrücklich vorhandenes zeitliches „Nun“ wurde verzichtet.
