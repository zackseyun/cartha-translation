source:
  edition: WLC
  text: וַ/יְהִ֗י לְ/עֵת֙ זִקְנַ֣ת שְׁלֹמֹ֔ה נָשָׁי/ו֙ הִטּ֣וּ אֶת לְבָב֔/וֹ אַחֲרֵ֖י אֱלֹהִ֣ים אֲחֵרִ֑ים וְ/לֹא הָיָ֨ה לְבָב֤/וֹ שָׁלֵם֙ עִם יְהוָ֣ה אֱלֹהָ֔י/ו כִּ/לְבַ֖ב דָּוִ֥יד אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/004.yaml
  text: And when Solomon was old[a], his wives turned his heart after other gods, and his heart was not fully devoted to Yahweh his God, like the heart of David his father.
translation:
  language: de
  text: Als Salomo alt geworden war, wandten seine Frauen sein Herz anderen Göttern zu, und sein Herz war Jahwe, seinem Gott, nicht ungeteilt ergeben, wie das Herz seines Vaters David.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und sein Herz war nicht ganz mit Jahwe, seinem Gott“. Die hebräische Wendung bezeichnet ungeteilte Treue zu Gott.'
    reason: Sie macht die Metapher und die wörtliche Präposition sichtbar, während der Haupttext die Wendung idiomatisch wiedergibt.
lexical_decisions:
- source_word: לְעֵת זִקְנַת שְׁלֹמֹה
  choice: Als Salomo alt geworden war
  rationale: Gibt die Zeitangabe idiomatisch und eng am Sinn des hebräischen Ausdrucks wieder.
- source_word: נָשָׁיו
  choice: seine Frauen
  rationale: Im Kontext sind Salomos Ehefrauen gemeint; „Frauen“ ist im modernen Deutschen die natürliche Bezeichnung.
- source_word: הִטּוּ אֶת־לְבָבוֹ
  choice: wandten sein Herz ... zu
  rationale: Bewahrt das Bild des verursachten Hinwendens, ohne es durch „verführten“ oder „führten in die Irre“ zu verstärken.
- source_word: אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: anderen Göttern zu
  rationale: Natürliches Deutsch für die hebräische Wendung des Sich-anderen-Göttern-Zuwendens.
- source_word: לְבָבוֹ
  choice: sein Herz
  rationale: Erhält das biblische Bild für Denken, Wollen und innere Ausrichtung.
- source_word: שָׁלֵם עִם
  choice: ungeteilt bei
  rationale: „Ungeteilt“ drückt die Ganzheit beziehungsweise uneingeschränkte Loyalität aus; „bei“ bewahrt den relationalen Charakter von עִם in verständlichem Deutsch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen im Deutschen in geläufiger Form wieder.
- source_word: כִּלְבַב דָּוִיד אָבִיו
  choice: wie das Herz seines Vaters David
  rationale: Bewahrt den ausdrücklichen Vergleich zwischen den Herzen und stellt „seines Vaters“ im Deutschen eindeutig zu David.
theological_decisions:
- issue: Ganzheit von Salomos Herz gegenüber Jahwe
  choice: nicht ungeteilt bei Jahwe
  alternative: Jahwe nicht völlig ergeben / nicht ganz bei Jahwe
  rationale: Die Formulierung bewahrt das Bild eines nicht ganzen, geteilten Herzens und deutet die Aussage nicht als Behauptung völligen Abfalls aus.
- issue: Bezeichnung der verehrten Gottheiten
  choice: andere Götter
  alternative: fremde Götter
  rationale: Entspricht unmittelbar אֱלֹהִים אֲחֵרִים und vermeidet eine Einengung auf ethnische Fremdheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Herz-Metaphorik und der Name Jahwe bleiben erhalten; die Satzführung ist für heutige Leser natürlich.
