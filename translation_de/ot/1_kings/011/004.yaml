    rationale: Das Deutsche verwendet „bei jemandem sein“ nicht natürlich zur Bezeichnung der Ganzheit des Herzens bzw. der Loyalität. Dadurch wird die Aussage von שָׁלֵם עִם zwar erkennbar, aber stilistisch und semantisch weniger klar.
  - severity: low
    issue: Die Fußnote bezeichnet „bei Jahwe“ als wörtlich.
    rationale: Das hebräische עִם bedeutet wörtlich „mit“; „bei“ ist bereits eine deutsche Auslegung der relationalen Wendung. Die Fußnote sollte dies präziser wiedergeben.
  revised_text: Als Salomo alt geworden war, wandten seine Frauen sein Herz anderen Göttern zu, und sein Herz war Jahwe, seinem Gott, nicht ungeteilt ergeben, wie das Herz seines Vaters David.[a]
