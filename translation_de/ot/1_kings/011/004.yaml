- from: Als Salomo alt geworden war, wandten seine Frauen sein Herz anderen Göttern zu, und sein Herz war nicht ungeteilt bei Jahwe, seinem Gott, wie das Herz seines Vaters David.[a]
  to: Als Salomo alt geworden war, wandten seine Frauen sein Herz anderen Göttern zu, und sein Herz war Jahwe, seinem Gott, nicht ungeteilt ergeben, wie das Herz seines Vaters David.[a]
  rationale: Die Revision ersetzt ausschließlich die unnatürliche Verbindung „nicht ungeteilt bei Jahwe“ durch eine im modernen Deutschen idiomatische Wiedergabe der ungeteilten Loyalität. Der Vergleich mit Davids Herz, die Metaphorik und die Aussage über andere Götter bleiben erhalten; die Fußnote wird beim wörtlichen Sinn von עִם präzisiert.
