  text: וְ/אֹתְ/ךָ֣ אֶקַּ֔ח וּ/מָ֣לַכְתָּ֔ בְּ/כֹ֥ל אֲשֶׁר תְּאַוֶּ֖ה נַפְשֶׁ֑/ךָ וְ/הָיִ֥יתָ מֶּ֖לֶךְ עַל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/037.yaml
  text: And I will take you[a], and you shall reign over all that your soul desires, and you shall be king over Israel.
translation:
  language: de
  text: Dich werde ich nehmen, und du wirst über alles herrschen, was deine Seele begehrt,[a] und du wirst König über Israel sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „was du begehrst“; wörtlich: „was deine Seele begehrt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶקַּח
  choice: werde ich nehmen
  rationale: לקח bedeutet gewöhnlich „nehmen“. Im Zusammenhang göttlicher Einsetzung bewahrt „nehmen“ die konkrete Aussage, ohne sie vorschnell als „erwählen“ auszulegen.
- source_word: וּמָלַכְתָּ
  choice: du wirst … herrschen
  rationale: מלך bezeichnet die Ausübung der Königsherrschaft. „Herrschen“ gibt hier die Tätigkeit wieder und unterscheidet sie von der anschließenden Feststellung des Königseins.
- source_word: בְּכֹל אֲשֶׁר
  choice: über alles, was
  rationale: Die Präposition ב bezeichnet zusammen mit מלך den Bereich beziehungsweise Umfang der Herrschaft; „über alles, was“ ist im Deutschen natürlich.
- source_word: תְּאַוֶּה נַפְשֶׁךָ
  choice: was deine Seele begehrt
  rationale: Die Wiedergabe bewahrt das hebräische Bild mit נֶפֶשׁ und bleibt zugleich verständlich; die idiomatisch glattere Alternative wird in der Fußnote genannt.
- source_word: וְהָיִיתָ מֶּלֶךְ
  choice: du wirst König … sein
  rationale: היה mit einem Substantiv bezeichnet hier den zugesprochenen Status. Die Formulierung gibt die förmliche Einsetzung klar wieder.
- source_word: עַל יִשְׂרָאֵל
  choice: über Israel
  rationale: עַל bezeichnet bei Königsherrschaft die Autorität über das Volk beziehungsweise Land.
theological_decisions:
- issue: Anthropologische Wendung נֶפֶשׁ
  choice: „deine Seele begehrt“
  alternative: „du begehrst“ / „du dir wünschst“
  rationale: Der Vers formuliert keine technische Lehre über die Seele, gebraucht aber ausdrücklich נֶפֶשׁ. Die wörtlich-nahe Wiedergabe erhält das Bild, ohne es dogmatisch aufzuladen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung „Dich aber“ bildet den hervorgehobenen hebräischen Auftakt nach; „herrschen“ vermeidet das heute seltene „als König regieren“, während die anschließende Königsaussage ausdrücklich erhalten bleibt.
