  text: וַ/יִּמְצָא֙ הֲדַ֥ד חֵ֛ן בְּ/עֵינֵ֥י פַרְעֹ֖ה מְאֹ֑ד וַ/יִּתֶּן ל֤/וֹ אִשָּׁה֙ אֶת אֲח֣וֹת אִשְׁתּ֔/וֹ אֲח֖וֹת תַּחְפְּנֵ֥יס הַ/גְּבִירָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/019.yaml
  text: Hadad found great favor in Pharaoh’s eyes[a], and he gave him as a wife the sister of his own wife[b], the sister of Tahpenes the queen mother.
translation:
  language: de
  text: Hadad fand beim Pharao große Gunst. Da gab ihm der Pharao die Schwester seiner Frau zur Frau, nämlich die Schwester von Tachpenes, der Gebieterin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch „die Gebieterin“ beziehungsweise „die vornehme Dame“. Der Titel bezeichnet eine hochrangige Frau am Königshof und kann in anderen Zusammenhängen auch „Königinmutter“ bedeuten. Der Ausdruck „seiner Frau“ bezieht sich wahrscheinlich auf die Frau des Pharaos; grammatisch könnte jedoch auch Hadads Frau gemeint sein.
    reason: lexical_alternative; alternative_reading
lexical_decisions:
- source_word: וַיִּמְצָא ... חֵן בְּעֵינֵי ... מְאֹד
  choice: fand bei … sehr große Gunst
  rationale: Die hebräische Wendung bedeutet wörtlich, in den Augen eines Menschen Gunst zu finden. Die deutsche Formulierung gibt das Idiom natürlich wieder; „sehr große“ bewahrt die Verstärkung durch מְאֹד.
- source_word: פַרְעֹה
  choice: Pharao
  rationale: Im Deutschen übliche Wiedergabe des ägyptischen Herrschertitels.
- source_word: וַיִּתֶּן לוֹ אִשָּׁה
  choice: gab ihm … zur Frau
  rationale: Die Konstruktion bezeichnet die Übergabe einer Frau zur Eheschließung. Die deutsche Wendung ist klar und entspricht der erzählerischen Aussage.
- source_word: אֶת אֲחוֹת אִשְׁתּוֹ
  choice: die Schwester seiner eigenen Frau
  rationale: Das Suffix wird im unmittelbaren Zusammenhang am wahrscheinlichsten auf den Pharao bezogen. „seiner eigenen“ verdeutlicht diesen Bezug, ohne die weniger wahrscheinliche grammatische Möglichkeit zu verschweigen.
- source_word: אֲחוֹת תַּחְפְּנֵיס
  choice: die Schwester … Tachpenes
  rationale: Die zweite Nominalgruppe steht appositionell und identifiziert die Frau als Schwester der Tachpenes.
- source_word: תַּחְפְּנֵיס
  choice: Tachpenes
  rationale: Angemessene deutsche Transliteration des hebräischen Eigennamens.
- source_word: הַגְּבִירָה
  choice: die Königin
  rationale: Das Wort bezeichnet eine hochrangige königliche Frau beziehungsweise die maßgebliche Dame am Hof. Da Tachpenes hier ausdrücklich als Frau des Pharaos erscheint, ist „Königin“ im Zusammenhang natürlicher und weniger irreführend als „Königinmutter“.
theological_decisions:
- issue: Bezug des Pronomens in „die Schwester seiner Frau“
  choice: 'Das Pronomen wird auf den Pharao bezogen: Er gab Hadad die Schwester seiner eigenen Frau.'
  alternative: 'Das Pronomen könnte grammatisch auf Hadad bezogen werden: Der Pharao gab ihm die Schwester von Hadads Frau.'
  rationale: Der Pharao ist das Subjekt des Satzes, und die folgende Apposition nennt Tachpenes, offenbar die Frau des Pharaos. Daher ist der Bezug auf den Pharao deutlich wahrscheinlicher; die alternative Zuordnung bleibt in einer Fußnote erhalten.
- issue: Bedeutung des Titels הַגְּבִירָה
  choice: Königin
  alternative: Gebieterin; vornehmste Dame; Königinmutter
  rationale: Der Titel bezeichnet eine ranghohe königliche Frau. In israelitisch-jüdischen Zusammenhängen kann er besonders die Königinmutter meinen; hier wird Tachpenes jedoch als Frau des Pharaos bezeichnet, weshalb „Königin“ kontextgemäß ist. Die genaue Amtsbezeichnung bleibt unsicher.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Wiederholung „die Schwester“ folgt der hebräischen Apposition und macht die Identifizierung durch Tachpenes deutlich. Die Pronomenmehrdeutigkeit und die Spannweite des Hoftitels werden nicht stillschweigend beseitigt, sondern in Fußnoten dokumentiert.
