source:
  edition: WLC
  text: וַ/יְהִי ל֣/וֹ נָשִׁ֗ים שָׂרוֹת֙ שְׁבַ֣ע מֵא֔וֹת וּ/פִֽלַגְשִׁ֖ים שְׁלֹ֣שׁ מֵא֑וֹת וַ/יַּטּ֥וּ נָשָׁ֖י/ו אֶת לִבּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/003.yaml
  text: He had seven hundred wives[a], princesses, and three hundred concubines; and his wives turned away his heart.
translation:
  language: de
  text: Er hatte siebenhundert Ehefrauen fürstlichen Ranges[a] und dreihundert Nebenfrauen; seine Frauen brachten sein Herz dazu, sich abzuwenden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »siebenhundert Ehefrauen, Fürstinnen« beziehungsweise »Frauen von Rang«.'
    reason: Die Verbindung נָשִׁים שָׂרוֹת kann die Ehefrauen als hochrangig kennzeichnen oder appositionell als »Ehefrauen, Fürstinnen« verstanden werden.
lexical_decisions:
- source_word: וַיְהִי לוֹ
  choice: Er hatte
  rationale: Die hebräische Konstruktion היה + ל drückt Besitz aus; »er hatte« ist die natürliche deutsche Wiedergabe.
- source_word: נָשִׁים שָׂרוֹת
  choice: Frauen fürstlichen Ranges
  rationale: נָשִׁים bezeichnet im Kontext Ehefrauen; שָׂרוֹת kennzeichnet sie als hochrangige, fürstliche Frauen. Die Formulierung bewahrt den Statusbezug, ohne zwingend eine Abstammung als Prinzessinnen festzulegen.
- source_word: שְׁבַע מֵאוֹת
  choice: siebenhundert
  rationale: Direkte Wiedergabe der Kardinalzahl.
- source_word: וּפִלַגְשִׁים
  choice: und dreihundert Nebenfrauen
  rationale: פִּילֶגֶשׁ bezeichnet eine anerkannte Partnerin mit geringerem ehelichem oder gesellschaftlichem Status; »Nebenfrau« ist im biblischen Kontext verständlich und weniger irreführend als das heute oft anders konnotierte »Konkubine«.
- source_word: שְׁלֹשׁ מֵאוֹת
  choice: dreihundert
  rationale: Direkte Wiedergabe der Kardinalzahl.
- source_word: וַיַּטּוּ
  choice: wandten ... ab
  rationale: נטה bezeichnet hier eine Richtungsänderung mit religiös-moralischem Gewicht. »Abwenden« bewahrt diese Bewegung, ohne das Ziel, das erst der Kontext näher bestimmt, in den Vers hineinzulesen.
- source_word: נָשָׁיו
  choice: seine Frauen
  rationale: Der Rückbezug umfasst die zuvor genannten Frauen; »seine Frauen« entspricht dem hebräischen Ausdruck und vermeidet eine unnötige Verengung.
- source_word: אֶת לִבּוֹ
  choice: sein Herz
  rationale: »Herz« bewahrt das zentrale hebräische Bild für das innere Denken, Wollen und die Loyalität des Menschen.
theological_decisions:
- issue: Bedeutung von »sein Herz«
  choice: Das konkrete Bild »sein Herz« bleibt stehen und kann innere Ausrichtung, Willen und Treue umfassen.
  alternative: Die Wendung ausdrücklich als Abwendung seiner religiösen Loyalität paraphrasieren.
  rationale: Der Vers nennt das Ziel der Abwendung nicht ausdrücklich. Die Übersetzung bewahrt daher das hebräische Bild und die im Kontext entfaltete theologische Spannung.
- issue: Ergänzung eines Ziels zu »wandten ... ab«
  choice: Kein Objekt wie »vom HERRN« ergänzen.
  alternative: »wandten sein Herz vom HERRN ab«.
  rationale: Obwohl der weitere Zusammenhang diese Richtung erkennen lässt, steht sie in diesem Vers nicht ausdrücklich; eine Ergänzung würde die Aussage stärker festlegen als der Ausgangstext.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt knapp und nah am hebräischen Erzählstil; traditionelle Schlüsselbegriffe wie »Herz« werden wegen ihrer inhaltlichen Dichte bewahrt.
