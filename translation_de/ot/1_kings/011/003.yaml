  source_fidelity: Die Zahlen, die Unterscheidung zwischen den hochrangigen Ehefrauen und den Nebenfrauen sowie das Bild vom abgewandten Herzen werden zutreffend wiedergegeben. »Frauen fürstlichen Ranges« ist als vorsichtige Wiedergabe von נָשִׁים שָׂרוֹת vertretbar. Für נָשִׁים ist im vorliegenden Eheschließungskontext »Ehefrauen« jedoch genauer als das unmarkierte »Frauen«.
  naturalness: Die Verbindung »seine Frauen wandten sein Herz ab« ist zwar am Hebräischen orientiert, im heutigen Standarddeutsch aber ungewohnt und ohne genanntes Bezugsziel syntaktisch-semantisch unerquicklich. »brachten sein Herz dazu, sich abzuwenden« gibt die Verursachung und die im Hebräischen offenbleibende Richtung idiomatischer wieder.
  terminology: »Nebenfrauen« ist im biblisch-historischen Register eine angemessene, verständliche Bezeichnung für פִּילַגְשִׁים. »Ehefrauen fürstlichen Ranges« wahrt sowohl den Ehestatus als auch die mögliche Bedeutung von שָׂרוֹת, ohne zwingend dynastische Abstammung zu behaupten.
