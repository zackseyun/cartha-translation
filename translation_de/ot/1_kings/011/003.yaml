    rationale: Da der Vers Ehefrauen den Nebenfrauen gegenüberstellt, macht »Ehefrauen« die soziale und rechtliche Unterscheidung im Deutschen deutlicher.
  - severity: medium
    issue: »wandten sein Herz ab« ist im modernen Deutsch nicht idiomatisch
    rationale: Die Formulierung klingt unvollständig, weil Deutsch bei »abwenden« gewöhnlich ein Ziel oder einen Bezug erwartet. Eine kausative Umschreibung kann das nicht genannte Ziel weiterhin offenlassen.
