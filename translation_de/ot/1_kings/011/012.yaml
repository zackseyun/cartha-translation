id: 1KI.11.12
reference: 1 Kings 11:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אַךְ בְּ/יָמֶ֨י/ךָ֙ לֹ֣א אֶעֱשֶׂ֔/נָּה לְמַ֖עַן דָּוִ֣ד אָבִ֑י/ךָ מִ/יַּ֥ד בִּנְ/ךָ֖ אֶקְרָעֶֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/012.yaml
  text: Nevertheless[a], in your days I will not do it, for the sake of David your father[b]; from the hand of your son I will tear it away.
translation:
  language: de
  text: Doch zu deinen Lebzeiten werde ich es[a] nicht tun, um Davids, deines Vaters, willen. Aus der Hand deines Sohnes[b] werde ich es wegreißen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist das im vorherigen Vers angekündigte Wegreißen des Königreichs.
    reason: cross_reference
  - marker: b
    text: Die hebräische Wendung „aus der Hand“ bezeichnet hier, dass das Königreich der Herrschaft oder dem Besitz des Sohnes entzogen wird.
    reason: lexical_explanation
lexical_decisions:
- source_word: אַךְ
  choice: Doch
  rationale: Die Partikel schränkt die zuvor angekündigte Gerichtsentscheidung adversativ ein. „Doch“ gibt diesen Übergang im Deutschen knapp und natürlich wieder.
- source_word: בְּיָמֶיךָ
  choice: zu deinen Lebzeiten
  rationale: Die wörtliche Wendung „in deinen Tagen“ bezeichnet hier Salomos Lebens- und Regierungszeit. „Zu deinen Lebzeiten“ vermittelt den gemeinten zeitlichen Rahmen in aktuellem Deutsch eindeutig.
- source_word: לֹא אֶעֱשֶׂנָּה
  choice: werde ich es nicht tun
  rationale: Das feminine Suffix verweist auf die im vorherigen Vers angekündigte Handlung. Das Pronomen „es“ bewahrt diesen Rückbezug, ohne das implizite Objekt im Haupttext auszudeuten.
- source_word: לְמַעַן דָּוִד אָבִיךָ
  choice: um Davids, deines Vaters, willen
  rationale: לְמַעַן bezeichnet hier Rücksichtnahme beziehungsweise ein Handeln zugunsten Davids. Die Formulierung bewahrt diesen Beweggrund und die Apposition „deines Vaters“.
- source_word: מִיַּד בִּנְךָ
  choice: aus der Hand deines Sohnes
  rationale: Die hebräische Wendung bezeichnet die Sphäre von Macht oder Besitz. Die bildhafte Ausdrucksweise bleibt im Haupttext erhalten und wird in einer Fußnote erläutert.
- source_word: אֶקְרָעֶנָּה
  choice: werde ich es wegreißen
  rationale: קָרַע bezeichnet ein Reißen oder Abreißen. „Wegreißen“ bewahrt das kraftvolle Bild der gewaltsamen Abtrennung des Königtums; das Objekt bleibt wie im Hebräischen aus dem Zusammenhang erschließbar.
theological_decisions:
- issue: Aufschub des angekündigten Gerichts über Salomo
  choice: Das Wegreißen des Königtums wird nicht zu Salomos Lebzeiten vollzogen, sondern gegenüber seinem Sohn.
  alternative: Der Vers könnte das implizite Objekt ausdrücklich als „das Königreich“ benennen.
  rationale: Im Hebräischen bleibt das Objekt durch Pronominalsuffixe anaphorisch und wird aus dem vorherigen Vers erschlossen. Der Haupttext bewahrt diese Kontextabhängigkeit; die Fußnote klärt den Bezug, ohne ihn in den Wortlaut einzutragen.
- issue: Grund für den Aufschub
  choice: „um Davids, deines Vaters, willen“ gibt Gottes Rücksicht auf David wieder.
  alternative: „wegen Davids, deines Vaters“ wäre möglich, könnte jedoch stärker nach bloßer Ursache klingen.
  rationale: Die gewählte Formulierung wahrt die Aussage des Textes über die David gewährte Rücksicht, ohne darüber hinaus eine bestimmte systematisch-theologische Deutung einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Um … willen“ und das Bild „aus der Hand“ sind leicht gehoben, bleiben aber verständlich und bewahren die feierliche sowie bildhafte Ausdrucksweise des hebräischen Textes.
