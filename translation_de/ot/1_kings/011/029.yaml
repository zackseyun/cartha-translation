  text: וַֽ/יְהִי֙ בָּ/עֵ֣ת הַ/הִ֔יא וְ/יָֽרָבְעָ֖ם יָצָ֣א מִ/ירוּשָׁלִָ֑ם וַ/יִּמְצָ֣א אֹת֡/וֹ אֲחִיָּה֩ הַ/שִּׁילֹנִ֨י הַ/נָּבִ֜יא בַּ/דֶּ֗רֶךְ וְ/ה֤וּא מִתְכַּסֶּה֙ בְּ/שַׂלְמָ֣ה חֲדָשָׁ֔ה וּ/שְׁנֵי/הֶ֥ם לְ/בַדָּ֖/ם בַּ/שָּׂדֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/029.yaml
  text: And at that time[a], when Jeroboam went out from Jerusalem, Ahijah the Shilonite, the prophet, found him on the road. Now he had wrapped himself in a new cloak, and the two of them were alone in the open field.
translation:
  language: de
  text: Damals, als Jerobeam Jerusalem verließ, begegnete ihm unterwegs der Prophet Ahija aus Schilo. Er hatte sich in einen neuen Mantel gehüllt, und die beiden waren allein auf dem Feld.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בָּעֵת הַהִיא
  choice: Damals
  rationale: Die hebräische Erzählungsformel führt den zeitlichen Rahmen ein. „Damals“ gibt sie in natürlichem, knappem Deutsch wieder.
- source_word: יָצָא מִירוּשָׁלָם
  choice: Jerusalem verließ
  rationale: יצא bezeichnet das Hinausgehen; mit einer Stadt als Ausgangspunkt ist „verlassen“ im Deutschen idiomatisch und bewahrt die Richtung.
- source_word: וַיִּמְצָא אֹתוֹ
  choice: begegnete ihm
  rationale: מצא bedeutet grundsätzlich „finden“, kann bei Personen in einer Wegszene jedoch die Begegnung bezeichnen. „Begegnete ihm“ klingt hier natürlich, ohne eine Suche vorauszusetzen.
- source_word: אֲחִיָּה הַשִּׁילֹנִי הַנָּבִיא
  choice: der Prophet Ahija aus Schilo
  rationale: Das Gentilizium wird im modernen Deutsch natürlich als Herkunftsangabe wiedergegeben; die Bezeichnung als Prophet bleibt erhalten.
- source_word: בַּדֶּרֶךְ
  choice: unterwegs
  rationale: Die Wendung bezeichnet den Ort der Begegnung auf dem Weg und wird mit „unterwegs“ knapp und idiomatisch wiedergegeben.
- source_word: וְהוּא מִתְכַּסֶּה
  choice: Er hatte sich … gehüllt
  rationale: Der Hitpael-Partizip beschreibt einen reflexiven, begleitenden Zustand. Das Pronomen bleibt wie im Hebräischen mehrdeutig und wird nicht ausdrücklich Ahija oder Jerobeam zugeordnet.
- source_word: בְּשַׂלְמָה חֲדָשָׁה
  choice: in einen neuen Mantel
  rationale: שַׂלְמָה bezeichnet ein Kleidungsstück, besonders ein Obergewand. „Mantel“ ist anschaulich und passt zur anschließenden symbolischen Zerreißung.
- source_word: וּשְׁנֵיהֶם לְבַדָּם
  choice: die beiden waren allein
  rationale: Die Formulierung bewahrt die Betonung, dass keine weitere Person anwesend war.
- source_word: בַּשָּׂדֶה
  choice: auf dem Feld
  rationale: „Auf dem Feld“ entspricht dem Grundsinn und ist die natürliche deutsche Ortsangabe, ohne die Offenheit oder Abgeschiedenheit zusätzlich auszudeuten.
theological_decisions:
- issue: Bezug des Pronomens וְהוּא
  choice: Das unbestimmte Pronomen „Er“ bleibt stehen.
  alternative: „Ahija hatte sich …“ oder „Jerobeam hatte sich …“
  rationale: Der hebräische Wortlaut nennt das Bezugswort nicht ausdrücklich. Obwohl der Erzählzusammenhang häufig für Ahija verstanden wird, soll die echte grammatische Mehrdeutigkeit nicht stillschweigend aufgelöst werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit flüssiger Erzählsyntax. Eigennamen nach geläufiger deutscher Bibelschreibung. Die knappe Erzählungsformel und die pronominale Mehrdeutigkeit des Ausgangstextes bleiben gewahrt.
