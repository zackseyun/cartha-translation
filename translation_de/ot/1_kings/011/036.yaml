base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/036.yaml
  text: But to his son I will give one tribe[a], so that David my servant may always have a lamp before me in Jerusalem, the city that I have chosen for myself to put my name there.
translation:
  language: de
  text: Seinem Sohn aber werde ich einen Stamm geben, damit David, mein Diener, allezeit eine Leuchte[a] vor mir hat in Jerusalem, der Stadt, die ich für mich erwählt habe, um dort meinen Namen zu setzen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ein Licht. Die Leuchte ist hier ein Bild für den Fortbestand des davidischen Königshauses.'
    reason: Lexikalische Alternative und Erläuterung der Metapher.
lexical_decisions:
- source_word: וְלִבְנוֹ
  choice: Seinem Sohn aber
  rationale: Das וְ knüpft an den vorausgehenden Zusammenhang an und hat hier kontrastierende Kraft; die Voranstellung folgt der hebräischen Betonung.
- source_word: שֵׁבֶט אֶחָד
  choice: einen Stamm
  rationale: Im Zusammenhang der Reichsteilung bezeichnet שֵׁבֶט eine stammespolitische Einheit, nicht ein Zepter.
- source_word: לְמַעַן הֱיוֹת
  choice: damit … hat
  rationale: Die Konstruktion drückt einen Zweck aus. Im Deutschen gibt „damit“ diese Funktion natürlich wieder; „hat“ bezieht sich auf die David zugesicherte fortdauernde Leuchte.
- source_word: נִיר
  choice: Leuchte
  rationale: נִיר bezeichnet hier metaphorisch den Fortbestand des davidischen Hauses beziehungsweise seiner königlichen Präsenz. „Leuchte“ bewahrt das konkrete Bild und klingt im Deutschen natürlicher als „Lampe“.
- source_word: לְדָוִיד עַבְדִּי
  choice: David, mein Diener
  rationale: Die Apposition wahrt die hebräische Wortfolge und die ehrenvolle Bezeichnung Davids als Gottes Diener.
- source_word: כָּל הַיָּמִים
  choice: allezeit
  rationale: Das idiomatische „alle Tage“ bezeichnet fortdauernde Kontinuität; „allezeit“ ist knapp, würdig und verständlich.
- source_word: לְפָנַי
  choice: vor mir
  rationale: Die geläufige Wendung bewahrt die räumlich-bildhafte und relationale Aussage des Hebräischen.
- source_word: בָּחַרְתִּי לִי
  choice: die ich für mich erwählt habe
  rationale: „Für mich“ gibt den bedeutungsvollen Dativ לִי wieder; das Perfekt wird als Wahl mit fortbestehender Geltung ausgedrückt.
- source_word: לָשׂוּם שְׁמִי שָׁם
  choice: um meinen Namen dort wohnen zu lassen
  rationale: Die Formulierung gibt die etablierte deutsche Wiedergabe der deuteronomistischen Namenstheologie wieder. Wörtlich steht „meinen Namen dort hinzusetzen/anzubringen“, weshalb die Alternative in einer Fußnote kenntlich gemacht wird.
theological_decisions:
- issue: Dynastisches Bild in נִיר
  choice: „Leuchte“ als Bild für den Fortbestand der davidischen Linie
  alternative: „Licht“ als allgemeineres Bild
  rationale: Das konkrete Bild bleibt im Haupttext erhalten, ohne seine dynastische Bedeutung dort erklärend festzuschreiben; die Fußnote erschließt den Zusammenhang.
- issue: Namenstheologie in לָשׂוּם שְׁמִי שָׁם
  choice: „meinen Namen dort wohnen zu lassen“ mit wörtlicher Alternative in der Fußnote
  alternative: „meinen Namen dort hinzusetzen/anzubringen“
  rationale: Die Hauptfassung verwendet eine im Deutschen verständliche biblische Formel, ohne sie zu „meine Gegenwart“ oder „dort verehrt zu werden“ auszudeuten. Die Fußnote bewahrt die konkrete hebräische Ausdrucksweise.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, ohne unnatürlich zu wirken. „Allezeit“ und „erwählt“ tragen einen leicht gehobenen biblischen Ton; die theologischen Bilder „Leuchte“ und „Name“ bleiben erhalten.
