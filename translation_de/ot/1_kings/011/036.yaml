    issue: „um meinen Namen dort wohnen zu lassen“ übersetzt לָשׂוּם שְׁמִי שָׁם nicht quellentreu.
    rationale: Das Hebräische lautet wörtlich „um meinen Namen dort zu setzen/legen“. „Wohnen lassen“ deutet die Formel um und entspricht eher einer Formulierung mit „wohnen lassen“ als dem hier verwendeten שׂוּם. Die Fußnote bestätigt den Unterschied, behebt aber die semantische Abweichung im Haupttext nicht.
