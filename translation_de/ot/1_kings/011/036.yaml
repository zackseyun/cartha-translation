revisions:
- from: Seinem Sohn aber werde ich einen Stamm geben, damit David, mein Diener, allezeit eine Leuchte[a] vor mir hat in Jerusalem, der Stadt, die ich für mich erwählt habe, um meinen Namen dort wohnen zu lassen.[b]
  to: Seinem Sohn aber werde ich einen Stamm geben, damit David, mein Diener, allezeit eine Leuchte[a] vor mir hat in Jerusalem, der Stadt, die ich für mich erwählt habe, um dort meinen Namen zu setzen.
  rationale: Die einzige notwendige Änderung ersetzt „wohnen zu lassen“ durch „zu setzen“, um das Verb שׂוּם und die bewusst konkrete Namenformel des Hebräischen zu bewahren. Dadurch entfällt Fußnote b, da ihre bisherige wörtliche Alternative nun im Haupttext steht. Die verbleibende Fußnote ist korrekt verankert und erläutert die lexikalische Alternative zu נִיר.
