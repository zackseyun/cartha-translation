source:
  edition: WLC
  text: וַ/יַּ֧עַשׂ שְׁלֹמֹ֛ה הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וְ/לֹ֥א מִלֵּ֛א אַחֲרֵ֥י יְהוָ֖ה כְּ/דָוִ֥ד אָבִֽי/ו׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/006.yaml
  text: So Solomon did what was evil in the eyes of Yahweh[a], and he did not fully follow Yahweh, as David his father had done.
translation:
  language: de
  text: So tat Salomo, was böse war in den Augen Jahwes, und er folgte Jahwe nicht vollständig nach, wie David, sein Vater, es getan hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er folgte Jahwe nicht völlig.“ Die hebräische Wendung bezeichnet unvollständiges Folgen beziehungsweise keine uneingeschränkte Loyalität.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: So tat
  rationale: Das Verb עשה bezeichnet hier Salomos Handeln; zusammen mit הָרַע ergibt sich im Deutschen natürlich „tat, was böse war“. Das einleitende „So“ gibt den erzählerischen Anschluss des וַ wieder.
- source_word: הָרַע
  choice: was böse war
  rationale: Das substantivierte Adjektiv bezeichnet moralisch Böses. Die deutsche Wendung ist klarer und natürlicher als das wörtliche „das Böse“ nach „tat“.
- source_word: בְּעֵינֵי יְהוָה
  choice: in den Augen Jahwes
  rationale: Die feste hebräische Bewertungsformel wird bildhaft und im Deutschen verständlich wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name transliteriert und nicht durch einen Titel ersetzt.
- source_word: מִלֵּא אַחֲרֵי
  choice: folgte … mit ungeteiltem Herzen
  rationale: Die hebräische Wendung meint vollständige, ungeteilte Nachfolge beziehungsweise Loyalität. Die deutsche Formulierung vermittelt diesen idiomatischen Sinn, ohne bloß eine räumliche Bewegung auszudrücken.
- source_word: כְּדָוִד אָבִיו
  choice: wie sein Vater David
  rationale: Die knappe Vergleichsform des Hebräischen bleibt erhalten; aus dem Kontext ist ersichtlich, dass David als Beispiel ungeteilter Nachfolge genannt wird.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Tetragrammaton als Gottes persönlichen Namen. „Jahwe“ bewahrt diesen Namenscharakter.
- issue: Grad von Salomos Versagen in מִלֵּא אַחֲרֵי יְהוָה
  choice: er folgte Jahwe nicht mit ungeteiltem Herzen
  alternative: er folgte Jahwe nicht völlig
  rationale: 'Die Wendung bezeichnet unvollständige Loyalität oder Nachfolge. Die Übersetzung lässt die Spannung bestehen: Der Satz sagt hier nicht schlicht, Salomo habe Jahwe überhaupt nicht mehr gefolgt, sondern dass seine Nachfolge nicht ungeteilt war.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Bildformel „in den Augen“ bleibt erhalten; die schwer übertragbare Wendung מִלֵּא אַחֲרֵי wird idiomatisch wiedergegeben und in der Fußnote erläutert.
