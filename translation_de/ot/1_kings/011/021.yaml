base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/021.yaml
  text: When Hadad heard in Egypt that David had lain down with his fathers and that Joab[a], the commander of the army, was dead, Hadad said to Pharaoh, “Send me away[b], so that I may go to my own land.”
translation:
  language: de
  text: 'Als Hadad in Ägypten hörte, dass David sich zu seinen Vorfahren gelegt hatte[a] und dass Joab, der Befehlshaber des Heeres, tot war[b], sagte Hadad zum Pharao: „Lass mich ziehen, damit ich in mein Land gehen kann.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „hatte sich mit seinen Vätern gelegt“; eine übliche hebräische Wendung für den Tod.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „gestorben war“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: hörte
  rationale: Die Grundbedeutung ist „hören“; im Erzählzusammenhang ist damit das Erhalten einer Nachricht gemeint. „Hörte“ bewahrt die hebräische Ausdrucksweise.
- source_word: שָׁכַב ... עִם אֲבֹתָיו
  choice: sich zu seinen Vorfahren gelegt hatte
  rationale: Die geläufige hebräische Todesformel wird bildhaft und zugleich in natürlichem Deutsch wiedergegeben; eine Fußnote erläutert ihre Bedeutung.
- source_word: מֵת
  choice: tot war
  rationale: Die Form bezeichnet hier den eingetretenen Zustand. „Tot war“ gibt diesen unmittelbar wieder; „gestorben war“ bleibt als mögliche Alternative in der Fußnote erhalten.
- source_word: שַׂר הַצָּבָא
  choice: der Befehlshaber des Heeres
  rationale: Die Wendung bezeichnet Joabs militärisches Führungsamt. „Befehlshaber des Heeres“ ist präzise, verständlich und würdevoll.
- source_word: שַׁלְּחֵנִי
  choice: Lass mich ziehen
  rationale: Der Imperativ bittet den Pharao um Entlassung beziehungsweise Erlaubnis zur Abreise. „Lass mich ziehen“ drückt dies in natürlichem Deutsch aus.
- source_word: וְאֵלֵךְ
  choice: damit ich ... gehen kann
  rationale: Die Kohortativform bezeichnet nach der Aufforderung den beabsichtigten Zweck und wird mit einem deutschen Finalsatz wiedergegeben.
- source_word: אַרְצִי
  choice: mein Land
  rationale: אֶרֶץ bedeutet hier „Land“; das Personalsuffix wird direkt durch „mein“ wiedergegeben, ohne die Aussage durch ein nicht ausdrückliches „eigenes“ oder „zurück“ zu erweitern.
