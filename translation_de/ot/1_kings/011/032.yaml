source:
  edition: WLC
  text: וְ/הַ/שֵּׁ֥בֶט הָ/אֶחָ֖ד יִֽהְיֶה לּ֑/וֹ לְמַ֣עַן עַבְדִּ֣/י דָוִ֗ד וּ/לְמַ֨עַן֙ יְר֣וּשָׁלִַ֔ם הָ/עִיר֙ אֲשֶׁ֣ר בָּחַ֣רְתִּי בָ֔/הּ מִ/כֹּ֖ל שִׁבְטֵ֥י יִשְׂרָאֵֽל־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/032.yaml
  text: But one tribe will remain his[a], for the sake of my servant David and for the sake of Jerusalem, the city that I have chosen from all the tribes of Israel.
translation:
  language: de
  text: Doch der eine Stamm[a] wird ihm gehören – um meines Dieners David willen und um Jerusalems willen, der Stadt, die ich aus allen Stämmen Israels erwählt habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der eine Stamm“. Häufig wird angenommen, dass Benjamin zu Juda gerechnet wird, besonders wegen der Lage Jerusalems; der hebräische Text selbst spricht jedoch von „dem einen Stamm“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַשֵּׁבֶט הָאֶחָד
  choice: Doch der eine Stamm
  rationale: שֵׁבֶט bezeichnet hier einen Stammesverband, nicht einen Stab oder ein Zepter. Das einleitende וְ wird wegen des Gegensatzes zur vorausgehenden Teilung des Königreichs mit „Doch“ wiedergegeben. Der bestimmte Ausdruck הַשֵּׁבֶט הָאֶחָד wird möglichst eng als „der eine Stamm“ übersetzt.
- source_word: יִהְיֶה לּוֹ
  choice: soll ihm gehören
  rationale: Die hebräische Wendung „wird/soll für ihn sein“ drückt hier Zugehörigkeit beziehungsweise verbleibenden Besitz aus. „Soll ihm gehören“ ist im Deutschen natürlich und bewahrt den Zukunftsbezug.
- source_word: לְמַעַן
  choice: um … willen
  rationale: Die zweimalige Präposition bezeichnet den Beweggrund der göttlichen Entscheidung. Die gehobene, aber verständliche Wendung „um … willen“ bildet zudem die Wiederholung des Hebräischen ab.
- source_word: עַבְדִּי דָוִד
  choice: meines Dieners David
  rationale: „Diener“ gibt die ehrende königlich-bundestheologische Bezeichnung עֶבֶד in diesem Zusammenhang angemessen wieder.
- source_word: יְרוּשָׁלִַם הָעִיר
  choice: Jerusalems …, der Stadt
  rationale: Die Apposition wird in die durch „um … willen“ erforderte Genitivkonstruktion eingebunden und bleibt eindeutig auf Jerusalem bezogen.
- source_word: אֲשֶׁר בָּחַרְתִּי בָהּ
  choice: die ich … erwählt habe
  rationale: „Erwählt“ trifft die bewusste Auswahl durch Gott; das Perfekt gibt die abgeschlossene Wahl mit fortdauernder Bedeutung wieder. Das pronominale בָהּ wird im Deutschen idiomatisch nicht eigens ausgedrückt.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: aus allen Stämmen Israels
  rationale: מִן kennzeichnet bei בחר die Auswahl aus einer Gesamtmenge. „Aus allen Stämmen Israels“ gibt diese Beziehung direkt wieder.
theological_decisions:
- issue: Spannung zwischen „ein Stamm“ und Stellen beziehungsweise Zählungen, nach denen Juda und Benjamin gemeinsam unter Rehabeam stehen
  choice: Den hebräischen Wortlaut als „der eine Stamm“ wiedergeben
  alternative: Benjamin als in Juda beziehungsweise Jerusalem eingeschlossen verstehen oder harmonisierend „ein Königreich“ beziehungsweise „zwei Stämme“ übersetzen
  rationale: Der masoretische Text sagt ausdrücklich „der eine Stamm“. Die Übersetzung bewahrt diese Formulierung und verlagert mögliche historische oder synekdochische Erklärungen in die Fußnote, statt die Spannung im Haupttext aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Um … willen“ hält die feierliche Wiederholung des Ausgangstextes fest, ohne altertümliche Satzformen zu verwenden. Die numerische Spannung bleibt im Haupttext erhalten und wird knapp erläutert.
