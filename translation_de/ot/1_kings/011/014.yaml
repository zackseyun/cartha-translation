source:
  edition: WLC
  text: וַ/יָּ֨קֶם יְהוָ֤ה שָׂטָן֙ לִ/שְׁלֹמֹ֔ה אֵ֖ת הֲדַ֣ד הָ/אֲדֹמִ֑י מִ/זֶּ֧רַע הַ/מֶּ֛לֶךְ ה֖וּא בֶּ/אֱדֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/014.yaml
  text: Then Yahweh raised up an adversary against Solomon[a], Hadad the Edomite; he was of the royal line in Edom.
translation:
  language: de
  text: Da ließ Jahwe Hadad, den Edomiter, als Widersacher[a] gegen Salomo auftreten. Er stammte aus dem Königshaus von Edom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch satan; hier bedeutet das Wort „Widersacher“ oder „Gegner“, nicht den Eigennamen Satan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: ließ … auftreten
  rationale: Der Hifil von קום bezeichnet hier, dass Jahwe jemanden als Gegner aufkommen lässt. Die deutsche Wendung gibt die göttliche Veranlassung natürlich wieder, ohne eine förmliche Ernennung anzunehmen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: שָׂטָן
  choice: einen Widersacher
  rationale: Das Wort ist hier ein Gattungsbegriff für einen menschlichen Gegner, nämlich Hadad, und kein Eigenname.
- source_word: לִשְׁלֹמֹה
  choice: gegen Salomo
  rationale: Die Präposition ל bezeichnet in Verbindung mit שָׂטָן die Person, gegen die sich der Widerstand richtet.
- source_word: הֲדַד הָאֲדֹמִי
  choice: Hadad, den Edomiter
  rationale: Der Personenname wird transliteriert; die Herkunftsbezeichnung wird im Deutschen idiomatisch als Apposition wiedergegeben.
- source_word: מִזֶּרַע הַמֶּלֶךְ
  choice: stammte aus dem Königshaus
  rationale: Wörtlich steht hier „vom Samen des Königs“, eine Wendung für königliche Abstammung. „Aus dem Königshaus stammen“ bewahrt den genealogischen Sinn in natürlichem Deutsch.
- source_word: הוּא בֶּאֱדוֹם
  choice: in Edom
  rationale: Die knappe hebräische Wendung ordnet die königliche Abstammung Edom zu. Die Übersetzung verbindet sie natürlich mit der Aussage über Hadads Herkunft.
theological_decisions:
- issue: Bedeutung von שָׂטָן in diesem Vers
  choice: Gattungsbegriff „Widersacher“
  alternative: Eigenname „Satan“
  rationale: Syntax und Zusammenhang identifizieren Hadad als den menschlichen Gegner Salomos. Der Text spricht hier nicht vom Teufel; die Wiedergabe als Gattungsbegriff vermeidet eine spätere theologische Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Widersacher“ wahrt den Zusammenhang mit dem hebräischen Begriff und ist trotz seines leicht gehobenen Tons allgemein verständlich. Die Teilung in zwei Sätze vermeidet eine schwerfällige Appositionskette.
