  text: וַ/יְבַקֵּ֥שׁ שְׁלֹמֹ֖ה לְ/הָמִ֣ית אֶת יָרָבְעָ֑ם וַ/יָּ֣קָם יָרָבְעָ֗ם וַ/יִּבְרַ֤ח מִצְרַ֨יִם֙ אֶל שִׁישַׁ֣ק מֶֽלֶךְ מִצְרַ֔יִם וַ/יְהִ֥י בְ/מִצְרַ֖יִם עַד מ֥וֹת שְׁלֹמֹֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/040.yaml
  text: Then Solomon sought to put Jeroboam to death[a], but Jeroboam arose and fled to Egypt, to Shishak king of Egypt[b], and he was in Egypt until the death of Solomon.
translation:
  language: de
  text: Da suchte Salomo Jerobeam zu töten[a]. Doch Jerobeam machte sich auf und floh nach Ägypten zu Schischak, dem König von Ägypten. Er blieb in Ägypten, bis Salomo starb.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Salomo versuchte, Jerobeam zu töten.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבַקֵּשׁ
  choice: suchte
  rationale: „Suchte“ bildet בקש nah am hebräischen Idiom ab und bezeichnet hier Absicht und Bemühung, ohne einen Erfolg anzudeuten.
- source_word: לְהָמִית
  choice: zu töten
  rationale: Der Hifil-Infinitiv von מות ist kausativ. „Zu töten“ gibt dies im modernen Deutschen natürlich und prägnant wieder; „umbringen zu lassen“ würde eine nicht ausdrücklich genannte Vollstreckung durch Dritte eintragen.
- source_word: וַיָּקָם
  choice: machte sich auf
  rationale: קום markiert in Erzählungen häufig den entschlossenen Beginn einer Handlung. „Machte sich auf“ ist im Deutschen natürlicher als das wörtlichere „stand auf“ und verbindet sich gut mit der Flucht.
- source_word: וַיִּבְרַח
  choice: floh
  rationale: ברח bezeichnet die Flucht vor Gefahr; „floh“ ist knapp und entspricht dem Kontext der tödlichen Bedrohung.
- source_word: מִצְרַיִם ... אֶל שִׁישַׁק מֶלֶךְ מִצְרַיִם
  choice: nach Ägypten zu Schischak, dem König von Ägypten
  rationale: Das erste מִצְרַיִם bezeichnet trotz der ungewöhnlichen Form das Ziel; אֶל präzisiert die Zuflucht bei Schischak. Die Wiederholung von „Ägypten“ bewahrt die Struktur und Klarheit des Hebräischen.
- source_word: וַיְהִי בְמִצְרַיִם
  choice: Er blieb in Ägypten
  rationale: Wörtlich steht „er war in Ägypten“. Zusammen mit der Zeitangabe עד drückt die deutsche Formulierung „blieb“ den fortdauernden Aufenthalt natürlich aus.
- source_word: עַד מוֹת שְׁלֹמֹה
  choice: bis Salomo starb
  rationale: Die hebräische Nominalkonstruktion bedeutet wörtlich „bis zum Tod Salomos“. Der deutsche Nebensatz ist idiomatisch und erhält denselben zeitlichen Sinn.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. „Da“ und „doch“ machen die erzählerische Abfolge und den Gegensatz natürlich sichtbar; Eigennamen folgen den im Deutschen üblichen biblischen Formen „Salomo“, „Jerobeam“ und „Schischak“.
