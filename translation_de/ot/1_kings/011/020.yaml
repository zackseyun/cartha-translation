revisions:
- from: Und die Schwester Tachpenes’ gebar ihm seinen Sohn Genubat[a]. Tachpenes entwöhnte ihn im Haus des Pharaos[b], und Genubat lebte im Haus des Pharaos unter den Söhnen des Pharaos.
  to: Und Tachpenes' Schwester gebar ihm Genubat, seinen Sohn[a]. Tachpenes entwöhnte ihn im Haus des Pharaos[b], und Genubat befand sich im Haus des Pharaos unter den Söhnen des Pharaos.
  rationale: Die Revision beseitigt die deutsche Mehrdeutigkeit bei der Identifizierung Genubats als Hadads Sohn und ersetzt die leicht ausdeutende Wiedergabe von וַיְהִי durch eine neutrale, idiomatische Ortsangabe. Die Satzstruktur, die Wiederholung von „Haus des Pharaos“ sowie die Fußnotenanker bleiben erhalten.
