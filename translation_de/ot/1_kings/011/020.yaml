    issue: „gebar ihm seinen Sohn Genubat“ ist syntaktisch mehrdeutig und unnatürlich.
    rationale: Das hebräische Genubat, sein Sohn identifiziert Genubat als Hadads Sohn. Im Deutschen kann „seinen Sohn“ in dieser Stellung aber unklar an „ihm“ oder an den Geburtsvorgang gebunden erscheinen. Die Apposition „Genubat, seinen Sohn“ macht den Bezug deutlich und erhält die explizite Aussage des Hebräischen.
  - severity: low
    issue: „lebte“ ist gegenüber וַיְהִי leicht interpretierend.
    rationale: Der hebräische Erzählsatz besagt zunächst, dass Genubat im Haus des Pharaos unter dessen Söhnen war. „Befand sich“ gibt diese lokativ-soziale Aussage neutral wieder, ohne einen stärker ausgeführten dauerhaften Wohnstatus nahezulegen.
