base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/020.yaml
  text: And the sister of Tahpenes bore him Genubath his son[a], and Tahpenes weaned him within Pharaoh’s house[b]; and Genubath was in Pharaoh’s house among the sons of Pharaoh.
translation:
  language: de
  text: Und Tachpenes' Schwester gebar ihm Genubat, seinen Sohn[a]. Tachpenes entwöhnte ihn im Haus des Pharaos[b], und Genubat befand sich im Haus des Pharaos unter den Söhnen des Pharaos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Tachpenes'' Schwester gebar ihm einen Sohn, Genubat.“ Die hebräische Formulierung lässt beide Wiedergaben zu; der Sinn bleibt gleich.'
    reason: lexical_alternative
  - marker: b
    text: „Entwöhnte ihn“ bedeutet, dass sie das Kind bis zu dem Alter versorgte, in dem es nicht mehr gestillt wurde. Danach blieb es im Haushalt des Pharaos.
    reason: cultural_note
lexical_decisions:
- source_word: וַתֵּלֶד לוֹ
  choice: gebar ihm
  rationale: ילד mit ל bezeichnet hier, dass Tachpenes’ Schwester Hadad einen Sohn gebar; die knappe deutsche Wendung bewahrt diesen Bezug.
- source_word: אֲחוֹת תַּחְפְּנֵיס
  choice: die Schwester Tachpenes’
  rationale: Die hebräische Genitivverbindung wird in würdigem, natürlichem Deutsch wiedergegeben.
- source_word: גְּנֻבַת
  choice: Genubat
  rationale: Der Personenname wird nach seiner hebräischen Form ins Deutsche übertragen.
- source_word: בְּנוֹ
  choice: seinen Sohn
  rationale: Das Suffix bezeichnet Genubat ausdrücklich als Hadads Sohn.
- source_word: וַתִּגְמְלֵהוּ
  choice: entwöhnte ihn
  rationale: גמל bezeichnet in diesem Zusammenhang das Abstillen beziehungsweise Entwöhnen eines Kindes.
- source_word: בְּתוֹךְ בֵּית פַּרְעֹה
  choice: im Haus des Pharaos
  rationale: Die Wendung umfasst den königlichen Wohnbereich und Haushalt; „Haus“ bewahrt die Breite des hebräischen Ausdrucks.
- source_word: וַיְהִי
  choice: lebte
  rationale: Im erzählerischen Zusammenhang bezeichnet היה Genubats fortdauernden Aufenthalt im königlichen Haus; „lebte“ ist im Deutschen natürlicher als ein bloßes „war“.
- source_word: בְּתוֹךְ בְּנֵי פַרְעֹה
  choice: unter den Söhnen des Pharaos
  rationale: בני wird seinem grammatischen Sinn entsprechend als „Söhne“ wiedergegeben und zeigt Genubats Stellung unter den königlichen Kindern.
