base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/022.yaml
  text: Then Pharaoh said to him[a], “But what do you lack with me, that you are seeking to go to your own land?” And he said, “Nothing, but please let me go.”
translation:
  language: de
  text: 'Da sagte der Pharao zu ihm: „Was fehlt dir denn bei mir, dass du in dein Land ziehen willst?“ Er antwortete: „Nichts. Doch lass mich unbedingt gehen[a].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Du sollst mich unbedingt fortschicken.“ Im Hebräischen wird die Aufforderung durch die Verbindung eines absoluten Infinitivs mit einer finiten Verbform nachdrücklich verstärkt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי מָה
  choice: Was … denn
  rationale: Die Partikel כִּי leitet hier im Zusammenhang eine verwunderte, leicht einwendende Frage ein. Das deutsche Modalwort „denn“ gibt diese Gesprächsfunktion natürlicher wieder als ein vorangestelltes „Aber“.
- source_word: חָסֵר עִמִּי
  choice: fehlt dir … bei mir
  rationale: חָסֵר bezeichnet einen Mangel; עִמִּי beschreibt Hadads Aufenthalt beziehungsweise Verhältnis beim Pharao. „Was fehlt dir bei mir?“ ist direkt, idiomatisch und wahrt den Sinn.
- source_word: וְהִנְּךָ מְבַקֵּשׁ
  choice: dass du … willst
  rationale: הִנֵּה lenkt die Aufmerksamkeit auf die gegenwärtige Absicht, während בקש hier das Begehren oder Vorhaben ausdrückt. Im natürlichen deutschen Fragesatz wird dies knapp mit „dass du … willst“ wiedergegeben.
- source_word: לָלֶכֶת אֶל־אַרְצֶךָ
  choice: in dein Land ziehen
  rationale: הלך bedeutet hier gehen beziehungsweise ziehen; eine ausdrückliche Bedeutung „zurückkehren“ sollte nicht in den Text eingetragen werden. „In dein Land“ gibt die Zielrichtung idiomatisch wieder.
- source_word: לֹא
  choice: Nichts
  rationale: 'Das alleinstehende לֹא antwortet elliptisch auf die Frage, was ihm fehle: Ihm fehlt nichts. „Nichts“ macht den im Deutschen nötigen Bezug klar.'
- source_word: כִּי
  choice: Aber … dennoch
  rationale: Die Partikel markiert nach „Nichts“ die Wendung zum eigentlichen Anliegen. „Aber … dennoch“ macht deutlich, dass Hadad trotz fehlenden Mangels auf seiner Bitte besteht.
- source_word: שַׁלֵּחַ תְּשַׁלְּחֵנִי
  choice: lass mich dennoch gehen
  rationale: Der Infinitivus absolutus mit der finiten Verbform verstärkt die Aufforderung. Der Haupttext gibt das als nachdrückliches Beharren wieder; die formale hebräische Konstruktion wird in der Fußnote erläutert.
