translation_notes:
  register: Moderne, würdige Standardsprache mit natürlichem Dialog. „ziehen“ vermeidet das missverständliche bloße „gehen“, ohne das im Hebräischen nicht ausdrücklich enthaltene „zurückkehren“ einzuführen. Der Fußnotenmarker steht unmittelbar bei der betroffenen Wendung.
