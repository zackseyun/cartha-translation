  verdict: approve
  source_fidelity: 'Der Satz gibt alle inhaltlich wesentlichen Elemente des Hebräischen wieder: Salomo als Subjekt, seine Königsherrschaft, Jerusalem als Ortsangabe, seine Herrschaft über ganz Israel und die Dauer von vierzig Jahren. Die hebräische Formel „die Tage, die ... regierte“ ist eine idiomatische Dauerangabe und wird durch „regierte ... vierzig Jahre“ funktionsgleich und ohne Sinnverlust wiedergegeben. Das einleitende וְ muss im Deutschen nicht als „und“ nachgebildet werden.'
  naturalness: „Salomo regierte in Jerusalem über ganz Israel vierzig Jahre“ ist klares, modernes Standarddeutsch und für eine knappe Regierungsnotiz angemessen. Die Wortstellung ist natürlich; „vierzig Jahre“ steht idiomatisch als Dauerangabe.
  terminology: „Salomo“ ist die etablierte deutsche Namensform. „regierte“ und „über ganz Israel“ treffen den königlichen und kollektiven Bezug von מָלַךְ bzw. עַל־כָּל־יִשְׂרָאֵל sachgerecht. Es sind keine theologischen Fachbegriffe oder Fußnotenanker betroffen.
