lexical_decisions:
- source_word: וְ/הַ/יָּמִים אֲשֶׁר
  choice: '[nicht eigens wiedergegeben]'
  rationale: Die hebräische Zeitformel lautet wörtlich „Und die Tage, die …“. Im modernen Deutschen wird die Dauer einer Regierung natürlicher durch die direkte Zeitangabe beim Verb ausgedrückt; ihr vollständiger Sinn bleibt erhalten.
- source_word: מָלַךְ
  choice: regierte
  rationale: Das Qal-Verb bezeichnet hier die Ausübung des Königtums. „Regierte“ ist in einer modernen deutschen Regierungsnotiz klar und idiomatisch.
- source_word: שְׁלֹמֹה
  choice: Salomo
  rationale: Verwendet wird die im Deutschen übliche biblische Namensform.
- source_word: בִ/ירוּשָׁלִַם
  choice: in Jerusalem
  rationale: Die Präposition בְּ ist hier lokativ und wird natürlich mit „in“ wiedergegeben.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: über ganz Israel
  rationale: עַל bezeichnet den Herrschaftsbereich; „ganz Israel“ bewahrt den kollektiven und politischen Bezug.
- source_word: אַרְבָּעִים שָׁנָה
  choice: vierzig Jahre
  rationale: Direkte Wiedergabe der Zeitdauer.
