source:
  edition: WLC
  text: וְ/זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר הֵרִ֥ים יָ֖ד בַּ/מֶּ֑לֶךְ שְׁלֹמֹה֙ בָּנָ֣ה אֶת הַ/מִּלּ֔וֹא סָגַ֕ר אֶת פֶּ֕רֶץ עִ֖יר דָּוִ֥ד אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/027.yaml
  text: 'And this was the reason why he raised his hand against the king: Solomon had built the Millo and closed up the breach of the city of David his father[a][b].'
translation:
  language: de
  text: 'Und dies war der Grund, warum er seine Hand gegen den König erhob[a]: Salomo hatte den Millo[b] gebaut und die Bresche der Stadt Davids, seines Vaters, geschlossen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder deutender: »Er lehnte sich gegen den König auf.« Wörtlich heißt die hebräische Wendung: »Er erhob seine Hand gegen den König.«'
    reason: alternative_reading
  - marker: b
    text: Der »Millo« war vermutlich eine Befestigungsanlage oder eine terrassierte Aufschüttung in Jerusalem.
    reason: cultural_note
lexical_decisions:
- source_word: הַדָּבָר
  choice: der Grund
  rationale: Wörtlich »die Sache«; die Wendung leitet hier die Begründung für Jerobeams Vorgehen ein. »Der Grund« gibt diese erklärende Funktion natürlich wieder.
- source_word: הֵרִים יָד
  choice: seine Hand gegen … erhob
  rationale: Bewahrt das verständliche hebräische Bild für feindliches Vorgehen beziehungsweise Auflehnung, ohne es im Haupttext bereits eindeutig als Rebellion auszulegen.
- source_word: בַּמֶּלֶךְ
  choice: gegen den König
  rationale: Die Präposition bezeichnet innerhalb der Wendung das Ziel des feindlichen Vorgehens; der hebräische Text nennt hier zunächst nur »den König«.
- source_word: הַמִּלּוֹא
  choice: den Millo
  rationale: Der Ausdruck bezeichnet wahrscheinlich eine bestimmte Befestigungs- oder Aufschüttungsanlage in Jerusalem; wegen der unsicheren genauen Bauart bleibt der Eigenname erhalten.
- source_word: סָגַר
  choice: geschlossen
  rationale: Gibt die Grundbedeutung »schließen, verschließen« wieder und passt zum Bild einer Bresche in der Stadtbefestigung.
- source_word: פֶּרֶץ
  choice: die Bresche
  rationale: Bezeichnet in diesem baulichen Zusammenhang eine Lücke oder Bruchstelle in der Befestigung.
- source_word: עִיר דָּוִד אָבִיו
  choice: die Stadt seines Vaters David
  rationale: Die deutsche Wortstellung macht den Bezug von »seines Vaters« auf Salomo klar und gibt die Bezeichnung der Davidsstadt quellennah wieder.
theological_decisions:
- issue: Bedeutung der Wendung »die Hand gegen den König erheben«
  choice: Das hebräische Bild bleibt im Haupttext erhalten.
  alternative: »Er lehnte sich gegen den König auf« oder »er rebellierte gegen den König«
  rationale: Die idiomatische Bedeutung weist auf Auflehnung beziehungsweise feindliches Handeln, doch die bildhafte und leicht offene Formulierung des Hebräischen sollte nicht unnötig verengt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem erklärenden Aufbau des Hebräischen; das konkrete Idiom und der unsichere architektonische Fachname bleiben erhalten und werden durch Fußnoten erläutert.
