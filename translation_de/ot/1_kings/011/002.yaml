base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/002.yaml
  text: from the nations about which Yahweh had said to the sons of Israel[a], “You shall not go in among them, and they shall not come in among you; surely they will turn your heart after their gods”—to these Solomon clung in love.
translation:
  language: de
  text: 'aus den Völkern, von denen Jahwe zu den Söhnen Israels gesagt hatte: »Ihr sollt nicht zu ihnen hineingehen, und sie sollen nicht zu euch hineingehen[a]; ganz gewiss werden sie euer Herz ihren Göttern zuwenden.« An ihnen hing Salomo in Liebe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Zusammenhang ist gemeint: »Ihr sollt euch nicht mit ihnen verheiraten, und sie sollen sich nicht mit euch verheiraten.« Die hebräische Formulierung lautet wörtlich: »Ihr sollt nicht zu ihnen hineingehen, und sie sollen nicht zu euch hineingehen.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַגּוֹיִם
  choice: aus den Völkern
  rationale: גּוֹיִם bezeichnet hier die fremden Völker, aus denen Salomo Frauen nahm; »Völker« ist im Deutschen natürlich und quellennah.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname Gottes wird als »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die hebräische Form wird transparent bewahrt; sie bezeichnet hier das Bundesvolk Israel.
- source_word: לֹא תָבֹאוּ בָהֶם ... וְהֵם לֹא יָבֹאוּ בָכֶם
  choice: Ihr sollt nicht zu ihnen hineingehen, und sie sollen nicht zu euch hineingehen
  rationale: Die wechselseitige und bewusst allgemein formulierte Wendung mit בוא und ב wird erhalten; der Ehekontext wird in der Fußnote erläutert.
- source_word: אָכֵן
  choice: ganz gewiss
  rationale: Die Formulierung bringt die nachdrückliche Gewissheit des Warnworts in natürlichem Deutsch zum Ausdruck.
- source_word: יַטּוּ אֶת לְבַבְכֶם
  choice: sie werden euer Herz zuwenden
  rationale: Die kausative Bedeutung von נטה und das Herzbild bleiben erhalten.
- source_word: אַחֲרֵי אֱלֹהֵיהֶם
  choice: ihren Göttern
  rationale: In Verbindung mit »zuwenden« gibt der Dativ die Zielrichtung der hebräischen Wendung אַחֲרֵי idiomatisch wieder.
- source_word: בָּהֶם דָּבַק שְׁלֹמֹה
  choice: An ihnen hing Salomo
  rationale: דבק bezeichnet ein starkes Festhalten oder Anhängen; »an ihnen hing« wahrt die Intensität und die pronominale Rückverweisung, ohne ausdrücklich »Frauen« hinzuzufügen.
- source_word: לְאַהֲבָה
  choice: in Liebe
  rationale: Die Wiedergabe bewahrt den ausdrücklichen Bezug zur Liebe und beschreibt die Art von Salomos Anhängen.
theological_decisions:
- issue: Ob das Verbot im Haupttext ausdrücklich als Verbot der Mischehe wiederzugeben ist
  choice: Die allgemeinere hebräische Wendung »zu ihnen hineingehen / zu euch hineingehen« bleibt im Haupttext erhalten.
  alternative: »Ihr sollt euch nicht mit ihnen verheiraten, und sie sollen sich nicht mit euch verheiraten.«
  rationale: Der Zusammenhang handelt eindeutig von Ehen mit ausländischen Frauen, doch der Vers selbst verwendet die allgemeinere Wendung mit בוא. Die Fußnote erklärt den kontextuellen Sinn, ohne ihn in den Haupttext einzutragen.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Israeliten / das Volk Israel
  rationale: Die konkrete hebräische Form bleibt sichtbar; zugleich ist im Zusammenhang klar, dass damit Israel als Gemeinschaft angesprochen ist.
- issue: Bezug von בָּהֶם
  choice: »An ihnen« bleibt pronominal und mehrdeutig.
  alternative: »An diesen Frauen«
  rationale: Der unmittelbare Zusammenhang legt die Frauen nahe, während die grammatische Form auf die zuvor genannten Völker zurückverweist. Die Übersetzung vermeidet eine stillschweigende Auflösung dieser Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzanfang bleibt als Fortsetzung von Vers 1 gestaltet. Die parallele hebräische Redeweise und die pronominale Mehrdeutigkeit am Versende werden bewahrt; die kontextuelle Bedeutung der Eheschließung wird nur in der Fußnote verdeutlicht.
