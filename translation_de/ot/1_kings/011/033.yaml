id: 1KI.11.33
reference: 1 Kings 11:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יַ֣עַן אֲשֶׁ֣ר עֲזָב֗וּ/נִי וַ/יִּֽשְׁתַּחֲווּ֮ לְ/עַשְׁתֹּרֶת֮ אֱלֹהֵ֣י צִֽדֹנִין֒ לִ/כְמוֹשׁ֙ אֱלֹהֵ֣י מוֹאָ֔ב וּ/לְ/מִלְכֹּ֖ם אֱלֹהֵ֣י בְנֵֽי עַמּ֑וֹן וְ/לֹֽא הָלְכ֣וּ בִ/דְרָכַ֗/י לַ/עֲשׂ֨וֹת הַ/יָּשָׁ֧ר בְּ/עֵינַ֛/י וְ/חֻקֹּתַ֥/י וּ/מִשְׁפָּטַ֖/י כְּ/דָוִ֥ד אָבִֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/033.yaml
  text: because they have forsaken me and bowed down to Ashtoreth[a], the god of the Sidonians, to Chemosh, the god of Moab, and to Milcom, the god of the Ammonites, and have not walked in my ways, to do what is right in my eyes and my statutes and my judgments[d][c][b], like David his father.
translation:
  language: de
  text: weil sie mich verlassen und sich vor Aschtoret, dem Gott der Sidonier,[a] vor Kemosch, dem Gott Moabs, und vor Milkom,[b] dem Gott der Ammoniter, niedergeworfen haben und nicht auf meinen Wegen gegangen sind, um zu tun, was in meinen Augen recht ist, und meine Satzungen und Rechtsbestimmungen zu befolgen – so wie David, sein Vater.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aschtoret war eine weibliche Gottheit. Daher kann sinngemäß auch „die Göttin der Sidonier“ übersetzt werden; der hebräische Ausdruck lautet formal „der Gott der Sidonier“.
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Text liest hier „Milkom“. Dieser Name wird mitunter mit Moloch in Verbindung gebracht.
    reason: alternative_reading
  - marker: c
    text: „Sein Vater“ bezieht sich auf Salomo; David war Salomos Vater.
    reason: referent_clarification
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: weil
  rationale: Die Konjunktion gibt den Grund für die angekündigte Teilung des Königreichs an. „Weil“ ist im modernen Deutschen natürlich und bewahrt die kausale Funktion.
- source_word: עֲזָבוּנִי
  choice: sie mich verlassen
  rationale: עזב bezeichnet hier das Abwenden von Gott im Zusammenhang des Bundes. „Verlassen“ bewahrt das Gewicht dieses Treuebruchs, ohne altertümlich zu wirken.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: sich … niedergeworfen haben
  rationale: Das Verb bezeichnet das körperliche Niederwerfen als Akt der Verehrung. Die Wiedergabe erhält sowohl die konkrete Gebärde als auch ihren kultischen Sinn.
- source_word: לְעַשְׁתֹּרֶת
  choice: vor Aschtoret
  rationale: Der hebräische Eigenname wird in einer dem Deutschen entsprechenden Form wiedergegeben. Die Präposition „vor“ passt idiomatisch zu „sich niederwerfen“.
- source_word: אֱלֹהֵי צִדֹנִין
  choice: dem Gott der Sidonier
  rationale: Die Wiedergabe folgt der formalen Ausdrucksweise des hebräischen Textes. Dass Aschtoret als weibliche Gottheit bekannt ist, wird in einer Fußnote erläutert, statt den Wortlaut stillschweigend anzugleichen.
- source_word: לִכְמוֹשׁ
  choice: vor Kemosch
  rationale: Der Eigenname wird nach der hebräischen Form deutsch transliteriert.
- source_word: אֱלֹהֵי מוֹאָב
  choice: dem Gott Moabs
  rationale: Die knappe Genitivverbindung gibt die hebräische Status-constructus-Verbindung natürlich wieder.
- source_word: וּלְמִלְכֹּם
  choice: und vor Milkom
  rationale: Der masoretische Text nennt hier Milkom. Die gelegentliche Verbindung mit Moloch wird in der Fußnote erwähnt, nicht in den Haupttext eingetragen.
- source_word: אֱלֹהֵי בְנֵי עַמּוֹן
  choice: dem Gott der Ammoniter
  rationale: „Söhne Ammons“ ist eine Volksbezeichnung; „Ammoniter“ gibt den gemeinten Bezug im Deutschen idiomatisch wieder.
- source_word: וְלֹא הָלְכוּ בִדְרָכַי
  choice: und nicht auf meinen Wegen gegangen sind
  rationale: Das bildhafte Bundesmotiv des Gehens auf Gottes Wegen bleibt erhalten und ist im Deutschen verständlich.
- source_word: לַעֲשׂוֹת הַיָּשָׁר בְּעֵינַי
  choice: um zu tun, was in meinen Augen recht ist
  rationale: Die Infinitivkonstruktion wird als Ziel beziehungsweise inhaltliche Entfaltung des Gehens wiedergegeben. „In meinen Augen“ bewahrt die Perspektive Gottes und die Bildsprache des Hebräischen.
- source_word: וְחֻקֹּתַי וּמִשְׁפָּטַי
  choice: und meine Satzungen und Rechtsbestimmungen zu befolgen
  rationale: Im Hebräischen regiert עשׂה auch diese beiden Rechtsbegriffe. Im natürlichen Deutschen wird für sie „befolgen“ ergänzt, ohne einen zusätzlichen Gedanken einzuführen. „Satzungen“ und „Rechtsbestimmungen“ halten die beiden Begriffe unterscheidbar.
- source_word: כְּדָוִד אָבִיו
  choice: so wie David, sein Vater
  rationale: Die vergleichende Wendung bleibt eng am Hebräischen. Der Rückbezug des Singularpronomens auf Salomo wird in einer Fußnote verdeutlicht.
theological_decisions:
- issue: Bezeichnung Aschtorets durch אֱלֹהֵי
  choice: dem Gott der Sidonier
  alternative: der Göttin der Sidonier / der Gottheit der Sidonier
  rationale: Der Haupttext bewahrt die auffällige Ausdrucksweise des hebräischen Textes, während die historische Einordnung als weibliche Gottheit in der Fußnote offengelegt wird. So wird die Spannung weder beseitigt noch missverständlich verschwiegen.
- issue: Identität von מִלְכֹּם
  choice: Milkom
  alternative: Moloch
  rationale: Die überlieferte hebräische Lesung an dieser Stelle ist Milkom. Eine mögliche oder traditionelle Verbindung mit Moloch rechtfertigt eine Anmerkung, aber keine Ersetzung im Haupttext.
- issue: Bezugswort von אָבִיו
  choice: „sein“ bezieht sich auf Salomo
  alternative: Bezug auf eine andere im weiteren Zusammenhang genannte Person
  rationale: Das maskuline Singularsuffix führt nach dem vorausgehenden pluralischen Handeln wieder auf Salomo als die zentrale Einzelperson des Zusammenhangs zurück; David ist tatsächlich Salomos Vater. Die Fußnote macht den im isolierten Vers nicht ausdrücklich genannten Bezug transparent.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzform bleibt als kausaler Nebensatz offen, weil der Vers syntaktisch an die vorausgehende Gottesrede anschließt. Kultische und bundesbezogene Bildsprache wird soweit verständlich beibehalten; bei den Rechtsbegriffen wird für idiomatisches Deutsch ein passendes Verb ergänzt.
