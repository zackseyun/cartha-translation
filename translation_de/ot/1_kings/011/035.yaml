  variant: modern standard German
source:
  edition: WLC
  text: וְ/לָקַחְתִּ֥י הַ/מְּלוּכָ֖ה מִ/יַּ֣ד בְּנ֑/וֹ וּ/נְתַתִּ֣י/הָ לְּ/ךָ֔ אֵ֖ת עֲשֶׂ֥רֶת הַ/שְּׁבָטִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/035.yaml
  text: But I will take the kingdom from the hand of his son and give it to you[b][a], the ten tribes.
translation:
  language: de
  text: 'Doch ich werde das Königtum der Hand seines Sohnes entreißen[a] und es dir geben: die zehn Stämme.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das Königtum aus der Hand seines Sohnes nehmen“. Die Wendung bezeichnet, dass seinem Sohn die Herrschaft entzogen wird.'
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: „und ich werde es dir geben, die zehn Stämme“. „Die zehn Stämme“ erläutert, welchen Teil des Königtums Gott ihm geben wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתִּי
  choice: Doch ich werde … entreißen
  rationale: Das Präfix וְ setzt die Aussage fort, steht hier aber im Kontrast zur vorhergehenden Zusage, Salomos Sohn einen Stamm zu lassen. Die prophetische Perfektform wird zukunftsbezogen wiedergegeben. Mit „entreißen“ lässt sich die Verbindung mit מִיַּד natürlich ausdrücken.
- source_word: הַמְּלוּכָה
  choice: das Königtum
  rationale: מְלוּכָה bezeichnet hier die königliche Herrschaft, die Salomos Sohn entzogen wird. „Königtum“ bewahrt diesen Herrschaftsaspekt genauer als das stärker territorial klingende „Königreich“.
- source_word: מִיַּד בְּנוֹ
  choice: der Hand seines Sohnes entreißen
  rationale: Die hebräische Wendung bezeichnet das Entziehen aus der Verfügungsgewalt. Die deutsche Formulierung bewahrt das Bild der Hand und klingt zugleich natürlich.
- source_word: וּנְתַתִּיהָ לְּךָ
  choice: und es dir geben
  rationale: Das feminine Suffix verweist auf הַמְּלוּכָה. Die futurische Bedeutung wird vom ersten Verb mitgetragen und im Deutschen nicht unnötig wiederholt.
- source_word: אֵת עֲשֶׂרֶת הַשְּׁבָטִים
  choice: die zehn Stämme
  rationale: Die Wortgruppe erläutert appositionell, worin das übergebene Königtum besteht. Ein Doppelpunkt macht diese nähere Bestimmung im Deutschen klar, ohne sie als zusätzliches Objekt misszuverstehen.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. „Königtum“ gibt den Herrschaftsaspekt des hebräischen מְלוּכָה präzise wieder; „der Hand … entreißen“ erhält das hebräische Bild in einer idiomatischen deutschen Wendung.
