source:
  edition: WLC
  text: וַ/יְהִ֨י שָׂטָ֤ן לְ/יִשְׂרָאֵל֙ כָּל יְמֵ֣י שְׁלֹמֹ֔ה וְ/אֶת הָ/רָעָ֖ה אֲשֶׁ֣ר הֲדָ֑ד וַ/יָּ֨קָץ֙ בְּ/יִשְׂרָאֵ֔ל וַ/יִּמְלֹ֖ךְ עַל אֲרָֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/025.yaml
  text: And he was an adversary to Israel all the days of Solomon[a], along with the harm that Hadad caused. And he loathed Israel and reigned over Aram.
translation:
  language: de
  text: Und er war Israel ein Gegner, solange Salomo lebte, zusätzlich zu dem Unheil, das Hadad anrichtete.[a] Er verabscheute Israel und herrschte über Aram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »abgesehen von dem Unheil durch Hadad«. Die hebräische Wendung ist verkürzt und syntaktisch schwierig; wahrscheinlich besagt sie, dass dieser Gegner zusätzlich zu dem von Hadad verursachten Unheil auftrat.'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׂטָן
  choice: Gegner
  rationale: Im politischen Erzählzusammenhang bezeichnet das Substantiv einen menschlichen Widersacher, nicht die übernatürliche Gestalt »Satan«.
- source_word: לְיִשְׂרָאֵל
  choice: Israel ein Gegner
  rationale: Die Präposition kennzeichnet die Partei, gegen die sich der Gegner richtet; diese deutsche Fügung gibt das idiomatisch und zugleich formnah wieder.
- source_word: כָּל יְמֵי שְׁלֹמֹה
  choice: solange Salomo lebte
  rationale: Die Wendung bezeichnet die gesamte Lebens- beziehungsweise Regierungszeit Salomos und wird in natürlichem Gegenwartsdeutsch wiedergegeben.
- source_word: וְאֶת הָרָעָה אֲשֶׁר הֲדָד
  choice: zusätzlich zu dem Unheil, das Hadad anrichtete
  rationale: 'Die elliptische und schwierige Fügung wird additiv verstanden: Dieser Gegner kam zu dem von Hadad verursachten Unheil hinzu. »Unheil« bezeichnet hier feindlich verursachte Not, nicht abstraktes moralisches Böses.'
- source_word: וַיָּקָץ בְּיִשְׂרָאֵל
  choice: Er verabscheute Israel
  rationale: Das Verb קוץ drückt starke Abneigung aus; »verabscheute« ist würdig, verständlich und bewahrt die Intensität.
- source_word: וַיִּמְלֹךְ עַל אֲרָם
  choice: herrschte über Aram
  rationale: »Aram« bewahrt den historischen Eigennamen; »herrschte über« gibt מלך im gegebenen Zusammenhang natürlich wieder.
theological_decisions:
- issue: Ob שָׂטָן als Eigenname »Satan« wiederzugeben ist
  choice: menschlicher »Gegner«
  alternative: »Satan«
  rationale: Der Kontext handelt von politischen Gegnern Salomos. Das Wort ist hier ein gewöhnliches Substantiv; der Eigenname würde eine spätere dämonologische Bedeutung in den Text eintragen.
- issue: Deutung der elliptischen Wendung וְאֶת הָרָעָה אֲשֶׁר הֲדָד
  choice: 'additiv: zusätzlich zu Hadads Unheil'
  alternative: enger Anschluss an »solange Salomo lebte« oder eine wörtlich unvollständige Wiedergabe
  rationale: Die hebräische Konstruktion ist syntaktisch schwierig. Die additive Deutung passt zum Zusammenhang, wird aber wegen der echten Mehrdeutigkeit nicht als völlig sicher dargestellt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der historische Eigenname »Aram« bleibt erhalten; schwer verständliche Satzspiegelung des Hebräischen wird vermieden. Der Fußnotenmarker [a] steht unmittelbar nach der strittigen Wendung.
