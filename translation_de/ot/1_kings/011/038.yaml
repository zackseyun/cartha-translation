source:
  edition: WLC
  text: וְ/הָיָ֗ה אִם תִּשְׁמַע֮ אֶת כָּל אֲשֶׁ֣ר אֲצַוֶּ/ךָ֒ וְ/הָלַכְתָּ֣ בִ/דְרָכַ֗/י וְ/עָשִׂ֨יתָ הַ/יָּשָׁ֤ר בְּ/עֵינַ/י֙ לִ/שְׁמ֤וֹר חֻקּוֹתַ/י֙ וּ/מִצְוֺתַ֔/י כַּ/אֲשֶׁ֥ר עָשָׂ֖ה דָּוִ֣ד עַבְדִּ֑/י וְ/הָיִ֣יתִי עִמָּ֗/ךְ וּ/בָנִ֨יתִי לְ/ךָ֤ בַֽיִת נֶאֱמָן֙ כַּ/אֲשֶׁ֣ר בָּנִ֣יתִי לְ/דָוִ֔ד וְ/נָתַתִּ֥י לְ/ךָ֖ אֶת יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/038.yaml
  text: And it shall be[a], if you listen to all that I command you, and walk in my ways, and do what is right in my eyes by keeping my statutes and my commandments, as David my servant did, then I will be with you and build for you a faithful house, just as I built for David, and I will give Israel to you.
translation:
  language: de
  text: Und wenn du auf alles hörst, was ich dir gebiete, auf meinen Wegen gehst und tust, was in meinen Augen richtig ist, indem du meine Ordnungen und Gebote hältst, wie es mein Diener David getan hat, dann werde ich mit dir sein und dir ein beständiges Haus[a] bauen, wie ich es David gebaut habe, und ich werde dir Israel geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: ein dauerhaftes Königshaus, eine beständige Dynastie. Auch möglich: „ein zuverlässiges“ oder „fest gegründetes Haus“.'
    reason: Erläutert die dynastische Bedeutung von „Haus“ und die Bedeutungsbreite von נֶאֱמָן.
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: auf … hörst
  rationale: Bewahrt den Grundsinn „hören“ und lässt den Zusammenhang zugleich den mitgemeinten Gehorsam ausdrücken.
- source_word: וְהָלַכְתָּ בִדְרָכַי
  choice: auf meinen Wegen gehst
  rationale: Erhält die natürliche biblische Wegmetapher für eine Lebensführung nach Gottes Willen.
- source_word: הַיָּשָׁר בְּעֵינַי
  choice: was in meinen Augen richtig ist
  rationale: Gibt die hebräische Bewertungsformel verständlich und idiomatisch wieder.
- source_word: חֻקּוֹתַי וּמִצְוֺתַי
  choice: meine Ordnungen und Gebote
  rationale: Unterscheidet die beiden Rechtstermini, ohne im Deutschen einen unnötig altertümlichen Ton anzuschlagen.
- source_word: עַבְדִּי
  choice: mein Diener
  rationale: Im königlich-bundestheologischen Zusammenhang ist dies eine ehrenvolle Bezeichnung für David.
- source_word: בַיִת נֶאֱמָן
  choice: ein beständiges Haus
  rationale: „Haus“ wahrt die biblische Metapher; „beständig“ bringt die Festigkeit und Dauerhaftigkeit von נֶאֱמָן im dynastischen Zusammenhang zum Ausdruck.
- source_word: וְנָתַתִּי לְךָ אֶת יִשְׂרָאֵל
  choice: ich werde dir Israel geben
  rationale: Entspricht unmittelbar der hebräischen Konstruktion und erhält Israel als Gegenstand der göttlichen Gewährung.
theological_decisions:
- issue: Bedeutung von „Haus“ in der Verheißung
  choice: „Haus“ bleibt im Haupttext stehen und bezeichnet hier das dauerhafte Königshaus beziehungsweise die Dynastie.
  alternative: Ein buchstäbliches Gebäude oder unmittelbar „Dynastie“.
  rationale: Der Vergleich mit Gottes Handeln an David weist auf eine königliche Linie. Die Metapher bleibt erhalten und wird in der Fußnote erklärt.
- issue: Bedingtheit der Verheißung
  choice: Die Zusage wird ausdrücklich an Jerobeams Hören und Handeln geknüpft.
  alternative: Eine uneingeschränkte, von seinem Verhalten unabhängige Zusage.
  rationale: Die mit אִם eingeleitete Bedingung und die anschließenden Gehorsamsaussagen machen den konditionalen Charakter grammatisch deutlich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur und die zentralen Bundesmetaphern des Hebräischen bleiben erhalten, während die Bedingungsfolge im Deutschen klar lesbar ist.
