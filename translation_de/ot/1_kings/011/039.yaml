id: 1KI.11.39
reference: 1 Kings 11:39
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַֽ/אעַנֶּ֛ה אֶת זֶ֥רַע דָּוִ֖ד לְמַ֣עַן זֹ֑את אַ֖ךְ לֹ֥א כָל הַ/יָּמִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/039.yaml
  text: And I will afflict the offspring of David because of this[a], but not forever.
translation:
  language: de
  text: Und ich werde die Nachkommen Davids deswegen demütigen, aber nicht für alle Zeit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „nicht alle Tage“; sinngemäß: „nicht für immer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאעַנֶּה
  choice: werde … demütigen
  rationale: Das Piel von ענה bezeichnet hier ein Zufügen von Erniedrigung oder Bedrängnis. „Demütigen“ ist im Deutschen natürlich und wahrt den Zusammenhang des göttlichen Gerichts, ohne eine bestimmte Art des Leidens festzulegen.
- source_word: זֶרַע דָּוִד
  choice: die Nachkommen Davids
  rationale: זֶרַע ist kollektiv gebraucht. „Nachkommen“ gibt diesen Bezug im modernen Deutschen klar und würdig wieder; „Same Davids“ wäre formaler, aber heute missverständlich oder unnatürlich.
- source_word: לְמַעַן זֹאת
  choice: deswegen
  rationale: Die Wendung bezeichnet hier den Grund für das angekündigte Gericht und verweist auf das zuvor Genannte. „Deswegen“ ist knapp, idiomatisch und bedeutungsgerecht.
- source_word: אַךְ
  choice: aber
  rationale: אַךְ schränkt das vorangehende Gericht adversativ ein. „Aber“ bringt diesen Gegensatz im Deutschen unmittelbar zum Ausdruck.
- source_word: לֹא כָל הַיָּמִים
  choice: nicht für alle Zeit
  rationale: Wörtlich heißt die Wendung „nicht alle Tage“. „Nicht für alle Zeit“ bewahrt etwas von dieser Zeitvorstellung und drückt zugleich im natürlichen Deutschen aus, dass das Gericht nicht unbegrenzt andauert.
theological_decisions:
- issue: Dauer des Gerichts über Davids Nachkommenschaft
  choice: Das Gericht ist wirklich, aber zeitlich begrenzt.
  alternative: Die Wendung kann idiomatischer mit „nicht für immer“ wiedergegeben werden.
  rationale: Der hebräische Text begrenzt ausdrücklich die Dauer der Demütigung. Die Übersetzung erhält die Spannung zwischen Gericht und dessen Nicht-Endgültigkeit, ohne weitergehende Aussagen über die davidische Verheißung in den Vers hineinzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Nachkommen“ ist allgemein verständlich; „nicht für alle Zeit“ vermeidet die unnatürliche wörtliche Form „nicht alle Tage“, während die hebräische zeitliche Begrenzung in der Fußnote sichtbar bleibt.
