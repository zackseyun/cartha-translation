source:
  edition: WLC
  text: וַ/יְהִ֛י דְּבַר יְהוָ֥ה צְבָא֖וֹת אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/018.yaml
  text: 'And the word of Yahweh of hosts came to me[a], saying:'
translation:
  language: de
  text: 'Und das Wort Jahwes der Heerscharen erging an mich:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Und … erging
  rationale: Die narrative Einleitungsformel wird im Deutschen natürlich mit dem Verb des prophetischen Wortempfangs verbunden, statt wörtlich „Und es geschah“ wiederzugeben.
- source_word: דְּבַר
  choice: das Wort
  rationale: Die feste prophetische Wendung bezeichnet eine konkrete göttliche Mitteilung; „Wort“ bewahrt die geprägte Ausdrucksweise, ohne sie deutend zu „Botschaft“ auszuweiten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird in der im Deutschen üblichen Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: צְבָאוֹת
  choice: der Heerscharen
  rationale: Die Genitivwiedergabe erhält das Bild der Heere beziehungsweise himmlischen Scharen und vermeidet die interpretierende Ersetzung durch „Allmächtiger“.
- source_word: אֵלַי
  choice: an mich
  rationale: In Verbindung mit „das Wort erging“ ist „an mich“ die natürliche deutsche Bezeichnung des Empfängers.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Doppelpunkt erfüllt im Deutschen idiomatisch die Funktion der hebräischen Redeeinleitung und weist auf den folgenden Wortlaut hin.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen unmittelbar. Die Transliteration bewahrt den Eigennamen, statt ihn durch den traditionellen Ersatztitel wiederzugeben.
- issue: Wiedergabe des Titels יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  alternative: Jahwe, der Allmächtige
  rationale: Die formnahe Wiedergabe bewahrt die militärische beziehungsweise himmlische Bildwelt des Titels und legt seine theologische Bedeutung nicht auf „allmächtig“ fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die etablierte prophetische Formel „das Wort … erging an mich“ ist verständlich und vermeidet sowohl unnötige Altertümlichkeit als auch paraphrasierende Ausdeutung.
