  source_fidelity: 'Der Entwurf gibt die hebräische Einleitungsformel vollständig und sachgerecht wieder: וַיְהִי ist idiomatisch in „erging“ aufgenommen; דְבַר יְהוָה צְבָאוֹת entspricht „das Wort Jahwes der Heerscharen“; אֵלַי wird mit „an mich“ angemessen ausgedrückt. Der Doppelpunkt vertritt die einleitende Funktion von לֵאמֹר, deren Redeinhalt im folgenden Vers steht.'
