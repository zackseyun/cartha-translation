source:
  edition: WLC
  text: כִּ֣י כֹ֣ה אָמַר֮ יְהוָ֣ה צְבָאוֹת֒ כַּ/אֲשֶׁ֨ר זָמַמְ֜תִּי לְ/הָרַ֣ע לָ/כֶ֗ם בְּ/הַקְצִ֤יף אֲבֹֽתֵי/כֶם֙ אֹתִ֔/י אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת וְ/לֹ֖א נִחָֽמְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/014.yaml
  text: 'For thus says Yahweh of Armies: Just as I purposed to do harm to you when your fathers provoked me to wrath[a], says Yahweh of Armies, and I did not relent[c][b],'
translation:
  language: de
  text: 'Denn so spricht Jahwe der Heere: So wie ich plante, euch Unheil zuzufügen[b], als eure Väter mich zum Zorn reizten[a] – spricht Jahwe der Heere –, und ich nicht davon abließ[c],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eure Vorfahren“. Wörtlich steht im Hebräischen „eure Väter“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „euch Schaden zuzufügen“ oder „Unheil über euch zu bringen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „meinen Entschluss nicht änderte“; auch: „es mich nicht gereute“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der offenbarte Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel wie „der HERR“ ersetzt.
- source_word: צְבָאוֹת
  choice: der Heere
  rationale: Die Wiedergabe bewahrt den militärischen beziehungsweise umfassenden Sinn des hebräischen Titels und ist im heutigen Deutsch verständlicher als das traditionelle „der Heerscharen“.
- source_word: כִּי כֹה אָמַר
  choice: Denn so spricht
  rationale: Die Formulierung erhält den Zusammenhang begründenden Charakter von כִּי und den würdevollen Klang der prophetischen Botenformel.
- source_word: כַּאֲשֶׁר
  choice: So wie
  rationale: Die Wendung leitet den Vergleich zwischen dem früheren Gericht und der in Vers 15 folgenden Zusage ein; die offene Satzstruktur des Einzelverses bleibt erhalten.
- source_word: זָמַמְתִּי
  choice: ich plante
  rationale: Das Verb bezeichnet einen bewussten Vorsatz oder Plan; „plante“ ist gegenwärtiges, klares Deutsch und erhält die Willenskomponente.
- source_word: לְהָרַע לָכֶם
  choice: euch Unheil zuzufügen
  rationale: Im Kontext geht es um herbeigeführtes Unheil beziehungsweise Gericht, nicht darum, dass Gott moralisch Böses tut. Die Formulierung erhält dennoch die Härte der Aussage.
- source_word: בְּהַקְצִיף אֲבֹתֵיכֶם אֹתִי
  choice: als eure Väter mich zum Zorn reizten
  rationale: „Als“ gibt die zeitlich-umständliche Funktion der Präposition mit dem Infinitiv wieder; „zum Zorn reizten“ bewahrt den kausativen und intensiven Sinn des Verbs.
- source_word: וְלֹא נִחָמְתִּי
  choice: und ich nicht davon abließ
  rationale: Im Gerichtskontext bezeichnet נחם das Abstandnehmen von einem gefassten Vorhaben. Die Wiedergabe vermeidet die im Deutschen leicht moralisch missverständliche Aussage, Gott habe etwas nicht „bereut“.
theological_decisions:
- issue: Göttliches Gericht in לְהָרַע
  choice: euch Unheil zuzufügen
  alternative: euch Schaden zuzufügen / Böses über euch zu bringen
  rationale: „Unheil“ bezeichnet hier die von Gott verhängte Not, ohne die hebräische Härte abzuschwächen oder Gott moralisches Böses zuzuschreiben.
- issue: Anthropopathische Ausdrucksweise in וְלֹא נִחָמְתִּי
  choice: ich nicht davon abließ
  alternative: ich meinen Entschluss nicht änderte / es mich nicht gereute
  rationale: Die gewählte Fassung beschreibt Gottes Festhalten am angekündigten Gericht, ohne die echte Bedeutungsbreite von נחם dogmatisch auf eine Lehre über eine mögliche Veränderung Gottes festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischem Sprachrhythmus. Die durch den Vergleich mit Vers 15 bedingte offene Satzstruktur und das abschließende Komma werden bewusst bewahrt. Der eingeschobene Redeeinleitungssatz wird durch Gedankenstriche klar kenntlich gemacht.
