  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und die zentralen Aussagen des Hebräischen zuverlässig wieder: die prophetische Botenformel, den vorsätzlichen Charakter von זָמַמְתִּי, das gerichtliche Unheil von לְהָרַע לָכֶם, die Veranlassung durch die Väter und das Nicht-Nachlassen in וְלֹא נִחָמְתִּי. Das abschließende Komma bewahrt zutreffend den über Vers 14 hinausreichenden Vergleich.'
  naturalness: „Denn so spricht Jahwe der Heere“ und „So wie ich plante, euch Unheil zuzufügen“ sind würdiges, verständliches modernes Standarddeutsch. Der Einschub „– spricht Jahwe der Heere –“ bildet die hebräische Wiederaufnahme der Botenformel klar ab. „Ich nicht davon abließ“ ist in diesem Gerichtszusammenhang idiomatisch und eindeutig auf das zuvor genannte Vorhaben bezogen.
  terminology: „Jahwe“, „der Heere“, „Unheil“, „Väter“ und „zum Zorn reizten“ sind sachgerecht. „Unheil“ vermeidet zu Recht die irreführende Vorstellung moralischen Bösen, ohne die gerichtliche Schärfe abzuschwächen. Die Anmerkungen bieten sinnvolle lexikalische Alternativen, ohne eine theologische Deutung festzulegen.
