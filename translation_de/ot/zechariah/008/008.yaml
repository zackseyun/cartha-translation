id: ZEC.8.8
reference: Zechariah 8:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הֵבֵאתִ֣י אֹתָ֔/ם וְ/שָׁכְנ֖וּ בְּ/ת֣וֹךְ יְרוּשָׁלִָ֑ם וְ/הָיוּ לִ֣/י לְ/עָ֗ם וַֽ/אֲנִי֙ אֶהְיֶ֤ה לָ/הֶם֙ לֵֽ/אלֹהִ֔ים בֶּ/אֱמֶ֖ת וּ/בִ/צְדָקָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/008.yaml
  text: I will bring them[a], and they will dwell in the midst of Jerusalem; and they will be my people, and I will be their God[c][b], in truth and in righteousness.
translation:
  language: de
  text: Ich werde sie herbringen, und sie werden mitten in Jerusalem wohnen[a]. Sie werden mein Volk sein, und ich werde ihr Gott sein – in Wahrheit[b] und in Gerechtigkeit[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „im Innern Jerusalems“; auch möglich: „innerhalb Jerusalems“.'
    reason: lexical_alternative
  - marker: b
    text: „In Wahrheit“ kann hier auch „in Treue“ oder „treu“ bedeuten.
    reason: lexical_alternative
  - marker: c
    text: „Gerechtigkeit“ kann in diesem Zusammenhang auch „Recht“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתִי
  choice: Ich werde sie herbringen
  rationale: Der Hifil von בוא bedeutet hier „bringen“ bzw. „herbringen“. „Herbringen“ ist im Deutschen natürlich und gibt die Bewegung zum verheißenen Ort wieder, ohne das im unmittelbaren Wortlaut nicht ausdrücklich enthaltene „zurück“ einzufügen.
- source_word: וְשָׁכְנוּ
  choice: sie werden wohnen
  rationale: שׁכן bezeichnet dauerhaftes Wohnen oder Ansässigsein. „Wohnen“ ist gegenwärtiges Standarddeutsch und bewahrt den Siedlungsaspekt.
- source_word: בְּתוֹךְ יְרוּשָׁלִָם
  choice: mitten in Jerusalem
  rationale: בְּתוֹךְ hat eine deutlichere räumliche Bedeutung als ein bloßes „in“. „Mitten in Jerusalem“ bewahrt diese Nuance und klingt zugleich natürlich.
- source_word: וְהָיוּ לִי לְעָם
  choice: Sie werden mein Volk sein
  rationale: Die idiomatische Wiedergabe erhält die bekannte Bundesformel und ihre innerbiblischen Bezüge.
- source_word: וַאֲנִי אֶהְיֶה לָהֶם לֵאלֹהִים
  choice: und ich werde ihr Gott sein
  rationale: Diese natürliche deutsche Form bewahrt die wechselseitige Bundesformel, ohne sie erklärend auszuweiten.
- source_word: בֶּאֱמֶת
  choice: in Wahrheit
  rationale: אֱמֶת kann Wahrheit, Treue oder Verlässlichkeit bezeichnen. „In Wahrheit“ wahrt die substantivische Form und lässt die mögliche Bundesnuance der Treue offen.
- source_word: וּבִצְדָקָה
  choice: und in Gerechtigkeit
  rationale: צְדָקָה kann Gerechtigkeit oder Recht meinen. „Gerechtigkeit“ passt zum feierlichen Parallelismus und wahrt die breite ethisch-bundestheologische Bedeutung.
theological_decisions:
- issue: Bundesformel
  choice: „Sie werden mein Volk sein, und ich werde ihr Gott sein“
  alternative: „Sie werden mir zum Volk sein, und ich werde ihnen zum Gott sein“ oder eine erklärende relationale Umschreibung
  rationale: Die geläufige deutsche Bundesformel erhält die Beziehungsaussage und ihre intertextuellen Verbindungen, ohne zusätzliche Deutung einzutragen.
- issue: Bezug von בֶּאֱמֶת וּבִצְדָקָה
  choice: Die präpositionale Nominalfügung „in Wahrheit und in Gerechtigkeit“ wird nach der gesamten Bundesformel beibehalten.
  alternative: Eine eindeutige adverbiale Zuordnung nur zu Gottes Handeln, etwa „ich werde ihnen treu und gerecht Gott sein“
  rationale: Der genaue syntaktische und theologische Bezug bleibt im Hebräischen offen. Der Gedankenstrich bindet die Wendung an die Bundeszusage, ohne sie ausschließlich auf einen einzelnen Satzteil festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die vertraute Bundesformel bleibt erhalten; seltene oder altertümliche Ausdrücke werden vermieden. Der Gedankenstrich macht den abschließenden Ausdruck lesbar, ohne seinen im Hebräischen offenen Bezug abschließend festzulegen.
