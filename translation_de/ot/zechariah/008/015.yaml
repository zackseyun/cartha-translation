  verdict: revise
  source_fidelity: 'Der Vers nimmt den Kontrast zu V. 14 auf: Dem früheren Vorsatz zum Unheil steht Gottes erneuter Vorsatz zum Guten gegenüber. Die Wiedergabe von שַׁבְתִּי זָמַמְתִּי als „wieder beschlossen“ bringt diese Verbindung idiomatisch und ohne unnötige räumliche Deutung von שׁוּב zum Ausdruck. „Gutes zu tun“ und der pluralische negative Imperativ entsprechen dem Hebräischen.'
  naturalness: „So habe ich mir nun in diesen Tagen wieder vorgenommen“ ist durch die Häufung von „nun“, „in diesen Tagen“ und „wieder“ schwerfällig. „So habe ich in diesen Tagen wieder beschlossen“ ist modernes, würdiges Standarddeutsch und führt die Satzglieder klarer.
  terminology: „Jerusalem“ und „Haus Juda“ sind zutreffend; „Haus Juda“ bewahrt die kollektive biblische Bezeichnung. „Fürchtet euch nicht!“ ist als unmittelbare Wiedergabe von אַל־תִּירָאוּ angemessen.
