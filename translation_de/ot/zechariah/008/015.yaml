base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/015.yaml
  text: So now I have returned and purposed in these days to do good to Jerusalem and to the house of Judah. Do not fear.
translation:
  language: de
  text: So habe ich in diesen Tagen wieder beschlossen, Jerusalem und dem Haus Juda Gutes zu tun. Fürchtet euch nicht!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֵּן
  choice: So
  rationale: Stellt die entsprechende Gegenüberstellung zum zuvor beschriebenen Unheil her und bewahrt den folgernden Charakter.
- source_word: שַׁבְתִּי זָמַמְתִּי
  choice: habe ich mir nun wieder vorgenommen
  rationale: שַׁבְתִּי bezeichnet hier eine erneute bzw. gewandelte Ausrichtung, während זָמַמְתִּי einen festen Vorsatz ausdrückt. Die deutsche Verbindung vermeidet das missverständliche räumliche »zurückgekehrt«.
- source_word: לְהֵיטִיב
  choice: Gutes zu tun
  rationale: Gibt den kausativen Sinn des Hifil-Infinitivs natürlich und unmittelbar wieder.
- source_word: בֵּית יְהוּדָה
  choice: Haus Juda
  rationale: Bewahrt die traditionelle kollektive Bezeichnung für das Volk bzw. Gemeinwesen Judas.
- source_word: אַל תִּירָאוּ
  choice: Fürchtet euch nicht!
  rationale: Gibt den verneinten Imperativ in der deutschen Pluralform wieder.
theological_decisions:
- issue: Gottes erneuter Vorsatz
  choice: wieder vorgenommen
  alternative: bin ich zurückgekehrt und habe beschlossen
  rationale: Der Text stellt Gottes früherem Unheilsvorsatz seinen nun bekräftigten Vorsatz zum Guten gegenüber. Die Formulierung wahrt den Umschwung, ohne eine räumliche Rückkehr Gottes nahezulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch; klare Satzführung. »Haus Juda« bleibt als biblische Kollektivbezeichnung erhalten.
