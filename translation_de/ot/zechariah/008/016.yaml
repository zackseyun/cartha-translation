base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/016.yaml
  text: 'These are the things that you must do: speak truth to one another[c][b][a]; judge with truth and a judgment of peace in your gates.'
translation:
  language: de
  text: 'Das sind die Dinge, die ihr tun sollt: Sagt einander die Wahrheit[a]; fällt in euren Toren Urteile, die wahr sind und dem Frieden dienen[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Sagt die Wahrheit, jeder zu seinem Nächsten.« Das Hebräische verwendet einen repräsentativen maskulinen Singular.'
    reason: lexical_alternative
  - marker: b
    text: 'Die Stadttore waren im alten Israel übliche Orte für öffentliche Verhandlungen und Gerichtsentscheidungen. Auch möglich: »Fällt in euren Toren wahre und friedensfördernde Urteile.«'
    reason: cultural_note_and_alternative_reading
lexical_decisions:
- source_word: אֵלֶּה הַדְּבָרִים
  choice: Das sind die Dinge
  rationale: דְּבָרִים kann »Worte«, »Dinge« oder »Angelegenheiten« bedeuten. Hier leitet es konkrete Handlungsanweisungen ein; »Dinge« gibt diesen Sinn natürlich wieder.
- source_word: אֲשֶׁר תַּעֲשׂוּ
  choice: die ihr tun sollt
  rationale: Das Imperfekt hat im Zusammenhang auffordernde beziehungsweise verpflichtende Kraft. »sollt« ist dafür im heutigen Deutsch klar und angemessen.
- source_word: דַּבְּרוּ אֱמֶת
  choice: Redet die Wahrheit
  rationale: Die Formulierung bewahrt den direkten Imperativ und gibt אֱמֶת idiomatisch als »die Wahrheit« wieder.
- source_word: אִישׁ אֶת־רֵעֵהוּ
  choice: miteinander
  rationale: Die hebräische Wendung lautet wörtlich »jeder mit seinem Nächsten« und bezeichnet hier die wechselseitige Verpflichtung innerhalb der Gemeinschaft. »miteinander« ist natürlich und schließt den repräsentativen Singular sachgerecht auf.
- source_word: אֱמֶת וּמִשְׁפַּט שָׁלוֹם
  choice: Urteile, die wahr sind und dem Frieden dienen
  rationale: Die knappe hebräische Nominalfolge verbindet Wahrheit mit einem Rechtsspruch, der auf שָׁלוֹם ausgerichtet ist. Die Relativsatzfassung ist im Deutschen verständlich, ohne die Beziehung eindeutig als bloß »friedlich« oder ausschließlich »friedenstiftend« festzulegen.
- source_word: שִׁפְטוּ
  choice: fällt ... Urteile
  rationale: Im gerichtlichen Zusammenhang gibt die feste deutsche Wendung »Urteile fällen« den Imperativ präziser und natürlicher wieder als das isolierte Verb »richten«.
- source_word: בְּשַׁעֲרֵיכֶם
  choice: in euren Toren
  rationale: Die konkrete Ortsangabe und das antike Bild bleiben im Haupttext erhalten; die rechtliche Funktion der Stadttore wird in einer Fußnote erläutert.
theological_decisions:
- issue: Maskuliner repräsentativer Singular in der ethischen Weisung
  choice: miteinander
  alternative: jeder mit seinem Nächsten
  rationale: אִישׁ ... רֵעֵהוּ ist formal maskulin und singularisch, hat hier jedoch wechselseitige repräsentative Kraft. »miteinander« gibt den Umfang der Anweisung in natürlichem modernem Deutsch wieder; die formnähere Alternative steht in der Fußnote.
- issue: Bedeutung von שָׁלוֹם in der gerichtlichen Wendung
  choice: Urteile, die ... dem Frieden dienen
  alternative: wahre und friedensfördernde Urteile
  rationale: שָׁלוֹם umfasst Frieden, Wohlergehen und unversehrte Gemeinschaft. Die gewählte Fassung erhält die Verbindung von wahrer Rechtsprechung und Frieden, ohne eine konfessionelle oder weitergehende dogmatische Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Direkte Imperative und das Bild der Tore bleiben erhalten; schwer verständliche hebräische Nominalfügung wird maßvoll aufgelöst.
