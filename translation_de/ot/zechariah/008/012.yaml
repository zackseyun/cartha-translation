  text: כִּֽי זֶ֣רַע הַ/שָּׁל֗וֹם הַ/גֶּ֜פֶן תִּתֵּ֤ן פִּרְיָ/הּ֙ וְ/הָ/אָ֨רֶץ֙ תִּתֵּ֣ן אֶת יְבוּלָ֔/הּ וְ/הַ/שָּׁמַ֖יִם יִתְּנ֣וּ טַלָּ֑/ם וְ/הִנְחַלְתִּ֗י אֶת שְׁאֵרִ֛ית הָ/עָ֥ם הַ/זֶּ֖ה אֶת כָּל אֵֽלֶּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/012.yaml
  text: 'For there will be the seed of peace: the vine will give its fruit[a], the land will give its produce, and the heavens will give their dew; and I will cause the remnant of this people to inherit all these things.'
translation:
  language: de
  text: 'Denn es wird die Saat des Friedens geben: Der Weinstock wird seine Frucht geben, das Land wird seinen Ertrag geben, und der Himmel wird seinen Tau geben. Und ich werde den Rest dieses Volkes all dies in Besitz nehmen lassen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Wendung „Saat des Friedens“ ist sehr knapp und kann auch „gedeihliche Saat“, „friedliches Säen“ oder „Saat des Wohlergehens“ bedeuten. Sie kann das folgende Bild erneuerten landwirtschaftlichen Segens zusammenfassen.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶרַע הַשָּׁלוֹם
  choice: Saat des Friedens
  rationale: Die knappe hebräische Wendung bleibt als landwirtschaftliches Bild erhalten. „Saat“ kann sowohl das Saatgut als auch das Säen bezeichnen; „Frieden“ bewahrt die Bedeutungsbreite von שָׁלוֹם einschließlich Wohlergehen und Gedeihen.
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise Erläuterung der vorausgehenden Verheißung ein.
- source_word: הַגֶּפֶן תִּתֵּן פִּרְיָהּ
  choice: Der Weinstock wird seine Frucht geben
  rationale: Gibt die konkrete landwirtschaftliche Zusage und das wiederholte Verb נתן eng und zugleich verständlich wieder.
- source_word: יְבוּל
  choice: Ertrag
  rationale: Bezeichnet das, was das Land hervorbringt; „Ertrag“ ist im Deutschen natürlich und hinreichend weit.
- source_word: הַשָּׁמַיִם יִתְּנוּ טַלָּם
  choice: der Himmel wird seinen Tau geben
  rationale: Im Deutschen wird „Himmel“ in dieser meteorologischen Bedeutung idiomatisch im Singular gebraucht; „geben“ erhält die Wiederholung von נתן.
- source_word: וְהִנְחַלְתִּי
  choice: ich werde … erben lassen
  rationale: Bewahrt die kausative Bedeutung des Hifil von נחל und zugleich den Anklang an Erbe und geschenkten Besitz.
- source_word: שְׁאֵרִית הָעָם הַזֶּה
  choice: den Rest dieses Volkes
  rationale: „Rest“ ist der sachlich und prophetisch passende Ausdruck, ohne die Referenz auf bloße Überlebende zu verengen.
- source_word: אֶת כָּל אֵלֶּה
  choice: all dies
  rationale: Bezieht sich idiomatisch auf die zuvor genannten Segnungen insgesamt.
theological_decisions:
- issue: Bedeutungsbreite von שָׁלוֹם im Zusammenhang landwirtschaftlichen Segens
  choice: „Frieden“ in der Wendung „Saat des Friedens“
  alternative: „gedeihliche Saat“, „Saat des Wohlergehens“ oder „friedliches Säen“
  rationale: שָׁלוֹם umfasst Frieden, Wohlergehen, Ganzheit und Gedeihen. Die bildhafte, mehrdeutige Formulierung bleibt erhalten, statt sie auf wirtschaftlichen Wohlstand zu reduzieren.
- issue: Erbsprache in וְהִנְחַלְתִּי
  choice: „ich werde … erben lassen“
  alternative: „ich werde … all dies besitzen lassen“ oder „ich werde … all dies geben“
  rationale: Die Wiedergabe erhält sowohl die kausative Verbform als auch den möglichen Bundes- und Erbklang, ohne diesen weiter auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreifache Wiederholung von „geben“ bildet die Struktur des Hebräischen ab. Der Doppelpunkt bewahrt die wahrscheinlich zusammenfassende Funktion von „Saat des Friedens“; die Mehrdeutigkeit wird in der Fußnote offengelegt.
