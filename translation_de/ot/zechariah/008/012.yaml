- from: 'Denn es wird Saat des Friedens geben: Der Weinstock wird seine Frucht geben, das Land wird seinen Ertrag geben, und der Himmel wird seinen Tau geben. Und ich werde den Rest dieses Volkes all dies erben lassen.[a]'
  to: 'Denn es wird die Saat des Friedens geben: Der Weinstock wird seine Frucht geben, das Land wird seinen Ertrag geben, und der Himmel wird seinen Tau geben. Und ich werde den Rest dieses Volkes all dies in Besitz nehmen lassen.[a]'
  rationale: Die Revision beseitigt die im Deutschen naheliegende Fehlbedeutung von „erben lassen“, wahrt dabei den kausativen Charakter des hebräischen Verbs und erhält die Anspielung auf zugewiesenen Besitz. Der Artikel bei „die Saat des Friedens“ folgt enger der hebräischen Form. Die Fußnote stellt die dokumentierten Alternativen neutral dar und bewahrt die Mehrdeutigkeit.
