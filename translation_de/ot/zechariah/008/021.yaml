- from: 'Und die Bewohner einer Stadt werden zur nächsten ziehen und sagen: »Kommt, lasst uns unbedingt gehen, um die Gunst des HERRN zu erflehen und den HERRN der Heerscharen zu suchen!« – »Auch ich gehe mit!«'
  to: 'Und die Bewohner einer Stadt werden zu einer anderen gehen und sagen: »Lasst uns doch gehen, um die Gunst des HERRN zu erflehen und den HERRN der Heerscharen zu suchen!« – »Auch ich will gehen!«'
  rationale: Die Revision beseitigt die unbegründete Einschränkung auf die „nächste“ Stadt und gibt den abschließenden Kohortativ als entschlossene Selbstverpflichtung wieder. »Doch« bewahrt den auffordernden Nachdruck der Verbindung von Kohortativ und Infinitivus absolutus in idiomatischem modernem Deutsch, ohne eine zeitliche Nuance wie „sofort“ hinzuzufügen.
  reviewer_model: gpt-5.6-terra
