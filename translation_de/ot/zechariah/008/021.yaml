  text: וְֽ/הָלְכ֡וּ יֹשְׁבֵי֩ אַחַ֨ת אֶל אַחַ֜ת לֵ/אמֹ֗ר נֵלְכָ֤ה הָלוֹךְ֙ לְ/חַלּוֹת֙ אֶת פְּנֵ֣י יְהוָ֔ה וּ/לְ/בַקֵּ֖שׁ אֶת יְהוָ֣ה צְבָא֑וֹת אֵלְכָ֖ה גַּם אָֽנִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/021.yaml
  text: And the inhabitants of one city will go to another, saying, ‘Let us surely go to entreat the favor of the LORD and to seek the LORD of hosts.’ ‘I myself am going too.’
translation:
  language: de
  text: 'Und die Bewohner einer Stadt werden zu einer anderen gehen und sagen: »Lasst uns doch gehen, um die Gunst des HERRN zu erflehen und den HERRN der Heerscharen zu suchen!« – »Auch ich will gehen!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֹשְׁבֵי אַחַת אֶל אַחַת
  choice: die Bewohner einer Stadt … zur nächsten
  rationale: Das feminine Zahlwort setzt im Zusammenhang »Stadt« voraus. »Zur nächsten« gibt die Bewegung von einer Stadt zur anderen natürlich wieder.
- source_word: נֵלְכָה הָלוֹךְ
  choice: Kommt, lasst uns unbedingt gehen
  rationale: Der Kohortativ mit folgendem Infinitivus absolutus verstärkt die Aufforderung. »Unbedingt« bewahrt diesen Nachdruck; »Kommt« macht die gemeinsame Aufforderung im Deutschen idiomatisch.
- source_word: לְחַלּוֹת אֶת־פְּנֵי יְהוָה
  choice: um die Gunst des HERRN zu erflehen
  rationale: Die Wendung bezeichnet das demütige Bitten um wohlwollende Zuwendung; eine wörtliche Wiedergabe mit »Angesicht« wäre im heutigen Deutsch missverständlich.
- source_word: יְהוָה צְבָאוֹת
  choice: der HERR der Heerscharen
  rationale: Gibt den Gottesnamen nach deutscher Bibelkonvention als HERR und צְבָאוֹת formal als »Heerscharen« wieder.
- source_word: אֵלְכָה גַּם־אָנִי
  choice: Auch ich gehe mit!
  rationale: Der Kohortativ drückt persönliche Entschlossenheit aus; »gehe mit« entspricht in diesem dialogischen Zusammenhang natürlichem Deutsch und erhält die Betonung von »auch ich«.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: HERR
  alternative: JHWH / Jahwe
  rationale: Die traditionelle Kennzeichnung durch Kapitälchen wird in modernem deutschem Bibelstil beibehalten, ohne eine unsichere Aussprache festzulegen.
- issue: Bedeutung von צְבָאוֹת
  choice: Heerscharen
  alternative: Mächte
  rationale: »Heerscharen« wahrt die konkrete und zugleich mehrdeutige Bildsprache, ohne sie auf himmlische oder irdische Heere festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter, lebendiger Rede. Der Nachdruck der hebräischen Verbfügung und die entschlossene persönliche Antwort am Versende bleiben erhalten.
