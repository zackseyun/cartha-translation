source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת כִּ֣י יִפָּלֵ֗א בְּ/עֵינֵי֙ שְׁאֵרִית֙ הָ/עָ֣ם הַ/זֶּ֔ה בַּ/יָּמִ֖ים הָ/הֵ֑ם גַּם בְּ/עֵינַ/י֙ יִפָּלֵ֔א נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/006.yaml
  text: 'Thus says Yahweh of hosts: If it is marvelous in the eyes of the remnant of this people in those days[a], should it also be marvelous in my eyes? declares Yahweh of hosts.'
translation:
  language: de
  text: 'So spricht Jahwe der Heerscharen: Wenn es dem Rest dieses Volkes in jenen Tagen unmöglich erscheint, sollte es dann auch mir unmöglich erscheinen? – Ausspruch Jahwes der Heerscharen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Bewahrt die feste prophetische Botenformel in würdigem, geläufigem Deutsch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: צְבָאוֹת
  choice: der Heerscharen
  rationale: Die etablierte deutsche Wiedergabe lässt die umfassende Bedeutung des Titels offen und verengt ihn nicht auf menschliche Armeen.
- source_word: כִּי
  choice: Wenn
  rationale: Leitet hier passend den Vordersatz ein, auf den die rhetorische Gegenfrage folgt; eine kausale oder konzessive Deutung bleibt syntaktisch möglich, ist im Zusammenhang aber weniger naheliegend.
- source_word: יִפָּלֵא
  choice: wunderbar ist
  rationale: Das Nifal von פלא kann etwas Außergewöhnliches, Wunderbares oder die menschliche Fähigkeit Übersteigendes bezeichnen. Die knappe Wiedergabe wahrt diese Bedeutungsbreite, ohne ausdrücklich „zu schwierig“ oder „unmöglich“ festzulegen.
- source_word: בְּעֵינֵי / בְּעֵינַי
  choice: in den Augen / in meinen Augen
  rationale: Erhält das hebräische Bild und die genaue Parallelität zwischen menschlicher und göttlicher Perspektive.
- source_word: שְׁאֵרִית הָעָם הַזֶּה
  choice: der Rest dieses Volkes
  rationale: „Rest“ ist im prophetischen Sprachgebrauch verständlich und gibt das Kollektiv ohne zusätzliche Deutung wieder.
- source_word: בַּיָּמִים הָהֵם
  choice: in jenen Tagen
  rationale: Bewahrt die formelhafte zeitliche Wendung und ihren Wiederherstellungsbezug.
- source_word: גַּם
  choice: auch
  rationale: Markiert den Vergleich zwischen der Sicht des Volkes und Jahwes Sicht.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: Ausspruch Jahwes der Heerscharen
  rationale: Gibt die feierliche prophetische Bekräftigungsformel knapp und quellenah wieder.
theological_decisions:
- issue: Kraft der rhetorischen Frage im Blick auf Gottes Fähigkeit
  choice: Die zweite Vershälfte wird als rhetorische Frage mit erwarteter Verneinung wiedergegeben.
  alternative: „Auch in meinen Augen wird es wunderbar sein“ als Feststellung.
  rationale: Die Wiederholung von יִפָּלֵא und der Kontrast der Perspektiven zielen darauf, menschliches Staunen beziehungsweise menschlich empfundene Unmöglichkeit der göttlichen Sicht gegenüberzustellen. Die Frageform wahrt diesen Kontrast, ohne eine Unfähigkeit Gottes auszusagen.
- issue: Bedeutung von יִפָּלֵא
  choice: „wunderbar“ im Haupttext, mit Hinweis auf „zu schwierig“ beziehungsweise „unmöglich“ in der Fußnote.
  alternative: Im Haupttext eindeutig „zu schwierig“ oder „unmöglich“.
  rationale: Das Verb trägt hier sowohl den Gedanken des Außergewöhnlichen als auch des die menschlichen Möglichkeiten Übersteigenden. Die Übersetzung soll diese echte lexikalische Spannung nicht vorschnell auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischem Sprachrhythmus. „Jahwe der Heerscharen“ und „Ausspruch“ bewahren die feierliche Formel; Satzbau und Wortwahl bleiben für heutige Leser verständlich.
