source:
  edition: WLC
  text: וְ/עַתָּ֗ה לֹ֣א כַ/יָּמִ֤ים הָ/רִֽאשֹׁנִים֙ אֲנִ֔י לִ/שְׁאֵרִ֖ית הָ/עָ֣ם הַ/זֶּ֑ה נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/011.yaml
  text: But now I will not be to the remnant of this people as in the former days[b][a], declares Yahweh of Armies.
translation:
  language: de
  text: Doch jetzt werde ich mit dem Rest dieses Volkes nicht so verfahren wie in den früheren Tagen[a] – Spruch des HERRN der Heere.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Hebräische ist nach »ich« elliptisch; das genaue Prädikat bleibt unausgesprochen. Wörtlich etwa: »Doch jetzt: nicht wie in den früheren Tagen ich für den Rest dieses Volkes.«'
    reason: alternative_reading
  - marker: b
    text: 'Traditionell: »der HERR der Heerscharen«; auch: »der HERR Zebaoth«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Doch jetzt
  rationale: Die Wendung markiert im Zusammenhang einen Gegensatz zu den zuvor beschriebenen Zeiten der Not. „Doch jetzt“ gibt diese adversative Funktion natürlich wieder.
- source_word: כַיָּמִים הָרִאשֹׁנִים
  choice: wie in den früheren Tagen
  rationale: Das Präfix כ bezeichnet den Vergleich; „in den früheren Tagen“ ist im Deutschen idiomatisch und bewahrt den zeitlichen Kontrast.
- source_word: לִשְׁאֵרִית הָעָם הַזֶּה
  choice: für den Rest dieses Volkes
  rationale: „Rest“ erhält den wichtigen prophetischen Begriff שְׁאֵרִית, während „dieses Volkes“ den singularischen Kollektivbegriff עָם wiedergibt. „Für“ ist bei ל in Verbindung mit dem elliptisch vorausgesetzten Sein im Deutschen verständlich.
- source_word: נְאֻם
  choice: Ausspruch
  rationale: Das Substantiv gehört zu einer feierlichen prophetischen Botenformel. „Ausspruch“ wahrt deren nominalen und autoritativen Charakter.
- source_word: יְהוָה צְבָאוֹת
  choice: der HERR der Heere
  rationale: Der Gottesname wird nach etablierter deutscher Bibelkonvention mit „der HERR“ wiedergegeben. „Heere“ übersetzt צְבָאוֹת transparent und bewahrt dessen militärische beziehungsweise kosmische Bildwelt.
theological_decisions:
- issue: Fehlendes ausdrückliches Prädikat nach אֲנִי
  choice: „werde ich … nicht so sein“
  alternative: „werde ich mit dem Rest dieses Volkes nicht so verfahren“
  rationale: Der hebräische Satz ist elliptisch und nennt nicht ausdrücklich, worin das veränderte Verhältnis besteht. „Nicht so sein“ bewahrt diese Offenheit besser als „verfahren“, während „so“ den durch כ angezeigten Vergleich im Deutschen verständlich macht.
- issue: Zeitliche Einordnung der elliptischen Aussage
  choice: Futur „werde … sein“
  alternative: Präsens „bin … nicht“
  rationale: „Jetzt“ eröffnet die neue göttliche Haltung, und der folgende Zusammenhang entfaltet ihre künftigen Auswirkungen. Das Futur ist daher kontextuell angemessen, ohne die Art des Handelns näher festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bewusst knappe Formulierung „für den Rest … nicht so sein“ lässt die Ellipse und damit die Offenheit des hebräischen Satzes bestehen; die Fußnote bietet eine idiomatischere, aber stärker deutende Alternative.
