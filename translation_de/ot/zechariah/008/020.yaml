source:
  edition: WLC
  text: כֹּ֥ה אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת עֹ֚ד אֲשֶׁ֣ר יָבֹ֣אוּ עַמִּ֔ים וְ/יֹשְׁבֵ֖י עָרִ֥ים רַבּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/020.yaml
  text: 'Thus says Yahweh of hosts: Yet peoples shall come[a], and the inhabitants of many cities,'
translation:
  language: de
  text: 'So spricht Jahwe, der Herr der Heerscharen: Es werden noch Völker[a] und die Bewohner vieler Städte kommen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Nationen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die feste prophetische Botenformel wird im Deutschen idiomatisch und würdevoll im Präsens wiedergegeben.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe, der Herr der Heerscharen
  rationale: „Jahwe“ bewahrt den Gottesnamen; „Herr der Heerscharen“ gibt den etablierten göttlichen Titel im natürlichen Deutschen wieder, ohne die Heerscharen auf irdische Armeen einzuengen.
- source_word: עֹד אֲשֶׁר יָבֹאוּ
  choice: Es werden noch … kommen
  rationale: Die Konstruktion bezeichnet ein weiteres, künftig eintretendes Geschehen; „noch“ wahrt den Fortsetzungscharakter, während das Futur im Deutschen natürlich klingt.
- source_word: עַמִּים
  choice: Völker
  rationale: Der Plural bezeichnet mehrere Volksgruppen; „Völker“ ist im Deutschen die natürliche und kontextgerechte Entsprechung.
- source_word: וְיֹשְׁבֵי
  choice: und die Bewohner
  rationale: Das substantivierte Partizip im Status constructus wird knapp und idiomatisch mit „die Bewohner“ wiedergegeben.
- source_word: עָרִים רַבּוֹת
  choice: vieler Städte
  rationale: רַבּוֹת bezeichnet hier am natürlichsten eine große Anzahl; der deutsche Genitiv schließt sich flüssig an „Bewohner“ an.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der persönliche Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen bloßen Titel ersetzt.
- issue: Wiedergabe des Titels צְבָאוֹת
  choice: der Herr der Heerscharen
  alternative: der Heerscharen
  rationale: Im Deutschen ist „Jahwe, der Herr der Heerscharen“ verständlicher und idiomatischer als „Jahwe der Heerscharen“; zugleich bleibt die traditionelle Weite des Titels gewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erkennbarer prophetischer Formel. Der Satz bleibt wie im hebräischen Kontext syntaktisch auf die Fortsetzung im nächsten Vers ausgerichtet.
