source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת קִנֵּ֥אתִי לְ/צִיּ֖וֹן קִנְאָ֣ה גְדוֹלָ֑ה וְ/חֵמָ֥ה גְדוֹלָ֖ה קִנֵּ֥אתִי לָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/002.yaml
  text: 'Thus says Yahweh of hosts: I am jealous for Zion with great jealousy[b][a], and with great wrath I am jealous for her.'
translation:
  language: de
  text: 'So spricht Jahwe der Heerscharen[a]: Mit großem Eifer eifere ich für Zion[b], und mit großem Zorn eifere ich für sie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Jahwe« gibt den Gottesnamen JHWH wieder.
    reason: alternative_reading
  - marker: b
    text: 'Auch: »Mit großer Eifersucht eifere ich für Zion.« Das Hebräische verwendet für »eifere« und »Eifer« denselben Wortstamm und betont so Jahwes leidenschaftlichen, ausschließlichen Anspruch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel wie »der HERR« ersetzt.
- source_word: צְבָאוֹת
  choice: der Heerscharen
  rationale: Die traditionelle, semantisch weite Wiedergabe lässt offen, ob himmlische oder irdische Heere beziehungsweise beide gemeint sind.
- source_word: קִנֵּאתִי ... קִנְאָה גְדוֹלָה
  choice: Mit großem Eifer eifere ich
  rationale: Die Verbindung von Verb und stammverwandtem Substantiv wird im Deutschen nachgebildet. »Eifern« ist hier natürlicher als »eifersüchtig sein für«, ohne die mögliche Bedeutung leidenschaftlicher, ausschließlicher Eifersucht auszublenden.
- source_word: לְצִיּוֹן
  choice: für Zion
  rationale: Die Präposition bezeichnet die Ausrichtung von Jahwes leidenschaftlichem Eifer auf Zion.
- source_word: וְחֵמָה גְדוֹלָה
  choice: und mit großem Zorn
  rationale: חֵמָה bezeichnet heftigen, glühenden Zorn; »großer Zorn« bewahrt Intensität und würdevollen Gegenwartsstil.
- source_word: לָהּ
  choice: für sie
  rationale: Das feminine Pronomen bezieht sich auf Zion und bewahrt dessen Personifizierung.
theological_decisions:
- issue: Jahwes Eifer beziehungsweise Eifersucht
  choice: Im Haupttext steht »Eifer/eifere«; die mögliche Wiedergabe als »Eifersucht/eifersüchtig« wird in einer Fußnote ausdrücklich bewahrt.
  alternative: Mit großer Eifersucht bin ich für Zion erfüllt.
  rationale: Der hebräische Stamm קנא umfasst leidenschaftlichen Eifer und Eifersucht. Die gewählte Formulierung ist idiomatisches Deutsch, während die Fußnote die bundestheologische Spannung eines ausschließlichen Anspruchs sichtbar hält, statt sie aufzulösen.
- issue: Bezug des großen Zorns
  choice: Der Zorn steht parallel zu Jahwes Eifer für Zion, ohne sein Ziel näher zu bestimmen.
  alternative: Aus großem Zorn über ihre Feinde eifere ich für sie.
  rationale: Der hebräische Text nennt nicht ausdrücklich, gegen wen sich der Zorn richtet. Eine Ergänzung wie »über ihre Feinde« wäre interpretierend.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung »Eifer eifere« ist bewusst markant und bildet die hebräische Intensivierung durch Verb und stammverwandtes Substantiv nach. »Heerscharen« bleibt als gehobener, etablierter Ausdruck erhalten, weil »Heere« den umfassenden Sinn stärker militärisch verengen könnte.
