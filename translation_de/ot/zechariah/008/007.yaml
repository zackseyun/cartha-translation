base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/007.yaml
  text: 'Thus says Yahweh of hosts: Behold[b][a], I will save my people from the land of the east and from the land of the setting of the sun.'
translation:
  language: de
  text: 'So spricht Jahwe der Heerscharen: Siehe, ich werde mein Volk aus dem Land des Ostens und aus dem Land des Sonnenuntergangs retten.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Siehe, ich rette mein Volk«. Das hebräische Partizip kann in prophetischer Rede eine unmittelbar bevorstehende oder gewisse zukünftige Handlung ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »aus dem Land des Ostens und aus dem Land des Sonnenuntergangs«; die Verbindung von Osten und Westen bezeichnet umfassend weit voneinander entfernte Gebiete.'
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die feste prophetische Botenformel wird in natürlichem, zugleich feierlichem Deutsch wiedergegeben.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Der Gottesname bleibt als »Jahwe« erkennbar; »der Heerscharen« bewahrt die traditionelle Weite des Titels, ohne ihn auf irdische Armeen zu verengen.
- source_word: הִנְנִי
  choice: Siehe
  rationale: Das Signalwort hebt Gottes unmittelbar bevorstehendes und gewisses Handeln in einem würdigen prophetischen Register hervor.
- source_word: מוֹשִׁיעַ
  choice: ich rette
  rationale: Das Partizip bezeichnet hier Gottes als unmittelbar und gewiss angekündigtes Rettungshandeln. Das deutsche Präsens bewahrt diese Anschaulichkeit; die futurische Deutung bleibt in der Fußnote sichtbar.
- source_word: עַמִּי
  choice: mein Volk
  rationale: Direkte und unveränderte Wiedergabe der Bundesbezeichnung.
- source_word: מֵאֶרֶץ מִזְרָח וּמֵאֶרֶץ מְבוֹא הַשָּׁמֶשׁ
  choice: aus dem Land im Osten und aus dem Land im Westen
  rationale: Die Himmelsrichtungen werden in verständlichem modernem Deutsch wiedergegeben. Das poetische Bild und die umfassende Ost-West-Spanne werden in der Fußnote erläutert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der im Hebräischen ausdrücklich stehende Eigenname wird bewahrt, ohne ihn durch einen Titel zu ersetzen.
- issue: Zeitbezug des Partizips מוֹשִׁיעַ
  choice: ich rette
  alternative: ich werde retten; ich bin dabei zu retten
  rationale: Das Partizip kann in prophetischer Rede ein unmittelbar bevorstehendes oder als gewiss dargestelltes zukünftiges Handeln ausdrücken. Das Präsens erhält die Unmittelbarkeit, ohne die mögliche futurische Aussage auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter prophetischer Formel. Das erhöhte »Siehe« und der traditionelle Titel »der Heerscharen« entsprechen dem feierlichen Ausgangstext; die geografische Wendung ist im Haupttext klar und in der Fußnote quellennah erläutert.
