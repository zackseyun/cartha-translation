source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת עֹ֤ד יֵֽשְׁבוּ֙ זְקֵנִ֣ים וּ/זְקֵנ֔וֹת בִּ/רְחֹב֖וֹת יְרוּשָׁלִָ֑ם וְ/אִ֧ישׁ מִשְׁעַנְתּ֛/וֹ בְּ/יָד֖/וֹ מֵ/רֹ֥ב יָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/004.yaml
  text: 'Thus says Yahweh of hosts: Old men and old women will yet sit in the streets of Jerusalem[a], each with his staff in his hand because of great age.'
translation:
  language: de
  text: 'So spricht Jahwe der Heerscharen: Wieder werden alte Männer und alte Frauen auf den Straßen Jerusalems[a] sitzen, jeder mit seinem Stab in der Hand wegen seines hohen Alters.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf den Plätzen Jerusalems“.'
    reason: 'Lexikalische Alternative: רְחֹבוֹת kann breite Straßen beziehungsweise öffentliche Plätze bezeichnen.'
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die feste prophetische Botenformel wird in würdigem, natürlichem Deutsch bewahrt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: צְבָאוֹת
  choice: der Heerscharen
  rationale: Die etablierte, semantisch weite Wiedergabe des göttlichen Titels lässt sowohl himmlische Heere als auch souveräne Macht anklingen.
- source_word: עֹד
  choice: Noch
  rationale: Das Wort kündigt die künftig wiederhergestellte Normalität an; „noch“ bewahrt diesen verheißenden Zukunftsaspekt.
- source_word: יֵשְׁבוּ
  choice: werden … sitzen
  rationale: In der geschilderten Szene alter Menschen im öffentlichen Raum ist die konkrete Bedeutung „sitzen“ kontextgemäß.
- source_word: זְקֵנִים וּזְקֵנוֹת
  choice: alte Männer und alte Frauen
  rationale: Die ausdrücklich männliche und weibliche Formenpaarung bezeichnet betagte Menschen, nicht Amtsträger.
- source_word: בִּרְחֹבוֹת
  choice: auf den Straßen
  rationale: Das Substantiv bezeichnet breite öffentliche Straßen oder Plätze. „Auf den Straßen“ ist im Deutschen natürlich; die ebenfalls plausible Bedeutung „auf den Plätzen“ wird in einer Fußnote erhalten.
- source_word: וְאִישׁ
  choice: jeder
  rationale: 'אִישׁ hat hier verteilenden Sinn: Jeder Einzelne aus der genannten Gruppe ist gemeint.'
- source_word: מִשְׁעַנְתּוֹ
  choice: mit seinem Stab
  rationale: Das Wort bezeichnet eine Stütze beziehungsweise einen Stab; „Stab“ bewahrt das konkrete Bild und das maskuline Possessivsuffix.
- source_word: בְּיָדוֹ
  choice: in der Hand
  rationale: Die Ortsangabe wird direkt und anschaulich wiedergegeben; das bereits gesetzte „seinem“ trägt im Deutschen den distributiven Besitzbezug ausreichend mit.
- source_word: מֵרֹב יָמִים
  choice: wegen seines hohen Alters
  rationale: Die wörtliche Wendung „von der Fülle der Tage“ ist ein Idiom für hohes Alter. Die Übersetzung bewahrt den kausalen Sinn von מִן in natürlichem Deutsch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet das Tetragramm als persönlichen Gottesnamen. „Jahwe“ bewahrt den Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Verteilendes Maskulinum in וְאִישׁ sowie den Suffixen -וֹ
  choice: jeder mit seinem Stab … wegen seines hohen Alters
  alternative: alle mit ihrem Stab … wegen ihres hohen Alters
  rationale: Die gewählte Form bewahrt den ausdrücklich singularischen und maskulinen Wortlaut des Hebräischen, ohne aus dem grammatischen Geschlecht eine Aussage über die zuvor genannten alten Frauen abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter prophetischer Formel. Der Satz folgt dem anschaulichen Aufbau des Hebräischen, löst jedoch das Altersidiom natürlich auf. Der Fußnotenmarker [a] steht unmittelbar bei der mehrdeutigen Ortsangabe.
