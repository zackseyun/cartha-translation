base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/003.yaml
  text: 'Thus says Yahweh: I have returned to Zion and will dwell in the midst of Jerusalem[a], and Jerusalem will be called the City of Truth, and the mountain of Yahweh of Armies[b], the Holy Mountain.'
translation:
  language: de
  text: 'So spricht Yahweh: Ich bin nach Zion zurückgekehrt und werde mitten in Jerusalem wohnen. Jerusalem wird »Stadt der Wahrheit«[a] genannt werden, und der Berg Yahwehs der Heerscharen[b] wird »heiliger Berg« genannt werden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »Stadt der Treue« oder »Stadt der Zuverlässigkeit«. Das hebräische אֱמֶת kann Wahrheit, Verlässlichkeit oder Treue bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: »Yahweh der Heere«. צְבָאוֹת kann irdische oder himmlische Heere beziehungsweise Scharen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Yahweh
  rationale: Die geläufige prophetische Botenformel wird in würdigem, natürlichem Deutsch wiedergegeben; der Gottesname יְהוָה erscheint als »Yahweh«.
- source_word: שַׁבְתִּי אֶל צִיּוֹן
  choice: Ich bin nach Zion zurückgekehrt
  rationale: Das Qal-Perfekt bezeichnet hier eine vollzogene Rückkehr mit gegenwärtiger Bedeutung; אֶל drückt die Richtung nach Zion aus.
- source_word: וְשָׁכַנְתִּי בְּתוֹךְ יְרוּשָׁלִָם
  choice: und werde mitten in Jerusalem wohnen
  rationale: Im Zusammenhang folgt auf die vollzogene Rückkehr das künftig beziehungsweise fortdauernd gedachte Wohnen Gottes. »Mitten in« bewahrt die Aussage von בְּתוֹךְ deutlicher als ein bloßes »in«.
- source_word: וְנִקְרְאָה יְרוּשָׁלִַם
  choice: Jerusalem wird … genannt werden
  rationale: Das Nifal-Imperfekt wird als zukünftiges Passiv wiedergegeben.
- source_word: עִיר הָאֱמֶת
  choice: Stadt der Wahrheit
  rationale: »Wahrheit« ist eine direkte Wiedergabe von אֱמֶת; dessen Bedeutungsspektrum schließt zugleich Treue und Zuverlässigkeit ein.
- source_word: הַר יְהוָה צְבָאוֹת
  choice: der Berg Yahwehs der Heerscharen
  rationale: Die traditionelle deutsche Wiedergabe »Heerscharen« bewahrt den militärisch-himmlischen Umfang von צְבָאוֹת und klingt zugleich würdig. Die Zuordnung des Berges zu Yahweh bleibt erhalten.
- source_word: הַר הַקֹּדֶשׁ
  choice: heiliger Berg
  rationale: Die knappe prädikative Benennung des hebräischen Textes wird beibehalten; das bereits ausgedrückte »wird … genannt werden« gilt elliptisch auch für den Berg.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der hebräische Text bietet den Eigennamen unmittelbar. »Yahweh« gibt ihn als Namen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Zeitbezug von שַׁבְתִּי … וְשָׁכַנְתִּי
  choice: Ich bin … zurückgekehrt und werde … wohnen
  alternative: Ich kehre zurück und wohne; ich bin zurückgekehrt und habe gewohnt
  rationale: Die Übersetzung wahrt die Spannung zwischen der als vollzogen dargestellten Rückkehr und dem daraus folgenden beziehungsweise fortdauernden Wohnen in Jerusalem.
- issue: Semantischer Umfang von אֱמֶת
  choice: Wahrheit
  alternative: Treue; Zuverlässigkeit
  rationale: Keine der deutschen Möglichkeiten deckt das gesamte hebräische Bedeutungsspektrum ab. Im Haupttext steht die direkte Entsprechung »Wahrheit«; die ebenfalls mögliche ethische und relationale Nuance »Treue« wird in der Fußnote offengehalten.
- issue: Elliptische Benennung des Berges
  choice: der Berg … »heiliger Berg«
  alternative: der Berg … wird »heiliger Berg« genannt werden
  rationale: Im Hebräischen steht das Verb »wird genannt werden« nur ausdrücklich bei Jerusalem, kann aber auch die parallele Aussage über den Berg regieren. Die knappe deutsche Ellipse bewahrt die Struktur, ohne den Sinn zu verdunkeln.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Die Satzstellung bleibt nahe an der parallelen hebräischen Struktur. Anführungszeichen kennzeichnen die verliehenen Ehrennamen; die Kleinschreibung in »heiliger Berg« folgt der Einbindung als Benennung im Satz.
