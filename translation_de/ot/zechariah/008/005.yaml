  text: וּ/רְחֹב֤וֹת הָ/עִיר֙ יִמָּ֣לְא֔וּ יְלָדִ֖ים וִֽ/ילָד֑וֹת מְשַׂחֲקִ֖ים בִּ/רְחֹֽבֹתֶֽי/הָ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/005.yaml
  text: And the streets of the city will be filled with boys and girls playing in its streets[a].
translation:
  language: de
  text: Und die Straßen der Stadt werden voller Jungen und Mädchen sein, die auf ihren Straßen spielen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und die Plätze der Stadt werden voller Jungen und Mädchen sein, die auf ihren Plätzen spielen.“ Das hebräische Wort kann breite Straßen oder öffentliche Plätze bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/רְחֹבוֹת הָ/עִיר
  choice: Und die Straßen der Stadt
  rationale: רְחֹבוֹת bezeichnet breite öffentliche Verkehrs- oder Freiflächen innerhalb einer Stadt. „Straßen“ ist im modernen Deutsch natürlich; „Plätze“ bleibt als mögliche Alternative in der Fußnote erhalten.
- source_word: יִמָּלְאוּ
  choice: werden voller … sein
  rationale: Das Nifal Imperfekt von מלא beschreibt den künftigen Zustand, dass die Straßen von Kindern erfüllt sein werden. Die deutsche Konstruktion ist idiomatisch und bewahrt diesen Sinn.
- source_word: יְלָדִים וִֽ/ילָדוֹת
  choice: Jungen und Mädchen
  rationale: Die ausdrücklich maskuline und feminine Paarung wird wiedergegeben, statt יְלָדִים hier allgemein als „Kinder“ zu übersetzen.
- source_word: מְשַׂחֲקִים
  choice: die … spielen
  rationale: Das Partizip von שׂחק bezeichnet in diesem Zusammenhang das unbeschwerte Spielen der Kinder in der wiederhergestellten Stadt.
- source_word: בִּ/רְחֹבֹתֶי/הָ
  choice: auf ihren Straßen
  rationale: Das Suffix der 3. Person Femininum Singular bezieht sich auf die Stadt. „Ihren“ erhält diesen Bezug; die Wiederholung von „Straßen“ entspricht der hebräischen Betonung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die anschauliche Wiederholung von „Straßen“ wird trotz leichter Redundanz beibehalten. „Auf den Straßen“ ist im Deutschen idiomatischer als „in den Straßen“.
