  text: וּ/בָ֨אוּ עַמִּ֤ים רַבִּים֙ וְ/גוֹיִ֣ם עֲצוּמִ֔ים לְ/בַקֵּ֛שׁ אֶת יְהוָ֥ה צְבָא֖וֹת בִּ/ירוּשָׁלִָ֑ם וּ/לְ/חַלּ֖וֹת אֶת פְּנֵ֥י יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/022.yaml
  text: And many peoples and mighty nations will come to seek Yahweh of hosts in Jerusalem and to entreat the favor of Yahweh[a].
translation:
  language: de
  text: Und viele Völker und mächtige Nationen werden kommen, um Jahwe, den Herrn der Heerscharen, in Jerusalem zu suchen und Jahwe um seine Gunst anzuflehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und Jahwes Gunst zu suchen“. Wörtlich spricht die hebräische Wendung vom „Angesicht Jahwes“; sie kann das inständige Erbitten seiner Gunst oder zugewandten Gegenwart bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאוּ
  choice: werden kommen
  rationale: Das Qal-Perfekt mit vorangestelltem וּ steht im prophetischen Zusammenhang mit Zukunftsbezug; „werden kommen“ gibt dies in natürlichem modernem Deutsch wieder.
- source_word: עַמִּים רַבִּים
  choice: viele Völker
  rationale: „Völker“ wahrt die Mehrzahl verschiedener Bevölkerungsgruppen und hält die begriffliche Unterscheidung zum folgenden גוֹיִם aufrecht.
- source_word: וְגוֹיִם עֲצוּמִים
  choice: und mächtige Nationen
  rationale: גּוֹיִם bezeichnet hier politische beziehungsweise kollektive Nationen; עֲצוּמִים drückt Stärke und Macht aus.
- source_word: לְבַקֵּשׁ אֶת יְהוָה צְבָאוֹת
  choice: um Jahwe der Heerscharen … zu suchen
  rationale: בקשׁ mit direktem Objekt bedeutet „suchen“. Der Gottesname wird als „Jahwe“ wiedergegeben; „der Heerscharen“ bewahrt die konkrete Bildwelt des Titels צְבָאוֹת.
- source_word: בִּירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Die Präposition ist lokativ und wird im Wallfahrtszusammenhang natürlich mit „in“ wiedergegeben.
- source_word: וּלְחַלּוֹת אֶת פְּנֵי יְהוָה
  choice: und Jahwe um Gunst anzuflehen
  rationale: Die Wendung חלה את־פני bezeichnet das inständige Erbitten von Gunst beziehungsweise Wohlwollen. Die idiomatische Übersetzung ist verständlich, während die wörtliche Bildsprache vom „Angesicht“ in der Fußnote dokumentiert wird.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ gibt den offenbarten Bundesnamen erkennbar wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von צְבָאוֹת
  choice: der Heerscharen
  alternative: der Allmächtige
  rationale: „Heerscharen“ erhält das militärisch-kosmische Bild des hebräischen Titels; „der Allmächtige“ würde eine allgemeinere Eigenschaft ausdrücken, die hier nicht unmittelbar bezeichnet ist.
- issue: Deutung der Wendung חלה את־פני יהוה
  choice: Jahwe um Gunst anzuflehen
  alternative: Jahwes Angesicht zu besänftigen; Jahwes Gunst zu suchen
  rationale: Die gewählte Fassung erhält den bittenden, relationalen Sinn der Wendung, ohne festzulegen, ob vor allem Gunst, Wohlwollen oder zugewandte Gegenwart gemeint ist; diese Spannweite wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Heerscharen“ ist bewusst traditionsnah, da es die Bildwelt des Quelltexts genauer wahrt als „allmächtig“. Die Doppelung von „Jahwe“ bleibt entsprechend dem Hebräischen erhalten.
