review_pass:
  verdict: revise
  source_fidelity: 'Die Grundbedeutung wird zutreffend wiedergegeben: inneres Planen von Bösem gegen den Nächsten, das Nichtlieben eines falschen Eides und die abschließende göttliche Verwerfungsformel. Die Verbindung von distributivem אִישׁ mit pluralischen Verbformen sollte jedoch im Deutschen konsequenter abgebildet werden.'
  naturalness: „Keiner von euch soll …, und liebt keinen …“ verbindet eine Soll-Konstruktion der dritten Person mit einem Imperativ der zweiten Person und klingt dadurch syntaktisch uneinheitlich. Die Revision verwendet für den zweiten hebräischen Plural einheitlich „ihr sollt“.
  terminology: „Nächsten“ ist für רֵעֵהוּ im prophetisch-ethischen Kontext die etablierte, natürliche deutsche Wiedergabe. „Jahwe“ gibt den Gottesnamen angemessen wieder. „Falscher Eid“ und „lieben“ entsprechen dem hebräischen Wortlaut und Register.
  issues:
  - severity: medium
    issue: Uneinheitliche Anredeform im Satz
    rationale: Die Vorlage verbindet einen distributiv genannten Einzelnen mit pluralischen Anredeformen. Der Entwurf wechselt jedoch zusätzlich zwischen „Keiner von euch soll“ und dem Imperativ „liebt“, was im Deutschen unnötig holprig ist. „… und ihr sollt keinen falschen Eid lieben“ bildet den pluralischen zweiten Verbalbefehl klar ab.
  - severity: low
    issue: „Mitmenschen“ statt „Nächsten“
    rationale: „Mitmensch“ ist möglich, aber „Nächster“ trifft רֵעַ im ethischen und biblisch-prophetischen Sprachgebrauch präziser und bewahrt den etablierten Registerton.
  - severity: low
    issue: Fußnote bietet keine hinreichend genaue wörtliche Orientierung
    rationale: Die bisherige Formulierung „ein jeder soll nicht“ gibt eine deutsche Soll-Konstruktion wieder, während die hebräischen Verben pluralisch an die Gemeinschaft gerichtet sind. Die Fußnote sollte gerade dieses Spannungsverhältnis präzise erläutern.
  revised_text: Keiner von euch soll in seinem Herzen Böses gegen seinen Nächsten planen, und ihr sollt keinen falschen Eid lieben; denn all das hasse ich, spricht Jahwe.
  revised_footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Und ein jeder: Das Böse seines Nächsten sollt ihr nicht in euren Herzen planen.“ Das Hebräische nennt den Einzelnen distributiv („ein jeder“), richtet die Verbform jedoch im Plural an die Gemeinschaft.'
    reason: Die hebräische Formulierung verbindet den distributiven Singular mit einer pluralischen Anrede; die Übersetzung gibt diesen Sinn in natürlichem Deutsch wieder.
