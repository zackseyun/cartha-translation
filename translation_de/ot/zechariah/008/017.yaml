revisions:
- from: Keiner von euch soll in seinem Herzen Böses gegen seinen Mitmenschen planen[a], und liebt keinen falschen Eid; denn all das hasse ich, spricht Jahwe.
  to: Keiner von euch soll in seinem Herzen Böses gegen seinen Nächsten planen, und ihr sollt keinen falschen Eid lieben; denn all das hasse ich, spricht Jahwe.
  rationale: Die Revision beseitigt den unmotivierten Wechsel zwischen Soll-Konstruktion und Imperativ, bewahrt zugleich die im Hebräischen vorhandene Spannung von distributivem Einzelnen und pluralischer Gemeinschaftsanrede und ersetzt „Mitmenschen“ durch das im Kontext präzisere „Nächsten“. Die Aussage, dass ein falscher Eid nicht geliebt werden soll, sowie die prophetische Formel bleiben unverändert erhalten.
