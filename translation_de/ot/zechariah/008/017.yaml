  text: וְ/אִ֣ישׁ אֶת רָעַ֣ת רֵעֵ֗/הוּ אַֽל תַּחְשְׁבוּ֙ בִּ/לְבַבְ/כֶ֔ם וּ/שְׁבֻ֥עַת שֶׁ֖קֶר אַֽל תֶּאֱהָ֑בוּ כִּ֧י אֶת כָּל אֵ֛לֶּה אֲשֶׁ֥ר שָׂנֵ֖אתִי נְאֻם יְהוָֽה׀־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/017.yaml
  text: And let no man devise evil against his neighbor in his heart[a], and do not love a false oath, for all these are what I hate, declares Yahweh.
translation:
  language: de
  text: Keiner von euch soll in seinem Herzen Böses gegen seinen Nächsten planen, und ihr sollt keinen falschen Eid lieben; denn all das hasse ich, spricht Jahwe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִישׁ
  choice: Keiner von euch
  rationale: Das singularische אִישׁ steht in einer Verbotskonstruktion mit Verben der 2. Person Plural. „Keiner von euch“ gibt den distributiven Sinn innerhalb der angesprochenen Gemeinschaft natürlich wieder.
- source_word: רָעַת רֵעֵהוּ
  choice: Böses gegen seinen Mitmenschen
  rationale: רָעָה bezeichnet hier beabsichtigtes Böses oder Unheil; רֵעַ meint den Nächsten, Gefährten oder Mitmenschen. „Mitmensch“ ist im heutigen Deutsch klar und vermeidet eine Beschränkung auf räumliche Nachbarschaft.
- source_word: תַּחְשְׁבוּ בִּלְבַבְכֶם
  choice: in seinem Herzen … planen
  rationale: חשב kann „denken“, „ersinnen“ oder „planen“ bedeuten. Im Zusammenhang mit beabsichtigtem Bösen bringt „planen“ die innere Absicht zum Ausdruck; „in seinem Herzen“ bewahrt die distributive Aussage.
- source_word: שְׁבֻעַת שֶׁקֶר
  choice: falschen Eid
  rationale: Die Verbindung bedeutet wörtlich „Eid der Falschheit“. „Falscher Eid“ ist natürliches Deutsch und legt die Aussage nicht unnötig auf den engeren juristischen Begriff „Meineid“ fest.
- source_word: תֶּאֱהָבוּ
  choice: liebt
  rationale: אהב bedeutet unmittelbar „lieben“. Die wörtliche Wiedergabe erhält die starke moralische Aussage, dass ein falscher Eid nicht nur vermieden, sondern auch nicht gutgeheißen werden soll.
- source_word: כִּי אֶת כָּל אֵלֶּה אֲשֶׁר שָׂנֵאתִי
  choice: denn all das hasse ich
  rationale: Die knappe Formulierung bewahrt sowohl die Begründung durch כִּי als auch die umfassende Bezugnahme auf die genannten Verhaltensweisen.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: נְאֻם יְהוָה ist eine prophetische Botenformel. „Spricht Jahwe“ ist würdig und idiomatisch; der Gottesname wird als Eigenname wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet das Tetragramm als Gottesnamen. „Jahwe“ bewahrt dessen Charakter als Eigenname, ohne ihn durch einen Titel zu ersetzen.
- issue: Der ungewöhnliche Aufruf, einen falschen Eid nicht zu „lieben“
  choice: liebt keinen falschen Eid
  alternative: habt keinen Gefallen an einem falschen Eid
  rationale: Die direkte Wiedergabe von אהב bewahrt die zugespitzte moralische Sprache und löst sie nicht in eine schwächere Deutung auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus der beiden Verbote und die starke Gegenüberstellung von menschlichem Lieben und göttlichem Hassen bleiben erhalten.
