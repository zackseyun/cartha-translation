  source_fidelity: Die Übersetzung gibt die prophetische Formel וַיְהִי דְבַר־יְהוָה צְבָאוֹת לֵאמֹר sachgerecht wieder. „Und das Wort … erging“ überträgt die einleitende Wayyiqtol-Konstruktion idiomatisch, ohne den Sinn zu verlieren. „Jahwe der Heerscharen“ bewahrt den Gottesnamen und die Bildsprache von צְבָאוֹת; der Doppelpunkt erfüllt die einleitende Funktion von לֵאמֹר angemessen.
