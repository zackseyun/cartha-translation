  text: וַ/יְהִ֛י דְּבַר יְהוָ֥ה צְבָא֖וֹת לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/001.yaml
  text: And the word of Yahweh of hosts came[a], saying[b],
translation:
  language: de
  text: 'Und das Wort Jahwes der Heerscharen erging:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Und … erging
  rationale: Die Wayyiqtol-Form von היה führt das folgende Geschehen in der Erzählfolge ein. Im Deutschen wird ihre Funktion natürlich zusammen mit der prophetischen Formel „das Wort … erging“ wiedergegeben, statt mit dem schwerfälligen „Und es geschah“.
- source_word: דְּבַר
  choice: das Wort
  rationale: In der prophetischen Botenformel bezeichnet דְּבַר das wirksame Wort beziehungsweise die Botschaft Gottes. „Das Wort“ bewahrt die feste Formel und ihren würdevollen Klang.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im modernen Deutschen geläufige wissenschaftliche Umschrift.
- source_word: צְבָאוֹת
  choice: der Heerscharen
  rationale: In der Gottesbezeichnung יְהוָה צְבָאוֹת bewahrt „der Heerscharen“ die militärische und kosmische Bildwelt des hebräischen Ausdrucks besser als das stärker deutende „der Allmächtige“.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv leitet die unmittelbar folgende Gottesrede ein. Im natürlichen modernen Deutsch erfüllt ein Doppelpunkt diese Funktion, ohne das hebräische „sprechend“ unnötig nachzuahmen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. Seine Wiedergabe als „Jahwe“ bewahrt den Eigenamen, während „der HERR“ ihn durch einen Titel ersetzt.
- issue: Wiedergabe des Titels יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  alternative: Jahwe, der Allmächtige
  rationale: Die formnahe Wiedergabe erhält die konkrete, zugleich militärische und kosmische Bedeutung von צְבָאוֹת und vermeidet, sie auf das abstrakte Attribut der Allmacht festzulegen.
- issue: Wiedergabe von לֵאמֹר
  choice: Doppelpunkt
  alternative: und sprach
  rationale: לֵאמֹר kündigt die folgende direkte Rede an, ohne ausdrücklich einen Wechsel des Sprechakts zu behaupten. Der Doppelpunkt wahrt diese Funktion und vermeidet eine unnötige Wiederholung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die etablierte prophetische Formel „das Wort … erging“ ist natürlich und zugleich quellenah. „Heerscharen“ ist bewusst gehoben, da es sich um einen feststehenden Gottestitel handelt; auf Fußnoten kann in diesem kurzen Vers verzichtet werden.
