  text: כֹּֽה אָמַ֞ר יְהוָ֣ה צְבָא֗וֹת צ֣וֹם הָ/רְבִיעִ֡י וְ/צ֣וֹם הַ/חֲמִישִׁי֩ וְ/צ֨וֹם הַ/שְּׁבִיעִ֜י וְ/צ֣וֹם הָ/עֲשִׂירִ֗י יִהְיֶ֤ה לְ/בֵית יְהוּדָה֙ לְ/שָׂשׂ֣וֹן וּ/לְ/שִׂמְחָ֔ה וּֽ/לְ/מֹעֲדִ֖ים טוֹבִ֑ים וְ/הָ/אֱמֶ֥ת וְ/הַ/שָּׁל֖וֹם אֱהָֽבוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/019.yaml
  text: 'Thus says Yahweh of hosts: The fast of the fourth month[a], and the fast of the fifth, and the fast of the seventh, and the fast of the tenth, shall become for the house of Judah joy and gladness and good appointed feasts[c][b]. Therefore love truth and peace.'
translation:
  language: de
  text: 'So spricht Jahwe, der Heerscharen: Die Fasten des vierten Monats[a], des fünften, des siebten und des zehnten werden für das Haus Juda zu Jubel und Freude und zu frohen Festzeiten[b] werden. Liebt Wahrheit und Frieden![c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „das vierte Fasten, das fünfte Fasten, das siebte Fasten und das zehnte Fasten“. Die Ordnungszahlen beziehen sich wahrscheinlich auf die jeweiligen Monate.'
    reason: lexical_alternative
  - marker: b
    text: „Festzeiten“ bezeichnet festgesetzte Zeiten oder Feste, besonders auch heilige Festtage.
    reason: cultural_note
  - marker: c
    text: 'Wörtlich: „werden für das Haus Juda Jubel und Freude und frohe Festzeiten sein“. Die Wiedergabe „zu … werden“ bringt den im Zusammenhang erkennbaren Wandel von Fasten zu Festanlässen zum Ausdruck.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; „der Heerscharen“ bewahrt die traditionelle Breite des Titels, ohne ausschließlich menschliche Armeen festzulegen.
- source_word: צ֣וֹם ... הָרְבִיעִי / הַחֲמִישִׁי / הַשְּׁבִיעִי / הָעֲשִׂירִי
  choice: das Fasten im vierten Monat … im fünften … im siebten … im zehnten
  rationale: Die Ordnungszahlen beziehen sich wahrscheinlich auf Monate. Die Ergänzung „Monat“ beim ersten Glied macht die hebräische Kurzform verständlich und erhält zugleich die vierfache Wiederholung von „Fasten“.
- source_word: יִהְיֶה
  choice: wird … werden
  rationale: Das einfache Verb „sein“ bezeichnet im Kontext eine künftige Veränderung der Fastenzeiten zu Freuden- und Festanlässen; die deutsche Konstruktion „zu … werden“ bringt dies natürlich zum Ausdruck, während eine Fußnote die formnähere Alternative nennt.
- source_word: לְבֵית יְהוּדָה
  choice: für das Haus Juda
  rationale: „Haus Juda“ erhält den korporativen Sinn des Hebräischen; „für“ gibt die benefaktive Funktion der Präposition wieder.
- source_word: לְשָׂשׂוֹן וּלְשִׂמְחָה
  choice: zu Jubel und Freude
  rationale: Die zwei sinnverwandten Substantive bleiben als rhetorisches Paar erhalten. „Jubel“ gibt den Ausdruck freudigen Frohlockens wieder, „Freude“ das allgemeinere zweite Glied.
- source_word: וּלְמֹעֲדִים טוֹבִים
  choice: zu guten Festzeiten
  rationale: מוֹעֵד bezeichnet festgesetzte Zeiten und häufig kultische Feste. „Festzeiten“ bewahrt sowohl den zeitlichen als auch den festlichen Gehalt.
- source_word: וְהָאֱמֶת וְהַשָּׁלוֹם אֱהָבוּ
  choice: Darum liebt Wahrheit und Frieden!
  rationale: Der Imperativ wird direkt wiedergegeben. „Darum“ markiert in natürlichem Deutsch den Übergang von der Verheißung zur Aufforderung, obwohl das hebräische וְ formal auch schlicht mit „und“ wiedergegeben werden kann.
theological_decisions:
- issue: Verwandlung der Gedenkfasten
  choice: Die Fastenzeiten werden für Juda zu Anlässen von Jubel, Freude und Fest.
  alternative: Die Fastenzeiten werden lediglich mit „werden sein“ beschrieben oder ausdrücklich als abgeschafft verstanden.
  rationale: Der Kontext legt einen Funktionswandel nahe, sagt aber nicht ausdrücklich, auf welchem geschichtlichen Weg er eintritt oder dass die Fasten ersatzlos abgeschafft werden.
- issue: Logischer Anschluss des Schlussgebots
  choice: „Darum“ kennzeichnet die Aufforderung als Folgerung aus der Verheißung.
  alternative: „Und liebt Wahrheit und Frieden!“
  rationale: Das hebräische וְ lässt einen schlichten Anschluss zu. Der Kontext unterstützt jedoch einen folgernden Übergang; die Fußnote bewahrt die formnähere Möglichkeit.
- issue: Bedeutung von אֱמֶת und שָׁלוֹם
  choice: „Wahrheit und Frieden“
  alternative: „Treue und Wohlergehen“
  rationale: Die unmittelbaren, im ethisch-sozialen Zusammenhang passenden Bedeutungen werden gewählt, ohne die breiteren Bedeutungsfelder der Wörter dogmatisch einzuengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Nennung des Fastens und die korporative Bezeichnung „Haus Juda“ bleiben erhalten. „Festzeiten“ ist verständlich, bewahrt aber den kalendarisch-kultischen Unterton von מוֹעֵד. Alle Fußnotenmarker stehen im Haupttext.
