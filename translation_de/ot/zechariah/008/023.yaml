source:
  edition: WLC
  text: כֹּ֥ה אָמַר֮ יְהוָ֣ה צְבָאוֹת֒ בַּ/יָּמִ֣ים הָ/הֵ֔מָּה אֲשֶׁ֤ר יַחֲזִ֨יקוּ֙ עֲשָׂרָ֣ה אֲנָשִׁ֔ים מִ/כֹּ֖ל לְשֹׁנ֣וֹת הַ/גּוֹיִ֑ם וְֽ/הֶחֱזִ֡יקוּ בִּ/כְנַף֩ אִ֨ישׁ יְהוּדִ֜י לֵ/אמֹ֗ר נֵֽלְכָה֙ עִמָּ/כֶ֔ם כִּ֥י שָׁמַ֖עְנוּ אֱלֹהִ֥ים עִמָּ/כֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/023.yaml
  text: 'Thus says Yahweh of Armies: In those days ten men from every language of the nations will take hold—yes[a], they will take hold of the garment edge of a Jewish man, saying, ‘Let us go with you[c][b], for we have heard that God is with you.’'
translation:
  language: de
  text: 'So spricht Jahwe der Heerscharen[a]: In jenen Tagen werden zehn Männer aus allen Sprachgruppen der Völker zugreifen – ja, sie werden den Zipfel des Gewands eines jüdischen Mannes[c] ergreifen und sagen: »Wir wollen mit euch gehen, denn wir haben gehört, dass Gott mit euch ist.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: »der HERR der Heerscharen«; auch: »Jahwe der Heere«.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: »eines judäischen Mannes« oder »eines Judäers«.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: „Jahwe“ gibt den Gottesnamen direkt wieder. „Heerscharen“ bewahrt den konkreten militärischen Grundsinn und ist im Deutschen als würdige biblische Wendung verständlich.
- source_word: בַּיָּמִים הָהֵמָּה
  choice: In jenen Tagen
  rationale: Die geläufige deutsche Zeitformel entspricht dem hebräischen Wortlaut und wahrt den prophetischen Ton.
- source_word: יַחֲזִיקוּ ... וְהֶחֱזִיקוּ
  choice: werden ... zugreifen – ja, sie werden ... ergreifen
  rationale: Die auffällige Wiederholung desselben hebräischen Verbs bleibt als emphatische Neuaufnahme erhalten; der Wechsel zwischen „zugreifen“ und „ergreifen“ ergibt natürliches Deutsch, ohne die Wiederholung der Handlung zu glätten.
- source_word: עֲשָׂרָה אֲנָשִׁים
  choice: zehn Männer
  rationale: Die ausdrücklich maskuline Form wird genau und ohne unnötige Verallgemeinerung wiedergegeben.
- source_word: מִכֹּל לְשֹׁנוֹת הַגּוֹיִם
  choice: aus Völkern aller Sprachen
  rationale: Diese natürliche deutsche Formulierung bewahrt sowohl die sprachliche als auch die internationale Weite des Ausdrucks, ohne die etwas offene distributive Zuordnung unnötig festzulegen.
- source_word: בִּכְנַף
  choice: den Saum
  rationale: כָּנָף bezeichnet hier den Rand beziehungsweise Zipfel eines Kleidungsstücks. „Saum“ vermittelt das konkrete Bild knapp und idiomatisch; die breitere Bedeutung wird in einer Fußnote genannt.
- source_word: אִישׁ יְהוּדִי
  choice: eines jüdischen Mannes
  rationale: Die Wiedergabe erhält sowohl אִישׁ als auch die ethnisch-korporative Bezeichnung יְהוּדִי. Die mögliche geografisch-politische Nuance „Judäer“ wird offengehalten.
- source_word: נֵלְכָה עִמָּכֶם
  choice: Wir wollen mit euch gehen
  rationale: „Wir wollen“ bringt die volitive Kraft des Kohortativs im modernen Deutschen natürlicher zum Ausdruck als ein bloßes Futur.
- source_word: אֱלֹהִים עִמָּכֶם
  choice: Gott mit euch ist
  rationale: Die direkte Wiedergabe von עִם wahrt die Aussage von Gottes Gegenwart bei der angesprochenen Gemeinschaft.
theological_decisions:
- issue: Wiedergabe von יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  alternative: der HERR der Heerscharen
  rationale: Der hebräische Text enthält den Gottesnamen selbst. Die Transliteration macht ihn sichtbar, während die traditionelle Ersatzlesung als Alternative vermerkt wird.
- issue: Bedeutung von יְהוּדִי
  choice: jüdischer Mann
  alternative: judäischer Mann / Judäer
  rationale: Im prophetischen Zusammenhang kann die Bezeichnung über eine rein geografische Herkunft hinaus das zu Juda gehörende Volk meinen. Die alternative historische beziehungsweise geografische Nuance bleibt in der Fußnote sichtbar.
- issue: Wechsel vom Singular zum Plural
  choice: eines jüdischen Mannes ... mit euch ... Gott mit euch ist
  alternative: den Plural im Deutschen auf den einzelnen Mann beziehen oder glätten
  rationale: Der Text wechselt bewusst vom einzelnen jüdischen Mann zum pluralischen „euch“, das offenbar seine Gemeinschaft einschließt. Dieser bedeutungsvolle Wechsel wird nicht harmonisiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die emphatische Wiederaufnahme von „ergreifen“ sowie der auffällige Übergang vom einzelnen Mann zum pluralischen „euch“ bleiben erhalten. Die Formulierung „aus Völkern aller Sprachen“ vermeidet sowohl steifes Deutsch als auch eine unnötige Festlegung darauf, ob genau zehn Männer aus jeder einzelnen Sprachgruppe gemeint sind.
