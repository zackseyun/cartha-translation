revisions:
- from: 'So spricht Jahwe der Heerscharen[a]: In jenen Tagen werden zehn Männer aus Völkern aller Sprachen zugreifen – ja, sie werden den Saum[b] eines jüdischen Mannes[c] ergreifen und sagen: »Wir wollen mit euch gehen, denn wir haben gehört, dass Gott mit euch ist.«'
  to: 'So spricht Jahwe der Heerscharen[a]: In jenen Tagen werden zehn Männer aus allen Sprachgruppen der Völker zugreifen – ja, sie werden den Zipfel des Gewands eines jüdischen Mannes[c] ergreifen und sagen: »Wir wollen mit euch gehen, denn wir haben gehört, dass Gott mit euch ist.«'
  rationale: 'Die Revision beschränkt sich auf zwei sichere sprachlich-sachliche Verbesserungen: Die Herkunftsangabe wird als „aus allen Sprachgruppen der Völker“ formuliert, und das mehrdeutige, aber konkrete Bild von כנף wird mit „Zipfel des Gewands“ wiedergegeben. Dadurch entfällt die zu „Saum“ gehörige lexikalische Fußnote. Alle übrigen Entscheidungen, besonders die Wiederholung, der Kohortativ und der Singular-Plural-Wechsel, bleiben erhalten.'
