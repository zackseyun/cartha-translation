  - severity: low
    issue: „Saum“ für בכנף
    rationale: „Saum“ kann eine mögliche Bedeutung sein, ist aber enger als die hier gemeinte Ecke bzw. der Zipfel eines Gewandes. „Zipfel des Gewands“ bewahrt das konkrete Bild ohne unnötige Spezifizierung.
