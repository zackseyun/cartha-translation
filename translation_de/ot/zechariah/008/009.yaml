revisions:
- from: 'So spricht Jahwe der Heerscharen[a]: Eure Hände sollen stark sein! Ihr hört in diesen Tagen diese Worte aus dem Mund der Propheten[b], die an dem Tag zugegen waren, als der Grundstein für das Haus Jahwes der Heerscharen gelegt wurde, damit der Tempel gebaut werde.[c]'
  to: 'So spricht Jahwe der Heerscharen[a]: Eure Hände sollen stark sein, ihr, die ihr in diesen Tagen diese Worte aus dem Mund der Propheten[b] hört, die an dem Tag redeten, als das Fundament für das Haus Jahwes der Heerscharen gelegt wurde, damit der Tempel gebaut werde.[c]'
  rationale: Die Revision entfernt die nicht im Ausgangstext genannte Vorstellung eines einzelnen Grundsteins und gibt יסד mit der Grundlegung des Fundaments wieder. Sie ersetzt die zu stark festgelegte Aussage, die Propheten seien lediglich anwesend gewesen, durch die kontextuell naheliegende Ergänzung „redeten“, während die Fußnote ausdrücklich festhält, dass das Hebräische an dieser Stelle elliptisch und unterschiedlich deutbar ist. Die Terminologie für Gottesname, Heerscharen, Haus und Tempel bleibt erhalten.
