source:
  edition: WLC
  text: כֹּֽה אָמַר֮ יְהוָ֣ה צְבָאוֹת֒ תֶּחֱזַ֣קְנָה יְדֵי/כֶ֔ם הַ/שֹּֽׁמְעִים֙ בַּ/יָּמִ֣ים הָ/אֵ֔לֶּה אֵ֖ת הַ/דְּבָרִ֣ים הָ/אֵ֑לֶּה מִ/פִּי֙ הַ/נְּבִיאִ֔ים אֲ֠שֶׁר בְּ/י֞וֹם יֻסַּ֨ד בֵּית יְהוָ֧ה צְבָא֛וֹת הַ/הֵיכָ֖ל לְ/הִבָּנֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/009.yaml
  text: 'Thus says Yahweh of Armies: Let your hands be strong[c][b][a], you who in these days are hearing these words from the mouth of the prophets who were present on the day the house of Yahweh of Armies was founded for the temple to be built.'
translation:
  language: de
  text: 'So spricht Jahwe der Heerscharen[a]: Eure Hände sollen stark sein, ihr, die ihr in diesen Tagen diese Worte aus dem Mund der Propheten[b] hört, die an dem Tag redeten, als das Fundament für das Haus Jahwes der Heerscharen gelegt wurde, damit der Tempel gebaut werde.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch „Jahwe der Heere“ ist möglich. „Heerscharen“ kann sowohl irdische Heere als auch himmlische Mächte bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: „Aus dem Mund der Propheten“ ist ein hebräisches Sprachbild für ihre mündlich verkündete Botschaft.
    reason: lexical_alternative
  - marker: c
    text: Der hebräische Relativsatz ist stark verkürzt; „redeten“ ist ergänzend verstanden. Möglich ist auch, die Propheten als am Tag der Grundlegung anwesend zu verstehen oder den Zeitbezug enger mit den prophetischen Worten zu verbinden.
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Bewahrt die feste prophetische Botenformel in natürlichem, würdigem Deutsch.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Gibt den Gottesnamen als „Jahwe“ wieder und bewahrt mit „Heerscharen“ die militärische wie himmlische Bedeutungsweite von צְבָאוֹת.
- source_word: תֶּחֱזַקְנָה יְדֵיכֶם
  choice: Eure Hände sollen stark sein
  rationale: Erhält das hebräische Bild der starken Hände als Aufruf zu Mut, Entschlossenheit und tatkräftigem Handeln.
- source_word: הַשֹּׁמְעִים בַּיָּמִים הָאֵלֶּה
  choice: Ihr hört in diesen Tagen
  rationale: Gibt das Partizip präsentisch wieder und spricht die gegenwärtigen Hörer unmittelbar an.
- source_word: אֵת הַדְּבָרִים הָאֵלֶּה
  choice: diese Worte
  rationale: Im Zusammenhang prophetischer Rede ist „Worte“ die direkteste Wiedergabe von דְּבָרִים.
- source_word: מִפִּי הַנְּבִיאִים
  choice: aus dem Mund der Propheten
  rationale: Bewahrt das konkrete hebräische Sprachbild, das die mündlich verkündete Botschaft bezeichnet.
- source_word: אֲשֶׁר בְּיוֹם יֻסַּד
  choice: die an dem Tag zugegen waren, als der Grundstein … gelegt wurde
  rationale: Macht die stark verkürzte Relativkonstruktion in verständlichem Deutsch lesbar, ohne das nicht ausdrücklich genannte Reden der Propheten in den Haupttext einzutragen.
- source_word: יֻסַּד בֵּית יְהוָה צְבָאוֹת
  choice: als der Grundstein für das Haus Jahwes der Heerscharen gelegt wurde
  rationale: Das passive יסד bezeichnet hier die Gründung beziehungsweise Grundlegung des Tempelhauses; die deutsche Wendung benennt den baulichen Sinn klar.
- source_word: הַהֵיכָל לְהִבָּנוֹת
  choice: damit der Tempel gebaut werde
  rationale: Gibt הֵיכָל kontextgemäß als „Tempel“ und den Infinitiv als Zweck der Grundlegung wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Eigenname wird als Gottes offenbarter Bundesname erkennbar wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe des Gottestitels צְבָאוֹת
  choice: Heerscharen
  alternative: Heere
  rationale: „Heerscharen“ bewahrt die mögliche Spannweite zwischen irdischen Heeren und himmlischen Mächten, ohne sie auf eine einzige Deutung festzulegen.
- issue: Bezug der verkürzten Relativkonstruktion אֲשֶׁר בְּיוֹם יֻסַּד
  choice: 'auf die Propheten bezogen: „die … zugegen waren“'
  alternative: „die an dem Tag redeten“ oder Bezug auf die prophetischen Worte seit dem Tag der Grundlegung
  rationale: Die hebräische Konstruktion enthält nach dem Relativpronomen kein ausdrückliches Verb für das Handeln der Propheten. Der Haupttext bietet eine grammatisch mögliche, zurückhaltende Lesart; die Fußnote erhält die echte Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter prophetischer Formel und markantem Hand-Bild. Ungebräuchliche, aber bedeutungstragende biblische Ausdrücke werden durch knappe Fußnoten erschlossen; die syntaktische Mehrdeutigkeit des Schlusses wird nicht verschwiegen.
