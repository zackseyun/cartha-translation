    rationale: יסד bezeichnet das Gründen bzw. Legen eines Fundaments; ein einzelner „Grundstein“ wird im hebräischen Text nicht genannt und sollte daher nicht in den Haupttext eingetragen werden.
  - severity: medium
    issue: „die an dem Tag zugegen waren“
    rationale: Die hebräische Relativkonstruktion ist elliptisch und nennt weder die bloße Anwesenheit der Propheten noch ein ausdrückliches Verb ihres Handelns. Die wahrscheinlich kontextuelle Ergänzung „redeten“ kann im Haupttext verwendet werden, muss aber durch eine Fußnote als Ergänzung und alternative Deutungsmöglichkeit kenntlich bleiben.
  - severity: low
