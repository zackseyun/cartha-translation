  text: כִּ֗י לִ/פְנֵי֙ הַ/יָּמִ֣ים הָ/הֵ֔ם שְׂכַ֤ר הָֽ/אָדָם֙ לֹ֣א נִֽהְיָ֔ה וּ/שְׂכַ֥ר הַ/בְּהֵמָ֖ה אֵינֶ֑/נָּה וְ/לַ/יּוֹצֵ֨א וְ/לַ/בָּ֤א אֵין שָׁלוֹם֙ מִן הַ/צָּ֔ר וַ/אֲשַׁלַּ֥ח אֶת כָּל הָ/אָדָ֖ם אִ֥ישׁ בְּ/רֵעֵֽ/הוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/010.yaml
  text: For before those days there was no wage for man[a], and no wage for beast; and for the one going out and the one coming in there was no peace because of the adversary[c][b], and I set every man against his neighbor.
translation:
  language: de
  text: Denn vor jenen Tagen gab es keinen Lohn für den Menschen und keinen Lohn für das Vieh. Wer aus- und einging, hatte wegen des Bedrängers keinen Frieden[a][b], und ich hetzte jeden gegen seinen Nächsten auf.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „keine Sicherheit“ beziehungsweise „kein Wohlergehen“. Das hebräische Wort schließt Frieden, Sicherheit und Wohlergehen ein.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wegen des Feindes“ beziehungsweise „vom Gegner her“. Der hebräische Ausdruck bezeichnet einen feindlichen Bedränger oder Gegner.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „und ich sandte alle Menschen, jeden gegen seinen Nächsten“. Gemeint ist, dass Gott sie gegenseitiger Feindschaft preisgab.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion leitet eine Begründung beziehungsweise Erläuterung zum vorausgehenden Zusammenhang ein; „Denn“ bewahrt diese Funktion im Deutschen.
- source_word: לִפְנֵי הַיָּמִים הָהֵם
  choice: vor jenen Tagen
  rationale: Die zeitliche Wendung wird nah am Hebräischen wiedergegeben; „jene“ verweist natürlich auf die zuvor angesprochene Zeit.
- source_word: שְׂכַר הָאָדָם
  choice: Lohn für den Menschen
  rationale: שָׂכָר bezeichnet Lohn oder Entgelt. הָאָדָם meint hier im Gegensatz zum Vieh den Menschen als Gattung, nicht ausschließlich einen Mann.
- source_word: וּשְׂכַר הַבְּהֵמָה
  choice: und keinen Lohn für das Vieh
  rationale: Die parallele Formulierung bleibt erhalten. בְּהֵמָה bezeichnet hier allgemein Nutz- oder Lasttiere; „Vieh“ ist im Deutschen der passende Sammelbegriff.
- source_word: וְלַיּוֹצֵא וְלַבָּא
  choice: Wer aus- und einging
  rationale: Die substantivierten singularischen Partizipien bilden eine idiomatische Wendung für gewöhnliche Bewegungsfreiheit und Verkehr. Die deutsche Form bewahrt Numerus und Bildlichkeit.
- source_word: אֵין שָׁלוֹם
  choice: hatte keinen Frieden
  rationale: שָׁלוֹם umfasst Frieden, Sicherheit und Wohlergehen. „Keinen Frieden haben“ ist kontextgerecht; die weiter reichende Bedeutung wird in einer Fußnote offengehalten.
- source_word: מִן הַצָּר
  choice: wegen des Bedrängers
  rationale: 'צַר kann einen feindlichen Gegner oder Bedränger bezeichnen. Das מִן wird hier kausal verstanden: Die Unsicherheit bestand wegen des feindlichen Bedrängers.'
- source_word: וַאֲשַׁלַּח
  choice: und ich ließ … aufeinander los
  rationale: Das Verb bedeutet grundlegend „senden/loslassen“. Mit der feindlichen Verhältnisangabe gibt „aufeinander loslassen“ den kausativen Sinn natürlich wieder, ohne Gottes ausdrücklich genannte Handlung abzuschwächen.
- source_word: אֶת כָּל הָאָדָם אִישׁ בְּרֵעֵהוּ
  choice: alle Menschen, jeden gegen seinen Mitmenschen
  rationale: כָּל הָאָדָם hat kollektive, אִישׁ בְּרֵעֵהוּ distributive Kraft. „Mitmensch“ gibt רֵעַ hier als Gegenüber innerhalb der Gemeinschaft wieder; „gegen“ bewahrt den feindlichen Zusammenhang.
theological_decisions:
- issue: Generische Bedeutung von הָאָדָם
  choice: den Menschen / alle Menschen
  alternative: den Mann / jeden Mann
  rationale: Im Gegensatz zwischen menschlicher und tierischer Arbeit bezeichnet הָאָדָם die Menschheit beziehungsweise Menschen allgemein. Die deutsche generische Form wahrt diesen Umfang, ohne den Bezug unnötig auf Männer zu begrenzen.
- issue: Göttliche Verursachung gesellschaftlicher Feindschaft
  choice: ich ließ alle Menschen … aufeinander los
  alternative: alle Menschen gerieten gegeneinander
  rationale: Das hebräische Verb nennt Gott ausdrücklich als handelndes Subjekt. Die Übersetzung erhält diese theologische Spannung und verwandelt Gottes Handeln nicht in einen unpersönlichen Vorgang.
- issue: Bedeutungsumfang von שָׁלוֹם
  choice: Frieden
  alternative: Sicherheit / Wohlergehen
  rationale: „Frieden“ ist die direkte und kontextuell passende Wiedergabe, doch der hebräische Ausdruck schließt Sicherheit und Wohlergehen ein; diese Mehrdeutigkeit wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur und die Bewegungspaarung „aus- und eingehen“ bleiben erkennbar. „Aufeinander loslassen“ ist kräftig, aber geläufig und erhält sowohl die soziale Feindschaft als auch die ausdrücklich genannte göttliche Handlung.
