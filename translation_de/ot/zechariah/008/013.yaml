source:
  edition: WLC
  text: וְ/הָיָ֡ה כַּ/אֲשֶׁר֩ הֱיִיתֶ֨ם קְלָלָ֜ה בַּ/גּוֹיִ֗ם בֵּ֤ית יְהוּדָה֙ וּ/בֵ֣ית יִשְׂרָאֵ֔ל כֵּ֚ן אוֹשִׁ֣יעַ אֶתְ/כֶ֔ם וִ/הְיִיתֶ֖ם בְּרָכָ֑ה אַל תִּירָ֖אוּ תֶּחֱזַ֥קְנָה יְדֵי/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/013.yaml
  text: And it shall happen that just as you were a curse among the nations[a], O house of Judah and house of Israel, so I will save you, and you shall be a blessing. Do not fear[c][b]; let your hands be strong.
translation:
  language: de
  text: Und wie ihr unter den Völkern ein Fluch[a] gewesen seid, Haus Juda und Haus Israel, so werde ich euch retten[b], und ihr werdet ein Segen sein. Fürchtet euch nicht; eure Hände sollen stark sein![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Gegenstand des Fluchens“ – also ein Volk, dessen Name unter den Völkern in Fluchformeln gebraucht wurde.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „befreien“. Das hebräische Verb kann Rettung oder Befreiung in einem weiten Sinn bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „Eure Hände sollen stark sein.“ Das hebräische Bild fordert zu Mut und entschlossenem Handeln auf.'
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: Und … ihr werdet
  rationale: Die Formel leitet hier die künftige Umkehr des bisherigen Zustands ein. Im Deutschen lässt sie sich natürlich in die Vergleichskonstruktion und die anschließende Zukunftsaussage integrieren, ohne das schwerfällige „Und es wird geschehen“ voranzustellen.
- source_word: כַּאֲשֶׁר … כֵּן
  choice: wie … so
  rationale: Das deutsche Korrelatpaar gibt die enge Entsprechung zwischen dem früheren Zustand und der kommenden Umkehr klar und idiomatisch wieder.
- source_word: קְלָלָה
  choice: ein Fluch
  rationale: Die direkte Wiedergabe bewahrt die kraftvolle Gegenüberstellung zu „ein Segen“. Gemeint sein kann auch, dass ihr Name unter den Völkern in Flüchen verwendet wurde; diese Nuance steht in der Fußnote.
- source_word: בַּגּוֹיִם
  choice: unter den Völkern
  rationale: „Völker“ bezeichnet hier die umliegenden Nationen; „unter“ ist im Deutschen für einen Zustand innerhalb dieser Völker natürlich.
- source_word: בֵּית יְהוּדָה וּבֵית יִשְׂרָאֵל
  choice: Haus Juda und Haus Israel
  rationale: „Haus“ bewahrt die kollektive und bundesgeschichtliche Bezeichnung. Die unmarkierte Anrede wirkt im modernen Deutschen würdevoller und natürlicher als ein eingeschobenes „o“.
- source_word: אוֹשִׁיעַ אֶתְכֶם
  choice: ich werde euch retten
  rationale: Das Hiphil von ישׁע umfasst Rettung und Befreiung. „Retten“ erhält den breiten Sinn, ohne ihn auf politische Befreiung oder spätere heilsgeschichtliche Einzelheiten zu verengen.
- source_word: וִהְיִיתֶם בְּרָכָה
  choice: und ihr werdet ein Segen sein
  rationale: Die Formulierung bewahrt die biblische Wendung und die symmetrische Gegenüberstellung von Fluch und Segen.
- source_word: אַל תִּירָאוּ
  choice: Fürchtet euch nicht
  rationale: Dies ist eine natürliche, knappe und würdige Wiedergabe des hebräischen Verbots.
- source_word: תֶּחֱזַקְנָה יְדֵיכֶם
  choice: eure Hände sollen stark sein
  rationale: Die wörtliche Bildsprache bleibt erhalten und bezeichnet Mut sowie entschlossenes Handeln. Im Deutschen ist das Bild verständlich, bedarf aber einer erläuternden Fußnote.
theological_decisions:
- issue: Reichweite der göttlichen Rettung in אוֹשִׁיעַ
  choice: ich werde euch retten
  alternative: ich werde euch befreien
  rationale: „Retten“ lässt sowohl konkrete Befreiung aus Not als auch die umfassendere Wiederherstellung des Bundesvolkes anklingen, ohne den Kontext dogmatisch zu verengen.
- issue: Korporative Identität Judas und Israels
  choice: Haus Juda und Haus Israel
  alternative: Juda und Israel
  rationale: Die Beibehaltung von „Haus“ wahrt die im Hebräischen bezeichnete kollektive Identität und reduziert die Namen nicht auf bloße Gebietsbezeichnungen.
- issue: Bildsprache der Aufforderung zum Mut
  choice: eure Hände sollen stark sein
  alternative: fasst Mut
  rationale: Die wörtliche Metapher lässt die Verbindung von innerem Mut und entschlossenem Tun bestehen; die idiomatische Bedeutung wird in der Fußnote erläutert.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem prophetischem Ton. Die klare Wie-so-Struktur und die Gegenüberstellung von „Fluch“ und „Segen“ bleiben erhalten. Archaisches „o“ und das schwerfällige „es wird geschehen“ werden vermieden; die hebräische Hand-Metapher wird dagegen bewusst bewahrt und erläutert.
