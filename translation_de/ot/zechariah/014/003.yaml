source:
  edition: WLC
  text: וְ/יָצָ֣א יְהוָ֔ה וְ/נִלְחַ֖ם בַּ/גּוֹיִ֣ם הָ/הֵ֑ם כְּ/י֥וֹם הִֽלָּחֲמ֖/ו בְּ/י֥וֹם קְרָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/003.yaml
  text: Then Yahweh will go out and fight against those nations[a], as when he fights in a day of battle.
translation:
  language: de
  text: Dann wird Jahwe ausziehen und gegen jene Völker kämpfen, wie wenn er an einem Tag der Schlacht kämpft.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie an einem Tag, als er in einer Schlacht kämpfte“; wörtlicher: „wie am Tag seines Kämpfens, am Tag der Schlacht“. Der hebräische Vergleich kann auf früheres Kämpfen zurückblicken oder allgemein beschreiben, wie Jahwe kämpft.'
    reason: Mehrdeutiger Zeitbezug und formnähere alternative Wiedergabe des hebräischen Vergleichs.
lexical_decisions:
- source_word: וְיָצָא
  choice: Dann wird … ausziehen
  rationale: Das Waw mit der Verbform führt im prophetischen Zusammenhang die nächste zukünftige Handlung ein. „Dann“ bildet die Abfolge natürlich ab; „ausziehen“ ist im militärischen Kontext idiomatisch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְנִלְחַם
  choice: und … kämpfen
  rationale: Das Nifal von לחם bezeichnet hier das Kämpfen beziehungsweise den Kampf gegen einen Gegner. „kämpfen“ ist klar und wahrt das kriegerische Bild.
- source_word: בַּגּוֹיִם הָהֵם
  choice: gegen jene Völker
  rationale: ב bezeichnet bei לחם den Gegner. „jene“ erhält die rückverweisende Bedeutung von הָהֵם, und „Völker“ passt zum internationalen Zusammenhang.
- source_word: כְּיוֹם הִלָּחֲמוֹ
  choice: wie an dem Tag, als er … kämpfte
  rationale: Die Formulierung bewahrt die ausdrückliche Tagesangabe und gibt den Infinitiv mit Suffix als zeitlichen Vergleich wieder. Das Präteritum lässt den möglichen Rückblick auf ein früheres göttliches Eingreifen offen.
- source_word: בְּיוֹם קְרָב
  choice: am Tag der Schlacht
  rationale: Die feste, feierliche Wendung gibt den martialischen Sinn von קְרָב wieder, ohne eine bestimmte historische Schlacht ausdrücklich zu identifizieren.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den persönlichen Gottesnamen; die Transliteration wahrt ihn, ohne einen ersetzenden Titel einzuführen.
- issue: Zeitbezug des Vergleichs הִלָּחֲמוֹ
  choice: als er … kämpfte
  alternative: wenn er … kämpft
  rationale: Die Konstruktion kann als Rückblick oder allgemeiner Vergleich verstanden werden. Das Präteritum entspricht dem naheliegenden Rückblick auf Jahwes früheres Kämpfen; die mögliche allgemeinere Lesart wird in der Fußnote ausgewiesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „Tag“ wurde bewusst beibehalten, weil sie im Hebräischen ausdrücklich steht und auf Deutsch verständlich bleibt.
