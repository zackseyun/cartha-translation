source:
  edition: WLC
  text: וְ/הָיָ֗ה כָּל הַ/נּוֹתָר֙ מִ/כָּל הַ/גּוֹיִ֔ם הַ/בָּאִ֖ים עַל יְרֽוּשָׁלִָ֑ם וְ/עָל֞וּ מִ/דֵּ֧י שָׁנָ֣ה בְ/שָׁנָ֗ה לְ/הִֽשְׁתַּחֲוֺת֙ לְ/מֶ֨לֶךְ֙ יְהוָ֣ה צְבָא֔וֹת וְ/לָ/חֹ֖ג אֶת חַ֥ג הַ/סֻּכּֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/016.yaml
  text: Then all who remain from all the nations that came against Jerusalem shall go up year after year to worship the King[a], Yahweh of Armies[b], and to celebrate the Feast of Booths.
translation:
  language: de
  text: Dann werden alle, die von all den Völkern übrig geblieben sind, die gegen Jerusalem gezogen waren, Jahr für Jahr hinaufziehen, um den König, Jahwe der Heerscharen[a], anzubeten und das Laubhüttenfest[b] zu feiern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: „Jahwe Zebaoth“; auch: „Jahwe der Heere“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Fest der Hütten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Dann werden
  rationale: Leitet in der prophetischen Abfolge eine zukünftige Folge ein; „Dann“ gibt den Fortgang natürlich wieder, während das Futur erhalten bleibt.
- source_word: כָּל הַנּוֹתָר
  choice: alle, die ... übrig geblieben sind
  rationale: Das substantivierte Partizip bezeichnet die Übriggebliebenen beziehungsweise Überlebenden, ohne die Formulierung stärker festzulegen als der Ausgangstext.
- source_word: מִכָּל הַגּוֹיִם
  choice: von all den Völkern
  rationale: Gibt die Herkunft aus der Gesamtheit der gegen Jerusalem gezogenen Völker idiomatisch wieder.
- source_word: הַבָּאִים עַל יְרוּשָׁלִָם
  choice: die gegen Jerusalem gezogen waren
  rationale: „Gegen ... ziehen“ bewahrt im militärischen Zusammenhang die feindliche Stoßrichtung von בוא על, ohne den genauen Verlauf als vollendeten Angriff auszudeuten.
- source_word: וְעָלוּ
  choice: werden ... hinaufziehen
  rationale: עלה ist die übliche Bezeichnung für den topografischen und kultischen Aufstieg nach Jerusalem; „hinaufziehen“ erhält beide Anklänge.
- source_word: מִדֵּי שָׁנָה בְשָׁנָה
  choice: Jahr für Jahr
  rationale: Die Wendung bezeichnet eine regelmäßig wiederkehrende jährliche Handlung.
- source_word: לְהִשְׁתַּחֲוֺת
  choice: anzubeten
  rationale: Das Verb bezeichnet wörtlich ein Sich-Niederwerfen, hat hier vor dem göttlichen König jedoch eindeutig kultische Bedeutung.
- source_word: לְמֶלֶךְ
  choice: den König
  rationale: Das deutsche Verb „anbeten“ regiert den Akkusativ; der bedeutsame Königstitel bleibt ausdrücklich erhalten.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: „Jahwe“ gibt den Eigennamen wieder. „Heerscharen“ ist im Deutschen eine verständliche, würdevolle Bezeichnung, die sowohl irdische Heere als auch himmlische Scharen umfassen kann.
- source_word: וְלָחֹג
  choice: und ... zu feiern
  rationale: חגג bezeichnet das festliche Begehen eines Pilgerfestes; „feiern“ gibt diesen Sinn natürlich wieder.
- source_word: חַג הַסֻּכּוֹת
  choice: das Laubhüttenfest
  rationale: Dies ist die im modernen Deutschen etablierte und zugleich anschauliche Bezeichnung des Festes der Hütten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Gottesnamen transparent wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von צְבָאוֹת im Gottestitel
  choice: der Heerscharen
  alternative: der Heere; Zebaoth
  rationale: „Heerscharen“ wahrt den umfassenden und majestätischen Charakter des Titels besser als das enger militärisch wirkende „Heere“; die traditionelle Form „Zebaoth“ steht in der Fußnote.
- issue: Eschatologische Bedeutung der Völkerwallfahrt
  choice: Das prophetische Bild bleibt ohne nähere Deutung stehen.
  alternative: Eine ausschließlich wörtliche künftige Wallfahrt oder eine ausschließlich symbolische Darstellung universaler Anbetung
  rationale: Der Vers selbst beschreibt die jährliche Wallfahrt der übrig gebliebenen Völker. Die Übersetzung entscheidet nicht zwischen wörtlicher, typologischer oder apokalyptischer Lesart.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt dem prophetischen Fortgang, bleibt aber gut lesbar. Die traditionelle Festbezeichnung „Laubhüttenfest“ wird im Haupttext verwendet; der wörtlichere Ausdruck steht in der Fußnote.
