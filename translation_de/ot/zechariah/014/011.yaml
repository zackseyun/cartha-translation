  text: וְ/יָ֣שְׁבוּ בָ֔/הּ וְ/חֵ֖רֶם לֹ֣א יִֽהְיֶה ע֑וֹד וְ/יָשְׁבָ֥ה יְרוּשָׁלִַ֖ם לָ/בֶֽטַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/011.yaml
  text: And they will dwell in it[a], and there will no longer be anything devoted to destruction, and Jerusalem will dwell securely.
translation:
  language: de
  text: Und man wird darin wohnen, und es wird keinen Bann mehr geben[a], und Jerusalem wird in Sicherheit wohnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „keinen Fluch“. Das hebräische Wort חֵרֶם kann einen Bann oder etwas bezeichnen, das der Vernichtung geweiht ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשְׁבוּ בָהּ
  choice: Und man wird darin wohnen
  rationale: Das hebräische Verb steht in der 3. Person Plural, ohne dass hier ein ausdrückliches Subjekt genannt wird. Das unpersönliche „man“ gibt dies im Deutschen natürlich wieder, ohne die Bewohner näher zu bestimmen; „wohnen“ bewahrt den Sinn dauerhafter Ansiedlung.
- source_word: חֵרֶם
  choice: was der Vernichtung geweiht ist
  rationale: חֵרֶם bezeichnet etwas, das unter einen Bann gestellt und der Vernichtung preisgegeben beziehungsweise geweiht ist. Die Formulierung hält diese kultisch-rechtliche und gerichtliche Bedeutungsbreite besser fest als das allgemeinere „Fluch“.
- source_word: לֹא יִהְיֶה עוֹד
  choice: es wird nichts mehr geben
  rationale: Die deutsche Wendung bringt das künftige vollständige Aufhören des genannten Zustands natürlich zum Ausdruck.
- source_word: וְיָשְׁבָה יְרוּשָׁלִַם
  choice: Jerusalem wird … wohnen
  rationale: Jerusalem ist grammatisch das Subjekt. Die personifizierende Redeweise und die Wiederholung von ישׁב werden bewahrt, statt passiv mit „wird bewohnt sein“ zu übersetzen.
- source_word: לָבֶטַח
  choice: in Sicherheit
  rationale: Die Wendung bezeichnet einen Zustand verlässlicher Sicherheit. „In Sicherheit wohnen“ ist im modernen Deutschen natürlich und würdevoll.
theological_decisions:
- issue: Bedeutung von חֵרֶם im Zusammenhang der endzeitlichen Wiederherstellung
  choice: was der Vernichtung geweiht ist
  alternative: Fluch; Bann
  rationale: Die Übersetzung bewahrt den Hintergrund göttlichen Gerichts und die Vorstellung des der Vernichtung Verfallenen, ohne den Ausdruck auf den abstrakteren Begriff „Fluch“ festzulegen. Eine lexikalisch mögliche Alternativdeutung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Die parallele Wiederholung von „wohnen“ wird beibehalten; die Mehrdeutigkeit von חֵרֶם wird nicht stillschweigend aufgelöst.
