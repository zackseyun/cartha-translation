    rationale: Das Hebräische verwendet hier das Substantiv חֵרֶם („Bann“, etwas dem Untergang Geweihtes), nicht ein Pronomen wie „nichts“. Die deutsche Formulierung verändert den Bezug von einem Zustand bzw. Bann zu einer unbestimmten Menge von Dingen und klingt zudem umständlich.
  revised_text: Und man wird darin wohnen, und es wird keinen Bann mehr geben[a], und Jerusalem wird in Sicherheit wohnen.
