  source_fidelity: Die Wiedergabe von יָשַׁב mit „wohnen“ und von לָבֶטַח mit „in Sicherheit wohnen“ ist quellentreu. חֵרֶם ist jedoch ein Substantiv; „es wird nichts mehr geben, was der Vernichtung geweiht ist“ macht daraus eine unbestimmte Menge von Gegenständen und ist damit weniger präzise als die hebräische Aussage über den Bann bzw. das der Vernichtung Geweihte.
  naturalness: „Und man wird darin wohnen“ ist natürliches modernes Standarddeutsch. Die Umformung mit „nichts mehr geben, was …“ ist schwerfälliger als nötig. „Es wird keinen Bann mehr geben“ ist in prophetisch-biblischem Register verständlich und idiomatisch.
  terminology: „Bann“ gibt חֵרֶם als zentrale, bewusst konkrete lexikalische Bedeutung wieder. Die Fußnote wahrt die mögliche Deutung „Fluch“ sowie die Bedeutung eines zur Vernichtung Geweihten, ohne die Mehrdeutigkeit dogmatisch aufzulösen.
