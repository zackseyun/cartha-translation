source:
  edition: WLC
  text: וְ/זֹ֣את תִּֽהְיֶ֣ה הַ/מַּגֵּפָ֗ה אֲשֶׁ֨ר יִגֹּ֤ף יְהוָה֙ אֶת כָּל הָ֣/עַמִּ֔ים אֲשֶׁ֥ר צָבְא֖וּ עַל יְרוּשָׁלִָ֑ם הָמֵ֣ק בְּשָׂר֗/וֹ וְ/הוּא֙ עֹמֵ֣ד עַל רַגְלָ֔י/ו וְ/עֵינָי/ו֙ תִּמַּ֣קְנָה בְ/חֹֽרֵי/הֶ֔ן וּ/לְשׁוֹנ֖/וֹ תִּמַּ֥ק בְּ/פִי/הֶֽם׀־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/012.yaml
  text: 'And this will be the plague with which Yahweh will strike all the peoples that wage war against Jerusalem: while he is standing on his feet[a], his flesh will rot away, his eyes will rot away in their sockets, and his tongue will rot away in his mouth.'
translation:
  language: de
  text: 'Und dies wird die Plage sein, mit der Jahwe alle Völker[a] schlagen wird, die gegen Jerusalem in den Krieg gezogen sind: Das Fleisch eines jeden wird verwesen, während er noch auf seinen Füßen steht; seine Augen werden in ihren Augenhöhlen verwesen und seine Zunge wird in seinem Mund verwesen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Nationen“. Das hebräische Wort עַמִּים kann je nach Zusammenhang Völker oder Nationen bezeichnen.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: הַמַּגֵּפָה
  choice: die Plage
  rationale: מַגֵּפָה bezeichnet eine von Gott ausgehende Plage oder schwere Heimsuchung. „Plage“ ist im Deutschen klar und lässt die genaue Art des Gerichts offen.
- source_word: יִגֹּף
  choice: schlagen wird
  rationale: Das Verb נגף bedeutet „schlagen, treffen, heimsuchen“. „Schlagen“ bewahrt die aktive Aussage über Gottes Gericht, ohne das Verb mit dem vorausgehenden Substantiv gleichzusetzen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: „Jahwe“ gibt den Gottesnamen im modernen deutschen Bibelgebrauch als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: כָּל־הָעַמִּים
  choice: alle Völker
  rationale: עַמִּים kann „Völker“ oder „Nationen“ bezeichnen. „Völker“ wahrt den kollektiven und ethnischen Bedeutungsumfang, ohne moderne Nationalstaaten vorauszusetzen.
- source_word: צָבְאוּ עַל
  choice: die gegen Jerusalem in den Krieg gezogen sind
  rationale: צבא bezeichnet hier militärisches Ausrücken beziehungsweise Kriegführen. Die Perfektform wird durch „gezogen sind“ wiedergegeben.
- source_word: הָמֵק / תִּמַּקְנָה / תִּמַּק
  choice: wird/werden verwesen
  rationale: Die Formen von מקק schildern den Zerfall des Fleisches, der Augen und der Zunge. „Verwesen“ bewahrt die drastische Körperlichkeit und die lexikalische Wiederholung, ohne den Vorgang genauer zu naturalisieren.
- source_word: בְּשָׂרוֹ
  choice: das Fleisch eines jeden
  rationale: „Fleisch“ entspricht בָּשָׂר konkret. „Eines jeden“ macht den im Hebräischen erfolgenden distributiven Wechsel von den pluralischen Völkern zum einzelnen Betroffenen im Deutschen verständlich.
- source_word: וְהוּא עֹמֵד עַל־רַגְלָיו
  choice: während er noch auf seinen Füßen steht
  rationale: Die Partizipialkonstruktion bezeichnet den gleichzeitig andauernden Zustand. „Noch“ verdeutlicht knapp die erschütternde Aussage, dass der Zerfall den Menschen im Stehen trifft.
- source_word: בְחֹרֵיהֶן
  choice: in ihren Höhlen
  rationale: חֹרִים bezeichnet hier die Augenhöhlen. „Höhlen“ ist der übliche anatomische Ausdruck in der Verbindung „Augenhöhlen“ und behält den Bezug des pluralischen Pronomens auf die Augen bei.
- source_word: בְּפִיהֶם
  choice: in seinem Mund
  rationale: Obwohl die überlieferte Konsonantenform ein pluralisches Suffix zeigt, verlangt der singularische Zusammenhang mit „seine Zunge“ eine distributive Wiedergabe. „In seinem Mund“ vermittelt diesen Sinn natürlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen. Die Transliteration bewahrt ihn als Gottesnamen und ersetzt ihn nicht durch einen Titel.
- issue: Art des geschilderten Gerichts
  choice: Die drastische leibliche Verwesung wird ohne Erklärung des Mechanismus beibehalten.
  alternative: Das Bild als bloße Metapher, Krankheit oder bestimmte Waffe deuten.
  rationale: Der Text nennt den Zerfall von Fleisch, Augen und Zunge, legt aber nicht fest, ob die Ursache übernatürlich, epidemiologisch oder militärisch zu verstehen ist.
- issue: Wechsel vom Plural der Völker zum Singular des Betroffenen
  choice: 'distributiv: „das Fleisch eines jeden … er … seine“'
  alternative: durchgehend pluralisch formulieren
  rationale: Der hebräische Numeruswechsel richtet den Blick auf jeden einzelnen Angehörigen der angreifenden Völker. Die distributive deutsche Form bewahrt diesen Wechsel verständlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die drastische Bildsprache wird weder abgeschwächt noch medizinisch ausgedeutet. Der Fußnotenmarker steht unmittelbar bei dem Ausdruck, auf den sich die Anmerkung bezieht.
