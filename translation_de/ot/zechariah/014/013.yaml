source:
  edition: WLC
  text: וְ/הָיָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא תִּֽהְיֶ֧ה מְהֽוּמַת יְהוָ֛ה רַבָּ֖ה בָּ/הֶ֑ם וְ/הֶחֱזִ֗יקוּ אִ֚ישׁ יַ֣ד רֵעֵ֔/הוּ וְ/עָלְתָ֥ה יָד֖/וֹ עַל יַ֥ד רֵעֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/013.yaml
  text: And on that day a great panic from Yahweh will be among them[a], and each man will seize the hand of his neighbor[b], and his hand will rise against the hand of his neighbor.
translation:
  language: de
  text: An jenem Tag wird eine große, vom HERRN kommende Panik unter ihnen ausbrechen.[a] Einer wird die Hand des anderen packen, und seine Hand wird sich gegen die Hand des anderen erheben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine große Verwirrung“ beziehungsweise „ein großes Getümmel vom HERRN“. Das hebräische Wort kann einen von Gott herbeigeführten Zustand chaotischen Schreckens bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Seine Hand wird sich gegen die Hand des anderen erheben.“ Das eindringliche Bild bezeichnet, dass sie sich gewaltsam gegeneinander wenden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְהוּמַת
  choice: Panik
  rationale: Das Substantiv bezeichnet einen Zustand chaotischer Angst und Verwirrung, hier als göttlich bewirktes Durcheinander. „Panik“ ist im Deutschen natürlich und passt zum anschließenden gegenseitigen Angriff.
- source_word: יְהוָה
  choice: HERR
  rationale: Der Gottesname wird nach verbreiteter deutscher Bibelkonvention ehrfürchtig mit „HERR“ wiedergegeben, ohne eine unsichere Aussprache in den Haupttext einzutragen.
- source_word: רַבָּה
  choice: große
  rationale: Das Adjektiv verstärkt das Ausmaß der Panik; „große Panik“ ist idiomatisch und wahrt die hebräische Betonung.
- source_word: בָּהֶם
  choice: unter ihnen
  rationale: Die Präposition bezeichnet hier am ehesten das Ausbrechen der Panik innerhalb der genannten Gruppe, wie die folgende gegenseitige Gewalt zeigt.
- source_word: וְהֶחֱזִיקוּ
  choice: wird … packen
  rationale: Der Hifil von חזק bezeichnet hier ein kräftiges Ergreifen. „Packen“ vermittelt die feindselige, gewaltsame Handlung natürlich.
- source_word: אִישׁ … רֵעֵהוּ
  choice: einer … des anderen
  rationale: Die distributive Konstruktion wird in natürlichem Deutsch als wechselseitiges Geschehen wiedergegeben. Sie bewahrt den Bezug auf einzelne Angehörige der Gruppe, ohne das Geschlecht stärker hervorzuheben, als es der Kontext verlangt.
- source_word: וְעָלְתָה יָדוֹ עַל יַד רֵעֵהוּ
  choice: seine Hand wird sich gegen die Hand des anderen erheben
  rationale: Die konkrete Wiederholung von „Hand“ bleibt erhalten. Die ungewöhnliche Bildsprache macht den unmittelbaren gewaltsamen Angriff der einen Person auf die andere anschaulich.
theological_decisions:
- issue: Art des von Gott verursachten Durcheinanders
  choice: Die Panik kommt vom HERRN und bricht innerhalb der Gruppe aus.
  alternative: Die Wendung kann allgemeiner als ein mit dem Eingreifen des HERRN verbundenes Durcheinander verstanden werden.
  rationale: מְהוּמַת יְהוָה bezeichnet am natürlichsten eine vom HERRN bewirkte Panik. Die anschließende gegenseitige Gewalt bestätigt den Gedanken innerer Auflösung, ohne die Aussage über den Text hinaus dogmatisch auszugestalten.
- issue: Distributive maskuline Formulierung
  choice: „Einer … des anderen“
  alternative: „Jeder Mann … seines Nächsten“
  rationale: אִישׁ ist grammatisch maskulin und distributiv. Die gewählte deutsche Wechselkonstruktion gibt die Einzel- und Gegenseitigkeitsbedeutung präzise und idiomatisch wieder; der Vers beschreibt die Angehörigen der feindlichen Gruppe, ohne ausdrücklich eine ausschließlich männliche Aussage zu thematisieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „An jenem Tag“ entspricht prophetischem Sprachgebrauch; „vom HERRN kommende“ macht die hebräische Genitivverbindung verständlich, ohne ihre Ursache abzuschwächen. Die Wiederholung von „Hand“ wurde bewusst bewahrt.
