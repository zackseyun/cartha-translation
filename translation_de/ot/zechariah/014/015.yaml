revisions:
- from: Und ebenso wird die Seuche über die Pferde, die Maultiere, die Kamele, die Esel und alle Tiere in jenen Lagern kommen – eine Seuche wie diese.
  to: Und ebenso wird die Seuche, die die Pferde, die Maultiere, die Kamele, die Esel und alle Tiere in jenen Lagern trifft, wie diese Seuche sein.
  rationale: Die Revision bewahrt die Aussage von תִּהְיֶה als „wird ... sein“ und gibt den abschließenden Vergleich mit כַּמַּגֵּפָה הַזֹּאת bestimmt und explizit wieder. Der Relativsatz macht die im Deutschen sonst schwerfällige hebräische Konstruktverbindung („Seuche der Pferde ...“) idiomatisch verständlich, ohne den Sinn zu erweitern.
