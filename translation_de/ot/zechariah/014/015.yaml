  text: וְ/כֵ֨ן תִּֽהְיֶ֜ה מַגֵּפַ֣ת הַ/סּ֗וּס הַ/פֶּ֨רֶד֙ הַ/גָּמָ֣ל וְ/הַ/חֲמ֔וֹר וְ/כָ֨ל הַ/בְּהֵמָ֔ה אֲשֶׁ֥ר יִהְיֶ֖ה בַּ/מַּחֲנ֣וֹת הָ/הֵ֑מָּה כַּ/מַּגֵּפָ֖ה הַ/זֹּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/015.yaml
  text: And so the plague will be on the horse[a], the mule, the camel, the donkey, and every animal that is in those camps—the same plague as this.
translation:
  language: de
  text: Und ebenso wird die Seuche, die die Pferde, die Maultiere, die Kamele, die Esel und alle Tiere in jenen Lagern trifft, wie diese Seuche sein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכֵן
  choice: Und ebenso
  rationale: Kennzeichnet die Entsprechung zum unmittelbar zuvor beschriebenen Gericht und gibt die verbindende wie vergleichende Funktion natürlich wieder.
- source_word: תִּהְיֶה מַגֵּפַת
  choice: wird die Seuche … kommen
  rationale: Das Deutsche verwendet bei einem eintretenden Unheil idiomatisch „über jemanden kommen“. So bleibt die Zukunftsaussage erhalten, ohne den Sinn von היה unnötig auszubauen.
- source_word: הַסּוּס הַפֶּרֶד הַגָּמָל וְהַחֲמוֹר
  choice: die Pferde, die Maultiere, die Kamele, die Esel
  rationale: Die hebräischen Singularformen bezeichnen die Tierarten kollektiv; natürliche deutsche Listen verwenden hier den Plural.
- source_word: וְכָל הַבְּהֵמָה
  choice: und alle Tiere
  rationale: בְּהֵמָה bezeichnet hier umfassend die in den Lagern befindlichen Tiere. „Vieh“ wäre möglich, könnte den Bezug aber unnötig auf Nutztiere verengen.
- source_word: אֲשֶׁר יִהְיֶה בַּמַּחֲנוֹת הָהֵמָּה
  choice: in jenen Lagern
  rationale: Der Relativsatz wird im Deutschen knapp und eindeutig an „alle Tiere“ angeschlossen. מַחֲנוֹת wird sachlich als „Lager“ und nicht deutend als „Heere“ wiedergegeben.
- source_word: כַּמַּגֵּפָה הַזֹּאת
  choice: eine Seuche wie diese
  rationale: Das vergleichende כְּ wird direkt wiedergegeben. Die Formulierung bewahrt den Rückverweis auf die zuvor geschilderte Seuche, ohne eine über den Wortlaut hinausgehende völlige Identität zu behaupten.
theological_decisions:
- issue: Art des Gerichts über die Tiere in den feindlichen Lagern
  choice: Die konkrete Seuche wird auf die Tiere in den Lagern ausgedehnt.
  alternative: מַגֵּפָה allgemeiner als „Plage“ oder „Heimsuchung“ wiederzugeben.
  rationale: Die Wiederholung von מַגֵּפָה im unmittelbaren Zusammenhang spricht für eine konkrete, schwere Seuche als Gericht. Die vergleichende Schlusswendung bleibt dabei gewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der kollektive hebräische Singular der Tierbezeichnungen wird zugunsten einer natürlichen deutschen Aufzählung im Plural wiedergegeben. Der Gedankenstrich hebt den abschließenden Vergleich hervor.
