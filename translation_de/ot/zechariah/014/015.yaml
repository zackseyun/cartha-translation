  - severity: low
    issue: „eine Seuche wie diese“ ist unbestimmt und elliptisch.
    rationale: Der hebräische Schluss כַּמַּגֵּפָה הַזֹּאת verweist bestimmt auf „diese Seuche“. Die Wiederholung „wie diese Seuche“ ist im Deutschen klarer und wahrt den Rückverweis.
  revised_text: Und ebenso wird die Seuche, die die Pferde, die Maultiere, die Kamele, die Esel und alle Tiere in jenen Lagern trifft, wie diese Seuche sein.
