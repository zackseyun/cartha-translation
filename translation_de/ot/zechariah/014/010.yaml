source:
  edition: WLC
  text: יִסּ֨וֹב כָּל הָ/אָ֤רֶץ כָּ/עֲרָבָה֙ מִ/גֶּ֣בַע לְ/רִמּ֔וֹן נֶ֖גֶב יְרֽוּשָׁלִָ֑ם וְֽ/רָאֲמָה֩ וְ/יָשְׁבָ֨ה תַחְתֶּ֜י/הָ לְ/מִ/שַּׁ֣עַר בִּנְיָמִ֗ן עַד מְק֞וֹם שַׁ֤עַר הָֽ/רִאשׁוֹן֙ עַד שַׁ֣עַר הַ/פִּנִּ֔ים וּ/מִגְדַּ֣ל חֲנַנְאֵ֔ל עַ֖ד יִקְבֵ֥י הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/010.yaml
  text: All the land will be turned into a plain[a], from Geba to Rimmon south of Jerusalem. But Jerusalem will be raised up and will remain in its place, from the Benjamin Gate to the place of the First Gate, to the Corner Gate, and from the Tower of Hananel to the king’s winepresses.
translation:
  language: de
  text: Das ganze Land wird sich in eine Ebene verwandeln[a], von Geba bis Rimmon südlich von Jerusalem. Jerusalem aber wird erhöht werden und an seiner Stätte bleiben, vom Benjamintor bis zur Stelle des Ersten Tores, bis zum Ecktor und vom Turm Hananel bis zu den Keltern des Königs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie die Arabah“. Das Hebräische kann das Land mit der Arabah, einer Senke beziehungsweise Steppenebene, vergleichen, statt unmittelbar seine Verwandlung in eine Ebene auszudrücken.'
    reason: lexikalische Alternative und echte syntaktisch-semantische Mehrdeutigkeit
lexical_decisions:
- source_word: יִסּוֹב
  choice: wird sich verwandeln
  rationale: Das Verb beschreibt hier im Zusammenhang eine topografische Veränderung. Die reflexive Form ist im Deutschen natürlich und lässt offen, wodurch die Veränderung bewirkt wird.
- source_word: כָּל הָאָרֶץ
  choice: das ganze Land
  rationale: Die anschließenden Ortsangaben begrenzen den Blick auf eine Region; „Land“ vermeidet daher eine unbegründete Ausweitung auf die gesamte Erde.
- source_word: כָּעֲרָבָה
  choice: in eine Ebene
  rationale: עֲרָבָה kann eine Ebene oder Steppe beziehungsweise die Arabah bezeichnen. Im Haupttext verdeutlicht „Ebene“ die topografische Aussage; die mögliche Vergleichsbedeutung bleibt in der Fußnote erhalten.
- source_word: מִגֶּבַע לְרִמּוֹן נֶגֶב יְרוּשָׁלִָם
  choice: von Geba bis Rimmon südlich von Jerusalem
  rationale: Die Ortsnamen geben die Ausdehnung an; „südlich von Jerusalem“ bestimmt am natürlichsten Rimmon näher.
- source_word: וְרָאֲמָה
  choice: wird erhöht werden
  rationale: Die Form bezeichnet die erhöhte Lage Jerusalems im Gegensatz zum eingeebneten Umland. Das Passiv gibt den resultativen Sinn angemessen wieder.
- source_word: וְיָשְׁבָה תַחְתֶּיהָ
  choice: wird an seiner Stätte bleiben
  rationale: Die Wendung bezeichnet das feste Verbleiben Jerusalems an seinem angestammten Ort. „An seiner Stätte“ wahrt den räumlichen und feierlichen Ton.
- source_word: לְמִשַּׁעַר בִּנְיָמִן
  choice: vom Benjamintor
  rationale: In der folgenden Grenzbeschreibung fungiert das Tor als Ausgangspunkt; „vom“ ist dafür im Deutschen idiomatisch.
- source_word: מְקוֹם שַׁעַר הָרִאשׁוֹן
  choice: die Stelle des Ersten Tores
  rationale: מָקוֹם verweist ausdrücklich auf den Ort oder Standort des Tores, möglicherweise weil es nicht mehr bestand.
- source_word: שַׁעַר הַפִּנִּים
  choice: Ecktor
  rationale: Die Bezeichnung leitet sich von „Ecke/Winkel“ ab; „Ecktor“ ist knapp und verständlich.
- source_word: מִגְדַּל חֲנַנְאֵל
  choice: Turm Hananel
  rationale: Die Konstruktion verbindet die Gebäudebezeichnung mit dem Eigennamen; diese Form ist im Deutschen natürlich.
- source_word: יִקְבֵי הַמֶּלֶךְ
  choice: Keltern des Königs
  rationale: יֶקֶב bezeichnet eine Weinpresse beziehungsweise Kelteranlage. „Keltern“ ist präzise, verständlich und bewahrt den Plural.
theological_decisions:
- issue: Umfang der geografischen Veränderung
  choice: regionale Veränderung des Landes um Jerusalem
  alternative: Veränderung der ganzen Erde
  rationale: Die konkreten Grenzen von Geba bis Rimmon und die anschließenden Jerusalemer Stadtmarken sprechen hier für einen regionalen Bezug. „Land“ bewahrt zugleich den möglichen weiteren Bedeutungsumfang von אֶרֶץ, ohne ihn auf die gesamte Welt festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Orts- und Bauwerksbezeichnungen bleiben knapp und nachvollziehbar; die poetisch-prophetische Gegenüberstellung zwischen eingeebnetem Land und erhöhtem Jerusalem wird bewahrt.
