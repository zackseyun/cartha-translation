  rationale: Die Revision korrigiert die fehlerhafte Beschreibung des hebräischen Wortlauts in Fußnote [b], beseitigt den unklaren Pronomenbezug und bewahrt zugleich die strittige Satzverbindung transparent. Die Hauptfassung folgt der masoretischen Gliederung und dem unmittelbaren Kontext, ohne die alternative Lesung aus dem Textbefund auszuschließen.
