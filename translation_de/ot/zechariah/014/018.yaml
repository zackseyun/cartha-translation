review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von „hinaufzieht und nicht kommt“, „Plage“, „Völker“, „Yahweh“ und dem Fest ist grundsätzlich quellentreu. Die schwierige Folge וְלֹא עֲלֵיהֶם תִּהְיֶה הַמַּגֵּפָה darf jedoch weder als bloßes „und nicht auf sie“ bezeichnet noch ohne Kennzeichnung eindeutig aufgelöst werden. Die masoretische Gliederung ermöglicht die im Kontext von V. 17 naheliegende Ergänzung „kein Regen ...; dann die Plage“; die andere Lesung muss als Möglichkeit erhalten bleiben.
  naturalness: Der bisherige Satz „Sie wird die Plage treffen“ hat einen unklaren beziehungsweise grammatisch unstimmigen Bezug, weil das Hauptwort „Volk“ sächlich ist. Mit „die Familie Ägyptens“ und dem femininen Bezug „sie“ ist die Satzführung klarer und zugleich näher am Hebräischen.
  terminology: „Familie Ägyptens“ bewahrt die kollektive Singularform מִשְׁפַּחַת, ohne sie zu „Volk“ zu verallgemeinern. „Hinaufziehen“, „Plage“, „Yahweh“, „Völker“ und „Laubhüttenfest“ sind angemessene moderne, würdige Begriffe.
  issues:
  - severity: medium
    issue: Die Fußnote [b] beschreibt den hebräischen Wortlaut unzutreffend.
    rationale: Der Text lautet nicht nur „und nicht auf sie“, sondern enthält anschließend auch תִּהְיֶה הַמַּגֵּפָה („wird/die Plage wird sein“). Die Anmerkung muss die gesamte syntaktische Schwierigkeit korrekt benennen.
  - severity: medium
    issue: Der Bezug von „Sie wird die Plage treffen“ ist nach „das Volk Ägyptens“ grammatisch und stilistisch unklar.
    rationale: Das Pronomen „sie“ passt nicht ohne Weiteres zu dem sächlichen Kollektivum „Volk“. Eine nähere Wiedergabe des femininen hebräischen Kollektivbegriffs löst dies.
  - severity: low
    issue: Die Textlösung der schwierigen Klausel braucht eine präzisere Transparenzanmerkung.
    rationale: Die Ergänzung von „Regen“ ist kontextuell plausibel, aber nicht ausdrücklich im Vers vorhanden; die alternative syntaktische Verbindung ist textlich möglich und soll nicht unterdrückt werden.
  revised_text: Und wenn die Familie[a] Ägyptens nicht hinaufzieht und nicht kommt, wird kein Regen auf sie fallen; dann trifft sie die Plage, mit der Yahweh die Völker schlägt, die nicht hinaufziehen, um das Laubhüttenfest[c] zu feiern[b].
