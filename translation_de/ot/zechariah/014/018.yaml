- from: Und wenn das Volk[a] Ägyptens nicht hinaufzieht und nicht kommt, wird auch auf sie kein Regen fallen[b]. Sie wird die Plage treffen, mit der Yahweh die Völker schlägt, die nicht hinaufziehen, um das Laubhüttenfest[c] zu feiern.
