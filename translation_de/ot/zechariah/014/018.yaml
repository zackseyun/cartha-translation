id: ZEC.14.18
reference: Zechariah 14:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אִם מִשְׁפַּ֨חַת מִצְרַ֧יִם לֹֽא תַעֲלֶ֛ה וְ/לֹ֥א בָאָ֖ה וְ/לֹ֣א עֲלֵי/הֶ֑ם תִּֽהְיֶ֣ה הַ/מַּגֵּפָ֗ה אֲשֶׁ֨ר יִגֹּ֤ף יְהוָה֙ אֶת הַ/גּוֹיִ֔ם אֲשֶׁר֙ לֹ֣א יַֽעֲל֔וּ לָ/חֹ֖ג אֶת חַ֥ג הַ/סֻּכּֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/018.yaml
  text: And if the family of Egypt does not go up and does not come[c][b][a], then the plague will not be upon them—the plague with which Yahweh strikes the nations that do not go up to celebrate the Feast of Booths.
translation:
  language: de
  text: Und wenn die Familie[a] Ägyptens nicht hinaufzieht und nicht kommt, wird kein Regen auf sie fallen; dann trifft sie die Plage, mit der Yahweh die Völker schlägt, die nicht hinaufziehen, um das Laubhüttenfest[c] zu feiern[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Familie“ oder „die Sippe Ägyptens“; die Formulierung bezeichnet Ägypten als Kollektiv.'
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Text ist syntaktisch schwierig. Nach der masoretischen Gliederung lässt sich im Anschluss an Vers 17 verstehen: „Kein Regen wird auf sie fallen; dann trifft sie die Plage.“ Auch möglich ist: „Dann wird die Plage nicht über sie kommen – die Plage, mit der …“'
    reason: textual_ambiguity
  - marker: c
    text: 'Auch: „Fest der Hütten“; hebräisch: Sukkot.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפַּחַת מִצְרַיִם
  choice: das Volk Ägyptens
  rationale: מִשְׁפָּחָה bezeichnet wörtlich eine Familie oder Sippe, kann hier aber kollektiv die Bevölkerung Ägyptens meinen. „Volk Ägyptens“ ist im Deutschen natürlich und wahrt den kollektiven Sinn; die wörtlichere Möglichkeit wird in einer Fußnote genannt.
- source_word: תַעֲלֶה
  choice: hinaufzieht
  rationale: עלה ist das übliche Verb für den Aufstieg nach Jerusalem, besonders zu einem Wallfahrtsfest. „Hinaufziehen“ erhält diesen räumlichen und kultischen Anklang.
- source_word: וְלֹא בָאָה
  choice: und nicht kommt
  rationale: בוא bedeutet „kommen, eintreten“. Beide Verben werden beibehalten, statt die hebräische Doppelformulierung zu glätten.
- source_word: וְלֹא עֲלֵיהֶם
  choice: wird auch auf sie kein Regen fallen
  rationale: Der hebräische Satz lässt nach „nicht auf sie“ das aus Vers 17 zu ergänzende Wort „Regen“ aus. Die Ergänzung wird für verständliches Deutsch aufgenommen und durch eine Fußnote kenntlich gemacht.
- source_word: הַמַּגֵּפָה
  choice: die Plage
  rationale: מַגֵּפָה bezeichnet eine durch einen Schlag hervorgerufene Plage oder Heimsuchung. „Plage“ entspricht zugleich dem folgenden Verb נָגַף.
- source_word: יִגֹּף
  choice: schlägt
  rationale: נָגַף bedeutet „schlagen, heimsuchen“. „Schlägt“ bewahrt die Wortverbindung mit „Plage“, ohne altertümlich zu klingen.
- source_word: הַגּוֹיִם
  choice: die Völker
  rationale: גּוֹיִם meint hier allgemein die Völker beziehungsweise Nationen; „Völker“ vermeidet eine spätere konfessionelle Zuspitzung durch „Heiden“.
- source_word: לָחֹג
  choice: zu feiern
  rationale: Das Verb חגג bezeichnet das Begehen oder Feiern eines Festes. „Feiern“ ist klares, gegenwärtiges Deutsch.
- source_word: חַג הַסֻּכּוֹת
  choice: das Laubhüttenfest
  rationale: „Laubhüttenfest“ ist die im Deutschen geläufige Bezeichnung und gibt das Bild von סֻכּוֹת, den Hütten, wieder.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname יהוה wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Elliptische und schwierige Formulierung nach der Bedingung über Ägypten
  choice: „wird auch auf sie kein Regen fallen. Sie wird die Plage treffen“
  alternative: „wird die Plage nicht über sie kommen – die Plage, mit der …“
  rationale: 'Die masoretische Akzentsetzung trennt וְלֹא עֲלֵיהֶם („und nicht auf sie“) von תִּהְיֶה הַמַּגֵּפָה („die Plage wird sein“). Im Zusammenhang mit Vers 17 liegt eine Ellipse von „Regen“ nahe: Auch auf Ägypten fällt kein Regen; darüber hinaus trifft es die genannte Plage. Die Ergänzung wird transparent ausgewiesen, während die alternative syntaktische Verbindung in der Fußnote erhalten bleibt.'
- issue: Bezug des göttlichen Gerichts auf Ägypten und die übrigen Völker
  choice: Ägypten erfährt sowohl ausbleibenden Regen als auch die Plage, die die nicht hinaufziehenden Völker trifft
  alternative: Ägypten bleibt ausdrücklich von der Plage verschont
  rationale: Die Satzglieder und die masoretische Akzentsetzung stützen die Abfolge von ausbleibendem Regen und Plage. Die Übersetzung harmonisiert den Text nicht mit Annahmen über Ägyptens Abhängigkeit vom Nil, sondern lässt die umfassende Gerichtsaussage stehen.
- issue: Wiedergabe des Tetragramms יהוה
  choice: Yahweh
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich; die Umschrift bewahrt seinen Charakter als Eigenname.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Hinaufziehen“ bewahrt den Wallfahrtscharakter, während „Laubhüttenfest“ die geläufige deutsche Festbezeichnung bietet. Die ungewöhnliche hebräische Doppelung „hinaufzieht und … kommt“ bleibt bewusst erhalten. Die zentrale syntaktische Schwierigkeit wird nicht stillschweigend geglättet, sondern im Text sinnvoll wiedergegeben und in Fußnote [b] offengelegt.
