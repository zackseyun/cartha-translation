source:
  edition: WLC
  text: וְ֠/הָיָה כָּל סִ֨יר בִּ/ירוּשָׁלִַ֜ם וּ/בִֽ/יהוּדָ֗ה קֹ֚דֶשׁ לַ/יהוָ֣ה צְבָא֔וֹת וּ/בָ֨אוּ֙ כָּל הַ/זֹּ֣בְחִ֔ים וְ/לָקְח֥וּ מֵ/הֶ֖ם וּ/בִשְּׁל֣וּ בָ/הֶ֑ם וְ/לֹא יִהְיֶ֨ה כְנַעֲנִ֥י ע֛וֹד בְּ/בֵית יְהוָ֥ה צְבָא֖וֹת בַּ/יּ֥וֹם הַ/הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/021.yaml
  text: And every pot in Jerusalem and in Judah will be holy to Yahweh of hosts[a], and all who sacrifice will come and take from them and boil in them. And there will no longer be a Canaanite in the house of Yahweh of hosts on that day.
translation:
  language: de
  text: Und jeder Kochtopf in Jerusalem und Juda wird dem HERRN der Heerscharen heilig sein. Alle, die Opfer darbringen, werden kommen, davon nehmen und darin kochen. Und an jenem Tag wird es im Haus des HERRN der Heerscharen keinen Kanaaniter[a] mehr geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Händler; das hebräische Wort kann in manchen Zusammenhängen auch diese Bedeutung haben.'
    reason: alternative_reading
lexical_decisions:
- source_word: סִיר
  choice: Kochtopf
  rationale: Das Wort bezeichnet ein Gefäß zum Kochen. „Kochtopf“ ist im modernen Deutsch natürlich und stellt den Bezug zum anschließenden Kochen klar her.
- source_word: קֹדֶשׁ
  choice: heilig
  rationale: Die prädikative Form bezeichnet die Töpfe als für JHWH ausgesondert. „Heilig“ bewahrt die kultische und theologische Aussage.
- source_word: יְהוָה צְבָאוֹת
  choice: der HERR der Heerscharen
  rationale: „HERR“ gibt den Gottesnamen JHWH nach der üblichen deutschen Bibeltradition wieder; „der Heerscharen“ bewahrt den festen prophetischen Gottestitel.
- source_word: הַזֹּבְחִים
  choice: alle, die Opfer darbringen
  rationale: Das substantivierte Partizip bezeichnet Menschen, die opfern. Die gewählte Formulierung ist verständlich, würdevoll und vermeidet das unnatürliche „die Opfernden“.
- source_word: מֵהֶם
  choice: davon
  rationale: Das Pronomen bezieht sich auf die Kochtöpfe. „Davon nehmen“ gibt knapp wieder, dass Töpfe aus ihrer Menge genommen werden.
- source_word: וּבִשְּׁלוּ בָהֶם
  choice: und darin kochen
  rationale: Das Verb kann Kochen beziehungsweise Sieden bezeichnen. „Darin kochen“ ist idiomatisch und fügt kein im Hebräischen unausgesprochenes Objekt hinzu.
- source_word: כְנַעֲנִי
  choice: Kanaaniter
  rationale: Die gewöhnliche Bedeutung ist „Kanaaniter“. Die ebenfalls mögliche Bedeutung „Händler“ wird wegen der echten lexikalischen und kontextuellen Mehrdeutigkeit in einer Fußnote bewahrt.
- source_word: בְּבֵית יְהוָה צְבָאוֹת
  choice: im Haus des HERRN der Heerscharen
  rationale: „Haus“ entspricht dem hebräischen Ausdruck unmittelbar und bewahrt dessen traditionelle Bezeichnung für den Tempel.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Dies ist eine natürliche deutsche Wiedergabe der prophetischen Zeitformel.
theological_decisions:
- issue: Bedeutung von כְנַעֲנִי im Schlusssatz
  choice: Kanaaniter im Haupttext
  alternative: Händler oder Kaufmann
  rationale: Das hebräische Wort bezeichnet gewöhnlich einen Kanaaniter, kann aber in manchen Zusammenhängen auch einen Händler meinen. Der Haupttext bewahrt die wörtliche und kanonisch geprägte Bezeichnung, ohne die mögliche Aussage über Handel im Tempel auszuschließen; diese bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem prophetischem Ton. Die Satzstruktur bleibt eng am Hebräischen, wird aber durch natürliche deutsche Bezüge wie „davon“ und „darin“ geglättet. Die echte Mehrdeutigkeit des Schlussbegriffs wird nicht im Haupttext aufgelöst.
