  text: וְ/הָיָ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא לֹֽא יִהְיֶ֣ה א֔וֹר יְקָר֖וֹת יקפאו/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/006.yaml
  text: 'And it will happen on that day: there will be no light[a]; the glorious ones will congeal.'
translation:
  language: de
  text: 'Und an jenem Tag wird es geschehen: Es wird kein Licht geben[a]; die kostbaren Dinge werden erstarren.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder nach einer anderen traditionellen Deutung: „Es wird weder Licht noch Kälte noch Frost geben.“ Der hebräische Text des letzten Satzteils ist schwierig und wird unterschiedlich verstanden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: Und … wird es geschehen
  rationale: Gibt die prophetische Zukunftsformel in natürlichem, gehobenem Gegenwartsdeutsch wieder und bewahrt ihren vorhersagenden Charakter.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Entspricht der wiederkehrenden prophetischen Zeitangabe und klingt im Deutschen idiomatisch und würdevoll.
- source_word: לֹא יִהְיֶה אוֹר
  choice: Es wird kein Licht geben
  rationale: Klare Wiedergabe des verneinten Existenzsatzes ohne zusätzliche Deutung.
- source_word: יְקָרוֹת
  choice: die Herrlichen
  rationale: Bewahrt den Grundsinn von Kostbarkeit, Pracht oder Herrlichkeit und lässt offen, ob damit leuchtende Himmelserscheinungen gemeint sind. Die ungewöhnliche Substantivierung spiegelt die Schwierigkeit des Hebräischen.
- source_word: יקפאון
  choice: werden erstarren
  rationale: Gibt das Bild des Gerinnens, Gefrierens oder Starrwerdens wieder, ohne es deutend zu „erlöschen“ oder „schwächer werden“ umzuschreiben.
theological_decisions:
- issue: Deutung der schwierigen Schlussklausel יְקָרוֹת יקפאון
  choice: 'Relativ nah am masoretischen Wortlaut: „die Herrlichen werden erstarren“'
  alternative: '„Es wird weder Licht noch Kälte noch Frost geben“; außerdem möglich: „Die Lichter werden schwächer“'
  rationale: Textform, Syntax und Wortbedeutung der Schlussklausel sind umstritten. Der Haupttext bewahrt deshalb die fremdartige Bildsprache des masoretischen Textes, statt eine glättende Rekonstruktion als sicher auszugeben; die verbreitete traditionelle Deutung wird in der Fußnote genannt.
translation_notes:
  register: Modernes Standarddeutsch in würdigem prophetischem Stil. Die ungewöhnliche Formulierung „die Herrlichen werden erstarren“ ist bewusst beibehalten, um die echte Unklarheit des hebräischen Textes nicht vorschnell aufzulösen.
