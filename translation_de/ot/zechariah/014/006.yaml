  source_fidelity: Die Wiedergabe der prophetischen Einleitung, der Zeitangabe und der Verneinung von Licht ist quellentreu. Die schwierige Schlussklausel wird zutreffend als bildhaft und unsicher behandelt. „Die Herrlichen“ legt im heutigen Deutsch jedoch nahe, dass erhabene Personen gemeint sind, und gibt die wahrscheinlich sachbezogene Substantivierung von יְקָרוֹת weniger angemessen wieder.
  naturalness: „Und an jenem Tag wird es geschehen“ und „Es wird kein Licht geben“ sind natürliches modernes Standarddeutsch in angemessen gehobenem prophetischem Register. „Die Herrlichen werden erstarren“ ist zwar bewusst fremdartig, klingt aber vor allem personenbezeichnend. „Die kostbaren Dinge werden erstarren“ ist verständlicher und bewahrt die Sachambiguität der hebräischen Formulierung.
  terminology: „Kostbar“ gibt den Grundwert von יקר („kostbar, wertvoll, prächtig“) unmittelbarer wieder als „herrlich“. „Erstarren“ kann die unsichere Vorstellung von Gefrieren/Gerinnen abbilden, ohne eine Deutung wie Erlöschen oder Verdunkeln festzulegen. Die Fußnote wahrt die traditionelle alternative Deutung und ist korrekt am Ausdruck „kein Licht“ verankert.
