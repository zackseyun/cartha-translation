source:
  edition: WLC
  text: וְ/הָיָ֧ה יְהוָ֛ה לְ/מֶ֖לֶךְ עַל כָּל הָ/אָ֑רֶץ בַּ/יּ֣וֹם הַ/ה֗וּא יִהְיֶ֧ה יְהוָ֛ה אֶחָ֖ד וּ/שְׁמ֥/וֹ אֶחָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/009.yaml
  text: And Yahweh will be king over all the earth[a]. On that day Yahweh will be one[b], and his name one.
translation:
  language: de
  text: Und Yahweh wird König sein über die ganze Erde. An jenem Tag wird Yahweh einzig sein[a] und sein Name einzig[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Yahweh wird allein sein“ oder „Yahweh wird eins sein“. Das hebräische Wort bedeutet wörtlich „einer/eins“ und kann auch Ausschließlichkeit oder Einzigkeit ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und sein Name allein“ oder „und sein Name einzigartig“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Und … wird … sein
  rationale: Das Qal-Perfekt mit vorangestelltem וְ hat im prophetischen Zusammenhang Zukunftsbedeutung. „Wird … sein“ gibt diese natürlich und ohne altertümlichen Ton wieder.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname יהוה wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לְמֶלֶךְ
  choice: König sein
  rationale: Die Präposition לְ bezeichnet hier Stellung beziehungsweise Funktion. Die natürliche deutsche Formulierung lautet „König sein“.
- source_word: עַל כָּל הָאָרֶץ
  choice: über die ganze Erde
  rationale: עַל bezeichnet die königliche Herrschaft über etwas. Im eschatologischen Zusammenhang ist הָאָרֶץ hier umfassend als „Erde“ zu verstehen, nicht nur als ein bestimmtes Land.
- source_word: בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Die geläufige prophetische Zeitformel wird in natürlichem, gehobenem Deutsch wiedergegeben.
- source_word: יִהְיֶה יְהוָה אֶחָד
  choice: Yahweh wird einer sein
  rationale: אֶחָד bedeutet unmittelbar „einer“. Die bewusst knappe Formulierung bewahrt die mögliche Bedeutungsspanne von Einheit, Einzigkeit und Ausschließlichkeit.
- source_word: וּשְׁמוֹ אֶחָד
  choice: und sein Name einer
  rationale: Die parallele Wiedergabe erhält die prägnante Struktur des Hebräischen und vermeidet, die Aussage vorschnell auf „allein“ oder „einzig“ festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext nennt ausdrücklich יהוה. Die Transliteration „Yahweh“ bewahrt den persönlichen Gottesnamen.
- issue: Bedeutung von אֶחָד in „Yahweh wird einer sein“
  choice: Die Grundbedeutung „einer“ bleibt im Haupttext erhalten.
  alternative: Yahweh wird allein sein; Yahweh wird einzigartig sein
  rationale: Der hebräische Ausdruck kann Einheit, Einzigkeit oder ausschließliche Anerkennung bezeichnen. Der Haupttext soll diese theologische Spannung nicht einseitig auflösen.
- issue: Bedeutung von אֶחָד in „sein Name einer“
  choice: Die parallele Grundbedeutung „einer“ bleibt erhalten.
  alternative: sein Name allein; sein Name einzigartig
  rationale: Die Wiederholung von אֶחָד verbindet beide Satzglieder. Eine freiere Festlegung würde die Mehrdeutigkeit und den Parallelismus abschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht verdichtete Formulierung „einer sein“ bewahrt bewusst den Parallelismus und die Mehrdeutigkeit des hebräischen Textes; die Fußnoten bieten die idiomatischeren Deutungsmöglichkeiten.
