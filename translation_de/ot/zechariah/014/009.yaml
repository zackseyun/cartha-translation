    issue: „Yahweh wird einer sein … sein Name einer“
    rationale: Die Formulierung ist im Deutschen nicht natürlich und kann die Aussage verfälschen, weil „einer“ bei einer Person gewöhnlich ein Exemplar innerhalb einer Gruppe bezeichnet. Das zweite Vorkommen („sein Name einer“) ist zudem nicht idiomatisch.
