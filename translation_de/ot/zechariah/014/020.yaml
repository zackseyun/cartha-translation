id: ZEC.14.20
reference: Zechariah 14:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא יִֽהְיֶה֙ עַל מְצִלּ֣וֹת הַ/סּ֔וּס קֹ֖דֶשׁ לַֽ/יהוָ֑ה וְ/הָיָ֤ה הַ/סִּירוֹת֙ בְּ/בֵ֣ית יְהוָ֔ה כַּ/מִּזְרָקִ֖ים לִ/פְנֵ֥י הַ/מִּזְבֵּֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/020.yaml
  text: On that day[a], there will be on the bells of the horses[c][b], “Holy to Yahweh,” and the pots in the house of Yahweh will be like the bowls before the altar.
translation:
  language: de
  text: 'An jenem Tag wird auf den Schellen der Pferde stehen: „Heilig für den HERRN“[a][b]. Und die Töpfe im Haus des HERRN werden wie die Schalen vor dem Altar sein[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dem HERRN heilig“ beziehungsweise „Heiligkeit für den HERRN“. Die hebräische Wendung erinnert an die Inschrift auf dem goldenen Stirnblatt des Hohenpriesters in 2. Mose 28,36.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet wahrscheinlich kleine klingende Metallteile am Pferdegeschirr.
    reason: cultural_note
  - marker: c
    text: 'Oder: „Becken“. Gemeint sind heilige Gefäße, die beim Dienst am Altar verwendet wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Bewahrt die geläufige prophetische Zeitformel und ihren vorausweisenden Charakter in natürlichem Deutsch.
- source_word: יִהְיֶה עַל
  choice: wird auf ... stehen
  rationale: Im Deutschen bezeichnet „auf etwas stehen“ idiomatisch das Vorhandensein einer Aufschrift, ohne ausdrücklich ein im Hebräischen nicht genanntes Verb wie „eingraviert sein“ einzuführen.
- source_word: מְצִלּוֹת הַסּוּס
  choice: Schellen der Pferde
  rationale: מְצִלּוֹת bezeichnet wahrscheinlich kleine klingende Metallteile am Pferdegeschirr; der hebräische Singular „das Pferd“ ist kollektiv zu verstehen.
- source_word: קֹדֶשׁ לַיהוָה
  choice: „Heilig für den HERRN“
  rationale: Die knappe kultische Inschrift wird bewahrt; „für“ gibt die Zugehörigkeit beziehungsweise Weihung wieder und erinnert an Exodus 28,36.
- source_word: יְהוָה
  choice: der HERR
  rationale: Die traditionelle ehrfürchtige Wiedergabe des Tetragramms ist im deutschen Bibelregister verständlich; die Kapitälchenform wird durch Großbuchstaben angezeigt.
- source_word: הַסִּירוֹת
  choice: die Töpfe
  rationale: Der allgemeine Ausdruck bezeichnet Gefäße zum Kochen oder Sieden und sollte nicht unnötig auf eine bestimmte Gefäßform eingeengt werden.
- source_word: בְּבֵית יְהוָה
  choice: im Haus des HERRN
  rationale: Bewahrt die hebräische Wendung und lässt ihren klaren Tempelbezug bestehen.
- source_word: כַּמִּזְרָקִים
  choice: wie die Schalen
  rationale: מִזְרָקִים sind kultische Schalen oder Becken; „Schalen“ ist verständlich und lässt die konkrete Gefäßform hinreichend offen.
- source_word: לִפְנֵי הַמִּזְבֵּחַ
  choice: vor dem Altar
  rationale: Wörtliche und zugleich idiomatische Wiedergabe der kultischen Ortsangabe.
theological_decisions:
- issue: Ausweitung kultischer Heiligkeit auf gewöhnliche Gegenstände
  choice: Die Pferdeschellen tragen dieselbe Heiligkeitsformel wie die priesterliche Goldplatte, und die Tempeltöpfe werden den Altarschalen gleichgestellt.
  alternative: Nur ein allgemeines Bild künftigen Segens ohne konkrete Aufhebung der Unterscheidung zwischen heilig und gewöhnlich.
  rationale: Wortlaut und Vergleich des Verses deuten auf eine weitreichende Heiligung hin; die Übersetzung bildet diese Spannung ab, ohne sie im Haupttext dogmatisch auszudeuten.
- issue: Bedeutung von קֹדֶשׁ לַיהוָה
  choice: Heilig für den HERRN
  alternative: Heiligkeit dem HERRN / dem HERRN heilig
  rationale: Die gewählte Form bewahrt sowohl den Charakter einer knappen Inschrift als auch den Sinn von Weihe und Zugehörigkeit; die mögliche nominale Wiedergabe wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper prophetischer Satzführung. „Schellen“ ist gegenüber „Glocken“ für kleine klingende Teile am Pferdegeschirr präziser. Die Wiederholung von „HERRN“ und der Ausdruck „Haus des HERRN“ bewahren die kultische Prägung des Hebräischen.
