source:
  edition: WLC
  text: הִנֵּ֥ה יֽוֹם בָּ֖א לַֽ/יהוָ֑ה וְ/חֻלַּ֥ק שְׁלָלֵ֖/ךְ בְּ/קִרְבֵּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/001.yaml
  text: Behold[a], a day is coming for Yahweh, when your plunder will be divided in your midst.
translation:
  language: de
  text: Sieh, ein Tag kommt für den HERRN,[a] und deine Beute wird in deiner Mitte verteilt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell auch: „Sieh, ein Tag des HERRN kommt.“ Wörtlich lautet das Hebräische: „Ein Tag kommt für den HERRN.“'
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh
  rationale: Der Aufmerksamkeitsruf leitet eine feierliche prophetische Ankündigung ein. „Sieh“ bewahrt diese Funktion in würdigem, heutigem Deutsch besser als das altertümliche „Siehe“.
- source_word: יוֹם
  choice: ein Tag
  rationale: Das artikellose Substantiv führt einen bevorstehenden, bedeutsamen Tag ein; daher ist „ein Tag“ angemessener als „der Tag“.
- source_word: בָּא
  choice: kommt
  rationale: Das hebräische Partizip hat hier futurische, unmittelbar bevorstehende Bedeutung. Das deutsche Präsens „kommt“ gibt dies natürlich wieder.
- source_word: לַיהוָה
  choice: für den HERRN
  rationale: Die Präposition ל bezeichnet hier eine Beziehung oder Zuordnung. Die formal nahe Wiedergabe wahrt den Unterschied zur üblichen Genitivformel „Tag des HERRN“, ohne deren Anklang auszuschließen.
- source_word: וְחֻלַּק
  choice: da wird ... verteilt
  rationale: Das Pual bezeichnet eine passive Handlung, die im prophetischen Zusammenhang zukünftig ist. „Wird verteilt“ ist klar und natürlich; „da“ verbindet die Folgehandlung idiomatisch mit der Zeitankündigung.
- source_word: שְׁלָלֵךְ
  choice: deine Beute
  rationale: Das Wort bezeichnet im Krieg erbeutete Güter. Das feminine Singularsuffix spricht Jerusalem als weiblich gedachte Stadt an.
- source_word: בְּקִרְבֵּךְ
  choice: mitten in dir
  rationale: Die Wendung lokalisiert die Verteilung innerhalb der angesprochenen Stadt. „Mitten in dir“ bewahrt sowohl die Ortsangabe als auch die feminine Singularanrede.
theological_decisions:
- issue: Beziehung von לַיהוָה zur prophetischen Tagesformel
  choice: für den HERRN
  alternative: ein Tag des HERRN
  rationale: Im Hebräischen steht die Präposition ל und nicht unmittelbar eine Genitiv- oder Status-constructus-Verbindung. Der Haupttext hält diese sprachliche Besonderheit fest; die traditionelle, sachlich naheliegende Wiedergabe wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischem Ton. Der Gottesname wird gemäß Vorgabe als „der HERR“ wiedergegeben. Die feminine Singularanrede an Jerusalem bleibt durch „deine“ und „dir“ erkennbar.
