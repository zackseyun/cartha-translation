id: ZEC.14.8
reference: Zechariah 14:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא יֵצְא֤וּ מַֽיִם חַיִּים֙ מִ/יר֣וּשָׁלִַ֔ם חֶצְיָ֗/ם אֶל הַ/יָּם֙ הַ/קַּדְמוֹנִ֔י וְ/חֶצְיָ֖/ם אֶל הַ/יָּ֣ם הָ/אַחֲר֑וֹן בַּ/קַּ֥יִץ וּ/בָ/חֹ֖רֶף יִֽהְיֶֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/008.yaml
  text: And on that day living waters will flow out from Jerusalem[a], half of them to the eastern sea and half of them to the western sea[c][b]; it will be so in summer as well as in winter.
translation:
  language: de
  text: 'An jenem Tag wird lebendiges Wasser[a] aus Jerusalem hervorströmen: Die eine Hälfte wird zum östlichen Meer[b] fließen, die andere Hälfte zum westlichen Meer[c]. Im Sommer wie im Winter wird es so sein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „frisches“ beziehungsweise „fließendes Wasser“. Wörtlich: „lebendiges Wasser“, eine geläufige hebräische Bezeichnung für fließendes oder lebenspendendes Wasser.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist das Meer östlich von Jerusalem, traditionell mit dem Toten Meer gleichgesetzt.
    reason: cultural_note
  - marker: c
    text: Gemeint ist das Meer westlich von Jerusalem, traditionell mit dem Mittelmeer gleichgesetzt.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: wird …
  rationale: Die prophetische Zukunftsformel wird im Deutschen durch eine natürliche Futurkonstruktion wiedergegeben; ein zusätzliches „es wird geschehen“ wäre hier unnötig schwerfällig.
- source_word: בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Bewahrt die geläufige prophetische Zeitformel und ihren endzeitlichen Horizont in natürlichem Standarddeutsch.
- source_word: יֵצְאוּ
  choice: wird … hervorströmen
  rationale: Das Verb bedeutet grundsätzlich „hinausgehen/hervorkommen“; bei Wasser gibt „hervorströmen“ den konkreten Vorgang idiomatisch wieder.
- source_word: מַיִם חַיִּים
  choice: lebendiges Wasser
  rationale: Die feste hebräische Wendung wird möglichst direkt bewahrt. Der deutsche Kollektivsingular „Wasser“ ist natürlicher als „Wasser“ im Plural und lässt sowohl die konkrete als auch die mögliche theologische Resonanz offen.
- source_word: מִירוּשָׁלַם
  choice: aus Jerusalem
  rationale: Gibt den bezeichneten Ausgangspunkt knapp und direkt wieder.
- source_word: חֶצְיָם
  choice: die eine Hälfte … die andere Hälfte
  rationale: Die beiden Hälften des Wassers werden im Deutschen klar und ohne unnötige Wiederholung bezeichnet.
- source_word: הַיָּם הַקַּדְמוֹנִי
  choice: das östliche Meer
  rationale: קַדְמוֹנִי bezeichnet hier in der geografischen Gegenüberstellung das Meer im Osten. Die traditionelle Identifikation wird nicht in den Haupttext eingetragen.
- source_word: הַיָּם הָאַחֲרוֹן
  choice: das westliche Meer
  rationale: Als Gegenstück zum östlichen beziehungsweise vorderen Meer bezeichnet die Wendung das Meer im Westen; die Übersetzung wahrt die Richtungsangabe.
- source_word: בַּקַּיִץ וּבָחֹרֶף
  choice: Im Sommer wie im Winter
  rationale: Bringt die ganzjährige Beständigkeit des Wasserflusses in einer natürlichen deutschen Wendung zum Ausdruck.
- source_word: יִהְיֶה
  choice: wird es so sein
  rationale: Der knappe hebräische Singular verweist auf den beschriebenen Zustand beziehungsweise Vorgang. Die Formulierung wahrt diese Kürze, ohne einen im Hebräischen nicht vorhandenen Plural zu erzwingen.
theological_decisions:
- issue: Mögliche symbolische Bedeutung von מַיִם חַיִּים („lebendiges Wasser“)
  choice: Die Wendung „lebendiges Wasser“ bleibt im Haupttext stehen, ohne sie ausschließlich physisch oder symbolisch auszulegen.
  alternative: „frisches Wasser“ oder „fließendes Wasser“ als rein sachliche Deutung; alternativ eine ausdrücklich geistliche Deutung als lebensspendendes Wasser
  rationale: Die hebräische Wendung kann konkret frisches beziehungsweise fließendes Wasser bezeichnen und zugleich im prophetischen Zusammenhang theologische Resonanz tragen. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Hervorströmen“ vermittelt die Bewegung des Wassers anschaulich, ohne den Text auszudeuten. Die Satzteilung erhöht die Verständlichkeit; „Im Sommer wie im Winter“ gibt die ganzjährige Dauer idiomatisch wieder.
