id: ZEC.14.19
reference: Zechariah 14:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: זֹ֥את תִּהְיֶ֖ה חַטַּ֣את מִצְרָ֑יִם וְ/חַטַּאת֙ כָּל הַ/גּוֹיִ֔ם אֲשֶׁר֙ לֹ֣א יַֽעֲל֔וּ לָ/חֹ֖ג אֶת חַ֥ג הַ/סֻּכּֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/019.yaml
  text: This will be the punishment of Egypt[b][a], and the punishment of all the nations that do not go up to celebrate the Festival of Booths.
translation:
  language: de
  text: Das wird die Strafe[a] für Ägypten und die Strafe für alle Völker sein, die nicht hinaufziehen, um das Laubhüttenfest[b] zu feiern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das Strafgericht« beziehungsweise »die Schuld«. Das hebräische Wort bedeutet sonst häufig »Sünde« oder »Sündopfer«; hier bezeichnet es im Zusammenhang die wegen der Weigerung eintretende Gerichtsfolge.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Fest der Hütten«; traditionell auch »Hüttenfest« genannt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת תִּהְיֶה
  choice: Das wird … sein
  rationale: Die feminine Demonstrativform verweist auf die zuvor beschriebene Folge; zusammen mit dem Imperfekt ergibt sich eine natürliche zukunftsbezogene Aussage.
- source_word: חַטַּאת
  choice: Strafe
  rationale: Obwohl das Wort häufig „Sünde“ oder „Sündopfer“ bedeutet, bezeichnet es hier im Zusammenhang von Vers 18–19 die als Gericht verhängte Folge der Weigerung.
- source_word: מִצְרָיִם
  choice: Ägypten
  rationale: Übliche deutsche Wiedergabe des Ländernamens.
- source_word: כָּל הַגּוֹיִם
  choice: alle Völker
  rationale: Gemeint sind hier umfassend die nichtisraelitischen Völker; „Völker“ ist im Deutschen sachgerecht und natürlich.
- source_word: אֲשֶׁר לֹא יַעֲלוּ
  choice: die nicht hinaufziehen
  rationale: Bewahrt das biblische Pilgeridiom des Hinaufziehens nach Jerusalem und lässt offen, ob Gewohnheit oder künftige Weigerung im Vordergrund steht.
- source_word: לָחֹג
  choice: um … zu feiern
  rationale: Der Infinitiv von חגג bezeichnet das Feiern beziehungsweise Begehen eines Wallfahrtsfestes.
- source_word: חַג הַסֻּכּוֹת
  choice: Laubhüttenfest
  rationale: Dies ist die geläufige und zugleich anschauliche deutsche Bezeichnung; sie gibt die Hütten-Motivik von סֻכּוֹת wieder.
theological_decisions:
- issue: Bedeutung von חַטַּאת im Zusammenhang des endzeitlichen Gerichts
  choice: Strafe
  alternative: Sünde; Schuld; Strafgericht
  rationale: Der Satz fasst die zuvor angekündigte Gerichtsfolge für Ägypten und die übrigen Völker zusammen. „Strafe“ gibt diese kontextuelle Bedeutung wieder, ohne einen Opferbezug einzutragen; die grundsätzlich mögliche Bedeutung „Sünde/Schuld“ bleibt in der Fußnote sichtbar.
- issue: Wiedergabe von חַג הַסֻּכּוֹת
  choice: Laubhüttenfest
  alternative: Fest der Hütten; Hüttenfest
  rationale: „Laubhüttenfest“ ist im modernen deutschen Bibel- und Allgemeingebrauch verständlich und wahrt den Bezug auf die Hütten, ohne eine konfessionelle Sonderdeutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Hinaufziehen“ bewahrt bewusst die Jerusalemer Wallfahrtssprache. Die Wiederholung von „die Strafe“ entspricht der hebräischen Wiederholung und sorgt für Klarheit.
