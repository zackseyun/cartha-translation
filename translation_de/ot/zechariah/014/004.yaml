reference: Zechariah 14:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/עָמְד֣וּ רַגְלָ֣י/ו בַּ/יּוֹם הַ֠/הוּא עַל הַ֨ר הַ/זֵּתִ֜ים אֲשֶׁ֨ר עַל פְּנֵ֥י יְרוּשָׁלִַם֮ מִ/קֶּדֶם֒ וְ/נִבְקַע֩ הַ֨ר הַ/זֵּיתִ֤ים מֵֽ/חֶצְי/וֹ֙ מִזְרָ֣חָ/ה וָ/יָ֔מָּ/ה גֵּ֖יא גְּדוֹלָ֣ה מְאֹ֑ד וּ/מָ֨שׁ חֲצִ֥י הָ/הָ֛ר צָפ֖וֹנָ/ה וְ/חֶצְי/וֹ נֶֽגְבָּ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/004.yaml
  text: On that day his feet will stand on the Mount of Olives[a], which is before Jerusalem on the east; and the Mount of Olives will be split in two from east to west into a very great valley[b], with half of the mountain moving northward and half of it southward.
translation:
  language: de
  text: An jenem Tag werden seine Füße auf dem Ölberg stehen, der Jerusalem im Osten gegenüberliegt[a]. Der Ölberg wird sich von seiner Mitte aus nach Osten und Westen spalten[b], sodass ein sehr großes Tal entsteht. Die eine Hälfte des Berges wird nach Norden weichen, die andere nach Süden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der östlich vor Jerusalem liegt“.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Verb bedeutet „sich spalten“ oder „aufbrechen“; die folgenden Aussagen beschreiben, wie die beiden Berghälften auseinanderweichen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָמְדוּ רַגְלָיו
  choice: werden seine Füße … stehen
  rationale: Die konkrete körperliche Bildsprache des Hebräischen bleibt erhalten; die prophetische Verbform wird im Deutschen als Zukunftsaussage wiedergegeben.
- source_word: בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Natürliche und zugleich würdevolle Wiedergabe der wiederkehrenden prophetischen Zeitformel.
- source_word: הַר הַזֵּתִים / הַר הַזֵּיתִים
  choice: Ölberg
  rationale: Die geläufige deutsche geografische Bezeichnung gibt die hebräische Wortverbindung präzise wieder.
- source_word: אֲשֶׁר עַל פְּנֵי יְרוּשָׁלִַם מִקֶּדֶם
  choice: der Jerusalem im Osten gegenüberliegt
  rationale: עַל־פְּנֵי bezeichnet eine Lage vor beziehungsweise gegenüber Jerusalem; מִקֶּדֶם bestimmt diese als östlich.
- source_word: וְנִבְקַע
  choice: wird sich … spalten
  rationale: Der Nifal von בקע bezeichnet das Aufbrechen oder Auseinanderbrechen. Das reflexive deutsche Verb bildet den Vorgang natürlich ab.
- source_word: מֵחֶצְיוֹ מִזְרָחָה וָיָמָּה
  choice: von seiner Mitte aus nach Osten und Westen
  rationale: Die Formulierung bewahrt ausdrücklich den im Hebräischen genannten Ausgangspunkt in der Mitte und die beiden Richtungen.
- source_word: גֵּיא גְּדוֹלָה מְאֹד
  choice: ein sehr großes Tal
  rationale: Direkte, idiomatische Wiedergabe von גֵּיא und der Verstärkung גְּדוֹלָה מְאֹד.
- source_word: וּמָשׁ
  choice: wird … weichen
  rationale: Das Verb bezeichnet das Sichentfernen oder Zurückweichen einer Berghälfte und wird hier als Folge der Spaltung verstanden.
- source_word: צָפוֹנָה / נֶגְבָּה
  choice: nach Norden / nach Süden
  rationale: Die Richtungsformen werden in natürlichem Deutsch als Richtungsangaben wiedergegeben.
theological_decisions:
- issue: Anthropomorphe Beschreibung der göttlichen Gestalt im Zusammenhang
  choice: „seine Füße … stehen“ wird wörtlich beibehalten.
  alternative: „seine Gegenwart wird ruhen“ oder „er wird erscheinen“
  rationale: Der hebräische Text verwendet bewusst konkrete körperliche Sprache. Da der Bezug im Zusammenhang auf JHWH weist, darf die Übersetzung die daraus entstehende theologische Spannung nicht durch eine erklärende Umschreibung auflösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die Satzfolge wurde gegenüber einer langen deutschen Satzperiode leicht gegliedert; räumliche Angaben und konkrete Bildsprache bleiben erhalten.
