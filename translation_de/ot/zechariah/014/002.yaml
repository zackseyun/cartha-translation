revisions:
- from: Und ich werde alle Nationen zum Kampf gegen Jerusalem versammeln. Die Stadt wird eingenommen, die Häuser werden geplündert und die Frauen vergewaltigt[a]. Die Hälfte der Stadt wird in die Verbannung ziehen; doch der Rest des Volkes wird nicht aus der Stadt weggerissen[b].
  to: Und ich werde alle Nationen zum Kampf gegen Jerusalem versammeln. Die Stadt wird eingenommen, die Häuser werden geplündert und die Frauen vergewaltigt[a]. Die Hälfte der Stadt wird in die Verbannung gehen müssen; doch der Rest des Volkes wird nicht aus der Stadt vertrieben werden[b].
  rationale: Die Revision vermeidet bei der Schlusswendung die unnötig bildhafte und semantisch verengende Formulierung „weggerissen“. „Nicht aus der Stadt vertrieben“ bildet im Kontrast zur Verbannung der einen Hälfte die naheliegende Lesart ab; die mögliche Vernichtungsbedeutung bleibt ausdrücklich in der Fußnote erhalten. „Gehen müssen“ macht den Zwang der Exilierung in natürlichem Deutsch deutlich. Die Fußnote zur sexuellen Gewalt erklärt den Befund präzise, ohne eine nicht gegebene wörtliche Formulierung zu behaupten.
