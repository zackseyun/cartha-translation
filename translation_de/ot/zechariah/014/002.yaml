  text: וְ/אָסַפְתִּ֨י אֶת כָּל הַ/גּוֹיִ֥ם אֶֽל יְרוּשָׁלִַם֮ לַ/מִּלְחָמָה֒ וְ/נִלְכְּדָ֣ה הָ/עִ֗יר וְ/נָשַׁ֨סּוּ֙ הַ/בָּ֣תִּ֔ים וְ/הַ/נָּשִׁ֖ים תשגלנה וְ/יָצָ֞א חֲצִ֤י הָ/עִיר֙ בַּ/גּוֹלָ֔ה וְ/יֶ֣תֶר הָ/עָ֔ם לֹ֥א יִכָּרֵ֖ת מִן הָ/עִֽיר־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/002.yaml
  text: And I will gather all the nations against Jerusalem for battle[a], and the city will be captured, and the houses plundered, and the women raped, and half of the city will go out into exile[b]; but the rest of the people will not be cut off from the city.
translation:
  language: de
  text: Und ich werde alle Nationen zum Kampf gegen Jerusalem versammeln. Die Stadt wird eingenommen, die Häuser werden geplündert und die Frauen vergewaltigt[a]. Die Hälfte der Stadt wird in die Verbannung gehen müssen; doch der Rest des Volkes wird nicht aus der Stadt vertrieben werden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Ketiv-Ausdruck ist derb und bezeichnet sexuelle Gewalt. Euphemistischer: „die Frauen werden geschändet“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wird nicht ausgerottet werden“. Das hebräische Verb kann sowohl Entfernen als auch Vernichten bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָסַפְתִּי אֶת כָּל הַגּוֹיִם
  choice: Und ich werde alle Nationen … versammeln
  rationale: Das Qal Perfekt der ersten Person Singular hat im prophetischen Zusammenhang futurische Bedeutung. „Versammeln“ gibt die aktive göttliche Veranlassung wieder; „Nationen“ passt zum geopolitisch-militärischen Kontext.
- source_word: אֶל יְרוּשָׁלִַם לַמִּלְחָמָה
  choice: zum Kampf gegen Jerusalem
  rationale: אֶל bezeichnet formal die Richtung auf Jerusalem zu; der feindliche Kontext wird im Deutschen natürlich mit „gegen Jerusalem“ ausgedrückt. „Zum Kampf“ gibt לַמִּלְחָמָה idiomatisch wieder.
- source_word: וְנִלְכְּדָה הָעִיר
  choice: Die Stadt wird eingenommen
  rationale: Das Nifal von לכד bezeichnet die Einnahme einer Stadt im Krieg. „Eingenommen“ ist im Deutschen dafür die geläufige und präzise Formulierung.
- source_word: וְנָשַׁסּוּ הַבָּתִּים
  choice: die Häuser werden geplündert
  rationale: Das Verb bezeichnet gewaltsames Plündern beziehungsweise Berauben und wird mit dem üblichen deutschen Ausdruck für Kriegsplünderung wiedergegeben.
- source_word: וְהַנָּשִׁים תשגלנה
  choice: die Frauen vergewaltigt
  rationale: Die Ketiv-Form ist ein derber Ausdruck für sexuelle Gewalt. „Vergewaltigt“ gibt die Härte und den konkreten Sinn ohne beschönigenden Euphemismus wieder.
- source_word: וְיָצָא חֲצִי הָעִיר בַּגּוֹלָה
  choice: Die Hälfte der Stadt wird in die Verbannung ziehen
  rationale: בַּגּוֹלָה bezeichnet Verbannung beziehungsweise Deportation. Die aktive Form „wird … ziehen“ bewahrt die grammatische Gestalt des hebräischen Verbs, ohne die erzwungene Verbannung zu verschleiern.
- source_word: וְיֶתֶר הָעָם
  choice: doch der Rest des Volkes
  rationale: יֶתֶר bedeutet „Rest“ oder „Übriggebliebene“. „Rest“ ist natürlich und vermeidet die möglicherweise zusätzlich theologisch aufgeladene Bezeichnung „Überrest“.
- source_word: לֹא יִכָּרֵת מִן הָעִיר
  choice: wird nicht aus der Stadt weggerissen
  rationale: Das Nifal von כרת kann Abschneiden, Entfernen oder Vernichten bezeichnen. „Aus der Stadt weggerissen“ bewahrt das kräftige Bild und passt zur Präposition מִן, ohne die mögliche Vernichtungsbedeutung völlig auszuschließen.
theological_decisions:
- issue: Wiedergabe der sexuellen Gewalt
  choice: Direkte Übersetzung mit „die Frauen vergewaltigt“
  alternative: „die Frauen geschändet“
  rationale: Der hebräische Ketiv-Ausdruck ist bewusst derb und bezeichnet sexuelle Gewalt. Eine direkte Wiedergabe verhindert, dass die geschilderte Gräueltat durch einen traditionellen Euphemismus verharmlost wird.
- issue: Bedeutung von לֹא יִכָּרֵת מִן הָעִיר
  choice: „wird nicht aus der Stadt weggerissen“
  alternative: „wird nicht vernichtet“ oder „wird nicht aus der Stadt entfernt“
  rationale: Die Wendung kann sowohl Entfernung als auch Vernichtung anklingen lassen. Der Haupttext hält das Bild des Abschneidens beziehungsweise gewaltsamen Entfernens fest; die Fußnote nennt die stärkere mögliche Bedeutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Passivformulierungen unterstreichen die Abfolge der Kriegsgräuel. Die sexuelle Gewalt wird bewusst klar benannt; bei der Schlusswendung bleibt die hebräische Bedeutungsbreite durch Haupttext und Fußnote erhalten.
