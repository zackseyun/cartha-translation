source:
  edition: WLC
  text: וְ֠/הָיָה אֲשֶׁ֨ר לֹֽא יַעֲלֶ֜ה מֵ/אֵ֨ת מִשְׁפְּח֤וֹת הָ/אָ֨רֶץ֙ אֶל יְר֣וּשָׁלִַ֔ם לְ/הִֽשְׁתַּחֲוֺ֔ת לְ/מֶ֖לֶךְ יְהוָ֣ה צְבָא֑וֹת וְ/לֹ֥א עֲלֵי/הֶ֖ם יִהְיֶ֥ה הַ/גָּֽשֶׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/017.yaml
  text: And if any of the families of the earth does not go up to Jerusalem to worship the King[a], Yahweh of Armies[b], there will be no rain on them.
translation:
  language: de
  text: Und wenn eine der Sippen der Erde nicht nach Jerusalem hinaufzieht, um sich vor dem König, Jahwe der Heerscharen, niederzuwerfen[a], wird kein Regen auf sie fallen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um ihn anzubeten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אֲשֶׁר
  choice: Und wenn eine
  rationale: Die hebräische Fügung leitet hier eine Bedingung mit ihrer Folge ein. „Und wenn eine“ gibt dies im Deutschen natürlich wieder, ohne die Wendung unnötig wörtlich nachzubilden.
- source_word: לֹא יַעֲלֶה
  choice: nicht ... hinaufzieht
  rationale: עלה bezeichnet beim Weg nach Jerusalem idiomatisch wie topografisch ein Hinaufziehen; das Präsens passt im deutschen Konditionalsatz.
- source_word: מֵאֵת מִשְׁפְּחוֹת הָאָרֶץ
  choice: von den Sippen der Erde
  rationale: מִשְׁפָּחוֹת bezeichnet größere Familien- oder Sippenverbände. „Sippen“ vermeidet hier die missverständliche Vorstellung einzelner Haushalte. Im internationalen Kontext von Sacharja 14 bezeichnet הָאָרֶץ die Erde.
- source_word: אֶל יְרוּשָׁלַםִ
  choice: nach Jerusalem
  rationale: Natürliches deutsches Richtungsgefüge bei einer Stadt.
- source_word: לְהִשְׁתַּחֲוֺת
  choice: um sich ... niederzuwerfen
  rationale: Das Verb bezeichnet das ehrerbietige Niederwerfen und hat hier eindeutig kultische Bedeutung. Die konkrete Gebärde wird bewahrt, ohne den Sinn auf das allgemeinere „anbeten“ zu verengen.
- source_word: לְמֶלֶךְ
  choice: vor dem König
  rationale: Durch „vor“ wird die körperliche Ausrichtung des Niederwerfens idiomatisch ausgedrückt. „König“ ist Titel des unmittelbar genannten Jahwe.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben. „Heerscharen“ ist im Deutschen würdevoll und umfasst besser als das engere „Heere“ die mögliche militärische und himmlisch-kosmische Weite von צְבָאוֹת.
- source_word: וְלֹא עֲלֵיהֶם יִהְיֶה הַגָּשֶׁם
  choice: wird auf sie kein Regen fallen
  rationale: Diese natürliche deutsche Formulierung bewahrt das auf עַל beruhende Bild des auf Menschen beziehungsweise ihr Gebiet fallenden Regens und bringt die angekündigte Folge klar zum Ausdruck.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von הָאָרֶץ
  choice: der Erde
  alternative: des Landes
  rationale: Der Zusammenhang handelt von den Sippen der Völker, die nach Jerusalem ziehen sollen; daher ist die universale Bedeutung „Erde“ wahrscheinlicher als die Beschränkung auf das Land Israel.
- issue: Bedeutungsumfang von צְבָאוֹת
  choice: Heerscharen
  alternative: Heere
  rationale: „Heerscharen“ wahrt die mögliche Spannung zwischen irdischen Heeren und himmlischen Mächten, ohne den Ausdruck auf nur eine dieser Deutungen festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz ist als natürliche Bedingung formuliert; „hinaufzieht“ bewahrt das Jerusalemer Pilger- und Höhenmotiv. Die konkrete Bedeutung des Niederwerfens steht im Haupttext, während die geläufige kultische Wiedergabe in der Fußnote erscheint.
