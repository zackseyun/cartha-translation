source:
  edition: WLC
  text: וְ/הָיָ֣ה יוֹם אֶחָ֗ד ה֛וּא יִוָּדַ֥ע לַֽ/יהוָ֖ה לֹא י֣וֹם וְ/לֹא לָ֑יְלָה וְ/הָיָ֥ה לְ/עֵֽת עֶ֖רֶב יִֽהְיֶה אֽוֹר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/007.yaml
  text: And it will be one day[a], known to Yahweh, neither day nor night[c][b]; but at evening time there will be light.
translation:
  language: de
  text: 'Und es wird ein Tag sein[a], der Jahwe bekannt ist: nicht Tag und nicht Nacht[b]. Doch zur Abendzeit wird Licht sein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »ein Tag«. Im Zusammenhang kann dies seine Einmaligkeit oder seine besondere Art betonen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »weder Tag noch Nacht«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Und es wird … sein
  rationale: Die Form führt im prophetischen Zusammenhang ein zukünftiges Geschehen ein; die Wiedergabe bleibt nah an der hebräischen Struktur und klingt zugleich natürlich.
- source_word: יוֹם אֶחָד
  choice: ein Tag
  rationale: Wörtlich steht »ein Tag«. Der Kontext lässt sowohl die Einmaligkeit als auch die Besonderheit dieses Tages hervortreten, ohne dass »einzigartig« ausdrücklich im Lexem enthalten wäre.
- source_word: הוּא יִוָּדַע לַיהוָה
  choice: der Jahwe bekannt ist
  rationale: Das Pronomen nimmt »Tag« wieder auf. Die relative Formulierung gibt dies im Deutschen flüssig wieder; das Nifal von ידע mit ל bezeichnet hier das Bekanntsein für Jahwe.
- source_word: לֹא יוֹם וְלֹא לָיְלָה
  choice: nicht Tag und nicht Nacht
  rationale: Die ungewöhnliche doppelte Verneinung bewahrt die schroffe, paradoxe Aussage des Hebräischen stärker als die glattere Formulierung »weder Tag noch Nacht«.
- source_word: לְעֵת עֶרֶב
  choice: zur Abendzeit
  rationale: Die Wendung bezeichnet die Zeit des Abends; »zur Abendzeit« ist idiomatisch und quellennah.
- source_word: יִהְיֶה אוֹר
  choice: wird Licht sein
  rationale: 'Die knappe prädikative Aussage bewahrt die überraschende Umkehrung: Gerade zur Abendzeit ist Licht.'
theological_decisions:
- issue: Wesen des außergewöhnlichen Tages
  choice: Der Vers beschreibt einen einzelnen, außergewöhnlichen Tag, ohne seinen Ablauf oder seine heilsgeschichtliche Einordnung näher festzulegen.
  alternative: Eine ausschließlich astronomische Erscheinung, eine rein symbolische Heilsbeschreibung oder die Festlegung auf einen bestimmten endzeitlichen Zeitplan.
  rationale: Der hebräische Text schildert einen besonderen, Jahwe bekannten Tag mit paradoxen Lichtverhältnissen, bestimmt aber weder Mechanismus noch eschatologisches Schema.
- issue: Die Aussage »Jahwe bekannt«
  choice: Die offene Formulierung wird beibehalten.
  alternative: Ausdeutungen wie »dessen Zeitpunkt nur Jahwe kennt« oder »dessen Wesen Jahwe allein kennt«.
  rationale: Der Text nennt nicht ausdrücklich, was an diesem Tag Jahwe bekannt ist. Eine nähere Bestimmung würde die echte Mehrdeutigkeit auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die markante Wendung »nicht Tag und nicht Nacht« bleibt bewusst erhalten; kurze Hauptsätze und der Doppelpunkt bilden den feierlich-prophetischen Rhythmus nach.
