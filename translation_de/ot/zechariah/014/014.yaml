id: ZEC.14.14
reference: Zechariah 14:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/גַ֨ם יְהוּדָ֔ה תִּלָּחֵ֖ם בִּ/ירֽוּשָׁלִָ֑ם וְ/אֻסַּף֩ חֵ֨יל כָּל הַ/גּוֹיִ֜ם סָבִ֗יב זָהָ֥ב וָ/כֶ֛סֶף וּ/בְגָדִ֖ים לָ/רֹ֥ב מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/014.yaml
  text: 'And Judah also will fight at Jerusalem[a], and the wealth of all the surrounding nations will be gathered: gold and silver and garments, in very great abundance.'
translation:
  language: de
  text: 'Auch Juda wird in Jerusalem[a] kämpfen. Und der Reichtum aller Völker ringsum wird eingesammelt werden: Gold, Silber und Kleider in überaus großer Menge.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Auch Juda wird gegen Jerusalem kämpfen.“ Die hebräische Präposition bedeutet gewöhnlich „in“; aufgrund des Zusammenhangs verstehen manche sie hier jedoch im Sinn einer Gegnerschaft.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: Auch
  rationale: Die Verbindung aus Konjunktion und additiver Partikel führt den Gedanken fort und hebt hervor, dass Juda ebenfalls beteiligt ist. Im Deutschen gibt „Auch“ dies natürlich wieder.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Die im Deutschen etablierte Form des Eigennamens für das Volk beziehungsweise Gebiet Juda.
- source_word: תִּלָּחֵם
  choice: wird ... kämpfen
  rationale: Der Nifal von לחם bezeichnet hier die Beteiligung am Kampf. Die futurische Wiedergabe entspricht der prophetischen Abfolge.
- source_word: בִּירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Die Präposition ב ist zunächst lokativ und wird daher mit „in“ wiedergegeben. Da der Kontext auch ein Verständnis als Kampf gegen Jerusalem nahegelegt hat, wird diese Möglichkeit in einer Fußnote bewahrt.
- source_word: וְאֻסַּף
  choice: wird eingesammelt werden
  rationale: Die passive Form bezeichnet hier das Zusammentragen materieller Güter; in der prophetischen Abfolge ist sie futurisch zu verstehen.
- source_word: חֵיל
  choice: der Reichtum
  rationale: חֵיל kann Stärke, Heer oder Vermögen bezeichnen. Die anschließende Aufzählung von Gold, Silber und Kleidern bestimmt hier die materielle Bedeutung.
- source_word: כָּל הַגּוֹיִם סָבִיב
  choice: aller Völker ringsum
  rationale: Die Formulierung bewahrt sowohl die Gesamtheit der Völker als auch die räumliche Aussage von סָבִיב in natürlichem modernem Deutsch.
- source_word: זָהָב וָכֶסֶף וּבְגָדִים
  choice: Gold, Silber und Kleider
  rationale: Die direkte Aufzählung der Wertgegenstände wird klar und würdig wiedergegeben.
- source_word: לָרֹב מְאֹד
  choice: in überaus großer Menge
  rationale: Die Wendung bezeichnet eine stark gesteigerte Fülle; „überaus“ bewahrt die Intensivierung durch מְאֹד.
theological_decisions:
- issue: Ob בִּירוּשָׁלִָם bedeutet, dass Juda in Jerusalem oder gegen Jerusalem kämpft
  choice: Auch Juda wird in Jerusalem kämpfen
  alternative: Auch Juda wird gegen Jerusalem kämpfen
  rationale: Die Präposition ב hat am natürlichsten lokalen Sinn („in“). Weil der weitere Zusammenhang jedoch zu einer oppositionellen Deutung geführt hat, wird diese echte Auslegungsmöglichkeit in der Fußnote genannt, ohne die Spannung im Haupttext dogmatisch aufzulösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die Satzteilung erleichtert die Lesbarkeit; die konkrete Güterliste bleibt eng an der hebräischen Ausdrucksfolge.
