  text: וְ/נַסְתֶּ֣ם גֵּֽיא הָרַ֗/י כִּֽי יַגִּ֣יעַ גֵּי הָרִים֮ אֶל אָצַל֒ וְ/נַסְתֶּ֗ם כַּ/אֲשֶׁ֤ר נַסְתֶּם֙ מִ/פְּנֵ֣י הָ/רַ֔עַשׁ בִּ/ימֵ֖י עֻזִּיָּ֣ה מֶֽלֶךְ יְהוּדָ֑ה וּ/בָא֙ יְהוָ֣ה אֱלֹהַ֔/י כָּל קְדֹשִׁ֖ים עִמָּֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/005.yaml
  text: And you will flee by the valley of my mountains[a], for the valley of the mountains will reach to Azal. Yes, you will flee as you fled from before the earthquake in the days of Uzziah king of Judah. Then Yahweh my God will come[b], and all the holy ones with him.
translation:
  language: de
  text: Und ihr werdet durch das Tal meiner Berge fliehen, denn das Tal der Berge wird bis Azal reichen. Ihr werdet fliehen, wie ihr vor dem Erdbeben in den Tagen Usijas, des Königs von Juda, geflohen seid. Dann wird Yahweh, mein Gott, kommen — alle Heiligen mit dir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der masoretische Text hat „mit dir“. Andere Textzeugen und Übersetzungen lesen oder verstehen „mit ihm“. „Heilige“ kann himmlische Begleiter bezeichnen; andere verstehen darunter Engel oder geheiligte Menschen.
    reason: textual_variant_and_lexical_ambiguity
lexical_decisions:
- source_word: וְנַסְתֶּם
  choice: ihr werdet fliehen
  rationale: Das Verb נוּס bedeutet gewöhnlich „fliehen“. Die unmittelbar folgende Wiederholung כַּאֲשֶׁר נַסְתֶּם („wie ihr ... geflohen seid“) bestätigt diese Bedeutung.
- source_word: גֵּיא הָרַי
  choice: das Tal meiner Berge
  rationale: „Tal“ ist eine natürliche Wiedergabe von גיא; das Suffix der ersten Person Singular an הָרַי wird als „meiner“ ausdrücklich bewahrt.
- source_word: גֵּי הָרִים
  choice: das Tal zwischen den Bergen
  rationale: Die deutsche Formulierung gibt die topografische Beziehung natürlich wieder, ohne die Bedeutung des hebräischen Ausdrucks zu verengen.
- source_word: יַגִּיעַ ... אֶל אָצַל
  choice: wird bis Azal reichen
  rationale: Der Hifil von נגע bezeichnet hier die räumliche Ausdehnung; אָצַל ist ein Ortsname und wird als „Azal“ transliteriert.
- source_word: מִפְּנֵי הָרַעַשׁ
  choice: vor dem Erdbeben
  rationale: Die deutsche Wendung „vor dem Erdbeben fliehen“ gibt die hebräische Präposition מִפְּנֵי in diesem Zusammenhang idiomatisch wieder.
- source_word: וּבָא
  choice: Dann wird ... kommen
  rationale: „Dann“ macht die Abfolge im Zusammenhang deutlich, ohne über den Sinn der Konjunktion hinauszugehen.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהַי
  choice: mein Gott
  rationale: Das Suffix der ersten Person Singular wird ausdrücklich erhalten.
- source_word: כָּל קְדֹשִׁים
  choice: alle Heiligen
  rationale: קְדֹשִׁים bezeichnet allgemein heilige Wesen oder Personen. „Heilige“ bewahrt die Offenheit, ob himmlische Begleiter, Engel oder geheiligte Menschen gemeint sind.
- source_word: עִמָּךְ
  choice: mit dir
  rationale: Der masoretische Text hat eindeutig ein Suffix der zweiten Person Singular. Diese ungewöhnliche Anrede wird nicht stillschweigend zu „mit ihm“ geändert.
theological_decisions:
- issue: Identität der Heiligen, die Yahweh begleiten
  choice: alle Heiligen
  alternative: alle heiligen Engel / alle Heiligen Gottes
  rationale: Der hebräische Ausdruck legt nicht ausdrücklich fest, ob Engel, andere himmlische Wesen oder geheiligte Menschen gemeint sind. Die allgemeinere Wiedergabe bewahrt diese Spannung.
- issue: Personbezug in עִמָּךְ
  choice: mit dir
  alternative: mit ihm
  rationale: Der masoretische Text spricht in der zweiten Person Singular. Alte Übersetzungen und zahlreiche neuere Wiedergaben lesen sinngemäß „mit ihm“, doch die Hauptfassung folgt dem vorliegenden hebräischen Text und weist die Variante in einer Fußnote aus.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen; die Transliteration bewahrt ihn als Namen statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Fluchtformulierung des Hebräischen bleibt erhalten. „Usija“ folgt der im Deutschen üblichen biblischen Namensform. Die auffällige zweite Person Singular am Versende wird quellentreu bewahrt und erläutert.
