  text: כֹּ֗ל הַ/מִּשְׁפָּחוֹת֙ הַ/נִּשְׁאָר֔וֹת מִשְׁפָּחֹ֥ת מִשְׁפָּחֹ֖ת לְ/בָ֑ד וּ/נְשֵׁי/הֶ֖ם לְ/בָֽד׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/014.yaml
  text: all the families that remain[a], family by family by themselves, and their wives by themselves.
translation:
  language: de
  text: alle übrigen Sippen, jede Sippe für sich und ihre Frauen für sich.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Hebräischen: „Sippen, Sippen“. Die Wiederholung bedeutet hier „jede Sippe“ beziehungsweise „Sippe für Sippe“. „Ihre Frauen“ kann auch „ihre Ehefrauen“ bedeuten.'
    reason: Die Fußnote dokumentiert die distributive Wiederholung und bewahrt die lexikalische Mehrdeutigkeit von נְשֵׁיהֶם.
lexical_decisions:
- source_word: כֹּל הַמִּשְׁפָּחוֹת הַנִּשְׁאָרוֹת
  choice: alle übrigen Sippen
  rationale: כֹּל umfasst die Gesamtheit, הַנִּשְׁאָרוֹת bezeichnet die noch verbleibenden Gruppen. „Alle übrigen Sippen“ ist im Zusammenhang der zuvor einzeln genannten Abstammungsgruppen natürlich und präzise.
- source_word: מִשְׁפָּחֹת מִשְׁפָּחֹת
  choice: jede Sippe
  rationale: Die Wiederholung hat distributive Bedeutung. „Jede Sippe“ gibt diese Funktion in natürlichem modernem Deutsch wieder, ohne die hebräische Ausdrucksweise unnötig nachzuahmen.
- source_word: לְבָד
  choice: für sich
  rationale: „Für sich“ bezeichnet hier die getrennte Teilnahme jeder Gruppe und lässt offen, ob räumliche Trennung oder eigenständiges Trauern im Vordergrund steht.
- source_word: וּנְשֵׁיהֶם
  choice: und ihre Frauen
  rationale: נָשִׁים kann je nach Zusammenhang „Frauen“ oder „Ehefrauen“ bedeuten. Das deutsche „ihre Frauen“ bewahrt diese im Hebräischen vorhandene Bedeutungsbreite und die ausdrücklich geschlechtliche Unterscheidung.
- source_word: לְבָד
  choice: für sich
  rationale: Die Wiederholung wird beibehalten und betont, dass auch die Frauen getrennt für sich teilnehmen.
theological_decisions:
- issue: Getrennte Beteiligung von Männern und Frauen an der Trauer
  choice: Die Unterscheidung wird mit „und ihre Frauen für sich“ ausdrücklich bewahrt.
  alternative: Die Frauen in die jeweiligen Sippen einzuschließen oder die Formulierung geschlechtsneutral wiederzugeben.
  rationale: Der hebräische Text nennt die Frauen ausdrücklich als getrennte Gruppe. Eine Neutralisierung würde diese Spannung und die dargestellte Ordnung des Trauerns beseitigen.
translation_notes:
  register: Knappe, würdige Standardsprache. „Sippe“ passt zu den zuvor genannten Abstammungsgruppen besser als das im heutigen Deutsch enger verstandene „Familie“. Die zweimalige Wendung „für sich“ bewahrt den Nachdruck des hebräischen לְבָד.
