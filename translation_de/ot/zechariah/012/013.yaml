  text: מִשְׁפַּ֤חַת בֵּית לֵוִי֙ לְ/בָ֔ד וּ/נְשֵׁי/הֶ֖ם לְ/בָ֑ד מִשְׁפַּ֤חַת הַ/שִּׁמְעִי֙ לְ/בָ֔ד וּ/נְשֵׁי/הֶ֖ם לְ/בָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/013.yaml
  text: the family of the house of Levi by itself[a], and their wives by themselves; the family of the Shimeites by itself, and their wives by themselves.
translation:
  language: de
  text: die Sippe des Hauses Levi für sich und ihre Frauen für sich; die Sippe der Schimiter[a] für sich und ihre Frauen für sich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Sippe Schimis“. Das Hebräische bezeichnet wahrscheinlich die von Schimi abstammende Sippe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפַּחַת
  choice: die Sippe
  rationale: Die Konstruktform bezeichnet hier eine größere verwandtschaftliche Gruppe. „Sippe“ gibt diesen Sinn im Deutschen genauer wieder als das enger wirkende „Familie“ und passt zum genealogischen Zusammenhang.
- source_word: בֵּית לֵוִי
  choice: des Hauses Levi
  rationale: Die ausdrückliche Wiedergabe von בֵּית bewahrt den Gedanken der Abstammungslinie und folgt der genealogischen Formulierung des Hebräischen.
- source_word: לְבָד
  choice: für sich
  rationale: Die wiederholte Wendung klingt im modernen Deutschen natürlich und bewahrt zugleich den refrainartigen Nachdruck auf dem getrennten Trauern.
- source_word: וּנְשֵׁיהֶם
  choice: und ihre Frauen
  rationale: נָשִׁים kann „Frauen“ oder „Ehefrauen“ bedeuten. „Ihre Frauen“ lässt im Deutschen beide naheliegenden Nuancen zu und wahrt die im Text ausdrücklich markierte Trennung.
- source_word: הַשִּׁמְעִי
  choice: der Schimiter
  rationale: Die Form mit Artikel ist am ehesten eine kollektive Herkunftsbezeichnung für die von Schimi hergeleitete Sippe. „Schimiter“ gibt diese Gruppenbezeichnung knapp wieder; die alternative Analyse als Personenname wird in der Fußnote genannt.
theological_decisions:
- issue: Trennung von Männern und Frauen beim Trauern
  choice: Die Sippen und ihre Frauen werden jeweils ausdrücklich als getrennt trauernde Gruppen wiedergegeben.
  alternative: Die Aussage zu „jede Sippe für sich“ zusammenzufassen oder geschlechtsneutral wiederzugeben.
  rationale: Der hebräische Text wiederholt die Unterscheidung ausdrücklich. Die Übersetzung bewahrt diese Struktur, ohne zusätzliche Aussagen über Anlass oder Bedeutung der Trennung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die viermalige Wendung „für sich“ erhält den eindringlichen Parallelismus des hebräischen Verses; das Semikolon markiert die beiden parallel gebauten Sippengruppen.
