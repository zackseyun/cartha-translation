id: ZEC.12.12
reference: Zechariah 12:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/סָפְדָ֣ה הָ/אָ֔רֶץ מִשְׁפָּח֥וֹת מִשְׁפָּח֖וֹת לְ/בָ֑ד מִשְׁפַּ֨חַת בֵּית דָּוִ֤יד לְ/בָד֙ וּ/נְשֵׁי/הֶ֣ם לְ/בָ֔ד מִשְׁפַּ֤חַת בֵּית נָתָן֙ לְ/בָ֔ד וּ/נְשֵׁי/הֶ֖ם לְ/בָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/012.yaml
  text: 'And the land will mourn[a], each family by itself: the family of the house of David by itself, and their wives by themselves; the family of the house of Nathan by itself[b], and their wives by themselves.'
translation:
  language: de
  text: 'Und das Land[a] wird trauern, Sippe für Sippe[b], jede für sich: die Sippe des Hauses David für sich und ihre Frauen für sich; die Sippe des Hauses Nathan für sich und ihre Frauen für sich.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „die Erde“.
    reason: alternative_reading
  - marker: b
    text: Wörtlich „Sippen, Sippen“; die Wiederholung hat verteilenden Sinn.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָפְדָה
  choice: Und … wird trauern
  rationale: ספד bezeichnet Trauer oder Totenklage. „trauern“ ist im modernen Deutschen natürlich und lässt offen, in welcher Form die Klage zum Ausdruck kommt.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: אֶרֶץ kann „Land“ oder „Erde“ bedeuten. Da der Zusammenhang die Sippen Judas und Jerusalems nennt, ist hier „das Land“ die wahrscheinlichere kontextuelle Wiedergabe; die weitere Bedeutung bleibt in einer Fußnote erhalten.
- source_word: מִשְׁפָּחוֹת מִשְׁפָּחוֹת
  choice: Sippe für Sippe
  rationale: Die Wiederholung hat distributiven Sinn. „Sippe für Sippe“ gibt sowohl diese Verteilung als auch den rhythmischen Nachdruck des Hebräischen natürlich wieder.
- source_word: לְבָד
  choice: für sich
  rationale: לבד betont die getrennte Trauer der einzelnen Gruppen. Das wiederholte „für sich“ bewahrt diesen Nachdruck, ohne im Deutschen schwerfällig zu wirken.
- source_word: מִשְׁפַּחַת בֵּית דָּוִיד
  choice: die Sippe des Hauses David
  rationale: Die Konstruktverbindung bezeichnet den Familien- beziehungsweise Sippenverband der davidischen Dynastie. „Sippe des Hauses David“ ist präzise und verständlich.
- source_word: וּנְשֵׁיהֶם
  choice: und ihre Frauen
  rationale: אִשָּׁה kann „Frau“ oder „Ehefrau“ bedeuten. „ihre Frauen“ entspricht im familiären Kontext idiomatisch den Ehefrauen, bewahrt aber die lexikalische Weite besser als das ausdrücklichere „Ehefrauen“.
- source_word: מִשְׁפַּחַת בֵּית נָתָן
  choice: die Sippe des Hauses Nathan
  rationale: Die Formulierung bezeichnet die nach Nathan benannte Familienlinie und wird parallel zum Haus David wiedergegeben.
theological_decisions:
- issue: Reichweite von הָאָרֶץ im prophetischen Zusammenhang
  choice: das Land
  alternative: die Erde
  rationale: Die im unmittelbaren Zusammenhang aufgezählten judäischen und jerusalemer Sippen sprechen für das Land als Schauplatz der Trauer. Da das Wort auch „Erde“ bedeuten kann, wird diese echte Mehrdeutigkeit nicht ausgeschlossen, sondern in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Wendung „für sich“ bildet den starken separierenden Nachdruck des hebräischen לְבָד ab. „Sippe“ macht den größeren Familienverband deutlicher als das im Deutschen enger verstandene „Familie“.
