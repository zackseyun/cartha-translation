source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא יִגְדַּ֤ל הַ/מִּסְפֵּד֙ בִּ/יר֣וּשָׁלִַ֔ם כְּ/מִסְפַּ֥ד הֲדַדְ רִמּ֖וֹן בְּ/בִקְעַ֥ת מְגִדּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/011.yaml
  text: On that day the mourning in Jerusalem will become great[a], like the mourning of Hadad-rimmon in the plain of Megiddo.
translation:
  language: de
  text: An jenem Tag wird die Totenklage in Jerusalem groß werden, wie die Totenklage von Hadad-Rimmon[a] in der Ebene von Megiddo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hadad-Rimmon kann einen Ort bei Megiddo bezeichnen, möglicherweise in Verbindung mit der Totenklage um Josia (vgl. 2. Chronik 35,22–25), oder auf eine andere damals bekannte Klagetradition verweisen.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Die geläufige prophetische Zeitformel wird idiomatisch und mit ihrer vorausweisenden Kraft wiedergegeben.
- source_word: יִגְדַּל
  choice: wird … groß sein
  rationale: גדל kann „groß sein/werden“ oder „zunehmen“ bedeuten. Im Zusammenhang bezeichnet es das große Ausmaß der Totenklage; die Formulierung bleibt im Deutschen natürlich.
- source_word: הַמִּסְפֵּד
  choice: die Totenklage
  rationale: מִסְפֵּד bezeichnet eine öffentliche Klage, besonders angesichts eines Todes. „Totenklage“ bildet diesen Bezug präziser ab als das allgemeinere „Trauer“.
- source_word: בִּירוּשָׁלִַם
  choice: in Jerusalem
  rationale: Direkte lokale Wiedergabe des Ortsnamens.
- source_word: כְּמִסְפַּד
  choice: wie die Totenklage um
  rationale: כְּ führt den Vergleich ein. Das deutsche „um“ ist bei einer Totenklage idiomatisch, ohne die strittige Identität Hadad-Rimmons festzulegen.
- source_word: הֲדַד רִמּוֹן
  choice: Hadad-Rimmon
  rationale: Der nicht näher erklärte Eigenname wird transliteriert und nicht durch eine umstrittene historische oder kultische Deutung ersetzt.
- source_word: בְּבִקְעַת מְגִדּוֹן
  choice: in der Ebene von Megiddo
  rationale: בִּקְעָה bezeichnet eine breite Talebene oder Ebene; „Ebene“ passt hier zum topografischen Sinn.
theological_decisions:
- issue: Identität und Bezug von Hadad-Rimmon
  choice: Der Eigenname bleibt im Haupttext unaufgelöst; eine Fußnote nennt die wesentlichen Deutungsmöglichkeiten.
  alternative: Direkte Identifikation mit der Totenklage um König Josia oder mit einer kultischen Klage um eine Gottheit.
  rationale: Der hebräische Text erklärt Hadad-Rimmon nicht. Eine eindeutige Festlegung würde die echte historische und religionsgeschichtliche Mehrdeutigkeit beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Totenklage“ bewahrt den konkreten Charakter des öffentlichen Trauerrituals; der umstrittene Eigenname und seine Deutung bleiben transparent offen.
