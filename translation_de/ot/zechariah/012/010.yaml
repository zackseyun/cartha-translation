source:
  edition: WLC
  text: וְ/שָׁפַכְתִּי֩ עַל בֵּ֨ית דָּוִ֜יד וְ/עַ֣ל יוֹשֵׁ֣ב יְרוּשָׁלִַ֗ם ר֤וּחַ חֵן֙ וְ/תַ֣חֲנוּנִ֔ים וְ/הִבִּ֥יטוּ אֵלַ֖/י אֵ֣ת אֲשֶׁר דָּקָ֑רוּ וְ/סָפְד֣וּ עָלָ֗י/ו כְּ/מִסְפֵּד֙ עַל הַ/יָּחִ֔יד וְ/הָמֵ֥ר עָלָ֖י/ו כְּ/הָמֵ֥ר עַֽל הַ/בְּכֽוֹר־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/010.yaml
  text: And I will pour out on the house of David and on the inhabitants of Jerusalem a spirit of grace and pleas for mercy[a], and they will look to me, the one whom they pierced, and they will mourn for him as one mourns for an only son[c][b], and weep bitterly for him as one weeps bitterly for a firstborn.
translation:
  language: de
  text: Und ich werde über das Haus David und über die Bewohner Jerusalems einen Geist der Gnade und des Flehens um Erbarmen[a] ausgießen. Dann werden sie auf mich blicken, auf den, den sie durchbohrt haben, und sie werden um ihn trauern, wie man um den einzigen Sohn trauert[b], und bitter um ihn weinen, wie man bitter um den Erstgeborenen weint.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »einen Geist der Gnade und des Flehens«.'
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Text wechselt hier von »mich« zu »ihn«; die Übersetzung bewahrt diese Spannung, statt sie anzugleichen.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁפַכְתִּי
  choice: werde … ausgießen
  rationale: Bewahrt das Bild des reichlichen Ausgießens und entspricht im Deutschen der üblichen Verbindung mit רוּחַ.
- source_word: יוֹשֵׁב יְרוּשָׁלִַם
  choice: die Bewohner Jerusalems
  rationale: Das morphologisch singularische Partizip bezeichnet hier kollektiv die Einwohnerschaft Jerusalems.
- source_word: רוּחַ חֵן וְתַחֲנוּנִים
  choice: einen Geist der Gnade und des Flehens um Erbarmen
  rationale: Die Kleinschreibung lässt offen, ob eine von Gott gewirkte Haltung oder der göttliche Geist gemeint ist. »Flehen um Erbarmen« gibt den zugänglichen Sinn von תַחֲנוּנִים wieder; die knappere traditionelle Alternative steht in der Fußnote.
- source_word: וְהִבִּיטוּ אֵלַי
  choice: sie werden auf mich blicken
  rationale: נבט mit אֶל bezeichnet die auf jemanden gerichtete Aufmerksamkeit. »Auf mich blicken« ist natürlich und wahrt den Bezug zum Sprecher.
- source_word: אֵת אֲשֶׁר דָּקָרוּ
  choice: auf den, den sie durchbohrt haben
  rationale: אֵת kennzeichnet das Objekt des Relativsatzes; die Formulierung macht den persönlichen Referenten deutlich und bindet ihn im Deutschen natürlich an »blicken« an.
- source_word: וְסָפְדוּ עָלָיו
  choice: sie werden um ihn trauern
  rationale: ספד bezeichnet die Totenklage beziehungsweise feierliche Trauer; »um ihn trauern« ist die natürliche deutsche Fügung.
- source_word: הַיָּחִיד
  choice: der einzige Sohn
  rationale: Im Trauervergleich bezeichnet das maskuline Wort den einzigen beziehungsweise einzigen Sohn; der bestimmte Ausdruck des Hebräischen wird bewahrt.
- source_word: וְהָמֵר עָלָיו
  choice: bitter um ihn weinen
  rationale: Gibt die intensive bittere Trauer idiomatisch wieder und erhält den Bezug der Präposition auf die betrauerte Person.
- source_word: הַבְּכוֹר
  choice: der Erstgeborene
  rationale: Bewahrt die substantivische und bestimmte Form des Hebräischen, ohne »Sohn« ausdrücklich hinzuzufügen.
theological_decisions:
- issue: Wechsel von der ersten Person »mich« zur dritten Person »ihn«
  choice: 'Der Wechsel bleibt im Haupttext erhalten: »auf mich … auf den, den sie durchbohrt haben … um ihn«.'
  alternative: Zu »um mich« harmonisieren oder den Wechsel durch eine Umformulierung verdecken.
  rationale: Der masoretische Text wechselt auffällig von אֵלַי zu עָלָיו. Die Übersetzung bewahrt diese echte grammatische und theologische Spannung, statt sie aufzulösen.
- issue: Referenz von רוּחַ
  choice: »einen Geist« mit kleinem Anfangsbuchstaben
  alternative: »den Geist« beziehungsweise »den Heiligen Geist«
  rationale: Der Kontext kann göttliches Wirken einschließen, doch der hebräische Ausdruck identifiziert den Referenten nicht ausdrücklich als den Heiligen Geist. Die Übersetzung lässt dies offen.
- issue: Spätere christologische Rezeption
  choice: Direkte Wiedergabe des hebräischen Textes ohne ergänzte messianische Bezeichnung
  alternative: Den Durchbohrten ausdrücklich als Messias oder Christus benennen.
  rationale: Die Formulierung bleibt mit christologischer Deutung vereinbar, importiert sie aber nicht als Zusatz in den Text.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung erleichtert das Verständnis, ohne die logische Abfolge zu verändern. Archaische Wendungen werden vermieden; die poetischen Wiederholungen von Trauer und bitterem Weinen bleiben erhalten.
