  source_fidelity: 'Die Übersetzung gibt die zentralen hebräischen Elemente sachgerecht wieder: das Ausgießen über Haus David und Jerusalems Bewohnerschaft, einen nicht näher spezifizierten »Geist« der Gnade und des Flehens, das Blicken auf den Sprecher und die anschließende Trauer. Der markante Wechsel von »mich« zu »ihn« bleibt im Text erhalten und wird zutreffend erläutert. »Durchbohrt haben« ist als vollendete Handlung im Blick auf die zukünftige Reaktion angemessen.'
