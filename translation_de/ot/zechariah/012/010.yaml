  terminology: »Haus David«, »Bewohner Jerusalems«, »Geist der Gnade«, »Flehen um Erbarmen«, »trauern«, »durchbohrt« und »Erstgeborener« sind terminologisch treffend. Die Kleinschreibung von »Geist« vermeidet eine nicht vom hebräischen Wortlaut verlangte Festlegung. »Einziger Sohn« ist im Trauervergleich eine etablierte und kontextuell plausible Wiedergabe von הַיָּחִיד.
