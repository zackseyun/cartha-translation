source:
  edition: WLC
  text: וְ/הָיָ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא אֲבַקֵּ֗שׁ לְ/הַשְׁמִיד֙ אֶת כָּל הַ/גּוֹיִ֔ם הַ/בָּאִ֖ים עַל יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/009.yaml
  text: And on that day I will seek to destroy all the nations that come against Jerusalem[a].
translation:
  language: de
  text: Und an jenem Tag werde ich danach trachten, alle Völker zu vernichten, die gegen Jerusalem ziehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werde ich mich daranmachen, alle Völker zu vernichten“. Das hebräische Verb kann entschlossene Absicht ausdrücken, nicht bloß ein Suchen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Und …
  rationale: Die prophetische Zukunftsformel wird im Deutschen idiomatisch mit der Zeitangabe verbunden; ein zusätzliches „es wird geschehen“ wäre möglich, aber schwerfälliger.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Die feste prophetische Zeitformel wird natürlich und ohne nähere Festlegung ihres Erfüllungszeitpunkts wiedergegeben.
- source_word: אֲבַקֵּשׁ
  choice: werde ich danach trachten
  rationale: Das Piel von בקש bezeichnet hier ein zielgerichtetes Suchen beziehungsweise entschlossenes Streben. „Danach trachten“ bewahrt die Absichtskomponente besser als ein im Deutschen missverständliches „versuchen“.
- source_word: לְהַשְׁמִיד
  choice: zu vernichten
  rationale: Der Hifil-Infinitiv von שׁמד bezeichnet das Herbeiführen von Vernichtung. „Vernichten“ gibt die Stärke des Verbs prägnant wieder.
- source_word: כָּל הַגּוֹיִם
  choice: alle Völker
  rationale: Die kollektive und umfassende Aussage bleibt erhalten; „Völker“ ist hier natürlicher und weniger missverständlich als „Nationen“.
- source_word: הַבָּאִים עַל יְרוּשָׁלִָם
  choice: die gegen Jerusalem ziehen
  rationale: Das Partizip bezeichnet die gegen Jerusalem heranziehenden Völker. „Gegen … ziehen“ macht die im Kontext und in עַל liegende feindliche Bewegung natürlich deutlich.
theological_decisions:
- issue: Göttlicher Sprecher und Gerichtshandeln
  choice: 'Die direkte Ich-Rede bleibt erhalten: „werde ich danach trachten … zu vernichten“.'
  alternative: Eine unpersönliche Formulierung des Gerichts
  rationale: Die erste Person Singular weist den Sprecher ausdrücklich als handelndes Subjekt aus; diese göttliche Handlungsmacht wird weder abgeschwächt noch umgedeutet.
- issue: Prophetische Zeitformel
  choice: „an jenem Tag“ ohne zeitliche Ausdeutung
  alternative: Eine ausdrückliche eschatologische Einordnung
  rationale: Der Vers selbst bestimmt kein detailliertes Erfüllungsschema. Die offene prophetische Formel bleibt daher stehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung „danach trachten“ ist gehoben, aber allgemein verständlich und bildet die zielgerichtete Absicht des hebräischen Verbs ab. Der Fußnotenmarker [a] steht unmittelbar nach dem Satz.
