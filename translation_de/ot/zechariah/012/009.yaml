  verdict: approve
  source_fidelity: 'Die Übersetzung bildet alle wesentlichen Elemente des Hebräischen angemessen ab: die prophetische Zeitformel, die Ich-Rede, die zielgerichtete Absicht von אֲבַקֵּשׁ, den starken Kausativ von לְהַשְׁמִיד, die umfassende Bezugsgröße „alle Völker“ und die feindliche Bewegung gegen Jerusalem. „Gegen Jerusalem ziehen“ gibt die attributive Partizipialkonstruktion und den adversativen Sinn von עַל idiomatisch wieder.'
  naturalness: „Und an jenem Tag werde ich danach trachten, alle Völker zu vernichten, die gegen Jerusalem ziehen“ ist grammatisch, würdig und im modernen Standarddeutsch gut verständlich. „Danach trachten“ hat einen leicht gehobenen, für prophetische Rede passenden Ton, ohne archaisch zu wirken.
  terminology: „Völker“, „vernichten“ und „Jerusalem“ sind treffend und konsistent. Die Wiedergabe wahrt die entschlossene, jedoch nicht über den hebräischen Wortlaut hinaus konkretisierte Absicht des Sprechers. Die Fußnote bietet eine sachgerechte lexikalische Alternative, ohne eine theologische Auslegung einzutragen.
