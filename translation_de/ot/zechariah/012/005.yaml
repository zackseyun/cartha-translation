  rationale: Die Revision stellt die erste Person Singular von לִי mit „mir“ wieder her, wählt für die im Deutschen idiomatische Hauptlesart die instrumentale bzw. begründende Nuance „durch Jahwe“ und bewahrt die sphärische Lesart „in Jahwe“ ausdrücklich in der Fußnote. Die Fußnote zu אַלֻּפֵי wird terminologisch enger am möglichen Bezug auf Sippen ausgerichtet. Der Akkusativ bei „durch Jahwe ... ihren Gott“ wird grammatisch angepasst.
