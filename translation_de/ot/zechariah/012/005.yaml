base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/005.yaml
  text: Then the clans of Judah will say in their hearts[a], ‘The inhabitants of Jerusalem are my strength in Yahweh of Armies[b], their God.’
translation:
  language: de
  text: 'Dann werden die Sippen Judas in ihrem Herzen sagen[a]: »Die Bewohner Jerusalems sind mir eine Stärke durch Jahwe, den Gott der Heerscharen[b], ihren Gott.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Anführer Judas“ beziehungsweise „die Sippenoberhäupter Judas“. Das hebräische אַלֻּפֵי kann Sippenverbände oder deren Oberhäupter bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Die Bewohner Jerusalems sind mir eine Stärke in Jahwe, dem Gott der Heerscharen, ihrem Gott.“ Die Präposition kann den Bereich beziehungsweise die Grundlage („in“) oder das Mittel beziehungsweise den Grund („durch“) ausdrücken.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: Dann werden ... sagen
  rationale: Das prophetische Perfekt mit vorangestelltem וְ wird zukunftsbezogen wiedergegeben; „Dann“ macht die Abfolge im Ausspruch verständlich.
- source_word: אַלֻּפֵי יְהוּדָה
  choice: die Sippen Judas
  rationale: אַלּוּף kann sowohl eine soziale Einheit als auch deren Oberhaupt bezeichnen. Im Zusammenhang mit Juda als Gesamtheit passt „Sippen“, während die personbezogene Deutung in der Fußnote erhalten bleibt.
- source_word: בְּלִבָּם
  choice: in ihrem Herzen
  rationale: Die Formulierung bewahrt den hebräischen Kollektivsingular und bezeichnet inneres Sprechen oder eine innere Überzeugung.
- source_word: אַמְצָה לִי
  choice: sind meine Stärke
  rationale: Die knappe hebräische Wendung wird idiomatisch wiedergegeben; das Singularpronomen bleibt erhalten und kann distributiv verstanden werden.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: die Bewohner Jerusalems
  rationale: Natürliche deutsche Wiedergabe der substantivierten Partizipialkonstruktion.
- source_word: בַּיהוָה צְבָאוֹת
  choice: in Jahwe, dem Gott der Heerscharen
  rationale: „In“ bewahrt die mögliche Bedeutungssphäre der Präposition בְּ; eine instrumentale oder begründende Deutung wird in der Fußnote genannt. „Jahwe“ gibt den Gottesnamen wieder, und „Gott der Heerscharen“ ist im Deutschen als würdiger, verständlicher Titel etabliert.
- source_word: אֱלֹהֵיהֶם
  choice: ihrem Gott
  rationale: Die Possessivform bezieht sich grammatisch auf die Bewohner Jerusalems und wird entsprechend wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, damit der im Hebräischen ausdrücklich stehende Bundesname sichtbar bleibt.
- issue: Wiedergabe von צְבָאוֹת
  choice: Gott der Heerscharen
  alternative: Herr der Heere
  rationale: „Gott der Heerscharen“ bewahrt die Titelfunktion und den umfassenden Bezug auf die von Gott befehligten himmlischen und irdischen Mächte, ohne den Ausdruck auf menschliche Armeen einzuengen.
- issue: Bezug von בַּיהוָה
  choice: 'Sphäre bzw. Grundlage der Stärke: „in Jahwe“'
  alternative: 'Mittel oder Ursache: „durch Jahwe“'
  rationale: Die Präposition בְּ lässt beide Nuancen zu. Der Haupttext bleibt formal nah am Hebräischen; die alternative Deutung wird ausdrücklich in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kompakte Syntax und der Singular „meine Stärke“ bewahren die distributive Perspektive der einzelnen Sippen. Echte lexikalische und präpositionale Mehrdeutigkeit wird nicht im Haupttext aufgelöst, sondern in den Fußnoten offengelegt.
