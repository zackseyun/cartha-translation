  text: הִנֵּ֣ה אָ֠נֹכִי שָׂ֣ם אֶת יְרוּשָׁלִַ֧ם סַף רַ֛עַל לְ/כָל הָ/עַמִּ֖ים סָבִ֑יב וְ/גַ֧ם עַל יְהוּדָ֛ה יִֽהְיֶ֥ה בַ/מָּצ֖וֹר עַל יְרוּשָׁלִָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/002.yaml
  text: Behold[a], I am about to make Jerusalem a cup of staggering to all the surrounding peoples[b]; and it will also be against Judah in the siege against Jerusalem.
translation:
  language: de
  text: Siehe, ich mache Jerusalem für alle Völker ringsum zu einer Schale, die taumeln lässt[a]. Auch Juda wird es bei der Belagerung Jerusalems treffen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Becken/eine Schale des Taumelns“. Das hebräische Wort kann auch „Schwelle“ bedeuten; im Zusammenhang ist wahrscheinlich ein Gefäß gemeint, dessen Inhalt berauschtes Taumeln verursacht.'
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Wortlaut dieses Satzteils ist schwierig. Möglich sind auch die Deutungen: „Auch Juda wird zusammen mit Jerusalem belagert werden“ oder: „Auch Juda wird an der Belagerung Jerusalems beteiligt sein.“'
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: Siehe
  rationale: Leitet eine feierliche prophetische Ankündigung ein und bewahrt deren aufmerksamkeitslenkende, gehobene Kraft.
- source_word: אָ֠נֹכִי שָׂ֣ם
  choice: ich mache
  rationale: Das selbstständige Pronomen hebt den göttlichen Sprecher hervor; zusammen mit dem Partizip bezeichnet die Form ein anschaulich als unmittelbar bevorstehend dargestelltes Handeln. Das deutsche Präsens gibt diese prophetische Unmittelbarkeit natürlich wieder.
- source_word: סַף רַעַל
  choice: eine Schale, die taumeln lässt
  rationale: סַף kann eine Schale beziehungsweise ein Becken, aber auch eine Schwelle bezeichnen. Im Zusammenhang mit רַעַל liegt am ehesten ein Trinkgefäß nahe, dessen Inhalt berauschtes Taumeln verursacht. Die verbale Fassung ist im heutigen Deutsch verständlicher als das ungebräuchliche Kompositum „Taumelschale“.
- source_word: לְכָל הָעַמִּים סָבִיב
  choice: für alle Völker ringsum
  rationale: לְ bezeichnet hier die Völker, denen Jerusalem als verhängnisvolle Schale wird; „ringsum“ gibt die räumliche Bedeutung von סָבִיב knapp und natürlich wieder.
- source_word: וְגַם עַל יְהוּדָה יִהְיֶה
  choice: Auch über Juda wird es kommen
  rationale: Die unbestimmte Formulierung mit „es“ bewahrt die syntaktische Verdichtung des Hebräischen. „Über Juda“ bildet עַל ab, ohne vorschnell festzulegen, ob Juda selbst belagert wird oder anderweitig vom Gerichtsgeschehen betroffen ist.
- source_word: בַמָּצוֹר עַל יְרוּשָׁלִָם
  choice: wenn Jerusalem belagert wird
  rationale: Die Wendung bezeichnet die Belagerung, die sich gegen Jerusalem richtet. Der temporale Nebensatz ist natürliches Deutsch und wahrt den militärischen Zusammenhang.
theological_decisions:
- issue: Deutung der schwierigen Klausel וְגַם עַל־יְהוּדָה יִהְיֶה בַמָּצוֹר עַל־יְרוּשָׁלִָם
  choice: Auch über Juda wird es kommen, wenn Jerusalem belagert wird.
  alternative: 'Auch Juda wird zusammen mit Jerusalem belagert werden; oder: Auch Juda wird an der Belagerung Jerusalems beteiligt sein.'
  rationale: Der hebräische Satz ist syntaktisch stark verdichtet und lässt Judas genaue Rolle offen. Die gewählte Fassung hält fest, dass auch Juda von dem Geschehen betroffen ist, ohne die Mehrdeutigkeit zugunsten einer bestimmten historischen oder theologischen Deutung aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Siehe“ bewahrt den feierlichen prophetischen Ton. Die erste Metapher wird verständlich, aber bildhaft wiedergegeben; die schwierige zweite Satzhälfte bleibt bewusst offen und wird durch die Fußnote erläutert.
