  text: וְ/הָיָ֣ה בַ/יּוֹם הַ֠/הוּא אָשִׂ֨ים אֶת יְרוּשָׁלִַ֜ם אֶ֤בֶן מַֽעֲמָסָה֙ לְ/כָל הָ֣/עַמִּ֔ים כָּל עֹמְסֶ֖י/הָ שָׂר֣וֹט יִשָּׂרֵ֑טוּ וְ/נֶאֶסְפ֣וּ עָלֶ֔י/הָ כֹּ֖ל גּוֹיֵ֥י הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/003.yaml
  text: And on that day I will make Jerusalem a heavy stone for all the peoples[a]. All who lift it will surely injure themselves[c][b], and all the nations of the earth will gather against her.
translation:
  language: de
  text: Und an jenem Tag werde ich Jerusalem für alle Völker zu einem schweren Stein machen.[a] Alle, die ihn heben, werden sich schwer verletzen[b], und alle Nationen der Erde[c] werden sich gegen Jerusalem versammeln.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu einem Laststein“. Gemeint ist ein Stein, dessen Heben eine schwere und gefährliche Last ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „werden gewiss aufgeritzt werden“; die hebräische Ausdrucksweise verstärkt die Vorstellung einer schweren Verletzung.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „alle Nationen des Landes“, falls das hebräische Wort hier im örtlich begrenzten Sinn verstanden wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַהוּא
  choice: Und an jenem Tag
  rationale: Die knappe prophetische Zeitformel wahrt den Anschluss an den Zusammenhang und klingt in modernem Deutsch natürlich.
- source_word: אָשִׂים אֶת יְרוּשָׁלִַם
  choice: mache ich Jerusalem
  rationale: שׂים bezeichnet hier das Versetzen in einen bildlich beschriebenen Zustand; „machen“ gibt die Konstruktion idiomatisch wieder.
- source_word: אֶבֶן מַעֲמָסָה
  choice: zu einem schweren Stein
  rationale: Die Wortgruppe bezeichnet einen Last- beziehungsweise Hebestein und betont sein gefährliches Gewicht. Die stärker formale Alternative wird in der Fußnote bewahrt.
- source_word: לְכָל הָעַמִּים
  choice: für alle Völker
  rationale: „Völker“ gibt עַמִּים wieder und bleibt von dem späteren גּוֹיִם unterscheidbar, das hier mit „Nationen“ übersetzt wird.
- source_word: כָּל עֹמְסֶיהָ
  choice: Alle, die ihn hochheben
  rationale: Das Partizip von עמס bezeichnet das Aufladen beziehungsweise Heben einer Last; im Bild des schweren Steins ist „hochheben“ konkret und verständlich.
- source_word: שָׂרוֹט יִשָּׂרֵטוּ
  choice: werden sich schwer verletzen
  rationale: Infinitivus absolutus und finites Verb verstärken die Aussage. Die Wurzel bezeichnet Schneiden oder Aufritzen; die Hauptübersetzung gibt die schwere Selbstverletzung natürlich wieder, während die wörtlichere Bildsprache in der Fußnote steht.
- source_word: וְנֶאֶסְפוּ עָלֶיהָ
  choice: werden sich gegen Jerusalem versammeln
  rationale: אסף mit על bezeichnet in diesem militärisch-prophetischen Zusammenhang ein feindliches Zusammenkommen. Die Wiederholung des Namens vermeidet im Deutschen einen unklaren pronominalen Bezug.
- source_word: כֹּל גּוֹיֵי הָאָרֶץ
  choice: alle Nationen der Erde
  rationale: Im internationalen prophetischen Zusammenhang ist der weltweite Sinn am wahrscheinlichsten; die mögliche lokale Bedeutung von אֶרֶץ wird in einer Fußnote offengehalten.
theological_decisions:
- issue: Reichweite des feindlichen Zusammenschlusses gegen Jerusalem
  choice: alle Nationen der Erde
  alternative: alle Nationen des Landes
  rationale: אֶרֶץ kann „Erde“ oder „Land“ bedeuten. Der internationale Zusammenhang spricht für „Erde“, doch die engere Lesart bleibt als echte lexikalische Möglichkeit in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Bildsprache. „Völker“ und „Nationen“ bilden den Wechsel zwischen עַמִּים und גּוֹיִם ab. Alle Fußnotenmarker stehen an der jeweils einschlägigen Stelle im Haupttext.
