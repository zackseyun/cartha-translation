source:
  edition: WLC
  text: וְ/הוֹשִׁ֧יעַ יְהוָ֛ה אֶת אָהֳלֵ֥י יְהוּדָ֖ה בָּ/רִֽאשֹׁנָ֑ה לְמַ֨עַן לֹֽא תִגְדַּ֜ל תִּפְאֶ֣רֶת בֵּית דָּוִ֗יד וְ/תִפְאֶ֛רֶת יֹשֵׁ֥ב יְרוּשָׁלִַ֖ם עַל יְהוּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/007.yaml
  text: And Yahweh will save the tents of Judah first[b][a], so that the glory of the house of David and the glory of the inhabitants of Jerusalem may not be magnified over Judah.
translation:
  language: de
  text: Und Jahwe wird zuerst die Zelte Judas[a] retten, damit sich der Ruhm des Hauses David und der Ruhm der Bewohner Jerusalems nicht über Juda erheben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Wohnstätten Judas“. Wörtlich steht im Hebräischen „die Zelte Judas“; wahrscheinlich sind damit die außerhalb Jerusalems gelegenen Siedlungen Judas gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „damit der Ruhm des Hauses David und der Ruhm der Bewohner Jerusalems nicht größer wird als der Ruhm Judas“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/הוֹשִׁיעַ
  choice: wird ... retten
  rationale: Das Hifil von ישׁע bezeichnet retten oder befreien. „Retten“ ist im modernen Deutsch natürlich und bewahrt das Gewicht des göttlichen Eingreifens.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אָהֳלֵי יְהוּדָה
  choice: die Zelte Judas
  rationale: Die konkrete Bildsprache des Hebräischen bleibt erhalten; wahrscheinlich sind die außerhalb Jerusalems gelegenen Wohnstätten oder Gemeinschaften Judas gemeint.
- source_word: בָּ/רִאשֹׁנָה
  choice: zuerst
  rationale: Das Adverb bezeichnet hier den Vorrang in der Reihenfolge.
- source_word: לְמַעַן
  choice: damit
  rationale: „Damit“ gibt die Zweckbeziehung knapp und idiomatisch wieder.
- source_word: תִּפְאֶרֶת
  choice: Ruhm
  rationale: תפארת kann Ruhm, Herrlichkeit oder Pracht bezeichnen. „Ruhm“ passt zum gesellschaftlichen Ansehen der davidischen Dynastie und Jerusalems, ohne die Bedeutung auf bloßes Prahlen zu verengen.
- source_word: תִגְדַּל ... עַל
  choice: sich ... über ... erhebt
  rationale: Die Verbindung drückt aus, dass der Ruhm nicht größer beziehungsweise höher als der Judas werden soll. Die deutsche Wendung bewahrt den vergleichenden und statusbezogenen Sinn.
- source_word: בֵּית דָּוִיד
  choice: das Haus David
  rationale: Die traditionelle und verständliche Bezeichnung meint sowohl Davids Haus als auch seine Dynastie.
- source_word: יֹשֵׁב יְרוּשָׁלִַם
  choice: die Bewohner Jerusalems
  rationale: Der singularische Partizipialausdruck ist kollektiv gebraucht; der deutsche Plural gibt dies natürlich wieder.
theological_decisions:
- issue: Sozialpolitischer Gegensatz innerhalb des Gottesvolkes
  choice: Judas außerhalb Jerusalems liegende Gemeinschaften erhalten bei der Rettung Vorrang, damit das davidische Königshaus und Jerusalem nicht über Juda erhöht werden.
  alternative: Der Vers nennt lediglich eine zeitliche Reihenfolge ohne gesellschaftlich ausgleichenden Akzent.
  rationale: Der Gegensatz zwischen den „Zelten Judas“ einerseits und dem Haus David sowie den Bewohnern Jerusalems andererseits wird durch den Zwecksatz ausdrücklich mit deren relativem Ruhm verbunden. Die Übersetzung lässt diesen Akzent erkennen, ohne die Zelte näher auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkrete Metapher „Zelte“ und der Eigenname „Jahwe“ bleiben erhalten. Der kollektive Singular für Jerusalems Bewohnerschaft wird im Deutschen natürlich als Plural wiedergegeben; die Fußnote bewahrt die semantische Spannweite der vergleichenden Schlusswendung.
