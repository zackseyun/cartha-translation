source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֡וּא אָשִׂים֩ אֶת אַלֻּפֵ֨י יְהוּדָ֜ה כְּֽ/כִיּ֧וֹר אֵ֣שׁ בְּ/עֵצִ֗ים וּ/כְ/לַפִּ֥יד אֵשׁ֙ בְּ/עָמִ֔יר וְ/אָ֨כְל֜וּ עַל יָמִ֧ין וְ/עַל שְׂמֹ֛אול אֶת כָּל הָ/עַמִּ֖ים סָבִ֑יב וְ/יָשְׁבָ֨ה יְרוּשָׁלִַ֥ם ע֛וֹד תַּחְתֶּ֖י/הָ בִּ/ירוּשָׁלִָֽם־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/006.yaml
  text: On that day I will make the clans of Judah like a firepot among wood[a], and like a flaming torch among sheaves; and they will consume all the surrounding peoples, on the right and on the left. And Jerusalem will again dwell in her own place[b], in Jerusalem.
translation:
  language: de
  text: An jenem Tag werde ich die Anführer Judas[a] wie ein Feuerbecken zwischen Holzscheiten und wie eine brennende Fackel zwischen Garben machen. Sie werden rechts und links alle Völker ringsum verzehren. Und Jerusalem wird wieder an ihrer eigenen Stätte[b] wohnen – in Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Sippen Judas“; auch „die Obersten Judas“. Das hebräische Wort kann Führungspersonen oder die von ihnen vertretenen Gruppen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „unter ihr selbst“; gemeint ist: an ihrer eigenen, angestammten Stelle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלֻּפֵי יְהוּדָה
  choice: die Anführer Judas
  rationale: אַלּוּף bezeichnet häufig einen führenden Mann, Obersten oder Stammesführer. Im näheren Kontext von Sacharja 12 treten die אַלֻּפִים Judas als handelnde Führungsträger auf. „Anführer“ ist im modernen Deutsch klar, ohne einen bestimmten politischen oder militärischen Rang festzulegen; die mögliche kollektive Bedeutung „Sippen“ bleibt in der Fußnote erhalten.
- source_word: כְּכִיּוֹר אֵשׁ בְּעֵצִים
  choice: wie ein Feuerbecken zwischen Holzscheiten
  rationale: כִּיּוֹר bezeichnet ein Becken oder Gefäß; durch אֵשׁ wird daraus hier ein mit Feuer gefülltes Becken. „Zwischen Holzscheiten“ verdeutlicht das brennbare Material, ohne das Bild zu einer bloßen Erklärung aufzulösen.
- source_word: וּכְלַפִּיד אֵשׁ בְּעָמִיר
  choice: und wie eine brennende Fackel zwischen Garben
  rationale: לַפִּיד אֵשׁ ist eine Feuerfackel beziehungsweise brennende Fackel. עָמִיר kann aufgehäuftes Getreide oder Garben bezeichnen; „Garben“ bewahrt das konkrete landwirtschaftliche Bild.
- source_word: וְאָכְלוּ
  choice: sie werden … verzehren
  rationale: Das Verb bedeutet wörtlich „essen“, wird hier jedoch metaphorisch von vernichtendem Feuer beziehungsweise Sieg gebraucht. „Verzehren“ hält Feuerbild und Zerstörungswirkung zusammen.
- source_word: עַל יָמִין וְעַל שְׂמֹאול
  choice: rechts und links
  rationale: Die knappe Richtungsangabe bewahrt das hebräische Bild einer umfassenden Wirkung auf beiden Seiten.
- source_word: אֶת כָּל הָעַמִּים סָבִיב
  choice: alle Völker ringsum
  rationale: עַמִּים bezeichnet Völker oder Volksgruppen; סָבִיב beschreibt sie als ringsum befindlich. Die Formulierung ist nah am Hebräischen und im Deutschen natürlich.
- source_word: וְיָשְׁבָה יְרוּשָׁלִַם עוֹד
  choice: Jerusalem aber wird wieder … wohnen
  rationale: יָשַׁב bedeutet wohnen, sitzen oder bleiben. Die aktive Form bewahrt die prophetische Personifikation Jerusalems; „aber“ markiert natürlich den Übergang zur Wiederherstellung, ohne einen zusätzlichen theologischen Gegensatz einzutragen.
- source_word: תַּחְתֶּיהָ
  choice: an ihrer eigenen Stätte
  rationale: Wörtlich steht „unter sich selbst/ihr selbst“. Im Kontext ist dies eine Ortswendung für Jerusalems angestammte Stelle. „An ihrer eigenen Stätte“ gibt den Sinn wieder, während die Fußnote die ungewöhnliche wörtliche Gestalt dokumentiert.
- source_word: בִּירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Die abschließende Wiederholung wird beibehalten, da sie die Identität und örtliche Wiederherstellung der Stadt nachdrücklich hervorhebt.
theological_decisions:
- issue: Identität der אַלֻּפֵי Judas
  choice: Anführer Judas
  alternative: Sippen Judas; Oberste Judas
  rationale: Der Ausdruck kann je nach Zusammenhang Führungspersonen oder eine von ihnen repräsentierte soziale Einheit bezeichnen. In Sacharja 12 spricht der wiederholte Gebrauch eher für Führungsträger. Die Übersetzung vermeidet zugleich die Einschränkung auf einen bestimmten Amts- oder Militärrang und hält die kollektive Alternative in der Fußnote offen.
- issue: Personifikation und Wiederherstellung Jerusalems
  choice: Jerusalem wird an ihrer eigenen Stätte wohnen
  alternative: Jerusalem wird an seinem eigenen Ort bewohnt sein; Jerusalem wird dort bleiben, wo es ist
  rationale: Die aktive Personifikation und die betonte Ortsangabe entsprechen der hebräischen Form. So wird weder ausschließlich eine Rückkehr der Bevölkerung noch bloß militärisches Fortbestehen als einzige Deutung festgelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit anschaulicher Bildsprache. Die Wiederholung „Jerusalem … in Jerusalem“ bleibt als rhetorische Betonung des hebräischen Textes erhalten. Die beiden Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
