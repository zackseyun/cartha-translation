  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא יָגֵ֤ן יְהוָה֙ בְּעַד֙ יוֹשֵׁ֣ב יְרוּשָׁלִַ֔ם וְ/הָיָ֞ה הַ/נִּכְשָׁ֥ל בָּ/הֶ֛ם בַּ/יּ֥וֹם הַ/ה֖וּא כְּ/דָוִ֑יד וּ/בֵ֤ית דָּוִיד֙ כֵּֽ/אלֹהִ֔ים כְּ/מַלְאַ֥ךְ יְהוָ֖ה לִ/פְנֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/008.yaml
  text: On that day Yahweh will shield the inhabitants of Jerusalem[a], and the one who stumbles among them on that day will be like David, and the house of David like God, like the angel of Yahweh before them.
translation:
  language: de
  text: An jenem Tag wird Jahwe die Bewohner Jerusalems beschirmen. Wer unter ihnen strauchelt, wird an jenem Tag wie David sein, und das Haus Davids wird wie Gott[a] sein, wie der Engel Jahwes vor ihnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie göttliche Wesen“ oder „wie Götter“. Das hebräische Wort אֱלֹהִים kann je nach Zusammenhang diese Bedeutungen haben; hier liegt wahrscheinlich der singularische Vergleich „wie Gott“ vor.'
    reason: alternative_reading
lexical_decisions:
- source_word: יָגֵן
  choice: wird … beschirmen
  rationale: Das Verb bezeichnet schützendes Decken oder Verteidigen. „Beschirmen“ bewahrt das Bild eines Schildes und klingt in einem würdevollen prophetischen Text natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּעַד
  choice: in der Konstruktion „die Bewohner … beschirmen“ ausgedrückt
  rationale: Mit יָגֵן bezeichnet die Präposition die Personen, denen der Schutz gilt; im Deutschen wird dies idiomatisch durch das direkte Objekt ausgedrückt.
- source_word: יוֹשֵׁב יְרוּשָׁלִַם
  choice: die Bewohner Jerusalems
  rationale: Das singularische Partizip ist kollektiv gebraucht. Die deutsche Pluralform gibt diesen Sinn verständlich und natürlich wieder.
- source_word: הַנִּכְשָׁל
  choice: wer … strauchelt
  rationale: Die Form bezeichnet jemanden, der strauchelt oder ins Wanken gerät. Die Wiedergabe erhält das konkrete Bild und lässt die mitgemeinte Schwäche offen.
- source_word: בָּהֶם
  choice: unter ihnen
  rationale: Die Präposition bezeichnet hier die Zugehörigkeit zur Gemeinschaft der Bewohner Jerusalems.
- source_word: כְּדָוִיד
  choice: wie David
  rationale: Die schlichte Vergleichsform bewahrt den Bezug auf David als Maßstab, ohne die Art des Vergleichs näher festzulegen.
- source_word: בֵּית דָּוִיד
  choice: das Haus Davids
  rationale: Die traditionelle Wendung erhält sowohl den familiären als auch den dynastischen Sinn.
- source_word: כֵּאלֹהִים
  choice: wie Gott
  rationale: אֱלֹהִים kann mehrere Bedeutungen tragen. Der folgende singularische Vergleich mit dem Engel Jahwes spricht hier eher für „Gott“; die anderen möglichen Bedeutungen werden in einer Fußnote bewahrt.
- source_word: כְּמַלְאַךְ יְהוָה
  choice: wie der Engel Jahwes
  rationale: מַלְאָךְ kann „Bote“ oder „Engel“ bedeuten. In dieser festen biblischen Verbindung liegt die übernatürliche Bedeutung nahe, und „Engel Jahwes“ bewahrt die intertextuelle Resonanz.
- source_word: לִפְנֵיהֶם
  choice: vor ihnen
  rationale: Die knappe Formulierung wahrt die mögliche räumliche Bedeutung ebenso wie den Gedanken des Vorausgehens oder Anführens.
theological_decisions:
- issue: Bedeutung von אֱלֹהִים im Vergleich mit dem Haus Davids
  choice: „Gott“ im Singular
  alternative: „göttliche Wesen“ oder „Götter“
  rationale: Der unmittelbar folgende Vergleich „wie der Engel Jahwes“ legt eine singuläre, gesteigerte Aussage nahe. Da אֱלֹהִים dennoch auch pluralisch verstanden werden kann, wird die echte Mehrdeutigkeit in der Fußnote ausdrücklich erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Beschirmen“ erhält das Schutzbild, ohne altertümlich unverständlich zu wirken. Die Wiederholung von „an jenem Tag“ und die markanten Steigerungen der hebräischen Aussage bleiben erhalten.
