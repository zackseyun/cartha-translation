source:
  edition: WLC
  text: מַשָּׂ֥א דְבַר יְהוָ֖ה עַל יִשְׂרָאֵ֑ל נְאֻם יְהוָ֗ה נֹטֶ֤ה שָׁמַ֨יִם֙ וְ/יֹסֵ֣ד אָ֔רֶץ וְ/יֹצֵ֥ר רֽוּחַ אָדָ֖ם בְּ/קִרְבּֽ/וֹ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/001.yaml
  text: 'An oracle[a], the word of Yahweh concerning Israel: the declaration of Yahweh, who stretches out the heavens, lays the foundation of the earth[b], and forms the spirit of man within him.'
translation:
  language: de
  text: 'Ein Ausspruch[a], das Wort Jahwes über Israel: Ausspruch Jahwes, der den Himmel ausspannt, die Erde gründet und den Geist des Menschen[b] in seinem Innern formt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ein Ausspruch: das Wort Jahwes gegen Israel.« Die Präposition kann »über« und in manchen Zusammenhängen »gegen« bedeuten.'
    reason: alternative_reading
  - marker: b
    text: 'Auch: »den menschlichen Geist«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשָּׂא
  choice: Ausspruch
  rationale: In prophetischen Überschriften bezeichnet das Wort eine gewichtige prophetische Verkündigung. »Ausspruch« ist im heutigen Deutsch verständlich und würdevoll, ohne die möglicherweise irreführende konkrete Vorstellung einer »Last« in den Haupttext zu übernehmen.
- source_word: דְבַר יְהוָה
  choice: das Wort Jahwes
  rationale: Die feste prophetische Formel wird mit »Wort« wiedergegeben; so bleibt ihr Bezug auf göttliche Offenbarung deutlicher erhalten als bei dem stärker deutenden »Botschaft«.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben. »Jahwe« ist die im modernen Standarddeutsch übliche Form der wissenschaftlichen Umschrift.
- source_word: עַל
  choice: über
  rationale: Die Präposition bezeichnet hier am ehesten den Gegenstand des Ausspruchs. »Über« lässt sowohl Gerichts- als auch Heilsankündigungen zu; die mögliche Bedeutung »gegen« wird in der Fußnote bewahrt.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Die hebräische Nominalformel bleibt als solche erhalten, statt in das finite »spricht Jahwe« umgewandelt zu werden. Die Wiederholung von »Ausspruch« spiegelt die feierliche Form des Ausgangstextes.
- source_word: נֹטֶה שָׁמַיִם
  choice: der den Himmel ausspannt
  rationale: Das Partizip beschreibt Jahwe als Schöpfer. »Ausspannen« bewahrt das anschauliche Bild und die fortdauernde, majestätische Darstellung.
- source_word: וְיֹסֵד אָרֶץ
  choice: die Erde gründet
  rationale: Das Verb bezeichnet das Gründen beziehungsweise Legen eines Fundaments. »Die Erde gründet« ist knapp, bildhaft und dem gehobenen Schöpfungskontext angemessen.
- source_word: וְיֹצֵר רוּחַ אָדָם
  choice: und den Geist des Menschen formt
  rationale: »Formen« bewahrt das Bild des gestaltenden Schöpfers. רוּחַ bezeichnet hier am ehesten den inneren Geist des Menschen.
- source_word: אָדָם
  choice: des Menschen
  rationale: Der singularische, repräsentative Gebrauch bezeichnet den Menschen als solchen. Im Deutschen gibt »des Menschen« diesen generischen Sinn natürlich wieder, ohne ihn auf einen erwachsenen Mann einzuengen.
- source_word: בְּקִרְבּוֹ
  choice: in seinem Innern
  rationale: Das maskuline Singularsuffix bezieht sich am natürlichsten auf אָדָם. »In seinem Innern« erhält die singularische Konstruktion und klingt würdevoll und idiomatisch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst und nicht den Titel אֲדֹנָי. Daher wird der Eigenname in seiner üblichen deutschen Form wiedergegeben.
- issue: Bedeutung der Präposition עַל
  choice: über Israel
  alternative: gegen Israel
  rationale: Da der folgende Zusammenhang sowohl Gericht als auch Rettung Israels umfasst, wahrt »über« die sachliche Offenheit des Hebräischen. Die kontextuell mögliche feindliche Bedeutung wird nicht ausgeschlossen, sondern in einer Fußnote genannt.
- issue: Generischer Sinn von אָדָם
  choice: des Menschen
  alternative: des menschlichen Geistes
  rationale: Der hebräische Singular ist repräsentativ und bezeichnet den Menschen allgemein. Die gewählte Form erhält sowohl den Singular als auch die Beziehung zwischen dem Menschen und seinem Geist; die mögliche kompaktere Auffassung wird in der Fußnote angegeben.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit knapper prophetischer Satzführung. Die wiederholte Formel »Ausspruch Jahwes« und die drei parallelen Schöpfungsaussagen bewahren Feierlichkeit und Struktur des Hebräischen. Der Gottesname erscheint in der im Deutschen üblichen Form »Jahwe«.
