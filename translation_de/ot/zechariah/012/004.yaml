  text: בַּ/יּ֨וֹם הַ/ה֜וּא נְאֻם יְהוָ֗ה אַכֶּ֤ה כָל סוּס֙ בַּ/תִּמָּה֔וֹן וְ/רֹכְב֖/וֹ בַּ/שִּׁגָּע֑וֹן וְ/עַל בֵּ֤ית יְהוּדָה֙ אֶפְקַ֣ח אֶת עֵינַ֔/י וְ/כֹל֙ ס֣וּס הָֽ/עַמִּ֔ים אַכֶּ֖ה בַּֽ/עִוָּרֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/004.yaml
  text: On that day[a], declares Yahweh, I will strike every horse with panic, and its rider with madness. But over the house of Judah I will keep my eyes open[b], and I will strike every horse of the peoples with blindness.
translation:
  language: de
  text: An jenem Tag – Ausspruch Jahwes – werde ich jedes Pferd mit Verwirrung schlagen und seinen Reiter mit Wahnsinn. Auf das Haus Juda aber werde ich meine Augen richten[a], und jedes Pferd der Völker werde ich mit Blindheit schlagen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „werde ich meine Augen über das Haus Juda öffnen“. Die hebräische Bildrede bezeichnet aufmerksame Zuwendung und lässt in diesem Zusammenhang wohlwollendes, schützendes Augenmerk erkennen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Die feste prophetische Zeitformel wird natürlich und zugleich nah am Hebräischen wiedergegeben; sie verweist auf den angekündigten Tag des göttlichen Handelns.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Die nominale prophetische Formel wird formal bewahrt. „Ausspruch“ ist im modernen Standarddeutsch würdig und verständlich; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: אַכֶּה
  choice: werde ich … schlagen
  rationale: Das Hifil von נכה bezeichnet hier das Treffen mit einem verhängten Zustand. „Schlagen“ bewahrt die wiederholte Gerichtsformel, ohne Tötung zu unterstellen.
- source_word: כָל סוּס
  choice: jedes Pferd
  rationale: Der singularische Ausdruck mit כָל wird distributiv wiedergegeben.
- source_word: בַּתִּמָּהוֹן
  choice: mit Bestürzung
  rationale: Das Wort bezeichnet lähmendes Entsetzen, Verwirrung oder Panik. „Bestürzung“ wahrt die Bedeutungsbreite besser als das enger militärisch gefärbte „Panik“.
- source_word: וְרֹכְבוֹ
  choice: und seinen Reiter
  rationale: Das maskuline Suffix bezieht sich auf das Pferd; die knappe deutsche Form bildet diese Beziehung klar ab.
- source_word: בַּשִּׁגָּעוֹן
  choice: mit Wahnsinn
  rationale: Direkte und nicht klinisch abschwächende Wiedergabe des schweren Zustands geistiger Zerrüttung.
- source_word: וְעַל בֵּית יְהוּדָה אֶפְקַח אֶת עֵינַי
  choice: Über das Haus Juda aber werde ich meine Augen offen halten
  rationale: Die hebräische Bildrede wird erhalten. „Aber“ macht den im Zusammenhang erkennbaren Gegensatz deutlich, ohne die aufmerksame Zuwendung ausdrücklich als Schutz auszudeuten.
- source_word: בֵּית יְהוּדָה
  choice: das Haus Juda
  rationale: Die bundestheologisch und gemeinschaftlich geprägte Ausdrucksweise bleibt erhalten, statt zu schlicht „Juda“ zu sagen.
- source_word: כֹל סוּס הָעַמִּים
  choice: jedes Pferd der Völker
  rationale: „Völker“ gibt den Plural עַמִּים eng wieder und lässt die ebenfalls mögliche kontextuelle Deutung „Nationen“ offen.
- source_word: בַּעִוָּרוֹן
  choice: mit Blindheit
  rationale: Direkte Wiedergabe des Substantivs und formale Parallele zu „mit Bestürzung“ und „mit Wahnsinn“.
theological_decisions:
- issue: Die geöffneten Augen Jahwes über dem Haus Juda
  choice: 'Die Bildrede als aufmerksame Zuwendung bewahren: „meine Augen offen halten“'
  alternative: „meine Augen über dem Haus Juda öffnen“ oder deutender „über das Haus Juda wachen“
  rationale: Im Gegensatz zum Gericht über Pferde und Reiter liegt wohlwollende Aufmerksamkeit nahe. Die gewählte Fassung lässt die Schutzdimension anklingen, macht sie aber nicht zu einer ausdrücklichen Aussage, die über den Wortlaut hinausginge.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird im deutschen Text als Eigenname erkennbar gemacht. „Jahwe“ ist die im Deutschen verbreitete wissenschaftliche Umschrift; die traditionelle Ersatzlesung „der HERR“ bleibt eine mögliche Editionskonvention, steht jedoch nicht im hebräischen Konsonantentext.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst erhaltener prophetischer Formel und hebräischer Augen-Metaphorik. Die dreifache Konstruktion „mit … schlagen“ hält den Parallelismus sichtbar. Sämtliche Fußnotenmarker stehen im Haupttext.
