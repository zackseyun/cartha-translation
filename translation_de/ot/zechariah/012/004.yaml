  terminology: „Ausspruch Jahwes“, „Haus Juda“, „Völker“, „Wahnsinn“ und „Blindheit“ sind angemessen. „Jahwe“ ist im modernen deutschen wissenschaftlich-biblischen Register eine etablierte Wiedergabe des Gottesnamens. Die Fußnoten sollten nur an der tatsächlich erläuterten Formulierung verankert werden.
