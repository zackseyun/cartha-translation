id: ZEC.1.11
reference: Zechariah 1:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַֽ/יַּעֲנ֞וּ אֶת מַלְאַ֣ךְ יְהוָ֗ה הָֽ/עֹמֵד֙ בֵּ֣ין הַ/הֲדַסִּ֔ים וַ/יֹּאמְר֖וּ הִתְהַלַּ֣כְנוּ בָ/אָ֑רֶץ וְ/הִנֵּ֥ה כָל הָ/אָ֖רֶץ יֹשֶׁ֥בֶת וְ/שֹׁקָֽטֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/011.yaml
  text: And they answered the angel of Yahweh who was standing among the myrtle trees and said[a], “We have gone throughout the earth, and behold[b], all the earth is at rest and quiet.”
translation:
  language: de
  text: 'Und sie antworteten dem Engel Jahwes[a], der zwischen den Myrten stand, und sagten: „Wir haben die Erde durchstreift[b], und siehe, die ganze Erde sitzt still und ist ruhig.“[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem Boten Jahwes“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Wir sind im Land umhergezogen“ beziehungsweise „Wir haben das Land durchzogen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „die ganze Erde ist in Ruhe und ungestört“; „Erde“ kann hier auch „Land“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: sie antworteten
  rationale: ענה bezeichnet hier die Antwort der ausgesandten Reiter auf die vorausgehende Frage; der Dativ „dem Engel“ ist im Deutschen idiomatisch.
- source_word: מַלְאַךְ יְהוָה
  choice: Engel Jahwes
  rationale: מַלְאָךְ kann „Bote“ oder „Engel“ bedeuten. Im Rahmen der Vision ist „Engel“ die natürliche Hauptübersetzung; die allgemeinere Bedeutung bleibt in einer Fußnote sichtbar.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben, statt ihn durch einen Titel wie „der HERR“ zu ersetzen.
- source_word: הָעֹמֵד
  choice: der … stand
  rationale: Das Partizip beschreibt die Position des Engels während der Szene; das deutsche Präteritum gibt diesen Hintergrund natürlich wieder.
- source_word: בֵּין הַהֲדַסִּים
  choice: zwischen den Myrten
  rationale: בֵּין bedeutet „zwischen/inmitten“, und הֲדַסִּים bezeichnet Myrten. Die knappe Form entspricht dem Hebräischen.
- source_word: הִתְהַלַּכְנוּ
  choice: wir haben … durchstreift
  rationale: Der Hitpael von הלך bezeichnet hier das Hin-und-her-Ziehen durch ein Gebiet. „Durchstreift“ passt zum Bericht der ausgesandten Reiter, ohne den Zweck ausdrücklich als Patrouille festzulegen.
- source_word: בָאָרֶץ
  choice: die Erde
  rationale: Der folgende Ausdruck „die ganze Erde“ legt hier einen umfassenden geografischen Bezug nahe; die mögliche Bedeutung „Land“ wird in der Fußnote bewahrt.
- source_word: וְהִנֵּה
  choice: und siehe
  rationale: „Siehe“ bewahrt die aufmerksamkeitslenkende Funktion und den würdigen prophetischen Ton von הִנֵּה.
- source_word: יֹשֶׁבֶת
  choice: sitzt still
  rationale: Die Wiedergabe erhält das konkrete Bild des hebräischen Partizips und unterscheidet es von dem folgenden שׁקט, auch wenn die Formulierung im Deutschen bewusst bildhaft klingt.
- source_word: וְשֹׁקָטֶת
  choice: und ist ruhig
  rationale: שׁקט bezeichnet einen ruhigen, ungestörten Zustand. „Ist ruhig“ bildet ein zweites Prädikat und glättet es nicht mit יֹשֶׁבֶת zu einer einzigen Aussage.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. Die Umschrift „Jahwe“ wahrt seinen Charakter als Eigenname, ohne eine konfessionelle Deutung hinzuzufügen.
- issue: Bedeutung von מַלְאַךְ in der Vision
  choice: Engel
  alternative: Bote
  rationale: „Engel“ ist in dieser übernatürlichen Visionsszene die naheliegende deutsche Bezeichnung. Da das hebräische Wort grundsätzlich auch „Bote“ bedeutet, wird diese Spannung in einer Fußnote offengehalten.
- issue: Deutung der weltweiten Ruhe
  choice: sitzt still und ist ruhig
  alternative: ist in Ruhe und ungestört
  rationale: Die Übersetzung beschreibt nur den gemeldeten Zustand und bewertet ihn weder als göttlichen Frieden noch als schuldhafte Selbstsicherheit. Zugleich bleiben die beiden hebräischen Prädikate unterscheidbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erkennbar prophetischem Ton. „Und siehe“ bleibt als biblischer Aufmerksamkeitsruf stehen. Die bewusst bildhafte Wendung „sitzt still und ist ruhig“ erhält die beiden hebräischen Aussagen getrennt; natürlichere Deutungsmöglichkeiten werden in der Fußnote genannt.
