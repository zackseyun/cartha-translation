  variant: modern standard German
source:
  edition: WLC
  text: אַל תִּהְי֣וּ כַ/אֲבֹֽתֵי/כֶ֡ם אֲשֶׁ֣ר קָרְאֽוּ אֲלֵי/הֶם֩ הַ/נְּבִיאִ֨ים הָ/רִֽאשֹׁנִ֜ים לֵ/אמֹ֗ר כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת שׁ֤וּבוּ נָא֙ מִ/דַּרְכֵי/כֶ֣ם הָ/רָעִ֔ים ו/מעלילי/כם הָֽ/רָעִ֑ים וְ/לֹ֥א שָׁמְע֛וּ וְ/לֹֽא הִקְשִׁ֥יבוּ אֵלַ֖/י נְאֻם יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/004.yaml
  text: 'Do not be like your fathers[a], to whom the former prophets proclaimed, saying, “Thus says Yahweh of hosts: Turn back, please, from your evil ways and your evil deeds.” But they did not listen or pay attention to me, declares Yahweh.'
translation:
  language: de
  text: 'Seid nicht wie eure Väter[a], denen die früheren Propheten verkündeten: »So spricht Jahwe der Heerscharen: Kehrt doch um von euren bösen Wegen und euren bösen Taten!« Aber sie hörten nicht und achteten nicht auf mich, spricht Jahwe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eure Vorfahren«. Wörtlich steht im Hebräischen »eure Väter«; gemeint sind die früheren Generationen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּהְיוּ כַאֲבֹתֵיכֶם
  choice: Seid nicht wie eure Väter
  rationale: אַל mit dem Imperfekt von היה formuliert ein Verbot. „Väter“ bewahrt die konkrete hebräische Ausdrucksweise, während der weitere Sinn „frühere Generationen“ in einer Fußnote erläutert wird.
- source_word: קָרְאוּ אֲלֵיהֶם
  choice: denen ... verkündeten
  rationale: קרא bezeichnet hier angesichts der folgenden direkten Rede die öffentliche prophetische Verkündigung; „verkündeten“ ist im Deutschen natürlich und sachgerecht.
- source_word: הַנְּבִיאִים הָרִאשֹׁנִים
  choice: die früheren Propheten
  rationale: רִאשֹׁנִים bezeichnet hier zeitlich frühere Propheten. „Frühere“ vermeidet eine mögliche Verwechslung mit einer technischen kanonischen Kategorie.
- source_word: כֹּה אָמַר יְהוָה צְבָאוֹת
  choice: So spricht Jahwe der Heerscharen
  rationale: Die traditionelle deutsche Botenformel „So spricht“ gibt das hebräische כֹּה אָמַר würdig und knapp wieder. „Heerscharen“ lässt die umfassende Bedeutung von צְבָאוֹת offen.
- source_word: שׁוּבוּ נָא
  choice: Kehrt doch um
  rationale: שוב bezeichnet hier sowohl die Abkehr als auch die Umkehr. Die Modalpartikel „doch“ gibt die eindringliche, bittende Nuance von נָא im natürlichen Deutschen besser wieder als ein wörtliches „bitte“.
- source_word: מִדַּרְכֵיכֶם הָרָעִים וּמַעֲלִילֵיכֶם הָרָעִים
  choice: von euren bösen Wegen und euren bösen Taten
  rationale: „Wege“ bewahrt das Bild für die Lebensführung; „Taten“ gibt מַעֲלָלִים konkret und verständlich wieder. Die Wiederholung von „bösen“ folgt der hebräischen Betonung.
- source_word: וְלֹא שָׁמְעוּ וְלֹא הִקְשִׁיבוּ אֵלַי
  choice: Aber sie hörten nicht und achteten nicht auf mich
  rationale: „Hörten“ lässt bei שמע die Spannung zwischen Hören und Gehorchen bestehen; „achteten ... auf“ gibt הקשיב als bewusstes Aufmerken wieder. „Aber“ macht den sachlichen Gegensatz im Deutschen deutlich.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Die feste prophetische Abschlussformel wird in idiomatischem, würdigem Deutsch wiedergegeben und von der einleitenden Botenformel durch ihre Stellung unterschieden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, damit der im Hebräischen ausdrücklich stehende Bundesname sichtbar bleibt. Die genaue antike Aussprache ist nicht völlig sicher, doch „Jahwe“ ist die etablierte wissenschaftliche deutsche Form.
- issue: Bedeutungsumfang von אָבוֹת
  choice: Väter
  alternative: Vorfahren
  rationale: „Väter“ wahrt die wörtliche Gestalt des hebräischen maskulinen Plurals; die Fußnote macht deutlich, dass im Zusammenhang frühere Generationen beziehungsweise Vorfahren gemeint sind.
- issue: Nuance von שׁוּבוּ
  choice: Kehrt ... um
  alternative: Kehrt ... zurück
  rationale: Im prophetischen Aufruf verbindet שוב räumlich-bildhafte Rückkehr mit moralischer Umkehr. „Umkehren“ trifft im Deutschen den ethischen Kontext, ohne die Richtungsvorstellung ganz aufzugeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter prophetischer Formel. Die Syntax wurde für gute Verständlichkeit leicht geglättet; Wiederholungen und inhaltliche Spannungen des Hebräischen bleiben erhalten.
