lexical_decisions:
- source_word: קָצַף ... קָצֶף
  choice: war sehr zornig
  rationale: Das Verb und das unmittelbar folgende stammverwandte Substantiv bilden eine emphatische Konstruktion. „War sehr zornig“ gibt ihre verstärkende Wirkung in natürlichem Deutsch wieder, ohne die hebräische Wiederholung hölzern nachzuahmen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. „Jahwe“ ist die im Deutschen geläufige Transkription.
- source_word: עַל
  choice: auf
  rationale: Bei einem Ausdruck des Zorns bezeichnet die Präposition die Personen, gegen die sich der Zorn richtet. Die deutsche Verbindung „zornig auf“ ist hier idiomatisch.
- source_word: אֲבֹתֵיכֶם
  choice: eure Väter
  rationale: Die Wiedergabe bewahrt die konkrete Form des hebräischen Ausdrucks; im Zusammenhang sind damit die Väter beziehungsweise Vorfahren früherer Generationen gemeint.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich den Gottesnamen. Die Transkription bewahrt ihn als Eigennamen, statt ihn durch einen traditionellen Ersatztitel wiederzugeben.
- issue: Reichweite von אֲבֹתֵיכֶם
  choice: eure Väter
  alternative: eure Vorfahren
  rationale: „Väter“ erhält die wörtliche und rhetorische Gestalt des Hebräischen; die Fußnote macht deutlich, dass der Ausdruck hier die Vorfahren beziehungsweise früheren Generationen bezeichnet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die emphatische hebräische Verbindung wird idiomatisch durch „sehr zornig“ ausgedrückt; der Gottesname bleibt als Eigenname erhalten.
