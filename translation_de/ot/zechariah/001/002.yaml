  yaml_path: translation/ot/zechariah/001/002.yaml
  text: Yahweh was very angry with your fathers[a].
translation:
  language: de
  text: Jahwe war sehr zornig auf eure Väter.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eure Vorfahren“; wörtlich: „eure Väter“.'
