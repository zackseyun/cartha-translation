  text: וָ/אֹמַ֖ר מָה אֵ֣לֶּה אֲדֹנִ֑/י וַ/יֹּ֣אמֶר אֵלַ֗/י הַ/מַּלְאָךְ֙ הַ/דֹּבֵ֣ר בִּ֔/י אֲנִ֥י אַרְאֶ֖/ךָּ מָה הֵ֥מָּה אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/009.yaml
  text: Then I said[a], “What are these, my lord?” And the angel who was speaking with me said to me[b], “I will show you what these are.”
translation:
  language: de
  text: 'Da fragte ich[a]: »Was sind diese, mein Herr?« Und der Engel, der mit mir redete[b], sagte zu mir: »Ich werde dir zeigen, was diese sind.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Und ich sagte«. Weil die folgenden Worte eine Frage bilden, steht im Text »fragte ich«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »der in mir redete«; die hebräische Wendung bezeichnet hier das Reden mit dem Propheten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Da fragte ich
  rationale: Das Wayyiqtol führt die Erzählung weiter. Da der folgende direkte Satz eine Frage ist, gibt »fragte« die gemeinte Sprechhandlung im Deutschen natürlicher wieder als das formalere »sagte«; »da« markiert knapp die zeitliche Abfolge.
- source_word: מָה אֵלֶּה
  choice: Was sind diese?
  rationale: מָה mit dem substantivisch gebrauchten Demonstrativpronomen אֵלֶּה fragt nach der Identität der Erscheinungen. Ein zusätzliches »Dinge« ist im Deutschen nicht nötig.
- source_word: אֲדֹנִי
  choice: mein Herr
  rationale: Die Form ist hier eine respektvolle Anrede an den deutenden Engel und nicht der Gottesname. »Mein Herr« bewahrt den würdevollen Ton und den Bezug zu אדון, ohne die angesprochene Gestalt ausdrücklich mit JHWH gleichzusetzen.
- source_word: הַמַּלְאָךְ
  choice: der Engel
  rationale: מַלְאָךְ kann »Bote« oder »Engel« bedeuten. Im Zusammenhang der Vision handelt es sich um einen himmlischen Deuter; daher entspricht »Engel« dem Kontext und dem üblichen deutschen Sprachgebrauch.
- source_word: הַדֹּבֵר בִּי
  choice: der mit mir redete
  rationale: Das Partizip דֹּבֵר mit בִּי bezeichnet in Sacharja die Kommunikation des deutenden Engels mit dem Propheten. »Mit mir redete« gibt diesen idiomatischen Sinn wieder; das wörtliche »in mir« könnte irreführend eine innere Eingebung nahelegen.
- source_word: אֲנִי אַרְאֶךָּ
  choice: Ich werde dir zeigen
  rationale: Der Hifil von ראה bedeutet »sehen lassen, zeigen«. Das ausdrücklich gesetzte אֲנִי unterstreicht das Subjekt; die natürliche deutsche Formulierung mit »ich« trägt diese Aussage hinreichend.
- source_word: מָה הֵמָּה אֵלֶּה
  choice: was diese sind
  rationale: Die Wendung nimmt die Frage des Propheten wieder auf; הֵמָּה setzt dabei ein ausdrückliches Pronomen. »Was diese sind« bewahrt den Sinn, ohne die hebräische Wortstellung unnatürlich nachzubilden.
theological_decisions:
- issue: Bezug und Aussagekraft von אֲדֹנִי
  choice: Respektvolle Anrede »mein Herr« an den deutenden Engel
  alternative: »Herr«, »mein Gebieter« oder eine Wiedergabe als göttlicher Titel
  rationale: Der unmittelbare Kontext zeigt ein Gespräch mit dem deutenden Engel. Die Übersetzung wahrt die ehrerbietige Anrede, identifiziert die Gestalt aber nicht über den Wortlaut hinaus mit JHWH.
- issue: Bedeutung von בִּי in הַדֹּבֵר בִּי
  choice: Idiomatisch »der mit mir redete«
  alternative: Wörtlich »der in mir redete«
  rationale: Die wiederkehrende sacharjanische Formulierung beschreibt den Austausch zwischen Engel und Prophet. Eine rein wörtliche Fassung könnte eine Aussage über innere Inspiration eintragen, die der Dialogzusammenhang nicht verlangt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die direkte Rede folgt der deutschen Zeichensetzung. »Mein Herr« bleibt als respektvolle, leicht gehobene Anrede erhalten; sonst werden unnötig altertümliche oder hölzerne Formulierungen vermieden.
