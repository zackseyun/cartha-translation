source:
  edition: WLC
  text: וַ/יַּ֗עַן הָ/אִ֛ישׁ הָ/עֹמֵ֥ד בֵּין הַ/הַדַסִּ֖ים וַ/יֹּאמַ֑ר אֵ֚לֶּה אֲשֶׁ֣ר שָׁלַ֣ח יְהוָ֔ה לְ/הִתְהַלֵּ֖ךְ בָּ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/010.yaml
  text: Then the man who was standing among the myrtle trees answered and said[b][a], “These are the ones whom Yahweh has sent to walk throughout the earth.”
translation:
  language: de
  text: 'Da antwortete der Mann, der zwischen den Myrten stand, und sagte: »Das sind die, die Jahwe ausgesandt hat, um auf der Erde[a] umherzuziehen[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »im Land«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »auf der Erde umherzugehen«, »die Erde zu durchstreifen« oder »auf der Erde Streife zu gehen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: Da antwortete ... und sagte
  rationale: Die beiden hebräischen Redeeinleitungen werden bewahrt. Obwohl die Verbindung im Deutschen etwas feierlich klingt, ist sie verständlich und gibt die narrative Form des Ausgangstextes genau wieder.
- source_word: הָאִישׁ הָעֹמֵד
  choice: der Mann, der ... stand
  rationale: אִישׁ bezeichnet hier eine bestimmte männliche Gestalt; das Partizip עֹמֵד kennzeichnet sie durch ihren Standort. Im Deutschen gibt ein Relativsatz dies natürlich wieder.
- source_word: בֵּין הַהַדַסִּים
  choice: zwischen den Myrten
  rationale: בֵּין bedeutet grundsätzlich „zwischen“ beziehungsweise „inmitten“, und הֲדַסִּים bezeichnet Myrten. Die knappe Form entspricht dem Bild der Vision.
- source_word: אֵלֶּה אֲשֶׁר
  choice: Das sind die, die
  rationale: Das Demonstrativpronomen verweist auf die zuvor gesehenen Gestalten. Die deutsche Form macht den im Hebräischen vorausgesetzten persönlichen Bezug verständlich.
- source_word: שָׁלַח
  choice: ausgesandt hat
  rationale: „Aussenden“ passt zu einem Auftrag und wahrt den vollendeten Vorgang mit gegenwärtiger Bedeutung in der Visionsszene.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen ausdrücklich stehende Gottesname wird in seiner im Deutschen üblichen Form wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לְהִתְהַלֵּךְ
  choice: umherzuziehen
  rationale: Der Hitpael von הלך bezeichnet ein Sich-Hin-und-her-Bewegen beziehungsweise Umhergehen. „Umherziehen“ bewahrt das Bewegungsbild, ohne die mögliche Deutung als militärisches Patrouillieren in den Haupttext einzutragen.
- source_word: בָּאָרֶץ
  choice: auf der Erde
  rationale: אֶרֶץ kann sowohl die Erde als auch ein bestimmtes Land bezeichnen. Der weite Horizont der Vision spricht hier eher für „Erde“, während die örtlich begrenzte Möglichkeit in einer Fußnote erhalten bleibt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen Gottes. „Jahwe“ bewahrt diesen persönlichen Namen, statt ihn durch den traditionellen Titel „der HERR“ zu ersetzen.
- issue: Reichweite von בָּאָרֶץ
  choice: auf der Erde
  alternative: im Land
  rationale: Der Zusammenhang der ausgesandten Reiter legt einen umfassenden Bereich nahe, doch das hebräische Wort entscheidet nicht eindeutig zwischen der ganzen Erde und einem bestimmten Land. Die Alternative wird deshalb ausdrücklich in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht feierliche Doppelung „antwortete ... und sagte“ bewahrt die hebräische Erzählform; ansonsten ist die Syntax bewusst klar und allgemein verständlich gehalten.
