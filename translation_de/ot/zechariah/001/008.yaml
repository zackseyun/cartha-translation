source:
  edition: WLC
  text: רָאִ֣יתִי הַ/לַּ֗יְלָה וְ/הִנֵּה אִישׁ֙ רֹכֵב֙ עַל ס֣וּס אָדֹ֔ם וְ/ה֣וּא עֹמֵ֔ד בֵּ֥ין הַ/הֲדַסִּ֖ים אֲשֶׁ֣ר בַּ/מְּצֻלָ֑ה וְ/אַחֲרָי/ו֙ סוּסִ֣ים אֲדֻמִּ֔ים שְׂרֻקִּ֖ים וּ/לְבָנִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/008.yaml
  text: I saw in the night[a], and behold, a man riding on a red horse! He was standing among the myrtle trees that were in the ravine, and behind him were red, sorrel[b], and white horses.
translation:
  language: de
  text: 'In der Nacht sah ich, und siehe: ein Mann ritt auf einem roten Pferd. Er stand zwischen den Myrten, die in der Senke[a] waren, und hinter ihm waren rote, rotbraune[b] und weiße Pferde.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „in der Tiefe“ beziehungsweise „in der Mulde“; das hebräische Wort bezeichnet wahrscheinlich einen tief liegenden Ort oder eine Vertiefung.
    reason: lexical_alternative
  - marker: b
    text: Oder „gescheckte“, „gesprenkelte“; möglicherweise ist eine andere rötlich-braune Pferdefarbe gemeint. Die genaue Bedeutung des seltenen hebräischen Farbwortes ist unsicher.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתִי
  choice: sah ich
  rationale: Das Qal Perfekt 1. Person Singular von ראה bedeutet schlicht „ich sah“. Der Visionscharakter ergibt sich aus dem Zusammenhang und wird nicht in das Verb hineingetragen.
- source_word: הַלַּיְלָה
  choice: in der Nacht
  rationale: Die Wendung bezeichnet hier den nächtlichen Zeitpunkt der Schau; „in der Nacht“ ist im modernen Deutsch natürlich und wahrt die bestimmte Form.
- source_word: וְהִנֵּה
  choice: und siehe
  rationale: הִנֵּה lenkt die Aufmerksamkeit unvermittelt auf das nun erscheinende Bild. „Siehe“ bewahrt die feierliche Anschaulichkeit des prophetischen Berichts.
- source_word: אִישׁ
  choice: ein Mann
  rationale: Das Substantiv bezeichnet ausdrücklich einen Mann. Seine weitergehende Identität wird in diesem Vers nicht festgelegt.
- source_word: רֹכֵב עַל סוּס אָדֹם
  choice: ritt auf einem roten Pferd
  rationale: Das Partizip mit עַל beschreibt einen Reiter auf einem Pferd; אָדֹם bezeichnet eindeutig die Farbe Rot.
- source_word: וְהוּא עֹמֵד
  choice: Er stand
  rationale: 'Pronomen und Partizip schildern den Mann in einer andauernden, ortsfesten Stellung innerhalb der Vision. Die mögliche Spannung zum Reiten bleibt erhalten: Gemeint sein kann, dass der berittene Mann dort stillstand.'
- source_word: בֵּין הַהֲדַסִּים
  choice: zwischen den Myrten
  rationale: הֲדַסִּים sind Myrten. „Zwischen“ bildet die räumliche Präposition eng ab und ist auch bei einer Gruppe von Pflanzen verständlich.
- source_word: בַּמְּצֻלָה
  choice: in der Senke
  rationale: Das Wort bezeichnet etwas Tiefes beziehungsweise einen tiefer liegenden Ort. „Senke“ passt zum landschaftlichen Zusammenhang, ohne die genaue Geländeform übermäßig festzulegen; Alternativen stehen in der Fußnote.
- source_word: וְאַחֲרָיו
  choice: und hinter ihm
  rationale: Die Präposition bezeichnet in diesem Bild am natürlichsten die räumliche Position der Pferde hinter dem Mann.
- source_word: שְׂרֻקִּים
  choice: rotbraune
  rationale: Die seltene Farbbezeichnung ist unsicher und wird häufig auf eine besondere rötliche oder gemischte Pferdefarbe bezogen. „Rotbraun“ ist lesbar, während die Unsicherheit in der Fußnote gewahrt bleibt.
theological_decisions:
- issue: Identität des Mannes auf dem roten Pferd
  choice: Der Text nennt ihn lediglich „einen Mann“.
  alternative: Eine ausdrückliche Identifizierung als Engel des HERRN, symbolischer Reiter oder vorinkarnierter Christus.
  rationale: Der vorliegende Vers selbst bestimmt die Gestalt nicht näher. Eine theologische Identifizierung aus dem weiteren Zusammenhang wird daher nicht in die Übersetzung eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrter prophetischer Anschaulichkeit. „Und siehe“ hält den markanten Diskursruf fest; die syntaktische Spannung zwischen dem reitenden und dem stehenden Mann sowie die Unsicherheit der Gelände- und Farbbezeichnungen werden nicht eingeebnet.
