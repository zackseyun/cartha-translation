  terminology: »Engel Jahwes«, »Jahwe der Heerscharen«, »Erbarmen« und »zürnen« sind terminologisch tragfähig. Die Fußnoten bewahren die lexikalische Alternative bei מַלְאָךְ sowie die mögliche stärkere Wiedergabe von זעם, ohne eine dogmatische Identifikation einzutragen.
