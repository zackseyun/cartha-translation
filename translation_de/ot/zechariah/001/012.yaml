  text: וַ/יַּ֣עַן מַלְאַךְ יְהוָה֮ וַ/יֹּאמַר֒ יְהוָ֣ה צְבָא֔וֹת עַד מָתַ֗י אַתָּה֙ לֹֽא תְרַחֵ֣ם אֶת יְרוּשָׁלִַ֔ם וְ/אֵ֖ת עָרֵ֣י יְהוּדָ֑ה אֲשֶׁ֣ר זָעַ֔מְתָּה זֶ֖ה שִׁבְעִ֥ים שָׁנָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/012.yaml
  text: Then the angel of Yahweh answered and said[a], “O Yahweh of hosts, how long will you have no compassion on Jerusalem and on the cities of Judah[c][b], against which you have been angry these seventy years?”
translation:
  language: de
  text: 'Da antwortete der Engel Jahwes und sagte[a]: »Jahwe der Heerscharen, wie lange willst du dich Jerusalems und der Städte Judas nicht erbarmen[b], denen du nun schon seit siebzig Jahren zürnst[c]?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Bote Jahwes«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »wie lange wirst du Jerusalem und den Städten Judas kein Erbarmen zeigen?«'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »über die du nun schon seit siebzig Jahren entrüstet bist«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: der Engel Jahwes
  rationale: מַלְאַךְ kann »Bote« oder »Engel« bedeuten. Im Zusammenhang der prophetischen Vision ist »Engel« die natürlichere Bezeichnung; »Jahwes« gibt den Gottesnamen direkt wieder, ohne die Identität der Gestalt näher zu bestimmen.
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: Da antwortete ... und sagte
  rationale: Die beiden Erzählverben werden formal erkennbar wiedergegeben. »Antwortete« bezeichnet die Reaktion im Dialog, »sagte« leitet die direkte Rede ein.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: »Heerscharen« bewahrt die Bildwelt von צְבָאוֹת und die geläufige Würde des Gottesnamens; die Anrede ist im Deutschen auch ohne ein zusätzliches »O« eindeutig.
- source_word: עַד מָתַי
  choice: wie lange
  rationale: Dies ist die natürliche deutsche Wiedergabe der zeitlichen Klage- und Fürbitteformel.
- source_word: לֹא תְרַחֵם
  choice: willst du dich ... nicht erbarmen
  rationale: רחם bezeichnet Erbarmen beziehungsweise Mitgefühl. Die negierte Verbform des Hebräischen bleibt erhalten und klingt im Deutschen natürlich.
- source_word: אֶת יְרוּשָׁלִַם וְאֵת עָרֵי יְהוּדָה
  choice: Jerusalems und der Städte Judas
  rationale: Das reflexive deutsche Verb »sich erbarmen« regiert den Genitiv. Beide hebräischen Objekte bleiben ausdrücklich genannt.
- source_word: אֲשֶׁר זָעַמְתָּה
  choice: denen du ... zürnst
  rationale: זעם drückt Zorn oder Entrüstung aus. »Jemandem zürnen« ist knapp, würdig und verbindet den Relativsatz grammatisch mit Jerusalem und den Städten Judas, ohne die Beziehung umzudeuten.
- source_word: זֶה שִׁבְעִים שָׁנָה
  choice: nun schon siebzig Jahre
  rationale: Die Wendung bezeichnet eine bis zur Gegenwart reichende Dauer. »Nun schon« gibt den deiktischen und klagenden Nachdruck idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der im Ausgangstext stehende Eigenname wird als »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- issue: Identität von מַלְאַךְ יְהוָה
  choice: der Engel Jahwes
  alternative: der Bote Jahwes
  rationale: Die Übersetzung benennt die Gestalt entsprechend dem Visionskontext als Engel, legt aber keine weitergehende christologische oder andere dogmatische Identifikation fest.
- issue: Bezug des Relativsatzes אֲשֶׁר זָעַמְתָּה
  choice: denen du nun schon siebzig Jahre zürnst
  alternative: über die du seit siebzig Jahren entrüstet bist
  rationale: Der Relativsatz wird auf Jerusalem und die Städte Judas bezogen. Die Dauer des göttlichen Zorns bleibt bestehen, ohne das Verhältnis zwischen Zorn und Erbarmen theologisch aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Heerscharen« und »zürnen« bewahren den feierlichen prophetischen Ton, bleiben aber allgemein verständlich. Die Satzstellung wurde gegenüber dem Hebräischen behutsam geglättet; Mehrdeutigkeiten bei מַלְאַךְ und זעם werden in den Fußnoten sichtbar gehalten.
