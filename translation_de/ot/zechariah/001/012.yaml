  source_fidelity: 'Die Übersetzung gibt den hebräischen Satzbau und Sinngehalt zuverlässig wieder: Der Engel Jahwes tritt als Sprecher auf, Jahwe der Heerscharen wird angeredet, und die Fürbitte gilt Jerusalem sowie den Städten Judas. »sich ... erbarmen« und »zürnen« entsprechen רחם bzw. זעם angemessen. Die perfektische Form זָעַמְתָּ trägt eine bis in die Gegenwart reichende Zornesdauer; dies sollte im Deutschen mit »seit« idiomatisch deutlich gemacht werden.'
