source:
  edition: WLC
  text: בְּ/יוֹם֩ עֶשְׂרִ֨ים וְ/אַרְבָּעָ֜ה לְ/עַשְׁתֵּֽי עָשָׂ֥ר חֹ֨דֶשׁ֙ הוּא חֹ֣דֶשׁ שְׁבָ֔ט בִּ/שְׁנַ֥ת שְׁתַּ֖יִם לְ/דָרְיָ֑וֶשׁ הָיָ֣ה דְבַר יְהוָ֗ה אֶל זְכַרְיָה֙ בֶּן בֶּ֣רֶכְיָ֔הוּ בֶּן עִדּ֥וֹא הַ/נָּבִ֖יא לֵ/אמֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/007.yaml
  text: 'On the twenty-fourth day of the eleventh month (that is[a], the month Shebat), in the second year of Darius, the word of Yahweh came to Zechariah son of Berechiah, son of Iddo the prophet[b], saying:'
translation:
  language: de
  text: 'Am vierundzwanzigsten Tag des elften Monats – das ist der Monat Schebat[a] –, im zweiten Jahr des Darius, erging das Wort Jahwes an Sacharja, den Sohn Berechjas, den Sohn Iddos, den Propheten[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch „Schewat“ transkribiert.
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch wörtlich: „an Sacharja, den Sohn Berechjas, den Sohn Iddos, den Propheten“. Die Stellung des Titels lässt einen Bezug sowohl auf Sacharja als auch auf Iddo zu.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: בְּיוֹם עֶשְׂרִים וְאַרְבָּעָה
  choice: Am vierundzwanzigsten Tag
  rationale: Die hebräische Datumsformel wird im Deutschen idiomatisch mit „am“ und einer Ordinalzahl wiedergegeben.
- source_word: לְעַשְׁתֵּי עָשָׂר חֹדֶשׁ
  choice: des elften Monats
  rationale: Dies entspricht der hebräischen Monatszählung und natürlichem deutschem Datumsstil.
- source_word: הוּא חֹדֶשׁ שְׁבָט
  choice: das ist der Monat Schebat
  rationale: הוּא identifiziert den nummerierten Monat ausdrücklich mit seinem Namen; der Gedankenstrich bewahrt den erläuternden Einschub.
- source_word: שְׁבָט
  choice: Schebat
  rationale: Der Monatsname wird in einer im Deutschen geläufigen, dem hebräischen Šəḇāṭ nahen Form transkribiert.
- source_word: בִּשְׁנַת שְׁתַּיִם לְדָרְיָוֶשׁ
  choice: im zweiten Jahr des Darius
  rationale: Natürliche deutsche Wiedergabe der hebräischen Regierungsjahrformel.
- source_word: הָיָה דְבַר יְהוָה אֶל
  choice: erging das Wort Jahwes an
  rationale: In der prophetischen Offenbarungsformel bezeichnet היה nicht bloß ein Vorhandensein; „erging“ gibt die feste Wendung prägnant und würdig wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen etablierte Wiedergabe des göttlichen Eigennamens bewahrt den Namenscharakter des Tetragramms statt ihn durch einen Titel zu ersetzen.
- source_word: זְכַרְיָה בֶּן בֶּרֶכְיָהוּ בֶּן עִדּוֹא
  choice: Sacharja, den Sohn Berechjas, den Sohn Iddos
  rationale: Die genealogische Kette wird vollständig und in natürlichem Deutsch wiedergegeben.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Doppelpunkt leitet die folgende direkte Mitteilung idiomatisch ein und erfüllt hier die Funktion der hebräischen Redeformel.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den göttlichen Eigennamen; „Jahwe“ wahrt diesen, ohne ihn durch den traditionellen Ersatztitel aufzulösen.
- issue: Bezug von הַנָּבִיא („der Prophet“)
  choice: Sacharja wird im Haupttext als Prophet bezeichnet
  alternative: Der Titel kann syntaktisch auf Iddo bezogen werden
  rationale: Die Stellung am Ende der Namens- und Abstammungsformel lässt im Hebräischen einen gewissen Bezugsspielraum. Sacharja ist der Empfänger des prophetischen Wortes und wird im unmittelbaren Kontext als Prophet vorgestellt; die mögliche nähere Zuordnung zu Iddo bleibt in einer Fußnote sichtbar.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Der erläuternde Kalendereinschub bleibt sichtbar; die schwer nachzubildende syntaktische Mehrdeutigkeit des Prophetentitels wird nicht verschwiegen.
