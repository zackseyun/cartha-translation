  text: Your fathers—where are they? And the prophets[a], do they live forever?
translation:
  language: de
  text: Eure Väter[a] – wo sind sie? Und die Propheten – leben sie ewig?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eure Vorfahren“. Wörtlich: „eure Väter“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבֹתֵיכֶם
  choice: eure Väter
  rationale: Der hebräische Ausdruck bezeichnet wörtlich die »Väter« der Angesprochenen, also die früheren Generationen. »Eure Väter« bewahrt die konkrete familiäre Ausdrucksweise und die rhetorische Direktheit.
- source_word: אַיֵּה הֵם
  choice: wo sind sie?
  rationale: Das Frageadverb אַיֵּה bedeutet »wo?«; das selbstständige Pronomen הֵם wird durch »sie« ausdrücklich wiedergegeben und trägt zur pointierten rhetorischen Frage bei.
- source_word: וְהַנְּבִאִים
  choice: Und die Propheten
  rationale: Die einfache Verbindung mit וְ sowie der bestimmte Plural werden direkt wiedergegeben. Die Parallelität zum ersten Fragesatz bleibt erhalten.
- source_word: הַלְעוֹלָם
  choice: etwa ewig
  rationale: לְעוֹלָם bezeichnet hier ein unbegrenztes Fortleben. »Ewig« ist im Deutschen natürlich; »etwa« kennzeichnet idiomatisch die rhetorische Frage, ohne den Bedeutungsgehalt zu verändern.
- source_word: יִחְיוּ
  choice: leben sie
  rationale: Der Qal-Imperfekt 3. Person Plural von חיה steht in einer allgemeinen rhetorischen Frage. Das deutsche Präsens gibt diese Aussage über menschliche Sterblichkeit natürlich wieder.
theological_decisions:
- issue: Bezug und rhetorische Funktion der Prophetenfrage
  choice: Sowohl die Väter als auch die Propheten erscheinen als sterbliche Menschen; die Frage bleibt auf ihre Lebensdauer bezogen.
  alternative: Die Propheten könnten lediglich als Gegenüber zu den bereits verstorbenen Vätern genannt sein, während der Gegensatz zwischen vergänglichen Boten und bleibendem Gotteswort erst in Vers 6 ausdrücklich wird.
  rationale: Der hebräische Wortlaut fragt nur, ob die Propheten ewig leben. Die Fortdauer oder Erfüllung ihres Wortes wird hier nicht vorweggenommen; so bleibt die Spannung zum folgenden Vers erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich bildet die scharf gesetzten rhetorischen Fragen des Hebräischen ab. »Etwa« macht die erwartete verneinende Antwort im Deutschen natürlich hörbar, ohne sie ausdrücklich auszuformulieren.
