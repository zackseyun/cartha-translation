source:
  edition: WLC
  text: וַ/יַּ֣עַן יְהוָ֗ה אֶת הַ/מַּלְאָ֛ךְ הַ/דֹּבֵ֥ר בִּ֖/י דְּבָרִ֣ים טוֹבִ֑ים דְּבָרִ֖ים נִחֻמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/013.yaml
  text: And Yahweh answered the angel who was speaking with me with good words[b][a], comforting words.
translation:
  language: de
  text: Und Jahwe antwortete dem Engel, der mit mir redete, mit guten Worten, tröstlichen Worten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit guten Worten, Worten des Trostes«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: antwortete
  rationale: ענה bezeichnet im erzählenden Dialog am natürlichsten ein Antworten; das deutsche Präteritum passt zum Berichtsstil.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הַמַּלְאָךְ
  choice: dem Engel
  rationale: מלאך kann »Bote« oder »Engel« bedeuten; im visionären Zusammenhang ist ein himmlisches Wesen gemeint.
- source_word: הַדֹּבֵר בִּי
  choice: der mit mir redete
  rationale: Die partizipiale Wendung bezeichnet den Engel, der im Verlauf der Vision mit dem Propheten spricht; »mit mir redete« ist idiomatisches, würdevolles Deutsch.
- source_word: דְּבָרִים טוֹבִים
  choice: mit guten ... Worten
  rationale: Die direkte Wiedergabe bewahrt die positive, aber nicht unnötig eingeengte Bedeutung von טוֹבִים.
- source_word: דְּבָרִים נִחֻמִים
  choice: tröstlichen Worten
  rationale: נִחֻמִים bezeichnet Trost beziehungsweise Zuspruch; »tröstlich« gibt die Funktion der Worte natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen יהוה. »Jahwe« bewahrt ihn als Namen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bezug des Engels
  choice: der Engel, der mit dem Propheten redete
  alternative: ein allgemein als Bote verstandener מלאך
  rationale: Der unmittelbare visionäre Zusammenhang weist auf den deutenden Engel hin, ohne ihn im Haupttext zusätzlich zu identifizieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von דְּבָרִים wird im flüssigen Haupttext zusammengezogen, in der Fußnote aber sichtbar gehalten. »Jahwe« folgt der quellennahen Wiedergabe des Gottesnamens.
