source:
  edition: WLC
  text: בַּ/חֹ֨דֶשׁ֙ הַ/שְּׁמִינִ֔י בִּ/שְׁנַ֥ת שְׁתַּ֖יִם לְ/דָרְיָ֑וֶשׁ הָיָ֣ה דְבַר יְהוָ֗ה אֶל זְכַרְיָה֙ בֶּן בֶּ֣רֶכְיָ֔ה בֶּן עִדּ֥וֹ הַ/נָּבִ֖יא לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/001.yaml
  text: In the eighth month[a], in the second year of Darius, the word of Yahweh came to Zechariah son of Berechiah, son of Iddo the prophet, saying,
translation:
  language: de
  text: 'Im achten Monat, im zweiten Jahr des Darius, erging das Wort Jahwes[a] an Sacharja, den Sohn Berechjas, der ein Sohn Iddos, des Propheten, war, mit den Worten:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch JHWH; traditionell mit „der HERR“ wiedergegeben.
    reason: Der Eigenname Gottes wird im Haupttext als „Jahwe“ wiedergegeben; die Fußnote nennt die hebräische Form und die traditionelle Ersatzlesung.
lexical_decisions:
- source_word: בַּ/חֹדֶשׁ הַ/שְּׁמִינִי
  choice: Im achten Monat
  rationale: Die Zeitangabe wird als natürliche deutsche Datierungsformel wiedergegeben; gemeint ist der achte Monat des damaligen Kalenders.
- source_word: בִּ/שְׁנַת שְׁתַּיִם לְ/דָרְיָוֶשׁ
  choice: im zweiten Jahr des Darius
  rationale: Die Formulierung bewahrt die übliche Angabe eines Regierungsjahres, ohne das im Hebräischen nicht ausdrücklich vorhandene Wort „Regierungsjahr“ einzufügen.
- source_word: הָיָה דְבַר יְהוָה
  choice: erging das Wort Jahwes
  rationale: In prophetischen Einleitungen bezeichnet היה mit דְבַר יְהוָה das Eintreffen göttlicher Offenbarung. „Erging“ ist im Deutschen prägnant und idiomatisch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die geläufige deutsche Form.
- source_word: אֶל זְכַרְיָה
  choice: an Sacharja
  rationale: אֶל kennzeichnet hier den Empfänger des göttlichen Wortes; der Personenname erhält seine gebräuchliche deutsche Form.
- source_word: בֶּן בֶּרֶכְיָה בֶּן עִדּוֹ
  choice: den Sohn Berechjas, des Sohnes Iddos
  rationale: Die zweimalige Abstammungsangabe mit בֶּן wird bewahrt. Die deutsche Genitivkonstruktion macht deutlich, dass Berechja als Sohn Iddos bezeichnet wird.
- source_word: הַ/נָּבִיא
  choice: den Propheten
  rationale: Die Apposition wird im Haupttext auf Sacharja bezogen, wie es der Zusammenhang nahelegt; die grammatisch mögliche Beziehung auf Iddo wird in einer Fußnote offengehalten.
- source_word: לֵ/אמֹר
  choice: 'mit den Worten:'
  rationale: Der Infinitiv leitet die nachfolgende Rede ein. Die deutsche Wendung signalisiert klar, dass der Satz im nächsten Vers fortgesetzt wird.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ bewahrt dessen Charakter als Gottesname, während „der HERR“ eine traditionelle Ersatzlesung ist.
- issue: Bezug von הַנָּבִיא („der Prophet“)
  choice: Bezug auf Sacharja
  alternative: Bezug auf Iddo
  rationale: Die Bezeichnung wird häufig als Apposition zu Sacharja verstanden, doch ihre Stellung nach Iddo lässt auch den Bezug auf Iddo zu. Diese syntaktische Mehrdeutigkeit wird in der Fußnote ausdrücklich genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die prophetische Einleitungsformel bleibt erkennbar, während „erging“ und „mit den Worten“ einen natürlichen deutschen Satz ergeben. Die genealogische Form bleibt bewusst eng am Hebräischen.
