reference: Zechariah 1:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: ע֣וֹד קְרָ֣א לֵ/אמֹ֗ר כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת ע֛וֹד תְּפוּצֶ֥ינָה עָרַ֖/י מִ/טּ֑וֹב וְ/נִחַ֨ם יְהוָ֥ה עוֹד֙ אֶת צִיּ֔וֹן וּ/בָחַ֥ר ע֖וֹד בִּ/ירוּשָׁלִָֽם׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/017.yaml
  text: 'Call out again[a], saying, ‘Thus says Yahweh of hosts: My cities will again overflow with prosperity, and Yahweh will again comfort Zion and again choose Jerusalem.’'
translation:
  language: de
  text: 'Rufe noch einmal aus: »So spricht Jahwe der Heerscharen: Meine Städte werden wieder vor Wohlstand überfließen[a]. Jahwe wird Zion wieder trösten und Jerusalem wieder erwählen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Meine Städte werden sich wieder durch Gutes ausbreiten«; auch möglich: »Meine Städte werden wieder voller guter Dinge sein.«'
    reason: Das Verb תְּפוּצֶינָה kann räumliches Sich-Ausbreiten oder im Zusammenhang mit מִטּוֹב überreiche Fülle ausdrücken; zudem kann טוֹב konkret »Gutes/gute Dinge« oder zusammenfassend »Wohlstand« bedeuten.
lexical_decisions:
- source_word: עוֹד
  choice: wieder / noch einmal
  rationale: Das wiederholte Adverb kennzeichnet die erneute Verkündigung sowie Jahwes erneutes Segnen, Trösten und Erwählen nach dem Gericht. Beim ersten Vorkommen ist »noch einmal« im Deutschen idiomatisch, danach »wieder«.
- source_word: קְרָא לֵאמֹר
  choice: Rufe … aus
  rationale: Der Imperativ fordert zu einer hörbaren öffentlichen Verkündigung auf. Der hebräische Redeanschluss לֵאמֹר wird durch den folgenden Doppelpunkt natürlich wiedergegeben.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die vertraute prophetische Botenformel gibt die hebräische Wendung knapp und würdig wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die gebräuchliche deutsche Wiedergabe des ausdrücklich im hebräischen Text stehenden Gottesnamens bewahrt ihn als Eigennamen statt ihn durch einen Titel zu ersetzen.
- source_word: צְבָאוֹת
  choice: der Heerscharen
  rationale: Die traditionelle, in gehobenem modernem Deutsch weiterhin verständliche Wiedergabe hält die Weite des Ausdrucks für die himmlischen Heere beziehungsweise Mächte offen.
- source_word: תְּפוּצֶינָה
  choice: werden … überfließen
  rationale: Im Zusammenhang mit מִטּוֹב bezeichnet das Verb eine überreiche Ausbreitung beziehungsweise Fülle. »Überfließen« vermittelt die zugesagte Überfülle, ohne die mögliche räumliche Bedeutung ganz auszuschließen; diese wird in der Fußnote genannt.
- source_word: עָרַי
  choice: meine Städte
  rationale: Das Possessivsuffix der ersten Person ist bedeutungstragend und wird ausdrücklich wiedergegeben.
- source_word: מִטּוֹב
  choice: vor Wohlstand
  rationale: טוֹב bezeichnet hier im Wiederherstellungsorakel das Gute im Sinn wohltuender Fülle und gedeihlicher Verhältnisse. Die Verbindung »vor Wohlstand überfließen« ist natürliches Deutsch.
- source_word: וְנִחַם
  choice: wird … trösten
  rationale: Im Kontext der Wiederherstellung bezeichnet נחם den Trost nach erlittener Not. Die Verbform wird als zukünftige göttliche Handlung wiedergegeben.
- source_word: צִיּוֹן
  choice: Zion
  rationale: Der Eigenname wird in seiner etablierten deutschen Form beibehalten.
- source_word: וּבָחַר
  choice: und … wieder erwählen
  rationale: »Erwählen« gibt die bewusste, erneuerte Zuwendung zu Jerusalem präzise wieder. Es bewahrt den Bundeston des Verbs, ohne die Aussage durch eine bestimmte systematisch-theologische Deutung einzuengen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. »Jahwe« bewahrt ihn als persönlichen Namen, während »der HERR« ihn durch einen Titel ersetzen würde.
- issue: Jahwes erneute Wahl Jerusalems
  choice: Jerusalem wieder erwählen
  alternative: sich Jerusalem wieder zuwenden
  rationale: Das hebräische בחר spricht ausdrücklich von Wahl. »Erwählen« erhält diese Bundes- und Erwählungssprache; die zeitliche Partikel »wieder« bezeichnet erneuerte Gunst nach dem Gericht, ohne eine vollständige Aufhebung der früheren Erwählung dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit der vertrauten prophetischen Formel »So spricht«. »Heerscharen« wahrt den feierlichen Titel, ohne altertümliche Satzformen zu verwenden. Die dreifache Wiederholungsbewegung von עוֹד bleibt im Deutschen erkennbar.
