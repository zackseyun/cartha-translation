base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/016.yaml
  text: 'Therefore, thus says the LORD: I have returned to Jerusalem with compassion; my house will be built in her, declares the LORD of hosts, and a measuring line will be stretched out over Jerusalem.'
translation:
  language: de
  text: 'Darum spricht der HERR: Ich bin mit Erbarmen nach Jerusalem zurückgekehrt. Mein Haus wird in ihr gebaut werden, spricht der HERR der Heerscharen, und die Messschnur wird über Jerusalem ausgespannt werden.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁבְתִּי לִירוּשָׁלִַם
  choice: Ich habe mich Jerusalem wieder … zugewandt
  rationale: שׁוב mit אֶל/ל bezeichnet hier im Kontext die erneute gnädige Hinwendung bzw. Rückkehr zu Jerusalem. Die reflexive deutsche Wendung ist natürlich und bewahrt den Beziehungsaspekt.
- source_word: בְּרַחֲמִים
  choice: voller Erbarmen
  rationale: Der Plural רַחֲמִים bezeichnet tiefes Mitgefühl und Erbarmen; die Formulierung gibt sowohl die Haltung als auch die Art der erneuten Hinwendung wieder.
- source_word: בֵּיתִי יִבָּנֶה בָּהּ
  choice: Mein Haus soll darin gebaut werden
  rationale: Der hebräische Nifal ist passiv. בָּהּ bezieht sich grammatisch feminin auf Jerusalem; im Deutschen ist bei der Stadtbezeichnung das neutrale Adverb „darin“ idiomatischer als „in ihr“.
- source_word: יְהוָה צְבָאוֹת
  choice: der HERR der Heerscharen
  rationale: Die traditionelle Wiedergabe von JHWH als „der HERR“ wird mit der formnahen Übersetzung von צְבָאוֹת verbunden.
- source_word: וְקָו יִנָּטֶה עַל־יְרוּשָׁלִָם
  choice: und die Messschnur soll über Jerusalem ausgespannt werden
  rationale: קָו bezeichnet im Baukontext eine Messschnur; נטה im Passiv bedeutet „ausgespannt werden“. Die Aussage signalisiert Vermessung für den Wiederaufbau.
theological_decisions:
- issue: Bedeutung der Rückkehr Gottes
  choice: „Ich habe mich Jerusalem wieder … zugewandt“
  alternative: „Ich bin nach Jerusalem zurückgekehrt“
  rationale: Die Übersetzung lässt die reale göttliche Rückkehr bzw. erneute Gegenwart erkennen, vermeidet aber eine unnötig räumlich-körperliche Festlegung und passt zum Kontext von Gottes erneutem Erbarmen.
- issue: Modalität der beiden Imperfektformen
  choice: „soll … gebaut werden“ / „soll … ausgespannt werden“
  alternative: „wird … gebaut werden“ / „wird … ausgespannt werden“
  rationale: Nach der prophetischen Botenformel können die Formen als verbindliche Zukunftszusage verstanden werden. „Soll“ bewahrt zugleich den Charakter des göttlichen Beschlusses, ohne die Gewissheit der Zusage aufzuheben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit traditioneller Gottesnamenswiedergabe. Die Satzstruktur folgt dem prophetischen Ausspruch, wird jedoch für gute deutsche Lesbarkeit in zwei Sätze gegliedert.
