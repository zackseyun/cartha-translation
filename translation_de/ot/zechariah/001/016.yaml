review_pass:
  verdict: revise
  source_fidelity: Die Grundwiedergabe trifft den hebräischen Sinn. Präziser sind jedoch die indikativisch-zukünftigen Passivformen für die beiden Imperfekta; die Rückkehr wird am unmittelbarsten als Rückkehr nach Jerusalem ausgedrückt.
  naturalness: „Darum spricht der HERR so“ ist im heutigen Standarddeutsch weniger idiomatisch als die etablierte Botenformel „Darum spricht der HERR“. „Mit Erbarmen“ ist zudem eine natürlichere und quellennähere Wiedergabe von בְּרַחֲמִים als „voller Erbarmen“.
  terminology: „HERR der Heerscharen“, „Haus“ und „Messschnur“ sind sachgerecht. „In ihr“ bewahrt den femininen Bezug auf Jerusalem und ist in diesem würdigen Register gut verständlich.
  issues:
  - severity: low
    issue: Unnatürliche Stellung von „so“ in der Botenformel
    rationale: כֹּה אָמַר wird im Deutschen idiomatisch mit „so spricht/sagt der HERR“ wiedergegeben, nicht mit „spricht der HERR so“.
  - severity: medium
    issue: „Soll“ schwächt die Zukunftsaussage unnötig ab
    rationale: יִבָּנֶה und יִנָּטֶה sind hier prophetische Zukunftsaussagen. „Wird ... werden“ gibt dies direkter wieder und entspricht auch der englischen Audit-Fassung („will be“).
  - severity: low
    issue: „Voller Erbarmen“ ist weniger formnah
    rationale: Die Präpositionalphrase בְּרַחֲמִים bezeichnet die Art und Weise der Rückkehr; „mit Erbarmen“ gibt diese Verbindung unmittelbar wieder.
  revised_text: 'Darum spricht der HERR: Ich bin mit Erbarmen nach Jerusalem zurückgekehrt. Mein Haus wird in ihr gebaut werden, spricht der HERR der Heerscharen, und die Messschnur wird über Jerusalem ausgespannt werden.'
