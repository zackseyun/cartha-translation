base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/015.yaml
  text: And I am exceedingly angry with the nations that are at ease[a]; for I was only a little angry[d][c][b], but they helped forward the disaster.
translation:
  language: de
  text: Und ich bin überaus zornig[a] auf die Völker, die sorglos leben[b]. Denn ich war nur ein wenig zornig[c], sie aber förderten das Unheil[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Annähernd wörtlich: „Mit großem Zorn bin ich zornig.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die selbstzufriedenen Völker“; das hebräische Wort kann sorglose oder selbstgefällige Sicherheit bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „ich war nur kurze Zeit zornig“; das Hebräische kann den Grad oder die Dauer bezeichnen.'
    reason: alternative_reading
  - marker: d
    text: 'Wörtlich: „sie halfen zum Bösen“ beziehungsweise „zum Unheil“; gemeint sein kann auch, dass sie das Unheil verschärften.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקֶצֶף גָּדוֹל אֲנִי קֹצֵף
  choice: Und ich bin überaus zornig
  rationale: Die Verbindung aus קֶצֶף גָּדוֹל („großer Zorn“) und dem Partizip קֹצֵף bezeichnet einen gegenwärtigen, nachdrücklich gesteigerten Zorn. Die adverbiale Wiedergabe ist im Deutschen natürlich und bewahrt die Intensität.
- source_word: עַל הַגּוֹיִם
  choice: auf die Völker
  rationale: הַגּוֹיִם meint hier die fremden Völker im Umfeld Judas. „Völker“ ist unmittelbar und vermeidet spätere religiöse Konnotationen von „Heiden“.
- source_word: הַשַּׁאֲנַנִּים
  choice: die sorglos und sicher leben
  rationale: Das Wort bezeichnet ungestörte Ruhe beziehungsweise selbstsichere Sorglosigkeit. Die Doppelwendung gibt sowohl die äußere Sicherheit als auch den möglichen Unterton mangelnder Anteilnahme wieder, ohne ausdrücklich moralische Selbstzufriedenheit festzulegen.
- source_word: אֲשֶׁר
  choice: Denn
  rationale: Die Relativpartikel leitet hier sinngemäß die Begründung für Gottes Zorn ein; „Denn“ macht diese Beziehung in natürlichem Deutsch deutlich.
- source_word: קָצַפְתִּי מְּעָט
  choice: ich war nur ein wenig zornig
  rationale: מְעָט wird im Haupttext als Begrenzung des Grades verstanden. „Nur“ verdeutlicht den Kontrast zum Verhalten der Völker; die mögliche zeitliche Deutung wird in der Fußnote bewahrt.
- source_word: וְהֵמָּה
  choice: sie aber
  rationale: Das selbstständige Pronomen ist betont. „Sie aber“ bringt den Gegensatz zwischen Gottes begrenztem Zorn und dem Handeln der Völker zum Ausdruck.
- source_word: עָזְרוּ לְרָעָה
  choice: trugen zum Unheil bei
  rationale: Wörtlich steht „halfen zum Bösen/Unheil“. Die gewählte Formulierung ist verständliches modernes Deutsch und lässt offen, ob die Völker das Unheil förderten oder verschärften.
theological_decisions:
- issue: Verhältnis zwischen Gottes Zorn und dem Handeln der Völker
  choice: Der Text stellt Gottes begrenzten Zorn dem eigenverantwortlichen Beitrag der Völker zum Unheil gegenüber.
  alternative: Die Völker vollstreckten lediglich Gottes Gericht, ohne über dessen Absicht hinauszugehen.
  rationale: Die betonte Gegenüberstellung „ich … nur ein wenig … sie aber“ weist auf einen Gegensatz hin. Die Übersetzung wahrt zugleich Gottes Beteiligung am Gericht und die Verantwortung der Völker, ohne das genaue Verhältnis systematisch aufzulösen.
- issue: Bedeutung von מְעָט
  choice: 'Begrenzter Grad: „nur ein wenig zornig“'
  alternative: 'Begrenzte Dauer: „nur kurze Zeit zornig“'
  rationale: Der Grad ergibt im Kontrast zum anschließenden Handeln der Völker einen naheliegenden Sinn. Da das Adverb auch zeitlich verstanden werden kann, wird diese echte Mehrdeutigkeit in der Fußnote ausdrücklich erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nah an der hebräischen Gegenüberstellung, während schwer verständliche wörtliche Idiome im Haupttext natürlich wiedergegeben und in den Fußnoten dokumentiert werden.
