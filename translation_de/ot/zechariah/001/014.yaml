  text: וַ/יֹּ֣אמֶר אֵלַ֗/י הַ/מַּלְאָךְ֙ הַ/דֹּבֵ֣ר בִּ֔/י קְרָ֣א לֵ/אמֹ֔ר כֹּ֥ה אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת קִנֵּ֧אתִי לִ/ירוּשָׁלִַ֛ם וּ/לְ/צִיּ֖וֹן קִנְאָ֥ה גְדוֹלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/014.yaml
  text: 'Then the angel who was speaking with me said to me[a], “Proclaim, saying, ‘Thus says Yahweh of hosts: I am exceedingly jealous for Jerusalem and for Zion.’”'
translation:
  language: de
  text: 'Da sagte der Engel, der mit mir redete, zu mir: „Rufe aus: So spricht Jahwe, der Herr der Heerscharen: Mit großer Eifersucht eifere ich für Jerusalem und für Zion.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mit großem Eifer eifere ich für Jerusalem und für Zion.“ Im Hebräischen werden Verb und Substantiv desselben Wortstamms zur Verstärkung miteinander verbunden; der Stamm kann sowohl Eifer als auch Eifersucht bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ הַדֹּבֵר בִּי
  choice: der Engel, der mit mir redete
  rationale: Die Wendung דֹּבֵר בִּי bezeichnet in diesem Zusammenhang den Engel, der mit dem Propheten redet, nicht ein Reden im Inneren des Propheten. Das deutsche Präteritum gibt die in die Erzählung eingebettete Partizipialform natürlich wieder.
- source_word: קְרָא לֵאמֹר
  choice: Rufe aus
  rationale: קרא bezeichnet hier den befohlenen öffentlichen Ausruf. Das zusätzliche לֵאמֹר wird im Deutschen nicht mit einem schwerfälligen „und sprich“ wiederholt, sondern durch den folgenden Doppelpunkt funktional wiedergegeben.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die traditionelle und weiterhin verständliche deutsche Botenformel bewahrt den feierlichen prophetischen Ton.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe, der Herr der Heerscharen
  rationale: „Jahwe“ gibt den Gottesnamen wieder; „Herr der Heerscharen“ bewahrt die militärische beziehungsweise himmlische Bildwelt von צְבָאוֹת und klingt im Deutschen als Titel natürlich.
- source_word: קִנֵּאתִי ... קִנְאָה גְדוֹלָה
  choice: Mit großem Eifer eifere ich
  rationale: Die Wiederholung desselben hebräischen Wortstamms wird im Deutschen durch „Eifer/eifere“ sichtbar gehalten. Die Formulierung bewahrt die starke, leidenschaftliche und potenziell eifersüchtige Bundesbindung, ohne sie auf nur eine deutsche Bedeutungsnuance festzulegen.
- source_word: לִירוּשָׁלִַם וּלְצִיּוֹן
  choice: für Jerusalem und für Zion
  rationale: Die Wiederholung von „für“ entspricht den beiden hebräischen Präpositionen und hebt beide Ortsbezeichnungen eigens hervor.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Umschrift „Jahwe“ macht den im Hebräischen stehenden Eigennamen transparent und vermeidet, ihn stillschweigend durch einen Titel zu ersetzen.
- issue: Bedeutung von קנא / קנאה in Bezug auf Gott
  choice: Mit großem Eifer eifere ich
  alternative: Ich bin von großer Eifersucht erfüllt
  rationale: Der hebräische Wortstamm kann sowohl Eifer als auch Eifersucht bezeichnen. Die Hauptfassung wahrt durch die Stammwiederholung den Nachdruck des Originals; die Fußnote hält die schärfere, bundestheologisch spannungsreiche Nuance ausdrücklich offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter prophetischer Botenformel. Der Satzbau bleibt gut vorlesbar; die hebräische Emphase und die Mehrdeutigkeit zwischen Eifer und Eifersucht werden nicht eingeebnet.
