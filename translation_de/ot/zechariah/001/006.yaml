  source_fidelity: Die Übersetzung gibt die adversative Einleitung אַךְ mit „Doch“ angemessen wieder und bewahrt die rhetorische Frage. „Worte und Bestimmungen“, „Dienern, den Propheten“, „eingeholt“, „umkehren“ sowie die Vergleichsformeln zu Wegen und Taten entsprechen dem hebräischen Text gut. Die Wiedergabe von עשה ... לנו mit „mit uns verfahren“ ist kontextgerecht; das Perfekt im Zitat stellt das vollzogene Handeln dar.
  naturalness: Der Text ist flüssiges, würdevolles modernes Standarddeutsch. „Vorfahren“ ist als gegenwartsnahe Wiedergabe von אבותיכם gut verständlich. Der Gedankenstrich unterstützt die Struktur der rhetorischen Frage, ohne den Sinn zu verändern.
  terminology: „Jahwe der Heerscharen“ gibt יהוה צבאות transparent und traditionsbewusst wieder. „Bestimmungen“ ist für חקים eine tragfähige moderne Wiedergabe. Die Hauptfassung „Da kehrten sie um“ wahrt die semantische Offenheit von וישובו; die Fußnote nennt die mögliche Bußbedeutung, ohne sie dogmatisch festzulegen.
