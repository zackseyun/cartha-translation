  variant: modern standard German
source:
  edition: WLC
  text: אַ֣ךְ דְּבָרַ֣/י וְ/חֻקַּ֗/י אֲשֶׁ֤ר צִוִּ֨יתִי֙ אֶת עֲבָדַ֣/י הַ/נְּבִיאִ֔ים הֲ/ל֥וֹא הִשִּׂ֖יגוּ אֲבֹתֵי/כֶ֑ם וַ/יָּשׁ֣וּבוּ וַ/יֹּאמְר֗וּ כַּ/אֲשֶׁ֨ר זָמַ֜ם יְהוָ֤ה צְבָאוֹת֙ לַ/עֲשׂ֣וֹת לָ֔/נוּ כִּ/דְרָכֵ֨י/נוּ֙ וּ/כְ/מַ֣עֲלָלֵ֔י/נוּ כֵּ֖ן עָשָׂ֥ה אִתָּֽ/נוּ׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/006.yaml
  text: But did not my words and my statutes[a], which I commanded my servants the prophets, overtake your fathers? Then they turned back and said, ‘As Yahweh of Armies planned to do to us, according to our ways and according to our deeds[c][b], so he has dealt with us.’
translation:
  language: de
  text: 'Doch meine Worte und meine Bestimmungen, die ich meinen Dienern, den Propheten, geboten hatte[a] — haben sie eure Vorfahren nicht eingeholt? Da kehrten sie um[b] und sagten: »Wie Jahwe der Heerscharen geplant hatte, mit uns zu verfahren, entsprechend unseren Wegen und unseren Taten, so ist er mit uns verfahren.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die ich durch meine Diener, die Propheten, geboten hatte“.'
    reason: Die hebräische Konstruktion bezeichnet unmittelbar die Propheten als Empfänger des Befehls; dem Zusammenhang nach können sie zugleich als dessen Übermittler verstanden werden.
  - marker: b
    text: 'Oder: „Da bereuten sie es und sagten“. Das hebräische Verb kann „umkehren/zurückkehren“ und im Zusammenhang auch „bereuen“ bedeuten.'
    reason: Die alternative Wiedergabe macht den möglichen Sinn ausdrücklicher Buße sichtbar, ohne ihn im Haupttext festzuschreiben.
lexical_decisions:
- source_word: אַךְ
  choice: Doch
  rationale: Markiert den Gegensatz zum vorausgehenden Hinweis auf die Vergänglichkeit der Vorfahren und Propheten in natürlichem, gehobenem Deutsch.
- source_word: דְּבָרַי וְחֻקַּי
  choice: meine Worte und meine Bestimmungen
  rationale: „Worte“ bewahrt die Unmittelbarkeit des göttlichen Redens; „Bestimmungen“ gibt חֻקַּי verständlich wieder, ohne es auf bloße Gesetzesparagraphen einzuengen.
- source_word: צִוִּיתִי אֶת־עֲבָדַי הַנְּבִיאִים
  choice: die ich meinen Dienern, den Propheten, geboten hatte
  rationale: Folgt der hebräischen Syntax, nach der die Propheten die Empfänger des Befehls sind; die kontextuell mögliche instrumentale Auffassung wird in einer Fußnote genannt.
- source_word: הִשִּׂיגוּ
  choice: eingeholt
  rationale: Bewahrt das Bild, dass Gottes Worte beziehungsweise die darin angekündigten Folgen die Vorfahren wie ein Verfolger erreichen.
- source_word: וַיָּשׁוּבוּ
  choice: Da kehrten sie um
  rationale: Gibt die Grundbedeutung von שׁוּב wieder und lässt offen, ob ausdrücklich eine innere Umkehr im theologischen Sinn gemeint ist.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Gibt den Gottesnamen als „Jahwe“ wieder. „Heerscharen“ erhält die militärische und kosmische Weite des Titels und ist im Deutschen würdevoll und verständlich.
- source_word: זָמַם
  choice: geplant hatte
  rationale: Bezeichnet einen gefassten Vorsatz; „geplant“ ist klar und gegenwärtig, ohne die zielgerichtete Absicht abzuschwächen.
- source_word: כִדְרָכֵינוּ וּכְמַעֲלָלֵינוּ
  choice: entsprechend unseren Wegen und unseren Taten
  rationale: „Wege“ erhält die moralische Bildsprache für die Lebensführung, „Taten“ bezeichnet das konkrete Handeln.
- source_word: כֵּן עָשָׂה אִתָּנוּ
  choice: so ist er mit uns verfahren
  rationale: Natürliches Deutsch für Gottes tatsächliches Handeln an ihnen; der Zusammenhang mit dem zuvor geplanten Vorgehen bleibt deutlich.
theological_decisions:
- issue: Ob וַיָּשׁוּבוּ ausdrücklich als Buße zu verstehen ist
  choice: Da kehrten sie um
  alternative: Da bereuten sie es
  rationale: שׁוּב kann im Kontext Umkehr oder Buße bezeichnen, doch der Satz nennt ausdrücklich nur ihre Hinwendung zur Einsicht und ihr Bekenntnis zu Gottes gerechtem Handeln. Die Übersetzung löst diese Spannung nicht vorschnell auf.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH; „Jahwe“ macht diesen im Haupttext sichtbar, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug von Gottes vergeltendem Handeln
  choice: entsprechend unseren Wegen und unseren Taten
  alternative: wie es unsere Wege und Taten verdienten
  rationale: Die gewählte Fassung wahrt die Vergleichsformeln des Hebräischen, ohne eine über den Wortlaut hinausgehende Theorie des Verdienstes einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich hebt die rhetorische Frage hervor. „Vorfahren“ ist heute verständlicher und inklusiver als das traditionelle „Väter“. Die Zitatstruktur und die Wiederholung von Gottes geplantem und vollzogenem Handeln bleiben erhalten.
