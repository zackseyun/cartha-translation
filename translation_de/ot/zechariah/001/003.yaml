id: ZEC.1.3
reference: Zechariah 1:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֗ם כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת שׁ֣וּבוּ אֵלַ֔/י נְאֻ֖ם יְהוָ֣ה צְבָא֑וֹת וְ/אָשׁ֣וּב אֲלֵי/כֶ֔ם אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/003.yaml
  text: 'Therefore say to them[a], ‘Thus says Yahweh of hosts: Return to me,’ declares Yahweh of hosts, ‘and I will return to you,’ says Yahweh of hosts.'
translation:
  language: de
  text: 'Darum sag zu ihnen: »So spricht Jahwe der Heerscharen: Kehrt zu mir zurück[a]«, erklärt Jahwe der Heerscharen, »und ich werde zu euch zurückkehren«, spricht Jahwe der Heerscharen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wendet euch mir zu … und ich werde mich euch zuwenden.« Im Hebräischen steht in beiden Aussagen dasselbe Verb; dadurch wird die wechselseitige Wiederherstellung betont.'
    reason: Lexikalische Alternative und Erklärung der im Hebräischen hervorgehobenen Wiederholung.
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: Darum sag
  rationale: Das einleitende וְ verbindet den Auftrag mit der vorausgehenden Feststellung über Jahwes Zorn. »Darum« macht diesen Folgerungszusammenhang in natürlichem Deutsch deutlich; »sag« gibt den singularischen Imperativ wieder.
- source_word: אֲלֵהֶם
  choice: zu ihnen
  rationale: Entspricht der Richtungspräposition אֶל mit dem Suffix der 3. Person Plural maskulin.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Bewahrt die traditionelle, würdige Form der prophetischen Botenformel und ist im heutigen Standarddeutsch weiterhin verständlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: צְבָאוֹת
  choice: der Heerscharen
  rationale: Die feste Gottesbezeichnung »Jahwe der Heerscharen« wahrt die breite Bedeutung des Ausdrucks, der nicht nur irdische Heere bezeichnen muss.
- source_word: שׁוּבוּ אֵלַי
  choice: Kehrt zu mir zurück
  rationale: שׁוּב bezeichnet Umkehr beziehungsweise Rückkehr. Die Formulierung bewahrt sowohl die räumlich-relationale Bildsprache als auch den Aufruf zur Umkehr, ohne das Gemeinte durch einen ausdrücklich theologischen Fachbegriff zu verengen.
- source_word: נְאֻם
  choice: erklärt
  rationale: Gibt die autoritative prophetische Ausspruchsformel in flüssigem modernem Deutsch wieder und unterscheidet sie zugleich leicht vom abschließenden אָמַר.
- source_word: וְאָשׁוּב אֲלֵיכֶם
  choice: und ich werde zu euch zurückkehren
  rationale: Die Wiederholung desselben Verbs שׁוּב wird durch »zurückkehren« erhalten. »Und« bildet die hebräische Verknüpfung formal ab, ohne das Verhältnis stärker als ausdrücklich konditional oder temporal festzulegen.
- source_word: אָמַר יְהוָה צְבָאוֹת
  choice: spricht Jahwe der Heerscharen
  rationale: Gibt die abschließende Redeeinleitung knapp und mit prophetischem Sprachklang wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen Gottes. »Jahwe« bewahrt diesen als Namen und ersetzt ihn nicht durch einen Titel.
- issue: Wechselseitigkeit in der Wiederholung von שׁוּב
  choice: Kehrt zu mir zurück … und ich werde zu euch zurückkehren
  alternative: Wendet euch mir zu … und ich werde mich euch zuwenden
  rationale: Dasselbe hebräische Verb bezeichnet die Handlung des Volkes und die Antwort Gottes. Die identische deutsche Verbwahl bewahrt diese bewusst angelegte Gegenseitigkeit und lässt die Spannung zwischen menschlicher Umkehr und göttlicher Wiederzuwendung stehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrtem prophetischem Sprachklang. Die dreifache Nennung »Jahwe der Heerscharen« bleibt trotz ihrer rhetorischen Schwere erhalten, weil sie im Ausgangstext auffällig wiederholt wird.
