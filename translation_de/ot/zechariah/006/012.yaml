id: ZEC.6.12
reference: Zechariah 6:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֤ אֵלָי/ו֙ לֵ/אמֹ֔ר כֹּ֥ה אָמַ֛ר יְהוָ֥ה צְבָא֖וֹת לֵ/אמֹ֑ר הִנֵּה אִ֞ישׁ צֶ֤מַח שְׁמ/וֹ֙ וּ/מִ/תַּחְתָּ֣י/ו יִצְמָ֔ח וּ/בָנָ֖ה אֶת הֵיכַ֥ל יְהוָֽהּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/012.yaml
  text: 'And say to him[a], ‘Thus says Yahweh of Armies: Behold, a man—Branch is his name—and he will branch out from his place and build the temple of Yahweh.’'
translation:
  language: de
  text: 'Und sage zu ihm: »So spricht Jahwe der Heerscharen: Siehe, ein Mann – ›Spross‹ ist sein Name. Von seiner Stelle aus wird er sprossen[a] und den Tempel Jahwes bauen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Von unter ihm wird er sprossen.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel wie »der HERR« ersetzt.
- source_word: צְבָאוֹת
  choice: der Heerscharen
  rationale: Die traditionelle, im heutigen Standarddeutsch noch verständliche Wiedergabe bewahrt die Vorstellung der unter Jahwes Befehl stehenden Heere.
- source_word: הִנֵּה
  choice: Siehe
  rationale: »Siehe« erhält den feierlichen, Aufmerksamkeit weckenden Ton der prophetischen Verkündigung.
- source_word: אִישׁ
  choice: ein Mann
  rationale: Die maskuline Einzelfigur des hebräischen Textes wird präzise wiedergegeben.
- source_word: צֶמַח
  choice: Spross
  rationale: »Spross« bewahrt das Pflanzenbild und funktioniert in der Namensformel als titelartige Bezeichnung, ohne die Figur ausdrücklich als Messias zu identifizieren.
- source_word: שְׁמוֹ
  choice: ist sein Name
  rationale: Die hebräische Namensformel wird unmittelbar und idiomatisch wiedergegeben.
- source_word: וּמִתַּחְתָּיו
  choice: Von seiner Stelle aus
  rationale: Diese idiomatische Wiedergabe bezeichnet den Ausgangspunkt seines Wachstums; die räumlich wörtlichere, aber mehrdeutige Formulierung wird in der Fußnote bewahrt.
- source_word: יִצְמָח
  choice: wird er sprossen
  rationale: Das Verb erhält die Wortverbindung mit dem Namen »Spross« und bewahrt so das hebräische Wortspiel.
- source_word: וּבָנָה
  choice: und … bauen
  rationale: Die Zukunftsbedeutung ergibt sich aus »wird« und gilt im Deutschen natürlich auch für das koordinierte Verb »bauen«.
- source_word: הֵיכַל
  choice: Tempel
  rationale: Im Zusammenhang bezeichnet das Wort eindeutig das Heiligtum Jahwes; »Tempel« ist die klare standarddeutsche Entsprechung.
theological_decisions:
- issue: Messianische Bedeutung von צֶמַח
  choice: Die titelartige Bezeichnung wird als »Spross« wiedergegeben.
  alternative: Das Wort lediglich als gewöhnliches Substantiv wie »Trieb« oder »Schössling« wiederzugeben oder ausdrücklich »Messias« einzusetzen.
  rationale: Die Formel »Spross ist sein Name« stützt den Charakter einer besonderen Benennung. Messianische Resonanzen bleiben erkennbar, werden aber nicht durch eine im Vers unausgesprochene Identifizierung ausgedeutet.
- issue: Identität des Tempelbauers
  choice: Die Figur bleibt entsprechend dem hebräischen Text »ein Mann« namens »Spross«; das Pronomen wird nicht näher bestimmt.
  alternative: Die Figur ausdrücklich mit Josua oder dem Messias gleichzusetzen.
  rationale: Der Vers selbst löst die Identität nicht ausdrücklich auf. Die Übersetzung bewahrt diese Deutungsoffenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetisch-feierlichem Ton. »Siehe« und »Heerscharen« sind bewusst gehoben, bleiben aber verständlich. Die Wiederholung »Spross … sprossen« bildet das hebräische Wortspiel nach.
