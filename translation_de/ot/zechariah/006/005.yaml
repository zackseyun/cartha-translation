base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/005.yaml
  text: Then the angel answered and said to me[a], “These are the four winds of heaven, going out from standing before the Lord of all the earth.”
translation:
  language: de
  text: 'Da antwortete mir der Engel: „Das sind die vier Winde[a] des Himmels, die hinausziehen, nachdem sie vor dem Herrn der ganzen Erde gestanden haben.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die vier Geister des Himmels“. Das hebräische Wort kann sowohl „Winde“ als auch „Geister“ bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן הַמַּלְאָךְ וַיֹּאמֶר אֵלָי
  choice: Da antwortete mir der Engel
  rationale: Die hebräische Doppelwendung »antwortete und sagte zu mir« wird in natürlichem Deutsch knapp wiedergegeben, ohne den Antwortcharakter zu verlieren.
- source_word: אַרְבַּע רֻחוֹת הַשָּׁמַיִם
  choice: die vier Winde des Himmels
  rationale: רוּחוֹת kann sowohl »Winde« als auch »Geister« bezeichnen. »Winde« passt unmittelbar zur kosmischen Bildsprache; die echte Mehrdeutigkeit wird in der Fußnote bewahrt.
- source_word: יוֹצְאוֹת
  choice: die hinausziehen
  rationale: Das Partizip bezeichnet die gegenwärtige beziehungsweise charakteristische Bewegung nach draußen.
- source_word: מֵהִתְיַצֵּב עַל
  choice: nachdem sie vor … gestanden haben
  rationale: התייצב bezeichnet das Sich-Hinstellen beziehungsweise den dienstbereiten Stand vor einem Höhergestellten. Die zeitliche Wiedergabe mit »nachdem« ergibt im Deutschen eine natürliche Abfolge, während »gestanden haben« eng am Ausdruck bleibt.
- source_word: אֲדוֹן כָּל הָאָרֶץ
  choice: dem Herrn der ganzen Erde
  rationale: »Herr« gibt den göttlichen Herrschaftstitel wieder; »die ganze Erde« wahrt den universalen Umfang.
theological_decisions:
- issue: Bedeutung von רֻחוֹת in der Vision
  choice: Winde
  alternative: Geister
  rationale: Das hebräische Wort trägt beide Bedeutungen. Im Haupttext steht die zur kosmischen und gerichteten Bewegung passende Lesart »Winde«; die mögliche Bezeichnung himmlischer Geistwesen bleibt ausdrücklich in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die schwerfällige hebräische Redeeinleitung ist idiomatisch gestrafft; die bildhafte und theologisch bedeutsame Mehrdeutigkeit bleibt durch die Fußnote sichtbar.
