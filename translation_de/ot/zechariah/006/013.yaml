id: ZEC.6.13
reference: Zechariah 6:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ֠/הוּא יִבְנֶ֞ה אֶת הֵיכַ֤ל יְהוָה֙ וְ/הֽוּא יִשָּׂ֣א ה֔וֹד וְ/יָשַׁ֥ב וּ/מָשַׁ֖ל עַל כִּסְא֑/וֹ וְ/הָיָ֤ה כֹהֵן֙ עַל כִּסְא֔/וֹ וַ/עֲצַ֣ת שָׁל֔וֹם תִּהְיֶ֖ה בֵּ֥ין שְׁנֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/013.yaml
  text: Yes[a], he will build the temple of Yahweh, and he will bear majesty, and he will sit and rule on his throne. And he will be a priest on his throne[c][b], and the counsel of peace will be between the two of them.
translation:
  language: de
  text: Ja, er wird den Tempel Jahwes bauen. Er wird Hoheit[c] tragen, auf seinem Thron sitzen und herrschen. Er wird Priester auf seinem Thron sein[a], und zwischen ihnen beiden[b] wird ein Ratschluss des Friedens bestehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und ein Priester wird auf seinem Thron sein“; das Hebräische lässt auch die Auffassung zu, dass der Priester vom thronenden Herrscher unterschieden wird.'
    reason: alternative_reading
  - marker: b
    text: „Ihnen beiden“ kann sich auf die königliche und die priesterliche Funktion oder auf zwei verschiedene Gestalten, etwa Herrscher und Priester, beziehen.
    reason: alternative_reading
  - marker: c
    text: 'Oder: „Ehre“ oder „Glanz“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵיכַל יְהוָה
  choice: Tempel Jahwes
  rationale: הֵיכָל kann Palast oder Heiligtum bezeichnen; im Zusammenhang mit Jahwes Heiligtum ist „Tempel“ die klare und natürliche Wiedergabe. Der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: יִשָּׂא הוֹד
  choice: wird Hoheit tragen
  rationale: Die Verbindung bezeichnet das Tragen königlicher Würde oder Pracht. „Hoheit tragen“ bewahrt sowohl das konkrete Verb als auch den königlichen Klang.
- source_word: וְיָשַׁב וּמָשַׁל עַל כִּסְאוֹ
  choice: auf seinem Thron sitzen und herrschen
  rationale: Die Formulierung erhält die Abfolge von Thronsitz und Herrschaft, klingt im modernen Deutschen aber flüssig.
- source_word: וְהָיָה כֹהֵן עַל כִּסְאוֹ
  choice: wird Priester auf seinem Thron sein
  rationale: Die fortlaufende Folge maskuliner Singularformen legt zunächst denselben Handelnden nahe. Die auffällige Verbindung von Priestertum und Thron wird nicht aufgelöst.
- source_word: וַעֲצַת שָׁלוֹם
  choice: ein Ratschluss des Friedens
  rationale: עֵצָה kann Rat, Ratschluss, Plan oder Vorhaben bedeuten. „Ratschluss des Friedens“ bewahrt die knappe Genitivverbindung und lässt sowohl Beratung als auch friedensstiftende Absicht anklingen.
- source_word: בֵּין שְׁנֵיהֶם
  choice: zwischen ihnen beiden
  rationale: Die knappe hebräische Wendung benennt die beiden Bezugsgrößen nicht ausdrücklich. Die deutsche Wiedergabe lässt diese Mehrdeutigkeit bestehen.
theological_decisions:
- issue: Identität des Priesters und Bezug von „zwischen ihnen beiden“
  choice: Im Haupttext bleibt derselbe Singular als Subjekt erhalten, während die Bezugsgrößen von „ihnen beiden“ unbestimmt bleiben.
  alternative: Man kann den Priester als zweite, vom thronenden Herrscher unterschiedene Gestalt verstehen; ebenso können „die beiden“ auf die königliche und die priesterliche Funktion bezogen werden.
  rationale: Der grammatische Fortgang spricht zunächst für ein einziges Subjekt, doch die Schlusswendung nennt ausdrücklich zwei. Die Übersetzung bewahrt diese Spannung, statt sie durch eine bestimmte messianische oder amtstheologische Deutung aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von וְהוּא wird durch kurze, klar gegliederte Sätze wiedergegeben. „Ratschluss“ ist leicht gehoben, aber allgemein verständlich und bewahrt die inhaltliche Offenheit des hebräischen עֵצָה.
