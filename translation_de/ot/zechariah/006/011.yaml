  text: וְ/לָקַחְתָּ֥ כֶֽסֶף וְ/זָהָ֖ב וְ/עָשִׂ֣יתָ עֲטָר֑וֹת וְ/שַׂמְתָּ֗ בְּ/רֹ֛אשׁ יְהוֹשֻׁ֥עַ בֶּן יְהוֹצָדָ֖ק הַ/כֹּהֵ֥ן הַ/גָּדֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/011.yaml
  text: Take silver and gold[a], make crowns, and set them on the head of Joshua son of Jehozadak, the high priest.
translation:
  language: de
  text: Nimm Silber und Gold, fertige Kronen[a] an und setze sie Josua, dem Sohn Jozadaks, dem Hohepriester, auf den Kopf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Kronen“ (Plural). Manche verstehen dies als eine einzige, aus mehreren Teilen zusammengesetzte Krone und übersetzen deshalb „Krone“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Nimm
  rationale: Das Qal Perfekt 2. Person Singular mit vorangestelltem וְ dient hier in einer prophetischen Anweisung als Aufforderung; der deutsche Imperativ gibt dies natürlich wieder.
- source_word: כֶסֶף וְזָהָב
  choice: Silber und Gold
  rationale: Die beiden Stoffbezeichnungen werden konkret wiedergegeben; כֶסֶף bezeichnet hier wegen der Herstellung der Kronen Silber, nicht Geld.
- source_word: וְעָשִׂיתָ עֲטָרוֹת
  choice: fertige Kronen an
  rationale: עֲטָרוֹת ist morphologisch Plural. „Anfertigen“ ist im Zusammenhang mit Metallarbeiten idiomatisch und bewahrt den handwerklichen Sinn von עשה.
- source_word: וְשַׂמְתָּ ... בְּרֹאשׁ
  choice: setze sie ... auf den Kopf
  rationale: Die deutsche Konstruktion mit „auf den Kopf setzen“ gibt die tatsächliche Platzierung klar und natürlich wieder; das Pronomen nimmt den Plural „Kronen“ auf.
- source_word: יְהוֹשֻׁעַ בֶּן יְהוֹצָדָק
  choice: Joschua, dem Sohn Jozadaks
  rationale: Die Namen werden in gebräuchlicher deutscher Bibelform wiedergegeben; die Apposition steht nach „setze“ im Dativ.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: dem Hohen Priester
  rationale: „Hoher Priester“ ist die etablierte und klare deutsche Amtsbezeichnung für den hebräischen Titel.
theological_decisions:
- issue: Plural עֲטָרוֹת bei der Platzierung auf dem Kopf einer einzelnen Person
  choice: Den Plural „Kronen“ im Haupttext beibehalten
  alternative: Singular „Krone“ als Bezeichnung einer aus mehreren Teilen zusammengesetzten Krone
  rationale: Der masoretische Text hat ausdrücklich den Plural. Da diese Form für die Deutung der prophetischen Zeichenhandlung bedeutsam sein kann, wird sie nicht stillschweigend vereinheitlicht; die mögliche Singularauffassung steht in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Fertige ... an“ verdeutlicht die Herstellung, während „setze ... auf den Kopf“ die Zeremonialhandlung ohne altertümliche Formulierung wiedergibt.
