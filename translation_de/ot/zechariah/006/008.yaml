base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/008.yaml
  text: Then he called out to me and spoke to me[a], saying, “See, those going out to the land of the north have set my Spirit at rest in the land of the north.”
translation:
  language: de
  text: 'Da rief er mir laut zu und sagte zu mir: „Sieh: Diejenigen, die ins Land des Nordens hinausziehen, haben meinem Geist im Land des Nordens Ruhe verschafft.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „haben meinen Geist im Land des Nordens zur Ruhe gebracht“. Die Wendung kann auch besagen, dass Gottes Zorn oder richterliches Missfallen dort gestillt worden ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּזְעֵק אֹתִי
  choice: Da rief er mir laut zu
  rationale: זעק bezeichnet einen lauten, nachdrücklichen Ruf. „Mir laut zurufen“ bewahrt den hörbaren und dringlichen Charakter, ohne eine bestimmte Gefühlslage festzulegen.
- source_word: וַיְדַבֵּר אֵלַי לֵאמֹר
  choice: und sagte zu mir
  rationale: Die hebräische Redeeinleitungsformel wird in natürlichem modernem Deutsch knapp wiedergegeben; ein zusätzliches „indem er sprach“ wäre unnötig schwerfällig.
- source_word: רְאֵה
  choice: Sieh
  rationale: Der Imperativ lenkt nachdrücklich die Aufmerksamkeit auf das Folgende. „Sieh“ ist würdig und gegenwärtig, ohne so altertümlich wie „Siehe“ zu wirken.
- source_word: הַיּוֹצְאִים
  choice: Diejenigen, die … hinausziehen
  rationale: Das Partizip bezeichnet die im Gang befindliche beziehungsweise charakteristische Bewegung. Die deutsche Präsensform erhält diesen Aspekt.
- source_word: אֶל אֶרֶץ צָפוֹן
  choice: ins Land des Nordens
  rationale: Die Wendung gibt die geografisch-richtungsbezogene Formulierung eng wieder. „Nordland“ wäre knapper, aber weniger transparent.
- source_word: הֵנִיחוּ
  choice: haben … Ruhe verschafft
  rationale: 'Der Hifil von נוח drückt ein Veranlassen von Ruhe aus: zur Ruhe bringen, ruhen lassen oder beruhigen. „Ruhe verschafft“ wahrt die kausative Bedeutung und lässt die genaue Art dieser Ruhe offen.'
- source_word: רוּחִי
  choice: meinem Geist
  rationale: רוּחַ kann Geist, Wind, Atem oder Gemütsregung bezeichnen. Im göttlichen Ich-Wort ist „mein Geist“ die naheliegende, zugleich bewusst nicht ausdeutende Wiedergabe.
- source_word: בְּאֶרֶץ צָפוֹן
  choice: im Land des Nordens
  rationale: Die Wiederholung der Ortsangabe wird wie im Hebräischen beibehalten und trägt zur nachdrücklichen Wirkung des Satzes bei.
theological_decisions:
- issue: Bedeutung von „meinem Geist Ruhe verschafft“
  choice: Die Hauptübersetzung spricht von Gottes Geist, dem Ruhe verschafft worden ist.
  alternative: Die Wendung kann Gottes innere Erregung, besonders seinen Zorn oder sein richterliches Missfallen, als zur Ruhe gekommen bezeichnen; möglich ist auch „meinen Geist zur Ruhe gebracht“.
  rationale: Der hebräische Ausdruck verbindet רוּחִי mit dem kausativen Verb הֵנִיחוּ und legt Ruhe oder Beruhigung nahe, benennt jedoch nicht ausdrücklich „Zorn“. Die Übersetzung bewahrt daher die Bildsprache und theologische Spannung, statt die mögliche Bedeutung als göttliche Zornstillung in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Redeeinleitung ist natürlich gestrafft; die auffällige Wiederholung von „Land des Nordens“ sowie die Mehrdeutigkeit von רוּחִי bleiben erhalten. Der Fußnotenmarker steht unmittelbar nach dem betreffenden Satz.
