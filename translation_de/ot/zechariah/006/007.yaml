  text: וְ/הָ/אֲמֻצִּ֣ים יָצְא֗וּ וַ/יְבַקְשׁוּ֙ לָ/לֶ֨כֶת֙ לְ/הִתְהַלֵּ֣ך בָּ/אָ֔רֶץ וַ/יֹּ֕אמֶר לְכ֖וּ הִתְהַלְּכ֣וּ בָ/אָ֑רֶץ וַ/תִּתְהַלַּ֖כְנָה בָּ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/007.yaml
  text: And the strong ones came out and sought to go[a], to walk throughout the earth. And he said, “Go[b], walk throughout the earth,” and they walked throughout the earth.
translation:
  language: de
  text: 'Und die Starken[a] zogen aus und suchten loszuziehen und die Erde[b] zu durchstreifen. Da sagte er: »Zieht los, durchstreift die Erde!« Und sie durchstreiften die Erde.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Scheckigen«; traditionell wird das Wort als Farbbezeichnung der Pferde oder Gespanne verstanden. Nach der masoretischen Vokalisierung bedeutet es eher »die Starken«.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »das Land«. Das hebräische Wort אֶרֶץ kann je nach Zusammenhang »Erde« oder »Land« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲמֻצִּים
  choice: die Starken
  rationale: Die masoretische Vokalisierung weist auf das Adjektiv von אמץ mit der Bedeutung »stark, kräftig« hin. Die substantivische Wiedergabe lässt offen, ob damit die Pferde oder die Gespanne gemeint sind.
- source_word: יָצְאוּ
  choice: zogen aus
  rationale: יצא bezeichnet das Hinaus- oder Ausziehen; »zogen aus« passt zur Bewegung der im Gesicht auftretenden Gespanne.
- source_word: וַיְבַקְשׁוּ לָלֶכֶת
  choice: verlangten danach, loszuziehen
  rationale: בקש kann hier ein starkes Verlangen oder Streben ausdrücken. Die Formulierung bewahrt diesen Zug und gibt לָלֶכֶת als beabsichtigte Bewegung wieder.
- source_word: לְהִתְהַלֵּךְ / הִתְהַלְּכוּ / וַתִּתְהַלַּכְנָה
  choice: durchstreifen / durchstreift / durchstreiften
  rationale: Der Hitpael von הלך bezeichnet hier ein wiederholtes oder sich über ein Gebiet erstreckendes Umherziehen. »Durchstreifen« ist im Deutschen natürlich und bewahrt die dreifache Wiederholung desselben hebräischen Verbs.
- source_word: בָּאָרֶץ
  choice: die Erde
  rationale: אֶרֶץ kann »Erde« oder »Land« bedeuten. Der weltweite Horizont des Gesichtes spricht hier eher für »Erde«; die andere Möglichkeit wird in einer Fußnote bewahrt.
- source_word: וַיֹּאמֶר
  choice: Da sagte er
  rationale: Das maskuline Verb hat ein unausgesprochenes Subjekt. »Er« gibt die grammatische Form wieder, ohne den Sprecher über den Kontext hinaus ausdrücklich zu identifizieren.
- source_word: לְכוּ
  choice: Zieht los
  rationale: Der pluralische Imperativ von הלך ist ein unmittelbarer Bewegungsbefehl. »Zieht los« passt idiomatisch zu den ausgesandten Pferden beziehungsweise Gespannen.
theological_decisions:
- issue: Reichweite von אֶרֶץ im Gesicht
  choice: Erde
  alternative: Land
  rationale: Die in verschiedene Richtungen ausgesandten himmlischen Akteure legen einen weltweiten Horizont nahe. Da אֶרֶץ jedoch auch »Land« heißen kann, wird diese lexikalische Offenheit in der Fußnote ausdrücklich erhalten.
- issue: Identität und Bedeutung von הָאֲמֻצִּים
  choice: die Starken
  alternative: die Scheckigen beziehungsweise die gefleckten Pferde
  rationale: Der Haupttext folgt der masoretischen Vokalisierung und ihrer naheliegenden Bedeutung »die Starken«. Wegen der Farbbezeichnungen für Pferde im unmittelbaren Zusammenhang und der entsprechenden Übersetzungstradition bleibt die farbliche Deutung als echte Alternative in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Durchstreifen« vermeidet das etwas verwaltungssprachliche »patrouillieren« und erhält zugleich die im Hebräischen dreimal wiederholte Vorstellung einer Bewegung durch das ganze Gebiet. Die substantivische Form »die Starken« verzichtet bewusst auf einen im Hebräischen nicht ausdrücklich genannten Bezugsbegriff.
