  text: וָ/אָשֻׁ֗ב וָ/אֶשָּׂ֤א עֵינַ/י֙ וָֽ/אֶרְאֶ֔ה וְ/הִנֵּ֨ה אַרְבַּ֤ע מַרְכָּבוֹת֙ יֹֽצְא֔וֹת מִ/בֵּ֖ין שְׁנֵ֣י הֶֽ/הָרִ֑ים וְ/הֶ/הָרִ֖ים הָרֵ֥י נְחֹֽשֶׁת׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/001.yaml
  text: Then I turned and lifted up my eyes and saw[a], and behold[b], four chariots were coming out from between two mountains—and the mountains were mountains of bronze.
translation:
  language: de
  text: 'Und ich wandte mich um,[a] erhob meine Augen und sah: Siehe, vier Streitwagen kamen zwischen den beiden Bergen hervor, und die Berge waren Berge aus Bronze.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder idiomatisch: „Und wieder erhob ich meine Augen und sah.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Kupfer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָשֻׁב
  choice: Dann wandte ich mich um
  rationale: שׁוב kann „umkehren/sich umwenden“ oder in dieser Visionsformel „wieder“ bedeuten. Die Hauptfassung gibt die körperliche Wendung natürlich wieder; die mögliche iterative Bedeutung wird in einer Fußnote bewahrt.
- source_word: וָאֶשָּׂא עֵינַי
  choice: erhob meine Augen
  rationale: Die geläufige hebräische Wendung für das bewusste Richten des Blicks wird in einem verständlichen, zugleich würdigen deutschen Ausdruck erhalten.
- source_word: וָאֶרְאֶה
  choice: und sah
  rationale: Die knappe Wiedergabe bewahrt die Abfolge der prophetischen Wahrnehmung.
- source_word: וְהִנֵּה
  choice: Siehe
  rationale: „Siehe“ erhält die aufmerksamkeitslenkende und vergegenwärtigende Funktion von הִנֵּה sowie den prophetischen Ton.
- source_word: אַרְבַּע מַרְכָּבוֹת
  choice: vier Streitwagen
  rationale: „Streitwagen“ bezeichnet im heutigen Deutsch eindeutig die antiken, von Zugtieren gezogenen Wagen und vermeidet die moderne Assoziation von „Wagen“ mit Kraftfahrzeugen.
- source_word: יֹצְאוֹת
  choice: kamen … hervor
  rationale: Das Partizip schildert den Vorgang des Hervorkommens, wie er sich dem Seher darbietet.
- source_word: מִבֵּין שְׁנֵי הֶהָרִים
  choice: zwischen den beiden Bergen hervor
  rationale: Der bestimmte Artikel des Hebräischen wird mit „den beiden Bergen“ ausdrücklich wiedergegeben.
- source_word: וְהֶהָרִים הָרֵי נְחֹשֶׁת
  choice: und die Berge waren Berge aus Bronze
  rationale: Die Wiederholung von „Berge“ folgt der betonten Formulierung des Hebräischen. נְחֹשֶׁת wird konventionell mit „Bronze“ wiedergegeben; „Kupfer“ bleibt lexikalisch möglich.
theological_decisions:
- issue: Metallbezeichnung נְחֹשֶׁת
  choice: Bronze
  alternative: Kupfer
  rationale: Die Entscheidung ist lexikalisch, nicht konfessionell. „Bronze“ entspricht der herkömmlichen Deutung monumentaler Metallbilder; da das hebräische Wort auch Kupfer bezeichnen kann, wird diese Möglichkeit in der Fußnote offengelegt.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem prophetischem Ton. Die hebräische Blickformel und das aufmerksamkeitslenkende „Siehe“ bleiben erhalten; die Satzführung ist dennoch für heutige Leser klar und natürlich.
