  text: וּ/רְחוֹקִ֣ים יָבֹ֗אוּ וּ/בָנוּ֙ בְּ/הֵיכַ֣ל יְהוָ֔ה וִ/ידַעְתֶּ֕ם כִּֽי יְהוָ֥ה צְבָא֖וֹת שְׁלָחַ֣/נִי אֲלֵי/כֶ֑ם וְ/הָיָה֙ אִם שָׁמ֣וֹעַ תִּשְׁמְע֔וּ/ן בְּ/ק֖וֹל יְהוָ֥ה אֱלֹהֵי/כֶֽם׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/015.yaml
  text: And those who are far off will come and build in the temple of Yahweh[a], and you will know that Yahweh of Armies has sent me to you[b]. And this will happen if you diligently obey the voice of Yahweh your God.
translation:
  language: de
  text: Menschen aus der Ferne[a] werden kommen und am Tempel Jahwes[b] bauen. Und ihr werdet erkennen, dass Jahwe der Heerscharen mich zu euch gesandt hat. Dies wird geschehen, wenn ihr wirklich auf die Stimme Jahwes, eures Gottes, hört.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: die Fernen. Gemeint sein können Menschen aus weit entfernten Gebieten, etwa Exilierte; der Ausdruck nennt jedoch keine bestimmte Gruppe.'
    reason: alternative_reading
  - marker: b
    text: Traditionell wird der Gottesname Jahwe mit „der HERR“ wiedergegeben.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: wenn ihr der Stimme Jahwes, eures Gottes, gewissenhaft gehorcht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְחוֹקִים
  choice: Menschen aus der Ferne
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet ferne Personen. Die Wiedergabe bleibt natürlich und legt nicht fest, ob Exilierte, andere Völker oder eine weiter gefasste Gruppe gemeint sind.
- source_word: יָבֹאוּ וּבָנוּ
  choice: werden kommen und … bauen
  rationale: Die aufeinanderfolgenden Verbformen bezeichnen im prophetischen Zusammenhang zukünftige, koordinierte Handlungen.
- source_word: בְּהֵיכַל יְהוָה
  choice: am Tempel Jahwes
  rationale: הֵיכָל bezeichnet hier den Tempel. „Am Tempel bauen“ gibt die Beteiligung am Tempelbau im Deutschen idiomatisch wieder, ohne fälschlich nur Arbeiten im Inneren des Gebäudes anzudeuten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Die traditionelle, im Deutschen verständliche Wendung bewahrt den Sinn des göttlichen Titels, ohne die Heere ausschließlich als irdisch oder himmlisch festzulegen.
- source_word: שְׁלָחַנִי אֲלֵיכֶם
  choice: mich zu euch gesandt hat
  rationale: Das Perfekt bezeichnet eine abgeschlossene Sendung mit gegenwärtiger Bedeutung.
- source_word: וְהָיָה
  choice: Dies wird geschehen
  rationale: Die deutsche Formulierung gibt die einleitende Ergebnisformel natürlich wieder und bezieht sie auf die zuvor ausgesprochene Verheißung.
- source_word: אִם שָׁמוֹעַ תִּשְׁמְעוּן
  choice: wenn ihr wirklich … hört
  rationale: Infinitivus absolutus und finite Verbform verstärken gemeinsam שׁמע. „Wirklich“ bildet die Bekräftigung ab; „auf die Stimme hören“ schließt im Deutschen folgsames Hören ein, ohne die Bildsprache aufzulösen.
- source_word: בְּקוֹל יְהוָה אֱלֹהֵיכֶם
  choice: auf die Stimme Jahwes, eures Gottes, hört
  rationale: Die Wendung bewahrt sowohl das konkrete Bild der Stimme als auch den im Bundeskontext naheliegenden Sinn des Gehorchens.
theological_decisions:
- issue: Identität der Menschen aus der Ferne
  choice: Die Gruppe bleibt unbestimmt.
  alternative: Exilierte Judäer oder Menschen aus den Völkern ausdrücklich benennen.
  rationale: Der hebräische Ausdruck bezeichnet keine bestimmte Volks- oder Bundeszugehörigkeit. Die offene Formulierung bewahrt diese Mehrdeutigkeit.
- issue: Reichweite der Bedingung am Versende
  choice: „Dies wird geschehen, wenn …“ lässt die Bedingung auf die vorausgehende Verheißung bezogen stehen.
  alternative: Die Bedingung nur auf das Erkennen beziehen oder als unabhängige Mahnung verstehen.
  rationale: Die Syntax verbindet die Bedingung eng mit dem Vorhergehenden, bestimmt jedoch nicht ausdrücklich alle Einzelheiten ihres Bezugs. Die Übersetzung löst diese theologische Spannung nicht weiter auf.
- issue: Bedeutung von „hören“
  choice: Das Stimmenmotiv bleibt erhalten, wobei folgsames Hören mitgemeint ist.
  alternative: Direkt mit „gehorchen“ übersetzen.
  rationale: שׁמע trägt hier den Sinn gehorsamen Hörens; die wörtlichere deutsche Wendung „auf die Stimme hören“ vermittelt beide Aspekte.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Menschen aus der Ferne“ ist allgemein verständlich und bewahrt die unbestimmte Reichweite. „Jahwe der Heerscharen“ erhält den traditionellen göttlichen Titel; „am Tempel bauen“ ist idiomatischer als „im Tempel bauen“ und passt zur Bautätigkeit am Heiligtum.
