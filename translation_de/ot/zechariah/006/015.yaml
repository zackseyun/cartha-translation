review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt die futurische Abfolge, die unbestimmte Gruppe der „Fernen“, den Tempelbezug, die Sendungsformel und die nachfolgende Bedingung insgesamt treffend wieder. „Am Tempel Jahwes bauen“ ist im Deutschen eine sachgerechte Wiedergabe von בְּהֵיכַל יְהוָה in diesem Baukontext. Das vorangestellte „Dann“ bei „werdet ihr erkennen“ fügt jedoch eine ausdrücklich konsekutive bzw. zeitliche Nuance hinzu, die das bloße וְ der hebräischen Koordination nicht verlangt.
  naturalness: Modernes, würdiges und gut verständliches Standarddeutsch. Die Formulierung „wirklich auf die Stimme … hören“ ist verständlich, aber „wirklich“ kann eher innere Aufrichtigkeit als die durch Infinitivus absolutus ausgedrückte Verstärkung nahelegen. „Gewissenhaft gehorchen“ ist als Fußnotenalternative passend; der Haupttext kann die Bildsprache mit „auf die Stimme … hören“ bewahren.
  terminology: „Jahwe“ entspricht der gewählten Wiedergabe des Tetragramms; „Jahwe der Heerscharen“ wahrt die Offenheit von צְבָאוֹת. „Menschen aus der Ferne“ legt weder Exilierte noch Angehörige anderer Völker fest. Die Fußnoten sind sinnvoll verankert und erläutern die relevanten Alternativen, ohne den Text dogmatisch einzuengen.
