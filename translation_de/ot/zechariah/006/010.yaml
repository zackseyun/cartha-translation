source:
  edition: WLC
  text: לָק֨וֹחַ֙ מֵ/אֵ֣ת הַ/גּוֹלָ֔ה מֵ/חֶלְדַּ֕י וּ/מֵ/אֵ֥ת טוֹבִיָּ֖ה וּ/מֵ/אֵ֣ת יְדַֽעְיָ֑ה וּ/בָאתָ֤ אַתָּה֙ בַּ/יּ֣וֹם הַ/ה֔וּא וּ/בָ֗אתָ בֵּ֚ית יֹאשִׁיָּ֣ה בֶן צְפַנְיָ֔ה אֲשֶׁר בָּ֖אוּ מִ/בָּבֶֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/010.yaml
  text: Take from the exiles—from Heldai[a], from Tobijah, and from Jedaiah—and you yourself shall go on that day and enter the house of Josiah the son of Zephaniah[d][c][b], who have come from Babylon.
translation:
  language: de
  text: Nimm von den Verbannten[a] – von Heldai, von Tobija[d] und von Jedaja, die aus Babylon gekommen sind[c] – und geh du selbst an jenem Tag hin und betritt das Haus Joschijas, des Sohnes Zefanjas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „von der Gemeinschaft der Weggeführten“. Das hebräische Wort bezeichnet hier die Gruppe der Exilierten beziehungsweise Heimgekehrten, nicht bloß das Exil als Zustand.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich verwendet das Hebräische zweimal dasselbe Verb, das je nach Perspektive „kommen“, „gehen“ oder beim Eintritt in ein Haus „hineingehen“ bedeuten kann.
    reason: lexical_alternative
  - marker: c
    text: „Gekommen sind“ steht im Hebräischen im Plural und bezieht sich am natürlichsten auf Heldai, Tobija und Jedaja. Wegen der Stellung des Satzteils am Versende ist auch an eine im Haus Joschijas eingetroffene Gruppe gedacht worden.
    reason: alternative_reading
  - marker: d
    text: Der Name wird auch „Tobias“ wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָקוֹחַ
  choice: Nimm
  rationale: Der absolute Infinitiv Qal dient hier als nachdrückliche Anweisung; der deutsche Imperativ gibt dies knapp und natürlich wieder.
- source_word: מֵאֵת הַגּוֹלָה
  choice: von den Verbannten
  rationale: הַגּוֹלָה bezeichnet hier eher die Gemeinschaft der Exilierten beziehungsweise Heimgekehrten als den abstrakten Zustand des Exils.
- source_word: חֶלְדַּי / טוֹבִיָּה / יְדַעְיָה
  choice: Heldai / Tobija / Jedaja
  rationale: Die Personennamen werden in geläufiger deutscher Umschrift wiedergegeben; bei Tobija bleibt das theophore Namenselement erkennbar.
- source_word: וּבָאתָ אַתָּה
  choice: und geh du selbst an jenem Tag hin
  rationale: בוא kann je nach räumlicher Perspektive „kommen“ oder „gehen“ bedeuten. „Geh … hin“ ist im Deutschen für Sacharjas Bewegung zu einem anderen Ort natürlich; das ausdrücklich gesetzte אַתָּה wird mit „du selbst“ bewahrt.
- source_word: וּבָאתָ בֵּית
  choice: und betritt das Haus
  rationale: Die zweite Form von בוא bezeichnet die Bewegung in beziehungsweise zu Joschijas Haus. „Betritt“ vermeidet eine schwerfällige Wiederholung und gibt den Zielpunkt der Bewegung idiomatisch wieder.
- source_word: יֹאשִׁיָּה בֶן צְפַנְיָה
  choice: Joschija, der Sohn Zefanjas
  rationale: Geläufige deutsche Namensformen und eine natürliche Wiedergabe des hebräischen Patronyms.
- source_word: אֲשֶׁר בָּאוּ מִבָּבֶל
  choice: die aus Babylon gekommen sind
  rationale: Das Verb steht im Plural und bezieht sich am natürlichsten auf Heldai, Tobija und Jedaja. Die Umstellung direkt hinter die drei Namen macht diesen Bezug im Deutschen verständlich.
theological_decisions:
- issue: Bezugswort des pluralischen Relativsatzes אֲשֶׁר בָּאוּ מִבָּבֶל
  choice: Bezug auf Heldai, Tobija und Jedaja
  alternative: Bezug auf eine im Haus Joschijas versammelte Gruppe
  rationale: Das pluralische Verb kann sich nicht ohne Weiteres allein auf Joschija beziehen. Die drei zuvor genannten Männer sind der nächstliegende sachliche Bezug; die durch die hebräische Wortstellung verbleibende Möglichkeit eines weiteren Gruppenbezugs wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Gedankenstriche gliedern die Aufzählung, ohne ein im Hebräischen nicht genanntes Objekt der Aufforderung „Nimm“ zu ergänzen. Die ausdrückliche Hervorhebung „du selbst“ bleibt erhalten; die doppelte Bewegungsangabe wird idiomatisch als „geh … hin und betritt“ formuliert.
