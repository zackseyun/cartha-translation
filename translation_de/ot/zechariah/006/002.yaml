  yaml_path: translation/ot/zechariah/006/002.yaml
  text: In the first chariot were red horses, and in the second chariot black horses.
translation:
  language: de
  text: Am ersten Wagen waren rote Pferde und am zweiten Wagen schwarze Pferde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּמֶּרְכָּבָה
  choice: am Wagen
  rationale: מֶרְכָּבָה bezeichnet einen Wagen, hier einen von Pferden gezogenen Streit- oder Fahrwagen. Das präfigierte ב kann räumliche Zuordnung oder Verbindung ausdrücken; da Pferde nicht im Wagen stehen, gibt „am Wagen“ die Beziehung im Deutschen natürlich und sachgerecht wieder.
- source_word: הָרִאשֹׁנָה
  choice: ersten
  rationale: Das Ordinaladjektiv kennzeichnet den ersten Wagen in der Abfolge der Vision.
- source_word: סוּסִים
  choice: Pferde
  rationale: Die übliche und kontextuell uneingeschränkte Bedeutung des hebräischen Plurals.
- source_word: אֲדֻמִּים
  choice: rote
  rationale: Das Farbadjektiv bezeichnet unmittelbar die Farbe Rot und wahrt die Bildsprache der Vision.
- source_word: וּבַמֶּרְכָּבָה
  choice: und am Wagen
  rationale: Die wiederholte Verbindung aus Konjunktion und Präposition wird parallel zum ersten Satzglied wiedergegeben; im Deutschen kann „Wagen“ im zweiten Glied aus stilistischen Gründen nur einmal genannt werden.
- source_word: הַשֵּׁנִית
  choice: zweiten
  rationale: Das Ordinaladjektiv bezeichnet den folgenden, zweiten Wagen.
- source_word: שְׁחֹרִים
  choice: schwarze
  rationale: Das Farbadjektiv bedeutet gewöhnlich „schwarz“ und erhält den visuellen Gegensatz zu den roten Pferden.
theological_decisions: []
translation_notes:
