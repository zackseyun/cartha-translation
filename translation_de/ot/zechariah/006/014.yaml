  text: וְ/הָ/עֲטָרֹ֗ת תִּֽהְיֶה֙ לְ/חֵ֨לֶם֙ וּ/לְ/טוֹבִיָּ֣ה וְ/לִ/ידַֽעְיָ֔ה וּ/לְ/חֵ֖ן בֶּן צְפַנְיָ֑ה לְ/זִכָּר֖וֹן בְּ/הֵיכַ֥ל יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/014.yaml
  text: And the crowns shall be for Helem[a], Tobijah, Jedaiah, and Hen son of Zephaniah, as a memorial in the temple of Yahweh.
translation:
  language: de
  text: Und die Kronen sollen für Helem[a], Tobija, Jedaja und Hen, den Sohn Zefanjas, als Erinnerungszeichen im Tempel Jahwes sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In Sacharja 6,10 steht für diesen Namen Heldai; möglicherweise handelt es sich um eine andere Form desselben Namens.
    reason: alternative_reading
lexical_decisions:
- source_word: הָעֲטָרֹת
  choice: die Kronen
  rationale: Das hebräische Substantiv steht im Plural. Daher wird die masoretische Form nicht zu einem Singular harmonisiert.
- source_word: תִּהְיֶה
  choice: sollen … bleiben
  rationale: Das Qal-Imperfekt bezeichnet hier einen künftigen beziehungsweise fortdauernden Zustand. „Sollen … bleiben“ gibt im Deutschen den Anweisungscharakter und die dauerhafte Aufbewahrung als Erinnerungszeichen natürlich wieder.
- source_word: לְחֵלֶם
  choice: für Helem
  rationale: Der masoretische Text dieses Verses bietet den Personennamen Helem. Die abweichende Namensform Heldai in Sacharja 6,10 wird nicht in den Haupttext eingetragen, sondern in einer Fußnote vermerkt.
- source_word: וּלְטוֹבִיָּה
  choice: Tobija
  rationale: Der Personenname wird in einer im Deutschen üblichen, quellennahen Form wiedergegeben.
- source_word: וְלִידַעְיָה
  choice: Jedaja
  rationale: Der Personenname wird nach gängiger deutscher Transliterationsform wiedergegeben.
- source_word: וּלְחֵן
  choice: Hen
  rationale: Im Zusammenhang ist חֵן wegen der folgenden Abstammungsangabe als Personenname zu verstehen. Die Wiedergabe als Name vermeidet eine unbegründete Umdeutung zu „Gnade“ oder „Gunst“.
- source_word: בֶּן צְפַנְיָה
  choice: den Sohn Zefanjas
  rationale: Die Apposition bezeichnet Hen als Sohn Zefanjas; die deutsche Kasusform fügt sich natürlich in die Aufzählung ein.
- source_word: לְזִכָּרוֹן
  choice: als Erinnerungszeichen
  rationale: Die Wendung bezeichnet die Gedenkfunktion der Kronen. „Erinnerungszeichen“ bewahrt den konkreten und kultischen Sinn besser als das abstraktere „zur Erinnerung“.
- source_word: בְּהֵיכַל
  choice: im Tempel
  rationale: In Verbindung mit dem Gottesnamen bezeichnet הֵיכָל hier den Tempel beziehungsweise das Heiligtum, nicht einen königlichen Palast.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in der etablierten deutschen Form „Jahwe“ wiedergegeben und nicht durch einen Titel wie „der HERR“ ersetzt.
theological_decisions:
- issue: Abweichende Namensformen gegenüber Sacharja 6,10
  choice: Die Namen des masoretischen Textes in diesem Vers werden als „Helem“ und „Hen“ beibehalten.
  alternative: „Helem“ zu „Heldai“ harmonisieren oder „Hen“ als Gattungswort beziehungsweise andere Textform deuten.
  rationale: Die Übersetzung folgt zunächst dem überlieferten hebräischen Wortlaut dieses Verses. Mögliche Namensvarianten oder textgeschichtliche Fragen werden nicht stillschweigend bereinigt; die relevante Variante zu Helem wird in einer Fußnote kenntlich gemacht.
- issue: Plural von „Kronen“ bei singularischem hebräischem Verb
  choice: Das morphologisch eindeutige Pluralsubstantiv wird als „die Kronen“ wiedergegeben.
  alternative: Wegen des Zusammenhangs „die Krone“ lesen.
  rationale: Der masoretische Text hat ausdrücklich die Pluralform. Die auffällige Numeruskonstruktion rechtfertigt keine stillschweigende Änderung des Substantivs.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bleibt nah am Hebräischen, klingt aber durch „sollen … bleiben“ natürlich. Personennamen folgen gebräuchlichen deutschen Formen; der Gottesname wird als „Jahwe“ transliteriert.
