source:
  edition: WLC
  text: וּ/בַ/מֶּרְכָּבָ֥ה הַ/שְּׁלִשִׁ֖ית סוּסִ֣ים לְבָנִ֑ים וּ/בַ/מֶּרְכָּבָה֙ הָ/רְבִעִ֔ית סוּסִ֥ים בְּרֻדִּ֖ים אֲמֻצִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/003.yaml
  text: and in the third chariot[a], white horses; and in the fourth chariot, dappled horses, strong ones.
translation:
  language: de
  text: und am dritten Wagen weiße Pferde; und am vierten Wagen gescheckte, kräftige Pferde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „gescheckte Pferde und kräftige“, wenn mit den „Kräftigen“ eine eigene Gruppe gemeint ist und nicht eine weitere Eigenschaft der Pferde des vierten Wagens.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבַמֶּרְכָּבָה
  choice: und am … Wagen
  rationale: Die Präposition ב bezeichnet hier die Zuordnung der Pferde zum jeweiligen Wagen. „Am … Wagen“ ist im Deutschen natürlich und vermeidet die missverständliche Vorstellung, die Pferde befänden sich im Wagen.
- source_word: הַשְּׁלִשִׁית
  choice: dritten
  rationale: Das feminine Ordinalzahlwort bezieht sich eindeutig auf מֶרְכָּבָה („Wagen“).
- source_word: סוּסִים
  choice: Pferde
  rationale: Die gewöhnliche deutsche Entsprechung des hebräischen Plurals; in beiden Satzteilen gleich wiedergegeben.
- source_word: לְבָנִים
  choice: weiße
  rationale: Das Adjektiv bezeichnet eindeutig die Farbe Weiß.
- source_word: הָרְבִעִית
  choice: vierten
  rationale: Das feminine Ordinalzahlwort bezieht sich eindeutig auf den Wagen.
- source_word: בְּרֻדִּים
  choice: gescheckte
  rationale: Das Wort beschreibt eine verschiedenfarbig gefleckte oder gesprenkelte Zeichnung. „Gescheckt“ ist für Pferde idiomatisch und anschaulich.
- source_word: אֲמֻצִּים
  choice: kräftige
  rationale: Das von אמץ abgeleitete Adjektiv bezeichnet Stärke oder Kraft. „Kräftig“ ist hier eine natürliche Beschreibung von Pferden und wahrt die Abgrenzung zur Farbangabe.
theological_decisions:
- issue: Bezeichnet אֲמֻצִּים eine weitere Eigenschaft der gescheckten Pferde oder eine eigene Gruppe?
  choice: Im Haupttext beschreibt es die Pferde des vierten Wagens zusätzlich als „kräftig“.
  alternative: „gescheckte Pferde und kräftige“, wobei die Kräftigen als eigene Gruppe verstanden werden.
  rationale: Nach „Pferde“ folgen im Hebräischen בְּרֻדִּים und אֲמֻצִּים ohne Wiederholung des Substantivs; daher können beide Wörter als Beschreibungen derselben Pferde verstanden werden. Da die Syntax jedoch auch eine Absetzung der „Kräftigen“ zulässt, wird diese Möglichkeit in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe, aufzählende Satzgestalt des hebräischen Visionsberichts bleibt erhalten; „am Wagen“ drückt die Zuordnung der Pferde idiomatisch aus.
