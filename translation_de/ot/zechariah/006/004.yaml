source:
  edition: WLC
  text: וָ/אַ֨עַן֙ וָֽ/אֹמַ֔ר אֶל הַ/מַּלְאָ֖ךְ הַ/דֹּבֵ֣ר בִּ֑/י מָה אֵ֖לֶּה אֲדֹנִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/004.yaml
  text: Then I answered and said to the angel who was speaking with me[a], “What are these, my lord?”
translation:
  language: de
  text: 'Da antwortete ich und sagte zu dem Engel, der mit mir redete[a]: »Was sind diese, mein Herr?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der mit mir sprach«. Das hebräische Partizip kann den Engel als denjenigen kennzeichnen, der mit dem Propheten spricht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַעַן
  choice: Da antwortete ich
  rationale: Das Qal-Wayyiqtol von ענה führt die Reaktion des Propheten in der Erzählfolge ein. »Da« gibt diesen Fortgang im natürlichen Deutschen wieder.
- source_word: וָאֹמַר
  choice: und sagte
  rationale: Die hebräische Verbindung »antwortete und sagte« wird bewahrt, statt sie paraphrasierend auf ein einziges Verb zu verkürzen.
- source_word: אֶל הַמַּלְאָךְ
  choice: zu dem Engel
  rationale: אֶל bezeichnet den Adressaten; מַלְאָךְ wird im visionären Zusammenhang Sacharjas angemessen mit »Engel« wiedergegeben.
- source_word: הַדֹּבֵר בִּי
  choice: der mit mir redete
  rationale: Das Partizip beschreibt den Engel als denjenigen, der mit dem Propheten redet. Die Präteritalform fügt sich natürlich in die deutsche Erzählung ein, ohne die charakterisierende Bedeutung auszuschließen.
- source_word: מָה אֵלֶּה
  choice: Was sind diese
  rationale: Die Frage bezieht sich unmittelbar auf die in der Vision gesehenen Erscheinungen. »Diese« bewahrt die knappe, im Deutschen dennoch verständliche Form des Hebräischen.
- source_word: אֲדֹנִי
  choice: mein Herr
  rationale: Die Form ist hier eine respektvolle Anrede an den deutenden Engel. »Mein Herr« erhält den ehrenden Gehalt, ohne daraus einen Gottesnamen zu machen.
theological_decisions:
- issue: Bezeichnet אֲדֹנִי Gott oder ist es eine respektvolle Anrede an den Engel?
  choice: 'Respektvolle Anrede an den Engel: »mein Herr«'
  alternative: »Herr« als Gottesbezeichnung
  rationale: Der ausdrücklich genannte Gesprächspartner ist der Engel, der mit dem Propheten redete. Die Kleinschreibung in »mein Herr« vermeidet eine unbegründete Gleichsetzung mit einer Gottesbezeichnung und bewahrt zugleich die ehrerbietige Anrede.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Doppelwendung »antwortete … und sagte« sowie die knappe Frage »Was sind diese?« bleiben erhalten; die direkte Rede wird mit deutschen Anführungszeichen gesetzt.
