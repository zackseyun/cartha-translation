lexical_decisions:
- source_word: וַיְהִי
  choice: Und … erging
  rationale: Die Wayyiqtol-Form führt die nächste Begebenheit im Erzählfluss ein. Zusammen mit דְבַר יְהוָה entspricht die im Deutschen geläufige prophetische Formel „das Wort … erging“ dem Sinn natürlicher als ein wörtliches „und es geschah“.
- source_word: דְבַר
  choice: das Wort
  rationale: In der festen prophetischen Wendung דְבַר יְהוָה bewahrt „das Wort“ sowohl die Form des Hebräischen als auch die biblischen Bezüge; „Botschaft“ wäre dynamischer, aber weniger formnah.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, der im modernen Standarddeutsch geläufigen Form der wissenschaftlichen Umschrift des Tetragramms, statt ihn durch einen Titel zu ersetzen.
- source_word: אֵלַי
  choice: an mich
  rationale: In Verbindung mit dem deutschen Verb „erging“ ist „an mich“ die natürliche Entsprechung für die auf den Propheten gerichtete Rede.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv leitet den nachfolgenden Wortlaut ein. Im natürlichen Deutschen erfüllt der Doppelpunkt vor der direkten Rede dieselbe Funktion besser als das schwerfällige „indem er sprach“ oder „mit den Worten“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen Gottes. „Jahwe“ wahrt diesen Namen, ohne ihn durch den traditionellen Titel „der HERR“ zu ersetzen; „Jehova“ beruht auf einer späteren Mischlesung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die etablierte prophetische Formel „das Wort Jahwes erging an mich“ wahrt den feierlichen Ton; der Doppelpunkt leitet knapp und idiomatisch den in Vers 10 folgenden Redeinhalt ein.
