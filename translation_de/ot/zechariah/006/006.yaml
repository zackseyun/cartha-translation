source:
  edition: WLC
  text: אֲשֶׁר בָּ֞/הּ הַ/סּוּסִ֣ים הַ/שְּׁחֹרִ֗ים יֹֽצְאִים֙ אֶל אֶ֣רֶץ צָפ֔וֹן וְ/הַ/לְּבָנִ֔ים יָצְא֖וּ אֶל אַֽחֲרֵי/הֶ֑ם וְ/הַ֨/בְּרֻדִּ֔ים יָצְא֖וּ אֶל אֶ֥רֶץ הַ/תֵּימָֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/006.yaml
  text: The black horses in it are going out to the land of the north[a], and the white ones have gone out after them, and the dappled ones have gone out to the land of the south.
translation:
  language: de
  text: Die schwarzen Pferde darin ziehen in das Land des Nordens hinaus; die weißen sind ihnen nachgezogen, und die gescheckten sind in das Land des Südens hinausgezogen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in das Land Teman“, wenn תֵּימָן hier als Ortsname und nicht als Bezeichnung für den Süden verstanden wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר בָּהּ
  choice: darin
  rationale: Das feminine Suffix verweist auf den zuvor genannten Wagen. „Darin“ bewahrt den Ortsbezug knapp und in natürlichem Deutsch.
- source_word: הַסּוּסִים הַשְּׁחֹרִים
  choice: die schwarzen Pferde
  rationale: Direkte und allgemein verständliche Wiedergabe von Substantiv und Farbadjektiv.
- source_word: יֹצְאִים
  choice: ziehen … hinaus
  rationale: Das Partizip stellt den Vorgang anschaulich als im Gang befindlich dar; das Präsens erhält diesen Aspekt.
- source_word: אֶל אֶרֶץ צָפוֹן
  choice: in das Land des Nordens
  rationale: Bewahrt die hebräische Ausdrucksweise und die Parallele zum „Land des Südens“.
- source_word: וְהַלְּבָנִים
  choice: die weißen
  rationale: Wie im Hebräischen bleibt „Pferde“ unausgesprochen, ist aus dem Zusammenhang aber eindeutig.
- source_word: יָצְאוּ אֶל אַחֲרֵיהֶם
  choice: sind hinter ihnen hinausgezogen
  rationale: Das Perfekt gibt die abgeschlossene Handlung des Qatal wieder; „hinter ihnen“ lässt sowohl räumliche Folge als auch Reihenfolge zu.
- source_word: וְהַבְּרֻדִּים
  choice: die gescheckten
  rationale: „Gescheckt“ ist eine geläufige deutsche Bezeichnung für die verschiedenfarbige oder fleckige Zeichnung von Pferden.
- source_word: אֶל אֶרֶץ הַתֵּימָן
  choice: in das Land des Südens
  rationale: Die Richtungsangabe bildet eine deutliche Parallele zum „Land des Nordens“; die mögliche Deutung als Ortsname wird in der Fußnote erhalten.
theological_decisions:
- issue: Bedeutung von הַתֵּימָן im Zusammenhang der Vision
  choice: Süden
  alternative: Teman
  rationale: Die Gegenüberstellung mit dem „Land des Nordens“ spricht hier für eine Himmelsrichtung beziehungsweise Region. Da תֵּימָן jedoch auch als Ortsname Teman verstanden werden kann, bleibt diese echte Mehrdeutigkeit in einer Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die unterschiedlichen Verbformen werden durch Präsens („ziehen … hinaus“) und Perfekt („sind … hinausgezogen“) abgebildet; die elliptischen Farbadjektive bleiben wie im Hebräischen ohne erneute Nennung von „Pferde“.
