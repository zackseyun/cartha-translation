base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/006.yaml
  text: And I said[a], “What is it?” And he said, “This is the basket that is going out.” And he said[b], “This is their appearance in all the land.”
translation:
  language: de
  text: 'Und ich fragte: „Was ist das?“ Er antwortete: „Das ist der Efa-Korb[a], der herauskommt.“ Dann sagte er: „Das ist ihr Aussehen im ganzen Land.[b]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Efa war ein altes Trockenmaß. Das hebräische Wort kann auch das zugehörige Messgefäß bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Das ist ihr Auge im ganzen Land.“ Viele verstehen „Auge“ hier im Sinn von „Aussehen“ oder „Erscheinung“. Eine abweichende Lesung oder Deutung lautet: „Das ist ihre Schuld im ganzen Land.“'
    reason: alternative_reading
lexical_decisions:
- source_word: אֵיפָה
  choice: Efa-Korb
  rationale: אֵיפָה bezeichnet zunächst ein Trockenmaß und metonymisch auch das zugehörige Messgefäß. „Efa-Korb“ bewahrt den antiken Maßbegriff und macht zugleich den in der Vision sichtbaren Gegenstand verständlich.
- source_word: הַיּוֹצֵאת
  choice: der hinauszieht
  rationale: Das attributive Partizip von יצא stellt den Efa-Korb als in Bewegung befindlich dar. „Der hinauszieht“ gibt dies knapp und anschaulich wieder.
- source_word: עֵינָם
  choice: ihr Aussehen
  rationale: Der masoretische Text lautet wörtlich „ihr Auge“. עַיִן kann auf die sichtbare Erscheinung bezogen werden; „ihr Aussehen“ vermittelt diesen möglichen Sinn, ohne die alternative Lesart „ihre Schuld“ in den Haupttext aufzunehmen.
- source_word: בְּכָל הָאָרֶץ
  choice: im ganzen Land
  rationale: הָאָרֶץ kann „Land“ oder „Erde“ bedeuten. „Land“ wahrt den im Zusammenhang naheliegenden begrenzten Bezug, während die weitere Möglichkeit in der Formulierung nicht dogmatisch ausgeschlossen wird.
- source_word: מַה הִיא
  choice: Was ist das?
  rationale: Das feminine Pronomen stimmt grammatisch mit אֵיפָה überein. Im Deutschen ist bei einem noch nicht bestimmten Gegenstand die idiomatische Frage „Was ist das?“ angemessen.
- source_word: וָאֹמַר
  choice: Und ich fragte
  rationale: Das hebräische „ich sagte“ leitet hier unmittelbar eine Frage ein. „Ich fragte“ gibt die kommunikative Funktion in natürlichem Deutsch wieder.
theological_decisions:
- issue: Deutung von עֵינָם im Schlusssatz
  choice: Im Haupttext „ihr Aussehen“
  alternative: Wörtlich „ihr Auge“; nach anderer Lesart oder Deutung „ihre Schuld“ beziehungsweise „ihre Sünde“
  rationale: Der masoretische Text bietet „ihr Auge“, eine im Kontext schwierige Wendung. „Ihr Aussehen“ lässt sich als Bedeutungsübertragung des überlieferten Wortes verstehen und vermeidet eine Textänderung. Die theologisch gewichtige Alternative „ihre Schuld“ wird deshalb nur in der Fußnote genannt.
- issue: Räumlicher Umfang von הָאָרֶץ
  choice: „Land“
  alternative: „Erde“
  rationale: Beide Bedeutungen sind lexikalisch möglich. Der Haupttext entscheidet sich zurückhaltend für den wahrscheinlich regionalen Bezug, ohne eine weltweite Deutung als zwingend festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der technische Begriff „Efa“ wird mit „Korb“ verständlich gemacht; die schwierige Schlusswendung bleibt durch eine eng am masoretischen Text orientierte Fußnote transparent.
