translation:
  language: de
  text: 'Und sieh: Eine Bleischeibe[a] wurde emporgehoben, und das war eine Frau, die im Inneren des Efa[b] saß.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „ein rundes Bleigewicht“, „eine Scheibe aus Blei“ oder, wörtlicher, „ein Talent Blei“. Der hebräische Ausdruck kann eine schwere, rundliche Bleimasse bezeichnen; hier dient sie offenbar als Abdeckung des Efa.'
    reason: lexical_alternative
  - marker: b
    text: Ein Efa war ein Hohlmaß für trockene Waren und bezeichnete davon abgeleitet auch den dazu verwendeten Behälter; daher übersetzen manche mit „Korb“.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Und sieh
  rationale: Bewahrt die lebhafte, hinweisende Kraft des hebräischen Visionssignals in natürlichem modernem Deutsch.
- source_word: כִּכַּר עֹפֶרֶת
  choice: eine Bleischeibe
  rationale: כִּכָּר bezeichnet hier eine schwere, rundliche Bleimasse, die im Zusammenhang offenbar als Abdeckung des Efa dient. „Bleischeibe“ gibt die sichtbare Form wieder, ohne die Funktion als Deckel in den Text hineinzulesen.
- source_word: נִשֵּׂאת
  choice: wurde emporgehoben
  rationale: Die passive Form beschreibt, wie das Bleistück angehoben wird; „emporgehoben“ macht die Richtung der Bewegung anschaulich.
- source_word: וְזֹאת
  choice: und da war
  rationale: Gibt die deiktische Vorstellung eines neu sichtbar werdenden Gegenstands beziehungsweise Wesens idiomatisch wieder, ohne eine zusätzliche Identifikation zu erzwingen.
- source_word: אִשָּׁה אַחַת
  choice: eine einzelne Frau
  rationale: „Einzelne“ bildet אַחַת ausdrücklich ab und bewahrt damit die auffällige Numerusangabe des Hebräischen.
- source_word: יוֹשֶׁבֶת
  choice: saß
  rationale: Bezeichnet direkt und natürlich die Haltung der Frau innerhalb des Behälters.
- source_word: בְּתוֹךְ הָאֵיפָה
  choice: im Inneren des Efa
  rationale: Behält den antiken Maßbegriff bei und gibt בְּתוֹךְ räumlich präzise wieder.
