lexical_decisions:
- source_word: וָאָשׁוּב
  choice: Dann wandte ich mich wieder um
  rationale: שׁוב kann hier sowohl das Umwenden als auch eine erneute Bewegung bzw. den Übergang zur nächsten Vision ausdrücken. Die Wiedergabe bewahrt beide Nuancen möglichst weitgehend; die Alternative ohne „wieder“ steht in der Fußnote.
- source_word: וָאֶשָּׂא עֵינַי
  choice: hob meine Augen auf
  rationale: Die deutsche Formulierung erhält das hebräische Bild des Augenaufhebens und bleibt in einem würdevollen biblischen Erzählregister verständlich.
- source_word: וָאֶרְאֶה
  choice: sah
  rationale: ראה bezeichnet hier unmittelbar die visionäre Wahrnehmung des Propheten.
- source_word: וְהִנֵּה
  choice: Siehe
  rationale: הִנֵּה lenkt die Aufmerksamkeit lebhaft auf die überraschende Erscheinung. „Siehe“ bewahrt diese präsentierende Funktion besser als eine rein sachliche Umschreibung.
- source_word: מְגִלָּה
  choice: Schriftrolle
  rationale: מְגִלָּה bezeichnet eine beschriebene Rolle; „Schriftrolle“ ist im modernen Deutschen eindeutig und geläufig.
- source_word: עָפָה
  choice: fliegende
  rationale: Das feminine Partizip stimmt mit מְגִלָּה überein und beschreibt die Rolle als im Flug befindlich. Die attributive Form ist knapp und natürlich.
