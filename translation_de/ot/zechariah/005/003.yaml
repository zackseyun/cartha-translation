  to: 'Da sagte er zu mir: „Das ist der Fluch, der über das ganze Land[a] zieht. Denn jeder, der stiehlt, wird gemäß dem, was auf dieser Seite steht[b], beseitigt[c], und jeder, der schwört, wird gemäß dem, was auf jener Seite steht[b], beseitigt[c].“'
  rationale: Die Revision beseitigt die zusätzliche Lokalangabe „daraus“, die der hebräische Text nicht nennt, und ersetzt „hinauszieht“ durch die idiomatischere, quellentreuere Formulierung „über das ganze Land zieht“. Die neutrale Wiedergabe von „schwört“ bleibt erhalten; „falsch“ wird nicht in den Haupttext ergänzt. Die Ellipse hinsichtlich der Seiten der Schriftrolle bleibt als kontextuelle Erschließung markiert, und die Mehrdeutigkeit von נִקָּה wird in der Fußnote offengelegt.
  reviewer_model: gpt-5.6-terra
