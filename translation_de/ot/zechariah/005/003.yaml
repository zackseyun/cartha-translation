  text: וַ/יֹּ֣אמֶר אֵלַ֔/י זֹ֚את הָֽ/אָלָ֔ה הַ/יּוֹצֵ֖את עַל פְּנֵ֣י כָל הָ/אָ֑רֶץ כִּ֣י כָל הַ/גֹּנֵ֗ב מִ/זֶּה֙ כָּמ֣וֹ/הָ נִקָּ֔ה וְ/כָל הַ/נִּ֨שְׁבָּ֔ע מִ/זֶּ֖ה כָּמ֥וֹ/הָ נִקָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/003.yaml
  text: Then he said to me[a], “This is the curse that goes out over the face of the whole land, for everyone who steals will be purged away according to what is written on this side of it[c][b], and everyone who swears falsely will be purged away according to what is written on that side of it.”
translation:
  language: de
  text: 'Da sagte er zu mir: „Das ist der Fluch, der über das ganze Land[a] zieht. Denn jeder, der stiehlt, wird gemäß dem, was auf dieser Seite steht[b], beseitigt[c], und jeder, der schwört, wird gemäß dem, was auf jener Seite steht[b], beseitigt[c].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über die ganze Erde“. Das hebräische Wort אֶרֶץ kann sowohl „Land“ als auch „Erde“ bedeuten.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich ist die Wendung schwer verständlich: „von dieser Seite gemäß ihr … von jener Seite gemäß ihr“. Gemeint ist wahrscheinlich das, was auf den beiden Seiten der fliegenden Schriftrolle steht.'
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Verb kann je nach Zusammenhang auch „gereinigt“, „für schuldlos erklärt“, „weggeräumt“ oder „ausgetilgt“ bedeuten. Hier spricht der Fluchkontext für eine strafende Beseitigung.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָלָה
  choice: der Fluch
  rationale: אָלָה bezeichnet hier im Zusammenhang der Gerichtsvision einen wirksamen Fluch, möglicherweise einen durch einen Eid bekräftigten Fluch.
- source_word: הַיּוֹצֵאת
  choice: der … hinauszieht
  rationale: Das Partizip beschreibt den Fluch als etwas, das sich fortlaufend ausbreitet; „hinauszieht“ wahrt zugleich das visionäre Bewegungsbild.
- source_word: עַל־פְּנֵי כָל־הָאָרֶץ
  choice: über das ganze Land
  rationale: אֶרֶץ kann „Land“ oder „Erde“ bedeuten. Im nachexilischen Zusammenhang ist zunächst das Land der Gemeinschaft wahrscheinlich; die weitere Bedeutung bleibt in einer Fußnote erhalten.
- source_word: הַגֹּנֵב
  choice: jeder, der stiehlt
  rationale: Das substantivierte Partizip bezeichnet allgemein jeden, der Diebstahl begeht.
- source_word: מִזֶּה ... כָּמוֹהָ
  choice: gemäß dem, was auf dieser Seite steht … gemäß dem, was auf jener Seite steht
  rationale: Die hebräische Wendung ist elliptisch. Im Kontext der Schriftrolle liegt der Bezug auf deren zwei Seiten nahe; „steht“ macht die Inschrift nur so weit ausdrücklich, wie der Kontext es trägt.
- source_word: נִקָּה
  choice: daraus entfernt
  rationale: Die Form kann „für schuldlos erklärt“, „gereinigt“ oder im Gerichtszusammenhang „weggeräumt/entfernt“ bedeuten. Da ein Fluch gegen Täter ergeht, ist eine strafende Entfernung wahrscheinlicher; „daraus“ bezieht die Entfernung auf das Land, ohne ein bestimmtes Vollstreckungsbild festzulegen.
- source_word: הַנִּשְׁבָּע
  choice: jeder, der schwört
  rationale: Im Hebräischen steht lediglich „der Schwörende“. Ein falscher Eid ist im Zusammenhang wahrscheinlich, wird jedoch nicht stillschweigend in den Haupttext eingefügt.
theological_decisions:
- issue: Reichweite von הָאָרֶץ
  choice: Land
  alternative: Erde
  rationale: Die Vision richtet sich wahrscheinlich zunächst gegen Übertretungen innerhalb des Landes; die lexikalisch mögliche weltweite Reichweite wird nicht ausgeschlossen, sondern in der Fußnote genannt.
- issue: Bedeutung von נִקָּה im Fluchkontext
  choice: strafende Entfernung
  alternative: für schuldlos erklärt / gereinigt
  rationale: Eine Freisprechung würde der unmittelbaren Gerichtsrichtung des Fluches entgegenlaufen. Die Übersetzung wahrt dennoch die ungewöhnliche und umstrittene Wortwahl durch eine Fußnote.
- issue: Art des Schwörens
  choice: 'neutral formuliert: „schwört“'
  alternative: „falsch schwört“
  rationale: Ein falscher oder betrügerischer Eid ist sachlich naheliegend, doch das Adverb „falsch“ fehlt im hebräischen Vers. Die offenere Formulierung bewahrt die Spannung und vermeidet eine nicht ausdrücklich markierte Ergänzung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Bildsprache der sich ausbreitenden Schriftrolle bleibt erhalten. Ellipsen werden behutsam erschlossen, während echte lexikalische Mehrdeutigkeiten in den Fußnoten offengelegt werden.
