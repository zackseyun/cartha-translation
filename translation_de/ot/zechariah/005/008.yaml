source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ זֹ֣את הָ/רִשְׁעָ֔ה וַ/יַּשְׁלֵ֥ךְ אֹתָ֖/הּ אֶל תּ֣וֹךְ הָֽ/אֵיפָ֑ה וַ/יַּשְׁלֵ֛ךְ אֶת אֶ֥בֶן הָ/עֹפֶ֖רֶת אֶל פִּֽי/הָ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/008.yaml
  text: And he said[a], “This is Wickedness,” and he threw her into the middle of the ephah basket[c][b], and he threw the lead weight onto its opening.
translation:
  language: de
  text: 'Da sagte er: »Das ist die Bosheit.« Dann warf er sie mitten in das Efa-Gefäß[a] und warf den Bleistein[b] auf dessen Öffnung[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Efa war ein Hohlmaß für trockene Waren; hier ist das entsprechende, in der Vision erscheinende Messgefäß gemeint.
    reason: cultural_note
  - marker: b
    text: Wörtlich »Stein aus Blei«; möglich ist auch »Bleigewicht«.
    reason: lexical_alternative
  - marker: c
    text: Wörtlich »auf seinen Mund«, das heißt auf die Öffnung des Efa-Gefäßes.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִשְׁעָה
  choice: die Bosheit
  rationale: Das feminine Abstraktum bezeichnet hier personifiziert die Frau im Gefäß. »Die Bosheit« wahrt sowohl den abstrakten Begriff als auch das feminine Genus, ohne ihn deutend zu »böse Frau« umzuschreiben.
- source_word: וַיַּשְׁלֵךְ אֹתָהּ
  choice: warf er sie
  rationale: שׁלך bedeutet gewöhnlich »werfen«. Das feminine Objektsuffix verweist auf die Frau beziehungsweise die personifizierte Bosheit.
- source_word: אֶל תּוֹךְ
  choice: mitten in
  rationale: תּוֹךְ bezeichnet das Innere beziehungsweise die Mitte. »Mitten in« gibt die konkrete räumliche Aussage knapp und natürlich wieder.
- source_word: הָאֵיפָה
  choice: das Efa-Gefäß
  rationale: אֵיפָה ist ein Efa, also ein Hohlmaß und zugleich das entsprechende Messgefäß. »Efa-Gefäß« bewahrt den Kulturbegriff und verdeutlicht zugleich den in der Vision sichtbaren Behälter.
- source_word: אֶבֶן הָעֹפֶרֶת
  choice: den Bleistein
  rationale: Die Wendung bedeutet formal »Stein aus Blei« beziehungsweise »Bleistein«. Diese Wiedergabe wahrt das konkrete Bild; »Bleigewicht« wäre im Zusammenhang plausibel, aber stärker funktional deutend.
- source_word: אֶל פִּיהָ
  choice: auf dessen Öffnung
  rationale: פֶּה heißt wörtlich »Mund«, bezeichnet bei einem Gefäß aber idiomatisch dessen Öffnung. Das Suffix bezieht sich auf das Efa-Gefäß.
theological_decisions:
- issue: Personifikation der Bosheit in der Vision
  choice: Das Abstraktum als »die Bosheit« wiedergeben und mit dem femininen Pronomen »sie« darauf zurückverweisen.
  alternative: »Das ist die böse Frau« oder eine typografisch als Eigenname markierte Form »Bosheit«
  rationale: Der hebräische Text identifiziert die Frau mit dem femininen Abstraktum רִשְׁעָה. Die Übersetzung soll diese Personifikation erkennbar lassen, aber die abstrakte Bezeichnung weder in eine bloße Charakterisierung der Frau verwandeln noch durch unnötige typografische Deutung zum Eigennamen machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen, kraftvollen Verben bilden die Härte der Handlung ab. »Efa-Gefäß« verbindet Quellennähe mit unmittelbarer Verständlichkeit; die ungewöhnliche Wendung »Bleistein« bleibt durch eine Fußnote transparent.
