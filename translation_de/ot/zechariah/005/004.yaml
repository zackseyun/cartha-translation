base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/004.yaml
  text: I have sent it out[a], declares Yahweh of hosts, and it will enter the house of the thief and the house of the one who swears falsely by my name, and it will remain within his house and consume it[b], both its timber and its stones.
translation:
  language: de
  text: »Ich habe ihn ausgesandt[a]«, spricht Jahwe der Heerscharen, »und er wird in das Haus des Diebes und in das Haus dessen kommen, der bei meinem Namen falsch schwört; er wird in seinem Haus bleiben[b] und es völlig zerstören, sein Holz und seine Steine.«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ich habe ihn hervorgebracht.« Das hebräische Verb bedeutet wörtlich, etwas herauszubringen; im Zusammenhang ist das Aussenden des Fluches zu seinem Werk gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »wird er dort wohnen/übernachten«. Das hebräische Verb kann auch ein Übernachten bezeichnen; hier betont es, dass der Fluch nicht nur eintritt, sondern im Haus bleibt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹצֵאתִיהָ
  choice: Ich habe ihn ausgesandt
  rationale: Der Hifil von יצא bezeichnet hier das Hinausbringen beziehungsweise Aussenden des zuvor genannten Fluches. Das hebräische Suffix ist feminin; im Deutschen richtet sich das Pronomen natürlich nach dem grammatisch maskulinen »Fluch«.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: spricht Jahwe der Heerscharen
  rationale: »Spricht« gibt die prophetische Formel נְאֻם idiomatisch und würdig wieder. »Jahwe« bewahrt den Gottesnamen; »der Heerscharen« erhält die traditionelle, bildhafte Bedeutung von צְבָאוֹת.
- source_word: וּבָאָה אֶל־בֵּית
  choice: Er wird in das Haus … eindringen
  rationale: בוא mit אֶל und einem Haus bezeichnet hier den Eintritt. »Eindringen« macht den bedrohlichen Vollzug des Fluches deutlich, ohne den Vorgang näher auszudeuten.
- source_word: בֵּית הַגַּנָּב
  choice: das Haus des Diebes
  rationale: גַּנָּב bezeichnet unmittelbar einen Dieb; die Genitivkonstruktion entspricht dem Hebräischen natürlich.
- source_word: הַנִּשְׁבָּע בִּשְׁמִי לַשָּׁקֶר
  choice: dessen, der bei meinem Namen falsch schwört
  rationale: Die Formulierung bewahrt sowohl das Schwören unter Berufung auf Gottes Namen als auch die Falschheit des Eides.
- source_word: וְלָנֶה בְּתוֹךְ בֵּיתוֹ
  choice: Dort, mitten in seinem Haus, wird er bleiben
  rationale: לון kann »übernachten«, »sich niederlassen« oder »bleiben« bedeuten. Im Zusammenhang steht die anhaltende Gegenwart des Fluches bis zur Vernichtung im Vordergrund; בְּתוֹךְ wird mit »mitten in« räumlich konkret wiedergegeben.
- source_word: וְכִלַּתּוּ
  choice: und das Haus verzehren
  rationale: כלה im Piel bezeichnet vollständiges Aufzehren beziehungsweise Vernichten. Das wiederholte Nomen »das Haus« vermeidet im Deutschen eine mögliche Unklarheit des Pronomens.
- source_word: עֵצָיו וְאֶת־אֲבָנָיו
  choice: samt seinem Holz und seinen Steinen
  rationale: Die konkreten Baustoffe unterstreichen die vollständige Zerstörung. »Holz« lässt offen, ob Balken oder anderes Holzwerk gemeint ist.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. »Jahwe« gibt den persönlichen Bundesnamen in der im Deutschen geläufigen Form wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug des femininen Objektsuffixes in הוֹצֵאתִיהָ
  choice: ihn, bezogen auf den Fluch aus Vers 3
  alternative: sie, bezogen auf die Schriftrolle
  rationale: Der unmittelbar zuvor als Inhalt der Schriftrolle bezeichnete Fluch ist das handelnde Gericht, das in die Häuser eindringt. Das Deutsche verlangt beim Rückbezug auf »Fluch« ein maskulines Pronomen; die im Hebräischen feminine Form bleibt als grammatische Rückbindung an הָאָלָה beziehungsweise die Bildsprache verständlich, ohne eine eigene weibliche Person anzunehmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede hält die prophetische Gottesrede lebendig; konkrete Begriffe wie »Dieb«, »Haus«, »Holz« und »Steine« bewahren die Bildkraft. Die Fußnoten markieren echte lexikalische Spielräume, ohne den Haupttext unnötig zu verfremden.
