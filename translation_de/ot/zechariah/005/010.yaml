  text: Then I said to the angel who was speaking with me[a], “Where are they taking the ephah?”
translation:
  language: de
  text: 'Da sagte ich zu dem Engel, der mit mir redete: »Wohin bringen sie das Efa[a]?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Korb“ beziehungsweise „den Messkorb“. Das hebräische Wort bezeichnet ein Efa, ein gebräuchliches Trockenmaß, und meint hier das in der Vision gesehene Gefäß.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Da sagte ich
  rationale: Das Wayyiqtol führt die Erzählung weiter. „Da sagte ich“ bildet sowohl die zeitliche Folge als auch das schlichte Redeverb אמר natürlich ab.
- source_word: הַמַּלְאָךְ
  choice: der Engel
  rationale: מַלְאָךְ kann „Bote“ oder „Engel“ bedeuten. Im Zusammenhang der Vision ist der übernatürliche Deuteengel gemeint; daher ist „Engel“ hier eindeutig und idiomatisch.
- source_word: הַדֹּבֵר בִּי
  choice: der mit mir redete
  rationale: Die in Sacharja wiederkehrende Verbindung דֹּבֵר בִּי bedeutet idiomatisch „mit mir reden“. Das Präteritum passt zur deutschen Erzählweise und gibt das Partizip als begleitende beziehungsweise kennzeichnende Tätigkeit wieder.
- source_word: אָנָה
  choice: Wohin
  rationale: Das Adverb fragt ausdrücklich nach dem Ziel einer Bewegung. „Wohin“ ist im Deutschen präzise und natürlich.
- source_word: הֵמָּה
  choice: sie
  rationale: Das selbstständige feminine Pluralpronomen verweist auf die beiden Frauen aus dem vorhergehenden Vers. Im Deutschen genügt das natürliche Pronomen „sie“.
- source_word: מוֹלִכוֹת
  choice: bringen sie
  rationale: Das feminine Hifil-Partizip von הלך bezeichnet hier das Befördern des Efa zu einem Ziel. „Bringen“ gibt diese zielgerichtete Bewegung eines Gegenstands natürlich wieder, ohne eine bestimmte Trageweise vorauszusetzen.
- source_word: אֶת הָאֵיפָה
  choice: das Efa
  rationale: אֵיפָה bezeichnet eigentlich ein Trockenmaß und in der Vision zugleich das entsprechende Messgefäß. Die Beibehaltung des Begriffs „Efa“ wahrt die Bildsprache und den Zusammenhang innerhalb der Vision; die Fußnote erläutert ihn.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung ist einfach und mündlich verständlich; „Wohin“ bewahrt die Zielrichtung der Frage. Der historische Maßbegriff bleibt im Haupttext stehen und wird unmittelbar erläutert.
