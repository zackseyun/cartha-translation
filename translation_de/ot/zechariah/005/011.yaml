source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ֔/י לִ/בְנֽוֹת לָ֥/הֿ בַ֖יִת בְּ/אֶ֣רֶץ שִׁנְעָ֑ר וְ/הוּכַ֛ן וְ/הֻנִּ֥יחָה שָּׁ֖ם עַל מְכֻנָתָֽ/הּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/011.yaml
  text: And he said to me[a], “To build a house for her in the land of Shinar; and when it is prepared[b], she will be set there on her base.”
translation:
  language: de
  text: 'Und er sagte zu mir: „Um ihr im Land Schinar[a] ein Haus zu bauen. Sobald es hergerichtet ist, wird sie dort auf ihren Sockel gestellt.“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Schinar ist im Alten Testament eine alte Bezeichnung für das mit Babylonien verbundene Gebiet.
    reason: cross_reference
  - marker: b
    text: 'Oder: „Dann wird es dort auf seinen Sockel gestellt.“ Die femininen Formen im Hebräischen können auf die Frau namens „Bosheit“ bezogen werden oder allgemeiner auf das Efa beziehungsweise seinen Inhalt.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: Und er sagte zu mir
  rationale: Gibt den erzählenden Wayyiqtol-Anschluss und das ausdrückliche אֵלַי natürlich und quellennah wieder.
- source_word: לִבְנוֹת לָהּ בַּיִת
  choice: Man will ihr … ein Haus bauen
  rationale: Der Infinitiv mit ל bezeichnet hier den Zweck der zuvor geschilderten Bewegung. Die unpersönliche deutsche Form ergänzt kein bestimmtes Subjekt und ergibt nach der Frage aus Vers 10 einen vollständigen, natürlichen Satz.
- source_word: בְּאֶרֶץ שִׁנְעָר
  choice: im Land Schinar
  rationale: Der überlieferte Ortsname bleibt erhalten, statt deutend durch „Babylonien“ ersetzt zu werden.
- source_word: וְהוּכַן
  choice: Wenn es hergerichtet ist
  rationale: Das Hophal von כון bezeichnet das Bereitmachen beziehungsweise feste Herrichten. Das maskuline Verb bezieht sich am ehesten auf das Haus; „wenn“ gibt die sachliche Abfolge idiomatisch wieder.
- source_word: וְהֻנִּיחָה
  choice: wird sie dort … gestellt
  rationale: Die feminine Singularform führt am natürlichsten die personifizierte Frau beziehungsweise die Bosheit aus dem vorausgehenden Bild fort. Das Passiv wahrt den placement/resultativen Sinn.
- source_word: עַל מְכֻנָתָהּ
  choice: auf ihren Sockel
  rationale: מְכוּנָה bezeichnet einen festen Unterbau, Stand oder Sockel. „Sockel“ ist im Deutschen anschaulich, knapp und passt zur Aufstellung der Gestalt.
theological_decisions:
- issue: Bezug der femininen Formen im Schlusssatz
  choice: 'Die femininen Formen werden auf die zuvor als Frau dargestellte und „Bosheit“ genannte Gestalt bezogen: „sie … auf ihren Sockel“.'
  alternative: 'Abstrakter Bezug auf das Efa beziehungsweise seinen Inhalt: „es … auf seinen Sockel/Unterbau“.'
  rationale: Die grammatisch feminine Fortführung und die literarische Personifikation aus Sacharja 5,7–8 sprechen für „sie“. Da die Bildsprache auch abstrakter verstanden werden kann, wird die andere Möglichkeit in einer Fußnote offengehalten.
- issue: Bedeutung von Schinar
  choice: Der alte Ortsname „Schinar“ bleibt im Text stehen.
  alternative: Deutende Wiedergabe als „Babylonien“.
  rationale: So werden die kanonischen Assoziationen nicht im Haupttext erklärt oder theologisch festgelegt; eine knappe historische Orientierung steht in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Man will … bauen“ vervollständigt die elliptische Zweckantwort ohne ein nicht genanntes handelndes Subjekt festzulegen. „Hergerrichtet“ und „Sockel“ halten die Bildsprache konkret; die echte Bezugsambiguität der femininen Formen wird nicht eingeebnet, sondern in Fußnote [b] ausgewiesen.
