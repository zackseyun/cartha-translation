  source_fidelity: 'Der Entwurf gibt die wesentlichen Elemente zutreffend wieder: Schinar bleibt als Ortsname erhalten, das Haus wird als Bezugswort von „hergerichtet“ verstanden, und die feminine Schlussform wird sinnvoll auf die personifizierte Bosheit bezogen. Das hebräische לִבְנוֹת ist jedoch ein Infinitiv der Zweckbestimmung, nicht ausdrücklich eine finite Aussage über einen ungenannten Willen; „Man will … bauen“ ist daher interpretierender als nötig.'
