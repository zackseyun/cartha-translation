  terminology: „Schinar“, „Haus“, „hergerichtet“ und „Sockel“ sind geeignete moderne deutsche Wiedergaben. „Sockel“ wahrt die konkrete Bildsprache von מְכֻנָה. Die Fußnote hält die umstrittene bzw. nicht völlig eindeutige Referenz der femininen Formen angemessen offen.
