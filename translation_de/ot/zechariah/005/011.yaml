  rationale: Die Revision beschränkt sich auf die Wiedergabe des hebräischen Infinitivs לִבְנוֹת. „Um ihr … ein Haus zu bauen“ erhält dessen Zweckcharakter und die bewusst elliptische Antwortform. Die übrigen Entscheidungen, einschließlich der Fußnotenanker und der als Alternative vermerkten Bezugsdeutung, bleiben bestehen.
