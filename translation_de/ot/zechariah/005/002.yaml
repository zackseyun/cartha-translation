  text: וַ/יֹּ֣אמֶר אֵלַ֔/י מָ֥ה אַתָּ֖ה רֹאֶ֑ה וָ/אֹמַ֗ר אֲנִ֤י רֹאֶה֙ מְגִלָּ֣ה עָפָ֔ה אָרְכָּ/הּ֙ עֶשְׂרִ֣ים בָּֽ/אַמָּ֔ה וְ/רָחְבָּ֖/הּ עֶ֥שֶׂר בָּ/אַמָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/002.yaml
  text: And he said to me[a], “What do you see?” And I said, “I see a flying scroll. Its length is twenty cubits, and its width is ten cubits.”
translation:
  language: de
  text: 'Und er sagte zu mir: „Was siehst du?“ Ich sagte: „Ich sehe eine fliegende Schriftrolle. Ihre Länge beträgt zwanzig Ellen[a], und ihre Breite beträgt zehn Ellen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eine Elle war ein gebräuchliches antikes Längenmaß und entsprach ungefähr dem Abstand vom Ellenbogen bis zu den Fingerspitzen.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: Und er sagte zu mir
  rationale: Das Waw mit der narrativen Verbform führt die Handlung weiter. „Und er sagte zu mir“ bewahrt diese Abfolge, ohne eine zusätzliche zeitliche Nuance einzutragen.
- source_word: מָה אַתָּה רֹאֶה
  choice: Was siehst du?
  rationale: Das Partizip רֹאֶה bezeichnet hier das gegenwärtige Wahrnehmen; die gewählte Form ist im modernen Deutsch natürlich und genau.
- source_word: וָאֹמַר אֲנִי רֹאֶה
  choice: 'Ich sagte: „Ich sehe'
  rationale: Das ausdrücklich gesetzte אֲנִי wird durch „ich“ wiedergegeben. „Ich sehe“ entspricht dem gegenwärtigen Wahrnehmen und klingt idiomatisch.
- source_word: מְגִלָּה
  choice: Schriftrolle
  rationale: מְגִלָּה bezeichnet eine Rolle beziehungsweise ein aufgerolltes Dokument. „Schriftrolle“ ist die klare, heute übliche deutsche Bezeichnung.
- source_word: עָפָה
  choice: fliegende
  rationale: Das feminine Partizip bestimmt die Schriftrolle näher und bewahrt das eindrückliche Bild einer fliegenden Rolle ohne erklärende Erweiterung.
- source_word: אָרְכָּהּ
  choice: Ihre Länge
  rationale: Die Form bezeichnet die Längenausdehnung der Schriftrolle einschließlich des Suffixes „ihre“.
- source_word: עֶשְׂרִים בָּאַמָּה
  choice: zwanzig Ellen
  rationale: Die antike Maßeinheit אַמָּה wird als „Elle“ beibehalten, statt sie mit einem unsicheren modernen Zahlenwert wiederzugeben.
- source_word: וְרָחְבָּהּ
  choice: und ihre Breite
  rationale: „Breite“ bildet im heutigen Deutsch den natürlichen dimensionalen Gegenbegriff zu „Länge“ ab.
- source_word: עֶשֶׂר בָּאַמָּה
  choice: zehn Ellen
  rationale: Auch hier bleibt die ursprüngliche Maßeinheit erhalten. Das wiederholte „beträgt“ macht den deutschen Satz klar und flüssig.
