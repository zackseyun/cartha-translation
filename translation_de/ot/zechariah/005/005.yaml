translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht feierliche Wendung »die Augen aufheben« bewahrt das Bild des Hebräischen, während »doch« die Bitte natürlich ausdrückt. Die Richtungsmehrdeutigkeit von יָצָא wird in den Anmerkungen offengehalten.
