base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/005.yaml
  text: Then the angel who was speaking with me went out and said to me[c][b][a], “Please lift up your eyes and see what this is that is coming out.”
translation:
  language: de
  text: 'Da ging der Engel, der mit mir redete,[b] hinaus[a] und sagte zu mir: »Hebe bitte deine Augen auf und sieh: Was ist das, was da herauskommt?[c]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »kam heraus«; das hebräische Verb יָצָא ist ein allgemeines Bewegungsverb, dessen deutsche Richtung vom Blickpunkt abhängt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »der in mir redete«; die Wendung bedeutet hier »der mit mir redete«.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »Was ist das, was da hinausgeht?«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: ging … hinaus
  rationale: Die Grundbedeutung von יָצָא ist »hinausgehen/herauskommen«. »Ging … hinaus« folgt der hebräischen Erzählperspektive, ohne die im Deutschen vom Standort abhängige Bewegungsrichtung als völlig eindeutig auszugeben.
- source_word: הַמַּלְאָךְ
  choice: der Engel
  rationale: מַלְאָךְ kann »Bote« oder »Engel« bedeuten; im visionären Zusammenhang Sacharjas ist der deutende himmlische Begleiter gemeint.
- source_word: הַדֹּבֵר בִּי
  choice: der mit mir redete
  rationale: Wörtlich steht בִּי »in mir«; die wiederkehrende Wendung bezeichnet hier jedoch den Engel, der mit dem Propheten spricht. Das Präteritum fügt sich natürlich in den deutschen Erzählstil ein.
- source_word: וַיֹּאמֶר אֵלַי
  choice: und sagte zu mir
  rationale: Natürliche deutsche Wiedergabe der hebräischen Erzählform mit אֵלַי.
- source_word: שָׂא נָא עֵינֶיךָ
  choice: Heb doch deine Augen auf
  rationale: Die bildhafte hebräische Wendung bleibt erhalten; »doch« gibt die höflich-auffordernde Partikel נָא im gegenwärtigen Deutsch natürlich wieder.
- source_word: וּרְאֵה
  choice: und sieh
  rationale: Formnahe Wiedergabe des Imperativs von רָאָה.
- source_word: מָה הַיּוֹצֵאת הַזֹּאת
  choice: Was ist das, was da herauskommt?
  rationale: Die etwas markierte Frageform bewahrt sowohl מָה als auch das Demonstrativ הַזֹּאת. »Herauskommt« gibt den fortdauernden Vorgang des Partizips wieder; »da« verweist natürlich auf das visionär Sichtbare.
