  text: וָ/אֶשָּׂ֨א עֵינַ֜/י וָ/אֵ֗רֶא וְ/הִנֵּה֩ שְׁתַּ֨יִם נָשִׁ֤ים יֽוֹצְאוֹת֙ וְ/ר֣וּחַ בְּ/כַנְפֵי/הֶ֔ם וְ/לָ/הֵ֥נָּה כְנָפַ֖יִם כְּ/כַנְפֵ֣י הַ/חֲסִידָ֑ה וַ/תִּשֶּׂ֨אנָה֙ אֶת הָ֣/אֵיפָ֔ה בֵּ֥ין הָ/אָ֖רֶץ וּ/בֵ֥ין הַ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/009.yaml
  text: Then I lifted up my eyes and saw[a], and behold, two women were coming out, and the wind was in their wings. They had wings like the wings of a stork[b], and they lifted up the ephah between the earth and the heavens.
translation:
  language: de
  text: 'Dann erhob ich meine Augen und sah: Siehe, zwei Frauen kamen hervor, und Wind[a] war in ihren Flügeln. Sie hatten Flügel wie die Flügel eines Storches, und sie hoben das Efa[b] zwischen Erde und Himmel empor.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Geist.'
    reason: Bewahrt die Bedeutungsbreite von רוּחַ, obwohl der Zusammenhang hier eher für „Wind“ spricht.
  - marker: b
    text: Ein Efa war ein gebräuchliches Trockenmaß; hier ist damit auch das im Gesicht erscheinende Messgefäß gemeint.
    reason: Erklärt den antiken Maßbegriff und seine gegenständliche Verwendung in der Vision.
lexical_decisions:
- source_word: וָאֶשָּׂא עֵינַי
  choice: Dann erhob ich meine Augen
  rationale: Bewahrt die hebräische Ausdrucksweise eines Visionsberichts; „Dann“ gibt die erzählerische Abfolge im Zusammenhang wieder.
- source_word: וָאֵרֶא וְהִנֵּה
  choice: 'und sah: Siehe'
  rationale: Erhält die lebhafte, hinweisende Wirkung von הִנֵּה. Der Doppelpunkt verbindet die Wendung natürlich mit dem folgenden Gesicht.
- source_word: שְׁתַּיִם נָשִׁים יֹצְאוֹת
  choice: zwei Frauen kamen hervor
  rationale: Das Geschlecht ist ausdrücklich genannt. „Kamen hervor“ gibt die im Partizip dargestellte, vor den Augen des Propheten ablaufende Bewegung idiomatisch wieder.
- source_word: וְרוּחַ בְּכַנְפֵיהֶם
  choice: und Wind war in ihren Flügeln
  rationale: רוּחַ kann „Wind“ oder „Geist“ bedeuten. Die Flugbewegung und der Vergleich mit Storchenflügeln sprechen hier vorrangig für „Wind“; die Mehrdeutigkeit wird in einer Fußnote kenntlich gemacht.
- source_word: וְלָהֵנָּה כְנָפַיִם
  choice: Sie hatten Flügel
  rationale: Die hebräische Existenz- beziehungsweise Besitzkonstruktion wird in natürlichem Deutsch als Besitz ausgedrückt.
- source_word: כְּכַנְפֵי הַחֲסִידָה
  choice: wie die Flügel eines Storches
  rationale: חֲסִידָה bezeichnet den Storch; das konkrete Vergleichsbild bleibt erhalten.
- source_word: וַתִּשֶּׂאנָה
  choice: sie hoben … empor
  rationale: נשׂא bezeichnet das Heben oder Tragen. Im Bild des Flugs gibt „emporheben“ die Aufwärtsbewegung treffend wieder.
- source_word: אֶת־הָאֵיפָה
  choice: das Efa
  rationale: אֵיפָה ist ein Trockenmaß und bezeichnet hier zugleich das im Gesicht gezeigte Gefäß. Die Beibehaltung des Fachbegriffs wahrt die Verbindung zum Kontext; eine Fußnote erklärt ihn.
- source_word: בֵּין הָאָרֶץ וּבֵין הַשָּׁמָיִם
  choice: zwischen die Erde und den Himmel
  rationale: Der Akkusativ ist im Deutschen bei einer Bewegung in den Zwischenraum hinein natürlich. „Erde“ und „Himmel“ geben den kosmischen Gegensatz wieder; der morphologische Plural שָׁמַיִם verlangt im Deutschen keinen Plural.
theological_decisions:
- issue: Bedeutung von רוּחַ in der visionären Flugszene
  choice: Wind
  alternative: Geist
  rationale: Flügel, Storchenvergleich und das Emporheben des Efa legen die konkrete Bedeutung „Wind“ nahe. Da das hebräische Wort auch „Geist“ bedeuten kann, wird diese echte lexikalische Möglichkeit nicht verschwiegen.
- issue: Wiedergabe von אֵיפָה im prophetischen Gesicht
  choice: das Efa
  alternative: der Messkorb / das Messgefäß
  rationale: Der hebräische Ausdruck bezeichnet ursprünglich ein Trockenmaß, im Gesicht aber offenbar auch dessen Behälter. „Efa“ bewahrt die lexikalische Kontinuität und vermeidet, die genaue Gestalt des Gegenstands stärker festzulegen als der Text.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Visionsformel „erhob ich meine Augen“ und das verständliche „Siehe“ bewahren den prophetischen Ton, ohne unnötig altertümlich zu wirken. „Storch“, „Wind“ und „emporheben“ halten das anschauliche Flugbild klar.
