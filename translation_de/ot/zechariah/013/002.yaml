source:
  edition: WLC
  text: וְ/הָיָה֩ בַ/יּ֨וֹם הַ/ה֜וּא נְאֻ֣ם יְהוָ֣ה צְבָא֗וֹת אַכְרִ֞ית אֶת שְׁמ֤וֹת הָֽ/עֲצַבִּים֙ מִן הָ/אָ֔רֶץ וְ/לֹ֥א יִזָּכְר֖וּ ע֑וֹד וְ/גַ֧ם אֶת הַ/נְּבִיאִ֛ים וְ/אֶת ר֥וּחַ הַ/טֻּמְאָ֖ה אַעֲבִ֥יר מִן הָ/אָֽרֶץ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/002.yaml
  text: And it shall happen in that day[a], declares Yahweh of hosts, that I will cut off the names of the idols from the land, and they shall be remembered no more[b]. And also I will remove from the land the prophets and the unclean spirit.
translation:
  language: de
  text: 'Und an jenem Tag wird es geschehen – Spruch Jahwes der Heerscharen: Ich werde die Namen der Götzen aus dem Land ausrotten, und man wird sich nicht mehr an sie erinnern. Auch die Propheten[b] und den unreinen Geist[a] werde ich aus dem Land entfernen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Geist der Unreinheit«.'
    reason: lexical_alternative
  - marker: b
    text: Mit den »Propheten« sind in diesem Zusammenhang illegitime Propheten gemeint, die mit Götzendienst und Unreinheit verbunden sind.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: Und … wird es geschehen
  rationale: Gibt die prophetische Zukunftsformel würdig und in heutigem Deutsch wieder.
- source_word: בַיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Bewahrt die feste prophetische Zeitformel; im Deutschen ist bei einem bestimmten Tag „an“ idiomatisch.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: Spruch Jahwes der Heerscharen
  rationale: „Spruch“ bildet die prophetische Botenformel נְאֻם knapp ab; der Gottesname wird als „Jahwe“ wiedergegeben, und צְבָאוֹת formal als „der Heerscharen“.
- source_word: אַכְרִית
  choice: Ich werde … ausrotten
  rationale: Die Hifil-Form bezeichnet eine entschiedene, vollständige Beseitigung; „ausrotten“ bewahrt diese Stärke.
- source_word: שְׁמוֹת הָעֲצַבִּים
  choice: die Namen der Götzen
  rationale: „Namen“ bleibt ausdrücklich erhalten und deutet auf die Tilgung von Kult und Erinnerung; עֲצַבִּים bezeichnet hier Götzen.
- source_word: מִן הָאָרֶץ
  choice: aus dem Land
  rationale: Im Zusammenhang der Reinigung der Gemeinschaft ist die territoriale Bedeutung „Land“ wahrscheinlicher als „Erde“.
- source_word: וְלֹא יִזָּכְרוּ עוֹד
  choice: sodass man sich nicht mehr an sie erinnern wird
  rationale: Gibt das unpersönliche hebräische Passiv natürlich wieder und macht den konsekutiven Zusammenhang verständlich, ohne den Sinn zu erweitern.
- source_word: וְגַם
  choice: Auch
  rationale: Bewahrt die additive Funktion in natürlicher deutscher Wortstellung.
- source_word: הַנְּבִיאִים
  choice: die Propheten
  rationale: Fügt das im Hebräischen fehlende Adjektiv „falsch“ nicht in den Haupttext ein; der negative Bezug ergibt sich aus dem Kontext und wird in einer Fußnote erläutert.
- source_word: רוּחַ הַטֻּמְאָה
  choice: den unreinen Geist
  rationale: Gibt die Konstruktverbindung idiomatisch wieder und lässt eine personale geistliche Wirklichkeit anklingen, ohne sie dogmatisch festzulegen.
- source_word: אַעֲבִיר
  choice: werde ich … entfernen
  rationale: Die Hifil-Form von עבר bedeutet hier „wegschaffen/entfernen“ und steht parallel zur Beseitigung der Götzen.
theological_decisions:
- issue: Ob הַנְּבִיאִים ausdrücklich als falsche Propheten bezeichnet werden soll
  choice: Im Haupttext steht quellentreu „die Propheten“; eine Fußnote erläutert den negativen Kontext.
  alternative: die falschen Propheten
  rationale: Das Umfeld von Götzendienst und Unreinheit zeigt, dass illegitime Propheten gemeint sind. Das Hebräische enthält jedoch kein Wort für „falsch“, weshalb diese Deutung nicht stillschweigend in den Text aufgenommen wird.
- issue: Ob רוּחַ הַטֻּמְאָה eine unpersönliche Wirkung oder eine personale geistliche Wirklichkeit bezeichnet
  choice: den unreinen Geist
  alternative: den Geist der Unreinheit
  rationale: Die Wendung kann einen von Unreinheit gekennzeichneten Geist bezeichnen. Die gewählte Form ist idiomatisch, wahrt aber durch die Fußnote die sprachlich mögliche abstraktere Wiedergabe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischem Klang. Die Satzstellung stellt nach der Redeeinleitung die göttlichen Handlungen klar heraus. Sämtliche Fußnotenmarker stehen unmittelbar bei den erläuterten Ausdrücken; ihre Reihenfolge folgt dem Auftreten im Text.
