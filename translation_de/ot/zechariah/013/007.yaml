    rationale: Das Hebräische verbindet den Imperativ mit einer Waw-Verbform. Eine Folge ist naheliegend, aber „sodass“ kann einen Zweck bzw. eine zu stark explizierte Resultatsrelation nahelegen. Eine einfache Koordination bewahrt die Offenheit besser.
  - severity: low
