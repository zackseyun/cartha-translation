source:
  edition: WLC
  text: חֶ֗רֶב עוּרִ֤י עַל רֹעִ/י֙ וְ/עַל גֶּ֣בֶר עֲמִיתִ֔/י נְאֻ֖ם יְהוָ֣ה צְבָא֑וֹת הַ֤ךְ אֶת הָֽ/רֹעֶה֙ וּ/תְפוּצֶ֣יןָ הַ/צֹּ֔אן וַ/הֲשִׁבֹתִ֥י יָדִ֖/י עַל הַ/צֹּעֲרִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/007.yaml
  text: Awake[a], O sword, against my shepherd, against the man who is my companion, declares Yahweh of Armies. Strike the shepherd, and the sheep will be scattered[c][b]; and I will turn my hand against the little ones.
translation:
  language: de
  text: Schwert, wach auf gegen meinen Hirten, gegen den Mann, der mein Gefährte ist[a]! – Spruch Jahwes der Heerscharen[b]. Schlage den Hirten, und die Schafe werden zerstreut werden! Und ich werde meine Hand gegen die Kleinen wenden[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „gegen den Mann, der mir nahesteht“ oder möglicherweise „gegen den Mann, der mir gleich ist“. Das hebräische Wort bezeichnet jemanden, der einem anderen eng verbunden ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „der HERR der Heerscharen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „Ich werde meine Hand über die Kleinen wenden“ oder „den Kleinen zuwenden“. Die Wendung kann ein Vorgehen gegen sie, aber auch allgemeiner ein erneutes Handeln an ihnen bezeichnen. Das hebräische Wort kann zudem „die Jungen“ bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֶרֶב עוּרִי
  choice: Schwert, wach auf
  rationale: Bewahrt die direkte Anrede und die lebendige Personifikation des Schwertes; der feminine Singular des Imperativs entspricht חֶרֶב.
- source_word: רֹעִי
  choice: meinen Hirten
  rationale: Gibt das substantivisch gebrauchte Partizip mit dem Suffix der ersten Person direkt wieder.
- source_word: גֶּבֶר עֲמִיתִי
  choice: den Mann, der mir nahesteht
  rationale: עֲמִית bezeichnet einen eng verbundenen Mitmenschen oder Gefährten. Die Formulierung drückt Nähe natürlich aus, ohne die mögliche Bedeutung vorschnell metaphysisch zu bestimmen.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: Ausspruch Jahwes der Heerscharen
  rationale: נְאֻם wird als prophetische Ausspruchsformel wiedergegeben. Der Gottesname wird transparent als „Jahwe“ dargestellt; „Heerscharen“ ist im Deutschen verständlich und wahrt die traditionelle Bildsprache von צְבָאוֹת.
- source_word: הַךְ
  choice: Schlage
  rationale: Der Imperativ von נכה wird kraftvoll und ohne archaisierende Sprache wiedergegeben.
- source_word: וּתְפוּצֶינָ הַצֹּאן
  choice: sodass die Schafe zerstreut werden
  rationale: Die Verbform kann als Folge oder Zweck des Schlages verstanden werden. „Schafe“ hält die Bildsprache des Hirten ausdrücklich fest.
- source_word: וַהֲשִׁבֹתִי יָדִי עַל
  choice: Dann werde ich meine Hand gegen … wenden
  rationale: Die Wendung bezeichnet erneutes bzw. gezieltes Handeln gegenüber einer Gruppe; im Gerichtszusammenhang liegt „gegen“ nahe, doch die Mehrdeutigkeit wird in einer Fußnote offengehalten.
- source_word: הַצֹּעֲרִים
  choice: die Geringen
  rationale: צעיר kann geringe Stellung, Kleinheit oder Jugend bezeichnen. „Die Geringen“ ist im Kontext als Gruppenbezeichnung natürlich; weitere Möglichkeiten werden in der Fußnote genannt.
theological_decisions:
- issue: Bedeutung von עֲמִיתִי und Verhältnis des Mannes zu Jahwe
  choice: der mir nahesteht
  alternative: mein Gefährte; der Mann meinesgleichen
  rationale: Die Übersetzung wahrt die ausgesagte enge Beziehung, ohne eine spätere christologische Deutung in den Wortlaut einzutragen. Die stärkere mögliche Lesart wird als lexikalische Alternative ausgewiesen.
- issue: Richtung von Gottes Hand gegenüber הַצֹּעֲרִים
  choice: meine Hand gegen die Geringen wenden
  alternative: meine Hand den Geringen zuwenden / über die Geringen wenden
  rationale: Der Zusammenhang von Schlagen und Zerstreuen legt ein gerichtliches oder disziplinierendes Handeln nahe. Da die hebräische Wendung auch allgemeiner ein erneutes Handeln an ihnen bezeichnen kann, bleibt diese Spannung in der Fußnote erhalten.
- issue: Verknüpfung von Schlagen und Zerstreuung
  choice: sodass die Schafe zerstreut werden
  alternative: und die Schafe sollen zerstreut werden; dann werden die Schafe zerstreut
  rationale: Der hebräische Anschluss lässt die genaue modale Beziehung offen. Die gewählte Fassung drückt die naheliegende Folge aus, ohne das Geschehen unnötig auszubauen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetischer Direktheit. „Heerscharen“ bewahrt die biblische Bildwelt; „Schlage“ und „wach auf“ sind klar und gegenwärtig. Die Satzglieder folgen weitgehend der hebräischen Dramaturgie, während Zeichensetzung und Konnektoren die Verständlichkeit im Deutschen sichern.
