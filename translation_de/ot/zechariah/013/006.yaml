  terminology: „Wunden“ ist für מַכּוֹת im Kontext gut gewählt. „Die mich lieben“ bewahrt den relationalen Gehalt von מְאַהֲבָי, ohne die heute leicht sexualisierte Engführung von „meine Liebhaber“ zu erzwingen. Die Fußnoten erhalten sowohl die idiomatische Ortsdeutung als auch die nicht im Haupttext festzulegende christologische Auslegung.
