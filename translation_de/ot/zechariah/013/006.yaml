  text: וְ/אָמַ֣ר אֵלָ֔י/ו מָ֧ה הַ/מַּכּ֛וֹת הָ/אֵ֖לֶּה בֵּ֣ין יָדֶ֑י/ךָ וְ/אָמַ֕ר אֲשֶׁ֥ר הֻכֵּ֖יתִי בֵּ֥ית מְאַהֲבָֽ/י׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/006.yaml
  text: And if one says to him[a], “What are these wounds between your hands?” he will say[c][b], “Those with which I was wounded in the house of those who love me.”
translation:
  language: de
  text: 'Und jemand wird ihn fragen: »Was sind das für Wunden zwischen deinen Händen?[a]« Er wird antworten:[c] »Das sind die Wunden, die mir im Haus derer zugefügt wurden, die mich lieben.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »zwischen deinen Händen«; wahrscheinlich ist idiomatisch der Bereich zwischen den Armen, also Brust oder Oberkörper, gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »im Haus meiner Liebenden« oder »meiner Vertrauten«. Das Hebräische kann nahestehende, geliebte oder vertraute Personen bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: Manche christlichen Ausleger beziehen diese Wunden auf das Leiden des Messias. Der Vers selbst sagt dies nicht ausdrücklich.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָמַר אֵלָיו
  choice: Und jemand wird ihn fragen
  rationale: Wörtlich steht »und er wird zu ihm sagen«. Im Zusammenhang eröffnet die Äußerung jedoch eine Frage; »jemand« gibt das nicht näher bestimmte maskuline Subjekt natürlich wieder, ohne eine konkrete Person einzuführen.
- source_word: הַמַּכּוֹת
  choice: Wunden
  rationale: מַכּוֹת kann Schläge oder die von ihnen hinterlassenen Verletzungen bezeichnen. Da sichtbare Spuren Gegenstand der Frage sind, passt »Wunden« hier am besten.
- source_word: בֵּין יָדֶיךָ
  choice: zwischen deinen Händen
  rationale: Die formale Bedeutung wird beibehalten. Wahrscheinlich bezeichnet die Wendung idiomatisch den Bereich zwischen den Armen, also Brust oder Oberkörper; diese Möglichkeit wird in der Fußnote erläutert.
- source_word: וְאָמַר
  choice: Er wird antworten
  rationale: Das Verb bedeutet formal »sagen«; als Reaktion auf die unmittelbar vorausgehende Frage ist »antworten« im Deutschen die natürliche kontextuelle Wiedergabe.
- source_word: אֲשֶׁר הֻכֵּיתִי
  choice: Das sind die Wunden, die mir … zugefügt wurden
  rationale: Der hebräische Relativsatz lautet sinngemäß »mit denen ich geschlagen/verwundet wurde«. Die deutsche Fassung bewahrt die passive Aussage und den Bezug auf die Wunden, vermeidet aber eine unnatürliche Formulierung.
- source_word: בֵּית
  choice: im Haus derer
  rationale: Die lokale Grundbedeutung »im Haus« bleibt erhalten; je nach Zusammenhang kann zugleich der Haushalt oder die Gemeinschaft der betreffenden Personen mitgemeint sein.
- source_word: מְאַהֲבָי
  choice: die mich lieben
  rationale: Das Partizip mit Suffix bezeichnet wörtlich »meine Liebenden« beziehungsweise »die mich lieben«. Die gewählte Form bewahrt die relationale Stärke, ohne die im heutigen Deutschen leicht sexuelle Engführung von »meine Liebhaber« festzulegen.
theological_decisions:
- issue: Ob der Verwundete ausdrücklich als der Messias und seine Wunden als Kreuzigungswunden bezeichnet werden sollen
  choice: Der Haupttext trifft keine ausdrückliche messianische Identifikation.
  alternative: Christologische Deutung auf den leidenden beziehungsweise gekreuzigten Messias; daneben Deutung auf einen falschen Propheten mit kultisch oder disziplinarisch verursachten Wunden.
  rationale: Der hebräische Vers nennt weder den Messias noch eine Kreuzigung ausdrücklich. Deshalb bleibt die Identität des Sprechers im Haupttext offen; die traditionsgeschichtlich bedeutsame christologische Lesart wird als Auslegungsmöglichkeit in einer Fußnote genannt.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die dialogische Form ist klar und natürlich; zugleich bleiben die ungewöhnliche Ortsangabe »zwischen deinen Händen«, die Mehrdeutigkeit der Beziehung zu den Liebenden und die offene Identität des Verwundeten erhalten.
