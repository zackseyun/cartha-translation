source:
  edition: WLC
  text: וְ/הֵבֵאתִ֤י אֶת הַ/שְּׁלִשִׁית֙ בָּ/אֵ֔שׁ וּ/צְרַפְתִּי/ם֙ כִּ/צְרֹ֣ף אֶת הַ/כֶּ֔סֶף וּ/בְחַנְתִּ֖י/ם כִּ/בְחֹ֣ן אֶת הַ/זָּהָ֑ב ה֣וּא יִקְרָ֣א בִ/שְׁמִ֗/י וַֽ/אֲנִי֙ אֶעֱנֶ֣ה אֹת֔/וֹ אָמַ֨רְתִּי֙ עַמִּ֣/י ה֔וּא וְ/ה֥וּא יֹאמַ֖ר יְהוָ֥ה אֱלֹהָֽ/י־־־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/009.yaml
  text: And I will bring the third part through the fire[a], and I will refine them as silver is refined, and test them as gold is tested. He will call on my name, and I will answer him. I will say, ‘He is my people,’ and he will say, ‘Yahweh is my God.’
translation:
  language: de
  text: 'Und den dritten Teil werde ich durchs Feuer führen[a] und ihn läutern, wie man Silber läutert, und ihn prüfen, wie man Gold prüft. Er wird meinen Namen anrufen, und ich werde ihm antworten. Ich werde sagen: »Er ist mein Volk«, und er wird sagen: »Jahwe ist mein Gott.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „ins Feuer bringen“. Das Hebräische kann sowohl den Eintritt in die Feuerprobe als auch den Vorgang der Läuterung im Feuer ausdrücken.'
    reason: Die Präposition ב in Verbindung mit „bringen“ lässt eine Wiedergabe mit „ins Feuer“ oder „durchs Feuer“ zu.
lexical_decisions:
- source_word: הַשְּׁלִשִׁית
  choice: das Drittel
  rationale: Die substantivierte feminine Ordinalzahl bezeichnet das im vorherigen Vers übrig bleibende Drittel. „Das Drittel“ gibt den partitiv-kollektiven Sinn knapp und natürlich wieder.
- source_word: בָּאֵשׁ
  choice: durchs Feuer
  rationale: In Verbindung mit „führen/bringen“ bezeichnet die Wendung den Weg in und durch eine läuternde Feuerprobe; „durchs Feuer“ bewahrt dieses Prozessbild.
- source_word: וּצְרַפְתִּים
  choice: und es läutern
  rationale: צרף ist der übliche Ausdruck für das Läutern von Metall. Das singularische „es“ greift das kollektive „Drittel“ auf, während das Hebräische hier zunächst den Plural verwendet.
- source_word: כִּצְרֹף אֶת־הַכֶּסֶף
  choice: wie man Silber läutert
  rationale: Die unpersönliche deutsche Konstruktion gibt den vergleichenden Infinitiv natürlich wieder und erhält das metallurgische Bild.
- source_word: וּבְחַנְתִּים
  choice: und es prüfen
  rationale: בחן bezeichnet das Prüfen auf Echtheit oder Bewährung. „Prüfen“ ist verständlich und passt zur Goldprobe.
- source_word: כִּבְחֹן אֶת־הַזָּהָב
  choice: wie man Gold prüft
  rationale: Die parallele Formulierung wahrt den Vergleich mit der Echtheitsprüfung von Edelmetall.
- source_word: הוּא יִקְרָא בִשְׁמִי
  choice: Es wird meinen Namen anrufen
  rationale: קרא בשם bedeutet hier, den Namen im Gebet oder Gottesdienst anzurufen. Das neutrale Singularpronomen bezieht sich grammatisch auf „das Drittel“ und bewahrt den Wechsel vom Plural zum repräsentativen Singular.
- source_word: וַאֲנִי אֶעֱנֶה אֹתוֹ
  choice: und ich werde ihm antworten
  rationale: Das hebräische Objektpronomen ist maskulin singular und setzt die kollektive Restgruppe als repräsentative Einzelgestalt fort. „Ihm“ bewahrt diese auffällige Spannung, auch wenn der deutsche Rückbezug auf „das Drittel“ zuvor neutral ist.
- source_word: עַמִּי הוּא
  choice: Es ist mein Volk
  rationale: Die Formulierung erhält das singularische Pronomen und die kollektive Aussage der Bundesformel. Im Deutschen ist „Es ist mein Volk“ verständlicher als das grammatisch unpassende „Er ist mein Volk“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהָי
  choice: mein Gott
  rationale: Die Possessivform wird direkt und natürlich als persönliches Bekenntnis wiedergegeben.
theological_decisions:
- issue: Wechsel von pluralischer Restgruppe zum repräsentativen Singular in der Bundesformel
  choice: 'Den Wechsel sichtbar bewahren: „es … ihm … Es ist mein Volk … es“'
  alternative: 'Die Aussage vollständig zum Plural glätten: „Sie werden … ihnen … Sie sind mein Volk … sie“'
  rationale: Der hebräische Text wechselt bewusst oder jedenfalls deutlich von „sie“ in den Läuterungssätzen zu „er/ihm“ in der Antwort- und Bundesformel. Die Übersetzung soll diese grammatische und theologische Spannung nicht stillschweigend beseitigen.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. „Jahwe“ macht diesen Namen sichtbar, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die metallurgischen Bilder bleiben konkret. Der auffällige Numerus- und Genuswechsel des Hebräischen wird soweit im Deutschen verständlich erhalten; die Fußnote erläutert ausschließlich die räumlich-prozessuale Mehrdeutigkeit von בָּאֵשׁ.
