  terminology: „läutern“, „prüfen“, „anrufen“ und „Jahwe“ sind sachgemäß und modern. „Der dritte Teil“ ist hier gegenüber „das Drittel“ vorzuziehen, weil es den im Hebräischen folgenden maskulinen Singular im Deutschen konsistent anschließbar macht.
