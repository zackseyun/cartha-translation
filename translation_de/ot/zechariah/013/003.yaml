- from: 'Und es wird geschehen: Wenn ein Mann weiterhin prophetisch redet,[a] werden sein Vater und seine Mutter, die ihn gezeugt und geboren haben, zu ihm sagen: »Du darfst nicht am Leben bleiben, denn du hast im Namen Jahwes Lügen geredet.« Und sein Vater und seine Mutter, die ihn gezeugt und geboren haben, werden ihn durchbohren, während er prophetisch redet.[b]'
  to: 'Und es wird geschehen: Wenn ein Mann weiterhin prophetisch redet,[a] werden sein Vater und seine Mutter, die ihn gezeugt haben, zu ihm sagen: »Du sollst nicht am Leben bleiben, denn du hast im Namen Jahwes Lügen geredet.« Und sein Vater und seine Mutter, die ihn gezeugt haben, werden ihn durchbohren, wenn er prophetisch redet.[b]'
