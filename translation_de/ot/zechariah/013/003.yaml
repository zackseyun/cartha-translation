review_pass:
  verdict: revise
  source_fidelity: Die Grundstruktur, die Wiederholung von Vater und Mutter, die Todesankündigung und das gewaltsame Durchbohren geben den hebräischen Text insgesamt treffend wieder. Korrekturbedarf besteht bei der Modalität von לֹא תִחְיֶה, bei der zu engen Wiedergabe von בְּהִנָּבְאוֹ sowie bei der Darstellung von יֹלְדָיו.
  naturalness: Der Text ist überwiegend modernes, würdiges Standarddeutsch. »Du darfst nicht am Leben bleiben« klingt jedoch primär wie eine Erlaubnisverweigerung statt wie ein richterlicher Ausspruch. »Wenn er prophetisch redet« ist für den zeitlichen Zusammenhang idiomatischer und weniger festlegend als »während«.
  terminology: »Jahwe«, »prophetisch reden«, »im Namen Jahwes« und »durchbohren« sind angemessen. Bei יֹלְדָיו ist »die ihn gezeugt und geboren haben« sachlich unpassend, weil die Form beide Eltern kollektiv bezeichnet, der Vater aber nicht gebiert; »die ihn gezeugt haben« gibt die Elternbeziehung idiomatisch wieder.
  issues:
  - severity: medium
    issue: Die Wiedergabe von יֹלְדָיו als »die ihn gezeugt und geboren haben«
    rationale: Das pluralische Partizip bezieht sich auf Vater und Mutter als seine Eltern bzw. Erzeuger. Die deutsche Verbindung schreibt auch dem Vater das Gebären zu. »Die ihn gezeugt haben« ist idiomatisch und vermeidet diese sachliche Unstimmigkeit.
  - severity: medium
    issue: »Du darfst nicht am Leben bleiben« für לֹא תִחְיֶה
    rationale: Die hebräische Aussage ist ein strenger Urteilsspruch über sein Weiterleben. »Darfst nicht« legt im Deutschen eher eine Erlaubnisfrage nahe. »Du sollst nicht am Leben bleiben« bewahrt den normativ-judiziellen Ton.
  - severity: low
    issue: »während er prophetisch redet« für בְּהִנָּבְאוֹ
    rationale: Die Präposition mit Infinitiv markiert den zeitlichen Anlass bzw. Zusammenhang, ohne zwingend einen fortdauernden Gleichzeitigkeitssinn festzulegen. »wenn er prophetisch redet« wahrt diese Offenheit.
