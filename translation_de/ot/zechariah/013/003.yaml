  text: וְ/הָיָ֗ה כִּֽי יִנָּבֵ֣א אִישׁ֮ עוֹד֒ וְ/אָמְר֣וּ אֵ֠לָי/ו אָבִ֨י/ו וְ/אִמּ֤/וֹ יֹֽלְדָי/ו֙ לֹ֣א תִֽחְיֶ֔ה כִּ֛י שֶׁ֥קֶר דִּבַּ֖רְתָּ בְּ/שֵׁ֣ם יְהוָ֑ה וּ/דְקָרֻ֜/הוּ אָבִ֧י/הוּ וְ/אִמּ֛/וֹ יֹלְדָ֖י/ו בְּ/הִנָּבְאֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/003.yaml
  text: And it will happen that if a man still prophesies[a], his father and his mother who bore him will say to him, ‘You shall not live, because you have spoken lies in the name of Yahweh’[b]; and his father and his mother who bore him will pierce him through when he prophesies.
translation:
  language: de
  text: 'Und es wird geschehen: Wenn ein Mann weiterhin prophetisch redet,[a] werden sein Vater und seine Mutter, die ihn gezeugt haben, zu ihm sagen: »Du sollst nicht am Leben bleiben, denn du hast im Namen Jahwes Lügen geredet.« Und sein Vater und seine Mutter, die ihn gezeugt haben, werden ihn durchbohren, wenn er prophetisch redet.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wenn ein Mann wieder prophetisch redet«. Das hebräische עוֹד kann fortgesetztes oder erneutes Handeln bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »während er prophetisch redet«. Die hebräische Form kann Gleichzeitigkeit oder allgemeiner den zeitlichen Anlass ausdrücken.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: וְהָיָה
  choice: Und es wird geschehen
  rationale: Bewahrt die zukunftsbezogene Einleitungsformel und ihren feierlichen Erzählton, ohne unnötig archaisch zu klingen.
- source_word: כִּי יִנָּבֵא אִישׁ עוֹד
  choice: Wenn ein Mann weiterhin prophetisch redet
  rationale: כִּי führt hier den eintretenden Fall ein; עוֹד bezeichnet im Kontext am ehesten fortgesetztes Handeln. »Prophetisch reden« gibt נבא wieder, ohne die Falschheit bereits in das Verb hineinzulesen.
- source_word: יֹלְדָיו
  choice: die ihn gezeugt und geboren haben
  rationale: Die maskulin-plurale Form kann beide Eltern als diejenigen bezeichnen, denen er seine Geburt verdankt. Die deutsche Paarformel klingt natürlicher als das auf die Mutter beschränkte »die ihn geboren haben« und erhält die konkrete Aussage.
- source_word: לֹא תִחְיֶה
  choice: Du darfst nicht am Leben bleiben
  rationale: Gibt den urteilenden, lebensverneinenden Charakter der Aussage in natürlichem, ernstem Deutsch wieder.
- source_word: שֶׁקֶר דִּבַּרְתָּ
  choice: du hast ... Lügen geredet
  rationale: Bewahrt das Akkusativobjekt שֶׁקֶר und formuliert die Anklage ausdrücklich als falsche Rede.
- source_word: בְּשֵׁם יְהוָה
  choice: im Namen Jahwes
  rationale: Gibt die Präpositionalfügung und den im hebräischen Text stehenden Gottesnamen direkt wieder.
- source_word: וּדְקָרֻהוּ
  choice: werden ihn durchbohren
  rationale: דקר bezeichnet ein Durchstechen beziehungsweise Durchbohren, typischerweise mit einer Waffe; die Härte der Aussage bleibt ungemildert.
- source_word: בְּהִנָּבְאוֹ
  choice: während er prophetisch redet
  rationale: Die Präposition בְּ mit dem Infinitiv bezeichnet hier den zeitlichen Zusammenhang der Handlung mit seinem prophetischen Reden.
theological_decisions:
- issue: Gewaltsames Vorgehen der Eltern gegen den falschen Propheten
  choice: Die Todesankündigung und das Durchbohren werden unmittelbar und ungemildert wiedergegeben.
  alternative: Die Aussage als bloße Verstoßung, soziale Ächtung oder nicht tödliche Verwundung abschwächen.
  rationale: Der hebräische Text verbindet לֹא תִחְיֶה ausdrücklich mit דקר. Eine Übersetzung soll diese Härte weder erklären noch abmildern.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als solcher erkennbar wiedergegeben; die im Deutschen geläufige Form »Jahwe« ist verständlich und würdig.
- issue: Charakter der Prophetie
  choice: Das Verb selbst bleibt neutral; erst die Anklage kennzeichnet die Rede als Lüge.
  alternative: Bereits im ersten Satz »falsch prophezeit« schreiben.
  rationale: נבא bezeichnet das prophetische Reden, während שֶׁקֶר die Falschheit ausdrücklich benennt. Diese Textspannung soll erhalten bleiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von »sein Vater und seine Mutter« bleibt als rhetorisch bedeutsame Wiederaufnahme des Hebräischen erhalten. »Prophetisch reden« vermeidet das im heutigen Deutsch teils auf Vorhersagen verengte Verständnis von »prophezeien«.
