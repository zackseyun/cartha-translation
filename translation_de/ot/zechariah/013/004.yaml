source:
  edition: WLC
  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא יֵבֹ֧שׁוּ הַ/נְּבִיאִ֛ים אִ֥ישׁ מֵ/חֶזְיֹנ֖/וֹ בְּ/הִנָּֽבְאֹת֑/וֹ וְ/לֹ֧א יִלְבְּשׁ֛וּ אַדֶּ֥רֶת שֵׂעָ֖ר לְמַ֥עַן כַּחֵֽשׁ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/004.yaml
  text: And on that day the prophets will each be ashamed of his vision when he prophesies[b][a], and they will not put on a hairy cloak in order to deceive.
translation:
  language: de
  text: Und an jenem Tag wird jeder der Propheten sich wegen seiner Vision schämen, wenn er weissagt. Sie werden keinen Haarmantel[a] anziehen, um zu täuschen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »einen härenen Mantel« – ein raues Obergewand, das mit dem Erscheinungsbild eines Propheten verbunden war.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »um zu lügen«. Das hebräische Verb kann Lüge, Falschheit oder Täuschung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: Und an jenem Tag
  rationale: Gibt die prophetische Zeitformel in natürlichem, gehobenem Standarddeutsch wieder; die Zukunftsaussage wird durch die folgenden Futurformen getragen.
- source_word: יֵבֹשׁוּ הַנְּבִיאִים אִישׁ
  choice: werden sich die Propheten, jeder ..., schämen
  rationale: Bewahrt sowohl die Mehrzahl »die Propheten« als auch die distributive Kraft von אִישׁ. »Sich schämen« lässt offen, ob die Scham vor allem innerlich empfunden oder durch öffentliche Bloßstellung ausgelöst wird.
- source_word: מֵחֶזְיֹנוֹ
  choice: wegen seiner Vision
  rationale: Die Präposition bezeichnet hier den Anlass beziehungsweise Gegenstand der Scham. »Wegen« ist im Deutschen natürlich und wahrt den Bezug der jeweils einzelnen Person auf ihre Vision.
- source_word: בְּהִנָּבְאֹתוֹ
  choice: wenn er weissagt
  rationale: Gibt den temporalen Gebrauch der Präposition mit dem Infinitiv idiomatisch wieder, ohne das Weissagen bereits ausdrücklich als falsch zu bezeichnen.
- source_word: וְלֹא יִלְבְּשׁוּ
  choice: Sie werden keinen ... anziehen
  rationale: »Anziehen« bringt die bewusste Annahme der prophetischen Kleidung klar zum Ausdruck und entspricht dem konkreten Kleidungsverb.
- source_word: אַדֶּרֶת שֵׂעָר
  choice: Mantel aus Haar
  rationale: Bewahrt das konkrete Bild eines aus Haar bestehenden beziehungsweise haarigen Obergewands. Die Formulierung ist verständlicher als das heute seltene »härener Mantel«.
- source_word: לְמַעַן כַּחֵשׁ
  choice: um zu täuschen
  rationale: Die Zweckkonstruktion wird direkt wiedergegeben. כחש kann Lüge, Falschheit oder Täuschung bezeichnen; im Zusammenhang zielt die irreführende prophetische Selbstdarstellung auf Täuschung.
theological_decisions:
- issue: Ob die Propheten ausdrücklich als falsche Propheten bezeichnet werden sollen
  choice: Nur »die Propheten«
  alternative: »die falschen Propheten«
  rationale: Der Zusammenhang verurteilt ihre Prophetie, doch der hebräische Text verwendet hier lediglich das gewöhnliche Wort für »Propheten«. Die Übersetzung lässt das Urteil aus dem Kontext hervorgehen und fügt die Qualifizierung nicht in den Vers ein.
- issue: Ob כחש als Lügen oder Täuschen wiederzugeben ist
  choice: »um zu täuschen« mit Fußnotenalternative
  alternative: »um zu lügen«
  rationale: »Täuschen« erfasst im Kontext die Wirkung des angelegten Prophetengewands; die Fußnote bewahrt die enger am Verb liegende Alternative »lügen«.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur wahrt den distributiven Singular innerhalb des pluralischen Subjekts. Seltene oder konfessionell geprägte Begriffe werden vermieden; die konkrete prophetische Kleidung bleibt sichtbar.
