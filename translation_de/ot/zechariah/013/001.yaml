source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא יִֽהְיֶה֙ מָק֣וֹר נִפְתָּ֔ח לְ/בֵ֥ית דָּוִ֖יד וּ/לְ/יֹשְׁבֵ֣י יְרֽוּשָׁלִָ֑ם לְ/חַטַּ֖את וּ/לְ/נִדָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/001.yaml
  text: On that day a fountain will be opened for the house of David and for the inhabitants of Jerusalem[c][b][a], for sin and for impurity.
translation:
  language: de
  text: An jenem Tag wird für das Haus Davids und für die Bewohner Jerusalems eine Quelle[a] geöffnet werden, zur Reinigung von Sünde[b] und Unreinheit[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Quell“ beziehungsweise „ein Ursprung“.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann auch „Sündopfer“ bedeuten; das Bild der Reinigung legt hier jedoch „Sünde“ nahe.
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Wort kann speziell die mit der Menstruation verbundene Unreinheit oder allgemeiner kultische Unreinheit bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Die feste prophetische Zeitformel wird in natürlichem, gehobenem Standarddeutsch wiedergegeben und behält ihren vorausweisenden Charakter.
- source_word: יִהְיֶה מָקוֹר נִפְתָּח
  choice: wird … eine Quelle geöffnet werden
  rationale: „Quelle“ gibt מָקוֹר als Ursprung fließenden Wassers wieder. Das deutsche Futurpassiv bewahrt sowohl die Zukunftsaussage als auch den passiven Sinn von נִפְתָּח und klingt natürlicher als eine wörtliche nominale Fügung.
- source_word: לְבֵית דָּוִיד
  choice: für das Haus Davids
  rationale: לְ bezeichnet hier die Begünstigten beziehungsweise diejenigen, denen die Quelle zugänglich gemacht wird. Der Genitiv „Davids“ ist im Deutschen natürlich.
- source_word: וּלְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: und für die Bewohner Jerusalems
  rationale: Das substantivierte Partizip bezeichnet die in Jerusalem Wohnenden als Gruppe; „Bewohner“ ist klar und gegenwärtig.
- source_word: לְחַטָּאת
  choice: zur Reinigung von Sünde
  rationale: חַטָּאת kann „Sünde“ oder „Sündopfer“ bedeuten. In Verbindung mit der Quelle und נִדָּה liegt hier die Beseitigung von Sünde nahe. „Zur Reinigung von“ macht die Zweckbeziehung im Deutschen verständlich, ohne den im Bild offenbleibenden Vorgang dogmatisch zu bestimmen.
- source_word: וּלְנִדָּה
  choice: und Unreinheit
  rationale: נִדָּה kann enger die menstruell bedingte Unreinheit und weiter kultische Unreinheit bezeichnen. Der allgemeinere Ausdruck „Unreinheit“ wahrt diese Spannweite im Haupttext.
theological_decisions:
- issue: Bedeutung und Wirkungsweise der prophetischen Quelle
  choice: Das Bild einer für Sünde und Unreinheit bereitgestellten reinigenden Quelle bleibt ohne nähere dogmatische Auslegung stehen.
  alternative: Die Quelle ausdrücklich als Sühne, Blut oder messianisches Reinigungsmittel bestimmen.
  rationale: Der Vers verheißt Reinigung für das Haus Davids und die Bewohner Jerusalems, nennt aber den theologischen Mechanismus nicht ausdrücklich. Eine weitergehende Identifikation würde spätere Auslegung in den Haupttext eintragen.
- issue: Mehrdeutigkeit von חַטָּאת
  choice: Im Haupttext „Sünde“, mit Hinweis auf „Sündopfer“ in der Fußnote.
  alternative: Im Haupttext „Sündopfer“.
  rationale: Das Quellenbild und die Verbindung mit Unreinheit sprechen hier stärker für das zu beseitigende Übel als für den Opfergegenstand; die echte lexikalische Alternative wird dennoch offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hebt zunächst die Begünstigten der Verheißung hervor; „zur Reinigung von“ verdeutlicht die im Deutschen sonst schwer verständliche Zweckbeziehung, ohne die Quelle konfessionell oder christologisch auszudeuten.
