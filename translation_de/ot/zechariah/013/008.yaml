id: ZEC.13.8
reference: Zechariah 13:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הָיָ֤ה בְ/כָל הָ/אָ֨רֶץ֙ נְאֻם יְהוָ֔ה פִּֽי שְׁנַ֣יִם בָּ֔/הּ יִכָּרְת֖וּ יִגְוָ֑עוּ וְ/הַ/שְּׁלִשִׁ֖ית יִוָּ֥תֶר בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/008.yaml
  text: And it will happen in all the land, declares the LORD, that two-thirds in it will be cut off and die, but one-third will be left in it.
translation:
  language: de
  text: 'Und im ganzen Land wird es geschehen, spricht der HERR: Zwei Drittel darin werden ausgerottet und sterben, aber ein Drittel wird darin übrig bleiben.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְכָל־הָאָרֶץ
  choice: im ganzen Land
  rationale: אֶרֶץ kann »Land« oder »Erde« bedeuten. Im unmittelbaren Gerichtskontext ist »Land« die naheliegende, zugleich nicht übermäßig präzisierende Wiedergabe.
- source_word: נְאֻם יְהוָה
  choice: spricht der HERR
  rationale: Die feste prophetische Formel wird idiomatisch wiedergegeben; der Gottesname JHWH erscheint gemäß verbreiteter deutscher Bibelkonvention als HERR.
- source_word: פִּי שְׁנַיִם
  choice: zwei Drittel
  rationale: Wörtlich bezeichnet die Wendung »den Anteil von zwei«; im Gegenüber zu הַשְּׁלִשִׁית, »dem Drittel«, ist »zwei Drittel« eindeutig gemeint.
- source_word: יִכָּרְתוּ
  choice: werden ausgerottet
  rationale: Das Verb כרת bedeutet hier, dass Menschen durch Gericht beseitigt bzw. vernichtet werden; »ausgerottet« bewahrt die Härte der Aussage.
- source_word: יִגְוָעוּ
  choice: sterben
  rationale: גוע bezeichnet das Sterben bzw. Verscheiden. »sterben« ist klar, natürlich und vermeidet eine unnötige Bedeutungssteigerung.
- source_word: יִוָּתֶר
  choice: wird übrig bleiben
  rationale: Die Nifal-Form bezeichnet das Verbleiben eines Restes; der Singular entspricht dem kollektiven »ein Drittel«.
theological_decisions:
- issue: Geografischer Umfang von הָאָרֶץ
  choice: Land
  alternative: Erde
  rationale: Der hebräische Ausdruck ist grundsätzlich mehrdeutig. »Land« passt zum Sacharjakontext, ohne im Text eine nicht ausdrücklich genannte geografische Bezeichnung wie »Israel« einzuführen.
- issue: Verhältnis von »ausgerottet« und »sterben«
  choice: Beide Verben werden wiedergegeben
  alternative: zu einer einzigen Vernichtungsaussage zusammenziehen
  rationale: Die hebräische Reihung יִכָּרְתוּ יִגְוָעוּ wird bewahrt, damit Nachdruck und mögliche Bedeutungsnuance nicht verloren gehen.
- issue: Bezeichnung des Gottesnamens
  choice: der HERR
  alternative: JHWH / Jahwe
  rationale: Die traditionelle typografische Wiedergabe macht kenntlich, dass im Ausgangstext der Eigenname יהוה steht, und entspricht einer weithin verständlichen deutschen Bibelkonvention.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer prophetischer Satzstruktur. Die Wiederholung von »darin« bildet die zweimalige feminine Rückverweisung בָּהּ auf das Land ab; der Doppelpunkt macht die folgende Gerichtsankündigung natürlich lesbar.
