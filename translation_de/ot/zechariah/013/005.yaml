source:
  edition: WLC
  text: וְ/אָמַ֕ר לֹ֥א נָבִ֖יא אָנֹ֑כִי אִישׁ עֹבֵ֤ד אֲדָמָה֙ אָנֹ֔כִי כִּ֥י אָדָ֖ם הִקְנַ֥/נִי מִ/נְּעוּרָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/005.yaml
  text: And he will say[a], ‘I am not a prophet; I am a man who works the ground, for the land has been my possession from my youth.’
translation:
  language: de
  text: 'Und er wird sagen: »Ich bin kein Prophet. Ich bin ein Mann, der den Boden bearbeitet; denn ein Mann hat mich von meiner Jugend an erworben[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »hat mich von meiner Jugend an gekauft« oder »hat mich seit meiner Jugend in Besitz gehabt«. Das hebräische Verb kann erwerben, kaufen oder besitzen bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  choice: Und er wird sagen
  rationale: Das Waw mit Perfekt steht im prophetischen Zusammenhang für ein zukünftiges Geschehen; der Kontext beschreibt, was »an jenem Tag« geschehen wird.
- source_word: נָבִיא
  choice: Prophet
  rationale: Die übliche und kontextuell eindeutige Wiedergabe; der Sprecher bestreitet, ein Prophet zu sein.
- source_word: אִישׁ עֹבֵד אֲדָמָה
  choice: ein Mann, der den Ackerboden bearbeitet
  rationale: Die Formulierung bewahrt sowohl אִישׁ als auch den partizipialen Sinn von עֹבֵד und gibt אֲדָמָה hier konkret landwirtschaftlich wieder.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet eine Begründung beziehungsweise Erläuterung der behaupteten Lebensstellung ein.
- source_word: אָדָם
  choice: ein Mensch
  rationale: Das maskuline Singularsubstantiv bezeichnet hier am unmittelbarsten einen Menschen. »Ein Mensch« hält zugleich die auffällige Wiederholung beziehungsweise Nähe zu אֲדָמָה sichtbar, ohne beide Wörter gleichzusetzen.
- source_word: הִקְנַנִי
  choice: hat mich … erworben
  rationale: Der Hifil von קנה kann erwerben, kaufen oder in Besitz bekommen beziehungsweise halten bedeuten. »Erworben« gibt den lexikalischen Kern wieder, ohne das genaue soziale Verhältnis festzulegen.
- source_word: מִנְּעוּרָי
  choice: von meiner Jugend an
  rationale: Direkte, idiomatische Wiedergabe des zeitlichen Ausdrucks; sie bezeichnet einen in der Jugend beginnenden Zeitraum.
theological_decisions:
- issue: Wahrheitsgehalt der behaupteten nichtprophetischen Identität
  choice: Die Aussage wird ohne Wertung als Selbstbeschreibung wiedergegeben.
  alternative: Der Sprecher könnte ein falscher Prophet sein, der seine Vergangenheit verheimlicht, oder ein ehemaliger Prophet, der sich von seinem früheren Anspruch lossagt.
  rationale: Der unmittelbare Zusammenhang legt Scham und Verleugnung nahe, doch der Vers entscheidet nicht ausdrücklich, ob die Aussage aufrichtig oder ausweichend ist.
- issue: Soziales Verhältnis in הִקְנַנִי
  choice: Die breite Erwerbsbedeutung wird im Haupttext bewahrt und durch eine Fußnote erläutert.
  alternative: »kaufte mich«, »nahm mich in Besitz«, »nahm mich in Dienst« oder eine auf Landbesitz bezogene Deutung
  rationale: Der hebräische Wortlaut lässt die genaue Art des Erwerbs- oder Besitzverhältnisses offen. Eine ausdrückliche Festlegung auf Sklaverei, Anstellung oder Ausbildung wäre stärker interpretierend als der Ausgangstext.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Schlussaussage bleibt bewusst ungewöhnlich, weil auch der hebräische Wortlaut אָדָם הִקְנַנִי auffällig und in seiner genauen sozialen Bedeutung mehrdeutig ist. »Ackerboden« verdeutlicht den landwirtschaftlichen Sinn von אֲדָמָה und unterscheidet ihn von אָדָם, »Mensch«.
