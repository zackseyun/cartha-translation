source:
  edition: WLC
  text: כִּ֣י כֹ֣ה אָמַר֮ יְהוָ֣ה צְבָאוֹת֒ אַחַ֣ר כָּב֔וֹד שְׁלָחַ֕/נִי אֶל הַ/גּוֹיִ֖ם הַ/שֹּׁלְלִ֣ים אֶתְ/כֶ֑ם כִּ֚י הַ/נֹּגֵ֣עַ בָּ/כֶ֔ם נֹגֵ֖עַ בְּ/בָבַ֥ת עֵינֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/012.yaml
  text: 'For thus says Yahweh of hosts: After glory he has sent me against the nations that plunder you[b][a], for whoever touches you touches the pupil of his eye.'
translation:
  language: de
  text: 'Denn so spricht Jahwe der Heerscharen: Der Herrlichkeit nach hat er mich zu den Nationen gesandt, die euch ausplündern[a]; denn wer euch anrührt, rührt die Pupille seines Auges an.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Um der Herrlichkeit willen hat er mich zu den Nationen gesandt, die euch ausplündern.« Die hebräische Wendung »der Herrlichkeit nach« ist schwierig; sie kann einen Zweck, eine zeitliche Folge oder einen Bezug auf Ehre beziehungsweise Herrlichkeit ausdrücken.'
    reason: alternative_reading
  - marker: b
    text: 'Oder traditionell: »seinen Augapfel«. Das hebräische Bild bezeichnet die Pupille als den besonders empfindlichen und sorgfältig geschützten Teil des Auges.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als Gottes Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: צְבָאוֹת
  choice: der Heerscharen
  rationale: Die geläufige, würdige Wiedergabe des göttlichen Titels bewahrt dessen umfassenden, auch himmlisch-militärischen Klang, ohne ihn auf menschliche Armeen zu verengen.
- source_word: אַחַר כָּבוֹד
  choice: Der Herrlichkeit nach
  rationale: Die bewusst ungewöhnliche Formulierung bleibt nahe am schwierigen und elliptischen Hebräisch und legt nicht eindeutig fest, ob Zweck, zeitliche Folge oder Bezug auf Ehre beziehungsweise Herrlichkeit gemeint ist.
- source_word: שְׁלָחַנִי
  choice: hat er mich ... gesandt
  rationale: Das deutsche Perfekt gibt die vollzogene Sendung mit Gegenwartsbezug natürlich wieder; das Pronomen bleibt wie im Hebräischen unaufgelöst.
- source_word: אֶל הַגּוֹיִם
  choice: zu den Nationen
  rationale: אֶל bezeichnet primär die Richtung »zu«; der feindliche Zusammenhang ergibt sich bereits aus dem Ausplündern und muss nicht in die Präposition hineingelesen werden.
- source_word: הַשֹּׁלְלִים אֶתְכֶם
  choice: die euch ausplündern
  rationale: Das Partizip von שׁלל bezeichnet das Nehmen von Beute; »ausplündern« ist gegenwärtiges, klares Deutsch.
- source_word: הַנֹּגֵעַ בָּכֶם ... נֹגֵעַ
  choice: wer euch anrührt, rührt ... an
  rationale: Die Wiederholung desselben hebräischen Verbs wird zur rhetorischen Wirkung auch im Deutschen bewahrt.
- source_word: בְּבָבַת עֵינוֹ
  choice: seinen Augapfel
  rationale: »Augapfel« ist die etablierte deutsche Entsprechung des Bildes für den besonders empfindlichen und geschützten Teil des Auges; eine Fußnote erläutert die Bedeutung.
theological_decisions:
- issue: Bezug der ersten Person in »hat er mich gesandt« und des Possessivpronomens in »seinen Augapfel«
  choice: Die Pronomen und der Sprecherwechsel bleiben ohne ausdrückliche Identifizierung stehen.
  alternative: Den Sprecher ausdrücklich als Propheten, Engelboten oder göttliche Gestalt und das Auge ausdrücklich als Gottes Auge bestimmen.
  rationale: Der hebräische Text enthält einen auffälligen Wechsel zwischen Jahwes Rede, der Sendung eines Ich-Sprechers und der dritten Person. Eine eindeutige Identifizierung würde die genuine theologische Spannung auflösen.
- issue: Deutung von אַחַר כָּבוֹד
  choice: Die offene Formulierung »Der Herrlichkeit nach« wird im Haupttext bewahrt.
  alternative: »Um der Herrlichkeit willen«, »Nach der Herrlichkeit« oder »Der Ehre wegen«
  rationale: Die Syntax ist schwierig und kann Zweck, Folge oder Beziehung zu Ehre beziehungsweise Herrlichkeit ausdrücken. Die Fußnote nennt die wesentlichen Möglichkeiten, ohne eine davon dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Wendung »Der Herrlichkeit nach« ist wegen der Mehrdeutigkeit des hebräischen Ausgangstextes bewusst beibehalten. »Heerscharen« und »Augapfel« sind etablierte biblische Ausdrücke, die im Deutschen noch verständlich sind.
