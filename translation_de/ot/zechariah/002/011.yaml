    rationale: Die Fußnote behauptet, בְּ könne örtlich „in“ bedeuten, obwohl an dieser Stelle kein בְּ vorliegt. Sie sollte entfernt werden, statt eine morphologisch falsche Alternative zu dokumentieren.
