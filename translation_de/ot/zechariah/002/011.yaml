  naturalness: „Auf, Zion! Rette dich“ ist knapp, würdig und im modernen Standarddeutsch gut verständlich. „du Bewohnerin der Tochter Babel“ bildet die hebräische Konstruktion klarer und natürlicher ab als „die du bei der Tochter Babel wohnst“.
  terminology: „Zion“ und „Tochter Babel“ bewahren die poetisch-prophetische Personifikation. „Bewohnerin“ erhält den femininen Singular, ohne die Anrede kollektiv oder theologisch weiter auszudeuten.
