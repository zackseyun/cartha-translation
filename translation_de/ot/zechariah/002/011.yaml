  text: ה֥וֹי צִיּ֖וֹן הִמָּלְטִ֑י יוֹשֶׁ֖בֶת בַּת בָּבֶֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/011.yaml
  text: Up[a], Zion! Escape, you who dwell with Daughter Babylon.
translation:
  language: de
  text: Auf, Zion! Rette dich, du Bewohnerin der Tochter Babel!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹי
  choice: Auf!
  rationale: Die Interjektion leitet hier keinen Klageruf ein, sondern einen dringlichen Aufruf zum Handeln. „Auf!“ gibt diese Funktion in würdigem, verständlichem Deutsch wieder.
- source_word: צִיּוֹן
  choice: Zion
  rationale: Der Eigenname wird in seiner etablierten deutschen Form wiedergegeben und bezeichnet hier die personifizierte Stadt beziehungsweise das mit ihr verbundene Volk.
- source_word: הִמָּלְטִי
  choice: Rette dich
  rationale: Der feminine singularische Nifal-Imperativ von מלט fordert dazu auf, sich in Sicherheit zu bringen. „Rette dich“ bewahrt sowohl die reflexive Form als auch den Gedanken des Entrinnens, ohne die Art der Flucht näher festzulegen.
- source_word: יוֹשֶׁבֶת
  choice: die du … wohnst
  rationale: Das feminine singularische Partizip bestimmt die angeredete Zion näher. Ein Relativsatz klingt im modernen Deutschen natürlich und wahrt die direkte Anrede.
- source_word: בַּת בָּבֶל
  choice: Tochter Babel
  rationale: Die konstruktive Verbindung bedeutet wörtlich „Tochter Babels/Babylons“. „Tochter Babel“ erhält die prophetische Personifikation und folgt der im Deutschen etablierten Namensform „Babel“.
theological_decisions:
- issue: Bezug der femininen singularischen Anrede
  choice: Zion wird als Frau personifiziert und als diejenige angeredet, die bei der Tochter Babel wohnt.
  alternative: Die Formulierung kann kollektiv auf die zu Zion gehörenden Verbannten bezogen werden; בַּת־בָּבֶל kann außerdem räumlich als „in der Tochter Babel“ verstanden werden.
  rationale: Die femininen Singularformen verbinden צִיּוֹן unmittelbar mit יוֹשֶׁבֶת. Die Übersetzung wahrt diese grammatische Personifikation und löst sie nicht erklärend in „ihr Bewohner Zions“ auf.
- issue: Bedeutung der Präposition בְּ bei בַּת־בָּבֶל
  choice: bei der Tochter Babel
  alternative: in der Tochter Babel
  rationale: „Bei“ lässt sowohl Aufenthalt im Macht- und Lebensbereich Babylons als auch räumliches Wohnen anklingen und vermeidet die im Deutschen ungewöhnliche Wendung „in der Tochter Babel“. Die wörtlichere Möglichkeit wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Dringlichkeit des hebräischen Aufrufs sowie die feminine Personifikation Zions und Babels bleiben erhalten.
