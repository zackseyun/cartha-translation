id: ZEC.2.10
reference: Zechariah 2:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: ה֣וֹי ה֗וֹי וְ/נֻ֛סוּ מֵ/אֶ֥רֶץ צָפ֖וֹן נְאֻם יְהוָ֑ה כִּ֠י כְּ/אַרְבַּ֞ע רוּח֧וֹת הַ/שָּׁמַ֛יִם פֵּרַ֥שְׂתִּי אֶתְ/כֶ֖ם נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/010.yaml
  text: Up! Up! Flee from the land of the north[a], declares Yahweh, for I have spread you abroad to the four winds of the heavens[b], declares Yahweh.
translation:
  language: de
  text: Auf! Auf![a] Flieht aus dem Land des Nordens, erklärt Jahwe; denn ich habe euch in alle vier Himmelsrichtungen zerstreut[b], erklärt Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionell wird der hebräische Ausruf auch mit „He! He!“ wiedergegeben. Hier ruft er jedoch dringend zum Aufbruch auf.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „denn wie die vier Winde des Himmels habe ich euch ausgebreitet“. Das Hebräische kann entweder als Vergleich („wie die vier Winde“) oder als Richtungsangabe („in alle vier Himmelsrichtungen“) verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹי הוֹי
  choice: Auf! Auf!
  rationale: Die doppelte Interjektion ist hier kein Klageruf, sondern ein dringender Aufruf zum Handeln. „Auf! Auf!“ gibt Dringlichkeit und Wiederholung in natürlichem, würdigem Deutsch wieder.
- source_word: וְנֻסוּ
  choice: Flieht
  rationale: Der pluralische Imperativ von נוּס fordert zur sofortigen Flucht auf. „Flieht“ ist knapp und bewahrt die Dringlichkeit.
- source_word: מֵאֶרֶץ צָפוֹן
  choice: aus dem Land des Nordens
  rationale: Die Formulierung folgt der hebräischen Konstruktion und bewahrt zugleich ihre geografische und heilsgeschichtliche Resonanz.
- source_word: נְאֻם יְהוָה
  choice: erklärt Jahwe
  rationale: Die feste prophetische Botenformel wird klar und gewichtig wiedergegeben; der Gottesname יְהוָה erscheint als „Jahwe“.
- source_word: כִּי
  choice: denn
  rationale: „Denn“ leitet den im Hebräischen angegebenen Grund für die Aufforderung ein.
- source_word: כְּאַרְבַּע רוּחוֹת הַשָּׁמַיִם
  choice: in alle vier Himmelsrichtungen
  rationale: Die idiomatische deutsche Wendung vermittelt die weltweite Zerstreuung. Die formale Möglichkeit eines Vergleichs aufgrund des Präfixes כְ wird in der Fußnote offengehalten.
- source_word: פֵּרַשְׂתִּי אֶתְכֶם
  choice: ich habe euch … zerstreut
  rationale: פרשׂ bezeichnet ein Ausbreiten oder Ausspannen. Im Zusammenhang mit Menschen und den vier Himmelsrichtungen drückt „zerstreut“ das Bild verständlich aus, ohne die räumliche Weite zu verlieren.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den offenbarten Bundesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Verhältnis von כְּאַרְבַּע רוּחוֹת und פֵּרַשְׂתִּי
  choice: 'Richtungsangabe: „in alle vier Himmelsrichtungen zerstreut“'
  alternative: 'Vergleich: „wie die vier Winde des Himmels ausgebreitet“'
  rationale: Die Richtungsangabe ergibt im Deutschen einen klaren, kontextgerechten Sinn; das hebräische כְ lässt jedoch auch eine vergleichende Auffassung zu, die deshalb in der Fußnote bewahrt wird.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Die knappe Doppelung „Auf! Auf!“ und der Imperativ erhalten den dringenden Charakter; das Semikolon gliedert Aufforderung und Begründung.
