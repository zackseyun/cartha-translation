lexical_decisions:
- source_word: וָאֶשָּׂא אֶת־עֵינַי
  choice: ich erhob meine Augen
  rationale: Bewahrt die hebräische Wendung für das bewusste Hinblicken und bleibt im Deutschen verständlich und würdevoll.
- source_word: וָאֵרֶא
  choice: und sah
  rationale: Gibt die fortlaufende Erzählbewegung knapp wieder; das Subjekt ist durch das vorangehende „ich“ eindeutig.
- source_word: וְהִנֵּה
  choice: und siehe
  rationale: Erhält die aufmerksamkeitslenkende, anschauliche Kraft der prophetischen Visionssprache.
- source_word: אַרְבַּע
  choice: vier
  rationale: Direkte Wiedergabe der Kardinalzahl.
- source_word: קְרָנוֹת
  choice: Hörner
  rationale: Bewahrt das konkrete Symbol der Vision, statt seine mögliche Bedeutung bereits in die Übersetzung einzutragen.
theological_decisions:
- issue: Symbolik der vier Hörner in der prophetischen Vision
  choice: Das Bild „vier Hörner“ bleibt im Haupttext stehen.
  alternative: vier Mächte
  rationale: Die Bedeutung des Visionssymbols wird erst im folgenden Zusammenhang entfaltet. Eine deutende Übersetzung würde die Bildsprache vorzeitig auflösen.
translation_notes:
  register: Modernes Standarddeutsch mit würdevoller prophetischer Diktion. „Und siehe“ ist bewusst gehoben, aber in biblischer Visionssprache geläufig. Der Gedankenstrich markiert den Übergang vom Sehen zur eindringlichen Präsentation des Visionsbildes.
