  text: And I lifted up my eyes and saw[a], and behold, four horns.
translation:
  language: de
  text: 'Und ich erhob meine Augen und sah – und siehe: vier Hörner.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vier Mächte“. Im Hebräischen steht „Hörner“, ein verbreitetes biblisches Bild für Stärke oder Herrschaftsmacht; im Haupttext bleibt das wörtliche Bild erhalten.'
