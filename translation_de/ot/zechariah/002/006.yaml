    issue: „um festzustellen“ für לִרְאוֹת
    rationale: Die Wiedergabe konkretisiert das einfache „sehen“ zu einem ermittelnden Feststellen. Eine nähere Formulierung bewahrt die sprachliche und funktionale Offenheit des hebräischen Verbs.
  - severity: low
    issue: „Ich will Jerusalem vermessen“ für den Zweckinfinitiv
    rationale: Die Formulierung ist verständlich, macht die Aussage aber ausdrücklich volitional. Eine bloße Infinitivantwort gibt die hebräische Konstruktion direkter wieder.
