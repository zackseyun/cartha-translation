  verdict: revise
  source_fidelity: Die Frage nach dem Ziel („Wohin gehst du?“) und das Vermessen Jerusalems sind korrekt wiedergegeben. Der Zweckinfinitiv לִרְאוֹת bedeutet jedoch zunächst „um zu sehen“; „um festzustellen“ legt den Vorgang stärker als Ermittlung bzw. Schlussfolgerung aus. Auch „Ich will“ ist möglich, fügt aber eine ausdrückliche Willensmodalität hinzu, die der hebräische Infinitiv nicht selbst markiert.
  naturalness: Der Entwurf ist flüssiges modernes Standarddeutsch. Die Infinitivantwort „Um Jerusalem zu vermessen und zu sehen ...“ ist im gegebenen Frage-Antwort-Zusammenhang ebenso natürlich und zugleich näher am Hebräischen.
  terminology: „Jerusalem“ und „vermessen“ sind treffend. „wie breit und wie lang es ist“ gibt die parallelen Maßangaben idiomatisch und sachgerecht wieder.
  issues:
