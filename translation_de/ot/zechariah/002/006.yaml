base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/006.yaml
  text: And I said[a], “Where are you going?” And he said to me, “To measure Jerusalem[b], to see how wide it is and how long it is.”
translation:
  language: de
  text: 'Und ich fragte: „Wohin gehst du?“ Er antwortete mir: „Um Jerusalem zu vermessen und zu sehen, wie breit und wie lang es ist.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֹמַר
  choice: Und ich fragte
  rationale: Das häufige hebräische „ich sagte“ leitet hier unmittelbar eine Frage ein; im natürlichen modernen Deutsch gibt „ich fragte“ die Sprechhandlung präzise wieder.
- source_word: אָ֖נָה אַתָּ֣ה הֹלֵ֑ךְ
  choice: Wohin gehst du?
  rationale: אָנָה fragt nach dem Ziel einer Bewegung. „Wohin gehst du?“ bewahrt die Richtung und entspricht natürlichem Deutsch.
- source_word: לָמֹד֙ אֶת־יְר֣וּשָׁלִַ֔ם
  choice: Ich will Jerusalem vermessen
  rationale: מדד bezeichnet das Messen von Ausdehnung. „Vermessen“ passt bei einer Stadt besonders gut; die deutsche Konstruktion mit „ich will“ gibt den elliptischen hebräischen Zweckinfinitiv als Antwort auf die Frage idiomatisch wieder.
- source_word: לִרְא֥וֹת
  choice: um festzustellen
  rationale: 'ראה bedeutet wörtlich „sehen“, bezeichnet hier aber den Zweck der Vermessung: die Abmessungen festzustellen. Diese Wiedergabe ist im Deutschen klar und natürlich.'
- source_word: כַּמָּה רָחְבָּהּ וְכַמָּה אָרְכָּהּ
  choice: wie breit und wie lang es ist
  rationale: Das Hebräische sagt wörtlich „wie viel ihre Breite und wie viel ihre Länge“. Die gewählte Form bewahrt beide Dimensionen in idiomatischem Deutsch; das Pronomen „es“ bezieht sich grammatisch auf Jerusalem.
