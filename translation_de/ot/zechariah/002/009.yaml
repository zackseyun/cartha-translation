source:
  edition: WLC
  text: וַ/אֲנִ֤י אֶֽהְיֶה לָּ/הּ֙ נְאֻם יְהוָ֔ה ח֥וֹמַת אֵ֖שׁ סָבִ֑יב וּ/לְ/כָב֖וֹד אֶֽהְיֶ֥ה בְ/תוֹכָֽ/הּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/009.yaml
  text: And I myself will be for her a wall of fire all around[a], declares Yahweh, and I will be glory in her midst.
translation:
  language: de
  text: „Und ich selbst werde ihr ringsum eine Mauer aus Feuer sein“, spricht Jahwe, „und ich werde in ihrer Mitte Herrlichkeit sein[a].“
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und ich werde ihr in ihrer Mitte zur Herrlichkeit sein.“ Die hebräische Konstruktion kann prädikativ („Herrlichkeit sein“) oder mit stärkerer Geltung des ל („zur Herrlichkeit sein“) verstanden werden.'
    reason: syntaktische und lexikalische Alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Und ich selbst
  rationale: Das selbstständige Pronomen אֲנִי hebt das bereits in der Verbform enthaltene Subjekt hervor; „ich selbst“ gibt diese Betonung natürlich wieder. וַ führt die Zusage weiter.
- source_word: אֶהְיֶה
  choice: werde … sein
  rationale: Der Qal-Imperfekt 1. Person Singular von היה bezeichnet hier in beiden Vorkommen eine zukünftige Zusage.
- source_word: לָהּ
  choice: ihr … sein
  rationale: Das ל bei היה bezeichnet die Beziehung zur personifizierten Stadt. Der deutsche Dativ bewahrt die feminine Bezugnahme und drückt aus, was Jahwe für sie sein wird.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Die feste prophetische Botenformel wird würdig und im modernen Bibeldeutsch verständlich wiedergegeben; der Gottesname bleibt als „Jahwe“ erhalten.
- source_word: חוֹמַת אֵשׁ
  choice: eine Mauer aus Feuer
  rationale: Die Constructusverbindung bezeichnet eine schützende Mauer aus Feuer und wird ohne Abschwächung des Bildes wiedergegeben.
- source_word: סָבִיב
  choice: ringsum
  rationale: „Ringsum“ gibt die vollständige Umfassung prägnant und natürlich wieder.
- source_word: וּלְכָבוֹד
  choice: und … Herrlichkeit
  rationale: Das Prädikatsnomen כָבוֹד bleibt als substantivische, theologisch dichte Aussage erhalten. Das ל kann prädikativ verstanden werden; die ungewöhnliche Formulierung wird nicht zu „herrlich“ verflacht.
- source_word: בְתוֹכָהּ
  choice: in ihrer Mitte
  rationale: Die Form bezeichnet das Innere beziehungsweise Zentrum der Stadt und bewahrt durch „ihrer“ deren feminine Personifikation.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Feminine Personifikation Jerusalems/Zions
  choice: ihr / ihrer
  alternative: ihm / darin; ausdrückliche Ergänzung „Jerusalem“
  rationale: Die femininen Suffixe beziehen sich auf die personifizierte Stadt. Die feminine Referenz bewahrt die Bildsprache, ohne einen im Vers nicht wiederholten Namen einzufügen.
- issue: Prädikative Deutung von לְכָבוֹד
  choice: ich werde … Herrlichkeit sein
  alternative: ich werde ihr … zur Herrlichkeit sein; ich werde eine Herrlichkeit sein
  rationale: Die knappe hebräische Konstruktion lässt offen, ob כָבוֹד als unbestimmtes Prädikatsnomen oder das ל stärker als Zweck beziehungsweise Wirkung zu verstehen ist. Der Haupttext bewahrt die markante Identifikation Jahwes mit der Herrlichkeit; die Fußnote nennt die wesentliche syntaktische Alternative.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede macht die göttliche Zusage klar, „ringsum“ hält das Schutzbild knapp, und die bewusst ungewöhnliche Wendung „Herrlichkeit sein“ bewahrt die Dichte und Offenheit des Hebräischen.
