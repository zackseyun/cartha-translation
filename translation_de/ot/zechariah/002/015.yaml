id: ZEC.2.15
reference: Zechariah 2:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/נִלְווּ֩ גוֹיִ֨ם רַבִּ֤ים אֶל יְהוָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא וְ/הָ֥יוּ לִ֖/י לְ/עָ֑ם וְ/שָׁכַנְתִּ֣י בְ/תוֹכֵ֔/ךְ וְ/יָדַ֕עַתְּ כִּי יְהוָ֥ה צְבָא֖וֹת שְׁלָחַ֥/נִי אֵלָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/015.yaml
  text: And many nations will join themselves to Yahweh in that day[a], and they will be my people. And I will dwell in your midst[b], and you will know that Yahweh of Armies has sent me to you.
translation:
  language: de
  text: Und an jenem Tag werden sich viele Völker dem HERRN anschließen und mein Volk sein. Und ich werde in deiner Mitte wohnen, und du wirst erkennen, dass der HERR der Heerscharen mich zu dir gesandt hat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wer mit „mich“ gemeint ist, wird im hebräischen Text nicht ausdrücklich gesagt.
    reason: Die bemerkenswerte Sprecherambiguität soll sichtbar bleiben, ohne sie im Haupttext aufzulösen.
lexical_decisions:
- source_word: וְנִלְווּ
  choice: werden sich … anschließen
  rationale: Das Nifal von לוה bezeichnet hier den Anschluss beziehungsweise die Hinwendung zu jemandem. Die reflexive deutsche Form klingt natürlich und lässt die freiwillige Zugehörigkeit erkennen.
- source_word: גוֹיִם רַבִּים
  choice: viele Völker
  rationale: גוֹיִם bezeichnet hier Völker beziehungsweise Nationen; „Völker“ gibt den internationalen Umfang wieder, ohne einen späteren Juden-Heiden-Gegensatz einzutragen.
- source_word: אֶל יְהוָה
  choice: dem HERRN
  rationale: Die Verbindung mit לוה verlangt im Deutschen idiomatisch den Dativ bei „sich jemandem anschließen“. Der Gottesname wird in der im Deutschen üblichen ehrerbietigen Form „HERR“ wiedergegeben.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Dies ist eine natürliche und zugleich würdige Wiedergabe der prophetischen Zeitformel.
- source_word: וְהָיוּ לִי לְעָם
  choice: und mein Volk sein
  rationale: Die hebräische Konstruktion drückt die Bundeszugehörigkeit aus. Der Singular „Volk“ bleibt trotz des pluralischen Subjekts erhalten und bewahrt die Vorstellung einer gemeinsamen Bundesgemeinschaft.
- source_word: וְשָׁכַנְתִּי בְתוֹכֵךְ
  choice: Und ich werde in deiner Mitte wohnen
  rationale: שׁכן bedeutet wohnen beziehungsweise sich niederlassen. „In deiner Mitte“ bewahrt den feminin-singularischen Bezug auf die zuvor angeredete Zionstochter.
- source_word: וְיָדַעַתְּ
  choice: und du wirst erkennen
  rationale: „Erkennen“ passt im Deutschen gut zur prophetischen Erkenntnisformel und gibt die feminin-singularische Anrede wieder.
- source_word: יְהוָה צְבָאוֹת
  choice: der HERR der Heerscharen
  rationale: „Heerscharen“ ist im deutschen Bibelregister verständlich und traditionsnah und bildet צְבָאוֹת genauer ab als eine abstrakte Umschreibung.
- source_word: שְׁלָחַנִי
  choice: mich … gesandt hat
  rationale: Das deutsche Perfekt gibt die abgeschlossene Sendung wieder, deren Bedeutung die Angeredete künftig erkennen wird.
- source_word: אֵלַיִךְ
  choice: zu dir
  rationale: Die Form ist feminin Singular. Das Pronomen bewahrt den Textwortlaut, ohne die kontextuelle Adressatin ausdrücklich einzusetzen.
theological_decisions:
- issue: Identität des Sprechers in „der HERR der Heerscharen mich zu dir gesandt hat“
  choice: Das unbestimmte „mich“ bleibt ohne erklärende Identifikation stehen.
  alternative: Den Sprecher ausdrücklich als Engel, Propheten oder göttlich-messianische Gestalt bestimmen.
  rationale: Der hebräische Text identifiziert den Sprecher an dieser Stelle nicht ausdrücklich. Die auffällige Spannung zwischen dem redenden Ich und dem sendenden HERRN wird daher nicht durch eine Deutung aufgelöst.
- issue: Singular und Plural in der Bundesformel
  choice: „Viele Völker“ werden kollektiv „mein Volk“.
  alternative: „Sie werden meine Völker sein.“
  rationale: עָם steht im Singular und greift die Bundesformel auf. Die Übersetzung wahrt diese kollektive Einheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischem Klang. Die feminin-singularische Anrede wird durch „deiner“ und „du/dir“ bewahrt; ihr Bezug auf Zion ergibt sich aus dem Zusammenhang. Der Fußnotenmarker steht unmittelbar nach der Aussage, auf deren Sprecherfrage er sich bezieht.
