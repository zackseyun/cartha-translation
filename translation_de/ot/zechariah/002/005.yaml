base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/005.yaml
  text: And I lifted up my eyes and saw[a], and behold, a man, and in his hand a measuring line.
translation:
  language: de
  text: 'Und ich erhob meine Augen und sah: Siehe, da war ein Mann, und in seiner Hand war eine Messschnur.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Messleine“. Das hebräische Wort bezeichnet konkret eine Schnur oder ein Seil, das zum Messen verwendet wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשָּׂא עֵינַי
  choice: ich erhob meine Augen
  rationale: Die hebräische Wendung wird bewusst bewahrt, weil sie den visionären Blickvorgang einleitet. Sie klingt im Deutschen gehoben, bleibt aber klar verständlich.
- source_word: וָאֵרֶא
  choice: und sah
  rationale: Gibt das Verb ראה und die erzählerische Abfolge knapp und unmittelbar wieder.
- source_word: וְהִנֵּה
  choice: Siehe, da war
  rationale: „Siehe“ erhält den aufmerksamkeitslenkenden und visionären Charakter von הִנֵּה; „da war“ ergänzt im Deutschen natürlich das im Hebräischen fehlende Verb.
- source_word: אִישׁ
  choice: ein Mann
  rationale: Entspricht der grammatisch und semantisch männlichen Einzelfigur und vermeidet eine unnötig unbestimmte Wiedergabe.
- source_word: וּבְיָדוֹ
  choice: und in seiner Hand war
  rationale: Bewahrt das konkrete Bild der hebräischen Präpositionalphrase; das ergänzte „war“ sorgt für einen vollständigen deutschen Satz.
- source_word: חֶבֶל מִדָּה
  choice: eine Messschnur
  rationale: Bezeichnet eine Schnur beziehungsweise Leine, die zum Messen verwendet wird. „Messschnur“ ist konkret, idiomatisch und quellennah.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter visionärer Ausdrucksweise. Die leicht gehobene Wendung „die Augen erheben“ und das Aufmerksamkeitssignal „Siehe“ spiegeln den Stil des hebräischen Visionsberichts, ohne unnötig altertümlich zu wirken.
