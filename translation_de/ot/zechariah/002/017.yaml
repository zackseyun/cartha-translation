id: ZEC.2.17
reference: Zechariah 2:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הַ֥ס כָּל בָּשָׂ֖ר מִ/פְּנֵ֣י יְהוָ֑ה כִּ֥י נֵע֖וֹר מִ/מְּע֥וֹן קָדְשֽׁ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/017.yaml
  text: Be silent[a], all flesh, before Yahweh[b], for he has roused himself from his holy dwelling.
translation:
  language: de
  text: Alles Fleisch[a], schweige vor Jahwe, denn er hat sich aus seiner heiligen Wohnung erhoben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle Menschen“. Wörtlich steht hier „alles Fleisch“, eine prophetische Wendung, die die menschliche Geschöpflichkeit vor Gott hervorhebt.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „ist erwacht“ oder „hat sich aufgemacht“. Das hebräische Verb stellt bildhaft dar, wie Jahwe aus der Ruhe heraus zu handeln beginnt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַס
  choice: schweige
  rationale: Der Zuruf fordert gebieterisch zu ehrfürchtigem Schweigen auf. „Schweige“ ist im Deutschen klar, feierlich und genauer als das mehrdeutige „Sei still“.
- source_word: כָּל בָּשָׂר
  choice: alles Fleisch
  rationale: Die wörtliche prophetische Wendung bleibt erhalten. Sie bezeichnet die gesamte Menschheit und betont zugleich ihre Geschöpflichkeit und Vergänglichkeit vor Gott.
- source_word: מִפְּנֵי
  choice: vor
  rationale: Die Präposition bezeichnet hier das Verhalten angesichts beziehungsweise in der Gegenwart Jahwes; „vor“ gibt dies knapp und idiomatisch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung für die Aufforderung zum Schweigen ein.
- source_word: נֵעוֹר
  choice: hat sich … erhoben
  rationale: Das Verb zeichnet das Bild, dass Jahwe aus Ruhe zur Handlung übergeht. „Hat sich erhoben“ ist natürliches, würdevolles Deutsch; die ebenfalls möglichen Nuancen des Erwachens oder Sichaufraffens werden in der Fußnote offengehalten.
- source_word: מִמְּעוֹן קָדְשׁוֹ
  choice: aus seiner heiligen Wohnung
  rationale: מָעוֹן bezeichnet einen Wohn- oder Aufenthaltsort. „Heilige Wohnung“ bewahrt das räumliche Bild in verständlichem Deutsch.
theological_decisions:
- issue: Bedeutungsumfang von כָּל בָּשָׂר
  choice: Die wörtliche Wendung „alles Fleisch“ bleibt im Haupttext erhalten.
  alternative: „alle Menschen“ oder „die ganze Menschheit“
  rationale: Die Wendung meint hier umfassend die Menschheit, hebt aber zugleich deren geschöpfliche Begrenztheit vor Jahwe hervor. Die wörtliche Form bewahrt beide Aspekte.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Die Wiedergabe als Eigenname wahrt die Unterscheidung zwischen dem Gottesnamen und einem bloßen Hoheitstitel.
- issue: Bildsprache von נֵעוֹר
  choice: „hat sich erhoben“ mit einer Fußnote zu den möglichen Nuancen
  alternative: „ist erwacht“; „hat sich aufgemacht“
  rationale: Der hebräische Ausdruck beschreibt Jahwes Übergang aus der Ruhe zum Eingreifen, ohne dass die Bildsprache vorschnell auf eine einzige deutsche Vorstellung festgelegt werden muss.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter prophetischer Bildsprache. Die Voranstellung „Alles Fleisch“ gibt dem umfassenden Aufruf Nachdruck; der Singular „schweige“ behandelt die Wendung entsprechend dem Hebräischen als Kollektivbezeichnung.
