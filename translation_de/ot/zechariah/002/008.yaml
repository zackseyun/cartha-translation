  text: וַ/יֹּ֣אמֶר אֵלָ֔/ו רֻ֗ץ דַּבֵּ֛ר אֶל הַ/נַּ֥עַר הַלָּ֖ז לֵ/אמֹ֑ר פְּרָזוֹת֙ תֵּשֵׁ֣ב יְרוּשָׁלִַ֔ם מֵ/רֹ֥ב אָדָ֛ם וּ/בְהֵמָ֖ה בְּ/תוֹכָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/008.yaml
  text: And he said to him[a], “Run, speak to that young man, saying[b], ‘Jerusalem will dwell as open country because of the multitude of man and livestock within her.’”
translation:
  language: de
  text: 'Und er sagte zu ihm: „Lauf, rede mit jenem jungen Mann und sage ihm: ‚Jerusalem wird als offene Stadt bewohnt werden[a], wegen der großen Zahl von Menschen und Vieh in ihr.‘“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jerusalem wird wie unbefestigte Dörfer bewohnt werden.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֻץ
  choice: Lauf
  rationale: Der Imperativ bewahrt die unmittelbare, anschauliche Dringlichkeit des hebräischen Befehls.
- source_word: דַּבֵּר
  choice: rede
  rationale: Gibt den Piel-Imperativ direkt wieder, ohne ihn auf bloßes Berichten zu verengen.
- source_word: הַנַּעַר הַלָּז
  choice: diesem jungen Mann
  rationale: נַעַר bezeichnet hier am natürlichsten einen jungen Mann; der Demonstrativausdruck wird ausdrücklich bewahrt.
- source_word: לֵאמֹר
  choice: 'und sag: So spricht man'
  rationale: Die Einleitungsformel wird im Deutschen funktional wiedergegeben; „So spricht man“ macht jedoch unnötig einen unpersönlichen Sprecher daraus.
- source_word: פְּרָזוֹת
  choice: wie offenes Land
  rationale: Bewahrt das Bild räumlicher Offenheit und einer nicht durch Mauern begrenzten Besiedlung; die konkretere Alternative steht in der Fußnote.
- source_word: תֵּשֵׁב
  choice: wird … bewohnt sein
  rationale: Im Zusammenhang mit Jerusalem und ihrer zahlreichen Bevölkerung ist die resultative Bedeutung idiomatischer als das missverständliche „wird wohnen“.
- source_word: מֵרֹב אָדָם וּבְהֵמָה
  choice: weil so viele Menschen und so viel Vieh … leben
  rationale: Gibt den kausalen Sinn von מֵרֹב und die kollektiven Größen אָדָם und בְהֵמָה in natürlichem modernem Deutsch wieder.
- source_word: בְּתוֹכָהּ
  choice: in ihr
  rationale: Bewahrt den femininen Bezug auf die Stadt Jerusalem in idiomatischer Form.
theological_decisions:
- issue: Kollektive Bedeutung von אָדָם
  choice: Menschen
  alternative: Menschheit / der Mensch
  rationale: Hier bezeichnet אָדָם die menschliche Bevölkerung im Gegensatz zum Vieh. „Menschen“ ist im Deutschen natürlich und semantisch genau, ohne die generische Form künstlich nachzuahmen.
- issue: Bild der unbefestigten endzeitlichen Stadt
  choice: wie offenes Land bewohnt
  alternative: wie Dörfer ohne Mauern bewohnt
  rationale: Die gewählte Fassung erhält die räumliche Weite des Bildes; die Alternative macht den Aspekt fehlender Mauern deutlicher. Keine der Fassungen legt über den Text hinaus eine bestimmte eschatologische Lehre fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem Hebräischen, wird aber für heutige Leser geglättet. Der Ausdruck „So spricht man“ sollte in der Endredaktion entfallen, da לֵאמֹר schlicht die folgende direkte Rede einleitet.
