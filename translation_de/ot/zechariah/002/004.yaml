  text: וָ/אֹמַ֕ר מָ֛ה אֵ֥לֶּה בָאִ֖ים לַֽ/עֲשׂ֑וֹת וַ/יֹּ֣אמֶר לֵ/אמֹ֗ר אֵ֣לֶּה הַ/קְּרָנ֞וֹת אֲשֶׁר זֵ֣רוּ אֶת יְהוּדָ֗ה כְּ/פִי אִישׁ֙ לֹא נָשָׂ֣א רֹאשׁ֔/וֹ וַ/יָּבֹ֤אוּ אֵ֨לֶּה֙ לְ/הַחֲרִ֣יד אֹתָ֔/ם לְ/יַדּ֞וֹת אֶת קַרְנ֣וֹת הַ/גּוֹיִ֗ם הַ/נֹּשְׂאִ֥ים קֶ֛רֶן אֶל אֶ֥רֶץ יְהוּדָ֖ה לְ/זָרוֹתָֽ/הּ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/004.yaml
  text: Then I said[a], “What are these coming to do?” And he said, “These are the horns that scattered Judah, so that no one lifted up his head; and these have come to terrify them[c][b], to cast down the horns of the nations that lifted up a horn against the land of Judah to scatter her.”
translation:
  language: de
  text: 'Da fragte ich: „Was kommen diese hier zu tun?“ Er antwortete: „Das sind die Hörner[c], die Juda so zerstreut haben, dass niemand den Kopf erhob.[a] Und diese sind gekommen, um sie in Schrecken zu versetzen und die Hörner der Nationen niederzuwerfen,[b] die ihr Horn gegen das Land Juda erhoben haben, um es zu zerstreuen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Wendung ist schwierig; in ihrer Wortfolge etwa: „nach dem Mund eines Mannes erhob er seinen Kopf nicht“. Sie beschreibt Erniedrigung oder Hilflosigkeit; auch möglich: „sodass kein Mensch seinen Kopf erheben konnte“.'
    reason: lexical_alternative
  - marker: b
    text: 'Das hebräische Verb ist selten und in seiner genauen Bedeutung unsicher; auch möglich: „wegzuschleudern“ oder „abzuschlagen“.'
    reason: lexical_alternative
  - marker: c
    text: „Hörner“ stehen in dieser Vision bildhaft für Macht und aggressive Stärke. Das Bild wird im Text nicht durch eine Deutung wie „Mächte“ oder „Königreiche“ ersetzt.
    reason: cultural_note
lexical_decisions:
- source_word: קְּרָנוֹת / קֶרֶן
  choice: Hörner / ihr Horn
  rationale: Die wörtliche Wiedergabe bewahrt das Leitbild der Vision für Macht und aggressive Stärke. Beim zweiten Vorkommen macht das possessive „ihr Horn“ den Bezug auf die Nationen im Deutschen natürlich deutlich.
- source_word: זֵרוּ / לְזָרוֹתָהּ
  choice: zerstreut haben / es zu zerstreuen
  rationale: Das Verb bezeichnet das Zerstreuen oder Auseinandertreiben und passt zum Bild von Judas Erniedrigung und Zerstreuung. Das feminine Suffix bezieht sich auf אֶרֶץ, wird wegen des deutschen Neutrums „Land“ jedoch mit „es“ wiedergegeben.
- source_word: כְּפִי אִישׁ לֹא נָשָׂא רֹאשׁוֹ
  choice: sodass niemand mehr den Kopf erhob
  rationale: Die schwierige hebräische Wendung beschreibt umfassende Erniedrigung oder Hilflosigkeit. „Niemand“ gibt das generisch gebrauchte אִישׁ im heutigen Deutsch natürlich wieder; „mehr“ verdeutlicht idiomatisch das Ergebnis, ohne eine neue Aussage einzuführen.
- source_word: לְהַחֲרִיד
  choice: in Schrecken zu versetzen
  rationale: Die Form bezeichnet das Verursachen von Schrecken oder Zittern. Die gewählte Wendung ist kräftig, würdig und im modernen Deutsch natürlich.
- source_word: לְיַדּוֹת
  choice: niederzuwerfen
  rationale: Das seltene und schwierige Verb bezeichnet im Kontext das gewaltsame Herabwerfen oder Niederwerfen der feindlichen Hörner; die Bildsprache bleibt erhalten.
- source_word: הַגּוֹיִם
  choice: die Nationen
  rationale: Gemeint sind fremde Völker beziehungsweise politische Mächte, die gegen Juda auftreten. „Nationen“ ist hier präzise und vermeidet die konfessionell geprägte Wiedergabe „Heiden“.
- source_word: הַנֹּשְׂאִים קֶרֶן
  choice: die ihr Horn ... erhoben haben
  rationale: Die Hornmetapher für die Entfaltung von Macht oder Hochmut bleibt erhalten; die deutsche Wortstellung macht das Ziel „gegen das Land Juda“ klar.
- source_word: אֵלֶּה בָאִים לַעֲשׂוֹת
  choice: Was kommen diese hier zu tun?
  rationale: Die präsentische Visionsszene und die ungewöhnliche, aber verständliche Frageform des Hebräischen werden bewahrt. „Hier“ lässt das deiktische אֵלֶּה im Deutschen natürlich wirken.
- source_word: וַיָּבֹאוּ אֵלֶּה
  choice: diese sind gekommen
  rationale: Das Perfekt verbindet ihr Eintreffen in der Vision unmittelbar mit dem folgenden Zweck.
theological_decisions:
- issue: Symbolik der Hörner als feindliche Macht
  choice: Die Metapher im Haupttext wörtlich als „Hörner“ bewahren.
  alternative: Als „Mächte“, „Reiche“ oder „Königreiche“ auslegen.
  rationale: Die Vision arbeitet ausdrücklich mit Hörnern und den nachfolgend genannten Handwerkern. Eine abstrakte Deutung im Haupttext würde das Bild verflachen und seine genaue Referenz vorzeitig festlegen.
- issue: Bedeutung des seltenen Verbs לְיַדּוֹת
  choice: „niederzuwerfen“
  alternative: „abzuschlagen“, „wegzuschleudern“ oder „zu Boden zu werfen“
  rationale: Die genaue Aktion ist lexikalisch unsicher. „Niederzuwerfen“ bewahrt den allgemeinen Gedanken der gewaltsamen Entmachtung, ohne ein bestimmtes Werkzeug oder eine präzisere Handlung in den Text einzutragen.
- issue: Referenz der vier Gestalten in „diese sind gekommen“
  choice: Das Demonstrativpronomen ohne interpretierende Benennung beibehalten.
  alternative: „Diese Handwerker“ oder eine andere identifizierende Bezeichnung einsetzen.
  rationale: Der vorgelegte Vers nennt die Gestalten nur demonstrativ. Ihre genauere Identität soll nicht aus Auslegung oder aus benachbartem Kontext in diesen Satz importiert werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit naher Bindung an die prophetische Bildsprache. Die sperrige Eingangsfrage bleibt leicht markiert, um die unmittelbare Visionsszene wiederzugeben. Generisches אִישׁ wird idiomatisch mit „niemand“ ausgedrückt; das grammatische Geschlecht des hebräischen Rückverweises auf „Land“ wird an das deutsche Neutrum angepasst. Alle Fußnotenmarker stehen an den jeweils erläuterten Aussagen im Haupttext.
