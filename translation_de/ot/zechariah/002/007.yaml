  text: וְ/הִנֵּ֗ה הַ/מַּלְאָ֛ךְ הַ/דֹּבֵ֥ר בִּ֖/י יֹצֵ֑א וּ/מַלְאָ֣ךְ אַחֵ֔ר יֹצֵ֖א לִ/קְרָאתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/007.yaml
  text: And behold[a], the angel who was speaking with me went out, and another angel went out to meet him.
translation:
  language: de
  text: 'Und siehe: Der Engel, der mit mir redete, ging hinaus, und ein anderer Engel ging hinaus, ihm entgegen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Und sieh
  rationale: Bewahrt die aufmerksamkeitslenkende und vergegenwärtigende Funktion der hebräischen Wendung. Die leicht gehobene Form passt zum prophetischen Visionsbericht, ohne ein zusätzliches Subjekt wie „ich sah“ einzuführen.
- source_word: הַמַּלְאָךְ
  choice: der Engel
  rationale: מַלְאָךְ kann „Bote“ oder „Engel“ bedeuten; im Zusammenhang dieser Vision mit mehreren himmlischen Gestalten ist „Engel“ die naheliegende Wiedergabe.
- source_word: הַדֹּבֵר בִּי
  choice: der mit mir redete
  rationale: Das Partizip kennzeichnet den Engel durch seine fortdauernde Rolle im Visionsbericht. „Mit mir redete“ gibt die wiederkehrende sacharjanische Wendung natürlich wieder; die mögliche Nuance „zu mir“ bleibt in einer Fußnote erhalten.
- source_word: יֹצֵא
  choice: ging hinaus
  rationale: Das Partizip wirkt im Erzählzusammenhang verbal und bezeichnet die Bewegung der Gestalt. „Ging hinaus“ erhält diese Bewegung, ohne ihren Ausgangspunkt näher zu bestimmen.
- source_word: וּמַלְאָךְ אַחֵר
  choice: und ein anderer Engel
  rationale: אַחֵר bezeichnet hier eine weitere, vom ersten unterschiedene Gestalt. „Ein anderer Engel“ ist im Deutschen eindeutig und idiomatisch.
- source_word: לִקְרָאתוֹ
  choice: ihm entgegen
  rationale: Die Wendung bezeichnet eine zielgerichtete Bewegung auf den ersten Engel zu. „Ihm entgegen“ bewahrt knapp die räumliche Dynamik des Hebräischen.
theological_decisions:
- issue: Identität und Rolle der beiden Engel
  choice: Beide Vorkommen von מַלְאָךְ werden allgemein mit „Engel“ wiedergegeben; keine der Gestalten wird über die Angaben des Verses hinaus identifiziert.
  alternative: Den ersten ausdrücklich als Deuteengel und den zweiten als himmlischen Boten mit einem bestimmten Auftrag bezeichnen.
  rationale: Der Vers unterscheidet die Gestalten lediglich durch ihre jeweilige Stellung im Geschehen. Die Übersetzung erhält diese Unterscheidung, ohne eine weitergehende Angelologie oder Identifikation einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht prophetisch-gehobener Färbung. „Und sieh“ erhält den lebhaften Aufmerksamkeitshinweis; Satzbau und Bewegungsverben bleiben zugleich klar und allgemein verständlich.
