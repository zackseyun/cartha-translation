base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/002.yaml
  text: And I said to the angel who was speaking with me[a], “What are these?” And he said to me, “These are the horns that scattered Judah, Israel, and Jerusalem.”
translation:
  language: de
  text: 'Und ich fragte den Engel, der mit mir redete: »Was sind das?« Und er sagte zu mir: »Das sind die Hörner[a], die Juda, Israel und Jerusalem zerstreut haben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder sinngemäß »die Mächte« oder »die Königreiche«; im Hebräischen steht »Hörner«, ein in prophetischen Texten verbreitetes Bild für Stärke oder Herrschaftsmacht.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: der Engel
  rationale: מַלְאָךְ kann »Bote« oder »Engel« bedeuten. Im Zusammenhang der Vision ist die himmlische Gestalt gemeint, die dem Propheten das Gesehene deutet; daher ist »Engel« hier die natürliche Wiedergabe.
- source_word: הַדֹּבֵר בִּי
  choice: der mit mir redete
  rationale: Die partizipiale Wendung mit בְּ bezeichnet in Sacharjas Visionen den Engel im Gespräch mit dem Propheten. »Mit mir redete« gibt diesen idiomatischen Sinn natürlich wieder, ohne das formal mögliche, im Kontext aber unpassende »in mir« zu wählen.
- source_word: מָה אֵלֶּה
  choice: Was sind diese?
  rationale: Die knappe Frage aus Interrogativpronomen und pluralischem Demonstrativpronomen wird ohne ergänzendes »Dinge« wiedergegeben.
- source_word: הַקְּרָנוֹת
  choice: die Hörner
  rationale: קֶרֶן bedeutet wörtlich »Horn« und dient in prophetischer Bildsprache häufig als Symbol für Stärke oder Herrschaftsmacht. Das Bild selbst bleibt im Haupttext erhalten.
- source_word: זֵרוּ
  choice: zerstreut haben
  rationale: זרה bezeichnet das Zerstreuen oder Auseinandertreiben, teils mit dem Bild des Worfelns. Im Zusammenhang mit Juda, Israel und Jerusalem ist »zerstreut« klar und sachgerecht.
- source_word: יְהוּדָה ... יִשְׂרָאֵל ... וִירוּשָׁלָם
  choice: Juda, Israel und Jerusalem
  rationale: Die drei Eigennamen und ihre koordinierte Reihenfolge werden entsprechend dem Hebräischen beibehalten.
theological_decisions:
- issue: Symbolische Bedeutung der Hörner
  choice: Das konkrete Bild »Hörner« bleibt im Haupttext stehen.
  alternative: Mächte; Königreiche
  rationale: Der Visionstext bezeichnet die Gestalten ausdrücklich als Hörner. Eine unmittelbare Auflösung des Symbols in »Mächte« oder »Königreiche« würde mehr deuten, als der Vers selbst aussagt; mögliche Bedeutungen werden deshalb nur in der Fußnote genannt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Erzählstil. Die direkte Rede ist natürlich formuliert; das prophetische Bild und die Aufzählung des hebräischen Textes bleiben erhalten.
