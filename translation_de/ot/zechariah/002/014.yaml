id: ZEC.2.14
reference: Zechariah 2:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: רָנִּ֥י וְ/שִׂמְחִ֖י בַּת צִיּ֑וֹן כִּ֧י הִנְ/נִי בָ֛א וְ/שָׁכַנְתִּ֥י בְ/תוֹכֵ֖/ךְ נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/014.yaml
  text: Sing for joy and rejoice[a], daughter Zion, for behold, I am coming, and I will dwell in your midst[c][b], declares Yahweh.
translation:
  language: de
  text: Juble und freue dich[a], Tochter Zion[b]! Denn sieh, ich komme und werde in deiner Mitte wohnen, spricht Jahwe.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Brich in Jubel aus und sei fröhlich.“'
    reason: lexical_alternative
  - marker: b
    text: „Tochter Zion“ ist eine poetische Personifikation Zions beziehungsweise Jerusalems.
    reason: cultural_note
  - marker: c
    text: Hebräisch JHWH; traditionell mit „der HERR“ wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: רָנִּי
  choice: Juble
  rationale: Der feminine Singular des Imperativs von רנן fordert zu lautem, freudigem Jubel auf. „Juble“ gibt dies knapp und natürlich wieder; auch „Brich in Jubel aus“ wäre möglich.
- source_word: וְשִׂמְחִי
  choice: und freue dich
  rationale: Der feminine Singular des Imperativs von שמח bezeichnet Freude beziehungsweise Frohsein. „Freue dich“ bewahrt den verbalen Aufruf und passt zum direkten Anreden Zions.
- source_word: בַּת צִיּוֹן
  choice: Tochter Zion
  rationale: Die poetische Anrede personifiziert Zion beziehungsweise Jerusalem. Die quellennähere Form „Tochter Zion“ ist im Deutschen verständlich und würdevoll.
- source_word: כִּי
  choice: Denn
  rationale: כִּי leitet die Begründung für die vorausgehenden Aufforderungen ein. „Denn“ entspricht der argumentativen Funktion und dem prophetischen Ton.
- source_word: הִנְנִי
  choice: sieh, ich
  rationale: הִנְנִי bedeutet wörtlich etwa „Sieh, hier bin ich“ und lenkt nachdrücklich die Aufmerksamkeit auf den Sprecher und sein bevorstehendes Handeln. In Verbindung mit dem Partizip entsteht natürlich „sieh, ich komme“.
- source_word: בָא
  choice: komme
  rationale: Das aktive Partizip von בוא bezeichnet nach הִנְנִי ein unmittelbar oder anschaulich bevorstehendes Kommen. Das deutsche Präsens „ich komme“ erhält diese Lebendigkeit.
- source_word: וְשָׁכַנְתִּי
  choice: und werde … wohnen
  rationale: Das Qal-Perfekt in diesem prophetischen Zusammenhang blickt auf die künftige Folge des Kommens. „Wohnen“ bewahrt das Motiv der bleibenden göttlichen Gegenwart, ohne es dogmatisch auszuweiten.
- source_word: בְתוֹכֵךְ
  choice: in deiner Mitte
  rationale: Das Suffix ist feminin Singular und bezieht sich auf Zion. „In deiner Mitte“ wahrt sowohl die direkte Anrede als auch den räumlich-gemeinschaftlichen Sinn.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: נְאֻם יְהוָה ist eine feste prophetische Botenformel. „Spricht Jahwe“ ist im Deutschen vertraut, knapp und feierlich; der Gottesname wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Bundesnamen wieder; eine Fußnote nennt die traditionelle deutsche Wiedergabe, ohne den Namen im Haupttext zu ersetzen.
- issue: Gottes Wohnen in Zion
  choice: werde in deiner Mitte wohnen
  alternative: werde unter dir leben
  rationale: Die Formulierung erhält das prophetische Bild von Jahwes kommender, bleibender Gegenwart in Zion. Sie legt nicht fest, auf welche spätere heilsgeschichtliche Erfüllung sich die Aussage bezieht.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit knappen prophetischen Imperativen. „Sieh“ bewahrt die aufmerksamkeitslenkende Funktion von הִנְנִי, ohne das altertümlichere „siehe“ zu verwenden. Die poetische Anrede „Tochter Zion“ und das Verb „wohnen“ bleiben bewusst quellennah.
