language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֠י הִנְ/נִ֨י מֵנִ֤יף אֶת יָדִ/י֙ עֲלֵי/הֶ֔ם וְ/הָי֥וּ שָׁלָ֖ל לְ/עַבְדֵי/הֶ֑ם וִֽ/ידַעְתֶּ֕ם כִּֽי יְהוָ֥ה צְבָא֖וֹת שְׁלָחָֽ/נִי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/013.yaml
  text: For behold[a], I am about to wave my hand over them, and they will become plunder for their own servants[c][b]. Then you will know that Yahweh of Armies has sent me.
translation:
  language: de
  text: Denn sieh, ich schwinge meine Hand über sie, und sie werden ihren eigenen Sklaven zur Beute werden.[a] Dann werdet ihr erkennen, dass Jahwe der Heerscharen mich gesandt hat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihren eigenen Dienern“. Das hebräische Wort kann „Diener“ oder „Sklaven“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der HERR der Heerscharen“. Wer hier als Gesandter spricht, wird im hebräischen Text nicht ausdrücklich bestimmt.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aussage ein und gibt den Zusammenhang im Deutschen natürlich wieder.
- source_word: הִנְנִי
  choice: sieh, ich
  rationale: Bewahrt den aufmerksamkeitsheischenden, deiktischen Charakter der Wendung; das unmittelbar folgende Präsens kann im prophetischen Kontext bevorstehendes Handeln ausdrücken.
- source_word: מֵנִיף אֶת־יָדִי עֲלֵיהֶם
  choice: ich schwinge meine Hand über sie
  rationale: Erhält das konkrete Bild der schwingenden beziehungsweise drohend bewegten Hand, ohne das räumliche עֲלֵיהֶם vorschnell nur als „gegen sie“ aufzulösen.
- source_word: וְהָיוּ שָׁלָל
  choice: sie werden … zur Beute werden
  rationale: Gibt den eintretenden neuen Zustand idiomatisch und mit zukünftigem Bezug wieder.
- source_word: לְעַבְדֵיהֶם
  choice: ihren eigenen Sklaven
  rationale: עבד kann „Diener“ oder „Sklave“ bedeuten. „Sklaven“ macht hier die drastische Umkehr der Machtverhältnisse deutlich; „eigenen“ verdeutlicht den Bezug des Suffixes, ohne eine zusätzliche Personengruppe einzuführen.
- source_word: וִידַעְתֶּם
  choice: Dann werdet ihr erkennen
  rationale: „Dann“ bringt die Folgebeziehung zum angekündigten Handeln natürlich zum Ausdruck; „erkennen“ passt zur bestätigenden Erkenntnisformel.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Gibt den Gottesnamen als „Jahwe“ und den traditionellen, im Deutschen verständlichen Titel צְבָאוֹת als „der Heerscharen“ wieder; eine Alternative wird in der Fußnote genannt.
- source_word: שְׁלָחַנִי
  choice: mich gesandt hat
  rationale: Das deutsche Perfekt bezeichnet die vollzogene Sendung mit fortdauernder Bedeutung natürlich.
theological_decisions:
- issue: Identität des Sprechers in „Jahwe der Heerscharen hat mich gesandt“
  choice: Die erste Person bleibt unverändert, ohne den Sprecher zu identifizieren.
  alternative: Der Sprecher kann als der Prophet, der himmlische Bote oder eine göttliche beziehungsweise messianische Gestalt verstanden werden.
  rationale: Der hebräische Wortlaut nennt den Sprecher hier nicht ausdrücklich. Die Übersetzung bewahrt diese Offenheit und die daraus entstehende theologische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sieh“ bewahrt den prophetischen Aufmerksamkeitsruf, während „Heerscharen“ den geläufigen biblischen Titel erhält. Die Satzstellung „ihren eigenen Sklaven zur Beute“ ist idiomatisch und betont die Umkehrung der Herrschaftsverhältnisse.
