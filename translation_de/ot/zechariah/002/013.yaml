review_pass:
  verdict: approve
  source_fidelity: Der Text gibt כִּי als begründendes „Denn“ wieder, bewahrt die aufmerksamkeitslenkende Wendung הִנְנִי mit „sieh, ich“ und übersetzt מֵנִיף ... עֲלֵיהֶם anschaulich und ohne unnötige Auslegung als „ich schwinge meine Hand über sie“. „Sie werden ihren eigenen Sklaven zur Beute werden“ entspricht dem Ergebnischarakter von וְהָיוּ שָׁלָל לְעַבְדֵיהֶם und erhält die Umkehrung der Machtverhältnisse. Die Schlussformel gibt die vollzogene Sendung und die unbestimmte Identität des Ich-Sprechers korrekt wieder.
  naturalness: Das Deutsch ist modernes, würdiges Standarddeutsch. „Denn sieh“ und „Heerscharen“ sind bewusst leicht bibelsprachlich, aber klar verständlich und für prophetische Rede angemessen. Die Formulierung „jemandem zur Beute werden“ ist idiomatisch.
  terminology: „Jahwe der Heerscharen“ ist eine sachgerechte, im Deutschen etablierte Wiedergabe von יהוה צבאות. „Sklaven“ ist in diesem Kontext als Hauptlesart vertretbar, da die soziale Umkehrung deutlich hervortritt; die Fußnote nennt „Dienern“ als lexikalische Alternative. Die Fußnote zur nicht identifizierten Sprecherfigur wahrt die textliche Offenheit, ohne eine theologische Deutung vorzuschreiben.
