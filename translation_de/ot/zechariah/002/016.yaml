source:
  edition: WLC
  text: וְ/נָחַ֨ל יְהוָ֤ה אֶת יְהוּדָה֙ חֶלְק֔/וֹ עַ֖ל אַדְמַ֣ת הַ/קֹּ֑דֶשׁ וּ/בָחַ֥ר ע֖וֹד בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/002/016.yaml
  text: And Yahweh will inherit Judah as his portion in the holy land[b][a], and he will again choose Jerusalem.
translation:
  language: de
  text: Und Jahwe wird Juda auf dem heiligen Boden[b] als sein Erbteil in Besitz nehmen[a], und er wird Jerusalem wieder erwählen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Juda als sein Erbteil erben“. Das Hebräische bewahrt hier die Sprache des Erbens und des Erbteils.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „auf dem Boden der Heiligkeit“; auch: „im Heiligen Land“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָחַל
  choice: Und … wird … als sein Erbteil in Besitz nehmen
  rationale: נחל bezeichnet im Qal das Empfangen beziehungsweise Besitzen als Erbe. Die Formulierung bewahrt die Erbteilssprache und ist im Deutschen natürlicher als „Juda erben“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶת יְהוּדָה חֶלְקוֹ
  choice: Juda als sein Erbteil
  rationale: חֶלְקוֹ bedeutet „sein Anteil/Erbteil“. Die Wendung erhält das Bild der Zuteilung und kennzeichnet Juda als Jahwes eigenen Anteil.
- source_word: עַל אַדְמַת הַקֹּדֶשׁ
  choice: auf dem heiligen Boden
  rationale: Dies folgt der konkreten hebräischen Formulierung „auf dem Boden der Heiligkeit“ enger als die traditionelle Wendung „im Heiligen Land“, ohne den räumlichen Sinn zu verlieren.
- source_word: וּבָחַר עוֹד
  choice: und er wird … wieder erwählen
  rationale: בחר bedeutet „wählen/erwählen“; עוֹד bezeichnet hier im Wiederherstellungskontext eine erneute Wahl. „Erwählen“ wahrt den feierlichen, theologischen Klang, ohne den Sinn näher festzulegen.
- source_word: בִּירוּשָׁלָם
  choice: Jerusalem
  rationale: Der Ortsname wird nach der etablierten deutschen Form wiedergegeben.
theological_decisions:
- issue: Juda als Erbteil Jahwes
  choice: Die Erbteilssprache bleibt in „als sein Erbteil in Besitz nehmen“ erhalten.
  alternative: „Juda erben“ oder „Juda als seinen Besitz nehmen“
  rationale: Das Hebräische überträgt die sonst oft für Israels Landbesitz gebrauchte Erbsprache auf Jahwes Verhältnis zu Juda. Die gewählte Form bewahrt diese Spannung, ist aber idiomatischer als „Juda erben“.
- issue: אַדְמַת הַקֹּדֶשׁ als geheiligter geografischer Raum
  choice: „auf dem heiligen Boden“
  alternative: „im Heiligen Land“
  rationale: Die Übersetzung erhält das konkrete Bild von אֲדָמָה („Erdboden, Boden“) und dessen Heiligkeitsbestimmung. Die geläufige Alternative wird in einer Fußnote genannt.
- issue: Erneute Erwählung Jerusalems
  choice: „Jerusalem wieder erwählen“
  alternative: „Jerusalem noch erwählen“
  rationale: Im Wiederherstellungszusammenhang bezeichnet עוֹד am wahrscheinlichsten eine erneute Zuwendung. Die Übersetzung macht keine Aussage darüber hinaus, wie sich diese Erwählung zeitlich oder heilsgeschichtlich entfaltet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Erbteil“ und „erwählen“ bewahren den biblisch-theologischen Ton; die Satzstruktur bleibt klar und nah am Hebräischen.
