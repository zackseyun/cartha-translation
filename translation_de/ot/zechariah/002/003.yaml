  yaml_path: translation/ot/zechariah/002/003.yaml
  text: Then Yahweh showed me four craftsmen[a].
translation:
  language: de
  text: Dann zeigte mir Jahwe vier Handwerker.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Schmiede«; das hebräische Wort kann insbesondere Facharbeiter wie Metallhandwerker, aber auch allgemein Handwerker bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְאֵנִי
  choice: Dann zeigte mir
  rationale: Der Hifil-Wajjiqtol von ראה mit Suffix der 1. Person Singular bedeutet wörtlich »da ließ er mich sehen« und idiomatisch »da zeigte er mir«. »Dann« gibt die fortschreitende Abfolge der Vision natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als der Gottesname »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אַרְבָּעָה
  choice: vier
  rationale: Das Zahlwort bezeichnet eindeutig die Anzahl vier.
- source_word: חָרָשִׁים
  choice: Handwerker
  rationale: חָרָשׁ kann allgemein einen handwerklich geschulten Arbeiter bezeichnen, darunter Holz-, Stein- oder Metallhandwerker. »Handwerker« wahrt diese Bedeutungsbreite, ohne ein bestimmtes Gewerbe festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. Die Umschrift »Jahwe« bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Form folgt der hebräischen Visionsschilderung; die Fußnote bewahrt die mögliche engere Bedeutung von חָרָשִׁים.
