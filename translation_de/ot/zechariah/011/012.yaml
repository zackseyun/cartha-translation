base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/012.yaml
  text: 'Then I said to them[a], “If it is good in your eyes, give me my wages; but if not, refrain.” So they weighed out my wages: thirty pieces of silver.'
translation:
  language: de
  text: 'Da sagte ich zu ihnen: „Wenn es euch gut erscheint, gebt mir meinen Lohn; wenn nicht, dann lasst es.“ Darauf wogen sie meinen Lohn ab: dreißig Silberstücke.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich: „dreißig Silber“; möglicherweise sind dreißig Schekel Silber gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Da sagte ich
  rationale: Das narrative Waw führt die Handlung weiter. „Da sagte ich“ gibt die zeitliche Abfolge in natürlichem, gehobenem Deutsch wieder.
- source_word: אִם טוֹב בְּעֵינֵיכֶם
  choice: Wenn es euch gut erscheint
  rationale: Die deutsche Wendung ist verständlich und bewahrt den wertenden Sinn des hebräischen Idioms, ohne das heute weniger natürliche Bild „gut in euren Augen“ erzwingen zu müssen.
- source_word: הָבוּ שְׂכָרִי
  choice: gebt mir meinen Lohn
  rationale: „Gebt“ entspricht dem Imperativ, während „Lohn“ die Vergütung für den geleisteten Dienst klar bezeichnet.
- source_word: וְאִם לֹא חֲדָלוּ
  choice: wenn nicht, dann lasst es
  rationale: חדל bedeutet aufhören beziehungsweise von etwas ablassen. Im Zusammenhang heißt die knappe Aufforderung, die Zahlung andernfalls zu unterlassen.
- source_word: וַיִּשְׁקְלוּ
  choice: Darauf wogen sie … ab
  rationale: Das Verb bezeichnet das Abwiegen von Silber als Zahlungsmittel. „Abwogen“ bewahrt diese konkrete antike Zahlungspraxis.
- source_word: שְׁלֹשִׁים כָּסֶף
  choice: dreißig Silberstücke
  rationale: Der hebräische Ausdruck nennt wörtlich nur „dreißig Silber“. „Silberstücke“ ist im Deutschen verständlich, ohne die nicht ausdrücklich genannte Gewichtseinheit im Haupttext festzulegen.
theological_decisions:
- issue: Geld- beziehungsweise Gewichtseinheit der Zahlung
  choice: dreißig Silberstücke
  alternative: dreißig Schekel Silber
  rationale: Obwohl im historischen Zusammenhang Schekel gemeint sein können und die Formulierung später im Matthäusevangelium aufgegriffen wird, nennt der hebräische Text die Einheit nicht ausdrücklich. Der Haupttext bleibt daher allgemeiner; die mögliche Präzisierung steht in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp; „dann lasst es“ gibt die hebräische Kürze natürlich wieder. Der Fußnotenmarker steht bei der sachlich zugehörigen Mengenangabe.
