source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֵלָ֑/י ע֣וֹד קַח לְ/ךָ֔ כְּלִ֖י רֹעֶ֥ה אֱוִלִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/015.yaml
  text: Then Yahweh said to me[a], “Take again for yourself the equipment of a foolish shepherd.”
translation:
  language: de
  text: 'Da sagte Jahwe zu mir: »Nimm dir noch einmal die Ausrüstung[a] eines törichten Hirten.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das Gerät« beziehungsweise »die Gerätschaften eines törichten Hirten«. Das hebräische Wort ist weit gefasst und bezeichnet Gegenstände oder Ausrüstung, die zu einem Hirten gehören.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter. „Da sagte“ gibt die zeitliche Folge in natürlichem deutschem Erzählstil wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige Transkription.
- source_word: אֵלָי
  choice: zu mir
  rationale: Die Präposition mit dem Suffix der ersten Person Singular wird unmittelbar und idiomatisch mit „zu mir“ wiedergegeben.
- source_word: עוֹד
  choice: noch einmal
  rationale: Im Zusammenhang des Befehls bezeichnet עוֹד eine weitere beziehungsweise wiederholte symbolische Handlung. „Noch einmal“ drückt dies im Deutschen klar aus.
- source_word: קַח לְךָ
  choice: Nimm dir
  rationale: Der Imperativ bedeutet „nimm“; das לְךָ bezeichnet die persönliche Beteiligung und wird idiomatisch durch das Reflexivpronomen „dir“ bewahrt.
- source_word: כְּלִי
  choice: Ausrüstung
  rationale: כְּלִי ist ein weiter Begriff für Gegenstand, Gerät oder Gerätschaft. Im Zusammenhang eines Hirten ist das kollektive „Ausrüstung“ natürlich und vermeidet eine unnötige Festlegung auf einen einzelnen Gegenstand.
- source_word: רֹעֶה
  choice: Hirten
  rationale: Das Partizip bezeichnet hier einen Hirten und steht in einer Genitivverbindung mit כְּלִי.
- source_word: אֱוִלִי
  choice: törichten
  rationale: Das Adjektiv bezeichnet Torheit beziehungsweise moralische Unvernunft. „Töricht“ ist direkt und im würdevollen modernen Bibelstil angemessen; „nichtsnutzig“ würde den Sinn stärker werten, als das Wort allein verlangt.
theological_decisions:
- issue: Symbolische Identität des Hirten
  choice: 'Die Wendung bleibt beschreibend: „eines törichten Hirten“.'
  alternative: Deutung als bestimmter historischer Herrscher, als korrupte Führerschaft Israels insgesamt oder als endzeitliche Gegengestalt zum wahren Hirten.
  rationale: Der hebräische Wortlaut identifiziert die dargestellte Gestalt in diesem Vers nicht genauer. Die Übersetzung bewahrt diese Offenheit und trägt keine umstrittene Identifizierung in den Text ein.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die knappe Befehlsform und die symbolische Offenheit des hebräischen Textes bleiben erhalten.
