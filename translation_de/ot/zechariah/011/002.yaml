  text: הֵילֵ֤ל בְּרוֹשׁ֙ כִּֽי נָ֣פַל אֶ֔רֶז אֲשֶׁ֥ר אַדִּרִ֖ים שֻׁדָּ֑דוּ הֵילִ֨ילוּ֙ אַלּוֹנֵ֣י בָשָׁ֔ן כִּ֥י יָרַ֖ד יַ֥עַר ה/בצור־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/002.yaml
  text: Wail[a], cypress, for the cedar has fallen, for the majestic ones have been destroyed. Wail, oaks of Bashan[c][b], for the thick forest has come down.
translation:
  language: de
  text: Heule, Zypresse[a], denn die Zeder ist gefallen, denn die Mächtigen sind verwüstet[b]. Heult, ihr Eichen des Baschan, denn der dichte Wald ist gefallen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Tanne“. Die genaue Baumart ist unsicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „denn die Prächtigen sind vernichtet“.'
    reason: lexical_alternative
  - marker: c
    text: Der hebräische Ausdruck kann auch „der unzugängliche Wald“ oder „der befestigte Wald“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵילֵל / הֵילִילוּ
  choice: Heule / Heult
  rationale: Die Imperativformen von ילל rufen zu lautem Klagen aus Trauer oder Bestürzung auf. „Heulen“ bewahrt die Eindringlichkeit des prophetischen Klagerufs und ist im Deutschen unmittelbar verständlich.
- source_word: בְּרוֹשׁ
  choice: Zypresse
  rationale: Die genaue Baumart ist unsicher; „Zypresse“ entspricht einer verbreiteten neueren lexikalischen Einordnung und passt zur Parallele mit Zeder und Eichen. Die traditionelle Alternative „Tanne“ wird in einer Fußnote genannt.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier jeweils den Grund für den Klageruf ein. „Denn“ erhält den poetisch-prophetischen Ton und gibt den kausalen Zusammenhang klar wieder.
- source_word: נָפַל
  choice: ist gefallen
  rationale: Die Form bezeichnet wörtlich das Gefallensein. Obwohl das Bild ein Fällen durch Gericht nahelegt, wird die Ursache im hebräischen Verb nicht ausdrücklich genannt.
- source_word: אֶרֶז
  choice: Zeder
  rationale: Dies ist die übliche und sachlich klare Wiedergabe; die Zeder ist in prophetischer Bildsprache ein Sinnbild von Größe und Stärke.
- source_word: אַדִּרִים
  choice: die Mächtigen
  rationale: Das substantivierte Adjektiv kann mächtige, herrliche oder majestätische Wesen bzw. Dinge bezeichnen. „Die Mächtigen“ wahrt die mögliche Beziehung sowohl auf stattliche Bäume als auch metaphorisch auf einflussreiche Menschen.
- source_word: שֻׁדָּדוּ
  choice: sind verwüstet
  rationale: Die Passivform bezeichnet gewaltsame Verheerung. „Verwüstet“ lässt sich sowohl auf den Wald als auch auf die möglicherweise gemeinten Mächtigen beziehen, ohne das Bild einseitig festzulegen.
- source_word: אַלּוֹנֵי בָשָׁן
  choice: Eichen des Baschan
  rationale: Die Wendung bezeichnet die berühmten kräftigen Bäume Baschans. „Eichen des Baschan“ ist die geläufige und im Bildzusammenhang passende Wiedergabe.
- source_word: יָרַד
  choice: ist niedergestürzt
  rationale: Das Verb bedeutet grundsätzlich „hinabgehen/herabkommen“. Beim Wald vermittelt „niedergestürzt“ idiomatisch dessen Zusammenbruch, ohne ausdrücklich einen Handelnden hinzuzufügen.
- source_word: יַעַר הַבָּצוּר
  choice: der dichte Wald
  rationale: Die Schlusswendung ist textlich und semantisch schwierig. Im Zusammenhang bezeichnet sie wahrscheinlich einen dichten und dadurch schwer zugänglichen Wald. „Der dichte Wald“ ist natürliches Deutsch; weitere mögliche Bedeutungen werden in einer Fußnote bewahrt.
theological_decisions:
- issue: Ob die Bäume im Haupttext ausdrücklich als Herrscher oder andere Machtträger gedeutet werden sollen
  choice: Die Baum- und Waldmetaphorik bleibt im Haupttext erhalten; „die Mächtigen“ wahrt zugleich die mögliche übertragene Bedeutung.
  alternative: Die Bildsprache ausdrücklich mit „Herrscher“, „Fürsten“ oder „Machthaber“ wiedergeben.
  rationale: Der Vers kann mächtige Menschen oder Gruppen im Bild großer Bäume meinen, benennt diese Deutung jedoch nicht ausdrücklich. Die Übersetzung bewahrt deshalb die Bildsprache und die interpretative Spannung.
translation_notes:
  register: Moderne, würdige prophetische Dichtersprache. Die direkten Anreden wechseln entsprechend dem Hebräischen vom Singular („Heule, Zypresse“) zum Plural („Heult, ihr Eichen“). Die wiederholten Kausalsätze mit „denn“ erhalten Rhythmus und Struktur des Ausgangstextes.
