id: ZEC.11.1
reference: Zechariah 11:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: פְּתַ֥ח לְבָנ֖וֹן דְּלָתֶ֑י/ךָ וְ/תֹאכַ֥ל אֵ֖שׁ בַּ/אֲרָזֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/001.yaml
  text: Open your doors[a], Lebanon, so that fire may consume your cedars.
translation:
  language: de
  text: Öffne deine Türen, Libanon, damit Feuer deine Zedern verzehrt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Öffne deine Tore, Libanon, und Feuer wird deine Zedern verzehren.“'
    reason: Lexikalische Alternative bei דְּלָתֶיךָ und syntaktische Alternative bei וְתֹאכַל.
lexical_decisions:
- source_word: פְּתַח
  choice: Öffne
  rationale: Der Imperativ im Singular richtet sich an den personifizierten Libanon. „Öffne“ gibt die Grundbedeutung schlicht und unmittelbar wieder.
- source_word: לְבָנוֹן
  choice: Libanon
  rationale: Der Eigenname wird in seiner üblichen deutschen Form wiedergegeben und als direkte Anrede beibehalten.
- source_word: דְּלָתֶיךָ
  choice: deine Türen
  rationale: דֶּלֶת bezeichnet zunächst eine Tür beziehungsweise einen Türflügel. Das Bild wird konkret bewahrt; „Tore“ bleibt als mögliche kontextuelle Wiedergabe in der Fußnote.
- source_word: וְתֹאכַל
  choice: damit … verzehrt
  rationale: Das mit וְ angeschlossene Imperfekt kann nach dem Imperativ eine Folge oder Absicht ausdrücken. „Damit“ ist im Deutschen natürlich, ohne die mögliche koordinierende Lesart zu verschweigen.
- source_word: אֵשׁ
  choice: Feuer
  rationale: Die Grundbedeutung wird direkt wiedergegeben. Der artikellose Gebrauch lässt sich im Deutschen hier natürlich ebenfalls ohne Artikel ausdrücken.
- source_word: בַּאֲרָזֶיךָ
  choice: deine Zedern
  rationale: Obwohl בְּ formal eine lokale Bedeutung tragen kann, bezeichnet die Wendung idiomatisch das vom Feuer Verzehrte. Die possessive Form und das Bild der Zedern bleiben erhalten.
theological_decisions:
- issue: Personifikation und prophetische Bildsprache
  choice: Der Libanon wird unmittelbar wie eine Person angesprochen, die ihre Türen öffnet, worauf Feuer seine Zedern verzehrt.
  alternative: Die Türen können konkret als Tore oder Zugänge des Libanon verstanden werden; der Libanon kann darüber hinaus symbolisch für politische Mächte oder ein größeres Gerichtsgeschehen stehen.
  rationale: Die Übersetzung bewahrt die offene prophetische Metapher und legt nicht fest, ob Waldgebiet, Gebirgspässe, Herrscher oder ein umfassenderes Gericht gemeint sind.
- issue: Verhältnis von Imperativ und folgendem Imperfekt
  choice: „damit Feuer … verzehrt“ gibt eine mögliche Ziel- oder Folgebeziehung wieder.
  alternative: „und Feuer wird … verzehren“ versteht וְ stärker koordinierend und das Imperfekt als angekündigte Folge.
  rationale: Beide syntaktischen Nuancen sind möglich. Die Hauptfassung folgt der natürlichen final-konsekutiven Lesart; die Alternative wird in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper prophetischer Bildsprache. Die Personifikation bleibt unverändert; weder das Bild noch sein möglicher geschichtlicher oder theologischer Bezug wird erklärend aufgelöst.
