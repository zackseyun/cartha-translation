  terminology: „Libanon“ entspricht der üblichen deutschen Namensform; „Zedern“ und „Feuer“ sind präzise. „Türen“ ist die lexikalisch vorrangige Wiedergabe von דְּלָתֶיךָ; „Tore“ ist als plausible kontextuelle Alternative korrekt in der Fußnote festgehalten.
