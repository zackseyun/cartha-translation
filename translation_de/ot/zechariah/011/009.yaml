source:
  edition: WLC
  text: וָ/אֹמַ֕ר לֹ֥א אֶרְעֶ֖ה אֶתְ/כֶ֑ם הַ/מֵּתָ֣ה תָמ֗וּת וְ/הַ/נִּכְחֶ֨דֶת֙ תִּכָּחֵ֔ד וְ/הַ֨/נִּשְׁאָר֔וֹת תֹּאכַ֕לְנָה אִשָּׁ֖ה אֶת בְּשַׂ֥ר רְעוּתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/009.yaml
  text: So I said[a], “I will not shepherd you. Let the dying die, and let the perishing perish[b]. And let those who remain each devour the flesh of the other.”
translation:
  language: de
  text: 'Da sagte ich: »Ich werde euch nicht weiden. Was am Sterben ist, soll sterben, und was zugrunde geht, soll zugrunde gehen. Die Übriggebliebenen[a] sollen jede das Fleisch der anderen fressen.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Überlebenden«; wörtlich: »die Übriggebliebenen«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »eine Frau das Fleisch ihrer Gefährtin«. Hier ist dies eine distributive Wendung im Sinn von »jede … der anderen«; die femininen Formen entsprechen dem Bild der Herde.'
    reason: cultural_note
lexical_decisions:
- source_word: אֶרְעֶה
  choice: ich werde euch nicht weiden
  rationale: Das Verb רעה bezeichnet hier das Hüten beziehungsweise Weiden einer Herde. »Weiden« bewahrt das in diesem Kapitel maßgebliche Hirtenbild und klingt im Deutschen natürlicher als das substantivischere »als Hirte führen«.
- source_word: הַמֵּתָה תָמוּת
  choice: Was am Sterben ist, soll sterben
  rationale: Die Verbindung aus Partizip und finitem Verb wird knapp und mit derselben Wortwurzel wiedergegeben. Sie drückt preisgebende, gerichtliche Resignation aus, ohne die Zahl der Betroffenen unnötig festzulegen.
- source_word: הַנִּכְחֶדֶת תִּכָּחֵד
  choice: was zugrunde geht, soll zugrunde gehen
  rationale: כחד bezeichnet hier Vernichtung beziehungsweise Untergang. Die Wiederholung wahrt die eindringliche Form des Hebräischen, während »zugrunde gehen« im modernen Deutsch natürlich bleibt.
- source_word: הַנִּשְׁאָרוֹת
  choice: die Übriggebliebenen
  rationale: Die substantivierte Form gibt den partizipialen Sinn »die Verbleibenden/Zurückgebliebenen« wieder; »Überlebenden« wäre möglich, deutete den Ausgang aber etwas stärker aus.
- source_word: תֹּאכַלְנָה
  choice: fressen
  rationale: Das Grundverb bedeutet »essen«. Im Zusammenhang mit der Herde und dem Fleisch der anderen vermittelt »fressen« die brutale Bildsprache im Deutschen unmittelbar.
- source_word: אִשָּׁה אֶת בְּשַׂר רְעוּתָהּ
  choice: jede das Fleisch der anderen
  rationale: Die feminine distributive Wendung bedeutet im Zusammenhang der Herde »jede ... der anderen«. Diese Form bewahrt sowohl die gegenseitige Gewalt als auch die feminine Grammatik, ohne irreführend ausdrücklich von Frauen zu sprechen.
theological_decisions:
- issue: Bewahrung des Hirten- und Herdenbildes in der Weigerung
  choice: Ich werde euch nicht weiden
  alternative: Ich werde euch nicht versorgen
  rationale: Die Zeichenhandlung des Kapitels beruht auf der Hirtenmetaphorik. Eine allgemeinere Wiedergabe wie »versorgen« würde dieses Bild abschwächen.
- issue: Wiedergabe des drastischen Bildes gegenseitigen Fleischfressens
  choice: Die Übriggebliebenen sollen jede das Fleisch der anderen fressen
  alternative: Die Übriggebliebenen sollen einander vernichten
  rationale: Der hebräische Text schildert die gegenseitige Zerstörung bewusst als schockierendes Fressen des Fleisches. Die Übersetzung bewahrt dieses Bild, statt es zu einer abstrakten Aussage abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper prophetischer Satzführung. Die Wiederholungen des Hebräischen bleiben erkennbar; das Hirtenbild und die drastische Schlussaussage werden nicht geglättet. Die Fußnotenmarker wurden an den jeweils erläuterten Ausdrücken platziert.
