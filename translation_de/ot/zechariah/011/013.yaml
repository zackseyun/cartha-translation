base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/013.yaml
  text: Then Yahweh said to me[a], “Throw it to the potter—the magnificent price at which I was valued by them.” So I took the thirty pieces of silver and threw it into the house of Yahweh[b], to the potter.
translation:
  language: de
  text: 'Da sagte Jahwe zu mir: »Wirf es dem Töpfer[a] zu – diesen herrlichen Preis[b], den ich ihnen wert war!« Da nahm ich die dreißig Silberstücke und warf sie in das Haus Jahwes, zum Töpfer.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch „der Töpfer“. Wegen des schwierigen Zusammenhangs und der neutestamentlichen Verwendung dieser Stelle schlagen manche „die Schatzkammer“ vor; der masoretische Text hat jedoch an beiden Stellen „Töpfer“.
    reason: alternative_reading
  - marker: b
    text: 'Die Wendung „herrlicher Preis“ ist wahrscheinlich ironisch: Sie verspottet die beleidigend niedrige Bewertung mit dreißig Silberstücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen in der im Deutschen geläufigen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: הַשְׁלִיכֵהוּ
  choice: Wirf es … hin
  rationale: Der Imperativ mit maskulinem Suffix bezieht sich im Zusammenhang auf das Geld beziehungsweise den Preis; das deutsche Neutrum „es“ gibt diesen Rückbezug natürlich wieder.
- source_word: הַיּוֹצֵר
  choice: der Töpfer
  rationale: Die übliche Bedeutung des Partizipialnomens von יצר wird an beiden Stellen beibehalten. Die schwierige Textgestalt rechtfertigt keine stillschweigende Änderung zu „Schatzkammer“.
- source_word: אֶדֶר הַיְקָר
  choice: diesen herrlichen Preis
  rationale: „Herrlich“ bewahrt den erhabenen Klang von אֶדֶר und lässt im Zusammenhang zugleich die beißende Ironie erkennen; „Preis“ gibt den Wertungscharakter von הַיְקָר wieder.
- source_word: יָקַרְתִּי מֵעֲלֵיהֶם
  choice: den ich ihnen wert war
  rationale: Diese natürliche deutsche Formulierung gibt wieder, dass der Sprecher von ihnen bewertet wurde, ohne die syntaktische Mehrdeutigkeit unnötig auszubauen.
- source_word: שְׁלֹשִׁים הַכֶּסֶף
  choice: die dreißig Silberstücke
  rationale: Entspricht dem wörtlichen „dreißig vom Silber“, ohne die im Vers nicht ausdrücklich genannte Einheit „Schekel“ einzuführen.
- source_word: בֵּית יְהוָה
  choice: im Haus Jahwes
  rationale: Bewahrt das konkrete hebräische „Haus“ und ist im Kontext als Heiligtum verständlich.
- source_word: אֶל הַיּוֹצֵר
  choice: dem Töpfer hin
  rationale: Erhält die Wiederholung des masoretischen Textes und gibt die Zielrichtung der Präposition idiomatisch wieder.
theological_decisions:
- issue: Die schwierige Lesart „Töpfer“ und die ironische Bewertung
  choice: Die masoretische Lesart „Töpfer“ wird an beiden Stellen beibehalten; die Bewertungsformel wird erhaben und erkennbar ironisch formuliert.
  alternative: „Schatzkammer“ aufgrund einer vorgeschlagenen Textänderung; oder eine nüchterne Wiedergabe wie „der Preis, mit dem sie mich bewerteten“.
  rationale: Der überlieferte hebräische Text nennt zweimal den Töpfer. Eine Konjektur soll nicht wegen des schwierigen Zusammenhangs oder einer späteren Verwendung des Verses in den Haupttext eingetragen werden. Die erhöhte Wortwahl steht in Spannung zu der beleidigend niedrigen Summe und bewahrt so die prophetische Ironie.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nah an der markanten Bildsprache des Hebräischen, wird aber durch „hin“ und die idiomatische Wendung „den ich ihnen wert war“ natürlich lesbar. Die Fußnoten stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
