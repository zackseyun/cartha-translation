id: ZEC.11.11
reference: Zechariah 11:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/תֻּפַ֖ר בַּ/יּ֣וֹם הַ/ה֑וּא וַ/יֵּדְע֨וּ כֵ֜ן עֲנִיֵּ֤י הַ/צֹּאן֙ הַ/שֹּׁמְרִ֣ים אֹתִ֔/י כִּ֥י דְבַר יְהוָ֖ה הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/011.yaml
  text: So it was broken on that day[b][a], and thus the afflicted of the flock who were watching me knew that it was the word of Yahweh.
translation:
  language: de
  text: So wurde er an jenem Tag gebrochen[b], und die Elenden der Herde[a], die mich beobachteten, erkannten daran, dass es das Wort Jahwes war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Armen der Herde“ oder „die Demütigen der Herde“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „aufgehoben“ oder „für ungültig erklärt“; diese Wiedergaben betonen die rechtliche Bedeutung für den Bund.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֻּפַר
  choice: wurde er … gebrochen
  rationale: Das passive Verb von פרר nimmt den im unmittelbaren Zusammenhang genannten Bund wieder auf. „Gebrochen“ bewahrt sowohl die konkrete Bildsprache als auch den Gedanken der Aufhebung eines Bundes; das deutsche Pronomen richtet sich nach „der Bund“.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Natürliche deutsche Wiedergabe der üblichen prophetischen Zeitangabe.
- source_word: וַיֵּדְעוּ כֵן
  choice: erkannten daran
  rationale: כֵן stellt den Zusammenhang zwischen dem zuvor Geschehenen und der folgenden Erkenntnis her. „Daran“ gibt diese rückbezügliche, folgernde Funktion idiomatisch wieder.
- source_word: עֲנִיֵּי הַצֹּאן
  choice: die Elenden der Herde
  rationale: עָנִי kann Arme, Bedrängte oder Demütige bezeichnen. „Elenden“ bewahrt hier die soziale und leidvolle Dimension, ohne den Ausdruck ausschließlich auf wirtschaftliche Armut festzulegen.
- source_word: הַשֹּׁמְרִים אֹתִי
  choice: die mich beobachteten
  rationale: Das Partizip von שׁמר mit direktem Objekt bezeichnet hier aufmerksames Beobachten. „Beobachteten“ ist im erzählerischen Zusammenhang natürlich und vermeidet die missverständliche Vorstellung, sie hätten den Sprecher beschützt.
- source_word: כִּי דְבַר יְהוָה הוּא
  choice: dass es das Wort Jahwes war
  rationale: 'Die כִּי-Klausel nennt den Inhalt ihrer Erkenntnis: Das Geschehen beziehungsweise die prophetische Handlung erwies sich als Jahwes Wort. Der bestimmte Ausdruck „das Wort Jahwes“ bewahrt die prophetische Aussageform.'
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Gottesnamen ausdrücklich. „Jahwe“ gibt den Eigennamen in einer im Deutschen geläufigen Form wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bezugswort des passiven וַתֻּפַר
  choice: Der zuvor genannte Bund wurde gebrochen
  alternative: Der Stab wurde zerbrochen
  rationale: Die feminine Verbform greift am natürlichsten die feminine בְּרִית („Bund“) aus dem unmittelbaren Kontext auf. Die Formulierung lässt zugleich die symbolische Verbindung mit dem zerbrochenen Stab bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nah an der hebräischen Abfolge, wird aber durch „daran“ idiomatisch verbunden. „Elenden“ erhält die Mehrdeutigkeit zwischen Armut und Bedrängnis; die Fußnote ergänzt „Armen“ und „Demütigen“.
