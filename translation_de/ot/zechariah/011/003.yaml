source:
  edition: WLC
  text: ק֚וֹל יִֽלְלַ֣ת הָ/רֹעִ֔ים כִּ֥י שֻׁדְּדָ֖ה אַדַּרְתָּ֑/ם ק֚וֹל שַׁאֲגַ֣ת כְּפִירִ֔ים כִּ֥י שֻׁדַּ֖ד גְּא֥וֹן הַ/יַּרְדֵּֽן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/003.yaml
  text: The sound of the shepherds’ wailing[a], for their splendor is ruined; the sound of the young lions’ roaring[b], for the majesty of the Jordan is ruined.
translation:
  language: de
  text: Das Wehklagen der Hirten ist zu hören, denn ihre Pracht[a] ist verwüstet; das Brüllen der jungen Löwen ist zu hören, denn die Majestät des Jordans[b] ist verwüstet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Pracht“ kann auch das bezeichnen, was sie schmückt.
    reason: lexical_alternative
  - marker: b
    text: '„Die Majestät des Jordans“ kann die üppigen Dickichte an den Ufern des Jordans bezeichnen; traditionell auch: „der Stolz des Jordans“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֚וֹל
  choice: Man hört
  rationale: קוֹל bezeichnet Stimme, Laut oder Geräusch. Die unpersönliche deutsche Wendung gibt den hörbaren Eindruck beider parallelen Satzhälften natürlich wieder.
- source_word: יִֽלְלַ֣ת
  choice: wehklagen
  rationale: Das von ילל abgeleitete Wort bezeichnet lautes Klagen oder Heulen; bei den Hirten drückt „wehklagen“ menschliche Trauer treffend und würdig aus.
- source_word: הָרֹעִים
  choice: die Hirten
  rationale: Die Grundbedeutung bleibt erhalten; eine mögliche bildliche Beziehung auf Anführer wird nicht in den Text eingetragen.
- source_word: שֻׁדְּדָ֖ה / שֻׁדַּ֖ד
  choice: ist verwüstet
  rationale: שׁדד kann plündern, verheeren oder verwüsten bedeuten. „Verwüstet“ vermittelt die gewaltsame Zerstörung und bewahrt die Wiederholung des hebräischen Verbs.
- source_word: אַדַּרְתָּ֑ם
  choice: ihre Pracht
  rationale: אַדֶּרֶת kann einen prächtigen Mantel und davon abgeleitet Pracht oder Herrlichkeit bezeichnen. „Pracht“ wahrt die konkrete wie die übertragene Möglichkeit.
- source_word: שַׁאֲגַ֣ת
  choice: brüllen
  rationale: Das Wort bezeichnet das Brüllen eines Löwen und bildet im Deutschen einen klaren lautlichen Parallelismus zum Wehklagen.
- source_word: כְּפִירִים
  choice: die jungen Löwen
  rationale: כְּפִיר bezeichnet einen jungen, kräftigen Löwen; „junge Löwen“ ist präzise und geläufig.
- source_word: גְּא֥וֹן הַיַּרְדֵּֽן
  choice: die Hoheit des Jordans
  rationale: גָּאוֹן kann Hoheit, Majestät, Erhabenheit oder Stolz bezeichnen. „Hoheit“ erhält den poetischen Ausdruck, ohne unnötig eine moralisch negative Bedeutung von Stolz festzulegen.
theological_decisions:
- issue: Bildliche Bedeutung der Hirten und jungen Löwen
  choice: Die konkreten Bilder „Hirten“ und „junge Löwen“ bleiben im Haupttext stehen.
  alternative: Die Bilder ausdrücklich als Anführer, Herrscher oder Unterdrücker deuten.
  rationale: Der hebräische Vers benennt die möglichen bildlichen Bezugspersonen nicht. Ihre ausdrückliche Identifizierung würde die genuine Offenheit des prophetischen Bildes auflösen.
- issue: Bedeutung von גְּאוֹן הַיַּרְדֵּן
  choice: die Hoheit des Jordans
  alternative: der Stolz des Jordans; das Dickicht am Jordan
  rationale: Die Grundbedeutung des Nomens ist Hoheit, Erhabenheit oder Stolz. Im Zusammenhang kann die Wendung konkret die üppigen Uferdickichte meinen; diese Deutung wird in der Fußnote genannt, aber nicht in den Haupttext eingesetzt.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit poetischem Parallelismus. Die zweimalige Wendung „Man hört“ überträgt קוֹל idiomatisch, und „ist verwüstet“ bewahrt die auffällige Wiederholung von שׁדד.
