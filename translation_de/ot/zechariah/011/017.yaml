source:
  edition: WLC
  text: ה֣וֹי רֹעִ֤י הָֽ/אֱלִיל֙ עֹזְבִ֣י הַ/צֹּ֔אן חֶ֥רֶב עַל זְרוֹע֖/וֹ וְ/עַל עֵ֣ין יְמִינ֑/וֹ זְרֹע/וֹ֙ יָב֣וֹשׁ תִּיבָ֔שׁ וְ/עֵ֥ין יְמִינ֖/וֹ כָּהֹ֥ה תִכְהֶֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/017.yaml
  text: Woe to the worthless shepherd[a], who abandons the flock! A sword is against his arm and against his right eye. His arm will completely wither, and his right eye will be utterly dimmed.
translation:
  language: de
  text: Wehe dem nichtsnutzigen Hirten[a], der die Herde verlässt! Ein Schwert gegen seinen Arm und gegen sein rechtes Auge! Sein Arm wird völlig verdorren, und sein rechtes Auge wird vollkommen trübe werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Götzenhirte“. Das hebräische Wort kann etwas Wertloses, Nichtiges oder Götzenhaftes bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Wehe
  rationale: Die Interjektion leitet eine prophetische Gerichtsankündigung ein; „Wehe“ bewahrt sowohl den Klage- als auch den Unheilsruf.
- source_word: רֹעִי הָאֱלִיל
  choice: dem nichtsnutzigen Hirten
  rationale: אֱלִיל bezeichnet häufig etwas Nichtiges, Wertloses oder Götzenhaftes. „Nichtsnutzig“ bringt hier die scharfe Verurteilung eines Hirten zum Ausdruck, der seiner Aufgabe nicht nachkommt; die mögliche Götzennuance bleibt in der Fußnote erhalten.
- source_word: עֹזְבִי הַצֹּאן
  choice: der die Herde verlässt
  rationale: Das Partizip kennzeichnet den Hirten durch sein Verlassen beziehungsweise Preisgeben der Herde. Die Relativsatzform ist im Deutschen natürlich und erhält diesen charakterisierenden Sinn.
- source_word: חֶרֶב עַל זְרוֹעוֹ וְעַל עֵין יְמִינוֹ
  choice: Ein Schwert gegen seinen Arm und gegen sein rechtes Auge!
  rationale: Der hebräische Nominalsatz enthält kein ausdrückliches Verb. Die knappe deutsche Form bewahrt den orakelhaften Gerichtscharakter, ohne die Aussage eindeutig als Wunsch oder bloße Beschreibung festzulegen.
- source_word: זְרֹעוֹ יָבוֹשׁ תִּיבָשׁ
  choice: Sein Arm wird völlig verdorren
  rationale: Infinitivus absolutus und finite Verbform verstärken gemeinsam die Aussage. „Völlig verdorren“ gibt die nachdrückliche und umfassende Wirkung idiomatisch wieder.
- source_word: וְעֵין יְמִינוֹ כָּהֹה תִכְהֶה
  choice: und sein rechtes Auge wird vollkommen trübe werden
  rationale: Auch hier verstärkt ein Infinitivus absolutus die finite Verbform. כהה bezeichnet das Trüb- oder Dunkelwerden; die Wiedergabe vermeidet die nicht ausdrücklich geforderte Festlegung auf vollständige Blindheit.
theological_decisions:
- issue: Deutung von אֱלִיל innerhalb des Hirtenbildes
  choice: nichtsnutziger Hirte
  alternative: Götzenhirte
  rationale: Im unmittelbaren Zusammenhang steht das Versagen des Hirten im Vordergrund, der die Herde verlässt. „Nichtsnutzig“ vermittelt diese Wertlosigkeit klar, während die Fußnote die mögliche polemische Anspielung auf einen Götzen offenhält.
- issue: Modalität der nominalen Schwertankündigung
  choice: verblose Gerichtsformel
  alternative: „Ein Schwert komme über …“ oder „Ein Schwert wird … treffen“
  rationale: Da der hebräische Text kein Verb setzt, legt die Übersetzung nicht fest, ob hier ausdrücklich ein Fluchwunsch oder eine Zukunftsankündigung formuliert wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der knappe Nominalsatz beim Schwert erhält den markanten prophetischen Ton; die beiden verstärkten Verbalkonstruktionen werden mit „völlig“ und „vollkommen“ wiedergegeben.
