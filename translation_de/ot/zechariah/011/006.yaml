  variant: modern standard German
source:
  edition: WLC
  text: כִּ֠י לֹ֣א אֶחְמ֥וֹל ע֛וֹד עַל יֹשְׁבֵ֥י הָ/אָ֖רֶץ נְאֻם יְהוָ֑ה וְ/הִנֵּ֨ה אָנֹכִ֜י מַמְצִ֣יא אֶת הָ/אָדָ֗ם אִ֤ישׁ בְּ/יַד רֵעֵ֨/הוּ֙ וּ/בְ/יַ֣ד מַלְכּ֔/וֹ וְ/כִתְּתוּ֙ אֶת הָ/אָ֔רֶץ וְ/לֹ֥א אַצִּ֖יל מִ/יָּדָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/006.yaml
  text: For I will no longer have compassion on the inhabitants of the land[a], declares Yahweh. Behold, I am handing over the people, each into the hand of his neighbor and into the hand of his king, and they will crush the land[c][b], and I will not deliver it from their hand.
translation:
  language: de
  text: Denn ich werde kein Erbarmen mehr mit den Bewohnern des Landes haben[a] — Ausspruch Jahwes. Siehe, ich gebe jeden Menschen in die Hand seines Nächsten und in die Hand seines Königs preis. Sie werden das Land zerschlagen, und ich werde nicht aus ihrer Hand retten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit den Bewohnern der Erde“, wenn הָאָרֶץ universal statt örtlich verstanden wird.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich steht kein Objekt: „Ich werde nicht aus ihrer Hand retten.“ Gemeint sein können die Menschen oder das Land.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶחְמוֹל
  choice: Erbarmen haben
  rationale: חמל bezeichnet hier Schonung bzw. Erbarmen. „Erbarmen haben“ bewahrt sowohl den mitfühlenden als auch den gerichtlichen Bedeutungsaspekt.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: die Bewohner des Landes
  rationale: Die substantivierte Partizipialform bezeichnet die Bewohner; הָאָרֶץ meint im unmittelbaren Zusammenhang am ehesten das betreffende Land, kann aber auch „Erde“ bedeuten.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Die feierliche prophetische Formel wird knapp und quellennah wiedergegeben; der Gottesname יְהוָה erscheint als „Jahwe“.
- source_word: מַמְצִיא
  choice: ich gebe ... preis
  rationale: Der Hifil von מצא drückt hier aus, dass Gott Menschen in die Gewalt anderer geraten lässt. „Preisgeben“ vermittelt diesen feindlichen und gerichtlichen Zusammenhang natürlich.
- source_word: הָאָדָם אִישׁ
  choice: die Menschen, jeden
  rationale: הָאָדָם wird kollektiv verstanden, während אִישׁ die Aussage distributiv entfaltet. Die Formulierung bewahrt beides, ohne den Ausdruck auf einen einzelnen Mann zu verengen.
- source_word: בְיַד
  choice: in die Hand
  rationale: Das hebräische Bild für Gewalt bzw. Verfügungsgewalt bleibt erhalten und ist im Deutschen verständlich.
- source_word: רֵעֵהוּ
  choice: seines Nächsten
  rationale: רֵעַ kann Nächster, Mitmensch oder Gefährte bedeuten. Im Kontext gesellschaftlicher Zerrüttung ist „Nächster“ weit genug und bewahrt die Beziehungssprache.
- source_word: מַלְכּוֹ
  choice: seines Königs
  rationale: Die politische Bestimmtheit des Substantivs wird unmittelbar bewahrt.
- source_word: וְכִתְּתוּ
  choice: sie werden ... zerschlagen
  rationale: כתת bezeichnet gewaltsames Zerschlagen oder Zertrümmern. „Zerschlagen“ passt zum Land als Objekt und zum Gerichtsbild.
- source_word: וְלֹא אַצִּיל מִיָּדָם
  choice: ich werde niemanden aus ihrer Hand retten
  rationale: נצל im Hifil bedeutet retten oder entreißen. Da im Hebräischen kein ausdrückliches Objekt steht, wird „niemanden“ als kontextuelle Ergänzung kenntlich gemacht und die mögliche Beziehung auf Menschen gewahrt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Reichweite von הָאָרֶץ
  choice: Land
  alternative: Erde
  rationale: Der nähere Zusammenhang legt ein bestimmtes Land nahe; die mögliche universale Lesart wird in einer Fußnote bewahrt.
- issue: Bezug des nicht ausgedrückten Objekts bei אַצִּיל
  choice: niemanden
  alternative: es / das Land
  rationale: Das Hebräische lässt das Objekt unausgesprochen. Der Personenbezug passt zu den zuvor preisgegebenen Menschen; die sachliche oder kollektive Beziehung bleibt als echte Mehrdeutigkeit in der Fußnote erhalten.
- issue: Kollektives הָאָדָם und distributives אִישׁ
  choice: die Menschen, jeden
  alternative: jeden Mann
  rationale: Die Übersetzung bildet sowohl das Kollektiv als auch die anschließende Einzelverteilung ab, ohne eine weitergehende geschlechtliche Festlegung zu erzwingen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst bewahrten prophetischen Bildern („in die Hand“) und der feierlichen Formel „Ausspruch Jahwes“. „Siehe“ erhält das markierende הִנֵּה. Die Satzgliederung vermeidet einen überladenen deutschen Satz.
