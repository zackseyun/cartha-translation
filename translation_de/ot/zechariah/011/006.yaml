  source_fidelity: Die Übersetzung gibt die gerichtliche Preisgabe, die distributive Wendung „jeder ... in die Hand seines Nächsten und seines Königs“, das Zerschlagen des Landes und die Gottesrede insgesamt treffend wieder. Im letzten Teilsatz lässt das Hebräische das Objekt von „retten“ jedoch offen; „niemanden“ legt den Personenbezug fest und schließt den möglichen Bezug auf das Land im Übersetzungstext aus.
  naturalness: „Die Menschen preisgeben, jeden ...“ ist verständlich, aber etwas sperrig. „Jeden Menschen ... preisgeben“ ist im modernen Standarddeutsch natürlicher und bewahrt die distributive Aussage. Ein objektloses „retten“ ist hier als bewusst quellennaher Ellipsensatz möglich; die Fußnote erläutert ihn.
  terminology: „Erbarmen“, „Bewohner des Landes“, „Ausspruch Jahwes“, „in die Hand“, „Nächster“ und „König“ sind angemessen. „Jahwe“ entspricht der im Entwurf gewählten Wiedergabe des Gottesnamens. Die Fußnotenanker werden in logischer Reihenfolge gesetzt.
