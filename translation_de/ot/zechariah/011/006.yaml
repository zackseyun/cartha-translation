  - severity: low
    issue: „die Menschen preis, jeden ...“ klingt im Deutschen leicht konstruiert.
    rationale: Die Konstruktion versucht Kollektiv und Distribution gleichzeitig abzubilden, ist aber weniger idiomatisch als „jeden Menschen ... preisgeben“.
