source:
  edition: WLC
  text: כֹּ֥ה אָמַ֖ר יְהוָ֣ה אֱלֹהָ֑/י רְעֵ֖ה אֶת צֹ֥אן הַ/הֲרֵגָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/004.yaml
  text: 'Thus says Yahweh my God: Shepherd the flock for slaughter[a].'
translation:
  language: de
  text: 'So spricht Jahwe, mein Gott: »Weide die Herde, die zum Schlachten bestimmt ist.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »die Schlachtherde« oder »die Herde des Schlachtens«.'
    reason: Die hebräische Verbindung ist äußerst knapp und kann im Deutschen unterschiedlich aufgelöst werden.
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die übliche deutsche Wiedergabe der prophetischen Botenformel ist natürlich und bewahrt zugleich ihren feierlichen Charakter.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהָי
  choice: mein Gott
  rationale: Das hebräische Wort trägt eindeutig das Suffix der ersten Person Singular.
- source_word: רְעֵה
  choice: Weide
  rationale: Der Imperativ bezeichnet die Tätigkeit eines Hirten; »weiden« erhält im Deutschen das Hirtenmotiv und ist hier idiomatisch.
- source_word: צֹאן
  choice: Herde
  rationale: Das Kollektivwort bezeichnet Kleinvieh als Herde und passt zum folgenden Hirtenbild.
- source_word: הַהֲרֵגָה
  choice: die zum Schlachten bestimmt ist
  rationale: Die knappe hebräische Verbindung lässt sich wörtlich als »Schlachtherde« oder »Herde des Schlachtens« verstehen; die gewählte Form macht die naheliegende Bestimmung verständlich, ohne auszudrücken, wer sie schlachten wird.
theological_decisions:
- issue: Wiedergabe des Gottesnamens JHWH
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen; die Umschrift bewahrt ihn als Namen.
- issue: Beziehung des Sprechers zu Gott
  choice: mein Gott
  alternative: Gott
  rationale: Das Suffix der ersten Person Singular wird beibehalten; so bleibt erkennbar, dass der Prophet den Auftrag als Wort seines Gottes einführt.
- issue: Bestimmung der Herde
  choice: zum Schlachten bestimmt
  alternative: Schlachtherde
  rationale: Die Formulierung gibt den wahrscheinlichen Zielsinn wieder, lässt aber offen, durch wen und unter welchen Umständen die Schlachtung erfolgt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die prophetische Formel bleibt gehoben, der anschließende Befehl jedoch klar und unmittelbar.
