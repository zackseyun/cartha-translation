base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/016.yaml
  text: For behold[a], I am raising up a shepherd in the land who will not attend to the perishing, will not seek the straying, will not heal the broken, will not sustain the healthy[c][b], but will eat the flesh of the fat ones and tear off their hooves.
translation:
  language: de
  text: Denn siehe, ich lasse im Land einen Hirten auftreten, der sich um die zugrunde gehenden Tiere nicht kümmern, das junge Tier[a] nicht suchen, das gebrochene Tier nicht heilen und das noch stehende Tier[b] nicht versorgen wird. Stattdessen wird er das Fleisch der fetten Tiere fressen und ihnen die Klauen abreißen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder nach einer kontextuellen Deutung: „das verirrte Tier“. Das hebräische Wort הַנַּעַר bedeutet gewöhnlich „der Junge“ beziehungsweise hier „das junge Tier“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „das stehende Tier“; gemeint sein kann ein Tier, das noch aufrecht und damit noch kräftig beziehungsweise gesund ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵקִים
  choice: lasse … auftreten
  rationale: Der Hifil von קום bezeichnet hier Gottes veranlassendes Handeln. „Auftreten lassen“ ist im Deutschen natürlich und legt keine förmliche Amtseinsetzung fest.
- source_word: רֹעֶה
  choice: einen Hirten
  rationale: Die übliche Bezeichnung für einen Hirten bewahrt sowohl das konkrete Herdenbild als auch seine mögliche übertragene Bedeutung für einen Leiter.
- source_word: הַנִּכְחָדוֹת
  choice: die zugrunde gehenden Tiere
  rationale: Die passive Form bezeichnet Tiere, die verschwinden beziehungsweise umkommen. Die Wiedergabe hält den Vorgang offen, ohne vorschnell nur „verloren“ oder „vernichtet“ zu wählen.
- source_word: יִפְקֹד
  choice: sich um … kümmern
  rationale: פקד kann besuchen, beachten oder sich fürsorglich annehmen bedeuten. Im Hirtenbild gibt „sich kümmern“ den weiten kontextuellen Sinn natürlich wieder.
- source_word: הַנַּעַר
  choice: das junge Tier
  rationale: נער bezeichnet gewöhnlich einen jungen Menschen oder ein Junges. Die formal naheliegende Bedeutung bleibt im Haupttext erhalten; die kontextuelle Deutung als verirrtes Tier steht in der Fußnote.
- source_word: יְבַקֵּשׁ
  choice: suchen
  rationale: Dies ist die direkte und im Hirtenbild natürliche Wiedergabe von בקש.
- source_word: הַנִּשְׁבֶּרֶת
  choice: das gebrochene Tier
  rationale: Das passive Partizip von שבר bedeutet wörtlich „gebrochen“ und kann körperliche Verletzung ebenso wie bildhafte Gebrochenheit ausdrücken.
- source_word: יְרַפֵּא
  choice: heilen
  rationale: רפא bedeutet „heilen“. Eine Wiedergabe mit „verbinden“ würde ein hier nicht ausdrücklich vorhandenes Bild eintragen.
- source_word: הַנִּצָּבָה
  choice: das noch stehende Tier
  rationale: Die Form von נצב bezeichnet wörtlich das stehende Tier. „Noch“ macht die idiomatische Bedeutung im Kontext verständlich, ohne sie vollständig als „gesund“ festzulegen.
- source_word: יְכַלְכֵּל
  choice: versorgen
  rationale: כלכל kann ernähren, erhalten oder versorgen bedeuten. „Versorgen“ wahrt die Breite und passt zum Gegensatz des pflichtvergessenen Hirten.
- source_word: הַבְּרִיאָה
  choice: das fette Tier
  rationale: בריא kann fett, kräftig oder wohlgenährt bedeuten. Im Bild des verzehrenden Hirten bringt „fett“ die begehrte Beute prägnant zum Ausdruck.
- source_word: פַרְסֵיהֶן
  choice: ihnen die Klauen
  rationale: פרסה bezeichnet bei Schafen den gespaltenen Huf, auf Deutsch fachlich und idiomatisch „Klaue“. Das pluralische Suffix wird mit „ihnen“ sichtbar bewahrt.
- source_word: יְפָרֵק
  choice: abreißen
  rationale: Der Piel von פרק bezeichnet gewaltsames Losreißen oder Zerlegen. „Abreißen“ erhält die drastische Gewalttätigkeit des Bildes.
theological_decisions:
- issue: Identität des Hirten
  choice: Die Gestalt wird ohne weitere Identifizierung schlicht als „ein Hirte“ bezeichnet.
  alternative: „ein böser Hirte“, „ein nichtsnutziger Hirte“ oder die ausdrückliche Gleichsetzung mit einer bestimmten historischen beziehungsweise endzeitlichen Gestalt
  rationale: Der Vers schildert den Hirten eindeutig als grausam, nennt ihn an dieser Stelle aber nicht ausdrücklich „böse“ und identifiziert ihn nicht. Die Übersetzung bewahrt daher das prophetische Bild und seine theologische Spannung.
- issue: Göttliches Handeln beim Auftreten des Hirten
  choice: „ich lasse … auftreten“
  alternative: „ich setze … ein“
  rationale: Die Formulierung wahrt Gottes ausdrückliche Veranlassung als Gerichtshandeln, ohne daraus eine Billigung des Verhaltens oder eine näher definierte Amtseinsetzung abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholten Tierbezeichnungen verdeutlichen die Herdenmetaphorik und vermeiden unnatürliche substantivierte Adjektive. Der abschließende Satzwechsel hebt den Gegensatz zwischen unterlassener Fürsorge und räuberischer Gewalt hervor.
