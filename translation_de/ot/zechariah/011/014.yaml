  text: וָֽ/אֶגְדַּע֙ אֶת מַקְלִ֣/י הַ/שֵּׁנִ֔י אֵ֖ת הַ/חֹֽבְלִ֑ים לְ/הָפֵר֙ אֶת הָֽ/אַחֲוָ֔ה בֵּ֥ין יְהוּדָ֖ה וּ/בֵ֥ין יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/014.yaml
  text: Then I cut in pieces my second staff[a], Union, to break the brotherhood between Judah and Israel.
translation:
  language: de
  text: Dann hieb ich meinen zweiten Stab, »Verbundenheit«, entzwei, um die Bruderschaft zwischen Juda und Israel aufzuheben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶגְדַּע
  choice: Dann zerbrach ich
  rationale: גדע bezeichnet ein Abhauen oder Abtrennen. Bei einem Stab gibt »zerbrach« die symbolische Zerstörung natürlich wieder; die konkretere Nuance des Abhauens wird nicht überbetont.
- source_word: מַקְלִי הַשֵּׁנִי
  choice: meinen zweiten Stab
  rationale: מַקֵּל bedeutet »Stab«; הַשֵּׁנִי bezeichnet hier in der Abfolge der beiden Stäbe den zweiten.
- source_word: הַחֹבְלִים
  choice: »Verbundenheit«
  rationale: Der Ausdruck ist der Name des zweiten Stabes. Er hängt mit dem Binden beziehungsweise mit Bindungen zusammen und bezeichnet im Kontext den Zusammenhalt zwischen Juda und Israel.
- source_word: לְהָפֵר
  choice: um ... zu zerbrechen
  rationale: הפר kann »brechen«, »aufheben« oder »unwirksam machen« bedeuten. »Zerbrechen« bewahrt die Verbindung zwischen der symbolischen Handlung am Stab und dem Ende der Beziehung.
- source_word: הָאַחֲוָה
  choice: die Bruderschaft
  rationale: אַחֲוָה bezeichnet eine brüderliche Verbundenheit. »Bruderschaft« bewahrt die ausdrücklich verwandtschaftliche Metapher und deren politische Dimension.
- source_word: בֵּין יְהוּדָה וּבֵין יִשְׂרָאֵל
  choice: zwischen Juda und Israel
  rationale: Die Wiedergabe folgt der klaren historischen und politischen Gegenüberstellung des Hebräischen ohne erklärende Erweiterung.
theological_decisions:
- issue: Wiedergabe des symbolischen Namens הַחֹבְלִים
  choice: »Verbundenheit«
  alternative: »Bande« oder »Bindende«
  rationale: »Verbundenheit« ist als Stabname im modernen Deutsch verständlich und bringt seine Funktion im Kontext zum Ausdruck. Die stärker formalen Alternativen bleiben in der Fußnote sichtbar.
- issue: Wiedergabe der verwandtschaftlichen Metapher אַחֲוָה
  choice: Bruderschaft
  alternative: Einheit oder Gemeinschaft
  rationale: Das Hebräische verwendet ausdrücklich eine brüderlich-verwandtschaftliche Metapher. »Bruderschaft« erhält diese Spannung, statt sie zu einer allgemeinen Einheit zu verflachen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von »zerbrechen« verbindet bewusst die konkrete symbolische Handlung mit ihrer zwischenmenschlich-politischen Bedeutung. Deutsche Anführungszeichen kennzeichnen den symbolischen Eigennamen des Stabes.
