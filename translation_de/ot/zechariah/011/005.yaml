  naturalness: Modernes Standarddeutsch mit angemessen würdigem, prophetischem Register. Die wiederholte Konstruktion „deren Käufer …, deren Verkäufer …“ ist klar und natürlich. Direkte Rede, Satzzeichen und der abschließende Ausdruck „kein Erbarmen mit ihnen haben“ sind idiomatisch.
