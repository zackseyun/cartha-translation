source:
  edition: WLC
  text: אֲשֶׁ֨ר קֹנֵי/הֶ֤ן יַֽהֲרְגֻ/ן֙ וְ/לֹ֣א יֶאְשָׁ֔מוּ וּ/מֹכְרֵי/הֶ֣ן יֹאמַ֔ר בָּר֥וּךְ יְהוָ֖ה וַ/אעְשִׁ֑ר וְ/רֹ֣עֵי/הֶ֔ם לֹ֥א יַחְמ֖וֹל עֲלֵי/הֶֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/005.yaml
  text: whose buyers slaughter them and are not held guilty[a], and whose sellers say, “Blessed be Yahweh[b], for I have become rich,” and their shepherds have no compassion on them.
translation:
  language: de
  text: 'deren Käufer sie abschlachten und nicht für schuldig erklärt werden[a], deren Verkäufer sagen: »Gepriesen sei Jahwe, denn ich bin reich geworden!«, und deren Hirten kein Erbarmen mit ihnen haben[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und keine Schuld auf sich laden«; sinngemäß auch: »und ungestraft bleiben«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »und sie nicht schonen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: deren
  rationale: Leitet einen Relativsatz ein, der auf die Herde beziehungsweise die Schafe im vorigen Zusammenhang zurückweist; im Deutschen verbindet „deren“ diesen Satz natürlich mit den folgenden Besitzbezeichnungen.
- source_word: קֹנֵיהֶן
  choice: Käufer
  rationale: Das Partizip von קנה bezeichnet hier im Gegenüber zu den Verkäufern diejenigen, die die Schafe kaufen beziehungsweise erwerben; „Käufer“ bewahrt die Markt- und Ausbeutungsmetaphorik.
- source_word: יַהֲרְגֻן
  choice: abschlachten
  rationale: Das Verb bedeutet „töten“. Im Bild einer zum Schlachten bestimmten Herde gibt „abschlachten“ sowohl den konkreten Zusammenhang als auch die brutale Behandlung wieder.
- source_word: וְלֹא יֶאְשָׁמוּ
  choice: und nicht für schuldig erklärt werden
  rationale: אשם kann das Schuldigwerden oder die Feststellung von Schuld ausdrücken. Die gewählte Formulierung bewahrt die passivische beziehungsweise rechenschaftsbezogene Lesart, ohne die mögliche Eigenverschuldung auszuschließen; diese steht in der Fußnote.
- source_word: וּמֹכְרֵיהֶן יֹאמַר
  choice: deren Verkäufer sagen
  rationale: Obwohl יֹאמַר formal im Singular steht, ist מֹכְרֵיהֶן pluralisch. Der deutsche Plural folgt dem Sinn und vermeidet eine ungrammatische Konstruktion; die anschließende Ich-Rede gibt den typischen Ausspruch jedes Verkäufers wieder.
- source_word: בָּרוּךְ יְהוָה
  choice: Gepriesen sei Jahwe
  rationale: Die geläufige Segensformel wird würdig und ausrufend wiedergegeben; der Gottesname bleibt als Eigenname erkennbar.
- source_word: וָאֶעְשִׁר
  choice: denn ich bin reich geworden
  rationale: Die Hifil-Form von עשר bezeichnet hier das Erlangen von Reichtum. Das Perfekt gibt das erreichte Ergebnis und den selbstzufriedenen Ton des Verkäufers wieder.
- source_word: וְרֹעֵיהֶם
  choice: und deren Hirten
  rationale: „Hirten“ erhält die prophetische Metapher für diejenigen, die für die Herde verantwortlich sind, ohne sie vorschnell als politische oder religiöse Amtsträger festzulegen.
- source_word: לֹא יַחְמֹל עֲלֵיהֶן
  choice: kein Erbarmen mit ihnen haben
  rationale: חמל umfasst Mitleid, Schonung und Erbarmen. Die Hauptfassung betont die erbarmungslose Haltung; die konkrete Alternative „sie nicht schonen“ wird in der Fußnote bewahrt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR / Jehova
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. „Jahwe“ ist die im modernen Deutschen übliche wissenschaftliche Wiedergabe und bewahrt den Charakter als Gottesname.
- issue: Metaphorische Bezeichnung רֹעִים
  choice: Hirten
  alternative: Führer / geistliche Leiter
  rationale: Die Bildsprache des Ausgangstextes bleibt stehen. Eine Deutung als bestimmte politische oder kirchliche Leitungsgruppe würde die im Vers nicht aufgelöste Reichweite der Metapher unnötig einschränken.
- issue: Schuldformulierung וְלֹא יֶאְשָׁמוּ
  choice: nicht für schuldig erklärt werden
  alternative: keine Schuld auf sich laden / ungestraft bleiben
  rationale: Die Hauptfassung hält die Feststellung beziehungsweise Zurechnung von Schuld im Vordergrund. Die Fußnote bewahrt die ebenso mögliche intransitive Deutung; „ungestraft bleiben“ wäre kontextuell plausibel, würde Schuld und Strafe jedoch stärker gleichsetzen als das hebräische Verb selbst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Handels- und Hirtenmetaphorik bleibt erhalten. Der Vers ist als Relativsatz formuliert, weil er syntaktisch an die Herde des vorhergehenden Verses anschließt. Die Singularform der direkten Rede bleibt trotz des pluralischen deutschen Subjekts stehen, da sie den charakteristischen Ausspruch jedes einzelnen Verkäufers wiedergibt.
