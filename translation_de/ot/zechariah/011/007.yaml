  text: וָֽ/אֶרְעֶה֙ אֶת צֹ֣אן הַֽ/הֲרֵגָ֔ה לָ/כֵ֖ן עֲנִיֵּ֣י הַ/צֹּ֑אן וָ/אֶקַּֽח לִ֞/י שְׁנֵ֣י מַקְל֗וֹת לְ/אַחַ֞ד קָרָ֤אתִי נֹ֨עַם֙ וּ/לְ/אַחַד֙ קָרָ֣אתִי חֹֽבְלִ֔ים וָ/אֶרְעֶ֖ה אֶת הַ/צֹּֽאן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/007.yaml
  text: So I shepherded the flock doomed to slaughter, namely the afflicted of the flock. Then I took for myself two staffs; one I named Favor, and the other I named Union, and I shepherded the flock.
translation:
  language: de
  text: Da weidete ich die Herde, die zur Schlachtung bestimmt war, und zwar die Elenden der Herde.[a] Dann nahm ich mir zwei Stäbe. Den einen nannte ich »Gunst«, den anderen »Verbindung«.[b] Und ich weidete die Herde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Verbindung von »darum/deshalb« (hebräisch: laken) mit »den Elenden der Herde« ist im hebräischen Text syntaktisch schwierig. Die Übersetzung versteht die Worte appositionell. Manche schlagen eine Textänderung vor, die »für die Schafhändler« ergäbe.'
    reason: Die Fußnote grenzt die konkrete syntaktische Schwierigkeit genauer ein und kennzeichnet die Lesart „für die Schafhändler“ zutreffend als vorgeschlagene Textänderung.
  - marker: b
    text: 'Hebräisch: Chobelim; der Name gehört zum Wortfeld »binden« und kann auch »Bindungen« oder »Bande« bedeuten.'
    reason: Die Fußnote wahrt das Bedeutungsspektrum des pluralischen symbolischen Namens und erklärt die gewählte Wiedergabe.
lexical_decisions:
- source_word: צֹאן הַהֲרֵגָה
  choice: die Herde, die zur Schlachtung bestimmt war
  rationale: Die Wendung bezeichnet eine Herde, der die Schlachtung bevorsteht. Die explizite Formulierung ist im modernen Deutsch natürlicher und bewahrt den Gedanken des Verhängnisses.
- source_word: עֲנִיֵּי הַצֹּאן
  choice: die Elenden der Herde
  rationale: עָנִי bezeichnet Arme, Bedrängte oder Elende. »Elenden« hält soziale Not und Unterdrückung offen, ohne die Gruppe enger festzulegen.
- source_word: נֹעַם
  choice: Gunst
  rationale: Das Wort kann Anmut, Wohlgefallen, Freundlichkeit oder Gunst bezeichnen. Als symbolischer Name des Stabes ist »Gunst« knapp und kontextuell passend.
- source_word: חֹבְלִים
  choice: Verbindung
  rationale: Der Name gehört zum Wortfeld des Bindens; Sacharja 11,14 deutet ihn als Verbindung zwischen Juda und Israel. »Verbindung« wahrt dieses Wortspiel besser als ein abstrakteres »Eintracht«.
theological_decisions:
- issue: Bezug und Funktion von לָכֵן עֲנִיֵּי הַצֹּאן
  choice: und zwar die Elenden der Herde
  alternative: darum, ihr Elenden der Herde / für die Schafhändler
  rationale: Der masoretisch vokalisierte Text ist syntaktisch schwierig. Die appositionelle Deutung entspricht dem unmittelbaren Zusammenhang und der englischen Konsultationsfassung, ohne die textliche Schwierigkeit zu verschweigen; alternative Auffassungen werden in der Fußnote genannt.
- issue: Symbolischer Gehalt des zweiten Stabnamens חֹבְלִים
  choice: Verbindung
  alternative: Bande / Eintracht / Binder
  rationale: Die Übersetzung benennt die bindende Beziehung, ohne schon eine weitergehende dogmatische Deutung des Symbols festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Formulierung »So weidete ich die Herde« bildet die Rahmung des hebräischen Verses ab. Die Namen der Stäbe stehen als sprechende Namen in deutschen Anführungszeichen.
