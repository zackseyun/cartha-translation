base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/010.yaml
  text: Then I took my staff Favor and cut it in two[a], to break my covenant that I had made with all the peoples.
translation:
  language: de
  text: Dann nahm ich meinen Stab »Gunst« und hieb ihn entzwei, um meinen Bund aufzuheben, den ich mit allen Völkern[a] geschlossen hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit allen Nationen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַקְלִי
  choice: meinen Stab
  rationale: מַקֵּל bezeichnet einen Stab oder Stock. Im Bild des Hirten ist »Stab« im Deutschen natürlich und sachgerecht.
- source_word: נֹעַם
  choice: »Gunst«
  rationale: Der Begriff ist hier der bedeutungstragende Name des Stabes. »Gunst« gibt den Sinn von Wohlwollen und Annehmlichkeit knapp wieder, ohne ihn auf eine bestimmte dogmatische Deutung festzulegen.
- source_word: וָאֶגְדַּע אֹתוֹ
  choice: hieb ihn entzwei
  rationale: גדע bedeutet abschneiden oder abhauen. Die Formulierung bezeichnet die sichtbare symbolische Zerstörung des Stabes und klingt im Deutschen natürlich.
- source_word: לְהָפֵיר
  choice: um ... aufzuheben
  rationale: הפר kann bei einem Bund dessen Bruch, Aufhebung oder Außerkraftsetzung bezeichnen. »Aufheben« bringt hier die beabsichtigte Ungültigmachung zum Ausdruck.
- source_word: בְּרִיתִי
  choice: meinen Bund
  rationale: בְּרִית ist der übliche Ausdruck für einen Bund und wird entsprechend mit dem etablierten deutschen Begriff wiedergegeben.
- source_word: כָּרַתִּי
  choice: geschlossen hatte
  rationale: כרת ברית ist die hebräische Wendung für »einen Bund schließen«. Das Plusquamperfekt verdeutlicht, dass der Bund der symbolischen Aufhebung vorausging.
- source_word: כָּל הָעַמִּים
  choice: allen Völkern
  rationale: Der Plural עַמִּים wird als »Völker« bewahrt. Der Ausdruck bleibt bewusst weit und wird nicht auf eine bestimmte Gruppe eingeengt.
theological_decisions:
- issue: Reichweite des Bundes mit »allen Völkern«
  choice: Die breite Formulierung »mit allen Völkern« bleibt im Haupttext erhalten.
  alternative: »mit allen Nationen« oder eine kontextuelle Einengung auf Israel beziehungsweise die umliegenden Völker
  rationale: Der hebräische Text nennt ausdrücklich »alle Völker«, ohne den Bezug in diesem Vers näher einzugrenzen. Die Übersetzung bewahrt diese Offenheit und die damit verbundene theologische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anführungszeichen kennzeichnen »Gunst« eindeutig als Namen des Stabes. »Hieb ... entzwei« wahrt den konkreten symbolischen Charakter der Handlung; »aufheben« ist bei einem Bund idiomatisch und weniger missverständlich als ein rein körperlich klingendes »brechen«.
