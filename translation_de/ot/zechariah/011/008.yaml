source:
  edition: WLC
  text: וָ/אַכְחִ֛ד אֶת שְׁלֹ֥שֶׁת הָ/רֹעִ֖ים בְּ/יֶ֣רַח אֶחָ֑ד וַ/תִּקְצַ֤ר נַפְשִׁ/י֙ בָּ/הֶ֔ם וְ/גַם נַפְשָׁ֖/ם בָּחֲלָ֥ה בִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/008.yaml
  text: So I removed the three shepherds in one month[a], and my soul grew impatient with them[c][b], and their soul also loathed me.
translation:
  language: de
  text: So beseitigte ich die drei Hirten in einem einzigen Monat.[a] Und ich verlor die Geduld mit ihnen,[b] und auch sie empfanden Abscheu vor mir.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „schaffte ich die drei Hirten aus dem Weg“ beziehungsweise „vernichtete ich die drei Hirten“. Das hebräische Verb kann bedeuten, dass jemand zum Verschwinden gebracht oder ausgeschaltet wird. Wer mit den drei Hirten gemeint ist, sagt der Text nicht.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht hier eine hebräische Redewendung mit „meine Seele“, die tiefe Ungeduld oder starken Überdruss ausdrückt.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „und auch ihre Seele empfand Abscheu vor mir“. „Seele“ bezeichnet hier idiomatisch die Betreffenden selbst.'
    reason: translation_clarity
lexical_decisions:
- source_word: וָאַכְחִד
  choice: beseitigte ich
  rationale: Das Hifil von כחד bezeichnet hier ein Verschwindenlassen oder Ausschalten. „Beseitigte“ gibt die entschiedene Handlung wieder, ohne festzulegen, ob die Hirten getötet, abgesetzt oder auf andere Weise entfernt wurden.
- source_word: שְׁלֹשֶׁת הָרֹעִים
  choice: die drei Hirten
  rationale: Die wörtliche Metapher bleibt erhalten; der Vers selbst identifiziert die Hirten nicht näher.
- source_word: בְּיֶרַח אֶחָד
  choice: in einem einzigen Monat
  rationale: Die Formulierung bezeichnet einen einzelnen Monat; „einzigen“ hebt die im Hebräischen betonte zeitliche Verdichtung natürlich hervor.
- source_word: וַתִּקְצַר נַפְשִׁי בָּהֶם
  choice: ich verlor die Geduld mit ihnen
  rationale: Die Wendung קצר נפש ist ein Idiom für Ungeduld, Überdruss oder nachlassende Duldsamkeit. Die natürliche deutsche Wiedergabe vermittelt den Sinn, ohne die im Deutschen missverständliche wörtliche Form „meine Seele wurde kurz“ zu übernehmen.
- source_word: וְגַם נַפְשָׁם בָּחֲלָה בִי
  choice: und auch sie empfanden Abscheu vor mir
  rationale: בחל drückt starken Widerwillen, Abscheu oder Ekel aus. Die deutsche Form gibt die Intensität wieder und versteht נַפְשָׁם idiomatisch als die Personen selbst.
theological_decisions:
- issue: Identität der drei Hirten
  choice: Die Metapher „die drei Hirten“ wird ohne Identifizierung beibehalten.
  alternative: Deutung als drei bestimmte historische Führer, als drei Führungsgruppen oder als symbolische Darstellung verdorbener Leitung.
  rationale: Der hebräische Text nennt keine Identität. Eine nähere Bestimmung im Haupttext würde eine nicht ausdrücklich gegebene Auslegung festschreiben.
- issue: Wechselseitige Entfremdung
  choice: Die gegenseitige Spannung zwischen dem Sprecher und den Hirten bleibt bestehen.
  alternative: Eine Abschwächung zu bloßer Unzufriedenheit auf einer oder beiden Seiten.
  rationale: Beide hebräischen Aussagen sind emotional stark; zugleich verwendet der Text für die beiden Seiten unterschiedliche Wendungen, die nicht gleichgesetzt werden sollten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Hirtenmetapher und ihre nicht erklärte Identität bleiben erhalten. Hebräische Seelen-Idiome werden im Haupttext natürlich wiedergegeben und in den Fußnoten transparent gemacht.
