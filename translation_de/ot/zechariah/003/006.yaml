  text: וַ/יָּ֨עַד֙ מַלְאַ֣ךְ יְהוָ֔ה בִּ/יהוֹשֻׁ֖עַ לֵ/אמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/006.yaml
  text: Then the angel of Yahweh solemnly charged Joshua[a], saying,
translation:
  language: de
  text: 'Da schärfte der Engel Jahwes Josua nachdrücklich ein und sagte:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּעַד
  choice: Da ermahnte … eindringlich
  rationale: Das Verb bezeichnet hier eine nachdrückliche, feierlich-ernste Mahnung beziehungsweise Verpflichtung. Die Konstruktion gibt zugleich die durch וַ angezeigte Erzählfolge natürlich wieder.
- source_word: מַלְאַךְ יְהוָה
  choice: der Engel Jahwes
  rationale: מַלְאַךְ kann »Bote« oder »Engel« bedeuten; im Zusammenhang der Vision liegt »Engel« näher. Der Gottesname יהוה wird als »Jahwe« wiedergegeben.
- source_word: בִּיהוֹשֻׁעַ
  choice: Josua
  rationale: Die Präposition בְּ kennzeichnet bei יעד die angesprochene Person. Im Deutschen verlangt »jemanden ermahnen« kein zusätzliches Verhältniswort.
- source_word: לֵאמֹר
  choice: und sagte
  rationale: Die hebräische Formel leitet die folgende direkte Rede ein. »Und sagte« ist im modernen Deutsch natürlicher als das partizipiale »sprechend«.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als Gottesname kenntlich erhalten; »Jahwe« ist die im modernen Deutschen übliche wissenschaftliche Form.
- issue: Bedeutung von מַלְאַךְ im Visionskontext
  choice: Engel
  alternative: Bote
  rationale: Beide Bedeutungen sind lexikalisch möglich, doch die himmlische Gestalt in dieser Vision wird im Deutschen am natürlichsten als »Engel« bezeichnet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Eindringlich ermahnen« bewahrt den feierlichen Nachdruck, ohne durch eine juristisch oder konfessionell verengte Formulierung mehr festzulegen als der hebräische Text.
