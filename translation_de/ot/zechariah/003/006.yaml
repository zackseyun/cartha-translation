  naturalness: „Da schärfte der Engel Jahwes Josua nachdrücklich ein und sagte:“ ist modernes, verständliches Standarddeutsch und leitet die in V. 7 folgende Rede klar ein. Die Wortstellung vermeidet das etwas schwerfällige „eindringlich ermahnte“ und bewahrt den gehobenen Erzählton.
