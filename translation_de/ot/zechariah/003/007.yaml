  text: כֹּה אָמַ֞ר יְהוָ֣ה צְבָא֗וֹת אִם בִּ/דְרָכַ֤/י תֵּלֵךְ֙ וְ/אִ֣ם אֶת מִשְׁמַרְתִּ֣/י תִשְׁמֹ֔ר וְ/גַם אַתָּה֙ תָּדִ֣ין אֶת בֵּיתִ֔/י וְ/גַ֖ם תִּשְׁמֹ֣ר אֶת חֲצֵרָ֑/י וְ/נָתַתִּ֤י לְ/ךָ֙ מַהְלְכִ֔ים בֵּ֥ין הָ/עֹמְדִ֖ים הָ/אֵֽלֶּה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/007.yaml
  text: 'Thus says Yahweh of hosts: If you walk in my ways and if you keep my charge[a], then you also shall govern my house and also keep my courts, and I will give you free access among these who are standing here.'
translation:
  language: de
  text: 'So spricht Jahwe der Heerscharen: Wenn du auf meinen Wegen gehst und meinen Auftrag erfüllst, dann sollst auch du mein Haus leiten und meine Höfe hüten. Und ich werde dir freien Zugang unter denen gewähren, die hier stehen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „freie Bewegung unter denen, die hier stehen“. Das Hebräische kann möglicherweise auch bedeuten: „Wandelnde unter denen, die hier stehen“ oder „Orte zum Gehen unter denen, die hier stehen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; „der Heerscharen“ bewahrt die breite Bedeutung des feststehenden göttlichen Titels, ohne ihn auf menschliche Armeen zu verengen.
- source_word: בִּדְרָכַי תֵּלֵךְ
  choice: auf meinen Wegen gehst
  rationale: Die im Hebräischen gebrauchte Weg-Metapher bleibt erhalten und ist im Deutschen als Ausdruck für eine gottgemäße Lebensführung verständlich.
- source_word: מִשְׁמַרְתִּי תִשְׁמֹר
  choice: meinen Auftrag erfüllst
  rationale: מִשְׁמֶרֶת bezeichnet hier eine anvertraute Pflicht beziehungsweise einen priesterlichen Dienstauftrag. „Auftrag erfüllen“ gibt diesen Verpflichtungscharakter natürlich wieder.
- source_word: תָּדִין אֶת־בֵּיתִי
  choice: mein Haus leiten
  rationale: דִּין kann richten, Recht sprechen oder verwalten bedeuten. Im Zusammenhang mit dem Tempel bezeichnet „leiten“ am ehesten die übertragene Aufsicht, ohne die Bedeutung auf gerichtliche Tätigkeit zu beschränken.
- source_word: תִּשְׁמֹר אֶת־חֲצֵרָי
  choice: meine Vorhöfe hüten
  rationale: „Vorhöfe“ bezeichnet im Tempelzusammenhang die umschlossenen Bereiche; „hüten“ bewahrt den Gedanken verantwortlicher Aufsicht und Bewahrung.
- source_word: מַהְלְכִים
  choice: freien Zugang
  rationale: Das seltene und umstrittene Wort scheint hier ein gewährtes Recht auf Bewegung oder Zutritt zu bezeichnen. „Freien Zugang“ drückt dieses Vorrecht im himmlischen Hof aus, ohne Einzelheiten festzulegen.
- source_word: בֵּין הָעֹמְדִים הָאֵלֶּה
  choice: unter denen, die hier stehen
  rationale: בֵּין wird in dieser Personengruppe idiomatisch mit „unter“ wiedergegeben. Die Formulierung lässt offen, wer die im Visionsbild stehenden Anwesenden genau sind.
- source_word: וְגַם ... וְגַם
  choice: dann sollst auch du … und …
  rationale: „Auch du“ bewahrt die emphatische Hinzufügung; die Koordination der beiden Aufgaben wird in natürlichem Deutsch mit „und“ ausgedrückt.
theological_decisions:
- issue: Bedeutung der Zusage וְנָתַתִּי לְךָ מַהְלְכִים בֵּין הָעֹמְדִים הָאֵלֶּה
  choice: Eine Zusage freien Zugangs unter den im himmlischen Hof Stehenden
  alternative: „Wandelnde“ beziehungsweise Begleiter oder „Orte/Wege zum Gehen“ unter den hier Stehenden
  rationale: מַהְלְכִים ist selten und mehrdeutig. Der visionäre Zusammenhang legt ein Vorrecht des Zutritts oder der freien Bewegung in Gottes Gegenwart nahe. Da andere grammatische Deutungen möglich bleiben, werden sie in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem konditionalen Aufbau des Hebräischen, vermeidet jedoch unnötig hölzerne Formulierungen. Die seltene Schlusswendung wird im Haupttext verständlich wiedergegeben und ihre echte Mehrdeutigkeit in der Fußnote bewahrt.
