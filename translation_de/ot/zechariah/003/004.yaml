  source_fidelity: Die Übersetzung gibt die Erzählhandlung, den pluralischen Befehl, die schmutzigen Gewänder und die Wegnahme von Josuas Schuld insgesamt zutreffend wieder. Die präsentische Formulierung »und bekleide dich« legt jedoch eine performative Gegenwart fest und ist im Deutschen zudem weniger klar als die im Kontext naheliegende zukunfts- bzw. folgebezogene Zusage. Die Konstruktion וְהַלְבֵּשׁ אֹתְךָ ist syntaktisch markiert; »ich werde dich ... bekleiden« gibt ihre Fortsetzung der göttlichen Erklärung idiomatisch wieder, ohne eine zusätzliche theologische Deutung einzutragen.
  naturalness: »Da antwortete er und sagte« bewahrt die hebräische Formel und bleibt in einem würdigen modernen Bibelregister verständlich. Die direkte Rede ist natürlich. Der Fußnotenanker zur Bedeutung von מַחֲלָצוֹת muss unmittelbar bei »kostbaren Gewändern« stehen, nicht erst nach dem ganzen Zitat.
  terminology: »Schuld« wahrt bei עָוֹן die mögliche Spannweite von Vergehen und Schuld. »Schmutzige Gewänder« vermittelt die starke Verunreinigung von צֹאִים angemessen. »Kostbare Gewänder« gibt מַחֲלָצוֹת als hochwertige bzw. stattliche Kleidung wieder; die Alternativen gehören in die Fußnote.
