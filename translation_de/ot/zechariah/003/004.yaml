base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/004.yaml
  text: And he answered and said to those standing before him[a], “Remove the filthy garments from upon him.” Then he said to him, “See, I have taken your iniquity away from upon you[b], and I will clothe you with fine garments.”
translation:
  language: de
  text: 'Da antwortete er und sagte zu denen, die vor ihm standen:[a] »Zieht ihm die schmutzigen Gewänder aus!« Dann sagte er zu ihm: »Sieh, ich habe deine Schuld von dir weggenommen, und ich werde dich mit kostbaren Gewändern[b] bekleiden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die vor ihm Stehenden sind dem Zusammenhang nach wahrscheinlich himmlische Diener; der hebräische Text bezeichnet sie jedoch nur beschreibend.
    reason: alternative_reading
  - marker: b
    text: 'Oder: »festlichen Gewändern« beziehungsweise »prächtigen Gewändern«. Das seltene hebräische Wort bezeichnet wertvolle, stattliche Kleidung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן וַיֹּאמֶר
  choice: Und er antwortete und sagte
  rationale: Die Wiedergabe erhält die hebräische Erzählformel mit ענה und אמר, auch wenn keine ausdrückliche Frage vorausgeht.
- source_word: הָעֹמְדִים לְפָנָיו
  choice: zu denen, die vor ihm standen
  rationale: Die beschreibende Formulierung bleibt erhalten und deutet die Gestalten nicht ausdrücklich als Engel oder Diener.
- source_word: הַבְּגָדִים הַצֹּאִים
  choice: die schmutzigen Gewänder
  rationale: צֹאִים bezeichnet starken Schmutz beziehungsweise Verunreinigung; »schmutzig« ist im Deutschen anschaulich und natürlich, während »Gewänder« zur feierlichen Bildsprache passt.
- source_word: הָסִירוּ ... מֵעָלָיו
  choice: Zieht ihm ... aus
  rationale: Die idiomatische deutsche Wendung gibt den pluralischen Imperativ und das Entfernen der am Körper getragenen Kleidung präzise wieder.
- source_word: רְאֵה
  choice: Sieh
  rationale: Der Imperativ lenkt die Aufmerksamkeit auf die Bedeutung der symbolischen Handlung.
- source_word: הֶעֱבַרְתִּי מֵעָלֶיךָ עֲוֺנֶךָ
  choice: ich habe deine Schuld von dir weggenommen
  rationale: עָוֹן kann Vergehen, Schuld oder Schuldfolge bezeichnen. Im Zusammenhang der Entfernung von Verunreinigung wahrt »Schuld« diese Bedeutungsbreite besser als eine einseitige Festlegung auf »Sünde«.
- source_word: וְהַלְבֵּשׁ אֹתְךָ
  choice: und bekleide dich
  rationale: Die Form kann als Fortsetzung der direkten Erklärung beziehungsweise als performative Handlung verstanden werden. Das Präsens vermeidet eine unnötige Festlegung auf Zukunft oder Vergangenheit.
- source_word: מַחֲלָצוֹת
  choice: kostbare Gewänder
  rationale: Das seltene Wort bezeichnet stattliche, wertvolle oder festliche Kleidung. »Kostbare Gewänder« vermittelt Würde und hohen Wert, ohne einen bestimmten kultischen Anlass festzulegen.
theological_decisions:
- issue: Symbolische Bedeutung des Kleiderwechsels
  choice: Die Entfernung der schmutzigen Gewänder wird unmittelbar mit der Wegnahme der Schuld verbunden, ohne die Szene dogmatisch weiter auszudeuten.
  alternative: Ausdrückliche Deutung als Rechtfertigung oder Wiedereinsetzung in das Priesteramt.
  rationale: Der Vers stellt die symbolische Verbindung selbst her, formuliert aber keine spätere systematisch-theologische Kategorie.
- issue: Identität der vor ihm Stehenden
  choice: 'Beschreibend: »denen, die vor ihm standen«.'
  alternative: »seinen Dienern« oder »den Engeln«.
  rationale: Der Zusammenhang legt himmlische Diener nahe, doch der hebräische Text bezeichnet sie hier lediglich durch ihre Stellung vor ihm.
- issue: Zeitwert von וְהַלְבֵּשׁ
  choice: 'Präsentisch-performativ: »und bekleide dich«.'
  alternative: 'Futurisch: »und ich werde dich bekleiden«; perfektisch: »und ich habe dich bekleidet«.'
  rationale: Die knappe hebräische Form ist syntaktisch ungewöhnlich und lässt den Zeitbezug offen. Die deutsche Fassung bewahrt die Nähe zur gegenwärtigen symbolischen Handlung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht formelhafte Wendung »antwortete und sagte« bewahrt den hebräischen Erzählton; sonst folgt die Syntax natürlichem Deutsch. Beide Fußnotenmarker stehen an den jeweils einschlägigen Textstellen.
