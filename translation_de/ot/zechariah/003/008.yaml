  text: שְֽׁמַֽע נָ֞א יְהוֹשֻׁ֣עַ הַ/כֹּהֵ֣ן הַ/גָּד֗וֹל אַתָּה֙ וְ/רֵעֶ֨י/ךָ֙ הַ/יֹּשְׁבִ֣ים לְ/פָנֶ֔י/ךָ כִּֽי אַנְשֵׁ֥י מוֹפֵ֖ת הֵ֑מָּה כִּֽי הִנְ/נִ֥י מֵבִ֛יא אֶת עַבְדִּ֖/י צֶֽמַח־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/008.yaml
  text: Hear now[a], Joshua the high priest, you and your companions who sit before you, for they are men of a sign; for behold, I am bringing my servant, the Branch.
translation:
  language: de
  text: Hör doch, Josua, du Hohepriester, du und deine Gefährten, die vor dir sitzen! Denn sie sind Männer, die ein Zeichen sind[a]. Denn siehe, ich bringe meinen Diener, den Spross[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Männer eines Zeichens; auch: Männer eines Vorzeichens oder einer bedeutungsvollen Erscheinung.'
    reason: אַנְשֵׁי מוֹפֵת ist eine knappe, mehrdeutige Konstruktion. Die Fußnote dokumentiert mögliche Wiedergaben, ohne den genauen Charakter des Zeichens festzulegen.
  - marker: b
    text: 'Oder: den Trieb; das hebräische Wort bezeichnet etwas, das hervorsprosst, und wird hier titelartig gebraucht.'
    reason: צֶמַח wahrt ein Pflanzenbild und fungiert im Kontext zugleich als titelartige Bezeichnung.
lexical_decisions:
- source_word: שְׁמַע נָא
  choice: Höre doch
  rationale: Der Imperativ mit נָא ist eine nachdrückliche Aufforderung. „Höre doch“ wahrt den eindringlichen Ton, ohne die Partikel lediglich als höfliches „bitte“ wiederzugeben.
- source_word: יְהוֹשֻׁעַ
  choice: Jeschua
  rationale: Die hebräische Namensform wird nach geläufiger moderner deutscher Bibelkonvention als „Jeschua“ wiedergegeben und so von der griechisch geprägten Form „Jesus“ unterschieden.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: du Hohepriester
  rationale: „Hohepriester“ ist die etablierte deutsche Amtsbezeichnung. Das ergänzte „du“ bindet die Apposition natürlich an die direkte Anrede an.
- source_word: וְרֵעֶיךָ
  choice: deine Gefährten
  rationale: רֵעַ bezeichnet hier die Jeschua zugeordneten Männer; „Gefährten“ lässt offen, ob persönliche Freunde oder Amtsgenossen gemeint sind.
- source_word: הַיֹּשְׁבִים לְפָנֶיךָ
  choice: die vor dir sitzen
  rationale: Die partizipiale Wendung wird nah am Hebräischen wiedergegeben; „vor dir“ kann sowohl die räumliche Anordnung als auch ihre Anwesenheit bei Jeschua ausdrücken.
- source_word: אַנְשֵׁי מוֹפֵת
  choice: diese Männer sind ein Zeichen
  rationale: Die idiomatische deutsche Form macht die prädikative Bedeutung des kompakten hebräischen Ausdrucks deutlich, bewahrt aber mit „Zeichen“ dessen symbolische Offenheit.
- source_word: הִנְנִי מֵבִיא
  choice: siehe, ich lasse … kommen
  rationale: הִנְנִי leitet eine feierliche göttliche Ankündigung ein; die Konstruktion mit Partizip bezeichnet ein gewisses beziehungsweise bevorstehendes Handeln. „Ich lasse … kommen“ ist im Deutschen natürlich und wahrt, dass Gott die angekündigte Gestalt herbeiführt.
- source_word: עַבְדִּי
  choice: meinen Diener
  rationale: „Diener“ ist in diesem prophetischen Zusammenhang die angemessene Wiedergabe von עֶבֶד und bezeichnet den von Gott Beauftragten, ohne unnötig den Aspekt rechtlicher Sklaverei hervorzuheben.
- source_word: צֶמַח
  choice: den Spross
  rationale: „Spross“ gibt das Pflanzenbild von צֶמַח natürlich wieder und kann zugleich als titelartige Bezeichnung verstanden werden. Der bestimmte Akkusativ ergibt sich aus der appositionellen Bestimmung zu „meinen Diener“.
theological_decisions:
- issue: Ob צֶמַח ausdrücklich als messianischer Titel oder zunächst als bildhafte Bezeichnung wiederzugeben ist
  choice: den Spross
  alternative: den Zweig; den »Spross«
  rationale: Der Kontext legt eine titelartige Bezeichnung der erwarteten Gestalt nahe, doch das konkrete Wachstumsbild bleibt Teil der Aussage. „Spross“ bewahrt beides, ohne die Identität dieser Gestalt im Vers selbst weiter auszudeuten.
- issue: Wie stark אַנְשֵׁי מוֹפֵת auszudeuten ist
  choice: diese Männer sind ein Zeichen
  alternative: Männer eines Zeichens; Männer, die als Vorzeichen dienen
  rationale: Die Übersetzung macht die wahrscheinlich prädikative Aussage verständlich, lässt jedoch offen, in welchem Sinn die Männer Zeichen, Sinnbild oder Vorzeichen sind. Diese Bedeutungsbreite wird in der Fußnote dokumentiert.
translation_notes:
  register: Moderne, würdevolle prophetische Sprache. „Höre doch“ und „siehe“ erhalten den feierlich-eindringlichen Ton; Satzteilung und Doppelpunkt sorgen für natürliche deutsche Lesbarkeit. Die mehrdeutigen Bildwörter „Zeichen“ und „Spross“ werden nicht konfessionell ausgedeutet.
