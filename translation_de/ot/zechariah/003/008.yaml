  - severity: medium
    issue: „ich lasse meinen Diener kommen“ für מֵבִיא
    rationale: Das Partizip von בוא im Hifil bedeutet „bringen/herbeibringen“. „Lassen kommen“ fügt eine permissive bzw. indirekte Nuance ein, die der hebräische Text nicht verlangt.
  - severity: low
