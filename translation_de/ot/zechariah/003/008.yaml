  source_fidelity: 'Die Grundstruktur und die wesentlichen Begriffe sind zutreffend. Zwei sichere Korrekturen sind jedoch erforderlich: יְהוֹשֻׁעַ ist hier die volle Namensform und sollte im modernen deutschen Bibelgebrauch als „Josua“ wiedergegeben werden, nicht als „Jeschua“. Zudem bedeutet מֵבִיא unmittelbar „ich bringe“; „ich lasse ... kommen“ schwächt bzw. verändert die direkte Aussage unnötig.'
  naturalness: Die Anrede mit „Hör doch“ ist natürlich und würdevoll. „Denn sie sind Männer, die ein Zeichen sind“ ist im Deutschen verständlicher als die vorliegende Form mit dem nicht im Hebräischen markierten Demonstrativum „diese“ und bewahrt dennoch die knappe, symbolisch offene Aussage.
  terminology: „Hohepriester“, „Diener“ und „Spross“ sind angemessen. „Spross“ bewahrt das Pflanzenbild von צֶמַח und kann ohne weitergehende dogmatische Festlegung titelhaft verstanden werden. Die Schreibung „Josua“ entspricht der im Ausgangstext stehenden hebräischen Vollform יְהוֹשֻׁעַ.
