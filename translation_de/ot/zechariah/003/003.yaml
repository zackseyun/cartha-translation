base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/003.yaml
  text: Joshua was clothed with filthy garments and was standing before the angel[a][b][c].
translation:
  language: de
  text: Und Josua[a] war mit stark beschmutzten[b] Kleidern bekleidet und stand vor dem Engel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische „Und“ führt die Visionserzählung weiter; im Deutschen kann es auch unausgedrückt bleiben.
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet hier äußerst stark verunreinigte, widerwärtig beschmutzte Kleider; „besudelte“ ist ebenfalls möglich.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „der Bote“. Im Zusammenhang dieser Vision ist „Engel“ die naheliegendere Wiedergabe.'
    reason: alternative_reading
lexical_decisions:
- source_word: וִ/יהוֹשֻׁעַ
  choice: Und Josua
  rationale: Das Waw führt die Visionserzählung weiter. „Und“ lässt sich im Deutschen natürlich beibehalten; der Personenname wird in seiner üblichen deutschen biblischen Form wiedergegeben.
- source_word: הָיָה לָבֻשׁ
  choice: war … bekleidet
  rationale: Die Verbindung beschreibt einen anhaltenden Zustand, nicht den Vorgang des Ankleidens oder eine Zustandsänderung.
- source_word: בְּגָדִים
  choice: Kleidern
  rationale: „Kleider“ ist allgemein genug und legt nicht ohne ausdrücklichen sprachlichen Anlass eine bestimmte priesterliche Gewandart fest.
- source_word: צוֹאִים
  choice: schmutzigen
  rationale: Das Adjektiv bezeichnet einen stark verunreinigten, widerwärtigen Zustand. „Schmutzig“ ist klares heutiges Deutsch; die Fußnote weist auf die besondere Stärke des Ausdrucks hin.
- source_word: וְ/עֹמֵד
  choice: und stand
  rationale: Das Partizip bezeichnet Josuas andauernde Haltung während der beschriebenen Szene. Im Deutschen gibt das Präteritum dies idiomatisch wieder.
- source_word: לִ/פְנֵי
  choice: vor
  rationale: „Vor“ gibt die räumliche beziehungsweise persönliche Gegenwart knapp und natürlich wieder und passt zum visionären Gerichtsszenario.
- source_word: הַ/מַּלְאָךְ
  choice: dem Engel
  rationale: מַלְאָךְ kann „Bote“ bedeuten; im Zusammenhang einer himmlischen Vision ist „Engel“ die naheliegende Wiedergabe. Der bestimmte Artikel bleibt erhalten.
theological_decisions:
- issue: Identität von הַמַּלְאָךְ im Zusammenhang
  choice: der Engel
  alternative: der Bote; im weiteren Zusammenhang eine Deutung als Engel des HERRN beziehungsweise als theophanische Gestalt
  rationale: Der Vers selbst bezeichnet die Gestalt lediglich mit dem bestimmten Ausdruck „der Engel/Bote“. Die Übersetzung übernimmt keine weitergehende christologische oder theophanische Identifizierung und hält die Auslegung offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Zustandsformulierung „war … bekleidet“ wahrt die Form des Hebräischen, ohne unnatürlich altertümlich zu wirken. Die drastische Färbung von צוֹאִים wird in der Fußnote ausdrücklich sichtbar gemacht, während der Haupttext gut verständlich bleibt.
