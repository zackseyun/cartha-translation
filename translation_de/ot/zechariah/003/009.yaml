language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֣י הִנֵּ֣ה הָ/אֶ֗בֶן אֲשֶׁ֤ר נָתַ֨תִּי֙ לִ/פְנֵ֣י יְהוֹשֻׁ֔עַ עַל אֶ֥בֶן אַחַ֖ת שִׁבְעָ֣ה עֵינָ֑יִם הִנְ/נִ֧י מְפַתֵּ֣חַ פִּתֻּחָ֗/הּ נְאֻם֙ יְהוָ֣ה צְבָא֔וֹת וּ/מַשְׁתִּ֛י אֶת עֲוֺ֥ן הָ/אָֽרֶץ הַ/הִ֖יא בְּ/י֥וֹם אֶחָֽד׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/009.yaml
  text: For behold[a], the stone that I have set before Joshua—on one stone are seven eyes. Behold, I myself will engrave its engraving, declares Yahweh of Armies[b], and I will remove the iniquity of that land in a single day.
translation:
  language: de
  text: 'Denn siehe: der Stein, den ich vor Josua gelegt habe – auf einem einzigen Stein sind sieben Augen. Siehe, ich selbst werde seine Inschrift eingravieren[a], spricht Jahwe der Heerscharen[b], und ich werde die Schuld jenes Landes an einem einzigen Tag beseitigen.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich mit einer verwandten Wortbildung: „seine Einritzung einritzen“ bzw. „seine Gravur eingravieren“; sinngemäß: „seine Inschrift eingravieren“.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionell: „der HERR der Heerscharen“.'
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Wort kann auch „Verfehlung“, „Sünde“ oder die aus ihr erwachsende Schuld bezeichnen.
    reason: semantic_ambiguity
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: Denn siehe
  rationale: כִּי leitet hier eine Begründung oder nachdrückliche Erläuterung ein; הִנֵּה ist ein feierlicher Aufmerksamkeitsruf. „Denn siehe“ bewahrt beides in prophetischem Register.
- source_word: הָאֶבֶן אֲשֶׁר נָתַתִּי לִפְנֵי יְהוֹשֻׁעַ
  choice: der Stein, den ich vor Josua gelegt habe
  rationale: נתן kann „geben“, „setzen“ oder „legen“ bedeuten. In Verbindung mit לִפְנֵי ist „vor … gelegt“ im Deutschen natürlich und räumlich klar.
- source_word: עַל אֶבֶן אַחַת שִׁבְעָה עֵינָיִם
  choice: auf einem einzigen Stein sind sieben Augen
  rationale: Die abrupte Bildsprache bleibt erhalten. אַחַת wird durch „einem einzigen“ hervorgehoben; die Augen werden nicht symbolisch ausgedeutet.
- source_word: הִנְנִי
  choice: Siehe, ich selbst
  rationale: Die Konstruktion ist präsentativ und betont die handelnde erste Person. „Ich selbst“ gibt diesen Nachdruck wieder.
- source_word: מְפַתֵּחַ פִּתֻּחָהּ
  choice: werde seine Gravur eingravieren
  rationale: Der Partizipialausdruck nach הִנְנִי hat hier bevorstehenden bzw. zukünftigen Sinn. Die deutsche Wortverwandtschaft spiegelt die figura etymologica des Hebräischen, während eine glattere Möglichkeit in der Fußnote steht.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: spricht Jahwe der Heerscharen
  rationale: נְאֻם ist die übliche prophetische Botenformel. „Jahwe“ gibt den Gottesnamen wieder; „Heerscharen“ bewahrt den umfassenden, feierlichen Sinn von צְבָאוֹת, ohne ihn auf menschliche Armeen zu verengen.
- source_word: וּמַשְׁתִּי
  choice: und ich werde … beseitigen
  rationale: Die seltene Form bezeichnet im Kontext das Wegschaffen oder Entfernen. „Beseitigen“ verbindet sich im Deutschen natürlich mit „Schuld“.
- source_word: עֲוֺן הָאָרֶץ הַהִיא
  choice: die Schuld jenes Landes
  rationale: עָוֹן kann Verfehlung, Schuld oder deren Folge bezeichnen. „Schuld“ erhält die moralisch-rechtliche Spannweite; „jenes Landes“ gibt den Demonstrativausdruck ausdrücklich wieder.
- source_word: בְּיוֹם אֶחָד
  choice: an einem einzigen Tag
  rationale: Die Formulierung bewahrt sowohl die zeitliche Bestimmung als auch die Betonung, dass die Beseitigung an nur einem Tag geschieht.
theological_decisions:
- issue: Symbolik des Steins und der sieben Augen
  choice: Die Bilder werden wörtlich beibehalten und im Haupttext nicht gedeutet.
  alternative: Den Stein messianisch und die sieben Augen als Gottes Allwissenheit auslegen.
  rationale: Der hebräische Vers benennt die Bilder, erklärt sie hier aber nicht ausdrücklich. Eine Identifizierung würde eine mögliche Auslegung in den Übersetzungstext eintragen.
- issue: Wiedergabe von יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  alternative: der HERR der Heerscharen; Jahwe der Heere
  rationale: „Jahwe“ macht den im Ausgangstext stehenden Eigennamen sichtbar. „Heerscharen“ ist im Deutschen würdevoll und lässt die Reichweite des Plurals צְבָאוֹת offen.
- issue: Bedeutungsumfang von עָוֹן
  choice: Schuld
  alternative: Sünde; Verfehlung; Schuldstrafe
  rationale: Das Wort kann Tat, Schuldzustand und teilweise Schuldfolge umfassen. „Schuld“ passt zum Verb des Beseitigens, ohne den Ausdruck ausschließlich auf die einzelne Tat oder deren Strafe festzulegen.
translation_notes:
  register: Modernes, würdiges prophetisches Deutsch. „Siehe“ und „spricht Jahwe“ erhalten den feierlichen Verkündigungsstil; Satzbau und Wortwahl bleiben zugleich für heutige Leser verständlich. Die auffällige Wiederholung in „Gravur eingravieren“ ist wegen der entsprechenden hebräischen Wortfigur bewusst beibehalten und durch eine Fußnote erläutert.
