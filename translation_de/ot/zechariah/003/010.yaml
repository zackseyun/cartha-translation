source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא נְאֻם֙ יְהוָ֣ה צְבָא֔וֹת תִּקְרְא֖וּ אִ֣ישׁ לְ/רֵעֵ֑/הוּ אֶל תַּ֥חַת גֶּ֖פֶן וְ/אֶל תַּ֥חַת תְּאֵנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/010.yaml
  text: On that day[a], declares Yahweh of Armies[d][c][b], each of you will invite his neighbor under the vine and under the fig tree.
translation:
  language: de
  text: An jenem Tag, spricht Jahwe der Heere[a], wird jeder von euch seinen Nächsten unter den Weinstock und unter den Feigenbaum einladen[b].[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Jahwe der Heere“. Das hebräische צְבָאוֹת kann irdische oder himmlische Heere beziehungsweise Heerscharen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder wörtlicher: „wird jeder von euch seinen Nächsten rufen“. Das hebräische Verb bedeutet grundsätzlich „rufen“, hat hier aber wahrscheinlich den Sinn einer Einladung.'
    reason: lexical_alternative
  - marker: c
    text: Das Hebräische sagt nicht ausdrücklich „unter seinen Weinstock und unter seinen Feigenbaum“; die Possessivpronomen werden daher im Text nicht ergänzt.
    reason: lexical_alternative
  - marker: d
    text: Das Sitzen unter Weinstock und Feigenbaum ist ein Bild für Frieden, Sicherheit und Wohlergehen; vergleiche 1. Könige 5,5 (in anderer Verszählung 4,25) und Micha 4,4.
    reason: cross_reference
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Die geläufige prophetische Zeitformel wird in natürlichem, gehobenem Standarddeutsch wiedergegeben.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: so lautet der Ausspruch Jahwes der Heere
  rationale: נְאֻם bezeichnet eine feierliche prophetische Erklärung. „Ausspruch“ bewahrt den Formelcharakter; „so lautet“ bindet die Formel idiomatisch in den deutschen Satz ein.
- source_word: תִּקְרְאוּ
  choice: werdet ... einladen
  rationale: קרא bedeutet grundsätzlich „rufen“, bezeichnet hier mit der Zielangabe und dem Bild friedlicher Gemeinschaft aber wahrscheinlich eine Einladung. Eine Fußnote bewahrt die wörtlichere Möglichkeit.
- source_word: אִישׁ לְרֵעֵהוּ
  choice: jeder von euch seinen Nächsten
  rationale: אִישׁ wird distributiv verstanden, während die Verbform in der zweiten Person Plural den angesprochenen Kreis ausdrücklich einbezieht. רֵעַ kann einen Nächsten, Nachbarn oder Gefährten bezeichnen.
- source_word: אֶל תַּחַת גֶּפֶן וְאֶל תַּחַת תְּאֵנָה
  choice: unter den Weinstock und unter den Feigenbaum
  rationale: Das wiederholte אֶל bezeichnet die Richtung auf einen Ort unter Weinstock und Feigenbaum. Die im Hebräischen nicht ausgedrückten Possessivpronomen werden nicht ergänzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der im hebräischen Text stehende Eigenname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von צְבָאוֹת
  choice: der Heere
  alternative: der Heerscharen; Zebaot
  rationale: „Heere“ macht die Grundbedeutung im heutigen Deutsch verständlich und lässt offen, ob irdische oder himmlische Heere im Blick stehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erkennbarer prophetischer Ausspruchsformel. Die Syntax bleibt nah am Hebräischen, wird jedoch so geglättet, dass der Vers für heutige Leser verständlich ist. Die männliche Singularform „seinen Nächsten“ entspricht der distributiven Form des Ausgangstextes.
