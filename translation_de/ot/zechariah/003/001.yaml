  text: וַ/יַּרְאֵ֗/נִי אֶת יְהוֹשֻׁ֨עַ֙ הַ/כֹּהֵ֣ן הַ/גָּד֔וֹל עֹמֵ֕ד לִ/פְנֵ֖י מַלְאַ֣ךְ יְהוָ֑ה וְ/הַ/שָּׂטָ֛ן עֹמֵ֥ד עַל יְמִינ֖/וֹ לְ/שִׂטְנֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/001.yaml
  text: Then he showed me Joshua the high priest standing before the angel of Yahweh[a], and the Accuser standing at his right hand to accuse him.
translation:
  language: de
  text: Dann zeigte er mir den Hohepriester Josua, der vor dem Engel Jahwes stand, und den Ankläger[a], der zu seiner Rechten stand, um ihn anzuklagen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Satan … um ihm zu widerstehen“. Im Hebräischen steht „der Satan“; dies kann als Titel verstanden werden und „der Ankläger“ oder „der Widersacher“ bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּרְאֵנִי
  choice: Dann zeigte er mir
  rationale: Der Hifil von ראה mit dem Suffix der 1. Person Singular bedeutet idiomatisch „zeigte mir“. „Dann“ gibt das narrative וַ־ in natürlichem Deutsch wieder.
- source_word: יְהוֹשֻׁעַ
  choice: Josua
  rationale: Die übliche deutsche Wiedergabe des hebräischen Namens יְהוֹשֻׁעַ ist „Josua“.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: der Hohe Priester
  rationale: „Hoher Priester“ ist die etablierte und genaue deutsche Bezeichnung für dieses israelitische Amt.
- source_word: עֹמֵד
  choice: der … stand
  rationale: Die partizipiale Form beschreibt Josuas Haltung innerhalb der Vision; ein deutscher Relativsatz gibt sie natürlich wieder.
- source_word: לִפְנֵי
  choice: vor
  rationale: „Vor“ bewahrt sowohl die räumliche als auch die mögliche gerichtliche Nuance, ohne die Szene weiter auszudeuten.
- source_word: מַלְאַךְ יְהוָה
  choice: der Engel Jahwes
  rationale: מַלְאָךְ bezeichnet hier im Rahmen der prophetischen Vision am natürlichsten einen „Engel“; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: „Jahwe“ gibt das Tetragramm als persönlichen Gottesnamen wieder, statt es durch einen Titel zu ersetzen.
- source_word: הַשָּׂטָן
  choice: der Ankläger
  rationale: Der Artikel und der gerichtliche Zusammenhang sprechen für eine Rollenbezeichnung. „Der Ankläger“ wahrt diese Bedeutung, ohne die mögliche Identifizierung mit Satan auszuschließen.
- source_word: עַל יְמִינוֹ
  choice: zu seiner Rechten
  rationale: Die idiomatische Wendung bezeichnet die Position an Josuas rechter Seite und lässt die gerichtliche Konnotation bestehen.
- source_word: לְשִׂטְנוֹ
  choice: um ihn anzuklagen
  rationale: Der Infinitiv derselben Wurzel wie הַשָּׂטָן bezeichnet hier im gerichtlichen Kontext das Auftreten gegen Josua als Ankläger.
theological_decisions:
- issue: Ob הַשָּׂטָן als Eigenname oder als Titel beziehungsweise Rolle wiederzugeben ist
  choice: der Ankläger
  alternative: Satan; der Widersacher
  rationale: Der bestimmte Artikel und das unmittelbar folgende לְשִׂטְנוֹ („um ihn anzuklagen/ihm zu widerstehen“) legen in dieser gerichtlichen Szene eine Funktionsbezeichnung nahe. Die Fußnote bewahrt die traditionelle Wiedergabe „Satan“ und die breitere Bedeutung „Widersacher“, ohne die Identität der Gestalt im Haupttext festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Formulierung „stand“ bewahrt die Parallelität des hebräischen Textes. „Hoher Priester“ wird als Amtsbezeichnung großgeschrieben; „Ankläger“ als hervorgehobene Rollenbezeichnung ebenfalls.
