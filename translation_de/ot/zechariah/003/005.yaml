source:
  edition: WLC
  text: וָ/אֹמַ֕ר יָשִׂ֛ימוּ צָנִ֥יף טָה֖וֹר עַל רֹאשׁ֑/וֹ וַ/יָּשִׂימוּ֩ הַ/צָּנִ֨יף הַ/טָּה֜וֹר עַל רֹאשׁ֗/וֹ וַ/יַּלְבִּשֻׁ֨/הוּ֙ בְּגָדִ֔ים וּ/מַלְאַ֥ךְ יְהוָ֖ה עֹמֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/005.yaml
  text: Then I said[a], “Let them put a clean turban on his head.” So they put the clean turban on his head and clothed him with garments[c][b], while the angel of Yahweh was standing by.
translation:
  language: de
  text: 'Da sagte ich[a]: »Man setze ihm einen reinen[b] Turban auf den Kopf!« Da setzten sie ihm den reinen Turban auf den Kopf und bekleideten ihn mit Gewändern, während der Engel Jahwes[c] dabei stand.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Und ich sagte.« Die hebräische Verbindung kann schlicht mit »und« wiedergegeben werden; »da« verdeutlicht den Fortgang der Erzählung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »sauberen«. »Rein« kann hier besonders die rituelle Reinheit hervorheben.'
    reason: lexical_alternative
  - marker: c
    text: Die Bezeichnung »Engel Jahwes« wird ihrem einfachen Wortsinn entsprechend wiedergegeben. Umstritten ist, ob damit ein geschaffener himmlischer Bote oder eine Erscheinung Jahwes gemeint ist.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֹמַר
  choice: Da sagte ich
  rationale: Das narrative Waw führt die Handlung weiter. »Da« gibt die zeitliche Abfolge im modernen Deutschen natürlich wieder; möglich ist auch das formalere »Und ich sagte«.
- source_word: יָשִׂימוּ
  choice: Man setze
  rationale: Der Jussiv der 3. Person Plural drückt eine Aufforderung oder einen Wunsch aus. Die unpersönliche Form wahrt, dass die Angesprochenen im Satz nicht ausdrücklich benannt werden.
- source_word: צָנִיף
  choice: Turban
  rationale: Das Wort bezeichnet eine gewickelte Kopfbedeckung und passt hier zum priesterlichen Zusammenhang, ohne zusätzliche Einzelheiten einzutragen.
- source_word: טָהוֹר
  choice: rein
  rationale: »Rein« bewahrt den im Kontext wichtigen Bezug auf kultische beziehungsweise rituelle Reinheit; je nach Akzent ist auch »sauber« möglich.
- source_word: עַל רֹאשׁוֹ
  choice: auf den Kopf
  rationale: Die lokale Wendung wird direkt und idiomatisch wiedergegeben.
- source_word: וַיָּשִׂימוּ
  choice: Da setzten sie
  rationale: Die Form setzt die Erzählung fort und berichtet die unmittelbare Ausführung der Aufforderung.
- source_word: הַצָּנִיף הַטָּהוֹר
  choice: den reinen Turban
  rationale: Die Bestimmtheit und die bewusste Wiederholung der vorangehenden Formulierung bleiben erhalten.
- source_word: וַיַּלְבִּשֻׁהוּ בְּגָדִים
  choice: bekleideten ihn mit Gewändern
  rationale: Die kausative Verbform bedeutet, jemanden zu bekleiden. Die Wiedergabe ist würdevoll und lässt die Art der Gewänder so unbestimmt wie der hebräische Ausdruck.
- source_word: בְּגָדִים
  choice: Gewänder
  rationale: »Gewänder« ist ein breiter, würdevoller Ausdruck. »Priestergewänder« wäre im Kontext denkbar, würde aber mehr festlegen als dieses Substantiv allein.
- source_word: וּמַלְאַךְ יְהוָה
  choice: während der Engel Jahwes
  rationale: Das Waw wird mit dem folgenden Partizip als Begleitumstand verstanden. Die Wendung bezeichnet schlicht den Engel beziehungsweise Boten Jahwes, ohne seine Identität näher zu bestimmen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עֹמֵד
  choice: dabeistand
  rationale: Das Partizip beschreibt einen andauernden Zustand während der übrigen Handlung; »dabeistand« vermittelt sowohl Haltung als auch gegenwärtige Begleitung.
theological_decisions:
- issue: Identität und Bedeutung von מַלְאַךְ יְהוָה
  choice: »der Engel Jahwes« ohne weitere Identifizierung
  alternative: Deutung als geschaffener Engel oder als sichtbare Erscheinung Jahwes
  rationale: Der hebräische Ausdruck entscheidet in diesem Vers nicht ausdrücklich zwischen diesen Deutungen. Die Übersetzung bewahrt deshalb die theologische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht feierliche Jussivform »Man setze« bewahrt den Aufforderungscharakter und die unbestimmte Mehrzahl des Hebräischen; Wiederholungen und theologische Offenheit bleiben erhalten.
