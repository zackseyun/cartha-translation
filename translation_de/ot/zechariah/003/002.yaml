id: ZEC.3.2
reference: Zechariah 3:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל הַ/שָּׂטָ֗ן יִגְעַ֨ר יְהוָ֤ה בְּ/ךָ֙ הַ/שָּׂטָ֔ן וְ/יִגְעַ֤ר יְהוָה֙ בְּ/ךָ֔ הַ/בֹּחֵ֖ר בִּ/ירֽוּשָׁלִָ֑ם הֲ/ל֧וֹא זֶ֦ה א֖וּד מֻצָּ֥ל מֵ/אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/003/002.yaml
  text: And Yahweh said to the Accuser[a], “Yahweh rebuke you, O Accuser! Indeed, Yahweh, who has chosen Jerusalem[b], rebuke you! Is not this a brand snatched from the fire?”
translation:
  language: de
  text: 'Und Jahwe sagte zum Ankläger[a]: „Jahwe weise dich zurecht, Ankläger! Ja, Jahwe, der Jerusalem erwählt hat, weise dich zurecht! Ist dieser nicht ein Brandscheit, das dem Feuer entrissen wurde[b]?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: „Satan“; das Hebräische hat hier den Titel „der Ankläger“.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „ein aus dem Feuer gerettetes Holzscheit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: הַשָּׂטָן
  choice: der Ankläger / Ankläger
  rationale: Der bestimmte Artikel kennzeichnet hier am ehesten eine Rolle beziehungsweise einen Titel. „Ankläger“ bewahrt zudem den gerichtlichen Zusammenhang der Vision.
- source_word: יִגְעַר
  choice: weise dich zurecht
  rationale: גער bezeichnet hier ein machtvolles, autoritatives Zurückweisen. Die deutsche Wendung ist würdig und lässt die richterliche Kraft des Ausspruchs erkennen.
- source_word: הַבֹּחֵר בִּירוּשָׁלִָם
  choice: der Jerusalem erwählt hat
  rationale: Der substantivierte Partizipialsatz kennzeichnet Jahwe durch seine Erwählung Jerusalems; das Perfekt gibt im Deutschen die feststehende Erwählung natürlich wieder.
- source_word: הֲלוֹא זֶה
  choice: Ist dieser nicht
  rationale: Die Formulierung bewahrt die rhetorische Frage, die Zustimmung erwartet, und bezieht „dieser“ unmittelbar auf die zuvor dargestellte Person.
- source_word: אוּד
  choice: Brandscheit
  rationale: Das Wort bezeichnet ein brennendes oder angekohltes Holzstück und erhält das eindringliche Bild einer nur knapp bewahrten Person.
- source_word: מֻצָּל מֵאֵשׁ
  choice: das dem Feuer entrissen wurde
  rationale: Die passive Rettungsaussage wird anschaulich und idiomatisch wiedergegeben, ohne den Handelnden ausdrücklich zu benennen.
theological_decisions:
- issue: Ob הַשָּׂטָן als Eigenname oder als Titel wiederzugeben ist
  choice: Im Haupttext steht „der Ankläger“.
  alternative: „Satan“ oder „der Widersacher“
  rationale: Der hebräische Ausdruck trägt den bestimmten Artikel und bezeichnet in der Gerichtsszene vorrangig die Funktion des Anklagens. Die traditionelle Benennung „Satan“ bleibt in der Fußnote sichtbar.
- issue: Jahwes in direkter Rede wiederholter Ruf, Jahwe möge den Ankläger zurechtweisen
  choice: Beide Aussagen werden vollständig beibehalten.
  alternative: Die beiden Aussagen zu einem einzigen Zurückweisungswort zusammenziehen.
  rationale: Die auffällige Wiederholung gehört zum hebräischen Text und trägt dessen rhetorisches und richterliches Gewicht; sie darf nicht harmonisierend beseitigt werden.
- issue: Zeitlicher Sinn des Partizips הַבֹּחֵר
  choice: „der Jerusalem erwählt hat“
  alternative: „der Jerusalem erwählt“ oder „der Jerusalem erwählt hat und erwählt“
  rationale: Das Partizip kann Jahwes charakteristisches Erwählen bezeichnen. Das deutsche Perfekt hebt die feststehende Erwählung hervor, ohne eine weitergehende zeitliche Systematik festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung des Gottesnamens und der Zurechtweisung bleibt bewusst erhalten. „Brandscheit“ bewahrt die starke Feuer-Metapher, während der Relativsatz eine schwerfällige Häufung von Partizipien vermeidet.
