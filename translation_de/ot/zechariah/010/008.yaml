  - marker: b
    text: 'Wörtlich: „Sie werden zahlreich sein, wie sie zahlreich waren.“'
    reason: literal_rendering
lexical_decisions:
- source_word: אֶשְׁרְקָה לָהֶם
  choice: Ich pfeife ihnen
  rationale: שׁרק bezeichnet hier ein Pfeifen als herbeirufendes Signal; der Dativ „ihnen“ gibt לָהֶם knapp und im Deutschen verständlich wieder.
- source_word: וַאֲקַבְּצֵם
  choice: und sammle sie
  rationale: קבץ bezeichnet das Sammeln der Zerstreuten. Das präsentische Deutsch kann nach dem futurisch verstandenen „Ich pfeife“ missverständlich wirken; durch die koordinierte prophetische Aussage ist „sammle“ hier als angekündigte Handlung zu verstehen.
- source_word: כִּי פְדִיתִים
  choice: denn ich habe sie erlöst
  rationale: כִּי begründet das Sammeln; פדה meint Befreiung beziehungsweise Loskauf. „Erlöst“ bewahrt die heilsgeschichtliche Tragweite, ohne den Vorgang näher festzulegen.
- source_word: וְרָבוּ כְּמוֹ רָבוּ
  choice: und sie werden sich vermehren, wie sie sich vermehrt haben
  rationale: Die Wiederholung von רבה wird im Hebräischen bewusst beibehalten. Die erste Form hat im prophetischen Zusammenhang Zukunftsbezug, die zweite blickt vergleichend auf frühere Vermehrung zurück; die Wiedergabe erhält diese formale und semantische Spannung.
theological_decisions:
- issue: Sammlung und Erlösung
  choice: Die angekündigte Sammlung wird mit Gottes bereits ausgesprochener Erlösung begründet, ohne deren zeitlichen oder heilsgeschichtlichen Mechanismus näher zu bestimmen.
  alternative: Die Aussage ausdrücklich auf ein bestimmtes endzeitliches oder ausschließlich geistliches Erfüllungsmodell festzulegen.
  rationale: Der hebräische Text verbindet Signal, Sammlung, Erlösung und zahlenmäßige Vermehrung, lässt aber die genaue dogmatische Einordnung offen.
- issue: Bedeutung der abschließenden Wiederholung von רבה
  choice: 'Die Wiederholung wird als Vermehrung wiedergegeben: „sie werden sich vermehren, wie sie sich vermehrt haben“.'
  alternative: 'Sinngemäß: „sie werden wieder so zahlreich sein wie früher“.'
  rationale: Die sinngemäße Alternative ist möglich, legt jedoch stärker einen bloßen Vergleich mit einem früheren Bevölkerungsstand fest. Die gewählte Fassung bewahrt die genuine Mehrdeutigkeit und den Wortklang des Hebräischen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das konkrete Bild des herbeirufenden Pfeifens bleibt erhalten. Die ungewöhnliche Wiederholung im Schlusssatz folgt bewusst dem Hebräischen; eine idiomatischere Deutung steht in der Fußnote.
