  yaml_path: translation/ot/zechariah/010/008.yaml
  text: I will whistle for them and gather them[a], for I have redeemed them[b], and they will be as many as they were before.
translation:
  language: de
  text: Ich werde ihnen pfeifen und sie sammeln,[a] denn ich habe sie erlöst; sie werden so zahlreich sein, wie sie es früher waren.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich werde ihnen ein Zeichen geben und sie sammeln.“ Das hebräische Verb kann ein Pfeifen oder Zischen als Rufsignal bezeichnen.'
