base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/004.yaml
  text: From him will come the cornerstone[a], from him the tent peg, from him the battle bow[b]; from him every ruler will go out together.
translation:
  language: de
  text: Von ihm wird der Eckstein[a] hervorgehen, von ihm der Zeltpflock, von ihm der Kriegsbogen; von ihm werden alle Herrscher[b] gemeinsam hervorgehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Eckstein“, „Zeltpflock“ und „Kriegsbogen“ sind Bilder für Festigkeit, Halt und militärische Stärke, die aus Juda hervorgehen.
    reason: cultural_note
  - marker: b
    text: 'Oder: „alle Bedränger“ beziehungsweise „alle Antreiber“. Das hebräische Wort bezeichnet oft jemanden, der Menschen antreibt oder Arbeit und Abgaben eintreibt; hier kann es im weiteren Sinn Herrscher bezeichnen, die aus Juda hervorgehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִמֶּנּוּ
  choice: von ihm
  rationale: Die viermal wiederholte Präposition mit maskulinem Singularsuffix wird formal als „von ihm“ wiedergegeben. Der Bezug liegt kollektiv bei Juda beziehungsweise seinem wiederhergestellten Volk; die grammatische Spannung wird nicht zu „von ihnen“ geglättet.
- source_word: פִנָּה
  choice: Eckstein
  rationale: פִנָּה kann „Ecke“ oder „Eckstein“ bedeuten. Im Zusammenhang der Bilder für Festigkeit, Führung und Stärke gibt „Eckstein“ die metaphorische Funktion prägnant wieder.
- source_word: יָתֵד
  choice: Zeltpflock
  rationale: Das Wort bezeichnet einen Pflock, häufig einen Zeltpflock. Diese konkrete Wiedergabe bewahrt das Bild von Halt und Festigkeit.
- source_word: קֶשֶׁת מִלְחָמָה
  choice: Kriegsbogen
  rationale: Die Constructusverbindung bezeichnet einen im Krieg verwendeten Bogen. „Kriegsbogen“ ist knapp, natürlich und erhält den militärischen Sinn.
- source_word: יֵצֵא
  choice: ziehen … aus
  rationale: יצא bedeutet grundsätzlich „hinausgehen/ausziehen“. Bei Machthabern im militärisch-politischen Kontext ist „ausziehen“ idiomatisch, ohne das Ziel oder die Art des Auszugs näher festzulegen.
- source_word: כָל נוֹגֵשׂ
  choice: alle Machthaber
  rationale: נֹגֵשׂ bezeichnet jemanden, der antreibt, Abgaben oder Arbeit eintreibt und dadurch Autorität ausübt. Der positive Wiederherstellungskontext legt hier die neutralere Bezeichnung „Machthaber“ nahe; die mögliche negative Bedeutung bleibt in der Fußnote erhalten. Das distributive כָל mit einem singularischen Gattungsbegriff wird im Deutschen natürlich pluralisch wiedergegeben.
- source_word: יַחְדָּו
  choice: gemeinsam
  rationale: Das Adverb bezeichnet gemeinsames beziehungsweise vereintes Handeln. „Gemeinsam“ ist modernes, klares Deutsch und lässt die genaue Art der Gemeinsamkeit offen.
theological_decisions:
- issue: Bezug des vierfachen מִמֶּנּוּ
  choice: „von ihm“ mit kollektivem Bezug auf Juda
  alternative: „von ihm“ als Bezug auf Gott oder „von ihnen“ als Bezug auf die Judäer
  rationale: Der unmittelbare Kontext nennt Juda als die von JHWH gestärkte Gemeinschaft; das maskuline Singularsuffix kann sich kollektiv darauf beziehen. Die Übersetzung wahrt die Singularform und legt den Bezug nicht durch eine erklärende Ergänzung fest.
- issue: Wertung von כָל נוֹגֵשׂ
  choice: 'neutral bis positiv: „alle Machthaber“'
  alternative: 'negativ: „alle Bedränger“; administrativ: „alle Fronvögte/Antreiber“'
  rationale: Die Reihe aus Eckstein, Zeltpflock und Kriegsbogen beschreibt tragende und machtvolle Gestalten, die aus Juda hervorgehen. Daher passt eine Bezeichnung für Autorität besser in den unmittelbaren Zusammenhang. Da נֹגֵשׂ häufig einen harten oder unterdrückerischen Amtsträger bezeichnet, wird diese Spannung ausdrücklich in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vierfache Anapher „von ihm“ bildet die Struktur des Hebräischen ab. „Ziehen … aus“ hält den Bewegungscharakter von יצא fest und passt zum militärisch-politischen Bildfeld. Alle Fußnotenmarker stehen an den einschlägigen Stellen im Haupttext.
