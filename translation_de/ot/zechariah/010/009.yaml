  text: וְ/אֶזְרָעֵ/ם֙ בָּֽ/עַמִּ֔ים וּ/בַ/מֶּרְחַקִּ֖ים יִזְכְּר֑וּ/נִי וְ/חָי֥וּ אֶת בְּנֵי/הֶ֖ם וָ/שָֽׁבוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/009.yaml
  text: I will sow them among the peoples[a], and in distant places they will remember me[b]; they and their children will live, and they will return.
translation:
  language: de
  text: Ich werde sie unter den Völkern aussäen[a]. An fernen Orten werden sie sich an mich erinnern; sie und ihre Kinder werden leben[b], und sie werden zurückkehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »unter den Völkern zerstreuen«. Das hebräische Verb bedeutet wörtlich »säen« und kann sowohl Zerstreuung als auch ein zielgerichtetes Aussäen mit Aussicht auf künftiges Wachstum ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Sie werden mit ihren Kindern leben.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶזְרָעֵם
  choice: Ich werde sie … aussäen
  rationale: Die Grundbedeutung von זרע ist »säen«. Das Bild umfasst hier sowohl die Zerstreuung unter andere Völker als auch ein zielgerichtetes Aussäen mit Aussicht auf künftiges Wachstum; »aussäen« bewahrt diese Spannung.
- source_word: בָּעַמִּים
  choice: unter den Völkern
  rationale: Der Plural עַמִּים bezeichnet Völker beziehungsweise Volksgruppen. »Völker« ist im Deutschen natürlich und vermeidet die moderne staatspolitische Einengung von »Nationen«.
- source_word: וּבַמֶּרְחַקִּים
  choice: An fernen Orten
  rationale: מֶרְחַקִּים bezeichnet hier räumliche Ferne beziehungsweise weit entfernte Orte. Die Formulierung erhält den örtlichen Sinn des hebräischen Ausdrucks.
- source_word: יִזְכְּרוּנִי
  choice: werden sie sich an mich erinnern
  rationale: זכר mit dem Suffix der ersten Person bedeutet unmittelbar »sich an mich erinnern«. Ein im Hebräischen nicht ausdrücklich vorhandenes »dort« wird nicht ergänzt.
- source_word: וְחָיוּ
  choice: werden leben
  rationale: חיה kann fortdauerndes oder neu geschenktes Leben bezeichnen. »leben« lässt diese Bedeutungsbreite offen, statt sie auf »überleben« oder »wieder aufleben« festzulegen.
- source_word: אֶת־בְּנֵיהֶם
  choice: sie und ihre Kinder
  rationale: אֶת wird hier komitativ verstanden. Die idiomatische deutsche Wiedergabe mit zwei verbundenen Subjekten macht deutlich, dass sowohl sie selbst als auch ihre Kinder leben werden.
- source_word: וָשָׁבוּ
  choice: sie werden zurückkehren
  rationale: שוב bedeutet »zurückkehren« oder »umkehren«. Im Wiederherstellungszusammenhang bewahrt »zurückkehren« sowohl den räumlichen als auch den möglichen bundesbezogenen Nachklang, ohne den Ausdruck ausschließlich als Buße zu deuten.
theological_decisions:
- issue: Bedeutung des Säens im Zusammenhang der Wiederherstellung
  choice: Das Bild wird als zielgerichtetes Aussäen unter den Völkern wiedergegeben, das Zerstreuung einschließt und zugleich auf Erinnerung und Rückkehr ausgerichtet ist.
  alternative: Das Bild ausschließlich als strafende Zerstreuung oder ausschließlich als positives Einpflanzen zum Wachstum zu verstehen.
  rationale: Der Wiederherstellungszusammenhang spricht gegen eine einseitige Auflösung. »aussäen« bewahrt sowohl die Zerstreuung als auch die fruchtbare, absichtsvolle Seite des Bildes.
- issue: Bezug von אֶת־בְּנֵיהֶם
  choice: »sie und ihre Kinder« als zusammengehörige Subjekte von »leben«
  alternative: »sie werden mit ihren Kindern leben«
  rationale: Die komitative Funktion von אֶת lässt beide Wiedergaben zu. Die gewählte Fassung stellt die gemeinsame Teilhabe am Leben klar heraus, ohne mehr über die Art dieses Lebens zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das bewusst bildhafte »aussäen« wahrt die Metapher des Ausgangstextes; die übrige Syntax ist klar und für heutige Leser gut verständlich.
