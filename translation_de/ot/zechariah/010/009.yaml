  source_fidelity: 'Die Übersetzung gibt die Abfolge und die zentralen Bilder des Hebräischen zuverlässig wieder: Gottes Aussäen unter den Völkern, das Erinnern an ihn in der Ferne, Leben zusammen mit den Kindern und die Rückkehr. »aussäen« bewahrt die landwirtschaftliche Metapher von זרע und ihre mögliche doppelte Resonanz von Zerstreuung und zukunftsgerichtetem Wachstum. Die Wiedergabe von אֶת־בְּנֵיהֶם als »sie und ihre Kinder« ist als idiomatische Auslegung des komitativen אֶת vertretbar; die Fußnote nennt die ebenfalls mögliche engere Formulierung.'
