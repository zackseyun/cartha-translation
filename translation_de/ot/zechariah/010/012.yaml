base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/012.yaml
  text: I will strengthen them in Yahweh[b][a], and in his name they will walk,” declares Yahweh.
translation:
  language: de
  text: „Ich werde sie in Jahwe stark machen[a], und in seinem Namen[b] werden sie gehen“, spricht Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich werde sie in Jahwe mächtig machen.“'
    reason: lexical_alternative
  - marker: b
    text: „In seinem Namen“ kann auch ein Handeln unter seiner Autorität oder gemäß seinem offenbarten Wesen andeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגִבַּרְתִּים
  choice: Ich werde sie … stark machen
  rationale: Die intensive bzw. kausative Verbform von גבר bezeichnet hier, dass Jahwe ihnen Stärke verleiht. „Stark machen“ gibt diese Wirkung klar und natürlich wieder, ohne das stärkere „mächtig machen“ zwingend festzulegen.
- source_word: בַּיהוָה
  choice: in Jahwe
  rationale: Die Präposition ב kann den Bereich oder die Grundlage bezeichnen. „In Jahwe“ bewahrt diese offene Beziehung und legt sie nicht einseitig als Mittel („durch Jahwe“) aus.
- source_word: וּבִשְׁמוֹ
  choice: und in seinem Namen
  rationale: Die wörtliche Wendung lässt die mit שֵׁם verbundenen Bedeutungsaspekte wie Autorität, Ansehen und offenbartes Wesen mitschwingen, ohne einen davon zum alleinigen Sinn zu erklären.
- source_word: יִתְהַלָּכוּ
  choice: werden sie ihren Weg gehen
  rationale: Der Hitpael von הלך kann ein Umhergehen oder den fortdauernden Lebenswandel ausdrücken. „Ihren Weg gehen“ erhält das Bild des Gehens und klingt im heutigen Deutsch natürlicher als das isolierte „wandeln“.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Diese geläufige deutsche Wiedergabe der prophetischen Botenformel vermittelt eine verbindliche göttliche Aussage klar und würdevoll.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. „Jahwe“ gibt den offenbarten Bundesnamen als Eigennamen wieder und vermeidet seine Ersetzung durch einen Titel.
- issue: Bedeutung von „in seinem Namen gehen“
  choice: Das Bild des Gehens und die Formulierung „in seinem Namen“ bleiben erhalten.
  alternative: unter seiner Autorität leben; seinem offenbarten Wesen entsprechend handeln
  rationale: Die hebräische Wendung kann Lebensführung, Zugehörigkeit und Handeln unter Jahwes Autorität umfassen. Die bildhafte Formulierung bewahrt diese theologische Bedeutungsbreite.
- issue: Bezug von „in Jahwe“
  choice: Die Bereichs- oder Grundbedeutung der Präposition bleibt als „in Jahwe“ offen.
  alternative: durch Jahwe; mithilfe Jahwes
  rationale: Eine instrumentale Wiedergabe würde genauer festlegen, wie die Stärkung geschieht, als es der hebräische Ausdruck verlangt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem hebräischen Parallelismus. „Ihren Weg gehen“ hält die Geh-Metapher lebendig, ist aber für heutige Leser natürlicher als das altertümlich wirkende „wandeln“.
