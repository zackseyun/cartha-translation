- from: „Ich werde sie in Jahwe stark machen[a], und in seinem Namen[b] werden sie ihren Weg gehen“, spricht Jahwe.
  to: „Ich werde sie in Jahwe stark machen[a], und in seinem Namen[b] werden sie gehen“, spricht Jahwe.
