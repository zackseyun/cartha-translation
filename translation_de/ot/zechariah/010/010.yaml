source:
  edition: WLC
  text: וַ/הֲשִֽׁיבוֹתִי/ם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם וּ/מֵֽ/אַשּׁ֖וּר אֲקַבְּצֵ֑/ם וְ/אֶל אֶ֨רֶץ גִּלְעָ֤ד וּ/לְבָנוֹן֙ אֲבִיאֵ֔/ם וְ/לֹ֥א יִמָּצֵ֖א לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/010.yaml
  text: I will bring them back from the land of Egypt[a], and gather them from Assyria; I will bring them into the land of Gilead and Lebanon, and no room will be found for them.
translation:
  language: de
  text: Ich werde sie aus dem Land Ägypten zurückbringen und sie aus Assyrien sammeln. Ich werde sie in das Land Gilead und in den Libanon bringen, und es wird kein Platz für sie zu finden sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „und es wird für sie nicht gefunden werden“; was nicht gefunden wird, bleibt im Hebräischen unausgesprochen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲשִׁיבוֹתִים
  choice: Ich werde sie … zurückbringen
  rationale: Der Hifil von שוב bezeichnet hier das Veranlassen einer Rückkehr. „Zurückbringen“ ist im Deutschen natürlich und bewahrt den räumlichen Sinn im Zusammenhang der Heimkehr.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: aus dem Land Ägypten
  rationale: Die ausdrückliche Wiedergabe von אֶרֶץ als „Land“ erhält die geografische Formulierung und den möglichen Anklang an den Auszug aus Ägypten.
- source_word: וּמֵאַשּׁוּר אֲקַבְּצֵם
  choice: und sie aus Assyrien sammeln
  rationale: קבץ bezeichnet häufig das Sammeln zerstreuter Menschen. Die deutsche Wortstellung macht das Objekt ausdrücklich, ohne den Sinn zu erweitern.
- source_word: וְאֶל אֶרֶץ גִּלְעָד וּלְבָנוֹן אֲבִיאֵם
  choice: Ich werde sie in das Land Gilead und in den Libanon bringen
  rationale: ביא im Hifil bedeutet gewöhnlich „bringen“. „In“ gibt die Bewegung in die genannten Gebiete wieder; die Wiederholung der Präposition vermeidet im Deutschen die missverständliche Lesart eines einzigen zusammengesetzten Gebiets.
- source_word: וְלֹא יִמָּצֵא לָהֶם
  choice: und es wird kein Platz für sie zu finden sein
  rationale: Der hebräische Satz lässt das, was nicht gefunden wird, unausgesprochen. „Platz“ wird für verständliches Deutsch ergänzt; die passive Form und das einfache „und“ bewahren Form und Offenheit des Ausgangstextes möglichst weitgehend.
theological_decisions:
- issue: Unausgesprochenes Bezugswort in וְלֹא יִמָּצֵא לָהֶם
  choice: „Platz“ wird als naheliegende Ergänzung im Haupttext verwendet und in einer Fußnote als Ergänzung kenntlich gemacht.
  alternative: 'Wörtlicher: „und es wird für sie nicht gefunden werden“, wobei das Bezugswort vollständig unausgesprochen bleibt.'
  rationale: Der Zusammenhang mit der Ansiedlung in Gilead und im Libanon legt fehlenden Platz nahe, wahrscheinlich wegen der großen Zahl der Heimkehrenden. Die Fußnote verhindert, dass diese kontextuelle Ergänzung als ausdrücklich vorhandenes hebräisches Substantiv erscheint.
- issue: Verhältnis des letzten Satzglieds zum Vorangehenden
  choice: Das hebräische וְ wird schlicht mit „und“ wiedergegeben.
  alternative: Eine resultative Wiedergabe wie „bis kein Platz mehr für sie ist“ oder „sodass kein Platz für sie ausreicht“.
  rationale: Der Ausgangstext markiert Zweck, Folge oder zeitliche Grenze nicht ausdrücklich. „Und“ bewahrt diese syntaktische Offenheit und vermeidet eine stärkere Deutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beiden Zukunftsaussagen werden zur besseren Lesbarkeit in zwei Sätze gegliedert. „Land Ägypten“, „Gilead“, „Libanon“ und „Assyrien“ bleiben als geografische Bezeichnungen deutlich erhalten.
