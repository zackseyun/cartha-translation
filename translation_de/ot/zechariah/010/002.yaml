base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/002.yaml
  text: For the household idols speak wickedness[a], and the diviners see lies; they speak empty dreams and give vain comfort. Therefore they wander like sheep[b]; they are afflicted because there is no shepherd.
translation:
  language: de
  text: Denn die Hausgötzen[a] reden Trug, und die Wahrsager schauen Lügen; die nichtigen Träume reden, sie spenden leeren Trost. Darum ziehen sie wie Schafe umher; sie leiden Not[b], weil kein Hirte da ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Terafim“; ein hebräischer Ausdruck für häusliche Kultgegenstände oder Götzenbilder.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sie werden bedrückt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּרָפִים
  choice: die Hausgötzen
  rationale: Der Ausdruck bezeichnet konkrete kultische Götterbilder, die besonders mit dem häuslichen Bereich verbunden waren. „Hausgötzen“ ist verständlich und genauer als das allgemeine „Götzen“.
- source_word: דִּבְּרוּ אָוֶן
  choice: reden Trug
  rationale: אָוֶן kann Unheil, Bosheit, Nichtigkeit oder Falschheit bezeichnen. Im Parallelismus mit Lügen und nichtigen Träumen hebt „Trug“ den täuschenden und zugleich verwerflichen Charakter der Aussagen hervor.
- source_word: הַקּוֹסְמִים
  choice: die Wahrsager
  rationale: Gemeint sind Menschen, die durch verbotene mantische Praktiken Erkenntnis oder Führung zu gewinnen beanspruchen. „Wahrsager“ ist im modernen Deutsch klar und idiomatisch.
- source_word: חָזוּ שֶׁקֶר
  choice: schauen Lügen
  rationale: Das Verb bezeichnet visionäres Schauen. Die bewusst markante Formulierung erhält das Bild angeblicher Offenbarung und gibt שֶׁקֶר als unwahre, täuschende Inhalte wieder.
- source_word: חֲלֹמוֹת הַשָּׁוְא
  choice: nichtige Träume
  rationale: שָׁוְא bezeichnet Leere, Wertlosigkeit oder Falschheit. „Nichtige Träume“ bewahrt diese Bedeutungsbreite, ohne ausschließlich Unwahrheit oder Wirkungslosigkeit festzulegen.
- source_word: הֶבֶל יְנַחֵמוּן
  choice: spenden leeren Trost
  rationale: הֶבֶל bezeichnet etwas Flüchtiges, Leeres oder Vergebliches. „Leerer Trost“ ist natürliches Deutsch und vermittelt, dass dieser Trost keinen tragfähigen Gehalt besitzt.
- source_word: נָסְעוּ כְמוֹ צֹאן
  choice: ziehen sie wie Schafe umher
  rationale: נָסַע kann aufbrechen oder weiterziehen bedeuten. Im Bild einer Herde ohne Hirten bringt „umherziehen“ die Orientierungslosigkeit zum Ausdruck, ohne das Verb schlicht mit „irren“ gleichzusetzen.
- source_word: יַעֲנוּ
  choice: sie leiden Not
  rationale: Die Form wird von ענה im Sinn von bedrängt oder geplagt werden verstanden. „Not leiden“ bleibt hinsichtlich Ursache und Art des Leidens angemessen offen.
- source_word: אֵין רֹעֶה
  choice: kein Hirte da ist
  rationale: Die existentielle Aussage wird im Deutschen unmittelbar und natürlich wiedergegeben; zugleich bleibt das Hirtenbild als Metapher für fehlende Führung erhalten.
theological_decisions:
- issue: Art der verurteilten religiösen Gegenstände und Praktiken
  choice: Der Vers nennt konkrete Hausgötzen, Wahrsagerei und nichtige Träume als trügerische Quellen der Führung.
  alternative: Die Terafim als neutrale Ahnenobjekte zu verstehen oder den Vers ausschließlich auf politische Führung zu beziehen.
  rationale: Der unmittelbare Zusammenhang verurteilt falsche Offenbarung und fehlgeleitete Führung. Die Übersetzung lässt sowohl die kultische Ebene als auch die durch das Hirtenbild angedeutete Leitungskrise sichtbar, ohne spätere Lehrsysteme einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht gehobenem prophetischem Ton. Der Parallelismus bleibt erkennbar; ungewöhnliche Bildsprache wie „Lügen schauen“ wird zur Wahrung des visionären Ausdrucks bewusst beibehalten.
