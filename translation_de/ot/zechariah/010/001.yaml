id: ZEC.10.1
reference: Zechariah 10:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: שַׁאֲל֨וּ מֵ/יְהוָ֤ה מָטָר֙ בְּ/עֵ֣ת מַלְק֔וֹשׁ יְהוָ֖ה עֹשֶׂ֣ה חֲזִיזִ֑ים וּ/מְטַר גֶּ֨שֶׁם֙ יִתֵּ֣ן לָ/הֶ֔ם לְ/אִ֖ישׁ עֵ֥שֶׂב בַּ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/001.yaml
  text: Ask Yahweh for rain in the time of the latter rain[a]; Yahweh makes storm clouds, and he will give them showers of rain[b], to each man vegetation in the field.
translation:
  language: de
  text: Bittet Jahwe um Regen zur Zeit des Spätregens[a]! Jahwe lässt Gewitterwolken entstehen[b]; er wird ihnen Regengüsse geben und jedem Mann Pflanzenwuchs auf dem Feld.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in der Jahreszeit des späten Regens“; gemeint ist der Regen gegen Ende der Regenzeit.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Jahwe lässt Blitze entstehen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁאֲלוּ מֵיְהוָה מָטָר
  choice: Bittet Jahwe um Regen
  rationale: Der Pluralimperativ wird direkt wiedergegeben; bei „bitten um“ bezeichnet „Jahwe“ idiomatisch den Angesprochenen und מִן bleibt in der Vorstellung der Bezugsquelle erhalten.
- source_word: בְּעֵת מַלְקוֹשׁ
  choice: zur Zeit des Spätregens
  rationale: מַלְקוֹשׁ bezeichnet den späten Regen der landwirtschaftlichen Regenzeit. „Spätregen“ ist knapp, sachlich und näher am Hebräischen als eine vorschnelle kalendarische Festlegung auf den Frühling.
- source_word: עֹשֶׂה חֲזִיזִים
  choice: lässt Gewitterwolken entstehen
  rationale: חֲזִיזִים kann hier meteorologische Sturmgebilde oder Blitze bezeichnen. Im Regenzusammenhang ist „Gewitterwolken“ eine natürliche Hauptlesart; die konkrete Blitz-Lesart wird in der Fußnote bewahrt.
- source_word: וּמְטַר גֶּשֶׁם
  choice: Regengüsse
  rationale: Die Verbindung der beiden Regenwörter bezeichnet kräftige beziehungsweise schauerartige Niederschläge. „Regengüsse“ gibt die Verstärkung knapp wieder.
- source_word: יִתֵּן לָהֶם
  choice: er wird ihnen … geben
  rationale: Das Imperfekt wird im Anschluss an die Aufforderung als verheißene Folge futurisch verstanden; „ihnen“ nimmt die angesprochene Mehrzahl auf.
- source_word: לְאִישׁ
  choice: jedem Mann
  rationale: אִישׁ steht maskulin singularisch und wird distributiv gebraucht. „Jedem Mann“ bewahrt sowohl Form als auch Verteilungscharakter.
- source_word: עֵשֶׂב בַּשָּׂדֶה
  choice: Pflanzenwuchs auf dem Feld
  rationale: עֵשֶׂב umfasst Gras, Kraut und sonstigen grünen Bewuchs. „Pflanzenwuchs“ vermeidet die zu enge Vorstellung von bloßem Gras; „auf dem Feld“ gibt die landwirtschaftliche Szenerie natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Maskulines distributives אִישׁ
  choice: jedem Mann
  alternative: jedem / jedem Menschen
  rationale: Die gewählte Form bewahrt die ausdrücklich maskuline Singularform und ihre distributive Funktion, ohne sie stillschweigend zu neutralisieren.
- issue: Zeitwert von יִתֵּן
  choice: er wird geben
  alternative: er gibt
  rationale: Sowohl eine allgemeine Aussage als auch eine verheißene Folge sind grammatisch möglich. Der Kontext der Aufforderung, um Regen zu bitten, begünstigt hier die futurische Verheißung.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der Imperativ bleibt unmittelbar; landwirtschaftliche Begriffe werden verständlich, aber nicht paraphrasierend wiedergegeben. Die semantische Unschärfe von חֲזִיזִים wird durch eine Fußnote offengehalten.
