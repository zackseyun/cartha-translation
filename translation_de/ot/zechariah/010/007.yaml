  text: וְ/הָי֤וּ כְ/גִבּוֹר֙ אֶפְרַ֔יִם וְ/שָׂמַ֥ח לִבָּ֖/ם כְּמוֹ יָ֑יִן וּ/בְנֵי/הֶם֙ יִרְא֣וּ וְ/שָׂמֵ֔חוּ יָגֵ֥ל לִבָּ֖/ם בַּ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/007.yaml
  text: Ephraim will be like a mighty warrior[a], and their heart will rejoice as with wine; their children will see and rejoice[b]; their heart will exult in Yahweh.
translation:
  language: de
  text: Ephraim wird wie ein mächtiger Krieger sein, und ihr Herz wird sich freuen wie vom Wein. Ihre Kinder[a] werden es sehen und sich freuen; ihr Herz wird in Jahwe jubeln.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: ihre Söhne. Das hebräische Wort kann hier allgemein Kinder oder Nachkommen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: ihr Herz; der Singular wird kollektiv gebraucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ כְגִבּוֹר אֶפְרַיִם
  choice: Ephraim wird wie ein mächtiger Krieger sein
  rationale: Das pluralische Verb bezieht sich auf Ephraim als Kollektiv. Im Deutschen ermöglicht der Kollektivname einen natürlichen Singular; גִּבּוֹר wird wegen des Zusammenhangs als kampfstarker Krieger verstanden.
- source_word: וְשָׂמַח לִבָּם
  choice: und ihr Herz wird sich freuen
  rationale: Der Singular »Herz« mit pluralischem Suffix wird als hebräischer Kollektivausdruck bewahrt.
- source_word: כְּמוֹ יָיִן
  choice: wie vom Wein
  rationale: Die knappe Formulierung gibt die durch Wein hervorgerufene Freude wieder, ohne ausdrücklich Trunkenheit einzutragen.
- source_word: וּבְנֵיהֶם
  choice: ihre Kinder
  rationale: בָּנִים bezeichnet wörtlich Söhne, kann im familiären und generationenbezogenen Kontext jedoch Kinder beziehungsweise Nachkommen einschließen.
- source_word: יִרְאוּ וְשָׂמֵחוּ
  choice: werden es sehen und sich freuen
  rationale: Das im Hebräischen unausgesprochene Objekt wird im Deutschen mit »es« idiomatisch ergänzt und verweist auf Ephraims wiederhergestellten Zustand beziehungsweise seine Freude.
- source_word: יָגֵל לִבָּם
  choice: ihr Herz wird … jubeln
  rationale: גיל bezeichnet lebhafte, überschwängliche Freude; »jubeln« unterscheidet diese Nuance vom vorherigen שׂמח.
- source_word: בַּיהוָה
  choice: über Jahwe
  rationale: Die Präposition ב kann den Grund oder Gegenstand der Freude markieren. »Über Jahwe jubeln« ist natürliches Deutsch und bewahrt Jahwe als Bezugspunkt des Jubels.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. »Jahwe« gibt den Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug der Freude in בַּיהוָה
  choice: über Jahwe jubeln
  alternative: in Jahwe jubeln
  rationale: Die Präposition lässt eine örtlich-sphärische oder begründende Nuance zu. Die gewählte deutsche Wendung bezeichnet Jahwe als Grund und Gegenstand der Freude, ohne eine weitergehende dogmatische Erklärung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die prophetische Zukunft, das Bild des Kriegers und die kollektive Redeweise bleiben erhalten. Kurze Hauptsätze entsprechen dem feierlichen Rhythmus des Hebräischen.
