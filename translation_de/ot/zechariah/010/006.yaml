source:
  edition: WLC
  text: וְ/גִבַּרְתִּ֣י אֶת בֵּ֣ית יְהוּדָ֗ה וְ/אֶת בֵּ֤ית יוֹסֵף֙ אוֹשִׁ֔יעַ וְ/הֽוֹשְׁבוֹתִי/ם֙ כִּ֣י רִֽחַמְתִּ֔י/ם וְ/הָי֖וּ כַּ/אֲשֶׁ֣ר לֹֽא זְנַחְתִּ֑י/ם כִּ֗י אֲנִ֛י יְהוָ֥ה אֱלֹהֵי/הֶ֖ם וְ/אֶעֱנֵֽ/ם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/006.yaml
  text: I will strengthen the house of Judah[a], and I will save the house of Joseph. I will restore them, because I have had compassion on them, and they will be as though I had not rejected them; for I am Yahweh their God[b], and I will answer them.
translation:
  language: de
  text: Ich werde das Haus Juda stärken und das Haus Josef[a] retten. Ich werde sie zurückbringen[b], denn ich habe Erbarmen mit ihnen. Sie werden sein, als ob ich sie nicht verworfen hätte. Denn ich bin Jahwe, ihr Gott, und ich werde ihnen antworten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Das Haus Josef“ bezeichnet gemeinschaftlich die Nachkommen Josefs und kann hier besonders für die nördlichen Stämme stehen.
    reason: cultural_note
  - marker: b
    text: 'Oder: „Ich werde sie wiederherstellen.“ Das hebräische Verb kann das Zurückbringen oder die Wiederherstellung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגִבַּרְתִּי
  choice: Ich werde … stärken
  rationale: Das Piel von גבר bezeichnet hier das Starkmachen. „Stärken“ gibt die kausative Bedeutung natürlich und ohne unnötige militärische Zuspitzung wieder.
- source_word: בֵּית יְהוּדָה
  choice: das Haus Juda
  rationale: Die korporative Bezeichnung „Haus Juda“ bleibt erhalten und wird nicht auf den bloßen Stammesnamen verkürzt.
- source_word: בֵּית יוֹסֵף
  choice: das Haus Josef
  rationale: Die wörtliche korporative Bezeichnung wird bewahrt; im prophetischen Zusammenhang kann sie besonders die Nordstämme bezeichnen.
- source_word: אוֹשִׁיעַ
  choice: retten
  rationale: Das Hifil von ישׁע bedeutet retten oder befreien. „Retten“ ist direkt, verständlich und lässt sowohl politische als auch theologische Bezüge offen.
- source_word: וְהוֹשְׁבוֹתִים
  choice: Ich werde sie zurückbringen
  rationale: Die Form wird im Zusammenhang der Wiederherstellung als Hifil von שוב verstanden. „Zurückbringen“ bewahrt den räumlichen Rückkehrsinn deutlicher als das allgemeinere „wiederherstellen“.
- source_word: כִּי רִחַמְתִּים
  choice: denn ich habe Erbarmen mit ihnen
  rationale: רחם bezeichnet erbarmende Zuwendung. Das deutsche Perfekt wahrt die Form des hebräischen Perfekts und begründet die angekündigte Rettung in Gottes bereits erwiesener beziehungsweise beschlossener Barmherzigkeit.
- source_word: וְהָיוּ כַּאֲשֶׁר לֹא זְנַחְתִּים
  choice: Sie werden sein, als hätte ich sie nicht verworfen
  rationale: זנח bedeutet verwerfen oder abweisen. Die Formulierung bewahrt den irrealen Vergleich, ohne die vorausgesetzte frühere Verwerfung abzuschwächen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in der im Deutschen geläufigen Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְאֶעֱנֵם
  choice: ich werde ihnen antworten
  rationale: Das Qal von ענה bedeutet hier antworten beziehungsweise erwidern. „Ihnen antworten“ ist lexikalisch direkt; „sie erhören“ wäre bereits stärker deutend.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. „Jahwe“ bewahrt den Charakter als Eigenname, während „der HERR“ ihn durch einen Titel ersetzt.
- issue: Tragweite von אוֹשִׁיעַ
  choice: retten
  alternative: befreien
  rationale: „Retten“ wahrt die umfassende Bedeutung des Verbs und legt nicht fest, ob vor allem politische Befreiung, Rückführung oder ein weiter gefasstes Heil gemeint ist.
- issue: Aussage „als hätte ich sie nicht verworfen“
  choice: irrealen Vergleich unverändert bewahren
  alternative: die frühere Verwerfung als aufgehoben oder vergessen umschreiben
  rationale: Der hebräische Text hält frühere Verwerfung und künftige Wiederannahme in Spannung. Die Übersetzung löst diese Spannung nicht durch eine erklärende Paraphrase auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die traditionellen korporativen Wendungen „Haus Juda“ und „Haus Josef“ bleiben erhalten. „Erbarmen haben“ trägt den biblischen Ton, ist aber weiterhin allgemein verständlich. Die Fußnotenmarker stehen jeweils unmittelbar bei der tatsächlich erläuterten Wendung.
