source:
  edition: WLC
  text: עַל הָֽ/רֹעִים֙ חָרָ֣ה אַפִּ֔/י וְ/עַל הָ/עַתּוּדִ֖ים אֶפְק֑וֹד כִּֽי פָקַד֩ יְהוָ֨ה צְבָא֤וֹת אֶת עֶדְר/וֹ֙ אֶת בֵּ֣ית יְהוּדָ֔ה וְ/שָׂ֣ם אוֹתָ֔/ם כְּ/ס֥וּס הוֹד֖/וֹ בַּ/מִּלְחָמָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/003.yaml
  text: My anger burns against the shepherds[a], and I will punish the male goats; for Yahweh of Armies has attended to his flock, the house of Judah[b], and will make them like his majestic horse in battle.
translation:
  language: de
  text: Mein Zorn ist gegen die Hirten[a] entbrannt, und die Böcke werde ich zur Rechenschaft ziehen. Denn Jahwe der Heerscharen[b] hat sich seiner Herde, des Hauses Juda, angenommen und wird sie im Kampf seinem prächtigen Pferd gleichmachen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Führer“. Hirten dienen in prophetischer Sprache häufig als Bild für die Verantwortlichen des Volkes; auch die „Böcke“ können führende oder mächtige Männer bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionelle Wiedergabe: „der HERR der Heerscharen“; auch möglich: „Jahwe der Heere“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרֹעִים
  choice: die Hirten
  rationale: Die wörtliche Hirtenmetapher bleibt erhalten; im prophetischen Zusammenhang bezeichnet sie die Verantwortlichen und Führer des Volkes.
- source_word: חָרָה אַפִּי
  choice: Mein Zorn ist ... entbrannt
  rationale: Die deutsche Wendung gibt das hebräische Bild heftig aufflammenden Zorns natürlich und mit seiner vollen Intensität wieder.
- source_word: הָעַתּוּדִים
  choice: die Böcke
  rationale: Die konkrete Tierbezeichnung bewahrt die mit den Hirten und der Herde verbundene Bildwelt; die mögliche metaphorische Bedeutung wird in der Fußnote genannt.
- source_word: אֶפְקֹד
  choice: werde ich zur Rechenschaft ziehen
  rationale: פקד bezeichnet hier ein feindliches Einschreiten. Die Formulierung macht den Strafcharakter deutlich, ohne den Umfang der Strafe näher festzulegen.
- source_word: פָקַד
  choice: hat sich ... angenommen
  rationale: 'Dasselbe Verb פקד hat hier aufgrund des Kontextes eine positive Bedeutung: Jahwe wendet sich seiner Herde wirksam zu. Die unterschiedliche Wiedergabe bildet den beabsichtigten Kontrast ab.'
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Der Gottesname wird als Jahwe wiedergegeben; Heerscharen bewahrt die umfassende, auch militärische Bedeutung des Titels צְבָאוֹת.
- source_word: עֶדְרוֹ
  choice: seiner Herde
  rationale: Herde setzt die Hirten- und Tiermetaphorik des Verses fort und ist im Deutschen idiomatisch.
- source_word: בֵּית יְהוּדָה
  choice: des Hauses Juda
  rationale: Die Apposition identifiziert Jahwes Herde ausdrücklich mit dem Haus Juda und bewahrt die Form des hebräischen Ausdrucks.
- source_word: וְשָׂם אוֹתָם
  choice: und wird sie ... machen
  rationale: Die Verbform wird als zukünftige Folge von Jahwes Zuwendung verstanden; die deutsche Konstruktion führt unmittelbar in den folgenden Vergleich.
- source_word: כְּסוּס הוֹדוֹ
  choice: wie sein prächtiges Ross
  rationale: Ross passt zum gehobenen, kriegerischen Kontext, während prächtig den Glanz und die Hoheit von הוֹד ausdrückt, ohne das bereits folgende Kampfmotiv zu verdoppeln.
- source_word: בַּמִּלְחָמָה
  choice: im Kampf
  rationale: Die Wendung gibt den militärischen Zusammenhang knapp und natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als Jahwe wiedergegeben, damit der im Hebräischen ausdrücklich verwendete Bundesname erkennbar bleibt.
- issue: Metaphorische Deutung von עַתּוּדִים
  choice: Das konkrete Bild „Böcke“ im Haupttext bewahren
  alternative: Anführer oder Machthaber
  rationale: Die Tiermetapher gehört zur bewussten Bildfolge von Hirten, Böcken, Herde und Ross. Eine direkte Auflösung als „Anführer“ würde eine plausible Deutung vorschnell in den Haupttext eintragen.
- issue: Zeitbezug von וְשָׂם
  choice: 'zukünftig: „wird ... machen“'
  alternative: 'vergangen: „hat ... gemacht“'
  rationale: Im prophetischen Zusammenhang bezeichnet die Aussage am besten die bevorstehende Folge von Jahwes Eingreifen, auch wenn die hebräische Form formal eine abgeschlossene Handlung ausdrücken kann.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zusammenhängende Tier- und Hirtenbildwelt bleibt bewusst sichtbar. „Ross“ trägt dem erhöhten kriegerischen Ton Rechnung, ohne altertümlich unverständlich zu sein; die Wiederholung von פקד wird wegen ihres gegensätzlichen Sinns kontextgemäß mit zwei unterschiedlichen deutschen Wendungen wiedergegeben.
