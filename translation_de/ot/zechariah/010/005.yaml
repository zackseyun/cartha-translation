source:
  edition: WLC
  text: וְ/הָי֨וּ כְ/גִבֹּרִ֜ים בּוֹסִ֨ים בְּ/טִ֤יט חוּצוֹת֙ בַּ/מִּלְחָמָ֔ה וְ/נִ֨לְחֲמ֔וּ כִּ֥י יְהוָ֖ה עִמָּ֑/ם וְ/הֹבִ֖ישׁוּ רֹכְבֵ֥י סוּסִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/005.yaml
  text: They will be like mighty men[a], trampling the mire of the streets in battle; they will fight, because Yahweh is with them, and they will put horsemen to shame.
translation:
  language: de
  text: Sie werden wie Krieger[a] sein, die im Kampf im Morast der Straßen stampfen. Sie werden kämpfen, denn Jahwe ist mit ihnen, und sie werden die Reiter beschämen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Helden«. Das hebräische Wort ist eine maskuline Bezeichnung für starke, tapfere Kämpfer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: Sie werden ... sein
  rationale: Das Qal-Perfekt mit vorangestelltem Waw hat in diesem prophetischen Zusammenhang futurische Bedeutung; das einleitende »und« kann im Deutschen für einen natürlichen Satzbeginn entfallen.
- source_word: כְגִבֹּרִים
  choice: wie Kriegshelden
  rationale: גִּבּוֹרִים bezeichnet hier starke, tapfere Kämpfer. »Kriegshelden« bewahrt das maskuline militärische Bild; »Helden« oder »Krieger« sind ebenfalls möglich.
- source_word: בּוֹסִים
  choice: zertreten
  rationale: Das Partizip von בוס beschreibt kräftiges Treten beziehungsweise Niedertrampeln. »Zertreten« gibt das anschauliche Kampfbild idiomatisch wieder.
- source_word: בְּטִיט חוּצוֹת
  choice: den Straßenschlamm
  rationale: Die Wendung bezeichnet den Schlamm oder Morast der Straßen. Das kompakte Wort »Straßenschlamm« bewahrt das konkrete Bild und klingt in modernem Deutsch natürlich.
- source_word: בַּמִּלְחָמָה
  choice: im Kampf
  rationale: Im unmittelbaren militärischen Zusammenhang bezeichnet מִלְחָמָה das Kampfgeschehen; »im Kampf« ist hier natürlicher als das allgemeinere »im Krieg«.
- source_word: וְנִלְחֲמוּ
  choice: Sie werden kämpfen
  rationale: Das Niphal von לחם bedeutet in diesem Kontext, sich am Kampf zu beteiligen oder zu kämpfen.
- source_word: כִּי
  choice: denn
  rationale: כִּי führt hier die Begründung für ihren Kampf und Erfolg an. »Denn« erhält den kausalen Zusammenhang in würdigem, natürlichem Deutsch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als der Eigenname »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עִמָּם
  choice: ist mit ihnen
  rationale: Die im Hebräischen nominal ausgedrückte Gegenwart wird im Deutschen durch »ist« ergänzt; gemeint ist Jahwes wirksame Gegenwart bei ihnen.
- source_word: וְהֹבִישׁוּ
  choice: sie werden ... zuschanden machen
  rationale: Die Hiphil-Form bezeichnet das Beschämen oder Demütigen des Gegners. »Zuschanden machen« erhält den kausativen Sinn und den gehobenen biblischen Ton.
- source_word: רֹכְבֵי סוּסִים
  choice: die Reiter
  rationale: Wörtlich sind es »Reiter von Pferden«. Im militärischen Kontext bezeichnet »die Reiter« eindeutig berittene Kämpfer und ist im Deutschen die natürliche knappe Entsprechung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. Die Wiedergabe »Jahwe« bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Maskuliner militärischer Ausdruck גִּבּוֹרִים
  choice: Kriegshelden
  alternative: Krieger
  rationale: Der Ausdruck ist grammatisch maskulin und bezeichnet tapfere, starke Kämpfer. »Kriegshelden« bewahrt diese Bildsprache, ohne eine weitergehende theologische Deutung einzutragen.
- issue: Bedeutung von וְהֹבִישׁוּ
  choice: zuschanden machen
  alternative: beschämen
  rationale: Beide Wiedergaben sind möglich. »Zuschanden machen« betont die öffentliche Niederlage und Demütigung der gegnerischen Reiter, ohne das Bild auf bloß inneres Schamgefühl zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer militärischer Bildsprache. Die Satzteilung vermeidet eine überladene Periode; »Kriegshelden«, »Straßenschlamm« und »zuschanden machen« verbinden Quellennähe mit guter Verständlichkeit.
