source:
  edition: WLC
  text: וְ/עָבַ֨ר בַּ/יָּ֜ם צָרָ֗ה וְ/הִכָּ֤ה בַ/יָּם֙ גַּלִּ֔ים וְ/הֹבִ֕ישׁוּ כֹּ֖ל מְצוּל֣וֹת יְאֹ֑ר וְ/הוּרַד֙ גְּא֣וֹן אַשּׁ֔וּר וְ/שֵׁ֥בֶט מִצְרַ֖יִם יָסֽוּר׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/010/011.yaml
  text: He will pass through the sea of distress and strike the waves of the sea[a], and all the depths of the Nile will dry up. The pride of Assyria will be brought down[c][b], and the scepter of Egypt will depart.
translation:
  language: de
  text: Er wird durch das Meer der Not ziehen[a] und die Wellen im Meer schlagen. Alle Tiefen des Nils[b] werden austrocknen. Der Hochmut Assurs wird zu Fall gebracht, und das Zepter Ägyptens[c] wird verschwinden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch ein Meer der Not“ oder „durch das aufgewühlte Meer“. Die hebräische Wendung ist sehr knapp und kann an den Durchzug beim Exodus erinnern, ohne nur ein bestimmtes Gewässer zu bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort יְאֹר kann „Fluss“ bedeuten, bezeichnet im Zusammenhang mit Ägypten aber gewöhnlich den Nil.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „der Stab Ägyptens“. „Zepter“ hebt hier wahrscheinlich die Herrschaftsmacht hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַר
  choice: Er wird … ziehen
  rationale: Das Qal-Perfekt mit vorangestelltem וְ erhält im prophetischen Zusammenhang Zukunftsbezug. Das nicht ausdrücklich genannte Subjekt wird entsprechend dem Kontext mit „er“ wiedergegeben; gemeint ist Gott.
- source_word: בַּיָּם צָרָה
  choice: durch das Meer der Not
  rationale: Die knappe hebräische Wortfolge wird als „Meer der Not“ verstanden. Diese Wiedergabe erhält das Substantiv צָרָה und lässt die an den Exodus erinnernde Bildsprache stehen.
- source_word: וְהִכָּה בַיָּם גַּלִּים
  choice: und im Meer die Wellen schlagen
  rationale: נכה wird in seiner konkreten Grundbedeutung „schlagen“ wiedergegeben. Die deutsche Wortstellung bewahrt sowohl die Ortsangabe „im Meer“ als auch das Wellenbild.
- source_word: וְהֹבִישׁוּ
  choice: werden austrocknen
  rationale: Bei Wasser bezeichnet die Form von יבש das Trockenwerden beziehungsweise Austrocknen. Der Plural wird auf die nachfolgenden „Tiefen“ bezogen.
- source_word: כֹּל מְצוּלוֹת יְאֹר
  choice: alle Tiefen des Nils
  rationale: מְצוּלוֹת bezeichnet tiefe Stellen oder Tiefen. יְאֹר meint im ägyptischen Zusammenhang sehr wahrscheinlich den Nil beziehungsweise sein Flusssystem.
- source_word: וְהוּרַד גְּאוֹן אַשּׁוּר
  choice: Der Hochmut Assurs wird zu Fall gebracht
  rationale: גְּאוֹן kann Stolz, Hoheit oder Erhabenheit bezeichnen; im Gerichtszusammenhang passt „Hochmut“. Die passive Form von ירד wird mit „wird zu Fall gebracht“ natürlich und bildhaft wiedergegeben.
- source_word: וְשֵׁבֶט מִצְרַיִם יָסוּר
  choice: und das Zepter Ägyptens wird verschwinden
  rationale: שֵׁבֶט kann Stab, Rute oder Zepter bedeuten. Parallel zur Erniedrigung Assurs bezeichnet „Zepter“ wahrscheinlich die ägyptische Herrschaftsmacht; יָסוּר drückt deren Beseitigung aus.
theological_decisions:
- issue: Fortdauer des Subjekts und unausgesprochener Handelnder
  choice: Gott bleibt bei den ersten beiden Verben das unausgesprochene Subjekt.
  alternative: Ein kollektives Subjekt, etwa das wiederhergestellte Volk, zieht durch das Meer.
  rationale: Die singularische Verbfolge und der Zusammenhang göttlicher Rettung sprechen dafür, dass Gott handelt. So bleibt auch die Exodus-ähnliche Darstellung erhalten, ohne Gott im hebräischen Text ausdrücklich zu benennen.
- issue: Bedeutung von Assurs גְּאוֹן
  choice: Hochmut
  alternative: Hoheit oder Pracht
  rationale: Der Gerichtskontext legt die negative Bedeutung „Hochmut“ nahe, doch die weitere Bedeutungsspanne des Wortes wird nicht zu einer Aussage über eine bestimmte geschichtliche Erfüllung verengt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kräftige Meeres- und Gerichtssprache bleibt erhalten; knappe hebräische Formulierungen werden nur so weit geglättet, wie es für einen natürlichen deutschen Satzbau erforderlich ist.
