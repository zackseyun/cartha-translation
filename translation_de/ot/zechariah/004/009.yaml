  terminology: „Serubbabel“ ist die übliche deutsche Namensform. „Jahwe der Heere“ übersetzt יהוה צבאות transparent, ohne den Gottesnamen durch einen bloßen Titel zu ersetzen; die Fußnote nennt etablierte traditionellere Alternativen. „Haus“ bewahrt die hebräische Ausdrucksweise, und die Tempelreferenz wird angemessen erläutert.
