id: ZEC.4.9
reference: Zechariah 4:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יְדֵ֣י זְרֻבָּבֶ֗ל יִסְּד֛וּ הַ/בַּ֥יִת הַ/זֶּ֖ה וְ/יָדָ֣י/ו תְּבַצַּ֑עְנָה וְ/יָ֣דַעְתָּ֔ כִּֽי יְהוָ֥ה צְבָא֖וֹת שְׁלָחַ֥/נִי אֲלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/009.yaml
  text: The hands of Zerubbabel laid the foundation of this house[a], and his hands will complete it[b]. Then you will know that Yahweh of Armies has sent me to you.
translation:
  language: de
  text: Die Hände Serubbabels haben den Grund dieses Hauses[a] gelegt, und seine Hände werden es vollenden. Dann wirst du erkennen, dass Jahwe der Heere[b] mich zu euch[c] gesandt hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „diesem Haus“ ist hier der Tempel gemeint.
    reason: cultural_note
  - marker: b
    text: 'Traditionell auch: „Jahwe der Heerscharen“ oder „der HERR der Heerscharen“.'
    reason: lexical_alternative
  - marker: c
    text: Im Hebräischen steht „du wirst erkennen“ im Singular, „zu euch“ dagegen im Plural.
    reason: textual_clarity
lexical_decisions:
- source_word: יְדֵי זְרֻבָּבֶל
  choice: Die Hände Serubbabels
  rationale: Die pluralische Form „Hände“ und damit die betonte persönliche Mitwirkung Serubbabels werden bewahrt.
- source_word: יִסְּדוּ
  choice: haben den Grund … gelegt
  rationale: Im Zusammenhang des Tempelbaus bezeichnet יסד konkret das Legen des Fundaments; „den Grund legen“ ist im Deutschen natürlich und präzise.
- source_word: הַבַּיִת הַזֶּה
  choice: dieses Hauses
  rationale: „Haus“ gibt בַּיִת wörtlich wieder und bewahrt die biblische Rede vom Tempel als Haus Jahwes; der konkrete Bezug wird in einer Fußnote erläutert.
- source_word: וְיָדָיו
  choice: und seine Hände
  rationale: Die Wiederholung des Hand-Motivs wird erhalten und verbindet Beginn und Vollendung des Bauwerks.
- source_word: תְּבַצַּעְנָה
  choice: werden es vollenden
  rationale: Das Verb bezeichnet das Zu-Ende-Bringen; das im Hebräischen nicht ausdrücklich genannte Objekt wird aus „dieses Haus“ aufgenommen.
- source_word: וְיָדַעְתָּ
  choice: Dann wirst du erkennen
  rationale: „Dann“ bringt den Folgezusammenhang zum Ausdruck; der Singular der Anrede bleibt erhalten.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heere
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; „der Heere“ übersetzt צְבָאוֹת verständlich und wahrt den Charakter des göttlichen Titels.
- source_word: שְׁלָחַנִי
  choice: mich … gesandt hat
  rationale: Das hebräische Perfekt bezeichnet eine vollzogene Sendung, deren Geltung in der Gegenwart fortbesteht.
- source_word: אֲלֵיכֶם
  choice: zu euch
  rationale: Der maskuline Plural wird ausdrücklich als „euch“ wiedergegeben und nicht an das vorhergehende singularische „du“ angeglichen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Eigenname wird als solcher erkennbar wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe des Titels צְבָאוֹת
  choice: der Heere
  alternative: der Heerscharen; Zebaoth
  rationale: „Der Heere“ vermittelt die Grundbedeutung in heutigem Deutsch; die traditionellere Form wird in der Fußnote genannt.
- issue: Wechsel zwischen singularischer und pluralischer Anrede
  choice: du … euch
  alternative: du … dir; ihr … euch
  rationale: Der hebräische Text wechselt bewusst oder zumindest unverkennbar von וְיָדַעְתָּ im Singular zu אֲלֵיכֶם im Plural. Die Übersetzung glättet diesen Wechsel nicht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkrete Bauaussage bleibt klar, während die wiederholte Bildsprache der „Hände“ und der Wechsel von singularischer zu pluralischer Anrede formal bewahrt werden.
