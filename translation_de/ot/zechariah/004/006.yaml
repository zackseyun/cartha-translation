base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/006.yaml
  text: 'Then he answered and said to me[a], “This is the word of Yahweh to Zerubbabel: ‘Not by might, nor by power[b], but by my Spirit,’ says Yahweh of Armies.”'
translation:
  language: de
  text: 'Da antwortete er mir: „Dies ist das Wort Jahwes an Serubbabel: Nicht durch Macht[a] und nicht durch Kraft, sondern durch meinen Geist, spricht Jahwe der Heere[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch ein Heer“ beziehungsweise „durch militärische Macht“; das hebräische Wort kann auch eine Streitmacht bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionelle Wiedergabe: „der HERR der Heerscharen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן וַיֹּאמֶר אֵלַי לֵאמֹר
  choice: Da antwortete er und sagte zu mir
  rationale: Die aufeinanderfolgenden Erzählformen werden mit „Da“ und den beiden Sprechverben wiedergegeben; das im Deutschen redundante לֵאמֹר wird idiomatisch durch den Doppelpunkt ausgedrückt.
- source_word: זֶה דְּבַר יְהוָה
  choice: Dies ist das Wort Jahwes
  rationale: „Wort“ bewahrt die prophetische Formel und ihre biblischen Bezüge; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: אֶל זְרֻבָּבֶל
  choice: an Serubbabel
  rationale: אֶל bezeichnet hier den Adressaten der prophetischen Botschaft; „an“ ist im Deutschen natürlich.
- source_word: לֹא בְחַיִל
  choice: Nicht durch Macht
  rationale: חַיִל umfasst Macht, Stärke, Vermögen und militärische Streitmacht. „Macht“ wahrt die Bedeutungsbreite; die militärische Lesart wird in einer Fußnote genannt.
- source_word: וְלֹא בְכֹחַ
  choice: und nicht durch Kraft
  rationale: כֹחַ bezeichnet Kraft oder Stärke. „Kraft“ bildet einen klaren Parallelismus zu „Macht“, ohne beide Begriffe völlig gleichzusetzen.
- source_word: כִּי אִם בְּרוּחִי
  choice: sondern durch meinen Geist
  rationale: כִּי אִם drückt den ausschließenden Gegensatz aus; „sondern“ ist dafür im Deutschen präzise. רוּחִי bezeichnet hier Gottes eigenen Geist, wobei „durch“ den instrumentalen Gegensatz fortführt.
- source_word: אָמַר יְהוָה צְבָאוֹת
  choice: spricht Jahwe der Heere
  rationale: „Spricht“ entspricht der geläufigen deutschen Prophetenformel. צְבָאוֹת wird transparent als „Heere“ übersetzt und bewahrt die militärischen wie himmlischen Anklänge des Titels.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. „Jahwe“ bewahrt diesen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von רוּחִי
  choice: meinen Geist
  alternative: meinen Atem / meinen Wind
  rationale: Im prophetischen Zusammenhang und im Gegensatz zu menschlicher Macht bezeichnet die Form am ehesten Gottes wirksamen Geist. Die Grundbedeutungen „Atem“ und „Wind“ bleiben lexikalisch möglich, sind hier jedoch kontextuell weniger wahrscheinlich.
- issue: Wiedergabe des Titels יְהוָה צְבָאוֹת
  choice: Jahwe der Heere
  alternative: der HERR der Heerscharen
  rationale: „Heere“ übersetzt צְבָאוֹת unmittelbar und ist heutigen Lesern verständlicher als das traditionelle „Heerscharen“, ohne festzulegen, ob irdische oder himmlische Heere gemeint sind.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Parallelismus „nicht durch Macht und nicht durch Kraft, sondern durch meinen Geist“ bleibt bewusst eng am Hebräischen; die prophetische Sprechformel wird idiomatisch als „spricht“ wiedergegeben.
