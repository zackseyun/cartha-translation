base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/007.yaml
  text: Who are you[a], O great mountain? Before Zerubbabel you will become a plain. And he will bring out the top stone amid shouts of, ‘Grace[b], grace to it!’
translation:
  language: de
  text: 'Wer bist du, du großer Berg? Vor Serubbabel wirst du zur Ebene. Dann wird er den obersten Stein[a] unter Jubelrufen hervorbringen: »Gnade[b], Gnade für ihn!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: den Schlussstein; wörtlich: den Kopfstein.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Gunst, Gunst für ihn!« Das hebräische Wort kann je nach Zusammenhang auch »Anmut« oder »Schönheit« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַר הַגָּדוֹל
  choice: du großer Berg
  rationale: Bewahrt die direkte Anrede und das Bild eines gewaltigen Hindernisses; ein zusätzliches, im Hebräischen nicht vorhandenes »o« wäre im modernen Deutsch unnötig feierlich.
- source_word: לְמִישֹׁר
  choice: wirst du zur Ebene
  rationale: מִישׁוֹר bezeichnet ebenes Land beziehungsweise eine Ebene. Die Formulierung erhält das Bild der Verwandlung des Berges.
- source_word: וְהוֹצִיא
  choice: Dann wird er … hervorbringen
  rationale: Das Hifil von יצא bezeichnet hier das Heraus- oder Hervorbringen. Aus dem Zusammenhang ist Serubbabel das naheliegende Subjekt.
- source_word: הָאֶבֶן הָרֹאשָׁה
  choice: den Schlussstein
  rationale: Wörtlich steht »der Kopfstein«. Im Zusammenhang des vollendeten Tempelbaus gibt »Schlussstein« die wahrscheinliche architektonische Funktion verständlich wieder, ohne die wörtlichere Alternative zu verschweigen.
- source_word: תְּשֻׁאוֹת
  choice: während man laut ruft
  rationale: Das Substantiv bezeichnet laute Rufe oder Zurufe. Die unpersönliche deutsche Formulierung gibt das Ereignis natürlich wieder, ohne im Ausgangstext nicht genannte Rufende einzuführen.
- source_word: חֵן חֵן לָהּ
  choice: Gnade, Gnade für ihn!
  rationale: חֵן kann Gnade, Gunst oder Anmut bezeichnen. Die Wiederholung bleibt als emphatischer Zuruf erhalten. Das maskuline Pronomen richtet sich nach dem deutschen Wort »Schlussstein«, während das hebräische לָהּ feminin ist und sich auf אֶבֶן bezieht.
theological_decisions:
- issue: Bedeutung von חֵן im Zuruf
  choice: Der Zuruf erbittet oder feiert Gnade beziehungsweise göttliche Gunst für den Stein und das damit bezeichnete Bauwerk.
  alternative: Der Zuruf schreibt dem Stein Schönheit oder Anmut zu.
  rationale: Der Tempelkontext legt Gnade oder Gunst nahe, doch das Bedeutungsfeld von חֵן lässt auch Anmut oder Schönheit zu. Diese Alternative wird in der Fußnote bewahrt, ohne eine engere dogmatische Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Direktheit und das Bergbild bleiben erhalten. »Schlussstein« ist allgemein verständlich; die wörtlichere und architektonisch weniger festgelegte Wiedergabe steht in der Fußnote. Die etwas markante Form des Zurufs wahrt die Kürze und Mehrdeutigkeit des Hebräischen.
