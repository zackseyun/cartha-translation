lexical_decisions:
- source_word: וַיְהִי
  choice: Dann erging
  rationale: Die Wayyiqtol-Form von היה führt einen weiteren Erzähl- beziehungsweise Offenbarungsschritt ein. In Verbindung mit דְבַר יְהוָה wird sie im Deutschen idiomatisch durch „Dann erging“ wiedergegeben.
- source_word: דְבַר
  choice: das Wort
  rationale: Im Status constructus דְבַר יְהוָה bezeichnet das Wort eine konkrete göttliche Mitteilung und gehört zur festen prophetischen Wendung „das Wort Jahwes“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: „Jahwe“ ist die im modernen Deutschen geläufige Umschrift des Gottesnamens JHWH und bewahrt den Eigennamen statt ihn durch einen Titel zu ersetzen.
- source_word: אֵלַי
  choice: an mich
  rationale: Die Präposition אֶל mit dem Suffix der ersten Person Singular bezeichnet hier den Empfänger der göttlichen Mitteilung; die feste deutsche Wendung lautet „das Wort erging an mich“.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv leitet den Inhalt der anschließenden Rede ein. Im natürlichen modernen Deutsch erfüllt ein Doppelpunkt diese Funktion klarer als das schwerfällige „indem er sprach“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ gibt ihn als Namen wieder; die traditionelle Wiedergabe „der HERR“ ersetzt ihn dagegen durch einen Titel. Die Fußnote weist auf diese verbreitete Tradition hin.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feste prophetische Formel „das Wort Jahwes erging an mich“ bleibt erkennbar; „Dann“ markiert den Fortgang der Vision. Der Doppelpunkt gibt לֵאמֹר idiomatisch wieder.
