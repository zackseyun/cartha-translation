base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/008.yaml
  text: Then the word of Yahweh came to me[a], saying,
translation:
  language: de
  text: 'Dann erging das Wort Jahwes[a] an mich:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
