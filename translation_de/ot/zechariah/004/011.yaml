  text: וָ/אַ֖עַן וָ/אֹמַ֣ר אֵלָ֑י/ו מַה שְּׁנֵ֤י הַ/זֵּיתִים֙ הָ/אֵ֔לֶה עַל יְמִ֥ין הַ/מְּנוֹרָ֖ה וְ/עַל שְׂמֹאולָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/011.yaml
  text: Then I answered and said to him[a], “What are these two olive trees on the right of the lampstand and on its left?”
translation:
  language: de
  text: 'Da antwortete ich und sagte zu ihm: „Was sind diese beiden Ölbäume rechts vom Leuchter und links von ihm?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאַעַן וָאֹמַר
  choice: Da antwortete ich und sagte
  rationale: Die beiden aufeinanderfolgenden Verben werden bewahrt. „Da“ gibt den erzählerischen Fortgang des Wayyiqtol natürlich wieder; „antwortete … und sagte“ erhält die hebräische Redeformel, obwohl inhaltlich eine Frage folgt.
- source_word: אֵלָיו
  choice: zu ihm
  rationale: Das ausdrückliche Pronomen wird wiedergegeben, ohne seinen nur aus dem Zusammenhang erkennbaren Bezug im Vers selbst erklärend einzusetzen.
- source_word: מַה שְּׁנֵי הַזֵּיתִים הָאֵלֶּה
  choice: Was sind das für zwei Ölbäume
  rationale: Diese im Deutschen natürliche Frageform bewahrt das fragende מַה, die Zweizahl und den hinweisenden Charakter von הָאֵלֶּה.
- source_word: עַל יְמִין הַמְּנוֹרָה
  choice: rechts vom Leuchter
  rationale: עַל bezeichnet hier die räumliche Lage. „Rechts vom“ ist modernes, idiomatisches Deutsch und vermeidet die missverständliche Vorstellung, die Bäume stünden auf dem Leuchter.
- source_word: הַמְּנוֹרָה
  choice: der Leuchter
  rationale: מְנוֹרָה bezeichnet einen Leuchter beziehungsweise Lampenständer. „Leuchter“ ist im Deutschen verständlich, knapp und in diesem biblischen Bild angemessen.
- source_word: וְעַל שְׂמֹאולָהּ
  choice: und links von ihm
  rationale: Die feminine Pronominalsuffixform verweist auf die מְנוֹרָה. Wegen des maskulinen deutschen Substantivs „Leuchter“ lautet das entsprechende Pronomen „ihm“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Doppelformel „antwortete … und sagte“ bleibt sichtbar; die räumliche Anordnung wird idiomatisch und ohne zusätzliche Deutung formuliert.
