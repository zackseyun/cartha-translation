  text: וַ/יֹּ֕אמֶר אֵ֖לֶּה שְׁנֵ֣י בְנֵֽי הַ/יִּצְהָ֑ר הָ/עֹמְדִ֖ים עַל אֲד֥וֹן כָּל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/014.yaml
  text: And he said[a], “These are the two sons of oil[b], who stand by the Lord of all the earth.”
translation:
  language: de
  text: 'Und er sagte: »Das sind die beiden Söhne des Öls[a], die beim Herrn der ganzen Erde stehen[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die beiden Gesalbten«. Wörtlich: »die beiden Söhne des Öls«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »die vor dem Herrn der ganzen Erde stehen«.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und er sagte
  rationale: Das Wayyiqtol von אמר führt die Erklärung in schlichter erzählerischer Folge ein.
- source_word: אֵלֶּה שְׁנֵי
  choice: Das sind die beiden
  rationale: Das pluralische Demonstrativpronomen steht prädikativ; im Deutschen wird die Kopula ergänzt. Der bestimmte Ausdruck verweist auf die zuvor gesehenen Gestalten.
- source_word: בְּנֵי הַיִּצְהָר
  choice: Söhne des Öls
  rationale: Die ungewöhnliche hebräische Metapher wird bewahrt. יִצְהָר bezeichnet insbesondere Olivenöl; eine direkte Wiedergabe vermeidet die vorschnelle Festlegung auf »Gesalbte«.
- source_word: הָעֹמְדִים
  choice: die … stehen
  rationale: Das Partizip beschreibt ihre fortdauernde Stellung beziehungsweise ihren Dienst und wird als natürlicher deutscher Relativsatz wiedergegeben.
- source_word: עַל אֲדוֹן
  choice: beim Herrn
  rationale: עַל bezeichnet hier im Zusammenhang mit »stehen« die Gegenwart beziehungsweise den Dienst bei einem Herrscher. »Beim Herrn« ist modernes Deutsch; »vor dem Herrn« bleibt als mögliche höfische Nuance in der Fußnote erhalten.
- source_word: כָּל הָאָרֶץ
  choice: der ganzen Erde
  rationale: Die Genitivverbindung bringt die umfassende Herrschaft des Herrn zum Ausdruck; »der ganzen Erde« ist idiomatisch und präzise.
theological_decisions:
- issue: Deutung von בְּנֵי הַיִּצְהָר
  choice: Die Metapher »Söhne des Öls« im Haupttext bewahren.
  alternative: die beiden Gesalbten
  rationale: Der hebräische Ausdruck ist nicht die gewöhnliche Bezeichnung für »Gesalbte«. Die bildhafte Formulierung bleibt daher offen, während die verbreitete Deutung in einer Fußnote genannt wird.
- issue: Nuance von עַל bei הָעֹמְדִים
  choice: »beim Herrn … stehen«
  alternative: »vor dem Herrn … stehen«
  rationale: Die Wendung bezeichnet das Stehen im Umfeld und Dienst des souveränen Herrn. »Vor« kann die höfische Gegenwart deutlicher ausdrücken und wird deshalb als Alternative dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die auffällige Metapher »Söhne des Öls« bleibt bewusst erhalten; die Satzstellung ist dennoch flüssig und allgemein verständlich.
