  naturalness: »Da antwortete … und sagte zu mir« ist bewusst quellennah und in einem würdigen biblischen Register noch vertretbar. Die Frage wird mit »was das für Dinge sind« natürliches modernes Deutsch. Der Fußnotenanker a sollte bei der tatsächlich erläuterten Relativformulierung stehen, nicht bei »mir« nach der Redeeinleitung.
