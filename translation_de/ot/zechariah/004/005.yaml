  text: וַ֠/יַּעַן הַ/מַּלְאָ֞ךְ הַ/דֹּבֵ֥ר בִּ/י֙ וַ/יֹּ֣אמֶר אֵלַ֔/י הֲ/ל֥וֹא יָדַ֖עְתָּ מָה הֵ֣מָּה אֵ֑לֶּה וָ/אֹמַ֖ר לֹ֥א אֲדֹנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/005.yaml
  text: Then the angel who was speaking with me answered and said to me[a], “Do you not know what these are?” And I said, “No[b], my lord.”
translation:
  language: de
  text: 'Da antwortete der Engel, der mit mir redete[a], und sagte zu mir: »Weißt du nicht, was das für Dinge sind?« Ich sagte: »Nein[b], mein Herr.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der mit mir sprach«. Die hebräische Wendung beschreibt den Engel als denjenigen, der sich fortlaufend mit Sacharja unterhält.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: »mein Herr«; eine respektvolle Anrede an den Engel, nicht eine Bezeichnung für den HERRN.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: antwortete
  rationale: ענה bezeichnet in dieser Erzählformel das Antworten oder Reagieren und leitet die Erwiderung des Engels ein.
- source_word: הַמַּלְאָךְ
  choice: der Engel
  rationale: מַלְאָךְ kann »Bote« oder »Engel« bedeuten; im Zusammenhang der Vision Sacharjas handelt es sich um den himmlischen Deuteengel.
- source_word: הַדֹּבֵר בִּי
  choice: der mit mir redete
  rationale: Das Partizip mit בְּ beschreibt den Engel als denjenigen, der sich im fortlaufenden Gespräch mit Sacharja befindet. Die Formulierung gibt diesen begleitenden Charakter natürlich wieder.
- source_word: וַיֹּאמֶר אֵלַי
  choice: und sagte zu mir
  rationale: Die Wiedergabe bewahrt die übliche hebräische Redeeinleitung und auch die Abfolge »antwortete und sagte«.
- source_word: הֲלוֹא יָדַעְתָּ
  choice: Weißt du nicht
  rationale: Die negative Frageform bleibt erhalten, ohne den rhetorischen Ton stärker festzulegen, als es der hebräische Text tut.
- source_word: מָה הֵמָּה אֵלֶּה
  choice: was diese sind
  rationale: Die knappe Formulierung fragt nach Identität oder Bedeutung der in der Vision gezeigten Dinge und folgt der unbestimmten Ausdrucksweise des Hebräischen.
- source_word: לֹא
  choice: Nein
  rationale: Der hebräische Text enthält nur die kurze Verneinung; das aus der Frage erschließbare »ich weiß es nicht« wird nicht ausdrücklich ergänzt.
- source_word: אֲדֹנִי
  choice: mein Herr
  rationale: Die Anrede wahrt den respektvollen Charakter des Ausdrucks und richtet sich hier an den Engel, nicht an den HERRN.
theological_decisions:
- issue: Bezug und Bedeutung von אֲדֹנִי
  choice: 'respektvolle Anrede des deutenden Engels: »mein Herr«'
  alternative: »mein Gebieter« oder sinngemäß »mein Herr« im Sinn von »mein Herr/Sir«
  rationale: Der Ausdruck bezeichnet hier nicht den Gottesnamen und redet auch nicht ausdrücklich Gott an. Die Übersetzung erhält die ehrerbietige Anrede, ohne dem Engel Göttlichkeit zuzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die in der deutschen Bibelsprache geläufige Doppelung »antwortete … und sagte« bleibt wegen der hebräischen Erzählform erhalten. Die knappe Antwort und die offene Bezeichnung »diese« bewahren die Ausdrucksweise und Spannung des Ausgangstextes.
