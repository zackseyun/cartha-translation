  text: Then the angel who was speaking with me returned and woke me[a], like a man who is awakened from his sleep.
translation:
  language: de
  text: Dann kehrte der Engel, der mit mir redete, zurück und weckte mich[a] wie einen Mann, der aus seinem Schlaf geweckt wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie einen Mann, der aus seinem Schlaf erwacht.“ Das hebräische Verb kann passiv beziehungsweise reflexiv („geweckt wird“) oder intransitiv („erwacht“) verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: kehrte … zurück
  rationale: שׁוב bezeichnet hier die Rückkehr des Engels; die deutsche Verbklammer gibt dies natürlich und präzise wieder.
- source_word: הַמַּלְאָךְ
  choice: der Engel
  rationale: מַלְאָךְ kann allgemein „Bote“ bedeuten, bezeichnet im Kontext der prophetischen Vision jedoch den himmlischen Mittler und wird daher idiomatisch mit „Engel“ wiedergegeben.
- source_word: הַדֹּבֵר בִּי
  choice: der mit mir redete
  rationale: Das Partizip kennzeichnet den Engel als denjenigen, der mit Sacharja redet. Das Präteritum fügt sich im Deutschen natürlich in die rückblickende Erzählung ein, ohne den relationalen Sinn von בִּי aufzugeben.
- source_word: וַיְעִירֵנִי
  choice: weckte mich
  rationale: Der Hifil von עור bezeichnet das Veranlassen des Erwachens; „weckte mich“ ist die natürliche moderne deutsche Entsprechung.
- source_word: כְּאִישׁ
  choice: wie einen Mann
  rationale: Die Vergleichspartikel und das maskuline Singularnomen werden direkt wiedergegeben; aufgrund des transitiven „weckte mich“ steht „einen Mann“ idiomatisch im Akkusativ.
- source_word: אֲשֶׁר יֵעוֹר מִשְּׁנָתוֹ
  choice: der aus seinem Schlaf geweckt wird
  rationale: Der Nifal von עור lässt sich passiv beziehungsweise reflexiv verstehen. Die passive Wiedergabe bewahrt die Stammform und die Parallele zum vorausgehenden kausativen Verb.
