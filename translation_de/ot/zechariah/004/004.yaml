  text: וָ/אַ֨עַן֙ וָֽ/אֹמַ֔ר אֶל הַ/מַּלְאָ֛ךְ הַ/דֹּבֵ֥ר בִּ֖/י לֵ/אמֹ֑ר מָה אֵ֖לֶּה אֲדֹנִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/004.yaml
  text: Then I answered and said to the angel who was speaking with me[a], “What are these, my lord?”
translation:
  language: de
  text: 'Da antwortete ich und sagte zu dem Engel, der mit mir redete[a]: »Was sind diese, mein Herr?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der mit mir sprach«. Die hebräische Wendung kehrt im Buch Sacharja als feste Bezeichnung für den deutenden Engel wieder, der den Propheten begleitet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַעַן וָאֹמַר
  choice: Da antwortete ich und sagte
  rationale: Die beiden hebräischen Verben werden beibehalten. »Da« gibt die erzählerische Abfolge des Wayyiqtol im natürlichen Deutschen wieder.
- source_word: הַמַּלְאָךְ
  choice: der Engel
  rationale: מַלְאָךְ kann »Bote« oder »Engel« bedeuten; im visionären Zusammenhang Sacharjas ist der himmlische Deuteengel gemeint.
- source_word: הַדֹּבֵר בִּי
  choice: der mit mir redete
  rationale: Die wiederkehrende Formel bezeichnet den Engel, der mit dem Propheten spricht. »Mit mir« gibt den kontextuellen Sinn der Präposition בְּ idiomatisch wieder; »in mir« wäre missverständlich.
- source_word: לֵאמֹר
  choice: nicht gesondert wiedergegeben
  rationale: Der Infinitiv leitet die direkte Rede ein. Nach »sagte« und vor dem Zitat wäre eine zusätzliche Wiedergabe als »indem ich sprach« oder »mit den Worten« im Deutschen unnötig schwerfällig.
- source_word: מָה אֵלֶּה
  choice: Was sind diese
  rationale: Die knappe Frage aus Interrogativpronomen und pluralischem Demonstrativpronomen bleibt erhalten, ohne das im Hebräischen nicht ausdrücklich stehende Substantiv »Dinge« einzufügen.
- source_word: אֲדֹנִי
  choice: mein Herr
  rationale: Die respektvolle Anrede gilt hier dem Engel. »Mein Herr« bewahrt den gehobenen Ton und die Grundbedeutung von אָדוֹן besser als das flachere »mein Herr, bitte« oder »mein Gebieter«.
theological_decisions:
- issue: Bezieht sich אֲדֹנִי auf Gott oder auf den deutenden Engel?
  choice: Die Anrede bezieht sich auf den Engel und wird als »mein Herr« wiedergegeben.
  alternative: Eine Wiedergabe als göttlicher Titel »Herr« könnte die Anrede auf Gott beziehen.
  rationale: Der unmittelbar angesprochene Gesprächspartner ist der Engel, der mit Sacharja redet. Die respektvolle Anrede darf nicht zu einem göttlichen Titel umgedeutet werden; im Deutschen ist die Großschreibung von »Herr« allerdings auch bei einer höflichen Anrede orthografisch üblich und daher für sich genommen kein Hinweis auf Göttlichkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Doppelwendung »antwortete … und sagte« bleibt bewusst erhalten; die direkte Rede ist klar und knapp formuliert.
