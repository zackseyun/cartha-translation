base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/013.yaml
  text: Then he said to me[a], “Do you not know what these are?” And I said, “No, my lord.”
translation:
  language: de
  text: 'Da sagte er zu mir: „Weißt du nicht, was diese sind?“ Ich antwortete: „Nein, mein Herr.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mein Gebieter“. Das hebräische אֲדֹנִי ist eine respektvolle Anrede mit der Bedeutung „mein Herr“; hier bezieht sie sich auf den Sprecher in der Vision, nicht auf den Gottesnamen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte er
  rationale: Das Wayyiqtol führt die Erzählung weiter; „Da sagte er“ gibt die zeitliche Folge in natürlichem deutschem Erzählstil wieder.
- source_word: אֵלַי
  choice: zu mir
  rationale: Direkte Wiedergabe der Präposition mit dem Suffix der 1. Person Singular.
- source_word: לֵאמֹר
  choice: in der direkten Rede nicht eigens wiedergegeben
  rationale: Der hebräische Rede-Einleiter ist im Deutschen vor einem unmittelbar folgenden Zitat redundant; der Doppelpunkt übernimmt seine Funktion.
- source_word: הֲלוֹא
  choice: Weißt du nicht
  rationale: Die Verbindung aus Fragepartikel und Verneinung bildet eine Frage, die eine bejahende Antwort nahelegt. Die deutsche Form bewahrt sowohl die Fragegestalt als auch ihre rhetorische Kraft.
- source_word: יָדַעְתָּ
  choice: weißt du
  rationale: Obwohl formal Perfekt, bezeichnet das Verb hier den gegenwärtigen Wissensstand des Angesprochenen; das deutsche Präsens ist daher angemessen.
- source_word: מָה אֵלֶּה
  choice: was diese sind
  rationale: Nahe Wiedergabe von Fragepronomen und pluralischem Demonstrativpronomen, ohne die Deutung „was diese bedeuten“ in den Text einzutragen.
- source_word: וָאֹמַר
  choice: Ich antwortete
  rationale: Das Verb bedeutet wörtlich „ich sagte“; im unmittelbaren Frage-Antwort-Wechsel ist „ich antwortete“ idiomatisches Deutsch und bewahrt die Gesprächsfunktion.
- source_word: לֹא
  choice: Nein
  rationale: Das Hebräische enthält nur die Verneinung. „Nein“ wahrt die knappe, elliptische Antwort.
- source_word: אֲדֹנִי
  choice: mein Herr
  rationale: Die respektvolle Anrede bezeichnet hier den Sprecher innerhalb der Vision. „Mein Herr“ bewahrt die ehrerbietige Bedeutung und die lexikalische Beziehung zu אָדוֹן; die Kleinschreibung innerhalb des Satzes und die Fußnote verhindern eine Verwechslung mit dem Gottesnamen.
theological_decisions:
- issue: אֲדֹנִי als ehrerbietige Anrede an den Deuteengel beziehungsweise Sprecher, nicht als Gottesname
  choice: mein Herr
  alternative: mein Gebieter; Herr; mein Herr als göttlicher Titel verstanden
  rationale: Der Zusammenhang weist auf den Gesprächspartner in der Vision. Die Übersetzung wahrt die ehrerbietige Anrede, ohne sie mit dem Bundesnamen JHWH oder zwingend mit einem göttlichen Titel gleichzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Dialogform bleibt erhalten; „was diese sind“ bewahrt die sachliche Offenheit des Hebräischen, statt bereits „was diese bedeuten“ auszulegen.
