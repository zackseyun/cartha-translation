base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/002.yaml
  text: And he said to me, “What do you see?” And I said, “I see, and behold, a lampstand all of gold, with its bowl on top of it, and seven lamps on it, with seven and seven spouts for the lamps that are on top of it.”
translation:
  language: de
  text: 'Und er sagte zu mir: »Was siehst du?« Ich antwortete: »Ich sehe: Da ist ein Leuchter, ganz aus Gold, mit einer Schale oben auf ihm, sieben Lampen darauf und sieben und sieben Zuführungen für die Lampen, die sich oben auf ihm befinden.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »sieben und sieben Zuführungen für die Lampen«. Die genaue Zahl und Zuordnung ist umstritten; möglich ist die Deutung von je sieben Zuführungen für jede Lampe, möglich ist aber auch eine Gesamtzahl von sieben Zuführungen.'
    reason: Die Fußnote erläutert die ungewöhnliche Wiederholung von שִׁבְעָה, ohne die im Haupttext bewahrte Mehrdeutigkeit aufzulösen.
lexical_decisions:
- source_word: מְנוֹרַת זָהָב כֻּלָּהּ
  choice: ein Leuchter, ganz aus Gold
  rationale: מְנוֹרָה bezeichnet hier den mehrarmigen Leuchter; כֻּלָּהּ betont, dass er vollständig aus Gold besteht.
- source_word: גֻלָּהּ
  choice: eine Schale
  rationale: Das Wort bezeichnet ein rundes Behältnis beziehungsweise Ölreservoir oben auf dem Leuchter.
- source_word: מוּצָקוֹת
  choice: Zuführungen
  rationale: Im Zusammenhang des Leuchters sind damit offenbar Leitungen oder Ausgüsse gemeint, durch die Öl zu den Lampen gelangt. Das allgemeinere »Zuführungen« wahrt die funktionale Bedeutung, ohne die genaue Bauform festzulegen.
- source_word: שִׁבְעָה וְשִׁבְעָה
  choice: je sieben
  rationale: Die distributive Wiedergabe entspricht einer verbreiteten Deutung der ungewöhnlichen Verdopplung und ergibt sieben Zuführungen für jede der sieben Lampen.
- source_word: וְהִנֵּה
  choice: da ist
  rationale: Die deutsche Schauformel gibt den plötzlichen, aufmerksamkeitslenkenden Charakter von הִנֵּה natürlich wieder.
theological_decisions:
- issue: Anzahl und Zuordnung der מוּצָקוֹת
  choice: je sieben Zuführungen für die Lampen
  alternative: insgesamt sieben Zuführungen beziehungsweise »sieben und sieben« Zuführungen
  rationale: Der hebräische Wortlaut ist auffällig und kann unterschiedlich verstanden werden. Der Haupttext gibt die wahrscheinlich distributive Lesart wieder; die Fußnote bewahrt die formale Mehrdeutigkeit, ohne eine symbolische Deutung einzutragen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Rede bleibt klar und anschaulich; Gedankenstrich und »da ist« vermitteln den Eindruck der Vision. Technische Einzelheiten werden verständlich, aber nicht überpräzise wiedergegeben.
