base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/012.yaml
  text: Then I answered a second time and said to him[a], “What are these two olive branches that are beside the two golden pipes[c][b], which pour out the gold from themselves?”
translation:
  language: de
  text: 'Da antwortete ich ein zweites Mal und sagte zu ihm: »Was sind die beiden fruchttragenden Zweige[a] der Olivenbäume neben den beiden goldenen Röhren[b], die das Gold[c] aus sich herausfließen lassen?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die beiden Büschel/Rispen der Olivenbäume«. Das hebräische Wort ist hier ungewöhnlich und kann fruchttragende Ölbaumtriebe statt größerer Zweige bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »goldene Leitungen« beziehungsweise »goldene Ausgüsse«.'
    reason: lexical_alternative
  - marker: c
    text: Wahrscheinlich ist goldfarbenes Öl gemeint; wörtlich steht im Hebräischen »das Gold«.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַעַן שֵׁנִית וָאֹמַר אֵלָיו
  choice: Da antwortete ich ein zweites Mal und sagte zu ihm
  rationale: Die Erzählfolge und die ausdrückliche Wiederholung werden gewahrt; „sagte“ entspricht dem hebräischen Verb, obwohl eine Frage folgt.
- source_word: שְׁתֵּי שִׁבֲּלֵי הַזֵּיתִים
  choice: die beiden fruchttragenden Zweige der Ölbäume
  rationale: Das ungewöhnliche שִׁבֲּלֵי bezeichnet sonst Ähren oder Rispen. Im Zusammenhang von Ölbäumen legt es fruchttragende Triebe oder Zweige nahe; die ungewöhnliche Bildsprache bleibt in einer Fußnote sichtbar.
- source_word: אֲשֶׁר בְּיַד
  choice: neben
  rationale: Wörtlich steht „an der Hand von“; als räumliche Wendung bei unbelebten Gegenständen bedeutet dies hier natürlich „neben“ beziehungsweise „bei“.
- source_word: שְׁנֵי צַנְתְּרוֹת הַזָּהָב
  choice: die beiden goldenen Röhren
  rationale: Das seltene Wort bezeichnet offenbar röhrenartige Leitungen oder Ausgüsse. „Röhren“ wahrt die Form und die Funktion als Leitung, ohne einen bestimmten technischen Aufbau vorauszusetzen.
- source_word: הַמְרִיקִים מֵעֲלֵיהֶם
  choice: die ... aus sich herausfließen lassen
  rationale: Das Partizip bezeichnet ein Leeren oder Ausfließenlassen. Die schwierige Präpositionalverbindung wird quellbezogen wiedergegeben, ohne den Mechanismus der Vision genauer festzulegen.
- source_word: הַזָּהָב
  choice: das Gold
  rationale: Der hebräische Text sagt ausdrücklich „das Gold“. Wahrscheinlich ist goldfarbenes Öl gemeint, doch die wörtliche visionäre Bezeichnung bleibt im Haupttext erhalten.
theological_decisions:
- issue: Deutung von „das Gold“ innerhalb der Leuchtervision
  choice: Die wörtliche Wendung „das Gold“ bleibt im Haupttext stehen.
  alternative: „das goldene Öl“
  rationale: Die wahrscheinlich gemeinte Flüssigkeit wird nicht erklärend in den Text eingesetzt. So bleiben die visionäre Metapher und ihre Spannung erhalten; die naheliegende Deutung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die seltenen technischen und botanischen Begriffe werden verständlich wiedergegeben, während ihre Unsicherheit durch Fußnoten offengehalten wird.
