  text: כִּ֣י מִ֣י בַז֮ לְ/י֣וֹם קְטַנּוֹת֒ וְ/שָׂמְח֗וּ וְ/רָא֞וּ אֶת הָ/אֶ֧בֶן הַ/בְּדִ֛יל בְּ/יַ֥ד זְרֻבָּבֶ֖ל שִׁבְעָה אֵ֑לֶּה עֵינֵ֣י יְהוָ֔ה הֵ֥מָּה מְשׁוֹטְטִ֖ים בְּ/כָל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/010.yaml
  text: For who has despised the day of small things? For these seven will rejoice and will see the plumb stone in the hand of Zerubbabel—these are the eyes of Yahweh[a], ranging through all the earth.
translation:
  language: de
  text: Denn wer hat den Tag der kleinen Dinge verachtet? Diese sieben werden sich freuen und das Senkblei[a] in Serubbabels Hand sehen – sie sind die Augen Jahwes, die die ganze Erde durchstreifen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Zinnstein«. Wörtlich: »Stein des Zinns«. Das hebräische Wort kann Zinn bezeichnen, meint in diesem Bauzusammenhang aber wahrscheinlich ein Senkgewicht oder einen Messstein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַז
  choice: hat … verachtet
  rationale: Das Verb bezeichnet geringschätziges oder verächtliches Behandeln. Das Perfekt und die rhetorische Schärfe der Frage bleiben erhalten.
- source_word: לְיוֹם קְטַנּוֹת
  choice: den Tag der kleinen Dinge
  rationale: Die Wendung bleibt nahe beim hebräischen Ausdruck »Tag der kleinen Dinge/Kleinheiten« und wird nicht auf »kleine Anfänge« eingeengt.
- source_word: וְשָׂמְחוּ וְרָאוּ
  choice: werden sich freuen und … sehen
  rationale: Die beiden koordinierten Verben werden ausdrücklich wiedergegeben. Die Zukunftsform passt zum visionären Zusammenhang, ohne die Beziehung zwischen Freude und Sehen durch einen nicht ausdrücklich markierten Temporalsatz festzulegen.
- source_word: הָאֶבֶן הַבְּדִיל
  choice: den Senkstein[a]
  rationale: בְּדִיל kann »Zinn« bezeichnen; im Bauzusammenhang liegt jedoch ein Senkgewicht zum lotrechten Ausrichten nahe. »Senkstein« bewahrt sowohl das Steinbild als auch die vermutliche Funktion.
- source_word: בְּיַד זְרֻבָּבֶל
  choice: in Serubbabels Hand
  rationale: Die knappe deutsche Form gibt die hebräische Orts- und Handlungsvorstellung natürlich wieder.
- source_word: שִׁבְעָה אֵלֶּה
  choice: Diese sieben
  rationale: Der nachgestellte Ausdruck wird als Subjekt der vorausgehenden Verben verstanden und zugleich durch den folgenden Satz als die Augen Jahwes erläutert.
- source_word: עֵינֵי יְהוָה
  choice: die Augen Jahwes
  rationale: Das bedeutsame Visionsbild und der Gottesname bleiben ausdrücklich erhalten.
- source_word: מְשׁוֹטְטִים בְּכָל הָאָרֶץ
  choice: die die ganze Erde durchstreifen
  rationale: Das Partizip beschreibt fortdauernde, umfassende Bewegung; »durchstreifen« ist im modernen Deutsch anschaulich und idiomatisch.
theological_decisions:
- issue: Bezug von »diese sieben«
  choice: »Diese sieben« sind das nachgestellte Subjekt von »werden sich freuen und … sehen« und werden anschließend mit den Augen Jahwes gleichgesetzt.
  alternative: »Diese sieben« bezeichnet zunächst die sieben Lampen und wird erst mittelbar mit Jahwes Augen verbunden.
  rationale: Die Wortstellung erlaubt die nachgestellte Subjektlesart; die unmittelbare Folge »diese sieben – die Augen Jahwes« legt eine appositionelle Identifizierung nahe. Die Übersetzung erklärt die Symbolik nicht über den Wortlaut hinaus.
- issue: Verhältnis von »sich freuen« und »sehen«
  choice: Beide Verben werden gleichgeordnet wiedergegeben.
  alternative: »Sie werden sich freuen, wenn sie … sehen.«
  rationale: Die Gleichordnung wahrt das zweimalige וְ- und vermeidet, die syntaktische Beziehung interpretierend in einen Temporalsatz umzuwandeln.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Wendung »Tag der kleinen Dinge« bewahrt bewusst das hebräische Bild; »kleine Anfänge« wäre glatter, aber stärker deutend. Der Gottesname wird in der im Deutschen geläufigen Form »Jahwe« wiedergegeben.
