  yaml_path: translation/ot/zechariah/004/003.yaml
  text: And two olive trees were beside it[b][a], one on the right of the bowl and one on its left.
translation:
  language: de
  text: Und zwei Ölbäume standen daneben[a], einer rechts von der Schale[b] und einer links von ihr.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf ihr“ beziehungsweise „über ihr“. Die hebräische Präposition ist räumlich weiter gefasst; die anschließenden Angaben „rechts“ und „links“ sprechen jedoch für „daneben“.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist das schalenförmige Ölbehältnis in der Leuchtervision.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/שְׁנַיִם זֵיתִים
  choice: Und zwei Ölbäume
  rationale: Das Waw führt die Beschreibung der Vision fort. זֵיתִים bezeichnet hier aufgrund der räumlichen Anordnung eindeutig Ölbäume, nicht Olivenfrüchte.
- source_word: עָלֶיהָ
  choice: daneben
  rationale: Die Präposition עַל hat ein breites räumliches Bedeutungsspektrum. Die anschließende Platzierung rechts und links spricht hier für eine seitliche Nähe; „daneben“ ist im Deutschen natürlich, ohne eine Lage unmittelbar obenauf festzulegen.
- source_word: אֶחָד מִ/ימִין הַ/גֻּלָּה
  choice: einer rechts von der Schale
  rationale: אֶחָד wird distributiv gebraucht. מִימִין bezeichnet die Position an der rechten Seite; גֻּלָּה ist im Zusammenhang das schalenförmige Ölbehältnis der Leuchtervision.
- source_word: וְ/אֶחָד עַל שְׂמֹאלָהּ
  choice: und einer links von ihr
  rationale: Die parallele Formulierung gibt die entsprechende Position auf der linken Seite wieder. Das feminine Pronomen bezieht sich natürlich auf „die Schale“.
