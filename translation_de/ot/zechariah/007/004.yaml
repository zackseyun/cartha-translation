  text: וַ/יְהִ֛י דְּבַר יְהוָ֥ה צְבָא֖וֹת אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/004.yaml
  text: Then the word of Yahweh of hosts came to me[a], saying,
translation:
  language: de
  text: 'Da erging an mich das Wort Jahwes der Heerscharen:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Da erging
  rationale: Die Wayyiqtol-Form führt die nächste Erzählstufe ein. „Da erging“ ist im Deutschen eine natürliche, würdige prophetische Formel, ohne das altertümliche „Und es geschah“ zu verwenden.
- source_word: דְּבַר
  choice: das Wort
  rationale: In prophetischen Formeln bezeichnet דְּבַר eine göttliche Mitteilung. „Das Wort“ bewahrt die feste biblische Ausdrucksweise, ohne sie interpretierend auf „Botschaft“ einzuengen.
- source_word: יְהוָה
  choice: Jahwes
  rationale: Der Gottesname wird als persönlicher Name „Jahwe“ wiedergegeben; der Genitiv passt natürlich zur deutschen Wendung „das Wort Jahwes“.
- source_word: צְבָאוֹת
  choice: des Herrn der Heerscharen
  rationale: Im festen Gottesnamen-Titel wird צְבָאוֹת mit „Heerscharen“ wiedergegeben. Die Apposition macht den Titel im Deutschen lesbar; eine Fußnote weist auf die knappere hebräische Form hin.
- source_word: אֵלַי
  choice: an mich
  rationale: Bei einer Mitteilung ist „an mich erging“ die idiomatische deutsche Entsprechung.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der hebräische Infinitiv leitet die folgende direkte Rede ein. Ein Doppelpunkt erfüllt diese Funktion im modernen Deutschen natürlicher als das schwerfällige „indem er sprach“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: HERR; Jehova
  rationale: Der Ausgangstext nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Gottesnamen in der im Deutschen üblichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Verhältnis von יְהוָה und צְבָאוֹת
  choice: Jahwe, der Herr der Heerscharen
  alternative: Jahwe der Heerscharen; Jahwe der Heere
  rationale: צְבָאוֹת ist Teil eines traditionellen göttlichen Titels. „Heerscharen“ lässt dessen mögliche himmlische wie irdische Weite bestehen; die Fußnote bewahrt zugleich die kompakte Struktur des Hebräischen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die etablierte prophetische Formel „das Wort … erging an“ bleibt erhalten; לֵאמֹר wird idiomatisch durch den Doppelpunkt ausgedrückt. Der Gottesname erscheint als „Jahwe“, während „Heerscharen“ die traditionelle Breite des Titels wahrt.
