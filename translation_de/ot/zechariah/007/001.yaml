source:
  edition: WLC
  text: וַֽ/יְהִי֙ בִּ/שְׁנַ֣ת אַרְבַּ֔ע לְ/דָרְיָ֖וֶשׁ הַ/מֶּ֑לֶךְ הָיָ֨ה דְבַר יְהוָ֜ה אֶל זְכַרְיָ֗ה בְּ/אַרְבָּעָ֛ה לַ/חֹ֥דֶשׁ הַ/תְּשִׁעִ֖י בְּ/כִסְלֵֽו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/001.yaml
  text: And in the fourth year of King Darius[a], the word of Yahweh came to Zechariah on the fourth day of the ninth month, in Kislev.
translation:
  language: de
  text: Im vierten Jahr des Königs Darius erging am vierten Tag des neunten Monats, im Monat Kislev, das Wort Jahwes an Sacharja.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kislev ist der Name des neunten Monats im hebräischen Kalender.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: Im vierten Jahr …
  rationale: Die narrative Einleitung wird in natürlichem modernem Deutsch durch die vorangestellte Zeitangabe wiedergegeben; die altertümliche Formel „Und es geschah“ ist dafür nicht erforderlich.
- source_word: בִּשְׁנַת אַרְבַּע לְדָרְיָוֶשׁ הַמֶּלֶךְ
  choice: im vierten Jahr des Königs Darius
  rationale: Die übliche Regierungsjahr-Datierung bleibt formal erhalten und klingt zugleich idiomatisch deutsch.
- source_word: הָיָה דְבַר יְהוָה אֶל זְכַרְיָה
  choice: erging das Wort Jahwes an Sacharja
  rationale: „Erging … an“ ist eine natürliche, würdevolle deutsche Wiedergabe der prophetischen Offenbarungsformel, deren hebräisches Verb wörtlich „war“ lautet.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „HERR“ ersetzt; „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: בְּאַרְבָּעָה לַחֹדֶשׁ הַתְּשִׁיעִי
  choice: am vierten Tag des neunten Monats
  rationale: „Tag“ ist im hebräischen Datumsformular eindeutig mitgemeint und wird zur Klarheit ergänzt.
- source_word: בְּכִסְלֵו
  choice: im Kislev
  rationale: Der Monatsname wird in seiner im Deutschen üblichen Form transliteriert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. Die Wiedergabe als Eigenname bewahrt diese Unterscheidung; die deutsche Standardform lautet „Jahwe“.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung vermeidet die altertümliche Einleitung „Und es geschah“, bewahrt aber die feierliche prophetische Datierungs- und Offenbarungsformel.
