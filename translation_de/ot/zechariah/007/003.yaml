source:
  edition: WLC
  text: לֵ/אמֹ֗ר אֶל הַ/כֹּֽהֲנִים֙ אֲשֶׁר֙ לְ/בֵית יְהוָ֣ה צְבָא֔וֹת וְ/אֶל הַ/נְּבִיאִ֖ים לֵ/אמֹ֑ר הַֽ/אֶבְכֶּה֙ בַּ/חֹ֣דֶשׁ הַ/חֲמִשִׁ֔י הִנָּזֵ֕ר כַּ/אֲשֶׁ֣ר עָשִׂ֔יתִי זֶ֖ה כַּ/מֶּ֥ה שָׁנִֽים־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/003.yaml
  text: to say to the priests of the house of Yahweh of Armies[a], and to the prophets, saying, “Should I weep in the fifth month[b], abstaining as I have done for these many years?”
translation:
  language: de
  text: 'um den Priestern am Haus Jahwes, des Herrn der Heerscharen,[a] und den Propheten zu sagen: »Soll ich im fünften Monat weinen und mich enthalten,[b] wie ich es nun schon so viele Jahre getan habe?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionelle Wiedergabe: »der HERR der Heerscharen«; auch »Jahwe Zebaot«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »mich absondern«; das hebräische Wort kann eine rituelle Enthaltung bezeichnen, die mehr umfasst als Fasten allein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵאמֹר ... לֵאמֹר
  choice: um ... zu sagen
  rationale: Die Infinitivkonstruktion führt den Zweck der in Vers 2 genannten Sendung und anschließend den Inhalt der Anfrage ein. Im Deutschen genügt eine einzige natürliche Redeeinleitung.
- source_word: אֶל הַכֹּהֲנִים אֲשֶׁר לְבֵית יְהוָה צְבָאוֹת
  choice: den Priestern am Haus Jahwes, des Herrn der Heerscharen
  rationale: Die Wendung ordnet die Priester dem Tempel zu. „am Haus“ lässt offen, ob vor allem ihre Zugehörigkeit oder ihr dortiger Dienst gemeint ist, und vermeidet das missverständliche „Priester des Hauses“.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe, der Herr der Heerscharen
  rationale: „Jahwe“ gibt den Gottesnamen wieder; „Herr der Heerscharen“ ist eine verständliche, würdevolle Wiedergabe des traditionellen Titels und lässt dessen himmlische wie militärische Weite bestehen.
- source_word: הַנְּבִיאִים
  choice: die Propheten
  rationale: Direkte und im Kontext eindeutige Wiedergabe der befragten prophetischen Amtsträger.
- source_word: הַאֶבְכֶּה
  choice: Soll ich ... weinen
  rationale: Der Imperfekt der ersten Person steht in einer erwägenden Frage darüber, ob die bisherige Trauerpraxis fortgesetzt werden soll.
- source_word: בַּחֹדֶשׁ הַחֲמִשִּׁי
  choice: im fünften Monat
  rationale: Die Ordnungszahl wird beibehalten; ein später gebräuchlicher Monatsname wird nicht in den Text eingetragen.
- source_word: הִנָּזֵר
  choice: mich enthalten
  rationale: Das Verb bezeichnet rituelle Absonderung oder Enthaltung und ist weiter als bloßes Fasten. Die reflexive deutsche Form entspricht der hier gemeinten persönlichen Praxis.
- source_word: כַּאֲשֶׁר עָשִׂיתִי זֶה כַּמֶּה שָׁנִים
  choice: wie ich es nun schon so viele Jahre getan habe
  rationale: Das Perfekt bezeichnet die über Jahre ausgeübte Praxis; „nun schon“ gibt den rückblickenden und bis zur Gegenwart reichenden Sinn der hebräischen Zeitangabe natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. „Jahwe“ macht diesen Namen im Haupttext sichtbar, ohne ihn durch einen bloßen Titel zu ersetzen.
- issue: Bedeutungsumfang von צבאות
  choice: Herr der Heerscharen
  alternative: Herr der Mächte / Jahwe Zebaot
  rationale: „Heerscharen“ bewahrt die traditionelle und zugleich mehrdeutige Vorstellung geordneter himmlischer oder irdischer Streitkräfte, ohne sie auf eine einzige Referenz festzulegen.
- issue: Art der Enthaltung in הִנָּזֵר
  choice: mich enthalten
  alternative: fasten / mich absondern
  rationale: Der Zusammenhang mit dem Trauerritus schließt Fasten wahrscheinlich ein, doch das hebräische Verb kann umfassender rituelle Enthaltung oder Absonderung bezeichnen. Die Übersetzung engt dies nicht unnötig ein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzanfang bleibt als zweckangebender Anschluss an Vers 2 erkennbar. Die direkte Rede ist klar und mündlich verständlich; traditionelle Fachsprache wird nur beim feststehenden Gottestitel verwendet.
