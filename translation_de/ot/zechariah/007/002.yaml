base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/002.yaml
  text: Bethel sent Sharezer and Regem-melech and his men to entreat the favor of Yahweh[b][a],
translation:
  language: de
  text: Bethel[c] sandte Scharezer, Regem-Melech und seine Männer, um Jahwe[a] um Gunst zu bitten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch »JHWH«; hier als Gottesname »Jahwe« wiedergegeben.
    reason: divine_name
  - marker: b
    text: 'Wörtlich: »das Angesicht Jahwes günstig zu stimmen«; gemeint ist, Jahwes Gunst zu erbitten.'
    reason: lexical_alternative
  - marker: c
    text: Hebräisch »Bethel«. Möglich ist auch die Auffassung als »Haus Gottes«; hier ist wahrscheinlich der Ortsname gemeint.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: sandte
  rationale: Das Narrativpräteritum gibt die hebräische Verbfolge natürlich wieder; ein zusätzliches »nun« ist im Ausgangstext nicht ausdrücklich vorhanden.
- source_word: בֵּית אֵל
  choice: Bethel
  rationale: Die Form ist hier am wahrscheinlichsten als Ortsname beziehungsweise als Bezeichnung für dessen Bevölkerung zu verstehen, die als handelndes Subjekt auftritt.
- source_word: שַׂר אֶצֶר
  choice: Scharezer
  rationale: Der Personenname wird in einer im Deutschen gut lesbaren, am Hebräischen orientierten Form transliteriert.
- source_word: וְרֶגֶם מֶלֶךְ
  choice: Regem-Melech
  rationale: Die Wiedergabe als zusammengesetzter Personenname entspricht der wahrscheinlichsten syntaktischen Auffassung und vermeidet eine unbegründete Deutung als Titel.
- source_word: וַאֲנָשָׁיו
  choice: und seine Männer
  rationale: Das maskuline Singularsuffix bezieht sich am natürlichsten auf den unmittelbar zuvor genannten Mann; die Bezugnahme bleibt im Hebräischen jedoch nicht völlig eindeutig.
- source_word: לְחַלּוֹת אֶת־פְּנֵי
  choice: um … um Gunst zu bitten
  rationale: Die natürliche deutsche Wendung vermittelt den bittenden Sinn des hebräischen Idioms, das wörtlich vom Besänftigen beziehungsweise Anflehen des Angesichts spricht.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben statt durch den Titel »HERR« ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen; die deutsche Form »Jahwe« bewahrt diesen Charakter.
- issue: Bestimmung des Subjekts בֵּית אֵל
  choice: Bethel als Ort beziehungsweise Ortsgemeinschaft
  alternative: das Haus Gottes
  rationale: Im Zusammenhang ist der Ortsname die wahrscheinlichste Lesart. Die wörtliche Auflösung als »Haus Gottes« würde eine nicht erforderliche theologische Bedeutung eintragen.
- issue: Bezug des Suffixes in וַאֲנָשָׁיו
  choice: seine Männer, auf Regem-Melech bezogen
  alternative: dessen Männer, auf Bethel bezogen
  rationale: Der unmittelbar vorausgehende maskuline Personenname ist der natürlichste Bezug, doch die grammatische Form allein beseitigt die Mehrdeutigkeit nicht vollständig.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Eigennamen werden deutsch lesbar transliteriert; das hebräische Idiom wird im Haupttext natürlich wiedergegeben und in einer Fußnote erläutert.
