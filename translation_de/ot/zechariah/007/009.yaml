  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כֹּ֥ה אָמַ֛ר יְהוָ֥ה צְבָא֖וֹת לֵ/אמֹ֑ר מִשְׁפַּ֤ט אֱמֶת֙ שְׁפֹ֔טוּ וְ/חֶ֣סֶד וְ/רַֽחֲמִ֔ים עֲשׂ֖וּ אִ֥ישׁ אֶת אָחִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/009.yaml
  text: 'Thus says Yahweh of hosts[a], saying: Render true judgments, and show steadfast love and compassion[b], each man to his brother.'
translation:
  language: de
  text: 'So spricht Jahwe der Heerscharen: »Fällt gerechte Urteile und erweist einander[a] beständige Liebe und Erbarmen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »jeder seinem Bruder«. Die männliche Einzelformulierung bezeichnet hier das gegenseitige Verhalten innerhalb der Gemeinschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die geläufige deutsche Prophetenformel bewahrt den feierlichen Botenstil; das Perfekt wird in dieser Formel idiomatisch präsentisch wiedergegeben.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Gibt den Gottesnamen unmittelbar wieder und bewahrt den traditionellen, gewichtigen Titel, ohne צְבָאוֹת vorschnell auf irdische Armeen einzuengen.
- source_word: לֵאמֹר
  choice: durch Doppelpunkt und direkte Rede wiedergegeben
  rationale: Der Infinitiv leitet den Inhalt der Rede ein; im natürlichen Deutschen leisten Doppelpunkt und direkte Rede dieselbe Funktion, ohne das schwerfällige »indem er sprach«.
- source_word: מִשְׁפַּט אֱמֶת שְׁפֹטוּ
  choice: Fällt gerechte Urteile
  rationale: Die Verbindung aus »Urteil/Recht« und »Wahrheit/Zuverlässigkeit« fordert wahrhaftige, integre Rechtsprechung. Die deutsche Formulierung bewahrt den Rechtscharakter und die innere Pluralität des gemeinschaftlichen Auftrags.
- source_word: חֶסֶד
  choice: beständige Liebe
  rationale: Erfasst die dauerhafte, loyale und tätige Güte des Begriffs, ohne ihn ausschließlich auf einen technischen Bundesbegriff festzulegen.
- source_word: רַחֲמִים
  choice: Erbarmen
  rationale: Gibt die mitfühlende, barmherzige Zuwendung des pluralischen Abstraktums in würdigem und verständlichem Deutsch wieder.
- source_word: עֲשׂוּ
  choice: erweist
  rationale: Bei Liebe und Erbarmen ist »erweisen« im Deutschen natürlicher als das wörtliche »tun« und hält den tätigen Sinn fest.
- source_word: אִישׁ אֶת־אָחִיו
  choice: einander[a]
  rationale: Die hebräische Wendung lautet wörtlich »jeder seinem Bruder«, fungiert hier aber reziprok. »Einander« gibt die gegenseitige Verpflichtung natürlich wieder; die Fußnote bewahrt die konkrete männliche Verwandtschaftsmetapher.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext enthält den Eigennamen. »Jahwe« macht ihn sichtbar und vermeidet, ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von מִשְׁפַּט אֱמֶת
  choice: gerechte Urteile
  alternative: Urteile der Wahrheit; wahrhaftiges Recht
  rationale: Die hebräische Fügung kann Wahrheit, Verlässlichkeit und Integrität der Urteile bezeichnen. »Gerechte Urteile« gibt die ethische und gerichtliche Stoßrichtung idiomatisch wieder, ohne eine besondere Rechtfertigungslehre einzutragen.
- issue: Reziproke männliche Formulierung אִישׁ אֶת־אָחִיו
  choice: einander mit erklärender Fußnote
  alternative: jeder seinem Bruder
  rationale: Die natürliche deutsche Hauptfassung vermittelt den gegenseitigen Gemeinschaftsbezug; die Fußnote erhält die wörtliche Verwandtschaftssprache und damit ihre mögliche bundesgemeinschaftliche Färbung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erkennbarer Prophetenformel. Direkte Rede vermeidet eine unnötig schwerfällige Wiedergabe von לֵאמֹר. Die konkreten Imperative bleiben knapp und eindringlich.
