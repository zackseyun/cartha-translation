source:
  edition: WLC
  text: וְ/לִבָּ֞/ם שָׂ֣מוּ שָׁמִ֗יר מִ֠/שְּׁמוֹעַ אֶת הַ/תּוֹרָ֤ה וְ/אֶת הַ/דְּבָרִים֙ אֲשֶׁ֨ר שָׁלַ֜ח יְהוָ֤ה צְבָאוֹת֙ בְּ/רוּח֔/וֹ בְּ/יַ֖ד הַ/נְּבִיאִ֣ים הָ/רִֽאשֹׁנִ֑ים וַֽ/יְהִי֙ קֶ֣צֶף גָּד֔וֹל מֵ/אֵ֖ת יְהוָ֥ה צְבָאֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/012.yaml
  text: They made their hearts like diamond-hard stone[a], so as not to hear the law and the words that Yahweh of Armies had sent by his Spirit through the former prophets[c][b]. So great wrath came from Yahweh of Armies.
translation:
  language: de
  text: Sie machten ihr Herz hart wie einen äußerst harten Stein[a], um nicht auf die Weisung[b] und die Worte zu hören, die Jahwe der Heerscharen[c] durch seinen Geist[d], vermittelt durch die früheren Propheten, gesandt hatte. So kam großer Zorn von Jahwe der Heerscharen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort שָׁמִיר bezeichnet eine äußerst harte Substanz; traditionell wird es auch mit „Diamant“, „Adamant“ oder „Feuerstein“ wiedergegeben. Die genaue Bestimmung ist unsicher.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „das Gesetz“.'
    reason: lexical_alternative
  - marker: c
    text: 'Traditionell: „der HERR der Heerscharen“; auch möglich: „Jahwe der Heere“.'
    reason: lexical_alternative
  - marker: d
    text: Das hebräische רוּחַ kann je nach Zusammenhang „Geist“, „Wind“ oder „Atem“ bedeuten; hier bezeichnet es Gottes Wirken bei der Übermittlung seiner Worte.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וְלִבָּם
  choice: ihr Herz
  rationale: Der hebräische Singular bezeichnet kollektiv die innere Haltung und den Willen der Angesprochenen; der deutsche Singular bewahrt das Bild natürlich.
- source_word: שָׂמוּ שָׁמִיר
  choice: machten … hart wie einen Diamantstein
  rationale: שׂוּם mit dem Prädikatsnomen beschreibt hier das Versetzen in einen Zustand. שָׁמִיר bezeichnet eine außerordentlich harte Substanz, deren genaue mineralogische Bestimmung unsicher ist.
- source_word: מִשְּׁמוֹעַ
  choice: um nicht … zu hören
  rationale: Die Präposition מִן mit dem Infinitiv drückt hier Abwehr beziehungsweise Verhinderung aus; die Verneinung muss im Deutschen ausdrücklich wiedergegeben werden.
- source_word: הַתּוֹרָה
  choice: die Weisung
  rationale: תּוֹרָה meint göttliche, verbindliche Unterweisung. „Weisung“ hält die Bedeutung weiter als das im Deutschen leicht auf ein Gesetzbuch verengte „Gesetz“.
- source_word: הַדְּבָרִים
  choice: die Worte
  rationale: Die direkte Wiedergabe bewahrt die Parallelität mit der Weisung und bezeichnet die prophetisch übermittelten Botschaften.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; „Heerscharen“ bewahrt die umfassende militärisch-kosmische Bedeutung von צְבָאוֹת und ist im Deutschen verständlicher als eine unkommentierte Umschrift.
- source_word: בְּרוּחוֹ
  choice: durch seinen Geist
  rationale: רוּחַ bezeichnet hier am ehesten Gottes wirksame Gegenwart als Mittel der prophetischen Offenbarung; „Geist“ lässt den Bezug auf göttliche personale Wirksamkeit erkennen.
- source_word: בְּיַד הַנְּבִיאִים הָרִאשֹׁנִים
  choice: durch die früheren Propheten
  rationale: Die Wendung „durch die Hand“ bezeichnet Vermittlung. „Frühere Propheten“ meint Propheten aus der vorausgehenden Zeit und wird nicht als kanonischer Fachbegriff behandelt.
- source_word: וַיְהִי קֶצֶף גָּדוֹל
  choice: So kam großer Zorn
  rationale: „So“ gibt die im Zusammenhang erkennbare Folge wieder, ohne die einfache hebräische Erzählverknüpfung mit einem stärkeren „deshalb“ zu überdeuten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Text nennt das Tetragramm unmittelbar. „Jahwe“ gibt den offenbarten Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug von רוּחוֹ
  choice: durch seinen Geist
  alternative: durch seinen geistlichen Antrieb; durch seinen Windhauch
  rationale: Im Kontext sendet Gott seine Worte mittels רוּחַ zu den Propheten. „Geist“ entspricht dieser göttlichen Wirksamkeit, während die Fußnote die grundsätzlich weitere Bedeutungsbreite des hebräischen Wortes offenhält.
- issue: Bedeutung von צְבָאוֹת
  choice: Heerscharen
  alternative: Heere; Mächte
  rationale: „Heerscharen“ bewahrt den traditionellen, umfassenden Sinn des Titels, ohne ihn auf ausschließlich menschliche Armeen festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der kollektive Singular „ihr Herz“ und das starke Verhärtungsbild bleiben erhalten. „Weisung“ vermeidet eine unnötige Verengung von תּוֹרָה, und „So“ wahrt den Folgezusammenhang, ohne ihn stärker als im Hebräischen zu markieren.
