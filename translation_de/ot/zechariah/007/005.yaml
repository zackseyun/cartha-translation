source:
  edition: WLC
  text: אֱמֹר֙ אֶל כָּל עַ֣ם הָ/אָ֔רֶץ וְ/אֶל הַ/כֹּהֲנִ֖ים לֵ/אמֹ֑ר כִּֽי צַמְתֶּ֨ם וְ/סָפ֜וֹד בַּ/חֲמִישִׁ֣י וּ/בַ/שְּׁבִיעִ֗י וְ/זֶה֙ שִׁבְעִ֣ים שָׁנָ֔ה הֲ/צ֥וֹם צַמְתֻּ֖/נִי אָֽנִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/005.yaml
  text: 'Speak to all the people of the land and to the priests[a], saying: When you fasted and mourned in the fifth month and in the seventh, for these seventy years, was it really for me that you fasted?'
translation:
  language: de
  text: 'Sprich zum ganzen Volk des Landes und zu den Priestern: »Als ihr im fünften und im siebten Monat gefastet und geklagt habt – und das nun schon siebzig Jahre lang –, habt ihr da wirklich für mich gefastet, für mich?[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Habt ihr etwa ein Fasten für mich gefastet – ich?« Das Hebräische verstärkt die Frage durch die Verbindung von Infinitiv und finitem Verb sowie durch das abschließende selbstständige »ich«.'
    reason: Die Fußnote macht die ungewöhnliche hebräische Nachdrucksform sichtbar und erklärt die Wiederholung im deutschen Haupttext.
lexical_decisions:
- source_word: עַם הָאָרֶץ
  choice: das ganze Volk des Landes
  rationale: Die Wendung bezeichnet hier umfassend die Bewohner des Landes, nicht lediglich eine bestimmte gesellschaftliche Schicht. Das ausdrückliche כָּל wird mit »ganze« wiedergegeben.
- source_word: הַכֹּהֲנִים
  choice: die Priester
  rationale: Entspricht der üblichen Bedeutung von כֹּהֵן und ist im Kontext eindeutig.
- source_word: צַמְתֶּם
  choice: ihr … gefastet habt
  rationale: Direkte Wiedergabe des Qal Perfekt 2. Person Plural von צום; die deutsche Satzstellung folgt dem eingeleiteten Zeitsatz.
- source_word: וְסָפוֹד
  choice: und geklagt habt
  rationale: ספד bezeichnet Trauerklage beziehungsweise rituelles Klagen. »geklagt« bewahrt diesen aktiven Aspekt besser als das allgemeinere »getrauert«.
- source_word: בַּחֲמִישִׁי וּבַשְּׁבִיעִי
  choice: im fünften und im siebten Monat
  rationale: »Monat« ist im Hebräischen sinngemäß ergänzt und wird im Deutschen einmal am Ende der koordinierten Fügung genannt.
- source_word: וְזֶה שִׁבְעִים שָׁנָה
  choice: und das nun schon siebzig Jahre lang
  rationale: Die Formulierung gibt die bis zur Gegenwart reichende Dauer sowie die hinweisende und nachdrückliche Kraft von וְזֶה idiomatisch wieder.
- source_word: הֲצוֹם צַמְתֻּנִי
  choice: habt ihr da wirklich für mich gefastet
  rationale: Infinitivus absolutus und finites Verb bilden eine nachdrückliche rhetorische Frage. »wirklich« vermittelt die Intensivierung, während »für mich« den Suffixbezug wiedergibt.
- source_word: אָנִי
  choice: für mich
  rationale: Das selbstständige Pronomen am Satzende verstärkt den Gottesbezug. Die Wiederholung »für mich … für mich« erhält diesen Nachdruck, ohne die Aussage inhaltlich aufzulösen.
- source_word: אֱמֹר ... לֵאמֹר
  choice: 'Sprich … :'
  rationale: Die im Deutschen schwerfällige wörtliche Doppelung »Sprich … und sage« wird durch die direkte Rede nach dem Doppelpunkt natürlich wiedergegeben.
theological_decisions:
- issue: Sinn der rhetorischen Frage zum Fasten
  choice: Die Frage stellt nachdrücklich infrage, ob das Fasten tatsächlich auf Gott ausgerichtet war.
  alternative: Die Aussage könnte als vollständige Verwerfung oder Ungültigerklärung der Fastenzeiten verstanden werden.
  rationale: Der hebräische Wortlaut bestreitet nicht, dass gefastet wurde, sondern fragt betont nach dem Adressaten beziehungsweise Beweggrund. Die Übersetzung bewahrt diese Spannung und fällt kein weitergehendes theologisches Urteil.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischer Direktheit. Die direkte Rede vermeidet eine unnatürliche Nachbildung der hebräischen Redeeinleitungsformel. Gedankenstriche markieren den eingeschobenen Zeitumfang; die abschließende Wiederholung erhält den scharfen rhetorischen Nachdruck.
