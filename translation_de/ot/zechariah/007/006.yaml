source:
  edition: WLC
  text: וְ/כִ֥י תֹאכְל֖וּ וְ/כִ֣י תִשְׁתּ֑וּ הֲ/ל֤וֹא אַתֶּם֙ הָ/אֹ֣כְלִ֔ים וְ/אַתֶּ֖ם הַ/שֹּׁתִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/006.yaml
  text: And when you eat and when you drink[a], is it not you who are eating, and you who are drinking?
translation:
  language: de
  text: Und wenn ihr esst und wenn ihr trinkt[a] – seid ihr es nicht selbst, die essen und trinken?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und falls ihr esst und falls ihr trinkt“. Die hebräische Konjunktion kann zeitlich („wenn“) oder konditional („falls“) verstanden werden; hier passt „wenn“ am besten zum Gedankengang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Und wenn
  rationale: כִּי bezeichnet hier am ehesten einen zeitlichen Umstand und führt parallel zum Fasten im vorherigen Vers die gewöhnliche Praxis des Essens ein. „Wenn“ bewahrt zugleich die im Hebräischen mögliche Offenheit zur konditionalen Lesart.
- source_word: תֹאכְלוּ
  choice: ihr esst
  rationale: Das Qal-Imperfekt 2. Person Plural beschreibt hier eine allgemeine bzw. wiederkehrende Handlung; im Deutschen ist dafür das Präsens natürlich.
- source_word: וְכִי תִשְׁתּוּ
  choice: und wenn ihr trinkt
  rationale: Die Wiederholung von וְכִי wird beibehalten, um den hebräischen Parallelismus hörbar zu machen; das Präsens gibt die allgemeine Handlung angemessen wieder.
- source_word: הֲלוֹא
  choice: seid ihr es nicht
  rationale: Die Form leitet eine rhetorische Frage ein, die Zustimmung erwartet. Diese deutsche Wendung bewahrt sowohl den Fragecharakter als auch die Hervorhebung der Angesprochenen.
- source_word: אַתֶּם ... וְאַתֶּם
  choice: ihr ... selbst
  rationale: Die selbstständigen Personalpronomen sind emphatisch. „ihr es ... selbst“ bringt den Selbstbezug idiomatisch zum Ausdruck, ohne ein zusätzliches theologisches Urteil in den Text einzutragen.
- source_word: הָאֹכְלִים וְהַשֹּׁתִים
  choice: die essen und trinken
  rationale: Die substantivierten Partizipien bezeichnen die Essenden und Trinkenden. Ein gemeinsamer deutscher Relativsatz ist natürlich und erhält die ausgewogene rhetorische Aussage, auch wenn die hebräische Wiederholung knapper zusammengezogen wird.
theological_decisions:
- issue: Rhetorische Aussage über den Selbstbezug des Essens und Trinkens
  choice: Die emphatische Aussage wird mit „ihr es ... selbst“ wiedergegeben.
  alternative: 'Neutraler: „Esst und trinkt ihr dann nicht?“'
  rationale: Die wiederholten selbstständigen Pronomen zeigen, dass nicht bloß gewöhnliches Essen und Trinken festgestellt wird, sondern dessen Bezug auf die Handelnden selbst. Die Übersetzung wahrt diesen Akzent, ohne Motive oder eine ausdrückliche Gegenüberstellung zu Gott hinzuzufügen.
- issue: Zeitliche oder konditionale Bedeutung von כִּי
  choice: 'Zeitlich: „wenn“'
  alternative: 'Konditional: „falls“'
  rationale: Der zeitliche Sinn passt am besten zum argumentativen Zusammenhang mit dem Fasten im vorherigen Vers. Da die hebräische Konjunktion beide Nuancen zulässt, wird die konditionale Möglichkeit in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich unterstützt den Übergang zur rhetorischen Frage. Die Formulierung „seid ihr es nicht selbst“ erhält die hebräische Hervorhebung in natürlichem Deutsch; der abschließende Relativsatz vermeidet eine schwerfällige wörtliche Doppelung.
