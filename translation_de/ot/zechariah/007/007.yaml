  text: הֲ/ל֣וֹא אֶת הַ/דְּבָרִ֗ים אֲשֶׁ֨ר קָרָ֤א יְהוָה֙ בְּ/יַד֙ הַ/נְּבִיאִ֣ים הָ/רִֽאשֹׁנִ֔ים בִּ/הְי֤וֹת יְרוּשָׁלִַ֨ם֙ יֹשֶׁ֣בֶת וּ/שְׁלֵוָ֔ה וְ/עָרֶ֖י/הָ סְבִיבֹתֶ֑י/הָ וְ/הַ/נֶּ֥גֶב וְ/הַ/שְּׁפֵלָ֖ה יֹשֵֽׁב־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/007.yaml
  text: Are these not the words that Yahweh proclaimed by the former prophets[a], when Jerusalem was inhabited and at ease, with her surrounding cities[c][b], and the Negev and the Shephelah were inhabited?
translation:
  language: de
  text: Sind das nicht die Worte, die Jahwe durch die früheren Propheten[a] verkündete, als Jerusalem bewohnt war und in Ruhe[b] lebte, mit den Städten ringsum, und als der Negev und die Schefela[c] bewohnt waren?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „durch die Hand der früheren Propheten“. Gemeint sind die Propheten aus früherer Zeit.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sicher und ruhig“. Das hebräische Wort kann ungestörte Ruhe, Sicherheit und Wohlergehen bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: Die Schefela ist die westliche Niederungs- und Vorgebirgsregion Judas.
    reason: cultural_note
lexical_decisions:
- source_word: הֲלֹא אֶת הַדְּבָרִים
  choice: Sind das nicht die Worte
  rationale: Die rhetorische Frage erwartet Zustimmung. Das Deutsche gibt die definite, im Zusammenhang vorausgesetzte Botschaft natürlich mit „das … die Worte“ wieder, ohne einen zusätzlichen Inhalt zu ergänzen.
- source_word: קָרָא
  choice: verkündete
  rationale: Im Zusammenhang prophetischer Rede bezeichnet das Verb ein öffentliches, autoritatives Ausrufen; „verkündete“ trifft dies in natürlichem Deutsch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּיַד הַנְּבִיאִים הָרִאשֹׁנִים
  choice: durch die früheren Propheten
  rationale: Die wörtliche Wendung „durch die Hand“ bezeichnet Vermittlung beziehungsweise Beauftragung. „Früheren“ meint zeitlich frühere Propheten, nicht zwingend die kanonische Gruppe der „Vorderen Propheten“.
- source_word: יְרוּשָׁלִַם יֹשֶׁבֶת וּשְׁלֵוָה
  choice: Jerusalem bewohnt war und ungestört lebte
  rationale: ישׁב bezeichnet bei einer Stadt ihren bewohnten Zustand; שׁלה verbindet Ruhe mit Sicherheit und ungestörtem Wohlergehen. Die personifizierende Rede von Jerusalem bleibt erhalten.
- source_word: וְעָרֶיהָ סְבִיבֹתֶיהָ
  choice: mit den Städten rings um die Stadt
  rationale: Die Formulierung macht die Zugehörigkeit der umliegenden Städte zu Jerusalem deutlich und vermeidet im Deutschen eine missverständliche Folge weiblicher Pronomen.
- source_word: וְהַנֶּגֶב
  choice: der Negev
  rationale: Hier ist die geografische Region im Süden Judas gemeint, nicht lediglich die Himmelsrichtung.
- source_word: וְהַשְּׁפֵלָה
  choice: die Schefela
  rationale: Der etablierte geografische Name bezeichnet das westliche Hügelland beziehungsweise die Niederungszone Judas genauer als das allgemeine Wort „Niederung“.
- source_word: יֹשֵׁב
  choice: bewohnt waren
  rationale: Das hebräische singularische Partizip fasst die beiden Regionen kollektiv auf; im Deutschen verlangt das zusammengesetzte Subjekt den Plural.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. Die Wiedergabe als Eigenname bewahrt diese Unterscheidung gegenüber dem Titel „Herr“.
- issue: Vermittlung der göttlichen Rede durch Propheten
  choice: durch die früheren Propheten
  alternative: durch die Hand der früheren Propheten
  rationale: Die idiomatische Vermittlungsformel wird verständlich wiedergegeben, ohne den Ursprung der Botschaft bei Jahwe oder die prophetische Mittlerrolle abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage und die geografischen Eigennamen bleiben erhalten. „Frühere Propheten“ vermeidet eine unbeabsichtigte Festlegung auf eine spätere kanonische Kategorie; die Fußnoten erläutern Hebraismus, Bedeutungsbreite und Geografie.
