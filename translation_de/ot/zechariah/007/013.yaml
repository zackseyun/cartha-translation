id: ZEC.7.13
reference: Zechariah 7:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְהִ֥י כַ/אֲשֶׁר קָרָ֖א וְ/לֹ֣א שָׁמֵ֑עוּ כֵּ֤ן יִקְרְאוּ֙ וְ/לֹ֣א אֶשְׁמָ֔ע אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/013.yaml
  text: And just as he called and they would not listen[a], so they will call and I will not listen, says Yahweh of Armies.
translation:
  language: de
  text: Und wie er rief und sie nicht hörten, so werden sie rufen, und ich werde nicht hören, spricht Jahwe der Heere.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: „der HERR der Heerscharen“ oder „der HERR Zebaoth“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַאֲשֶׁר
  choice: Und wie
  rationale: Die Wendung leitet zusammen mit כֵּן einen Vergleich ein. „Und wie … so …“ gibt diese Korrespondenz knapp und natürlich wieder, ohne die im Deutschen schwerfällige wörtliche Einleitung „Und es geschah, als“.
- source_word: קָרָא / יִקְרְאוּ
  choice: er rief / sie werden rufen
  rationale: „Rufen“ deckt sowohl Gottes vorausgehenden Ruf als auch den späteren Ruf des Volkes ab und bewahrt die beabsichtigte lexikalische Spiegelung.
- source_word: וְלֹא שָׁמֵעוּ / וְלֹא אֶשְׁמָע
  choice: sie nicht hörten / ich werde nicht hören
  rationale: Die Wiederholung von שׁמע wird im Deutschen mit „hören“ bewahrt. Das Verb kann hier auch „zuhören“ oder „gehorchen“ einschließen; die knappe Wiedergabe lässt diese Bedeutungsbreite und die reziproke Gerichtslogik bestehen.
- source_word: כֵּן
  choice: so
  rationale: „So“ bildet idiomatisch den zweiten Teil der Vergleichskonstruktion „wie … so …“ und markiert die entsprechende Folge.
- source_word: אָמַר
  choice: spricht
  rationale: „Spricht“ ist in deutscher prophetischer Rede eine gegenwartsbezogene, würdige und geläufige Wiedergabe der Botenformel.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als „Jahwe“ wiedergegeben und nicht durch den Titel „HERR“ ersetzt.
- source_word: צְבָאוֹת
  choice: der Heere
  rationale: „Heere“ gibt die Grundbedeutung des Plurals verständlicher wieder als das heute weniger geläufige „Heerscharen“ und bewahrt den Titelcharakter.
theological_decisions:
- issue: Wiedergabe des Gottestitels יְהוָה צְבָאוֹת
  choice: Jahwe der Heere
  alternative: der HERR der Heerscharen; der HERR Zebaoth
  rationale: Die Übersetzung erhält den Gottesnamen als Namen und gibt צְבָאוֹת semantisch wieder. Die traditionellen deutschen Formen werden als Alternative in der Fußnote genannt, ohne sie in den Haupttext einzusetzen.
- issue: Bedeutungsumfang von שׁמע
  choice: hören
  alternative: zuhören; gehorchen; auf jemanden hören
  rationale: Das zweimal gebrauchte Verb erzeugt eine bewusste Entsprechung zwischen der Weigerung des Volkes und Gottes Antwort. „Hören“ erhält diese Form und lässt offen, ob vor allem aufmerksames Hören, Beachten oder Gehorchen gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die symmetrische Satzform und die Wiederholung von „rufen“ und „hören“ werden bewusst beibehalten. Das Komma vor der abschließenden Botenformel unterstützt die Lesbarkeit; die Fußnotenmarke steht unmittelbar nach dem betroffenen Gottestitel.
