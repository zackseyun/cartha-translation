base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/011.yaml
  text: But they refused to pay attention[a], turned a stubborn shoulder[b], and made their ears heavy so as not to hear.
translation:
  language: de
  text: Doch sie weigerten sich, aufmerksam zuzuhören, kehrten trotzig die Schulter zu[a] und machten ihre Ohren schwer, um nicht zu hören.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „gaben eine widerspenstige/rebellische Schulter“; ein Bild für hartnäckigen, rebellischen Widerstand.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „machten ihre Ohren unempfänglich“ beziehungsweise „verschlossen ihre Ohren“. Im Hebräischen heißt es wörtlich: „machten ihre Ohren schwer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֲנוּ לְהַקְשִׁיב
  choice: sie weigerten sich, aufmerksam zuzuhören
  rationale: מָאֵן bezeichnet eine bewusste Weigerung; הִקְשִׁיב meint aufmerksames Hinhören beziehungsweise Beachtung. Die Formulierung bewahrt sowohl den Willensaspekt als auch die über das bloße Hören hinausgehende Aufmerksamkeit.
- source_word: וַיִּתְּנוּ כָתֵף סֹרָרֶת
  choice: zeigten eine widerspenstige Schulter
  rationale: Die konkrete Körpermetapher für hartnäckigen Widerstand bleibt erhalten. „Widerspenstig“ gibt die rebellische, beharrlich ablehnende Bedeutung von סֹרָרֶת wieder, ohne sie auf bloße Sturheit zu verengen.
- source_word: וְאָזְנֵיהֶם הִכְבִּידוּ
  choice: machten ihre Ohren schwer
  rationale: 'Die ungewöhnliche hebräische Metapher wird bewusst bewahrt: Sie machten sich selbst für das Gehörte unempfänglich. Eine Glättung zu „verschlossen ihre Ohren“ wäre verständlicher, würde aber das Quellbild ersetzen.'
- source_word: מִשְּׁמוֹעַ
  choice: um nicht zu hören
  rationale: Die Infinitivkonstruktion bezeichnet hier Verhinderung beziehungsweise Absicht oder Ergebnis. Die deutsche Fassung macht die willentliche Hörverweigerung deutlich, ohne zwischen Absicht und Folge unnötig scharf zu entscheiden.
theological_decisions:
- issue: Bildhafte Darstellung bewusster Auflehnung
  choice: Die Bilder von der widerspenstigen Schulter und den schwer gemachten Ohren bleiben im Haupttext erhalten.
  alternative: Sie widersetzten sich hartnäckig und wollten nicht hören.
  rationale: Die körperlichen Bilder stellen die Ablehnung als willentliche, verfestigte Reaktion dar. Eine rein abstrakte Wiedergabe würde die rhetorische und moralische Kraft des hebräischen Textes abschwächen.
- issue: Absicht oder Ergebnis in מִשְּׁמוֹעַ
  choice: „um nicht zu hören“
  alternative: „sodass sie nicht hörten“ oder „vom Hören“
  rationale: Die Formulierung gibt den präventiven Sinn natürlich wieder und lässt im Zusammenhang sowohl Zielrichtung als auch bewirktes Ergebnis anklingen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzführung ist klar und gut lesbar; die bewusst ungewohnten Körpermetaphern des Hebräischen bleiben erhalten und werden durch Fußnoten erläutert.
