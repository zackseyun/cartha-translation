base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/010.yaml
  text: Do not oppress the widow[a], the fatherless, the sojourner, or the poor[c][b], and do not devise evil in your hearts against one another.
translation:
  language: de
  text: Unterdrückt keine Witwen, Waisen[b], Fremden[c] oder Armen. Sinnt in euren Herzen nichts Böses gegeneinander[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Das Böse eines Menschen gegen seinen Bruder sollt ihr nicht in euren Herzen planen.“'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann insbesondere ein vaterloses Kind bezeichnen.
    reason: lexical_alternative
  - marker: c
    text: Gemeint sind ansässige Fremde, also nichtisraelitische Bewohner des Landes mit besonderem Schutzbedarf.
    reason: cultural_note
lexical_decisions:
- source_word: אַלְמָנָה
  choice: Witwen
  rationale: Die geläufige und genaue deutsche Entsprechung; der generische Singular des Hebräischen wird in der Aufzählung natürlich als Gruppenbezeichnung wiedergegeben.
- source_word: יָתוֹם
  choice: Waisen
  rationale: „Waise“ ist im heutigen Deutsch die natürliche Bezeichnung für ein elternloses oder insbesondere vaterloses Kind; die mögliche engere Bedeutung wird in einer Fußnote bewahrt.
- source_word: גֵּר
  choice: Fremde
  rationale: Bezeichnet hier nicht bloß Reisende, sondern dauerhaft unter Israel lebende Nichtisraeliten mit besonderem Schutzbedarf; dies wird durch eine kulturelle Fußnote erläutert.
- source_word: עָנִי
  choice: Arme
  rationale: Im Zusammenhang dieser Liste schutzbedürftiger Menschen steht die soziale und wirtschaftliche Bedürftigkeit im Vordergrund.
- source_word: תַּעֲשֹׁקוּ
  choice: Unterdrückt
  rationale: Deckt rechtswidrige Bedrückung, Ausbeutung und Übervorteilung ab und erhält die Breite des hebräischen Verbs.
- source_word: רָעַת
  choice: nichts Böses
  rationale: Bewahrt die moralische Tragweite von רָעָה und fügt sich idiomatisch in die deutsche negative Aufforderung ein.
- source_word: תַּחְשְׁבוּ
  choice: Plant
  rationale: In Verbindung mit Bösem und dem Herzen bezeichnet das Verb absichtsvolles Ersinnen, nicht nur neutrales Denken.
- source_word: אִישׁ אָחִיו
  choice: gegeneinander
  rationale: Die wörtlich maskuline distributive Wendung hat hier wechselseitigen gemeinschaftlichen Sinn; „gegeneinander“ gibt diesen im Deutschen natürlich wieder, während die wörtlichere Form in der Fußnote steht.
- source_word: בִּלְבַבְכֶם
  choice: in euren Herzen
  rationale: Bewahrt den Plural der Angeredeten und den hebräischen Sitz innerer Absicht und Willensbildung.
theological_decisions:
- issue: Maskuline distributive Wendung אִישׁ אָחִיו
  choice: gegeneinander
  alternative: einer gegen seinen Bruder
  rationale: Die Formulierung beschreibt gegenseitiges Verhalten innerhalb der Gemeinschaft und beschränkt das Gebot nicht erkennbar auf Männer. Die geschlechtlich markierte wörtliche Form bleibt als Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die paarige Konstruktion „weder … noch“ macht den Geltungsbereich der Verneinung in der viergliedrigen Liste klar. Die Fußnotenmarker stehen jeweils unmittelbar bei der betreffenden Aussage.
