  source_fidelity: 'Die Aussageabfolge und die Handlungsträger sind korrekt wiedergegeben: Gott zerstreut die Angeredeten unter unbekannte Völker; das Land verödet nach ihrem Weggang und ohne Verkehr; sie selbst machen das begehrenswerte Land zur Einöde. Die sturmartige Bildlichkeit von וְאֵסָעֲרֵם sollte jedoch idiomatischer ausgedrückt werden.'
  naturalness: Der Entwurf ist insgesamt gut verständlich und registergerecht. Die Wortstellung „trieb sie im Sturmwind auseinander unter all die Völker“ wirkt im modernen Deutsch jedoch sperrig. Eine Umstellung mit „zerstreute“ und „mit einem Sturmwind“ ist klarer und bewahrt das Bild.
  terminology: „Einöde“ gibt לְשַׁמָּה treffend wieder. Für אֶרֶץ חֶמְדָּה ist „das liebliche Land“ möglich, aber leicht literarisch und weniger präzise als „das begehrenswerte Land“, das die Bedeutung von חֶמְדָּה unmittelbar aufnimmt.
