base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/014.yaml
  text: And I scattered them with a storm wind among all the nations that they had not known[a], and the land was left desolate behind them, with no one passing through or returning[b]; thus they made the pleasant land a desolation.
translation:
  language: de
  text: Und ich zerstreute sie mit einem Sturmwind unter alle Völker, die sie nicht gekannt hatten.[a] Das Land blieb hinter ihnen verwüstet zurück, ohne dass jemand hindurchzog oder zurückkehrte. So machten sie das begehrenswerte Land[b] zur Einöde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Und ich wirbelte sie unter alle Völker hinweg.« Das hebräische Verb enthält ein Sturmbild und meint mehr als ein gewöhnliches Zerstreuen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »das liebliche Land« oder »das Land der Wonne«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵסָעֲרֵם
  choice: Und ich trieb sie im Sturmwind auseinander
  rationale: Das Piel von סער bezeichnet hier kein gewöhnliches Zerstreuen, sondern ein sturmgleiches Hinwegwirbeln. Die Formulierung bewahrt sowohl die aktive göttliche Urheberschaft als auch das anschauliche Sturmbild.
- source_word: עַל כָּל הַגּוֹיִם
  choice: unter all die Völker
  rationale: Bei einem Verb des Zerstreuens bezeichnet עַל hier den Bereich, in den die Menschen verteilt werden; »unter« ist dafür im Deutschen die natürliche Entsprechung.
- source_word: אֲשֶׁר לֹא יְדָעוּם
  choice: die sie nicht gekannt hatten
  rationale: Der Relativsatz bezieht sich auf die Völker und hebt hervor, dass diese den Fortgetriebenen zuvor unbekannt gewesen waren.
- source_word: וְהָאָרֶץ נָשַׁמָּה
  choice: Das Land blieb ... verwüstet zurück
  rationale: נשׁם beschreibt den eingetretenen Zustand der Verwüstung. »Blieb verwüstet zurück« gibt zugleich den Ergebnischarakter und den Zusammenhang mit der Vertreibung wieder.
- source_word: אַחֲרֵיהֶם
  choice: hinter ihnen
  rationale: Die Wendung bezeichnet das Land, das nach ihrem Weggang in ihrem Rücken beziehungsweise in ihrem Gefolge verödet dalag.
- source_word: מֵעֹבֵר וּמִשָּׁב
  choice: sodass niemand hindurchzog oder zurückkehrte
  rationale: Die beiden substantivisch gebrauchten Formen bezeichnen Verkehr in beide Richtungen. Die Ergänzung »niemand« macht die im Hebräischen knappe Aussage im Deutschen verständlich.
- source_word: וַיָּשִׂימוּ
  choice: So machten sie
  rationale: 'Die Fortsetzungsform führt zur Folge des zuvor geschilderten Geschehens. Zugleich bleibt der Wechsel der Handlungsträger erhalten: Gott zerstreut, die Menschen machen das Land durch ihr Verhalten zur Einöde.'
- source_word: אֶרֶץ חֶמְדָּה
  choice: das liebliche Land
  rationale: חֶמְדָּה bezeichnet etwas Begehrenswertes, Kostbares oder Erfreuliches. »Lieblich« wahrt die positive Wertung und bildet einen klaren Gegensatz zu »Einöde«.
- source_word: לְשַׁמָּה
  choice: zur Einöde
  rationale: Das Nomen bezeichnet den Zustand völliger Verödung beziehungsweise Verwüstung. Die nominale deutsche Wendung erhält den pointierten Gegensatz zum lieblichen Land.
theological_decisions:
- issue: Urheberschaft bei Gericht und Verwüstung
  choice: Gott wird ausdrücklich als derjenige wiedergegeben, der die Menschen im Sturmwind zerstreut; zugleich werden die Menschen als diejenigen bezeichnet, die das Land zur Einöde machten.
  alternative: Eine unpersönliche Formulierung, die Gottes unmittelbare Urheberschaft an der Zerstreuung abschwächt, oder eine Formulierung, die allein Gott die abschließende Verwüstung zuschreibt.
  rationale: Die erste Person Singular in וְאֵסָעֲרֵם bezeichnet Gott ausdrücklich als Handelnden, während das abschließende וַיָּשִׂימוּ im Plural die Verantwortung der Menschen festhält. Beide Aussageebenen werden bewahrt, ohne ihre Spannung aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das kräftige Sturmbild wird ohne altertümliche oder konfessionell geprägte Ausdrucksweise bewahrt. Die Satzfolge bleibt knapp und steigert sich von der Zerstreuung über die menschenleere Verwüstung bis zum abschließenden Gegensatz zwischen lieblichem Land und Einöde.
