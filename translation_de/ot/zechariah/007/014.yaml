    rationale: „Lieblich“ kann zwar positiv bewertet sein, bezeichnet aber eher anmutige Schönheit. „begehrenswert“ gibt die semantische Komponente des Erwünschten/Kostbaren genauer wieder und bleibt modernes Standarddeutsch.
