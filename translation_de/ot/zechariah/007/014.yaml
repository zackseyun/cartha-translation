revisions:
- from: Und ich trieb sie im Sturmwind auseinander unter all die Völker, die sie nicht gekannt hatten.[a] Das Land blieb hinter ihnen verwüstet zurück, sodass niemand hindurchzog oder zurückkehrte. So machten sie das liebliche Land[b] zur Einöde.
  to: Und ich zerstreute sie mit einem Sturmwind unter alle Völker, die sie nicht gekannt hatten.[a] Das Land blieb hinter ihnen verwüstet zurück, ohne dass jemand hindurchzog oder zurückkehrte. So machten sie das begehrenswerte Land[b] zur Einöde.
  rationale: Die Revision glättet die deutsche Satzfügung, ohne die Bildlichkeit oder die Verantwortungsstruktur des Hebräischen zu verändern. „Mit einem Sturmwind“ macht die im Verb enthaltene Sturmassoziation explizit; „ohne dass“ gibt die privative Aussage von מֵעֹבֵר וּמִשָּׁב näher wieder als ein kausales „sodass“. Die Fußnotenanker stehen nun jeweils bei dem erläuterten Ausdruck.
