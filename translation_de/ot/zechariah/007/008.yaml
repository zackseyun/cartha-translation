  text: וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה אֶל זְכַרְיָ֖ה לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/007/008.yaml
  text: And the word of Yahweh came to Zechariah[a], saying,
translation:
  language: de
  text: 'Und das Wort Jahwes erging an Sacharja[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: erging
  rationale: In der prophetischen Botenformel ויהי דבר־יהוה אל ist „erging“ eine natürliche, gehobene deutsche Entsprechung; sie vermeidet das schwerfällige „es geschah“.
- source_word: דְּבַר
  choice: das Wort
  rationale: דבר bezeichnet in der festen prophetischen Wendung das offenbarte Wort beziehungsweise die Botschaft Gottes. „Das Wort“ bewahrt die wiederkehrende Formel.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben; die Fußnote nennt die traditionelle Wiedergabe.
- source_word: אֶל
  choice: an
  rationale: Bei „das Wort erging“ bezeichnet „an“ im heutigen Deutsch idiomatisch den Empfänger der Offenbarung.
- source_word: זְכַרְיָה
  choice: Sacharja
  rationale: Der Personenname wird in seiner etablierten deutschen biblischen Form wiedergegeben.
- source_word: לֵאמֹר
  choice: ':'
  rationale: לֵאמֹר leitet die folgende direkte Rede ein. Ein Doppelpunkt erfüllt diese Funktion im natürlichen modernen Deutsch, ohne das schwerfällige „indem er sprach“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ bewahrt ihn als Namen, während die traditionelle Ersatzlesung in der Fußnote kenntlich gemacht wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feste prophetische Formel wird mit „das Wort Jahwes erging an“ wiedergegeben; der Doppelpunkt führt knapp und natürlich in die Rede des folgenden Verses über.
