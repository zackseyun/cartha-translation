id: ZEC.9.10
reference: Zechariah 9:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הִכְרַתִּי רֶ֣כֶב מֵ/אֶפְרַ֗יִם וְ/סוּס֙ מִ/יר֣וּשָׁלִַ֔ם וְ/נִכְרְתָה֙ קֶ֣שֶׁת מִלְחָמָ֔ה וְ/דִבֶּ֥ר שָׁל֖וֹם לַ/גּוֹיִ֑ם וּ/מָשְׁל/וֹ֙ מִ/יָּ֣ם עַד יָ֔ם וּ/מִ/נָּהָ֖ר עַד אַפְסֵי אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/010.yaml
  text: And I will cut off the chariot from Ephraim and the horse from Jerusalem[a], and the battle bow will be cut off; and he will speak peace to the nations, and his dominion will be from sea to sea[b], and from the River to the ends of the earth.
translation:
  language: de
  text: Ich werde die Streitwagen aus Ephraim und die Pferde aus Jerusalem beseitigen, und der Kriegsbogen wird beseitigt werden. Er wird den Völkern Frieden verkünden, und seine Herrschaft wird von Meer zu Meer reichen und vom Strom[a] bis an die Enden der Erde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „dem Strom“ ist wahrscheinlich der Euphrat gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִכְרַתִּי
  choice: Ich werde … beseitigen
  rationale: Das Hifil von כרת bezeichnet hier das Entfernen oder Ausschalten der militärischen Macht. „Beseitigen“ ist im Deutschen natürlich und lässt die konkrete Art der Vernichtung offen.
- source_word: רֶכֶב
  choice: die Streitwagen
  rationale: Der hebräische Singular hat kollektive Bedeutung. Der deutsche Plural gibt die Streitwagenmacht klar und idiomatisch wieder.
- source_word: מֵאֶפְרַיִם
  choice: aus Ephraim
  rationale: Die Präposition bezeichnet den Bereich, aus dem die Streitwagen entfernt werden; Ephraim steht für das Nordreich beziehungsweise dessen Gebiet.
- source_word: וְסוּס מִירוּשָׁלִַם
  choice: und die Pferde aus Jerusalem
  rationale: Auch סוּס ist hier kollektiv gebraucht. Der Plural ist im modernen Deutsch natürlicher und bewahrt die Parallele zwischen den militärischen Kräften Ephraims und Jerusalems.
- source_word: וְנִכְרְתָה
  choice: wird beseitigt werden
  rationale: Die Wiederholung von „beseitigen“ bildet die Wiederaufnahme derselben hebräischen Wurzel כרת ab; das Passiv bewahrt die Form des Ausgangstextes.
- source_word: קֶשֶׁת מִלְחָמָה
  choice: der Kriegsbogen
  rationale: Die kompakte Zusammensetzung gibt den zum Krieg bestimmten Bogen präzise und natürlich wieder.
- source_word: וְדִבֶּר
  choice: Er wird … verkünden
  rationale: Das Piel von דבר kann ein wirksames Aussprechen oder Verkünden bezeichnen. „Verkünden“ passt zum königlichen Handeln gegenüber den Völkern, ohne zusätzliche Inhalte einzutragen.
- source_word: שָׁלוֹם
  choice: Frieden
  rationale: „Frieden“ ist die sachgemäße Wiedergabe; die weiteren Bedeutungsnuancen von Wohlergehen und Ganzheit werden nicht paraphrastisch erweitert.
- source_word: לַגּוֹיִם
  choice: den Völkern
  rationale: גּוֹיִם bezeichnet hier die Völker außerhalb und innerhalb des universalen Horizonts der Aussage, nicht einen späteren technischen Begriff. „Völker“ ist im Deutschen idiomatisch.
- source_word: וּמָשְׁלוֹ
  choice: und seine Herrschaft
  rationale: Die Form ist ein Substantiv mit Possessivsuffix, nicht ein finites Verb. „Seine Herrschaft“ bewahrt die nominale königliche Aussage.
- source_word: מִיָּם עַד יָם
  choice: von Meer zu Meer
  rationale: Die feste räumliche Wendung wird unmittelbar und idiomatisch wiedergegeben.
- source_word: וּמִנָּהָר
  choice: und vom Strom
  rationale: Der bestimmte geografische Ausdruck meint wahrscheinlich den Euphrat. „Der Strom“ bewahrt die knappe biblische Bezeichnung; die wahrscheinliche Identifikation steht in der Fußnote.
- source_word: עַד אַפְסֵי אָרֶץ
  choice: bis an die Enden der Erde
  rationale: Die Wendung beschreibt die äußersten Grenzen der Erde und erhält die bewusst weit gespannte Reichweite der Herrschaft.
theological_decisions:
- issue: Bezug der dritten Person Singular in „Er wird …“ und „seine Herrschaft“
  choice: Die Pronomen beziehen sich auf den in Sacharja 9,9 genannten kommenden König.
  alternative: Eine unpersönliche Wiedergabe wie „Frieden wird verkündet werden“ oder „die Herrschaft wird reichen“.
  rationale: Der Wechsel von Gottes Rede in der ersten Person zu Aussagen in der dritten Person weist im unmittelbaren Zusammenhang natürlich auf den zuvor genannten König. Die Übersetzung bewahrt diesen Bezug, ohne spätere christologische Einzelbestimmungen in den Vers einzutragen.
- issue: Reichweite der Herrschaft
  choice: Die universal klingenden geografischen Formeln bleiben unverkürzt erhalten.
  alternative: Die Aussage ausdrücklich auf eine nur regionale, hyperbolisch beschriebene Herrschaft zu begrenzen.
  rationale: „Von Meer zu Meer“ und „bis an die Enden der Erde“ entfalten bewusst eine umfassende Perspektive. Wie diese Herrschaft erfüllt wird, bleibt der Auslegung überlassen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kollektiv gebrauchte militärische Singularformen werden idiomatisch im Plural wiedergegeben. Die Wiederholung der Wurzel כרת bleibt durch „beseitigen/beseitigt“ sichtbar; das leicht formelle „Kriegsbogen“ und die geografische Formel bewahren den prophetischen Ton.
