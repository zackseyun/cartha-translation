source:
  edition: WLC
  text: וְ/גַם חֲמָ֖ת תִּגְבָּל בָּ֑/הּ צֹ֣ר וְ/צִיד֔וֹן כִּ֥י חָֽכְמָ֖ה מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/002.yaml
  text: and also Hamath[a], which borders on it; Tyre and Sidon, because they are very wise.
translation:
  language: de
  text: und auch Hamat[a], das daran grenzt, Tyrus und Sidon, denn sie sind sehr weise.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Auch Hamat, das daran grenzt, Tyrus und Sidon; denn sie ist sehr weise.« Das Hebräische wechselt in dieser gedrängten Satzfügung zwischen der Einzahl und mehreren miteinander verbundenen Städtenamen.'
    reason: Bewahrt die Mehrdeutigkeit, die durch die feminine Singularform חָכְמָה bei den koordinierten Städtenamen entsteht.
lexical_decisions:
- source_word: וְגַם
  choice: und auch
  rationale: Bewahrt sowohl die anknüpfende Konjunktion als auch die einschließende, verstärkende Bedeutung von גַּם.
- source_word: חֲמָת
  choice: Hamat
  rationale: Der Ortsname wird in seiner im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: תִּגְבָּל בָּהּ
  choice: das daran grenzt
  rationale: גבל bezeichnet das Angrenzen an ein Gebiet. »Daran« gibt den femininen pronominalen Rückverweis wieder, ohne im Deutschen wegen des grammatischen Geschlechts eines Ortsnamens einen eindeutigen Bezug vorzutäuschen.
- source_word: צֹר וְצִידוֹן
  choice: Tyrus und Sidon
  rationale: Verwendet die etablierten deutschen Namensformen und erhält die koordinierte Verbindung.
- source_word: כִּי
  choice: denn
  rationale: Gibt die begründende oder erläuternde Funktion der Partikel in der gedrängten Satzfügung natürlich wieder.
- source_word: חָכְמָה מְאֹד
  choice: sie sind sehr weise
  rationale: Das feminine Singularverb steht nach den beiden Städtenamen Tyrus und Sidon. Der deutsche Plural macht den naheliegenden gemeinsamen Bezug verständlich; die formale Singularform und die daraus entstehende Mehrdeutigkeit werden in der Fußnote dokumentiert.
theological_decisions:
- issue: Syntaktische Funktion der Aussage über Tyrus und Sidon
  choice: Die Begründung mit »denn« bleibt unmittelbar an die Nennung der Städte angeschlossen.
  alternative: Die Weisheit der Städte als bloßen parenthetischen Zusatz oder als ausdrücklich genannten Grund ihrer Einbeziehung ausformulieren.
  rationale: כִּי ist kausal oder erläuternd, doch der knappe hebräische Satz legt die genaue logische Beziehung nicht vollständig offen. Die Übersetzung wahrt diese Spannung, ohne zusätzliche Deutung einzubauen.
- issue: Numerus und Genus von חָכְמָה nach Tyrus und Sidon
  choice: 'Plural: »sie sind sehr weise«'
  alternative: 'Singular: »sie ist sehr weise«'
  rationale: Die Verbform ist formal 3. Person feminin Singular und kann sich an einen einzelnen oder kollektiv gedachten Städtenamen anschließen. Im unmittelbaren Satz stehen jedoch Tyrus und Sidon gemeinsam; der deutsche Plural ist daher am verständlichsten, während die Fußnote die echte grammatische Spannung bewahrt.
translation_notes:
  register: Moderne, würdige Standardsprache. Die elliptische Reihung wird als Fortsetzung des vorhergehenden Verses beibehalten; »daran grenzt« klingt natürlich und vermeidet einen künstlich eindeutigen pronominalen Bezug.
