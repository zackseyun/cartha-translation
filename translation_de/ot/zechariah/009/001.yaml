id: ZEC.9.1
reference: Zechariah 9:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: מַשָּׂ֤א דְבַר יְהוָה֙ בְּ/אֶ֣רֶץ חַדְרָ֔ךְ וְ/דַמֶּ֖שֶׂק מְנֻחָת֑/וֹ כִּ֤י לַֽ/יהוָה֙ עֵ֣ין אָדָ֔ם וְ/כֹ֖ל שִׁבְטֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/001.yaml
  text: 'An oracle: the word of Yahweh is against the land of Hadrach[a], and Damascus is its resting place[d][c][b]; for the eye of man and of all the tribes of Israel is toward Yahweh.'
translation:
  language: de
  text: 'Ein Ausspruch: Das Wort Jahwes ergeht gegen das Land Hadrach[a], und Damaskus ist sein Ruheort[b]. Denn das Auge des Menschen[c] und aller Stämme Israels ist auf Jahwe gerichtet.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über das Land Hadrach“ beziehungsweise wörtlicher: „im Land Hadrach“. In prophetischen Überschriften kann die hebräische Präposition das Ziel eines Ausspruchs bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: „Sein“ kann sich auf das Wort beziehungsweise den Ausspruch oder auf Jahwe beziehen; das hebräische Suffix ist nicht eindeutig.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „der Menschheit“. Das hebräische Wort steht im Singular, kann hier aber die Menschen insgesamt bezeichnen.'
    reason: lexical_alternative
  - marker: d
    text: 'Manche verstehen die gedrängte hebräische Formulierung so: „Denn Jahwes Auge ruht auf den Menschen und auf allen Stämmen Israels.“'
    reason: alternative_reading
lexical_decisions:
- source_word: מַשָּׂא
  choice: Ausspruch
  rationale: In prophetischen Überschriften bezeichnet das Wort eine gewichtige prophetische Verkündigung. „Ausspruch“ ist im heutigen Deutsch verständlicher als das traditionelle „Lastspruch“, ohne den formelhaften Charakter einzuebnen.
- source_word: דְבַר יְהוָה
  choice: das Wort Jahwes
  rationale: Die feste prophetische Formel wird mit dem offen wiedergegebenen Gottesnamen bewahrt.
- source_word: בְּאֶרֶץ חַדְרָךְ
  choice: ergeht gegen das Land Hadrach
  rationale: Die Präposition ב bedeutet wörtlich meist „in“, kann in einer prophetischen Gerichtsüberschrift aber das Ziel des Ausspruchs bezeichnen. „ergeht gegen“ gibt diese kontextuelle Funktion in natürlichem Deutsch wieder; die wörtlichere Möglichkeit bleibt in der Fußnote erhalten.
- source_word: מְנֻחָתוֹ
  choice: ist sein Ruheort
  rationale: „Ruheort“ bildet das Substantiv eng ab. Das deutsche Possessivpronomen lässt wie das hebräische Suffix offen, ob auf das Wort beziehungsweise den Ausspruch oder auf Jahwe zurückverwiesen wird.
- source_word: לַיהוָה עֵין אָדָם
  choice: das Auge des Menschen ist auf Jahwe gerichtet
  rationale: Diese Deutung versteht לַיהוָה relational beziehungsweise direktional und עֵין als Satzgegenstand. Die gedrängte hebräische Formulierung und ihre andere mögliche syntaktische Zuordnung werden in einer Fußnote kenntlich gemacht.
- source_word: אָדָם
  choice: des Menschen
  rationale: Der hebräische Singular wird formal bewahrt und zugleich in seinem allgemeinen, die Menschheit umfassenden Sinn verstanden.
- source_word: וְכֹל שִׁבְטֵי יִשְׂרָאֵל
  choice: und aller Stämme Israels
  rationale: Die Genitivfügung ordnet sowohl den Menschen als auch alle Stämme Israels dem gemeinsamen Bild des Auges zu.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, damit der im Hebräischen ausdrücklich gesetzte Bundesname sichtbar bleibt.
- issue: Syntaktische Deutung von לַיהוָה עֵין אָדָם
  choice: Das Auge des Menschen und Israels ist auf Jahwe gerichtet
  alternative: Jahwes Auge ist auf die Menschen und Israel gerichtet
  rationale: Die Hauptfassung folgt einer naheliegenden relationalen Deutung von לַיהוָה, entscheidet die ungewöhnlich knappe Konstruktion aber nicht stillschweigend; die alternative Deutung wird ausdrücklich dokumentiert.
- issue: Allgemeiner Sinn von אָדָם
  choice: der Mensch
  alternative: die Menschheit
  rationale: „Der Mensch“ erhält den hebräischen Singular und ist im Deutschen generisch lesbar; „die Menschheit“ verdeutlicht den möglichen kollektiven Sinn.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Überschrift bleibt knapp und prophetisch; „Ausspruch“ vermeidet das heute missverständliche „Lastspruch“. Die syntaktischen und referenziellen Mehrdeutigkeiten des Hebräischen werden nicht dogmatisch aufgelöst, sondern in den Fußnoten sichtbar gehalten.
