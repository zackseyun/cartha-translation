source:
  edition: WLC
  text: הִנֵּ֤ה אֲדֹנָ/י֙ יֽוֹרִשֶׁ֔/נָּה וְ/הִכָּ֥ה בַ/יָּ֖ם חֵילָ֑/הּ וְ/הִ֖יא בָּ/אֵ֥שׁ תֵּאָכֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/004.yaml
  text: Behold[a], the Lord will dispossess her and strike her wealth into the sea, and she will be consumed by fire.
translation:
  language: de
  text: Siehe, der Herr wird sie ihres Besitzes berauben und ihr Vermögen[a] ins Meer schlagen; sie selbst wird vom Feuer verzehrt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Stärke“, „ihre Heeresmacht“ oder „ihre Mittel“. Das hebräische Wort kann Vermögen, Ressourcen, Kraft oder militärische Macht bezeichnen. Wegen der im vorigen Vers genannten Reichtümer von Tyrus steht hier „Vermögen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Siehe
  rationale: Bewahrt die hinweisende und feierliche Kraft der prophetischen Ankündigung; im gehobenen modernen Bibeldeutsch ist „Siehe“ weiterhin verständlich.
- source_word: אֲדֹנָי
  choice: der Herr
  rationale: Gibt den Gottestitel Adonaj wieder. Da hier nicht das Tetragramm steht, wird keine besondere Schreibweise für JHWH verwendet.
- source_word: יוֹרִשֶׁנָּה
  choice: wird sie ihres Besitzes berauben
  rationale: Das Hifil von ירש bezeichnet hier, dass die Stadt ihren Besitz beziehungsweise ihre Stellung verliert. Die Formulierung vermeidet den rechtssprachlichen Beiklang von „enteignen“ und legt nicht unnötig fest, ob Vertreibung oder Besitzergreifung im Vordergrund steht.
- source_word: וְהִכָּה
  choice: und … schlagen
  rationale: Gibt נכה direkt und kraftvoll wieder, ohne die zusätzliche Todesnuance von „erschlagen“ einzutragen.
- source_word: בַּיָּם
  choice: ins Meer
  rationale: Die Richtungsangabe ist im Deutschen mit „schlagen“ idiomatisch und stellt den Untergang von Tyrus’ Ressourcen im Meer anschaulich dar; formal ist auch „im Meer“ möglich.
- source_word: חֵילָהּ
  choice: ihr Vermögen
  rationale: חַיִל kann Vermögen, Mittel, Stärke oder Heeresmacht bezeichnen. Wegen des unmittelbar zuvor genannten Silbers und Goldes passt „Vermögen“ am besten, ohne die weiteren Bedeutungsnuancen zu verschweigen.
- source_word: וְהִיא
  choice: sie selbst
  rationale: Die betonte feminine Form verweist auf die als Frau personifizierte Stadt. „Sie selbst“ bewahrt die Hervorhebung und das poetische Stadtbild.
- source_word: בָּאֵשׁ
  choice: vom Feuer
  rationale: Entspricht im Deutschen der natürlichen Angabe des Mittels bei „verzehrt werden“.
- source_word: תֵּאָכֵל
  choice: wird … verzehrt werden
  rationale: Das Nifal von אכל beschreibt idiomatisch das Verzehrtwerden durch Feuer. Die Wiedergabe erhält das Bild stärker als das bloße „verbrennen“.
theological_decisions:
- issue: Bezug der femininen Suffixe und Pronomen
  choice: Die Stadt Tyrus wird als weibliche Gestalt mit „sie/ihr“ wiedergegeben.
  alternative: Tyrus entsprechend dem deutschen grammatischen Geschlecht unpersönlich mit „es/sein“ wiedergeben.
  rationale: Die hebräischen femininen Formen führen die verbreitete prophetische Personifikation einer Stadt fort. Ihre Beibehaltung wahrt die literarische Kraft, ohne eine zusätzliche dogmatische Aussage einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetisch-feierlichem Ton. „Siehe“ und die personifizierenden Formen „sie/ihr“ sind bewusst literarisch, bleiben aber allgemein verständlich. Der Fußnotenmarker steht unmittelbar bei dem mehrdeutigen Ausdruck „Vermögen“.
