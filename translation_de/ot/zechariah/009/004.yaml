  source_fidelity: 'Die Übersetzung gibt die hebräische Satzfolge und die zentralen Aussagen zuverlässig wieder: Adonaj als „der Herr“, die Entmachtung beziehungsweise Beraubung der personifizierten Stadt, die mehrdeutige חַיִל-Komponente im Kontext des Reichtums von Tyrus sowie ihre Vernichtung durch Feuer. „Ins Meer schlagen“ folgt der im englischen Audit begründeten kontextuellen Richtungsauslegung von בַּיָּם, ohne den Grundsinn des Gerichtshandelns zu verändern.'
  naturalness: Modernes, würdiges Standarddeutsch. „Siehe“ und die feminine Personifikation sind im prophetischen Register natürlich. Die Formulierung „sie ihres Besitzes berauben“ ist klar und idiomatisch; „ihr Vermögen ins Meer schlagen“ ist bewusst bildhaft, aber im Kontext verständlich.
  terminology: „Der Herr“ unterscheidet den Titel Adonaj angemessen von einer Wiedergabe des Tetragramms. „Vermögen“ ist angesichts von Silber und Gold im vorherigen Vers gut begründet; die Fußnote dokumentiert sachgerecht die möglichen Bedeutungen Stärke, Heeresmacht und Mittel. Die Wiedergabe von Tyrus mit „sie/ihr“ bewahrt die hebräische Personifikation.
