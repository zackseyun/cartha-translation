  source_fidelity: Der Entwurf gibt die Pluralaufforderung שׁוּבוּ, das konkrete Bild von לְבִצָּרוֹן („zur Festung“), die absichtlich spannungsvolle Constructusverbindung אֲסִירֵי הַתִּקְוָה („Gefangene der Hoffnung“), die Gegenwartsbetonung von גַּם הַיּוֹם und die offene Zusage von מִשְׁנֶה אָשִׁיב לָךְ zuverlässig wieder. Das Singular-„dir“ bewahrt die feminine Singularanrede, ohne ihren Referenten auszudeuten.
  naturalness: „Kehrt zur Festung zurück, ihr Gefangenen der Hoffnung!“ ist würdig, verständlich und im prophetischen Register natürlich. „Noch heute verkünde ich“ vermittelt die nachdrückliche Gegenwartsbezogenheit idiomatisch. Die Wiederholung von „zurück“/„zurückgeben“ ist im Deutschen nicht störend und kann die Wortverbindung im Hebräischen dezent anklingen lassen.
  terminology: „Festung“ wahrt die konkrete Bildsprache besser als eine rein abstrakte Wiedergabe. „Gefangene der Hoffnung“ erhält die Metapher, und „das Doppelte“ lässt – wie der hebräische Text – offen, worauf sich die doppelte Wiederherstellung bezieht. Die Fußnoten sind korrekt an den betreffenden Ausdrücken verankert und bieten vertretbare Alternativen.
