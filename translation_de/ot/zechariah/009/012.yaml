id: ZEC.9.12
reference: Zechariah 9:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: שׁ֚וּבוּ לְ/בִצָּר֔וֹן אֲסִירֵ֖י הַ/תִּקְוָ֑ה גַּם הַ/יּ֕וֹם מַגִּ֥יד מִשְׁנֶ֖ה אָשִׁ֥יב לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/012.yaml
  text: Return to the stronghold[a], prisoners of hope[b]; even today I declare that I will restore double to you.
translation:
  language: de
  text: 'Kehrt zur Festung[a] zurück, ihr Gefangenen der Hoffnung[b]! Noch heute verkünde ich: Ich werde dir das Doppelte zurückgeben.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: zur befestigten Zuflucht.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: Gefangene, die Hoffnung haben. Der hebräische Ausdruck ist eine auffällige Metapher und kann Menschen bezeichnen, die gefangen und doch von Hoffnung bestimmt sind.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: Ich werde dir einen doppelten Anteil wiedergeben; auch möglich: Ich werde dir doppelt vergelten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּבוּ
  choice: Kehrt … zurück
  rationale: Der Qal-Imperativ Plural von שוב kann eine räumliche Rückkehr und zugleich eine weitergehende Umkehr anklingen lassen; „zurückkehren“ legt den Bezug nicht unnötig fest.
- source_word: לְבִצָּרוֹן
  choice: zur Festung
  rationale: בִּצָּרוֹן bezeichnet einen befestigten Ort beziehungsweise eine Festung. Die konkrete Bildsprache bleibt erhalten, ohne sie zur abstrakten „Sicherheit“ zu glätten.
- source_word: אֲסִירֵי הַתִּקְוָה
  choice: Gefangene der Hoffnung
  rationale: Die Constructusverbindung lautet wörtlich „Gefangene der Hoffnung“. Die ungewöhnliche, spannungsreiche Metapher wird im Deutschen bewahrt.
- source_word: גַּם הַיּוֹם
  choice: Noch heute
  rationale: Die Formulierung gibt die Betonung der gegenwärtigen, unmittelbaren Ankündigung in natürlichem Deutsch wieder.
- source_word: מַגִּיד
  choice: verkünde ich
  rationale: Das Partizip von נגד bezeichnet hier eine gegenwärtige feierliche Bekanntgabe. Die finite deutsche Form ist idiomatisch und passt zum prophetischen Register.
- source_word: מִשְׁנֶה
  choice: das Doppelte
  rationale: מִשְׁנֶה kann „das Doppelte“ oder „einen doppelten Anteil“ bedeuten. „Das Doppelte“ hält den Gegenstand wie im Hebräischen unausgesprochen.
- source_word: אָשִׁיב לָךְ
  choice: Ich werde dir … zurückgeben
  rationale: Der Hifil von שוב hat hier restitutiven Sinn. „Zurückgeben“ bewahrt die Wortverbindung mit שׁוּבוּ und bleibt offener als das stärker vergeltende „heimzahlen“ oder „vergelten“.
theological_decisions:
- issue: Bezug der femininen Singularanrede לָךְ
  choice: Die Anrede wird als „dir“ im Singular beibehalten.
  alternative: Ausdrückliche Deutung als Anrede an Zion/Jerusalem oder als plurale Anrede an alle Gefangenen.
  rationale: Die feminine Singularform spricht wahrscheinlich das personifizierte Zion beziehungsweise Jerusalem oder die Bundesgemeinschaft an. Der Haupttext benennt den Bezug jedoch nicht ausdrücklich und bewahrt so die Offenheit des Hebräischen.
- issue: Art der verheißenen doppelten Wiederherstellung
  choice: „das Doppelte zurückgeben“ ohne nähere Bestimmung
  alternative: „einen doppelten Anteil wiedergeben“ oder „doppelt vergelten“
  rationale: Der Text nennt nicht ausdrücklich, worin das Doppelte besteht. Die Übersetzung vermeidet sowohl eine ausschließlich erbrechtliche Deutung als auch eine rein vergeltende Lesart.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter prophetischer Bildsprache. Der Imperativ bleibt plural, die abschließende Anrede entsprechend dem hebräischen femininen Suffix singular. Die ungewöhnliche Wendung „Gefangene der Hoffnung“ wird nicht geglättet.
