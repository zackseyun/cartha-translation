source:
  edition: WLC
  text: כִּֽי דָרַ֨כְתִּי לִ֜/י יְהוּדָ֗ה קֶ֚שֶׁת מִלֵּ֣אתִי אֶפְרַ֔יִם וְ/עוֹרַרְתִּ֤י בָנַ֨יִ/ךְ֙ צִיּ֔וֹן עַל בָּנַ֖יִ/ךְ יָוָ֑ן וְ/שַׂמְתִּ֖י/ךְ כְּ/חֶ֥רֶב גִּבּֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/013.yaml
  text: For I have bent Judah as my bow; I have filled it with Ephraim. I will stir up your sons[a], Zion, against your sons, Greece, and make you like a warrior’s sword.
translation:
  language: de
  text: Denn ich habe Juda als meinen Bogen gespannt und ihn mit Ephraim gefüllt. Ich werde deine Söhne, Zion, gegen deine Söhne, Griechenland[a], aufbieten und dich einem Kriegerschwert gleichmachen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch „Jawan“, ein traditioneller Name für die griechischen Völker beziehungsweise die griechische Welt.
    reason: Die Fußnote bewahrt die hebräische Namensform und erläutert den mit „Griechenland“ wiedergegebenen historischen Bezug.
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise Erläuterung der vorausgehenden Verheißung ein und gibt den Zusammenhang im Deutschen natürlich wieder.
- source_word: דָרַכְתִּי לִי יְהוּדָה קֶשֶׁת
  choice: ich habe mir Juda als Bogen gespannt
  rationale: דרך bezeichnet in Verbindung mit קשת das Spannen eines Bogens. „Mir“ bewahrt die Funktion von לִי, während „als Bogen“ die Metapher verständlich ausdrückt.
- source_word: מִלֵּאתִי אֶפְרַיִם
  choice: ihn mit Ephraim gefüllt
  rationale: Das ergänzte Pronomen bezieht sich auf den Bogen. Die ungewöhnliche Bildsprache des Hebräischen bleibt erhalten, ohne ausdrücklich einen im Text nicht genannten Pfeil einzuführen.
- source_word: וְעוֹרַרְתִּי
  choice: ich werde … aufbieten
  rationale: Das Verb bezeichnet hier das Erwecken beziehungsweise Mobilisieren zum Kampf. „Aufbieten“ ist im militärischen Zusammenhang natürlich und gibt die futurische Folgehandlung wieder.
- source_word: בָנַיִךְ צִיּוֹן
  choice: deine Söhne, Zion
  rationale: Die feminine Singularform redet Zion als personifizierte Mutter an. „Söhne“ bewahrt die geschlechtlich bestimmte und kriegerische Bildsprache.
- source_word: עַל בָּנַיִךְ יָוָן
  choice: gegen deine Söhne, Griechenland[a]
  rationale: יָוָן bezeichnet Jawan beziehungsweise die griechische Welt. „Griechenland“ macht den historischen Bezug heutigen Lesern unmittelbar verständlich; die traditionelle Namensform wird in der Fußnote genannt.
- source_word: וְשַׂמְתִּיךְ
  choice: und dich … machen
  rationale: In der Vergleichskonstruktion ist „dich wie … machen“ idiomatischer als das wörtlichere „dich setzen“.
- source_word: כְּחֶרֶב גִּבּוֹר
  choice: wie das Schwert eines Kriegers
  rationale: גִּבּוֹר bezeichnet hier einen starken beziehungsweise kampferprobten Krieger. Die Formulierung erhält die kraftvolle militärische Metapher.
theological_decisions:
- issue: Bezug und Wiedergabe von יָוָן
  choice: Griechenland
  alternative: Jawan
  rationale: Der Name bezeichnet in diesem Zusammenhang die griechische Welt. Die verständliche moderne Wiedergabe steht im Text; die formnähere traditionelle Namensform bleibt in der Fußnote erhalten.
- issue: Zeitliche Aussage der hebräischen Perfektformen in prophetischer Rede
  choice: Die vorbereitenden Handlungen stehen im Perfekt, die folgende Mobilisierung im Futur.
  alternative: Alle Verben futurisch oder alle Verben als prophetische Perfekte in der Vergangenheit wiedergeben.
  rationale: Die gemischte Wiedergabe lässt die rhetorische Bewegung von bereits vollzogener Vorbereitung zu bevorstehendem Eingreifen erkennen, ohne die prophetische Spannung einzuebnen.
- issue: Nicht ausdrücklich genannter Pfeil in der Bogenmetapher
  choice: Die wörtliche Vorstellung des Füllens beibehalten, ohne „Pfeil“ in den Haupttext einzufügen.
  alternative: Ephraim ausdrücklich als Pfeil oder Pfeile deuten.
  rationale: Der Zusammenhang legt eine Ausstattung des Bogens nahe, doch das hebräische Wort für „Pfeil“ fehlt. Die Übersetzung bewahrt diese bildliche Unbestimmtheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Anrede der personifizierten Größen Zion und Griechenland sowie die dichte militärische Bildsprache bleiben erhalten. Das ungewöhnliche „mit Ephraim gefüllt“ ist bewusst formnah, damit die im Hebräischen nicht ausdrücklich erklärte Rolle Ephraims im Bogenbild offenbleibt.
