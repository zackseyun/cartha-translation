language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֥י מַה טּוּב֖/וֹ וּ/מַה יָפְי֑/וֹ דָּגָן֙ בַּֽחוּרִ֔ים וְ/תִיר֖וֹשׁ יְנוֹבֵ֥ב בְּתֻלֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/017.yaml
  text: For how great is his goodness[a], and how great his beauty! Grain will make the young men flourish[c][b], and new wine the young women.
translation:
  language: de
  text: Denn wie groß ist seine Güte[a], und wie groß seine Schönheit[c]! Getreide lässt die jungen Männer gedeihen und neuer Wein die jungen Frauen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „wie gut er ist und wie schön er ist“. Im Hebräischen stehen die abstrakten Substantive „seine Güte“ und „seine Schönheit“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Jungfrauen“. Das hebräische Wort בְּתוּלוֹת kann genauer unverheiratete Jungfrauen bezeichnen; hier steht es wahrscheinlich als weibliches Gegenstück zu „junge Männer“.'
    reason: lexical_alternative
  - marker: c
    text: „Seine“ bezieht sich im Zusammenhang wahrscheinlich auf den HERRN. Manche beziehen es jedoch auf Israels wiederhergestellten Zustand oder auf den König.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet eine erklärende, zugleich ausrufende Aussage ein und bewahrt den Anschluss an den vorhergehenden Vers.
- source_word: מַה טּוּבוֹ
  choice: wie groß ist seine Güte
  rationale: Die Ausrufekonstruktion wird natürlich wiedergegeben; das abstrakte Substantiv טוּב samt Suffix bleibt als „seine Güte“ erhalten.
- source_word: וּמַה יָפְיוֹ
  choice: und wie groß seine Schönheit
  rationale: Bewahrt die substantivische Parallelität zu „seine Güte“ und gibt יֹפִי als Schönheit beziehungsweise herrliche Anmut wieder.
- source_word: דָּגָן
  choice: Getreide
  rationale: Bezeichnet allgemein Getreideerzeugnisse und nicht eine bestimmte Getreideart.
- source_word: בַּחוּרִים
  choice: die jungen Männer
  rationale: Bezeichnet hier junge Männer als Gegenstück zu den jungen Frauen im parallelen Satzglied.
- source_word: יְנוֹבֵב
  choice: lässt … gedeihen
  rationale: Das seltene Verb beschreibt hier wohl verursachtes Aufblühen oder kräftiges Gedeihen; diese Formulierung wahrt den kausativen Sinn und das Bild reichlicher Versorgung.
- source_word: וְתִירוֹשׁ
  choice: und neuer Wein
  rationale: תִּירוֹשׁ bezeichnet typischerweise neuen beziehungsweise frischen Wein und steht poetisch parallel zu Getreide.
- source_word: בְּתֻלוֹת
  choice: die jungen Frauen
  rationale: Im Parallelismus bezeichnet der Ausdruck die weibliche Gruppe gegenüber den jungen Männern; die spezifischere Bedeutung „Jungfrauen“ bleibt in einer Fußnote erhalten.
theological_decisions:
- issue: Bezug der maskulinen Singularsuffixe in „seine Güte“ und „seine Schönheit“
  choice: Im Haupttext bleibt der pronominale Bezug wie im Hebräischen unausgesprochen; im Zusammenhang ist wahrscheinlich der HERR gemeint.
  alternative: Gemeint sein könnten auch Israels beziehungsweise Zions wiederhergestellter Zustand oder der zuvor erwähnte König.
  rationale: Vers 16 stellt das rettende Handeln des HERRN in den Vordergrund, sodass seine Güte und Schönheit beziehungsweise Herrlichkeit als Bezug naheliegen. Da die Suffixe selbst den Bezug nicht ausdrücklich bestimmen, wird die Mehrdeutigkeit in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer poetischer Parallelität. Die elliptische zweite Vershälfte („und neuer Wein die jungen Frauen“) bleibt erhalten und ist im Deutschen gut verständlich; das Verb „lässt … gedeihen“ gilt sinngemäß für beide Satzglieder.
