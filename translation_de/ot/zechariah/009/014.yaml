id: ZEC.9.14
reference: Zechariah 9:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַֽ/יהוָה֙ עֲלֵי/הֶ֣ם יֵֽרָאֶ֔ה וְ/יָצָ֥א כַ/בָּרָ֖ק חִצּ֑/וֹ וַֽ/אדֹנָ֤/י יְהֹוִה֙ בַּ/שּׁוֹפָ֣ר יִתְקָ֔ע וְ/הָלַ֖ךְ בְּ/סַעֲר֥וֹת תֵּימָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/014.yaml
  text: Then Yahweh will appear over them[a], and his arrow will go out like lightning[b]; and the Lord GOD will sound the trumpet and march in the whirlwinds of the south.
translation:
  language: de
  text: Dann wird Jahwe über ihnen erscheinen, und sein Pfeil wird wie ein Blitz hervorschießen. Der Herr Jahwe wird das Schofar blasen[a] und in den Wirbelstürmen des Südens einherziehen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Schofar ist ein Signalhorn, meist aus einem Widderhorn gefertigt, das unter anderem im Krieg und bei gottesdienstlichen Anlässen geblasen wurde.
    reason: cultural_note
  - marker: b
    text: 'Oder: „in den Wirbelstürmen von Teman“. Das hebräische Wort kann sowohl „Süden“ bedeuten als auch den Orts- beziehungsweise Gebietsnamen Teman bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen gebräuchliche Wiedergabe des Gottesnamens bewahrt den Eigennamen statt ihn durch einen Titel zu ersetzen.
- source_word: עֲלֵיהֶם יֵרָאֶה
  choice: wird über ihnen erscheinen
  rationale: Die räumliche Bedeutung von עַל und der theophanische Sinn des Niphal von ראה bleiben erhalten, ohne den Bezug von „ihnen“ festzulegen.
- source_word: וְיָצָא כַבָּרָק חִצּוֹ
  choice: sein Pfeil wird wie ein Blitz hervorschießen
  rationale: „Hervorschießen“ gibt das Ausgehen des Pfeils in natürlichem Deutsch wieder und bewahrt zugleich den Blitzvergleich.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  rationale: 'Beide Bestandteile der hebräischen Verbindung bleiben sichtbar: der Titel אֲדֹנָי und der Gottesname יְהוִה.'
- source_word: בַּשּׁוֹפָר יִתְקָע
  choice: wird ins Schofarhorn stoßen
  rationale: Die deutsche Wendung bezeichnet das Blasen des Horns idiomatisch; „Schofarhorn“ bewahrt die konkrete Art des Signalhorns.
- source_word: וְהָלַךְ
  choice: und einherziehen
  rationale: Das Verb bewahrt die Bewegung des göttlichen Kriegers, ohne sie enger als militärisches Marschieren festzulegen.
- source_word: בְּסַעֲרוֹת
  choice: in den Wirbelstürmen
  rationale: Der Plural und die heftige Sturmbewegung des Ausdrucks werden anschaulich und quellennah wiedergegeben.
- source_word: תֵימָן
  choice: des Südens
  rationale: תֵּימָן kann die südliche Himmelsrichtung beziehungsweise das Südland bezeichnen; die mögliche Lesart als Ortsname wird in einer Fußnote erhalten.
theological_decisions:
- issue: Wiedergabe der Gottesnamen יְהוָה und אֲדֹנָי יְהוִה
  choice: Jahwe … der Herr Jahwe
  alternative: der HERR … Gott der HERR
  rationale: Die Übersetzung bewahrt den offen genannten Gottesnamen und gibt zugleich den vorangestellten Herrschaftstitel wieder.
- issue: Bezugswort von עֲלֵיהֶם („über ihnen“)
  choice: Die räumlich und referenziell offene Formulierung „über ihnen“ bleibt im Haupttext stehen.
  alternative: „gegen sie“ oder eine ausdrückliche Bestimmung als Gottes Volk
  rationale: Der unmittelbare Zusammenhang legt Gottes Volk als Bezug nahe, doch die hebräische Form selbst benennt den Bezug nicht erneut; eine Festlegung würde die vorhandene Mehrdeutigkeit vermindern.
- issue: Deutung von תֵּימָן
  choice: Süden
  alternative: Teman
  rationale: Im Bild von Sturm und göttlichem Einherziehen ist die Himmelsrichtung gut verständlich; da derselbe Ausdruck auch als Ortsname gelesen werden kann, wird diese Möglichkeit ausdrücklich vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Bildsprache der Gotteserscheinung und des göttlichen Kriegers bleibt kräftig, ohne durch unnötig militärische oder konfessionell geprägte Zusätze eingeengt zu werden. Die Fußnotenmarker stehen jeweils an der sachlich zugehörigen Stelle.
