  text: וְ/יָשַׁ֥ב מַמְזֵ֖ר בְּ/אַשְׁדּ֑וֹד וְ/הִכְרַתִּ֖י גְּא֥וֹן פְּלִשְׁתִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/006.yaml
  text: A mixed people will dwell in Ashdod[a], and I will cut off the pride of the Philistines.
translation:
  language: de
  text: Menschen gemischter Herkunft werden in Aschdod wohnen[a], und ich werde den Hochmut der Philister beseitigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ein unehelich Geborener wird in Aschdod wohnen.« Das hebräische Wort מַמְזֵר ist schwer zu deuten und kann einen Menschen gemischter Herkunft oder eine gesellschaftlich ausgegrenzte Person bezeichnen; hier ist es im Zusammenhang kollektiv wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשַׁב
  choice: wird … wohnen
  rationale: Das Verb bezeichnet hier das Wohnen beziehungsweise Ansässigsein in einer Stadt und wird im Deutschen natürlich und präzise mit »wohnen« wiedergegeben.
- source_word: מַמְזֵר
  choice: ein Mischvolk
  rationale: Das schwierige Substantiv kann eine Person gemischter oder gesellschaftlich ausgeschlossener Herkunft bezeichnen. Im Zusammenhang des Bevölkerungswandels von Aschdod gibt die kollektive Wiedergabe »Mischvolk« den wahrscheinlichen Sinn knapp wieder, ohne die lexikalische Unsicherheit zu verschweigen.
- source_word: בְּאַשְׁדּוֹד
  choice: in Aschdod
  rationale: Die Präposition bezeichnet den Ort; »in Aschdod« ist für das Wohnen innerhalb der Stadt idiomatisch.
- source_word: הִכְרַתִּי
  choice: ich werde … ausrotten
  rationale: Der Hifil von כרת bedeutet abschneiden, beseitigen oder ausrotten. Bezogen auf den Stolz eines Volkes drückt »ausrotten« die entschiedene, vollständige Beseitigung im Gericht aus, ohne den Ausdruck unnatürlich wörtlich wiederzugeben.
- source_word: גְּאוֹן
  choice: den Stolz
  rationale: Im Gerichtswort bezeichnet das Wort die hochmütige Selbstüberhebung beziehungsweise die stolze Macht der Philister; »Stolz« bewahrt diese mögliche Bedeutungsbreite.
- source_word: פְּלִשְׁתִּים
  choice: der Philister
  rationale: Die hebräische Form bezeichnet die Volksgruppe, nicht das Land Philistäa.
theological_decisions:
- issue: Bedeutung und Bezug von מַמְזֵר im Gerichtswort
  choice: Kollektiv als »ein Mischvolk« wiedergegeben
  alternative: »ein unehelich Geborener« oder »ein Fremder«
  rationale: Der Zusammenhang handelt von der Demütigung und Veränderung der philistäischen Bevölkerung. Die kollektive Wiedergabe ist kontextuell plausibel, doch die mögliche individuelle beziehungsweise gesellschaftsrechtliche Bedeutung bleibt in der Fußnote sichtbar; damit wird die echte Unsicherheit nicht dogmatisch aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Mischvolk« ist bewusst knapp und kollektiv; die Fußnote bewahrt die erhebliche lexikalische Unsicherheit. Der Satzbau folgt der parallelen Struktur des Hebräischen.
