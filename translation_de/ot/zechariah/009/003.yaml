base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/003.yaml
  text: Tyre built herself a fortress[a], and piled up silver like dust[b], and gold like the mud of the streets.
translation:
  language: de
  text: Tyrus baute sich eine Festung[a] und häufte Silber wie Staub und Gold wie Schlamm auf den Straßen an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein Bollwerk«. Das hebräische Wort מָצוֹר kann eine befestigte Anlage oder Verteidigungswerke bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹר
  choice: Tyrus
  rationale: Der übliche deutsche Name der phönizischen Stadt.
- source_word: וַתִּבֶן
  choice: baute
  rationale: Das Wayyiqtol bezeichnet hier eine erzählte Handlung in der Vergangenheit.
- source_word: מָצוֹר
  choice: Festung
  rationale: Im Zusammenhang bezeichnet das Wort eine befestigte Anlage zum Schutz der Stadt; die mögliche Bedeutung »Bollwerk« wird in der Fußnote bewahrt.
- source_word: לָהּ
  choice: sich
  rationale: Das feminine Singularpronomen bezieht sich auf die personifiziert gedachte Stadt und wird im Deutschen natürlich reflexiv wiedergegeben.
- source_word: וַתִּצְבָּר
  choice: häufte … an
  rationale: Die Wendung bewahrt das konkrete Bild einer großen Ansammlung und passt zu den folgenden Vergleichen.
- source_word: כֶּסֶף
  choice: Silber
  rationale: Gemeint ist hier das Edelmetall, parallel zu Gold.
- source_word: כֶּעָפָר
  choice: wie Staub
  rationale: Der Vergleich veranschaulicht die außerordentliche Menge.
- source_word: חָרוּץ
  choice: Gold
  rationale: Das Substantiv bezeichnet in diesem Zusammenhang Gold; eine spezifischere Wiedergabe als »Feingold« bleibt möglich.
- source_word: כְּטִיט חוּצוֹת
  choice: wie den Schlamm auf den Straßen
  rationale: Die Formulierung gibt das anschauliche Bild von allgegenwärtigem Straßenschlamm in natürlichem Deutsch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Bilder von Staub und Straßenschlamm bleiben konkret erhalten; die feminine Personifizierung der Stadt wird idiomatisch mit »sich« ausgedrückt.
