reference: Zechariah 9:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: גִּילִ֨י מְאֹ֜ד בַּת צִיּ֗וֹן הָרִ֨יעִי֙ בַּ֣ת יְרוּשָׁלִַ֔ם הִנֵּ֤ה מַלְכֵּ/ךְ֙ יָ֣בוֹא לָ֔/ךְ צַדִּ֥יק וְ/נוֹשָׁ֖ע ה֑וּא עָנִי֙ וְ/רֹכֵ֣ב עַל חֲמ֔וֹר וְ/עַל עַ֖יִר בֶּן אֲתֹנֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/009.yaml
  text: Rejoice greatly[a], daughter Zion! Shout in triumph, daughter Jerusalem! Look, your king is coming to you—righteous and victorious is he, humble and riding on a donkey, on a colt[c][b], the foal of a she-donkey.
translation:
  language: de
  text: 'Freue dich sehr, Tochter Zion! Jauchze, Tochter Jerusalem! Sieh, dein König kommt zu dir: Gerecht und siegreich[a] ist er, arm[b] und auf einem Esel reitend, auf einem jungen Esel, dem Fohlen einer Eselin.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gerettet ist er“ beziehungsweise „mit Heil begabt ist er“. Das hebräische Wort kann jemanden bezeichnen, den Gott gerettet oder befreit hat und der deshalb siegreich kommt.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „niedrig“, „bedrängt“ oder „demütig“. Das hebräische Wort kann Armut, Niedrigkeit oder Bedrängnis bezeichnen und in diesem Zusammenhang auch eine demütige Erscheinung nahelegen.'
    reason: lexical_alternative
  - marker: c
    text: Die Wendung „auf einem Esel, auf einem jungen Esel, dem Fohlen einer Eselin“ ist wahrscheinlich poetischer Parallelismus, der ein und dasselbe Tier aus zwei Blickwinkeln beschreibt.
    reason: cultural_note
lexical_decisions:
- source_word: גִּילִי מְאֹד
  choice: Freue dich sehr
  rationale: Der feminine Singular des Imperativs richtet sich an die personifizierte Tochter Zion; „freue dich sehr“ gibt Aufforderung und Verstärkung klar und natürlich wieder.
- source_word: בַּת צִיּוֹן / בַּת יְרוּשָׁלִַם
  choice: Tochter Zion / Tochter Jerusalem
  rationale: Die wörtliche Wiedergabe bewahrt die poetische Personifikation der Stadt und ihres Volkes.
- source_word: הָרִיעִי
  choice: Jauchze
  rationale: Das Verb bezeichnet einen lauten Ruf, häufig einen Jubel- oder Siegesruf. „Jauchze“ vermittelt im Zusammenhang des königlichen Einzugs die feierliche Freude prägnant.
- source_word: הִנֵּה
  choice: Sieh
  rationale: Die Aufmerksamkeitspartikel wird mit einem gegenwärtigen, würdevollen und nicht altertümlichen deutschen Ausdruck wiedergegeben.
- source_word: מַלְכֵּךְ יָבוֹא לָךְ
  choice: dein König kommt zu dir
  rationale: Das hebräische Imperfekt kann künftig oder als unmittelbar bevorstehend verstanden werden. Das Präsens vermittelt die lebendige prophetische Unmittelbarkeit und bewahrt die Richtungsangabe.
- source_word: צַדִּיק
  choice: gerecht
  rationale: „Gerecht“ wahrt sowohl den ethischen als auch den bundestheologischen Bedeutungsumfang des Adjektivs.
- source_word: וְנוֹשָׁע
  choice: siegreich
  rationale: Das passive Partizip kann einen von Gott Geretteten bzw. Befreiten bezeichnen und im königlichen Kontext daher den durch Rettung errungenen Sieg ausdrücken. Die passive Lesart wird in der Fußnote offengehalten.
- source_word: עָנִי
  choice: demütig
  rationale: Das Wort kann Armut, Bedrängnis oder Niedrigkeit bezeichnen. „Demütig“ gibt im Kontext die unprunkvolle Erscheinung des Königs natürlich wieder; die weiteren Bedeutungen bleiben in der Fußnote sichtbar.
- source_word: וְרֹכֵב עַל חֲמוֹר
  choice: und auf einem Esel reitend
  rationale: Die partizipiale Form und das konkrete Bild der Ankunft werden eng am Hebräischen bewahrt.
- source_word: וְעַל עַיִר בֶּן אֲתֹנוֹת
  choice: auf einem jungen Esel, dem Fohlen einer Eselin
  rationale: Die zweite poetische Bezeichnung erläutert das Reittier als junges Tier; „Fohlen einer Eselin“ ist im Deutschen verständlich und bildhaft.
theological_decisions:
- issue: Wiedergabe von וְנוֹשָׁע in der königlichen Verheißung
  choice: siegreich
  alternative: gerettet; mit Rettung ausgestattet
  rationale: Die passive Form lässt Gottes rettendes Handeln am König erkennen, während der Zusammenhang zugleich den siegreichen königlichen Einzug hervorhebt. Der Haupttext wählt eine natürliche kontextuelle Wiedergabe; die Fußnote bewahrt die grammatisch engere und theologisch bedeutsame Alternative.
- issue: Bedeutungsumfang von עָנִי beim kommenden König
  choice: demütig
  alternative: niedrig; arm; bedrängt
  rationale: Der Zusammenhang stellt die schlichte Ankunft des Königs heraus, erlaubt aber auch eine Aussage über seinen niedrigen oder bedrängten Zustand. Die Fußnote verhindert, dass diese Spannung auf eine reine Charaktereigenschaft verengt wird.
- issue: Verhältnis von Esel und jungem Esel
  choice: poetische Parallelbeschreibung wahrscheinlich eines Tieres
  alternative: zwei gesonderte Tiere
  rationale: Die parallele hebräische Formulierung kann dasselbe Tier mit zwei sich ergänzenden Ausdrücken beschreiben. Da die Oberflächenform beide Glieder nennt, bleibt sie im Haupttext erhalten und wird lediglich in der Fußnote erläutert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter prophetischer Bildsprache. „Jauchze“ ist gehoben, aber allgemein verständlich; altertümliche Formen wie „frohlocke“ oder „siehe“ werden vermieden. Die Satzstellung „Gerecht und siegreich ist er“ erhält den betonten Charakter der hebräischen Prädikatsfolge.
