  to: 'Freue dich sehr, Tochter Zion! Jauchze, Tochter Jerusalem! Sieh, dein König kommt zu dir: Gerecht und siegreich[a] ist er, arm[b] und auf einem Esel reitend, auf einem jungen Esel, dem Fohlen einer Eselin.[c]'
