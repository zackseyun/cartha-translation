source:
  edition: WLC
  text: וַ/הֲסִרֹתִ֨י דָמָ֜י/ו מִ/פִּ֗י/ו וְ/שִׁקֻּצָי/ו֙ מִ/בֵּ֣ין שִׁנָּ֔י/ו וְ/נִשְׁאַ֥ר גַּם ה֖וּא לֵֽ/אלֹהֵ֑י/נוּ וְ/הָיָה֙ כְּ/אַלֻּ֣ף בִּֽ/יהוּדָ֔ה וְ/עֶקְר֖וֹן כִּ/יבוּסִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/007.yaml
  text: I will remove his blood from his mouth and his detestable things from between his teeth[a]. Then he too will be a remnant for our God; he will be like a clan leader in Judah[c][b], and Ekron will be like the Jebusite.
translation:
  language: de
  text: Ich werde sein Blut aus seinem Mund entfernen und seine abscheulichen Dinge aus dem Zwischenraum seiner Zähne.[a] Auch er wird für unseren Gott übrig bleiben;[b] er wird wie ein Sippenoberhaupt in Juda sein, und Ekron wird wie ein Jebusiter sein.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die „abscheulichen Dinge“ sind wahrscheinlich götzendienerische oder kultisch unreine Dinge, möglicherweise Speisen aus heidnischen Kulthandlungen.
    reason: cultural_note
  - marker: b
    text: 'Oder: „Auch er wird für unseren Gott als Rest verbleiben“ oder „Auch er wird für unseren Gott zurückbleiben.“ Das hebräische Verb kann allgemein „übrig bleiben“ oder „zurückbleiben“ bedeuten; im prophetischen Zusammenhang kann es zugleich an einen bewahrten Rest anklingen.'
    reason: lexical_alternative
  - marker: c
    text: Der Vergleich mit einem Jebusiter kann auf eine Eingliederung in Juda hinweisen. Er wird häufig im Licht der Stellung der Jebusiter in Jerusalem verstanden; die genaue Pointe des Vergleichs wird im Vers jedoch nicht erklärt.
    reason: cross_reference
lexical_decisions:
- source_word: וַהֲסִרֹתִי
  choice: Ich werde … entfernen / hervorholen
  rationale: Der Hifil von סור bezeichnet hier Gottes ursächliches Beseitigen. Im Deutschen wird das eine hebräische Verb wegen der unterschiedlichen Ortsangaben idiomatisch mit „entfernen“ und „hervorholen“ wiedergegeben.
- source_word: דָמָיו
  choice: sein Blut
  rationale: Die konkrete und mehrdeutige Bildsprache bleibt erhalten; ob Blutgenuss, Blutschuld oder beides gemeint ist, wird im Haupttext nicht festgelegt.
- source_word: שִׁקֻּצָיו
  choice: seine abscheulichen Dinge
  rationale: שִׁקּוּץ bezeichnet verabscheuungswürdige, häufig kultisch oder götzendienerisch belastete Dinge. Die Wiedergabe wahrt die Breite des Ausdrucks.
- source_word: מִבֵּין שִׁנָּיו
  choice: zwischen seinen Zähnen hervorholen
  rationale: Die anschauliche körperliche Metapher wird bewahrt und zugleich natürlich ins Deutsche gefasst.
- source_word: וְנִשְׁאַר גַּם הוּא
  choice: Auch er wird … als Rest verbleiben
  rationale: Der Nifal von שׁאר kann allgemein „übrig bleiben“ bedeuten, trägt im prophetischen Zusammenhang aber auch den Klang eines bewahrten Restes. גַּם הוּא wird ausdrücklich mit „auch er“ wiedergegeben.
- source_word: לֵאלֹהֵינוּ
  choice: unserem Gott
  rationale: Das ל bezeichnet hier Zugehörigkeit beziehungsweise Hinwendung. Der deutsche Dativ mit „verbleiben“ drückt die Beziehung knapp und natürlich aus.
- source_word: כְּאַלֻּף בִּיהוּדָה
  choice: wie ein Sippenoberhaupt in Juda
  rationale: אַלּוּף bezeichnet hier am ehesten einen führenden Mann beziehungsweise ein Oberhaupt einer sozialen Gruppe, nicht die Zahl Tausend.
- source_word: וְעֶקְרוֹן כִּיבוּסִי
  choice: und Ekron wird wie der Jebusiter sein
  rationale: Die knappe hebräische Vergleichsform wird im Deutschen durch ein ergänztes Verb verständlich gemacht, ohne den Sinn des Vergleichs im Haupttext festzulegen.
theological_decisions:
- issue: Stellung des gereinigten Philisters
  choice: Die Formulierung lässt Reinigung und Zugehörigkeit zu Israels Gott erkennen, bewahrt aber den grammatischen Singular.
  alternative: Nur politische Unterwerfung oder eine ausdrücklich kollektiv formulierte Eingliederung ganz Philistäas.
  rationale: Das Entfernen von Blut und abscheulichen Dingen sowie die Wendung „unserem Gott“ sprechen für mehr als politische Niederlage. Zugleich kann der Singular eine Person oder eine Gemeinschaft repräsentieren; diese Spannung bleibt offen.
- issue: Restmotiv in וְנִשְׁאַר
  choice: „als Rest verbleiben“
  alternative: „übrig bleiben“ oder „zurückgelassen werden“ ohne ausdrückliches Restmotiv
  rationale: Die gewählte Formulierung erhält sowohl die Grundbedeutung des Verbs als auch seinen möglichen prophetischen Nachklang. Die allgemeinere Lesart wird in einer Fußnote genannt.
- issue: Bedeutung des Vergleichs mit dem Jebusiter
  choice: Der Vergleich bleibt im Haupttext unaufgelöst.
  alternative: Den Vergleich ausdrücklich als Eingliederung in Juda erklären.
  rationale: Eine Eingliederung wie bei den Jebusitern ist im Zusammenhang wahrscheinlich, steht jedoch nicht ausdrücklich im Vers. Daher gehört sie in die Anmerkung, nicht als Festlegung in den Haupttext.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter körperlicher Bildsprache. „Sippenoberhaupt“ ist verständlicher als „Fürst“ und genauer als eine wörtliche Ableitung im Sinn von „Tausend“. Die Satzstruktur bleibt nahe am Hebräischen, ohne unnatürlich zu wirken.
