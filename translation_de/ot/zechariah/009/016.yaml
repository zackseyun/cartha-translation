base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/016.yaml
  text: And Yahweh their God will save them on that day as the flock of his people[b][a], for they will sparkle like the stones of a crown over his land.
translation:
  language: de
  text: Und Jahwe, ihr Gott, wird sie, sein Volk, an jenem Tag wie eine Herde retten. Denn als Kronensteine[b] werden sie über seinem Land weithin glänzen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »werden sie sich über seinem Land weithin erheben« beziehungsweise »werden sie dort weithin sichtbar hervortreten«. Das seltene hebräische Verb kann neben strahlender Pracht auch das Erheben oder auffällige Zur-Schau-Stellen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »die Steine einer Krone«, »die Juwelen einer Krone« oder »Kronjuwelen«; weniger wahrscheinlich: »geweihte Steine«. Das hebräische Wort für »Krone« oder »Diadem« kann auch mit Weihe verbunden sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹשִׁיעָם
  choice: Und … wird sie … retten
  rationale: Das Hifil von ישׁע bezeichnet retten oder befreien. »Retten« bewahrt die umfassende Bedeutung, ohne ausschließlich militärischen Sieg auszudrücken.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen JHWH als Eigennamen wieder.
- source_word: אֱלֹהֵיהֶם
  choice: ihr Gott
  rationale: Entspricht unmittelbar der Constructusverbindung mit dem Suffix der dritten Person Plural.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Natürliche deutsche Wiedergabe der prophetischen Zeitangabe; »jenem« erhält den verweisenden Charakter von הַהוּא.
- source_word: כְּצֹאן עַמּוֹ
  choice: wie die Herde seines Volkes
  rationale: Bewahrt sowohl die Vergleichspartikel als auch das kollektive Hirtenbild. Die knappe hebräische Verbindung lässt offen, ob stärker die Geretteten als Gottes Herde bezeichnet oder die Art ihrer Rettung verglichen wird.
- source_word: כִּי
  choice: Denn
  rationale: Kennzeichnet den folgenden Satz als Begründung oder nähere Erläuterung.
- source_word: אַבְנֵי נֵזֶר
  choice: die Steine einer Krone
  rationale: Die bildhafte Constructusverbindung bleibt erhalten. נֵזֶר kann Krone beziehungsweise Diadem bezeichnen und zugleich an Weihe erinnern; »Kronjuwelen« wäre idiomatischer, aber deutender.
- source_word: מִתְנוֹסְסוֹת
  choice: werden … weithin glänzen
  rationale: Die Form beschreibt auffällige, weithin sichtbare Erhebung oder Pracht. Im Zusammenhang mit Kronensteinen gibt »glänzen« die Bildwirkung natürlich wieder; »weithin« bewahrt den Gedanken des hervorgehobenen Sichtbarseins.
- source_word: עַל אַדְמָתוֹ
  choice: über seinem Land
  rationale: אַדָמָה bezeichnet Boden oder Land. »Über seinem Land« wahrt die räumliche Bildsprache und das maskuline Possessivsuffix.
theological_decisions:
- issue: Verhältnis der Bilder von Herde und Kronensteinen
  choice: Die Geretteten erscheinen zunächst als die Herde seines Volkes und anschließend wie weithin glänzende Kronensteine.
  alternative: Die Herde kann adverbial die Art der Rettung beschreiben; die Steine können statt als Schmucksteine auch als geweihte oder emporgehobene Steine verstanden werden.
  rationale: Die poetische Folge legt nahe, dass beide Bilder auf das gerettete Volk bezogen sind. Die Übersetzung lässt die knappe Syntax stehen und legt keine bestimmte heilsgeschichtliche oder konfessionelle Deutung fest.
- issue: Bezug von »seinem Land«
  choice: Das Possessivpronomen bleibt ohne erläuternden Zusatz stehen und bezieht sich grammatisch am ehesten auf Jahwe.
  alternative: Das Land kann zugleich als das dem Volk zugewiesene Land verstanden werden.
  rationale: Der hebräische Text nennt nur das maskuline Suffix. Eine ausdrückliche Festlegung würde die im Text mögliche Beziehung unnötig verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Bildfolge und ihre syntaktische Offenheit werden möglichst bewahrt; seltene oder stärker deutende Bedeutungsalternativen stehen in den Fußnoten.
