revisions:
- from: Und Jahwe, ihr Gott, wird sie an jenem Tag retten wie die Herde seines Volkes. Denn wie die Steine einer Krone[b] werden sie über seinem Land weithin glänzen.[a]
  to: Und Jahwe, ihr Gott, wird sie, sein Volk, an jenem Tag wie eine Herde retten. Denn als Kronensteine[b] werden sie über seinem Land weithin glänzen.[a]
  rationale: Die Revision entfernt den in der hebräischen zweiten Bildhälfte nicht vorhandenen Vergleich und stellt die Kronenstein-Metapher als unmittelbare Aussage über das gerettete Volk dar. Zugleich wird die appositionelle Beziehung von Herde und Volk im Deutschen klarer. Die lexikalische Ambivalenz von מתנוססות und נזר bleibt durch Fußnoten dokumentiert.
