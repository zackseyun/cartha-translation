source:
  edition: WLC
  text: יְהוָ֣ה צְבָאוֹת֮ יָגֵ֣ן עֲלֵי/הֶם֒ וְ/אָכְל֗וּ וְ/כָֽבְשׁוּ֙ אַבְנֵי קֶ֔לַע וְ/שָׁת֥וּ הָמ֖וּ כְּמוֹ יָ֑יִן וּ/מָֽלְאוּ֙ כַּ/מִּזְרָ֔ק כְּ/זָוִיּ֖וֹת מִזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/015.yaml
  text: The LORD of Armies will shield them, and they will devour and trample the sling stones; they will drink and roar as if with wine, and they will be filled like a bowl, like the corners of the altar.
translation:
  language: de
  text: Der HERR der Heerscharen wird sie beschützen. Sie werden verschlingen und die Schleudersteine niedertreten; sie werden trinken und lärmen wie vom Wein. Sie werden voll sein wie eine Opferschale, wie die Ecken des Altars.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: der HERR der Heerscharen
  rationale: Gibt den Gottesnamen gemäß der etablierten deutschen Bibeltradition mit HERR wieder und bewahrt bei צְבָאוֹת das militärisch-kosmische Bild des hebräischen Ausdrucks.
- source_word: יָגֵן עֲלֵיהֶם
  choice: wird sie beschützen
  rationale: יָגֵן bezeichnet schirmenden Schutz; das deutsche Verb ist natürlich und erhält die Aussage göttlicher Bewahrung.
- source_word: וְאָכְלוּ
  choice: Sie werden fressen
  rationale: Bewahrt die kräftige, bildhafte Bedeutung von אָכַל; das nicht ausdrücklich genannte Objekt bleibt wie im Hebräischen offen.
- source_word: וְכָבְשׁוּ אַבְנֵי קֶלַע
  choice: und die Schleudersteine niedertreten
  rationale: כָּבַשׁ kann unterwerfen bzw. niedertreten bedeuten. Im Zusammenhang mit Geschossen gibt „niedertreten“ das Bild des Sieges wieder, ohne ein zusätzliches Objekt einzuführen.
- source_word: וְשָׁתוּ הָמוּ כְּמוֹ יָיִן
  choice: sie werden trinken und lärmen wie vom Wein
  rationale: הָמָה bezeichnet lautes Getöse oder Lärmen. „wie vom Wein“ gibt den knappen Vergleich idiomatisch wieder, ohne ausdrücklich Trunkenheit als einzige Deutung festzulegen.
- source_word: כַּמִּזְרָק
  choice: wie eine Opferschale
  rationale: מִזְרָק ist eine im Altardienst verwendete Schale, insbesondere zum Auffangen oder Sprengen von Blut; „Opferschale“ macht den kultischen Zusammenhang verständlich.
- source_word: כְּזָוִיּוֹת מִזְבֵּחַ
  choice: wie die Ecken des Altars
  rationale: Formnahe Wiedergabe. Gemeint sein können die vom Opferblut benetzten Altarbereiche; die bildhafte Kürze des Hebräischen wird nicht aufgelöst.
theological_decisions:
- issue: Bezug des Fressens und Niedertretens
  choice: Das Objekt von „fressen“ bleibt unausgesprochen; „Schleudersteine“ wird nur mit „niedertreten“ verbunden.
  alternative: „Sie werden die Schleudersteine verschlingen und niedertreten.“
  rationale: Die hebräische Syntax nennt nach וְאָכְלוּ kein eigenes Objekt. Eine eindeutige Zuordnung der Schleudersteine zu beiden Verben würde die genuine syntaktische Spannung glätten.
- issue: Kultisches Blutbild am Versende
  choice: „voll sein wie eine Opferschale, wie die Ecken des Altars“
  alternative: „mit Blut gefüllt sein wie eine Opferschale und blutgetränkt wie die Ecken des Altars“
  rationale: Der kultische Kontext legt Blut nahe, doch das Wort steht hier nicht ausdrücklich. Die Übersetzung bewahrt das Bild, ohne die Ellipse interpretierend zu ergänzen.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst kräftigen Verben. Die kultische und kriegerische Bildsprache bleibt erhalten; nicht ausdrücklich genannte Objekte oder Stoffe werden nicht ergänzt.
