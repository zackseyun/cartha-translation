base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/008.yaml
  text: And I will encamp at my house as a guard[a], so that none may pass to and fro, and no oppressor will pass over them again[c][b]; for now I have seen with my own eyes.
translation:
  language: de
  text: Ich werde mich bei meinem Haus als Wache[a] lagern, zum Schutz vor jedem, der hindurchzieht und zurückkehrt[b]. Kein Unterdrücker[c] wird wieder über sie hinwegziehen; denn jetzt habe ich mit eigenen Augen gesehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als Garnison“. Das hebräische Wort bezeichnet einen aufgestellten Wachposten oder eine militärische Schutzstellung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „von dem Durchziehenden und von dem Zurückkehrenden“; gemeint ist wahrscheinlich Bewegung in beide Richtungen, besonders das Durchziehen feindlicher Kräfte.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Antreiber“, „Zuchtmeister“ beziehungsweise „Eintreiber“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָנִיתִי
  choice: Ich werde mich … lagern
  rationale: Das Verb חנה bezeichnet das Lagern oder Aufschlagen eines Lagers. Die Wiedergabe bewahrt hier den militärischen und schützenden Bildgehalt.
- source_word: לְבֵיתִי
  choice: bei meinem Haus
  rationale: Die Präposition kann räumlich oder zugunsten von etwas verstanden werden. „Bei meinem Haus“ bleibt nahe am Wortlaut, ohne den Bezug vorschnell allein auf den Tempel oder allgemein auf das Volk festzulegen.
- source_word: מִצָּבָה
  choice: als Wache
  rationale: Das Substantiv bezeichnet einen aufgestellten Posten, eine Wache oder eine Garnison. „Als Wache“ ist im modernen Deutsch klar und erhält das militärische Schutzbild.
- source_word: מֵעֹבֵר וּמִשָּׁב
  choice: gegen jeden, der hin- und herzieht
  rationale: Die beiden Partizipien bezeichnen wörtlich einen Vorüberziehenden und einen Zurückkehrenden. Die idiomatische Paarung beschreibt Bewegung in beide Richtungen; „zieht“ lässt im Kontext auch den möglichen militärischen Sinn erkennen.
- source_word: וְלֹא יַעֲבֹר עֲלֵיהֶם עוֹד
  choice: wird je wieder über sie hinwegziehen
  rationale: Die Formulierung erhält die Wiederaufnahme von עבר und gibt עֲלֵיהֶם bildhaft wieder. Im Zusammenhang bezeichnet sie das feindliche Durch- oder Überziehen des Landes und seiner Bewohner.
- source_word: נֹגֵשׂ
  choice: Unterdrücker
  rationale: Das Partizip bezeichnet jemanden, der andere antreibt, bedrängt, zu Leistungen zwingt oder Abgaben eintreibt. „Unterdrücker“ ist weit genug, um politische wie wirtschaftliche Bedrängung einzuschließen.
- source_word: כִּי עַתָּה
  choice: denn jetzt
  rationale: כִּי begründet die vorausgehende Zusage, während עַתָּה den gegenwärtigen, entscheidenden Zeitpunkt hervorhebt.
- source_word: רָאִיתִי בְעֵינָי
  choice: ich habe es mit eigenen Augen gesehen
  rationale: Die deutsche Wendung gibt die Betonung unmittelbarer persönlicher Wahrnehmung natürlich wieder. Das ergänzte „es“ ist grammatisch erforderlich, lässt den nicht ausdrücklich genannten Gegenstand des Sehens aber offen.
theological_decisions:
- issue: Bezug von „meinem Haus“
  choice: Die wörtliche Formulierung „meinem Haus“ bleibt im Haupttext erhalten und wird nicht auf den Tempel allein eingeengt.
  alternative: Gemeint sein könnte speziell der Tempel oder weiter gefasst Gottes Land und Volk.
  rationale: Der Ausdruck kann den Tempel anklingen lassen; der folgende Plural „sie“ weist jedoch auf die mit Gottes Haus verbundenen Menschen. Die offene Formulierung bewahrt diese Spannweite.
- issue: Gegenstand von Gottes Sehen
  choice: Der nicht ausdrücklich genannte Gegenstand bleibt auch in der Übersetzung unbestimmt.
  alternative: Man könnte erläuternd übersetzen, Gott habe „ihr Elend“ oder „das Geschehen“ gesehen.
  rationale: Der hebräische Text enthält kein ausdrückliches Objekt. Eine Konkretisierung würde eine mögliche Deutung in den Haupttext eintragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das militärische Schutzbild bleibt erkennbar, ohne den Satz unnötig technisch zu formulieren. Die Wiederholung des Bewegungsmotivs aus עבר wird durch „hin- und herzieht“ und „über sie hinwegziehen“ nachvollziehbar gemacht.
