  text: תֵּרֶ֨א אַשְׁקְל֜וֹן וְ/תִירָ֗א וְ/עַזָּה֙ וְ/תָחִ֣יל מְאֹ֔ד וְ/עֶקְר֖וֹן כִּֽי הֹבִ֣ישׁ מֶבָּטָ֑/הּ וְ/אָ֤בַד מֶ֨לֶךְ֙ מֵֽ/עַזָּ֔ה וְ/אַשְׁקְל֖וֹן לֹ֥א תֵשֵֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/005.yaml
  text: Ashkelon will see and fear[a]; Gaza also will writhe greatly, and Ekron, because her hope has been put to shame. A king will perish from Gaza[b], and Ashkelon will not be inhabited.
translation:
  language: de
  text: Aschkelon wird sehen und sich fürchten; Gaza wird sich heftig winden, und Ekron wird sich heftig winden, denn ihre Hoffnung ist zuschanden geworden.[a] Ein König wird aus Gaza verschwinden,[b] und Aschkelon wird nicht bewohnt sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »denn ihre Erwartung ist enttäuscht worden.«'
    reason: lexical_alternative
  - marker: b
    text: 'Oder idiomatischer: »Gaza wird seinen König verlieren.«'
    reason: idiomatic_alternative
lexical_decisions:
- source_word: תֵּרֶא ... וְתִירָא
  choice: wird es sehen und sich fürchten
  rationale: Die beiden Qal-Imperfekte beschreiben Aschkelons Reaktion auf das zuvor angekündigte Gericht. Das im Hebräischen unausgesprochene Objekt von »sehen« wird im Deutschen durch »es« idiomatisch aufgenommen.
- source_word: וְתָחִיל מְאֹד
  choice: wird sich heftig winden
  rationale: חיל/חול kann starkes Zittern, qualvolle Angst oder ein wehenartiges Sichwinden bezeichnen. »Sich heftig winden« bewahrt die körperliche Intensität des Ausdrucks.
- source_word: מֶבָּטָהּ
  choice: seine Hoffnung
  rationale: Das Substantiv bezeichnet die Erwartung beziehungsweise das, worauf jemand hoffnungsvoll blickt. Das Possessivpronomen bezieht sich im Deutschen auf den Ortsnamen Ekron.
- source_word: הֹבִישׁ
  choice: ist zuschanden geworden
  rationale: Der Hifil von בוש drückt hier aus, dass die Erwartung sich als trügerisch erweist und Schande bringt. Die Formulierung bewahrt sowohl den Scham- als auch den Enttäuschungsaspekt.
- source_word: וְאָבַד מֶלֶךְ מֵעַזָּה
  choice: Gaza wird seinen König verlieren
  rationale: Wörtlich geht ein König »aus Gaza« verloren beziehungsweise verschwindet von dort. Die deutsche Wendung gibt idiomatisch wieder, dass Gaza ohne König sein wird, ohne über dessen persönliches Schicksal hinauszugehen.
- source_word: לֹא תֵשֵׁב
  choice: wird nicht mehr bewohnt sein
  rationale: ישב kann bei einer Stadt bedeuten, bewohnt oder besiedelt zu sein. »Nicht mehr« bringt in natürlichem Deutsch den angekündigten Verlust des bisherigen Zustands zum Ausdruck.
- source_word: אַשְׁקְלוֹן / עַזָּה / עֶקְרוֹן
  choice: Aschkelon / Gaza / Ekron
  rationale: Die Ortsnamen werden in ihren im Deutschen geläufigen biblischen Formen wiedergegeben.
theological_decisions:
- issue: Schicksal des Königs von Gaza
  choice: Gaza wird seinen König verlieren
  alternative: Ein König wird aus Gaza verschwinden
  rationale: Das Hebräische sagt, dass מֶלֶךְ »aus Gaza« verloren geht oder verschwindet; es legt nicht eindeutig fest, ob der König stirbt, flieht oder abgesetzt wird. Die Übersetzung lässt diese Spannung offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischem Satzrhythmus. Die Städtenamen werden als handelnde Größen dargestellt; unnötige altertümliche Formulierungen werden vermieden.
