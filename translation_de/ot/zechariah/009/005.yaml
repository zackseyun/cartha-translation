review_pass:
  verdict: revise
  source_fidelity: 'Die Grundstruktur wird zutreffend wiedergegeben: Aschkelon reagiert mit Sehen und Furcht; Gaza und Ekron mit heftigem Sichwinden; Ekron erfährt die Beschämung bzw. Enttäuschung seiner Erwartung. Zwei kleine Präzisierungen sind sicher: Das ungenannte Objekt bei ראה muss im Deutschen nicht mit „es“ ergänzt werden, und מֶלֶךְ ist artikellos. „Ein König wird aus Gaza verschwinden“ wahrt daher besser die Unbestimmtheit und die beim Verb אָבַד verbleibende Offenheit über die Art seines Verschwindens als „Gaza wird seinen König verlieren“.'
  naturalness: Die Überarbeitung bleibt modernes, würdiges Standarddeutsch. Die Wiederaufnahme von „wird sich heftig winden“ bei Ekron macht die im Hebräischen elliptische Koordination im Deutschen klar und flüssig. „Nicht bewohnt sein“ gibt die Aussage ohne das zusätzlich zeitlich akzentuierende „mehr“ wieder.
  terminology: Die etablierten deutschen Ortsnamen Aschkelon, Gaza und Ekron sind angemessen. „Hoffnung“ für מַבָּט und „zuschanden geworden“ für die beschämte bzw. enttäuschte Erwartung bewahren den prophetischen und zugleich verständlichen Registerton.
  issues:
  - severity: low
    issue: Explizites Objekt „es“ bei „wird es sehen“
    rationale: Das Objekt von תֵּרֶא ist im Hebräischen nur kontextuell erschließbar. Deutsch kann die Aussage idiomatisch und näher am Wortlaut mit „wird sehen und sich fürchten“ stehen lassen.
  - severity: medium
    issue: „Gaza wird seinen König verlieren“ bestimmt den artikellosen König näher
    rationale: מֶלֶךְ steht ohne Artikel. Die possessive deutsche Formulierung ist als idiomatische Paraphrase möglich, macht den König jedoch zu Gazas bestimmtem König. „Ein König wird aus Gaza verschwinden“ erhält die Unbestimmtheit und vermeidet eine Festlegung auf Tod, Flucht oder Absetzung.
  - severity: low
    issue: „nicht mehr bewohnt“ fügt einen zeitlichen Akzent hinzu
    rationale: לֹא תֵשֵׁב sagt, dass Aschkelon nicht bewohnt sein wird. Die Aussage eines vorherigen Zustands ist naheliegend, aber nicht ausdrücklich markiert; ohne „mehr“ ist die Übersetzung enger am Text.
  revised_text: Aschkelon wird sehen und sich fürchten; Gaza wird sich heftig winden, und Ekron wird sich heftig winden, denn ihre Hoffnung ist zuschanden geworden.[a] Ein König wird aus Gaza verschwinden,[b] und Aschkelon wird nicht bewohnt sein.
