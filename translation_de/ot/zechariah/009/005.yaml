  to: Aschkelon wird sehen und sich fürchten; Gaza wird sich heftig winden, und Ekron wird sich heftig winden, denn ihre Hoffnung ist zuschanden geworden.[a] Ein König wird aus Gaza verschwinden,[b] und Aschkelon wird nicht bewohnt sein.
  rationale: Die Änderungen beseitigen unnötige Ergänzungen und erhalten die artikellose sowie hinsichtlich des Schicksals des Königs offene hebräische Formulierung. Die explizite Wiederholung des Verbs bei Ekron überträgt die hebräische Ellipse klar in natürliches Deutsch. Die Fußnoten sind an ihren jeweiligen Textstellen verankert und bieten echte, sinnvolle Alternativen.
