source:
  edition: WLC
  text: גַּם אַ֣תְּ בְּ/דַם בְּרִיתֵ֗/ךְ שִׁלַּ֤חְתִּי אֲסִירַ֨יִ/ךְ֙ מִ/בּ֔וֹר אֵ֥ין מַ֖יִם בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/011.yaml
  text: As for you also[a], because of the blood of your covenant[b], I have sent out your prisoners from the pit in which there is no water.
translation:
  language: de
  text: 'Auch du: Um des Blutes deines Bundes willen[a] habe ich deine Gefangenen aus der Grube[b] freigelassen, in der kein Wasser ist.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Durch das Blut deines Bundes“. Die hebräische Präposition kann hier sowohl den Grund als auch das Mittel der Freilassung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Zisterne“ oder „Kerker“. Das hebräische Wort kann eine Grube, eine leere Zisterne oder einen grubenartigen Haftort bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אַתְּ
  choice: Auch dich
  rationale: Bewahrt die additive und leicht emphatische Anknüpfung; das feminine Singularpronomen richtet sich im Kontext an die personifizierte Tochter Zion, was im Deutschen am Pronomen selbst nicht sichtbar ist.
- source_word: בְּדַם בְּרִיתֵךְ
  choice: Um des Blutes deines Bundes willen
  rationale: Gibt die wahrscheinlich kausale Bedeutung der Präposition ב idiomatisch und würdevoll wieder, ohne die ebenfalls mögliche instrumentale Lesart auszuschließen; diese wird in der Fußnote genannt.
- source_word: שִׁלַּחְתִּי
  choice: lasse ich … frei
  rationale: Das Piel von שלח bezeichnet hier im Zusammenhang mit Gefangenen deren Freilassung. Das hebräische Perfekt kann als prophetisches Perfekt eine sicher zugesagte Handlung ausdrücken; deutsches Präsens vermittelt diese Zusage natürlich.
- source_word: אֲסִירַיִךְ
  choice: deine Gefangenen
  rationale: Bezeichnet Gebundene oder Inhaftierte und passt unmittelbar zum Bild der Grube als Haftort.
- source_word: מִבּוֹר
  choice: aus der Grube
  rationale: בור kann Grube, Zisterne oder einen grubenartigen Kerker bezeichnen. „Grube“ wahrt die Bildbreite; die Wasserlosigkeit präzisiert das Bild.
- source_word: אֵין מַיִם בּוֹ
  choice: in der kein Wasser ist
  rationale: Gibt die hebräische Existenzverneinung klar wieder und bezieht sie eindeutig auf die Grube.
theological_decisions:
- issue: Bezug von „Blut deines Bundes“
  choice: Die Bundesformel bleibt ohne nähere Bestimmung erhalten.
  alternative: Ausdrückliche Identifikation mit dem am Sinai durch Blut bekräftigten Bund oder typologische Festlegung auf den neuen Bund.
  rationale: Der Wortlaut ruft die Vorstellung eines durch Blut bekräftigten Bundes auf, benennt aber den konkreten Bund nicht. Die Übersetzung bewahrt deshalb die theologische Spannung.
- issue: Zeitwert von שִׁלַּחְתִּי
  choice: Deutsches Präsens „lasse ich … frei“ als sichere prophetische Zusage.
  alternative: 'Vergangenheit beziehungsweise Perfekt: „habe ich … freigelassen“.'
  rationale: Das hebräische Perfekt kann eine bereits vollzogene Freilassung bezeichnen, im prophetischen Zusammenhang aber auch die Gewissheit der angekündigten Rettung hervorheben. Die Fußnote bewahrt beide Möglichkeiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die markierte Voranstellung „Auch dich“ erhält die emphatische Anrede. „Um … willen“ ist gehoben, aber allgemein verständlich und für die bündische Begründungsformel angemessen.
