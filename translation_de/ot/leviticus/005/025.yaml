source:
  edition: WLC
  text: וְ/אֶת אֲשָׁמ֥/וֹ יָבִ֖יא לַ/יהוָ֑ה אַ֣יִל תָּמִ֧ים מִן הַ/צֹּ֛אן בְּ/עֶרְכְּ/ךָ֥ לְ/אָשָׁ֖ם אֶל הַ/כֹּהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/025.yaml
  text: 'And he shall bring his guilt offering to Yahweh: a flawless ram from the flock[a], according to your valuation, as a guilt offering[b], to the priest.'
translation:
  language: de
  text: 'Sein Schuldopfer[a] soll er zu Jahwe bringen: einen makellosen Widder aus der Herde, nach deiner Schätzung, als Schuldopfer zum Priester.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann sowohl Schuld beziehungsweise Wiedergutmachung als auch das dafür dargebrachte Schuldopfer bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשָׁמוֹ
  choice: sein Schuldopfer
  rationale: אָשָׁם kann Schuld, Wiedergutmachung oder das dafür dargebrachte Opfer bezeichnen. Da hier unmittelbar ein Widder als Opfer bestimmt wird, ist „Schuldopfer“ im Haupttext die natürliche kultische Bezeichnung; die weitere Bedeutungsbreite bleibt in einer Fußnote sichtbar.
- source_word: יָבִיא
  choice: soll er bringen
  rationale: Der Hifil-Imperfekt hat in dieser Rechtsbestimmung vorschreibende Kraft. „Soll er bringen“ gibt diese verbindlich und in natürlichem modernem Deutsch wieder.
- source_word: לַיהוָה
  choice: zu Jahwe
  rationale: Die Präposition bezeichnet den Empfänger beziehungsweise die Bestimmung der Gabe; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: אַיִל תָּמִים
  choice: einen makellosen Widder
  rationale: אַיִל bezeichnet präzise einen Widder; תָּמִים meint im Opferzusammenhang ein Tier ohne disqualifizierenden Fehler. „Makellos“ ist knapp, verständlich und sachgerecht.
- source_word: מִן הַצֹּאן
  choice: aus der Herde
  rationale: צֹאן bezeichnet Kleinvieh, insbesondere Schafe und Ziegen. Durch „Widder“ ist die Tierart bereits eingegrenzt, sodass „aus der Herde“ die kollektive Herkunft idiomatisch wiedergibt.
- source_word: בְּעֶרְכְּךָ
  choice: nach deiner Schätzung
  rationale: Die Wendung bewahrt sowohl den Gedanken einer amtlichen Wertfestsetzung als auch das Suffix der zweiten Person Singular.
- source_word: לְאָשָׁם
  choice: als Schuldopfer
  rationale: Hier kennzeichnet אָשָׁם die kultische Funktion beziehungsweise Opferkategorie des Widders.
- source_word: אֶל הַכֹּהֵן
  choice: zum Priester
  rationale: Die Richtungsangabe bezeichnet den Priester als denjenigen, dem das Opfertier zur Durchführung des Rituals gebracht wird.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. „Jahwe“ bewahrt diesen als Eigennamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von אָשָׁם bei seinem zweimaligen Auftreten
  choice: Beide Vorkommen werden im Haupttext mit „Schuldopfer“ wiedergegeben; beim ersten wird die Bedeutungsbreite in einer Fußnote erläutert.
  alternative: Das erste Vorkommen als „Wiedergutmachung“ oder „Wiedergutmachungsopfer“, das zweite als „Schuldopfer“ wiedergeben.
  rationale: Beide Vorkommen beziehen sich syntaktisch auf das konkret darzubringende Opfer. Die einheitliche Wiedergabe vermeidet eine künstliche Bedeutungsdifferenzierung, während die Fußnote den in אָשָׁם enthaltenen Gedanken von Schuld und Wiedergutmachung offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rechtlich-kultischem Ton. Die Satzstellung folgt dem hebräischen Fokus auf „sein Schuldopfer“, bleibt aber gut lesbar. „Makellos“ ersetzt die traditionellere Formulierung „ohne Fehl“ beziehungsweise „ohne Makel“.
