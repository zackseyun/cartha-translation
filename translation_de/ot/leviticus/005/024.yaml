base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/024.yaml
  text: or anything about which he swore falsely—he shall repay it in full[a], and shall add a fifth to it. He shall give it to the one to whom it belongs on the day of his guilt offering.
translation:
  language: de
  text: 'oder irgendetwas, worüber er falsch geschworen hat: Er soll es vollständig zurückerstatten und ein Fünftel davon hinzufügen. Er soll es demjenigen, dem es gehört, am Tag seines Schuldopfers[a] geben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »am Tag seiner Schuld«. Das hebräische Wort kann sowohl die Schuld selbst als auch das Schuldopfer bezeichnen; der Haupttext folgt hier dem Opferzusammenhang.'
    reason: alternative_reading
lexical_decisions:
- source_word: א֠וֹ מִכֹּל אֲשֶׁר
  choice: oder irgendetwas, worüber
  rationale: Die Formulierung setzt die Aufzählung des vorangehenden Verses fort und wahrt zugleich den umfassenden Charakter von כֹּל אֲשֶׁר.
- source_word: יִשָּׁבַע עָלָיו לַשֶּׁקֶר
  choice: er falsch geschworen hat
  rationale: Die Wendung bezeichnet einen falschen Eid in Bezug auf die zuvor genannte Sache; im Deutschen ist diese knappe Form natürlich und eindeutig.
- source_word: וְשִׁלַּם אֹתוֹ בְּרֹאשׁוֹ
  choice: Er soll es vollständig zurückerstatten
  rationale: Die Rechtsformel mit בְּרֹאשׁוֹ meint die ungekürzte Hauptsumme beziehungsweise den vollen ursprünglichen Wert.
- source_word: וַחֲמִשִׁתָיו יֹסֵף עָלָיו
  choice: und ein Fünftel hinzufügen
  rationale: Die gesetzliche Wiedergutmachungsformel verlangt zusätzlich ein Fünftel des ursprünglichen Wertes.
- source_word: לַאֲשֶׁר הוּא לוֹ
  choice: demjenigen, dem es gehört
  rationale: Dies gibt die hebräische Besitzformel verständlich und mit ihrer rechtlichen Aussage wieder.
- source_word: יִתְּנֶנּוּ
  choice: soll es ... geben
  rationale: נתן bedeutet gewöhnlich „geben“ und bezeichnet hier die Übergabe der gesamten Wiedergutmachungsleistung.
- source_word: בְּיוֹם אַשְׁמָתוֹ
  choice: am Tag seines Schuldopfers
  rationale: Im unmittelbaren kultisch-rechtlichen Zusammenhang kann אַשְׁמָה/אָשָׁם das mit der Schuld verbundene Schuldopfer bezeichnen; die andere mögliche Bedeutung wird in der Fußnote bewahrt.
theological_decisions:
- issue: Bedeutung von אַשְׁמָתוֹ im Opferkontext
  choice: seines Schuldopfers
  alternative: seiner Schuld
  rationale: Der Ausdruck kann sowohl den Schuldzustand als auch das dazugehörige Schuldopfer bezeichnen. Der Zusammenhang in Levitikus 5 verbindet Wiedergutmachung und Opferhandlung; deshalb steht die kultische Bedeutung im Haupttext, ohne die echte lexikalische Mehrdeutigkeit zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rechtliche Anweisung bleibt präzise, ohne schwer verständliche Fachsprache; die Satzstruktur folgt dem hebräischen Gedankengang in natürlicher deutscher Form.
