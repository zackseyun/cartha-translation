lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: redete
  rationale: Das Waw-Konsekutiv führt einen neuen göttlichen Sprechakt ein. „redete“ entspricht der wiederkehrenden feierlichen Redeformel und klingt im heutigen Standarddeutsch würdig, ohne altertümlich zu sein.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als Eigenname „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition bezeichnet hier den Adressaten des Redens; „zu“ ist in der deutschen Verbindung „zu jemandem reden“ idiomatisch.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: „Mose“ ist die etablierte deutsche Form des hebräischen Personennamens.
- source_word: לֵאמֹר
  choice: und sprach
  rationale: Der Infinitiv leitet formelhaft den folgenden Wortlaut ein. „und sprach“ gibt diese Funktion im Deutschen natürlich und in der traditionellen, weiterhin verständlichen biblischen Redeformel wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ bewahrt ihn als persönlichen Gottesnamen, statt ihn stillschweigend durch den Titel „der HERR“ zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe, wiederkehrende göttliche Redeformel bleibt erhalten; der Doppelakzent von וַיְדַבֵּר und לֵאמֹר wird idiomatisch mit „redete … und sprach“ wiedergegeben.
