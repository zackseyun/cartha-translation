source:
  edition: WLC
  text: וְ/אֵ֣ת אֲשֶׁר֩ חָטָ֨א מִן הַ/קֹּ֜דֶשׁ יְשַׁלֵּ֗ם וְ/אֶת חֲמִֽישִׁת/וֹ֙ יוֹסֵ֣ף עָלָ֔י/ו וְ/נָתַ֥ן אֹת֖/וֹ לַ/כֹּהֵ֑ן וְ/הַ/כֹּהֵ֗ן יְכַפֵּ֥ר עָלָ֛י/ו בְּ/אֵ֥יל הָ/אָשָׁ֖ם וְ/נִסְלַ֥ח לֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/016.yaml
  text: He shall make restitution for what he sinned against from the holy thing[a], and he shall add a fifth to it and give it to the priest. Then the priest shall make atonement for him with the ram of the guilt offering[b], and he shall be forgiven.
translation:
  language: de
  text: Was er an dem Heiligen verfehlt hat, soll er erstatten[a]. Dazu soll er ein Fünftel hinzufügen und den Gesamtbetrag dem Priester geben. Der Priester soll mit dem Widder des Schuldopfers[b] Sühne für ihn erwirken, und ihm wird vergeben werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die knappe hebräische Wendung bezeichnet eine Verfehlung im Zusammenhang mit dem Heiligen, insbesondere heiligen Gütern oder Abgaben. Sie lässt die genaue Art des Schadens offen; möglich ist etwa, dass etwas zu Unrecht vorenthalten wurde.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »mit dem Widder als Schuldopfer«; אָשָׁם kann auch als »Wiedergutmachungsopfer« wiedergegeben werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: חָטָא מִן הַקֹּדֶשׁ
  choice: von dem Heiligen zu Unrecht genommen oder zurückbehalten hat
  rationale: Die knappe hebräische Wendung bezeichnet eine Verfehlung, die heilige Güter oder Abgaben betrifft. Die deutsche Formulierung macht den für die geforderte Erstattung vorausgesetzten Vermögensschaden verständlich, ohne הַקֹּדֶשׁ enger als »Heiligtum« festzulegen.
- source_word: יְשַׁלֵּם
  choice: soll er erstatten
  rationale: Im rechtlich-kultischen Zusammenhang bezeichnet die Piel-Form die vollständige Wiedergutmachung beziehungsweise Rückzahlung.
- source_word: חֲמִישִׁתוֹ יוֹסֵף עָלָיו
  choice: Dazu soll er ein Fünftel hinzufügen
  rationale: Die Wendung bezeichnet einen Zuschlag von einem Fünftel auf den zu erstattenden Grundbetrag. »Dazu« gibt den additiven Sinn idiomatisch wieder.
- source_word: לַכֹּהֵן
  choice: dem Priester
  rationale: Direkte und natürliche Wiedergabe des Empfängers der Erstattung samt Zuschlag.
- source_word: יְכַפֵּר עָלָיו
  choice: Sühne für ihn erwirken
  rationale: Die Formulierung gibt die kultische Funktion des priesterlichen Handelns verständlich wieder, ohne den Vorgang weiter dogmatisch zu bestimmen.
- source_word: בְּאֵיל הָאָשָׁם
  choice: mit dem Widder des Schuldopfers
  rationale: Die Konstruktion bezeichnet den Widder, der als אָשָׁם dargebracht wird. »Schuldopfer« ist der geläufige deutsche kultische Fachbegriff; eine Fußnote nennt die ebenfalls mögliche Betonung der Wiedergutmachung.
- source_word: וְנִסְלַח לוֹ
  choice: und ihm wird vergeben werden
  rationale: Die passive Form des Hebräischen und die Zusage der Vergebung bleiben erhalten; der Handelnde wird wie im Ausgangstext nicht ausdrücklich genannt.
theological_decisions:
- issue: Bedeutung des Opferbegriffs אָשָׁם
  choice: Schuldopfer
  alternative: Wiedergutmachungsopfer
  rationale: אָשָׁם verbindet Schuld mit Wiedergutmachung. »Schuldopfer« ist im Deutschen als Bezeichnung dieser Opferart etabliert; die Alternative wird dokumentiert, damit der im Kontext deutliche Wiedergutmachungsaspekt nicht verloren geht.
- issue: Subjekt der Vergebung
  choice: wird nicht ausdrücklich genannt
  alternative: Gott wird ihm vergeben
  rationale: Der hebräische Passivsatz nennt Gott nicht ausdrücklich. Die Übersetzung bewahrt diese Form und vermeidet eine zwar naheliegende, aber ergänzende Explizierung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Rechtssprache. »Das Heilige« bleibt als weiter Sammelbegriff erhalten und wird nicht auf das Heiligtum eingeengt. Die Wiederholung von »soll« entspricht dem verbindlichen Charakter der Rechtsbestimmung; der abschließende Passivsatz bewahrt die feierliche Verheißung des Hebräischen.
