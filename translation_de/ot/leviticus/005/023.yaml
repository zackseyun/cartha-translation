base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/023.yaml
  text: And it shall be[a], when he sins and becomes guilty, that he shall restore what he took by robbery, or what he extorted, or the deposit that was entrusted to him, or the lost thing that he found[c][b],
translation:
  language: de
  text: Wenn er sündigt und schuldig wird,[a] muss er zurückgeben, was er geraubt hat, oder was er sich durch Unterdrückung angeeignet hat,[b] oder das ihm anvertraute Gut oder verlorenes Gut, das er gefunden hat.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Falls er sündigt und Schuld auf sich lädt“. Die hebräische Rechtsformel kann einen erwarteten Fall oder eine Bedingung einleiten; „schuldig wird“ bezeichnet hier vor allem das Eintreten von Schuld beziehungsweise Haftung.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „was er erpresst hat“, „was er durch Bedrückung erlangt hat“ oder „was er betrügerisch vorenthalten hat“. Der hebräische Ausdruck umfasst verschiedene Formen ausbeuterischer oder betrügerischer Aneignung.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „das Verlorene, das er gefunden hat“. Gemeint ist verlorenes fremdes Eigentum.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Wenn … also
  rationale: Die hebräische Rechtsformel leitet den eintretenden Fall ein. Die deutsche Fassung gibt ihren Folgerungscharakter natürlich wieder, ohne das ebenso mögliche konditionale Verständnis auszuschließen.
- source_word: יֶחֱטָא וְאָשֵׁם
  choice: er sündigt und schuldig wird
  rationale: „Sündigt“ bewahrt die moralisch-bundestheologische Aussage von חטא; „schuldig wird“ gibt die rechtliche Haftung von אשם wieder, ohne es auf ein subjektives Schuldbewusstsein zu verengen.
- source_word: וְהֵשִׁיב
  choice: muss er zurückgeben
  rationale: Im rechtlichen Zusammenhang drückt das Verb verpflichtende Rückerstattung aus. „Muss“ vermittelt diese Rechtsverbindlichkeit in gegenwärtigem Standarddeutsch.
- source_word: הַגְּזֵלָה אֲשֶׁר גָּזָל
  choice: was er geraubt hat
  rationale: Die Formulierung wahrt den Gedanken widerrechtlicher Wegnahme und gibt die hebräische figura etymologica knapp und idiomatisch wieder.
- source_word: הָעֹשֶׁק אֲשֶׁר עָשָׁק
  choice: was er sich durch Unterdrückung angeeignet hat
  rationale: Das Wortpaar kann bedrückende Ausbeutung, betrügerische Vorenthaltung oder erpresserische Aneignung bezeichnen. Die Fassung bewahrt die Breite und passt zum Eigentumskontext.
- source_word: הַפִּקָּדוֹן אֲשֶׁר הָפְקַד אִתּוֹ
  choice: das ihm anvertraute Gut
  rationale: Gemeint ist Eigentum, das seiner Obhut übergeben wurde. „Anvertrautes Gut“ ist präzise, verständlich und rechtlich passend.
- source_word: הָאֲבֵדָה אֲשֶׁר מָצָא
  choice: verlorenes Gut, das er gefunden hat
  rationale: Die Wendung bezeichnet gefundenes fremdes Eigentum. „Gut“ hält den sachrechtlichen Bezug fest, ohne die Art des Gegenstands festzulegen.
theological_decisions:
- issue: Bedeutung von וְאָשֵׁם
  choice: schuldig wird
  alternative: seine Schuld erkennt
  rationale: Der unmittelbare Wortlaut bezeichnet Schuld beziehungsweise Haftung; eine Beschränkung auf das subjektive Erkennen der Schuld wäre eine stärkere Auslegung, als der Ausdruck für sich verlangt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer rechtlicher Verpflichtung. Die Satzstruktur ist gegenüber der hebräischen Reihung leicht geglättet; die vier Kategorien der Rückerstattung und die Mehrdeutigkeit der Rechtsformel bleiben erhalten.
