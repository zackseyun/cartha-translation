  terminology: „Jahwe“, „Untreue“, „anvertrautes Gut“ und „Pfand“ sind passend. „Unterdrückt“ gibt עָשַׁק breiter und näher am hebräischen Wortfeld wieder als „übervorteilt“, ohne die mögliche wirtschaftliche Ausbeutung auf bloße Benachteiligung zu verengen. Die Fußnote wahrt die umstrittene Bedeutung von תְּשׂוּמֶת יָד.
