  to: Wenn jemand sündigt und Untreue gegen Jahwe begeht, indem er seinen Nächsten hinsichtlich eines anvertrauten Gutes, eines Pfandes[a] oder eines Raubes täuscht oder seinen Nächsten unterdrückt,
