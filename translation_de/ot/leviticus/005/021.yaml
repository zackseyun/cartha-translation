source:
  edition: WLC
  text: נֶ֚פֶשׁ כִּ֣י תֶחֱטָ֔א וּ/מָעֲלָ֥ה מַ֖עַל בַּ/יהוָ֑ה וְ/כִחֵ֨שׁ בַּ/עֲמִית֜/וֹ בְּ/פִקָּד֗וֹן אֽוֹ בִ/תְשׂ֤וּמֶת יָד֙ א֣וֹ בְ/גָזֵ֔ל א֖וֹ עָשַׁ֥ק אֶת עֲמִיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/021.yaml
  text: If a person sins and commits a breach of faith against Yahweh by deceiving his neighbor about a security entrusted to him[a], or a pledge, or through robbery, or if he has oppressed his neighbor,
translation:
  language: de
  text: Wenn jemand sündigt und Untreue gegen Jahwe begeht, indem er seinen Nächsten hinsichtlich eines anvertrauten Gutes, eines Pfandes[a] oder eines Raubes täuscht oder seinen Nächsten unterdrückt,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „etwas, das in die Hand gelegt wurde“; die Bedeutung der hebräischen Wendung ist unsicher und kann ein Pfand oder einen übergebenen Gegenstand bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: jemand
  rationale: Im Rechtstext bezeichnet נֶפֶשׁ eine einzelne Person; „jemand“ ist im Deutschen für einen kasuistischen Bedingungssatz natürlich.
- source_word: כִּי תֶחֱטָא
  choice: Wenn ... sündigt
  rationale: כִּי mit Imperfekt leitet hier einen rechtlichen Bedingungsfall ein.
- source_word: וּמָעֲלָה מַעַל
  choice: und Untreue ... begeht
  rationale: Die figura etymologica betont treuloses Handeln; „Untreue begehen“ bewahrt den relationalen und rechtlichen Gehalt.
- source_word: בַּיהוָה
  choice: gegen Jahwe
  rationale: Die Präposition bezeichnet hier den, gegen den sich die Untreue richtet; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: וְכִחֵשׁ
  choice: indem er ... täuscht
  rationale: Das Verb kann leugnen, falsch handeln oder täuschen bedeuten. „Täuscht“ passt zur nachfolgenden Aufzählung vermögensrechtlicher Fälle.
- source_word: בַּעֲמִיתוֹ
  choice: seinen Nächsten
  rationale: עָמִית bezeichnet einen Mitmenschen beziehungsweise ein Mitglied derselben Gemeinschaft; „Nächster“ ist verständlich und bibelsprachlich angemessen.
- source_word: בְּפִקָּדוֹן
  choice: wegen eines ihm anvertrauten Gutes
  rationale: Das Wort bezeichnet zur Verwahrung anvertrautes Eigentum; die Formulierung macht den rechtlichen Sachverhalt im Deutschen klar.
- source_word: בִתְשׂוּמֶת יָד
  choice: eines Pfandes
  rationale: Die schwierige Wendung, wörtlich etwa „Handhinterlegung“, bezeichnet wahrscheinlich etwas Übergebenes oder als Sicherheit Hinterlegtes; „Pfand“ ist knapp und sachgerecht.
- source_word: בְגָזֵל
  choice: eines Raubes
  rationale: Das Substantiv bezeichnet Raub oder gewaltsam genommenes Gut. In der mit בְּ gebildeten Reihe lässt es sich natürlich als Gegenstand des Täuschens verstehen.
- source_word: עָשַׁק אֶת עֲמִיתוֹ
  choice: seinen Nächsten übervorteilt
  rationale: עָשַׁק umfasst Unterdrückung, Ausbeutung, Erpressung oder betrügerische Benachteiligung; im vermögensrechtlichen Zusammenhang trifft „übervorteilt“ den Sinn, ohne ihn auf eine einzelne Methode zu verengen.
theological_decisions:
- issue: Ein Unrecht am Mitmenschen wird zugleich als Untreue gegenüber Gott bezeichnet.
  choice: Untreue gegen Jahwe
  alternative: Untreue in Bezug auf Jahwe
  rationale: Das Hebräische stellt ausdrücklich die vertikale Dimension des sozialen und wirtschaftlichen Unrechts heraus; „gegen“ bewahrt diese Aussage klar.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Umschrift „Jahwe“ gibt den Eigennamen als solchen wieder und entspricht der vorgelegten konsultativen Textschicht.
translation_notes:
  register: Moderner, würdiger deutscher Rechtssatz mit verständlicher Syntax. Der Vers bleibt als unvollständiger Bedingungssatz offen, da die rechtliche Folgerung erst in den folgenden Versen erscheint. Das generische Maskulinum folgt der singularischen Form und der kasuistischen Redeweise des Ausgangstextes.
