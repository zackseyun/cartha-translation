  text: וֶ/הֱבִיאָ/הּ֮ אֶל הַ/כֹּהֵן֒ וְ/קָמַ֣ץ הַ/כֹּהֵ֣ן מִ֠מֶּ/נָּה מְל֨וֹא קֻמְצ֜/וֹ אֶת אַזְכָּרָתָ/ה֙ וְ/הִקְטִ֣יר הַ/מִּזְבֵּ֔חָ/ה עַ֖ל אִשֵּׁ֣י יְהוָ֑ה חַטָּ֖את הִֽוא־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/012.yaml
  text: Then he shall bring it to the priest[a], and the priest shall take from it a handful as its memorial portion and burn it on the altar, in addition to the food offerings of Yahweh[b]. It is a sin offering.
translation:
  language: de
  text: Dann soll er es zum Priester bringen, und der Priester soll davon eine Handvoll als Gedenkanteil nehmen und sie auf dem Altar auf den Feueropfern für Jahwe[a] in Rauch aufgehen lassen. Es ist ein Sündopfer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zusätzlich zu den Feueropfern für Jahwe“. Das mit „auf“ wiedergegebene hebräische Wort kann hier auch die Bedeutung „zusammen mit“ beziehungsweise „zusätzlich zu“ haben.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „Reinigungsopfer“. Der hebräische Ausdruck bezeichnet ein Opfer, das mit Sünde befasst ist und zugleich der Reinigung dient.'
    reason: theological_tension
lexical_decisions:
- source_word: וֶהֱבִיאָהּ
  choice: Dann soll er es bringen
  rationale: Das Hifil von בוא mit femininem Objektsuffix bezeichnet das Herbeibringen der im vorausgehenden Zusammenhang genannten Opfergabe; „Dann“ gibt die Abfolge natürlich wieder.
- source_word: וְקָמַץ ... מְלֹא קֻמְצוֹ
  choice: soll ... eine Handvoll nehmen
  rationale: קמץ bezeichnet hier den kultischen Vorgang, mit der Hand die vorgesehene Menge zu entnehmen; „eine Handvoll“ ist die natürliche deutsche Maßangabe.
- source_word: אֶת אַזְכָּרָתָהּ
  choice: als den zugehörigen Gedenkanteil
  rationale: אַזְכָּרָה ist der technische Ausdruck für den Anteil, der stellvertretend für die ganze Gabe auf dem Altar verbrannt wird. „Gedenkanteil“ bewahrt den Erinnerungsbezug, ohne ihn näher auszudeuten.
- source_word: וְהִקְטִיר
  choice: in Rauch aufgehen lassen
  rationale: Das Hifil von קטר bezeichnet im Opferkontext das Verbrennen beziehungsweise Aufsteigenlassen als Rauch auf dem Altar und ist präziser als das allgemeine „verbrennen“.
- source_word: עַל אִשֵּׁי יְהוָה
  choice: über den Feueropfern für Jahwe
  rationale: עַל wird räumlich als „über/auf“ bewahrt; אִשִּׁים bezeichnet Feueropfer beziehungsweise durch Feuer dargebrachte Opfer. Die Formulierung vermeidet die unsichere Deutung als bloße Zugabe.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: חַטָּאת הִוא
  choice: Es ist ein Sündopfer
  rationale: Im kultischen Zusammenhang bezeichnet חַטָּאת die Opferart. „Sündopfer“ ist die verständliche traditionelle Bezeichnung; die funktionale Alternative wird in einer Fußnote festgehalten.
theological_decisions:
- issue: Bedeutung von חַטָּאת im priesterlichen Opferrecht
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: Der Ausdruck klassifiziert hier die Opfergabe, kann aber zugleich ihre reinigende Funktion hervorheben. Der Haupttext verwendet den geläufigen Begriff, während die Fußnote die exegetisch bedeutsame Alternative bewahrt.
- issue: Verhältnis des Gedenkanteils zu den אִשֵּׁי יְהוָה
  choice: über den Feueropfern für Jahwe
  alternative: zusätzlich zu den Feueropfern für Jahwe
  rationale: Das hebräische עַל kann räumlich „auf/über“ oder kontextuell „zusammen mit/zusätzlich zu“ verstanden werden. Die räumlich nähere Wiedergabe bleibt im Haupttext; die Alternative wird dokumentiert.
translation_notes:
  register: Moderne, würdige Standardsprache mit verständlicher kultischer Terminologie. „In Rauch aufgehen lassen“ bildet den Opferterminus präzise ab; „Gedenkanteil“ erhält den technischen Charakter. Alle Fußnotenmarker stehen unmittelbar an den betreffenden Ausdrücken.
