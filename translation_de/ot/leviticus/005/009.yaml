  text: וְ/הִזָּ֞ה מִ/דַּ֤ם הַ/חַטָּאת֙ עַל קִ֣יר הַ/מִּזְבֵּ֔חַ וְ/הַ/נִּשְׁאָ֣ר בַּ/דָּ֔ם יִמָּצֵ֖ה אֶל יְס֣וֹד הַ/מִּזְבֵּ֑חַ חַטָּ֖את הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/009.yaml
  text: And he shall sprinkle some of the blood of the sin offering on the side of the altar[a], and the rest of the blood shall be drained out at the base of the altar; it is a sin offering.
translation:
  language: de
  text: Und er soll etwas von dem Blut des Sündopfers[a] an die Wand des Altars sprengen. Was von dem Blut übrig bleibt, soll am Fuß des Altars ausgedrückt werden. Es ist ein Sündopfer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Reinigungsopfer“, auch beim zweiten Vorkommen von „Sündopfer“. Das hebräische Wort חַטָּאת kann das Opfer für Sünde bezeichnen und dabei dessen reinigende Funktion hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזָּה
  choice: Und er soll … sprengen
  rationale: Das Hifil von נזה bezeichnet im Opferkontext das rituelle Anbringen von Blut durch Sprengen. „Sprengen“ ist im Deutschen präzise und als kultischer Ausdruck verständlich.
- source_word: מִדַּם
  choice: etwas von dem Blut
  rationale: 'מִן ist hier partitiv: Nur ein Teil des Blutes wird an dieser Stelle verwendet. Die Formulierung bildet dies natürlich und ausdrücklich ab.'
- source_word: הַחַטָּאת
  choice: des Sündopfers
  rationale: חַטָּאת bezeichnet hier nicht abstrakt die Sünde, sondern das dafür dargebrachte Opfer. „Sündopfer“ ist die geläufige deutsche Bezeichnung; die mögliche funktionale Wiedergabe „Reinigungsopfer“ wird in der Fußnote bewahrt.
- source_word: עַל קִיר הַמִּזְבֵּחַ
  choice: an die Seitenwand des Altars
  rationale: קִיר bedeutet wörtlich „Wand“. „Seitenwand“ bezeichnet beim Altar die konkrete senkrechte Fläche natürlicher als das bloße „Wand“ und bleibt dem Bild des Ausgangstextes nahe.
- source_word: וְהַנִּשְׁאָר בַּדָּם
  choice: Was von dem Blut übrig bleibt
  rationale: Das substantivisch gebrauchte Nifal-Partizip von שׁאר bezeichnet den verbleibenden Rest. Der deutsche Relativsatz gibt diese Form klar und idiomatisch wieder.
- source_word: יִמָּצֵה
  choice: soll … ausgedrückt werden
  rationale: Das Nifal von מצה bezeichnet hier das vollständige Herausdrücken beziehungsweise Auspressen des restlichen Blutes aus dem Vogel. „Ausgedrückt“ bewahrt diese spezifische Handlung besser als das allgemeinere „ausgegossen“.
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: am Fuß des Altars
  rationale: יְסוֹד bezeichnet Fundament oder Sockel. „Am Fuß des Altars“ ist im Deutschen anschaulich und gibt den Zielort der Handlung idiomatisch wieder.
- source_word: חַטָּאת הוּא
  choice: Es ist ein Sündopfer
  rationale: Der Satz ordnet das Opfer ausdrücklich der Kategorie חַטָּאת zu. Die Wiederholung von „Sündopfer“ erhält diese kultische Klassifikation.
theological_decisions:
- issue: Wiedergabe von חַטָּאת in der Opfergesetzgebung
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: Der hebräische Ausdruck verbindet das Opfer mit Sünde, kann jedoch zugleich seine reinigende Funktion hervorheben. „Sündopfer“ bleibt als etablierte und sachlich mögliche Bezeichnung im Haupttext; die bedeutende alternative Akzentuierung wird in der Fußnote sichtbar gehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer kultischer Terminologie. Die Sätze wurden gegenüber der langen hebräischen Satzkette moderat gegliedert. Der konkrete Ausdruck „Seitenwand“ und das spezifische Verb „ausgedrückt“ bewahren die rituelle Handlung, ohne unnötig altertümlich zu wirken.
