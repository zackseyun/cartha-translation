lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: sprach
  rationale: Die Form eröffnet einen neuen Redeabschnitt; „sprach“ gibt דבר in der feierlichen göttlichen Redeeinleitung prägnant wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶל מֹשֶׁה
  choice: zu Mose
  rationale: Die Präposition bezeichnet den Adressaten; „zu Mose“ ist die natürliche deutsche Fügung bei „sprechen“.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Die hebräische Redeeinleitungsformel wird im heutigen Deutsch idiomatisch durch einen Doppelpunkt wiedergegeben, da die direkte Rede im folgenden Vers beginnt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet das Tetragramm als persönlichen Gottesnamen. „Jahwe“ bewahrt diese Funktion, ohne einen bloßen Titel einzusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe hebräische Redeeinleitungsformel bleibt erkennbar; לֵאמֹר wird statt des im Deutschen schwerfälligen „und sagte“ durch den Doppelpunkt ausgedrückt.
