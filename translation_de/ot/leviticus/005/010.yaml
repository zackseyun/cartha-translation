- from: Und den zweiten Vogel soll er nach der Vorschrift als Brandopfer darbringen[a]. So soll der Priester für ihn Sühne erwirken wegen der Sünde, die er begangen hat; dann wird ihm vergeben werden.[b]
  to: Und den zweiten Vogel soll er nach der Vorschrift als Brandopfer darbringen[a]. Der Priester wird für ihn wegen der Sünde, die er begangen hat, Sühne erwirken; ihm wird vergeben.[b]
  rationale: Die Revision glättet ausschließlich die deutsche Wiedergabe der passivischen Vergebungsformel und entfernt das nicht erforderliche „dann“. Dadurch bleibt der implizite göttliche Handelnde ebenso ungenannt wie im Hebräischen, während der Satz im modernen Standarddeutsch klarer und natürlicher wird.
