  terminology: „Brandopfer“ und „Sühne erwirken“ sind sachgerecht und vermeiden eine dogmatische Präzisierung über den priesterlich-kultischen Kontext hinaus. „Wegen der Sünde, die er begangen hat“ ist eine natürliche Wiedergabe von מֵחַטָּאתוֹ אֲשֶׁר חָטָא.
