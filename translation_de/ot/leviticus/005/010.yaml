  text: וְ/אֶת הַ/שֵּׁנִ֛י יַעֲשֶׂ֥ה עֹלָ֖ה כַּ/מִּשְׁפָּ֑ט וְ/כִפֶּ֨ר עָלָ֧י/ו הַ/כֹּהֵ֛ן מֵ/חַטָּאת֥/וֹ אֲשֶׁר חָטָ֖א וְ/נִסְלַ֥ח לֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/010.yaml
  text: And he shall prepare the second as a burnt offering according to the ordinance[a], and the priest shall make atonement for him for the sin that he committed[b], and he shall be forgiven.
translation:
  language: de
  text: Und den zweiten Vogel soll er nach der Vorschrift als Brandopfer darbringen[a]. Der Priester wird für ihn wegen der Sünde, die er begangen hat, Sühne erwirken; ihm wird vergeben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach dem vorgeschriebenen Verfahren“.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „und ihm wird vergeben“; die hebräische Passivform lässt unausgesprochen, dass Gott vergibt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֵּׁנִי
  choice: den zweiten Vogel
  rationale: Das Ordinalzahlwort verweist auf den zweiten der beiden im vorigen Vers genannten Vögel. „Vogel“ wird zur natürlichen deutschen Verständlichkeit aus dem Kontext ergänzt.
- source_word: יַעֲשֶׂה עֹלָה
  choice: als Brandopfer darbringen
  rationale: עשה ist allgemein „tun/machen“, bezeichnet hier aber die rituelle Ausführung des Opfers. „Darbringen“ ist im Deutschen idiomatisch und lässt die genaue Einzelhandlung offen; עֹלָה wird mit dem etablierten kultischen Ausdruck „Brandopfer“ wiedergegeben.
- source_word: כַּמִּשְׁפָּט
  choice: nach der Vorschrift
  rationale: מִשְׁפָּט bezeichnet hier die festgelegte kultische Verfahrensweise. „Nach der Vorschrift“ ist präzise, würdig und für heutige Leser verständlich.
- source_word: וְכִפֶּר עָלָיו
  choice: für ihn Sühne erwirken
  rationale: Die Wendung bewahrt den kultisch-theologischen Sinn von כפר und gibt עָלָיו idiomatisch als Handeln zugunsten der betreffenden Person wieder.
- source_word: מֵחַטָּאתוֹ אֲשֶׁר חָטָא
  choice: wegen der Sünde, die er begangen hat
  rationale: Die Formulierung bezeichnet die begangene Sünde als Anlass beziehungsweise Gegenstand der Sühnung. Das deutsche Perfekt gibt die vorangegangene Handlung natürlich wieder.
- source_word: וְנִסְלַח לוֹ
  choice: dann wird ihm vergeben werden
  rationale: Die passive Formulierung lässt wie das Hebräische den göttlichen Urheber der Vergebung unausgesprochen. „Dann“ bringt den im Satzgefüge erkennbaren Folgecharakter idiomatisch zum Ausdruck.
theological_decisions:
- issue: Priesterliche Sühnungssprache ohne spätere dogmatische Verengung
  choice: für ihn Sühne erwirken
  alternative: ihn reinigen; ihm Vergebung verschaffen
  rationale: כפר bezeichnet hier die priesterliche, opferbezogene Sühnung. Die gewählte Formulierung bewahrt diese kultische Kategorie, ohne sie auf bloße Reinigung oder bereits auf das Ergebnis der Vergebung zu reduzieren.
- issue: Passivische Vergebungsformel mit unausgesprochenem göttlichem Handelnden
  choice: ihm wird vergeben werden
  alternative: der HERR wird ihm vergeben
  rationale: Das Hebräische nennt den Vergebenden nicht ausdrücklich. Die passive deutsche Form wahrt diese ehrfürchtige Zurückhaltung und ergänzt keinen im Satz ungenannten Akteur.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Register. Die kultischen Fachbegriffe „Brandopfer“ und „Sühne“ bleiben erhalten. Die Satzgliederung wurde gegenüber dem langen hebräischen Koordinationsgefüge leicht geglättet; alle Fußnotenmarker stehen im Haupttext.
