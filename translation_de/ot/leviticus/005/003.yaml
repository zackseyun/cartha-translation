    issue: Zeitliche und syntaktische Spannung bei »verborgen bleibt«
    rationale: Das Hebräische beschreibt Unkenntnis und danach Erkenntnis. Das deutsche Präsens »bleibt« kann ein weiterhin verborgenes Objekt implizieren; die anschließende Konstruktion ohne ausdrückliche koordinierende Verbindung ist zudem unnötig holprig.
  - severity: low
    issue: Fußnote b bezeichnet »vor ihm verborgen« als wörtlich
    rationale: Die Präposition מִן mit Suffix lautet hier sinngemäß »ihm/von ihm«, nicht wörtlich »vor ihm«. Die idiomatische Wendung kann im Lauftext stehen, sollte aber nicht als Literalübersetzung ausgegeben werden.
