  text: א֣וֹ כִ֤י יִגַּע֙ בְּ/טֻמְאַ֣ת אָדָ֔ם לְ/כֹל֙ טֻמְאָת֔/וֹ אֲשֶׁ֥ר יִטְמָ֖א בָּ֑/הּ וְ/נֶעְלַ֣ם מִמֶּ֔/נּוּ וְ/ה֥וּא יָדַ֖ע וְ/אָשֵֽׁם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/003.yaml
  text: Or if he touches human uncleanness—any uncleanness by which one becomes unclean—and it is hidden from him, and then he comes to know it, he is guilty.
translation:
  language: de
  text: Oder wenn jemand die Unreinheit[a] eines Menschen berührt – jede Unreinheit, durch die man unrein wird – und ihm dies verborgen war, er es aber später erkennt, so ist er schuldig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Verunreinigung«. Das hebräische Wort bezeichnet in diesem Rechtszusammenhang rituelle Unreinheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגַּע בְּ
  choice: berührt
  rationale: נגע mit ב bezeichnet hier körperlichen Kontakt; »berührt« gibt dies unmittelbar und natürlich wieder.
- source_word: טֻמְאַת אָדָם
  choice: die Unreinheit eines Menschen
  rationale: טֻמְאָה bezeichnet im levitischen Rechtszusammenhang kultische beziehungsweise rituelle Unreinheit. אָדָם ist generisch und bezeichnet hier einen Menschen als Quelle der Unreinheit.
- source_word: לְכֹל טֻמְאָתוֹ
  choice: irgendeine Unreinheit
  rationale: Die Wendung erweitert den Anwendungsbereich auf jede entsprechende Art menschlicher Unreinheit; das Suffix wird im Deutschen idiomatisch nicht wiederholt.
- source_word: אֲשֶׁר יִטְמָא בָּהּ
  choice: durch die man unrein wird
  rationale: Der Relativsatz beschreibt die Wirkung der Unreinheit. Das unpersönliche »man« bewahrt den allgemeinen Sinn.
- source_word: וְנֶעְלַם מִמֶּנּוּ
  choice: und es ihm verborgen bleibt
  rationale: Der Nifal von עלם drückt aus, dass der betreffende Umstand seiner Wahrnehmung entzogen war; die passive Formulierung bewahrt die Gestalt des Hebräischen.
- source_word: וְהוּא יָדַע
  choice: er es dann aber erkennt
  rationale: Im Zusammenhang bezeichnet die Wendung das spätere Erkennen nach vorheriger Unwissenheit. »dann aber« macht diese zeitliche und kontrastierende Abfolge im Deutschen deutlich.
- source_word: וְאָשֵׁם
  choice: so ist er schuldig
  rationale: אשם bezeichnet hier eingetretene Schuld beziehungsweise rechtliche Haftung; »ist schuldig« wahrt die knappe Rechtsaussage.
theological_decisions:
- issue: Art der טֻמְאָה im levitischen Gesetz
  choice: Unreinheit
  alternative: Verunreinigung; Sündhaftigkeit
  rationale: Der Vers handelt von kultischer Unreinheit infolge einer Berührung, nicht davon, dass die berührte Sache an sich moralisch böse wäre. »Unreinheit« wahrt diese rechtlich-kultische Kategorie.
- issue: Bedeutung von אָדָם
  choice: eines Menschen
  alternative: eines Mannes; menschliche Unreinheit
  rationale: אָדָם ist hier allgemein und nicht auf männliche Personen beschränkt. Der deutsche Genitiv bezeichnet zugleich verständlich den Menschen als Quelle der Unreinheit.
- issue: Verhältnis von Unwissenheit und Schuld
  choice: Die Abfolge von verborgenem Sachverhalt, späterem Erkennen und Schuld wird ohne weitere Erklärung wiedergegeben.
  alternative: Die Schuld ausdrücklich erst mit dem Erkennen eintreten lassen
  rationale: Die hebräische Satzfolge lässt die genaue Beziehung zwischen Verunreinigung, Unwissenheit, Erkenntnis und Schuld knapp stehen. Die Übersetzung soll diese theologische und rechtliche Spannung nicht eigenmächtig auflösen.
translation_notes:
  register: Moderne, würdige Standardsprache mit knappem rechtlichem Satzbau. »Jemand« und »man« geben den generischen Geltungsbereich wieder; der abschließende Singular bewahrt die Form des Einzelfallgesetzes.
