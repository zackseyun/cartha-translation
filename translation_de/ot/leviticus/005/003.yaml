  rationale: Die Revision macht die im Hebräischen angelegte zeitliche Folge von Unwissenheit und späterer Erkenntnis idiomatisch deutlich, ohne den genauen rechtlichen Zeitpunkt des Schuldeintritts weiter auszudeuten. Der Fußnotenanker b bleibt an »verborgen war« erhalten; die Fußnote wird sachlich als Literalangabe berichtigt.
