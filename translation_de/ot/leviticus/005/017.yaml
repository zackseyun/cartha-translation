source:
  edition: WLC
  text: וְ/אִם נֶ֨פֶשׁ֙ כִּ֣י תֶֽחֱטָ֔א וְ/עָֽשְׂתָ֗ה אַחַת֙ מִ/כָּל מִצְוֺ֣ת יְהוָ֔ה אֲשֶׁ֖ר לֹ֣א תֵעָשֶׂ֑ינָה וְ/לֹֽא יָדַ֥ע וְ/אָשֵׁ֖ם וְ/נָשָׂ֥א עֲוֺנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/017.yaml
  text: And if a person sins and does any one of all the things that by Yahweh’s commandments must not be done[a], though he did not know it[b], then he is guilty and shall bear his iniquity.
translation:
  language: de
  text: Wenn aber jemand sündigt und eine von all den Handlungen begeht, die nach den Geboten Jahwes nicht getan werden dürfen, ohne es zu wissen, ist er schuldig[a] und muss seine Schuld tragen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird er schuldig“ beziehungsweise „zieht er Schuld auf sich“. Das hebräische Wort kann bezeichnen, dass jemand durch die Tat schuldig wird oder Schuld auf sich zieht.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „muss für seine Verfehlung einstehen“. Die hebräische Wendung „seine Schuld tragen“ kann das Tragen der Schuldhaftung oder ihrer Folgen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: jemand
  rationale: נֶפֶשׁ bezeichnet hier idiomatisch eine einzelne Person. „Jemand“ ist in einem deutschen Rechtssatz natürlich und bewahrt den allgemeinen Bezug.
- source_word: תֶחֱטָא
  choice: sündigt
  rationale: Das Verb חטא bezeichnet im priesterlichen Rechtskontext das Begehen einer Sünde; „sündigt“ gibt dies knapp und unmittelbar wieder.
- source_word: וְעָשְׂתָה אַחַת מִכָּל מִצְוֺת יְהוָה אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: gegen eines von all den Geboten Jahwes verstößt, indem er etwas tut, was nicht getan werden darf
  rationale: Die Formulierung macht verständlich, dass eine einzelne verbotene Handlung aus dem Gesamtbereich der Gebote gemeint ist. „Verstößt“ vermeidet im Deutschen die missverständliche Vorstellung, ein Gebot selbst werde „getan“, während der ergänzende Nebensatz die hebräische Passivkonstruktion wahrt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text ausdrücklich stehende Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: וְלֹא יָדַע
  choice: ohne es gewusst zu haben
  rationale: Die Wendung bezeichnet fehlendes Wissen um den Verstoß. Die deutsche Formulierung gibt den sachlichen Zusammenhang natürlich wieder, ohne die daraus folgende Schuld aufzuheben.
- source_word: וְאָשֵׁם
  choice: dann ist er schuldig
  rationale: אָשֵׁם kann den eingetretenen Schuldstatus beziehungsweise die daraus erwachsende Haftung bezeichnen. „Ist schuldig“ lässt diese rechtlich-theologische Spannung bestehen.
- source_word: וְנָשָׂא עֲוֺנוֹ
  choice: und muss seine Schuld tragen
  rationale: Die gewichtige hebräische Wendung נשׂא עון wird nah am Bild des Tragens wiedergegeben; „muss“ vermittelt hier die Folge beziehungsweise Verpflichtung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname steht ausdrücklich im Ausgangstext. „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Schuld trotz fehlenden Wissens
  choice: ohne es gewusst zu haben, dann ist er schuldig
  alternative: ohne es zu wissen, lädt er Schuld auf sich
  rationale: Der Text hält fehlendes Wissen und tatsächliche Schuld nebeneinander. Die Übersetzung bewahrt diese theologische Spannung und erklärt sie nicht weg.
- issue: Bedeutung von נשׂא עון
  choice: seine Schuld tragen
  alternative: die Folgen seiner Verfehlung tragen
  rationale: Die wörtlichere Fassung lässt offen, ob vor allem Schuldhaftung, Strafe oder weitere Folgen gemeint sind, und vermeidet eine vorschnelle Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlicher Rechtssprache. Die Satzstruktur bleibt dem kasuistischen Stil des hebräischen Gesetzestextes nahe, wird aber für heutige Leser idiomatisch gegliedert. Der allgemeine Personenbezug wird mit „jemand“ und dem dazu im Deutschen üblichen singularischen Pronomen ausgedrückt.
