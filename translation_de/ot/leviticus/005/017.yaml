revisions:
- from: Wenn aber jemand sündigt und gegen eines von all den Geboten Jahwes verstößt, indem er etwas tut, was nicht getan werden darf, ohne es gewusst zu haben, dann ist er schuldig[a] und muss seine Schuld tragen[b].
  to: Wenn aber jemand sündigt und eine von all den Handlungen begeht, die nach den Geboten Jahwes nicht getan werden dürfen, ohne es zu wissen, ist er schuldig[a] und muss seine Schuld tragen[b].
  rationale: Die Revision gibt die eine untersagte Handlung aus der Gesamtheit der durch Jahwes Gebote verbotenen Handlungen unmittelbar wieder, ohne die Aussage durch die Konstruktion „gegen ein Gebot verstoßen, indem ...“ aufzuteilen. „Ohne es zu wissen“ bewahrt die knappe, nicht weiter spezifizierte Wissensangabe des Hebräischen. Die Schlussformulierung und beide Anker bleiben in ihrer Bedeutung erhalten.
