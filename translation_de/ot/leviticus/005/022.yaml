  text: or he finds lost property and lies about it and swears falsely—about any one of all the things that a man may do to sin by them—
translation:
  language: de
  text: oder wenn jemand verlorenes Gut findet, es ableugnet und falsch schwört – in Bezug auf irgendeines von all den Dingen, die ein Mensch tut, um dadurch zu sündigen –,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָצָא אֲבֵדָה
  choice: etwas Verlorenes findet
  rationale: אֲבֵדָה bezeichnet hier verlorenes Gut bzw. einen verlorenen Gegenstand; die offene Formulierung bewahrt den Umfang des Hebräischen und klingt natürlich.
- source_word: וְכִחֶשׁ בָּהּ
  choice: es abstreitet
  rationale: כחש bezeichnet im Kontext das wahrheitswidrige Leugnen oder Abstreiten hinsichtlich des gefundenen Gutes; das Pronomen nimmt das Verlorene auf.
- source_word: וְנִשְׁבַּע עַל שָׁקֶר
  choice: und falsch schwört
  rationale: Die Wendung bezeichnet einen unwahren bzw. betrügerischen Eid; „falsch schwören“ ist im Deutschen prägnant und idiomatisch.
- source_word: הָאָדָם
  choice: ein Mensch
  rationale: Der generische Ausdruck bezeichnet hier einen Menschen allgemein, nicht eigens einen männlichen Erwachsenen.
- source_word: לַחֲטֹא בָהֵנָּה
  choice: durch die ein Mensch sündigt
  rationale: Das instrumentale ב wird mit „durch“ wiedergegeben; der Rückbezug auf die genannten Handlungen bleibt erhalten, ohne im Deutschen ein schwerfälliges Pronomen anzufügen.
theological_decisions:
- issue: Generische Bedeutung von הָאָדָם
  choice: ein Mensch
  alternative: ein Mann
  rationale: Im allgemeinen Schlusssatz ist die menschliche Person als solche gemeint. „Mensch“ bewahrt diese generische Aussage, ohne eine geschlechtsspezifische Einschränkung einzutragen.
- issue: Verhältnis des Verses zum fortlaufenden Konditionalsatz
  choice: Satzfragment mit einleitendem „oder“ und abschließendem Gedankenstrich/Komma
  alternative: als selbstständigen vollständigen Satz formulieren
  rationale: Der hebräische Vers setzt die Aufzählung aus dem unmittelbaren Kontext fort und findet seine syntaktische Fortsetzung im nächsten Vers. Die fragmentarische Struktur wird daher bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die aufzählende, syntaktisch noch offene Gestalt des hebräischen Kontextes bleibt sichtbar; keine konfessionelle Deutung wird ergänzt.
