id: LEV.5.11
reference: Leviticus 5:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אִם לֹא֩ תַשִּׂ֨יג יָד֜/וֹ לִ/שְׁתֵּ֣י תֹרִ֗ים אוֹ֮ לִ/שְׁנֵ֣י בְנֵי יוֹנָה֒ וְ/הֵבִ֨יא אֶת קָרְבָּנ֜/וֹ אֲשֶׁ֣ר חָטָ֗א עֲשִׂירִ֧ת הָ/אֵפָ֛ה סֹ֖לֶת לְ/חַטָּ֑את לֹא יָשִׂ֨ים עָלֶ֜י/הָ שֶׁ֗מֶן וְ/לֹא יִתֵּ֤ן עָלֶ֨י/הָ֙ לְבֹנָ֔ה כִּ֥י חַטָּ֖את הִֽיא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/011.yaml
  text: But if his means are not sufficient for two turtledoves or two young pigeons[a], then he shall bring as his offering for the sin that he has committed a tenth of an ephah of fine flour for a sin offering. He shall put no oil on it and place no frankincense on it, because it is a sin offering.
translation:
  language: de
  text: Wenn aber seine Mittel für zwei Turteltauben oder zwei junge Tauben nicht ausreichen[a], soll er als seine Opfergabe für die Sünde, die er begangen hat, ein Zehntel eines Efa Feinmehl als Sündopfer bringen. Er soll kein Öl darauf geben und keinen Weihrauch darauf legen, denn es ist ein Sündopfer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wenn seine Hand nicht reicht“ – eine hebräische Wendung dafür, dass jemand nicht über ausreichende Mittel verfügt.'
    reason: Die Fußnote bewahrt das konkrete hebräische Sprachbild, während der Haupttext dessen gemeinten wirtschaftlichen Sinn verständlich wiedergibt.
lexical_decisions:
- source_word: תַשִּׂיג יָדוֹ
  choice: seine Mittel … nicht ausreichen
  rationale: Die Wendung bedeutet wörtlich, dass seine Hand etwas nicht erreicht, und bezeichnet hier unzureichende wirtschaftliche Mittel. Die gewählte Formulierung gibt den Sinn in klarem, würdigem Deutsch wieder.
- source_word: תֹרִים
  choice: Turteltauben
  rationale: Der hebräische Artbegriff bezeichnet im Opferkontext Turteltauben und wird daher präzise wiedergegeben.
- source_word: בְנֵי יוֹנָה
  choice: junge Tauben
  rationale: Wörtlich „Söhne der Taube“; die hebräische Wendung bezeichnet junge Tauben. Das Deutsche bewahrt den Altersbezug, ohne eine zoologische Präzision vorzutäuschen, die der allgemeine deutsche Begriff „Taube“ nicht trägt.
- source_word: קָרְבָּנוֹ
  choice: seine Opfergabe
  rationale: Der Ausdruck bezeichnet allgemein das, was als Gabe dargebracht wird. „Opfergabe“ passt auch zu dem hier vorgesehenen Feinmehl.
- source_word: אֲשֶׁר חָטָא
  choice: für die Sünde, die er begangen hat
  rationale: Die knappe hebräische Relativkonstruktion wird im Deutschen idiomatisch entfaltet und auf die begangene Verfehlung bezogen.
- source_word: עֲשִׂירִת הָאֵפָה
  choice: ein Zehntel Efa
  rationale: Die alte Trockenmaßeinheit bleibt erhalten; eine moderne Umrechnung würde eine nicht ausdrücklich im Text enthaltene Genauigkeit einführen.
- source_word: סֹלֶת
  choice: Feinmehl
  rationale: Der Ausdruck bezeichnet fein gemahlenes, für Opfergaben bestimmtes Mehl.
- source_word: לְחַטָּאת
  choice: als Sündopfer
  rationale: Im unmittelbaren kultischen Zusammenhang bezeichnet חַטָּאת die Opfergabe zur Behandlung einer Sünde.
- source_word: לֹא יָשִׂים עָלֶיהָ שֶׁמֶן
  choice: Er soll kein Öl darauf geben
  rationale: Die direkte kultische Vorschrift wird natürlich und verbindlich wiedergegeben.
- source_word: וְלֹא יִתֵּן עָלֶיהָ לְבֹנָה
  choice: und keinen Weihrauch darauf legen
  rationale: לְבֹנָה bezeichnet den im Opferdienst verwendeten Weihrauch beziehungsweise das Weihrauchharz.
- source_word: כִּי חַטָּאת הִיא
  choice: denn es ist ein Sündopfer
  rationale: Die Begründung bezieht sich auf die kultische Einordnung der Gabe.
theological_decisions:
- issue: Bedeutung von חַטָּאת im Opferkontext
  choice: Sündopfer
  alternative: Sünde
  rationale: Das Wort kann sowohl die Sünde als auch das zugehörige Opfer bezeichnen. Hier beziehen sich die Anweisungen auf die dargebrachte Gabe; deshalb ist die kultische Bedeutung „Sündopfer“ sachlich geboten, ohne spätere Lehrsysteme einzutragen.
- issue: Wiedergabe der Armutsformel und ihres rechtlichen Gewichts
  choice: seine Mittel … nicht ausreichen
  alternative: seine Hand … nicht erreicht / er es sich nicht leisten kann
  rationale: Die Formulierung macht die wirtschaftliche Voraussetzung der gesetzlichen Erleichterung verständlich, bleibt aber würdiger und weniger umgangssprachlich als „sich nicht leisten können“.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem gesetzlich-kultischem Ton. Die Satzstruktur bleibt nahe am Hebräischen, wird jedoch für natürliche deutsche Lesbarkeit gegliedert. Alte Maßeinheit und kultische Fachbegriffe werden beibehalten.
