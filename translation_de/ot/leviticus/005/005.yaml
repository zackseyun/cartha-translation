  text: And it shall be[a], when he becomes guilty in one of these matters[b], that he shall confess what he has sinned in regard to it.
translation:
  language: de
  text: Wenn er in einem dieser Fälle schuldig wird[a], soll er bekennen, worin er gesündigt hat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schuld auf sich lädt“ oder „sich schuldig macht“. Das hebräische Verb betont Schuld beziehungsweise Haftung, nicht lediglich das innere Bewusstsein eines Fehlverhaltens.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „worin er in Bezug auf sie gesündigt hat“. Das feminine Suffix bezieht sich auf einen der zuvor genannten Fälle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Wenn
  rationale: Die hebräische rechtssprachliche Einleitungsformel bezeichnet hier den eintretenden Fall. Im modernen Deutschen gibt „Wenn“ ihren Sinn natürlich wieder, ohne die schwerfällige Formulierung „Und es soll geschehen“ nachzuahmen.
- source_word: יֶאְשַׁם
  choice: sich schuldig macht
  rationale: Das Verb אשם bezeichnet das Eintreten rechtlicher oder kultischer Schuld beziehungsweise Haftung, nicht notwendig das innere Erkennen der Schuld.
- source_word: לְאַחַת מֵאֵלֶּה
  choice: in einem dieser Fälle
  rationale: Die Wendung verweist auf einen der unmittelbar zuvor aufgeführten Tatbestände. „Fälle“ ist im deutschen Gesetzes- und Regelungskontext präzise und verständlich.
- source_word: וְהִתְוַדָּה
  choice: soll er bekennen
  rationale: Der Hitpael von ידה bezeichnet hier das Bekennen der begangenen Sünde. „Soll“ gibt die rechtliche Vorschrift in natürlichem modernem Deutsch wieder.
- source_word: אֲשֶׁר חָטָא עָלֶיהָ
  choice: worin er gesündigt hat
  rationale: Die Formulierung bewahrt den Bezug der Präposition mit femininem Suffix auf den betreffenden Fall und gibt die hebräische Relativkonstruktion idiomatisch wieder.
theological_decisions:
- issue: Bedeutung von יֶאְשַׁם
  choice: Das Eintreten objektiver Schuld wird ausgedrückt.
  alternative: „wenn er seine Schuld erkennt“
  rationale: Der hebräische Wortlaut nennt Schuld beziehungsweise Schuldhaftigkeit, aber nicht ausdrücklich einen späteren Erkenntnisvorgang. Eine solche Deutung wird daher nicht in den Haupttext aufgenommen.
translation_notes:
  register: Moderne, würdige Standardsprache mit knappem rechtlichem Ton. Die hebräische Einleitungsformel wird idiomatisch verkürzt; der generische maskuline Singular des Ausgangstextes bleibt erhalten.
