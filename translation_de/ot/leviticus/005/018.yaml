id: LEV.5.18
reference: Leviticus 5:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ֠/הֵבִיא אַ֣יִל תָּמִ֧ים מִן הַ/צֹּ֛אן בְּ/עֶרְכְּ/ךָ֥ לְ/אָשָׁ֖ם אֶל הַ/כֹּהֵ֑ן וְ/כִפֶּר֩ עָלָ֨י/ו הַ/כֹּהֵ֜ן עַ֣ל שִׁגְגָת֧/וֹ אֲשֶׁר שָׁגָ֛ג וְ/ה֥וּא לֹֽא יָדַ֖ע וְ/נִסְלַ֥ח לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/018.yaml
  text: He shall bring to the priest a ram without blemish from the flock[a], according to your valuation, for a guilt offering; and the priest shall make atonement for him concerning the error that he committed unintentionally, though he did not know it[b], and he shall be forgiven.
translation:
  language: de
  text: Er soll dem Priester einen fehlerlosen Widder aus der Herde bringen, nach deiner Schätzung, als Schuldopfer[a]. Der Priester soll für ihn Sühne erwirken wegen seines Versehens, durch das er sich unabsichtlich vergangen hat, ohne es zu wissen[b]; dann wird ihm vergeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als Wiedergutmachungsopfer“. Das hebräische Wort bezeichnet eine bestimmte Opferart, bei der häufig auch Wiedergutmachung eine Rolle spielt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „und er wusste es nicht“. Offen bleibt, ob ihm die Tat oder ihr schuldhafter Charakter nicht bewusst war.'
    reason: ambiguity
lexical_decisions:
- source_word: וְהֵבִיא
  choice: Er soll bringen
  rationale: Die Verbform mit וְ hat in dieser Rechtsanweisung vorschreibende Bedeutung; „soll“ gibt sie in natürlichem modernem Deutsch wieder.
- source_word: אַיִל תָּמִים
  choice: einen fehlerlosen Widder
  rationale: אַיִל bezeichnet einen ausgewachsenen Schafbock; תָּמִים meint im Opferkontext ein Tier ohne körperlichen Fehler.
- source_word: מִן הַצֹּאן
  choice: aus der Herde
  rationale: צֹאן bezeichnet Kleinvieh, besonders Schafe und Ziegen; da אַיִל bereits einen Widder bestimmt, ist „Herde“ hier klar und idiomatisch.
- source_word: בְּעֶרְכְּךָ
  choice: nach deiner Schätzung
  rationale: Die Wendung bezeichnet die vorgeschriebene Wertfestsetzung. Das Suffix der zweiten Person Singular bleibt erhalten, ohne die Identität des Bewertenden zusätzlich festzulegen.
- source_word: לְאָשָׁם
  choice: als Schuldopfer
  rationale: אָשָׁם bezeichnet hier eine bestimmte Opferart. „Schuldopfer“ ist der etablierte und verständliche deutsche Ausdruck; „Wiedergutmachungsopfer“ hebt einen ebenfalls vorhandenen Bedeutungsaspekt hervor.
- source_word: וְכִפֶּר עָלָיו
  choice: Der Priester soll für ihn Sühne erwirken
  rationale: כפר bezeichnet im priesterlichen Opferkontext die sühnende Handlung. „Sühne erwirken“ bewahrt das theologische Gewicht und macht zugleich deutlich, dass der Priester rituell zugunsten des Betroffenen handelt.
- source_word: עַל שִׁגְגָתוֹ אֲשֶׁר שָׁגָג
  choice: wegen seines Versehens, durch das er sich unabsichtlich vergangen hat
  rationale: Substantiv und stammverwandtes Verb betonen einen unbeabsichtigten Fehltritt. Die Wiedergabe wahrt diese Wiederaufnahme, ohne das Vergehen zu verharmlosen.
- source_word: וְהוּא לֹא יָדַע
  choice: ohne es zu wissen
  rationale: Die Formulierung drückt aus, dass dem Handelnden sein Vergehen nicht bewusst war, und lässt sich so knapp und natürlich an den vorausgehenden Relativsatz anschließen.
- source_word: וְנִסְלַח לוֹ
  choice: dann wird ihm vergeben
  rationale: Das Niphal bezeichnet die gewährte Vergebung. Die ungenannte handelnde Instanz bleibt als sogenanntes göttliches Passiv unausgesprochen.
theological_decisions:
- issue: Wiedergabe der Opferbezeichnung אָשָׁם
  choice: Schuldopfer
  alternative: Wiedergutmachungsopfer
  rationale: Der Ausdruck benennt eine bestimmte Opferkategorie. „Schuldopfer“ ist im Deutschen etabliert, während die Fußnote auf den Aspekt der Wiedergutmachung und die mögliche Übersetzungsalternative hinweist.
- issue: Wiedergabe von כפר
  choice: Sühne erwirken
  alternative: Sühne schaffen; entsühnen
  rationale: Die gewählte Formulierung bezeichnet die priesterliche Opferhandlung, ohne den genauen Wirkmechanismus dogmatisch festzulegen. Sie verbindet kultische Präzision mit heutiger Verständlichkeit.
- issue: Unwissenheit und Unabsichtlichkeit des Vergehens
  choice: unabsichtlich vergangen … ohne es zu wissen
  alternative: aus Versehen gesündigt, ohne sich dessen bewusst zu sein
  rationale: 'Die Übersetzung hält beide Aussagen des Hebräischen fest: Das Vergehen geschah irrtümlich und war dem Betroffenen nicht bewusst. Sie legt nicht fest, ob sich das Nichtwissen auf die Tat, ihre Rechtswidrigkeit oder beides bezieht.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit rechtlich-kultischem Ton. „Fehlerlos“ ist verständlicher als das traditionellere „ohne Fehl“; „Sühne erwirken“ bewahrt die priesterliche Fachsprache. Die Satzstruktur wurde moderat gegliedert, ohne die logischen Beziehungen des Hebräischen aufzulösen.
