    issue: Unidiomatische Formulierung „am HERRN ... schuldig geworden“
    rationale: „Schuldig werden“ wird im Deutschen normalerweise nicht mit „an/bei jemandem“ in diesem Sinn verbunden. „Sich an jemandem schuldig machen“ bezeichnet dagegen klar und natürlich ein schuldhaftes Handeln gegenüber dieser Person.
