base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/019.yaml
  text: It is a guilt offering[a]; he has indeed incurred guilt against Yahweh.
translation:
  language: de
  text: Es ist ein Schuldopfer[a]; er hat sich tatsächlich am HERRN schuldig gemacht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Es ist ein Schuldopfer; er hat sich ganz gewiss am HERRN schuldig gemacht.“ Im Hebräischen wird dreimal dieselbe Wortwurzel אשם („Schuld/Schuldopfer“, „schuldig sein bzw. werden“) verwendet; die Verbindung von Infinitiv und Verb verstärkt die Aussage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָשָׁם
  choice: Schuldopfer
  rationale: Im kultischen Zusammenhang bezeichnet das Substantiv das vorgeschriebene Opfer für entstandene Schuld; „Schuldopfer“ ist die etablierte und verständliche deutsche Wiedergabe.
- source_word: הוּא
  choice: Es ist
  rationale: Das Pronomen steht prädikativ und bestimmt das zuvor genannte Opfer näher.
- source_word: אָשֹׁם אָשַׁם
  choice: ist tatsächlich schuldig geworden
  rationale: Infinitivus absolutus und finites Verb derselben Wurzel verstärken die Aussage. „Tatsächlich“ gibt diese Betonung natürlich wieder und bewahrt zugleich den hörbaren Zusammenhang mit „Schuldopfer“.
- source_word: לַיהוָה
  choice: am HERRN
  rationale: Bei אשם kann ל die Person bezeichnen, der gegenüber Schuld besteht. „Am HERRN schuldig geworden“ drückt diese Beziehung aus, ohne die Präposition bloß als Empfängerangabe zum Opfer zu ziehen.
- source_word: יהוה
  choice: der HERR
  rationale: Der Gottesname wird nach verbreiteter deutscher Bibeltradition ehrfürchtig mit „der HERR“ wiedergegeben.
theological_decisions:
- issue: Bezug und Sinn von לַיהוָה
  choice: Die Schuld des Menschen besteht gegenüber dem HERRN.
  alternative: 'Das Opfer ist ein Schuldopfer für den HERRN; oder: Er ist vor dem HERRN schuldig geworden.'
  rationale: Wortstellung und idiomatischer Gebrauch sprechen dafür, לַיהוָה mit dem verbalen אָשַׁם zu verbinden. „Am HERRN schuldig geworden“ bewahrt den relationalen Schuldbezug, ohne eine feindselige Handlung stärker zu behaupten, als der knappe hebräische Satz erkennen lässt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung der hebräischen Wurzel wird durch „Schuldopfer – schuldig geworden“ teilweise bewahrt; „tatsächlich“ gibt die ausdrückliche Verstärkung wieder.
