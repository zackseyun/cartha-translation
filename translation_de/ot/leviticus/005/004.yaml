source:
  edition: WLC
  text: א֣וֹ נֶ֡פֶשׁ כִּ֣י תִשָּׁבַע֩ לְ/בַטֵּ֨א בִ/שְׂפָתַ֜יִם לְ/הָרַ֣ע א֣וֹ לְ/הֵיטִ֗יב לְ֠/כֹל אֲשֶׁ֨ר יְבַטֵּ֧א הָ/אָדָ֛ם בִּ/שְׁבֻעָ֖ה וְ/נֶעְלַ֣ם מִמֶּ֑/נּוּ וְ/הוּא יָדַ֥ע וְ/אָשֵׁ֖ם לְ/אַחַ֥ת מֵ/אֵֽלֶּה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/004.yaml
  text: Or if a person swears rashly with his lips to do evil or to do good—whatever a man may utter in an oath—and it is hidden from him[a], and then he comes to know it and becomes guilty in one of these matters[b],
translation:
  language: de
  text: Oder wenn jemand unbedacht[a] mit seinen Lippen schwört, Böses oder Gutes zu tun – was immer ein Mensch durch einen Eid aussprechen mag – und es ihm entgangen ist[b], er es dann aber erkennt und in einem dieser Fälle schuldig wird,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das mit „unbedacht … aussprechen“ wiedergegebene hebräische Verb kann auch einfach „äußern“ oder „aussprechen“ bedeuten. Der Zusammenhang legt eine unbedachte oder vorschnelle Eidesäußerung nahe.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „und es vor ihm verborgen ist“. Offen bleibt, ob der Eid selbst, seine Tragweite oder seine Verletzung seinem Bewusstsein entgangen ist.'
    reason: ambiguity
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: jemand
  rationale: In dieser Rechtsformel bezeichnet נֶפֶשׁ eine einzelne Person. „Jemand“ ist im Deutschen natürlich und schließt alle Betroffenen ein.
- source_word: תִשָּׁבַע
  choice: schwört
  rationale: Das Nifal von שׁבע bezeichnet hier das Ablegen eines Eides; „schwört“ ist knapp und idiomatisch.
- source_word: לְבַטֵּא בִשְׂפָתַיִם
  choice: unbedacht mit seinen Lippen
  rationale: בטא bedeutet grundsätzlich „äußern/aussprechen“. Im Zusammenhang eines schuldbegründenden Eides legt die Formulierung eine unbedachte oder vorschnelle Äußerung nahe; „mit seinen Lippen“ bewahrt zugleich das konkrete hebräische Bild.
- source_word: לְהָרַע אוֹ לְהֵיטִיב
  choice: Böses oder Gutes zu tun
  rationale: Die beiden Infinitive bezeichnen in umfassender Gegenüberstellung den möglichen Inhalt des Eides. Die Übersetzung bleibt eng am Wortlaut und lässt die genaue Reichweite offen.
- source_word: לְכֹל אֲשֶׁר יְבַטֵּא הָאָדָם בִּשְׁבֻעָה
  choice: was immer ein Mensch durch einen Eid aussprechen mag
  rationale: Die Wendung verallgemeinert die zuvor genannten Fälle. הָאָדָם bezeichnet hier den Menschen als repräsentative Einzelperson; „ein Mensch“ ist im Deutschen quellentreu und generisch.
- source_word: וְנֶעְלַם מִמֶּנּוּ
  choice: und es ihm entgangen ist
  rationale: Die Wiedergabe drückt aus, dass der Sachverhalt seinem Bewusstsein entzogen war, ohne festzulegen, ob der Eid selbst, seine Tragweite oder seine Verletzung gemeint ist.
- source_word: וְהוּא יָדַע
  choice: er es dann aber erkennt
  rationale: „Dann“ macht den Übergang von vorheriger Unkenntnis zu späterer Erkenntnis deutlich; „aber“ gibt den sachlichen Gegensatz natürlich wieder.
- source_word: וְאָשֵׁם
  choice: schuldig wird
  rationale: Das Verb bezeichnet das Eintreten oder Feststehen von Schuld beziehungsweise Haftung. „Schuldig wird“ bewahrt diesen rechtlichen Sinn.
- source_word: לְאַחַת מֵאֵלֶּה
  choice: in einem dieser Fälle
  rationale: Die Formulierung verweist auf einen der zuvor aufgeführten Tatbestände; „Fälle“ passt zum rechtlichen Zusammenhang.
theological_decisions:
- issue: Reichweite der Unkenntnis in וְנֶעְלַם מִמֶּנּוּ
  choice: Das unbestimmte Pronomen „es“ bleibt erhalten.
  alternative: Ausdrücklich von einem vergessenen Eid oder einer unbemerkten Übertretung sprechen.
  rationale: Der hebräische Text bestimmt nicht eindeutig, was der Person entgangen ist. Eine Präzisierung würde die echte Mehrdeutigkeit unnötig auflösen.
- issue: Generische Personenbezeichnung הָאָדָם
  choice: ein Mensch
  alternative: ein Mann; jemand
  rationale: אָדָם bezeichnet hier einen einzelnen Menschen repräsentativ und nicht ausdrücklich einen männlichen Erwachsenen. „Ein Mensch“ wahrt diese Form, ohne den Geltungsbereich des Gesetzes einzuengen.
- issue: Schuld bei einem unbedachten Eid
  choice: schuldig wird
  alternative: Schuld auf sich lädt; ein Schuldopfer schuldig ist
  rationale: Der Vers stellt Schuld beziehungsweise rechtliche Haftung fest, nennt an dieser Stelle aber noch nicht deren kultische Folge. Die Übersetzung fügt daher keine bestimmte Opfertheologie ein.
translation_notes:
  register: Moderne, würdige Standardsprache mit rechtlich sachlichem Ton. Das Satzende bleibt offen und trägt ein Komma, weil der kasuistische Bedingungssatz in Vers 5 fortgeführt wird. Das konkrete Bild „mit seinen Lippen“ wurde bewahrt; schwerfällige juristische Fachsprache wurde vermieden.
