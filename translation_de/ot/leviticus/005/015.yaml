revisions:
- from: Wenn jemand treulos handelt und sich aus Versehen an den heiligen Dingen Jahwes[a] versündigt, soll er Jahwe als Wiedergutmachungsopfer[b] einen fehlerlosen Widder aus der Herde bringen, dessen Wert nach deiner Schätzung in Silberschekeln nach dem Schekel des Heiligtums[c] bemessen wird.
  to: 'Wenn jemand treulos handelt und sich aus Versehen hinsichtlich der heiligen Dinge Jahwes[a] versündigt, soll er Jahwe sein Wiedergutmachungsopfer[b] bringen: einen fehlerlosen Widder aus der Herde, nach deiner Schätzung in Silberschekeln, nach dem Schekel des Heiligtums[c], als Wiedergutmachungsopfer.'
  rationale: Die Revision ergänzt die ausgelassene abschließende Opferbezeichnung לְאָשָׁם und bildet damit die im Hebräischen vorhandene Wiederaufnahme von אָשָׁם ab. Die Wertbestimmung wird ohne den nicht erforderlichen Passivsatz unmittelbar auf den Widder bezogen. „Hinsichtlich der heiligen Dinge Jahwes“ hält die Beziehung des Verstoßes zu den geweihten Dingen offen, ohne eine bestimmte Art der Verfehlung festzulegen.
