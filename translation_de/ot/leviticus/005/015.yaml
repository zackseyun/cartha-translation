  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: נֶ֚פֶשׁ כִּֽי תִמְעֹ֣ל מַ֔עַל וְ/חָֽטְאָה֙ בִּ/שְׁגָגָ֔ה מִ/קָּדְשֵׁ֖י יְהוָ֑ה וְ/הֵבִיא֩ אֶת אֲשָׁמ֨/וֹ לַֽ/יהוָ֜ה אַ֧יִל תָּמִ֣ים מִן הַ/צֹּ֗אן בְּ/עֶרְכְּ/ךָ֛ כֶּֽסֶף שְׁקָלִ֥ים בְּ/שֶֽׁקֶל הַ/קֹּ֖דֶשׁ לְ/אָשָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/015.yaml
  text: 'If a person acts unfaithfully and sins unintentionally in regard to the holy things of Yahweh[a], he shall bring his compensation offering to Yahweh: an unblemished ram from the flock, according to your valuation in silver shekels, by the sanctuary shekel[b], for a guilt offering.'
translation:
  language: de
  text: 'Wenn jemand treulos handelt und sich aus Versehen hinsichtlich der heiligen Dinge Jahwes[a] versündigt, soll er Jahwe sein Wiedergutmachungsopfer[b] bringen: einen fehlerlosen Widder aus der Herde, nach deiner Schätzung in Silberschekeln, nach dem Schekel des Heiligtums[c], als Wiedergutmachungsopfer.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit den „heiligen Dingen Jahwes“ sind ihm geweihte Gaben, Abgaben oder sonstiges heiliges Gut gemeint.
    reason: cultural_note
  - marker: b
    text: 'Traditionell: „Schuldopfer“. Das hebräische Wort אָשָׁם, das hier zweimal vorkommt, kann sowohl die Schuld oder Ersatzpflicht als auch das Opfer bezeichnen, das ihretwegen dargebracht wird.'
    reason: lexical_alternative
  - marker: c
    text: Der „Schekel des Heiligtums“ war der für kultische Wertangaben maßgebliche Gewichtsstandard.
    reason: cultural_note
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: jemand
  rationale: In dieser Rechtsbestimmung bezeichnet נֶפֶשׁ eine einzelne Person. „Jemand“ gibt die allgemeine Einzelfallformulierung natürlich und ohne unpassenden biologischen oder philosophischen Beiklang wieder.
- source_word: תִמְעֹל מַעַל
  choice: treulos handelt
  rationale: Die Verbindung aus Verb und stammverwandtem Substantiv bezeichnet einen schweren Verstoß gegen eine anvertraute oder heilige Verpflichtung. „Treulos handelt“ bewahrt diesen Beziehungs- und Pflichtaspekt.
- source_word: וְחָטְאָה בִשְׁגָגָה
  choice: und sich aus Versehen … versündigt
  rationale: בִשְׁגָגָה bezeichnet eine unbeabsichtigte oder irrtümliche Verfehlung, keinen vorsätzlichen, herausfordernden Ungehorsam.
- source_word: מִקָּדְשֵׁי יְהוָה
  choice: an den heiligen Dingen Jahwes
  rationale: Die Wendung betrifft Dinge, Abgaben oder Gaben, die Jahwe geheiligt sind. „An … versündigt“ gibt die betroffene Sphäre idiomatisch wieder, ohne die genaue Art des Verstoßes einzuengen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֲשָׁמוֹ … לְאָשָׁם
  choice: als Wiedergutmachungsopfer … bringen
  rationale: אָשָׁם kann sowohl die entstandene Schuld beziehungsweise Ersatzpflicht als auch das dafür dargebrachte Opfer bezeichnen. Im Zusammenhang mit einem Verlust an heiligem Gut und einer Wertbestimmung hebt „Wiedergutmachungsopfer“ die reparative Funktion hervor.
- source_word: אַיִל תָּמִים
  choice: einen fehlerlosen Widder
  rationale: תָּמִים bedeutet bei Opfertieren, dass kein körperlicher Makel vorliegt. „Fehlerlos“ ist klar und sachlich.
- source_word: מִן הַצֹּאן
  choice: aus der Herde
  rationale: צֹאן bezeichnet Kleinvieh; da אַיִל das Tier bereits als Widder bestimmt, ist „aus der Herde“ ausreichend.
- source_word: בְּעֶרְכְּךָ כֶּסֶף שְׁקָלִים
  choice: dessen Wert nach deiner Schätzung in Silberschekeln … bemessen wird
  rationale: Die Formulierung bewahrt die Wertbestimmung und die Anrede in der zweiten Person Singular. Sie ergänzt keine im masoretischen Text nicht ausdrücklich genannte Zahl von Schekeln.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: nach dem Schekel des Heiligtums
  rationale: Gemeint ist der für kultische Wertangaben maßgebliche Gewichtsstandard.
theological_decisions:
- issue: Wiedergabe der Opferbezeichnung אָשָׁם
  choice: Wiedergutmachungsopfer
  alternative: Schuldopfer
  rationale: Der Kontext verbindet die Verfehlung an geheiligtem Gut mit einer in Silber ausgedrückten Wertbestimmung und im Folgevers mit Ersatzleistung. „Wiedergutmachungsopfer“ macht diese Dimension verständlich; „Schuldopfer“ bleibt eine traditionelle und lexikalisch mögliche Wiedergabe und wird in der Fußnote genannt.
- issue: Unbeabsichtigte Verfehlung und Treulosigkeit
  choice: 'Beide Aussagen werden nebeneinandergestellt: „treulos handelt“ und „aus Versehen … versündigt“.'
  alternative: Die Treulosigkeit als vorsätzlichen Betrug auszulegen
  rationale: Der hebräische Text hält die objektive Treulosigkeit gegenüber heiligem Gut und die Unabsichtlichkeit der konkreten Verfehlung zusammen. Die Übersetzung löst diese Spannung nicht auf.
- issue: Nicht genannte Schekelzahl
  choice: Keine Zahl ergänzen
  alternative: „zwei Silberschekel“
  rationale: Obwohl der Plural שְׁקָלִים mindestens zwei nahelegen kann und manche Übersetzungen eine Zahl einsetzen, enthält der überlieferte hebräische Text hier kein ausdrückliches Zahlwort. Die Übersetzung wahrt diesen Wortlaut.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit verständlicher Rechtssprache. Die Satzstruktur bleibt eng am hebräischen Rechtsfall, ohne unnatürliche Wiederholungen. „Jahwe“ gibt den Gottesnamen wieder; „Wiedergutmachungsopfer“ erklärt die Funktion des אָשָׁם im Kontext, während die traditionelle Bezeichnung in der Fußnote erhalten bleibt.
