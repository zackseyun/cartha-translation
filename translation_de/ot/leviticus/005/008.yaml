base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/008.yaml
  text: And he shall bring them to the priest[a], and he shall present first the one for the sin offering, and he shall pinch off its head from the front of its neck[c][b], but he shall not sever it.
translation:
  language: de
  text: Er soll sie zum Priester bringen. Dieser soll zuerst den Vogel darbringen, der für das Sündopfer[a] bestimmt ist. Er soll ihm am Nacken[b] den Kopf abkneifen[c], ihn aber nicht vollständig abtrennen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann im Zusammenhang der Opfergesetze auch als „Reinigungsopfer“ verstanden werden.
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Ortsangabe ist schwierig: Sie verbindet die Vorstellungen „gegenüber/vorn“ und „Nacken“. Die genaue räumliche Bedeutung ist umstritten.'
    reason: textual_ambiguity
  - marker: c
    text: Das Verb bezeichnet die besondere Handbewegung des Priesters beim Opfer eines Vogels.
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵבִיא אֹתָם אֶל הַכֹּהֵן
  choice: Er soll sie zum Priester bringen
  rationale: Die Mehrzahl „sie“ verweist auf die beiden Vögel aus dem vorhergehenden Vers. Die Soll-Form entspricht dem verpflichtenden Charakter der kultischen Anweisung.
- source_word: וְהִקְרִיב
  choice: Dieser soll … darbringen
  rationale: Das Hifil von קרב bezeichnet im Opferkontext das rituelle Darbringen. „Dieser“ macht im Deutschen natürlich deutlich, dass nun der Priester handelt, ohne eine zusätzliche Amtsbezeichnung einzuführen.
- source_word: אֶת אֲשֶׁר לַחַטָּאת רִאשׁוֹנָה
  choice: zuerst den Vogel …, der für das Sündopfer bestimmt ist
  rationale: Die Formulierung bewahrt sowohl die Reihenfolge als auch die Bestimmung des ersten Vogels; „Vogel“ wird aus dem unmittelbaren Kontext ergänzt, um den Bezug im Deutschen klar auszudrücken.
- source_word: חַטָּאת
  choice: Sündopfer
  rationale: „Sündopfer“ ist die geläufige deutsche Bezeichnung; der Begriff kann im levitischen Kultzusammenhang zugleich den Aspekt ritueller Reinigung hervorheben, was die Fußnote festhält.
- source_word: וּמָלַק
  choice: abkneifen
  rationale: מלק ist ein technischer Ausdruck für die mit der Hand vollzogene Behandlung des Kopfes beziehungsweise Halses eines Opfervogels. „Abkneifen“ gibt diese konkrete Handlung verständlich wieder.
- source_word: מִמּוּל עָרְפּוֹ
  choice: vorn am Hals
  rationale: Die schwierige Wendung verbindet מול, „gegenüber/vor“, mit ערף, „Nacken/Hals“. „Vorn am Hals“ bietet eine verständliche räumliche Wiedergabe, während die textliche Schwierigkeit in der Fußnote erhalten bleibt.
- source_word: וְלֹא יַבְדִּיל
  choice: ihn aber nicht vollständig abtrennen
  rationale: בדל bedeutet trennen oder scheiden. Im Zusammenhang wird untersagt, den Kopf ganz vom Körper zu lösen; „vollständig“ macht diese praktische Bedeutung deutlich, ohne den vorausgehenden Vorgang zu leugnen.
theological_decisions:
- issue: Bedeutung von חַטָּאת im Opfergesetz
  choice: Sündopfer im Haupttext
  alternative: Reinigungsopfer
  rationale: Beide Bezeichnungen erfassen einen Aspekt des hebräischen Kultbegriffs. Die traditionelle und allgemein verständliche Bezeichnung steht im Text; die kultisch-reinigende Deutung wird als echte lexikalische Alternative in der Fußnote bewahrt.
translation_notes:
  register: Moderne, würdige Gesetzessprache mit klaren Soll-Formulierungen. Kurze Sätze vermeiden eine missverständliche Folge mehrerer männlicher Pronomen. Technische Opferterminologie wird verständlich wiedergegeben; echte lexikalische und räumliche Mehrdeutigkeit bleibt durch Fußnoten sichtbar.
