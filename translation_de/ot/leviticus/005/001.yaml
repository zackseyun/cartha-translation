  text: וְ/נֶ֣פֶשׁ כִּֽי תֶחֱטָ֗א וְ/שָֽׁמְעָה֙ ק֣וֹל אָלָ֔ה וְ/ה֣וּא עֵ֔ד א֥וֹ רָאָ֖ה א֣וֹ יָדָ֑ע אִם ל֥וֹא יַגִּ֖יד וְ/נָשָׂ֥א עֲוֺנֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/001.yaml
  text: If a person sins[a] because he hears a public adjuration and he is a witness—whether he has seen or otherwise knows—and he does not report it[b], then he shall bear his guilt.
translation:
  language: de
  text: Wenn jemand sündigt, weil er eine öffentliche eidliche Aufforderung[a] hört und Zeuge ist – sei es, dass er etwas gesehen hat oder anderweitig davon weiß – und dies nicht mitteilt, dann trägt er seine Schuld[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Stimme eines Eides/Fluches“. Gemeint ist im rechtlichen Zusammenhang eine feierliche, eidlich bekräftigte Aufforderung zur Zeugenaussage.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dann muss er für seine Schuld einstehen“. Die hebräische Wendung besagt, dass die Person wegen des verschwiegenen Zeugnisses schuldig und dafür haftbar bleibt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: jemand
  rationale: Im Gesetzestext bezeichnet נֶפֶשׁ eine Person. „Jemand“ ist im modernen Deutschen natürlich und vermeidet eine unpassende metaphysische Deutung als „Seele“.
- source_word: תֶחֱטָא
  choice: sündigt
  rationale: Das Verb חטא bezeichnet hier ein schuldhaftes Vergehen und bewahrt mit „sündigt“ sowohl die rechtliche als auch die moralische Dimension.
- source_word: וְשָׁמְעָה קוֹל אָלָה
  choice: einen öffentlichen Aufruf unter Eid hört
  rationale: Die Wendung bezeichnet im rechtlichen Zusammenhang einen feierlichen, eidlich bekräftigten Aufruf an mögliche Zeugen. Die Übersetzung vermittelt die Funktion, ohne die schwer verständliche Wortfolge „Stimme eines Fluches/Eides“ in den Haupttext zu übernehmen.
- source_word: וְהוּא עֵד
  choice: und Zeuge ist
  rationale: Gibt den rechtlichen Status der betreffenden Person knapp und unmittelbar wieder.
- source_word: אוֹ רָאָה אוֹ יָדָע
  choice: sei es, dass er etwas gesehen hat oder anderweitig davon weiß
  rationale: Die Formulierung wahrt die Alternative zwischen unmittelbarer Wahrnehmung und sonstiger Kenntnis.
- source_word: אִם לֹא יַגִּיד
  choice: es aber nicht meldet
  rationale: Der Hifil von נגד bedeutet bekannt machen oder mitteilen. „Meldet“ passt zum rechtlichen Zusammenhang, ohne zwingend ein formelles Gerichtsverfahren vorauszusetzen.
- source_word: וְנָשָׂא עֲוֺנוֹ
  choice: dann trägt er seine Schuld
  rationale: Die Übersetzung erhält das hebräische Bild des Tragens sowie die rechtlich-moralische Haftung; die mögliche Mitbedeutung der Folgen wird nicht auf „Strafe“ verengt.
theological_decisions:
- issue: Bedeutung von קוֹל אָלָה im rechtlichen Zusammenhang
  choice: öffentlicher Aufruf unter Eid
  alternative: Stimme eines Eides; eidliche Beschwörung; Fluchwort
  rationale: Die funktionale Wiedergabe macht deutlich, dass ein Zeuge durch eine feierliche eidliche Erklärung zur Aussage aufgerufen wird. Die lexikalische Bildhaftigkeit und Mehrdeutigkeit wird in einer Fußnote offengelegt.
- issue: Bedeutung der Wendung וְנָשָׂא עֲוֺנוֹ
  choice: seine Schuld tragen
  alternative: für seine Schuld haften; die Strafe für seine Schuld tragen
  rationale: „Seine Schuld tragen“ bewahrt die theologisch und rechtlich gewichtige hebräische Redeweise, ohne Schuld und Straffolge vorschnell gleichzusetzen.
- issue: Geschlecht in der gesetzlichen Einzelfallformulierung
  choice: geschlechtsübergreifendes „jemand“ mit anschließendem generischem Singular „er“
  alternative: durchgehend geschlechtsneutrale Umformulierung im Plural oder mit wiederholtem „die betreffende Person“
  rationale: נֶפֶשׁ bezeichnet allgemein eine Person, während die folgenden Formen singularisch sind. Die deutsche Formulierung wahrt den Einzelfallcharakter und bleibt verständlich, ohne den Geltungsbereich auf Männer zu beschränken.
translation_notes:
  register: Moderner, würdiger Gesetzesstil mit klarer Satzgliederung. Der Haupttext gibt die rechtliche Funktion von קוֹל אָלָה verständlich wieder; die schwer übertragbare hebräische Idiomatik wird nicht unnötig wörtlich nachgebildet. Alle Fußnotenmarker stehen im Haupttext.
