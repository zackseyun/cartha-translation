source:
  edition: WLC
  text: וְ/הֵבִ֣יא אֶת אֲשָׁמ֣/וֹ לַ/יהוָ֡ה עַ֣ל חַטָּאת/וֹ֩ אֲשֶׁ֨ר חָטָ֜א נְקֵבָ֨ה מִן הַ/צֹּ֥אן כִּשְׂבָּ֛ה אֽוֹ שְׂעִירַ֥ת עִזִּ֖ים לְ/חַטָּ֑את וְ/כִפֶּ֥ר עָלָ֛י/ו הַ/כֹּהֵ֖ן מֵ/חַטָּאתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/006.yaml
  text: 'and he shall bring his guilt offering to Yahweh for his sin that he has committed: a female from the flock[a], a lamb or a female goat, for a sin offering[b]; and the priest shall make atonement for him for his sin.'
translation:
  language: de
  text: 'Und er soll Jahwe wegen seiner Sünde, die er begangen hat, sein Schuldopfer[a] darbringen: ein weibliches Tier vom Kleinvieh, ein weibliches Lamm oder eine weibliche Ziege, als Sündopfer; und der Priester soll für ihn Sühne erwirken für seine Sünde[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Gabe für die Schuld“ beziehungsweise „seine Wiedergutmachungsgabe“. Das hebräische Wort אשם ist mit Schuld und Wiedergutmachung verbunden; später in diesem Vers wird das Tier ausdrücklich als Sündopfer bestimmt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „von seiner Sünde“. Die Formulierung kann hervorheben, dass die Sünde durch die Sühne beseitigt wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: Und er soll … bringen
  rationale: Die Verbform hat im Gesetzestext vorschreibende Bedeutung; „soll“ gibt diese in natürlichem modernem Deutsch wieder.
- source_word: אֲשָׁמוֹ
  choice: seine Schuldgabe
  rationale: אשם bezeichnet Schuld beziehungsweise eine mit Schuld verbundene Wiedergutmachungsgabe. „Schuldgabe“ bewahrt die Unterscheidung zum später ausdrücklich genannten Sündopfer, ohne bereits eine bestimmte Opfertierklasse vorauszusetzen.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als Eigenname „Jahwe“ wiedergegeben.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: wegen seiner Sünde, die er begangen hat
  rationale: עַל bezeichnet hier den Anlass beziehungsweise Grund der Gabe; die hebräische figura etymologica wird idiomatisch wiedergegeben.
- source_word: נְקֵבָה מִן הַצֹּאן
  choice: ein weibliches Tier vom Kleinvieh
  rationale: צאן umfasst hier Schafe und Ziegen; „Kleinvieh“ ist präziser als das im Deutschen leicht nur auf Schafe bezogene „Herde“.
- source_word: כִשְׂבָּה אֽוֹ שְׂעִירַת עִזִּים
  choice: ein weibliches Lamm oder eine weibliche Ziege
  rationale: Beide Möglichkeiten sind ausdrücklich weiblich; die Wiederholung vermeidet jede Unklarheit.
- source_word: לְחַטָּאת
  choice: als Sündopfer
  rationale: חטאת ist hier die kultische Opferbezeichnung. „Als“ gibt die Bestimmung des Tieres natürlich wieder.
- source_word: וְכִפֶּר עָלָיו
  choice: und der Priester soll für ihn Sühne erwirken
  rationale: כפר bezeichnet im priesterlichen Opferkontext den Vollzug von Sühne. Die Formulierung wahrt den kultisch-theologischen Gehalt, ohne eine bestimmte Sühnetheorie einzutragen.
- source_word: מֵחַטָּאתוֹ
  choice: wegen seiner Sünde
  rationale: מן kann hier die Beziehung zur Verfehlung oder deren Beseitigung anzeigen. Im Haupttext ist „wegen“ idiomatisch; die mögliche Entfernungsnuance wird in einer Fußnote erhalten.
theological_decisions:
- issue: Nebeneinander von אשם und חטאת
  choice: „Schuldgabe“ und „Sündopfer“ werden als verschiedene Ausdrücke beibehalten.
  alternative: אשם könnte als „Schuldopfer“ oder allgemeiner als „Gabe für seine Schuld“ wiedergegeben werden; חטאת auch als „Reinigungsopfer“.
  rationale: Der hebräische Text stellt beide Begriffe bewusst nebeneinander. Die Übersetzung glättet diese Spannung nicht, vermeidet aber durch „Schuldgabe“ die irreführende Behauptung, das Tier werde hier eindeutig als das andernorts technisch geregelte Schuldopfer bezeichnet.
- issue: Wiedergabe des Gottesnamens
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Eigenname יהוה wird transparent als „Jahwe“ wiedergegeben.
- issue: Bedeutungsweite von כפר und מן
  choice: „Sühne erwirken … wegen seiner Sünde“
  alternative: „Sühne schaffen … von seiner Sünde“ beziehungsweise eine Formulierung mit „Reinigung“
  rationale: Die gewählte Fassung ist verständlich und kultisch angemessen; die mögliche Vorstellung der Beseitigung der Sünde bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem hebräischen Gesetzesstil, bleibt aber gut lesbar. „Kleinvieh“ präzisiert Schafe und Ziegen; kultische Fachbegriffe werden sparsam und konsistent verwendet.
