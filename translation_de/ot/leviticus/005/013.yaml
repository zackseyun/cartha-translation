base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/013.yaml
  text: Thus the priest shall make atonement for him for his sin that he committed in any one of these matters[a], and he shall be forgiven. And it shall belong to the priest, like the grain offering.
translation:
  language: de
  text: So soll der Priester für ihn wegen seiner Sünde, die er in einem dieser Fälle begangen hat, Sühne erwirken, und ihm wird vergeben. Sie soll dem Priester gehören wie ein Speisopfer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִפֶּר עָלָיו הַכֹּהֵן
  choice: So soll der Priester für ihn … Sühne erwirken
  rationale: כפר mit על bezeichnet hier die priesterliche Kulthandlung zugunsten des Schuldigen. „Sühne erwirken“ ist im Deutschen verständlich und lässt offen, wie diese Sühne näher zu erklären ist.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: wegen seiner Sünde, die er … begangen hat
  rationale: חטאת bezeichnet hier wegen des folgenden Verbs חטא die begangene Sünde, nicht das Sündopfer. „Eine Sünde begehen“ ist natürliches modernes Deutsch.
- source_word: מֵאַחַת מֵאֵלֶּה
  choice: in einem dieser Fälle
  rationale: Die Wendung verweist partitiv auf die zuvor genannten Tatbestände. „In einem dieser Fälle“ ist knapp, klar und kontextgerecht.
- source_word: וְנִסְלַח לוֹ
  choice: und ihm wird vergeben werden
  rationale: Die passive Form bleibt erhalten; ein Vergebender wird nicht ausdrücklich als Subjekt ergänzt.
- source_word: וְהָיְתָה לַכֹּהֵן
  choice: Was von dem Opfer übrig bleibt, soll dem Priester gehören
  rationale: Das feminine Pronomen ist im Deutschen ohne ein ausdrücklich genanntes Bezugswort missverständlich. Der Kontext von Vers 12 macht deutlich, dass der verbleibende Opferanteil gemeint ist; diese Ergänzung wird transparent in einer Fußnote ausgewiesen.
- source_word: כַּמִּנְחָה
  choice: wie beim Speisopfer
  rationale: מנחה bezeichnet in diesem levitischen Opferkontext das Speisopfer. Die Formulierung meint entsprechend der vorausgehenden Regelung die priesterliche Zuteilung wie beim Speisopfer.
theological_decisions:
- issue: Passivische Vergebungsformel
  choice: ihm wird vergeben werden
  alternative: Gott wird ihm vergeben
  rationale: Der hebräische Text nennt den Vergebenden nicht ausdrücklich. Die passive deutsche Wiedergabe bewahrt diese Zurückhaltung und verbindet die Vergebung nicht sprachlich vorschnell mit einer näher ausgeführten Sühnetheorie.
- issue: Bedeutung von חטאת
  choice: Sünde
  alternative: Sündopfer
  rationale: Der Relativsatz „die er begangen hat“ weist auf die Verfehlung als Bedeutung hin, obwohl חטאת in Opfertexten auch das Sündopfer bezeichnen kann.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kultische Fachbegriffe wie „Sühne“ und „Speisopfer“ bleiben wegen ihrer sachlichen Präzision erhalten; unnötig altertümliche Satzformen werden vermieden.
