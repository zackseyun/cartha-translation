revisions:
- from: So soll der Priester für ihn wegen seiner Sünde, die er in einem dieser Fälle begangen hat, Sühne erwirken, und ihm wird vergeben werden.[a] Was von dem Opfer übrig bleibt, soll dem Priester gehören wie beim Speisopfer.
  to: So soll der Priester für ihn wegen seiner Sünde, die er in einem dieser Fälle begangen hat, Sühne erwirken, und ihm wird vergeben. Sie soll dem Priester gehören wie ein Speisopfer.
  rationale: Der Schlusssatz wird ohne inhaltliche Ausformulierung des im Hebräischen nur grammatisch vorausgesetzten Bezugsworts wiedergegeben. Das feminine „sie“ bewahrt die vom hebräischen Text gesetzte Referenz, während „wie ein Speisopfer“ die Vergleichsformel direkt abbildet. Die passive Vergebungsformel bleibt erhalten, ist aber idiomatischer formuliert.
