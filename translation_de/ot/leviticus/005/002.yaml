id: LEV.5.2
reference: Leviticus 5:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: א֣וֹ נֶ֗פֶשׁ אֲשֶׁ֣ר תִּגַּע֮ בְּ/כָל דָּבָ֣ר טָמֵא֒ אוֹ֩ בְ/נִבְלַ֨ת חַיָּ֜ה טְמֵאָ֗ה א֤וֹ בְּ/נִבְלַת֙ בְּהֵמָ֣ה טְמֵאָ֔ה א֕וֹ בְּ/נִבְלַ֖ת שֶׁ֣רֶץ טָמֵ֑א וְ/נֶעְלַ֣ם מִמֶּ֔/נּוּ וְ/ה֥וּא טָמֵ֖א וְ/אָשֵֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/002.yaml
  text: Or if a person touches any unclean thing—whether the carcass of an unclean wild animal[a], or the carcass of unclean livestock, or the carcass of an unclean swarming creature—and it is hidden from him, and he is unclean and becomes guilty[b],
translation:
  language: de
  text: Oder wenn jemand irgendetwas Unreines berührt – sei es den Kadaver eines unreinen Wildtiers, den Kadaver eines unreinen Haustiers oder den Kadaver eines unreinen Kriechtiers – und es ihm verborgen bleibt[a] und er unrein und schuldig wird[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: ohne dass er es bemerkt; wörtlich: »und es ist ihm verborgen«.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet hier Schuld beziehungsweise Haftung im kultisch-rechtlichen Sinn. Die Berührung eines Kadavers wird dadurch nicht ohne Weiteres einer vorsätzlich begangenen moralischen Verfehlung gleichgesetzt.
    reason: cultural_note
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: jemand
  rationale: Im Gesetzestext bezeichnet נֶפֶשׁ eine einzelne Person, nicht speziell die immaterielle »Seele«. »Jemand« ist im Deutschen natürlich und geschlechtsübergreifend.
- source_word: תִּגַּע בְּ
  choice: berührt
  rationale: נגע mit ב bezeichnet hier körperlichen Kontakt; »berührt« gibt dies knapp und direkt wieder.
- source_word: כָל דָּבָר טָמֵא
  choice: irgendetwas Unreines
  rationale: דָּבָר ist weit gefasst und wird durch die folgenden Beispiele näher erläutert. Die substantivierte Form ist im modernen Deutsch natürlicher als »irgendeine unreine Sache«.
- source_word: נִבְלַת
  choice: den Kadaver
  rationale: נְבֵלָה bezeichnet im Reinheitsrecht den toten Körper beziehungsweise das Aas eines Tieres. »Kadaver« ist hier präzise und idiomatisch.
- source_word: חַיָּה טְמֵאָה
  choice: eines unreinen Wildtiers
  rationale: חַיָּה steht hier im Gegensatz zu בְּהֵמָה und bezeichnet ein wild lebendes Landtier.
- source_word: בְּהֵמָה טְמֵאָה
  choice: eines unreinen Herdentiers
  rationale: בְּהֵמָה bezeichnet in dieser Gegenüberstellung domestizierte größere Tiere. »Herdentier« wahrt den Gegensatz zum Wildtier besser als das allgemeinere »Tier«.
- source_word: שֶׁרֶץ טָמֵא
  choice: eines unreinen Kriechtiers
  rationale: שֶׁרֶץ ist eine Sammelkategorie für kleine, sich zahlreich regende oder wimmelnde Tiere. »Kriechtier« ist verständlich und im deutschen Sprachgebrauch für diese levitische Kategorie etabliert, erfasst jedoch nicht jede Nuance des hebräischen Wortes vollständig.
- source_word: וְנֶעְלַם מִמֶּנּוּ
  choice: und es ihm verborgen bleibt
  rationale: 'Die Wiedergabe bewahrt die hebräische Perspektive: Der Sachverhalt ist der Person verborgen, das heißt, sie bemerkt ihn nicht.'
- source_word: וְהוּא טָמֵא
  choice: sodass er unrein ist
  rationale: 'Die Formulierung macht den sachlichen Zusammenhang verständlich: Trotz der Unkenntnis besteht der durch die Berührung eingetretene Unreinheitsstatus. Das maskuline Pronomen folgt dem hebräischen Singular, ohne den Personenkreis einzuschränken.'
- source_word: וְאָשֵׁם
  choice: und Schuld auf sich lädt
  rationale: אָשֵׁם bezeichnet hier entstandene Schuld beziehungsweise Haftung. Die Wendung wahrt den rechtlich-kultischen Charakter besser als eine Formulierung, die vorsätzliche moralische Bosheit nahelegt.
theological_decisions:
- issue: Art der Unreinheit
  choice: טָמֵא/טְמֵאָה wird mit »unrein« wiedergegeben.
  alternative: »unheilig«, »befleckt« oder »sündig«
  rationale: Der Vers behandelt kultische Unreinheit infolge der Berührung eines Tierkadavers. »Unrein« benennt diese levitische Kategorie, ohne sie mit moralischer Bosheit gleichzusetzen.
- issue: Bedeutung von וְאָשֵׁם
  choice: »und Schuld auf sich lädt«
  alternative: »und schuldig wird« oder »und haftbar wird«
  rationale: Das Hebräische verbindet Unreinheit und Schuld beziehungsweise Verantwortlichkeit, ohne hier alle Bedingungen oder die genaue moralische Qualität näher zu erklären. Die Übersetzung bewahrt diese Spannung; die Fußnote schützt zugleich vor einer vorschnellen Gleichsetzung jeder Kadaverberührung mit vorsätzlicher Sünde.
- issue: Generisches grammatisches Geschlecht
  choice: Mit »jemand« wird der umfassende Personenkreis ausgedrückt; anschließend steht entsprechend dem hebräischen Singular »er« beziehungsweise »ihm«.
  alternative: Durchgehend feminine und maskuline Doppelformen oder Pluralformen
  rationale: So bleibt die individuelle Rechtsform des Ausgangstextes erkennbar, während »jemand« deutlich macht, dass die Bestimmung nicht nur Männer betrifft.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit juristisch-kultischer Klarheit. Die Reihung und der am Versende stehende Beistrich lassen erkennen, dass der Satz im folgenden Vers weitergeführt wird. »Kadaver«, »Wildtier«, »Herdentier« und »Kriechtier« halten die Tierkategorien unterscheidbar; die Fußnoten erläutern die hebräische Verborgenheitsformel und den besonderen Schuldbegriff.
