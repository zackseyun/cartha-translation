source:
  edition: WLC
  text: וְ/אִם לֹ֨א תַגִּ֣יע יָד/וֹ֮ דֵּ֣י שֶׂה֒ וְ/הֵבִ֨יא אֶת אֲשָׁמ֜/וֹ אֲשֶׁ֣ר חָטָ֗א שְׁתֵּ֥י תֹרִ֛ים אֽוֹ שְׁנֵ֥י בְנֵֽי יוֹנָ֖ה לַֽ/יהוָ֑ה אֶחָ֥ד לְ/חַטָּ֖את וְ/אֶחָ֥ד לְ/עֹלָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/007.yaml
  text: But if his means do not suffice for a sheep[a], then he shall bring as his guilt offering for the sin that he committed two turtledoves or two young pigeons to Yahweh, one for a sin offering and one for a burnt offering.
translation:
  language: de
  text: 'Wenn aber seine Mittel für ein Schaf nicht ausreichen, soll er dem HERRN als sein Schuldopfer für die Sünde, die er begangen hat, zwei Turteltauben oder zwei junge Tauben bringen: die eine als Sündopfer[a] und die andere als Brandopfer.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Reinigungsopfer«. Das hebräische Wort חַטָּאת kann sowohl »Sünde« als auch das Opfer bezeichnen, das in kultischen Zusammenhängen der Beseitigung von Sünde beziehungsweise Unreinheit dient.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַגִּיע יָדוֹ דֵּי שֶׂה
  choice: seine Mittel für ein Schaf nicht ausreichen
  rationale: Die hebräische Wendung spricht wörtlich davon, dass seine Hand nicht bis zum Benötigten für ein Schaf reicht. Die gewählte Formulierung gibt die wirtschaftliche Unfähigkeit natürlich wieder, ohne stärker als nötig zu paraphrasieren.
- source_word: אֲשָׁמוֹ
  choice: sein Schuldopfer
  rationale: אָשָׁם kann Schuld oder das mit Schuld und Wiedergutmachung verbundene Opfer bezeichnen. Hier verlangt das Verb »bringen« die konkrete Opfergabe; »Schuldopfer« ist der etablierte deutsche Kultbegriff.
- source_word: אֲשֶׁר חָטָא
  choice: für die Sünde, die er begangen hat
  rationale: Die Relativkonstruktion verbindet das Opfer mit der begangenen Verfehlung. Im Deutschen macht die Ergänzung »die Sünde« diesen Bezug verständlich.
- source_word: שְׁתֵּי תֹרִים
  choice: zwei Turteltauben
  rationale: Dies ist die übliche zoologische und kultische Wiedergabe von תֹרִים.
- source_word: שְׁנֵי בְנֵי יוֹנָה
  choice: zwei junge Tauben
  rationale: Die wörtliche Wendung »Söhne einer Taube« bezeichnet junge Tauben; die idiomatische deutsche Wiedergabe bewahrt Art und Altersangabe.
- source_word: לַיהוָה
  choice: dem HERRN
  rationale: Der Gottesname JHWH wird gemäß der ehrfürchtigen jüdischen Lesetradition und der verbreiteten deutschen Bibelkonvention mit »der HERR« wiedergegeben.
- source_word: לְחַטָּאת
  choice: als Sündopfer
  rationale: Im kultischen Zusammenhang bezeichnet חַטָּאת das mit Sünde beziehungsweise Reinigung verbundene Opfer. »Sündopfer« ist die traditionelle, verständliche Hauptwiedergabe; die mögliche Funktionsbezeichnung »Reinigungsopfer« wird in der Fußnote bewahrt.
- source_word: לְעֹלָה
  choice: als Brandopfer
  rationale: עֹלָה bezeichnet das vollständig verbrannte Opfer. »Brandopfer« ist der etablierte und allgemein verständliche deutsche Begriff.
theological_decisions:
- issue: Wiedergabe des Opferbegriffs חַטָּאת
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: Der Begriff kann das mit Sünde verbundene Opfer bezeichnen, wird aber besonders im levitischen Kult auch funktional als Reinigungsopfer verstanden. Die traditionelle Bezeichnung steht im Haupttext; die sachlich wichtige Alternative bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem hebräischen Rechtsstil, bleibt aber natürlich lesbar. Etablierte Opferbegriffe werden konsistent verwendet; echte Bedeutungsbreite wird durch die Fußnote offengehalten.
