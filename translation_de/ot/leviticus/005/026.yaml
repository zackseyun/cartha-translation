  to: Und der Priester soll vor Jahwe für ihn Sühne erwirken, und ihm wird vergeben werden wegen einer jeden der Taten, durch die er Schuld auf sich lädt.[a]
  rationale: Die Revision präzisiert die distributive Aussage von „einer von allem“ und ersetzt die in der Fußnote zweckhaft klingende Formulierung „um ... schuldig zu werden“ durch eine kausale Wiedergabe. Aussage, Passivform der Vergebung und kultischer Sprachregister bleiben erhalten.
