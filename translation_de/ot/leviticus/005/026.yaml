  text: וְ/כִפֶּ֨ר עָלָ֧י/ו הַ/כֹּהֵ֛ן לִ/פְנֵ֥י יְהוָ֖ה וְ/נִסְלַ֣ח ל֑/וֹ עַל אַחַ֛ת מִ/כֹּ֥ל אֲשֶֽׁר יַעֲשֶׂ֖ה לְ/אַשְׁמָ֥ה בָֽ/הּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/026.yaml
  text: And the priest shall make atonement for him before Yahweh[a], and he will be forgiven for any one of all the things by which one may incur guilt.
translation:
  language: de
  text: Und der Priester soll vor Jahwe für ihn Sühne erwirken, und ihm wird vergeben werden wegen einer jeden der Taten, durch die er Schuld auf sich lädt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „wegen einer von allem, was er tut, wodurch er sich schuldig macht“.'
    reason: Die hebräische Wendung עַל אַחַת מִכֹּל אֲשֶׁר יַעֲשֶׂה לְאַשְׁמָה בָּהּ hebt einen einzelnen Fall aus der Gesamtheit der schuldbegründenden Taten hervor; die genaue syntaktische Zuordnung der knappen Schlussformulierung bleibt im Deutschen schwer nachzubilden.
lexical_decisions:
- source_word: וְכִפֶּר
  choice: soll … Sühne erwirken
  rationale: Das Piel von כפר bezeichnet im Opferkontext das wirksame Herbeiführen von Sühne. „Sühne erwirken“ ist im Deutschen verständlich und bewahrt den kultischen Sinn, ohne eine bestimmte Sühnetheorie festzulegen.
- source_word: עָלָיו
  choice: für ihn
  rationale: Bei כפר kennzeichnet עַל die Person, zu deren Gunsten die Sühne geschieht.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Direkte Wiedergabe des bestimmten Nomens im kultischen Zusammenhang.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי bezeichnet hier das Handeln in Jahwes Gegenwart; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: וְנִסְלַח לוֹ
  choice: und ihm wird vergeben werden
  rationale: Das Nifal von סלח drückt die gewährte Vergebung passiv aus. Die Formulierung lässt Gott als den unausgesprochenen Handelnden stehen.
- source_word: עַל אַחַת מִכֹּל
  choice: wegen jeder einzelnen von all den Handlungen
  rationale: Die Wendung hebt jeden einzelnen Fall innerhalb der Gesamtheit möglicher Verfehlungen hervor. „Jeder einzelnen“ gibt diese distributive Aussage natürlich wieder.
- source_word: אֲשֶׁר יַעֲשֶׂה לְאַשְׁמָה בָהּ
  choice: durch die er Schuld auf sich lädt
  rationale: Die Konstruktion beschreibt ein Tun, durch das der Betreffende schuldig wird. „Schuld auf sich laden“ gibt diesen Zusammenhang idiomatisch wieder; gemeint ist hier Schuld, nicht das Schuldopfer.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm יהוה. „Jahwe“ bewahrt den offenbarten Eigennamen und vermeidet die Ersetzung durch einen Titel.
- issue: Unausgesprochener Urheber der Vergebung
  choice: 'Passiv: „ihm wird vergeben werden“'
  alternative: „Gott wird ihm vergeben“
  rationale: Das hebräische Passiv nennt den Vergebenden nicht ausdrücklich. Die Übersetzung erhält diese Form und macht die theologische Implikation nicht expliziter als der Ausgangstext.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kultische Fachsprache bleibt mit „Sühne erwirken“ erhalten; Satzbau und Schuldformulierung sind zugleich für heutige Leser verständlich.
