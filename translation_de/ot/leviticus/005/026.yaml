  source_fidelity: Die Wiedergabe von וְכִפֶּר עָלָיו („für ihn Sühne erwirken“), לִפְנֵי יְהוָה („vor Jahwe“) und וְנִסְלַח לוֹ („ihm wird vergeben werden“) ist sachgerecht. Die Schlusswendung bezeichnet jedoch jeweils einen einzelnen Fall innerhalb der Gesamtheit der schuldbegründenden Taten. „wegen jeder einzelnen von all den Handlungen“ ist im Deutschen weniger präzise als eine Formulierung mit „einer jeden der Taten“.
  naturalness: Der Satz ist insgesamt würdevoll und verständlich. „Einer jeden der Taten“ ist idiomatischer und bildet die distributive hebräische Wendung genauer ab als „jeder einzelnen von all den Handlungen“.
  terminology: „Jahwe“, „Priester“, „Sühne“ und „Schuld“ sind angemessen. „Sühne erwirken“ bewahrt den kultischen Charakter von כפר, ohne eine weitergehende Deutung festzulegen.
