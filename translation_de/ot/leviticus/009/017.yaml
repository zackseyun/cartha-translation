source:
  edition: WLC
  text: וַ/יַּקְרֵב֮ אֶת הַ/מִּנְחָה֒ וַ/יְמַלֵּ֤א כַפּ/וֹ֙ מִמֶּ֔/נָּה וַ/יַּקְטֵ֖ר עַל הַ/מִּזְבֵּ֑חַ מִ/לְּ/בַ֖ד עֹלַ֥ת הַ/בֹּֽקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/017.yaml
  text: Then he presented the grain offering[a], filled his hand from it, and burned it on the altar, besides the morning burnt offering.
translation:
  language: de
  text: Dann brachte er das Speiseopfer dar, füllte seine Hand mit einem Teil davon[a] und ließ ihn auf dem Altar in Rauch aufgehen, zusätzlich zum Morgenbrandopfer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „füllte seine Hand davon“; gemeint ist, dass er eine Portion des Speiseopfers in die Hand nahm, um sie auf dem Altar in Rauch aufgehen zu lassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: brachte … dar
  rationale: Die Hifil-Form von קרב bezeichnet im Opferzusammenhang das Heranbringen beziehungsweise Darbringen. „Brachte … dar“ ist im Deutschen natürlich und bewahrt den kultischen Sinn.
- source_word: הַמִּנְחָה
  choice: das Speiseopfer
  rationale: מִנְחָה bezeichnet in der levitischen Opferordnung das unblutige Opfer aus Getreideprodukten; „Speiseopfer“ ist der geläufige und präzise deutsche Fachausdruck.
- source_word: וַיְמַלֵּא כַפּוֹ מִמֶּנָּה
  choice: füllte seine Hand mit einem Teil davon
  rationale: Die Formulierung hält das konkrete Bild des Hebräischen fest. „Mit einem Teil davon“ gibt den partitiven Sinn von מִמֶּנָּה verständlich wieder, ohne die Menge genauer festzulegen.
- source_word: וַיַּקְטֵר
  choice: ließ ihn … in Rauch aufgehen
  rationale: Das Hifil von קטר bezeichnet im Opferdienst das Verbrennen, bei dem die Opfergabe als Rauch aufsteigt. Diese Wiedergabe bildet den kultischen Vorgang genauer ab als das allgemeinere „verbrannte“.
- source_word: עַל הַמִּזְבֵּחַ
  choice: auf dem Altar
  rationale: Direkte und idiomatische Ortsangabe im Deutschen.
- source_word: מִלְּבַד
  choice: zusätzlich zu
  rationale: Im Kontext bezeichnet מִלְּבַד eine weitere Opferhandlung neben dem bereits vorgeschriebenen Morgenopfer.
- source_word: עֹלַת הַבֹּקֶר
  choice: dem Morgenbrandopfer
  rationale: עֹלָה ist das vollständig auf dem Altar verbrannte Opfer. „Morgenbrandopfer“ ist eine knappe, verständliche Bezeichnung für das regelmäßige morgendliche Brandopfer.
theological_decisions:
- issue: Benennung der עֹלָה
  choice: Brandopfer
  alternative: Ganzopfer
  rationale: „Brandopfer“ ist im Deutschen etabliert und bezeichnet hier die Opferart, ohne eine zusätzliche theologische Deutung einzutragen. „Ganzopfer“ würde den vollständigen Verbrauch stärker hervorheben, ist aber weniger geläufig.
translation_notes:
  register: Moderne, würdige Standardsprache mit den im deutschen Bibel- und Kultwortschatz geläufigen Begriffen „Speiseopfer“, „Altar“ und „Brandopfer“. Die konkrete hebräische Bildsprache des Füllens der Hand bleibt erhalten.
