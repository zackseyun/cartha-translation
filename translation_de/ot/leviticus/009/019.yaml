  text: 'and the fat pieces from the ox and from the ram: the fat tail[a], the covering fat, the kidneys, and the lobe of the liver.'
translation:
  language: de
  text: 'und die Fettstücke vom Rind[a] und vom Widder: den Fettschwanz, das Fett, das die Eingeweide bedeckt, die Nieren und den Leberlappen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »vom Stier« beziehungsweise »vom Ochsen«. Das hebräische Wort kann allgemein ein Rind bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת הַחֲלָבִים
  choice: dazu die Fettstücke
  rationale: Die Verbindung setzt die Aufzählung aus dem vorherigen Vers fort; der Plural bezeichnet im Opferkontext die dafür bestimmten Fettteile.
- source_word: מִן הַשּׁוֹר
  choice: vom Rind
  rationale: שׁוֹר bezeichnet ein Tier aus der Rindergattung und kann je nach Kontext auch als »Stier« oder »Ochse« wiedergegeben werden. »Rind« bewahrt hier die lexikalische Breite.
- source_word: וּמִן הָאַיִל
  choice: und vom Widder
  rationale: אַיִל bezeichnet im Opferkontext eindeutig einen Widder.
- source_word: הָאַלְיָה
  choice: den Fettschwanz
  rationale: Der Ausdruck bezeichnet den besonders fettreichen Schwanz eines Schafes und ist ein fester Begriff in den Opferbestimmungen.
- source_word: הַמְכַסֶּה
  choice: das bedeckende Fett
  rationale: Das substantivierte Partizip von כסה, »bedecken«, bezeichnet in dieser anatomischen Liste das Fett, das die inneren Organe bedeckt.
- source_word: הַכְּלָיֹת
  choice: die Nieren
  rationale: Dies ist die gewöhnliche anatomische Bedeutung und passt zur kultischen Aufzählung.
- source_word: יֹתֶרֶת הַכָּבֵד
  choice: den Leberlappen
  rationale: Die Wendung bezeichnet einen bestimmten an der Leber befindlichen Teil; »Leberlappen« ist eine verständliche, herkömmliche deutsche Wiedergabe, ohne die anatomische Identifizierung stärker festzulegen als der Text.
