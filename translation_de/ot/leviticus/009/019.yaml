translation_notes:
  register: Moderne, würdevolle Standardsprache. Die elliptische Fortsetzung der Aufzählung aus Vers 18 bleibt durch »dazu« erkennbar; die kultisch-anatomischen Begriffe werden knapp und verständlich wiedergegeben.
