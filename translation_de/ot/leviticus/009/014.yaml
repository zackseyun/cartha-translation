  text: וַ/יִּרְחַ֥ץ אֶת הַ/קֶּ֖רֶב וְ/אֶת הַ/כְּרָעָ֑יִם וַ/יַּקְטֵ֥ר עַל הָ/עֹלָ֖ה הַ/מִּזְבֵּֽחָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/014.yaml
  text: He washed the entrails and the lower legs[a], and he burned them on the altar, on top of the burnt offering.
translation:
  language: de
  text: Er wusch die Eingeweide und die Unterschenkel und ließ sie auf dem Altar, auf dem Brandopfer, in Rauch aufgehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְחַץ
  choice: er wusch
  rationale: רחץ bezeichnet im Opferkontext das Waschen mit Wasser; „wusch“ ist die klare und natürliche deutsche Entsprechung.
- source_word: הַקֶּרֶב
  choice: die Eingeweide
  rationale: קֶרֶב bezeichnet hier die inneren Organe des Opfertiers; „Eingeweide“ ist im kultischen Zusammenhang konkret und verständlich.
- source_word: הַכְּרָעָיִם
  choice: die Unterschenkel
  rationale: כְּרָעַיִם meint die Schenkel beziehungsweise unteren Beinabschnitte des Tieres; „Unterschenkel“ bewahrt die anatomische Spezifik.
- source_word: וַיַּקְטֵר
  choice: ließ sie … in Rauch aufgehen
  rationale: Der Hifil von קטר bezeichnet in priesterlichen Opfertexten das Verbrennen auf dem Altar als Opferhandlung, bei der die Teile in Rauch aufgehen; die Formulierung wahrt diese kultische Nuance.
- source_word: עַל הָעֹלָה
  choice: über dem Brandopfer
  rationale: עַל bezeichnet hier die Lage auf beziehungsweise oberhalb des bereits auf dem Altar befindlichen Brandopfers. „Über dem“ gibt dies natürlich wieder, ohne eine unnötig präzise räumliche Deutung zu erzwingen.
- source_word: הָעֹלָה
  choice: das Brandopfer
  rationale: עֹלָה ist der übliche Fachbegriff für das vollständig verbrannte Opfer; „Brandopfer“ ist die etablierte und verständliche deutsche Wiedergabe.
- source_word: הַמִּזְבֵּחָה
  choice: auf dem Altar
  rationale: מִזְבֵּחַ bedeutet „Altar“; das direktionale ה wird zusammen mit der Satzkonstruktion idiomatisch durch „auf dem Altar“ ausgedrückt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlicher kultischer Terminologie. Die Wendung „in Rauch aufgehen lassen“ bildet den opfersprachlichen Sinn von קטר genauer ab als das allgemeinere „verbrennen“, ohne interpretative Zusätze einzuführen.
