  text: וַ/יֹּ֣אמֶר אֶֽל אַהֲרֹ֗ן קַח לְ֠/ךָ עֵ֣גֶל בֶּן בָּקָ֧ר לְ/חַטָּ֛את וְ/אַ֥יִל לְ/עֹלָ֖ה תְּמִימִ֑ם וְ/הַקְרֵ֖ב לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/002.yaml
  text: And he said to Aaron[a], “Take for yourself a calf, a son of the herd, for a sin offering, and a ram for a burnt offering, both without blemish, and present them before Yahweh.”
translation:
  language: de
  text: 'Und er sagte zu Aaron: »Nimm dir ein Kalb[a] als Sündopfer und einen Widder als Brandopfer, beide makellos, und bring sie vor Jahwe.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »ein Kalb, ein Sohn des Rindviehs«; gemeint ist ein junges Rind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל־אַהֲרֹן
  choice: Und er sagte zu Aaron
  rationale: Der Wayyiqtol führt die nächste Handlung im hebräischen Erzählfluss ein; »Und er sagte« bewahrt diesen Anschluss, ohne die zeitliche Abfolge stärker auszudeuten.
- source_word: קַח לְךָ
  choice: Nimm dir
  rationale: Das ethische Dativpronomen לְךָ gibt der Aufforderung eine persönliche beziehungsweise reflexive Nuance, die im Deutschen mit »dir« knapp und natürlich erhalten bleibt.
- source_word: עֵגֶל בֶּן־בָּקָר
  choice: ein Kalb[a]
  rationale: עֵגֶל bezeichnet ein Kalb; בֶּן־בָּקָר präzisiert es wörtlich als Jungtier des Rindes. Die natürliche deutsche Hauptübersetzung vermeidet die schwerfällige Wiedergabe »Kalb, Sohn des Rindes«; die Form der hebräischen Wendung wird in der Fußnote dokumentiert.
- source_word: לְחַטָּאת
  choice: als Sündopfer
  rationale: חַטָּאת bezeichnet in diesem kultischen Zusammenhang das Opfer für Sünde, nicht lediglich die abstrakte Sünde. »Als Sündopfer« gibt Funktion und Fachbedeutung klar wieder.
- source_word: וְאַיִל לְעֹלָה
  choice: und einen Widder als Brandopfer
  rationale: אַיִל ist der übliche Ausdruck für einen Widder; עֹלָה ist der feste kultische Begriff für das vollständig verbrannte Opfer.
- source_word: תְּמִימִם
  choice: beide makellos
  rationale: Das Adjektiv steht im Plural und bezieht sich daher auf beide Tiere. »Beide« macht diesen Bezug im Deutschen ausdrücklich und eindeutig.
- source_word: וְהַקְרֵב
  choice: und bring sie
  rationale: Der Hifil von קרב bedeutet hier »heranbringen/vorbringen«. »Bring sie« wahrt den Unterschied zwischen dem Heranbringen der Tiere und den erst anschließend beschriebenen Opferhandlungen.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: Die kultische Wendung bezeichnet das Bringen in die Gegenwart Jahwes; »vor Jahwe« ist knapp, natürlich und bewahrt den Gottesnamen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. »Jahwe« gibt den offenbarten Bundesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von חַטָּאת im Opferkontext
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: »Sündopfer« ist der im Deutschen verständliche und etablierte kultische Begriff. Die mögliche Betonung der reinigenden Wirkung wird nicht als alleinige Deutung in den Haupttext eingetragen.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrtem hebräischem Erzählanschluss. Die kultischen Fachbegriffe »Sündopfer« und »Brandopfer« bleiben erhalten; unnötig wörtliche und im Deutschen schwer verständliche Formulierungen werden in der Fußnote erläutert.
