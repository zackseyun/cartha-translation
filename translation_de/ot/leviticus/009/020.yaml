  text: וַ/יָּשִׂ֥ימוּ אֶת הַ/חֲלָבִ֖ים עַל הֶ/חָז֑וֹת וַ/יַּקְטֵ֥ר הַ/חֲלָבִ֖ים הַ/מִּזְבֵּֽחָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/020.yaml
  text: They placed the fat pieces on the breasts[a], and he burned the fat pieces on the altar.
translation:
  language: de
  text: Sie legten die Fettstücke auf die Bruststücke. Dann verbrannte er die Fettstücke auf dem Altar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder genauer: Er ließ die Fettstücke auf dem Altar in Rauch aufgehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: Sie legten
  rationale: שׂים bedeutet „legen, setzen, platzieren“. „Legten“ bezeichnet die konkrete rituelle Handlung im Deutschen natürlich und präzise.
- source_word: הַחֲלָבִים
  choice: die Fettstücke
  rationale: Der Plural von חֵלֶב bezeichnet hier die für das Opfer abgetrennten Fettanteile. „Fettstücke“ gibt den konkreten Plural besser wieder als das abstraktere „Fett“.
- source_word: עַל הֶחָזוֹת
  choice: auf die Bruststücke
  rationale: חָזֶה bezeichnet im Opferkontext den Brustanteil des Tieres. „Bruststücke“ ist im Deutschen anatomisch und rituell verständlicher als „Brüste“.
- source_word: וַיַּקְטֵר
  choice: Dann verbrannte er
  rationale: קטר bezeichnet im priesterlichen Opferkontext das Verbrennen auf dem Altar, wobei das Aufsteigen von Rauch mitgedacht ist. „Verbrannte“ ist klar und natürlich; die genauere Rauch-Nuance bleibt in der Fußnote erhalten.
- source_word: הַמִּזְבֵּחָה
  choice: auf dem Altar
  rationale: 'Die Richtungsendung an מִזְבֵּחַ wird nach קטר idiomatisch als Ortsangabe der Opferverbrennung wiedergegeben: „auf dem Altar“.'
theological_decisions: []
translation_notes:
