id: LEV.9.6
reference: Leviticus 9:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה זֶ֧ה הַ/דָּבָ֛ר אֲשֶׁר צִוָּ֥ה יְהוָ֖ה תַּעֲשׂ֑וּ וְ/יֵרָ֥א אֲלֵי/כֶ֖ם כְּב֥וֹד יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/006.yaml
  text: And Moses said[a], “This is the thing that Yahweh has commanded you to do, that the glory of Yahweh may appear to you.”
translation:
  language: de
  text: 'Und Mose sagte: »Dies ist, was Jahwe euch zu tun geboten hat, damit die Herrlichkeit Jahwes euch erscheint.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »… und die Herrlichkeit Jahwes wird euch erscheinen.«'
    reason: Der hebräische Satz kann statt als Zweck- oder Folgesatz auch als koordinierte Zukunftsaussage verstanden werden.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und … sagte
  rationale: Das Waw mit der Erzählform führt die Handlung weiter; „Und … sagte“ gibt den schlichten Erzählfluss wieder, ohne eine genauere zeitliche oder logische Beziehung hinzuzufügen.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Im Deutschen übliche Form des hebräischen Personennamens.
- source_word: זֶה הַדָּבָר
  choice: Dies ist, was
  rationale: Die Wendung bezeichnet konkret das nun auszuführende Gebot. „Dies ist, was“ ist im modernen Deutschen natürlicher als das wörtlichere „Dies ist die Sache, die“, bewahrt aber den hinweisenden Charakter.
- source_word: צִוָּה
  choice: geboten hat
  rationale: צוה bezeichnet ein autoritatives Gebot. Das Perfekt wird mit dem deutschen Perfekt natürlich wiedergegeben und verweist auf Jahwes bereits erteilten Auftrag.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt; „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: תַּעֲשׂוּ
  choice: euch zu tun
  rationale: Die Form richtet sich an mehrere Angesprochene. Zusammen mit „geboten hat“ ergibt sich eine natürliche deutsche Konstruktion.
- source_word: וְיֵרָא
  choice: damit … erscheint
  rationale: Nach der Aufforderung kann die Form eine beabsichtigte oder daraus folgende Erscheinung ausdrücken. „Damit“ wahrt diese enge Verknüpfung, ohne die Erscheinung selbst als weiteres Gebot darzustellen.
- source_word: אֲלֵיכֶם
  choice: euch
  rationale: Bei „erscheinen“ gibt der deutsche Dativ die Personen, denen die Erscheinung zuteilwird, idiomatisch wieder.
- source_word: כְּבוֹד יְהוָה
  choice: die Herrlichkeit Jahwes
  rationale: Die Genitivverbindung bewahrt den vertrauten biblischen Ausdruck für die wahrnehmbare göttliche Majestät.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. Die Wiedergabe „Jahwe“ bewahrt ihn als persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Sinn der Schlussklausel וְיֵרָא אֲלֵיכֶם כְּבוֹד יְהוָה
  choice: 'Zweck oder Folge: „damit die Herrlichkeit Jahwes euch erscheint“'
  alternative: 'Koordinierte Zukunftsaussage: „und die Herrlichkeit Jahwes wird euch erscheinen“'
  rationale: Die hebräische Verbindung kann die Erscheinung als Zweck beziehungsweise Folge des gebotenen Handelns oder als anschließende Verheißung ausdrücken. Der Haupttext gibt die erste Möglichkeit wieder; die Fußnote bewahrt die ebenso mögliche Zukunftsaussage.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung ist gut verständlich, vermeidet unnötig altertümliche Syntax und bewahrt zugleich den biblischen Leitbegriff „Herrlichkeit“ sowie den Gottesnamen Jahwe.
