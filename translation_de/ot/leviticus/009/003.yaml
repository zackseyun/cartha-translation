base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/003.yaml
  text: And to the sons of Israel you shall speak[a], saying, ‘Take a male goat for a sin offering, and a calf and a lamb, each a year old, without blemish, for a burnt offering.’
translation:
  language: de
  text: 'Und zu den Israeliten sollst du sagen: »Nehmt einen Ziegenbock zum Sündopfer[a] sowie ein Kalb und ein Lamm, beide einjährig und ohne Fehler, zum Brandopfer.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Reinigungsopfer«. Das hebräische חַטָּאת kann in priesterlichen Opfertexten die reinigende Funktion des Opfers hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶל בְּנֵי יִשְׂרָאֵל
  choice: Und zu den Israeliten
  rationale: Die Wendung bezeichnet das Volk Israel als Adressaten. „Israeliten“ ist im modernen Deutschen natürlich und schließt die Gemeinschaft ein, ohne das hebräische Idiom unnötig wörtlich als „Söhne Israels“ wiederzugeben.
- source_word: תְּדַבֵּר לֵ/אמֹר
  choice: sollst du sagen
  rationale: Die deutsche Form gibt den an Mose gerichteten Weisungscharakter des Imperfekts sowie die Funktion des hebräischen Redeformulars idiomatisch wieder.
- source_word: קְחוּ
  choice: Nehmt
  rationale: Der Pluralimperativ richtet sich unmittelbar an die Israeliten; „Nehmt“ entspricht der Grundbedeutung von לקח, ohne eine im Verb nicht ausdrücklich enthaltene Zielrichtung hinzuzufügen.
- source_word: שְׂעִיר עִזִּים
  choice: einen Ziegenbock
  rationale: Die Konstruktverbindung bezeichnet ausdrücklich ein männliches Tier aus den Ziegen; „Ziegenbock“ ist präzise und geläufig.
- source_word: לְ/חַטָּאת
  choice: zum Sündopfer
  rationale: Im kultischen Zusammenhang bezeichnet חַטָּאת eine Opfergattung. „Sündopfer“ ist die etablierte und verständliche deutsche Bezeichnung; die mögliche Akzentuierung als Reinigungsopfer wird in der Fußnote bewahrt.
- source_word: וְ/עֵגֶל וָ/כֶבֶשׂ
  choice: sowie ein Kalb und ein Lamm
  rationale: עֵגֶל und כֶבֶשׂ werden mit ihren gewöhnlichen konkreten Tierbezeichnungen wiedergegeben. „sowie“ ordnet beide Tiere gemeinsam dem folgenden Brandopfer zu.
- source_word: בְּנֵי שָׁנָה
  choice: beide einjährig
  rationale: Die maskuline Pluralform bezieht sich auf Kalb und Lamm. „beide einjährig“ macht diesen distributiven Bezug im Deutschen klar.
- source_word: תְּמִימִם
  choice: ohne Fehler
  rationale: Im Opferrecht bezeichnet das Wort Tiere ohne körperlichen Makel. „ohne Fehler“ ist im modernen Deutsch klar und vermeidet die missverständliche absolute Aussage „vollkommen“.
- source_word: לְ/עֹלָה
  choice: zum Brandopfer
  rationale: עֹלָה bezeichnet hier die vollständig verbrannte Opfergabe. „Brandopfer“ ist die etablierte, sachlich passende deutsche Benennung.
theological_decisions:
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: Die hebräische Wendung ist eine feste Bezeichnung des Volkes und nicht auf dessen männliche Angehörige zu verengen. „Israeliten“ gibt den korporativen Adressatenkreis im heutigen Deutsch sachgerecht wieder, während „Söhne Israels“ die Form stärker abbilden, aber missverständlich exklusiv wirken kann.
- issue: Wiedergabe von חַטָּאת im priesterlichen Opferkontext
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: Der Ausdruck bezeichnet eindeutig eine Opferkategorie, lässt aber hinsichtlich ihrer hervorgehobenen Funktion eine Spannung zwischen Sühne für Sünde und kultischer Reinigung erkennen. Der Haupttext verwendet die bekannte Bezeichnung „Sündopfer“; die alternative fachlich begründete Wiedergabe bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer direkter Rede. Die traditionelle kultische Terminologie „Sündopfer“ und „Brandopfer“ bleibt wegen ihrer Verständlichkeit und Wiedererkennbarkeit erhalten; schwerfällige Hebraismen werden vermieden.
