  text: וַ/יַּקְרֵ֕ב אֵ֖ת קָרְבַּ֣ן הָ/עָ֑ם וַ/יִּקַּ֞ח אֶת שְׂעִ֤יר הַֽ/חַטָּאת֙ אֲשֶׁ֣ר לָ/עָ֔ם וַ/יִּשְׁחָטֵ֥/הוּ וַֽ/יְחַטְּאֵ֖/הוּ כָּ/רִאשֽׁוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/015.yaml
  text: Then he presented the people's offering[a], and he took the goat of the sin offering that was for the people, and slaughtered it and offered it for sin, as with the first one.
translation:
  language: de
  text: Dann brachte er die Opfergabe des Volkes dar. Er nahm den Bock des Sündopfers, der für das Volk bestimmt war, schlachtete ihn und opferte ihn als Sündopfer dar, wie beim ersten[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „führte mit ihm den Reinigungsritus durch“. Das hebräische Verb kann im priesterlichen Sprachgebrauch das Reinigen beziehungsweise Beseitigen von Sünde oder Unreinheit durch den Sündopferritus bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: brachte … dar
  rationale: Im Opferkontext bezeichnet das Hifil von קרב das Heranbringen bzw. Darbringen einer Opfergabe. Die deutsche Wendung ist natürlich und lässt den genauen Umfang der rituellen Handlung offen.
- source_word: קָרְבַּן הָעָם
  choice: die Opfergabe des Volkes
  rationale: קָרְבָּן ist eine allgemeine Bezeichnung für eine dargebrachte Gabe; die Genitivfügung gibt den hebräischen Status constructus klar wieder.
- source_word: שְׂעִיר הַחַטָּאת
  choice: den Bock des Sündopfers
  rationale: שְׂעִיר bezeichnet hier einen Ziegenbock, während חַטָּאת im kultischen Zusammenhang das Sündopfer bezeichnet.
- source_word: אֲשֶׁר לָעָם
  choice: der für das Volk bestimmt war
  rationale: Die Präposition ל bezeichnet hier die Zuordnung bzw. Bestimmung zugunsten des Volkes, nicht bloß Besitz.
- source_word: וַיִּשְׁחָטֵהוּ
  choice: schlachtete ihn
  rationale: שׁחט ist das übliche Verb für das rituelle Schlachten eines Opfertieres.
- source_word: וַיְחַטְּאֵהוּ
  choice: vollzog mit ihm das Sündopfer
  rationale: Das Piel von חטא bezeichnet hier die Durchführung des Sündopferritus mit dem Tier. Diese Formulierung vermeidet die missverständliche Aussage, der Bock selbst sei gereinigt worden.
- source_word: כָּרִאשׁוֹן
  choice: wie mit dem ersten
  rationale: Die Wendung verweist auf das zuvor behandelte Sündopfer und zeigt, dass entsprechend verfahren wurde.
theological_decisions:
- issue: Bedeutung von חַטָּאת im Opferkontext
  choice: Sündopfer
  alternative: Sünde
  rationale: Der unmittelbare kultische Kontext bezeichnet mit חַטָּאת das Opfer beziehungsweise den Opferritus, nicht die abstrakte Sünde.
- issue: Bedeutung von וַיְחַטְּאֵהוּ
  choice: vollzog mit ihm das Sündopfer
  alternative: reinigte/entsündigte ihn; brachte ihn als Sündopfer dar
  rationale: Die hebräische Form kann im priesterlichen Sprachgebrauch den reinigenden bzw. entsündigenden Vollzug des Sündopferritus bezeichnen. Die Hauptübersetzung wahrt den rituellen Sinn, ohne eine Reinigung des Tieres zu behaupten oder ausdrücklich einen anderen theologischen Fachbegriff einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Opfergabe“ und „Sündopfer“ bewahren die kultische Terminologie; „vollzog“ macht die rituelle Handlung verständlich, ohne die semantische Spannung des hebräischen Verbs völlig aufzulösen.
