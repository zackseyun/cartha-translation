  text: וַ/יְהִי֙ בַּ/יּ֣וֹם הַ/שְּׁמִינִ֔י קָרָ֣א מֹשֶׁ֔ה לְ/אַהֲרֹ֖ן וּ/לְ/בָנָ֑י/ו וּ/לְ/זִקְנֵ֖י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/001.yaml
  text: And it happened on the eighth day that Moses called Aaron and his sons and the elders of Israel[a].
translation:
  language: de
  text: Am achten Tag rief Mose Aaron, seine Söhne und die Ältesten Israels.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Mose rief Aaron, seine Söhne und die Ältesten Israels herbei«; das hebräische Verb kann hier »rufen« oder »herbeirufen« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: unmarkiert in der deutschen Satzkonstruktion
  rationale: Die hebräische Erzählungsform leitet den nächsten Vorgang ein. Eine wörtliche Wiedergabe wie »Und es geschah« wäre im modernen Deutschen unnötig schwerfällig; der zeitliche Satzanfang trägt den Erzählfortgang natürlich.
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: Am achten Tag
  rationale: Dies gibt die Zeitangabe direkt wieder, ohne den im Zusammenhang erschließbaren Zusatz »danach« in den Text einzufügen.
- source_word: קָרָא
  choice: rief … zusammen
  rationale: Mit den durch לְ markierten Personen bezeichnet קרא hier das Herbeirufen beziehungsweise Zusammenrufen. Die deutsche Wendung ist natürlich und bildet den kontextuellen Sinn ab.
- source_word: לְאַהֲרֹן
  choice: Aaron
  rationale: Der Personenname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: וּלְבָנָיו
  choice: seine Söhne
  rationale: Im priesterlichen Zusammenhang sind Aarons männliche Nachkommen gemeint; »Söhne« ist daher lexikalisch und sachlich präzise.
- source_word: וּלְזִקְנֵי יִשְׂרָאֵל
  choice: die Ältesten Israels
  rationale: Die feste Wendung bezeichnet die anerkannten führenden Vertreter Israels und wird im Deutschen idiomatisch als »die Ältesten Israels« wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Erzählweise des Hebräischen bleibt erhalten; eine archaisierende Formel wie »Und es geschah« wird vermieden.
