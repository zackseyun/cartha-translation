translation:
  language: de
  text: Das Fleisch und die Haut aber verbrannte er im Feuer außerhalb des Lagers.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֶת
  choice: aber
  rationale: Die Konjunktion führt die Handlung fort, markiert im Zusammenhang jedoch zugleich den Gegensatz zu dem, was nach Vers 10 auf dem Altar verbrannt wurde. Das unbetonte „aber“ an zweiter Stelle gibt diese Funktion im Deutschen natürlich wieder; אֵת bleibt als Akkusativzeichen unübersetzt.
- source_word: הַ/בָּשָׂר
  choice: das Fleisch
  rationale: בָּשָׂר bezeichnet hier das Fleisch des Opfertiers. „Fleisch“ ist im kultischen Zusammenhang präzise und vermeidet die auf Nahrung verengte Wirkung von „Fleischware“ oder ähnlichen Ausdrücken.
- source_word: הָ/עוֹר
  choice: die Haut
  rationale: עוֹר bezeichnet die Haut beziehungsweise das Fell des Tieres. „Haut“ ist im modernen Standarddeutsch klar und sachlich; „Fell“ könnte eine erhaltene Behaarung stärker voraussetzen, als der Text ausdrückt.
- source_word: שָׂרַף
  choice: verbrannte er
  rationale: Das Verb bezeichnet das Verbrennen. „Verbrannte“ gibt die vollzogene Handlung knapp wieder, ohne eine zusätzliche Deutung der rituellen Entsorgung einzutragen.
- source_word: בָּ/אֵשׁ
  choice: verbrannte
  rationale: Das Mittel „mit Feuer“ ist im deutschen Verb „verbrennen“ bereits enthalten. Eine ausdrückliche Wiedergabe als „verbrannte er im Feuer“ wäre möglich, klänge hier jedoch unnötig doppelt.
- source_word: מִ/חוּץ לַ/מַּחֲנֶה
  choice: außerhalb des Lagers
  rationale: Die Wendung bezeichnet den Ort jenseits des israelitischen Lagers. „Außerhalb des Lagers“ ist natürlich, eindeutig und bewahrt die kultisch-räumliche Aussage.
theological_decisions:
- issue: Rituelle Beseitigung im Opferzusammenhang
  choice: Die konkrete Handlung des Verbrennens außerhalb des Lagers wird ohne zusätzliche Symbolik wiedergegeben.
  alternative: Eine typologische Formulierung, die spätere biblische Bezüge hervorhebt.
  rationale: Der hebräische Vers beschreibt an dieser Stelle das priesterliche Vorgehen. Spätere theologische Deutungen sollen nicht in den Wortlaut der Übersetzung eingetragen werden.
translation_notes:
  register: Moderner, würdiger Standardstil. Die Wortstellung mit nachgestelltem „aber“ bewahrt den fortlaufenden Erzählton und macht zugleich den sachlichen Kontrast zum vorangehenden Altargeschehen deutlich. Keine Fußnote ist nötig, da die möglichen Alternativen den Sinn im Deutschen nicht wesentlich verändern.
