id: LEV.9.12
reference: Leviticus 9:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּשְׁחַ֖ט אֶת הָ/עֹלָ֑ה וַ֠/יַּמְצִאוּ בְּנֵ֨י אַהֲרֹ֤ן אֵלָי/ו֙ אֶת הַ/דָּ֔ם וַ/יִּזְרְקֵ֥/הוּ עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/012.yaml
  text: Then he slaughtered the burnt offering[a], and Aaron’s sons brought the blood to him, and he splashed it against the altar on all sides.
translation:
  language: de
  text: Dann schlachtete er das Brandopfer. Aarons Söhne reichten ihm das Blut, und er sprengte es ringsum an den Altar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das mit „sprengte“ wiedergegebene hebräische Verb bezeichnet ein kräftiges Werfen oder Schleudern des Blutes, nicht ein feines Besprengen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחַט
  choice: Dann schlachtete er
  rationale: שׁחט bezeichnet im Opferzusammenhang das rituelle Schlachten; „dann“ gibt die fortschreitende Erzählfolge natürlich wieder.
- source_word: הָעֹלָה
  choice: das Brandopfer
  rationale: עֹלָה ist der übliche Fachbegriff für das vollständig verbrannte Opfer; „Brandopfer“ ist im Deutschen etabliert und verständlich.
- source_word: וַיַּמְצִאוּ
  choice: reichten
  rationale: Das Verb beschreibt hier, dass Aarons Söhne Aaron das Blut zur weiteren kultischen Verwendung zukommen ließen; „reichten“ gibt den unmittelbaren Vorgang knapp wieder.
- source_word: בְּנֵי אַהֲרֹן
  choice: Aarons Söhne
  rationale: Natürliche moderne Wiedergabe der familiären und priesterlichen Bezeichnung.
- source_word: אֵלָיו אֶת הַדָּם
  choice: ihm das Blut
  rationale: Bewahrt Richtung und bestimmtes Objekt ohne unnötige Ergänzung.
- source_word: וַיִּזְרְקֵהוּ
  choice: er sprengte es
  rationale: זרק bezeichnet beim Blutritus ein kräftiges Werfen beziehungsweise Sprengen des Blutes und nicht ein feines Besprengen.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: ringsum an den Altar
  rationale: „an den Altar“ bildet die gerichtete Blutapplikation ab; „ringsum“ bewahrt den räumlichen Sinn von סביב.
