  text: וַ֠/יַּקְרִבוּ בְּנֵ֨י אַהֲרֹ֣ן אֶת הַ/דָּם֮ אֵלָי/ו֒ וַ/יִּטְבֹּ֤ל אֶצְבָּע/וֹ֙ בַּ/דָּ֔ם וַ/יִּתֵּ֖ן עַל קַרְנ֣וֹת הַ/מִּזְבֵּ֑חַ וְ/אֶת הַ/דָּ֣ם יָצַ֔ק אֶל יְס֖וֹד הַ/מִּזְבֵּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/009.yaml
  text: And Aaron’s sons brought the blood to him[a], and he dipped his finger in the blood and put it on the horns of the altar[c][b], and he poured out the blood at the base of the altar.
translation:
  language: de
  text: Aarons Söhne brachten ihm das Blut[a]. Er tauchte seinen Finger in das Blut und strich davon an die Hörner des Altars[b]. Das Blut goss er an den Sockel des Altars[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »reichten ihm das Blut« beziehungsweise »brachten das Blut zu ihm heran«; das hebräische Verb kann im rituellen Zusammenhang auch das Darbringen oder Präsentieren bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Die »Hörner« waren hornartige Vorsprünge an den Ecken des Altars.
    reason: cultural_note
  - marker: c
    text: 'Oder: »an das Fundament des Altars«. Das hebräische Wort bezeichnet den unteren tragenden Teil des Altars.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרִבוּ
  choice: brachten
  rationale: Das Hifil von קרב bedeutet »heranbringen« oder im kultischen Zusammenhang »darbringen/präsentieren«. »Brachten« ist natürlich und bewahrt die konkrete Bewegung zu Aaron.
- source_word: בְּנֵי אַהֲרֹן
  choice: Aarons Söhne
  rationale: Die hebräische Status-constructus-Verbindung wird im modernen Deutschen idiomatisch als Genitivverbindung wiedergegeben.
- source_word: הַדָּם
  choice: das Blut
  rationale: Der bestimmte Artikel bezeichnet das bereits im Zusammenhang vorausgesetzte Opferblut.
- source_word: אֵלָיו
  choice: ihm
  rationale: Das Pronomen bleibt erhalten; sein nächstliegender Bezug ist Aaron, der im Kontext die Handlung vollzieht.
- source_word: וַיִּטְבֹּל אֶצְבָּעוֹ
  choice: Er tauchte seinen Finger
  rationale: טבל bezeichnet das Eintauchen. »Tauchte ... in« ist im Deutschen für diese konkrete Handlung klar und natürlich.
- source_word: וַיִּתֵּן עַל
  choice: strich davon an
  rationale: Wörtlich steht »gab/setzte auf«. Im Zusammenhang beschreibt die Wendung das Auftragen von Blut; »strich davon an« gibt die Handlung idiomatisch wieder, ohne eine besondere Ritualtechnik hinzuzufügen.
- source_word: קַרְנוֹת הַמִּזְבֵּחַ
  choice: die Hörner des Altars
  rationale: Die traditionelle und sachlich präzise Bezeichnung für die hornartigen Vorsprünge an den Altarecken wird beibehalten.
- source_word: וְאֶת הַדָּם יָצַק
  choice: Das übrige Blut goss er
  rationale: 'יצק bedeutet »gießen«. »Das übrige« ist aus der Abfolge erschlossen: Ein Teil wurde zuvor an die Altarhörner gestrichen, danach wurde das Blut ausgegossen.'
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: an den Fuß des Altars
  rationale: יסוד bezeichnet Fundament oder Sockel. »Fuß des Altars« ist anschauliches, natürliches Deutsch für dessen unteren Bereich; die Richtungspräposition אֶל wird durch »an« wiedergegeben.
theological_decisions:
- issue: Bezugswort des Pronomens אֵלָיו
  choice: Das Blut wurde Aaron gebracht.
  alternative: Das Pronomen könnte auf einen anderen aus dem Zusammenhang erschlossenen Bezugspunkt bezogen werden.
  rationale: Im unmittelbaren Kontext vollzieht Aaron das Ritual, während seine Söhne ihm zuarbeiten. Daher ist Aaron das grammatisch und erzählerisch nächstliegende Bezugswort; im Haupttext bleibt dennoch das hebräische Pronomen als »ihm« erhalten.
- issue: Ergänzung »das übrige Blut«
  choice: Die aus der Handlungsfolge erschlossene Restmenge wird ausdrücklich bezeichnet.
  alternative: 'Formal näher: »und das Blut goss er«.'
  rationale: Nachdem Aaron seinen Finger in das Blut getaucht und davon an die Altarhörner gestrichen hat, bezeichnet die erneute Nennung des Blutes plausibel den verbleibenden Anteil. Da das Hebräische jedoch nicht ausdrücklich »übrig« sagt, wird dies in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzgliederung. Kultische Fachbegriffe werden, wo sie verständlich und etabliert sind, formal bewahrt; ungewohnte Sachdetails werden knapp erläutert. Die Übersetzung folgt einer optimalen Äquivalenz und markiert erschlossene Präzisierungen transparent.
