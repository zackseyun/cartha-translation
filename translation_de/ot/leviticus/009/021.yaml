source:
  edition: WLC
  text: וְ/אֵ֣ת הֶ/חָז֗וֹת וְ/אֵת֙ שׁ֣וֹק הַ/יָּמִ֔ין הֵנִ֧יף אַהֲרֹ֛ן תְּנוּפָ֖ה לִ/פְנֵ֣י יְהוָ֑ה כַּ/אֲשֶׁ֖ר צִוָּ֥ה מֹשֶֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/021.yaml
  text: And Aaron waved the breasts and the right thigh as a wave offering before Yahweh, just as Moses had commanded.
translation:
  language: de
  text: Aaron schwang die Bruststücke und die rechte Keule als Schwingopfer vor Jahwe, wie Mose es geboten hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶחָזוֹת
  choice: die Bruststücke
  rationale: חָזֶה bezeichnet im Opferkontext den als Opferanteil bestimmten Brustbereich. Der Plural bezieht sich hier auf die Bruststücke der zuvor genannten Opfertiere; „Bruststücke“ ist im Deutschen eindeutiger als das missverständliche „Brüste“.
- source_word: שׁוֹק הַיָּמִין
  choice: die rechte Keule
  rationale: שׁוֹק bezeichnet den oberen beziehungsweise kräftigen Teil des Beins. „Keule“ ist die gebräuchliche deutsche Bezeichnung für dieses Opferstück und bewahrt die kultische Konkretheit.
- source_word: הֵנִיף ... תְּנוּפָה
  choice: schwang ... als Schwingopfer
  rationale: Die Verbindung aus dem Hifil von נוף und תְּנוּפָה bezeichnet die rituelle Schwingbewegung beziehungsweise Darbringung. Die Wiedergabe erhält sowohl die Handlung als auch den Fachbegriff.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי bedeutet hier „vor“ beziehungsweise „in der Gegenwart von“. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: כַּאֲשֶׁר צִוָּה מֹשֶׁה
  choice: wie Mose es geboten hatte
  rationale: Die Formulierung drückt aus, dass Aarons Handlung der zuvor erteilten Weisung des Mose entsprach; das Plusquamperfekt bildet diese zeitliche Abfolge im Deutschen natürlich ab.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Tetragrammaton. „Jahwe“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlicher kultischer Fachsprache. „Bruststücke“ vermeidet die im Deutschen unnatürliche oder missverständliche Form „Brüste“; „Schwingopfer“ bewahrt den technischen Opferbegriff.
