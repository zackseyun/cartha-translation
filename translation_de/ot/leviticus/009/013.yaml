  text: וְ/אֶת הָ/עֹלָ֗ה הִמְצִ֧יאוּ אֵלָ֛י/ו לִ/נְתָחֶ֖י/הָ וְ/אֶת הָ/רֹ֑אשׁ וַ/יַּקְטֵ֖ר עַל הַ/מִּזְבֵּֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/013.yaml
  text: And they brought the burnt offering to him[a], piece by piece, and the head[b]; and he burned them on the altar.
translation:
  language: de
  text: Und sie brachten ihm das Brandopfer in seinen Stücken und den Kopf; er ließ sie auf dem Altar in Rauch aufgehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֹלָה
  choice: das Brandopfer
  rationale: Der etablierte deutsche Opferbegriff gibt עֹלָה im levitischen Zusammenhang natürlich und sachlich wieder.
- source_word: הִמְצִיאוּ אֵלָיו
  choice: sie reichten ihm
  rationale: Der Hifil von מצא bezeichnet hier das Heranbringen beziehungsweise Überreichen der Opferteile an Aaron; „reichten ihm“ passt zum rituellen Handlungsablauf.
- source_word: לִנְתָחֶיהָ
  choice: Stück für Stück
  rationale: נֶתַח bezeichnet die zerlegten Teile des Tieres; die distributive Formulierung gibt die abschnittsweise Übergabe idiomatisch wieder.
- source_word: הָרֹאשׁ
  choice: der Kopf
  rationale: Die anatomische Bezeichnung wird wörtlich beibehalten, da der Kopf eigens neben den übrigen Teilen genannt wird.
- source_word: וַיַּקְטֵר
  choice: er ließ es … in Rauch aufgehen
  rationale: 'קטר bezeichnet im Opferkontext mehr als bloßes Verbrennen: das Verbrennen auf dem Altar, bei dem das Opfer als Rauch aufsteigt.'
- source_word: עַל הַמִּזְבֵּחַ
  choice: auf dem Altar
  rationale: Dies ist die natürliche deutsche Wiedergabe der üblichen kultischen Wendung.
theological_decisions:
- issue: Opfersprachliche Bedeutung von קטר
  choice: „in Rauch aufgehen lassen“
  alternative: „verbrennen“
  rationale: Die gewählte Formulierung bewahrt die spezifische kultische Bedeutung des Verbs, ohne eine zusätzliche theologische Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Samt dem Kopf“ macht deutlich, dass neben den zerlegten Teilen auch der Kopf überreicht wurde; das singularische „es“ nimmt das Brandopfer als Gesamtheit wieder auf.
