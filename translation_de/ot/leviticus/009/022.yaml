source:
  edition: WLC
  text: וַ/יִּשָּׂ֨א אַהֲרֹ֧ן אֶת יד/ו אֶל הָ/עָ֖ם וַֽ/יְבָרְכֵ֑/ם וַ/יֵּ֗רֶד מֵ/עֲשֹׂ֧ת הַֽ/חַטָּ֛את וְ/הָ/עֹלָ֖ה וְ/הַ/שְּׁלָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/022.yaml
  text: Then Aaron lifted up his hands toward the people and blessed them[a], and he came down from offering the sin offering, the burnt offering[c][b], and the peace offerings.
translation:
  language: de
  text: Dann erhob Aaron seine Hände[a] zum Volk hin und segnete es. Danach stieg er hinab, nachdem er das Sündopfer[b], das Brandopfer und die Heilsopfer[c] dargebracht hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „seine Hand“; die hebräische Form steht im Singular. Gemeint ist wahrscheinlich die Segensgeste mit erhobenen Händen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Reinigungsopfer“.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch übersetzt: „Friedensopfer“, „Gemeinschaftsopfer“ oder „Wohlergehensopfer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: erhob
  rationale: נשׂא bezeichnet zusammen mit „Hand“ das Erheben der Hand bzw. Hände; „erhob“ gibt die Segensgeste natürlich und präzise wieder.
- source_word: יָדוֹ
  choice: seine Hände
  rationale: Die hebräische Form ist Singular („seine Hand“), doch die Wendung bezeichnet hier wahrscheinlich die übliche Segensgeste mit erhobenen Händen. Die formale Abweichung wird in einer Fußnote offengelegt.
- source_word: אֶל הָעָם
  choice: zum Volk hin
  rationale: אֶל gibt die Richtung der Geste an. „Zum Volk hin“ bewahrt diese räumliche Ausrichtung deutlicher als ein bloßes „zum Volk“.
- source_word: וַיְבָרְכֵם
  choice: und segnete es
  rationale: ברך im Piel bedeutet schlicht „segnen“. Das Suffix bezieht sich auf das kollektiv-singularische „Volk“, daher im Deutschen „es“.
- source_word: וַיֵּרֶד
  choice: Danach stieg er hinab
  rationale: ירד bedeutet „hinabsteigen“. „Danach“ verdeutlicht in natürlichem Deutsch den im hebräischen Satz angezeigten Handlungsfortgang, ohne einen zusätzlichen theologischen Gehalt einzutragen.
- source_word: מֵעֲשֹׂת
  choice: nachdem er … dargebracht hatte
  rationale: Die Konstruktion מן + Infinitiv bezeichnet den Übergang von der vollendeten Opferhandlung. Im kultischen Zusammenhang ist „darbringen“ idiomatischer und genauer als das wörtliche „machen“.
- source_word: הַחַטָּאת
  choice: das Sündopfer
  rationale: חטאת ist hier die technische Bezeichnung einer levitischen Opferart. „Sündopfer“ ist im Deutschen etabliert; „Reinigungsopfer“ hebt eine mögliche funktionale Nuance hervor und wird als Alternative vermerkt.
- source_word: הָעֹלָה
  choice: das Brandopfer
  rationale: עלה bezeichnet das vollständig auf dem Altar verbrannte Opfer. „Brandopfer“ ist die geläufige deutsche Fachbezeichnung.
- source_word: הַשְּׁלָמִים
  choice: die Heilsopfer
  rationale: שׁלמים ist eine pluralische technische Opferbezeichnung. „Heilsopfer“ lässt den Bedeutungsbereich von Wohlergehen, Frieden und Gemeinschaft offen, während alternative deutsche Benennungen in der Fußnote genannt werden.
theological_decisions:
- issue: Wiedergabe der levitischen Opferbegriffe
  choice: Im Haupttext stehen die etablierten bzw. quellennahen Fachbegriffe „Sündopfer“, „Brandopfer“ und „Heilsopfer“.
  alternative: Für חטאת ist „Reinigungsopfer“ möglich; für שׁלמים auch „Friedensopfer“, „Gemeinschaftsopfer“ oder „Wohlergehensopfer“.
  rationale: Die Opferarten sollen wiedererkennbar und untereinander unterscheidbar bleiben. Zugleich werden funktionale Deutungen der Begriffe nicht stillschweigend zur alleinigen Bedeutung erklärt.
- issue: Singular oder Plural bei Aarons Segensgeste
  choice: Im Haupttext steht das natürliche deutsche „seine Hände“, mit ausdrücklichem Hinweis auf den hebräischen Singular.
  alternative: Formal näher wäre „seine Hand“.
  rationale: Der Singular kann die Hand als Gestenträger kollektiv bzw. idiomatisch bezeichnen. Die Übersetzung gibt die übliche Segensgeste verständlich wieder, ohne die Form des Ausgangstextes zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau löst die knappe hebräische Abfolge behutsam in eine natürliche zeitliche Konstruktion auf. Kultische Fachbegriffe bleiben knapp und konsistent; echte lexikalische Alternativen werden in Fußnoten dokumentiert.
