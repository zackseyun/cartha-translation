base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/010.yaml
  text: And the fat[a], the kidneys, and the lobe of the liver from the sin offering he turned into smoke on the altar, just as Yahweh had commanded Moses.
translation:
  language: de
  text: Vom Sündopfer ließ er das Fett, die Nieren und den Leberlappen auf dem Altar in Rauch aufgehen, so wie Jahwe es Mose geboten hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֵלֶב
  choice: Fett
  rationale: Im Opferkontext bezeichnet das Wort die für die Darbringung bestimmten Fettteile. „Fett“ gibt den hebräischen Ausdruck direkt und verständlich wieder.
- source_word: כְּלָיֹת
  choice: Nieren
  rationale: Die konkrete anatomische Bezeichnung wird unmittelbar beibehalten.
- source_word: יֹּתֶרֶת מִן־הַכָּבֵד
  choice: Leberlappen
  rationale: Der Ausdruck bezeichnet einen an beziehungsweise bei der Leber befindlichen Lappen oder Fortsatz. „Leberlappen“ ist im Deutschen knapp, natürlich und sachlich angemessen.
- source_word: חַטָּאת
  choice: Sündopfer
  rationale: „Sündopfer“ ist die geläufige Bezeichnung dieser Opferart. Da der hebräische Begriff zugleich die reinigende Funktion des Opfers hervorheben kann, wird „Reinigungsopfer“ als Alternative in einer Fußnote genannt.
- source_word: הִקְטִיר
  choice: ließ … in Rauch aufgehen
  rationale: Die Hifil-Form bezeichnet im Opferkontext das Verbrennen auf dem Altar, bei dem die Opferteile als Rauch aufsteigen; die Formulierung bewahrt diese kultische Nuance.
- source_word: הַמִּזְבֵּחָה
  choice: auf dem Altar
  rationale: Obwohl die Form eine Richtungsendung trägt, verlangt der Opferzusammenhang im natürlichen Deutschen die Ortsangabe „auf dem Altar“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. „Jahwe“ ist die im modernen Standarddeutsch geläufige Form.
theological_decisions:
- issue: Wiedergabe von חַטָּאת in der priesterlichen Opfergesetzgebung
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: Der Begriff kann sowohl den Zusammenhang mit Sünde als auch die Beseitigung kultischer Unreinheit durch das Opfer betonen. Der Haupttext verwendet die bekannte Opferbezeichnung „Sündopfer“, während die legitime funktionale Nuance in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung hält Aaron als Subjekt von „ließ … in Rauch aufgehen“ erkennbar, ohne den im Hebräischen vorausgesetzten Namen unnötig zu ergänzen. Der Fußnotenmarker steht unmittelbar bei „Sündopfer“.
