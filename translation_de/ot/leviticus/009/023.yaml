source:
  edition: WLC
  text: וַ/יָּבֹ֨א מֹשֶׁ֤ה וְ/אַהֲרֹן֙ אֶל אֹ֣הֶל מוֹעֵ֔ד וַ/יֵּ֣צְא֔וּ וַֽ/יְבָרֲכ֖וּ אֶת הָ/עָ֑ם וַ/יֵּרָ֥א כְבוֹד יְהוָ֖ה אֶל כָּל הָ/עָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/023.yaml
  text: Moses and Aaron went into the tent of meeting, and when they came out, they blessed the people. Then the glory of Yahweh appeared to all the people.
translation:
  language: de
  text: Mose und Aaron gingen in das Zelt der Begegnung, kamen heraus und segneten das Volk. Dann erschien die Herrlichkeit Jahwes dem ganzen Volk.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹהֶל מוֹעֵד
  choice: Zelt der Begegnung
  rationale: Die feste kultische Bezeichnung wird in natürlichem, verständlichem Deutsch wiedergegeben.
- source_word: וַיָּבֹא ... וַיֵּצְאוּ
  choice: gingen hinein ... kamen wieder heraus
  rationale: Die Bewegungsrichtung und die Abfolge der Handlungen werden idiomatisch ausgedrückt. Trotz der singularischen Form וַיָּבֹא legt das zusammengesetzte Subjekt „Mose und Aaron“ zusammen mit den folgenden Pluralformen eine gemeinsame Handlung nahe.
- source_word: וַיְבָרֲכוּ
  choice: segneten
  rationale: Die schlichte verbale Wiedergabe entspricht dem Hebräischen, ohne die Form des Segens näher festzulegen.
- source_word: הָעָם / כָּל הָעָם
  choice: das Volk / das ganze Volk
  rationale: Gemeint ist die versammelte Gemeinschaft Israels; „Volk“ ist hier die natürliche deutsche Entsprechung.
- source_word: כְבוֹד יְהוָה
  choice: die Herrlichkeit Jahwes
  rationale: „Herrlichkeit“ bewahrt den Gedanken der sichtbar werdenden göttlichen Majestät; der Gottesname wird im Deutschen als „Jahwe“ wiedergegeben.
- source_word: וַיֵּרָא
  choice: erschien
  rationale: Die Nifalform bezeichnet hier das sichtbare Offenbarwerden; „erschien“ ist knapp, idiomatisch und dem theophanischen Zusammenhang angemessen.
- source_word: אֶל כָּל הָעָם
  choice: dem ganzen Volk
  rationale: Nach „erscheinen“ verlangt natürliches Deutsch den Dativ; die Wendung bewahrt, dass die Erscheinung an das gesamte Volk gerichtet beziehungsweise für es wahrnehmbar war.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Bundesnamen; die Schreibweise entspricht der geläufigen deutschen Form.
- issue: Verknüpfung der abschließenden Erscheinung mit den vorherigen Handlungen
  choice: Da erschien die Herrlichkeit Jahwes dem ganzen Volk.
  alternative: Und die Herrlichkeit Jahwes erschien dem ganzen Volk.
  rationale: Die hebräische Erzählfolge zeigt den nächsten Handlungsschritt an, ohne ausdrücklich einen Kausalzusammenhang zu behaupten. „Da“ gibt diese unmittelbare zeitliche Weiterführung in natürlichem Deutsch wieder.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze Hauptsätze halten die Erzählung klar; „Zelt der Begegnung“ und „Herrlichkeit“ bewahren den kultischen und theophanischen Gehalt.
