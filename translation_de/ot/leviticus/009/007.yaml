  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן קְרַ֤ב אֶל הַ/מִּזְבֵּ֨חַ֙ וַ/עֲשֵׂ֞ה אֶת חַטָּֽאתְ/ךָ֙ וְ/אֶת עֹ֣לָתֶ֔/ךָ וְ/כַפֵּ֥ר בַּֽעַדְ/ךָ֖ וּ/בְעַ֣ד הָ/עָ֑ם וַ/עֲשֵׂ֞ה אֶת קָרְבַּ֤ן הָ/עָם֙ וְ/כַפֵּ֣ר בַּֽעֲדָ֔/ם כַּ/אֲשֶׁ֖ר צִוָּ֥ה יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/007.yaml
  text: And Moses said to Aaron[a], “Come near to the altar, and offer your sin offering and your burnt offering, and make atonement for yourself and for the people. Then offer the people's offering, and make atonement for them, just as Yahweh commanded.”
translation:
  language: de
  text: 'Und Mose sagte zu Aaron: „Tritt an den Altar und bring dein Sündopfer[a] und dein Brandopfer dar. Erwirke Sühne für dich und für das Volk. Dann bring die Opfergabe des Volkes dar und erwirke Sühne für sie, wie Jahwe es geboten hat.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dein Reinigungsopfer“. Das hebräische Wort חַטָּאת kann das Sündopfer bezeichnen, wobei in manchen Zusammenhängen die Reinigung von kultischer Unreinheit im Vordergrund steht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קְרַב אֶל הַמִּזְבֵּחַ
  choice: Tritt an den Altar
  rationale: Der Imperativ von קרב bezeichnet im kultischen Zusammenhang das Herantreten. „Tritt an den Altar“ ist natürliches, präzises Deutsch und bewahrt die direkte Aufforderung.
- source_word: וַעֲשֵׂה
  choice: bring ... dar
  rationale: עשה bedeutet grundsätzlich „tun/machen“, bezeichnet mit Opferobjekten hier aber idiomatisch die Darbringung. „Darbringen“ gibt die kultische Handlung klar wieder.
- source_word: חַטָּאתְךָ
  choice: dein Sündopfer
  rationale: חַטָּאת bezeichnet in diesem Opferkontext das Opfer, das mit Sünde und kultischer Reinigung verbunden ist. Die geläufige Wiedergabe „Sündopfer“ bleibt im Haupttext; „Reinigungsopfer“ wird als echte lexikalische Alternative in der Fußnote genannt.
- source_word: עֹלָתֶךָ
  choice: dein Brandopfer
  rationale: עֹלָה ist die übliche Bezeichnung für das vollständig verbrannte Opfer; „Brandopfer“ ist die präzise und etablierte deutsche Wiedergabe.
- source_word: וְכַפֵּר
  choice: erwirke Sühne
  rationale: כפר bezeichnet im priesterlich-kultischen Kontext die Herbeiführung von Sühne beziehungsweise Reinigung. „Sühne erwirken“ bewahrt das theologische Gewicht, ohne eine bestimmte Sühnetheorie festzulegen.
- source_word: בַּעַדְךָ וּבְעַד הָעָם
  choice: für dich und für das Volk
  rationale: בְּעַד bezeichnet hier Handeln zugunsten beziehungsweise stellvertretend für andere. Das deutsche „für“ ist idiomatisch und wahrt diesen Sinn im Kontext.
- source_word: קָרְבַּן הָעָם
  choice: die Opfergabe des Volkes
  rationale: קָרְבָּן ist ein allgemeiner Ausdruck für eine dargebrachte Gabe. „Opfergabe des Volkes“ bildet die Genitivverbindung klar und natürlich ab.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה
  choice: wie Jahwe es geboten hat
  rationale: כַּאֲשֶׁר bezeichnet die Übereinstimmung mit dem göttlichen Befehl. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Bedeutung von חַטָּאת im Opferkontext
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: Der Ausdruck kann sowohl den Bezug zur Sünde als auch die reinigende Funktion des Opfers hervorheben. Der Haupttext verwendet die vertraute, sachlich mögliche Wiedergabe und bewahrt die alternative Akzentsetzung in einer Fußnote.
- issue: Wiedergabe von כפר
  choice: Sühne erwirken
  alternative: entsühnen / Reinigung bewirken
  rationale: Das Verb trägt im Kontext sowohl sühnende als auch reinigende Aspekte. „Sühne erwirken“ lässt diese theologische Spannweite offen und legt keinen besonderen Mechanismus der Sühne fest.
- issue: Bezug von וְכַפֵּר בַּעַדְךָ וּבְעַד הָעָם
  choice: für dich und für das Volk
  alternative: für dich und zugunsten des Volkes
  rationale: Der Text verbindet Aarons eigene Opfer mit Sühne für ihn und das Volk, bevor die Opfergabe des Volkes genannt wird. Die Übersetzung erhält diese auffällige Formulierung, statt sie harmonisierend umzudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kultischen Schlüsselbegriffe „Sündopfer“, „Brandopfer“ und „Sühne“ bleiben erhalten; Satzbau und Verben sind zugleich für heutige Leser verständlich.
