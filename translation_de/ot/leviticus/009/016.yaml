  text: וַ/יַּקְרֵ֖ב אֶת הָ/עֹלָ֑ה וַֽ/יַּעֲשֶׂ֖/הָ כַּ/מִּשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/016.yaml
  text: And he presented the burnt offering and offered it according to the ordinance[a].
translation:
  language: de
  text: Dann brachte er das Brandopfer herbei und führte es nach der Vorschrift aus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »auf die vorgeschriebene Weise«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: brachte … herbei
  rationale: Der Hifil von קרב bedeutet „heranbringen/nahebringen“. „Herbeibringen“ wahrt hier die Abfolge zwischen dem Heranbringen des Opfers und seiner anschließenden rituellen Zubereitung, ohne beide Verben mit „darbringen“ zusammenfallen zu lassen.
- source_word: הָעֹלָה
  choice: das Brandopfer
  rationale: עֹלָה ist die übliche Bezeichnung für das vollständig verbrannte Opfer. „Brandopfer“ ist im Deutschen der etablierte und verständliche kultische Fachausdruck.
- source_word: וַיַּעֲשֶׂהָ
  choice: bereitete es … zu
  rationale: עשה ist grundsätzlich weit gefasst („tun/machen“), bezeichnet im Opferkontext aber die sachgemäße Ausführung der Opferhandlung. „Zubereiten“ gibt den konkreten rituellen Zusammenhang natürlich wieder, ohne ein engeres hebräisches Fachverb vorzutäuschen.
- source_word: כַּמִּשְׁפָּט
  choice: nach der Vorschrift
  rationale: מִשְׁפָּט bezeichnet hier die verbindliche, festgelegte Verfahrensnorm. „Nach der Vorschrift“ bewahrt sowohl den rechtlich-kultischen Charakter als auch die knappe Ausdrucksweise des Hebräischen.
theological_decisions: []
translation_notes:
  register: 'Modernes, würdevolles Standarddeutsch. Die beiden aufeinanderfolgenden hebräischen Verben werden unterschieden: zuerst wird das Opfer herbeigebracht, danach vorschriftsgemäß zubereitet.'
