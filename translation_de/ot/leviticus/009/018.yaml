source:
  edition: WLC
  text: וַ/יִּשְׁחַ֤ט אֶת הַ/שּׁוֹר֙ וְ/אֶת הָ/אַ֔יִל זֶ֥בַח הַ/שְּׁלָמִ֖ים אֲשֶׁ֣ר לָ/עָ֑ם וַ֠/יַּמְצִאוּ בְּנֵ֨י אַהֲרֹ֤ן אֶת הַ/דָּם֙ אֵלָ֔י/ו וַ/יִּזְרְקֵ֥/הוּ עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/018.yaml
  text: Then he slaughtered the ox and the ram[a], the sacrifice of peace offerings that was for the people. Aaron’s sons brought the blood to him, and he splashed it on the altar all around.
translation:
  language: de
  text: Dann schlachtete er den Stier und den Widder als Friedensopfer[a] für das Volk. Die Söhne Aarons brachten ihm das Blut, und er sprengte es ringsum an den Altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch „Gemeinschaftsopfer“ oder „Heilsopfer“. Das hebräische Wort שְׁלָמִים ist mit Frieden, Wohlergehen, Ganzheit und Gemeinschaft verbunden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחַט
  choice: Dann schlachtete er
  rationale: Die Verbform führt die Erzählung weiter; „dann“ gibt die Abfolge natürlich wieder. „Schlachten“ ist der präzise deutsche Ausdruck für die rituelle Tötung eines Opfertiers.
- source_word: הַשּׁוֹר
  choice: den Stier
  rationale: שׁוֹר bezeichnet ein Rind und im Opferkontext häufig einen Stier. „Stier“ ist hier eine natürliche und sachlich passende Bezeichnung des Opfertiers.
- source_word: וְאֶת הָאַיִל
  choice: und den Widder
  rationale: אַיִל bezeichnet eindeutig einen männlichen Schafbock; „Widder“ ist die präzise standarddeutsche Wiedergabe.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: als Friedensopfer[a]
  rationale: „Friedensopfer“ bewahrt die erkennbare Verbindung von שְׁלָמִים mit Frieden und Unversehrtheit. Die Konstruktion mit „als“ macht im Deutschen verständlich, dass Stier und Widder gemeinsam zu dieser Opferart gehören.
- source_word: אֲשֶׁר לָעָם
  choice: für das Volk
  rationale: Die knappe Wendung gibt den Bezug des Opfers auf das Volk idiomatisch wieder, ohne genauer festzulegen, ob Besitz oder stellvertretende Darbringung im Vordergrund steht.
- source_word: וַיַּמְצִאוּ ... אֵלָיו
  choice: brachten ihm
  rationale: Im Ablauf des Opferrituals bezeichnet das Verb das Heranbringen beziehungsweise Darreichen des Blutes an den amtierenden Priester. „Brachten ihm“ ist klar und nah an der hebräischen Formulierung.
- source_word: וַיִּזְרְקֵהוּ עַל הַמִּזְבֵּחַ סָבִיב
  choice: und er sprengte es ringsum an den Altar
  rationale: זָרַק bezeichnet hier das gezielte Werfen beziehungsweise Sprengen des Blutes gegen den Altar, nicht ein feines Besprengen. „Ringsum an den Altar“ gibt sowohl die Richtung als auch סָבִיב wieder.
theological_decisions:
- issue: Bedeutungsumfang von שְׁלָמִים
  choice: Friedensopfer mit erklärender Fußnote
  alternative: Gemeinschaftsopfer oder Heilsopfer
  rationale: Keine einzelne deutsche Benennung erfasst zugleich Frieden, Wohlergehen, Ganzheit und Gemeinschaft. Der Haupttext wahrt den traditionellen Wortbezug, während die Fußnote die semantische Breite offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählfolge und sachgemäßem Opferwortschatz. „Sprengte“ wird im traditionellen rituellen Sinn verwendet und durch „an den Altar“ als kräftige Blutapplikation kenntlich gemacht.
