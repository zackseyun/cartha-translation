  text: וַ/תֵּ֤צֵא אֵשׁ֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה וַ/תֹּ֨אכַל֙ עַל הַ/מִּזְבֵּ֔חַ אֶת הָ/עֹלָ֖ה וְ/אֶת הַ/חֲלָבִ֑ים וַ/יַּ֤רְא כָּל הָ/עָם֙ וַ/יָּרֹ֔נּוּ וַֽ/יִּפְּל֖וּ עַל פְּנֵי/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/024.yaml
  text: And fire came out from before Yahweh and consumed on the altar the burnt offering and the fat portions[a]. And all the people saw[b], and they shouted for joy and fell on their faces.
translation:
  language: de
  text: Da ging Feuer von Yahweh aus[a] und verzehrte auf dem Altar das Brandopfer und die Fettstücke. Als das ganze Volk es sah, jubelte es laut[b] und fiel mit dem Gesicht zur Erde nieder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von vor Yahweh“; gemeint ist: aus der Gegenwart Yahwehs.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „stieß einen Jubelruf aus“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּצֵא אֵשׁ
  choice: Da ging Feuer … aus
  rationale: יצא bezeichnet eine Bewegung nach außen. Die deutsche Wendung „Feuer ging … aus“ gibt die lebhafte Erzählfolge natürlich wieder.
- source_word: מִלִּפְנֵי יְהוָה
  choice: von Yahweh aus
  rationale: Die Formulierung bewahrt Yahweh als Gottes Eigennamen und bringt idiomatisch zum Ausdruck, dass das Feuer aus seiner unmittelbaren Gegenwart hervorging.
- source_word: וַתֹּאכַל
  choice: verzehrte
  rationale: Das Verb bedeutet wörtlich „aß“, wird bei Feuer jedoch treffend und idiomatisch mit „verzehrte“ wiedergegeben.
- source_word: הָעֹלָה
  choice: das Brandopfer
  rationale: „Brandopfer“ ist die gebräuchliche deutsche Bezeichnung für das Opfer, das vollständig auf dem Altar verbrannt wurde.
- source_word: הַחֲלָבִים
  choice: die Fettstücke
  rationale: Der Plural bezeichnet im Opferkontext die dafür bestimmten Fettteile, nicht Fett im Allgemeinen.
- source_word: וַיָּרֹנּוּ
  choice: jubelten sie laut
  rationale: רנן bezeichnet hier einen hörbaren, jubelnden Ausruf; die Wiedergabe vermeidet sowohl die Abschwächung zu bloßer Freude als auch die Festlegung auf Gesang.
- source_word: וַיִּפְּלוּ עַל פְּנֵיהֶם
  choice: warfen sich mit dem Gesicht zur Erde
  rationale: Die Formulierung bewahrt das konkrete Bild der ehrfürchtigen Niederwerfung und klingt zugleich in modernem Deutsch natürlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR
  rationale: Der hebräische Text verwendet das Tetragramm als Gottes Eigennamen. „Yahweh“ macht diesen Namen im Haupttext sichtbar, ohne ihn durch einen Titel zu ersetzen.
- issue: Charakter der Reaktion des Volkes
  choice: hörbarer Jubel zusammen mit ehrfürchtiger Niederwerfung
  alternative: bloßes Freudenempfinden oder ausschließlich ein Schreckensschrei
  rationale: רנן weist auf einen Jubelruf, während das Niederfallen Ehrfurcht ausdrückt. Die Übersetzung lässt die Spannung zwischen Freude und heiliger Scheu bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählbewegung. Die kultischen Begriffe „Altar“, „Brandopfer“ und „Fettstücke“ bleiben präzise; die körperliche Reaktion des Volkes wird anschaulich wiedergegeben.
