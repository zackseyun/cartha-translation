    issue: Kongruenz und Satzanschluss bei „das ganze Volk … jubelten sie“
    rationale: Die Aussage ist verständlich, doch die Verbindung eines Kollektivsingulars mit „sie“ ist stilistisch uneinheitlich. Die Wiederaufnahme von „das ganze Volk“ vermeidet dies.
  - severity: low
    issue: „warfen sich mit dem Gesicht zur Erde“
    rationale: Diese Wendung legt eine absichtliche Wurfbewegung nahe. Das hebräische Verb bezeichnet zunächst Niederfallen; „fiel … mit dem Gesicht zur Erde nieder“ bewahrt das Bild ohne zusätzliche Nuance.
