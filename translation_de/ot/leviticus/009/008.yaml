id: LEV.9.8
reference: Leviticus 9:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּקְרַ֥ב אַהֲרֹ֖ן אֶל הַ/מִּזְבֵּ֑חַ וַ/יִּשְׁחַ֛ט אֶת עֵ֥גֶל הַ/חַטָּ֖את אֲשֶׁר לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/008.yaml
  text: Then Aaron came near to the altar and slaughtered the calf of the sin offering that was for himself[a].
translation:
  language: de
  text: Dann trat Aaron an den Altar und schlachtete das Kalb des Sündopfers, das für ihn bestimmt war.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Kalb des Reinigungsopfers“. Der hebräische Ausdruck kann das Opfer bezeichnen, das mit der Beseitigung von Sünde und Unreinheit verbunden ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרַב
  choice: trat … an
  rationale: Das Verb קרב bezeichnet hier Aarons konkrete Annäherung an den Altar. „Trat an den Altar“ ist im modernen Deutschen natürlich und bewahrt die räumliche Bewegung.
- source_word: הַמִּזְבֵּחַ
  choice: den Altar
  rationale: „Altar“ ist die übliche und genaue Wiedergabe von מזבח im Opferkontext.
- source_word: וַיִּשְׁחַט
  choice: schlachtete
  rationale: שׁחט bezeichnet im kultischen Zusammenhang das Schlachten eines Opfertiers; „schlachtete“ ist präziser als das allgemeinere „tötete“.
- source_word: עֵגֶל
  choice: das Kalb
  rationale: עגל bezeichnet ein junges Rind. „Kalb“ ist die direkte, kontextgemäße Wiedergabe.
- source_word: הַחַטָּאת
  choice: des Sündopfers
  rationale: חטאת bezeichnet hier die Opferkategorie. „Sündopfer“ ist im Deutschen verständlich und etabliert; die mögliche kultische Nuance eines Reinigungsopfers wird in der Fußnote bewahrt.
- source_word: אֲשֶׁר לוֹ
  choice: das für ihn bestimmt war
  rationale: Die Wendung kennzeichnet das Opfer als Aarons eigenes beziehungsweise als für ihn dargebrachtes Opfer. Die Formulierung wahrt diesen Funktionsbezug, ohne bloßen Besitz zu behaupten.
theological_decisions:
- issue: Wiedergabe von חטאת im priesterlichen Opferkontext
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: Der Ausdruck bezeichnet eindeutig eine Opferart, doch seine genaue kultische Akzentuierung kann als Sühne für Sünde oder als Beseitigung von Sünde und Unreinheit beschrieben werden. Die traditionelle Haupttextform „Sündopfer“ bleibt stehen, während „Reinigungsopfer“ als echte lexikalische Alternative in der Fußnote genannt wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt eng am hebräischen Erzählstil; kultische Fachbegriffe werden verständlich und konsistent wiedergegeben.
