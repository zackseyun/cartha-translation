id: LEV.9.5
reference: Leviticus 9:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּקְח֗וּ אֵ֚ת אֲשֶׁ֣ר צִוָּ֣ה מֹשֶׁ֔ה אֶל פְּנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וַֽ/יִּקְרְבוּ֙ כָּל הָ֣/עֵדָ֔ה וַ/יַּֽעַמְד֖וּ לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/005.yaml
  text: So they brought what Moses had commanded to the front of the tent of meeting, and all the congregation came near and stood before Yahweh.
translation:
  language: de
  text: Da brachten sie das, was Mose befohlen hatte, vor das Zelt der Begegnung. Die ganze Gemeinde trat heran und stellte sich vor Jahwe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Da brachten sie
  rationale: לקח bedeutet grundsätzlich „nehmen“, bezeichnet hier mit der Zielangabe jedoch idiomatisch das Bringen der zuvor angeordneten Opfergaben zum Zelt.
- source_word: אֵת אֲשֶׁר צִוָּה מֹשֶׁה
  choice: das, was Mose befohlen hatte
  rationale: Die Relativkonstruktion verweist auf die zuvor genannten Dinge, die Mose anzuordnen hatte; das Plusquamperfekt macht den zeitlichen Rückbezug im Deutschen natürlich deutlich.
- source_word: אֶל־פְּנֵי אֹהֶל מוֹעֵד
  choice: vor das Zelt der Begegnung
  rationale: אֶל־פְּנֵי ist hier räumlich und zielgerichtet. „Vor das“ gibt sowohl die Bewegung als auch den Platz an der Vorderseite des Zeltes knapp und idiomatisch wieder.
- source_word: אֹהֶל מוֹעֵד
  choice: Zelt der Begegnung
  rationale: Die transparente Wiedergabe bewahrt den Charakter des Ausdrucks als Bezeichnung des heiligen Zeltes, ohne auf das traditionellere, weniger unmittelbar verständliche „Stiftshütte“ zurückzugreifen.
- source_word: וַיִּקְרְבוּ
  choice: trat heran
  rationale: קרב bezeichnet die Annäherung. „Herantreten“ ist in diesem kultischen Zusammenhang natürlich und würdevoll, ohne unnötig altertümlich zu wirken.
- source_word: כָּל־הָעֵדָה
  choice: die ganze Gemeinde
  rationale: עֵדָה bezeichnet hier die versammelte Gemeinschaft Israels. „Die ganze Gemeinde“ ist im Deutschen klarer und idiomatischer als „alle Gemeinde“.
- source_word: וַיַּעַמְדוּ
  choice: stellte sich
  rationale: עמד kann „stehen“ oder im Erzählzusammenhang „sich hinstellen/Aufstellung nehmen“ bedeuten. Das reflexive Singularverb stimmt mit dem Kollektiv „Gemeinde“ überein und bewahrt die aktive Bewegung zum Standort vor Jahwe.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: Der Ausdruck wahrt sowohl den räumlichen als auch den kultisch-theologischen Sinn; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den offenbarten Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von לִפְנֵי יְהוָה
  choice: vor Jahwe
  alternative: in der Gegenwart Jahwes
  rationale: „Vor Jahwe“ erhält die genuine Spannung zwischen räumlichem Standort am Heiligtum und dem Stehen in Gottes Gegenwart, ohne nur eine der beiden Dimensionen festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung verbessert die Lesbarkeit, während das einleitende „Da“ den hebräischen Erzählfortgang wiedergibt. Keine Fußnoten erforderlich.
