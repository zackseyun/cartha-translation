source:
  edition: WLC
  text: וְ/שׁ֨וֹר וָ/אַ֜יִל לִ/שְׁלָמִ֗ים לִ/זְבֹּ֨חַ֙ לִ/פְנֵ֣י יְהוָ֔ה וּ/מִנְחָ֖ה בְּלוּלָ֣ה בַ/שָּׁ֑מֶן כִּ֣י הַ/יּ֔וֹם יְהוָ֖ה נִרְאָ֥ה אֲלֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/004.yaml
  text: and an ox and a ram for peace offerings[a], to sacrifice before Yahweh, and a grain offering mixed with oil[b]; for today Yahweh will appear to you.
translation:
  language: de
  text: dazu ein Rind und einen Widder als Heilsopfer[a], um sie vor Jahwe zu opfern, sowie ein mit Öl vermengtes Speisopfer. Denn heute wird Jahwe euch erscheinen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: Gemeinschaftsopfer oder Wohlergehensopfer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹר
  choice: Rind
  rationale: Der hebräische Ausdruck bezeichnet ein Tier der Rindergattung, ohne hier das Geschlecht eindeutig festzulegen; „Rind“ bewahrt diese Allgemeinheit besser als „Stier“.
- source_word: אַיִל
  choice: Widder
  rationale: Der Ausdruck bezeichnet spezifisch ein männliches Schaf; „Widder“ ist im Opferkontext präzise und geläufig.
- source_word: שְׁלָמִים
  choice: Heilsopfer
  rationale: Der kultische Plural bezeichnet Opfer, die mit Heil, Wohlergehen und Gemeinschaft verbunden sind. „Heilsopfer“ ist eine etablierte deutsche Wiedergabe; die sachlich möglichen Alternativen stehen in der Fußnote.
- source_word: לִזְבֹּחַ
  choice: zu opfern
  rationale: Im kultischen Zusammenhang bezeichnet זבח nicht nur das Schlachten, sondern die Darbringung als Opfer; „opfern“ gibt die rituelle Funktion natürlich wieder.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי bedeutet „vor“ beziehungsweise „in der Gegenwart von“. „Vor Jahwe“ ist knapp, natürlich und wahrt den Gottesnamen.
- source_word: מִנְחָה
  choice: Speisopfer
  rationale: Im levitischen Opferrecht bezeichnet מִנְחָה das aus pflanzlichen Erzeugnissen bereitete Opfer. „Speisopfer“ ist im Deutschen die etablierte kultische Bezeichnung und vermeidet die mögliche Verengung von „Getreideopfer“.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: mit Öl vermengt
  rationale: Die Formulierung beschreibt die Zubereitung durch Vermischen mit Öl. „Vermengt“ ist würdig, verständlich und im Opferkontext idiomatisch.
- source_word: כִּי הַיּוֹם
  choice: Denn heute
  rationale: כִּי führt hier die Begründung für die angeordneten Opfer ein; „Denn heute“ bewahrt sowohl den kausalen Anschluss als auch die zeitliche Betonung.
- source_word: נִרְאָה אֲלֵיכֶם
  choice: wird euch erscheinen
  rationale: Obwohl נִרְאָה formal ein Nifal-Perfekt ist, weist der Kontext auf eine unmittelbar bevorstehende Erscheinung. Das deutsche Futur gibt diesen kontextuellen Zukunftssinn klar wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen YHWH. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Aussage über die göttliche Erscheinung
  choice: Jahwe wird euch erscheinen
  alternative: Die Herrlichkeit Jahwes wird euch erscheinen
  rationale: Dieser Vers nennt ausdrücklich Jahwe selbst; „die Herrlichkeit Jahwes“ steht erst im folgenden Vers. Die Übersetzung fügt diese dortige Formulierung hier nicht ein.
- issue: Zeitbezug von נִרְאָה
  choice: zukünftige, unmittelbar bevorstehende Erscheinung
  alternative: Jahwe ist euch erschienen
  rationale: Der erzählerische und rituelle Zusammenhang kündigt die Manifestation für diesen Tag an. Die Perfektform kann in diesem Kontext eine feststehende beziehungsweise unmittelbar bevorstehende Handlung ausdrücken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit maßvoller kultischer Fachsprache. Die Satzform setzt den Zusammenhang mit der vorangehenden Aufzählung voraus. „Jahwe“ wahrt den im hebräischen Text stehenden Gottesnamen; die Mehrdeutigkeit von שְׁלָמִים wird durch eine Fußnote offengehalten.
