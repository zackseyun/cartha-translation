  source_fidelity: 'Die Übersetzung gibt die Aufzählung und die kultischen Funktionen des Hebräischen vollständig wieder: שׁוֹר bleibt mit „Rind“ geschlechtlich nicht unnötig eingeengt, אַיִל ist zutreffend „Widder“, und die Opfer werden „vor Jahwe“ dargebracht. „Denn heute wird Jahwe euch erscheinen“ gibt die in diesem Kontext erwartete, unmittelbar bevorstehende Erscheinung von נִרְאָה אֲלֵיכֶם angemessen wieder, ohne die „Herrlichkeit“ aus dem Folgevers zu ergänzen.'
