  text: בִּ/שְׁנַ֤ת הַ/יּוֹבֵל֙ יָשׁ֣וּב הַ/שָּׂדֶ֔ה לַ/אֲשֶׁ֥ר קָנָ֖/הוּ מֵ/אִתּ֑/וֹ לַ/אֲשֶׁר ל֖/וֹ אֲחֻזַּ֥ת הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/024.yaml
  text: In the year of jubilee the field shall return to the one from whom it was bought[a], to the one to whom the possession of the land belongs.
translation:
  language: de
  text: Im Jubeljahr fällt das Feld an den zurück, von dem es gekauft wurde, an den, dem der Landbesitz gehört.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an den, dem der erbliche Landbesitz gehört“. Der hebräische Ausdruck bezeichnet einen Landbesitz beziehungsweise ein Grundstück als festen Besitz; in diesem Zusammenhang ist der ursprüngliche Familienbesitz im Blick.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת הַיּוֹבֵל
  choice: Im Erlassjahr
  rationale: Die Präposition בְּ mit שְׁנַת bezeichnet den Zeitpunkt. „Erlassjahr“ ist eine verständliche und im Kontext der Tora sachgerechte deutsche Wiedergabe von יוֹבֵל.
- source_word: יָשׁוּב הַשָּׂדֶה
  choice: fällt das Feld … zurück
  rationale: Das Imperfekt beschreibt hier die rechtliche Folge. „Zurückfallen“ gibt die Rückkehr eines Grundstücks an den bisherigen beziehungsweise ursprünglichen Inhaber im Deutschen natürlich wieder.
- source_word: לַאֲשֶׁר קָנָהוּ מֵאִתּוֹ
  choice: an den, von dem es gekauft wurde
  rationale: Das Hebräische lautet wörtlich „zu dem, der es von ihm gekauft hat“, wobei die Pronomenzuordnung im Satz schwierig ist und im Kontext offenbar derjenige gemeint ist, von dem das Feld erworben wurde. Die passive Form vermeidet im Deutschen ein unklar bezogenes Subjekt und gibt den kontextuellen Sinn wieder.
- source_word: לַאֲשֶׁר לוֹ אֲחֻזַּת הָאָרֶץ
  choice: an den, dem der Landbesitz gehört
  rationale: אֲחֻזָּה bezeichnet einen festen Landbesitz beziehungsweise eine Landholding. Die Formulierung bewahrt den rechtlichen Sinn, ohne die im Kontext naheliegende Erb- oder Stammeszuweisung im Haupttext ausdrücklich hinzuzufügen.
theological_decisions:
- issue: Bedeutung von אֲחֻזַּת הָאָרֶץ im Erlassjahrrecht
  choice: „dem der Landbesitz gehört“
  alternative: „dessen erblicher Landbesitz es ist“
  rationale: Der Zusammenhang betrifft den angestammten Familienbesitz; der Ausdruck selbst bezeichnet jedoch zunächst einen festen Besitzanteil. Daher bleibt die erbliche Dimension im Haupttext unausgesprochen und wird in der Fußnote erläutert.
- issue: Pronomenbezug in קָנָהוּ מֵאִתּוֹ
  choice: 'Kontextuelle Wiedergabe: „von dem es gekauft wurde“'
  alternative: 'Formal: „der es von ihm gekauft hat“'
  rationale: Die formale Wiedergabe erzeugt im Deutschen einen Sinn, der mit der geforderten Rückgabe an den ursprünglichen Landinhaber schwer vereinbar ist. Die gewählte passive Form folgt dem Zusammenhang und vermeidet eine zusätzliche, unklare Personenbezeichnung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper rechtlicher Ausdrucksweise. „Fällt … zurück“ ist idiomatischer als „kehrt … zurück“, wenn es um Grundeigentum geht.
