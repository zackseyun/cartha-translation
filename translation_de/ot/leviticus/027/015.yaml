  source_fidelity: 'Der Entwurf gibt die hebräische Konditionalbestimmung zutreffend wieder: Derjenige, der das Haus geweiht hat, kann es auslösen; dabei ist ein Fünftel des in Silber festgesetzten Schätzwerts hinzuzufügen, worauf das Haus ihm gehört. »Von dir geschätzten« wahrt den im Hebräischen vorhandenen Singular der Anrede und ist im Kontext der priesterlichen Schätzung verständlich.'
