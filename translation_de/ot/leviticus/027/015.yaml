id: LEV.27.15
reference: Leviticus 27:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אִ֨ם הַ/מַּקְדִּ֔ישׁ יִגְאַ֖ל אֶת בֵּית֑/וֹ וְ֠/יָסַף חֲמִישִׁ֧ית כֶּֽסֶף עֶרְכְּ/ךָ֛ עָלָ֖י/ו וְ/הָ֥יָה לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/015.yaml
  text: And if the one who consecrated it redeems his house[a], then he shall add a fifth of the silver of your valuation to it[b], and it shall be his.
translation:
  language: de
  text: Wenn aber derjenige, der sein Haus geweiht hat,[a] es auslöst, soll er ein Fünftel des von dir geschätzten Silberwerts dazuzahlen;[b] dann gehört es ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »geheiligt« oder »als heilig ausgesondert«.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: Er zahlt zusätzlich ein Fünftel des vom Priester festgesetzten Silberwerts.'
    reason: cultural_note
lexical_decisions:
- source_word: הַמַּקְדִּישׁ
  choice: derjenige, der sein Haus geweiht hat
  rationale: Das Partizip bezeichnet hier den Eigentümer, der sein Haus im Rahmen der kultischen Schätzungsbestimmungen als heilig ausgesondert hat. »Geweiht« bewahrt den sakralen Sinn und ist im modernen Deutschen natürlich.
- source_word: יִגְאַל
  choice: auslöst
  rationale: גאל bezeichnet hier die Rückgewinnung des Hauses durch Zahlung. »Auslösen« ist in diesem rechtlich-sakralen Zusammenhang präziser als das allgemeinere »zurückkaufen«.
- source_word: בֵּיתוֹ
  choice: sein Haus
  rationale: Die wörtliche und im Zusammenhang mit der Bewertung von Eigentum sachlich genaue Wiedergabe ist »sein Haus«.
- source_word: וְיָסַף חֲמִישִׁית
  choice: soll er ein Fünftel … dazuzahlen
  rationale: Die Verbform drückt in der Bedingungsfolge eine verbindliche Rechtsvorschrift aus. »Dazuzahlen« gibt die additive Bedeutung von עָלָיו idiomatisch mit wieder.
- source_word: כֶּסֶף עֶרְכְּךָ
  choice: des von dir geschätzten Silberwerts
  rationale: כֶּסֶף bezeichnet Silber beziehungsweise den in Silber bemessenen Betrag; עֶרְכְּךָ ist die an den Priester gerichtete Bewertung. »Silberwert« bewahrt den konkreten Bezug und klingt zugleich verständlich.
- source_word: וְהָיָה לוֹ
  choice: dann gehört es ihm
  rationale: Die Schlussklausel bezeichnet das daraus folgende Eigentumsverhältnis. Die Formulierung ist natürliches modernes Deutsch und entspricht dem Sinn von »es wird ihm gehören«.
theological_decisions:
- issue: Kultischer Ausdruck für ein Gott als heilig ausgesondertes Haus
  choice: geweiht
  alternative: geheiligt; als heilig ausgesondert
  rationale: »Geweiht« hält den kultischen Charakter fest, ohne eine bestimmte konfessionelle Deutung einzutragen. Die Alternativen werden in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rechtlich-kultischem Ton. Der Bedingungssatz wurde für klare deutsche Bezüge leicht umgestellt; der an den Priester gerichtete Singular »von dir« bleibt erhalten.
