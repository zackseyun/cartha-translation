id: LEV.27.5
reference: Leviticus 27:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אִ֨ם מִ/בֶּן חָמֵ֜שׁ שָׁנִ֗ים וְ/עַד֙ בֶּן עֶשְׂרִ֣ים שָׁנָ֔ה וְ/הָיָ֧ה עֶרְכְּ/ךָ֛ הַ/זָּכָ֖ר עֶשְׂרִ֣ים שְׁקָלִ֑ים וְ/לַ/נְּקֵבָ֖ה עֲשֶׂ֥רֶת שְׁקָלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/005.yaml
  text: And if it is from five years old up to twenty years old, your valuation shall be twenty shekels for the male and ten shekels for the female.
translation:
  language: de
  text: Und wenn die Person fünf bis zwanzig Jahre alt ist, soll der von dir angesetzte Wert für eine männliche Person zwanzig Schekel und für eine weibliche Person zehn Schekel betragen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: Und wenn
  rationale: Bewahrt sowohl die Verknüpfung mit den vorhergehenden Bewertungsfällen als auch die konditionale Form.
- source_word: מִבֶּן חָמֵשׁ שָׁנִים וְעַד בֶּן עֶשְׂרִים שָׁנָה
  choice: fünf bis zwanzig Jahre alt
  rationale: Gibt die hebräische Altersangabe knapp und idiomatisch wieder, ohne die im Kontext zu bestimmenden exakten Grenzzeitpunkte zusätzlich festzulegen.
- source_word: וְהָיָה
  choice: soll … betragen
  rationale: Entspricht dem vorschreibenden Charakter der Formulierung in diesem rechtlich-kultischen Zusammenhang und klingt im modernen Deutschen natürlich.
- source_word: עֶרְכְּךָ
  choice: der von dir angesetzte Wert
  rationale: Bewahrt den Bezug auf den angeredeten Bewertenden und gibt עֵרֶךְ als festgesetzten Wert innerhalb der Gelübdeordnung wieder.
- source_word: הַזָּכָר
  choice: für eine männliche Person
  rationale: Gibt die männliche Bewertungskategorie präzise wieder; „Person“ macht im Deutschen deutlich, dass sich die Altersangabe auf einen Menschen bezieht.
- source_word: עֶשְׂרִים שְׁקָלִים
  choice: zwanzig Schekel
  rationale: Überträgt Zahl und historische Gewichtseinheit direkt, ohne eine sachlich unsichere Umrechnung in moderne Währung.
- source_word: וְלַנְּקֵבָה
  choice: für eine weibliche Person
  rationale: Gibt die entsprechende weibliche Bewertungskategorie parallel und in natürlichem modernem Deutsch wieder.
- source_word: עֲשֶׂרֶת שְׁקָלִים
  choice: zehn Schekel
  rationale: Direkte Wiedergabe der Zahl und Einheit; der Kontrast zur männlichen Bewertung bleibt erhalten.
theological_decisions:
- issue: Geschlechtsbezogene Bewertungskategorien in einer rechtlich-kultischen Vorschrift
  choice: für eine männliche Person … für eine weibliche Person
  alternative: für den Männlichen … für die Weibliche
  rationale: Die Übersetzung bewahrt die beiden im Hebräischen genannten Kategorien, formuliert sie aber im Deutschen als Personenbezeichnungen. Dadurch werden weder weitergehende gesellschaftliche Aussagen noch eine konfessionelle Deutung in den Text eingetragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer rechtlicher Satzstruktur. Die historische Einheit „Schekel“ bleibt erhalten; die knappe Altersformulierung wahrt die Ausdrucksweise und mögliche Grenzunschärfe des Ausgangstextes.
