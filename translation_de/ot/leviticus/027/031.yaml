base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/031.yaml
  text: But if a man redeems any of his tithe[a], he shall add a fifth to it.
translation:
  language: de
  text: Wenn aber ein Mann etwas von seinem Zehnten auslöst[a], soll er ein Fünftel davon hinzurechnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht eine verstärkende Verbindung zweier Formen desselben Verbs „auslösen“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Wenn aber
  rationale: Die Verbindung aus Konjunktion und Bedingungspartikel führt innerhalb der Rechtsbestimmungen einen weiteren, kontrastierenden Fall ein.
- source_word: גָּאֹל יִגְאַל
  choice: auslöst
  rationale: Der Infinitivus absolutus mit derselben finiten Verbform verstärkt den Vorgang. Im natürlichen deutschen Rechtssatz wird die Emphase nicht durch ein missverständliches Zusatzwort überzeichnet, sondern in einer Fußnote kenntlich gemacht.
- source_word: אִישׁ
  choice: ein Mann
  rationale: Das grammatisch maskuline Singularwort bezeichnet in diesem Rechtssatz einen Mann; die konkrete Form bleibt erhalten.
- source_word: מִמַּעַשְׂרוֹ
  choice: etwas von seinem Zehnten
  rationale: 'מִן hat hier partitive Bedeutung: Ausgelöst wird ein Teil dessen, was als Zehnter bestimmt ist.'
- source_word: חֲמִשִׁיתוֹ
  choice: dessen Fünftel
  rationale: Das Suffix bezieht den fünften Teil auf den ausgelösten Wert beziehungsweise Betrag; die Formulierung bewahrt diesen Bezug.
- source_word: יֹסֵף עָלָיו
  choice: soll er … hinzufügen
  rationale: Das Hifil von יסף bezeichnet das Hinzufügen; עַל gibt an, dass der fünfte Teil auf den Grundbetrag aufgeschlagen wird.
