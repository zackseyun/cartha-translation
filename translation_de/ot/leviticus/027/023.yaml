base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/023.yaml
  text: then the priest shall calculate for him the proportion of your valuation up to the Year of Jubilee[a], and on that day he shall give your valuation as a holy offering to Yahweh.
translation:
  language: de
  text: Dann soll der Priester für ihn den Anteil deines Schätzwerts bis zum Jobeljahr berechnen; und er soll an jenem Tag deinen Schätzwert als etwas Heiliges für Jahwe geben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „heilig für Jahwe“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחִשַּׁב
  choice: Dann soll … berechnen
  rationale: Das Piel von חשׁב bezeichnet hier das Berechnen eines Betrags; „Dann“ gibt die Abfolge der Rechtsbestimmungen natürlich wieder.
- source_word: לּוֹ
  choice: für ihn
  rationale: Der Dativ bezeichnet am natürlichsten die Person, für die der Priester den Betrag berechnet.
- source_word: מִכְסַת
  choice: den Anteil
  rationale: מִכְסָה bezeichnet hier den bis zum Jobeljahr zeitanteilig bestimmten Teil des gesamten Schätzwerts.
- source_word: הָעֶרְכְּךָ
  choice: deines Schätzwerts / den Schätzwert
  rationale: עֵרֶךְ ist in Levitikus 27 ein Fachausdruck für den festgesetzten Wert. Das Suffix der zweiten Person Singular wird beim ersten Vorkommen ausdrücklich wiedergegeben.
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: bis zum Jobeljahr
  rationale: Die Wendung nennt den Endpunkt, bis zu dem der anteilige Wert berechnet wird; „Jobeljahr“ ist die geläufige deutsche Sachbezeichnung.
- source_word: וְנָתַן
  choice: er soll … entrichten
  rationale: נתן bedeutet grundsätzlich „geben“; bei einem festgesetzten Geldwert ist „entrichten“ im Deutschen natürlich, ohne den Vorgang unnötig genauer festzulegen.
- source_word: בַּיּוֹם הַהוּא
  choice: noch an diesem Tag
  rationale: Die Formulierung gibt die zeitliche Bestimmung idiomatisch wieder und betont die unmittelbare Entrichtung.
- source_word: קֹדֶשׁ לַיהוָה
  choice: als etwas Heiliges für Jahwe
  rationale: Dies bewahrt die knappe Aussage der hebräischen Nominalkonstruktion und vermeidet die nicht ausdrücklich vorhandene Festlegung auf eine bestimmte Opferart.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben statt durch einen Titel ersetzt.
theological_decisions:
- issue: Unausgesprochenes Subjekt von וְנָתַן
  choice: 'Der betreffende Mann ist das weitergeltende Subjekt: „er soll … entrichten“.'
  alternative: Der Priester soll den Schätzwert entrichten.
  rationale: Der Priester berechnet den Betrag, während nach dem Zusammenhang die Person, deren Feld bewertet beziehungsweise ausgelöst wird, ihn entrichtet. Da das Hebräische das Subjekt nicht erneut nennt, bleibt die deutsche Formulierung mit „er“ ebenso knapp.
- issue: Bedeutung von קֹדֶשׁ לַיהוָה
  choice: „als etwas Heiliges für Jahwe“
  alternative: „heilig für Jahwe“ beziehungsweise „als eine heilige Gabe für Jahwe“
  rationale: Die gewählte Fassung bringt die kultische Zugehörigkeit zu Jahwe zum Ausdruck, ohne das ergänzende Substantiv „Opfer“ in den Haupttext einzutragen. Die formalere Alternative wird in der Fußnote geboten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit rechtlich-kultischem Ton. Der Fachbegriff „Schätzwert“ wird beibehalten; die hebräische Knappheit und die Mehrdeutigkeit des unausgesprochenen Subjekts werden möglichst bewahrt.
