source:
  edition: WLC
  text: וְ/אִם֙ אֶת שְׂדֵ֣ה מִקְנָת֔/וֹ אֲשֶׁ֕ר לֹ֖א מִ/שְּׂדֵ֣ה אֲחֻזָּת֑/וֹ יַקְדִּ֖ישׁ לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/022.yaml
  text: But if he consecrates to Yahweh a field of his purchase[a], which is not from the field of his inherited property,
translation:
  language: de
  text: Wenn er aber Jahwe ein Feld weiht, das er gekauft hat[a] und das nicht zu seinem Erbbesitz gehört,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ein Feld seines Erwerbs“; gemeint ist ein gekauftes Feld im Gegensatz zum angestammten Erbbesitz.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Wenn er aber
  rationale: Leitet in Fortführung der vorangehenden Bestimmungen einen neuen, leicht kontrastierenden Bedingungsfall ein.
- source_word: שְׂדֵה מִקְנָתוֹ
  choice: ein Feld, das er gekauft hat
  rationale: Gibt den erworbenen, im Gegensatz zum ererbten Grundbesitz natürlich und rechtlich eindeutig wieder.
- source_word: אֲשֶׁר לֹא מִשְּׂדֵה אֲחֻזָּתוֹ
  choice: das nicht zu seinem Erbbesitz gehört
  rationale: אֲחֻזָּה bezeichnet hier den erblichen beziehungsweise angestammten Landbesitz; die deutsche Formulierung bildet die Zugehörigkeitsverneinung idiomatisch ab.
- source_word: יַקְדִּישׁ
  choice: weiht
  rationale: Bezeichnet im kultisch-rechtlichen Zusammenhang das Aussondern eines Gegenstands als heilig für Gott.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text ausdrücklich stehenden Gottesnamen יהוה wieder; die Zielrichtung der Weihung ist im Deutschen durch den Dativ ausgedrückt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als solcher erkennbar wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von אֲחֻזָּה im Landrecht
  choice: Erbbesitz
  alternative: Besitz
  rationale: Der Zusammenhang stellt gekauftes Land dem erblichen beziehungsweise angestammten Landbesitz gegenüber; „Erbbesitz“ bewahrt diesen rechtlichen Gegensatz.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer rechtlicher Terminologie. Der Satz bleibt entsprechend dem Verszusammenhang syntaktisch offen und endet mit einem Komma.
