source:
  edition: WLC
  text: וְ/אִ֣ם מִ/בֶּן חֹ֗דֶשׁ וְ/עַד֙ בֶּן חָמֵ֣שׁ שָׁנִ֔ים וְ/הָיָ֤ה עֶרְכְּ/ךָ֙ הַ/זָּכָ֔ר חֲמִשָּׁ֥ה שְׁקָלִ֖ים כָּ֑סֶף וְ/לַ/נְּקֵבָ֣ה עֶרְכְּ/ךָ֔ שְׁלֹ֥שֶׁת שְׁקָלִ֖ים כָּֽסֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/006.yaml
  text: If it is from a month old up to five years old, your valuation for the male shall be five shekels of silver, and for the female your valuation shall be three shekels of silver.
translation:
  language: de
  text: Ist eine Person im Alter von einem Monat bis zu fünf Jahren, beträgt der von dir festgesetzte Wert für eine männliche Person fünf Schekel Silber und für eine weibliche Person drei Schekel Silber.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Schekel war hier eine Gewichtseinheit; maßgeblich ist nach Vers 25 der Schekel des Heiligtums.
    reason: Moderne Leser können „Schekel“ sonst irrtümlich als Münze im heutigen Sinn verstehen; der unmittelbare Kapitelkontext erläutert den verwendeten Standard.
lexical_decisions:
- source_word: מִבֶּן חֹדֶשׁ וְעַד בֶּן חָמֵשׁ שָׁנִים
  choice: einen Monat bis fünf Jahre alt
  rationale: Die hebräischen Altersformeln werden natürlich und rechtlich präzise wiedergegeben; „bis fünf Jahre“ lässt entsprechend dem Ausgangstext offen, wie die obere Grenze im Verhältnis zur nächsten Altersstufe rechnerisch gehandhabt wird.
- source_word: עֶרְכְּךָ
  choice: dein Schätzwert
  rationale: Der Ausdruck bezeichnet im Kontext von Levitikus 27 den für ein Gelübde festgesetzten Wert. Das Possessivpronomen der zweiten Person Singular bleibt erhalten.
- source_word: הַזָּכָר / לַנְּקֵבָה
  choice: für eine männliche Person / für eine weibliche Person
  rationale: Die Formulierung bewahrt die geschlechtlichen Kategorien des Gesetzestextes, ohne wegen der breiten Altersspanne unzutreffend nur „Junge“ oder „Mädchen“ zu sagen.
- source_word: חֲמִשָּׁה שְׁקָלִים כָּסֶף / שְׁלֹשֶׁת שְׁקָלִים כָּסֶף
  choice: fünf Schekel Silber / drei Schekel Silber
  rationale: Direkte, im Deutschen geläufige Wiedergabe der Gewichts- beziehungsweise Währungseinheit und des ausdrücklich genannten Silbers.
- source_word: וְהָיָה
  choice: so beträgt
  rationale: Im gesetzlichen Zusammenhang gibt die Form eine verbindliche Festsetzung an. „Beträgt“ klingt im modernen Deutschen natürlicher als „soll sein“, ohne die normative Kraft abzuschwächen.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Gesetzesstil. „Person“ macht den elliptischen Bezug des Hebräischen verständlich und passt zur Altersgruppe vom Säugling bis zum Kleinkind. Die Satzstruktur bleibt knapp und parallel.
