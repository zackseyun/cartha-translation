source:
  edition: WLC
  text: לֹ֣א יַחֲלִיפֶ֗/נּוּ וְ/לֹֽא יָמִ֥יר אֹת֛/וֹ ט֥וֹב בְּ/רָ֖ע אוֹ רַ֣ע בְּ/ט֑וֹב וְ/אִם הָמֵ֨ר יָמִ֤יר בְּהֵמָה֙ בִּ/בְהֵמָ֔ה וְ/הָֽיָה ה֥וּא וּ/תְמוּרָת֖/וֹ יִֽהְיֶה קֹּֽדֶשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/010.yaml
  text: He shall not replace it or exchange it[a], good for bad or bad for good; and if he does indeed exchange one animal for another[b], then both it and its substitute shall be holy.
translation:
  language: de
  text: Man darf es weder ersetzen noch vertauschen[a], weder ein gutes gegen ein schlechtes noch ein schlechtes gegen ein gutes. Wenn man aber tatsächlich ein Tier gegen ein anderes vertauscht[b], sollen sowohl das ursprüngliche Tier als auch das Ersatztier heilig sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen stehen hier zwei verschiedene, bedeutungsnahe Verben für das Ersetzen beziehungsweise Vertauschen.
    reason: lexical_alternative
  - marker: b
    text: 'Das Hebräische verstärkt das Verb: wörtlich etwa »wenn man es wirklich vertauscht«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחֲלִיפֶנּוּ
  choice: es ersetzen
  rationale: Das Hifil von חלף bezeichnet hier das Ersetzen des gelobten Tieres durch ein anderes. »Ersetzen« ist natürliches modernes Deutsch und bleibt vom folgenden Verb מוּר unterschieden.
- source_word: יָמִיר אֹתוֹ
  choice: es vertauschen
  rationale: מוּר bezeichnet in diesem Rechtszusammenhang den Tausch eines Tieres gegen ein anderes. »Vertauschen« bewahrt den Unterschied zu חלף und gibt den unerlaubten Austausch klar wieder.
- source_word: טוֹב בְּרָע אוֹ רַע בְּטוֹב
  choice: weder ein gutes gegen ein schlechtes noch ein schlechtes gegen ein gutes
  rationale: Die substantivisch gebrauchten Adjektive beziehen sich auf Tiere; die Ergänzung des unbestimmten Artikels ergibt klares, idiomatisches Deutsch. Die Paarung mit »weder … noch« bindet den Gegensatz natürlich an das Verbot.
- source_word: וְאִם הָמֵר יָמִיר
  choice: wenn man aber tatsächlich … vertauscht
  rationale: Infinitivus absolutus und finites Verb verstärken die Aussage. »Tatsächlich« vermittelt diese Hervorhebung in gegenwärtigem Deutsch, ohne die Konstruktion unnötig zu überdeuten.
- source_word: בְּהֵמָה בִּבְהֵמָה
  choice: ein Tier gegen ein anderes
  rationale: Die idiomatische Formulierung macht den Austausch zweier Tiere eindeutig.
- source_word: וְהָיָה הוּא וּתְמוּרָתוֹ
  choice: sowohl das ursprüngliche Tier als auch das Ersatztier
  rationale: Das Pronomen bezeichnet das zuerst geweihte Tier, תְּמוּרָה das dafür eingesetzte Tier. Die explizite Formulierung verhindert ein unklares Pronomen und zeigt, dass beide betroffen sind.
- source_word: קֹדֶשׁ
  choice: heilig
  rationale: קֹדֶשׁ bezeichnet den Gott zugehörigen, ausgesonderten Status. »Heilig« ist die direkte und theologisch offene Wiedergabe.
theological_decisions:
- issue: Status des ursprünglichen und des eingetauschten Tieres nach einem verbotenen Austausch
  choice: Sowohl das ursprüngliche Tier als auch das Ersatztier sind heilig.
  alternative: Nur das Ersatztier wird heilig, oder der Satz erklärt lediglich den Tausch für ungültig.
  rationale: Die hebräische Formulierung »es und sein Ersatz sollen heilig sein« weist beiden Tieren ausdrücklich heiligen Status zu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit unpersönlichem »man« für die allgemein geltende Rechtsbestimmung. Die beiden hebräischen Austauschverben werden durch »ersetzen« und »vertauschen« unterschieden; die Rechtsfolge wird ausdrücklich und verständlich formuliert.
