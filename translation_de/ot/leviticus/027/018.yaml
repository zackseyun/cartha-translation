source:
  edition: WLC
  text: וְ/אִם אַחַ֣ר הַ/יֹּבֵל֮ יַקְדִּ֣ישׁ שָׂדֵ/הוּ֒ וְ/חִשַּׁב ל֨/וֹ הַ/כֹּהֵ֜ן אֶת הַ/כֶּ֗סֶף עַל פִּ֤י הַ/שָּׁנִים֙ הַ/נּ֣וֹתָרֹ֔ת עַ֖ד שְׁנַ֣ת הַ/יֹּבֵ֑ל וְ/נִגְרַ֖ע מֵֽ/עֶרְכֶּֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/018.yaml
  text: But if he consecrates his field after the Jubilee[a], then the priest shall calculate the money for him according to the years remaining until the year of Jubilee[c][b], and it shall be deducted from your valuation.
translation:
  language: de
  text: Wenn er sein Feld aber nach dem Jubeljahr heiligt, soll der Priester ihm den Geldbetrag nach der Zahl der Jahre berechnen, die bis zum Jubeljahr verbleiben; dieser Betrag soll von deinem Schätzwert abgezogen werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחַר הַיֹּבֵל
  choice: nach dem Erlassjahr
  rationale: אַחַר bezeichnet die zeitliche Folge; הַיֹּבֵל meint hier das in Levitikus 25 geregelte Erlassjahr. „Erlassjahr“ ist im Deutschen verständlich und bezeichnet die Institution präziser als das missverständliche „Jubeljahr“.
- source_word: יַקְדִּישׁ
  choice: heiligt
  rationale: קדשׁ bezeichnet hier das Aussondern eines Grundstücks als heilig für den HERRN. „Heiligt“ bewahrt den kultischen Sinn, während „widmet“ allgemeiner wäre.
- source_word: שָׂדֵהוּ
  choice: sein Feld
  rationale: Die Suffixform bezeichnet unmittelbar das Feld des handelnden Mannes.
- source_word: וְחִשַּׁב לוֹ הַכֹּהֵן אֶת הַכֶּסֶף
  choice: soll der Priester ihm den Geldbetrag ... berechnen
  rationale: חשב bedeutet in diesem Rechtszusammenhang „berechnen“; הַכֶּסֶף bezeichnet den zu bestimmenden Geldbetrag. Die deutsche Wortstellung verbindet die Berechnung natürlich mit ihrer Grundlage.
- source_word: עַל פִּי הַשָּׁנִים הַנּוֹתָרֹת
  choice: nach der Zahl der Jahre, die ... verbleiben
  rationale: עַל־פִּי bedeutet „gemäß/auf Grundlage von“; gemeint ist eine anteilige Berechnung anhand der verbleibenden Jahre.
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: bis zum Erlassjahr
  rationale: Die Wendung nennt den Endpunkt des Zeitraums. Im natürlichen Deutschen genügt hier „bis zum Erlassjahr“, ohne das hebräische „Jahr des Erlasses“ nachzubilden.
- source_word: וְנִגְרַע מֵעֶרְכֶּךָ
  choice: dieser Betrag soll von deinem Schätzwert abgezogen werden
  rationale: Das Nifal von גרע drückt eine Verminderung beziehungsweise einen Abzug aus. Das ergänzte „dieser Betrag“ macht den sachlichen Bezug verständlich, ohne den Sinn festzulegen, der grammatisch auch unpersönlicher wiedergegeben werden kann; עֶרְכֶּךָ wird mit seinem Suffix der zweiten Person Singular bewahrt.
theological_decisions:
- issue: Suffix der zweiten Person Singular in מֵעֶרְכֶּךָ
  choice: von deinem Schätzwert
  alternative: von dem Schätzwert
  rationale: Das Hebräische spricht den Adressaten ausdrücklich in der zweiten Person Singular an. Diese juristische Anrede wird beibehalten, statt sie zu verallgemeinern.
- issue: Kultische Bedeutung von יַקְדִּישׁ
  choice: heiligt
  alternative: weiht / widmet
  rationale: „Heiligt“ wahrt das Aussondern als heilig, ohne näher zu bestimmen, welche kultische Handlung damit verbunden war.
- issue: Bezug von וְנִגְרַע
  choice: dieser Betrag soll ... abgezogen werden
  alternative: und es soll von deinem Schätzwert abgezogen werden
  rationale: Der Satz bezeichnet die Herabsetzung des regulären Schätzwerts entsprechend den fehlenden Jahren. Die Übersetzung macht den monetären Bezug verständlich, ohne eine zusätzliche theologische Deutung einzutragen.
translation_notes:
  register: Moderne, würdige Rechtssprache. „Erlassjahr“ wird als verständlicher Fachbegriff verwendet; die direkte singularische Anrede und der kultische Ausdruck „heiligt“ bleiben erhalten.
