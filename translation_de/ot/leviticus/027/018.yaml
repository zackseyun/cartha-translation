  to: Wenn er sein Feld aber nach dem Jubeljahr heiligt, soll der Priester ihm den Geldbetrag nach der Zahl der Jahre berechnen, die bis zum Jubeljahr verbleiben; dieser Betrag soll von deinem Schätzwert abgezogen werden.
  rationale: Die einzige notwendige Sachkorrektur ist die Ersetzung von „Erlassjahr“ durch „Jubeljahr“. Damit wird die Terminologie von Levitikus 25 gewahrt und eine Verwechslung mit dem Schuldenerlass vermieden. Die bisherigen Fußnoten werden nicht benötigt, da die Hauptfassung nun die angemessene Standardwiedergabe enthält und die zweite Fußnote lediglich die bereits übersetzte Satzstruktur wiederholt.
