  text: And every valuation of yours shall be by the sanctuary shekel[a]; the shekel shall be twenty gerahs.
translation:
  language: de
  text: Und bei jeder deiner Wertfestsetzungen soll der Schekel des Heiligtums[a] zugrunde gelegt werden; der Schekel soll zwanzig Gera betragen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach dem heiligen Schekel“. Gemeint ist der für Wertfestsetzungen im Zusammenhang mit dem Heiligtum geltende Schekelstandard.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְכְּךָ
  choice: jede deiner Wertfestsetzungen
  rationale: Der Ausdruck bezeichnet in Levitikus 27 den verbindlich festgesetzten Wert bei Gelübden und geweihten Personen oder Sachen. „Wertfestsetzung“ bewahrt den fachsprachlichen Sinn; das Suffix der 2. Person Singular bleibt durch „deiner“ erhalten.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: nach dem Schekel des Heiligtums
  rationale: Die Präposition bezeichnet hier den maßgeblichen Standard. „Schekel des Heiligtums“ gibt die für den Heiligtumsbereich geltende Gewichts- beziehungsweise Werteinheit wieder, ohne das Hebräische unnötig als bloß moralische Eigenschaft „heiliger Schekel“ zu deuten.
- source_word: גֵּרָה
  choice: Gera
  rationale: Gera ist die Bezeichnung einer kleinen Gewichts- beziehungsweise Werteinheit, für die es kein natürliches modernes deutsches Äquivalent gibt. Nach deutschen Maßangaben bleibt die Einheitenbezeichnung im Plural unverändert.
- source_word: עֶשְׂרִים גֵּרָה יִהְיֶה הַשָּׁקֶל
  choice: ein Schekel entspricht zwanzig Gera
  rationale: Die Formulierung gibt die definierende Aussage des Hebräischen in natürlichem modernem Deutsch wieder.
- source_word: וְכָל
  choice: Und jede
  rationale: Die Konjunktion wird bewahrt; „jede“ gibt den distributiven Sinn wieder, wonach jede einzelne Wertfestsetzung diesem Maßstab folgen soll.
- source_word: יִהְיֶה
  choice: soll … erfolgen
  rationale: Der Imperfekt hat im gesetzlichen Zusammenhang vorschreibende Kraft. „Soll“ wahrt diesen Rechtscharakter in gegenwärtigem, verständlichem Deutsch.
