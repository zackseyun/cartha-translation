source:
  edition: WLC
  text: אֵ֣לֶּה הַ/מִּצְוֺ֗ת אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל בְּ/הַ֖ר סִינָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/034.yaml
  text: These are the commandments that Yahweh commanded Moses for the sons of Israel at Mount Sinai[a].
translation:
  language: de
  text: Dies sind die Gebote, die Jahwe Mose für die Israeliten[a] am Berg Sinai gebot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Israeliten“.'
    reason: Die Präposition אֶל kann hier sowohl den Adressaten („den Israeliten“) als auch den Bezug beziehungsweise die Bestimmung („für die Israeliten“) ausdrücken.
lexical_decisions:
- source_word: אֵלֶּה
  choice: Dies sind
  rationale: Die deutsche Kopula wird ergänzt, um die abschließende Zusammenfassungsformel natürlich wiederzugeben.
- source_word: הַמִּצְוֺת
  choice: die Gebote
  rationale: „Gebote“ bewahrt den rechtlich verbindlichen Sinn von מִצְוָה und passt zur feierlichen Schlussformel.
- source_word: אֲשֶׁר
  choice: die
  rationale: Das Relativpronomen bezieht sich im Deutschen natürlich auf „Gebote“.
- source_word: צִוָּה
  choice: gebot
  rationale: „Gebot“ gibt die Tätigkeit des Anordnens wieder und erhält die im Hebräischen bestehende Wortverbindung zu „Gebote“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶת מֹשֶׁה
  choice: Mose
  rationale: Mose ist im Hebräischen das direkte Objekt von צִוָּה; die deutsche Konstruktion „Mose gebot“ gibt den Empfänger idiomatisch im Dativ wieder.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: für die Israeliten
  rationale: אֶל kann hier die Adressaten beziehungsweise diejenigen bezeichnen, für die Mose die Gebote erhielt. „Israeliten“ gibt die feste Volksbezeichnung בְּנֵי יִשְׂרָאֵל im modernen Deutsch natürlich wieder, ohne sie auf männliche Personen einzuengen.
- source_word: בְּהַר סִינָי
  choice: auf dem Berg Sinai
  rationale: Die Präposition בְּ bezeichnet hier den Ort; „auf dem Berg Sinai“ ist im Deutschen die klare und übliche Formulierung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: Die hebräische Wendung ist eine feste Bezeichnung für das Volk Israel. „Die Israeliten“ vermittelt diesen kollektiven Sinn im heutigen Deutsch, ohne fälschlich nur männliche Angehörige des Volkes zu bezeichnen.
- issue: Bezug der Präposition אֶל
  choice: für die Israeliten
  alternative: den Israeliten; zu den Israeliten
  rationale: Die Formulierung kann darauf bezogen werden, dass Mose die Gebote mit Blick auf ihre Weitergabe an Israel empfing. Die alternative Adressatenlesart bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Schlussformel und die lexikalische Verbindung zwischen „Gebote“ und „gebot“ bleiben erhalten.
