  text: וְ/אִם֙ כָּל בְּהֵמָ֣ה טְמֵאָ֔ה אֲ֠שֶׁר לֹא יַקְרִ֧יבוּ מִמֶּ֛/נָּה קָרְבָּ֖ן לַֽ/יהוָ֑ה וְ/הֶֽעֱמִ֥יד אֶת הַ/בְּהֵמָ֖ה לִ/פְנֵ֥י הַ/כֹּהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/011.yaml
  text: But if it is any unclean animal from which they may not present an offering to Yahweh[a], then he shall set the animal before the priest,
translation:
  language: de
  text: Wenn es aber irgendein unreines Tier ist, von dem man Yahweh kein Opfer darbringen darf, soll er das Tier vor den Priester stellen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: Wenn es aber
  rationale: Leitet einen bedingten Fall ein, der zugleich einen Gegensatz zur vorherigen Bestimmung bildet.
- source_word: כָּל בְּהֵמָה טְמֵאָה
  choice: irgendein unreines Tier
  rationale: כָּל mit singularischem Substantiv hat hier indefiniten Sinn. „Unrein“ bezeichnet den kultischen Status.
- source_word: אֲשֶׁר לֹא יַקְרִיבוּ מִמֶּנָּה קָרְבָּן
  choice: von dem man … kein Opfer darbringen darf
  rationale: Der Plural יַקְרִיבוּ wird unpersönlich gebraucht; „man“ gibt dies im Deutschen natürlich wieder. מִמֶּנָּה bleibt mit „von dem“ ausdrücklich erhalten, und „darbringen“ bewahrt den kultischen Sinn von הקריב.
- source_word: קָרְבָּן
  choice: Opfer
  rationale: Im vorliegenden kultischen Zusammenhang ist „Opfer“ die natürliche und präzise deutsche Wiedergabe.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen als Eigennamen wieder.
- source_word: וְהֶעֱמִיד
  choice: soll er … stellen
  rationale: Der Hifil von עמד bedeutet, etwas oder jemanden zum Stehen zu bringen beziehungsweise hinzustellen; „stellen“ passt zum Tier vor dem Priester.
- source_word: אֶת הַבְּהֵמָה לִפְנֵי הַכֹּהֵן
  choice: das Tier vor den Priester
  rationale: Direkte und idiomatische Wiedergabe der formellen Vorführung zur priesterlichen Begutachtung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR
  rationale: Der Eigenname wird als „Yahweh“ wiedergegeben, sodass der ausdrücklich gebrauchte Bundesname sichtbar bleibt.
- issue: Reichweite des Verbots in der Relativklausel
  choice: von dem man Yahweh kein Opfer darbringen darf
  alternative: das man Yahweh nicht als Opfer darbringt
  rationale: Die Formulierung mit מִמֶּנָּה bezeichnet ein Tier, aus dessen Art kein Opfer genommen werden darf. Die unpersönliche Pluralform wird nicht auf eine bestimmte Personengruppe eingeengt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Rechtssatzstruktur. Die kultische Fachsprache bleibt verständlich; die unpersönliche hebräische Pluralform wird natürlich mit „man“ ausgedrückt.
