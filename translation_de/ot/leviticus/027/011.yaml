  terminology: „Unrein“, „Opfer darbringen“, „Priester“ und „Yahweh“ sind im gegebenen Projektgebrauch konsequent und sachgerecht. Die Wiedergabe des Gottesnamens stimmt mit der maßgeblichen theologischen Entscheidung im Kontext überein, auch wenn der englische Audit-Trail hierzu widersprüchliche Angaben enthält.
