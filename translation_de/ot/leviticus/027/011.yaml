  verdict: approve
  source_fidelity: Der Entwurf gibt die bedingte Fortführung (וְאִם), die indefinite Wendung „irgendein unreines Tier“, den kultischen Sinn von טְמֵאָה sowie die Relativklausel mit unpersönlichem Plural zutreffend wieder. „von dem man Yahweh kein Opfer darbringen darf“ bewahrt sowohl מִמֶּנָּה („von dem“) als auch die modale Aussage. Die anschließende Weisung, das Tier vor den Priester zu stellen, entspricht dem Hifil von עמד und der Präpositionalgruppe לִפְנֵי הַכֹּהֵן.
