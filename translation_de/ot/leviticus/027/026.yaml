  text: אַךְ בְּכ֞וֹר אֲשֶׁר יְבֻכַּ֤ר לַֽ/יהוָה֙ בִּ/בְהֵמָ֔ה לֹֽא יַקְדִּ֥ישׁ אִ֖ישׁ אֹת֑/וֹ אִם שׁ֣וֹר אִם שֶׂ֔ה לַֽ/יהוָ֖ה הֽוּא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/026.yaml
  text: However[a], a firstborn among the livestock, which as a firstborn belongs to Yahweh, no man may consecrate; whether an ox or a sheep[b], it belongs to Yahweh.
translation:
  language: de
  text: Doch ein Erstgeborenes vom Vieh, das Jahwe als Erstgeborenes gehört, darf niemand weihen. Sei es ein Rind oder ein Stück Kleinvieh[a] – es gehört Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann ein Schaf oder eine Ziege bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Doch
  rationale: Leitet eine Einschränkung beziehungsweise Ausnahme zu den vorausgehenden Bestimmungen ein und gibt die adversative Kraft knapp und natürlich wieder.
- source_word: בְּכוֹר
  choice: das Erstgeborene
  rationale: Bezeichnet hier ein erstgeborenes Tier; die substantivierte Form ist im Deutschen klar und würdevoll.
- source_word: אֲשֶׁר יְבֻכַּר לַיהוָה בִּבְהֵמָה
  choice: das als Erstgeborenes Jahwe gehört
  rationale: Die passive Form von בכר bezeichnet hier den Status als Erstgeborenes. Die Formulierung bringt zugleich den durch diesen Status bestehenden Anspruch Jahwes zum Ausdruck, ohne eine menschliche Handlung anzunehmen.
- source_word: בִּבְהֵמָה
  choice: unter dem Vieh
  rationale: בהמה ist hier eine Sammelbezeichnung für domestizierte Nutztiere; „Vieh“ ist im gesetzlichen Kontext idiomatisch.
- source_word: לֹא יַקְדִּישׁ אִישׁ אֹתוֹ
  choice: darf niemand weihen
  rationale: Der Hifil von קדש bedeutet kultisch „weihen/heiligen“. „Niemand“ gibt das generisch verwendete אִישׁ im heutigen Standarddeutsch natürlich wieder.
- source_word: אִם שׁוֹר אִם שֶׂה
  choice: Ob Rind oder Tier vom Kleinvieh
  rationale: Die Konstruktion bedeutet „ob … oder …“. שׁוֹר bezeichnet ein Rind, während שֶׂה sowohl Schaf als auch Ziege meinen kann; „Tier vom Kleinvieh“ bewahrt diesen Umfang.
- source_word: לַיהוָה הוּא
  choice: es gehört Jahwe
  rationale: Die Wendung bezeichnet hier Jahwes bestehenden Anspruch beziehungsweise Besitzrecht und erklärt, warum keine zusätzliche Weihe möglich ist.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen transparent wieder.
theological_decisions:
- issue: Warum das erstgeborene Tier nicht durch ein Gelübde geweiht werden darf
  choice: Es darf nicht erneut geweiht werden, weil es aufgrund seines Erstgeburtsstatus bereits Jahwe gehört.
  alternative: Der Erstgeburtsstatus selbst gilt als Weihe, ohne dass der rechtliche Anspruch Jahwes besonders betont wird.
  rationale: Der abschließende Satz „es gehört Jahwe“ macht den bereits bestehenden göttlichen Anspruch zur ausdrücklichen Begründung. Die Übersetzung bewahrt zugleich die enge Verbindung zwischen Erstgeburtsstatus und Heiligkeit.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit kultisch-rechtlichem Ton. „Weihen“ wahrt die Fachbedeutung, während „niemand“ die generische Aussage natürlich wiedergibt. Der Gedankenstrich hebt die abschließende Begründung hervor.
