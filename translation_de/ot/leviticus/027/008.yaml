base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/008.yaml
  text: But if he is too poor for your valuation[a], then he shall be made to stand before the priest, and the priest shall assess him[b]; the priest shall assess him according to what the one making the vow can afford.
translation:
  language: de
  text: Wenn er aber zu arm ist, um den von dir festgesetzten Betrag aufzubringen,[a] soll er vor den Priester gestellt werden. Der Priester soll den für ihn zu entrichtenden Betrag nach dem festsetzen, was derjenige, der das Gelübde abgelegt hat, aufbringen kann.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »wenn er ärmer ist als deine Festsetzung«. Gemeint ist, dass er den festgesetzten Betrag nicht aufbringen kann.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »nach dem, was die Hand dessen, der das Gelübde abgelegt hat, erreicht«; eine hebräische Redewendung für seine finanziellen Möglichkeiten.'
    reason: idiom
lexical_decisions:
- source_word: מָךְ ... מֵעֶרְכֶּךָ
  choice: zu arm ..., um den von dir festgesetzten Betrag aufzubringen
  rationale: מָךְ bezeichnet wirtschaftliche Bedürftigkeit; zusammen mit מִן und עֶרֶךְ ergibt sich hier der Sinn, dass jemand den festgesetzten Schätzbetrag nicht aufbringen kann. Die deutsche Infinitivkonstruktion gibt diesen Vergleichssinn natürlich wieder.
- source_word: וְהֶעֱמִידוֹ לִפְנֵי הַכֹּהֵן
  choice: soll er vor den Priester gestellt werden
  rationale: Die passive Formulierung bewahrt den Sinn des Hifil ‚hinstellen lassen‘, ohne das im Hebräischen nicht ausdrücklich genannte handelnde Subjekt festzulegen.
- source_word: וְהֶעֱרִיךְ אֹתוֹ ... יַעֲרִיכֶנּוּ
  choice: soll den für ihn geltenden Betrag festsetzen
  rationale: ערך ist in Levitikus 27 ein Fachwort für die Festsetzung eines Geldbetrags. Die Wiedergabe vermeidet das missverständliche ‚seinen Wert bestimmen‘, als ginge es um den persönlichen Wert eines Menschen.
- source_word: אֲשֶׁר תַּשִּׂיג יַד הַנֹּדֵר
  choice: was der Gelobende aufbringen kann
  rationale: Die Wendung ‚was die Hand erreicht‘ bezeichnet die verfügbaren wirtschaftlichen Mittel. ‚Aufbringen kann‘ gibt das Idiom in natürlichem Deutsch wieder.
- source_word: הַנֹּדֵר
  choice: der Gelobende
  rationale: Das substantivierte Partizip bezeichnet die Person, die das Gelübde ablegt. ‚Der Gelobende‘ ist knapp, verständlich und wahrt den Bezug zum Gelübde.
