  text: כָּל חֵ֗רֶם אֲשֶׁ֧ר יָחֳרַ֛ם מִן הָ/אָדָ֖ם לֹ֣א יִפָּדֶ֑ה מ֖וֹת יוּמָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/029.yaml
  text: No devoted thing that is devoted from man may be redeemed[b][a]; it must surely be put to death.
translation:
  language: de
  text: Kein Mensch, der dem Bann geweiht wird, darf ausgelöst werden[a]; er muss unbedingt getötet werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »Alles dem Bann Geweihte, das aus dem Bereich der Menschen dem Bann geweiht wird«. Die hebräische Wendung bezeichnet hier einen Menschen; »dem Bann geweiht« gibt einen kultisch-rechtlichen Fachausdruck wieder.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֵרֶם
  choice: das Gebannte
  rationale: Der substantivierte Ausdruck bewahrt den kultisch-rechtlichen Fachsinn von etwas oder jemandem, das beziehungsweise der unwiderruflich unter den Bann gestellt ist, ohne den Begriff vorschnell vollständig als »zur Vernichtung bestimmt« auszudeuten.
- source_word: יָחֳרַם
  choice: dem Bann geweiht wird
  rationale: Die Wiedergabe hält die Wortverbindung mit חֵרֶם fest. »Geweiht« bringt das Aussondern zum Ausdruck, während »dem Bann« die besondere und schwerwiegende Art dieser Weihe kennzeichnet.
- source_word: מִן הָאָדָם
  choice: aus den Menschen
  rationale: Die Wendung bezeichnet hier etwas aus dem Bereich der Menschheit, also einen Menschen. Der deutsche Plural ist eine natürliche generische Wiedergabe und vermeidet das missverständliche »von dem Menschen«.
- source_word: יִפָּדֶה
  choice: darf nicht ausgelöst werden
  rationale: »Auslösen« ist im Zusammenhang von Levitikus 27 ein passender rechtlich-kultischer Ausdruck für die Freigabe durch Zahlung eines Lösegeldes.
- source_word: מוֹת יוּמָת
  choice: muss unbedingt getötet werden
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt die Aussage. »Unbedingt« gibt diese Nachdrücklichkeit wieder; das Passiv entspricht der hebräischen Form.
theological_decisions:
- issue: Bedeutung von חֵרֶם bei einem menschlichen Bezugsgegenstand
  choice: Der Haupttext bewahrt mit »das Gebannte« und »dem Bann geweiht« die kultisch-rechtliche Ausdrucksweise.
  alternative: Kein Mensch, der aus der Menschheit zur Vernichtung bestimmt ist, darf ausgelöst werden; er muss unbedingt getötet werden.
  rationale: Der Vers verbindet Bannterminologie und Auslösung mit einer ausdrücklichen Tötungsformel. Die gewählte Fassung erhält diese Spannung, während die Fußnote den eindeutig menschlichen Bezug und die mögliche zerstörungsbezogene Deutung offenlegt.
- issue: Bezug von מִן הָאָדָם und grammatisches Geschlecht im Deutschen
  choice: »aus den Menschen« macht deutlich, dass ein menschliches Wesen gemeint ist; die Pronomenform »es« richtet sich grammatisch nach »das Gebannte«.
  alternative: »Kein Mensch … er« benennt den menschlichen Bezug unmittelbar.
  rationale: So bleibt die substantivische Bannformel des Hebräischen im Haupttext sichtbar, ohne zu verschleiern, dass der folgende Tötungssatz einen Menschen betrifft.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener kultisch-rechtlicher Fachsprache. »Aus den Menschen« ist natürlicher als eine wörtliche Wiedergabe mit »von dem Menschen«; die Fußnote macht die menschliche Referenz und die schärfere Deutung ausdrücklich.
