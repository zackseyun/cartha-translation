id: LEV.27.30
reference: Leviticus 27:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/כָל מַעְשַׂ֨ר הָ/אָ֜רֶץ מִ/זֶּ֤רַע הָ/אָ֨רֶץ֙ מִ/פְּרִ֣י הָ/עֵ֔ץ לַ/יהוָ֖ה ה֑וּא קֹ֖דֶשׁ לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/030.yaml
  text: Every tithe of the land[a], from the seed of the land and from the fruit of the tree, belongs to Yahweh; it is holy to Yahweh.
translation:
  language: de
  text: Jeder Zehnte des Landes, von der Saat des Landes und von der Frucht der Bäume, gehört Jahwe; er ist Jahwe heilig.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכָל מַעְשַׂר הָאָרֶץ
  choice: Jeder Zehnte vom Land
  rationale: כָּל mit dem singularischen מַעְשַׂר ist distributiv. „Jeder Zehnte“ ist im Deutschen natürlich und bewahrt den kultischen Begriff; „vom Land“ bezeichnet hier den landwirtschaftlichen Ertrag.
- source_word: מִזֶּרַע הָאָרֶץ
  choice: von der Saat des Landes
  rationale: „Saat“ bewahrt das konkrete Bild von זֶרַע und bezeichnet hier das aus Aussaat hervorgehende Erzeugnis, ohne es vorschnell auf Getreide einzuengen.
- source_word: מִפְּרִי הָעֵץ
  choice: von der Frucht der Bäume
  rationale: Der hebräische Singular הָעֵץ ist kollektiv gebraucht. Der deutsche Plural „der Bäume“ gibt diesen kollektiven Sinn idiomatisch wieder.
- source_word: לַיהוָה הוּא
  choice: gehört Jahwe
  rationale: Die Präposition לְ drückt hier Zugehörigkeit beziehungsweise Weihe aus. „Gehört Jahwe“ macht diesen Sinn klar und natürlich.
- source_word: קֹדֶשׁ לַיהוָה
  choice: er ist Jahwe heilig
  rationale: 'Die Formulierung bewahrt den kultisch-theologischen Sinn: Der Zehnte ist für Jahwe ausgesondert und ihm geweiht.'
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den persönlichen Bundesnamen in einer im Deutschen etablierten Form.
- issue: Bedeutung von קֹדֶשׁ לַיהוָה
  choice: Jahwe heilig
  alternative: für Jahwe geheiligt; Jahwe geweiht
  rationale: Die knappe Prädikatsform bewahrt die Aussage, dass der Zehnte den Status des Heiligen besitzt und Jahwe zugeordnet ist, ohne über den Wortlaut hinauszugehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Gedankenstriche machen die beiden Herkunftsangaben als Erläuterung zu „vom Land“ transparent. Das Pronomen „er“ nimmt grammatisch eindeutig „der Zehnte“ wieder auf.
