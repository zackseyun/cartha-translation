  source_fidelity: 'Der Entwurf gibt die Grundstruktur und die beiden Aussagen der hebräischen Vorlage zutreffend wieder: der Zehnte gehört Jahwe und ist ihm heilig. Die Herkunftsangaben beziehen sich auf Saat und Baumfrucht.'
  naturalness: „Jeder Zehnte vom Land“ ist im heutigen Deutsch missverständlich, weil „der Zehnte“ leicht als jede zehnte Person verstanden wird und „vom Land“ eher eine Herkunftsangabe als einen Genitiv des Ertrags ausdrückt. „Jeder Zehnte des Landes“ ist die etablierte und klare kultisch-rechtliche Formulierung. Die koordinierende Wiedergabe der beiden Herkunftsangaben ohne Gedankenstriche liest sich zudem flüssiger.
  terminology: „Jahwe“ gibt יהוה angemessen wieder. „heilig“ bewahrt קֹדֶשׁ, ohne die Formel zu „hochheilig“ zu verschärfen. „Zehnte“ ist für מַעֲשֵׂר der sachlich angemessene Fachausdruck.
