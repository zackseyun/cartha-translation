id: LEV.27.14
reference: Leviticus 27:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אִ֗ישׁ כִּֽי יַקְדִּ֨שׁ אֶת בֵּית֥/וֹ קֹ֨דֶשׁ֙ לַֽ/יהוָ֔ה וְ/הֶעֱרִיכ/וֹ֙ הַ/כֹּהֵ֔ן בֵּ֥ין ט֖וֹב וּ/בֵ֣ין רָ֑ע כַּ/אֲשֶׁ֨ר יַעֲרִ֥יךְ אֹת֛/וֹ הַ/כֹּהֵ֖ן כֵּ֥ן יָקֽוּם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/014.yaml
  text: And if a man consecrates his house as holy to Yahweh[a], then the priest shall assess it, whether good or bad; as the priest assesses it[b], so it shall stand.
translation:
  language: de
  text: Wenn jemand sein Haus als etwas Heiliges für Jahwe weiht, soll der Priester es bewerten, ob es gut oder schlecht ist[a]. Wie der Priester es bewertet[b], so soll es Bestand haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zwischen gut und schlecht“; gemeint ist die jeweilige Beschaffenheit oder Qualität des Hauses bei der Bewertung.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „seinen Wert festsetzt“. Dasselbe hebräische Verb wird in diesem Vers zweimal für die amtliche priesterliche Bewertung gebraucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי
  choice: Wenn jemand
  rationale: Die Wendung leitet einen kasuistischen Rechtsfall ein. „Jemand“ gibt das generische אִישׁ in natürlichem modernem Deutsch wieder, ohne den sachlichen Singular aufzugeben.
- source_word: יַקְדִּשׁ
  choice: weiht
  rationale: Der Hifil von קדשׁ bezeichnet hier das Aussondern eines Besitzstücks für den heiligen Bereich. „Weiht“ ist im Deutschen klarer und natürlicher als „heiligt“.
- source_word: בֵּיתוֹ
  choice: sein Haus
  rationale: Im Zusammenhang der amtlichen Bewertung ist das Gebäude beziehungsweise Grundstück gemeint; „Haus“ ist daher genauer als „Zuhause“.
- source_word: קֹדֶשׁ לַיהוָה
  choice: als etwas Heiliges für Jahwe
  rationale: Die Formulierung bewahrt den substantivischen Charakter von קֹדֶשׁ und macht deutlich, dass das Haus Jahwe als heiliger Besitz gewidmet wird.
- source_word: וְהֶעֱרִיכוֹ
  choice: soll der Priester es bewerten
  rationale: Der Hifil von ערך bezeichnet in Levitikus 27 die verbindliche priesterliche Wertfestsetzung. „Bewerten“ ist dafür ein verständlicher moderner Rechts- und Sachbegriff.
- source_word: בֵּין טוֹב וּבֵין רָע
  choice: ob es gut oder schlecht ist
  rationale: Die hebräische Gegenüberstellung beschreibt die Spannweite der Beschaffenheit beziehungsweise Qualität, die bei der Bewertung berücksichtigt wird.
- source_word: כַּאֲשֶׁר יַעֲרִיךְ אֹתוֹ הַכֹּהֵן
  choice: Wie der Priester es bewertet
  rationale: Die Wiederholung von „bewertet“ spiegelt die Wiederholung desselben hebräischen Verbs und unterstreicht die maßgebliche Rolle des Priesters.
- source_word: כֵּן יָקוּם
  choice: so soll es Bestand haben
  rationale: Die Rechtsformel besagt, dass die Festsetzung verbindlich bleibt. Die idiomatische Formulierung bewahrt zugleich die knappe Ausdrucksweise und die mögliche grammatische Rückbeziehung des Hebräischen.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, um den im Ausgangstext ausdrücklich verwendeten Eigennamen kenntlich zu machen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Tetragrammaton als Eigennamen. „Jahwe“ gibt ihn im Haupttext erkennbar wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug von כֵּן יָקוּם
  choice: Die knappe und leicht offene Rückbeziehung bleibt in „so soll es Bestand haben“ erhalten.
  alternative: „So soll die Bewertung verbindlich sein“
  rationale: Sachlich ist die priesterliche Wertfestsetzung gemeint; der hebräische Satz nennt jedoch kein ausdrückliches Substantiv für „Bewertung“. Die Übersetzung vermeidet daher eine unnötige Explizierung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rechtlich-priesterlichem Ton. Die Satzstruktur bleibt knapp und nah am hebräischen Kasusrecht; unnötige Fachsprache und konfessionell geprägte Zusätze werden vermieden.
