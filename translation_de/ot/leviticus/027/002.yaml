base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/002.yaml
  text: 'Speak to the sons of Israel and say to them: When a man makes a special vow, involving the valuation of persons to Yahweh,'
translation:
  language: de
  text: 'Rede zu den Israeliten[b] und sprich zu ihnen: Wenn ein Mann ein besonderes Gelübde ablegt, bei dem es um die Schätzung von Personen für Jahwe geht,[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Annähernd wörtlich: „nach deiner Schätzung von Personen für Jahwe“. Die hebräische Wendung ist syntaktisch schwierig; offenbar geht es um ein Gelübde hinsichtlich von Personen, denen in den folgenden Versen bestimmte Schätzwerte zugeordnet werden.'
    reason: alternative_reading
  - marker: b
    text: Hebräisch „zu den Söhnen Israels“, eine übliche Bezeichnung für das Volk Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל
  choice: Rede zu den Israeliten
  rationale: Die übliche göttliche Beauftragungsformel bleibt mit „Rede“ erkennbar; „Israeliten“ gibt die kollektive Bezeichnung בני ישראל im modernen Deutschen natürlich wieder.
- source_word: אִישׁ
  choice: ein Mann
  rationale: Bewahrt die maskuline Einzahl der hebräischen Rechtsformulierung, ohne ihre mögliche repräsentative Geltung auszuschließen.
- source_word: יַפְלִא נֶדֶר
  choice: ein besonderes Gelübde ablegt
  rationale: Der Hifil von פלא kennzeichnet das Gelübde als besonderen beziehungsweise außergewöhnlichen Akt; „ein Gelübde ablegen“ ist die natürliche deutsche Wendung.
- source_word: בְּעֶרְכְּךָ נְפָשֹׁת
  choice: bei dem es um die festgesetzte Bewertung von Personen geht
  rationale: Die schwierige Konstruktion wird im Licht der folgenden festgelegten Schätzwerte verständlich wiedergegeben. „Personen“ bezeichnet hier Menschen, nicht immaterielle Seelen.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Gibt den Gottesnamen direkt wieder; „für“ bezeichnet hier natürlich die Ausrichtung beziehungsweise Widmung des Gelübdes.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als solcher wiedergegeben und nicht durch einen Titel ersetzt.
- issue: Maskuline Rechtsformulierung אִישׁ
  choice: ein Mann
  alternative: jemand
  rationale: Die Form des Ausgangstextes bleibt sichtbar; die allgemeine rechtliche Anwendbarkeit wird dadurch nicht abschließend verneint.
- issue: Bedeutung von בְּעֶרְכְּךָ נְפָשֹׁת
  choice: festgesetzte Bewertung von Personen
  alternative: nach deiner Bewertung von Personen
  rationale: Der Kontext der folgenden Verse spricht für tariflich festgelegte Werte. Da Syntax und Zweitpersonalsuffix schwierig sind, wird die wörtlichere Möglichkeit in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Rechtssprache bleibt erkennbar, wird aber durch einen natürlichen deutschen Satzbau verständlich gemacht; die schwierige Bewertungsformel wird nicht ohne Fußnote vereindeutigt.
