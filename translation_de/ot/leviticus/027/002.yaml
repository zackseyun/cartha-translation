  naturalness: „Rede zu den Israeliten und sprich zu ihnen“ ist würdiges, modernes Bibeldeutsch. „Bei dem es um die Schätzung von Personen für Jahwe geht“ ist verständlich und wahrt die notwendige Zurückhaltung angesichts der syntaktisch schwierigen Vorlage. Die Fußnotenmarker sollten unmittelbar an den jeweils erläuterten Ausdruck stehen.
