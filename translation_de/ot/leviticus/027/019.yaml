  text: וְ/אִם גָּאֹ֤ל יִגְאַל֙ אֶת הַ/שָּׂדֶ֔ה הַ/מַּקְדִּ֖ישׁ אֹת֑/וֹ וְ֠/יָסַף חֲמִשִׁ֧ית כֶּֽסֶף עֶרְכְּ/ךָ֛ עָלָ֖י/ו וְ/קָ֥ם לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/019.yaml
  text: But if the one who consecrated it indeed redeems the field[a], then he shall add a fifth of your valuation money to it[c][b], and it shall remain his.
translation:
  language: de
  text: Wenn aber derjenige, der das Feld geweiht hat[a], es tatsächlich auslöst, muss er den Geldbetrag deiner Schätzung um ein Fünftel erhöhen[b]; dann gehört es ihm[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dem Heiligtum übereignet«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »ein Fünftel des Silbers deiner Schätzung dazu hinzufügen«.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »dann wird es für ihn bestehen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Wenn aber
  rationale: Leitet im Zusammenhang eine bedingte Fortführung mit leicht kontrastierendem Akzent ein.
- source_word: גָּאֹל יִגְאַל
  choice: tatsächlich auslöst
  rationale: Die Verbindung von Infinitivus absolutus und Imperfekt verstärkt den Verbalbegriff; »tatsächlich« gibt diese Hervorhebung natürlich wieder.
- source_word: הַשָּׂדֶה
  choice: das Feld
  rationale: Bezeichnet das zuvor behandelte, geheiligte Feld.
- source_word: הַמַּקְדִּישׁ אֹתוֹ
  choice: derjenige, der das Feld geheiligt hat
  rationale: »Heiligen« bewahrt den kultischen Sinn des Absonderns für den HERRN; die Wiederaufnahme von »das Feld« vermeidet im Deutschen einen mehrdeutigen Pronomenbezug.
- source_word: וְיָסַף
  choice: muss er ... hinzufügen
  rationale: Im gesetzlichen Kontext drückt die Form eine verbindliche Vorschrift aus; »muss« ist in modernem Deutsch klarer als ein rechtssprachlich altertümliches »soll«.
- source_word: חֲמִשִׁית
  choice: ein Fünftel
  rationale: Präzise und idiomatische Wiedergabe des gesetzlichen Zuschlags.
- source_word: כֶּסֶף עֶרְכְּךָ
  choice: des Geldbetrags deiner Schätzung
  rationale: Gibt wörtlich »Silber deiner Schätzung« verständlich wieder und erhält die Anrede in der zweiten Person.
- source_word: עָלָיו
  choice: hinzufügen
  rationale: Der präpositionale Bezug bezeichnet das Aufschlagen des Fünftels auf den Schätzbetrag und wird im Deutschen bereits durch das transitive »hinzufügen« natürlich ausgedrückt.
- source_word: וְקָם לוֹ
  choice: dann wird es ihm zugesprochen
  rationale: Die Rechtsformel bezeichnet, dass das Feld nach der Zahlung rechtswirksam für ihn feststeht; die Übersetzung wahrt den rechtlichen Ergebnissinn, ohne den Besitzstatus durch »bleibt sein« vorwegzunehmen.
theological_decisions:
- issue: Kultischer Sinn von הקדישׁ
  choice: geheiligt
  alternative: geweiht / dem Heiligtum übereignet
  rationale: »Geheiligt« erhält den Gedanken des kultischen Absonderns. Die Fußnote nennt verständliche Alternativen, ohne den Vorgang auf eine rein weltliche Schenkung zu reduzieren.
- issue: Rechtliche Aussage von וְקָם לוֹ
  choice: dann wird es ihm zugesprochen
  alternative: dann gehört es ihm / dann bleibt es sein
  rationale: Die hebräische Wendung lautet wörtlich »es steht für ihn« und beschreibt die rechtswirksame Zuordnung. »Zugesprochen« vermeidet die mögliche Überinterpretation, das Feld sei während der Weihe uneingeschränkt sein Eigentum geblieben.
- issue: Normative Kraft der Satzfolge
  choice: muss ...; dann wird
  alternative: soll ...; und es wird
  rationale: Der gesetzliche Kontext verlangt eine verpflichtende und anschließend resultative Wiedergabe, nicht die Lesart einer vergangenen Erzählung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Gesetzessprache. »Auslösen« entspricht dem etablierten sachlichen Wortfeld für die Rückgewinnung geweihten Eigentums; »tatsächlich« erhält die hebräische Verstärkung. Alle Fußnotenmarker stehen unmittelbar bei der jeweils erklärten Formulierung.
