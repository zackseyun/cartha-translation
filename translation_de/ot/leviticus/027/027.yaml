  text: וְ/אִ֨ם בַּ/בְּהֵמָ֤ה הַ/טְּמֵאָה֙ וּ/פָדָ֣ה בְ/עֶרְכֶּ֔/ךָ וְ/יָסַ֥ף חֲמִשִׁת֖/וֹ עָלָ֑י/ו וְ/אִם לֹ֥א יִגָּאֵ֖ל וְ/נִמְכַּ֥ר בְּ/עֶרְכֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/027.yaml
  text: But if it is among the unclean animals[a], then he shall redeem it at your valuation and add a fifth of it to it; and if it is not redeemed[b], then it shall be sold at your valuation.
translation:
  language: de
  text: Gehört es aber zu den unreinen Tieren[a], so kann er es nach deiner Schätzung auslösen und ein Fünftel des Schätzwerts dazuzahlen[b]. Wird es nicht ausgelöst, soll es nach deiner Schätzung verkauft werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint sind Tiere, die nach dem Ritualgesetz als unrein gelten.
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: Auf den festgesetzten Schätzwert werden zwanzig Prozent aufgeschlagen. Wörtlich: „sein Fünftel darauf hinzufügen“.'
    reason: lexical_clarification
lexical_decisions:
- source_word: בַּבְּהֵמָה הַטְּמֵאָה
  choice: zu den unreinen Tieren gehört
  rationale: 'Die Präposition ב wird hier klassifizierend beziehungsweise partitiv verstanden: Das geweihte Tier gehört zur Gruppe der nach dem Ritualgesetz unreinen Tiere. „Tiere“ ist im Deutschen weiter und natürlicher als „Vieh“, ohne den sachlichen Bezug zu verlieren.'
- source_word: וּפָדָה
  choice: so kann er es … auslösen
  rationale: פדה bezeichnet das Auslösen oder Zurückkaufen. Der folgende Fall „Wird es nicht ausgelöst“ zeigt, dass die Auslösung eine vorgesehene Möglichkeit und keine ausnahmslose Pflicht ist; „kann“ gibt diesen rechtlichen Sinn natürlich wieder.
- source_word: בְעֶרְכֶּךָ
  choice: nach deiner Schätzung
  rationale: עֵרֶךְ bezeichnet in Levitikus 27 den festgesetzten Schätzwert. Die zweite Person Singular bleibt durch „deiner“ erhalten und richtet sich im Kontext an den Priester.
- source_word: וְיָסַף חֲמִשִׁתוֹ עָלָיו
  choice: und ein Fünftel des Schätzwerts dazuzahlen
  rationale: Die hebräische Wendung bedeutet, dass auf den festgesetzten Wert ein weiteres Fünftel aufgeschlagen wird. Die explizite Nennung des Schätzwerts verhindert im Deutschen einen unklaren Pronomenbezug.
- source_word: וְאִם לֹא יִגָּאֵל
  choice: Wird es nicht ausgelöst
  rationale: Die passive Form lässt die handelnde Person ungenannt. Das deutsche Passiv bewahrt diese Offenheit.
- source_word: וְנִמְכַּר
  choice: soll es … verkauft werden
  rationale: Die passive Verbform hat in diesem Rechtssatz regelnden Charakter; „soll“ drückt die vorgeschriebene Folge idiomatisch aus.
theological_decisions:
- issue: Bedeutung von „unrein“
  choice: „unrein“ bezeichnet die rituelle Einordnung des Tieres nach dem Gesetz.
  alternative: Das Tier als moralisch oder an sich verwerflich zu verstehen.
  rationale: Der Kontext handelt von kultischer Eignung, Weihe und Schätzung; er trifft kein moralisches Urteil über das Tier.
- issue: Pflicht oder Möglichkeit der Auslösung
  choice: Die Auslösung wird als mögliche Vorgehensweise wiedergegeben.
  alternative: „Er soll es auslösen“ als unbedingte Verpflichtung.
  rationale: Die unmittelbar anschließende Regel für den Fall, dass keine Auslösung erfolgt, spricht dafür, dass das Auslösen nicht zwingend in jedem Fall verlangt wird. Die rechtliche Spannung wird durch „kann“ und die anschließende Verkaufsbestimmung sichtbar gehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Rechtssprache. „Auslösen“ bewahrt den sachlichen Zusammenhang von Weihe, Schätzung und Rückerwerb; „dazuzahlen“ macht den Aufschlag verständlich. Die Satzstruktur bleibt knapp und folgt der kasuistischen Abfolge des Hebräischen.
