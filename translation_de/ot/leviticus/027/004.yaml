  text: וְ/אִם נְקֵבָ֖ה הִ֑וא וְ/הָיָ֥ה עֶרְכְּ/ךָ֖ שְׁלֹשִׁ֥ים שָֽׁקֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/004.yaml
  text: But if it is a female[a], then your valuation shall be thirty shekels.
translation:
  language: de
  text: Handelt es sich aber um eine weibliche Person, soll dein Schätzwert dreißig Schekel betragen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: Ist es aber
  rationale: Die Verbindung aus Konjunktion und Bedingungspartikel führt den Gegensatz zum vorherigen Vers ein. Die Nachstellung von »aber« gibt diesen Kontrast im Deutschen natürlich wieder.
- source_word: נְקֵבָה הִוא
  choice: es ... eine weibliche Person
  rationale: נְקֵבָה bezeichnet allgemein das weibliche Geschlecht. Da der Zusammenhang von Menschen handelt, ist »weibliche Person« präziser und würdiger als das im Deutschen oft tierbezogene substantivierte »Weibchen«; das grammatisch feminine Pronomen wird in dieser klassifizierenden Formulierung idiomatisch mit »es« wiedergegeben.
- source_word: וְהָיָה
  choice: soll ... betragen
  rationale: Das Verb leitet in der Rechtsbestimmung die Folge des Bedingungssatzes ein. »Soll ... betragen« drückt den festgesetzten Wert in natürlichem deutschem Rechtsstil aus.
- source_word: עֶרְכְּךָ
  choice: dein Schätzwert
  rationale: עֶרֶךְ bezeichnet in Levitikus 27 den für ein Gelübde festgesetzten Wert. »Schätzwert« bewahrt den rechtlich-finanziellen Sinn und gibt das Suffix der zweiten Person Singular wieder.
- source_word: שְׁלֹשִׁים שָׁקֶל
  choice: dreißig Schekel
  rationale: Die Zahl wird direkt wiedergegeben; »Schekel« ist im Deutschen nach Zahlwörtern als unveränderte Pluralform üblich. Silber wird nicht ergänzt, da es in diesem Vers nicht ausdrücklich steht.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger und gut verständlicher Rechtstext. Die Formulierung »weibliche Person« wahrt den allgemeinen Geschlechtsbegriff des Hebräischen, ohne die im heutigen Deutsch problematische oder tierbezogene Wirkung von »Weibchen«.
