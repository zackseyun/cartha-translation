base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/033.yaml
  text: He shall not inspect whether it is good or bad[a], nor shall he exchange it; and if he does in fact exchange it, then both it and its substitute shall be holy[b]; it shall not be redeemed.
translation:
  language: de
  text: Man soll nicht prüfen, ob es gut oder schlecht ist[a], und es nicht austauschen. Tauscht man es dennoch aus[b], so sollen sowohl das Tier als auch sein Ersatztier heilig sein; es darf nicht ausgelöst werden[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »zwischen gut und schlecht prüfen«; gemeint ist eine Auswahl nach der Qualität des Tieres.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Hebräische verstärkt das Verb: »wenn man es tatsächlich austauscht«.'
    reason: lexical_alternative
  - marker: c
    text: 'Das abschließende Verb steht im Hebräischen im Singular: »Es darf nicht ausgelöst werden.« Sein genauer Bezug wird nicht eigens wiederholt.'
    reason: textual_clarity
lexical_decisions:
- source_word: יְבַקֵּר / בֵּין טוֹב לָרַע
  choice: prüfen, ob es gut oder schlecht ist
  rationale: Das Piel von בקר bezeichnet im Zusammenhang des Tierzehnten ein prüfendes Auswählen nach Qualität. Die deutsche Formulierung gibt den hebräischen Ausdruck »zwischen gut und schlecht« natürlich wieder.
- source_word: יְמִירֶנּוּ / הָמֵר יְמִירֶנּוּ
  choice: es austauschen / tauscht man es dennoch aus
  rationale: מור ist hier der rechtliche Fachausdruck für den Ersatz eines geweihten beziehungsweise verzehnteten Tieres. »Dennoch« gibt die emphatische Verbindung von Infinitivus absolutus und finitem Verb angemessen wieder.
- source_word: תְמוּרָתוֹ
  choice: sein Ersatztier
  rationale: Gemeint ist konkret das Tier, das an die Stelle des ursprünglichen Tieres gesetzt wird. »Ersatztier« ist im Deutschen eindeutig und knapp.
- source_word: קֹדֶשׁ
  choice: heilig
  rationale: Das Wort bezeichnet die Zugehörigkeit zum heiligen Bereich Gottes und bewahrt den kultisch-rechtlichen Ton von Levitikus.
- source_word: לֹא יִגָּאֵל
  choice: keines von ihnen darf ausgelöst werden
  rationale: גאל bezeichnet hier das Zurückerwerben aus dem geweihten Status. Wegen der unmittelbar zuvor genannten zwei Tiere wird das singularische Subjekt im Deutschen sinngemäß auf beide bezogen; die Fußnote macht die Form des Hebräischen transparent.
theological_decisions:
- issue: Kultisch-rechtliche Bedeutung von Heiligkeit und Auslösung
  choice: »heilig« und »ausgelöst werden«
  alternative: »geweiht/sakral« und »zurückgekauft werden«
  rationale: Die gewählten Begriffe erhalten den sakralen Rechtscharakter des Textes, ohne spätere dogmatische Vorstellungen in den Vers hineinzutragen.
- issue: Bezug des abschließenden singularischen Verbots
  choice: Im Haupttext auf beide zuvor genannten Tiere bezogen
  alternative: 'Wörtlich singularisch: »Es darf nicht ausgelöst werden«'
  rationale: Der Zusammenhang legt nahe, dass weder das ursprüngliche Tier noch das Ersatztier ausgelöst werden darf. Da das Hebräische formal im Singular steht, wird diese Spannung in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit sachlich-rechtlichem Ton. Das unpersönliche »man« gibt die allgemeine Vorschrift natürlich wieder; »Tier« wird zur Klarheit einmal ergänzt.
