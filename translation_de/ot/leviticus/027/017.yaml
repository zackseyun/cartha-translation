lexical_decisions:
- source_word: אִם
  choice: Wenn
  rationale: Die übliche deutsche Entsprechung der konditionalen Partikel in einem Rechtssatz.
- source_word: מִשְּׁנַת הַיֹּבֵל
  choice: vom Jubeljahr an
  rationale: מִן bezeichnet hier den zeitlichen Ausgangspunkt; die Formulierung ist natürlich und passt zur Berechnung der verbleibenden Zeit bis zum nächsten Jubeljahr.
- source_word: יַקְדִּישׁ
  choice: heiligt
  rationale: Der Hifil von קדשׁ bezeichnet hier, dass das Feld als heilig ausgesondert wird; „heiligt“ bewahrt den kultischen Sinn.
- source_word: שָׂדֵהוּ
  choice: sein Feld
  rationale: Direkte Wiedergabe des Nomens mit Possessivsuffix.
- source_word: כְּעֶרְכְּךָ
  choice: deine Bewertung
  rationale: Bezeichnet den festgesetzten Wert des angesprochenen Priesters; im Deutschen ergibt sich mit „gilt“ eine knappe rechtssprachliche Formulierung.
- source_word: יָקוּם
  choice: gilt
  rationale: קום drückt in diesem rechtlichen Zusammenhang aus, dass die Bewertung Bestand und Gültigkeit hat.
theological_decisions:
- issue: Kultischer Ausdruck für die Aussonderung eines Grundstücks als heilig
  choice: heiligt
  alternative: weiht
  rationale: „Heiligt“ bildet den Wortstamm קדשׁ erkennbar ab und bewahrt den kultischen Gehalt, ohne über den hebräischen Text hinaus eine bestimmte konfessionelle Vorstellung einzutragen.
translation_notes:
  register: Moderner, würdevoller und knapper Rechtston. „Vom Jubeljahr an“ macht den zeitlichen Ausgangspunkt deutlich; „gilt“ gibt die rechtliche Bestandskraft idiomatisch wieder.
