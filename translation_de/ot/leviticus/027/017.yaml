base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/017.yaml
  text: If he consecrates his field from the year of jubilee[a], your valuation shall stand.
translation:
  language: de
  text: Wenn er sein Feld vom Jubeljahr an weiht[a], bleibt deine Schätzung bestehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „heiligt“. Das hebräische Verb bezeichnet, etwas als heilig auszusondern.'
