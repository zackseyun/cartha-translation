    issue: „Hirtenstab“ legt den Besitzer bzw. die konkrete Art des Stabes fest.
    rationale: Der hebräische Text nennt lediglich einen שֵׁבֶט, einen Stab bzw. eine Rute. Der Zählzusammenhang ist naheliegend, aber „Hirten-“ ist eine zusätzliche Spezifizierung.
  - severity: medium
    issue: Die Verbindung „von jedem Zehnten … soll das jeweils zehnte Tier“ ist missverständlich.
    rationale: Sie kann einen Zehnten als Ausgangsmenge und anschließend ein weiteres zehntes Tier daraus nahelegen. Der Text bezeichnet den Tierzehnten gerade durch das jeweils zehnte vorbeigehende Tier.
  - severity: low
