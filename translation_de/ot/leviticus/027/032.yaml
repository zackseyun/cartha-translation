  text: וְ/כָל מַעְשַׂ֤ר בָּקָר֙ וָ/צֹ֔אן כֹּ֥ל אֲשֶׁר יַעֲבֹ֖ר תַּ֣חַת הַ/שָּׁ֑בֶט הָֽ/עֲשִׂירִ֕י יִֽהְיֶה קֹּ֖דֶשׁ לַֽ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/032.yaml
  text: And every tithe of the herd and the flock[a], every tenth animal that passes under the rod[b], shall be holy to Yahweh.
translation:
  language: de
  text: Von den Rindern und dem Kleinvieh soll jedes zehnte Tier[a], das unter dem Stab[b] hindurchgeht, Jahwe heilig sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das Zehnte“. Gemeint ist jeweils das zehnte Tier bei der Zählung.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „Rute“. Die Wendung beschreibt das Zählen der Tiere, während sie einzeln unter dem Stab hindurchgehen.'
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כָל מַעְשַׂר
  choice: Auch von jedem Zehnten
  rationale: מַעְשַׂר bezeichnet den als Abgabe ausgesonderten zehnten Teil. „Jeder Zehnte“ bewahrt den rechtlichen Fachsinn; „von“ verbindet ihn im Deutschen natürlich mit den folgenden Tiergruppen.
- source_word: בָּקָר וָ/צֹאן
  choice: der Rinder und des Kleinviehs
  rationale: בָּקָר bezeichnet Rinder als Großvieh; צֹאן ist der Sammelbegriff für kleinere Herdentiere, besonders Schafe und Ziegen. „Kleinvieh“ erhält diese Breite.
- source_word: כֹּל אֲשֶׁר יַעֲבֹר תַּחַת הַ/שָּׁבֶט
  choice: das … unter dem Hirtenstab hindurchgeht
  rationale: Die Wendung beschreibt das einzelne Vorbeiziehen der Tiere zum Zählen. „Hirtenstab“ macht den konkreten Zusammenhang deutlich, ohne die Bildsprache aufzulösen.
- source_word: הָ/עֲשִׂירִי
  choice: das jeweils zehnte Tier
  rationale: Wörtlich steht substantivisch „das Zehnte“. Das ergänzte „Tier“ ist aus dem unmittelbaren Zusammenhang eindeutig; „jeweils“ gibt den wiederholten Zählvorgang präzise wieder.
- source_word: יִהְיֶה קֹּדֶשׁ
  choice: soll … heilig sein
  rationale: Die Formulierung bewahrt sowohl den rechtlich-normativen Charakter als auch die direkte Heiligkeitsaussage des Hebräischen.
- source_word: לַ/יהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als Eigenname wiedergegeben; der Dativ ist durch die deutsche Konstruktion „Jahwe heilig“ ausgedrückt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Tetragrammaton ausdrücklich. „Jahwe“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von קֹדֶשׁ im Abgaberecht
  choice: heilig sein
  alternative: geweiht sein
  rationale: „Heilig“ erhält die grundlegende Kategorie der Zugehörigkeit zu Gott und vermeidet, die Aussage auf einen bestimmten Weihevorgang einzuengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rechtliche Terminologie bleibt erkennbar; die implizite Tierbezeichnung wird für die Verständlichkeit ergänzt. „Kleinvieh“ umfasst hier vor allem Schafe und Ziegen.
