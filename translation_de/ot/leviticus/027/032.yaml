  source_fidelity: 'Die Grundbedeutung wird getroffen: Es geht um den Zehnten von Rindern und Kleinvieh, konkret um jedes zehnte Tier beim Vorbeiziehen unter dem Stab, das Jahwe heilig sein soll. „Hirtenstab“ ist jedoch stärker bestimmt als das hebräische שֵׁבֶט („Stab/Rute“) und sollte nicht in den Text aufgenommen werden. Die Formulierung „Auch von jedem Zehnten“ ist zudem syntaktisch und sachlich weniger klar als eine direkte Wiedergabe des gemeinten Tierzehnten.'
  naturalness: Die vorliegende Satzstellung ist verständlich, aber „Auch von jedem Zehnten der Rinder und des Kleinviehs soll das jeweils zehnte Tier“ wirkt schwerfällig und kann so klingen, als werde aus jedem bereits bestehenden Zehnten nochmals ein zehntes Tier ausgewählt. Eine direktere Formulierung ist im modernen Standarddeutsch klarer.
  terminology: „Kleinvieh“ ist für צֹאן angemessen und bewahrt die Einschließlichkeit von Schafen und Ziegen. „Jahwe“ gibt יהוה sachgerecht wieder. „Heilig sein“ bewahrt קֹדֶשׁ. Für שֵׁבֶט ist im Haupttext das neutrale „Stab“ vorzuziehen.
  issues:
