revisions:
- from: Auch von jedem Zehnten der Rinder und des Kleinviehs soll das jeweils zehnte Tier[a], das unter dem Hirtenstab[b] hindurchgeht, Jahwe heilig sein.
  to: Von den Rindern und dem Kleinvieh soll jedes zehnte Tier[a], das unter dem Stab[b] hindurchgeht, Jahwe heilig sein.
  rationale: Die Revision gibt die rechtliche Aussage unmittelbar und idiomatisch wieder, ohne den impliziten Bezug auf das einzelne Tier zu verlieren. „Stab“ wahrt die lexikalische Offenheit von שֵׁבֶט; die Fußnote erläutert den Zählzusammenhang, ohne einen im hebräischen Wortlaut nicht genannten Hirten einzuführen.
