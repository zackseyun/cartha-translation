  text: and the priest shall assess it[a], whether good or bad; as the priest assesses it, so it shall be.
translation:
  language: de
  text: Der Priester soll das Tier bewerten, ob es gut oder schlecht ist. Wie der Priester[a] es bewertet, so soll es gelten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Nach deiner Bewertung, Priester, soll es gelten.“ Das Hebräische verwendet hier eine ungewöhnliche Form der 2. Person Singular; im Zusammenhang ist die Bewertung des Priesters gemeint.'
    reason: Die Fußnote gibt die mögliche Anrede und das Suffix der 2. Person Singular genauer wieder, ohne die syntaktische Besonderheit übermäßig zu harmonisieren.
lexical_decisions:
- source_word: וְהֶעֱרִיךְ
  choice: soll … beurteilen
  rationale: Der Hifil von ערך bezeichnet hier die amtliche Einschätzung beziehungsweise Wertfestsetzung eines gelobten Tieres. „Beurteilen“ passt besonders zur unmittelbar folgenden Qualitätsangabe.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Entspricht der üblichen Wiedergabe von כֹּהֵן und bewahrt den bestimmten Artikel.
- source_word: אֹתָהּ
  choice: das Tier
  rationale: Das feminine Singularpronomen bezieht sich auf das Tier aus dem Zusammenhang. Die ausdrückliche Benennung schafft im Deutschen einen klaren Bezug.
- source_word: בֵּין טוֹב וּבֵין רָע
  choice: ob es gut oder schlecht ist
  rationale: Natürliche deutsche Wiedergabe der wörtlichen Wendung „zwischen gut und schlecht“, die hier eine Beurteilung der Beschaffenheit ausdrückt.
- source_word: כְּעֶרְכְּךָ הַכֹּהֵן
  choice: Wie der Priester es bewertet
  rationale: Der hebräische Text enthält wörtlich ein Suffix der 2. Person Singular („gemäß deiner Bewertung“) und anschließend „der Priester“. Im Zusammenhang bezeichnet die Wendung die verbindliche Bewertung durch den Priester; die Fußnote macht die ungewöhnliche Form sichtbar.
- source_word: כֵּן יִהְיֶה
  choice: so soll es gelten
  rationale: Die Formulierung bringt im deutschen Rechtston zum Ausdruck, dass die priesterliche Bewertung verbindlich ist.
