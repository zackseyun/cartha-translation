id: LEV.27.3
reference: Leviticus 27:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הָיָ֤ה עֶרְכְּ/ךָ֙ הַ/זָּכָ֔ר מִ/בֶּן֙ עֶשְׂרִ֣ים שָׁנָ֔ה וְ/עַ֖ד בֶּן שִׁשִּׁ֣ים שָׁנָ֑ה וְ/הָיָ֣ה עֶרְכְּ/ךָ֗ חֲמִשִּׁ֛ים שֶׁ֥קֶל כֶּ֖סֶף בְּ/שֶׁ֥קֶל הַ/קֹּֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/003.yaml
  text: And your valuation for the male from twenty years old up to sixty years old shall be fifty shekels of silver[a], according to the sanctuary shekel.
translation:
  language: de
  text: Für einen Mann im Alter von zwanzig bis sechzig Jahren soll dein Schätzwert fünfzig Schekel Silber betragen, nach dem Schekel des Heiligtums.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֶרְכְּךָ
  choice: dein Schätzwert
  rationale: עֵרֶךְ bezeichnet hier den im Rahmen eines Gelübdes festgesetzten kultisch-rechtlichen Wert, nicht den persönlichen oder inneren Wert eines Menschen. Das Suffix der zweiten Person wird mit „dein“ bewahrt.
- source_word: הַזָּכָר
  choice: einen Mann
  rationale: Das Wort bezeichnet in dieser Altersgruppe eine männliche Person. „Mann“ ist im modernen Deutschen natürlicher als das substantivierte „der Männliche“, ohne die geschlechtsspezifische Kategorie zu neutralisieren.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וְעַד בֶּן שִׁשִּׁים שָׁנָה
  choice: im Alter von zwanzig bis sechzig Jahren
  rationale: Die hebräische Wendung bezeichnet eine Altersspanne; diese Formulierung gibt sie klar und idiomatisch wieder, ohne die Frage der Ein- oder Ausschließlichkeit der Grenzalter unnötig auszudeuten.
- source_word: חֲמִשִּׁים שֶׁקֶל כֶּסֶף
  choice: fünfzig Schekel Silber
  rationale: Die Formulierung bewahrt Schekel als antike Gewichts- beziehungsweise Recheneinheit und nennt Silber ausdrücklich als Material.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: nach dem Schekel des Heiligtums
  rationale: Die Präposition בְּ bezeichnet hier den maßgeblichen Standard. „Schekel des Heiligtums“ gibt den kultischen Referenzmaßstab wieder und ist natürlicher als „heiliger Schekel“.
- source_word: וְהָיָה ... וְהָיָה
  choice: soll ... betragen
  rationale: Im gesetzlichen Kontext drückt die Konstruktion eine verbindliche Festsetzung aus. „Soll ... betragen“ ist dafür in modernem, würdigem Deutsch angemessen.
theological_decisions:
- issue: Geschlechtsspezifische Bewertungskategorie
  choice: einen Mann
  alternative: eine männliche Person; den Männlichen
  rationale: Der Text unterscheidet ausdrücklich nach Geschlecht und Alter. Die männliche Kategorie bleibt erhalten; zugleich wird sie in natürlichem Deutsch formuliert.
- issue: Bedeutung des Schätzwerts
  choice: kultisch-rechtlich festgesetzter Schätzwert
  alternative: persönlicher Wert; Marktwert
  rationale: Der Abschnitt regelt den für ein Gelübde angesetzten Betrag. Er trifft keine Aussage über Menschenwürde oder den inneren Wert der betreffenden Person.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem rechtlich-kultischem Ton. Die Satzstruktur wurde gegenüber dem Hebräischen leicht geglättet; die geschlechtsspezifische und kultische Terminologie bleibt erhalten.
