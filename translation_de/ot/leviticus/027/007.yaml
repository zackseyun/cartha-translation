  verdict: revise
  source_fidelity: Die Altersgrenze (ab sechzig Jahren), die Gegenüberstellung männlich/weiblich und die Beträge von fünfzehn bzw. zehn Schekel sind zutreffend wiedergegeben. Die Formulierung „von dir festgesetzte[r] Wert“ legt jedoch stärker als der hebräische Ausdruck nahe, dass der Angeredete die Beträge individuell festsetzt. עֶרְכְּךָ bezeichnet hier die im Gesetz festgelegte „Schätzung“ bzw. den Schätzbetrag.
  naturalness: Der Entwurf ist insgesamt verständlich und modernes Standarddeutsch. „Soll der ... Wert für ... fünfzehn Schekel und für ... zehn Schekel betragen“ ist jedoch stilistisch schwerfällig. Mit „deine Schätzung“ wird die Satzstruktur klarer und zugleich näher am technischen Sprachgebrauch des Kapitels.
  terminology: „Schätzung“ ist in Levitikus 27 die angemessene deutsche Wiedergabe des technischen Begriffs עֶרֶךְ. „Männliche/weibliche Person“ bewahrt die biologische Paarung des hebräischen זָכָר/נְקֵבָה, ohne unzulässig „Mann/Frau“ einzusetzen.
