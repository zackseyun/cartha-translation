  text: וְ֠/אִם מִ/בֶּן שִׁשִּׁ֨ים שָׁנָ֤ה וָ/מַ֨עְלָ/ה֙ אִם זָכָ֔ר וְ/הָיָ֣ה עֶרְכְּ/ךָ֔ חֲמִשָּׁ֥ה עָשָׂ֖ר שָׁ֑קֶל וְ/לַ/נְּקֵבָ֖ה עֲשָׂרָ֥ה שְׁקָלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/007.yaml
  text: And if from sixty years old and upward[a], if male, then your valuation shall be fifteen shekels[b], and for the female ten shekels.
translation:
  language: de
  text: Und wenn jemand sechzig Jahre oder älter ist, soll deine Schätzung für eine männliche Person fünfzehn Schekel und für eine weibliche Person zehn Schekel betragen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֶּן שִׁשִּׁים שָׁנָה וָמַעְלָה
  choice: sechzig Jahre oder älter
  rationale: Die hebräische Altersformel bezeichnet die Schwelle von sechzig Jahren einschließlich aller höheren Altersstufen. Die deutsche Formulierung gibt dies natürlich und eindeutig wieder.
- source_word: זָכָר
  choice: männliche Person
  rationale: Das Wort bezeichnet hier das biologische Geschlecht der bewerteten Person, nicht eine bestimmte gesellschaftliche Alters- oder Statusgruppe.
- source_word: עֶרְכְּךָ
  choice: der von dir festgesetzte Wert
  rationale: Im Zusammenhang von Levitikus 27 ist ein festgelegter Bewertungsbetrag gemeint. Die Formulierung bewahrt den Bezug der zweiten Person Singular und macht den technischen Sinn im Deutschen verständlich.
- source_word: חֲמִשָּׁה עָשָׂר שָׁקֶל
  choice: fünfzehn Schekel
  rationale: Direkte Wiedergabe der Zahl und der antiken Gewichts- beziehungsweise Werteinheit.
- source_word: לַנְּקֵבָה
  choice: für eine weibliche Person
  rationale: Die Formulierung entspricht dem Gegenbegriff ‚männliche Person‘ und bezeichnet auch hier das biologische Geschlecht.
- source_word: עֲשָׂרָה שְׁקָלִים
  choice: zehn Schekel
  rationale: Direkte Wiedergabe der Zahl und Einheit.
