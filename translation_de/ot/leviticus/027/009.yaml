id: LEV.27.9
reference: Leviticus 27:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אִם בְּהֵמָ֔ה אֲשֶׁ֨ר יַקְרִ֧יבוּ מִמֶּ֛/נָּה קָרְבָּ֖ן לַֽ/יהוָ֑ה כֹּל֩ אֲשֶׁ֨ר יִתֵּ֥ן מִמֶּ֛/נּוּ לַ/יהוָ֖ה יִֽהְיֶה קֹּֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/009.yaml
  text: And if it is an animal from which they present an offering to Yahweh[a], everything that one gives from it to Yahweh shall be holy.
translation:
  language: de
  text: Und wenn es ein Tier ist, von dem man Yahweh eine Opfergabe darbringt[a], soll alles, was man Yahweh davon gibt, heilig sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Tier, das sich als Opfergabe für Yahweh eignet“. Die hebräische Formulierung kann entweder ein Tier bezeichnen, von dem tatsächlich eine Opfergabe dargebracht wird, oder allgemein ein Tier, das als Opfer geeignet ist.'
    reason: lexikalisch-syntaktische Alternative
lexical_decisions:
- source_word: וְאִם
  choice: Und wenn
  rationale: Bewahrt sowohl die fortführende Verknüpfung durch וְ als auch den bedingenden Charakter von אִם und klingt in einem deutschen Gesetzestext natürlich.
- source_word: בְּהֵמָה
  choice: Tier
  rationale: Gibt den allgemeinen Ausdruck im Opferkontext verständlich wieder, ohne ihn unnötig auf Nutzvieh einzuengen.
- source_word: אֲשֶׁר יַקְרִיבוּ מִמֶּנָּה קָרְבָּן לַיהוָה
  choice: von dem man Yahweh eine Opfergabe darbringt
  rationale: „Darbringen“ trifft den kultischen Hifil-Gebrauch von קרב; „von dem“ bewahrt die durch מִן bezeichnete Herkunft. Das unbestimmte „man“ gibt den nicht ausdrücklich genannten allgemeinen Handlungsträger natürlich wieder.
- source_word: קָרְבָּן
  choice: Opfergabe
  rationale: Der Ausdruck bezeichnet eine Gott dargebrachte Gabe und wird im Deutschen im Opferzusammenhang klar und würdig wiedergegeben.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Der im hebräischen Text stehende Gottesname יהוה wird als „Yahweh“ wiedergegeben.
- source_word: כֹּל אֲשֶׁר יִתֵּן מִמֶּנּוּ
  choice: alles, was man davon … gibt
  rationale: Bewahrt den umfassenden Sinn von כֹּל und den generischen Singular des Verbs, ohne einen ausdrücklich männlichen Geber einzuführen; „davon“ verweist idiomatisch auf das Tier zurück.
- source_word: יִהְיֶה קֹדֶשׁ
  choice: soll … heilig sein
  rationale: „Heilig“ bewahrt den kultisch-theologischen Gehalt von קֹדֶשׁ; „soll“ entspricht dem verpflichtenden Charakter der Rechtsbestimmung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR / Jehova
  rationale: Der Eigenname wird erkennbar als Gottes Bundesname wiedergegeben und nicht durch einen Titel ersetzt.
- issue: Deutung des Relativsatzes zum Opfertier
  choice: ein Tier, von dem tatsächlich eine Opfergabe dargebracht wird
  alternative: ein Tier, das als Opfergabe dargebracht werden darf bzw. für Opfer geeignet ist
  rationale: Die Formulierung folgt möglichst direkt dem Satzbau mit יַקְרִיבוּ und מִמֶּנָּה, legt die im Hebräischen mögliche kategorische beziehungsweise Eignungsdeutung aber nicht stillschweigend fest; sie wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kultischem Fachwortschatz. „Opfergabe“ und „heilig“ erhalten den sachlichen und theologischen Ton des Gesetzestextes; generisches „man“ vermeidet eine im Ausgangstext nicht geforderte Geschlechtsfestlegung.
