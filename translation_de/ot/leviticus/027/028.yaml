  text: אַךְ כָּל חֵ֡רֶם אֲשֶׁ֣ר יַחֲרִם֩ אִ֨ישׁ לַֽ/יהוָ֜ה מִ/כָּל אֲשֶׁר ל֗/וֹ מֵ/אָדָ֤ם וּ/בְהֵמָה֙ וּ/מִ/שְּׂדֵ֣ה אֲחֻזָּת֔/וֹ לֹ֥א יִמָּכֵ֖ר וְ/לֹ֣א יִגָּאֵ֑ל כָּל חֵ֕רֶם קֹֽדֶשׁ קָֽדָשִׁ֥ים ה֖וּא לַ/יהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/028.yaml
  text: However[a], every devoted thing that a man devotes to Yahweh from all that belongs to him—whether human or animal, or from the field of his inherited property—shall not be sold or redeemed. Every devoted thing is most holy to Yahweh.
translation:
  language: de
  text: Doch alles, was ein Mann dem HERRN mit dem Bann weiht[a], aus allem, was ihm gehört – sei es ein Mensch, ein Tier oder ein Feld seines Erbbesitzes –, darf weder verkauft noch ausgelöst werden. Alles, was mit dem Bann geweiht ist, ist dem HERRN hochheilig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch ḥerem, ein Fachbegriff für etwas, das unwiderruflich für den HERRN ausgesondert ist. Je nach Zusammenhang kann der Begriff auch bezeichnen, dass etwas unter den Bann gestellt und der Vernichtung preisgegeben wird.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Doch
  rationale: Kennzeichnet den einschränkenden bzw. kontrastierenden Übergang von den zuvor behandelten Gelübdegaben, die ausgelöst werden können.
- source_word: חֵרֶם / יַחֲרִם
  choice: Gebanntes / bannt
  rationale: Bewahrt den Zusammenhang von Substantiv und Verb sowie den technischen Charakter des hebräischen Wortfeldes. Die Fußnote erläutert, dass es um unwiderrufliche Aussonderung für den HERRN geht und je nach Kontext auch Vernichtung gemeint sein kann.
- source_word: אִישׁ
  choice: ein Mann
  rationale: Gibt die grammatisch maskuline Einzahl der hebräischen Rechtssprache wieder, die hier repräsentative Funktion hat.
- source_word: לַיהוָה
  choice: dem HERRN
  rationale: Verwendet die übliche deutsche Wiedergabe des Gottesnamens JHWH in Kapitälchen.
- source_word: מִכָּל אֲשֶׁר לוֹ
  choice: aus seinem Besitz
  rationale: Gibt den Herkunfts- und Eigentumsbezug knapp und idiomatisch wieder.
- source_word: מֵאָדָם וּבְהֵמָה
  choice: sei es ein Mensch oder ein Tier
  rationale: Bewahrt den kategorialen Gegensatz zwischen Mensch und Tier und macht die Aufzählungsstruktur im Deutschen klar.
- source_word: וּמִשְּׂדֵה אֲחֻזָּתוֹ
  choice: oder ein Feld seines Erbbesitzes
  rationale: אֲחֻזָּה bezeichnet im levitischen Recht den erblich zugeteilten Grundbesitz; „Erbbesitz“ erhält diese rechtliche Nuance.
- source_word: לֹא יִמָּכֵר וְלֹא יִגָּאֵל
  choice: darf weder verkauft noch ausgelöst werden
  rationale: Formuliert das rechtliche Verbot natürlich und bewahrt „auslösen“ als Fachwort des unmittelbaren Kontexts.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: hochheilig
  rationale: Gibt die hebräische Superlativkonstruktion idiomatisch und würdig wieder.
- source_word: הוּא לַיהוָה
  choice: ist dem HERRN
  rationale: Bewahrt die knappe Zuordnungsformel und lässt die kultische Zugehörigkeit zum HERRN erkennen.
theological_decisions:
- issue: Bedeutung von חֵרֶם im rechtlichen Kontext
  choice: Im Haupttext als „Gebanntes“ wiedergegeben, das unwiderruflich dem HERRN ausgesondert ist.
  alternative: „dem Untergang Geweihtes“ oder „unwiderruflich Geweihtes“
  rationale: Das Wortfeld חרם kann die Vernichtung einschließen, doch der Vers selbst betont vor allem Unveräußerlichkeit, Nichtauslösbarkeit und höchste Heiligkeit. „Gebanntes“ erhält die Spannung des Fachbegriffs; die Fußnote nennt beide Bedeutungsaspekte.
- issue: Maskuline Rechtssprache
  choice: אִישׁ wird als „ein Mann“ wiedergegeben.
  alternative: „jemand“ oder „eine Person“
  rationale: Die Übersetzung wahrt die ausdrückliche maskuline Einzahl des Ausgangstextes, ohne ihre repräsentative Funktion in der Rechtssprache zu leugnen.
- issue: Menschen als möglicher Gegenstand des חרם
  choice: Die Kategorie „ein Mensch“ bleibt ohne erklärende Einschränkung im Haupttext stehen.
  alternative: Interpretierende Eingrenzung auf Sklaven, Kriegsgefangene oder zum Tod Verurteilte
  rationale: Der Vers selbst präzisiert den Status der genannten Menschen nicht. Eine engere Bestimmung würde eine Auslegung in den Text eintragen und die echte rechtlich-theologische Spannung auflösen.
translation_notes:
  register: Moderne, würdige deutsche Rechtssprache. „Gebanntes“ ist bewusst als markierter Fachbegriff gewählt; „ausgelöst“ verbindet den Vers terminologisch mit den vorausgehenden Vorschriften. Der Gedankenstrich gliedert die Besitzkategorien, ohne die syntaktische Zuordnung zu verändern.
