revisions:
- from: Doch alles Gebannte[a], das ein Mann dem HERRN aus seinem Besitz bannt – sei es ein Mensch oder ein Tier oder ein Feld seines Erbbesitzes –, darf weder verkauft noch ausgelöst werden. Alles Gebannte ist dem HERRN hochheilig.
  to: Doch alles, was ein Mann dem HERRN mit dem Bann weiht[a], aus allem, was ihm gehört – sei es ein Mensch, ein Tier oder ein Feld seines Erbbesitzes –, darf weder verkauft noch ausgelöst werden. Alles, was mit dem Bann geweiht ist, ist dem HERRN hochheilig.
  rationale: Die Revision ersetzt die im modernen Deutschen missverständliche Wortfolge „Gebanntes ... bannt“ durch die fachsprachlich klare Wendung „mit dem Bann weiht“. Sie bewahrt die Beziehung zwischen dem hebräischen Verb und Substantiv, die rechtliche Unwiderruflichkeit und die im Text nicht näher bestimmte Reichweite des Begriffs. „Aus allem, was ihm gehört“ gibt מִכָּל אֲשֶׁר לוֹ vollständiger wieder als „aus seinem Besitz“ und lässt die folgende Aufzählung transparent anschließen.
