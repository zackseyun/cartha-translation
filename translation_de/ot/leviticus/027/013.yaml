  text: וְ/אִם גָּאֹ֖ל יִגְאָלֶ֑/נָּה וְ/יָסַ֥ף חֲמִישִׁת֖/וֹ עַל עֶרְכֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/013.yaml
  text: But if he does redeem it[a], then he shall add a fifth to your valuation.
translation:
  language: de
  text: Wenn er es aber tatsächlich auslöst[a], soll er zu deiner Schätzung ein Fünftel davon hinzufügen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »wenn er es auslöst« oder »wenn er es gewiss auslöst«; im Hebräischen steht zur Verstärkung ein Infinitivus absolutus neben dem finiten Verb.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Wenn … aber
  rationale: Die Verbindung leitet eine Bedingung ein und markiert zugleich den Gegensatz zur vorausgehenden Regelung.
- source_word: גָּאֹל יִגְאָלֶנָּה
  choice: er es tatsächlich auslöst
  rationale: Der Infinitivus absolutus neben dem finiten Verb verstärkt die Aussage. »Tatsächlich« gibt diese Hervorhebung natürlich wieder; das feminine Suffix verweist auf das zuvor genannte unreine Tier.
- source_word: וְיָסַף
  choice: soll er … hinzufügen
  rationale: In diesem Rechtstext bezeichnet die Verbform die verbindliche Folge der Bedingung.
- source_word: חֲמִישִׁתוֹ
  choice: ein Fünftel
  rationale: Die Wendung bezeichnet den als Zuschlag zu entrichtenden fünften Teil. Der Bezug wird im Deutschen durch die Verbindung mit dem Schätzwert verständlich, ohne ein im Hebräischen nicht ausdrücklich genanntes »davon« einzufügen.
- source_word: עַל עֶרְכֶּךָ
  choice: zu deinem Schätzwert
  rationale: עַל bezeichnet hier den Zuschlag zu einer festgesetzten Bewertung; der Singular der zweiten Person wird als direkte Anrede beibehalten.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Rechtstext. »Auslösen« bewahrt den kultisch-rechtlichen Sinn von גאל, »Schätzwert« den Zusammenhang der priesterlichen Bewertung in Levitikus 27.
