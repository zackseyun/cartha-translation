  source_fidelity: Die Übersetzung trifft die Konditionalstruktur, die verstärkende Infinitivus-abs.-Konstruktion von גאל und die rechtliche Folge zutreffend. Das feminine Suffix von יגאלנה bezieht sich auf das in V. 12 genannte Tier. חֲמִישִׁתוֹ bezeichnet jedoch den hinzuzufügenden fünften Teil bezogen auf den Schätzwert; die deutsche Fassung sollte diesen Bezug explizit machen.
  naturalness: „Wenn er es aber tatsächlich auslöst“ und die Folgekonstruktion sind modernes, verständliches Standarddeutsch. „Schätzwert“ ist in diesem Kontext möglich; „deine Schätzung“ ist jedoch näher an der direkten priesterlichen Anrede und im fortlaufenden Rechtstext natürlicher. „Ein Fünftel davon“ verhindert, dass der Zuschlag als ein beliebiges Fünftel missverstanden wird.
  terminology: „Auslösen“ ist für גאל im kultisch-rechtlichen Zusammenhang angemessen. „Deine Schätzung“ gibt עֶרְכֶּךָ präzise wieder. Die Fußnote erklärt die hebräische Verstärkung sachgerecht; „unbedingt“ kann im Deutschen allerdings eine Willensabsicht nahelegen und sollte nicht als gleichwertige Hauptalternative formuliert werden.
