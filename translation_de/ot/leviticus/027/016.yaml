  text: וְ/אִ֣ם מִ/שְּׂדֵ֣ה אֲחֻזָּת֗/וֹ יַקְדִּ֥ישׁ אִישׁ֙ לַֽ/יהוָ֔ה וְ/הָיָ֥ה עֶרְכְּ/ךָ֖ לְ/פִ֣י זַרְע֑/וֹ זֶ֚רַע חֹ֣מֶר שְׂעֹרִ֔ים בַּ/חֲמִשִּׁ֖ים שֶׁ֥קֶל כָּֽסֶף׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/016.yaml
  text: 'If a man consecrates to Yahweh part of the field of his possession[a], then your valuation shall be according to its seed requirement: fifty shekels of silver for the seed of a homer of barley.'
translation:
  language: de
  text: 'Wenn ein Mann Jahwe einen Teil des Feldes seines Grundbesitzes[a] weiht, soll sich deine Bewertung nach der dafür erforderlichen Saatmenge richten: Für die Saatmenge eines Homers Gerste soll die Bewertung fünfzig Schekel Silber betragen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen Teil des Feldes seines Erbbesitzes“. Der hebräische Ausdruck bezeichnet rechtlich gehaltenen Grundbesitz, der häufig erblichen Charakter hat; die Präposition „von/aus“ deutet darauf hin, dass nur ein Teil des Feldes geweiht wird.'
    reason: Lexikalische Alternative und rechtlicher Hintergrund des Ausdrucks.
  - marker: b
    text: Ein Homer war ein altes Hohlmaß für trockene Güter und entsprach zehn Efa. Seine genaue Umrechnung in heutige Maße ist unsicher.
    reason: Erläuterung einer antiken Maßeinheit.
lexical_decisions:
- source_word: מִשְּׂדֵה אֲחֻזָּתוֹ
  choice: einen Teil seines ererbten Feldbesitzes
  rationale: Das vorangestellte מִן legt nahe, dass ein Teil aus dem Landbesitz gemeint ist. אֲחֻזָּה bezeichnet hier einen rechtlich gesicherten, gewöhnlich erblichen Landbesitz; „ererbter Feldbesitz“ gibt diesen Zusammenhang verständlich wieder.
- source_word: יַקְדִּישׁ
  choice: weiht
  rationale: Das Verb bezeichnet in Levitikus 27 das Aussondern für Jahwe als heilig. „Weiht“ ist im Deutschen kultisch präzise und zugleich natürlicher als „heiligt“.
- source_word: אִישׁ
  choice: ein Mann
  rationale: Das hebräische Substantiv ist maskulin Singular und hat in dieser Rechtsbestimmung repräsentative Kraft. Die Übersetzung bewahrt die sprachliche Form des Ausgangstextes.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als Eigenname „Jahwe“ wiedergegeben.
- source_word: עֶרְכְּךָ
  choice: deine Bewertung
  rationale: Das Wort bezeichnet die festzusetzende Wertbemessung. Das Suffix der zweiten Person Singular bleibt mit „deine“ ausdrücklich erhalten.
- source_word: לְפִי זַרְעוֹ
  choice: nach der dafür erforderlichen Saatmenge
  rationale: Die Bewertung richtet sich nach der Saatmenge, die zum Bestellen des Feldstücks benötigt wird. Die Formulierung macht den landwirtschaftlichen Maßstab deutlich, ohne ihn mit dem Ertrag zu verwechseln.
- source_word: זֶרַע חֹמֶר שְׂעֹרִים
  choice: eine Saatmenge von einem Homer Gerste
  rationale: Gemeint ist die mit einem Homer bemessene Menge Gerstensaat als Grundlage für die Bewertung. Die technische Maßeinheit bleibt erhalten und wird in einer Fußnote erläutert.
- source_word: בַּחֲמִשִּׁים שֶׁקֶל כָּסֶף
  choice: fünfzig Schekel Silber
  rationale: Die Wendung nennt den festgesetzten Wert. Die traditionelle Gewichtseinheit „Schekel“ und die Angabe des Metalls werden beibehalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet das Tetragramm als Gottes Eigennamen. „Jahwe“ bewahrt diesen personalen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Generisches Maskulinum אִישׁ in einer Rechtsbestimmung
  choice: ein Mann
  alternative: jemand
  rationale: Die Übersetzung erhält die maskuline Singularform des Hebräischen, ohne die repräsentative rechtliche Anwendung zusätzlich einzuschränken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rechtliche Formulierung und die direkte Anrede im Singular bleiben erhalten. Technische Begriffe werden nicht vorschnell modern umgerechnet; der Satz erläutert jedoch den Zusammenhang zwischen Feldgröße, Saatbedarf und Bewertung.
