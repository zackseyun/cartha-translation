  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: de
  text: 'Und Jahwe sprach zu Mose[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: sprach
  rationale: Das Verb דבר in der fortlaufenden Erzählform leitet hier eine feste Redeeinführungsformel ein. „Sprach“ gibt diese würdig und knapp wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, damit der im Hebräischen stehende Eigenname erhalten bleibt.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition bezeichnet den Adressaten der Rede; im Deutschen ist „zu Mose sprechen“ die natürliche Verbindung.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: „Mose“ ist die etablierte deutsche Namensform.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv „sagend/um zu sagen“ führt den folgenden Redeinhalt ein. Im natürlichen modernen Deutsch übernimmt der Doppelpunkt diese Funktion, ohne die hebräische Formel schwerfällig nachzubilden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen; die traditionelle Titelersetzung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Redeeinleitungsformel wird idiomatisch mit einem Doppelpunkt wiedergegeben; dadurch wird לֵאמֹר funktional sichtbar, ohne das unnatürliche „indem er sagte“.
