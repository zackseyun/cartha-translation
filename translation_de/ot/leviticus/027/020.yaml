  variant: modern standard German
source:
  edition: WLC
  text: וְ/אִם לֹ֤א יִגְאַל֙ אֶת הַ/שָּׂדֶ֔ה וְ/אִם מָכַ֥ר אֶת הַ/שָּׂדֶ֖ה לְ/אִ֣ישׁ אַחֵ֑ר לֹ֥א יִגָּאֵ֖ל עֽוֹד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/020.yaml
  text: But if he does not redeem the field[a], or if he has sold the field to another man, it may not be redeemed again.
translation:
  language: de
  text: Wenn er aber das Feld nicht auslöst oder wenn er das Feld an einen anderen Mann verkauft, kann es nicht mehr ausgelöst werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: Wenn … aber / oder wenn
  rationale: Die beiden Bedingungssätze führen die Regel aus dem vorherigen Vers fort. Beim ersten Satz gibt „aber“ den kontrastierenden Fortgang wieder; beim zweiten ist „oder wenn“ im Deutschen natürlich und entspricht der alternativen Bedingung.
- source_word: יִגְאַל / יִגָּאֵל
  choice: auslöst / ausgelöst werden
  rationale: גאל bezeichnet hier das rechtlich geregelte Zurückerwerben eines geweihten Feldes. „Auslösen“ bewahrt den sachlich-rechtlichen und zugleich kultischen Klang besser als das allgemeinere „zurückkaufen“ und gibt Aktiv und Passiv parallel wieder.
- source_word: הַשָּׂדֶה
  choice: das Feld
  rationale: Gemeint ist das bestimmte, in den vorausgehenden Vorschriften behandelte Feld, nicht Land im weiteren territorialen Sinn.
- source_word: מָכַר
  choice: verkauft
  rationale: Im deutschen Konditionalsatz bezeichnet das Präsens idiomatisch den rechtlich maßgeblichen Fall; ein Perfekt wäre möglich, aber unnötig schwerfällig.
- source_word: לְאִישׁ אַחֵר
  choice: an einen anderen Mann
  rationale: איש ist formal ein maskulines Substantiv und bezeichnet hier den Erwerber. Die Übersetzung hält diese Form sichtbar, ohne den möglichen generischen rechtlichen Gebrauch auszuschließen.
- source_word: עוֹד
  choice: nicht mehr
  rationale: In Verbindung mit der Verneinung bezeichnet עוד, dass nach dem Verkauf keine weitere Auslösung mehr möglich ist. „Nicht mehr“ ist hier natürlicher und rechtlich klarer als „nicht wieder“.
theological_decisions:
- issue: Rechtlich-kultische Bedeutung von גאל
  choice: auslösen
  alternative: zurückkaufen; einlösen
  rationale: „Auslösen“ wahrt den technischen Zusammenhang der Auslösung geweihten Eigentums, ohne den Vorgang auf einen gewöhnlichen Kauf zu reduzieren oder zusätzliche theologische Aussagen einzutragen.
- issue: Maskuline Personenbezeichnung in der Rechtsformel
  choice: einen anderen Mann
  alternative: eine andere Person; jemand anderen
  rationale: Die Übersetzung gibt die ausdrücklich maskuline Form איש wieder. Zugleich wird nicht behauptet, dass die rechtliche Aussage ihrem Anwendungsbereich nach zwingend nur Männer erfasse.
- issue: Bezugsgröße des abschließenden Passivs
  choice: kann es nicht mehr ausgelöst werden
  alternative: darf er es nicht mehr auslösen
  rationale: Der hebräische Nifal ist passiv und richtet die Aussage auf das Feld beziehungsweise dessen rechtlichen Status. Die deutsche Passivform bewahrt diese Perspektive und vermeidet eine unnötige Festlegung auf einen bestimmten Handelnden.
translation_notes:
  register: Moderne, würdige Rechtssprache mit klarer Satzstruktur. „Auslösen“ ist bewusst als technischer Ausdruck gewählt; „nicht mehr“ formuliert die endgültige Rechtsfolge idiomatisch. Keine Fußnote ist nötig, da keine für das Verständnis wesentliche Text- oder Übersetzungsalternative ausgelagert werden muss.
