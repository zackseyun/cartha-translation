source:
  edition: WLC
  text: וְ/הָיָ֨ה הַ/שָּׂדֶ֜ה בְּ/צֵאת֣/וֹ בַ/יֹּבֵ֗ל קֹ֛דֶשׁ לַֽ/יהוָ֖ה כִּ/שְׂדֵ֣ה הַ/חֵ֑רֶם לַ/כֹּהֵ֖ן תִּהְיֶ֥ה אֲחֻזָּתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/021.yaml
  text: But the field[a], when it is released in the Jubilee, shall be holy to Yahweh, like a field devoted to destruction; it shall be the priest’s possession.
translation:
  language: de
  text: Doch wenn das Feld im Jobeljahr frei wird, soll es dem HERRN heilig sein wie ein Feld, das dem Bann verfallen ist[a]; es soll dem Priester als Landbesitz gehören.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet etwas, das dem HERRN unwiderruflich übereignet und gewöhnlicher menschlicher Nutzung entzogen ist. Je nach Zusammenhang kann es auch „mit dem Bann belegt“ oder „zur Vernichtung bestimmt“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Doch ... soll es ... sein
  rationale: Das Waw führt die Rechtsfolge im Gegensatz zur zuvor genannten Möglichkeit der Auslösung weiter; „doch“ gibt diesen Zusammenhang im Deutschen natürlich wieder.
- source_word: הַשָּׂדֶה
  choice: das Feld
  rationale: Die bestimmte Form verweist auf das bereits behandelte Feld.
- source_word: בְּצֵאתוֹ בַיֹּבֵל
  choice: wenn das Feld im Erlassjahr frei wird
  rationale: Wörtlich steht „bei seinem Hinausgehen“. Im Kontext der Jobeljahrgesetzgebung bezeichnet die Wendung das Freiwerden beziehungsweise den rechtlichen Übergang des Grundstücks. „Erlassjahr“ ist eine verständliche deutsche Bezeichnung für יוֹבֵל.
- source_word: קֹדֶשׁ לַיהוָה
  choice: dem HERRN heilig
  rationale: Die knappe kultisch-rechtliche Formel wird bewahrt; der Gottesname יהוה erscheint nach deutscher Bibelkonvention als „der HERR“.
- source_word: כִּשְׂדֵה הַחֵרֶם
  choice: wie ein Feld, das dem Bann verfallen ist
  rationale: חֵרֶם bezeichnet etwas, das Gott unwiderruflich übereignet und gewöhnlicher menschlicher Verfügung entzogen ist. Die Formulierung wahrt die Schwere und besondere Rechtsbedeutung des Begriffs, ohne in diesem Zusammenhang zwingend eine tatsächliche Zerstörung zu behaupten.
- source_word: לַכֹּהֵן תִּהְיֶה אֲחֻזָּתוֹ
  choice: es soll dem Priester als Grundbesitz gehören
  rationale: Die Lamed-Konstruktion bezeichnet die Zuweisung an den Priester; אֲחֻזָּה meint hier einen dauerhaften Landbesitz beziehungsweise ein erbliches Grundstück.
theological_decisions:
- issue: Bedeutung von חֵרֶם im Heiligkeits- und Grundstücksrecht
  choice: dem Bann verfallen
  alternative: unwiderruflich geweiht; mit dem Bann belegt; zur Vernichtung bestimmt
  rationale: Der Begriff bezeichnet eine unwiderrufliche Aussonderung für Gott und kann andernorts Vernichtung einschließen. Da das Feld hier anschließend dem Priester als Grundbesitz zufällt, würde „zur Vernichtung bestimmt“ den konkreten Zusammenhang zu stark festlegen. „Dem Bann verfallen“ erhält die Spannung und wird in der Fußnote erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die juristische Folge wird klar formuliert, während „dem Bann verfallen“ die besondere kultisch-rechtliche Bedeutung des hebräischen Ausdrucks bewahrt. Der Fußnotenmarker [a] steht unmittelbar beim erklärungsbedürftigen Ausdruck.
