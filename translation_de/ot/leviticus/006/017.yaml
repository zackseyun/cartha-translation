- from: 'Und Jahwe redete zu Mose und sagte:'
  to: 'Und Jahwe[a] sprach zu Mose:'
  rationale: Die deutsche Redeformel wurde gestrafft, damit die Funktion von לֵאמֹר durch den Doppelpunkt idiomatisch abgebildet wird, ohne ein zusätzliches koordiniertes Sprechverb einzuführen. Der Gottesname bleibt als „Jahwe“ erhalten; die angekündigte alternative traditionelle Wiedergabe wird in einer Fußnote dokumentiert.
