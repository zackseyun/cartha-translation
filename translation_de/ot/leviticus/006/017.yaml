  - severity: low
    issue: Angekündigte Fußnote ist nicht vorhanden
    rationale: Die theologischen Entscheidungen nennen ausdrücklich eine Fußnote zur traditionellen Wiedergabe „der HERR“. Für Konsistenz mit diesem Hinweis und dem englischen Audit-Trail wird ein Anker bei „Jahwe“ ergänzt.
