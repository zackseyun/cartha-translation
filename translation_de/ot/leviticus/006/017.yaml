  yaml_path: translation/ot/leviticus/006/017.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: de
  text: 'Und Jahwe[a] sprach zu Mose:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „JHWH“; traditionell als „der HERR“ wiedergegeben.'
