lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Und … redete
  rationale: Das Waw mit der Verbform eröffnet einen neuen Redeabschnitt und knüpft ihn zugleich an den Zusammenhang an. „Redete“ gibt דבר in dieser feierlichen Einleitungsformel angemessen wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: אֶל־מֹשֶׁה
  choice: zu Mose
  rationale: Die Präposition אֶל bezeichnet hier den Adressaten; „zu Mose“ ist die natürliche deutsche Formulierung.
- source_word: לֵאמֹר
  choice: 'und sagte:'
  rationale: Der Infinitiv leitet die folgende direkte Rede ein. Im modernen Deutschen gibt „und sagte:“ die Funktion natürlich wieder und vermeidet das schwerfällige „indem er sprach“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen; die traditionelle Wiedergabe „der HERR“ wird als Alternative in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die formelhafte Redeeröffnung bleibt erkennbar; der Doppelpunkt zeigt an, dass die eigentliche Botschaft im folgenden Vers beginnt.
