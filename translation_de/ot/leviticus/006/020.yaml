source:
  edition: WLC
  text: כֹּ֛ל אֲשֶׁר יִגַּ֥ע בִּ/בְשָׂרָ֖/הּ יִקְדָּ֑שׁ וַ/אֲשֶׁ֨ר יִזֶּ֤ה מִ/דָּמָ/הּ֙ עַל הַ/בֶּ֔גֶד אֲשֶׁר֙ יִזֶּ֣ה עָלֶ֔י/הָ תְּכַבֵּ֖ס בְּ/מָק֥וֹם קָדֹֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/020.yaml
  text: Anything that touches its flesh shall become holy[a], and if any of its blood is spattered on a garment, you shall wash that on which it was spattered in a holy place.
translation:
  language: de
  text: Alles, was sein Fleisch berührt, wird heilig. Wenn etwas von seinem Blut auf ein Kleid spritzt[a], sollst du das Kleid, auf das es gespritzt ist, an einem heiligen Ort waschen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gesprengt wird“. Das hebräische Verb kann im kultischen Zusammenhang rituelles Sprengen bezeichnen; hier ist Blut auf einem Kleid und dessen anschließende Reinigung im Blick.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל אֲשֶׁר
  choice: Alles, was
  rationale: Die umfassende unbestimmte Wendung schließt alles ein, was mit dem Opferfleisch in Berührung kommt, und bleibt im Deutschen natürlich.
- source_word: יִגַּע בִּבְשָׂרָהּ
  choice: sein Fleisch berührt
  rationale: „Fleisch“ gibt בָּשָׂר im Opferkontext konkret wieder; das grammatisch feminine Suffix bezieht sich sachlich auf das Sündopfer, das im Deutschen sächlich ist.
- source_word: יִקְדָּשׁ
  choice: wird heilig
  rationale: Die Form bezeichnet hier den durch Berührung eintretenden kultischen Heiligkeitsstatus, ohne ein zusätzliches Weiheverfahren auszudrücken.
- source_word: וַאֲשֶׁר יִזֶּה מִדָּמָהּ
  choice: Wenn etwas von seinem Blut … spritzt
  rationale: נזה kann rituelles Sprengen bezeichnen, doch der Zusammenhang mit einem getroffenen Kleid und dessen Reinigung erlaubt hier die natürliche Wiedergabe „spritzt“, ohne Absichtlichkeit festzulegen.
- source_word: עַל הַבֶּגֶד
  choice: auf ein Kleid
  rationale: Der bestimmte Artikel steht in kasuistischer Rede generisch; „ein Kleid“ ist im modernen Deutschen entsprechend idiomatisch.
- source_word: אֲשֶׁר יִזֶּה עָלֶיהָ
  choice: die Stelle, auf die es gespritzt ist
  rationale: Die Formulierung macht verständlich, dass der betroffene Bereich des Kleidungsstücks zu waschen ist, und bildet den Rückbezug des hebräischen Relativsatzes ab.
- source_word: תְּכַבֵּס
  choice: sollst du … waschen
  rationale: Der Piel bezeichnet das Waschen von Textilien; die zweite Person Singular und der rechtliche Weisungscharakter bleiben erhalten.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: an einem heiligen Ort
  rationale: Da „Ort“ ohne Artikel steht, wird kein bestimmter innerer Heiligtumsbereich vorausgesetzt, sondern ein geheiligter Bereich bezeichnet.
theological_decisions:
- issue: Durch Berührung übertragener Heiligkeitsstatus
  choice: „wird heilig“ bewahrt die Aussage, dass die Berührung einen kultischen Heiligkeitsstatus bewirkt.
  alternative: „wird dem Heiligtum vorbehalten“ oder „muss geheiligt werden“
  rationale: Der Kontext betrifft kultische, nicht notwendig moralische Heiligkeit. Die direkte Wiedergabe wahrt diese Spannung, ohne den Status funktional oder konfessionell auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer kasuistischer Satzführung. „Kleid“ und „Fleisch“ bewahren die konkrete kultische Sprache; die Konstruktion vermeidet eine unnötige Festlegung darauf, ob das Blut absichtlich versprengt oder unbeabsichtigt verspritzt wurde.
