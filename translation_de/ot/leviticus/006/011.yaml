  text: כָּל זָכָ֞ר בִּ/בְנֵ֤י אַהֲרֹן֙ יֹֽאכֲלֶ֔/נָּה חָק עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם מֵ/אִשֵּׁ֖י יְהוָ֑ה כֹּ֛ל אֲשֶׁר יִגַּ֥ע בָּ/הֶ֖ם יִקְדָּֽשׁ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/011.yaml
  text: Every male among the sons of Aaron may eat of it[a]. It is a permanent statute throughout your generations from the food offerings of Yahweh. Whatever touches them shall become holy.
translation:
  language: de
  text: Jeder männliche Nachkomme Aarons darf davon essen. Dies ist eine bleibende Bestimmung für alle eure Generationen bei den Feueropfern Jahwes. Alles, was mit ihnen in Berührung kommt, wird heilig[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „wird geheiligt“. Das Hebräische kann ausdrücken, dass durch die Berührung ein heiliger Status eintritt. Manche verstehen die Aussage restriktiver: Nur was bereits heilig ist, darf mit diesen Opfergaben in Berührung kommen.'
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל זָכָר
  choice: Jeder männliche Angehörige
  rationale: Gibt die distributive Form und die geschlechtsspezifische priesterliche Zugangsbestimmung präzise wieder; „Angehörige“ klingt im Deutschen natürlicher als das substantivierte „Männliche“.
- source_word: בִּבְנֵי אַהֲרֹן
  choice: unter den Söhnen Aarons
  rationale: Bewahrt die feste priesterliche Familienbezeichnung des Hebräischen, ohne sie verallgemeinernd auf sämtliche Nachkommen auszuweiten.
- source_word: יֹאכֲלֶנָּה
  choice: darf davon essen
  rationale: Drückt die rechtmäßige Erlaubnis beziehungsweise den Anspruch aus und nimmt den Opferanteil aus dem vorhergehenden Zusammenhang auf.
- source_word: חָק עוֹלָם
  choice: eine bleibende Bestimmung
  rationale: Vermittelt die dauerhaft geltende kultrechtliche Ordnung in verständlichem, gegenwärtigem Deutsch, ohne עוֹלָם unnötig metaphysisch aufzuladen.
- source_word: לְדֹרֹתֵיכֶם
  choice: für alle eure Generationen
  rationale: Gibt die Fortgeltung über die aufeinanderfolgenden Generationen hinweg klar wieder.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: als Anteil von den Feueropfern Jahwes
  rationale: אִשֶּׁה bezeichnet hier durch Feuer dargebrachte Opfergaben. Die Einfügung „als Anteil“ verbindet die Präpositionalphrase natürlich mit dem Recht, davon zu essen, ohne eine zusätzliche Opferkategorie einzuführen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen als Eigennamen wieder.
- source_word: כֹּל אֲשֶׁר יִגַּע בָּהֶם
  choice: Alles, was mit ihnen in Berührung kommt
  rationale: Bewahrt die umfassende, hinsichtlich Person oder Sache nicht ausdrücklich festgelegte Formulierung; „ihnen“ nimmt den hebräischen Plural der Feueropfer auf.
- source_word: יִקְדָּשׁ
  choice: wird heilig
  rationale: 'Gibt den resultativen Sinn wieder: Durch die Berührung tritt ein heiliger beziehungsweise geheiligter Status ein.'
theological_decisions:
- issue: Bedeutung der Übertragung von Heiligkeit im Schlusssatz
  choice: Die Berührung mit den heiligen Opfergaben bewirkt, dass das Berührende heilig wird.
  alternative: 'Der Satz kann restriktiv verstanden werden: Nur etwas bereits Heiliges darf mit den Opfergaben in Berührung kommen; außerdem kann „wird geheiligt“ die daraus entstehenden Weihepflichten betonen.'
  rationale: Die Abfolge aus Berührung und יִקְדָּשׁ legt grammatisch zunächst eine eintretende Heiligung nahe. Die Fußnote bewahrt jedoch die kultrechtliche Spannung und weist auf die restriktive Deutung hin, ohne sie in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlicher kultrechtlicher Ausdrucksweise. Die Satzstruktur bleibt nahe am Hebräischen, wird aber für einen natürlichen deutschen Lesefluss leicht gegliedert. Der Gottesname wird als „Jahwe“ wiedergegeben.
