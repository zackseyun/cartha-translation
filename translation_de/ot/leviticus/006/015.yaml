source:
  edition: WLC
  text: וְ/הַ/כֹּהֵ֨ן הַ/מָּשִׁ֧יחַ תַּחְתָּ֛י/ו מִ/בָּנָ֖י/ו יַעֲשֶׂ֣ה אֹתָ֑/הּ חָק עוֹלָ֕ם לַ/יהוָ֖ה כָּלִ֥יל תָּקְטָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/015.yaml
  text: 'And the anointed priest from among his sons[a], who succeeds him, shall prepare it[c][b]. It is a permanent statute for Yahweh: it shall be completely turned into smoke.'
translation:
  language: de
  text: 'Der gesalbte Priester, der aus der Reihe seiner Söhne an seine Stelle tritt,[a] soll es zubereiten. Dies ist eine bleibende Satzung[b] für den HERRN: Es soll vollständig als Rauchopfer dargebracht werden.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „unter ihm“; gemeint ist hier: „an seiner Stelle“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „eine dauerhafte Satzung“ oder „eine ewige Ordnung“.'
    reason: lexical_alternative
  - marker: c
    text: 'Das heißt: Die Opfergabe wird vollständig auf dem Altar verbrannt.'
    reason: clarification
lexical_decisions:
- source_word: הַכֹּהֵן הַמָּשִׁיחַ
  choice: der gesalbte Priester
  rationale: Die Wendung bezeichnet im kultischen Zusammenhang den für sein Amt gesalbten Priester; sie wird nicht als messianischer Titel verstanden.
- source_word: תַּחְתָּיו מִבָּנָיו
  choice: der aus der Reihe seiner Söhne an seine Stelle tritt
  rationale: Die Formulierung bewahrt sowohl die Abstammungsangabe als auch den Gedanken der Amtsnachfolge; תַּחְתָּיו bedeutet wörtlich etwa „unter ihm“, hier aber idiomatisch „an seiner Stelle“.
- source_word: יַעֲשֶׂה אֹתָהּ
  choice: soll es zubereiten
  rationale: עָשָׂה ist allgemein „tun/machen“; im Zusammenhang der Opferhandlung gibt „zubereiten“ den Sinn natürlich wieder, ohne über den hebräischen Wortlaut hinaus eine bestimmte Einzelhandlung festzulegen.
- source_word: חָק עוֹלָם
  choice: eine bleibende Bestimmung
  rationale: Die Übersetzung vermittelt die fortdauernde Geltung in natürlichem, modernem Deutsch und vermeidet das missverständliche Versprechen einer philosophisch unbegrenzten Ewigkeit.
- source_word: לַיהוָה
  choice: für den HERRN
  rationale: „Für“ drückt die Ausrichtung der Bestimmung und Opferhandlung auf JHWH aus; „der HERR“ folgt der herkömmlichen ehrfürchtigen Wiedergabe des Gottesnamens.
- source_word: כָּלִיל תָּקְטָר
  choice: Es soll vollständig in Rauch aufgehen
  rationale: כָּלִיל bezeichnet die vollständige Darbringung, während der Hifil von קטר das Aufsteigenlassen als Rauch auf dem Altar ausdrückt.
theological_decisions:
- issue: Identität des „gesalbten Priesters“
  choice: der für das Amt gesalbte Priester, der als Nachfolger eintritt
  alternative: jeder beliebige gesalbte Priester oder eine messianische Gestalt
  rationale: Der kultische Zusammenhang und die ausdrückliche Nachfolge aus der Reihe seiner Söhne weisen auf ein erbliches priesterliches Amt, nicht auf einen messianischen Titel.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: der HERR
  alternative: Jahwe
  rationale: Die traditionelle Wiedergabe wahrt die jüdische Lesetradition; die Präposition ל wird hier sachgerecht mit „für“ wiedergegeben.
- issue: Reichweite von חָק עוֹלָם
  choice: bleibende Bestimmung
  alternative: ewige Satzung
  rationale: עוֹלָם bezeichnet hier die dauerhafte, fortgeltende Ordnung. „Bleibend“ bewahrt diese Aussage, ohne die zeitliche Reichweite dogmatisch stärker festzulegen, als der Ausdruck verlangt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Gesalbter Priester“ erhält die kultische Fachsprache, während „an seine Stelle tritt“ und „in Rauch aufgehen“ den hebräischen Sinn verständlich und idiomatisch ausdrücken.
