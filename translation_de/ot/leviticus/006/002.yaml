source:
  edition: WLC
  text: צַ֤ו אֶֽת אַהֲרֹן֙ וְ/אֶת בָּנָ֣י/ו לֵ/אמֹ֔ר זֹ֥את תּוֹרַ֖ת הָ/עֹלָ֑ה הִ֣וא הָ/עֹלָ֡ה עַל֩ מוֹקְדָ֨ה עַל הַ/מִּזְבֵּ֤חַ כָּל הַ/לַּ֨יְלָה֙ עַד הַ/בֹּ֔קֶר וְ/אֵ֥שׁ הַ/מִּזְבֵּ֖חַ תּ֥וּקַד בּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/002.yaml
  text: 'Command Aaron and his sons[a], saying, This is the law of the burnt offering: the burnt offering itself shall remain on its hearth on the altar all night until the morning[b], and the fire of the altar shall be kept burning on it.'
translation:
  language: de
  text: 'Befiehl Aaron und seinen Söhnen: Dies ist die Weisung[a] für das Brandopfer: Das Brandopfer selbst soll die ganze Nacht bis zum Morgen auf der Feuerstelle[b] auf dem Altar bleiben, und das Feuer auf dem Altar soll am Brennen gehalten werden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dies ist das Gesetz für das Brandopfer“; auch „die Vorschrift für“ ist möglich.'
    reason: lexical_alternative
  - marker: b
    text: 'Das hebräische Wort bezeichnet die Brennstelle oder den Herd des Altars. Wörtlicher lässt sich die Wendung auch wiedergeben: „das Brandopfer auf der Feuerstelle auf dem Altar“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  choice: Gebiete
  rationale: Der Imperativ von צוה bezeichnet hier einen verbindlichen Befehl. „Gebiete“ wahrt dessen Nachdruck und passt zum würdigen Gesetzesstil.
- source_word: אַהֲרֹן וְאֶת־בָּנָיו
  choice: Aaron und seinen Söhnen
  rationale: Im Zusammenhang des Priesterdienstes bezeichnet בנים Aarons männliche Nachkommen, die als Priester dienen.
- source_word: לֵאמֹר
  choice: Einleitung der direkten Rede durch Doppelpunkt
  rationale: Das deutsche Satzzeichen gibt die Funktion des hebräischen Infinitivs natürlich wieder; ein zusätzliches „und sprich“ wäre unnötig schwerfällig.
- source_word: זֹאת תּוֹרַת
  choice: Dies ist die Weisung für
  rationale: תּוֹרָה bezeichnet hier die verbindliche Vorschrift für ein Opfer. „Weisung“ wahrt sowohl den lehrenden als auch den rechtlich bindenden Sinn, ohne vorschnell den gesamten Kanon der Tora zu bezeichnen.
- source_word: הָעֹלָה
  choice: Brandopfer
  rationale: „Brandopfer“ ist die etablierte deutsche Bezeichnung für das vollständig auf dem Altar verbrannte Opfer; eine etymologische Wiedergabe wie „Aufstiegsopfer“ wäre weniger verständlich.
- source_word: הִוא הָעֹלָה
  choice: Das Brandopfer
  rationale: Die Wiederaufnahme des Nomens wird im Deutschen als neues Satzsubjekt wiedergegeben. So bleibt der Nachdruck erhalten, ohne die unnatürliche Form „es ist das Brandopfer“ zu erzwingen.
- source_word: עַל מוֹקְדָה
  choice: auf der Feuerstelle
  rationale: מוֹקְדָה bezeichnet die Brennstelle beziehungsweise den Herd auf dem Altar. „Feuerstelle“ ist konkret und im modernen Deutschen verständlich.
- source_word: כָּל הַלַּיְלָה עַד הַבֹּקֶר
  choice: die ganze Nacht bis zum Morgen
  rationale: Die Zeitangabe wird eng und idiomatisch wiedergegeben.
- source_word: וְאֵשׁ הַמִּזְבֵּחַ תּוּקַד בּוֹ
  choice: und das Feuer des Altars soll darauf am Brennen gehalten werden
  rationale: Die Hophal-Form von יקד drückt aus, dass das Feuer fortdauernd unterhalten werden soll. „darauf“ bewahrt den knappen Rückverweis des Suffixes בּוֹ.
theological_decisions:
- issue: Bedeutung von תּוֹרָה in der Opfergesetzgebung
  choice: Weisung
  alternative: Gesetz; Vorschrift
  rationale: Der Ausdruck führt eine verbindliche kultische Regel ein. „Weisung“ erhält die Breite des hebräischen Begriffs und vermeidet zugleich, ihn an dieser Stelle ohne Weiteres als Bezeichnung des gesamten mosaischen Gesetzes zu verstehen.
- issue: Charakter der Anordnung über das Altarfeuer
  choice: soll ... am Brennen gehalten werden
  alternative: soll ... brennen
  rationale: Die hebräische Verbform beschreibt nicht bloß den Zustand des Feuers, sondern dessen vorgeschriebene fortdauernde Unterhaltung.
- issue: Bezug von בּוֹ
  choice: darauf, mit offenem Rückbezug auf den unmittelbar genannten Altar beziehungsweise seine Feuerstelle
  alternative: auf ihm, eindeutig auf den Altar bezogen; durch es, auf das Brandopfer bezogen
  rationale: Das maskuline Suffix kann grammatisch auf den Altar zurückweisen, während der unmittelbare Zusammenhang die Feuerstelle mit umfasst. Die knappe deutsche Form „darauf“ lässt diese räumliche Bezugsspannung bestehen.
translation_notes:
  register: Moderner, würdiger Standarddeutsch-Stil. Die Befehlsform bleibt nachdrücklich, während der Doppelpunkt die hebräische Redeeinleitung idiomatisch ersetzt. Die Wiederholung von „Brandopfer“ und „Altar“ wurde zur Klarheit beibehalten.
