source:
  edition: WLC
  text: וּ/כְלִי חֶ֛רֶשׂ אֲשֶׁ֥ר תְּבֻשַּׁל בּ֖/וֹ יִשָּׁבֵ֑ר וְ/אִם בִּ/כְלִ֤י נְחֹ֨שֶׁת֙ בֻּשָּׁ֔לָה וּ/מֹרַ֥ק וְ/שֻׁטַּ֖ף בַּ/מָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/021.yaml
  text: And an earthenware vessel in which it is boiled must be broken; but if it is boiled in a bronze vessel[a], it must be scoured and rinsed with water.
translation:
  language: de
  text: Ein Tongefäß, in dem es gekocht wird, muss zerbrochen werden. Wird es jedoch in einem Bronzegefäß[a] gekocht, muss dieses gescheuert und mit Wasser gespült werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Kupfergefäß«. Das hebräische Wort נְחֹשֶׁת kann je nach Zusammenhang Kupfer oder Bronze bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְלִי חֶרֶשׂ
  choice: Tongefäß
  rationale: Die Verbindung bezeichnet ein Gefäß aus gebranntem Ton. »Tongefäß« ist im modernen Deutschen natürlich und bewahrt den für die unterschiedliche Behandlung entscheidenden Materialbezug.
- source_word: תְּבֻשַּׁל / בֻּשָּׁלָה
  choice: gekocht wird / gekocht
  rationale: בשׁל bezeichnet hier die Zubereitung durch Kochen. Die passive Form des Hebräischen bleibt erhalten; »gekocht« ist im Deutschen für den Vorgang natürlicher als das engere »gesiedet«.
- source_word: בּוֹ
  choice: in dem
  rationale: Die Präposition mit Suffix verweist auf das zuvor genannte Gefäß und bezeichnet den Ort des Kochens.
- source_word: יִשָּׁבֵר
  choice: muss zerbrochen werden
  rationale: Der Niphal-Imperfekt hat in dieser Rechtsanweisung verpflichtende Bedeutung. »Muss … werden« gibt diese Verpflichtung klar und gegenwärtig wieder.
- source_word: כְלִי נְחֹשֶׁת
  choice: Bronzegefäß
  rationale: נְחֹשֶׁת kann Kupfer oder Bronze bezeichnen. »Bronzegefäß« ist für antike Metallgefäße eine sachgerechte Wiedergabe; die ebenfalls mögliche Übersetzung »Kupfergefäß« wird in einer Fußnote genannt.
- source_word: וּמֹרַק
  choice: gründlich gescheuert
  rationale: מרק bezeichnet ein kräftiges Reiben beziehungsweise Reinigen. »Gründlich gescheuert« bringt die intensive Reinigung des Metallgefäßes verständlich zum Ausdruck.
- source_word: וְשֻׁטַּף בַּמָּיִם
  choice: mit Wasser gespült
  rationale: שטף bezeichnet ein Waschen oder Spülen mit Wasser. »Gespült« unterscheidet diesen zweiten Reinigungsschritt sinnvoll vom vorherigen Scheuern.
theological_decisions: []
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die Rechtspflicht wird mit »muss« ausgedrückt; die beiden Reinigungsschritte bleiben voneinander unterschieden.
