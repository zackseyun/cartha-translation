id: LEV.6.10
reference: Leviticus 6:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לֹ֤א תֵאָפֶה֙ חָמֵ֔ץ חֶלְקָ֛/ם נָתַ֥תִּי אֹתָ֖/הּ מֵ/אִשָּׁ֑/י קֹ֤דֶשׁ קָֽדָשִׁים֙ הִ֔וא כַּ/חַטָּ֖את וְ/כָ/אָשָֽׁם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/010.yaml
  text: It shall not be baked with leaven[a]. I have given it as their portion from my food offerings. It is most holy[b], like the sin offering and the guilt offering.
translation:
  language: de
  text: Es darf nicht mit Sauerteig gebacken werden. Ich habe es ihnen als ihren Anteil von meinen Feueropfern[a] gegeben. Es ist hochheilig, wie das Sündopfer und das Schuldopfer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von meinen Opfergaben“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Wiedergutmachungsopfer“; traditionell auch „Übertretungsopfer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵאָפֶה
  choice: darf … gebacken werden
  rationale: Das Nifal bezeichnet den passiven Vorgang des Backens; zusammen mit לֹא gibt „darf nicht“ die verbindliche kultische Vorschrift in natürlichem modernem Deutsch wieder.
- source_word: חָמֵץ
  choice: mit Sauerteig
  rationale: Der Ausdruck bezeichnet Gesäuertes beziehungsweise ein Gärmittel. Im Zusammenhang mit dem Backen ist „mit Sauerteig“ verständlich, ohne den Gegenstand unnötig als Brot festzulegen.
- source_word: חֶלְקָם
  choice: ihren Anteil
  rationale: חֵלֶק bezeichnet hier den den Priestern zugewiesenen Anteil; „Anteil“ bewahrt den Zuteilungscharakter und das Possessivsuffix.
- source_word: נָתַתִּי אֹתָהּ
  choice: Ich habe es … gegeben
  rationale: Das Perfekt bezeichnet die von Gott vollzogene und weiterhin geltende Zuweisung. Das deutsche Perfekt gibt diesen fortwirkenden Rechtsakt natürlich wieder.
- source_word: מֵאִשַּׁי
  choice: von meinen Feueropfern
  rationale: אִשֶּׁה ist eine kultische Bezeichnung für eine dem Feuer übergebene Opfergabe. „Feueropfer“ ist im Deutschen knapp, verständlich und bewahrt den Bezug zum Feuer; eine weniger technische Alternative steht in der Fußnote.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: hochheilig
  rationale: Die hebräische Steigerungsform bezeichnet die höchste kultische Heiligkeitsstufe. „Hochheilig“ ist im Deutschen idiomatisch und vermeidet die räumliche Assoziation von „Allerheiligstes“.
- source_word: כַּחַטָּאת
  choice: wie das Sündopfer
  rationale: Das Präfix כְּ kennzeichnet hier einen Vergleich beziehungsweise dieselbe kultische Einstufung; „wie“ erhält diese Funktion.
- source_word: וְכָאָשָׁם
  choice: und das Schuldopfer
  rationale: אָשָׁם bezeichnet im Opferkontext eine eigene Opferart. „Schuldopfer“ ist die geläufige moderne deutsche Wiedergabe; „Wiedergutmachungsopfer“ hebt einen ebenfalls vorhandenen Bedeutungsaspekt hervor.
theological_decisions:
- issue: Wiedergabe der Opferbezeichnung אָשָׁם
  choice: Schuldopfer
  alternative: Wiedergutmachungsopfer
  rationale: „Schuldopfer“ ist als Bezeichnung der Opferart etabliert und verständlich, ohne eine bestimmte Sühnetheorie festzulegen. Die Alternative macht den mit אָשָׁם verbundenen Wiedergutmachungsaspekt sichtbar.
- issue: Wiedergabe der kultischen Bezeichnung אִשֶּׁה
  choice: Feueropfer
  alternative: Opfergaben
  rationale: „Feueropfer“ bewahrt den wahrscheinlich mit dem Begriff verbundenen Feuerbezug und die kultische Kategorie. Da die genaue Nuance des Fachworts umstritten ist und es auch allgemeiner als Opfergabe verstanden werden kann, wird die Alternative in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper kultrechtlicher Formulierung. Die Fachbegriffe „Feueropfer“, „Sündopfer“ und „Schuldopfer“ bleiben erkennbar, während Fußnoten echte lexikalische Alternativen dokumentieren.
