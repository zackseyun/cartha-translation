base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/005.yaml
  text: And the fire on the altar shall be kept burning on it[a]; it shall not go out. The priest shall burn wood on it every morning[b], and he shall arrange the burnt offering on it and burn up on it the fat portions of the peace offerings.
translation:
  language: de
  text: Das Feuer auf dem Altar soll darauf in Brand gehalten werden; es darf nicht erlöschen. Jeden Morgen[a] soll der Priester Holz darauf verbrennen, das Brandopfer darauf zurechtlegen und darauf die Fettanteile der Friedensopfer[b] in Rauch aufgehen lassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Morgen für Morgen“. Die Wiederholung des hebräischen Wortes bezeichnet die regelmäßige Wiederkehr.'
    reason: lexical_alternative
  - marker: b
    text: Auch „Gemeinschaftsopfer“ oder „Heilsopfer“.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוּקַד
  choice: soll … am Brennen gehalten werden
  rationale: Die Hophal-Form bezeichnet hier nicht nur ein brennendes Feuer, sondern dessen fortlaufende Aufrechterhaltung.
- source_word: בּוֹ
  choice: auf ihm
  rationale: Das Pronomen bezieht sich auf den Altar; die räumliche Wiedergabe mit „auf“ entspricht dem Opferkontext.
- source_word: לֹא תִכְבֶּה
  choice: es darf nicht erlöschen
  rationale: Die Formulierung gibt das verbindliche Verbot natürlich wieder und bewahrt den Bezug auf das Feuer.
- source_word: וּבִעֵר
  choice: soll … Holz darauf verbrennen
  rationale: Das Verb bezeichnet das Brennen beziehungsweise Inbrandhalten des Holzes. „Anzünden“ könnte missverständlich einen täglich neu entfachten Altarbrand nahelegen.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: jeden Morgen
  rationale: Die Wiederholung hat distributiven Sinn und bezeichnet die täglich wiederkehrende Handlung.
- source_word: וְעָרַךְ
  choice: anordnen
  rationale: Das Verb bezeichnet im Kultzusammenhang das geordnete Auflegen des Opfers auf den Altar.
- source_word: הָעֹלָה
  choice: das Brandopfer
  rationale: „Brandopfer“ ist die verständliche und etablierte deutsche Bezeichnung dieser Opferart.
- source_word: וְהִקְטִיר
  choice: in Rauch aufgehen lassen
  rationale: 'Die Wiedergabe macht die kultische Bedeutung des Hiphil von קטר ausdrücklich: Der Opferanteil wird auf dem Altar verbrannt und steigt als Rauch auf.'
- source_word: חֶלְבֵי
  choice: die Fettstücke
  rationale: Gemeint sind die für die Verbrennung bestimmten Fettanteile, nicht allgemein die besten Teile.
- source_word: הַשְּׁלָמִים
  choice: der Friedensopfer
  rationale: „Friedensopfer“ ist eine etablierte deutsche Kultbezeichnung; die Fußnote bewahrt weitere mögliche Bedeutungsakzente.
theological_decisions:
- issue: Wiedergabe der Opferbezeichnungen
  choice: Brandopfer und Friedensopfer
  alternative: Aufstiegsopfer sowie Gemeinschafts- oder Heilsopfer
  rationale: Etablierte deutsche Bezeichnungen halten die kultischen Kategorien erkennbar, ohne die mögliche Bedeutungsbreite von שְׁלָמִים im Haupttext einseitig auf Gemeinschaft oder Wohlergehen festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer kultischer Terminologie. Die Satzstruktur folgt dem Ablauf der priesterlichen Handlungen; die etwas technische Formulierung „in Rauch aufgehen lassen“ bewahrt den besonderen Opferwortschatz des Hebräischen.
