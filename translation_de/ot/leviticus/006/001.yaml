base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: de
  text: 'Und Jahwe sprach zu Mose[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: Alternative traditionelle Wiedergabe des Gottesnamens.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Und … sprach
  rationale: Das Waw mit der Verbform von דבר führt den nächsten Erzählschritt ein. „Und … sprach“ bewahrt den hebräischen Erzählfluss und unterscheidet דבר von אמר.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, sodass der im Hebräischen stehende Eigenname erhalten bleibt.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition bezeichnet hier den Adressaten der Rede; „zu“ ist im Deutschen die natürliche Entsprechung.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Gebräuchliche deutsche Form des Personennamens.
- source_word: לֵאמֹר
  choice: ':'
  rationale: In der festen hebräischen Redeeinleitungsformel kündigt לֵאמֹר die folgende direkte Rede an. Ein Doppelpunkt gibt diese Funktion im modernen Deutschen natürlicher wieder als das schwerfällige „und sagte“ oder „folgendermaßen“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Vers verwendet ausdrücklich das Tetragramm יהוה. „Jahwe“ bewahrt den persönlichen Gottesnamen; die traditionelle Wiedergabe „der HERR“ wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Redeeinleitung bleibt erhalten; der Doppelpunkt kündigt die in den folgenden Versen beginnende direkte Rede an.
