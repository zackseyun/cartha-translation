  text: וּ/פָשַׁט֙ אֶת בְּגָדָ֔י/ו וְ/לָבַ֖שׁ בְּגָדִ֣ים אֲחֵרִ֑ים וְ/הוֹצִ֤יא אֶת הַ/דֶּ֨שֶׁן֙ אֶל מִ/ח֣וּץ לַֽ/מַּחֲנֶ֔ה אֶל מָק֖וֹם טָהֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/004.yaml
  text: Then he shall take off his garments and put on other garments[b][a], and carry the ashes outside the camp to a clean place.
translation:
  language: de
  text: Dann soll er seine Gewänder ausziehen, andere Gewänder anziehen und die Asche aus dem Lager hinaus an einen reinen Ort bringen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Rein“ ist hier im kultischen Sinn des Levitikus gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: וּפָשַׁט
  choice: Dann soll er … ausziehen
  rationale: פשט bezeichnet im Zusammenhang mit Kleidung das Ausziehen. „Dann“ gibt die Abfolge der priesterlichen Anweisung natürlich wieder.
- source_word: בְּגָדָיו
  choice: seine Gewänder
  rationale: „Gewänder“ ist im kultisch-priesterlichen Zusammenhang würdevoll und präzise, ohne altertümlich zu wirken.
- source_word: וְלָבַשׁ בְּגָדִים אֲחֵרִים
  choice: andere Gewänder anziehen
  rationale: לבש bedeutet hier „anziehen“; אֲחֵרִים kennzeichnet die Kleidung als eine andere als die zuvor getragene.
- source_word: וְהוֹצִיא אֶת־הַדֶּשֶׁן
  choice: die Asche … hinausbringen
  rationale: Der Hifil von יצא bedeutet „hinausbringen“. דֶּשֶׁן bezeichnet hier die Asche beziehungsweise die Rückstände des Brandopfers.
- source_word: אֶל־מִחוּץ לַמַּחֲנֶה
  choice: aus dem Lager hinaus
  rationale: Die Formulierung gibt die gerichtete Bewegung über die Grenze des Lagers hinweg idiomatisch wieder.
- source_word: אֶל־מָקוֹם טָהוֹר
  choice: an einen reinen Ort
  rationale: טָהוֹר bezeichnet im levitischen Zusammenhang kultische Reinheit; „rein“ bewahrt den etablierten Gegensatz zu „unrein“.
theological_decisions:
- issue: Kultische Bedeutung von טָהוֹר
  choice: reinen Ort
  alternative: kultisch reinen Ort
  rationale: „Rein“ erhält die kultische Kategorie des Levitikus, ohne die Auslegung erläuternd in den Haupttext einzufügen. Eine Fußnote macht die besondere Bedeutung deutlich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Abfolge der hebräischen Verbalformen bleibt als klare Verfahrensanweisung erhalten; kultische Fachbedeutung wird nicht paraphrasierend in den Haupttext eingebaut.
