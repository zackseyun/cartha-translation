revisions:
- from: 'Und dies ist die Weisung für das Speiseopfer[a]: Die Söhne Aarons sollen es vor Jahwe an der Vorderseite des Altars darbringen.'
  to: 'Und dies ist die Weisung für das Speiseopfer[a]: Die Söhne Aarons sollen es vor Jahwe vor den Altar darbringen.'
  rationale: 'Die räumliche Schlusswendung wird von einer statischen Ortsangabe zu einer richtungsbezogenen Formulierung geändert. Dadurch entspricht sie dem hebräischen אֶל־פְּנֵי („vor … hin/zu“) und bleibt im Deutschen knapp und natürlich. Die Wiederholung von „vor“ ist hier sachlich gerechtfertigt, weil der hebräische Text zwei unterschiedliche Präpositionen verwendet: לִפְנֵי Jahwe und אֶל־פְּנֵי des Altars.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T07:16:46Z'
review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von וְזֹאת, תּוֹרַת הַמִּנְחָה, בְּנֵי אַהֲרֹן und לִפְנֵי יְהוָה ist sachgerecht. „Weisung“ ist für תּוֹרָה in diesem kultisch-rechtlichen Zusammenhang gut vertretbar; „Speiseopfer“ gibt מִנְחָה idiomatisch und präzise wieder. Die Konstruktion הַקְרֵב אֹתָהּ richtet die Darbringung an Aarons Söhne und kann angemessen durch „sollen es darbringen“ wiedergegeben werden. Allerdings ist אֶל־פְּנֵי הַמִּזְבֵּחַ richtungsbezogen („vor den Altar“), nicht statisch „an der Vorderseite des Altars“.
  naturalness: Der Satz ist insgesamt modernes, würdiges Standarddeutsch. „An der Vorderseite des Altars“ klingt jedoch unnötig technisch und bezeichnet eher eine konkrete Seite beziehungsweise einen Standpunkt. „Vor den Altar“ ist natürlicher und entspricht zugleich der hebräischen Richtungsangabe.
  terminology: „Jahwe“, „Weisung“ und „Speiseopfer“ sind konsistent und angemessen. Die Fußnote bildet die lexikalische Bandbreite von תּוֹרָה sinnvoll ab.
  issues:
