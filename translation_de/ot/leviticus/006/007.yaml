source:
  edition: WLC
  text: וְ/זֹ֥את תּוֹרַ֖ת הַ/מִּנְחָ֑ה הַקְרֵ֨ב אֹתָ֤/הּ בְּנֵֽי אַהֲרֹן֙ לִ/פְנֵ֣י יְהוָ֔ה אֶל פְּנֵ֖י הַ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/007.yaml
  text: 'And this is the law of the grain offering: the sons of Aaron shall present it before Yahweh[a], in front of the altar.'
translation:
  language: de
  text: 'Und dies ist die Weisung für das Speiseopfer[a]: Die Söhne Aarons sollen es vor Jahwe vor den Altar darbringen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „das Gesetz über“ oder „die Bestimmung für“ das Speiseopfer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: Und dies ist
  rationale: Die Formulierung bewahrt den Anschluss an den vorausgehenden Text und leitet zugleich einen neuen Abschnitt mit Opferbestimmungen ein.
- source_word: תּוֹרַת הַמִּנְחָה
  choice: die Weisung für das Speiseopfer
  rationale: תּוֹרָה bezeichnet hier die verbindliche Anweisung für den Vollzug des Opfers. „Weisung“ gibt die Bedeutung natürlicher und weniger missverständlich wieder als das engere deutsche „Gesetz“. מִנְחָה ist im levitischen Opferkontext das aus pflanzlichen Erzeugnissen bestehende Speiseopfer.
- source_word: הַקְרֵב אֹתָהּ
  choice: sollen es … darbringen
  rationale: Die Form weist die Priester zum rituellen Heranbringen beziehungsweise Präsentieren des Opfers an. „Darbringen“ ist im Deutschen idiomatisch und bewahrt den kultischen Sinn.
- source_word: בְּנֵי אַהֲרֹן
  choice: die Söhne Aarons
  rationale: Die wörtlich-nahe Wiedergabe erhält die für Levitikus wichtige familiäre und priesterliche Bezeichnung.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי bezeichnet das Handeln in Gottes Gegenwart; „vor Jahwe“ ist knapp und wahrt den direkten Gebrauch des Gottesnamens.
- source_word: אֶל פְּנֵי הַמִּזְבֵּחַ
  choice: an der Vorderseite des Altars
  rationale: Die Formulierung gibt die konkrete räumliche Ausrichtung am Altar wieder und unterscheidet sie von dem unmittelbar vorausgehenden „vor Jahwe“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Bundesnamen im modernen Deutschen direkt wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von תּוֹרָה in der Opfergesetzgebung
  choice: Weisung
  alternative: Gesetz; Bestimmung
  rationale: Im Zusammenhang bezeichnet das Wort die verbindliche Vorschrift für den Opferablauf. „Weisung“ bewahrt sowohl den autoritativen als auch den unterweisenden Charakter, ohne den Begriff unnötig auf ein modernes Gesetzesverständnis zu verengen.
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch mit einer im biblischen Opferkontext geläufigen Terminologie. Die beiden räumlichen Wendungen werden bewusst unterschiedlich wiedergegeben: „vor Jahwe“ bezeichnet die göttliche Gegenwart, „an der Vorderseite des Altars“ den konkreten Ort.'
