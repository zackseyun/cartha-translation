    issue: „an der Vorderseite des Altars“ gibt אֶל־פְּנֵי הַמִּזְבֵּחַ nicht präzise wieder.
    rationale: אֶל markiert hier die Richtung beziehungsweise das Heranführen zum Bereich vor dem Altar. Die deutsche Formulierung ist dagegen statisch und kann die physische Vorderseite des Altars meinen. „vor den Altar“ erhält die Bewegungsrichtung und den räumlichen Bezug.
