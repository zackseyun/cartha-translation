base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/003.yaml
  text: And the priest shall put on his linen garment, and he shall put linen undergarments on his body, and he shall remove the ashes to which the fire has reduced the burnt offering on the altar, and he shall place them beside the altar.
translation:
  language: de
  text: Der Priester soll sein leinenes Gewand anziehen und leinene Beinkleider unmittelbar auf seinem Körper[a] tragen. Dann soll er die Asche des Brandopfers,[b] das das Feuer auf dem Altar verzehrt hat, wegnehmen und sie neben den Altar legen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „auf seinem Fleisch“.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Formulierung verbindet „die Asche“ in knapper Weise mit dem Brandopfer, das das Feuer auf dem Altar verzehrt. Möglich ist auch: „die Asche, die beim Verzehren des Brandopfers durch das Feuer auf dem Altar entsteht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדּוֹ בַד
  choice: sein leinenes Gewand
  rationale: מִדּוֹ bezeichnet hier ein priesterliches Kleidungsstück; בַד nennt das Material. „Gewand“ vermeidet eine nicht sicher bestimmbare genauere Schnittform.
- source_word: מִכְנְסֵי בַד
  choice: leinene Beinkleider
  rationale: Das Wort bezeichnet die den Unterkörper bedeckende priesterliche Kleidung. „Beinkleider“ ist würdevoll und genauer als das funktional weiter gefasste „Unterwäsche“.
- source_word: עַל בְּשָׂרוֹ
  choice: unmittelbar auf seinem Körper
  rationale: Wörtlich „auf seinem Fleisch“; die Formulierung verdeutlicht in natürlichem Deutsch, dass das Kleidungsstück direkt am Körper getragen wird.
- source_word: וְהֵרִים
  choice: wegnehmen
  rationale: Das Verb bedeutet grundsätzlich „heben/aufnehmen“, bezeichnet hier aber den rituellen Vorgang, die Asche vom Altar zu entfernen.
- source_word: הַדֶּשֶׁן
  choice: die Asche
  rationale: Im Opferkontext bezeichnet דֶּשֶׁן den Rückstand des auf dem Altar Verbrannten.
- source_word: אֲשֶׁר תֹּאכַל הָאֵשׁ אֶת הָעֹלָה
  choice: zu der das Feuer das Brandopfer … verbrannt hat
  rationale: Die kompakte hebräische Wendung verbindet die Asche mit dem Verzehren des Brandopfers durch das Feuer. Die deutsche Fassung gibt den resultativen Sinn wieder, ohne die Bildrede „essen“ wörtlich zu übernehmen.
- source_word: הָעֹלָה
  choice: das Brandopfer
  rationale: „Brandopfer“ ist die etablierte und sachlich passende deutsche Bezeichnung für עֹלָה.
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: neben den Altar
  rationale: אֵצֶל bezeichnet die unmittelbare Nähe an der Seite des Altars.
