  yaml_path: translation/ot/leviticus/006/019.yaml
  text: The priest who makes atonement with it shall eat it. It shall be eaten in a holy place[a], in the court of the tent of meeting.
translation:
  language: de
  text: Der Priester, der es als Sündopfer darbringt[a], soll es essen. An einem heiligen Ort soll es gegessen werden, im Vorhof des Zeltes der Begegnung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der damit Sühne erwirkt“ oder „der damit Reinigung bewirkt“. Das hebräische Partizip kann hier insbesondere den Vollzug des Sündopferritus oder dessen sühnende beziehungsweise reinigende Wirkung bezeichnen.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: הַכֹּהֵן
  choice: Der Priester
  rationale: Die bestimmte Form wird mit „der“ wiedergegeben; „Priester“ ist die übliche und sachlich genaue Entsprechung.
- source_word: הַמְחַטֵּא אֹתָהּ
  choice: der es als Sündopfer darbringt
  rationale: Das Piel-Partizip von חטא hat hier einen kultischen Sinn und bezeichnet den Priester, der den Sündopferritus vollzieht. Die Formulierung ist im modernen Deutsch verständlich, ohne die im Hebräischen nicht ausdrücklich genannte Sühnewirkung zur alleinigen Deutung zu machen.
- source_word: יֹאכֲלֶנָּה
  choice: soll es essen
  rationale: Der Imperfekt formuliert in diesem Gesetz eine verbindliche Vorschrift; „soll“ gibt diesen normativen Charakter natürlich wieder.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: an einem heiligen Ort
  rationale: „Ort“ steht ohne Artikel. „An einem heiligen Ort“ bewahrt dies und entspricht dem kultischen Sprachgebrauch.
- source_word: תֵּאָכֵל
  choice: soll es gegessen werden
  rationale: Die passive Vorschrift des Nifal bleibt erhalten, sodass der Fokus wie im Hebräischen auf dem Opfer liegt.
- source_word: בַּחֲצַר אֹהֶל מוֹעֵד
  choice: im Vorhof des Zeltes der Begegnung
  rationale: „Vorhof“ bezeichnet den umgrenzten Hofbereich des Heiligtums im Deutschen eindeutig; „Zelt der Begegnung“ gibt אֹהֶל מוֹעֵד sachgerecht und verständlich wieder.
theological_decisions:
- issue: Kultische Bedeutung von חטא im priesterlichen Opferrecht
  choice: als Sündopfer darbringt
  alternative: damit Sühne erwirkt; damit entsündigt
  rationale: Das Verb kann den Vollzug des Sündopferritus beziehungsweise dessen entsühnende oder reinigende Funktion bezeichnen. Der Haupttext benennt den rituellen Vorgang, während die Fußnote die echte Bedeutungsbreite offenhält und keine einzelne Wirkungsdeutung verabsolutiert.
- issue: Bezug der femininen Pronomen
  choice: es
  alternative: sie
  rationale: Die grammatisch femininen Formen beziehen sich auf das Opfertier beziehungsweise das Opfer. Im natürlichen deutschen Sachstil wird dieser Bezug mit dem Neutrum „es“ aufgenommen.
translation_notes:
  register: Moderne, würdige Gesetzessprache mit klarer kultischer Terminologie. „Soll“ vermittelt die verbindliche Vorschrift natürlicher als ein altertümliches „wird“. Der Fußnotenmarker steht unmittelbar bei der mehrdeutigen Wendung.
