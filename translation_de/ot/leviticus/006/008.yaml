  to: Er soll daraus mit seiner Hand eine Handvoll vom Feinmehl des Speisopfers und von dessen Öl nehmen[a], dazu allen Weihrauch, der auf dem Speisopfer liegt. Den Gedächtnisanteil des Speisopfers soll er auf dem Altar als wohlgefälligen Duft für Jahwe in Rauch aufgehen lassen.[b]
