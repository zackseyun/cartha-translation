  text: וְ/הֵרִ֨ים מִמֶּ֜/נּוּ בְּ/קֻמְצ֗/וֹ מִ/סֹּ֤לֶת הַ/מִּנְחָה֙ וּ/מִ/שַּׁמְנָ֔/הּ וְ/אֵת֙ כָּל הַ/לְּבֹנָ֔ה אֲשֶׁ֖ר עַל הַ/מִּנְחָ֑ה וְ/הִקְטִ֣יר הַ/מִּזְבֵּ֗חַ רֵ֧יחַ נִיחֹ֛חַ אַזְכָּרָתָ֖/הּ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/008.yaml
  text: And he shall take up from it a handful of the fine flour of the grain offering and some of its oil[a], with all the frankincense that is on the grain offering[b], and he shall burn its memorial portion on the altar as a pleasing aroma to Yahweh.
translation:
  language: de
  text: Er soll daraus mit seiner Hand eine Handvoll vom Feinmehl des Speisopfers und von dessen Öl nehmen[a], dazu allen Weihrauch, der auf dem Speisopfer liegt. Den Gedächtnisanteil des Speisopfers soll er auf dem Altar als wohlgefälligen Duft für Jahwe in Rauch aufgehen lassen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Er soll daraus mit seiner Hand eine Handvoll emporheben.“ Das hebräische Verb betont zusammen mit der genannten Hand das Herausnehmen des dafür bestimmten Anteils.'
    reason: lexical_alternative
  - marker: b
    text: „Gedächtnisanteil“ ist ein kultischer Fachausdruck für den repräsentativen Teil des Speisopfers, der auf dem Altar in Rauch aufgeht.
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵרִים מִמֶּנּוּ בְּקֻמְצוֹ
  choice: Dann soll er daraus mit seiner Hand eine Handvoll … nehmen
  rationale: Die Formulierung gibt sowohl das Herausnehmen bzw. Aufheben als auch die durch die Hand bestimmte Menge wieder. „Mit seiner Hand eine Handvoll“ bewahrt die im Hebräischen ausdrücklich genannte Hand, ohne das unnatürliche „mit seiner Handvoll“ zu verwenden.
- source_word: מִסֹּלֶת הַמִּנְחָה
  choice: vom Feinmehl des Speisopfers
  rationale: סֹלֶת bezeichnet feines Mehl; מִנְחָה ist hier der kultische Fachausdruck für das unblutige Speisopfer.
- source_word: וּמִשַּׁמְנָהּ
  choice: und von dessen Öl
  rationale: 'Die wiederholte Präposition מִן wahrt den partitiven Sinn: Es wird Öl daraus genommen, nicht zwingend das gesamte Öl.'
- source_word: וְאֵת כָּל הַלְּבֹנָה
  choice: dazu allen Weihrauch
  rationale: לְבֹנָה bezeichnet spezifisch Weihrauch. Anders als bei Mehl und Öl wird ausdrücklich der gesamte Weihrauch genommen.
- source_word: וְהִקְטִיר
  choice: in Rauch aufgehen lassen
  rationale: Der kultische Hifil-Stamm von קטר bezeichnet das Verbrennen als Opferrauch und wird präziser wiedergegeben als durch das allgemeinere „verbrennen“.
- source_word: רֵיחַ נִיחֹחַ
  choice: als einen wohlgefälligen Duft
  rationale: Die feste Opferformel bezeichnet einen für Gott annehmbaren Duft. „Wohlgefällig“ ist würdig und vermeidet eine grob sinnliche Deutung.
- source_word: אַזְכָּרָתָהּ
  choice: seinen Gedächtnisanteil
  rationale: Der technische Ausdruck bezeichnet den repräsentativen Anteil des Speisopfers, der auf dem Altar verbrannt wird.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition kennzeichnet die Ausrichtung des Opfers; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname im Ausgangstext wird sichtbar bewahrt, statt durch einen Titel ersetzt zu werden.
- issue: Bedeutung von רֵיחַ נִיחֹחַ
  choice: wohlgefälliger Duft
  alternative: beruhigender Duft
  rationale: Die gewählte Formulierung bewahrt die Aussage göttlichen Wohlgefallens, ohne eine mechanistische oder anthropomorph verengte Opfervorstellung festzuschreiben.
- issue: Technischer Sinn von אַזְכָּרָה
  choice: Gedächtnisanteil
  alternative: Erinnerungsopfer
  rationale: „Anteil“ macht deutlich, dass nur ein repräsentativer Teil des Speisopfers auf dem Altar verbrannt wird; worauf oder an wen das „Gedenken“ zielt, lässt der Ausdruck offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit kultisch präziser Terminologie. „Speisopfer“, „Weihrauch“ und „Gedächtnisanteil“ wahren den fachsprachlichen Charakter; die Satzstruktur bleibt für heutige Leser verständlich.
