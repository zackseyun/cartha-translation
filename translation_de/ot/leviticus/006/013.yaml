  text: זֶ֡ה קָרְבַּן֩ אַהֲרֹ֨ן וּ/בָנָ֜י/ו אֲשֶׁר יַקְרִ֣יבוּ לַֽ/יהוָ֗ה בְּ/יוֹם֙ הִמָּשַׁ֣ח אֹת֔/וֹ עֲשִׂירִ֨ת הָ/אֵפָ֥ה סֹ֛לֶת מִנְחָ֖ה תָּמִ֑יד מַחֲצִיתָ֣/הּ בַּ/בֹּ֔קֶר וּ/מַחֲצִיתָ֖/הּ בָּ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/013.yaml
  text: 'This is the offering of Aaron and his sons[a], which they shall present to Yahweh on the day he is anointed: a tenth of an ephah of fine flour as a regular grain offering, half of it in the morning and half of it in the evening.'
translation:
  language: de
  text: 'Dies ist die Opfergabe Aarons und seiner Söhne, die sie Jahwe an dem Tag darbringen sollen, an dem er gesalbt wird[a]: ein Zehntel eines Efa feines Mehl als regelmäßiges Speiseopfer, die eine Hälfte am Morgen und die andere Hälfte am Abend.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „an dem Tag, an dem er gesalbt wird“. Im Hebräischen steht das Pronomen im Singular, obwohl zuvor Aaron und seine Söhne genannt werden.'
    reason: Bewahrt die singularische und passive Form des hebräischen Textes und macht die Spannung im Bezug deutlich, ohne sie aufzulösen.
lexical_decisions:
- source_word: קָרְבַּן
  choice: Opfergabe
  rationale: Der umfassende kultische Begriff bezeichnet eine dargebrachte Gabe; »Opfergabe« ist im Deutschen klar und vermeidet unnötig altertümliche Sprache.
- source_word: יַקְרִיבוּ
  choice: darbringen sollen
  rationale: Der Hifil von קרב bezeichnet im Opferkontext das rituelle Heranbringen bzw. Darbringen; die gewählte Formulierung ist natürlich und wahrt den kultischen Sinn.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als Eigenname wiedergegeben; »Jahwe« ist die geläufige deutsche Transkription.
- source_word: בְּיוֹם הִמָּשַׁח אֹתוֹ
  choice: an dem Tag, an dem er gesalbt wird
  rationale: Die Formulierung wahrt den zeitlichen Bezug und insbesondere das auffällige singularische Objektpronomen des hebräischen Textes.
- source_word: עֲשִׂירִת הָאֵפָה
  choice: ein Zehntel Efa
  rationale: Die hebräische Maßangabe wird präzise und in geläufiger deutscher Form wiedergegeben.
- source_word: סֹלֶת
  choice: Feinmehl
  rationale: Dies ist die übliche sachgerechte Bezeichnung für das besonders feine Mehl der Speiseopfer.
- source_word: מִנְחָה
  choice: Speiseopfer
  rationale: Im levitischen Kultzusammenhang bezeichnet מִנְחָה das unblutige Opfer aus Getreide; »Speiseopfer« ist die etablierte und verständliche deutsche Bezeichnung.
- source_word: תָּמִיד
  choice: regelmäßig
  rationale: Das Wort bezeichnet hier die fortlaufend wiederkehrende Darbringung, nicht notwendig eine ununterbrochene Handlung.
- source_word: מַחֲצִיתָהּ ... וּמַחֲצִיתָהּ
  choice: die eine Hälfte ... und die andere Hälfte
  rationale: Die Formulierung gibt die Aufteilung in zwei gleiche Teile idiomatisch wieder.
- source_word: בַּבֹּקֶר ... בָּעָרֶב
  choice: am Morgen ... am Abend
  rationale: Dies entspricht den hebräischen Zeitangaben in natürlichem modernem Deutsch.
theological_decisions:
- issue: Bezug des singularischen Pronomens in der Wendung zur Salbung nach der Nennung Aarons und seiner Söhne
  choice: 'Der Singular bleibt im Haupttext erhalten: »an dem er gesalbt wird«.'
  alternative: 'Sinngemäße Angleichung an den Plural: »an dem sie gesalbt werden«.'
  rationale: Der masoretische Text verwendet ausdrücklich ein singularisches Pronomen. Die Übersetzung glättet diese Spannung nicht, sondern macht sie durch eine Fußnote transparent; als möglicher Bezug kommt Aaron beziehungsweise der jeweils gesalbte Priester in Betracht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit geläufiger kultischer Terminologie. Der Satzbau bleibt nahe am Hebräischen, ohne unnatürlich zu wirken; die singularische Formulierung wird bewusst nicht harmonisiert.
