source:
  edition: WLC
  text: וְ/כָל מִנְחַ֥ת כֹּהֵ֛ן כָּלִ֥יל תִּהְיֶ֖ה לֹ֥א תֵאָכֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/016.yaml
  text: And every grain offering of a priest shall be wholly burned[a]; it shall not be eaten.
translation:
  language: de
  text: Und jedes Speiseopfer eines Priesters soll vollständig verbrannt werden[a]; es darf nicht gegessen werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „soll ganz sein“. Das hebräische Wort bezeichnet das Opfer als vollständig hingegeben; hier bedeutet das, dass nichts davon gegessen, sondern alles auf dem Altar verbrannt wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: Und jedes
  rationale: וְ führt die Opferbestimmungen fort; כָּל ist vor dem singularischen Konstruktstatus distributiv und wird daher mit „jedes“ wiedergegeben.
- source_word: מִנְחַת
  choice: Speiseopfer
  rationale: מִנְחָה ist im Kontext des Levitikus der feste kultische Ausdruck für ein unblutiges Opfer aus Getreide beziehungsweise Mehl. „Speiseopfer“ ist die geläufige und knappe deutsche Fachbezeichnung.
- source_word: כֹּהֵן
  choice: eines Priesters
  rationale: Die Konstruktverbindung מִנְחַת כֹּהֵן bezeichnet das Speiseopfer, das einem Priester zugeordnet ist; der unbestimmte Singular bleibt erhalten.
- source_word: כָּלִיל תִּהְיֶה
  choice: soll vollständig verbrannt werden
  rationale: כָּלִיל bezeichnet hier das Opfer als ganz und vollständig hingegeben; im Opferkontext ist damit praktisch die vollständige Verbrennung gemeint. Die deutsche Formulierung macht den sachlich vorausgesetzten Vollzug natürlich verständlich.
- source_word: לֹא תֵאָכֵל
  choice: es darf nicht gegessen werden
  rationale: Der passive Nifal bleibt erhalten. „Darf nicht“ gibt die rechtliche Verbotskraft des Imperfekts in natürlichem modernem Deutsch wieder.
theological_decisions:
- issue: Bedeutung von כָּלִיל
  choice: vollständig verbrannt werden
  alternative: ganz sein / als Ganzes dargebracht werden
  rationale: Das Adjektiv bedeutet wörtlich „ganz, vollständig“. Im unmittelbaren Opferkontext und durch den anschließenden Ausschluss des Essens bezeichnet es die vollständige Überlassung an den Altar. Die Fußnote bewahrt die formale Bedeutungsbreite.
translation_notes:
  register: Moderne, würdige Rechtssprache. „Speiseopfer“ wahrt die etablierte kultische Terminologie; „soll“ und „darf nicht“ unterscheiden positive Vorschrift und Verbot klar.
