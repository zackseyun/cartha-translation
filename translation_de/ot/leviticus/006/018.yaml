base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/018.yaml
  text: 'Speak to Aaron and to his sons[a], saying, ‘This is the law of the sin offering: in the place where the burnt offering is slaughtered, the sin offering shall be slaughtered before Yahweh. It is most holy.’'
translation:
  language: de
  text: 'Sprich zu Aaron und zu seinen Söhnen: »Dies ist die Weisung für das Sündopfer[a]: An dem Ort, an dem das Brandopfer geschlachtet wird, soll das Sündopfer vor Yahweh geschlachtet werden. Es ist hochheilig.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Reinigungsopfer«. Das hebräische Wort חַטָּאת kann sowohl die Sünde als auch das mit der Reinigung davon verbundene Opfer bezeichnen.'
    reason: Lexikalische Alternative; die funktionale Nuance des Opferbegriffs bleibt im Hebräischen offen.
lexical_decisions:
- source_word: דַּבֵּר אֶל־אַהֲרֹן וְאֶל־בָּנָיו לֵאמֹר
  choice: Rede zu Aaron und zu seinen Söhnen und sage
  rationale: Bewahrt den formellen Anweisungscharakter und gibt die wiederholte Präposition sowie die Einleitungsformel klar und natürlich wieder.
- source_word: זֹאת תּוֹרַת הַחַטָּאת
  choice: Dies ist die Weisung für das Sündopfer
  rationale: תּוֹרָה bezeichnet hier eine kultische Einzelanweisung oder Ordnung; „Weisung“ ist im modernen Deutsch präziser als das weiter gefasste „Gesetz“. חַטָּאת bezeichnet in diesem Zusammenhang das Opfer.
- source_word: בִּמְקוֹם אֲשֶׁר תִּשָּׁחֵט הָעֹלָה
  choice: An dem Ort, an dem das Brandopfer geschlachtet wird
  rationale: Gibt die Ortsbestimmung und den passivischen Opferterminus שׁחט genau wieder; „Brandopfer“ ist die geläufige Fachbezeichnung für עֹלָה.
- source_word: תִּשָּׁחֵט הַחַטָּאת
  choice: soll auch das Sündopfer geschlachtet werden
  rationale: Das Imperfekt hat im Gesetzestext vorschreibende Kraft. Das ergänzte „auch“ macht im Deutschen die räumliche Entsprechung deutlich, ohne den Sinn zu erweitern.
- source_word: לִפְנֵי יְהוָה
  choice: vor Yahweh
  rationale: „Vor“ bewahrt die kultische Wendung; der Gottesname wird als „Yahweh“ wiedergegeben.
- source_word: קֹדֶשׁ קָדָשִׁים הִוא
  choice: Es ist hochheilig
  rationale: Die hebräische Steigerungsform bezeichnet die höchste Heiligkeitsstufe. „Hochheilig“ ist im Deutschen knapp und für die kultische Klassifikation passend.
theological_decisions:
- issue: Bedeutungsumfang von חַטָּאת
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: Der Ausdruck bezeichnet hier eindeutig eine Opferart, lässt sich aber hinsichtlich ihrer Funktion sowohl mit Sünde als auch mit ritueller Reinigung verbinden. Die Hauptübersetzung verwendet den vertrauten Begriff und bewahrt die Alternative in einer Fußnote.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. Die Umschrift bewahrt diesen als Namen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer kultischer Fachsprache. Die direkte Rede ist typografisch gekennzeichnet; der gesetzgeberische Ton bleibt erhalten.
