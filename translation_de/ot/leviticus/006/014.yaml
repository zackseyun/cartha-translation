source:
  edition: WLC
  text: עַֽל מַחֲבַ֗ת בַּ/שֶּׁ֛מֶן תֵּעָשֶׂ֖ה מֻרְבֶּ֣כֶת תְּבִיאֶ֑/נָּה תֻּפִינֵי֙ מִנְחַ֣ת פִּתִּ֔ים תַּקְרִ֥יב רֵֽיחַ נִיחֹ֖חַ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/014.yaml
  text: On a griddle with oil it shall be made[a], well mixed; you shall bring it in baked pieces, a grain offering broken into pieces[c][b], and present it as a pleasing aroma to Yahweh.
translation:
  language: de
  text: Auf einer Pfanne soll es mit Öl[a] zubereitet werden; gut vermengt sollst du es bringen. Als Gebäck eines Speiseopfers, in Stücken, sollst du es als einen angenehmen Duft[c] für Jahwe darbringen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Öl“.'
    reason: lexical_alternative
  - marker: b
    text: Der hier verwendete hebräische Ausdruck ist selten und kann Gebäck oder gebackene Portionen bezeichnen.
    reason: lexical_alternative
  - marker: c
    text: „Ein angenehmer Duft“ ist eine feste Wendung der Opfersprache und bezeichnet ein Opfer, das Jahwe wohlgefällig ist.
    reason: cultural_note
lexical_decisions:
- source_word: מַחֲבַת
  choice: Pfanne
  rationale: Das Wort bezeichnet ein flaches Kochgerät zur Zubereitung von Speiseopfern. „Pfanne“ ist im modernen Deutschen natürlich und lässt die genaue Bauart offen.
- source_word: בַּשֶּׁמֶן
  choice: mit Öl
  rationale: Die Präposition kann hier instrumental („mit“) oder örtlich („in“) verstanden werden. „Mit Öl“ bezeichnet die Zubereitungsweise idiomatisch, ohne „in Öl“ auszuschließen.
- source_word: תֵּעָשֶׂה
  choice: soll es zubereitet werden
  rationale: Der passive Nifal beschreibt die Zubereitung des Opfers; „zubereitet“ ist im kulinarisch-kultischen Zusammenhang genauer und natürlicher als das allgemeinere „gemacht“.
- source_word: מֻרְבֶּכֶת
  choice: gut vermengt
  rationale: Das seltene Wort beschreibt wahrscheinlich eine gründlich mit Öl vermischte Zubereitung. Die Wiedergabe wahrt diese Grundbedeutung, ohne ein unsicheres technisches Verfahren festzulegen.
- source_word: תְּבִיאֶנָּה
  choice: du sollst es herbeibringen
  rationale: Das Verb bedeutet „bringen“; „herbeibringen“ bewahrt gegenüber dem folgenden kultischen „darbringen“ die Unterscheidung der beiden hebräischen Verben.
- source_word: תֻּפִינֵי
  choice: gebackene Stücke
  rationale: Der seltene kulinarische Ausdruck hängt wahrscheinlich mit dem Backen zusammen und bezeichnet gebackene Portionen oder Stücke. Die Unsicherheit wird in einer Fußnote kenntlich gemacht.
- source_word: מִנְחַת
  choice: Speiseopfer
  rationale: Im Kontext von Levitikus bezeichnet מִנְחָה hier ausdrücklich ein Opfer aus Mehl beziehungsweise Getreide. „Speiseopfer“ ist die etablierte, prägnante deutsche Kultbezeichnung.
- source_word: פִּתִּים
  choice: in Stücke gebrochen
  rationale: Das Wort bezeichnet Teile oder Stücke; die verbale Formulierung macht im Deutschen verständlich, dass das Speiseopfer zerteilt vorliegt.
- source_word: תַּקְרִיב
  choice: darbringen
  rationale: Im Opferkontext bedeutet der Hifil von קרב, etwas kultisch herzuzubringen beziehungsweise zu opfern. „Darbringen“ wahrt den kultischen Ton und unterscheidet sich von „herbeibringen“.
- source_word: רֵיחַ נִיחֹחַ
  choice: einen angenehmen Duft
  rationale: Die feste Opfersprache bezeichnet einen Duft, der Gott angenehm beziehungsweise wohlgefällig ist. „Angenehmer Duft“ ist verständlich und bewahrt das konkrete Bild.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition bezeichnet die Ausrichtung des Opfers auf Jahwe; der Gottesname wird als Eigenname wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen ausdrücklich. „Jahwe“ gibt ihn als Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von רֵיחַ נִיחֹחַ in der Opfersprache
  choice: einen angenehmen Duft
  alternative: einen beruhigenden Duft
  rationale: Die Formulierung bewahrt das konkrete Opferbild und seine Bedeutung der göttlichen Annahme, ohne den Ausdruck in eine abstrakte theologische Aussage aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer kultischer Terminologie. Die Wiederholung von „Stücke“ wurde trotz stilistischer Schwere beibehalten, weil der hebräische Text zwei benachbarte, nicht völlig deckungsgleiche Ausdrücke verwendet. Die seltenen kulinarischen Begriffe werden nicht durch eine zu genaue Rekonstruktion des Zubereitungsverfahrens vereindeutigt.
