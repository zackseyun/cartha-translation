source:
  edition: WLC
  text: כָּל זָכָ֥ר בַּ/כֹּהֲנִ֖ים יֹאכַ֣ל אֹתָ֑/הּ קֹ֥דֶשׁ קָֽדָשִׁ֖ים הִֽוא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/022.yaml
  text: Every male among the priests may eat it[a]; it is most holy.
translation:
  language: de
  text: Jeder männliche Angehörige der Priester darf davon essen. Es ist hochheilig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Heiligkeit der Heiligkeiten“; eine hebräische Ausdrucksweise für den höchsten Grad der Heiligkeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל זָכָר בַּכֹּהֲנִים
  choice: Jeder männliche Angehörige der Priester
  rationale: כָּל mit dem singularischen זָכָר ist distributiv. Die Formulierung wahrt den ausdrücklichen Bezug auf das männliche Geschlecht und gibt בַּכֹּהֲנִים als Zugehörigkeit zur Gruppe der Priester wieder.
- source_word: יֹאכַל
  choice: darf ... essen
  rationale: Der Imperfekt bezeichnet im rechtlichen Zusammenhang eine erlaubte beziehungsweise geregelte Handlung, nicht notwendig einen Befehl an jeden Einzelnen.
- source_word: אֹתָהּ
  choice: davon
  rationale: Das feminine Pronomen verweist auf das zuvor genannte Opfer; „davon“ ist im Deutschen natürlich und vermeidet eine unnötige Wiederholung.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: hochheilig
  rationale: Die hebräische Fügung „Heiligkeit der Heiligkeiten“ ist eine feste Steigerungsformel und bezeichnet den höchsten kultischen Heiligkeitsgrad.
- source_word: הִוא
  choice: Es ist
  rationale: Das feminine hebräische Pronomen stimmt grammatisch mit seinem Bezugswort überein; im Deutschen ist für das hier vorausgesetzte Opfergut das neutrale „es“ idiomatisch.
theological_decisions:
- issue: Berechtigung oder Verpflichtung zum Essen
  choice: darf davon essen
  alternative: soll davon essen
  rationale: Der rechtliche Kontext regelt den berechtigten Personenkreis. Die Übersetzung lässt nicht den Eindruck entstehen, jeder männliche Priester müsse persönlich davon essen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Männlicher Angehöriger“ ist präziser und natürlicher als das substantivierte „jeder Männliche“; „hochheilig“ bewahrt die kultische Abstufung knapp und verständlich.
