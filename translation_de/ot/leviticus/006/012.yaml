base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/012.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: de
  text: 'Und Jahwe sprach zu Mose[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH. Traditionell wird der Gottesname mit „der HERR“ wiedergegeben; eine andere Form ist „Jehova“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: sprach
  rationale: Das narrative Wayyiqtol von דבר leitet eine neue Redehandlung ein. „Sprach“ entspricht der würdevollen biblischen Erzählformel und unterscheidet sich passend von einer bloßen Wiedergabe mit „sagte“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, der im modernen Deutschen üblichen wissenschaftlichen Transkription, statt ihn durch einen Titel zu ersetzen.
- source_word: אֶל מֹשֶׁה
  choice: zu Mose
  rationale: Die Präposition אֶל bezeichnet hier den Adressaten des Sprechens; „zu Mose“ ist die natürliche deutsche Wiedergabe.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Die hebräische Redeformel „sprechend/um zu sagen“ kündigt den unmittelbar folgenden Wortlaut an. Im natürlichen modernen Deutsch übernimmt der Doppelpunkt diese Funktion ohne Bedeutungsverlust.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext enthält den Eigennamen יהוה. „Jahwe“ bewahrt ihn als persönlichen Gottesnamen und vermeidet die Ersetzung durch den Titel „der HERR“; „Jehova“ beruht auf einer späteren Verbindung der Konsonanten mit fremden Vokalzeichen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Redeeinleitung wird natürlich mit einem Doppelpunkt abgeschlossen; die traditionelle Partizipialform „indem er sprach“ wird vermieden.
