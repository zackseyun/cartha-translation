  text: אֵ֗שׁ תָּמִ֛יד תּוּקַ֥ד עַל הַ/מִּזְבֵּ֖חַ לֹ֥א תִכְבֶֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/006.yaml
  text: A continual fire shall be kept burning on the altar[a]; it shall not go out.
translation:
  language: de
  text: Ein beständiges Feuer soll auf dem Altar am Brennen gehalten werden[a]; es darf nicht erlöschen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ein immerwährendes Feuer soll auf dem Altar brennen; es soll nicht erlöschen.“'
    reason: 'Lexikalische und grammatische Alternative: תָּמִיד kann mit „immerwährend“ wiedergegeben werden; תּוּקַד lässt sich weniger explizit als „soll brennen“ übersetzen.'
lexical_decisions:
- source_word: אֵשׁ
  choice: Feuer
  rationale: Die Grundbedeutung ist das konkrete Feuer; dies ist im Opferkontext die direkte und übliche Wiedergabe.
- source_word: תָּמִיד
  choice: beständig
  rationale: Das Wort bezeichnet fortdauernde Kontinuität. „Beständig“ ist natürlich und würdevoll; „ewig“ könnte eine stärkere zeitliche Aussage nahelegen als der Kontext verlangt.
- source_word: תּוּקַד
  choice: soll … am Brennen gehalten werden
  rationale: Die Hophal-Form von יקד ist passiv beziehungsweise kausativ-passiv und weist darauf, dass das Feuer fortlaufend brennend zu halten ist, nicht nur darauf, dass es von selbst brennt.
- source_word: עַל הַמִּזְבֵּחַ
  choice: auf dem Altar
  rationale: Die räumliche Präposition und der bestimmte Artikel werden im modernen Standarddeutsch direkt wiedergegeben.
- source_word: לֹא תִכְבֶּה
  choice: es darf nicht erlöschen
  rationale: Das Verb bezeichnet das Ausgehen oder Erlöschen eines Feuers. Mit „darf nicht“ wird die prohibitive Vorschrift im Deutschen natürlich ausgedrückt, während „erlöschen“ die intransitive Form bewahrt.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdiges Standarddeutsch. Die Formulierung vermeidet altertümliches „immerdar“ und macht den vorgeschriebenen fortlaufenden Unterhalt des Altarfeuers deutlich.
