base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/023.yaml
  text: But any sin offering from whose blood some is brought into the tent of meeting to make atonement in the holy place shall not be eaten[a]; it shall be burned with fire.
translation:
  language: de
  text: Und jedes Sündopfer[a], von dessen Blut etwas in das Zelt der Begegnung gebracht wird, um im Heiligtum Sühne zu erwirken, darf nicht gegessen werden; es muss im Feuer verbrannt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Reinigungsopfer“. Das hebräische Wort חַטָּאת kann im 3. Buch Mose ein Opfer bezeichnen, das der Beseitigung von Verunreinigung und Sünde dient.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל
  choice: Jedes … jedoch
  rationale: כָל wird umfassend mit „jedes“ wiedergegeben. Das nachgestellte „jedoch“ lässt וְ im Zusammenhang als anschließende, zugleich einschränkende Gegenüberstellung erkennen, ohne einen stärkeren Gegensatz zu behaupten.
- source_word: חַטָּאת
  choice: Sündopfer
  rationale: Im kultischen Zusammenhang bezeichnet das Wort das Opfer, das mit Sünde und Reinigung zu tun hat, nicht die Sünde als abstrakten Begriff. „Sündopfer“ ist im Deutschen die geläufigste und für allgemeine Leser verständlichste Bezeichnung.
- source_word: אֲשֶׁר יוּבָא מִדָּמָהּ
  choice: von dessen Blut etwas … gebracht wird
  rationale: 'Die Präposition מִן vor „Blut“ hat partitive Bedeutung: Ein Teil des Blutes, nicht zwingend alles Blut, wird hineingebracht. „Etwas“ macht diesen Sinn im Deutschen sichtbar.'
- source_word: אֶל אֹהֶל מוֹעֵד
  choice: in das Zelt der Begegnung
  rationale: Dies gibt die feste Bezeichnung des Heiligtums verständlich wieder; „in“ entspricht hier dem Hineinbringen des Blutes.
- source_word: לְכַפֵּר
  choice: um … Sühne zu erwirken
  rationale: Die Formulierung bewahrt die kultisch-theologische Tragweite von כפר, ohne eine bestimmte Theorie der Sühne festzulegen.
- source_word: בַּקֹּדֶשׁ
  choice: im Heiligtum
  rationale: Gemeint ist der heilige Bereich, in dem die Sühnehandlung vollzogen wird. „Im Heiligtum“ ist im Deutschen natürlich und lässt die genaue räumliche Abgrenzung offen.
- source_word: לֹא תֵאָכֵל
  choice: darf nicht gegessen werden
  rationale: Die passive Konstruktion bleibt erhalten; „darf nicht“ gibt das rechtliche Verbot in heutigem Deutsch klar wieder.
- source_word: בָּאֵשׁ תִּשָּׂרֵף
  choice: es muss im Feuer verbrannt werden
  rationale: Die ausdrückliche Nennung des Feuers wird bewahrt. „Muss“ gibt die verbindliche kultische Vorschrift in natürlichem modernem Deutsch wieder.
theological_decisions:
- issue: Bedeutung von חַטָּאת in der priesterlichen Opfergesetzgebung
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: Das Wort bezeichnet hier eindeutig ein Opfer. „Sündopfer“ ist die etablierte, allgemein verständliche Wiedergabe; „Reinigungsopfer“ hebt zutreffend dessen reinigende Funktion hervor, soll aber als lexikalische Alternative in der Fußnote stehen, damit die Bedeutungsbreite nicht eingeebnet wird.
- issue: Umfang des ins Heiligtum gebrachten Blutes
  choice: Der partitive Sinn wird mit „von dessen Blut etwas“ ausdrücklich wiedergegeben.
  alternative: „dessen Blut … gebracht wird“
  rationale: Das hebräische מִן an „seinem Blut“ weist darauf hin, dass ein Teil des Blutes hineingebracht wird. Die ausdrückliche Wiedergabe verhindert, dass Leser irrtümlich das gesamte Blut voraussetzen.
- issue: Räumlicher Bezug von בַּקֹּדֶשׁ
  choice: im Heiligtum
  alternative: im heiligen Bereich / im Heiligen
  rationale: Der Ausdruck benennt einen heiligen Bereich des Heiligtums, ohne hier allein eindeutig eine engere architektonische Unterteilung festzulegen. „Im Heiligtum“ bewahrt diese Offenheit in natürlichem Deutsch.
translation_notes:
  register: Moderner, würdiger Gesetzesstil. „Darf nicht“ und „muss“ vermitteln die verbindliche Vorschrift klar; die passive Form des Essverbots und die kultischen Schlüsselbegriffe bleiben erhalten.
