  text: וְ/הַ/נּוֹתֶ֣רֶת מִמֶּ֔/נָּה יֹאכְל֖וּ אַהֲרֹ֣ן וּ/בָנָ֑י/ו מַצּ֤וֹת תֵּֽאָכֵל֙ בְּ/מָק֣וֹם קָדֹ֔שׁ בַּ/חֲצַ֥ר אֹֽהֶל מוֹעֵ֖ד יֹאכְלֽוּ/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/009.yaml
  text: What is left of it Aaron and his sons shall eat[a]. It shall be eaten unleavened in a holy place[c][b]; they shall eat it in the court of the tent of meeting.
translation:
  language: de
  text: Was davon übrig bleibt, sollen Aaron und seine Söhne essen.[a] Es soll ungesäuert[b] an einem heiligen Ort[c] gegessen werden; im Vorhof des Zeltes der Begegnung sollen sie es essen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Den Rest davon“ oder „Was davon verbleibt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „als ungesäuerte Backwaren“. Gemeint ist, dass der verbleibende Teil des Opfers in ungesäuerter Form gegessen wird.'
    reason: lexical_alternative
  - marker: c
    text: Wörtlich steht im Hebräischen „an einem heiligen Ort“, nicht „an dem heiligen Ort“. Der folgende Satzteil bezeichnet diesen Ort genauer als den Vorhof des Zeltes der Begegnung.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנּוֹתֶרֶת מִמֶּנָּה
  choice: Was davon übrig bleibt
  rationale: Die substantivisch gebrauchte feminine Partizipialform bezeichnet den verbleibenden Teil des Speisopfers. Die Formulierung ist im Deutschen natürlich und gibt den Bezug von מִמֶּנָּה mit „davon“ wieder.
- source_word: יֹאכְלוּ
  choice: sollen … essen
  rationale: Das Imperfekt hat im Gesetzestext vorschreibende Kraft. „Sollen“ drückt diese verbindliche Anweisung in modernem Deutsch angemessen aus.
- source_word: אַהֲרֹן וּבָנָיו
  choice: Aaron und seine Söhne
  rationale: בָּנִים bezeichnet hier Aarons männliche Nachkommen im priesterlichen Dienst; „Söhne“ ist daher genauer als „Kinder“.
- source_word: מַצּוֹת תֵּאָכֵל
  choice: Es soll ungesäuert … gegessen werden
  rationale: מַצּוֹת bezeichnet Ungesäuertes beziehungsweise ungesäuerte Backwaren. Die prädikative Wiedergabe „ungesäuert“ bewahrt den Sinn, ohne eine bestimmte Form wie Brot, Laib oder Kuchen hinzuzufügen; das Passiv von תֵּאָכֵל bleibt erhalten.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: an einem heiligen Ort
  rationale: מָקוֹם steht ohne Artikel. Der unbestimmte Ausdruck wird bewahrt; der folgende Satzteil bestimmt den Ort genauer.
- source_word: בַּחֲצַר
  choice: im Vorhof
  rationale: חָצֵר bezeichnet den umschlossenen Hofbereich der Heiligtumsanlage. „Vorhof“ ist im deutschen biblischen Sprachgebrauch präzise und verständlich.
- source_word: אֹהֶל מוֹעֵד
  choice: Zelt der Begegnung
  rationale: Die Wiedergabe erhält das Bild des Zeltes und den Bedeutungsgehalt von מוֹעֵד, ohne den Ausdruck durch den traditionelleren Begriff „Stiftshütte“ zu ersetzen.
- source_word: יֹאכְלוּהָ
  choice: sollen sie es essen
  rationale: Die abschließende Wiederholung des Essensgebots samt Objektsuffix wird wie im Hebräischen beibehalten und nicht mit dem ersten Satz zusammengezogen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer rechtlicher Soll-Formulierung. Die Wiederholung des Verbs „essen“ und die unbestimmte Form „an einem heiligen Ort“ folgen bewusst der hebräischen Struktur. „Ungesäuert“ vermeidet eine sachlich nicht ausdrücklich genannte Festlegung auf Brot, Kuchen oder Laibe.
