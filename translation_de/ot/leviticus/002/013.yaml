source:
  edition: WLC
  text: וְ/כָל קָרְבַּ֣ן מִנְחָתְ/ךָ֮ בַּ/מֶּ֣לַח תִּמְלָח֒ וְ/לֹ֣א תַשְׁבִּ֗ית מֶ֚לַח בְּרִ֣ית אֱלֹהֶ֔י/ךָ מֵ/עַ֖ל מִנְחָתֶ֑/ךָ עַ֥ל כָּל קָרְבָּנְ/ךָ֖ תַּקְרִ֥יב מֶֽלַח־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/013.yaml
  text: And every offering of your grain offering you shall season with salt[a]. You shall not let the salt of the covenant of your God be lacking from your grain offering[c][b]; with all your offerings you shall offer salt.
translation:
  language: de
  text: Jede Gabe deines Speisopfers sollst du mit Salz salzen[a]. Das Salz des Bundes deines Gottes darfst du bei deinem Speisopfer nicht fehlen lassen[b]. Zu jeder deiner Opfergaben sollst du Salz darbringen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mit Salz sollst du salzen“.'
    reason: Die Fußnote macht die betonte hebräische Wortwiederholung transparent.
  - marker: b
    text: „Das Salz des Bundes deines Gottes“ gibt die hebräische Bundesformel wörtlich wieder; der Vers erläutert ihre symbolische Bedeutung nicht.
    reason: Die kulturell-theologische Wendung soll erklärt, aber nicht im Haupttext ausgedeutet werden.
  - marker: c
    text: 'Oder: „Auf jeder deiner Opfergaben sollst du Salz darbringen.“'
    reason: Die Alternative bewahrt die räumlichere Bedeutung der Präposition עַל.
lexical_decisions:
- source_word: קָרְבַּן
  choice: Gabe / Opfergabe
  rationale: Der Ausdruck bezeichnet allgemein eine Gott dargebrachte Gabe. Im ersten Satz vermeidet „Gabe“ die schwerfällige Häufung „Opfergabe deines Speisopfers“; im letzten Satz macht „Opfergabe“ den kultischen Zusammenhang deutlich.
- source_word: מִנְחָה
  choice: Speisopfer
  rationale: In Levitikus 2 bezeichnet das Wort das aus Getreideerzeugnissen bestehende Opfer. „Speisopfer“ ist im Deutschen verständlich und bewahrt die kultische Besonderheit.
- source_word: בַּמֶּלַח תִּמְלָח
  choice: mit Salz salzen
  rationale: Die bewusst wiederholende hebräische Formulierung verbindet das Substantiv „Salz“ mit dem Verb „salzen“. Die deutsche Wiedergabe bewahrt diese Betonung, obwohl „salzen“ allein idiomatischer wäre.
- source_word: תַשְׁבִּית
  choice: nicht fehlen lassen
  rationale: Der Hifil von שבת bezeichnet hier das Beseitigen, Ausbleibenlassen oder Vorenthalten. „Nicht fehlen lassen“ gibt das Verbot klar wieder, ohne eine bestimmte praktische Handlung hinzuzufügen.
- source_word: מֶלַח בְּרִית אֱלֹהֶיךָ
  choice: das Salz des Bundes deines Gottes
  rationale: Die wörtliche Genitivverbindung erhält das Bundesbild, ohne seine Bedeutung erklärend festzulegen.
- source_word: מֵעַל
  choice: auf ... nicht fehlen lassen
  rationale: מֵעַל bedeutet wörtlich „von auf ... weg“. Zusammen mit „fehlen lassen“ lässt sich die räumliche Beziehung im Deutschen am natürlichsten mit „auf“ ausdrücken.
- source_word: עַל כָּל קָרְבָּנְךָ
  choice: zu jeder deiner Opfergaben
  rationale: Die Präposition עַל kann hier die Verbindung beziehungsweise Begleitung ausdrücken. „Zu“ vermittelt natürlich, dass Salz bei jeder Opfergabe dargebracht werden soll; die räumlichere Alternative „auf“ bleibt in der Fußnote erhalten.
- source_word: תַּקְרִיב
  choice: sollst du ... darbringen
  rationale: Der Hifil von קרב ist ein üblicher Ausdruck für das kultische Darbringen. „Darbringen“ wahrt den Opferkontext und klingt im modernen Standarddeutsch würdig.
theological_decisions:
- issue: Deutung des Ausdrucks „Salz des Bundes“
  choice: Das Bundesbild wird im Haupttext wörtlich als „das Salz des Bundes deines Gottes“ beibehalten.
  alternative: „das Salz, das den Bund deines Gottes versinnbildlicht“ oder „das von deinem Gott für den Bund vorgeschriebene Salz“
  rationale: Der hebräische Text erklärt die Beziehung zwischen Salz und Bund nicht näher. Eine deutende Paraphrase würde die genuine kultische und theologische Offenheit unnötig auflösen.
- issue: Bedeutung der Präposition עַל im letzten Satz
  choice: „Zu jeder deiner Opfergaben“ als begleitende Zuordnung
  alternative: „Auf jeder deiner Opfergaben“ als räumliche Zuordnung
  rationale: Beide Nuancen sind sprachlich möglich. Der Haupttext gibt die allgemeine Verpflichtung natürlich wieder; die Fußnote bewahrt die konkretere räumliche Lesart.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kultischen Begriffe „Speisopfer“, „Opfergabe“ und „darbringen“ bleiben erhalten. Die ungewöhnliche, aber verständliche Wendung „mit Salz salzen“ bildet die hebräische Betonung ab; Fußnoten weisen auf Wörtlichkeit und echte Übersetzungsalternativen hin.
