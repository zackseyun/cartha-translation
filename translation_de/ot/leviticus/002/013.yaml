  terminology: „Speisopfer“, „Opfergabe“ und „darbringen“ halten den kultischen Registerton angemessen. „Salz des Bundes deines Gottes“ bewahrt die hebräische Genitivverbindung und ihre Auslegungsoffenheit. Die Fußnoten sind korrekt verankert; Fußnote c erhält sinnvoll die räumlichere Alternative.
