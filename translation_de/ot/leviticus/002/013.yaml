- from: Jede Gabe deines Speisopfers sollst du mit Salz salzen[a]. Das Salz des Bundes deines Gottes darfst du auf deinem Speisopfer nicht fehlen lassen[b]. Zu jeder deiner Opfergaben sollst du Salz darbringen[c].
  to: Jede Gabe deines Speisopfers sollst du mit Salz salzen[a]. Das Salz des Bundes deines Gottes darfst du bei deinem Speisopfer nicht fehlen lassen[b]. Zu jeder deiner Opfergaben sollst du Salz darbringen[c].
  rationale: Die einzige Änderung ersetzt die im Deutschen unnatürliche Präpositionsverbindung „auf deinem Speisopfer nicht fehlen lassen“ durch „bei deinem Speisopfer nicht fehlen lassen“. Damit bleibt die Anweisung, das Bundessalz beim Speisopfer keinesfalls auszulassen, vollständig erhalten. Die räumlichere Nuance der abschließenden Präposition עַל bleibt, wie bisher, in Fußnote c dokumentiert.
