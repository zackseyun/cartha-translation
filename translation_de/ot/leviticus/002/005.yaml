source:
  edition: WLC
  text: וְ/אִם מִנְחָ֥ה עַל הַֽ/מַּחֲבַ֖ת קָרְבָּנֶ֑/ךָ סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן מַצָּ֥ה תִהְיֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/005.yaml
  text: And if your offering is a grain offering on the griddle[a], it shall be of fine flour mixed with oil, unleavened.
translation:
  language: de
  text: Wenn deine Opfergabe ein auf einer Backplatte zubereitetes Speiseopfer ist, soll es aus Feinmehl bestehen, das mit Öl vermengt und ungesäuert ist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִנְחָה
  choice: Speiseopfer
  rationale: Im Kontext von 3. Mose 2 bezeichnet das Wort eine aus Mehl beziehungsweise Getreide bereitete Opfergabe; „Speiseopfer“ ist dafür im Deutschen verständlich und etabliert.
- source_word: עַל הַמַּחֲבַת
  choice: von der Backplatte
  rationale: Der Ausdruck bezeichnet die Zubereitung auf einer flachen erhitzten Fläche. „Backplatte“ gibt den wahrscheinlichen Gegenstand genauer wieder als das allgemeinere „Pfanne“.
- source_word: קָרְבָּנְךָ
  choice: deine Gabe
  rationale: Das Wort bezeichnet hier die dargebrachte Gabe und steht in enger Beziehung zu „Speiseopfer“. Die Formulierung wahrt die direkte Anrede und vermeidet die schwerfällige Wiederholung von „Opfer“.
- source_word: סֹלֶת
  choice: Feinmehl
  rationale: Gemeint ist hochwertiges, fein gemahlenes Mehl als kultische Zutat; „Feinmehl“ ist präzise und idiomatisch.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: mit Öl vermengt
  rationale: Die Form bezeichnet das Vermischen des Mehls mit Öl, ohne eine bestimmte Zubereitungsmethode wie Kneten zwingend festzulegen.
- source_word: מַצָּה
  choice: ungesäuert
  rationale: Das Adjektiv verlangt hier den ungesäuerten Zustand der Gabe und bezeichnet nicht ausdrücklich ein eigenständiges Brot.
- source_word: תִהְיֶה
  choice: soll sie ... sein
  rationale: Das Imperfekt hat im gesetzlichen Zusammenhang vorschreibende Kraft. „Soll“ gibt diese Anforderung in natürlichem modernem Deutsch wieder.
