  rationale: Die Revision ersetzt die missverständliche deutsche Richtungs- beziehungsweise Herkunftsformulierung „von der Backplatte“ durch eine idiomatische Konstruktion, die das hebräische עַל („auf“) und den Zubereitungsbezug wahrt. Die übrigen kultischen und beschreibenden Angaben bleiben inhaltlich unverändert.
