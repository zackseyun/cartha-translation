id: LEV.2.7
reference: Leviticus 2:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אִם מִנְחַ֥ת מַרְחֶ֖שֶׁת קָרְבָּנֶ֑/ךָ סֹ֥לֶת בַּ/שֶּׁ֖מֶן תֵּעָשֶֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/007.yaml
  text: And if your offering is a grain offering from a pan[a], it shall be made of fine flour with oil.
translation:
  language: de
  text: Und wenn deine Opfergabe ein Speiseopfer aus der Pfanne[a] ist, soll sie aus Feinmehl mit Öl zubereitet werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Backplatte“, „tiefe Pfanne“ oder „Kochpfanne“; welche Art von Gefäß das hebräische Wort genau bezeichnet, ist unsicher.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Und wenn
  rationale: Die Verbindung aus Konjunktion und Bedingungspartikel führt einen weiteren Fall innerhalb der Opferbestimmungen ein; „Und wenn“ bewahrt den fortlaufenden kasuistischen Zusammenhang.
- source_word: מִנְחַת
  choice: Speiseopfer
  rationale: מִנְחָה bezeichnet in 3. Mose 2 das unblutige Opfer aus Getreideerzeugnissen; „Speiseopfer“ ist im deutschen bibelsprachlichen Gebrauch verständlich und sachlich passend.
- source_word: מַרְחֶשֶׁת
  choice: Pfanne
  rationale: Das Wort bezeichnet ein Kochgefäß, dessen genaue Form nicht sicher bestimmbar ist. „Pfanne“ bleibt verständlich, ohne das Gefäß unnötig genau festzulegen.
- source_word: קָרְבָּנְךָ
  choice: deine Opfergabe
  rationale: קָרְבָּן bezeichnet eine Gott dargebrachte Gabe; „Opfergabe“ gibt den kultischen Sinn und das Possessivsuffix natürlich wieder.
- source_word: סֹלֶת
  choice: Feinmehl
  rationale: Der Ausdruck bezeichnet das feine, hochwertige Mehl, das regelmäßig als Bestandteil von Speiseopfern genannt wird.
- source_word: בַּשֶּׁמֶן
  choice: mit Öl
  rationale: Die Präposition bezeichnet hier das bei der Zubereitung verwendete Material beziehungsweise die Begleitung. „Mit Öl“ vermeidet die weitergehende Festlegung auf „mit Öl vermischt“.
- source_word: תֵּעָשֶׂה
  choice: soll sie … zubereitet werden
  rationale: Die passive Verbform gibt eine Vorschrift zur Herstellung des Opfers. „Soll … zubereitet werden“ bewahrt Passiv und Anweisungston und klingt im Deutschen natürlicher als „gemacht werden“.
theological_decisions: []
