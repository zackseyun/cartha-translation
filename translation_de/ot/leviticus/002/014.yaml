base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/014.yaml
  text: And if you present to Yahweh an offering of firstfruits, you shall present your offering of firstfruits as fresh heads of grain roasted in the fire, crushed kernels from the fresh grain.
translation:
  language: de
  text: 'Und wenn du Jahwe ein Speiseopfer aus Erstlingsfrüchten darbringst, sollst du das Speiseopfer deiner Erstlingsfrüchte darbringen: frische, im Feuer geröstete Ähren, grob zerstoßene Körner aus frischem Getreide.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „grüne Ähren, im Feuer geröstet, grob zerkleinertes Getreide von der neuen Ernte“.'
    reason: Die seltene Verbindung אָבִיב קָלוּי בָּאֵשׁ גֶּרֶשׂ כַּרְמֶל lässt bei Reifegrad und Art der Zerkleinerung mehrere nahe Wiedergaben zu.
lexical_decisions:
- source_word: מִנְחַת
  choice: Speiseopfer
  rationale: In Levitikus 2 bezeichnet מִנְחָה das aus pflanzlichen Erzeugnissen bestehende Opfer. „Speiseopfer“ ist im Deutschen kultisch präzise und vermeidet das zu allgemeine „Opfergabe“.
- source_word: בִּכּוּרִים / בִּכּוּרֶיךָ
  choice: Erstlingsfrüchte
  rationale: Der Ausdruck bezeichnet die ersten Erzeugnisse der Ernte, die Gott dargebracht werden; „Erstlingsfrüchte“ bewahrt den kultischen Sinn.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: אָבִיב
  choice: frische Ähren
  rationale: אָבִיב bezeichnet junges beziehungsweise frisches Getreide im Ährenstadium. „Frische Ähren“ gibt das landwirtschaftliche Bild verständlich wieder, ohne den Reifegrad zu eng festzulegen.
- source_word: קָלוּי בָּאֵשׁ
  choice: im Feuer geröstet
  rationale: Die Wendung beschreibt die Zubereitung durch Rösten am beziehungsweise im Feuer; die deutsche Formulierung bleibt konkret und natürlich.
- source_word: גֶּרֶשׂ
  choice: zerriebene Körner
  rationale: Das seltene Wort bezeichnet zerkleinertes oder grob zerstoßenes Getreide. „Zerriebene Körner“ ist anschaulich, ohne eine nicht gesicherte technische Zubereitungsart zu behaupten.
- source_word: כַּרְמֶל
  choice: frisches Getreide
  rationale: In diesem Zusammenhang bezeichnet כַּרְמֶל frisches beziehungsweise junges Erntegut, nicht den Ortsnamen Karmel.
- source_word: תַּקְרִיב ... תַּקְרִיב
  choice: darbringst ... sollst du ... darbringen
  rationale: Die Wiederholung des Hifil von קרב wird bewahrt; „darbringen“ entspricht dem kultischen Vorgang in natürlichem Deutsch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname steht ausdrücklich im Ausgangstext. „Jahwe“ bewahrt seinen Charakter als Gottesname, statt ihn durch einen Titel zu ersetzen.
- issue: Art der מִנְחָה
  choice: Speiseopfer
  alternative: Opfergabe
  rationale: Der Kapitelkontext und die ausdrücklich genannten Getreidebestandteile stützen die konkrete kultische Bezeichnung; dabei wird keine weitergehende theologische Deutung hinzugefügt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kultisch präziser Terminologie. Die syntaktische Wiederholung des hebräischen Verbs wird beibehalten; die lexikalische Unsicherheit der Getreidebegriffe wird in einer Fußnote sichtbar gemacht.
