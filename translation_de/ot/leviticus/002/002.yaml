source:
  edition: WLC
  text: וֶֽ/הֱבִיאָ֗/הּ אֶל בְּנֵ֣י אַהֲרֹן֮ הַ/כֹּהֲנִים֒ וְ/קָמַ֨ץ מִ/שָּׁ֜ם מְלֹ֣א קֻמְצ֗/וֹ מִ/סָּלְתָּ/הּ֙ וּ/מִ/שַּׁמְנָ֔/הּ עַ֖ל כָּל לְבֹנָתָ֑/הּ וְ/הִקְטִ֨יר הַ/כֹּהֵ֜ן אֶת אַזְכָּרָתָ/הּ֙ הַ/מִּזְבֵּ֔חָ/ה אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/002.yaml
  text: He shall bring it to Aaron’s sons[a], the priests, and he shall take from there a handful of its fine flour and some of its oil, with all of its frankincense. Then the priest shall burn its memorial portion on the altar, a food offering, a pleasing aroma to Yahweh.
translation:
  language: de
  text: 'Er soll sie zu den Söhnen Aarons, den Priestern, bringen. Dann soll er dort eine volle Hand von ihrem Feinmehl und ihrem Öl nehmen, dazu ihren gesamten Weihrauch. Der Priester soll ihren Gedenkanteil auf dem Altar in Rauch aufgehen lassen: ein Feueropfer[a], ein wohlgefälliger Duft für Jahwe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: eine Speisegabe. Der priesterliche Fachausdruck אִשֶּׁה wird traditionell auch als „Feueropfer“ oder als „durch Feuer dargebrachtes Opfer“ wiedergegeben.'
    reason: Lexikalische Alternative für den umstrittenen priesterlichen Fachausdruck אִשֶּׁה; die Fußnote wahrt die bestehende Mehrdeutigkeit.
lexical_decisions:
- source_word: וְהֱבִיאָהּ
  choice: Er soll sie bringen
  rationale: Das Hifil von בוא bezeichnet das Herbeibringen der Speisopfergabe; das feminine Pronomen nimmt die Opfergabe aus dem Zusammenhang auf. „Soll“ entspricht dem anweisenden Rechtsstil.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: zu den Söhnen Aarons, den Priestern
  rationale: Die Apposition bewahrt sowohl die familiäre Zuordnung als auch ihre priesterliche Funktion.
- source_word: וְקָמַץ ... מְלֹא קֻמְצוֹ
  choice: Dann soll er dort eine volle Hand ... nehmen
  rationale: קמץ bezeichnet das Nehmen mit der geschlossenen Hand; מְלֹא קֻמְצוֹ spezifiziert die Menge als das volle Fassungsvermögen seiner Hand. „Eine volle Hand“ ist natürlich und genauer als nur „eine Handvoll“.
- source_word: מִסָּלְתָּהּ
  choice: von ihrem Feinmehl
  rationale: סֹלֶת bezeichnet feines, für Opfer verwendetes Mehl; „Feinmehl“ erhält diese kultische Spezifik.
- source_word: וּמִשַּׁמְנָהּ
  choice: und ihrem Öl
  rationale: Die wiederholte Präposition מִן bindet auch das Öl an die mit der Hand entnommene Portion. Im Deutschen genügt die koordinierte Formulierung ohne ein ergänztes, im Hebräischen nicht ausdrücklich stehendes „etwas“.
- source_word: עַל כָּל לְבֹנָתָהּ
  choice: dazu ihren gesamten Weihrauch
  rationale: Die Wendung schließt den ganzen Weihrauch zusätzlich zur entnommenen Mehl- und Ölportion ein.
- source_word: וְהִקְטִיר
  choice: in Rauch aufgehen lassen
  rationale: Das Hifil von קטר ist ein kultischer Fachausdruck für das Verbrennen auf dem Altar, bei dem die Opfergabe als Rauch aufsteigt. Die Formulierung gibt mehr von diesem Ritualsinn wieder als das allgemeine „verbrennen“.
- source_word: אַזְכָּרָתָהּ
  choice: ihren Gedenkanteil
  rationale: Der Ausdruck bezeichnet den repräsentativen Anteil der Gabe, der auf dem Altar verbrannt wird. „Gedenkanteil“ wahrt den Fachbegriff, ohne seine genaue theologische Funktion auszudeuten.
- source_word: הַמִּזְבֵּחָה
  choice: auf dem Altar
  rationale: Die direktionale Endung bezeichnet hier idiomatisch den Altar als Ziel und Ort des Verbrennens.
- source_word: אִשֵּׁה
  choice: Feueropfer
  rationale: Der priesterliche Fachausdruck bezeichnet eine dem Feuer übergebene Opfergabe. „Feueropfer“ ist im Deutschen knapp und wahrt die sichere kultische Bedeutung; die mögliche Speisevorstellung wird in einer Fußnote genannt.
- source_word: רֵיחַ נִיחֹחַ
  choice: von wohltuendem Duft
  rationale: Die feste Opferformel beschreibt den Duft als für Gott angenehm. „Wohltuend“ ist würdig und modern, ohne die Formel zu verflachen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt ihn in der im Deutschen üblichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von אַזְכָּרָה
  choice: Gedenkanteil
  alternative: Erinnerungsopfer
  rationale: Der Text benennt den auf dem Altar verbrannten Anteil, erklärt aber nicht ausdrücklich, wer dadurch woran erinnert wird. „Gedenkanteil“ bewahrt diese Offenheit.
- issue: Wiedergabe von אִשֵּׁה
  choice: Feueropfer
  alternative: Speiseopfer
  rationale: Die Deutung als für Gott bestimmte Speise ist im priesterlichen Opferwortschatz möglich, aber lexikalisch umstritten. „Feueropfer“ bindet die Übersetzung an den klaren Verbrennungskontext und lässt die Alternative in der Fußnote sichtbar.
translation_notes:
  register: Moderner, würdiger Anweisungsstil mit „soll“. Kultische Fachbegriffe wie „Feinmehl“, „Gedenkanteil“ und „Feueropfer“ bleiben erhalten, werden jedoch in natürlicher deutscher Syntax verwendet. Der Wechsel vom nicht ausdrücklich genannten einzelnen Handelnden zu „der Priester“ folgt dem hebräischen Text, ohne die Identität des ersten Singularsubjekts zusätzlich festzulegen.
