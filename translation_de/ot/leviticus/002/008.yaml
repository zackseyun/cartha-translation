base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/008.yaml
  text: And you shall bring the grain offering that is made from these things to Yahweh[a], and he shall present it to the priest, and he shall bring it near to the altar.
translation:
  language: de
  text: Du sollst das Getreideopfer, das aus diesen Dingen zubereitet wird, für Jahwe[a] bringen; es soll dem Priester dargebracht und an den Altar herangebracht werden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu Jahwe“. Die hebräische Präposition kann sowohl die Widmung als auch die Richtung ausdrücken.'
    reason: lexikalische Alternative
  - marker: b
    text: 'Wörtlich: „und er soll es dem Priester darbringen und es an den Altar heranbringen“. Nach der direkten Anrede wechselt der hebräische Text in die 3. Person Singular, ohne den Handelnden ausdrücklich zu nennen.'
    reason: grammatische Mehrdeutigkeit
lexical_decisions:
- source_word: וְהֵבֵאתָ
  choice: Du sollst … bringen
  rationale: Das Hifil Perfekt 2. Person Singular mit וְ hat im gesetzlichen Anweisungsstil auffordernde Bedeutung. „Du sollst“ gibt die persönliche Verpflichtung klar wieder.
- source_word: הַמִּנְחָה
  choice: das Getreideopfer
  rationale: מִנְחָה bezeichnet in Levitikus 2 speziell das aus Getreide bereitete Opfer. „Getreideopfer“ ist für heutige Leser klarer als das missverständliche „Speiseopfer“.
- source_word: אֲשֶׁר יֵעָשֶׂה מֵאֵלֶּה
  choice: das aus diesen Dingen zubereitet wird
  rationale: Das Nifal von עשה ist passiv; מֵאֵלֶּה verweist auf die zuvor genannten Zubereitungen beziehungsweise Bestandteile, ohne sie hier nochmals festzulegen.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: ל kann Richtung oder Bestimmung ausdrücken. Da das Opfer praktisch anschließend zum Priester gebracht wird, bringt „für Jahwe“ hier die Widmung natürlich zum Ausdruck; die Richtungsalternative wird in der Fußnote bewahrt.
- source_word: וְהִקְרִיבָהּ אֶל הַכֹּהֵן
  choice: Dann soll man es zum Priester bringen
  rationale: Das Hifil von קרב bedeutet „heranbringen“ oder „darbringen“. Die unbestimmte Wiedergabe mit „man“ bewahrt den im masoretischen Text nicht ausdrücklich genannten männlichen Handlungsträger, statt ihn stillschweigend mit dem zuvor angeredeten Opfernden gleichzusetzen.
- source_word: וְהִגִּישָׁהּ אֶל הַמִּזְבֵּחַ
  choice: und dieser soll es an den Altar heranbringen
  rationale: Das Hifil von נגשׁ bezeichnet das Heranbringen. „Dieser“ nimmt im Deutschen natürlich den unmittelbar zuvor genannten Priester als Handelnden auf und wahrt die rituelle Abfolge.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm יהוה. „Jahwe“ gibt den persönlichen Bundesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung der Präposition ל vor יהוה
  choice: für Jahwe
  alternative: zu Jahwe
  rationale: Die Präposition kann sowohl Widmung als auch Richtung bezeichnen. „Für Jahwe“ passt zur kultischen Bestimmung des Opfers, während die mögliche Richtungsbedeutung in der Fußnote genannt wird.
- issue: Handlungsträger beim Überbringen an den Priester
  choice: unbestimmtes „man“
  alternative: „er“ oder erneutes „du“
  rationale: Nach der direkten Anrede in der 2. Person steht im masoretischen Text unerwartet eine Form der 3. Person Singular. Die Übersetzung lässt den Handlungsträger daher offen und löst die grammatische Spannung nicht konfessionell oder harmonisierend auf.
translation_notes:
  register: Moderne, würdevolle Standardsprache. „Getreideopfer“ vermeidet die heutige Mehrdeutigkeit von „Speiseopfer“. Die Satzteilung macht den rituellen Ablauf verständlich, während die Fußnoten die Präpositions- und Subjektmehrdeutigkeit des Hebräischen offenhalten.
