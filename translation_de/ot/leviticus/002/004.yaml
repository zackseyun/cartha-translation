  text: וְ/כִ֥י תַקְרִ֛ב קָרְבַּ֥ן מִנְחָ֖ה מַאֲפֵ֣ה תַנּ֑וּר סֹ֣לֶת חַלּ֤וֹת מַצֹּת֙ בְּלוּלֹ֣ת בַּ/שֶּׁ֔מֶן וּ/רְקִיקֵ֥י מַצּ֖וֹת מְשֻׁחִ֥ים בַּ/שָּֽׁמֶן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/004.yaml
  text: 'And if you bring near an offering of a grain offering baked in an oven[a], it shall be of fine flour: unleavened cakes mixed with oil, or unleavened wafers anointed with oil.'
translation:
  language: de
  text: 'Wenn du ein im Ofen gebackenes Getreideopfer darbringst, soll es aus Feinmehl bestehen: ungesäuerte Brote, mit Öl vermengt, oder[a] ungesäuerte Fladen, mit Öl bestrichen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und“. Wahrscheinlich werden hier zwei mögliche Formen des im Ofen gebackenen Getreideopfers genannt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Wenn
  rationale: Die Wendung leitet innerhalb der Opferbestimmungen einen neuen Bedingungsfall ein. Im Deutschen gibt „Wenn“ die rechtlich-prozedurale Funktion natürlich wieder; der Anschluss an den vorherigen Abschnitt ergibt sich aus dem Zusammenhang.
- source_word: תַקְרִב קָרְבַּן
  choice: du … darbringst
  rationale: Das Hifil von קרב bezeichnet das Heranbringen beziehungsweise Präsentieren einer Opfergabe. „Darbringen“ gibt diese kultische Handlung im Deutschen prägnant und idiomatisch wieder, ohne die im Deutschen schwerfällige Doppelung „eine Opfergabe heranbringen“.
- source_word: מִנְחָה
  choice: Getreideopfer
  rationale: Im Kontext von Levitikus 2 bezeichnet מִנְחָה die aus Mehl beziehungsweise Getreide zubereitete Opferkategorie. „Getreideopfer“ ist für heutige Leser verständlicher und sachlich eindeutiger als das traditionelle „Speisopfer“.
- source_word: מַאֲפֵה תַנּוּר
  choice: das im Ofen gebacken wurde
  rationale: Die Konstruktverbindung bezeichnet ein im Ofen hergestelltes Backwerk. Die Relativkonstruktion ist natürliches modernes Deutsch und bewahrt die Zubereitungsart.
- source_word: סֹלֶת
  choice: Feinmehl
  rationale: Gemeint ist hochwertiges, fein gemahlenes Mehl für Opfergaben. „Feinmehl“ ist knapp, verständlich und im kultischen Zusammenhang präzise.
- source_word: חַלּוֹת מַצּוֹת
  choice: ungesäuerte Kuchen
  rationale: חַלּוֹת bezeichnet hier geformte, kuchen- oder brotartige Backstücke; מַצּוֹת kennzeichnet sie als ungesäuert. „Kuchen“ unterscheidet diese Form von den nachfolgend genannten dünnen Fladen.
- source_word: בְּלוּלֹת בַּשֶּׁמֶן
  choice: mit Öl vermengt
  rationale: Das passive Partizip von בלל bezeichnet das Vermischen beziehungsweise Durchmengen mit Öl. „Vermengt“ gibt diesen Herstellungsschritt präzise wieder.
- source_word: וּרְקִיקֵי מַצּוֹת
  choice: oder ungesäuerte Fladen
  rationale: רְקִיקִים sind dünne Backstücke beziehungsweise Fladen. Das hebräische ו ist formal „und“, verbindet hier aber wahrscheinlich zwei zulässige Zubereitungsformen; „oder“ macht diese Alternativbeziehung im Deutschen deutlich, während die formale Lesart in der Fußnote erhalten bleibt.
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: mit Öl bestrichen
  rationale: Das passive Partizip von משׁח kann „gesalbt“ oder „bestrichen“ bedeuten. Bei Backwerk bezeichnet es konkret das Auftragen von Öl; „bestrichen“ vermeidet eine irreführende Beschränkung auf zeremonielle Salbung.
theological_decisions:
- issue: Wiedergabe von מִנְחָה als kultischer Opferkategorie
  choice: Getreideopfer
  alternative: Speisopfer; Gabenopfer
  rationale: Obwohl מִנְחָה außerhalb dieses Zusammenhangs auch Gabe oder Tribut bedeuten kann, beschreibt Levitikus 2 eine aus Mehl, Öl und Backwaren bestehende Opferkategorie. „Getreideopfer“ wahrt diese kultische Besonderheit, ohne zusätzliche konfessionelle Deutung einzutragen.
- issue: Verhältnis der beiden Formen von Ofengebäck
  choice: oder
  alternative: und
  rationale: Das hebräische ו bedeutet formal „und“, kann in einer Aufzählung zulässiger Fälle jedoch Alternativen verbinden. Der Haupttext gibt die wahrscheinlich gemeinte Wahlmöglichkeit wieder; die Fußnote bewahrt die formale Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlicher kultischer Terminologie. Die Satzstruktur folgt dem hebräischen Bedingungsfall, vermeidet jedoch unnatürliche Wortwiederholungen. Die Mehrdeutigkeit der Konjunktion ו wird durch eine Fußnote offengehalten.
