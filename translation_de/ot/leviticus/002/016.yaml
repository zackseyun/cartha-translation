  text: וְ/הִקְטִ֨יר הַ/כֹּהֵ֜ן אֶת אַזְכָּרָתָ֗/הּ מִ/גִּרְשָׂ/הּ֙ וּ/מִ/שַּׁמְנָ֔/הּ עַ֖ל כָּל לְבֹנָתָ֑/הּ אִשֶּׁ֖ה לַ/יהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/016.yaml
  text: And the priest shall burn its memorial portion from its crushed grain and from its oil[a], with all its frankincense—an offering made by fire to Yahweh.
translation:
  language: de
  text: 'Und der Priester soll den Gedenkanteil davon in Rauch aufgehen lassen: etwas von ihren zerstoßenen Körnern und von ihrem Öl[a], zusammen mit ihrem ganzen Weihrauch – ein Feueropfer für Jahwe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von ihren zerstoßenen Körnern und von ihrem Öl“. Gemeint ist, dass der Gedenkanteil daraus genommen wird.'
    reason: Die knappe hebräische Konstruktion mit מן kann im Deutschen missverstanden werden; die Fußnote bewahrt ihre formale Gestalt und erklärt den partitiven Sinn.
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: soll … in Rauch aufgehen lassen
  rationale: Der Hifil von קטר bezeichnet im Opferkontext das Verbrennen auf dem Altar, wobei die Gabe als Rauch aufsteigt. Diese Wiedergabe bewahrt das kultische Bild und klingt im Deutschen natürlich.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Die übliche und sachlich genaue Wiedergabe von כהן in kultischen Vorschriften.
- source_word: אַזְכָּרָתָהּ
  choice: den als Gedenkportion bestimmten Teil davon
  rationale: אזכרה ist ein kultischer Fachausdruck für den repräsentativen Teil des Speiseopfers, der auf dem Altar verbrannt wird. Die Formulierung macht deutlich, dass ein bestimmter Anteil gemeint ist, ohne den möglichen Erinnerungs- beziehungsweise Gedenkaspekt aufzulösen.
- source_word: מִגִּרְשָׂהּ
  choice: etwas von den zerstoßenen Körnern
  rationale: גרש bezeichnet zerstoßene oder grob zerkleinerte Getreidekörner. „Zerstoßene Körner“ ist verständlich und passt zur Zubereitung dieses Erstlings-Speiseopfers.
- source_word: וּמִשַּׁמְנָהּ
  choice: und von dem Öl
  rationale: Die Präposition מן kennzeichnet, woraus die Gedenkportion genommen wird. Die deutsche Formulierung folgt dieser Struktur, ohne eine im Hebräischen nicht ausdrücklich genannte Menge festzulegen.
- source_word: עַל כָּל לְבֹנָתָהּ
  choice: zusammen mit dem ganzen Weihrauch
  rationale: 'על bezeichnet hier am besten die begleitende Darbringung: Die Gedenkportion wird gemeinsam mit dem gesamten Weihrauch verbrannt.'
- source_word: אִשֶּׁה
  choice: ein Feueropfer
  rationale: אשה ist ein kultischer Ausdruck für eine durch Feuer dargebrachte Opfergabe. „Feueropfer“ ist knapp, verständlich und vermeidet die möglicherweise irreführende Wiedergabe „Speisegabe“.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Das ל kennzeichnet Widmung beziehungsweise Bestimmung der Opfergabe. „Für Jahwe“ ist im Deutschen idiomatisch und bewahrt den im Ausgangstext verwendeten Gottesnamen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von אַזְכָּרָה
  choice: als Gedenkportion bestimmter Teil
  alternative: Erinnerungsopfer; Gedächtnisteil
  rationale: Der Ausdruck wird als kultischer Fachbegriff wiedergegeben, ohne abschließend zu bestimmen, ob der Gedenkaspekt primär Erinnerung vor Gott, Erinnerung der Opfernden oder eine andere kultische Funktion bezeichnet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kultischer Präzision. Der Satzbau wurde für gute Verständlichkeit leicht entfaltet; der Gedankenstrich kennzeichnet die abschließende Einordnung als Feueropfer. Der Gottesname wird als „Jahwe“ wiedergegeben.
