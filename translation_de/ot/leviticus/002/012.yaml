source:
  edition: WLC
  text: קָרְבַּ֥ן רֵאשִׁ֛ית תַּקְרִ֥יבוּ אֹתָ֖/ם לַ/יהוָ֑ה וְ/אֶל הַ/מִּזְבֵּ֥חַ לֹא יַעֲל֖וּ לְ/רֵ֥יחַ נִיחֹֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/012.yaml
  text: As an offering of firstfruits you may present them to Yahweh[b][a], but they must not go up on the altar as a pleasing aroma.
translation:
  language: de
  text: Als Erstlingsgabe dürft ihr sie Jahwe darbringen; auf den Altar aber dürfen sie nicht hinaufgebracht werden, um einen wohlgefälligen Duft zu verbreiten[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Zum Altar sollen sie nicht hinaufsteigen zu einem wohlgefälligen Duft.“ Die Formulierung bezeichnet die Darbringung auf dem Altar, deren Duft als wohlgefällig gilt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבַּן רֵאשִׁית
  choice: als Erstlingsgabe
  rationale: Die Wendung bezeichnet eine Gabe aus dem ersten Ertrag. „Erstlingsgabe“ gibt die kultische Bedeutung knapp und idiomatisch wieder, ohne die Verbindung der beiden hebräischen Substantive unnötig auszudeuten.
- source_word: תַּקְרִיבוּ
  choice: dürft ihr … darbringen
  rationale: 'Das Hifil von קרב bezeichnet im Opferkontext das Heranbringen beziehungsweise Darbringen einer Gabe. Der Zusammenhang erlaubt hier eine permissive Wiedergabe: Diese Stoffe dürfen Jahwe als Erstlingsgabe dargebracht, nur nicht auf dem Altar verbrannt werden.'
- source_word: אֹתָם
  choice: sie
  rationale: Das maskuline Pluralpronomen verweist auf die im vorigen Vers genannten Stoffe, Sauerteig und Honig.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, um den im hebräischen Text ausdrücklich verwendeten Eigennamen zu bewahren.
- source_word: וְאֶל־הַמִּזְבֵּחַ לֹא יַעֲלוּ
  choice: doch auf dem Altar dürfen sie nicht … dargebracht werden
  rationale: Wörtlich heißt es, dass sie nicht zum Altar „hinaufsteigen“ sollen. Im Opferzusammenhang bezeichnet dies das Hinaufbringen und Verbrennen auf dem Altar; die gewählte Formulierung vermittelt diesen kultischen Sinn in natürlichem Deutsch.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: als wohlgefälliger Duft
  rationale: Die feste Opferformel beschreibt den Duft eines von Gott angenommenen Opfers. „Wohlgefälliger Duft“ erhält sowohl das konkrete Bild als auch den Gedanken des Wohlgefallens.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet den Tetragrammaton als Gottes Eigennamen. „Jahwe“ bildet ihn in einer im Deutschen gebräuchlichen wissenschaftlichen Form ab, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung des Aufsteigens zum Altar
  choice: kultisch als Darbringung auf dem Altar wiedergegeben
  alternative: 'wörtlich: „sie dürfen nicht zum Altar hinaufsteigen“'
  rationale: Das Bild des Aufsteigens kann hier das Hinaufbringen beziehungsweise den aufsteigenden Rauch der Opferhandlung bezeichnen. Die Hauptübersetzung macht die kultische Funktion verständlich; die Fußnote bewahrt den konkreten Wortlaut und dessen Bildhaftigkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Erstlingsgabe“ und „wohlgefälliger Duft“ bewahren die kultische Ausdrucksweise, bleiben aber für heutige Leser verständlich. Die Satzstellung folgt weitgehend dem hebräischen Kontrast zwischen erlaubter Darbringung an Jahwe und untersagter Darbringung auf dem Altar.
