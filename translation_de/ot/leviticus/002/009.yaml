    rationale: »Gedenkanteil« ist die natürlichere moderne deutsche Bezeichnung für den verbrannten repräsentativen Anteil (אַזְכָּרָה), ohne dessen rituelle Funktion weiter auszudeuten.
  - severity: low
    issue: Die Fußnote zu »Feueropfer« ist begrifflich missverständlich.
    rationale: »Speisegabe« kann im Deutschen als Synonym von »Speiseopfer« verstanden werden und damit die Unterscheidung zu מִנְחָה verwischen. Die Unsicherheit betrifft die genaue Erklärung von אִשֵּׁה, nicht die Opferhandlung als solche.
