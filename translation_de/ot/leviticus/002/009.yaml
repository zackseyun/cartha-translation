  text: וְ/הֵרִ֨ים הַ/כֹּהֵ֤ן מִן הַ/מִּנְחָה֙ אֶת אַזְכָּ֣רָתָ֔/הּ וְ/הִקְטִ֖יר הַ/מִּזְבֵּ֑חָ/ה אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/009.yaml
  text: Then the priest shall lift up from the grain offering its memorial portion and burn it on the altar[a], a food offering, a pleasing aroma to Yahweh.
translation:
  language: de
  text: 'Dann hebt der Priester vom Speiseopfer dessen Gedenkanteil ab und lässt ihn auf dem Altar in Rauch aufgehen: ein Feueropfer[a], ein wohlgefälliger Duft für den HERRN.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Herleitung des hebräischen Ausdrucks ist unsicher. Traditionell wird er als »Feueropfer« wiedergegeben; möglicherweise bezeichnet er eine durch Feuer dargebrachte Opfergabe.
    reason: lexikalische Alternative
lexical_decisions:
- source_word: וְהֵרִים
  choice: hebt … ab
  rationale: Die Hifil-Form bezeichnet hier das Herausnehmen beziehungsweise Abheben eines Anteils. »Hebt … ab« bewahrt sowohl die konkrete Ritualhandlung als auch den Gedanken der Absonderung.
- source_word: מִן הַמִּנְחָה
  choice: vom Speiseopfer
  rationale: מִנְחָה bezeichnet in Levitikus 2 das aus Getreide zubereitete Opfer. »Speiseopfer« ist im Deutschen verständlich und als kultischer Fachausdruck etabliert.
- source_word: אַזְכָּרָתָהּ
  choice: dessen Erinnerungsanteil
  rationale: Der Ausdruck bezeichnet den repräsentativen Teil des Opfers, der auf dem Altar verbrannt wird. »Erinnerungsanteil« macht deutlich, dass nur ein Teil gemeint ist, ohne die genaue theologische Funktion näher festzulegen.
- source_word: וְהִקְטִיר
  choice: lässt ihn … in Rauch aufgehen
  rationale: Die kultische Hifil-Form von קטר meint das Verbrennen auf dem Altar mit dem Ergebnis aufsteigenden Rauchs. Diese Wiedergabe ist genauer als das allgemeinere »verbrennt ihn«.
- source_word: הַמִּזְבֵּחָה
  choice: auf dem Altar
  rationale: Die gerichtete Form wird in diesem kultischen Zusammenhang im Deutschen idiomatisch als Vollzug »auf dem Altar« wiedergegeben.
- source_word: אִשֵּׁה
  choice: Feueropfer
  rationale: Die traditionelle und lexikalisch naheliegende Wiedergabe wahrt den Bezug zur Darbringung im Feuer. Da auch eine Deutung als Speisegabe vertreten wird, wird diese in der Fußnote erhalten.
- source_word: רֵיחַ נִיחֹחַ
  choice: ein wohlgefälliger Duft
  rationale: Die feste Opferformel beschreibt den Duft als für Gott annehmbar beziehungsweise erfreulich. »Wohlgefällig« bewahrt die Annahme-Motivik und die bildhafte Sprache.
- source_word: לַיהוָה
  choice: für den HERRN
  rationale: Der Gottesname יהוה wird nach verbreiteter deutscher Bibelkonvention ehrfürchtig als »der HERR« wiedergegeben; die Formulierung mit »für« passt zum dargebrachten Opfer und seinem Duft.
theological_decisions:
- issue: Bedeutung der Opferformel אִשֵּׁה רֵיחַ נִיחֹחַ
  choice: ein Feueropfer, ein wohlgefälliger Duft für den HERRN
  alternative: eine Speisegabe, ein wohlgefälliger Duft für den HERRN
  rationale: »Feueropfer« hält die Art der Darbringung im Vordergrund und vermeidet die Festlegung, dass Gott im wörtlichen Sinn Nahrung erhält. Die mögliche kultische Bedeutung »Speisegabe« bleibt wegen der lexikalischen Unsicherheit in der Fußnote sichtbar.
- issue: Funktion von אַזְכָּרָה
  choice: Erinnerungsanteil
  alternative: Gedenkanteil
  rationale: Die Übersetzung benennt die rituelle Teilportion, legt aber nicht fest, ob sie Gott an den Opfernden, den Opfernden an Gott oder allgemein an das Opfer erinnern soll.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer kultischer Terminologie. »Lässt … in Rauch aufgehen« gibt die konkrete Opferhandlung anschaulich wieder; »Erinnerungsanteil« erhält die im Hebräischen offene Funktion des Ritualbegriffs.
