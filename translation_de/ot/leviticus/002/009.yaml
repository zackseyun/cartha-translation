- from: 'Dann hebt der Priester vom Speiseopfer dessen Erinnerungsanteil ab und lässt ihn auf dem Altar in Rauch aufgehen: ein Feueropfer[a], ein wohlgefälliger Duft für den HERRN.'
  to: 'Dann hebt der Priester vom Speiseopfer dessen Gedenkanteil ab und lässt ihn auf dem Altar in Rauch aufgehen: ein Feueropfer[a], ein wohlgefälliger Duft für den HERRN.'
  rationale: Die Revision ersetzt allein das unnatürliche »Erinnerungsanteil« durch das im Deutschen geläufigere »Gedenkanteil« und präzisiert die Fußnote zu אִשֵּׁה. Der Text bleibt in Aussage, Register und kultischer Bildsprache eng am Hebräischen und bewahrt die lexikalische Unsicherheit, ohne eine umstrittene Deutung festzuschreiben.
