source:
  edition: WLC
  text: וְ/נֶ֗פֶשׁ כִּֽי תַקְרִ֞יב קָרְבַּ֤ן מִנְחָה֙ לַֽ/יהוָ֔ה סֹ֖לֶת יִהְיֶ֣ה קָרְבָּנ֑/וֹ וְ/יָצַ֤ק עָלֶ֨י/הָ֙ שֶׁ֔מֶן וְ/נָתַ֥ן עָלֶ֖י/הָ לְבֹנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/001.yaml
  text: When a person presents a grain offering to Yahweh[a], his offering shall be of fine flour[b], and he shall pour oil on it and put frankincense on it.
translation:
  language: de
  text: Wenn jemand[a] Jahwe ein Speiseopfer darbringt, soll seine Opfergabe aus Feinmehl bestehen. Er soll Öl darauf gießen und Weihrauch darauflegen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »eine Seele«; das hebräische Wort bezeichnet hier einen einzelnen Menschen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: jemand
  rationale: Wörtlich »Seele/Lebewesen«, bezeichnet das Wort in diesem kultrechtlichen Zusammenhang jedoch eine einzelne Person. »Jemand« gibt den unbestimmten repräsentativen Singular natürlich wieder.
- source_word: תַקְרִיב קָרְבַּן
  choice: eine Opfergabe darbringt
  rationale: Der Hifil von קרב bezeichnet das Heranbringen bzw. Darbringen einer Gabe; קָרְבָּן ist die dargebrachte Opfergabe. Die Formulierung bewahrt den kultischen Sinn ohne unnötige Fachsprache.
- source_word: מִנְחָה
  choice: Speiseopfer
  rationale: Im levitischen Opferkontext ist damit die unblutige, aus pflanzlichen Erzeugnissen bestehende Opfergabe gemeint. »Speiseopfer« ist im Deutschen verständlich und kultisch präziser als das zu enge »Getreideopfer«, da hier Feinmehl genannt wird.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname יהוה wird als »Jahwe« wiedergegeben; die Präposition ל wird durch den Dativ nach »darbringen« ausgedrückt.
- source_word: סֹלֶת
  choice: Feinmehl
  rationale: Das Wort bezeichnet hochwertiges, fein gemahlenes Mehl für die Opfergabe.
- source_word: יִהְיֶה קָרְבָּנוֹ
  choice: soll seine Opfergabe ... bestehen
  rationale: Die Vorschrift bestimmt die Beschaffenheit der Gabe. Das Possessivpronomen erhält den hebräischen Singular, während »soll ... bestehen« natürliches modernes Rechts- und Anweisungsdeutsch ist.
- source_word: וְיָצַק עָלֶיהָ שֶׁמֶן
  choice: Er soll Öl darauf gießen
  rationale: Die Verbform hat im gesetzlichen Zusammenhang anweisende Kraft. Das feminine Suffix verweist auf die Opfergabe.
- source_word: וְנָתַן עָלֶיהָ לְבֹנָה
  choice: und Weihrauch darauflegen
  rationale: לְבֹנָה bezeichnet das im Kult verwendete aromatische Harz. »Weihrauch« ist die geläufige deutsche Bezeichnung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname steht ausdrücklich im Ausgangstext. »Jahwe« wahrt seinen Charakter als Gottes persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Generisches Geschlecht im kultrechtlichen Singular
  choice: Wenn jemand ... seine Opfergabe ... Er soll
  alternative: Wenn eine Person ... ihre Opfergabe ... Sie soll
  rationale: נֶפֶשׁ ist grammatisch feminin, doch die anschließende Form קָרְבָּנוֹ trägt ein maskulines Suffix und der Rechtssatz bezieht sich allgemein auf eine Einzelperson. »Jemand« macht die allgemeine Geltung deutlich; die anschließenden maskulinen Formen bewahren den grammatischen Verlauf des Hebräischen, ohne die Vorschrift auf Männer zu beschränken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper kultrechtlicher Syntax. »Speiseopfer« wird als etablierter deutscher Kultbegriff verwendet; die konkrete Beschaffenheit als Feinmehl erklärt der Vers selbst. Der Gottesname erscheint als »Jahwe«.
