  naturalness: „Was aber … übrig bleibt“ und „soll … gehören“ sind natürliches, würdiges modernes Standarddeutsch. Die überarbeitete Fassung vermeidet die etwas unklare Verbindung „hochheilig unter den …“ und bleibt flüssig.
