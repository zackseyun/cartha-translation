source:
  edition: WLC
  text: וְ/הַ/נּוֹתֶ֨רֶת֙ מִן הַ/מִּנְחָ֔ה לְ/אַהֲרֹ֖ן וּ/לְ/בָנָ֑י/ו קֹ֥דֶשׁ קָֽדָשִׁ֖ים מֵ/אִשֵּׁ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/010.yaml
  text: And what remains of the grain offering shall be for Aaron and for his sons[a], most holy from the food offerings of Yahweh.
translation:
  language: de
  text: Was aber vom Speiseopfer übrig bleibt, soll Aaron und seinen Söhnen gehören. Es ist hochheilig, von den Feueropfern Jahwes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hochheilig aus den Feueropfern Jahwes“.'
    reason: Die Präposition מִן kann die Zugehörigkeit zu einem Bereich oder eine Herkunfts-/Entnahmenuance ausdrücken.
lexical_decisions:
- source_word: וְהַנּוֹתֶרֶת
  choice: Was aber … übrig bleibt
  rationale: Das substantivierte Partizip bezeichnet den verbleibenden Anteil; die Formulierung ist im Deutschen natürlich und bewahrt den Bezug auf den Rest.
- source_word: מִן הַמִּנְחָה
  choice: vom Speiseopfer
  rationale: מִנְחָה bezeichnet in Levitikus 2 das aus Getreide bereitete Opfer. „Speiseopfer“ ist die etablierte, verständliche deutsche Kultbezeichnung.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: soll Aaron und seinen Söhnen gehören
  rationale: Die Präposition לְ kennzeichnet hier Zuweisung beziehungsweise Besitz; „soll … gehören“ gibt den rechtlich-vorschreibenden Sinn wieder.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: hochheilig
  rationale: Die hebräische Steigerungsform bezeichnet den höchsten Heiligkeitsgrad. „Hochheilig“ gibt dies knapp wieder, ohne den im Hebräischen nicht ausdrücklich vorhandenen Begriff „Anteil“ einzufügen.
- source_word: מֵאִשֵּׁי
  choice: unter den Feueropfern
  rationale: אִשֶּׁה bezeichnet im priesterlichen Opferwortschatz eine für Gott bestimmte Opfergabe, die mit dem Feuer verbunden ist. „Feueropfer“ wahrt diese kultische Bedeutung; die Präposition מן kann hier partitiv verstanden werden.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben statt durch einen Titel ersetzt.
theological_decisions:
- issue: Bezug und Sinn von מֵאִשֵּׁי יְהוָה
  choice: unter den Feueropfern für Jahwe
  alternative: von den Feueropfern Jahwes
  rationale: Die Formulierung lässt den Rest des Speiseopfers als hochheiligen Anteil innerhalb der für Jahwe bestimmten Feueropfer erkennen. Zugleich wird die mögliche Herkunftsnuance von מן in der Fußnote bewahrt.
- issue: Wiedergabe des Tetragramms
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה; seine Wiedergabe als „Jahwe“ bewahrt den Charakter als Gottesname.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der kultische Fachausdruck „Speiseopfer“ bleibt erhalten; „hochheilig“ bildet die hebräische Superlativwendung knapp ab. Der Fußnotenmarker steht unmittelbar nach dem betreffenden Satz.
