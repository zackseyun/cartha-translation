  yaml_path: translation/ot/leviticus/002/006.yaml
  text: Break it into pieces and pour oil on it[a]; it is a grain offering.
translation:
  language: de
  text: Brich es in Stücke und gieß Öl darauf; es ist ein Speisopfer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פָּת֤וֹת אֹתָ/הּ֙ פִּתִּ֔ים
  choice: Brich es in Stücke
  rationale: Der Infinitivus absolutus von פתת hat hier auffordernde Funktion; das verwandte Substantiv פִּתִּים bezeichnet die durch das Brechen entstehenden Stücke. Die deutsche Formulierung gibt Handlung und Ergebnis natürlich wieder.
- source_word: וְ/יָצַקְתָּ֥
  choice: und gieß
  rationale: Die Verbform führt die kultische Handlungsanweisung fort. Der deutsche Imperativ bewahrt den direktiven Charakter und den Ablauf.
- source_word: עָלֶ֖י/הָ שָׁ֑מֶן
  choice: Öl darüber
  rationale: עַל bezeichnet das Aufbringen des Öls auf das zuvor genannte Opfer. „Darüber“ ist im Deutschen idiomatisch und lässt das Öl unbestimmt, wie im Hebräischen.
- source_word: מִנְחָ֖ה
  choice: Speisopfer
  rationale: Im kultischen Zusammenhang von Levitikus 2 bezeichnet מִנְחָה ein aus pflanzlichen Erzeugnissen bereitetes Opfer. „Speisopfer“ ist eine etablierte, knappe deutsche Wiedergabe, ohne das ausdrücklich nicht genannte Wort „Getreide“ in den Vers einzufügen.
- source_word: הִֽוא
  choice: es ist
  rationale: Das selbstständige Pronomen identifiziert das beschriebene Opfer; das grammatische Femininum wird im Deutschen entsprechend dem sächlichen „Opfer“ natürlich mit „es“ wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper kultischer Anweisung. „Speisopfer“ hält den Fachbegriff im Kontext von Levitikus 2 erkennbar; die Satzstruktur folgt dem hebräischen Handlungsablauf.
