source:
  edition: WLC
  text: כָּל הַ/מִּנְחָ֗ה אֲשֶׁ֤ר תַּקְרִ֨יבוּ֙ לַ/יהוָ֔ה לֹ֥א תֵעָשֶׂ֖ה חָמֵ֑ץ כִּ֤י כָל שְׂאֹר֙ וְ/כָל דְּבַ֔שׁ לֹֽא תַקְטִ֧ירוּ מִמֶּ֛/נּוּ אִשֶּׁ֖ה לַֽ/יהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/011.yaml
  text: Every grain offering that you present to Yahweh shall not be made with leaven[b][a], for you shall not burn any leaven or any honey from it as a food offering to Yahweh.
translation:
  language: de
  text: Kein Speiseopfer, das ihr Jahwe darbringt, darf mit Sauerteig zubereitet werden; denn davon dürft ihr weder Sauerteig noch Honig[a] als Feueropfer[b] für Jahwe in Rauch aufgehen lassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Honig“ kann im antiken Sprachgebrauch neben Bienenhonig auch eingedickten Fruchtsaft bezeichnen.
    reason: cultural_note
  - marker: b
    text: 'Oder: „als ein durch Feuer dargebrachtes Opfer“. Gemeint ist eine Opfergabe, die auf dem Altar verbrannt wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּנְחָה
  choice: Speiseopfer
  rationale: In 3. Mose 2 bezeichnet מִנְחָה das aus Mehl beziehungsweise Getreide bereitete Opfer; „Speiseopfer“ ist dafür der etablierte deutsche Kultbegriff.
- source_word: תַּקְרִיבוּ
  choice: darbringt
  rationale: Der Hifil von קרב bezeichnet im Opferkontext das Heranbringen beziehungsweise Darbringen eines Opfers.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: תֵעָשֶׂה חָמֵץ
  choice: darf mit Sauerteig zubereitet werden
  rationale: Die passive Form von עשה zusammen mit חָמֵץ verbietet, das Speiseopfer gesäuert zuzubereiten; die deutsche Formulierung ist natürlich und wahrt den verpflichtenden Charakter.
- source_word: חָמֵץ / שְׂאֹר
  choice: Sauerteig
  rationale: Beide Wörter gehören hier zum Bedeutungsfeld des Gär- beziehungsweise Säuerungsmittels. „Sauerteig“ ist im kultischen Zusammenhang genauer als modernes „Hefe“.
- source_word: דְּבַשׁ
  choice: Honig
  rationale: „Honig“ ist die unmittelbare Wiedergabe; der mögliche Einschluss von eingedicktem Fruchtsaft wird in einer Fußnote kenntlich gemacht.
- source_word: לֹא תַקְטִירוּ
  choice: dürft ihr ... auf dem Altar in Rauch aufgehen lassen
  rationale: Der Hifil von קטר bezeichnet das kultische Verbrennen auf dem Altar, bei dem die Gabe als Rauch aufsteigt.
- source_word: מִמֶּנּוּ
  choice: nicht eigens wiedergegeben
  rationale: Das singuläre Pronomen kann sich auf den Opferstoff beziehungsweise die Opfergabe beziehen. Im Deutschen ist sein Bezug nach „weder Sauerteig noch Honig“ schwer natürlich abzubilden; das Verbot bleibt ohne explizites Pronomen vollständig erhalten.
- source_word: אִשֶּׁה
  choice: Feueropfer
  rationale: Der technische Ausdruck bezeichnet eine auf dem Altar verbrannte Gabe. „Feueropfer“ bewahrt den kultischen Bezug; eine allgemeinere Alternative steht in der Fußnote.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich; die Transliteration bewahrt diese Eigennamefunktion.
- issue: Kultischer Ausdruck אִשֶּׁה
  choice: Feueropfer
  alternative: durch Feuer dargebrachtes Opfer
  rationale: „Feueropfer“ ist knapp, verständlich und lässt die genaue kultische Kategorie stehen, ohne sie als gewöhnliche Nahrung für Gott zu deuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der etablierte Begriff „Speiseopfer“ hält den Zusammenhang von 3. Mose 2 fest. „Auf dem Altar in Rauch aufgehen lassen“ verdeutlicht die konkrete kultische Handlung, ohne die technische Bezeichnung „Feueropfer“ preiszugeben.
