base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/015.yaml
  text: And you shall put oil on it[a], and place frankincense on it; it is a grain offering.
translation:
  language: de
  text: Gib Öl darauf und lege Weihrauch darauf; es ist ein Getreideopfer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: Gib
  rationale: נתן bedeutet allgemein »geben, tun, legen«. In Verbindung mit Öl und עַל gibt »Gib Öl darauf« die konkrete rituelle Anwendung natürlich wieder und bewahrt zugleich die Eigenart des hebräischen Verbs.
- source_word: עָלֶיהָ
  choice: darauf
  rationale: עַל mit Suffix bezeichnet hier das Aufbringen auf die zuvor genannte Opfergabe; »darauf« ist knappes, natürliches Standarddeutsch.
- source_word: שֶׁמֶן
  choice: Öl
  rationale: Der hebräische Text nennt allgemein Öl. Obwohl im Opferkontext Olivenöl gemeint sein dürfte, wird »Oliven-« nicht ausdrücklich ergänzt.
- source_word: וְשַׂמְתָּ
  choice: und lege
  rationale: שׂים bedeutet »legen, setzen, anbringen«. »Lege« bezeichnet die bewusste Platzierung und unterscheidet das Verb angemessen vom vorangehenden נתן.
- source_word: לְבֹנָה
  choice: Weihrauch
  rationale: לְבֹנָה bezeichnet spezifisch Weihrauch und nicht Räucherwerk im Allgemeinen.
- source_word: מִנְחָה
  choice: Speisopfer
  rationale: מִנְחָה bezeichnet in der levitischen Opferordnung das unblutige Opfer aus Getreide. »Speisopfer« ist der etablierte, prägnante deutsche Fachausdruck; »Getreideopfer« wäre transparenter, aber enger, da die Opfergabe auch Öl und Weihrauch umfasst.
- source_word: הִוא
  choice: es ist
  rationale: Das feminine Pronomen nimmt die zuvor beschriebene Opfergabe auf. Die schlichte Identifikation »es ist ein Speisopfer« bewahrt die Struktur des Hebräischen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper ritueller Anweisungsform. Der Wechsel zwischen »gib« und »lege« bildet die beiden verschiedenen hebräischen Verben ab. Der Fußnotenmarker steht unmittelbar nach dem Satz, auf den sich die Anmerkung bezieht.
