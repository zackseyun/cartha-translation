  text: וְ/הַ/נּוֹתֶ֨רֶת֙ מִן הַ/מִּנְחָ֔ה לְ/אַהֲרֹ֖ן וּ/לְ/בָנָ֑י/ו קֹ֥דֶשׁ קָֽדָשִׁ֖ים מֵ/אִשֵּׁ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/003.yaml
  text: And what is left of the grain offering shall be for Aaron and for his sons[a], a most holy portion from the food offerings of Yahweh.
translation:
  language: de
  text: 'Was aber vom Speiseopfer übrig bleibt, ist für Aaron und seine Söhne bestimmt: Es ist ein hochheiliger Anteil von den Feueropfern Jahwes.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von den Opfergaben für Jahwe, die im Feuer dargebracht werden“; der hebräische Ausdruck ist ein technischer Opferbegriff und kann auch im Sinn von Opfergaben beziehungsweise Speisegaben verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנּוֹתֶרֶת
  choice: Was aber … übrig bleibt
  rationale: Das substantivisch gebrauchte Partizip bezeichnet den verbleibenden Teil. Die Formulierung ist im modernen Deutsch natürlich und bewahrt den Gedanken des Restes.
- source_word: מִן הַמִּנְחָה
  choice: vom Speiseopfer
  rationale: מִנְחָה bezeichnet in Levitikus 2 das aus Getreide beziehungsweise Mehl bestehende Opfer. „Speiseopfer“ ist die etablierte, knappe deutsche Bezeichnung; die Präposition מִן wird mit „von dem“ wiedergegeben.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: ist für Aaron und seine Söhne bestimmt
  rationale: Das לְ kennzeichnet Zuweisung beziehungsweise Anspruch. „Ist … bestimmt“ macht diese Funktion idiomatisch deutlich, ohne mehr als der hebräische Text über die Art des Besitzes zu sagen.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: ein hochheiliger Anteil
  rationale: Die Verbindung ist eine Intensiv- beziehungsweise Superlativform und bezeichnet die höchste kultische Heiligkeitsstufe. „Anteil“ verdeutlicht, dass weiterhin der Rest des Opfers gemeint ist, und vermeidet die irreführende Ortsbezeichnung „Allerheiligstes“.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: von den Feueropfern Jahwes
  rationale: אִשֶּׁה ist ein technischer Opferbegriff mit deutlichem Bezug auf Feuer beziehungsweise Verbrennung. „Feueropfer“ erhält diesen lexikalischen Bestandteil; die Fußnote nennt die ebenfalls mögliche relationale Deutung der Genitivverbindung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „HERR“ ersetzt.
theological_decisions:
- issue: Kultische Einstufung קֹדֶשׁ קָדָשִׁים
  choice: ein hochheiliger Anteil
  alternative: etwas höchst Heiliges; ein Allerheiligstes
  rationale: Die Wiedergabe bezeichnet die höchste Stufe kultischer Heiligkeit, ohne die Wendung mit dem als „Allerheiligstes“ bezeichneten Bereich des Heiligtums zu verwechseln.
- issue: Bedeutung und Zuordnung von אִשֵּׁי יְהוָה
  choice: von den Feueropfern Jahwes
  alternative: von den Jahwe dargebrachten Feueropfern; von den Speisegaben Jahwes
  rationale: Die Übersetzung bewahrt den Feuerbezug des technischen Ausdrucks und lässt die hebräische Genitivbeziehung zunächst bestehen. Eine mögliche Zielrichtung „für Jahwe“ wird in der Fußnote ausgewiesen, statt im Haupttext festgelegt zu werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz wird zur besseren Verständlichkeit in Zuweisung und kultische Einstufung gegliedert. Der Gottesname erscheint als „Jahwe“. Der Fußnotenmarker steht unmittelbar nach der einschlägigen Wendung am Versende.
