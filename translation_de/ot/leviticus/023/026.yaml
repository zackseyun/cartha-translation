base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/026.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: de
  text: 'Und Jahwe[a] sprach zu Mose:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; auch mit „Jehova“ oder traditionell „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Und … sprach
  rationale: Das narrative Wayyiqtol von דבר eröffnet einen neuen Redeabschnitt; „sprach“ entspricht der feierlichen, formelhaften Einleitung und vermeidet die Doppelung „sagte … und sprach“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, der im modernen Deutschen üblichen wissenschaftlichen Umschrift, statt ihn durch einen Titel zu ersetzen.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition bezeichnet den Adressaten der Rede; „zu Mose sprechen“ ist die natürliche deutsche Verbindung.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: „Mose“ ist die etablierte deutsche Form des hebräischen Personennamens.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv לֵאמֹר leitet den folgenden Wortlaut ein. Im natürlichen modernen Deutsch erfüllt der Doppelpunkt diese Funktion präziser als das schwerfällige „und sagte“ oder „folgendermaßen“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Namen in der im Deutschen üblichen Form; die Fußnote weist transparent auf die hebräische Schreibweise und andere Wiedergaben hin.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe hebräische Redeeinleitungsformel wird idiomatisch mit einem Doppelpunkt abgeschlossen; dadurch bleibt ihre Funktion erhalten, ohne eine im Deutschen unnötige Verbwiederholung.
