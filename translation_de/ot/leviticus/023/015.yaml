source:
  edition: WLC
  text: וּ/סְפַרְתֶּ֤ם לָ/כֶם֙ מִ/מָּחֳרַ֣ת הַ/שַּׁבָּ֔ת מִ/יּוֹם֙ הֲבִ֣יאֲ/כֶ֔ם אֶת עֹ֖מֶר הַ/תְּנוּפָ֑ה שֶׁ֥בַע שַׁבָּת֖וֹת תְּמִימֹ֥ת תִּהְיֶֽינָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/015.yaml
  text: 'And you shall count for yourselves from the day after the Sabbath[a], from the day you bring the sheaf of the wave offering: seven complete Sabbaths shall there be.'
translation:
  language: de
  text: 'Ihr sollt für euch zählen: vom Tag nach dem Sabbat an, von dem Tag an, an dem ihr die Garbe des Schwingopfers bringt, sollen es sieben vollständige Sabbate[a] sein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sieben vollständige Wochen«. Wörtlich steht im Hebräischen: »sieben vollständige Sabbate«.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: וּסְפַרְתֶּם
  choice: Ihr sollt zählen
  rationale: Das Qal Perfekt mit vorangestelltem וּ hat in dieser gesetzlichen Anweisung auffordernde Bedeutung. »Ihr sollt zählen« gibt den verbindlichen Charakter in natürlichem, würdigem Deutsch wieder.
- source_word: לָכֶם
  choice: für euch
  rationale: Der Dativ bewahrt die persönliche beziehungsweise reflexive Beteiligung der Angesprochenen, ohne sie durch das stärkere »selbst« unnötig festzulegen.
- source_word: מִמָּחֳרַת הַשַּׁבָּת
  choice: von dem Tag nach dem Sabbat an
  rationale: מָחֳרַת bezeichnet den folgenden Tag. »Sabbat« bleibt als kultischer Schlüsselbegriff erhalten und wird nicht verallgemeinernd mit »Ruhetag« wiedergegeben.
- source_word: מִיּוֹם הֲבִיאֲכֶם
  choice: von dem Tag, an dem ihr … bringt
  rationale: Die Formulierung bezeichnet denselben zeitlichen Ausgangspunkt und ist im modernen Deutschen klar und idiomatisch.
- source_word: עֹמֶר
  choice: Garbe
  rationale: Im Zusammenhang bezeichnet עֹמֶר den konkret dargebrachten Getreidebund, nicht vorrangig ein Hohlmaß. »Garbe« ist für heutige Leser verständlich.
- source_word: הַתְּנוּפָה
  choice: des Schwingopfers
  rationale: תְּנוּפָה bezeichnet die rituell vor JHWH geschwungene beziehungsweise präsentierte Gabe. Der etablierte kultische Ausdruck »Schwingopfer« bewahrt diese Besonderheit.
- source_word: שֶׁבַע שַׁבָּתוֹת
  choice: sieben … Sabbate
  rationale: Der hebräische Text verwendet ausdrücklich den Plural von שַׁבָּת. Die Hauptübersetzung bewahrt diesen Wortlaut und lässt die mögliche kalendarische Deutung als »Wochen« in der Fußnote offen.
- source_word: תְּמִימֹת
  choice: vollständige
  rationale: Bei Zeitabschnitten bezeichnet תָּמִים Ganzheit beziehungsweise Vollständigkeit, nicht sittliche Vollkommenheit oder kultische Makellosigkeit.
- source_word: תִּהְיֶינָה
  choice: Es sollen … sein
  rationale: Die feminine Pluralform stimmt mit שַׁבָּתוֹת überein. Die deutsche Konstruktion gibt die vorgeschriebene Gesamtzahl natürlicherweise wieder.
theological_decisions:
- issue: Deutung von שַׁבָּת und שַׁבָּתוֹת in der kalendarischen Anweisung
  choice: In der Hauptübersetzung stehen »Sabbat« und »Sabbate«.
  alternative: Den Plural als »Wochen« wiedergeben und dadurch die gezählten Siebentagezeiträume ausdrücklich benennen.
  rationale: Der Ausgangstext gebraucht den Sabbatbegriff sowohl für den Ausgangspunkt als auch für die sieben gezählten Einheiten. Wegen der seit Langem umstrittenen kalendarischen Auslegung wird diese Spannung im Haupttext nicht aufgelöst; die verbreitete Deutung »Wochen« erscheint als Fußnote.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem gesetzlichem Ton. Die Wiederholung des zeitlichen Ausgangspunkts folgt bewusst der hebräischen Satzstruktur; »und zwar« macht die appositionelle Erläuterung im Deutschen transparent.
