id: LEV.23.17
reference: Leviticus 23:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: מִ/מּוֹשְׁבֹ֨תֵי/כֶ֜ם תָּבִ֣יאּוּ לֶ֣חֶם תְּנוּפָ֗ה שְׁ֚תַּיִם שְׁנֵ֣י עֶשְׂרֹנִ֔ים סֹ֣לֶת תִּהְיֶ֔ינָה חָמֵ֖ץ תֵּאָפֶ֑ינָה בִּכּוּרִ֖ים לַֽ/יהוָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/017.yaml
  text: From your dwellings you shall bring two loaves of bread for a wave offering[a]; they shall be of two-tenths of an ephah of fine flour, baked with leaven[b], as firstfruits to Yahweh.
translation:
  language: de
  text: Aus euren Wohnorten sollt ihr zwei Brote als Schwingopfer bringen. Sie sollen aus Feinmehl bestehen, aus zwei Zehnteln eines Efas[a], und mit Sauerteig gebacken werden[b], als Erstlingsgaben für Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „zwei Zehntel“; im priesterlichen Maßsystem sind damit zwei Zehntel eines Efas gemeint.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „gesäuert gebacken werden“. Der hebräische Text hebt ausdrücklich hervor, dass diese Erstlingsbrote gesäuert sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמּוֹשְׁבֹתֵיכֶם
  choice: Aus euren Wohnorten
  rationale: מוֹשָׁב bezeichnet einen Wohn- oder Siedlungsort. „Aus euren Wohnorten“ bewahrt das Bild und klingt im kultischen Anweisungstext natürlich.
- source_word: לֶחֶם תְּנוּפָה שְׁתַּיִם
  choice: zwei Brote als Schwingopfer
  rationale: Obwohl לֶחֶם formal im Singular steht, verlangt שְׁתַּיִם hier zwei Brote. תְּנוּפָה bezeichnet die rituelle Darbringung durch Schwingen und wird mit dem etablierten Fachwort „Schwingopfer“ wiedergegeben.
- source_word: שְׁנֵי עֶשְׂרֹנִים סֹלֶת
  choice: aus zwei Zehnteln eines Efas Feinmehl
  rationale: עִשָּׂרוֹן ist im priesterlichen Maßsystem ein Zehntel Efa; „eines Efas“ wird zur verständlichen Angabe der Bezugsgröße ergänzt. סֹלֶת ist das für Speiseopfer verwendete feine Mehl.
- source_word: חָמֵץ תֵּאָפֶינָה
  choice: mit Sauerteig gebacken werden
  rationale: Die Wendung bezeichnet ausdrücklich den gesäuerten Zustand der gebackenen Brote. „Mit Sauerteig“ ist klares modernes Deutsch, während die alternative Formulierung in einer Fußnote bewahrt wird.
- source_word: בִּכּוּרִים
  choice: als Erstlingsgabe
  rationale: Das Wort bezeichnet die zuerst gewonnenen Erzeugnisse, die Gott dargebracht werden. Der Singular „Erstlingsgabe“ bezeichnet hier die gemeinsame kultische Funktion der beiden Brote.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition ל kennzeichnet hier die Bestimmung der Erstlingsgabe. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt den Bundesnamen unmittelbar wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Kultischer Ausdruck תְּנוּפָה
  choice: Schwingopfer
  alternative: durch Schwingen dargebrachte Gabe; Webopfer
  rationale: „Schwingopfer“ ist eine verständliche, etablierte deutsche Bezeichnung für diese rituelle Darbringungsform und legt die genaue Bewegungsrichtung nicht über den Text hinaus fest.
- issue: Gesäuerte Erstlingsbrote
  choice: mit Sauerteig gebacken
  alternative: gesäuert gebacken
  rationale: Die auffällige ausdrückliche Kennzeichnung als gesäuert wird ohne Harmonisierung mit anderen Opferbestimmungen bewahrt.
translation_notes:
  register: Moderner, würdevoller Anweisungsstil. „Sollt“ und „sollen“ bewahren den rechtlich-kultischen Charakter, ohne altertümlich zu wirken. Technische Begriffe werden beibehalten und nötigenfalls durch Fußnoten erläutert.
