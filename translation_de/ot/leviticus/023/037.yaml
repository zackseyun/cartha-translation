  text: אֵ֚לֶּה מוֹעֲדֵ֣י יְהוָ֔ה אֲשֶׁר תִּקְרְא֥וּ אֹתָ֖/ם מִקְרָאֵ֣י קֹ֑דֶשׁ לְ/הַקְרִ֨יב אִשֶּׁ֜ה לַ/יהוָ֗ה עֹלָ֧ה וּ/מִנְחָ֛ה זֶ֥בַח וּ/נְסָכִ֖ים דְּבַר י֥וֹם בְּ/יוֹמֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/037.yaml
  text: 'These are the appointed times of the LORD, which you shall proclaim as holy convocations, to present a food offering to the LORD: a burnt offering and a grain offering, a sacrifice and drink offerings, each day''s matter on its day.'
translation:
  language: de
  text: 'Dies sind die Festzeiten des HERRN, die ihr als heilige Versammlungen ausrufen sollt, um dem HERRN ein Feueropfer darzubringen: ein Brandopfer und ein Speiseopfer, ein Schlachtopfer und Trankopfer, das für jeden Tag Vorgeschriebene an seinem Tag.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מוֹעֲדֵי
  choice: Festzeiten
  rationale: Bezeichnet hier die von Gott festgesetzten kultischen Zeiten; „Festzeiten“ ist präziser als das allgemeinere „Termine“ und im Deutschen natürlich.
- source_word: מִקְרָאֵי קֹדֶשׁ
  choice: heilige Versammlungen
  rationale: Gibt den kultischen Sinn von ausgerufenen beziehungsweise einberufenen heiligen Zusammenkünften verständlich wieder.
- source_word: אִשֶּׁה
  choice: Feueropfer
  rationale: Der Ausdruck bezeichnet eine Feuergabe bzw. ein auf dem Altar verbranntes Opfer. „Feueropfer“ wahrt den Bezug zum hebräischen Begriff, ohne die unsichere Deutung als „Speiseopfer für Gott“ festzuschreiben.
- source_word: מִנְחָה
  choice: Speiseopfer
  rationale: Im kultischen Kontext ist damit das unblutige, meist aus Getreide bestehende Opfer gemeint; die traditionelle deutsche Bezeichnung bleibt verständlich und unterscheidet es vom Schlachtopfer.
- source_word: זֶבַח
  choice: Schlachtopfer
  rationale: Benennung eines geschlachteten Tieropfers; vermeidet das zu allgemeine „Opfer“.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: für jeden Tag, was für ihn bestimmt ist
  rationale: Gibt die idiomatische Bedeutung wieder, dass die jeweils vorgeschriebenen Opfer an ihrem zugehörigen Tag darzubringen sind.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: der HERR
  alternative: JHWH / Jahwe
  rationale: Folgt der etablierten deutschsprachigen Bibelkonvention und kennzeichnet den Gottesnamen durch Kapitälchen, ohne eine bestimmte Rekonstruktion seiner Aussprache festzulegen.
- issue: Bedeutung von אִשֶּׁה
  choice: Feueropfer
  alternative: Speisegabe / Nahrungsgabe
  rationale: Die Etymologie und genaue Nuance sind umstritten. „Feueropfer“ bewahrt den kultischen Vollzug und vermeidet eine theologisch missverständliche Vorstellung, Gott benötige Nahrung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, wird jedoch durch den Gedankenstrich und die idiomatische Schlussformulierung flüssig lesbar.
