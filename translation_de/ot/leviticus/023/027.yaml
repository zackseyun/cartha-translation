  text: אַ֡ךְ בֶּ/עָשׂ֣וֹר לַ/חֹדֶשׁ֩ הַ/שְּׁבִיעִ֨י הַ/זֶּ֜ה י֧וֹם הַ/כִּפֻּרִ֣ים ה֗וּא מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם וְ/עִנִּיתֶ֖ם אֶת נַפְשֹׁתֵי/כֶ֑ם וְ/הִקְרַבְתֶּ֥ם אִשֶּׁ֖ה לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/027.yaml
  text: But on the tenth day of this seventh month[a], it is the Day of Atonement. It shall be a holy convocation for you[c][b], and you shall afflict yourselves and present a food offering to Yahweh.
translation:
  language: de
  text: Doch am zehnten Tag dieses siebten Monats ist der Versöhnungstag[a]. Er soll für euch eine heilige Versammlung sein. Ihr sollt euch selbst demütigen[b] und dem HERRN ein Feueropfer[c] darbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Tag der Versöhnungen“; das hebräische Wort steht in der Mehrzahl.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „euch selbst kasteien“ beziehungsweise „euch selbst Entbehrungen auferlegen“. Gemeint ist nicht notwendig nur das Fasten.'
    reason: lexical_alternative
  - marker: c
    text: 'Der hebräische Fachausdruck wird traditionell mit „Feueropfer“ wiedergegeben; seine genaue Bedeutung ist umstritten. Möglich ist: „Speisegabe“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Doch
  rationale: Die Partikel markiert hier einen nachdrücklichen beziehungsweise einschränkenden Übergang von den vorherigen Festanweisungen; „Doch“ gibt diese Funktion im Deutschen knapp wieder.
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ הַשְּׁבִיעִי הַזֶּה
  choice: am zehnten Tag dieses siebten Monats
  rationale: „Tag“ wird entsprechend dem hebräischen Datumsidiom ergänzt; der Demonstrativbezug von הַזֶּה bleibt durch „dieses“ erhalten.
- source_word: יוֹם הַכִּפֻּרִים
  choice: der Versöhnungstag
  rationale: Der eingebürgerte deutsche Festname ist natürlich und verständlich. Die morphologische Mehrzahl כִּפֻּרִים wird in einer Fußnote transparent gemacht.
- source_word: מִקְרָא קֹדֶשׁ
  choice: eine heilige Versammlung
  rationale: Die Wendung bezeichnet eine offiziell einberufene sakrale Zusammenkunft. „Heilige Versammlung“ ist im modernen Deutschen verständlicher als „heilige Einberufung“ und bewahrt den kultischen Sinn.
- source_word: וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: ihr sollt euch selbst kasteien
  rationale: Die Formulierung bewahrt den starken Sinn des Piel von ענה und gibt נַפְשֹׁתֵיכֶם idiomatisch reflexiv wieder, ohne die Handlung ausschließlich auf Fasten festzulegen.
- source_word: וְהִקְרַבְתֶּם
  choice: darbringen
  rationale: Im Opferkontext bezeichnet das Hifil von קרב das Heranbringen beziehungsweise Darbringen einer Gabe.
- source_word: אִשֶּׁה
  choice: Feueropfer
  rationale: „Feueropfer“ gibt den priesterlichen Opferbegriff knapp wieder und vermeidet eine Verwechslung mit dem technisch engeren deutschen Begriff „Speiseopfer“.
- source_word: לַיהוָה
  choice: dem HERRN
  rationale: Die Schreibweise „HERR“ folgt der etablierten ehrfürchtigen Wiedergabe des Gottesnamens יהוה im Deutschen.
theological_decisions:
- issue: Festname im Singular gegenüber der hebräischen Pluralform
  choice: Versöhnungstag
  alternative: Tag der Versöhnungen
  rationale: Der natürliche und traditionell verständliche deutsche Festname steht im Haupttext; die ungewöhnliche hebräische Mehrzahl wird nicht unterschlagen, sondern in der Fußnote offengelegt.
- issue: Bedeutung der Selbstkasteiung
  choice: euch selbst kasteien
  alternative: euch demütigen / euch Entbehrungen auferlegen
  rationale: Die Übersetzung hält die rituelle und bußbezogene Weite des hebräischen Idioms offen und verengt das Gebot nicht ausdrücklich auf Fasten.
- issue: Bedeutung von אִשֶּׁה
  choice: Feueropfer
  alternative: Speisegabe für den HERRN
  rationale: Die genaue Etymologie und Nuance des priesterlichen Ausdrucks sind umstritten. „Feueropfer“ bewahrt den traditionellen Bezug zur Verbrennung, während die alternative Deutung in der Fußnote genannt wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kurze Hauptsätze machen die Festanweisung gut verständlich; kultische Fachbegriffe werden nur dort verwendet, wo sie den Quelltext präzise abbilden. Die Fußnoten erhalten echte lexikalische Mehrdeutigkeit.
