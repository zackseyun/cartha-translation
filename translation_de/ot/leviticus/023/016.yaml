source:
  edition: WLC
  text: עַ֣ד מִֽ/מָּחֳרַ֤ת הַ/שַּׁבָּת֙ הַ/שְּׁבִיעִ֔ת תִּסְפְּר֖וּ חֲמִשִּׁ֣ים י֑וֹם וְ/הִקְרַבְתֶּ֛ם מִנְחָ֥ה חֲדָשָׁ֖ה לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/016.yaml
  text: You shall count fifty days[a], up to the day after the seventh Sabbath; then you shall present a new grain offering to Yahweh.
translation:
  language: de
  text: Bis zum Tag nach dem siebten Sabbat sollt ihr fünfzig Tage zählen[a]; dann sollt ihr Jahwe ein neues Speisopfer darbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bis zum Tag nach der siebten Woche«. Wörtlich steht im Hebräischen »bis zum Tag nach dem siebten Sabbat«. Wie diese Festzählung kalendarisch zu verstehen ist, wird unterschiedlich beurteilt.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַד מִמָּחֳרַת
  choice: bis zum Tag nach
  rationale: Gibt die zeitliche Grenze der Zählung idiomatisch wieder; עַד bezeichnet den Endpunkt, מִמָּחֳרַת den folgenden Tag.
- source_word: הַשַּׁבָּת הַשְּׁבִיעִת
  choice: dem siebten Sabbat
  rationale: Bewahrt die ausdrückliche hebräische Bezeichnung שַׁבָּת und löst die kalendarische Deutungsfrage nicht stillschweigend zugunsten von »Woche« auf.
- source_word: תִּסְפְּרוּ חֲמִשִּׁים יוֹם
  choice: sollt ihr fünfzig Tage zählen
  rationale: Die imperfektive Verbform hat hier anweisenden Charakter; die deutsche Wortfolge ist natürlich und hält die Zahl ausdrücklich fest.
- source_word: וְהִקְרַבְתֶּם
  choice: dann sollt ihr … darbringen
  rationale: Im Opferkontext bezeichnet das Verb das Heranbringen beziehungsweise Darbringen einer Gabe; »dann« verdeutlicht die Abfolge.
- source_word: מִנְחָה חֲדָשָׁה
  choice: ein neues Speisopfer
  rationale: מִנְחָה ist im levitischen Kultkontext ein Opfer aus pflanzlichen Erzeugnissen; »Speisopfer« ist der etablierte präzise deutsche Ausdruck, und חֲדָשָׁה bedeutet »neu«.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Gibt den im Ausgangstext stehenden Gottesnamen wieder; die Präposition wird durch den Dativ nach »darbringen« natürlich ausgedrückt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als solcher wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Kalendarische Bedeutung von הַשַּׁבָּת הַשְּׁבִיעִת
  choice: der siebte Sabbat im Haupttext
  alternative: die siebte Woche
  rationale: Der hebräische Wortlaut nennt ausdrücklich den Sabbat. Die mögliche kalendarische Deutung als Woche wird in der Fußnote genannt, ohne die Spannung im Haupttext aufzulösen.
- issue: Verhältnis von fünfzig Tagen zum genannten Endpunkt
  choice: Wortlautnah nebeneinander stehen lassen
  alternative: Die Zählweise durch eine erklärende Umformulierung harmonisieren
  rationale: Der Vers verbindet den Tag nach dem siebten Sabbat mit fünfzig gezählten Tagen. Die Übersetzung bewahrt diese Formulierung, statt eine bestimmte inklusive oder exklusive Zählmethode einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede im Plural wird mit »ihr« wiedergegeben. »Sabbat« und »Speisopfer« erhalten die kultische Präzision, ohne den Satz unnötig fachsprachlich zu machen.
