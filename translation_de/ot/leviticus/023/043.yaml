source:
  edition: WLC
  text: לְמַעַן֮ יֵדְע֣וּ דֹרֹֽתֵי/כֶם֒ כִּ֣י בַ/סֻּכּ֗וֹת הוֹשַׁ֨בְתִּי֙ אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל בְּ/הוֹצִיאִ֥/י אוֹתָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/043.yaml
  text: so that your generations may know that I made the sons of Israel dwell in booths when I brought them out of the land of Egypt[b][a]. I am Yahweh your God.
translation:
  language: de
  text: damit eure Generationen wissen, dass ich die Israeliten in Laubhütten[a] wohnen ließ, als ich sie aus dem Land Ägypten führte. Ich bin Jahwe, euer Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Hütten“ beziehungsweise „in provisorischen Unterkünften“. Das hebräische Wort bezeichnet vorübergehende Hütten oder Schutzdächer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן יֵדְעוּ
  choice: damit … wissen
  rationale: Die Verbindung bezeichnet den Zweck; die deutsche Konstruktion mit „damit“ gibt ihn natürlich und präzise wieder.
- source_word: דֹרֹתֵיכֶם
  choice: eure Generationen
  rationale: Bewahrt den generationenübergreifenden Sinn und bleibt näher am Hebräischen als die interpretierende Wiedergabe „eure Nachkommen“.
- source_word: בַסֻּכּוֹת
  choice: in Laubhütten
  rationale: „Laubhütten“ ist im Deutschen die geläufige biblische Bezeichnung und erhält den Zusammenhang mit dem Laubhüttenfest; die allgemeinere Bedeutung wird in der Fußnote genannt.
- source_word: הוֹשַׁבְתִּי
  choice: wohnen ließ
  rationale: Gibt den kausativen Hifil von ישׁב idiomatisch wieder, ohne ihn zum bloßen „wohnten“ abzuflachen.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die feste deutsche Volksbezeichnung gibt den korporativen Ausdruck natürlich wieder; das wörtliche „Söhne Israels“ könnte hier fälschlich auf männliche Einzelpersonen eingeengt werden.
- source_word: בְּהוֹצִיאִי אוֹתָם
  choice: als ich sie … führte
  rationale: Der Infinitiv mit בְּ bezeichnet den zeitlichen Umstand. Mit „aus … führte“ wird die Exodusformulierung im Deutschen natürlich ausgedrückt.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: aus dem Land Ägypten
  rationale: Bewahrt das ausdrücklich genannte „Land“ und gibt die Ausgangsbewegung mit „aus“ wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen im modernen deutschen Bibelregister als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהֵיכֶם
  choice: euer Gott
  rationale: Direkte und natürliche Wiedergabe der Bundesformel.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen; „Jahwe“ bewahrt diesen, während „der HERR“ die traditionelle Ersatzlesung darstellt.
- issue: Bedeutung von הוֹשַׁבְתִּי בַסֻּכּוֹת
  choice: in Laubhütten wohnen ließ
  alternative: in Schutzunterkünften wohnen ließ
  rationale: Die Formulierung hält sowohl den kausativen Sinn des Verbs als auch den unmittelbaren Festkontext fest. Da סֻכּוֹת allgemein auch provisorische Hütten oder Unterkünfte bezeichnen kann, bleibt diese lexikalische Weite in der Fußnote sichtbar.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: Der Ausdruck bezeichnet hier das Volk als Ganzes. „Die Israeliten“ ist im modernen Deutsch sachlich genau und vermeidet eine unbeabsichtigte Beschränkung auf Männer, ohne die korporative Bedeutung zu verändern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Laubhütten“ wahrt den vertrauten Festbezug; „wohnen ließ“ erhält die hebräische Kausativform. Die Satzstellung ist flüssig, ohne die Zweck- und Zeitbeziehungen des Ausgangstextes zu verwischen.
