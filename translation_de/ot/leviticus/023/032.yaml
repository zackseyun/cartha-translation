base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/032.yaml
  text: It is a Sabbath of complete rest for you[a], and you shall afflict yourselves. On the ninth day of the month, in the evening, from evening to evening[b], you shall keep your Sabbath.
translation:
  language: de
  text: Es soll für euch ein Sabbat völliger Ruhe sein, und ihr sollt euch selbst demütigen.[a] Am neunten Tag des Monats, am Abend, vom Abend bis zum Abend,[b] sollt ihr euren Sabbat halten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihr sollt euch selbst Entbehrungen auferlegen“. Die hebräische Wendung bezeichnet Selbsterniedrigung oder Selbstenthaltung; sie ist in diesem Zusammenhang traditionell mit Fasten verbunden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „vom Abend bis zum Abend“. Damit wird die Feier nach der israelitischen Tageszählung bestimmt.'
    reason: cultural_note
lexical_decisions:
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: ein Sabbat völliger Ruhe
  rationale: Die verbundene Wendung verstärkt den Gedanken des Aufhörens und Ruhens. Die Formulierung bewahrt diese Intensivierung in natürlichem, würdigem Deutsch.
- source_word: וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: ihr sollt euch selbst kasteien
  rationale: Das Verb ענה bezeichnet in diesem kultischen Zusammenhang eine selbst auferlegte Entbehrung beziehungsweise Demütigung, traditionell mit Fasten verbunden. „Kasteien“ hält den weiteren Sinn offen, ohne das nicht ausdrücklich genannte Fasten in den Haupttext einzutragen.
- source_word: נַפְשֹׁתֵיכֶם
  choice: euch selbst
  rationale: נֶפֶשׁ wird in dieser Wendung reflexiv gebraucht und bezeichnet nicht speziell eine vom Körper getrennte „Seele“.
- source_word: בְּתִשְׁעָה לַחֹדֶשׁ בָּעֶרֶב
  choice: Am neunten Tag des Monats, am Abend
  rationale: Die Wiedergabe folgt der hebräischen Abfolge und bezeichnet verständlich den Beginn der Feier am Abend des neunten Tages.
- source_word: מֵעֶרֶב עַד עֶרֶב
  choice: vom Abend bis zum Abend
  rationale: Dies entspricht dem hebräischen Wortlaut und vermeidet die interpretierende Präzisierung „von Sonnenuntergang bis Sonnenuntergang“.
- source_word: תִּשְׁבְּתוּ שַׁבַּתְּכֶם
  choice: sollt ihr euren Sabbat halten
  rationale: Die idiomatische Formulierung gibt die Verbindung des Verbs שבת mit „euer Sabbat“ natürlich wieder; das zugrunde liegende Ruhen beziehungsweise Aufhören bleibt durch den vorausgehenden Ausdruck deutlich.
theological_decisions:
- issue: Bedeutung der Selbstkasteiung im kultischen Zusammenhang
  choice: Die umfassendere Aufforderung „ihr sollt euch selbst kasteien“ bleibt im Haupttext stehen.
  alternative: „ihr sollt fasten“ oder „ihr sollt euch demütigen“
  rationale: Fasten dürfte zur Praxis gehören, wird in diesem Vers aber nicht ausdrücklich genannt. Die weitere Wiedergabe bewahrt den Deutungsspielraum des hebräischen Ausdrucks.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem biblischem Register. „Sabbat“ bleibt als etablierter Kultbegriff erhalten; die Satzstellung folgt dem Hebräischen, ohne unnatürlich zu wirken.
