source:
  edition: WLC
  text: בַּ/יּוֹם֙ הָֽ/רִאשׁ֔וֹן מִקְרָא קֹ֖דֶשׁ יִהְיֶ֣ה לָ/כֶ֑ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/007.yaml
  text: On the first day there shall be a holy convocation for you[b][a]; you shall do no laborious work.
translation:
  language: de
  text: Am ersten Tag sollt ihr eine heilige Versammlung[a] halten. Ihr dürft keinerlei gewöhnliche Arbeit[b] verrichten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eine heilige Einberufung« beziehungsweise »eine heilige Zusammenkunft«.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: »Arbeit des Dienstes«; gemeint ist die gewöhnliche Arbeit. Traditionell auch mit »knechtliche Arbeit« wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: Am ersten Tag
  rationale: Die Präposition ב mit dem bestimmten Ausdruck bezeichnet hier idiomatisch den Zeitpunkt.
- source_word: מִקְרָא קֹדֶשׁ
  choice: eine heilige Versammlung
  rationale: Im kultischen Zusammenhang bezeichnet מִקְרָא eine einberufene Zusammenkunft; die natürliche deutsche Wendung bewahrt sowohl den Versammlungscharakter als auch die Heiligkeit.
- source_word: יִהְיֶה לָכֶם
  choice: sollt ihr ... halten
  rationale: Die idiomatische deutsche Fassung gibt die für die Gemeinschaft geltende Festordnung wieder, ohne das schwerfällige »soll für euch sein« zu übernehmen.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: keinerlei gewöhnliche Arbeit
  rationale: כָּל unter der Verneinung verstärkt das Verbot vollständig. Die Wortverbindung bezeichnet im Festgesetz gewöhnliche beziehungsweise dienstliche Arbeit und nicht unterschiedslos jede Tätigkeit.
- source_word: לֹא תַעֲשׂוּ
  choice: Ihr dürft ... nicht verrichten
  rationale: Die deutsche Verbotsform gibt den rechtlichen Sinn des mit לֹא verneinten Imperfekts klar und natürlich wieder.
theological_decisions:
- issue: Umfang des Arbeitsverbots in מְלֶאכֶת עֲבֹדָה
  choice: Verbot gewöhnlicher Arbeit
  alternative: Verbot ausnahmslos jeder Tätigkeit
  rationale: Die spezifische Wortverbindung ist enger als ein unbestimmtes Verbot aller Arbeit. Die Übersetzung wahrt diesen Unterschied, ohne eigenmächtig festzulegen, welche einzelnen Tätigkeiten darunter fallen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Heilige Versammlung« ist allgemein verständlich und kultisch angemessen; die Fußnote bewahrt die Einberufungsnuance. Die Verbotsform ist klar und gegenwärtig, ohne umgangssprachlich zu wirken.
