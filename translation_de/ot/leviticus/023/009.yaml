  language: de
  text: 'Und Jahwe sprach zu Mose:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: sprach
  rationale: Das Wayyiqtol von דבר eröffnet einen neuen Redeabschnitt; „sprach“ entspricht der feierlichen, formelhaften Erzählweise und ist im Deutschen natürlicher als „redete“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als Eigenname wiedergegeben, statt ihn durch den Titel „der HERR“ zu ersetzen.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition kennzeichnet hier den Adressaten des Sprechens; „zu“ ist die natürliche deutsche Entsprechung.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Dies ist die im Deutschen etablierte Form des hebräischen Personennamens.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Die hebräische Redeformel leitet den folgenden Wortlaut ein. Im modernen Deutschen erfüllt ein Doppelpunkt diese Funktion natürlicher und vermeidet das schwerfällige „und sagte“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ bewahrt diesen als Namen; die traditionelle Ersetzung durch „der HERR“ ist eine mögliche Lesekonvention, steht aber nicht wörtlich im Ausgangstext.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe formelhafte Struktur bleibt erhalten; לֵאמֹר wird idiomatisch durch den Doppelpunkt ausgedrückt. Da keine Fußnote nötig ist, enthält der Haupttext keinen Fußnotenmarker.
