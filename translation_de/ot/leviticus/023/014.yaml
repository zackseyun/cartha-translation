  terminology: „Geröstetes Korn“, „frisches Korn“ und „bleibende Ordnung“ sind in diesem Kontext treffend. „Bleibende Ordnung“ bewahrt die Dauerformel חֻקַּת עוֹלָם, ohne weitergehende theologische Folgerungen vorwegzunehmen. Die Fußnote ist korrekt verankert und dokumentiert die wörtlichere Ortsangabe.
