  text: וְ/לֶחֶם֩ וְ/קָלִ֨י וְ/כַרְמֶ֜ל לֹ֣א תֹֽאכְל֗וּ עַד עֶ֨צֶם֙ הַ/יּ֣וֹם הַ/זֶּ֔ה עַ֚ד הֲבִ֣יאֲ/כֶ֔ם אֶת קָרְבַּ֖ן אֱלֹהֵי/כֶ֑ם חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם בְּ/כֹ֖ל מֹשְׁבֹֽתֵי/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/014.yaml
  text: And you shall not eat bread or roasted grain or fresh grain until this very day[a], until you have brought the offering of your God[c][b]. It is a permanent statute throughout your generations in all your dwelling places.
translation:
  language: de
  text: Brot, geröstetes Korn oder frisches Korn dürft ihr bis zu eben diesem Tag nicht essen, bis ihr die Opfergabe für euren Gott gebracht habt. Das ist eine bleibende Ordnung für euch von Generation zu Generation, überall, wo ihr wohnt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: in allen euren Wohnsitzen.'
    reason: Die wörtlichere Form von בְּכֹל מֹשְׁבֹתֵיכֶם wird als Übersetzungsalternative dokumentiert.
lexical_decisions:
- source_word: לֶחֶם
  choice: Brot
  rationale: Die konkrete Grundbedeutung passt zur Aufzählung verschiedener Formen des Getreideverzehrs.
- source_word: קָלִי
  choice: geröstetes Korn
  rationale: Bezeichnet durch Rösten beziehungsweise Darren zubereitetes Getreide; die Wiedergabe ist im modernen Deutsch unmittelbar verständlich.
- source_word: כַרְמֶל
  choice: frisches Korn
  rationale: Im Zusammenhang bezeichnet das Wort frisch gereiftes Getreide beziehungsweise frische Ähren, nicht den Ortsnamen Karmel.
- source_word: לֹא תֹאכְלוּ
  choice: dürft ihr … nicht essen
  rationale: Die negierte Verbform drückt in diesem Gesetz eine verbindliche Untersagung aus; die deutsche Formulierung klingt natürlich und wahrt den Rechtscharakter.
- source_word: עַד עֶצֶם הַיּוֹם הַזֶּה
  choice: bis zu eben diesem Tag
  rationale: עֶצֶם verstärkt die Zeitangabe; „eben diesem Tag“ gibt die Hervorhebung wieder.
- source_word: עַד הֲבִיאֲכֶם
  choice: bis ihr … gebracht habt
  rationale: Die Konstruktion bezeichnet die vollzogene Handlung als zeitliche Voraussetzung.
- source_word: קָרְבַּן אֱלֹהֵיכֶם
  choice: die Opfergabe für euren Gott
  rationale: קָרְבָּן ist eine Gott dargebrachte Gabe. „Für euren Gott“ gibt die Zielrichtung im Deutschen natürlicher wieder als ein missverständlicher Genitiv.
- source_word: חֻקַּת עוֹלָם
  choice: eine bleibende Ordnung
  rationale: Die Wendung bezeichnet eine dauerhaft geltende Satzung; „bleibende Ordnung“ wahrt den fortdauernden Rechtsanspruch ohne unnötig altertümliche Sprache.
- source_word: לְדֹרֹתֵיכֶם
  choice: für euch von Generation zu Generation
  rationale: Die idiomatische Formulierung drückt die Geltung über die aufeinanderfolgenden Generationen hinweg aus.
- source_word: בְּכֹל מֹשְׁבֹתֵיכֶם
  choice: überall, wo ihr wohnt
  rationale: Gibt die räumlich umfassende Geltung klar und in natürlichem modernem Deutsch wieder.
theological_decisions:
- issue: Reichweite von חֻקַּת עוֹלָם im mosaischen Gesetz
  choice: „eine bleibende Ordnung“ ohne Aussage über ihre Anwendung außerhalb des hier gegebenen Bundes- und Gesetzeskontexts
  alternative: „eine ewige Satzung“ oder „eine immerwährende Ordnung“
  rationale: Die Übersetzung bewahrt den Anspruch fortdauernder Geltung über die Generationen hinweg, entscheidet aber nicht nachträglich die theologische Frage nach der heutigen Geltung dieses Zeremonialgesetzes.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer gesetzlicher Verbindlichkeit. Die Satzstellung hält das Verbot und seine zeitliche Grenze eng zusammen; traditionelle, aber heute schwerfällige Wendungen wurden vermieden.
