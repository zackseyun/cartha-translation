  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: de
  text: 'Und Jahwe sprach zu Mose:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Und … sprach
  rationale: Das Waw mit der Verbform führt die Erzähl- und Redefolge fort. „sprach“ entspricht der feierlichen, formelhaften Einleitung, ohne im heutigen Deutsch unverständlich zu wirken.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition kennzeichnet hier den Adressaten des Sprechens; „zu“ ist die natürliche deutsche Entsprechung.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Der Eigenname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Die formelhafte Infinitivkonstruktion kündigt den folgenden Redeinhalt an. Im natürlichen modernen Deutsch leistet ein Doppelpunkt dies klarer als das schwerfällige „indem er sagte“ oder „folgendermaßen“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. „Jahwe“ bewahrt diesen Eigennamen, während „der HERR“ ihn durch einen traditionellen Titel ersetzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Formel und der Doppelpunkt machen deutlich, dass die eigentliche Gottesrede im folgenden Vers beginnt.
