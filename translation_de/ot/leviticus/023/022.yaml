  text: וּֽ/בְ/קֻצְרְ/כֶ֞ם אֶת קְצִ֣יר אַרְצְ/כֶ֗ם לֹֽא תְכַלֶּ֞ה פְּאַ֤ת שָֽׂדְ/ךָ֙ בְּ/קֻצְרֶ֔/ךָ וְ/לֶ֥קֶט קְצִירְ/ךָ֖ לֹ֣א תְלַקֵּ֑ט לֶֽ/עָנִ֤י וְ/לַ/גֵּר֙ תַּעֲזֹ֣ב אֹתָ֔/ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/022.yaml
  text: And when you reap the harvest of your land[a], you shall not completely reap the edge of your field, and you shall not gather the gleanings of your harvest; you shall leave them for the poor and for the sojourner[b]. I am Yahweh your God.
translation:
  language: de
  text: Wenn ihr die Ernte eures Landes einbringt, sollst du den Rand[a] deines Feldes nicht vollständig abernten und die Nachlese deiner Ernte nicht aufsammeln. Für den Armen und den ansässigen Fremden[b] sollst du sie liegen lassen. Ich bin Jahwe, euer Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Ecke“. Das hebräische Wort kann den Rand, die Seite oder die Ecke eines Feldes bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist ein Nichtisraelit, der unter den Israeliten lebte und unter dem Schutz ihres Rechts stand.
    reason: lexical_clarification
lexical_decisions:
- source_word: וּבְקֻצְרְכֶם אֶת קְצִיר אַרְצְכֶם
  choice: Wenn ihr die Ernte eures Landes einbringt
  rationale: Die Präposition mit dem Infinitiv von קצר bezeichnet den Zeitpunkt des Erntens. „Die Ernte einbringen“ ist im Deutschen natürlich und gibt den landwirtschaftlichen Vorgang klar wieder.
- source_word: לֹא תְכַלֶּה פְּאַת שָׂדְךָ בְּקֻצְרֶךָ
  choice: sollst du den Rand deines Feldes nicht vollständig abernten
  rationale: כלה im Piel bedeutet hier „vollenden, vollständig ausführen“; פאה bezeichnet den äußeren Bereich eines Feldes. Die Formulierung drückt aus, dass nicht bis an die äußerste Feldgrenze geerntet werden soll. Der Wechsel vom Plural zum Singular im Hebräischen bleibt erhalten.
- source_word: וְלֶקֶט קְצִירְךָ לֹא תְלַקֵּט
  choice: und die Nachlese deiner Ernte nicht aufsammeln
  rationale: לקט bezeichnet liegen gebliebene oder verstreute Erntereste. „Nachlese“ ist der präzise deutsche Begriff; „aufsammeln“ gibt das zugehörige Verb verständlich wieder.
- source_word: לֶעָנִי
  choice: für den Armen
  rationale: עני bezeichnet hier einen wirtschaftlich Bedürftigen. Der generische Singular des Ausgangstextes wird bewahrt.
- source_word: וְלַגֵּר
  choice: und den ansässigen Fremden
  rationale: גר ist kein beliebiger Unbekannter, sondern ein Nichtisraelit, der dauerhaft unter Israel lebt. „Ansässiger Fremder“ macht diese soziale Stellung deutlicher als nur „Fremder“.
- source_word: תַּעֲזֹב אֹתָם
  choice: sollst du sie liegen lassen
  rationale: עזב bedeutet in diesem Zusammenhang, die Erntereste nicht mitzunehmen, sondern für andere zurückzulassen. „Liegen lassen“ ist im Erntekontext konkret und idiomatisch.
- source_word: אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: Ich bin Jahwe, euer Gott
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, der im modernen Deutschen geläufigen Form; der abschließende Wechsel zum Plural „euer“ entspricht dem Hebräischen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich den Gottesnamen. „Jahwe“ bewahrt ihn als Namen und ist die im Deutschen etablierte Form, ohne ihn durch einen Titel zu ersetzen.
- issue: Sozialrechtliche Bedeutung von גֵּר
  choice: ansässiger Fremder
  alternative: Fremder; Schutzbürger
  rationale: Die Wiedergabe bezeichnet einen Nichtisraeliten, der innerhalb der israelitischen Gemeinschaft lebt, ohne moderne staatsrechtliche Kategorien oder zusätzliche konfessionelle Deutungen einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Der auffällige Wechsel von der pluralischen Anrede („ihr“, „eures“) zur singularischen Einzelanrede („du“, „deines“, „deiner“) und zurück zum Plural („euer“) wird als Merkmal des hebräischen Textes bewahrt. Die zweite Zeitangabe beim Ernten ist in die Verbform „abernten“ integriert, um unnötige deutsche Wiederholung zu vermeiden.
