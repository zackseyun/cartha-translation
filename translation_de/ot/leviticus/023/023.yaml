lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: sprach
  rationale: Das Wayyiqtol von דבר eröffnet einen neuen Redeeinsatz; „sprach“ gibt die feierliche, formelhafte Wendung im Deutschen passend wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, der im Deutschen üblichen wissenschaftlichen Umschrift.
- source_word: אֶל מֹשֶׁה
  choice: zu Mose
  rationale: אֶל bezeichnet hier den Adressaten der Rede; „zu Mose“ ist die natürliche deutsche Formulierung.
- source_word: לֵאמֹר
  choice: durch den Doppelpunkt ausgedrückt
  rationale: Der Infinitiv לֵאמֹר leitet den folgenden Wortlaut ein. Im modernen Deutschen übernimmt der Doppelpunkt diese Funktion natürlicher als das schwerfällige „und sagte“ oder „folgendermaßen“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: Jehova
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ bewahrt ihn als persönlichen Gottesnamen und entspricht der heute üblichen deutschen Wiedergabe; „Jehova“ beruht auf einer späteren Verbindung der Konsonanten mit Ersatzlesevokalen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Redeeinleitungsformel wird knapp und natürlich wiedergegeben; der Doppelpunkt weist auf den in Vers 24 folgenden Redeinhalt voraus.
