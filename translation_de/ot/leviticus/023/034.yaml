  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר בַּ/חֲמִשָּׁ֨ה עָשָׂ֜ר י֗וֹם לַ/חֹ֤דֶשׁ הַ/שְּׁבִיעִי֙ הַ/זֶּ֔ה חַ֧ג הַ/סֻּכּ֛וֹת שִׁבְעַ֥ת יָמִ֖ים לַ/יהֹוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/034.yaml
  text: 'Speak to the sons of Israel[a], saying: On the fifteenth day of this seventh month is the Feast of Booths for seven days to Yahweh.'
translation:
  language: de
  text: 'Rede zu den Israeliten und sage: Am fünfzehnten Tag dieses siebten Monats ist das Hüttenfest[a] für Jahwe; es dauert sieben Tage.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: „Laubhüttenfest“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל לֵאמֹר
  choice: Rede zu den Israeliten und sage
  rationale: Die feste Einleitungsformel wird in natürlichem, würdigem Deutsch wiedergegeben. „Israeliten“ bezeichnet die בני ישראל präzise als das Volk Israel, ohne im Deutschen missverständlich nur männliche Nachkommen anzusprechen.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הַשְּׁבִיעִי הַזֶּה
  choice: Am fünfzehnten Tag dieses siebten Monats
  rationale: Bewahrt die genaue Datumsangabe und ausdrücklich auch das Demonstrativpronomen הַזֶּה („dieses“).
- source_word: חַג הַסֻּכּוֹת
  choice: das Hüttenfest
  rationale: סֻכּוֹת bezeichnet Hütten beziehungsweise vorübergehende Unterkünfte. „Hüttenfest“ gibt den hebräischen Ausdruck transparent wieder; die geläufige deutsche Traditionsbezeichnung steht in der Fußnote.
- source_word: שִׁבְעַת יָמִים
  choice: es dauert sieben Tage
  rationale: Die knappe hebräische Zeitangabe wird als eigener deutscher Satzteil verständlich aufgelöst, ohne ihren Sinn zu erweitern.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Das ל kennzeichnet hier die Ausrichtung beziehungsweise Widmung des Festes. „Für Jahwe“ ist im Deutschen natürlicher als „zu Jahwe“ und bewahrt den Gottesnamen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen ausdrücklich. „Jahwe“ macht den Bundesnamen sichtbar, statt ihn durch einen Titel zu ersetzen.
- issue: Bezeichnung des Festes סֻכּוֹת
  choice: Hüttenfest
  alternative: Laubhüttenfest
  rationale: Die Hauptfassung folgt der unmittelbaren lexikalischen Bedeutung „Hütten“. Die traditionelle deutsche Benennung „Laubhüttenfest“ bleibt zur Wiedererkennung in der Fußnote erhalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Weisungston. Die hebräische Nominalkonstruktion wird durch einen Semikolonanschluss natürlich gegliedert; Datierung, Festname, Widmung und Dauer bleiben vollständig erhalten.
