  text: בַּ/יּ֥וֹם הָ/רִאשׁ֖וֹן מִקְרָא קֹ֑דֶשׁ כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/035.yaml
  text: On the first day there shall be a holy convocation[b][a]; you shall do no laborious work.
translation:
  language: de
  text: Am ersten Tag soll eine heilige Versammlung stattfinden; keinerlei gewöhnliche Arbeit dürft ihr verrichten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »keinerlei Arbeit des Dienstes«. Die Wendung bezeichnet gewöhnliche Arbeits- oder Diensttätigkeit, nicht jede denkbare Tätigkeit; auch »keinerlei Dienst- oder Arbeitsleistung« ist möglich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: Am ersten Tag
  rationale: Die Präposition בְּ mit יוֹם bezeichnet hier den Zeitpunkt; zusammen mit dem Ordinal ergibt sich im Deutschen natürlich »Am ersten Tag«.
- source_word: מִקְרָא קֹדֶשׁ
  choice: eine heilige Versammlung
  rationale: Die feste kultische Wendung bezeichnet eine offiziell einberufene, heilige Zusammenkunft. »Heilige Versammlung« ist verständlich und würdevoll; der Aspekt der Einberufung wird in der Fußnote kenntlich gemacht.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: keinerlei Berufsarbeit
  rationale: Die Wortverbindung meint nicht ausnahmslos jede Tätigkeit, sondern gewöhnliche Arbeit im Rahmen von Dienst oder Beruf. »Berufsarbeit« grenzt dies im Deutschen prägnant von jeglicher Handlung ab.
- source_word: לֹא תַעֲשׂוּ
  choice: dürft ihr nicht verrichten
  rationale: 'Das negierte Imperfekt in dieser Rechtsbestimmung drückt ein Verbot aus. Mit vorangestelltem »keinerlei« lautet die natürliche Satzform: »keinerlei Berufsarbeit dürft ihr verrichten«.'
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Soll … stattfinden« gibt den nominalen hebräischen Satz idiomatisch wieder. Die Fachwendung מִקְרָא קֹדֶשׁ wird verständlich als »heilige Versammlung« übersetzt, ohne zusätzliche konfessionelle Deutung.
