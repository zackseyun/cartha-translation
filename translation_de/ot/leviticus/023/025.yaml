id: LEV.23.25
reference: Leviticus 23:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֣א תַעֲשׂ֑וּ וְ/הִקְרַבְתֶּ֥ם אִשֶּׁ֖ה לַ/יהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/025.yaml
  text: You shall do no laborious work[a], and you shall present a food offering to Yahweh.
translation:
  language: de
  text: Ihr sollt keine gewöhnliche Arbeit verrichten und Jahwe ein Feueropfer[a] darbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: eine Speisegabe; traditionell auch: ein Opfer, das im Feuer dargebracht wird.'
    reason: 'Der genaue Sinn des kultischen Ausdrucks אִשֶּׁה ist umstritten: Er wird sowohl auf das Feuer als auch auf die Funktion der Opfergabe als Speise bezogen.'
lexical_decisions:
- source_word: כָּל ... לֹא תַעֲשׂוּ
  choice: ihr sollt keine … verrichten
  rationale: Die deutsche Verneinung mit „keine“ gibt die umfassende Kraft von כָּל innerhalb des Verbots natürlich wieder; „sollt“ bewahrt den rechtsverbindlichen Charakter und die zweite Person Plural.
- source_word: מְלֶאכֶת עֲבֹדָה
  choice: gewöhnliche Arbeit
  rationale: Die Wortverbindung bezeichnet die reguläre Arbeits- beziehungsweise Diensttätigkeit, nicht ausnahmslos jede Handlung. „Gewöhnliche Arbeit“ ist verständlich und vermeidet das veraltete „knechtliche Arbeit“.
- source_word: וְהִקְרַבְתֶּם
  choice: und … darbringen
  rationale: Im Opferzusammenhang bedeutet der Hifil von קרב, etwas als Opfer herzuzubringen beziehungsweise darzubringen. „Darbringen“ ist im Deutschen präzise und idiomatisch.
- source_word: אִשֶּׁה
  choice: Feueropfer
  rationale: Der priesterliche Kultbegriff bezeichnet eine Opfergabe, die auf dem Altar dem Feuer übergeben wird. „Feueropfer“ bewahrt die traditionelle und wahrscheinlich wortgeschichtlich naheliegende Deutung; die ebenfalls vertretene funktionale Wiedergabe als Speisegabe wird in der Fußnote genannt.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Das Tetragramm יהוה wird als der offenbarte Eigenname Gottes wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. „Jahwe“ wahrt den Charakter als Eigenname; „der HERR“ wäre die traditionelle Ersatzlesung.
- issue: Verständnis des Kultbegriffs אִשֶּׁה
  choice: Feueropfer
  alternative: Speisegabe
  rationale: Der Ausdruck kann nach seiner Form als mit Feuer dargebrachtes Opfer verstanden werden, wird im priesterlichen Sprachgebrauch aber auch funktional als Gottes Speisegabe erklärt. Die Übersetzung entscheidet sich im Haupttext für „Feueropfer“, ohne die sachlich mögliche Alternative zu verschweigen.
translation_notes:
  register: Moderne, klare und zugleich würdevolle Rechtssprache. Die Anrede steht entsprechend dem Hebräischen im Plural. „Gewöhnliche Arbeit“ grenzt die untersagte reguläre Arbeit von einem absoluten Verbot jeder Tätigkeit ab.
