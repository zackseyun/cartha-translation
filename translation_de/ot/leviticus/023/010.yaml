source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם כִּֽי תָבֹ֣אוּ אֶל הָ/אָ֗רֶץ אֲשֶׁ֤ר אֲנִי֙ נֹתֵ֣ן לָ/כֶ֔ם וּ/קְצַרְתֶּ֖ם אֶת קְצִירָ֑/הּ וַ/הֲבֵאתֶ֥ם אֶת עֹ֛מֶר רֵאשִׁ֥ית קְצִירְ/כֶ֖ם אֶל הַ/כֹּהֵֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/010.yaml
  text: 'Speak to the sons of Israel and say to them: When you come into the land that I am giving to you[a], and reap its harvest[b], then you shall bring the sheaf of the firstfruits of your harvest to the priest.'
translation:
  language: de
  text: 'Rede zu den Israeliten[a] und sage ihnen: Wenn ihr in das Land kommt, das ich euch gebe, und seine Ernte einbringt, dann sollt ihr die Garbe[b] vom ersten Ertrag eurer Ernte zum Priester bringen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zu den Söhnen Israels“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „das Omer“. Das hebräische Wort kann hier eine Garbe bezeichnen, wird aber auch als technischer Ausdruck „Omer“ verwendet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die hebräische Wendung bedeutet als feste Volksbezeichnung idiomatisch „die Israeliten“. Die wörtliche Form „Söhne Israels“ bleibt in einer Fußnote erhalten.
- source_word: כִּי
  choice: Wenn
  rationale: כִּי leitet hier den Zeitpunkt beziehungsweise die Voraussetzung ein, unter der die folgende Anweisung gilt.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: „Das Land“ bewahrt den geografischen und bundestheologischen Bezug auf das Israel gegebene Land.
- source_word: נֹתֵן
  choice: ich euch gebe
  rationale: Das Partizip bezeichnet Gottes gegenwärtiges beziehungsweise unmittelbar bevorstehendes Geben; die deutsche Präsensform gibt dies natürlich wieder.
- source_word: וּקְצַרְתֶּם אֶת קְצִירָהּ
  choice: und seine Ernte einbringt
  rationale: „Die Ernte einbringen“ ist eine natürliche deutsche Wiedergabe des Verbs קָצַר mit dem verwandten Substantiv קָצִיר; das Possessivpronomen verweist auf das Land zurück.
- source_word: וַהֲבֵאתֶם
  choice: dann sollt ihr ... bringen
  rationale: „Dann“ macht die zeitliche Folge nach der einleitenden Voraussetzung deutlich; „sollt“ entspricht dem verbindlichen Charakter der kultischen Anweisung.
- source_word: עֹמֶר
  choice: die Garbe
  rationale: Im Zusammenhang der gerade eingebrachten Ernte bezeichnet עֹמֶר wahrscheinlich eine Garbe. Die mögliche technische Bezeichnung „Omer“ wird in der Fußnote bewahrt.
- source_word: רֵאשִׁית קְצִירְכֶם
  choice: vom ersten Ertrag eurer Ernte
  rationale: Die Formulierung wahrt sowohl den zeitlichen Vorrang als auch den Charakter einer ersten Erntegabe, ohne mehr kultische Präzision einzutragen, als der Ausdruck selbst bietet.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Dies ist die übliche und kontextgerechte Wiedergabe von כֹּהֵן.
theological_decisions:
- issue: Volksbezeichnung בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: Die idiomatische Volksbezeichnung schließt das ganze angesprochene Israel ein. Eine ausschließlich männliche Eingrenzung wäre im Deutschen missverständlich; die formale Gestalt des Hebräischen wird deshalb in der Fußnote dokumentiert.
- issue: Kultischer Ausdruck עֹמֶר
  choice: die Garbe
  alternative: das Omer
  rationale: Der unmittelbare Erntezusammenhang begünstigt die konkrete Bedeutung „Garbe“. Da עֹמֶר zugleich als technischer Ausdruck verstanden werden kann, bleibt „Omer“ als echte Alternative in der Fußnote erhalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die Satzfolge bildet Voraussetzung, Ernte und anschließende kultische Handlung klar ab; vermeidbare Hebraismen werden durch Fußnoten transparent gemacht.
