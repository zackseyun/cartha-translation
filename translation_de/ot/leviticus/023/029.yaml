source:
  edition: WLC
  text: כִּ֤י כָל הַ/נֶּ֨פֶשׁ֙ אֲשֶׁ֣ר לֹֽא תְעֻנֶּ֔ה בְּ/עֶ֖צֶם הַ/יּ֣וֹם הַ/זֶּ֑ה וְ/נִכְרְתָ֖ה מֵֽ/עַמֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/029.yaml
  text: For every person who does not humble himself on this very day shall be cut off from his people[a].
translation:
  language: de
  text: Denn jeder Mensch, der sich an eben diesem Tag nicht demütigt[a], soll aus seinem Volk abgeschnitten werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sich nicht kasteit« beziehungsweise »sich keinen Verzicht auferlegt«. Die hebräische Wendung bezeichnet Selbstverzicht oder Selbstkasteiung und wird traditionell mit Fasten verbunden.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für das vorausgehende Gebot ein und entspricht dem rechtlich-erklärenden Zusammenhang.
- source_word: כָל הַנֶּפֶשׁ
  choice: jeder Mensch
  rationale: נֶפֶשׁ bezeichnet hier die einzelne Person, nicht technisch eine vom Körper unterschiedene Seele.
- source_word: אֲשֶׁר לֹא תְעֻנֶּה
  choice: der sich nicht demütigt
  rationale: Die passive beziehungsweise reflexive Form bezeichnet im Zusammenhang des Versöhnungstags Selbsterniedrigung oder Selbstkasteiung, traditionell mit Fasten und Verzicht verbunden. »Sich demütigen« gibt die bußfertige Haltung natürlich wieder, ohne die konkrete Praxis abschließend festzulegen.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: an ebendiesem Tag
  rationale: עֶצֶם verstärkt hier die Zeitangabe; »ebendiesem« bewahrt die Betonung knapp und idiomatisch.
- source_word: וְנִכְרְתָה
  choice: soll … ausgerottet werden
  rationale: Die traditionelle Rechtsformel bewahrt das Gewicht der Bundesstrafe, ohne ihren Vollzug näher zu bestimmen.
- source_word: מֵעַמֶּיהָ
  choice: aus seinem Volk
  rationale: Das feminine Suffix richtet sich grammatisch nach נֶפֶשׁ; gemeint ist jedoch generisch die betreffende Person. Das maskuline Pronomen stimmt im Deutschen mit »Mensch« überein.
theological_decisions:
- issue: Bedeutung des Gebots, sich am Versöhnungstag zu demütigen beziehungsweise zu kasteien
  choice: sich demütigt
  alternative: sich kasteit; sich Verzicht auferlegt
  rationale: Die Wendung bezeichnet eine bußfertige Selbsterniedrigung, die traditionell durch Fasten und Selbstverzicht ausgedrückt wurde. Die Hauptfassung nennt die Haltung, während die Fußnote die körperlich-praktische Bedeutungsnuance erhält.
- issue: Art der Strafe des »Ausgerottetwerdens«
  choice: Die traditionelle Rechtsformel bleibt ohne nähere Erklärung im Haupttext stehen.
  alternative: ausgeschlossen werden; beseitigt werden
  rationale: Der hebräische Text legt hier nicht fest, ob Tod, Ausschluss oder unmittelbares göttliches Gericht gemeint ist. Die offene Formulierung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Ebendiesem« erhält die zeitliche Hervorhebung; »ausgerottet werden« wahrt die gewichtige, bewusst nicht näher bestimmte Rechtsformel.
