source:
  edition: WLC
  text: וְ/הֵנִ֣יף הַ/כֹּהֵ֣ן אֹתָ֡/ם עַל֩ לֶ֨חֶם הַ/בִּכּוּרִ֤ים תְּנוּפָה֙ לִ/פְנֵ֣י יְהוָ֔ה עַל שְׁנֵ֖י כְּבָשִׂ֑ים קֹ֛דֶשׁ יִהְי֥וּ לַ/יהוָ֖ה לַ/כֹּהֵֽן׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/020.yaml
  text: The priest shall wave them with the bread of the firstfruits as a wave offering before Yahweh[a], with the two lambs. They shall be holy to Yahweh for the priest.
translation:
  language: de
  text: Der Priester soll sie zusammen mit dem Erstlingsbrot und den beiden Lämmern als Schwingopfer vor Jahwe schwingen.[a] Sie sollen Jahwe heilig sein und dem Priester zustehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher kann man die Präposition jeweils mit „über“ wiedergeben: „über dem Erstlingsbrot“ und „über den beiden Lämmern“. Gemeint ist hier wahrscheinlich ihre gemeinsame rituelle Darbringung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵנִיף ... תְּנוּפָה
  choice: soll ... als Schwingopfer ... schwingen
  rationale: Die Verbindung bezeichnet die rituelle Bewegung beziehungsweise Darbringung vor Gott; „Schwingopfer“ bewahrt den kultischen Fachbegriff.
- source_word: אֹתָם
  choice: sie
  rationale: Das Pronomen bleibt wie im Hebräischen rückbezüglich und wird im Vers nicht unnötig konkretisiert.
- source_word: עַל לֶחֶם הַבִּכּוּרִים ... עַל שְׁנֵי כְבָשִׂים
  choice: zusammen mit dem Erstlingsbrot und den beiden Lämmern
  rationale: עַל kann räumlich „über“ bedeuten, bezeichnet hier aber wahrscheinlich die gemeinsame rituelle Darbringung. Die Fußnote bewahrt die wörtlichere Möglichkeit.
- source_word: לֶחֶם הַבִּכּוּרִים
  choice: Erstlingsbrot
  rationale: Die kompakte deutsche Bildung gibt die Zugehörigkeit des Brotes zur Erstlingsgabe natürlich wieder.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: Die kultische Handlung geschieht in Jahwes Gegenwart; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: קֹדֶשׁ יִהְיוּ
  choice: Sie sollen ... heilig sein
  rationale: Die Formulierung bewahrt die im Hebräischen ausgesagte Heiligkeitsstellung.
- source_word: לַיהוָה לַכֹּהֵן
  choice: Jahwe heilig sein und dem Priester zustehen
  rationale: Die beiden ל-Verbindungen drücken einerseits die Weihe an Jahwe, andererseits den Anspruch des Priesters aus; „zustehen“ macht die rechtliche Zuordnung im Deutschen verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm; „Jahwe“ gibt den persönlichen Bundesnamen wieder.
- issue: Verhältnis von Heiligkeit für Jahwe und Zuteilung an den Priester
  choice: Jahwe heilig und dem Priester zustehend
  alternative: ausschließlich Jahwe gehörend oder ausschließlich dem Priester gehörend
  rationale: 'Der Text hält beide Aussagen zusammen: Die Gaben sind Jahwe geweiht und zugleich dem Priester zugeteilt. Die Übersetzung löst diese Spannung nicht auf.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der etablierte kultische Ausdruck „Schwingopfer“ bleibt erhalten; die Satzstruktur wurde für natürliche Verständlichkeit leicht geordnet.
