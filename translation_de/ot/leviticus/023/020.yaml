  source_fidelity: Die Übersetzung gibt die kultische Handlung וְהֵנִיף … תְּנוּפָה treffend mit „als Schwingopfer … schwingen“ wieder. „Zusammen mit“ ist für die beiden Vorkommen von עַל als kontextuelle Deutung vertretbar; die Fußnote bewahrt die räumlichere Alternative „über“. Das anaphorische „sie“ wird angemessen nicht überbestimmt. Der Schlusssatz hält sowohl die Heiligkeit für Jahwe als auch die Zuteilung an den Priester fest.
  naturalness: Modernes, würdiges und gut verständliches Standarddeutsch. „Erstlingsbrot“, „Schwingopfer“ und „dem Priester zustehen“ sind in diesem rechtlich-kultischen Kontext natürlich und registergerecht.
  terminology: „Jahwe“ gibt den Gottesnamen konsistent wieder. „Schwingopfer“ ist ein etablierter deutscher Fachausdruck; „heilig“ bewahrt den theologischen Statusbegriff, ohne ihn konfessionell auszudeuten. Der Fußnotenanker und sein Inhalt sind passend platziert und vollständig.
