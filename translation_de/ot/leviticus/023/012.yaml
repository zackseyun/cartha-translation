source:
  edition: WLC
  text: וַ/עֲשִׂיתֶ֕ם בְּ/י֥וֹם הֲנִֽיפְ/כֶ֖ם אֶת הָ/עֹ֑מֶר כֶּ֣בֶשׂ תָּמִ֧ים בֶּן שְׁנָת֛/וֹ לְ/עֹלָ֖ה לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/012.yaml
  text: On the day you wave the sheaf[a], you shall offer a male lamb without blemish, a year old, as a burnt offering to Yahweh.
translation:
  language: de
  text: An dem Tag, an dem ihr die Garbe[a] schwingt, sollt ihr ein einjähriges, makelloses männliches Lamm als Brandopfer für Jahwe darbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Omer«. Hier bezeichnet das Wort wahrscheinlich die im Opferritual dargebrachte Garbe und nicht nur ein Trockenmaß.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: sollt ihr … darbringen
  rationale: עשה bedeutet grundsätzlich »tun/machen«, wird im Opferkontext jedoch idiomatisch für das Darbringen eines Opfers gebraucht.
- source_word: בְּיוֹם הֲנִיפְכֶם
  choice: An dem Tag, an dem ihr … schwingt
  rationale: Die temporale Konstruktion wird im Deutschen natürlich als Relativsatz wiedergegeben; der Hifil von נוף bezeichnet die kultische Schwinghandlung.
- source_word: הָעֹמֶר
  choice: die Garbe
  rationale: Im Ernte- und Ritualzusammenhang bezeichnet עֹמֶר hier wahrscheinlich die dargebrachte Garbe und nicht bloß ein Trockenmaß; die Alternative wird in der Fußnote bewahrt.
- source_word: כֶּבֶשׂ
  choice: männliches Lamm
  rationale: כֶּבֶשׂ bezeichnet im Opferkontext ein männliches Lamm.
- source_word: תָּמִים
  choice: makellos
  rationale: Bei Opfertieren bezeichnet תָּמִים die Freiheit von körperlichen Fehlern oder Mängeln.
- source_word: בֶּן שְׁנָתוֹ
  choice: einjähriges
  rationale: Die hebräische Altersangabe wird knapp und idiomatisch wiedergegeben; gemeint ist ein Tier in seinem ersten Lebensjahr beziehungsweise von einem Jahr.
- source_word: לְעֹלָה
  choice: als Brandopfer
  rationale: עֹלָה ist der feste kultische Ausdruck für das vollständig verbrannte Opfer.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition kennzeichnet den Empfänger beziehungsweise die Widmung des Opfers; der Gottesname יהוה wird als »Jahwe« wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Tetragrammaton. »Jahwe« bewahrt den persönlichen Bundesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von עֹמֶר im Ritual
  choice: Garbe
  alternative: Omer beziehungsweise Maß
  rationale: Der unmittelbare Erntekontext und die Schwinghandlung sprechen für den konkreten Erntebund; da der Ausdruck auch ein Maß bezeichnen kann, bleibt diese lexikalische Spannung in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kultischen Fachbegriffe »schwingen« und »Brandopfer« bleiben erhalten; die Satzstellung ist für heutige Leser geglättet.
