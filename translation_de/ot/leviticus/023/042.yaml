source:
  edition: WLC
  text: בַּ/סֻּכֹּ֥ת תֵּשְׁב֖וּ שִׁבְעַ֣ת יָמִ֑ים כָּל הָֽ/אֶזְרָח֙ בְּ/יִשְׂרָאֵ֔ל יֵשְׁב֖וּ בַּ/סֻּכֹּֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/042.yaml
  text: You shall dwell in booths for seven days[a]; every native-born person in Israel shall dwell in booths.
translation:
  language: de
  text: Sieben Tage lang sollt ihr in Laubhütten[a] wohnen; jeder Einheimische in Israel soll in Laubhütten wohnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Hütten“ beziehungsweise „vorübergehenden Unterkünften“. Gemeint sind die für das Fest errichteten Hütten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּסֻּכֹּת
  choice: in Laubhütten
  rationale: סֻכּוֹת bezeichnet die für das Fest errichteten vorübergehenden Hütten. „Laubhütten“ ist im Deutschen die geläufige, konkrete Bezeichnung und passt zum Kontext des Laubhüttenfestes, ohne das allgemeinere Bedeutungsfeld zu verschweigen.
- source_word: תֵּשְׁבוּ / יֵשְׁבוּ
  choice: sollt ihr wohnen / soll wohnen
  rationale: ישׁב bedeutet hier nicht bloß „sitzen“, sondern sich für eine bestimmte Zeit aufhalten beziehungsweise wohnen. „Wohnen“ erhält das konkrete Bild und den gebietenden Charakter.
- source_word: שִׁבְעַת יָמִים
  choice: sieben Tage lang
  rationale: Die deutsche Zeitangabe „sieben Tage lang“ gibt den adverbialen Akkusativ der Dauer natürlich und genau wieder.
- source_word: כָּל הָאֶזְרָח
  choice: jeder Einheimische
  rationale: אֶזְרָח bezeichnet ein einheimisches Mitglied der Gemeinschaft im Gegensatz zum Fremden. „Einheimischer“ vermeidet die modernen staatsrechtlichen Nebenbedeutungen von „Staatsbürger“; die maskuline Singularform bleibt als generische Personenbezeichnung erhalten.
- source_word: בְּיִשְׂרָאֵל
  choice: in Israel
  rationale: Die direkte Wiedergabe bezeichnet den Bereich beziehungsweise die Gemeinschaft Israel, in der die Einheimischen diesem Gebot unterstehen.
theological_decisions:
- issue: Personenkreis von הָאֶזְרָח
  choice: jeder Einheimische
  alternative: jeder einheimische Mann / jede einheimische Person
  rationale: Das grammatisch maskuline Substantiv hat hier kollektive beziehungsweise repräsentative Kraft und beschränkt das Gebot nicht ausdrücklich auf Männer. „Jeder Einheimische“ ist im Deutschen idiomatisch und lässt diesen Umfang bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Laubhütten“ bewahrt den konkreten kultischen Bezug; „wohnen“ ist verständlicher und natürlicher als das gehobenere „weilen“. Die Wiederholung des Verbs und der Laubhütten wurde entsprechend dem Hebräischen beibehalten.
