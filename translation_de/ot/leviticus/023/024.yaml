source:
  edition: WLC
  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר בַּ/חֹ֨דֶשׁ הַ/שְּׁבִיעִ֜י בְּ/אֶחָ֣ד לַ/חֹ֗דֶשׁ יִהְיֶ֤ה לָ/כֶם֙ שַׁבָּת֔וֹן זִכְר֥וֹן תְּרוּעָ֖ה מִקְרָא קֹֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/024.yaml
  text: 'Speak to the sons of Israel[a], saying: In the seventh month, on the first day of the month, there shall be for you a solemn rest, a memorial of trumpet blasts, a holy convocation.'
translation:
  language: de
  text: 'Rede zu den Israeliten und sag: Im siebten Monat, am ersten Tag des Monats, soll für euch ein feierlicher Ruhetag sein, ein Gedenktag mit Signalruf[a], eine heilige Versammlung.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann einen lauten Ruf oder einen Signalstoß bezeichnen, etwa mit einem Horn oder einer Trompete.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die hebräische Wendung bedeutet wörtlich »Söhne Israels«, bezeichnet hier jedoch gemeinschaftlich das Volk Israel. »Israeliten« ist im modernen Deutschen natürlich und schließt die gesamte angesprochene Gemeinschaft ein.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: im siebten Monat
  rationale: Entspricht der kalendarischen Zeitangabe mit der Präposition ב.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: am ersten Tag des Monats
  rationale: Gibt die hebräische Datumsformel verständlich und genau wieder.
- source_word: יִהְיֶה לָכֶם שַׁבָּתוֹן
  choice: sollt ihr einen feierlichen Ruhetag halten
  rationale: Natürliches Deutsch für die Konstruktion »es soll euch ... sein«; שַׁבָּתוֹן bezeichnet eine besonders einzuhaltende Arbeitsruhe.
- source_word: זִכְרוֹן
  choice: Gedenktag
  rationale: Im Festkalender bezeichnet das Wort eine der Erinnerung dienende Feier oder Begehung. »Gedenktag« verbindet den Erinnerungscharakter natürlich mit dem genannten Tag.
- source_word: תְּרוּעָה
  choice: mit lautem Signal
  rationale: Der Ausdruck bezeichnet einen weithin hörbaren Signalruf oder Signalstoß und legt das Instrument nicht ausdrücklich fest. Die Übersetzung bewahrt diese lexikalische Breite.
- source_word: מִקְרָא קֹדֶשׁ
  choice: eine heilige Versammlung
  rationale: Die feste kultische Wendung bezeichnet eine als heilig einberufene Zusammenkunft; »heilige Versammlung« ist klar und würdig.
theological_decisions:
- issue: Art des in תְּרוּעָה bezeichneten Lautes
  choice: lautes Signal
  alternative: Trompeten- oder Hornstöße; lauter Jubelruf
  rationale: Das Hebräische kann sowohl einen Ruf als auch einen mit Horn oder Trompete erzeugten Signalton bezeichnen. Da im Vers kein Instrument genannt wird, bleibt die Hauptübersetzung bewusst offen; die verbreitete Deutung als Horn- oder Trompetensignal wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede bleibt erhalten; die kultischen Begriffe werden verständlich wiedergegeben, ohne die Mehrdeutigkeit von תְּרוּעָה auf ein bestimmtes Instrument festzulegen.
