id: LEV.23.44
reference: Leviticus 23:44
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר מֹשֶׁ֔ה אֶת מֹעֲדֵ֖י יְהוָ֑ה אֶל בְּנֵ֖י יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/044.yaml
  text: So Moses declared the appointed times of Yahweh to the sons of Israel[a].
translation:
  language: de
  text: So gab Mose den Israeliten[a] die festgesetzten Zeiten Jahwes bekannt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „den Söhnen Israels“; traditionell: „den Kindern Israels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: gab … bekannt
  rationale: Das Piel von דבר bedeutet grundsätzlich „reden/mitteilen“. Im abschließenden Summarsatz gibt „bekannt geben“ die Mitteilung der zuvor dargelegten Ordnungen natürlich wieder und lässt sich im Deutschen gut mit dem direkten Objekt verbinden.
- source_word: מֹעֲדֵי
  choice: die festgesetzten Zeiten
  rationale: מוֹעֵד bezeichnet bestimmte beziehungsweise festgesetzte Zeiten oder Zusammenkünfte. Da Levitikus 23 auch den Sabbat einschließt, ist „Zeiten“ weiter und genauer als das enger wirkende „Feste“.
- source_word: יְהוָה
  choice: Jahwes
  rationale: Der Gottesname wird in der im Deutschen üblichen Form „Jahwe“ wiedergegeben; der Genitiv entspricht der hebräischen Status-constructus-Verbindung.
- source_word: אֶל
  choice: den … bekannt
  rationale: Die deutsche Konstruktion „jemandem etwas bekannt geben“ gibt die durch אֶל bezeichnete Adressatengruppe idiomatisch im Dativ wieder.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: den Israeliten
  rationale: Die feste hebräische Volksbezeichnung bedeutet wörtlich „Söhne Israels“. „Israeliten“ ist im modernen Deutschen die natürliche Bezeichnung für das gesamte Bundesvolk; die wörtliche Form wird in der Fußnote erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen JHWH. „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Umfang von מֹעֲדֵי
  choice: festgesetzte Zeiten
  alternative: Feste
  rationale: Die allgemeinere Wiedergabe bewahrt die Spannweite des Kapitels, das neben jährlichen Festen auch den Sabbat behandelt, und vermeidet eine unnötige kultische Verengung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der knappe abschließende Summarsatz bleibt erhalten; „So“ markiert seinen folgernden beziehungsweise zusammenfassenden Charakter. „Festgesetzte Zeiten“ ist verständlich und bewahrt die Breite des hebräischen Begriffs.
