  text: וְ/הִקְרַבְתֶּ֣ם עַל הַ/לֶּ֗חֶם שִׁבְעַ֨ת כְּבָשִׂ֤ים תְּמִימִם֙ בְּנֵ֣י שָׁנָ֔ה וּ/פַ֧ר בֶּן בָּקָ֛ר אֶחָ֖ד וְ/אֵילִ֣ם שְׁנָ֑יִם יִהְי֤וּ עֹלָה֙ לַֽ/יהוָ֔ה וּ/מִנְחָתָ/ם֙ וְ/נִסְכֵּי/הֶ֔ם אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/018.yaml
  text: And with the bread you shall present seven male lambs a year old[a], without blemish, and one bull from the herd, and two rams. They shall be a burnt offering to Yahweh, with their grain offering and their drink offerings, a food offering[b], a pleasing aroma to Yahweh.
translation:
  language: de
  text: 'Zusammen mit dem Brot[a] sollt ihr sieben einjährige, makellose männliche Lämmer darbringen, einen Stier aus dem Rindvieh und zwei Widder. Sie sollen ein Brandopfer für Jahwe sein, zusammen mit ihrem Speiseopfer und ihren Trankopfern: ein Feueropfer[b], ein wohlgefälliger Duft für Jahwe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „neben dem Brot“ beziehungsweise „zusätzlich zu dem Brot“. Die hebräische Präposition kann Begleitung oder Hinzufügung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Ausdruck bezeichnet eine durch Feuer dargebrachte Opfergabe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: sollt ihr … darbringen
  rationale: Das Hifil von קרב bezeichnet im Opferzusammenhang das Heranbringen beziehungsweise Darbringen einer Gabe; „darbringen“ ist im Deutschen natürlich und kultisch präzise.
- source_word: עַל הַלֶּחֶם
  choice: zusammen mit dem Brot
  rationale: עַל kann hier Begleitung oder Hinzufügung ausdrücken. Gemeint ist nicht, dass die Tiere körperlich auf das Brot gelegt werden.
- source_word: שִׁבְעַת כְּבָשִׂים תְּמִימִם בְּנֵי שָׁנָה
  choice: sieben einjährige, makellose männliche Lämmer
  rationale: Die Wiedergabe bewahrt Anzahl, Geschlecht, Alter und die kultische Forderung nach Fehlerlosigkeit.
- source_word: וּפַר בֶּן בָּקָר אֶחָד
  choice: einen Jungstier aus der Rinderherde
  rationale: Die Wendung bezeichnet einen Stier aus dem Rindvieh; „Jungstier“ gibt die Altersnuance knapp und idiomatisch wieder.
- source_word: עֹלָה
  choice: Brandopfer
  rationale: Dies ist der etablierte deutsche Fachausdruck für das Opfer, das vollständig auf dem Altar verbrannt wird; der hebräische Singular fasst die genannten Tiere kollektiv zusammen.
- source_word: מִנְחָתָם וְנִסְכֵּיהֶם
  choice: ihrem Speiseopfer und ihren Trankopfern
  rationale: מִנְחָה bezeichnet hier die begleitende Getreidegabe, נֶסֶךְ die ausgegossene Getränkegabe. Numerus und Bezug der hebräischen Suffixe bleiben erhalten.
- source_word: אִשֵּׁה
  choice: Feueropfer
  rationale: Der kultische Ausdruck bezeichnet eine durch Feuer dargebrachte Opfergabe. „Feueropfer“ bewahrt dieses ausdrücklich erkennbare Element und bleibt verständlich.
- source_word: רֵיחַ נִיחֹחַ
  choice: von wohlgefälligem Duft
  rationale: Die feste Opferformel bezeichnet einen angenehmen beziehungsweise besänftigenden Duft; „wohlgefällig“ gibt die positive Wirkung wieder, ohne sie rein sinnlich zu verengen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung der Opferformel רֵיחַ נִיחֹחַ
  choice: von wohlgefälligem Duft
  alternative: von beruhigendem Duft
  rationale: Die Formulierung bewahrt die Aussage, dass die Opfergabe Jahwe angenehm ist, ohne genauer festzulegen, ob ניחוח vor allem „angenehm“ oder „besänftigend“ bedeutet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kultischen Fachbegriffe „Brandopfer“, „Speiseopfer“, „Trankopfer“ und „Feueropfer“ bleiben wegen ihrer Präzision erhalten; Satzbau und Wortfolge sind für heutige Leser geglättet.
