id: LEV.23.11
reference: Leviticus 23:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הֵנִ֧יף אֶת הָ/עֹ֛מֶר לִ/פְנֵ֥י יְהוָ֖ה לִֽ/רְצֹנְ/כֶ֑ם מִֽ/מָּחֳרַת֙ הַ/שַּׁבָּ֔ת יְנִיפֶ֖/נּוּ הַ/כֹּהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/011.yaml
  text: And he shall wave the sheaf before Yahweh for your acceptance[a]; on the day after the Sabbath the priest shall wave it.
translation:
  language: de
  text: Und er soll die Garbe vor Jahwe schwingen, damit ihr angenommen werdet[a]; am Tag nach dem Sabbat soll der Priester sie schwingen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu eurer Annahme“. Die hebräische Wendung kann ausdrücken, dass die Opfernden durch die Gabe vor Jahwe Annahme finden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵנִיף
  choice: Und er soll … schwingen
  rationale: Der Hifil von נוּף bezeichnet hier die kultische Handlung des Schwingens beziehungsweise Darbringens; „schwingen“ bewahrt das konkrete Ritual.
- source_word: הָעֹמֶר
  choice: die Garbe
  rationale: עֹמֶר bezeichnet in diesem Zusammenhang die als Erstlingsgabe dargebrachte Getreidegarbe, nicht vorrangig ein Hohlmaß.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: Die Wendung bezeichnet die Darbringung in Gottes Gegenwart; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: לִרְצֹנְכֶם
  choice: damit ihr angenommen werdet
  rationale: Die Formulierung bringt die Annahme der Gottesdienstteilnehmer durch die dargebrachte Gabe zum Ausdruck und ist im Deutschen natürlicher als das substantivische „zu eurer Annahme“.
- source_word: מִמָּחֳרַת הַשַּׁבָּת
  choice: am Tag nach dem Sabbat
  rationale: Dies gibt die zeitliche Bestimmung klar und in modernem Deutsch wieder.
- source_word: יְנִיפֶנּוּ
  choice: soll … sie schwingen
  rationale: Das Objektpronomen bezieht sich auf die feminine deutsche Entsprechung „Garbe“; derselbe Ritualbegriff wird wie im ersten Satzteil wiederholt.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Übliche und sachlich genaue Wiedergabe des kultischen Amtes כֹּהֵן.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen; „Jahwe“ gibt ihn im modernen deutschen Bibelregister unmittelbar wieder.
- issue: Bedeutung von לִרְצֹנְכֶם im Opferkontext
  choice: damit ihr angenommen werdet
  alternative: zu eurem Wohlgefallen / zu eurer Annahme
  rationale: Die gewählte Fassung wahrt den möglichen Bezug auf die Annahme der Gottesdienstteilnehmer, ohne zu behaupten, die Gabe diene ihrem eigenen Wohlgefallen. Die grammatische Kürze und Bedeutungsweite des Hebräischen wird in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erkennbarer kultischer Terminologie. „Schwingen“ wird bewusst wiederholt, um die Wiederholung des hebräischen Verbs abzubilden; die mehrdeutige Annahmeformel wird durch eine Fußnote offengehalten.
