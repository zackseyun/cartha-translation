  text: אֵ֚לֶּה מוֹעֲדֵ֣י יְהוָ֔ה מִקְרָאֵ֖י קֹ֑דֶשׁ אֲשֶׁר תִּקְרְא֥וּ אֹתָ֖/ם בְּ/מוֹעֲדָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/004.yaml
  text: These are the appointed times of Yahweh[a], holy convocations[b], which you shall proclaim at their appointed times.
translation:
  language: de
  text: Dies sind die festgesetzten Zeiten[a] Jahwes, heilige Versammlungen[b], die ihr zu ihren festgesetzten Zeiten ausrufen sollt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „festgesetzte Feste“ oder „bestimmte Zeiten“. Das hebräische Wort מוֹעֲדֵי ist weiter gefasst als Mahlzeiten oder Feste und bezeichnet von Jahwe festgesetzte Zeiten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „heilige Zusammenkünfte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Dies sind
  rationale: Das deiktische Pluralpronomen leitet die folgende Aufzählung ein; im Deutschen ist die Ergänzung der Kopula natürlich.
- source_word: מוֹעֲדֵי
  choice: festgesetzten Zeiten
  rationale: מוֹעֵד bezeichnet eine bestimmte beziehungsweise festgesetzte Zeit oder Zusammenkunft. In Levitikus 23 ist der Ausdruck weiter als „Feste“, da das Kapitel auch andere geheiligte Zeiten behandelt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Umschrift.
- source_word: מִקְרָאֵי קֹדֶשׁ
  choice: heilige Versammlungen
  rationale: Die Verbindung bezeichnet zu heiligem Zweck einberufene Zusammenkünfte. „Versammlungen“ ist im heutigen Deutsch verständlicher als das fachsprachliche „Einberufungen“.
- source_word: תִּקְרְאוּ
  choice: ihr … ausrufen sollt
  rationale: קרא meint hier das öffentliche Bekanntgeben beziehungsweise Ausrufen der heiligen Termine, nicht bloß deren Benennung.
- source_word: בְּמוֹעֲדָם
  choice: jeweils zur festgesetzten Zeit
  rationale: Die Form bezeichnet den zu jeder Feier gehörenden bestimmten Termin. „Jeweils“ macht den distributiven Sinn im Deutschen deutlich und wahrt zugleich die Wiederaufnahme von מוֹעֵד.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. Die Wiedergabe „Jahwe“ bewahrt diesen, statt ihn durch den traditionellen Ersatztitel zu ersetzen.
- issue: Bezug des Relativsatzes
  choice: Der Relativsatz bleibt so formuliert, dass die festgesetzten Zeiten als heilige Versammlungen ausgerufen werden.
  alternative: Ausdrückliche Auflösung als „die ihr als heilige Versammlungen ausrufen sollt“
  rationale: Die appositionale hebräische Syntax lässt die Beziehung zwischen den „festgesetzten Zeiten“ und den „heiligen Versammlungen“ eng, ohne ein zusätzliches erklärendes „als“ ausdrücklich zu setzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Festgesetzte Zeiten“ bewahrt die zeitliche Bedeutung und die Wiederholung des hebräischen Leitworts; „heilige Versammlungen“ ist verständlich, ohne den feierlich-religiösen Ton einzuebnen.
