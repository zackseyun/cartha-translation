  to: Sein Speiseopfer soll aus zwei Zehnteln eines Efa Feinmehl bestehen, mit Öl vermengt. Es ist ein Feueropfer für Jahwe, ein angenehmer Duft. Sein Trankopfer soll aus einem Viertel Hin Wein bestehen.
