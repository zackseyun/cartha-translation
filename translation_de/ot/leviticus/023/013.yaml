  text: וּ/מִנְחָת/וֹ֩ שְׁנֵ֨י עֶשְׂרֹנִ֜ים סֹ֣לֶת בְּלוּלָ֥ה בַ/שֶּׁ֛מֶן אִשֶּׁ֥ה לַ/יהוָ֖ה רֵ֣יחַ נִיחֹ֑חַ וְ/נִסְכֹּ֥/ה יַ֖יִן רְבִיעִ֥ת הַ/הִֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/013.yaml
  text: Its grain offering shall be two-tenths of an ephah of fine flour mixed with oil[a], a food offering to Yahweh, a pleasing aroma; and its drink offering shall be wine, a fourth of a hin.
translation:
  language: de
  text: Sein Speiseopfer soll aus zwei Zehnteln eines Efa Feinmehl bestehen, mit Öl vermengt. Es ist ein Feueropfer für Jahwe, ein angenehmer Duft. Sein Trankopfer soll aus einem Viertel Hin Wein bestehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִנְחָתוֹ
  choice: Sein Speiseopfer
  rationale: מִנְחָה bezeichnet im kultischen Zusammenhang ein Speise- beziehungsweise Getreideopfer; das Suffix der 3. Person Singular bezieht sich auf das zuvor genannte Lamm.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: zwei Zehntel eines Efa
  rationale: Der Ausdruck bezeichnet zwei Zehntel der in priesterlichen Texten vorausgesetzten Maßeinheit Efa; die Ergänzung macht die implizite Bezugsgröße verständlich.
- source_word: סֹלֶת
  choice: Feinmehl
  rationale: Dies ist die etablierte und präzise deutsche Entsprechung für das bei Opfergaben verwendete feine Mehl.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: mit Öl vermengt
  rationale: Das passive Partizip beschreibt das Vermischen des Mehls mit Öl; „vermengt“ wahrt den rituellen Ton und ist gut verständlich.
- source_word: אִשֶּׁה לַיהוָה
  choice: als Feueropfer für Jahwe
  rationale: אִשֶּׁה ist ein kultischer Fachausdruck für eine durch Feuer dargebrachte Gabe. „Feueropfer“ bildet diesen Bezug direkter ab als die mögliche Wiedergabe „Speisegabe“.
- source_word: רֵיחַ נִיחֹחַ
  choice: ein angenehmer Duft
  rationale: Die feste kultische Wendung bezeichnet einen als wohltuend beziehungsweise wohlgefällig beschriebenen Duft; die Übersetzung bewahrt das konkrete Bild.
- source_word: וְנִסְכֹּה
  choice: Das dazugehörige Trankopfer
  rationale: נֶסֶךְ bezeichnet eine ausgegossene Flüssigkeitsgabe. „Trankopfer“ ist die gebräuchliche deutsche Entsprechung; „dazugehörig“ gibt den rückbezüglichen Suffix natürlich wieder.
- source_word: יַיִן
  choice: Wein
  rationale: Direkte lexikalische Entsprechung.
- source_word: רְבִיעִת הַהִין
  choice: ein Viertel Hin
  rationale: Der Bruchteil wird natürlich deutsch wiedergegeben, während die antike Maßeinheit Hin erhalten bleibt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Bundesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von אִשֶּׁה
  choice: Feueropfer
  alternative: Speisegabe
  rationale: Die Etymologie und der kultische Gebrauch weisen auf eine mittels Feuer dargebrachte Gabe. Die Übersetzung lässt offen, wie genau das Opfer als göttliche „Speise“ zu verstehen ist, und vermeidet eine unnötige theologische Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit etablierten kultischen Begriffen. Die alten Maßeinheiten Efa und Hin bleiben erhalten; der Satzbau wurde für natürliche deutsche Lesbarkeit leicht gegliedert.
