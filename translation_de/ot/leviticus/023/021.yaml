id: LEV.23.21
reference: Leviticus 23:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/קְרָאתֶ֞ם בְּ/עֶ֣צֶם הַ/יּ֣וֹם הַ/זֶּ֗ה מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֣א תַעֲשׂ֑וּ חֻקַּ֥ת עוֹלָ֛ם בְּ/כָל מוֹשְׁבֹ֥תֵי/כֶ֖ם לְ/דֹרֹֽתֵי/כֶֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/021.yaml
  text: And on that very day you shall proclaim a holy convocation[a]; you shall do no laborious work[c][b]. It is a permanent statute throughout your dwellings for your generations.
translation:
  language: de
  text: An eben diesem Tag sollt ihr eine heilige Versammlung[a] ausrufen. Ihr dürft keinerlei gewöhnliche Arbeit[b] verrichten. Das ist eine bleibende Ordnung[c] an all euren Wohnorten, von Generation zu Generation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine heilige Zusammenkunft“; gemeint ist eine feierlich einberufene Versammlung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „keine Arbeit des Dienstes“; gemeint ist gewöhnliche Arbeits- oder Diensttätigkeit.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „eine immerwährende Satzung“ beziehungsweise „eine dauerhafte Bestimmung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְרָאתֶם
  choice: sollt ihr … ausrufen
  rationale: קרא bezeichnet hier die öffentliche, verbindliche Ausrufung einer kultischen Versammlung; „ausrufen“ gibt diesen offiziellen Sinn in natürlichem Deutsch wieder.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: an eben diesem Tag
  rationale: Die Wendung hebt den genauen Tag nachdrücklich hervor; „eben diesem“ bewahrt diese Betonung.
- source_word: מִקְרָא קֹדֶשׁ
  choice: eine heilige Versammlung
  rationale: Die feste kultische Wendung bezeichnet eine einberufene, dem Heiligen gewidmete Zusammenkunft. „Heilige Versammlung“ ist verständlich und bewahrt den sakralen Charakter.
- source_word: יִהְיֶה לָכֶם
  choice: in die Formulierung „sollt ihr eine heilige Versammlung ausrufen“ einbezogen
  rationale: Die hebräische Prädikation bestimmt, was dieser Tag für Israel sein soll. Im Deutschen lässt sich ihr Gehalt ohne schwerfällige Wiederholung in die Aufforderung integrieren.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: keinerlei gewöhnliche Arbeit
  rationale: Die Wortgruppe bezeichnet Arbeits- beziehungsweise Diensttätigkeit und nicht unterschiedslos jede denkbare Handlung. „Gewöhnliche Arbeit“ wahrt diese sachliche Begrenzung.
- source_word: לֹא תַעֲשׂוּ
  choice: dürft … nicht verrichten
  rationale: Die Formulierung gibt das rechtliche Verbot klar und idiomatisch wieder.
- source_word: חֻקַּת עוֹלָם
  choice: eine bleibende Ordnung
  rationale: עוֹלָם bezeichnet in dieser Rechtsformel fortdauernde Geltung. „Bleibend“ ist modernes Deutsch und vermeidet eine unnötige metaphysische Festlegung.
- source_word: בְּכָל מוֹשְׁבֹתֵיכֶם
  choice: an all euren Wohnorten
  rationale: Die Wendung erstreckt die Bestimmung auf sämtliche Orte, an denen das Volk wohnt.
- source_word: לְדֹרֹתֵיכֶם
  choice: von Generation zu Generation
  rationale: Die idiomatische deutsche Wendung bringt die fortlaufende Geltung für die aufeinanderfolgenden Generationen zum Ausdruck.
theological_decisions:
- issue: Umfang des Arbeitsverbots im Festgesetz
  choice: כָּל מְלֶאכֶת עֲבֹדָה wird als „keinerlei gewöhnliche Arbeit“ wiedergegeben.
  alternative: „überhaupt keine Arbeit“ oder „keine Erwerbsarbeit“
  rationale: Die hebräische Rechtsformel bezieht sich auf gewöhnliche Arbeits- oder Diensttätigkeit und untersagt nicht ausdrücklich jede nur denkbare Handlung. Die Übersetzung vermeidet daher eine strengere Sabbatregel in den Text hineinzulesen.
- issue: Zeitliche Reichweite von חֻקַּת עוֹלָם
  choice: „bleibende Ordnung“
  alternative: „ewige Satzung“ oder „immerwährende Ordnung“
  rationale: Die rechtliche Formel betont fortdauernde Geltung über die Generationen hinweg. Die Übersetzung bewahrt diese Aussage, ohne die mögliche Spannweite von עוֹלָם dogmatisch auf eine abstrakt-unendliche Dauer festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer rechtlicher Tonlage. Die kultische Fachsprache bleibt erkennbar, wird aber durch allgemein verständliche Wörter wiedergegeben.
