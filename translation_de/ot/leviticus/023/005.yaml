id: LEV.23.5
reference: Leviticus 23:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בַּ/חֹ֣דֶשׁ הָ/רִאשׁ֗וֹן בְּ/אַרְבָּעָ֥ה עָשָׂ֛ר לַ/חֹ֖דֶשׁ בֵּ֣ין הָ/עַרְבָּ֑יִם פֶּ֖סַח לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/005.yaml
  text: In the first month[a], on the fourteenth day of the month, at twilight[b], is the Passover to Yahweh.
translation:
  language: de
  text: Im ersten Monat, am vierzehnten Tag des Monats, in der Abenddämmerung[a], ist das Passa für Jahwe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zwischen den Abenden“, eine hebräische Wendung für die Dämmerungszeit um den Sonnenuntergang.'
    reason: lexical_alternative
  - marker: b
    text: „Passa“ kann hier auch das Passaopfer beziehungsweise den Passaopfer-Ritus bezeichnen.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: Im ersten Monat
  rationale: חֹדֶשׁ bezeichnet in diesem kalendarischen Zusammenhang einen Monat; zusammen mit הָרִאשׁוֹן ist der erste Monat des Festkalenders gemeint.
- source_word: בְּאַרְבָּעָה עָשָׂר לַחֹדֶשׁ
  choice: am vierzehnten Tag des Monats
  rationale: Die Ergänzung „Tag“ gibt die hebräische Datumsformel im Deutschen eindeutig und natürlich wieder.
- source_word: בֵּין הָעַרְבָּיִם
  choice: in der Abenddämmerung
  rationale: Die wörtliche Wendung „zwischen den Abenden“ bezeichnet einen Zeitraum um den Sonnenuntergang. „In der Abenddämmerung“ ist verständliches modernes Deutsch; die wörtliche Form bleibt in der Fußnote erhalten.
- source_word: פֶּסַח
  choice: das Passa
  rationale: פֶּסַח kann das Fest beziehungsweise den Ritus oder auch das Opfer bezeichnen. „Das Passa“ bewahrt im Haupttext die größere Bedeutungsbreite.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition ל kann hier Widmung oder Zugehörigkeit ausdrücken. „Für Jahwe“ ist im Deutschen natürlich und gibt diese Beziehung wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen יהוה. „Jahwe“ gibt den Namen als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von פֶּסַח im kultischen Zusammenhang
  choice: das Passa
  alternative: das Passaopfer; das Passaschlachtopfer
  rationale: Der Festkalender legt die Bezeichnung des Passas nahe, doch das Wort kann zugleich den Opferbrauch oder das Opfertier meinen. Diese kultische Bedeutungsnuance wird nicht ausgeschlossen, sondern in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe kalendarische Satzform des Hebräischen bleibt erkennbar; echte lexikalische Mehrdeutigkeiten werden durch Fußnoten offengehalten.
