  source_fidelity: 'Die Übersetzung gibt die hebräische Struktur und den Sinn zuverlässig wieder: die zweimalige Aufforderung zu חגג wird mit „feiern“ wiederholt, die siebentägige Dauer, die jährliche Einordnung, die dauerhafte Satzung für künftige Generationen und der siebte Monat bleiben erhalten. „Für Yahweh“ ist für לַיהוָה in diesem Widmungskontext angemessen.'
