  terminology: „Yahweh“ entspricht der angegebenen Entscheidung für יהוה. „Fest“ für חַג und „bleibende Ordnung“ für חֻקַּת עוֹלָם sind sachgerecht. Die Fußnote bewahrt mit „ewige Ordnung“ die traditionelle Alternative, ohne die Bedeutung von עוֹלָם einseitig absolut festzulegen.
