id: LEV.23.41
reference: Leviticus 23:41
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/חַגֹּתֶ֤ם אֹת/וֹ֙ חַ֣ג לַֽ/יהוָ֔ה שִׁבְעַ֥ת יָמִ֖ים בַּ/שָּׁנָ֑ה חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם בַּ/חֹ֥דֶשׁ הַ/שְּׁבִיעִ֖י תָּחֹ֥גּוּ אֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/041.yaml
  text: You shall celebrate it as a feast to Yahweh for seven days in the year[a]. It is a permanent statute throughout your generations[b]; in the seventh month you shall celebrate it.
translation:
  language: de
  text: Ihr sollt es sieben Tage im Jahr als Fest für Yahweh feiern. Das ist eine bleibende Ordnung für alle eure Generationen[a]. Im siebten Monat sollt ihr es feiern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: »eine Ordnung auf unabsehbare Zeit für eure Generationen«; traditionell: »eine ewige Ordnung«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחַגֹּתֶם / תָּחֹגּוּ
  choice: sollt ... feiern
  rationale: חָגַג bezeichnet das Feiern beziehungsweise Begehen eines Festes, besonders eines Wallfahrtsfestes. „Feiern“ ist im modernen Deutsch natürlich und gibt das wiederholte Verb an beiden Stellen einheitlich wieder.
- source_word: אֹתוֹ
  choice: es
  rationale: Das Pronomen verweist auf das im Zusammenhang genannte Fest. „Es“ bewahrt die knappe Ausdrucksweise des Hebräischen.
- source_word: חַג
  choice: Fest
  rationale: חַג bezeichnet ein religiöses Fest, häufig mit Wallfahrtscharakter. „Fest“ ist hier klar und in kultischen Zusammenhängen angemessen.
- source_word: לַיהוָה
  choice: für Yahweh
  rationale: Die Präposition ל kennzeichnet hier die Ausrichtung beziehungsweise Widmung des Festes. „Für Yahweh“ ist im Deutschen natürlich; „Yahweh“ gibt den im Text stehenden Gottesnamen wieder.
- source_word: שִׁבְעַת יָמִים
  choice: sieben Tage
  rationale: Die Wortgruppe bezeichnet die Dauer des Festes. Im Deutschen ist nach „feiern“ keine zusätzliche Präposition nötig.
- source_word: בַּשָּׁנָה
  choice: im Jahr
  rationale: Dies entspricht der formalen Wendung des Hebräischen. Im Kontext ist ein jährlich wiederkehrendes Fest gemeint.
- source_word: חֻקַּת עוֹלָם
  choice: eine bleibende Ordnung
  rationale: חֻקָּה bezeichnet eine verbindliche Festsetzung; עוֹלָם drückt hier deren fortdauernde Geltung aus. „Bleibende Ordnung“ ist verständlich und vermeidet eine unnötige Festlegung auf philosophisch absolute Zeitlosigkeit.
- source_word: לְדֹרֹתֵיכֶם
  choice: für alle eure Generationen
  rationale: Die Wendung beschreibt die fortgesetzte Geltung über die aufeinanderfolgenden Generationen hinweg.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: im siebten Monat
  rationale: Die direkte zeitliche Angabe legt den Monat der Feier fest.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm יהוה. „Yahweh“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Zeitliche Tragweite von עוֹלָם in der Kultgesetzgebung
  choice: bleibende Ordnung
  alternative: ewige Ordnung; immerwährende Satzung
  rationale: עוֹלָם bezeichnet hier eine fortdauernde, generationenübergreifende Geltung, ohne zwingend eine Aussage über metaphysisch unbegrenzte Zeit zu machen. Die Formulierung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „feiern“ folgt bewusst dem wiederholten hebräischen Verb. Die leichte Doppelung „sieben Tage im Jahr“ und „im siebten Monat“ bleibt erhalten, weil sie die Struktur und Betonung des Ausgangstextes wiedergibt.
