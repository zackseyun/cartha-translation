source:
  edition: WLC
  text: וַ/עֲשִׂיתֶ֛ם שְׂעִיר עִזִּ֥ים אֶחָ֖ד לְ/חַטָּ֑את וּ/שְׁנֵ֧י כְבָשִׂ֛ים בְּנֵ֥י שָׁנָ֖ה לְ/זֶ֥בַח שְׁלָמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/019.yaml
  text: And you shall offer one male goat for a sin offering[b][a], and two male lambs a year old for a sacrifice of peace offerings.
translation:
  language: de
  text: Ihr sollt einen Ziegenbock als Sündopfer[a] und zwei einjährige männliche Lämmer als Friedensopfer[b] darbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Reinigungsopfer“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Gemeinschaftsopfer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: ihr sollt … darbringen
  rationale: Das Verb bedeutet grundsätzlich „tun/machen“, bezeichnet hier im Opferkontext aber idiomatisch das Darbringen der vorgeschriebenen Tiere.
- source_word: שְׂעִיר עִזִּים אֶחָד
  choice: einen Ziegenbock
  rationale: Die Wendung bezeichnet ausdrücklich ein männliches Tier der Ziegen; „Ziegenbock“ gibt Geschlecht und Tierart knapp und natürlich wieder.
- source_word: לְחַטָּאת
  choice: als Sündopfer
  rationale: „Sündopfer“ ist die geläufige deutsche Bezeichnung dieser Opferart; ihre ebenfalls mögliche Deutung als Reinigungsopfer wird in einer Fußnote bewahrt.
- source_word: וּשְׁנֵי כְבָשִׂים בְּנֵי שָׁנָה
  choice: und zwei einjährige männliche Lämmer
  rationale: Die Zahl, das im kultischen Zusammenhang bezeichnete männliche Geschlecht und die Altersangabe werden ausdrücklich wiedergegeben.
- source_word: לְזֶבַח שְׁלָמִים
  choice: als Friedensopfer
  rationale: „Friedensopfer“ bleibt dem mit שׁלם verbundenen hebräischen Ausdruck nahe und bezeichnet in verständlichem Deutsch die Opferkategorie; זֶבַח ist durch den Opferbegriff sinngemäß eingeschlossen.
theological_decisions:
- issue: Bedeutung von חַטָּאת in der Opfergesetzgebung
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: Der hebräische Begriff kann sowohl in Bezug auf Sünde als auch auf die reinigende Funktion des Opfers verstanden werden. Der Haupttext verwendet die traditionelle, weithin verständliche Bezeichnung, ohne die funktionale Alternative zu verschweigen.
- issue: Bedeutung von שְׁלָמִים
  choice: Friedensopfer
  alternative: Gemeinschaftsopfer
  rationale: „Friedensopfer“ ist sprachlich näher am hebräischen Wortfeld von שׁלם; „Gemeinschaftsopfer“ hebt einen Aspekt der Opferpraxis hervor, legt die Bedeutung jedoch stärker aus.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede im Plural und der gesetzliche Soll-Ausdruck entsprechen dem hebräischen Text. Fachbegriffe der Opfergesetzgebung bleiben verständlich und werden bei echter Bedeutungsbreite durch knappe Fußnoten ergänzt.
