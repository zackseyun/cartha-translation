  variant: modern standard German
source:
  edition: WLC
  text: אַ֡ךְ בַּ/חֲמִשָּׁה֩ עָשָׂ֨ר י֜וֹם לַ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֗י בְּ/אָסְפְּ/כֶם֙ אֶת תְּבוּאַ֣ת הָ/אָ֔רֶץ תָּחֹ֥גּוּ אֶת חַג יְהוָ֖ה שִׁבְעַ֣ת יָמִ֑ים בַּ/יּ֤וֹם הָֽ/רִאשׁוֹן֙ שַׁבָּת֔וֹן וּ/בַ/יּ֥וֹם הַ/שְּׁמִינִ֖י שַׁבָּתֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/039.yaml
  text: However[a], on the fifteenth day of the seventh month, when you have gathered in the produce of the land, you shall celebrate the feast of Yahweh for seven days. On the first day there shall be a solemn rest[b], and on the eighth day a solemn rest.
translation:
  language: de
  text: Doch am fünfzehnten Tag des siebten Monats, wenn ihr den Ertrag des Landes eingebracht habt, sollt ihr sieben Tage lang das Fest[a] Jahwes feiern. Am ersten Tag soll eine feierliche Ruhezeit[b] sein und am achten Tag eine feierliche Ruhezeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Wallfahrtsfest Jahwes“. Das hebräische Wort bezeichnet ein Fest, häufig mit dem Gedanken einer Wallfahrt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „eine Sabbatruhe“. Das hebräische Wort bezeichnet eine besondere Ruhezeit im Rahmen einer heiligen Feier.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Doch
  rationale: Die Partikel markiert hier einen Übergang beziehungsweise eine nähere Bestimmung der vorausgehenden Festanweisungen. „Doch“ gibt diese leichte Abgrenzung wieder, ohne einen zu starken Gegensatz zu erzeugen.
- source_word: בְּאָסְפְּכֶם
  choice: wenn ihr … eingebracht habt
  rationale: Die Infinitivkonstruktion mit בְּ bezeichnet den zeitlichen Umstand; die abgeschlossene Formulierung passt zum Einbringen des Ertrags vor der Feier.
- source_word: תְּבוּאַת הָאָרֶץ
  choice: den Ertrag des Landes
  rationale: תְּבוּאָה bezeichnet allgemein den Ertrag oder die Hervorbringung des Landes und sollte nicht unnötig auf Getreide beschränkt werden.
- source_word: תָּחֹגּוּ אֶת חַג
  choice: sollt ihr … das Fest … feiern
  rationale: Die Verbindung von חגג und חַג wird im Deutschen natürlich mit „ein Fest feiern“ wiedergegeben; der Festcharakter bleibt ausdrücklich erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben, nicht durch einen Titel ersetzt.
- source_word: שַׁבָּתוֹן
  choice: eine feierliche Ruhezeit
  rationale: Das Wort bezeichnet eine besonders geprägte, heilige Ruhe beziehungsweise Arbeitsruhe. „Feierliche Ruhezeit“ wahrt den Festbezug, ohne sie mit dem wöchentlichen Sabbat gleichzusetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Tetragrammaton als Gottesnamen. „Jahwe“ bewahrt seinen Charakter als Eigenname und importiert keine bloße Titelersetzung.
- issue: Bedeutung von שַׁבָּתוֹן im Festkalender
  choice: feierliche Ruhezeit
  alternative: Sabbatruhe
  rationale: Gemeint ist eine sakral bestimmte Arbeitsruhe an einem Festtag. Die gewählte Fassung lässt den Bezug zum Sabbatwort erkennen, identifiziert den Tag aber nicht vorschnell mit dem wöchentlichen Sabbat.
- issue: Verhältnis von sieben Festtagen und dem achten Tag
  choice: Die Angaben werden ohne Harmonisierung nebeneinandergestellt
  alternative: Den achten Tag ausdrücklich als außerhalb des Festes erklären
  rationale: Der Vers spricht von einer siebentägigen Feier und nennt anschließend eine Ruhezeit am achten Tag. Die Übersetzung bewahrt diese Spannung, statt den kalendarischen Zusammenhang erklärend festzulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem gesetzlichem Stil. Die Pluralanrede „ihr“ entspricht der hebräischen Form. „Ruhezeit“ vermeidet sowohl archaische Ausdrucksweise als auch eine vorschnelle Gleichsetzung mit dem wöchentlichen Sabbat.
