source:
  edition: WLC
  text: וְ/כָל הַ/נֶּ֗פֶשׁ אֲשֶׁ֤ר תַּעֲשֶׂה֙ כָּל מְלָאכָ֔ה בְּ/עֶ֖צֶם הַ/יּ֣וֹם הַ/זֶּ֑ה וְ/הַֽאֲבַדְתִּ֛י אֶת הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/קֶּ֥רֶב עַמָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/030.yaml
  text: And every person who does any work on this very day—I will destroy that person from among his people[a].
translation:
  language: de
  text: Und jeden Menschen, der an ebendiesem Tag irgendeine Arbeit verrichtet, werde ich aus der Mitte seines Volkes auslöschen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werde ich aus seinem Volk ausrotten“. Das hebräische Verb bedeutet hier „vernichten, zugrunde richten“; es ist nicht das gewöhnliche Verb für „ausrotten“, auch wenn ebenfalls die Entfernung durch ein Gericht gemeint ist.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: Mensch
  rationale: נֶפֶשׁ bezeichnet in diesem rechtlichen Zusammenhang eine einzelne Person, nicht eigens eine immaterielle Seele. „Mensch“ ist natürlich, würdig und schließt Personen unabhängig vom Geschlecht ein.
- source_word: תַּעֲשֶׂה כָּל מְלָאכָה
  choice: irgendeine Arbeit verrichtet
  rationale: עשה mit מְלָאכָה bedeutet idiomatisch „Arbeit verrichten“. „Irgendeine“ gibt die umfassende Geltung von כָּל wieder.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: an eben diesem Tag
  rationale: Die Wendung עֶצֶם הַיּוֹם hebt den bezeichneten Tag nachdrücklich hervor; „eben diesem“ bewahrt diese Betonung in natürlichem Deutsch.
- source_word: וְהַאֲבַדְתִּי
  choice: werde ich … vernichten
  rationale: Der Hifil von אבד bedeutet „zugrunde richten, vernichten“. Diese Wiedergabe wahrt die konkrete Verbwahl des Hebräischen und ersetzt sie nicht durch die übliche Formel „ausrotten/abschneiden“ für כרת.
- source_word: מִקֶּרֶב עַמָּהּ
  choice: aus der Mitte seines Volkes
  rationale: Die Formulierung gibt die Entfernung aus der Gemeinschaft eng wieder. Das feminine Suffix stimmt grammatisch mit נֶפֶשׁ überein; im Deutschen nimmt „seines“ den grammatisch maskulinen, generisch gebrauchten „Menschen“ auf.
theological_decisions:
- issue: Art der mit וְהַאֲבַדְתִּי ... מִקֶּרֶב עַמָּהּ bezeichneten Strafe
  choice: aus der Mitte seines Volkes vernichten
  alternative: aus seinem Volk ausrotten
  rationale: Im Hebräischen steht der Hifil von אבד („zugrunde richten/vernichten“), nicht das sonst oft für „ausrotten“ verwendete כרת. Der Haupttext erhält diese lexikalische Unterscheidung; die Fußnote nennt die im Gerichtskontext mögliche idiomatische Wiedergabe, ohne die genaue Art der Strafe über den Wortlaut hinaus festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bewahrt die nachdrückliche göttliche Gerichtsankündigung; „eben diesem Tag“ erhält die zeitliche Hervorhebung des Ausgangstextes.
