  naturalness: „Aus der Mitte seines Volkes auslöschen“ ist im Deutschen idiomatischer und verbindet die gerichtliche Vernichtung klar mit der genannten Gemeinschaft. „Ebendiesem“ ist als zusammengeschriebene Form modern und flüssig.
