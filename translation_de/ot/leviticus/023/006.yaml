id: LEV.23.6
reference: Leviticus 23:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/בַ/חֲמִשָּׁ֨ה עָשָׂ֥ר יוֹם֙ לַ/חֹ֣דֶשׁ הַ/זֶּ֔ה חַ֥ג הַ/מַּצּ֖וֹת לַ/יהוָ֑ה שִׁבְעַ֥ת יָמִ֖ים מַצּ֥וֹת תֹּאכֵֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/006.yaml
  text: And on the fifteenth day of this month is the Feast of Unleavened Bread to Yahweh[a]; for seven days you shall eat unleavened bread.
translation:
  language: de
  text: Am fünfzehnten Tag dieses Monats ist das Fest der ungesäuerten Brote für Jahwe[a]. Sieben Tage lang sollt ihr ungesäuertes Brot essen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jahwe zu Ehren“ beziehungsweise „Jahwe gehörend“. Die hebräische Präposition kann Widmung oder Zugehörigkeit ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֲמִשָּׁה עָשָׂר יוֹם
  choice: Am fünfzehnten Tag
  rationale: Die hebräische Datumsformel wird im modernen Deutschen natürlich als Ordinalzahl mit „Tag“ wiedergegeben. Das einleitende וּ muss im Deutschen nicht eigens mit „und“ abgebildet werden.
- source_word: לַחֹדֶשׁ הַזֶּה
  choice: dieses Monats
  rationale: Die Wendung bezeichnet den Tag innerhalb des bereits genannten Monats; der Genitiv ist die idiomatische deutsche Datumsangabe.
- source_word: חַג הַמַּצּוֹת
  choice: das Fest der ungesäuerten Brote
  rationale: חַג bezeichnet hier ein kultisches Fest. Der Plural מַצּוֹת wird in der Festbezeichnung als „ungesäuerte Brote“ wiedergegeben und bleibt damit näher an der hebräischen Form.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition ל kann hier die Zuordnung oder Widmung des Festes ausdrücken. „Für Jahwe“ ist im Deutschen natürlich und lässt diese Beziehung offen.
- source_word: שִׁבְעַת יָמִים
  choice: Sieben Tage lang
  rationale: Die unmarkierte Zeitdauer wird im Deutschen idiomatisch mit „lang“ ausgedrückt.
- source_word: מַצּוֹת
  choice: ungesäuertes Brot
  rationale: Außerhalb des Festnamens bezeichnet der hebräische Plural die Speisegattung; die deutsche Kollektivform ist natürlich und sachlich genau.
- source_word: תֹּאכֵלוּ
  choice: sollt ihr … essen
  rationale: Der Imperfekt hat im gesetzlichen Zusammenhang vorschreibende Kraft. „sollt ihr“ gibt diese verbindliche Anweisung würdig wieder, ohne sie unnötig zu verschärfen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt den Gottesnamen direkt wieder, statt ihn durch den traditionellen Ersatztitel „der HERR“ zu ersetzen.
- issue: Bedeutung der Präposition ל in לַיהוָה
  choice: für Jahwe
  alternative: Jahwe zu Ehren / dem Jahwe gehörenden
  rationale: Die Präposition kann Widmung, Bestimmung oder Zugehörigkeit ausdrücken. Die knappe Wiedergabe „für Jahwe“ bewahrt diese semantische Offenheit; die Fußnote nennt die wesentlichen Nuancen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung erhöht die Verständlichkeit, ohne den Zusammenhang zu verändern. Der Festname bleibt eng an der hebräischen Pluralform; der Gottesname wird als „Jahwe“ wiedergegeben.
