source:
  edition: WLC
  text: וְ/הִקְרַבְתֶּ֥ם אִשֶּׁ֛ה לַ/יהוָ֖ה שִׁבְעַ֣ת יָמִ֑ים בַּ/יּ֤וֹם הַ/שְּׁבִיעִי֙ מִקְרָא קֹ֔דֶשׁ כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/008.yaml
  text: And you shall present a food offering to Yahweh for seven days[a]. On the seventh day there shall be a holy convocation; you shall do no laborious work.
translation:
  language: de
  text: Sieben Tage lang sollt ihr Jahwe ein Feueropfer[a] darbringen. Am siebten Tag findet eine heilige Versammlung statt. Ihr dürft keinerlei gewöhnliche Arbeit verrichten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: eine im Feuer dargebrachte Opfergabe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: sollt ihr … darbringen
  rationale: Das Hifil von קרב bezeichnet im Opferkontext das Heranbringen beziehungsweise Darbringen einer Opfergabe. „Darbringen“ ist im Deutschen natürlich und kultisch präzise.
- source_word: אִשֶּׁה
  choice: Feueropfer
  rationale: Der priesterliche Fachausdruck bezeichnet eine Opfergabe, die auf dem Altar im Feuer dargebracht wird. „Feueropfer“ bewahrt diesen Bezug, ohne die unsichere Herleitung als „Speisegabe“ in den Haupttext einzutragen.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Die Präposition ל bezeichnet hier den Empfänger beziehungsweise die Widmung des Opfers; im deutschen Satz wird dies durch den Dativ ausgedrückt. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: שִׁבְעַת יָמִים
  choice: Sieben Tage lang
  rationale: Die Wendung bezeichnet die Dauer beziehungsweise die tägliche Darbringung innerhalb dieses Zeitraums. „Sieben Tage lang“ gibt den zeitlichen Sinn idiomatisch wieder.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: Am siebten Tag
  rationale: Direkte und natürliche Wiedergabe der Zeitangabe.
- source_word: מִקְרָא קֹדֶשׁ
  choice: eine heilige Versammlung
  rationale: Die feste Festterminologie bezeichnet eine einberufene heilige Zusammenkunft. „Heilige Versammlung“ ist verständlicher als das im heutigen Deutsch seltene „heilige Einberufung“.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: keinerlei gewöhnliche Arbeit
  rationale: Die Verbindung meint die reguläre Arbeits- beziehungsweise Erwerbstätigkeit, nicht ausnahmslos jede Handlung. „Gewöhnliche Arbeit“ vermeidet sowohl das missverständliche „jede Arbeit“ als auch das veraltete „knechtliche Arbeit“.
- source_word: לֹא תַעֲשׂוּ
  choice: Ihr dürft … nicht verrichten
  rationale: Die Formulierung gibt das verbindliche Verbot in natürlichem, gegenwärtigem Deutsch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von אִשֶּׁה
  choice: Feueropfer
  alternative: Speiseopfer; eine im Feuer dargebrachte Opfergabe
  rationale: Die genaue Etymologie und Bedeutungsnuance ist umstritten. „Feueropfer“ wahrt den klaren kultischen Feuerbezug; eine erläuternde Umschreibung wird in der Fußnote geboten, ohne eine bestimmte Opferart wie das Speiseopfer zu behaupten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kultische Fachsprache bleibt erkennbar, wird aber mit allgemein verständlichen Formulierungen verbunden. Der masoretische Absatzschluss nach dem Vers hat keinen eigenen Niederschlag im Einzelvers.
