base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/003.yaml
  text: For six days work may be done[a], but on the seventh day is a Sabbath of complete rest, a holy convocation. You shall do no work[b]; it is a Sabbath to Yahweh in all your dwellings.
translation:
  language: de
  text: Sechs Tage lang darf gearbeitet werden, aber am siebten Tag ist ein Sabbat völliger Ruhe[a], eine heilige Versammlung. Ihr sollt keinerlei Arbeit tun. Es ist ein Sabbat für Jahwe an allen euren Wohnorten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Sabbat der Ruhe“ oder „ein Sabbat feierlicher Ruhe“. Die hebräische Wendung verstärkt den Gedanken der Sabbatruhe.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in allen euren Siedlungen“ beziehungsweise „überall, wo ihr wohnt“. Das hebräische Wort kann Wohnorte oder angesiedelte Gemeinschaften bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּעָשֶׂה מְלָאכָה
  choice: darf gearbeitet werden
  rationale: Die passive Form und ihre erlaubende beziehungsweise allgemein feststellende Aussage bleiben erhalten; zugleich klingt die unpersönliche deutsche Form natürlich.
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: ein Sabbat völliger Ruhe
  rationale: Die Wendung verstärkt den Gedanken vollständiger Arbeitsruhe und bewahrt zugleich den Begriff „Sabbat“.
- source_word: מִקְרָא קֹדֶשׁ
  choice: eine heilige Versammlung
  rationale: Die kultische Zusammenkunft wird in verständlichem, würdigem Deutsch wiedergegeben; der Begriff kann zugleich eine einberufene Versammlung bezeichnen.
- source_word: כָּל מְלָאכָה לֹא תַעֲשׂוּ
  choice: Ihr dürft keinerlei Arbeit tun
  rationale: Die direkte Anrede im Plural und das umfassende Arbeitsverbot werden klar ausgedrückt.
- source_word: שַׁבָּת הִוא לַיהוָה
  choice: Es ist ein Sabbat für Jahwe
  rationale: „Für“ gibt die Ausrichtung des Sabbats auf Jahwe wieder, ohne die Beziehung einseitig als Besitzverhältnis festzulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  choice: in allen euren Wohnorten
  rationale: Die Formulierung bewahrt den räumlichen Geltungsbereich und lässt offen, ob einzelne Wohnplätze oder angesiedelte Gemeinschaften gemeint sind.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst; „Jahwe“ bewahrt ihn als persönlichen Namen.
- issue: Stärke der Wendung שַׁבַּת שַׁבָּתוֹן
  choice: ein Sabbat völliger Ruhe
  alternative: ein feierlicher Ruhetag
  rationale: Die gewählte Fassung erhält sowohl „Sabbat“ als auch die verstärkende Aussage umfassender Ruhe, ohne spätere theologische Deutungen einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die passive Aussage des ersten Satzes, die verstärkte Sabbatruhe und der räumliche Geltungsbereich bleiben erhalten; unnötig altertümliche Gesetzessprache wird vermieden.
