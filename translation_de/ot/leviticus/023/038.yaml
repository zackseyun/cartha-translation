  text: מִ/לְּ/בַ֖ד שַׁבְּתֹ֣ת יְּהוָ֑ה וּ/מִ/לְּ/בַ֣ד מַתְּנֽוֹתֵי/כֶ֗ם וּ/מִ/לְּ/בַ֤ד כָּל נִדְרֵי/כֶם֙ וּ/מִ/לְּ/בַד֙ כָּל נִדְב֣וֹתֵי/כֶ֔ם אֲשֶׁ֥ר תִּתְּנ֖וּ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/038.yaml
  text: besides the Sabbaths of Yahweh[a], and besides your gifts, and besides all your vows, and besides all your freewill offerings[b], which you give to Yahweh.
translation:
  language: de
  text: zusätzlich zu den Sabbaten Jahwes[a], zusätzlich zu euren Gaben, zusätzlich zu all euren Gelübden und zusätzlich zu all euren freiwilligen Gaben, die ihr Jahwe gebt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „abgesehen von“; so bei jeder Wiederholung von „zusätzlich zu“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּבַד
  choice: zusätzlich zu
  rationale: Die Wendung bezeichnet hier die genannten Gaben und Verpflichtungen als zusätzlich zu den zuvor angeordneten Festopfern. Die vierfache Wiederholung bildet die betonte hebräische Struktur nach.
- source_word: שַׁבְּתֹת יְהוָה
  choice: die Sabbate Jahwes
  rationale: Der Plural שַׁבְּתֹת wird als „Sabbate“ wiedergegeben; die Status-constructus-Verbindung mit dem Gottesnamen bleibt als Genitivverbindung erhalten.
- source_word: מַתְּנוֹתֵיכֶם
  choice: eure Gaben
  rationale: „Gaben“ gibt den weiten Sinn des Nomens natürlich wieder, ohne eine bestimmte Opferart hinzuzufügen.
- source_word: כָּל נִדְרֵיכֶם
  choice: all eure Gelübde
  rationale: נֶדֶר bezeichnet ein Gelübde beziehungsweise das Gelobte. „Gelübde“ bewahrt diese im Kontext verbleibende Bedeutungsweite.
- source_word: כָּל נִדְבֹתֵיכֶם
  choice: all eure freiwilligen Gaben
  rationale: Im kultischen Zusammenhang sind freiwillig dargebrachte Gaben gemeint. Diese Formulierung ist verständlich und vermeidet eine unnötige Verengung auf eine einzelne Opferklasse.
- source_word: אֲשֶׁר תִּתְּנוּ לַיהוָה
  choice: die ihr Jahwe gebt
  rationale: Das schlichte Verb „geben“ entspricht נתן. Der Relativsatz kann sich im Zusammenhang auf die koordinierten Gaben, Gelübde und freiwilligen Gaben beziehen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der im hebräischen Text stehende Eigenname wird als „Jahwe“ wiedergegeben. Das bewahrt den Charakter als Gottesname; „der HERR“ wäre die traditionelle Ersatzlesung.
- issue: Bezug von מִלְּבַד
  choice: zusätzlich zu
  alternative: abgesehen von
  rationale: Im gesetzlichen Zusammenhang werden die hier genannten Sabbate und Gaben nicht von den Festbestimmungen ausgenommen, sondern kommen zu ihnen hinzu. Die alternative Formulierung kann dieselbe Relation ausdrücken, ist im Deutschen jedoch leichter ausschließend misszuverstehen.
translation_notes:
  register: Moderner, würdiger Standarddeutsch-Stil. Die vierfache Wiederholung von מִלְּבַד bleibt zur Wahrung der hebräischen Betonung erhalten. „Sabbate“ wird als gewöhnliche Bezeichnung heiliger Ruhetage geschrieben; der Gottesname erscheint in der im Deutschen üblichen Form „Jahwe“.
