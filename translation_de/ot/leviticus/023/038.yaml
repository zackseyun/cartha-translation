  source_fidelity: Die Übersetzung gibt die wiederholte Präpositionalformel מִלְּבַד angemessen als „zusätzlich zu“ wieder und bewahrt ihre vierfache Struktur. Die Kategorien Sabbate, Gaben, Gelübde und freiwillige Gaben sowie der abschließende Relativsatz sind vollständig und in ihrer Reihenfolge wiedergegeben. „Zusätzlich zu“ ist im Opferkontext eine vertretbare kontextuelle Auslegung von מִלְּבַד, ohne den Sinn zu verändern.
  naturalness: Der Satz ist modernes, gut verständliches Standarddeutsch. Die bewusste Wiederholung von „zusätzlich zu“ wirkt zwar formal, entspricht aber der hervorgehobenen Wiederholung im Hebräischen und ist in diesem rechtlich-kultischen Register angemessen.
  terminology: „Jahwe“ gibt den Gottesnamen konsistent wieder. „Sabbaten“, „Gelübden“ und „freiwilligen Gaben“ sind sachgerecht. „Freiwillige Gaben“ bewahrt gegenüber „freiwilligen Opfergaben“ die im hebräischen Ausdruck mögliche Weite, während der Kontext die kultische Einordnung erkennen lässt.
