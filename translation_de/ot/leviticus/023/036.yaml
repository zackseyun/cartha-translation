  text: שִׁבְעַ֣ת יָמִ֔ים תַּקְרִ֥יבוּ אִשֶּׁ֖ה לַ/יהוָ֑ה בַּ/יּ֣וֹם הַ/שְּׁמִינִ֡י מִקְרָא קֹדֶשׁ֩ יִהְיֶ֨ה לָ/כֶ֜ם וְ/הִקְרַבְתֶּ֨ם אִשֶּׁ֤ה לַֽ/יהוָה֙ עֲצֶ֣רֶת הִ֔וא כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/036.yaml
  text: For seven days you shall present a food offering to Yahweh. On the eighth day you shall have a holy convocation[a], and you shall present a food offering to Yahweh. It is a solemn assembly; you shall do no ordinary work.
translation:
  language: de
  text: Sieben Tage lang sollt ihr Jahwe ein Feueropfer darbringen. Am achten Tag soll für euch eine heilige Versammlung stattfinden, und ihr sollt Jahwe ein Feueropfer darbringen. Es ist eine Festversammlung; keinerlei gewöhnliche Arbeit dürft ihr verrichten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: Sieben Tage lang
  rationale: Gibt die Zeitdauer im Deutschen natürlich und genau wieder.
- source_word: תַּקְרִיבוּ / וְהִקְרַבְתֶּם
  choice: sollt ihr … darbringen
  rationale: Die Hifil-Form von קרב bezeichnet im kultischen Zusammenhang das Darbringen einer Opfergabe; „darbringen“ ist präzise und stilistisch angemessen.
- source_word: אִשֶּׁה
  choice: Feueropfer
  rationale: Der priesterliche Fachausdruck bezeichnet eine dem Feuer übergebene Opfergabe. „Feueropfer“ bewahrt diesen kultischen Bezug knapper und unmittelbarer als eine Deutung als Speiseopfer.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Die Präposition bezeichnet den Empfänger beziehungsweise die Widmung; mit „darbringen“ ist der Dativ im Deutschen idiomatisch. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: מִקְרָא קֹדֶשׁ
  choice: eine heilige Versammlung halten
  rationale: Der feste Festkalenderausdruck bezeichnet eine einberufene heilige Zusammenkunft. Die verbale Fassung verbindet sich natürlich mit יִהְיֶה לָכֶם.
- source_word: עֲצֶרֶת
  choice: Festversammlung
  rationale: Bezeichnet hier die besondere, abschließende Versammlung des Festes. „Festversammlung“ wahrt den kultischen Charakter, ohne eine im hebräischen Wort nicht zwingend ausgedrückte Stimmung der Feierlichkeit einzutragen.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: keinerlei gewöhnliche Arbeit
  rationale: Die Wendung untersagt die reguläre Erwerbs- beziehungsweise Alltagsarbeit am Festtag, nicht notwendig jede Tätigkeit überhaupt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von עֲצֶרֶת
  choice: Festversammlung
  alternative: feierliche Versammlung / Abschlussversammlung
  rationale: Das Wort kann eine besondere, wohl abschließende Festversammlung bezeichnen. „Festversammlung“ vermeidet, die mögliche Schlussfunktion oder eine bestimmte emotionale Färbung stärker festzulegen, als der einzelne Ausdruck erlaubt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kultisch-sachlichem Ton. Die Satzstruktur bleibt nah am hebräischen Festgesetz, ohne unnatürliche Hebraismen. Keine Fußnoten sind erforderlich.
