source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם מוֹעֲדֵ֣י יְהוָ֔ה אֲשֶׁר תִּקְרְא֥וּ אֹתָ֖/ם מִקְרָאֵ֣י קֹ֑דֶשׁ אֵ֥לֶּה הֵ֖ם מוֹעֲדָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/002.yaml
  text: 'Speak to the sons of Israel and say to them: The appointed times of Yahweh[c][b][a], which you shall proclaim as holy convocations—these are my appointed times.'
translation:
  language: de
  text: 'Rede zu den Israeliten[a] und sage ihnen: Die festgesetzten Zeiten Jahwes[b], die ihr als heilige Versammlungen[c] ausrufen sollt – dies sind meine festgesetzten Zeiten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zu den Söhnen Israels“; dies ist eine feste Bezeichnung für das Volk Israel.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „Festzeiten“ oder „Feste“. Das hebräische Wort bezeichnet allgemein fest bestimmte heilige Zeiten und nicht nur Festmahle.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch: „heilige Zusammenkünfte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Rede
  rationale: Der Piel-Imperativ fordert Mose unmittelbar dazu auf, das Volk anzusprechen; „Rede“ bewahrt den würdigen Weisungsstil.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die wörtliche Wendung „Söhne Israels“ bezeichnet hier als feste Bundesformel das Volk Israel insgesamt. „Israeliten“ gibt diese kollektive Bedeutung in natürlichem modernem Deutsch wieder; die wörtliche Form wird in einer Fußnote genannt.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: und sage ihnen
  rationale: Die Formulierung bildet die hebräische Befehlsfolge knapp und direkt ab.
- source_word: מוֹעֲדֵי / מוֹעֲדָי
  choice: die festgesetzten Zeiten / meine festgesetzten Zeiten
  rationale: מוֹעֵד bezeichnet eine bestimmte beziehungsweise angesetzte Zeit oder Begegnung. Da das Kapitel auch den Sabbat einbezieht, ist die weitere Wiedergabe „festgesetzte Zeiten“ genauer als die Verengung auf „Feste“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Bundesname wird im Deutschen als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֲשֶׁר תִּקְרְאוּ אֹתָם
  choice: die ihr … ausrufen sollt
  rationale: קרא meint hier die öffentliche Bekanntgabe beziehungsweise Ausrufung der festgesetzten Zeiten.
- source_word: מִקְרָאֵי קֹדֶשׁ
  choice: zu heiligen Versammlungen
  rationale: Die kultische Wendung bezeichnet heilige, einberufene Zusammenkünfte. Die Konstruktion mit „zu“ macht deutlich, als was die Zeiten ausgerufen werden.
- source_word: אֵלֶּה הֵם
  choice: dies sind
  rationale: Die demonstrative Identifikationsformel wird idiomatisch wiedergegeben und behält ihre hervorhebende Kraft.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den persönlichen Bundesnamen. Seine Wiedergabe als „Jahwe“ bewahrt den Unterschied zwischen Name und Titel, ohne eine konfessionelle Sonderdeutung einzuführen.
- issue: Bedeutungsumfang von מוֹעֵד
  choice: festgesetzte Zeiten
  alternative: Feste / Festzeiten
  rationale: Der weitere Ausdruck wahrt den zeitlichen und kultischen Bedeutungsumfang; insbesondere wird der in Vers 3 folgende Sabbat nicht stillschweigend unter einen engeren modernen Festbegriff gezwungen.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: Israeliten
  alternative: Söhne Israels
  rationale: Die hebräische maskuline Bundesformel bezeichnet kollektiv das Volk Israel. Natürliches Deutsch kann diese konventionelle Gesamtbedeutung mit „Israeliten“ ausdrücken; die formale Gestalt bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Gesetzes- und Verkündigungssprache. Der Satzbau folgt der hebräischen Reihenfolge, ohne im Deutschen schwerfällig zu werden. Der Gedankenstrich bewahrt die hervorhebende Schlussidentifikation.
