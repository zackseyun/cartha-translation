source:
  edition: WLC
  text: וּ/לְקַחְתֶּ֨ם לָ/כֶ֜ם בַּ/יּ֣וֹם הָ/רִאשׁ֗וֹן פְּרִ֨י עֵ֤ץ הָדָר֙ כַּפֹּ֣ת תְּמָרִ֔ים וַ/עֲנַ֥ף עֵץ עָבֹ֖ת וְ/עַרְבֵי נָ֑חַל וּ/שְׂמַחְתֶּ֗ם לִ/פְנֵ֛י יְהוָ֥ה אֱלֹהֵי/כֶ֖ם שִׁבְעַ֥ת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/040.yaml
  text: And on the first day you shall take for yourselves the fruit of majestic trees[a], branches of palm trees, boughs of leafy trees, and willows of the brook, and you shall rejoice before Yahweh your God for seven days.
translation:
  language: de
  text: Am ersten Tag sollt ihr euch Früchte von prächtigen Bäumen[a], Palmzweige, Zweige von dicht belaubten Bäumen und Bachweiden nehmen, und ihr sollt euch sieben Tage lang vor Jahwe, eurem Gott, freuen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise nach späterer jüdischer Tradition: „die Frucht der Zitronatzitrone“ (Etrog). Wörtlich spricht das Hebräische von „der Frucht prächtiger/schöner Bäume“.'
    reason: Bewahrt die lexikalische Offenheit des hebräischen Ausdrucks und nennt zugleich seine traditionelle Identifikation.
lexical_decisions:
- source_word: וּלְקַחְתֶּם לָכֶם
  choice: sollt ihr euch … nehmen
  rationale: Gibt den verpflichtenden Sinn der Form im gesetzlichen Kontext wieder und bewahrt לָכֶם durch das reflexive „euch“.
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: Am ersten Tag
  rationale: Entspricht der ausdrücklichen Zeitangabe, ohne den nur aus dem Kontext erschließbaren Zusatz „des Festes“ einzufügen.
- source_word: פְּרִי עֵץ הָדָר
  choice: Früchte von prächtigen Bäumen
  rationale: הָדָר bezeichnet Pracht, Schönheit oder Herrlichkeit. Die allgemeine Wiedergabe erhält die Unbestimmtheit des Hebräischen und legt die spätere Identifikation mit dem Etrog nicht in den Haupttext hinein.
- source_word: כַּפֹּת תְּמָרִים
  choice: Palmzweige
  rationale: Eine natürliche und genaue deutsche Bezeichnung für die Zweige beziehungsweise Wedel der Dattelpalme.
- source_word: וַעֲנַף עֵץ עָבֹת
  choice: Zweige von dicht belaubten Bäumen
  rationale: עָבֹת drückt Dichte aus, wahrscheinlich dichtes Laubwerk; die Formulierung ist verständlich und wahrt dieses Bild.
- source_word: וְעַרְבֵי נָחַל
  choice: Bachweiden
  rationale: Gibt die Weiden an einem Bach oder Wasserlauf knapp und idiomatisch wieder; נַחַל kann auch einen saisonalen Wasserlauf bezeichnen.
- source_word: וּשְׂמַחְתֶּם
  choice: sollt ihr euch … freuen
  rationale: Bewahrt sowohl die direkte Bedeutung „sich freuen“ als auch den auffordernden Sinn im Festgesetz.
- source_word: לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: vor Jahwe, eurem Gott
  rationale: לִפְנֵי wird idiomatisch mit „vor“ wiedergegeben; der Gottesname יהוה erscheint als „Jahwe“.
- source_word: שִׁבְעַת יָמִים
  choice: sieben Tage lang
  rationale: Natürliches modernes Deutsch für die angegebene Dauer.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Bestimmung von פְּרִי עֵץ הָדָר
  choice: 'allgemein: „Früchte von prächtigen Bäumen“'
  alternative: Etrog beziehungsweise Zitronatzitrone
  rationale: Der hebräische Wortlaut bleibt allgemein. Die spätere jüdische Identifikation ist bedeutsam, aber nicht eindeutig im Ausdruck selbst enthalten und wird deshalb in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Aufzählung bleibt konkret und gut verständlich; die Satzteilung vermeidet eine schwerfällige Kette. Die Mehrzahl „Früchte“ entspricht natürlichem Deutsch bei der allgemeinen Gattungsangabe, auch wenn das hebräische Kollektivwort formal Singular ist.
