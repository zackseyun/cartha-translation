  text: וְ/כָל מְלָאכָה֙ לֹ֣א תַעֲשׂ֔וּ בְּ/עֶ֖צֶם הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֣י י֤וֹם כִּפֻּרִים֙ ה֔וּא לְ/כַפֵּ֣ר עֲלֵי/כֶ֔ם לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/028.yaml
  text: You shall do no work on this very day[a], for it is a Day of Atonement, to make atonement for you before Yahweh your God.
translation:
  language: de
  text: Ihr dürft gerade an diesem Tag keinerlei Arbeit verrichten, denn es ist ein Versöhnungstag[a], um für euch vor Jahwe, eurem Gott, Versöhnung zu erwirken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ein Tag der Versöhnungen“; die hebräische Festbezeichnung steht im Plural.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל מְלָאכָה לֹא תַעֲשׂוּ
  choice: Ihr dürft keinerlei Arbeit verrichten
  rationale: מְלָאכָה bezeichnet im Fest- und Sabbatrecht Arbeit beziehungsweise berufliche Tätigkeit. Die deutsche Formulierung gibt das umfassende Verbot idiomatisch und mit rechtlicher Verbindlichkeit wieder.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: an ebendiesem Tag
  rationale: Die Wendung hebt genau diesen Tag nachdrücklich hervor; „ebendiesem“ bewahrt diese emphatische Kraft in natürlichem Deutsch.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung des Arbeitsverbots ein.
- source_word: יוֹם כִּפֻּרִים
  choice: ein Versöhnungstag
  rationale: Die kultische Festbezeichnung wird verständlich wiedergegeben. Der hebräische Plural כִּפֻּרִים bleibt in einer Fußnote sichtbar.
- source_word: לְכַפֵּר עֲלֵיכֶם
  choice: an dem für euch Versöhnung erwirkt wird
  rationale: Der Piel-Infinitiv bezeichnet kultische Sühne beziehungsweise Versöhnung zugunsten der Angesprochenen. Die unpersönliche Passivform vermeidet es, ein im Satz nicht ausdrücklich genanntes handelndes Subjekt einzuführen.
- source_word: לִפְנֵי
  choice: vor
  rationale: Die Präposition bezeichnet hier die kultische Gegenwart Gottes und wird knapp sowie traditionsnah mit „vor“ wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵיכֶם
  choice: eurem Gott
  rationale: Im Zusammenhang mit Jahwe ist die Form trotz ihrer äußeren Pluralgestalt singularisch und bezeichnet den Gott Israels in der Bundesbeziehung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von כפר und כִּפֻּרִים
  choice: Versöhnung / Versöhnungstag
  alternative: Sühne / Tag der Sühnungen
  rationale: „Versöhnung“ vermittelt die kultische Wiederherstellung verständlich, ohne eine bestimmte spätere Sühnetheorie festzulegen. Die grammatische Mehrzahl der Festbezeichnung wird in der Fußnote dokumentiert.
- issue: Nicht genanntes Subjekt von לְכַפֵּר
  choice: unpersönliche Passivform „Versöhnung erwirkt wird“
  alternative: „um für euch Versöhnung zu erwirken“
  rationale: Der hebräische Infinitiv nennt den Handelnden nicht ausdrücklich. Die Passivform erhält diese Offenheit, statt Gott, den Priester oder den Ritus als grammatisches Subjekt festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Rechtssprache. „Keinerlei“ gibt den umfassenden Charakter von כָּל mit Negation wieder; „ebendiesem“ bewahrt den Nachdruck der hebräischen Zeitangabe. Die kultische Aussage bleibt bewusst offen hinsichtlich des handelnden Subjekts.
