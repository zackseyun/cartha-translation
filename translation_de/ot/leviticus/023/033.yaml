lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Und … sprach
  rationale: Das Waw mit der narrativen Verbform führt ein neues Redeereignis in der Abfolge ein. „Sprach“ entspricht der wiederkehrenden, würdevollen Einleitungsformel.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶל־מֹשֶׁה
  choice: zu Mose
  rationale: Die Präposition אֶל bezeichnet hier den Adressaten der Rede; „zu Mose“ ist die natürliche deutsche Fügung.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der hebräische Redeanschluss „indem er sagte/folgendermaßen“ kündigt den Wortlaut in den folgenden Versen an. Im heutigen Deutsch übernimmt ein Doppelpunkt diese Funktion natürlich und ohne Bedeutungsverlust.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: Jehova; der HERR
  rationale: Der Ausgangstext enthält den Eigennamen יהוה. „Jahwe“ gibt die in der Forschung weithin angenommene Aussprache wieder und bewahrt den Charakter als Gottesname; die Fußnote weist auf die hebräische Namensform und die alternative Wiedergabe hin.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Der Doppelpunkt vermeidet das im Deutschen schwerfällige formelhafte „und sagte“ und zeigt an, dass die eigentliche Rede im nächsten Vers folgt.
