id: LEV.23.31
reference: Leviticus 23:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כָּל מְלָאכָ֖ה לֹ֣א תַעֲשׂ֑וּ חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם בְּ/כֹ֖ל מֹֽשְׁבֹֽתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/031.yaml
  text: You shall do no work[b][a]. It is a permanent statute throughout your generations in all your dwelling places.
translation:
  language: de
  text: Ihr dürft keinerlei Arbeit verrichten. Das ist eine bleibende Bestimmung[a] für alle eure Generationen, wo immer ihr wohnt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eine ewige Bestimmung« beziehungsweise »eine Bestimmung für immer«. Das hebräische Wort kann eine bleibende oder dauerhafte Geltung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »in allen euren Wohnorten«; auch: »in allen euren Siedlungen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מְלָאכָה לֹא תַעֲשׂוּ
  choice: Ihr dürft keinerlei Arbeit verrichten
  rationale: Die vorangestellte Gesamtheitsangabe כָּל מְלָאכָה unter der Verneinung schließt jede Arbeit aus. „Keinerlei Arbeit verrichten“ gibt den umfassenden Sinn in natürlichem deutschem Rechtsstil wieder.
- source_word: חֻקַּת עוֹלָם
  choice: eine bleibende Bestimmung
  rationale: חֻקָּה bezeichnet eine verbindliche Festsetzung oder Bestimmung; עוֹלָם drückt hier fortdauernde Geltung aus. „Bleibend“ bewahrt diese zeitliche Weite, ohne sie unnötig als philosophisch absolute Zeitlosigkeit festzulegen.
- source_word: לְדֹרֹתֵיכֶם
  choice: für alle eure Generationen
  rationale: Die Wendung bezeichnet die fortlaufende Geltung über die aufeinanderfolgenden Generationen hinweg.
- source_word: בְּכֹל מֹשְׁבֹתֵיכֶם
  choice: wo immer ihr wohnt
  rationale: מֹשְׁבֹת kann Wohnorte oder Siedlungen bezeichnen. Die idiomatische Wiedergabe erfasst die umfassende örtliche Geltung.
theological_decisions:
- issue: Zeitliche Geltung des kultischen Gesetzes in חֻקַּת עוֹלָם
  choice: eine bleibende Bestimmung
  alternative: eine ewige Bestimmung / eine Bestimmung für immer
  rationale: „Bleibend“ hält den Gedanken fortdauernder Verbindlichkeit fest, ohne die mögliche Bedeutungsbreite von עוֹלָם auf eine abstrakt absolute Ewigkeit zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer gesetzlicher Aussage. „Ihr dürft … nicht“ wird durch das prägnante „keinerlei“ vermieden; „verrichten“ passt zum gesetzlichen Register. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
