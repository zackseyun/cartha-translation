  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und den Rechtsgehalt des Hebräischen zuverlässig wieder: Der thematische Neueinsatz zu den levitischen Städten, die Häuser in den Städten ihres Erbbesitzes sowie das den Leviten zustehende dauerhafte Rückkaufsrecht sind erhalten. „steht ... zu“ bildet תִּהְיֶה לַ/לְוִיִּם idiomatisch und rechtssprachlich angemessen ab.'
