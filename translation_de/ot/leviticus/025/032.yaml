source:
  edition: WLC
  text: וְ/עָרֵי֙ הַ/לְוִיִּ֔ם בָּתֵּ֖י עָרֵ֣י אֲחֻזָּתָ֑/ם גְּאֻלַּ֥ת עוֹלָ֖ם תִּהְיֶ֥ה לַ/לְוִיִּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/032.yaml
  text: As for the cities of the Levites[a], the houses in the cities of their possession may be redeemed permanently by the Levites.
translation:
  language: de
  text: 'Was die Städte der Leviten betrifft: Für die Häuser in den Städten ihres Erbbesitzes steht den Leviten ein immerwährendes Rückkaufsrecht zu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Eine immerwährende Auslösung soll den Leviten zustehen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עָרֵי הַ/לְוִיִּם
  choice: Was die Städte der Leviten betrifft
  rationale: Das einleitende וְ mit der Nominalgruppe markiert hier einen neuen Fall innerhalb der Rechtsbestimmungen. Die deutsche Wendung gibt diesen Themenwechsel natürlich wieder.
- source_word: בָּתֵּי עָרֵי אֲחֻזָּתָם
  choice: die Häuser in den Städten ihres Erbbesitzes
  rationale: Die hebräische Konstruktverbindung bezeichnet die Häuser, die in den Städten des levitischen Besitzes liegen. „Erbbesitz“ bewahrt den rechtlichen und generationenübergreifenden Sinn von אֲחֻזָּה.
- source_word: גְּאֻלַּת
  choice: Rückkaufsrecht
  rationale: Im Zusammenhang mit veräußertem Grund- und Hausbesitz bezeichnet גְּאֻלָּה die Möglichkeit beziehungsweise das Recht, Eigentum zurückzukaufen. Das zusammengesetzte Substantiv gibt die nominale Rechtsform des Hebräischen klar wieder.
- source_word: עוֹלָם
  choice: immerwährendes
  rationale: עוֹלָם kennzeichnet hier die dauerhafte Geltung der Rechtsbestimmung. „Immerwährend“ ist würdig und rechtlich verständlich, ohne eine metaphysische Aussage einzutragen.
- source_word: תִּהְיֶה לַ/לְוִיִּם
  choice: steht den Leviten … zu
  rationale: Die Verbindung von היה mit ל drückt aus, dass dieses Recht den Leviten dauerhaft zukommt. „Steht … zu“ ist im modernen Deutschen eine natürliche rechtliche Formulierung.
theological_decisions:
- issue: Rechtscharakter der Rückkaufsklausel für levitische Häuser
  choice: Die Bestimmung gewährt den Leviten ein dauerhaftes Recht, Häuser in ihren Besitzstädten zurückzukaufen.
  alternative: 'Wörtlicher: „Eine immerwährende Auslösung soll den Leviten zustehen.“'
  rationale: Die hebräische Nominalklausel גְּאֻלַּת עוֹלָם תִּהְיֶה לַלְוִיִּם begründet am natürlichsten ein fortdauerndes Rückkaufsrecht. Die Übersetzung wahrt die rechtliche Aussage, ohne sie konfessionell oder dogmatisch auszuweiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Rechtssprache. Der topicalisierende Auftakt bildet den neuen Einzelfall ab; „Erbbesitz“ und „Rückkaufsrecht“ halten den alttestamentlichen Grundstückskontext transparent.
