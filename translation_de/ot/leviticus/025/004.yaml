  text: וּ/בַ/שָּׁנָ֣ה הַ/שְּׁבִיעִ֗ת שַׁבַּ֤ת שַׁבָּתוֹן֙ יִהְיֶ֣ה לָ/אָ֔רֶץ שַׁבָּ֖ת לַ/יהוָ֑ה שָֽׂדְ/ךָ֙ לֹ֣א תִזְרָ֔ע וְ/כַרְמְ/ךָ֖ לֹ֥א תִזְמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/004.yaml
  text: But in the seventh year there shall be a sabbath of complete rest for the land[a], a sabbath to Yahweh. You shall not sow your field, and you shall not prune your vineyard.
translation:
  language: de
  text: Doch im siebten Jahr soll das Land einen Sabbat völliger Ruhe haben[a], einen Sabbat für Jahwe. Dein Feld sollst du nicht besäen, und deinen Weinberg sollst du nicht beschneiden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „einen Sabbat feierlicher Ruhe“. Der hebräische Ausdruck verstärkt den Gedanken vollständigen Ruhens beziehungsweise Aufhörens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַשָּׁנָה הַשְּׁבִיעִת
  choice: Doch im siebten Jahr
  rationale: Das ו knüpft an die sechs Jahre der erlaubten Bewirtschaftung in Vers 3 an und führt zugleich den Gegensatz des siebten Jahres ein. „Doch“ gibt diesen Übergang im Deutschen natürlich wieder.
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: eine vollständige Sabbatruhe
  rationale: Die Verbindung verstärkt den Gedanken des Ruhens beziehungsweise vollständigen Aufhörens. „Sabbatruhe“ bewahrt den Sabbatbezug, „vollständig“ die Intensivierung.
- source_word: יִהְיֶה לָאָרֶץ
  choice: soll das Land ... haben
  rationale: Die hebräische Wendung sagt, dass dem Land diese Ruhe zukommen soll. Die deutsche Formulierung ist idiomatisch und hält das Land als Empfänger der Ruhe fest.
- source_word: שַׁבָּת לַיהוָה
  choice: einen Sabbat für Jahwe
  rationale: Die Präposition ל kennzeichnet die Ruhe als Jahwe gewidmet beziehungsweise auf ihn bezogen. „Für“ ist dafür im Deutschen natürlich und lässt die genaue Verhältnisbestimmung offen.
- source_word: שָׂדְךָ לֹא תִזְרָע
  choice: Dein Feld sollst du nicht besäen
  rationale: Die vorangestellte Objektstellung spiegelt den hebräischen Nachdruck. „Besäen“ ist im Zusammenhang mit einem Feld eine natürliche Entsprechung zu זרע.
- source_word: וְכַרְמְךָ לֹא תִזְמֹר
  choice: und deinen Weinberg nicht beschneiden
  rationale: זמר bezeichnet im Weinbau das Beschneiden der Reben. Das gemeinsame „sollst du“ vermeidet im Deutschen unnötige Wiederholung, ohne die zweite Untersagung abzuschwächen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen JHWH. „Jahwe“ gibt ihn als Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug der Sabbatruhe
  choice: Das Land soll die Sabbatruhe haben; sie ist für Jahwe
  alternative: Ein lediglich menschlich einzuhaltendes Sabbatjahr
  rationale: Die Übersetzung bewahrt sowohl die ausdrückliche Zuweisung der Ruhe an das Land als auch ihre Ausrichtung auf Jahwe und verengt die Aussage nicht auf nur einen dieser Aspekte.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Singularformen „dein“ und „du“ entsprechen der hebräischen Gesetzesanrede. „Sabbatruhe“ erhält die kultische und landwirtschaftliche Dimension des Ausdrucks.
