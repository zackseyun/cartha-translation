source:
  edition: WLC
  text: וְ/כִֽי יָמ֥וּךְ אָחִ֛י/ךָ עִמָּ֖/ךְ וְ/נִמְכַּר לָ֑/ךְ לֹא תַעֲבֹ֥ד בּ֖/וֹ עֲבֹ֥דַת עָֽבֶד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/039.yaml
  text: And if your brother becomes poor with you and sells himself to you[b][a], you shall not make him serve as a servant.
translation:
  language: de
  text: Und wenn dein Bruder bei dir verarmt und sich dir verkauft[a], sollst du ihn nicht wie einen Sklaven arbeiten lassen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und dir verkauft wird“. Die hebräische Form kann passiv wiedergegeben werden; im Zusammenhang geht es wahrscheinlich darum, dass ein Verarmter sich in einen Schuldendienst verkauft.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „Du sollst ihn nicht die Arbeit eines Sklaven verrichten lassen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Und wenn
  rationale: Bewahrt sowohl die verbindende Konjunktion als auch die Einleitung des rechtlichen Falls und klingt im Deutschen natürlich.
- source_word: יָמוּךְ
  choice: verarmt
  rationale: Das Verb bezeichnet das Absinken in Armut beziehungsweise wirtschaftliche Not; „verarmt“ gibt diesen Vorgang knapp und idiomatisch wieder.
- source_word: אָחִיךָ
  choice: dein Bruder
  rationale: Die wörtliche Verwandtschaftsbezeichnung bleibt erhalten; im Kontext bezeichnet sie einen Angehörigen der israelitischen Gemeinschaft.
- source_word: עִמָּךְ
  choice: bei dir
  rationale: Gibt die Beziehung zum angesprochenen Gegenüber natürlich wieder, ohne die räumliche oder soziale Nuance unnötig festzulegen.
- source_word: וְנִמְכַּר לָךְ
  choice: und sich dir verkauft
  rationale: Das hebräische Nifal kann formal passiv verstanden werden, bezeichnet in diesem Armutsrecht jedoch wahrscheinlich den Selbstverkauf in Schuldienst. Die Fußnote bewahrt die grammatische Alternative.
- source_word: לֹא תַעֲבֹד בּוֹ
  choice: sollst du ihn nicht … verrichten lassen
  rationale: Die Konstruktion untersagt dem Adressaten, den Verarmten zu einer bestimmten Art von Arbeit heranzuziehen.
- source_word: עֲבֹדַת עָבֶד
  choice: Sklavenarbeit
  rationale: Die Genitivverbindung bedeutet wörtlich „Arbeit/Dienst eines Sklaven“. „Sklavenarbeit“ bewahrt die soziale Schärfe und vermeidet die Abschwächung zu bloßem Dienst.
theological_decisions:
- issue: Bezeichnung der verbotenen Arbeits- und Statusform
  choice: Sklavenarbeit
  alternative: wie einen Sklaven dienen lassen
  rationale: Der Vers untersagt nicht jede Dienstleistung des verarmten Bruders, sondern seine Heranziehung zur Arbeit eines Sklaven. „Sklavenarbeit“ hält diese Spannung fest, ohne den gesamten rechtlichen Status über den Wortlaut hinaus zu definieren.
- issue: Aktive oder passive Wiedergabe des Verkaufs
  choice: sich dir verkauft
  alternative: dir verkauft wird
  rationale: Der Kontext legt einen armutsbedingten Selbstverkauf nahe, doch die Nifalform ist grammatisch passiv formulierbar. Die Hauptübersetzung folgt dem kontextuellen Sinn, während die Fußnote die echte sprachliche Alternative offenhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede im Singular und die familiäre Bezeichnung „Bruder“ bleiben erhalten. „Sklavenarbeit“ ist bewusst deutlich und entspricht der sozialen Tragweite des hebräischen Ausdrucks.
