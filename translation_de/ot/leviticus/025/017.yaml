  text: וְ/לֹ֤א תוֹנוּ֙ אִ֣ישׁ אֶת עֲמִית֔/וֹ וְ/יָרֵ֖אתָ מֵֽ/אֱלֹהֶ֑י/ךָ כִּ֛י אֲנִ֥י יְהֹוָ֖ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/017.yaml
  text: And no man shall oppress his neighbor[a], but you shall fear your God, for I am Yahweh your God.
translation:
  language: de
  text: Keiner von euch soll den anderen übervorteilen[a]. Fürchte dich vielmehr vor deinem Gott; denn ich bin Jahwe, euer Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Unrecht tun“, „ausbeuten“ oder „unterdrücken“. Das hebräische Verb kann bezeichnen, dass jemand einen anderen in sozialen oder wirtschaftlichen Beziehungen unfair behandelt oder zu seinem Nachteil ausnutzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תוֹנוּ
  choice: übervorteilen
  rationale: Das Hifil von ינה bezeichnet hier, im Zusammenhang mit Besitz- und Wirtschaftsregelungen, ein unrechtes Ausnutzen oder Schädigen des anderen. „Übervorteilen“ gibt diesen rechtlich-wirtschaftlichen Sinn prägnant wieder, ohne ihn auf eine einzige Betrugsform einzuengen.
- source_word: אִישׁ אֶת עֲמִיתוֹ
  choice: Keiner von euch … den anderen
  rationale: Die hebräische distributive Wendung bedeutet sinngemäß, dass niemand seinen jeweiligen Mitmenschen beziehungsweise Gemeinschaftsangehörigen schädigen darf. Die deutsche Fassung ist natürlich und bewahrt den wechselseitigen Bezug innerhalb der angesprochenen Gemeinschaft.
- source_word: וְיָרֵאתָ
  choice: Fürchte dich vielmehr
  rationale: Der Wechsel vom Verbot zum positiven Gebot hat kontrastierende Kraft. „Vielmehr“ macht deutlich, dass Gottesfurcht dem Übervorteilen des anderen entgegengesetzt wird; der hebräische Wechsel von der pluralischen zur singularischen Anrede bleibt durch „Fürchte dich“ sichtbar.
- source_word: מֵאֱלֹהֶיךָ
  choice: vor deinem Gott
  rationale: Nach ירא kennzeichnet die Präposition מן den Gegenstand der Furcht. Im Deutschen lautet die idiomatische Verbindung „sich vor Gott fürchten“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt. „Jahwe“ ist die gebräuchliche deutsche Form der wissenschaftlich weithin angenommenen Aussprache.
- source_word: אֱלֹהֵיכֶם
  choice: euer Gott
  rationale: Das pluralische Suffix richtet die abschließende Bundesformel an die ganze Gemeinschaft und wird entsprechend mit „euer“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Namen, während „der HERR“ ihn durch einen Titel ersetzt; „Jehova“ beruht auf einer späteren Verbindung der Konsonanten mit fremden Vokalzeichen.
- issue: Bedeutungsumfang des Verbots
  choice: übervorteilen
  alternative: unterdrücken; Unrecht tun; ausbeuten
  rationale: Der unmittelbare Kontext betrifft wirtschaftliche und soziale Beziehungen. „Übervorteilen“ wahrt diesen Schwerpunkt, ohne das Verbot ausschließlich als gewaltsame Unterdrückung oder als technische Form des Betrugs zu deuten.
- issue: Wechsel zwischen pluralischer und singularischer Anrede
  choice: Keiner von euch … Fürchte dich … euer Gott
  alternative: Durchgehend pluralische Anrede
  rationale: 'Die Übersetzung erhält den auffälligen Numeruswechsel des Hebräischen: Zunächst wird die Gemeinschaft angesprochen, dann jeder Einzelne unmittelbar verpflichtet und abschließend wieder die Gemeinschaft als Ganzes angeredet.'
translation_notes:
  register: Moderne, würdige Standardsprache. „Übervorteilen“ ist etwas gehoben, aber allgemein verständlich und für den rechtlich-wirtschaftlichen Zusammenhang präzise. Der Wechsel von „euch“ zu „dich“ und zurück zu „euer“ bildet die Numeruswechsel des hebräischen Textes bewusst ab.
