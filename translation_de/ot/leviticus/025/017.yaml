review_pass:
  verdict: approve
  source_fidelity: Die Übersetzung gibt das pluralische Verbot וְלֹא תוֹנוּ angemessen mit „Keiner von euch soll … übervorteilen“ wieder. „Den anderen“ vermittelt die distributive Beziehung von אִישׁ אֶת־עֲמִיתוֹ im Kontext der angesprochenen Gemeinschaft hinreichend. „Übervorteilen“ trifft den im wirtschaftlich-rechtlichen Zusammenhang naheliegenden Sinn des Hifil von ינה präzise. Der Wechsel zur Singularanrede („Fürchte dich“) und zurück zum pluralischen Possessiv („euer Gott“) entspricht dem hebräischen Numeruswechsel. „Jahwe“ gibt יְהוָה korrekt als Namen wieder.
  naturalness: Der Text ist idiomatisches, modernes Standarddeutsch und wahrt einen würdigen Gesetzes- bzw. Mahnregister. „Vielmehr“ macht den im Kontext erkennbaren Kontrast zwischen dem Verbot und der Gottesfurcht klar, ohne den Sinn wesentlich einzuengen. Die Zeichensetzung unterstützt die Satzstruktur gut.
  terminology: „Jahwe“ ist im Deutschen eine etablierte Wiedergabe des Tetragramms. „Gott“, „fürchten“ und „übervorteilen“ sind terminologisch passend. Die Fußnote bietet sinnvolle lexikalische Alternativen und erläutert den sozialen und wirtschaftlichen Anwendungsbereich, ohne ihn als ausschließliche Bedeutung festzulegen.
