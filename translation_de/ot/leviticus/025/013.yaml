  text: בִּ/שְׁנַ֥ת הַ/יּוֹבֵ֖ל הַ/זֹּ֑את תָּשֻׁ֕בוּ אִ֖ישׁ אֶל אֲחֻזָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/013.yaml
  text: In this Year of Jubilee[a], each of you shall return to his property.
translation:
  language: de
  text: In diesem Jubeljahr soll jeder von euch zu seinem Grundbesitz zurückkehren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת הַיּוֹבֵל הַזֹּאת
  choice: In diesem Erlassjahr
  rationale: Die Präposition בְּ bezeichnet hier den zeitlichen Rahmen. יוֹבֵל meint im Zusammenhang von Levitikus 25 das besondere Jahr der Freilassung und Rückgabe; „Erlassjahr“ ist eine verständliche, im Deutschen etablierte Wiedergabe. Das Demonstrativ הַזֹּאת wird natürlich mit „diesem“ wiedergegeben.
- source_word: תָּשֻׁבוּ
  choice: soll ... zurückkehren
  rationale: Das Imperfekt der 2. Person Plural hat in dieser Rechtsbestimmung anweisenden Charakter. „soll“ gibt diesen Sinn in natürlichem deutschem Rechtsstil wieder; „zurückkehren“ bewahrt die Rückkehrbedeutung von שׁוב.
- source_word: אִישׁ
  choice: jeder von euch
  rationale: אִישׁ steht distributiv und individualisiert die zuvor pluralisch angesprochenen Personen. „Jeder von euch“ bildet sowohl den Pluralbezug als auch die Einzelzuweisung idiomatisch ab.
- source_word: אֶל אֲחֻזָּתוֹ
  choice: zu seinem Grundbesitz
  rationale: אֲחֻזָּה bezeichnet hier den zugewiesenen beziehungsweise erblichen Landbesitz. „Grundbesitz“ ist genauer als das allgemeinere „Besitz“, ohne die im Vers nur vorausgesetzte Erblichkeit ausdrücklich einzutragen.
theological_decisions:
- issue: Distributive maskuline Form אִישׁ mit maskulinem Suffix
  choice: jeder von euch ... seinem Grundbesitz
  alternative: jeder Mann ... seinem Besitz
  rationale: Die Form ist grammatisch maskulin und distributiv. „Jeder von euch“ bewahrt den individuellen Bezug zur angesprochenen Gemeinschaft; das singularische „seinem“ entspricht dem hebräischen Suffix, ohne die Aussage über den Wortlaut hinaus einzuengen.
- issue: Bedeutung von יוֹבֵל
  choice: Erlassjahr
  alternative: Jubeljahr
  rationale: Im Kontext bezeichnet יוֹבֵל die gesetzlich bestimmte Periode der Freilassung und Rückkehr zum Landbesitz. „Erlassjahr“ vermittelt die Funktion im modernen Deutschen klar; „Jubeljahr“ ist traditionell, kann heute jedoch irreführend wie ein bloßes Fest- oder Freudenjahr klingen.
translation_notes:
  register: Moderner, würdiger und knapper deutscher Rechtssatz. Die Satzstellung folgt natürlichem Standarddeutsch und erhält den zeitlichen Rahmen, die distributive Verpflichtung und die Rückkehr zum Landbesitz.
