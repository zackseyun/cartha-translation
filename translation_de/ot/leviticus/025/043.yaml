  text: לֹא תִרְדֶּ֥ה ב֖/וֹ בְּ/פָ֑רֶךְ וְ/יָרֵ֖אתָ מֵ/אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/043.yaml
  text: You shall not rule over him harshly[a], but you shall fear your God.
translation:
  language: de
  text: Du sollst nicht mit Härte über ihn herrschen[a], sondern du sollst deinen Gott fürchten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „rücksichtslos“; das hebräische Wort bezeichnet eine harte, bedrückende Behandlung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִרְדֶּה
  choice: über ihn herrschen
  rationale: רדה bezeichnet Herrschen beziehungsweise das Ausüben von Gewalt oder Verfügungsgewalt. Im rechtlichen Zusammenhang wahrt „über ihn herrschen“ das Autoritätsverhältnis, ohne es stärker auszudeuten.
- source_word: בּוֹ
  choice: über ihn
  rationale: Das maskuline Singularsuffix verweist auf den zuvor genannten israelitischen Schuldarbeiter. Die Präposition wird im Deutschen idiomatisch in die Verbindung „über ihn herrschen“ aufgenommen.
- source_word: בְּפָרֶךְ
  choice: mit Härte
  rationale: פָרֶךְ bezeichnet harte, bedrückende oder rücksichtslose Behandlung. „Mit Härte“ ist würdig und quellennah und bewahrt die nominale Ausdrucksweise des Hebräischen.
- source_word: וְיָרֵאתָ
  choice: sondern du sollst … fürchten
  rationale: Das ו ist formal koordinierend, erhält nach dem Verbot jedoch eine kontrastive Funktion. „Sondern“ macht deutlich, dass Gottesfurcht der harten Machtausübung entgegengesetzt wird.
- source_word: מֵאֱלֹהֶיךָ
  choice: deinen Gott
  rationale: Nach ירא kennzeichnet מִן idiomatisch das Objekt der Furcht. Im Deutschen lautet die natürliche Wiedergabe „deinen Gott fürchten“.
theological_decisions:
- issue: Funktion des Schlusssatzes als ethische Begründung und Gegenakzent
  choice: „sondern du sollst deinen Gott fürchten“
  alternative: „und du sollst deinen Gott fürchten“
  rationale: Die Übersetzung gibt die Gottesfurcht als Gegenakzent zur verbotenen harten Herrschaft wieder. Sie verdeutlicht damit den ethischen Zusammenhang, ohne zusätzliche Lehrinhalte einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Gesetzesstil. Die Wiederholung „du sollst“ bewahrt den feierlichen Verpflichtungscharakter; „mit Härte“ hält die Intensität des hebräischen Ausdrucks offen und vermeidet eine unnötige Verstärkung.
