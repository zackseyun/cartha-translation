  source_fidelity: Die Übersetzung gibt לֹא תִרְדֶּה בוֹ בְּפָרֶךְ präzise als Verbot wieder, über den genannten Mann hart zu herrschen. „Mit Härte“ bewahrt die offene, schwere Bedeutung von בְּפָרֶךְ, ohne sie zu verschärfen. „Deinen Gott fürchten“ gibt die idiomatische Konstruktion ירא mit מִן sachgerecht wieder. Das kontrastive „sondern“ ist im gegebenen ethischen Zusammenhang vertretbar, auch wenn das hebräische ו formal koordinierend ist.
  naturalness: Modernes, idiomatisches und dem Gesetzesstil angemessen würdiges Standarddeutsch. Die Wiederholung von „du sollst“ ist klar und natürlich; „mit Härte über ihn herrschen“ ist verständlich und präzise.
  terminology: „Herrschen“, „Härte“ und „deinen Gott fürchten“ sind terminologisch stimmig. Die Personenreferenz bleibt im maskulinen Singular wie im hebräischen Text. Der Fußnotenanker steht unmittelbar bei der zutreffenden lexikalischen Einheit.
