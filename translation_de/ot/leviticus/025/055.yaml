source:
  edition: WLC
  text: כִּֽי לִ֤/י בְנֵֽי יִשְׂרָאֵל֙ עֲבָדִ֔ים עֲבָדַ֣/י הֵ֔ם אֲשֶׁר הוֹצֵ֥אתִי אוֹתָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/055.yaml
  text: For the sons of Israel are my servants[a]; they are my servants, whom I brought out of the land of Egypt[b]. I am Yahweh your God.
translation:
  language: de
  text: Denn mir gehören die Israeliten als Sklaven; meine Sklaven sind sie, die ich aus dem Land Ägypten herausgeführt habe. Ich bin Jahwe, euer Gott.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehenden Bestimmungen ein und entspricht dem erklärenden Zusammenhang.
- source_word: לִי ... עֲבָדִים
  choice: gehören mir als Knechte
  rationale: Gibt sowohl das durch לִי ausgedrückte Zugehören als auch den Dienststatus von עֲבָדִים wieder, ohne den Ausdruck auf moderne Formen der Sklaverei festzulegen.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die übliche deutsche Bezeichnung für die korporative Wendung „Söhne Israels“; sie schließt hier das ganze Volk ein und klingt natürlich.
- source_word: עֲבָדַי הֵם
  choice: meine Knechte sind sie
  rationale: Bewahrt die emphatische Wiederholung und die hervorgehobene Zugehörigkeit zu Jahwe.
- source_word: אֲשֶׁר הוֹצֵאתִי אוֹתָם
  choice: die ich ... herausgeführt habe
  rationale: Entspricht dem Hifil von יצא und bewahrt die vertraute Exodusformel.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: aus dem Land Ägypten
  rationale: Formale und idiomatische Wiedergabe der hebräischen Herkunftsangabe.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder.
- source_word: אֱלֹהֵיכֶם
  choice: euer Gott
  rationale: Bewahrt die Bundesformel und den Pluralbezug der Anrede.
theological_decisions:
- issue: עבד im Zusammenhang von Bundeszugehörigkeit und Erlassjahr
  choice: Knechte
  alternative: Sklaven; Diener
  rationale: „Knechte“ wahrt den rechtlichen Dienst- und Zugehörigkeitsaspekt, ohne ausschließlich moderne rassistische oder kommerzielle Formen von Sklaverei anzurufen. Die Formulierung „gehören mir als Knechte“ macht den im Kontext entscheidenden Gegensatz zur dauerhaften Verfügung durch menschliche Herren deutlich.
- issue: Korporative Wendung בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels; die Kinder Israels
  rationale: Gemeint ist das gesamte Bundesvolk. „Die Israeliten“ ist im modernen Deutschen präzise und verständlich, ohne die konventionelle hebräische Wendung irreführend auf Männer zu beschränken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht markierte Wortstellung „meine Knechte sind sie“ erhält die emphatische Wiederholung des Hebräischen; „Jahwe“ gibt den Gottesnamen ausdrücklich wieder.
