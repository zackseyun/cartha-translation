  source_fidelity: 'Die Begründung durch „Denn“, die Exodusformel, die Wiederholung von עֲבָדִים/עֲבָדַי und die Bundesformel sind grundsätzlich zutreffend wiedergegeben. „Knechte“ schwächt jedoch im unmittelbaren Rechtskontext von Levitikus 25 den durch עבד bezeichneten Status rechtlicher Zugehörigkeit ab. Der Vers begründet gerade, weshalb Israel nicht dauerhaft Menschen gehört: Sie gehören JHWH als עבדים.'
  naturalness: Die vorliegende Fassung ist verständlich und würdig. „gehören mir als Knechte“ ist jedoch etwas umständlich; „mir gehören ... als Sklaven“ ist im heutigen Standarddeutsch klarer und gibt die Besitz-/Zugehörigkeitslogik des Satzes direkt wieder. Die emphatische Wiederholung „Meine Sklaven sind sie“ bleibt bewusst markiert und gut verständlich.
  terminology: '„Israeliten“ ist eine natürliche, korporative Wiedergabe von בְנֵי יִשְׂרָאֵל. „Jahwe“ ist als Wiedergabe des Gottesnamens konsequent. Für עֲבָדִים/עֲבָדַי ist hier „Sklaven“ vorzuziehen: Der Begriff bezeichnet im Kontext nicht bloß Dienst, sondern einen unfreien Status und ausschließliche Zugehörigkeit. Dies behauptet keine Gleichsetzung mit späteren oder modernen Formen rassifizierter Sklaverei.'
