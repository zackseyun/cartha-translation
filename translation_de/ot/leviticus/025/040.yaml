source:
  edition: WLC
  text: כְּ/שָׂכִ֥יר כְּ/תוֹשָׁ֖ב יִהְיֶ֣ה עִמָּ֑/ךְ עַד שְׁנַ֥ת הַ/יֹּבֵ֖ל יַעֲבֹ֥ד עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/040.yaml
  text: He shall be with you like a hired worker[a], like a sojourner; he shall serve with you until the year of jubilee.
translation:
  language: de
  text: Er soll bei dir wie ein Lohnarbeiter, wie ein ansässiger Fremder sein; bis zum Jubeljahr soll er bei dir arbeiten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּשָׂכִיר
  choice: wie ein Lohnarbeiter
  rationale: שָׂכִיר bezeichnet einen gegen Lohn Beschäftigten. „Lohnarbeiter“ ist modern und macht deutlich, dass er nicht den Status eines Sklaven hat.
- source_word: כְּתוֹשָׁב
  choice: wie ein ansässiger Fremder
  rationale: תּוֹשָׁב bezeichnet einen Nichtisraeliten beziehungsweise NichtEinheimischen mit dauerhaftem Wohnsitz im Land. „Ansässiger Fremder“ gibt diese sozialrechtliche Kategorie verständlich wieder.
- source_word: יִהְיֶה עִמָּךְ
  choice: soll er bei dir sein
  rationale: Die Wendung beschreibt seinen Status im Verhältnis zum Dienstherrn; „bei dir sein“ bewahrt das wiederholte עִמָּךְ und die direkte Aussage des Hebräischen.
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: bis zum Erlassjahr
  rationale: הַיֹּבֵל ist in Levitikus 25 der technische Ausdruck für das fünfzigste Jahr der Freilassung und Rückgabe. „Erlassjahr“ vermittelt seine rechtliche Funktion im heutigen Deutsch.
- source_word: יַעֲבֹד עִמָּךְ
  choice: soll er bei dir arbeiten
  rationale: עבד kann „dienen“ oder „arbeiten“ bedeuten. Im Zusammenhang eines Lohnarbeiters ist „arbeiten“ natürlich und vermeidet hier unnötige Sklavereikonnotationen; „bei dir“ wahrt עִמָּךְ.
theological_decisions:
- issue: Status des verarmten Israeliten im Arbeitsverhältnis
  choice: Die Formulierung kennzeichnet ihn als Lohnarbeiter und ansässigen Fremden, nicht als Sklaven.
  alternative: „Wie ein Tagelöhner und Beisasse soll er dir dienen.“
  rationale: Der unmittelbare Zusammenhang in 3. Mose 25,39–43 untersagt, den verarmten Israeliten als Sklaven zu behandeln. Die Übersetzung bewahrt diesen rechtlichen Unterschied, ohne über den Text hinauszugehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Vergleichsstruktur des Hebräischen bleibt erhalten. „Erlassjahr“ wird als verständlicher deutscher Fachbegriff für das Jobeljahr verwendet.
