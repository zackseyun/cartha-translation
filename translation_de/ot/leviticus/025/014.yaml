id: LEV.25.14
reference: Leviticus 25:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/כִֽי תִמְכְּר֤וּ מִמְכָּר֙ לַ/עֲמִיתֶ֔/ךָ א֥וֹ קָנֹ֖ה מִ/יַּ֣ד עֲמִיתֶ֑/ךָ אַל תּוֹנ֖וּ אִ֥ישׁ אֶת אָחִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/014.yaml
  text: And if you sell something to your neighbor[a], or buy from your neighbor, no man shall oppress his brother.
translation:
  language: de
  text: Und wenn ihr eurem Mitmenschen etwas verkauft oder etwas aus der Hand eures Mitmenschen kauft, dann soll keiner seinen Bruder übervorteilen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einander kein Unrecht tun“. Das Verb kann bedeuten, jemanden zu benachteiligen oder auszunutzen, hier besonders bei einem Geschäft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Und wenn
  rationale: Gibt sowohl die anknüpfende Konjunktion ו als auch den konditionalen Sinn von כי in der Rechtssprache wieder.
- source_word: תִמְכְּרוּ מִמְכָּר
  choice: ihr … etwas verkauft
  rationale: מִמְכָּר bezeichnet das Verkaufte beziehungsweise ein Verkaufsgut; die deutsche Verbindung mit „etwas verkaufen“ ist natürlich und sachlich genau.
- source_word: לַעֲמִיתֶךָ / עֲמִיתֶךָ
  choice: eurem Mitmenschen / eures Mitmenschen
  rationale: עָמִית bezeichnet hier ein anderes Mitglied der Gemeinschaft. „Mitmensch“ wahrt den gemeinschaftlichen Bezug und vermeidet die mögliche Verengung von „Nachbar“ auf räumliche Nähe.
- source_word: אוֹ קָנֹה
  choice: oder … kauft
  rationale: Der Infinitivus absolutus קָנֹה steht koordiniert zum vorausgehenden finiten Verb und wird im Deutschen idiomatisch als finites Verb wiedergegeben.
- source_word: מִיַּד
  choice: aus der Hand
  rationale: Bewahrt das konkrete hebräische Transaktionsbild, das auch im Deutschen verständlich ist.
- source_word: אַל תּוֹנוּ
  choice: soll … nicht übervorteilen
  rationale: ינה bezeichnet in diesem geschäftlichen Zusammenhang, jemanden unrechtmäßig zu benachteiligen oder auszunutzen. „Übervorteilen“ bildet den wirtschaftlichen Sinn präziser ab als das breitere „unterdrücken“.
- source_word: אִישׁ אֶת־אָחִיו
  choice: keiner seinen Bruder
  rationale: „Keiner“ gibt die distributive Kraft von אִישׁ in der Verneinung natürlich wieder; „Bruder“ bewahrt das konkrete אָחִיו und dessen solidarischen Gemeinschaftsbezug.
theological_decisions:
- issue: Männliche Gemeinschaftsbezeichnung אָחִיו
  choice: seinen Bruder
  alternative: einander / seinen Mitmenschen
  rationale: Das konkrete Bild des hebräischen Textes bleibt erhalten, ohne den gemeinschaftlichen und rechtlich repräsentativen Geltungsbereich auf leibliche Brüder zu beschränken.
- issue: Reichweite des Verbots ינה
  choice: geschäftliche Übervorteilung im Haupttext
  alternative: allgemeines Unrechttun oder Unterdrücken
  rationale: Der unmittelbare Zusammenhang handelt vom Kaufen und Verkaufen. Die Fußnote hält die breitere mögliche Bedeutung offen, ohne den Kontext zu verwischen.
translation_notes:
  register: Moderne, würdevolle Rechtssprache. Der Wechsel von der Anrede im Plural („ihr“) zur distributiven Einzelform („keiner … seinen Bruder“) folgt der hebräischen Struktur. Der Fußnotenmarker steht unmittelbar nach der einschlägigen Aussage.
