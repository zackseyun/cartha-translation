base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/046.yaml
  text: You may pass them on as an inheritance to your sons after you[a], to inherit as a possession permanently; from them you may exact labor. But over your brothers, the sons of Israel[b], no man shall rule over his brother harshly.
translation:
  language: de
  text: Ihr dürft sie euren Söhnen nach euch als erblichen Besitz vererben; sie sollen ihnen dauerhaft als Besitz gehören. Von ihnen dürft ihr Arbeit fordern. Doch unter euren Brüdern, den Söhnen Israels[b], soll keiner über seinen Bruder mit Härte herrschen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: „Brüder“ und „Söhne Israels“ geben die männlichen hebräischen Verwandtschafts- und Volksbezeichnungen direkt wieder; gemeint sind die anderen Israeliten als Angehörige der eigenen Gemeinschaft.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִתְנַחֲלְתֶּם אֹתָם
  choice: Ihr dürft sie … als Erbbesitz hinterlassen
  rationale: Der Hithpael von נחל bezeichnet hier die Weitergabe als erblichen Besitz. Die deutsche Formulierung bewahrt den rechtlichen Erbcharakter und bleibt natürlich.
- source_word: לִבְנֵיכֶם אַחֲרֵיכֶם
  choice: euren Söhnen nach euch
  rationale: בנים bedeutet wörtlich „Söhne“; die ausdrücklich männliche Sprache des antiken Erbrechts bleibt erhalten.
- source_word: לָרֶשֶׁת אֲחֻזָּה
  choice: als Erbbesitz
  rationale: Die knappe Zusammensetzung gibt sowohl den Erb- als auch den Besitzaspekt wieder, ohne die hebräische Wendung im Deutschen schwerfällig nachzubilden.
- source_word: לְעֹלָם
  choice: dauerhaft
  rationale: Im rechtlichen Zusammenhang bezeichnet עוֹלָם einen bleibenden beziehungsweise unbefristeten Status, nicht zwingend metaphysische Ewigkeit.
- source_word: בָּהֶם תַּעֲבֹדוּ
  choice: ihr dürft sie für euch arbeiten lassen
  rationale: Die Konstruktion bezeichnet Arbeit beziehungsweise Dienst, den die als Besitz behandelten Personen leisten müssen. Die Formulierung ist verständlich und beschönigt das Abhängigkeitsverhältnis nicht durch moderne Beschäftigungssprache.
- source_word: וּבְאַחֵיכֶם בְּנֵי יִשְׂרָאֵל
  choice: Aber über eure Brüder, die Söhne Israels
  rationale: Die Übersetzung wahrt den Gegensatz zum vorherigen Satz sowie die appositionelle Verbindung der männlichen Verwandtschafts- und Volksbezeichnung.
- source_word: אִישׁ בְּאָחִיו
  choice: soll keiner … herrschen
  rationale: Die distributive Wendung verbietet jedem einzelnen Israeliten ein entsprechendes Verhalten gegenüber seinem Bruder; „keiner“ ist dafür natürliches deutsches Rechtsdeutsch.
- source_word: לֹא תִרְדֶּה בוֹ בְּפָרֶךְ
  choice: soll keiner mit Härte herrschen
  rationale: רדה bezeichnet das Ausüben von Herrschaft, während בפרך deren harte, rücksichtslose Art bestimmt. „Mit Härte herrschen“ erhält beide Bestandteile sichtbar.
theological_decisions:
- issue: Verwandtschaftssprache im israelitischen Sozialrecht
  choice: „Brüder“ und „Söhne Israels“ werden beibehalten.
  alternative: „Mit-Israeliten“, „Volksgenossen“ oder geschlechtsneutrale Bezeichnungen
  rationale: Die hebräischen männlichen Verwandtschaftsbegriffe stellen die Bundesgemeinschaft als familiäre Solidarität dar. Eine Neutralisierung würde diese Bildsprache und die Form des damaligen Rechts verdecken.
- issue: Direktheit der Sprache über Unfreiheit und Eigentum
  choice: Erbbesitz und verpflichtende Arbeit werden ohne beschönigende Dienstbotensprache benannt.
  alternative: Eine weichere Wiedergabe ausschließlich mit „Dienern“ und „dienen“
  rationale: Der hebräische Text beschreibt Menschen als übertragbaren Erbbesitz und ihre Arbeitsleistung als der Verfügungsgewalt anderer unterstellt. Die Übersetzung bewahrt diese rechtliche und moralische Spannung.
- issue: Bedeutungsumfang von לְעֹלָם
  choice: „dauerhaft“ im Sinn eines bleibenden Rechtsstatus
  alternative: „für immer“
  rationale: „Für immer“ könnte im Deutschen eine uneingeschränkte metaphysische Aussage nahelegen. Der unmittelbare Zusammenhang behandelt dagegen den fortdauernden erb- und besitzrechtlichen Status.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierungen bleiben juristisch klar, vermeiden jedoch unnötig altertümliche Wörter. Die belastende Eigentums- und Zwangsarbeitsdimension des Ausgangstextes wird weder abgeschwächt noch kommentierend verschärft.
