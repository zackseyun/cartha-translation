source:
  edition: WLC
  text: אֲנִ֗י יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם אֲשֶׁר הוֹצֵ֥אתִי אֶתְ/כֶ֖ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם לָ/תֵ֤ת לָ/כֶם֙ אֶת אֶ֣רֶץ כְּנַ֔עַן לִ/הְי֥וֹת לָ/כֶ֖ם לֵ/אלֹהִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/038.yaml
  text: I am Yahweh your God[a], who brought you out of the land of Egypt to give you the land of Canaan, to be your God.
translation:
  language: de
  text: Ich bin Jahwe, euer Gott[a], der euch aus dem Land Ägypten herausgeführt hat, um euch das Land Kanaan zu geben und euer Gott zu sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als „Jahwe“ wiedergegeben, um den im Hebräischen stehenden persönlichen Bundesnamen zu bewahren.
- source_word: אֱלֹהֵיכֶם
  choice: euer Gott
  rationale: אֱלֹהִים bezeichnet hier trotz seiner Pluralform aufgrund des singularischen Bezugs und der Bundesformel den einen Gott Israels.
- source_word: הוֹצֵאתִי אֶתְכֶם
  choice: euch ... herausgeführt hat
  rationale: Der Hifil von יצא bedeutet im Exoduszusammenhang „herausführen“. Das Relativpronomen „der“ nimmt im Deutschen natürlich auf „Jahwe“ Bezug.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: aus dem Land Ägypten
  rationale: Die Wiedergabe behält das ausdrücklich genannte אֶרֶץ („Land“) bei.
- source_word: לָתֵת לָכֶם אֶת אֶרֶץ כְּנַעַן
  choice: um euch das Land Kanaan zu geben
  rationale: Der Infinitiv mit ל wird als Zweckangabe wiedergegeben; die Formulierung erhält die Sprache der Landgabe.
- source_word: לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: und euer Gott zu sein
  rationale: Die übliche Bundesformel wird idiomatisch und relational wiedergegeben, ohne eine Veränderung in Gottes Wesen anzudeuten.
theological_decisions:
- issue: Wiedergabe des Bundesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich JHWH. „Jahwe“ bewahrt den persönlichen Gottesnamen, während „der HERR“ ihn durch einen Titel ersetzt.
- issue: Wiedergabe der Bundesformel לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: euer Gott zu sein
  alternative: für euch Gott zu sein; euch zum Gott zu werden
  rationale: Die gewählte Formulierung wahrt den Charakter einer Bundesbeziehung und vermeidet den missverständlichen Eindruck, Gott erfahre eine Wesensveränderung.
- issue: Verhältnis der beiden Infinitivkonstruktionen
  choice: um ... zu geben und ... zu sein
  alternative: um ... zu geben, damit ich euer Gott bin
  rationale: Beide Infinitive hängen am Herausführen aus Ägypten und benennen dessen Ziel. Die koordinierte deutsche Form bewahrt diese syntaktische Verbindung, ohne sie weiter auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Herausgeführt“ bewahrt den Exodusklang; Satzbau und Wortwahl bleiben für gewöhnliche Leser verständlich. Das Komma nach „Jahwe“ kennzeichnet „euer Gott“ als Apposition.
