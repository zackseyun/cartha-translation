  text: then he shall calculate the years since its sale and return the surplus to the man to whom he sold it, and he shall return to his property.
translation:
  language: de
  text: Dann soll er die Jahre seit dem Verkauf berechnen, dem Mann, dem er es verkauft hat, den Restbetrag[a] zurückzahlen und zu seinem Grundbesitz[b] zurückkehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den verbleibenden Betrag« beziehungsweise »den Überschuss«. Gemeint ist der Wertanteil für die noch verbleibenden Nutzungsjahre.'
    reason: lexical_alternative
  - marker: b
    text: Der »Grundbesitz« bezeichnet hier einen Landbesitz, der im israelitischen Recht gewöhnlich als erblicher Familienbesitz galt.
    reason: cultural_note
lexical_decisions:
- source_word: וְחִשַּׁב
  choice: Dann soll er … berechnen
  rationale: Das Verb bezeichnet hier die Berechnung des Rückkaufpreises; „dann“ gibt die Abfolge der Rechtsbestimmung natürlich wieder.
- source_word: שְׁנֵי מִמְכָּרוֹ
  choice: die Jahre seit dem Verkauf
  rationale: Wörtlich steht „die Jahre seines Verkaufs“. Im Zusammenhang sind die seit dem Verkauf verstrichenen Jahre gemeint, anhand deren der Rückzahlungsbetrag bestimmt wird.
- source_word: וְהֵשִׁיב אֶת הָעֹדֵף
  choice: den Restbetrag zurückzahlen
  rationale: הָעֹדֵף bezeichnet den nach der Berechnung verbleibenden Betrag; das Hifil von שׁוב bedeutet hier dessen Rückerstattung.
- source_word: לָאִישׁ אֲשֶׁר מָכַר לוֹ
  choice: dem Mann, an den er es verkauft hat
  rationale: Die Wiedergabe bewahrt den persönlichen Ausdruck „dem Mann“ und ergänzt das im Deutschen syntaktisch erforderliche Objekt aus dem Kontext.
- source_word: וְשָׁב
  choice: danach kann er … zurückkehren
  rationale: Das Verb bezeichnet die Rückkehr nach vollzogenem Rückkauf. „Kann“ drückt hier die rechtlich eröffnete Möglichkeit aus, ohne die Abfolge zu verändern.
- source_word: לַאֲחֻזָּתוֹ
  choice: zu seinem Grundbesitz
  rationale: אֲחֻזָּה meint in diesem Gesetz einen Landbesitz, insbesondere den innerhalb Israels zugeordneten erblichen Besitz; „Grundbesitz“ ist präziser als das allgemeine „Eigentum“.
theological_decisions:
- issue: Bedeutung von אֲחֻזָּה in den Erlassjahrbestimmungen
  choice: Grundbesitz
  alternative: Erbbesitz / Besitz
  rationale: Der Ausdruck bezeichnet hier nicht beliebiges Eigentum, sondern einen zugeordneten Landbesitz. „Grundbesitz“ hält diesen rechtlich-theologischen Zusammenhang fest, während die erbliche Dimension in der Fußnote erläutert wird.
- issue: Modalität von וְשָׁב nach erfolgter Rückzahlung
  choice: kann zurückkehren
  alternative: soll zurückkehren
  rationale: Im Zusammenhang beschreibt der Satz das durch den Rückkauf wiedergewonnene Recht zur Rückkehr auf den Besitz. Die Wiedergabe mit „kann“ vermeidet den Eindruck, die Rückkehr sei eine zusätzliche, unabhängig gebotene Pflicht.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Rechtstextcharakter. Die Satzfolge bleibt nahe am Hebräischen; fachliche Einzelheiten werden knapp in Fußnoten erläutert.
