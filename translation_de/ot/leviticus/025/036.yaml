  naturalness: Der Satz ist modernes, würdiges Standarddeutsch. „Und lass deinen Bruder bei dir leben“ ist als direkte Aufforderung idiomatischer und bildet die Handlungsaufforderung des Hebräischen klarer ab als „dein Bruder soll ... leben“.
