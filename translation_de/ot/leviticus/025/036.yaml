id: LEV.25.36
reference: Leviticus 25:36
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אַל תִּקַּ֤ח מֵֽ/אִתּ/וֹ֙ נֶ֣שֶׁךְ וְ/תַרְבִּ֔ית וְ/יָרֵ֖אתָ מֵֽ/אֱלֹהֶ֑י/ךָ וְ/חֵ֥י אָחִ֖י/ךָ עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/036.yaml
  text: Do not take interest or profit from him[a], but fear your God[b], and let your brother live with you.
translation:
  language: de
  text: Nimm von ihm weder Zins noch Aufschlag[a], sondern fürchte deinen Gott, und lass deinen Bruder bei dir leben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Zuwachs“ beziehungsweise „Gewinn“ statt „Aufschlag“; das Hebräische verbindet zwei verwandte Begriffe für eine Mehrleistung, die einem bedürftigen Schuldner abverlangt wird.
    reason: lexical_alternative
  - marker: b
    text: „Bruder“ bezeichnet hier einen Angehörigen der Bundesgemeinschaft, nicht unbedingt einen leiblichen Bruder.
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּקַּח
  choice: Nimm ... weder ... noch
  rationale: אַל mit dem Imperfekt formuliert ein direktes Verbot. Die deutsche Verbindung „weder ... noch“ gibt die beiden verbotenen Größen natürlich und präzise wieder.
- source_word: מֵאִתּוֹ
  choice: von ihm
  rationale: Die Präpositionalverbindung bezeichnet den bedürftigen Mitmenschen als denjenigen, dem die verbotene Mehrleistung abverlangt würde.
- source_word: נֶשֶׁךְ
  choice: Zins
  rationale: Das Substantiv bezeichnet einen für ein Darlehen erhobenen Zins. „Wucher“ wäre enger und könnte fälschlich nur einen überhöhten Zinssatz bezeichnen.
- source_word: וְתַרְבִּית
  choice: Aufschlag
  rationale: Der mit נֶשֶׁךְ gekoppelte Ausdruck bezeichnet eine zusätzlich verlangte Mehrleistung oder Vermehrung. „Aufschlag“ ist im wirtschaftlichen Zusammenhang verständlich, ohne die beiden hebräischen Begriffe völlig gleichzusetzen.
- source_word: וְיָרֵאתָ מֵאֱלֹהֶיךָ
  choice: sondern fürchte deinen Gott
  rationale: 'Das Waw wird im ethischen Gegensatz adversativ wiedergegeben: Statt den Bedürftigen auszunutzen, soll der Angesprochene Gott fürchten. „Deinen Gott“ bewahrt die direkte Bundesanrede.'
- source_word: וְחֵי
  choice: und ... soll ... leben
  rationale: Die Form lässt sich im Zusammenhang auffordernd beziehungsweise resultativ verstehen. Die Wiedergabe bewahrt die einfache Verknüpfung durch Waw und vermeidet einen ausdrücklich finalen Nebensatz, den der hebräische Text nicht eindeutig markiert.
- source_word: אָחִיךָ
  choice: dein Bruder
  rationale: Die wörtliche Verwandtschaftsbezeichnung bewahrt die soziale und bundesgemeinschaftliche Kraft des Hebräischen; ihr weiterer Sinn wird in der Fußnote erklärt.
- source_word: עִמָּךְ
  choice: bei dir
  rationale: Die Wendung bezeichnet das Weiterleben neben beziehungsweise innerhalb der Gemeinschaft des Angesprochenen. „Bei dir“ ist dafür im Deutschen natürlich und direkt.
theological_decisions:
- issue: Sozialethische Bedeutung von אָחִיךָ im Bundesrecht
  choice: dein Bruder
  alternative: dein israelitischer Mitbürger; dein Volksgenosse
  rationale: Der Vers betrifft einen verarmten Angehörigen der Bundesgemeinschaft. „Bruder“ erhält das familiäre Bild und die gegenseitige Verpflichtung des hebräischen Wortlauts, während die Fußnote klarstellt, dass nicht nur ein leiblicher Bruder gemeint ist.
- issue: Verhältnis zwischen Gottesfurcht und dem Lebensrecht des Bedürftigen
  choice: sondern fürchte deinen Gott, und dein Bruder soll bei dir leben
  alternative: fürchte deinen Gott, damit dein Bruder bei dir leben kann
  rationale: Die Übersetzung erhält die beiden mit Waw verbundenen Aussagen, ohne die mögliche Zweck- oder Folgebeziehung dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Gesetzessprache. Die traditionelle, aber heute missverständliche Wiedergabe „Wucher“ wird vermieden. Die Satzfügung wahrt die knappe hebräische Reihung und lässt das genaue Verhältnis von Aufforderung, Folge und Zweck offen.
