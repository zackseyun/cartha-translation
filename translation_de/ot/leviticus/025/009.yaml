revisions:
- from: Dann sollst du im siebten Monat, am zehnten Tag des Monats, einen lauten Stoß des Signalhorns[a] ertönen lassen. Am Versöhnungstag[b] sollt ihr das Horn in eurem ganzen Land erschallen lassen.
  to: Dann sollst du im siebten Monat, am zehnten Tag des Monats, einen lauten Hornstoß[a] erschallen lassen. Am Versöhnungstag[b] sollt ihr das Signalhorn in eurem ganzen Land erschallen lassen.
  rationale: Die Revision ersetzt die in der ersten Satzhälfte missverständliche Genitivkonstruktion durch „einen lauten Hornstoß“. Dadurch werden שׁוֹפָר und תְּרוּעָה als Instrument und sein lautes Signal idiomatisch erfasst. Alle übrigen Entscheidungen, einschließlich des im Hebräischen vorliegenden Numeruswechsels und der Fußnotenanker, können bestehen bleiben.
