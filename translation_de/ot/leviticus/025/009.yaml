  text: וְ/הַֽעֲבַרְתָּ֞ שׁוֹפַ֤ר תְּרוּעָה֙ בַּ/חֹ֣דֶשׁ הַ/שְּׁבִעִ֔י בֶּ/עָשׂ֖וֹר לַ/חֹ֑דֶשׁ בְּ/יוֹם֙ הַ/כִּפֻּרִ֔ים תַּעֲבִ֥ירוּ שׁוֹפָ֖ר בְּ/כָל אַרְצְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/009.yaml
  text: Then you shall sound a trumpet blast in the seventh month[a], on the tenth day of the month[b]. On the Day of Atonement you shall sound the trumpet throughout all your land.
translation:
  language: de
  text: Dann sollst du im siebten Monat, am zehnten Tag des Monats, einen lauten Hornstoß[a] erschallen lassen. Am Versöhnungstag[b] sollt ihr das Signalhorn in eurem ganzen Land erschallen lassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch schofar: ein aus Tierhorn gefertigtes Blasinstrument, traditionell oft als Widderhorn verstanden.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch wörtlich: „Tag der Versöhnungen“; das entsprechende Substantiv steht in der Mehrzahl.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲבַרְתָּ
  choice: Dann sollst du … ertönen lassen
  rationale: Der Hifil von עבר bedeutet wörtlich „hinübergehen lassen“; zusammen mit שׁוֹפָר bezeichnet er idiomatisch das Ertönenlassen des Hornsignals. „Dann“ gibt das fortführende וְ in natürlichem Deutsch wieder.
- source_word: שׁוֹפַר תְּרוּעָה
  choice: einen lauten Stoß des Signalhorns
  rationale: שׁוֹפָר bezeichnet ein aus Horn gefertigtes Blasinstrument; תְּרוּעָה ist hier sein lautes Signal. Die Formulierung ist verständlich und bewahrt den kräftigen Signalcharakter.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: im siebten Monat
  rationale: Direkte und natürliche Wiedergabe der Zeitangabe.
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: am zehnten Tag des Monats
  rationale: Die hebräische Wendung lautet wörtlich „am Zehnten des Monats“; die Ergänzung „Tag“ macht sie im Deutschen eindeutig.
- source_word: בְּיוֹם הַכִּפֻּרִים
  choice: Am Versöhnungstag
  rationale: Dies ist die geläufige deutsche Bezeichnung des kultischen Festtags. Die grammatische Mehrzahl von כִּפֻּרִים wird in einer Fußnote kenntlich gemacht.
- source_word: תַּעֲבִירוּ שׁוֹפָר
  choice: sollt ihr das Horn … erschallen lassen
  rationale: Die zweite Verbform steht im Plural und wiederholt denselben idiomatischen Ausdruck. „Erschallen lassen“ gibt das Ausbreiten des Hornsignals natürlich wieder.
- source_word: בְּכָל אַרְצְכֶם
  choice: in eurem ganzen Land
  rationale: Die Wendung bezeichnet die umfassende räumliche Ausdehnung des Signals im gesamten Land.
theological_decisions:
- issue: Wiedergabe von יוֹם הַכִּפֻּרִים
  choice: Versöhnungstag
  alternative: Tag der Versöhnungen / Tag der Sühnehandlungen
  rationale: „Versöhnungstag“ bezeichnet den gemeinten heiligen Tag klar und traditionsübergreifend. Die im Hebräischen stehende Mehrzahl bleibt durch die Fußnote sichtbar, ohne im Haupttext unnatürlich zu wirken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Wechsel vom Singular „du“ zur Mehrzahl „ihr“ folgt bewusst dem hebräischen Text. „Signalhorn“ vermeidet die mögliche Verwechslung mit einer modernen Metalltrompete; die Fußnote nennt den hebräischen Fachbegriff.
