    rationale: „einen lauten Stoß des Signalhorns“ legt nahe, der Stoß gehöre zum Horn; die hebräische Wortverbindung bezeichnet vielmehr einen lauten Hornstoß bzw. ein durch das Horn gegebenes Signal. Die Revision stellt den Hornstoß als Klangereignis klarer dar.
