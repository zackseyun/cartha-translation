base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/044.yaml
  text: As for your male servant and your female servant who may belong to you[a], from the nations that are around you[b], from them you may buy a male servant and a female servant.
translation:
  language: de
  text: 'Was aber deinen Sklaven und deine Sklavin betrifft, die dir gehören werden: Von den Völkern, die rings um euch herum sind, von ihnen dürft ihr einen Sklaven und eine Sklavin kaufen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַבְדְּךָ
  choice: deinen Sklaven
  rationale: עֶבֶד kann einen Diener oder Sklaven bezeichnen. Da der Vers ausdrücklich vom Kauf und Besitz von Menschen handelt, gibt »Sklave« den rechtlichen Status hier klarer wieder.
- source_word: אֲמָתְךָ
  choice: deine Sklavin
  rationale: אָמָה ist die weibliche Bezeichnung und wird parallel zum männlichen עֶבֶד gebraucht. »Sklavin« ist modern, eindeutig und wahrt die Geschlechtsunterscheidung.
- source_word: אֲשֶׁר יִהְיוּ לָךְ
  choice: die dir gehören können
  rationale: Die Wendung bezeichnet Personen, die in den Besitz des Angesprochenen gelangen können. »Gehören können« bewahrt sowohl den Zukunftsaspekt als auch den rechtlich-possessiven Sinn.
- source_word: מֵאֵת הַגּוֹיִם
  choice: von den Völkern
  rationale: גּוֹיִם meint hier die nichtisraelitischen Völker. »Völker« ist im Deutschen natürlich und weniger missverständlich oder theologisch aufgeladen als »Heiden«.
- source_word: אֲשֶׁר סְבִיבֹתֵיכֶם
  choice: die rings um euch wohnen
  rationale: Das Hebräische bezeichnet die Völker in Israels Umgebung. Das im Deutschen ergänzte »wohnen« macht die räumliche Beziehung idiomatisch deutlich, ohne den Sinn zu verändern.
- source_word: מֵהֶם
  choice: von den Völkern …
  rationale: Das rückverweisende »von ihnen« wird im Deutschen durch die vorangestellte Herkunftsangabe wiedergegeben; eine zusätzliche Wiederholung wäre schwerfällig.
- source_word: תִּקְנוּ
  choice: dürft ihr … kaufen
  rationale: קנה bedeutet »kaufen/erwerben«. Im gesetzlichen Zusammenhang liegt eine Erlaubnis und kein Kaufgebot vor; »dürft« bringt diese modale Kraft klar zum Ausdruck.
- source_word: עֶבֶד וְאָמָה
  choice: Sklaven und Sklavinnen
  rationale: Das hebräische Singularpaar ist generisch-distributiv. Der deutsche Plural klingt in dieser allgemeinen Rechtsbestimmung natürlich und bewahrt die ausdrückliche Nennung beider Geschlechter.
theological_decisions:
- issue: Wiedergabe der Sklavereibegriffe in einem Rechtstext
  choice: »Sklave/Sklavin« statt »Diener/Dienerin«
  alternative: »Diener und Dienerin«
  rationale: Der ausdrückliche Kauf und das Zugehören machen den unfreien Besitzstatus zum wesentlichen Bestandteil der Aussage. Eine mildere Wiedergabe würde diesen rechtlichen Sachverhalt verdecken.
- issue: Modalität von תִּקְנוּ
  choice: 'permissiv: »dürft ihr kaufen«'
  alternative: 'imperativisch: »sollt ihr kaufen«'
  rationale: Der Zusammenhang gestattet den Erwerb aus den umliegenden Völkern, gebietet ihn aber nicht. Die permissive Wiedergabe wahrt die Funktion der Vorschrift.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die harte rechtliche Terminologie wird nicht beschönigt. Der Wechsel vom Singular »dir« zum Plural »euch/ihr« entspricht dem hebräischen Text; die Satzstellung wurde für natürliches Deutsch leicht umgeordnet.
