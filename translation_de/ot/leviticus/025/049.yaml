revisions:
- from: Entweder sein Onkel oder der Sohn seines Onkels[a] kann ihn auslösen; auch einer seiner nahen Blutsverwandten aus seiner Sippe kann ihn auslösen. Oder wenn seine Hand die nötigen Mittel erlangt[b], kann er sich selbst auslösen.
  to: Entweder sein Onkel oder sein Cousin[a] kann ihn auslösen; auch einer seiner nahen Blutsverwandten aus seiner Sippe kann ihn auslösen. Oder wenn er zu ausreichenden Mitteln kommt[b], kann er ausgelöst werden.
  rationale: Die Revision macht die Mittel-Wendung im modernen Deutsch idiomatisch, bewahrt ihre hebräische Bildsprache in der Fußnote und gibt das abschließende Nifal passiv wieder, ohne die kontextuell mögliche Selbst-Auslösung dogmatisch oder syntaktisch festzuschreiben. Die Cousin-Anmerkung liefert nun tatsächlich die wörtliche hebräische Ausdrucksweise.
