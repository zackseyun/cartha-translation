review_pass:
  verdict: revise
  source_fidelity: Die Verwandtschaftsreihe und die Auslösungsterminologie sind grundsätzlich treffend. Die Form וְנִגְאָל ist jedoch Nifal und damit grammatisch passiv („er wird/kann ausgelöst werden“); „kann er sich selbst auslösen“ legt eine reflexive Deutung fest, die der hebräische Wortlaut nicht ausdrücklich markiert. Die Mittel-Wendung kann im deutschen Haupttext idiomatisch wiedergegeben und in einer Anmerkung als Hand-Idiom erläutert werden.
  naturalness: „Wenn seine Hand die nötigen Mittel erlangt“ ist im heutigen Standarddeutsch unnötig steif und weist der „Hand“ eine unnatürliche Handlung zu. „Wenn er zu ausreichenden Mitteln kommt“ ist klar und natürlich. Die Anmerkung erhält die hebräische Bildsprache. Die Fußnote zu „Sohn seines Onkels“ ist bei einer bereits wörtlichen Wiedergabe entbehrlich.
  terminology: „auslösen“ ist für גאל im rechtlich-verwandtschaftlichen Zusammenhang gut gewählt und sollte durchgehend stehen bleiben. „Nahe Blutsverwandte“ und „Sippe“ geben die Nähe der Verwandtschaft beziehungsweise den weiteren Familienverband angemessen wieder.
  issues:
  - severity: medium
    issue: Die reflexive Wiedergabe von וְנִגְאָל legt den Sinn enger fest als die passive hebräische Form.
    rationale: Das Nifal bedeutet formal „er wird/kann ausgelöst werden“. Der Kontext erlaubt zwar Selbst-Auslösung mit erworbenen Mitteln, aber der Wortlaut sagt dies nicht ausdrücklich; die deutsche passive Form bewahrt die Mehrdeutigkeit.
  - severity: medium
    issue: Die Hand-Metapher ist im Haupttext unnatürlich und die Fußnote paraphrasiert sie nicht ganz präzise.
    rationale: „Seine Hand erlangt die nötigen Mittel“ ist keine geläufige moderne deutsche Wendung. Die hebräische Formulierung kann natürlich als Erwerb ausreichender Mittel übersetzt werden; die Fußnote sollte das wörtliche Bild als „seine Hand erreicht/erlangt“ erklären.
  - severity: low
    issue: Fußnote a erläutert eine Alternative, obwohl der Text bereits die wörtliche Formulierung bietet.
    rationale: 'Bei „der Sohn seines Onkels“ ist eine Fußnote „Wörtlich: ...; also sein Cousin“ redundant. Eine Anmerkung ist sinnvoller, wenn im Text „sein Cousin“ steht.'
