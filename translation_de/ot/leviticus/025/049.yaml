base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/049.yaml
  text: or his uncle[a], or his uncle’s son, may redeem him; or one of his close blood relatives from his clan may redeem him; or if his hand prospers[b], he may redeem himself.
translation:
  language: de
  text: Entweder sein Onkel oder sein Cousin[a] kann ihn auslösen; auch einer seiner nahen Blutsverwandten aus seiner Sippe kann ihn auslösen. Oder wenn er zu ausreichenden Mitteln kommt[b], kann er ausgelöst werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der Sohn seines Onkels“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „wenn seine Hand es erreicht/erlangt“; gemeint ist, dass er ausreichende Mittel erwirbt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דֹדוֹ
  choice: sein Onkel
  rationale: Im Zusammenhang des verwandtschaftlichen Auslösungsrechts bezeichnet דּוֹד den Onkel.
- source_word: בֶן דֹּדוֹ
  choice: der Sohn seines Onkels
  rationale: Die wörtliche Verwandtschaftsbezeichnung bleibt im Text erhalten; gemeint ist sein Cousin.
- source_word: יִגְאָלֶנּוּ
  choice: kann ihn auslösen
  rationale: גאל bezeichnet hier das rechtliche Zurückkaufen durch einen Verwandten. „Auslösen“ wahrt den Leitbegriff und die modale Aussage.
- source_word: מִשְּׁאֵר בְּשָׂרוֹ
  choice: einer seiner nahen Blutsverwandten
  rationale: Die hebräische Wendung bezeichnet einen nahen leiblichen Verwandten; „Blutsverwandten“ gibt diese Nähe natürlich wieder.
- source_word: מִמִּשְׁפַּחְתּוֹ
  choice: aus seiner Sippe
  rationale: מִשְׁפָּחָה bezeichnet hier den größeren verwandtschaftlichen Verband, nicht nur die Kernfamilie.
- source_word: הִשִּׂיגָה יָדוֹ
  choice: wenn seine Hand die nötigen Mittel erlangt
  rationale: Die Formulierung bewahrt das konkrete Bild der Hand und macht zugleich deutlich, dass ausreichende finanzielle Mittel gemeint sind.
- source_word: וְנִגְאָל
  choice: kann er sich selbst auslösen
  rationale: Obwohl die hebräische Form passiv ist, ergibt der Zusammenhang, dass der Betroffene mit den erlangten Mitteln seine eigene Auslösung bewirken kann.
theological_decisions:
- issue: Wiedergabe der Terminologie des verwandtschaftlichen Rückkaufs
  choice: „auslösen“ durchgehend für גאל
  alternative: „zurückkaufen“
  rationale: „Auslösen“ erhält den rechtlich-theologischen Leitbegriff, ohne den Vorgang auf einen gewöhnlichen Kauf zu reduzieren.
- issue: Wiedergabe der Wendung הִשִּׂיגָה יָדוֹ
  choice: Das Bild der Hand bleibt in lesbarer Form erhalten.
  alternative: „wenn er zu ausreichenden Mitteln kommt“
  rationale: Die gewählte Fassung bewahrt die Bildsprache des Hebräischen und erläutert innerhalb der Wendung ihren wirtschaftlichen Sinn.
- issue: Aktive beziehungsweise reflexive Wiedergabe von וְנִגְאָל
  choice: „kann er sich selbst auslösen“
  alternative: „kann er ausgelöst werden“
  rationale: Der unmittelbare Zusammenhang mit seinen eigenen erlangten Mitteln legt Selbst-Auslösung nahe; die Fußnote ist nicht nötig, da die syntaktische Spannung den Sinn im Deutschen sonst unnötig verdunkeln würde.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sippe“ bildet den weiteren verwandtschaftlichen Verband ab; „auslösen“ hält die Terminologie des Kapitels zusammen. Die Hand-Metapher bleibt erhalten, wird aber durch „die nötigen Mittel“ unmittelbar verständlich gemacht.
