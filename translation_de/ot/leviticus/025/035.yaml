revisions:
- from: Wenn dein Bruder verarmt und seine Hand bei dir ins Wanken gerät[a], sollst du ihn unterstützen, wie einen ansässigen Fremden oder einen Beisassen[b], damit er bei dir leben kann.
  to: Wenn dein Bruder verarmt und seine Hand bei dir nachlässt[a], sollst du ihn unterstützen; er soll bei dir als ansässiger Fremder oder zeitweiliger Bewohner leben[b].
  rationale: Die Satzstellung stellt die Statusangabe zu „bei dir … leben“ und entspricht damit besser der Abfolge und möglichen syntaktischen Funktion des Hebräischen. Die Fußnote bewahrt ausdrücklich die konkurrierende Objektlesart und den hebräischen Wortlaut mit „und“. Zugleich werden ein missverständlicheres deutsches Bild und ein veralteter Sozialstatusbegriff durch moderne, semantisch zurückhaltende Formulierungen ersetzt.
