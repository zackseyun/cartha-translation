  verdict: revise
  source_fidelity: Die Übersetzung trifft den wirtschaftlichen Notfall, das Unterstützungsgebot und den wiederholten Gemeinschaftsbezug von עִמָּךְ grundsätzlich. Die Hauptfassung sollte jedoch die abschließende, syntaktisch verdichtete Nominalgruppe enger an וָחַי עִמָּךְ binden. „wie einen …“ macht sie zu einem Vergleichsmaßstab für das Unterstützen; im Hebräischen liegt mindestens ebenso nahe, dass sie den Status beziehungsweise die Weise des weiteren Lebens bei dem Angesprochenen bestimmt.
  naturalness: „Seine Hand bei dir ins Wanken gerät“ ist als beibehaltene Metapher verständlich, aber etwas unidiomatisch. „bei dir nachlässt“ ist in modernem Standarddeutsch natürlicher und wahrt das Bild hinreichend; die Fußnote erläutert die wirtschaftliche Bedeutung. „Beisasse“ ist heute deutlich archaisch. „zeitweiliger Bewohner“ vermittelt den sozialrechtlichen Grundkontrast in modernem Deutsch, ohne eine zu präzise historische Rechtskategorie vorzutäuschen.
  terminology: „Dein Bruder“ und „unterstützen“ sind angemessen. Für גֵּר ist „ansässiger Fremder“ transparent. Die Wiedergabe von תּוֹשָׁב als „zeitweiliger Bewohner“ ist zeitgemäßer als „Beisasse“. Das im Hebräischen stehende וְ wird in der Hauptfassung mit „oder“ nur als vorsichtige deutsche Auflösung der umstrittenen Verhältnisbestimmung wiedergegeben; die Fußnote muss den wörtlichen Wortlaut mit „und“ sowie die Alternativen sichtbar machen.
  issues:
