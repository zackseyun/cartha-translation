source:
  edition: WLC
  text: וְ/כִֽי יָמ֣וּךְ אָחִ֔י/ךָ וּ/מָ֥טָה יָד֖/וֹ עִמָּ֑/ךְ וְ/הֶֽחֱזַ֣קְתָּ בּ֔/וֹ גֵּ֧ר וְ/תוֹשָׁ֛ב וָ/חַ֖י עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/035.yaml
  text: If your brother becomes poor and his hand falters beside you[a], then you shall support him[b]; so that he may live beside you as a resident foreigner or a temporary resident.
translation:
  language: de
  text: Wenn dein Bruder verarmt und seine Hand bei dir nachlässt[a], sollst du ihn unterstützen; er soll bei dir als ansässiger Fremder oder zeitweiliger Bewohner leben[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und seine Hand bei dir lässt nach“. Das Bild bezeichnet den Verlust der Mittel oder der Fähigkeit, sich selbst zu erhalten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Fremder und Beisasse“. Die hebräische Wendung ist syntaktisch verdichtet. Sie kann auch als zusätzliche Objektgruppe verstanden werden: „Unterstütze ihn – den ansässigen Fremden und den zeitweiligen Bewohner“; möglich ist ferner, sie als Bezeichnung dafür zu lesen, in welchem Status der Verarmte bei dir leben soll.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְכִי
  choice: Wenn
  rationale: Leitet einen bedingten Rechtsfall ein; das vorangestellte וְ muss im Deutschen nicht eigens mit „und“ wiedergegeben werden.
- source_word: יָמוּךְ
  choice: verarmt
  rationale: Das Verb bezeichnet hier das wirtschaftliche Absinken beziehungsweise den Verlust der Lebensgrundlage.
- source_word: אָחִיךָ
  choice: dein Bruder
  rationale: Bewahrt die konkrete Verwandtschafts- und Gemeinschaftssprache des Hebräischen, die im Kontext einen Angehörigen der Bundesgemeinschaft bezeichnet.
- source_word: וּמָטָה יָדוֹ עִמָּךְ
  choice: und seine Hand bei dir ins Wanken gerät
  rationale: Bewahrt das hebräische Bild einer schwankenden Hand und lässt zugleich erkennen, dass die wirtschaftliche Handlungs- und Selbsterhaltungsfähigkeit nachlässt. „Bei dir“ gibt den gemeinschaftlichen Bezug von עִמָּךְ wieder.
- source_word: וְהֶחֱזַקְתָּ בּוֹ
  choice: sollst du ihn unterstützen
  rationale: Der Hifil von חזק fordert hier, den Bedürftigen festzuhalten, zu stärken und materiell zu stützen; „unterstützen“ ist im Deutschen klar und kontextgerecht.
- source_word: גֵּר
  choice: ansässiger Fremder
  rationale: Bezeichnet einen Nichtisraeliten, der dauerhaft innerhalb der Gemeinschaft lebt und einen geschützten sozialen Status besitzt.
- source_word: וְתוֹשָׁב
  choice: oder einen Beisassen
  rationale: „Beisasse“ bezeichnet einen ortsansässigen Menschen ohne vollen einheimischen Status und unterscheidet die Bezeichnung von גֵּר. „Oder“ gibt die beiden möglichen Vergleichskategorien idiomatisch wieder, ohne ihre genaue rechtliche Beziehung abschließend festzulegen.
- source_word: וָחַי
  choice: damit er … leben kann
  rationale: 'Gibt die naheliegende Zweck- beziehungsweise Ergebnisbeziehung wieder: Die Unterstützung soll sein weiteres Leben in der Gemeinschaft ermöglichen.'
- source_word: עִמָּךְ
  choice: bei dir
  rationale: Die Wiederholung nimmt den gemeinschaftlichen und räumlichen Bezug auf und klingt im Deutschen natürlicher als „neben dir“.
theological_decisions:
- issue: Bedeutungsumfang von „dein Bruder“
  choice: Die wörtliche Verwandtschaftsbezeichnung „dein Bruder“ bleibt erhalten.
  alternative: „dein Volksgenosse“ oder „dein Mitisraelit“
  rationale: Der Kontext weist auf ein Mitglied der israelitischen Bundesgemeinschaft, doch die Übersetzung soll die vom Ausgangstext gewählte familiäre Sprache nicht durch eine auslegende Verallgemeinerung ersetzen.
- issue: Syntaktische Funktion von גֵּר וְתוֹשָׁב
  choice: 'Die Wendung wird vergleichend auf die gebotene Unterstützung bezogen: „wie einen ansässigen Fremden oder einen Beisassen“.'
  alternative: 'Die Wendung kann als zusätzliche Objektgruppe verstanden werden: „Unterstütze ihn – den ansässigen Fremden und den Beisassen“; möglich ist auch eine Statusangabe dazu, wie der verarmte Bruder bei dem Angesprochenen leben soll.'
  rationale: Die hebräische Formulierung ist stark verdichtet. Die Hauptfassung bietet eine verständliche syntaktische Verbindung, während die Fußnote die echte Mehrdeutigkeit offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Metapher der wankenden Hand bleibt erhalten und wird in einer Fußnote erklärt. „Ansässiger Fremder“ ist transparent; „Beisasse“ ist als präziser rechtlich-sozialer Begriff leicht gehoben, im Zusammenhang jedoch verständlich. Die Satzstruktur macht das Unterstützungsgebot klar, ohne die syntaktische Mehrdeutigkeit des Schlusses zu verschweigen.
