  - severity: low
    issue: „ins Wanken gerät“ kann im Deutschen eher Unentschlossenheit als den Verlust wirtschaftlicher Möglichkeiten nahelegen.
    rationale: „nachlässt“ ist idiomatischer; die Fußnote sichert die spezifische Bedeutung des hebräischen Bildes.
