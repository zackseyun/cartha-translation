id: LEV.25.15
reference: Leviticus 25:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בְּ/מִסְפַּ֤ר שָׁנִים֙ אַחַ֣ר הַ/יּוֹבֵ֔ל תִּקְנֶ֖ה מֵ/אֵ֣ת עֲמִיתֶ֑/ךָ בְּ/מִסְפַּ֥ר שְׁנֵֽי תְבוּאֹ֖ת יִמְכָּר לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/015.yaml
  text: According to the number of years after the Jubilee[a], you shall buy from your fellow; according to the number of years of crops he shall sell to you.
translation:
  language: de
  text: Nach der Zahl der Jahre seit dem Jobeljahr sollst du von deinem Nächsten kaufen; nach der Zahl der Erntejahre[a] soll er dir verkaufen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Jahre der Erträge“ oder „Jahre der Ernten“. Der Kaufpreis richtet sich nach der Zahl der ertragbringenden Jahre bis zum nächsten Jobeljahr; das Land wird nicht dauerhaft übereignet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִסְפַּר
  choice: nach der Zahl
  rationale: Die Verbindung aus בְּ und מִסְפָּר bezeichnet den Maßstab der Berechnung; „nach der Zahl“ gibt dies im Deutschen knapp und sachgerecht wieder.
- source_word: אַחַר הַיּוֹבֵל
  choice: seit dem Jobeljahr
  rationale: Im Zusammenhang der Preisberechnung bezeichnet אַחַר den Zeitraum nach dem letzten Jobeljahr. „Seit“ ist im Deutschen natürlicher als das wörtlichere „nach“, ohne den zeitlichen Bezug zu verändern.
- source_word: תִּקְנֶה
  choice: sollst du … kaufen
  rationale: Der Imperfekt in dieser Rechtsanweisung hat regelnden Charakter; „sollst“ bewahrt diesen, ohne ihn unnötig als absoluten Befehl zu verschärfen.
- source_word: מֵאֵת עֲמִיתֶךָ
  choice: von deinem Nächsten
  rationale: עָמִית bezeichnet hier den anderen Angehörigen der Rechts- und Bundesgemeinschaft. „Nächster“ ist verständlich und lässt die genaue soziale Reichweite des Ausdrucks offen.
- source_word: שְׁנֵי תְבוּאֹת
  choice: Erntejahre
  rationale: Die Wendung bedeutet wörtlich etwa „Jahre der Erträge/Ernten“ und meint die bis zum nächsten Jobeljahr verbleibenden Jahre, in denen Ertrag erzielt werden kann.
- source_word: יִמְכָּר לָךְ
  choice: soll er dir verkaufen
  rationale: Die Formulierung wahrt die rechtliche Entsprechung zwischen dem Kaufen und dem Verkaufen sowie den ausdrücklich genannten Empfänger.
