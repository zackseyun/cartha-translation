  language: en
  yaml_path: translation/ot/leviticus/025/048.yaml
  text: After he has been sold[a], he may be redeemed; one of his brothers may redeem him.
translation:
  language: de
  text: Nachdem er verkauft wurde, kann er ausgelöst werden; einer seiner Brüder[a] kann ihn auslösen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder im weiteren rechtlichen Sinn: „einer seiner männlichen Verwandten“. Wörtlich steht im Hebräischen „einer seiner Brüder“; im Zusammenhang des Löserrechts kann dies einen männlichen Familienangehörigen bezeichnen, der als Löser handelt.'
    reason: lexikalische Alternative und Erläuterung des rechtlichen Verwandtschaftsbegriffs
lexical_decisions:
- source_word: אַחֲרֵי נִמְכַּר
  choice: Nachdem er verkauft worden ist
  rationale: אַחֲרֵי leitet den zeitlichen Umstand ein; das Nifal von מכר wird passiv wiedergegeben. Das deutsche Perfekt im Nebensatz bezeichnet den bereits erfolgten Verkauf natürlich und präzise.
- source_word: גְּאֻלָּה תִּהְיֶה לּוֹ
  choice: kann er ausgelöst werden
  rationale: Die Verbindung aus dem Substantiv „Auslösung“ und der Existenzkonstruktion „wird ihm sein“ besagt im Rechtszusammenhang, dass ihm die Möglichkeit der Auslösung offensteht. Die verbale Wiedergabe ist im Deutschen klarer als „Auslösung soll ihm zustehen“.
- source_word: אֶחָד מֵאֶחָיו
  choice: einer seiner Brüder
  rationale: Die Formulierung bedeutet wörtlich „einer von seinen Brüdern“. „Brüder“ bewahrt die ausdrücklich männliche Verwandtschaftsbezeichnung; eine mögliche weitere rechtliche Bedeutung wird in der Fußnote erläutert.
- source_word: יִגְאָלֶנּוּ
  choice: kann ihn auslösen
  rationale: גאל bezeichnet hier die verwandtschaftliche Auslösung beziehungsweise den Rückkauf. „Auslösen“ wahrt den rechtlichen Sinn und den Zusammenhang mit dem Löserrecht; „kann“ gibt die eröffnete rechtliche Möglichkeit wieder.
theological_decisions:
- issue: Bedeutungsumfang von אֶחָיו im Löserrecht
  choice: seiner Brüder
  alternative: seiner männlichen Verwandten
  rationale: Der Haupttext bewahrt die ausdrücklich männliche Pluralform und löst sie nicht stillschweigend in einen weiteren Verwandtschaftsbegriff auf. Zugleich weist die Fußnote auf den rechtlichen Sinn eines als Löser handelnden männlichen Familienangehörigen hin.
- issue: Nominale oder verbale Wiedergabe von גְּאֻלָּה תִּהְיֶה לּוֹ
  choice: kann er ausgelöst werden
  alternative: steht ihm Auslösung zu
  rationale: Die verbale Formulierung vermittelt die rechtlich gewährte Möglichkeit idiomatisch, ohne daraus eine zwingende tatsächliche Auslösung zu machen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper rechtlicher Ausdrucksweise. „Auslösen“ wird bewusst wiederholt, um die Wortverbindung zwischen גְּאֻלָּה und גאל sichtbar zu halten.
