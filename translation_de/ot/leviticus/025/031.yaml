  text: וּ/בָתֵּ֣י הַ/חֲצֵרִ֗ים אֲשֶׁ֨ר אֵין לָ/הֶ֤ם חֹמָה֙ סָבִ֔יב עַל שְׂדֵ֥ה הָ/אָ֖רֶץ יֵחָשֵׁ֑ב גְּאֻלָּה֙ תִּהְיֶה לּ֔/וֹ וּ/בַ/יֹּבֵ֖ל יֵצֵֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/031.yaml
  text: But the houses of the villages that have no wall around them shall be regarded as the fields of the land[a]; redemption shall be available for them[b], and in the Jubilee they shall go out.
translation:
  language: de
  text: Die Häuser der Dörfer aber, die keine Mauer ringsum haben, sollen wie ländlicher Grundbesitz gelten[a]. Für sie besteht ein Rückkaufsrecht, und im Jubeljahr werden sie freigegeben[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »sollen als Feld des Landes gerechnet werden«; solche Dorfhäuser werden rechtlich wie ländlicher Grundbesitz behandelt, nicht wie Häuser in einer ummauerten Stadt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »und im Jubeljahr geht es hinaus«. Gemeint ist die Freigabe des Besitzes im Jubeljahr; im rechtlichen Zusammenhang kehrt er an die Familie des ursprünglichen Besitzers zurück.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָתֵּי הַחֲצֵרִים
  choice: Die Häuser in den Dörfern
  rationale: חֲצֵרִים bezeichnet hier ländliche Dörfer oder Siedlungen; die fehlende Mauer wird im folgenden Relativsatz ausdrücklich genannt.
- source_word: אֲשֶׁר אֵין לָהֶם חֹמָה סָבִיב
  choice: die keine Mauer ringsum haben
  rationale: Gibt das Fehlen einer umschließenden Mauer klar und nah am hebräischen Wortlaut wieder.
- source_word: עַל שְׂדֵה הָאָרֶץ יֵחָשֵׁב
  choice: sollen wie das Feld des Landes gelten
  rationale: Bewahrt die konkrete hebräische Formulierung und bringt zugleich die rechtliche Gleichstellung mit ländlichem Grundbesitz zum Ausdruck.
- source_word: גְּאֻלָּה תִּהְיֶה לּוֹ
  choice: Für sie besteht ein Rückkaufsrecht
  rationale: גְּאֻלָּה bezeichnet im Grundstücksrecht die Möglichkeit beziehungsweise das Recht, veräußerten Familienbesitz zurückzukaufen.
- source_word: וּבַיֹּבֵל יֵצֵא
  choice: im Erlassjahr fallen sie an den ursprünglichen Eigentümer zurück
  rationale: Das wörtliche „hinausgehen“ bezeichnet in diesem Rechtszusammenhang die Freigabe beziehungsweise Rückübertragung des Besitzes im Jobeljahr.
theological_decisions:
- issue: Bedeutung von יֵצֵא im Jobeljahr
  choice: Rückfall an den ursprünglichen Eigentümer
  alternative: „sie kommen frei“ oder wörtlich „sie gehen hinaus“
  rationale: Der rechtliche Kontext von Levitikus 25 zeigt, dass das Grundstück im Jobeljahr aus dem Besitz des Käufers entlassen wird und zum ursprünglichen Eigentümer beziehungsweise dessen Familie zurückkehrt; die Fußnote wahrt die hebräische Bildsprache.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Erlassjahr“ ist im Haupttext unmittelbar verständlich; die Fußnote nennt zusätzlich die traditionelle Bezeichnung „Jobeljahr“. Die rechtliche Aussage wird idiomatisch formuliert, während die wörtlicheren hebräischen Wendungen in den Fußnoten erhalten bleiben.
