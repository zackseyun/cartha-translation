revisions:
- from: Und im ganzen Land eures Besitzes[b] sollt ihr die Auslösung des Landes gewähren.[a]
  to: Und im gesamten Gebiet eures Landbesitzes[b] sollt ihr die Auslösung von Land ermöglichen.[a]
  rationale: Die Revision ersetzt die im Deutschen nicht idiomatische Formulierung „Land eures Besitzes“ durch „Gebiet eures Landbesitzes“ und fasst die rechtliche Handlung natürlicher als Ermöglichung der Auslösung. Sie bleibt beim Sinn des Hebräischen und erhält die lexikalische Offenheit von גְּאֻלָּה; die Deutung als Rückkaufsrecht erscheint weiterhin nur in der Fußnote.
