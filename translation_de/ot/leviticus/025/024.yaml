  text: And in all the land of your possession[b][a], you shall grant redemption for the land.
translation:
  language: de
  text: Und im gesamten Gebiet eures Landbesitzes[b] sollt ihr die Auslösung von Land ermöglichen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ihr sollt für Land ein Rückkaufsrecht einräumen.“'
    reason: lexical_alternative
  - marker: b
    text: „Landbesitz“ meint hier den zugeteilten Grundbesitz innerhalb Israels, besonders den Grund und Boden, der einer Familie als bleibendes Erbteil zugeordnet war.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְכֹל
  choice: Und im ganzen
  rationale: Die Verbindung aus Konjunktion, Präposition und כֹּל leitet eine umfassende rechtliche Bestimmung ein. „Und im ganzen“ gibt den Anschluss und den Geltungsbereich knapp wieder.
- source_word: אֶרֶץ
  choice: Land
  rationale: Im Zusammenhang der Landordnung in Levitikus 25 bezeichnet אֶרֶץ den Grund und Boden beziehungsweise das Landgebiet, nicht die Erde als Ganzes.
- source_word: אֲחֻזַּתְכֶם
  choice: eures Besitzes
  rationale: אֲחֻזָּה bezeichnet hier den dauerhaft zugeordneten Landbesitz innerhalb Israels. Die formale Wiedergabe „Besitz“ bewahrt den rechtlichen Charakter; der kulturelle Hintergrund wird in einer Fußnote erläutert.
- source_word: גְּאֻלָּה
  choice: Auslösung
  rationale: Das Substantiv bezeichnet die entgeltliche Rückgewinnung veräußerten Landes und kann sowohl den Vorgang als auch das dazu bestehende Recht meinen. „Auslösung“ erhält diese rechtlich-theologische Begrifflichkeit, ohne sie im Haupttext ausschließlich als subjektives Recht festzulegen.
- source_word: תִּתְּנוּ
  choice: sollt ihr … gewähren
  rationale: Das Verb bedeutet wörtlich „geben“. In dieser Rechtsbestimmung drückt „gewähren“ idiomatisch aus, dass die Auslösung ermöglicht beziehungsweise eingeräumt werden muss.
- source_word: לָאָרֶץ
  choice: des Landes
  rationale: Die hebräische Wendung lautet formal „dem/für das Land“. Im Deutschen verbindet sich „Auslösung“ natürlicher mit einem Genitivattribut; gemeint ist die Auslösung des veräußerten Landes.
theological_decisions:
- issue: Art der angeordneten Auslösung von Landbesitz
  choice: Die Bestimmung verpflichtet dazu, die Auslösung des Landes zu gewähren, ohne im Haupttext festzulegen, ob גְּאֻלָּה vorrangig den Vorgang oder das rechtlich eingeräumte Rückkaufsrecht bezeichnet.
  alternative: „Ihr sollt für das Land ein Rückkaufsrecht einräumen.“
  rationale: Der rechtliche Kontext stützt die Deutung als Rückkaufsrecht, doch das hebräische Substantiv kann breiter den Vorgang der Auslösung bezeichnen. Die gewählte Formulierung bewahrt diese echte Bedeutungsbreite und vermeidet zugleich spätere dogmatische Bedeutungen von „Erlösung“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rechtlichem Ton. „Auslösung“ ist bewusst sachbezogen gewählt, da „Erlösung“ im heutigen Deutsch leicht ausschließlich religiös verstanden würde. Die leicht formale Wendung „Land eures Besitzes“ hält die Struktur und den Umfang der hebräischen Bestimmung sichtbar.
