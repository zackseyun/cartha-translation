  verdict: revise
  source_fidelity: Der Entwurf gibt den Umfang der Vorschrift und die rechtliche Auslösung (גְּאֻלָּה) grundsätzlich zutreffend wieder. Die hebräische Konstruktion בְּכָל־אֶרֶץ אֲחֻזַּתְכֶם meint jedoch idiomatisch das gesamte Gebiet bzw. den gesamten Landbesitz, nicht ein „Land“, das selbst einen „Besitz“ hat.
  naturalness: „Im ganzen Land eures Besitzes“ ist im modernen Deutschen unnatürlich und kann missverständlich wirken. „Im gesamten Gebiet eures Landbesitzes“ ist idiomatischer und wahrt den rechtlichen sowie territorialen Bezug. „Die Auslösung von Land ermöglichen“ ist klarer als „die Auslösung des Landes gewähren“, ohne die im Hebräischen vorhandene Offenheit zwischen Vorgang und rechtlicher Möglichkeit unnötig einzuengen.
  terminology: „Auslösung“ ist als sachlich-rechtlicher Terminus vertretbar und vermeidet die im heutigen Deutsch stark religiös geprägte Nebenbedeutung von „Erlösung“. Die Fußnote kann die kontextuell mögliche Zuspitzung auf ein Rückkaufsrecht anbieten, ohne sie dem Haupttext aufzuzwingen.
