id: LEV.25.34
reference: Leviticus 25:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּֽ/שְׂדֵ֛ה מִגְרַ֥שׁ עָרֵי/הֶ֖ם לֹ֣א יִמָּכֵ֑ר כִּֽי אֲחֻזַּ֥ת עוֹלָ֛ם ה֖וּא לָ/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/034.yaml
  text: But the field of pastureland belonging to their cities must not be sold[b][a], for it is their permanent possession.
translation:
  language: de
  text: Aber das Weideland ihrer Städte darf nicht verkauft werden, denn es ist ihr dauernder Besitz.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihr Besitz für alle Zeiten“. Das hebräische Wort kann eine unbegrenzte beziehungsweise dauerhaft geltende Zeit bezeichnen; hier geht es um den bleibenden, nicht veräußerbaren Besitzstatus des Landes.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׂדֵה מִגְרַשׁ
  choice: Aber das Weideland
  rationale: Die Verbindung bezeichnet die offene, als Weide nutzbare Fläche bei den levitischen Städten. „Weideland“ gibt sie im Deutschen natürlich wieder; וּ markiert hier den Gegensatz zur zuvor geregelten Veräußerung von Häusern.
- source_word: עָרֵיהֶם
  choice: ihrer Städte
  rationale: Der Genitiv bildet die hebräische Konstruktverbindung knapp und idiomatisch ab.
- source_word: לֹא יִמָּכֵר
  choice: darf nicht verkauft werden
  rationale: Das passive Verb mit Verneinung formuliert ein gesetzliches Verkaufsverbot.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung des Verbots ein.
- source_word: אֲחֻזַּת עוֹלָם
  choice: dauernder Besitz
  rationale: אֲחֻזָּה bezeichnet erblichen beziehungsweise grundrechtlichen Besitz; עוֹלָם betont hier dessen bleibenden, nicht veräußerbaren Status.
- source_word: הוּא לָהֶם
  choice: es ist ihr
  rationale: Die pronominale Aussage bezeichnet das Land als ihnen zugehörig; im Deutschen steht wegen „Weideland“ das Neutrum „es“.
theological_decisions:
- issue: Bedeutung von עוֹלָם im israelitischen Bodenrecht
  choice: dauernder Besitz
  alternative: ewiger Besitz
  rationale: Im rechtlichen Zusammenhang bezeichnet עוֹלָם einen fortbestehenden, nicht endgültig übertragbaren Besitzstatus. „Dauernd“ bewahrt diese Aussage, ohne zwingend metaphysische Ewigkeit auszudrücken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rechtliche Verbindlichkeit wird mit „darf nicht“ klar ausgedrückt; „Weideland“ ist allgemein verständlich und sachlich passend.
