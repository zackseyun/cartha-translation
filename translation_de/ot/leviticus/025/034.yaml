  source_fidelity: „Aber das Weideland ihrer Städte“ gibt שְׂדֵה מִגְרַשׁ עָרֵיהֶם als idiomatische Gesamtbezeichnung für das zu den levitischen Städten gehörende Weide- bzw. Freiland treffend wieder. „darf nicht verkauft werden“ bildet die rechtliche Kraft von לֹא יִמָּכֵר angemessen ab. „dauernder Besitz“ gibt אֲחֻזַּת עוֹלָם kontextgerecht wieder, ohne eine metaphysische Aussage von absoluter Ewigkeit zu erzwingen.
