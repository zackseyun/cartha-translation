  terminology: „Weideland“ ist für מִגְרָשׁ im Kontext der Städte eine verständliche und fachlich vertretbare Wahl. „Besitz“ ist für אֲחֻזָּה ausreichend; „dauernder“ wahrt die im Kontext beabsichtigte Beständigkeit von עוֹלָם. Die Fußnote stellt die mögliche stärkere Wiedergabe transparent dar, ohne sie dem Text aufzuzwingen.
