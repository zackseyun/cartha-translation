    issue: »um es ihm zurückzuerstatten«
    rationale: Das unbestimmte »es« und »ihm« lassen im Deutschen offen bzw. missverständlich erscheinen, was wem erstattet wird. Im Kontext ist gemeint, dass der frühere Eigentümer die Mittel zur vorzeitigen Rückerlangung des verkauften Grundbesitzes hat.
  - severity: medium
    issue: 'Fußnote: »es fällt wieder an seinen Grundbesitz zurück«'
    rationale: Etwas kann nicht sinnvollerweise an einen Grundbesitz zurückfallen. Als alternative Subjektdeutung des hebräischen Verbs ist eine Rückkehr des Grundstücks in den Besitz des früheren Eigentümers gemeint.
