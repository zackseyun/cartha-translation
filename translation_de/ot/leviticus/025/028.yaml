source:
  edition: WLC
  text: וְ/אִ֨ם לֹֽא מָֽצְאָ֜ה יָד֗/וֹ דֵּי֮ הָשִׁ֣יב ל/וֹ֒ וְ/הָיָ֣ה מִמְכָּר֗/וֹ בְּ/יַד֙ הַ/קֹּנֶ֣ה אֹת֔/וֹ עַ֖ד שְׁנַ֣ת הַ/יּוֹבֵ֑ל וְ/יָצָא֙ בַּ/יֹּבֵ֔ל וְ/שָׁ֖ב לַ/אֲחֻזָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/028.yaml
  text: But if his hand does not find enough to restore it to him[a], then what he sold shall remain in the hand of the one who bought it until the year of Jubilee; and it shall go out in the Jubilee, and he shall return to his property.
translation:
  language: de
  text: Wenn er aber nicht genug Mittel aufbringen kann, um es zurückzukaufen, bleibt das von ihm Verkaufte bis zum Jobeljahr in der Hand des Käufers. Im Jobeljahr wird es freigegeben, und er kehrt zu seinem Grundbesitz zurück.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und es kehrt in seinen Besitz zurück.« Das letzte hebräische Verb kann sich statt auf den Verkäufer auch auf das verkaufte Grundstück beziehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: מָצְאָה יָדוֹ
  choice: Mittel aufbringen kann
  rationale: Die hebräische Wendung gebraucht die Hand als Bild für verfügbare Mittel. Eine wörtliche Wiedergabe wie »seine Hand findet nicht« wäre im heutigen Deutschen missverständlich; »Mittel aufbringen« gibt den idiomatischen Sinn im wirtschaftlich-rechtlichen Zusammenhang natürlich wieder.
- source_word: דֵּי
  choice: genug
  rationale: דֵּי bezeichnet eine ausreichende Menge; »genug« ist präzise und allgemein verständlich.
- source_word: הָשִׁיב לוֹ
  choice: es ihm zurückzuerstatten
  rationale: Gemeint ist die Rückerstattung des zur Einlösung nötigen Betrags an den Käufer, durch die der verkaufte Grundbesitz zurückerlangt wird. Das Pronomen bewahrt die knappe Form des Hebräischen und den Bezug zum vorausgehenden Kontext.
- source_word: מִמְכָּרוֹ
  choice: das von ihm Verkaufte
  rationale: Das Substantiv kann den Verkauf oder den verkauften Gegenstand bezeichnen. Da dieser beim Käufer bleibt und im Jobeljahr freigegeben wird, ist hier das verkaufte Eigentum gemeint.
- source_word: בְּיַד הַקֹּנֶה אֹתוֹ
  choice: in der Hand des Käufers
  rationale: Die Wiedergabe erhält das hebräische Rechtsbild der Hand als Bereich von Besitz und Verfügungsgewalt und klingt auch im Deutschen verständlich.
- source_word: שְׁנַת הַיּוֹבֵל
  choice: Jobeljahr
  rationale: »Jobeljahr« ist die etablierte deutsche Bezeichnung für das biblische יוֹבֵל und gibt den juristisch-kultischen Fachbegriff knapp wieder.
- source_word: וְיָצָא בַּיּוֹבֵל
  choice: Im Jobeljahr wird es freigegeben
  rationale: Das wörtliche »es geht hinaus« bezeichnet hier das Ausscheiden des Grundstücks aus der Verfügungsgewalt des Käufers. »Wird freigegeben« vermittelt diesen Rechtssinn in natürlichem Deutsch, ohne bereits den letzten Satzteil vorwegzunehmen.
- source_word: וְשָׁב לַאֲחֻזָּתוֹ
  choice: und er kehrt zu seinem Grundbesitz zurück
  rationale: Das maskuline Verb kann sich auf den früheren Eigentümer oder auf das Verkaufte beziehen. Der Personenbezug passt zum Sprachgebrauch der Jobelgesetzgebung; אֲחֻזָּה bezeichnet hier den erblichen Land- beziehungsweise Grundbesitz.
theological_decisions:
- issue: Bezugswort des abschließenden וְשָׁב
  choice: 'Der frühere Eigentümer ist das Subjekt: »er kehrt zu seinem Grundbesitz zurück«.'
  alternative: 'Das verkaufte Grundstück ist das Subjekt: »es fällt an seinen Grundbesitz zurück« beziehungsweise »es kehrt in seinen Besitz zurück«.'
  rationale: Das maskuline Singularverb lässt grammatisch beide Bezüge zu, weil sowohl die Person als auch das maskulin aufgefasste Verkaufte als Subjekt infrage kommen. Der Haupttext folgt dem im Kontext wahrscheinlichen Personenbezug; die Fußnote bewahrt die echte syntaktische Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Rechtssprache. Die idiomatische Wendung »Mittel aufbringen« vermeidet eine im Deutschen unnatürliche Nachbildung des hebräischen Hand-Bildes; »in der Hand des Käufers« bewahrt dagegen ein verständliches Quellenbild. Die genuine Mehrdeutigkeit des letzten Verbs wird im Haupttext entschieden, aber durch Fußnote [a] offengehalten.
