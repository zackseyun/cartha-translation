  verdict: revise
  source_fidelity: 'Die Grundstruktur und die Jobelregelung sind zutreffend wiedergegeben. »es ihm zurückzuerstatten« ist jedoch im Deutschen semantisch und pronominal missverständlich: Es kann nahelegen, der Verkäufer erstatte dem Käufer das Grundstück. Der Kontext betrifft die Möglichkeit, das verkaufte Land vor dem Jobeljahr zurückzukaufen bzw. einzulösen.'
  naturalness: Modernes Standarddeutsch und der sachlich-rechtliche Registerton sind überwiegend gelungen. »zurückzukaufen« klärt den wirtschaftlich-rechtlichen Vorgang natürlich. Die Fußnotenalternative muss idiomatisch von einer Rückkehr in den Besitz, nicht von einer Rückkehr „an seinen Grundbesitz“, sprechen.
  terminology: »Jobeljahr« und »Grundbesitz« sind passende etablierte Begriffe. »in der Hand des Käufers« bewahrt das hebräische Besitzidiom und ist hier verständlich. Die Mehrdeutigkeit des letzten Verbs soll weiterhin durch eine Fußnote angezeigt werden.
  issues:
