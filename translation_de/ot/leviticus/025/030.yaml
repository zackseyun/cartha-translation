source:
  edition: WLC
  text: וְ/אִ֣ם לֹֽא יִגָּאֵ֗ל עַד מְלֹ֣את ל/וֹ֮ שָׁנָ֣ה תְמִימָה֒ וְ֠/קָם הַ/בַּ֨יִת אֲשֶׁר בָּ/עִ֜יר אֲשֶׁר לא חֹמָ֗ה לַ/צְּמִיתֻ֛ת לַ/קֹּנֶ֥ה אֹת֖/וֹ לְ/דֹרֹתָ֑י/ו לֹ֥א יֵצֵ֖א בַּ/יֹּבֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/030.yaml
  text: But if it is not redeemed before a full year is completed for it[a], then the house that is in a city that has no wall shall pass permanently to the one who bought it, throughout his generations[b]; it shall not go out in the Jubilee.
translation:
  language: de
  text: Wenn es aber nicht zurückgekauft wird, bevor ein volles Jahr verstrichen ist, dann geht das Haus, das in einer Stadt liegt, die eine Mauer hat,[a] endgültig in den Besitz des Käufers und seiner Nachkommen über. Es fällt im Jubeljahr nicht an den ursprünglichen Besitzer zurück.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Konsonantentext schreibt „die keine Mauer hat“; die überlieferte masoretische Leseanweisung lautet „die eine Mauer hat“. Diese Lesung passt zum Gegensatz zu den nicht ummauerten Ortschaften in Vers 31.
    reason: textual_variant
  - marker: b
    text: 'Wörtlicher: „Es geht im Jubeljahr nicht hinaus.“ Gemeint ist, dass das Haus im Jubeljahr nicht an den früheren Eigentümer oder dessen Familie zurückfällt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגָּאֵל
  choice: zurückgekauft wird
  rationale: Das Niphal von גאל bezeichnet hier die rechtlich geregelte Rücklösung eines verkauften Hauses. „Zurückgekauft“ ist im Deutschen klarer als das fachsprachlichere „ausgelöst“, ohne den rechtlichen Sinn zu verlieren.
- source_word: עַד מְלֹאת לוֹ שָׁנָה תְמִימָה
  choice: bevor ein volles Jahr verstrichen ist
  rationale: Die Wendung bezeichnet die Frist von einem vollständigen Jahr. Die deutsche Formulierung gibt den zeitlichen Grenzpunkt natürlich wieder, ohne den Bezug des Pronomens unnötig festzulegen.
- source_word: וְקָם ... לַצְּמִיתֻת
  choice: dann fällt ... endgültig ... zu
  rationale: „Aufstehen/bestehen“ ist hier eine juristische Wendung dafür, dass der Verkauf rechtskräftig und dauerhaft wird. „Endgültig zufallen“ verbindet diesen Rechtscharakter mit der ausdrücklich genannten Dauerhaftigkeit.
- source_word: הַבַּיִת אֲשֶׁר בָּעִיר אֲשֶׁר לא חֹמָה
  choice: das Haus in einer Stadt, die eine Mauer hat
  rationale: Der Konsonantentext schreibt לא („nicht/keine“), die masoretische Leseanweisung versteht jedoch לוֹ („ihr ist“, also „die eine Mauer hat“). Diese Lesung entspricht dem Gegensatz zu den unbefestigten Ortschaften in Vers 31 und wird mit einer Fußnote transparent gemacht.
- source_word: לַקֹּנֶה אֹתוֹ לְדֹרֹתָיו
  choice: dem Käufer und seinen Nachkommen
  rationale: Die Generationenformel bezeichnet den bleibenden Besitz in der Familienlinie des Käufers. „Seinen Nachkommen“ gibt diese erbrechtliche Bedeutung in natürlichem modernem Deutsch wieder.
- source_word: לֹא יֵצֵא בַּיֹּבֵל
  choice: Es fällt im Jubeljahr nicht an den ursprünglichen Besitzer zurück
  rationale: 'Wörtlich heißt es: „Es geht im Jubeljahr nicht hinaus.“ Im Grundstücksrecht des Kapitels meint dies, dass das Haus nicht an den früheren Eigentümer beziehungsweise dessen Familie zurückfällt.'
- source_word: יּוֹבֵל
  choice: Jubeljahr
  rationale: „Jubeljahr“ ist die geläufige deutsche Bezeichnung für die in Levitikus 25 geregelte Institution und bleibt für heutige Leser verständlich.
theological_decisions:
- issue: Dauerhaftigkeit des Verkaufs eines Hauses in einer ummauerten Stadt
  choice: Nach Ablauf der einjährigen Rückkaufsfrist wird der Verkauf endgültig und gilt auch für die Nachkommen des Käufers; das Jubeljahr hebt ihn nicht auf.
  alternative: Die Wendung וְקָם könnte formaler mit „das Haus bleibt bestehen“ wiedergegeben werden, ohne den Eigentumsübergang ausdrücklich zu benennen.
  rationale: Die Verbindung von וְקָם, לַצְּמִיתֻת, לְדֹרֹתָיו und לֹא יֵצֵא בַּיֹּבֵל bezeichnet im Zusammenhang eindeutig einen dauerhaften Eigentumsübergang. Die Übersetzung macht den juristischen Sinn verständlich, ohne über die Grundstücksordnung des Textes hinauszugehen.
- issue: Masoretische Schreib- und Lesetradition bei לא/לוֹ
  choice: Im Haupttext steht gemäß der masoretischen Leseanweisung „die eine Mauer hat“.
  alternative: Nach dem unvokalisierten Konsonantentext wäre wörtlich „die keine Mauer hat“ möglich.
  rationale: Die masoretische Leseanweisung לוֹ, der unmittelbare Gegensatz zu den nicht ummauerten Ortschaften in Vers 31 und die Regelung des vorangehenden Verses sprechen für „die eine Mauer hat“. Die abweichende Schreibform wird nicht verschwiegen, sondern in Fußnote [a] dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer juristischer Ausdrucksweise. „Zurückgekauft“, „endgültig zufallen“ und „zurückfallen“ erschließen die Rechtsvorgänge für gewöhnliche Leser; die hebräischen Rechtsidiome und die textliche Besonderheit werden in den Fußnoten bewahrt.
