source:
  edition: WLC
  text: יוֹבֵ֣ל הִ֗וא שְׁנַ֛ת הַ/חֲמִשִּׁ֥ים שָׁנָ֖ה תִּהְיֶ֣ה לָ/כֶ֑ם לֹ֣א תִזְרָ֔עוּ וְ/לֹ֤א תִקְצְרוּ֙ אֶת סְפִיחֶ֔י/הָ וְ/לֹ֥א תִבְצְר֖וּ אֶת נְזִרֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/011.yaml
  text: It is a Jubilee[a]; the fiftieth year shall be for you. You shall not sow, and you shall not reap its volunteer growth[c][b], and you shall not gather the grapes of its unpruned vines.
translation:
  language: de
  text: Ein Jubeljahr[a] soll es für euch sein, das fünfzigste Jahr. Ihr dürft nicht säen und den von selbst aufgekommenen Bewuchs nicht ernten; auch die Trauben seiner ungeschnittenen Reben[b] dürft ihr nicht lesen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Jubeljahr“ hängt mit dem hebräischen Wort für das Widderhorn zusammen, bezeichnet hier aber das besondere fünfzigste Jahr.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Trauben seiner sich selbst überlassenen Reben“. Das Hebräische bezeichnet hier den Ertrag von Reben, die nicht gepflegt oder geschnitten wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹבֵל
  choice: Jobeljahr
  rationale: Im Zusammenhang von 3. Mose 25 bezeichnet יוֹבֵל das besondere fünfzigste Jahr, nicht das Widderhorn. „Jobeljahr“ ist die etablierte deutsche Sachbezeichnung.
- source_word: שְׁנַת הַחֲמִשִּׁים שָׁנָה
  choice: das fünfzigste Jahr
  rationale: Natürliche deutsche Wiedergabe der hebräischen Konstruktion, die das Jobeljahr als das fünfzigste Jahr bestimmt.
- source_word: תִּהְיֶה לָכֶם
  choice: soll es für euch sein
  rationale: Bewahrt sowohl die prädikative Formulierung als auch den Dativ לָכֶם, ohne ihn unnötig auszudeuten.
- source_word: לֹא תִזְרָעוּ
  choice: ihr dürft nicht säen
  rationale: Gibt das rechtliche Verbot in natürlichem modernem Deutsch wieder.
- source_word: לֹא תִקְצְרוּ
  choice: nicht ernten
  rationale: Bezeichnet die Ernte des von selbst aufkommenden Feldbewuchses und bleibt vom besonderen Verb für die Weinlese unterschieden.
- source_word: סְפִיחֶיהָ
  choice: den Nachwuchs, der von selbst wächst
  rationale: ספיח bezeichnet den ohne erneute Aussaat aufkommenden Bewuchs. Die Formulierung ist allgemein verständlich und erhält den Gedanken spontanen Wachstums.
- source_word: לֹא תִבְצְרוּ
  choice: nicht lesen
  rationale: בצר bezeichnet spezifisch das Abernten beziehungsweise Lesen von Trauben; „Trauben lesen“ ist im Deutschen die passende fachsprachlich verständliche Wendung.
- source_word: נְזִרֶיהָ
  choice: die Trauben seiner unbeschnittenen Weinstöcke
  rationale: Im landwirtschaftlichen Kontext bezeichnet das Wort den Ertrag von Reben, die unbeschnitten beziehungsweise sich selbst überlassen blieben. Das ergänzte „Trauben“ macht das Objekt des Verbs בצר im Deutschen deutlich.
theological_decisions:
- issue: Bezug und Satzbau von יוֹבֵל הִוא שְׁנַת הַחֲמִשִּׁים שָׁנָה תִּהְיֶה לָכֶם
  choice: Ein Jobeljahr ist es; das fünfzigste Jahr soll es für euch sein.
  alternative: Das fünfzigste Jahr soll für euch ein Jobeljahr sein.
  rationale: Die gewählte Fassung folgt der markierten hebräischen Wortfolge und erhält beide Aussagen, ohne ihre Beziehung in einer geglätteten deutschen Prädikation vollständig festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rechtlichen Verbote werden mit „dürft nicht“ natürlich und verbindlich formuliert. Der leicht markierte erste Satz bewahrt die hebräische Hervorhebung und Spannung; landwirtschaftliche Begriffe werden verständlich, aber nicht paraphrasierend wiedergegeben.
