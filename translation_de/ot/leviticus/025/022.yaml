  text: וּ/זְרַעְתֶּ֗ם אֵ֚ת הַ/שָּׁנָ֣ה הַ/שְּׁמִינִ֔ת וַ/אֲכַלְתֶּ֖ם מִן הַ/תְּבוּאָ֣ה יָשָׁ֑ן עַ֣ד הַ/שָּׁנָ֣ה הַ/תְּשִׁיעִ֗ת עַד בּוֹא֙ תְּב֣וּאָתָ֔/הּ תֹּאכְל֖וּ יָשָֽׁן־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/022.yaml
  text: And you shall sow in the eighth year and eat from the old produce until the ninth year; until its produce comes in[a], you shall eat the old.
translation:
  language: de
  text: Im achten Jahr sollt ihr säen und bis ins neunte Jahr von altem Ertrag essen. Bis der Ertrag des neunten Jahres eingebracht ist, sollt ihr vom Alten essen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht an beiden Stellen lediglich „alt“; „Ertrag“ ist aus dem Zusammenhang zu ergänzen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּזְרַעְתֶּם
  choice: sollt ihr säen
  rationale: Das Qal-Perfekt mit vorangestelltem ו hat im gesetzlichen Zusammenhang zukunftsbezogene beziehungsweise anweisende Kraft. „Sollt ihr säen“ gibt beides natürlich wieder.
- source_word: הַשָּׁנָה הַשְּׁמִינִת
  choice: im achten Jahr
  rationale: Die Ordinalzahl wird im Deutschen idiomatisch mit „im“ angeschlossen.
- source_word: וַאֲכַלְתֶּם
  choice: und … essen
  rationale: Die koordinierte Handlung steht unter derselben zukunftsbezogenen beziehungsweise anweisenden Aussage wie das Säen.
- source_word: מִן הַתְּבוּאָה יָשָׁן
  choice: von den alten Erträgen
  rationale: תְּבוּאָה bezeichnet den landwirtschaftlichen Ertrag; יָשָׁן beschreibt hier den noch vorhandenen Ertrag früherer Ernten. Der Plural „Erträge“ ist im Deutschen für Vorräte aus der Ernte natürlich.
- source_word: עַד הַשָּׁנָה הַתְּשִׁיעִת
  choice: bis ins neunte Jahr
  rationale: Diese Formulierung gibt die zeitliche Erstreckung idiomatisch und präzise wieder.
- source_word: עַד בּוֹא תְּבוּאָתָהּ
  choice: Bis dessen Ertrag eingebracht ist
  rationale: בּוֹא bedeutet wörtlich „kommen“; bei einem Ernteertrag drückt „eingebracht ist“ natürlich aus, dass die neue Ernte verfügbar wird. Das Pronomen bezieht sich am ehesten auf das unmittelbar zuvor genannte neunte Jahr.
- source_word: תֹּאכְלוּ יָשָׁן
  choice: sollt ihr vom Alten essen
  rationale: Die substantivierte Form „vom Alten“ bewahrt die knappe Wiederholung des hebräischen Adjektivs, wobei „Ertrag“ aus dem Zusammenhang ergänzt wird.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von יָשָׁן („alt“) bleibt in der zweiten Satzhälfte durch „vom Alten“ erkennbar; die erste Stelle wird zugunsten natürlicher deutscher Verständlichkeit als „alte Erträge“ ausgedrückt.
