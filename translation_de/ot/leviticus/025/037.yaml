source:
  edition: WLC
  text: אֶ֨ת כַּסְפְּ/ךָ֔ לֹֽא תִתֵּ֥ן ל֖/וֹ בְּ/נֶ֑שֶׁךְ וּ/בְ/מַרְבִּ֖ית לֹא תִתֵּ֥ן אָכְלֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/037.yaml
  text: You shall not lend him your money at interest[b][a], nor give him your food for increase.
translation:
  language: de
  text: Du sollst ihm dein Geld[a] nicht gegen Zinsen leihen und ihm deine Lebensmittel nicht gegen Aufschlag[b] geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dein Silber“. Das hebräische Wort כֶּסֶף kann sowohl „Silber“ als auch „Geld“ bedeuten; hier geht es um ein Darlehen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „gegen Zuwachs“. Das hebräische Wort bezeichnet einen Mehrbetrag oder Ertrag, der über das Gegebene hinaus verlangt wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּסְפְּךָ (כֶּסֶף)
  choice: dein Geld
  rationale: כֶּסֶף bezeichnet wörtlich „Silber“, wird in wirtschaftlichen und rechtlichen Zusammenhängen aber häufig im Sinn von „Geld“ gebraucht. Beim Verleihen ist „Geld“ im heutigen Deutsch die klare, sachgerechte Wiedergabe.
- source_word: תִתֵּן לוֹ
  choice: ihm … leihen / ihm … geben
  rationale: נתן bedeutet grundsätzlich „geben“. Beim Geld macht die Verbindung mit Zinsen deutlich, dass ein Darlehen gemeint ist, weshalb „leihen“ idiomatisch ist. Beim zweiten Satzglied bleibt das konkrete „geben“ erhalten.
- source_word: בְּנֶשֶׁךְ
  choice: gegen Zinsen
  rationale: נֶשֶׁךְ bezeichnet den auf ein Darlehen erhobenen Zins. „Gegen Zinsen“ ist modernes, verständliches Deutsch und vermeidet das missverständliche „Wucher“, das heute meist überhöhte Zinsen bezeichnet.
- source_word: וּבְמַרְבִּית
  choice: gegen Aufschlag
  rationale: מַרְבִּית bezeichnet Vermehrung, Zuwachs oder zusätzlichen Ertrag. In Verbindung mit Lebensmitteln gibt „Aufschlag“ den geforderten Mehrbetrag konkret wieder, ohne ihn vorschnell als allgemeinen Handelsgewinn zu deuten.
- source_word: אָכְלֶךָ (אֹכֶל)
  choice: deine Lebensmittel
  rationale: אֹכֶל bedeutet „Nahrung, Speise, Lebensmittel“. Im rechtlich-wirtschaftlichen Zusammenhang bezeichnet „Lebensmittel“ die zur Versorgung überlassenen Nahrungsmittel natürlicher als das abstraktere „Nahrung“.
- source_word: לֹא … לֹא
  choice: nicht … und … nicht
  rationale: Die beiden Verneinungen formulieren zwei parallele Verbote. Die deutsche Satzstruktur erhält diese Koordination klar und ohne zusätzliche Deutung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit rechtlich-klarem Ton. Die direkte Anrede im Singular („du“) entspricht dem hebräischen Text. Die parallelen Verbote bleiben erkennbar, während „leihen“ beim Geld den kontextuell eindeutigen Darlehenssinn natürlich ausdrückt.
