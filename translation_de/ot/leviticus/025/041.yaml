base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/041.yaml
  text: Then he and his sons with him shall go out from you[b][a], and he shall return to his clan and return to the property of his fathers.
translation:
  language: de
  text: Dann soll er zusammen mit seinen Söhnen von dir weggehen. Er soll zu seiner Sippe[a] zurückkehren und zu dem Grundbesitz seiner Väter[b] zurückkehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Familie“; das hebräische Wort kann einen größeren Verwandtschaftsverband bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zum Besitz seiner Väter“ beziehungsweise „zu seinem angestammten Besitz“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא מֵעִמָּךְ
  choice: Dann soll er von dir weggehen
  rationale: Das Verb bezeichnet konkret das Weggehen aus dem Haushalt beziehungsweise Dienstverhältnis. „Weggehen“ bewahrt das hebräische Bild, ohne die im Zusammenhang vorausgesetzte Freilassung ausdrücklich in den Wortlaut einzutragen.
- source_word: הוּא וּבָנָיו עִמּוֹ
  choice: er und seine Söhne mit ihm
  rationale: Die ausdrücklich maskuline Verwandtschaftsbezeichnung wird beibehalten; „mit ihm“ gibt die knappe hebräische Begleitformulierung unmittelbar wieder.
- source_word: וְשָׁב ... יָשׁוּב
  choice: zurückkehren ... zurückkehren
  rationale: Die Wiederholung von שׁוב wird erhalten, weil sie die Wiederherstellung der Zugehörigkeit zur Sippe und zum ererbten Landbesitz betont.
- source_word: מִשְׁפַּחְתּוֹ
  choice: seiner Sippe
  rationale: Im sozialen und landrechtlichen Zusammenhang bezeichnet מִשְׁפָּחָה häufig einen über die Kernfamilie hinausgehenden Verwandtschaftsverband. „Sippe“ ist dafür im Deutschen präziser als „Familie“.
- source_word: אֲחֻזַּת אֲבֹתָיו
  choice: zum Grundbesitz seiner Väter
  rationale: אֲחֻזָּה bezeichnet hier einen bleibenden beziehungsweise erblichen Landbesitz. „Grundbesitz“ macht den Landbezug deutlich, während „seiner Väter“ die konkrete Abstammungssprache des Hebräischen wahrt.
theological_decisions:
- issue: Maskuline Verwandtschafts- und Abstammungssprache
  choice: seine Söhne ... seine Väter
  alternative: seine Kinder ... seine Vorfahren
  rationale: Der hebräische Text verwendet ausdrücklich maskuline Formen. Da der Rechtszusammenhang die väterliche Abstammungs- und Besitzlinie anspricht, werden diese nicht verallgemeinernd neutralisiert.
- issue: Sozialrechtliche Bedeutung des Weggehens
  choice: von dir weggehen
  alternative: aus deinem Dienst freikommen
  rationale: Der Kontext handelt von der Wiederherstellung im Erlassjahr; der hebräische Wortlaut verwendet jedoch das konkrete Verb „hinausgehen/weggehen“. Die Übersetzung bewahrt diese Ausdrucksweise und lässt die rechtliche Freilassung aus dem Zusammenhang hervorgehen.
- issue: Wiederholung des Verbs „zurückkehren“
  choice: beide Vorkommen ausdrücklich wiedergeben
  alternative: das zweite Vorkommen stilistisch auslassen
  rationale: Die Wiederholung verbindet die Rückkehr zur Sippe mit der Rückkehr zum väterlichen Grundbesitz und unterstreicht so die vollständige Wiederherstellung.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Die rechtliche Soll-Form gibt den futurisch-normativen Sinn der hebräischen Verbformen wieder. Die markante Wiederholung von „zurückkehren“ bleibt trotz möglicher stilistischer Straffung erhalten.
