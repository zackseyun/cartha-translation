id: LEV.25.18
reference: Leviticus 25:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/עֲשִׂיתֶם֙ אֶת חֻקֹּתַ֔/י וְ/אֶת מִשְׁפָּטַ֥/י תִּשְׁמְר֖וּ וַ/עֲשִׂיתֶ֣ם אֹתָ֑/ם וִֽ/ישַׁבְתֶּ֥ם עַל הָ/אָ֖רֶץ לָ/בֶֽטַח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/018.yaml
  text: So you shall carry out my statutes and keep my judgments[a], and do them[c][b], and you shall dwell in the land securely.
translation:
  language: de
  text: So sollt ihr meine Satzungen befolgen, meine Rechtsbestimmungen[a] beachten und danach handeln[b]. Dann werdet ihr in dem Land[c] sicher wohnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Ordnungen“. Das Hebräische unterscheidet hier zwei Rechtsbegriffe: חֻקִּים (Satzungen) und מִשְׁפָּטִים (Rechtsbestimmungen).'
    reason: lexical_alternative
  - marker: b
    text: 'Im Hebräischen wird „tun“ wiederholt; wörtlich etwa: „Ihr sollt meine Satzungen tun, meine Rechtsbestimmungen beachten und sie tun.“'
    reason: lexical_alternative
  - marker: c
    text: Gemeint ist das Israel verheißene Land.
    reason: cultural_note
lexical_decisions:
- source_word: חֻקֹּתַי
  choice: meine Satzungen
  rationale: „Satzungen“ gibt den Charakter festgesetzter, bundesrechtlicher Anordnungen wieder und bleibt von מִשְׁפָּטַי unterscheidbar.
- source_word: מִשְׁפָּטַי
  choice: meine Rechtsbestimmungen
  rationale: Der Ausdruck bezeichnet hier rechtliche Entscheidungen beziehungsweise verbindliche Rechtsnormen. „Rechtsbestimmungen“ ist im modernen Deutschen verständlich und wahrt die Unterscheidung zu „Satzungen“.
- source_word: תִּשְׁמְרוּ
  choice: beachten
  rationale: שׁמר bedeutet in rechtlich-bundestheologischem Zusammenhang, Gebote gewissenhaft einzuhalten. „Beachten“ ist hier natürlich und verbindlich.
- source_word: וַעֲשִׂיתֶם ... אֹתָם
  choice: befolgen ... und danach handeln
  rationale: Das Hebräische verwendet עשה zweimal. Die variierte Wiedergabe bewahrt den Nachdruck auf praktischem Gehorsam, ohne im Deutschen schwerfällig „tun ... sie tun“ zu wiederholen.
- source_word: וִישַׁבְתֶּם
  choice: ihr werdet ... wohnen
  rationale: ישׁב bezeichnet hier das dauerhafte, sesshafte Wohnen im Land. Die Zukunftsform gibt zugleich die Folge des vorausgehenden Gehorsams wieder.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Im Zusammenhang ist das Israel verheißene Land gemeint. „Das Land“ bewahrt den bundestheologischen Bezug, ohne ihn im Haupttext erläuternd auszubauen.
- source_word: לָבֶטַח
  choice: sicher
  rationale: בֶּטַח bezeichnet Sicherheit und geschütztes Wohnen; „sicher wohnen“ ist eine natürliche und treffende deutsche Verbindung.
theological_decisions:
- issue: Verhältnis zwischen Gehorsam und sicherem Wohnen im Land
  choice: Der Vers stellt innerhalb des Bundes mit Israel Gehorsam und sicheres Wohnen im verheißenen Land als Folgebeziehung dar.
  alternative: Eine allgemeine, bedingungslose Zusage persönlicher Sicherheit für Gläubige aller Zeiten.
  rationale: Der hebräische Text bindet die Zusage ausdrücklich an die Satzungen und Rechtsbestimmungen sowie an „das Land“. Die Übersetzung bewahrt diesen konkreten Bundes- und Landbezug und verallgemeinert die Aussage nicht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Rechtsbegriffe bleiben unterscheidbar; die hebräische Wiederholung wird lesbar variiert und in einer Fußnote offengelegt. „Dann“ macht die im Zusammenhang erkennbare Folgebeziehung deutlich, ohne die Aussage über den konkreten Landbund hinaus zu verallgemeinern.
