source:
  edition: WLC
  text: כִּ֚י יוֹבֵ֣ל הִ֔וא קֹ֖דֶשׁ תִּהְיֶ֣ה לָ/כֶ֑ם מִן הַ֨/שָּׂדֶ֔ה תֹּאכְל֖וּ אֶת תְּבוּאָתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/012.yaml
  text: For it is a jubilee; it shall be holy to you[a]. From the field you shall eat its produce.
translation:
  language: de
  text: Denn es ist ein Jubeljahr; es soll euch heilig sein. Ihr dürft den Ertrag vom Feld essen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Ertrag des Feldes“ oder „seine Erzeugnisse“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Anweisung ein und gibt die erklärende Funktion natürlich wieder.
- source_word: יוֹבֵל
  choice: Erlassjahr
  rationale: Bezeichnet in Levitikus 25 das besondere fünfzigste Jahr der Freilassung und Rückgabe; „Erlassjahr“ ist im Deutschen verständlich und gibt die sachliche Funktion besser wieder als eine bloße Lautübertragung.
- source_word: קֹדֶשׁ תִּהְיֶה לָכֶם
  choice: es soll euch heilig sein
  rationale: Bewahrt die religiös-bundestheologische Bedeutung von קֹדֶשׁ und den Bezug des Jahres auf die Gemeinschaft.
- source_word: מִן הַשָּׂדֶה
  choice: Was das Feld hervorbringt
  rationale: Wird zusammen mit תְּבוּאָתָהּ natürlich ins Deutsche übertragen und betont den unmittelbar auf dem Feld gewachsenen Ertrag.
- source_word: תֹּאכְלוּ
  choice: dürft ihr essen
  rationale: Der Kontext erlaubt den Verzehr des frei gewachsenen Feldertrags trotz des Verbots regulärer Ernte; „dürft“ gibt diese rechtliche Erlaubnis im Deutschen klar wieder.
- source_word: תְּבוּאָתָהּ
  choice: was das Feld hervorbringt
  rationale: Bezeichnet den Ertrag beziehungsweise das Gewächs des Feldes; die verbale Wendung ist modern und deckt den Bedeutungsumfang ab.
theological_decisions:
- issue: Heiligkeit des Erlassjahres
  choice: es soll euch heilig sein
  alternative: es soll für euch ausgesondert sein
  rationale: „Heilig“ bewahrt das theologische Gewicht von קֹדֶשׁ, ohne die Aussage auf eine bloß praktische Absonderung zu reduzieren.
- issue: Rechtscharakter von תֹּאכְלוּ
  choice: dürft ihr essen
  alternative: sollt ihr essen
  rationale: Im Zusammenhang untersagt der Abschnitt die reguläre Ernte, erlaubt aber den unmittelbaren Verzehr des Ertrags. Die modale Wiedergabe macht diese Funktion verständlich, ohne ein Gebot zum Essen zu behaupten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper Rechtssprache. „Erlassjahr“ wird als verständliche Bezeichnung des יוֹבֵל verwendet; die Satzstellung im zweiten Satz folgt natürlichem Deutsch, während der Feldbezug des Hebräischen erhalten bleibt.
