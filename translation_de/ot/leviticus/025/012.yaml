  source_fidelity: '„Erlassjahr“ ist für יוֹבֵל nicht präzise genug: Es bezeichnet im Deutschen eher ein Erlass- bzw. Schuldenerlassjahr und verdeckt die etablierte, spezifische Bezeichnung des fünfzigsten Jahres. „Jubeljahr“ gibt den hebräischen Terminus in diesem Kontext korrekt wieder. Die Wiedergabe von תֹּאכְלוּ als Erlaubnis („dürft“) ist im rechtlichen Zusammenhang vertretbar. Der Feldbezug und der Ertrag sollten jedoch syntaktisch unmittelbar verbunden bleiben.'
