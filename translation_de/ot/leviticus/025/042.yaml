source:
  edition: WLC
  text: כִּֽי עֲבָדַ֣/י הֵ֔ם אֲשֶׁר הוֹצֵ֥אתִי אֹתָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם לֹ֥א יִמָּכְר֖וּ מִמְכֶּ֥רֶת עָֽבֶד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/042.yaml
  text: For they are my servants[a], whom I brought out from the land of Egypt[b]; they shall not be sold as servants are sold.
translation:
  language: de
  text: Denn sie sind meine Sklaven[a], die ich aus dem Land Ägypten herausgeführt habe; sie dürfen nicht verkauft werden, wie man Sklaven verkauft[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Knechte“. Das hebräische Wort עֲבָדַי kann beides bezeichnen; „Sklaven“ hebt hier das Zugehörigkeitsverhältnis und den Zusammenhang mit dem Verkaufsverbot hervor.'
    reason: lexical_alternative
  - marker: b
    text: 'Nahe am Wortlaut: „mit dem Verkauf eines Sklaven“, das heißt in der Art eines gewöhnlichen Sklavenverkaufs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Rechtsbestimmung ein und wahrt den erklärenden Zusammenhang.
- source_word: עֲבָדַי הֵם
  choice: sie sind meine Sklaven
  rationale: Das Substantiv עֶבֶד mit Suffix bezeichnet hier ein Abhängigkeits- und Zugehörigkeitsverhältnis; das ausdrückliche Pronomen הֵם hebt diese Zugehörigkeit hervor. „Sklaven“ erhält die rechtlich-soziale Schärfe, während eine Fußnote die mögliche Wiedergabe „Knechte“ nennt.
- source_word: אֲשֶׁר הוֹצֵאתִי אֹתָם
  choice: die ich … herausgeführt habe
  rationale: Gibt die Relativkonstruktion und die geläufige Exodusformulierung natürlich und quellennah wieder.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: aus dem Land Ägypten
  rationale: Präzise und idiomatische Wiedergabe der geografischen Herkunftsangabe.
- source_word: לֹא יִמָּכְרוּ
  choice: sie dürfen nicht verkauft werden
  rationale: Das passive Imperfekt mit לֹא formuliert im Rechtskontext ein Verbot. „Dürfen nicht“ klingt im modernen Deutschen natürlicher als das missverständliche futurische „sollen nicht“.
- source_word: מִמְכֶּרֶת עָבֶד
  choice: wie man Sklaven verkauft
  rationale: 'Gibt die Art des untersagten Verkaufs verständlich wieder: Israeliten sollen nicht Gegenstand eines gewöhnlichen Sklavenverkaufs sein.'
theological_decisions:
- issue: Wiedergabe von עֶבֶד in der Aussage über Israels Zugehörigkeit zu Gott
  choice: Sklaven
  alternative: Knechte / Diener
  rationale: Die Begründung beruht auf Gottes vorrangigem Anspruch auf die aus Ägypten Herausgeführten und auf dem Verbot, sie wie gewöhnliches Sklaveneigentum zu veräußern. „Sklaven“ bewahrt diese rechtliche Spannung; die lexikalisch mögliche mildere Wiedergabe wird nicht verschwiegen, sondern in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Rechtssprache. Die Satzstruktur bleibt nahe am Hebräischen, ohne im Deutschen steif zu wirken; die Härte des sozialen Begriffs wird nicht beschönigt.
