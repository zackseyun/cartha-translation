  text: וְ/הָ/אָ֗רֶץ לֹ֤א תִמָּכֵר֙ לִ/צְמִתֻ֔ת כִּי לִ֖/י הָ/אָ֑רֶץ כִּֽי גֵרִ֧ים וְ/תוֹשָׁבִ֛ים אַתֶּ֖ם עִמָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/023.yaml
  text: The land must not be sold permanently[a], because the land is mine[b]. For you are strangers and sojourners with me.
translation:
  language: de
  text: Das Land darf nicht endgültig verkauft werden[a], denn das Land gehört mir. Denn ihr seid bei mir Fremde und ansässige Bewohner[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf Dauer“ beziehungsweise „unwiderruflich“.'
    reason: lexical_alternative
  - marker: b
    text: „Fremde und ansässige Bewohner“ gibt zwei Bezeichnungen für Menschen wieder, die in einem Land wohnen, ohne einen unabhängigen erblichen Anspruch darauf zu haben. Der Vers begründet dies damit, dass das Land Gott gehört.
    reason: cultural_note
lexical_decisions:
- source_word: תִמָּכֵר
  choice: darf nicht verkauft werden
  rationale: Das Nifal-Imperfekt hat in diesem Rechtstext passiv-prohibitiven Sinn. Die Formulierung gibt das Verbot in natürlichem modernem Deutsch wieder und bewahrt das Passiv.
- source_word: לִצְמִתֻת
  choice: endgültig
  rationale: Der Ausdruck bezeichnet hier eine bleibende, unwiderrufliche Veräußerung. „Endgültig“ ist verständlich und passt zum Erlassjahr-Kontext; die Alternative „auf Dauer“ wird in der Fußnote genannt.
- source_word: כִּי לִי הָאָרֶץ
  choice: denn das Land gehört mir
  rationale: כִּי begründet das Verbot. „Gehört mir“ gibt den hebräischen Besitzanspruch idiomatisch und unmittelbar wieder.
- source_word: גֵרִים
  choice: Fremde
  rationale: גֵר bezeichnet Menschen, die nicht über angestammtes Land verfügen und als abhängige Bewohner in einem fremden Gebiet leben. „Fremde“ bewahrt diesen Statusbegriff.
- source_word: וְתוֹשָׁבִים
  choice: Beisassen
  rationale: תּוֹשָׁב bezeichnet einen ansässigen Bewohner ohne vollen erblichen Landanspruch. „Beisassen“ hält die begriffliche Unterscheidung von גֵר aufrecht; eine erklärende Fußnote erschließt den heute weniger geläufigen Ausdruck.
- source_word: עִמָּדִי
  choice: bei mir
  rationale: עִמָּדִי bedeutet wörtlich „bei/mit mir“. „Bei mir“ klingt im Deutschen bei Statusangaben natürlicher und stellt Israel als Bewohner unter Gottes Eigentumsrecht dar, ohne den Ausdruck auszudeuten.
theological_decisions:
- issue: Israels Verhältnis zum Land
  choice: Israel besitzt das Land nicht unabhängig, sondern lebt darin unter Gottes vorrangigem Eigentumsanspruch.
  alternative: Den Vers ausschließlich als sozioökonomische Vorschrift oder als Aussage einer uneingeschränkten Enteignung zu verstehen.
  rationale: Die ausdrückliche Begründung „das Land gehört mir“ verbindet die rechtliche Vorschrift mit Gottes Eigentumsanspruch. Die Übersetzung bewahrt diesen Zusammenhang, ohne eine spätere Lehrtradition einzutragen.
translation_notes:
  register: Modernes, würdevolles Rechtsdeutsch. „Beisassen“ ist zwar weniger alltäglich, bildet aber zusammen mit „Fremde“ die zwei unterschiedlichen hebräischen Statusbegriffe präzise ab und wird deshalb in einer Fußnote erklärt.
