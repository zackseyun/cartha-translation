base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/054.yaml
  text: But if he is not redeemed by these means[a], then he and his sons with him shall go out in the year of Jubilee.
translation:
  language: de
  text: Wenn er aber nicht durch diese Möglichkeiten[a] ausgelöst wird, soll er im Jobeljahr frei werden, er und seine Söhne mit ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch diese“ – gemeint sind die in den vorangehenden Versen beschriebenen Regelungen zur Auslösung.'
    reason: lexikalische Alternative und Klärung des Rückbezugs
lexical_decisions:
- source_word: וְאִם לֹא
  choice: Wenn er aber nicht
  rationale: Die Formulierung führt die bedingte Fortsetzung ein; „aber“ gibt den leichten Gegensatz zu den zuvor genannten Möglichkeiten der Auslösung wieder.
- source_word: יִגָּאֵל
  choice: ausgelöst wird
  rationale: Das Nifal von גאל bezeichnet hier die rechtlich geregelte Auslösung aus einem Dienstverhältnis durch Verwandte oder Zahlung.
- source_word: בְּאֵלֶּה
  choice: auf diese Weise
  rationale: Die Wendung verweist auf die in den vorangehenden Versen beschriebenen Möglichkeiten der Auslösung, ohne deren Einzelheiten in den Text einzutragen.
- source_word: וְיָצָא
  choice: dann soll er … freikommen
  rationale: Wörtlich bedeutet die Wendung „und er soll hinausgehen“; im rechtlichen Zusammenhang bezeichnet sie das Ende des Dienstverhältnisses. „Freikommen“ ist im Deutschen natürlich und bewahrt den Sinn.
- source_word: בִּשְׁנַת הַיֹּבֵל
  choice: im Jobeljahr
  rationale: „Jobeljahr“ ist die etablierte deutsche Bezeichnung für יוֹבֵל in diesem Rechtsabschnitt.
- source_word: הוּא וּבָנָיו עִמּוֹ
  choice: er und seine Söhne mit ihm
  rationale: Das selbstständige Pronomen hebt ihn hervor; בָנָיו bezeichnet ausdrücklich seine Söhne, und עִמּוֹ bindet ihre Freilassung an seine.
theological_decisions:
- issue: Geschlechtsspezifische Bezeichnung בָנָיו
  choice: seine Söhne
  alternative: seine Kinder
  rationale: Der hebräische Text verwendet ausdrücklich den maskulinen Plural „Söhne“. Diese Form wird bewahrt und nicht verallgemeinert.
- issue: Bedeutung des Freikommens im Jobeljahr
  choice: rechtliches Ende des Dienstverhältnisses
  alternative: ausschließlich geistliche Erlösung
  rationale: Der unmittelbare Zusammenhang regelt die Auslösung und Freilassung eines Israeliten aus einem Dienstverhältnis. Die Übersetzung vermeidet es, eine weitergehende theologische Deutung in den Vers einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rechtlich verständlicher Ausdrucksweise. „Auslösen“ bewahrt den sachlichen Zusammenhang von גאל; „freikommen“ gibt die Funktion des hebräischen „hinausgehen“ natürlich wieder.
