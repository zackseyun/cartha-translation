base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/051.yaml
  text: If many years still remain[a], in proportion to them he shall repay his redemption price from the money of his purchase.
translation:
  language: de
  text: Wenn noch viele Jahre verbleiben, soll er entsprechend ihrer Zahl als Preis für seine Auslösung einen Teil des für ihn gezahlten Kaufpreises zurückzahlen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »… soll er entsprechend ihrer Zahl seine Auslösung aus dem für ihn gezahlten Kaufpreis zurückzahlen.« Das hebräische Substantiv kann sowohl die Auslösung als Vorgang als auch den dafür zu zahlenden Betrag bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Wenn
  rationale: Die gewöhnliche konditionale Wiedergabe leitet den hier geregelten Fall ein.
- source_word: עוֹד רַבּוֹת בַּשָּׁנִים
  choice: bis dahin noch viele Jahre verbleiben
  rationale: Das im Deutschen ergänzte »verbleiben« gibt die elliptische hebräische Wendung natürlich wieder; »bis dahin« verdeutlicht im Kontext die verbleibende Zeit bis zum Jubeljahr.
- source_word: לְפִיהֶן
  choice: entsprechend ihrer Zahl
  rationale: Die wörtliche Wendung »nach ihrem Mund« bezeichnet hier das Verhältnis zur Anzahl der zuvor genannten Jahre.
- source_word: יָשִׁיב
  choice: zurückzahlen
  rationale: Der Hifil von שוב bedeutet im finanziell-rechtlichen Zusammenhang, einen Betrag zurückzugeben beziehungsweise zurückzuzahlen.
- source_word: גְּאֻלָּתוֹ
  choice: den Preis für seine Auslösung
  rationale: גְּאֻלָּה kann die Auslösung selbst oder konkret den dafür zu zahlenden Betrag bezeichnen; der Kontext legt hier den Preis nahe, ohne den Grundbegriff »Auslösung« aufzugeben.
- source_word: מִכֶּסֶף מִקְנָתוֹ
  choice: vom Kaufpreis
  rationale: Die kompakte deutsche Form gibt das hebräische »vom Geld seines Kaufs« idiomatisch wieder und bezeichnet den ursprünglichen Betrag, nach dem die anteilige Rückzahlung bemessen wird.
