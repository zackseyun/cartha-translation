id: LEV.25.50
reference: Leviticus 25:50
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/חִשַּׁב֙ עִם קֹנֵ֔/הוּ מִ/שְּׁנַת֙ הִמָּ֣כְר/וֹ ל֔/וֹ עַ֖ד שְׁנַ֣ת הַ/יֹּבֵ֑ל וְ/הָיָ֞ה כֶּ֤סֶף מִמְכָּר/וֹ֙ בְּ/מִסְפַּ֣ר שָׁנִ֔ים כִּ/ימֵ֥י שָׂכִ֖יר יִהְיֶ֥ה עִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/050.yaml
  text: He shall calculate with his buyer from the year he sold himself to him until the year of jubilee[a], and the price of his sale shall be according to the number of years[b]; like the days of a hired worker he shall be with him.
translation:
  language: de
  text: Er soll mit seinem Käufer abrechnen, und zwar von dem Jahr an, in dem er sich ihm verkauft hat, bis zum Jobeljahr.[a] Der Verkaufspreis soll sich nach der Zahl der Jahre richten; wie ein Lohnarbeiter soll er bei ihm sein.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „von dem Jahr an, in dem er ihm verkauft wurde“. Aus dem Zusammenhang geht hervor, dass der Mann sich selbst in den Dienst verkauft hat.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „wie die Tage eines Lohnarbeiters soll er bei ihm sein“. Gemeint ist eine nach Dienstjahren berechnete, zeitlich begrenzte Arbeitsleistung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחִשַּׁב
  choice: Er soll … abrechnen
  rationale: חשב bezeichnet hier eine finanzielle Berechnung zur Ermittlung des Auslösungspreises. „Abrechnen“ gibt den rechtlich-wirtschaftlichen Vorgang im Deutschen natürlich wieder.
- source_word: עִם קֹנֵהוּ
  choice: mit seinem Käufer
  rationale: Das Partizip von קנה bezeichnet denjenigen, der ihn erworben hat. „Käufer“ bewahrt die ausdrückliche Transaktionssprache des hebräischen Rechtstextes.
- source_word: מִשְּׁנַת הִמָּכְרוֹ לוֹ
  choice: von dem Jahr an, in dem er sich ihm verkauft hat
  rationale: Die Form bezeichnet das Jahr seines Verkauftwerdens; im Zusammenhang von Vers 47 ist ein Selbstverkauf gemeint. Die reflexive deutsche Fassung ist verständlich, während eine Fußnote die formalere passive Wiedergabe nennt.
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: bis zum Jobeljahr
  rationale: „Jobeljahr“ ist die etablierte deutsche Bezeichnung für die in Levitikus 25 geregelte Institution und entspricht dem hebräischen הַיֹּבֵל.
- source_word: וְהָיָה כֶּסֶף מִמְכָּרוֹ
  choice: Der Verkaufspreis soll sich … richten
  rationale: כֶּסֶף bedeutet wörtlich „Silber/Geld“, bezeichnet hier aber den Geldwert des Verkaufs. „Verkaufspreis“ ist im deutschen Rechtskontext präzise und idiomatisch.
- source_word: בְּמִסְפַּר שָׁנִים
  choice: nach der Zahl der Jahre
  rationale: Die Wendung nennt die Zahl der Jahre als Grundlage der anteiligen Berechnung, ohne ausdrücklich festzulegen, ob der Blick auf verstrichene oder verbleibende Jahre gerichtet ist.
- source_word: כִּימֵי שָׂכִיר
  choice: wie ein Lohnarbeiter
  rationale: שָׂכִיר ist ein gegen Lohn beschäftigter Arbeiter. Die knappe Vergleichsform gibt den rechtlichen Status als zeitlich begrenzte Arbeitsleistung wieder; die wörtliche Rede von den „Tagen“ wird in der Fußnote bewahrt.
- source_word: יִהְיֶה עִמּוֹ
  choice: soll er bei ihm sein
  rationale: Die Wiedergabe bleibt nahe bei der hebräischen Aussage und lässt den vorangestellten Vergleich bestimmen, unter welchen Bedingungen der Mann bei seinem Käufer ist.
theological_decisions:
- issue: Status des verkauften Israeliten
  choice: „wie ein Lohnarbeiter“
  alternative: „als Eigentum seines Käufers“
  rationale: Der hebräische Text vergleicht seine Stellung ausdrücklich mit der eines שָׂכִיר und stellt damit zeitlich berechnete Dienstleistung in den Vordergrund. Eine Sprache dauerhaften Eigentums würde über den Vers hinausgehen.
translation_notes:
  register: Moderner, würdiger Rechtstext in allgemein verständlichem Standarddeutsch. „Jobeljahr“ hält die traditionelle biblische Sachbezeichnung fest; „abrechnen“ und „Verkaufspreis“ vermitteln den wirtschaftlich-rechtlichen Sinn ohne unnötig altertümliche Formulierungen.
