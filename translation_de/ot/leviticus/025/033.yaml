reference: Leviticus 25:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/אֲשֶׁ֤ר יִגְאַל֙ מִן הַ/לְוִיִּ֔ם וְ/יָצָ֧א מִמְכַּר בַּ֛יִת וְ/עִ֥יר אֲחֻזָּת֖/וֹ בַּ/יֹּבֵ֑ל כִּ֣י בָתֵּ֞י עָרֵ֣י הַ/לְוִיִּ֗ם הִ֚וא אֲחֻזָּתָ֔/ם בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/033.yaml
  text: And if one of the Levites redeems it[a], then the sale of the house in the city of his possession shall be released in the Jubilee[b]; for the houses of the cities of the Levites are their possession among the sons of Israel.
translation:
  language: de
  text: Und wenn einer von den Leviten es zurückkauft, fällt das verkaufte Haus in der Stadt seines Grundbesitzes im Erlassjahr[a] zurück; denn die Häuser in den Städten der Leviten sind ihr Grundbesitz inmitten der Israeliten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: „im Jubeljahr“. Das hebräische Wort bezeichnet das in jedem fünfzigsten Jahr vorgesehene Erlass- und Rückgabejahr.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר יִגְאַל מִן הַלְוִיִּם
  choice: Und wenn einer von den Leviten es zurückkauft
  rationale: 'מִן הַלְוִיִּם wird im Zusammenhang am plausibelsten partitiv verstanden: Der Zurückkaufende gehört zu den Leviten. „Zurückkauft“ gibt die rechtliche Bedeutung von גאל natürlich wieder; das im Hebräischen vorausgesetzte Objekt wird mit „es“ aufgenommen.'
- source_word: וְיָצָא
  choice: fällt … zurück
  rationale: Wörtlich „geht hinaus“; beim Erlassjahr bezeichnet dies, dass das verkaufte Eigentum aus dem Besitz des Käufers ausscheidet und an den ursprünglichen Rechtsinhaber zurückfällt.
- source_word: מִמְכַּר בַּיִת
  choice: das verkaufte Haus
  rationale: מִמְכָּר kann den Verkauf oder das Verkauftes bezeichnen. Hier ist das Haus selbst das Subjekt des Zurückfallens; „das verkaufte Haus“ macht diesen syntaktischen und rechtlichen Sinn deutlich.
- source_word: וְעִיר אֲחֻזָּתוֹ
  choice: in der Stadt seines Grundbesitzes
  rationale: Die verdichtete hebräische Fügung wird als Ortsbestimmung zum Haus verstanden. „Grundbesitz“ wahrt den landrechtlichen Gehalt von אֲחֻזָּה besser als das allgemeinere „Besitz“.
- source_word: בַּיֹּבֵל
  choice: im Erlassjahr
  rationale: Bezeichnet die gesetzlich festgelegte Jubeljahr-Institution. „Erlassjahr“ ist im Deutschen verständlich und hebt ihre rechtliche Funktion hervor; die traditionelle Benennung wird in der Fußnote genannt.
- source_word: בָתֵּי עָרֵי הַלְוִיִּם
  choice: die Häuser in den Städten der Leviten
  rationale: Der hebräische Constructus bezeichnet hier sachlich die Häuser, die sich in den den Leviten zugewiesenen Städten befinden. Die deutsche Präpositionalfügung ist klar und natürlich.
- source_word: הִוא אֲחֻזָּתָם
  choice: sind ihr Grundbesitz
  rationale: Trotz des singularischen Pronomens הִוא bezieht sich die Aussage dem Sinn nach auf die vorangestellten Häuser. אֲחֻזָּה bezeichnet einen rechtlich gesicherten, bleibenden Landbesitz.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: inmitten der Israeliten
  rationale: בְּנֵי יִשְׂרָאֵל ist die feste Bezeichnung für das Volk Israel. „Israeliten“ ist im modernen Deutschen präzise und vermeidet die missverständliche Beschränkung auf männliche Nachkommen.
theological_decisions:
- issue: Bezug von מִן הַלְוִיִּם
  choice: einer von den Leviten
  alternative: jemand kauft von den Leviten zurück
  rationale: Die partitive Lesart entspricht dem unmittelbaren Kontext über das besondere Rückkaufsrecht levitischer Häuser und vermeidet die sachlich schwierige Umkehrung, nach der ein Außenstehender Eigentum „von den Leviten“ zurückkauft.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: Israeliten
  alternative: Söhne Israels
  rationale: Die feste Bundes- und Volksbezeichnung schließt hier das gesamte Volk ein. „Israeliten“ bewahrt den historischen Bezug, ohne im Deutschen irreführend nur Männer zu bezeichnen.
translation_notes:
  register: Moderner, würdiger Rechtstext. Die Satzstruktur bleibt nahe am kasuistischen Hebräisch, während „zurückkauft“, „fällt zurück“ und „Grundbesitz“ die Eigentumsregel für heutige Leser verständlich ausdrücken.
