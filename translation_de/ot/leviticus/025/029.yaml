id: LEV.25.29
reference: Leviticus 25:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אִ֗ישׁ כִּֽי יִמְכֹּ֤ר בֵּית מוֹשַׁב֙ עִ֣יר חוֹמָ֔ה וְ/הָיְתָה֙ גְּאֻלָּת֔/וֹ עַד תֹּ֖ם שְׁנַ֣ת מִמְכָּר֑/וֹ יָמִ֖ים תִּהְיֶ֥ה גְאֻלָּתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/029.yaml
  text: If a man sells a house for dwelling in a walled city[a], its redemption may be made until the completion of a full year from its sale; its right of redemption shall last for days, that is, a full year.
translation:
  language: de
  text: Wenn jemand ein Wohnhaus in einer ummauerten Stadt verkauft, kann er es bis zum Ablauf eines vollen Jahres nach dem Verkauf zurückkaufen. Ein Jahr lang[a] besteht sein Rückkaufsrecht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Tage“. In dieser rechtlichen Wendung bezeichnet das hebräische Wort die Dauer eines vollen Jahres.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי
  choice: Wenn jemand
  rationale: Die Verbindung leitet einen Rechtsfall ein. „Jemand“ gibt das generische אִישׁ im modernen deutschen Rechtston natürlich wieder, ohne den sachlichen Geltungsbereich auf Männer einzuengen.
- source_word: יִמְכֹּר
  choice: verkauft
  rationale: Das Imperfekt bezeichnet im konditionalen Rechtssatz den angenommenen Fall und wird im Deutschen idiomatisch im Präsens wiedergegeben.
- source_word: בֵּית מוֹשַׁב
  choice: ein Wohnhaus
  rationale: Die Konstruktverbindung bezeichnet ein zum Wohnen bestimmtes Haus; „Wohnhaus“ ist präzise und natürlich.
- source_word: עִיר חוֹמָה
  choice: eine ummauerte Stadt
  rationale: Die Wendung bezeichnet eine Stadt mit einer Mauer. „Ummauert“ bewahrt diesen konkreten Sinn besser als das weiter gefasste „befestigt“.
- source_word: גְּאֻלָּתוֹ
  choice: es zurückkaufen / sein Rückkaufsrecht
  rationale: Im Grundstücksrecht bezeichnet גְּאֻלָּה die Auslösung des verkauften Eigentums beziehungsweise das dazu bestehende Recht. Die verbale und nominale Wiedergabe vermeidet die im heutigen Deutsch missverständliche religiöse Bedeutung von „Erlösung“.
- source_word: עַד תֹּם שְׁנַת מִמְכָּרוֹ
  choice: bis zum Ablauf eines vollen Jahres nach dem Verkauf
  rationale: Gemeint ist ein vollständig bemessenes Jahr seit dem Verkauf, nicht lediglich das Ende des Kalenderjahres, in dem verkauft wurde.
- source_word: יָמִים
  choice: Ein Jahr lang
  rationale: יָמִים bedeutet wörtlich „Tage“, bezeichnet in diesem rechtlichen Idiom jedoch die Dauer eines vollen Jahres; die Fußnote macht die Form des Hebräischen sichtbar.
- source_word: תִּהְיֶה גְאֻלָּתוֹ
  choice: besteht sein Rückkaufsrecht
  rationale: Die Klausel formuliert das zeitlich begrenzte Fortbestehen der Möglichkeit beziehungsweise des Rechts zum Rückkauf.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger deutscher Rechtston. „Wenn jemand“ ist als allgemeine Fallformel natürlicher als „Wenn ein Mann“. „Rückkauf“ und „Rückkaufsrecht“ geben den konkreten Grundstücksvorgang klarer wieder als das religiös gefärbte „Erlösung“. Die Wiederholung des Jahreszeitraums im Hebräischen bleibt erhalten; das Idiom יָמִים wird im Text verständlich übersetzt und in der Fußnote formal ausgewiesen.
