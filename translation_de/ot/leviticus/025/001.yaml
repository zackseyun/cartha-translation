  text: וַ/יְדַבֵּ֤ר יְהוָה֙ אֶל מֹשֶׁ֔ה בְּ/הַ֥ר סִינַ֖י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/001.yaml
  text: And Yahweh spoke to Moses on Mount Sinai[a], saying,
translation:
  language: de
  text: 'Und Jahwe[a] sprach zu Mose auf dem Berg Sinai:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; auch als „Jehova“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Und … sprach
  rationale: Das Waw mit der Verbform führt das nächste Geschehen im Erzählfluss ein. „Sprach“ gibt דבר wieder und leitet die folgende Gottesrede natürlich ein.
- source_word: יְהוָה
  choice: Jahwe[a]
  rationale: Der Gottesname יהוה wird als Eigenname „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen; die Fußnote nennt die hebräische Form und eine gebräuchliche alternative Wiedergabe.
- source_word: אֶל־מֹשֶׁה
  choice: zu Mose
  rationale: אֶל bezeichnet hier den Adressaten des Sprechens; „zu Mose“ ist die natürliche deutsche Fügung.
- source_word: בְּהַר סִינַי
  choice: auf dem Berg Sinai
  rationale: ב ist lokal gebraucht. „Auf dem Berg Sinai“ bewahrt den naheliegenden Ortsbezug, ohne den Kontext näher festzulegen.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv leitet den Inhalt der Rede ein. Im heutigen Deutschen übernimmt der Doppelpunkt diese Funktion natürlicher als das schwerfällige „indem er sagte“ oder „mit den Worten“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: Jehova; der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. „Jahwe“ gibt ihn als Eigennamen wieder; „der HERR“ wäre eine traditionelle Ersatzlesung, „Jehova“ eine alternative Namensform.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt verbindet die Redeeinleitung idiomatisch mit dem im nächsten Vers folgenden Redeinhalt.
