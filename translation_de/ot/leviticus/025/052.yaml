  variant: modern standard German
source:
  edition: WLC
  text: וְ/אִם מְעַ֞ט נִשְׁאַ֧ר בַּ/שָּׁנִ֛ים עַד שְׁנַ֥ת הַ/יֹּבֵ֖ל וְ/חִשַּׁב ל֑/וֹ כְּ/פִ֣י שָׁנָ֔י/ו יָשִׁ֖יב אֶת גְּאֻלָּתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/052.yaml
  text: But if few years remain until the Year of Jubilee, then he shall calculate with him; according to his years he shall repay his redemption.
translation:
  language: de
  text: Wenn aber bis zum Jobeljahr nur wenige Jahre übrig sind, soll er mit ihm abrechnen. Entsprechend der Zahl seiner Jahre soll er den Preis für seinen Loskauf erstatten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »seine Auslösung zurückgeben«; gemeint ist der für den Loskauf zu zahlende Betrag.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט נִשְׁאַר בַּשָּׁנִים
  choice: nur wenige Jahre übrig sind
  rationale: Die Verbindung bezeichnet idiomatisch eine geringe Zahl noch verbleibender Jahre; „nur“ bringt den kontrastierenden quantitativen Sinn im Deutschen natürlich zum Ausdruck.
- source_word: שְׁנַת הַיּוֹבֵל
  choice: Jobeljahr
  rationale: „Jobeljahr“ ist die etablierte deutsche Bezeichnung für die in Levitikus 25 geregelte Institution und bewahrt den Bezug zum hebräischen יוֹבֵל.
- source_word: וְחִשַּׁב לוֹ
  choice: soll er mit ihm abrechnen
  rationale: חִשַּׁב bezeichnet hier eine rechtlich-wirtschaftliche Berechnung; „mit ihm abrechnen“ gibt sowohl den rechnerischen als auch den zwischen den Beteiligten vollzogenen Vorgang wieder.
- source_word: כְּפִי שָׁנָיו
  choice: entsprechend der Zahl seiner Jahre
  rationale: כְּפִי drückt ein Verhältnis aus. Die Formulierung hält den Bezug der pronominalen Wendung „seiner Jahre“ offen und verdeutlicht zugleich, dass ihre Anzahl die Höhe bestimmt.
- source_word: יָשִׁיב אֶת גְּאֻלָּתוֹ
  choice: soll er den Preis für seinen Loskauf erstatten
  rationale: גְּאֻלָּה bezeichnet in diesem wirtschaftlichen Zusammenhang den für die Freilassung erforderlichen Loskaufbetrag, während יָשִׁיב die Rück- beziehungsweise Erstattungsleistung ausdrückt.
theological_decisions:
- issue: Bedeutung von גְּאֻלָּה im rechtlichen Zusammenhang
  choice: als konkreter Preis für den Loskauf wiedergegeben
  alternative: 'wörtlicher: „seine Auslösung erstatten“'
  rationale: Der Kontext handelt von der anteiligen Geldleistung zur Freilassung, nicht von Erlösung als abstraktem theologischen Begriff. Die konkrete Wiedergabe vermeidet daher eine sachfremde dogmatische Aufladung.
translation_notes:
  register: Moderne, würdige Rechtssprache. „Jobeljahr“ bewahrt den etablierten biblischen Fachbegriff; „Loskauf“ macht den wirtschaftlich-rechtlichen Vorgang verständlich. Die zwei Hauptsätze bilden die knappe Struktur der hebräischen Vorschrift nach.
