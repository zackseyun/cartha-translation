source:
  edition: WLC
  text: וְ/נָתְנָ֤ה הָ/אָ֨רֶץ֙ פִּרְיָ֔/הּ וַ/אֲכַלְתֶּ֖ם לָ/שֹׂ֑בַע וִֽ/ישַׁבְתֶּ֥ם לָ/בֶ֖טַח עָלֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/019.yaml
  text: The land will yield its fruit[a], and you will eat your fill and live securely on it.
translation:
  language: de
  text: Das Land wird seine Frucht geben, und ihr werdet euch satt essen und sicher darauf wohnen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: darauf in Sicherheit leben. Das hebräische Verb kann sowohl „wohnen“ als auch „leben“ bedeuten; die Wendung hebt den sicheren Aufenthalt im Land hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנָה
  choice: wird geben
  rationale: Das Verb נתן bedeutet wörtlich „geben“. Mit dem Land als Subjekt ist diese Formulierung auch im Deutschen natürlich und bewahrt zugleich das hebräische Bild.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Im Zusammenhang von 3. Mose 25 ist das bewohnbare und landwirtschaftlich genutzte Land gemeint, nicht die Erde als Ganzes.
- source_word: פִּרְיָהּ
  choice: seine Frucht
  rationale: פְּרִי bezeichnet wörtlich „Frucht“ und kann den gesamten Ertrag einschließen. Die konkrete Bildsprache des Hebräischen bleibt so erhalten.
- source_word: וַאֲכַלְתֶּם
  choice: und ihr werdet essen
  rationale: Die zweite Person Plural wird direkt wiedergegeben; zusammen mit לָשֹׂבַע ergibt sich idiomatisch „ihr werdet euch satt essen“.
- source_word: לָשֹׂבַע
  choice: euch satt
  rationale: שֹׂבַע bezeichnet Sättigung oder Genüge. „Sich satt essen“ gibt die Bedeutung in natürlichem modernem Deutsch wieder.
- source_word: וִישַׁבְתֶּם
  choice: und ihr werdet wohnen
  rationale: ישב kann in diesem Zusammenhang „wohnen“, „leben“ oder „sich niederlassen“ bedeuten. „Wohnen“ betont passend den dauerhaften Aufenthalt im Land, ohne die Bedeutung unnötig einzuengen.
- source_word: לָבֶטַח
  choice: sicher
  rationale: בֶּטַח bezeichnet Sicherheit und Ungefährdetheit. Das Adverb „sicher“ verbindet sich im Deutschen natürlich mit „wohnen“.
- source_word: עָלֶיהָ
  choice: darauf
  rationale: Das Suffix verweist auf das feminine הָאָרֶץ zurück. „Darauf“ gibt das Wohnen auf dem Land knapp und direkt wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Übersetzung folgt der hebräischen Satzfolge weitgehend, verwendet aber mit „euch satt essen“ eine natürliche deutsche Wendung. Der Fußnotenmarker steht bei „wohnen“, da sich die erläuterte lexikalische Alternative auf וִישַׁבְתֶּם bezieht.
