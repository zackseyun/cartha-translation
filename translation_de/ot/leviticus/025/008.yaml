  text: וְ/סָפַרְתָּ֣ לְ/ךָ֗ שֶׁ֚בַע שַׁבְּתֹ֣ת שָׁנִ֔ים שֶׁ֥בַע שָׁנִ֖ים שֶׁ֣בַע פְּעָמִ֑ים וְ/הָי֣וּ לְ/ךָ֗ יְמֵי֙ שֶׁ֚בַע שַׁבְּתֹ֣ת הַ/שָּׁנִ֔ים תֵּ֥שַׁע וְ/אַרְבָּעִ֖ים שָׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/008.yaml
  text: You shall count for yourself seven sabbaths of years[a], seven years seven times, and the days of the seven sabbaths of years shall be for you forty-nine years.
translation:
  language: de
  text: 'Du sollst dir sieben Sabbatzyklen[a] abzählen: sieben Jahre, siebenmal. Die Tage der sieben Sabbatzyklen sollen dir neunundvierzig Jahre ergeben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sieben Jahrwochen“. Wörtlich steht im Hebräischen „sieben Sabbate von Jahren“; gemeint sind sieben Zyklen von jeweils sieben Jahren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָפַרְתָּ
  choice: Du sollst ... abzählen
  rationale: ספר bezeichnet hier das geordnete Zählen einer festgelegten Folge von Zeitabschnitten. „Abzählen“ gibt diesen Sinn im Deutschen natürlich wieder.
- source_word: לְךָ
  choice: dir / für dich
  rationale: Der ausdrücklich gesetzte Dativ der zweiten Person wird an beiden Stellen wiedergegeben; beim ersten Vorkommen reflexiv mit „dir“, beim zweiten idiomatisch mit „für dich“.
- source_word: שֶׁבַע שַׁבְּתֹת שָׁנִים
  choice: sieben Sabbatzeiten von Jahren
  rationale: Die Wendung bezeichnet sieben aus Jahren bestehende Sabbatzyklen. „Sabbatzeiten“ bewahrt das Sabbatmotiv und vermeidet zugleich den irreführenden Eindruck einzelner wöchentlicher Sabbate.
- source_word: שֶׁבַע שָׁנִים שֶׁבַע פְּעָמִים
  choice: siebenmal sieben Jahre
  rationale: Die kompakte deutsche Form gibt die Wiederholung von sieben Jahren siebenmal klar wieder, ohne die rechnerische Struktur zu verändern.
- source_word: וְהָיוּ לְךָ יְמֵי
  choice: So umfasst die Zeit ... für dich
  rationale: Das hebräische Ergebnisgefüge wird in natürlichem Deutsch als Gesamtdauer formuliert. יְמֵי bedeutet wörtlich „die Tage“, bezeichnet hier aber die Zeitspanne.
- source_word: תֵּשַׁע וְאַרְבָּעִים שָׁנָה
  choice: neunundvierzig Jahre
  rationale: Die Zahl wird in der üblichen deutschen Form wiedergegeben.
theological_decisions:
- issue: Bedeutung der „Sabbate von Jahren“
  choice: Sabbatzeiten von Jahren
  alternative: Jahrwochen
  rationale: Die gewählte Form erhält die ausdrückliche Verbindung zum Sabbat und damit zum vorausgehenden Erlassjahrgesetz. „Jahrwochen“ wäre verständlich, würde das Sabbatmotiv aber abschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung erhöht die Verständlichkeit, während Wiederholung, Sabbatbild und Gesamtsumme des hebräischen Textes erhalten bleiben.
