  text: וְ/צִוִּ֤יתִי אֶת בִּרְכָתִ/י֙ לָ/כֶ֔ם בַּ/שָּׁנָ֖ה הַ/שִּׁשִּׁ֑ית וְ/עָשָׂת֙ אֶת הַ/תְּבוּאָ֔ה לִ/שְׁלֹ֖שׁ הַ/שָּׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/021.yaml
  text: Then I will command my blessing for you in the sixth year[a], and it will produce the yield for three years.
translation:
  language: de
  text: Dann werde ich meinem Segen gebieten, dass er euch im sechsten Jahr Ertrag[a] für drei Jahre bringt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ernte“ beziehungsweise „Ernteertrag“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוִּיתִי
  choice: Dann werde ich … aufbieten
  rationale: Das Verb bezeichnet hier ein wirksames göttliches Gebieten. „Aufbieten“ bewahrt diese Kraft und klingt im Deutschen natürlicher als „meinen Segen befehlen“. „Dann“ gibt die antwortende Funktion des וְ im Zusammenhang wieder.
- source_word: בִּרְכָתִי
  choice: meinen Segen
  rationale: Die Form bezeichnet Gottes gewährte Gunst, deren landwirtschaftliche Wirkung der folgende Satz beschreibt.
- source_word: לָכֶם
  choice: für euch
  rationale: Die Präposition kennzeichnet die Begünstigten; „für euch“ ist dafür die natürliche deutsche Wiedergabe.
- source_word: בַּשָּׁנָה הַשִּׁשִּׁית
  choice: im sechsten Jahr
  rationale: Die schlichte Zeitangabe bleibt erhalten und bezieht die Verheißung auf den Sabbatjahrzyklus.
- source_word: וְעָשָׂת
  choice: und es wird … hervorbringen
  rationale: Die feminine Singularform lässt im Deutschen ein neutrales „es“ zu, das die im Hebräischen nicht völlig aufgelöste Beziehung zum sechsten Jahr beziehungsweise zum Segen nicht unnötig festlegt.
- source_word: הַתְּבוּאָה
  choice: Ertrag
  rationale: תְּבוּאָה bezeichnet hier den landwirtschaftlichen Ertrag. Das deutsche Wort ist präzise, gegenwärtig und vermeidet die mögliche Mehrdeutigkeit von „Frucht“.
- source_word: לִשְׁלֹשׁ הַשָּׁנִים
  choice: für drei Jahre
  rationale: Die Formulierung bewahrt die knappe Zeit- beziehungsweise Versorgungsangabe des Hebräischen, ohne „ausreichend“ ausdrücklich hinzuzufügen.
theological_decisions:
- issue: Art des verheißenen Segens
  choice: Ein unmittelbares göttliches Gebieten, das außergewöhnlichen landwirtschaftlichen Ertrag bewirkt
  alternative: Eine allgemeine Aussage über gewöhnliche Vorsehung
  rationale: Die erste Person Singular zusammen mit „meinen Segen“ stellt die Versorgung als besondere göttliche Zusage dar.
- issue: Bezug des femininen Verbs וְעָשָׂת
  choice: Der deutsche Text lässt den Bezug mit „es“ offen
  alternative: Ausdrückliche Festlegung auf den Segen oder auf das sechste Jahr
  rationale: Im Hebräischen kommen mehrere feminine Bezugswörter in Betracht. Eine eindeutige Festlegung würde eine im Ausgangstext verbleibende Spannung unnötig auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Aufbieten“ ist leicht gehoben, bewahrt aber die ungewöhnliche Vorstellung, dass Gott seinem Segen wirksam gebietet, ohne in eine konfessionell geprägte Deutung auszuweichen.
