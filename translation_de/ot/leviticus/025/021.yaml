revisions:
- from: Dann werde ich im sechsten Jahr meinen Segen für euch aufbieten, und es wird Ertrag[a] für drei Jahre hervorbringen.
  to: Dann werde ich meinem Segen gebieten, dass er euch im sechsten Jahr Ertrag[a] für drei Jahre bringt.
  rationale: Die Revision ersetzt die unidiomatische und semantisch verschobene Wendung „Segen aufbieten“ durch die dem hebräischen Ausdruck entsprechende Konstruktion „meinem Segen gebieten“. Sie macht zugleich den Segen als Bezug des folgenden Verbs explizit, ohne eine zusätzliche theologische Deutung einzutragen. Die knappe Formulierung „Ertrag für drei Jahre“ bewahrt die im Hebräischen ausgedrückte Versorgungsweite, ohne „ausreichend“ ergänzend zu behaupten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T07:20:52Z'
review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt Zeitangabe, göttlichen Segen und die auf drei Jahre bezogene landwirtschaftliche Versorgung grundsätzlich wieder. „Meinen Segen ... aufbieten“ bildet jedoch וְצִוִּיתִי („ich werde meinem Segen gebieten“) nicht angemessen ab und lässt das anschließende „es“ ohne tragfähigen Bezug. Die vorgeschlagene Fassung wahrt die im Hebräischen naheliegende Personifizierung des Segens als Subjekt des Ertrags.
  naturalness: „Segen aufbieten“ ist im modernen Standarddeutsch keine passende Verbindung; zudem wirkt „es wird Ertrag hervorbringen“ mit dem unklaren Pronomen holprig. „Meinem Segen gebieten, dass er ... Ertrag bringt“ ist verständlich, würdig und im biblischen Register idiomatisch genug.
  terminology: „Segen“, „sechstes Jahr“ und „Ertrag“ sind passend. Die lexikalische Fußnote zu „Ertrag“ kann bestehen bleiben; „Ernte“ und „Ernteertrag“ sind mögliche Alternativen für תְּבוּאָה.
  issues:
  - severity: medium
    issue: „meinen Segen für euch aufbieten“ verfehlt die deutsche Rektion und Bedeutung von „einem Segen gebieten“.
    rationale: צוה steht mit „meinem Segen“ als demjenigen, dem Gott gebietet. „Aufbieten“ bedeutet eher Ressourcen mobilisieren und macht den Segen zu einem eingesetzten Mittel statt zum Empfänger des göttlichen Befehls.
  - severity: medium
    issue: Das Pronomen „es“ ist semantisch und grammatisch unklar.
    rationale: Nach „meinen Segen“ ist ein neutrales „es“ nicht rückbeziehbar; „Jahr“ wäre zwar neutral, aber als Subjekt von „Ertrag hervorbringen“ weniger naheliegend als der im Hebräischen feminine „Segen“.
  revised_text: Dann werde ich meinem Segen gebieten, dass er euch im sechsten Jahr Ertrag[a] für drei Jahre bringt.
  revised_footnotes:
  - marker: a
    text: 'Oder: „Ernte“ beziehungsweise „Ernteertrag“.'
    reason: lexical_alternative
