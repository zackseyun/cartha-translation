  text: וְ/אִ֕ישׁ כִּ֛י לֹ֥א יִֽהְיֶה לּ֖/וֹ גֹּאֵ֑ל וְ/הִשִּׂ֣יגָה יָד֔/וֹ וּ/מָצָ֖א כְּ/דֵ֥י גְאֻלָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/026.yaml
  text: But if a man has no redeemer[a], and his hand attains enough and he finds sufficient means for his redemption[b],
translation:
  language: de
  text: Wenn aber ein Mann keinen Löser[a] hat und seine Mittel ausreichen[b] und er genug für seinen Rückkauf findet,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Verwandtenlöser“. Das hebräische Wort bezeichnet hier einen nahen Verwandten, der das Recht beziehungsweise die Pflicht hat, Familienbesitz zurückzukaufen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „seine Hand reicht/gelangt“. Diese hebräische Redewendung bedeutet hier, dass seine eigenen Mittel ausreichend werden.'
    reason: idiom
lexical_decisions:
- source_word: וְ/אִישׁ כִּי
  choice: Wenn aber ein Mann
  rationale: Die Wendung eröffnet einen weiteren Rechtsfall. „Wenn“ gibt das konditionale כִּי wieder; „aber“ macht den Gegensatz zum vorherigen Fall deutlich, und „ein Mann“ entspricht dem maskulinen Singular אִישׁ.
- source_word: לֹא יִהְיֶה לּוֹ גֹּאֵל
  choice: keinen Löser hat
  rationale: גֹּאֵל bezeichnet hier den nahen Verwandten, der berechtigt beziehungsweise verpflichtet ist, veräußerten Familienbesitz zurückzukaufen. „Löser“ bewahrt den rechtlichen Leitbegriff; die Fußnote erläutert seine familiäre Funktion.
- source_word: וְהִשִּׂיגָה יָדוֹ
  choice: später jedoch zu ausreichenden Mitteln kommt
  rationale: Wörtlich heißt die hebräische Redewendung, dass „seine Hand reicht/erlangt“. Gemeint ist, dass der Betroffene selbst wirtschaftlich in die Lage zum Rückkauf kommt. „Später“ drückt die eintretende Veränderung aus, ohne einen bestimmten Zeitraum festzulegen.
- source_word: וּמָצָא כְּדֵי גְאֻלָּתוֹ
  choice: und genug für seinen Rückkauf aufbringen kann
  rationale: מָצָא bedeutet grundsätzlich „finden“, bezeichnet hier aber das Erlangen des benötigten Betrags. כְּדֵי drückt das Ausreichende aus, während גְאֻלָּה im Zusammenhang des Landrechts den Rückkauf bezeichnet.
theological_decisions:
- issue: Bedeutung des גֹּאֵל im Landrecht
  choice: Löser
  alternative: Verwandtenlöser; naher Verwandter, der den Besitz zurückkauft
  rationale: Der knappe Fachbegriff wahrt die Verbindung zum hebräischen Wortfeld des Lösens, ohne die Erlösung hier vorschnell geistlich zu deuten. Die konkrete verwandtschaftliche und wirtschaftliche Funktion wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Rechtsdeutsch mit verständlicher Satzführung. Der Fachbegriff „Löser“ erhält die Verbindung zum hebräischen Wortfeld; seine hier gemeinte Funktion wird erläutert. Der Vers endet entsprechend dem hebräischen Satzbau mit einem Komma, da der Rechtsfall im folgenden Vers fortgesetzt wird.
