review_pass:
  verdict: revise
  source_fidelity: Die metonymische Wiedergabe von שַׁבַּת הָאָרֶץ als der während der Sabbatruhe hervorgebrachte Ertrag ist im Kontext sachgerecht. Allerdings gibt die Übersetzung הַגָּרִים עִמָּךְ als singularischen Relativsatz wieder, obwohl im Hebräischen ein Pluralpartizip steht. Die deutsche Fassung sollte diese pluralische bzw. kollektiv verstandene Form nicht ohne Kennzeichnung singularisieren.
  naturalness: Der Satz ist insgesamt gut verständlich und würdig. »Beisasse« ist jedoch im modernen Standarddeutsch deutlich veraltet und ohne Fußnote wenig transparent. »Ansässiger Fremder« ist klarer und wahrt die soziale Außenstellung.
  terminology: »Sklave/Sklavin« gegenüber »Lohnarbeiter« bildet die im Text unterschiedenen Abhängigkeitsverhältnisse treffend ab. Für תּוֹשָׁב ist »ansässiger Fremder« eine moderne, verständliche Lösung; die Fußnote soll keine zu weitgehende Aussage über Dauerhaftigkeit oder einen präzise festgelegten Rechtsstatus machen.
  issues:
  - severity: medium
    issue: Plural von הַגָּרִים עִמָּךְ nicht abgebildet
    rationale: Das Partizip הַגָּרִים ist morphologisch Plural. »der bei dir lebt« macht daraus einen einzelnen Beisassen. Eine pluralische Relativform bewahrt die Form des hebräischen Textes und lässt offen, ob die Form kollektiv oder auf die genannten Personengruppen bezogen zu verstehen ist.
  - severity: low
    issue: »Beisasse« ist nicht modernes Standarddeutsch
    rationale: Der Ausdruck ist historisch und rechtssprachlich geprägt. Die vorhandene Fußnote erklärt ihn zwar, doch »ansässiger Fremder« ist im Fließtext unmittelbar verständlich und gibt die relevante Unterscheidung besser wieder.
  - severity: low
    issue: Fußnote legt den Status des תּוֹשָׁב zu eng fest
    rationale: »Dauerhaft« und »ohne den vollen Status eines Einheimischen« sind mögliche historische Einordnungen, aber nicht die gesamte lexikalische Bedeutung des Wortes. Die Anmerkung sollte bei der Grundbedeutung eines ansässigen bzw. mitwohnenden Nichtisraeliten bleiben.
