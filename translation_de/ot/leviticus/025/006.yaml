  text: וְ֠/הָיְתָה שַׁבַּ֨ת הָ/אָ֤רֶץ לָ/כֶם֙ לְ/אָכְלָ֔ה לְ/ךָ֖ וּ/לְ/עַבְדְּ/ךָ֣ וְ/לַ/אֲמָתֶ֑/ךָ וְ/לִ/שְׂכִֽירְ/ךָ֙ וּ/לְ/תוֹשָׁ֣בְ/ךָ֔ הַ/גָּרִ֖ים עִמָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/006.yaml
  text: The Sabbath produce of the land shall be for you for food—for you[a], for your male servant, for your female servant, for your hired worker[b], and for your resident foreigner who dwells with you.
translation:
  language: de
  text: 'Was das Land während seiner Sabbatruhe hervorbringt, soll euch als Nahrung dienen: dir, deinem Sklaven und deiner Sklavin, deinem Lohnarbeiter und deinem ansässigen Fremden, die bei dir wohnen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיְתָה
  choice: soll … dienen
  rationale: Die Verbform hat im gesetzlichen Zusammenhang futurisch-normativen Sinn. Die Formulierung gibt dies in natürlichem Deutsch wieder.
- source_word: שַׁבַּת הָאָרֶץ
  choice: was das Land während seiner Sabbatruhe hervorbringt
  rationale: Wörtlich steht »der Sabbat des Landes«. Im Zusammenhang bezeichnet die Wendung das, was das ruhende Land im Sabbatjahr von selbst hervorbringt und als Nahrung verfügbar ist; die Übersetzung macht diesen Bezug verständlich, ohne die Verbindung zur Sabbatruhe aufzugeben.
- source_word: לָכֶם לְאָכְלָה
  choice: soll euch als Nahrung dienen
  rationale: 'Die Wendung bezeichnet Bestimmung und Gebrauch: Das Genannte ist für die Adressaten zum Essen bestimmt.'
- source_word: לְךָ
  choice: dir
  rationale: Das singularische Pronomen eröffnet die Aufzählung der Personen, denen der Ertrag als Nahrung dient.
- source_word: עַבְדְּךָ וְלַאֲמָתֶךָ
  choice: deinem Sklaven und deiner Sklavin
  rationale: Die beiden Wörter bezeichnen hier ausdrücklich männliche und weibliche Personen in unfreier Stellung. »Sklave« und »Sklavin« bewahren diese soziale und rechtliche Unterscheidung.
- source_word: שְׂכִירְךָ
  choice: deinem Lohnarbeiter
  rationale: Das Wort bezeichnet einen gegen Lohn beschäftigten Arbeiter und unterscheidet ihn von den zuvor genannten unfreien Hausangehörigen.
- source_word: תוֹשָׁבְךָ
  choice: dem Beisassen
  rationale: Das Wort bezeichnet einen ansässigen, aber nicht voll eingebürgerten Bewohner. »Beisasse« hält diese besondere Rechts- und Sozialstellung fest; eine Fußnote erläutert den heute weniger geläufigen Ausdruck.
- source_word: הַגָּרִים עִמָּךְ
  choice: der bei dir lebt
  rationale: Die Partizipialform beschreibt den fortdauernden Aufenthalt bei dem angesprochenen Israeliten.
theological_decisions:
- issue: Wiedergabe der unterschiedlichen Abhängigkeitsverhältnisse
  choice: »Sklave/Sklavin« für עבד/אמה und »Lohnarbeiter« für שכיר
  alternative: Alle Begriffe mit »Diener/Dienerin« wiedergeben
  rationale: Der hebräische Text unterscheidet unfreie Personen von einem gegen Lohn Beschäftigten. Diese sozialrechtliche Spannung soll nicht eingeebnet werden.
- issue: Bezug von »Sabbat des Landes«
  choice: Als Ertrag während der Sabbatruhe paraphrasieren
  alternative: Wörtlich »der Sabbat des Landes«
  rationale: Da der Sabbat selbst nicht gegessen wird, verweist die Wendung im Kontext metonymisch auf den Ertrag des ruhenden Landes. Die gewählte Form wahrt den Sabbatbezug und macht den gemeinten Nahrungsaspekt deutlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur ist flüssig und verständlich; »Sabbatruhe« bewahrt den institutionellen Bezug. Der fachlich genaue, heute jedoch weniger geläufige Ausdruck »Beisasse« wird in einer Fußnote erklärt.
