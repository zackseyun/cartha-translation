  text: וְ/לִ֨/בְהֶמְתְּ/ךָ֔ וְ/לַֽ/חַיָּ֖ה אֲשֶׁ֣ר בְּ/אַרְצֶ֑/ךָ תִּהְיֶ֥ה כָל תְּבוּאָתָ֖/הּ לֶ/אֱכֹֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/007.yaml
  text: And for your livestock[a], and for the wild animals that are in your land, all its produce shall be for food.
translation:
  language: de
  text: Und deinem Vieh und den wilden Tieren in deinem Land soll sein ganzer Ertrag als Nahrung dienen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְהֶמְתְּךָ
  choice: deinem Vieh
  rationale: בְּהֵמָה bezeichnet hier kollektiv die domestizierten Nutztiere des Angeredeten. „Vieh“ ist im Deutschen natürlich und bildet einen klaren Gegensatz zu den folgenden wilden Tieren.
- source_word: לַחַיָּה
  choice: den wilden Tieren
  rationale: חַיָּה bezeichnet im Gegensatz zum Vieh die nicht domestizierten Tiere. „Wilde Tiere“ ist gegenwärtig, konkret und gut verständlich.
- source_word: אֲשֶׁר בְּאַרְצְךָ
  choice: in deinem Land
  rationale: Der Relativsatz bezieht sich auf die wilden Tiere. „Land“ bewahrt den konkreten und im Kontext passenden Sinn von אֶרֶץ.
- source_word: תִּהְיֶה
  choice: soll ... dienen
  rationale: היה beschreibt hier im gesetzlichen Zusammenhang die vorgesehene Verfügbarkeit beziehungsweise Bestimmung. Die Formulierung mit „soll“ wahrt den Anweisungston und ergibt natürliches Deutsch.
- source_word: כָּל תְּבוּאָתָהּ
  choice: sein ganzer Ertrag
  rationale: תְּבוּאָה bezeichnet den Ertrag des Landes; das feminine Suffix nimmt אֶרֶץ auf. „Sein ganzer Ertrag“ ist im landwirtschaftlichen Zusammenhang präzise und idiomatisch.
- source_word: לֶאֱכֹל
  choice: als Nahrung
  rationale: Der mit ל gebildete Infinitiv bezeichnet Zweck oder Bestimmung. „Als Nahrung dienen“ gibt diese Funktion in natürlichem, würdigem Deutsch wieder.
