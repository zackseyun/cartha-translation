source:
  edition: WLC
  text: כִּ/שְׂכִ֥יר שָׁנָ֛ה בְּ/שָׁנָ֖ה יִהְיֶ֣ה עִמּ֑/וֹ לֹֽא יִרְדֶּ֥/נּֽוּ בְּ/פֶ֖רֶךְ לְ/עֵינֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/053.yaml
  text: Like a hired worker year by year he shall be with him[a]; he shall not rule over him harshly in your sight.
translation:
  language: de
  text: Wie ein Lohnarbeiter soll er Jahr für Jahr bei ihm sein[a]; er darf ihn vor deinen Augen nicht mit Härte beherrschen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Als Lohnarbeiter soll er Jahr für Jahr bei ihm sein.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּשְׂכִיר
  choice: wie ein Lohnarbeiter
  rationale: Das Präfix כְּ kennzeichnet einen Vergleich, und שָׂכִיר bezeichnet einen gegen Lohn arbeitenden Menschen, nicht einen Sklaven. „Lohnarbeiter“ ist im heutigen Deutsch klar und sachlich.
- source_word: שָׁנָה בְּשָׁנָה
  choice: Jahr für Jahr
  rationale: Die Wendung beschreibt den fortlaufenden, auf die einzelnen Jahre bezogenen Status und wird mit der natürlichen deutschen Entsprechung wiedergegeben.
- source_word: יִהְיֶה עִמּוֹ
  choice: soll er … bei ihm sein
  rationale: Die Formulierung hält sich an das schlichte „bei ihm sein“ des Hebräischen. Wiedergaben wie „bei ihm bleiben“ oder „ihm dienen“ würden zusätzliche Bedeutung eintragen.
- source_word: לֹא יִרְדֶּנּוּ
  choice: er darf ihn … nicht beherrschen
  rationale: רדה bedeutet herrschen oder Gewalt ausüben. „Beherrschen“ bewahrt den Gedanken der Machtausübung; „darf nicht“ gibt das Verbot in natürlichem deutschem Rechtsstil wieder.
- source_word: בְּפֶרֶךְ
  choice: mit Härte
  rationale: Das Substantiv bezeichnet eine harte, rücksichtslose Art der Machtausübung, besonders im Zusammenhang mit Zwangsarbeit. Die nominale Wendung bildet die hebräische Ausdrucksweise prägnant ab.
- source_word: לְעֵינֶיךָ
  choice: vor deinen Augen
  rationale: Die wörtlich-bildhafte Wendung ist auch im Deutschen verständlich und hebt hervor, dass das Verhalten für den angesprochenen Israeliten sichtbar geschieht.
theological_decisions:
- issue: Rechtlicher Status des Israeliten bei einem ansässigen Fremden
  choice: Sein Status wird mit dem eines Lohnarbeiters verglichen.
  alternative: Er wird unmittelbar als Lohnarbeiter bezeichnet.
  rationale: Der Vergleich mit einem Lohnarbeiter entspricht dem כְּ und unterstreicht den geschützten, zeitlich begrenzten Status, ohne den weiteren Zusammenhang des Dienstverhältnisses auszublenden oder einen stärkeren Begriff von Sklaverei in den Vers einzutragen.
- issue: Träger des Verbots im zweiten Satzteil
  choice: Das „er“ bezeichnet den fremden Herrn, der den Israeliten nicht mit Härte beherrschen darf.
  alternative: Das Subjekt könnte ohne den Kontext rein grammatisch als weniger ausdrücklich bestimmt wahrgenommen werden.
  rationale: Der unmittelbare Rechtszusammenhang macht den Besitzer zum naheliegenden Subjekt und den verkauften Israeliten zum Objekt; die deutschen Pronomen bewahren dabei die knappe Form des Hebräischen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper rechtlicher Ausdrucksweise. „Lohnarbeiter“ vermeidet das heute missverständliche „Knecht“; „vor deinen Augen“ bewahrt das anschauliche Bild des Ausgangstextes.
