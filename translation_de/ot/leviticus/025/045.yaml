  verdict: revise
  source_fidelity: Die passive Formulierung „denen ... Kinder geboren wurden“ gibt הוֹלִידוּ nicht angemessen wieder. Das Verb steht hier aktiv und bezeichnet das Zeugen/Vaterwerden durch die ansässigen Fremden. Zudem bleibt die Beziehung des Relativsatzes zu den Familien im Deutschen klarer, wenn ihre Angehörigen ausdrücklich genannt werden.
  naturalness: Die Überarbeitung erhält eine moderne, sachliche Rechtssprache. „Menschen kaufen“ und „euer Eigentum“ geben die harte rechtliche Aussage ohne Euphemismus wieder; die Satzverbindung wird dabei verständlicher.
  terminology: „Ansässige Fremde“ ist für die rechtlich geprägten Bezeichnungen תּוֹשָׁבִים und גָּרִים vertretbar. „Nachkommen“ ist im Kontext von בְּנֵי möglich, mit der wörtlichen Alternative in der Fußnote. „Eigentum“ gibt אֲחֻזָּה in diesem Kontext klar wieder.
  issues:
