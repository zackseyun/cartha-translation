    issue: Aktivischer Sinn von הוֹלִידוּ wird durch eine passive Geburtsformulierung verwischt.
    rationale: „Denen in eurem Land Kinder geboren wurden“ lässt offen, wer die Kinder zeugte, während das hebräische Hifil mit maskulinem Pluralsubjekt den aktiven Zeugungsakt der betreffenden Männer ausdrückt.
  - severity: low
    issue: Der Relativsatz ist im Deutschen bei „Familien“ semantisch schwer anschließbar.
    rationale: Familien werden nicht selbst „gezeugt“. Die Benennung ihrer Angehörigen macht deutlich, dass die in den Familien vorhandenen Personen gemeint sind, die die Fremden im Land gezeugt haben.
