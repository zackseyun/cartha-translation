base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/045.yaml
  text: You may also buy from the sons of the sojourners who reside with you[a], and from their families who are with you, whom they have fathered in your land[b]; and they shall become your possession.
translation:
  language: de
  text: Auch von den Nachkommen der ansässigen Fremden, die bei euch leben, dürft ihr Menschen kaufen[a], ebenso von ihren Familien, die bei euch sind und deren Angehörige sie in eurem Land gezeugt haben. Sie sollen euer Eigentum werden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von den Söhnen der ansässigen Fremden, die bei euch leben, dürft ihr kaufen“. „Söhne“ kann hier allgemeiner die Nachkommen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Sie sollen euch als Besitz gehören.“ Das hebräische Wort bezeichnet hier einen rechtlich festgehaltenen und vererbbaren Besitz.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Auch
  rationale: Leitet in Fortsetzung des vorigen Verses eine weitere erlaubte Bezugsgruppe ein.
- source_word: מִבְּנֵי הַתּוֹשָׁבִים הַגָּרִים עִמָּכֶם
  choice: von den Nachkommen der ansässigen Fremden, die bei euch leben
  rationale: בְּנֵי kann in diesem Abstammungszusammenhang Nachkommen bezeichnen; die gekoppelten Ausdrücke תּוֹשָׁבִים und גָּרִים bezeichnen hier nichtisraelitische, ansässige Fremde.
- source_word: מֵהֶם תִּקְנוּ
  choice: dürft ihr Menschen kaufen
  rationale: קנה bezeichnet hier angesichts des rechtlichen Zusammenhangs einen Kauf. Das ergänzte „Menschen“ macht im Deutschen den Gegenstand deutlich, ohne die Eigentumssprache abzuschwächen.
- source_word: וּמִמִּשְׁפַּחְתָּם אֲשֶׁר עִמָּכֶם
  choice: ebenso aus ihren Familien, die bei euch sind
  rationale: מִשְׁפָּחָה wird zugänglich mit „Familie“ wiedergegeben; der Relativsatz bleibt eng am Hebräischen.
- source_word: אֲשֶׁר הוֹלִידוּ בְּאַרְצְכֶם
  choice: denen in eurem Land Kinder geboren wurden
  rationale: Die natürliche deutsche Formulierung gibt das Hervorbringen beziehungsweise Zeugen von Nachkommen wieder, ohne das Geschlecht der betreffenden Kinder unnötig festzulegen.
- source_word: וְהָיוּ לָכֶם לַאֲחֻזָּה
  choice: Sie sollen euer Eigentum werden
  rationale: אֲחֻזָּה bezeichnet einen rechtlich verfügbaren Besitz beziehungsweise ein Eigentum; „Eigentum“ macht den hier gemeinten Status von Menschen ungeschönt sichtbar.
theological_decisions:
- issue: Eigentums- und Sklavereisprache im Heiligkeitsgesetz
  choice: Die Kauf- und Eigentumssprache wird direkt wiedergegeben.
  alternative: „erwerben“, „Besitz“ oder eine abschwächende Bezeichnung als Diener
  rationale: Der hebräische Rechtstext spricht von Kauf und von einem Status als אֲחֻזָּה. Eine euphemistische Wiedergabe würde die ethische und theologische Spannung des Textes verdecken.
- issue: Bedeutungsumfang von בְּנֵי
  choice: Nachkommen
  alternative: Söhne
  rationale: Im Zusammenhang mit Familien und den im Land Geborenen bezeichnet der Ausdruck plausibel die Nachkommenschaft insgesamt; die wörtlichere Alternative wird in der Fußnote bewahrt.
translation_notes:
  register: Moderne, verständliche und zugleich würdevolle Rechtssprache. Die harte Eigentumsterminologie des Ausgangstextes wird nicht beschönigt. Die Anrede steht entsprechend dem Hebräischen im Plural.
