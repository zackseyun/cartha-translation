  text: For six years you shall sow your field[a], and for six years you shall prune your vineyard and gather its produce.
translation:
  language: de
  text: Sechs Jahre lang sollst du dein Feld besäen, und sechs Jahre lang sollst du deinen Weinberg beschneiden und den Ertrag des Landes einbringen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ihren Ertrag“. Das feminine Suffix bezieht sich wahrscheinlich auf „das Land“ in Vers 2. Das hebräische Wort kann auch „Erzeugnis“ oder „Ernteertrag“ bedeuten.'
    reason: Referenz des pronominalen Suffixes und lexikalische Alternative
lexical_decisions:
- source_word: שֵׁשׁ שָׁנִים
  choice: sechs Jahre lang
  rationale: Die Zeitdauer wird im Deutschen mit „sechs Jahre lang“ natürlich und eindeutig wiedergegeben.
- source_word: תִּזְרַע
  choice: sollst du … besäen
  rationale: Das Imperfekt hat hier im Gesetzestext anweisende Kraft. „Sollst“ wahrt den verpflichtenden Charakter; „besäen“ passt idiomatisch zum genannten Feld.
- source_word: שָׂדֶךָ
  choice: dein Feld
  rationale: שׂדה bezeichnet hier konkret die landwirtschaftlich genutzte Ackerfläche, nicht das Land im weiteren Sinn.
- source_word: תִּזְמֹר
  choice: sollst du … beschneiden
  rationale: זמר bezeichnet im Weinbau das Beschneiden der Reben; „beschneiden“ ist der präzise deutsche Fachausdruck.
- source_word: כַּרְמֶךָ
  choice: deinen Weinberg
  rationale: „Weinberg“ ist die geläufige und sachlich genaue Entsprechung für כרם.
- source_word: וְאָסַפְתָּ
  choice: und … einbringen
  rationale: Im Zusammenhang mit dem Ertrag gibt „einbringen“ das Einsammeln der landwirtschaftlichen Erzeugnisse natürlich wieder, ohne das Substantiv selbst auf „Ernte“ zu verengen.
- source_word: תְּבוּאָתָהּ
  choice: den Ertrag des Landes
  rationale: תְּבוּאָה bezeichnet den landwirtschaftlichen Ertrag. Das feminine Suffix verweist am plausibelsten auf הָאָרֶץ („das Land“) aus Vers 2; die ausdrückliche Wiederaufnahme verhindert im Deutschen einen unklaren oder grammatisch irreführenden Pronomenbezug.
