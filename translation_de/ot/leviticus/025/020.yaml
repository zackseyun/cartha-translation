  yaml_path: translation/ot/leviticus/025/020.yaml
  text: And if you say, ‘What will we eat in the seventh year, since we will not sow or gather our produce?’
translation:
  language: de
  text: 'Und wenn ihr sagt: »Was werden wir im siebten Jahr essen? Siehe, wir werden weder säen noch unseren Ertrag einbringen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי תֹאמְרוּ
  choice: Und wenn ihr fragt
  rationale: Die konditionale Wendung leitet eine erwartete Frage ein; im natürlichen Deutschen gibt »fragt« die folgende direkte Frage treffender wieder als das wörtlichere »sagt«.
- source_word: מַה נֹּאכַל
  choice: Was sollen wir … essen
  rationale: Das hebräische Imperfekt fragt nach der möglichen Versorgung in der Zukunft. Die deutsche Wendung »Was sollen wir … essen?« ist idiomatisch und bewahrt die besorgte Frage.
- source_word: הֵן
  choice: da
  rationale: Die Partikel führt hier den Grund für die Sorge an. »Da« gibt diesen Zusammenhang natürlich wieder, ohne das im Deutschen schwerfällige »Siehe«.
- source_word: לֹא נִזְרָע וְלֹא נֶאֱסֹף
  choice: wir weder säen noch … einbringen
  rationale: Die koordinierten Verneinungen werden idiomatisch mit »weder … noch« wiedergegeben. »Einbringen« bezeichnet passend das Einsammeln der Ernte.
- source_word: תְּבוּאָתֵנוּ
  choice: unseren Ertrag
  rationale: תְּבוּאָה bezeichnet den landwirtschaftlichen Ertrag beziehungsweise die Ernte; »Ertrag« bewahrt den sachlichen und umfassenden Sinn.
