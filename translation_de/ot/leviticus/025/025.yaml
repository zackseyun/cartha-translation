  text: כִּֽי יָמ֣וּךְ אָחִ֔י/ךָ וּ/מָכַ֖ר מֵ/אֲחֻזָּת֑/וֹ וּ/בָ֤א גֹֽאֲל/וֹ֙ הַ/קָּרֹ֣ב אֵלָ֔י/ו וְ/גָאַ֕ל אֵ֖ת מִמְכַּ֥ר אָחִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/025.yaml
  text: If your brother becomes poor and sells some of his property[b][a], then his nearest kinsman-redeemer shall come and redeem what his brother has sold.
translation:
  language: de
  text: Wenn dein Bruder verarmt und etwas von seinem Erbbesitz[b] verkauft, kann sein nächster Verwandter als Löser[a] kommen und das auslösen, was sein Bruder verkauft hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein „Löser“ ist hier ein naher Verwandter, der veräußerten Familienbesitz zurückerwerben kann. Die hebräische Verbform bezeichnet die Modalität nicht ausdrücklich; auch „soll ... kommen und ... auslösen“ ist möglich.
    reason: lexical_alternative
  - marker: b
    text: „Erbbesitz“ bezeichnet den erblichen Landbesitz einer Familie innerhalb der Stammesgebiete Israels.
    reason: cultural_note
lexical_decisions:
- source_word: יָמוּךְ
  choice: verarmt
  rationale: Das Verb bezeichnet den wirtschaftlichen Abstieg in Armut. „Verarmt“ ist im Deutschen knapp, natürlich und für den allgemeinen Rechtsfall passend.
- source_word: אָחִיךָ
  choice: dein Bruder
  rationale: Die wörtliche Verwandtschaftsbezeichnung bleibt erhalten; im Rahmen des Gesetzes kann sie zugleich einen israelitischen Volksgenossen bezeichnen.
- source_word: מֵאֲחֻזָּתוֹ
  choice: etwas von seinem Erbbesitz
  rationale: אֲחֻזָּה meint hier nicht beliebigen Besitz, sondern den erblichen Landbesitz einer Familie innerhalb Israels. „Erbbesitz“ gibt diesen rechtlich-kulturellen Hintergrund knapp wieder.
- source_word: גֹאֲלוֹ הַקָּרֹב אֵלָיו
  choice: sein nächster Verwandter als Löser
  rationale: Die Formulierung macht sowohl die enge Verwandtschaft als auch die besondere rechtliche Rolle des גֹּאֵל verständlich, ohne den Begriff auf einen gewöhnlichen Käufer zu reduzieren.
- source_word: וּבָא
  choice: soll ... kommen
  rationale: Im kasuistischen Gesetzeskontext drückt die Verbfolge die vorgesehene Rechtsfolge aus. Da die bloße hebräische Verbform Modalität nicht eindeutig markiert, wird die mögliche Lesart „kann“ in der Fußnote bewahrt.
- source_word: וְגָאַל
  choice: auslösen
  rationale: „Auslösen“ bewahrt den rechtlichen Erlösungsgedanken von גאל und bezeichnet hier die Rückgewinnung des veräußerten Familienbesitzes.
- source_word: אֵת מִמְכַּר אָחִיו
  choice: das ..., was sein Bruder verkauft hat
  rationale: מִמְכָּר kann den Verkauf oder das Verkaufte bezeichnen. Die gewählte Formulierung ist idiomatisch und lässt den Gegenstand des Verkaufs im Mittelpunkt stehen.
theological_decisions:
- issue: Verwandtschaftssprache im israelitischen Recht
  choice: dein Bruder
  alternative: dein Verwandter / dein israelitischer Volksgenosse
  rationale: Der hebräische Text sagt ausdrücklich „Bruder“. Die weitere gemeinschaftsrechtliche Bedeutung wird nicht ausgeschlossen, aber im Haupttext nicht an die Stelle des konkreten Quellenworts gesetzt.
- issue: Wiedergabe der גאל-Terminologie
  choice: Verwandter als Löser / auslösen
  alternative: Rückkäufer / zurückkaufen
  rationale: Die gewählte Wortfamilie erhält die rechtliche und zugleich breitere biblische Bedeutung des Erlösens. Die Verwandtschaftspflicht wird ausdrücklich benannt, damit „Löser“ nicht missverstanden wird.
- issue: Modalität von וּבָא וְגָאַל
  choice: soll kommen und ... auslösen
  alternative: kann kommen und ... auslösen
  rationale: Der Rechtskontext legt eine vorgesehene Pflicht beziehungsweise Rechtsfolge nahe; die nicht ausdrücklich markierte Modalität des Hebräischen lässt jedoch auch eine ermöglichende Wiedergabe zu, die in der Fußnote genannt wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die juristische Schlüsselbezeichnung „Löser“ wird durch „Verwandter“ und eine Fußnote verständlich gemacht; „Erbbesitz“ wahrt den konkreten israelitischen Landrechtskontext.
