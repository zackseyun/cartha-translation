language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם כִּ֤י תָבֹ֨אוּ֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֥ר אֲנִ֖י נֹתֵ֣ן לָ/כֶ֑ם וְ/שָׁבְתָ֣ה הָ/אָ֔רֶץ שַׁבָּ֖ת לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/002.yaml
  text: Speak to the sons of Israel and say to them, ‘When you come into the land that I am giving to you, then the land shall keep a Sabbath to Yahweh.
translation:
  language: de
  text: 'Rede zu den Israeliten und sag ihnen: »Wenn ihr in das Land kommt, das ich euch gebe, soll das Land einen Sabbat für Jahwe halten.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »soll das Land für Jahwe Sabbatruhe halten«. Traditionell wird יהוה mit »der HERR« wiedergegeben.'
    reason: Die Fußnote nennt eine stärker auf den Ruheaspekt ausgerichtete Wiedergabe und die traditionelle deutsche Ersatzlesung des Gottesnamens.
lexical_decisions:
- source_word: דַּבֵּר אֶל בְּנֵי יִשְׂרָאֵל
  choice: Rede zu den Israeliten
  rationale: בְּנֵי יִשְׂרָאֵל lautet wörtlich „Söhne Israels“, bezeichnet hier jedoch das gesamte Bundesvolk. „Israeliten“ ist im modernen Deutsch natürlich und schließt die ganze angesprochene Gemeinschaft ein.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: und sag ihnen
  rationale: Die direkte Fortsetzung des Befehls wird in natürlichem, würdigem Deutsch wiedergegeben.
- source_word: כִּי תָבֹאוּ אֶל הָאָרֶץ
  choice: Wenn ihr in das Land kommt
  rationale: כִּי leitet hier den erwarteten künftigen Zeitpunkt ein; „wenn“ passt daher besser als ein konditionales „falls“.
- source_word: אֲשֶׁר אֲנִי נֹתֵן לָכֶם
  choice: das ich euch gebe
  rationale: Das Partizip נֹתֵן bezeichnet die gegenwärtig zugesagte beziehungsweise bevorstehende Gabe Gottes; das deutsche Präsens bewahrt diesen Sinn idiomatisch.
- source_word: וְשָׁבְתָה הָאָרֶץ שַׁבָּת
  choice: soll das Land einen Sabbat … halten
  rationale: Die verwandten Wörter שׁבת und שַׁבָּת personifizieren das Land als Sabbat haltend. Die Formulierung erhält diese auffällige Bildsprache und den Gedanken sowohl der Ruhe als auch der Sabbatbeobachtung.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: ל bezeichnet hier Ausrichtung beziehungsweise Weihung. „Für Jahwe“ klingt im Deutschen natürlicher als „Jahwe einen Sabbat halten“ und gibt den Gottesnamen als Eigennamen wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ macht diesen Namen sichtbar; die traditionelle Ersatzlesung „der HERR“ wird als Alternative in der Fußnote genannt.
- issue: Das Land als Sabbat haltendes Subjekt
  choice: Das Land soll einen Sabbat für Jahwe halten
  alternative: Das Land soll für Jahwe ruhen
  rationale: Die gewählte Formulierung bewahrt die Personifikation und die etymologische Verbindung zwischen dem Verb שׁבת und dem Substantiv שַׁבָּת, ohne die Aussage auf bloße landwirtschaftliche Ruhe zu verengen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, gut verständlichem Gesetzesstil. „Israeliten“ vermeidet das heute missverständliche generische „Söhne Israels“. Die Anredeformen „ihr/euch“ bleiben kleingeschrieben. Die ungewöhnliche Personifikation des Landes wird bewusst erhalten.
