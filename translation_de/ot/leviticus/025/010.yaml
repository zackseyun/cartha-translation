  variant: modern standard German
source:
  edition: WLC
  text: וְ/קִדַּשְׁתֶּ֗ם אֵ֣ת שְׁנַ֤ת הַ/חֲמִשִּׁים֙ שָׁנָ֔ה וּ/קְרָאתֶ֥ם דְּר֛וֹר בָּ/אָ֖רֶץ לְ/כָל יֹשְׁבֶ֑י/הָ יוֹבֵ֥ל הִוא֙ תִּהְיֶ֣ה לָ/כֶ֔ם וְ/שַׁבְתֶּ֗ם אִ֚ישׁ אֶל אֲחֻזָּת֔/וֹ וְ/אִ֥ישׁ אֶל מִשְׁפַּחְתּ֖/וֹ תָּשֻֽׁבוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/010.yaml
  text: And you shall consecrate the fiftieth year[a], and proclaim liberty in the land to all its inhabitants. It shall be a jubilee for you, and each of you shall return to his property[d][c][b], and each of you shall return to his family.
translation:
  language: de
  text: Ihr sollt das fünfzigste Jahr heiligen und im Land für alle seine Bewohner Freiheit[a] ausrufen. Es soll für euch ein Jubeljahr[b] sein. Dann soll jeder von euch zu seinem Grundbesitz[c] zurückkehren, und jeder von euch soll zu seiner Sippe[d] zurückkehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Freilassung; Freigabe. Das hebräische Wort bezeichnet hier eine förmlich ausgerufene Freiheit im fünfzigsten Jahr.'
    reason: lexical_alternative
  - marker: b
    text: Hebräisch Jobel. Gemeint ist die besondere Jahrordnung; auch „Jobeljahr“ ist möglich.
    reason: cultural_note
  - marker: c
    text: 'Oder: zu seinem Besitz. Gemeint ist besonders der erbliche Landbesitz.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: zu seiner Familie. Das hebräische Wort kann eine größere Verwandtschaftsgruppe bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתֶּם
  choice: ihr sollt … heiligen
  rationale: Das Piel von קדשׁ bezeichnet das Heiligen beziehungsweise Aussondern als heilig. „Heiligen“ bewahrt den kultischen Sinn und ist im Deutschen klar und würdig.
- source_word: שְׁנַת הַחֲמִשִּׁים שָׁנָה
  choice: das fünfzigste Jahr
  rationale: Die hebräische Zahlkonstruktion wird idiomatisch als Ordinalzahl wiedergegeben.
- source_word: וּקְרָאתֶם דְּרוֹר
  choice: Freilassung ausrufen
  rationale: דְּרוֹר bezeichnet hier eine förmlich ausgerufene Freigabe, die sowohl persönliche Befreiung als auch die Wiederherstellung von Besitzverhältnissen einschließt. „Freilassung“ ist konkreter als „Freiheit“, ohne den Rechtscharakter zu verlieren.
- source_word: בָּאָרֶץ לְכָל יֹשְׁבֶיהָ
  choice: im Land für alle seine Bewohner
  rationale: בְּ bezeichnet den Ort des Ausrufs; לְ gibt dessen Adressaten beziehungsweise Begünstigte an. Die Formulierung bleibt eng an der hebräischen Syntax.
- source_word: יוֹבֵל הִוא תִּהְיֶה לָכֶם
  choice: Es soll für euch ein Erlassjahr sein
  rationale: יוֹבֵל ist in Levitikus 25 die Bezeichnung der besonderen Jahrordnung. „Erlassjahr“ vermittelt deren Funktion verständlicher als das im heutigen Deutsch missverständliche „Jubeljahr“; die alternative Fachbezeichnung wird in der Fußnote genannt.
- source_word: וְשַׁבְתֶּם … תָּשֻׁבוּ
  choice: zurückkehren … zurückkehren
  rationale: Die Wiederholung desselben Verbs im Hebräischen wird erhalten und unterstreicht die Wiederherstellung.
- source_word: אִישׁ
  choice: jeder von euch … jeder
  rationale: אִישׁ ist grammatisch maskulin, wirkt hier aber distributiv innerhalb der angesprochenen Gemeinschaft. „Jeder von euch“ bildet zugleich den Pluraladressaten und die Einzelverpflichtung natürlich ab.
- source_word: אֶל אֲחֻזָּתוֹ
  choice: zu seinem Grundbesitz
  rationale: אֲחֻזָּה meint in diesem Zusammenhang besonders den zugeteilten, erblichen Landbesitz. „Grundbesitz“ gibt dies knapp und präzise wieder.
- source_word: אֶל מִשְׁפַּחְתּוֹ
  choice: zu seiner Sippe
  rationale: מִשְׁפָּחָה bezeichnet hier die größere Verwandtschafts- beziehungsweise Sippengruppe und nicht nur die moderne Kernfamilie.
theological_decisions:
- issue: Reichweite von דְּרוֹר
  choice: Freilassung
  alternative: Freiheit; Freigabe
  rationale: Die Wiedergabe lässt den institutionellen und rechtlichen Charakter des Ausrufs erkennen, ohne ihn ausschließlich auf Sklavenfreilassung oder Schuldenerlass festzulegen.
- issue: Bedeutung von יוֹבֵל
  choice: Erlassjahr
  alternative: Jobeljahr; Jubeljahr; Widderhorn
  rationale: Im unmittelbaren Zusammenhang bezeichnet יוֹבֵל die besondere Jahrordnung, nicht bloß das Hornsignal. „Erlassjahr“ erklärt ihre Funktion, während die Fußnote die traditionelle Fachbezeichnung und deren Hintergrund bewahrt.
- issue: Distributives אִישׁ im Gesetzestext
  choice: jeder von euch … jeder
  alternative: jeder Mann
  rationale: Die Formulierung erhält die distributive Einzelzuweisung und den Bezug zur angesprochenen Gemeinschaft, ohne aus der grammatisch maskulinen Form eine zusätzliche Einschränkung abzuleiten.
- issue: Soziale Einheit מִשְׁפָּחָה
  choice: Sippe
  alternative: Familie; Großfamilie
  rationale: „Sippe“ wahrt die im Kontext mögliche größere Verwandtschaftseinheit und verhindert eine vorschnelle Einengung auf die heutige Kernfamilie.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit gesetzlichem Ton. Die zweimalige Formulierung „zurückkehren“ bildet die auffällige hebräische Wiederholung ab. „Erlassjahr“ dient der heutigen Verständlichkeit; „Jobeljahr/Jubeljahr“ bleibt als traditionsreiche Alternative in der Fußnote erhalten.
