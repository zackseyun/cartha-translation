source:
  edition: WLC
  text: לְ/פִ֣י רֹ֣ב הַ/שָּׁנִ֗ים תַּרְבֶּה֙ מִקְנָת֔/וֹ וּ/לְ/פִי֙ מְעֹ֣ט הַ/שָּׁנִ֔ים תַּמְעִ֖יט מִקְנָת֑/וֹ כִּ֚י מִסְפַּ֣ר תְּבוּאֹ֔ת ה֥וּא מֹכֵ֖ר לָֽ/ךְ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/016.yaml
  text: In proportion to the greater number of years you shall increase its purchase price[a], and in proportion to the fewer number of years you shall reduce its purchase price, because he is selling to you a number of harvests.
translation:
  language: de
  text: Je größer die Zahl der Jahre, desto höher sollst du den Kaufpreis ansetzen; je kleiner die Zahl der Jahre, desto niedriger sollst du den Kaufpreis ansetzen. Denn eine Anzahl von Ernten verkauft er dir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn eine Anzahl von Erträgen verkauft er dir.“ Das hebräische Wort kann „Ernten“, „Erträge“ oder „Feldfrüchte“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפִי רֹב הַשָּׁנִים
  choice: Je größer die Zahl der Jahre ist
  rationale: לְפִי bezeichnet hier eine proportionale Entsprechung; die deutsche Je-desto-Konstruktion gibt zusammen mit dem parallelen Satzglied die Preisstaffelung natürlich und präzise wieder.
- source_word: תַּרְבֶּה מִקְנָתוֹ
  choice: desto höher sollst du den Kaufpreis ansetzen
  rationale: Das Hifil von רבה fordert eine Erhöhung; מִקְנָה bezeichnet im Zusammenhang den Kaufpreis. „ansetzen“ entspricht idiomatischem Deutsch für die Festlegung eines Preises.
- source_word: וּלְפִי מְעֹט הַשָּׁנִים
  choice: und je kleiner die Zahl der Jahre ist
  rationale: Die Formulierung bewahrt die genaue Parallelität zum ersten Satzglied und verdeutlicht, dass es um die verbleibende Zahl von Jahren geht, ohne „bis zum Erlassjahr“ in den Vers einzufügen.
- source_word: תַּמְעִיט מִקְנָתוֹ
  choice: desto niedriger sollst du den Kaufpreis ansetzen
  rationale: Das Hifil von מעט bedeutet vermindern; in Verbindung mit dem Kaufpreis ist „niedriger ansetzen“ natürliches modernes Deutsch.
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion leitet die Begründung der Preisregel ein.
- source_word: מִסְפַּר תְּבוּאֹת
  choice: eine entsprechende Zahl von Ernten
  rationale: תְּבוּאוֹת kann Ernten, Erträge oder Feldfrüchte bezeichnen. „Ernten“ macht verständlich, dass der wirtschaftliche Gegenstand der Transaktion die Nutzungs- beziehungsweise Ertragsjahre sind; „entsprechende“ nimmt den proportionalen Zusammenhang auf, ohne eine konkrete Zahl hinzuzufügen.
- source_word: הוּא מֹכֵר לָךְ
  choice: er verkauft dir
  rationale: Die maskuline Singularform und das Partizip werden schlicht und quellennah wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die symmetrische Je-desto-Konstruktion vermittelt die rechtliche Preisregel klar. Der im Kontext vorausgesetzte Zeitraum bis zum Erlassjahr wird nicht ausdrücklich ergänzt. Der Fußnotenmarker steht im Haupttext.
