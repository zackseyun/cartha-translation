id: LEV.25.5
reference: Leviticus 25:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֵ֣ת סְפִ֤יחַ קְצִֽירְ/ךָ֙ לֹ֣א תִקְצ֔וֹר וְ/אֶת עִנְּבֵ֥י נְזִירֶ֖/ךָ לֹ֣א תִבְצֹ֑ר שְׁנַ֥ת שַׁבָּת֖וֹן יִהְיֶ֥ה לָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/005.yaml
  text: You shall not reap the aftergrowth of your harvest[a], and you shall not gather the grapes of your unpruned vine[c][b]; it shall be a year of complete rest for the land.
translation:
  language: de
  text: Was nach deiner Ernte von selbst wächst[a], sollst du nicht abernten, und die Trauben deines unbeschnittenen Weinstocks[b] sollst du nicht lesen. Es soll ein Jahr völliger Ruhe[c] für das Land sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „den Nachwuchs deiner Ernte“; gemeint ist, was ohne neue Aussaat von selbst aufgeht.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich ist von dem „abgesonderten“ beziehungsweise sich selbst überlassenen Weinstock die Rede, der im Ruhejahr nicht beschnitten wird.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „ein Sabbatjahr“; das hebräische Wort bezeichnet eine besonders betonte Sabbatruhe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סְפִיחַ קְצִירְךָ
  choice: was nach deiner Ernte von selbst wächst
  rationale: סְפִיחַ bezeichnet hier den ohne neue Aussaat aufgegangenen Nachwuchs aus der vorigen Ernte. Die Formulierung gibt diesen Sinn in natürlichem modernem Deutsch wieder.
- source_word: תִקְצֹר
  choice: abernten
  rationale: Das Verb bezeichnet das Ernten beziehungsweise Mähen von Feldfrüchten. „Abernten“ passt zu dem spontan gewachsenen Ertrag und vermeidet die schwerfällige Wiederholung von „Ernte“.
- source_word: עִנְּבֵי נְזִירֶךָ
  choice: die Trauben deines unbeschnittenen Weinstocks
  rationale: נְזִירֶךָ bezeichnet in diesem landwirtschaftlichen Zusammenhang den während des Ruhejahres abgesondert beziehungsweise ungepflegt gelassenen Weinstock. „Unbeschnitten“ macht den konkreten Zustand verständlich, ohne eine Beziehung zum Nasiräergelübde einzutragen.
- source_word: תִבְצֹר
  choice: lesen
  rationale: „Trauben lesen“ ist die übliche präzise deutsche Wendung für das Einsammeln beziehungsweise Ernten von Trauben.
- source_word: שְׁנַת שַׁבָּתוֹן
  choice: ein Jahr völliger Ruhe
  rationale: שַׁבָּתוֹן bezeichnet eine besonders betonte Sabbatruhe. „Völlige Ruhe“ vermittelt diese Intensivierung verständlich und wahrt zugleich den Gedanken der Ruhe des Landes.
- source_word: לָאָרֶץ
  choice: für das Land
  rationale: Im Zusammenhang ist das bewirtschaftete Land gemeint, nicht die Erde im umfassenden Sinn.
theological_decisions:
- issue: Wiedergabe der Sabbatjahr-Terminologie ohne spätere lehrmäßige oder liturgische Festlegung
  choice: ein Jahr völliger Ruhe für das Land
  alternative: ein Sabbatjahr für das Land; ein Jahr feierlicher Ruhe für das Land
  rationale: Die Übersetzung macht sowohl den Sabbatruhe-Gedanken als auch die verstärkende Wirkung von שַׁבָּתוֹן sichtbar. Sie behandelt die Wendung nicht nur als Kalenderbezeichnung und fügt dem Text keine weitergehende Deutung hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die landwirtschaftlichen Verben sind konkret und allgemein verständlich; „Trauben lesen“ bewahrt den idiomatischen Fachgebrauch. Die Satzstruktur folgt dem hebräischen Verbotspaar und dem abschließenden Grundsatz.
