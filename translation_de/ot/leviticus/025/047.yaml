  text: וְ/כִ֣י תַשִּׂ֗יג יַ֣ד גֵּ֤ר וְ/תוֹשָׁב֙ עִמָּ֔/ךְ וּ/מָ֥ךְ אָחִ֖י/ךָ עִמּ֑/וֹ וְ/נִמְכַּ֗ר לְ/גֵ֤ר תּוֹשָׁב֙ עִמָּ֔/ךְ א֥וֹ לְ/עֵ֖קֶר מִשְׁפַּ֥חַת גֵּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/047.yaml
  text: If the means of a resident foreigner among you become sufficient[a], and your brother beside him becomes poor and sells himself to the resident foreigner among you, or to a member of the foreigner’s clan,
translation:
  language: de
  text: Wenn ein bei dir ansässiger Fremder zu Vermögen kommt, dein Bruder bei ihm aber verarmt und sich an den bei dir ansässigen Fremden oder an einen Angehörigen der Sippe eines Fremden verkauft,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Ausdruck ist schwer verständlich; wörtlicher etwa: »an den Wurzelstock/Spross der Familie eines Fremden«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַשִּׂיג יַד
  choice: zu Vermögen kommt
  rationale: Die Wendung bedeutet wörtlich, dass die »Hand« eines Menschen etwas erreicht, und bezeichnet hier ausreichende wirtschaftliche Mittel. »Zu Vermögen kommt« gibt diesen finanziellen Aufstieg natürlich und knapp wieder.
- source_word: גֵּר וְתוֹשָׁב
  choice: ein bei dir ansässiger Fremder
  rationale: גֵּר bezeichnet einen Fremden, der dauerhaft innerhalb der Gemeinschaft lebt; תוֹשָׁב betont seinen ansässigen Status. Die Formulierung wahrt sowohl Fremdheit als auch festen Wohnsitz, ohne die zusammengehörigen Begriffe künstlich auf zwei Personen zu verteilen.
- source_word: וּמָךְ
  choice: verarmt
  rationale: Das Verb beschreibt das Absinken in Armut. »Verarmt« ist im Deutschen präzise und idiomatisch.
- source_word: אָחִיךָ
  choice: dein Bruder
  rationale: Die wörtliche Verwandtschaftsbezeichnung bewahrt die soziale und ethische Kraft des Gesetzes; im Kontext ist ein israelitischer Volksgenosse gemeint.
- source_word: עִמּוֹ
  choice: bei ihm
  rationale: Die knappe Orts- beziehungsweise Beziehungsangabe bleibt bewusst offen und wird nicht einseitig als bloßer Vergleich oder räumliche Nähe festgelegt.
- source_word: וְנִמְכַּר
  choice: sich ... verkauft
  rationale: Die Niphalform kann formal passiv verstanden werden, bezeichnet im wirtschaftlichen Zusammenhang jedoch den Eintritt des Verarmten in ein Dienstverhältnis durch Selbstverkauf. Die reflexive Wiedergabe ist im Deutschen klar und kontextgemäß.
- source_word: לְגֵר תּוֹשָׁב עִמָּךְ
  choice: an den bei dir ansässigen Fremden
  rationale: Die Wiederholung derselben gesellschaftlichen Kategorie wird konsistent wiedergegeben; »bei dir« bewahrt die direkte Anrede des Hebräischen.
- source_word: לְעֵקֶר מִשְׁפַּחַת גֵּר
  choice: an einen Angehörigen der Sippe eines Fremden
  rationale: עֵקֶר ist hier ungewöhnlich und kann bildhaft einen Wurzelstock, Zweig oder Spross der Familiengruppe bezeichnen. »Angehörigen der Sippe« gibt den wahrscheinlich gemeinten Personenbezug verständlich wieder; die Unsicherheit wird in der Fußnote ausgewiesen.
theological_decisions:
- issue: Israelitische Verwandtschaftssprache im Sozialrecht
  choice: dein Bruder
  alternative: dein Volksgenosse / dein Verwandter
  rationale: »Bruder« bewahrt die Bundes- und Familienmetaphorik des Ausgangstextes, statt sie auf eine rein staatsbürgerliche Bezeichnung zu reduzieren.
- issue: Art des in וְנִמְכַּר beschriebenen Verkaufs
  choice: sich verkauft
  alternative: verkauft wird
  rationale: Der Kontext handelt von einem Verarmten, der sich in ein abhängiges Dienstverhältnis begibt. Die reflexive Formulierung macht diesen Zusammenhang verständlich, ohne die rechtliche Institution weiter auszudeuten.
- issue: Verhältnis von גֵּר und תוֹשָׁב
  choice: ein bei dir ansässiger Fremder
  alternative: ein Fremder oder Beisasse bei dir
  rationale: Die beiden Ausdrücke beschreiben hier wahrscheinlich gemeinsam den Status derselben Person. Die gewählte Form bewahrt beide Bedeutungsanteile, ohne zwei verschiedene Käufergruppen in den Text einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede. Der Satz bleibt als Bedingungssatz offen, da er im folgenden Vers fortgeführt wird. Die ungewöhnliche Wendung עִמּוֹ wird mit »bei ihm« bewusst nicht stärker erklärt; die schwierige Schlussformulierung wird im Haupttext idiomatisch und in der Fußnote näher am Bildwort wiedergegeben.
