  source_fidelity: Die Übersetzung gibt die wirtschaftliche Idiomatik von תַשִּׂיג יָד angemessen als „zu Vermögen kommt“ wieder und bewahrt die koordinierte Bedingung mit dem Verarmen des „Bruders“. „Bei dir ansässiger Fremder“ erfasst die zusammengehörige Statusbezeichnung גֵּר וְתוֹשָׁב natürlich und ausreichend genau. „Bei ihm“ lässt עִמּוֹ, dessen genaue Nuance nicht weiter bestimmt ist, angemessen offen. Die reflexive Wiedergabe von וְנִמְכַּר ist im rechtlich-wirtschaftlichen Kontext plausibel. Die schwierige Formulierung לְעֵקֶר מִשְׁפַּחַת גֵּר wird verständlich wiedergegeben und durch die Fußnote als unsicher markiert.
