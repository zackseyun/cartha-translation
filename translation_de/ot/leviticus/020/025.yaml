  terminology: „Rein/unrein“ bewahrt korrekt die levitischen Kultkategorien. „Abschaulich“ unterscheidet das Wortfeld von שׁקץ sinnvoll von טמא. „Vogel“, „Tier“ und „Erdboden“ sind kontextgerecht. Die Fußnoten erklären נֶפֶשׁ und das von טמא abweichende Bedeutungsfeld von שׁקץ sachgerecht; ihre Anker stehen bei den jeweils erläuterten Ausdrücken.
