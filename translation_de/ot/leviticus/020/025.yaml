  source_fidelity: Die Übersetzung gibt die hebräische Aufforderung zur Unterscheidung der kultisch reinen und unreinen Tiere sowie das Verbot, sich durch Tiere, Vögel oder am Boden kriechende Lebewesen abscheulich zu machen, zuverlässig wieder. „Für euch als unrein ausgesondert“ vermittelt die klassifizierende Funktion von לְטַמֵּא angemessen.
