id: LEV.20.25
reference: Leviticus 20:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הִבְדַּלְתֶּ֞ם בֵּֽין הַ/בְּהֵמָ֤ה הַ/טְּהֹרָה֙ לַ/טְּמֵאָ֔ה וּ/בֵין הָ/ע֥וֹף הַ/טָּמֵ֖א לַ/טָּהֹ֑ר וְ/לֹֽא תְשַׁקְּצ֨וּ אֶת נַפְשֹֽׁתֵי/כֶ֜ם בַּ/בְּהֵמָ֣ה וּ/בָ/ע֗וֹף וּ/בְ/כֹל֙ אֲשֶׁ֣ר תִּרְמֹ֣שׂ הָֽ/אֲדָמָ֔ה אֲשֶׁר הִבְדַּ֥לְתִּי לָ/כֶ֖ם לְ/טַמֵּֽא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/025.yaml
  text: So you shall distinguish between the clean animal and the unclean[a], and between the unclean bird and the clean; and you shall not make yourselves detestable by the animal or by the bird or by anything that creeps on the ground[b], which I have set apart for you as unclean.
translation:
  language: de
  text: Darum sollt ihr zwischen dem reinen und dem unreinen Tier unterscheiden und zwischen dem unreinen und dem reinen Vogel. Macht euch nicht selbst[a] abscheulich[b] durch ein Tier, einen Vogel oder irgendetwas, das auf dem Erdboden kriecht und das ich für euch als unrein ausgesondert habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „eure Seelen“ oder „eure Personen“; gemeint ist hier: „euch selbst“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „verabscheuungswürdig“. Das hebräische Verb gehört zum Bedeutungsfeld von „abscheulich“ und „verhasst“, nicht zum üblichen Wortfeld für „unrein werden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִבְדַּלְתֶּם
  choice: Darum sollt ihr … unterscheiden
  rationale: Der Hifil von בדל bezeichnet hier das Unterscheiden beziehungsweise Auseinanderhalten von Kategorien. „Darum“ gibt den Anschluss an den Kontext natürlich wieder.
- source_word: הַבְּהֵמָה
  choice: Tier
  rationale: Der Ausdruck bezeichnet hier allgemein ein Landtier; „Vieh“ wäre zu eng und „Bestie“ im modernen Deutsch irreführend.
- source_word: הַטְּהֹרָה / הַטְּמֵאָה / הַטָּמֵא / הַטָּהֹר
  choice: rein / unrein
  rationale: Diese Wörter bewahren die kultischen Kategorien des Levitikus, ohne sie zu moralischen oder hygienischen Begriffen umzudeuten.
- source_word: הָעוֹף
  choice: Vogel
  rationale: Im Speisekontext ist „Vogel“ die natürliche deutsche Wiedergabe, auch wenn das hebräische Wort grundsätzlich weiter gefasst sein kann.
- source_word: וְלֹא תְשַׁקְּצוּ
  choice: Macht … nicht … abscheulich
  rationale: Die Wiedergabe wahrt das Bedeutungsfeld von Abscheu und Verabscheuungswürdigkeit und vermeidet eine Vermischung mit dem im Vers gesondert verwendeten Begriff „unrein“.
- source_word: אֶת נַפְשֹׁתֵיכֶם
  choice: euch selbst
  rationale: נפשׁ bezeichnet in dieser Wendung die betreffenden Personen selbst; „eure Seelen“ könnte im Deutschen eine vom Körper getrennte innere Substanz nahelegen.
- source_word: בַּבְּהֵמָה וּבָעוֹף
  choice: durch ein Tier, einen Vogel
  rationale: Die Präposition bezeichnet hier das Mittel beziehungsweise den Anlass, durch den Israel sich abscheulich machen würde.
- source_word: וּבְכֹל אֲשֶׁר תִּרְמֹשׂ הָאֲדָמָה
  choice: oder irgendetwas, das auf dem Erdboden kriecht
  rationale: „Kriecht“ gibt die Bewegung nahe am Boden anschaulich und verständlich wieder, ohne die besondere Nuance eines anderen hebräischen Wortes für „wimmeln“ einzutragen.
- source_word: אֲשֶׁר הִבְדַּלְתִּי לָכֶם לְטַמֵּא
  choice: das ich für euch als unrein ausgesondert habe
  rationale: „Ausgesondert“ greift dieselbe Wurzel בדל auf; „als unrein“ vermittelt den Sinn einer göttlich festgelegten Kategorie.
theological_decisions:
- issue: Kultische Kategorie oder moralische Wertung bei טהר/טמא
  choice: rein/unrein als kultische Kategorien
  alternative: rein/unrein als allgemeines moralisches oder hygienisches Urteil
  rationale: Der Zusammenhang betrifft die Israel gebotene Unterscheidung von Tieren im Rahmen der Heiligkeits- und Speisevorschriften. Die Übersetzung lässt diese bundesbezogene Kategorie bestehen.
- issue: Bedeutung von נֶפֶשׁ in אֶת נַפְשֹׁתֵיכֶם
  choice: 'die ganzen Personen: „euch selbst“'
  alternative: „eure Seelen“
  rationale: Die idiomatische Verwendung bezeichnet hier die Menschen selbst und verlangt keine dualistische Aussage über eine vom Körper getrennte Seele.
- issue: Verhältnis von שׁקץ und טמא
  choice: „abscheulich“ wird von „unrein“ lexikalisch unterschieden
  alternative: beide Begriffe mit Sprache der Verunreinigung wiedergeben
  rationale: Der hebräische Text verwendet zwei verschiedene Bedeutungsfelder. Ihre Unterscheidung bewahrt die Spannung zwischen Abscheu und kultischer Unreinheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt eng am Hebräischen, während „Darum“, „euch selbst“ und die nominalen Ergänzungen natürlich deutsch formuliert sind. Die kultischen Schlüsselbegriffe „rein“ und „unrein“ werden konsequent beibehalten.
