source:
  edition: WLC
  text: וְ/אִ֡ם הַעְלֵ֣ם יַעְלִימֽוּ֩ עַ֨ם הָ/אָ֜רֶץ אֶת עֵֽינֵי/הֶם֙ מִן הָ/אִ֣ישׁ הַ/ה֔וּא בְּ/תִתּ֥/וֹ מִ/זַּרְע֖/וֹ לַ/מֹּ֑לֶךְ לְ/בִלְתִּ֖י הָמִ֥ית אֹתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/004.yaml
  text: But if the people of the land deliberately close their eyes to that man when he gives some of his offspring to Molech[a], so as not to put him to death[c][b],
translation:
  language: de
  text: Wenn aber das Volk des Landes bewusst die Augen vor jenem Mann verschließt, wenn er eines seiner Kinder dem Moloch[a] gibt, um ihn nicht zu töten,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dem König«. »Moloch« kann einen Gott oder möglicherweise die Bezeichnung eines Opferritus meinen.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַעְלֵם יַעְלִימוּ
  choice: bewusst die Augen verschließt
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt die Aussage. Zusammen mit »ihre Augen« bezeichnet sie ein bewusstes Wegsehen; die deutsche Wendung bewahrt Bild und Nachdruck natürlich.
- source_word: עַם הָאָרֶץ
  choice: das Volk des Landes
  rationale: In diesem Rechtszusammenhang ist die Bevölkerung beziehungsweise Gemeinschaft des Landes gemeint, nicht eine bestimmte soziale Schicht.
- source_word: מִן הָאִישׁ הַהוּא
  choice: vor jenem Mann
  rationale: Die Präposition מן gehört zur hebräischen Wendung »die Augen vor jemandem verbergen«. »Vor jenem Mann die Augen verschließen« ist im Deutschen idiomatisch und bleibt dem Bild eng verbunden.
- source_word: בְּתִתּוֹ מִזַּרְעוֹ
  choice: wenn er eines seiner Kinder gibt
  rationale: מן ist hier partitiv. זֶרַע bedeutet wörtlich »Same«, bezeichnet in diesem Zusammenhang jedoch die Nachkommenschaft; »eines seiner Kinder« gibt Sinn und Teilmenge klar wieder.
- source_word: לַמֹּלֶךְ
  choice: dem Moloch
  rationale: Im kultischen Zusammenhang von Levitikus 18 und 20 wird die Form am besten als Name oder Bezeichnung des Empfängers verstanden und konventionell mit »Moloch« wiedergegeben.
- source_word: לְבִלְתִּי הָמִית אֹתוֹ
  choice: und ihn nicht tötet
  rationale: Die Konstruktion bezeichnet das unterlassene Vollstrecken der vorgeschriebenen Todesstrafe. Die knappe Wiedergabe erhält den syntaktischen Anschluss des noch unvollständigen Bedingungssatzes.
theological_decisions:
- issue: Deutung von לַמֹּלֶךְ
  choice: dem Moloch
  alternative: dem König
  rationale: Der unmittelbare Zusammenhang in Levitikus 20,2–5 stützt deutlich die traditionelle Lesung als Name oder kultische Bezeichnung. Die Fußnote hält die sprachlich mögliche Alternativlesung offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das hebräische Bild des bewussten Wegsehens bleibt erhalten. Der Vers endet mit einem Komma, weil der Bedingungssatz in Vers 5 fortgesetzt wird.
