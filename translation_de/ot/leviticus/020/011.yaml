source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֤ר יִשְׁכַּב֙ אֶת אֵ֣שֶׁת אָבִ֔י/ו עֶרְוַ֥ת אָבִ֖י/ו גִּלָּ֑ה מֽוֹת יוּמְת֥וּ שְׁנֵי/הֶ֖ם דְּמֵי/הֶ֥ם בָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/011.yaml
  text: If a man lies with his father's wife[a], he has uncovered his father's nakedness; both of them shall surely be put to death[b]; their blood is on them.
translation:
  language: de
  text: Wenn ein Mann mit der Frau seines Vaters schläft, hat er die Blöße seines Vaters aufgedeckt. Beide müssen unbedingt getötet werden; ihr Blut sei auf ihnen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Rechtsformel „ihr Blut sei auf ihnen“ bedeutet, dass sie selbst die Verantwortung für ihren Tod tragen.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: Wenn ein Mann
  rationale: Die Verbindung leitet hier einen kasuistischen Rechtsfall ein. „Wenn ein Mann“ gibt die bedingte Rechtsform im modernen Deutschen natürlich wieder und bewahrt das ausdrücklich männliche Rechtssubjekt.
- source_word: יִשְׁכַּב אֶת
  choice: mit … schläft
  rationale: שׁכב bezeichnet mit direktem Objekt in diesem sexualrechtlichen Zusammenhang den Geschlechtsverkehr. Die deutsche Wendung ist verständlich, würdig und weniger klinisch als eine explizite Umschreibung.
- source_word: אֵשֶׁת אָבִיו
  choice: die Frau seines Vaters
  rationale: Dies entspricht dem hebräischen Wortlaut. „Stiefmutter“ wäre enger und würde eine Verwandtschaftsbezeichnung einführen, die im Text nicht steht.
- source_word: עֶרְוַת אָבִיו גִּלָּה
  choice: hat er die Blöße seines Vaters aufgedeckt
  rationale: Die feste levitische Wendung wird bewahrt, damit ihre rechtliche Bildsprache und die Verbindung zu Levitikus 18 und 20 erhalten bleiben. Das Perfekt bezeichnet die vollzogene Tat als Grund des Urteils.
- source_word: מוֹת יוּמְתוּ
  choice: müssen mit dem Tod bestraft werden
  rationale: Infinitivus absolutus und finites Verb verstärken die bestimmte Todesstrafe. Die Formulierung wahrt Nachdruck und Rechtscharakter, ohne eine Hinrichtungsart festzulegen.
- source_word: שְׁנֵיהֶם
  choice: Beide
  rationale: Die ausdrückliche Einbeziehung beider Beteiligten bleibt knapp und deutlich erhalten.
- source_word: דְּמֵיהֶם בָּם
  choice: ihr Blut liegt auf ihnen
  rationale: Die hebräische Rechtsformel wird bildhaft wiedergegeben und durch eine Fußnote erläutert; sie weist den Betroffenen selbst die Verantwortung für ihren Tod zu.
theological_decisions:
- issue: Wiedergabe der sexualrechtlichen Wendung und ihrer kanonischen Bezüge
  choice: hat er die Blöße seines Vaters aufgedeckt
  alternative: hat er seinen Vater sexuell entehrt
  rationale: Die bildhafte feste Wendung des Heiligkeitsgesetzes bleibt erhalten. Eine rein deutende Wiedergabe würde ihre intertextuelle Verbindung und ihre bewusst indirekte Ausdrucksweise einebnen.
- issue: Geschlecht des Rechtssubjekts
  choice: Wenn ein Mann
  alternative: Wenn jemand
  rationale: Das Hebräische nennt ausdrücklich einen Mann und beschreibt einen männlichen Täter. Eine geschlechtsneutrale Form würde den konkreten Wortlaut verallgemeinern.
- issue: Verantwortung in der Schlussformel
  choice: ihr Blut liegt auf ihnen
  alternative: sie tragen selbst die Verantwortung für ihren Tod
  rationale: Die Übersetzung bewahrt die theologisch und rechtlich gewichtige Blutmetaphorik, während die Fußnote ihre Funktion erklärt, ohne sie im Haupttext auszulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit rechtlichem Ernst. Die feste Wendung „die Blöße … aufdecken“ bleibt zur Wahrung der levitischen Bildsprache erhalten. Nur die für heutige Leser weniger unmittelbar verständliche Schlussformel wird in einer Fußnote erläutert.
