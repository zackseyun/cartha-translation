source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֨ר יִקַּ֧ח אֶת אִשָּׁ֛ה וְ/אֶת אִמָּ֖/הּ זִמָּ֣ה הִ֑וא בָּ/אֵ֞שׁ יִשְׂרְפ֤וּ אֹת/וֹ֙ וְ/אֶתְ/הֶ֔ן וְ/לֹא תִהְיֶ֥ה זִמָּ֖ה בְּ/תוֹכְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/014.yaml
  text: If a man takes a woman and her mother[a], it is depravity. They shall burn him and them with fire[c][b], so that there will not be depravity among you.
translation:
  language: de
  text: Wenn ein Mann eine Frau und ihre Mutter nimmt[a], ist das eine Schandtat[b]. Man soll ihn und die beiden Frauen[c] mit Feuer verbrennen, damit es unter euch keine solche Schandtat gibt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „heiratet eine Frau und ihre Mutter“. Das hebräische Verb bedeutet wörtlich „nimmt“ und kann in rechtlichen Zusammenhängen eine Eheschließung bezeichnen; hier wird eine Ehe jedoch nicht ausdrücklich genannt.'
    reason: lexical_alternative
  - marker: b
    text: 'Das hebräische Wort bezeichnet ein schweres sexuelles Vergehen; auch möglich: „Schändlichkeit“, „Unzucht“ oder „empörende Tat“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „ihn und sie“; die feminine Pluralform bezieht sich auf die Frau und ihre Mutter.'
    reason: referent_clarification
lexical_decisions:
- source_word: אִישׁ
  choice: ein Mann
  rationale: Das hebräische Substantiv ist maskulin Singular und bezeichnet in diesem Gesetz den beteiligten Mann.
- source_word: יִקַּח
  choice: nimmt
  rationale: לקח bedeutet wörtlich „nehmen“ und kann in rechtlichen Zusammenhängen die Ehe oder eine sexuelle Verbindung bezeichnen. „Nimmt“ bewahrt die Offenheit des Ausgangstextes; die mögliche Bedeutung „heiratet“ wird in der Fußnote genannt.
- source_word: אִשָּׁה
  choice: eine Frau
  rationale: אִשָּׁה kann „Frau“ oder „Ehefrau“ bedeuten. Die allgemeinere Wiedergabe vermeidet es, den nicht ausdrücklich bezeichneten Familienstand festzulegen.
- source_word: אִמָּהּ
  choice: ihre Mutter
  rationale: Die Possessivform bezieht die Mutter eindeutig auf die zuvor genannte Frau.
- source_word: זִמָּה
  choice: Schandtat
  rationale: זִמָּה bezeichnet hier ein schweres, empörendes sexuelles Vergehen. „Schandtat“ gibt die starke moralische Wertung würdig und verständlich wieder, ohne die Bedeutung unnötig zu verengen.
- source_word: בָּאֵשׁ
  choice: im Feuer
  rationale: Die Wendung bezeichnet die Vollstreckung durch Feuer. „Im Feuer verbrennen“ ist im Deutschen natürlich und quellennah.
- source_word: יִשְׂרְפוּ אֹתוֹ וְאֶתְהֶן
  choice: Man soll ihn und die beiden Frauen im Feuer verbrennen
  rationale: Das aktive Verb im Plural wird durch das unpersönliche deutsche „man“ natürlich wiedergegeben, ohne nicht genannte Vollstrecker festzulegen. Das feminine Pluralpronomen wird zur Klarheit als „die beiden Frauen“ ausgedrückt.
- source_word: וְלֹא תִהְיֶה זִמָּה בְּתוֹכְכֶם
  choice: damit es unter euch keine solche Schandtat gibt
  rationale: „Damit“ bringt die Zweck- beziehungsweise Folgebeziehung natürlich zum Ausdruck. „Solche“ verweist idiomatisch auf die unmittelbar genannte Tat.
theological_decisions:
- issue: Art der durch „eine Frau und ihre Mutter nehmen“ bezeichneten Beziehung
  choice: Die breite Formulierung „nimmt“ bleibt im Haupttext erhalten.
  alternative: „heiratet eine Frau und ihre Mutter“
  rationale: לקח kann im rechtlichen Kontext Heirat einschließen, nennt sie hier aber nicht ausdrücklich. Die Übersetzung bewahrt deshalb die echte lexikalische Offenheit.
- issue: Wiedergabe der Strafbestimmung
  choice: 'Aktive Rechtsformulierung mit unpersönlichem Subjekt: „Man soll ihn und die beiden Frauen im Feuer verbrennen.“'
  alternative: „Er und die beiden Frauen sollen im Feuer verbrannt werden.“
  rationale: So bleibt der aktive Charakter des hebräischen Verbs erhalten, ohne bestimmte, im Text nicht genannte Vollstrecker hinzuzufügen.
- issue: Referenz des femininen Pluralpronomens וְאֶתְהֶן
  choice: „die beiden Frauen“
  alternative: „sie“
  rationale: Die feminine Pluralform bezieht sich grammatisch auf die Frau und ihre Mutter. Die explizite deutsche Wiedergabe verhindert ein missverständliches Pronomen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Rechtsformulierung bleibt knapp und direkt. „Schandtat“ vermeidet sowohl einen veralteten Fachausdruck als auch eine zu abstrakte psychologische Deutung; „die beiden Frauen“ macht den grammatischen Bezug des hebräischen Pronomens transparent.
