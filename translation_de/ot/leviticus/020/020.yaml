id: LEV.20.20
reference: Leviticus 20:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֤ר יִשְׁכַּב֙ אֶת דֹּ֣דָת֔/וֹ עֶרְוַ֥ת דֹּד֖/וֹ גִּלָּ֑ה חֶטְאָ֥/ם יִשָּׂ֖אוּ עֲרִירִ֥ים יָמֻֽתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/020.yaml
  text: If a man lies with his aunt[a], he has uncovered his uncle’s nakedness. They shall bear their sin[b]; they shall die childless.
translation:
  language: de
  text: Wenn ein Mann mit der Frau seines Onkels schläft, hat er die Blöße seines Onkels aufgedeckt.[a] Beide müssen ihre Sünde tragen;[b] sie werden kinderlos sterben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Die Blöße seines Onkels hat er aufgedeckt.“ Das ist eine levitische Wendung für die Verletzung eines verbotenen sexuellen Verwandtschaftsverhältnisses durch den Verkehr mit der Frau des Onkels.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „Beide müssen ihre Schuld tragen.“ Der hebräische Ausdruck kann sowohl die Sünde als auch die dafür zu tragende Schuld bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: Wenn ein Mann
  rationale: Die einleitende Formulierung führt einen weiteren Rechtsfall ein. „Wenn ein Mann“ gibt die kasuistische Struktur und das grammatische Geschlecht präzise wieder.
- source_word: יִשְׁכַּב אֶת
  choice: mit … schläft
  rationale: Das Verb ist hier ein geläufiger Ausdruck für Geschlechtsverkehr. Die deutsche Wendung bewahrt das Bild und ist zugleich natürlich verständlich.
- source_word: דֹּדָתוֹ
  choice: die Frau seines Onkels
  rationale: Das hebräische Wort bezeichnet speziell die angeheiratete Tante, also die Frau des Onkels. Die ausdrückliche Wiedergabe macht den im folgenden Satz genannten Verwandtschaftsbezug klar.
- source_word: עֶרְוַת דֹּדוֹ גִּלָּה
  choice: hat er die Blöße seines Onkels aufgedeckt
  rationale: Die feste levitische Wendung wird bewahrt, statt ihre bildhafte und rechtlich-verwandtschaftliche Aussage durch eine bloße Paraphrase zu ersetzen.
- source_word: חֶטְאָם יִשָּׂאוּ
  choice: Beide müssen ihre Sünde tragen
  rationale: Die Pluralformen beziehen beide Beteiligten ein. חטא kann sowohl die Sünde als auch die daraus erwachsende Schuld bezeichnen; „ihre Sünde tragen“ bleibt nahe am hebräischen Ausdruck.
- source_word: עֲרִירִים יָמֻתוּ
  choice: sie werden kinderlos sterben
  rationale: Die knappe Verbindung der beiden Prädikate bleibt erhalten, ohne den Zeitpunkt oder die konkrete Art der Sanktion näher festzulegen.
theological_decisions:
- issue: Bedeutung der Sanktion עֲרִירִים יָמֻתוּ
  choice: sie werden kinderlos sterben
  alternative: sie werden ohne Kinder sterben / ohne Nachkommen bleiben und sterben
  rationale: Der hebräische Text nennt nur den Ausgang beziehungsweise Zustand, nicht den Mechanismus der Strafe. Die gewählte Formulierung bewahrt diese Offenheit.
- issue: Bedeutung von חֶטְאָם in der Wendung חֶטְאָם יִשָּׂאוּ
  choice: ihre Sünde tragen
  alternative: ihre Schuld tragen
  rationale: Das Substantiv kann die sündige Tat oder die daraus folgende Schuld beziehungsweise Haftung bezeichnen. Der Haupttext folgt der formnahen Wiedergabe; die Alternative wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der kasuistische Rechtsstil und die charakteristische levitische Bildsprache bleiben erhalten; erklärungsbedürftige Idiome und echte lexikalische Mehrdeutigkeit werden durch Fußnoten erschlossen.
