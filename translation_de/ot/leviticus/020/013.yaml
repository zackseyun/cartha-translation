source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֨ר יִשְׁכַּ֤ב אֶת זָכָר֙ מִשְׁכְּבֵ֣י אִשָּׁ֔ה תּוֹעֵבָ֥ה עָשׂ֖וּ שְׁנֵי/הֶ֑ם מ֥וֹת יוּמָ֖תוּ דְּמֵי/הֶ֥ם בָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/013.yaml
  text: If a man lies with a male as one lies with a woman[a], both of them have done an abomination; they shall surely be put to death[b]; their blood is on them.
translation:
  language: de
  text: Wenn ein Mann bei einem Mann liegt, wie bei einer Frau liegt,[a] haben beide einen Gräuel verübt. Sie müssen unbedingt getötet werden;[b] ihr Blut lastet auf ihnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Beilager einer Frau“; eine hebräische Umschreibung für Geschlechtsverkehr mit einer Frau.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Ihre Blutschuld liegt auf ihnen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: Wenn ein Mann
  rationale: Die Konstruktion leitet im Zusammenhang eine kasuistische Rechtsbestimmung ein. „Wenn ein Mann“ gibt den bedingten Sinn im heutigen Deutschen natürlich wieder.
- source_word: יִשְׁכַּב אֶת
  choice: bei … liegt
  rationale: שׁכב mit אֶת bezeichnet hier den Geschlechtsverkehr. Die Wendung bleibt dem hebräischen Bild nahe und ist im Kontext verständlich.
- source_word: זָכָר
  choice: einem männlichen Menschen
  rationale: זָכָר bedeutet „männlich/Männlicher“ und unterscheidet sich von אִישׁ („Mann“). „Männlicher Mensch“ bewahrt diese lexikalische Unterscheidung, ohne eine moderne Identitätskategorie einzuführen.
- source_word: מִשְׁכְּבֵי אִשָּׁה
  choice: wie man bei einer Frau liegt
  rationale: Der wörtliche Plural „die Lager einer Frau“ ist im Deutschen unnatürlich; die Formulierung gibt die hebräische Umschreibung für Geschlechtsverkehr verständlich wieder.
- source_word: תּוֹעֵבָה
  choice: etwas Abscheuliches
  rationale: תּוֹעֵבָה bezeichnet etwas entschieden Verabscheutes beziehungsweise Verwerfliches. „Etwas Abscheuliches“ erhält das starke moralisch-kultische Gewicht in natürlichem Deutsch.
- source_word: עָשׂוּ שְׁנֵיהֶם
  choice: haben beide … getan
  rationale: Die Wiedergabe bewahrt die ausdrückliche Einbeziehung beider Beteiligten.
- source_word: מוֹת יוּמָתוּ
  choice: Sie müssen mit dem Tod bestraft werden
  rationale: Infinitivus absolutus plus passive Verbform verstärkt die bestimmte Todesstrafe. Die deutsche Formulierung gibt sowohl den Nachdruck als auch das Passiv wieder.
- source_word: דְּמֵיהֶם בָּם
  choice: ihr Blut ist auf ihnen
  rationale: Die formnahe Wiedergabe bewahrt die knappe Rechtsformel und ihre mögliche Bedeutungsbreite zwischen Verantwortung für den eigenen Tod und Blutschuld.
theological_decisions:
- issue: Wiedergabe eines moralisch und gesellschaftlich umstrittenen Rechtsgebots
  choice: Die konkrete, im Hebräischen beschriebene Handlung und die dort genannte Strafe werden ohne Abschwächung oder Erweiterung wiedergegeben.
  alternative: Moderne Oberbegriffe wie „Homosexualität“ oder identitätsbezogene Bezeichnungen zu verwenden.
  rationale: Der Ausgangstext formuliert ein Recht über eine Handlung, nicht über eine moderne sexuelle Identität. Die Übersetzung darf weder den Gegenstandsbereich ausweiten noch ihn durch gegenwärtige Kategorien neu bestimmen.
- issue: Unterscheidung der männlichen Bezeichnungen
  choice: אִישׁ wird mit „Mann“, זָכָר mit „männlicher Mensch“ wiedergegeben.
  alternative: Beide Wörter mit „Mann“ wiederzugeben.
  rationale: Die unterschiedliche Wortwahl des Hebräischen ist sachlich relevant und sollte erhalten bleiben, auch wenn die deutsche Formulierung dadurch markierter klingt.
- issue: Bedeutung von דְּמֵיהֶם בָּם
  choice: Die bildhafte Formel „ihr Blut ist auf ihnen“ bleibt im Haupttext stehen.
  alternative: Eindeutig auszulegen als „sie tragen selbst die Verantwortung für ihren Tod“ oder „ihre Blutschuld lastet auf ihnen“.
  rationale: Die hebräische Wendung bündelt rechtliche Verantwortlichkeit und Blutschuld. Eine eindeutige Paraphrase würde diese Spannung vorschnell auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Rechtsbestimmung bleibt knapp und bestimmt. Das ungewöhnlichere „männlicher Mensch“ dient dazu, die hebräische Unterscheidung zwischen אִישׁ und זָכָר sichtbar zu halten; die Fußnoten erklären idiomatische beziehungsweise mehrdeutige Formulierungen.
