source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֨ר יִתֵּ֧ן שְׁכָבְתּ֛/וֹ בִּ/בְהֵמָ֖ה מ֣וֹת יוּמָ֑ת וְ/אֶת הַ/בְּהֵמָ֖ה תַּהֲרֹֽגוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/015.yaml
  text: If a man has sexual intercourse with an animal, he must surely be put to death, and you shall kill the animal.
translation:
  language: de
  text: Wenn ein Mann mit einem Tier Geschlechtsverkehr hat[a], muss er unbedingt getötet werden; und das Tier sollt ihr töten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „er gibt sein Liegen bei einem Tier“; eine hebräische Wendung für Geschlechtsverkehr.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: ein Mann
  rationale: Das Substantiv ist männlich Singular und bezeichnet hier ausdrücklich einen männlichen Täter; der folgende Vers behandelt gesondert den Fall einer Frau.
- source_word: אֲשֶׁר
  choice: wenn
  rationale: Die Relativpartikel hat in dieser kasuistischen Rechtsform bedingende Funktion; „wenn“ ist im Deutschen natürlich und sachgerecht.
- source_word: יִתֵּן שְׁכָבְתּוֹ
  choice: Geschlechtsverkehr hat
  rationale: Die wörtliche Wendung „sein Liegen geben“ ist ein hebräischer Ausdruck für den sexuellen Verkehr. Die gewählte Formulierung gibt den Sinn klar, würdig und unmissverständlich wieder.
- source_word: בִּבְהֵמָה
  choice: mit einem Tier
  rationale: בְּהֵמָה bezeichnet hier ein Tier; „Tier“ ist die natürliche moderne deutsche Entsprechung.
- source_word: מוֹת יוּמָת
  choice: muss er mit dem Tod bestraft werden
  rationale: Infinitivus absolutus und finite Verbform drücken eine nachdrückliche, verbindliche Todesstrafe aus. Die passive Form bewahrt den Rechtscharakter.
- source_word: וְאֶת־הַבְּהֵמָה תַּהֲרֹגוּ
  choice: und das Tier sollt ihr töten
  rationale: Die Verbform steht in der zweiten Person Plural und richtet sich an die angesprochene Gemeinschaft beziehungsweise ihre zuständigen Vollstrecker; „töten“ entspricht dem schlichten Wortsinn.
theological_decisions:
- issue: Geschlechtsspezifische Bezeichnung des Täters
  choice: „ein Mann“
  alternative: „jemand“ oder „eine Person“
  rationale: Der hebräische Text nennt hier ausdrücklich einen Mann, während der folgende Vers den Fall einer Frau gesondert regelt. Eine geschlechtsneutrale Wiedergabe würde diese Struktur verwischen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Rechtssprache. Die sexuelle Handlung wird ohne beschönigende Unklarheit, aber sachlich benannt. Das Semikolon hält Strafbestimmung und Anweisung zur Tötung des Tieres eng zusammen.
