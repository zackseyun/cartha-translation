  text: וְ/אִשָּׁ֗ה אֲשֶׁ֨ר תִּקְרַ֤ב אֶל כָּל בְּהֵמָה֙ לְ/רִבְעָ֣ה אֹתָ֔/הּ וְ/הָרַגְתָּ֥ אֶת הָ/אִשָּׁ֖ה וְ/אֶת הַ/בְּהֵמָ֑ה מ֥וֹת יוּמָ֖תוּ דְּמֵי/הֶ֥ם בָּֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/016.yaml
  text: If a woman approaches any animal to mate with it[a], you shall kill the woman and the animal. They shall surely be put to death[b]; their blood is on them.
translation:
  language: de
  text: Wenn eine Frau sich irgendeinem Tier nähert, um mit ihm Geschlechtsverkehr zu haben[a], sollst du die Frau und das Tier töten. Sie sollen unbedingt getötet werden; ihr Blut ist auf ihnen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »damit es sie besteigt«. Das hebräische Verb bezeichnet hier ausdrücklich den Geschlechtsverkehr und hat wörtlich mit dem Besteigen zu tun.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder sinngemäß: »Die Verantwortung für ihren Tod liegt bei ihnen selbst.« Die hebräische Wendung kann auch mit »Ihre Blutschuld liegt auf ihnen« wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקְרַב
  choice: sich … nähert
  rationale: Das Verb קרב bedeutet konkret »sich nähern/herantreten«. Die sexuelle Absicht wird erst durch den folgenden Infinitiv angegeben und daher nicht schon in das Verb hineingelesen.
- source_word: כָּל בְּהֵמָה
  choice: irgendeinem Tier
  rationale: בְּהֵמָה bezeichnet hier allgemein ein Tier; כָּל verleiht der Bestimmung umfassende Geltung. »Irgendeinem Tier« ist im Deutschen natürlich und eindeutig.
- source_word: לְרִבְעָה אֹתָהּ
  choice: um sich mit ihm zu paaren
  rationale: רבע bezeichnet in diesem Zusammenhang ausdrücklich den sexuellen Verkehr mit einem Tier und hat als Grundvorstellung das Besteigen. Die gewählte Formulierung ist für heutige Leser klar, ohne unnötig drastisch oder verschleiernd zu sein; die bildhaftere Alternative wird in der Fußnote bewahrt.
- source_word: וְהָרַגְתָּ
  choice: sollst du … töten
  rationale: Die Verbform hat im Gesetzestext anweisende Kraft. »Sollst du« wahrt den verbindlichen Rechtsstil und die direkte Anrede im Singular.
- source_word: מוֹת יוּמָתוּ
  choice: Beide müssen unbedingt getötet werden
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt die Todesformel. »Müssen unbedingt« gibt diese Hervorhebung wieder; »beide« macht den pluralischen Rückbezug auf Frau und Tier im Deutschen deutlich.
- source_word: דְּמֵיהֶם בָּם
  choice: ihr Blut ist auf ihnen
  rationale: Die Wiedergabe erhält das hebräische Blutbild und dessen Aussage, dass die Betroffenen die Verantwortung für ihren Tod selbst tragen. Eine Fußnote erklärt die im Deutschen ungewohnte Rechtswendung.
theological_decisions:
- issue: Direkte Wiedergabe einer schweren Rechtsbestimmung über sexuellen Verkehr mit einem Tier
  choice: Die Handlung und die angeordnete Todesstrafe werden ohne beschönigende Zusätze klar wiedergegeben.
  alternative: Eine verhüllende Formulierung wie »bei ihm liegen« oder eine ausdeutende Umschreibung wie »sexuelle Beziehungen haben« verwenden.
  rationale: Der hebräische Gesetzestext benennt sowohl die Handlung als auch die Sanktion knapp und bestimmt. Die Übersetzung bewahrt diese Schärfe, ohne zusätzliche moralische oder konfessionelle Deutungen einzutragen.
- issue: Bedeutung der Blutformel דְּמֵיהֶם בָּם
  choice: Das Bild »ihr Blut ist auf ihnen« wird im Haupttext bewahrt und in einer Fußnote erklärt.
  alternative: 'Im Haupttext vollständig ausdeuten: »Sie sind selbst an ihrem Tod schuld.«'
  rationale: Die bildhafte Rechtsformel verbindet Todeshaftung und Eigenverantwortung. Ihre Bewahrung lässt die theologische und rechtliche Spannung des Ausgangstextes stehen, während die Fußnote das Verständnis sichert.
translation_notes:
  register: Moderner, würdiger Gesetzesstil mit direkter Anrede. Die Formulierung ist deutlich, aber nicht sensationsheischend. Die hebräische Intensivierung der Todesformel und die bildhafte Blutwendung bleiben erkennbar.
