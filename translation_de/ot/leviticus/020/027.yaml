  rationale: Die Revision verwendet für den Rechtskontext natürliche deutsche Personenbezeichnungen und wahrt die lexikalische Unsicherheit zu den spiritistischen Begriffen in einer Fußnote. Die rechtliche Verstärkung und die formelhafte Zuweisung der Verantwortung bleiben erhalten. Die Relativkonstruktion fasst „Mann oder Frau“ als Paar mit jeweils möglicher Tätigkeit auf.
