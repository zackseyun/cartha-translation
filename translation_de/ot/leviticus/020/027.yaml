  text: וְ/אִ֣ישׁ אֽוֹ אִשָּׁ֗ה כִּֽי יִהְיֶ֨ה בָ/הֶ֥ם א֛וֹב א֥וֹ יִדְּעֹנִ֖י מ֣וֹת יוּמָ֑תוּ בָּ/אֶ֛בֶן יִרְגְּמ֥וּ אֹתָ֖/ם דְּמֵי/הֶ֥ם בָּֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/027.yaml
  text: And a man or a woman[a], if there is in them a medium or a spiritist, shall surely be put to death; they shall stone them with stones[c][b]. Their blood is on them.
translation:
  language: de
  text: Ein Mann oder eine Frau, die als Totenbeschwörer oder Wahrsager tätig sind,[a] müssen unbedingt mit dem Tod bestraft werden. Man soll sie mit Steinen steinigen. Ihr Blut kommt über sie.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräischen Wörter können auch die mit Totenbefragung beziehungsweise Wahrsagerei verbundenen Geister bezeichnen; hier können sie metonymisch für die Personen stehen, die sie befragen.
    reason: lexical_alternative
  - marker: b
    text: 'Eine Rechtsformel: Die Betreffenden tragen selbst die Verantwortung für ihren Tod.'
    reason: cultural_note
lexical_decisions:
- source_word: וְאִישׁ אוֹ אִשָּׁה
  choice: Wenn ein Mann oder eine Frau
  rationale: Die ausdrückliche Nennung beider Geschlechter bleibt erhalten. Das einleitende וְ wird im Deutschen im Zusammenhang natürlicherweise nicht eigens mit „und“ wiedergegeben.
- source_word: כִּי יִהְיֶה בָהֶם
  choice: einen … in sich hat
  rationale: Gibt die ungewöhnliche hebräische Wendung, nach der etwas „in“ der betreffenden Person ist, verständlich wieder, ohne sie vorschnell ausschließlich als Beruf oder Tätigkeit zu deuten.
- source_word: אוֹב אוֹ יִדְּעֹנִי
  choice: einen Totengeist oder einen Wahrsagegeist
  rationale: Die beiden schwer eindeutig abzugrenzenden Begriffe werden als mit Totenbefragung beziehungsweise geheimem Wahrsagewissen verbundene Geister wiedergegeben. Eine Fußnote hält die mögliche Bezeichnung der zugehörigen Praktizierenden offen.
- source_word: מוֹת יוּמָתוּ
  choice: müssen sie unbedingt getötet werden
  rationale: Das deutsche „unbedingt“ bildet die Verstärkung durch den hebräischen Infinitivus absolutus mit finitem Verb ab.
- source_word: בָּאֶבֶן יִרְגְּמוּ אֹתָם
  choice: Man soll sie mit Steinen steinigen
  rationale: Bewahrt sowohl die ausdrückliche Vollzugsart als auch das genannte Mittel. Das unbestimmte „man“ entspricht dem nicht näher bezeichneten pluralischen Subjekt.
- source_word: דְּמֵיהֶם בָּם
  choice: Ihr Blut ist auf ihnen
  rationale: Die knappe Rechtsformel wird formal bewahrt; ihre Bedeutung als Zuweisung der Verantwortung wird in einer Fußnote erklärt.
theological_decisions:
- issue: Deutung der Begriffe אוֹב und יִדְּעֹנִי
  choice: Im Haupttext als „Totengeist“ und „Wahrsagegeist“, mit lexikalischer Alternative in der Fußnote
  alternative: „Totenbeschwörer“ und „Wahrsager“ beziehungsweise „Medium“ und „Geisterbeschwörer“
  rationale: Die Formulierung „in sich hat“ legt hier die mit den Praktizierenden verbundenen Geister nahe, während die Wörter andernorts auch metonymisch deren Befrager bezeichnen können. Die Übersetzung bewahrt diese echte lexikalische Spannung, statt eine detaillierte Lehre über das Wesen solcher Phänomene festzulegen.
- issue: Rechtsformel דְּמֵיהֶם בָּם
  choice: Wörtlich „Ihr Blut ist auf ihnen“
  alternative: „Sie tragen selbst die Verantwortung für ihren Tod“
  rationale: Die wörtliche Fassung erhält die Bildsprache und den gerichtlichen Ernst; die Fußnote erläutert die gemeinte Eigenverantwortung, ohne sie in den Haupttext hineinzudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung „mit Steinen steinigen“ ist bewusst quellennah; die ungewöhnliche Wendung „Ihr Blut ist auf ihnen“ bleibt als Rechtsformel stehen und wird erläutert.
