  source_fidelity: Die Satzstruktur, die Todesstrafe, die Steinigung und die abschließende Rechtsformel sind im Kern zutreffend wiedergegeben. Die Haupttextfassung „einen Totengeist oder einen Wahrsagegeist in sich hat“ legt jedoch beide hebräischen Ausdrücke zu eng als Geister fest. אוב und ידעוני bezeichnen im Kontext sehr wahrscheinlich Personen bzw. Praktizierende und können lexikalisch auch die zugehörigen Geister meinen; eine deutsche Fassung sollte diese begründete Mehrdeutigkeit nicht durch zwei künstliche Geistbezeichnungen einseitig auflösen.
  naturalness: „Wahrsagegeist“ ist im modernen Standarddeutsch ungebräuchlich, und „müssen sie unbedingt getötet werden“ klingt eher umschreibend als rechtssprachlich. „Sie müssen unbedingt mit dem Tod bestraft werden“ ist idiomatischer und bildet die hebräische Verstärkung angemessen ab. Die Rechtsformel „Ihr Blut ist auf ihnen“ ist ohne ein reflexives Element missverständlich; „Ihr Blut kommt über sie“ ist als formelhafte, verständliche Entsprechung vorzuziehen.
  terminology: „Totenbeschwörer oder Wahrsager“ gibt die zwei Begriffe als Bezeichnungen von Praktizierenden in diesem Rechtskontext klar und modern wieder. Die Fußnote hält die mögliche Bedeutung als zugehörige Geister offen, ohne eine spekulative Taxonomie festzuschreiben.
