source:
  edition: WLC
  text: וְ/עֶרְוַ֨ת אֲח֧וֹת אִמְּ/ךָ֛ וַ/אֲח֥וֹת אָבִ֖י/ךָ לֹ֣א תְגַלֵּ֑ה כִּ֧י אֶת שְׁאֵר֛/וֹ הֶעֱרָ֖ה עֲוֺנָ֥/ם יִשָּֽׂאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/019.yaml
  text: You shall not uncover the nakedness of your mother's sister or of your father's sister[a], for he has laid bare his own flesh[b]; they shall bear their iniquity.
translation:
  language: de
  text: Die Blöße der Schwester deiner Mutter oder der Schwester deines Vaters darfst du nicht aufdecken; denn er hat sein eigenes Fleisch[a] entblößt. Sie sollen ihre Schuld tragen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „sein eigenes Fleisch“. „Fleisch“ kann hier einen nahen Blutsverwandten oder eine nahe Blutsverwandte bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: '„Ihre Schuld tragen“ kann auch bedeuten: für ihr Vergehen beziehungsweise für dessen Folgen einstehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת ... לֹא תְגַלֵּה
  choice: Die Blöße ... darfst du nicht aufdecken
  rationale: Bewahrt die feststehende Rechtsformel des Heiligkeitsgesetzes und ihren verhüllenden sexuellen Sinn, ohne sie durch eine explizite Umschreibung zu verengen.
- source_word: אֲחוֹת אִמְּךָ וַאֲחוֹת אָבִיךָ
  choice: der Schwester deiner Mutter oder der Schwester deines Vaters
  rationale: Gibt die konkreten Verwandtschaftsbezeichnungen unmittelbar und in verständlichem modernem Deutsch wieder.
- source_word: כִּי
  choice: denn
  rationale: Leitet wie im Hebräischen die Begründung des Verbots ein.
- source_word: שְׁאֵרוֹ
  choice: seine eigene Blutsverwandte
  rationale: שְׁאֵר bezeichnet hier eine nahe leibliche Verwandte. Die Wiedergabe macht den Verwandtschaftssinn natürlich verständlich; die wörtliche Fleisch-Metapher bleibt in der Fußnote erhalten.
- source_word: הֶעֱרָה
  choice: hat ... entblößt
  rationale: Gibt das Freilegen beziehungsweise Entblößen wieder und vermeidet eine unnötige Wiederholung von „aufdecken“.
- source_word: עֲוֺנָם יִשָּׂאוּ
  choice: Ihre Schuld sollen sie tragen
  rationale: Bewahrt die knappe hebräische Wendung und lässt offen, ob עָוֹן besonders die Schuld, das Vergehen oder dessen Straffolge bezeichnet.
theological_decisions:
- issue: Wechsel vom Singular in der Begründung zum Plural in der Rechtsfolge
  choice: „er hat seine eigene Blutsverwandte entblößt. Ihre Schuld sollen sie tragen“
  alternative: Den Satz durchgehend pluralisch formulieren oder den Singular unpersönlich wiedergeben.
  rationale: Das Hebräische verwendet in שְׁאֵרוֹ und הֶעֱרָה den Singular, danach in עֲוֺנָם יִשָּׂאוּ den Plural. Die Übersetzung erhält diesen auffälligen Wechsel, statt ihn stillschweigend zu glätten.
- issue: Sexuellen Euphemismus ausdrücklich auslegen oder bewahren
  choice: „die Blöße ... aufdecken“
  alternative: „sexuelle Beziehungen haben“
  rationale: Die bildhafte Rechtsformel ist für den Zusammenhang von Levitikus kennzeichnend. Ihre Beibehaltung wahrt Textgestalt und intertextuelle Bezüge, ohne eine weitergehende Auslegung in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener levitischer Rechtsformel. Die Anrede bleibt singularisch; der Wechsel zum Plural in der Schlussklausel wird bewusst nicht geglättet.
