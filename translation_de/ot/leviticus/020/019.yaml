- from: Die Blöße der Schwester deiner Mutter oder der Schwester deines Vaters darfst du nicht aufdecken; denn er hat seine eigene Blutsverwandte entblößt.[a] Ihre Schuld sollen sie tragen.[b]
  to: Die Blöße der Schwester deiner Mutter oder der Schwester deines Vaters darfst du nicht aufdecken; denn er hat sein eigenes Fleisch[a] entblößt. Sie sollen ihre Schuld tragen.[b]
  rationale: Die Revision ersetzt die im Haupttext zu stark interpretierende, feminin festgelegte Wiedergabe von שְׁאֵרוֹ durch die wörtliche hebräische Fleischmetapher und erläutert ihren Verwandtschaftssinn in der Fußnote. Der Singular „er“ und der anschließende Plural „sie“ bleiben erhalten. Zudem wird der Fußnotenanker an die erläuterte Wendung gesetzt und die Wortstellung der Schlussklausel leicht geglättet.
