  source_fidelity: Die Verbotsformel und der Wechsel vom Singular in der Begründung zum Plural in der Schlussklausel sind zutreffend wiedergegeben. „seine eigene Blutsverwandte“ legt jedoch den im Hebräischen wörtlich und grammatisch maskulin formulierten Ausdruck שְׁאֵרוֹ („sein Fleisch“, im Sinn von naher Verwandtschaft) unnötig auf eine weibliche Verwandte fest. Die wörtliche Formulierung im Haupttext bewahrt die Ausdrucksweise und ihre knappe Ambiguität besser.
  naturalness: „Die Blöße … aufdecken“ ist eine etablierte und verständliche deutsche Wiedergabe der levitischen Rechtsformel. „Sie sollen ihre Schuld tragen“ ist im modernen Standarddeutsch etwas natürlicher als die vorangestellte Objektformulierung, ohne den rechtssprachlichen Ton zu verlieren.
  terminology: „Blöße“, „aufdecken“ und „Schuld tragen“ sind für die hebräischen Rechts- und Schuldformeln angemessen. „eigenes Fleisch“ soll hier im Haupttext stehen; die Fußnote erläutert den gemeinten Verwandtschaftssinn, ohne ihn als alleinige Lesart auszugeben.
