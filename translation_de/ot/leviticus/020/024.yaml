source:
  edition: WLC
  text: וָ/אֹמַ֣ר לָ/כֶ֗ם אַתֶּם֮ תִּֽירְשׁ֣וּ אֶת אַדְמָתָ/ם֒ וַ/אֲנִ֞י אֶתְּנֶ֤/נָּה לָ/כֶם֙ לָ/רֶ֣שֶׁת אֹתָ֔/הּ אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָ֑שׁ אֲנִי֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם אֲשֶׁר הִבְדַּ֥לְתִּי אֶתְ/כֶ֖ם מִן הָֽ/עַמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/024.yaml
  text: But I said to you[a], ‘You shall possess their land, and I myself will give it to you to possess’—a land flowing with milk and honey. I am Yahweh your God[d][c][b], who has separated you from the peoples.
translation:
  language: de
  text: 'Doch ich habe zu euch gesagt: »Ihr sollt ihr Land in Besitz nehmen, und ich selbst werde es euch geben, damit ihr es in Besitz nehmt« – ein Land, in dem Milch und Honig fließen.[a] Ich bin Jahwe, euer Gott,[b] der euch von den Völkern abgesondert hat.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »ein Land, das von Milch und Honig fließt«; eine hebräische Wendung für Fruchtbarkeit und reichen Ertrag.'
    reason: cultural_note
  - marker: b
    text: Hebräisch JHWH; traditionell mit »der HERR« wiedergegeben.
    reason: alternative_reading
  - marker: c
    text: 'Oder: »der euch von den Völkern getrennt hat« beziehungsweise »der euch von den Völkern ausgesondert hat«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Doch ich habe ... gesagt
  rationale: Das Waw führt den Gedankengang fort; im Kontext hebt die adversative Wiedergabe den Gegensatz zu den zuvor genannten Völkern und ihren Praktiken hervor.
- source_word: תִּירְשׁוּ / לָרֶשֶׁת
  choice: in Besitz nehmen / in Besitz nehmt
  rationale: ירשׁ kann sowohl »erben« als auch »in Besitz nehmen« bedeuten. Im Zusammenhang mit der Landgabe ist »in Besitz nehmen« natürlich und bewahrt den möglichen aktiven Sinn; die Wiederholung bildet die hebräische Wortwiederholung ab.
- source_word: אַדְמָתָם
  choice: ihr Land
  rationale: אדמה bezeichnet wörtlich den Erdboden, meint hier aber das Gebiet der Völker und wird daher idiomatisch mit »Land« wiedergegeben.
- source_word: וַאֲנִי
  choice: und ich selbst
  rationale: Das ausdrücklich gesetzte selbstständige Pronomen betont den göttlichen Geber.
- source_word: אֶתְּנֶנָּה
  choice: werde es euch geben
  rationale: Die Form bezeichnet hier Gottes Zusage, das Land Israel zu geben; das Objektsuffix wird mit »es« wiedergegeben.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: ein Land, in dem Milch und Honig fließen
  rationale: Die geläufige hebräische Wendung wird bildhaft und zugleich in natürlichem Deutsch wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname JHWH wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הִבְדַּלְתִּי
  choice: abgesondert hat
  rationale: בדל bezeichnet Trennung beziehungsweise Absonderung. »Abgesondert« wahrt den Bezug zum Thema der Unterscheidung in diesem Kapitel, ohne den Satz dogmatisch auszuweiten.
- source_word: הָעַמִּים
  choice: den Völkern
  rationale: עמים bezeichnet Menschengruppen beziehungsweise Völker; »Völker« ist hier präzise und idiomatisch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. »Jahwe« macht diesen sichtbar, während »der HERR« die traditionelle Ersatzlesung wiedergibt.
- issue: Art der Unterscheidung Israels von den anderen Völkern
  choice: der euch von den Völkern abgesondert hat
  alternative: der euch von den Völkern getrennt / euch unter den Völkern ausgesondert hat
  rationale: Die Übersetzung hält an der Aussage einer von Gott bewirkten Absonderung fest, ohne deren theologische Tragweite über den Vers hinaus näher zu bestimmen.
- issue: Bedeutungsbreite von ירשׁ
  choice: in Besitz nehmen
  alternative: erben
  rationale: Beide Bedeutungsnuancen sind möglich. Der Haupttext betont die tatsächliche Inbesitznahme, während die Fußnote die Erbnuance offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede und die betonte Formulierung »ich selbst« bleiben erhalten. »In Besitz nehmen« ist allgemein verständlich; die mögliche Erbnuance von ירשׁ bleibt in den lexikalischen Angaben ausdrücklich offen.
