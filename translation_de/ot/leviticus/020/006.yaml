  text: וְ/הַ/נֶּ֗פֶשׁ אֲשֶׁ֨ר תִּפְנֶ֤ה אֶל הָֽ/אֹבֹת֙ וְ/אֶל הַ/יִּדְּעֹנִ֔ים לִ/זְנ֖וֹת אַחֲרֵי/הֶ֑ם וְ/נָתַתִּ֤י אֶת פָּנַ/י֙ בַּ/נֶּ֣פֶשׁ הַ/הִ֔וא וְ/הִכְרַתִּ֥י אֹת֖/וֹ מִ/קֶּ֥רֶב עַמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/006.yaml
  text: And the person who turns to the mediums and to the spiritists[a], to prostitute himself after them[c][b], I will set my face against that person and cut him off from among his people.
translation:
  language: de
  text: Und wenn sich jemand an Totenbeschwörer und Geisterkundige[a] wendet, um ihnen nachzuhuren[b], werde ich mein Angesicht gegen diesen Menschen richten und ihn aus der Mitte seines Volkes abschneiden[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die beiden hebräischen Bezeichnungen meinen Praktiker der Toten- oder Geisterbefragung; ihre genaue Unterscheidung ist unsicher. Beim ersten Ausdruck sind auch die Wiedergaben »Medien« oder »Menschen mit Totengeistern« möglich.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich »um ihnen nachzuhuren«: ein Bild für religiöse Untreue durch die Hinwendung zu solchen Praktiken.'
    reason: metaphor_clarification
  - marker: c
    text: »Abschneiden« gibt eine feste hebräische Gerichtsformel wieder. Ob sie hier Tod durch göttliches Gericht, Ausschluss oder eine andere konkrete Strafe bezeichnet, wird nicht ausdrücklich gesagt.
    reason: alternative_reading
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: jemand / dieser Mensch
  rationale: In diesem Rechtstext bezeichnet נֶפֶשׁ die einzelne Person, nicht eigens eine vom Körper unterschiedene Seele. Die wechselnde deutsche Formulierung vermeidet eine unnatürliche Wiederholung.
- source_word: תִּפְנֶה
  choice: sich an … wendet
  rationale: Die Wendung bewahrt das Bild des Sich-Hinwendens und bezeichnet hier zugleich das Aufsuchen okkulter Praktiker.
- source_word: הָאֹבֹת
  choice: Totenbeschwörer
  rationale: אוֹב kann mit Toten- oder Geisterbefragung verbunden sein und auch den entsprechenden Praktiker bezeichnen. »Totenbeschwörer« ist im heutigen Deutsch verständlicher als ältere Formulierungen wie »Totengeister« oder »Geisterbanner«.
- source_word: הַיִּדְּעֹנִים
  choice: Geisterkundige
  rationale: יִדְּעֹנִי bezeichnet einen Praktiker verbotenen okkulten Wissens und steht häufig neben אוֹב. »Geisterkundige« hält beide Begriffe auseinander, ohne eine genauere Praxis vorzutäuschen, als der hebräische Ausdruck erkennen lässt.
- source_word: לִזְנוֹת אַחֲרֵיהֶם
  choice: um ihnen nachzuhuren
  rationale: Die kräftige Metapher von Prostitution beziehungsweise sexueller Untreue wird beibehalten, weil sie die religiöse und bundesbezogene Untreue des Handelns ausdrückt. Das ungewöhnliche Verb folgt bewusst der Bildsprache des Hebräischen.
- source_word: וְנָתַתִּי אֶת־פָּנַי בַּנֶּפֶשׁ הַהִוא
  choice: werde ich mein Angesicht gegen diesen Menschen richten
  rationale: Die deutsche Wendung bewahrt das hebräische Bild von Gottes entschlossener persönlicher Gegnerschaft im Gericht.
- source_word: וְהִכְרַתִּי אֹתוֹ
  choice: und ihn … tilgen
  rationale: כרת ist eine feste Gerichtsformel. »Tilgen« gibt ihre Schwere wieder, ohne im Haupttext ausdrücklich zwischen Hinrichtung, göttlichem Gericht und Ausschluss zu entscheiden.
- source_word: מִקֶּרֶב עַמּוֹ
  choice: aus der Mitte seines Volkes
  rationale: Die Formulierung bewahrt sowohl den Gemeinschaftsbezug als auch die räumliche Bildlichkeit der hebräischen Rechtsformel.
theological_decisions:
- issue: Beibehaltung der Prostitutionsmetapher für religiöse Untreue
  choice: um ihnen nachzuhuren
  alternative: um ihnen treulos nachzulaufen
  rationale: זנה verwendet ausdrücklich eine sexuelle Untreue- und Prostitutionsmetapher. Ihre Beibehaltung wahrt die theologische Schärfe, während die Fußnote ihren übertragenen Sinn erläutert.
- issue: Bedeutung der Gerichtsformel כרת
  choice: ihn aus der Mitte seines Volkes tilgen
  alternative: ihn aus seinem Volk ausschließen / ihn vernichten
  rationale: Der Vers legt die genaue Vollzugsweise des Gerichts nicht fest. Die Übersetzung soll weder bloßen sozialen Ausschluss noch eine bestimmte Todesart als alleinige Deutung festschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusster Beibehaltung der markanten hebräischen Bilder. »Nachhuren« ist absichtlich kräftig und ungewöhnlich; die Fußnote erschließt die Metapher. »Angesicht« erhält den gehobenen biblischen Bildgehalt, bleibt aber allgemein verständlich.
