  text: וְ/אִ֗ישׁ אֲשֶׁ֤ר יִנְאַף֙ אֶת אֵ֣שֶׁת אִ֔ישׁ אֲשֶׁ֥ר יִנְאַ֖ף אֶת אֵ֣שֶׁת רֵעֵ֑/הוּ מֽוֹת יוּמַ֥ת הַ/נֹּאֵ֖ף וְ/הַ/נֹּאָֽפֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/010.yaml
  text: If a man commits adultery with another man's wife—if he commits adultery with his neighbor's wife—the adulterer and the adulteress shall surely be put to death[a].
translation:
  language: de
  text: Wenn ein Mann mit der Frau eines Mannes die Ehe bricht – wenn er mit der Frau seines Nächsten die Ehe bricht –, müssen der Ehebrecher und die Ehebrecherin unbedingt getötet werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mit der Frau eines Mannes … mit der Frau seines Nächsten“. Die Wiederholung bekräftigt und präzisiert das Vergehen im Stil eines Rechtstextes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: Wenn ein Mann
  rationale: Die Verbindung leitet in diesem Rechtstext einen Fall ein. Die konditionale Wiedergabe ist im Deutschen natürlich und bewahrt die männliche Singularform.
- source_word: יִנְאַף
  choice: die Ehe bricht
  rationale: Das Verb נאף bezeichnet spezifisch Ehebruch, nicht allgemein sexuelle Unmoral. Die deutsche Wendung ist klar, geläufig und präzise.
- source_word: אֶת אֵשֶׁת אִישׁ
  choice: mit der Frau eines anderen Mannes
  rationale: Wörtlich steht „mit der Frau eines Mannes“. „Eines anderen Mannes“ macht im Deutschen idiomatisch deutlich, dass sie mit einem anderen als dem Täter verheiratet ist.
- source_word: אֲשֶׁר יִנְאַף אֶת אֵשֶׁת רֵעֵהוּ
  choice: wenn er mit der Frau seines Nächsten die Ehe bricht
  rationale: Die Wiederholung wird als rechtliche Bekräftigung und Präzisierung bewahrt. רֵעַ bezeichnet hier den Mitmenschen beziehungsweise Angehörigen der Gemeinschaft, nicht nur einen räumlichen Nachbarn.
- source_word: מוֹת יוּמַת
  choice: müssen ... mit dem Tod bestraft werden
  rationale: Infinitivus absolutus und finite Passivform ergeben eine nachdrückliche Todesstrafenformel. „Müssen“ vermittelt die Verbindlichkeit, ohne eine im Vers nicht genannte Vollstreckungsart einzuführen.
- source_word: הַנֹּאֵף וְהַנֹּאָפֶת
  choice: der Ehebrecher und die Ehebrecherin
  rationale: Die substantivierten männlichen und weiblichen Partizipien benennen beide Beteiligten ausdrücklich und symmetrisch.
theological_decisions:
- issue: Geschlechtsspezifische Rechtssprache
  choice: Die männliche Fallbeschreibung und die ausdrücklichen Bezeichnungen „Ehebrecher“ und „Ehebrecherin“ werden beibehalten.
  alternative: Wer die Ehe bricht ... beide Beteiligten
  rationale: Der hebräische Text formuliert die Fallbeschreibung männlich und nennt bei der Strafbestimmung beide Geschlechter ausdrücklich. Eine geschlechtsneutrale Paraphrase würde diese Form verwischen.
- issue: Formel der Todesstrafe
  choice: „müssen ... mit dem Tod bestraft werden“ ohne Angabe einer Vollstreckungsart
  alternative: „müssen hingerichtet werden“ oder „sollen gewiss getötet werden“
  rationale: Der Text verhängt nachdrücklich die Todesstrafe, nennt in diesem Vers aber keine Methode. Die gewählte Formulierung wahrt diesen Umfang und klingt in modernem deutschem Rechtsstil natürlich.
translation_notes:
  register: Moderner, würdiger und allgemein verständlicher Rechtsstil. Die hebräische Wiederholung bleibt erhalten; der Gedankenstrich kennzeichnet die präzisierende Wiederaufnahme. Die Strafbestimmung ist nachdrücklich formuliert, ohne eine Hinrichtungsart zu ergänzen.
