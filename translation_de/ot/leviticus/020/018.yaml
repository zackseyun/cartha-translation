source:
  edition: WLC
  text: וְ֠/אִישׁ אֲשֶׁר יִשְׁכַּ֨ב אֶת אִשָּׁ֜ה דָּוָ֗ה וְ/גִלָּ֤ה אֶת עֶרְוָתָ/הּ֙ אֶת מְקֹרָ֣/הּ הֶֽעֱרָ֔ה וְ/הִ֕יא גִּלְּתָ֖ה אֶת מְק֣וֹר דָּמֶ֑י/הָ וְ/נִכְרְת֥וּ שְׁנֵי/הֶ֖ם מִ/קֶּ֥רֶב עַמָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/018.yaml
  text: If a man lies with a woman during her menstrual impurity and uncovers her nakedness—he has laid bare her flow[c][b][a], and she has uncovered the flow of her blood—both of them shall be cut off from among their people.
translation:
  language: de
  text: Wenn ein Mann mit einer Frau schläft, während sie wegen ihrer Monatsblutung unrein ist[a], und ihre Blöße aufdeckt – er hat ihre Quelle entblößt[b], und sie hat die Quelle ihres Blutes aufgedeckt –, dann sollen beide aus der Mitte ihres Volkes abgeschnitten werden.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „während sie ihre Monatsblutung hat“. Das hebräische Wort bezeichnet im Levitikus zugleich den mit der Menstruation verbundenen Zustand kultischer Unreinheit.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „er hat ihre Quelle entblößt“. „Quelle“ ist hier ein verhüllender Ausdruck für den körperlichen Ursprung beziehungsweise Fluss des Blutes.'
    reason: lexical_alternative
  - marker: c
    text: Die hebräische Wendung ist eine feststehende Rechtsformel der Tora. Hier wird nicht näher bestimmt, ob und wie dieses Abgeschnittenwerden vollzogen wird.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ
  choice: ein Mann
  rationale: Die männliche Einzelform bezeichnet in diesem sexuellen Rechtsfall ausdrücklich den männlichen Beteiligten.
- source_word: יִשְׁכַּב אֶת אִשָּׁה
  choice: mit einer Frau schläft
  rationale: Natürliche deutsche Wiedergabe der hebräischen Umschreibung für Geschlechtsverkehr; sie bleibt würdig und im Zusammenhang eindeutig.
- source_word: דָּוָה
  choice: während sie wegen ihrer Monatsblutung unrein ist
  rationale: Die Formulierung bezeichnet hier eine menstruierende Frau in einem Zustand kultischer Unreinheit. Die Übersetzung wahrt sowohl den körperlichen Vorgang als auch seine levitische Bedeutung.
- source_word: גִלָּה אֶת עֶרְוָתָהּ
  choice: ihre Blöße aufdeckt
  rationale: Bewahrt die für die Sexualgesetze des Levitikus kennzeichnende Umschreibung und deren Bezüge innerhalb des Buches.
- source_word: מְקֹרָהּ הֶעֱרָה
  choice: er hat ihre Quelle entblößt
  rationale: Gibt מָקוֹר formal als „Quelle“ und הֶעֱרָה als „entblößt“ wieder. Das im Hebräischen euphemistische Körperbild wird nicht vorschnell auf eine einzige anatomische Deutung festgelegt.
- source_word: וְהִיא גִּלְּתָה אֶת מְקוֹר דָּמֶיהָ
  choice: und sie hat die Quelle ihres Blutes aufgedeckt
  rationale: Erhält die Parallelität beider Satzteile sowie das Bild von der „Quelle“ des Blutes.
- source_word: וְנִכְרְתוּ
  choice: sollen … entfernt werden
  rationale: Gibt die Rechtsfolge wieder, ohne festzulegen, ob die formelhafte Wendung Tod, göttliches Gericht oder Ausschluss bezeichnet.
- source_word: מִקֶּרֶב עַמָּם
  choice: aus der Mitte ihres Volkes
  rationale: Bewahrt den gemeinschaftlichen und bundesrechtlichen Bezug der hebräischen Wendung.
theological_decisions:
- issue: Bedeutung von דָּוָה
  choice: Als durch die Monatsblutung bedingte Unreinheit wiedergegeben.
  alternative: „während sie ihre Monatsblutung hat“ oder „während ihrer Unreinheit“
  rationale: Im Kontext des Levitikus geht es weder bloß um Krankheit noch nur um den biologischen Vorgang, sondern um die damit verbundene kultische Unreinheit.
- issue: Art der mit וְנִכְרְתוּ bezeichneten Rechtsfolge
  choice: „aus der Mitte ihres Volkes entfernt werden“
  alternative: „ausgerottet“, „hingerichtet“ oder „aus der Gemeinschaft ausgeschlossen werden“
  rationale: Die hebräische Rechtsformel bestimmt an dieser Stelle nicht ausdrücklich, auf welche Weise die Entfernung geschieht. Die Übersetzung lässt diese Spannung bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlicher Rechtssprache. Die levitischen Umschreibungen „Blöße aufdecken“ und „Quelle“ bleiben wegen ihrer Bildhaftigkeit und innerbiblischen Bezüge erhalten; eine unnötig klinische oder konfessionell festgelegte Deutung wird vermieden.
