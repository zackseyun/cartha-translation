source:
  edition: WLC
  text: וְ/הִ֨תְקַדִּשְׁתֶּ֔ם וִ/הְיִיתֶ֖ם קְדֹשִׁ֑ים כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/007.yaml
  text: Consecrate yourselves[a], and be holy, because I am Yahweh your God.
translation:
  language: de
  text: Heiligt euch[a] und seid heilig, denn ich bin Yahweh, euer Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Weiht euch“ beziehungsweise „Macht euch heilig“. Das hebräische Verb ist reflexiv und ruft Israel zu aktiver Selbstheiligung auf.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְקַדִּשְׁתֶּם
  choice: Heiligt euch
  rationale: Die Hitpael-Form von קדשׁ hat hier reflexiven und auffordernden Sinn. „Heiligt euch“ bewahrt sowohl das aktive Handeln Israels als auch den sprachlichen Zusammenhang mit „heilig“ im folgenden Satzteil.
- source_word: וִהְיִיתֶם
  choice: und seid
  rationale: Die Form von היה schließt sich an die vorausgehende Aufforderung an und lässt sich im Deutschen natürlich als koordinierter Imperativ wiedergeben.
- source_word: קְדֹשִׁים
  choice: heilig
  rationale: „Heilig“ bewahrt das volle kultische, gemeinschaftliche und ethische Gewicht des hebräischen Ausdrucks; „abgesondert“ würde dessen Bedeutung verengen.
- source_word: כִּי
  choice: denn
  rationale: כִּי begründet hier die Aufforderung. „Denn“ ist in würdigem modernem Deutsch knapp und natürlich; „weil“ wäre ebenfalls möglich, erforderte aber eine andere Satzstellung.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Eigenname Gottes wird als „Yahweh“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵיכֶם
  choice: euer Gott
  rationale: Obwohl אֱלֹהִים formal pluralisch aussieht, bezeichnet es hier mit dem Suffix eindeutig den einen Gott Israels.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. Die Transliteration „Yahweh“ bewahrt ihn als Eigennamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Verhältnis von menschlicher Selbstheiligung und dem Heiligsein
  choice: 'Zwei verbundene Aufforderungen: „Heiligt euch und seid heilig“'
  alternative: „Heiligt euch, damit ihr heilig seid“
  rationale: Die koordinierende Struktur des Hebräischen wird beibehalten. So wird weder ausdrücklich ein Zweckverhältnis noch eine bestimmte Lehre über das Verhältnis von göttlichem und menschlichem Handeln hinzugefügt.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. „Heiligt euch“ ist biblisch geprägt, aber weiterhin allgemein verständlich; die Fußnote erläutert natürlichere Bedeutungsalternativen. Die Wiederholung „heiligt/heilig“ bildet die hebräische Wortwurzel bewusst ab.
