base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/003.yaml
  text: I myself will set my face against that man and cut him off from among his people[a], because he has given some of his offspring to Molech, so as to defile my sanctuary and to profane my holy name.
translation:
  language: de
  text: Ich selbst werde mein Angesicht gegen diesen Mann richten und ihn aus der Mitte seines Volkes ausrotten, weil er dem Moloch einen Teil seiner Nachkommen gegeben hat[a], um mein Heiligtum unrein zu machen und meinen heiligen Namen zu entweihen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einige seiner Kinder dem Moloch geopfert“. Im Hebräischen steht wörtlich: „einen Teil seiner Nachkommen dem Moloch gegeben“; die Opferbedeutung wird aus dem weiteren Zusammenhang erschlossen.'
    reason: lexikalische und sachliche Mehrdeutigkeit
lexical_decisions:
- source_word: וַאֲנִי
  choice: Ich selbst
  rationale: Das selbstständige Pronomen hebt Gottes persönliches Eingreifen hervor; „Ich selbst“ gibt diese Betonung im Deutschen natürlich wieder.
- source_word: אֶתֵּן אֶת־פָּנַי בָּאִישׁ הַהוּא
  choice: werde mein Angesicht gegen diesen Mann richten
  rationale: Bewahrt das hebräische Bild für entschlossene göttliche Gegnerschaft und die bestimmte Verweisung durch הַהוּא.
- source_word: וְהִכְרַתִּי אֹתוֹ מִקֶּרֶב עַמּוֹ
  choice: und ihn aus der Mitte seines Volkes ausrotten
  rationale: „Ausrotten“ gibt die gerichtliche Schwere des Hiphil von כרת wieder, ohne die konkrete Vollzugsweise festzulegen; „aus der Mitte seines Volkes“ erhält die gemeinschaftliche Ausschlussformel.
- source_word: מִזַּרְעוֹ
  choice: einen Teil seiner Nachkommen
  rationale: Gibt den partitiven Gebrauch von מִן wieder und versteht זֶרַע hier im Sinn leiblicher Nachkommen, ohne bereits „Kinder“ oder „Opfer“ in den Haupttext einzutragen.
- source_word: נָתַן לַמֹּלֶךְ
  choice: dem Moloch gegeben hat
  rationale: Bewahrt das allgemeine Verb „geben“ des Ausgangstextes. „Moloch“ wird als Eigenname behandelt.
- source_word: לְמַעַן
  choice: um … zu
  rationale: Die deutsche Zweckkonstruktion gibt die mögliche Ziel- oder Absichtsbeziehung knapp und natürlich wieder.
- source_word: טַמֵּא אֶת־מִקְדָּשִׁי
  choice: mein Heiligtum unrein zu machen
  rationale: „Unrein machen“ wahrt den kultischen Bedeutungsbereich von טמא und ist für heutige Leser unmittelbar verständlich.
- source_word: וּלְחַלֵּל אֶת־שֵׁם קָדְשִׁי
  choice: und meinen heiligen Namen zu entweihen
  rationale: „Entweihen“ gibt חלל im Zusammenhang mit Gottes Namen würdig und idiomatisch wieder.
theological_decisions:
- issue: Art der Moloch-Handlung
  choice: Im Haupttext steht wörtlichkeitsnah „einen Teil seiner Nachkommen dem Moloch gegeben“.
  alternative: „einige seiner Kinder dem Moloch geopfert“
  rationale: Der weitere Zusammenhang weist auf Kinderopfer hin, doch der Vers selbst verwendet lediglich das Verb „geben“. Die Fußnote nennt die naheliegende kultische Deutung, ohne sie in den Wortlaut hineinzutragen.
- issue: Bedeutungsumfang des Gerichtsverbs כרת
  choice: „ausrotten“ ohne nähere Bestimmung der Vollzugsweise
  alternative: „aus seinem Volk ausschließen“ oder „töten“
  rationale: Die Formel bezeichnet ein schweres göttliches Gericht, lässt dessen genaue Form jedoch offen. Weder rein sozialer Ausschluss noch eine bestimmte Todesart wird festgelegt.
- issue: Gottes persönliches Gerichtshandeln
  choice: „Ich selbst“ und das Bild „mein Angesicht gegen … richten“ bleiben erhalten.
  alternative: „Ich werde mich gegen diesen Mann stellen“
  rationale: Die gewählte Fassung bewahrt sowohl die Betonung des göttlichen Subjekts als auch das theologisch gewichtige hebräische Idiom.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die markante hebräische Wendung vom gegen jemanden gerichteten Angesicht bleibt als verständliches biblisches Bild erhalten. Kultische Fachsprache wird nur dort verwendet, wo sie im Ausgangstext deutlich ist.
