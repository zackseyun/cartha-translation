  text: כִּֽי אִ֣ישׁ אִ֗ישׁ אֲשֶׁ֨ר יְקַלֵּ֧ל אֶת אָבִ֛י/ו וְ/אֶת אִמּ֖/וֹ מ֣וֹת יוּמָ֑ת אָבִ֧י/ו וְ/אִמּ֛/וֹ קִלֵּ֖ל דָּמָ֥י/ו בּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/009.yaml
  text: For any man who curses his father or his mother shall surely be put to death[a]; he has cursed his father and his mother[c][b]; his blood is on him.
translation:
  language: de
  text: Denn jeder, der seinen Vater oder seine Mutter verflucht, muss mit dem Tod bestraft werden. Seinen Vater und seine Mutter hat er verflucht; sein Blut ist auf ihm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Sein Blut ist auf ihm.« Diese hebräische Rechtsformel besagt, dass er selbst die Verantwortung für seinen Tod trägt.'
    reason: Hebräische Rechtsformel und Bildsprache werden erläutert.
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Rechtsbestimmung begründend ein und knüpft an den Zusammenhang an.
- source_word: אִישׁ אִישׁ
  choice: jeder
  rationale: Die Verdopplung ist distributiv und bedeutet idiomatisch »jeder« bzw. »wer auch immer«.
- source_word: יְקַלֵּל / קִלֵּל
  choice: verflucht / hat verflucht
  rationale: Das Piel von קלל bezeichnet hier das Aussprechen eines Fluches gegen die Eltern; die Wiederholung begründet das Urteil.
- source_word: אָבִיו וְאֶת אִמּוֹ
  choice: seinen Vater oder seine Mutter
  rationale: Das hebräische »und« verbindet die beiden betroffenen Elternteile; im deutschen Rechtssatz macht »oder« deutlich, dass bereits das Verfluchen eines Elternteils die Strafe nach sich zieht.
- source_word: מוֹת יוּמָת
  choice: muss mit dem Tod bestraft werden
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Passivverb drückt ein nachdrückliches, verbindliches Todesurteil aus.
- source_word: דָּמָיו בּוֹ
  choice: sein Blut kommt über ihn selbst
  rationale: Bewahrt das Bild des hebräischen Verantwortlichkeitsausdrucks und macht durch »selbst« deutlich, dass er die Verantwortung für seinen Tod trägt.
theological_decisions:
- issue: Reichweite des distributiven אִישׁ אִישׁ
  choice: jeder
  alternative: jeder Mann
  rationale: Im Rechtstext bezeichnet die maskuline distributive Wendung allgemein jede betroffene Person; »jeder« ist im Deutschen natürlich und wahrt die grammatische Form, ohne die Anwendung unnötig auf Männer einzuengen.
- issue: Verantwortungsformel דָּמָיו בּוֹ
  choice: sein Blut kommt über ihn selbst
  alternative: seine Blutschuld liegt auf ihm
  rationale: Die bildhafte Rechtsformel weist ihm die Verantwortung für die verhängte Todesstrafe zu. Die Übersetzung vermeidet es, darüber hinaus eine besondere dogmatische Bedeutung von »Blutschuld« einzutragen.
- issue: Konjunktion bei den Eltern
  choice: Vater oder Mutter
  alternative: Vater und Mutter
  rationale: 'Das Deutsche »oder« gibt den distributiven Rechtssinn wieder: Das Verfluchen schon eines Elternteils genügt. Eine Fußnote ist nicht erforderlich, da dadurch der sachliche Umfang nicht verändert wird.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Rechtssatz bleibt knapp und nachdrücklich; »mit dem Tod bestraft werden« ist gegenwärtig verständlicher als die archaische Formel »des Todes sterben«.
