id: LEV.20.17
reference: Leviticus 20:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אִ֣ישׁ אֲשֶׁר יִקַּ֣ח אֶת אֲחֹת֡/וֹ בַּת אָבִ֣י/ו א֣וֹ בַת אִ֠מּ/וֹ וְ/רָאָ֨ה אֶת עֶרְוָתָ֜/הּ וְ/הִֽיא תִרְאֶ֤ה אֶת עֶרְוָת/וֹ֙ חֶ֣סֶד ה֔וּא וְ/נִ֨כְרְת֔וּ לְ/עֵינֵ֖י בְּנֵ֣י עַמָּ֑/ם עֶרְוַ֧ת אֲחֹת֛/וֹ גִּלָּ֖ה עֲוֺנ֥/וֹ יִשָּֽׂא־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/017.yaml
  text: If a man takes his sister[a], his father's daughter or his mother's daughter, and sees her nakedness, and she sees his nakedness, it is a disgrace, and they shall be cut off in the sight of the sons of their people. He has uncovered his sister's nakedness[b]; he shall bear his guilt.
translation:
  language: de
  text: Wenn ein Mann seine Schwester nimmt, die Tochter seines Vaters oder die Tochter seiner Mutter, und ihre Blöße sieht und sie seine Blöße sieht, so ist das eine Schandtat[a]. Sie sollen vor den Augen der Angehörigen ihres Volkes ausgerottet werden[b]. Er hat die Blöße seiner Schwester aufgedeckt; er soll seine Schuld tragen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Wort bedeutet sonst meist „Güte“ oder „beständige Treue“, hat hier jedoch eine seltene negative Bedeutung: „Schandtat“, „Schande“ oder „anstößige Tat“.'
    reason: lexical_alternative
  - marker: b
    text: „Ausgerottet werden“ gibt eine hebräische Gerichtsformel wieder, ohne festzulegen, ob damit Tod, Ausschluss oder eine andere Form der Beseitigung gemeint ist.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ
  choice: ein Mann
  rationale: Die maskuline Einzahl und die Formulierung des hebräischen Rechtssatzes werden beibehalten.
- source_word: יִקַּח
  choice: nimmt
  rationale: Das Verb bedeutet wörtlich „nehmen“ und kann hier eine sexuelle oder eheliche Verbindung bezeichnen. Die offene Formulierung vermeidet eine unnötige Festlegung.
- source_word: אֲחֹתוֹ בַּת אָבִיו אוֹ בַת אִמּוֹ
  choice: seine Schwester, die Tochter seines Vaters oder die Tochter seiner Mutter
  rationale: Die appositionelle Erläuterung des Hebräischen bleibt erhalten und schließt sowohl väterliche als auch mütterliche Halbschwestern ein.
- source_word: וְרָאָה אֶת עֶרְוָתָהּ וְהִיא תִרְאֶה אֶת עֶרְוָתוֹ
  choice: und ihre Blöße sieht und sie seine Blöße sieht
  rationale: „Die Blöße sehen“ bewahrt das hebräische Bild und den rechtlich-sexuellen Ausdruck, statt ihn ausdrücklich als Geschlechtsverkehr aufzulösen.
- source_word: חֶסֶד
  choice: Schandtat
  rationale: 'Das sonst meist positiv gebrauchte Wort hat hier kontextbedingt eine seltene negative Bedeutung: eine schändliche oder anstößige Tat.'
- source_word: וְנִכְרְתוּ
  choice: sie sollen ... ausgerottet werden
  rationale: „Ausgerottet werden“ gibt die feste Gerichtsformel כרת wieder, ohne die konkrete Art der Strafe eindeutig festzulegen.
- source_word: לְעֵינֵי בְּנֵי עַמָּם
  choice: vor den Augen der Angehörigen ihres Volkes
  rationale: Die sichtbare Öffentlichkeit des Urteils und der soziale Bezug der hebräischen Wendung werden in natürlichem Deutsch ausgedrückt.
- source_word: גִּלָּה
  choice: hat ... aufgedeckt
  rationale: Dies bewahrt den wiederkehrenden Ausdruck „die Blöße aufdecken“ in den Inzestbestimmungen des Levitikus.
- source_word: עֲוֺנוֹ יִשָּׂא
  choice: er soll seine Schuld tragen
  rationale: Die rechtlich-theologische Formel umfasst Schuld und deren Folgen, ohne sie auf eine bestimmte Strafe zu verengen.
theological_decisions:
- issue: Bedeutung von חֶסֶד in diesem Vers
  choice: 'negative Bedeutung: „Schandtat“'
  alternative: die sonst übliche positive Bedeutung „Güte“ oder „Treue“
  rationale: Der Zusammenhang einer verbotenen sexuellen Verbindung und des folgenden Urteils verlangt hier die seltene negative Bedeutung.
- issue: Bedeutung der כרת-Strafe
  choice: die Formel „ausgerottet werden“ ohne nähere Bestimmung bewahren
  alternative: Hinrichtung, Ausschluss aus der Gemeinschaft oder eine andere Form der Beseitigung ausdrücklich nennen
  rationale: Der hebräische Rechtssatz legt den genauen Vollzug hier nicht fest. Die Übersetzung bewahrt diese Unbestimmtheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräischen Rechts- und Körpermetaphern werden weitgehend bewahrt; ungebräuchliche oder missverständliche Formeln werden durch Fußnoten erläutert.
