  text: וִ/הְיִ֤יתֶם לִ/י֙ קְדֹשִׁ֔ים כִּ֥י קָד֖וֹשׁ אֲנִ֣י יְהוָ֑ה וָ/אַבְדִּ֥ל אֶתְ/כֶ֛ם מִן הָֽ/עַמִּ֖ים לִ/הְי֥וֹת לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/026.yaml
  text: You shall be holy to me[a], because I, Yahweh, am holy, and I have separated you from the peoples to be mine.
translation:
  language: de
  text: Ihr sollt mir heilig sein, denn ich, Jahwe, bin heilig. Ich habe euch von den Völkern[a] abgesondert, damit ihr mir gehört.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Nationen. Das hebräische Wort עַמִּים kann „Völker“ oder in manchen Zusammenhängen „Nationen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִהְיִיתֶם לִי קְדֹשִׁים
  choice: Ihr sollt mir heilig sein
  rationale: Die Verbform hat hier im gesetzlichen Mahnkontext verpflichtende bzw. resultative Bedeutung. „Mir heilig“ bewahrt sowohl die Beziehung zu Gott als auch den umfassenden Sinn von קדוש, ohne ihn auf Moral oder Kult zu verengen.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt die Begründung für Israels Heiligkeit ein; „denn“ ist in würdigem modernem Deutsch natürlich und wahrt den kausalen Zusammenhang.
- source_word: קָדוֹשׁ
  choice: heilig
  rationale: Die gleiche Wiedergabe wie beim auf Israel bezogenen קְדֹשִׁים erhält die ausdrücklich begründende Verbindung zwischen Jahwes Heiligkeit und der Heiligkeit seines Volkes.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וָאַבְדִּל אֶתְכֶם
  choice: Ich habe euch … abgesondert
  rationale: בדל bezeichnet das Trennen bzw. Absondern. Das Perfekt gibt eine vollzogene göttliche Handlung mit fortdauernder Bedeutung wieder; „abgesondert“ hält zudem den lexikalischen Unterschied zu קדש („heilig“) fest.
- source_word: מִן הָעַמִּים
  choice: von den Völkern
  rationale: עַמִּים bezeichnet hier mehrere Menschengruppen bzw. Völker. „Völker“ ist im Deutschen die natürliche, hinreichend breite Entsprechung.
- source_word: לִהְיוֹת לִי
  choice: damit ihr mir gehört
  rationale: Die Infinitivkonstruktion drückt Zweck bzw. Ergebnis der Absonderung aus. „Damit ihr mir gehört“ gibt das Zugehörigkeitsverhältnis natürlich wieder, ohne es auf bloßen Besitz zu reduzieren.
theological_decisions:
- issue: Israels Heiligkeit weder ausschließlich moralisch noch ausschließlich kultisch zu verstehen
  choice: קדש mit „heilig“ und בדל gesondert mit „absondern“ wiedergeben
  alternative: קדש durchgehend als „ausgesondert“ oder moralisch verengt als „rein“ wiedergeben
  rationale: Der Vers verbindet die Heiligkeit Israels mit Jahwes eigener Heiligkeit und verwendet zusätzlich בדל für die Absonderung von den Völkern. Verschiedene deutsche Wörter bewahren diese Spannung und den Unterschied der hebräischen Begriffe.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Zweck bzw. Ergebnis der Absonderung
  choice: „damit ihr mir gehört“
  alternative: „um mein zu sein“; „damit ihr für mich da seid“
  rationale: Die Formulierung wahrt die Bundeszugehörigkeit und lässt die Konstruktion als Zweck beziehungsweise angestrebtes Ergebnis verständlich werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Ihr sollt“ bewahrt den verpflichtenden Bundesklang; „abgesondert“ ist bewusst etwas gehobener, aber allgemein verständlich und unterscheidet בדל von „heilig“. Der Vers wurde zur natürlichen deutschen Satzführung in zwei Sätze gegliedert.
