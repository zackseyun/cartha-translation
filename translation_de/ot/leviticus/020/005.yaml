source:
  edition: WLC
  text: וְ/שַׂמְתִּ֨י אֲנִ֧י אֶת פָּנַ֛/י בָּ/אִ֥ישׁ הַ/ה֖וּא וּ/בְ/מִשְׁפַּחְתּ֑/וֹ וְ/הִכְרַתִּ֨י אֹת֜/וֹ וְ/אֵ֣ת כָּל הַ/זֹּנִ֣ים אַחֲרָ֗י/ו לִ/זְנ֛וֹת אַחֲרֵ֥י הַ/מֹּ֖לֶךְ מִ/קֶּ֥רֶב עַמָּֽ/ם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/005.yaml
  text: then I myself will set my face against that man and against his family[a], and I will cut off him and all who prostitute themselves after him by prostituting themselves after Molech[b], from among their people.
translation:
  language: de
  text: Dann werde ich selbst mein Angesicht gegen diesen Mann und gegen seine Familie[a] richten. Ich werde ihn und alle, die ihm nachhuren, indem sie dem Moloch nachhuren[c], aus der Mitte ihres Volkes tilgen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Sippe“ beziehungsweise „seinen Familienverband“. Das hebräische Wort kann eine größere Verwandtschaftsgruppe bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Tilgen“ ist hier ein Ausdruck des Bundesgerichts. Der Vers legt nicht fest, ob dies durch Tod, Ausschluss oder eine andere Form göttlicher Entfernung geschieht.
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Verb bezeichnet eigentlich sexuelle Untreue und wird hier als bewusst scharfe Metapher für den Abfall zu einem fremden Gott gebraucht.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי אֲנִי אֶת־פָּנַי
  choice: Dann werde ich selbst mein Angesicht … richten
  rationale: Die Wendung bewahrt das hebräische Bild des gegen jemanden gerichteten Angesichts; „selbst“ gibt die Hervorhebung durch אֲנִי wieder. „Gegen“ macht den feindlichen Gerichtssinn im Deutschen eindeutig.
- source_word: בָּאִישׁ הַהוּא
  choice: gegen diesen Mann
  rationale: אִישׁ bezeichnet hier den einzelnen männlichen Täter; „diesen Mann“ entspricht der bestimmten hebräischen Form.
- source_word: וּבְמִשְׁפַּחְתּוֹ
  choice: und gegen seine Familie
  rationale: מִשְׁפָּחָה kann Familie, Großfamilie oder Sippe bezeichnen. „Familie“ ist gegenwärtiges, verständliches Deutsch; die mögliche größere Verwandtschaftsgruppe wird in der Fußnote kenntlich gemacht.
- source_word: וְהִכְרַתִּי אֹתוֹ
  choice: Ich werde ihn … aus der Mitte ihres Volkes tilgen
  rationale: Die Formulierung gibt die Entfernung durch göttliches Bundesgericht wieder, ohne im Haupttext ausdrücklich festzulegen, auf welche Weise sie erfolgt. Die Satzteilung sorgt im Deutschen für Klarheit.
- source_word: וְאֵת כָּל־הַזֹּנִים אַחֲרָיו לִזְנוֹת אַחֲרֵי הַמֹּלֶךְ
  choice: und alle, die ihm nachhuren, indem sie dem Moloch nachhuren
  rationale: „Nachhuren“ erhält die absichtlich anstößige Metapher sexueller Untreue für Götzendienst sowie die Wiederholung des hebräischen Verbs. „Ihm“ gibt den maskulinen Singularbezug von אַחֲרָיו wieder; der folgende Ausdruck benennt Moloch ausdrücklich als Ziel der abtrünnigen Verehrung.
- source_word: הַמֹּלֶךְ
  choice: Moloch
  rationale: Im Zusammenhang wird die Form traditionell als Name der mit Kinderopfern verbundenen Gottheit verstanden. Die im Deutschen übliche Namensform lautet „Moloch“.
- source_word: מִקֶּרֶב עַמָּם
  choice: aus der Mitte ihres Volkes
  rationale: Die wörtlich nahe Wendung bewahrt das Bild der Entfernung aus der Gemeinschaft. Das pluralische Suffix wird mit „ihres“ wiedergegeben und bezieht sich auf den Mann und alle, die ihm folgen.
theological_decisions:
- issue: Metapher sexueller Untreue für Götzendienst
  choice: Die Metapher wird mit „nachhuren“ ausdrücklich beibehalten.
  alternative: „untreu werden“, „Götzendienst treiben“ oder „sich … zuwenden“
  rationale: זנה kennzeichnet den Götzendienst bewusst als schwere, ehebruchartige Verletzung der Bundestreue. Eine neutrale Umschreibung würde die rhetorische und theologische Schärfe abschwächen.
- issue: Bedeutung des Bundesgerichtsausdrucks הכרת
  choice: „aus der Mitte ihres Volkes tilgen“, ergänzt durch eine Fußnote zur offenen Vollzugsweise
  alternative: „töten“, „aus der Gemeinschaft ausschließen“ oder „vernichten“
  rationale: Der Vers kündigt göttliche Entfernung aus dem Volk an, bestimmt an dieser Stelle aber nicht ausdrücklich, ob sie durch Tod, Ausschluss oder eine andere Form des Gerichts vollzogen wird.
- issue: Mitbetroffenheit der Familie
  choice: Die Familie wird ohne nähere Erklärung des Grundes als Gegenstand des göttlichen Gerichts genannt.
  alternative: Die Familie als ausdrücklich mitschuldig oder als bloß mitbetroffen deuten.
  rationale: Der Ausgangstext erklärt hier weder Art noch Grundlage ihrer Einbeziehung. Die Übersetzung vermeidet deshalb eine zusätzliche dogmatische Festlegung.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, schriftsprachlichem Register. Das traditionelle Körperbild „mein Angesicht gegen … richten“ bleibt erhalten, während Satzteilung und Syntax die Verständlichkeit fördern. Das ungewöhnliche und harte „nachhuren“ ist wegen der zweimaligen, theologisch gewichtigen זנה-Metapher bewusst gewählt; die Fußnote erläutert den übertragenen Sinn.
