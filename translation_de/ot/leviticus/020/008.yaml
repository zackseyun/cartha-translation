  text: וּ/שְׁמַרְתֶּם֙ אֶת חֻקֹּתַ֔/י וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם אֲנִ֥י יְהוָ֖ה מְקַדִּשְׁ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/008.yaml
  text: You shall keep my statutes and do them. I am Yahweh[a], who sanctifies you.
translation:
  language: de
  text: Haltet meine Satzungen und richtet euch nach ihnen. Ich bin Jahwe, der euch heiligt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der euch heilig macht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Haltet
  rationale: שׁמר bezeichnet hier das Beachten und Bewahren verbindlicher Vorschriften. „Haltet“ ist im deutschen Rechts- und Bundeskontext natürlich und prägnant; das anknüpfende ו wird nicht eigens wiedergegeben, weil der Vers auf Deutsch ohne einleitendes „Und“ flüssiger einsetzt.
- source_word: חֻקֹּתַי
  choice: meine Satzungen
  rationale: חֻקָּה meint festgesetzte Bestimmungen. „Satzungen“ bewahrt den rechtlichen Charakter und unterscheidet den Ausdruck von anderen Begriffen für Gebot oder Recht.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: und richtet euch nach ihnen
  rationale: עשה mit gesetzlichen Bestimmungen fordert deren praktische Ausführung. Die idiomatische Wendung „sich nach ihnen richten“ gibt dies in natürlichem Deutsch wieder und vermeidet das schwerfällige „tut sie“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Text enthält den Gottesnamen JHWH. „Jahwe“ gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: מְקַדִּשְׁכֶם
  choice: der euch heiligt
  rationale: Das Partizip der Pi'el-Form von קדשׁ beschreibt Jahwe als den, der sein Volk heiligt beziehungsweise heilig macht. „Heiligt“ bewahrt die zentrale Heiligkeitsterminologie und den fortdauernden beziehungsweise charakteristischen Aspekt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Da der Ausgangstext den Eigennamen verwendet, bleibt er auch in der Übersetzung als Name erkennbar und wird nicht durch einen Herrschaftstitel ersetzt.
- issue: Bedeutungsumfang von מְקַדִּשְׁכֶם
  choice: der euch heiligt
  alternative: der euch heilig macht
  rationale: „Heiligt“ wahrt den Zusammenhang mit der biblischen Heiligkeitssprache; die Fußnote nennt die verständlichere, semantisch eng entsprechende Alternative, ohne die göttliche Initiative abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Rechtsterminus „Satzungen“ und das theologisch tragende Verb „heiligt“ bleiben erhalten; „richtet euch nach ihnen“ formuliert die geforderte praktische Befolgung natürlich und verständlich.
