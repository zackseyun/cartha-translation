base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: de
  text: 'Und Jahwe sprach zu Mose[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: sprach
  rationale: Das Wayyiqtol der Piel-Form von דבר eröffnet eine neue Redeeinheit; „sprach“ gibt die feierliche, formelhafte Einleitung im Deutschen treffend wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, um den im Hebräischen stehenden Eigennamen zu bewahren statt ihn durch einen Titel zu ersetzen.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition kennzeichnet hier den Adressaten der Rede; „zu“ ist in der deutschen Wendung „zu jemandem sprechen“ idiomatisch.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: „Mose“ ist die etablierte deutsche Form des hebräischen Personennamens מֹשֶׁה.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv לֵאמֹר leitet den folgenden Redeinhalt ein. Im natürlichen modernen Deutsch erfüllt der Doppelpunkt diese Funktion präziser als das schwerfällige „indem er sagte“ oder „mit den Worten“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen; die traditionelle Ersatzlesung „der HERR“ wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die formelhafte Redeeinleitung bleibt erkennbar; לֵאמֹר wird idiomatisch durch einen Doppelpunkt ausgedrückt.
