  text: וְ/אֶל בְּנֵ֣י יִשְׂרָאֵ֘ל תֹּאמַר֒ אִ֣ישׁ אִישׁ֩ מִ/בְּנֵ֨י יִשְׂרָאֵ֜ל וּ/מִן הַ/גֵּ֣ר הַ/גָּ֣ר בְּ/יִשְׂרָאֵ֗ל אֲשֶׁ֨ר יִתֵּ֧ן מִ/זַּרְע֛/וֹ לַ/מֹּ֖לֶךְ מ֣וֹת יוּמָ֑ת עַ֥ם הָ/אָ֖רֶץ יִרְגְּמֻ֥/הוּ בָ/אָֽבֶן־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/002.yaml
  text: 'And you shall say to the sons of Israel: Any man from the sons of Israel[a], or from the sojourner who sojourns in Israel, who gives any of his offspring to Molech shall surely be put to death[c][b]; the people of the land shall stone him with stones.'
translation:
  language: de
  text: 'Zu den Israeliten sollst du sagen: Jeder Israelit und jeder Fremde, der in Israel lebt,[a] der eines seiner Kinder[b] dem Moloch gibt,[c] muss unbedingt getötet werden. Das Volk des Landes soll ihn steinigen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »der Fremde, der sich als Fremder in Israel aufhält«. Gemeint ist ein ausländischer Einwohner, der in Israel lebt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »von seinem Samen«; damit sind hier seine Nachkommen beziehungsweise Kinder gemeint.'
    reason: lexical_alternative
  - marker: c
    text: Moloch wird traditionell als eine mit Kinderopfern verbundene Gottheit verstanden. Manche deuten das hebräische Wort stattdessen als Bezeichnung für eine bestimmte Opferart.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die hebräische Wendung bedeutet wörtlich »Söhne Israels«. »Israeliten« gibt ihre geläufige kollektive Bedeutung im modernen Deutschen natürlich und präzise wieder.
- source_word: אִישׁ אִישׁ
  choice: Jeder
  rationale: Die Verdoppelung ist distributiv und bedeutet »jeder Einzelne« bzw. »wer auch immer«. »Jeder« bewahrt den Einzelfallcharakter der Rechtsbestimmung, ohne im Deutschen schwerfällig zu wirken.
- source_word: הַגֵּר הַגָּר
  choice: die Fremden, die in Israel leben
  rationale: גֵּר bezeichnet hier einen ansässigen Fremden. Die Wiedergabe ist idiomatisch; die Verbindung von Substantiv und stammverwandtem Verb wird in der Fußnote kenntlich gemacht.
- source_word: יִתֵּן מִזַּרְעוֹ לַמֹּלֶךְ
  choice: eines seiner Kinder dem Moloch gibt
  rationale: זֶרַע bedeutet wörtlich »Samen« und bezeichnet hier die Nachkommenschaft. »Eines seiner Kinder« ist im Kontext verständlich und lässt »gibt« bewusst ohne eine über den Vers hinausgehende Beschreibung des kultischen Vorgangs stehen.
- source_word: לַמֹּלֶךְ
  choice: dem Moloch
  rationale: Die traditionelle und naheliegende Lesart versteht מֹלֶךְ als Bezeichnung bzw. Namen einer Gottheit. Die mögliche Deutung als Opferbezeichnung wird in der Fußnote bewahrt.
- source_word: מוֹת יוּמָת
  choice: muss mit dem Tod bestraft werden
  rationale: Die Verbindung aus absolutem Infinitiv und finitem Verb verstärkt die zwingende Todesstrafe. Die passive Form weist auf eine vollstreckte gerichtliche Strafe, nicht bloß auf das Eintreten des Todes.
- source_word: עַם הָאָרֶץ
  choice: das Volk des Landes
  rationale: Die formnahe Wiedergabe bewahrt den Ausdruck, ohne ihn als spätere soziologische Fachbezeichnung umzudeuten; im Zusammenhang ist die Gemeinschaft gemeint, die das Urteil vollstreckt.
- source_word: יִרְגְּמֻהוּ בָאָבֶן
  choice: soll ihn steinigen
  rationale: Das deutsche Verb »steinigen« enthält das im Hebräischen ausdrücklich genannte Tatmittel bereits und gibt die rechtliche Vollstreckung natürlich wieder.
theological_decisions:
- issue: Bedeutung der Moloch-Handlung
  choice: Der Haupttext spricht davon, ein Kind »dem Moloch« zu geben, und versteht Moloch als Namen bzw. Bezeichnung einer Gottheit.
  alternative: מֹלֶךְ kann als Bezeichnung einer bestimmten Opferart verstanden werden.
  rationale: Der Vers selbst erläutert weder den genauen Vollzug noch erwähnt er an dieser Stelle ausdrücklich Feuer. Daher wird keine ausführlichere Deutung wie »als Brandopfer darbringen« in den Haupttext eingefügt; die echte Auslegungsalternative bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Rechtssprache. Die Satzstruktur bleibt dem hebräischen Rechtssatz erkennbar nahe, wird aber durch »ob … oder« und eine idiomatische Wiedergabe des ansässigen Fremden für heutige Leser verständlich. Die kultische Mehrdeutigkeit wird nicht im Haupttext aufgelöst.
