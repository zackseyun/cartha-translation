base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/012.yaml
  text: If a man lies with his daughter-in-law[a], both of them shall surely be put to death. They have committed perversion[b]; their blood is upon them.
translation:
  language: de
  text: Wenn ein Mann mit seiner Schwiegertochter schläft, müssen beide unbedingt getötet werden. Sie haben eine Schandtat[a] begangen. Ihr Blut ist auf ihnen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Verkehrtheit“ oder „Verwirrung“. Das seltene hebräische Wort תֶּבֶל bezeichnet hier eine schwere, moralisch verwerfliche und ordnungswidrige Tat.'
    reason: lexical_alternative
  - marker: b
    text: 'Das hebräische Rechtsidiom besagt, dass sie selbst die Verantwortung für ihren Tod tragen; auch möglich: „Ihre Blutschuld liegt auf ihnen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: Wenn ein Mann
  rationale: Die Verbindung leitet im rechtlichen Zusammenhang einen Wenn-Fall ein. „Mann“ gibt das grammatisch und sachlich männliche אִישׁ genau wieder.
- source_word: יִשְׁכַּב אֶת
  choice: mit … schläft
  rationale: Die Wendung bezeichnet hier Geschlechtsverkehr. Die deutsche Formulierung bewahrt das Bild des Hebräischen und ist zugleich allgemein verständlich.
- source_word: כַּלָּתוֹ
  choice: seiner Schwiegertochter
  rationale: כַּלָּה bezeichnet hier die Frau des eigenen Sohnes; „Schwiegertochter“ ist die genaue deutsche Verwandtschaftsbezeichnung.
- source_word: מוֹת יוּמְתוּ שְׁנֵיהֶם
  choice: müssen beide getötet werden
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb drückt die verbindliche Todesstrafe mit Nachdruck aus. Das deutsche „müssen“ vermittelt diese zwingende Rechtsfolge natürlich und knapp.
- source_word: תֶּבֶל
  choice: schändliche Verirrung
  rationale: Das seltene Wort kennzeichnet die Tat als moralisch verwerflich und als eine Verkehrung geordneter Beziehungen. Die Formulierung bewahrt diese beiden Bedeutungsanteile, ohne eine moderne fachsprachliche Kategorie einzutragen.
- source_word: עָשׂוּ
  choice: haben … begangen
  rationale: Bei der Bezeichnung einer verwerflichen Tat ist „begehen“ im Deutschen idiomatischer als das wörtliche „tun“.
- source_word: דְּמֵיהֶם בָּם
  choice: Ihr Blut ist auf ihnen
  rationale: Die Wiedergabe bewahrt das knappe hebräische Rechtsidiom, das ihnen selbst die Verantwortung für ihren Tod zuschreibt.
theological_decisions:
- issue: Geschlecht des Rechtssubjekts
  choice: „Mann“
  alternative: „jemand“ oder „eine Person“
  rationale: Der hebräische Text nennt ausdrücklich einen männlichen Täter und beschreibt das Verhältnis zu seiner Schwiegertochter. Eine geschlechtsneutrale Wiedergabe würde diese Angabe abschwächen.
- issue: Moralische Kennzeichnung durch תֶּבֶל
  choice: „schändliche Verirrung“
  alternative: „Verkehrtheit“, „Schandtat“ oder „Verwirrung“
  rationale: Der Ausgangstext verurteilt die Tat mit einem seltenen, bedeutungsreichen Ausdruck. Die Übersetzung erhält sowohl die moralische Wertung als auch den Gedanken einer verkehrten Ordnung, ohne die Spannung auf nur einen Bedeutungsaspekt zu reduzieren.
- issue: Bedeutung der Blutformel
  choice: Das Bild „Ihr Blut ist auf ihnen“ bleibt im Haupttext erhalten.
  alternative: „Sie tragen selbst die Verantwortung für ihren Tod“ oder „Ihre Blutschuld liegt auf ihnen“
  rationale: Die hebräische Formel spricht bildhaft von ihrem Blut und weist ihnen die Verantwortung für die verhängte Todesfolge zu. Eine erklärende Auflösung wäre verständlicher, aber stärker interpretierend.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper Rechtssprache. Die sexuelle Wendung bleibt entsprechend dem hebräischen Idiom zurückhaltend, aber verständlich. Die seltene moralische Bezeichnung und die Blutformel werden nicht vollständig erklärend aufgelöst; Fußnoten dokumentieren die echte lexikalische und idiomatische Spannung.
