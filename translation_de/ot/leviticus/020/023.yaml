source:
  edition: WLC
  text: וְ/לֹ֤א תֵֽלְכוּ֙ בְּ/חֻקֹּ֣ת הַ/גּ֔וֹי אֲשֶׁר אֲנִ֥י מְשַׁלֵּ֖חַ מִ/פְּנֵי/כֶ֑ם כִּ֤י אֶת כָּל אֵ֨לֶּה֙ עָשׂ֔וּ וָ/אָקֻ֖ץ בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/023.yaml
  text: And you shall not walk in the statutes of the nation that I am driving out before you[a], because they did all these things[c][b], and I loathed them.
translation:
  language: de
  text: Ihr sollt nicht nach den Ordnungen des Volkes leben, das ich vor euch vertreibe[a]. Denn sie haben all diese Dinge getan, und ich verabscheute sie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »von eurem Angesicht wegschicke«; gemeint ist die Vertreibung aus dem Land.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: »und ich empfand Abscheu vor ihnen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵלְכוּ בְּחֻקֹּת
  choice: nach den Ordnungen … leben
  rationale: Die wörtliche Wendung »in den Satzungen gehen« bezeichnet die Lebensführung nach festgelegten Normen. Die deutsche Formulierung bewahrt den normativen Gehalt und gibt das hebräische Idiom natürlich wieder.
- source_word: הַגּוֹי
  choice: das Volk
  rationale: Das Substantiv steht im Singular und bezeichnet hier kollektiv die kanaanäische Bevölkerung. »Volk« ist im Deutschen natürlicher als »Nation« und trägt keine späteren fachtheologischen Nebenbedeutungen ein.
- source_word: מְשַׁלֵּחַ מִפְּנֵיכֶם
  choice: vor euch vertreibe
  rationale: שׁלח bedeutet grundsätzlich »senden/wegschicken«, bezeichnet mit »vor euch« in diesem Zusammenhang jedoch die Vertreibung aus dem Land.
- source_word: כִּי אֶת כָּל אֵלֶּה עָשׂוּ
  choice: Denn sie haben all diese Dinge getan
  rationale: כִּי begründet hier das Verbot. »All diese Dinge« verweist auf die zuvor genannten Praktiken.
- source_word: וָאָקֻץ בָּם
  choice: und ich verabscheute sie
  rationale: Das Verb קוץ drückt starke Abscheu oder Widerwillen aus. »Verabscheute« erhält diese Intensität in würdigem, verständlichem Deutsch; בָּם bezeichnet die Betroffenen als Gegenstand der Abscheu.
theological_decisions:
- issue: Göttliche Abscheu und Bezug des Pronomens
  choice: und ich verabscheute sie
  alternative: und mir ekelte vor ihnen / und ich empfand Abscheu vor ihnen
  rationale: Die starke affektive Aussage wird nicht zu bloßer Missbilligung abgeschwächt. Das maskuline Pluralpronomen bezieht sich grammatisch am ehesten auf die Menschen des genannten Volkes, obwohl ihre zuvor genannten Taten den ausdrücklichen Anlass bilden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das ungebräuchliche hebräische Bild »in den Satzungen gehen« wird idiomatisch als »nach den Ordnungen leben« wiedergegeben; die starke Sprache der göttlichen Abscheu bleibt erhalten.
