base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/022.yaml
  text: So you shall keep all my statutes and all my judgments and do them[b][a], so that the land to which I am bringing you to dwell in it may not vomit you out.
translation:
  language: de
  text: Haltet daher alle meine Satzungen und alle meine Rechtsbestimmungen[b] und befolgt sie, damit das Land, in das ich euch bringe, damit ihr darin wohnt, euch nicht ausspeit[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb bedeutet wörtlich „erbrechen“. Es zeichnet das Land bildhaft als jemanden, der verunreinigte Bewohner ausstößt.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „meine Ordnungen und meine Rechtsentscheide“. Im Hebräischen stehen zwei verschiedene Rechtsbegriffe: חֻקּוֹת und מִשְׁפָּטִים.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Darum haltet
  rationale: שׁמר bezeichnet im rechtlich-bundestheologischen Zusammenhang das Beachten und Befolgen. Der Imperativ gibt die verpflichtende Aussage natürlich wieder; „Darum“ stellt den folgernden Anschluss an die vorausgehende Warnung her.
- source_word: חֻקֹּתַי
  choice: meine Satzungen
  rationale: חֻקָּה bezeichnet festgesetzte Vorschriften. „Satzungen“ bewahrt den formellen Rechtsklang und unterscheidet den Ausdruck von מִשְׁפָּטִים.
- source_word: מִשְׁפָּטַי
  choice: meine Rechtsbestimmungen
  rationale: מִשְׁפָּט kann Urteil, Rechtsentscheid oder rechtliche Bestimmung bedeuten. „Rechtsbestimmungen“ ist im modernen Deutsch verständlich und hält die beiden hebräischen Rechtsbegriffe auseinander.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: und handelt danach
  rationale: עשה mit Rechtsvorschriften als Objekt bedeutet, sie auszuführen oder zu befolgen. „Handelt danach“ ist natürlicher als das wörtliche „tut sie“, ohne den verpflichtenden Sinn abzuschwächen.
- source_word: וְלֹא תָקִיא אֶתְכֶם
  choice: damit ... euch nicht ausspeit
  rationale: קיא bedeutet wörtlich „erbrechen“ beziehungsweise „ausspeien“. „Ausspeien“ erhält das drastische Bild der Ausstoßung und funktioniert idiomatisch mit dem personifizierten Land.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: אֶרֶץ bezeichnet hier das Land, in das Israel gebracht wird, nicht allgemein die Erde.
- source_word: אֲשֶׁר אֲנִי מֵבִיא אֶתְכֶם שָׁמָּה
  choice: in das ich euch bringe
  rationale: Die Zielrichtung des Hineinbringens wird im Deutschen idiomatisch mit „in das“ ausgedrückt. Das Partizip מֵבִיא stellt Gottes Handeln als im Vollzug beziehungsweise fest beabsichtigt dar.
- source_word: לָשֶׁבֶת בָּהּ
  choice: damit ihr darin wohnt
  rationale: ישׁב bedeutet hier wohnen beziehungsweise ansässig sein. Der deutsche Zwecksatz gibt die Funktion des Infinitivs verständlich und würdig wieder.
theological_decisions:
- issue: Bildhafte Ausstoßung durch das Land
  choice: Das Land wird personifiziert und kann seine verunreinigten Bewohner „ausspeien“.
  alternative: Das Land wird euch vertreiben oder abweisen.
  rationale: Die konkrete Metapher des hebräischen Textes verbindet Verunreinigung mit Vertreibung. Eine abstrakte Wiedergabe würde die Schärfe der Bundeswarnung mindern.
- issue: Unterscheidung von חֻקּוֹת und מִשְׁפָּטִים
  choice: „Satzungen“ und „Rechtsbestimmungen“
  alternative: „Gebote“ und „Vorschriften“
  rationale: Zwei unterschiedliche deutsche Begriffe spiegeln die zwei hebräischen Rechtsausdrücke, ohne eine starre systematische Trennung zu behaupten, die der Vers selbst nicht erklärt.
- issue: Zusammenhang zwischen Gehorsam und Verbleib im Land
  choice: „damit“ gibt die warnende Zweck- beziehungsweise Folgerelation wieder.
  alternative: „und dann wird das Land euch nicht ausspeien“
  rationale: Die Konstruktion lässt eine enge Zweck- oder Folgerelation erkennen. Die Übersetzung wahrt diesen Zusammenhang, ohne eine über den Text hinausgehende Lehrformel daraus zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt dem hebräischen Gedankengang nahe, wird aber durch einen idiomatischen Relativ- und Zwecksatz geglättet. Das drastische Bild des ausspeienden Landes bleibt bewusst erhalten.
