source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֥ר יִקַּ֛ח אֶת אֵ֥שֶׁת אָחִ֖י/ו נִדָּ֣ה הִ֑וא עֶרְוַ֥ת אָחִ֛י/ו גִּלָּ֖ה עֲרִירִ֥ים יִהְיֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/021.yaml
  text: And if a man takes his brother’s wife[a], it is uncleanness; he has uncovered his brother’s nakedness[b]. They shall be childless.
translation:
  language: de
  text: Und wenn ein Mann die Frau seines Bruders nimmt, ist das eine Unreinheit[a]. Er hat die Blöße seines Bruders aufgedeckt. Sie werden kinderlos sein[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Das ist eine Verunreinigung“ beziehungsweise „etwas Unreines“. Das hebräische Wort kann Unreinheit im kultisch-sittlichen Sinn bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Sie werden kinderlos sterben.“ Wörtlicher heißt es im Hebräischen: „Sie werden kinderlos sein“; wie dieses Urteil eintritt, wird nicht ausdrücklich gesagt.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: Und wenn ein Mann
  rationale: Die Verbindung aus וְ, אִישׁ und dem Relativsatz mit Imperfekt führt einen weiteren Rechtsfall ein. Die bedingte Formulierung ist im Deutschen natürlich und bewahrt den Zusammenhang mit den vorangehenden Bestimmungen.
- source_word: יִקַּח
  choice: nimmt
  rationale: לקח bedeutet wörtlich „nehmen“ und kann im Ehekontext die Aufnahme einer Frau als Ehefrau bezeichnen. „Nimmt“ bewahrt hier die knappe Ausdrucksweise, ohne eine bestimmte rechtliche Form der Eheschließung ausdrücklich hinzuzufügen.
- source_word: אֵשֶׁת אָחִיו
  choice: die Frau seines Bruders
  rationale: Die Status-constructus-Verbindung bezeichnet eindeutig die Ehefrau seines Bruders.
- source_word: נִדָּה הִוא
  choice: ist das Unreinheit
  rationale: נִדָּה bezeichnet kultisch-sittliche Unreinheit und kann hier die Verbindung beziehungsweise Handlung qualifizieren. Das neutrale „das“ vermeidet, die Frau selbst als unrein zu bezeichnen.
- source_word: עֶרְוַת אָחִיו גִּלָּה
  choice: Er hat die Blöße seines Bruders aufgedeckt
  rationale: Die wörtlich bewahrte levitische Rechtsformel bezeichnet unerlaubten Geschlechtsverkehr und erhält die Verbindung zu den verwandten Verboten im Buch.
- source_word: עֲרִירִים יִהְיוּ
  choice: Sie werden kinderlos sein
  rationale: Das pluralische עֲרִירִים bezeichnet beide Beteiligten als ohne Kinder; יִהְיוּ sagt aus, dass sie so sein werden. Die Formulierung nennt weder ausdrücklich ihren Tod noch die Art, wie das Urteil eintritt.
theological_decisions:
- issue: Bedeutung und Vollzug von עֲרִירִים יִהְיוּ
  choice: Sie werden kinderlos sein
  alternative: Sie werden kinderlos sterben
  rationale: Der hebräische Wortlaut nennt Kinderlosigkeit, aber nicht ausdrücklich den Tod oder den genauen Vollzug des Urteils. Die Übersetzung lässt diese Spannung bestehen.
- issue: Bezug von נִדָּה הִוא
  choice: Die Verbindung beziehungsweise Handlung ist Unreinheit
  alternative: Die Frau ist unrein
  rationale: Das feminine Pronomen stimmt zwar grammatisch mit נִדָּה überein, doch die Aussage kann prädikativ den geschilderten Tatbestand bewerten. Die deutsche Wiedergabe vermeidet eine unnötige Festlegung auf eine persönliche Verunreinigung der Frau.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die levitische Formel „die Blöße … aufdecken“ bleibt wegen ihrer rechtlichen und intertextuellen Bedeutung erhalten. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
