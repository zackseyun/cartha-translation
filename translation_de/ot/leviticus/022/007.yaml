  edition: WLC
  text: וּ/בָ֥א הַ/שֶּׁ֖מֶשׁ וְ/טָהֵ֑ר וְ/אַחַר֙ יֹאכַ֣ל מִן הַ/קֳּדָשִׁ֔ים כִּ֥י לַחְמ֖/וֹ הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/007.yaml
  text: When the sun has set, he will be clean; and afterward he may eat from the holy things, because they are his food.
translation:
  language: de
  text: Wenn die Sonne untergegangen ist, ist er rein. Danach darf er von den heiligen Dingen[a] essen, denn das ist seine Nahrung[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »von den heiligen Gaben« beziehungsweise »von den heiligen Opfergaben«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »denn es ist sein Brot«. »Brot« bezeichnet hier seine ihm zustehende Nahrung aus den heiligen Anteilen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא הַשֶּׁמֶשׁ
  choice: Wenn die Sonne untergegangen ist
  rationale: Die wörtliche Wendung »die Sonne kommt« bezeichnet idiomatisch den Sonnenuntergang. Die temporale Formulierung gibt den Zeitpunkt der wiedererlangten Reinheit im Deutschen natürlich wieder.
- source_word: וְטָהֵר
  choice: ist er rein
  rationale: Das Verb bezeichnet hier im kultischen Zusammenhang die wiedererlangte rituelle Reinheit. Die knappe Form wahrt den Folgezusammenhang, ohne moralische Reinheit hineinzulesen.
- source_word: וְאַחַר
  choice: Danach
  rationale: Das Adverb kennzeichnet den nächsten Schritt in der geregelten Abfolge und wird im modernen Deutsch prägnant wiedergegeben.
- source_word: יֹאכַל
  choice: darf er … essen
  rationale: Im rechtlichen Zusammenhang drückt die Imperfektform die nach erfolgter Reinigung wieder bestehende Erlaubnis aus.
- source_word: מִן הַקֳּדָשִׁים
  choice: von den heiligen Dingen
  rationale: Die transparente Wiedergabe bewahrt die substantivierte Mehrzahl und legt sich nicht unnötig auf »Opfergaben« fest, obwohl diese im Kontext gemeint sein können.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung für die Erlaubnis ein; »denn« ist in diesem Satz klar und stilistisch angemessen.
- source_word: לַחְמוֹ הוּא
  choice: das ist seine Nahrung
  rationale: לֶחֶם bedeutet wörtlich »Brot«, kann aber umfassender Nahrung oder Lebensunterhalt bezeichnen. Das deutsche »das« bewahrt die singularische hebräische Konstruktion und bezieht sich natürlich auf den zuvor genannten heiligen Anteil als Nahrung.
theological_decisions:
- issue: Art der Reinheit
  choice: rituelle Reinheit
  alternative: moralische oder geistliche Reinheit
  rationale: Levitikus 22 regelt den Zugang eines Priesters zu heiliger Nahrung nach einem Zustand kultischer Unreinheit. »Rein« bleibt im Haupttext knapp; der Zusammenhang bestimmt die rituelle Bedeutung.
- issue: Bezug von לַחְמוֹ הוּא
  choice: 'singularisch-kollektiver Bezug: »das ist seine Nahrung«'
  alternative: 'pluralischer Bezug: »sie sind seine Nahrung«'
  rationale: Das Hebräische hat das singularische Pronomen הוּא und das singularische לַחְמוֹ. Die gewählte Form wahrt diese Grammatik, ohne den kollektiven Bezug auf die heiligen Dinge auszuschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau ist klar und rechtssprachlich zurückhaltend; kultische Fachbedeutungen werden nicht unnötig ausgedeutet.
