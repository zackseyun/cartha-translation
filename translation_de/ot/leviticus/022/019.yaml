  text: for your acceptance, it must be a sound male from the cattle, the sheep, or the goats.
translation:
  language: de
  text: Damit ihr Annahme findet,[a] soll es ein makelloses männliches Tier von den Rindern, Schafen oder Ziegen sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: zu eurer Annahme; auch möglich: zu eurem Wohlgefallen.'
    reason: Die knappe hebräische Wendung לִרְצֹנְכֶם kann die Annahme der Darbringenden beziehungsweise Wohlgefallen bezeichnen. Die Fußnote bewahrt diese Nuance, ohne den Bezug der Wendung auf das Tier zu verlagern.
lexical_decisions:
- source_word: לִרְצֹנְכֶם
  choice: Damit es für euch angenommen wird
  rationale: Die Wendung bezeichnet hier das Ziel, dass das Opfertier zugunsten der Darbringenden Annahme findet. Die Formulierung ist im Deutschen verständlich und bewahrt den kultischen Bezug.
- source_word: תָּמִים
  choice: makellos
  rationale: Das Wort fordert kultische Unversehrtheit beziehungsweise Fehlerlosigkeit des Opfertiers; „makellos“ ist dafür die geläufige und präzise deutsche Wiedergabe.
- source_word: זָכָר
  choice: männliches Tier
  rationale: Im Kontext der Tierarten bezeichnet das Wort das männliche Geschlecht; „männliches Tier“ klingt natürlicher als das substantivierte „ein Männliches“.
- source_word: בַּבָּקָר בַּכְּשָׂבִים וּבָעִזִּים
  choice: von den Rindern, Schafen oder Ziegen
  rationale: Die drei Tiergruppen werden direkt und idiomatisch wiedergegeben; das deutsche „oder“ macht die im Hebräischen aufgezählten Auswahlmöglichkeiten deutlich.
theological_decisions:
- issue: Bezug von לִרְצֹנְכֶם
  choice: Annahme des Opfers zugunsten der Darbringenden
  alternative: „zu eurem Wohlgefallen“ oder „nach eurem freien Willen“
  rationale: Im Opferkontext liegt die Annahmefähigkeit vor Gott näher als menschliches Gefallen oder Freiwilligkeit. Da die knappe hebräische Wendung jedoch auch anders nuanciert werden kann, wird die Alternative in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung folgt natürlichem Deutsch, während die kultische Bedingung und die drei Tiergruppen eng am hebräischen Text bleiben.
