source:
  edition: WLC
  text: וּ/בַת כֹּהֵן֩ כִּ֨י תִהְיֶ֜ה אַלְמָנָ֣ה וּ/גְרוּשָׁ֗ה וְ/זֶרַע֮ אֵ֣ין לָ/הּ֒ וְ/שָׁבָ֞ה אֶל בֵּ֤ית אָבִ֨י/הָ֙ כִּ/נְעוּרֶ֔י/הָ מִ/לֶּ֥חֶם אָבִ֖י/הָ תֹּאכֵ֑ל וְ/כָל זָ֖ר לֹא יֹ֥אכַל בּֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/013.yaml
  text: But if a priest’s daughter becomes a widow or divorced[a], and has no offspring, and returns to her father’s house as in her youth, she may eat from her father’s food[b]; but no outsider may eat of it.
translation:
  language: de
  text: Wenn aber die Tochter eines Priesters verwitwet oder geschieden ist und keine Nachkommen hat und in das Haus ihres Vaters zurückkehrt wie in ihrer Jugend, darf sie von der Speise ihres Vaters[a] essen. Doch kein Unbefugter[b] darf davon essen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vom Brot ihres Vaters“. „Brot“ kann hier umfassender die Speise des priesterlichen Haushalts bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Außenstehender“. Gemeint ist jemand, der nicht zum berechtigten priesterlichen Personenkreis gehört, nicht notwendig ein ethnisch Fremder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַת כֹּהֵן כִּי תִהְיֶה
  choice: Wenn aber die Tochter eines Priesters … wird
  rationale: Das einleitende וּ steht im Gegensatz zum vorherigen Fall; כִּי mit היה führt hier eine rechtliche Bedingung ein. „Wenn aber“ gibt diesen Zusammenhang natürlich wieder.
- source_word: אַלְמָנָה וּגְרוּשָׁה
  choice: Witwe wird oder geschieden ist
  rationale: Die beiden Bezeichnungen beschreiben alternative Lebenslagen. Im Deutschen verdeutlicht „oder“ den rechtlichen Sinn besser als ein missverständliches kumulatives „und“.
- source_word: וְזֶרַע אֵין לָהּ
  choice: und keine Nachkommen hat
  rationale: זֶרַע bedeutet wörtlich „Same“, bezeichnet hier aber Nachkommenschaft. „Nachkommen“ bewahrt den möglichen weiteren Umfang besser als „Kind“.
- source_word: וְשָׁבָה אֶל בֵּית אָבִיהָ כִּנְעוּרֶיהָ
  choice: und in das Haus ihres Vaters zurückkehrt wie in ihrer Jugend
  rationale: Die Formulierung bewahrt sowohl die tatsächliche Rückkehr in den väterlichen Haushalt als auch den Vergleich mit ihrem früheren Status.
- source_word: מִלֶּחֶם אָבִיהָ תֹּאכֵל
  choice: darf sie von der Speise ihres Vaters essen
  rationale: לֶחֶם heißt wörtlich „Brot“, kann jedoch umfassender die Nahrung beziehungsweise Versorgung des priesterlichen Haushalts bezeichnen. „Darf“ bringt die rechtliche Erlaubnis idiomatisch zum Ausdruck.
- source_word: וְכָל זָר לֹא יֹאכַל בּוֹ
  choice: Doch kein Unbefugter darf davon essen
  rationale: זָר bezeichnet im priesterlichen Recht eine Person außerhalb des zugelassenen Kreises, nicht notwendig einen ethnischen Fremden. „Unbefugter“ stellt die fehlende Berechtigung heraus.
theological_decisions:
- issue: Bedeutungsumfang von לֶחֶם im Zusammenhang priesterlicher Speise
  choice: „Speise“ als umfassende Bezeichnung für die Nahrung, zu deren Verzehr der priesterliche Haushalt berechtigt ist
  alternative: „Brot“ als formale Wiedergabe
  rationale: Der Kontext von Levitikus 22 betrifft die Berechtigung zum Verzehr heiliger Gaben. „Speise“ bewahrt den weiteren metonymischen Sinn, ohne die betreffende Nahrung genauer festzulegen, als es der Text tut.
- issue: Bedeutung von זָר
  choice: „Unbefugter“
  alternative: „Fremder“ oder „Außenstehender“
  rationale: Gemeint ist hier die kultrechtliche Zugehörigkeit zum zugelassenen Personenkreis. Die Wiedergabe vermeidet die irreführende Annahme, es gehe primär um ethnische Herkunft.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rechtliche Bedingung und Erlaubnis werden klar ausgedrückt; kultrechtliche Begriffe werden ohne konfessionelle Zusatzdeutung verständlich wiedergegeben.
