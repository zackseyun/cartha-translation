source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּם֙ מִצְוֺתַ֔/י וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם אֲנִ֖י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/031.yaml
  text: So you shall keep my commandments and do them[a]; I am Yahweh.
translation:
  language: de
  text: Darum sollt ihr meine Gebote halten und sie tun. Ich bin Jahwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Darum sollt ihr … halten
  rationale: שׁמר bezeichnet im rechtlich-bundestheologischen Zusammenhang das Beachten oder Halten von Geboten. „Darum“ gibt die aus dem vorausgehenden Zusammenhang folgernde Verbindung natürlicher wieder als ein rein additives „und“.
- source_word: מִצְוֺתַי
  choice: meine Gebote
  rationale: מִצְוָה bedeutet „Gebot“; die übliche deutsche Wendung bewahrt den rechtlichen und feierlichen Ton.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: und sie tun
  rationale: Die konkrete Formulierung bildet das hebräische עשה ab und erhält die bewusste Verbindung von Halten und Tun, statt beide Aussagen zu „befolgen“ zusammenzuziehen.
- source_word: אֲנִי יְהוָה
  choice: Ich bin Jahwe
  rationale: Die häufige Selbstvorstellungsformel bleibt erhalten; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich das Tetragramm. Die Transliteration „Jahwe“ macht den persönlichen Bundesnamen sichtbar; die traditionelle Wiedergabe „der HERR“ wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Parallelität „halten und … tun“ sowie die feierliche Selbstvorstellungsformel des Hebräischen bleiben bewusst erhalten.
