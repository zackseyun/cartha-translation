id: LEV.22.21
reference: Leviticus 22:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אִ֗ישׁ כִּֽי יַקְרִ֤יב זֶֽבַח שְׁלָמִים֙ לַ/יהוָ֔ה לְ/פַלֵּא נֶ֨דֶר֙ א֣וֹ לִ/נְדָבָ֔ה בַּ/בָּקָ֖ר א֣וֹ בַ/צֹּ֑אן תָּמִ֤ים יִֽהְיֶה֙ לְ/רָצ֔וֹן כָּל מ֖וּם לֹ֥א יִהְיֶה בּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/021.yaml
  text: And if a man presents a sacrifice of peace offerings to Yahweh[a], to fulfill a vow or as a freewill offering, from the herd or from the flock, it shall be without blemish to be accepted[b]; there shall be no defect in it.
translation:
  language: de
  text: Und wenn ein Mann Jahwe[a] ein Heilsopfer darbringt, um ein Gelübde zu erfüllen[b] oder als freiwillige Opfergabe, sei es vom Rind oder vom Kleinvieh, dann muss das Tier fehlerlos sein, damit es angenommen wird; kein Makel darf an ihm sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Text nennt hier den Gottesnamen Jahwe.
    reason: divine_name
  - marker: b
    text: 'Auch möglich: „um ein Gelübde auszuführen“ oder „einzulösen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי
  choice: Und wenn ein Mann
  rationale: Die kasuistische Rechtsform wird mit „wenn“ wiedergegeben; אִישׁ bleibt entsprechend der maskulinen Singularform als „ein Mann“ erhalten.
- source_word: יַקְרִיב
  choice: darbringt
  rationale: Der Hifil von קרב bezeichnet im Opferkontext das Darbringen einer Opfergabe; „darbringen“ ist präzise und im Deutschen natürlich kultsprachlich.
- source_word: זֶבַח שְׁלָמִים
  choice: ein Heilsopfer
  rationale: „Heilsopfer“ ist die etablierte knappe Wiedergabe der Opferart שְׁלָמִים und wahrt die Wortverbindung mit שׁלם besser als die stärker deutende Alternative „Gemeinschaftsopfer“.
- source_word: לְפַלֵּא נֶדֶר
  choice: um ein Gelübde zu erfüllen
  rationale: פלא im vorliegenden Opferkontext meint, eine gelobte Leistung auszuführen beziehungsweise einzulösen; „ein Gelübde erfüllen“ ist idiomatisches modernes Deutsch.
- source_word: לִנְדָבָה
  choice: als freiwillige Gabe
  rationale: נְדָבָה bezeichnet eine aus freiem Willen dargebrachte Gabe im Unterschied zum Gelübdeopfer.
- source_word: בַּבָּקָר אוֹ בַצֹּאן
  choice: sei es vom Rind oder vom Kleinvieh
  rationale: בקר bezeichnet Rinder, צאן als Sammelbegriff Schafe und Ziegen; „Kleinvieh“ bewahrt diesen weiteren Umfang.
- source_word: תָּמִים
  choice: fehlerlos
  rationale: Im Opferrecht bezeichnet תמים ein Tier ohne körperlichen Fehler. „Fehlerlos“ ist klar und vermeidet eine unnötig altertümliche Formulierung.
- source_word: לְרָצוֹן
  choice: damit es angenommen wird
  rationale: Die Wendung bezeichnet die kultische Annehmbarkeit der Gabe; die finale Formulierung gibt den Zusammenhang natürlich wieder.
- source_word: כָּל מוּם לֹא יִהְיֶה בּוֹ
  choice: kein Makel darf an ihm sein
  rationale: מום ist ein körperlicher, disqualifizierender Makel. Die deutsche Form bewahrt den rechtlich verpflichtenden Charakter.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt den offenbarten Bundesnamen direkt wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von זֶבַח שְׁלָמִים
  choice: Heilsopfer
  alternative: Gemeinschaftsopfer
  rationale: Die genaue Nuance der Bezeichnung ist umstritten. „Heilsopfer“ wahrt die lexikalische Nähe zur Wurzel שׁלם, ohne Gemeinschaft als alleinige theologische Deutung festzulegen.
- issue: Maskulines Rechtssubjekt אִישׁ
  choice: ein Mann
  alternative: jemand
  rationale: Die ausdrücklich maskuline Singularform des hebräischen Rechtssatzes wird bewahrt, ohne über ihren möglichen repräsentativen Gebrauch hinauszugehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer rechtlicher Satzstruktur. Kultische Fachbegriffe werden sparsam und verständlich eingesetzt; „Kleinvieh“ umfasst im biblischen Sprachgebrauch Schafe und Ziegen.
