  text: אוֹ אִישׁ֙ אֲשֶׁ֣ר יִגַּ֔ע בְּ/כָל שֶׁ֖רֶץ אֲשֶׁ֣ר יִטְמָא ל֑/וֹ א֤וֹ בְ/אָדָם֙ אֲשֶׁ֣ר יִטְמָא ל֔/וֹ לְ/כֹ֖ל טֻמְאָתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/005.yaml
  text: or a man who touches any swarming thing by which he becomes unclean[a], or a person by whom he becomes unclean[b], whatever his uncleanness.
translation:
  language: de
  text: oder jemand, der irgendein wimmelndes Tier[a] berührt, durch das er unrein wird, oder einen Menschen, durch den er unrein wird, gleich welche Unreinheit er hat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Wort bezeichnet Tiere, die wimmeln oder sich dicht am Boden fortbewegen; auch: »kriechendes Tier«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »zu jeder seiner Unreinheiten«. Das hebräische Suffix kann sich formal auf den Berührenden oder auf den berührten Menschen beziehen; im Zusammenhang liegt der Bezug auf den berührten Menschen nahe.'
    reason: referential_ambiguity
lexical_decisions:
- source_word: אוֹ
  choice: oder
  rationale: Die einfache disjunktive Konjunktion setzt die Aufzählung aus dem vorhergehenden Vers fort.
- source_word: אִישׁ
  choice: einen Mann
  rationale: Die Wiedergabe bildet die maskuline Singularform ab; im rechtlichen Zusammenhang ist sie generisch gebraucht.
- source_word: יִגַּע
  choice: berührt
  rationale: Dies ist die übliche und natürliche Wiedergabe von נגע in Reinheitsvorschriften.
- source_word: בְּכָל שֶׁרֶץ
  choice: irgendein wimmelndes Kleintier
  rationale: שֶׁרֶץ bezeichnet hier kleine Tiere, die wimmeln oder sich dicht am Boden fortbewegen. Die Formulierung wahrt die breite Kategorie, ohne sie zoologisch zu verengen.
- source_word: אֲשֶׁר יִטְמָא לוֹ
  choice: durch das er unrein wird
  rationale: Die Konstruktion bezeichnet das Mittel beziehungsweise die Quelle der kultischen Unreinheit und bewahrt den Fokus auf dem eintretenden Zustand.
- source_word: בְאָדָם
  choice: einen Menschen
  rationale: אָדָם bezeichnet hier einen Menschen als mögliche Quelle übertragener Unreinheit; „Menschen“ gibt den generischen Sinn natürlich wieder.
- source_word: אֲשֶׁר יִטְמָא לוֹ לְכֹל טֻמְאָתוֹ
  choice: durch den er unrein wird, was für eine Unreinheit er auch hat
  rationale: Die Formulierung erhält die kompakte Aussage, dass die Berührung eines Menschen Unreinheit übertragen kann, gleich welcher Art dessen Unreinheit ist.
- source_word: טֻמְאָה
  choice: Unreinheit
  rationale: „Unreinheit“ bewahrt im Deutschen die Wortverbindung mit „unrein“ und bezeichnet hier einen kultischen Zustand, nicht ohne Weiteres moralische Schuld.
theological_decisions:
- issue: Art der Unreinheit in den levitischen Reinheitsvorschriften
  choice: טמא und טֻמְאָה werden mit „unrein“ und „Unreinheit“ wiedergegeben.
  alternative: „kultisch unrein“ und „kultische Unreinheit“ beziehungsweise „verunreinigt“ und „Verunreinigung“
  rationale: Der Zusammenhang betrifft priesterliche Reinheitsvorschriften und nicht notwendig moralische Schuld. Die traditionellen deutschen Begriffe sind präzise und bewahren die Verbindung zwischen Verb und Substantiv; eine ausdrückliche Einfügung von „kultisch“ wäre erklärend und steht nicht im Vers.
- issue: Bezug des Suffixes in טֻמְאָתוֹ
  choice: „was für eine Unreinheit er auch hat“ bezieht sich auf den berührten Menschen.
  alternative: „was auch immer seine [des Berührenden] Unreinheit ist“
  rationale: Der nähere und sachlich passende Bezug ist der Mensch, von dem Unreinheit übertragen wird. Da das Hebräische nur maskuline Singularsuffixe verwendet, wird die mögliche formale Mehrdeutigkeit in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Anlehnung an die hebräische Satzstruktur. „Wimmelndes Kleintier“ ist verständlicher als das substantivierte „Gewimmel“, ohne die Tierkategorie unnötig einzuengen. Die kultisch-rechtliche Bedeutung von „unrein“ wird gewahrt.
