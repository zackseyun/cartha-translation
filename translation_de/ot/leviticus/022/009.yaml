  text: וְ/שָׁמְר֣וּ אֶת מִשְׁמַרְתִּ֗/י וְ/לֹֽא יִשְׂא֤וּ עָלָי/ו֙ חֵ֔טְא וּ/מֵ֥תוּ ב֖/וֹ כִּ֣י יְחַלְּלֻ֑/הוּ אֲנִ֥י יְהוָ֖ה מְקַדְּשָֽׁ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/009.yaml
  text: They shall keep my charge[a], so that they do not bear sin because of it and die by it when they profane it[d][c][b]. I am Yahweh who sanctifies them.
translation:
  language: de
  text: Sie sollen meine Vorschrift beachten[a], damit sie nicht deswegen Schuld auf sich laden[b] und sterben[c], wenn sie es entweihen[d]. Ich bin Jahwe, der sie heiligt[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „meine Pflicht erfüllen“ oder „meinen Dienstauftrag wahrnehmen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Sünde tragen“. Die hebräische Wendung kann bedeuten, Schuld auf sich zu laden oder für Schuld einstehen zu müssen.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch: „deswegen sterben“.'
    reason: lexical_alternative
  - marker: d
    text: 'Auch: „es entheiligen“ oder „es wie etwas Gewöhnliches behandeln“. Der Bezug der hebräischen Pronomen wird nicht ausdrücklich wiederholt. Gemeint sein können die heiligen Dinge, von denen im Zusammenhang die Rede ist, oder die heilige Angelegenheit selbst; die Übersetzung legt ihn nicht näher fest.'
    reason: textual_ambiguity
  - marker: e
    text: 'Auch: „der sie heilig macht“ oder „der sie als heilig aussondert“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמְרוּ
  choice: Sie sollen … befolgen
  rationale: שׁמר bezeichnet hier im rechtlich-kultischen Zusammenhang das gewissenhafte Beachten und Erfüllen einer anvertrauten Verpflichtung. „Befolgen“ gibt diesen verpflichtenden Sinn in natürlichem modernem Deutsch wieder.
- source_word: מִשְׁמַרְתִּי
  choice: meinen Auftrag
  rationale: מִשְׁמֶרֶת kann eine anvertraute Pflicht, einen Dienstauftrag oder eine zu wahrende Vorschrift bezeichnen. „Auftrag“ bewahrt den Gedanken einer von Jahwe übertragenen Verpflichtung, ohne sie auf eine einzelne Satzung einzuengen.
- source_word: יִשְׂאוּ עָלָיו חֵטְא
  choice: seinetwegen Schuld auf sich laden
  rationale: Die Wendung נשׂא חטא kann sowohl das Tragen als auch das Auf-sich-Laden von Schuld ausdrücken. Die gewählte Formulierung ist im Deutschen verständlich und bleibt nahe am hebräischen Bild.
- source_word: וּמֵתוּ בוֹ
  choice: und daran sterben
  rationale: Die Präposition בְּ bezeichnet hier den Zusammenhang beziehungsweise die Ursache des Todes. „Daran sterben“ bildet diese knappe Verknüpfung natürlich ab.
- source_word: יְחַלְּלֻהוּ
  choice: weil sie ihn entweihen
  rationale: חלל bezeichnet im Heiligkeitskontext das Entweihen beziehungsweise das Behandeln als gewöhnlich. „Entweihen“ wahrt den Gegensatz zwischen heilig und gewöhnlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מְקַדְּשָׁם
  choice: der sie heiligt
  rationale: Das Partizip von קדשׁ stellt Jahwe als den dar, der die Priester als heilig aussondert beziehungsweise heiligt. „Heiligt“ bewahrt den zentralen Wortstamm und den kultisch-theologischen Zusammenhang.
theological_decisions:
- issue: Bezug der Singularpronomen in „seinetwegen“, „daran“ und „ihn“
  choice: Die Pronomen bleiben im Text stehen, ohne den Gegenstand durch ein zusätzliches Substantiv ausdrücklich festzulegen.
  alternative: Die Pronomen könnten ausdrücklich auf die heiligen Gaben beziehungsweise die heilige Speise im unmittelbaren Zusammenhang bezogen werden.
  rationale: Der hebräische Vers wiederholt keinen eindeutigen Bezugsgegenstand. Der weitere Zusammenhang betrifft heilige Gaben, während im Vers selbst Jahwes מִשְׁמֶרֶת genannt wird. Die Übersetzung vermeidet daher eine ausdrückliche Festlegung; die deutsche grammatische Anknüpfung an „Auftrag“ ist möglich, soll aber durch die Fußnote nicht als einzig denkbarer sachlicher Bezug erscheinen.
- issue: Bedeutung von מְקַדְּשָׁם
  choice: „der sie heiligt“
  alternative: „der sie heilig macht“ oder „der sie für heilig erklärt/aussondert“
  rationale: Das Hebräische umfasst das Heiligmachen und Aussondern. „Heiligt“ erhält diese theologische Bedeutungsbreite, ohne den Vorgang enger zu bestimmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit rechtlich-kultischem Ton. „Auftrag befolgen“, „Schuld auf sich laden“, „entweihen“ und „heiligen“ sind verständlich, bewahren aber die Schlüsselbegriffe und die knappe Ernsthaftigkeit des hebräischen Textes.
