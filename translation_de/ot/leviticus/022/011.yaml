source:
  edition: WLC
  text: וְ/כֹהֵ֗ן כִּֽי יִקְנֶ֥ה נֶ֨פֶשׁ֙ קִנְיַ֣ן כַּסְפּ֔/וֹ ה֖וּא יֹ֣אכַל בּ֑/וֹ וִ/ילִ֣יד בֵּית֔/וֹ הֵ֖ם יֹאכְל֥וּ בְ/לַחְמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/011.yaml
  text: But if a priest buys a person as his property with his money[a], he may eat of it[b], and those born in his house may eat of his food.
translation:
  language: de
  text: Wenn aber ein Priester mit seinem Geld einen Menschen als sein Eigentum erwirbt[a], darf dieser davon essen; auch die in seinem Haus Geborenen dürfen von seiner Speise essen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »einen Menschen, den Erwerb seines Geldes« – also jemanden, der mit seinem Geld erworben wurde.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »von seinem Brot«; »Brot« bezeichnet hier wahrscheinlich umfassender die dem Priester zustehende Speise.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹהֵן כִּי
  choice: Wenn aber ein Priester
  rationale: Die Wendung führt im Zusammenhang mit dem vorhergehenden Vers einen kontrastierenden Rechtsfall ein. „Wenn aber“ gibt sowohl den konditionalen als auch den fortführend-kontrastiven Charakter natürlich wieder.
- source_word: יִקְנֶה נֶפֶשׁ
  choice: einen Menschen … erwirbt
  rationale: נֶפֶשׁ bezeichnet hier einen Menschen, nicht eine immaterielle Seele; קנה meint im Zusammenhang einen Erwerb durch Kauf. „Erwirbt“ passt zur unmittelbar folgenden Eigentumsformulierung.
- source_word: קִנְיַן כַּסְפּוֹ
  choice: mit seinem Geld als Eigentum
  rationale: Die Übersetzung bewahrt sowohl das Zahlungsmittel als auch die im hebräischen Ausdruck enthaltene Eigentumsdimension, ohne den rechtlichen Sachverhalt abzuschwächen.
- source_word: הוּא יֹאכַל בּוֹ
  choice: darf dieser davon essen
  rationale: הוּא verweist auf den erworbenen Menschen. „Dieser“ macht den Bezug im Deutschen eindeutig; der Imperfekt drückt hier rechtlich erlaubte Teilnahme aus.
- source_word: וִילִיד בֵּיתוֹ
  choice: die in seinem Haus Geborenen
  rationale: Der Ausdruck bezeichnet kollektiv im Haushalt Geborene, wie die folgenden Pluralformen zeigen. Die Formulierung wahrt diesen Sinn, ohne einen im Vers nicht ausdrücklich genannten Status ergänzend festzulegen.
- source_word: בְלַחְמוֹ
  choice: von seiner Speise
  rationale: לֶחֶם kann wörtlich „Brot“ bedeuten, bezeichnet hier im kultisch-rechtlichen Zusammenhang aber wahrscheinlich umfassender die dem Priester zustehende Speise. „Speise“ ist würdig und bewahrt den sachlichen Kontext.
theological_decisions:
- issue: Wiedergabe eines mit Eigentum verbundenen Rechtsbegriffs
  choice: mit seinem Geld als Eigentum erwirbt
  alternative: mit seinem Geld kauft
  rationale: Die gewählte Fassung macht die Eigentumsdimension von קִנְיַן כַּסְפּוֹ ausdrücklich sichtbar. Das ist eine transparente Wiedergabe der historischen Rechtsaussage, keine ethische Billigung.
- issue: Bezug der erlaubten Speise
  choice: davon / von seiner Speise
  alternative: von seinem Brot
  rationale: Der Kontext handelt von heiliger beziehungsweise priesterlicher Speise. Die Übersetzung hält den Bezug kontextuell offen genug und legt keine weitergehende theologische Deutung fest.
translation_notes:
  register: Modernes Standarddeutsch in würdig-sachlichem Gesetzesstil. Die historische Eigentumssprache wird nicht beschönigt. „Dieser“ verhindert eine mögliche Verwechslung des erworbenen Menschen mit dem Priester; „Speise“ ist im Register gehoben, aber allgemein verständlich.
