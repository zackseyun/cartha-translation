  source_fidelity: 'Der Entwurf gibt alle Elemente des hebräischen Redeformulars wieder: das narrative Redeereignis („sprach“), den Gottesnamen JHWH als „Jahwe“, den Adressaten Mose und die auf die folgende Rede verweisende Einleitung. Der Doppelpunkt ist eine idiomatische deutsche Entsprechung für לֵאמֹר, dessen direkte Rede erst im folgenden Vers beginnt.'
