lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: sprach
  rationale: Das Waw-Konsekutiv führt ein neues Redeereignis ein. „Sprach“ entspricht der wiederkehrenden, würdevollen Formel für Gottes Anrede.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition bezeichnet den Adressaten der Rede; „zu“ ist in dieser deutschen Redeeinleitung idiomatisch.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Die im Deutschen übliche Namensform.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Das formelhafte „indem er sagte/um zu sagen“ leitet die folgende direkte Rede ein. Im heutigen Deutschen gibt ein Doppelpunkt diese Funktion natürlich und präzise wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ bewahrt diesen Namen; die traditionelle Wiedergabe „der HERR“ wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt vermeidet die im Deutschen schwerfällige wörtliche Formel „und sagte“ und macht deutlich, dass die Rede in Vers 27 folgt.
