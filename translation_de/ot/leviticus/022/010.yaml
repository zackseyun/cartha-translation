source:
  edition: WLC
  text: וְ/כָל זָ֖ר לֹא יֹ֣אכַל קֹ֑דֶשׁ תּוֹשַׁ֥ב כֹּהֵ֛ן וְ/שָׂכִ֖יר לֹא יֹ֥אכַל קֹֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/010.yaml
  text: No outsider may eat the holy thing[b][a]; a sojourner of a priest or a hired worker may not eat the holy thing.
translation:
  language: de
  text: Kein Außenstehender darf von dem Heiligen[a] essen. Ein bei einem Priester wohnender Fremder[b] und ein Lohnarbeiter dürfen nicht von dem Heiligen essen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von der heiligen Speise“ oder „vom heiligen Anteil“. Der hebräische Singular „das Heilige“ meint hier Speise aus heiligen Opfergaben, die zum Verzehr durch Berechtigte bestimmt war.'
    reason: lexical_alternative
  - marker: b
    text: '„Ein bei einem Priester wohnender Fremder“ gibt eine Bezeichnung für eine nicht zur Familie gehörende Person wieder, die als ansässiger Bewohner einem priesterlichen Haushalt zugeordnet war. Auch möglich: „ein ansässiger Fremder eines Priesters“ oder „ein Priester zugeordneter Beisasse“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָר
  choice: Außenstehender
  rationale: Im Zusammenhang mit den heiligen Speiseanteilen bezeichnet das Wort jemanden, der nicht zum berechtigten priesterlichen Personenkreis gehört, nicht in erster Linie einen ethnischen Fremden.
- source_word: קֹדֶשׁ
  choice: das Heilige
  rationale: Die substantivierte Form wahrt den Singular und die kultische Weite des hebräischen Ausdrucks; im Kontext sind damit heilige Speiseanteile gemeint. Eine Fußnote nennt verständlichere, aber stärker deutende Alternativen.
- source_word: תּוֹשַׁב כֹּהֵן
  choice: ein Beisasse eines Priesters
  rationale: Die Formulierung bezeichnet einen beim Priester wohnenden, nicht zur Familie gehörenden Abhängigen oder ansässigen Schutzbürger. „Beisasse“ hält die rechtlich-soziale Kategorie knapp fest, benötigt im heutigen Deutsch jedoch eine Erläuterung.
- source_word: שָׂכִיר
  choice: Lohnarbeiter
  rationale: Das Wort bezeichnet eine gegen Lohn beschäftigte Person und unterscheidet sie vom ansässigen Beisassen.
- source_word: לֹא יֹאכַל
  choice: darf nicht essen
  rationale: Der negierte Imperfekt formuliert hier ein kultrechtliches Verbot; „darf nicht“ gibt den fehlenden Zugang zur heiligen Speise natürlich wieder.
- source_word: וְכָל
  choice: Kein
  rationale: In Verbindung mit der folgenden Verneinung wird die allgemeine Ausschlussregel im Deutschen idiomatisch mit „Kein“ ausgedrückt.
theological_decisions:
- issue: Bedeutung von זָר im Heiligkeitsrecht
  choice: Außenstehender
  alternative: Fremder; Laie; Unbefugter
  rationale: Die Übersetzung vermeidet eine ethnische Verengung und bezeichnet den Ausschluss vom priesterlichen Speiserecht, ohne die Person moralisch abzuwerten.
- issue: Konkreter Bezug von קֹדֶשׁ
  choice: das Heilige
  alternative: heilige Speise; heiliger Anteil; heilige Gabe
  rationale: Der Haupttext bewahrt die knappe und grundsätzlich offene Form des Hebräischen; die kontextuelle Beziehung auf geweihte Speiseanteile wird in der Fußnote erläutert.
translation_notes:
  register: Modernes, würdevolles Gesetzesdeutsch. „Beisasse“ ist ein präziser, aber heute wenig geläufiger sozialrechtlicher Begriff und wird deshalb unmittelbar durch eine Fußnote erläutert. Die Wiederholung „von dem Heiligen essen“ bildet die zweigliedrige hebräische Verbotsform ab.
