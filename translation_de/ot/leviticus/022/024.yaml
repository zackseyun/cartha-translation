source:
  edition: WLC
  text: וּ/מָע֤וּךְ וְ/כָתוּת֙ וְ/נָת֣וּק וְ/כָר֔וּת לֹ֥א תַקְרִ֖יבוּ לַֽ/יהוָ֑ה וּֽ/בְ/אַרְצְ/כֶ֖ם לֹ֥א תַעֲשֽׂוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/024.yaml
  text: You shall not present to Yahweh anything with bruised[a], crushed, torn, or cut testicles, and in your land you shall not do this.
translation:
  language: de
  text: Ein Tier mit gequetschten[a], zerdrückten, abgerissenen oder abgeschnittenen Hoden sollt ihr Jahwe nicht darbringen. Und in eurem Land sollt ihr dies nicht tun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich werden vier Arten der Beschädigung genannt: „gequetscht, zerdrückt, abgerissen oder abgeschnitten“. Dass die Hoden eines männlichen Tieres gemeint sind, ergibt sich aus dem Zusammenhang.'
    reason: Das Hebräische nennt das betroffene Körperteil nicht ausdrücklich; für einen verständlichen deutschen Satz wird der implizite Bezug offengelegt.
lexical_decisions:
- source_word: מָעוּךְ
  choice: gequetscht
  rationale: Das passive Partizip bezeichnet eine durch Druck verursachte Verletzung. „Gequetscht“ wahrt den konkreten Sinn und lässt sich vom folgenden stärkeren Ausdruck unterscheiden.
- source_word: כָתוּת
  choice: zerdrückt
  rationale: Der Ausdruck bezeichnet etwas Zerschlagenes oder Zerdrücktes. „Zerdrückt“ gibt die körperliche Beschädigung anschaulich wieder.
- source_word: נָתוּק
  choice: abgerissen
  rationale: Das Wort beschreibt etwas, das durch Ziehen abgetrennt oder losgerissen wurde. „Abgerissen“ bewahrt diese mögliche Art der Verletzung.
- source_word: כָרוּת
  choice: abgeschnitten
  rationale: Das Partizip stammt vom Verb „abschneiden“ und bezeichnet hier den Zustand nach einer Durchtrennung.
- source_word: תַקְרִיבוּ
  choice: darbringen
  rationale: Im Opferkontext bedeutet der Hifil gewöhnlich, etwas vor Gott zu bringen beziehungsweise als Opfer darzubringen. „Darbringen“ ist im Deutschen präzise und würdevoll.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְאַרְצְכֶם
  choice: in eurem Land
  rationale: Die Formulierung entspricht dem räumlichen Bezug des Hebräischen und bezeichnet das Land, in dem Israel lebt.
- source_word: תַעֲשׂוּ
  choice: dürft ihr so etwas nicht tun
  rationale: Das Verb „tun/machen“ steht elliptisch und verweist wahrscheinlich auf die zuvor genannten Verstümmelungen. „So etwas“ erhält die Breite des Ausdrucks, ohne die Handlung enger festzulegen.
- source_word: implizites Bezugswort der vier Partizipien
  choice: Hoden eines Tieres
  rationale: Die vier Partizipien stehen im Hebräischen ohne ausdrücklich genanntes Bezugswort; der Zusammenhang handelt von männlichen Opfertieren und ihren Geschlechtsorganen. Die Ergänzung macht den Satz im Deutschen verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Wiedergabe als „Jahwe“ bewahrt den Charakter des Tetragramms als Eigenname.
- issue: Reichweite des abschließenden Verbots וּבְאַרְצְכֶם לֹא תַעֲשׂוּ
  choice: Verbot, solche Verstümmelungen im Land vorzunehmen
  alternative: Verbot, derart verletzte Tiere im Land als Opfer darzubringen
  rationale: Das allgemeine und elliptische Verb „tun“ verweist am ehesten auf die unmittelbar zuvor beschriebenen Eingriffe. Die Formulierung „so etwas“ lässt die Kürze und eine gewisse Offenheit des Hebräischen bestehen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die anatomisch klare Bezeichnung „Hoden“ vermeidet sowohl missverständliche Umschreibungen als auch veraltete Euphemismen. „Dürft ihr nicht“ formuliert beide Verbote natürlich, ohne ihren verpflichtenden Charakter abzuschwächen.
