  source_fidelity: Die beiden Speiseverbote und die ritualsprachliche Kategorie von טמא sind grundsätzlich treffend wiedergegeben. Die Präpositionalphrase בָּהּ wird mit „dadurch“ angemessen aufgenommen. Die Schlussformel „Ich bin Jahwe“ entspricht dem ausdrücklichen Gottesnamen im hebräischen Text.
  naturalness: „..., sodass er dadurch unrein wird“ klingt im Deutschen wie eine Folge des verbotenen Essens, während die hebräische Infinitivkonstruktion den Zweck des Verbots formuliert. „Damit er dadurch nicht unrein wird“ ist idiomatischer und gibt die im Verbot eingeschlossene negative Zielrichtung klar wieder.
  terminology: '„Verendetes Tier“, „von Raubtieren gerissenes Tier“ und „unrein“ sind für den kultisch-rechtlichen Kontext präzise und modernes Standarddeutsch. Die bisherige Fußnote ist jedoch nicht zuverlässig als wörtlich bezeichnet: „Aas“ ist enger bzw. stilistisch anders als נְבֵלָה, und „gerissenes Tier“ lässt den bei טְרֵפָה mitgemeinten Raubtierbezug weg.'
