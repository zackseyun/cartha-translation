  text: נְבֵלָ֧ה וּ/טְרֵפָ֛ה לֹ֥א יֹאכַ֖ל לְ/טָמְאָה בָ֑/הּ אֲנִ֖י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/008.yaml
  text: He shall not eat an animal found dead or torn by beasts[a], making himself unclean by it. I am Yahweh.
translation:
  language: de
  text: Ein verendetes oder von Raubtieren gerissenes Tier[a] darf er nicht essen, damit er dadurch nicht unrein wird. Ich bin Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Tier, das von selbst verendet ist, oder ein von Raubtieren zerrissenes Tier“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבֵלָה
  choice: ein verendetes Tier
  rationale: Das Substantiv bezeichnet den Kadaver eines Tieres, das ohne ordnungsgemäße Schlachtung gestorben ist. „Ein verendetes Tier“ gibt dies im Speisegesetz klar und natürlich wieder.
- source_word: וּטְרֵפָה
  choice: oder von Raubtieren gerissenes Tier
  rationale: טְרֵפָה bezeichnet hier ein von einem Raubtier gerissenes Tier. Die Ergänzung „von Raubtieren“ macht den im hebräischen Begriff enthaltenen Zusammenhang verständlich.
- source_word: לֹא יֹאכַל
  choice: darf er nicht essen
  rationale: Der negierte Imperfekt formuliert im Gesetz eine verbindliche Untersagung. „Darf er nicht“ ist im modernen Deutschen eindeutig und bewahrt den rechtlichen Charakter.
- source_word: לְטָמְאָה בָהּ
  choice: sodass er dadurch unrein wird
  rationale: Die Infinitivkonstruktion kann Zweck oder Folge ausdrücken. „Sodass“ gibt die naheliegende Folge des Essens wieder, ohne den Begriff ritueller Unreinheit umzudeuten.
- source_word: אֲנִי יְהוָה
  choice: Ich bin Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben; die knappe Bundesformel des Hebräischen bleibt erhalten.
theological_decisions:
- issue: Bedeutung von „unrein“
  choice: ritualsprachlich „unrein“
  alternative: „verunreinigt“ oder „entweiht“
  rationale: טמא bezeichnet im Kontext der priesterlichen Vorschriften kultische Unreinheit. „Unrein“ wahrt diese Kategorie, ohne sie als moralische Schuld auszulegen.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm; die Umschrift bewahrt den persönlichen Gottesnamen.
translation_notes:
  register: Moderne, klare Standardsprache mit würdigem Gesetzesregister. „Verendet“ und „von Raubtieren gerissen“ erschließen die knappen hebräischen Rechtsbegriffe, während die Fußnote deren formalere Wiedergabe bietet.
