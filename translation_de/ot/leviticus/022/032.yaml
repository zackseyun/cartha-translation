id: LEV.22.32
reference: Leviticus 22:32
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/לֹ֤א תְחַלְּלוּ֙ אֶת שֵׁ֣ם קָדְשִׁ֔/י וְ/נִ֨קְדַּשְׁתִּ֔י בְּ/ת֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל אֲנִ֥י יְהוָ֖ה מְקַדִּשְׁ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/032.yaml
  text: And you shall not profane my holy name[a], and I will be sanctified among the sons of Israel. I am Yahweh[b], who sanctifies you.
translation:
  language: de
  text: Und ihr sollt meinen heiligen Namen nicht entweihen, und ich werde inmitten der Israeliten als heilig erwiesen werden.[a] Ich bin Jahwe, der euch heiligt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und ich werde unter den Israeliten als heilig anerkannt werden“ oder „als heilig behandelt werden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְחַלְּלוּ
  choice: entweihen
  rationale: Das Piel von חלל bezeichnet hier, etwas Heiliges seiner Heiligkeit zu berauben beziehungsweise es wie etwas Gewöhnliches zu behandeln. „Entweihen“ bewahrt die kultisch-theologische Aussage und ist im Deutschen natürlich.
- source_word: שֵׁם קָדְשִׁי
  choice: meinen heiligen Namen
  rationale: Die Wendung gibt die hebräische Konstruktverbindung idiomatisch wieder und bewahrt sowohl „Name“ als auch das Attribut der Heiligkeit.
- source_word: וְנִקְדַּשְׁתִּי
  choice: und ich werde … als heilig erwiesen werden
  rationale: Das Nifal von קדשׁ kann ausdrücken, dass Jahwe als heilig anerkannt, behandelt oder sichtbar erwiesen wird. Diese Wiedergabe erhält die passive Form und vermeidet die im modernen Deutschen mögliche Fehlvorstellung, Gott werde erst innerlich geheiligt.
- source_word: בְּתוֹךְ
  choice: inmitten
  rationale: „Inmitten“ bewahrt den räumlich-sozialen Sinn der Präposition und klingt in diesem feierlichen Zusammenhang natürlich.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: der Israeliten
  rationale: Die hebräische Standardbezeichnung meint hier das Volk Israel insgesamt. „Israeliten“ ist präzise, idiomatisch und schließt den gemeinschaftlichen Referenten ein, ohne eine ausschließlich männliche Gruppe nahezulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Text enthält den Gottesnamen יהוה; „Jahwe“ gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: מְקַדִּשְׁכֶם
  choice: der euch heiligt
  rationale: Das Partizip beschreibt Jahwe als den, der fortdauernd heilig macht beziehungsweise absondert. „Heiligt“ wahrt zudem die Wortverbindung zu קדשׁ im vorangehenden Satz.
theological_decisions:
- issue: Bedeutung von וְנִקְדַּשְׁתִּי
  choice: ich werde … als heilig erwiesen werden
  alternative: ich werde geheiligt werden / ich werde als heilig behandelt werden
  rationale: Gott wird nicht erst heilig gemacht; seine Heiligkeit soll innerhalb Israels anerkannt und sichtbar erwiesen werden. Die passive Form und die Mehrdeutigkeit zwischen Anerkennung, Behandlung und Offenbarung seiner Heiligkeit bleiben durch die Formulierung und die Fußnote erhalten.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Da der Ausgangstext den persönlichen Gottesnamen verwendet, wird dieser als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- issue: Referenz von בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels / das Volk Israel
  rationale: Die feste hebräische Wendung bezeichnet in diesem Gebotszusammenhang die israelitische Gemeinschaft. Die idiomatische deutsche Wiedergabe vermeidet eine unbeabsichtigte Einschränkung auf männliche Nachkommen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die koordinierende Verbindung mit „und“ folgt dem hebräischen וְ, ohne sie zu einem ausdrücklichen Gegensatz („sondern“) umzudeuten. Der Wortstamm קדשׁ wird durch „heilig“ und „heiligt“ im ganzen Vers hörbar gehalten.
