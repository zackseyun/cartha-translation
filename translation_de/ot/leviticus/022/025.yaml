  text: וּ/מִ/יַּ֣ד בֶּן נֵכָ֗ר לֹ֥א תַקְרִ֛יבוּ אֶת לֶ֥חֶם אֱלֹהֵי/כֶ֖ם מִ/כָּל אֵ֑לֶּה כִּ֣י מָשְׁחָתָ֤/ם בָּ/הֶם֙ מ֣וּם בָּ֔/ם לֹ֥א יֵרָצ֖וּ לָ/כֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/025.yaml
  text: And from the hand of a foreigner you shall not present any of these as the food of your God[a], because their corruption is in them; a defect is in them[b]. They shall not be accepted for you.
translation:
  language: de
  text: Auch von einem Fremden dürft ihr nichts von alledem als Speise eures Gottes[a] darbringen; denn sie sind beschädigt und haben einen Makel[b]. Sie werden nicht für euch angenommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „als Brot eures Gottes“. „Brot“ ist hier ein hebräischer Opferausdruck für Speise, die Gott dargebracht wird.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet einen körperlichen Fehler, durch den ein Tier als Opfer ungeeignet ist.
    reason: lexical_clarification
lexical_decisions:
- source_word: וּמִיַּד
  choice: Auch von
  rationale: Die Wendung bedeutet wörtlich „und aus der Hand von“, bezeichnet hier aber idiomatisch die Herkunft. „Auch von“ gibt den Sinn in natürlichem Deutsch wieder und verbindet den Satz mit dem vorausgehenden Verbot.
- source_word: בֶּן נֵכָר
  choice: einem Fremden
  rationale: Die wörtliche Wendung „Sohn eines Fremden“ bezeichnet idiomatisch einen Nichtisraeliten beziehungsweise Menschen fremder Herkunft. „Fremder“ ist im kultisch-rechtlichen Zusammenhang prägnant und würdevoll.
- source_word: תַקְרִיבוּ
  choice: darbringen
  rationale: Der Hifil von קרב bezeichnet im Opferkontext das Heranbringen beziehungsweise Darbringen einer Opfergabe. „Darbringen“ ist im Deutschen klar kultisch, ohne die Bildlichkeit unnötig auszubauen.
- source_word: לֶחֶם אֱלֹהֵיכֶם
  choice: Speise eures Gottes
  rationale: לֶחֶם bedeutet grundsätzlich „Brot“, wird hier jedoch als priesterlicher Opferausdruck weiter im Sinn von Gott dargebrachter Speise verwendet. Die Fußnote bewahrt die wörtliche Alternative.
- source_word: מִכָּל אֵלֶּה
  choice: nichts von alledem
  rationale: Die Formulierung bewahrt die partitive Bedeutung von מִן mit כָּל und verweist natürlich auf die zuvor genannten fehlerhaften Opfertiere.
- source_word: מָשְׁחָתָם
  choice: ihre Schädigung
  rationale: Das Wort kann Verderbnis, Beschädigung oder Entstellung bezeichnen. „Schädigung“ passt zu körperlich beeinträchtigten Opfertieren und bleibt vom folgenden allgemeineren „Makel“ unterscheidbar.
- source_word: מוּם
  choice: ein Makel
  rationale: מוּם ist der feste Ausdruck für einen körperlichen Fehler, der ein Opfertier disqualifiziert. „Makel“ bewahrt die kultische Prägung; die Fußnote erläutert die konkrete Bedeutung.
- source_word: לֹא יֵרָצוּ לָכֶם
  choice: Sie werden nicht für euch angenommen
  rationale: Der Nifal von רצה bezeichnet im Opferkontext die gnädige beziehungsweise kultische Annahme. „Für euch“ erhält den Bezug der Annahme auf die Darbringenden.
theological_decisions:
- issue: Kultischer Ausdruck für die Gott dargebrachte Gabe
  choice: Speise eures Gottes
  alternative: Brot eures Gottes
  rationale: Der Kontext handelt von Opfertieren, sodass „Speise“ den erweiterten priesterlichen Gebrauch von לֶחֶם verständlich wiedergibt. Die wörtliche Lesart wird nicht beseitigt, sondern in der Fußnote genannt.
- issue: Annahme des Opfers in Beziehung zu den Darbringenden
  choice: Sie werden nicht für euch angenommen
  alternative: Sie werden euch nicht wohlgefällig angenommen
  rationale: Die Übersetzung bewahrt das knappe לָכֶם und vermeidet es, die genaue Art der kultischen Wirksamkeit oder Begünstigung dogmatisch auszuformulieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kultische Schlüsselbegriffe wie „darbringen“ und „Makel“ bleiben erhalten; schwer verständliche hebräische Idiome werden natürlich wiedergegeben. Die Wiederholung von Schädigung und Makel spiegelt die nachdrückliche Formulierung des Ausgangstextes.
