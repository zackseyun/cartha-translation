base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/033.yaml
  text: who brought you out of the land of Egypt to be your God[a]. I am Yahweh.
translation:
  language: de
  text: der euch aus dem Land Ägypten herausgeführt hat, um euer Gott zu sein. Ich bin Jahwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַמּוֹצִיא
  choice: der … herausgeführt hat
  rationale: Das Hifil-Partizip beschreibt Jahwe relativsatzartig als den, der Israel aus Ägypten führte. Im Deutschen gibt der finite Relativsatz die Funktion natürlich wieder.
- source_word: אֶתְכֶם
  choice: euch
  rationale: Die Akkusativpartikel mit Suffix der 2. Person Plural wird unmittelbar mit „euch“ wiedergegeben.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: aus dem Land Ägypten
  rationale: Bewahrt die vollständige Exodusformel mit „Land Ägypten“; „aus“ bezeichnet die Herausführung aus diesem Gebiet.
- source_word: לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: um euer Gott zu sein
  rationale: Gibt die Zielangabe und die relationale Bundesformel idiomatisch wieder, ohne ihren Aussagegehalt zu erweitern.
- source_word: אֲנִי יְהוָה
  choice: Ich bin Jahwe
  rationale: Die verblos formulierte hebräische Selbstbezeichnung wird im Deutschen natürlich mit „bin“ ausgedrückt; der Gottesname wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird erkennbar wiedergegeben, statt ihn durch einen Titel zu ersetzen. Die traditionelle Wiedergabe „der HERR“ wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers beginnt als Fortsetzung des vorangehenden Satzes bewusst mit einem Relativsatz. „Herausgeführt“ bewahrt die Exodusbewegung, während „um euer Gott zu sein“ die Bundesformel klar und natürlich ausdrückt.
