  text: שׁ֣וֹר אוֹ כֶ֤שֶׂב אוֹ עֵז֙ כִּ֣י יִוָּלֵ֔ד וְ/הָיָ֛ה שִׁבְעַ֥ת יָמִ֖ים תַּ֣חַת אִמּ֑/וֹ וּ/מִ/יּ֤וֹם הַ/שְּׁמִינִי֙ וָ/הָ֔לְאָה יֵרָצֶ֕ה לְ/קָרְבַּ֥ן אִשֶּׁ֖ה לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/027.yaml
  text: When an ox or a sheep or a goat is born[a], it shall remain seven days under its mother, and from the eighth day onward it shall be accepted as a food offering to Yahweh.
translation:
  language: de
  text: Wenn ein Rind, ein Schaf oder eine Ziege geboren wird, soll das Junge sieben Tage bei seiner Mutter bleiben. Vom achten Tag an wird es als Feueropfer für Jahwe angenommen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als eine durch Feuer dargebrachte Opfergabe für Jahwe“. Die genaue Bedeutung des hebräischen Ausdrucks ist umstritten; traditionell wird er auf ein Opfer bezogen, das auf dem Altarfeuer dargebracht wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹר
  choice: Rind
  rationale: Der Begriff bezeichnet hier Rindvieh als Tiergattung; „Rind“ vermeidet eine unbegründete Festlegung auf Geschlecht oder Nutzungsart.
- source_word: כֶשֶׂב
  choice: Schaf
  rationale: Im Zusammenhang der Opferbestimmungen ist die Tierart gemeint, nicht zwingend ein junges Lamm oder ein männlicher Widder.
- source_word: עֵז
  choice: Ziege
  rationale: Das grammatisch feminine Substantiv dient hier als allgemeine Bezeichnung der Tierart.
- source_word: כִּי יִוָּלֵד
  choice: wenn … geboren wird
  rationale: כִּי führt einen Rechtsfall ein; die Niphalform von ילד bezeichnet das Geborenwerden.
- source_word: וְהָיָה שִׁבְעַת יָמִים תַּחַת אִמּוֹ
  choice: soll das Junge sieben Tage bei seiner Mutter bleiben
  rationale: „Das Junge“ macht den wechselnden Bezug nach der Aufzählung natürlich verständlich. תַּחַת bedeutet wörtlich „unter“, bezeichnet hier aber idiomatisch das Verbleiben beim Muttertier.
- source_word: וּמִיּוֹם הַשְּׁמִינִי וָהָלְאָה
  choice: Vom achten Tag an
  rationale: Die deutsche Wendung gibt den Beginn und die Fortdauer der Zulässigkeit knapp und natürlich wieder.
- source_word: יֵרָצֶה
  choice: wird es … angenommen
  rationale: Die Niphalform bezeichnet hier die kultische Annahme beziehungsweise Anerkennung als Opfer.
- source_word: לְקָרְבַּן אִשֶּׁה
  choice: als Feueropfer
  rationale: קָרְבָּן bezeichnet eine dargebrachte Opfergabe; אִשֶּׁה wird traditionell und im Kontext passend als durch Feuer dargebrachtes Opfer verstanden, ohne die umstrittene Deutung „Speiseopfer“ in den Haupttext einzutragen.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition bezeichnet hier die Ausrichtung beziehungsweise Bestimmung des Opfers; der Gottesname wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. „Jahwe“ bewahrt diesen Eigennamen, während „der HERR“ die traditionelle Ersatzlesung darstellt.
- issue: Bedeutung von אִשֶּׁה
  choice: Feueropfer
  alternative: Speiseopfer für Jahwe
  rationale: Die genaue Herleitung des Ausdrucks ist umstritten. „Feueropfer“ bewahrt den klaren kultischen Bezug auf das Feuer, ohne eine weitergehende Deutung als göttliche Speise festzuschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Aufzählung der Tierarten bleibt allgemein und geschlechtsneutral. „Bei seiner Mutter“ gibt die situationsbezogene Bedeutung des wörtlichen „unter seiner Mutter“ natürlich wieder.
