  terminology: „Makel“ und „darbringen“ sind für den Opferkontext passende, verständliche Begriffe. „Für euch nicht angenommen“ gibt לֹא לְרָצוֹן יִהְיֶה לָכֶם ohne konfessionelle Zuspitzung wieder. Die Fußnote kann die nähere Bedeutung von לְרָצוֹן als „wohlgefällig“ angeben.
