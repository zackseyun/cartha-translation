  text: כֹּ֛ל אֲשֶׁר בּ֥/וֹ מ֖וּם לֹ֣א תַקְרִ֑יבוּ כִּי לֹ֥א לְ/רָצ֖וֹן יִהְיֶ֥ה לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/020.yaml
  text: You shall not present anything that has a blemish[b][a], for it will not be accepted for you.
translation:
  language: de
  text: Alles, was einen Makel hat,[a] dürft ihr nicht darbringen; denn es wird für euch nicht angenommen werden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen Fehler hat“. Das hebräische Wort bezeichnet hier einen körperlichen Fehler, der ein Opfertier disqualifiziert.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „denn es wird für euch nicht wohlgefällig sein“.'
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּל אֲשֶׁר בּוֹ מוּם
  choice: Nichts, was einen Makel hat
  rationale: Die umfassende hebräische Wendung bezeichnet alles, woran sich ein disqualifizierender Fehler befindet. Die negative deutsche Formulierung gibt das anschließende Verbot natürlich und vollständig wieder, ohne ausdrücklich „Tier“ zu ergänzen.
- source_word: מוּם
  choice: Makel
  rationale: „Makel“ ist im Deutschen verständlich und bewahrt den kultischen Sinn eines körperlichen Fehlers, der ein Opfertier disqualifiziert; „Fehler“ ist als allgemeinere Alternative in der Fußnote genannt.
- source_word: לֹא תַקְרִיבוּ
  choice: dürft ihr nicht darbringen
  rationale: Der Hifil von קרב bezeichnet im Opferkontext das Heranbringen beziehungsweise Darbringen einer Gabe. „Darbringen“ ist idiomatisch, würdig und kultisch präzise.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung des Verbots ein; „denn“ entspricht dem knappen Rechtssatzstil.
- source_word: לֹא לְרָצוֹן יִהְיֶה לָכֶם
  choice: es wird für euch keine Annahme finden
  rationale: Die Formulierung wahrt den kultischen Begriff der wohlgefälligen Annahme und erhält mit „für euch“ die mögliche Beziehung auf die Opfernden beziehungsweise das Handeln zu ihren Gunsten.
theological_decisions:
- issue: Kultische Annahme des Opfers
  choice: es wird für euch keine Annahme finden
  alternative: es wird nicht zu euren Gunsten angenommen werden
  rationale: Der hebräische Ausdruck betrifft die Annahme des Opfers vor Gott und nicht nur seine abstrakte Zulässigkeit. Die gewählte Form bewahrt die sachliche Passivnähe und lässt offen, ob לָכֶם primär „für euch“ oder „zu euren Gunsten“ bedeutet.
translation_notes:
  register: Moderner, würdiger Rechtstext. „Darbringen“ und „Annahme finden“ bewahren den Opferkontext; die Fußnoten machen die lexikalische und relationale Bedeutungsbreite sichtbar.
