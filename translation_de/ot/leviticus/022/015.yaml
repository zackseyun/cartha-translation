source:
  edition: WLC
  text: וְ/לֹ֣א יְחַלְּל֔וּ אֶת קָדְשֵׁ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל אֵ֥ת אֲשֶׁר יָרִ֖ימוּ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/015.yaml
  text: They shall not profane the holy things of the sons of Israel[b][a], which they lift up to Yahweh.
translation:
  language: de
  text: Sie sollen die heiligen Gaben[a] der Israeliten, die sie Jahwe darbringen[b], nicht entweihen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die heiligen Dinge der Israeliten“.'
    reason: „Heilige Gaben“ gibt קָדְשֵׁי im kultischen Zusammenhang natürlich wieder; der hebräische Ausdruck kann allgemein geweihte Dinge bzw. Gaben bezeichnen.
  - marker: b
    text: „Darbringen“ kann auch mit „emporheben“ oder „als Abgabe übergeben“ wiedergegeben werden.
    reason: Das Hifil von רום kann die konkrete Vorstellung des Erhebens bewahren, bezeichnet im kultischen Zusammenhang aber auch das Präsentieren oder Übergeben einer heiligen Gabe.
lexical_decisions:
- source_word: יְחַלְּלוּ
  choice: entweihen
  rationale: Das Piel von חלל bezeichnet im kultischen Zusammenhang, etwas Heiliges seines heiligen Charakters zu berauben bzw. es zu entweihen. „Entweihen“ gibt den Gegensatz zwischen heilig und gewöhnlich natürlich und präzise wieder.
- source_word: קָדְשֵׁי
  choice: die heiligen Dinge
  rationale: Der substantivierte Plural im Konstrukt kann verschiedene geheiligte Dinge oder Gaben bezeichnen. Die bewusst offene Wiedergabe vermeidet eine unnötige Einengung auf eine bestimmte Opferart.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: der Israeliten
  rationale: „Israeliten“ ist im modernen Standarddeutsch die natürliche Bezeichnung für die בני ישראל und umfasst hier das Bundesvolk, ohne den hebräischen Ausdruck unidiomatisch als „Söhne Israels“ abzubilden.
- source_word: אֲשֶׁר יָרִימוּ
  choice: die sie … darbringen
  rationale: Das Hifil von רום kann bei kultischen Gaben das Erheben, Präsentieren oder Darbringen bezeichnen. „Darbringen“ ist im Deutschen verständlich und bewahrt den kultischen Sinn; die mögliche konkrete Bildlichkeit wird in einer Fußnote genannt.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Bundesname „Jahwe“ wiedergegeben.
- source_word: וְלֹא
  choice: sollen … nicht
  rationale: Der negierte Imperfekt hat im gesetzlichen Kontext gebietenden Charakter. „Sie sollen … nicht“ entspricht einem würdevollen, natürlichen deutschen Gesetzesstil.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Tetragrammaton als Gottes persönlichen Bundesnamen. „Jahwe“ macht diesen Namen im Haupttext sichtbar, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug des Relativsatzes אֲשֶׁר יָרִימוּ
  choice: Die Mehrdeutigkeit des Pronomens „sie“ bleibt erhalten.
  alternative: „die die Israeliten Jahwe darbringen“
  rationale: Die Verbform nennt lediglich ein Subjekt in der dritten Person Plural. Eine ausdrückliche Festlegung auf die Israeliten wäre im Kontext plausibel, aber expliziter als der hebräische Wortlaut.
translation_notes:
  register: Moderner, würdevoller Gesetzesstil. Die Satzstellung hält das Verbot klar zusammen; zugleich bleibt durch „die sie“ die im Hebräischen nicht ausdrücklich aufgelöste Subjektreferenz des Relativsatzes erhalten.
