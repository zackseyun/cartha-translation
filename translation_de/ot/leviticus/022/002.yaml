source:
  edition: WLC
  text: דַּבֵּ֨ר אֶֽל אַהֲרֹ֜ן וְ/אֶל בָּנָ֗י/ו וְ/יִנָּֽזְרוּ֙ מִ/קָּדְשֵׁ֣י בְנֵֽי יִשְׂרָאֵ֔ל וְ/לֹ֥א יְחַלְּל֖וּ אֶת שֵׁ֣ם קָדְשִׁ֑/י אֲשֶׁ֨ר הֵ֧ם מַקְדִּשִׁ֛ים לִ֖/י אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/002.yaml
  text: Speak to Aaron and to his sons[a], that they keep themselves from the holy things of the sons of Israel, and not profane my holy name, which they sanctify for me[c][b]. I am Yahweh.
translation:
  language: de
  text: 'Rede zu Aaron und seinen Söhnen: Sie sollen sich von den heiligen Gaben der Israeliten fernhalten[a] und meinen heiligen Namen nicht entweihen. Diese Gaben heiligen die Israeliten für mich.[b] Ich bin Jahwe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie sollen sich von den heiligen Dingen der Israeliten absondern“ beziehungsweise „sich ihrer enthalten“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich steht ein Relativsatz: „die sie für mich heiligen“. Gemeint sind die heiligen Gaben, welche die Israeliten Jahwe weihen.'
    reason: syntactic_clarification
lexical_decisions:
- source_word: דַּבֵּר
  choice: Rede
  rationale: Der Piel-Imperativ von דבר leitet hier den göttlichen Auftrag an Mose ein; „Rede mit“ ist im Deutschen direkt und natürlich.
- source_word: וְיִנָּזְרוּ
  choice: sie sollen sich … fernhalten
  rationale: Der Niphal von נזר bezeichnet hier ein Sich-Absondern beziehungsweise Sich-Enthalten im Blick auf Heiliges. „Sich fernhalten“ gibt die praktische Forderung verständlich wieder, ohne sie auf bloße räumliche Distanz zu verengen.
- source_word: מִקָּדְשֵׁי בְנֵי יִשְׂרָאֵל
  choice: von den heiligen Gaben der Israeliten
  rationale: קָדְשֵׁי ist grundsätzlich „heilige Dinge“, bezeichnet im kultischen Zusammenhang aber die von Israel geheiligten Gaben. „Heilige Gaben“ ist natürlicher als „heilige Dinge“ und bewahrt dennoch die sachliche Breite besser als eine Festlegung auf eine bestimmte Opferart.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die formale hebräische Nationalbezeichnung lautet wörtlich „Söhne Israels“. Im modernen Deutschen bezeichnet „die Israeliten“ dieselbe Volksgemeinschaft natürlich und schließt hier das ganze Volk ein.
- source_word: יְחַלְּלוּ
  choice: entweihen
  rationale: Der Piel von חלל bedeutet im Heiligkeitskontext, etwas Heiliges profan zu behandeln. „Entweihen“ ist im Deutschen klarer und idiomatischer als „profanieren“.
- source_word: שֵׁם קָדְשִׁי
  choice: meinen heiligen Namen
  rationale: Die deutsche Wortstellung gibt die hebräische Verbindung idiomatisch und genau wieder.
- source_word: אֲשֶׁר הֵם מַקְדִּשִׁים לִי
  choice: Diese Gaben heiligen die Israeliten für mich
  rationale: Der Relativsatz bezieht sich syntaktisch und kontextuell am ehesten auf die heiligen Gaben. Die Auflösung als eigener Satz verhindert im Deutschen den irreführenden Eindruck, die Israeliten heiligten Gottes Namen, und bewahrt mit „heiligen“ die Wortverbindung zum Heiligkeitsvokabular.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
theological_decisions:
- issue: Bezugswort des Relativsatzes אֲשֶׁר הֵם מַקְדִּשִׁים לִי
  choice: Der Satz bezieht sich auf die heiligen Gaben, welche die Israeliten für Jahwe heiligen.
  alternative: Der Satz könnte beim linearen Lesen lockerer auf „meinen heiligen Namen“ bezogen werden.
  rationale: Der kultische Zusammenhang und der normale Gebrauch von הקדיש mit Gaben sprechen deutlich für die heiligen Dinge als Bezug. Ein eigener deutscher Satz macht diese wahrscheinlichste Syntax verständlich; eine Fußnote dokumentiert die Auflösung.
- issue: Bedeutungsumfang von קָדְשֵׁי
  choice: heilige Gaben
  alternative: heilige Dinge; Heiligtümer; heilige Opfergaben
  rationale: Der Kontext handelt von geheiligten Anteilen und Gaben Israels. „Gaben“ ist verständlich, ohne die Aussage unnötig auf eine einzelne Opferkategorie festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Gottesrede bleibt knapp und gebietend. „Jahwe“ gibt das Tetragramm als persönlichen Gottesnamen wieder; „entweihen“ wahrt den kultisch-theologischen Ton in allgemein verständlicher Sprache.
