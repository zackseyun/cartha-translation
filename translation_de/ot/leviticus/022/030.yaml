id: LEV.22.30
reference: Leviticus 22:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בַּ/יּ֤וֹם הַ/הוּא֙ יֵאָכֵ֔ל לֹֽא תוֹתִ֥ירוּ מִמֶּ֖/נּוּ עַד בֹּ֑קֶר אֲנִ֖י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/030.yaml
  text: It shall be eaten on that same day[a]; you shall leave none of it until morning[b]. I am Yahweh.
translation:
  language: de
  text: Am selben Tag[a] soll es gegessen werden; ihr dürft nichts davon bis zum Morgen übrig lassen. Ich bin Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »an jenem Tag«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: am selben Tag
  rationale: Die Wendung bedeutet wörtlich »an jenem Tag«. Im Zusammenhang der Opferbestimmung bringt »am selben Tag« die zeitliche Beschränkung im natürlichen Deutschen klar zum Ausdruck, ohne den Sinn zu erweitern.
- source_word: יֵאָכֵל
  choice: soll es gegessen werden
  rationale: Der Nifal-Imperfekt von אכל formuliert hier eine unpersönliche passive Vorschrift. Die Wiedergabe bewahrt Passivform und rechtlichen Ton.
- source_word: לֹא תוֹתִירוּ מִמֶּנּוּ
  choice: ihr dürft nichts davon übrig lassen
  rationale: Das Hifil von יתר bedeutet »übrig lassen«. Die Formulierung gibt das Verbot verständlich und bestimmt wieder; die 2. Person Plural bleibt ausdrücklich erhalten.
- source_word: עַד בֹּקֶר
  choice: bis zum Morgen
  rationale: Die übliche Zeitangabe verbietet, einen Rest über Nacht bis zum nächsten Morgen aufzubewahren.
- source_word: אֲנִי יְהוָה
  choice: Ich bin Jahwe
  rationale: Die verblosen hebräische Selbstvorstellungsformel wird im Deutschen idiomatisch mit »bin« wiedergegeben; der Gottesname wird als »Jahwe« transliteriert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. »Jahwe« bewahrt den offenbarten Eigennamen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer rechtlicher Verbindlichkeit. Die passive Vorschrift des Hebräischen bleibt erhalten; unnötig altertümliche Formulierungen werden vermieden.
