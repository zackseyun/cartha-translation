source:
  edition: WLC
  text: נֶ֚פֶשׁ אֲשֶׁ֣ר תִּגַּע בּ֔/וֹ וְ/טָמְאָ֖ה עַד הָ/עָ֑רֶב וְ/לֹ֤א יֹאכַל֙ מִן הַ/קֳּדָשִׁ֔ים כִּ֛י אִם רָחַ֥ץ בְּשָׂר֖/וֹ בַּ/מָּֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/006.yaml
  text: The person who touches it shall be unclean until the evening[b][a], and shall not eat any of the holy things unless he has washed his body with water.
translation:
  language: de
  text: Wer es berührt, ist bis zum Abend unrein und darf nichts von den heiligen Gaben[a] essen, es sei denn, er hat seinen Körper[b] in Wasser gewaschen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von den heiligen Dingen“; im Zusammenhang sind geheiligte beziehungsweise zum Heiligtum gehörende Gaben gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „sein Fleisch im Wasser“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: wer
  rationale: Das hebräische נֶפֶשׁ bezeichnet hier im Gesetzeskontext eine einzelne Person. Die deutsche Relativkonstruktion „Wer …“ gibt den allgemeinen personenbezogenen Rechtssatz natürlich und ohne die irreführende Bedeutung „Seele“ wieder.
- source_word: אֲשֶׁר תִּגַּע בּוֹ
  choice: es berührt
  rationale: Das feminine Verb richtet sich grammatisch nach נֶפֶשׁ und bezeichnet nicht das Geschlecht der Person. Das Pronomen verweist auf den im vorherigen Kontext genannten Auslöser der Unreinheit; „es“ wahrt diesen Rückbezug, ohne einen männlichen menschlichen Bezug vorauszusetzen.
- source_word: וְטָמְאָה עַד הָעָרֶב
  choice: ist bis zum Abend unrein
  rationale: Die Wendung bezeichnet den daraus folgenden rituellen Zustand und dessen Dauer. „Unrein“ bewahrt die kultische Terminologie, während das Präsens einen deutschen Rechtssatz natürlich ausdrückt.
- source_word: וְלֹא יֹאכַל
  choice: darf nichts … essen
  rationale: Der Imperfekt mit Negation hat hier im Gesetzeskontext verbietende Kraft. „Darf nichts … essen“ ist klares, modernes Deutsch und bewahrt den rechtlichen Sinn.
- source_word: מִן הַקֳּדָשִׁים
  choice: von den heiligen Gaben
  rationale: Der substantivierte Plural bezeichnet hier die geheiligten Dinge beziehungsweise Speisen, von denen die Priester essen dürfen. „Heilige Gaben“ ist verständlich und kultisch passend; „nichts von“ gibt die partitive Präposition מִן wieder.
- source_word: כִּי אִם
  choice: es sei denn
  rationale: Die feste Verbindung führt die notwendige Ausnahmebedingung ein. „Es sei denn“ erhält diese konditionale Struktur, ohne sie als bloße zeitliche Abfolge umzudeuten.
- source_word: רָחַץ בְּשָׂרוֹ בַּמָּיִם
  choice: er hat seinen Körper mit Wasser gewaschen
  rationale: בָּשָׂר bedeutet wörtlich „Fleisch“, bezeichnet hier aber den leiblichen Körper. Die Formulierung gibt die konkrete Waschung in natürlichem modernem Deutsch wieder.
theological_decisions:
- issue: Art der Unreinheit
  choice: rituelle Unreinheit
  alternative: moralische Schuld oder sittliche Unreinheit
  rationale: Der Zusammenhang regelt nach einer Berührung die kultische Berechtigung zum Essen heiliger Gaben und nennt die Waschung als Voraussetzung. Der Ausdruck „unrein“ wird daher ohne zusätzliche moralische Schuldterminologie wiedergegeben.
- issue: Bedingung für das Essen der heiligen Gaben
  choice: Waschung des Körpers als ausdrücklich genannte notwendige Bedingung
  alternative: freie Umschreibung als vollständige innere oder moralische Reinigung
  rationale: Der Vers nennt konkret das Waschen des Körpers mit Wasser. Die Übersetzung beschränkt sich auf diese Aussage und fügt keine weitergehende Heils- oder Reinheitslehre hinzu.
translation_notes:
  register: Moderner, würdiger Gesetzesstil. Die allgemeine Formulierung „Wer“ vermeidet unnötige Geschlechtsmarkierung. Kultische Fachsprache bleibt mit „unrein“ und „heilige Gaben“ erkennbar; die beiden Fußnoten dokumentieren die konkreteren hebräischen Ausdrucksweisen.
