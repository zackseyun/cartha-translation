source:
  edition: WLC
  text: וְ/שׁ֥וֹר וָ/שֶׂ֖ה שָׂר֣וּעַ וְ/קָל֑וּט נְדָבָה֙ תַּעֲשֶׂ֣ה אֹת֔/וֹ וּ/לְ/נֵ֖דֶר לֹ֥א יֵרָצֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/023.yaml
  text: But an ox or a sheep that has a limb too long or too short—you may make it a freewill offering[a], but for a vow it will not be accepted.
translation:
  language: de
  text: Ein Rind oder ein Stück Kleinvieh mit einem zu langen oder zu kurzen Körperteil[a] darfst du als freiwillige Gabe darbringen; als Gelübdeopfer aber wird es nicht angenommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder allgemeiner: »missgebildet oder verkümmert«. Die hebräischen Begriffe bezeichnen wahrscheinlich entgegengesetzte Arten körperlicher Missverhältnisse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשׁוֹר
  choice: ein Rind
  rationale: שׁוֹר bezeichnet ein Tier aus der Rindergattung; „Rind“ ist im Deutschen geschlechtsneutral und passt zur allgemeinen Opfervorschrift.
- source_word: וָשֶׂה
  choice: oder ein Schaf
  rationale: שֶׂה bezeichnet ein einzelnes Tier vom Kleinvieh, also Schaf oder Ziege. „Schaf“ folgt der konventionellen Wiedergabe, ohne ein bestimmtes Alter vorauszusetzen.
- source_word: שָׂרוּעַ וְקָלוּט
  choice: mit einem zu langen oder zu kurzen Glied
  rationale: Die beiden seltenen Begriffe bezeichnen wahrscheinlich entgegengesetzte körperliche Missverhältnisse, insbesondere ein verlängertes beziehungsweise verkürztes Glied. Die verbleibende Unsicherheit wird in der Fußnote kenntlich gemacht.
- source_word: נְדָבָה
  choice: freiwillige Gabe
  rationale: נְדָבָה ist eine freiwillig dargebrachte Opfergabe im Gegensatz zu einer durch ein Gelübde geschuldeten Gabe.
- source_word: תַּעֲשֶׂה אֹתוֹ
  choice: darfst du ... darbringen
  rationale: Wörtlich steht „du darfst es machen/tun“; im Opferzusammenhang gibt „darbringen“ den gemeinten Vollzug natürlich und verständlich wieder.
- source_word: וּלְנֵדֶר
  choice: als Gelübdeopfer
  rationale: נֵדֶר bezeichnet hier eine aufgrund eines Gelübdes geschuldete Opfergabe. „Gelübdeopfer“ macht diesen kultischen Gegensatz knapp deutlich.
- source_word: לֹא יֵרָצֶה
  choice: wird es nicht angenommen
  rationale: Das Niphal von רצה bezeichnet im Opferkontext die wohlgefällige Annahme; die passive Form bewahrt, dass der Handelnde im Hebräischen nicht ausdrücklich genannt wird.
theological_decisions:
- issue: Genaue Art der Mängel שָׂרוּעַ und קָלוּט
  choice: Wiedergabe als „mit einem zu langen oder zu kurzen Glied“
  alternative: „missgebildet oder verkümmert“ beziehungsweise „mit einem zu großen oder zu kleinen Körperteil“
  rationale: Das Begriffspaar scheint gegensätzliche körperliche Missverhältnisse zu bezeichnen. Die konkrete Wiedergabe wahrt den wahrscheinlichen Bildgehalt; wegen der lexikalischen Unsicherheit steht die allgemeinere Möglichkeit in der Fußnote.
- issue: Nicht ausdrücklich genanntes Subjekt der Annahme
  choice: 'Passiv: „wird es nicht angenommen“'
  alternative: „Gott wird es nicht annehmen“
  rationale: Der Kontext legt die göttliche Annahme nahe, doch der hebräische Satz nennt Gott nicht ausdrücklich. Das Passiv vermeidet eine unnötige Explizierung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Freiwillige Gabe“ und „Gelübdeopfer“ verdeutlichen den kultischen Gegensatz ohne altertümliche oder konfessionell geprägte Terminologie.
