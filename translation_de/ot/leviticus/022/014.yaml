source:
  edition: WLC
  text: וְ/אִ֕ישׁ כִּֽי יֹאכַ֥ל קֹ֖דֶשׁ בִּ/שְׁגָגָ֑ה וְ/יָסַ֤ף חֲמִֽשִׁית/וֹ֙ עָלָ֔י/ו וְ/נָתַ֥ן לַ/כֹּהֵ֖ן אֶת הַ/קֹּֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/014.yaml
  text: And if a man eats a holy thing unintentionally[d][c][b][a], then he shall add a fifth to it and give the holy thing to the priest.
translation:
  language: de
  text: Wenn jemand[a] aus Versehen[b] etwas Heiliges[c] isst, soll er ein Fünftel davon dazulegen[d] und dem Priester das Heilige geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ein Mann“; das hebräische אִישׁ kann in einer Rechtsformel allgemein für eine Person stehen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „unbeabsichtigt“, „irrtümlich“.'
    reason: lexical_alternative
  - marker: c
    text: Gemeint ist etwas Geheiligtes, insbesondere geheiligte Speise oder geheiligter Besitz, der dem priesterlichen Bereich vorbehalten ist.
    reason: cultural_note
  - marker: d
    text: 'Wörtlicher: „sein Fünftel dazu hinzufügen“; gemeint ist ein Zuschlag von einem Fünftel zum Ersatz für das Verzehrte.'
    reason: translation_clarity
lexical_decisions:
- source_word: וְאִישׁ
  choice: wenn jemand
  rationale: אִישׁ steht in dieser kasuistischen Rechtsformel im maskulinen Singular, kann jedoch allgemein eine Person bezeichnen. „Jemand“ gibt diese generische Funktion im heutigen Deutsch natürlich wieder; die wörtliche Form wird in einer Fußnote genannt.
- source_word: כִּי
  choice: wenn
  rationale: כִּי leitet hier den angenommenen Rechtsfall ein; „wenn“ entspricht der deutschen Gesetzessprache.
- source_word: יֹאכַל
  choice: isst
  rationale: Das Imperfekt beschreibt innerhalb der Bedingung den eintretenden Fall. Das Präsens ist im Deutschen dafür idiomatisch.
- source_word: קֹדֶשׁ
  choice: etwas Heiliges / das Heilige
  rationale: קֹדֶשׁ bezeichnet hier etwas Geheiligtes, das dem priesterlichen Bereich vorbehalten ist. Die breite Wiedergabe vermeidet die nicht ausdrücklich im Vers enthaltene Verengung auf Speise oder Opfergabe und bewahrt die Wiederholung des hebräischen Begriffs.
- source_word: בִּשְׁגָגָה
  choice: aus Versehen
  rationale: שְׁגָגָה bezeichnet ein unbeabsichtigtes Vergehen, nicht vorsätzliches Handeln. „Aus Versehen“ ist klares, gegenwärtiges Deutsch.
- source_word: וְיָסַף חֲמִשִׁיתוֹ עָלָיו
  choice: soll er ein Fünftel davon dazulegen
  rationale: Die Wendung verlangt einen Zuschlag von einem Fünftel zum zu ersetzenden Heiligen. „Dazulegen“ bringt die additive Bedeutung von יסף ... על natürlich zum Ausdruck, während „davon“ den Suffixbezug in חֲמִשִׁיתוֹ wahrt.
- source_word: וְנָתַן
  choice: und ... geben
  rationale: נתן bedeutet „geben“. Trotz des Erstattungszusammenhangs bleibt „geben“ näher am Wortlaut als das deutlicher auslegende „erstatten“.
- source_word: לַכֹּהֵן
  choice: dem Priester
  rationale: Der Artikel bezeichnet im Zusammenhang den zuständigen priesterlichen Empfänger.
theological_decisions:
- issue: Generisches Maskulinum in der Rechtsformel
  choice: „jemand“ im Haupttext, mit Hinweis auf die wörtliche maskuline Form
  alternative: „ein Mann“
  rationale: אִישׁ ist grammatisch maskulin, fungiert in solchen Rechtssätzen aber häufig generisch. „Jemand“ bewahrt den allgemeinen Geltungsbereich, ohne die Form des Hebräischen in der Fußnote zu verschweigen.
- issue: Art des geheiligten Gegenstands
  choice: קֹדֶשׁ als „etwas Heiliges / das Heilige“ wiedergeben
  alternative: „heilige Speise“ oder „heiliger Anteil“
  rationale: Der Zusammenhang betrifft den Verzehr von Geheiligtem und dessen Ersatz, doch der Vers selbst verwendet den breiteren Ausdruck קֹדֶשׁ. Die Übersetzung legt sich daher nicht unnötig auf eine engere Sachkategorie fest.
- issue: Bezug des Fünftels
  choice: „ein Fünftel davon dazulegen“
  alternative: „ein Fünftel hinzufügen“
  rationale: Das Suffix in חֲמִשִׁיתוֹ bezieht das Fünftel auf das verzehrte Heilige beziehungsweise dessen Ersatzwert. „Davon“ erhält diesen Bezug, ohne den Text ausdrücklich auf eine Geldzahlung festzulegen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Ton. Die konditionale Rechtsform wird mit „Wenn ... soll“ wiedergegeben. „Etwas Heiliges“ hält den kultischen Begriff bewusst breit; „dazulegen“ vermeidet eine schwerfällige wörtliche Konstruktion, ohne den vorgeschriebenen Fünftelzuschlag abzuschwächen.
