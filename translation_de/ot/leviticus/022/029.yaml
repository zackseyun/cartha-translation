  text: And when you sacrifice a thank offering to Yahweh[a], you shall sacrifice it for your acceptance.
translation:
  language: de
  text: Und wenn ihr Jahwe ein Dankopfer[a] schlachtet, sollt ihr es so schlachten, dass es zu euren Gunsten angenommen wird.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „ein Opfer des Dankes“ oder „ein Schlachtopfer des Dankes“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „zu eurem Wohlgefallen“; im Opferkontext bezeichnet dies die Annahme des Opfers zugunsten der Opfernden.'
    reason: translation_clarity
lexical_decisions:
- source_word: וְ/כִּי
  choice: Und wenn
  rationale: Die Verbindung leitet im gesetzlichen Zusammenhang einen zeitlich-bedingten Fall ein und führt zugleich die vorausgehenden Vorschriften fort.
- source_word: תִזְבְּחוּ / תִּזְבָּחוּ
  choice: ihr schlachtet / sollt ihr es ... schlachten
  rationale: זבח bezeichnet hier das kultische Schlachten eines Opfertiers. Die Wiederholung des Verbs wird beibehalten; das ergänzte „es“ verweist natürlich auf das Dankopfer zurück.
- source_word: זֶבַח תּוֹדָה
  choice: Dankopfer
  rationale: Die deutsche Zusammensetzung gibt die Opferart knapp und idiomatisch wieder; eine wörtlichere Alternative wird in der Fußnote genannt.
- source_word: לַ/יהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als Eigenname wiedergegeben.
- source_word: לִ/רְצֹנְכֶם
  choice: dass es euch wohlgefällig angenommen wird
  rationale: Im Opferkontext bezeichnet רָצוֹן die wohlgefällige Annahme des Opfers zugunsten der Opfernden. Die Formulierung macht den knappen hebräischen Ausdruck in natürlichem Deutsch verständlich, ohne ihn auf die subjektive Bereitwilligkeit der Opfernden zu beziehen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst; die Umschrift wahrt seinen Charakter als Eigenname.
- issue: Bedeutung von לִרְצֹנְכֶם
  choice: göttliche Annahme des Opfers zugunsten der Opfernden
  alternative: nach eurem Willen / freiwillig
  rationale: Der kultische Zusammenhang und der vergleichbare Gebrauch von רָצוֹן in den Opferbestimmungen sprechen für Annehmbarkeit beziehungsweise wohlgefällige Annahme; die knappe Konstruktion bleibt jedoch erklärungsbedürftig und wird deshalb mit einer Fußnote abgesichert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Schlachten“ bewahrt den konkreten kultischen Sinn und die hebräische Verbwiederholung; „wohlgefällig angenommen“ erschließt die knappe Opferterminologie für heutige Leser.
