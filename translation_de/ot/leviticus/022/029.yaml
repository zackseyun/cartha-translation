    issue: „dass es euch wohlgefällig angenommen wird“
    rationale: Die Wendung ist im Deutschen schwer verständlich und doppelt die Annahmeidee („wohlgefällig“/„angenommen“). Außerdem lässt „euch wohlgefällig“ offen, ob das Opfer den Opfernden oder Gott gefällt. Der Kontext verlangt die Annahme des Opfers zugunsten der Opfernden.
  - severity: low
    issue: 'Fußnote b: „Wörtlicher: zu eurer Annahme“'
    rationale: Dies ist keine besonders natürliche deutsche wörtliche Wiedergabe und kann den Eindruck erwecken, die Opfernden nähmen das Opfer an. Eine Erklärung des kultischen Sinns ist hier hilfreicher.
