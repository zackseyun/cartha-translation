  rationale: Der Schlusssatz wird so gefasst, dass die im Opferkontext gemeinte Annahme klar erkennbar ist, ohne die knappe hebräische Wendung in eine Aussage über den persönlichen Willen der Opfernden umzudeuten. Die Verbwiederholung bleibt erhalten.
