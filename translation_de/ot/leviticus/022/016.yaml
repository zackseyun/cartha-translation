  text: and so cause them to bear guilt requiring restitution by eating their holy things[c][b][a], for I am Yahweh who sanctifies them.
translation:
  language: de
  text: Und ihnen so Schuld aufladen, die Wiedergutmachung erfordert, indem sie ihre heiligen Gaben essen[a][b]; denn ich bin Jahwe, der sie heiligt[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und Schuld über sie bringen“; die hebräische Wendung ist schwierig und kann besonders die Haftung für ein Schuldvergehen betonen.'
    reason: lexical_alternative
  - marker: b
    text: „Ihre heiligen Gaben“ meint geweihte Gaben oder Opferanteile.
    reason: cultural_note
  - marker: c
    text: 'Oder: „der sie heilig macht“ beziehungsweise „der sie weiht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשִּׂיאוּ
  choice: und ihnen so … aufladen
  rationale: Der Hifil von נשׂא ist hier kausativ. Die Formulierung gibt sowohl das Verursachen als auch den möglichen Folgesinn der Verbindung zum vorhergehenden Verbot wieder.
- source_word: אוֹתָם
  choice: ihnen
  rationale: Das Objektpronomen wird im Deutschen passend zur Wendung „jemandem Schuld aufladen“ als Dativ wiedergegeben.
- source_word: עֲוֺן אַשְׁמָה
  choice: Schuld, die Wiedergutmachung erfordert
  rationale: Die schwierige kultisch-rechtliche Wortverbindung bezeichnet Schuld beziehungsweise Haftung aufgrund eines Schuldvergehens; die Wiedergabe macht den Bezug auf Wiedergutmachung verständlich, ohne ihn auf eine bestimmte Opferhandlung zu verengen.
- source_word: בְּאָכְלָם
  choice: wenn sie … essen
  rationale: ב mit Infinitivus constructus kann Umstand, Zeitpunkt oder Mittel ausdrücken. „Wenn sie … essen“ klingt natürlich und bewahrt die kontextuelle Offenheit.
- source_word: קָדְשֵׁיהֶם
  choice: ihre heiligen Gaben
  rationale: Wörtlich steht „ihre heiligen Dinge“. Im levitischen Zusammenhang sind geweihte Gaben beziehungsweise Opferanteile gemeint; „heilige Gaben“ ist verständlich und kultisch angemessen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מְקַדְּשָׁם
  choice: der sie heiligt
  rationale: Das Piel-Partizip von קדשׁ bedeutet „heiligen, heilig machen, weihen“. „Heiligt“ wahrt den kultisch-theologischen Sprachgebrauch und die knappe Form des Hebräischen.
theological_decisions:
- issue: Bezugswort des Suffixes in מְקַדְּשָׁם
  choice: „sie“ bleibt im Haupttext ohne erklärende Festlegung stehen und bezieht sich am ehesten auf die betreffenden Menschen
  alternative: Bezug auf die heiligen Gaben
  rationale: Das maskuline Pluralsuffix verweist syntaktisch eher auf die zuvor behandelten Personen als auf קָדְשֵׁיהֶם. Die Übersetzung bewahrt jedoch die pronominale Form, statt die Auslegung ausdrücklich in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rechtlich-kultische Sprache bleibt erkennbar, wird aber durch „Schuld, die Wiedergutmachung erfordert“ für heutige Leser verständlich gemacht. Die drei Fußnotenmarker stehen jeweils an der sachlich passenden Stelle im Haupttext.
