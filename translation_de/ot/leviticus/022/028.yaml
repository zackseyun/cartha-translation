source:
  edition: WLC
  text: וְ/שׁ֖וֹר אוֹ שֶׂ֑ה אֹת֣/וֹ וְ/אֶת בְּנ֔/וֹ לֹ֥א תִשְׁחֲט֖וּ בְּ/י֥וֹם אֶחָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/028.yaml
  text: Whether an ox or a sheep, you shall not slaughter it and its young on one day.
translation:
  language: de
  text: 'Ob Rind oder Stück Kleinvieh: Ihr dürft das Tier und sein Junges[a] nicht am selben Tag schlachten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »es und seinen Sohn«; gemeint ist ein Tier zusammen mit seinem Nachwuchs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹר
  choice: Rind
  rationale: שׁוֹר bezeichnet ein einzelnes Tier der Rindergattung. „Rind“ ist im Deutschen geschlechtsneutral und vermeidet die zu enge Festlegung auf „Stier“ oder „Ochse“.
- source_word: שֶׂה
  choice: Stück Kleinvieh
  rationale: שֶׂה bezeichnet ein einzelnes Tier aus der Schaf- oder Ziegenherde. „Stück Kleinvieh“ bewahrt diese im Hebräischen vorhandene Offenheit; „Schaf“ würde Ziegen ausschließen, „Lamm“ zusätzlich ein bestimmtes Alter voraussetzen.
- source_word: אֹתוֹ וְאֶת־בְּנוֹ
  choice: das Tier und sein Junges
  rationale: Wörtlich steht „es und seinen Sohn“. Im Deutschen gibt „das Tier und sein Junges“ den Bezug auf Tier und Nachwuchs natürlich wieder, ohne ein männliches Jungtier oder ausdrücklich das Muttertier festzulegen.
- source_word: תִשְׁחֲטוּ
  choice: dürft ... nicht ... schlachten
  rationale: שׁחט ist der übliche Ausdruck für das Schlachten von Tieren, besonders im Opfer- und Rechtskontext. Die Form der 2. Person Plural wird mit „ihr dürft“ wiedergegeben.
- source_word: בְּיוֹם אֶחָד
  choice: am selben Tag
  rationale: Wörtlich „an einem Tag“; im Verbot bezeichnet die Wendung, dass beide Tiere nicht innerhalb desselben Tages geschlachtet werden dürfen. „Am selben Tag“ ist im modernen Deutschen eindeutig und idiomatisch.
- source_word: וְ ... אוֹ
  choice: Ob ... oder
  rationale: Das einleitende וְ führt einen weiteren Rechtsfall ein, während אוֹ die Alternativen verbindet. „Ob ... oder“ gibt diese rechtssprachliche Fallunterscheidung natürlich wieder.
theological_decisions:
- issue: Geschlecht und Verwandtschaft der Tiere
  choice: Keine Festlegung auf Muttertier oder männliches Jungtier im Haupttext
  alternative: „die Mutter und ihren Sohn“
  rationale: Der hebräische Wortlaut verwendet grammatisch maskuline Formen, nennt aber in diesem Vers weder ausdrücklich die Mutter noch legt er das biologische Geschlecht des Nachwuchses sicher fest. Die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Moderne, würdige Rechtssprache. Der Doppelpunkt gliedert den vorangestellten Geltungsbereich vom Verbot. „Stück Kleinvieh“ ist etwas fachsprachlich, aber sachlich präzise und bewahrt die mögliche Bezugnahme auf Schaf oder Ziege.
