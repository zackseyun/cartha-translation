source:
  edition: WLC
  text: עַוֶּרֶת֩ א֨וֹ שָׁב֜וּר אוֹ חָר֣וּץ אֽוֹ יַבֶּ֗לֶת א֤וֹ גָרָב֙ א֣וֹ יַלֶּ֔פֶת לֹא תַקְרִ֥יבוּ אֵ֖לֶּה לַ/יהוָ֑ה וְ/אִשֶּׁ֗ה לֹא תִתְּנ֥וּ מֵ/הֶ֛ם עַל הַ/מִּזְבֵּ֖חַ לַ/יהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/022.yaml
  text: Anything blind[a], broken, mutilated, or with a wart, scab, or skin disease, these you shall not present to Yahweh; and you shall not place any of them on the altar as a food offering to Yahweh.
translation:
  language: de
  text: Ein Tier, das blind oder gebrochen oder verstümmelt ist oder eine Warze, Schorf oder eine Hautkrankheit hat, dürft ihr Jahwe nicht darbringen. Auch dürft ihr nichts davon als Feueropfer[a] für Jahwe auf den Altar legen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Opfergabe durch Feuer; auch: durch Feuer dargebrachtes Opfer.'
    reason: Lexikalische Alternative für אִשֶּׁה. Der genaue kultische Bedeutungsumfang des Begriffs ist umstritten.
lexical_decisions:
- source_word: עַוֶּרֶת
  choice: blind
  rationale: Das Wort bezeichnet hier in einer Liste von Opfermängeln ein blindes Tier; die adjektivische Wiedergabe ist im Deutschen natürlich.
- source_word: שָׁבוּר
  choice: gebrochen
  rationale: Das passive Partizip bezeichnet einen Bruch, wahrscheinlich an einem Körperteil oder Glied des Tieres. „Gebrochen“ bewahrt die knappe Formulierung des Hebräischen.
- source_word: חָרוּץ
  choice: verstümmelt
  rationale: Der Ausdruck bezeichnet etwas Eingeschnittenes oder Abgetrenntes und damit wahrscheinlich eine schwere körperliche Verstümmelung.
- source_word: יַבֶּלֶת
  choice: Warze
  rationale: Das Substantiv bezeichnet eine sichtbare Hautwucherung; „Warze“ ist eine klare und allgemein verständliche Entsprechung.
- source_word: גָרָב
  choice: Krätze
  rationale: Das Wort bezeichnet eine auffällige Hauterkrankung. „Krätze“ gibt den krankhaften Befund konkreter wieder als das mehrdeutige „Schorf“, ohne eine moderne Diagnose sicher zu behaupten.
- source_word: יַלֶּפֶת
  choice: Hautkrankheit
  rationale: Die genaue dermatologische Erscheinung ist unsicher. Der Oberbegriff vermeidet eine unbegründete Festlegung auf Ekzem, Ausschlag oder Flechte.
- source_word: תַקְרִיבוּ
  choice: darbringen
  rationale: Im Opferkontext bezeichnet der Hifil von קרב das kultische Heranbringen beziehungsweise Darbringen eines Opfers.
- source_word: אִשֶּׁה
  choice: Speiseopfer
  rationale: Der priesterliche Opferbegriff kann eine auf dem Altar dargebrachte Gabe bezeichnen. „Speiseopfer“ ist verständlich, während die traditionelle Alternative „Feueropfer“ in der Fußnote erhalten bleibt.
- source_word: תִתְּנוּ מֵהֶם עַל הַמִּזְבֵּחַ
  choice: nichts davon auf den Altar legen
  rationale: Die Formulierung gibt sowohl die konkrete Handlung am Altar als auch den partitiven Sinn von מֵהֶם idiomatisch wieder.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text ausdrücklich stehende Gottesname יהוה wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Wiedergabe als Eigenname macht den im Ausgangstext verwendeten Bundesnamen sichtbar, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von אִשֶּׁה
  choice: Speiseopfer
  alternative: Feueropfer / durch Feuer dargebrachtes Opfer
  rationale: Der Begriff ist mit Altargaben und ihrer Verbrennung verbunden, seine genaue Nuance ist jedoch umstritten. Die Hauptübersetzung folgt der Deutung als Speisegabe; die feuerbezogene Deutung wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Ein Tier“ wird zur natürlichen Verdeutlichung des im Zusammenhang vorausgesetzten Bezugs ergänzt. Die Liste der Mängel und die beiden Verbote bleiben eng an der hebräischen Satzfolge; der lange Ausgangssatz wird für bessere Verständlichkeit in zwei Sätze gegliedert.
