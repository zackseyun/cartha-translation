  naturalness: „Von den Fremden, die in Israel wohnen“ ist nach „Jeder Mann aus dem Haus Israel oder“ syntaktisch holprig. „Jeder in Israel ansässige Fremde“ ist modernes, rechtlich verständliches Deutsch. „Zur Erfüllung eines Gelübdes oder als freiwillige Gabe“ ist natürlich und bewahrt den kultisch-rechtlichen Registerton.
  terminology: „Aaron“, „seinen Söhnen“, „Israeliten“, „Haus Israel“, „Opfergabe“, „Jahwe“ und „Brandopfer“ sind sachgerecht. „Ansässiger Fremder“ trifft גֵּר besser als das unqualifizierte „Fremde“. Die Fußnote vermeidet die nicht zwingende Behauptung eines dauerhaften Status.
