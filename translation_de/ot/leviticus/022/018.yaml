source:
  edition: WLC
  text: דַּבֵּ֨ר אֶֽל אַהֲרֹ֜ן וְ/אֶל בָּנָ֗י/ו וְ/אֶל֙ כָּל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אִ֣ישׁ אִישׁ֩ מִ/בֵּ֨ית יִשְׂרָאֵ֜ל וּ/מִן הַ/גֵּ֣ר בְּ/יִשְׂרָאֵ֗ל אֲשֶׁ֨ר יַקְרִ֤יב קָרְבָּנ/וֹ֙ לְ/כָל נִדְרֵי/הֶם֙ וּ/לְ/כָל נִדְבוֹתָ֔/ם אֲשֶׁר יַקְרִ֥יבוּ לַ/יהוָ֖ה לְ/עֹלָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/018.yaml
  text: 'Speak to Aaron and to his sons and to all the sons of Israel[a], and say to them: Any man from the house of Israel, or from the sojourners in Israel, who presents his offering for any of their vows or any of their freewill offerings[c][b], which they present to Yahweh as a burnt offering—'
translation:
  language: de
  text: 'Rede zu Aaron, zu seinen Söhnen und zu allen Israeliten und sage ihnen: Jeder Mann aus dem Haus Israel oder jeder in Israel ansässige Fremde, der seine Opfergabe darbringt – sei es zur Erfüllung eines Gelübdes oder als freiwillige Gabe –, die sie Jahwe als Brandopfer darbringen,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּבֵּר
  choice: Rede
  rationale: Der Piel-Imperativ leitet eine verbindliche göttliche Weisung ein; „Rede“ wahrt den würdigen Gesetzesstil.
- source_word: בָּנָיו
  choice: seinen Söhnen
  rationale: Das Hebräische bezeichnet ausdrücklich Aarons Söhne und passt zum priesterlichen Zusammenhang.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: alle Israeliten
  rationale: Die wörtliche Wendung „alle Söhne Israels“ ist eine hebräische Volksbezeichnung; „alle Israeliten“ gibt sie im heutigen Deutsch natürlich und vollständig wieder.
- source_word: אִישׁ אִישׁ
  choice: Jeder Mann
  rationale: Die Wiederholung hat distributive Bedeutung („jeder einzelne Mann“) und die maskuline Form bleibt sichtbar.
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: aus dem Haus Israel
  rationale: Die bundestheologisch geprägte Bezeichnung „Haus Israel“ wird formal bewahrt.
- source_word: הַגֵּר בְּיִשְׂרָאֵל
  choice: von den Fremden, die in Israel wohnen
  rationale: גֵּר bezeichnet hier nicht beliebige Besucher, sondern nichtisraelitische Menschen mit dauerhaftem Wohn- und Gemeinschaftsstatus in Israel.
- source_word: יַקְרִיב קָרְבָּנוֹ
  choice: seine Opfergabe darbringt
  rationale: Im Opferkontext bezeichnet das Hifil von קרב das Heranbringen beziehungsweise Darbringen einer קָרְבָּן; „Opfergabe“ bleibt als Oberbegriff ausreichend weit.
- source_word: לְכָל נִדְרֵיהֶם
  choice: aufgrund eines ihrer Gelübde
  rationale: Die Formulierung bewahrt den Bezug der Gabe auf ein Gelübde, ohne ausdrücklich ein im Hebräischen nicht genanntes Substantiv „Gelübdeopfer“ einzusetzen.
- source_word: נִדְבוֹתָם
  choice: ihre freiwilligen Gaben
  rationale: Der Ausdruck bezeichnet freiwillig dargebrachte Opfergaben als kultische Kategorie.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der im Text stehende Gottesname יהוה wird als Eigenname wiedergegeben.
- source_word: לְעֹלָה
  choice: als Brandopfer
  rationale: עֹלָה ist der Fachausdruck für das vollständig auf dem Altar verbrannte Opfer.
theological_decisions:
- issue: Maskuline distributive Rechtssprache
  choice: Jeder Mann
  alternative: Jeder; wer auch immer
  rationale: אִישׁ אִישׁ ist grammatisch maskulin und distributiv. Die gewählte Fassung bewahrt beides, ohne über den möglichen Rechtsadressatenkreis hinaus zu verallgemeinern.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als solcher kenntlich gemacht; die traditionelle Ersatzlesung „der HERR“ bleibt eine mögliche liturgische Wiedergabe, steht jedoch nicht als Appellativ im hebräischen Ausgangstext.
- issue: Bezug der Pluralpronomen in נִדְרֵיהֶם und נִדְבוֹתָם
  choice: eines ihrer Gelübde / eine ihrer freiwilligen Gaben
  alternative: eines seiner Gelübde / eine seiner freiwilligen Gaben
  rationale: Der hebräische Text wechselt nach dem distributiven Singular zu Pluralformen. Diese Spannung wird nicht stillschweigend zu einem durchgehenden Singular geglättet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rechtlich-kultischem Ton. Die hebräische Satzperiode bleibt entsprechend dem Folgevers offen; daher endet der Vers mit einem Komma. „Israeliten“ vermeidet das im Deutschen missverständliche „Söhne Israels“, während „Haus Israel“ als bedeutungstragende Bundesbezeichnung erhalten bleibt.
