    rationale: „Dauerhaft“ geht über die lexikalisch sichere Aussage hinaus. Der Begriff bezeichnet einen nichtisraelitischen Einwohner innerhalb Israels bzw. seiner Gemeinschaftsordnung, ohne dass hier die Dauer seines Aufenthalts näher bestimmt wird.
