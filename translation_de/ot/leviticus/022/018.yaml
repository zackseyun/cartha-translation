- from: 'Rede zu Aaron, zu seinen Söhnen und zu allen Israeliten und sage zu ihnen: Jeder Mann aus dem Haus Israel oder von den Fremden, die in Israel wohnen[a], der seine Opfergabe darbringt – sei es aufgrund eines ihrer Gelübde oder als eine ihrer freiwilligen Gaben[b] –, die sie Jahwe als Brandopfer darbringen,'
  to: 'Rede zu Aaron, zu seinen Söhnen und zu allen Israeliten und sage ihnen: Jeder Mann aus dem Haus Israel oder jeder in Israel ansässige Fremde, der seine Opfergabe darbringt – sei es zur Erfüllung eines Gelübdes oder als freiwillige Gabe –, die sie Jahwe als Brandopfer darbringen,'
  rationale: Die Revision behebt die unidiomatische Gruppenanbindung und klärt die Beziehung zwischen Gelübde und freiwilliger Gabe. Sie erhält die offene Satzperiode zum Folgevers, die Benennung Jahwes sowie die kultischen Fachbegriffe. Die relative Pluralform des Hebräischen bleibt mit „die sie ... darbringen“ sichtbar, ohne eine strittige syntaktische Präzisierung aufzuzwingen.
