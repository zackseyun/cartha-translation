lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: sprach
  rationale: Das narrative Verb aus דבר leitet einen neuen Redeabschnitt ein; „sprach“ gibt die feierliche biblische Formel im Deutschen natürlich und knapp wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition bezeichnet hier den Adressaten der Rede; „zu Mose sprechen“ ist die idiomatische deutsche Fügung.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Der Personenname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv leitet den folgenden direkten Wortlaut ein. Im modernen Deutschen erfüllt der Doppelpunkt diese Funktion natürlicher als das formelhafte „und sagte“ oder „folgendermaßen“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova; der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen. „Jahwe“ bewahrt ihn als Eigennamen; die Fußnote nennt die Schreibform JHWH und die geläufige Alternative „Jehova“.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt bildet die hebräische Redeeinleitungsformel לֵאמֹר idiomatisch ab und verweist auf den Inhalt in den folgenden Versen.
