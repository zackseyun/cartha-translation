source:
  edition: WLC
  text: אִ֣ישׁ אִ֞ישׁ מִ/זֶּ֣רַע אַהֲרֹ֗ן וְ/ה֤וּא צָר֨וּעַ֙ א֣וֹ זָ֔ב בַּ/קֳּדָשִׁים֙ לֹ֣א יֹאכַ֔ל עַ֖ד אֲשֶׁ֣ר יִטְהָ֑ר וְ/הַ/נֹּגֵ֨עַ֙ בְּ/כָל טְמֵא נֶ֔פֶשׁ א֣וֹ אִ֔ישׁ אֲשֶׁר תֵּצֵ֥א מִמֶּ֖/נּוּ שִׁכְבַת זָֽרַע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/004.yaml
  text: Any man from the offspring of Aaron[a], if he is afflicted with a skin disease or has a discharge, shall not eat from the holy things until he becomes clean. And whoever touches anything unclean by a dead person, or a man from whom an emission of semen comes out[b],
translation:
  language: de
  text: Jeder Mann von den Nachkommen Aarons, der einen kultisch verunreinigenden Hautbefund[a] hat oder einen Ausfluss hat, darf von den heiligen Gaben nichts essen, bis er rein geworden ist. Das gilt auch für jeden von ihnen, der etwas berührt, das durch einen menschlichen Leichnam unrein geworden ist[b], oder einen Mann, dem Samenflüssigkeit abgeht,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionell wird das Wort mit »aussätzig« wiedergegeben. Der hebräische Ausdruck bezeichnet jedoch allgemein einen kultisch verunreinigenden Hautbefund und nicht unbedingt die heute als Lepra oder Hansen-Krankheit bezeichnete Erkrankung.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »einen Menschen, der durch einen Toten unrein geworden ist«. Die hebräische Wendung ist idiomatisch und bezeichnet Unreinheit, die mit einem menschlichen Leichnam zusammenhängt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: Jeder Mann
  rationale: Die Wiederholung ist distributiv und bedeutet »jeder Mann«; der männliche Bezug passt hier zu den männlichen Nachkommen Aarons im priesterlichen Kontext.
- source_word: מִזֶּרַע אַהֲרֹן
  choice: von den Nachkommen Aarons
  rationale: זֶרַע bezeichnet hier die genealogische Abstammung; »Nachkommen« gibt dies im Deutschen natürlich wieder.
- source_word: צָרוּעַ
  choice: an einer verunreinigenden Hautkrankheit leidet
  rationale: Der Ausdruck bezeichnet einen kultisch verunreinigenden Hautbefund, ohne eindeutig der modernen Hansen-Krankheit zu entsprechen.
- source_word: זָב
  choice: einen Ausfluss hat
  rationale: Die Form bezeichnet einen Menschen mit einem körperlichen, im Kontext kultisch verunreinigenden Ausfluss.
- source_word: בַּקֳּדָשִׁים
  choice: von den heiligen Gaben
  rationale: Gemeint sind geheiligte Speiseanteile, von denen Priester essen durften; »Gaben« macht den konkreten Bezug verständlich.
- source_word: לֹא יֹאכַל
  choice: darf ... nichts essen
  rationale: Die Wendung drückt im Gesetzeskontext ein Verbot aus und klingt im modernen Deutschen natürlicher als »soll nicht essen«.
- source_word: עַד אֲשֶׁר יִטְהָר
  choice: bis er rein geworden ist
  rationale: Das Verb bezeichnet den Übergang in den Zustand kultischer Reinheit, nicht notwendig medizinische Heilung.
- source_word: וְהַנֹּגֵעַ
  choice: Das gilt auch für jeden, der ... berührt
  rationale: Das substantivierte Partizip führt einen weiteren Fall kultischer Verunreinigung ein; die Formulierung stellt den syntaktischen Anschluss im Deutschen klar her.
- source_word: בְּכָל טְמֵא נֶפֶשׁ
  choice: etwas berührt, das durch einen Toten unrein geworden ist
  rationale: Die schwierige idiomatische Wendung verweist auf durch einen menschlichen Leichnam verursachte Unreinheit. Die Übersetzung bewahrt den Sachbezug, ohne die Mehrdeutigkeit unnötig auf eine Person zu verengen.
- source_word: שִׁכְבַת זָרַע
  choice: Samenflüssigkeit
  rationale: Die Wendung bezeichnet eine Absonderung von Samen; »Samenflüssigkeit« ist klar, sachlich und würdevoll.
- source_word: תֵּצֵא מִמֶּנּוּ
  choice: dem ... abgeht
  rationale: Das hebräische Bild des Herausgehens wird idiomatisch deutsch wiedergegeben und der noch nicht abgeschlossene Satzbau des Verses bleibt erhalten.
theological_decisions:
- issue: Kultische Unreinheit ohne moderne medizinische oder moralische Überdeutung
  choice: »verunreinigende Hautkrankheit« und »rein geworden«
  alternative: »aussätzig« beziehungsweise »geheilt«
  rationale: Der Text regelt die kultische Eignung zum Essen heiliger Gaben. Er stellt weder eine sichere moderne Diagnose noch ein moralisches Urteil über den Betroffenen auf.
- issue: Geschlecht des rechtlichen Subjekts
  choice: »Jeder Mann von den Nachkommen Aarons«
  alternative: »Jeder Mensch« oder »Wer von Aaron abstammt«
  rationale: Der hebräische Text ist ausdrücklich männlich formuliert und bezieht sich in diesem Zusammenhang auf männliche Aaroniden.
- issue: Deutung von טְמֵא נֶפֶשׁ
  choice: durch einen Toten verursachte Unreinheit, ohne das berührte Objekt als Person festzulegen
  alternative: »einen Menschen, der durch eine Leiche unrein geworden ist«
  rationale: Die hebräische Fügung ist knapp und idiomatisch. Die gewählte Form bewahrt den Bezug zur Totenunreinheit und lässt offen, ob primär eine verunreinigte Person oder allgemein etwas Verunreinigtes bezeichnet wird.
translation_notes:
  register: Moderner, würdevoller Gesetzesstil. »Darf ... nichts essen« formuliert das Verbot natürlich; »heilige Gaben« verdeutlicht den gemeinten priesterlichen Speiseanteil. Das abschließende Komma bleibt stehen, weil der Satz im folgenden Vers weitergeführt wird.
