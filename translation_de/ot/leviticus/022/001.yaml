  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: de
  text: 'Und Jahwe[a] sprach zu Mose:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „JHWH“. Traditionell mit „der HERR“ wiedergegeben; hier mit „Jahwe“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: sprach
  rationale: Das Verb דבר in der narrativen Fortsetzungsform eröffnet hier eine neue göttliche Rede. „Sprach“ gibt die feierliche Einleitungsformel natürlich und quellennah wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: אֶל־מֹשֶׁה
  choice: zu Mose
  rationale: Die Präposition אֶל bezeichnet den Adressaten der Rede; „zu Mose“ ist die idiomatische deutsche Fügung.
- source_word: לֵאמֹר
  choice: durch den Doppelpunkt ausgedrückt
  rationale: Der Infinitiv לֵאמֹר leitet den folgenden Redeinhalt ein. Im modernen Deutschen übernimmt der Doppelpunkt diese Funktion natürlicher als das formelhafte „und sagte“ oder „folgendermaßen“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ bewahrt diesen als Namen; die traditionelle Wiedergabe „der HERR“ wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt bildet die hebräische Redeeinleitung לֵאמֹר idiomatisch ab und weist zugleich auf den in Vers 2 folgenden Redeinhalt voraus.
