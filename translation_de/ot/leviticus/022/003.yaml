source:
  edition: WLC
  text: אֱמֹ֣ר אֲלֵ/הֶ֗ם לְ/דֹרֹ֨תֵי/כֶ֜ם כָּל אִ֣ישׁ אֲשֶׁר יִקְרַ֣ב מִ/כָּל זַרְעֲ/כֶ֗ם אֶל הַ/קֳּדָשִׁים֙ אֲשֶׁ֨ר יַקְדִּ֤ישׁוּ בְנֵֽי יִשְׂרָאֵל֙ לַֽ/יהוָ֔ה וְ/טֻמְאָת֖/וֹ עָלָ֑י/ו וְ/נִכְרְתָ֞ה הַ/נֶּ֧פֶשׁ הַ/הִ֛וא מִ/לְּ/פָנַ֖/י אֲנִ֥י יְהוָֽה־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/003.yaml
  text: 'Say to them[a], throughout your generations: Any man from any of your offspring who comes near the holy things that the sons of Israel consecrate to Yahweh while his uncleanness is on him—that person shall be cut off from before me[c][b]. I am Yahweh.'
translation:
  language: de
  text: 'Sag zu ihnen: Für alle eure Generationen gilt: Jeder Mann von euren Nachkommen, der sich den heiligen Gaben nähert, die die Israeliten Yahweh weihen, während seine Unreinheit auf ihm liegt – diese Person soll aus meiner Gegenwart[a] abgeschnitten werden[b]. Ich bin Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von vor mir“; auch: „vor mir“.'
    reason: lexical_alternative
  - marker: b
    text: „Abgeschnitten werden“ ist eine feste Strafandrohung in den Bundesbestimmungen; die genaue Art der Entfernung bzw. Bestrafung ist umstritten.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱמֹר אֲלֵהֶם
  choice: Sag zu ihnen
  rationale: Der singularische Imperativ richtet sich an Mose; die Wendung ist direkt und in modernem Deutsch natürlich.
- source_word: לְדֹרֹתֵיכֶם
  choice: Für alle eure Generationen gilt
  rationale: Gibt die rechtliche Dauerformel verständlich wieder und macht ihre fortdauernde Geltung deutlich.
- source_word: כָּל אִישׁ אֲשֶׁר ... מִכָּל זַרְעֲכֶם
  choice: Jeder Mann von euren Nachkommen, der ...
  rationale: Bewahrt die männliche Einzelfallformulierung und den genealogischen Bezug; im Kontext sind Aarons männliche Nachkommen gemeint.
- source_word: יִקְרַב
  choice: sich ... nähert
  rationale: Erhält den räumlich-kultischen Sinn von קרב, ohne den konkreten Vorgang enger festzulegen.
- source_word: הַקֳּדָשִׁים
  choice: die heiligen Gaben
  rationale: Im kultischen Kontext sind geheiligte Dinge beziehungsweise Opfergaben gemeint; „Gaben“ ist natürlich, ohne die Kategorie auf eine bestimmte Opferart zu verengen.
- source_word: יַקְדִּישׁוּ
  choice: heiligen
  rationale: Gibt den Hifil von קדשׁ knapp und kultisch angemessen als das Bestimmen für den heiligen Bereich wieder.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Ist die natürliche moderne deutsche Wiedergabe der ethnischen Bezeichnung „Söhne Israels“.
- source_word: לַיהוָה / יְהוָה
  choice: Yahweh
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen als Eigennamen wieder.
- source_word: וְטֻמְאָתוֹ עָלָיו
  choice: während seine Unreinheit auf ihm liegt
  rationale: Bewahrt das Bild des Hebräischen, wonach die rituelle Unreinheit auf der betreffenden Person liegt.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: soll ... ausgerottet werden
  rationale: Gibt die feststehende rechtlich-bundestheologische כרת-Formel wieder, ohne ihre konkrete Vollzugsweise festzulegen.
- source_word: מִלְּפָנַי
  choice: vor mir
  rationale: Entspricht der räumlich relationalen Grundbedeutung; „aus meiner Gegenwart“ bleibt als mögliche Nuance in der Fußnote erhalten.
theological_decisions:
- issue: Bedeutung der Strafandrohung וְנִכְרְתָה
  choice: „soll ... ausgerottet werden“, ohne die Vollzugsweise zu bestimmen
  alternative: „soll aus der Gemeinschaft ausgeschlossen / getötet werden“
  rationale: Die Formel kann unterschiedlich als göttliche oder menschliche Strafe und hinsichtlich ihrer konkreten Form verstanden werden. Der Ausgangstext legt dies hier nicht eindeutig fest.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR
  rationale: Der Eigenname wird als solcher erkennbar wiedergegeben und nicht durch einen Titel ersetzt.
- issue: Bezug von מִלְּפָנַי
  choice: „vor mir“
  alternative: „aus meiner Gegenwart“
  rationale: Die knappe wörtliche Wiedergabe erhält die mögliche räumliche und relationale Spannung; die idiomatischere Deutung wird in der Fußnote genannt.
translation_notes:
  register: Moderner, würdiger Rechtstext. Der Satzbau wurde gegenüber dem Hebräischen leicht gegliedert, während kultische Schlüsselbegriffe und die Unbestimmtheit der Strafandrohung erhalten bleiben.
