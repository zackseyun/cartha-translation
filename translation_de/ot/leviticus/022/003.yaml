  naturalness: Der Rechtstext ist klar und modern. „Die Israeliten Yahweh heiligen“ ist jedoch missverständlich, weil „heiligen“ im Deutschen leicht als Prädikat über Yahweh verstanden werden kann; „Yahweh weihen“ macht die syntaktische und kultische Beziehung deutlich. Die Umstellung bei der Strafandrohung verbessert zudem die Lesbarkeit.
  terminology: „Yahweh“, „Unreinheit“ und „heilige Gaben“ sind angemessen. „Abgeschnitten werden“ bewahrt als deutsche formelhafte Entsprechung zu כרת die Uneindeutigkeit besser als „ausgerottet werden“.
