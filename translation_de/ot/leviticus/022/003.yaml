revisions:
- from: 'Sag zu ihnen: Für alle eure Generationen gilt: Jeder Mann von euren Nachkommen, der sich den heiligen Gaben nähert, welche die Israeliten Yahweh heiligen, während seine Unreinheit auf ihm liegt, soll vor mir[a] ausgerottet werden[b]. Ich bin Yahweh.'
  to: 'Sag zu ihnen: Für alle eure Generationen gilt: Jeder Mann von euren Nachkommen, der sich den heiligen Gaben nähert, die die Israeliten Yahweh weihen, während seine Unreinheit auf ihm liegt – diese Person soll aus meiner Gegenwart[a] abgeschnitten werden[b]. Ich bin Yahweh.'
  rationale: Die Revision ersetzt die im Deutschen stärker festgelegte Formulierung „ausgerottet werden“ durch „abgeschnitten werden“, um die umstrittene Strafmodalität des Hebräischen nicht zu entscheiden. „Weihen“ verdeutlicht, dass die Israeliten die heiligen Gaben Yahweh darbringen bzw. für ihn weihen. Die präzisere Haupttextwiedergabe von מִלְּפָנַי wird mit einer wörtlichen Alternative in der Fußnote abgesichert.
