source:
  edition: WLC
  text: וּ/בַת כֹּהֵ֔ן כִּ֥י תִהְיֶ֖ה לְ/אִ֣ישׁ זָ֑ר הִ֕וא בִּ/תְרוּמַ֥ת הַ/קֳּדָשִׁ֖ים לֹ֥א תֹאכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/012.yaml
  text: But if a priest’s daughter becomes the wife of an outsider[b][a], she shall not eat from the contribution of the holy things.
translation:
  language: de
  text: Wenn aber eine Priestertochter einen Außenstehenden heiratet[a], darf sie von den heiligen Abgaben[b] nichts essen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: einen Mann außerhalb des priesterlichen Berechtigungskreises; wörtlich: »einen fremden/außenstehenden Mann heiratet«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »von der Abgabe der heiligen Dinge«; auch: »von den heiligen Opfergaben«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַת כֹּהֵן
  choice: Wenn aber die Tochter eines Priesters
  rationale: Das Waw wird wegen des Gegensatzes zur vorherigen Regelung adversativ mit „aber“ wiedergegeben. Die Konstruktverbindung bezeichnet die Tochter eines Priesters.
- source_word: כִּי תִהְיֶה לְאִישׁ זָר
  choice: einen Außenstehenden heiratet
  rationale: Die Wendung „einem Mann zugehören/werden“ bezeichnet hier idiomatisch die Eheschließung. זָר meint im Zusammenhang jemanden außerhalb des priesterlichen Kreises, nicht notwendig einen ethnischen Fremden.
- source_word: הִוא
  choice: sie
  rationale: Das selbstständige Pronomen nimmt die Tochter ausdrücklich wieder auf; im Deutschen genügt das klare Subjekt „sie“.
- source_word: בִּתְרוּמַת הַקֳּדָשִׁים
  choice: von der Abgabe der heiligen Gaben
  rationale: תְּרוּמָה bezeichnet eine ausgesonderte Abgabe bzw. Opfergabe; קֳדָשִׁים bleibt als breite kultische Kategorie im Plural erhalten.
- source_word: לֹא תֹאכֵל
  choice: darf sie nichts … essen
  rationale: Die negierte Verbform hat in diesem Rechtstext normativ-verbietende Kraft. „darf nicht/nichts essen“ klingt in modernem Deutsch natürlicher als „soll nicht essen“.
theological_decisions:
- issue: Bedeutung von זָר im priesterlichen Recht
  choice: Außenstehender, also jemand außerhalb des priesterlichen Berechtigungskreises
  alternative: Fremder; Nichtpriester; Laie
  rationale: Der Zusammenhang regelt den Zugang zu geheiligter Nahrung innerhalb des priesterlichen Haushalts. Eine ethnische Fremdheit ist nicht vorausgesetzt; „Außenstehender“ bewahrt zugleich die kontextuelle Abgrenzung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Außenstehender“ vermeidet die missverständliche ethnische Lesart von „Fremder“. Die Rechtsnorm wird mit „darf … nichts“ klar und natürlich formuliert; die kultische Terminologie bleibt in Haupttext und Fußnote erkennbar.
