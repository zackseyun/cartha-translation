  text: Or if the raw flesh turns back and becomes white[a], then he shall come to the priest.
translation:
  language: de
  text: Oder wenn sich das rohe Fleisch zurückbildet und weiß wird[a], soll er zum Priester kommen.
  philosophy: optimal-equivalence
  footnotes:
