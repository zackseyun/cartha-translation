lexical_decisions:
- source_word: א֣וֹ כִ֥י
  choice: Oder wenn
  rationale: אוֹ führt einen alternativen Fall ein, während כִּי die Bedingung ausdrückt; „Oder wenn“ bildet beides im Deutschen natürlich ab.
- source_word: יָשׁ֛וּב
  choice: sich zurückbildet
  rationale: שׁוב bezeichnet eine Rückkehr zum vorherigen Zustand. Bezogen auf eine körperliche Erscheinung gibt „sich zurückbildet“ die Umkehr des zuvor beschriebenen Befunds natürlich wieder.
- source_word: הַבָּשָׂר הַחַי
  choice: das rohe Fleisch
  rationale: Wörtlich steht „das lebende Fleisch“. Im diagnostischen Zusammenhang bezeichnet die Wendung sichtbar rohes, lebendes Gewebe; „rohes Fleisch“ ist verständlich und sachgerecht, die wörtliche Form bleibt in der Fußnote erhalten.
- source_word: וְנֶהְפַּךְ לְלָבָן
  choice: und weiß wird
  rationale: Der Niphal von הפך beschreibt hier einen Zustandswechsel; „weiß wird“ gibt das Ergebnis im Deutschen knapp und idiomatisch wieder.
- source_word: וּבָא אֶל הַכֹּהֵן
  choice: soll er zum Priester kommen
  rationale: Die Verbfolge setzt das vorgeschriebene Verfahren fort. „Soll … kommen“ wahrt den rechtlich-prozeduralen Charakter, ohne eine unnötig starke Modalität einzutragen.
