translation:
  language: de
  text: Wenn einem Mann die Haare auf dem Kopf ausfallen[a], ist er kahl; er ist rein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn ein Mann am Kopf kahl wird.“ Das hebräische Verb kann kahl werden oder den Verlust von Haaren bezeichnen; der Haupttext wahrt den sprachlichen Unterschied zum anschließenden „er ist kahl“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: einem Mann
  rationale: Das grammatisch maskuline Singularwort führt einen kasuistischen Einzelfall ein; „einem Mann“ gibt Form und wahrscheinlichen Bezug präzise wieder.
- source_word: כִּי
  choice: wenn
  rationale: In diesem rechtlich-diagnostischen Zusammenhang leitet כִּי den angenommenen Fall ein; im Deutschen ist „wenn“ dafür natürlich.
- source_word: יִמָּרֵט
  choice: die Haare ... ausfallen
  rationale: Das Niphal von מרט bezeichnet das Kahl- oder Haarloswerden. Die Formulierung benennt den Haarverlust, ohne dessen Ursache festzulegen, und wahrt den Unterschied zum folgenden Prädikat „kahl“.
- source_word: רֹאשׁוֹ
  choice: auf dem Kopf
  rationale: Die deutsche Wendung bezeichnet idiomatisch und eindeutig den Ort des Haarverlusts.
- source_word: קֵרֵחַ
  choice: kahl
  rationale: Das Adjektiv bezeichnet den festgestellten Zustand knapp und in natürlichem modernem Deutsch.
- source_word: טָהוֹר
  choice: rein
  rationale: „Rein“ ist der etablierte Ausdruck für den kultisch-diagnostischen Status in Levitikus 13 und vermeidet eine moralische Deutung.
- source_word: הוּא ... הוּא
  choice: ist er ... er ist
  rationale: 'Die beiden selbstständigen Aussagen bleiben erhalten: Der Mann ist kahl, und er gilt als rein.'
theological_decisions:
- issue: Reinheitsstatus im levitischen Untersuchungsrecht
  choice: rein
  alternative: sauber; unbedenklich
  rationale: Der Vers erklärt gewöhnliche Kahlheit nicht für krankheitsbedingte Unreinheit. „Rein“ bewahrt die kultisch-rechtliche Kategorie, ohne moralische Schuld oder medizinische Heilung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kasuistische Form und die knappen diagnostischen Aussagen des Hebräischen bleiben erhalten; das Semikolon bildet die enge Verbindung der beiden Feststellungen ab.
