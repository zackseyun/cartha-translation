  text: and the priest examines him[a], and behold, there is a white swelling in the skin, and it has turned the hair white, and there is raw flesh in the swelling[b],
translation:
  language: de
  text: Und der Priester untersucht ihn. Zeigt sich dabei eine weiße Erhebung[a] auf der Haut, die das Haar weiß werden ließ, und befindet sich in der Erhebung eine Stelle mit lebendem Fleisch[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine weiße Schwellung“. Das hebräische Wort bezeichnet in diesem Kapitel eine erhabene Hautveränderung.'
