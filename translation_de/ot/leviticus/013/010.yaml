  - marker: b
    text: 'Wörtlich: „lebendes Fleisch“. Gemeint ist sichtbares, unverheiltes Gewebe innerhalb der Hautveränderung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה הַכֹּהֵן
  choice: Und der Priester soll ihn untersuchen
  rationale: Im Zusammenhang der priesterlichen Diagnose bezeichnet ראה eine fachliche Untersuchung, nicht nur ein Sehen. Die Soll-Form gibt den verfahrensrechtlichen Sinn des hebräischen Perfekts mit waw natürlich wieder.
- source_word: וְהִנֵּה
  choice: Zeigt sich
  rationale: Die Formulierung lenkt wie הִנֵּה die Aufmerksamkeit auf den festgestellten Befund, ohne das im heutigen Deutsch ungewöhnlich feierliche „siehe“ zu erzwingen.
- source_word: שְׂאֵת לְבָנָה
  choice: eine weiße Erhebung
  rationale: שְׂאֵת ist hier ein technischer Ausdruck für eine erhabene Hautveränderung. „Erhebung“ wahrt diesen räumlichen Aspekt und bleibt gegenüber einer genaueren medizinischen Diagnose neutral.
- source_word: בָּעוֹר
  choice: auf der Haut
  rationale: Im Deutschen wird eine sichtbare Hautveränderung idiomatisch als „auf der Haut“ bezeichnet; עוֹר bedeutet Haut.
- source_word: וְהִיא הָפְכָה שֵׂעָר לָבָן
  choice: die das Haar weiß werden ließ
  rationale: Das feminine Pronomen bezieht sich grammatisch auf die Erhebung. Die Wiedergabe bewahrt diese Zuordnung und beschreibt ihre Wirkung auf das Haar.
- source_word: וּמִחְיַת בָּשָׂר חַי
  choice: und befindet sich rohes Fleisch
  rationale: Die Wendung bezeichnet sichtbares lebendes beziehungsweise unverheiltes Gewebe in der Hautveränderung. „Rohes Fleisch“ ist verständlich und wird durch eine Fußnote gegen ein Missverständnis erläutert.
- source_word: בַּשְׂאֵת
  choice: in der Erhebung
  rationale: Die Wiederholung von „Erhebung“ erhält die terminologische Einheit und gibt die Lage des Gewebes innerhalb der Hautveränderung wieder.
