base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/007.yaml
  text: But if the scaly eruption indeed spreads on the skin after he has shown himself to the priest for his cleansing[c][b][a], then he shall appear before the priest a second time.
translation:
  language: de
  text: Wenn sich aber der schuppige Hautausschlag[a] auf der Haut tatsächlich[b] ausbreitet, nachdem er sich dem Priester zur Feststellung seiner Reinheit[c] vorgestellt hat, soll er sich dem Priester ein zweites Mal vorstellen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „die Hautveränderung“, „der Ausschlag“; traditionell „der Schorf“. Das hebräische Wort bezeichnet eine oberflächliche Hauterscheinung, die untersucht wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Hebräische verstärkt das Verb: wörtlich etwa „wenn sich der Ausschlag gewiss ausbreitet“.'
    reason: lexical_alternative
  - marker: c
    text: „Zur Feststellung seiner Reinheit“ bezeichnet die Untersuchung mit dem Ziel, den Betroffenen als kultisch rein einzustufen. Auch die Wiedergabe „zu seiner Reinigung“ ist möglich.
    reason: cultural_note
lexical_decisions:
- source_word: פָּשֹׂה תִפְשֶׂה
  choice: sich … tatsächlich ausbreitet
  rationale: Die Verbindung aus Infinitivus absolutus und Imperfekt verstärkt das Verb. „Tatsächlich“ gibt diese Betonung in natürlichem Deutsch wieder.
- source_word: הַמִּסְפַּחַת
  choice: der schuppige Hautausschlag
  rationale: Das Wort bezeichnet hier eine oberflächliche Hautveränderung, die priesterlich untersucht wird. Diese Wiedergabe ist im modernen Deutsch verständlicher und medizinisch weniger irreführend als „Schorf“.
- source_word: בָּעוֹר
  choice: auf der Haut
  rationale: Die Präposition bezeichnet hier den Ort der Hautveränderung; der hebräische Text enthält kein ausdrückliches Possessivpronomen.
- source_word: אַחֲרֵי הֵרָאֹתוֹ
  choice: nachdem der Betroffene sich … vorgestellt hat
  rationale: Die Nifalform von ראה bezeichnet im Untersuchungskontext das Erscheinen beziehungsweise Sichvorstellen zur Begutachtung. „Der Betroffene“ macht den im Hebräischen pronominal bezeichneten Menschen ohne unnötige Wiederholung verständlich.
- source_word: לְטָהֳרָתוֹ
  choice: zu seiner Reinerklärung
  rationale: Im Zusammenhang geht es um die priesterliche Untersuchung mit dem Ziel, den Betroffenen als kultisch rein einzustufen. „Reinerklärung“ bildet diesen rechtlich-kultischen Vorgang genauer ab als eine körperlich verstandene „Reinigung“.
- source_word: וְנִרְאָה שֵׁנִית אֶל הַכֹּהֵן
  choice: soll er sich dem Priester ein zweites Mal vorstellen
  rationale: Im Gesetzestext drückt die Form die vorgeschriebene erneute Vorstellung zur Untersuchung aus. „Soll“ entspricht natürlichem modernem Deutsch für eine rechtliche Anweisung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Rechtssprache. Die Satzstruktur folgt dem hebräischen Bedingungssatz, vermeidet jedoch unnatürliche Passivkonstruktionen. Fachsprachliche Überpräzisierung und eine medizinische Gleichsetzung der Hauterscheinung mit einer modernen Diagnose werden vermieden.
