revisions:
- from: Wenn sich der schuppige Hautausschlag[a] aber tatsächlich[b] auf der Haut ausbreitet, nachdem der Betroffene sich dem Priester zu seiner Reinerklärung[c] vorgestellt hat, soll er sich dem Priester ein zweites Mal vorstellen.
  to: Wenn sich aber der schuppige Hautausschlag[a] auf der Haut tatsächlich[b] ausbreitet, nachdem er sich dem Priester zur Feststellung seiner Reinheit[c] vorgestellt hat, soll er sich dem Priester ein zweites Mal vorstellen.
  rationale: Die Revision ersetzt allein das unübliche und leicht zu stark festlegende „zu seiner Reinerklärung“ durch die idiomatische, verfahrensbezogene Formulierung „zur Feststellung seiner Reinheit“. Damit bleibt der kultische Sinn von לְטָהֳרָתוֹ gewahrt, ohne eine körperliche Reinigung oder einen bereits erfolgten Freispruch zu behaupten.
