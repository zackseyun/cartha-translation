source:
  edition: WLC
  text: וְ/אִם֮ רָאָ֣ה הַ/כֹּהֵן֒ וְ/הִנֵּה֙ כֵּהָ֣ה הַ/נֶּ֔גַע אַחֲרֵ֖י הֻכַּבֵּ֣ס אֹת֑/וֹ וְ/קָרַ֣ע אֹת֗/וֹ מִן הַ/בֶּ֨גֶד֙ א֣וֹ מִן הָ/ע֔וֹר א֥וֹ מִן הַ/שְּׁתִ֖י א֥וֹ מִן הָ/עֵֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/056.yaml
  text: But if the priest examines it[a], and behold, the spot has faded after it was washed, then he shall tear it out of the garment, or out of the leather, or out of the warp, or out of the woof.
translation:
  language: de
  text: Wenn aber der Priester die Stelle untersucht und feststellt, dass sie nach dem Waschen verblasst ist, soll er sie aus dem Kleidungsstück, dem Leder, den Kettfäden oder den Schussfäden heraustrennen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: Wenn aber
  rationale: Gibt sowohl die konditionale Fortsetzung als auch den leichten Gegensatz zum vorherigen Verfahren natürlich wieder.
- source_word: רָאָה הַכֹּהֵן וְהִנֵּה
  choice: der Priester die Stelle untersucht und feststellt
  rationale: Im rechtlichen Prüfverfahren bezeichnet ראה eine Begutachtung; וְהִנֵּה lenkt auf das dabei festgestellte Ergebnis. Die deutsche Formulierung wahrt die Funktion idiomatisch, ohne ein altertümliches »siehe«.
- source_word: כֵּהָה הַנֶּגַע
  choice: dass sie … verblasst ist
  rationale: כֵּהָה beschreibt hier eine abgeschwächte sichtbare Veränderung. Das Pronomen bezieht sich auf die zuvor genannte Stelle.
- source_word: אַחֲרֵי הֻכַּבֵּס אֹתוֹ
  choice: nach dem Waschen
  rationale: Gibt den vorausgegangenen Waschvorgang knapp und natürlich wieder; das Objekt ergibt sich eindeutig aus dem Zusammenhang.
- source_word: וְקָרַע אֹתוֹ
  choice: soll er sie … heraustrennen
  rationale: Gemeint ist die Entfernung des betroffenen Bereichs aus dem Material. »Heraustrennen« ist im Deutschen bei Stoff und Leder klarer als das wörtlichere »herausreißen«.
- source_word: מִן הַבֶּגֶד
  choice: aus dem Kleidungsstück
  rationale: בגד bezeichnet hier ein aus textilem Material gefertigtes Kleidungsstück.
- source_word: מִן הָעוֹר
  choice: dem Leder
  rationale: עוֹר meint in diesem Sachzusammenhang bearbeitete Tierhaut beziehungsweise Leder, nicht menschliche Haut.
- source_word: מִן הַשְּׁתִי
  choice: den Kettfäden
  rationale: Technischer Ausdruck für die längs verlaufenden Fäden eines Gewebes; der Plural macht die Bedeutung für heutige Leser klar.
- source_word: מִן הָעֵרֶב
  choice: den Schussfäden
  rationale: Technischer Ausdruck für die quer zu den Kettfäden verlaufenden Fäden; entspricht der textilen Präzision des Hebräischen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit sachlich-rechtlichem Ton. Die textiltechnischen Begriffe »Kettfäden« und »Schussfäden« sind präzise und im Zusammenhang verständlich; eine Fußnote ist nicht erforderlich.
