  text: And the priest shall examine it[a], and behold, the diseased spot has turned white; then the priest shall pronounce the spot clean[c][b]; it is clean.
translation:
  language: de
  text: Und der Priester soll ihn untersuchen; und siehe, die betroffene Stelle hat sich weiß verfärbt. Dann soll der Priester die betroffene Stelle für rein erklären; er[a] ist rein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „rein ist er“. Das maskuline Pronomen bezieht sich im Zusammenhang auf den untersuchten Menschen; die zuvor genannte „betroffene Stelle“ ist im Deutschen feminin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָהוּ
  choice: Und der Priester soll ihn untersuchen
  rationale: ראה bedeutet wörtlich „sehen“, bezeichnet hier im Zusammenhang der priesterlichen Begutachtung aber eine Untersuchung. Das maskuline Pronomen wird mit „ihn“ wiedergegeben und lässt seinen Bezug wie im Hebräischen vom Kontext bestimmen.
- source_word: וְהִנֵּה
  choice: Wenn
  rationale: הנה lenkt die Aufmerksamkeit auf den festgestellten Befund. Im natürlichen deutschen Bedingungsgefüge wird diese Funktion durch „wenn“ ausgedrückt, ohne ein altertümliches „siehe“ einzuführen.
- source_word: נֶהְפַּךְ הַנֶּגַע לְלָבָן
  choice: sich die betroffene Stelle weiß verfärbt hat
  rationale: Der Nifal bezeichnet eine eingetretene Zustands- beziehungsweise Farbveränderung. „Sich weiß verfärben“ ist im Deutschen natürlich und gibt den sichtbaren Befund wieder.
- source_word: הַנֶּגַע
  choice: die betroffene Stelle
  rationale: נגע bezeichnet hier den sichtbar betroffenen Bereich, ohne eine moderne medizinische Diagnose festzulegen. „Betroffene Stelle“ ist sachlich, verständlich und diagnostisch zurückhaltend.
- source_word: וְטִהַר הַכֹּהֵן
  choice: soll der Priester ... für rein erklären
  rationale: Im Untersuchungskontext von Levitikus 13 fällt der Priester ein Reinheitsurteil; er bewirkt nicht die Heilung. „Für rein erklären“ gibt diese deklarative Funktion wieder.
- source_word: טָהוֹר הוּא
  choice: sie ist rein
  rationale: Das selbstständige Schlussurteil wird erhalten. Das deutsche feminine Pronomen bezieht sich grammatisch auf „die betroffene Stelle“; das hebräische Pronomen ist entsprechend dem maskulinen נגע maskulin.
theological_decisions:
- issue: Art der priesterlichen Handlung im Reinheitsrecht
  choice: Der Priester erklärt die betroffene Stelle für rein.
  alternative: Der Priester reinigt die betroffene Stelle.
  rationale: טהר kann je nach Konstruktion „reinigen“ oder „für rein erklären“ bedeuten. Hier untersucht der Priester einen bereits eingetretenen Befund und spricht anschließend das kultische Reinheitsurteil aus; eine heilende Handlung wird nicht beschrieben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers folgt dem hebräischen Ablauf von Untersuchung, Befund und Reinheitsurteil. „Betroffene Stelle“ vermeidet eine anachronistische medizinische Festlegung; die Wiederholung „rein ... rein“ bewahrt den Nachdruck des hebräischen Schlussurteils.
