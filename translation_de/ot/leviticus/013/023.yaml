id: LEV.13.23
reference: Leviticus 13:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אִם תַּחְתֶּ֜י/הָ תַּעֲמֹ֤ד הַ/בַּהֶ֨רֶת֙ לֹ֣א פָשָׂ֔תָה צָרֶ֥בֶת הַ/שְּׁחִ֖ין הִ֑וא וְ/טִהֲר֖/וֹ הַ/כֹּהֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/023.yaml
  text: But if the bright spot remains in its place and has not spread[a], it is the scar of the boil, and the priest shall pronounce him clean.
translation:
  language: de
  text: Wenn aber der helle Fleck an seiner Stelle bleibt[a] und sich nicht ausbreitet, ist er die Narbe des Geschwürs; der Priester soll ihn für rein erklären.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »unter ihr«; die hebräische Wendung bedeutet hier, dass der helle Fleck an derselben Stelle bleibt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Wenn aber
  rationale: Die Wendung leitet den kontrastierenden Bedingungsfall ein und gibt den Zusammenhang natürlich wieder.
- source_word: תַּחְתֶּיהָ תַּעֲמֹד
  choice: an seiner Stelle bleibt
  rationale: Wörtlich etwa »unter ihr stehen/bleiben«; im diagnostischen Zusammenhang bezeichnet die Wendung, dass der Fleck örtlich begrenzt bleibt.
- source_word: הַבַּהֶרֶת
  choice: der helle Fleck
  rationale: Bezeichnet einen sichtbar hellen Hautfleck, ohne eine moderne medizinische Diagnose vorauszusetzen.
- source_word: לֹא פָשָׂתָה
  choice: sich nicht ausbreitet
  rationale: Das Verb bezeichnet in diesem Kapitel wiederholt die räumliche Ausbreitung einer Hauterscheinung.
- source_word: צָרֶבֶת הַשְּׁחִין
  choice: die Narbe des Geschwürs
  rationale: צרבת bezeichnet hier das zurückbleibende Entzündungs- oder Narbenmal; שחין ist eine entzündete Hauterhebung beziehungsweise ein Geschwür.
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: der Priester soll ihn für rein erklären
  rationale: Im priesterlichen Reinheitsverfahren geht es um die Feststellung des Reinheitsstatus, nicht um eine vom Priester bewirkte Heilung oder Reinigung.
theological_decisions:
- issue: Rituelle Reinheit gegenüber medizinischer Heilung
  choice: für rein erklären
  alternative: reinigen
  rationale: Die Hifil-Form von טהר bezeichnet hier die priesterliche Feststellung des rituellen Status. Die Übersetzung vermeidet den Eindruck, der Priester heile oder reinige die Person körperlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die medizinisch beobachtbare Erscheinung wird verständlich beschrieben, ohne eine heutige Diagnose einzutragen; der kultisch-rechtliche Charakter der priesterlichen Feststellung bleibt gewahrt.
