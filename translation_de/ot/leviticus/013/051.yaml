  - severity: medium
    issue: Unstimmige Verbindung von „Schadstelle“ und „Ṣaraʿat-Befall“
    rationale: Die Aussage „die Schadstelle ist ein ... Befall“ ist im Deutschen semantisch uneinheitlich. Die durchgehende Bezeichnung „Befall“ bildet נֶגַע im Kontext einer sich ausbreitenden Erscheinung natürlich ab und ermöglicht einen klaren Pronomenbezug.
  - severity: low
    issue: „zerstörerisch“ ist für מַמְאֶרֶת weniger präzise
    rationale: Die Bezeichnung meint eine schädliche beziehungsweise bösartige Form des Befalls. „Bösartig“ ist die knappere und näherliegende Wiedergabe, ohne den Begriff als moderne klinische Diagnose zu verstehen.
