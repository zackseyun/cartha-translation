  source_fidelity: 'Die Untersuchung am siebten Tag, die Ausbreitung des Befalls und die Aufzählung von Kleidungsstück, Kette, Schuss, Leder und Ledergegenständen sind zutreffend erfasst. Die Wendung „an allem, wozu Leder verarbeitet wird“ gibt jedoch die hebräische Konstruktion ungenau wieder: Gemeint sind Gegenstände, zu denen Leder verarbeitet wird, nicht Dinge, für die Leder verarbeitet wird.'
  naturalness: Der Entwurf ist insgesamt verständlich und angemessen sachlich. „Die Schadstelle ist ein zerstörerischer Ṣaraʿat-Befall“ ist jedoch begrifflich und stilistisch holprig, weil eine „Schadstelle“ nicht natürlich als „Befall“ klassifiziert wird. Eine einheitliche Wiedergabe mit „Befall“ vermeidet diesen Bruch.
  terminology: „Kett- oder Schussfäden“ und „Leder“ sind treffend. Die Umschrift „Ṣaraʿat“ mit erläuternder Fußnote wahrt den technischen, nicht auf eine moderne Krankheit festlegbaren Charakter des Begriffs. Für מַמְאֶרֶת ist „bösartig“ näher als „zerstörerisch“, ohne eine bestimmte medizinische Diagnose zu behaupten.
