revisions:
- from: Am siebten Tag soll er die Schadstelle untersuchen. Hat sich die Schadstelle auf dem Kleidungsstück, an den Kett- oder Schussfäden oder am Leder ausgebreitet – an allem, wozu Leder verarbeitet wird –, dann ist die Schadstelle ein zerstörerischer Ṣaraʿat-Befall[a]; sie ist unrein.
  to: Am siebten Tag soll er den Befall untersuchen. Hat sich der Befall auf dem Kleidungsstück, an den Kett- oder Schussfäden, am Leder oder an irgendeinem Gegenstand aus Leder ausgebreitet, dann ist es ein bösartiger Ṣaraʿat-Befall[a]; er ist unrein.
  rationale: Die Revision stellt die Reichweite der hebräischen Lederformel mit „an irgendeinem Gegenstand aus Leder“ klar. Sie vereinheitlicht zudem נֶגַע als „Befall“, sodass die Schlussaussage idiomatisch und inhaltlich kohärent bleibt. Die Fußnote bewahrt die notwendige Zurückhaltung bei der Deutung von ṣaraʿat.
