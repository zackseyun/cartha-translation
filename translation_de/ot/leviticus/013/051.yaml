source:
  edition: WLC
  text: וְ/רָאָ֨ה אֶת הַ/נֶּ֜גַע בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֗י כִּֽי פָשָׂ֤ה הַ/נֶּ֨גַע֙ בַּ֠/בֶּגֶד אֽוֹ בַ/שְּׁתִ֤י אֽוֹ בָ/עֵ֨רֶב֙ א֣וֹ בָ/ע֔וֹר לְ/כֹ֛ל אֲשֶׁר יֵעָשֶׂ֥ה הָ/ע֖וֹר לִ/מְלָאכָ֑ה צָרַ֧עַת מַמְאֶ֛רֶת הַ/נֶּ֖גַע טָמֵ֥א הֽוּא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/051.yaml
  text: On the seventh day he shall examine the infection[a], and if the infection has spread in the garment, or in the warp, or in the woof, or in the leather, in anything for which leather is made for work, the infection is a destructive skin disease[c][b]; it is unclean.
translation:
  language: de
  text: Am siebten Tag soll er den Befall untersuchen. Hat sich der Befall auf dem Kleidungsstück, an den Kett- oder Schussfäden, am Leder oder an irgendeinem Gegenstand aus Leder ausgebreitet, dann ist es ein bösartiger Ṣaraʿat-Befall[a]; er ist unrein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch ṣaraʿat, traditionell oft mit „Aussatz“ wiedergegeben. In 3. Mose bezeichnet der Begriff verschiedene Unreinheitsbefunde und wird auch auf Kleidungsstücke und Leder angewandt; er ist daher nicht mit einer bestimmten modernen Krankheit gleichzusetzen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: soll er … untersuchen
  rationale: ראה bezeichnet hier im Zusammenhang der priesterlichen Begutachtung nicht bloßes Sehen, sondern eine vorgeschriebene Untersuchung.
- source_word: הַנֶּגַע
  choice: die Schadstelle
  rationale: נגע meint hier die auffällige, sich möglicherweise ausbreitende Stelle am Material. „Schadstelle“ ist sachgerecht, verständlich und vermeidet die medizinische Verengung von „Infektion“.
- source_word: פָשָׂה
  choice: hat sich … ausgebreitet
  rationale: Das Verb bezeichnet die räumliche Ausbreitung des Befalls und wird im Deutschen natürlich mit „sich ausbreiten“ wiedergegeben.
- source_word: בֶּגֶד
  choice: Kleidungsstück
  rationale: בגד bezeichnet gewöhnlich ein Kleidungsstück; die Wiedergabe bleibt konkret und entspricht dem rechtlichen Zusammenhang.
- source_word: שְׁתִי … עֵרֶב
  choice: Kett- oder Schussfäden
  rationale: Dies sind die üblichen deutschen Fachbegriffe für die Längs- und Querfäden eines Gewebes. „Fäden“ macht die Bedeutung auch für nicht fachkundige Leser deutlich.
- source_word: עוֹר
  choice: Leder
  rationale: Da das Material zu Gebrauchsgegenständen verarbeitet wird, ist „Leder“ treffender als „Haut“ oder „Fell“.
- source_word: לְכֹל אֲשֶׁר יֵעָשֶׂה הָעוֹר לִמְלָאכָה
  choice: an allem, wozu Leder verarbeitet wird
  rationale: Die Formulierung erfasst umfassend jeden Gebrauchszweck beziehungsweise Gegenstand aus verarbeitetem Leder und gibt die hebräische Konstruktion in natürlichem Deutsch wieder.
- source_word: צָרַעַת מַמְאֶרֶת
  choice: ein zerstörerischer Ṣaraʿat-Befall
  rationale: ממארת beschreibt den Befall als schädigend oder zerstörerisch. Die Umschrift von צרעת wahrt den technischen Charakter des kultischen Begriffs, der hier auch unbelebte Materialien betrifft und daher nicht sachgerecht als moderne Hautkrankheit bezeichnet werden kann.
- source_word: טָמֵא הוּא
  choice: sie ist unrein
  rationale: Das feminine Pronomen bezieht sich in der deutschen Formulierung auf „Schadstelle“. „Unrein“ bewahrt die knappe kultrechtliche Statusaussage des Hebräischen.
theological_decisions:
- issue: Wiedergabe von צָרַעַת im Reinheitsgesetz
  choice: Ṣaraʿat-Befall
  alternative: Aussatz; Hautkrankheit; verunreinigender Befall
  rationale: Der hebräische Begriff bezeichnet nicht eindeutig die moderne Hansen-Krankheit und wird in diesem Kapitel auch auf Textilien und Leder angewandt. Die transliterierte Fachbezeichnung mit dem erklärenden Wort „Befall“ wahrt den Zusammenhang und vermeidet eine medizinisch oder konfessionell geprägte Festlegung.
- issue: Bezugswort der abschließenden Unreinheitsaussage
  choice: Bezug auf die Schadstelle, entsprechend dem grammatischen Bezug von הוּא auf נגע
  alternative: Bezug auf den betroffenen Gegenstand
  rationale: Im Hebräischen stimmt das Pronomen grammatisch mit נגע („Schadstelle/Befall“) überein. Die Übersetzung bildet diesen unmittelbaren Bezug ab, ohne die praktische Folge für den betroffenen Gegenstand zu bestreiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer rechtlich-prozeduraler Satzführung. Technische Webbegriffe werden durch „Fäden“ verständlich gemacht. Die Umschrift „Ṣaraʿat“ bleibt als notwendiger Fachbegriff erhalten und wird in der Fußnote erklärt.
