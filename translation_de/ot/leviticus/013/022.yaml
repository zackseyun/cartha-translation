  text: But if it does spread in the skin[a], the priest shall pronounce him unclean[b]; it is an infection.
translation:
  language: de
  text: Wenn sich die Stelle auf der Haut aber weiter ausbreitet, soll der Priester den Betroffenen für unrein erklären; es ist ein Leiden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „eine Schädigung“, „ein Krankheitszeichen“ oder „eine Plage“. Das hebräische Wort ist weit gefasst und entspricht keiner eindeutigen modernen medizinischen Kategorie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Wenn … aber
  rationale: Die Verbindung leitet einen bedingten Gegensatz zum zuvor beschriebenen Fall ein; die Nachstellung von „aber“ klingt im Deutschen natürlich.
- source_word: פָּשֹׂה תִפְשֶׂה
  choice: sich … weiter ausbreitet
  rationale: Infinitivus absolutus und Imperfekt desselben Verbs verstärken den Vorgang. „weiter ausbreitet“ gibt diese Nachdrücklichkeit idiomatisch wieder, ohne ein bestimmtes Ausmaß hinzuzufügen.
- source_word: בָּעוֹר
  choice: auf der Haut
  rationale: עוֹר bezeichnet hier die Haut. Im Deutschen ist bei einem sich ausbreitenden Hautbefund „auf der Haut“ die natürliche Ausdrucksweise.
- source_word: וְטִמֵּא
  choice: soll … für unrein erklären
  rationale: Im priesterlichen Rechts- und Diagnosekontext bezeichnet das Piel eine verbindliche Feststellung des kultischen Status, nicht dessen Verursachung.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Dies ist die übliche und kontextgerechte Wiedergabe von כֹּהֵן.
- source_word: אֹתוֹ
  choice: den Betroffenen
  rationale: Das männliche Singularobjekt verweist auf die untersuchte Person. „Den Betroffenen“ vermeidet im Deutschen einen unklaren Pronomenbezug.
- source_word: נֶגַע
  choice: Befall
  rationale: Der Ausdruck bezeichnet in Levitikus 13 breit einen auffälligen, als schädlich geltenden Hautbefund und lässt sich keiner modernen medizinischen Diagnose eindeutig zuordnen.
- source_word: הִוא
  choice: es ist
  rationale: Die pronominale Kopula identifiziert den beschriebenen Befund; „es ist“ bewahrt die knappe Feststellung des Hebräischen.
theological_decisions:
- issue: Wirkung des priesterlichen Urteils
  choice: Der Priester erklärt die betroffene Person für unrein.
  alternative: Der Priester macht die Person unrein.
  rationale: Der rechtlich-priesterliche Zusammenhang spricht für eine autoritative Feststellung des kultischen Status. Die Übersetzung vermeidet die Aussage, der Ausspruch selbst verursache die Unreinheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der juristisch-priesterliche Charakter bleibt in „für unrein erklären“ erhalten; „Befall“ vermeidet eine anachronistisch präzise medizinische Diagnose.
