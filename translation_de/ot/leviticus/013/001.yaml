  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/001.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: de
  text: 'Und Jahwe[a] sprach zu Mose und Aaron:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell meist mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: sprach
  rationale: Das Verb דבר bezeichnet hier in der fortlaufenden Erzählung einen neuen Sprechakt; „sprach“ entspricht der wiederkehrenden feierlichen Redeeinleitung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: zu Mose und Aaron
  rationale: Die beiden durch אֶל beziehungsweise וְאֶל bezeichneten Adressaten werden im natürlichen Deutschen gemeinsam mit „zu“ angeschlossen.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv leitet den folgenden Wortlaut ein. Ein Doppelpunkt erfüllt diese Funktion im heutigen Deutschen natürlicher als das formelhafte „und sagte“ oder „folgendermaßen“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen JHWH. „Jahwe“ bewahrt diesen Namen, während „der HERR“ die traditionelle Ersatzlesung wiedergibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Redeeinleitungsformel wird knapp und idiomatisch wiedergegeben; der Doppelpunkt verweist auf die in Vers 2 folgende Rede.
