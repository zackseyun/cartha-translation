  text: then he shall shave himself[a], but he shall not shave the scaly spot[b]; and the priest shall isolate the scaly spot for seven days a second time.
translation:
  language: de
  text: Dann soll er sich rasieren, doch die betroffene Stelle[a] soll er nicht rasieren. Der Priester soll die betroffene Stelle[b] erneut sieben Tage lang absondern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet eine besondere Erkrankung an Kopf oder Bart, die mit Haarverlust einhergeht. Traditionell wird es unter anderem mit „Grind“ wiedergegeben.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht hier erneut „den נתק“, also die so bezeichnete Erkrankung beziehungsweise die betroffene Stelle. Die Formulierung beschreibt die weitere Beobachtungsfrist, ohne ausdrücklich die Person als Objekt zu nennen.
    reason: textual_clarity
lexical_decisions:
- source_word: וְהִתְגַּלָּח
  choice: Dann soll er sich rasieren
  rationale: Das Hitpael von גלח ist reflexiv. Die Formulierung gibt die Handlung am eigenen Körper wieder; „Dann“ bildet die Abfolge der Verfahrensanweisungen ab.
- source_word: הַנֶּתֶק
  choice: die vom Haarausfall betroffene Stelle
  rationale: נֶתֶק bezeichnet hier eine besondere Erkrankung an Kopf oder Bart, die mit Haarverlust einhergeht. Die Umschreibung ist im heutigen Deutsch verständlicher und genauer als das missverständliche „Jucken“; ob zusätzlich Schuppenbildung vorliegt, wird nicht vorschnell festgelegt.
- source_word: וְאֶת הַנֶּתֶק לֹא יְגַלֵּחַ
  choice: doch die vom Haarausfall betroffene Stelle soll er nicht rasieren
  rationale: Der hebräische Text nennt die betroffene Stelle ausdrücklich als direktes Objekt. Daher wird nicht verdeutlichend „um die Stelle herum“ übersetzt, obwohl praktisch wohl das umliegende Haar rasiert und die Stelle selbst ausgespart wurde.
- source_word: וְהִסְגִּיר
  choice: soll ... absondern
  rationale: סגר bezeichnet in diesem Abschnitt eine zeitweilige Absonderung zur Beobachtung. „Absondern“ bewahrt den kultisch-rechtlichen Charakter und vermeidet die moderne medizinische Engführung von „unter Quarantäne stellen“.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Die übliche und sachlich passende Wiedergabe von כֹּהֵן im levitischen Kontext.
- source_word: שִׁבְעַת יָמִים שֵׁנִית
  choice: zum zweiten Mal sieben Tage lang
  rationale: Die Formulierung macht deutlich, dass eine zweite siebentägige Beobachtungsfrist angeordnet wird.
