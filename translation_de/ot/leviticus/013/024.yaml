  - severity: low
    issue: Farbadjektiv und Adjektivfolge sind nicht idiomatisch gesetzt.
    rationale: „rötlich weißer oder weißer heller Fleck“ sollte im modernen Standarddeutsch „rötlich-weißer oder weißer heller Fleck“ lauten.
