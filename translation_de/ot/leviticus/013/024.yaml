  text: א֣וֹ בָשָׂ֔ר כִּֽי יִהְיֶ֥ה בְ/עֹר֖/וֹ מִכְוַת אֵ֑שׁ וְֽ/הָיְתָ֞ה מִֽחְיַ֣ת הַ/מִּכְוָ֗ה בַּהֶ֛רֶת לְבָנָ֥ה אֲדַמְדֶּ֖מֶת א֥וֹ לְבָנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/024.yaml
  text: Or if the body has on its skin a burn from fire[a], and the raw flesh of the burn becomes a bright spot, reddish-white or white[b],
translation:
  language: de
  text: Oder wenn jemand[a] auf der Haut eine Brandwunde durch Feuer hat und das lebende Gewebe der Brandwunde zu einem rötlich-weißen oder weißen hellen Fleck wird,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Fleisch“. Gemeint ist hier der Körper beziehungsweise der betroffene Mensch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ
  choice: Oder wenn
  rationale: Leitet einen alternativen Fall innerhalb der kasuistischen Rechtsanweisung ein; „wenn“ gibt den bedingenden Sinn im Deutschen natürlich wieder.
- source_word: בָשָׂר
  choice: jemand
  rationale: Das hebräische Wort bedeutet gewöhnlich „Fleisch“, bezeichnet hier aber den betroffenen Menschen beziehungsweise dessen Körper. „Jemand“ ergibt zusammen mit „auf der Haut“ eine natürliche deutsche Fallbeschreibung; die wörtliche Bedeutung wird in einer Fußnote bewahrt.
- source_word: בְעֹרוֹ
  choice: auf der Haut
  rationale: Die Präposition bezeichnet hier die Stelle an der Körperoberfläche. Das Possessivsuffix wird durch die unpersönliche deutsche Formulierung bereits sinngemäß erfasst.
- source_word: מִכְוַת אֵשׁ
  choice: eine Brandwunde durch Feuer
  rationale: Die Konstruktverbindung bezeichnet eine durch Feuer verursachte Verbrennung beziehungsweise Brandwunde.
- source_word: וְהָיְתָה
  choice: bildet sich
  rationale: Im diagnostischen Zusammenhang beschreibt die Verbform das Auftreten beziehungsweise Entstehen des hellen Flecks.
- source_word: מִחְיַת הַמִּכְוָה
  choice: im Wundgewebe der Brandstelle
  rationale: מִחְיָה bezeichnet hier lebendes beziehungsweise rohes, wundes Gewebe im Bereich der Verbrennung. „Wundgewebe“ ist verständlich, ohne die Stelle fälschlich als verheilt festzulegen.
- source_word: בַּהֶרֶת
  choice: heller Fleck
  rationale: Der Ausdruck bezeichnet in Levitikus 13 eine auffällig helle Hautveränderung oder Stelle.
- source_word: לְבָנָה אֲדַמְדֶּמֶת
  choice: rötlich weißer
  rationale: Die beiden Farbadjektive beschreiben zusammen eine weißliche Stelle mit rötlicher Tönung.
- source_word: אוֹ לְבָנָה
  choice: oder weißer
  rationale: Bewahrt die ausdrücklich genannte alternative Färbung.
theological_decisions: []
