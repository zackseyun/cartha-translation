  source_fidelity: Die Wiedergabe trifft den alternativen Rechtsfall, die Brandwunde durch Feuer sowie die beiden Farbalternativen. Jedoch macht „im Wundgewebe ... bildet“ das Wundgewebe zum Ort der Fleckbildung, während מִחְיַת הַמִּכְוָה im Hebräischen dasjenige bezeichnet, das zu einem hellen Fleck wird. Zudem ist „Wundgewebe“ für מִחְיָה weniger präzise, da der Ausdruck lebendes/rohes Gewebe bezeichnet.
  naturalness: Die Formulierung ist grundsätzlich modern und sachlich. „ein rötlich weißer oder weißer heller Fleck“ wirkt jedoch wegen der Adjektivstellung und der fehlenden Bindestrichschreibung holprig. „rötlich-weißer oder weißer heller Fleck“ ist klarer.
  terminology: „Brandwunde“ und „heller Fleck“ sind passende, verständliche diagnostische Begriffe. Für מִחְיָה ist „lebendes Gewebe“ vorzuziehen; die Fußnote sollte die Bedeutung erklären, ohne die nicht gleichwertige Paraphrase „Wundmal“ als mögliche Wiedergabe auszugeben.
  issues:
