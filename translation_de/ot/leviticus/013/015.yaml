id: LEV.13.15
reference: Leviticus 13:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/רָאָ֧ה הַ/כֹּהֵ֛ן אֶת הַ/בָּשָׂ֥ר הַ/חַ֖י וְ/טִמְּא֑/וֹ הַ/בָּשָׂ֥ר הַ/חַ֛י טָמֵ֥א ה֖וּא צָרַ֥עַת הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/015.yaml
  text: When the priest sees the raw flesh[a], he shall pronounce him unclean. The raw flesh is unclean[c][b]; it is a skin disease.
translation:
  language: de
  text: Wenn der Priester das offene Fleisch[a] sieht, soll er ihn für unrein erklären[b]. Das offene Fleisch ist unrein; es ist eine Hautkrankheit[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »das lebende Fleisch«; gemeint ist sichtbar offenes, freiliegendes Gewebe.'
    reason: lexical_alternative
  - marker: b
    text: Der Priester stellt damit amtlich den kultischen Reinheitsstatus fest.
    reason: lexical_alternative
  - marker: c
    text: Traditionell »Aussatz«. Der hebräische Begriff bezeichnet verschiedene Hautveränderungen und nicht speziell die moderne Hansen-Krankheit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: Wenn ... sieht
  rationale: Das Waw mit Qatal führt im gesetzlichen Verfahrensablauf den nächsten Fall beziehungsweise Schritt ein; ein temporaler Konditionalsatz ist im Deutschen natürlich und sachgerecht.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Standardwiedergabe von כֹּהֵן; der Priester nimmt hier die vorgeschriebene Untersuchung und Reinheitserklärung vor.
- source_word: הַבָּשָׂר הַחַי
  choice: das offene Fleisch
  rationale: Wörtlich »das lebende Fleisch«. Im Zusammenhang bezeichnet die Wendung sichtbar freiliegendes Gewebe; »offenes Fleisch« ist im heutigen Deutsch verständlicher als »lebendes Fleisch«, ohne es als gesundes Gewebe umzudeuten.
- source_word: וְטִמְּאוֹ
  choice: soll er ihn für unrein erklären
  rationale: Das Piel von טמא mit Personenobjekt bezeichnet hier die amtliche priesterliche Feststellung des Reinheitsstatus, nicht notwendig dessen Verursachung.
- source_word: טָמֵא הוּא
  choice: ist unrein
  rationale: »Unrein« bewahrt die kultisch-rechtliche Kategorie des Levitikus.
- source_word: צָרַעַת
  choice: eine Hautkrankheit
  rationale: Der hebräische Begriff ist nicht präzise mit modernem Aussatz beziehungsweise der Hansen-Krankheit gleichzusetzen und bezeichnet im Kontext eine breitere Hauterkrankung.
theological_decisions:
- issue: Wiedergabe von צָרַעַת im levitischen Reinheitsrecht
  choice: Hautkrankheit
  alternative: Aussatz; aussatzartige Erkrankung
  rationale: »Hautkrankheit« vermeidet eine sachlich ungesicherte Gleichsetzung mit der modernen Hansen-Krankheit und lässt die kultisch-rechtliche Einordnung des Textes bestehen.
- issue: Funktion des priesterlichen טמא-Erklärens
  choice: für unrein erklären
  alternative: unrein machen
  rationale: Die Formulierung gibt die amtliche Statusfeststellung wieder, ohne zu behaupten, der Priester verursache die Unreinheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper gesetzlicher Satzführung. Die kultische Terminologie »unrein« bleibt erhalten; medizinisch irreführende Spezifizierung wird vermieden.
