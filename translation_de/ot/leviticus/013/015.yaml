  source_fidelity: 'Die Übersetzung bildet den hebräischen Verfahrenssatz sachgerecht ab: Der Priester sieht das als »lebendes Fleisch« bezeichnete Gewebe und erklärt die betreffende Person für unrein. Die Wiedergabe »offenes Fleisch« ist im Kontext eine plausible, verständliche Erschließung der hebräischen Wendung; die Fußnote sichert die wörtliche Formulierung ab. »Es ist eine Hautkrankheit« gibt die prädikative Identifikation als צָרַעַת ohne unzulässige moderne Diagnose wieder.'
