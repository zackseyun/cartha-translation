source:
  edition: WLC
  text: וְ/שָׂרַ֨ף אֶת הַ/בֶּ֜גֶד א֥וֹ אֶֽת הַ/שְּׁתִ֣י א֣וֹ אֶת הָ/עֵ֗רֶב בַּ/צֶּ֨מֶר֙ א֣וֹ בַ/פִּשְׁתִּ֔ים א֚וֹ אֶת כָּל כְּלִ֣י הָ/ע֔וֹר אֲשֶׁר יִהְיֶ֥ה ב֖/וֹ הַ/נָּ֑גַע כִּֽי צָרַ֤עַת מַמְאֶ֨רֶת֙ הִ֔וא בָּ/אֵ֖שׁ תִּשָּׂרֵֽף־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/052.yaml
  text: He shall burn the garment[a], or the warp or the woof in wool or in linen, or any article of leather in which the infection is, for it is a destructive skin disease[b]; it shall be burned in the fire.
translation:
  language: de
  text: Er soll das Kleidungsstück oder die Kett- oder Schussfäden aus Wolle oder Leinen oder jeden Gegenstand aus Leder verbrennen, an dem der Befall ist. Denn es ist ein bösartiger Befall[a]; es muss im Feuer verbrannt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort צָרַעַת (traditionell „Aussatz“) bezeichnet eine kultisch unrein machende Befallserscheinung, die nicht mit der heutigen Lepra gleichzusetzen ist und auch an Kleidungsstücken und Häusern auftreten kann.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׂרַף
  choice: Er soll … verbrennen
  rationale: Das Qal Perfekt mit ו setzt im gesetzlichen Zusammenhang die vorgeschriebene Handlungsfolge fort; „soll“ gibt die normative Kraft natürlich wieder.
- source_word: הַבֶּגֶד
  choice: das Kleidungsstück
  rationale: בגד bezeichnet allgemein ein Kleid beziehungsweise einen Bekleidungsgegenstand; „Kleidungsstück“ ist im modernen Deutschen breit und eindeutig.
- source_word: הַשְּׁתִי ... הָעֵרֶב
  choice: die Kett- oder Schussfäden
  rationale: Die beiden Fachwörter bezeichnen die längs und quer verlaufenden Fäden eines Gewebes. Die Ergänzung „-fäden“ macht die technischen Begriffe allgemein verständlich.
- source_word: בַּצֶּמֶר אוֹ בַפִּשְׁתִּים
  choice: aus Wolle oder Leinen
  rationale: Die Präposition bezeichnet hier das Material. „Aus“ ist im Deutschen natürlicher als eine formale Nachbildung mit „in“.
- source_word: כָּל כְּלִי הָעוֹר
  choice: jeden Gegenstand aus Leder
  rationale: כלי ist ein weiter Begriff für Gerät oder Gegenstand; diese Wiedergabe beschränkt ihn nicht auf Gefäße.
- source_word: אֲשֶׁר יִהְיֶה בוֹ הַנָּגַע
  choice: an dem sich der Befall befindet
  rationale: נגע bezeichnet hier den feststellbaren Schadens- beziehungsweise Befallsherd. „Befall“ passt zu Textilien und Leder, ohne eine moderne Diagnose einzutragen.
- source_word: צָרַעַת מַמְאֶרֶת
  choice: zerstörerischer Aussatz
  rationale: ממארת beschreibt die schädigende, hartnäckige Wirkung. „Aussatz“ wahrt den wiederkehrenden hebräischen Kategorienamen, während die Fußnote vor der Gleichsetzung mit moderner Lepra schützt.
- source_word: בָּאֵשׁ תִּשָּׂרֵף
  choice: der Gegenstand muss im Feuer verbrannt werden
  rationale: Das Niphal Imperfekt drückt das vorgeschriebene passive Ergebnis aus. Das explizite „der Gegenstand“ vermeidet im Deutschen einen unklaren Pronomenbezug.
theological_decisions:
- issue: Wiedergabe von צָרַעַת bei Textilien und Leder
  choice: Aussatz mit erklärender Fußnote
  alternative: Schadbefall; aussatzartiger Befall; Lepra
  rationale: Der Begriff bezeichnet in Levitikus eine kultisch relevante Erscheinung an Menschen, Stoffen und Häusern und ist nicht mit Morbus Hansen gleichzusetzen. Ein einheitlicher Kategoriename bewahrt den innertextlichen Zusammenhang; die Fußnote verhindert medizinische Fehldeutungen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Textile Fachbegriffe werden präzise, aber durch „-fäden“ verständlich wiedergegeben. Die Wiederholung des Verbrennungsgebots bleibt entsprechend der hebräischen Betonung erhalten.
