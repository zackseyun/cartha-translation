reference: Leviticus 13:49
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הָיָ֨ה הַ/נֶּ֜גַע יְרַקְרַ֣ק א֣וֹ אֲדַמְדָּ֗ם בַּ/בֶּגֶד֩ א֨וֹ בָ/ע֜וֹר אֽוֹ בַ/שְּׁתִ֤י אוֹ בָ/עֵ֨רֶב֙ א֣וֹ בְ/כָל כְּלִי ע֔וֹר נֶ֥גַע צָרַ֖עַת ה֑וּא וְ/הָרְאָ֖ה אֶת הַ/כֹּהֵֽן׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/049.yaml
  text: And if the spot is greenish or reddish in the garment[a], or in the leather, or in the warp or in the woof, or in any article of leather, it is a diseased spot of skin disease[b], and it shall be shown to the priest.
translation:
  language: de
  text: Wenn die betroffene Stelle an einem Kleidungsstück, an Leder, an Kett- oder Schussfäden oder an irgendeinem Gegenstand aus Leder grünlich oder rötlich ist, handelt es sich um einen Zaraat-Befall[a], und sie muss dem Priester gezeigt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Zaraat« gibt ein hebräisches Wort wieder, das in 3. Mose eine besondere, von Priestern zu beurteilende Befallskategorie bezeichnet. Sie kann Menschen, Textilien und Leder betreffen und ist nicht mit der modernen Krankheit Lepra gleichzusetzen.
    reason: alternative_reading
lexical_decisions:
- source_word: נֶגַע
  choice: Befall
  rationale: Das Wort bezeichnet hier eine sichtbar betroffene Stelle beziehungsweise Erscheinung. »Befall« passt sowohl zu Textilien als auch zu Leder und bewahrt den untersuchungsbezogenen Charakter des Abschnitts.
- source_word: יְרַקְרַק
  choice: grünlich
  rationale: Die reduplizierte Form bezeichnet eine annähernde grüne Färbung, ohne einen genaueren Farbton festzulegen.
- source_word: אֲדַמְדָּם
  choice: rötlich
  rationale: Die reduplizierte Form weist auf eine rötliche Färbung hin und wird daher nicht als reines »rot« wiedergegeben.
- source_word: בֶּגֶד
  choice: Kleidungsstück
  rationale: Im Zusammenhang bezeichnet das Wort einen Gegenstand aus Gewebe; »Kleidungsstück« ist verständlich und entspricht dem üblichen Gebrauch in diesem Abschnitt.
- source_word: עוֹר
  choice: Leder
  rationale: Gemeint ist hier tierische Haut als verarbeitetes Material, nicht die Haut eines lebenden Menschen.
- source_word: שְׁתִי / עֵרֶב
  choice: Kett- oder Schussfäden
  rationale: Die deutschen Fachwörter bezeichnen die Längs- und Querfäden eines Gewebes und geben die textile Unterscheidung des Hebräischen präzise wieder.
- source_word: כְּלִי עוֹר
  choice: Gegenstand aus Leder
  rationale: כְּלִי ist ein weiter Begriff für einen Gegenstand, ein Gerät oder ein Behältnis. Die allgemeine Formulierung vermeidet eine unbegründete Verengung.
- source_word: נֶגַע צָרַעַת
  choice: Aussatzbefall
  rationale: Die kompakte Wiedergabe kennzeichnet die besondere priesterliche Befallskategorie. Eine Fußnote stellt klar, dass צָרַעַת nicht mit moderner Lepra gleichgesetzt werden darf.
- source_word: וְהָרְאָה אֶת־הַכֹּהֵן
  choice: er muss dem Priester gezeigt werden
  rationale: Die passive Form des Hebräischen lässt die handelnde Person ungenannt und richtet die Aufmerksamkeit auf den zu untersuchenden Befall.
theological_decisions:
- issue: Wiedergabe von צָרַעַת in den Reinheitsbestimmungen
  choice: Aussatzbefall mit erklärender Fußnote
  alternative: krankhafter Befall; Zaraat-Befall; Lepra
  rationale: Der traditionelle Ausdruck »Aussatz« ist im Deutschen als biblische Kategorie erkennbar, darf aber nicht als Diagnose moderner Lepra verstanden werden. Da צָרַעַת hier auch Textilien und Leder betrifft, macht die Fußnote die größere Bedeutungsbreite ausdrücklich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der einleitende Bedingungssatz wurde idiomatisch mit »Zeigt sich« formuliert. »Kett- oder Schussfäden« ist fachlich genau und zugleich durch den geläufigen Wortbestandteil »Fäden« verständlich.
