source:
  edition: WLC
  text: וְ/הַ/בֶּ֕גֶד כִּֽי יִהְיֶ֥ה ב֖/וֹ נֶ֣גַע צָרָ֑עַת בְּ/בֶ֣גֶד צֶ֔מֶר א֖וֹ בְּ/בֶ֥גֶד פִּשְׁתִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/047.yaml
  text: And if a garment has in it an outbreak of leprosy[a], in a wool garment or in a linen garment,
translation:
  language: de
  text: Wenn an einem Kleidungsstück aus Wolle oder Leinen eine Aussatzerscheinung auftritt,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבֶּגֶד
  choice: ein Kleidungsstück
  rationale: בגד bezeichnet ein Kleid beziehungsweise ein einzelnes Kleidungsstück. Der bestimmte Artikel dient hier in der Rechtssprache zur Einführung eines allgemeinen Falles; im Deutschen ist dafür der unbestimmte Artikel natürlich.
- source_word: כִּי יִהְיֶה בוֹ
  choice: wenn an ... auftritt
  rationale: כִּי mit Imperfekt leitet einen Rechtsfall ein. בוֹ bezeichnet hier den Ort des Befalls; bei einer sichtbaren Veränderung an Stoff ist deutsches „an“ natürlicher als „in“, während „auftritt“ das Vorhandensein ausdrückt.
- source_word: נֶגַע צָרָעַת
  choice: ein Aussatzbefall
  rationale: נגע bezeichnet einen Befall beziehungsweise eine auffällige Schadstelle; צָרעת ist der traditionelle, jedoch weiter gefasste Begriff „Aussatz“. Das Kompositum gibt beide Elemente knapp wieder, ohne den Zustand mit der modernen Hansen-Krankheit gleichzusetzen.
- source_word: בְּבֶגֶד צֶמֶר
  choice: an einem Kleidungsstück aus Wolle
  rationale: Die Präposition ב wird in diesem Zusammenhang örtlich als „an“ wiedergegeben. „Aus Wolle“ bezeichnet das Material klar und idiomatisch.
- source_word: אוֹ בְּבֶגֶד פִּשְׁתִּים
  choice: oder an einem Kleidungsstück aus Leinen
  rationale: פשתים kann Flachs beziehungsweise daraus hergestelltes Leinen bezeichnen; bei einem Kleidungsstück ist „Leinen“ die natürliche Bezeichnung des fertigen Materials. Die Wiederholung von „an einem Kleidungsstück“ bewahrt die Struktur des Hebräischen.
theological_decisions:
- issue: Bedeutungsumfang von צָרָעַת bei Textilien
  choice: Aussatz mit erklärender Fußnote
  alternative: Schimmel, Fleckenkrankheit oder Verunreinigung
  rationale: Der Text verwendet denselben kultisch-rechtlichen Fachbegriff wie bei menschlichen Hauterscheinungen, hier jedoch für Textilien. Eine spezifische moderne Diagnose wäre unbegründet; die traditionelle Benennung wahrt den Zusammenhang, die Fußnote schützt vor einer falschen medizinischen Gleichsetzung.
translation_notes:
  register: Moderne, würdige Rechtssprache. Die Wiederholung der Materialangaben folgt bewusst der hebräischen Satzstruktur. Der Vers endet mit einem Komma, da der Rechtsfall in den folgenden Versen weitergeführt wird.
