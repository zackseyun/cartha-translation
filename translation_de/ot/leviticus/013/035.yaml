base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/035.yaml
  text: But if the scaly eruption does spread in the skin after his cleansing,[a]
translation:
  language: de
  text: Wenn sich die schuppige Stelle aber nach seiner Reinerklärung auf der Haut weiter ausbreitet,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Grind“. Das hebräische Wort bezeichnet eine besondere, in diesem Kapitel beschriebene Hautveränderung am Kopf oder im Bartbereich, die offenbar mit Schuppung und Haarverlust einhergeht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Wenn … aber
  rationale: Die Verbindung leitet einen bedingten, gegenüber dem vorherigen Fall kontrastierenden Verfahrensschritt ein; die deutsche Wortstellung gibt beides natürlich wieder.
- source_word: פָּשֹׂה יִפְשֶׂה
  choice: sich … weiter ausbreitet
  rationale: Infinitivus absolutus und finite Verbform verstärken den Vorgang. „Weiter ausbreitet“ bringt im Deutschen die nach der Reinerklärung erneut festgestellte Ausbreitung idiomatisch zum Ausdruck, ohne ein bestimmtes Ausmaß hinzuzufügen.
- source_word: הַנֶּתֶק
  choice: die schuppige Stelle
  rationale: Der Ausdruck bezeichnet in diesem Kapitel eine besondere Erkrankung beziehungsweise sichtbare Veränderung im Kopf- oder Bartbereich, die mit geschädigtem Haar und wohl auch Schuppung verbunden ist. Die Übersetzung ist verständlicher als das ältere „Grind“ und vermeidet die irreführende Wiedergabe als bloßen Juckreiz.
- source_word: בָּעוֹר
  choice: auf der Haut
  rationale: עוֹר bedeutet „Haut“. Im Deutschen bezeichnet „auf der Haut ausbreiten“ den sichtbaren Verlauf einer Hautveränderung natürlicher als „in der Haut“.
- source_word: אַחֲרֵי
  choice: nach
  rationale: Gibt die zeitliche Abfolge knapp und unmittelbar wieder.
- source_word: טָהֳרָתוֹ
  choice: seiner Reinerklärung
  rationale: Im Zusammenhang der priesterlichen Untersuchung geht es um den zuvor festgestellten Reinheitsstatus. „Reinerklärung“ macht diesen rechtlich-kultischen Vorgang deutlich und vermeidet den Eindruck einer moralischen Reinigung.
theological_decisions: []
