  source_fidelity: Die Übersetzung gibt den kontrastierenden Konditionalsatz, die emphatische Aussage einer Ausbreitung, נתק als sichtbar-spezifische Hautveränderung, עור als „Haut“ sowie die zeitliche Einordnung nach der kultisch-rechtlichen Reinerklärung zutreffend wieder. „Weiter ausbreitet“ ist im Verfahrenskontext eine idiomatische deutsche Wiedergabe der nachdrücklich ausgedrückten Ausbreitung, ohne eine medizinische Diagnose festzulegen.
  naturalness: Der Satz ist modernes, verständliches Standarddeutsch und bewahrt sinnvoll die zum folgenden Vers hin offene Satzführung. Die Stellung von „aber“ ist natürlich; „auf der Haut“ ist im Deutschen für die sichtbare Ausbreitung einer Hautveränderung idiomatisch.
  terminology: „Schuppige Stelle“ ist als vorsichtige beschreibende Wiedergabe von נתק vertretbar. Die Fußnote bietet mit „Grind“ die traditionelle lexikalische Alternative und erläutert die begrenzte medizinische Bestimmbarkeit sachlich. „Reinerklärung“ bildet hier den priesterlich festgestellten kultischen Status präziser ab als eine möglicherweise moralisch verstandene „Reinigung“.
