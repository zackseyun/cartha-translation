source:
  edition: WLC
  text: וְ/אִם בַּהֶרֶת֩ לְבָנָ֨ה הִ֜וא בְּ/ע֣וֹר בְּשָׂר֗/וֹ וְ/עָמֹק֙ אֵין מַרְאֶ֣/הָ מִן הָ/ע֔וֹר וּ/שְׂעָרָ֖/ה לֹא הָפַ֣ךְ לָבָ֑ן וְ/הִסְגִּ֧יר הַ/כֹּהֵ֛ן אֶת הַ/נֶּ֖גַע שִׁבְעַ֥ת יָמִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/004.yaml
  text: But if the bright spot is white in the skin of his flesh[a], and its appearance is not deeper than the skin, and its hair has not turned white[c][b], then the priest shall isolate the affected area for seven days.
translation:
  language: de
  text: Wenn aber auf der Haut seines Körpers ein weißer, heller Fleck[a] zu sehen ist, der nicht tiefer als die Haut erscheint, und das Haar darauf nicht weiß geworden ist, soll der Priester die betroffene Person[b] sieben Tage lang absondern[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch „heller Hautfleck“ oder „glänzender Fleck“; gemeint ist die hier beschriebene auffällige Hautveränderung.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „den Befall“ oder „die Schädigung“; das hebräische Wort bezeichnet den untersuchten Befund. Gemeint ist die Person, die diesen Befund aufweist.
    reason: lexical_alternative
  - marker: c
    text: Oder „unter Verschluss halten“; das hebräische Verb bezeichnet eine vorläufige Absonderung zur Beobachtung.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּהֶרֶת
  choice: heller Fleck
  rationale: Das Wort bezeichnet hier eine durch Helligkeit oder Weißfärbung auffallende Hautveränderung. „Heller Fleck“ ist im modernen Deutsch verständlich und unterscheidet den Befund von der zuvor genannten Schwellung.
- source_word: לְבָנָה
  choice: weiß
  rationale: Das Adjektiv bezeichnet unmittelbar die Farbe des Flecks.
- source_word: בְּעוֹר בְּשָׂרוֹ
  choice: auf der Haut seines Körpers
  rationale: „Körper“ gibt בשר in diesem anatomischen Zusammenhang natürlich wieder; „auf der Haut“ entspricht dem üblichen deutschen Ausdruck für einen sichtbaren Hautbefund.
- source_word: וְעָמֹק אֵין מַרְאֶהָ מִן הָעוֹר
  choice: der nicht tiefer als die Haut erscheint
  rationale: Die Formulierung bewahrt den visuellen Charakter des diagnostischen Merkmals und legt nicht fest, ob tatsächlich eine Vertiefung vorliegt.
- source_word: וּשְׂעָרָהּ לֹא הָפַךְ לָבָן
  choice: das Haar darauf nicht weiß geworden ist
  rationale: Der feminine Suffixbezug gilt dem Fleck; „das Haar darauf“ ist im Deutschen klarer als das wörtliche „ihr Haar“.
- source_word: וְהִסְגִּיר
  choice: soll … absondern
  rationale: Das Verb bezeichnet eine zeitweilige Absonderung beziehungsweise Verwahrung zur weiteren Beobachtung. „Absondern“ erhält den verfahrensbezogenen Sinn, ohne vorschnell eine moderne medizinische Quarantäne vorauszusetzen.
- source_word: אֶת־הַנֶּגַע
  choice: die betroffene Stelle
  rationale: נגע bezeichnet den untersuchten Befund beziehungsweise die befallene Stelle. „Betroffene Stelle“ vermeidet die irreführenden oder diagnostisch zu starken Wiedergaben „Plage“ und „Krankheit“.
- source_word: שִׁבְעַת יָמִים
  choice: sieben Tage lang
  rationale: Natürliche deutsche Wiedergabe der angegebenen Dauer.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die anatomisch missverständliche Wendung „Haut seines Fleisches“ wird natürlich als „Haut seines Körpers“ wiedergegeben. Die visuelle Unsicherheit des Befunds bleibt durch „erscheint“ erhalten; moderne medizinische Fachdiagnosen werden vermieden.
