source:
  edition: WLC
  text: וְ/רָאָ֨/הוּ֙ הַ/כֹּהֵ֔ן וְ/הִנֵּ֛ה פָּשָׂ֥ה הַ/נֶּ֖תֶק בָּ/ע֑וֹר לֹֽא יְבַקֵּ֧ר הַ/כֹּהֵ֛ן לַ/שֵּׂעָ֥ר הַ/צָּהֹ֖ב טָמֵ֥א הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/036.yaml
  text: And if the priest examines him[a], and behold, the scaly infection has spread in the skin, the priest need not look for the yellow hair; he is unclean.
translation:
  language: de
  text: Und wenn der Priester ihn untersucht und feststellt, dass sich der schuppige Befall[a] auf der Haut ausgebreitet hat, braucht der Priester nicht nach gelbem Haar zu suchen; er ist unrein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet einen besonderen schuppigen Hautbefund, vor allem an Kopf oder Bart; traditionell auch „Grind“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָהוּ
  choice: wenn der Priester ihn untersucht
  rationale: ראה bezeichnet im Kontext der priesterlichen Hautschau nicht bloßes Sehen, sondern eine prüfende Untersuchung. Die konditionale Wiedergabe ergibt sich aus dem gesetzlichen Zusammenhang.
- source_word: וְהִנֵּה
  choice: und feststellt, dass
  rationale: הִנֵּה hebt den dabei erhobenen Befund hervor. „Feststellt, dass“ gibt diese deiktische Funktion in natürlichem modernem Deutsch wieder, ohne das heute stark altertümliche „siehe“ zu verwenden.
- source_word: פָּשָׂה
  choice: sich … ausgebreitet hat
  rationale: Die Form bezeichnet die weitere Ausbreitung des Befunds und entspricht dem wiederkehrenden diagnostischen Sprachgebrauch in Levitikus 13.
- source_word: הַנֶּתֶק
  choice: der Schorf
  rationale: נֶתֶק bezeichnet in diesem Abschnitt einen besonderen krankhaften Befund an Kopf oder Bart. „Schorf“ ist knapp, verständlich und wahrt die konkrete dermatologische Unbestimmtheit besser als eine moderne Diagnose.
- source_word: בָּעוֹר
  choice: auf der Haut
  rationale: Im Deutschen ist „auf der Haut ausbreiten“ die natürliche idiomatische Wiedergabe der hebräischen Präpositionalverbindung.
- source_word: לֹא יְבַקֵּר
  choice: braucht … nicht … zu suchen
  rationale: בקר meint hier das prüfende Nachforschen nach einem diagnostischen Merkmal. Die Negation besagt, dass diese zusätzliche Prüfung bei bereits festgestellter Ausbreitung nicht erforderlich ist.
- source_word: לַשֵּׂעָר הַצָּהֹב
  choice: nach gelbem Haar
  rationale: Die direkte Wiedergabe bewahrt das zuvor im Kapitel genannte diagnostische Zeichen.
- source_word: טָמֵא הוּא
  choice: er ist unrein
  rationale: Das maskuline Pronomen bezieht sich im Kontext auf den untersuchten Menschen; „unrein“ bezeichnet seinen kultischen Status.
theological_decisions:
- issue: Bedeutung von טָמֵא im Reinheitsgesetz
  choice: unrein
  alternative: verunreinigt / kultisch unrein
  rationale: Der Ausdruck bezeichnet hier einen rechtlich-kultischen Status und nicht notwendig moralische Schuld. Das etablierte „unrein“ lässt diesen Zusammenhang bestehen, ohne ihn ausdeutend zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit gesetzlich-diagnostischem Ton. Die Satzstruktur bleibt nah am Hebräischen, wird aber durch „feststellt, dass“ idiomatisch geglättet. Die medizinisch nicht sicher bestimmbare Bezeichnung wird nicht mit einer modernen Diagnose gleichgesetzt.
