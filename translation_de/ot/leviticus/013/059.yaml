  to: Dies ist die Weisung für einen aussatzartigen Befall an einem Kleidungsstück aus Wolle oder Leinen, an Kett- oder Schussfäden oder an irgendeinem Gegenstand aus Leder, um den betreffenden Gegenstand für rein oder unrein zu erklären.
  rationale: Die Änderung von „Schadstelle“ zu „Befall“ verbessert die natürliche deutsche Ausdrucksweise für die an unbelebten Materialien beschriebene Erscheinung und vermeidet eine unnötige Einschränkung auf eine Stelle. Die explizite Bezugnahme auf den betreffenden Gegenstand beseitigt die deutsche Pronomenmehrdeutigkeit, ohne die Funktion der priesterlichen Statusfeststellung zu verändern.
