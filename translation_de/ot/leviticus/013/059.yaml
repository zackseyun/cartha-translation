  revised_text: Dies ist die Weisung für einen aussatzartigen Befall an einem Kleidungsstück aus Wolle oder Leinen, an Kett- oder Schussfäden oder an irgendeinem Gegenstand aus Leder, um den betreffenden Gegenstand für rein oder unrein zu erklären.
  revised_footnotes:
