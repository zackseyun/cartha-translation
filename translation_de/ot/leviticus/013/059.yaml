  edition: WLC
  text: זֹ֠את תּוֹרַ֨ת נֶֽגַע צָרַ֜עַת בֶּ֥גֶד הַ/צֶּ֣מֶר א֣וֹ הַ/פִּשְׁתִּ֗ים א֤וֹ הַ/שְּׁתִי֙ א֣וֹ הָ/עֵ֔רֶב א֖וֹ כָּל כְּלִי ע֑וֹר לְ/טַהֲר֖/וֹ א֥וֹ לְ/טַמְּאֽ/וֹ־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/059.yaml
  text: This is the law for an outbreak of leprous disease in a wool garment or a linen garment[a], or in the warp or the woof, or in any leather article, for pronouncing it clean or pronouncing it unclean.
translation:
  language: de
  text: Dies ist die Weisung für einen aussatzartigen Befall an einem Kleidungsstück aus Wolle oder Leinen, an Kett- oder Schussfäden oder an irgendeinem Gegenstand aus Leder, um den betreffenden Gegenstand für rein oder unrein zu erklären.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תּוֹרַת
  choice: die Weisung für
  rationale: תּוֹרָה bezeichnet hier die maßgebliche Regelung für die zuvor behandelten Fälle. „Weisung“ gibt den rechtlich-anleitenden Sinn wieder, ohne das Wort auf ein modernes Gesetzbuch einzuengen.
- source_word: נֶגַע צָרַעַת
  choice: aussatzartige Schadstelle
  rationale: נֶגַע bezeichnet eine erkennbare betroffene Stelle, während צָרַעַת die besondere kultische Kategorie bestimmt. Da sie hier Textilien und Leder betrifft, wäre eine moderne medizinische Diagnose irreführend; „aussatzartig“ wahrt zugleich die Verbindung zum traditionellen Begriff.
- source_word: בֶּגֶד הַצֶּמֶר א֣וֹ הַפִּשְׁתִּים
  choice: ein Kleidungsstück aus Wolle oder Leinen
  rationale: Die Konstruktion nennt ein Kleidungsstück aus einem der beiden Materialien. „Leinen“ gibt den in diesem Zusammenhang gemeinten verarbeiteten Flachs natürlich wieder.
- source_word: הַשְּׁתִי ... הָעֵרֶב
  choice: Kett- oder Schussfäden
  rationale: Dies sind die üblichen deutschen Fachbegriffe für die längs beziehungsweise quer verlaufenden Fäden eines Gewebes. „Fäden“ wird zur unmittelbaren Verständlichkeit ergänzt.
- source_word: כָּל כְּלִי עוֹר
  choice: irgendein Gegenstand aus Leder
  rationale: כְּלִי ist eine breite Bezeichnung für einen Gegenstand oder Gebrauchsartikel; „Gegenstand aus Leder“ bewahrt diesen Umfang in natürlichem Deutsch.
- source_word: לְטַהֲרוֹ א֥וֹ לְטַמְּאוֹ
  choice: um ihn für rein oder unrein zu erklären
  rationale: Die Verben bezeichnen im priesterlichen Rechtszusammenhang die Feststellung beziehungsweise Erklärung des kultischen Status, nicht bloß eine physische Reinigung oder Verunreinigung.
theological_decisions:
- issue: Wiedergabe von צָרַעַת bei Textilien und Leder
  choice: aussatzartige Schadstelle
  alternative: Aussatz; Schimmelbefall; Hautkrankheit
  rationale: Der hebräische Ausdruck bezeichnet eine kultisch relevante Erscheinung, die nicht deckungsgleich mit der modernen Hansen-Krankheit ist und hier sogar unbelebte Materialien betrifft. Die gewählte Formulierung vermeidet sowohl eine medizinische Fehldiagnose als auch die unbelegte Festlegung auf Schimmel und erhält die begriffliche Verbindung zu den Personen betreffenden Fällen des Kapitels.
- issue: Bedeutung von rein und unrein
  choice: Feststellung des kultischen Status durch „für rein oder unrein erklären“
  alternative: physisch säubern oder beschmutzen
  rationale: Im Zusammenhang der priesterlichen Untersuchung geht es um die verbindliche Einstufung nach den Reinheitsbestimmungen. Die Übersetzung macht diese rechtlich-kultische Funktion kenntlich, ohne über das im Text Gesagte hinauszugehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Textile Fachbegriffe werden in ihrer heute üblichen Form verwendet und durch „Fäden“ verständlich gemacht. Der Satzbau bleibt nahe an der zusammenfassenden Rechtsformel des Hebräischen.
