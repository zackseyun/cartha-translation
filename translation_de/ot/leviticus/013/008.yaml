  text: וְ/רָאָה֙ הַ/כֹּהֵ֔ן וְ/הִנֵּ֛ה פָּשְׂתָ֥ה הַ/מִּסְפַּ֖חַת בָּ/ע֑וֹר וְ/טִמְּא֥/וֹ הַ/כֹּהֵ֖ן צָרַ֥עַת הִֽוא׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/008.yaml
  text: And the priest shall examine him[a], and behold, if the scaly eruption has spread on the skin, the priest shall pronounce him unclean; it is leprosy.
translation:
  language: de
  text: Der Priester soll ihn untersuchen. Wenn sich die schuppige Hautveränderung auf der Haut ausgebreitet hat, soll der Priester ihn für unrein erklären; es ist Aussatz[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort zaraʿat wird traditionell mit »Aussatz« wiedergegeben. In Levitikus bezeichnet es wahrscheinlich ein breiteres Spektrum von Hauterkrankungen oder Hautveränderungen und nicht nur die heute als Lepra (Morbus Hansen) bekannte Krankheit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: soll ihn untersuchen
  rationale: ראה bezeichnet im priesterlichen Diagnoseverfahren nicht bloß ein Sehen, sondern eine förmliche Untersuchung.
- source_word: וְהִנֵּה
  choice: wenn
  rationale: Die Partikel lenkt auf den bei der Untersuchung festgestellten Befund; im deutschen Rechtssatz gibt „wenn“ ihre kontextuelle Bedingungsfunktion natürlich wieder.
- source_word: פָּשְׂתָה
  choice: sich … ausgebreitet hat
  rationale: Das Verb bezeichnet die Ausbreitung beziehungsweise Ausdehnung der Hautveränderung als entscheidendes Diagnosemerkmal.
- source_word: הַמִּסְפַּחַת
  choice: die schuppige Hautveränderung
  rationale: Der Ausdruck bezeichnet eine oberflächliche Hauterscheinung; diese Wiedergabe ist verständlich und vermeidet die zu enge Festlegung auf Schorf oder Ausschlag.
- source_word: בָּעוֹר
  choice: auf der Haut
  rationale: עור bedeutet „Haut“; „auf der Haut“ ist im Deutschen die natürliche Ortsangabe.
- source_word: וְטִמְּאוֹ
  choice: soll … ihn für unrein erklären
  rationale: Der Priester verursacht die Unreinheit nicht, sondern stellt den kultischen Status verbindlich fest.
- source_word: צָרַעַת
  choice: Aussatz
  rationale: „Aussatz“ bewahrt den traditionellen biblischen Fachbegriff, ohne die Erscheinung ausdrücklich mit moderner Lepra beziehungsweise Morbus Hansen gleichzusetzen; eine Fußnote erläutert die größere Bedeutungsbreite.
- source_word: הִוא
  choice: es ist
  rationale: Das feminine Pronomen verweist auf die diagnostizierte Erscheinung und bildet einen identifizierenden Nominalsatz.
theological_decisions:
- issue: Wiedergabe von צָרַעַת im levitischen Reinheitsrecht
  choice: Aussatz
  alternative: eine schwere Hautkrankheit / Lepra / Zaraat
  rationale: Der hebräische Begriff umfasst in Levitikus mehr als die heute medizinisch definierte Lepra. „Aussatz“ erhält den überlieferten biblischen Oberbegriff, während die Fußnote eine falsche medizinische Gleichsetzung verhindert und die genuine begriffliche Weite wahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit der für Gesetzestexte natürlichen Soll-Form. Kurze Hauptsätze erhalten die Klarheit des priesterlichen Diagnoseverfahrens; medizinisch irreführende Eindeutigkeit wird vermieden.
