  text: וְ/אִם֮ יִרְאֶ֣ה הַ/כֹּהֵן֒ וְ/הִנֵּה֙ לֹא פָשָׂ֣ה הַ/נֶּ֔גַע בַּ/בֶּ֕גֶד א֥וֹ בַ/שְּׁתִ֖י א֣וֹ בָ/עֵ֑רֶב א֖וֹ בְּ/כָל כְּלִי עֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/053.yaml
  text: But if the priest examines it[a], and behold, the infection has not spread in the garment, or in the warp, or in the woof, or in any article of leather,
translation:
  language: de
  text: Wenn aber der Priester nachsieht und feststellt, dass sich die befallene Stelle weder am Kleidungsstück noch an den Kett- oder Schussfäden[a] noch an irgendeinem Gegenstand aus Leder ausgebreitet hat,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „an der Kette oder am Schuss“; gemeint sind die längs beziehungsweise quer verlaufenden Fäden eines Gewebes.'
    reason: Erläuterung der textiltechnischen Begriffe und der kollektiven Ausdrucksweise des Hebräischen.
lexical_decisions:
- source_word: וְאִם
  choice: Wenn aber
  rationale: Leitet als Fortsetzung des vorherigen Verfahrens einen bedingten Gegenfall ein; „aber“ gibt den leichten Kontrast wieder.
- source_word: יִרְאֶה הַכֹּהֵן
  choice: der Priester nachsieht
  rationale: Das wörtliche „sieht“ bezeichnet hier die amtliche Nachprüfung durch den Priester; „nachsieht“ ist im Deutschen natürlich und bleibt nah am Bild des Sehens.
- source_word: וְהִנֵּה
  choice: und feststellt
  rationale: Der hebräische Aufmerksamkeitsmarker hebt das Ergebnis der Untersuchung hervor. Im modernen deutschen Satz gibt „feststellt“ diese Funktion natürlich wieder, ohne das heute stark altertümliche „siehe“ zu verwenden.
- source_word: לֹא פָשָׂה
  choice: sich … nicht ausgebreitet hat
  rationale: פשה bezeichnet in diesem Zusammenhang das räumliche Umsichgreifen des Befalls; das Perfekt beschreibt das bei der Nachprüfung vorliegende Ergebnis.
- source_word: הַנֶּגַע
  choice: die befallene Stelle
  rationale: Die Formulierung bezeichnet den betroffenen Bereich, ohne eine bestimmte moderne medizinische oder mikrobiologische Diagnose vorauszusetzen.
- source_word: בַּבֶּגֶד
  choice: am Kleidungsstück
  rationale: בגד bezeichnet hier ein Textilerzeugnis; „Kleidungsstück“ ist gegenwärtig und verständlich. Die Präposition wird bei einem sichtbaren Materialbefall idiomatisch mit „an“ wiedergegeben.
- source_word: בַשְּׁתִי א֣וֹ בָעֵרֶב
  choice: an den Kett- oder Schussfäden
  rationale: שתי bezeichnet die längs verlaufenden Kettfäden, ערב die quer verlaufenden Schussfäden. Die modernen deutschen Fachwörter sind präzise und auch außerhalb des Textilhandwerks verständlich.
- source_word: בְּכָל כְּלִי עוֹר
  choice: an irgendeinem Gegenstand aus Leder
  rationale: כלי ist ein allgemeiner Ausdruck für Gegenstand, Gerät oder Erzeugnis. „Gegenstand aus Leder“ bewahrt diese Breite und vermeidet das irreführend enge „Gefäß“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers bleibt entsprechend dem hebräischen Satzbau als bedingender Nebensatz offen und wird durch ein Komma abgeschlossen, da der Folgesatz im nächsten Vers steht. Die Wendung „und feststellt“ gibt die Funktion von וְהִנֵּה idiomatisch wieder.
