  text: And the priest shall examine the diseased area[b][a], and he shall isolate the diseased area for seven days.
translation:
  language: de
  text: Dann soll der Priester die Befallsstelle[a] untersuchen und die Befallsstelle für sieben Tage einschließen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „die betroffene Stelle“, „den Befall“; traditionell auch „das Mal“. Das hebräische Wort bezeichnet hier die auffällige Stelle, die der Priester untersucht, nicht zwingend eine bestimmte Krankheit im heutigen medizinischen Sinn.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „einschließen“ oder „verschließen“. Gemeint ist eine zeitweilige Absonderung zur Beobachtung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: soll … untersuchen
  rationale: רָאָה bedeutet wörtlich „sehen“, bezeichnet hier im geregelten priesterlichen Verfahren jedoch eine amtliche Untersuchung.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Entspricht der üblichen Bedeutung von כֹּהֵן und bewahrt den bestimmten Artikel.
- source_word: הַנָּגַע / הַנֶּגַע
  choice: die Befallsstelle
  rationale: נֶגַע bezeichnet hier die auffällige beziehungsweise betroffene Stelle, die untersucht wird. „Befallsstelle“ passt zum unmittelbaren Zusammenhang mit Textilien und vermeidet die Festlegung auf eine moderne Krankheitsdiagnose.
- source_word: וְהִסְגִּיר
  choice: soll … absondern
  rationale: Das Hifil von סגר bedeutet „einschließen, verschließen, absondern“. „Absondern“ gibt die zeitweilige Isolierung zur Beobachtung wieder, ohne die modernen fachlichen Voraussetzungen von „unter Quarantäne stellen“ einzutragen.
- source_word: שִׁבְעַת יָמִים
  choice: sieben Tage lang
  rationale: Natürliche deutsche Wiedergabe der Zeitdauer.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „Befallsstelle“ folgt dem Hebräischen und vermeidet einen unklaren Rückbezug. „Dann“ bildet die fortführende Erzähl- beziehungsweise Verfahrensform וְ ab.
