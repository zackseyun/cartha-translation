  variant: modern standard German
source:
  edition: WLC
  text: וְ/אִ֣ם יִרְאֶ֣/נָּה הַ/כֹּהֵ֗ן וְ/הִנֵּ֤ה אֵֽין בַּ/בֶּהֶ֨רֶת֙ שֵׂעָ֣ר לָבָ֔ן וּ/שְׁפָלָ֥ה אֵינֶ֛/נָּה מִן הָ/ע֖וֹר וְ/הִ֣וא כֵהָ֑ה וְ/הִסְגִּיר֥/וֹ הַ/כֹּהֵ֖ן שִׁבְעַ֥ת יָמִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/026.yaml
  text: But if the priest examines it[a], and behold, there is no white hair in the bright spot, and it is not deeper than the skin, but it is faded[b], then the priest shall isolate him seven days.
translation:
  language: de
  text: Wenn der Priester sie jedoch untersucht und feststellt, dass sich in der hellen Stelle kein weißes Haar befindet, dass sie nicht tiefer als die Haut liegt[a] und verblasst ist, dann soll der Priester ihn sieben Tage lang absondern[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „nicht niedriger als die Haut“; das heißt, die Stelle erscheint gegenüber der umgebenden Haut nicht eingesunken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „einschließen“ beziehungsweise „absondern und beobachten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאֶנָּה
  choice: sie untersucht
  rationale: Das Verb bedeutet wörtlich „sie sieht“; im Zusammenhang der priesterlichen Begutachtung gibt „untersucht“ die formelle Prüfung natürlich und präzise wieder.
- source_word: וְהִנֵּה
  choice: und feststellt, dass
  rationale: Die hebräische Aufmerksamkeitsformel leitet hier das Ergebnis der Untersuchung ein. Die deutsche Formulierung bewahrt ihre feststellende Funktion, ohne das heute stark altertümliche „siehe“ zu verwenden.
- source_word: בַּבֶּהֶרֶת
  choice: in der hellen Stelle
  rationale: בַּהֶרֶת bezeichnet in 3. Mose 13 eine auffällig helle Hautveränderung. „Helle Stelle“ erhält den visuellen Sinn, ohne eine moderne medizinische Diagnose vorwegzunehmen.
- source_word: שֵׂעָר לָבָן
  choice: weißes Haar
  rationale: Der kollektive Singular wird im Deutschen natürlich als „weißes Haar“ wiedergegeben und lässt offen, ob ein einzelnes oder mehrere Haare gemeint sind.
- source_word: וּשְׁפָלָה אֵינֶנָּה מִן הָעוֹר
  choice: sie nicht tiefer als die Haut liegt
  rationale: שָׁפָל bezeichnet eine niedrigere beziehungsweise eingesunkene Lage. Die Wendung gibt das sichtbare diagnostische Merkmal verständlich wieder.
- source_word: כֵהָה
  choice: verblasst ist
  rationale: Das Wort bezeichnet hier ein schwaches, mattes oder verblasstes Erscheinungsbild der Hautstelle. „Verblasst“ ist im Zusammenhang anschaulich und verständlich.
- source_word: וְהִסְגִּירוֹ
  choice: soll ... ihn ... absondern
  rationale: Das Verb bezeichnet das Abschließen beziehungsweise Absondern zur Beobachtung. „Absondern“ wahrt den antiken kultisch-diagnostischen Zusammenhang, ohne die modernen Implikationen von „Quarantäne“ aufzudrängen.
- source_word: שִׁבְעַת יָמִים
  choice: sieben Tage lang
  rationale: Direkte und idiomatische Wiedergabe der Zeitangabe.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bildet den Ablauf von Untersuchung, Befund und anschließender Maßnahme klar ab. Das feminine Pronomen „sie“ nimmt die zuvor erwähnte Hautstelle auf; das maskuline „ihn“ bezeichnet die untersuchte Person.
