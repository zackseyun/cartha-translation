source:
  edition: WLC
  text: צָרַ֨עַת נוֹשֶׁ֤נֶת הִוא֙ בְּ/ע֣וֹר בְּשָׂר֔/וֹ וְ/טִמְּא֖/וֹ הַ/כֹּהֵ֑ן לֹ֣א יַסְגִּרֶ֔/נּוּ כִּ֥י טָמֵ֖א הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/011.yaml
  text: it is a chronic skin disease in the skin of his body[a], and the priest shall pronounce him unclean; he shall not isolate him, for he is unclean.
translation:
  language: de
  text: Es ist eine seit Langem bestehende Hautkrankheit auf der Haut seines Körpers[a]. Der Priester soll ihn für unrein erklären. Er soll ihn nicht absondern, denn er ist unrein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine lang bestehende Hautkrankheit“. Der traditionell oft mit „Aussatz“ wiedergegebene hebräische Begriff bezeichnet in Levitikus ein breiteres Spektrum von Hauterkrankungen als die heutige Hansen-Krankheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרַעַת
  choice: Hautausschlag
  rationale: Der hebräische Begriff bezeichnet in Levitikus verschiedene auffällige Hautveränderungen und nicht speziell die moderne Hansen-Krankheit. „Hautausschlag“ ist verständlich, ohne die irreführende medizinische Festlegung „Aussatz“ zu übernehmen.
- source_word: נוֹשֶׁנֶת
  choice: schon lange bestehend
  rationale: Das Partizip bezeichnet etwas Altes beziehungsweise seit längerer Zeit Vorhandenes. Die Formulierung gibt dies natürlich wieder, ohne eine moderne medizinische Diagnose wie „chronisch“ festzuschreiben.
- source_word: בְּעוֹר בְּשָׂרוֹ
  choice: an der Haut seines Körpers
  rationale: „Körper“ ist im heutigen Deutsch in diesem konkreten körperlichen Zusammenhang natürlicher als „Fleisch“; die Präposition wird idiomatisch mit „an“ wiedergegeben.
- source_word: וְטִמְּאוֹ
  choice: soll ihn für unrein erklären
  rationale: Im priesterlichen Untersuchungsverfahren stellt der Priester den kultischen Status verbindlich fest; er verursacht die Unreinheit nicht.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Direkte und etablierte Wiedergabe des kultischen Amtes.
- source_word: לֹא יַסְגִּרֶנּוּ
  choice: Er soll ihn nicht absondern
  rationale: Das Verb bezeichnet hier die Absonderung zur weiteren Beobachtung. „Absondern“ passt zum kultisch-rechtlichen Verfahren und vermeidet die moderne medizinische Engführung von „Quarantäne“.
- source_word: כִּי טָמֵא הוּא
  choice: denn er ist unrein
  rationale: 'Die kausale Aussage begründet, weshalb keine weitere Absonderung zur Beobachtung nötig ist: Der Status steht bereits fest.'
theological_decisions:
- issue: Wiedergabe der Terminologie ritueller Unreinheit
  choice: unrein
  alternative: rituell unrein
  rationale: טמא bezeichnet hier einen kultisch-rechtlichen Status und keine persönliche moralische Schuld. „Unrein“ bewahrt den biblischen Leitbegriff; der Zusammenhang macht seinen rituellen Sinn deutlich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau wurde zur Klarheit gegliedert. Die kultisch-rechtliche Sprache bleibt erhalten, während missverständliche moderne medizinische Festlegungen vermieden werden.
