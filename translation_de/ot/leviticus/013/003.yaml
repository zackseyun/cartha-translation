  text: וְ/רָאָ֣ה הַ/כֹּהֵ֣ן אֶת הַ/נֶּ֣גַע בְּ/עֽוֹר הַ֠/בָּשָׂר וְ/שֵׂעָ֨ר בַּ/נֶּ֜גַע הָפַ֣ךְ לָבָ֗ן וּ/מַרְאֵ֤ה הַ/נֶּ֨גַע֙ עָמֹק֙ מֵ/ע֣וֹר בְּשָׂר֔/וֹ נֶ֥גַע צָרַ֖עַת ה֑וּא וְ/רָאָ֥/הוּ הַ/כֹּהֵ֖ן וְ/טִמֵּ֥א אֹתֽ/וֹ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/003.yaml
  text: And the priest shall examine the diseased spot on the skin of the body[a], and if the hair in the spot has turned white and the appearance of the spot is deeper than the skin of his body, it is a diseased spot of skin disease; when the priest has examined him, he shall pronounce him unclean.
translation:
  language: de
  text: Der Priester soll die betroffene Stelle auf der Haut des Körpers untersuchen. Ist das Haar an der Stelle weiß geworden und erscheint die Stelle tiefer als die Haut seines Körpers, so ist es eine von Aussatz[a] betroffene Stelle. Nachdem der Priester ihn untersucht hat, soll er ihn für unrein erklären.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das traditionell mit „Aussatz“ oder „Lepra“ wiedergegebene hebräische Wort צָרַעַת bezeichnet eine umfassendere Kategorie von Hautveränderungen als die moderne Lepra (Hansen-Krankheit).
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגַע
  choice: betroffene Stelle
  rationale: Im diagnostischen Zusammenhang bezeichnet das Wort eine sichtbare Hautveränderung beziehungsweise einen auffälligen Bereich. „Betroffene Stelle“ ist natürlich und legt die genaue medizinische Ursache nicht fest.
- source_word: בְּעוֹר הַבָּשָׂר
  choice: auf der Haut des Körpers
  rationale: Die anatomische Bedeutung von עוֹר und בָּשָׂר bleibt erhalten; „Körper“ ist hier im modernen Deutschen natürlicher als das wörtliche „Fleisch“.
- source_word: שֵׂעָר בַּנֶּגַע הָפַךְ לָבָן
  choice: das Haar an der Stelle weiß geworden
  rationale: Gibt den beobachtbaren eingetretenen Farbwechsel des Haares präzise und idiomatisch wieder.
- source_word: מַרְאֵה הַנֶּגַע עָמֹק מֵעוֹר בְּשָׂרוֹ
  choice: die Stelle tiefer als die Haut seines Körpers erscheint
  rationale: „Erscheint“ bewahrt מַרְאֵה als Aussage über den sichtbaren Befund; „tiefer“ erhält den Vergleich des Hebräischen.
- source_word: נֶגַע צָרַעַת
  choice: eine von Aussatz betroffene Stelle
  rationale: Die Formulierung gibt beide Bestandteile wieder, ohne die im Deutschen schwerfällige Wiederholung „krankhafte Stelle einer Hautkrankheit“. „Aussatz“ wird als traditionelle Bezeichnung verwendet und durch eine Fußnote gegen eine Gleichsetzung mit moderner Lepra abgesichert.
- source_word: וְרָאָהוּ
  choice: Nachdem der Priester ihn untersucht hat
  rationale: Der pronominale Bezug auf die untersuchte Person wird im Zusammenhang am besten mit „ihn“ wiedergegeben; die temporale Formulierung verdeutlicht die Abfolge von Untersuchung und Urteil.
- source_word: וְטִמֵּא אֹתוֹ
  choice: soll er ihn für unrein erklären
  rationale: Im priesterlichen Rechtskontext stellt der Priester den kultischen Status fest und spricht ihn aus; er verursacht die Unreinheit nicht.
theological_decisions:
- issue: Wiedergabe von צָרַעַת im Reinheitsgesetz
  choice: Aussatz mit erklärender Fußnote
  alternative: Hautkrankheit; Lepra
  rationale: צָרַעַת bezeichnet eine alte kultisch-diagnostische Kategorie, die nicht deckungsgleich mit der modernen Hansen-Krankheit ist. „Aussatz“ bewahrt den traditionellen biblischen Terminus, während die Fußnote die mögliche medizinische Fehlidentifikation verhindert.
- issue: Wirkung des priesterlichen Urteils in וְטִמֵּא אֹתוֹ
  choice: für unrein erklären
  alternative: unrein machen; als unrein erklären
  rationale: Die Aussage beschreibt ein autoritatives Urteil über den rituellen Status, nicht dessen Verursachung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau wurde für die Verständlichkeit in drei Sätze gegliedert. Die diagnostische und kultrechtliche Sprache bleibt sachlich; moderne medizinische Präzision wird nicht in den antiken Begriff hineingelesen.
