  source_fidelity: 'Der Entwurf gibt den kasuistischen Anschluss („Wenn“) und das Abheilen grundsätzlich wieder. „sich ... bildet“ ist jedoch nicht im hebräischen Text ausgedrückt: יִהְיֶה bezeichnet hier das Vorhandensein eines Befunds. Zudem ist „Geschwür“ für שְׁחִין zu unspezifisch und kann besonders an eine Ulzeration denken lassen; „Furunkel“ trifft den üblichen Sinn eines entzündeten Hautleidens genauer.'
