  terminology: „Körper“ ist als kontextgemäße Wiedergabe von בָּשָׂר vertretbar. Für שְׁחִין ist „Furunkel“ gegenüber „Geschwür“ vorzuziehen. „abheilt“ ist eine natürliche, sachgerechte Wiedergabe von וְנִרְפָּא.
