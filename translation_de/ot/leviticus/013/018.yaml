  - severity: medium
    issue: „Geschwür“ ist für שְׁחִין medizinisch und semantisch weniger treffend.
    rationale: Das hebräische Wort bezeichnet typischerweise einen entzündeten Ausschlag bzw. ein Furunkel; „Geschwür“ kann eine andere Art von Hautläsion nahelegen.
  - severity: low
    issue: Die Wortfolge „am Körper in seiner Haut“ ist stilistisch sperrig.
    rationale: Eine Umstellung verbessert die Lesbarkeit und bewahrt zugleich die Ortsangaben.
