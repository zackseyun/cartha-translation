  text: Wenn am Körper, in seiner Haut, ein Furunkel ist und es abheilt,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבָשָׂר
  choice: am Körper
  rationale: בָשָׂר bezeichnet wörtlich das Fleisch, kann hier im medizinisch-rechtlichen Zusammenhang aber natürlich den Körper als Träger der Haut bezeichnen.
- source_word: כִּי
  choice: wenn
  rationale: כִּי leitet hier einen Fall innerhalb einer Rechtsbestimmung ein; „wenn“ entspricht diesem kasuistischen Stil.
- source_word: יִהְיֶה בּוֹ בְעֹרוֹ
  choice: sich am Körper in seiner Haut ... bildet
  rationale: Die deutsche Formulierung gibt die Existenz und Lage des Befunds idiomatisch wieder und bewahrt mit „in seiner Haut“ die ausdrückliche Ortsangabe בְעֹרוֹ.
- source_word: שְׁחִין
  choice: ein Geschwür
  rationale: שְׁחִין bezeichnet eine entzündete Hautschädigung, etwa ein Geschwür oder einen Furunkel; „Geschwür“ ist im Kontext verständlich und hinreichend weit.
- source_word: וְנִרְפָּא
  choice: und es abheilt
  rationale: Der Nifal von רפא kann passiv („geheilt wird“) oder intransitiv („abheilt“) verstanden werden. „Abheilt“ ist im Deutschen bei einer Hautschädigung natürlich.
