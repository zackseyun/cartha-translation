  source_fidelity: 'Der Vers ist im Wesentlichen quellennah wiedergegeben: Der Priester untersucht die betroffene Person am siebten Tag, eine Ausbreitung in der Haut führt zur Erklärung der Unreinheit, und die Diagnose wird als נֶגַע צָרַעַת bezeichnet. „Für unrein erklären“ gibt die deklarative Funktion von וְטִמֵּא angemessen wieder. „Die Stelle“ ist eine im Deutschen sinnvolle, kontextuell gedeckte Ergänzung zum feminin verstandenen Bezug des Verbs.'
