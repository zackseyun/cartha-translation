source:
  edition: WLC
  text: וְ/רָאָ֥/הוּ הַ/כֹּהֵ֖ן בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֑י אִם פָּשֹׂ֤ה תִפְשֶׂה֙ בָּ/ע֔וֹר וְ/טִמֵּ֤א הַ/כֹּהֵן֙ אֹת֔/וֹ נֶ֥גַע צָרַ֖עַת הִֽוא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/027.yaml
  text: And the priest shall examine him on the seventh day. If it has indeed spread in the skin, the priest shall pronounce him unclean; it is an infection of skin disease.
translation:
  language: de
  text: Der Priester soll ihn am siebten Tag untersuchen. Hat sich die Stelle tatsächlich in der Haut ausgebreitet, soll der Priester ihn für unrein erklären; es ist ein Befall mit einer Hautkrankheit[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionell mit „Aussatz“ wiedergegeben. Der hebräische Begriff bezeichnet in den Reinheitsvorschriften Israels ein breiteres Spektrum von Hauterkrankungen und Hautveränderungen und nicht unbedingt Lepra (Hansen-Krankheit).
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָהוּ
  choice: soll ihn untersuchen
  rationale: רָאָה bedeutet wörtlich „sehen“, bezeichnet hier im priesterlichen Diagnoseverfahren jedoch eine gezielte Untersuchung.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: am siebten Tag
  rationale: Direkte und idiomatische Wiedergabe der Zeitangabe.
- source_word: אִם פָּשֹׂה תִפְשֶׂה
  choice: hat sich … tatsächlich … ausgebreitet
  rationale: Der Infinitivus absolutus mit der finiten Verbform verstärkt die Aussage; „tatsächlich“ gibt diese Betonung natürlich wieder.
- source_word: בָּעוֹר
  choice: in der Haut
  rationale: עוֹר bezeichnet die Haut; die Präposition wird entsprechend der räumlichen Darstellung des Befalls mit „in“ wiedergegeben.
- source_word: וְטִמֵּא ... אֹתוֹ
  choice: soll … ihn für unrein erklären
  rationale: Der Priester verursacht die Unreinheit nicht, sondern fällt im Rahmen der Reinheitsordnung ein verbindliches Urteil.
- source_word: נֶגַע צָרַעַת
  choice: ein Befall mit einer Hautkrankheit
  rationale: נֶגַע bezeichnet hier einen sichtbaren krankhaften Befall, während צָרַעַת eine breitere Kategorie ernster Hautveränderungen in den Reinheitsgesetzen bezeichnet und nicht eindeutig der modernen Hansen-Krankheit entspricht.
theological_decisions:
- issue: Wiedergabe von צָרַעַת in den Reinheitsvorschriften
  choice: Hautkrankheit
  alternative: Aussatz
  rationale: „Aussatz“ ist die traditionelle Wiedergabe, kann heute jedoch fälschlich ausschließlich an Lepra beziehungsweise die Hansen-Krankheit denken lassen. „Hautkrankheit“ wahrt die größere Bedeutungsbreite des hebräischen Begriffs; die traditionelle Alternative wird in der Fußnote genannt.
- issue: Wirkung des priesterlichen Urteils
  choice: für unrein erklären
  alternative: unrein machen
  rationale: Die Formulierung macht deutlich, dass der Priester den Reinheitsstatus feststellt und offiziell ausspricht, statt die Unreinheit hervorzurufen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem gesetzlichem Ton. „Die Stelle“ wird aus dem unmittelbaren Diagnosekontext ergänzt, damit der Bezug des hebräischen Verbs im Deutschen eindeutig und natürlich bleibt.
