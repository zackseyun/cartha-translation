  text: וְ/רָאָ֨ה הַ/כֹּהֵ֜ן אֶת הַ/נֶּ֗גַע וְ/הִנֵּ֤ה מַרְאֵ֨/הוּ֙ עָמֹ֣ק מִן הָ/ע֔וֹר וּ/ב֛/וֹ שֵׂעָ֥ר צָהֹ֖ב דָּ֑ק וְ/טִמֵּ֨א אֹת֤/וֹ הַ/כֹּהֵן֙ נֶ֣תֶק ה֔וּא צָרַ֧עַת הָ/רֹ֛אשׁ א֥וֹ הַ/זָּקָ֖ן הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/030.yaml
  text: And the priest shall examine the diseased area[a], and behold, its appearance is deeper than the skin, and in it is thin yellow hair, then the priest shall pronounce him unclean; it is an itch[b], a skin disease of the head or of the beard.
translation:
  language: de
  text: 'Der Priester soll die betroffene Stelle untersuchen. Und siehe: Sie erscheint tiefer als die Haut, und in ihr befindet sich feines gelbes Haar. Dann soll der Priester ihn für unrein erklären. Es handelt sich um Grind[a], eine Hautkrankheit[b] des Kopfes oder des Bartes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Grind“ ist eine traditionelle Wiedergabe des hebräischen Wortes für eine Erkrankung im Bereich von Kopf oder Bart; die genaue medizinische Entsprechung ist unsicher. Möglich ist auch die Wiedergabe „Kopfgrind“.
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort צָרַעַת bezeichnet verschiedene Hauterkrankungen oder Hautveränderungen und ist nicht ohne Weiteres mit Lepra im heutigen medizinischen Sinn (Hansen-Krankheit) gleichzusetzen.
    reason: cultural_note
lexical_decisions:
- source_word: נֶגַע
  choice: betroffene Stelle
  rationale: Im Zusammenhang bezeichnet das Wort die sichtbare Hautveränderung, die der Priester untersucht. „Betroffene Stelle“ ist verständlich und legt keine moderne Diagnose fest.
- source_word: מַרְאֵהוּ עָמֹק מִן־הָעוֹר
  choice: sie erscheint tiefer als die Haut
  rationale: Die Formulierung bewahrt das diagnostische Bild einer gegenüber der Haut vertieft erscheinenden Veränderung, ohne ihre medizinische Beschaffenheit näher zu bestimmen.
- source_word: שֵׂעָר צָהֹב דַּק
  choice: feines gelbes Haar
  rationale: „Fein“ gibt דַּק und „gelb“ צָהֹב wieder; „Haar“ kann wie im Hebräischen kollektiv verstanden werden.
- source_word: וְטִמֵּא אֹתוֹ
  choice: soll ihn für unrein erklären
  rationale: Der Priester spricht einen kultisch-rechtlichen Befund aus; er verursacht die Unreinheit nicht.
- source_word: נֶתֶק
  choice: Grind
  rationale: Das seltene Fachwort bezeichnet hier eine Erkrankung im behaarten Bereich von Kopf oder Bart. „Grind“ ist eine knappe traditionelle Annäherung; die genaue medizinische Entsprechung bleibt unsicher und wird in einer Fußnote erläutert.
- source_word: צָרַעַת
  choice: Hautkrankheit
  rationale: Der hebräische Sammelbegriff ist weiter als die moderne Hansen-Krankheit. „Hautkrankheit“ vermeidet die irreführende Gleichsetzung mit heutiger Lepra.
- source_word: הָרֹאשׁ אוֹ הַזָּקָן
  choice: des Kopfes oder des Bartes
  rationale: Die genitivische Wiedergabe folgt der hebräischen Zuordnung und vermeidet die interpretierende Verengung von רֹאשׁ auf „Kopfhaut“.
theological_decisions:
- issue: Bedeutung der priesterlichen Unreinheitserklärung
  choice: für unrein erklären
  alternative: unrein machen
  rationale: Der Wortlaut beschreibt hier das Urteil des Priesters über den kultischen Status, nicht die Verursachung moralischer Schuld oder körperlicher Erkrankung.
translation_notes:
  register: Moderne, würdige Gesetzessprache mit kurzen Sätzen. „Und siehe“ bewahrt das hervorgehobene וְהִנֵּה; die medizinische Unsicherheit der antiken Bezeichnungen wird nicht durch eine moderne Diagnose verdeckt.
