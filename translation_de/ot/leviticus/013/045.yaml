  text: וְ/הַ/צָּר֜וּעַ אֲשֶׁר בּ֣/וֹ הַ/נֶּ֗גַע בְּגָדָ֞י/ו יִהְי֤וּ פְרֻמִים֙ וְ/רֹאשׁ/וֹ֙ יִהְיֶ֣ה פָר֔וּעַ וְ/עַל שָׂפָ֖ם יַעְטֶ֑ה וְ/טָמֵ֥א טָמֵ֖א יִקְרָֽא־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/045.yaml
  text: As for the one with the skin disease[a], in whom the infection is, his clothes shall be torn, his head shall be left unkempt, he shall cover his mustache, and he shall cry out, ‘Unclean, unclean!’
translation:
  language: de
  text: 'Der Mensch mit einer Hautkrankheit[a], bei dem der Befall vorliegt, soll zerrissene Kleider tragen und sein Haar ungepflegt lassen. Er soll seinen Oberlippenbereich[b] verhüllen und ausrufen: »Unrein! Unrein!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: »der Aussätzige«. Das hebräische Wort bezeichnet hier verschiedene schwere Hautbefunde und nicht ausschließlich die heute als Lepra oder Hansen-Krankheit bekannte Erkrankung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »seinen Schnurrbart verhüllen«; wörtlich: »über seiner Oberlippe verhüllen«. Die hebräische Wendung kann den Bereich der Oberlippe beziehungsweise des Schnurrbarts bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצָּרוּעַ
  choice: der Mensch mit der Hautkrankheit
  rationale: Die Bezeichnung meint im Kontext eine Person mit einer kultisch relevanten Hauterkrankung; „Aussätziger“ könnte fälschlich ausschließlich an die moderne Hansen-Krankheit denken lassen.
- source_word: הַנֶּגַע
  choice: die betroffene Stelle
  rationale: נֶגַע bezeichnet hier den festgestellten krankhaften Befund beziehungsweise die befallene Stelle, ohne eine moderne Infektionslehre vorauszusetzen.
- source_word: בְּגָדָיו יִהְיוּ פְרֻמִים
  choice: soll zerrissene Kleider tragen
  rationale: Die hebräische Konstruktion besagt wörtlich, dass seine Kleider zerrissen sein sollen; die deutsche Formulierung gibt den vorgeschriebenen sichtbaren Zustand natürlich wieder.
- source_word: וְרֹאשׁוֹ יִהְיֶה פָרוּעַ
  choice: sein Haar ungepflegt lassen
  rationale: פָרוּעַ bezeichnet wahrscheinlich loses, ungeordnetes oder vernachlässigtes Haar und nicht einen entblößten Kopf.
- source_word: וְעַל שָׂפָם יַעְטֶה
  choice: seinen Oberlippenbereich verhüllen
  rationale: שָׂפָם kann die Oberlippe beziehungsweise den Bartbereich darüber bezeichnen. Die Formulierung wahrt diese anatomische Unschärfe besser als nur „Schnurrbart“.
- source_word: וְטָמֵא טָמֵא יִקְרָא
  choice: 'ausrufen: »Unrein! Unrein!«'
  rationale: Die Wiederholung kennzeichnet einen nachdrücklichen öffentlichen Ruf; „unrein“ bezeichnet hier den kultischen Status.
theological_decisions:
- issue: Bedeutung der Unreinheit
  choice: „unrein“ als kultischer und öffentlicher Status
  alternative: moralisch schuldig oder medizinisch ansteckend
  rationale: טָמֵא bezeichnet im Zusammenhang des Heiligkeitsgesetzes rituelle Unreinheit. Der Text setzt diese nicht ohne Weiteres mit persönlicher Sünde oder einer modernen medizinischen Diagnose gleich.
- issue: Art der Hauterkrankung
  choice: allgemeine Bezeichnung „Hautkrankheit“
  alternative: „Aussatz“ im Sinn der Hansen-Krankheit
  rationale: צָרוּעַ umfasst im Kontext von Levitikus 13 ein breiteres Spektrum auffälliger Hautbefunde; eine genaue moderne Diagnose wäre sachlich zu eng.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Rechtssatz bleibt verbindlich formuliert; medizinisch missverständliche Fachsprache wird vermieden. Der Fußnotenmarker [a] steht unmittelbar bei der erklärungsbedürftigen Bezeichnung.
