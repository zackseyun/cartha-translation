base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/031.yaml
  text: And if the priest examines the diseased area of the scaly outbreak[a], and indeed its appearance is not deeper than the skin and there is no black hair in it, then the priest shall isolate the diseased area of the scaly outbreak for seven days.
translation:
  language: de
  text: Und wenn der Priester die vom Grind[a] befallene Stelle untersucht und sieht, dass sie nicht tiefer liegt als die Haut und sich kein schwarzes Haar darin befindet, soll der Priester die vom Grind befallene Stelle sieben Tage lang absondern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Flechte“; „Grind“ (נֶתֶק) bezeichnet hier eine besondere Haut- oder Kopfhauterkrankung; auch „Juckreiz“ wird erwogen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגַע
  choice: befallene Stelle
  rationale: Bezeichnet hier den sichtbar betroffenen Hautbereich; die Formulierung ist sachlich, verständlich und vermeidet die moderne Bedeutung von „Plage“.
- source_word: נֶתֶק
  choice: Grind
  rationale: Bezeichnet in diesem Abschnitt eine besondere Erkrankung an behaarten Hautstellen, die mit Haarverlust verbunden sein kann. „Grind“ ist die traditionelle deutsche Bezeichnung, ohne eine moderne Diagnose festzulegen.
- source_word: מַרְאֵהוּ
  choice: sie … erscheint
  rationale: Gibt die visuelle Beurteilung idiomatisch wieder; das feminine Pronomen bezieht sich auf die befallene Stelle.
- source_word: עָמֹק מִן־הָעוֹר
  choice: tiefer als die Haut
  rationale: Bewahrt den hebräischen Vergleich und die diagnostische Aussage, dass die Stelle optisch unter dem Hautniveau liegen kann.
- source_word: שֵׂעָר שָׁחֹר
  choice: schwarzes Haar
  rationale: Gibt die ausdrücklich genannte Haarfarbe genau wieder.
- source_word: וְהִסְגִּיר
  choice: soll … absondern
  rationale: Drückt die zeitweilige Trennung zur weiteren Beobachtung aus, ohne die spezifisch moderne medizinische Bedeutung von „unter Quarantäne stellen“ einzutragen.
- source_word: שִׁבְעַת יָמִים
  choice: für sieben Tage
  rationale: Natürliche deutsche Wiedergabe der Zeitdauer.
- source_word: וְכִי
  choice: Und wenn
  rationale: Bewahrt sowohl die Verknüpfung mit dem vorhergehenden Fallrecht als auch die konditionale Struktur.
- source_word: יִרְאֶה
  choice: untersucht
  rationale: Das wörtliche „sieht“ bezeichnet im gesetzlichen Zusammenhang die amtliche Besichtigung durch den Priester.
