    rationale: Der Status constructus bezeichnet die Läsion beziehungsweise betroffene Stelle des Grindes. „Mit dem Grind“ lässt zwei getrennte Untersuchungsgegenstände anklingen und ist im Deutschen unnötig missverständlich.
  - severity: low
    issue: Die Fußnote erklärt נֶתֶק als Erkrankung „an behaarten Hautstellen“.
    rationale: Der Vers selbst nennt zwar schwarzes Haar als Kriterium, doch die lexikalische Bedeutung sollte nicht enger als nötig als eine bestimmte Lokalisierung oder Erkrankung festgelegt werden. Eine neutralere Beschreibung bewahrt die Unsicherheit der antiken dermatologischen Terminologie.
