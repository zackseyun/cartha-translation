- from: Und wenn der Priester die befallene Stelle mit dem Grind[a] untersucht und sie nicht tiefer als die Haut erscheint und sich kein schwarzes Haar darin befindet, soll der Priester die vom Grind befallene Stelle für sieben Tage absondern.
  to: Und wenn der Priester die vom Grind[a] befallene Stelle untersucht und sieht, dass sie nicht tiefer liegt als die Haut und sich kein schwarzes Haar darin befindet, soll der Priester die vom Grind befallene Stelle sieben Tage lang absondern.
  rationale: Die Revision stellt die hebräische Verbindung נֶגַע הַנֶּתֶק eindeutig als „vom Grind befallene Stelle“ dar und macht die visuelle Feststellung des Priesters explizit. Die Fußnote erläutert den traditionssprachlichen Ausdruck, ohne eine moderne Diagnose oder eine engere Lokalisation festzulegen.
