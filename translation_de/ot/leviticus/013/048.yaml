  text: א֤וֹ בִֽ/שְׁתִי֙ א֣וֹ בְ/עֵ֔רֶב לַ/פִּשְׁתִּ֖ים וְ/לַ/צָּ֑מֶר א֣וֹ בְ/ע֔וֹר א֖וֹ בְּ/כָל מְלֶ֥אכֶת עֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/048.yaml
  text: or in the warp or in the woof of the linen or of the wool[a], or in leather[c][b], or in any article made of leather—
translation:
  language: de
  text: oder in der Kette oder im Schuss, sei es aus Leinen oder aus Wolle, oder in Leder oder in irgendeinem Gegenstand aus Leder –
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁתִי
  choice: Kette
  rationale: Der Ausdruck bezeichnet beim Weben die längs verlaufenden Fäden; „Kette“ ist der übliche deutsche Fachbegriff und bildet mit „Schuss“ ein natürliches Begriffspaar.
- source_word: עֵרֶב
  choice: Schuss
  rationale: Der Ausdruck bezeichnet die quer durch die Kettfäden geführten Fäden; „Schuss“ ist dafür der heutige deutsche Fachbegriff.
- source_word: לַפִּשְׁתִּים
  choice: aus Leinen
  rationale: Das Wort kann wörtlich Flachs bezeichnen, meint im Zusammenhang gewebter Stoffe aber wahrscheinlich das daraus hergestellte Leinen. „Aus“ gibt hier die Materialzugehörigkeit natürlich wieder.
- source_word: וְלַצָּמֶר
  choice: oder aus Wolle
  rationale: צֶמֶר bedeutet „Wolle“. Die Formulierung ordnet sowohl Kette als auch Schuss den beiden möglichen Materialien Leinen und Wolle zu.
- source_word: עוֹר
  choice: Leder
  rationale: Im Zusammenhang mit gefertigten Gegenständen ist verarbeitetes Tierfell gemeint; „Leder“ passt daher besser als „Haut“ oder „Fell“.
- source_word: בְּכָל מְלֶאכֶת עוֹר
  choice: in irgendeinem Gegenstand aus Leder
  rationale: מְלָאכָה bezeichnet hier ein hergestelltes Erzeugnis, nicht abstrakt Arbeit. Die Wiedergabe ist klar und bewahrt den umfassenden Sinn von כָל.
- source_word: אוֹ ... אוֹ
  choice: oder ... oder
  rationale: Die wiederholte Alternative wird entsprechend der hebräischen Aufzählungsstruktur weitgehend bewahrt; „sei es“ verdeutlicht idiomatisch die beiden möglichen Textilmaterialien.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die textiltechnischen Begriffe „Kette“ und „Schuss“ sind präzise und im Deutschen als festes Paar gebräuchlich. Der Vers ist syntaktisch ein unvollständiger Teil des über mehrere Verse laufenden Rechtssatzes; der Gedankenstrich bewahrt den Anschluss an den folgenden Vers.
