source:
  edition: WLC
  text: וְ/כִֽי יִהְיֶ֤ה בַ/קָּרַ֨חַת֙ א֣וֹ בַ/גַּבַּ֔חַת נֶ֖גַע לָבָ֣ן אֲדַמְדָּ֑ם צָרַ֤עַת פֹּרַ֨חַת֙ הִ֔וא בְּ/קָרַחְתּ֖/וֹ א֥וֹ בְ/גַבַּחְתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/042.yaml
  text: But if there is on the bald head or on the bald forehead a white-reddish diseased spot[b][a], it is a spreading skin disease on his bald head or on his bald forehead.
translation:
  language: de
  text: Wenn aber an der kahlen Stelle am Hinterkopf oder an der Stirn[a] ein weiß-rötlicher Krankheitsfleck vorhanden ist, handelt es sich um eine ausbrechende Hautkrankheit[b] an seiner kahlen Stelle am Hinterkopf oder an seiner Stirn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die beiden hebräischen Begriffe unterscheiden wahrscheinlich eine kahle Stelle am Hinterkopf von einer kahlen Stelle im vorderen Kopfbereich.
    reason: cultural_note
  - marker: b
    text: 'Traditionell: »Aussatz«. Der hebräische Begriff bezeichnet ein breiteres Spektrum von Hautkrankheiten oder krankhaften Erscheinungen und ist nicht einfach mit der modernen Hansen-Krankheit gleichzusetzen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי יִהְיֶה
  choice: Wenn aber … auftritt
  rationale: Leitet einen bedingten, zum Vorhergehenden kontrastierenden Rechtsfall ein; „auftritt“ gibt das existentielle היה zusammen mit dem sichtbaren נגע im Deutschen natürlich wieder.
- source_word: בַקָּרַחַת / בַגַּבַּחַת
  choice: auf der Hinterkopfglatze / auf der Stirnglatze
  rationale: Die beiden Fachwörter bezeichnen unterschiedliche kahle Bereiche, wahrscheinlich hinten beziehungsweise vorn am Kopf. Die parallelen deutschen Bildungen bewahren diese Unterscheidung.
- source_word: נֶגַע
  choice: Krankheitsfleck
  rationale: Bezeichnet in diesem Untersuchungskontext eine sichtbare krankhafte Stelle, ohne eine moderne medizinische Diagnose festzulegen.
- source_word: לָבָן אֲדַמְדָּם
  choice: weiß-rötlich
  rationale: Bewahrt die Reihenfolge und die zusammengesetzte Farbangabe des Hebräischen, wobei אֲדַמְדָּם eine rötliche Tönung bezeichnet.
- source_word: צָרַעַת
  choice: Hautkrankheit
  rationale: Der hebräische Sammelbegriff umfasst verschiedene krankhafte Hauterscheinungen und ist nicht genau mit der modernen Hansen-Krankheit gleichzusetzen.
- source_word: פֹּרַחַת
  choice: ausbrechend
  rationale: Das Partizip von פרח beschreibt hier eine hervorbrechende beziehungsweise sich entwickelnde Erkrankung; „ausbrechend“ bewahrt diese Bildlichkeit, ohne zwingend einen bereits nachgewiesenen flächenmäßigen Verlauf anzunehmen.
- source_word: בְּקָרַחְתּוֹ / בְגַבַּחְתּוֹ
  choice: auf seiner Hinterkopfglatze / seiner Stirnglatze
  rationale: Die Possessivsuffixe werden ausdrücklich wiedergegeben, und die zuvor eingeführte Unterscheidung der kahlen Bereiche bleibt erhalten.
theological_decisions:
- issue: Wiedergabe von צָרַעַת
  choice: Hautkrankheit
  alternative: Aussatz
  rationale: „Aussatz“ ist die traditionelle Wiedergabe, kann aber fälschlich ausschließlich an Lepra beziehungsweise die Hansen-Krankheit denken lassen. Die neutralere Haupttextfassung wahrt den breiteren Umfang des hebräischen Begriffs; die traditionelle Alternative wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Gesetzesstil. Die seltenen, aber transparenten Bildungen „Hinterkopfglatze“ und „Stirnglatze“ erhalten die im Hebräischen ausdrücklich markierte anatomische Unterscheidung. Alle Fußnotenmarker stehen unmittelbar bei den erklärten Ausdrücken.
