  naturalness: Die Überarbeitung bleibt modernes, würdiges Standarddeutsch. „Sie liegt tiefer als die umgebende Haut“ beschreibt den diagnostischen Sichtbefund klar und idiomatisch. Der Plural „die Haare an ihr“ ist im Deutschen für das kollektiv gebrauchte hebräische Substantiv natürlich.
  terminology: „aussatzartige Hautkrankheit“ wahrt die traditionelle Assoziation, ohne צָרַעַת mit Hansen-Krankheit gleichzusetzen. Die Fußnote erläutert den hebräischen Begriff präziser und ohne eine moderne medizinische Diagnose zu behaupten. „Geschwür“ ist für שְׁחִין im Kontext vertretbar.
