source:
  edition: WLC
  text: וְ/רָאָ֣ה הַ/כֹּהֵ֗ן וְ/הִנֵּ֤ה מַרְאֶ֨/הָ֙ שָׁפָ֣ל מִן הָ/ע֔וֹר וּ/שְׂעָרָ֖/הּ הָפַ֣ךְ לָבָ֑ן וְ/טִמְּא֧/וֹ הַ/כֹּהֵ֛ן נֶֽגַע צָרַ֥עַת הִ֖וא בַּ/שְּׁחִ֥ין פָּרָֽחָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/020.yaml
  text: And the priest shall examine it[a], and behold, its appearance is deeper than the skin, and its hair has turned white; then the priest shall pronounce him unclean. It is an outbreak of leprosy; it has broken out in the boil.
translation:
  language: de
  text: 'Der Priester soll die Stelle untersuchen, und siehe: Sie liegt tiefer als die umgebende Haut, und die Haare an ihr sind weiß geworden. Dann soll der Priester ihn für unrein erklären. Es ist ein Befall mit einer aussatzartigen Hautkrankheit[a], die im Geschwür ausgebrochen ist.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Begriff צָרַעַת (zara'at) wird traditionell mit „Aussatz“ wiedergegeben. Im 3. Mosebuch bezeichnet er jedoch nicht ausschließlich die moderne Lepra (Hansen-Krankheit), sondern eine weiter gefasste Kategorie auffälliger Hauterkrankungen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: soll … untersuchen
  rationale: Im priesterlichen Diagnoseverfahren bezeichnet ראה nicht nur das Sehen, sondern die sachkundige Untersuchung.
- source_word: וְהִנֵּה
  choice: wenn
  rationale: Das Aufmerksamkeitssignal führt hier die bei der Untersuchung festgestellten Merkmale ein. Im Deutschen gibt eine konditionale Form den rechtlichen Ablauf natürlicher wieder, ohne den Inhalt der Beobachtung zu verändern.
- source_word: מַרְאֶהָ שָׁפָל מִן הָעוֹר
  choice: sie tiefer als die Haut erscheint
  rationale: Die Wendung beschreibt den optischen Eindruck einer gegenüber der umgebenden Haut vertieften Stelle; „erscheint“ bewahrt, dass es um den diagnostischen Anschein geht.
- source_word: וּשְׂעָרָהּ הָפַךְ לָבָן
  choice: das Haar an ihr weiß geworden ist
  rationale: Der feminine Suffixbezug gilt der betroffenen Stelle. „Das Haar an ihr“ ist im Deutschen klarer als das missverständliche „ihr Haar“.
- source_word: וְטִמְּאוֹ
  choice: soll … ihn für unrein erklären
  rationale: Der Priester stellt den kultischen Status verbindlich fest; er verursacht die Unreinheit nicht.
- source_word: נֶגַע צָרַעַת
  choice: ein Befall mit einer aussatzartigen Hautkrankheit
  rationale: נגע bezeichnet hier den krankhaften Befall, während צרעת eine breitere alttestamentliche Diagnosekategorie ist und nicht eindeutig der modernen Hansen-Krankheit entspricht.
- source_word: בַּשְּׁחִין
  choice: am Geschwür
  rationale: שְׁחִין bezeichnet ein entzündetes Geschwür beziehungsweise eine Eiterbeule; „Geschwür“ ist im modernen Deutschen verständlich und passend.
- source_word: פָּרָחָה
  choice: ausgebrochen ist
  rationale: Das Verb bezeichnet das Hervortreten beziehungsweise Ausbrechen der Erkrankung, nicht zwingend ihre großflächige Ausbreitung.
theological_decisions:
- issue: Wiedergabe von צָרַעַת im Reinheitsgesetz
  choice: aussatzartige Hautkrankheit
  alternative: Aussatz; Lepra; Zaraat
  rationale: „Lepra“ würde die Diagnose anachronistisch auf die Hansen-Krankheit festlegen. Die gewählte Form bleibt für heutige Leser verständlich, kennzeichnet die traditionelle Nähe zu „Aussatz“ und lässt durch die Fußnote den weiteren Bedeutungsumfang erkennen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der rechtlich-diagnostische Ablauf wird mit klaren Soll- und Wenn-Formulierungen wiedergegeben; medizinische und kultische Kategorien werden nicht miteinander gleichgesetzt.
