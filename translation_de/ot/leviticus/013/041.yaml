source:
  edition: WLC
  text: וְ/אִם֙ מִ/פְּאַ֣ת פָּנָ֔י/ו יִמָּרֵ֖ט רֹאשׁ֑/וֹ גִּבֵּ֥חַ ה֖וּא טָה֥וֹר הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/041.yaml
  text: And if the front of his head becomes bald[a], he is bald on the forehead; he is clean.
translation:
  language: de
  text: Wenn ihm die Haare vorn am Kopf ausfallen[a], hat er eine Stirnglatze; er ist rein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn er vorn am Kopf kahl wird“. Der hebräische Ausdruck unterscheidet diese Stirnglatze von der Glatze am Hinterkopf beziehungsweise Scheitel im vorigen Vers.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּאַת פָּנָיו
  choice: vorn am Kopf
  rationale: Die Wendung bezeichnet in diesem Zusammenhang den vorderen Bereich des Kopfes. Die natürliche deutsche Formulierung wahrt den anatomischen Gegensatz zur Glatze am Hinterkopf im vorigen Vers.
- source_word: יִמָּרֵט
  choice: die Haare ausfallen
  rationale: Die Nifal-Form beschreibt, dass die betreffende Stelle kahl wird. Im Deutschen gibt „die Haare ausfallen“ den Vorgang idiomatisch wieder.
- source_word: רֹאשׁוֹ
  choice: am Kopf
  rationale: Standardbedeutung in diesem anatomischen Zusammenhang.
- source_word: גִּבֵּחַ
  choice: Stirnglatze
  rationale: Der Ausdruck bezeichnet eine Glatze im vorderen Kopfbereich und unterscheidet sich vom Begriff für die Glatze am Hinterkopf beziehungsweise Scheitel im vorigen Vers.
- source_word: טָהוֹר
  choice: rein
  rationale: In Levitikus 13 bezeichnet das Wort den kultischen Status nach priesterlicher Beurteilung, nicht moralische Reinheit.
theological_decisions:
- issue: Terminologie des kultischen Reinheitsstatus
  choice: rein
  alternative: sauber; unbefleckt
  rationale: „Rein“ ist die etablierte und sachgerechte deutsche Wiedergabe der levitischen Kategorie. Sie bewahrt den kultischen Sinn, ohne eine moralische Bewertung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung ist anatomisch klar und bewahrt die fachliche Unterscheidung der beiden hebräischen Begriffe für unterschiedliche Formen der Glatze.
