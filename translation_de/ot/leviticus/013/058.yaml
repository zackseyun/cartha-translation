revisions:
- from: Wenn du aber das Kleidungsstück, die Kett- oder die Schussfäden oder irgendeinen Gegenstand aus Leder wäschst und der Befall daraus verschwindet, soll das betreffende Stück ein zweites Mal gewaschen werden; dann ist es rein.
  to: 'Das Kleidungsstück, die Kett- oder die Schussfäden oder irgendein Gegenstand aus Leder: Wenn du sie wäschst und der Befall davon verschwindet, sollen sie ein zweites Mal gewaschen werden und sind dann rein.'
  rationale: Die Revision entfernt das nicht im Ausgangstext begründete „aber“ und fasst die alternativen Gegenstände pluralisch zusammen. Dadurch bleiben die zweite Person beim Waschen, das Verschwinden des Befalls, die vorgeschriebene zweite Waschung und das Ergebnis kultischer Reinheit erhalten, ohne den Bezug auf ein künstliches Singularwort einzuengen.
