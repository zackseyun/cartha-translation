  source_fidelity: Die Wiedergabe der Gegenstände, der Webereibegriffe, des Befalls, der zweiten Waschung und der kultischen Reinheit ist grundsätzlich treffend. Das einleitende „aber“ hat jedoch keine Grundlage im Hebräischen. Die Konstruktion mit „Wenn“ ist als deutsche Verfahrensbedingung möglich, sollte aber klar auf die gesamte Aufzählung bezogen sein.
  naturalness: Die Fachbegriffe „Kettfäden“ und „Schussfäden“ sind präzise und im modernen Standarddeutsch verständlich. Die bisherige Folge „Wenn du ... wäschst ... soll das betreffende Stück“ ist wegen der gemischten Aufzählung und des nachträglich eingeführten Singulars etwas uneinheitlich. Eine pluralische Zusammenfassung der aufgeführten Gegenstände ist flüssiger.
  terminology: „Befall“ wahrt die offen gelassene Art der Erscheinung; „rein“ gibt die kultische Bedeutung von טהר angemessen wieder. „Kettfäden“ und „Schussfäden“ entsprechen שׁתי bzw. ערב.
