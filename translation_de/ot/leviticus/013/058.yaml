source:
  edition: WLC
  text: וְ/הַ/בֶּ֡גֶד אֽוֹ הַ/שְּׁתִ֨י אוֹ הָ/עֵ֜רֶב אֽוֹ כָל כְּלִ֤י הָ/עוֹר֙ אֲשֶׁ֣ר תְּכַבֵּ֔ס וְ/סָ֥ר מֵ/הֶ֖ם הַ/נָּ֑גַע וְ/כֻבַּ֥ס שֵׁנִ֖ית וְ/טָהֵֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/058.yaml
  text: But the garment[a], or the warp, or the woof, or any article of leather that you wash, and the infection departs from them, shall be washed a second time and be clean.
translation:
  language: de
  text: 'Das Kleidungsstück, die Kett- oder die Schussfäden oder irgendein Gegenstand aus Leder: Wenn du sie wäschst und der Befall davon verschwindet, sollen sie ein zweites Mal gewaschen werden und sind dann rein.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבֶּגֶד
  choice: das Kleidungsstück
  rationale: בגד bezeichnet allgemein ein Kleidungsstück oder Textilerzeugnis. „Kleidungsstück“ ist im heutigen Deutsch verständlich und passt zum Sachzusammenhang.
- source_word: הַשְּׁתִי
  choice: die Kettfäden
  rationale: Der Ausdruck bezeichnet beim Weben die längs verlaufenden Fäden. „Kettfäden“ ist der übliche deutsche Fachbegriff.
- source_word: הָעֵרֶב
  choice: die Schussfäden
  rationale: Als Gegenbegriff zu den Kettfäden bezeichnet das Wort die quer eingetragenen Fäden. „Schussfäden“ ist im modernen Deutschen präzise und geläufig.
- source_word: כָל כְּלִי הָעוֹר
  choice: irgendeinen Gegenstand aus Leder
  rationale: כְּלִי kann allgemein ein Gerät, Gefäß oder sonstiger Gegenstand sein. Die weite Wiedergabe vermeidet eine unbegründete Beschränkung auf Gefäße.
- source_word: תְּכַבֵּס
  choice: du … wäschst
  rationale: Die zweite Person Singular wird beibehalten; כבס bezeichnet hier das Waschen von Textilien beziehungsweise Materialien.
- source_word: הַנָּגַע
  choice: der Befall
  rationale: נגע bezeichnet hier die sichtbare schädliche Erscheinung am Material. „Befall“ ist sachgerecht, ohne eine bestimmte moderne Diagnose wie Schimmel festzulegen.
- source_word: וְסָר מֵהֶם הַנָּגַע
  choice: und der Befall daraus verschwindet
  rationale: סור bezeichnet das Weichen oder Verschwinden. „Daraus“ gibt den Bezug auf die zuvor aufgezählten Gegenstände natürlich wieder.
- source_word: וְכֻבַּס שֵׁנִית
  choice: soll das betreffende Stück ein zweites Mal gewaschen werden
  rationale: Die Passivform und die vorgeschriebene Wiederholung des Waschens werden bewahrt. „Das betreffende Stück“ nimmt die unterschiedlichen möglichen Bezugswörter verständlich zusammen.
- source_word: וְטָהֵר
  choice: dann ist es rein
  rationale: טהר bezeichnet im Kontext den kultisch reinen Zustand. „Rein“ bewahrt die kultische Begrifflichkeit; „dann“ verdeutlicht die Ergebnisfolge.
theological_decisions:
- issue: Bedeutung von טהר
  choice: rein
  alternative: sauber
  rationale: Der Vers steht in den Reinheitsbestimmungen des Levitikus. „Rein“ wahrt daher die kultische Dimension, während „sauber“ lediglich materielle Sauberkeit nahelegen könnte.
- issue: Verknüpfung von Waschen und Verschwinden des Befalls
  choice: wenn … gewaschen wird und der Befall verschwindet
  alternative: das gewaschen wird, sodass der Befall verschwindet
  rationale: Die hebräische Verknüpfung lässt den Befund nach dem Waschen folgen, ohne eindeutig eine kausale Wirkung des Waschens auszusagen. Die deutsche Fassung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Webereibegriffe werden präzise, aber ohne unnötige Fachsprache wiedergegeben. Die Umformung zum Wenn-Satz löst die im Deutschen schwer lesbare Reihung verschiedenartiger Bezugswörter und bewahrt zugleich den verfahrensbezogenen Sinn.
