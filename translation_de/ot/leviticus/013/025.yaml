  text: וְ/רָאָ֣ה אֹתָ֣/הּ הַ/כֹּהֵ֡ן וְ/הִנֵּ֣ה נֶהְפַּךְ֩ שֵׂעָ֨ר לָבָ֜ן בַּ/בַּהֶ֗רֶת וּ/מַרְאֶ֨/הָ֙ עָמֹ֣ק מִן הָ/ע֔וֹר צָרַ֣עַת הִ֔וא בַּ/מִּכְוָ֖ה פָּרָ֑חָה וְ/טִמֵּ֤א אֹת/וֹ֙ הַ/כֹּהֵ֔ן נֶ֥גַע צָרַ֖עַת הִֽוא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/025.yaml
  text: And the priest shall examine it[a], and behold, the hair in the bright spot has turned white and its appearance is deeper than the skin, it is a skin disease that has broken out in the burn scar; and the priest shall pronounce him unclean. It is an infection of skin disease.
translation:
  language: de
  text: Und der Priester soll die Stelle untersuchen; und siehe, das Haar auf dem hellen Fleck hat sich weiß verfärbt, und dieser erscheint tiefer als die Haut. Es ist eine Hautkrankheit[a], die in der Brandwunde ausgebrochen ist. Der Priester soll ihn für unrein erklären; es ist ein Befall mit einer Hautkrankheit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch tsaraʿat: Sammelbegriff für eine ernsthafte Hautveränderung; traditionell mit »Aussatz« wiedergegeben, aber nicht auf die heutige Hansen-Krankheit beschränkt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאָה
  choice: untersuchen
  rationale: Im Zusammenhang der priesterlichen Diagnose bezeichnet das Verb eine förmliche Begutachtung, nicht nur ein Sehen.
- source_word: בַּהֶרֶת
  choice: heller Fleck
  rationale: Die Bezeichnung meint eine sichtbar helle Hautveränderung; diese Wiedergabe bleibt konkret, ohne eine moderne Diagnose einzutragen.
- source_word: נֶהְפַּךְ שֵׂעָר לָבָן
  choice: das Haar ... hat sich weiß verfärbt
  rationale: Gibt den Zustandswechsel des Haares natürlich und genau wieder.
- source_word: מַרְאֶהָ עָמֹק מִן־הָעוֹר
  choice: dieser tiefer als die Haut erscheint
  rationale: Bewahrt die diagnostische Aussage über das sichtbare Erscheinungsbild der Stelle.
- source_word: צָרַעַת
  choice: Hautkrankheit
  rationale: Der hebräische Begriff bezeichnet eine breite kultisch-diagnostische Kategorie und darf nicht auf die moderne Hansen-Krankheit verengt werden.
- source_word: מִכְוָה
  choice: Brandwunde
  rationale: Das Wort bezeichnet hier die durch eine Verbrennung betroffene Stelle; „Brandwunde“ ist im Deutschen natürlich und lässt offen, wie weit sie bereits vernarbt ist.
- source_word: פָּרָחָה
  choice: ausgebrochen ist
  rationale: Im Zusammenhang von Hautveränderungen bezeichnet das Verb das Hervortreten oder Ausbrechen des Befalls.
- source_word: טִמֵּא אֹתוֹ
  choice: ihn für unrein erklären
  rationale: Der Priester fällt einen verbindlichen Reinheitsentscheid; er verursacht die Unreinheit nicht.
- source_word: נֶגַע צָרַעַת
  choice: ein Befall von Hautkrankheit
  rationale: „Befall“ gibt נגע als konkrete krankhafte Erscheinung wieder, während die ungewöhnliche Verbindung die hebräische Begriffsstruktur erkennen lässt.
- source_word: וְהִנֵּה
  choice: wenn sich nun
  rationale: Im deutschen Bedingungsgefüge führt die Wendung den bei der Untersuchung festgestellten Befund natürlich ein; das aufmerksamkeitslenkende Element wird durch „nun“ bewahrt.
theological_decisions:
- issue: Wiedergabe von צָרַעַת im Reinheitsgesetz
  choice: Hautkrankheit
  alternative: Aussatz; Lepra; aussätzige Krankheit
  rationale: צָרַעַת umfasst in Levitikus mehr als die moderne Hansen-Krankheit. „Hautkrankheit“ vermeidet eine anachronistische medizinische Festlegung und bewahrt den Zusammenhang kultischer Reinheit.
- issue: Funktion des priesterlichen Urteils
  choice: für unrein erklären
  alternative: unrein machen
  rationale: Die Formulierung stellt den priesterlichen Diagnose- und Urteilsspruch dar, ohne den Priester als Ursache der Unreinheit erscheinen zu lassen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die syntaktisch harte Folge des Hebräischen wurde als natürliches deutsches Bedingungsgefüge gestaltet. Die Fachsprache bleibt verständlich; kultische Unreinheit wird nicht mit moralischer Schuld gleichgesetzt.
