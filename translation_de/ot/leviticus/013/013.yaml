revisions:
- from: Und der Priester soll ihn untersuchen. Wenn sich zeigt, dass die Hautkrankheit seinen ganzen Körper bedeckt hat, soll er den Befallenen für rein erklären. Die Krankheit ist vollständig weiß geworden; er ist rein.
  to: Der Priester untersucht ihn. Hat die Hautkrankheit[a] seinen ganzen Körper bedeckt, erklärt er ihn[b] für rein. Ist er ganz weiß geworden, ist er rein.
  rationale: Die Überarbeitung bewahrt den juristisch-feststellenden Charakter des Verses und die etablierte Terminologie. Sie vermeidet zugleich eine nicht erforderliche Festlegung des mehrdeutigen hebräischen Rückbezugs in כֻּלּוֹ, indem sie die personenbezogene, im Deutschen natürliche Form „Ist er ganz weiß geworden“ verwendet. Die Fußnoten sichern die wichtigen lexikalischen und syntaktischen Informationen ab.
