  source_fidelity: Die Grundentscheidung für „Hautkrankheit“ und den deklarativen Reinheitsentscheid ist sachgerecht. Der Entwurf verschiebt jedoch die abschließende Aussage „alles/er ist weiß geworden“ zu stark auf „die Krankheit“. Das hebräische Suffix in כֻּלּוֹ kann im Kontext auf die betroffene Person bzw. deren Fleisch bezogen verstanden werden; die deutsche Fassung sollte diese Bezugsoffenheit nicht durch „Die Krankheit“ einengen.
  naturalness: Der vorgeschlagene Text ist verständlich, aber die Abfolge „Und der Priester soll ihn untersuchen. Wenn sich zeigt“ ist als isolierter Gesetzestext weniger nah am beobachtenden Befund des Hebräischen. Eine knappe konditionale Satzfolge ist modernes, natürliches Standarddeutsch.
  terminology: „Hautkrankheit“, „für rein erklären“ und „rein“ sind für den levitischen Reinheitskontext geeignet. „Den Befallenen“ ist zwar idiomatisch, verdeckt aber, dass הַנֶּגַע formal den Befall bzw. die Stelle bezeichnet; „ihn“ ist hier ebenso natürlich und weniger festlegend.
