  text: וְ/רָאָ֣ה הַ/כֹּהֵ֗ן וְ/הִנֵּ֨ה כִסְּתָ֤ה הַ/צָּרַ֨עַת֙ אֶת כָּל בְּשָׂר֔/וֹ וְ/טִהַ֖ר אֶת הַ/נָּ֑גַע כֻּלּ֛/וֹ הָפַ֥ךְ לָבָ֖ן טָה֥וֹר הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/013.yaml
  text: and the priest examines him[a], and behold, the skin disease has covered all his flesh, then he shall pronounce the affected person clean; all of it has turned white[b]; he is clean.
translation:
  language: de
  text: Der Priester untersucht ihn. Hat die Hautkrankheit[a] seinen ganzen Körper bedeckt, erklärt er ihn[b] für rein. Ist er ganz weiß geworden, ist er rein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch zaraʿat, traditionell oft „Aussatz“ oder „Lepra“ übersetzt. Der Begriff bezeichnet in Levitikus Hauterscheinungen und ist nicht mit der modernen Lepra gleichzusetzen.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht als Objekt „den Befall/die Erscheinung“; der priesterliche Reinheitsentscheid betrifft die Person, die davon betroffen ist.
    reason: source_language_clarification
lexical_decisions:
- source_word: וְרָאָה
  choice: soll untersuchen
  rationale: Im Zusammenhang der priesterlichen Begutachtung bezeichnet ראה nicht bloßes Sehen, sondern eine amtliche Untersuchung. Die Soll-Form entspricht dem deutschen Stil einer Rechtsvorschrift.
- source_word: הַצָּרַעַת
  choice: die Hautkrankheit
  rationale: צָרַעַת umfasst in Levitikus verschiedene Hauterscheinungen und darf nicht ohne Weiteres mit der modernen Hansen-Krankheit gleichgesetzt werden.
- source_word: אֶת כָּל בְּשָׂרוֹ
  choice: seinen ganzen Körper
  rationale: Wörtlich steht »sein ganzes Fleisch«; gemeint ist hier die gesamte sichtbare Körperoberfläche. »Seinen ganzen Körper« ist im Deutschen natürlich und sachgerecht.
- source_word: וְטִהַר
  choice: soll … für rein erklären
  rationale: Das Piel von טהר bezeichnet hier den priesterlichen Reinheitsentscheid, nicht einen Heilungs- oder Reinigungsvorgang.
- source_word: אֶת הַנָּגַע
  choice: den Befallenen
  rationale: נגע bezeichnet wörtlich den Befall beziehungsweise die krankhafte Erscheinung. Da der Reinheitsentscheid praktisch der betroffenen Person gilt, gibt »den Befallenen« den Sinn in natürlichem Deutsch wieder.
- source_word: כֻּלּוֹ הָפַךְ לָבָן
  choice: Die Krankheit ist vollständig weiß geworden
  rationale: כֻּלּוֹ betont die Vollständigkeit; der ergänzte Rückbezug »die Krankheit« macht den hebräischen Bezug im Deutschen verständlich.
- source_word: טָהוֹר הוּא
  choice: er ist rein
  rationale: »Rein« ist der übliche Ausdruck für den kultisch-rechtlichen Status in Levitikus; ein Zusatz wie »rituell« wäre erklärend statt übersetzend.
theological_decisions:
- issue: Bedeutung von צָרַעַת im Reinheitsrecht
  choice: Hautkrankheit
  alternative: Aussatz; Lepra; Hautbefall
  rationale: »Hautkrankheit« vermeidet die sachlich zu enge Gleichsetzung mit moderner Lepra, ohne eine konfessionelle oder medizinisch spekulative Deutung einzutragen.
- issue: Wirkung des priesterlichen Urteils וְטִהַר
  choice: für rein erklären
  alternative: reinigen; für rein befinden
  rationale: Der Priester bewirkt nicht die Heilung, sondern stellt den Reinheitsstatus verbindlich fest.
- issue: Bezugswort von אֶת הַנָּגַע
  choice: den Befallenen
  alternative: den Befall; die betroffene Stelle
  rationale: Der hebräische Ausdruck nennt formal den Befall, während der abschließende Satz »er ist rein« zeigt, dass das Urteil der betroffenen Person gilt. Die Übersetzung macht diesen Sinn transparent.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch im Stil einer verständlichen Rechtsvorschrift. Die traditionelle, aber irreführend enge Bezeichnung »Aussatz« wird vermieden. Keine Fußnoten sind nötig, da die wesentlichen semantischen Entscheidungen im Haupttext klar wiedergegeben werden.
