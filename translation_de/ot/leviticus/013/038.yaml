source:
  edition: WLC
  text: וְ/אִישׁ֙ אֽוֹ אִשָּׁ֔ה כִּֽי יִהְיֶ֥ה בְ/עוֹר בְּשָׂרָ֖/ם בֶּהָרֹ֑ת בֶּהָרֹ֖ת לְבָנֹֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/038.yaml
  text: And if a man or a woman has bright spots on the skin of the body[a], white bright spots,
translation:
  language: de
  text: Und wenn ein Mann oder eine Frau auf der Haut helle Flecken hat, weiße Flecken,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אִישׁ ... אִשָּׁה
  choice: ein Mann oder eine Frau
  rationale: Das ausdrücklich genannte Paar wird direkt wiedergegeben; der unbestimmte Singular entspricht dem kasuistischen Rechtsstil.
- source_word: כִּי יִהְיֶה
  choice: wenn ... hat
  rationale: כִּי leitet hier einen diagnostischen Fall ein. Die Besitzkonstruktion ist im Deutschen natürlicher als eine wörtliche Wiedergabe mit »da sein«.
- source_word: בְּעוֹר בְּשָׂרָם
  choice: auf der Haut
  rationale: עוֹר bezeichnet die Haut; בָּשָׂר bezeichnet hier den Körper beziehungsweise das Fleisch. Im heutigen Deutsch trägt »Haut« den körperlichen Bezug bereits eindeutig mit, während »Haut des Fleisches« unnatürlich wäre.
- source_word: בֶּהָרֹת
  choice: helle Flecken
  rationale: Das Substantiv bezeichnet in diesem diagnostischen Zusammenhang helle beziehungsweise auffällige Hautflecken. »Helle Flecken« ist klar und medizinisch neutral.
- source_word: בֶּהָרֹת לְבָנֹת
  choice: weiße Flecken
  rationale: לְבָנוֹת bestimmt die Farbe als weiß. Die erneute Nennung von »Flecken« bewahrt die auffällige hebräische Wiederholung, ohne im Deutschen die schwerfällige Formulierung »weiße helle Flecken« zu erzeugen.
theological_decisions: []
translation_notes:
  register: Moderne, sachliche und würdige Sprache für einen priesterlich-diagnostischen Rechtstext. Die Wiederholung des Substantivs bleibt erhalten; das Deutsche unterscheidet dabei idiomatisch zwischen »helle Flecken« und »weiße Flecken«.
