  text: וּ/בְ/י֨וֹם הֵרָא֥וֹת בּ֛/וֹ בָּשָׂ֥ר חַ֖י יִטְמָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/014.yaml
  text: But on the day living flesh appears in it, he shall be unclean.
translation:
  language: de
  text: Doch an dem Tag, an dem an ihm lebendiges Fleisch sichtbar wird, gilt er als unrein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְיוֹם
  choice: Doch an dem Tag
  rationale: Die Verbindung aus וּ und der Zeitangabe markiert hier den Gegensatz zum vorherigen Fall; „doch“ gibt diesen Zusammenhang natürlich wieder.
- source_word: הֵרָאוֹת
  choice: an dem sich … zeigt
  rationale: Der Niphal-Infinitiv von ראה bezeichnet das Sichtbarwerden beziehungsweise Erscheinen.
- source_word: בּוֹ
  choice: darin
  rationale: Das maskuline Suffix kann sich im Zusammenhang auf den betroffenen Befund beziehungsweise die Hautveränderung beziehen; „darin“ bewahrt diesen sachlichen Rückbezug, ohne ihn unnötig zu konkretisieren.
- source_word: בָּשָׂר חַי
  choice: lebendes Fleisch
  rationale: Die formnahe Wiedergabe bewahrt den medizinisch-kultischen Ausdruck für sichtbar gewordenes, nicht weiß verfärbtes beziehungsweise rohes Fleisch.
- source_word: יִטְמָא
  choice: ist er unrein
  rationale: Das Verb bezeichnet hier den festgestellten kultischen Status. Im Deutschen formuliert das Präsens die geltende Folge klar und natürlich.
theological_decisions:
- issue: Art der Unreinheit
  choice: unrein
  alternative: kultisch unrein
  rationale: Der Grundtext verwendet den etablierten Reinheitsbegriff ohne ausdrückliche Zusatzbestimmung. Die schlichte Wiedergabe vermeidet eine erklärende Einengung im Haupttext.
- issue: Bezug von בּוֹ
  choice: darin
  alternative: an ihm
  rationale: Der unmittelbare Kontext erlaubt einen Bezug auf den beschriebenen Hautbefund; „darin“ wahrt diesen Bezug und vermeidet die Festlegung auf die Person als Ort des Erscheinens.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch; knapp und gesetzesartig. Die Wiederholung „an dem Tag, an dem“ ist idiomatisch und bildet die hebräische Zeitkonstruktion verständlich ab.
