source:
  edition: WLC
  text: כָּל יְמֵ֞י אֲשֶׁ֨ר הַ/נֶּ֥גַע בּ֛/וֹ יִטְמָ֖א טָמֵ֣א ה֑וּא בָּדָ֣ד יֵשֵׁ֔ב מִ/ח֥וּץ לַֽ/מַּחֲנֶ֖ה מוֹשָׁבֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/046.yaml
  text: All the days that the disease is in him[a], he shall be unclean. He is unclean. He shall live alone[b]; his dwelling shall be outside the camp.
translation:
  language: de
  text: Solange die krankhafte Erscheinung an ihm besteht[a], soll er unrein sein[b]. Er ist unrein. Allein soll er wohnen; sein Wohnort soll außerhalb des Lagers sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Plage«, »das Leiden« oder »die Krankheit«. Das hebräische Wort ist weit gefasst und bezeichnet hier den in diesem Kapitel untersuchten Befund.'
    reason: lexical_alternative
  - marker: b
    text: »Unrein« bezeichnet hier den Status nach dem levitischen Gesetz, nicht notwendigerweise moralische Schuld.
    reason: cultural_note
lexical_decisions:
- source_word: הַנֶּגַע
  choice: das Leiden
  rationale: נֶגַע bezeichnet allgemein eine Plage, Schädigung oder krankhafte Erscheinung. »Leiden« bewahrt diese Bedeutungsbreite, ohne vorschnell eine moderne medizinische Diagnose festzulegen.
- source_word: בּוֹ
  choice: an ihm
  rationale: Die Präposition kann hier »an/in ihm« bedeuten. Bei einer am Körper festgestellten Erscheinung ist »an ihm« im Deutschen natürlich und bleibt nah am Hebräischen.
- source_word: יִטְמָא
  choice: soll er unrein sein
  rationale: Das Imperfekt hat in dieser Rechtsbestimmung normativen Charakter; »soll … sein« gibt diesen wieder, ohne »unrein« interpretierend zu erweitern.
- source_word: טָמֵא הוּא
  choice: Er ist unrein
  rationale: Der selbstständige Nominalsatz bekräftigt nachdrücklich den Status und wird deshalb als eigener kurzer Satz erhalten.
- source_word: בָּדָד
  choice: abgesondert
  rationale: בָּדָד meint allein beziehungsweise getrennt von anderen. »Abgesondert« verdeutlicht hier die angeordnete Trennung, ohne klinische Terminologie einzuführen.
- source_word: יֵשֵׁב
  choice: soll er wohnen
  rationale: ישב kann sitzen, bleiben oder wohnen bedeuten. Im Zusammenhang mit dem anschließenden Wohnort ist »wohnen« die natürliche deutsche Entsprechung.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: außerhalb des Lagers
  rationale: Die Wendung bezeichnet den Bereich jenseits des israelitischen Lagers und wird direkt und traditionsverständlich wiedergegeben.
- source_word: מוֹשָׁבוֹ
  choice: sein Wohnort
  rationale: מוֹשָׁב bezeichnet hier den Ort des Wohnens. »Wohnort« erhält die konkrete räumliche Aussage und vermeidet altertümliches Deutsch.
theological_decisions:
- issue: Art der Unreinheit in Levitikus 13
  choice: Im Haupttext steht schlicht »unrein«.
  alternative: »kultisch unrein« oder »rituell unrein«
  rationale: טמא benennt den Status nach dem levitischen Gesetz, sagt hier aber nicht ausdrücklich »kultisch« oder »rituell«. Die unqualifizierte Wiedergabe bewahrt die biblische Kategorie; die Fußnote verhindert zugleich eine vorschnelle Gleichsetzung mit moralischer Schuld.
- issue: Bedeutungsumfang von נֶגַע
  choice: »Leiden« mit lexikalischer Fußnote
  alternative: »Krankheit«, »Plage« oder »krankhafte Erscheinung«
  rationale: Der hebräische Ausdruck ist breiter als eine präzise moderne Krankheitsbezeichnung. Die gewählte Formulierung hält diese Offenheit aus und bleibt im Kontext verständlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die emphatische Wiederholung »unrein« und die räumliche Schlusswendung des Hebräischen bleiben erhalten. »Abgesondert« ist verständlich, ohne den anachronistisch-klinischen Klang von »in Isolation«.
