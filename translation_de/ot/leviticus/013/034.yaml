source:
  edition: WLC
  text: וְ/רָאָה֩ הַ/כֹּהֵ֨ן אֶת הַ/נֶּ֜תֶק בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֗י וְ֠/הִנֵּה לֹא פָשָׂ֤ה הַ/נֶּ֨תֶק֙ בָּ/ע֔וֹר וּ/מַרְאֵ֕/הוּ אֵינֶ֥/נּוּ עָמֹ֖ק מִן הָ/ע֑וֹר וְ/טִהַ֤ר אֹת/וֹ֙ הַ/כֹּהֵ֔ן וְ/כִבֶּ֥ס בְּגָדָ֖י/ו וְ/טָהֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/034.yaml
  text: Then the priest shall examine the scaly infection on the seventh day[a], and if the scaly infection has not spread in the skin and its appearance is not deeper than the skin, the priest shall pronounce him clean[c][b]. He shall wash his clothes and be clean.
translation:
  language: de
  text: Am siebten Tag soll der Priester die Grindstelle untersuchen.[a] Wenn sich die Grindstelle nicht auf der Haut ausgebreitet hat und nicht tiefer als die Haut erscheint,[b] soll der Priester ihn für rein erklären.[c] Er soll seine Kleider waschen; dann ist er rein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet eine besondere Erkrankung im behaarten Bereich von Kopf oder Bart; traditionell wird es auch mit „Grind“ oder „Kopfgrind“ wiedergegeben. Eine genaue moderne Diagnose ist nicht möglich.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „ihr Aussehen ist nicht tiefer als die Haut“. Gemeint ist, dass die Stelle nicht eingesunken unter der umgebenden Haut erscheint.'
    reason: cultural_note
  - marker: c
    text: Der Priester heilt die Erkrankung hier nicht, sondern stellt amtlich fest, dass der Betroffene als rein gilt.
    reason: alternative_reading
lexical_decisions:
- source_word: נֶתֶק
  choice: Grindstelle
  rationale: Das Wort bezeichnet in diesem Abschnitt eine besondere Erkrankung im behaarten Bereich von Kopf oder Bart. „Grindstelle“ ist im Deutschen konkreter als „Hautkrankheit“, ohne eine moderne medizinische Diagnose festzulegen.
- source_word: פָשָׂה
  choice: sich … ausgebreitet hat
  rationale: Im Zusammenhang der priesterlichen Untersuchung bezeichnet das Verb die weitere Ausbreitung der betroffenen Stelle.
- source_word: בָּעוֹר
  choice: auf der Haut
  rationale: Natürliches modernes Deutsch für die Ausbreitung über den sichtbaren Hautbereich; die räumliche Beziehung des Hebräischen bleibt erhalten.
- source_word: מַרְאֵהוּ אֵינֶנּוּ עָמֹק מִן הָעוֹר
  choice: nicht tiefer als die Haut erscheint
  rationale: Die Formulierung bewahrt sowohl den visuellen Charakter von מַרְאֵהוּ als auch das diagnostische Kriterium einer scheinbaren Vertiefung.
- source_word: וְטִהַר אֹתוֹ הַכֹּהֵן
  choice: soll der Priester ihn für rein erklären
  rationale: Das Hifil von טהר bezeichnet hier das amtliche Reinheitsurteil des Priesters, nicht eine medizinische Heilung.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: Er soll seine Kleider waschen
  rationale: „Kleider“ ist eine natürliche und zugleich würdige Wiedergabe des rituellen Waschens seiner Kleidung.
- source_word: וְטָהֵר
  choice: dann ist er rein
  rationale: Die Formulierung gibt den nach dem Waschen eintretenden beziehungsweise bestätigten Reinheitsstatus knapp und verständlich wieder.
- source_word: וְרָאָה
  choice: soll … untersuchen
  rationale: Das Sehen ist hier eine förmliche priesterliche Begutachtung; „untersuchen“ macht diese Funktion deutlich.
- source_word: וְהִנֵּה
  choice: Wenn
  rationale: In der Untersuchungsformel leitet וְהִנֵּה den festgestellten Befund ein. Ein deutscher Bedingungssatz gibt die syntaktische Funktion natürlich wieder.
theological_decisions:
- issue: Art der priesterlichen Handlung im Reinheitsrecht
  choice: Der Priester erklärt den Betroffenen amtlich für rein.
  alternative: Der Priester reinigt ihn.
  rationale: Im gesetzlichen Zusammenhang stellt der Priester den kultischen Status fest; der Text schreibt ihm weder eine medizinische Heilung noch eine eigenständig bewirkte innere Reinigung zu.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit gesetzlich-feierlichem Ton. Die Satzstruktur bleibt nah am hebräischen Untersuchungsablauf, wird aber durch einen natürlichen deutschen Bedingungssatz geglättet. Medizinische Überpräzision und konfessionelle Deutungen werden vermieden.
