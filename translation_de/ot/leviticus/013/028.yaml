  text: וְ/אִם תַּחְתֶּי/הָ֩ תַעֲמֹ֨ד הַ/בַּהֶ֜רֶת לֹא פָשְׂתָ֤ה בָ/עוֹר֙ וְ/הִ֣וא כֵהָ֔ה שְׂאֵ֥ת הַ/מִּכְוָ֖ה הִ֑וא וְ/טִֽהֲר/וֹ֙ הַ/כֹּהֵ֔ן כִּֽי צָרֶ֥בֶת הַ/מִּכְוָ֖ה הִֽוא־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/028.yaml
  text: But if the bright spot remains in its place and has not spread in the skin[a], and it is faded, it is the swelling from the burn, and the priest shall pronounce him clean, for it is the scar of the burn.
translation:
  language: de
  text: Wenn aber der helle Fleck an derselben Stelle bleibt[a], sich nicht auf der Haut ausgebreitet hat und verblasst ist, dann ist er eine Schwellung infolge der Verbrennung. Der Priester soll ihn für rein erklären, denn er ist die Narbe der Verbrennung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der helle Fleck bleibt unter ihr stehen“. Gemeint ist offenbar, dass der Fleck an derselben Stelle bleibt und sich nicht ausbreitet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחְתֶּיהָ תַעֲמֹד
  choice: an seiner Stelle bleibt
  rationale: Die wörtliche Wendung „unter ihr steht“ bezeichnet im diagnostischen Zusammenhang, dass der helle Fleck an Ort und Stelle bleibt; die ungewöhnliche Bildlichkeit wird in einer Fußnote bewahrt.
- source_word: הַבַּהֶרֶת
  choice: der helle Fleck
  rationale: Der Ausdruck bezeichnet in Levitikus 13 eine sichtbare helle Verfärbung der Haut; „heller Fleck“ ist klar und kontextgerecht.
- source_word: לֹא פָשְׂתָה בָעוֹר
  choice: sich nicht auf der Haut ausgebreitet hat
  rationale: פשט ist der diagnostische Ausdruck für das Ausbreiten eines Hautbefunds; deutsches „auf der Haut“ klingt hier natürlicher als „in der Haut“.
- source_word: כֵהָה
  choice: verblasst
  rationale: Das Wort beschreibt eine verminderte Helligkeit oder Auffälligkeit des Flecks; „verblasst“ gibt dies natürlich wieder.
- source_word: שְׂאֵת הַמִּכְוָה
  choice: eine Schwellung von der Verbrennung
  rationale: שׂאת bezeichnet hier eine Erhebung beziehungsweise Schwellung; die Formulierung wahrt den Bezug zur Brandverletzung.
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: Der Priester soll ihn für rein erklären
  rationale: Im Kontext der priesterlichen Untersuchung bezeichnet טהר eine Reinsprechung, nicht eine tatsächliche Reinigungshandlung.
- source_word: צָרֶבֶת הַמִּכְוָה
  choice: die Narbe der Verbrennung
  rationale: צָרֶבֶת bezeichnet den zurückbleibenden Brandfleck beziehungsweise die Narbe; „Narbe“ ist verständlich und medizinisch passend.
theological_decisions:
- issue: Bedeutung von „rein“
  choice: für rein erklären
  alternative: reinigen
  rationale: Der Priester stellt den Reinheitsstatus aufgrund der Untersuchung fest; der Vers beschreibt keine kultische oder körperliche Reinigungshandlung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlicher diagnostischer Sprache. Der Satzbau folgt dem hebräischen Bedingungs- und Begründungsgefüge, wird jedoch für natürliche deutsche Lesbarkeit gegliedert.
