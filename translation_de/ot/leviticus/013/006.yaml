base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/006.yaml
  text: Then the priest shall examine him again on the seventh day[a], and if the infection has faded and the infection has not spread in the skin, the priest shall pronounce him clean; it is a scaly eruption. He shall wash his clothes and be clean.
translation:
  language: de
  text: Wenn der Priester ihn am siebten Tag erneut untersucht und feststellt, dass die betroffene Stelle verblasst ist und sich auf der Haut nicht ausgebreitet hat, soll der Priester ihn für rein erklären. Es ist ein Ausschlag[a]. Er soll seine Kleider waschen, und er ist rein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine schuppige Hautveränderung“. Das hebräische Wort bezeichnet offenbar eine begrenzte Hauterscheinung; im Zusammenhang steht sie einer sich ausbreitenden Hautveränderung gegenüber.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: soll … untersuchen
  rationale: Im Zusammenhang der priesterlichen Begutachtung bezeichnet ראה eine amtliche Untersuchung, nicht nur ein bloßes Sehen.
- source_word: שֵׁנִית
  choice: noch einmal
  rationale: Das Adverb bezeichnet die wiederholte Untersuchung und wird so in natürlichem modernem Deutsch wiedergegeben.
- source_word: כֵּהָה
  choice: verblasst ist
  rationale: Das Wort beschreibt, dass die sichtbare Hautveränderung schwächer oder weniger deutlich geworden ist.
- source_word: הַנֶּגַע
  choice: die betroffene Stelle
  rationale: נגע bezeichnet hier die beobachtete Hautveränderung. Diese Wiedergabe bleibt verständlich, ohne vorschnell eine moderne medizinische Diagnose wie „Infektion“ festzulegen.
- source_word: פָשָׂה
  choice: sich … nicht ausgebreitet hat
  rationale: Im Kontext der Hautbefunde bedeutet das Verb eine flächenmäßige Ausbreitung.
- source_word: בָּעוֹר
  choice: auf der Haut
  rationale: עור bedeutet „Haut“; im Deutschen ist bei der sichtbaren Ausbreitung einer Hautveränderung „auf der Haut“ idiomatisch.
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: soll der Priester ihn für rein erklären
  rationale: Das Piel von טהר bezeichnet hier das autoritative Reinheitsurteil des Priesters, nicht eine körperliche Heilung oder Reinigung durch ihn.
- source_word: מִסְפַּחַת
  choice: Ausschlag
  rationale: Der seltene Ausdruck bezeichnet offenbar eine begrenzte, weniger schwerwiegende Hauterscheinung; „Ausschlag“ ist verständlich, ohne unnötige medizinische Präzision vorzutäuschen.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: Er soll seine Kleider waschen
  rationale: Die Formulierung gibt die vorgeschriebene Handlung direkt und in modernem Deutsch wieder.
- source_word: וְטָהֵר
  choice: dann ist er rein
  rationale: Der abschließende Ausdruck bezeichnet den nach dem Waschen geltenden rituellen Reinheitsstatus.
theological_decisions:
- issue: Rituelles Reinheitsurteil oder körperliche Heilung
  choice: „für rein erklären“ und abschließend „ist er rein“
  alternative: „ihn reinigen“ oder „er ist geheilt“
  rationale: Der Vers beschreibt die priesterliche Feststellung des rituellen Status. Er behauptet nicht, dass der Priester den Betroffenen körperlich heilt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „die betroffene Stelle“ wird zugunsten eines flüssigen Satzes teilweise durch ein Reflexivpronomen aufgenommen. Medizinisch festlegende Begriffe werden vermieden, während der rechtlich-rituelle Charakter der priesterlichen Entscheidung klar bleibt.
