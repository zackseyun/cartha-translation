  naturalness: Der Entwurf ist insgesamt klares modernes Standarddeutsch. Eine ausdrückliche Benennung des gewaschenen und verbrannten Gegenstands verbessert jedoch die Kohärenz der Bezüge. „Es handelt sich um“ verhindert zudem, dass „es“ fälschlich den Gegenstand als „Schadstelle“ prädiziert.
  terminology: „unrein“ bewahrt die kultisch-rechtliche Kategorie angemessen. „zerfressende Schadstelle“ ist als vorsichtige Wiedergabe von פְּחֶתֶת möglich. Die Fußnoten erläutern die semantischen Unsicherheiten sachgerecht.
