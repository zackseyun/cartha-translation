  text: וְ/רָאָ֨ה הַ/כֹּהֵ֜ן אַחֲרֵ֣י הֻכַּבֵּ֣ס אֶת הַ/נֶּ֗גַע וְ֠/הִנֵּה לֹֽא הָפַ֨ךְ הַ/נֶּ֤גַע אֶת עֵינ/וֹ֙ וְ/הַ/נֶּ֣גַע לֹֽא פָשָׂ֔ה טָמֵ֣א ה֔וּא בָּ/אֵ֖שׁ תִּשְׂרְפֶ֑/נּוּ פְּחֶ֣תֶת הִ֔וא בְּ/קָרַחְתּ֖/וֹ א֥וֹ בְ/גַבַּחְתּֽ/וֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/055.yaml
  text: Then the priest shall examine it after the diseased area has been washed[a], and if the diseased area has not changed its appearance and the diseased area has not spread, it is unclean. You shall burn it in the fire; it is a corrosive spot[c][b], whether on its worn side or on its bare side.
translation:
  language: de
  text: Dann soll der Priester den Befall untersuchen, nachdem der betroffene Gegenstand gewaschen worden ist. Wenn der Befall sein Aussehen nicht verändert hat[a] und sich nicht ausgebreitet hat, ist er unrein. Du sollst den Gegenstand im Feuer verbrennen. Es handelt sich um eine zerfressende Schadstelle[b], sei es auf seiner Rückseite oder auf seiner Vorderseite[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „sein Auge nicht verändert hat“; gemeint ist das sichtbare Erscheinungsbild, möglicherweise besonders die Farbe.'
    reason: lexical_alternative
  - marker: b
    text: Das seltene hebräische Wort kann auch als „zerfressender Befall“ wiedergegeben werden. Es bezeichnet offenbar eine zerstörerische Schädigung des Materials.
    reason: lexical_alternative
  - marker: c
    text: Der hebräische Ausdruck ist schwierig. Wörtlich stehen hier Wörter für die „Kahlstelle“ und die „kahle Stirn“. Im Zusammenhang bezeichnen sie wahrscheinlich zwei Seiten oder Flächen des betroffenen Materials; die genaue Zuordnung ist unsicher.
    reason: textual_or_semantic_difficulty
lexical_decisions:
- source_word: וְרָאָה
  choice: Dann soll ... untersuchen
  rationale: ראה bezeichnet in diesem priesterlichen Prüfverfahren nicht bloß das Sehen, sondern die sachkundige Untersuchung; „dann“ gibt die fortlaufende Anweisung natürlich wieder.
- source_word: הַנֶּגַע
  choice: die befallene Stelle / der Befall
  rationale: נגע bezeichnet hier die betroffene Schadstelle beziehungsweise den Befall am Material, ohne eine moderne medizinische Diagnose festzulegen.
- source_word: אַחֲרֵי הֻכַּבֵּס
  choice: nachdem sie gewaschen worden ist
  rationale: Die passive Form von כבס besagt, dass die betroffene Stelle beziehungsweise das Material gewaschen wurde.
- source_word: לֹא הָפַךְ ... אֶת עֵינוֹ
  choice: ihr Aussehen nicht verändert hat
  rationale: Die wörtliche Wendung „sein Auge nicht verändert“ bezieht sich auf das sichtbare Erscheinungsbild; möglicherweise ist besonders die Farbe gemeint.
- source_word: לֹא פָשָׂה
  choice: sich nicht ausgebreitet hat
  rationale: פשה bezeichnet in den Befundvorschriften von Levitikus 13 das weitere Ausbreiten eines Befalls.
- source_word: טָמֵא הוּא
  choice: ist sie unrein
  rationale: „Unrein“ ist die angemessene kultische Kategorie und bewahrt die knappe Feststellung des Hebräischen.
- source_word: בָּאֵשׁ תִּשְׂרְפֶנּוּ
  choice: Du sollst den Gegenstand im Feuer verbrennen
  rationale: Die zweite Person Singular wird als direkte Rechtsanweisung wiedergegeben; „den Gegenstand“ verdeutlicht den im Kontext vorausgesetzten Bezug des Pronomens.
- source_word: פְּחֶתֶת
  choice: eine zerfressende Schadstelle
  rationale: Das seltene Wort bezeichnet offenbar eine zerstörerische, in das Material eindringende Schädigung; die Übersetzung vermeidet eine unbelegte moderne Diagnose.
- source_word: בְּקָרַחְתּוֹ א֥וֹ בְגַבַּחְתּוֹ
  choice: auf seiner Rückseite oder auf seiner Vorderseite
  rationale: Die beiden wörtlich aus Bezeichnungen für kahle Kopfpartien gebildeten Wörter werden im Sachzusammenhang wahrscheinlich auf zwei Seiten beziehungsweise Flächen des Materials übertragen; wegen der Unsicherheit wird dies in einer Fußnote offengelegt.
theological_decisions:
- issue: Bedeutung von טָמֵא im Reinheitsrecht
  choice: unrein
  alternative: verunreinigt / verseucht
  rationale: „Unrein“ bezeichnet die im Text ausgesprochene kultisch-rechtliche Einstufung, ohne sie mit moralischer Schuld oder einer bestimmten naturwissenschaftlichen Diagnose gleichzusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit verständlicher Rechtssprache. Die knappe Abfolge der Untersuchung, Einstufung und Verbrennungsanweisung bleibt erhalten. Seltene Fachbegriffe werden nicht durch eine moderne Diagnose ersetzt; die Unsicherheit der Schlusswendung wird ausdrücklich markiert.
