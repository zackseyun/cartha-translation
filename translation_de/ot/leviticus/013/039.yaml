base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/039.yaml
  text: and the priest examines, and behold, on the skin of their flesh there are dull white spots, it is a harmless rash that has broken out on the skin; he is clean.
translation:
  language: de
  text: Stellt der Priester bei der Untersuchung auf ihrer Haut blassweiße Flecken fest, ist es ein Hautausschlag[a], der auf der Haut ausgebrochen ist; die betreffende Person ist rein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eine Hauterscheinung« beziehungsweise »ein heller Hautfleck«. Das hebräische Wort bezeichnet eine Hautveränderung, die im Unterschied zu den zuvor behandelten Fällen nicht unrein macht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: soll sie untersuchen
  rationale: Im Zusammenhang der priesterlichen Begutachtung bezeichnet ראה nicht nur ein Sehen, sondern ein prüfendes Untersuchen. Die Soll-Form entspricht dem Charakter der Verfahrensanweisung.
- source_word: בְעוֹר בְּשָׂרָם
  choice: auf ihrer Haut
  rationale: Das Deutsche gibt die konkrete Körperbezeichnung natürlich wieder; „Haut ihres Fleisches“ wäre unnötig schwerfällig.
- source_word: בֶּהָרֹת כֵּהוֹת לְבָנֹת
  choice: blassweiße Flecken
  rationale: כֵּהוֹת bezeichnet eine abgeschwächte, matte oder blasse Färbung; „blassweiß“ wahrt den Gegensatz zu auffällig hellen Hautveränderungen.
- source_word: בֹּהַק
  choice: Hautausschlag
  rationale: Der seltene Ausdruck bezeichnet hier eine Hauterscheinung, die nicht zur Unreinheit führt. Die Fußnote bewahrt die lexikalische Unschärfe, ohne im Haupttext medizinische Genauigkeit vorzutäuschen.
- source_word: פָּרַח
  choice: ausgebrochen ist
  rationale: Bei Hauterscheinungen bedeutet פרח idiomatisch, dass etwas auf der Haut hervortritt oder ausbricht.
- source_word: טָהוֹר הוּא
  choice: die betreffende Person ist rein
  rationale: „Rein“ bewahrt den kultisch-rechtlichen Statusbegriff. Die geschlechtsneutrale Formulierung nimmt den maskulinen Singular als generischen Rückbezug auf die untersuchte Person.
theological_decisions:
- issue: Art des priesterlichen Urteils
  choice: „rein“ als kultisch-rechtliches Urteil
  alternative: „gesund“ oder „medizinisch unbedenklich“
  rationale: טָהוֹר bezeichnet in diesem Zusammenhang den Reinheitsstatus, nicht moralische Reinheit, Heilung oder eine moderne medizinische Diagnose.
- issue: Bewertung von בֹּהַק
  choice: Neutrale Bezeichnung im Haupttext mit erklärender Fußnote
  alternative: „harmloser Ausschlag“
  rationale: „Harmlos“ würde eine umfassende medizinische Bewertung hinzufügen. Der Text stellt lediglich fest, dass diese Erscheinung nicht unrein macht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der deiktische Ausdruck וְהִנֵּה wird nicht mechanisch mit „siehe“ wiedergegeben, sondern in die natürliche deutsche Befundformel „Zeigen sich …“ integriert. Der Numeruswechsel vom pluralischen „ihrer“ zum singularischen Reinheitsurteil bleibt sinngemäß erhalten.
