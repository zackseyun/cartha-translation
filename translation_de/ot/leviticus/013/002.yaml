source:
  edition: WLC
  text: אָדָ֗ם כִּֽי יִהְיֶ֤ה בְ/עוֹר בְּשָׂר/וֹ֙ שְׂאֵ֤ת אֽוֹ סַפַּ֨חַת֙ א֣וֹ בַהֶ֔רֶת וְ/הָיָ֥ה בְ/עוֹר בְּשָׂר֖/וֹ לְ/נֶ֣גַע צָרָ֑עַת וְ/הוּבָא֙ אֶל אַהֲרֹ֣ן הַ/כֹּהֵ֔ן א֛וֹ אֶל אַחַ֥ד מִ/בָּנָ֖י/ו הַ/כֹּהֲנִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/002.yaml
  text: When a man has on the skin of his body a swelling[a], or a scab, or a bright spot, and it becomes on the skin of his body an infection of skin disease, then he shall be brought to Aaron the priest, or to one of his sons the priests.
translation:
  language: de
  text: Wenn sich bei einem Menschen auf der Haut seines Körpers eine Schwellung, eine schorfige Stelle oder ein heller Fleck bildet und daraus auf der Haut seines Körpers ein Befall mit einer Hautkrankheit[a] entsteht, soll er zu Aaron, dem Priester, oder zu einem seiner Söhne, den Priestern, gebracht werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: „Aussatz“ oder „Lepra“. Das hebräische Wort צָרָעַת bezeichnet eine weiter gefasste Kategorie von Hautleiden und ist nicht ohne Weiteres mit der heutigen Hansen-Krankheit gleichzusetzen.'
    reason: Bewahrt die traditionelle Übersetzung als Alternative und verhindert zugleich eine anachronistische medizinische Festlegung.
lexical_decisions:
- source_word: אָדָם
  choice: ein Mensch
  rationale: Das Substantiv bezeichnet hier in einer allgemeinen Fallregel eine einzelne Person. „Ein Mensch“ bewahrt den generischen Sinn, ohne das im Hebräischen nicht ausdrücklich markierte Geschlecht festzulegen.
- source_word: בְּעוֹר בְּשָׂרוֹ
  choice: auf der Haut seines Körpers
  rationale: Die Formulierung gibt die konkrete anatomische Wendung und ihre Wiederholung wieder; „Körper“ ist im heutigen Deutsch natürlicher als das hier missverständliche „Fleisch“.
- source_word: שְׂאֵת
  choice: eine Schwellung
  rationale: Das Wort bezeichnet eine erhöhte Hautstelle; „Schwellung“ ist verständlich und vermeidet eine zu genaue moderne Diagnose.
- source_word: סַפַּחַת
  choice: eine schorfige Stelle
  rationale: Die genaue Art der Hautveränderung ist unsicher. Die Formulierung bewahrt den konkreten, sichtbaren Charakter und klingt natürlicher als das traditionelle „Grind“.
- source_word: בַּהֶרֶת
  choice: ein heller Fleck
  rationale: Gemeint ist eine auffallend helle oder glänzende Hautstelle. „Heller Fleck“ bleibt hinreichend weit und legt weder Farbe noch Diagnose unnötig fest.
- source_word: לְנֶגַע צָרָעַת
  choice: ein Befall durch eine Hautkrankheit
  rationale: נֶגַע bezeichnet einen Befall beziehungsweise ein Krankheitsmal, צָרָעַת eine biblische Krankheitskategorie, die nicht ohne Weiteres mit moderner Lepra gleichgesetzt werden darf. Die Wiedergabe bleibt verständlich, ohne eine konkrete Diagnose zu behaupten.
- source_word: וְהוּבָא
  choice: soll er … gebracht werden
  rationale: Die passive deutsche Soll-Form gibt den verbindlichen Verfahrenscharakter der hebräischen Rechtsanweisung wieder.
- source_word: אַחַד מִבָּנָיו הַכֹּהֲנִים
  choice: einem seiner Söhne, den Priestern
  rationale: Die appositionelle Formulierung erhält sowohl das Verwandtschaftsverhältnis als auch das Priesteramt der Söhne.
theological_decisions:
- issue: Bedeutung von צָרָעַת
  choice: Hautkrankheit
  alternative: Aussatz; Lepra; Zaraat
  rationale: צָרָעַת bezeichnet im biblischen Kontext eine umfassendere kultisch zu beurteilende Krankheits- oder Befallskategorie und nicht eindeutig die moderne Hansen-Krankheit. „Hautkrankheit“ vermeidet eine irreführende medizinische Gleichsetzung; die traditionelle Wiedergabe bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Rechtssprache. Die sichtbaren Hautmerkmale werden konkret, aber ohne spekulative moderne Diagnosen bezeichnet; die wiederholte Körperangabe und die passive Verfahrensanweisung des Hebräischen bleiben erhalten.
