base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/057.yaml
  text: But if it appears again in the garment[a], or in the warp, or in the woof, or in any article of leather, it is a spreading outbreak[b]; you shall burn in the fire whatever has the infection in it.
translation:
  language: de
  text: Wenn die befallene Stelle aber wieder an dem Kleidungsstück, am Kettfaden oder am Schussfaden oder an irgendeinem Gegenstand aus Leder sichtbar wird, breitet sie sich aus. Den Gegenstand, an dem sich die befallene Stelle befindet, sollst du im Feuer verbrennen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֵּרָאֶה עוֹד
  choice: wieder … sichtbar wird
  rationale: Das Nifal von ראה bezeichnet hier das erneute Sichtbarwerden bei der Untersuchung; עוֹד hat im Ablauf den Sinn „wieder“.
- source_word: בֶּגֶד
  choice: Kleidungsstück
  rationale: Der Ausdruck kann Kleidung oder Stoff bezeichnen; „Kleidungsstück“ passt zum Gegenstandsbezug des Abschnitts, ohne eine bestimmte Art festzulegen.
- source_word: שְׁתִי
  choice: Kettfaden
  rationale: Technischer Webbegriff für die längs verlaufenden Fäden; bildet das sachgemäße Paar mit „Schussfaden“.
- source_word: עֵרֶב
  choice: Schussfaden
  rationale: Technischer Webbegriff für die quer durch die Kette geführten Fäden.
- source_word: כְּלִי עוֹר
  choice: Gegenstand aus Leder
  rationale: Die breite Wendung bezeichnet einen aus Haut beziehungsweise Leder gefertigten Gebrauchsgegenstand.
- source_word: פֹּרַחַת הִוא
  choice: breitet sie sich aus
  rationale: פרח bedeutet wörtlich „sprossen/aufblühen“ und bezeichnet hier bildlich das erneute Hervortreten beziehungsweise Umsichgreifen der Stelle.
- source_word: בָּאֵשׁ תִּשְׂרְפֶנּוּ
  choice: sollst du im Feuer verbrennen
  rationale: Bewahrt die direkte gesetzliche Anweisung in der zweiten Person Singular und die ausdrückliche Nennung des Feuers.
- source_word: אֵת אֲשֶׁר בּוֹ הַנָּגַע
  choice: Was von der befallenen Stelle betroffen ist
  rationale: Gibt den Gegenstand wieder, an beziehungsweise in dem sich der Befall befindet, ohne נגע als moderne medizinische Diagnose festzulegen.
- source_word: הַנָּגַע
  choice: die befallene Stelle
  rationale: נגַע ist in Levitikus 13 ein technischer Ausdruck für eine auffällige, verunreinigende Schadstelle; die Wiedergabe vermeidet sowohl „Seuche“ als auch eine ungesicherte Diagnose.
