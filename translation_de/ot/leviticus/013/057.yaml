  source_fidelity: 'Der erste Satz gibt das erneute Sichtbarwerden (תראה עוד), die Gegenstandsgruppen und den sich ausbreitenden Charakter von פרחת zutreffend wieder. Im zweiten Satz ist jedoch „Was von der befallenen Stelle betroffen ist“ weiter und semantisch verschoben: אֵת אֲשֶׁר בּוֹ הַנָּגַע bezeichnet den Gegenstand, an/in dem die befallene Stelle ist, nicht beliebige von ihr betroffene Teile.'
  naturalness: Die Formulierung ist insgesamt modernes, verständliches Standarddeutsch. „Die befallene Stelle“ ist als Bezugswort klar; die überarbeitete Schlussformulierung ist zugleich idiomatischer und genauer.
  terminology: „Kleidungsstück“, „Kettfaden“, „Schussfaden“ und „Gegenstand aus Leder“ sind fachlich angemessen. „Befallene Stelle“ bewahrt bei נגע die absichtliche Offenheit gegenüber einer modernen medizinischen Diagnose. „Breitet sie sich aus“ gibt die bildhafte, prozesshafte Aussage von פרחת natürlich wieder.
