    issue: Der Schlusssatz erweitert bzw. verwischt den Bezug von אֵת אֲשֶׁר בּוֹ הַנָּגַע.
    rationale: „Was von der befallenen Stelle betroffen ist“ kann einen Teil des Gegenstands meinen. Der hebräische Relativausdruck weist dagegen auf das zu verbrennende Stück bzw. den Gegenstand, der die Schadstelle aufweist. Die vorhandene Fußnote erkennt dies zwar, kann die Ungenauigkeit des Haupttexts aber nicht ausreichend beheben.
  - severity: low
