source:
  edition: WLC
  text: וְ/הָיָ֞ה בִּ/מְק֤וֹם הַ/שְּׁחִין֙ שְׂאֵ֣ת לְבָנָ֔ה א֥וֹ בַהֶ֖רֶת לְבָנָ֣ה אֲדַמְדָּ֑מֶת וְ/נִרְאָ֖ה אֶל הַ/כֹּהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/019.yaml
  text: and in the place of the boil there develops a white swelling or a reddish-white bright spot[a], then it shall be shown to the priest.
translation:
  language: de
  text: Und wenn sich an der Stelle des Geschwürs eine weiße Schwellung oder ein heller, rötlich-weißer Fleck bildet, soll er sich dem Priester zeigen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „soll er dem Priester erscheinen“ oder „soll er vom Priester gesehen werden“. Gemeint ist die Vorstellung zur Untersuchung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: wenn sich … bildet
  rationale: Im Zusammenhang der diagnostischen Vorschrift bezeichnet היה das Auftreten eines Hautmerkmals. Die Formulierung gibt dieses Entstehen natürlich wieder, ohne mehr als den hebräischen Text auszusagen.
- source_word: בִּמְקוֹם הַשְּׁחִין
  choice: an der Stelle des Geschwürs
  rationale: Die Wendung bezeichnet den Ort des zuvor vorhandenen Hautleidens. „An der Stelle“ ist im Deutschen idiomatisch; „Geschwür“ gibt שְׁחִין als entzündete Wunde beziehungsweise Eiterbeule angemessen wieder.
- source_word: שְׂאֵת לְבָנָה
  choice: eine weiße Schwellung
  rationale: שְׂאֵת bezeichnet hier eine erhabene Hautveränderung. „Schwellung“ ist verständlich und wahrt die Unterscheidung vom folgenden hellen Fleck.
- source_word: בַהֶרֶת לְבָנָה אֲדַמְדָּמֶת
  choice: ein rötlich-weißer heller Fleck
  rationale: בַהֶרֶת bezeichnet einen auffälligen hellen beziehungsweise glänzenden Hautfleck; אֲדַמְדָּמֶת fügt eine rötliche Färbung hinzu. „Rötlich-weiß“ verbindet beide Farbangaben, ohne sie gegeneinander auszuspielen.
- source_word: וְנִרְאָה אֶל הַכֹּהֵן
  choice: soll die betroffene Stelle dem Priester gezeigt werden
  rationale: Das Niphal von ראה kann wörtlich „gesehen werden“ oder „erscheinen“ bedeuten. Im gesetzlichen Zusammenhang ist die Vorstellung zur priesterlichen Untersuchung gemeint. Das ergänzte „die betroffene Stelle“ macht den deutschen Bezug eindeutig.
theological_decisions:
- issue: Funktion des Priesters
  choice: dem Priester gezeigt werden
  alternative: vor dem Priester erscheinen / vom Priester gesehen werden
  rationale: Der Text weist dem Priester die Untersuchung zu, trifft in diesem Vers aber noch kein Urteil über Reinheit oder Unreinheit. Die Übersetzung fügt daher keine Diagnose hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlicher medizinisch-ritueller Terminologie. Die Satzstruktur bildet den Bedingungs- und Verfahrenszusammenhang natürlich ab; die Mehrdeutigkeit von וְנִרְאָה wird in der Fußnote bewahrt.
