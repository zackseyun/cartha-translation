review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung der Hautmerkmale ist insgesamt quellentreu. Die explizite Ergänzung „die betroffene Stelle“ bei וְנִרְאָה legt jedoch einen Gegenstand fest, während die hebräische Form im Kontext eher die betroffene Person als diejenige nahelegt, die sich dem Priester zur Untersuchung zeigt; die Form selbst bleibt dabei syntaktisch knapp. Eine personenbezogene deutsche Wiedergabe ist daher angemessener.
  naturalness: Der Entwurf ist gut verständlich. „Ein rötlich-weißer heller Fleck“ ist jedoch etwas gedrängt; „ein heller, rötlich-weißer Fleck“ ist idiomatischer. Die Konstruktion mit „wenn“ bildet den im Deutschen naheliegenden Bedingungszusammenhang dieser Vorschrift klar ab.
  terminology: „Geschwür“, „weiße Schwellung“ und „heller … Fleck“ sind im modernen Standarddeutsch sachlich und registergerecht. „Priester“ gibt כֹּהֵן korrekt wieder. Die Fußnote sollte nicht „sichtbar werden“ sagen, da dies die Bedeutung von נִרְאָה zu stark auf bloße Sichtbarkeit verengt.
  issues:
  - severity: medium
    issue: „soll die betroffene Stelle dem Priester gezeigt werden“ ergänzt einen ausdrücklich genannten Gegenstand.
    rationale: Das Hebräische nennt bei וְנִרְאָה keinen solchen Gegenstand. Im unmittelbaren Kontext ist am ehesten die betroffene Person gemeint, die sich zur priesterlichen Untersuchung vorstellt. Die Ergänzung „betroffene Stelle“ verengt den Bezug unnötig.
  - severity: low
    issue: Die Fußnotenformulierung „soll sie vor dem Priester sichtbar werden“ ist keine treffende wörtliche Alternative.
    rationale: Niphal von ראה kann hier „gesehen werden“ bzw. kontextuell „sich zeigen/erscheinen“ bedeuten; „sichtbar werden“ bezeichnet dagegen primär das Sichtbarwerden eines Merkmals und verwischt die Verfahrensbedeutung.
  - severity: low
    issue: Die Wortfolge „rötlich-weißer heller Fleck“ ist stilistisch schwerfällig.
    rationale: Die Umstellung zu „heller, rötlich-weißer Fleck“ erhält die lexikalische Unterscheidung von בַּהֶרֶת und liest sich natürlicher.
  revised_text: Und wenn sich an der Stelle des Geschwürs eine weiße Schwellung oder ein heller, rötlich-weißer Fleck bildet, soll er sich dem Priester zeigen.[a]
