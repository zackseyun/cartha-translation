revisions:
- from: Und wenn sich an der Stelle des Geschwürs eine weiße Schwellung oder ein rötlich-weißer heller Fleck bildet, soll die betroffene Stelle dem Priester gezeigt werden.[a]
  to: Und wenn sich an der Stelle des Geschwürs eine weiße Schwellung oder ein heller, rötlich-weißer Fleck bildet, soll er sich dem Priester zeigen.[a]
  rationale: Die Revision vermeidet die nicht im Hebräischen ausdrücklich genannte „betroffene Stelle“ als Subjekt des letzten Satzteils und gibt den verfahrensbezogenen Sinn von וְנִרְאָה im deutschen Kontext natürlich wieder. Zugleich wird die Fußnote semantisch präzisiert und die Beschreibung des Flecks stilistisch geglättet, ohne diagnostische oder theologische Zusätze einzuführen.
