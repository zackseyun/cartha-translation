  text: וְ/אִ֣ם יִרְאֶ֣/נָּה הַ/כֹּהֵ֗ן וְ/הִנֵּ֤ה אֵֽין בָּ/הּ֙ שֵׂעָ֣ר לָבָ֔ן וּ/שְׁפָלָ֥ה אֵינֶ֛/נָּה מִן הָ/ע֖וֹר וְ/הִ֣יא כֵהָ֑ה וְ/הִסְגִּיר֥/וֹ הַ/כֹּהֵ֖ן שִׁבְעַ֥ת יָמִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/021.yaml
  text: But if the priest examines it[a], and behold, there is no white hair in it, and it is not deeper than the skin, but it is dim, then the priest shall isolate him for seven days.
translation:
  language: de
  text: Wenn der Priester die Stelle jedoch untersucht und sieht, dass sich kein weißes Haar darin befindet, dass sie nicht tiefer liegt als die Haut und blass ist, soll der Priester ihn sieben Tage lang isolieren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ihn sieben Tage lang absondern. Das hebräische Verb bezeichnet hier die getrennte Unterbringung der Person zur Beobachtung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: jedoch wenn
  rationale: Leitet den gegensätzlichen Fall zur vorherigen Diagnose ein; im deutschen Satz wird die Verbindung natürlich durch „jedoch“ wiedergegeben.
- source_word: יִרְאֶנָּה
  choice: die Stelle untersucht und sieht
  rationale: Das Verb bedeutet wörtlich „sehen“, bezeichnet hier aber die priesterliche Untersuchung. „Untersucht und sieht“ bewahrt sowohl den Vorgang als auch die anschließende Feststellung; das feminine Suffix wird kontextgemäß auf die betroffene Stelle bezogen.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Übliche und sachlich genaue Bezeichnung des für die Untersuchung zuständigen Priesters.
- source_word: אֵין בָּהּ שֵׂעָר לָבָן
  choice: dass sich kein weißes Haar darin befindet
  rationale: Gibt das diagnostische Merkmal direkt wieder und bezieht „darin“ auf die betroffene Stelle.
- source_word: וּשְׁפָלָה אֵינֶנָּה מִן הָעוֹר
  choice: dass sie nicht tiefer liegt als die Haut
  rationale: שְׁפָלָה bezeichnet eine tiefer liegende oder eingesunkene Erscheinung; die Formulierung bleibt nahe am räumlichen Vergleich des Hebräischen.
- source_word: וְהִיא כֵהָה
  choice: und blass ist
  rationale: כֵהָה beschreibt eine abgeschwächte, matte oder verblasste Erscheinung. „Blass“ ist im visuellen Diagnosekontext natürlich und präzise.
- source_word: וְהִסְגִּירוֹ
  choice: soll der Priester ihn isolieren
  rationale: Das Verb bezeichnet das Absondern beziehungsweise Einschließen zur Beobachtung. Das maskuline Suffix bezieht sich auf die betroffene Person, nicht auf die Stelle.
- source_word: שִׁבְעַת יָמִים
  choice: sieben Tage lang
  rationale: Natürliche deutsche Wiedergabe der angegebenen Dauer.
