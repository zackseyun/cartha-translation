source:
  edition: WLC
  text: אִישׁ צָר֥וּעַ ה֖וּא טָמֵ֣א ה֑וּא טַמֵּ֧א יְטַמְּאֶ֛/נּוּ הַ/כֹּהֵ֖ן בְּ/רֹאשׁ֥/וֹ נִגְעֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/044.yaml
  text: He is a leprous man; he is unclean[a]. The priest shall surely pronounce him unclean; his disease is on his head.
translation:
  language: de
  text: Er ist ein Mann mit einer Hautkrankheit[a]; er ist unrein. Der Priester muss ihn unbedingt für unrein erklären; sein Hautbefall ist auf seinem Kopf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: „aussätzig“. Der hebräische Ausdruck bezeichnet die in diesem Kapitel behandelte Hauterkrankung und ist nicht unbedingt mit moderner Lepra (Hansen-Krankheit) identisch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ צָרוּעַ
  choice: ein Mann mit einer aussatzartigen Hautkrankheit
  rationale: אִישׁ bezeichnet hier ausdrücklich einen Mann; צָרוּעַ beschreibt einen von der in diesem Kapitel behandelten Erkrankung Betroffenen. „Aussatzartig“ wahrt den traditionellen Bezug, ohne die Erkrankung fälschlich mit der modernen Hansen-Krankheit gleichzusetzen.
- source_word: טָמֵא הוּא
  choice: er ist unrein
  rationale: טָמֵא bezeichnet im Zusammenhang von Levitikus den kultisch-rituellen Status der Unreinheit; die Wiederholung des Personalpronomens bleibt als eigener Satz erhalten.
- source_word: טַמֵּא יְטַמְּאֶנּוּ
  choice: soll ihn auf jeden Fall für unrein erklären
  rationale: Die Verbindung von Infinitivus absolutus und finitem Verb verstärkt die Aussage. Im priesterlichen Untersuchungsverfahren stellt der Priester den Status verbindlich fest, statt die Unreinheit erst zu verursachen.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Die übliche und sachlich genaue Bezeichnung des für Untersuchung und Statusfeststellung zuständigen Kultbeamten.
- source_word: בְּרֹאשׁוֹ
  choice: an seinem Kopf
  rationale: Die Präposition bezeichnet hier den Ort des Befalls. „Kopf“ folgt dem Hebräischen, ohne die Aussage unnötig auf die Kopfhaut einzuengen.
- source_word: נִגְעוֹ
  choice: der Befall
  rationale: נֶגַע bezeichnet in Levitikus 13 den untersuchten krankhaften Befund beziehungsweise Befall. „Befall“ ist medizinisch nicht zu spezifisch und eignet sich als wiederkehrender diagnostischer Ausdruck.
theological_decisions:
- issue: Wirkung der priesterlichen Erklärung
  choice: für unrein erklären
  alternative: unrein machen
  rationale: Der Kontext beschreibt eine priesterliche Diagnose und verbindliche Feststellung des bereits bestehenden Status. Die Übersetzung vermeidet daher die theologisch missverständliche Aussage, der Priester verursache die Unreinheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die doppelte Feststellung „er ist …; er ist unrein“ und die Verstärkung der priesterlichen Erklärung werden bewahrt. „Aussatzartig“ vermeidet eine ungesicherte moderne Diagnose, während „Befall“ den rechtlich-diagnostischen Zusammenhang des Kapitels abbildet.
