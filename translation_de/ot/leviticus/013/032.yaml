  text: וְ/רָאָ֨ה הַ/כֹּהֵ֣ן אֶת הַ/נֶּגַע֮ בַּ/יּ֣וֹם הַ/שְּׁבִיעִי֒ וְ/הִנֵּה֙ לֹא פָשָׂ֣ה הַ/נֶּ֔תֶק וְ/לֹא הָ֥יָה ב֖/וֹ שֵׂעָ֣ר צָהֹ֑ב וּ/מַרְאֵ֣ה הַ/נֶּ֔תֶק אֵ֥ין עָמֹ֖ק מִן הָ/עֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/032.yaml
  text: And the priest shall examine the diseased area on the seventh day[a], and behold, if the scaly infection has not spread, and there is no yellow hair in it, and the appearance of the scaly infection is not deeper than the skin,
translation:
  language: de
  text: Am siebten Tag soll der Priester die betroffene Stelle untersuchen. Wenn sich der schuppige Ausschlag[a] nicht ausgebreitet hat, sich darin kein gelbes Haar befindet und der Ausschlag nicht tiefer als die Haut erscheint,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet eine besondere krankhafte Veränderung im behaarten Kopf- oder Bartbereich; auch Übersetzungen wie „Grind“ oder „schuppiger Ausschlag“ sind möglich.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: soll … untersuchen
  rationale: Im Kontext der priesterlichen Begutachtung bezeichnet ראה mehr als bloßes Sehen; „untersuchen“ gibt den vorgeschriebenen diagnostischen Vorgang natürlich wieder.
- source_word: הַנֶּגַע
  choice: die betroffene Stelle
  rationale: נֶגַע bezeichnet hier allgemein die von einer auffälligen Veränderung betroffene Hautpartie, ohne eine moderne medizinische Diagnose festzulegen.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: Am siebten Tag
  rationale: Direkte und idiomatische Wiedergabe der Zeitangabe.
- source_word: וְהִנֵּה
  choice: Wenn
  rationale: Das hebräische וְהִנֵּה führt hier den bei der Untersuchung festgestellten Befund ein. Im deutschen Satzgefüge gibt „wenn“ seine konditionale Funktion verständlich wieder, ohne das altertümliche „siehe“ zu erzwingen.
- source_word: הַנֶּתֶק
  choice: der Kopf- oder Bartausschlag / der Ausschlag
  rationale: נֶתֶק bezeichnet in diesem Abschnitt eine besondere Erkrankung im behaarten Kopf- oder Bartbereich. Die erste, präzisierende Nennung macht den Bereich deutlich; die verkürzte Wiederaufnahme vermeidet Schwerfälligkeit.
- source_word: לֹא פָשָׂה
  choice: sich … nicht ausgebreitet hat
  rationale: פשה bezeichnet in den Hautbefunden von Levitikus das räumliche Ausbreiten einer Veränderung.
- source_word: וְלֹא הָיָה בוֹ שֵׂעָר צָהֹב
  choice: sich darin kein gelbes Haar befindet
  rationale: Bewahrt die örtliche Beziehung von בוֹ und formuliert das Fehlen dieses diagnostischen Merkmals in natürlichem Deutsch.
- source_word: אֵין עָמֹק מִן הָעוֹר
  choice: nicht tiefer als die Haut erscheint
  rationale: Das Kriterium betrifft den sichtbaren Eindruck bei der Untersuchung. „erscheint“ verhindert, dass die Aussage als moderne Messung anatomischer Tiefe missverstanden wird.
theological_decisions: []
translation_notes:
  register: Modernes, sachliches und würdiges Standarddeutsch. Der Vers bleibt entsprechend dem hebräischen Satzbau als Bedingungssatz offen, da die Folgerung erst im nächsten Vers einsetzt. Medizinisch zu enge oder anachronistische Diagnosen werden vermieden.
