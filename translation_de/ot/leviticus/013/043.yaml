  text: וְ/רָאָ֨ה אֹת֜/וֹ הַ/כֹּהֵ֗ן וְ/הִנֵּ֤ה שְׂאֵת הַ/נֶּ֨גַע֙ לְבָנָ֣ה אֲדַמְדֶּ֔מֶת בְּ/קָרַחְתּ֖/וֹ א֣וֹ בְ/גַבַּחְתּ֑/וֹ כְּ/מַרְאֵ֥ה צָרַ֖עַת ע֥וֹר בָּשָֽׂר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/043.yaml
  text: and the priest examines him, and behold, the swelling of the disease is whitish-red on his bald head or on his bald forehead, like the appearance of a skin disease on the flesh,
translation:
  language: de
  text: Und der Priester soll ihn untersuchen. Zeigt sich dabei, dass die Erhebung des Krankheitsmals an seinem kahlen Hinterkopf oder an seiner kahlen Stirn[a] weiß-rötlich ist und wie eine Hautkrankheit[b] an der Körperhaut aussieht,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die beiden hebräischen Ausdrücke für Kahlheit bezeichnen wahrscheinlich die kahle Stelle am Hinterkopf und die kahle Stelle an der Vorderseite des Kopfes.
    reason: cultural_note
  - marker: b
    text: Das hebräische Wort צָרַעַת wird traditionell mit „Aussatz“ wiedergegeben. In 3. Mose bezeichnet es jedoch eine größere Bandbreite von Hautveränderungen und nicht speziell die Hansen-Krankheit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: soll ihn untersuchen
  rationale: ראה bezeichnet hier im Zusammenhang der priesterlichen Begutachtung nicht nur ein Sehen, sondern ein sorgfältiges Untersuchen. Die Soll-Form gibt den Verfahrenscharakter des Rechtstextes wieder.
- source_word: וְהִנֵּה
  choice: Zeigt sich dabei
  rationale: Gibt die Feststellung des Priesters natürlich wieder, ohne die hinweisende Kraft von הִנֵּה ganz aufzugeben.
- source_word: שְׂאֵת הַנֶּגַע
  choice: die Erhebung des Krankheitsmals
  rationale: שְׂאֵת ist eine erhabene Stelle oder Schwellung; נֶגַע bezeichnet hier das untersuchte Krankheitsmal. Die Formulierung wahrt den diagnostischen Zusammenhang, ohne vorschnell eine bestimmte moderne Diagnose zu nennen.
- source_word: לְבָנָה אֲדַמְדֶּמֶת
  choice: weiß-rötlich
  rationale: Die beiden Farbangaben werden als Mischfärbung wiedergegeben; die Reihenfolge des Hebräischen bleibt erhalten.
- source_word: בְּקָרַחְתּוֹ א֣וֹ בְגַבַּחְתּוֹ
  choice: an seinem kahlen Hinterkopf oder an seiner kahlen Stirn
  rationale: Die beiden hebräischen Begriffe unterscheiden wahrscheinlich die hintere beziehungsweise vordere kahle Kopfpartie. Die Übersetzung macht diesen Kontrast verständlich sichtbar.
- source_word: כְּמַרְאֵה
  choice: wie ... aussieht
  rationale: Gibt die vergleichende Aussage über das sichtbare Erscheinungsbild in natürlichem Deutsch wieder.
- source_word: צָרַעַת
  choice: Hautkrankheit
  rationale: Der traditionelle Ausdruck „Aussatz“ wird heute leicht ausschließlich mit der Hansen-Krankheit gleichgesetzt. צָרַעַת umfasst in Levitikus jedoch eine breitere Gruppe auffälliger Hautveränderungen.
- source_word: עוֹר בָּשָׂר
  choice: an der Körperhaut
  rationale: Die knappe deutsche Wendung bewahrt sowohl den Bezug auf die Haut als auch auf den menschlichen Körper.
