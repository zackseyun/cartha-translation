  text: נֶ֣גַע צָרַ֔עַת כִּ֥י תִהְיֶ֖ה בְּ/אָדָ֑ם וְ/הוּבָ֖א אֶל הַ/כֹּהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/009.yaml
  text: When an infection of leprosy is in a person[a], then he shall be brought to the priest.
translation:
  language: de
  text: Wenn bei einem Menschen ein Aussatzbefall[a] auftritt, soll er zum Priester gebracht werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort צָרַעַת, traditionell mit „Aussatz“ wiedergegeben, bezeichnet wahrscheinlich eine breitere Gruppe auffälliger Hautveränderungen und nicht ausschließlich die heute als Lepra oder Hansen-Krankheit bekannte Krankheit.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגַע
  choice: Erkrankung
  rationale: Im diagnostischen Zusammenhang bezeichnet das Wort einen sichtbaren krankhaften Befund. „Erkrankung“ ist verständlich und vermeidet die heute unpassende Wirkung von „Plage“.
- source_word: צָרַעַת
  choice: die als Aussatz gilt
  rationale: Der traditionelle Ausdruck „Aussatz“ wahrt den Bezug zur biblischen Kategorie, während die Formulierung mit „gilt“ verdeutlicht, dass nicht ausschließlich die moderne Hansen-Krankheit gemeint ist.
- source_word: כִּי תִהְיֶה
  choice: wenn … auftritt
  rationale: כִּי leitet hier einen Rechtsfall ein. „Auftritt“ gibt das Vorliegen des Befunds im natürlichen deutschen Sprachgebrauch wieder, ohne eine bestimmte Entstehungsweise festzulegen.
- source_word: בְּאָדָם
  choice: bei einem Menschen
  rationale: אָדָם bezeichnet hier generisch einen Menschen. Bei einer Erkrankung ist „bei“ im Deutschen idiomatischer als das formale „in“.
- source_word: וְהוּבָא
  choice: soll er … gebracht werden
  rationale: Die passive Form beschreibt den anschließenden vorgeschriebenen Verfahrensschritt und bewahrt, dass die betroffene Person nicht selbst als Handelnde dargestellt wird.
- source_word: אֶל הַכֹּהֵן
  choice: zum Priester
  rationale: Der bestimmte Artikel bezeichnet den für die Untersuchung zuständigen Priester; die Zusammenziehung „zum“ gibt dies im Deutschen natürlich wieder.
theological_decisions:
- issue: Umfang des Begriffs צָרַעַת
  choice: Aussatz als biblische Diagnosekategorie, durch Fußnote erläutert
  alternative: Lepra / Hautkrankheit
  rationale: „Lepra“ wäre medizinisch zu eng, „Hautkrankheit“ könnte die traditionelle und kultrechtliche Kategorie zu stark verallgemeinern. „Aussatz“ mit Erläuterung bewahrt die Eigenart des Ausgangsbegriffs.
- issue: Generisches אָדָם
  choice: Mensch
  alternative: Mann
  rationale: Hier ist keine männliche Person im Gegensatz zu einer weiblichen bezeichnet, sondern allgemein ein betroffener Mensch. Die Übersetzung bewahrt diesen generischen Umfang.
translation_notes:
  register: Moderner, würdiger Rechts- und Anweisungsstil. Die Satzfolge bleibt nah am hebräischen Fallrecht, wird aber idiomatisch deutsch formuliert.
