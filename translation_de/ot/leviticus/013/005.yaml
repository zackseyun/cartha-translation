base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/005.yaml
  text: And the priest shall examine him on the seventh day[a], and behold, if the spot has remained unchanged in his sight and the spot has not spread in the skin[c][b], then the priest shall isolate him for seven days a second time.
translation:
  language: de
  text: Der Priester soll ihn am siebten Tag untersuchen. Zeigt sich dabei, dass die betroffene Stelle[a] für ihn unverändert geblieben ist und sich nicht in der Haut ausgebreitet hat, soll der Priester ihn ein zweites Mal für sieben Tage absondern[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann auch „Befall“, „Mal“ oder „Schädigung“ bedeuten. Gemeint ist der sichtbare Befund, den der Priester untersucht, nicht unbedingt eine nach heutigen Maßstäben bestimmte Krankheit.
    reason: lexical_alternative
  - marker: b
    text: Oder „einschließen“ beziehungsweise „unter Verschluss halten“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָהוּ
  choice: soll ihn … untersuchen
  rationale: ראה bedeutet wörtlich „sehen“, bezeichnet hier jedoch die vorgeschriebene priesterliche Begutachtung.
- source_word: וְהִנֵּה
  choice: Zeigt sich dabei, dass
  rationale: Die Formulierung gibt den aufmerksamkeitslenkenden Hinweis auf das Ergebnis der Untersuchung in natürlichem modernem Deutsch wieder, ohne die Bedingtheit des Rechtssatzes zu verdecken.
- source_word: הַנֶּגַע
  choice: die betroffene Stelle
  rationale: נגע bezeichnet hier den sichtbaren Hautbefund, ohne ihn vorschnell als eine bestimmte medizinische Krankheit einzuordnen.
- source_word: עָמַד בְּעֵינָיו
  choice: für ihn unverändert geblieben ist
  rationale: Die wörtliche Wendung „in seinen Augen stehen geblieben“ bedeutet, dass der Befund nach Einschätzung des Priesters unverändert erscheint.
- source_word: לֹא פָשָׂה הַנֶּגַע בָּעוֹר
  choice: sich nicht auf der Haut ausgebreitet hat
  rationale: פשׂה bezeichnet in diesem Untersuchungszusammenhang das räumliche Ausbreiten des Hautbefunds.
- source_word: וְהִסְגִּירוֹ
  choice: soll … ihn … absondern
  rationale: סגר bedeutet „einschließen, verschließen“. „Absondern“ drückt die angeordnete Trennung aus, ohne die moderne medizinische Präzision von „unter Quarantäne stellen“ einzutragen.
- source_word: שִׁבְעַת יָמִים שֵׁנִית
  choice: ein zweites Mal für sieben Tage
  rationale: Die Formulierung macht deutlich, dass eine zweite siebentägige Absonderungsfrist angeordnet wird.
