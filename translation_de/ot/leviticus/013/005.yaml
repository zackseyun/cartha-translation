  register: Modernes, würdiges Standarddeutsch. Der Rechtssatz wird klar und flüssig formuliert; medizinisch anachronistische Festlegungen werden vermieden. Die Perspektive des Priesters in der hebräischen Redewendung bleibt durch „für ihn“ erhalten.
