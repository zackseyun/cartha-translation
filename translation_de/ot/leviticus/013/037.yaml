source:
  edition: WLC
  text: וְ/אִם בְּ/עֵינָי/ו֩ עָמַ֨ד הַ/נֶּ֜תֶק וְ/שֵׂעָ֨ר שָׁחֹ֧ר צָֽמַח בּ֛/וֹ נִרְפָּ֥א הַ/נֶּ֖תֶק טָה֣וֹר ה֑וּא וְ/טִהֲר֖/וֹ הַ/כֹּהֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/037.yaml
  text: But if in his sight the scaly eruption has remained unchanged[a], and black hair has grown in it, the scaly eruption is healed; he is clean, and the priest shall pronounce him clean.
translation:
  language: de
  text: Wenn aber der schuppige Ausschlag bei seiner Untersuchung unverändert geblieben und schwarzes Haar darin gewachsen ist, dann ist der Ausschlag geheilt. Der Betroffene ist rein, und der Priester soll ihn für rein erklären.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: »Der Priester soll ihn reinigen.« Hier bezeichnet das hebräische Verb den amtlichen Ausspruch, dass der Betroffene rein ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵינָיו
  choice: bei seiner Untersuchung
  rationale: Die Wendung bezeichnet die Beurteilung aus der Sicht des untersuchenden Priesters. Die Übersetzung gibt den Untersuchungskontext in natürlichem Deutsch wieder, ohne daraus eine bloß subjektive Meinung zu machen.
- source_word: עָמַד
  choice: unverändert geblieben
  rationale: Im diagnostischen Zusammenhang bedeutet das Verb, dass sich die betroffene Stelle nicht weiter ausgebreitet oder verändert hat.
- source_word: הַנֶּתֶק
  choice: der schuppige Ausschlag
  rationale: Das Wort bezeichnet hier eine besondere Erkrankung im behaarten Bereich von Kopf oder Bart. »Schuppiger Ausschlag« ist verständlich und vermeidet das heute missverständliche oder altertümliche »Grind«.
- source_word: שֵׂעָר שָׁחֹר
  choice: schwarzes Haar
  rationale: Die direkte Wiedergabe erhält das diagnostische Merkmal und den farblichen Gegensatz des Abschnitts.
- source_word: צָמַח בּוֹ
  choice: darin gewachsen
  rationale: Die Präposition beschreibt Haarwuchs innerhalb der betroffenen Stelle.
- source_word: נִרְפָּא
  choice: ist geheilt
  rationale: Die passive beziehungsweise resultative Form stellt fest, dass die Erkrankung abgeheilt ist.
- source_word: טָהוֹר הוּא
  choice: Der Betroffene ist rein
  rationale: Das maskuline Pronomen bezieht sich auf den untersuchten Menschen. »Rein« entspricht der kultisch-rechtlichen Begrifflichkeit des Levitikus.
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: und der Priester soll ihn für rein erklären
  rationale: Hier bezeichnet das Verb den amtlichen Reinheitsentscheid des Priesters nach festgestellter Heilung, nicht die Herbeiführung der körperlichen Heilung.
theological_decisions:
- issue: Art der priesterlichen Handlung bei der Feststellung kultischer Reinheit
  choice: der Priester soll ihn für rein erklären
  alternative: der Priester soll ihn reinigen
  rationale: Der Vers unterscheidet zwischen der bereits eingetretenen Heilung und dem anschließenden amtlichen Urteil des Priesters. Die gewählte Formulierung vermeidet die Aussage, der Priester bewirke selbst die Heilung, ohne die rechtlich-kultische Bedeutung seiner Handlung abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der medizinisch schwer exakt bestimmbare Ausdruck wird verständlich, aber nicht mit einer modernen Diagnose wiedergegeben. »Der Betroffene« klärt den Bezug des männlichen Pronomens, ohne eine Personengruppe hinzuzufügen.
