  source_fidelity: Der Bedingungssatz, die intensive Ausbreitung der צָרַעַת, ihre Bedeckung der gesamten Haut, der Merismus »vom Kopf bis zu den Füßen« und die Begrenzung auf das für den Priester Sichtbare sind sachgerecht wiedergegeben. »Hautkrankheit« ist für צָרַעַת angemessen allgemein. Die Formulierung »soweit die Augen des Priesters sehen können« ist jedoch im Deutschen unnötig schwerfällig und kann eine bloße Sehfähigkeit statt des Sichtbereichs nahelegen.
