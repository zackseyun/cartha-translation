  text: וְ/אִם פָּר֨וֹחַ תִּפְרַ֤ח הַ/צָּרַ֨עַת֙ בָּ/ע֔וֹר וְ/כִסְּתָ֣ה הַ/צָּרַ֗עַת אֵ֚ת כָּל ע֣וֹר הַ/נֶּ֔גַע מֵ/רֹאשׁ֖/וֹ וְ/עַד רַגְלָ֑י/ו לְ/כָל מַרְאֵ֖ה עֵינֵ֥י הַ/כֹּהֵֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/012.yaml
  text: And if the skin disease breaks out all over the skin[a], and the skin disease covers all the skin of the affected person from his head to his feet, as far as the priest can see[b],
translation:
  language: de
  text: Wenn aber die Hautkrankheit sich auf der Haut stark ausbreitet[a] und die Hautkrankheit die ganze Haut des Betroffenen bedeckt, vom Kopf bis zu den Füßen, soweit die Augen des Priesters reichen[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort צָרַעַת (zaraʿat) bezeichnet im Levitikus verschiedene kultisch relevante Hautleiden und ist nicht einfach mit der modernen Lepra (Hansen-Krankheit) gleichzusetzen.
    reason: cultural_note
  - marker: b
    text: 'Wörtlicher: »die ganze Haut des Befalls«. Gemeint ist die Haut der betroffenen Person, soweit sie von dem Leiden erfasst und für den Priester sichtbar ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרוֹחַ תִּפְרַח
  choice: sich stark ausbreitet
  rationale: Der Infinitivus absolutus zusammen mit der finiten Verbform verstärkt die Aussage von פרח. »Sich stark ausbreiten« gibt diese Intensivierung in natürlichem Deutsch wieder, ohne eine medizinisch zu genaue Deutung einzutragen.
- source_word: הַצָּרַעַת
  choice: die Hautkrankheit
  rationale: צָרַעַת bezeichnet im Levitikus verschiedene kultisch relevante Hautleiden und darf nicht vorschnell mit der modernen Lepra (Hansen-Krankheit) gleichgesetzt werden.
- source_word: בָּעוֹר
  choice: auf der Haut
  rationale: Die Präposition ב bezeichnet hier die Körperoberfläche, auf der sich das Leiden ausbreitet.
- source_word: וְכִסְּתָה
  choice: und ... bedeckt
  rationale: Im konditionalen Satzgefüge wird die Verbform im Deutschen natürlich als Präsens wiedergegeben; »bedeckt« bewahrt die Vorstellung vollständiger Ausdehnung.
- source_word: אֵת כָּל עוֹר הַנֶּגַע
  choice: die ganze Haut des Betroffenen
  rationale: Wörtlich steht etwa »die ganze Haut des Befalls«. Die gewählte Formulierung macht den gemeinten Personenbezug verständlich; die wörtlichere Ausdrucksweise wird in einer Fußnote bewahrt.
- source_word: מֵרֹאשׁוֹ וְעַד רַגְלָיו
  choice: vom Kopf bis zu den Füßen
  rationale: Die Wendung ist ein Merismus für den ganzen Körper und wird im Deutschen natürlich und genau wiedergegeben.
- source_word: לְכָל מַרְאֵה עֵינֵי הַכֹּהֵן
  choice: soweit die Augen des Priesters sehen können
  rationale: Die konkrete Bezugnahme auf die Augen des Priesters bleibt erhalten, während die hebräische Wendung in verständliches modernes Deutsch übertragen wird.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt als Bedingungssatz offen, da er in Vers 13 fortgeführt wird. Medizinisch irreführende Spezifizierung wurde vermieden; die kultische und diagnostische Einordnung bleibt dem Kontext überlassen.
