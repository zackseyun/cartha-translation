  text: וְ/אִישׁ֙ א֣וֹ אִשָּׁ֔ה כִּֽי יִהְיֶ֥ה ב֖/וֹ נָ֑גַע בְּ/רֹ֖אשׁ א֥וֹ בְ/זָקָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/029.yaml
  text: When a man or a woman has an infection on the head or on the beard[b][a],
translation:
  language: de
  text: Wenn ein Mann oder eine Frau eine krankhafte Stelle am Kopf oder im Bart hat,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein Leiden«, »eine Erkrankung« oder »ein Mal«. Das hebräische Wort bezeichnet in 3. Mose einen sichtbaren Befund, den der Priester untersucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִישׁ ... אִשָּׁה
  choice: ein Mann oder eine Frau
  rationale: Der hebräische Text nennt beide Geschlechter ausdrücklich; die deutsche Übersetzung bewahrt diese Formulierung.
- source_word: כִּי
  choice: wenn
  rationale: כִּי leitet hier einen Fall innerhalb einer rechtlichen Regelung ein; »wenn« gibt den bedingenden Charakter natürlich wieder.
- source_word: יִהְיֶה בּוֹ
  choice: hat
  rationale: Die wörtliche Konstruktion »an/in ihm ist« wird im Deutschen idiomatisch mit »hat« wiedergegeben.
- source_word: נָגַע
  choice: krankhafte Stelle
  rationale: נֶגַע bezeichnet hier einen sichtbaren, priesterlich zu untersuchenden Befund, ohne eine bestimmte moderne Diagnose festzulegen. »Krankhafte Stelle« vermeidet die zu enge Festlegung auf eine Infektion.
- source_word: בְּ/רֹאשׁ
  choice: am Kopf
  rationale: רֹאשׁ bedeutet allgemein »Kopf«; die kontextuell mögliche Eingrenzung auf die Kopfhaut wird nicht unnötig in den Haupttext eingetragen.
- source_word: בְ/זָקָן
  choice: im Bart
  rationale: זָקָן bedeutet »Bart«; »im Bart« bezeichnet im Deutschen natürlich den betroffenen behaarten Bereich.
