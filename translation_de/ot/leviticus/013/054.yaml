  yaml_path: translation/ot/leviticus/013/054.yaml
  text: Then the priest shall command them to wash the thing in which the infection is[b][a], and he shall quarantine it for seven days a second time.
translation:
  language: de
  text: Dann soll der Priester anordnen, dass man den Gegenstand wäscht, an dem sich der Befall zeigt, und ihn ein zweites Mal für sieben Tage einschließen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „absondern“. Wörtlicher: „einschließen“ beziehungsweise „verschließen“. Gemeint ist, dass der Gegenstand zur weiteren Prüfung getrennt verwahrt wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוָּה הַכֹּהֵן
  choice: Dann soll der Priester anordnen
  rationale: Das Waw mit der Perfektform setzt die Abfolge der Rechtsanweisung fort. „Dann soll … anordnen“ gibt sowohl den Verfahrensschritt als auch den normativen Charakter natürlich wieder.
- source_word: וְכִבְּסוּ
  choice: dass man … wäscht
  rationale: Die dritte Person Plural bezeichnet nicht näher genannte Ausführende. Das unpersönliche „man“ bewahrt diese Unbestimmtheit, ohne zusätzliche Akteure einzuführen.
- source_word: אֵת אֲשֶׁר בּוֹ הַנָּגַע
  choice: den Gegenstand …, an dem die befallene Stelle ist
  rationale: Die breite Relativkonstruktion verweist im Zusammenhang auf das untersuchte Kleidungs-, Gewebe- oder Lederstück. „Gegenstand“ bleibt allgemein; „befallene Stelle“ eignet sich für den sichtbaren Befund an einem unbelebten Material.
- source_word: הַנָּגַע
  choice: die befallene Stelle
  rationale: נגע kann einen Befall, ein Mal oder eine Schädigung bezeichnen. Bei Stoff oder Leder vermeidet diese Wiedergabe die moderne medizinische Festlegung von „Infektion“ und bezeichnet zugleich den örtlich erkennbaren Befund.
- source_word: וְהִסְגִּירוֹ
  choice: und ihn … einschließen
  rationale: Das Verb bedeutet grundlegend „verschließen/einschließen“ und bezeichnet hier die abgesonderte Verwahrung zur weiteren Prüfung. Die formnahe Wiedergabe vermeidet die mögliche moderne Zusatzbedeutung von „Quarantäne“.
- source_word: שִׁבְעַת יָמִים שֵׁנִית
  choice: ein zweites Mal für sieben Tage
  rationale: Die Formulierung macht deutlich, dass die siebentägige Einschließung wiederholt wird.
