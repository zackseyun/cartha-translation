id: LEV.10.2
reference: Leviticus 10:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/תֵּ֥צֵא אֵ֛שׁ מִ/לִּ/פְנֵ֥י יְהוָ֖ה וַ/תֹּ֣אכַל אוֹתָ֑/ם וַ/יָּמֻ֖תוּ לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/002.yaml
  text: And fire came out from before Yahweh and consumed them[a], and they died before Yahweh.
translation:
  language: de
  text: Da ging Feuer von Jahwe aus[a] und verzehrte sie, und sie starben vor Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von vor dem Angesicht Jahwes“; auch: „aus der Gegenwart Jahwes“.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: וַתֵּצֵא
  choice: Da ging … aus
  rationale: Das Wayyiqtol führt die Erzählung mit einem vergangenen Ereignis fort. „ging … aus“ gibt die Bewegung vom Ausgangspunkt her natürlich wieder.
- source_word: אֵשׁ
  choice: Feuer
  rationale: Das Substantiv bezeichnet hier konkret Feuer als Mittel des unmittelbar folgenden Gerichts.
- source_word: מִלִּפְנֵי יְהוָה
  choice: von Jahwe aus
  rationale: Die Formulierung gibt die Herkunft des Feuers aus Jahwes unmittelbarer Gegenwart in natürlichem Deutsch wieder; die wörtlichere räumliche Wendung wird in der Fußnote bewahrt.
- source_word: וַתֹּאכַל
  choice: verzehrte
  rationale: אכל bedeutet grundsätzlich „essen“; mit Feuer als Subjekt bezeichnet „verzehren“ idiomatisch dessen zerstörerische Wirkung.
- source_word: אֹתָם
  choice: sie
  rationale: Das Objektpronomen verweist im unmittelbaren Zusammenhang auf Nadab und Abihu.
- source_word: וַיָּמֻתוּ
  choice: sie starben
  rationale: Die aktive, intransitive Verbform wird ohne kausale Erweiterung wiedergegeben; der vorherige Satzteil nennt bereits die Ursache.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: Die knappe räumlich-theologische Formulierung und die feierliche Wiederholung des Gottesnamens bleiben erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der im hebräischen Text ausdrücklich stehende Bundesname wird in der im Deutschen etablierten Form „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Aktive Aussage וַיָּמֻתוּ gegenüber einer kausativen Passivform
  choice: sie starben
  alternative: sie wurden getötet
  rationale: Der hebräische Text sagt schlicht, dass sie starben. „Sie wurden getötet“ würde die grammatische Form interpretierend erweitern, obwohl der Zusammenhang die Ursache bereits deutlich macht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Nennung Jahwes und die knappe Abfolge der hebräischen Erzählung bleiben erhalten; „Da“ markiert den unmittelbaren narrativen Anschluss.
