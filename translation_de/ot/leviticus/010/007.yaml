    issue: Räumlicher Bezug des Verbots
    rationale: '„den Eingang ... nicht verlassen“ ist semantisch weniger genau als „vom Eingang ... nicht weggehen“: מִפֶּתַח bezeichnet den Ausgangspunkt des untersagten Weggehens.'
  - severity: low
    issue: Folgeaussage mit „müsst“
    rationale: „Sonst müsst ihr sterben“ kann eine Modalität des Zwangs nahelegen. פֶּן תָּמֻתוּ warnt vor der Folge; „sonst sterbt ihr“ ist genauer.
