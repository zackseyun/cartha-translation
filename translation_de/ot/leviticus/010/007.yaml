base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/007.yaml
  text: And you shall not go out from the entrance of the tent of meeting, lest you die, because the anointing oil of Yahweh is on you.” And they did according to the word of Moses.
translation:
  language: de
  text: Vom Eingang des Zeltes der Begegnung dürft ihr nicht weggehen, sonst sterbt ihr; denn Jahwes Salböl ist auf euch.« Und sie handelten nach dem Wort des Mose.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִפֶּתַח
  choice: den Eingang … nicht verlassen
  rationale: Die Verbindung aus מִן und פֶּתַח bezeichnet den Ausgangspunkt des Weggehens. Die deutsche Formulierung gibt das Verbot natürlich wieder, ohne den räumlichen Bezug zum Eingang aufzugeben.
- source_word: אֹהֶל מוֹעֵד
  choice: Zelt der Begegnung
  rationale: Die etablierte deutsche Wiedergabe bezeichnet das Heiligtumszelt als Ort der Begegnung mit Gott und bleibt dem hebräischen Kultbegriff nahe.
- source_word: לֹא תֵצְאוּ
  choice: ihr dürft … nicht verlassen
  rationale: Im Anweisungszusammenhang drückt die negierte Verbform ein verbindliches Verbot aus. „Dürft nicht“ klingt im heutigen Deutsch klar und bestimmt.
- source_word: פֶּן תָּמֻתוּ
  choice: sonst müsst ihr sterben
  rationale: פֶּן warnt vor der tödlichen Folge eines Verstoßes. Die Formulierung bewahrt den Ernst der Warnung und ist im modernen Deutsch natürlicher als „damit ihr nicht sterbt“.
- source_word: שֶׁמֶן מִשְׁחַת יְהוָה
  choice: Jahwes Salböl
  rationale: Die knappe deutsche Genitivverbindung gibt das zur Salbung bestimmte, Jahwe zugehörige heilige Öl wieder.
- source_word: עֲלֵיכֶם
  choice: ist auf euch
  rationale: 'Die räumliche Formulierung bleibt bewusst erhalten: Das Salböl befindet sich auf den geweihten Priestern und kennzeichnet zugleich ihren geweihten Stand.'
- source_word: וַיַּעֲשׂוּ
  choice: Und sie handelten
  rationale: Das Verb bezeichnet hier die Ausführung der Anweisung; „handelten“ verbindet sich im Deutschen natürlich mit der folgenden Wendung „nach dem Wort“.
- source_word: כִּדְבַר מֹשֶׁה
  choice: nach dem Wort des Mose
  rationale: Die Wiedergabe bewahrt den ausdrücklichen Bezug auf Moses gesprochenes Wort und bezeichnet die Übereinstimmung ihres Handelns mit seiner Anweisung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen unmittelbar. „Jahwe“ gibt den Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung des Salböls auf den Priestern
  choice: Die konkrete Aussage „ist auf euch“ bleibt stehen
  alternative: „ihr seid mit Jahwes Salböl geweiht“
  rationale: Eine rein deutende Wiedergabe würde den sichtbaren, körperlichen Bezug des Öls zugunsten der theologischen Bedeutung auflösen. Der Ausgangstext lässt beides zusammenklingen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Verbot ist unmittelbar und verständlich formuliert; kultische Schlüsselbegriffe und die knappe Schlusserzählung bleiben quellennah. Der vor dem Vers begonnene Redegang endet nach dem Verbot, daher steht im Text das schließende Anführungszeichen.
