  verdict: revise
  source_fidelity: Die Grundbedeutung wird überwiegend getroffen. Allerdings bedeutet „den Eingang ... verlassen“ im Deutschen primär, den Eingang selbst hinter sich zu lassen, während das Hebräische das Weggehen vom Eingang des Zeltes untersagt. Auch „müsst ihr sterben“ fügt gegenüber der mit פֶּן ausgedrückten Warnfolge einen unnötigen Zwangsaspekt hinzu.
  naturalness: „Vom Eingang des Zeltes der Begegnung dürft ihr nicht weggehen“ ist modernes, klares Standarddeutsch und bildet die räumliche Bezugnahme präzise ab. „Sonst sterbt ihr“ gibt die ernste Konsequenz idiomatisch wieder.
  terminology: „Zelt der Begegnung“, „Jahwe“, „Salböl“ und „Mose“ sind passende, konsistente Wiedergaben. Die Formulierung „Jahwes Salböl ist auf euch“ bewahrt bewusst die konkrete Bildsprache des Hebräischen.
