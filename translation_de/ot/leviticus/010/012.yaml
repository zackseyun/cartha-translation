source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן וְ/אֶ֣ל אֶ֠לְעָזָר וְ/אֶל אִ֨יתָמָ֥ר בָּנָי/ו֮ הַ/נּֽוֹתָרִים֒ קְח֣וּ אֶת הַ/מִּנְחָ֗ה הַ/נּוֹתֶ֨רֶת֙ מֵ/אִשֵּׁ֣י יְהוָ֔ה וְ/אִכְל֥וּ/הָ מַצּ֖וֹת אֵ֣צֶל הַ/מִּזְבֵּ֑חַ כִּ֛י קֹ֥דֶשׁ קָֽדָשִׁ֖ים הִֽוא־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/012.yaml
  text: 'Then Moses spoke to Aaron and to Eleazar and to Ithamar[a], his remaining sons: “Take the grain offering that remains from the food offerings of Yahweh, and eat it unleavened beside the altar, because it is most holy.”'
translation:
  language: de
  text: 'Dann sagte Mose zu Aaron und seinen noch verbliebenen Söhnen Eleasar und Itamar: »Nehmt das Speiseopfer, das von den Feueropfern Jahwes übrig ist, und esst es ungesäuert neben dem Altar; denn es ist hochheilig.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Dann sagte Mose
  rationale: Das konsekutive Waw führt die Erzählung zeitlich weiter; »Dann« gibt diese Abfolge im modernen Deutschen natürlich wieder.
- source_word: בָּנָיו הַנּוֹתָרִים
  choice: seinen Söhnen …, die ihm noch geblieben waren
  rationale: Die Formulierung bewahrt den Bezug von בָּנָיו auf Aaron und gibt הַנּוֹתָרִים im Kontext des Todes von Nadab und Abihu zurückhaltend wieder, ohne das stärker deutende »überlebt hatten« zu verwenden.
- source_word: הַמִּנְחָה
  choice: das Speiseopfer
  rationale: מִנְחָה bezeichnet hier den unblutigen Opfergang aus Getreide; »Speiseopfer« ist ein verständlicher und im deutschen Bibelwortschatz etablierter Fachausdruck.
- source_word: הַנּוֹתֶרֶת
  choice: das … übrig ist
  rationale: Das Partizip bezeichnet den nach dem für Jahwe bestimmten Anteil verbleibenden Teil des Speiseopfers.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: von den Feueropfern für Jahwe
  rationale: אִשֶּׁה bezeichnet eine auf dem Altar dargebrachte Feuergabe. »Feueropfer« erhält das ausdrücklich vorhandene Feuerbild; »für Jahwe« gibt die Zugehörigkeit beziehungsweise Bestimmung idiomatisch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; »Jahwe« ist die geläufige deutsche Form.
- source_word: וְאִכְלוּהָ מַצּוֹת
  choice: und esst es ungesäuert
  rationale: מַצּוֹת beschreibt hier die ungesäuerte Beschaffenheit beziehungsweise Zubereitung des zu essenden Opfers; die knappe deutsche Wiedergabe erhält diese Aussage.
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: neben dem Altar
  rationale: אֵצֶל bezeichnet räumliche Nähe; »neben« ist natürlich und verlangt keinen unmittelbaren Kontakt mit dem Altar.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: hochheilig
  rationale: Die hebräische Steigerungsform bezeichnet die höchste kultische Heiligkeitsstufe. »Hochheilig« ist hier prägnant und vermeidet eine Verwechslung mit dem Raum »Allerheiligstes«.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. Die Transliteration bewahrt ihn als Eigennamen, statt ihn durch den traditionellen Ersatztitel wiederzugeben.
- issue: Kultische Einstufung קֹדֶשׁ קָדָשִׁים
  choice: hochheilig
  alternative: allerheiligst
  rationale: Die Wendung bezeichnet die höchste Heiligkeitsklasse des Opfers. »Hochheilig« wahrt diese kultische Aussage, ohne sie auf das Allerheiligste als Heiligtumsraum zu beziehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer kultischer Terminologie. Die Satzstruktur folgt dem Hebräischen, wird aber durch die Einfügung »seinen Söhnen« eindeutig und natürlich gestaltet. Keine Fußnote ist nötig, da »Feueropfer« das Bild von אִשֶּׁה bereits im Haupttext bewahrt.
