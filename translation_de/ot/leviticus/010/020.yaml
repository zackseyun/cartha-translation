  text: And Moses heard[a], and it was good in his eyes.
translation:
  language: de
  text: Mose hörte es, und es war gut in seinen Augen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und es gefiel ihm“; sinngemäß auch: „und er billigte es“. Wörtlich lautet die hebräische Wendung: „und es war gut in seinen Augen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: hörte es
  rationale: שׁמע bedeutet im Qal gewöhnlich „hören“. Das ergänzte Objekt „es“ nimmt Aarons Erklärung aus dem vorherigen Vers auf, ohne stärker deutend „verstand“ oder „stimmte zu“ zu übersetzen.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Im modernen deutschen Bibelgebrauch etablierte Namensform.
- source_word: וַיִּיטַב
  choice: es war gut
  rationale: יטב bedeutet hier „gut/angenehm sein“. Die formnahe Wiedergabe bewahrt zusammen mit der folgenden Wendung das hebräische Bild und lässt offen, ob vor allem Wohlgefallen, Akzeptanz oder Zustimmung gemeint ist.
- source_word: בְּעֵינָיו
  choice: in seinen Augen
  rationale: Die wörtliche Wiedergabe der hebräischen Beurteilungsformel bewahrt das Bild; sinngemäß bedeutet sie „für ihn“ beziehungsweise „nach seinem Urteil“.
