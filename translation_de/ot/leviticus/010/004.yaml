  to: 'Dann rief Mose Mischaël und Elizafan, die Söhne Usïels, des Onkels Aarons, und sagte zu ihnen: »Kommt her; tragt eure Brüder[a] von vor dem Heiligtum hinaus aus dem Lager.«'
  rationale: Die Zielangabe wird von „vor das Lager“ zu „aus dem Lager hinaus“ korrigiert, damit sie eindeutig die Bewegung an einen Ort außerhalb des Lagers ausdrückt. Zugleich macht „von vor dem Heiligtum“ die im Hebräischen enthaltene Ortsrelation vor dem heiligen Bereich sichtbar. Die übrige Formulierung und die Fußnote können bestehen bleiben.
