base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/004.yaml
  text: Then Moses called Mishael and Elzaphan[a], the sons of Uzziel, Aaron’s uncle, and said to them, “Come near[b]; carry your brothers away from before the sanctuary to outside the camp.”
translation:
  language: de
  text: 'Dann rief Mose Mischaël und Elizafan, die Söhne Usïels, des Onkels Aarons, und sagte zu ihnen: »Kommt her; tragt eure Brüder[a] von vor dem Heiligtum hinaus aus dem Lager.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit »Brüder« können im Hebräischen auch nahe männliche Verwandte gemeint sein; Nadab und Abihu waren ihre Cousins.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: rief
  rationale: קרא bezeichnet hier das Herbeirufen; „rief“ ist natürlich und wahrt den schlichten Erzählstil.
- source_word: בְּנֵי עֻזִּיאֵל
  choice: die Söhne Usïels
  rationale: Die Constructusverbindung bezeichnet Mischaël und Elizafan unmittelbar als leibliche Söhne Usïels.
- source_word: דֹּד אַהֲרֹן
  choice: des Onkels Aarons
  rationale: דּוֹד bezeichnet in diesem Verwandtschaftskontext am natürlichsten Aarons Onkel und steht als nähere Bestimmung zu Usïel.
- source_word: קִרְבוּ
  choice: Kommt her
  rationale: Der Imperativ von קרב fordert zum Herantreten auf; „Kommt her“ gibt die räumliche Bewegung in natürlichem Deutsch wieder.
- source_word: שְׂאוּ
  choice: tragt
  rationale: נשא bedeutet „heben, tragen“; im Zusammenhang geht es um das Wegtragen der Toten.
- source_word: אֲחֵיכֶם
  choice: eure Brüder
  rationale: אָח kann neben dem leiblichen Bruder auch einen nahen männlichen Verwandten bezeichnen. Die konkrete hebräische Verwandtschaftsbezeichnung bleibt im Text erhalten und wird in der Fußnote erläutert.
- source_word: מֵאֵת פְּנֵי הַקֹּדֶשׁ
  choice: vom Heiligtum weg
  rationale: Die Wendung bezeichnet eine Bewegung fort vom Bereich vor beziehungsweise bei dem Heiligen. „Vom Heiligtum weg“ ist räumlich klar, ohne die genaue Abgrenzung des heiligen Bereichs überzubestimmen.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: hinaus vor das Lager
  rationale: Die Präpositionen drücken gerichtete Bewegung an einen Ort außerhalb des Lagers aus. „Hinaus vor das Lager“ ist im Deutschen idiomatisch und erhält diese Richtungsangabe.
theological_decisions:
- issue: Bezug und räumliche Bedeutung von הַקֹּדֶשׁ
  choice: Heiligtum
  alternative: das Heilige / der heilige Bereich
  rationale: Der Kontext weist auf den sakralen Bereich hin, vor dem Nadab und Abihu liegen. „Heiligtum“ ist würdig und verständlich, ohne eine engere kultische Zone dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knappem Erzählrhythmus. Die Namensformen folgen gebräuchlichen deutschen Bibeltranskriptionen; der Trema in „Mischaël“ und „Usïel“ verdeutlicht die getrennte Aussprache der Vokale.
