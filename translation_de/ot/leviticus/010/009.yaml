source:
  edition: WLC
  text: יַ֣יִן וְ/שֵׁכָ֞ר אַל תֵּ֣שְׁתְּ אַתָּ֣ה וּ/בָנֶ֣י/ךָ אִתָּ֗/ךְ בְּ/בֹאֲ/כֶ֛ם אֶל אֹ֥הֶל מוֹעֵ֖ד וְ/לֹ֣א תָמֻ֑תוּ חֻקַּ֥ת עוֹלָ֖ם לְ/דֹרֹתֵי/כֶֽם־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/009.yaml
  text: You and your sons with you shall not drink wine or strong drink when you enter the tent of meeting[a], lest you die[c][b]. It is a permanent statute throughout your generations.
translation:
  language: de
  text: Du und deine Söhne dürft keinen Wein und kein berauschendes Getränk trinken, wenn ihr das Zelt der Begegnung betretet, damit ihr nicht sterbt. Das ist eine ewige Ordnung für eure Generationen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַיִן
  choice: Wein
  rationale: Die übliche Bezeichnung für aus Trauben gewonnenen Wein; der Kontext gibt keinen Anlass zu einer weiteren oder engeren Wiedergabe.
- source_word: שֵׁכָר
  choice: berauschendes Getränk
  rationale: Bezeichnet ein alkoholisches Getränk neben Wein. „Berauschendes Getränk“ bewahrt den weiten Sinn, ohne ihn ungesichert auf Bier oder hochprozentige Getränke zu verengen.
- source_word: אַל תֵּשְׁתְּ
  choice: dürft … nicht trinken
  rationale: אַל mit der Verbform drückt hier ein Verbot aus. Die Formulierung ist in modernem Deutsch klar und besitzt angemessene rechtliche Verbindlichkeit.
- source_word: אַתָּה וּבָנֶיךָ אִתָּךְ
  choice: weder du noch deine Söhne bei dir
  rationale: Gibt beide ausdrücklich genannten Adressaten wieder und erhält mit „bei dir“ die Betonung von אִתָּךְ.
- source_word: בְּבֹאֲכֶם
  choice: wenn ihr … hineingeht
  rationale: Die Präposition בְּ mit dem Infinitiv bezeichnet den Zeitpunkt beziehungsweise Umstand des Hineingehens.
- source_word: אֹהֶל מוֹעֵד
  choice: Zelt der Begegnung
  rationale: Sachlich genaue und im Deutschen verständliche Wiedergabe der Bezeichnung für das Heiligtum; „Begegnung“ lässt die Funktion des Zeltes erkennen.
- source_word: וְלֹא תָמֻתוּ
  choice: damit ihr nicht sterbt
  rationale: Im Anschluss an das Verbot bezeichnet die Klausel die tödliche Folge, die vermieden werden soll. Die deutsche Zweckformulierung bewahrt diese warnende und vorbeugende Nuance.
- source_word: חֻקַּת עוֹלָם
  choice: eine ewige Ordnung
  rationale: Die feste Rechtsformel bezeichnet eine dauerhaft geltende Satzung. „Ordnung“ ist hier natürlicher als das im Deutschen staatsrechtlich gefärbte „Statut“.
- source_word: לְדֹרֹתֵיכֶם
  choice: für alle eure Generationen
  rationale: Gibt die fortdauernde Geltung über die aufeinanderfolgenden Generationen hinweg klar wieder.
theological_decisions:
- issue: Tragweite des Verbots
  choice: Das Verbot wird ausdrücklich auf den Zeitpunkt des Hineingehens in das Zelt der Begegnung bezogen.
  alternative: Ein ausnahmsloses Alkoholverbot für Priester in jeder Lebenslage.
  rationale: Die Zeitangabe בְּבֹאֲכֶם begrenzt das Verbot im vorliegenden Satz. Eine allgemeinere Abstinenzlehre wäre nicht aus diesem Wortlaut abzuleiten.
- issue: Funktion der Todesklausel
  choice: „damit ihr nicht sterbt“
  alternative: „sonst müsst ihr sterben“ / „und ihr werdet nicht sterben“
  rationale: Die gewählte Formulierung erhält den Zusammenhang zwischen Gebot und drohender Todesfolge, ohne die syntaktische Beziehung stärker kausal oder mechanistisch festzulegen, als es der hebräische Text tut.
- issue: Dauer der Ordnung
  choice: „ewige Ordnung für alle eure Generationen“
  alternative: „dauerhafte Ordnung“
  rationale: עוֹלָם besitzt in dieser Rechtsformel eine starke, zeitlich unbeschränkte Aussage. Der Zusatz über die Generationen konkretisiert ihre fortdauernde Geltung, ohne dass die Übersetzung weitergehende systematisch-theologische Folgerungen festlegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rechtlich-verbindlichem Ton. Die Wortstellung stellt Wein und berauschendes Getränk wie im Hebräischen heraus. Keine Fußnoten sind erforderlich, da die wesentlichen Bedeutungsnuancen unmittelbar im Text angemessen wiedergegeben werden.
