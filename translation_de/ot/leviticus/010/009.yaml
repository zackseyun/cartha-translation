revisions:
- from: Wein und berauschendes Getränk dürft weder du noch deine Söhne bei dir trinken, wenn ihr in das Zelt der Begegnung hineingeht, damit ihr nicht sterbt. Das ist eine ewige Ordnung für alle eure Generationen.
  to: Du und deine Söhne dürft keinen Wein und kein berauschendes Getränk trinken, wenn ihr das Zelt der Begegnung betretet, damit ihr nicht sterbt. Das ist eine ewige Ordnung für eure Generationen.
  rationale: Die Revision beseitigt die missverständliche räumlich bzw. haushaltsbezogene Nuance von „bei dir“ und glättet die deutsche Satzstellung. Die zeitliche Begrenzung auf das Betreten des Zeltes, die breite Bedeutung von שֵׁכָר sowie die präventive Warnfunktion der Todesklausel bleiben erhalten. Eine Fußnote ist hierfür nicht erforderlich.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T07:17:34Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Satzglieder, die auf den Eintritt in das Zelt der Begegnung begrenzte Geltung des Verbots und die Warnung vor dem Tod insgesamt zutreffend wieder. „Bei dir“ ist jedoch keine passende Wiedergabe von אִתָּךְ: Im Deutschen kann es eine örtliche oder haushaltsbezogene Einschränkung der Söhne nahelegen, die der hebräische Einschlussausdruck nicht enthält.'
  naturalness: „Wein und berauschendes Getränk dürft weder du noch deine Söhne bei dir trinken“ ist durch die Stellung von „weder … noch“ und besonders „bei dir“ schwerfällig. Eine Satzstellung mit „Du und deine Söhne“ ist modernes, klares Standarddeutsch und schließt beide Adressatengruppen ein.
  terminology: „Wein“, „berauschendes Getränk“ und „Zelt der Begegnung“ sind angemessen. „Ewige Ordnung“ ist als Wiedergabe der Rechtsformel חֻקַּת עוֹלָם möglich; „für eure Generationen“ gibt לְדֹרֹתֵיכֶם idiomatischer wieder als „für alle eure Generationen“.
  issues:
  - severity: medium
    issue: „bei dir“ für אִתָּךְ
    rationale: Die Wendung dient im Hebräischen dazu, Aarons Söhne ausdrücklich in die Anrede einzuschließen. Deutsch „deine Söhne bei dir“ kann hingegen Söhne meinen, die sich bei Aaron befinden oder zu seinem Haushalt gehören. Die Aussage darf nicht so eingeschränkt werden.
  - severity: low
    issue: Unidiomatische Subjekt- und Negationsstellung
    rationale: Die Formulierung „dürft weder du noch deine Söhne bei dir trinken“ ist zwar verständlich, aber weniger flüssig als eine direkte gemeinsame Anrede mit „Du und deine Söhne dürft keinen … trinken“.
  revised_text: Du und deine Söhne dürft keinen Wein und kein berauschendes Getränk trinken, wenn ihr das Zelt der Begegnung betretet, damit ihr nicht sterbt. Das ist eine ewige Ordnung für eure Generationen.
  revised_footnotes: []
  revision_rationale: Die Revision beseitigt die missverständliche räumlich bzw. haushaltsbezogene Nuance von „bei dir“ und glättet die deutsche Satzstellung. Die zeitliche Begrenzung auf das Betreten des Zeltes, die breite Bedeutung von שֵׁכָר sowie die präventive Warnfunktion der Todesklausel bleiben erhalten. Eine Fußnote ist hierfür nicht erforderlich.
