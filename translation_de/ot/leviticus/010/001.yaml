  text: וַ/יִּקְח֣וּ בְנֵֽי אַ֠הֲרֹן נָדָ֨ב וַ/אֲבִיה֜וּא אִ֣ישׁ מַחְתָּת֗/וֹ וַ/יִּתְּנ֤וּ בָ/הֵן֙ אֵ֔שׁ וַ/יָּשִׂ֥ימוּ עָלֶ֖י/הָ קְטֹ֑רֶת וַ/יַּקְרִ֜בוּ לִ/פְנֵ֤י יְהוָה֙ אֵ֣שׁ זָרָ֔ה אֲשֶׁ֧ר לֹ֦א צִוָּ֖ה אֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/001.yaml
  text: Then Nadab and Abihu[a], Aaron’s sons, each took his firepan, put fire in it, placed incense on it, and presented unauthorized fire before Yahweh, which he had not commanded them.
translation:
  language: de
  text: Dann nahmen Nadab und Abihu, die Söhne Aarons, jeweils ihre Feuerpfanne, gaben Feuer hinein, legten Räucherwerk darauf und brachten vor Jahwe unzulässiges Feuer[a] dar, das er ihnen nicht geboten hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „fremdes Feuer“. Die Wendung kann Feuer bezeichnen, das nicht autorisiert war; der folgende Satzteil erklärt, dass Jahwe es ihnen nicht geboten hatte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: nahmen
  rationale: Das erzählende Verb לקח wird in diesem Handlungsablauf natürlich mit „nehmen“ wiedergegeben.
- source_word: בְנֵי אַהֲרֹן נָדָב וַאֲבִיהוּא
  choice: Nadab und Abihu, die Söhne Aarons
  rationale: Die Apposition bewahrt sowohl die Namen als auch die ausdrücklich genannte familiäre Zuordnung.
- source_word: אִישׁ מַחְתָּתוֹ
  choice: jeder seine Feuerpfanne
  rationale: אִישׁ ist hier distributiv („jeder“); מַחְתָּה bezeichnet ein Gefäß zum Tragen von Glut beziehungsweise Feuer. „Feuerpfanne“ ist verständlich und weniger kirchensprachlich als „Räucherfass“.
- source_word: וַיִּתְּנוּ בָהֵן אֵשׁ
  choice: taten Feuer hinein
  rationale: Die pluralische Rückverweisung des Hebräischen wird im Deutschen nach dem distributiven Singular „jeder seine Feuerpfanne“ idiomatisch singularisch aufgenommen.
- source_word: וַיָּשִׂימוּ עָלֶיהָ קְטֹרֶת
  choice: legten Räucherwerk darauf
  rationale: „Räucherwerk“ gibt קְטֹרֶת im kultischen Zusammenhang präzise und allgemein verständlich wieder; der feminine Singularsuffix wird distributiv auf die jeweilige Pfanne bezogen.
- source_word: וַיַּקְרִבוּ לִפְנֵי יְהוָה
  choice: brachten vor Jahwe … dar
  rationale: Der Hifil von קרב hat hier kultische Bedeutung. „Darbringen“ bewahrt diesen Sinn, während „vor Jahwe“ לִפְנֵי eng abbildet.
- source_word: אֵשׁ זָרָה
  choice: unzulässiges Feuer
  rationale: זָרָה bezeichnet im priesterlich-kultischen Zusammenhang etwas, das außerhalb der erlaubten Ordnung steht. „Unzulässig“ verdeutlicht die im folgenden Relativsatz erklärte fehlende göttliche Autorisierung, ohne die Alternativen zu verschweigen.
- source_word: אֲשֶׁר לֹא צִוָּה אֹתָם
  choice: das er ihnen nicht geboten hatte
  rationale: Der Relativsatz und das ausdrückliche Objekt „ihnen“ bleiben erhalten; „gebieten“ passt zum feierlich-rechtlichen Zusammenhang.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehovah
  rationale: Der im hebräischen Text stehende Eigenname wird als „Jahwe“ wiedergegeben. Diese im Deutschen geläufige Form bewahrt den Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Deutung von אֵשׁ זָרָה
  choice: unzulässiges Feuer
  alternative: fremdes Feuer; ungewöhnliches Feuer
  rationale: Der anschließende Satz erklärt die Verfehlung durch das fehlende göttliche Gebot. Die Übersetzung macht daher die kultische Unzulässigkeit deutlich, während die wörtlicheren Möglichkeiten in der Fußnote erhalten bleiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer kultischer Terminologie. Die Satzfolge des Hebräischen bleibt erkennbar, wird aber durch distributive Singularbezüge natürlich ins Deutsche übertragen.
