  text: וַ/יְדַבֵּ֨ר אַהֲרֹ֜ן אֶל מֹשֶׁ֗ה הֵ֣ן הַ֠/יּוֹם הִקְרִ֨יבוּ אֶת חַטָּאתָ֤/ם וְ/אֶת עֹֽלָתָ/ם֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/תִּקְרֶ֥אנָה אֹתִ֖/י כָּ/אֵ֑לֶּה וְ/אָכַ֤לְתִּי חַטָּאת֙ הַ/יּ֔וֹם הַ/יִּיטַ֖ב בְּ/עֵינֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/019.yaml
  text: And Aaron said to Moses[a], “Look, today they presented their sin offering and their burnt offering before Yahweh, and things like these have happened to me. If I had eaten the sin offering today[c][b], would it have been good in the sight of Yahweh?”
translation:
  language: de
  text: 'Da sagte Aaron zu Mose: „Sieh, heute haben sie ihr Sündopfer[a] und ihr Brandopfer vor Jahwe dargebracht, und mir sind solche Dinge widerfahren.[b] Wenn ich heute das Sündopfer gegessen hätte, wäre das in den Augen Jahwes gut gewesen?“[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Reinigungsopfer“ (auch beim zweiten Vorkommen). Das hebräische Wort חַטָּאת kann die Sünde oder das mit Reinigung von Sünde beziehungsweise Unreinheit verbundene Opfer bezeichnen; in den Opfergesetzen ist „Sündopfer“ die herkömmliche Wiedergabe.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „und solche Dinge sind mir widerfahren“. Aaron bezieht sich auf die Unglücksfälle dieses Tages, besonders auf den Tod seiner Söhne.'
    reason: cultural_note
  - marker: c
    text: 'Oder: „Hätte das Jahwe gefallen?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Sieh
  rationale: Die Aufmerksamkeitspartikel leitet Aarons Erklärung ein. „Sieh“ bewahrt ihre Funktion in natürlichem, würdigem Gegenwartsdeutsch.
- source_word: הִקְרִיבוּ
  choice: haben ... dargebracht
  rationale: Der Hifil von קרב bezeichnet im Opferkontext das Darbringen eines Opfers; „darbringen“ ist die übliche und präzise kultische Formulierung.
- source_word: חַטָּאתָם / חַטָּאת
  choice: ihr Sündopfer / das Sündopfer
  rationale: חַטָּאת bezeichnet hier das Opfer und nicht die abstrakte Sünde. „Sündopfer“ ist die verständliche, herkömmliche Wiedergabe; „Reinigungsopfer“ bleibt eine sachlich mögliche Alternative.
- source_word: עֹלָתָם
  choice: ihr Brandopfer
  rationale: עֹלָה bezeichnet im Opfergebrauch das vollständig verbrannte Opfer; „Brandopfer“ ist die etablierte deutsche Bezeichnung.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: Die Wendung bezeichnet das Darbringen in Jahwes Gegenwart. „Vor Jahwe“ bildet die knappe hebräische Form natürlich ab.
- source_word: וַתִּקְרֶאנָה אֹתִי כָּאֵלֶּה
  choice: mir ist so etwas widerfahren
  rationale: Die idiomatische Wiedergabe verweist auf die Unglücksfälle dieses Tages, besonders den Tod von Aarons Söhnen, ohne den Bezug im Haupttext enger festzulegen.
- source_word: וְאָכַלְתִּי
  choice: Wenn ich ... gegessen hätte
  rationale: Das Waw mit Perfekt führt im Zusammenhang in eine rhetorische, kontrafaktische Frage. Der deutsche Konditionalsatz gibt diese Funktion klar wieder.
- source_word: הַיִּיטַב בְּעֵינֵי יְהוָה
  choice: wäre das gut gewesen in den Augen Jahwes?
  rationale: Die Formulierung bewahrt das hebräische Bild und die offene Frage nach göttlicher Billigung, statt sie interpretierend auf „gefallen“ oder „richtig sein“ festzulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben.
theological_decisions:
- issue: Grund von Aarons Verzicht auf den Verzehr des Sündopfers
  choice: Aaron fragt, ob der Verzehr angesichts des ihm widerfahrenen Unglücks vor Jahwe gut gewesen wäre.
  alternative: Aaron könnte entweder auf seinen Trauerzustand, eine mögliche kultische Unangemessenheit oder allgemein auf die mangelnde Angemessenheit des Verzehrs an diesem Tag anspielen.
  rationale: Der hebräische Text verbindet die Ereignisse des Tages mit einer rhetorischen Frage, bestimmt jedoch nicht ausdrücklich, ob Trauer, ritueller Status oder eine umfassendere Frage der Angemessenheit ausschlaggebend ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kultischen Fachbegriffe bleiben erkennbar, während Aarons Rede natürlich klingt. Der Gedankenstrich markiert den Übergang zur rhetorischen Frage; die Deutung seines Zustands wird bewusst offengelassen.
