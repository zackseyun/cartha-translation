  variant: modern standard German
source:
  edition: WLC
  text: שׁ֣וֹק הַ/תְּרוּמָ֞ה וַ/חֲזֵ֣ה הַ/תְּנוּפָ֗ה עַ֣ל אִשֵּׁ֤י הַ/חֲלָבִים֙ יָבִ֔יאוּ לְ/הָנִ֥יף תְּנוּפָ֖ה לִ/פְנֵ֣י יְהוָ֑ה וְ/הָיָ֨ה לְ/ךָ֜ וּ/לְ/בָנֶ֤י/ךָ אִתְּ/ךָ֙ לְ/חָק עוֹלָ֔ם כַּ/אֲשֶׁ֖ר צִוָּ֥ה יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/015.yaml
  text: They shall bring the thigh of the contribution and the breast of the wave offering[a], along with the food offerings of the fat portions, to wave as a wave offering before Yahweh; and it shall be for you and for your sons with you as a permanent statute[d][c][b], just as Yahweh commanded.
translation:
  language: de
  text: Den Schenkel[a] der Abgabe[b] und die Brust der Schwinggabe[c] sollen sie zusammen mit den Feueropfern aus den Fettstücken herbeibringen, um sie vor Jahwe[d] als Schwinggabe darzubringen. Das soll dir und deinen Söhnen bei dir als ewige Ordnung zustehen, ganz wie Jahwe es geboten hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Keule“. Gemeint ist der entsprechende Teil des Hinterlaufs.'
    reason: lexical_alternative
  - marker: b
    text: „Abgabe“ wurde traditionell auch mit „Hebopfer“ wiedergegeben.
    reason: lexical_alternative
  - marker: c
    text: „Schwinggabe“ bezeichnet eine rituelle Darbringung vor Jahwe; möglich ist auch die allgemeinere Wiedergabe „Präsentationsgabe“.
    reason: cultural_note
  - marker: d
    text: „Jahwe“ gibt den hebräischen Gottesnamen JHWH wieder, der traditionell auch mit „der HERR“ wiedergegeben wird.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹק
  choice: Schenkel
  rationale: Bezeichnet hier den Hinterlauf beziehungsweise dessen oberen, dem Priester zugewiesenen Teil. „Schenkel“ ist anatomisch genauer als das allgemeinere „Bein“; „Keule“ ist als Bezeichnung des Fleischstücks ebenfalls möglich.
- source_word: תְּרוּמָה
  choice: Abgabe
  rationale: Das Wort bezeichnet einen ausgesonderten, Gott beziehungsweise den Priestern zugewiesenen Anteil. „Abgabe“ ist verständlich und vermeidet das missverständliche traditionelle Fachwort „Hebopfer“.
- source_word: חָזֶה
  choice: Brust
  rationale: Dies ist die übliche und klare anatomische Bezeichnung im Opferkontext.
- source_word: תְּנוּפָה
  choice: Schwinggabe
  rationale: Bewahrt den Zusammenhang mit dem zugehörigen Verb הניף und bezeichnet die rituelle Darbringung vor Jahwe, ohne zu behaupten, dass jede Einzelheit der Bewegung sicher rekonstruierbar sei.
- source_word: עַל אִשֵּׁי הַחֲלָבִים
  choice: zusammen mit den Feueropfern aus den Fettstücken
  rationale: עַל hat hier begleitenden Sinn. אִשִּׁים bezeichnet im levitischen Kult Opfer, die auf dem Altar verbrannt werden; „Feueropfer“ bildet dies unmittelbar ab, während „Fettstücke“ konkrete Opferteile bezeichnet.
- source_word: לְהָנִיף תְּנוּפָה
  choice: um sie … als Schwinggabe darzubringen
  rationale: Die Verbindung aus Verb und stammverwandtem Substantiv bezeichnet die rituelle Präsentation. Die deutsche Formulierung bleibt natürlich und gibt sowohl Handlung als auch Opferkategorie wieder.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: „Vor“ gibt die kultische Vorstellung der Darbringung in Jahwes Gegenwart knapp und traditionsgemäß wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen als im Deutschen geläufige wissenschaftliche Umschrift wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: וְהָיָה לְךָ וּלְבָנֶיךָ אִתְּךָ
  choice: Sie sollen dir und deinen Söhnen bei dir … zustehen
  rationale: Drückt den Anspruch Aarons und seiner Söhne auf die genannten Opferteile idiomatisch aus. Der Plural „sie“ nimmt die beiden genannten Teile auf; das hebräische Singularverb kann die Zuweisung zusammenfassend behandeln.
- source_word: לְחָק עוֹלָם
  choice: als ewige Ordnung
  rationale: חֹק bezeichnet eine festgesetzte Bestimmung oder Ordnung; עוֹלָם markiert ihre unabsehbare, dauerhafte Geltung. „Ewige Ordnung“ wahrt diese starke zeitliche Aussage, ohne sie erklärend einzuschränken.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה
  choice: ganz wie Jahwe es geboten hat
  rationale: „Ganz wie“ bringt die vergleichende Kraft von כַּאֲשֶׁר und die genaue Übereinstimmung mit dem göttlichen Gebot zum Ausdruck.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen יהוה. „Jahwe“ bewahrt ihn als Namen; die Fußnote informiert über die hebräische Form, ohne sie durch den traditionellen Ersatztitel zu verdecken.
- issue: Kultische Fachbegriffe verständlich und zugleich unterscheidbar wiedergeben
  choice: Abgabe / Schwinggabe / Feueropfer
  alternative: Hebopfer / Webopfer beziehungsweise allgemeinere Formulierungen wie Opfergabe
  rationale: Die gewählten Begriffe halten die verschiedenen hebräischen Kategorien auseinander. „Schwinggabe“ bewahrt zudem den Wortstammzusammenhang mit der rituellen Handlung, während eine Fußnote vor einer zu wörtlichen Rekonstruktion schützt.
- issue: Geltungsdauer von חָק עוֹלָם
  choice: ewige Ordnung
  alternative: dauerhafte Bestimmung
  rationale: Die starke, zeitlich offene Formulierung des Hebräischen wird beibehalten. Der Text selbst legt nicht fest, wie diese Ordnung in späteren heilsgeschichtlichen Zusammenhängen einzuordnen ist; dies wird daher nicht in die Übersetzung eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer kultischer Terminologie. „Herbeibringen“, „darbringen“ und „zustehen“ sind im religiös-rechtlichen Zusammenhang natürlich, ohne unnötig altertümlich zu wirken. Die beiden deutschen Sätze lösen den langen hebräischen Satz lesefreundlich auf.
