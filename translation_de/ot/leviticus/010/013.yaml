  text: וַ/אֲכַלְתֶּ֤ם אֹתָ/הּ֙ בְּ/מָק֣וֹם קָדֹ֔שׁ כִּ֣י חָקְ/ךָ֤ וְ/חָק בָּנֶ֨י/ךָ֙ הִ֔וא מֵ/אִשֵּׁ֖י יְהוָ֑ה כִּי כֵ֖ן צֻוֵּֽיתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/013.yaml
  text: You shall eat it in a holy place[a], because it is your portion and the portion of your sons from the food offerings of Yahweh, for so I have been commanded.
translation:
  language: de
  text: Ihr sollt sie an einem heiligen Ort essen, denn sie ist dein festgesetzter Anteil und der festgesetzte Anteil deiner Söhne von den Feueropfern Jahwes.[a] Denn so ist es mir geboten worden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von den Speisegaben Jahwes“; die genaue Bedeutung der kultischen Bezeichnung ist umstritten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  choice: Ihr sollt … essen
  rationale: Die Verbform richtet sich als verbindliche Anweisung an mehrere männliche Adressaten. „Sollt“ gibt den verpflichtenden Charakter in natürlichem deutschem Rechtssprech wieder; das einleitende Waw muss im Deutschen nicht eigens mit „und“ abgebildet werden.
- source_word: אֹתָהּ
  choice: sie
  rationale: Das feminine Objektsuffix verweist auf die zuvor genannte Opfergabe. Das grammatische Geschlecht bleibt im Pronomen erhalten.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: an einem heiligen Ort
  rationale: Die artikellose hebräische Wendung bezeichnet einen kultisch heiligen Ort, ohne zwingend einen bestimmten Raum des Heiligtums festzulegen.
- source_word: חָקְךָ ... וְחָק בָּנֶיךָ
  choice: dein festgesetzter Anteil und der Anteil deiner Söhne
  rationale: חֹק bezeichnet hier die den Priestern verbindlich zugewiesene Opfergabe. „Festgesetzter Anteil“ bewahrt sowohl den konkreten Anteil als auch den Gedanken einer geregelten Zuweisung.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: von den Feuergaben Jahwes
  rationale: אִשֶּׁה ist eine kultische Bezeichnung für eine auf dem Altar dargebrachte Gabe. „Feuergaben“ ist knapp, quellenah und vermeidet die irreführende Vorstellung, die ganze Gabe müsse verbrannt werden.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: כִּי כֵן צֻוֵּיתִי
  choice: Denn so ist es mir geboten worden
  rationale: Die Formulierung erhält die begründende Verknüpfung, das passive Verb und Moses als Empfänger des göttlichen Gebots.
theological_decisions:
- issue: Bedeutung von חֹק im priesterlichen Zusammenhang
  choice: festgesetzter Anteil
  alternative: Satzung; Gebühr; Zuteilung
  rationale: Im Zusammenhang geht es konkret um den den Priestern zugewiesenen Anteil an den Opfergaben. Zugleich lässt „festgesetzt“ den rechtlich angeordneten Charakter des Wortes erkennen.
- issue: Wiedergabe von אִשֵּׁי יְהוָה
  choice: Feuergaben Jahwes
  alternative: Speisegaben Jahwes; für Jahwe im Feuer dargebrachte Opfer
  rationale: Die genaue Etymologie und Bedeutungsentwicklung der kultischen Bezeichnung ist umstritten. „Feuergaben“ hält die traditionelle Verbindung mit dem Altarfeuer fest, während die Fußnote die in neueren Übersetzungen vertretene funktionale Wiedergabe nennt.
- issue: Referent von בָנֶיךָ
  choice: deine Söhne
  alternative: deine Kinder; deine Nachkommen
  rationale: Der hebräische Text nennt ausdrücklich Aarons Söhne im Zusammenhang des männlichen Priesterdienstes. Eine geschlechtsneutrale Erweiterung würde die kultische Spezifik verwischen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kultisch-priesterlichem Wortschatz. Die Anrede wechselt entsprechend dem Hebräischen vom pluralischen „ihr“ beim Gebot zum singularischen „dein“ für Aaron und seine Söhne. Der Fußnotenmarker steht bei der tatsächlich erläuterten Wendung „Feuergaben Jahwes“.
