  text: מַדּ֗וּעַ לֹֽא אֲכַלְתֶּ֤ם אֶת הַֽ/חַטָּאת֙ בִּ/מְק֣וֹם הַ/קֹּ֔דֶשׁ כִּ֛י קֹ֥דֶשׁ קָֽדָשִׁ֖ים הִ֑וא וְ/אֹתָ֣/הּ נָתַ֣ן לָ/כֶ֗ם לָ/שֵׂאת֙ אֶת עֲוֺ֣ן הָ/עֵדָ֔ה לְ/כַפֵּ֥ר עֲלֵי/הֶ֖ם לִ/פְנֵ֥י יְהוָֽה־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/017.yaml
  text: Why did you not eat the sin offering in the holy place? For it is most holy[a], and he has given it to you to bear the iniquity of the congregation, to make atonement for them before Yahweh.
translation:
  language: de
  text: Warum habt ihr das Sündopfer[a] nicht an heiliger Stätte gegessen? Denn es ist hochheilig, und Jahwe hat es euch gegeben, damit ihr die Schuld der Gemeinschaft tragt und vor Jahwe Sühne für sie erwirkt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Reinigungsopfer“. Das hebräische Wort חַטָּאת kann ein Opfer bezeichnen, das sowohl mit Sünde als auch mit der Beseitigung kultischer Unreinheit zusammenhängt.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: מַדּוּעַ לֹא אֲכַלְתֶּם
  choice: Warum habt ihr … nicht gegessen?
  rationale: Gibt die direkte Frage nach dem Grund und den vorwurfsvollen Rückblick des hebräischen Perfekts in natürlichem Deutsch wieder.
- source_word: הַחַטָּאת
  choice: das Sündopfer
  rationale: Im Opferkontext bezeichnet חַטָּאת sicher ein Opfer; „Sündopfer“ ist die geläufige deutsche Wiedergabe. Die ebenfalls mögliche funktionale Deutung als „Reinigungsopfer“ bleibt in der Fußnote erhalten.
- source_word: בִּמְקוֹם הַקֹּדֶשׁ
  choice: an heiliger Stätte
  rationale: Bezeichnet den vorgeschriebenen heiligen Bereich, in dem die Priester das Opfer essen sollten, ohne mit „dem Heiligen“ als besonderem Teil des Heiligtums verwechselt zu werden.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: hochheilig
  rationale: Gibt die hebräische Superlativkonstruktion knapp und idiomatisch wieder und bezeichnet den höchsten kultischen Heiligkeitsgrad.
- source_word: נָתַן לָכֶם
  choice: er hat es euch gegeben
  rationale: Bewahrt das maskuline Verb mit seinem im Kontext erschließbaren göttlichen Subjekt, ohne den Gottesnamen in den Text einzufügen.
- source_word: לָשֵׂאת אֶת עֲוֺן הָעֵדָה
  choice: damit ihr die Schuld der Gemeinschaft tragt
  rationale: „Schuld tragen“ erhält die Mehrdeutigkeit von נשא עון zwischen dem Tragen von Schuld, ihrer Last und den damit verbundenen Folgen, ohne den kultischen Vorgang näher festzulegen.
- source_word: הָעֵדָה
  choice: die Gemeinschaft
  rationale: Bezeichnet hier die versammelte Bundesgemeinschaft Israels; „Gemeinschaft“ ist gegenwärtiges, allgemein verständliches Deutsch.
- source_word: לְכַפֵּר עֲלֵיהֶם
  choice: Sühne für sie erwirkt
  rationale: Gibt die kultische Funktion von כפר in natürlichem und würdigem Deutsch wieder, ohne einen bestimmten Mechanismus der Sühne zu definieren.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: „Vor“ bewahrt den räumlich-kultischen Sinn; „Jahwe“ gibt den im WLC ausdrücklich stehenden Gottesnamen wieder.
theological_decisions:
- issue: Bedeutung von חַטָּאת in der Opfergesetzgebung
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: Dass ein Opfer gemeint ist, steht durch den Zusammenhang fest. Die traditionelle Bezeichnung „Sündopfer“ bleibt im Haupttext, während die reinigende Funktion als echte lexikalische Alternative in der Fußnote genannt wird.
- issue: Nicht ausdrücklich genanntes Subjekt von נָתַן
  choice: „er“, im Zusammenhang auf Gott bezogen
  alternative: „es ist euch gegeben worden“
  rationale: Das Hebräische hat ein Verb in der 3. Person Singular ohne ausdrückliches Subjekt. Der Zusammenhang legt Gott nahe; die persönliche Form bleibt erhalten, ohne „Gott“ ergänzend einzusetzen.
- issue: Priesterliches Tragen der Schuld der Gemeinschaft
  choice: die Formulierung „die Schuld … tragen“ ohne nähere Erklärung bewahren
  alternative: die Schuld beseitigen oder die Strafe stellvertretend tragen
  rationale: נשא עון ist theologisch und semantisch spannungsreich. Die Übersetzung legt weder ausschließlich Beseitigung noch Strafübernahme fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Hochheilig“ wahrt die kultische Fachsprache, während „an heiliger Stätte“ eine missverständliche Gleichsetzung mit einem bestimmten Heiligtumsraum vermeidet. Die Satzverknüpfung „doch“ lässt den begründenden und zugleich vorwurfsvollen Ton erkennen.
