id: LEV.10.11
reference: Leviticus 10:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/לְ/הוֹרֹ֖ת אֶת בְּנֵ֣י יִשְׂרָאֵ֑ל אֵ֚ת כָּל הַ֣/חֻקִּ֔ים אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה אֲלֵי/הֶ֖ם בְּ/יַד מֹשֶֽׁה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/011.yaml
  text: and to teach the sons of Israel all the statutes that Yahweh has spoken to them by the hand of Moses[a].
translation:
  language: de
  text: und die Israeliten alle Ordnungen zu lehren, die Jahwe ihnen durch Mose[a] verkündet hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »durch die Hand Moses«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְהוֹרֹת
  choice: und … zu lehren
  rationale: Die Konjunktion mit dem Hifil-Infinitiv setzt die priesterlichen Pflichten aus dem vorherigen Vers fort. »Lehren« gibt die Bedeutung klar und natürlich wieder.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die wörtliche Form lautet »Söhne Israels«, bezeichnet hier aber das ganze Bundesvolk. »Die Israeliten« ist im modernen Deutschen natürlich und schließt den gesamten Adressatenkreis ein.
- source_word: כָּל הַחֻקִּים
  choice: alle Ordnungen
  rationale: חֻקִּים bezeichnet verbindlich festgesetzte Bestimmungen. »Ordnungen« wahrt den rechtlich-bundestheologischen Ton und ist verständlicher als das mögliche »Satzungen«.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֲלֵיהֶם
  choice: die Jahwe ihnen … verkündet hat
  rationale: Das Verb דִּבֶּר bedeutet grundsätzlich »reden/sprechen«; in Bezug auf verbindliche göttliche Ordnungen gibt »verkündet« den kommunikativen und autoritativen Sinn im Deutschen natürlich wieder. Das Perfekt wird mit gegenwartsrelevantem Perfekt übersetzt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּיַד מֹשֶׁה
  choice: durch Mose
  rationale: Die hebräische Wendung lautet wörtlich »durch die Hand Moses« und bezeichnet Mose als Vermittler. »Durch Mose« ist die idiomatische deutsche Wiedergabe; die wörtlichere Form bleibt in der Fußnote erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen. »Jahwe« bewahrt diesen, statt ihn durch den Titel »der HERR« zu ersetzen.
- issue: Korporative Bezeichnung בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: Die Wendung ist grammatisch maskulin, bezeichnet hier jedoch das gesamte Bundesvolk. Die natürliche deutsche Kollektivbezeichnung vermeidet die irreführende Einschränkung auf männliche Personen.
- issue: Moses vermittelnde Rolle in בְּיַד מֹשֶׁה
  choice: durch Mose
  alternative: durch die Hand Moses
  rationale: Die Übersetzung bewahrt die Aussage, dass Jahwes Ordnungen durch Moses Vermittlung an Israel ergingen, ohne aus der idiomatischen Wendung eine weitergehende theologische Aussage abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt als Fortsetzung des vorherigen Verses mit »und« sowie einer Infinitivkonstruktion offen. Rechtlicher Ton durch »Ordnungen«, natürliche Vermittlungsformel durch »durch Mose«.
