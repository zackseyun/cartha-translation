  terminology: „Jahwe“ wahrt den Gottesnamen. „Israeliten“, „Ordnungen“ und „durch Mose“ sind idiomatisch, registergerecht und dem Kontext angemessen. Die Fußnote dokumentiert die wörtliche hebräische Vermittlungsformel; ihr Marker ist korrekt an „Mose“ verankert.
