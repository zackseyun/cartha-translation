  to: 'Auch die Brust des Schwingopfers[a] und den Schenkel der Hebegabe[b] sollt ihr an einem reinen Ort essen: du und deine Söhne und Töchter mit dir; denn sie sind dir als dein festgesetzter Anteil und deinen Söhnen als der ihre von den Heilsopfern[c] der Söhne Israels gegeben worden.'
  rationale: Die Revision wahrt alle im Hebräischen ausgedrückten Elemente, einschließlich der fortführenden Konjunktion und der getrennt genannten Anteile Aarons und seiner Söhne. Zugleich verbessert sie die deutsche Satzführung und verwendet mit „Schenkel“ die präzisere Bezeichnung für den Opferteil. Die Fußnotenanker bleiben jeweils bei dem einschlägigen Ausdruck.
