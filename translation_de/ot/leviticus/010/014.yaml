reference: Leviticus 10:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אֵת֩ חֲזֵ֨ה הַ/תְּנוּפָ֜ה וְ/אֵ֣ת שׁ֣וֹק הַ/תְּרוּמָ֗ה תֹּֽאכְלוּ֙ בְּ/מָק֣וֹם טָה֔וֹר אַתָּ֕ה וּ/בָנֶ֥י/ךָ וּ/בְנֹתֶ֖י/ךָ אִתָּ֑/ךְ כִּֽי חָקְ/ךָ֤ וְ/חָק בָּנֶ֨י/ךָ֙ נִתְּנ֔וּ מִ/זִּבְחֵ֥י שַׁלְמֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/014.yaml
  text: And you[a], and your sons and your daughters with you, shall eat the breast of the wave offering and the thigh of the contribution in a clean place[c][b], because they have been given as your portion and your sons’ portion from the sacrifices of the peace offerings of the sons of Israel.
translation:
  language: de
  text: 'Auch die Brust des Schwingopfers[a] und den Schenkel der Hebegabe[b] sollt ihr an einem reinen Ort essen: du und deine Söhne und Töchter mit dir; denn sie sind dir als dein festgesetzter Anteil und deinen Söhnen als der ihre von den Heilsopfern[c] der Söhne Israels gegeben worden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Brust des Darbringungsopfers“. Der hebräische Ausdruck bezeichnet den Anteil, der vor dem HERRN rituell hin- und herbewegt wurde.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der Schenkel des Hebopfers“. Das hebräische Wort bezeichnet etwas, das emporgehoben oder als priesterlicher Anteil ausgesondert wird.'
    reason: lexical_alternative
  - marker: c
    text: Auch „Friedensopfer“; der hebräische Ausdruck kann Frieden, Wohlergehen und Ganzsein anklingen lassen. „Gemeinschaftsopfer“ ist eine weitere, stärker deutende Wiedergabe.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲזֵה הַתְּנוּפָה
  choice: die Brust des Schwingopfers
  rationale: חֲזֶה bezeichnet die Brustpartie des Tieres; תְּנוּפָה die rituelle Bewegung beziehungsweise Darbringung vor dem HERRN. „Schwingopfer“ bewahrt den konkreten kultischen Ausdruck.
- source_word: שׁוֹק הַתְּרוּמָה
  choice: die Keule der Abgabe
  rationale: שׁוֹק bezeichnet hier den als Opferanteil bestimmten Schenkel beziehungsweise die Keule. תְּרוּמָה ist eine abgehobene oder ausgesonderte Gabe; „Abgabe“ macht im Zusammenhang den priesterlichen Anspruch verständlich.
- source_word: תֹּאכְלוּ
  choice: sollt ihr essen
  rationale: Das Imperfekt hat hier anweisende Kraft. „Sollt ihr essen“ gibt die rechtliche Weisung in natürlichem modernem Deutsch wieder.
- source_word: בְּמָקוֹם טָהוֹר
  choice: an einem reinen Ort
  rationale: טָהוֹר bezeichnet im levitischen Zusammenhang kultische Reinheit. „Rein“ erhält diese Terminologie, ohne sie im Haupttext erklärend auszuweiten.
- source_word: אַתָּה וּבָנֶיךָ וּבְנֹתֶיךָ אִתָּךְ
  choice: du und mit dir deine Söhne und deine Töchter
  rationale: Die ausdrücklich genannten Söhne und Töchter sowie אִתָּךְ „mit dir“ werden vollständig bewahrt. Die deutsche Wortstellung stellt klar, dass das pluralische Verb die ganze Gruppe einschließt.
- source_word: חָקְךָ וְחָק בָּנֶיךָ
  choice: dir und deinen Söhnen als festgesetzter Anteil
  rationale: חֹק bezeichnet hier nicht primär eine Satzung, sondern den verbindlich zugewiesenen priesterlichen Anteil. „Festgesetzter Anteil“ bewahrt beide Bedeutungsaspekte.
- source_word: נִתְּנוּ
  choice: sind … gegeben worden
  rationale: Das passive Perfekt bezeichnet eine vollzogene Zuweisung mit fortbestehender Geltung.
- source_word: מִזִּבְחֵי שַׁלְמֵי
  choice: von den Heilsopfern
  rationale: זִבְחֵי שְׁלָמִים bezeichnet Schlachtopfer der Kategorie שְׁלָמִים. „Heilsopfer“ ist im Deutschen ein etablierter kultischer Ausdruck und lässt das Bedeutungsfeld von Frieden, Wohlergehen und Ganzsein weiter offen als „Gemeinschaftsopfer“.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: der Söhne Israels
  rationale: Die formale hebräische Volksbezeichnung wird erhalten. Sie bezeichnet Israel kollektiv, bleibt aber in ihrer ausdrücklich filialen Form sichtbar.
theological_decisions:
- issue: Wiedergabe von שְׁלָמִים
  choice: Heilsopfer
  alternative: Friedensopfer; Gemeinschaftsopfer
  rationale: „Heilsopfer“ wahrt im Deutschen das breite Bedeutungsfeld von Frieden, Wohlergehen und Ganzsein. „Gemeinschaftsopfer“ würde einen einzelnen theologischen Aspekt stärker hervorheben und den Ausdruck verengen.
- issue: Wiedergabe der Volksbezeichnung בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  alternative: Israeliten; Volk Israel
  rationale: Die hebräische Form wird bewahrt, ohne ihre kollektive Bedeutung auf männliche Einzelpersonen zu beschränken.
- issue: Reichweite des priesterlichen Anteils
  choice: dir und deinen Söhnen als festgesetzter Anteil
  alternative: dein Recht und das Recht deiner Söhne; dein Anteil und der Anteil deiner Söhne
  rationale: Die Formulierung gibt die verbindliche Zuweisung wieder, ohne חֹק ausschließlich als abstrakte Rechtsvorschrift oder bloße Essensportion zu deuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit maßvoll beibehaltener levitischer Fachsprache. Die Verb-Erststruktur des Englischen wurde nicht übernommen; der deutsche Satz folgt einer natürlichen Anordnung, bewahrt jedoch alle ausdrücklich genannten Beteiligten und die kultischen Unterscheidungen.
