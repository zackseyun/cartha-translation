    rationale: '„… sollt ihr … essen, du und mit dir deine Söhne und deine Töchter“ verbindet ein pluralisches Verb mit einer nachgestellten, durch „du“ eingeleiteten Subjektgruppe. Die Konstruktion ist im modernen Deutschen unnötig holprig. „Ihr sollt … essen: du und deine Söhne und Töchter mit dir“ gibt die hebräische Gruppierung klar wieder.'
  - severity: low
    issue: Anfängliche Konjunktion nicht berücksichtigt
    rationale: Das einleitende וְ verbindet den Vers mit der vorangehenden Anweisung. „Auch“ bildet diese Fortführung im Deutschen idiomatisch ab, ohne eine stärkere logische Beziehung einzutragen.
  - severity: low
    issue: „Keule“ für שׁוֹק weniger präzise
    rationale: שׁוֹק bezeichnet den Schenkel bzw. das Bein als Opferanteil. „Schenkel“ ist im kultisch-anatomischen Kontext genauer und weniger an einen modernen Fleischzuschnitt gebunden.
  - severity: low
    issue: Die jeweiligen Anteile von Aaron und seinen Söhnen werden nicht ganz explizit unterschieden
