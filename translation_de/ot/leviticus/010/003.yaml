  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן הוּא֩ אֲשֶׁר דִּבֶּ֨ר יְהוָ֤ה לֵ/אמֹר֙ בִּ/קְרֹבַ֣/י אֶקָּדֵ֔שׁ וְ/עַל פְּנֵ֥י כָל הָ/עָ֖ם אֶכָּבֵ֑ד וַ/יִּדֹּ֖ם אַהֲרֹֽן־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/003.yaml
  text: 'Then Moses said to Aaron[a], “This is what Yahweh spoke, saying: ‘Among those who come near me I will be sanctified[b], and before all the people I will be glorified.’” And Aaron was silent.'
translation:
  language: de
  text: 'Da sagte Mose zu Aaron: »Das ist es, was Jahwe gesagt hat: ›An denen, die mir nahen, werde ich mich als heilig erweisen[a], und vor dem ganzen Volk werde ich verherrlicht werden[b].‹« Und Aaron schwieg.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Von denen, die mir nahen, werde ich als heilig anerkannt werden.« Das Hebräische kann sowohl ausdrücken, dass Gottes Heiligkeit an ihnen offenbar wird, als auch, dass sie ihn als heilig anerkennen und entsprechend behandeln.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »werde ich geehrt werden.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הוּא אֲשֶׁר דִּבֶּר יְהוָה
  choice: Das ist es, was Jahwe gesagt hat
  rationale: Die identifizierende Wendung wird eng am Hebräischen und zugleich in natürlichem Deutsch wiedergegeben.
- source_word: בִּקְרֹבַי
  choice: an denen, die mir nahen
  rationale: Die Form bezeichnet diejenigen, die sich Gott im priesterlichen Dienst oder Gottesdienst nahen, ohne sie ausdrücklich auf Priester einzugrenzen.
- source_word: אֶקָּדֵשׁ
  choice: werde ich mich als heilig erweisen
  rationale: Die Wiedergabe lässt die Nifal-Bedeutung als Offenbarwerden beziehungsweise Anerkanntwerden der Heiligkeit Gottes anklingen und bleibt verständlicher als »geheiligt werden«.
- source_word: וְעַל פְּנֵי כָל הָעָם
  choice: vor dem ganzen Volk
  rationale: Dies gibt die öffentliche Dimension der hebräischen Wendung idiomatisch wieder.
- source_word: אֶכָּבֵד
  choice: werde ich verherrlicht werden
  rationale: Das Nifal von כבד bezeichnet hier das öffentliche Empfangen von Herrlichkeit beziehungsweise Ehre.
- source_word: וַיִּדֹּם
  choice: schwieg
  rationale: Die knappe Form bewahrt die feierliche Wucht von Aarons Reaktion; der mögliche Nebenton des Erstarrens wird nicht überinterpretiert.
theological_decisions:
- issue: Wie Gottes Heiligkeit im Verhältnis zu denen ausgedrückt wird, die ihm nahen
  choice: An denen, die mir nahen, werde ich mich als heilig erweisen
  alternative: Von denen, die mir nahen, werde ich als heilig anerkannt werden
  rationale: Das Hebräische kann sowohl die Offenbarung der Heiligkeit Gottes an den ihm Nahenden als auch ihre Anerkennung seiner Heiligkeit ausdrücken. Der Haupttext wahrt Gottes Initiative; die Fußnote erhält die andere mögliche Nuance.
- issue: Wie אֶכָּבֵד als öffentliche Ehrung Gottes wiedergegeben wird
  choice: werde ich verherrlicht werden
  alternative: werde ich geehrt werden
  rationale: »Verherrlicht« bewahrt das Gewicht von כבד in Bezug auf Gott; »geehrt« ist als verständliche lexikalische Alternative vermerkt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dichterische Parallelität der Gottesrede bleibt erhalten. »Nahen« ist bewusst leicht gehoben, aber im kultischen Zusammenhang klar und prägnant; »schwieg« bewahrt den abrupten, ernsten Schluss.
