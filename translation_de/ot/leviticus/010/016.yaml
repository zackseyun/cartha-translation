  text: וְ/אֵ֣ת שְׂעִ֣יר הַֽ/חַטָּ֗את דָּרֹ֥שׁ דָּרַ֛שׁ מֹשֶׁ֖ה וְ/הִנֵּ֣ה שֹׂרָ֑ף וַ֠/יִּקְצֹף עַל אֶלְעָזָ֤ר וְ/עַל אִֽיתָמָר֙ בְּנֵ֣י אַהֲרֹ֔ן הַ/נּוֹתָרִ֖ם לֵ/אמֹֽר׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/016.yaml
  text: Moses diligently searched for the goat of the sin offering[a], and behold, it had been burned up. So he was angry with Eleazar and with Ithamar, Aaron’s remaining sons, saying[c][b],
translation:
  language: de
  text: 'Mose suchte sorgfältig nach dem Ziegenbock des Sündopfers[a], und siehe, er war verbrannt[b]. Da wurde er zornig über Eleasar und Itamar, die übrig gebliebenen Söhne Aarons[c], und sagte:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Mose suchte und suchte nach dem Ziegenbock des Sündopfers.“ Im Hebräischen wird die Verbform durch einen vorangestellten Infinitiv verstärkt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „er war vollständig verbrannt.“ Das Hebräische beschreibt den Ziegenbock in seinem verbrannten Zustand.'
    reason: lexical_alternative
  - marker: c
    text: Mit den „übrig gebliebenen Söhnen Aarons“ sind Eleasar und Itamar gemeint, die nach dem Tod Nadabs und Abihus noch lebten (3. Mose 10,1–2.12).
    reason: cross_reference
lexical_decisions:
- source_word: שְׂעִיר הַחַטָּאת
  choice: der Ziegenbock des Sündopfers
  rationale: שְׂעִיר bezeichnet einen männlichen Ziegenbock; die Verbindung mit הַחַטָּאת benennt ihn als das Tier des Sündopfers. Diese Formulierung ist präzise und im Deutschen natürlich.
- source_word: דָּרֹשׁ דָּרַשׁ
  choice: suchte sorgfältig nach
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt die Aussage. „suchte sorgfältig nach“ gibt diesen Nachdruck idiomatisch wieder, ohne die hebräische Wortwiederholung künstlich nachzuahmen.
- source_word: וְהִנֵּה
  choice: und siehe
  rationale: הִנֵּה lenkt die Aufmerksamkeit auf die überraschende Feststellung. „und siehe“ bewahrt diese Erzählfunktion und den würdigen Ton.
- source_word: שֹׂרָף
  choice: er war verbrannt worden
  rationale: Das passive Partizip bezeichnet den vorgefundenen Zustand des Ziegenbocks. Das Plusquamperfekt macht deutlich, dass das Verbrennen der Entdeckung vorausging, ohne im Haupttext ausdrücklich eine vollständige Verbrennung festzulegen.
- source_word: וַיִּקְצֹף
  choice: da wurde er zornig
  rationale: Das Verb bezeichnet starken Unmut oder Zorn. „wurde zornig“ gibt sowohl den Eintritt der Reaktion als auch ihre angemessene Stärke wieder.
- source_word: הַנּוֹתָרִם
  choice: die verbliebenen
  rationale: Das Partizip kennzeichnet Eleasar und Itamar als die nach dem Tod Nadabs und Abihus noch übrig gebliebenen Söhne Aarons. „verbliebenen“ ist knapp und lässt den Zusammenhang durch die Fußnote erklären.
- source_word: לֵאמֹר
  choice: 'und sagte:'
  rationale: Der übliche hebräische Redeeinleiter wird im modernen Deutschen natürlich als Einleitung der im nächsten Vers folgenden direkten Rede wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Und siehe“ ist bewusst leicht gehoben, um die aufmerksamkeitslenkende Funktion von הִנֵּה zu bewahren. Die Opferterminologie bleibt mit „Sündopfer“ sachlich und traditionsübergreifend.
