  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/008.yaml
  text: And Yahweh spoke to Aaron[a], saying,
translation:
  language: de
  text: 'Und Jahwe sprach zu Aaron:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Und … sprach
  rationale: Das Waw mit der Verbform führt die Erzählung fort. „Sprach“ entspricht דבר in der Einleitungsformel für eine Gottesrede und vermeidet die unnötige Doppelung „sprach … und sagte“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird in der im Deutschen üblichen wissenschaftlichen Form „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition bezeichnet hier den Adressaten der Rede; „zu Aaron sprechen“ ist die natürliche deutsche Verbindung.
- source_word: אַהֲרֹן
  choice: Aaron
  rationale: Der Personenname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv leitet den Inhalt der folgenden Rede ein. Im natürlichen Deutschen erfüllt ein Doppelpunkt diese Funktion, ohne die hebräische Formel schwerfällig mit „indem er sagte“ nachzubilden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen und ist die geläufige deutsche Wiedergabe; eine Ersetzung durch „der HERR“ würde aus dem Namen einen Titel machen.
translation_notes:
  register: Knappes, würdevolles modernes Standarddeutsch. Die formelhafte hebräische Redeeinleitung wird natürlich wiedergegeben; der Doppelpunkt kündigt die in Vers 9 folgende direkte Rede an.
