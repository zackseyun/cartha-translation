source:
  edition: WLC
  text: וּֽ/לֲ/הַבְדִּ֔יל בֵּ֥ין הַ/קֹּ֖דֶשׁ וּ/בֵ֣ין הַ/חֹ֑ל וּ/בֵ֥ין הַ/טָּמֵ֖א וּ/בֵ֥ין הַ/טָּהֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/010.yaml
  text: to distinguish between the holy and the common[a], and between the unclean and the clean[b],
translation:
  language: de
  text: und zwischen dem Heiligen und dem Nichtheiligen[a] sowie zwischen dem Unreinen und dem Reinen[b] zu unterscheiden,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem Heiligen und dem Profanen“. Gemeint ist der Gegensatz zwischen dem, was als heilig ausgesondert ist, und dem, was nicht heilig ist; „nichtheilig“ bedeutet hier nicht zwangsläufig ehrfurchtslos oder sündig.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: zwischen rituell unrein und rituell rein.'
    reason: cultural_note
lexical_decisions:
- source_word: וּלֲהַבְדִּיל
  choice: und … zu unterscheiden
  rationale: Der Infinitiv mit Präposition führt die Zweckangabe aus dem vorherigen Vers fort. „Unterscheiden“ gibt die Aufgabe priesterlicher Beurteilung natürlich und genau wieder.
- source_word: בֵּין
  choice: zwischen
  rationale: Die Präposition kennzeichnet in der wiederholten Konstruktion den Gegensatz zwischen jeweils zwei Kategorien.
- source_word: הַקֹּדֶשׁ
  choice: dem Heiligen
  rationale: Das substantivierte Adjektiv bezeichnet hier die Kategorie dessen, was Gott geweiht und ausgesondert ist, ohne einen bestimmten Gegenstand festzulegen.
- source_word: הַחֹל
  choice: dem Nichtheiligen
  rationale: Der Ausdruck bezeichnet im Gegensatz zum Heiligen das, was nicht für den heiligen Bereich ausgesondert ist. „Nichtheilig“ vermeidet die heute oft abwertenden oder moralischen Nebenbedeutungen von „profan“.
- source_word: הַטָּמֵא
  choice: dem Unreinen
  rationale: Im Kontext des Levitikus bezeichnet der Ausdruck vor allem einen kultisch-rituellen Status und nicht notwendig moralische Schuld.
- source_word: הַטָּהוֹר
  choice: dem Reinen
  rationale: „Rein“ bildet den üblichen und sachlich passenden Gegenbegriff zu „unrein“ in den Reinheitsbestimmungen des Levitikus.
theological_decisions:
- issue: Wiedergabe des priesterlichen Gegensatzes חֹל und קֹדֶשׁ
  choice: das Heilige und das Nichtheilige
  alternative: das Heilige und das Profane; das Heilige und das Gewöhnliche
  rationale: „Nichtheilig“ bewahrt den kultischen Gegensatz zwischen dem Gott Geweihten und dem nicht dazu Ausgesonderten, ohne dem zweiten Bereich zwingend Respektlosigkeit oder Sündhaftigkeit zuzuschreiben.
- issue: Bedeutung der Kategorien טָמֵא und טָהוֹר
  choice: unrein und rein als rituelle Kategorien
  alternative: unlauter und lauter; verunreinigt und rein
  rationale: Im priesterlichen Zusammenhang bezeichnen die Wörter primär den kultisch-rituellen Status. Die Formulierung lässt diesen sachlichen Rahmen bestehen und setzt Unreinheit nicht pauschal mit moralischer Schuld gleich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die substantivierten Adjektive erhalten den kategorialen Charakter des Hebräischen. „Sowie“ macht die parallelen Gegensatzpaare gut lesbar; die Infinitivkonstruktion bewahrt den syntaktischen Anschluss an den vorherigen Vers.
