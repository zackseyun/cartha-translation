base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/006.yaml
  text: And Moses said to Aaron and to Eleazar and Ithamar his sons[a], “Do not let your heads hang loose, and do not tear your garments, so that you do not die and he become angry with all the congregation. But your brothers, the whole house of Israel[b], shall weep for the burning that Yahweh has kindled.”
translation:
  language: de
  text: 'Und Mose sagte zu Aaron und zu dessen Söhnen Eleasar und Itamar: »Lasst euer Haar nicht ungeordnet herabhängen[a] und zerreißt eure Gewänder nicht, damit ihr nicht sterbt und damit nicht Zorn über die ganze Gemeinde kommt. Doch eure Brüder, das ganze Haus Israel, sollen über den Brand weinen, den Yahweh entfacht hat.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Entblößt eure Köpfe nicht.« Das Hebräische bezeichnet ein Trauerzeichen, das Kopf beziehungsweise Haar betrifft; wahrscheinlich ist ungeordnetes oder frei hängendes Haar gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁיכֶם אַל תִּפְרָעוּ
  choice: Lasst euer Haar nicht ungeordnet hängen
  rationale: פרע bezeichnet hier ein Ungeordnet- oder Freihängenlassen des Haupthaars als Trauerzeichen. Die Übersetzung gibt den Vorgang verständlich wieder, ohne die umstrittene Deutung als bloßes Abnehmen einer Kopfbedeckung festzuschreiben.
- source_word: וּבִגְדֵיכֶם לֹא תִפְרֹמוּ
  choice: zerreißt eure Gewänder nicht
  rationale: פרם bezeichnet das Zerreißen von Kleidung, besonders als Trauergeste; „Gewänder“ wahrt den würdigen kultischen Kontext.
- source_word: וְלֹא תָמֻתוּ
  choice: damit ihr nicht sterbt
  rationale: Die Folge der Verbote wird in natürlichem modernem Deutsch als eindringliche Warnung ausgedrückt.
- source_word: וְעַל כָּל הָעֵדָה יִקְצֹף
  choice: und Zorn über die ganze Gemeinde kommt
  rationale: Da das hebräische Verb kein ausdrücklich genanntes Subjekt hat, vermeidet diese Fassung die Ergänzung eines Pronomens und erhält die im Ausgangstext bestehende Offenheit, während der Kontext göttlichen Zorn nahelegt.
- source_word: וַאֲחֵיכֶם כָּל בֵּית יִשְׂרָאֵל
  choice: eure Brüder, das ganze Haus Israel
  rationale: „Brüder“ entspricht der maskulinen Pluralform; die Apposition „das ganze Haus Israel“ erklärt den umfassenden nationalen Bezug.
- source_word: יִבְכּוּ אֶת הַשְּׂרֵפָה
  choice: sollen über den Brand weinen
  rationale: „Brand“ bewahrt das konkrete Bild des durch Feuer bewirkten Geschehens und vermeidet eine deutende Verallgemeinerung wie „Unglück“ oder „Gericht“.
- source_word: אֲשֶׁר שָׂרַף יְהוָה
  choice: den Yahweh entfacht hat
  rationale: „Entfacht“ gibt die figura etymologica natürlicher wieder als „den Brand, den ... verbrannt hat“ und lässt Yahwehs unmittelbare Urheberschaft bestehen.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Subjekt von יִקְצֹף
  choice: Zorn über die ganze Gemeinde kommt
  alternative: er über die ganze Gemeinde zornig wird
  rationale: Der unmittelbare Kontext legt Yahweh als Handelnden nahe, doch der hebräische Satz nennt das Subjekt nicht ausdrücklich. Die gewählte deutsche Fassung wahrt diese syntaktische Zurückhaltung.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR
  rationale: Die Transliteration bewahrt den im hebräischen Text ausdrücklich verwendeten persönlichen Gottesnamen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt klar und eindringlich; kultische Begriffe wie „Gewänder“, „Gemeinde“ und „Haus Israel“ bewahren den biblischen Registerton, ohne altertümliche Syntax zu verwenden.
