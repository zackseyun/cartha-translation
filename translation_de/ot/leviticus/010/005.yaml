  yaml_path: translation/ot/leviticus/010/005.yaml
  text: So they came near and carried them in their tunics to outside the camp[a], just as Moses had said.
translation:
  language: de
  text: Da traten sie heran und trugen sie in ihren Tuniken aus dem Lager hinaus[a], wie Mose gesagt hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an ihren Tuniken“. Die hebräische Präposition kann das Mittel bezeichnen; dann trugen sie die beiden Männer, indem sie deren Tuniken ergriffen oder zum Tragen benutzten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  choice: Da traten sie heran
  rationale: Das Qal-Wayyiqtol von קרב bezeichnet hier die Annäherung an die Leichname; „herantreten“ bewahrt die Bewegungsrichtung und klingt in modernem Deutsch natürlich.
- source_word: וַיִּשָּׂאֻם
  choice: und trugen sie
  rationale: נשׂא mit Objektsuffix bezeichnet im Zusammenhang das Wegtragen Nadabs und Abihus; „trugen“ ist klarer und idiomatischer als „hoben“.
- source_word: בְּכֻתֳּנֹתָם
  choice: in ihren Untergewändern
  rationale: כֻּתֹּנֶת bezeichnet ein tunikaartiges, unmittelbar am Körper getragenes Gewand. Die Präposition ב kann sowohl den Umstand („in“) als auch das Mittel („an/mithilfe“) ausdrücken; die Hauptfassung bleibt eng an der naheliegenden örtlich-umständlichen Lesart.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: aus dem Lager hinaus
  rationale: Die Verbindung bezeichnet eine gerichtete Bewegung an einen Ort außerhalb des Lagers. Idiomatisches Deutsch gibt dies am klarsten mit „aus dem Lager hinaus“ wieder.
- source_word: כַּאֲשֶׁר דִּבֶּר מֹשֶׁה
  choice: genau wie Mose gesagt hatte
  rationale: Die Wendung verweist auf Moses vorausgehenden Auftrag; das Plusquamperfekt macht die zeitliche Abfolge deutlich, und „genau wie“ gibt den vergleichenden Bezug wieder.
