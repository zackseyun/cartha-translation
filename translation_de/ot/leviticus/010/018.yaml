revisions:
- from: Sieh, ihr Blut wurde nicht ins Innere des Heiligtums gebracht.[a] Ihr hättet sie unbedingt am heiligen Ort essen sollen, wie ich es geboten hatte.[b]
  to: Seht, ihr Blut wurde nicht ins Innere des Heiligtums gebracht.[a] Ihr hättet das Opfer unbedingt an heiliger Stätte essen sollen, wie ich es geboten hatte.[b]
  rationale: 'Die Revision beschränkt sich auf drei sichere sprachliche Präzisierungen: pluralisches „Seht“, eine eindeutig lokative Wiedergabe von בַּקֹּדֶשׁ und die Auflösung des deutschen Pronomenbezugs. Die räumliche Differenz zwischen dem inneren Heiligtumsbereich und der heiligen Stätte des Essens bleibt erhalten; die emphatische, rückblickende Verpflichtung bleibt unverändert.'
