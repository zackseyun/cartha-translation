base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/018.yaml
  text: Look, its blood was not brought into the sanctuary, inside. You certainly should have eaten it in the holy place, as I commanded.
translation:
  language: de
  text: Seht, ihr Blut wurde nicht ins Innere des Heiligtums gebracht.[a] Ihr hättet das Opfer unbedingt an heiliger Stätte essen sollen, wie ich es geboten hatte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „in das Heilige hinein, nach innen“. Die hebräische Formulierung betont die Bewegung in den inneren heiligen Bereich.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Verbindung „essen solltet ihr essen“ verstärkt die Aussage: Ihr hättet das Opfer unbedingt essen sollen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Sieh
  rationale: Die Aufmerksamkeitspartikel hebt den folgenden Sachverhalt nachdrücklich hervor; „Sieh“ bewahrt diese Funktion in würdigem, verständlichem Deutsch.
- source_word: הוּבָא
  choice: wurde … gebracht
  rationale: Der Hofal von בוא bezeichnet hier passiv, dass das Blut nicht hineingebracht wurde.
- source_word: דָּמָהּ
  choice: ihr Blut
  rationale: Das feminine Suffix verweist auf das weiblich bezeichnete Sündopfer; das Genus bleibt im Deutschen natürlich erhalten.
- source_word: אֶל־הַקֹּדֶשׁ פְּנִימָה
  choice: ins Innere des Heiligtums
  rationale: Die Formulierung gibt sowohl die Bewegung in den heiligen Bereich als auch die durch פְּנִימָה betonte Richtung nach innen idiomatisch wieder, ohne einen Vorhang ausdrücklich in den Text einzutragen.
- source_word: אָכוֹל תֹּאכְלוּ
  choice: ihr hättet … unbedingt … essen sollen
  rationale: Infinitivus absolutus und Imperfekt verstärken den Verbalgedanken. Im Kontext einer Rüge über eine unterlassene Handlung drückt der deutsche Irrealis der Vergangenheit die Verpflichtung natürlich aus.
- source_word: אֹתָהּ
  choice: sie
  rationale: Das feminine Objektpronomen bezieht sich auf das Sündopfer beziehungsweise dessen Opferfleisch.
- source_word: בַּקֹּדֶשׁ
  choice: am heiligen Ort
  rationale: Bezeichnet den für den Verzehr bestimmten heiligen Bereich und vermeidet eine unnötige Gleichsetzung mit dem zuvor genannten Inneren des Heiligtums.
- source_word: כַּאֲשֶׁר צִוֵּיתִי
  choice: wie ich es geboten hatte
  rationale: Das Plusquamperfekt macht im deutschen Erzählzusammenhang deutlich, dass das Gebot der beanstandeten Unterlassung vorausging.
theological_decisions:
- issue: Räumliche Terminologie des Heiligtums
  choice: „ins Innere des Heiligtums“ für אֶל־הַקֹּדֶשׁ פְּנִימָה, aber „am heiligen Ort“ für בַּקֹּדֶשׁ
  alternative: Beide Wendungen einheitlich mit „im/ins Heiligtum“ wiedergeben oder die erste als „hinter den Vorhang“ spezifizieren
  rationale: 'Die verwandten Ausdrücke sind nicht identisch: Der erste betont die Bewegung nach innen, der zweite den heiligen Ort des Essens. Die Differenzierung wahrt die kultische Logik, ohne mehr festzulegen, als der hebräische Wortlaut sagt.'
- issue: Zeitlicher und modaler Sinn von אָכוֹל תֹּאכְלוּ
  choice: 'Rückblickende Verpflichtung: „ihr hättet … unbedingt … essen sollen“'
  alternative: 'Prospektiv oder imperativisch: „ihr sollt es unbedingt essen“'
  rationale: Mose beanstandet im Kontext eine bereits geschehene Unterlassung. Die Übersetzung bewahrt zugleich die emphatische Verstärkung des hebräischen Ausdrucks.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sieh“ markiert den nachdrücklichen Auftakt; „unbedingt“ vermittelt die hebräische Verstärkung. Die kultischen Ortsangaben werden klar unterschieden, ohne den Text konfessionell oder räumlich überzuspezifizieren.
