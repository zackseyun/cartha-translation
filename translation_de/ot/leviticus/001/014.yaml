source:
  edition: WLC
  text: וְ/אִ֧ם מִן הָ/ע֛וֹף עֹלָ֥ה קָרְבָּנ֖/וֹ לַֽ/יהוָ֑ה וְ/הִקְרִ֣יב מִן הַ/תֹּרִ֗ים א֛וֹ מִן בְּנֵ֥י הַ/יּוֹנָ֖ה אֶת קָרְבָּנֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/014.yaml
  text: And if his offering to Yahweh is a burnt offering from the birds, then he shall present his offering from the turtledoves or from the young pigeons.
translation:
  language: de
  text: Und wenn seine Opfergabe für Jahwe ein Brandopfer von Vögeln ist, soll er als seine Opfergabe Turteltauben oder junge Tauben darbringen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: Und wenn
  rationale: Bewahrt sowohl die konditionale Bedeutung als auch den Anschluss an die vorausgehenden Opferbestimmungen.
- source_word: מִן הָעוֹף
  choice: von den Vögeln
  rationale: Gibt die Gattungsbezeichnung עוֹף im kultischen Zusammenhang klar und natürlich wieder.
- source_word: עֹלָה
  choice: Brandopfer
  rationale: Ist die etablierte deutsche Bezeichnung für diese vollständig verbrannte Opferart, ohne die mögliche Wortassoziation des Aufsteigens in den Haupttext einzutragen.
- source_word: קָרְבָּנוֹ
  choice: seine Opfergabe
  rationale: קָרְבָּן bezeichnet eine dargebrachte Gabe; »Opfergabe« ist im Deutschen verständlich und wahrt den kultischen Sinn.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Das ל kennzeichnet hier die Ausrichtung bzw. Bestimmung des Opfers; »für« ist in diesem deutschen Satz idiomatisch. Der Gottesname wird als Jahwe wiedergegeben.
- source_word: וְהִקְרִיב
  choice: soll er … darbringen
  rationale: Die Hifil-Form von קרב bezeichnet das rituelle Heranbringen bzw. Darbringen; »darbringen« ist natürlich und sachgerecht.
- source_word: מִן הַתֹּרִים
  choice: von den Turteltauben
  rationale: תֹּרִים bezeichnet Turteltauben; der bestimmte Plural des Hebräischen wird entsprechend wiedergegeben.
- source_word: אוֹ
  choice: oder
  rationale: Bewahrt die einfache Alternative zwischen den beiden zulässigen Vogelarten.
- source_word: מִן בְּנֵי הַיּוֹנָה
  choice: von den jungen Tauben
  rationale: Die wörtliche Wendung »Söhne der Taube« ist eine idiomatische Bezeichnung für junge Tauben; die Altersangabe bleibt ausdrücklich erhalten.
- source_word: אֶת קָרְבָּנוֹ
  choice: seine Opfergabe
  rationale: Die Wiederholung des Nomens im Hebräischen wird beibehalten und bildet das Objekt von »darbringen«.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Eigenname wird als »Jahwe« wiedergegeben, um den im Ausgangstext ausdrücklich stehenden Bundesnamen erkennbar zu bewahren.
- issue: Bedeutung von עֹלָה
  choice: Brandopfer
  alternative: Aufstiegsopfer
  rationale: »Brandopfer« bezeichnet die konkrete kultische Opferkategorie im heutigen Bibeldeutsch am verständlichsten; die etymologische Verbindung zum Aufsteigen wird dadurch nicht als alleinige Deutung festgelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit vertrauter kultischer Terminologie. Die Satzstruktur folgt dem hebräischen Bedingungssatz, bleibt aber flüssig und allgemein verständlich.
