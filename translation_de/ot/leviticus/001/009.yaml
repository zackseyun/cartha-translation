source:
  edition: WLC
  text: וְ/קִרְבּ֥/וֹ וּ/כְרָעָ֖י/ו יִרְחַ֣ץ בַּ/מָּ֑יִם וְ/הִקְטִ֨יר הַ/כֹּהֵ֤ן אֶת הַ/כֹּל֙ הַ/מִּזְבֵּ֔חָ/ה עֹלָ֛ה אִשֵּׁ֥ה רֵֽיחַ נִיח֖וֹחַ לַֽ/יהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/009.yaml
  text: But he shall wash its entrails and its legs with water[a], and the priest shall turn all of it into smoke on the altar, a burnt offering, a food offering[c][b], a pleasing aroma to Yahweh.
translation:
  language: de
  text: 'Seine Eingeweide und Beine soll er mit Wasser waschen. Dann soll der Priester das Ganze auf dem Altar in Rauch aufgehen lassen: ein Brandopfer, ein Feueropfer[a] von angenehmem Duft für Jahwe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Speisegabe“. Die genaue Bedeutung des hebräischen Opferbegriffs ist umstritten; traditionell wird er auch als „Feueropfer“ beziehungsweise „durch Feuer dargebrachtes Opfer“ verstanden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְבּוֹ
  choice: seine Eingeweide
  rationale: קֶרֶב bezeichnet im Opferkontext die inneren Organe des Tieres. „Eingeweide“ ist konkret, verständlich und passt zum vorgeschriebenen Waschen.
- source_word: כְרָעָיו
  choice: seine Beine
  rationale: כְּרָעַיִם bezeichnet hier die unteren Gliedmaßen des Tieres. „Beine“ ist im modernen Deutsch klarer und weniger fachsprachlich als „Unterschenkel“ oder „Haxen“.
- source_word: יִרְחַץ בַּמָּיִם
  choice: soll er mit Wasser waschen
  rationale: Die Formulierung gibt das rituelle Waschen samt dem verwendeten Wasser natürlich und genau wieder.
- source_word: וְהִקְטִיר
  choice: soll … in Rauch aufgehen lassen
  rationale: Das Verb bezeichnet im priesterlichen Opferwortschatz das Verbrennen auf dem Altar, bei dem die Opfergabe als Rauch aufsteigt. Die Wiedergabe bewahrt diese kultische Nuance besser als das allgemeinere „verbrennen“.
- source_word: אֶת־הַכֹּל
  choice: das Ganze
  rationale: Die Wendung betont, dass das vollständig vorbereitete Tier auf dem Altar dargebracht wird.
- source_word: עֹלָה
  choice: Brandopfer
  rationale: „Brandopfer“ ist die etablierte und verständliche deutsche Bezeichnung für das vollständig auf dem Altar verbrannte Opfer.
- source_word: אִשֶּׁה
  choice: Feueropfer
  rationale: Die traditionelle Ableitung und der unmittelbare Zusammenhang mit dem Verbrennen auf dem Altar sprechen für „Feueropfer“. Da auch die Deutung als „Speisegabe“ vertreten wird, bleibt diese in einer Fußnote sichtbar.
- source_word: רֵיחַ נִיחוֹחַ
  choice: von angenehmem Duft
  rationale: Die feste Opferformel wird als Metapher bewahrt, ohne über die im Text ausgesagte Annahme des Opfers hinauszugehen.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition bezeichnet Jahwe als Empfänger beziehungsweise den, dem das Opfer gilt; „für“ ist in diesem Opferkontext natürlich. Der Gottesname wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. „Jahwe“ gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von אִשֶּׁה
  choice: Feueropfer
  alternative: Speisegabe
  rationale: Die genaue Etymologie und Bedeutung des kultischen Ausdrucks ist umstritten. Der Haupttext folgt der naheliegenden Feuer-Deutung; die alternative Deutung als dargebrachte Speisegabe wird nicht ausgeschlossen, sondern in der Fußnote genannt.
- issue: Opferformel רֵיחַ נִיחוֹחַ
  choice: von angenehmem Duft
  alternative: von beruhigendem Duft
  rationale: Die Übersetzung erhält das konkrete Bild und lässt offen, wie die Formel theologisch zu erklären ist; sie deutet sie nicht bloß abstrakt als „Gott wohlgefällig“ um.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt nahe am hebräischen Ritualstil, während „Dann“ den Handlungsfortgang natürlich ausdrückt. Der Doppelpunkt macht die nachgestellte Opferbestimmung sichtbar; auf altertümliche Formen wie „darbringen zum lieblichen Geruch“ wird verzichtet.
