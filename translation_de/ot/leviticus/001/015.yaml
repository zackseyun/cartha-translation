  text: וְ/הִקְרִיב֤/וֹ הַ/כֹּהֵן֙ אֶל הַ/מִּזְבֵּ֔חַ וּ/מָלַק֙ אֶת רֹאשׁ֔/וֹ וְ/הִקְטִ֖יר הַ/מִּזְבֵּ֑חָ/ה וְ/נִמְצָ֣ה דָמ֔/וֹ עַ֖ל קִ֥יר הַ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/015.yaml
  text: And the priest shall bring it to the altar[a], and pinch off its head and burn it on the altar[b], and its blood shall be drained out on the side of the altar.
translation:
  language: de
  text: Der Priester soll ihn zum Altar bringen, ihm den Kopf abkneifen[a] und ihn auf dem Altar in Rauch aufgehen lassen. Dann soll sein Blut an der Seitenwand des Altars ausgedrückt werden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb ist ein Fachwort für die priesterliche Tötung eines Opfervogels, bei der ihm der Kopf abgetrennt wird; auch „ihm den Kopf abdrehen“ ist möglich.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „an der Wand des Altars“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיבוֹ
  choice: soll ihn zum Altar bringen
  rationale: Der Hifil von קרב bezeichnet das Heranbringen oder Darbringen. Zusammen mit אֶל הַמִּזְבֵּחַ steht hier die konkrete Bewegung zum Altar im Vordergrund.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Übliche und sachgerechte Wiedergabe von כֹּהֵן in den Opferbestimmungen.
- source_word: וּמָלַק אֶת־רֹאשׁוֹ
  choice: ihm den Kopf abkneifen
  rationale: מלק ist ein seltenes Fachwort für die priesterliche Tötung eines Opfervogels am Kopf beziehungsweise Nacken. „Abkneifen“ ist konkret und lässt sich durch eine Fußnote gegen eine zu enge Deutung absichern.
- source_word: וְהִקְטִיר
  choice: in Rauch aufgehen lassen
  rationale: קטר bezeichnet im Opferkontext nicht bloß ein Verbrennen, sondern das Verbrennen auf dem Altar, bei dem das Opfer als Rauch aufsteigt.
- source_word: וְנִמְצָה דָמוֹ
  choice: sein Blut soll … ausgedrückt werden
  rationale: Der Nifal von מצה beschreibt hier das Auspressen beziehungsweise Ausdrücken des Blutes und wird mit einer passiven deutschen Form wiedergegeben.
- source_word: עַל קִיר הַמִּזְבֵּחַ
  choice: an der Seitenwand des Altars
  rationale: קִיר bedeutet wörtlich „Wand“. Bei einem Altar bezeichnet es dessen senkrechte Seitenfläche; „Seitenwand“ ist im Deutschen anschaulich und idiomatisch.
theological_decisions: []
