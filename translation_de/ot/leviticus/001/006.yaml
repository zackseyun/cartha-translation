  text: וְ/הִפְשִׁ֖יט אֶת הָ/עֹלָ֑ה וְ/נִתַּ֥ח אֹתָ֖/הּ לִ/נְתָחֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/006.yaml
  text: Then he shall skin the burnt offering and cut it into its pieces[a][b].
translation:
  language: de
  text: Dann soll er dem Brandopfer die Haut abziehen und es in seine Teile zerlegen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִפְשִׁיט
  choice: soll … die Haut abziehen
  rationale: Die Hifil-Form von פשט bezeichnet im Opferkontext das Entfernen der Haut. „Die Haut abziehen“ ist im heutigen Deutsch klarer und natürlicher als das fachsprachliche „häuten“.
- source_word: הָעֹלָה
  choice: dem Brandopfer
  rationale: עֹלָה ist in Levitikus die übliche Bezeichnung für das vollständig verbrannte Opfer. „Brandopfer“ ist die etablierte und sachlich passende deutsche Wiedergabe.
- source_word: וְנִתַּח
  choice: und … zerlegen
  rationale: נתח bezeichnet hier das Zerteilen des Opfertiers in einzelne Abschnitte. „Zerlegen“ gibt den Vorgang präzise und idiomatisch wieder.
- source_word: לִנְתָחֶיהָ
  choice: in seine Stücke
  rationale: נתח bezeichnet ein abgetrenntes Stück oder einen Abschnitt. Die Formulierung bewahrt die auffällige hebräische Wendung und meint die vorgesehenen Teile, in die das Tier zerlegt wird.
- source_word: וְ
  choice: Dann
  rationale: Die Konjunktion führt die Abfolge der Opferhandlung aus dem vorhergehenden Vers fort; „Dann“ macht diesen Verfahrensschritt im Deutschen deutlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kultische Fachbezeichnung „Brandopfer“ bleibt erhalten; die konkreten Arbeitsschritte werden allgemein verständlich formuliert.
