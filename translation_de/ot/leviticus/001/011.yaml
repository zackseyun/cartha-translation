id: LEV.1.11
reference: Leviticus 1:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/שָׁחַ֨ט אֹת֜/וֹ עַ֣ל יֶ֧רֶךְ הַ/מִּזְבֵּ֛חַ צָפֹ֖נָ/ה לִ/פְנֵ֣י יְהוָ֑ה וְ/זָרְק֡וּ בְּנֵי֩ אַהֲרֹ֨ן הַ/כֹּהֲנִ֧ים אֶת דָּמ֛/וֹ עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/011.yaml
  text: And he shall slaughter it on the north side of the altar before Yahweh[a], and Aaron’s sons, the priests, shall throw its blood against the altar all around.
translation:
  language: de
  text: Er soll es an der Nordseite des Altars vor Jahwe schlachten. Dann sollen die Söhne Aarons, die Priester, sein Blut ringsum an den Altar sprengen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sein Blut ringsum gegen den Altar schleudern“. Das hebräische Verb bezeichnet ein kräftiges Werfen oder Ausbringen des Blutes, nicht nur ein leichtes Besprengen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  choice: soll schlachten
  rationale: שׁחט ist der übliche Fachausdruck für das Schlachten eines Opfertiers. „Soll“ entspricht dem rechtlich-rituellen Anweisungsstil.
- source_word: יֶרֶךְ הַמִּזְבֵּחַ צָפֹנָה
  choice: an der Nordseite des Altars
  rationale: יֶרֶךְ bedeutet wörtlich „Seite/Flanke“; zusammen mit צָפֹנָה bezeichnet die Wendung hier idiomatisch die Nordseite des Altars.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: Die kultische Wendung bezeichnet das Handeln in der Gegenwart Jahwes. „Vor“ bewahrt die knappe Form des Hebräischen.
- source_word: וְזָרְקוּ
  choice: sollen … sprengen
  rationale: זרק bezeichnet ein Werfen beziehungsweise kräftiges Ausbringen des Blutes. „An den Altar sprengen“ ist im Deutschen als rituelle Handlung verständlich; die Fußnote grenzt es von einem leichten Besprengen ab.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: die Söhne Aarons, die Priester
  rationale: Die appositionale Form bewahrt sowohl die Abstammungsangabe als auch die Amtsbezeichnung.
- source_word: דָּמוֹ
  choice: sein Blut
  rationale: Das Suffix verweist auf das männlich bezeichnete Opfertier; im Deutschen ist „sein Blut“ in diesem Zusammenhang natürlich.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: ringsum an den Altar
  rationale: עַל bezeichnet zusammen mit dem Blutritus die Zielrichtung zum Altar hin; סָבִיב verlangt, dass die Handlung rings um den Altar erfolgt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt diesen in der im Deutschen üblichen Form wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Moderner, würdiger deutscher Anweisungsstil. Die Satzteilung macht den Wechsel vom Schlachtenden zu den Priestern deutlich, ohne dem Ausgangstext zusätzliche Rollenfestlegungen hinzuzufügen.
