base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/008.yaml
  text: And Aaron’s sons[a], the priests, shall arrange the pieces, the head, and the fat on the wood that is on the fire that is on the altar.
translation:
  language: de
  text: Und die Söhne Aarons, die Priester, sollen die Stücke, den Kopf und das Fett[a] auf dem Holz anordnen, das auf dem Feuer liegt, das auf dem Altar ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Talg“ beziehungsweise „die Fettdecke“; der hebräische Ausdruck bezeichnet eine Fettpartie des Opfertiers.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָרְכוּ
  choice: Und … sollen … anordnen
  rationale: ערך bezeichnet im Opferkontext das geordnete Auflegen bzw. Anordnen. Die Wiedergabe bewahrt sowohl die einleitende Konjunktion als auch den anweisenden Charakter.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: die Söhne Aarons, die Priester
  rationale: Die Kommas kennzeichnen הַכֹּהֲנִים als Apposition und identifizieren Aarons Söhne in ihrer priesterlichen Funktion.
- source_word: הַנְּתָחִים
  choice: die Stücke
  rationale: נְתָחִים sind die zuvor zerlegten Stücke des Opfertiers. „Stücke“ ist natürlich, konkret und fügt keine unnötige Erläuterung hinzu.
- source_word: הָרֹאשׁ
  choice: den Kopf
  rationale: Direkte und eindeutige Wiedergabe des anatomischen Ausdrucks.
- source_word: הַפָּדֶר
  choice: das Fett
  rationale: פָּדֶר bezeichnet eine Fettpartie des Opfertiers, möglicherweise das Nierenfett oder die Fettdecke. „Das Fett“ ist verständlich und lässt die anatomische Unschärfe bestehen; Alternativen werden in der Fußnote genannt.
- source_word: עַל הָעֵצִים
  choice: auf dem Holz
  rationale: עֵצִים wird hier kollektiv als Brennholz verstanden. „Auf dem Holz“ gibt die räumliche Beziehung knapp wieder.
- source_word: אֲשֶׁר עַל הָאֵשׁ אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: das auf dem Feuer liegt, das auf dem Altar ist
  rationale: Die beiden aufeinanderfolgenden Relativsätze und ihre gestufte räumliche Beschreibung bleiben erhalten. „Liegt“ ist beim Holz idiomatisch; das zweite „ist“ vermeidet eine zusätzliche, im Hebräischen nicht ausgedrückte Präzisierung.
