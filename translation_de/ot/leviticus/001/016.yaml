review_pass:
  verdict: revise
  source_fidelity: Der Haupttext gibt die Abfolge und die räumlichen Angaben des Hebräischen zutreffend wieder. Die Formulierung „alles“ macht das feminine Singularpronomen אֹתָהּ jedoch unnötig unbestimmt; der Bezug auf den Kropf kann im Deutschen klarer erhalten bleiben. „Östlich davon“ verdeutlicht, dass קֵדְמָה die Lage beim Altar näher bestimmt.
  naturalness: „Neben den Altar, auf die Ostseite, an den Ort der Asche“ ist verständlich, aber die Reihung der Richtungsangaben wirkt im modernen Deutschen sperrig und lässt offen, wessen Ostseite gemeint ist. Eine leichte Umstellung ergibt eine idiomatischere Ritualanweisung.
  terminology: „Kropf“ und „Gefieder“ sind sachgerecht. Die Fußnotenalternative „Schlund“ ist für den Kropf bzw. dessen Inhalt keine genaue deutsche Entsprechung und sollte durch „Kropfinhalt“ ersetzt werden. Die Fußnote zur alternativen Deutung von בְּנֹצָתָהּ bewahrt die textliche Schwierigkeit angemessen.
  issues:
  - severity: medium
    issue: Unpräziser Bezug von „alles“
    rationale: Das hebräische Suffix in „und er soll es werfen“ ist Singular. Zwar umfasst der Vorgang den Kropf samt Gefieder, doch „ihn“ kann im Deutschen den Kropf präzise aufnehmen, ohne den Umfang des Mitentfernten zu leugnen.
  - severity: medium
    issue: Die räumliche Reihung ist stilistisch und referenziell unklar
    rationale: „auf die Ostseite“ benennt nicht ausdrücklich die Ostseite des Altars und ist zwischen „neben den Altar“ und „an den Ort der Asche“ syntaktisch holprig. „Östlich davon“ bildet die hebräische Orientierung beim Altar klar ab.
  - severity: medium
    issue: Fußnote a verwendet „Schlund“ als ungenaue Alternative
    rationale: Ein Schlund ist nicht der Kropf eines Vogels. „Kropfinhalt“ gibt die in der Auslegung vertretene alternative Auffassung wesentlich treffender wieder.
  revised_text: Er soll den Kropf des Vogels[a] samt dessen Gefieder[b] entfernen und ihn neben den Altar werfen, östlich davon, an den Ort der Asche.
