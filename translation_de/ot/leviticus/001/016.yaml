lexical_decisions:
- source_word: וְהֵסִיר
  choice: Er soll … entfernen
  rationale: Der Hifil von סור bezeichnet hier das Wegnehmen eines Körperteils; die deutsche Soll-Form gibt den verbindlichen Ablauf der Opferanweisung natürlich wieder.
- source_word: מֻרְאָתוֹ
  choice: den Kropf des Vogels
  rationale: Im Zusammenhang mit einem Vogelopfer bezeichnet das seltene Substantiv am ehesten den Kropf. Die Ergänzung „des Vogels“ macht den Bezug im Deutschen eindeutig.
- source_word: בְּנֹצָתָהּ
  choice: samt seinem Gefieder
  rationale: Die Konsonantenform lässt sich am unmittelbarsten von נוצה, „Feder/Gefieder“, ableiten. „Samt“ drückt aus, dass der Kropf zusammen mit dem Gefieder entfernt wird, ohne die schwierige Wendung stärker auszudeuten.
- source_word: וְהִשְׁלִיךְ אֹתָהּ
  choice: und alles … werfen
  rationale: Der Hifil von שלך bedeutet „werfen“. „Alles“ nimmt im Deutschen das gemeinsam Entfernte auf und vermeidet einen missverständlichen Genusbezug.
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: neben den Altar
  rationale: אצל bezeichnet eine Lage unmittelbar bei oder seitlich von etwas; „neben den Altar“ ist präzise und idiomatisch.
- source_word: קֵדְמָה
  choice: auf die Ostseite
  rationale: Das Richtungsadverb bezeichnet hier die östliche Seite des Altars.
- source_word: אֶל מְקוֹם הַדָּשֶׁן
  choice: an den Ort der Asche
  rationale: Die Formulierung bewahrt die räumliche Bestimmung des Hebräischen. דשן bezeichnet im Opferkontext die beim Altar anfallende Asche, möglicherweise einschließlich fetthaltiger Verbrennungsreste.
