  text: He shall remove its crop with its feathers and throw it beside the altar[a], on the east side[b], to the place of the ashes.
translation:
  language: de
  text: Er soll den Kropf des Vogels[a] samt dessen Gefieder[b] entfernen und ihn neben den Altar werfen, östlich davon, an den Ort der Asche.
  philosophy: optimal-equivalence
  footnotes:
