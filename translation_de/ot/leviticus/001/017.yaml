  text: וְ/שִׁסַּ֨ע אֹת֣/וֹ בִ/כְנָפָי/ו֮ לֹ֣א יַבְדִּיל֒ וְ/הִקְטִ֨יר אֹת֤/וֹ הַ/כֹּהֵן֙ הַ/מִּזְבֵּ֔חָ/ה עַל הָ/עֵצִ֖ים אֲשֶׁ֣ר עַל הָ/אֵ֑שׁ עֹלָ֣ה ה֗וּא אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/017.yaml
  text: He shall tear it open by its wings[a], but he shall not divide it; and the priest shall burn it on the altar, on the wood that is on the fire. It is a burnt offering, a food offering, a pleasing aroma to Yahweh.
translation:
  language: de
  text: Er soll den Vogel an den Flügeln aufreißen, ihn aber nicht ganz zertrennen. Dann soll der Priester ihn auf dem Altar verbrennen, auf dem Holz über dem Feuer. Es ist ein Brandopfer, ein Feueropfer[a], ein wohlgefälliger Duft für Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: eine Speisegabe; die genaue Bedeutung des hebräischen Opferbegriffs ist umstritten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁסַּע אֹתוֹ בִכְנָפָיו
  choice: Er soll den Vogel an den Flügeln aufreißen
  rationale: שׁסע bezeichnet ein Aufreißen oder Spalten; der folgende Satz macht deutlich, dass der Vogel dabei nicht vollständig getrennt wird. „An den Flügeln“ gibt die konkrete, hinsichtlich Ort oder Mittel leicht offene Präposition ב wieder.
- source_word: לֹא יַבְדִּיל
  choice: ihn aber nicht ganz zertrennen
  rationale: Das Hifil von בדל bedeutet trennen oder scheiden. „Nicht ganz zertrennen“ verdeutlicht im Zusammenhang, dass die beiden Teile verbunden bleiben.
- source_word: וְהִקְטִיר אֹתוֹ
  choice: Dann soll der Priester ihn ... verbrennen
  rationale: Im Opferkontext bezeichnet קטר im Hifil das Verbrennen auf dem Altar beziehungsweise das Aufsteigenlassen in Rauch. „Verbrennen“ ist im Deutschen klar und wird durch den Altarkontext kultisch bestimmt.
- source_word: עַל הָעֵצִים אֲשֶׁר עַל הָאֵשׁ
  choice: auf dem Holz über dem Feuer
  rationale: Die Wendung beschreibt die Anordnung auf dem Altar. Das zweite עַל kann räumlich mit „über“ wiedergegeben werden; so entsteht im Deutschen keine missverständliche Vorstellung von Holz, das auf der Feueroberfläche liegt.
- source_word: עֹלָה
  choice: Brandopfer
  rationale: „Brandopfer“ ist die etablierte und sachlich passende deutsche Bezeichnung für das vollständig auf dem Altar verbrannte עֹלָה.
- source_word: אִשֵּׁה
  choice: Feueropfer
  rationale: Die Form bezeichnet wahrscheinlich eine durch Feuer dargebrachte Gabe. „Feueropfer“ bewahrt den Wortbezug zum Feuer und vermeidet die stärker deutende Wiedergabe „Speiseopfer“, die im Deutschen zudem mit einer anderen Opferart verwechselt werden kann.
- source_word: רֵיחַ נִיחֹחַ
  choice: ein wohlgefälliger Duft
  rationale: Die feste kultische Formel bezeichnet einen Duft, der Annahme beziehungsweise Wohlgefallen ausdrückt. „Wohlgefällig“ bewahrt die theologische Aussage, ohne sie weiter auszudeuten.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition ל bezeichnet hier die Ausrichtung beziehungsweise Bestimmung des wohlgefälligen Duftes. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Eigennamen ausdrücklich. „Jahwe“ macht den Bundesnamen sichtbar, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung der kultischen Formel רֵיחַ נִיחֹחַ
  choice: ein wohlgefälliger Duft
  alternative: ein beruhigender Duft
  rationale: „Wohlgefällig“ gibt die Annahme des Opfers wieder, ohne dem Ausdruck eine Vorstellung göttlicher Besänftigung aufzuzwingen.
- issue: Deutung von אִשֵּׁה
  choice: Feueropfer
  alternative: Speisegabe
  rationale: Die genaue Herleitung des kultischen Begriffs ist umstritten. Die Hauptübersetzung hält den wahrscheinlichen Feuerbezug fest; eine alternative Deutung als göttliche Speisegabe wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit vertrauter kultischer Terminologie. Die Satzfolge bleibt nahe am Hebräischen, wird aber für flüssiges Deutsch leicht gegliedert. Der Fußnotenmarker [a] steht unmittelbar beim strittigen Ausdruck.
