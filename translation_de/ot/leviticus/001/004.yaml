source:
  edition: WLC
  text: וְ/סָמַ֣ךְ יָד֔/וֹ עַ֖ל רֹ֣אשׁ הָ/עֹלָ֑ה וְ/נִרְצָ֥ה ל֖/וֹ לְ/כַפֵּ֥ר עָלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/004.yaml
  text: And he shall lay his hand on the head of the burnt offering[a], and it shall be accepted for him to make atonement on his behalf.
translation:
  language: de
  text: Er soll seine Hand auf den Kopf des Brandopfers legen, und es wird zu seinen Gunsten angenommen[a], um für ihn Sühne zu erwirken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und er wird angenommen“. Das hebräische Passiv kann sich unmittelbarer auf den Opfernden statt auf das Opfer beziehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְסָמַךְ
  choice: Er soll … legen
  rationale: סמך bezeichnet im Opferzusammenhang das Auflegen beziehungsweise Aufstützen der Hand auf das Tier. „legen“ gibt die rituelle Handlung natürlich wieder, ohne die Stärke des Drucks näher festzulegen.
- source_word: יָדוֹ
  choice: seine Hand
  rationale: Die Einzahl und die Possessivbeziehung des Hebräischen werden unmittelbar beibehalten.
- source_word: עַל רֹאשׁ
  choice: auf den Kopf
  rationale: Die räumliche Beziehung und die konkrete körperliche Geste werden direkt wiedergegeben.
- source_word: הָעֹלָה
  choice: des Brandopfers
  rationale: עֹלָה ist die übliche Bezeichnung für das vollständig verbrannte Opfer. „Brandopfer“ ist im Deutschen der klare und etablierte kultische Ausdruck.
- source_word: וְנִרְצָה
  choice: und es wird … angenommen
  rationale: Das Nifal von רצה bezeichnet hier die Annahme beziehungsweise wohlgefällige Aufnahme. Die passive Form bleibt erhalten; „es“ bezieht sich im Haupttext auf das Brandopfer.
- source_word: לוֹ
  choice: für ihn
  rationale: Die Präposition bezeichnet den Begünstigten; die knappe Wiedergabe lässt die stellvertretende Beziehung offen genug.
- source_word: לְכַפֵּר
  choice: um … Sühne zu erwirken
  rationale: כפר ist ein zentraler Begriff der Opfersprache. „Sühne erwirken“ bewahrt sein kultisch-theologisches Gewicht, ohne eine bestimmte Sühnetheorie einzutragen.
- source_word: עָלָיו
  choice: für ihn
  rationale: Bei כפר bezeichnet על hier die Person, zu deren Gunsten die Sühne geschieht.
theological_decisions:
- issue: Bezug des Passivs וְנִרְצָה
  choice: Das Brandopfer wird für den Opfernden angenommen.
  alternative: Der Opfernde wird angenommen.
  rationale: Im Opferzusammenhang legt der Haupttext die Annahme des Opfers nahe. Da die hebräische Form auch so verstanden werden kann, dass die Annahme unmittelbarer dem Opfernden gilt, wird diese theologisch bedeutsame Spannung in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kultischen Begriffe „Brandopfer“ und „Sühne“ bleiben erhalten; Satzbau und Wortwahl sind zugleich für heutige Leser verständlich.
