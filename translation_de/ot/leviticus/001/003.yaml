source:
  edition: WLC
  text: אִם עֹלָ֤ה קָרְבָּנ/וֹ֙ מִן הַ/בָּקָ֔ר זָכָ֥ר תָּמִ֖ים יַקְרִיבֶ֑/נּוּ אֶל פֶּ֝תַח אֹ֤הֶל מוֹעֵד֙ יַקְרִ֣יב אֹת֔/וֹ לִ/רְצֹנ֖/וֹ לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/003.yaml
  text: If his offering is a burnt offering from the herd[a], he shall offer a male without blemish. He shall offer it at the entrance of the tent of meeting, that he may be accepted before Yahweh.
translation:
  language: de
  text: Wenn seine Opfergabe ein Brandopfer aus der Rinderherde ist, soll er ein männliches Tier ohne Fehler darbringen. Er soll es am Eingang des Zeltes der Begegnung darbringen, damit er vor Jahwe angenommen wird.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zu seiner Annahme vor Jahwe«; traditionell auch: »aus freiem Willen vor Jahwe«.'
    reason: Die hebräische Wendung לִרְצֹנוֹ kann die Annahme des Opfernden ausdrücken; sie wurde traditionell auch im Sinn einer freiwilligen Darbringung verstanden.
lexical_decisions:
- source_word: עֹלָה
  choice: Brandopfer
  rationale: Der etablierte deutsche Opferbegriff bezeichnet hier ein Opfer, das auf dem Altar vollständig in Rauch aufgeht.
- source_word: קָרְבָּנוֹ
  choice: seine Opfergabe
  rationale: Der Ausdruck bezeichnet allgemein eine Gott dargebrachte Gabe; »Opfergabe« ist im kultischen Zusammenhang klar und natürlich.
- source_word: מִן הַבָּקָר
  choice: vom Rind
  rationale: הַבָּקָר bezeichnet Rinder als Großvieh. »Vom Rind« ist im Deutschen präzise und idiomatisch.
- source_word: זָכָר
  choice: ein männliches Tier
  rationale: Das Hebräische schreibt ausdrücklich das Geschlecht des Opfertiers vor; die Ergänzung »Tier« sorgt im Deutschen für Klarheit.
- source_word: תָּמִים
  choice: ohne Fehler
  rationale: Im Opferkontext bezeichnet das Wort ein Tier ohne körperlichen Makel. »Ohne Fehler« ist verständlich und bewahrt den kultischen Sinn.
- source_word: יַקְרִיבֶנּוּ / יַקְרִיב אֹתוֹ
  choice: soll er … darbringen
  rationale: Die Hifil-Form von קרב bezeichnet im Opferkontext das Heranbringen beziehungsweise Darbringen einer Opfergabe.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: am Eingang des Zeltes der Begegnung
  rationale: Die Wiedergabe folgt der hebräischen Ortsangabe und verwendet für אֹהֶל מוֹעֵד die anschauliche, im Deutschen verständliche Bezeichnung »Zelt der Begegnung«.
- source_word: לִרְצֹנוֹ
  choice: damit er … angenommen wird
  rationale: Im levitischen Opferzusammenhang liegt die Annahme des Opfernden vor Gott nahe. Die Formulierung ist natürlich, während die überlieferte Deutung als Freiwilligkeit in der Fußnote erhalten bleibt.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי bedeutet »vor/in der Gegenwart von«; der Gottesname wird als »Jahwe« wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen JHWH; »Jahwe« gibt ihn als Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Deutung von לִרְצֹנוֹ
  choice: damit er vor Jahwe angenommen wird
  alternative: aus freiem Willen vor Jahwe / damit es vor Jahwe wohlgefällig angenommen wird
  rationale: Die Wendung kann auf die Annahme des Opfernden, die Wohlgefälligkeit des Opfers oder nach traditioneller Auslegung auf die Freiwilligkeit bezogen werden. Der Haupttext wählt die im Opferkontext naheliegende Annahme des Opfernden; die übrigen Möglichkeiten werden ausdrücklich vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klaren kultischen Begriffen. Die Satzstruktur bleibt nahe am Hebräischen, ohne unnatürlich zu wirken; die sachlich und theologisch bedeutsame Mehrdeutigkeit der Schlusswendung wird durch eine Fußnote bewahrt.
