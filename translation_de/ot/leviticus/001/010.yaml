id: LEV.1.10
reference: Leviticus 1:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אִם מִן הַ/צֹּ֨אן קָרְבָּנ֧/וֹ מִן הַ/כְּשָׂבִ֛ים א֥וֹ מִן הָ/עִזִּ֖ים לְ/עֹלָ֑ה זָכָ֥ר תָּמִ֖ים יַקְרִיבֶֽ/נּוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/010.yaml
  text: And if his offering is from the flock, from the sheep or from the goats, for a burnt offering, he shall offer it, a male without blemish.
translation:
  language: de
  text: Und wenn seine Opfergabe vom Kleinvieh stammt, von den Schafen oder von den Ziegen, als Brandopfer[a], soll er ein männliches Tier ohne Makel[b] darbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum Brandopfer“.'
    reason: lexical_alternative
  - marker: b
    text: '„Ohne Makel“ bedeutet hier: frei von einem körperlichen Fehler; dies war die vorgeschriebene Beschaffenheit des Opfertiers.'
    reason: cultural_note
lexical_decisions:
- source_word: וְאִם
  choice: Und wenn
  rationale: Bewahrt sowohl die verbindende Kraft von וְ als auch die Bedingung, mit der ein weiterer Fall der Opferbestimmungen eingeführt wird.
- source_word: מִן הַצֹּאן
  choice: vom Kleinvieh
  rationale: צֹאן ist der Sammelbegriff für kleinere Herdentiere, besonders Schafe und Ziegen; die beiden Gruppen werden unmittelbar danach ausdrücklich genannt.
- source_word: קָרְבָּנוֹ
  choice: seine Opfergabe
  rationale: קָרְבָּן bezeichnet hier die im Gottesdienst dargebrachte Gabe. „Opfergabe“ ist im Deutschen verständlich und hält den Gegenstand von der anschließenden Opferart unterscheidbar.
- source_word: מִן הַכְּשָׂבִים
  choice: von den Schafen
  rationale: כְּשָׂבִים bezeichnet Schafe und legt hier kein bestimmtes Alter fest; „Lämmer“ wäre daher unnötig verengend.
- source_word: אוֹ מִן הָעִזִּים
  choice: oder von den Ziegen
  rationale: Gibt den normalen kollektiven Sinn von עִזִּים natürlich wieder.
- source_word: לְעֹלָה
  choice: als Brandopfer
  rationale: עֹלָה ist die feststehende Bezeichnung für das ganz verbrannte Opfer. „Als“ bezeichnet hier seine Bestimmung beziehungsweise Opferart natürlich.
- source_word: זָכָר
  choice: ein männliches Tier
  rationale: Die Geschlechtsanforderung wird ausdrücklich bewahrt; „Tier“ macht im Deutschen klar, dass sich das Adjektiv auf das Opfertier bezieht.
- source_word: תָּמִים
  choice: ohne Makel
  rationale: Im Opferkontext bezeichnet תָּמִים ein Tier ohne körperlichen Fehler oder Defekt.
- source_word: יַקְרִיבֶנּוּ
  choice: soll er … darbringen
  rationale: Der Hifil von קרב bezeichnet im Opferkontext das Heranbringen beziehungsweise Darbringen. Die deutsche Wortstellung verbindet das Verb natürlich mit seinem bereits näher bestimmten Objekt.
theological_decisions:
- issue: Wiedergabe des Opferbegriffs עֹלָה
  choice: Brandopfer
  alternative: Aufstiegsopfer
  rationale: „Brandopfer“ ist die geläufige und verständliche Bezeichnung für diese levitische Opferart. Die etymologische Alternative „Aufstiegsopfer“ würde einen weniger vertrauten Ausdruck einführen, ohne dass der Kontext dies erfordert.
- issue: Geschlecht des Opfertiers
  choice: ein männliches Tier
  alternative: ein männliches
  rationale: Der hebräische Text schreibt ausdrücklich ein männliches Opfertier vor. Die Ergänzung „Tier“ sorgt im modernen Deutsch für Klarheit, ohne den Inhalt zu erweitern.
- issue: Syntaktische Beziehung von זָכָר תָּמִים zu יַקְרִיבֶנּוּ
  choice: soll er ein männliches Tier ohne Makel darbringen
  alternative: soll er es darbringen, ein männliches Tier ohne Makel
  rationale: Die natürliche deutsche Form gibt das Opfertier als Objekt wieder und bewahrt beide hebräischen Anforderungen. Die Alternative bildet das pronominale Suffix formaler ab, wirkt aber unnötig schwerfällig.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Kleinvieh“ ist ein präziser, weiterhin verständlicher Sammelbegriff für Schafe und Ziegen; die anschließende Aufzählung erläutert ihn. Die Satzstellung ist idiomatisch, ohne die sachlichen Anforderungen des Hebräischen abzuschwächen.
