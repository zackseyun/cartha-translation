source:
  edition: WLC
  text: וְ/הַ/קֶּ֥רֶב וְ/הַ/כְּרָעַ֖יִם יִרְחַ֣ץ בַּ/מָּ֑יִם וְ/הִקְרִ֨יב הַ/כֹּהֵ֤ן אֶת הַ/כֹּל֙ וְ/הִקְטִ֣יר הַ/מִּזְבֵּ֔חָ/ה עֹלָ֣ה ה֗וּא אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/013.yaml
  text: But he shall wash the entrails and the legs with water[a], and the priest shall present all of it and turn it into smoke on the altar. It is a burnt offering, a food offering, a pleasing aroma to Yahweh.
translation:
  language: de
  text: Die Eingeweide und die Beine soll er mit Wasser waschen. Dann soll der Priester alles darbringen und auf dem Altar in Rauch aufgehen lassen. Es ist ein Brandopfer, ein Feueropfer[a], ein angenehmer Duft für den HERRN.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: eine Speisegabe; die genaue Bedeutung des hebräischen Ausdrucks ist umstritten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֶּרֶב
  choice: die Eingeweide
  rationale: Im Opferkontext bezeichnet das Wort die inneren Organe beziehungsweise Innereien des Tieres. „Eingeweide“ ist konkret und im Deutschen verständlich.
- source_word: הַכְּרָעַיִם
  choice: die Beine
  rationale: Gemeint sind die Gliedmaßen, wahrscheinlich besonders die Unterschenkel. „Beine“ ist die natürliche, allgemein verständliche Wiedergabe.
- source_word: יִרְחַץ בַּמָּיִם
  choice: soll er mit Wasser waschen
  rationale: Die Formulierung gibt sowohl das Waschen als auch das im Hebräischen ausdrücklich genannte Mittel wieder.
- source_word: וְהִקְרִיב
  choice: soll ... darbringen
  rationale: Der Hifil von קרב bezeichnet hier das Heranbringen beziehungsweise Darbringen des Opfers. Die Wiedergabe bleibt von dem anschließenden Verb für das Verbrennen unterscheidbar.
- source_word: אֶת־הַכֹּל
  choice: alles
  rationale: Die knappe Wiedergabe bewahrt die betonte Gesamtheit des vorbereiteten Opfertiers.
- source_word: וְהִקְטִיר
  choice: in Rauch aufgehen lassen
  rationale: Das kultische Verb bezeichnet genauer als ein allgemeines „verbrennen“, dass die Opfergabe auf dem Altar in Rauch verwandelt wird.
- source_word: הַמִּזְבֵּחָה
  choice: auf dem Altar
  rationale: Dies ist die natürliche deutsche Wiedergabe der direktionalen beziehungsweise lokalen Konstruktion im Opferzusammenhang.
- source_word: עֹלָה
  choice: Brandopfer
  rationale: „Brandopfer“ ist der etablierte deutsche Fachausdruck für diese vollständig auf dem Altar verbrannte Opferart.
- source_word: אִשֵּׁה
  choice: Feueropfer
  rationale: Das seltene kultische Wort bezeichnet eine dem Feuer übergebene Opfergabe. „Feueropfer“ bewahrt den Feuerbezug, ohne die umstrittene Ableitung als „Speisegabe“ festzuschreiben.
- source_word: רֵיחַ נִיחֹחַ
  choice: ein angenehmer Duft
  rationale: Die Wendung beschreibt in bildhafter, sinnlicher Sprache die Annahme des Opfers durch Gott. „Angenehmer Duft“ erhält dieses Bild in natürlichem Deutsch.
- source_word: לַיהוָה
  choice: für den HERRN
  rationale: Der Gottesname JHWH wird entsprechend der verbreiteten ehrfürchtigen deutschen Bibeltradition mit „der HERR“ wiedergegeben; die Präposition bezeichnet hier die Ausrichtung des Opfers auf ihn.
theological_decisions:
- issue: Bildhafte Sprache in רֵיחַ נִיחֹחַ
  choice: ein angenehmer Duft für den HERRN
  alternative: ein beruhigender Duft für den HERRN
  rationale: Die Übersetzung bewahrt die sinnliche Opfermetapher und damit die Aussage göttlicher Annahme, ohne sie als physiologische Beschreibung zu erklären oder abzuschwächen.
- issue: Bedeutung von אִשֵּׁה
  choice: Feueropfer
  alternative: Speisegabe
  rationale: Die Etymologie und genaue kultische Nuance sind umstritten. „Feueropfer“ wahrt den wahrscheinlichen Bezug zum Altarfeuer; eine Fußnote macht die stärker funktionale Alternative sichtbar, ohne die Spannung im Haupttext aufzulösen.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: der HERR
  alternative: Jahwe
  rationale: „Der HERR“ folgt der jüdischen Lesetradition und der weithin vertrauten deutschen Bibelsprache, ohne eine konfessionelle Sonderdeutung einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer kultischer Terminologie. Der Wechsel vom Opfernden („er“) zum Priester bleibt erhalten. Kurze Hauptsätze bilden die schrittweise Opferhandlung ab; die konkrete Rauch- und Duftsprache des Hebräischen wird bewahrt.
