  text: וְ֠/נָתְנוּ בְּנֵ֨י אַהֲרֹ֧ן הַ/כֹּהֵ֛ן אֵ֖שׁ עַל הַ/מִּזְבֵּ֑חַ וְ/עָרְכ֥וּ עֵצִ֖ים עַל הָ/אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/007.yaml
  text: And the sons of Aaron the priest shall put fire on the altar and arrange wood on the fire[a].
translation:
  language: de
  text: Die Söhne des Priesters Aaron sollen Feuer auf den Altar legen und Holz auf dem Feuer zurechtlegen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתְנוּ
  choice: sollen … legen
  rationale: נתן bedeutet häufig „geben, legen, setzen“. Im Zusammenhang dieser Opferanweisung gibt „legen“ die konkrete Handlung natürlich wieder; „sollen“ vermittelt den anweisenden Charakter.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֵן
  choice: die Söhne des Priesters Aaron
  rationale: Die hebräische Konstruktion bezeichnet Aarons Söhne und identifiziert Aaron durch die singularische Apposition als Priester. Die deutsche Formulierung wahrt diesen Bezug ohne den Eindruck zu erwecken, alle Söhne würden hier jeweils ausdrücklich „Priester“ genannt.
- source_word: אֵשׁ
  choice: Feuer
  rationale: Gemeint ist im Ablauf des Opferrituals wörtliches Feuer.
- source_word: עַל הַמִּזְבֵּחַ
  choice: auf den Altar
  rationale: Die Präposition עַל bezeichnet hier das Aufbringen des Feuers auf die Altarfläche; wegen der gerichteten Handlung steht im Deutschen der Akkusativ.
- source_word: וְעָרְכוּ
  choice: und … aufschichten
  rationale: ערך bezeichnet ein geordnetes Anordnen oder Zurechtlegen. Bei Holz auf einem Feuer ist „aufschichten“ anschaulich und idiomatisch und bewahrt den Gedanken einer geordneten Anordnung.
- source_word: עֵצִים
  choice: Holz
  rationale: Obwohl das hebräische Wort im Plural steht, ist der deutsche Sammelbegriff „Holz“ in diesem Zusammenhang natürlich und ohne unnötige Präzisierung.
- source_word: עַל הָאֵשׁ
  choice: auf dem Feuer
  rationale: Die wiederholte Präpositionalverbindung wird beibehalten. Nach dem statisch verstandenen Anordnen des Holzes ist der Dativ im Deutschen idiomatisch.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer Verfahrensformulierung. Der singularische Titel „Priester“ wird eindeutig auf Aaron bezogen; die Reihenfolge der beiden rituellen Handlungen bleibt erhalten.
