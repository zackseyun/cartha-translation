base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/005.yaml
  text: And he shall slaughter the young bull before Yahweh[a], and Aaron’s sons, the priests, shall present the blood and throw the blood against the altar all around[b], which is at the entrance of the tent of meeting.
translation:
  language: de
  text: Dann soll er den jungen Stier vor Jahwe schlachten. Aarons Söhne, die Priester, sollen das Blut darbringen und es ringsum an den Altar sprengen[a], der am Eingang des Zeltes der Begegnung steht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Blut ringsum gegen den Altar werfen“. Das hebräische Verb bezeichnet ein kräftiges werfendes beziehungsweise schleuderndes Ausbringen des Blutes; „sprengen“ ist die im Deutschen übliche kultische Wiedergabe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  choice: Dann soll er … schlachten
  rationale: Das Perfekt hat im fortlaufenden Ritualgesetz anweisende Bedeutung; „schlachten“ bezeichnet die rituelle Tötung genauer als „töten“.
- source_word: בֶּן הַבָּקָר
  choice: das junge Rind
  rationale: Wörtlich „Sohn des Rindviehs“; die idiomatische deutsche Wiedergabe lässt das Geschlecht offen, das der hebräische Ausdruck hier nicht eindeutig festlegt.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: Bewahrt die knappe räumlich-kultische Formulierung und gibt den Gottesnamen als Eigennamen wieder.
- source_word: וְהִקְרִיבוּ
  choice: sollen … darbringen
  rationale: Das Hifil von קרב bezeichnet das Heranbringen beziehungsweise Präsentieren; beim Blut ist „darbringen“ natürlich und vermeidet, den Vorgang mit dem gesamten Opfer gleichzusetzen.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: Aarons Söhne, die Priester
  rationale: Erhält sowohl die verwandtschaftliche Bezeichnung als auch die appositionelle Kennzeichnung ihrer priesterlichen Aufgabe.
- source_word: וְזָרְקוּ ... עַל הַמִּזְבֵּחַ סָבִיב
  choice: es ringsum an den Altar sprengen
  rationale: „Sprengen“ bezeichnet im Deutschen das kräftige rituelle Ausbringen von Flüssigkeit besser als das missverständliche „werfen“ und ist stärker als bloßes „besprengen“; „an den Altar“ gibt die Applikation an dessen Seiten wieder.
- source_word: אֹהֶל מוֹעֵד
  choice: Zelt der Begegnung
  rationale: Transparente, im Deutschen natürliche Wiedergabe des Zeltes, an dem die Begegnung stattfindet; vermeidet die architektonischen Nebenbedeutungen von „Stiftshütte“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen; „Jahwe“ macht ihn als solchen sichtbar, statt ihn durch einen Titel zu ersetzen.
- issue: Geschlecht und Alter von בֶּן הַבָּקָר
  choice: das junge Rind
  alternative: der junge Stier
  rationale: Die Wendung bezeichnet ein Tier vom Rind, enthält aber hier keine ausdrücklich männliche Geschlechtsbezeichnung. „Jung“ bildet בֶּן idiomatisch ab, ohne zusätzlich „Stier“ festzulegen.
translation_notes:
  register: Moderne, würdige Gesetzessprache. Die Satzteilung erhöht die Verständlichkeit, ohne den Ablauf zu verändern. „Dann soll“ bildet den fortlaufenden Anweisungscharakter ab; Pronomen vermeiden eine im Deutschen schwerfällige Wiederholung von „das Blut“.
