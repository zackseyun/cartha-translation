id: LEV.1.1
reference: Leviticus 1:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּקְרָ֖א אֶל מֹשֶׁ֑ה וַ/יְדַבֵּ֤ר יְהוָה֙ אֵלָ֔י/ו מֵ/אֹ֥הֶל מוֹעֵ֖ד לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/001.yaml
  text: Then Yahweh called to Moses and spoke to him from the tent of meeting[a], saying,
translation:
  language: de
  text: 'Dann rief Jahwe Mose und sprach zu ihm aus dem Zelt der Begegnung[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Zelt der Zusammenkunft“. Hebräisch: „Zelt der festgesetzten Zusammenkunft“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: rief
  rationale: קרא mit אֶל bezeichnet hier, dass Gott Mose anredet. „Rief“ ist natürlich und vermeidet die stärkere Bedeutung von „herbeirufen“.
- source_word: אֶל־מֹשֶׁה
  choice: Mose
  rationale: Im Deutschen kann „jemanden rufen“ das hebräische „zu Mose rufen“ idiomatisch wiedergeben; „Mose“ ist die gebräuchliche deutsche Namensform.
- source_word: וַיְדַבֵּר
  choice: sprach
  rationale: „Sprach“ bewahrt den feierlichen Erzählton und unterscheidet das Verb vom folgenden לֵאמֹר.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen geläufige Umschrift gibt den göttlichen Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֵלָיו
  choice: zu ihm
  rationale: Das Suffix verweist eindeutig auf Mose.
- source_word: מֵאֹהֶל מוֹעֵד
  choice: aus dem Zelt der Begegnung
  rationale: מִן bezeichnet die Herkunft der Stimme; „Zelt der Begegnung“ gibt die Funktion des Heiligtums als Ort der Begegnung natürlich und präzise wieder.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der hebräische Redeintroduktor wird im modernen Deutschen vor der unmittelbar folgenden direkten Rede am natürlichsten durch einen Doppelpunkt wiedergegeben.
- source_word: וַ
  choice: Dann
  rationale: Das einleitende narrative Waw führt die Handlung im Anschluss an den vorausgehenden Zusammenhang fort; „Dann“ macht diese Folge verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. „Jahwe“ bewahrt diesen, während „der HERR“ ihn durch einen traditionellen Ersatztitel wiedergibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt gibt לֵאמֹר idiomatisch wieder und leitet die in Vers 2 folgende Rede ein. Der Fußnotenmarker steht unmittelbar bei der betreffenden Wendung.
