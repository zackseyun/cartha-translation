source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם אָדָ֗ם כִּֽי יַקְרִ֥יב מִ/כֶּ֛ם קָרְבָּ֖ן לַֽ/יהוָ֑ה מִן הַ/בְּהֵמָ֗ה מִן הַ/בָּקָר֙ וּ/מִן הַ/צֹּ֔אן תַּקְרִ֖יבוּ אֶת קָרְבַּנְ/כֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/002.yaml
  text: 'Speak to the sons of Israel and say to them: When a man from among you brings an offering to Yahweh[b][a], you shall bring your offering from the livestock—from the herd or from the flock.'
translation:
  language: de
  text: 'Rede zu den Söhnen Israels[a] und sag ihnen: Wenn ein Mensch[b] von euch Jahwe eine Opfergabe darbringt, sollt ihr eure Opfergabe vom Vieh darbringen, von den Rindern oder vom Kleinvieh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu den Israeliten“ beziehungsweise „zum Volk Israel“. Wörtlich: „zu den Söhnen Israels“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „jemand“. Das hebräische Wort אָדָם (adam) bezeichnet hier einen einzelnen Menschen in einem repräsentativen Fall.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die formelhafte hebräische Anrede wird nah am Wortlaut wiedergegeben. Im Deutschen ist „Israeliten“ eine flüssigere mögliche Wiedergabe, wird aber in der Fußnote genannt.
- source_word: אָדָם
  choice: ein Mensch
  rationale: אָדָם bezeichnet hier repräsentativ eine einzelne Person, die den beschriebenen Fall eröffnet. „Ein Mensch“ ist im modernen Deutschen natürlich und bewahrt den generischen Sinn.
- source_word: יַקְרִיב / תַּקְרִיבוּ
  choice: darbringen
  rationale: Der Hifil von קרב bezeichnet im Opferzusammenhang das Heranbringen beziehungsweise Präsentieren einer Gabe. „Darbringen“ ist im Deutschen präzise, würdig und in beiden Satzteilen idiomatisch.
- source_word: מִכֶּם
  choice: von euch
  rationale: Die partitive Wendung bezeichnet eine einzelne Person aus der angesprochenen Gemeinschaft.
- source_word: קָרְבָּן
  choice: Opfergabe
  rationale: קָרְבָּן ist eine Gott dargebrachte Gabe und weiter gefasst als ein ausschließlich als Schlachtung verstandenes „Opfer“. „Opfergabe“ hält Gabe und kultischen Zusammenhang zusammen.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als Eigenname wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: הַבְּהֵמָה
  choice: das Vieh
  rationale: Der Sammelbegriff bezeichnet hier domestizierte Tiere, aus denen die Opfergabe genommen wird.
- source_word: הַבָּקָר
  choice: die Rinder
  rationale: Der Ausdruck bezeichnet Großvieh, insbesondere Rinder; die konkrete deutsche Bezeichnung ist klarer als das mehrdeutige „Herde“.
- source_word: הַצֹּאן
  choice: das Kleinvieh
  rationale: Der hebräische Sammelbegriff umfasst vor allem Schafe und Ziegen. „Kleinvieh“ bewahrt diese kollektive Kategorie knapp und sachgerecht.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Text nennt das Tetragramm ausdrücklich. Die Wiedergabe als „Jahwe“ lässt den offenbarten Eigennamen erkennbar und ersetzt ihn nicht durch einen Titel.
- issue: Repräsentative Personenbezeichnung אָדָם
  choice: ein Mensch
  alternative: jemand / ein Mann
  rationale: Hier eröffnet eine einzelne Person stellvertretend die Fallregel. „Ein Mensch“ entspricht der lexikalischen Breite von אָדָם, ohne das Geschlecht der handelnden Person stärker festzulegen, als es dieses Substantiv an dieser Stelle verlangt.
- issue: Formelhafte Gemeinschaftsbezeichnung בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Israeliten / das Volk Israel
  rationale: Die wörtlichere Form bewahrt die traditionelle Bundes- und Abstammungsformel. Die idiomatischeren Gemeinschaftsbezeichnungen bleiben als Fußnotenalternativen sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anredeformel bleibt bewusst quellennah; die eigentliche Opferanweisung ist zugleich natürlich und verständlich formuliert. Der Wechsel vom Singular („ein Mensch“) zum Plural („sollt ihr … eure“) wird als bedeutungsvoller Wechsel von der Fallperson zur angesprochenen Gemeinschaft bewahrt.
