base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/012.yaml
  text: And he shall cut it into its pieces[a], with its head and its fat, and the priest shall arrange them on the wood that is on the fire, which is on the altar.
translation:
  language: de
  text: Er soll es in seine Stücke zerlegen, einschließlich seines Kopfes und seines Fetts[a]. Der Priester soll diese Teile auf dem Holz anordnen, das auf dem Feuer liegt, das sich auf dem Altar befindet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seinem Talg“ beziehungsweise „dem Fett um seine Eingeweide“. Das hebräische Wort bezeichnet Fettgewebe des Opfertiers.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִתַּח אֹתוֹ לִנְתָחָיו
  choice: Dann soll er es in seine Stücke zerlegen
  rationale: „Zerlegen“ gibt die rituelle Anweisung zum Zerteilen des Tieres idiomatisch wieder; „in seine Stücke“ bewahrt die innere Wortverbindung der hebräischen Wurzel נתח.
- source_word: רֹאשׁוֹ
  choice: seinem Kopf
  rationale: Die anatomische Bezeichnung wird direkt wiedergegeben; die Dativform folgt im Deutschen natürlich auf „samt“.
- source_word: פִּדְרוֹ
  choice: seinem Fett
  rationale: Der seltene Ausdruck bezeichnet Fettgewebe beziehungsweise die Fettdecke des Opfertiers. „Fett“ ist verständlich und vermeidet eine übergenaue Festlegung; die mögliche genauere Bedeutung wird in der Fußnote genannt.
- source_word: וְעָרַךְ
  choice: soll … anordnen
  rationale: ערך bezeichnet hier das geordnete Auflegen der Opferteile. „Anordnen“ erhält diesen rituell geordneten Sinn.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Übliche und sachlich genaue Wiedergabe von כהן.
- source_word: אֹתָם
  choice: sie
  rationale: Das Pronomen nimmt gemeinsam die Stücke, den Kopf und das Fett auf.
- source_word: עַל הָעֵצִים
  choice: auf dem Holz
  rationale: Der hebräische Plural wird im Deutschen idiomatisch als Kollektivbezeichnung „Holz“ wiedergegeben.
- source_word: אֲשֶׁר עַל הָאֵשׁ אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: das auf dem Feuer liegt, das sich auf dem Altar befindet
  rationale: Die gestaffelten Relativsätze und die räumliche Abfolge des Hebräischen bleiben sichtbar; „liegt“ und „sich … befindet“ ergeben dabei natürliches Deutsch.
