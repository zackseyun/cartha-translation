base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/028.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: de
  text: 'Und Jahwe sprach zu Mose:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Und … sprach
  rationale: Das Waw mit der Verbform führt den nächsten Redeabschnitt fort. „Und … sprach“ gibt den hebräischen Erzählfluss würdig und natürlich wieder und unterscheidet דִּבֵּר von אָמַר.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als Gottes Eigenname wiedergegeben, statt es durch den traditionellen Titel „der HERR“ zu ersetzen.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition kennzeichnet hier den Adressaten der Rede; „zu Mose sprechen“ ist die natürliche deutsche Entsprechung.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Der Personenname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Die hebräische Infinitivformel leitet die folgende direkte Rede ein. Im modernen Deutschen erfüllt ein Doppelpunkt diese Funktion natürlicher als das formelhafte „und sagte“ oder „mit den Worten“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. „Jahwe“ bewahrt den Eigennamecharakter, während „der HERR“ die traditionelle Ersatzlesung darstellt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kurze Einleitungsformel bleibt knapp; der Doppelpunkt kündigt die in den Folgeversen beginnende direkte Rede an.
