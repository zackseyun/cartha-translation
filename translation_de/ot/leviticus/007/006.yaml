  text: כָּל זָכָ֥ר בַּ/כֹּהֲנִ֖ים יֹאכְלֶ֑/נּוּ בְּ/מָק֤וֹם קָדוֹשׁ֙ יֵאָכֵ֔ל קֹ֥דֶשׁ קָֽדָשִׁ֖ים הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/006.yaml
  text: Every male among the priests may eat it[a]; it shall be eaten in a holy place[b]. It is most holy.
translation:
  language: de
  text: Jeder männliche Priester darf davon essen[a]. An einem heiligen Ort soll es gegessen werden. Es ist hochheilig[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jeder männliche Priester soll es essen.“ Die hebräische Verbform kann hier auch stärker verpflichtend verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Heiligkeit der Heiligkeiten“; eine hebräische Steigerungsform für den höchsten Grad kultischer Heiligkeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל זָכָר בַּכֹּהֲנִים
  choice: Jeder männliche Angehörige der Priesterschaft
  rationale: Die Formulierung gibt כָּל distributiv wieder, bewahrt die ausdrückliche Geschlechtsangabe זָכָר und versteht בַּכֹּהֲנִים als Zugehörigkeit zur Gruppe der Priester.
- source_word: יֹאכְלֶנּוּ
  choice: darf davon essen
  rationale: Das Imperfekt bezeichnet hier im Zusammenhang des Opferrechts die erlaubte Teilhabe. „Davon“ verweist natürlich auf den zuvor genannten Opferanteil.
- source_word: בְּמָקוֹם קָדוֹשׁ
  choice: an einem heiligen Ort
  rationale: Da מָקוֹם keinen Artikel trägt, bleibt der Ort unbestimmt; „an“ ist bei der deutschen Wendung „an einem Ort“ idiomatisch.
- source_word: יֵאָכֵל
  choice: soll es gegessen werden
  rationale: Die Nifal-Form ist passiv; „soll“ gibt die rechtliche Anweisung wieder, ohne sie als bloße Möglichkeit abzuschwächen.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: hochheilig
  rationale: Die hebräische Steigerungsform bezeichnet die höchste kultische Heiligkeitsstufe. „Hochheilig“ ist im Deutschen prägnant und vermeidet eine Verwechslung mit dem Allerheiligsten als Raum.
- source_word: הוּא
  choice: Es ist
  rationale: Das Pronomen nimmt den betreffenden Opferanteil wieder auf und bildet eine einfache Aussage über dessen Heiligkeitsgrad.
theological_decisions:
- issue: Beschränkung des Verzehrs auf männliche Angehörige der Priesterschaft
  choice: Jeder männliche Angehörige der Priesterschaft darf davon essen
  alternative: Jeder Priester darf davon essen
  rationale: Der hebräische Text nennt זָכָר („männlich“) ausdrücklich. Die Übersetzung bewahrt diese kultrechtliche Einschränkung, ohne sie zu verallgemeinern.
- issue: Rechtscharakter der beiden Verbformen
  choice: „darf“ für יֹאכְלֶנּוּ und „soll“ für יֵאָכֵל
  alternative: Beide Formen mit „soll“ oder beide mit „darf“ wiedergeben
  rationale: Die erste Aussage beschreibt die berechtigte Personengruppe, die zweite legt den vorgeschriebenen Ort des Verzehrs fest. So bleibt die Spannung zwischen Erlaubnis und Anweisung erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Priesterschaft“ bezeichnet die priesterliche Gruppe; „hochheilig“ gibt die kultische Einstufung knapp wieder. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
