id: LEV.7.1
reference: Leviticus 7:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/זֹ֥את תּוֹרַ֖ת הָ/אָשָׁ֑ם קֹ֥דֶשׁ קָֽדָשִׁ֖ים הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/001.yaml
  text: 'This is the law of the guilt offering: it is most holy[a].'
translation:
  language: de
  text: 'Und dies ist die Weisung für das Schuldopfer: Es ist hochheilig.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wiedergutmachungsopfer“ oder „Entschädigungsopfer“. Das hebräische Wort ascham bezeichnet ein Opfer, das mit Schuld und Wiedergutmachung verbunden ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: Und dies
  rationale: Die Verbindung aus ו und זֹאת leitet den neuen Abschnitt ein. „Und dies“ bewahrt den Anschluss an den vorausgehenden Text, ohne einen zeitlichen Sinn wie „nun“ einzutragen.
- source_word: תּוֹרַת
  choice: die Weisung für
  rationale: תּוֹרָה bezeichnet hier die verbindliche Vorschrift beziehungsweise Verfahrensordnung für dieses Opfer. „Weisung für“ ist im modernen Deutsch natürlicher und kontextuell genauer als „Gesetz des“.
- source_word: הָאָשָׁם
  choice: das Schuldopfer
  rationale: אָשָׁם ist die Bezeichnung einer bestimmten Opferart, die mit Schuld und Wiedergutmachung verbunden ist. „Schuldopfer“ ist die etablierte, verständliche deutsche Benennung; weitere Bedeutungsnuancen werden in der Fußnote bewahrt.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: hochheilig
  rationale: Die hebräische Intensiv- beziehungsweise Superlativverbindung bezeichnet den höchsten Heiligkeitsgrad. „Hochheilig“ gibt diese kultische Einstufung knapp und idiomatisch wieder, ohne sie mit dem räumlichen „Allerheiligsten“ zu verwechseln.
- source_word: הוּא
  choice: Es ist
  rationale: Das Pronomen steht prädikativ und ordnet das Schuldopfer der genannten Heiligkeitsstufe zu. Im Deutschen ist dafür die Kopula erforderlich.
theological_decisions:
- issue: Wiedergabe der Opferbezeichnung אָשָׁם
  choice: Schuldopfer
  alternative: Wiedergutmachungsopfer oder Entschädigungsopfer
  rationale: „Schuldopfer“ bewahrt die geläufige Bezeichnung der levitischen Opferkategorie und ihren Bezug zur Schuld. Da אָשָׁם zugleich den Aspekt der Wiedergutmachung beziehungsweise Entschädigung tragen kann, werden diese sachlich möglichen Wiedergaben in einer Fußnote genannt, statt die Spannung im Haupttext einseitig aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Weisung“ vermeidet einen unnötig juristischen Klang, während „hochheilig“ die kultische Fachbedeutung verständlich und knapp ausdrückt.
