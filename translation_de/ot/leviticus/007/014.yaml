base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/014.yaml
  text: And from it he shall present one from each offering as a contribution to Yahweh[c][b][a]; it shall belong to the priest who sprinkles the blood of the peace offerings.
translation:
  language: de
  text: Davon soll er von jeder Opfergabe ein Stück als Abgabe für den HERRN[a] darbringen. Es soll dem Priester gehören, der das Blut der Friedensopfer[b] sprengt.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als Hebopfer für den HERRN“. Gemeint ist ein für Gott ausgesonderter und dem Priester zugewiesener Anteil.'
    reason: lexical_alternative
  - marker: b
    text: Auch „Gemeinschaftsopfer“ oder „Heilsopfer“.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „der das Blut der Friedensopfer wirft“. Im Opferkontext bezeichnet das Verb das rituelle Sprengen des Blutes.'
    reason: lexical_clarification
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: soll er darbringen
  rationale: Das Hifil von קרב bezeichnet im Opferkontext das Heranbringen beziehungsweise Darbringen; „darbringen“ ist im Deutschen klar und sachgerecht.
- source_word: מִמֶּנּוּ אֶחָד מִכָּל קָרְבָּן
  choice: Davon … von jeder Opfergabe ein Stück
  rationale: Das Hebräische sagt wörtlich „davon eines von jeder Opfergabe“. „Ein Stück“ macht den im Zusammenhang vorausgesetzten einzelnen Brotanteil verständlich, ohne dessen Art weiter festzulegen.
- source_word: תְּרוּמָה
  choice: Abgabe
  rationale: Der Ausdruck bezeichnet einen für Gott ausgesonderten und dem Priester zugewiesenen Anteil. „Abgabe“ ist verständlicher als der traditionelle Fachausdruck „Hebopfer“.
- source_word: לַיהוָה
  choice: für den HERRN
  rationale: Die Präposition kennzeichnet hier die Widmung. Der Gottesname wird entsprechend der Projektkonvention mit „der HERR“ wiedergegeben.
- source_word: הַזֹּרֵק
  choice: an den Altar sprengt
  rationale: זרק bezeichnet im Opferritual das gezielte Werfen beziehungsweise Sprengen des Blutes gegen den Altar. Die Ergänzung „an den Altar“ ergibt sich aus dem feststehenden Ritualzusammenhang und verhindert die irreführende Vorstellung eines feinen Besprengens.
- source_word: דַּם הַשְּׁלָמִים
  choice: das Blut des Friedensopfers
  rationale: שְׁלָמִים ist die etablierte Opferkategorie des Friedensopfers; der deutsche Singular kann die Opferart kollektiv bezeichnen.
- source_word: לוֹ יִהְיֶה
  choice: Es soll dem Priester gehören
  rationale: Die Wendung drückt die rechtmäßige Zuweisung dieses Anteils an den handelnden Priester aus.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: der HERR
  alternative: Jahwe
  rationale: Die übliche projektgemäße Wiedergabe wahrt die erkennbare Unterscheidung des Gottesnamens durch Kapitälchen.
- issue: Wiedergabe von שְׁלָמִים
  choice: Friedensopfer
  alternative: Gemeinschaftsopfer oder Heilsopfer
  rationale: „Friedensopfer“ bewahrt die traditionelle Opferbezeichnung, ohne die Bedeutungsbreite einseitig auf Gemeinschaft oder Wohlergehen zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung verbessert die Lesbarkeit. Opferterminologie bleibt erkennbar, während unverständliche Fachsprache im Haupttext vermieden wird; Alternativen werden in Fußnoten bewahrt.
