source:
  edition: WLC
  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הַ/מַּקְרִ֞יב אֶת זֶ֤בַח שְׁלָמָי/ו֙ לַ/יהוָ֔ה יָבִ֧יא אֶת קָרְבָּנ֛/וֹ לַ/יהוָ֖ה מִ/זֶּ֥בַח שְׁלָמָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/029.yaml
  text: 'Speak to the sons of Israel[b][a], saying: The one who presents his peace sacrifice to Yahweh shall bring his offering to Yahweh from his peace sacrifice.'
translation:
  language: de
  text: 'Rede zu den Israeliten[a] und sage: Wer dem HERRN sein Heilsopfer[b] darbringt, soll dem HERRN seine Opfergabe aus seinem Heilsopfer darbringen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »zu den Söhnen Israels«; auch: »zu den Kindern Israels«.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionell auch: »Friedensopfer«; andere übersetzen: »Gemeinschaftsopfer«. Das hebräische Wort bezeichnet eine Opferkategorie, die mit Heil, Wohlergehen und Frieden verbunden ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל בְּנֵי יִשְׂרָאֵל לֵאמֹר
  choice: Rede zu den Israeliten und sag
  rationale: Die Wendung wird als natürliche deutsche Einleitungsformel wiedergegeben. „Israeliten“ bewahrt den kollektiven Bezug von בְּנֵי יִשְׂרָאֵל, ohne im Deutschen fälschlich nur männliche Nachkommen anzusprechen.
- source_word: הַמַּקְרִיב
  choice: Wer … darbringt
  rationale: Das substantivierte Hifil-Partizip von קרב bezeichnet die Person, die ein Opfer vor Gott bringt bzw. darbringt; „wer“ ist im deutschen Rechtstext idiomatisch.
- source_word: זֶבַח שְׁלָמָיו
  choice: sein Heilsopfer
  rationale: זֶבַח bezeichnet ein Schlachtopfer; שְׁלָמִים ist die technische Opferbezeichnung mit Bezügen zu Heil, Wohlergehen und Frieden. „Heilsopfer“ ist knapp, kultisch verständlich und vermeidet die Verengung auf bloße Gemeinschaft.
- source_word: לַיהוָה
  choice: dem HERRN
  rationale: Der Gottesname יהוה wird nach verbreiteter deutscher Bibelkonvention mit „HERR“ in Kapitälchen wiedergegeben; der Dativ entspricht der deutschen Rektion von „darbringen“ und „bringen“.
- source_word: יָבִיא
  choice: soll … bringen
  rationale: Das Imperfekt hat im gesetzlichen Kontext verpflichtenden Charakter. „Soll“ vermittelt diesen normativen Sinn in natürlichem modernem Deutsch.
- source_word: קָרְבָּנוֹ
  choice: seine Opfergabe
  rationale: קָרְבָּן ist eine allgemeine Bezeichnung für eine Gott dargebrachte Gabe. „Opfergabe“ unterscheidet sie verständlich vom spezifischen Heilsopfer.
- source_word: מִזֶּבַח שְׁלָמָיו
  choice: von seinem Heilsopfer
  rationale: מִן bezeichnet hier die Herkunft bzw. den Anteil, der aus dem Heilsopfer genommen und gebracht wird. Das knappe „von“ erhält diese Beziehung, ohne den folgenden Vers vorwegzunehmen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: der HERR
  alternative: JHWH / Jahwe
  rationale: „HERR“ folgt der etablierten ehrfürchtigen Lesetradition und kennzeichnet den Eigennamen typografisch, ohne eine unsichere Rekonstruktion der Aussprache in den Haupttext zu setzen.
- issue: Bedeutung von זֶבַח שְׁלָמִים
  choice: Heilsopfer
  alternative: Friedensopfer; Gemeinschaftsopfer; Schlachtopfer der Heilsgaben
  rationale: Die Opferkategorie umfasst semantische Aspekte von Heil, Wohlergehen und Frieden. „Heilsopfer“ wahrt die kultische Kategorie, während eine Fußnote echte Übersetzungsalternativen nennt.
- issue: Kollektive Anrede בְּנֵי יִשְׂרָאֵל
  choice: Israeliten
  alternative: Söhne Israels; Kinder Israels
  rationale: Im Kontext ist das Bundesvolk kollektiv angesprochen. Das natürliche deutsche „Israeliten“ gibt diesen Referenzumfang wieder, während die wörtliche Form in der Fußnote dokumentiert wird.
translation_notes:
  register: Moderner, würdiger Gesetzesstil. Die einleitende Redef Formel ist im Deutschen leicht geglättet; „darbringen“ hält den kultischen Ton, während „soll“ die verpflichtende Kraft der Vorschrift natürlich ausdrückt. Sämtliche Fußnotenmarker stehen unmittelbar bei den erläuterten Ausdrücken.
