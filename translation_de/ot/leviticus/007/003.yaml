  text: 'And from it he shall present all its fat: the fat tail and the fat that covers the entrails[a][b].'
translation:
  language: de
  text: 'Von dem Opfertier soll er alles Fett darbringen: den Fettschwanz[b] und das Fett, das die Eingeweide bedeckt.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das die inneren Teile bedeckt“.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist der besonders fettreiche Schwanz eines Fettschwanzschafes, ein bestimmter zum Opfer gehörender Fettteil.
    reason: cultural_note
lexical_decisions:
- source_word: חֶלְבּוֹ / הַחֵלֶב
  choice: sein gesamtes Fett / das Fett
  rationale: חֵלֶב bezeichnet im Opferkontext die für die Darbringung bestimmten Fettteile. „Fett“ ist direkt und im Deutschen sachlich verständlich; „gesamte“ gibt כָּל wieder.
- source_word: יַקְרִיב
  choice: soll darbringen
  rationale: Der Hifil von קרב bezeichnet in Opferbestimmungen das rituelle Heranbringen beziehungsweise Darbringen. „Darbringen“ bewahrt den kultischen Sinn, ohne einen einzelnen Vollzugsschritt enger festzulegen.
- source_word: מִמֶּנּוּ
  choice: von ihm
  rationale: Das Suffix bezieht sich auf das Opfertier. Da im Deutschen Tierbezeichnungen grammatisch maskulin sein können und der unmittelbare Kontext das Tier identifiziert, bleibt „von ihm“ nahe an der hebräischen Form.
- source_word: הָאַלְיָה
  choice: den Fettschwanz
  rationale: אַלְיָה bezeichnet den ausgeprägten fettreichen Schwanz eines Fettschwanzschafes, der als besonderer Opferteil galt.
- source_word: הַמְכַסֶּה אֶת־הַקֶּרֶב
  choice: das die Eingeweide bedeckt
  rationale: קֶרֶב meint hier die inneren Organe beziehungsweise Eingeweide des Tieres. Die Formulierung ist konkret, natürlich und anatomisch passend.
- source_word: כָּל
  choice: gesamtes
  rationale: כָּל betont die Gesamtheit der vorgesehenen Fettteile; „gesamtes“ gibt diesen Umfang idiomatisch wieder.
