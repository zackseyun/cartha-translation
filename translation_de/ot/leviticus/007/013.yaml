source:
  edition: WLC
  text: עַל חַלֹּת֙ לֶ֣חֶם חָמֵ֔ץ יַקְרִ֖יב קָרְבָּנ֑/וֹ עַל זֶ֖בַח תּוֹדַ֥ת שְׁלָמָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/013.yaml
  text: Along with cakes of leavened bread[a], he shall present his offering with the sacrifice of his peace offerings of thanksgiving.
translation:
  language: de
  text: Zusammen mit Brotfladen aus gesäuertem Teig soll er seine Opfergabe zu seinem Dank-Heilsopfer[a] darbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: Dank-Gemeinschaftsopfer, Dank-Wohlergehensopfer oder Dank-Friedensopfer.'
    reason: Der Fachbegriff שְׁלָמִים umfasst Aspekte von Frieden, Ganzheit, Wohlergehen und Gemeinschaft und besitzt daher mehrere vertretbare deutsche Wiedergaben.
lexical_decisions:
- source_word: עַל
  choice: zusammen mit / bei
  rationale: Die Präposition bezeichnet hier Begleitung beziehungsweise Zuordnung, nicht eine räumliche Lage. Die beiden deutschen Wendungen vermeiden eine schwerfällige Wiederholung.
- source_word: חַלֹּת לֶחֶם חָמֵץ
  choice: Brotkuchen aus gesäuertem Teig
  rationale: חַלּוֹת bezeichnet geformte Kuchen oder Laibe; חָמֵץ kennzeichnet sie als gesäuert. Die Formulierung ist anschaulich und bewahrt den kultischen Gegensatz zu den ungesäuerten Gaben der vorherigen Verse.
- source_word: יַקְרִיב
  choice: soll ... darbringen
  rationale: Das Hifil von קרב ist im Opferkontext das Darbringen einer Gabe. „Darbringen“ ist im Deutschen präzise, würdig und allgemein verständlich.
- source_word: קָרְבָּנוֹ
  choice: seine Opfergabe
  rationale: קָרְבָּן ist die allgemeine Bezeichnung für eine Gott dargebrachte Gabe. „Opfergabe“ unterscheidet das Substantiv klar von der Handlung.
- source_word: זֶבַח תּוֹדַת שְׁלָמָיו
  choice: bei seinem Dank-Heilsopfer
  rationale: Die kompakte Zusammensetzung gibt die hebräische Verbindung eines Dankopfers mit der Opferklasse der שְׁלָמִים natürlich wieder, ohne ein zusätzliches Verhältnis zwischen zwei getrennten Opfern zu behaupten.
- source_word: שְׁלָמִים
  choice: Heilsopfer
  rationale: Der technische Opferbegriff ist mit Frieden, Ganzheit, Wohlergehen und gemeinschaftlicher Mahlzeit verbunden. „Heilsopfer“ ist knapp und traditionsfähig; andere sachlich mögliche Wiedergaben werden in der Fußnote bewahrt.
theological_decisions:
- issue: Wiedergabe der Opferbezeichnung שְׁלָמִים
  choice: Heilsopfer
  alternative: Gemeinschaftsopfer; Wohlergehensopfer; Friedensopfer
  rationale: Kein einzelner deutscher Ausdruck deckt das Bedeutungsspektrum vollständig ab. „Heilsopfer“ wahrt den Gedanken von Heil und Wohlergehen, während die Fußnote die gemeinschaftliche und friedensbezogene Dimension offenhält.
- issue: Verhältnis von תּוֹדָה und שְׁלָמִים
  choice: Dank-Heilsopfer
  alternative: Dankopfer aus der Gruppe seiner Heilsopfer
  rationale: Der hebräische Ausdruck beschreibt das Dankopfer als eine Ausprägung des Heilsopfers. Die Zusammensetzung gibt diese enge Zuordnung wieder, ohne die beiden Begriffe zu zwei selbstständigen Opferhandlungen zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kultische Fachbegriffe werden verständlich, aber nicht umschreibend aufgelöst. Der Bindestrich in „Dank-Heilsopfer“ macht die enge sachliche Verbindung der beiden hebräischen Opferbezeichnungen sichtbar.
