id: LEV.7.21
reference: Leviticus 7:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/נֶ֜פֶשׁ כִּֽי תִגַּ֣ע בְּ/כָל טָמֵ֗א בְּ/טֻמְאַ֤ת אָדָם֙ א֣וֹ בִּ/בְהֵמָ֣ה טְמֵאָ֗ה א֚וֹ בְּ/כָל שֶׁ֣קֶץ טָמֵ֔א וְ/אָכַ֛ל מִ/בְּשַׂר זֶ֥בַח הַ/שְּׁלָמִ֖ים אֲשֶׁ֣ר לַ/יהוָ֑ה וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵ/עַמֶּֽי/הָ־־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/021.yaml
  text: And if a person touches anything unclean—whether human uncleanness[a], or an unclean animal, or any unclean detestable thing—and eats some of the flesh of the sacrifice of peace offerings that belongs to Yahweh[b], that person shall be cut off from his people.
translation:
  language: de
  text: Und wenn jemand irgendetwas Unreines berührt – die Unreinheit eines Menschen, ein unreines Tier oder etwas Unreines und Abscheuliches – und vom Fleisch des Friedensopfers isst, das dem HERRN gehört, soll dieser Mensch von seinem Volk abgeschnitten werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung »von seinem Volk abgeschnitten werden« ist eine Bundesstrafenformel. Sie kann Ausschluss oder göttliches Gericht einschließen; auf welche Weise die Strafe vollzogen wird, sagt der hebräische Text hier nicht.
    reason: alternative_reading
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: jemand / dieser Mensch
  rationale: In diesem Rechtstext bezeichnet נֶפֶשׁ eine einzelne Person, nicht eine vom Körper getrennte »Seele«. Die wechselnde deutsche Formulierung ist natürlich und bewahrt den Personenbezug.
- source_word: תִגַּע בְּכָל טָמֵא
  choice: mit irgendetwas Unreinem in Berührung kommt
  rationale: נגע bezeichnet Berührung beziehungsweise Kontakt. Die Formulierung macht den rituellen Kontakt deutlich und gibt die umfassende, unbestimmte Wendung בְּכָל טָמֵא wieder.
- source_word: טֻמְאַת אָדָם
  choice: die Unreinheit eines Menschen
  rationale: Die Wendung bezeichnet rituelle Unreinheit, die von einem Menschen ausgeht oder mit ihm verbunden ist. אָדָם ist hier allgemein menschlich und nicht männlich zu verstehen.
- source_word: בִּבְהֵמָה טְמֵאָה
  choice: ein unreines Tier
  rationale: בְּהֵמָה bezeichnet hier allgemein ein Tier; »unrein« hält die kultische Terminologie des Verses einheitlich fest.
- source_word: בְּכָל שֶׁקֶץ טָמֵא
  choice: irgendein unreines, abscheuliches Wesen
  rationale: שֶׁקֶץ bezeichnet etwas kultisch Verabscheutes. »Wesen« bleibt weiter als »Kriechtier«, während »abscheulich« die wertende Kraft des hebräischen Ausdrucks bewahrt.
- source_word: וְאָכַל מִבְּשַׂר
  choice: und vom Fleisch … isst
  rationale: Das מִן ist partitiv; die idiomatische deutsche Wendung »vom Fleisch essen« gibt dies wieder. »Fleisch« wahrt die kultische Ausdrucksweise.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: Friedensopfer
  rationale: »Friedensopfer« bleibt nahe an שְׁלָמִים und vermeidet es, den Ausdruck ausschließlich als Gemeinschafts- oder Mahlopfer auszulegen.
- source_word: אֲשֶׁר לַיהוָה
  choice: das dem HERRN gehört
  rationale: Die Formulierung bringt die Zugehörigkeit beziehungsweise Weihe des Opfers zum Ausdruck.
- source_word: יהוה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens in Kapitälchen ist würdig, verständlich und im deutschen Bibelgebrauch fest verankert.
- source_word: וְנִכְרְתָה ... מֵעַמֶּיהָ
  choice: soll … aus seinem Volk ausgerottet werden
  rationale: Die gewichtige Bundesstrafenformel wird formal bewahrt, ohne die Art der Strafe genauer festzulegen, als es der hebräische Text tut.
theological_decisions:
- issue: Bedeutung der Strafandrohung וְנִכְרְתָה ... מֵעַמֶּיהָ
  choice: aus seinem Volk ausgerottet werden
  alternative: aus seinem Volk ausgeschlossen werden / getötet werden
  rationale: Der hebräische Text nennt hier nicht ausdrücklich, ob Ausschluss, Tod oder ein unmittelbares göttliches Gericht gemeint ist. Die traditionelle offene Formulierung bewahrt diese Spannung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem kultrechtlichem Ton. Der Satzbau folgt der hebräischen Bedingungsfolge, wird aber durch Gedankenstriche und »dann« für heutige Leser übersichtlich gegliedert. Kultische Schlüsselbegriffe wie »unrein«, »Fleisch« und »Friedensopfer« bleiben erkennbar.
