    rationale: Der Kontext nennt Tierkategorien, zu denen das Blut gehört; „von Vögeln und Tieren“ ist eine klare, quellennähere Erläuterung. „Landtiere“ ist im hebräischen Wortlaut nicht spezifiziert.
