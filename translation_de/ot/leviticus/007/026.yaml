  naturalness: „Und ihr dürft nirgends, wo ihr wohnt, Blut essen“ ist verständlich und modernes Standarddeutsch. „An allen euren Wohnorten“ ist als unmittelbare, natürliche Entsprechung des hebräischen Rechtsstils ebenso klar und vermeidet die leichte Umformung zu einer Ortsadverbiale.
