  text: וְ/כָל דָּם֙ לֹ֣א תֹאכְל֔וּ בְּ/כֹ֖ל מוֹשְׁבֹתֵי/כֶ֑ם לָ/ע֖וֹף וְ/לַ/בְּהֵמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/026.yaml
  text: And you shall not eat any blood in any of your dwellings[b][a], whether from bird or from animal.
translation:
  language: de
  text: Und ihr dürft an allen euren Wohnorten[a] kein Blut essen, weder von Vögeln noch von Tieren.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an allen euren Siedlungen“; wörtlich: „in allen euren Wohnorten“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „von dem Vogel und von dem Tier“; gemeint ist Blut von Vögeln und Tieren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל דָּם לֹא תֹאכְלוּ
  choice: Und ihr dürft … kein Blut essen
  rationale: Die Konjunktion verbindet das Verbot mit dem Vorhergehenden. כָּל unter der Verneinung wird im Deutschen idiomatisch mit „kein“ wiedergegeben. „Ihr dürft … nicht“ gibt die rechtlich bindende Verbotsform natürlich und klar wieder.
- source_word: בְּ/כֹל מוֹשְׁבֹתֵי/כֶם
  choice: nirgends, wo ihr wohnt
  rationale: מוֹשָׁב bezeichnet einen Wohnort oder eine Siedlung. Zusammen mit dem verneinten Satz bringt „nirgends, wo ihr wohnt“ den umfassenden Geltungsbereich idiomatisch zum Ausdruck.
- source_word: לָ/עוֹף וְ/לַ/בְּהֵמָה
  choice: weder von Vögeln noch von anderen Tieren
  rationale: Die Präposition ל ordnet das Blut den genannten Tierkategorien zu. עוֹף bezeichnet fliegende Tiere beziehungsweise Vögel; בְּהֵמָה bezeichnet hier Landtiere. „Andere Tiere“ macht im Deutschen deutlich, dass Vögel selbst Tiere sind, ohne die Kategorie unnötig auf Nutzvieh zu verengen.
theological_decisions:
- issue: Umfang des Blutverbots
  choice: Das Verbot gilt an allen Wohnorten Israels für Blut von Vögeln und Landtieren.
  alternative: Die Schlusswendung kann formnäher mit „bei Vögeln und bei Tieren“ wiedergegeben werden.
  rationale: Der hebräische Satz nennt die Tierkategorien, deren Blut nicht verzehrt werden darf. Die Übersetzung beschränkt sich auf diesen rechtlichen Sinn und fügt keine spätere theologische Deutung hinzu.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung ist rechtlich bestimmt, aber nicht archaisch. Die Fußnoten bewahren die formnähere Ausdrucksweise und erläutern die Zuordnung der Tierkategorien.
