id: LEV.7.11
reference: Leviticus 7:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/זֹ֥את תּוֹרַ֖ת זֶ֣בַח הַ/שְּׁלָמִ֑ים אֲשֶׁ֥ר יַקְרִ֖יב לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/011.yaml
  text: This is the law of the sacrifice of peace offerings that one shall present to Yahweh:[a]
translation:
  language: de
  text: Dies ist die Weisung für das Heilsopfer, das man Jahwe darbringt:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch „Gemeinschaftsopfer“ oder traditionell „Friedensopfer“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: Dies ist
  rationale: Das waw leitet hier einen neuen Abschnitt ein. Im Deutschen ist kein zusätzliches „Und“ nötig; „Dies ist“ gibt die Gliederungsfunktion natürlich wieder.
- source_word: תּוֹרַת
  choice: die Weisung für
  rationale: תּוֹרָה bezeichnet im priesterlichen Zusammenhang eine verbindliche kultische Vorschrift. „Weisung“ bewahrt sowohl den anleitenden als auch den normativen Sinn und passt idiomatisch zur folgenden Opferbezeichnung.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: das Heilsopfer
  rationale: Die hebräische Wortgruppe bezeichnet eine besondere Art von Schlachtopfer. „Heilsopfer“ ist eine knappe, im Deutschen etablierte Wiedergabe; die Bedeutungsaspekte Gemeinschaft, Frieden und Wohlergehen werden in der Fußnote offengehalten.
- source_word: יַקְרִיב
  choice: man darbringt
  rationale: Der Hifil von קרב bedeutet im Opferkontext „darbringen“ beziehungsweise „herzubringen“. Die dritte Person Singular ist in dieser Rechtsbestimmung generisch; deutsches „man“ gibt dies ohne unnötige Geschlechtsmarkierung wieder.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Die Präposition bezeichnet den Empfänger des Opfers; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Eigennamen ausdrücklich. „Jahwe“ bewahrt diesen Namenscharakter, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von זֶבַח הַשְּׁלָמִים
  choice: Heilsopfer
  alternative: Gemeinschaftsopfer / Friedensopfer
  rationale: Der technische Opferbegriff umfasst Frieden, Wohlergehen und Gemeinschaft, ohne dass ein einzelnes deutsches Wort sämtliche Aspekte abdeckt. Der Haupttext verwendet den etablierten Ausdruck „Heilsopfer“; die Fußnote bewahrt die wesentlichen Alternativen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Formulierung ist als Überschrift beziehungsweise Einleitung der folgenden Opferbestimmungen knapp gehalten; der Doppelpunkt weist auf deren Fortsetzung hin.
