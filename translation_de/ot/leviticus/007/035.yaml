  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: זֹ֣את מִשְׁחַ֤ת אַהֲרֹן֙ וּ/מִשְׁחַ֣ת בָּנָ֔י/ו מֵ/אִשֵּׁ֖י יְהוָ֑ה בְּ/יוֹם֙ הִקְרִ֣יב אֹתָ֔/ם לְ/כַהֵ֖ן לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/035.yaml
  text: This is the anointed portion of Aaron and the anointed portion of his sons from the food offerings of Yahweh[b][a], on the day when he presented them to serve as priests to Yahweh.
translation:
  language: de
  text: Dies ist Aarons Salbungsanteil[a] und der Salbungsanteil seiner Söhne von den Feueropfern Yahwehs[b], an dem Tag, als er sie heranführte, damit sie Yahweh als Priester dienten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Anteil“. Das hebräische Wort ist mit „salben“ verwandt und bezeichnet hier wahrscheinlich den priesterlichen Anteil, der mit der Salbung und Einsetzung verbunden ist.
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Ausdruck wird auch als „Speisegaben Yahwehs“ verstanden; traditionell: „Feueropfer Yahwehs“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁחַת
  choice: Salbungsanteil
  rationale: Das Wort ist mit „salben“ verwandt, bezeichnet hier im Zusammenhang der Priesterweihe aber wahrscheinlich den Aaron und seinen Söhnen zustehenden Anteil. „Salbungsanteil“ bewahrt sowohl den kultischen Zuteilungssinn als auch den sprachlichen Bezug zur Salbung.
- source_word: מִשְׁחַת אַהֲרֹן וּמִשְׁחַת בָּנָיו
  choice: Aarons Salbungsanteil und der Salbungsanteil seiner Söhne
  rationale: Die Wiederholung des hebräischen Nomens bleibt erhalten; „seiner Söhne“ bezieht sich auf Aaron.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: von den Feueropfern Yahwehs
  rationale: אִשֶּׁה bezeichnet kultische Opfergaben, die auf dem Altarfeuer dargebracht werden. „Feueropfer“ gibt den traditionellen und unmittelbar kontextuellen Sinn knapp wieder; die alternative Deutung als Speisegaben wird in einer Fußnote genannt.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּיוֹם
  choice: an dem Tag, als
  rationale: Die zeitliche Bestimmung und die hebräische Satzstruktur bleiben in natürlichem Deutsch erkennbar.
- source_word: הִקְרִיב אֹתָם
  choice: er sie herantreten ließ
  rationale: Der Hifil von קרב bedeutet „heranbringen/herantreten lassen“. Da Menschen das Objekt sind, vermeidet diese Wiedergabe die irreführende Aussage, sie seien als Opfer dargebracht worden. Das im Hebräischen nicht ausdrücklich genannte Subjekt bleibt durch „er“ offen.
- source_word: לְכַהֵן לַיהוָה
  choice: damit sie Yahweh als Priester dienten
  rationale: Die Zweckangabe bezeichnet den priesterlichen Dienst für Yahweh und wird in verständlichem, würdigem Deutsch wiedergegeben.
theological_decisions:
- issue: Bedeutung von מִשְׁחַת in der priesterlichen Opferordnung
  choice: Salbungsanteil als ein mit der Priesterweihe verbundener Anteil
  alternative: Anteil; Salbung
  rationale: Der Zusammenhang handelt von den den Priestern zustehenden Opferanteilen, während die Wortbildung zugleich auf die Salbung verweist. „Salbungsanteil“ erhält beide Aspekte, ohne den Ausdruck ausschließlich auf Salböl oder Salbungsritus festzulegen.
- issue: Ungenanntes Subjekt von הִקְרִיב
  choice: Das Pronomen „er“ ohne ergänzende Identifizierung beibehalten
  alternative: Mose ausdrücklich als Subjekt einsetzen; Yahweh ausdrücklich als Subjekt einsetzen
  rationale: Die Verbform nennt das handelnde Subjekt nicht ausdrücklich. Eine namentliche Ergänzung würde die im Text vorhandene Offenheit beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Formulierung des Hebräischen wird bewahrt. „Herantreten ließ“ entspricht dem kultischen Sprachgebrauch, bleibt aber für heutige Leser verständlich; das ungenannte Subjekt wird nicht interpretierend ergänzt.
