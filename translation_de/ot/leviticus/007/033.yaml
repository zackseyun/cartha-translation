id: LEV.7.33
reference: Leviticus 7:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הַ/מַּקְרִ֞יב אֶת דַּ֧ם הַ/שְּׁלָמִ֛ים וְ/אֶת הַ/חֵ֖לֶב מִ/בְּנֵ֣י אַהֲרֹ֑ן ל֧/וֹ תִהְיֶ֛ה שׁ֥וֹק הַ/יָּמִ֖ין לְ/מָנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/033.yaml
  text: The one from among the sons of Aaron who presents the blood of the peace offerings and the fat—to him the right thigh shall belong as his portion.
translation:
  language: de
  text: Derjenige unter den Söhnen Aarons, der das Blut der Friedensopfer[a] und das Fett darbringt, soll die rechte Keule als seinen Anteil erhalten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Gemeinschaftsopfer«.'
    reason: Lexikalische Alternative für הַשְּׁלָמִים.
lexical_decisions:
- source_word: הַמַּקְרִיב
  choice: derjenige … der … darbringt
  rationale: Das Hifil-Partizip von קרב bezeichnet im Opferkontext das Heranbringen bzw. Darbringen; die partizipiale Aussage wird durch einen Relativsatz natürlich wiedergegeben.
- source_word: דַּם
  choice: Blut
  rationale: Die direkte und im kultischen Zusammenhang übliche Wiedergabe.
- source_word: הַשְּׁלָמִים
  choice: Friedensopfer
  rationale: Die traditionelle kultische Bezeichnung bewahrt die mögliche Wortbeziehung zu Frieden und Wohlergehen, ohne den Opferzweck enger als der hebräische Ausdruck festzulegen.
- source_word: הַחֵלֶב
  choice: Fett
  rationale: Im Zusammenhang sind die zum Opfer bestimmten Fettstücke gemeint; „Fett“ gibt den kultischen Fachgebrauch knapp wieder.
- source_word: מִבְּנֵי אַהֲרֹן
  choice: unter den Söhnen Aarons
  rationale: Die Formulierung bezeichnet eine Person aus der Gruppe der männlichen priesterlichen Nachkommen Aarons und bleibt im Deutschen natürlich.
- source_word: לוֹ תִהְיֶה
  choice: soll … erhalten
  rationale: Die Konstruktion drückt in dieser Rechtsbestimmung einen verbindlich zugewiesenen Besitzanteil aus.
- source_word: שׁוֹק הַיָּמִין
  choice: die rechte Keule
  rationale: שׁוֹק bezeichnet hier den als Opferanteil abgetrennten oberen Abschnitt des rechten Beins; „Keule“ ist im deutschen Schlacht- und Opferkontext treffender als das allgemeinere „Bein“.
- source_word: לְמָנָה
  choice: als seinen Anteil
  rationale: מָנָה bezeichnet einen zugeteilten Anteil; das Possessivpronomen macht den deutschen Satz idiomatisch, ohne den Sinn zu erweitern.
theological_decisions:
- issue: Wiedergabe von בְּנֵי אַהֲרֹן im priesterlichen Gesetz
  choice: Söhne Aarons
  alternative: Nachkommen Aarons / Familie Aarons
  rationale: Der hebräische Ausdruck ist ausdrücklich maskulin und bezeichnet hier die männlichen Priester aus Aarons Linie; eine geschlechtsneutrale Verallgemeinerung würde die konkrete kultische Regelung verwischen.
- issue: Deutung von שְׁלָמִים
  choice: Friedensopfer
  alternative: Gemeinschaftsopfer / Heilsopfer
  rationale: Die genaue Akzentuierung der Opferbezeichnung ist umstritten. „Friedensopfer“ erhält die lexikalische Verbindung zu Frieden bzw. Wohlergehen; die verbreitete Alternative „Gemeinschaftsopfer“ wird in der Fußnote genannt, statt die Mehrdeutigkeit im Haupttext aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer rechtlich-kultischer Aussage. „Derjenige … der“ bewahrt die individualisierende Partizipialstruktur; „soll … erhalten“ klingt natürlicher als eine stark hebraisierende Besitzkonstruktion.
