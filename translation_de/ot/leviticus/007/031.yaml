source:
  edition: WLC
  text: וְ/הִקְטִ֧יר הַ/כֹּהֵ֛ן אֶת הַ/חֵ֖לֶב הַ/מִּזְבֵּ֑חָ/ה וְ/הָיָה֙ הֶֽ/חָזֶ֔ה לְ/אַהֲרֹ֖ן וּ/לְ/בָנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/031.yaml
  text: The priest shall burn the fat on the altar[a], and the breast shall belong to Aaron and to his sons.
translation:
  language: de
  text: Der Priester soll das Fett auf dem Altar in Rauch aufgehen lassen, und das Bruststück soll Aaron und seinen Söhnen gehören.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: soll … in Rauch aufgehen lassen
  rationale: Der Hifil von קטר bezeichnet im Opferkontext das Verbrennen auf dem Altar, wobei der Rauch aufsteigt. Die Wendung gibt diesen kultischen Sinn präziser wieder als das allgemeinere »verbrennen«.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Übliche und kontextgerechte Wiedergabe von כֹּהֵן; der Singular des Hebräischen bleibt erhalten.
- source_word: הַחֵלֶב
  choice: das Fett
  rationale: חֵלֶב bezeichnet hier die für den Altar bestimmten Fettteile des Opfertiers.
- source_word: הַמִּזְבֵּחָה
  choice: auf dem Altar
  rationale: Das Richtungs-he kann formal eine Bewegung zum Altar ausdrücken; zusammen mit dem Opferverb bezeichnet die Wendung natürlich den Ort, an dem das Fett in Rauch aufgeht.
- source_word: וְהָיָה
  choice: soll … gehören
  rationale: Das wörtliche »soll sein« drückt hier im rechtlichen Zusammenhang die Zuweisung eines Opferanteils aus; »gehören« macht diesen Sinn in natürlichem Deutsch deutlich.
- source_word: הֶחָזֶה
  choice: das Bruststück
  rationale: חָזֶה meint in den Opferbestimmungen den als Anteil ausgesonderten Brustteil des Tieres. »Bruststück« ist im Deutschen eindeutig und sachgerecht.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: Aaron und seinen Söhnen
  rationale: Die mit לְ markierte Zuweisung wird zusammen mit »gehören« idiomatisch durch den Dativ ausgedrückt.
theological_decisions: []
