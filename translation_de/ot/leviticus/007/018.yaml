    rationale: „wird es nicht angenommen“ gibt die kultische Nichtannahme natürlich wieder, ohne Gott als Handelnden ausdrücklich einzusetzen.
  - severity: medium
    issue: „verdorbenes Opfer“ kann פִּגּוּל semantisch verengen.
    rationale: Der Ausdruck bezeichnet den durch den Regelverstoß kultisch verwerflich gewordenen Opferzustand; physischer Verderb ist nicht die gesamte Bedeutung.
  - severity: low
    issue: „muss seine Schuld tragen“ verschiebt die Zukunftsaussage in Richtung einer normativen Modalität.
    rationale: „wird seine Schuld tragen“ bildet תִּשָּׂא unmittelbarer nach und bewahrt die rechtliche Folgewirkung.
