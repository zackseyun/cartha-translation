  text: וְ/אִ֣ם הֵאָכֹ֣ל יֵ֠אָכֵל מִ/בְּשַׂר זֶ֨בַח שְׁלָמָ֜י/ו בַּ/יּ֣וֹם הַ/שְּׁלִישִׁי֮ לֹ֣א יֵרָצֶה֒ הַ/מַּקְרִ֣יב אֹת֗/וֹ לֹ֧א יֵחָשֵׁ֛ב ל֖/וֹ פִּגּ֣וּל יִהְיֶ֑ה וְ/הַ/נֶּ֛פֶשׁ הָ/אֹכֶ֥לֶת מִמֶּ֖/נּוּ עֲוֺנָ֥/הּ תִּשָּֽׂא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/018.yaml
  text: But if any of the flesh of his peace offering is eaten on the third day[a], it will not be accepted; it will not be credited to the one who offers it. It will be an abhorrent thing[b], and the person who eats from it will bear his guilt.
translation:
  language: de
  text: 'Wenn aber am dritten Tag etwas vom Fleisch seines Friedensopfers gegessen wird, wird es nicht angenommen. Es wird dem, der es darbringt, nicht angerechnet; es gilt als etwas Abscheuliches[a]. Wer davon isst, wird seine Schuld tragen.


    [a] Das hebräische Wort פִּגּוּל (piggul) ist ein Fachbegriff des Opferrechts für etwas, das durch einen Verstoß gegen die Opferordnung kultisch unannehmbar und abscheulich geworden ist; möglich sind auch „verdorbenes Fleisch“ oder „ein verwerfliches Opfer“.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort פִּגּוּל (piggul) ist ein Fachbegriff des Opferrechts für etwas, das durch einen Verstoß gegen die Opferordnung kultisch unannehmbar und abscheulich geworden ist; möglich sind auch „verdorbenes Fleisch“ oder „ein verwerfliches Opfer“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Wenn aber
  rationale: Gibt sowohl die Bedingung als auch den kontrastierenden Anschluss an die vorherige Vorschrift natürlich wieder.
- source_word: הֵאָכֹל יֵאָכֵל
  choice: noch etwas ... gegessen wird
  rationale: Die Konstruktion aus Infinitivus absolutus und Imperfekt verstärkt den Vorgang; im Deutschen wird dies idiomatisch durch die bestimmte Bedingung und „noch etwas“ ausgedrückt.
- source_word: מִבְּשַׂר זֶבַח שְׁלָמָיו
  choice: vom Fleisch seines Friedensopfers
  rationale: „Vom Fleisch“ bewahrt die partitive Bedeutung; „Friedensopfer“ ist die geläufige und semantisch naheliegende Bezeichnung für diese Opferart.
- source_word: לֹא יֵרָצֶה
  choice: findet es keine Annahme
  rationale: Gibt die kultische Nichtannahme wieder, ohne ausdrücklich ein Subjekt wie Gott hinzuzufügen.
- source_word: לֹא יֵחָשֵׁב לוֹ
  choice: Es wird ... nicht angerechnet
  rationale: Bewahrt die Rechnungs- beziehungsweise Zurechnungssprache von חשב mit ל.
- source_word: פִּגּוּל
  choice: verdorbenes Opfer
  rationale: Der seltene Fachbegriff bezeichnet im Opferrecht etwas kultisch unannehmbar und abscheulich Gewordenes. Die verständliche Haupttextlösung wird durch eine Fußnote abgesichert.
- source_word: וְהַנֶּפֶשׁ הָאֹכֶלֶת מִמֶּנּוּ
  choice: Wer davon isst
  rationale: נפש bezeichnet hier idiomatisch die betreffende Person; die deutsche Relativform ist natürlich und geschlechtsübergreifend.
- source_word: עֲוֺנָהּ תִּשָּׂא
  choice: muss seine Schuld tragen
  rationale: Bewahrt die hebräische Wendung vom Tragen der Schuld und lässt offen, in welchem Maß auch die daraus folgende Strafe mitgemeint ist.
theological_decisions:
- issue: Bezeichnung von זֶבַח שְׁלָמִים
  choice: Friedensopfer
  alternative: Gemeinschaftsopfer; Heilsopfer
  rationale: „Friedensopfer“ wahrt den Bezug zum Bedeutungsfeld von Ganzsein, Wohlergehen und Frieden und bleibt als Bezeichnung der Opfergattung erkennbar. Andere Benennungen betonen mögliche Teilaspekte.
- issue: Bedeutung von עון tragen
  choice: seine Schuld tragen
  alternative: die Strafe für seine Schuld tragen
  rationale: Die knappere Fassung erhält die Mehrdeutigkeit der hebräischen Wendung zwischen Schuldhaftung und ihren Strafkonsequenzen, statt sie einseitig auf Strafe festzulegen.
- issue: Urheber der Annahme
  choice: findet es keine Annahme
  alternative: es wird von Gott nicht angenommen
  rationale: Der kultische Kontext legt Gottes Annahme nahe, doch Gott wird im Vers nicht ausdrücklich genannt. Die Übersetzung vermeidet eine unnötige Explizierung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzglieder folgen dem hebräischen Gedankengang, werden aber zur besseren Verständlichkeit in mehrere Sätze gegliedert. Der Fußnotenmarker [a] steht unmittelbar beim erklärten Fachausdruck.
