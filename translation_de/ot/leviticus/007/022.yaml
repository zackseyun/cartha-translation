base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/022.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: de
  text: 'Und Jahwe sprach zu Mose:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: sprach
  rationale: Das Wayyiqtol von דבר eröffnet hier einen neuen göttlichen Redeabschnitt; „sprach“ ist im Deutschen die natürliche, würdige Wiedergabe.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name „Jahwe“ wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: אֶל־מֹשֶׁה
  choice: zu Mose
  rationale: Die Präposition אֶל bezeichnet den Adressaten der Rede; „zu Mose“ entspricht natürlichem modernem Deutsch.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Die hebräische Redeeinleitungsformel wird im Deutschen idiomatisch durch einen Doppelpunkt ausgedrückt, da die folgende Rede im nächsten Vers beginnt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. „Jahwe“ bewahrt den Charakter als Eigenname; die traditionelle Ersatzlesung wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die formelhafte hebräische Konstruktion לֵאמֹר wird nicht hölzern als „indem er sagte“ wiedergegeben, sondern durch den im Deutschen üblichen Doppelpunkt.
