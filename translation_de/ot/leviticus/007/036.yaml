  source_fidelity: Die Ergänzung „aus den Gaben“ ist im hebräischen Wortlaut nicht ausgedrückt. Zwar wird der Bezug auf priesterliche Anteile vom Kontext getragen, doch die Übersetzung sollte die Herkunftsangabe מֵאֵת בְּנֵי יִשְׂרָאֵל ohne diese zusätzliche Konkretisierung wiedergeben. Die finite Wiedergabe „als er sie salbte“ macht zudem das im Hebräischen durch das Suffix angezeigte Subjekt Jahwe deutlich.
  naturalness: Die überarbeitete Wortstellung ist modernes, verständliches Standarddeutsch und bewahrt zugleich den Anschluss als Relativsatz an den vorherigen Vers. „Ewige Satzung“ ist in diesem rechtlich-kultischen Register angemessen.
  terminology: „Jahwe“ gibt den Gottesnamen konsistent wieder. „Israeliten“ ist eine natürliche Wiedergabe von בני ישראל; die Fußnote dokumentiert die wörtlichere Formulierung. „Ewige Satzung“ und „für ihre Generationen“ geben die Rechtsformel חקת עולם לדורתם angemessen wieder.
