    rationale: Die hebräische Präpositionalphrase bezeichnet die Israeliten als Herkunftsquelle. Eine kontextuelle Erklärung darf nicht in den übersetzten Text aufgenommen werden, wenn sie den Wortlaut enger festlegt als die Vorlage.
  - severity: low
    issue: Der Fußnotenanker steht am Satzende statt bei „Israeliten“.
    rationale: Die Fußnote erläutert ausschließlich בני ישראל bzw. „Israeliten“ und sollte unmittelbar an dieser Wiedergabe verankert werden.
  - severity: low
    issue: „ihrer Salbung“ lässt das im Hebräischen ausgedrückte handelnde Subjekt weniger deutlich erkennen.
    rationale: „als er sie salbte“ gibt den Bezug des Suffixes auf Jahwe explizit und ohne inhaltliche Erweiterung wieder.
