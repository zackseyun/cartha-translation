base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/036.yaml
  text: which Yahweh commanded to be given to them from the sons of Israel on the day he anointed them—an everlasting statute throughout their generations[a][b].
translation:
  language: de
  text: die Jahwe ihnen am Tag, als er sie salbte, von den Israeliten[a] zu geben geboten hatte – als ewige Satzung für ihre Generationen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »von den Söhnen Israels«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר צִוָּה יְהוָה לָתֵת לָהֶם
  choice: die Jahwe ihnen … zu geben geboten hatte
  rationale: Der Relativsatz bezieht sich auf die im vorigen Vers genannten Anteile. Die aktive Infinitivkonstruktion bewahrt die hebräische Form und ist im Deutschen natürlich; das Plusquamperfekt verdeutlicht den Rückbezug.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּיוֹם מָשְׁחוֹ אֹתָם
  choice: am Tag ihrer Salbung
  rationale: Die hebräische Konstruktion kann formal auch als »am Tag, als er sie salbte« wiedergegeben werden. Die substantivische Fassung ist idiomatisch und lässt den im Kontext eindeutigen Vollzug der Salbung knapp stehen.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: aus den Gaben der Israeliten
  rationale: מֵאֵת bezeichnet hier die Israeliten als Quelle der priesterlichen Anteile. »Aus den Gaben« ergänzt den aus dem Kontext erschließbaren Bezug und vermeidet im Deutschen den missverständlichen Eindruck, die Priester selbst würden »von den Israeliten« gegeben.
- source_word: חֻקַּת עוֹלָם
  choice: als ewige Satzung
  rationale: »Satzung« bewahrt den kultisch-rechtlichen Charakter; »ewig« gibt die dauerhafte Geltung von עוֹלָם wieder, ohne sie über den Text hinaus systematisch zu bestimmen.
- source_word: לְדֹרֹתָם
  choice: für alle ihre Generationen
  rationale: Die Formulierung bezeichnet die fortdauernde Geltung über die aufeinanderfolgenden Generationen Israels hinweg.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen; die Transliteration wahrt diese Unterscheidung gegenüber einem bloßen Titel.
- issue: Reichweite von חֻקַּת עוֹלָם
  choice: ewige Satzung
  alternative: dauerhafte Satzung
  rationale: Die traditionelle rechtliche Wendung bleibt erhalten. Der Zusatz »für alle ihre Generationen« beschreibt die im Vers selbst genannte geschichtliche Reichweite, ohne spätere theologische Fragen vorzuentscheiden.
- issue: Subjekt der Salbung
  choice: ihrer Salbung
  alternative: als er sie salbte
  rationale: Das Suffix מָשְׁחוֹ lässt Jahwe als Subjekt erkennen. Die gewählte deutsche Nominalform setzt denselben Vorgang voraus, ohne einen unnötig schweren Nebensatz zu bilden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rechtlich-kultischem Ton. Der Satz bleibt als Relativsatz an Vers 35 angeschlossen. Gedankenstrich und »als« markieren die Bestimmung als dauerhaft geltende Satzung.
