id: LEV.7.7
reference: Leviticus 7:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כַּֽ/חַטָּאת֙ כָּֽ/אָשָׁ֔ם תּוֹרָ֥ה אַחַ֖ת לָ/הֶ֑ם הַ/כֹּהֵ֛ן אֲשֶׁ֥ר יְכַפֶּר בּ֖/וֹ ל֥/וֹ יִהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/007.yaml
  text: 'Like the sin offering[a], so the guilt offering: there is one law for them[c][b]. The priest who makes atonement with it shall have it.'
translation:
  language: de
  text: 'Wie für das Sündopfer, so gilt auch für das Schuldopfer ein und dieselbe Weisung[a]: Der Priester, der damit Sühne erwirkt, soll es erhalten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch Tora; hier: maßgebliche Weisung oder Vorschrift.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּחַטָּאת כָּאָשָׁם
  choice: Wie für das Sündopfer, so gilt auch für das Schuldopfer
  rationale: Die beiden mit כְּ gebildeten Ausdrücke stehen in einer vergleichenden Entsprechung. Die deutsche Formulierung gibt diese Struktur natürlich wieder; חַטָּאת und אָשָׁם bezeichnen hier die jeweiligen Opferarten.
- source_word: תּוֹרָה אַחַת לָהֶם
  choice: für sie gilt ein und dieselbe Weisung
  rationale: תּוֹרָה bezeichnet hier die maßgebliche kultische Regelung bzw. Weisung. „Ein und dieselbe“ macht deutlich, dass für beide Opfer dieselbe Vorschrift gilt, ohne den Singular אַחַת abzuschwächen.
- source_word: הַכֹּהֵן אֲשֶׁר יְכַפֶּר בּוֹ
  choice: Der Priester, der damit Sühne erwirkt
  rationale: כפר wird in seinem priesterlich-kultischen Sinn wiedergegeben. בּוֹ bezeichnet am ehesten das Opfer als Mittel; „damit“ bewahrt diese instrumentale Beziehung, ohne ein im Hebräischen unausgesprochenes Objekt hinzuzufügen.
- source_word: לוֹ יִהְיֶה
  choice: soll es erhalten
  rationale: Die Wendung bezeichnet die Zuweisung des Opfers an den amtierenden Priester. „Soll es erhalten“ ist im Deutschen natürlich und wahrt den rechtlichen Anspruch.
theological_decisions:
- issue: Bedeutung von כפר in der Opfergesetzgebung
  choice: Sühne erwirken
  alternative: Sühne schaffen; entsühnen
  rationale: Die Übersetzung bewahrt das kultische und theologische Gewicht des Verbs, ohne eine bestimmte Sühnetheorie festzulegen. Zugleich bleibt der Priester handelnd und das Opfer als Mittel erkennbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vergleichende Satzstruktur und der rechtlich-kultische Charakter bleiben erhalten; Fachbegriffe werden nur dort verwendet, wo sie im Opferkontext erforderlich sind.
