base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/017.yaml
  text: But what remains of the meat of the sacrifice on the third day shall be burned in the fire[a].
translation:
  language: de
  text: Was vom Fleisch des Schlachtopfers übrig bleibt, muss am dritten Tag im Feuer verbrannt werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַנּוֹתָר
  choice: Was aber … übrig ist
  rationale: Das Waw führt die Vorschrift fort und kann im Zusammenhang leicht kontrastierend wiedergegeben werden. Die substantivierte Partizipialform wird im Deutschen natürlich als Relativkonstruktion ausgedrückt.
- source_word: מִבְּשַׂר
  choice: vom Fleisch
  rationale: בָּשָׂר bezeichnet hier das essbare Fleisch des Opfertiers. „Fleisch“ ist im Deutschen zugleich wörtlich und in diesem kultischen Zusammenhang idiomatisch.
- source_word: הַזָּבַח
  choice: des Schlachtopfers
  rationale: זֶבַח bezeichnet ein durch Schlachtung dargebrachtes Opfer. „Schlachtopfer“ hält diesen kultischen und konkreten Sinn präziser fest als das allgemeinere „Opfer“.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: am dritten Tag
  rationale: Dies ist die direkte und natürliche deutsche Wiedergabe der Zeitangabe; ein terminativer Sinn wie „bis zum dritten Tag“ wird nicht hinzugefügt.
- source_word: בָּאֵשׁ
  choice: im Feuer
  rationale: Die Präposition ב mit „Feuer“ bezeichnet hier das Mittel beziehungsweise den Vorgang der Beseitigung durch Verbrennen; „im Feuer“ folgt der hebräischen Ausdrucksweise.
- source_word: יִשָּׂרֵף
  choice: muss … verbrannt werden
  rationale: Das Nifal bewahrt die passive Form, während das Modalverb „muss“ die vorschreibende Funktion des Imperfekts in diesem Rechtstext in modernem Deutsch klar ausdrückt.
