id: LEV.7.2
reference: Leviticus 7:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בִּ/מְק֗וֹם אֲשֶׁ֤ר יִשְׁחֲטוּ֙ אֶת הָ֣/עֹלָ֔ה יִשְׁחֲט֖וּ אֶת הָ/אָשָׁ֑ם וְ/אֶת דָּמ֛/וֹ יִזְרֹ֥ק עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/002.yaml
  text: In the place where they slaughter the burnt offering[a], they shall slaughter the guilt offering, and he shall splash its blood against the altar all around.
translation:
  language: de
  text: An dem Ort, an dem man das Brandopfer schlachtet, soll man auch das Schuldopfer[a] schlachten. Sein Blut soll der Priester ringsum an den Altar sprengen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »Wiedergutmachungsopfer« oder »Entschädigungsopfer«. Das hebräische Wort bezeichnet sowohl Schuld als auch die damit verbundene Wiedergutmachung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּמְקוֹם אֲשֶׁר
  choice: An dem Ort, an dem
  rationale: Gibt die örtliche Bestimmung und den Relativsatz präzise und in natürlichem modernem Deutsch wieder.
- source_word: יִשְׁחֲטוּ
  choice: man … schlachtet / soll man … schlachten
  rationale: Das unbestimmte Pluralverb wird im Deutschen idiomatisch mit „man“ wiedergegeben; „schlachten“ bezeichnet im Opferkontext die rituelle Schlachtung.
- source_word: הָעֹלָה
  choice: das Brandopfer
  rationale: „Brandopfer“ ist die etablierte deutsche Bezeichnung für das vollständig verbrannte Opfer עֹלָה.
- source_word: הָאָשָׁם
  choice: das Schuldopfer
  rationale: „Schuldopfer“ ist die geläufige Bezeichnung der Opferart; eine Fußnote wahrt den zugleich vorhandenen Gedanken von Wiedergutmachung.
- source_word: דָּמוֹ
  choice: sein Blut
  rationale: Das Suffix bezieht sich sachlich auf das als Schuldopfer geschlachtete Tier; die deutsche Formulierung ist knapp und eindeutig genug.
- source_word: יִזְרֹק
  choice: soll … sprengen
  rationale: Im priesterlichen Ritual bezeichnet זָרַק das gezielte Anbringen beziehungsweise Schleudern von Blut; „an den Altar sprengen“ ist die sachgerechte kultische Wendung und ist von bloßem Besprengen zu unterscheiden.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: ringsum an den Altar
  rationale: „An den Altar“ erfasst die gegen dessen Fläche gerichtete Blutapplikation; „ringsum“ bewahrt den Umfangssinn von סָבִיב.
theological_decisions:
- issue: Bedeutungsumfang von אָשָׁם
  choice: Schuldopfer
  alternative: Wiedergutmachungsopfer oder Entschädigungsopfer
  rationale: Die herkömmliche Opferbezeichnung bleibt im Haupttext erhalten, während die Fußnote den mit Schuld verbundenen Wiedergutmachungsaspekt nennt, ohne den Begriff einseitig festzulegen.
- issue: Nicht ausdrücklich genanntes Subjekt von יִזְרֹק
  choice: der Priester
  alternative: er
  rationale: Der Singularwechsel gegenüber dem unbestimmten Plural der Schlachtung zeigt einen anderen Handelnden an; nach dem unmittelbaren gesetzlichen Kontext (Lev 7,1) ist dies der Priester. Die explizite Nennung verhindert im Deutschen einen irreführenden Bezug auf das Opfertier.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit geläufiger kultischer Terminologie. Die Wiederholung von „Ort“ und „schlachten“ erhält den gesetzlich-prozeduralen Charakter; die Satzteilung verbessert die Verständlichkeit.
