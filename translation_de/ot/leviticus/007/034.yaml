source:
  edition: WLC
  text: כִּי֩ אֶת חֲזֵ֨ה הַ/תְּנוּפָ֜ה וְ/אֵ֣ת שׁ֣וֹק הַ/תְּרוּמָ֗ה לָקַ֨חְתִּי֙ מֵ/אֵ֣ת בְּנֵֽי יִשְׂרָאֵ֔ל מִ/זִּבְחֵ֖י שַׁלְמֵי/הֶ֑ם וָ/אֶתֵּ֣ן אֹ֠תָ/ם לְ/אַהֲרֹ֨ן הַ/כֹּהֵ֤ן וּ/לְ/בָנָי/ו֙ לְ/חָק עוֹלָ֔ם מֵ/אֵ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/034.yaml
  text: For I have taken the breast of the wave offering and the thigh of the contribution from the sons of Israel[a], from their sacrifices of peace offerings[c][b], and I have given them to Aaron the priest and to his sons as a permanent statute from the sons of Israel.
translation:
  language: de
  text: Denn die Brust des Schwingopfers und die Keule der Abgabe habe ich von den Söhnen Israels[a], von ihren Heilsopfern[b], genommen und dem Priester Aaron und seinen Söhnen als eine ewige Ordnung vonseiten der Söhne Israels gegeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Israeliten“. Hebräisch wörtlich: „den Söhnen Israels“, eine feste Bezeichnung für das Volk Israel.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Friedensopfern“ beziehungsweise „Gemeinschaftsopfern“. Das hebräische Wort bezeichnet eine eigene Opferkategorie und hat Bezüge zu Frieden und Wohlergehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲזֵה הַתְּנוּפָה
  choice: die Brust des Schwingopfers
  rationale: חֲזֵה bezeichnet das Bruststück des Tieres; תְּנוּפָה benennt die rituelle Schwingung beziehungsweise die so dargebrachte Opfergabe. Die Wiedergabe hält Anatomie und Opferkategorie auseinander.
- source_word: שׁוֹק הַתְּרוּמָה
  choice: die Keule der Abgabe
  rationale: שׁוֹק bezeichnet hier den als Priesteranteil bestimmten Bein- beziehungsweise Keulenabschnitt. תְּרוּמָה ist eine ausgesonderte, Gott dargebrachte Abgabe; „Abgabe“ ist im Deutschen klarer als eine mechanische Wiedergabe mit „Hebopfer“.
- source_word: לָקַחְתִּי
  choice: habe ich ... genommen
  rationale: Das hebräische Perfekt bezeichnet in dieser begründenden Rechtsaussage die vollzogene göttliche Festsetzung mit fortdauernder Geltung.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die formale Bundesbezeichnung des Hebräischen bleibt sichtbar; eine idiomatischere Alternative wird in der Fußnote genannt.
- source_word: זִבְחֵי שַׁלְמֵיהֶם
  choice: ihre Heilsopfer
  rationale: Der Ausdruck bezeichnet Opfer der Kategorie שְׁלָמִים. „Heilsopfer“ bewahrt im Deutschen die kultische Kategorie und die Bedeutungsnähe zu Heil, Wohlergehen und Frieden, ohne sie allein auf Gemeinschaft zu verengen.
- source_word: לְחָק עוֹלָם
  choice: als eine ewige Ordnung
  rationale: Die Formulierung gibt eine dauerhaft geltende kultische Festsetzung wieder. „Ordnung“ klingt im modernen Deutsch natürlicher als „Satzung“, während „ewig“ die starke zeitliche Aussage von עוֹלָם wahrt.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: Sie sollen sie von den Söhnen Israels erhalten
  rationale: Das abschließende מֵאֵת bezeichnet die Herkunft beziehungsweise die von Israel zu erbringende Zuwendung. Die explizierende deutsche Form vermeidet den missverständlichen Anschluss „als ewige Ordnung von den Söhnen Israels“ und bewahrt zugleich die Wiederholung.
theological_decisions:
- issue: Bezeichnung Israels als בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  alternative: Israeliten; Volk Israel
  rationale: Die wörtliche Bundesbezeichnung wird beibehalten, ohne ihre idiomatische kollektive Funktion zu verschweigen.
- issue: Deutung der Opferkategorie שְׁלָמִים
  choice: Heilsopfer
  alternative: Friedensopfer; Gemeinschaftsopfer
  rationale: „Heilsopfer“ lässt die semantische Breite zwischen Frieden, Wohlergehen und Gemeinschaft offen und vermeidet, eine einzelne theologische Deutung festzuschreiben.
- issue: Reichweite von חָק עוֹלָם
  choice: ewige Ordnung
  alternative: dauerhafte Ordnung
  rationale: Die Übersetzung wahrt die starke Formulierung des Textes, ohne im Vers selbst systematisch-theologische Aussagen über ihre spätere heilsgeschichtliche Anwendung hinzuzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener kultischer Fachsprache. Der Schluss wurde syntaktisch expliziert, damit die Herkunft des dauerhaften Priesteranteils klar bleibt. Alle Fußnotenmarker stehen unmittelbar nach dem betreffenden Ausdruck.
