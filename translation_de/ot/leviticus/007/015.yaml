source:
  edition: WLC
  text: וּ/בְשַׂ֗ר זֶ֚בַח תּוֹדַ֣ת שְׁלָמָ֔י/ו בְּ/י֥וֹם קָרְבָּנ֖/וֹ יֵאָכֵ֑ל לֹֽא יַנִּ֥יחַ מִמֶּ֖/נּוּ עַד בֹּֽקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/015.yaml
  text: And the flesh of the sacrifice of his thanksgiving peace offering shall be eaten on the day of his offering[b][a]; he shall not leave any of it until morning.
translation:
  language: de
  text: Das Fleisch seines Friedensopfers als Dankopfer[a] soll an dem Tag gegessen werden, an dem er es darbringt. Er darf nichts davon bis zum Morgen übrig lassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seines Dank-Gemeinschaftsopfers“; auch möglich: „des Opfers seiner Friedensopfer zum Dank“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְשַׂר
  choice: Das Fleisch
  rationale: בשר bezeichnet Fleisch; „Fleisch“ ist im deutschen Opferkontext natürlich und bewahrt den sachlichen Kultton.
- source_word: זֶבַח תּוֹדַת שְׁלָמָיו
  choice: seines Dank-Friedensopfers
  rationale: Die dichte Constructusverbindung bezeichnet ein Friedensopfer der Unterart Dankopfer. Das zusammengesetzte Wort gibt diese Zuordnung knapp wieder, ohne die Beziehung stärker auszudeuten.
- source_word: בְּיוֹם קָרְבָּנוֹ
  choice: an dem Tag, an dem er es darbringt
  rationale: Die Wendung bedeutet wörtlich etwa „am Tag seines Darbringens“. Die verbale deutsche Form macht den Opfernden als Bezug des maskulinen Suffixes verständlich und klingt natürlich.
- source_word: יֵאָכֵל
  choice: soll ... gegessen werden
  rationale: Das passive Niphal bleibt als Passiv erhalten; „soll“ gibt die verbindliche kultische Anweisung in gegenwärtigem Deutsch wieder.
- source_word: לֹא יַנִּיחַ מִמֶּנּוּ
  choice: Er darf nichts davon ... übrig lassen
  rationale: Das Hiphil bedeutet hier „zurücklassen/übrig lassen“. „nichts davon“ gibt מִמֶּנּוּ in der Verneinung idiomatisch wieder.
- source_word: עַד בֹּקֶר
  choice: bis zum Morgen
  rationale: Direkte und natürliche Wiedergabe der zeitlichen Grenze.
theological_decisions:
- issue: Bezeichnung der Opferkategorie שְׁלָמִים
  choice: Friedensopfer
  alternative: Gemeinschaftsopfer
  rationale: „Friedensopfer“ bewahrt die traditionelle lexikalische Verbindung zu שָׁלוֹם und deutet den Zweck des Opfers weniger ausdrücklich als „Gemeinschaftsopfer“. Die mögliche funktionale Deutung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der kultische Fachbegriff „Friedensopfer“ wird beibehalten; die Satzstruktur ist gegenüber der hebräischen Nominalfügung behutsam geglättet.
