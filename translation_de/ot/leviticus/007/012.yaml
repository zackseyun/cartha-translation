source:
  edition: WLC
  text: אִ֣ם עַל תּוֹדָה֮ יַקְרִיבֶ/נּוּ֒ וְ/הִקְרִ֣יב עַל זֶ֣בַח הַ/תּוֹדָ֗ה חַלּ֤וֹת מַצּוֹת֙ בְּלוּלֹ֣ת בַּ/שֶּׁ֔מֶן וּ/רְקִיקֵ֥י מַצּ֖וֹת מְשֻׁחִ֣ים בַּ/שָּׁ֑מֶן וְ/סֹ֣לֶת מֻרְבֶּ֔כֶת חַלֹּ֖ת בְּלוּלֹ֥ת בַּ/שָּֽׁמֶן־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/012.yaml
  text: If he offers it as a thanksgiving offering[a], then with the sacrifice of thanksgiving he shall offer unleavened loaves mixed with oil, unleavened wafers anointed with oil[c][b], and cakes of fine flour well mixed with oil.
translation:
  language: de
  text: Wenn er es als Dankopfer[a] darbringt, soll er zusammen mit dem Dankopfer ungesäuerte, mit Öl vermengte Brote darbringen, dazu ungesäuerte, mit Öl bestrichene Fladen und Brote aus sorgfältig verarbeitetem Feinmehl[b], die mit Öl vermengt sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Opfer aus Dankbarkeit“. Das hebräische Wort bezeichnet hier ein Opfer, das als Ausdruck des Dankes dargebracht wird.'
    reason: lexical_alternative
  - marker: b
    text: Die genaue Zubereitungsweise, die mit dem hebräischen Ausdruck gemeint ist, ist unsicher. Möglich ist auch, dass das Feinmehl gebrüht oder zu einem besonders gründlich verarbeiteten Teig zubereitet wurde.
    reason: cultural_note
lexical_decisions:
- source_word: תּוֹדָה
  choice: Dankopfer
  rationale: Das Substantiv bezeichnet Dank beziehungsweise Danksagung und hier eine entsprechende Form des Gemeinschaftsopfers. „Dankopfer“ ist im Deutschen knapp, verständlich und sachlich.
- source_word: יַקְרִיבֶנּוּ
  choice: er es … darbringt
  rationale: Der Hifil von קרב bezeichnet im Opferkontext das Darbringen oder Präsentieren eines Opfers. „Darbringen“ bewahrt den kultischen Bezug in natürlichem, würdigem Deutsch.
- source_word: זֶבַח הַתּוֹדָה
  choice: das Dankopfer
  rationale: Die deutsche Zusammensetzung gibt die hebräische Genitivverbindung natürlich wieder und hält die Wiederholung von תּוֹדָה erkennbar.
- source_word: חַלּוֹת מַצּוֹת
  choice: ungesäuerte … Brote
  rationale: חַלּוֹת bezeichnet einzelne Brote oder brotartige Kuchen; מַצּוֹת kennzeichnet sie als ungesäuert. „Brote“ ist hier alltagssprachlich klar.
- source_word: בְּלוּלֹת בַּשֶּׁמֶן
  choice: mit Öl vermengte
  rationale: בלל bezeichnet das Vermischen von Zutaten. „Vermengt“ ist präzise, gegenwärtig und für eine Speisebereitung passend.
- source_word: רְקִיקֵי מַצּוֹת
  choice: ungesäuerte … Fladen
  rationale: רְקִיקִים sind dünne Backwaren. „Fladen“ vermittelt diese Form im Deutschen natürlicher als „Waffeln“ und bleibt gegenüber einer genaueren, nicht sicheren Gestalt zurückhaltend.
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: mit Öl bestrichene
  rationale: משׁח kann „salben“ oder „bestreichen“ bedeuten. Im unmittelbaren Zusammenhang der Speisezubereitung bezeichnet „bestreichen“ die Handlung klar, ohne unnötige rituelle Nebenbedeutungen einzutragen.
- source_word: סֹלֶת
  choice: Feinmehl
  rationale: סֹלֶת ist fein gemahlenes, hochwertiges Mehl und eine übliche Opferzutat. „Feinmehl“ ist die etablierte präzise deutsche Bezeichnung.
- source_word: מֻרְבֶּכֶת
  choice: gründlich … vermengt
  rationale: Die genaue Zubereitungsweise des seltenen Ausdrucks ist unsicher; er weist wahrscheinlich auf eine intensive Verarbeitung oder Vermischung hin. Die Übersetzung bleibt deshalb bewusst zurückhaltend und wird durch eine Fußnote erläutert.
- source_word: חַלֹּת
  choice: Brote
  rationale: Auch beim dritten Backwerk bezeichnet חַלֹּת einzelne brotartige Stücke. Die Wiederholung von „Brote“ bewahrt die lexikalische Verbindung zum ersten Vorkommen.
theological_decisions:
- issue: Einordnung von תּוֹדָה als Opferbezeichnung
  choice: Dankopfer
  alternative: Lobopfer
  rationale: Der Kontext beschreibt ein aus Dank dargebrachtes Gemeinschaftsopfer. „Dankopfer“ gibt diesen Sinn wieder, ohne Dank und Lob gleichzusetzen oder eine weitergehende kultische Deutung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kultische Sprache bleibt durch „darbringen“ und „Dankopfer“ erkennbar, während die Bezeichnungen der Backwaren allgemein verständlich gehalten sind. Die unsichere Küchenterminologie wird nicht überpräzisiert, sondern in einer Fußnote offengelegt.
