  verdict: approve
  source_fidelity: Der Entwurf gibt die hebräische Befehlsformel und das umfassende Verbot sachgerecht wieder. „Keinerlei Fett“ bildet כָּל חֵלֶב unter der Negation angemessen ab; „Rind, Schaf oder Ziege“ entspricht der generischen Tierliste שׁוֹר, כֶּשֶׂב und עֵז, ohne Geschlecht oder Alter unzulässig einzugrenzen. Die pluralische Anrede in „Ihr dürft … nicht essen“ gibt die an die Israeliten gerichtete Verbotsform zutreffend wieder.
  naturalness: „Rede zu den Israeliten und sage“ ist modernes, würdiges Standarddeutsch und behält den Charakter der levitischen Gesetzesformel. Die anschließende Formulierung ist klar und idiomatisch. „Von einem Rind, einem Schaf oder einer Ziege“ ist als generische Aufzählung gut verständlich.
  terminology: „Israeliten“ ist die natürliche deutsche Kollektivbezeichnung für בְּנֵי יִשְׂרָאֵל; die Fußnote dokumentiert die wörtliche hebräische Form zuverlässig. „Fett“ ist als unkommentierte Wiedergabe von חֵלֶב richtig und vermeidet eine im Verswortlaut nicht ausdrücklich markierte kultische Einengung. Die Rechtsform „dürft ... nicht“ ist normativ hinreichend stark.
