source:
  edition: WLC
  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר כָּל חֵ֜לֶב שׁ֥וֹר וְ/כֶ֛שֶׂב וָ/עֵ֖ז לֹ֥א תֹאכֵֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/023.yaml
  text: 'Speak to the sons of Israel[a], saying: You shall not eat any fat of an ox, a sheep, or a goat.'
translation:
  language: de
  text: 'Rede zu den Israeliten[a] und sage: Ihr dürft keinerlei Fett von einem Rind, einem Schaf oder einer Ziege essen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zu den Söhnen Israels“; gemeint sind die Israeliten als Gemeinschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Rede
  rationale: Der Piel-Imperativ richtet einen unmittelbaren Auftrag an Mose. „Rede“ bewahrt die geläufige Gesetzesformel des Levitikus.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Wörtlich „die Söhne Israels“, hier jedoch als Bezeichnung des gesamten Bundesvolkes. „Die Israeliten“ ist im heutigen Deutsch natürlich und schließt die Gemeinschaft insgesamt ein; die wörtliche Form wird in der Fußnote dokumentiert.
- source_word: לֵאמֹר
  choice: und sage
  rationale: Der Rede einleitende Infinitiv wird im Deutschen idiomatisch an den vorausgehenden Imperativ angeschlossen.
- source_word: כָּל חֵלֶב
  choice: keinerlei Fett
  rationale: Im Geltungsbereich der Verneinung drückt „keinerlei“ den umfassenden Sinn von כָּל prägnant aus. חֵלֶב bezeichnet hier besonders die in den Opferbestimmungen behandelten Fettteile; „Fett“ bleibt verständlich und hinreichend offen.
- source_word: שׁוֹר
  choice: Rind
  rationale: שׁוֹר bezeichnet hier ein Tier der Rindergattung, ohne dass das Geschlecht eigens festgelegt werden muss. „Rind“ eignet sich als allgemeine deutsche Kategorie besser als das enger wirkende „Ochse“.
- source_word: כֶשֶׂב
  choice: Schaf
  rationale: Das Wort bezeichnet allgemein ein Tier aus der Schafherde. „Schaf“ vermeidet die unnötige Festlegung auf Lamm oder Widder.
- source_word: עֵז
  choice: Ziege
  rationale: עֵז ist die übliche Bezeichnung für eine Ziege und bildet hier die dritte allgemeine Nutztierkategorie.
- source_word: לֹא תֹאכֵלוּ
  choice: Ihr dürft … nicht essen
  rationale: Die negierte Imperfektform formuliert ein verbindliches Verbot an die Gemeinschaft. „Ihr dürft … nicht essen“ klingt in modernem Standarddeutsch natürlich und wahrt die normative Kraft.
theological_decisions:
- issue: Umfang des Verbots von חֵלֶב
  choice: „Fett“ ohne einschränkende Auslegung im Haupttext
  alternative: „Fettstücke“ oder „Opferfett“
  rationale: Der unmittelbare Kontext betrifft die besonderen Fettteile der Opfertiere, doch der Vers selbst verwendet schlicht חֵלֶב. Eine engere kultische Deutung wird daher nicht in den Wortlaut hineingetragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Rechtsformel wird erkennbar bewahrt, zugleich werden unnatürliche Hebraismen vermieden. Die Anrede im Plural macht deutlich, dass das Verbot der gesamten Gemeinschaft gilt.
