base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/010.yaml
  text: And every grain offering mixed with oil[a], or dry, shall belong to all the sons of Aaron, each alike with his brother.
translation:
  language: de
  text: Jedes Speisopfer, ob es mit Öl vermengt oder trocken ist, soll allen Söhnen Aarons gehören, jedem im gleichen Maß wie seinem Bruder.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „einer wie sein Bruder“. Die hebräische Wendung besagt, dass die Söhne Aarons gleiche Anteile erhalten.'
    reason: Erläuterung eines hebräischen distributiven Idioms; die wörtliche Angabe wurde präzisiert.
lexical_decisions:
- source_word: מִנְחָה
  choice: Speisopfer
  rationale: Im Opferrecht des Levitikus bezeichnet מִנְחָה ein aus pflanzlichen Erzeugnissen, besonders Getreide, bereitetes Opfer. „Speisopfer“ ist der geläufige deutsche Fachausdruck und vermeidet die zu allgemeine Wiedergabe „Gabe“.
- source_word: בְלוּלָה בַשֶּׁמֶן
  choice: mit Öl vermengt
  rationale: Das passive Partizip beschreibt die Zubereitung des Opfers. „Mit Öl vermengt“ ist präzise, würdig und im modernen Standarddeutsch verständlich.
- source_word: חֲרֵבָה
  choice: trocken
  rationale: Das Adjektiv steht im Gegensatz zu „mit Öl vermengt“. „Trocken“ bewahrt diesen knappen lexikalischen Gegensatz, ohne die Deutung „ohne Öl“ in den Haupttext einzutragen.
- source_word: לְכָל בְּנֵי אַהֲרֹן תִּהְיֶה
  choice: soll allen Söhnen Aarons gehören
  rationale: Die Verbindung von לְ mit היה drückt hier Zugehörigkeit beziehungsweise Zuteilung aus. „Soll … gehören“ gibt den rechtlichen Sinn idiomatisch wieder.
- source_word: בְּנֵי אַהֲרֹן
  choice: Söhne Aarons
  rationale: Die ausdrücklich männliche Verwandtschaftsbezeichnung wird im priesterrechtlichen Zusammenhang beibehalten und nicht zu „Nachkommen“ verallgemeinert.
- source_word: אִישׁ כְּאָחִיו
  choice: jedem ebenso wie seinem Bruder
  rationale: Die distributive hebräische Wendung bezeichnet die gleiche Berechtigung beziehungsweise Zuteilung für jeden einzelnen Sohn Aarons. Die Formulierung bewahrt zugleich den Vergleich mit dem Bruder.
theological_decisions:
- issue: Geschlechtsspezifische Bezeichnung der Priesterschaft
  choice: Söhne Aarons … seinem Bruder
  alternative: Nachkommen Aarons … jedem gleichermaßen
  rationale: Der hebräische Text verwendet ausdrücklich männliche Verwandtschaftsbegriffe in einem priesterrechtlichen Kontext. Die Übersetzung bewahrt diese sprachliche und rechtliche Bestimmtheit.
- issue: Gleiche Zuteilung unter Aarons Söhnen
  choice: jedem ebenso wie seinem Bruder
  alternative: jeder soll den gleichen Anteil erhalten
  rationale: Die gewählte Fassung lässt die hebräische Vergleichsform erkennen, macht aber ihre distributive Bedeutung verständlich, ohne einen über den Text hinausgehenden Verteilungsmodus festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit etablierter kultischer Terminologie. Der knappe Rechtssatzcharakter bleibt erhalten; die männlichen Verwandtschaftsbezeichnungen und der Gegensatz zwischen ölvermengtem und trockenem Speisopfer werden nicht eingeebnet.
