id: LEV.7.9
reference: Leviticus 7:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/כָל מִנְחָ֗ה אֲשֶׁ֤ר תֵּֽאָפֶה֙ בַּ/תַּנּ֔וּר וְ/כָל נַעֲשָׂ֥ה בַ/מַּרְחֶ֖שֶׁת וְ/עַֽל מַחֲבַ֑ת לַ/כֹּהֵ֛ן הַ/מַּקְרִ֥יב אֹתָ֖/הּ ל֥/וֹ תִֽהְיֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/009.yaml
  text: And every grain offering that is baked in the oven[a], and everything prepared in a pan or on a griddle, shall belong to the priest who presents it.
translation:
  language: de
  text: Jedes Getreideopfer, das im Ofen gebacken wird, und alles, was in einer tiefen Pfanne oder auf einer Backplatte[a] zubereitet wird, soll dem Priester gehören, der es darbringt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die beiden hebräischen Begriffe bezeichnen wahrscheinlich unterschiedliche Kochgeräte, möglicherweise eine tiefe und eine flache Pfanne.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָה
  choice: Getreideopfer
  rationale: Im levitischen Opferkontext bezeichnet das Wort ein aus Getreide bereitetes Opfer. „Getreideopfer“ ist für heutige Leser verständlich und spezifischer als das allgemeinere „Speiseopfer“.
- source_word: תֵּאָפֶה בַּתַּנּוּר
  choice: im Ofen gebacken wird
  rationale: Die passive Form von אפה wird im Deutschen natürlich als „gebacken wird“ wiedergegeben; der bestimmte Artikel beim hebräischen Gefäß kann generisch verstanden werden.
- source_word: נַעֲשָׂה
  choice: zubereitet wird
  rationale: עשה bedeutet allgemein „machen“, bezeichnet hier aber im Zusammenhang mit Speisen deren Zubereitung, ohne die genaue Methode festzulegen.
- source_word: מַרְחֶשֶׁת
  choice: tiefe Pfanne
  rationale: Das Wort bezeichnet wahrscheinlich ein tieferes Kochgefäß. Die Wiedergabe unterscheidet es vom folgenden, vermutlich flacheren Gerät, ohne die Unsicherheit zu verschweigen.
- source_word: מַחֲבַת
  choice: Backplatte
  rationale: Das Gefäß wird gewöhnlich als flache Pfanne oder Backfläche verstanden. „Backplatte“ bildet einen verständlichen Kontrast zur tiefen Pfanne.
- source_word: הַמַּקְרִיב
  choice: der es darbringt
  rationale: Im Opferkontext bezeichnet die Hifil-Form von קרב das rituelle Darbringen beziehungsweise Präsentieren einer Opfergabe.
- source_word: לַכֹּהֵן ... לוֹ תִהְיֶה
  choice: soll dem Priester gehören
  rationale: Die Konstruktion drückt rechtliche Zuweisung und Besitz aus. „Soll ... gehören“ bewahrt den normativen Charakter des Gesetzestextes in natürlichem Deutsch.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Rechtssprache. Die Wiederholung „und alles“ folgt der hebräischen Gliederung; die unsichere genaue Gestalt der beiden Kochgeräte wird in der Fußnote kenntlich gemacht.
