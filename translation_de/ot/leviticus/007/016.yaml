source:
  edition: WLC
  text: וְ/אִם נֶ֣דֶר א֣וֹ נְדָבָ֗ה זֶ֚בַח קָרְבָּנ֔/וֹ בְּ/י֛וֹם הַקְרִיב֥/וֹ אֶת זִבְח֖/וֹ יֵאָכֵ֑ל וּ/מִֽ/מָּחֳרָ֔ת וְ/הַ/נּוֹתָ֥ר מִמֶּ֖/נּוּ יֵאָכֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/016.yaml
  text: But if the sacrifice of his offering is a vow or a freewill offering[a], it shall be eaten on the day he presents his sacrifice, and on the next day what remains of it may be eaten.
translation:
  language: de
  text: Wenn sein Schlachtopfer jedoch ein Gelübdeopfer oder ein freiwilliges Opfer ist, soll es an dem Tag gegessen werden, an dem er sein Schlachtopfer darbringt. Auch am nächsten Tag darf gegessen werden, was davon übrig ist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֶדֶר
  choice: Gelübdeopfer
  rationale: Im Opferkontext bezeichnet נֶדֶר ein Opfer, das mit einem Gelübde verbunden ist oder zu dessen Erfüllung dargebracht wird. „Gelübdeopfer“ macht die kultische Kategorie im Deutschen klar.
- source_word: נְדָבָה
  choice: freiwillige Gabe
  rationale: נְדָבָה bezeichnet eine aus freiem Entschluss dargebrachte Gabe. Die Formulierung wahrt den Gegensatz zum Gelübdeopfer, ohne eine zusätzliche Verpflichtung anzudeuten.
- source_word: זֶבַח קָרְבָּנוֹ
  choice: sein Schlachtopfer
  rationale: זֶבַח bezeichnet ein Schlachtopfer; קָרְבָּנוֹ bestimmt es als die von ihm dargebrachte Opfergabe. Im Deutschen wäre eine vollständige Doppelung wie „das Schlachtopfer seiner Opfergabe“ schwerfällig; „sein Schlachtopfer“ gibt die konkrete Referenz natürlich wieder.
- source_word: בְּיוֹם הַקְרִיבוֹ
  choice: an dem Tag, an dem er … darbringt
  rationale: Der Hifil von קרב bedeutet hier, eine Opfergabe herzuzubringen beziehungsweise darzubringen. „darbringen“ ist im heutigen Deutschen verständlich und dem kultischen Zusammenhang angemessen.
- source_word: יֵאָכֵל
  choice: soll … gegessen werden / darf gegessen werden
  rationale: Die beiden identischen Nifalformen stehen in einer kultischen Rechtsanweisung. Beim ersten Vorkommen wird die vorgeschriebene Verzehrzeit mit „soll“ ausgedrückt; beim zweiten hebt „darf“ die Erlaubnis hervor, Reste noch am Folgetag zu essen.
- source_word: וּמִמָּחֳרָת
  choice: Auch am nächsten Tag
  rationale: מָחֳרָת bezeichnet den folgenden Tag. Das מן kann hier den zeitlichen Fortgang beziehungsweise die Ausdehnung auf den Folgetag markieren; „Auch am nächsten Tag“ gibt den Zusammenhang idiomatisch wieder.
- source_word: וְהַנּוֹתָר מִמֶּנּוּ
  choice: was davon übrig ist
  rationale: Das substantivierte Partizip נוֹתָר bezeichnet das Übriggebliebene. Die Relativformulierung ist natürliches modernes Deutsch.
theological_decisions:
- issue: Verhältnis von Gelübdeopfer und freiwilliger Gabe
  choice: Als zwei unterschiedliche Beweggründe beziehungsweise Opferkategorien wiedergegeben
  alternative: Beide unter einem allgemeinen Begriff wie „freiwilliges Opfer“ zusammenfassen
  rationale: Das Hebräische verbindet נֶדֶר und נְדָבָה mit אוֹ und unterscheidet damit ausdrücklich ein gelübdebezogenes Opfer von einer ohne Gelübde freiwillig dargebrachten Gabe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlicher kultischer Terminologie. „Schlachtopfer“ bewahrt die konkrete Bedeutung von זֶבַח; die leichte Variation „soll“/„darf“ bildet den verpflichtenden beziehungsweise erlaubenden Sinn der Rechtsanweisung ab.
