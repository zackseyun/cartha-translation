review_pass:
  verdict: revise
  source_fidelity: 'Die Grundstruktur und die zeitliche Anweisung entsprechen dem Hebräischen: Bei einem gelübdebezogenen oder freiwilligen Schlachtopfer ist Verzehr am Darbringungstag und für den Rest auch am Folgetag vorgesehen. Die Wiedergabe von נֶדֶר als „Gelübdeopfer“ ist im Kontext zutreffend. „freiwillige Gabe“ ist jedoch zu allgemein und bezeichnet nicht ausdrücklich die parallele Opferkategorie נְדָבָה.'
  naturalness: 'Der Text ist überwiegend modernes, verständliches Standarddeutsch. „Gelübdeopfer oder eine freiwillige Gabe“ ist jedoch syntaktisch und sachlich unausgewogen: Ein Schlachtopfer wird einerseits als Opfer, andererseits als bloße Gabe klassifiziert. „freiwilliges Opfer“ ist parallel, natürlich und im kultischen Kontext präziser.'
  terminology: „Schlachtopfer“ gibt זֶבַח angemessen wieder; „darbringen“, „Gelübdeopfer“ und „am nächsten Tag“ passen zum Register. Für נְדָבָה sollte „freiwilliges Opfer“ statt „freiwillige Gabe“ stehen, damit die Opferterminologie und der Gegensatz zu „Gelübdeopfer“ gewahrt bleiben.
  issues:
  - severity: medium
    issue: „freiwillige Gabe“ gibt נְדָבָה in dieser Konstruktion zu unspezifisch wieder.
    rationale: נְדָבָה bezeichnet hier, parallel zu נֶדֶר, eine Art bzw. einen Anlass des Opfers. „Gabe“ kann im Deutschen auch eine unblutige Gabe meinen und ist dem prädikativen „Gelübdeopfer“ nicht parallel. „freiwilliges Opfer“ bewahrt die kultische und syntaktische Parallelität.
  revised_text: Wenn sein Schlachtopfer jedoch ein Gelübdeopfer oder ein freiwilliges Opfer ist, soll es an dem Tag gegessen werden, an dem er sein Schlachtopfer darbringt. Auch am nächsten Tag darf gegessen werden, was davon übrig ist.
