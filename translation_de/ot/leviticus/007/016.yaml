revisions:
- from: Wenn sein Schlachtopfer jedoch ein Gelübdeopfer oder eine freiwillige Gabe[a] ist, soll es an dem Tag gegessen werden, an dem er sein Schlachtopfer darbringt. Auch am nächsten Tag darf gegessen werden, was davon übrig ist.
  to: Wenn sein Schlachtopfer jedoch ein Gelübdeopfer oder ein freiwilliges Opfer ist, soll es an dem Tag gegessen werden, an dem er sein Schlachtopfer darbringt. Auch am nächsten Tag darf gegessen werden, was davon übrig ist.
  rationale: Die Änderung beschränkt sich auf die präzisere, parallele Wiedergabe von נְדָבָה als „freiwilliges Opfer“ und die entsprechende Anpassung der Fußnote. Bedeutung, Rechtscharakter und zeitliche Abfolge des Ausgangstextes bleiben unverändert.
