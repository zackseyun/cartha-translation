source:
  edition: WLC
  text: וְ/הַ/נֶּ֜פֶשׁ אֲשֶׁר תֹּאכַ֣ל בָּשָׂ֗ר מִ/זֶּ֤בַח הַ/שְּׁלָמִים֙ אֲשֶׁ֣ר לַ/יהוָ֔ה וְ/טֻמְאָת֖/וֹ עָלָ֑י/ו וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵ/עַמֶּֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/020.yaml
  text: But the person who eats meat from the sacrifice of peace offerings that belongs to Yahweh while his uncleanness is on him—that person shall be cut off from his people[a].
translation:
  language: de
  text: Wer aber Fleisch von dem Heilsopfer isst, das dem HERRN gehört, während seine Unreinheit auf ihm liegt, der soll von seinem Volk abgeschnitten werden[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „soll von seinem Volk ausgeschlossen werden“. Die Wendung kann Ausschluss oder Tod bezeichnen; wie die Strafe vollzogen wird, legt der hebräische Text hier nicht fest.'
    reason: Bewahrt die Unbestimmtheit der hebräischen Strafandrohung und nennt eine mögliche alternative Wiedergabe.
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: wer … der
  rationale: נֶפֶשׁ bezeichnet im kasuistischen Rechtskontext die einzelne Person. Die deutsche Relativkonstruktion gibt den generischen Fall natürlich und ohne eine unpassende Vorstellung von der immateriellen Seele wieder.
- source_word: תֹּאכַל
  choice: isst
  rationale: Das Imperfekt formuliert hier einen allgemein geltenden Rechtsfall; das deutsche Präsens passt zur einleitenden Relativkonstruktion.
- source_word: בָּשָׂר
  choice: Fleisch
  rationale: Im Zusammenhang mit Opfermahlzeiten bezeichnet das Wort das zum Verzehr bestimmte Fleisch; dies ist zugleich nah am Hebräischen und idiomatisch.
- source_word: מִזֶּבַח הַשְּׁלָמִים
  choice: von dem Heilsopfer
  rationale: שְׁלָמִים bezeichnet eine bestimmte Opferart. „Heilsopfer“ ist eine etablierte, knappe deutsche Wiedergabe, die den Zusammenhang mit שׁלם anklingen lässt, ohne den Zweck einseitig als Frieden oder Gemeinschaft festzulegen.
- source_word: אֲשֶׁר לַיהוָה
  choice: das dem HERRN gehört
  rationale: Die Formulierung bringt die Zugehörigkeit beziehungsweise Weihe an JHWH klar zum Ausdruck. Der Gottesname wird nach verbreiteter deutscher Bibelkonvention als HERR wiedergegeben.
- source_word: טֻמְאָתוֹ עָלָיו
  choice: während seine Unreinheit auf ihm liegt
  rationale: Die Wiedergabe bewahrt das konkrete hebräische Bild, wonach die Unreinheit „auf“ der Person liegt, und bleibt zugleich verständlich.
- source_word: וְנִכְרְתָה
  choice: soll … ausgerottet werden
  rationale: Die passive Rechtsformel bezeichnet eine schwere Entfernung aus der Gemeinschaft. „Ausgerottet werden“ bewahrt ihre Härte, ohne im Haupttext den nicht genannten Vollzug ausdrücklich als Hinrichtung oder Ausschluss festzulegen.
- source_word: מֵעַמֶּיהָ
  choice: aus seinem Volk
  rationale: Das feminine Suffix richtet sich grammatisch nach נֶפֶשׁ und bezeichnet nicht notwendig eine Frau. Im Deutschen nimmt „seinem“ den im Vers verwendeten maskulinen Personenbezug auf; „Volk“ gibt עַם direkt wieder.
theological_decisions:
- issue: Bedeutung der Strafandrohung וְנִכְרְתָה ... מֵעַמֶּיהָ
  choice: soll aus seinem Volk ausgerottet werden
  alternative: soll aus seinem Volk ausgeschlossen werden; soll sterben beziehungsweise getötet werden
  rationale: Die Formel bezeichnet eine schwerwiegende Entfernung aus der Bundesgemeinschaft, nennt hier aber weder Instanz noch genaue Vollzugsart. Der Haupttext wahrt die traditionelle Bildsprache; die Fußnote macht die Bandbreite möglicher Bedeutungen sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit rechtlich-kultischem Ton. Die Satzstruktur bleibt nahe am hebräischen Rechtsfall, ohne im Deutschen schwerfällig zu wirken; die bildhafte Formulierung zur Unreinheit und die Mehrdeutigkeit der Strafandrohung bleiben erhalten.
