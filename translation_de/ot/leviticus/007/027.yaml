source:
  edition: WLC
  text: כָּל נֶ֖פֶשׁ אֲשֶׁר תֹּאכַ֣ל כָּל דָּ֑ם וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵֽ/עַמֶּֽי/הָ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/027.yaml
  text: Every person who eats any blood—that person shall be cut off from his people[a][b].
translation:
  language: de
  text: Jeder Mensch[a], der Blut irgendwelcher Art isst – dieser Mensch soll von seinem Volk abgeschnitten werden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »Seele«. Das hebräische Wort nefesch bezeichnet hier den einzelnen Menschen.
    reason: lexical_alternative
  - marker: b
    text: »Von seinem Volk abgeschnitten werden« ist eine feste, bundesbezogene Straf- und Rechtsformel. Sie kann die Entfernung aus der Gemeinschaft oder ein göttliches Gericht bezeichnen; wie die Strafe vollzogen wird, legt der hebräische Text hier nicht fest.
    reason: alternative_reading
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: Mensch
  rationale: Im rechtlichen Zusammenhang bezeichnet נֶפֶשׁ hier die einzelne Person, nicht speziell eine immaterielle »Seele«. »Mensch« ist im Deutschen natürlich und schließt alle Betroffenen ein.
- source_word: תֹּאכַל
  choice: isst
  rationale: Das Imperfekt beschreibt im Relativsatz einen allgemeinen Rechtsfall. Das deutsche Präsens gibt diesen generellen Sinn idiomatisch wieder.
- source_word: כָּל דָּם
  choice: Blut irgendwelcher Art
  rationale: 'כָּל steht bei dem nicht zählbaren Substantiv distributiv: Gemeint ist Blut gleich welcher Art, nicht die Gesamtmenge allen Blutes.'
- source_word: וְנִכְרְתָה
  choice: soll … getilgt werden
  rationale: Die Passivform von כרת gehört zu einer festen bundesrechtlichen Strafformel. »Getilgt werden« bewahrt das Bild und lässt offen, auf welche Weise die Strafe vollzogen wird.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: dieser Mensch
  rationale: Die Wiederholung mit Demonstrativpronomen greift den Täter nachdrücklich wieder auf. Die deutsche Formulierung erhält diese rechtliche Hervorhebung.
- source_word: מֵעַמֶּיהָ
  choice: aus seinem Volk
  rationale: Das feminine Suffix richtet sich grammatisch nach dem femininen נֶפֶשׁ und beschränkt die Vorschrift nicht auf Frauen. Im Deutschen bezieht sich »seinem« auf den generisch verwendeten »Menschen«.
theological_decisions:
- issue: Bedeutung der bundesrechtlichen Strafformel »getilgt werden«
  choice: Die formelhafte und mehrdeutige Wendung bleibt erhalten, ohne die genaue Vollzugsart festzulegen.
  alternative: Mit »getötet«, »aus der Gemeinschaft ausgeschlossen« oder »von Gott vernichtet« eine bestimmte Deutung festschreiben.
  rationale: Der hebräische Text nennt weder ausdrücklich Todesstrafe noch Ausschluss oder unmittelbares göttliches Gericht. Die Übersetzung bewahrt deshalb die Spannung der knappen Formel.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von »Mensch« bildet die nachdrückliche hebräische Rechtsformulierung ab; der Gedankenstrich markiert den wiederaufnehmenden Strafsatz. Die generische Aussage gilt unabhängig vom Geschlecht.
