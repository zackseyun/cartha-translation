source:
  edition: WLC
  text: וְ/אֵת֙ שׁ֣וֹק הַ/יָּמִ֔ין תִּתְּנ֥וּ תְרוּמָ֖ה לַ/כֹּהֵ֑ן מִ/זִּבְחֵ֖י שַׁלְמֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/032.yaml
  text: And you shall give the right thigh as a contribution to the priest from your sacrifices of peace offerings[a][b][c].
translation:
  language: de
  text: Und die rechte Keule sollt ihr dem Priester als Abgabe[a] von euren Gemeinschaftsopfern[b] geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als Opfergabe“; traditionell: „als Hebopfer“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Friedensopfern“ oder „Heilsopfern“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹק הַיָּמִין
  choice: die rechte Keule
  rationale: שׁוֹק bezeichnet hier den fleischigen oberen Teil des Tierbeins; „Keule“ ist im Deutschen die natürliche und sachlich genaue Bezeichnung für dieses Opferstück. הַיָּמִין legt ausdrücklich die rechte Seite fest.
- source_word: תִּתְּנוּ
  choice: sollt ihr … geben
  rationale: Das Imperfekt der 2. Person Plural hat in dieser Rechtsanweisung verpflichtende Kraft. „sollt ihr geben“ klingt in modernem Deutsch verbindlich, ohne unnötig altertümlich zu wirken.
- source_word: תְרוּמָה
  choice: als Abgabe
  rationale: Das Wort bezeichnet einen ausgesonderten und übergebenen Anteil. „Abgabe“ vermittelt hier den dem Priester zustehenden Opferanteil klarer als das traditionelle, aber missverständliche „Hebopfer“.
- source_word: לַכֹּהֵן
  choice: dem Priester
  rationale: Der Empfänger steht im Hebräischen im Singular; der deutsche Dativ gibt die Beziehung natürlich wieder.
- source_word: מִזִּבְחֵי שַׁלְמֵיכֶם
  choice: von euren Gemeinschaftsopfern
  rationale: מִן bezeichnet die Herkunft des priesterlichen Anteils. זִבְחֵי שְׁלָמִים bezeichnet kultische Mahlopfer, bei denen Gemeinschaft und Wohlergehen mitschwingen; „Gemeinschaftsopfer“ ist im Deutschen verständlich und als Opferbezeichnung brauchbar.
- source_word: וְאֵת
  choice: Und
  rationale: וְ verbindet die Vorschrift mit dem vorausgehenden Zusammenhang; אֵת ist ein Akkusativmarker ohne eigene deutsche Entsprechung.
theological_decisions:
- issue: Bedeutungsumfang von שְׁלָמִים
  choice: Gemeinschaftsopfer
  alternative: Friedensopfer; Heilsopfer
  rationale: Der hebräische Begriff kann Frieden, Wohlergehen und gemeinschaftliche Verbundenheit anklingen lassen. „Gemeinschaftsopfer“ gibt eine zentrale Funktion dieser Opfer wieder, ohne den Bedeutungsumfang als rein inneren Frieden oder als Heilsgeschehen festzulegen; die Alternativen werden in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bewahrt den Anschluss durch „Und“ und hebt den vorgeschriebenen Opferanteil hervor. „Keule“ ist im deutschen Schlacht- und Opferkontext natürlicher als „Schenkel“ oder „Bein“.
