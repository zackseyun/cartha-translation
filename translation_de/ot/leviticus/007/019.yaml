id: LEV.7.19
reference: Leviticus 7:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הַ/בָּשָׂ֞ר אֲשֶׁר יִגַּ֤ע בְּ/כָל טָמֵא֙ לֹ֣א יֵֽאָכֵ֔ל בָּ/אֵ֖שׁ יִשָּׂרֵ֑ף וְ/הַ֨/בָּשָׂ֔ר כָּל טָה֖וֹר יֹאכַ֥ל בָּשָֽׂר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/019.yaml
  text: But the meat that touches anything unclean must not be eaten; it must be burned in the fire. And as for the meat, anyone who is clean may eat meat.
translation:
  language: de
  text: 'Doch Fleisch, das mit etwas Unreinem in Berührung kommt,[a] darf nicht gegessen werden; es muss im Feuer verbrannt werden. Was aber das Fleisch betrifft: Jeder, der rein ist, darf Fleisch essen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das irgendetwas Unreines berührt“. Das Hebräische ist weit gefasst und bezieht sich hier auf rituelle Unreinheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבָּשָׂר
  choice: Doch Fleisch
  rationale: בָּשָׂר bezeichnet hier Opferfleisch. Das einleitende וְ markiert im Zusammenhang einen Gegensatz zum erlaubten Verzehr und wird daher mit „Doch“ wiedergegeben.
- source_word: אֲשֶׁר יִגַּע בְּכָל טָמֵא
  choice: das mit etwas Unreinem in Berührung kommt
  rationale: יִגַּע bezeichnet Kontakt oder Berührung; כָּל טָמֵא bleibt bewusst weit gefasst und meint etwas kultisch Unreines, ohne die Art näher festzulegen.
- source_word: לֹא יֵאָכֵל
  choice: darf nicht gegessen werden
  rationale: Die passive Verbform mit Negation drückt ein verbindliches Verbot aus. „Darf nicht“ ist in modernem Deutsch klar und rechtssprachlich angemessen.
- source_word: בָּאֵשׁ יִשָּׂרֵף
  choice: es muss im Feuer verbrannt werden
  rationale: Die Wendung schreibt die Beseitigung des verunreinigten Opferfleisches durch Verbrennen vor und bewahrt das konkrete Bild des Feuers.
- source_word: וְהַבָּשָׂר
  choice: Was aber das Fleisch betrifft
  rationale: Die Wiederaufnahme des Nomens setzt einen neuen thematischen Akzent und stellt dem verunreinigten Fleisch das zum Verzehr geeignete Fleisch gegenüber.
- source_word: כָּל טָהוֹר
  choice: Jeder, der rein ist
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet jede Person in kultisch reinem Zustand; die Formulierung wahrt die umfassende Geltung.
- source_word: יֹאכַל בָּשָׂר
  choice: darf Fleisch essen
  rationale: Im rechtlichen Zusammenhang drückt die Form eine Erlaubnis aus, keinen Essensbefehl. Das artikellose בָּשָׂר wird natürlich mit „Fleisch“ wiedergegeben.
theological_decisions:
- issue: Bedeutung von טָמֵא und טָהוֹר im Opferrecht
  choice: „unrein“ und „rein“ als Bezeichnungen des rituellen Status
  alternative: „verunreinigt“ und „rein“ beziehungsweise „unrein“ und „kultisch rein“
  rationale: Im Kontext der levitischen Opferbestimmungen geht es primär um rituellen Status, nicht unmittelbar um moralische Schuld oder ethische Reinheit. Der Wortlaut bewahrt die kultische Unterscheidung, ohne sie im Haupttext auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer rechtlicher Aussage. „Fleisch“ wird gegenüber dem im Deutschen missverständlichen „Fleischliches/Fleisch“ im anthropologischen Sinn durch den Opferkontext eindeutig verstanden; die Fußnote erläutert die Breite der Kontaktformulierung.
