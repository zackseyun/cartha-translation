source:
  edition: WLC
  text: וְ/חֵ֤לֶב נְבֵלָה֙ וְ/חֵ֣לֶב טְרֵפָ֔ה יֵעָשֶׂ֖ה לְ/כָל מְלָאכָ֑ה וְ/אָכֹ֖ל לֹ֥א תֹאכְלֻֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/024.yaml
  text: But the fat of an animal that dies naturally[a], and the fat of one torn by beasts, may be used for any work[b]; but you must certainly not eat it.
translation:
  language: de
  text: Das Fett eines verendeten oder von Raubtieren gerissenen Tieres[a] darf zu jedem Zweck verwendet werden; essen dürft ihr es aber auf keinen Fall.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint sind Tiere, die ohne ordnungsgemäße Schlachtung verendet sind oder von Raubtieren gerissen wurden.
    reason: lexical_clarification
lexical_decisions:
- source_word: חֵלֶב
  choice: Fett
  rationale: Die übliche und verständliche Bezeichnung für Tierfett in Opfer- und Speisevorschriften; „Talg“ wäre enger und fachsprachlicher.
- source_word: נְבֵלָה
  choice: eines verendeten Tieres
  rationale: Bezeichnet hier ein Tier, das ohne ordnungsgemäße Schlachtung gestorben ist; „verendet“ gibt dies im Deutschen knapp und natürlich wieder.
- source_word: טְרֵפָה
  choice: eines von Raubtieren gerissenen Tieres
  rationale: Gibt den durch ein Raubtier verursachten Tod ausdrücklich und idiomatisch wieder.
- source_word: יֵעָשֶׂה לְכָל מְלָאכָה
  choice: darf für jeden anderen Zweck verwendet werden
  rationale: Der Zusammenhang erlaubt eine praktische Verwendung außerhalb des Verzehrs; „anderen“ verdeutlicht diesen Gegensatz, ohne die zulässigen Verwendungsarten unnötig einzuengen.
- source_word: וְאָכֹל לֹא תֹאכְלֻהוּ
  choice: essen dürft ihr es aber auf keinen Fall
  rationale: Die Konstruktion aus Infinitivus absolutus und finitem Verb verstärkt das Verbot; „auf keinen Fall“ bildet diese Emphase in natürlichem Deutsch ab.
theological_decisions: []
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die rechtliche Erlaubnis und das nachdrückliche Verzehrverbot werden kontrastreich formuliert.
