  text: אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה בְּ/הַ֣ר סִינָ֑י בְּ/י֨וֹם צַוֺּת֜/וֹ אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל לְ/הַקְרִ֧יב אֶת קָרְבְּנֵי/הֶ֛ם לַ/יהוָ֖ה בְּ/מִדְבַּ֥ר סִינָֽי־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/038.yaml
  text: which Yahweh commanded Moses on Mount Sinai[a], on the day when he commanded the sons of Israel to present their offerings to Yahweh in the wilderness of Sinai.
translation:
  language: de
  text: die Jahwe Mose am Berg Sinai gebot, an dem Tag, als er den Söhnen Israels[a] befahl, Jahwe ihre Opfergaben in der Wüste Sinai darzubringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Israeliten“ beziehungsweise „dem Volk Israel“. Wörtlich steht im Hebräischen: „den Söhnen Israels“.'
    reason: lexikalische Alternative und Erläuterung der hebräischen Kollektivbezeichnung
lexical_decisions:
- source_word: אֲשֶׁר
  choice: die
  rationale: Das Relativpronomen bewahrt den syntaktischen Anschluss an die in den vorhergehenden Versen zusammengefassten Opferbestimmungen.
- source_word: צִוָּה
  choice: gebot
  rationale: „Gebot“ gibt die verbindliche Autorität des Verbs im rechtlich-kultischen Zusammenhang prägnant und würdig wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Wiedergabe des göttlichen Eigennamens bewahrt das Tetragramm als Namen, statt es durch einen Titel zu ersetzen.
- source_word: בְּהַר סִינָי
  choice: am Berg Sinai
  rationale: Die Präposition kann eine Lage am beziehungsweise beim Berg bezeichnen; „am Berg Sinai“ ist im Deutschen natürlich und legt nicht unnötig fest, dass der gesamte Vorgang auf dem Gipfel stattfand.
- source_word: בְּיוֹם צַוֺּתוֹ
  choice: an dem Tag, als er … befahl
  rationale: Die Infinitivkonstruktion mit Suffix wird als flüssiger deutscher Temporalsatz wiedergegeben, während der ausdrückliche Tagesbezug erhalten bleibt.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: den Söhnen Israels
  rationale: Die Übersetzung bewahrt die familiäre Formulierung des Hebräischen; eine Fußnote nennt die im Deutschen idiomatischere kollektive Wiedergabe.
- source_word: לְהַקְרִיב
  choice: darzubringen
  rationale: Im Opferkontext bezeichnet der Hifil von קרב das kultische Herbeibringen beziehungsweise Darbringen und verbindet sich im Deutschen natürlich mit „Opfergaben“.
- source_word: קָרְבְּנֵיהֶם
  choice: ihre Opfergaben
  rationale: קָרְבָּן ist ein weiter kultischer Begriff, der hier mehrere Arten von Opfern zusammenfasst; „Opfergaben“ wahrt diese Breite.
- source_word: בְּמִדְבַּר סִינָי
  choice: in der Wüste Sinai
  rationale: Diese geläufige geografische Bezeichnung gibt מִדְבָּר klar und natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Eigennamen, anstatt ihn durch den traditionellen Ersatztitel wiederzugeben.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  alternative: Israeliten / Volk Israel
  rationale: Die Hauptübersetzung erhält die ausdrücklich familiäre hebräische Wendung. Die Alternative macht deutlich, dass die Formulierung kollektiv das israelitische Volk bezeichnen kann.
- issue: Räumlicher Sinn von בְּהַר סִינָי
  choice: am Berg Sinai
  alternative: auf dem Berg Sinai
  rationale: Die Präposition בְּ lässt hier beide räumlichen Auffassungen zu. „Am Berg Sinai“ bewahrt die geografische Einordnung, ohne den Ort enger als nötig zu bestimmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit engem Anschluss an die hebräische Syntax. Der Vers bleibt als Relativsatz an den vorausgehenden Zusammenhang gebunden. Kultische Fachsprache wird verständlich mit „Opfergaben“ und „darbringen“ wiedergegeben.
