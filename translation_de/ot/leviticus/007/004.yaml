source:
  edition: WLC
  text: וְ/אֵת֙ שְׁתֵּ֣י הַ/כְּלָיֹ֔ת וְ/אֶת הַ/חֵ֨לֶב֙ אֲשֶׁ֣ר עֲלֵי/הֶ֔ן אֲשֶׁ֖ר עַל הַ/כְּסָלִ֑ים וְ/אֶת הַ/יֹּתֶ֨רֶת֙ עַל הַ/כָּבֵ֔ד עַל הַ/כְּלָיֹ֖ת יְסִירֶֽ/נָּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/004.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, which he shall remove with the kidneys.
translation:
  language: de
  text: und die beiden Nieren und das Fett daran, das an den Lenden liegt, sowie den Fortsatz an der Leber[a]; zusammen mit den Nieren soll er ihn entfernen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Leberlappen“. Der hebräische Ausdruck bezeichnet einen bestimmten Körperteil, doch welche anatomische Struktur genau gemeint ist, ist umstritten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: die beiden Nieren
  rationale: כְּלָיוֹת bezeichnet in der Opferanatomie eindeutig die Nieren; die Formulierung ist im modernen Deutsch klar und anatomisch präzise.
- source_word: הַחֵלֶב
  choice: das Fett
  rationale: חֵלֶב meint im levitischen Opferkontext die für die Darbringung bestimmten Fettteile. „Fett“ ist verständlich und vermeidet eine unnötige Verengung auf „Talg“.
- source_word: אֲשֶׁר עֲלֵיהֶן
  choice: daran
  rationale: Die Wiedergabe folgt der räumlichen Grundbedeutung von עַל, ohne interpretierend „das sie bedeckt“ zu ergänzen.
- source_word: הַכְּסָלִים
  choice: die Lenden
  rationale: כְּסָלִים bezeichnet die Lenden- beziehungsweise Flankengegend bei den Nieren. „Lenden“ bewahrt den anatomischen Bezug der Opferbeschreibung.
- source_word: הַיֹּתֶרֶת
  choice: der Fortsatz
  rationale: יוֹתֶרֶת ist ein technischer anatomischer Ausdruck für ein hervortretendes Teil im Bereich der Leber. „Fortsatz“ bleibt konkret, ohne den nicht sicher bestimmbaren Körperteil übergenau zu benennen.
- source_word: עַל הַכָּבֵד
  choice: an der Leber
  rationale: Das Deutsche „an der Leber“ gibt die räumliche Beziehung von עַל in diesem anatomischen Zusammenhang natürlich wieder, ohne eine genauere Art der Verbindung festzulegen.
- source_word: עַל הַכְּלָיֹת
  choice: zusammen mit den Nieren
  rationale: In der wiederkehrenden Opferformel bezeichnet die Wendung die gemeinsame Entfernung des Leberfortsatzes und der Nieren; diese prozedurale Beziehung wird im Deutschen klar ausgedrückt.
- source_word: יְסִירֶנָּה
  choice: soll er ihn entfernen
  rationale: Der Hifil von סור formuliert hier eine kultische Verfahrensanweisung. Das Pronomen „ihn“ nimmt grammatisch den Fortsatz auf und erhält die syntaktische Spannung des Hebräischen.
theological_decisions: []
