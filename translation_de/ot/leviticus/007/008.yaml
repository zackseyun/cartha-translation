id: LEV.7.8
reference: Leviticus 7:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הַ֨/כֹּהֵ֔ן הַ/מַּקְרִ֖יב אֶת עֹ֣לַת אִ֑ישׁ ע֤וֹר הָֽ/עֹלָה֙ אֲשֶׁ֣ר הִקְרִ֔יב לַ/כֹּהֵ֖ן ל֥/וֹ יִהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/008.yaml
  text: And the priest who presents a man's burnt offering shall have for himself the skin of the burnt offering that he has presented[a][b].
translation:
  language: de
  text: Und der Priester, der das Brandopfer eines Mannes darbringt, soll die Haut des Brandopfers, das er dargebracht hat, für sich erhalten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »soll dem Priester, ihm, gehören«.'
    reason: Die Fußnote macht die betonte hebräische Besitzkonstruktion לַכֹּהֵן לוֹ יִהְיֶה sichtbar, die im flüssigen Haupttext idiomatisch wiedergegeben wird.
lexical_decisions:
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Die übliche und sachlich genaue Wiedergabe von כֹּהֵן in den Opferbestimmungen; der bestimmte Artikel bleibt erhalten.
- source_word: הַמַּקְרִיב / הִקְרִיב
  choice: darbringt / dargebracht hat
  rationale: Der Hifil von קרב bezeichnet im kultischen Zusammenhang das Heranbringen beziehungsweise Darbringen eines Opfers. „Darbringen“ ist im Deutschen natürlich und bewahrt den rituellen Sinn; das Perfekt wird als abgeschlossene Handlung wiedergegeben.
- source_word: עֹלַת אִישׁ
  choice: das Brandopfer eines Mannes
  rationale: עֹלָה bezeichnet hier die etablierte Opferart des Brandopfers. Der singularische Ausdruck אִישׁ wird als „eines Mannes“ bewahrt und nicht verallgemeinert.
- source_word: עֹור
  choice: die Haut
  rationale: Gemeint ist die abgezogene Tierhaut. „Haut“ ist die direkte und allgemein verständliche deutsche Entsprechung; „Fell“ wäre enger und könnte eine noch behaarte Haut nahelegen.
- source_word: הָעֹלָה
  choice: des Brandopfers
  rationale: „Brandopfer“ ist die im Deutschen etablierte und im Kontext klare Bezeichnung für עֹלָה.
- source_word: אֲשֶׁר הִקְרִיב
  choice: das er dargebracht hat
  rationale: Der Relativsatz bezieht sich am natürlichsten auf das Brandopfer und bestimmt das vom betreffenden Priester dargebrachte Opfer näher.
- source_word: לַכֹּהֵן לוֹ יִהְיֶה
  choice: soll … für sich erhalten
  rationale: Die hebräische Konstruktion betont, dass die Haut dem amtierenden Priester als sein Anteil zukommt. Die deutsche Formulierung gibt diesen Besitzanspruch idiomatisch wieder.
theological_decisions:
- issue: Geschlechtsspezifische Wiedergabe von אִישׁ
  choice: das Brandopfer eines Mannes
  alternative: das Brandopfer eines Menschen / jemandes Brandopfer
  rationale: Der hebräische Text verwendet ausdrücklich das singularische maskuline Substantiv אִישׁ. Die Übersetzung bewahrt diese Form, ohne sie stillschweigend zu verallgemeinern.
- issue: Kultischer Fachbegriff עֹלָה
  choice: Brandopfer
  alternative: Aufstiegsopfer
  rationale: „Brandopfer“ ist die verständliche und etablierte deutsche Bezeichnung für diese Opferart. „Aufstiegsopfer“ bildet zwar eine mögliche etymologische Deutung ab, ist jedoch weniger geläufig und würde den Ritualbegriff unnötig verfremden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit etablierter kultischer Terminologie. Die Satzstellung folgt dem Hebräischen weitgehend, bleibt aber flüssig und allgemein verständlich. Der Fußnotenmarker [a] steht im Haupttext.
