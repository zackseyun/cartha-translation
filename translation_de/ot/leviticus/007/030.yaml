  text: יָדָ֣י/ו תְּבִיאֶ֔ינָה אֵ֖ת אִשֵּׁ֣י יְהוָ֑ה אֶת הַ/חֵ֤לֶב עַל הֶֽ/חָזֶה֙ יְבִיאֶ֔/נּוּ אֵ֣ת הֶ/חָזֶ֗ה לְ/הָנִ֥יף אֹת֛/וֹ תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/030.yaml
  text: 'His own hands shall bring the food offerings of the LORD: he shall bring the fat with the breast, to wave the breast as a wave offering before the LORD.'
translation:
  language: de
  text: Mit eigenen Händen soll er die Feueropfer für den HERRN bringen. Das Fett soll er auf der Brust bringen, um die Brust als Schwingopfer vor dem HERRN zu schwingen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָדָיו
  choice: mit eigenen Händen
  rationale: Die vorangestellten »seine Hände« betonen, dass der Opfernde die Gaben persönlich bringt; die deutsche Wendung gibt diesen Nachdruck natürlich wieder.
- source_word: אִשֵּׁי יְהוָה
  choice: die Feueropfer für den HERRN
  rationale: אִשֶּׁה bezeichnet eine durch Feuer dargebrachte Gabe; »Feueropfer« bewahrt diesen kultischen Bezug. Der Gottesname wird entsprechend der deutschen Bibelkonvention mit »HERR« wiedergegeben.
- source_word: עַל
  choice: zusammen mit
  rationale: In der Verbindung von Fett und Brust bezeichnet die Präposition hier die gemeinsame Darbringung; »zusammen mit« ist im Deutschen klarer als das missverständliche wörtliche »auf«.
- source_word: תְּנוּפָה / לְהָנִיף
  choice: Schwingopfer / hin und her zu schwingen
  rationale: Die Wortfamilie bezeichnet das rituelle Schwingen beziehungsweise Bewegen der Opfergabe; die verwandten deutschen Ausdrücke erhalten die Wiederholung des hebräischen Stammes.
theological_decisions:
- issue: Wiedergabe des Tetragramms יהוה
  choice: HERR
  alternative: Jahwe
  rationale: »HERR« folgt der etablierten deutschsprachigen Bibelkonvention und kennzeichnet den Gottesnamen typografisch, ohne eine bestimmte Aussprache festzulegen.
- issue: Bezug des kultischen Schwingens
  choice: Die Brust wird als Schwingopfer geschwungen.
  alternative: Fett und Brust werden gemeinsam geschwungen.
  rationale: Das ausdrücklich wiederholte אֶת־הֶחָזֶה und das anschließende אֹתוֹ bestimmen die Brust als Gegenstand des Schwingens, während das Fett mit ihr zum Heiligtum gebracht wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlicher kultischer Fachsprache. Die persönliche Beteiligung des Opfernden und die Wiederholung der hebräischen Wortfamilie für das Schwingopfer bleiben erkennbar.
