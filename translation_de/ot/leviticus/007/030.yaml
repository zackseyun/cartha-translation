    issue: עַל־הֶחָזֶה wird mit »zusammen mit der Brust« wiedergegeben.
    rationale: Die Präposition bedeutet vorrangig „auf“. Die Formulierung beschreibt die Anordnung des Fetts auf der Brust und sollte nicht in die allgemeinere Begleitungsrelation „zusammen mit“ aufgelöst werden.
  - severity: low
    issue: »hin und her zu schwingen« ergänzt eine Bewegungsrichtung.
    rationale: לְהָנִיף bezeichnet das rituelle Schwingen, ohne in diesem Vers die Richtung ausdrücklich festzulegen. Die Ergänzung ist entbehrlich und potenziell zu konkret.
  revised_text: Mit eigenen Händen soll er die Feueropfer für den HERRN bringen. Das Fett soll er auf der Brust bringen, um die Brust als Schwingopfer vor dem HERRN zu schwingen.
