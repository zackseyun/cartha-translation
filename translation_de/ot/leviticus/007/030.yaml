revisions:
- from: Mit eigenen Händen soll er die Feueropfer für den HERRN bringen. Das Fett soll er zusammen mit der Brust bringen, um die Brust als Schwingopfer vor dem HERRN hin und her zu schwingen.
  to: Mit eigenen Händen soll er die Feueropfer für den HERRN bringen. Das Fett soll er auf der Brust bringen, um die Brust als Schwingopfer vor dem HERRN zu schwingen.
  rationale: Die Revision stellt die räumliche Aussage von עַל („auf“) wieder her und vermeidet eine nicht im Text spezifizierte Bewegungsrichtung. Die syntaktisch auffällige Wiederholung von „Brust“ und „schwingen“ bleibt erhalten, weil sie die hebräische Wiederaufnahme und Wortfamilie nachvollzieht.
