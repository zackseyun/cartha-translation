source:
  edition: WLC
  text: וְ/הִקְטִ֨יר אֹתָ֤/ם הַ/כֹּהֵן֙ הַ/מִּזְבֵּ֔חָ/ה אִשֶּׁ֖ה לַ/יהוָ֑ה אָשָׁ֖ם הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/005.yaml
  text: The priest shall burn them on the altar as a food offering to Yahweh[b][a]; it is a guilt offering.
translation:
  language: de
  text: Der Priester soll sie auf dem Altar als Feueropfer für Jahwe in Rauch aufgehen lassen. Es ist ein Schuldopfer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Wiedergutmachungsopfer“; traditionell auch „Übertretungsopfer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: soll … in Rauch aufgehen lassen
  rationale: Der Hifil von קטר bezeichnet im Opferkontext, dass Opferteile auf dem Altar verbrannt werden und als Rauch aufsteigen. Die Wendung gibt den kultischen Vorgang genauer wieder als das allgemeinere „verbrennen“.
- source_word: אֹתָם
  choice: sie
  rationale: Das Akkusativpronomen verweist auf die zuvor genannten Opferteile.
- source_word: הַכֹּהֵן
  choice: Der Priester
  rationale: Bestimmter Singular; die übliche und klare Wiedergabe der kultischen Amtsbezeichnung.
- source_word: הַמִּזְבֵּחָה
  choice: auf dem Altar
  rationale: Die Richtungsendung kann wörtlich „zum Altar hin“ ausdrücken; im Deutschen bezeichnet „auf dem Altar“ den gemeinten Ort des Verbrennens natürlich und eindeutig.
- source_word: אִשֶּׁה
  choice: als Feueropfer
  rationale: Der technische Opferausdruck bezeichnet eine durch Feuer dargebrachte Gabe. „Feueropfer“ bewahrt den ausdrücklichen Feuerbezug und ist im Deutschen knapp und verständlich.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition kennzeichnet die Widmung des Opfers. „Für Jahwe“ ist in diesem deutschen Satz idiomatisch und bewahrt den Gottesnamen.
- source_word: אָשָׁם
  choice: Schuldopfer
  rationale: Der Ausdruck benennt hier eine feste Opferkategorie. „Schuldopfer“ ist die etablierte, transparente deutsche Bezeichnung, kann aber den ebenfalls vorhandenen Wiedergutmachungsaspekt nicht vollständig abbilden.
- source_word: הוּא
  choice: Es ist
  rationale: Das Pronomen ordnet die beschriebene Darbringung ausdrücklich der Kategorie des Schuldopfers zu.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt den offenbarten Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Technischer Opferbegriff אָשָׁם
  choice: Schuldopfer
  alternative: Wiedergutmachungsopfer
  rationale: „Schuldopfer“ bewahrt die traditionelle und verständliche Bezeichnung der levitischen Opferkategorie; die Alternative hebt stärker den Wiedergutmachungsaspekt hervor, der im Begriff und im weiteren Gesetzeskontext mitschwingt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kultische Fachsprache bleibt erkennbar, ohne altertümliche Satzstellung. „In Rauch aufgehen lassen“ bildet die spezifische Opferhandlung ab; „Feueropfer“ bewahrt die Bedeutung von אִשֶּׁה.
