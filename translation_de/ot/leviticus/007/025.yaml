id: LEV.7.25
reference: Leviticus 7:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֚י כָּל אֹכֵ֣ל חֵ֔לֶב מִן הַ֨/בְּהֵמָ֔ה אֲשֶׁ֨ר יַקְרִ֥יב מִמֶּ֛/נָּה אִשֶּׁ֖ה לַ/יהוָ֑ה וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הָ/אֹכֶ֖לֶת מֵֽ/עַמֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/025.yaml
  text: For anyone who eats fat from an animal from which an offering made by fire is presented to Yahweh[b][a], the person who eats it shall be cut off from his people.
translation:
  language: de
  text: Denn wer Fett von einem Tier isst, von dem man dem HERRN ein Feueropfer[a] darbringt, der soll aus seinem Volk ausgerottet werden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Ausdruck bezeichnet eine Opfergabe, die auf dem Altar im Feuer verbrannt wird beziehungsweise in Rauch aufgeht.
    reason: lexical_alternative
  - marker: b
    text: „Aus seinem Volk ausgerottet werden“ gibt eine hebräische Rechtsformel wieder. Ob sie Ausschluss, Tod oder göttliches Gericht bezeichnet, ist nicht eindeutig.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet das unmittelbar zuvor ausgesprochene Verbot und stellt den Zusammenhang im Deutschen natürlich her.
- source_word: כָּל אֹכֵל
  choice: wer … isst
  rationale: Die deutsche Wer-Konstruktion gibt den allgemeinen, jeden möglichen Täter einschließenden Sinn idiomatisch wieder.
- source_word: חֵלֶב
  choice: Fett
  rationale: Gemeint ist tierisches Fett, im Opferkontext besonders das für den Altar bestimmte Fett; „Fett“ ist die klare und sachlich offene Wiedergabe.
- source_word: מִן הַבְּהֵמָה
  choice: von einem Tier
  rationale: בְּהֵמָה bezeichnet hier ein für Opfer infrage kommendes Tier; „Tier“ ist modernes, verständliches Deutsch.
- source_word: אֲשֶׁר יַקְרִיב מִמֶּנָּה
  choice: von dem man … darbringt
  rationale: Das hebräische Verb steht aktiv mit unbestimmtem Subjekt. Das deutsche „man“ bewahrt diese Unbestimmtheit und den Bezug auf das Tier.
- source_word: אִשֶּׁה
  choice: Feueropfer
  rationale: Der kultische Ausdruck bezeichnet eine Opfergabe, die auf dem Altar dem Feuer übergeben wird. „Feueropfer“ ist knapp, verständlich und vermeidet eine unbegründete Einengung auf Speise.
- source_word: לַיהוָה
  choice: dem HERRN
  rationale: Der Gottesname JHWH wird nach verbreiteter deutscher Bibelkonvention mit „HERR“ in Kapitälchen wiedergegeben; die Präposition bezeichnet den Empfänger des Opfers.
- source_word: וְנִכְרְתָה
  choice: soll … ausgerottet werden
  rationale: Die Formulierung bewahrt die Schärfe der hebräischen Rechtsformel, ohne die genaue Art der Strafe festzulegen.
- source_word: הַנֶּפֶשׁ הָאֹכֶלֶת
  choice: wer … isst, der
  rationale: נֶפֶשׁ bezeichnet im Rechtskontext die betreffende Person. Die korrelative deutsche Konstruktion gibt den individuellen Täter natürlich wieder.
- source_word: מֵעַמֶּיהָ
  choice: aus seinem Volk
  rationale: Das feminine Suffix stimmt grammatisch mit נֶפֶשׁ überein, bezeichnet aber keine ausdrücklich weibliche Person. „Seinem“ bezieht sich auf das generische „wer … der“.
theological_decisions:
- issue: Bundesrechtliche Strafformel וְנִכְרְתָה … מֵעַמֶּיהָ
  choice: soll aus seinem Volk ausgerottet werden
  alternative: soll aus seinem Volk ausgeschlossen / getötet werden
  rationale: Ob die Formel Ausschluss aus der Gemeinschaft, Tod durch menschliches Handeln, göttliches Gericht oder eine Verbindung davon meint, ist umstritten. Die Übersetzung bewahrt deshalb die bildhafte Rechtsformel und erklärt die Deutungsbreite in einer Fußnote.
- issue: Geschlecht in der allgemeinen Rechtsbestimmung
  choice: wer … der … aus seinem Volk
  alternative: die Person … aus ihrem Volk
  rationale: Das grammatische Femininum hängt an נֶפֶשׁ („Person/Leben“) und bestimmt nicht das natürliche Geschlecht des Täters. Die deutsche Wer-Konstruktion erhält den allgemeinen Singular.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper Rechtssprache. Die Wer-Konstruktion vermeidet unnötige Wiederholung, während „ausgerottet werden“ die Härte und Deutungsoffenheit der hebräischen Strafformel erhält.
