source:
  edition: WLC
  text: זֹ֣את הַ/תּוֹרָ֗ה לָֽ/עֹלָה֙ לַ/מִּנְחָ֔ה וְ/לַֽ/חַטָּ֖את וְ/לָ/אָשָׁ֑ם וְ/לַ֨/מִּלּוּאִ֔ים וּ/לְ/זֶ֖בַח הַ/שְּׁלָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/037.yaml
  text: This is the law for the burnt offering[a], the grain offering, the sin offering, the guilt offering, the ordination offering[d][c][b], and the sacrifice of peace offerings.
translation:
  language: de
  text: Dies ist die Weisung für das Brandopfer, das Speiseopfer, das Sündopfer[a], das Schuldopfer[b], die Einsetzungsriten[c] und das Heilsopfer[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Reinigungsopfer“. Der hebräische Ausdruck kann neben dem Umgang mit Sünde auch die Beseitigung von Unreinheit hervorheben.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „Wiedergutmachungsopfer“. Der hebräische Ausdruck kann Schuld beziehungsweise Haftung und die erforderliche Wiedergutmachung betonen.'
    reason: lexical_alternative
  - marker: c
    text: Wörtlich mit der Vorstellung des „Füllens“ verbunden; gemeint sind die Riten zur Einsetzung oder Weihe der Priester. Der hebräische Ausdruck steht im Plural.
    reason: lexical_alternative
  - marker: d
    text: 'Auch: „Friedensopfer“ oder „Gemeinschaftsopfer“. Der hebräische Ausdruck umfasst Vorstellungen von Heil, Wohlergehen, Frieden und Gemeinschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הַתּוֹרָה
  choice: Dies ist die Weisung
  rationale: Die feminine Demonstrativform leitet eine Zusammenfassung ein. תּוֹרָה bezeichnet hier die maßgebliche kultische Weisung; „Weisung“ gibt den konkreten Anleitungscharakter natürlicher wieder als das breitere „Gesetz“.
- source_word: לָעֹלָה
  choice: für das Brandopfer
  rationale: Die Präposition לְ bezeichnet hier den Geltungsbereich der Weisung. עֹלָה ist das vollständig auf dem Altar verbrannte Opfer und wird idiomatisch als „Brandopfer“ wiedergegeben.
- source_word: לַמִּנְחָה
  choice: das Speiseopfer
  rationale: מִנְחָה bezeichnet in diesem levitischen Zusammenhang das unblutige, überwiegend aus Getreide bestehende Opfer. „Speiseopfer“ ist im Deutschen verständlich und als kultischer Fachbegriff etabliert.
- source_word: וְלַחַטָּאת
  choice: das Sündopfer
  rationale: חַטָּאת kann sowohl Sünde als auch das Opfer zu ihrer beziehungsweise zur Unreinheitsbeseitigung bezeichnen. „Sündopfer“ bleibt im Haupttext erkennbar; die reinigende Funktion wird in einer Fußnote bewahrt.
- source_word: וְלָאָשָׁם
  choice: das Schuldopfer
  rationale: אָשָׁם bezeichnet das mit Schuld, Haftung und gegebenenfalls Wiedergutmachung verbundene Opfer. „Schuldopfer“ ist knapp und geläufig; die alternative Nuance steht in der Fußnote.
- source_word: וְלַמִּלּוּאִים
  choice: die Einsetzungsriten
  rationale: Das pluralische מִלּוּאִים bezeichnet im priesterlichen Kontext die Handlungen zur Einsetzung beziehungsweise Weihe. Der Plural und der umfassendere Ritualbezug werden so besser erhalten als mit einem singularischen „Einsetzungsopfer“.
- source_word: וּלְזֶבַח הַשְּׁלָמִים
  choice: das Heilsopfer
  rationale: זֶבַח bezeichnet ein Schlachtopfer; שְׁלָמִים umfasst Vorstellungen von Heil, Wohlergehen, Frieden und Gemeinschaft. „Heilsopfer“ ist eine knappe deutsche Bezeichnung, ohne die semantische Breite vollständig festzulegen.
theological_decisions:
- issue: Bedeutungsumfang von חַטָּאת
  choice: Sündopfer im Haupttext, mit Hinweis auf die reinigende Funktion
  alternative: Reinigungsopfer
  rationale: Der Ausdruck kann den Umgang mit Sünde ebenso wie die Beseitigung kultischer Unreinheit hervorheben. Die Fußnote bewahrt diese Spannung.
- issue: Bedeutungsumfang von אָשָׁם
  choice: Schuldopfer im Haupttext
  alternative: Wiedergutmachungsopfer
  rationale: „Schuldopfer“ hält die Schuld- und Haftungsdimension fest, während die Fußnote die häufig damit verbundene Wiedergutmachung sichtbar macht.
- issue: Deutung von הַשְּׁלָמִים
  choice: Heilsopfer
  alternative: Friedensopfer oder Gemeinschaftsopfer
  rationale: Keine einzelne deutsche Benennung deckt Frieden, Wohlergehen und Gemeinschaft vollständig ab. Die Hauptfassung bleibt knapp; die Fußnote nennt die wichtigen Alternativen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kultische Fachbegriffe werden knapp und verständlich verwendet. Die Reihung des hebräischen Textes bleibt erhalten; „Einsetzungsriten“ wahrt bewusst den Plural und den weiteren Bedeutungsumfang des Originals.
