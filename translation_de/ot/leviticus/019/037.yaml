  text: וּ/שְׁמַרְתֶּ֤ם אֶת כָּל חֻקֹּתַ/י֙ וְ/אֶת כָּל מִשְׁפָּטַ֔/י וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם אֲנִ֖י יְהוָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/037.yaml
  text: So you shall keep all my statutes and all my judgments[a], and do them. I am Yahweh.
translation:
  language: de
  text: Haltet also alle meine Satzungen und alle meine Rechtsbestimmungen[a] und führt sie aus. Ich bin Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder für „Satzungen“: „festgesetzte Vorschriften“; für „Rechtsbestimmungen“: „Rechtsordnungen“. Im Hebräischen stehen zwei verschiedene Rechtsbegriffe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Haltet also
  rationale: שׁמר bezeichnet im rechtlich-bundestheologischen Zusammenhang das Beachten oder Einhalten von Geboten. „Haltet“ ist im Deutschen idiomatisch; „also“ gibt die zusammenfassende Schlussfunktion des Verses wieder, während das hebräische ו formal auch schlicht „und“ bedeuten kann.
- source_word: כָּל
  choice: alle
  rationale: Bewahrt bei beiden Vorkommen den umfassenden Sinn des Hebräischen.
- source_word: חֻקֹּתַי
  choice: meine Satzungen
  rationale: חֻקִּים bezeichnet festgesetzte Vorschriften oder Satzungen. Die Wiedergabe wahrt die Unterscheidung zum folgenden מִשְׁפָּטִים.
- source_word: מִשְׁפָּטַי
  choice: meine Rechtsbestimmungen
  rationale: מִשְׁפָּטִים kann Rechtsentscheide, Rechtsordnungen oder Bestimmungen bezeichnen. „Rechtsbestimmungen“ ist verständlich, hält das rechtliche Register aufrecht und bleibt von „Satzungen“ unterschieden.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: und handelt danach
  rationale: עשה mit Rechtsvorschriften als Objekt bedeutet, sie zu tun, auszuführen oder zu befolgen. „Handelt danach“ klingt im modernen Deutschen natürlicher als das wörtliche „tut sie“, ohne den Vollzug abzuschwächen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Gottesnamen direkt. „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Verhältnis von Bewahren und Tun
  choice: „Haltet … und handelt danach“ als zwei eng verbundene Aufforderungen
  alternative: Beide Verben zu einem einzigen „befolgt“ zusammenziehen
  rationale: Die Formulierung erhält die hebräische Spannung zwischen achtsamem Einhalten und tatsächlichem Vollzug, ohne daraus eine besondere systematisch-theologische Unterscheidung abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der knappe, abschließende Charakter des Kapitelendes bleibt erhalten; die beiden hebräischen Rechtstermini werden erkennbar unterschieden.
