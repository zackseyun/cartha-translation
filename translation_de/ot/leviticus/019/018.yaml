source:
  edition: WLC
  text: לֹֽא תִקֹּ֤ם וְ/לֹֽא תִטֹּר֙ אֶת בְּנֵ֣י עַמֶּ֔/ךָ וְ/אָֽהַבְתָּ֥ לְ/רֵעֲ/ךָ֖ כָּמ֑וֹ/ךָ אֲנִ֖י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/018.yaml
  text: You shall not take vengeance or bear a grudge against the sons of your people[a], but you shall love your neighbor as yourself; I am Yahweh.
translation:
  language: de
  text: Du sollst an den Angehörigen deines Volkes[a] nicht Rache nehmen und ihnen nichts nachtragen, sondern deinen Nächsten lieben wie dich selbst. Ich bin Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „an den Söhnen deines Volkes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִקֹּם
  choice: dich rächen
  rationale: Das Verb נקם bezeichnet das Ausüben von Vergeltung oder Rache. Die reflexive Wendung „sich rächen“ ist im modernen Deutschen natürlich und bewahrt den aktiven Sinn.
- source_word: תִטֹּר
  choice: nichts nachtragen
  rationale: נטר bezeichnet hier das fortgesetzte Festhalten an Groll. „Jemandem etwas nachtragen“ gibt diesen andauernden inneren Groll idiomatisch wieder.
- source_word: בְּנֵי עַמֶּךָ
  choice: den Angehörigen deines Volkes
  rationale: Wörtlich steht „Söhne deines Volkes“. Die Wendung bezeichnet hier Mitglieder des eigenen Volkes; „Angehörige“ gibt den gemeinschaftlichen Bezug natürlich und ohne unnötige Beschränkung auf männliche Personen wieder. Die wörtliche Form wird in der Fußnote bewahrt.
- source_word: וְאָהַבְתָּ
  choice: sondern ... lieben
  rationale: Das Waw mit Perfekt hat im gesetzlichen Zusammenhang Gebotskraft. Nach den vorausgehenden Verboten stellt „sondern“ den positiven Gegenbefehl im Deutschen klar heraus; „sollst“ gilt dabei aus dem koordinierten Satz fort.
- source_word: לְרֵעֲךָ
  choice: deinen Mitmenschen
  rationale: רֵעַ kann einen Nächsten, Gefährten oder Mitmenschen bezeichnen. „Mitmensch“ ist gegenwärtiges, verständliches Deutsch und lässt den genauen sozialen Umfang des Ausdrucks offen, ohne ihn auf den unmittelbar Wohnenden zu verengen.
- source_word: כָּמוֹךָ
  choice: wie dich selbst
  rationale: Die Vergleichsformel wird direkt und idiomatisch wiedergegeben. Sie bewahrt die knappe Form des Hebräischen und legt nicht eigens fest, ob Selbstliebe als Maßstab oder Gleichartigkeit gemeint ist.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Reichweite der angesprochenen Personengruppe
  choice: Den unmittelbaren Volksbezug in „Angehörigen deines Volkes“ bewahren und רֵעַ mit „Mitmensch“ wiedergeben.
  alternative: Beide Ausdrücke in eine uneingeschränkt universale Formulierung auflösen oder beide ausdrücklich auf Israel beschränken.
  rationale: Der hebräische Text verwendet zwei unterschiedliche Wendungen. Die Übersetzung bewahrt diese Unterscheidung, ohne aus späteren Auslegungen eine Erweiterung oder Einschränkung in den Wortlaut einzutragen.
- issue: Bezug von כָּמוֹךָ
  choice: „wie dich selbst“
  alternative: „der ist wie du“ beziehungsweise „als einen, der dir gleich ist“
  rationale: Die knappe hebräische Vergleichsform ist syntaktisch mehrdeutig diskutierbar. Die traditionelle und grammatisch naheliegende Wiedergabe bleibt im Haupttext, ohne die alternative Deutung durch erklärende Zusätze auszuschließen.
- issue: Wiedergabe des Gottesnamens
  choice: Jahwe
  alternative: der HERR oder Jehova
  rationale: Die Transliteration bewahrt den Eigennamen יהוה, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Verbote bleiben knapp; der positive Gegenbefehl wird mit „sondern“ natürlich angeschlossen. „Nichts nachtragen“ und „Mitmensch“ sind allgemein verständlich, ohne den ethischen Gehalt zu verflachen.
