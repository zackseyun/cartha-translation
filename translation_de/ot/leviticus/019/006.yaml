source:
  edition: WLC
  text: בְּ/י֧וֹם זִבְחֲ/כֶ֛ם יֵאָכֵ֖ל וּ/מִֽ/מָּחֳרָ֑ת וְ/הַ/נּוֹתָר֙ עַד י֣וֹם הַ/שְּׁלִישִׁ֔י בָּ/אֵ֖שׁ יִשָּׂרֵֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/006.yaml
  text: It shall be eaten on the day of your sacrifice and on the next day[a], but what remains until the third day shall be burned in the fire.
translation:
  language: de
  text: Es soll am Tag eures Schlachtopfers und am folgenden Tag gegessen werden. Was aber bis zum dritten Tag übrig bleibt, soll im Feuer verbrannt werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיוֹם
  choice: am Tag
  rationale: Die Präposition בְּ bezeichnet hier den Zeitpunkt; „am Tag“ ist die natürliche deutsche Wiedergabe.
- source_word: זִבְחֲכֶם
  choice: eures Schlachtopfers
  rationale: זֶבַח bezeichnet ein geschlachtetes Opfer. „Schlachtopfer“ bewahrt den kultischen und konkreten Sinn präziser als das allgemeinere „Opfer“.
- source_word: יֵאָכֵל
  choice: soll … gegessen werden
  rationale: Der Nifal-Imperfekt ist passiv; im rechtlichen Zusammenhang gibt „soll“ die verbindliche Vorschrift natürlich wieder.
- source_word: וּמִמָּחֳרָת
  choice: und am folgenden Tag
  rationale: מָחֳרָת bezeichnet den Folgetag. Die temporale Wendung wird im Deutschen idiomatisch mit „am folgenden Tag“ wiedergegeben.
- source_word: וְהַנּוֹתָר
  choice: Was aber … übrig bleibt
  rationale: Das substantivierte Partizip bezeichnet den verbleibenden Rest; „aber“ markiert den inhaltlichen Übergang zur gegensätzlichen Anweisung.
- source_word: עַד יוֹם הַשְּׁלִישִׁי
  choice: bis zum dritten Tag
  rationale: Die Wiedergabe erhält die durch עַד gesetzte zeitliche Grenze, ohne sie unnötig auszudeuten.
- source_word: בָּאֵשׁ
  choice: im Feuer
  rationale: Die Präposition בְּ mit אֵשׁ wird konkret und unmittelbar als „im Feuer“ wiedergegeben.
- source_word: יִשָּׂרֵף
  choice: soll … verbrannt werden
  rationale: Der Nifal-Imperfekt ist passiv und formuliert im gesetzlichen Kontext eine verbindliche Anweisung.
theological_decisions: []
