  source_fidelity: Die Übersetzung gibt den gerichtlichen Rahmen von בַּמִּשְׁפָּט, das Verbot jeder Rechtsbeugung sowie die beiden parallelen Verbote parteiischer Behandlung sachgerecht wieder. „den Armen begünstigen“ und „den Angesehenen bevorzugen“ geben die hebräischen Gesichtsidiome funktional und ohne unzulässige soziale Einengung wieder. „Gerecht sollst du über deinen Mitmenschen urteilen“ entspricht בְּצֶדֶק תִּשְׁפֹּט עֲמִיתֶךָ; der Plural-Singular-Wechsel folgt dem hebräischen Text.
