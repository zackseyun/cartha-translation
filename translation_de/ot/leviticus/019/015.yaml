source:
  edition: WLC
  text: לֹא תַעֲשׂ֥וּ עָ֨וֶל֙ בַּ/מִּשְׁפָּ֔ט לֹא תִשָּׂ֣א פְנֵי דָ֔ל וְ/לֹ֥א תֶהְדַּ֖ר פְּנֵ֣י גָד֑וֹל בְּ/צֶ֖דֶק תִּשְׁפֹּ֥ט עֲמִיתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/015.yaml
  text: You shall not commit injustice in judgment. You shall not show partiality to the poor, nor honor the face of the great; with righteousness you shall judge your neighbor.
translation:
  language: de
  text: Ihr sollt bei einem Rechtsentscheid kein Unrecht tun. Du sollst weder den Armen begünstigen noch den Angesehenen bevorzugen[b]. Gerecht[a] sollst du über deinen Mitmenschen urteilen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Nach Recht sollst du über deinen Mitmenschen urteilen.“'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich stehen hier die hebräischen Wendungen „das Gesicht des Armen erheben“ und „das Gesicht des Angesehenen ehren“. Gemeint ist in beiden Fällen eine parteiische Bevorzugung im Gericht.
    reason: cultural_note
lexical_decisions:
- source_word: עָוֶל בַּמִּשְׁפָּט
  choice: bei einem Rechtsentscheid kein Unrecht
  rationale: Die Wendung bezeichnet ungerechtes Handeln im Rahmen richterlicher Entscheidungsfindung. „Bei einem Rechtsentscheid“ macht den gerichtlichen Zusammenhang in natürlichem Deutsch deutlich.
- source_word: תִשָּׂא פְנֵי דָל
  choice: den Armen begünstigen
  rationale: Das hebräische Idiom „das Gesicht erheben“ bedeutet hier, jemandem aus Parteilichkeit einen Vorteil zu verschaffen. דָּל bezeichnet einen armen beziehungsweise sozial schwachen Menschen.
- source_word: תֶהְדַּר פְּנֵי גָדוֹל
  choice: den Angesehenen bevorzugen
  rationale: Die parallele Formulierung warnt vor ehrerbietiger Parteilichkeit gegenüber einer Person von hohem gesellschaftlichem Rang. „Angesehenen“ gibt den sozialen Status wieder, ohne ihn auf Reichtum oder politische Macht zu verengen.
- source_word: בְּצֶדֶק
  choice: gerecht
  rationale: צֶדֶק umfasst im Kontext sowohl moralische Richtigkeit als auch Recht und Gerechtigkeit. Das deutsche Adverb ist natürlich und bewahrt diese Verbindung.
- source_word: תִּשְׁפֹּט
  choice: sollst du … urteilen
  rationale: שׁפט bezeichnet hier das Fällen eines Urteils. Die Soll-Form gibt den verbindlichen Charakter der gesetzlichen Weisung wieder.
- source_word: עֲמִיתֶךָ
  choice: deinen Mitmenschen
  rationale: עָמִית bezeichnet den anderen als Mitglied der Gemeinschaft. „Mitmensch“ ist im heutigen Deutsch verständlich und vermeidet die mögliche Verengung von „Nächster“ auf räumliche Nähe.
theological_decisions:
- issue: Bedeutung von צֶדֶק im rechtlich-ethischen Zusammenhang
  choice: gerecht
  alternative: nach Recht / mit Gerechtigkeit
  rationale: Das hebräische Wort verbindet rechtliche Gerechtigkeit mit moralischer Rechtschaffenheit. „Gerecht“ lässt beide Aspekte offen; die Fußnote nennt die stärker rechtlich akzentuierte Wiedergabe.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Wechsel vom Plural im ersten Satz zum Singular in den folgenden Sätzen entspricht dem Hebräischen. Die idiomatischen Gesichtsausdrücke werden im Haupttext sinngemäß und in der Fußnote wörtlich wiedergegeben.
