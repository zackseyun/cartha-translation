  terminology: „Unrecht“, „Armen“, „Angesehenen“ und „gerecht“ sind treffende, registergerechte Entsprechungen. „Mitmenschen“ ist für עֲמִיתֶךָ eine natürliche allgemeine Wiedergabe eines Mitgehörigen/Fellow und legt keine konfessionelle oder engere soziale Deutung fest. Die Fußnote zu „Nach Recht“ bewahrt die juristisch akzentuierte Möglichkeit von בְּצֶדֶק.
