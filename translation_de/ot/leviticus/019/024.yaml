  text: But in the fourth year all its fruit shall be holy[a], for giving praise to Yahweh.
translation:
  language: de
  text: Doch im vierten Jahr soll seine ganze Frucht heilig sein, zum Lobpreis für Jahwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: »heilig, Lobpreisungen für Jahwe« oder: »heilig, zum Lobpreis für Jahwe«. Die seltene hebräische Wendung kann festliches Lob bezeichnen, das mit der Frucht dargebracht wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַשָּׁנָה הָרְבִיעִת
  choice: Doch im vierten Jahr
  rationale: Das ו markiert im Zusammenhang den Gegensatz zu den ersten drei Jahren; die Zeitangabe wird im Deutschen natürlich mit „im vierten Jahr“ wiedergegeben.
- source_word: יִהְיֶה
  choice: soll … sein
  rationale: In dieser gesetzlichen Anweisung gibt „soll“ den normativen Zukunftssinn idiomatisch wieder.
- source_word: כָּל פִּרְיוֹ
  choice: seine ganze Frucht
  rationale: כָּל bezeichnet die Gesamtheit des Ertrags; der maskuline Suffixbezug gilt dem zuvor genannten Baum.
- source_word: קֹדֶשׁ
  choice: heilig
  rationale: Das Substantiv steht prädikativ und bezeichnet die Frucht als für den heiligen Gebrauch ausgesondert.
- source_word: הִלּוּלִים
  choice: zum Lobpreis
  rationale: Das seltene, mit Lob und Jubel verbundene Wort wird ohne die nicht ausdrücklich vorhandene Kategorie „Opfergabe“ wiedergegeben.
- source_word: לַיהוָה
  choice: Jahwes
  rationale: Die Genitivfügung nach „zum Lobpreis“ drückt die auf Jahwe gerichtete beziehungsweise ihm geltende Widmung natürlich aus und gibt den Gottesnamen als Eigennamen wieder.
theological_decisions:
- issue: Seltene kultische Wendung קֹדֶשׁ הִלּוּלִים לַיהוָה
  choice: heilig …, zum Lobpreis Jahwes
  alternative: heilig, Lobpreisungen für Jahwe / heilig, um Jahwe zu preisen
  rationale: Die Übersetzung bewahrt den Zusammenhang von Heiligkeit und feierlichem Lob, ohne הִלּוּלִים ausdrücklich als Opfer zu bestimmen; die seltene und syntaktisch knappe Wendung bleibt in der Fußnote sichtbar.
- issue: Wiedergabe des Tetragramms יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der im hebräischen Text stehende persönliche Gottesname wird als solcher wiedergegeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Rechtssprache des Verses bleibt erhalten; die seltene Wendung wird lesbar formuliert, ihre Mehrdeutigkeit jedoch durch die Fußnote offengehalten.
