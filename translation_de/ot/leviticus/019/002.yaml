source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל כָּל עֲדַ֧ת בְּנֵי יִשְׂרָאֵ֛ל וְ/אָמַרְתָּ֥ אֲלֵ/הֶ֖ם קְדֹשִׁ֣ים תִּהְי֑וּ כִּ֣י קָד֔וֹשׁ אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/002.yaml
  text: Speak to all the congregation of the sons of Israel[a], and say to them, ‘You shall be holy, for I, Yahweh your God[b], am holy.’
translation:
  language: de
  text: 'Rede zur ganzen Gemeinschaft der Israeliten[a] und sag zu ihnen: »Ihr sollt heilig sein[b], denn ich, Jahwe, euer Gott, bin heilig.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zur ganzen Gemeinschaft der Söhne Israels“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Seid heilig“ oder „Ihr müsst heilig sein“.'
    reason: alternative_reading
lexical_decisions:
- source_word: דַּבֵּר
  choice: Rede
  rationale: Der Piel-Imperativ richtet einen unmittelbaren, feierlichen Redeauftrag an Mose; „Rede“ ist im gesetzlichen Kontext natürlich und quellennah.
- source_word: כָּל עֲדַת
  choice: zur ganzen Gemeinschaft
  rationale: עֵדָה bezeichnet hier die versammelte Bundesgemeinschaft. „Gemeinschaft“ ist im modernen Deutsch verständlich und bewahrt den kollektiven Sinn; כָּל wird mit „ganzen“ wiedergegeben.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: der Israeliten
  rationale: Die wörtliche Form lautet „Söhne Israels“, bezeichnet in dieser festen hebräischen Wendung jedoch das Volk Israel insgesamt. „Israeliten“ gibt den gemeinten Personenkreis im heutigen Deutsch natürlich wieder; die formale Alternative steht in der Fußnote.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: und sag zu ihnen
  rationale: Die geläufige Befehlsfolge wird direkt und idiomatisch wiedergegeben. „Sag“ vermeidet die im heutigen Deutsch unnötig steife Wiederholung von „rede“.
- source_word: קְדֹשִׁים תִּהְיוּ
  choice: Ihr sollt heilig sein
  rationale: Prädikatives Adjektiv mit Imperfekt trägt hier verpflichtende bzw. auffordernde Kraft. „Ihr sollt“ bewahrt den gesetzlich-bundestheologischen Ton, ohne die Form auf einen bloßen Imperativ festzulegen.
- source_word: קָדוֹשׁ
  choice: heilig
  rationale: „Heilig“ ist die sachlich und theologisch angemessene Wiedergabe; „abgesondert“ würde den Bedeutungsumfang unzulässig verengen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵיכֶם
  choice: euer Gott
  rationale: Die Anrede steht im Plural und gehört zur Bundesformel; „euer Gott“ ist die natürliche deutsche Entsprechung.
theological_decisions:
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל als Bezeichnung der Bundesgemeinschaft
  choice: Israeliten
  alternative: Söhne Israels
  rationale: Obwohl die hebräische Form wörtlich männlich und filial ist, dient sie idiomatisch als umfassende Volksbezeichnung. Der Haupttext gibt die gemeinte Gemeinschaft natürlich wieder; die formale Gestalt bleibt in der Fußnote sichtbar.
- issue: Modalität der Heiligkeitsaussage קְדֹשִׁים תִּהְיוּ
  choice: Ihr sollt heilig sein
  alternative: Seid heilig; Ihr werdet heilig sein; Ihr müsst heilig sein
  rationale: Die hebräische Imperfektform kann im Kontext als Gebot, Verpflichtung oder zukunftsgerichtete Aussage verstanden werden. „Ihr sollt“ wahrt den normativen Ton und lässt die formale Spannweite durch die Fußnote erkennen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer gesetzlicher Redeform. „Gemeinschaft der Israeliten“ ist verständlicher als das stärker kirchlich gefärbte „Gemeinde“, während die wörtlichere Form in der Fußnote erhalten bleibt. Der Gottesname wird als „Jahwe“ wiedergegeben.
