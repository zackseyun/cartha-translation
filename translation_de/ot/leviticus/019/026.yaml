base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/026.yaml
  text: You shall not eat over the blood[b][a]. You shall not practice divination or interpret omens.
translation:
  language: de
  text: Ihr sollt nicht über dem Blut essen.[a] Ihr sollt weder Wahrsagerei betreiben noch Zeichen deuten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit dem Blut“. Die hebräische Wendung ist schwierig; gemeint sein könnte, Fleisch zu essen, in dem noch Blut ist, oder an einer mit Blut verbundenen Ritualmahlzeit teilzunehmen.'
    reason: alternative_reading
  - marker: b
    text: Die genaue Bedeutung des hebräischen Verbs ist unsicher. Möglich sind auch „Wahrsagerei treiben“ oder, traditionell, „Zeiten beobachten“.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תֹאכְלוּ
  choice: Ihr dürft nicht essen
  rationale: Der negierte Imperfekt drückt im Rechtstext ein Verbot aus. „Ihr dürft nicht“ ist klares, modernes Deutsch und wahrt den verbindlichen Gesetzescharakter.
- source_word: עַל הַדָּם
  choice: über dem Blut
  rationale: Die hebräische Wendung ist schwierig und ihre konkrete Bedeutung umstritten. Die relativ formale Wiedergabe erhält die Präposition und legt die verbotene Praxis nicht vorschnell fest.
- source_word: תְנַחֲשׁוּ
  choice: Wahrsagerei betreiben
  rationale: Das Verb bezeichnet hier eine mantische Praxis. Die Formulierung ist im modernen Deutsch verständlich und vermeidet altertümliche oder zu enge Deutungen.
- source_word: תְעוֹנֵנוּ
  choice: Zeichen deuten
  rationale: Das Verb wird mit Omen- beziehungsweise Zeichendeutung oder Wahrsagerei verbunden. „Zeichen deuten“ gibt den wahrscheinlichen Sinn verständlich wieder, ohne die ältere, heute missverständliche Wiedergabe „Zeiten beobachten“ zu übernehmen.
theological_decisions:
- issue: Konkrete Bedeutung von עַל הַדָּם
  choice: Die relativ wörtliche Wendung „über dem Blut“ bleibt im Haupttext erhalten.
  alternative: „mit dem Blut“, „solange das Blut noch darin ist“ oder „bei einer mit Blut verbundenen Ritualmahlzeit“
  rationale: Der genaue Bezug des Verbots ist unsicher. Es kann um den Verzehr von Fleisch mit Blut, um eine blutbezogene Ritualmahlzeit oder um eine andere kultische Praxis gehen. Der Haupttext bewahrt diese Spannung; die Fußnote nennt mögliche Deutungen.
- issue: Abgrenzung der beiden mantischen Verben
  choice: תְנַחֲשׁוּ wird mit „Wahrsagerei betreiben“, תְעוֹנֵנוּ mit „Zeichen deuten“ wiedergegeben.
  alternative: Beide Verben mit weitgehend synonymen Ausdrücken wie „wahrsagen“ beziehungsweise „Orakel treiben“ wiedergeben.
  rationale: Die differenzierte Wiedergabe lässt erkennen, dass zwei Verben stehen, behauptet aber keine präzise technische Unterscheidung, die der hebräische Befund nicht sicher trägt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Formulierung „Ihr dürft nicht“ bildet die parallelen Verbote klar ab. Die schwer verständliche Wendung „über dem Blut“ wird wegen der echten textlichen Ungewissheit im Haupttext bewahrt und durch eine Fußnote erläutert.
