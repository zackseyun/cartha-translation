source:
  edition: WLC
  text: לֹא תֵלֵ֤ךְ רָכִיל֙ בְּ/עַמֶּ֔י/ךָ לֹ֥א תַעֲמֹ֖ד עַל דַּ֣ם רֵעֶ֑/ךָ אֲנִ֖י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/016.yaml
  text: You shall not go about as a slanderer among your people[a]. You shall not stand against the blood of your neighbor. I am Yahweh.
translation:
  language: de
  text: Du sollst nicht als Verleumder unter deinem Volk umhergehen. Du sollst nicht gegen das Leben deines Nächsten vorgehen.[a] Ich bin Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Du sollst nicht gegen das Blut deines Nächsten stehen.“ Oder: „Du sollst nicht untätig dabeistehen, wenn das Blut deines Nächsten vergossen wird.“'
    reason: alternative_reading
lexical_decisions:
- source_word: תֵלֵךְ רָכִיל
  choice: als Verleumder … umhergehen
  rationale: Die Verbindung bezeichnet das Umherziehen innerhalb der Gemeinschaft, um schädliche Berichte zu verbreiten. „Umhergehen“ bewahrt das hebräische Bewegungsbild; „Verleumder“ gibt den ernsten, schädigenden Charakter von רָכִיל wieder.
- source_word: בְּעַמֶּיךָ
  choice: unter deinem Volk
  rationale: Die Präposition ב bezeichnet hier das Handeln innerhalb der eigenen Gemeinschaft; „unter deinem Volk“ ist im Deutschen natürlich und nah am Hebräischen.
- source_word: תַעֲמֹד עַל
  choice: gegen … auftreten
  rationale: עמד bedeutet grundsätzlich „stehen“, während על hier mehrdeutig ist. „Gegen … auftreten“ gibt die mögliche feindliche oder gefährdende Handlung idiomatisch wieder, ohne das Bild durch eine weitgehende Paraphrase vollständig aufzulösen.
- source_word: דַּם
  choice: Blut
  rationale: „Blut“ bewahrt die konkrete hebräische Ausdrucksweise, die zugleich Leben und Blutvergießen bezeichnen kann.
- source_word: רֵעֶךָ
  choice: deines Nächsten
  rationale: רֵעַ bezeichnet hier den Mitmenschen beziehungsweise Angehörigen der Gemeinschaft. „Nächster“ ist die etablierte, würdige deutsche Wiedergabe in diesem ethischen Zusammenhang.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Deutung von לֹא תַעֲמֹד עַל דַּם רֵעֶךָ
  choice: Verbot, gegen das Blut beziehungsweise Leben des Nächsten aufzutreten
  alternative: Verbot, untätig dabeizustehen, wenn das Blut des Nächsten vergossen wird beziehungsweise sein Leben in Gefahr ist
  rationale: Die knappe hebräische Wendung lässt sowohl feindliches oder mitschuldiges Handeln als auch untätiges Zusehen zu. Der Haupttext bleibt mit „Blut“ nahe am Wortlaut und gibt die erste Möglichkeit wieder; die verbreitete zweite Deutung wird in der Fußnote ausdrücklich erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkrete Rede vom „Blut“ und die Mehrdeutigkeit der zweiten Verbotsformel bleiben erhalten; die alternative Deutung steht in einer klar markierten Fußnote.
