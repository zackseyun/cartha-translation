  source_fidelity: 'Der Text gibt die hebräische Erzählformel וַיְדַבֵּר יְהוָה אֶל־מֹשֶׁה לֵאמֹר vollständig und treffend wieder: „Und“ entspricht dem narrativen Waw, „sprach“ dem formelhaften דבר, „Jahwe“ dem Tetragramm, und „zu Mose“ dem Adressaten. Der Doppelpunkt überträgt die prospektive Funktion von לֵאמֹר idiomatisch, indem er die in V. 19,2 folgende direkte Rede eröffnet.'
  naturalness: „Und Jahwe sprach zu Mose:“ ist modernes, würdiges und in deutscher Bibelprosa natürliches Standarddeutsch. Der abschließende Doppelpunkt ist trotz des isolierten Verses angemessen, da die Satzrede unmittelbar im folgenden Vers fortgesetzt wird.
  terminology: „Jahwe“ bewahrt den Gottesnamen als Eigennamen und entspricht der englischen POB-Entscheidung „Yahweh“ in etablierter deutscher Schreibung. „Mose“ ist die standardsprachliche deutsche Namensform. Es sind keine zusätzlichen Fußnoten erforderlich; die Namensentscheidung ist in den Begleitdaten transparent dokumentiert.
