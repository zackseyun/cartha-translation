  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: de
  text: 'Und Jahwe sprach zu Mose:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: sprach
  rationale: Das Waw-Konsekutiv führt ein neues Redeereignis ein; „sprach“ gibt דבר in der feierlichen göttlichen Redeeinleitung natürlich und präzise wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name „Jahwe“ wiedergegeben und nicht durch den traditionellen Titel „der HERR“ ersetzt.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition kennzeichnet den Adressaten der Rede; „zu Mose sprechen“ ist die idiomatische deutsche Verbindung.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: „Mose“ ist die etablierte deutsche Form des hebräischen Personennamens.
- source_word: לֵאמֹר
  choice: ':'
  rationale: In dieser hebräischen Redeeinleitungsformel eröffnet לֵאמֹר die unmittelbar folgende wörtliche Rede. Im natürlichen Deutschen wird diese Funktion knapp durch einen Doppelpunkt ausgedrückt, statt sie redundant mit „und sagte“ wiederzugeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm יהוה. „Jahwe“ bewahrt den Charakter als Eigenname; „der HERR“ wäre eine traditionelle Ersatzlesung, „Jehova“ eine historisch entstandene Mischform.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die formelhafte hebräische Redeeinleitung wird natürlich wiedergegeben; der Doppelpunkt setzt voraus, dass der folgende Vers die angekündigte Rede fortführt.
