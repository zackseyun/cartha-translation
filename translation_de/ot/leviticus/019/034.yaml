  text: כְּ/אֶזְרָ֣ח מִ/כֶּם֩ יִהְיֶ֨ה לָ/כֶ֜ם הַ/גֵּ֣ר הַ/גָּ֣ר אִתְּ/כֶ֗ם וְ/אָהַבְתָּ֥ ל/וֹ֙ כָּמ֔וֹ/ךָ כִּֽי גֵרִ֥ים הֱיִיתֶ֖ם בְּ/אֶ֣רֶץ מִצְרָ֑יִם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/034.yaml
  text: The sojourner who sojourns with you shall be to you like a native among you[a], and you shall love him as yourself, for you were sojourners in the land of Egypt. I am Yahweh your God.
translation:
  language: de
  text: Der Fremde, der bei euch wohnt, soll euch wie ein Einheimischer aus eurer Mitte gelten[a]. Du sollst ihn lieben wie dich selbst, denn ihr seid Fremde im Land Ägypten gewesen. Ich bin Yahweh, euer Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mit „Fremder“ ist hier ein nicht einheimischer Mensch gemeint, der unter Israel wohnt; auch: „Beisasse“, „ansässiger Ausländer“ oder „Zugezogener“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּאֶזְרָח מִכֶּם
  choice: wie ein Einheimischer unter euch
  rationale: אֶזְרָח bezeichnet einen einheimischen Angehörigen der Gemeinschaft; die Formulierung bewahrt den mit כְּ ausgedrückten Vergleich und gibt מִכֶּם natürlich wieder.
- source_word: הַגֵּר הַגָּר אִתְּכֶם
  choice: Der Fremde, der bei euch wohnt
  rationale: גֵּר bezeichnet hier einen nicht einheimischen Menschen, der dauerhaft unter Israel lebt. Das Deutsche kann das hebräische Wortspiel zwischen Substantiv und Verb nicht natürlich nachbilden; „der bei euch wohnt“ gibt den Sinn des Partizips klar wieder.
- source_word: יִהְיֶה לָכֶם
  choice: soll euch … gelten
  rationale: Die Wendung beschreibt, wie Israel den Fremden ansehen und behandeln soll; „soll euch … gelten“ ist idiomatisch und erhält den normativen Charakter.
- source_word: וְאָהַבְתָּ לוֹ
  choice: Du sollst ihn lieben
  rationale: Der hebräische Text wechselt hier zur singularischen Anrede. Die Übersetzung bewahrt diesen Wechsel und den verbindlichen Gebotscharakter.
- source_word: כָּמוֹךָ
  choice: wie dich selbst
  rationale: Die feste Formulierung wahrt die sprachliche Verbindung zu Levitikus 19,18.
- source_word: כִּי גֵרִים הֱיִיתֶם
  choice: denn ihr seid Fremde … gewesen
  rationale: Die erneute Wiedergabe von גֵּר mit „Fremde“ erhält die Begründung des Gebots aus Israels eigener Erfahrung.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: im Land Ägypten
  rationale: Die vollständige biblische Ortsbezeichnung wird beibehalten.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname transliteriert und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵיכֶם
  choice: euer Gott
  rationale: Dies gibt die pluralische Anrede und die Bundesformel unmittelbar wieder.
theological_decisions:
- issue: Bedeutung von גֵּר im rechtlich-ethischen Zusammenhang
  choice: Fremder
  alternative: Beisasse; ansässiger Ausländer; Zugezogener
  rationale: Gemeint ist kein bloß durchreisender Unbekannter, sondern ein nicht einheimischer Bewohner unter Israel. „Fremder“ ist allgemein verständlich; eine Fußnote grenzt die Bedeutung ein, ohne moderne Rechtskategorien in den Text einzutragen.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: Jahwe; der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. Die Transliteration bewahrt ihn als Namen statt ihn durch einen Titel zu ersetzen.
- issue: Wechsel zwischen pluralischer und singularischer Anrede
  choice: euch / Du / ihr / euer
  alternative: durchgehend pluralische Anrede
  rationale: Der Wechsel ist im Hebräischen tatsächlich vorhanden und wird bewahrt, statt stilistisch eingeebnet zu werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Gebotsform „Du sollst“ bewahrt den biblisch-rechtlichen Ton, ohne altertümliche Satzstellung. Der auffällige Wechsel von pluralischer zu singularischer Anrede folgt dem hebräischen Text.
