id: LEV.19.3
reference: Leviticus 19:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אִ֣ישׁ אִמּ֤/וֹ וְ/אָבִי/ו֙ תִּירָ֔אוּ וְ/אֶת שַׁבְּתֹתַ֖/י תִּשְׁמֹ֑רוּ אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/003.yaml
  text: Each man shall fear his mother and his father[a], and you shall keep my Sabbaths[b]. I am Yahweh your God.
translation:
  language: de
  text: Jeder soll seine Mutter und seinen Vater fürchten[a], und meine Sabbate sollt ihr halten. Ich bin Jahwe, euer Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ehrfurcht haben vor“. Das hebräische Verb kann Furcht im Sinn von ehrfürchtiger Scheu bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: Jeder
  rationale: Das maskuline Singularwort wird distributiv auf die gesamte angesprochene Gemeinschaft bezogen. „Jeder“ bildet diese Funktion im natürlichen heutigen Deutsch ab, ohne den Geltungsbereich auf erwachsene Männer zu verengen.
- source_word: אִמּוֹ וְאָבִיו
  choice: seine Mutter und seinen Vater
  rationale: Die ausdrücklich genannten Verwandtschaftsbezeichnungen und die auffällige Reihenfolge Mutter–Vater bleiben erhalten.
- source_word: תִּירָאוּ
  choice: soll ... fürchten
  rationale: ירא umfasst Furcht, Ehrfurcht und Scheu. „Fürchten“ bewahrt die Stärke und die mögliche Spannung des hebräischen Ausdrucks; die Fußnote nennt die kontextuell mögliche Nuance.
- source_word: שַׁבְּתֹתַי
  choice: meine Sabbate
  rationale: Der Plural und das göttliche Possessiv werden unmittelbar bewahrt.
- source_word: תִּשְׁמֹרוּ
  choice: sollt ihr halten
  rationale: Bei Sabbaten bezeichnet שמר das sorgfältige Beachten beziehungsweise Einhalten. „halten“ ist im Deutschen idiomatisch und bleibt nahe am Bundeswortlaut.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵיכֶם
  choice: euer Gott
  rationale: In der Verbindung mit Jahwe bezeichnet אֱלֹהִים den einen Gott Israels; das Suffix richtet sich im Plural an die Gemeinschaft.
theological_decisions:
- issue: Bedeutungsbreite des Gebots gegenüber Mutter und Vater
  choice: fürchten
  alternative: Ehrfurcht haben vor / ehren
  rationale: Die direkte Wiedergabe „fürchten“ erhält die stärkere affektive und ethische Kraft von ירא. Die mögliche Bedeutung ehrfürchtiger Scheu wird erklärt, aber nicht an die Stelle der echten Bedeutungsbreite gesetzt.
- issue: Distributiver maskuliner Singular am Versanfang
  choice: Jeder
  alternative: Jeder Mann / Jede Person
  rationale: אִישׁ steht hier distributiv, während das folgende Verb und das Possessivsuffix die ganze Gemeinschaft im Plural ansprechen. „Jeder“ ist im Deutschen eine natürliche, formal maskuline distributive Form und vermeidet eine sachlich nicht geforderte Beschränkung auf Männer.
- issue: Wechsel vom Singular zum Plural
  choice: Jeder soll ... und ... sollt ihr
  alternative: Jeder soll ... und soll ...
  rationale: Der hebräische Numeruswechsel vom einzelnen Mitglied der Gemeinschaft zur Gemeinschaft als Ganzer bleibt sichtbar und wird nicht harmonisiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Reihenfolge „Mutter ... Vater“, der Plural „Sabbate“ und der Wechsel vom distributiven Singular zum gemeinschaftlichen Plural bleiben erhalten.
