source:
  edition: WLC
  text: אַל תִּפְנ֤וּ אֶל הָ/אֹבֹת֙ וְ/אֶל הַ/יִּדְּעֹנִ֔ים אַל תְּבַקְשׁ֖וּ לְ/טָמְאָ֣ה בָ/הֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/031.yaml
  text: Do not turn to mediums or to spiritists; do not seek them out[a], to become unclean by them. I am Yahweh your God.
translation:
  language: de
  text: Wendet euch nicht an Totenbeschwörer oder Wahrsager; sucht sie nicht auf[a], sodass ihr durch sie unrein werdet. Ich bin Jahwe, euer Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräischen Bezeichnungen können auch als „Totenmedien“ und „Geisterkundige“ wiedergegeben werden. Sie beziehen sich auf verbotene Praktizierende, die mit der Befragung von Geistern oder Toten verbunden waren; besonders das erste Wort kann auch den beschworenen Totengeist selbst bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְנוּ
  choice: wendet euch … an
  rationale: פנה bedeutet wörtlich „sich wenden“. Mit „sich an jemanden wenden“ wird im Deutschen zugleich der Zusammenhang einer beabsichtigten Befragung natürlich ausgedrückt, ohne bereits ausdrücklich „befragen“ zu übersetzen.
- source_word: הָאֹבֹת
  choice: Totenbeschwörer
  rationale: אוֹב kann in diesem Rechtskontext den beschworenen Totengeist oder die Person bezeichnen, die Tote beziehungsweise Geister befragt. Da die parallele Personenbezeichnung und die pluralischen Pronomen hier Praktizierende nahelegen, ist „Totenbeschwörer“ eine verständliche Wiedergabe; die sachliche Unschärfe wird in der Fußnote kenntlich gemacht.
- source_word: הַיִּדְּעֹנִים
  choice: Wahrsager
  rationale: יִדְּעֹנִי bezeichnet jemanden, der mit verbotener Geisterkenntnis oder Geisterbefragung verbunden ist. „Wahrsager“ ist gegenwärtiges, verständliches Deutsch, bleibt jedoch weiter als der hebräische Ausdruck; deshalb erläutert die Fußnote den Geisterbezug.
- source_word: תְּבַקְשׁוּ
  choice: sucht sie nicht auf
  rationale: בקש bedeutet „suchen“. „Aufsuchen“ gibt im Deutschen idiomatisch das gezielte Suchen nach solchen Personen wieder, ohne das spezifischere „befragen“ in den Text einzutragen.
- source_word: לְטָמְאָה בָהֶם
  choice: sodass ihr durch sie unrein werdet
  rationale: Der Infinitiv von טמא kann hier Zweck oder Folge ausdrücken. „Sodass“ gibt den Ergebnissinn natürlich wieder, während „unrein“ die in Levitikus mögliche rituelle und moralische Dimension offenhält.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵיכֶם
  choice: euer Gott
  rationale: Die Form bezeichnet Gott in der Beziehung zur angesprochenen Gemeinschaft und steht in der zweiten Person Plural.
theological_decisions:
- issue: Art der Unreinheit
  choice: Die Aussage bleibt beim umfassenden „unrein werden“.
  alternative: „rituell unrein werden“ oder „sich moralisch verunreinigen“
  rationale: טמא kann im Kontext des Levitikus rituelle und moralische Aspekte tragen. Die Übersetzung legt sich nicht ausschließlich auf eine dieser Dimensionen fest.
- issue: Bezug der okkulten Bezeichnungen
  choice: Im Haupttext werden beide Ausdrücke als Bezeichnungen für verbotene Praktizierende wiedergegeben.
  alternative: Die Wörter als Totengeister beziehungsweise vertraute Geister auffassen.
  rationale: Der Parallelismus, das Aufsuchen und das pluralische „durch sie“ begünstigen hier den Personenbezug, doch die lexikalische Ambiguität besonders von אוֹב bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Verbote bleiben erhalten. „Wahrsager“ dient der allgemeinen Verständlichkeit; die Fußnote präzisiert den im Hebräischen vorhandenen Geisterbezug und bewahrt die lexikalische Mehrdeutigkeit.
