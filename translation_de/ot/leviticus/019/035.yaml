base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/035.yaml
  text: You shall not commit injustice in judgment[a], in measures of length, weight, or volume.
translation:
  language: de
  text: Ihr sollt kein Unrecht tun beim Rechtsprechen, bei Längenmaß, Gewicht oder Hohlmaß[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ihr sollt kein Unrecht tun beim Urteilen, bei Maß, Gewicht oder Hohlmaß.“'
    reason: 'Lexikalische und syntaktische Alternative: מִשְׁפָּט kann allgemein „Urteilen“ beziehungsweise „Recht“ bezeichnen, und מִדָּה kann ohne nähere Bestimmung mit „Maß“ wiedergegeben werden.'
lexical_decisions:
- source_word: לֹא תַעֲשׂוּ
  choice: Ihr sollt nicht begehen
  rationale: Die Verneinung mit der 2. Person Plural formuliert ein Verbot. „Ihr sollt nicht“ bewahrt den rechtlichen Ton; „begehen“ verbindet sich im Deutschen natürlich mit „Unrecht“.
- source_word: עָוֶל
  choice: Unrecht
  rationale: Das Wort bezeichnet Unrecht, Ungerechtigkeit oder unlauteres Handeln. „Unrecht“ ist prägnant und umfasst hier sowohl richterliche als auch geschäftliche Verfehlungen.
- source_word: בַּמִּשְׁפָּט
  choice: beim Rechtsprechen
  rationale: מִשְׁפָּט kann Recht, Urteil oder Rechtsprechung bezeichnen. „Beim Rechtsprechen“ gibt die gerichtliche Bedeutung idiomatisch wieder, ohne den umfassenderen Sinn als einzig mögliche Deutung auszugeben.
- source_word: בַּמִּדָּה
  choice: beim Messen von Länge
  rationale: מִדָּה ist ein Maß beziehungsweise eine Messung und bezeichnet neben Gewicht und Hohlmaß hier wahrscheinlich das Längenmaß. Die Formulierung macht die drei Messkategorien im modernen Deutsch verständlich.
- source_word: בַּמִּשְׁקָל
  choice: Gewicht
  rationale: מִשְׁקָל bezeichnet Gewicht oder Wiegen. „Gewicht“ ist im Zusammenhang mit Handelsmaßen direkt und verständlich.
- source_word: וּבַמְּשׂוּרָה
  choice: Rauminhalt
  rationale: מְשׂוּרָה bezeichnet ein Hohl- beziehungsweise Fassungsmaß. „Rauminhalt“ ist ein verständlicher moderner Oberbegriff, der weder nur Flüssigkeiten noch nur trockene Waren voraussetzt.
theological_decisions:
- issue: Reichweite von בַּמִּשְׁפָּט
  choice: beim Rechtsprechen
  alternative: bei der Rechtspflege / beim Beurteilen
  rationale: Der Kontext geht unmittelbar zu Maßen und Gewichten über, während מִשְׁפָּט auch enger gerichtliches Urteilen bezeichnen kann. Die Hauptübersetzung wahrt diesen konkreten Sinn; die Fußnote hält die breitere syntaktische und lexikalische Möglichkeit offen.
translation_notes:
  register: Moderner, würdiger Gesetzesstil mit der traditionellen und weiterhin verständlichen Verbotsform „Ihr sollt nicht“. Fachlich unnötige Archaismen werden vermieden; die drei Messbereiche werden für heutige Leser ausdrücklich benannt.
