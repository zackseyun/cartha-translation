base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/036.yaml
  text: You shall have honest scales[a], honest weights, an honest ephah, and an honest hin. I am Yahweh your God[c][b], who brought you out of the land of Egypt.
translation:
  language: de
  text: Ihr sollt gerechte Waagen[a], gerechte Gewichtssteine, ein gerechtes Efa[b] und ein gerechtes Hin[c] haben. Ich bin Jahwe, euer Gott, der euch aus dem Land Ägypten herausgeführt hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „ehrliche Waagen, ehrliche Gewichtssteine“. Das viermal verwendete hebräische Wort צֶדֶק bedeutet häufig „Gerechtigkeit“ oder „Recht“ und wird hier auf Waagen, Gewichtssteine und Maße bezogen.'
    reason: lexical_alternative
  - marker: b
    text: Ein Efa war ein antikes Hohlmaß für trockene Güter.
    reason: cultural_note
  - marker: c
    text: Ein Hin war ein antikes Flüssigkeitsmaß.
    reason: cultural_note
lexical_decisions:
- source_word: מֹאזְנֵי צֶדֶק
  choice: ehrliche Waagen
  rationale: מֹאזְנַיִם bezeichnet Waagen zum Abwiegen; צֶדֶק fordert hier im Handelsverkehr Übereinstimmung mit Recht und Gerechtigkeit. „Ehrliche Waagen“ ist im modernen Deutschen verständlich und bewahrt die ethische, nicht nur technische Forderung.
- source_word: אַבְנֵי צֶדֶק
  choice: ehrliche Gewichtssteine
  rationale: אַבְנֵי bedeutet wörtlich „Steine“ und meint die beim Wiegen verwendeten Gewichtssteine. Die konkrete Sachkultur bleibt damit sichtbar; „ehrliche“ gibt das wiederholte צֶדֶק einheitlich wieder.
- source_word: אֵיפַת צֶדֶק
  choice: ein ehrliches Efa
  rationale: אֵיפָה ist ein antikes Hohlmaß für trockene Güter. Die Transliteration „Efa“ vermeidet eine ungenaue Umrechnung und erhält die vierfache Wiederholung derselben ethischen Bestimmung.
- source_word: וְהִין צֶדֶק
  choice: und ein ehrliches Hin
  rationale: הִין bezeichnet ein antikes Flüssigkeitsmaß. „Hin“ bewahrt die historische Maßeinheit; „ehrliches“ führt die bewusste Wiederholung von צֶדֶק fort.
- source_word: יִהְיֶה לָכֶם
  choice: sollt ... haben
  rationale: Wörtlich steht „soll für euch sein“. Die deutsche Gesetzesformulierung „ihr sollt ... haben“ gibt Verpflichtung und Besitz natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵיכֶם
  choice: euer Gott
  rationale: Im Bundesbekenntnis mit יהוה ist die Form eindeutig singularisch zu verstehen.
- source_word: הוֹצֵאתִי אֶתְכֶם מֵאֶרֶץ מִצְרַיִם
  choice: der euch aus dem Land Ägypten herausgeführt hat
  rationale: Die Formulierung gibt die Exoduserinnerung natürlich wieder und bewahrt sie als Begründung des Gebots.
theological_decisions:
- issue: Wiedergabe des viermal wiederholten צֶדֶק im Zusammenhang von Handel und Maßwesen
  choice: ehrlich
  alternative: gerecht; richtig; genau
  rationale: „Ehrlich“ verbindet sachliche Korrektheit mit der im Wort liegenden ethischen Forderung und klingt bei Waagen, Gewichten und Maßen im Deutschen verständlicher als „gerecht“. Die konsequente Wiederholung bewahrt den Nachdruck des Hebräischen.
- issue: Wiedergabe antiker Maßeinheiten
  choice: Efa und Hin beibehalten
  alternative: Trockenmaß und Flüssigkeitsmaß; Umrechnung in moderne Einheiten
  rationale: Die historischen Einheiten werden nicht durch ungenaue moderne Entsprechungen ersetzt. Fußnoten erklären ihre jeweilige Funktion, ohne eine im Vers nicht nötige exakte Umrechnung vorzugeben.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Gesetzesstil. Die vierfache Wiederholung von „ehrlich“ bildet den Nachdruck und die Parallelstruktur des hebräischen Textes ab. „Gewichtssteine“ erhält gegenüber dem allgemeineren „Gewichte“ die konkrete historische Bildwelt.
