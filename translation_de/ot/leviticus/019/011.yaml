id: LEV.19.11
reference: Leviticus 19:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לֹ֖א תִּגְנֹ֑בוּ וְ/לֹא תְכַחֲשׁ֥וּ וְ/לֹֽא תְשַׁקְּר֖וּ אִ֥ישׁ בַּ/עֲמִיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/011.yaml
  text: You shall not steal[a], and you shall not deal falsely, and you shall not lie to one another.
translation:
  language: de
  text: Ihr sollt nicht stehlen, nicht betrügen und einander nicht belügen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּגְנֹבוּ
  choice: ihr sollt nicht stehlen
  rationale: Der Qal-Imperfekt 2. Person Plural mit לֹא formuliert im Rechts- und Weisungskontext ein Verbot. »Stehlen« gibt die Grundbedeutung von גנב direkt und natürlich wieder.
- source_word: תְכַחֲשׁוּ
  choice: nicht betrügen
  rationale: Der Piel von כחש kann falsches Leugnen, Täuschen oder treuloses Handeln bezeichnen. »Betrügen« wahrt hier den breiten zwischenmenschlichen Sinn, ohne die Handlung ausschließlich auf eine mündliche Leugnung einzuengen.
- source_word: תְשַׁקְּרוּ
  choice: einander nicht belügen
  rationale: Der Piel von שקר bezeichnet hier falsches Reden beziehungsweise Lügen. »Belügen« verbindet das Verb im Deutschen natürlich mit dem ausdrücklich genannten zwischenmenschlichen Gegenüber.
- source_word: אִישׁ בַּעֲמִיתוֹ
  choice: einander
  rationale: Wörtlich steht eine distributive Wendung wie »einer gegenüber seinem Mitmenschen«. Im Kontext drückt sie eine wechselseitige Beziehung aus; »einander« gibt dies in modernem Deutsch knapp und geschlechtsübergreifend wieder.
- source_word: עֲמִית
  choice: im Ausdruck »einander« wiedergegeben
  rationale: עמית bezeichnet einen Mitmenschen, Gefährten oder Angehörigen derselben Gemeinschaft. Zusammen mit אִישׁ lässt sich die Wendung idiomatisch als »einander« wiedergeben.
theological_decisions:
- issue: Generisch maskuline distributiv-reziproke Wendung אִישׁ ... עֲמִיתוֹ
  choice: im Haupttext geschlechtsübergreifend mit »einander« wiedergegeben
  alternative: »jeder seinen Nächsten« oder »einer seinen Mitmenschen«
  rationale: Die grammatisch maskuline Form beschränkt das Verbot nicht auf Männer. »Einander« bewahrt den allgemeinen, wechselseitigen Geltungsbereich, ohne eine nicht beabsichtigte geschlechtliche Einschränkung einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die drei parallelen Verbote werden knapp koordiniert; das wiederholte hebräische וְלֹא wird durch die natürliche deutsche Reihung mit wiederholtem »nicht« abgebildet.
