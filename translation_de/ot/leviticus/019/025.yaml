id: LEV.19.25
reference: Leviticus 19:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/בַ/שָּׁנָ֣ה הַ/חֲמִישִׁ֗ת תֹּֽאכְלוּ֙ אֶת פִּרְי֔/וֹ לְ/הוֹסִ֥יף לָ/כֶ֖ם תְּבוּאָת֑/וֹ אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/025.yaml
  text: And in the fifth year you may eat its fruit, so that it may increase its produce for you. I am Yahweh your God.
translation:
  language: de
  text: Und im fünften Jahr dürft ihr seine Früchte essen, damit sein Ertrag für euch zunimmt. Ich bin Jahwe, euer Gott.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַשָּׁנָה הַחֲמִישִׁת
  choice: Und im fünften Jahr
  rationale: Die Verbindung aus וּ und בַּ führt die rechtliche Anweisung in zeitlicher Folge weiter. „Und im“ bildet diesen Anschluss natürlich und ohne unnötig starken Gegensatz ab.
- source_word: תֹּאכְלוּ
  choice: dürft ihr … essen
  rationale: Das Imperfekt der 2. Person Plural hat nach dem zuvor geltenden Verbot erlaubenden Sinn. „Dürft“ gibt diese rechtliche Erlaubnis im modernen Deutsch klar wieder.
- source_word: אֶת־פִּרְיוֹ
  choice: seine Früchte
  rationale: פְּרִי bezeichnet hier die essbaren Früchte des Baumes. Der maskuline Singularsuffix wird mit „seine“ auf den Baum bezogen; der deutsche Plural „Früchte“ ist in diesem Zusammenhang idiomatisch.
- source_word: לְהוֹסִיף לָכֶם תְּבוּאָתוֹ
  choice: damit sein Ertrag für euch zunimmt
  rationale: Der mit לְ gebildete Infinitiv bezeichnet Zweck beziehungsweise erwartetes Ergebnis. „Ertrag“ unterscheidet תְּבוּאָה passend von den zuvor genannten Früchten; die Formulierung bewahrt den im Hebräischen ausgedrückten Zusammenhang zwischen der Anweisung und zunehmendem Ertrag.
- source_word: אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: Ich bin Jahwe, euer Gott
  rationale: Die feierliche Bundesformel wird knapp und unmittelbar wiedergegeben. Der Gottesname יְהוָה erscheint als „Jahwe“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Sinn der Zweckangabe לְהוֹסִיף לָכֶם תְּבוּאָתוֹ
  choice: damit sein Ertrag für euch zunimmt
  alternative: um euch seinen Ertrag zu vermehren
  rationale: Die gewählte Fassung lässt den Ertrag als grammatisch und sachlich naheliegendes Bezugswort der Zunahme erscheinen, ohne daraus eine über den Text hinausgehende mechanische Verheißung abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer rechtlicher Erlaubnisformulierung. Die Satzstruktur bleibt eng am Hebräischen, ohne im Deutschen hölzern zu wirken.
