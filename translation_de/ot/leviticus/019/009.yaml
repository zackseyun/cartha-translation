  text: וּֽ/בְ/קֻצְרְ/כֶם֙ אֶת קְצִ֣יר אַרְצְ/כֶ֔ם לֹ֧א תְכַלֶּ֛ה פְּאַ֥ת שָׂדְ/ךָ֖ לִ/קְצֹ֑ר וְ/לֶ֥קֶט קְצִֽירְ/ךָ֖ לֹ֥א תְלַקֵּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/009.yaml
  text: When you reap the harvest of your land[a], you shall not completely reap the edge of your field, and you shall not gather the gleanings of your harvest.
translation:
  language: de
  text: Wenn ihr die Ernte eures Landes einbringt, soll jeder von euch den Rand seines Feldes nicht vollständig abernten[a] und die Nachlese seiner Ernte nicht einsammeln.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Ecke seines Feldes nicht vollständig abernten“. Das hebräische Wort kann Rand, Seite oder Ecke bezeichnen; gemeint ist hier der äußere Teil des Feldes, der nicht abgeerntet werden soll.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְקֻצְרְכֶם
  choice: Wenn ihr … einbringt
  rationale: Die Präposition mit dem Infinitiv von קצר bezeichnet den zeitlichen Umstand. „Wenn ihr … einbringt“ ist im Deutschen natürlich; der Plural des hebräischen Suffixes bleibt erhalten.
- source_word: קְצִיר אַרְצְכֶם
  choice: die Ernte eures Landes
  rationale: קְצִיר bezeichnet hier die Ernte beziehungsweise den Ernteertrag, אֶרֶץ das landwirtschaftlich genutzte Land.
- source_word: לֹא תְכַלֶּה … לִקְצֹר
  choice: sollst du … nicht vollständig abernten
  rationale: Das Piel von כלה bedeutet „vollenden, vollständig ausführen“; zusammen mit לִקְצֹר wird das vollständige Abernten untersagt. Der Wechsel vom Plural zum Singular im Hebräischen wird bewahrt.
- source_word: פְּאַת שָׂדְךָ
  choice: den Rand deines Feldes
  rationale: פֵּאָה kann Rand, Seite oder Ecke bezeichnen. „Rand“ gibt den äußeren Teil des Feldes in diesem Erntegesetz verständlich wieder, ohne die Bedeutung unnötig auf eine Ecke zu verengen.
- source_word: לֶקֶט קְצִירְךָ
  choice: die Nachlese deiner Ernte
  rationale: לֶקֶט bezeichnet liegen gebliebene oder verstreute Ernte, die nach dem eigentlichen Ernten aufgelesen wird. „Nachlese“ ist der präzise, geläufige deutsche Fachausdruck.
- source_word: לֹא תְלַקֵּט
  choice: nicht einsammeln
  rationale: לקט bedeutet hier „auflesen, einsammeln“. „Einsammeln“ ist klar und vermeidet eine unbeholfene Wiederholung von „Nachlese“.
theological_decisions:
- issue: Wechsel der Anrede vom Plural zum Singular
  choice: „Wenn ihr … sollst du …“
  alternative: durchgehend „ihr sollt“ oder durchgehend „du sollst“
  rationale: Der hebräische Text wechselt bewusst von der Gemeinschaft im Plural zu jedem einzelnen Landbesitzer im Singular. Die Übersetzung bewahrt diese auffällige Spannung, statt sie stillschweigend zu glätten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit rechtlichem Aufforderungscharakter. Der Wechsel zwischen pluralischer und singularischer Anrede entspricht dem hebräischen Text. „Nachlese“ bewahrt den landwirtschaftlichen Fachsinn.
