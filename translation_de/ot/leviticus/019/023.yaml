  text: וְ/כִי תָבֹ֣אוּ אֶל הָ/אָ֗רֶץ וּ/נְטַעְתֶּם֙ כָּל עֵ֣ץ מַאֲכָ֔ל וַ/עֲרַלְתֶּ֥ם עָרְלָת֖/וֹ אֶת פִּרְי֑/וֹ שָׁלֹ֣שׁ שָׁנִ֗ים יִהְיֶ֥ה לָ/כֶ֛ם עֲרֵלִ֖ים לֹ֥א יֵאָכֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/023.yaml
  text: When you come into the land and plant any kind of tree for food[a], you shall regard its fruit as uncircumcised. For three years it shall be forbidden to you; it shall not be eaten.
translation:
  language: de
  text: Wenn ihr in das Land kommt und Bäume pflanzt, die essbare Früchte tragen, sollt ihr ihre Früchte als unbeschnitten ansehen.[a] Drei Jahre lang sollen sie für euch unbeschnitten sein; sie dürfen nicht gegessen werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch verwendet hier bildlich die Wortfamilie »unbeschnitten/Unbeschnittenheit« für die Frucht. Gemeint sind Früchte, die in den ersten drei Jahren nicht gegessen werden dürfen.
    reason: Die Fußnote erläutert die ungewöhnliche hebräische Metapher und ihre rechtliche Bedeutung, ohne sie im Haupttext auf »verboten« zu reduzieren.
lexical_decisions:
- source_word: וְכִי תָבֹאוּ אֶל־הָאָרֶץ
  choice: Wenn ihr in das Land kommt
  rationale: וְכִי leitet hier in einem Rechtstext einen künftigen Fall ein. »Wenn« ist im Deutschen natürlich; »das Land« bewahrt den bestimmten Bundesland-Bezug, ohne den im Vers nicht genannten Namen Kanaan einzutragen.
- source_word: וּנְטַעְתֶּם כָּל־עֵץ מַאֲכָל
  choice: und irgendwelche Bäume zur Nahrung pflanzt
  rationale: כָּל hat hier distributiven Sinn und עֵץ מַאֲכָל bezeichnet Bäume, deren Ertrag als Nahrung dient. Die Formulierung ist verständlich und schließt verschiedene Arten von Nahrungs- beziehungsweise Obstbäumen ein.
- source_word: וַעֲרַלְתֶּם עָרְלָתוֹ אֶת־פִּרְיוֹ
  choice: sollt ihr ihre Früchte als unbeschnitten ansehen
  rationale: Die Wortgruppe verwendet עָרְלָה metaphorisch und weist den Früchten einen rechtlich-kultischen Status zu. »Als unbeschnitten ansehen« erhält dieses auffällige Bild, statt es lediglich mit seiner Folge »verboten« wiederzugeben.
- source_word: שָׁלֹשׁ שָׁנִים יִהְיֶה לָכֶם עֲרֵלִים
  choice: Drei Jahre lang sollen sie für euch unbeschnitten sein
  rationale: Die vorangestellte Zeitangabe bewahrt die hebräische Hervorhebung. Der deutsche Plural »sie« bezieht sich eindeutig auf die Früchte und gibt den pluralischen Prädikatsausdruck עֲרֵלִים wieder.
- source_word: לֹא יֵאָכֵל
  choice: sie dürfen nicht gegessen werden
  rationale: Die passive Form wird passiv wiedergegeben. »Dürfen nicht« drückt in natürlichem deutschem Rechtsstil das Verbot aus, ohne einen ausdrücklich genannten Handelnden hinzuzufügen.
theological_decisions:
- issue: Soll das Bild der »unbeschnittenen« Früchte erhalten oder durch »verboten« ersetzt werden?
  choice: Das Bild »unbeschnitten« im Haupttext bewahren
  alternative: »verboten« oder »noch nicht zum Verzehr freigegeben«
  rationale: Der hebräische Text gebraucht bewusst die Wortfamilie ערל/ערלה. Eine rein funktionale Wiedergabe als »verboten« würde zwar die praktische Rechtsfolge ausdrücken, aber die bundes- und kultsprachliche Metapher tilgen. Die Fußnote erläutert deshalb ihre Bedeutung, ohne sie im Haupttext aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede steht entsprechend dem Hebräischen im Plural. Das ungewöhnliche Bild »unbeschnitten« bleibt wegen seiner Bedeutung und Wiederholung sichtbar; die unmittelbar folgende Verbotsklausel und die Fußnote sichern die Verständlichkeit.
