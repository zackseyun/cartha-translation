source:
  edition: WLC
  text: וְ/אִ֛ם הֵאָכֹ֥ל יֵאָכֵ֖ל בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֑י פִּגּ֥וּל ה֖וּא לֹ֥א יֵרָצֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/007.yaml
  text: But if it is eaten at all on the third day[a], it is a defiled thing; it will not be accepted.
translation:
  language: de
  text: Wenn es aber am dritten Tag doch gegessen wird, ist es etwas Verwerfliches[a]; es wird nicht angenommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „etwas Widerwärtiges“ oder „etwas Verdorbenes“. Das hebräische Wort bezeichnet hier Opferfleisch, das dadurch unannehmbar wird, dass man es nach Ablauf der erlaubten Zeit isst.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Wenn es aber
  rationale: Die Verbindung leitet eine Bedingung ein, die im Gegensatz zur vorausgehenden Anweisung steht; die Nachstellung von „aber“ entspricht natürlichem modernem Deutsch.
- source_word: הֵאָכֹל יֵאָכֵל
  choice: doch gegessen wird
  rationale: Der Infinitivus absolutus verstärkt die finite Verbform. „doch“ gibt diese nachdrückliche Warnung idiomatisch wieder, ohne ein zusätzliches Bedeutungsmerkmal einzuführen.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: am dritten Tag
  rationale: Dies ist die natürliche und genaue deutsche Wiedergabe der Zeitangabe.
- source_word: פִּגּוּל
  choice: etwas Verwerfliches
  rationale: Das Wort bezeichnet im Opferzusammenhang etwas Anstößiges und kultisch Unannehmbares. „Verwerflich“ bewahrt die wertende Kraft, ohne lediglich körperlichen Verderb oder einen anderen festgelegten hebräischen Tabubegriff zu unterstellen.
- source_word: הוּא
  choice: ist es
  rationale: Das Pronomen steht in einem Nominalsatz und wird im Deutschen mit der Kopula wiedergegeben.
- source_word: לֹא יֵרָצֶה
  choice: es wird nicht angenommen werden
  rationale: Das Nifal von רצה bezeichnet im Opferkontext, dass etwas keine Annahme findet. Die passive Form bewahrt dabei die im Hebräischen nicht ausdrücklich genannte Instanz der Annahme.
theological_decisions:
- issue: Kultischer Status des am dritten Tag gegessenen Opferfleisches
  choice: Das Fleisch gilt aufgrund der Überschreitung der erlaubten Zeit als verwerflich und wird nicht angenommen.
  alternative: Das Fleisch ist lediglich körperlich verdorben; oder es ist ein „Gräuel“ im umfassenden Sinn anderer schwerer Tabubegriffe.
  rationale: Der unmittelbare Opferkontext und der Schlusssatz über die Nichtannahme weisen auf kultische Unannehmbarkeit. Die Wiedergabe vermeidet sowohl eine Verengung auf natürlichen Verderb als auch eine Übersteigerung zu einer umfassenden moralisch-metaphysischen Kategorie.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die passive Aussage „es wird nicht angenommen werden“ lässt wie der hebräische Text unausgesprochen, wer die Annahme verweigert. Der Fußnotenmarker steht unmittelbar bei der lexikalisch erklärten Wendung.
