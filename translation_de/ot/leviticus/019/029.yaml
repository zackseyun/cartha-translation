  text: אַל תְּחַלֵּ֥ל אֶֽת בִּתְּ/ךָ֖ לְ/הַזְנוֹתָ֑/הּ וְ/לֹא תִזְנֶ֣ה הָ/אָ֔רֶץ וּ/מָלְאָ֥ה הָ/אָ֖רֶץ זִמָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/029.yaml
  text: Do not profane your daughter by making her a prostitute[c][b][a], lest the land become prostituted and the land be filled with depravity.
translation:
  language: de
  text: Entweihe deine Tochter nicht, indem du sie zur Prostitution preisgibst,[a] damit das Land nicht der Prostitution verfällt[b] und das Land voller Schandtaten wird.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „indem du sie prostituierst“ beziehungsweise „indem du sie Prostitution treiben lässt“. Das hebräische Verb steht in einer kausativen Form.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „damit das Land nicht Prostitution treibt“. Das Land steht bildhaft für die Gemeinschaft, die dadurch verdorben wird.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Schändlichkeit“, „Verderbtheit“. Das hebräische Wort bezeichnet empörend verwerfliches Verhalten, häufig im sexuellen Bereich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחַלֵּל
  choice: entweihe
  rationale: Das Piel von חלל bezeichnet hier das Preisgeben an das Profane. „Entweihen“ bewahrt den für Levitikus wichtigen Gegensatz von heilig und profan und ist im Deutschen natürlicher als „profanieren“.
- source_word: בִּתְּךָ
  choice: deine Tochter
  rationale: Direkte Wiedergabe des singularischen Verwandtschaftsbegriffs mit Suffix der 2. Person maskulin Singular.
- source_word: לְהַזְנוֹתָהּ
  choice: indem du sie zur Prostitution zwingst
  rationale: Der Hifil-Infinitiv von זנה mit Suffix der 3. Person feminin Singular hat kausative Bedeutung. „Zur Prostitution zwingen“ macht deutlich, dass der Vater sie dazu bringt bzw. sie dafür preisgibt, ohne das Verb lediglich intransitiv wiederzugeben.
- source_word: תִזְנֶה הָאָרֶץ
  choice: das Land der Prostitution verfällt
  rationale: Die Wendung erhält das Bild der Prostitution, formuliert die Personifikation des Landes jedoch in verständlichem, gegenwärtigem Deutsch.
- source_word: וּמָלְאָה הָאָרֶץ
  choice: und voller … wird
  rationale: Das Qal-Perfekt mit waw beschreibt hier die drohende Folge. Die deutsche Konstruktion schließt natürlich an „damit … nicht“ an.
- source_word: זִמָּה
  choice: Schandtat
  rationale: זִמָּה bezeichnet schändliches, planvoll verwerfliches Verhalten, in Levitikus häufig mit sexuellem Bezug. „Schandtat“ erhält die starke moralische Wertung, ohne den Ausdruck ausschließlich auf Sexualität einzuengen.
theological_decisions:
- issue: Wiedergabe des Bildes, dass das Land „Prostitution treibt“
  choice: Das Bild bleibt mit „das Land der Prostitution verfällt“ erhalten.
  alternative: das Land treibe Prostitution; das Land werde sittenlos
  rationale: Die Personifikation verbindet das konkrete Verbot mit der Verderbnis der ganzen Gemeinschaft. Eine rein abstrakte Wiedergabe als „sittenlos werden“ würde die rhetorische Verbindung zu זנה abschwächen.
- issue: Wiedergabe von חלל im Heiligkeitskontext
  choice: „entweihen“
  alternative: entehren; beflecken; profanieren
  rationale: „Entweihen“ bewahrt die Heilig-profan-Terminologie des Buches und bezeichnet mehr als eine bloße Kränkung der Ehre.
- issue: Reichweite von זִמָּה
  choice: „Schandtat“ mit erläuternder Fußnote
  alternative: Schändlichkeit; Unzucht; Verderbtheit
  rationale: Der Ausdruck ist stark moralisch und oft sexuell geprägt, kann aber breiter als ein einzelnes Sexualdelikt sein. Die Übersetzung lässt diese Spannweite bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Entweihen“ hält den kultisch-ethischen Heiligkeitswortschatz des Kontexts fest. Die ungewöhnliche Metapher des Landes wird nicht eingeebnet; Fußnoten weisen die wörtlichere Form und die lexikalische Spannweite aus.
