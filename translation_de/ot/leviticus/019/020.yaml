  source_fidelity: 'Die zentralen Rechtsbegriffe sind überwiegend quellentreu wiedergegeben: „Sklavin“, „für einen Mann bestimmt“, die fehlende Auslösung bzw. Freilassung und der Plural der nicht zu vollstreckenden Todesstrafe entsprechen dem Hebräischen. Die Deutung von בִּקֹּרֶת als „Untersuchung“ bleibt wegen der unsicheren Bedeutung vertretbar, sofern die Fußnote die möglichen Bedeutungen wahrt. Die Formulierung „sodass es zum Samenerguss kommt“ legt jedoch eine im Hebräischen nicht ausgedrückte Folgerungsbeziehung nahe.'
