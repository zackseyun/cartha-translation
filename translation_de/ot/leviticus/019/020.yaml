source:
  edition: WLC
  text: וְ֠/אִישׁ כִּֽי יִשְׁכַּ֨ב אֶת אִשָּׁ֜ה שִׁכְבַת זֶ֗רַע וְ/הִ֤וא שִׁפְחָה֙ נֶחֱרֶ֣פֶת לְ/אִ֔ישׁ וְ/הָפְדֵּה֙ לֹ֣א נִפְדָּ֔תָה א֥וֹ חֻפְשָׁ֖ה לֹ֣א נִתַּן לָ֑/הּ בִּקֹּ֧רֶת תִּהְיֶ֛ה לֹ֥א יוּמְת֖וּ כִּי לֹ֥א חֻפָּֽשָׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/020.yaml
  text: If a man lies with a woman and has an emission of semen[a], and she is a servant woman designated for a man, but she has not been redeemed or given her freedom, there shall be an inquiry; they shall not be put to death[b], because she had not been freed.
translation:
  language: de
  text: Wenn ein Mann mit einer Frau schläft und dabei Samen ergießt und sie eine Sklavin ist, die für einen Mann bestimmt ist[a], aber nicht losgekauft worden ist und ihre Freiheit nicht erhalten hat, soll eine Untersuchung stattfinden[b]. Sie sollen nicht hingerichtet werden, weil sie nicht freigelassen worden ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „die mit einem Mann verlobt ist“ oder „die einem Mann versprochen ist“. Das Hebräische bezeichnet wahrscheinlich eine einem Mann zugeordnete oder versprochene Sklavin, deren Rechtsstatus jedoch nicht dem einer freien Ehefrau entspricht.'
    reason: lexical_alternative
  - marker: b
    text: Das hier verwendete hebräische Wort ist selten und in seiner Bedeutung unsicher. Es kann auch eine „Bestrafung“ oder „Entschädigung“ bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: ein Mann
  rationale: Die männliche Einzelfigur ist im kasuistischen Rechtstext ausdrücklich bezeichnet.
- source_word: יִשְׁכַּב אֶת אִשָּׁה שִׁכְבַת זֶרַע
  choice: mit einer Frau schläft, sodass es zum Samenerguss kommt
  rationale: Die Wiedergabe bewahrt sowohl den sexuellen Sinn des Verbs als auch die rechtlich bedeutsame ausdrückliche Erwähnung des Samenergusses.
- source_word: שִׁפְחָה
  choice: Sklavin
  rationale: Der unfreie Rechtsstatus ist für die Bestimmung entscheidend und darf nicht durch das mildere Wort „Dienerin“ abgeschwächt werden.
- source_word: נֶחֱרֶפֶת לְאִישׁ
  choice: für einen Mann bestimmt
  rationale: Die seltene Form bezeichnet wahrscheinlich eine Zuordnung oder Zusage an einen Mann, ohne eindeutig den vollen Rechtsstatus einer freien Verlobten auszudrücken.
- source_word: וְהָפְדֵּה לֹא נִפְדָּתָה
  choice: sie ist nicht losgekauft worden
  rationale: „Loskaufen“ gibt den rechtlich-wirtschaftlichen Vorgang im Zusammenhang der Sklaverei verständlich wieder; die hebräische Verstärkung unterstreicht, dass er nicht vollzogen wurde.
- source_word: חֻפְשָׁה לֹא נִתַּן לָהּ
  choice: hat ihre Freiheit nicht erhalten
  rationale: Die natürliche deutsche Formulierung bezeichnet die nicht erfolgte Freilassung aus dem Sklavenstand.
- source_word: בִּקֹּרֶת
  choice: eine Untersuchung
  rationale: Das seltene und umstrittene Wort kann eine amtliche Prüfung bezeichnen. Die konkrete Deutung als Strafe oder Entschädigung wird nicht in den Haupttext hineingelesen.
- source_word: לֹא יוּמְתוּ
  choice: sie sollen nicht getötet werden
  rationale: Der Plural bezieht sich am naheliegendsten auf beide Beteiligten; die passive Form hat im Rechtszusammenhang gerichtlichen Sinn.
- source_word: כִּי לֹא חֻפָּשָׁה
  choice: denn sie war nicht freigelassen
  rationale: Die Begründung knüpft ausdrücklich an den fortbestehenden unfreien Status der Frau an.
theological_decisions:
- issue: Rechtsstatus der נֶחֱרֶפֶת לְאִישׁ
  choice: für einen Mann bestimmt
  alternative: mit einem Mann verlobt; einem Mann versprochen
  rationale: Die Formulierung wahrt eine verbindliche Zuordnung, setzt sie aber nicht ohne Weiteres mit der förmlichen Verlobung einer freien Frau gleich.
- issue: Bedeutung von בִּקֹּרֶת
  choice: eine Untersuchung soll stattfinden
  alternative: es soll eine Bestrafung oder Entschädigung geben
  rationale: Da das nur hier belegte Substantiv in seiner Bedeutung unsicher ist, bleibt der Haupttext zurückhaltend und nennt die wichtigeren Alternativen in einer Fußnote.
- issue: Bezugsgröße des Plurals לֹא יוּמְתוּ
  choice: beide Beteiligten werden nicht getötet
  alternative: unbestimmter beziehungsweise verallgemeinernder Plural
  rationale: Der grammatische Plural legt beide Beteiligten nahe, ohne die im Text vorhandene rechtliche Spannung weiter aufzulösen.
translation_notes:
  register: Moderner, würdiger Standarddeutsch-Stil mit klarer juristischer Satzführung. „Sklavin“ bewahrt den sozialen und rechtlichen Status; „Samenerguss“ gibt die ausdrückliche körperliche Einzelheit sachlich wieder. Die seltenen Rechtsbegriffe werden im Haupttext nicht überpräzisiert, sondern durch Fußnoten erläutert.
