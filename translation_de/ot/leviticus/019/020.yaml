  terminology: „Sklavin“ und „losgekauft“ bewahren den maßgeblichen unfreien und wirtschaftlich-rechtlichen Status. „Für einen Mann bestimmt“ ist für נֶחֱרֶפֶת vorsichtig und angemessen; die Alternativen in Fußnote a schützen die bestehende lexikalische Unsicherheit. Die Fußnote zu בִּקֹּרֶת ist sachlich und ausreichend zurückhaltend.
