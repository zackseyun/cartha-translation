revisions:
- from: Ihr sollt meine Satzungen einhalten. Du sollst deine Nutztiere nicht mit Tieren einer anderen Art paaren; dein Feld sollst du nicht mit zweierlei Saat besäen; und ein Kleid aus Mischgewebe[a], Schaatnes, soll nicht auf deinen Leib kommen.
  to: Ihr sollt meine Satzungen einhalten. Dein Vieh sollst du nicht mit einer anderen Art paaren; dein Feld sollst du nicht mit zweierlei Saat besäen; ein Kleidungsstück aus Mischgewebe[a], Schaatnes, sollst du nicht tragen.
  rationale: Die Überarbeitung ersetzt die zu enge moderne Bedeutung von „Kleid“ durch „Kleidungsstück“, glättet die Tierformulierung und gibt die abschließende hebräische Tragewendung idiomatisch wieder. Die Fußnote bewahrt die Unsicherheit des seltenen Fachbegriffs und nennt die traditionelle Deutung ohne sie dem hebräischen Ausdruck selbst gleichzusetzen.
