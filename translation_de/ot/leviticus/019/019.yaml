  text: אֶֽת חֻקֹּתַ/י֮ תִּשְׁמֹרוּ֒ בְּהֶמְתְּ/ךָ֙ לֹא תַרְבִּ֣יעַ כִּלְאַ֔יִם שָׂדְ/ךָ֖ לֹא תִזְרַ֣ע כִּלְאָ֑יִם וּ/בֶ֤גֶד כִּלְאַ֨יִם֙ שַֽׁעַטְנֵ֔ז לֹ֥א יַעֲלֶ֖ה עָלֶֽי/ךָ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/019.yaml
  text: You shall keep my statutes. You shall not breed your livestock with two different kinds; you shall not sow your field with two kinds of seed; and a garment of mixed material[a], shaatnez, shall not come upon you.
translation:
  language: de
  text: Ihr sollt meine Satzungen einhalten. Dein Vieh sollst du nicht mit einer anderen Art paaren; dein Feld sollst du nicht mit zweierlei Saat besäen; ein Kleidungsstück aus Mischgewebe[a], Schaatnes, sollst du nicht tragen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort Schaatnes ist ein Fachbegriff für ein Mischgewebe; seine genaue Zusammensetzung ist unsicher. Traditionell wird darunter eine Mischung aus Wolle und Leinen verstanden; vergleiche 5. Mose 22,11.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֻקֹּתַי
  choice: meine Satzungen
  rationale: חֻקָּה bezeichnet verbindliche, festgesetzte Vorschriften. „Satzungen“ bewahrt den rechtlichen Klang und ist im biblischen Deutsch verständlich.
- source_word: תִּשְׁמֹרוּ
  choice: sollt ... einhalten
  rationale: שׁמר bedeutet im Rechts- und Bundeskontext Vorschriften bewahren beziehungsweise befolgen; „einhalten“ ist im modernen Deutsch natürlich.
- source_word: בְּהֶמְתְּךָ
  choice: deine Nutztiere
  rationale: בְּהֵמָה meint hier domestizierte Tiere allgemein, nicht nur Rinder.
- source_word: תַרְבִּיעַ
  choice: paaren
  rationale: Der Hifil von רבע bezeichnet hier das Veranlassen der Paarung von Tieren. „Paaren“ gibt den Vorgang präzise wieder, ohne moderne Zuchtbegriffe einzutragen.
- source_word: כִּלְאַיִם
  choice: mit Tieren einer anderen Art
  rationale: Im Tiergebot bezeichnet כִּלְאַיִם eine Verbindung unterschiedlicher Arten. Die Formulierung macht die relationale Konstruktion im Deutschen verständlich.
- source_word: שָׂדְךָ לֹא תִזְרַע כִּלְאָיִם
  choice: dein Feld sollst du nicht mit zweierlei Saat besäen
  rationale: „Saat“ ergänzt aus dem Vorgang des Säens das im Deutschen erforderliche Bezugswort; „zweierlei“ bewahrt den Gedanken verschiedenartiger Mischung.
- source_word: בֶגֶד כִּלְאַיִם
  choice: ein Kleid aus Mischgewebe
  rationale: בֶּגֶד ist ein Kleidungsstück; im textilen Zusammenhang bezeichnet כִּלְאַיִם gemischtes Material. „Mischgewebe“ ist knapp und verständlich.
- source_word: שַׁעַטְנֵז
  choice: Schaatnes
  rationale: Das seltene technische Wort wird eingedeutscht transliteriert, da seine genaue Bedeutung aus diesem Vers allein nicht sicher hervorgeht; die Fußnote erläutert die traditionelle Bestimmung.
- source_word: יַעֲלֶה עָלֶיךָ
  choice: soll nicht auf deinen Leib kommen
  rationale: Die Wendung bedeutet wörtlich, dass das Kleid nicht „auf dich hinaufkommen“ soll. „Auf deinen Leib kommen“ bewahrt das anschauliche Bild und bezeichnet verständlich das Anlegen beziehungsweise Tragen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit rechtlichem Grundton. Der Wechsel vom pluralischen „Ihr sollt“ im Einleitungssatz zum singularischen „Du sollst“ in den Einzelgeboten folgt dem hebräischen Numeruswechsel. Das seltene Fachwort שַׁעַטְנֵז bleibt als „Schaatnes“ sichtbar und wird nicht stillschweigend auf Wolle und Leinen verengt.
