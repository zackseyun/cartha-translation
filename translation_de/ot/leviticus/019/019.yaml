    issue: „Kleid“ ist als Wiedergabe von בֶּגֶד zu eng.
    rationale: Im modernen Deutsch bezeichnet „Kleid“ normalerweise ein bestimmtes Kleidungsstück, während בֶּגֶד allgemein ein Kleidungsstück bzw. Kleidung meint.
  - severity: medium
    issue: „… soll nicht auf deinen Leib kommen“ ist unidiomatisch.
    rationale: Die wörtlichkeitsnahe Formulierung wirkt im modernen Standarddeutsch künstlich. Das idiomatische „nicht tragen“ gibt die hier gemeinte Wirkung von יַעֲלֶה עָלֶיךָ wieder.
  - severity: low
