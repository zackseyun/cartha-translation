    rationale: Das verbindende וְ bedeutet primär „und“. Zwar kann der Kontext die Gottesfurcht als Gegenakzent zu heimlicher Ausnutzung Schutzbedürftiger erkennen lassen, doch „vielmehr“ macht diesen Gegensatz im deutschen Haupttext stärker und exklusiver, als die Syntax verlangt. Eine einfache koordinierende Wiedergabe bewahrt die Aussage und ihre Begründungsfunktion ohne Zusatz.
