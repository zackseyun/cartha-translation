id: LEV.19.14
reference: Leviticus 19:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לֹא תְקַלֵּ֣ל חֵרֵ֔שׁ וְ/לִ/פְנֵ֣י עִוֵּ֔ר לֹ֥א תִתֵּ֖ן מִכְשֹׁ֑ל וְ/יָרֵ֥אתָ מֵּ/אֱלֹהֶ֖י/ךָ אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/014.yaml
  text: 'You shall not curse a deaf man[a], and before a blind man you shall not put a stumbling block; but you shall fear your God: I am Yahweh.'
translation:
  language: de
  text: Du sollst einen Gehörlosen[a] nicht verfluchen und einem Blinden kein Hindernis in den Weg legen; du sollst deinen Gott fürchten. Ich bin Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen Tauben“. Das Hebräische verwendet hier und bei „einem Blinden“ maskuline Singularformen als repräsentative Rechtsfälle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְקַלֵּל
  choice: verfluchen
  rationale: Das Piel von קלל kann Fluchen oder verächtliches Beschimpfen bezeichnen. „Verfluchen“ gibt die unmittelbare verbale und moralische Kraft des Verbots wieder.
- source_word: חֵרֵשׁ
  choice: einen Gehörlosen
  rationale: Das substantivierte Adjektiv steht im Hebräischen maskulin singular und dient als repräsentativer Rechtsfall. Die deutsche Form wahrt diese Gestalt.
- source_word: לִפְנֵי עִוֵּר ... תִתֵּן מִכְשֹׁל
  choice: einem Blinden ... ein Hindernis in den Weg legen
  rationale: Die idiomatische deutsche Wendung bildet den räumlichen Sinn von לִפְנֵי und das Bild eines zum Straucheln bringenden Gegenstands natürlich ab.
- source_word: וְיָרֵאתָ
  choice: Fürchte vielmehr
  rationale: Das Waw leitet hier die positive, begründende Gegenforderung ein. „Vielmehr“ macht den ethischen Gegensatz deutlich, ohne einen zusätzlichen Gedanken einzutragen.
- source_word: מֵאֱלֹהֶיךָ
  choice: deinen Gott
  rationale: Die Präposition מן kennzeichnet bei ירא idiomatisch das Objekt der Furcht; im Deutschen steht daher kein entsprechendes „vor/von“ bei der gewählten Konstruktion.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird transliteriert und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Repräsentative maskuline Formen im Fallrecht
  choice: „einen Gehörlosen“ und „einem Blinden“
  alternative: „einen gehörlosen Menschen“ und „einem blinden Menschen“ beziehungsweise „die Gehörlosen“ und „die Blinden“
  rationale: Die hebräischen maskulinen Singularformen werden als konkrete repräsentative Rechtsfälle bewahrt; die allgemeine ethische Reichweite des Gebots bleibt bestehen und wird in der Fußnote erläutert.
- issue: Funktion der Aufforderung zur Gottesfurcht
  choice: „Fürchte vielmehr deinen Gott“
  alternative: „Und du sollst deinen Gott fürchten“
  rationale: Die Formulierung bewahrt den Gegensatz zwischen einer möglicherweise unbeobachteten Misshandlung schutzbedürftiger Menschen und der Verantwortung vor Gott. Zugleich bleibt die positive Aufforderung des Hebräischen erhalten.
- issue: Wörtliches oder erweitertes Verständnis von מִכְשֹׁל
  choice: Konkretes „Hindernis“ im Weg
  alternative: Übertragene Ausweitung auf jede Irreführung oder Benachteiligung
  rationale: Der Ausgangstext zeichnet zunächst ein konkretes Bild. Seine breitere ethische Bedeutung wird nicht ausgeschlossen, aber auch nicht als alleinige Bedeutung in den Haupttext eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gehörloser“ ist die heute respektvolle und gut verständliche Hauptform; „Tauber“ wird als näher am traditionellen Wortlaut liegende Alternative genannt. Die beiden Verbote werden koordiniert wiedergegeben, die abschließende Gottesrede knapp und feierlich.
