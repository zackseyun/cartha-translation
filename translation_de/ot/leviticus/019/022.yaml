  text: וְ/כִפֶּר֩ עָלָ֨י/ו הַ/כֹּהֵ֜ן בְּ/אֵ֤יל הָֽ/אָשָׁם֙ לִ/פְנֵ֣י יְהוָ֔ה עַל חַטָּאת֖/וֹ אֲשֶׁ֣ר חָטָ֑א וְ/נִסְלַ֣ח ל֔/וֹ מֵ/חַטָּאת֖/וֹ אֲשֶׁ֥ר חָטָֽא־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/022.yaml
  text: And the priest shall make atonement for him before Yahweh with the ram of the guilt offering for the sin that he committed[a], and he shall be forgiven for the sin that he committed.
translation:
  language: de
  text: Und der Priester soll für ihn mit dem Widder des Schuldopfers[a] vor Jahwe Sühne erwirken für die Sünde, die er begangen hat. Und ihm wird die Sünde vergeben werden, die er begangen hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit dem Widder des Wiedergutmachungsopfers“. Das hebräische Wort אָשָׁם kann sowohl Schuld als auch den ausgleichenden beziehungsweise wiedergutmachenden Aspekt dieses Opfers bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר
  choice: soll … Sühne erwirken
  rationale: כפר bezeichnet im priesterlich-kultischen Zusammenhang die rituelle Sühnehandlung des Priesters. „Sühne erwirken“ ist im Deutschen verständlich und wahrt, dass der Priester die kultische Handlung vollzieht, ohne selbst als letzter Urheber der Vergebung dargestellt zu werden.
- source_word: עָלָיו
  choice: für ihn
  rationale: Bei כפר bezeichnet על hier die Person, zu deren Gunsten die Sühnehandlung geschieht.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Entspricht der bestimmten Form und bezeichnet den amtierenden Kultdiener.
- source_word: בְּאֵיל הָאָשָׁם
  choice: mit dem Widder des Schuldopfers
  rationale: Das instrumentale ב wird mit „mit“ wiedergegeben; אַיִל bezeichnet ausdrücklich einen Widder. אָשָׁם ist die traditionelle Bezeichnung des Schuldopfers, umfasst jedoch auch dessen Wiedergutmachungsaspekt, der in der Fußnote kenntlich gemacht wird.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: Die Wendung bewahrt die kultische Vorstellung vom Handeln in Gottes Gegenwart; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: für die Sünde, die er begangen hat
  rationale: Die hebräische Wortwiederholung wird in natürlichem Deutsch wiedergegeben, ohne den Bezug auf die konkrete Verfehlung abzuschwächen.
- source_word: וְנִסְלַח לוֹ
  choice: Dann wird ihm … vergeben werden
  rationale: Das Niphal wird passiv übersetzt. Dadurch bleibt der im Hebräischen nicht ausdrücklich genannte, aber vorausgesetzte göttliche Urheber der Vergebung unausgesprochen.
- source_word: מֵחַטָּאתוֹ אֲשֶׁר חָטָא
  choice: ihm die Sünde vergeben werden, die er begangen hat
  rationale: Die deutsche Konstruktion „jemandem eine Sünde vergeben“ gibt die hebräische Vergebungsformel idiomatisch wieder; ein wörtliches „von seiner Sünde“ wäre missverständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ macht den Bundesnamen als Namen sichtbar, statt ihn durch einen Titel zu ersetzen.
- issue: Unausgesprochener Urheber der Vergebung
  choice: Passivform ohne ausdrückliches Subjekt
  alternative: Jahwe wird ihm vergeben
  rationale: Das hebräische וְנִסְלַח לוֹ nennt den Handelnden nicht ausdrücklich. Die Passivform wahrt diese sprachliche und theologische Zurückhaltung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am hebräischen Ablauf, wird aber durch „Dann“ lesbar gegliedert. Die Wiederholung „die er begangen hat“ wurde als bewusste Entsprechung der hebräischen Wiederholung beibehalten.
