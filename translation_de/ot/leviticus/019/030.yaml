  text: אֶת שַׁבְּתֹתַ֣/י תִּשְׁמֹ֔רוּ וּ/מִקְדָּשִׁ֖/י תִּירָ֑אוּ אֲנִ֖י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/030.yaml
  text: You shall keep my Sabbaths and revere my sanctuary[a]; I am Yahweh.
translation:
  language: de
  text: Haltet meine Sabbate und habt Ehrfurcht vor meinem Heiligtum.[a] Ich bin Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „fürchtet mein Heiligtum“. Das hebräische Verb kann sowohl „fürchten“ als auch „Ehrfurcht haben“ bedeuten; hier geht es um heilige Scheu und Achtung vor Jahwes geheiligtem Ort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבְּתֹתַי
  choice: meine Sabbate
  rationale: Der ausdrückliche Plural bezeichnet die von Jahwe angeordneten Sabbatzeiten; „Sabbate“ bewahrt Form und Bundesbezug des Hebräischen.
- source_word: תִּשְׁמֹרוּ
  choice: Haltet
  rationale: שׁמר bedeutet hier „halten, beachten, einhalten“. Der Imperativ gibt die verpflichtende Aussage der hebräischen Verbform im deutschen Rechtstext natürlich wieder.
- source_word: מִקְדָּשִׁי
  choice: mein Heiligtum
  rationale: מִקְדָּשׁ bezeichnet einen geheiligten Ort. „Heiligtum“ ist präzise und legt sich weder unnötig auf Stiftszelt noch Tempel fest.
- source_word: תִּירָאוּ
  choice: habt Ehrfurcht vor
  rationale: ירא kann Furcht oder Ehrfurcht ausdrücken. Beim Heiligtum bezeichnet es hier angemessene heilige Scheu; die Formulierung bleibt ernst, ohne bloße Angst nahezulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Bundesname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich das Tetragramm; „Jahwe“ bewahrt den persönlichen Namen statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von ירא in Bezug auf das Heiligtum
  choice: habt Ehrfurcht vor meinem Heiligtum
  alternative: fürchtet mein Heiligtum
  rationale: Das Verb lässt sowohl „fürchten“ als auch „Ehrfurcht haben“ zu. Im kultischen Zusammenhang bezeichnet es die heilige Scheu und Achtung gegenüber Gottes Heiligtum; die Fußnote bewahrt die wörtlichere Alternative.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der knappe gesetzliche Parallelismus bleibt erhalten; „Sabbate“ bewahrt den hebräischen Plural, und „Heiligtum“ vermeidet eine unbelegte Festlegung auf Stiftszelt oder Tempel.
