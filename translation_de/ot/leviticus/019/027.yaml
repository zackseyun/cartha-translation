base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/027.yaml
  text: You shall not round off the hair at the sides of your head[c][b][a], and you shall not mar the edges of your beard.
translation:
  language: de
  text: Ihr sollt das Haar an den Seiten eures Kopfes nicht rund abschneiden[a] und den Rand eures Bartes nicht entstellen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: »den Rand eures Kopfes nicht abrunden«. Gemeint ist wahrscheinlich ein rundes Abschneiden oder Abrasieren der Haare an den Seiten des Kopfes.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »nicht zerstören«, »nicht beschädigen«. Der hebräische Ausdruck legt nicht fest, auf welche Weise der Bartrand beeinträchtigt wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַקִּפוּ
  choice: rund abschneiden
  rationale: Das Hifil von נקף bezeichnet hier ein rundes Abschneiden beziehungsweise Abrunden des Kopfhaars. Die Formulierung gibt die konkrete Handlung wieder, ohne eine bestimmte Technik wie vollständiges Rasieren festzulegen.
- source_word: פְּאַת רֹאשְׁכֶם
  choice: das Haar an den Seiten eures Kopfes
  rationale: פֵּאָה kann Rand, Seite oder Ecke bedeuten. Im Zusammenhang mit dem Kopf macht die Wiedergabe deutlich, dass das seitliche Kopfhaar gemeint ist; der deutsche distributive Singular ist bei der Anrede einer Gruppe natürlich.
- source_word: תַשְׁחִית
  choice: verstümmeln
  rationale: Das Hifil von שׁחת bedeutet verderben, zerstören oder entstellen. Bei einem Bart bezeichnet „verstümmeln“ eine schädigende Veränderung, ohne die genaue Art des Schneidens über den Wortlaut hinaus festzulegen.
- source_word: פְּאַת זְקָנֶךָ
  choice: den Rand eures Bartes
  rationale: פֵּאָה wird auch hier in seiner Grundbedeutung „Rand“ wiedergegeben. Der Wechsel der hebräischen Suffixe von Plural zu Singular wird im Deutschen durch den distributiven Singular innerhalb der gemeinschaftlichen Anrede verständlich ausgedrückt.
- source_word: לֹא ... וְלֹא
  choice: Ihr sollt nicht ... und ... nicht
  rationale: Diese Form wahrt den verbindlichen Charakter der beiden Verbote und klingt zugleich in modernem deutschem Gesetzesstil natürlich.
theological_decisions:
- issue: Art und möglicher Hintergrund des Verbots
  choice: Der Haupttext nennt zwei konkrete Eingriffe an Kopfhaar und Bart, ohne ihren kultischen oder kulturellen Zweck zu erklären.
  alternative: Das Verbot ausdrücklich als Abgrenzung von heidnischen Trauer- oder Kultbräuchen formulieren.
  rationale: Der Vers selbst nennt kein Motiv. Eine kultische Deutung im Haupttext würde eine mögliche historische Erklärung zur ausdrücklichen Aussage des hebräischen Wortlauts machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlicher gemeinschaftlicher Anrede. Die konkrete Bildsprache des Hebräischen bleibt erhalten; mögliche kultische Hintergründe werden nicht in den Haupttext eingetragen.
