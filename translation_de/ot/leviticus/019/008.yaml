source:
  edition: WLC
  text: וְ/אֹֽכְלָי/ו֙ עֲוֺנ֣/וֹ יִשָּׂ֔א כִּֽי אֶת קֹ֥דֶשׁ יְהוָ֖ה חִלֵּ֑ל וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵ/עַמֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/008.yaml
  text: Whoever eats it shall bear his iniquity[a], because he has profaned the holy thing of Yahweh[d][c][b], and that person shall be cut off from his people.
translation:
  language: de
  text: Wer davon isst, wird seine Schuld tragen[a], denn er hat das Jahwe Geweihte entweiht[b]. Diese Person soll aus ihrem Volk abgeschnitten werden[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Wendung kann bedeuten, die eigene Schuld und deren Folgen tragen zu müssen.
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist das, was Jahwe geweiht ist, hier das Opferfleisch.
    reason: cultural_note
  - marker: c
    text: Die hebräische Formel lautet wörtlich „aus ihrem Volk abgeschnitten werden“. Sie lässt hier offen, ob Tod, Ausschluss aus der Gemeinschaft oder unmittelbares göttliches Gericht gemeint ist.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֹכְלָיו
  choice: Wer davon isst
  rationale: Das substantivierte Partizip mit Suffix bezeichnet allgemein jeden, der von dem im vorigen Vers genannten Opferfleisch isst. „Davon“ stellt den Kontextbezug im Deutschen natürlich her.
- source_word: עֲוֺנוֹ יִשָּׂא
  choice: muss seine Schuld tragen
  rationale: Die hebräische Wendung umfasst sowohl die Schuldhaftigkeit als auch deren Folgen. Die deutsche Formulierung bewahrt dieses Bedeutungsfeld, ohne ausschließlich „Strafe“ einzusetzen.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung für die angedrohte Folge ein; „denn“ verbindet die Satzteile in gehobenem, aber gegenwärtigem Deutsch.
- source_word: קֹדֶשׁ יְהוָה
  choice: was Jahwe heilig ist
  rationale: Die Formulierung gibt das Jahwe Geweihte wieder, ohne den im unmittelbaren Satz nicht ausdrücklich genannten Begriff „Opfergabe“ einzufügen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname Gottes wird als „Jahwe“ wiedergegeben.
- source_word: חִלֵּל
  choice: hat entweiht
  rationale: Das Piel bezeichnet hier, dass etwas Heiliges wie etwas Gewöhnliches behandelt wird. „Entweihen“ ist im Deutschen klar und angemessen gewichtig.
- source_word: וְנִכְרְתָה
  choice: soll ... ausgeschlossen werden
  rationale: „Ausgeschlossen werden“ gibt die Bundesstrafformel verständlich wieder, ohne festzulegen, ob Tod, Entfernung aus der Gemeinschaft oder unmittelbares göttliches Gericht gemeint ist.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: Dieser Mensch
  rationale: נֶפֶשׁ bezeichnet in diesem Rechtskontext die ganze Person, nicht eine von ihr getrennte „Seele“.
- source_word: מֵעַמֶּיהָ
  choice: aus seinem Volk
  rationale: Das feminine Suffix stimmt grammatisch mit נֶפֶשׁ überein; sachlich bezieht es sich auf die betreffende Person. „Seinem Volk“ entspricht dem generischen Singular im Deutschen.
theological_decisions:
- issue: Bedeutung der Strafformel וְנִכְרְתָה
  choice: Die Formel wird mit „soll aus seinem Volk ausgeschlossen werden“ wiedergegeben, ohne die Art der Strafe näher festzulegen.
  alternative: „soll getötet werden“, „soll aus der Gemeinschaft ausgestoßen werden“ oder „soll durch Gottes Gericht beseitigt werden“
  rationale: Der Vers nennt den Mechanismus der Strafe nicht eindeutig. Die Übersetzung bewahrt diese rechtliche und theologische Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die jurisch-theologische Wendung „Schuld tragen“ bleibt erhalten; die schwer verständliche wörtliche Rede vom „Abschneiden“ wird im Haupttext verständlich wiedergegeben und in der Fußnote dokumentiert.
