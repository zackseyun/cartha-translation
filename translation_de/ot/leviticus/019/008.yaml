  terminology: „Schuld tragen“ und „entweihen“ geben die hebräischen Rechts- und Kultbegriffe angemessen wieder. „Jahwe“ entspricht der vorgegebenen Namenswahl. Die Formel „abgeschnitten werden“ soll im Haupttext stehen bleiben; die Fußnote kann ihre umstrittene Bedeutung erläutern.
