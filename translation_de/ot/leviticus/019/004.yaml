id: LEV.19.4
reference: Leviticus 19:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אַל תִּפְנוּ֙ אֶל הָ֣/אֱלִילִ֔ים וֵֽ/אלֹהֵי֙ מַסֵּכָ֔ה לֹ֥א תַעֲשׂ֖וּ לָ/כֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/004.yaml
  text: Do not turn to idols[a], and do not make cast-metal gods for yourselves[b]. I am Yahweh your God.
translation:
  language: de
  text: Wendet euch nicht den Götzen zu[a], und macht euch keine gegossenen Götter[b]. Ich bin Jahwe, euer Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann abwertend auch »nichtige Götzen« bedeuten.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Götter aus Metall« beziehungsweise »gegossene Götzenbilder«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְנוּ
  choice: wendet euch … zu
  rationale: פנה mit אֶל bezeichnet ein Sich-Zuwenden. Die Wiedergabe bewahrt den weiten Sinn von Aufmerksamkeit, Hinwendung oder religiöser Ausrichtung, ohne ihn auf »anbeten« zu verengen.
- source_word: אֱלִילִים
  choice: Götzen
  rationale: »Götzen« ist die natürliche deutsche Bezeichnung für Kultbilder beziehungsweise falsche Götter und kann den abwertenden Beiklang des hebräischen Ausdrucks mittragen.
- source_word: אֱלֹהֵי מַסֵּכָה
  choice: gegossene Götter
  rationale: Die Wendung bezeichnet als Götter verehrte Bilder, die im Gussverfahren hergestellt wurden. »Gegossene Götter« bewahrt sowohl den Plural als auch die Herstellungsweise.
- source_word: תַעֲשׂוּ לָכֶם
  choice: macht euch
  rationale: Das Dativpronomen לָכֶם drückt aus, dass die Adressaten solche Götter für den eigenen Gebrauch oder Besitz herstellen würden.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵיכֶם
  choice: euer Gott
  rationale: Die grammatisch pluralisch geformte Bezeichnung meint in der Bundesformel Israels einen einzigen Gott und wird daher im Singular wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. »Jahwe« bewahrt diesen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang der Hinwendung zu Götzen
  choice: Wendet euch nicht den Götzen zu
  alternative: Betet keine Götzen an
  rationale: Das Verb bezeichnet zunächst das Sich-Zuwenden und nennt Anbetung nicht ausdrücklich. Die offenere Formulierung bewahrt den Bedeutungsumfang und vermeidet eine stillschweigende Verengung.
- issue: Bezeichnung der gegossenen Kultbilder als Götter
  choice: gegossene Götter
  alternative: gegossene Götzenbilder
  rationale: Die Übersetzung erhält das ausdrücklich vorhandene אֱלֹהֵי (»Götter«), während der Zusammenhang erkennen lässt, dass hergestellte Kultbilder gemeint sind.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Pluralimperativ wird entsprechend der hebräischen Anrede mit »euch« wiedergegeben; die parallelen Verbote bleiben knapp und direkt.
