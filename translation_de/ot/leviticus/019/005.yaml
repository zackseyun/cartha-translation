id: LEV.19.5
reference: Leviticus 19:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/כִ֧י תִזְבְּח֛וּ זֶ֥בַח שְׁלָמִ֖ים לַ/יהוָ֑ה לִֽ/רְצֹנְ/כֶ֖ם תִּזְבָּחֻֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/005.yaml
  text: And when you sacrifice a peace offering to Yahweh[a], you shall sacrifice it so that you may be accepted.
translation:
  language: de
  text: Und wenn ihr Yahweh ein Friedensopfer darbringt, sollt ihr es so darbringen, dass ihr angenommen werdet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »zu eurer Annahme«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Und wenn
  rationale: כִּי leitet hier innerhalb der Rechts- und Kultbestimmungen einen zeitlich-bedingten Fall ein; »Und wenn« entspricht dem Zusammenhang natürlich und präzise.
- source_word: תִזְבְּחוּ / תִּזְבָּחֻהוּ
  choice: darbringt / sollt ihr es so darbringen
  rationale: זבח bezeichnet das Schlachten beziehungsweise Darbringen eines Opfers. Im Deutschen ist »darbringen« in diesem kultischen Zusammenhang würdig und idiomatisch; die Wiederholung des hebräischen Verbs bleibt erkennbar.
- source_word: זֶבַח שְׁלָמִים
  choice: ein Friedensopfer
  rationale: Die feste Opferbezeichnung wird mit dem herkömmlichen, relativ transparenten deutschen Ausdruck »Friedensopfer« wiedergegeben, ohne die mögliche Gemeinschaftsdimension interpretierend festzulegen.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Die Präposition bezeichnet den Empfänger beziehungsweise die Widmung des Opfers; im deutschen Satz wird dies durch den Dativ ausgedrückt. Der Gottesname יהוה wird als »Yahweh« wiedergegeben.
- source_word: לִרְצֹנְכֶם
  choice: dass ihr angenommen werdet
  rationale: רָצוֹן bezeichnet im Opferkontext die Annahme beziehungsweise Wohlgefälligkeit vor Gott. Die Formulierung gibt diese kultische Bedeutung in natürlichem Deutsch wieder, ohne sie als bloßes Belieben der Opfernden zu verstehen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der im Ausgangstext stehende Eigenname wird als »Yahweh« wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von לִרְצֹנְכֶם im Opfergesetz
  choice: dass ihr angenommen werdet
  alternative: zu eurer Annahme; nach eurem Belieben
  rationale: Im kultischen Zusammenhang liegt die Annahme der Opfernden beziehungsweise ihres Opfers nahe. Die Fußnote bewahrt die knappere und formal nähere Alternative; die Deutung als menschliches Belieben wird vermieden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der kultische Fachausdruck »Friedensopfer« bleibt erhalten; die Satzstruktur ist klar und für heutige Leser verständlich.
