source:
  edition: WLC
  text: וְ/כַרְמְ/ךָ֙ לֹ֣א תְעוֹלֵ֔ל וּ/פֶ֥רֶט כַּרְמְ/ךָ֖ לֹ֣א תְלַקֵּ֑ט לֶֽ/עָנִ֤י וְ/לַ/גֵּר֙ תַּעֲזֹ֣ב אֹתָ֔/ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/010.yaml
  text: And you shall not strip your vineyard bare[a], nor shall you gather the fallen grapes of your vineyard; you shall leave them for the poor and for the sojourner[c][b]. I am Yahweh your God.
translation:
  language: de
  text: Und deinen Weinberg sollst du nicht vollständig abernten[a], und die abgefallenen Trauben deines Weinbergs sollst du nicht auflesen[b]. Für den Armen und den bei euch lebenden Fremden[c] sollst du sie liegen lassen. Ich bin Jahwe, euer Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nicht nachlesen“. Gemeint ist, die Reben nach der Haupternte nicht noch einmal abzusuchen, um auch die verbliebenen Trauben zu ernten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Nachlese deines Weinbergs“. Das hebräische Wort bezeichnet einzelne Trauben, die bei der Ernte zurückbleiben oder zu Boden fallen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich näher: „den Fremden“. Gemeint ist ein nicht einheimischer Mensch, der dauerhaft unter den Israeliten lebt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַרְמְךָ
  choice: deinen Weinberg
  rationale: כֶּרֶם bezeichnet einen Weinberg; die deutsche Entsprechung ist direkt, geläufig und bewahrt den landwirtschaftlichen Zusammenhang.
- source_word: תְעוֹלֵל
  choice: vollständig abernten
  rationale: Das Verb bezeichnet hier das nachträgliche Durchgehen der Reben, um auch die verbliebenen Trauben zu nehmen. „Vollständig abernten“ macht das Verbot einer restlosen Ernte verständlich, ohne das im Deutschen missverständliche Fachwort „nachlesen“ allein zu verwenden.
- source_word: פֶּרֶט
  choice: die abgefallenen Trauben
  rationale: פֶּרֶט meint im Weinbergkontext einzelne, bei der Ernte abgetrennte oder herabgefallene Trauben. Die konkrete Wiedergabe ist für heutige Leser klar.
- source_word: תְלַקֵּט
  choice: auflesen
  rationale: לקט bedeutet sammeln beziehungsweise auflesen. Bei abgefallenen Trauben ist „auflesen“ die natürliche und präzise deutsche Formulierung.
- source_word: לֶעָנִי
  choice: für den Armen
  rationale: עָנִי bezeichnet einen armen oder bedürftigen Menschen. Der Singular des hebräischen Rechtssatzes bleibt erhalten.
- source_word: וְלַגֵּר
  choice: und den bei euch lebenden Fremden
  rationale: גֵּר bezeichnet einen Nichtisraeliten, der auf Dauer innerhalb der israelitischen Gemeinschaft lebt. Die Formulierung vermeidet sowohl das zu allgemeine „Ausländer“ als auch bürokratische Ausdrücke.
- source_word: תַּעֲזֹב אֹתָם
  choice: sollst du sie liegen lassen
  rationale: עזב bedeutet hier, Erntereste bewusst für andere zurückzulassen. „Liegen lassen“ passt besonders zu den unmittelbar zuvor genannten abgefallenen Trauben und schließt sinngemäß die verbliebenen Früchte ein.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵיכֶם
  choice: euer Gott
  rationale: 'Die Form wahrt den Numeruswechsel: Die Erntegebote richten sich im Singular an den Einzelnen, die abschließende Bundesformel an die Gemeinschaft im Plural.'
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als Eigennamen, statt ihn durch den traditionellen Ersatztitel „der HERR“ wiederzugeben.
- issue: Sozialrechtliche Bedeutung von גֵּר
  choice: der bei euch lebende Fremde
  alternative: der Fremde / der Ausländer
  rationale: Die gewählte Fassung bringt zum Ausdruck, dass es nicht um irgendeinen Menschen aus einem anderen Land geht, sondern um einen nicht einheimischen Bewohner innerhalb Israels, ohne einen modernen rechtlichen Status in den Text einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlicher Rechtssprache. Das wiederholte „sollst du nicht“ wahrt den Gebotscharakter und den Parallelismus. Der Wechsel vom Singular in den Geboten zum Plural „euer Gott“ in der Schlussformel folgt dem Hebräischen.
