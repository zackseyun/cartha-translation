id: LEV.19.17
reference: Leviticus 19:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לֹֽא תִשְׂנָ֥א אֶת אָחִ֖י/ךָ בִּ/לְבָבֶ֑/ךָ הוֹכֵ֤חַ תּוֹכִ֨יחַ֙ אֶת עֲמִיתֶ֔/ךָ וְ/לֹא תִשָּׂ֥א עָלָ֖י/ו חֵֽטְא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/017.yaml
  text: You shall not hate your brother in your heart. You shall surely rebuke your neighbor[a], and you shall not bear sin because of him.
translation:
  language: de
  text: Du sollst deinen Bruder nicht in deinem Herzen hassen. Weise deinen Nächsten unbedingt zurecht, und lade seinetwegen keine Schuld auf dich.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werde nicht seinetwegen schuldig“ oder „habe nicht Anteil an seiner Sünde“. Die hebräische Wendung ist mehrdeutig und kann besagen, dass man durch unterlassene Zurechtweisung selbst schuldig wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׂנָא
  choice: hassen
  rationale: Das Verb שׂנא bezeichnet deutlich Hass. „Hassen“ bewahrt die moralische Schärfe des Verbots, ohne sie abzuschwächen.
- source_word: אָחִיךָ
  choice: deinen Bruder
  rationale: אָח kann den leiblichen Bruder oder ein Mitglied der eigenen Bundesgemeinschaft bezeichnen. „Bruder“ erhält das Verwandtschafts- und Gemeinschaftsbild des hebräischen Ausdrucks.
- source_word: בִּלְבָבֶךָ
  choice: in deinem Herzen
  rationale: לֵבָב bezeichnet das Innere des Menschen, besonders Denken, Wollen und Gesinnung. Die geläufige deutsche Wendung bewahrt hier den inneren Bezug des Gebots.
- source_word: הוֹכֵחַ תּוֹכִיחַ
  choice: weise … unbedingt zurecht
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt die Aufforderung. „Unbedingt“ gibt diesen Nachdruck in natürlichem modernem Deutsch wieder; „zurechtweisen“ wahrt den ernsten moralischen Sinn.
- source_word: עֲמִיתֶךָ
  choice: deinen Nächsten
  rationale: עָמִית bezeichnet einen Mitmenschen beziehungsweise ein Mitglied derselben Gemeinschaft. „Nächster“ ist im ethisch-rechtlichen Zusammenhang von Levitikus 19 idiomatisch und anschlussfähig.
- source_word: תִשָּׂא עָלָיו חֵטְא
  choice: lade seinetwegen keine Schuld auf dich
  rationale: נָשָׂא חֵטְא kann das Tragen von Sünde oder Schuld sowie das Schuldigwerden bezeichnen. Die Formulierung ist im Deutschen verständlich, bleibt dem Bild des Hebräischen nahe und lässt den genauen Zusammenhang mit dem Fehlverhalten des Nächsten in der Fußnote offen.
theological_decisions:
- issue: Reichweite der Verwandtschafts- und Gemeinschaftsbegriffe
  choice: Die männlichen Singularformen „Bruder“ und „Nächster“ werden beibehalten.
  alternative: „Mitmensch“ oder „jemand aus deinem Volk“
  rationale: Der hebräische Text verwendet männliche Singularformen mit repräsentativer gemeinschaftlicher Reichweite. Die Wiedergabe erhält sowohl die Sprachgestalt als auch den familiären beziehungsweise bundesgemeinschaftlichen Klang.
- issue: Art der durch unterlassene Zurechtweisung entstehenden Verstrickung
  choice: „seinetwegen keine Schuld auf dich laden“
  alternative: „nicht an seiner Sünde teilhaben“ oder „nicht um seinetwillen schuldig werden“
  rationale: Der hebräische Ausdruck ist mehrdeutig und kann das eigene Schuldigwerden, das Tragen von Schuld oder eine Beteiligung an der Sünde bezeichnen. Der Haupttext legt den genauen Mechanismus nicht dogmatisch fest; die Alternativen werden in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede. Die emphatische hebräische Verbkonstruktion wird idiomatisch durch „unbedingt“ wiedergegeben; die Spannung der abschließenden Wendung bleibt durch eine quellennah formulierte Hauptlesart und eine erklärende Fußnote erhalten.
