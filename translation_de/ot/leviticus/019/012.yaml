source:
  edition: WLC
  text: וְ/לֹֽא תִשָּׁבְע֥וּ בִ/שְׁמִ֖/י לַ/שָּׁ֑קֶר וְ/חִלַּלְתָּ֛ אֶת שֵׁ֥ם אֱלֹהֶ֖י/ךָ אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/012.yaml
  text: You shall not swear falsely by my name and so profane the name of your God[a]. I am Yahweh.
translation:
  language: de
  text: Ihr sollt nicht bei meinem Namen falsch schwören und dadurch den Namen eures Gottes entweihen.[a] Ich bin Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Ihr sollt nicht bei meinem Namen zur Falschheit schwören; so entweihst du den Namen deines Gottes.« Im Hebräischen wechselt die Anrede in der zweiten Satzhälfte vom Plural zum Singular.'
    reason: lexikalische Alternative und grammatische Besonderheit
lexical_decisions:
- source_word: תִשָּׁבְעוּ
  choice: ihr sollt nicht schwören
  rationale: Der Nifal von שׁבע bezeichnet im rechtlich-ethischen Zusammenhang das Schwören beziehungsweise Ablegen eines Eides. Die Form im Plural richtet sich an die Gemeinschaft.
- source_word: בִשְׁמִי
  choice: bei meinem Namen
  rationale: Die Präposition ב bezeichnet zusammen mit »Name« die angerufene Grundlage eines Eides; im Deutschen ist »bei meinem Namen schwören« idiomatisch.
- source_word: לַשָּׁקֶר
  choice: falsch
  rationale: Wörtlich steht »zur/für Falschheit«; im Zusammenhang mit einem Eid gibt »falsch schwören« die adverbiale Funktion natürlich wieder.
- source_word: וְחִלַּלְתָּ
  choice: und dadurch … entweihen
  rationale: חלל im Piel bedeutet »entweihen«. »Dadurch« bringt den im Zusammenhang naheliegenden Folgebezug des hebräischen ו zum Ausdruck, ohne einen zusätzlichen Gedanken einzuführen.
- source_word: שֵׁם
  choice: den Namen
  rationale: »Name« bleibt wörtlich erhalten, da er Gottes offenbarte Identität und Ehre bezeichnet.
- source_word: אֱלֹהֶיךָ
  choice: eures Gottes
  rationale: אֱלֹהִים hat hier trotz seiner Form einen singularischen Referenten. Der singularische Suffix der hebräischen direkten Anrede wird im Deutschen entsprechend der vorausgehenden pluralischen Anrede als »eures« wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet den Eigennamen יהוה. »Jahwe« bewahrt ihn als persönlichen Gottesnamen.
- issue: Verhältnis zwischen falschem Schwören und der Entweihung des Namens
  choice: 'Folgebezug: »und dadurch … entweihen«'
  alternative: 'Reine Beiordnung: »und … entweihen«'
  rationale: Das hebräische ו kann eine einfache Verbindung ausdrücken; im Kontext liegt zugleich nahe, dass der falsche Eid Gottes Namen entweiht. »Dadurch« macht diesen Zusammenhang verständlich, während die Fußnote die wörtlichere Struktur erkennen lässt.
- issue: Numeruswechsel in der Anrede
  choice: Durchgehend pluralische deutsche Anrede
  alternative: Wörtlicher Wechsel von Plural zu Singular
  rationale: Der hebräische Text wechselt von תִשָּׁבְעוּ im Plural zu וְחִלַּלְתָּ und אֱלֹהֶיךָ im Singular. Im Deutschen würde ein unvermittelter Wechsel leicht wie ein Referentenwechsel wirken; die Fußnote bewahrt die formale Besonderheit.
translation_notes:
  register: Moderne, würdevolle Standardsprache. »Bei meinem Namen schwören« ist natürliches Deutsch; »entweihen« bewahrt den kultisch-theologischen Gehalt. Die pluralische Anrede wird im Haupttext einheitlich geführt, während die Fußnote den hebräischen Numeruswechsel dokumentiert.
