  text: וְ/שֶׂ֣רֶט לָ/נֶ֗פֶשׁ לֹ֤א תִתְּנוּ֙ בִּ/בְשַׂרְ/כֶ֔ם וּ/כְתֹ֣בֶת קַֽעֲקַ֔ע לֹ֥א תִתְּנ֖וּ בָּ/כֶ֑ם אֲנִ֖י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/028.yaml
  text: You shall not make any cuts in your flesh for the dead[a], and you shall not put a tattoo mark on yourselves[b]. I am Yahweh.
translation:
  language: de
  text: Ihr sollt euch für einen Toten keine Einschnitte ins Fleisch machen[a] und euch keine Tätowierung anbringen[b]. Ich bin Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wegen eines Toten“. Die hebräische Wendung bezieht sich wahrscheinlich auf Einschnitte als Ausdruck der Totenklage.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „keine eingeritzte Markierung“. Der hebräische Ausdruck kommt nur hier vor und bezeichnet wahrscheinlich eine dauerhafte Körpermarkierung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׂרֶט
  choice: Einschnitte
  rationale: Das Substantiv bezeichnet einen Schnitt oder Einschnitt am Körper. „Einschnitte“ ist im Deutschen natürlich und legt weder Werkzeug noch Schwere der Verletzung fest.
- source_word: לָנֶפֶשׁ
  choice: wegen eines Toten
  rationale: נֶפֶשׁ bezeichnet hier idiomatisch einen Verstorbenen; die Präposition verweist wahrscheinlich auf den Anlass der Einschnitte im Zusammenhang mit der Totenklage.
- source_word: בִּבְשַׂרְכֶם
  choice: ins Fleisch
  rationale: Die konkrete Körperbezeichnung „Fleisch“ bewahrt das Bild des Hebräischen; mit „Einschnitte machen“ verlangt natürliches Deutsch hier „ins“.
- source_word: כְתֹבֶת קַעֲקַע
  choice: Tätowierung
  rationale: Die seltene Wortverbindung bezeichnet wahrscheinlich eine dauerhaft in die Haut eingebrachte Schrift oder Markierung. „Tätowierung“ gibt den wahrscheinlichen Sinn knapp und modern wieder, während die Fußnote die lexikalische Unsicherheit bewahrt.
- source_word: לֹא תִתְּנוּ ... בָּכֶם
  choice: euch keine … anbringen
  rationale: נתן mit ב bezeichnet hier das Anbringen einer Markierung am eigenen Körper. Die reflexive Formulierung ist natürliches Deutsch.
- source_word: אֲנִי יְהוָה
  choice: Ich bin Jahwe
  rationale: Der Eigenname יהוה wird als „Jahwe“ wiedergegeben und die knappe Selbstvorstellungsformel bleibt erhalten.
theological_decisions:
- issue: Reichweite des Verbots von Körpermarkierungen
  choice: Die beiden Verbote werden entsprechend ihrer hebräischen Formulierung wiedergegeben; nur die Einschnitte werden ausdrücklich mit einem Toten verbunden.
  alternative: Beide Verbote ausdrücklich auf heidnische Trauerriten beschränken oder den zweiten Satz als ausdrückliches, kulturübergreifendes Verbot sämtlicher moderner Tätowierungen formulieren.
  rationale: Der hebräische Text verbindet לָנֶפֶשׁ grammatisch mit dem ersten Verbot und wiederholt diese Bestimmung beim zweiten nicht. Die Übersetzung sollte weder eine Einschränkung ergänzen noch die Anwendung über den Wortlaut hinaus ausweiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzform ist direkt und verständlich; „Einschnitte ins Fleisch“ erhält die konkrete hebräische Körpermetaphorik. „Tätowierung“ ist die geläufige Hauptwiedergabe, während die Fußnote die Seltenheit und mögliche Bedeutungsbreite des Ausdrucks kenntlich macht.
