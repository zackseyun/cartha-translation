source:
  edition: WLC
  text: מִ/פְּנֵ֤י שֵׂיבָה֙ תָּק֔וּם וְ/הָדַרְתָּ֖ פְּנֵ֣י זָקֵ֑ן וְ/יָרֵ֥אתָ מֵּ/אֱלֹהֶ֖י/ךָ אֲנִ֥י יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/032.yaml
  text: You shall rise before gray hair[a], and you shall honor the face of an old man, and you shall fear your God[b]; I am Yahweh.
translation:
  language: de
  text: Vor grauem Haar sollst du aufstehen[a] und das Angesicht eines alten Mannes ehren[b]. Fürchte deinen Gott. Ich bin Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »In Gegenwart grauen Haares sollst du aufstehen.« Das Hebräische gebraucht graues Haar als konkretes Bild für hohes Alter.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »das Angesicht eines alten Mannes ehren«; idiomatisch: »einem alten Mann Ehre erweisen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּנֵי שֵׂיבָה
  choice: vor grauem Haar
  rationale: Die konkrete hebräische Wendung bezeichnet graues Haar als sichtbares Zeichen des Alters. Mit קום bedeutet מִפְּנֵי idiomatisch, in jemandes Gegenwart beziehungsweise vor jemandem aufzustehen.
- source_word: תָּקוּם
  choice: sollst du aufstehen
  rationale: Das Qal-Imperfekt hat hier gebietenden Sinn und bezeichnet das Aufstehen als Zeichen des Respekts.
- source_word: וְהָדַרְתָּ
  choice: und … ehren
  rationale: Das Piel von הדר bedeutet hier, jemandem Ehre oder Achtung zu erweisen; »ehren« ist prägnant und würdevoll.
- source_word: פְּנֵי זָקֵן
  choice: das Angesicht eines alten Mannes
  rationale: Die Wiedergabe bewahrt sowohl das konkrete hebräische Wort »Angesicht« als auch die maskuline Singularform von זָקֵן. Eine Fußnote erläutert die idiomatische Bedeutung.
- source_word: וְיָרֵאתָ מֵאֱלֹהֶיךָ
  choice: Fürchte deinen Gott
  rationale: »Fürchte« erhält die im Hebräischen vorhandene Spannung zwischen Furcht, Ehrfurcht und gehorsamer Gottesachtung; der persönliche Singular bleibt erhalten.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Geschlechtsspezifische Form זָקֵן
  choice: alter Mann
  alternative: alter Mensch; Ältester
  rationale: Die hebräische Form ist maskulin Singular. Die Übersetzung bewahrt diese Markierung, ohne daraus einen Ausschluss alter Frauen abzuleiten.
- issue: Bedeutungsumfang von ירא gegenüber Gott
  choice: Fürchte deinen Gott
  alternative: Hab Ehrfurcht vor deinem Gott
  rationale: »Fürchte« bewahrt das stärkere Gewicht der Bundesformel und glättet die Spannung zwischen Furcht und Ehrfurcht nicht.
- issue: Wiedergabe des Tetragramms יְהוָה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der im Ausgangstext stehende persönliche Gottesname wird als solcher kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge wurde in drei kurze Hauptsätze gegliedert. Die konkreten Bilder »graues Haar« und »Angesicht« bleiben erhalten; Fußnoten erschließen ihre idiomatische Bedeutung.
