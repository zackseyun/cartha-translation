- from: Du sollst deinen Mitmenschen nicht unterdrücken und nicht berauben. Der Lohn eines Tagelöhners soll nicht über Nacht bis zum Morgen bei dir bleiben.[a]
  to: Du sollst deinen Nächsten nicht unterdrücken und ihn nicht berauben. Der Lohn eines Lohnarbeiters soll nicht bis zum Morgen bei dir bleiben.[a]
