    rationale: »Mitmensch« ist zwar verständlich, kann aber abstrakt oder modern-humanitär wirken. »Nächster« entspricht dem Kontext und dem üblichen biblischen Sprachgebrauch, ohne den Sinn räumlich einzuengen.
