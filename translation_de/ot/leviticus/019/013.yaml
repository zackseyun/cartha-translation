  naturalness: »über Nacht bis zum Morgen« ist im Deutschen unnötig doppelt und stilistisch schwerfällig. Die direkte Konstruktion »nicht bis zum Morgen bei dir bleiben« ist idiomatisch und bildet zugleich die hebräische Subjektkonstruktion ab.
  terminology: »Nächster« ist für רֵעַ in diesem ethisch-rechtlichen Kontext die etablierte, natürliche deutsche Wiedergabe. »Lohnarbeiter« bewahrt die Allgemeinheit von שָׂכִיר besser als »Tagelöhner«. »Unterdrücken« und »berauben« sind als Wiedergaben der beiden Verben vertretbar.
