source:
  edition: WLC
  text: לֹֽא תַעֲשֹׁ֥ק אֶת רֵֽעֲ/ךָ֖ וְ/לֹ֣א תִגְזֹ֑ל לֹֽא תָלִ֞ין פְּעֻלַּ֥ת שָׂכִ֛יר אִתְּ/ךָ֖ עַד בֹּֽקֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/013.yaml
  text: You shall not oppress your neighbor or rob him[a]. The wages of a hired worker shall not remain with you until morning.
translation:
  language: de
  text: Du sollst deinen Nächsten nicht unterdrücken und ihn nicht berauben. Der Lohn eines Lohnarbeiters soll nicht bis zum Morgen bei dir bleiben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Den Lohn eines Lohnarbeiters sollst du nicht bis zum Morgen zurückhalten.'
    reason: Die alternative deutsche Satzstellung macht den rechtlichen Sinn der bildnahen Formulierung »bei dir bleiben« explizit, ohne eine abweichende Bedeutung einzuführen.
lexical_decisions:
- source_word: תַעֲשֹׁק
  choice: unterdrücken
  rationale: Das Verb bezeichnet die Bedrückung oder Ausbeutung eines anderen, häufig durch Vorenthalten dessen, was ihm zusteht. »Unterdrücken« bewahrt die breite ethische Aussage.
- source_word: רֵעֲךָ
  choice: deinen Mitmenschen
  rationale: רֵעַ bezeichnet hier den anderen innerhalb des sozialen und rechtlichen Beziehungsraums. »Mitmensch« ist in modernem Deutsch natürlich und vermeidet eine unnötige Beschränkung auf den räumlichen Nachbarn.
- source_word: תִגְזֹל
  choice: berauben
  rationale: גזל bezeichnet gewaltsames oder widerrechtliches Wegnehmen. »Berauben« gibt diese stärkere Bedeutung gegenüber allgemeinem Stehlen wieder.
- source_word: תָלִין
  choice: soll nicht über Nacht … bleiben
  rationale: Die feminine Verbform stimmt mit פְּעֻלַּת, dem Lohn, überein und bezeichnet das Verbleiben über Nacht. Die Formulierung bildet das hebräische Subjekt und den zeitlichen Vorgang klar ab.
- source_word: פְּעֻלַּת
  choice: der Lohn
  rationale: פְּעֻלָּה kann Arbeit oder deren Vergütung meinen; zusammen mit שָׂכִיר und dem Verbot verzögerter Zahlung ist »Lohn« sachlich eindeutig.
- source_word: שָׂכִיר
  choice: eines Tagelöhners
  rationale: שָׂכִיר ist ein gegen Lohn angestellter Arbeiter. Im Zusammenhang mit der Auszahlung vor dem nächsten Morgen trifft »Tagelöhner« den sozialen und zeitlichen Kontext prägnant.
- source_word: אִתְּךָ
  choice: bei dir
  rationale: Die Wendung besagt, dass der Arbeitgeber den geschuldeten Lohn noch in seinem Besitz hält. »Bei dir« entspricht der konkreten hebräischen Ausdrucksweise.
- source_word: עַד בֹּקֶר
  choice: bis zum Morgen
  rationale: Die Zeitangabe setzt den nächsten Morgen als äußerste Grenze und wird konkret beibehalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Gesetzessprache. »Mitmensch« ist allgemein verständlich; »Tagelöhner« macht die im Kontext vorausgesetzte tägliche Lohnzahlung deutlich. Der Fußnotenmarker steht im Haupttext.
