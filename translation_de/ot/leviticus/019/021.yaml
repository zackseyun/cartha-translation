id: LEV.19.21
reference: Leviticus 19:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הֵבִ֤יא אֶת אֲשָׁמ/וֹ֙ לַֽ/יהוָ֔ה אֶל פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד אֵ֖יל אָשָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/021.yaml
  text: 'And he shall bring his guilt offering to Yahweh[a], to the entrance of the tent of meeting: a ram as a guilt offering.'
translation:
  language: de
  text: 'Und er soll sein Schuldopfer zu Jahwe an den Eingang des Zeltes der Begegnung bringen: einen Widder als Schuldopfer.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wiedergutmachungsopfer“. Das hebräische Wort אָשָׁם kann sowohl Schuld als auch das Opfer bezeichnen, das zu ihrer Wiedergutmachung dargebracht wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: Und er soll … bringen
  rationale: Die Verbform hat im Gesetzestext vorschreibende Bedeutung; „soll … bringen“ ist im modernen Deutschen natürlich und bewahrt den verpflichtenden Sinn.
- source_word: אֲשָׁמוֹ
  choice: sein Schuldopfer
  rationale: אָשָׁם kann sowohl Schuld als auch das zu ihrer Wiedergutmachung dargebrachte Opfer bezeichnen. Hier verlangt der Opferkontext die Bedeutung „Schuldopfer“.
- source_word: לַיהוָה
  choice: zu Jahwe
  rationale: Die Präposition bezeichnet hier die Ausrichtung der Darbringung; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: אֶל פֶּתַח
  choice: an den Eingang
  rationale: פֶּתַח bezeichnet den Eingang beziehungsweise die Öffnung; mit dem Bewegungsverb ist „an den Eingang“ idiomatisches Deutsch.
- source_word: אֹהֶל מוֹעֵד
  choice: Zelt der Begegnung
  rationale: Die Wendung bezeichnet das Heiligtumszelt als Ort der Begegnung; diese Wiedergabe ist verständlich und semantisch transparent.
- source_word: אֵיל
  choice: einen Widder
  rationale: אֵיל bezeichnet spezifisch einen männlichen Schafbock beziehungsweise Widder.
- source_word: אָשָׁם
  choice: als Schuldopfer
  rationale: Die abschließende Apposition bestimmt die Opferfunktion des Widders. „Als Schuldopfer“ gibt diese Funktion im Deutschen klar wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Bundesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von אָשָׁם
  choice: Schuldopfer mit Fußnote zur Wiedergutmachung
  alternative: Wiedergutmachungsopfer
  rationale: Der Begriff verbindet Schuld und die zu ihrer Behebung bestimmte Opferleistung. „Schuldopfer“ wahrt die etablierte kultische Bezeichnung; die Fußnote hält den Aspekt der Wiedergutmachung sichtbar.
translation_notes:
  register: Moderner, würdiger Gesetzesstil. Die Satzstellung bleibt nahe am Hebräischen, ohne unnatürlich zu wirken; der Doppelgebrauch von „Schuldopfer“ bewahrt die ausdrückliche Wiederaufnahme im Ausgangstext.
