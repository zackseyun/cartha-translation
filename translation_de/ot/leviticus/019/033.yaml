  text: When a foreigner resides with you in your land[b][a], you shall not mistreat him.
translation:
  language: de
  text: Wenn ein Fremder bei dir in eurem Land wohnt, sollt ihr ihm kein Unrecht tun.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ihr sollt ihn nicht bedrücken“ oder „ihr sollt ihn nicht schlecht behandeln“.'
    reason: lexical_alternative
  - marker: b
    text: „Fremder“ bezeichnet hier einen nicht einheimischen Menschen, der als Bewohner unter den Israeliten lebt; oft auch „ansässiger Fremder“ oder „Beisasse“ übersetzt.
    reason: cultural_note
lexical_decisions:
- source_word: וְכִי
  choice: Wenn
  rationale: Leitet einen gesetzlich geregelten Fall ein; „Wenn“ gibt die konditionale beziehungsweise situative Funktion im Deutschen natürlich wieder.
- source_word: יָגוּר
  choice: wohnt
  rationale: Das Verb גור bezeichnet hier das Wohnen als nicht einheimischer, ansässiger Fremder. „wohnt“ ist gegenwärtig und verständlich; der besondere Aufenthaltsstatus wird durch גֵּר ausgedrückt.
- source_word: אִתְּךָ
  choice: bei dir
  rationale: Bewahrt den Singular der hebräischen Anrede und gibt das Zusammenleben im Bereich des Angeredeten idiomatisch wieder.
- source_word: גֵּר
  choice: ein Fremder
  rationale: Bezeichnet hier keinen bloßen Besucher, sondern einen nicht einheimischen Menschen, der dauerhaft oder längerfristig unter Israel lebt. Eine Fußnote erläutert diese kulturell-rechtliche Nuance.
- source_word: בְּאַרְצְכֶם
  choice: in eurem Land
  rationale: Bewahrt den Wechsel zum Plural in der hebräischen Anrede und den für den Kontext wichtigen Begriff „Land“.
- source_word: לֹא תוֹנוּ
  choice: dürft ihr ihn nicht schlecht behandeln
  rationale: Das Hiphil von ינה kann „Unrecht tun“, „bedrücken“ oder allgemein „schlecht behandeln“ bedeuten. Die gewählte Formulierung ist natürlich und lässt die inhaltliche Breite bestehen; engere Alternativen stehen in der Fußnote.
- source_word: אֹתוֹ
  choice: ihn
  rationale: Das maskuline Singularpronomen verweist unmittelbar auf גֵּר zurück und wird entsprechend beibehalten.
theological_decisions:
- issue: Bedeutung von גֵּר im Heiligkeitsgesetz
  choice: Fremder, mit Erläuterung seines ansässigen Status
  alternative: Beisasse; Schutzbürger; ansässiger Ausländer
  rationale: „Fremder“ ist im modernen Standarddeutsch verständlich, kann allein jedoch auch einen unbekannten Menschen bezeichnen. Der Satz („wohnt“) und die Fußnote sichern die Bedeutung eines nicht einheimischen Bewohners, ohne einen modernen ausländerrechtlichen Status in den Text einzutragen.
- issue: Reichweite des Verbots לֹא תוֹנוּ
  choice: nicht schlecht behandeln
  alternative: nicht bedrücken; ihm kein Unrecht tun
  rationale: Das hebräische Verb bezeichnet schädigendes oder unterdrückendes Handeln, ohne hier eine einzelne Form davon festzulegen. Die breite Haupttextfassung bewahrt diese Offenheit; die Fußnote nennt präzisere mögliche Wiedergaben.
translation_notes:
  register: 'Modernes, würdevolles Standarddeutsch. Der auffällige Numeruswechsel des Hebräischen wird erhalten: „bei dir“ (Singular), dann „in eurem Land“ und „dürft ihr“ (Plural). Die Fußnotenmarker stehen unmittelbar nach dem Satz und folgen der Reihenfolge [a], [b].'
