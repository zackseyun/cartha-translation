  text: וּ/שְׁמַרְתֶּ֣ם אַתֶּ֗ם אֶת חֻקֹּתַ/י֙ וְ/אֶת מִשְׁפָּטַ֔/י וְ/לֹ֣א תַעֲשׂ֔וּ מִ/כֹּ֥ל הַ/תּוֹעֵבֹ֖ת הָ/אֵ֑לֶּה הָֽ/אֶזְרָ֔ח וְ/הַ/גֵּ֖ר הַ/גָּ֥ר בְּ/תוֹכְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/026.yaml
  text: But you yourselves shall keep my statutes and my judgments[a], and you shall not do any of these abominations, neither the native-born nor the sojourner who sojourns among you.
translation:
  language: de
  text: Ihr selbst aber – sowohl der Einheimische als auch der bei euch lebende Fremde[a] – sollt meine Satzungen und meine Rechtsbestimmungen befolgen und keine dieser abscheulichen Taten begehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der bei euch ansässige Ausländer“.'
    reason: גֵּר bezeichnet hier einen Nichtisraeliten, der innerhalb der Gemeinschaft ansässig ist, nicht einen beliebigen Fremden oder Besucher.
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם אַתֶּם
  choice: Ihr selbst aber sollt … befolgen
  rationale: שׁמר bezeichnet im rechtlich-bundestheologischen Zusammenhang das Beachten und Befolgen von Geboten. Das selbstständige Pronomen אַתֶּם hebt die Angesprochenen hervor; „ihr selbst“ gibt diesen Nachdruck wieder. „Aber“ markiert den Gegensatz zum zuvor beschriebenen Verhalten.
- source_word: חֻקֹּתַי
  choice: meine Satzungen
  rationale: חֻקִּים sind festgesetzte Vorschriften. „Satzungen“ bewahrt den rechtlichen Klang und ist in einem Tora-Kontext verständlich.
- source_word: מִשְׁפָּטַי
  choice: meine Rechtsbestimmungen
  rationale: מִשְׁפָּטִים bezeichnet rechtliche Entscheidungen, Ordnungen oder Bestimmungen. „Rechtsbestimmungen“ hält die juristische Nuance fest und unterscheidet den Ausdruck von חֻקֹּתַי.
- source_word: וְלֹא תַעֲשׂוּ מִכֹּל
  choice: und keine … begehen
  rationale: Unter der Verneinung bedeutet מִן־כֹּל idiomatisch „keine von/keine dieser“. Bei verwerflichen Handlungen ist „begehen“ im Deutschen natürlicher und genauer als das allgemeine „tun“, ohne eine Gewohnheitsbedeutung hinzuzufügen.
- source_word: הַתּוֹעֵבֹת הָאֵלֶּה
  choice: diese abscheulichen Taten
  rationale: תּוֹעֵבָה bezeichnet etwas entschieden Verabscheuungswürdiges, besonders im moralischen oder kultischen Bereich. Da auf die zuvor genannten Handlungen verwiesen wird, macht „abscheuliche Taten“ den Bezug natürlich verständlich.
- source_word: הָאֶזְרָח
  choice: der Einheimische
  rationale: אֶזְרָח bezeichnet ein einheimisches Mitglied der Gemeinschaft und steht hier im Gegensatz zum גֵּר. „Einheimischer“ ist präzise, ohne moderne staatsbürgerliche Kategorien einzutragen.
- source_word: הַגֵּר הַגָּר בְּתוֹכְכֶם
  choice: der Fremde, der bei euch lebt
  rationale: גֵּר bezeichnet einen nicht einheimischen Menschen, der dauerhaft innerhalb der Gemeinschaft lebt. Die Formulierung gibt sowohl die Personenbezeichnung als auch den erläuternden Partizipialsatz natürlich wieder; die Fußnote nennt eine präzisierende Alternative.
theological_decisions:
- issue: Geltungsbereich des Verbots für Einheimische und nicht einheimische Bewohner
  choice: Das Verbot betrifft ausdrücklich sowohl den Einheimischen als auch den unter Israel lebenden Fremden.
  alternative: Die Schlusswendung kann vor allem als nachgestellte Benennung der verpflichteten Personengruppen verstanden werden, ohne dass die Gleichstellung eigens betont wird.
  rationale: Die Syntax nennt הָאֶזְרָח und הַגֵּר gemeinsam als diejenigen, für die das Verbot gilt. Die Übersetzung bewahrt diese gemeinsame Verpflichtung, ohne darüber hinaus einen besonderen theologischen Status des Fremden zu behaupten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit erkennbarem Rechtscharakter. Der Gedankenstrich verdeutlicht die nachgestellte Angabe der beiden betroffenen Gruppen. Die starke Wertung von תּוֹעֵבֹת bleibt erhalten, während „Taten“ den Rückbezug auf die in diesem Kapitel genannten Handlungen klärt.
