  text: וְ/לֹֽא תָקִ֤יא הָ/אָ֨רֶץ֙ אֶתְ/כֶ֔ם בְּ/טַֽמַּאֲ/כֶ֖ם אֹתָ֑/הּ כַּ/אֲשֶׁ֥ר קָאָ֛ה אֶת הַ/גּ֖וֹי אֲשֶׁ֥ר לִ/פְנֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/028.yaml
  text: so that the land will not vomit you out when you defile it[a], as it vomited out the nation that was before you.
translation:
  language: de
  text: damit das Land euch nicht ausspeit, wenn ihr es unrein macht,[a] wie es das Volk ausgespien hat, das vor euch dort war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „entweiht“. Das hebräische Wort bezeichnet hier, dass das Land unrein gemacht wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָקִיא / קָאָה
  choice: ausspeien / ausgespien hat
  rationale: Das deutsche „ausspeien“ bewahrt das drastische Bild des hebräischen Verbs קיא/קוא und bezeichnet zugleich idiomatisch das gewaltsame Ausstoßen aus dem Land.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Im Zusammenhang ist das Land Kanaan gemeint, nicht die gesamte Erde.
- source_word: בְּטַמַּאֲכֶם אֹתָהּ
  choice: wenn ihr es unrein macht
  rationale: ב mit dem Infinitiv kann temporal oder instrumental verstanden werden. Die temporale Wiedergabe ist natürlich und lässt den ursächlichen Zusammenhang erkennen; der Piel von טמא wird mit „unrein machen“ transparent wiedergegeben.
- source_word: הַגּוֹי
  choice: das Volk
  rationale: גוי bezeichnet hier kollektiv die früheren Bewohner des Landes. „Volk“ ist im modernen Deutschen natürlicher als „Nation“ und trägt keine späteren Bedeutungsnuancen von „Heiden“ ein.
- source_word: אֲשֶׁר לִפְנֵיכֶם
  choice: das vor euch dort lebte
  rationale: Die Wendung bezeichnet die Bewohner, die zeitlich vor Israel im Land waren. „Dort lebte“ verdeutlicht den räumlich-temporalen Bezug, ohne eine zusätzliche theologische Aussage einzuführen.
- source_word: וְלֹא
  choice: damit ... nicht
  rationale: Im Kontext hat die formal koordinierende Wendung negative Zweck- beziehungsweise Folgewirkung. „Damit ... nicht“ gibt diesen Zusammenhang in heutigem Deutsch verständlich wieder.
theological_decisions:
- issue: Personifikation des Landes als handelnder Träger des Gerichts
  choice: Das Land bleibt grammatisches Subjekt und „speit“ seine Bewohner aus.
  alternative: Abstrakter formulieren, dass Gott die Bewohner aus dem Land vertreibt.
  rationale: Der hebräische Text personifiziert ausdrücklich das Land. Die Beibehaltung des Bildes bewahrt die theologische Spannung zwischen der Verunreinigung des Landes und der Vertreibung seiner Bewohner, ohne Gottes letztgültiges Handeln eigens auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das kräftige und bewusst anstößige Bild des Ausspeiens bleibt erhalten. Die Stellung der Fußnotenmarke folgt unmittelbar auf die Wendung, auf die sie sich bezieht.
