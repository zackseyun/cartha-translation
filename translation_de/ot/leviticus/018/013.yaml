  text: You shall not uncover the nakedness of your mother's sister[b][a], for she is your mother's close relative.
translation:
  language: de
  text: Die Blöße der Schwester deiner Mutter sollst du nicht aufdecken[a], denn sie ist eine nahe Verwandte deiner Mutter[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sinngemäß: „Du sollst keine sexuellen Beziehungen mit der Schwester deiner Mutter haben.“ Wörtlich lautet die hebräische Wendung: „die Blöße … aufdecken“.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort שְׁאֵר bedeutet wörtlich „Fleisch“ und bezeichnet hier im Verwandtschaftsrecht eine nahe leibliche Verwandte.
    reason: cultural_note
lexical_decisions:
- source_word: עֶרְוַת ... לֹא תְגַלֵּה
  choice: Die Blöße ... sollst du nicht aufdecken
  rationale: Die feste Rechtsformel wird bewusst wörtlich und in ihrer euphemistischen Wirkung wiedergegeben. Im Zusammenhang bezeichnet sie verbotene sexuelle Beziehungen.
- source_word: אֲחוֹת אִמְּךָ
  choice: die Schwester deiner Mutter
  rationale: Die konkrete Verwandtschaftsbezeichnung des Hebräischen bleibt erhalten; „Tante“ wäre kürzer, aber weniger genau.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung des Verbots ein und entspricht dem gehobenen rechtlichen Stil.
- source_word: שְׁאֵר אִמְּךָ
  choice: eine nahe Blutsverwandte deiner Mutter
  rationale: שְׁאֵר bezeichnet hier enge leibliche Verwandtschaft. „Blutsverwandte“ macht den verwandtschaftsrechtlichen Sinn im Deutschen verständlich; „deiner Mutter“ bewahrt den ausdrücklichen Bezug des Ausgangstextes.
- source_word: הִוא
  choice: sie ist
  rationale: Das feminine Pronomen nimmt die Schwester der Mutter auf und wird im Deutschen direkt wiedergegeben.
theological_decisions:
- issue: Wiedergabe der rechtlichen Umschreibung für verbotene sexuelle Beziehungen
  choice: Die Wendung „die Blöße ... aufdecken“ bleibt im Haupttext erhalten.
  alternative: „Mit der Schwester deiner Mutter sollst du keinen Geschlechtsverkehr haben.“
  rationale: Die wiederkehrende hebräische Rechtsformel in Levitikus 18 soll weder verflacht noch stillschweigend ausgedeutet werden. Eine Fußnote erklärt ihre Bedeutung.
translation_notes:
  register: Moderne, würdige Rechtssprache. Die Satzstellung folgt natürlichem Standarddeutsch, während die wiederkehrende hebräische Umschreibung bewusst bewahrt wird. Die Fußnotenmarker stehen jeweils unmittelbar bei der erläuterten Wendung.
