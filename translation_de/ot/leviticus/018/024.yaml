    rationale: Die Formulierung „durch nichts von alledem“ ist nicht falsch, aber „nicht unrein durch all dies“ ist idiomatischer und lässt die hebräische Formulierung „durch all dies“ erkennbarer stehen.
  - severity: medium
    issue: Unpassende Fußnotenalternative „entweihen“
    rationale: Das Verb „entweihen“ verschiebt die Aussage von Unreinheit zu einer Profanierung des Heiligen und ist reflexiv hier zudem weniger natürlich. Eine Fußnote sollte eine tatsächliche lexikalische Alternative zu טמא bieten.
  revised_text: Macht euch nicht unrein durch all dies[a]; denn durch all dies sind die Völker unrein geworden, die ich vor euch vertreibe.
