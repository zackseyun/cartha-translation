  to: Macht euch nicht unrein durch all dies[a]; denn durch all dies sind die Völker unrein geworden, die ich vor euch vertreibe.
  rationale: Der Haupttext wird nur idiomatischer geordnet und bewahrt dabei die hebräische Wiederholung von „durch all dies“. Die Fußnote ersetzt „entweihen“ durch die sachlich passende Alternative „verunreinigen“ und erhält mit „wurden ... verunreinigt“ die mögliche passivische Wiedergabe des Niphal.
