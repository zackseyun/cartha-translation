source:
  edition: WLC
  text: אַל תִּֽטַּמְּא֖וּ בְּ/כָל אֵ֑לֶּה כִּ֤י בְ/כָל אֵ֨לֶּה֙ נִטְמְא֣וּ הַ/גּוֹיִ֔ם אֲשֶׁר אֲנִ֥י מְשַׁלֵּ֖חַ מִ/פְּנֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/024.yaml
  text: Do not make yourselves unclean by any of these things[a], for by all these things the nations that I am driving out before you became unclean.
translation:
  language: de
  text: Macht euch nicht unrein durch all dies[a]; denn durch all dies sind die Völker unrein geworden, die ich vor euch vertreibe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Verunreinigt euch nicht durch all dies; denn durch all dies wurden die Völker verunreinigt.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּטַּמְּאוּ
  choice: Macht euch nicht unrein
  rationale: אַל mit dem Imperfekt formuliert ein Verbot; der reflexive Ausdruck gibt den Hitpael von טמא wieder und bewahrt zugleich den levitischen Begriff der Unreinheit.
- source_word: בְּכָל אֵלֶּה
  choice: durch nichts von alledem
  rationale: ב bezeichnet hier Mittel oder Bereich. Im Deutschen verlangt das verneinte Verbot idiomatisch „durch nichts von alledem“, ohne den Bezug auf die zuvor genannten Handlungen zu verlieren.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet die Begründung des Verbots ein; „denn“ bildet diesen Zusammenhang knapp und natürlich ab.
- source_word: בְכָל אֵלֶּה נִטְמְאוּ
  choice: durch all das sind … unrein geworden
  rationale: Der Niphal von טמא bezeichnet hier den eingetretenen Zustand. „Unrein geworden“ erhält die Wortverbindung zum vorausgehenden Verb und lässt die passive beziehungsweise resultative Nuance offen.
- source_word: הַגּוֹיִם
  choice: die Völker
  rationale: Gemeint sind die nichtisraelitischen Bevölkerungsgruppen des Landes; „Völker“ ist sachlich und vermeidet die hier anachronistisch wirkende Bezeichnung „Heiden“.
- source_word: אֲשֶׁר אֲנִי מְשַׁלֵּחַ
  choice: die ich … vertreibe
  rationale: שׁלח bedeutet grundsätzlich „senden/wegschicken“, trägt im Zusammenhang des Landgerichts jedoch die Bedeutung des Vertreibens.
- source_word: מִפְּנֵיכֶם
  choice: vor euch
  rationale: Die wörtliche räumliche Wendung „von eurem Angesicht weg“ wird zusammen mit „vertreiben“ idiomatisch als „vor euch“ wiedergegeben.
theological_decisions:
- issue: Rituell-moralische Unreinheit in Levitikus 18
  choice: unrein machen / unrein werden
  alternative: sich entweihen / befleckt werden
  rationale: טמא bezeichnet in diesem Kapitel eine wirkliche Unreinheit aufgrund verbotener Handlungen. „Unrein“ wahrt die levitische Begrifflichkeit, ohne sie entweder auf bloß kultische Unreinheit einzuengen oder durch stärker wertende Wörter zu verschärfen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „unrein“ bildet die hebräische Wortwurzel טמא in beiden Satzteilen ab; die Alternative in der Fußnote bewahrt die mögliche stärker passive beziehungsweise traditionelle Wiedergabe.
