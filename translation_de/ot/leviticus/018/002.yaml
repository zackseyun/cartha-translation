id: LEV.18.2
reference: Leviticus 18:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/002.yaml
  text: Speak to the sons of Israel and say to them[b][a], ‘I am Yahweh your God.’
translation:
  language: de
  text: 'Rede zu den Söhnen Israels[a] und sag ihnen: »Ich bin Jahwe[b], euer Gott.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch »die Kinder Israels« oder »die Israeliten«. Wörtlich steht im Hebräischen »die Söhne Israels«, eine familiäre Bundesbezeichnung für das Volk Israel.
    reason: lexical_alternative
  - marker: b
    text: Hebräisch JHWH; traditionell mit »der HERR« wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: דַּבֵּר
  choice: Rede
  rationale: Der Imperativ leitet Gottes unmittelbaren Auftrag an Mose ein. »Rede« ist im Deutschen natürlich, würdig und bewahrt den mündlichen Charakter der Anweisung.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: zu den Söhnen Israels
  rationale: Die wörtliche familiäre Bundesbezeichnung »Söhne Israels« wird beibehalten; sie bezeichnet hier gemeinschaftlich das Volk Israel.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: und sag ihnen
  rationale: Die Fortsetzung des Auftrags wird direkt wiedergegeben. »Sag ihnen« unterscheidet das hebräische אמר hörbar vom vorausgehenden דבר, ohne im modernen Deutsch steif zu wirken.
- source_word: אֲנִי
  choice: Ich bin
  rationale: Das selbstständige Pronomen wird in der deutschen Identifikationsformel natürlich mit der Kopula wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als persönlicher Name »Jahwe« wiedergegeben und nicht durch den Titel »der HERR« ersetzt.
- source_word: אֱלֹהֵיכֶם
  choice: euer Gott
  rationale: אֱלֹהִים bezeichnet mit Bezug auf Jahwe den einen Gott; das Suffix der zweiten Person maskulin Plural wird mit »euer« wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich den Tetragrammaton. »Jahwe« bewahrt den offenbarten Bundesnamen, während »der HERR« ihn durch einen Titel ersetzt.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Kinder Israels; die Israeliten
  rationale: Die Übersetzung bewahrt die ausdrücklich familiäre, grammatisch maskuline Bundesbezeichnung. Zugleich macht die Fußnote deutlich, dass sie hier das Volk Israel als Gemeinschaft bezeichnet.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. »Rede … und sag« bewahrt die Abfolge zweier unterschiedlicher hebräischer Verben, ohne unnötig altertümlich zu klingen; die direkte Rede wird mit deutschen Anführungszeichen gesetzt.
