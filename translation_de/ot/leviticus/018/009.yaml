source:
  edition: WLC
  text: עֶרְוַ֨ת אֲחֽוֹתְ/ךָ֤ בַת אָבִ֨י/ךָ֙ א֣וֹ בַת אִמֶּ֔/ךָ מוֹלֶ֣דֶת בַּ֔יִת א֖וֹ מוֹלֶ֣דֶת ח֑וּץ לֹ֥א תְגַלֶּ֖ה עֶרְוָתָֽ/ן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/009.yaml
  text: You shall not uncover the nakedness of your sister[a], whether your father's daughter or your mother's daughter, born in the household or born outside it.
translation:
  language: de
  text: Die Blöße deiner Schwester darfst du nicht aufdecken, sei sie eine Tochter deines Vaters oder eine Tochter deiner Mutter, im Haus geboren oder außerhalb davon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in der Hausgemeinschaft geboren oder außerhalb“. Das Hebräische stellt eine Geburt „im Haus“ einer Geburt „außerhalb“ gegenüber.'
    reason: lexikalische Alternative und Erhalt der Mehrdeutigkeit von בַּיִת
lexical_decisions:
- source_word: עֶרְוַת / עֶרְוָתָן
  choice: die Blöße deiner Schwester
  rationale: „Blöße aufdecken“ bewahrt die feststehende rechtlich-sexuelle Wendung des Hebräischen. Das abschließende feminine Pluralsuffix fasst die zuvor genannten Fälle von Schwester zusammen und muss im Deutschen nicht eigens wiederholt werden.
- source_word: אֲחוֹתְךָ
  choice: deine Schwester
  rationale: Die direkte Verwandtschaftsbezeichnung und die männliche Einzelanrede des Gesetzestextes bleiben erhalten.
- source_word: בַת אָבִיךָ / בַת אִּמֶּךָ
  choice: eine Tochter deines Vaters / eine Tochter deiner Mutter
  rationale: Die parallelen Formulierungen geben die väterliche beziehungsweise mütterliche Verwandtschaft präzise wieder und schließen Halb- wie Vollschwestern ein, ohne zusätzliche Kategorien einzuführen.
- source_word: מוֹלֶדֶת
  choice: geboren
  rationale: Das Wort bezeichnet hier die Geburt beziehungsweise Herkunft; „geboren“ ist im Deutschen klar und natürlich.
- source_word: בַּיִת / חוּץ
  choice: im Haus / außerhalb davon
  rationale: Die räumlich-soziale Gegenüberstellung von „Haus“ und „draußen/außerhalb“ wird eng am Hebräischen wiedergegeben; die mögliche Bedeutung „Hausgemeinschaft“ wird in der Fußnote kenntlich gemacht.
- source_word: לֹא תְגַלֶּה
  choice: darfst du nicht aufdecken
  rationale: Die Formulierung gibt das bindende Verbot in natürlichem modernem Deutsch wieder und bewahrt zugleich das Verb der hebräischen Wendung.
- source_word: אוֹ ... אוֹ
  choice: sei sie ... oder
  rationale: Diese deutsche Konstruktion bildet die beiden ausdrücklich genannten Alternativen flüssig und präzise ab.
theological_decisions:
- issue: Umfang des verbotenen Verwandtschaftsverhältnisses
  choice: Das Verbot umfasst die Schwester väterlicher- oder mütterlicherseits, unabhängig davon, ob sie im Haus oder außerhalb geboren wurde.
  alternative: Die Schlussbestimmungen können stärker als Unterscheidung zwischen im eigenen Haushalt und anderswo geborenen Schwestern verstanden werden.
  rationale: Der hebräische Rechtssatz entfaltet die Kategorie „deine Schwester“, statt sie einzuschränken. Die Übersetzung wahrt diesen umfassenden Charakter, ohne spätere rechtliche oder konfessionelle Kategorien einzutragen.
translation_notes:
  register: Moderner, würdevoller Gesetzesstil. Die traditionelle, im Zusammenhang verständliche Wendung „die Blöße aufdecken“ erhält den rechtlich-sexuellen Charakter des Ausgangstextes; „darfst du nicht“ vermeidet zugleich unnötig altertümliches Deutsch.
