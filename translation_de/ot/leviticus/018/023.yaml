  source_fidelity: 'Der Entwurf gibt die beiden Verbote, die geschlechtliche Bedeutung der hebräischen Idiome sowie die abschließende Wertung תֶּבֶל insgesamt zutreffend wieder. Die passive Wiedergabe im zweiten Teilsatz bildet korrekt ab, dass die Frau im hebräischen Ausdruck Objekt des Begattens ist. Bei לְטָמְאָה בָהּ ist jedoch „dich an ihm verunreinigen“ im Deutschen semantisch und idiomatisch weniger passend: בָּהּ bezeichnet die Beteiligung des Tieres an der Verunreinigung, nicht ein Verunreinigen „an“ ihm.'
  naturalness: „Sich an einem Tier verunreinigen“ ist im heutigen Standarddeutsch unnatürlich und kann die beabsichtigte Beziehung verdunkeln. „Sich dadurch verunreinigen“ ist klar, natürlich und lässt die hebräische Zweck-/Folgebeziehung offen. Die übrige Formulierung wahrt einen sachlichen, würdevollen Registerton.
  terminology: „Geschlechtlich verkehren“ ist eine angemessene natürliche Entfaltung der hebräischen Wendung. „Begatten“ gibt רבע im Kontext präzise wieder. „Verkehrtheit“ ist als zurückhaltende Wiedergabe von תֶּבֶל vertretbar und vermeidet eine übermäßig spezifizierende oder klinisch aufgeladene Deutung; die Fußnote dokumentiert die Bedeutungsbreite.
