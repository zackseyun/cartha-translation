- from: Mit keinem Tier sollst du geschlechtlich verkehren und dich dadurch an ihm verunreinigen[a]. Eine Frau soll sich nicht vor ein Tier stellen, um sich von ihm begatten zu lassen[b]; das ist eine Verkehrtheit[c].
  to: Mit keinem Tier sollst du geschlechtlich verkehren und dich dadurch verunreinigen[a]. Eine Frau soll sich nicht vor ein Tier stellen, um sich von ihm begatten zu lassen[b]; das ist eine Verkehrtheit[c].
  rationale: Die Revision beschränkt sich auf die idiomatische und semantisch klarere Wiedergabe von לְטָמְאָה בָהּ. Der Haupttext verwendet nun „dadurch“, während die Fußnote die wörtliche Bezugnahme auf das Tier mit dem im Deutschen passenden Pronomen „daran“ dokumentiert. Die Aussage, die Ambiguität von Zweck und Folge sowie die übrigen Übersetzungsentscheidungen bleiben erhalten.
