  text: וּ/בְ/כָל בְּהֵמָ֛ה לֹא תִתֵּ֥ן שְׁכָבְתְּ/ךָ֖ לְ/טָמְאָה בָ֑/הּ וְ/אִשָּׁ֗ה לֹֽא תַעֲמֹ֞ד לִ/פְנֵ֧י בְהֵמָ֛ה לְ/רִבְעָ֖/הּ תֶּ֥בֶל הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/023.yaml
  text: And with any animal you shall not give your lying[a] to become unclean with it, and a woman shall not stand before an animal to mate with it[c][b]; it is a perversion.
translation:
  language: de
  text: Mit keinem Tier sollst du geschlechtlich verkehren und dich dadurch verunreinigen[a]. Eine Frau soll sich nicht vor ein Tier stellen, um sich von ihm begatten zu lassen[b]; das ist eine Verkehrtheit[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „deinen Beischlaf geben, um dich daran zu verunreinigen“; der Infinitiv kann Zweck oder Folge ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Verb bezeichnet hier das Besteigen beziehungsweise den Geschlechtsverkehr eines Tieres mit der Frau.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „ein Verstoß gegen die Ordnung“, „eine Schandtat“; das seltene hebräische Wort bezeichnet besonders im sexuellen Zusammenhang eine schwere Verkehrung der gehörigen Ordnung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל בְּהֵמָה
  choice: Mit keinem Tier
  rationale: Die Verbindung von כָּל mit der Verneinung ergibt im Deutschen natürlich „mit keinem“. בְּהֵמָה bezeichnet hier allgemein ein Tier; eine Beschränkung auf Nutz- oder Haustiere ist nicht nötig.
- source_word: לֹא תִתֵּן שְׁכָבְתְּךָ
  choice: sollst du geschlechtlich verkehren
  rationale: Wörtlich steht „sollst du deinen Beischlaf nicht geben“. Die hebräische Wendung bezeichnet hier eindeutig den Geschlechtsverkehr. Die gewählte Form gibt den Sinn in natürlichem, würdigem Deutsch wieder; die wörtliche Ausdrucksweise wird in der Fußnote bewahrt.
- source_word: לְטָמְאָה בָהּ
  choice: und dich dadurch an ihm verunreinigen
  rationale: Der Infinitiv bezeichnet Zweck oder Folge des Geschlechtsverkehrs. „Verunreinigen“ erhält die biblische Kategorie der Unreinheit, ohne sie ausschließlich rituell zu verstehen.
- source_word: וְאִשָּׁה
  choice: Eine Frau
  rationale: אִשָּׁה ist hier allgemein als „Frau“ zu verstehen, nicht speziell als „Ehefrau“.
- source_word: לֹא תַעֲמֹד לִפְנֵי בְהֵמָה
  choice: soll sich nicht vor ein Tier stellen
  rationale: Die räumliche Wendung wird transparent wiedergegeben; der folgende Infinitiv nennt den sexuellen Zweck.
- source_word: לְרִבְעָהּ
  choice: um sich von ihm begatten zu lassen
  rationale: Die Wurzel רבע bezeichnet in diesem Zusammenhang das Besteigen beziehungsweise Begatten. Das feminine Suffix macht die Frau zum Objekt des Vorgangs; die passive deutsche Form bildet dies genauer ab als das gegenseitig klingende „sich paaren“.
- source_word: תֶּבֶל
  choice: Verkehrtheit
  rationale: Das seltene Wort bezeichnet einen schweren Verstoß gegen die rechte Ordnung, besonders im sexuellen Bereich. „Verkehrtheit“ bewahrt das Urteil, ohne eine spätere fachsprachliche oder konfessionelle Kategorie einzutragen.
- source_word: הוּא
  choice: das ist
  rationale: Das Pronomen fasst den beschriebenen Vorgang auf natürliche Weise zusammen und spricht darüber das abschließende Urteil aus.
theological_decisions:
- issue: Unreinheit als rituelle und moralische Kategorie
  choice: dich dadurch an ihm verunreinigen
  alternative: dadurch unrein werden / dich mit ihm unrein machen
  rationale: Die Formulierung erhält die Unreinheitssprache des Textes, beschränkt sie aber weder auf kultische Unreinheit noch ersetzt sie sie durch eine spätere dogmatische Kategorie.
- issue: Bewertung durch תֶּבֶל
  choice: Verkehrtheit
  alternative: Ordnungswidrigkeit / Schandtat / widernatürliche Vermischung
  rationale: Das hebräische Wort enthält die Vorstellung eines schweren Verstoßes gegen die gehörige Ordnung. Die gewählte Wiedergabe lässt den genauen Bedeutungsumfang offen und vermeidet, „Natur“ ausdrücklich einzuführen, da dieses Substantiv im Ausgangstext nicht steht.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die schwer verständliche wörtliche Wendung „den Beischlaf geben“ steht in der Fußnote, während der Haupttext den eindeutigen sexuellen Sinn natürlich ausdrückt. „Begatten“ ist sachlich und präzise, ohne unnötig derb zu wirken.
