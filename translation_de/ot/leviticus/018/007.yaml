source:
  edition: WLC
  text: עֶרְוַ֥ת אָבִ֛י/ךָ וְ/עֶרְוַ֥ת אִמְּ/ךָ֖ לֹ֣א תְגַלֵּ֑ה אִמְּ/ךָ֣ הִ֔וא לֹ֥א תְגַלֶּ֖ה עֶרְוָתָֽ/הּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/007.yaml
  text: You shall not uncover the nakedness of your father[a], that is, the nakedness of your mother. She is your mother; you shall not uncover her nakedness.
translation:
  language: de
  text: Die Blöße deines Vaters[a] und die Blöße deiner Mutter darfst du nicht aufdecken. Sie ist deine Mutter; ihre Blöße darfst du nicht aufdecken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Die Blöße deines Vaters und die Blöße deiner Mutter.“ Der folgende Satz bezeichnet sie als deine Mutter; daher wird die Wendung häufig so verstanden, dass die Blöße der Mutter zugleich als die Blöße des Vaters gilt.'
    reason: alternative_reading
lexical_decisions:
- source_word: עֶרְוַת
  choice: die Blöße
  rationale: Das hebräische עֶרְוָה bezeichnet hier innerhalb der festen Rechtsformel גלה ערוה die entblößte Intimsphäre und dient als verhüllender Ausdruck für verbotene sexuelle Beziehungen. „Blöße“ bewahrt Bildsprache und Rechtscharakter, ohne den Sinn unnötig auszudeuten.
- source_word: תְגַלֵּה / תְגַלֶּה
  choice: du darfst … nicht aufdecken
  rationale: Das Piel von גלה bildet mit עֶרְוָה die wiederkehrende Verbotsformel dieses Kapitels. „Nicht aufdecken“ erhält die bewusste Wiederholung und den Euphemismus; „du darfst nicht“ formuliert das Verbot in natürlichem modernem Deutsch.
- source_word: אָבִיךָ
  choice: deines Vaters
  rationale: Direkte Wiedergabe des Verwandtschaftsbegriffs mit dem Suffix der zweiten Person Singular.
- source_word: וְעֶרְוַת אִמְּךָ
  choice: das heißt die Blöße deiner Mutter
  rationale: Obwohl וְ formal mit „und“ wiedergegeben werden kann, legt der folgende erklärende Satz „Sie ist deine Mutter“ nahe, die zweite Nominalgruppe als Erläuterung der ersten zu verstehen. „Das heißt“ macht diesen Zusammenhang deutlich; die formal koordinierende Lesart bleibt in der Fußnote erhalten.
- source_word: הִוא
  choice: Sie ist
  rationale: Das feminine Singularpronomen bezieht sich auf die Mutter und ist zur Hervorhebung ausdrücklich gesetzt.
- source_word: אִמְּךָ
  choice: deine Mutter
  rationale: Der wiederholte Verwandtschaftsbegriff wird zur Wahrung von Nachdruck und rechtlicher Klarheit ebenfalls wiederholt.
theological_decisions:
- issue: Verhältnis zwischen „der Blöße deines Vaters“ und „der Blöße deiner Mutter“
  choice: 'Die zweite Wendung wird als erklärende Apposition wiedergegeben: „die Blöße deines Vaters, das heißt die Blöße deiner Mutter“ (vgl. die im Deutschen nötige Kasusanpassung im Haupttext).'
  alternative: 'Formal koordinierend: „die Blöße deines Vaters und die Blöße deiner Mutter“'
  rationale: Der Nachsatz „Sie ist deine Mutter“ stützt die Deutung, dass die Blöße des Vaters hier durch die Mutter bezeichnet wird. Die Übersetzung wahrt damit die Logik familiärer Zugehörigkeit und Ehre, ohne die formal mögliche koordinierende Lesart zu verschweigen.
translation_notes:
  register: Moderne, würdevolle Rechtssprache mit bewahrtem biblischem Euphemismus. „Blöße aufdecken“ ist bewusst weniger explizit als eine Paraphrase mit „sexuelle Beziehungen haben“, bleibt aber durch den Zusammenhang des Kapitels verständlich. Die Anrede steht entsprechend dem hebräischen Text im maskulinen Singular.
