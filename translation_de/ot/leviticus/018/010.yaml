  text: עֶרְוַ֤ת בַּת בִּנְ/ךָ֙ א֣וֹ בַֽת בִּתְּ/ךָ֔ לֹ֥א תְגַלֶּ֖ה עֶרְוָתָ֑/ן כִּ֥י עֶרְוָתְ/ךָ֖ הֵֽנָּה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/010.yaml
  text: You shall not uncover the nakedness of your son's daughter or of your daughter's daughter[b][a], for their nakedness is your own.
translation:
  language: de
  text: Die Blöße der Tochter deines Sohnes oder der Tochter deiner Tochter darfst du nicht aufdecken[a], denn sie sind deine Blöße[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Idiom „die Blöße aufdecken“ bedeutet hier, sexuelle Beziehungen zu jemandem zu haben.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „denn sie sind deine Blöße“. Die Aussage fasst diese nahen Nachfahrinnen als Teil des eigenen familiären Bereichs auf und begründet damit das sexuelle Verbot.'
    reason: cultural_note
lexical_decisions:
- source_word: עֶרְוַת / עֶרְוָתָן / עֶרְוָתְךָ
  choice: Blöße
  rationale: „Blöße“ bewahrt das wiederkehrende hebräische Rechtsidiom und ermöglicht auch im Schlusssatz die enge formale Entsprechung. Im Zusammenhang bezeichnet „die Blöße aufdecken“ verhüllend sexuelle Beziehungen.
- source_word: בַּת בִּנְךָ
  choice: die Tochter deines Sohnes
  rationale: Die direkte Verwandtschaftsbezeichnung erhält die rechtliche Genauigkeit und die parallele Struktur des Hebräischen.
- source_word: בַת בִּתְּךָ
  choice: die Tochter deiner Tochter
  rationale: Die formal nahe Wiedergabe wahrt die Unterscheidung beider Abstammungslinien.
- source_word: לֹא תְגַלֶּה
  choice: darfst du nicht aufdecken
  rationale: Die Formulierung gibt das Verbot in natürlichem modernem Deutsch wieder und erhält zugleich das feste Idiom des Kapitels.
- source_word: כִּי
  choice: denn
  rationale: „Denn“ bewahrt die begründende Funktion der Konjunktion in einem würdigen rechtlichen Register.
- source_word: הֵנָּה
  choice: sie sind
  rationale: Das feminine Pluralpronomen bezieht sich auf die beiden genannten Enkelinnen; die prädikative Aussage wird ohne interpretierende Umformung erhalten.
theological_decisions:
- issue: Bedeutung der Begründung כִּי עֶרְוָתְךָ הֵנָּה („denn sie sind deine Blöße“)
  choice: Die bildhafte Identitätsaussage wird im Haupttext wörtlich bewahrt.
  alternative: „denn ihre Blöße ist deine eigene“ oder deutender „denn sie sind dein eigenes Fleisch“
  rationale: Der hebräische Wortlaut bezeichnet die nahen Nachfahrinnen als zur eigenen „Blöße“ gehörig. Die wörtliche Fassung erhält die familienbezogene Begründungslogik und ihre Spannung, ohne sie auf eine einzelne moderne Erklärung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst beibehaltener Rechtssprache und dem leitenden Euphemismus des Kapitels. Die beiden parallelen Verwandtschaftsangaben werden formal eng wiedergegeben.
