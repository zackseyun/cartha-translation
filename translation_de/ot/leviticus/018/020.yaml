  - severity: low
    issue: Die Fußnote formuliert das hebräische Bild unnötig frei und zugleich missverständlich.
    rationale: „Deinen Beischlaf nicht als Samen geben“ ist kein gut verständliches deutsches wörtliches Äquivalent. „Dein Lager/deinen Beischlaf zum Samen geben“ macht die ungewöhnliche Bildsprache als solche erkennbar; die Hauptübersetzung erklärt ihre idiomatische Bedeutung.
