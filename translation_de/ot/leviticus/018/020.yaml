  source_fidelity: Der Haupttext gibt das Verbot des Geschlechtsverkehrs mit der Frau eines Mitmenschen zutreffend wieder. Die abschließende Präpositionalwendung בָּהּ ist im Deutschen mit „an ihr“ näher und idiomatischer wiederzugeben als mit „mit ihr“, das ein gemeinsames Verunreinigtwerden nahelegen kann. Die Fußnote sollte das hebräische Bild als „Lager/Beischlaf … zum Samen geben“ kenntlich machen, ohne die Wendung fälschlich als schlichtes „Samengeben“ zu glätten.
  naturalness: „Du sollst mit der Frau deines Nächsten keinen Geschlechtsverkehr haben“ ist klar, sachlich und für modernen Gesetzesstil angemessen. „Dich dadurch an ihr verunreinigen“ ist im Deutschen sowohl natürlich als auch in religiös-rechtlichem Register verständlich.
  terminology: „Frau deines Nächsten“ gibt אֵשֶׁת עֲמִיתְךָ angemessen wieder. „Geschlechtsverkehr“ erschließt das Idiom im Haupttext. „Verunreinigen“ wahrt die Breite von טמא, ohne die Aussage einseitig auf rituelle oder moralische Unreinheit festzulegen.
