  text: וְ/אֶל אֵ֨שֶׁת֙ עֲמִֽיתְ/ךָ֔ לֹא תִתֵּ֥ן שְׁכָבְתְּ/ךָ֖ לְ/זָ֑רַע לְ/טָמְאָה בָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/020.yaml
  text: You shall not have sexual relations[a] with your neighbor’s wife and so defile yourself with her.
translation:
  language: de
  text: Du sollst mit der Frau deines Nächsten keinen Geschlechtsverkehr haben[a] und dich dadurch an ihr verunreinigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Du sollst der Frau deines Nächsten dein Lager nicht zum Samen geben.«'
    reason: source_idiom
lexical_decisions:
- source_word: אֵשֶׁת עֲמִיתְךָ
  choice: die Frau deines Nächsten
  rationale: עָמִית bezeichnet hier einen Mitmenschen beziehungsweise ein Mitglied der Gemeinschaft. „Die Frau deines Nächsten“ ist im deutschen Rechtston natürlich und präzise.
- source_word: לֹא תִתֵּן שְׁכָבְתְּךָ לְזָרַע
  choice: Du sollst … keinen Geschlechtsverkehr haben
  rationale: Die hebräische Wendung beschreibt wörtlich das Geben des Beischlafs beziehungsweise Samenergusses „als Samen“ und bezeichnet idiomatisch den Geschlechtsverkehr. Die sinngemäße Wiedergabe macht das Verbot klar; das konkrete Sprachbild bleibt in der Fußnote erhalten.
- source_word: לְטָמְאָה בָהּ
  choice: und dich dadurch mit ihr verunreinigen
  rationale: Der Infinitiv bezeichnet die mit der Handlung verbundene Verunreinigung des Angesprochenen. „Dadurch“ gibt den resultativen Zusammenhang wieder, ohne die Art der Unreinheit enger festzulegen als der hebräische Text.
theological_decisions:
- issue: Art des Verbots und Bedeutung der Verunreinigung
  choice: Verbot des Geschlechtsverkehrs mit der Frau des Nächsten, wodurch sich der Angesprochene mit ihr verunreinigt
  alternative: Die Wendung über Samenerguss im Haupttext wörtlich wiedergeben oder die Verunreinigung ausdrücklich als rituelle Unreinheit bestimmen
  rationale: Das hebräische Idiom bezeichnet Geschlechtsverkehr, während der Schlusssatz die Verunreinigung nennt. Die Übersetzung wahrt diese beiden Aussagen, ohne die Verunreinigung ausschließlich rituell zu deuten.
translation_notes:
  register: Moderner, würdiger deutscher Gesetzesstil. „Geschlechtsverkehr haben“ ist klar und sachlich; „verunreinigen“ bewahrt die kultisch-moralische Bedeutungsbreite von טמא.
