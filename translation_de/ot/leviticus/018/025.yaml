  text: וַ/תִּטְמָ֣א הָ/אָ֔רֶץ וָ/אֶפְקֹ֥ד עֲוֺנָ֖/הּ עָלֶ֑י/הָ וַ/תָּקִ֥א הָ/אָ֖רֶץ אֶת יֹשְׁבֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/025.yaml
  text: So the land became unclean[a], and I punished its iniquity upon it[c][b], and the land vomited out its inhabitants.
translation:
  language: de
  text: So wurde das Land unrein[a], und ich bestrafte es für seine Schuld[b], und das Land spie seine Bewohner aus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wurde verunreinigt“. Das hebräische Verb kann sowohl den eingetretenen Zustand als auch das Verunreinigtwerden hervorheben.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „Ich suchte seine Schuld an ihm heim“; gemeint ist, dass Gott die Schuld im Gericht zur Rechenschaft zieht.'
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Verb bedeutet wörtlich „erbrechen“. Das drastische Bild stellt dar, wie das verunreinigte Land seine Bewohner ausstößt.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּטְמָא
  choice: wurde unrein
  rationale: Das Verb beschreibt, dass das Land infolge der zuvor genannten Gräuel in einen Zustand kultischer und moralischer Unreinheit geriet. „Wurde unrein“ bewahrt den resultativen Sinn, ohne die mögliche passive Nuance auszuschließen.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Im Zusammenhang von Levitikus 18 ist konkret das Land Kanaan gemeint; „Land“ ist daher präziser als „Erde“.
- source_word: וָאֶפְקֹד
  choice: ich bestrafte
  rationale: פקד bezeichnet in Verbindung mit עון das Einschreiten gegen Schuld beziehungsweise ihre Ahndung. „Ich bestrafte“ gibt die idiomatische Bedeutung in natürlichem Deutsch wieder und erhält Gottes unmittelbares Handeln.
- source_word: עֲוֺנָהּ
  choice: seine Schuld
  rationale: עון kann Vergehen, Schuld oder deren Folge bezeichnen. „Schuld“ bewahrt die moralische und rechtliche Spannung und passt im Deutschen zur Wendung „für seine Schuld bestrafen“.
- source_word: עָלֶיהָ
  choice: es für
  rationale: Die hebräische Konstruktion „seine Schuld an/über ihm heimsuchen“ wird idiomatisch als „es für seine Schuld bestrafen“ wiedergegeben; der Bezug auf das Land bleibt dabei eindeutig.
- source_word: וַתָּקִא
  choice: spie … aus
  rationale: קיא bezeichnet wörtlich das Erbrechen. „Spie … aus“ erhält das drastische Bild und die Personifikation des Landes.
- source_word: יֹשְׁבֶיהָ
  choice: seine Bewohner
  rationale: Das Partizip von ישב bezeichnet kollektiv die im Land Wohnenden. „Seine Bewohner“ ist knapp, natürlich und sachlich genau.
theological_decisions:
- issue: Personifikation des Landes als auf Verunreinigung reagierend
  choice: 'Das konkrete Bild bleibt erhalten: Das Land „spie seine Bewohner aus“.'
  alternative: Das Land vertrieb seine Bewohner.
  rationale: Der hebräische Text verbindet Verunreinigung, göttliches Gericht und Vertreibung durch eine bewusst drastische Personifikation. Eine abstrakte Wiedergabe würde diese theologische Bildsprache abschwächen.
- issue: Göttliches Gericht in וָאֶפְקֹד עֲוֺנָהּ עָלֶיהָ
  choice: „Ich bestrafte es für seine Schuld“
  alternative: „Ich suchte seine Schuld an ihm heim“ beziehungsweise „ich zog es wegen seiner Schuld zur Rechenschaft“
  rationale: Die gewählte Formulierung macht den idiomatischen Gerichtssinn deutlich, bewahrt Gottes direkte Urheberschaft und lässt die im Text ungewöhnliche Zuschreibung von Schuld an das Land stehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „das Land“ und die Abfolge mit „und“ bewahren den markanten Rhythmus sowie die Personifikation des hebräischen Textes. Das kräftige „spie … aus“ wird nicht zu „vertrieb“ abgeschwächt.
