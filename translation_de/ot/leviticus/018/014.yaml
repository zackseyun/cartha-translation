source:
  edition: WLC
  text: עֶרְוַ֥ת אֲחִֽי אָבִ֖י/ךָ לֹ֣א תְגַלֵּ֑ה אֶל אִשְׁתּ/וֹ֙ לֹ֣א תִקְרָ֔ב דֹּדָֽתְ/ךָ֖ הִֽוא־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/014.yaml
  text: You shall not uncover the nakedness of your father's brother; you shall not approach his wife[a]. She is your aunt.
translation:
  language: de
  text: Die Blöße des Bruders deines Vaters sollst du nicht aufdecken. Seiner Frau sollst du nicht nahekommen[a]; sie ist deine Tante.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „nahekommen“; im Zusammenhang dieser Inzestverbote ist damit sexuelle Annäherung beziehungsweise sexueller Verkehr gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת
  choice: die Blöße
  rationale: Bewahrt die konkrete Ausdrucksweise der festen Rechtsformel „die Blöße aufdecken“, die in Levitikus 18 sexuelle Beziehungen bezeichnet, ohne sie durch eine auslegende Umschreibung zu ersetzen.
- source_word: אֲחִי אָבִיךָ
  choice: des Bruders deines Vaters
  rationale: Gibt die genaue Verwandtschaftsbezeichnung und die hebräische Konstruktion transparent wieder; „deines Onkels“ wäre natürlicher, aber weniger spezifisch.
- source_word: לֹא תְגַלֵּה
  choice: sollst du nicht aufdecken
  rationale: „Aufdecken“ entspricht dem Piel von גלה innerhalb der wiederkehrenden Rechtsformel; „sollst du nicht“ wahrt den würdevollen Verbotsstil.
- source_word: אֶל אִשְׁתּוֹ לֹא תִקְרָב
  choice: Seiner Frau sollst du nicht nahekommen
  rationale: „Nahekommen“ bewahrt den zurückhaltenden Wortlaut von קרב mit אֶל. Im Zusammenhang der Inzestverbote hat das Verb sexuelle Bedeutung, die eine Fußnote erläutert.
- source_word: דֹּדָתְךָ
  choice: deine Tante
  rationale: דּוֹדָה bezeichnet hier die Frau des Bruders des Vaters. „Tante“ ist die natürliche deutsche Entsprechung; der vorherige Satz bestimmt die Beziehung genauer.
- source_word: הִוא
  choice: sie ist
  rationale: Gibt den prädikativen Gebrauch des Pronomens direkt wieder, ohne ein begründendes „denn“ oder „weil“ hinzuzufügen.
theological_decisions:
- issue: Wiedergabe der Rechtsformel für verbotene sexuelle Beziehungen
  choice: Die Wendung „die Blöße … aufdecken“ bleibt im Haupttext erhalten.
  alternative: Ausdeutende Wiedergabe wie „sexuelle Beziehungen haben“.
  rationale: Die konkrete, im Kapitel wiederkehrende Formel soll sichtbar bleiben. Der Kontext und die Fußnote machen ihre sexuelle Bedeutung verständlich, ohne die Bildsprache einzuebnen.
- issue: Bestimmung des Verwandtschaftsverhältnisses
  choice: Der Schlusssatz lautet „sie ist deine Tante“.
  alternative: „Sie ist die Frau des Bruders deines Vaters“ oder „sie ist deine angeheiratete Tante“.
  rationale: Der hebräische Text verwendet hier den gewöhnlichen Verwandtschaftsbegriff; der vorausgehende Satz hat das genaue Verhältnis bereits angegeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener Rechtsformel. Die etwas formelle Verwandtschaftsangabe wahrt die Präzision des Hebräischen; Satzteilung und Voranstellung von „Seiner Frau“ sorgen für Klarheit.
