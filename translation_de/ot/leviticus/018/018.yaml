  text: וְ/אִשָּׁ֥ה אֶל אֲחֹתָ֖/הּ לֹ֣א תִקָּ֑ח לִ/צְרֹ֗ר לְ/גַלּ֧וֹת עֶרְוָתָ֛/הּ עָלֶ֖י/הָ בְּ/חַיֶּֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/018.yaml
  text: And you shall not take a woman in addition to her sister as a rival wife[a], to uncover her nakedness while her sister is still alive.
translation:
  language: de
  text: Und du sollst eine Frau nicht zusätzlich zu ihrer Schwester als Rivalin nehmen, um ihre Blöße aufzudecken, solange ihre Schwester lebt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Du sollst eine Frau nicht zusätzlich zu ihrer Schwester nehmen, um sie zur Rivalin zu machen.« Das Hebräische ist knapp formuliert. Gemeint ist, dass ein Mann die Schwester seiner Frau nicht zu deren Lebzeiten als weitere Frau nehmen soll.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִשָּׁה
  choice: Und ... eine Frau
  rationale: אִשָּׁה kann »Frau« oder »Ehefrau« bedeuten. Das Verb »nehmen« und der rechtliche Zusammenhang machen den ehelichen Sinn hinreichend deutlich, ohne ihn in das Substantiv hineinzulesen.
- source_word: אֶל אֲחֹתָהּ
  choice: zusätzlich zu ihrer Schwester
  rationale: Die Präposition אֶל bezeichnet hier die Beziehung der hinzugenommenen Frau zu ihrer Schwester. »Zusätzlich zu« gibt den Gedanken einer weiteren Ehefrau im Deutschen natürlich wieder.
- source_word: לֹא תִקָּח
  choice: du sollst ... nicht nehmen
  rationale: Die Formulierung bewahrt den würdigen, rechtlichen Ton des hebräischen Verbots.
- source_word: לִצְרֹר
  choice: sodass sie zu Rivalinnen werden
  rationale: Der Infinitiv von צרר beschreibt hier die entstehende Rivalität oder Bedrängnis. Die Wiedergabe lässt offen, welche Schwester grammatisch als Rivalin bezeichnet wird, und bringt die wechselseitige Beziehung idiomatisch zum Ausdruck.
- source_word: לְגַלּוֹת עֶרְוָתָהּ
  choice: ihre Blöße aufdecken
  rationale: Die feste levitische Wendung ist ein Euphemismus für Geschlechtsverkehr. Ihre bildhafte Form bleibt aus Gründen der Quellentreue und innerbiblischen Konsistenz erhalten.
- source_word: עָלֶיהָ בְּחַיֶּיהָ
  choice: solange ihre Schwester lebt
  rationale: Die kompakte hebräische Formulierung bezeichnet das Hinzunehmen neben der ersten Frau während deren Lebenszeit. Die explizite Wiederaufnahme von »Schwester« verhindert im Deutschen eine irreführende Zuordnung des Pronomens.
theological_decisions:
- issue: Reichweite des Verbots hinsichtlich Mehrehe und Ehe mit zwei Schwestern
  choice: Verboten wird, die Schwester einer Frau zu deren Lebzeiten als weitere Frau hinzuzunehmen, wodurch Rivalität entsteht.
  alternative: Das Verbot gilt auch nach dem Tod der ersten Schwester oder untersagt allgemein jede Ehe, die Rivalität hervorruft.
  rationale: לִצְרֹר und בְּחַיֶּיהָ beziehen das Verbot am natürlichsten auf das gleichzeitige eheliche Verhältnis mit zwei Schwestern. Die Übersetzung erweitert die Vorschrift nicht über diesen ausdrücklich genannten zeitlichen Rahmen hinaus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter Rechtssprache. Der traditionelle Ausdruck »die Blöße aufdecken« erhält das charakteristische levitische Bild; die rivalitätsbezogene Infinitivkonstruktion wird verständlich, aber nicht konfessionell zugespitzt wiedergegeben.
