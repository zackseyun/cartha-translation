id: LEV.18.8
reference: Leviticus 18:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: עֶרְוַ֥ת אֵֽשֶׁת אָבִ֖י/ךָ לֹ֣א תְגַלֵּ֑ה עֶרְוַ֥ת אָבִ֖י/ךָ הִֽוא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/008.yaml
  text: You shall not uncover the nakedness of your father's wife[a]; it is your father's nakedness.
translation:
  language: de
  text: Die Blöße der Frau deines Vaters sollst du nicht aufdecken[a]; sie ist die Blöße deines Vaters.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder deutlicher: „Du sollst keine sexuellen Beziehungen mit der Frau deines Vaters haben.“ Wörtlich heißt es im Hebräischen: „die Blöße aufdecken“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת
  choice: die Blöße
  rationale: Bewahrt die wiederkehrende hebräische Rechtsformel „die Blöße aufdecken“ und ihren verhüllenden Charakter; im Zusammenhang bezeichnet sie verbotene sexuelle Beziehungen.
- source_word: אֵשֶׁת אָבִיךָ
  choice: die Frau deines Vaters
  rationale: אֵשֶׁת ist eine Status- bzw. Beziehungsbezeichnung und meint hier die mit dem Vater verheiratete Frau. „Frau“ ist im Deutschen dafür idiomatisch und umfasst auch eine Frau des Vaters, die nicht die Mutter des Angesprochenen ist.
- source_word: לֹא תְגַלֵּה
  choice: sollst du nicht aufdecken
  rationale: Gibt das negierte Imperfekt im gesetzlichen Kontext als verbindliches Verbot wieder und erhält zugleich das Bild des hebräischen Verbs.
- source_word: אָבִיךָ
  choice: deines Vaters
  rationale: Direkte Wiedergabe der Possessivkonstruktion; die Wiederholung wird entsprechend dem Hebräischen beibehalten.
- source_word: הִוא
  choice: sie ist
  rationale: Das feminine Pronomen greift grammatisch „die Blöße“ auf. Das deutsche „sie“ bewahrt diesen Rückbezug natürlich.
theological_decisions:
- issue: Ob die verhüllende Rechtsformel ausdrücklich als Verbot sexueller Beziehungen wiederzugeben ist
  choice: Die Wendung „die Blöße … aufdecken“ bleibt im Haupttext erhalten.
  alternative: Du sollst keine sexuellen Beziehungen mit der Frau deines Vaters haben.
  rationale: Die feste hebräische Formel prägt das ganze Kapitel. Ihre Bewahrung erhält die sprachliche Verknüpfung und löst den Euphemismus nicht stillschweigend in eine einzige explizite Formulierung auf; die gemeinte sexuelle Bedeutung wird in der Fußnote erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusster Nähe zur wiederkehrenden Rechtssprache des hebräischen Kapitels. „Blöße“ ist gehoben, aber verständlich und bewahrt den Euphemismus; die explizite Bedeutung steht in der Fußnote.
