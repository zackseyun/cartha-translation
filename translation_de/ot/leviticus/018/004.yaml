  text: אֶת מִשְׁפָּטַ֧/י תַּעֲשׂ֛וּ וְ/אֶת חֻקֹּתַ֥/י תִּשְׁמְר֖וּ לָ/לֶ֣כֶת בָּ/הֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/004.yaml
  text: You shall do my judgments[a], and you shall keep my statutes, to walk in them. I am Yahweh your God.
translation:
  language: de
  text: Ihr sollt meine Rechtsbestimmungen befolgen und meine Satzungen einhalten, um nach ihnen zu leben.[a] Ich bin Jahwe, euer Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in ihnen gehen“. Das hebräische Bild bezeichnet eine Lebensführung nach Gottes Bestimmungen.'
    reason: Die Fußnote macht die wörtliche hebräische Metapher sichtbar und erläutert knapp ihren idiomatischen Sinn.
lexical_decisions:
- source_word: מִשְׁפָּטַי
  choice: meine Rechtsbestimmungen
  rationale: מִשְׁפָּט bezeichnet hier verbindliche rechtliche Entscheidungen oder Ordnungen. „Rechtsbestimmungen“ bewahrt den rechtlichen Gehalt und bleibt von חֻקֹּתַי unterscheidbar.
- source_word: תַּעֲשׂוּ
  choice: nach … handeln
  rationale: Das allgemeine Verb עשה bedeutet „tun, ausführen“. In Verbindung mit Rechtsbestimmungen gibt „nach … handeln“ die geforderte praktische Befolgung in natürlichem Deutsch wieder.
- source_word: חֻקֹּתַי
  choice: meine Satzungen
  rationale: חֻקָּה bezeichnet eine festgesetzte Vorschrift oder Satzung. „Satzungen“ erhält das rechtliche Register und die begriffliche Unterscheidung von מִשְׁפָּטַי.
- source_word: תִּשְׁמְרוּ
  choice: einhalten
  rationale: שׁמר bedeutet grundsätzlich „bewahren, hüten“ und bezeichnet im Gesetzeskontext sorgfältige Befolgung. „Einhalten“ ist dafür im modernen Deutschen idiomatisch.
- source_word: לָלֶכֶת בָּהֶם
  choice: euer Leben nach ihnen ausrichten
  rationale: Die Wendung bedeutet wörtlich „in ihnen gehen“ und beschreibt bildhaft die fortdauernde Lebensführung gemäß den Geboten. Die Übersetzung gibt den idiomatischen Sinn natürlich wieder; die Fußnote bewahrt das hebräische Bild.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben. „Jahwe“ ist die im Deutschen übliche Form der wissenschaftlich begründeten Wiedergabe des Tetragramms.
- source_word: אֱלֹהֵיכֶם
  choice: euer Gott
  rationale: Die Konstruktform mit dem Suffix der zweiten Person Plural bedeutet eindeutig „euer Gott“ und bringt die Bundesbeziehung zum Ausdruck.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehovah
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. Die deutsche Form „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von לָלֶכֶת בָּהֶם
  choice: euer Leben nach ihnen ausrichten
  alternative: in ihnen gehen; in ihnen wandeln; nach ihnen leben
  rationale: Die Wendung bezeichnet die Lebensführung gemäß Gottes Bestimmungen. Die gewählte Fassung vermittelt den idiomatischen Sinn, ohne die Aussage als Verheißung eines durch Gesetzesgehorsam erlangten Lebens zu deuten; das wörtliche Bild wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Rechtsbegriffe werden unterschieden; das hebräische Bild der Lebensführung wird verständlich formuliert und in der Fußnote bewahrt.
