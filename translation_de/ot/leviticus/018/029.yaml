source:
  edition: WLC
  text: כִּ֚י כָּל אֲשֶׁ֣ר יַעֲשֶׂ֔ה מִ/כֹּ֥ל הַ/תּוֹעֵב֖וֹת הָ/אֵ֑לֶּה וְ/נִכְרְת֛וּ הַ/נְּפָשׁ֥וֹת הָ/עֹשֹׂ֖ת מִ/קֶּ֥רֶב עַמָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/029.yaml
  text: For whoever does any of all these abominations[a], the persons who do them shall be cut off from among their people.
translation:
  language: de
  text: Denn alle, die auch nur eine dieser Gräueltaten begehen, sollen aus ihrem Volk abgeschnitten werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sollen getötet werden« oder »sollen aus der Gemeinschaft ausgeschlossen werden«. Im Hebräischen steht wörtlich: »sollen abgeschnitten werden«; die genaue Art des Gerichts wird nicht genannt.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise Folgerung aus den vorangehenden Verboten ein und gibt den Zusammenhang im Deutschen natürlich wieder.
- source_word: כָּל אֲשֶׁר
  choice: jeder, der
  rationale: Gibt den unbestimmten universalen Relativausdruck präzise und idiomatisch wieder.
- source_word: יַעֲשֶׂה / הָעֹשֹׂת
  choice: begeht / begehen
  rationale: Bei verwerflichen Handlungen ist „begehen“ im Deutschen natürlicher als das wörtliche „tun“, ohne den Sinn unnötig einzuengen.
- source_word: מִכֹּל הַתּוֹעֵבוֹת הָאֵלֶּה
  choice: irgendeine von all diesen abscheulichen Taten
  rationale: Bewahrt sowohl die partitive Bedeutung von מִן als auch den umfassenden Nachdruck von כֹּל. „Abscheuliche Taten“ bezeichnet im Kontext die zuvor genannten Handlungen klarer und natürlicher als das substantivierte „Gräuel“.
- source_word: וְנִכְרְתוּ
  choice: sollen … ausgerottet werden
  rationale: Gibt das starke rechtlich-bundestheologische Bild von כרת wieder, ohne im Haupttext ausdrücklich festzulegen, auf welche Weise das Urteil vollzogen wird.
- source_word: הַנְּפָשׁוֹת
  choice: die Menschen
  rationale: נֶפֶשׁ bezeichnet hier handelnde Personen; „Seelen“ würde im modernen Deutschen irreführende dualistische Vorstellungen nahelegen.
- source_word: מִקֶּרֶב עַמָּם
  choice: aus der Mitte ihres Volkes
  rationale: Bewahrt die räumlich-gemeinschaftliche Bildsprache der hebräischen Bundesformel und ist zugleich verständliches Standarddeutsch.
theological_decisions:
- issue: Bedeutung der Strafandrohung וְנִכְרְתוּ ... מִקֶּרֶב עַמָּם
  choice: sollen aus der Mitte ihres Volkes ausgerottet werden
  alternative: sollen getötet werden; sollen aus der Gemeinschaft ausgeschlossen werden
  rationale: Die hebräische Formel nennt hier nicht eindeutig die genaue Vollzugsweise. Die Übersetzung bewahrt daher das Bild des Abgeschnitten- beziehungsweise Ausgerottetwerdens, während die Fußnote die möglichen engeren Deutungen nennt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich bildet die emphatische Wiederaufnahme des Subjekts im Hebräischen ab. Die Formulierung bleibt rechtlich gewichtig, ohne die nicht näher bestimmte Strafweise konfessionell oder exegetisch festzulegen.
