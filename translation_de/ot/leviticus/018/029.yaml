  source_fidelity: Die Straf- und Ausschlussformel וְנִכְרְתוּ ... מִקֶּרֶב עַמָּם ist in ihrer Vollzugsweise bewusst nicht näher bestimmt. „Ausgerottet werden“ kann im Deutschen stärker den Eindruck physischer Vernichtung erwecken und damit die offene hebräische Formel stärker festlegen als der Ausgangstext. „Abgeschnitten werden“ bewahrt die rechtliche Metapher und die Ambiguität.
  naturalness: Die Wiederaufnahme nach dem Gedankenstrich ist verständlich, wirkt im Deutschen jedoch unnötig schwerfällig. Eine pluralische Formulierung ist flüssig und gibt die kollektive Aussage des Verses idiomatisch wieder.
  terminology: „Gräueltaten“ ist für תּוֹעֵבוֹת im gegenwärtigen Standarddeutsch angemessen und wahrt den wertenden, rechtlich-religiösen Charakter. „Abgeschnitten werden“ ist hier als bewusst formelhafte Übersetzung von כרת vorzuziehen.
  issues:
