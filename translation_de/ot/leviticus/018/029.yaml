    rationale: Die hebräische Formel „abgeschnitten werden“ benennt nicht, ob Tod, göttliches Gericht oder Ausschluss aus der Gemeinschaft gemeint ist. „Ausrotten“ wird gegenwärtig überwiegend als Vernichtung verstanden; die Fußnote kann diese Verengung nicht vollständig ausgleichen.
  - severity: low
    issue: Die doppelte Subjektaufnahme mit Gedankenstrich ist im Deutschen schwerfällig.
    rationale: Sie ist nicht falsch, aber für modernes Standarddeutsch ist eine direkte pluralische Fassung klarer, ohne eine relevante Nuance des hebräischen Textes einzubüßen.
