revisions:
- from: Denn jeder, der irgendeine von all diesen abscheulichen Taten begeht – die Menschen, die sie begehen, sollen aus der Mitte ihres Volkes ausgerottet werden.[a]
  to: Denn alle, die auch nur eine dieser Gräueltaten begehen, sollen aus ihrem Volk abgeschnitten werden.[a]
  rationale: Die Revision ersetzt die semantisch enger werdende Wiedergabe „ausgerottet werden“ durch die formelhafte, im Deutschen verständliche Wendung „abgeschnitten werden“. Damit bleibt die im Hebräischen und im englischen Audit Trail ausdrücklich gewahrte Unbestimmtheit der Sanktion erhalten. Zugleich wird die Satzführung gestrafft und der partitive Universalanspruch mit „auch nur eine dieser“ deutlich wiedergegeben.
