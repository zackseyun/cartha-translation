source:
  edition: WLC
  text: עֶרְוַ֥ת אֵֽשֶׁת אָחִ֖י/ךָ לֹ֣א תְגַלֵּ֑ה עֶרְוַ֥ת אָחִ֖י/ךָ הִֽוא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/016.yaml
  text: You shall not uncover the nakedness of your brother’s wife[a]; it is your brother’s nakedness.
translation:
  language: de
  text: Die Blöße der Frau deines Bruders sollst du nicht aufdecken[a]; sie ist die Blöße deines Bruders.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder deutlicher: „Du sollst keinen Geschlechtsverkehr mit der Frau deines Bruders haben.“ Im Hebräischen steht die Wendung „die Blöße aufdecken“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת
  choice: die Blöße
  rationale: Im feststehenden rechtlich-euphemistischen Ausdruck גלה ערוה bezeichnet עֶרְוָה sexuelle Entblößung beziehungsweise Geschlechtsverkehr. „Blöße aufdecken“ bewahrt das Bild, den Rechtsstil und die Wiederholung des hebräischen Textes.
- source_word: אֵשֶׁת אָחִיךָ
  choice: die Frau deines Bruders
  rationale: אִשָּׁה bezeichnet in dieser Konstruktverbindung die Ehefrau. „Frau deines Bruders“ ist im modernen Deutschen natürlich und im Kontext eindeutig ehelich.
- source_word: לֹא תְגַלֵּה
  choice: sollst du nicht aufdecken
  rationale: Der mit לֹא verneinte Imperfekt formuliert hier ein rechtliches Verbot. Die Wortstellung erhält die vorangestellte Blöße als Schwerpunkt und klingt zugleich würdig und verständlich.
- source_word: עֶרְוַת אָחִיךָ הִוא
  choice: sie ist die Blöße deines Bruders
  rationale: Die Formulierung erhält sowohl das feminine Pronomen als Rückbezug auf „Blöße“ als auch die bewusste Wiederholung von עֶרְוָה und damit die rechtliche Begründungslogik des Verses.
theological_decisions:
- issue: Ob der rechtliche Euphemismus unmittelbar als Verbot sexueller Beziehungen wiederzugeben ist
  choice: Den hebräischen Ausdruck „die Blöße … aufdecken“ im Haupttext bewahren
  alternative: Du sollst keinen Geschlechtsverkehr mit der Frau deines Bruders haben
  rationale: Der Ausgangstext verwendet bewusst einen konventionellen rechtlichen Euphemismus. Seine Beibehaltung wahrt Bildsprache, Spannung und terminologische Einheit innerhalb von Levitikus 18; die Fußnote erläutert die gemeinte Handlung.
translation_notes:
  register: Moderner, würdiger Gesetzesstil. Die traditionelle Wendung „die Blöße aufdecken“ bleibt wegen ihrer Bedeutung im Kapitel erhalten; eine verständlichere explizite Wiedergabe steht in der Fußnote.
