id: LEV.18.12
reference: Leviticus 18:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: עֶרְוַ֥ת אֲחוֹת אָבִ֖י/ךָ לֹ֣א תְגַלֵּ֑ה שְׁאֵ֥ר אָבִ֖י/ךָ הִֽוא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/012.yaml
  text: You shall not uncover the nakedness of your father's sister[b][a]; she is your father's flesh.
translation:
  language: de
  text: Du sollst die Blöße der Schwester deines Vaters nicht aufdecken.[a] Sie ist eine Blutsverwandte deines Vaters.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Die Blöße aufdecken“ ist in Levitikus eine rechtliche Wendung für verbotene sexuelle Entblößung oder Beziehungen.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Sie ist das Fleisch deines Vaters“, das heißt: seine nahe leibliche Verwandte.'
    reason: alternative_reading
lexical_decisions:
- source_word: עֶרְוַת
  choice: die Blöße
  rationale: „Blöße“ bewahrt die feste Rechtsformel von Levitikus 18 und ist im Deutschen verständlich, ohne sie vorschnell als Geschlechtsverkehr auszudeuten.
- source_word: תְגַלֵּה
  choice: sollst du nicht aufdecken
  rationale: Das Piel von גלה bildet zusammen mit עֶרְוָה die wiederkehrende Verbotsformel des Kapitels. Die formnahe Wiedergabe erhält diesen Zusammenhang.
- source_word: אֲחוֹת אָבִיךָ
  choice: die Schwester deines Vaters
  rationale: Die direkte Verwandtschaftsbezeichnung entspricht dem Hebräischen und ist transparenter als das knappere „deine Tante“.
- source_word: שְׁאֵר
  choice: Blutsverwandte
  rationale: Im Verwandtschaftskontext bezeichnet שְׁאֵר leibliche beziehungsweise enge Verwandtschaft. „Blutsverwandte“ vermittelt den rechtlichen Sinn natürlich; die konkrete Bildsprache „Fleisch“ bleibt in der Fußnote erhalten.
- source_word: הִוא
  choice: Sie ist
  rationale: Das selbstständige Pronomen identifiziert die genannte Frau mit der beschriebenen Verwandtschaftsbeziehung; die schlichte Wiedergabe ist im Deutschen natürlich.
theological_decisions:
- issue: Wiedergabe der Rechtsformel für verbotene sexuelle Beziehungen
  choice: Die Formel „die Blöße … nicht aufdecken“ bleibt im Haupttext erhalten.
  alternative: „keine sexuellen Beziehungen mit … haben“
  rationale: Die formelhafte und bewusst indirekte Ausdrucksweise des Hebräischen soll nicht durch eine explizitere Deutung ersetzt werden. Eine Fußnote erläutert den rechtlichen Gebrauch.
- issue: Wiedergabe der Verwandtschaftsmetapher שְׁאֵר
  choice: Im Haupttext steht „Blutsverwandte“, die wörtlichere Wiedergabe „Fleisch“ in der Fußnote.
  alternative: „Sie ist das Fleisch deines Vaters.“
  rationale: „Blutsverwandte“ gibt den Sinn im heutigen Deutsch klar wieder, während die Fußnote die hebräische Körper- und Verwandtschaftsmetapher sichtbar hält, ohne sie konfessionell auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederkehrende Rechtsformel bleibt formnah; die im Deutschen ungewöhnlichere hebräische Verwandtschaftsmetapher wird verständlich wiedergegeben und in einer Fußnote dokumentiert.
