id: LEV.18.27
reference: Leviticus 18:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֚י אֶת כָּל הַ/תּוֹעֵבֹ֣ת הָ/אֵ֔ל עָשׂ֥וּ אַנְשֵֽׁי הָ/אָ֖רֶץ אֲשֶׁ֣ר לִ/פְנֵי/כֶ֑ם וַ/תִּטְמָ֖א הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/027.yaml
  text: For the men of the land who were before you did all these abominations[a], and the land became unclean.
translation:
  language: de
  text: Denn all diese abscheulichen Dinge taten die Menschen des Landes, die vor euch da waren, und das Land wurde unrein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und das Land wurde verunreinigt.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorangehende Warnung ein und bewahrt den argumentativen Zusammenhang.
- source_word: כָּל הַתּוֹעֵבֹת הָאֵל
  choice: all diese abscheulichen Dinge
  rationale: Gibt die starke moralisch-kultische Abscheu von תּוֹעֵבָה in natürlichem modernem Deutsch wieder, ohne sie auf eine einzige Kategorie einzuengen.
- source_word: עָשׂוּ
  choice: taten
  rationale: Entspricht unmittelbar dem häufigen Verb עשה und vermeidet eine unnötige Spezialisierung wie „verübten“.
- source_word: אַנְשֵׁי הָאָרֶץ
  choice: die Menschen des Landes
  rationale: Die maskuline Pluralform bezeichnet hier kollektiv die früheren Bewohner; „Menschen“ ist im Deutschen natürlich und lässt den kollektiven Bezug erkennen, ohne ausschließlich männliche Personen zu behaupten.
- source_word: אֲשֶׁר לִפְנֵיכֶם
  choice: die vor euch da waren
  rationale: Gibt den zeitlichen und örtlichen Bezug der früheren Bewohner klar und idiomatisch wieder.
- source_word: וַתִּטְמָא
  choice: wurde unrein
  rationale: Bewahrt den Vorgang beziehungsweise das Ergebnis des Unreinwerdens und lässt offen, wie rituelle und moralische Aspekte zueinander stehen.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Bezeichnet im Zusammenhang das betreffende Siedlungsgebiet und nicht die Erde als Ganzes.
theological_decisions:
- issue: Art der Unreinheit des Landes
  choice: das Land wurde unrein
  alternative: das Land wurde verunreinigt
  rationale: Die Formulierung erhält die Verbindung zwischen den Taten der Bewohner und der Unreinheit des Landes, ohne diese ausschließlich rituell, moralisch oder metaphorisch zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Abscheuliche Dinge“ vermittelt die Stärke des hebräischen Ausdrucks natürlicher als das heute oft formelhafte „Gräuel“. Der Satzbau bleibt eng am Hebräischen, ist aber flüssig lesbar.
