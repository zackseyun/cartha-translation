  source_fidelity: Der Entwurf gibt die begründende Konjunktion כִּי mit „Denn“, das vorangestellte Objekt „all diese abscheulichen Dinge“, die früheren Bewohner und die Folge für das Land sachgerecht wieder. „wurde unrein“ bewahrt die im Hebräischen ausgedrückte Unreinheit des Landes, ohne sie einseitig zu definieren.
  naturalness: Der Satz ist verständliches, modernes Standarddeutsch und wahrt einen angemessen würdigen biblischen Registerton. Die Formulierung „die vor euch da waren“ ist etwas umgangssprachlicher als möglich, bleibt aber idiomatisch und klar; eine Änderung ist nicht erforderlich.
  terminology: „Abscheuliche Dinge“ ist für תּוֹעֵבוֹת eine tragfähige moderne Wiedergabe und vermeidet sowohl Abschwächung als auch eine unnötige dogmatische Präzisierung. „Menschen des Landes“ gibt den kollektiven Bezug von אַנְשֵׁי הָאָרֶץ natürlich wieder. Die Fußnote bietet mit „verunreinigt“ eine legitime lexikalische Alternative.
