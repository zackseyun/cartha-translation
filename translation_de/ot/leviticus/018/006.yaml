source:
  edition: WLC
  text: אִ֥ישׁ אִישׁ֙ אֶל כָּל שְׁאֵ֣ר בְּשָׂר֔/וֹ לֹ֥א תִקְרְב֖וּ לְ/גַלּ֣וֹת עֶרְוָ֑ה אֲנִ֖י יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/006.yaml
  text: No man among you shall approach any close relative of his flesh to uncover nakedness[a]; I am Yahweh.
translation:
  language: de
  text: Kein Mann von euch darf sich einem nahen Blutsverwandten nähern, um dessen Blöße aufzudecken.[a] Ich bin Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Die Blöße aufdecken“ ist in diesem Kapitel eine rechtliche Wendung für verbotene sexuelle Entblößung oder sexuelle Beziehungen mit einem nahen Verwandten.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: Keiner von euch
  rationale: Die Verdoppelung ist distributiv („jeder Einzelne“). Zusammen mit der Verneinung ergibt sich im Deutschen natürlich „Keiner von euch“, ohne den Geltungsbereich zu verändern.
- source_word: שְׁאֵר בְּשָׂרוֹ
  choice: einem nahen Blutsverwandten
  rationale: Die Wendung bezeichnet einen nahen Verwandten aufgrund gemeinsamer Abstammung. „Blutsverwandter“ gibt den Bezug auf בָּשָׂר („Fleisch“) idiomatisch und verständlich wieder.
- source_word: לֹא תִקְרְבוּ
  choice: darf sich … nicht nähern
  rationale: Die verneinte Imperfektform formuliert ein rechtliches Verbot. „Darf … nicht“ klingt im modernen Deutschen verbindlich, ohne unnötig altertümlich zu wirken.
- source_word: לְגַלּוֹת עֶרְוָה
  choice: um dessen Blöße aufzudecken
  rationale: Die wiederkehrende Rechtsformel und ihr Körperbild bleiben erhalten. Das Possessivpronomen macht im Deutschen den Bezug auf den Verwandten eindeutig; eine Fußnote erläutert die sexuelle Bedeutung.
- source_word: אֲנִי יְהוָה
  choice: Ich bin Jahwe
  rationale: Die Bundesformel wird knapp bewahrt, und der Gottesname wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Grad der Explizitheit der sexuellen Rechtsformel
  choice: „dessen Blöße aufzudecken“ im Haupttext beibehalten
  alternative: „sexuelle Beziehungen mit ihm zu haben“
  rationale: Die hebräische Bildsprache ist eine wiederkehrende und auslegungsrelevante Formel dieses Kapitels. Die Übersetzung bewahrt sie; die Fußnote erklärt ihren Bedeutungsrahmen, ohne eine einzige konkrete Auslegung in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit rechtlich verbindlichem Ton. Die hebräische Körpermetapher wird im Haupttext bewahrt, während „Blutsverwandter“ die Verwandtschaftsformel natürlich wiedergibt.
