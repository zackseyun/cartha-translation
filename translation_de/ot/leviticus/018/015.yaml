  text: עֶרְוַ֥ת כַּלָּֽתְ/ךָ֖ לֹ֣א תְגַלֵּ֑ה אֵ֤שֶׁת בִּנְ/ךָ֙ הִ֔וא לֹ֥א תְגַלֶּ֖ה עֶרְוָתָֽ/הּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/015.yaml
  text: You shall not uncover the nakedness of your daughter-in-law[a]; she is your son's wife; you shall not uncover her nakedness.
translation:
  language: de
  text: Die Blöße deiner Schwiegertochter[a] darfst du nicht aufdecken. Sie ist die Frau deines Sohnes; ihre Blöße darfst du nicht aufdecken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Blöße aufdecken“; eine in Levitikus wiederkehrende rechtliche Umschreibung für verbotene sexuelle Beziehungen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת
  choice: die Blöße
  rationale: „Blöße“ bewahrt den wiederkehrenden rechtlichen Euphemismus in Levitikus 18 und klingt im Deutschen würdevoll und verständlich.
- source_word: כַּלָּתְךָ
  choice: deiner Schwiegertochter
  rationale: Der Ausdruck bezeichnet unmittelbar die Schwiegertochter des männlich angesprochenen Adressaten.
- source_word: תְגַלֵּה / תְגַלֶּה
  choice: darfst du nicht aufdecken
  rationale: Die Verbindung von גלה im Piel mit עֶרְוָה bildet die wiederkehrende Verbotsformel des Kapitels. Die Wiedergabe erhält das Bild und formuliert zugleich ein klares Verbot in natürlichem Deutsch.
- source_word: אֵשֶׁת בִּנְךָ
  choice: die Frau deines Sohnes
  rationale: Die appositionelle Erklärung wird eng am Hebräischen und zugleich idiomatisch wiedergegeben.
- source_word: הִוא
  choice: Sie ist
  rationale: Das Pronomen identifiziert nachdrücklich die zuvor genannte Frau und leitet die Begründung des Verbots ein.
- source_word: עֶרְוָתָהּ
  choice: ihre Blöße
  rationale: Die Wiederholung erhält den formelhaften Rechtsstil und die sprachliche Kohärenz des Abschnitts.
theological_decisions:
- issue: Wiedergabe der Wendung „die Blöße aufdecken“ im Zusammenhang sexueller Verbote
  choice: Den hebräischen Euphemismus als „die Blöße aufdecken“ beibehalten.
  alternative: „sexuellen Verkehr haben mit“ beziehungsweise „sexuell verkehren mit“
  rationale: Der hebräische Text verwendet in Levitikus 18 eine feste, wiederkehrende Rechtsformel. Ihre Beibehaltung wahrt die Bildsprache und die innertextliche Verknüpfung, ohne die gemeinte sexuelle Grenzüberschreitung durch eine erklärende Paraphrase vorschnell festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusster Wahrung der hebräischen Wiederholung und des rechtlichen Euphemismus. Die Satzstellung vermeidet unnötigen Archaismus, während „Blöße“ den formelhaften Charakter des Ausgangstextes erhält.
