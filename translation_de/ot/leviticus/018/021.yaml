source:
  edition: WLC
  text: וּ/מִֽ/זַּרְעֲ/ךָ֥ לֹא תִתֵּ֖ן לְ/הַעֲבִ֣יר לַ/מֹּ֑לֶךְ וְ/לֹ֧א תְחַלֵּ֛ל אֶת שֵׁ֥ם אֱלֹהֶ֖י/ךָ אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/021.yaml
  text: And you shall not give any of your offspring to make them pass over to Molech, and you shall not profane the name of your God. I am Yahweh.
translation:
  language: de
  text: Von deinen Nachkommen darfst du keinen hingeben, um ihn für Moloch hinübergehen zu lassen.[a] Du sollst den Namen deines Gottes nicht entweihen. Ich bin Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist ein mit Moloch verbundener Ritus. Viele verstehen ihn als Kinderopfer; an anderen Stellen wird dabei vom „Durch-das-Feuer-Gehen-Lassen“ gesprochen.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִזַּרְעֲךָ
  choice: Von deinen Nachkommen ... keinen
  rationale: זֶרַע bezeichnet wörtlich „Samen“, hier jedoch die Nachkommenschaft. Die partitive Konstruktion mit מִן wird durch „von ... keinen“ bewahrt.
- source_word: תִתֵּן
  choice: darfst du ... keinen hingeben
  rationale: נתן bedeutet „geben“; „hingeben“ passt hier natürlich zur Übergabe eines Nachkommen für den verbotenen Ritus und wahrt den prohibitiv-rechtlichen Sinn.
- source_word: לְהַעֲבִיר
  choice: um ihn ... hinübergehen zu lassen
  rationale: Der Hifil von עבר bedeutet „hinübergehen lassen“. Die Wiedergabe bewahrt die auffällige hebräische Wendung, ohne Feuer oder Opfer ausdrücklich in den Haupttext einzutragen.
- source_word: לַמֹּלֶךְ
  choice: für Moloch
  rationale: Die masoretische Lesung wird als Eigenname der mit dem verbotenen Ritus verbundenen Gottheit verstanden. „Für“ gibt die kultische Bestimmung im Deutschen natürlicher wieder als ein bloßes „zu“.
- source_word: תְחַלֵּל
  choice: entweihen
  rationale: חלל im Piel bedeutet hier „entweihen, profanieren“. „Entweihen“ ist gegenwärtiges, würdevolles Deutsch und passt zum Namen Gottes.
- source_word: שֵׁם אֱלֹהֶיךָ
  choice: den Namen deines Gottes
  rationale: Die formale Struktur bleibt erhalten und bewahrt das theologische Gewicht des göttlichen Namens.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname transliteriert und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Art des Moloch-Ritus
  choice: Die kausative Wendung „hinübergehen lassen“ bleibt im Haupttext erhalten.
  alternative: „einen deiner Nachkommen Moloch als Opfer darbringen“ oder „durch das Feuer gehen lassen“
  rationale: Der weitere biblische Zusammenhang verbindet die Wendung mit einem Moloch-Ritus, vielfach mit Kinderopfer und Feuer. Dieser Vers selbst nennt jedoch weder Opfer noch Feuer ausdrücklich; deshalb wird die Deutung in die Fußnote verwiesen.
- issue: Bedeutungsumfang von זֶרַע
  choice: Nachkommen
  alternative: Kinder; Samen
  rationale: „Nachkommen“ gibt den familiären Bezug wieder, ohne den hebräischen Ausdruck unnötig auf eine Altersgruppe zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Rechtssprache ist klar, ohne altertümliches „sollst nicht“ durchgehend zu erzwingen. Die ungewöhnliche kultische Wendung bleibt aus Gründen der Textnähe bewusst stehen; ihre wahrscheinliche Bedeutung wird in der Fußnote erläutert.
