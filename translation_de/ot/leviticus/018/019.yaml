source:
  edition: WLC
  text: וְ/אֶל אִשָּׁ֖ה בְּ/נִדַּ֣ת טֻמְאָתָ֑/הּ לֹ֣א תִקְרַ֔ב לְ/גַלּ֖וֹת עֶרְוָתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/019.yaml
  text: You shall not approach a woman during her menstrual uncleanness to uncover her nakedness[a].
translation:
  language: de
  text: Du sollst dich einer Frau während ihrer menstruationsbedingten Unreinheit nicht nähern, um ihre Blöße aufzudecken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „während der Unreinheit ihrer Monatsblutung“. Das Hebräische verwendet hier die Sprache ritueller Reinheit und Unreinheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶל אִשָּׁה ... לֹא תִקְרַב
  choice: Du darfst dich einer Frau ... nicht nähern
  rationale: אֶל mit קרב bezeichnet das Sich-Nähern. Die unpersönlich formulierte Frau bleibt entsprechend dem indefiniten אִשָּׁה allgemein; „Frau“ ist hier nicht ausdrücklich als „Ehefrau“ markiert.
- source_word: בְּ/נִדַּת טֻמְאָתָהּ
  choice: während der Unreinheit ihrer Monatsblutung
  rationale: נִדָּה bezeichnet hier den menstruationsbedingten Zustand, טֻמְאָה die im Levitikus maßgebliche kultisch-rituelle Unreinheit. Die Formulierung bewahrt diese Kategorie und bleibt im modernen Deutsch verständlich.
- source_word: לְ/גַלּוֹת עֶרְוָתָהּ
  choice: um ihre Blöße aufzudecken
  rationale: Die feste Wendung „Blöße aufdecken“ erhält den rechtlichen sexuellen Euphemismus des Hebräischen, ohne ihn im Haupttext expliziter auszulegen.
theological_decisions:
- issue: Ist die menstruationsbezogene Unreinheit rituell-kultisch oder rein medizinisch zu verstehen?
  choice: rituelle Unreinheit
  alternative: Monatsblutung bzw. Menstruation ohne Reinheitsbegriff
  rationale: טֻמְאָה gehört im Levitikus zur kultisch-rituellen Reinheitssprache. Die Übersetzung wahrt diese textinterne Kategorie, ohne daraus ein modernes medizinisches oder moralisches Urteil abzuleiten.
- issue: Wie ausdrücklich soll der sexuelle Sinn von „die Blöße aufdecken“ wiedergegeben werden?
  choice: den hebräischen Euphemismus bewahren
  alternative: Geschlechtsverkehr mit ihr haben
  rationale: Die idiomatische Wendung hat sexuellen Sinn, doch eine direkte Umschreibung würde die Ausdrucksweise des Ausgangstextes vereindeutigen und dessen verhüllende Rechtssprache auflösen.
translation_notes:
  register: Moderne, würdige Rechtssprache. „Du darfst ... nicht“ gibt das gesetzliche Verbot natürlich wieder; „Blöße aufdecken“ hält bewusst an der wiederkehrenden Ausdrucksweise von Levitikus 18 fest.
