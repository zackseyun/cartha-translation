source:
  edition: WLC
  text: עֶרְוַ֨ת בַּת אֵ֤שֶׁת אָבִ֨י/ךָ֙ מוֹלֶ֣דֶת אָבִ֔י/ךָ אֲחוֹתְ/ךָ֖ הִ֑וא לֹ֥א תְגַלֶּ֖ה עֶרְוָתָֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/011.yaml
  text: You shall not uncover the nakedness of your father's wife's daughter[a], born to your father; she is your sister.
translation:
  language: de
  text: Die Blöße der Tochter der Frau deines Vaters, die dein Vater gezeugt hat,[a] sollst du nicht aufdecken; sie ist deine Schwester.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deine Halbschwester“. Wörtlich heißt es im Hebräischen: „Sie ist deine Schwester“; die vorangehende Beschreibung präzisiert das Verhältnis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת / עֶרְוָתָהּ
  choice: die Blöße … / die Blöße
  rationale: „Blöße aufdecken“ bewahrt die feste sexuelle Verbotsformel des Kapitels und bleibt näher am hebräischen Rechtsidiom als eine anatomisch ausdrückliche Umschreibung.
- source_word: בַּת
  choice: Tochter
  rationale: Direkte und natürliche Wiedergabe der Verwandtschaftsbezeichnung.
- source_word: אֵשֶׁת אָבִיךָ
  choice: die Frau deines Vaters
  rationale: Die relationale Formulierung des Hebräischen bleibt erhalten; „Stiefmutter“ wäre eine stärkere Interpretation und würde die Ausdrucksweise der Quelle verkürzen.
- source_word: מוֹלֶדֶת אָבִיךָ
  choice: die von deinem Vater gezeugt wurde
  rationale: Die Formulierung bezeichnet hier die leibliche Abstammung vom Vater. „Gezeugt“ bringt den ausdrücklich väterlichen Bezug im Deutschen klar und knapp zum Ausdruck.
- source_word: אֲחוֹתְךָ הִוא
  choice: sie ist deine Schwester
  rationale: Das Hebräische sagt ausdrücklich „Schwester“ und fügt nicht „Halb-“ hinzu; die nähere Beschreibung bestimmt das Verwandtschaftsverhältnis.
- source_word: לֹא תְגַלֶּה
  choice: sollst du nicht aufdecken
  rationale: Diese Form wahrt den verbindlichen Ton der gesetzlichen Verbotsformel und klingt in modernem, würdigem Deutsch natürlich.
theological_decisions:
- issue: Ob das Verwandtschaftsverhältnis im Haupttext als „Halbschwester“ bezeichnet werden soll
  choice: Die Quellenformulierung „sie ist deine Schwester“ bleibt im Haupttext erhalten.
  alternative: „sie ist deine Halbschwester“
  rationale: Die vorangehende Beschreibung präzisiert das Verhältnis, während das Hebräische selbst allgemein „Schwester“ sagt. Die Ergänzung „Halb-“ würde die Beziehung erklären, aber die ausdrückliche Formulierung der Quelle interpretierend verengen.
translation_notes:
  register: Moderner, würdiger Gesetzesstil. Die traditionelle Wendung „die Blöße aufdecken“ wird wegen ihres wiederkehrenden rechtlich-sexuellen Formelcharakters beibehalten; der Satzbau wurde zugleich für heutige Leser klar gestaltet.
