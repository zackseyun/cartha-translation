  text: וּ/שְׁמַרְתֶּ֣ם אֶת מִשְׁמַרְתִּ֗/י לְ/בִלְתִּ֨י עֲשׂ֜וֹת מֵ/חֻקּ֤וֹת הַ/תּֽוֹעֵבֹת֙ אֲשֶׁ֣ר נַעֲשׂ֣וּ לִ/פְנֵי/כֶ֔ם וְ/לֹ֥א תִֽטַּמְּא֖וּ בָּ/הֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/030.yaml
  text: So you shall keep my charge[a], so as not to practice any of the abominable statutes that were practiced before you, and you shall not make yourselves unclean by them. I am Yahweh your God.
translation:
  language: de
  text: Ihr sollt meine Vorschrift befolgen, damit ihr keinen der abscheulichen Bräuche ausübt, die vor euch ausgeübt wurden, und euch nicht durch sie unrein macht. Ich bin Jahwe, euer Gott.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם אֶת־מִשְׁמַרְתִּי
  choice: Darum haltet euch an das, was ich euch aufgetragen habe
  rationale: Die Verbindung aus שׁמר und מִשְׁמֶרֶת bezeichnet das treue Beachten eines von Gott auferlegten Auftrags bzw. einer Verpflichtung. Die idiomatische deutsche Wiedergabe wahrt den rechtlich-bundeshaften Nachdruck.
- source_word: לְבִלְתִּי עֲשׂוֹת
  choice: und übernehmt keine
  rationale: Die Konstruktion drückt Verhinderung bzw. den Zweck des zuvor gebotenen Gehorsams aus. Im Deutschen verbindet „und übernehmt keine“ diesen Gedanken natürlich mit den etablierten Praktiken der Vorbewohner.
- source_word: מֵחֻקּוֹת הַתּוֹעֵבֹת
  choice: keine der abscheulichen Bräuche
  rationale: Das partitive מִן wird durch „keine der“ ausgedrückt. חֻקּוֹת kann hier festgelegte Praktiken oder Bräuche bezeichnen; תּוֹעֵבֹת bewertet sie mit starker moralisch-kultischer Abscheu.
- source_word: אֲשֶׁר נַעֲשׂוּ לִפְנֵיכֶם
  choice: die man vor euch ausgeübt hat
  rationale: Die unpersönliche Form „man“ gibt das hebräische Passiv natürlich wieder. „Vor euch“ bleibt bewusst knapp und bezeichnet im Kontext die Zeit vor Israels Ankunft.
- source_word: וְלֹא תִטַּמְּאוּ בָּהֶם
  choice: Macht euch durch sie nicht unrein
  rationale: Die reflexive Bedeutung von טמא und das instrumentale ב werden unmittelbar wiedergegeben; „unrein“ bewahrt zudem die kultische und moralische Spannung des Begriffs.
- source_word: אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: Ich bin Jahwe, euer Gott
  rationale: Die Bundesformel wird direkt wiedergegeben und der Gottesname יְהוָה als „Jahwe“ transliteriert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich den Eigennamen. „Jahwe“ macht diesen sichtbar, statt ihn durch einen Titel zu ersetzen.
- issue: Moralisch-kultische Wertung von תּוֹעֵבֹת
  choice: abscheulich
  alternative: verabscheuungswürdig
  rationale: „Abscheulich“ bewahrt die starke Verurteilung des Ausgangstextes, ohne die bezeichneten Handlungen über den Kontext hinaus näher zu bestimmen.
- issue: Bedeutungsumfang von טמא
  choice: unrein machen
  alternative: beflecken
  rationale: „Unrein“ hält sowohl die kultische als auch die moralische Dimension offen und löst deren Verhältnis nicht einseitig auf.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede steht im Plural. „Bräuche“ ist im Kontext natürlicher als „Satzungen“, während die Fußnote den formell-rechtlichen Bedeutungsanteil offenhält.
