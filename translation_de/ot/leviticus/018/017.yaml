  text: עֶרְוַ֥ת אִשָּׁ֛ה וּ/בִתָּ֖/הּ לֹ֣א תְגַלֵּ֑ה אֶֽת בַּת בְּנָ֞/הּ וְ/אֶת בַּת בִּתָּ֗/הּ לֹ֤א תִקַּח֙ לְ/גַלּ֣וֹת עֶרְוָתָ֔/הּ שַׁאֲרָ֥ה הֵ֖נָּה זִמָּ֥ה הִֽוא־־־־
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/017.yaml
  text: You shall not uncover the nakedness of a woman and her daughter[a]. You shall not take her son's daughter or her daughter's daughter to uncover her nakedness; they are close relatives[c][b]. It is depravity.
translation:
  language: de
  text: Du sollst die Blöße einer Frau und ihrer Tochter nicht aufdecken.[a] Du sollst weder die Tochter ihres Sohnes noch die Tochter ihrer Tochter nehmen, um ihre Blöße aufzudecken; sie sind ihre nahen Verwandten. Es ist eine Schandtat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Die Blöße aufdecken“ ist eine hebräische Wendung für sexuelle Beziehungen.
    reason: cultural_note
  - marker: b
    text: 'Oder: „eine abscheuliche Tat“, „Unzucht“ oder „Niedertracht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת ... תְגַלֵּה
  choice: die Blöße ... aufdecken
  rationale: Die formnahe Wiedergabe bewahrt die für Levitikus typische rechtliche Wendung; eine Fußnote erläutert ihre sexuelle Bedeutung.
- source_word: אִשָּׁה
  choice: eine Frau
  rationale: Das Substantiv kann „Frau“ oder „Ehefrau“ bedeuten. Der weitere Ausdruck nennt kein Eheverhältnis ausdrücklich, daher bleibt „Frau“ die umfassendere Wiedergabe.
- source_word: תִקַּח
  choice: nehmen
  rationale: Das Verb bedeutet wörtlich „nehmen“ und kann hier eine eheliche oder sexuelle Verbindung bezeichnen. Die folgende Zweckangabe verdeutlicht den sexuellen Zusammenhang, ohne das Verb unnötig auf eine formelle Heirat einzuengen.
- source_word: בַּת בְּנָהּ
  choice: die Tochter ihres Sohnes
  rationale: Die Wiedergabe bildet die genaue hebräische Verwandtschaftsbezeichnung transparent ab.
- source_word: בַּת בִּתָּהּ
  choice: die Tochter ihrer Tochter
  rationale: Die Wiedergabe erhält die genaue Verwandtschaftsbezeichnung und den Parallelismus.
- source_word: לְגַלּוֹת עֶרְוָתָהּ
  choice: um ihre Blöße aufzudecken
  rationale: Das feminine Singularsuffix bleibt wie im Hebräischen unaufgelöst und bewahrt dadurch die mögliche Rückbeziehung auf die zuerst genannte Frau ebenso wie eine distributive Deutung.
- source_word: שַׁאֲרָה הֵנָּה
  choice: sie sind Blutsverwandte
  rationale: שְׁאֵר bezeichnet hier leibliche beziehungsweise nahe Verwandtschaft. „Blutsverwandte“ ist im Deutschen klarer als das wörtliche „Fleisch“ und passt zum femininen Plural „sie“.
- source_word: זִמָּה
  choice: Schandtat
  rationale: Das Wort bezeichnet hier eine verwerfliche, insbesondere sexuelle Tat. „Schandtat“ wahrt die starke rechtlich-moralische Verurteilung, ohne eine spezifische dogmatische Deutung einzutragen.
theological_decisions:
- issue: Bezug des Singularsuffixes in „ihre Blöße aufzudecken“
  choice: Das Pronomen bleibt unaufgelöst stehen.
  alternative: Ausdrückliche Rückbeziehung auf die ursprüngliche Frau oder distributiver Bezug auf die jeweils genannte Nachfahrin.
  rationale: Der hebräische Singular lässt die Rückbeziehung formal offen. Die deutsche Formulierung erhält diese Spannung, statt sie durch eine erläuternde Ergänzung festzulegen.
- issue: Bedeutungsumfang von „nehmen“ im Inzestverbot
  choice: „nehmen“
  alternative: „heiraten“ oder „sexuell nehmen“
  rationale: „Heiraten“ würde das Verbot auf eine formelle Ehe verengen; eine explizit sexuelle Paraphrase würde den rechtlichen Idiomcharakter glätten. Die nachfolgende Wendung klärt den Zusammenhang.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener Rechtssprache. Die wiederholte Wendung „die Blöße aufdecken“ erhält den Sprachgebrauch des Kapitels; die Erläuterung steht in der Fußnote. Die Verwandtschaftsangaben werden formnah und allgemein verständlich wiedergegeben.
