id: LEV.18.5
reference: Leviticus 18:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֤ם אֶת חֻקֹּתַ/י֙ וְ/אֶת מִשְׁפָּטַ֔/י אֲשֶׁ֨ר יַעֲשֶׂ֥ה אֹתָ֛/ם הָ/אָדָ֖ם וָ/חַ֣י בָּ/הֶ֑ם אֲנִ֖י יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/005.yaml
  text: So you shall keep my statutes and my judgments[a], which if a man does them, he shall live by them[b]. I am Yahweh.
translation:
  language: de
  text: Darum sollt ihr meine Satzungen und meine Rechtsbestimmungen halten. Wenn ein Mensch[a] sie tut, wird er durch sie leben.[b] Ich bin Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Ein Mensch« steht hier in der Einzahl stellvertretend für jeden Menschen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »wird in ihnen leben«. Die hebräische Präposition kann hier das Mittel (»durch«) oder den Lebensbereich (»in«) bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Darum sollt ihr … halten
  rationale: Das mit ו verbundene Qal Perfekt hat in dieser Gesetzesrede auffordernden bzw. verpflichtenden Sinn. »Halten« gibt die bundessprachliche Bedeutung von שׁמר wieder; »darum« stellt den Anschluss an die vorangehenden Weisungen natürlich her.
- source_word: חֻקֹּתַי
  choice: meine Satzungen
  rationale: חֻקּוֹת bezeichnet festgesetzte Vorschriften oder Erlasse. »Satzungen« bewahrt den förmlichen Rechtscharakter und unterscheidet den Ausdruck vom folgenden מִשְׁפָּטַי.
- source_word: מִשְׁפָּטַי
  choice: meine Rechtsbestimmungen
  rationale: מִשְׁפָּטִים bezeichnet hier rechtliche Bestimmungen. »Rechtsbestimmungen« ist im heutigen Deutsch verständlich und wahrt die begriffliche Unterscheidung zu »Satzungen«.
- source_word: אֲשֶׁר יַעֲשֶׂה אֹתָם
  choice: Wenn … sie tut
  rationale: Die knappe Relativkonstruktion bezeichnet das Tun der genannten Satzungen und Rechtsbestimmungen und hat im Zusammenhang konditionalen Sinn. »Tun« bewahrt die konkrete Sprache des Gehorsams.
- source_word: הָאָדָם
  choice: ein Mensch
  rationale: אָדָם steht im maskulinen Singular, ist hier jedoch stellvertretend und nicht auf eine bestimmte Person bezogen. »Ein Mensch« bewahrt Numerus und repräsentative Aussage, ohne sie auf Männer einzuengen.
- source_word: וָחַי
  choice: wird er … leben
  rationale: חיה bezeichnet Leben als Folge dieses Tuns. Die Formulierung lässt offen, ob zeitliches, bundesbezogenes oder umfassenderes Leben gemeint ist.
- source_word: בָּהֶם
  choice: durch sie
  rationale: Die Präposition ב kann hier instrumentalen Sinn haben; »durch sie« ist im Deutschen idiomatisch. Die ebenfalls mögliche räumlich-sphärische Deutung »in ihnen« wird in einer Fußnote bewahrt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel »der HERR« ersetzt.
theological_decisions:
- issue: Bedeutungsumfang von »durch sie leben«
  choice: Die offene Aussage »wird er durch sie leben« bleibt ohne nähere Bestimmung stehen.
  alternative: »wird in ihnen leben« oder eine ausdrückliche Einschränkung auf langes Leben, Bundesleben beziehungsweise ewiges Leben
  rationale: Der hebräische Text legt Art und Umfang des Lebens nicht ausdrücklich fest. Die Übersetzung bewahrt diese theologische Spannung und vermeidet eine nachträgliche Einengung.
- issue: Repräsentativer Singular הָאָדָם
  choice: »ein Mensch« mit erklärender Fußnote
  alternative: »jeder«, »wer« oder »die Menschen«
  rationale: So bleiben der Singular und der menschheitsbezogene Sinn zugleich erkennbar; die Fußnote verdeutlicht, dass die Aussage jeden Menschen einschließt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Rechtssprache. Der Satzbau bleibt nahe am Hebräischen, wird aber durch einen eigenständigen Konditionalsatz natürlich lesbar.
