source:
  edition: WLC
  text: וְ/אֶ֨ת זָכָ֔ר לֹ֥א תִשְׁכַּ֖ב מִשְׁכְּבֵ֣י אִשָּׁ֑ה תּוֹעֵבָ֖ה הִֽוא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/022.yaml
  text: You shall not lie with a male as with a woman[a]; it is an abomination.
translation:
  language: de
  text: Du sollst nicht bei einem Mann liegen wie bei einer Frau[a]; es ist ein Gräuel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Lager einer Frau“; die hebräische Wendung ist ein Idiom für den Geschlechtsverkehr mit einer Frau.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכָר
  choice: einem Mann
  rationale: זָכָר bezeichnet hier eine männliche Person. Im Deutschen ist „einem Mann“ die natürliche, würdige Wiedergabe; „bei einem Männlichen“ wäre unidiomatisch.
- source_word: תִשְׁכַּב
  choice: sollst nicht … liegen
  rationale: שׁכב wird hier als sexuelles Euphemismus gebraucht. „bei jemandem liegen“ bewahrt das Bild des Hebräischen und ist im Kontext verständlich.
- source_word: מִשְׁכְּבֵי אִשָּׁה
  choice: wie man bei einer Frau liegt
  rationale: Wörtlich steht der idiomatische Plural „die Beilager einer Frau“. Die gewählte Form gibt den sexuellen Sinn natürlich wieder und bewahrt den Vergleich, ohne die ungewöhnliche hebräische Wendung im Haupttext nachzuahmen.
- source_word: תּוֹעֵבָה
  choice: ein Gräuel
  rationale: „Gräuel“ ist eine gewichtige und etablierte deutsche Entsprechung für etwas Abscheuliches beziehungsweise Verabscheuungswürdiges und wahrt die starke Wertung des Textes.
- source_word: הִוא
  choice: es ist
  rationale: Das feminine Pronomen nimmt die als תּוֹעֵבָה bezeichnete Handlung auf; im Deutschen ist „es ist“ die natürliche Form.
theological_decisions:
- issue: Reichweite des Verbots im Kontext des Heiligkeitsgesetzes
  choice: Der Vers wird als unmittelbares Verbot des beschriebenen sexuellen Verkehrs wiedergegeben, ohne eine im Hebräischen nicht genannte Einschränkung auf kultische oder ausbeuterische Praktiken.
  alternative: Eine engere, deutende Wiedergabe, die das Verbot ausdrücklich auf kultische oder ausbeuterische Handlungen beschränkt.
  rationale: Der hebräische Wortlaut nennt eine männliche Person, den sexuellen Vergleich mit dem Liegen bei einer Frau und die Wertung תּוֹעֵבָה. Nicht ausdrücklich genannte Einschränkungen sollen weder eingefügt noch durch eine weitergehende abstrakte Paraphrase ersetzt werden.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, rechtssprachlich knappem Ton. „Du sollst nicht“ bewahrt die Form des direkten Verbots; „bei … liegen“ erhält das hebräische Euphemismus, während die Fußnote die ungewöhnliche Pluralwendung erläutert.
