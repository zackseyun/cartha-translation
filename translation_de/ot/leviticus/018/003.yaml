id: LEV.18.3
reference: Leviticus 18:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כְּ/מַעֲשֵׂ֧ה אֶֽרֶץ מִצְרַ֛יִם אֲשֶׁ֥ר יְשַׁבְתֶּם בָּ֖/הּ לֹ֣א תַעֲשׂ֑וּ וּ/כְ/מַעֲשֵׂ֣ה אֶֽרֶץ כְּנַ֡עַן אֲשֶׁ֣ר אֲנִי֩ מֵבִ֨יא אֶתְ/כֶ֥ם שָׁ֨מָּ/ה֙ לֹ֣א תַעֲשׂ֔וּ וּ/בְ/חֻקֹּתֵי/הֶ֖ם לֹ֥א תֵלֵֽכוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/003.yaml
  text: You shall not do as they do in the land of Egypt[a], where you lived, and you shall not do as they do in the land of Canaan, where I am bringing you[b]. You shall not walk in their statutes.
translation:
  language: de
  text: Ihr sollt es nicht so machen wie die Menschen im Land Ägypten, in dem ihr gewohnt habt,[a] und ihr sollt es nicht so machen wie die Menschen im Land Kanaan, in das ich euch bringe. Nach ihren Satzungen sollt ihr nicht leben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »nach dem Tun des Landes Ägypten … und nach dem Tun des Landes Kanaan«. Gemeint sind die Handlungsweisen der dort lebenden Menschen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Ihren Satzungen sollt ihr nicht folgen.« Das hebräische Verb bedeutet wörtlich »gehen«; »Satzungen« kann hier auch »Ordnungen« oder »Bräuche« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמַעֲשֵׂה
  choice: so machen wie die Menschen im Land
  rationale: Die Wendung bedeutet wörtlich etwa »gemäß dem Tun des Landes«. Die idiomatische Wiedergabe macht deutlich, dass die Handlungsweisen der Bewohner gemeint sind, und bewahrt zugleich den konkreten Bezug auf ihr Tun.
- source_word: אֶרֶץ מִצְרַיִם
  choice: Land Ägypten
  rationale: Bewahrt die geografische Hervorhebung der hebräischen Genitivverbindung und klingt im Deutschen natürlich.
- source_word: אֲשֶׁר יְשַׁבְתֶּם בָּהּ
  choice: in dem ihr gewohnt habt
  rationale: Gibt den Rückbezug auf das grammatisch sächliche »Land« und Israels früheren Aufenthalt klar wieder.
- source_word: לֹא תַעֲשׂוּ
  choice: ihr sollt es nicht so machen
  rationale: Entspricht dem Verbot im rechtlichen Kontext und verbindet sich idiomatisch mit der Vergleichskonstruktion.
- source_word: וּכְמַעֲשֵׂה אֶרֶץ כְּנַעַן
  choice: so machen wie die Menschen im Land Kanaan
  rationale: Wahrt die Parallelität zur ersten Satzhälfte und verdeutlicht die im hebräischen Ausdruck implizierten Bewohner.
- source_word: אֲשֶׁר אֲנִי מֵבִיא אֶתְכֶם שָׁמָּה
  choice: in das ich euch bringe
  rationale: Der Partizipialausdruck bezeichnet Gottes gegenwärtig bevorstehendes Hineinbringen; »in das« gibt das Ziel präzise wieder.
- source_word: וּבְחֻקֹּתֵיהֶם
  choice: nach ihren Satzungen
  rationale: חֻקּוֹת bezeichnet festgelegte Normen, Satzungen oder Bräuche. »Satzungen« erhält die normative Kraft und den Kontrast zu Gottes Satzungen im Kontext.
- source_word: לֹא תֵלֵכוּ
  choice: sollt ihr nicht leben
  rationale: Das wörtliche »gehen« ist hier eine Metapher für Lebensführung. »Leben« vermittelt diese im modernen Deutschen natürlich; die Metapher wird in der Fußnote transparent gemacht.
theological_decisions:
- issue: Bezieht sich das verbotene Tun auf das Land selbst oder auf dessen Bewohner?
  choice: Die Bewohner werden als »die Menschen im Land« ausdrücklich gemacht.
  alternative: »nach dem Tun des Landes Ägypten/Kanaan«
  rationale: Das Hebräische schreibt das Tun idiomatisch dem Land zu; sachlich sind die dort lebenden Menschen und ihre Praktiken gemeint. Die Wiedergabe vermeidet eine im Deutschen irreführende Personifizierung, ohne das Verbot auf eine bloß abstrakte »Kultur« zu verengen.
- issue: Soll חֻקֹּתֵיהֶם als »Bräuche« oder als »Satzungen« wiedergegeben werden?
  choice: Satzungen
  alternative: Bräuche; Ordnungen
  rationale: »Satzungen« bewahrt die normative Bedeutung und den bewussten Gegensatz zu den Satzungen des HERRN in den folgenden Versen; »Bräuche« bleibt als lexikalische Alternative in der Fußnote erhalten.
- issue: Soll die Geh-Metapher in לֹא תֵלֵכוּ wörtlich bewahrt werden?
  choice: Im Haupttext idiomatisch »leben«, mit wörtlicher Alternative in der Fußnote.
  alternative: »in ihren Satzungen sollt ihr nicht gehen«; »ihren Satzungen sollt ihr nicht folgen«
  rationale: Wörtliches »in Satzungen gehen« ist im heutigen Deutsch unnatürlich. »Leben« gibt die biblische Metapher der Lebensführung wieder, während die Fußnote die Bildsprache und die Alternative »folgen« offenlegt.
translation_notes:
  register: Moderne, würdevolle Rechtssprache mit verständlicher Syntax. Die Wiederholung von »ihr sollt es nicht so machen« bildet die hebräische Parallelstruktur ab. Das etwas fachsprachliche »Satzungen« wird wegen seines normativen Gewichts beibehalten und durch eine Fußnote erläutert.
