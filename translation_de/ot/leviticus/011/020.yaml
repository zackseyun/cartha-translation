  yaml_path: translation/ot/leviticus/011/020.yaml
  text: Every swarming winged creature that walks on four feet is detestable to you[a][b][c].
translation:
  language: de
  text: Alles geflügelte Kleingetier, das sich auf vier Beinen fortbewegt, ist euch ein Gräuel.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Alles fliegende Kleingetier“. Das hebräische Wort עוֹף kann fliegende Lebewesen allgemein bezeichnen und ist nicht auf Vögel beschränkt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „das auf vier geht“. Gemeint ist die Fortbewegung auf vier Beinen; die folgenden Verse nennen eine Ausnahme für bestimmte Insekten mit Beinen zum Springen.'
    reason: cultural_note
  - marker: c
    text: 'Oder: „ist euch etwas Abscheuliches“. Der Ausdruck bezeichnet hier im Rahmen der Speisegebote kultische Verabscheuungswürdigkeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: Alles
  rationale: Die umfassende Aussage bezieht sich auf die gesamte bezeichnete Tiergruppe; mit dem singularischen Kollektivbegriff „Kleingetier“ ist „alles“ im Deutschen natürlich.
- source_word: שֶׁרֶץ
  choice: Kleingetier
  rationale: Das Substantiv bezeichnet kleine, sich zahlreich bewegende beziehungsweise wimmelnde Tiere. „Kleingetier“ ist im Deutschen verständlich und passt hier besonders zu den anschließend behandelten Insekten.
- source_word: הָעוֹף
  choice: geflügelt
  rationale: עוֹף bezeichnet hier fliegende beziehungsweise geflügelte Lebewesen und ist nicht auf Vögel beschränkt. Die adjektivische Wiedergabe verhindert dieses Missverständnis.
- source_word: הַהֹלֵךְ
  choice: das sich fortbewegt
  rationale: Das Partizip bezeichnet die charakteristische Fortbewegung. „Sich fortbewegt“ ist im Deutschen bei Insekten natürlicher und weniger anthropomorph als „geht“.
- source_word: עַל אַרְבַּע
  choice: auf vier Beinen
  rationale: Die Formulierung bildet das hebräische „auf vier“ verständlich ab. Die folgenden Verse präzisieren die anatomische Einteilung durch eine Ausnahme für Sprungbeine.
- source_word: שֶׁקֶץ
  choice: ein Gräuel
  rationale: Der Ausdruck bezeichnet im Zusammenhang der Speisegebote etwas kultisch Abscheuliches beziehungsweise Tabuisiertes. „Gräuel“ bewahrt die Stärke und unterscheidet den Begriff von der allgemeineren Kategorie „unrein“.
- source_word: לָכֶם
  choice: euch
  rationale: 'Der Dativ bezeichnet die Beziehung zu Israel: Für die Angesprochenen sollen diese Tiere als Gräuel gelten.'
theological_decisions:
- issue: Bedeutung von שֶׁקֶץ im Speisegesetz
  choice: „soll euch ein Gräuel sein“ als kultisch-rechtliche Einstufung
  alternative: „ist für euch verabscheuungswürdig“ als allgemein moralisches Urteil
  rationale: Der unmittelbare Kontext handelt von Speise- und Reinheitsbestimmungen. Die Übersetzung bewahrt die starke Wertung, ohne sie stillschweigend zu einem zeitlosen moralischen Urteil über die Tiere auszuweiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Kleingetier“ wahrt den kollektiven Charakter und vermeidet die irreführende Beschränkung auf Vögel. Die Soll-Formulierung gibt die rechtlich-normative Funktion des nominalen hebräischen Satzes im Kontext natürlich wieder.
