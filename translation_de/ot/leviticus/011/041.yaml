id: LEV.11.41
reference: Leviticus 11:41
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/כָל הַ/שֶּׁ֖רֶץ הַ/שֹּׁרֵ֣ץ עַל הָ/אָ֑רֶץ שֶׁ֥קֶץ ה֖וּא לֹ֥א יֵאָכֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/041.yaml
  text: And every swarming thing that swarms on the earth is detestable[b][a]; it shall not be eaten.
translation:
  language: de
  text: Und alles Kleingetier[a], das sich auf der Erde regt, ist etwas Abscheuliches[b]; es darf nicht gegessen werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alles Gewimmel“. Der hebräische Ausdruck bezeichnet allgemein kleine Tiere, die sich in großer Zahl oder nahe am Boden bewegen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ein Gräuel“. Hier bezeichnet das Wort etwas, das als Nahrung rituell verabscheuungswürdig ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: Und alles
  rationale: וְ verbindet die Vorschrift mit den vorangehenden Speisegeboten; כָּל bezeichnet die betreffende Tierklasse umfassend.
- source_word: הַ/שֶּׁרֶץ
  choice: Kleingetier
  rationale: שֶׁרֶץ bezeichnet hier breit kleine Tiere, die sich in großer Zahl oder nahe am Boden bewegen. „Kleingetier“ ist im heutigen Deutsch natürlich und vermeidet die zu enge Vorstellung ausschließlich kriechender Tiere.
- source_word: הַ/שֹּׁרֵץ
  choice: das sich ... regt
  rationale: Das Partizip von שׁרץ charakterisiert die Bewegung dieser Tiere. Die Wiedergabe bewahrt die sachliche Aussage, auch wenn das hebräische Wortspiel mit dem Substantiv im Deutschen nicht vollständig nachgebildet werden kann.
- source_word: עַל הָ/אָ֑רֶץ
  choice: auf der Erde
  rationale: אָרֶץ meint im Zusammenhang den terrestrischen Bereich im Unterschied zu Wasser und Luftraum; „auf der Erde“ gibt dies direkt wieder.
- source_word: שֶׁ֥קֶץ
  choice: etwas Abscheuliches
  rationale: שֶׁקֶץ kennzeichnet diese Tiere im Kontext der Speisevorschriften als rituell verabscheuungswürdig. Die substantivische Form bewahrt die Prädikatskonstruktion und vermeidet eine ausschließlich moralische Deutung.
- source_word: ה֖וּא
  choice: ist
  rationale: Das selbstständige Pronomen verstärkt die Prädikation; im natürlichen Deutschen wird dies durch die klare Konstruktion „ist etwas Abscheuliches“ ausreichend ausgedrückt.
- source_word: לֹ֥א יֵאָכֵֽל
  choice: es darf nicht gegessen werden
  rationale: Der passive Nifal-Imperfekt formuliert ein Verbot. „Darf nicht gegessen werden“ ist gegenwärtiges, verständliches Gesetzesdeutsch und wahrt das Passiv.
theological_decisions:
- issue: Bedeutungsbereich von שֶׁקֶץ
  choice: etwas Abscheuliches
  alternative: ein Gräuel
  rationale: Im Zusammenhang bezeichnet das Wort die rituelle Unzulässigkeit als Nahrung. „Etwas Abscheuliches“ bewahrt die starke Wertung, ohne sie stillschweigend als allgemeines moralisches Urteil festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlichem rechtlichem Ton. „Kleingetier“ bildet die breite Tierklasse idiomatisch ab; die Fußnote hält die kollektive Alternative „Gewimmel“ offen. Die Marker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
