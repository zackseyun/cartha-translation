id: LEV.11.3
reference: Leviticus 11:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כֹּ֣ל מַפְרֶ֣סֶת פַּרְסָ֗ה וְ/שֹׁסַ֤עַת שֶׁ֨סַע֙ פְּרָסֹ֔ת מַעֲלַ֥ת גֵּרָ֖ה בַּ/בְּהֵמָ֑ה אֹתָ֖/הּ תֹּאכֵֽלוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/003.yaml
  text: You may eat any animal that has a split hoof[a], completely divided[b], and that chews the cud.
translation:
  language: de
  text: Von allen Landtieren dürft ihr jedes essen, das gespaltene Hufe hat, die vollständig durchgeteilt sind[a], und wiederkäut[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »das den Huf spaltet und eine Spaltung der Hufe durchspaltet«. Das Hebräische verwendet zwei verwandte Ausdrücke, um einen wirklich durchgeteilten Huf zu bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Wiedergekäutes heraufbringt«; gemeint ist: wiederkäut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: jedes
  rationale: Das Wort bezeichnet hier distributiv jedes einzelne Tier, das die folgenden Merkmale erfüllt.
- source_word: מַפְרֶסֶת פַּרְסָה וְשֹׁסַעַת שֶׁסַע פְּרָסֹת
  choice: das gespaltene, vollständig geteilte Hufe hat
  rationale: Die beiden verwandten hebräischen Wendungen beschreiben und präzisieren einen tatsächlich durchgeteilten Huf. Die deutsche Formulierung bewahrt diese Verstärkung, ohne unnatürlich wörtlich zu klingen.
- source_word: מַעֲלַת גֵּרָה
  choice: wiederkäut
  rationale: Die hebräische Wendung bedeutet wörtlich, das Wiedergekäute heraufzubringen. »Wiederkäuen« ist dafür der geläufige und genaue deutsche Ausdruck.
- source_word: בַּבְּהֵמָה
  choice: von allen Landtieren
  rationale: בְּהֵמָה bezeichnet in diesem Einteilungskontext die landlebenden Tiere; »Landtiere« grenzt die Kategorie verständlich von den später behandelten Wasser- und Flugtieren ab.
- source_word: אֹתָהּ תֹּאכֵלוּ
  choice: dürft ihr jedes essen
  rationale: Im Zusammenhang der Speisevorschriften drückt die Verbform Erlaubnis aus, nicht ein Gebot, alle entsprechenden Tiere tatsächlich zu essen. Das rückbezügliche Pronomen wird im Deutschen natürlich durch »jedes« aufgenommen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rechtliche Erlaubnis wird mit »dürft« ausgedrückt; die körperlichen Merkmale bleiben konkret und allgemein verständlich.
