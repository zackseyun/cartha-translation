  text: לְֽ/כָל הַ/בְּהֵמָ֡ה אֲשֶׁ֣ר הִוא֩ מַפְרֶ֨סֶת פַּרְסָ֜ה וְ/שֶׁ֣סַע אֵינֶ֣/נָּה שֹׁסַ֗עַת וְ/גֵרָה֙ אֵינֶ֣/נָּה מַעֲלָ֔ה טְמֵאִ֥ים הֵ֖ם לָ/כֶ֑ם כָּל הַ/נֹּגֵ֥עַ בָּ/הֶ֖ם יִטְמָֽא־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/026.yaml
  text: As for every animal that has a divided hoof[a], but does not split the hoof completely and does not chew the cud, they are unclean to you. Everyone who touches them shall be unclean.
translation:
  language: de
  text: Alle Tiere, die zwar gespaltene Hufe haben, deren Hufe aber nicht vollständig durchgespalten sind[a] und die nicht wiederkäuen, sind für euch unrein. Jeder, der sie berührt, wird unrein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die einen Spalt nicht spalten“. Die Verbindung eines Substantivs mit einem stammverwandten Verb betont, dass der Huf nicht vollständig durchgespalten ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָל הַבְּהֵמָה
  choice: Alle Tiere
  rationale: בְּהֵמָה bezeichnet hier allgemein Landtiere. Die deutsche Pluralform gibt die durch לְכָל eingeführte Tiergruppe natürlich wieder und stimmt mit dem folgenden pluralischen הֵם überein.
- source_word: מַפְרֶסֶת פַּרְסָה
  choice: die zwar gespaltene Hufe haben
  rationale: Die hebräische Wendung beschreibt Tiere mit gespaltenen Hufen. „Zwar“ bereitet den anschließenden Gegensatz vor, ohne zusätzliche zoologische Kategorien einzuführen.
- source_word: וְשֶׁסַע אֵינֶנָּה שֹׁסַעַת
  choice: bei denen die Spaltung aber nicht vollständig ist
  rationale: Die Verbindung aus stammverwandtem Substantiv und Verb präzisiert, dass der Huf nicht völlig durchgespalten ist. Die Formulierung bewahrt den Gegensatz und klingt im Deutschen natürlich.
- source_word: וְגֵרָה אֵינֶנָּה מַעֲלָה
  choice: und die nicht wiederkäuen
  rationale: „Wiederkäuen“ ist die übliche deutsche Entsprechung für das hebräische Bild des Heraufbringens von Wiedergekäutem.
- source_word: טְמֵאִים הֵם לָכֶם
  choice: sind für euch unrein
  rationale: „Unrein“ bezeichnet im Kontext des Levitikus den kultisch-rechtlichen Reinheitsstatus. „Für euch“ bewahrt die durch לָכֶם ausgedrückte Perspektive.
- source_word: כָּל הַנֹּגֵעַ בָּהֶם
  choice: Jeder, der sie berührt
  rationale: Die Verbindung von כָּל mit dem singularischen Partizip wird als allgemein geltende Aussage wiedergegeben; das pluralische Pronomen bezieht sich auf die genannten Tiere.
- source_word: יִטְמָא
  choice: wird unrein
  rationale: Das Imperfekt bezeichnet hier die eintretende rechtliche Folge der Berührung, nicht unmittelbar ein Gebot. „Wird unrein“ gibt diesen Zustandswechsel klar wieder.
theological_decisions:
- issue: Reinheitsterminologie im levitischen Gesetz
  choice: unrein
  alternative: rituell unrein; verunreinigt
  rationale: „Unrein“ bewahrt die kultisch-rechtliche Kategorie des Textes, ohne sie als moralische Schuld auszulegen. Ein Zusatz wie „rituell“ wäre erklärend, steht aber nicht ausdrücklich im hebräischen Text.
- issue: Art der Aussage in יִטְמָא
  choice: wird unrein
  alternative: soll unrein sein
  rationale: Der Satz beschreibt die rechtliche Folge einer Berührung. Die Übersetzung vermeidet, die Aussage fälschlich als Aufforderung zum Unreinwerden erscheinen zu lassen.
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer Rechtsterminologie. Der Satzbau löst den hebräischen Wechsel vom kollektiven Singular zum Plural natürlich auf, ohne die inhaltlichen Kriterien zu verändern.
