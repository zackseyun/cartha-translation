  text: וְ/הָֽ/אֹכֵל֙ מִ/נִּבְלָתָ֔/הּ יְכַבֵּ֥ס בְּגָדָ֖י/ו וְ/טָמֵ֣א עַד הָ/עָ֑רֶב וְ/הַ/נֹּשֵׂא֙ אֶת נִבְלָתָ֔/הּ יְכַבֵּ֥ס בְּגָדָ֖י/ו וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/040.yaml
  text: And the one who eats any of its carcass shall wash his clothes and be unclean until the evening[b][a], and the one who carries its carcass shall wash his clothes and be unclean until the evening.
translation:
  language: de
  text: Wer etwas vom Tierkörper isst[a], muss seine Kleider waschen und ist bis zum Abend unrein[b]. Wer den Tierkörper trägt, muss seine Kleider waschen und ist bis zum Abend unrein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „von dem Tierkörper“ oder „einen Teil des Tierkörpers“; die hebräische Formulierung ist partitiv.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist Unreinheit im Sinn der rituellen Reinheitsvorschriften Israels.
    reason: cultural_note
lexical_decisions:
- source_word: הָאֹכֵל
  choice: Wer … isst
  rationale: Der substantivierte Partizip bezeichnet allgemein jede Person, die dies tut. Die deutsche Wer-Konstruktion gibt den rechtlichen Allgemeinsatz natürlich und präzise wieder.
- source_word: מִנִּבְלָתָהּ
  choice: etwas von seinem Kadaver
  rationale: 'Die Präposition מִן ist hier partitiv: Gemeint ist das Essen von einem Teil des Tierkadavers. „Etwas von“ macht diesen Sinn im Deutschen verständlich, ohne den Umfang näher festzulegen.'
- source_word: נְבֵלָה / נִבְלָתָהּ
  choice: Kadaver
  rationale: Im Zusammenhang der Reinheitsvorschriften bezeichnet das Wort den toten Körper eines Tieres. „Kadaver“ ist dafür im modernen Standarddeutsch präzise.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: muss seine Kleider waschen
  rationale: Das Imperfekt hat im Gesetzestext verpflichtende Kraft. „Muss“ vermittelt diese Vorschrift im heutigen Deutsch natürlicher als ein futurisches „soll“.
- source_word: וְטָמֵא
  choice: und ist … unrein
  rationale: Die Formulierung bezeichnet den daraus folgenden Unreinheitsstatus. Das schlichte „unrein“ bewahrt den Wortlaut; die kultisch-rituelle Bedeutung wird in einer Fußnote erläutert.
- source_word: עַד הָעָרֶב
  choice: bis zum Abend
  rationale: Dies entspricht der zeitlichen Grenze des hebräischen Ausdrucks einschließlich des bestimmten Artikels und ist eine geläufige deutsche Wendung.
- source_word: הַנֹּשֵׂא
  choice: Wer … trägt
  rationale: Auch dieses substantivierte Partizip ist generisch. Die parallele Wer-Konstruktion bewahrt den Aufbau der beiden Vorschriften.
- source_word: אֶת נִבְלָתָהּ
  choice: seinen Kadaver
  rationale: Das Suffix verweist auf das zuvor genannte Tier. Das maskuline Pronomen richtet sich im Deutschen nach „Kadaver“ beziehungsweise dem vorausgesetzten „Tier“, nicht nach dem grammatischen Geschlecht des hebräischen Bezugsworts.
theological_decisions:
- issue: Art der Unreinheit
  choice: Im Haupttext steht nur „unrein“; eine Fußnote erläutert den rituellen Sinn.
  alternative: „rituell unrein“ im Haupttext
  rationale: טָמֵא enthält hier im Kontext der israelitischen Reinheitsvorschriften einen kultisch-rituellen Sinn. Das ergänzende Adverb steht jedoch nicht ausdrücklich im Hebräischen und wird deshalb nicht in den Haupttext aufgenommen.
- issue: Generisches Geschlecht in der Rechtsformulierung
  choice: „Wer … seine Kleider“
  alternative: Pluralische oder ausdrücklich geschlechtsneutrale Umformulierung
  rationale: Die Wer-Konstruktion ist im Deutschen generisch und natürlich; das anschließende singularische „seine“ erhält zugleich die Einzahl der hebräischen Rechtsformulierung.
translation_notes:
  register: Moderner, würdiger Gesetzesstil mit klaren parallelen Wer-Sätzen. „Muss“ gibt die verpflichtende Funktion idiomatisch wieder; „Kadaver“ wahrt die sachliche Präzision des Tierkontexts.
