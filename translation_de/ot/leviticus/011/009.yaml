base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/009.yaml
  text: 'These you may eat from all that are in the waters: whatever in the waters[a], in the seas and in the streams, has fins and scales—these you may eat.'
translation:
  language: de
  text: 'Von allem, was im Wasser ist, dürft ihr Folgendes essen: Alles, was im Wasser, in den Meeren und in den Wasserläufen[a] Flossen und Schuppen hat, dürft ihr essen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Flüssen“, „Bächen“ oder „Wadis“. Das hebräische Wort נְחָלִים kann je nach Zusammenhang Flüsse, Bäche, Wasserläufe oder Wadis bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת זֶה
  choice: Folgendes
  rationale: Der singularische hebräische Demonstrativ eröffnet die Aufzählung kategorisch; „Folgendes“ ist im Deutschen natürlich und wahrt diese Form besser als ein unbezogenes „dies“.
- source_word: תֹּאכְלוּ
  choice: dürft ihr essen
  rationale: Der Imperfekt der 2. Person Plural bezeichnet in diesem Speisegesetz die erlaubte Aufnahme und wird daher permissiv wiedergegeben.
- source_word: מִכֹּל אֲשֶׁר בַּמָּיִם
  choice: von allem, was im Wasser lebt
  rationale: „Von allem“ bewahrt den partitiven Sinn von מִן; „lebt“ macht die im Deutschen notwendige Bezugnahme auf Wassertiere deutlich, ohne eine Tierart hinzuzufügen.
- source_word: כֹּל אֲשֶׁר לוֹ
  choice: alles ..., was ... hat
  rationale: Gibt die distributive Relativkonstruktion und den mit לוֹ ausgedrückten Besitz idiomatisch wieder.
- source_word: סְנַפִּיר וְקַשְׂקֶשֶׂת
  choice: Flossen und Schuppen
  rationale: Die hebräischen Singularformen fungieren als Gattungs- bzw. Kollektivbegriffe; im modernen Deutschen ist der Plural die natürliche zoologische Ausdrucksweise.
- source_word: בַּיַּמִּים וּבַנְּחָלִים
  choice: in den Meeren und in den Flüssen
  rationale: יַמִּים bezeichnet Meere; נְחָלִים umfasst je nach Kontext Flüsse, Bäche, Wasserläufe oder Wadis. „Flüsse“ bezeichnet hier verständlich die Binnengewässer und wird durch eine Fußnote qualifiziert.
- source_word: אֹתָם תֹּאכֵלוּ
  choice: dürft ihr essen
  rationale: Die abschließende Wiederaufnahme wird beibehalten; das deutsche Relativpronomen „was“ dient bereits als Objekt, sodass ein zusätzliches „sie“ ungrammatisch wäre.
