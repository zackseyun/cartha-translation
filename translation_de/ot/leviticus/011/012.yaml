  text: כֹּ֣ל אֲשֶׁ֥ר אֵֽין ל֛/וֹ סְנַפִּ֥יר וְ/קַשְׂקֶ֖שֶׂת בַּ/מָּ֑יִם שֶׁ֥קֶץ ה֖וּא לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/012.yaml
  text: Everything in the water that does not have fins and scales is detestable to you[a].
translation:
  language: de
  text: Alles, was im Wasser keine Flossen und Schuppen hat, ist für euch etwas Abscheuliches.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ist für euch ein Gräuel“. Das hebräische Wort bezeichnet hier im Zusammenhang der Speisegebote etwas kultisch Verabscheuungswürdiges.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: Alles
  rationale: Die umfassende Bedeutung wird im Deutschen natürlich und prägnant mit „Alles“ wiedergegeben.
- source_word: אֲשֶׁר
  choice: was
  rationale: Das Relativpronomen „was“ knüpft idiomatisch an das substantivierte „Alles“ an.
- source_word: אֵין לוֹ
  choice: keine … hat
  rationale: Die hebräische Existenzverneinung mit pronominalem Bezug wird im Deutschen am natürlichsten als verneinter Besitz ausgedrückt.
- source_word: סְנַפִּיר וְקַשְׂקֶשֶׂת
  choice: Flossen und Schuppen
  rationale: Die hebräischen Singularformen sind generisch; im Deutschen ist bei der Beschreibung von Wassertieren der Plural üblich.
- source_word: בַּמָּיִם
  choice: im Wasser
  rationale: Das formal plurale hebräische מַיִם entspricht hier dem deutschen Kollektivbegriff „Wasser“.
- source_word: שֶׁקֶץ
  choice: ein Gräuel
  rationale: „Gräuel“ bewahrt die starke Wertung und den kultisch-speiserechtlichen Kontext des Nomens, ohne es mit dem anderen Reinheitsvokabular gleichzusetzen.
- source_word: הוּא לָכֶם
  choice: soll euch … sein
  rationale: Die Formulierung bewahrt den nominalen Charakter und die adressatenbezogene Geltung der hebräischen Aussage in würdigem, verständlichem Deutsch.
theological_decisions:
- issue: Wiedergabe von שֶׁקֶץ im Kontext der Speisegebote
  choice: ein Gräuel
  alternative: etwas Abscheuliches; verabscheuungswürdig
  rationale: „Ein Gräuel“ erhält sowohl die substantivische Form als auch die starke kultische Bewertung. „Unrein“ wurde vermieden, da hier nicht das übliche hebräische Reinheitsvokabular steht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am Hebräischen, während „Flossen und Schuppen“ sowie „im Wasser“ idiomatisch deutsch formuliert sind.
