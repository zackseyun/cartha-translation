base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/002.yaml
  text: Speak to the sons of Israel[a], saying[c][b], ‘These are the living creatures that you may eat from among all the animals that are on the earth.’
translation:
  language: de
  text: 'Sagt zu den Israeliten: »Dies[a] sind die Tiere, die ihr unter allen Tieren auf der Erde essen dürft.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Dies ist das Tier, das ihr unter allen Tieren auf der Erde essen dürft.“ Das Hebräische verwendet den Singular hier in klassifizierendem beziehungsweise kollektivem Sinn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבְּרוּ
  choice: Sagt
  rationale: Der Imperativ steht im Plural und richtet sich im Zusammenhang an Mose und Aaron. „Sagt“ gibt den Sprechauftrag natürlich und präzise wieder.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die feste hebräische Gruppenbezeichnung bedeutet wörtlich „Söhne Israels“, bezeichnet hier aber das gesamte Volk. „Israeliten“ ist im modernen Deutschen natürlich und schließt die angesprochene Gemeinschaft insgesamt ein.
- source_word: לֵאמֹר
  choice: durch den folgenden Doppelpunkt wiedergegeben
  rationale: Der hebräische Zitateinleiter lässt sich im Deutschen idiomatisch durch den Doppelpunkt vor der direkten Rede ausdrücken; ein zusätzliches „und sprecht“ wäre möglich, aber schwerfälliger.
- source_word: זֹאת הַחַיָּה
  choice: Das sind die Lebewesen
  rationale: Demonstrativ und Substantiv sind formal Singular, doch חַיָּה hat hier klassifizierende beziehungsweise kollektive Funktion und leitet die nachfolgende Aufzählung essbarer Tierarten ein. Der deutsche Plural vermittelt diesen Sinn natürlich.
- source_word: אֲשֶׁר תֹּאכְלוּ
  choice: die ihr … essen dürft
  rationale: Der Imperfekt bezeichnet im rechtlichen Zusammenhang erlaubten Verzehr. „Dürft“ bringt die Erlaubnis klarer zum Ausdruck als ein bloßes Futur.
- source_word: מִכָּל הַבְּהֵמָה
  choice: von allen Tieren
  rationale: מִן mit כֹּל bezeichnet die Auswahl aus der Gesamtheit. „Von allen Tieren“ ist im Deutschen idiomatisch; בְּהֵמָה wird im Kontext allgemein als Landtier verstanden.
- source_word: אֲשֶׁר עַל הָאָרֶץ
  choice: auf dem Land
  rationale: Die Ortsangabe grenzt diese Tiere von den später behandelten Wassertieren ab. „Land“ gibt diese kategoriale Unterscheidung im Deutschen klar wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede wird idiomatisch mit einem Doppelpunkt eingeleitet. „Israeliten“ vermeidet im heutigen Deutsch die missverständliche Beschränkung auf männliche Angehörige des Volkes; der Plural „Lebewesen“ macht den katalogartigen Sinn des hebräischen Kollektivsingulars deutlich.
