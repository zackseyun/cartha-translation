  text: אַ֤ךְ אֶת זֶה֙ לֹ֣א תֹֽאכְל֔וּ מִֽ/מַּעֲלֵי֙ הַ/גֵּרָ֔ה וּ/מִ/מַּפְרִיסֵ֖י הַ/פַּרְסָ֑ה אֶֽת הַ֠/גָּמָל כִּֽי מַעֲלֵ֨ה גֵרָ֜ה ה֗וּא וּ/פַרְסָה֙ אֵינֶ֣/נּוּ מַפְרִ֔יס טָמֵ֥א ה֖וּא לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/004.yaml
  text: 'Nevertheless[a], you shall not eat these from among those that chew the cud or from among those that divide the hoof: the camel, because it chews the cud but does not divide the hoof[b]; it is unclean to you.'
translation:
  language: de
  text: 'Doch von den Tieren, die wiederkäuen oder gespaltene Hufe haben, sollt ihr folgende nicht essen: das Kamel, denn es käut zwar wieder, spaltet aber den Huf nicht. Es ist für euch unrein.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: nach den Speisegeboten für Israel unrein.'
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: Doch
  rationale: Kennzeichnet die einschränkende Ausnahme von der zuvor genannten Regel in natürlichem, knappem Deutsch.
- source_word: מִמַּעֲלֵי הַגֵּרָה
  choice: von den Tieren, die wiederkäuen
  rationale: Die hebräische Wendung bezeichnet wörtlich das Heraufbringen des Wiedergekäuten; „wiederkäuen“ ist die klare und übliche deutsche Entsprechung.
- source_word: וּמִמַּפְרִיסֵי הַפַּרְסָה
  choice: oder gespaltene Hufe haben
  rationale: 'Das „oder“ gibt den Sinn der Einteilung wieder: Die folgenden Tiere besitzen jeweils nur eines der erforderlichen Merkmale. „Gespaltene Hufe“ ist im Deutschen verständlich und kontextgerecht.'
- source_word: הַגָּמָל
  choice: das Kamel
  rationale: Direkte Bezeichnung des genannten Tieres.
- source_word: כִּי מַעֲלֵה גֵרָה הוּא
  choice: denn es käut zwar wieder
  rationale: „Zwar“ bereitet den im folgenden Teilsatz ausgedrückten Gegensatz vor, ohne den sachlichen Gehalt zu verändern.
- source_word: וּפַרְסָה אֵינֶנּוּ מַפְרִיס
  choice: spaltet aber den Huf nicht
  rationale: Bewahrt das Bild und den Singular des Hebräischen; „aber“ macht den im Satz angelegten Gegensatz natürlich deutlich.
- source_word: טָמֵא הוּא לָכֶם
  choice: Es ist für euch unrein
  rationale: „Unrein“ wahrt den zentralen Begriff der levitischen Reinheitsordnung; „für euch“ erhält die auf die Angesprochenen bezogene rechtliche Perspektive.
theological_decisions:
- issue: Art der Unreinheit im levitischen Speisegebot
  choice: unrein
  alternative: kultisch unrein / rituell unrein
  rationale: Der Haupttext belässt den umfassenden hebräischen Reinheitsbegriff, statt ihn durch einen deutenden Zusatz einzuengen. Der gesetzliche Kontext für Israel wird in der Fußnote erläutert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt nahe an der hebräischen Klassifikation, löst den Gegensatz der beiden Merkmale aber in natürlicher deutscher Syntax auf.
