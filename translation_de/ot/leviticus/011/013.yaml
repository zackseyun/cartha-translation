  text: וְ/אֶת אֵ֨לֶּה֙ תְּשַׁקְּצ֣וּ מִן הָ/ע֔וֹף לֹ֥א יֵאָכְל֖וּ שֶׁ֣קֶץ הֵ֑ם אֶת הַ/נֶּ֨שֶׁר֙ וְ/אֶת הַ/פֶּ֔רֶס וְ/אֵ֖ת הָ/עָזְנִיָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/013.yaml
  text: 'And these from among the birds you shall regard as detestable[a]; they shall not be eaten; they are detestable: the eagle, the vulture[c][b], and the black vulture.'
translation:
  language: de
  text: 'Und Folgende unter den Vögeln sollt ihr als abscheulich betrachten: den Adler[a], den Bartgeier[b] und den Mönchsgeier[c]. Sie dürfen nicht gegessen werden; sie sind abscheulich.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräischen Vogelnamen in dieser Liste lassen sich nicht immer sicher bestimmen. Das hier mit „Adler“ wiedergegebene Wort kann allgemeiner einen großen Greifvogel oder sogar einen Geier bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Die Bestimmung als „Bartgeier“ (auch „Lämmergeier“) ist wahrscheinlich, aber nicht sicher; gemeint sein könnte allgemeiner eine Geier- oder Adlerart.
    reason: lexical_alternative
  - marker: c
    text: Die genaue Bestimmung dieses Vogels ist unsicher. Neben „Mönchsgeier“ wurden unter anderem Fischadler, Seeadler oder eine andere Geierart vorgeschlagen.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשַׁקְּצוּ
  choice: sollt ihr als abscheulich betrachten
  rationale: Das Piel bezeichnet hier nicht bloß ein Gefühl des Abscheus, sondern die gebotene Einstufung als verabscheuungswürdig beziehungsweise tabu. Die Formulierung bewahrt diese rechtlich-kultische Wertung.
- source_word: מִן הָעוֹף
  choice: von den Vögeln
  rationale: 'Das מִן ist partitiv: Aus der Gruppe der Vögel werden bestimmte Tiere ausgesondert. עוֹף kann weiter gefasst sein, bezeichnet hier im Zusammenhang jedoch natürlich Vögel.'
- source_word: לֹא יֵאָכְלוּ
  choice: sie dürfen nicht gegessen werden
  rationale: Der passive Prohibitiv wird in natürlichem modernem Deutsch als Verbot wiedergegeben; die Passivform des Hebräischen bleibt erhalten.
- source_word: שֶׁקֶץ
  choice: abscheulich
  rationale: Der Ausdruck bezeichnet im Speisegesetz etwas kultisch Verabscheuungswürdiges oder Tabuisiertes. „Abscheulich“ bewahrt die stärkere Wertung und wird nicht auf „unrein“ eingeengt.
- source_word: הַנֶּשֶׁר
  choice: Adler
  rationale: „Adler“ ist die traditionelle und weiterhin mögliche Wiedergabe; das hebräische Wort kann jedoch allgemeiner einen großen Greif- oder Aasvogel bezeichnen, weshalb eine Fußnote die Unsicherheit nennt.
- source_word: הַפֶּרֶס
  choice: Bartgeier
  rationale: Der Name wird häufig mit dem Bartgeier beziehungsweise Lämmergeier verbunden. Da die zoologische Bestimmung nicht völlig sicher ist, wird sie in einer Fußnote als wahrscheinlich, nicht gewiss, ausgewiesen.
- source_word: הָעָזְנִיָּה
  choice: Mönchsgeier
  rationale: „Mönchsgeier“ entspricht der oft gemeinten Art Aegypius monachus, die im Englischen „black vulture“ heißt. Die genaue Identifikation des alten Vogelnamens bleibt dennoch unsicher und wird deshalb erläutert.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Gesetzessprache. Die Wiederholung von „abscheulich“ bildet die nachdrückliche Wiederholung des hebräischen Stammes שׁקץ ab. Die zoologische Unsicherheit wird nicht durch scheinbar eindeutige Artnamen verschleiert, sondern in den Fußnoten ausdrücklich bewahrt.
