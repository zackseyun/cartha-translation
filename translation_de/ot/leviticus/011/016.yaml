  yaml_path: translation/ot/leviticus/011/016.yaml
  text: and the ostrich[a], and the hawk, and the gull, and the falcon according to its kind,
translation:
  language: de
  text: und den Strauß[a], den Habicht, die Möwe und den Falken nach seiner Art,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Bestimmung mehrerer Vogelbezeichnungen in diesem Vers ist unsicher. Als traditionelle Alternativen kommen unter anderem »Eule« für »Strauß«, »Nachtschwalbe« oder »Eule« für »Habicht«, »Kuckuck« für »Möwe« und »Habicht« für »Falke« vor.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּת הַיַּעֲנָה
  choice: den Strauß
  rationale: Die Wendung bedeutet wörtlich etwa »Tochter der Ja’ana«, dient in Tierlisten jedoch als Vogelbezeichnung. »Strauß« entspricht der wahrscheinlichsten modernen Identifikation, auch wenn die genaue Zuordnung unsicher bleibt.
- source_word: הַתַּחְמָס
  choice: den Habicht
  rationale: Die genaue Vogelart ist unsicher. »Habicht« gibt plausibel einen Greifvogel wieder und unterscheidet den Ausdruck im Deutschen von נֵץ.
- source_word: הַשָּׁחַף
  choice: die Möwe
  rationale: Die Identifikation ist nicht sicher; »Möwe« ist jedoch eine verbreitete moderne Wiedergabe und vermeidet eine unbegründet genaue Artbestimmung.
- source_word: הַנֵּץ
  choice: den Falken
  rationale: Das Wort bezeichnet einen Greifvogel und kann als »Falke« oder »Habicht« verstanden werden. »Falke« wahrt hier die lexikalische Unterscheidung zu תַּחְמָס.
- source_word: לְמִינֵהוּ
  choice: nach seinen Arten
  rationale: Die formelhafte Wendung ordnet den genannten Vogel samt seinen verschiedenen Unterarten beziehungsweise Artgruppen ein. Der Plural ist im Deutschen in solchen biblischen Klassifikationsformeln natürlich und verständlich.
- source_word: וְאֵת / וְאֶת
  choice: und / unübersetzter Akkusativanschluss
  rationale: Die wiederholte Konjunktion führt die Liste aus dem vorigen Vers fort; den direkten Objektmarker gibt das Deutsche durch den Akkusativ wieder. Nach dem ersten Glied kann die Aufzählung ohne wiederholtes »und« natürlich fortgeführt werden.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Aufzählungssprache. Der Vers ist syntaktisch die Fortsetzung der Liste aus Vers 15; deshalb beginnt er mit »und« und endet mit einem Komma.
