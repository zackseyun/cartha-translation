revisions:
- from: Von allen Nahrungsmitteln, die gegessen werden, wird jedes unrein, auf das Wasser kommt; und jedes Getränk, das getrunken wird, wird in jedem Gefäß unrein.
  to: Jedes Nahrungsmittel, das gegessen werden kann und auf das Wasser gelangt, wird unrein; ebenso wird jedes Getränk, das in irgendeinem Gefäß getrunken werden kann, unrein.
  rationale: Die Revision beseitigt unnötig unnatürliche deutsche Syntax und stellt die qualifizierende Funktion der beiden Nifal-Formen klar heraus. Sie bewahrt die Reihenfolge und Parallelität der zwei Rechtsaussagen, die nicht spezifizierte Weise, in der Wasser auf die Speise gelangt, sowie den etablierten kultischen Ausdruck „unrein“. Eine Fußnote ist nicht erforderlich, da keine umstrittene textliche oder semantische Entscheidung über die Übersetzung hinaus erläutert werden muss.
