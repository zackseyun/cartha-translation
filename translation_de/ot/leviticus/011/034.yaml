review_pass:
  verdict: revise
  source_fidelity: Die Grundbedeutung wird getroffen, einschließlich der kultisch-rechtlichen Zustandsveränderung durch „wird unrein“. Die Wiedergabe „die gegessen werden / das getrunken wird“ macht die qualifizierenden Nifal-Formen jedoch unnötig faktisch und kann bedeuten, dass die Speise bzw. das Getränk tatsächlich konsumiert wird. Im Kontext bezeichnen sie die Kategorie von Ess- bzw. Trinkbarem. Auch „auf das Wasser kommt“ ist zwar formnah, aber im modernen Deutschen unnatürlich.
  naturalness: Die Konstruktion „Von allen Nahrungsmitteln … wird jedes“ ist verständlich, wirkt aber schwerfällig. „Wasser gelangt auf“ ist idiomatisches modernes Standarddeutsch und wahrt dabei, dass der hebräische Text weder Handelnde noch Art des Aufbringens nennt. Die parallele Satzform bleibt erhalten.
  terminology: „Nahrungsmittel“, „Getränk“, „Gefäß“ und besonders „unrein“ sind für den kultisch-rechtlichen Kontext passend. „Irgendeinem Gefäß“ gibt die distributive bzw. generalisierende Aussage von בְּכָל כְּלִי natürlicher wieder als das im Deutschen potenziell absolut klingende „jedem Gefäß“.
  issues:
  - severity: medium
    issue: Die passiven Relativsätze „die gegessen werden“ und „das getrunken wird“ können tatsächlichen Vollzug statt Ess- bzw. Trinkbarkeit bezeichnen.
    rationale: Die Nifal-Imperfekte qualifizieren die jeweiligen Kategorien. „… werden kann“ gibt diese offene, kategorisierende Nuance im Deutschen klarer wieder, ohne eine weitergehende Auslegung vorzunehmen.
  - severity: low
    issue: „auf das Wasser kommt“ und „Von allen Nahrungsmitteln … wird jedes“ sind im modernen Standarddeutsch stilistisch holprig.
    rationale: „auf das Wasser gelangt“ sowie die direkte Einleitung mit „Jedes Nahrungsmittel“ sind natürlich und bewahren die Aussage und Bedingungen des hebräischen Textes.
  revised_text: Jedes Nahrungsmittel, das gegessen werden kann und auf das Wasser gelangt, wird unrein; ebenso wird jedes Getränk, das in irgendeinem Gefäß getrunken werden kann, unrein.
