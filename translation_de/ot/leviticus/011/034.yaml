  text: מִ/כָּל הָ/אֹ֜כֶל אֲשֶׁ֣ר יֵאָכֵ֗ל אֲשֶׁ֨ר יָב֥וֹא עָלָ֛י/ו מַ֖יִם יִטְמָ֑א וְ/כָל מַשְׁקֶה֙ אֲשֶׁ֣ר יִשָּׁתֶ֔ה בְּ/כָל כְּלִ֖י יִטְמָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/034.yaml
  text: Any food that may be eaten[a], on which water comes, becomes unclean; and any drink that may be drunk in any vessel becomes unclean.
translation:
  language: de
  text: Jedes Nahrungsmittel, das gegessen werden kann und auf das Wasser gelangt, wird unrein; ebenso wird jedes Getränk, das in irgendeinem Gefäß getrunken werden kann, unrein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִכָּל הָאֹכֶל
  choice: Von allen Nahrungsmitteln … jedes
  rationale: Die partitive Wendung מִכָּל wird im Deutschen durch die natürliche Konstruktion „von allen … jedes“ wiedergegeben; הָאֹכֶל bezeichnet Nahrung beziehungsweise Nahrungsmittel.
- source_word: אֲשֶׁר יֵאָכֵל
  choice: die gegessen werden
  rationale: Das Nifal Imperfekt lässt sich hier als allgemeine Bestimmung der Nahrung verstehen. Die formnahe Wiedergabe bewahrt die mögliche Nuance gegenüber der stärker deutenden Übersetzung „die essbar sind“.
- source_word: אֲשֶׁר יָבֹא עָלָיו מַיִם
  choice: auf das Wasser kommt
  rationale: Die Formulierung folgt dem hebräischen Bild wörtlich genug und legt weder eine handelnde Person noch eine bestimmte Art des Kontakts fest.
- source_word: יִטְמָא
  choice: wird unrein
  rationale: Im kultischen Rechtszusammenhang bezeichnet טמא den Eintritt in den Zustand ritueller Unreinheit. „Wird unrein“ gibt die Zustandsveränderung knapp wieder.
- source_word: מַשְׁקֶה
  choice: Getränk
  rationale: Das Substantiv bezeichnet etwas, das getrunken wird; „Getränk“ ist im Deutschen präzise und natürlich.
- source_word: אֲשֶׁר יִשָּׁתֶה
  choice: das getrunken wird
  rationale: Die formnahe passive Wiedergabe erhält die Parallelität zu „die gegessen werden“ und vermeidet die zusätzliche Auslegung „trinkbar“.
- source_word: בְּכָל כְּלִי
  choice: in jedem Gefäß
  rationale: כְּלִי bezeichnet hier allgemein ein Gefäß oder Behältnis. „In jedem Gefäß“ bewahrt die distributive Form des Hebräischen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rechtssprachlicher Klarheit. Die syntaktische Parallelität des Hebräischen wird weitgehend erhalten; kultische Unreinheit wird mit dem in Levitikus etablierten Ausdruck „unrein“ bezeichnet.
