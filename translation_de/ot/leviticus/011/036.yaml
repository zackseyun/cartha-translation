source:
  edition: WLC
  text: אַ֣ךְ מַעְיָ֥ן וּ/ב֛וֹר מִקְוֵה מַ֖יִם יִהְיֶ֣ה טָה֑וֹר וְ/נֹגֵ֥עַ בְּ/נִבְלָתָ֖/ם יִטְמָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/036.yaml
  text: However[a], a spring or a cistern collecting water shall remain clean, but whoever touches their carcass shall be unclean.
translation:
  language: de
  text: Doch eine Quelle oder Zisterne mit angesammeltem Wasser[a] ist rein. Wer aber ihr Aas berührt, wird unrein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „eine Ansammlung von Wasser“. Die hebräische Wendung מִקְוֵה מַיִם bezeichnet angesammeltes Wasser bzw. eine Wasseransammlung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Doch
  rationale: Die Partikel kennzeichnet hier eine Ausnahme von den zuvor genannten Verunreinigungsregeln; „Doch“ gibt diesen Gegensatz knapp und natürlich wieder.
- source_word: מַעְיָן
  choice: Quelle
  rationale: Das Wort bezeichnet eine natürliche Wasserquelle; „Quelle“ ist die geläufige moderne Entsprechung.
- source_word: בּוֹר
  choice: Zisterne
  rationale: Im Zusammenhang mit angesammeltem Wasser bezeichnet das Wort einen künstlich angelegten Wasserspeicher; „Zisterne“ ist präziser als „Grube“ oder „Brunnen“.
- source_word: מִקְוֵה מַיִם
  choice: in der sich Wasser sammelt
  rationale: Die konstruktusartige Wendung bezeichnet eine Ansammlung beziehungsweise einen Vorrat von Wasser. Die Relativkonstruktion ist im Deutschen natürlich und bewahrt den Gedanken des gesammelten Wassers.
- source_word: יִהְיֶה טָהוֹר
  choice: bleibt rein
  rationale: Wörtlich steht „wird/ist rein“. Im Kontext wird ausgesagt, dass die Wasserquelle trotz der zuvor beschriebenen Berührung nicht verunreinigt wird; „bleibt rein“ macht diese kontextuell angelegte Fortdauer verständlich.
- source_word: נֹגֵעַ
  choice: wer … berührt
  rationale: Das substantivisch gebrauchte Partizip hat allgemeine Bedeutung; „wer … berührt“ ist dafür eine natürliche deutsche Formulierung.
- source_word: נִבְלָתָם
  choice: ihr Aas
  rationale: נְבֵלָה bezeichnet den toten Körper eines Tieres. Der Pluralsuffix verweist auf die zuvor genannten Tiere; das singularische „Aas“ kann wie im Hebräischen kollektiv verstanden werden.
- source_word: יִטְמָא
  choice: wird unrein
  rationale: Die Verbform bezeichnet den eintretenden Zustand kultischer Unreinheit. „Wird unrein“ gibt diesen Übergang im modernen Deutschen deutlich wieder.
theological_decisions:
- issue: Terminologie der rituellen Reinheit
  choice: rein / unrein
  alternative: sauber / unsauber; kultisch rein / kultisch unrein
  rationale: „Rein / unrein“ ist die etablierte und zugleich verständliche Terminologie für die kultischen Reinheitsbestimmungen in Levitikus. Sie vermeidet sowohl eine bloß hygienische Deutung als auch eine unnötige erklärende Erweiterung.
- issue: Fortdauer der Reinheit der Wasserstelle
  choice: bleibt rein
  alternative: ist rein; soll rein sein
  rationale: Der unmittelbare Zusammenhang stellt eine Ausnahme von der Verunreinigung durch einen Tierkadaver dar. „Bleibt rein“ drückt diese kontextuelle Funktion aus, ohne die Aussage als Gebot umzudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung ist nah am hebräischen Satzbau, wird aber durch einen Relativsatz idiomatisch gestaltet. „Rein / unrein“ bewahrt die kultische Fachsprache des Abschnitts; „Aas“ gibt den tierbezogenen und kollektiv möglichen Sinn knapp wieder.
