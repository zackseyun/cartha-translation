  naturalness: „Sackstoff“ ist im modernen Standarddeutsch ungebräuchlich. Die Konstruktion „sei es irgendein … – jeder Gegenstand“ ist zudem syntaktisch und logisch uneinheitlich. Eine direkte Aufzählung mit Doppelpunkt ist klarer und entspricht der rechtssprachlichen Struktur.
  terminology: „unrein/rein“ ist für die kultisch-rituelle Terminologie angemessen. „Fell“ ist für עוֹר zu eng, da das Wort allgemein Tierhaut/Haut bezeichnen kann und kein Fellhaar voraussetzt. „Tierhaut“ wahrt die Materialbedeutung. Die Fußnote muss am Ausdruck zur Wasserbehandlung verankert bleiben.
