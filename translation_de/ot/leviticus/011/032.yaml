  text: וְ/כֹ֣ל אֲשֶׁר יִפֹּל עָלָי/ו֩ מֵ/הֶ֨ם בְּ/מֹתָ֜/ם יִטְמָ֗א מִ/כָּל כְּלִי עֵץ֙ א֣וֹ בֶ֤גֶד אוֹ עוֹר֙ א֣וֹ שָׂ֔ק כָּל כְּלִ֕י אֲשֶׁר יֵעָשֶׂ֥ה מְלָאכָ֖ה בָּ/הֶ֑ם בַּ/מַּ֧יִם יוּבָ֛א וְ/טָמֵ֥א עַד הָ/עֶ֖רֶב וְ/טָהֵֽר־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/032.yaml
  text: And everything on which any of them falls when they are dead shall become unclean—from any wooden vessel or garment or skin or sackcloth, any vessel with which work is done. It shall be put into the water, and it shall be unclean until the evening; then it shall be clean.
translation:
  language: de
  text: 'Und alles, worauf eines von ihnen fällt, wenn sie tot sind, wird unrein: jedes Gerät aus Holz, jedes Kleidungsstück, jede Tierhaut oder jeder Sack, jeder Gegenstand, mit dem Arbeit verrichtet wird. Er soll ins Wasser gebracht werden[a] und bleibt bis zum Abend unrein; dann ist er rein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ins Wasser gebracht werden“; möglicherweise ist gemeint: „in Wasser untergetaucht werden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר יִפֹּל עָלָיו מֵהֶם בְּמֹתָם
  choice: Und alles, worauf eines von ihnen fällt, wenn es tot ist
  rationale: Die Formulierung bewahrt den umfassenden Charakter von כֹּל und bezieht den Singular idiomatisch auf jeweils eines der zuvor genannten Tiere. בְּמֹתָם bezeichnet hier den Zustand des Totseins.
- source_word: יִטְמָא
  choice: wird unrein
  rationale: Das Verb bezeichnet den Eintritt in den kultisch unreinen Zustand; „wird unrein“ gibt diesen Zustandswechsel knapp und natürlich wieder.
- source_word: מִכָּל כְּלִי עֵץ א֣וֹ בֶגֶד אוֹ עוֹר א֣וֹ שָׂק
  choice: sei es irgendein Gerät aus Holz, ein Kleidungsstück, ein Fell oder ein Sackstoff
  rationale: מִן führt hier die betroffenen Arten von Gegenständen an. כְּלִי ist weiter als „Gefäß“, daher passt „Gerät“ im Deutschen besser zur anschließenden Zweckbestimmung. עוֹר bleibt mit „Fell“ hinsichtlich des Verarbeitungsgrades offen; שָׂק bezeichnet grobes Gewebe beziehungsweise Sackstoff.
- source_word: כָּל כְּלִי אֲשֶׁר יֵעָשֶׂה מְלָאכָה בָּהֶם
  choice: jeder Gegenstand, mit dem eine Arbeit verrichtet wird
  rationale: Die passive und instrumentale Konstruktion wird bewahrt. „Gegenstand“ vermeidet die zu enge Bedeutung von „Gefäß“ und umfasst die zuvor genannten Materialien.
- source_word: בַּמַּיִם יוּבָא
  choice: Er soll ins Wasser gelegt werden
  rationale: Wörtlich steht „ins Wasser gebracht werden“. „Ins Wasser gelegt“ ist im Deutschen natürlich, ohne die über den Wortlaut hinausgehende Vorstellung vollständigen Untertauchens festzuschreiben.
- source_word: וְטָמֵא עַד הָעֶרֶב וְטָהֵר
  choice: und bleibt bis zum Abend unrein; dann ist er rein
  rationale: Die Formulierung macht die zeitliche Abfolge klar und gibt das Gegensatzpaar טמא/טהר als „unrein/rein“ wieder.
theological_decisions:
- issue: Art der Reinheitsbegriffe
  choice: „unrein/rein“ im kultisch-rechtlichen Sinn
  alternative: „befleckt/unbefleckt“ oder „unrein/geläutert“
  rationale: Der Vers regelt den rituellen Status von Gegenständen und behauptet keine moralische Schuld. Das etablierte Wortpaar „unrein/rein“ wahrt diesen Unterschied.
- issue: Art der Wasserbehandlung
  choice: „ins Wasser gelegt werden“ mit Fußnote zur wörtlichen Form
  alternative: „in Wasser untergetaucht werden“
  rationale: Der hebräische Hophol von בוא bedeutet wörtlich „hineingebracht werden“ und legt allein nicht zweifelsfrei fest, ob vollständiges Untertauchen gemeint ist. Die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Moderne, verständliche und zugleich würdige Rechtssprache. Der Satzbau folgt der Aufzählungsstruktur des Hebräischen, wird aber durch „sei es“ und den Gedankenstrich im Deutschen gegliedert. Das grammatische Geschlecht von „Gegenstand“ bestimmt die Pronomen im zweiten Satz.
