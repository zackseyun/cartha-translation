  text: וְ/כֹ֣ל הוֹלֵ֣ךְ עַל כַּפָּ֗י/ו בְּ/כָל הַֽ/חַיָּה֙ הַ/הֹלֶ֣כֶת עַל אַרְבַּ֔ע טְמֵאִ֥ים הֵ֖ם לָ/כֶ֑ם כָּל הַ/נֹּגֵ֥עַ בְּ/נִבְלָתָ֖/ם יִטְמָ֥א עַד הָ/עָֽרֶב׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/027.yaml
  text: And every one that walks on its paws, among all the animals that walk on four feet, they are unclean to you. Everyone who touches their carcass shall be unclean until the evening.
translation:
  language: de
  text: Und alle Tiere, die auf ihren Pfoten laufen, unter allen Tieren, die auf vier Beinen laufen, sind für euch unrein. Jeder, der den Kadaver eines solchen Tieres berührt, wird bis zum Abend unrein sein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכֹל הוֹלֵךְ עַל כַּפָּיו
  choice: Und alle Tiere, die auf ihren Tatzen gehen
  rationale: Das substantivierte כֹל mit dem Partizip bezeichnet hier im Zusammenhang eine Tierklasse. כַּף meint bei solchen Tieren die Tatze beziehungsweise Fußsohle; „Tatzen“ ist natürlich und genauer als das menschlich klingende „Handflächen“.
- source_word: בְּכָל הַחַיָּה הַהֹלֶכֶת עַל אַרְבַּע
  choice: unter allen Tieren, die auf vier Beinen gehen
  rationale: חַיָּה bezeichnet hier Landtiere. Die kollektive feminine Singularform wird im Deutschen idiomatisch pluralisch wiedergegeben; „auf vier Beinen“ macht die verkürzte hebräische Wendung verständlich.
- source_word: טְמֵאִים הֵם לָכֶם
  choice: sind für euch unrein
  rationale: „Unrein“ wahrt die kultisch-rituelle Kategorie von טמא und vermeidet eine moralische Umdeutung.
- source_word: כָּל הַנֹּגֵעַ בְּנִבְלָתָם
  choice: Jeder, der ihr Aas berührt
  rationale: נְבֵלָה bezeichnet den toten Tierkörper beziehungsweise das Aas. Der hebräische Singular mit pluralischem Suffix hat kollektive Funktion; das deutsche „ihr Aas“ bewahrt diese Form und ist verständlich.
- source_word: יִטְמָא עַד הָעָרֶב
  choice: ist bis zum Abend unrein
  rationale: Der Imperfekt formuliert in diesem Rechtssatz die eintretende Folge. Das deutsche Präsens klingt in Gesetzessprache natürlich und gibt den Status präzise wieder.
theological_decisions:
- issue: Terminologie ritueller Reinheit
  choice: unrein
  alternative: rituell unrein; verunreinigt
  rationale: Der Vers regelt einen kultischen Status, nicht unmittelbar moralische Schuld. „Unrein“ ist die etablierte und knappe deutsche Entsprechung.
translation_notes:
  register: Moderne, würdige Gesetzessprache. Der erste Satz folgt der hebräischen Klassenbeschreibung, wird aber durch „Tiere“ und den deutschen Plural natürlich formuliert. Die kollektive Singularform „ihr Aas“ bleibt erhalten; eine Fußnote ist für diesen kurzen Vers nicht notwendig.
