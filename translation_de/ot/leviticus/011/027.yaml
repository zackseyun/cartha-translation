  naturalness: „Auf ihren Tatzen gehen“ ist weniger idiomatisch als „auf ihren Pfoten laufen“. Die explizite Folgeformulierung „wird bis zum Abend unrein sein“ bildet den rechtlich-prospektiven Charakter des hebräischen Imperfekts klarer ab.
  terminology: „Unrein“ ist als kultisch-rituelle Kategorie richtig. „Kadaver“ ist hier die sachlichere moderne Entsprechung für נְבֵלָה als „Aas“ und vermeidet unnötige Konnotationen von Verwesung oder Aasfressen.
