id: LEV.11.33
reference: Leviticus 11:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/כָל כְּלִי חֶ֔רֶשׂ אֲשֶׁר יִפֹּ֥ל מֵ/הֶ֖ם אֶל תּוֹכ֑/וֹ כֹּ֣ל אֲשֶׁ֧ר בְּ/תוֹכ֛/וֹ יִטְמָ֖א וְ/אֹת֥/וֹ תִשְׁבֹּֽרוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/033.yaml
  text: And every earthenware vessel into which any of them falls—everything that is in it shall become unclean[a], and you shall break it.
translation:
  language: de
  text: 'Und jedes Tongefäß[a], in das eines von ihnen fällt: Alles, was darin ist, wird unrein, und das Gefäß selbst sollt ihr zerbrechen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gemeint ist ein Gefäß aus gebranntem Ton; auch: „irdenes Gefäß“ oder „Keramikgefäß“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלִי חֶרֶשׂ
  choice: Tongefäß
  rationale: כְּלִי bezeichnet hier einen Behälter, חֶרֶשׂ bestimmt dessen Material als gebrannten Ton. „Tongefäß“ ist im Deutschen natürlich und bewahrt die für die Reinheitsvorschrift wichtige Materialangabe.
- source_word: יִפֹּל מֵהֶם
  choice: eines von ihnen fällt
  rationale: Das Pluralpronomen verweist auf die zuvor genannten Tiere beziehungsweise deren Kadaver. Die Formulierung gibt den distributiven Sinn knapp und eindeutig wieder.
- source_word: אֶל תּוֹכוֹ
  choice: in das
  rationale: Die Wendung bezeichnet eine Bewegung in das Innere des Gefäßes; der deutsche Relativsatz gibt dies natürlich wieder.
- source_word: כֹּל אֲשֶׁר בְּתוֹכוֹ
  choice: Alles, was darin ist
  rationale: „Alles“ bewahrt die umfassende Aussage von כֹּל, während „darin“ den Innenraum des Gefäßes idiomatisch bezeichnet.
- source_word: יִטְמָא
  choice: wird unrein
  rationale: Im Kontext der levitischen Reinheitsbestimmungen bezeichnet das Verb den Eintritt in den Zustand ritueller Unreinheit. „Wird unrein“ gibt sowohl den Zustandswechsel als auch die traditionelle biblische Begrifflichkeit wieder.
- source_word: וְאֹתוֹ תִשְׁבֹּרוּ
  choice: und das Gefäß selbst sollt ihr zerbrechen
  rationale: Das vorangestellte Objekt אֹתוֹ hebt das Gefäß hervor. „Das Gefäß selbst“ macht diese Betonung auf natürliche Weise sichtbar; „sollt ihr zerbrechen“ gibt die verbindliche Anweisung wieder, ohne die Art des Zerbrechens unnötig zu verstärken.
theological_decisions:
- issue: Bedeutung von טמא im Reinheitsgesetz
  choice: unrein
  alternative: kultisch unrein
  rationale: „Unrein“ wahrt die knappe Ausdrucksweise des Hebräischen und die etablierte Terminologie des Levitikus. Der Zusammenhang macht den rituellen Sinn deutlich, ohne das erläuternde Wort „kultisch“ in den Bibeltext einzufügen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Der Doppelpunkt bildet den Folgesatz klar ab; „das Gefäß selbst“ bewahrt die hebräische Hervorhebung des Objekts.
