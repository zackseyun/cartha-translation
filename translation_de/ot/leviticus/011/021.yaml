source:
  edition: WLC
  text: אַ֤ךְ אֶת זֶה֙ תֹּֽאכְל֔וּ מִ/כֹּל֙ שֶׁ֣רֶץ הָ/ע֔וֹף הַ/הֹלֵ֖ךְ עַל אַרְבַּ֑ע אֲשֶׁר לא כְרָעַ֨יִם֙ מִ/מַּ֣עַל לְ/רַגְלָ֔י/ו לְ/נַתֵּ֥ר בָּ/הֵ֖ן עַל הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/021.yaml
  text: 'Yet these you may eat from all the swarming things that fly[b][a], that go on all fours: those that have jointed legs above their feet to hop on the ground with them.'
translation:
  language: de
  text: Doch von allen fliegenden Schwärmtieren, die sich auf vier Beinen fortbewegen, dürft ihr diejenigen essen, die Sprungbeine[a][b] oberhalb ihrer Füße haben, um damit auf dem Boden zu hüpfen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Konsonantenschreibung hat wörtlich „die nicht Beine haben“; die traditionelle Lesung, der Zusammenhang und alte Übersetzungen ergeben: „die Sprungbeine haben“.'
    reason: textual_variant
  - marker: b
    text: Auch „gegliederte Beine“ ist als Wiedergabe möglich; gemeint sind die besonderen Hinterbeine, mit denen diese Tiere springen.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Doch
  rationale: Kennzeichnet die Ausnahme vom unmittelbar zuvor ausgesprochenen Verbot und stellt einen natürlichen Kontrast her.
- source_word: אֶת זֶה תֹּאכְלוּ
  choice: dürft ihr diejenigen essen
  rationale: Die singularische Form führt eine erlaubte Klasse ein; im Deutschen ist der Plural im Zusammenhang natürlich. Das Imperfekt drückt hier rechtliche Erlaubnis aus.
- source_word: מִכֹּל שֶׁרֶץ הָעוֹף
  choice: von allen fliegenden Schwärmtieren
  rationale: Bewahrt die breite zoologische Kategorie von שֶׁרֶץ und gibt הָעוֹף als fliegend wieder, ohne irreführend von Vögeln zu sprechen.
- source_word: הַהֹלֵךְ עַל אַרְבַּע
  choice: die sich auf vier Beinen fortbewegen
  rationale: Gibt die Fortbewegungsweise klar und idiomatisch wieder; »Beinen« ist im Deutschen zur Verständlichkeit ergänzt.
- source_word: אֲשֶׁר לא כְרָעַיִם
  choice: die Sprungbeine haben
  rationale: Folgt der überlieferten Lesung לוֹ und dem durch Kontext sowie alte Übersetzungen gestützten Sinn »die ... haben«. כְרָעַיִם bezeichnet hier die zum Springen geeigneten Hinterbeine.
- source_word: מִמַּעַל לְרַגְלָיו
  choice: oberhalb ihrer Füße
  rationale: Bewahrt die anatomische Beschreibung des Hebräischen und passt den Numerus an die als Klasse verstandenen Tiere an.
- source_word: לְנַתֵּר בָּהֵן
  choice: um damit ... zu hüpfen
  rationale: Drückt Zweck und Funktion der besonderen Beine in natürlichem Deutsch aus.
- source_word: עַל הָאָרֶץ
  choice: auf dem Boden
  rationale: »Boden« entspricht in diesem zoologischen Zusammenhang natürlicher dem gemeinten Ort der Fortbewegung als »Erde« oder »Land«.
theological_decisions:
- issue: Textüberlieferung bei אֲשֶׁר לא/לוֹ כְרָעַיִם
  choice: Die traditionelle Lesung לוֹ, »die Sprungbeine haben«, steht im Haupttext.
  alternative: Die Konsonantenschreibung לא ergibt wörtlich »die keine Sprungbeine haben«.
  rationale: Kontext, masoretische Lesetradition und alte Übersetzungen stützen die positive Aussage; die abweichende Konsonantenschreibung wird transparent in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlicher zoologischer Ausdrucksweise. »Schwärmtiere« erhält die breite Kategorie des Ausgangstextes; »Sprungbeine« ist funktional klarer als das technisch oder missverständlich wirkende »Gelenkbeine«.
