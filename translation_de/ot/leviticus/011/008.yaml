id: LEV.11.8
reference: Leviticus 11:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: מִ/בְּשָׂרָ/ם֙ לֹ֣א תֹאכֵ֔לוּ וּ/בְ/נִבְלָתָ֖/ם לֹ֣א תִגָּ֑עוּ טְמֵאִ֥ים הֵ֖ם לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/008.yaml
  text: You shall not eat any of their flesh[a], and you shall not touch their carcasses; they are unclean to you.
translation:
  language: de
  text: Von ihrem Fleisch dürft ihr nichts essen, und ihre Kadaver dürft ihr nicht berühren; sie sind für euch unrein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבְּשָׂרָם
  choice: von ihrem Fleisch … nichts
  rationale: 'Die Präposition מִן ist hier partitiv: Kein Teil ihres Fleisches darf gegessen werden. Die deutsche Konstruktion „von … nichts“ gibt dies natürlich und genau wieder.'
- source_word: לֹא תֹאכֵלוּ
  choice: dürft ihr nicht essen
  rationale: Der imperfektische Verbalgebrauch formuliert im Gesetz ein Verbot. „Dürft ihr nicht“ ist im modernen Deutschen klar und verbindlich, ohne unnötig altertümlich zu klingen.
- source_word: וּבְנִבְלָתָם
  choice: und ihre Kadaver
  rationale: נְבֵלָה bezeichnet den toten Körper eines Tieres. „Kadaver“ ist präzise und vermeidet die mögliche Mehrdeutigkeit von „Leichnam“ sowie die Vorstellung, es gehe nur um zum Verzehr bestimmtes „Aas“.
- source_word: לֹא תִגָּעוּ
  choice: dürft ihr nicht berühren
  rationale: נגע bedeutet unmittelbar „berühren“ beziehungsweise „in Berührung kommen“. Die knappe Wiedergabe lässt die kultische Folge aus dem Kontext hervorgehen.
- source_word: טְמֵאִים הֵם לָכֶם
  choice: sie sind für euch unrein
  rationale: „Unrein“ bezeichnet die kultische Kategorie des levitischen Reinheitsrechts. „Für euch“ bewahrt den relationalen Dativ לָכֶם, ohne eine moralische Wertung einzutragen.
theological_decisions:
- issue: Art der Unreinheit im levitischen Speisegesetz
  choice: „unrein“ als kultisch-rechtliche Kategorie
  alternative: „unrein“ als Aussage moralischer Verwerflichkeit oder als vorweggenommene Entscheidung über die spätere Geltung des Gebots
  rationale: Der Vers ordnet die betreffenden Tiere innerhalb der Reinheitsvorschriften Israels ein. Die Übersetzung bewahrt diese Kategorie, ohne weitergehende theologische Folgerungen in den Text einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Gesetzessprache. Die Satzstellung hebt wie im Hebräischen zunächst das Fleisch und danach die Kadaver hervor. Auf eine Fußnote wurde verzichtet, da „Kadaver“ den tierischen Bezug von נְבֵלָה eindeutig wiedergibt und die im englischen Beratungstext gesetzte Fußnote nicht sachgerecht an „Fleisch“ anschließt.
