translation:
  language: de
  text: den Milan[a] und den Falken nach seiner Art,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Bestimmung dieser Vögel ist unsicher; der erste kann auch als „Geier“, der zweite als „Milan“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּאָה
  choice: den Milan
  rationale: Die genaue Vogelart ist unsicher. „Milan“ ist eine geläufige moderne Bezeichnung für einen Greifvogel und entspricht einer verbreiteten Deutung des hebräischen Namens.
- source_word: הָאַיָּה
  choice: den Falken
  rationale: Das Wort bezeichnet einen Greifvogel, dessen genaue zoologische Bestimmung unsicher ist. „Falke“ hält die beiden hebräischen Vogelnamen im Deutschen auseinander und liegt innerhalb des möglichen Bedeutungsbereichs.
- source_word: לְמִינָהּ
  choice: nach seinen Arten
  rationale: Die Wendung hat klassifizierenden Sinn. Der Singular mit Possessivsuffix bezieht sich auf den zuletzt genannten Vogel, während „Arten“ natürlich ausdrückt, dass alle zugehörigen Unterarten oder Gattungen einbezogen sind.
- source_word: וְאֶת ... וְאֶת
  choice: den ... und den ...
  rationale: Der Akkusativmarker אֵת wird nicht eigens wiedergegeben; Konjunktionen, Artikel und Kasus werden innerhalb der fortlaufenden Aufzählung natürlich abgebildet.
theological_decisions: []
translation_notes:
