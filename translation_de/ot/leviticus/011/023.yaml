id: LEV.11.23
reference: Leviticus 11:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/כֹל֙ שֶׁ֣רֶץ הָ/ע֔וֹף אֲשֶׁר ל֖/וֹ אַרְבַּ֣ע רַגְלָ֑יִם שֶׁ֥קֶץ ה֖וּא לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/023.yaml
  text: But every winged swarming thing that has four feet is detestable to you[a][b].
translation:
  language: de
  text: Doch alles geflügelte Kleingetier[a], das vier Beine[b] hat, ist für euch etwas Abscheuliches.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „kriechende Flugtiere“. Der hebräische Ausdruck bezeichnet allgemein kleine fliegende Schwarmtiere, besonders Insekten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „vier Füße“; bei Tieren sagt man im Deutschen gewöhnlich „vier Beine“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל
  choice: Doch alles
  rationale: וְ markiert hier nach der Ausnahme im vorherigen Vers einen Gegensatz; כֹל wird mit dem distributiven „alles“ wiedergegeben.
- source_word: שֶׁרֶץ הָעֹוף
  choice: geflügelte Kleingetier
  rationale: Die Wortverbindung bezeichnet allgemein kleine, sich schwarmweise bewegende Flugtiere, besonders Insekten. „Geflügeltes Kleingetier“ ist im Deutschen verständlich und wahrt die breite Sachkategorie.
- source_word: אֲשֶׁר לוֹ
  choice: das … hat
  rationale: Die hebräische Relativkonstruktion wird in natürlichem Deutsch als Besitzangabe wiedergegeben.
- source_word: אַרְבַּע רַגְלָיִם
  choice: vier Beine
  rationale: רַגְלַיִם kann Füße oder Beine bezeichnen. Bei Tieren ist „Beine“ im modernen Deutschen idiomatischer; die wörtlichere Möglichkeit wird in einer Fußnote genannt.
- source_word: שֶׁקֶץ הוּא לָכֶם
  choice: ist für euch etwas Abscheuliches
  rationale: Der verblosen hebräischen Aussage wird im Deutschen „ist“ hinzugefügt. „Etwas Abscheuliches“ gibt שֶׁקֶץ kräftig wieder, ohne es mit dem allgemeineren Reinheitsbegriff „unrein“ gleichzusetzen; „für euch“ bewahrt den Bezug auf die angesprochenen Israeliten.
theological_decisions:
- issue: Verhältnis von Abscheu und kultischer Unreinheit
  choice: etwas Abscheuliches
  alternative: unrein
  rationale: שֶׁקֶץ bezeichnet hier das als verabscheuungswürdig und verboten Eingestufte. Die Übersetzung wahrt diese eigene Wortbedeutung, statt sie stillschweigend durch den benachbarten, aber nicht identischen Begriff der Unreinheit zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt nahe an der hebräischen Kategorisierung, ohne sie durch eine moderne zoologische Einteilung zu ersetzen.
