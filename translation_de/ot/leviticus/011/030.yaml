  text: וְ/הָ/אֲנָקָ֥ה וְ/הַ/כֹּ֖חַ וְ/הַ/לְּטָאָ֑ה וְ/הַ/חֹ֖מֶט וְ/הַ/תִּנְשָֽׁמֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/030.yaml
  text: the gecko[a], the monitor lizard, the lizard, the sand lizard, and the chameleon.
translation:
  language: de
  text: den Gecko[a], den Waran, die Eidechse, die Sandeidechse und das Chamäleon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Bestimmung mehrerer Tiere in diesem Vers ist unsicher. Für »Gecko« werden auch »Frettchen« oder »Spitzmaus« vorgeschlagen, für »Waran« auch »Chamäleon«, für »Sandeidechse« auch »Skink« oder nach älterer Überlieferung »Schnecke« und für »Chamäleon« auch »Maulwurf« oder eine andere Echsenart.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲנָקָה
  choice: Gecko
  rationale: Die genaue zoologische Bestimmung ist unsicher. Im Zusammenhang der kriechenden Tiere ist eine Echsenart wahrscheinlicher als ein Säugetier; »Gecko« ist eine verständliche, plausible Wiedergabe.
- source_word: הַכֹּחַ
  choice: Waran
  rationale: Das Wort bezeichnet wahrscheinlich eine größere Echsenart. »Waran« ist ein plausibles modernes Äquivalent, ohne die unsichere Artbestimmung im Haupttext auszubreiten.
- source_word: הַלְּטָאָה
  choice: Eidechse
  rationale: Die allgemeine Bezeichnung wahrt den zoologischen Sinn, ohne eine nicht sicher bestimmbare Art vorzutäuschen.
- source_word: הַחֹמֶט
  choice: Sandeidechse
  rationale: Innerhalb dieser Liste ist eine Echsenart plausibler als die ältere Deutung »Schnecke«. Die genaue Bestimmung bleibt jedoch unsicher.
- source_word: הַתִּנְשָׁמֶת
  choice: Chamäleon
  rationale: Obwohl dasselbe hebräische Wort andernorts einen Vogel bezeichnen kann, verlangt der unmittelbare Zusammenhang hier ein kriechendes Tier. »Chamäleon« ist eine verbreitete kontextuelle Deutung.
theological_decisions: []
translation_notes:
  register: Moderne, allgemein verständliche Tierbezeichnungen in einer knappen Aufzählung; der bestimmte Artikel und der Akkusativ schließen syntaktisch an den vorausgehenden Vers an. Die erhebliche zoologische Unsicherheit wird transparent in einer Fußnote bewahrt.
