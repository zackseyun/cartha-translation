  text: וְ/זֶ֤ה לָ/כֶם֙ הַ/טָּמֵ֔א בַּ/שֶּׁ֖רֶץ הַ/שֹּׁרֵ֣ץ עַל הָ/אָ֑רֶץ הַ/חֹ֥לֶד וְ/הָ/עַכְבָּ֖ר וְ/הַ/צָּ֥ב לְ/מִינֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/029.yaml
  text: 'And these are unclean for you among the swarming things that swarm on the earth: the mole-rat[a], and the mouse, and the great lizard according to its kind.'
translation:
  language: de
  text: 'Und folgende sind für euch unrein unter den Kleintieren, die auf der Erde wimmeln: die Blindmaus[a], die Maus und die große Echse nach ihrer Art.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Welche Tiere mit חֹלֶד und צָב genau gemeint sind, ist unsicher. Für חֹלֶד finden sich traditionell auch „Wiesel“ oder „Maulwurf“, für צָב „Schildkröte“ oder allgemein „Echse“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה לָכֶם הַטָּמֵא
  choice: Und … sind euch folgende unrein
  rationale: Das morphologisch singularische זֶה eröffnet eine Aufzählung. Die deutsche Pluralformulierung gibt die aufzählende Funktion natürlich wieder; „euch unrein“ bewahrt den durch לָכֶם bezeichneten Bezug auf die angesprochenen Israeliten.
- source_word: בַּשֶּׁרֶץ הַשֹּׁרֵץ
  choice: unter den Kleintieren, die … wimmeln
  rationale: שֶׁרֶץ bezeichnet hier kleine, sich zahlreich bewegende Landtiere. „Kleintiere“ ist im Deutschen verständlicher als das missverständliche traditionelle „kriechende Tiere“; „wimmeln“ bildet die wiederholte hebräische Wurzel im Relativsatz ab.
- source_word: עַל הָאָרֶץ
  choice: auf der Erde
  rationale: Die Wendung bezeichnet den irdischen beziehungsweise bodengebundenen Lebensraum und wird unmittelbar wiedergegeben.
- source_word: הַחֹלֶד
  choice: die Blindmaus
  rationale: Die zoologische Bestimmung ist unsicher. „Blindmaus“ bezeichnet einen unterirdisch lebenden Nager und entspricht der in neueren Lexika vertretenen Deutung als mole-rat; andere überlieferte Deutungen stehen in der Fußnote.
- source_word: הָעַכְבָּר
  choice: die Maus
  rationale: עַכְבָּר bezeichnet gewöhnlich eine Maus beziehungsweise allgemeiner ein mausartiges Nagetier; „Maus“ ist die klare Standardentsprechung.
- source_word: הַצָּב
  choice: die Großechse
  rationale: Die genaue Tierart ist unsicher. Im Zusammenhang der kleinen bodenlebenden Tiere ist eine größere Echsenart wahrscheinlich; die traditionell abweichenden Deutungen werden in der Fußnote genannt.
- source_word: לְמִינֵהוּ
  choice: je nach ihrer Art
  rationale: Die feste Klassifikationsformel wird in gegenwärtigem Deutsch natürlich wiedergegeben und bezieht sich grammatisch auf die unmittelbar zuvor genannte Großechse.
theological_decisions:
- issue: Bedeutung von טָמֵא im Reinheitsgesetz
  choice: unrein
  alternative: unrein beziehungsweise verunreinigend
  rationale: „Unrein“ ist der etablierte deutsche Begriff für den kultisch-rechtlichen Status. Der Vers selbst verlangt keine zusätzliche Erklärung darüber, ob primär der Status des Tieres oder seine verunreinigende Wirkung gemeint ist; diese Spannung wird nicht dogmatisch aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung stellt die Tiergruppe voran und macht die anschließende Liste gut verständlich. Fachsprachlich oder altertümlich wirkende Bezeichnungen wurden vermieden; die echte zoologische Unsicherheit bleibt durch die Fußnote sichtbar.
