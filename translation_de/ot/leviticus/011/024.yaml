  text: וּ/לְ/אֵ֖לֶּה תִּטַּמָּ֑אוּ כָּל הַ/נֹּגֵ֥עַ בְּ/נִבְלָתָ֖/ם יִטְמָ֥א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/024.yaml
  text: 'And by these you shall become unclean: everyone who touches their carcass shall be unclean until the evening[a][b].'
translation:
  language: de
  text: 'Und an diesen werdet ihr unrein[a]: Jeder, der ihr Aas[b] berührt, ist bis zum Abend unrein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und hinsichtlich dieser werdet ihr unrein.“ Die einleitende Wendung kann die folgende Gruppe allgemein betreffen und muss nicht ausschließlich die Ursache der Unreinheit bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Hebräische hat „ihr Aas“: ein Substantiv im Singular mit einem Pluralsuffix. Sinngemäß ist auch „ihre Tierkadaver“ möglich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאֵלֶּה
  choice: Und durch diese
  rationale: Die Verbindung von ו und ל mit dem Demonstrativ kann den Bereich der folgenden Bestimmung einführen oder hier instrumentalen Sinn haben. „Durch diese“ gibt im Zusammenhang wieder, dass von den genannten Tieren beziehungsweise ihrem Aas Unreinheit ausgeht, ohne die alternative allgemeinere Deutung zu verschweigen.
- source_word: תִּטַּמָּאוּ
  choice: werdet ihr unrein
  rationale: Das Imperfekt in der 2. Person Plural beschreibt den Eintritt in kultische Unreinheit. Die Formulierung vermeidet eine moralische Wertung.
- source_word: כָּל הַנֹּגֵעַ
  choice: Jeder, der … berührt
  rationale: Das substantivierte Partizip mit כָּל hat verallgemeinernde Bedeutung. Diese Wiedergabe ist klar und idiomatisch.
- source_word: בְּנִבְלָתָם
  choice: ihr Aas
  rationale: נְבֵלָה bezeichnet den toten Tierkörper beziehungsweise Tierkadaver. „Aas“ ist im Deutschen in Reinheitsvorschriften die knappe, natürliche Entsprechung; der hebräische Singular mit Pluralsuffix bleibt erhalten.
- source_word: יִטְמָא
  choice: ist … unrein
  rationale: Das Verb stimmt mit dem generischen Singular überein und bezeichnet den daraus folgenden Zustand kultischer Unreinheit.
- source_word: עַד הָעָרֶב
  choice: bis zum Abend
  rationale: Die Wendung bezeichnet die zeitliche Dauer der Unreinheit und gibt den bestimmten Artikel natürlich wieder.
theological_decisions:
- issue: Art der Unreinheit in den Heiligkeits- und Reinheitsvorschriften
  choice: טמא mit „unrein“ als kultischen Status wiedergeben
  alternative: „befleckt“ oder „verunreinigt“ mit möglichem moralischem Beiklang
  rationale: Der Vers behandelt die durch Berührung eines Tierkadavers entstehende rituelle Unreinheit, nicht persönliche moralische Schuld.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, verständlichem Gesetzesstil. „Unrein“ wahrt den kultischen Fachsinn; „Aas“ ist knapp und natürlich, kann aber durch die Fußnote als grammatischer Kollektivsingular erläutert werden.
