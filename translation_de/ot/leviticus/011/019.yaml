  yaml_path: translation/ot/leviticus/011/019.yaml
  text: and the stork[a], the heron according to its kind, and the hoopoe[c][b], and the bat.
translation:
  language: de
  text: den Storch, den Reiher nach seiner Art[a], den Wiedehopf[b] und die Fledermaus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Bestimmung des hebräischen Vogelnamens ist unsicher; möglicherweise ist ein Ibis oder ein anderer langbeiniger Wasservogel gemeint. „Nach seiner Art“ schließt verwandte Formen desselben allgemeinen Vogeltyps ein.
    reason: lexical_alternative
  - marker: b
    text: Traditionell auch „Kiebitz“; das hebräische Wort bezeichnet wahrscheinlich den Wiedehopf.
    reason: alternative_reading
lexical_decisions:
- source_word: חֲסִידָה
  choice: Storch
  rationale: Die traditionelle und lexikalisch am besten gestützte Bestimmung ist „Storch“; im Speisegesetz dient das Wort als Vogelbezeichnung.
- source_word: אֲנָפָה
  choice: Reiher
  rationale: Die zoologische Bestimmung ist nicht völlig sicher, doch „Reiher“ ist eine plausible und weithin übliche Wiedergabe; die Unsicherheit wird in einer Fußnote bewahrt.
- source_word: לְמִינָהּ
  choice: nach seinen Arten
  rationale: Die Wendung bezeichnet die zu diesem allgemeinen Tiertyp gehörenden Unterarten oder verwandten Formen. Der Singular des Hebräischen wird im Deutschen idiomatisch mit dem Plural „Arten“ wiedergegeben.
- source_word: דּוּכִיפַת
  choice: Wiedehopf
  rationale: Die moderne lexikalische und zoologische Bestimmung spricht deutlich für den Wiedehopf statt für die traditionelle Wiedergabe „Kiebitz“.
- source_word: עֲטַלֵּף
  choice: Fledermaus
  rationale: Die Identifizierung ist sicher. Die Einordnung unter fliegende Tiere folgt der anschaulichen Klassifikation des Textes und nicht der modernen biologischen Taxonomie.
- source_word: וְאֵת / וְאֶת
  choice: den …, den … und die …
  rationale: Die Konjunktion strukturiert die Aufzählung; der unübersetzbare direkte Objektmarker wird durch die deutschen Akkusativformen sichtbar, während die Konjunktionen idiomatisch gesetzt werden.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Akkusativformen passen zum fortlaufenden Satzbau der vorangehenden Verse. Die zoologische Unsicherheit bei אֲנָפָה bleibt ausdrücklich erhalten; unnötige Wiederholungen in den gelieferten englischen Fußnotenmarkern wurden sachgerecht geordnet.
