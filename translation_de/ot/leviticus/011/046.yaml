  text: זֹ֣את תּוֹרַ֤ת הַ/בְּהֵמָה֙ וְ/הָ/ע֔וֹף וְ/כֹל֙ נֶ֣פֶשׁ הַֽ/חַיָּ֔ה הָ/רֹמֶ֖שֶׂת בַּ/מָּ֑יִם וּ/לְ/כָל נֶ֖פֶשׁ הַ/שֹּׁרֶ֥צֶת עַל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/046.yaml
  text: This is the law concerning the livestock[a], the birds, every living creature that moves in the waters[c][b], and every creature that swarms on the earth.
translation:
  language: de
  text: Dies ist die Weisung[a] über die Landtiere und die Vögel, über jedes lebende Wesen[b], das sich im Wasser regt, und über jedes Wesen, das auf der Erde[c] wimmelt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Gesetz“. Das hebräische Wort תּוֹרָה kann sowohl verbindliche Weisung als auch Gesetz bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „jedes Lebewesen“. Der hebräische Ausdruck נֶפֶשׁ הַחַיָּה bezeichnet hier ein Lebewesen, nicht speziell eine vom Körper getrennte „Seele“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „auf dem Land“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרַת
  choice: die Weisung über
  rationale: תּוֹרָה bezeichnet hier die verbindliche Unterweisung, welche die vorangehenden Bestimmungen zusammenfasst. „Weisung über“ ist verständlich und bewahrt neben dem rechtlichen auch den lehrenden Aspekt.
- source_word: הַבְּהֵמָה
  choice: die Landtiere
  rationale: בְּהֵמָה bezeichnet größere Landtiere und kann besonders Vieh meinen. Im zusammenfassenden Gegensatz zu Vögeln und Wassertieren gibt „Landtiere“ die Kategorie im Kontext am klarsten wieder.
- source_word: הָעוֹף
  choice: die Vögel
  rationale: עוֹף kann fliegende Tiere umfassender bezeichnen; hier ist „Vögel“ die natürliche deutsche Kategorienbezeichnung.
- source_word: כֹל נֶפֶשׁ הַחַיָּה
  choice: jedes lebende Wesen
  rationale: נֶפֶשׁ הַחַיָּה ist eine Bezeichnung für ein belebtes Lebewesen. „Lebendes Wesen“ vermeidet die im heutigen Deutsch irreführende Wiedergabe „lebende Seele“.
- source_word: הָרֹמֶשֶׂת
  choice: das sich … regt
  rationale: רמש bezeichnet hier die Bewegung von Lebewesen im Wasser. „Sich regen“ ist im Deutschen breit genug und passt besser zu Wassertieren als „kriechen“.
- source_word: בַּמָּיִם
  choice: im Wasser
  rationale: Obwohl מַיִם formal pluralisch ist, ist „im Wasser“ die natürliche deutsche Wiedergabe.
- source_word: וּלְכָל נֶפֶשׁ
  choice: und über jedes Wesen
  rationale: Die erneute Verwendung von נֶפֶשׁ wird mit „Wesen“ aufgenommen; „lebend“ wird nicht ergänzt, da חַיָּה hier im Hebräischen nicht wiederholt wird.
- source_word: הַשֹּׁרֶצֶת
  choice: das … wimmelt
  rationale: שׁרץ bezeichnet das zahlreiche, wimmelnde Sichbewegen kleiner Tiere und wird so vom zuvor verwendeten רמש unterschieden.
- source_word: עַל הָאָרֶץ
  choice: auf der Erde
  rationale: אֶרֶץ kann „Erde“, „Land“ oder „Boden“ bedeuten. „Auf der Erde“ bildet hier den umfassenden Gegenbereich zum Wasser ab.
