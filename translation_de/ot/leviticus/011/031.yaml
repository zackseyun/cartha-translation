id: LEV.11.31
reference: Leviticus 11:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֵ֛לֶּה הַ/טְּמֵאִ֥ים לָ/כֶ֖ם בְּ/כָל הַ/שָּׁ֑רֶץ כָּל הַ/נֹּגֵ֧עַ בָּ/הֶ֛ם בְּ/מֹתָ֖/ם יִטְמָ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/031.yaml
  text: These are unclean for you among all the swarming things[b][a]. Everyone who touches them when they are dead shall be unclean until the evening.
translation:
  language: de
  text: Diese gelten euch als unrein unter allem Kleingetier.[a] Jeder, der sie berührt, wenn sie tot sind,[b] ist bis zum Abend unrein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unter allem Gewimmel“. Das hebräische Wort bezeichnet allgemein kleine Tiere, die wimmeln, kriechen oder sich in großer Zahl bewegen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „in ihrem Tod“; gemeint ist die Berührung in ihrem toten Zustand.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה הַטְּמֵאִים לָכֶם
  choice: Diese gelten euch als unrein
  rationale: Die prädikative Aussage bezeichnet ihren kultischen Reinheitsstatus. „Gelten euch als“ gibt die auf Israel bezogene Wendung לָכֶם in natürlichem, rechtlichem Deutsch wieder, ohne bloße physische Verschmutzung nahezulegen.
- source_word: בְּכָל הַשָּׁרֶץ
  choice: unter allem Kleingetier
  rationale: שֶׁרֶץ ist eine breite Sammelbezeichnung für kleine, sich wimmelnd oder kriechend bewegende Tiere. „Kleingetier“ ist verständlich und vermeidet eine zu enge zoologische Festlegung.
- source_word: כָּל הַנֹּגֵעַ בָּהֶם
  choice: Jeder, der sie berührt
  rationale: Die substantivierte Partizipialkonstruktion ist allgemein und distributiv; diese Formulierung bewahrt den umfassenden Geltungsbereich.
- source_word: בְּמֹתָם
  choice: wenn sie tot sind
  rationale: Wörtlich steht „in ihrem Tod“; gemeint ist die Berührung in ihrem toten Zustand, nicht nur im Augenblick des Sterbens.
- source_word: יִטְמָא עַד הָעָרֶב
  choice: ist bis zum Abend unrein
  rationale: Das Imperfekt beschreibt hier die eintretende und bis zum Abend andauernde kultische Unreinheit. Im modernen deutschen Rechtssatz ist der Präsensausdruck natürlich und klar.
theological_decisions:
- issue: Bedeutung von טמא
  choice: unrein
  alternative: verunreinigt / rituell unrein
  rationale: „Unrein“ ist der etablierte Begriff für den kultischen Status in Levitikus. Ein Zusatz wie „rituell“ wäre erklärend, steht jedoch nicht ausdrücklich im hebräischen Text.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Rechtssprache. „Kleingetier“ hält die breite hebräische Kategorie offen; die Fußnote dokumentiert die bildhaftere Alternative. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Wendungen.
