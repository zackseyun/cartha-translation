source:
  edition: WLC
  text: וְ/הַ/נֹּשֵׂא֙ אֶת נִבְלָתָ֔/ם יְכַבֵּ֥ס בְּגָדָ֖י/ו וְ/טָמֵ֣א עַד הָ/עָ֑רֶב טְמֵאִ֥ים הֵ֖מָּה לָ/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/028.yaml
  text: Whoever carries their carcass shall wash his clothes and be unclean until the evening[a]. They are unclean for you.
translation:
  language: de
  text: Wer ihren Kadaver trägt, muss seine Kleider waschen und ist bis zum Abend unrein.[a] Sie sind für euch unrein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Kadaver“. Das Hebräische kann distributiv auf die jeweils gemeinten Tiere bezogen werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנֹּשֵׂא
  choice: Wer … trägt
  rationale: Das substantivierte Partizip mit Artikel bezeichnet allgemein jeden, auf den der Fall zutrifft. „Wer … trägt“ gibt diese gesetzliche Allgemeingültigkeit natürlich wieder.
- source_word: נִבְלָתָם
  choice: ihr Aas
  rationale: נְבֵלָה bezeichnet den Kadaver eines Tieres. „Aas“ ist im Deutschen in Reinheitsvorschriften knapp und treffend; das Singularwort kann hier kollektiv beziehungsweise distributiv auf die zuvor genannten Tiere bezogen werden.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: muss seine Kleider waschen
  rationale: Das Imperfekt hat im Gesetzeskontext verpflichtende Kraft. „Muss“ formuliert diese Vorschrift in gegenwärtigem, natürlichem Deutsch; „Kleider“ wahrt den konkreten Sinn von בְּגָדִים.
- source_word: וְטָמֵא
  choice: und ist … unrein
  rationale: Die Form bezeichnet den daraus folgenden Zustand ritueller Unreinheit. Im Deutschen ist die koordinierte Aussage mit „ist“ klar und idiomatisch.
- source_word: עַד הָעָרֶב
  choice: bis zum Abend
  rationale: Die Wendung entspricht der bestimmten hebräischen Form und ist im Deutschen die natürliche Zeitangabe.
- source_word: טְמֵאִים הֵמָּה לָכֶם
  choice: Sie sind für euch unrein
  rationale: Die Formulierung bewahrt das rückbezügliche Pronomen und gibt לָכֶם ohne zusätzliche Deutung mit „für euch“ wieder.
theological_decisions:
- issue: Terminologie ritueller Unreinheit
  choice: unrein
  alternative: verunreinigt; kultisch unrein
  rationale: טמא bezeichnet hier einen rituellen Status, nicht ausdrücklich moralische Schuld. „Unrein“ ist die etablierte, präzise und im Kontext konsistent verwendbare Wiedergabe.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Rechtssprache. Der technische Reinheitsbegriff „unrein“ wird beibehalten. Die Fußnote macht die mögliche distributive Auffassung sichtbar, ohne den Haupttext unnötig zu belasten.
