  naturalness: „Eines von den Tieren“ ist zwar verständlich, aber „eines der Tiere“ ist im modernen Standarddeutsch idiomatischer. Die revidierte Fassung bleibt knapp und hat einen passenden rechtlich-feststellenden Ton.
  terminology: „Unrein“ ist als bewusster Fachausdruck des Reinheitsrechts richtig und sollte nicht durch einen interpretierenden Zusatz ersetzt werden. „Kadaver“ bezeichnet den toten Tierkörper präzise; „als Nahrung dienen“ bewahrt die kategoriale Aussage des Hebräischen.
