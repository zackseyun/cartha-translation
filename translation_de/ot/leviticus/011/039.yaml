source:
  edition: WLC
  text: וְ/כִ֤י יָמוּת֙ מִן הַ/בְּהֵמָ֔ה אֲשֶׁר הִ֥יא לָ/כֶ֖ם לְ/אָכְלָ֑ה הַ/נֹּגֵ֥עַ בְּ/נִבְלָתָ֖/הּ יִטְמָ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/039.yaml
  text: And if any of the livestock that may be used for food dies[a], the one who touches its carcass shall be unclean until the evening.
translation:
  language: de
  text: Und wenn eines der Tiere, die euch als Nahrung dienen, verendet, wird jeder, der seinen Kadaver berührt, bis zum Abend unrein sein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי
  choice: Und wenn
  rationale: Bewahrt sowohl die Verknüpfung mit den vorherigen Bestimmungen als auch den bedingenden Sinn.
- source_word: יָמוּת
  choice: verendet
  rationale: Bezeichnet hier den Tod eines Tieres; „verendet“ ist im Deutschen natürlich und unterscheidet den Fall vom Schlachten.
- source_word: מִן הַבְּהֵמָה
  choice: eines von den Tieren
  rationale: Gibt den partitiven Gebrauch von מִן wieder. Der Zusammenhang grenzt die gemeinten Tiere durch den folgenden Relativsatz ein.
- source_word: אֲשֶׁר הִיא לָכֶם לְאָכְלָה
  choice: die euch zur Nahrung dienen
  rationale: Gibt die Einstufung dieser Tiere als Nahrung verständlich und relativ formnah wieder, ohne einen konkreten Essensvorgang auszudrücken.
- source_word: הַנֹּגֵעַ
  choice: jeder, der … berührt
  rationale: Gibt das substantivierte Partizip als allgemeine Personenbezeichnung idiomatisch wieder.
- source_word: בְּנִבְלָתָהּ
  choice: sein Aas
  rationale: נְבֵלָה bezeichnet den toten Tierkörper, besonders den Kadaver eines verendeten Tieres. „Aas“ ist in diesem Reinheitskontext knapp und treffend.
- source_word: יִטְמָא
  choice: wird … unrein sein
  rationale: Bewahrt den feststellenden Charakter der Rechtsfolge und bezeichnet kultische Unreinheit, ohne sie durch einen Zusatz auszudeuten.
- source_word: עַד הָעָרֶב
  choice: bis zum Abend
  rationale: Entspricht der üblichen deutschen Wiedergabe dieser zeitlichen Reinheitsformel.
theological_decisions:
- issue: Bedeutung von Unreinheit
  choice: „unrein“ ohne erklärenden Zusatz
  alternative: „kultisch unrein“
  rationale: Der Kontext macht die kultische beziehungsweise rituelle Kategorie deutlich; ein Zusatz im Vers könnte die knappe Formulierung des Hebräischen unnötig erweitern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit rechtlich-feststellendem Ton. Die Formulierung bleibt eng am hebräischen Bedingungssatz und vermeidet konfessionelle Ausdeutung.
