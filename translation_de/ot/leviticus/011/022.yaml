base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/022.yaml
  text: 'These of them you may eat: the locust according to its kind[a], and the bald locust according to its kind, and the cricket according to its kind, and the grasshopper according to its kind.'
translation:
  language: de
  text: 'Von diesen dürft ihr essen: die Wanderheuschrecke nach ihrer Art[a], die Solam-Heuschrecke nach ihrer Art, die Chargol-Heuschrecke nach ihrer Art und die Feldheuschrecke nach ihrer Art.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die mit Solam und Chargol wiedergegebenen hebräischen Insektennamen lassen sich zoologisch nicht sicher bestimmen. Traditionelle Übersetzungen verwenden unter anderem „Glattheuschrecke“ beziehungsweise „Grille“. Auch die genaue Abgrenzung der übrigen genannten Heuschreckenarten ist unsicher.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה מֵהֶם
  choice: Von ihnen dürft ihr diese essen
  rationale: Die Formulierung bezeichnet eine erlaubte Teilgruppe der zuvor genannten geflügelten Kleintiere. Die deutsche Wortfolge ist natürlich und bewahrt den Auswahlcharakter des Hebräischen.
- source_word: תֹּאכֵלוּ
  choice: dürft ihr essen
  rationale: Der Imperfekt hat im Zusammenhang des Speisegesetzes erlaubenden Sinn; „dürft“ gibt diesen in modernem Deutsch klar wieder.
- source_word: הָאַרְבֶּה
  choice: Wanderheuschrecke
  rationale: אַרְבֶּה ist die geläufigste hebräische Bezeichnung für eine Heuschrecke, besonders für die in Schwärmen auftretende Wanderheuschrecke.
- source_word: לְמִינוֹ / לְמִינֵהוּ
  choice: nach ihrer Art
  rationale: Die wiederkehrende Klassifikationsformel der Tora wird mit der etablierten und verständlichen Wendung „nach ihrer Art“ wiedergegeben.
- source_word: הַסָּלְעָם
  choice: Solam-Heuschrecke
  rationale: Die zoologische Bestimmung ist unsicher. Eine lautnahe Bezeichnung vermeidet, eine traditionelle, aber unbelegte Identifizierung als sicher auszugeben, und macht zugleich deutlich, dass eine Heuschreckenart gemeint ist.
- source_word: הַחַרְגֹּל
  choice: Chargol-Heuschrecke
  rationale: Da die genaue Identifizierung unsicher ist, bewahrt die lautnahe Bezeichnung den Unterschied zum vorangehenden Namen, ohne ihn spekulativ mit „Grille“ oder einer bestimmten Art gleichzusetzen.
- source_word: הֶחָגָב
  choice: Feldheuschrecke
  rationale: חָגָב bezeichnet ein hüpfendes Heuschreckeninsekt. „Feldheuschrecke“ unterscheidet den Ausdruck im Deutschen von אַרְבֶּה, ohne eine exakte Spezies festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die viergliedrige Aufzählung und die wiederholte Formel „nach ihrer Art“ bleiben erhalten. Bei den unsicheren Tiernamen werden transparente lautnahe Bildungen verwendet; die Unsicherheit wird in der Fußnote offengelegt.
