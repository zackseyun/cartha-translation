base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/025.yaml
  text: And everyone who carries any of their carcasses shall wash his clothes and be unclean until the evening[a].
translation:
  language: de
  text: Und jeder, der einen ihrer Tierkadaver trägt, soll seine Kleider waschen und ist bis zum Abend unrein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „von ihren Kadavern“. Die hebräische Präposition kann hier den Bezug auf einen Kadaver aus der zuvor genannten Tiergruppe ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל הַ/נֹּשֵׂא
  choice: Und jeder, der … trägt
  rationale: וְ verbindet die Vorschrift mit dem vorausgehenden Zusammenhang; כָּל mit dem Partizip bezeichnet umfassend jede betroffene Person. נָשָׂא bedeutet hier das Tragen eines Kadavers oder eines Teils davon.
- source_word: מִ/נִּבְלָתָ/ם
  choice: etwas von ihren Tierkadavern
  rationale: נְבֵלָה bezeichnet im Kontext der Reinheitsvorschriften den Kadaver eines Tieres. Das מִן kann partitiv verstanden werden; „etwas von“ bewahrt diese Nuance und lässt sowohl einen Kadaver als auch einen Teil davon zu.
- source_word: יְכַבֵּס בְּגָדָי/ו
  choice: soll seine Kleider waschen
  rationale: Das Imperfekt hat in dieser Rechtsbestimmung verpflichtende Kraft. „Kleider“ ist natürlich und würdig; das maskuline Singularsuffix wird entsprechend der repräsentativen Einzelform beibehalten.
- source_word: וְ/טָמֵא
  choice: und ist … unrein
  rationale: טָמֵא bezeichnet hier kultische beziehungsweise rituelle Unreinheit, nicht moralische Schuld. Die koordinierte Formulierung gibt den daraus folgenden Zustand knapp wieder.
- source_word: עַד הָ/עָרֶב
  choice: bis zum Abend
  rationale: Die Wendung bestimmt die zeitliche Dauer der Unreinheit und entspricht idiomatischem Standarddeutsch.
theological_decisions:
- issue: Maskuline Singularformen in einer allgemein geltenden Rechtsbestimmung
  choice: „jeder … seine Kleider“
  alternative: „alle … ihre Kleider“ oder „wer … die eigenen Kleider“
  rationale: Der hebräische Text formuliert mit einem repräsentativen maskulinen Singular. Die Übersetzung erhält Numerus und grammatische Form, ohne den Geltungsbereich einzuschränken.
- issue: Bedeutung von „unrein“
  choice: Rituellen Reinheitsstatus ohne Zusatz wiedergeben
  alternative: „kultisch unrein“
  rationale: Der Kontext macht den rituellen Sinn hinreichend deutlich. Ein erklärender Zusatz im Haupttext wäre interpretierend und im Hebräischen nicht ausdrücklich vorhanden.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die rechtliche Soll-Form wahrt den Vorschriftscharakter; „Tierkadaver“ verdeutlicht den tierischen Bezug, ohne moralische Unreinheit anzudeuten.
