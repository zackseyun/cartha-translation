lexical_decisions:
- source_word: אֵת
  choice: '[nicht eigens übersetzt]'
  rationale: Die Partikel kennzeichnet das direkte Objekt und hat im Deutschen gewöhnlich keine eigene Entsprechung; ihre Funktion zeigt sich darin, dass die folgende Nominalgruppe als Teil der Aufzählung behandelt wird.
- source_word: כָּל
  choice: jeden
  rationale: Bei einem singularischen Sammelbegriff bezeichnet כָּל hier umfassend jedes Tier dieser Gruppe; „jeden“ ist im Deutschen idiomatisch und bewahrt den distributiven Sinn.
- source_word: עֹרֵב
  choice: Raben
  rationale: עֹרֵב bezeichnet gewöhnlich den Raben, kann hier aber möglicherweise die Familie der Rabenvögel einschließlich Krähen weiter fassen. „Rabe“ entspricht der üblichen Wiedergabe; die Alternative wird in der Fußnote genannt.
- source_word: לְמִינוֹ
  choice: nach seiner Art
  rationale: Die Wendung לְמִין mit Suffix ist eine Einteilungsformel der Priesterschrift. „Nach seiner Art“ bewahrt ihren klassifizierenden Sinn, ohne moderne biologische Kategorien vorauszusetzen.
