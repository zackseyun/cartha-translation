base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/047.yaml
  text: to distinguish between the unclean and the clean[a], and between the creature that may be eaten and the creature that may not be eaten.
translation:
  language: de
  text: um zwischen dem Unreinen und dem Reinen zu unterscheiden und zwischen dem Tier, das gegessen werden darf, und dem Tier, das nicht gegessen werden darf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהַבְדִּיל
  choice: um … zu unterscheiden
  rationale: Der Infinitiv bezeichnet hier den Zweck der vorausgehenden Weisung. „Unterscheiden“ gibt den rechtlich-kultischen Erkenntnisakt natürlich und genau wieder.
- source_word: בֵּין ... וּבֵין
  choice: zwischen … und …; und zwischen … und …
  rationale: Die wiederholte Präposition gliedert zwei Gegensatzpaare; die deutsche Fassung bewahrt diese Parallelstruktur.
- source_word: הַטָּמֵא / הַטָּהֹר
  choice: das Unreine / das Reine
  rationale: Die substantivierten Adjektive bezeichnen kultisch-rechtliche Kategorien. „Unrein“ und „rein“ sind im Kontext des Levitikus klar und vermeiden eine Moralisierung.
- source_word: הַחַיָּה
  choice: das Tier
  rationale: חַיָּה bezeichnet hier im Zusammenhang der Speisevorschriften ein Tier. Der Singular des hebräischen Gegensatzpaares bleibt erhalten; „Lebewesen“ wäre im Deutschen unnötig weit.
- source_word: הַנֶּאֱכֶלֶת
  choice: das gegessen werden darf
  rationale: Das Nifal-Partizip bezeichnet im gesetzlichen Zusammenhang ein zum Verzehr zugelassenes Tier, nicht lediglich eines, das tatsächlich gegessen wird.
- source_word: אֲשֶׁר לֹא תֵאָכֵל
  choice: das nicht gegessen werden darf
  rationale: Die Formulierung drückt das Verbot in natürlichem modernem Deutsch aus und bildet einen klaren Gegensatz zur Erlaubnis im vorherigen Satzglied.
theological_decisions:
- issue: Kultische Reinheit in den Speisevorschriften
  choice: „das Unreine“ und „das Reine“ als kultisch-rechtliche Kategorien
  alternative: „das Unsaubere“ und „das Saubere“ oder „das Unheilige“ und „das Heilige“
  rationale: Der hebräische Gegensatz betrifft den von der Tora bestimmten Reinheitsstatus. Die Übersetzung wahrt diese Kategorie, ohne körperliche Verschmutzung oder moralische Verwerflichkeit zu unterstellen.
- issue: Erlaubnis und Verbot des Verzehrs
  choice: „gegessen werden darf / nicht gegessen werden darf“
  alternative: „gegessen wird / nicht gegessen wird“
  rationale: Im Kontext fasst der Vers verbindliche Speisebestimmungen zusammen. Die modale Wiedergabe macht den normativen Sinn deutlich, ohne zusätzliche theologische Folgerungen einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Fassung bewahrt den Charakter eines an den vorherigen Vers anschließenden Zwecksatzes sowie die parallelen Gegensatzpaare des Hebräischen.
