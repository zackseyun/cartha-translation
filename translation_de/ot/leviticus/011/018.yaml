base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/018.yaml
  text: the owl, the pelican, and the carrion vulture;
translation:
  language: de
  text: die Eule[a], den Pelikan[b] und den Schmutzgeier[c];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Welche Vogelart das hebräische Wort bezeichnet, ist ungewiss.
    reason: Die zoologische Identifizierung von תִּנְשֶׁמֶת ist umstritten; die Fußnote verhindert eine Scheingenauigkeit.
  - marker: b
    text: 'Oder möglicherweise: die Wüsteneule; die genaue Vogelart ist ungewiss.'
    reason: קָאָת wird traditionell als Pelikan verstanden, doch sein Gebrauch in anderen Texten lässt auch einen Wüstenvogel möglich erscheinen.
  - marker: c
    text: Das hebräische Wort bezeichnet wahrscheinlich den Schmutzgeier, eine aasfressende Geierart.
    reason: Die nähere Artbestimmung ist gut begründet, aber nicht völlig sicher.
lexical_decisions:
- source_word: הַתִּנְשֶׁמֶת (tinšemet)
  choice: die Eule
  rationale: Die genaue Vogelart ist nicht sicher bestimmbar. „Eule“ bewahrt die traditionelle Einordnung, ohne eine unbelegte Artbezeichnung wie „Uhu“ oder „Schleiereule“ festzulegen.
- source_word: הַקָּאָת (qaʾat)
  choice: den Pelikan
  rationale: „Pelikan“ entspricht der alten und weithin gebräuchlichen Deutung; das hebräische Wort bezeichnet jedoch möglicherweise einen anderen Wasservogel oder einen in Einöden lebenden Vogel.
- source_word: הָרָחָם (raḥam)
  choice: den Schmutzgeier
  rationale: Verwandte semitische Bezeichnungen stützen die Identifizierung als Schmutzgeier (Egyptian vulture) stärker als die allgemeinere Wiedergabe „Aasgeier“.
