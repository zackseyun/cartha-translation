id: LEV.11.38
reference: Leviticus 11:38
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/כִ֤י יֻתַּן מַ֨יִם֙ עַל זֶ֔רַע וְ/נָפַ֥ל מִ/נִּבְלָתָ֖/ם עָלָ֑י/ו טָמֵ֥א ה֖וּא לָ/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/038.yaml
  text: But if water is put on the seed[a], and any of their carcasses falls on it, it is unclean to you.
translation:
  language: de
  text: Wenn aber Wasser auf das Saatgut gegeben wird und einer ihrer Kadaver[a] darauf fällt, ist es für euch unrein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »einer ihrer toten Körper«. Das hebräische Wort bezeichnet den Kadaver beziehungsweise den toten Körper eines Tieres.'
    reason: Lexikalische Alternative zu נְבֵלָה.
lexical_decisions:
- source_word: וְכִי
  choice: Wenn aber
  rationale: Leitet einen Bedingungsfall ein und markiert zugleich den Gegensatz zum vorherigen Vers.
- source_word: יֻתַּן מַיִם עַל זֶרַע
  choice: Wasser auf das Saatgut gegeben wird
  rationale: Bewahrt die Passivform von נתן und gibt זֶרַע als kollektives Saatgut natürlich wieder, ohne die Art der Wasserzufuhr näher festzulegen.
- source_word: וְנָפַל
  choice: und … fällt
  rationale: Entspricht dem knappen Stil einer kasuistischen Rechtsbestimmung und ist im deutschen Bedingungssatz idiomatisch.
- source_word: מִנִּבְלָתָם
  choice: einer ihrer Kadaver
  rationale: Gibt das partitive מִן natürlich wieder. נְבֵלָה bezeichnet hier im Zusammenhang der Reinheitsvorschriften den toten Körper eines Tieres.
- source_word: עָלָיו
  choice: darauf
  rationale: Bezieht sich auf das grammatisch singularische Kollektiv זֶרַע, hier »Saatgut«.
- source_word: טָמֵא הוּא לָכֶם
  choice: ist es für euch unrein
  rationale: Bewahrt die übliche Feststellungsformel für den rituellen Unreinheitsstatus und gibt לָכֶם ausdrücklich wieder.
theological_decisions:
- issue: Art der Unreinheit
  choice: unrein
  alternative: verunreinigt / kultisch unrein
  rationale: Der Ausdruck bezeichnet in diesem Kontext einen rituellen Status, nicht notwendig moralische Schuld. »Unrein« bewahrt die etablierte Kategorie, ohne sie auszudeuten.
translation_notes:
  register: Knappe, würdige und allgemein verständliche Rechtssprache. »Saatgut« verdeutlicht den kollektiven Sinn von זֶרַע; die passive Formulierung vermeidet die interpretierende Festlegung auf »begießen« oder »befeuchten«.
