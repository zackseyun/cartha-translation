  source_fidelity: Der Bedingungssatz gibt וְכִי angemessen als „Wenn aber“ wieder. Die passive Aussage über Wasser auf dem Saatgut, das partitive Verständnis von מִנִּבְלָתָם („einer ihrer Kadaver“), der Rückbezug von עָלָיו auf „Saatgut“ sowie die Unreinheitsformel sind quellentreu. Die zeitliche bzw. rechtssprachliche Gegenwartsform ist im Deutschen für diesen kasuistischen Fall natürlich.
  naturalness: Der Satz ist knapp, verständlich und in modernem Standarddeutsch gut lesbar. „Saatgut“ trifft den kollektiven Sinn von זֶרַע; „Kadaver“ ist im Kontext toter Tiere sachlich und eindeutig.
  terminology: „Unrein“ bewahrt die rituelle Kategorie von טָמֵא, ohne moralische Schuld zu unterstellen. Die Fußnote erläutert נְבֵלָה zutreffend als Tierkadaver bzw. toten Tierkörper und bietet eine echte lexikalische Alternative. Der Anker [a] steht korrekt bei „Kadaver“.
