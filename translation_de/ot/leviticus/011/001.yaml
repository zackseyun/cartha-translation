base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/001.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying to them,
translation:
  language: de
  text: 'Und Jahwe sprach zu Mose und Aaron[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht erneut „zu“ vor „Aaron“ sowie die Rede-Einleitung „indem er zu ihnen sagte“; der Doppelpunkt gibt diese Einleitungsfunktion im Deutschen wieder.
    reason: Die Anmerkung dokumentiert die im Haupttext idiomatisch zusammengezogene hebräische Formulierung, ohne לֵאמֹר irreführend als Zweckangabe wiederzugeben.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: sprach
  rationale: Das Verb דבר mit narrativ fortführendem וַ führt einen neuen Sprechakt ein. „sprach“ bewahrt den würdevollen, formelhaften Erzählstil.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: zu Mose und Aaron
  rationale: אֶל kennzeichnet die Angesprochenen. Im natürlichen Deutschen genügt ein gemeinsames „zu“ für beide Namen.
- source_word: לֵאמֹר אֲלֵהֶם
  choice: ':'
  rationale: Die Kombination bedeutet wörtlich etwa „um zu ihnen zu sagen“ und leitet die folgende direkte Rede ein. Ein Doppelpunkt gibt diese Funktion im modernen Deutschen klar und idiomatisch wieder, ohne die beiden Adressaten zu verwischen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. „Jahwe“ bewahrt diesen, während „der HERR“ die traditionelle Ersatzlesung wiedergibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der formelhafte Charakter von „Und Jahwe sprach“ bleibt erhalten; die Einleitung der direkten Rede wird zugleich idiomatisch mit einem Doppelpunkt gestaltet.
