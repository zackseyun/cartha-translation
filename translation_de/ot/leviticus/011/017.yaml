  naturalness: Der Satzteil ist idiomatisch. „Große Eule“ wirkt im Deutschen allerdings eher wie eine bloße Größenbeschreibung als wie eine Vogelbezeichnung. „Käuzchen“ bezeichnet zudem im heutigen zoologischen Gebrauch eher eine bestimmte Gruppe kleiner Eulen und ist keine gute deutsche Entsprechung für das traditionell als „little owl“ verstandene כּוֹס.
  terminology: „Steinkauz“, „Kormoran“ und „Uhu“ sind etablierte, verständliche deutsche Wiedergaben der traditionellen Identifikationen. Die Fußnote muss deutlich machen, dass diese Zuordnungen keine sicheren modernen Artenbestimmungen sind.
