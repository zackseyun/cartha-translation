  text: den Steinkauz[a], den Kormoran und den Uhu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Bestimmung dieser Vögel ist unsicher. כּוֹס wird auch allgemein als „Eule“ oder als eine kleine Eulenart verstanden, שָׁלָךְ auch als „Pelikan“ und יַנְשׁוּף als „Hornkauz“ oder „Uhu“ (eine große Ohreule).
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכּוֹס
  choice: das Käuzchen
  rationale: כּוֹס bezeichnet hier wahrscheinlich eine bestimmte kleinere Eulenart. „Käuzchen“ ist im Deutschen eine natürliche, zoologisch passende Wiedergabe, ohne eine exakte Artbestimmung vorzutäuschen.
- source_word: הַשָּׁלָךְ
  choice: den Kormoran
  rationale: Die genaue Bestimmung von שָׁלָךְ ist umstritten. „Kormoran“ ist eine traditionelle und plausible Deutung als tauchender beziehungsweise stoßtauchender Wasservogel; die Unsicherheit wird in der Fußnote offengelegt.
- source_word: הַיַּנְשׁוּף
  choice: die große Eule
  rationale: יַנְשׁוּף bezeichnet wahrscheinlich einen größeren nachtaktiven Vogel aus der Gruppe der Eulen. „Große Eule“ bewahrt diese ungefähre Einordnung, ohne die nicht gesicherte moderne Art genauer festzulegen.
- source_word: וְאֶת
  choice: und
  rationale: Das wiederholte וְ mit dem Akkusativmarker אֶת setzt die Aufzählung fort. Im natürlichen Deutschen wird dies durch Kommas und ein abschließendes „und“ wiedergegeben.
