source:
  edition: WLC
  text: וְ/שֶׁ֖קֶץ יִהְי֣וּ לָ/כֶ֑ם מִ/בְּשָׂרָ/ם֙ לֹ֣א תֹאכֵ֔לוּ וְ/אֶת נִבְלָתָ֖/ם תְּשַׁקֵּֽצוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/011.yaml
  text: And they shall be detestable to you; you shall not eat any of their flesh[a], and you shall regard their carcasses as detestable.
translation:
  language: de
  text: Und sie sollen euch abscheulich sein; von ihrem Fleisch dürft ihr nichts essen, und ihre Kadaver sollt ihr als abscheulich betrachten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »verabscheuen«. Das hebräische Verb bezeichnet hier, dass ihre Kadaver als rituell abscheulich gelten und entsprechend behandelt werden sollen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁקֶץ
  choice: etwas Abscheuliches
  rationale: Das Substantiv bezeichnet in diesem Speisegesetz etwas rituell Abstoßendes. Die substantivische Wiedergabe bewahrt die hebräische Konstruktion und die starke Wertung, ohne den Begriff mit dem allgemeineren Unreinheitsvokabular gleichzusetzen.
- source_word: יִהְיוּ לָכֶם
  choice: sie sollen euch ... sein
  rationale: Die Formulierung erhält den Dativ לָכֶם und bringt zum Ausdruck, wie Israel diese Tiere einzustufen hat.
- source_word: מִבְּשָׂרָם
  choice: von ihrem Fleisch ... nichts
  rationale: 'מִן ist nach dem verneinten Verb partitiv: Kein Teil ihres Fleisches darf gegessen werden. Diese Bedeutung wird im Deutschen idiomatisch durch »von ... nichts« ausgedrückt.'
- source_word: לֹא תֹאכֵלוּ
  choice: dürft ihr nichts essen
  rationale: Die Formulierung gibt das bindende Verbot des hebräischen Rechtstextes in natürlichem modernem Deutsch wieder.
- source_word: נִבְלָתָם
  choice: ihre Kadaver
  rationale: נְבֵלָה bezeichnet hier die toten Körper von Tieren; »Kadaver« ist im Zusammenhang eines Speise- und Reinheitsgesetzes präzise und knapp.
- source_word: תְּשַׁקֵּצוּ
  choice: sollt ihr als abscheulich betrachten
  rationale: Das Piel des mit שֶׁקֶץ verwandten Verbs bezeichnet das Einstufen oder Behandeln als abscheulich. Die Wiedergabe bewahrt den begrifflichen Rückbezug und beschränkt die Aussage nicht auf ein bloßes Gefühl.
theological_decisions:
- issue: Art der negativen Wertung im Speisegesetz
  choice: Rituelle Abscheu mit »abscheulich« ausdrücken
  alternative: »ein Gräuel« oder »unrein« verwenden
  rationale: »Abscheulich« erhält die starke negative Einstufung im Rahmen der israelitischen Speisegebote, ohne sie ausdrücklich zu einer allgemeinen moralischen Kategorie zu erweitern. »Unrein« wäre schwächer und würde שֶׁקֶץ mit anderem hebräischem Reinheitsvokabular vermischen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Semikolon-Satzbau erhält den engen Zusammenhang der drei hebräischen Teilsätze; das einleitende »Und« gibt die Verknüpfung mit dem vorhergehenden Vers wieder.
