source:
  edition: WLC
  text: כִּ֣י אֲנִ֣י יְהוָ֗ה הַֽ/מַּעֲלֶ֤ה אֶתְ/כֶם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לִ/הְיֹ֥ת לָ/כֶ֖ם לֵ/אלֹהִ֑ים וִ/הְיִיתֶ֣ם קְדֹשִׁ֔ים כִּ֥י קָד֖וֹשׁ אָֽנִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/045.yaml
  text: For I am Yahweh[a], who brought you up from the land of Egypt to be your God. And you shall be holy[b], because I am holy.
translation:
  language: de
  text: Denn ich bin Jahwe, der euch aus dem Land Ägypten heraufgeführt hat[a], um euer Gott zu sein. Ihr sollt heilig sein, denn ich bin heilig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: »der euch aus dem Land Ägypten heraufführt«. Im Hebräischen steht ein Partizip; im Zusammenhang ist der bereits geschehene Auszug gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben, damit der Eigenname und sein bundesbezogener Charakter erkennbar bleiben.
- source_word: הַמַּעֲלֶה
  choice: der euch … heraufgeführt hat
  rationale: Das Partizip bezeichnet Jahwe als den, der Israel aus Ägypten heraufführt. Da der Auszug hier als vergangenes Heilsereignis vorausgesetzt wird, ist das deutsche Perfekt idiomatisch; das Bild des Heraufführens bleibt erhalten.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: aus dem Land Ägypten
  rationale: Die ausdrückliche Nennung von אֶרֶץ (»Land«) bleibt in der vertrauten Auszugsformel erhalten.
- source_word: לִהְיֹת לָכֶם לֵאלֹהִים
  choice: um euer Gott zu sein
  rationale: Die Formulierung gibt die Zielangabe und die relationale Kraft der Bundesformel natürlich wieder.
- source_word: וִהְיִיתֶם קְדֹשִׁים
  choice: Ihr sollt heilig sein
  rationale: »Sollt« bringt den verpflichtenden Sinn im Zusammenhang zum Ausdruck, ohne die Aussage zu einem bloßen Zukunftssatz oder zu einer schärferen Paraphrase zu machen.
- source_word: כִּי קָדוֹשׁ אָנִי
  choice: denn ich bin heilig
  rationale: כִּי begründet hier Israels Berufung zur Heiligkeit mit Gottes eigener Heiligkeit; »denn« wahrt den würdigen Ton und den begründenden Zusammenhang.
theological_decisions:
- issue: Bundestheologische Grundlage der Heiligkeit
  choice: Israels Verpflichtung zur Heiligkeit wird in Jahwes Identität, seinem Herausführen aus Ägypten und seiner Beziehung zu Israel als dessen Gott begründet.
  alternative: Die Aussage ausschließlich als Anweisung zu ritueller Reinheit zu verstehen.
  rationale: Der unmittelbare Zusammenhang betrifft Reinheits- und Speisegebote, doch der Vers selbst verbindet die geforderte Heiligkeit ausdrücklich mit dem Auszug, dem Bundesverhältnis und Gottes eigener Heiligkeit. Die Übersetzung bewahrt diese Verknüpfung, ohne sie auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Heraufgeführt« bewahrt das hebräische Richtungsbild; »Jahwe« gibt den Gottesnamen als Eigennamen wieder. Die Satzverknüpfung bleibt knapp und nah am Hebräischen.
