  text: וְ֠/כֹל אֲשֶׁר יִפֹּ֨ל מִ/נִּבְלָתָ֥/ם עָלָי/ו֮ יִטְמָא֒ תַּנּ֧וּר וְ/כִירַ֛יִם יֻתָּ֖ץ טְמֵאִ֣ים הֵ֑ם וּ/טְמֵאִ֖ים יִהְי֥וּ לָ/כֶֽם־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/035.yaml
  text: And anything on which any part of their carcass falls shall become unclean[a]. Whether oven or hearth, it must be broken down; they are unclean[b], and they shall be unclean for you.
translation:
  language: de
  text: Und alles, worauf etwas von ihrem Kadaver fällt, wird unrein[a]. Ein Backofen oder eine Kochstelle[b] muss abgerissen werden. Sie sind unrein und sollen euch als unrein gelten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von ihrem Leichnam“ beziehungsweise „von ihren Kadavern“. Das Hebräische bezeichnet hier den Kadaver eines unreinen Tieres im Zusammenhang der Reinheitsvorschriften.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet eine Einrichtung zum Kochen; gemeint sein kann etwa ein Herd, eine Topfauflage oder eine feuerstellenartige Anlage.
    reason: cultural_note
lexical_decisions:
- source_word: נִבְלָתָם
  choice: ihrem Kadaver
  rationale: נְבֵלָה bezeichnet den Leichnam beziehungsweise Kadaver eines verendeten Tieres, besonders im Zusammenhang der Reinheitsvorschriften. „Kadaver“ ist im Deutschen präzise und wahrt den Tierbezug.
- source_word: יִפֹּל
  choice: fällt
  rationale: Das Imperfekt formuliert hier einen allgemein geltenden Rechtsfall; das deutsche Präsens ist dafür natürlich.
- source_word: עָלָיו יִטְמָא
  choice: worauf ... fällt, wird unrein
  rationale: Die Formulierung gibt sowohl den Gegenstand als auch den durch die Berührung eintretenden Zustand wieder.
- source_word: תַּנּוּר
  choice: Backofen
  rationale: תַּנּוּר bezeichnet einen Ofen zum Backen; „Backofen“ macht die antike Funktion deutlich, ohne die Bauweise genauer festzulegen.
- source_word: כִירַיִם
  choice: Kochstelle
  rationale: Der Ausdruck bezeichnet eine Einrichtung zum Kochen, möglicherweise einen Herd, eine Topfauflage oder eine feuerstellenartige Anlage. „Kochstelle“ hält diese sachliche Bandbreite offen.
- source_word: יֻתָּץ
  choice: muss eingerissen werden
  rationale: Die passive Form bezeichnet die vorgeschriebene Zerstörung der verunreinigten Anlage. „Eingerissen“ passt zu fest oder aus Ton errichteten Öfen und Kochstellen.
- source_word: טְמֵאִים הֵם
  choice: Sie sind unrein
  rationale: „Unrein“ bewahrt den etablierten Leitbegriff der Reinheitsgesetzgebung und bezeichnet hier keinen moralischen Makel.
- source_word: וּטְמֵאִים יִהְיוּ לָכֶם
  choice: sollen euch als unrein gelten
  rationale: Diese idiomatische Formulierung wahrt die Beziehung des hebräischen לָכֶם zur angesprochenen Gemeinschaft und gibt den normativen Charakter des Satzes wieder.
theological_decisions:
- issue: Art der Unreinheit in den levitischen Reinheitsvorschriften
  choice: „unrein“ im Haupttext
  alternative: „kultisch unrein“ oder „rituell unrein“
  rationale: Der Kontext betrifft kultische beziehungsweise rituelle Unreinheit, nicht moralische Schuld. Der traditionelle Leitbegriff „unrein“ wahrt jedoch die lexikalische Verknüpfung innerhalb des Kapitels, ohne eine zusätzliche Auslegung in den Haupttext einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Gesetzesstil. Die Wiederholung von „unrein“ bleibt als prägendes Element des hebräischen Textes erhalten; „sollen euch als unrein gelten“ gibt die Schlusswendung natürlich und normativ wieder.
