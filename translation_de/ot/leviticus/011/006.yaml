  text: וְ/אֶת הָ/אַרְנֶ֗בֶת כִּֽי מַעֲלַ֤ת גֵּרָה֙ הִ֔וא וּ/פַרְסָ֖ה לֹ֣א הִפְרִ֑יסָה טְמֵאָ֥ה הִ֖וא לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/006.yaml
  text: And the hare[a], because it chews the cud but does not divide the hoof, is unclean for you.
translation:
  language: de
  text: Und den Hasen, denn er käut wieder, hat aber keinen gespaltenen Huf; er ist für euch unrein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאַרְנֶבֶת
  choice: den Hasen
  rationale: Die traditionelle und wahrscheinlichste zoologische Bestimmung ist der Hase. Da das hebräische Wort möglicherweise weiter gefasst ist, wird die Alternative „Kaninchen“ in einer Fußnote genannt.
- source_word: כִּי
  choice: Er … zwar
  rationale: כִּי leitet die Begründung für die Einstufung ein. Im Deutschen gibt die Konstruktion „zwar … aber“ den begründenden und zugleich kontrastierenden Zusammenhang der beiden Merkmale natürlich wieder.
- source_word: מַעֲלַת גֵּרָה
  choice: käut … wieder
  rationale: „wiederkäuen“ ist die übliche deutsche Entsprechung für das idiomatische „Wiedergekautes heraufbringen“ und bewahrt die sachliche Sprache des Speisegesetzes.
- source_word: וּפַרְסָה לֹא הִפְרִיסָה
  choice: hat aber keine gespaltenen Hufe
  rationale: Die Formulierung gibt das fehlende zweite Kennzeichen idiomatisch wieder. Der hebräische Singular kann kollektiv verstanden werden; im natürlichen Deutschen bezeichnet der Plural die Hufe des Tieres.
- source_word: טְמֵאָה הִוא לָכֶם
  choice: er ist für euch unrein
  rationale: „unrein“ bewahrt den zentralen kultisch-rechtlichen Begriff, während „für euch“ den Bezug auf die angesprochenen Israeliten ausdrücklich erhält.
theological_decisions:
- issue: Art der Unreinheit im levitischen Speisegesetz
  choice: unrein
  alternative: moralisch unrein oder böse
  rationale: Der Zusammenhang behandelt die kultisch-rechtliche Einteilung von Tieren für Israel, nicht eine moralische Verurteilung des Tieres. Der Haupttext belässt es beim umfassenden biblischen Begriff „unrein“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Konstruktion „zwar … aber“ macht den Gegensatz der beiden Merkmale klar, ohne den Inhalt auszudeuten; „unrein“ wahrt die kultische Terminologie.
