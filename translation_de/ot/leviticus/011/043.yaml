  text: אַל תְּשַׁקְּצוּ֙ אֶת נַפְשֹׁ֣תֵי/כֶ֔ם בְּ/כָל הַ/שֶּׁ֖רֶץ הַ/שֹּׁרֵ֑ץ וְ/לֹ֤א תִֽטַּמְּאוּ֙ בָּ/הֶ֔ם וְ/נִטְמֵתֶ֖ם בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/043.yaml
  text: Do not make yourselves detestable by any swarming thing that swarms[a], and do not make yourselves unclean by them, so that you do not become unclean by them.
translation:
  language: de
  text: Macht euch nicht abscheulich durch irgendein wimmelndes Tier[a]. Verunreinigt euch nicht durch sie, damit ihr nicht durch sie unrein werdet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „durch irgendein Wimmeltier, das wimmelt“. Das Hebräische bezeichnet eine umfassende Klasse kleiner Tiere, die wimmeln oder sich in großer Zahl bewegen; traditionell wird auch „Kriechtier, das kriecht“ übersetzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשַׁקְּצוּ אֶת נַפְשֹׁתֵיכֶם
  choice: Macht euch nicht abscheulich
  rationale: Die reflexive Wendung bezeichnet, dass die Angesprochenen sich selbst durch den Umgang mit diesen Tieren abscheulich machen. „Verunreinigt euch“ wäre hier zu unscharf und würde den Ausdruck mit dem folgenden טמא vermischen.
- source_word: בְּכָל הַשֶּׁרֶץ הַשֹּׁרֵץ
  choice: durch irgendein wimmelndes Tier
  rationale: שׁרץ bezeichnet die umfassende Klasse kleiner Tiere, die sich in großer Zahl bewegen oder wimmeln. „Wimmelndes Tier“ gibt diese Kategorie im Deutschen weiter, ohne sie auf am Boden kriechende Tiere einzuengen; die Verbindung von Substantiv und zugehörigem Verb wird in der Fußnote erläutert.
- source_word: תִטַּמְּאוּ
  choice: Verunreinigt euch nicht
  rationale: Die reflexive Verbform warnt davor, sich durch diese Tiere unrein zu machen. „Verunreinigt euch“ bewahrt diesen Handlungsaspekt und unterscheidet ihn vom anschließenden Zustand des Unreinwerdens.
- source_word: וְנִטְמֵתֶם
  choice: sodass ihr … unrein werdet
  rationale: Die Wendung beschreibt im Zusammenhang der vorausgehenden Verbote die eintretende Folge. Die positive Form des hebräischen Satzglieds bleibt erhalten, statt sie als „damit ihr nicht“ ausdrücklich zu verneinen.
- source_word: בָּהֶם / בָּם
  choice: durch sie
  rationale: Die Präposition bezeichnet die Tiere als Mittel beziehungsweise Anlass der Verunreinigung; die Wiederholung wird zur Wahrung der hebräischen Betonung beibehalten.
theological_decisions:
- issue: Terminologie ritueller Unreinheit im Heiligkeitsrecht
  choice: unrein / verunreinigen
  alternative: befleckt / unrein machen
  rationale: טמא bezeichnet hier kultische beziehungsweise rituelle Unreinheit. Die gewählte Wortfamilie ist im Deutschen verständlich und etabliert, ohne den Text auf moralische Schuld festzulegen.
- issue: Verhältnis des letzten Satzglieds zu den Verboten
  choice: 'Folge: „sodass ihr … unrein werdet“'
  alternative: 'Warnung: „damit ihr nicht … unrein werdet“'
  rationale: Das Hebräische verbindet ein positiv formuliertes Folgesatzglied mit den vorausgehenden Verboten. Die Übersetzung bewahrt diese Spannung und macht daraus weder eine zusätzliche Verneinung noch eine bloße Möglichkeit.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Gesetzesstil. Die kurzen Hauptsätze geben die eindringliche Verbotsform wieder; die Wiederholung von „durch sie“ bewahrt die Betonung des hebräischen Textes.
