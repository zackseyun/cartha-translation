id: LEV.11.10
reference: Leviticus 11:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/כֹל֩ אֲשֶׁ֨ר אֵֽין ל֜/וֹ סְנַפִּ֣יר וְ/קַשְׂקֶ֗שֶׂת בַּ/יַּמִּים֙ וּ/בַ/נְּחָלִ֔ים מִ/כֹּל֙ שֶׁ֣רֶץ הַ/מַּ֔יִם וּ/מִ/כֹּ֛ל נֶ֥פֶשׁ הַ/חַיָּ֖ה אֲשֶׁ֣ר בַּ/מָּ֑יִם שֶׁ֥קֶץ הֵ֖ם לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/010.yaml
  text: But everything in the seas and in the streams that does not have fins and scales[b][a], among all the swarming things in the waters and among all the living creatures that are in the waters—they are detestable to you.
translation:
  language: de
  text: Doch alles in den Meeren und in den Wasserläufen[a], das keine Flossen und Schuppen hat – unter allem, was im Wasser wimmelt, und unter allen Lebewesen im Wasser –, ist für euch verabscheuungswürdig[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Wasserläufe“ kann je nach Zusammenhang auch mit „Bäche“, „Flüsse“ oder „Wadis“ wiedergegeben werden; das hebräische Wort bezeichnet allgemein fließende Gewässer beziehungsweise deren Betten.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ist für euch ein Gräuel“. Das hebräische Wort bezeichnet hier im Zusammenhang der Speisegesetze etwas rituell Abstoßendes oder Verabscheuungswürdiges.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל
  choice: Doch alles
  rationale: Das Präfix וְ führt hier im Zusammenhang den Gegensatz zu den erlaubten Wassertieren des vorherigen Verses ein; „alles“ bewahrt den umfassenden Geltungsbereich von כֹל.
- source_word: אֲשֶׁר אֵין לוֹ
  choice: das keine … hat
  rationale: Die Formulierung gibt die hebräische Aussage über das Fehlen der geforderten Merkmale in natürlichem modernem Deutsch wieder.
- source_word: סְנַפִּיר וְקַשְׂקֶשֶׂת
  choice: Flossen und Schuppen
  rationale: Beide Merkmale gehören zusammen; der Plural entspricht dem üblichen deutschen Sprachgebrauch bei der Beschreibung von Wassertieren.
- source_word: בַּיַּמִּים וּבַנְּחָלִים
  choice: in den Meeren und in den Wasserläufen
  rationale: „Meere“ entspricht יַמִּים. „Wasserläufe“ gibt נְחָלִים weit genug wieder, da das Wort je nach Umgebung Bäche, Flüsse oder zeitweise wasserführende Täler bezeichnen kann.
- source_word: מִכֹּל שֶׁרֶץ הַמַּיִם
  choice: unter allem, was im Wasser wimmelt
  rationale: Die partitive Wendung mit מִן wird durch „unter“ ausgedrückt; die verbale Formulierung bewahrt das konkrete Bild des Wimmelns und klingt im Deutschen natürlicher als ein substantivisches „Gewimmelwesen“.
- source_word: וּמִכֹּל נֶפֶשׁ הַחַיָּה
  choice: und unter allen Lebewesen
  rationale: נֶפֶשׁ הַחַיָּה bezeichnet hier allgemein belebte Geschöpfe. „Lebewesen“ ist verständlich und vermeidet das in diesem Zusammenhang irreführende „lebende Seele“.
- source_word: אֲשֶׁר בַּמָּיִם
  choice: im Wasser
  rationale: Die knappe deutsche Ortsangabe gibt den Relativsatz idiomatisch wieder, ohne seinen Bezug auf die Lebewesen zu verändern.
- source_word: שֶׁקֶץ
  choice: verabscheuungswürdig
  rationale: Das Wort bezeichnet im Speisegesetz etwas kultisch beziehungsweise rituell Abstoßendes. Die Wahl erhält die starke Wertung, ohne einen zusätzlichen technischen Reinheitsbegriff einzuführen.
- source_word: הֵם לָכֶם
  choice: ist für euch
  rationale: Die hebräische Nominalklausel beschreibt den für Israel geltenden Status. Im Deutschen wird die Kopula ergänzt; der Singular richtet sich nach dem umfassenden Hauptwort „alles“.
theological_decisions:
- issue: Bezeichnung des rituellen Status im Speisegesetz
  choice: verabscheuungswürdig
  alternative: ein Gräuel
  rationale: Der Vers klassifiziert Wassertiere im Rahmen der Bundes- und Speiseordnung und fällt nicht ohne Weiteres ein allgemeines moralisches Urteil über sie. „Verabscheuungswürdig“ wahrt die starke rituell-rechtliche Aussage; „ein Gräuel“ ist ebenfalls möglich, wirkt im heutigen Deutsch jedoch stärker traditionssprachlich und kann breiter moralisch verstanden werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Gedankenstriche gliedern die beiden partitiven Bestimmungen, ohne die umfassende Satzstruktur des Hebräischen aufzulösen. Die Formulierung bleibt konkret und vermeidet sowohl archaische Gesetzessprache als auch eine über den rituell-rechtlichen Kontext hinausgehende moralische Zuspitzung.
