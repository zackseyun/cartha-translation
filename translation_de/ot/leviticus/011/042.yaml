    issue: Modalität von „dürft ihr nichts essen“
    rationale: Die Formulierung ist verständlich, kann aber als Erlaubnisfrage klingen. „Sollt ihr nicht essen“ gibt die rechtliche Prohibition von לֹא תֹאכְלוּ unmittelbarer wieder.
  - severity: low
    issue: Konstruktion mit „von all dem Kleingetier“
    rationale: Die Präpositionalgruppe ist im Deutschen nicht eindeutig an die Aufzählung angeschlossen. Eine appositive Zuordnung macht klarer, dass die Kategorien zum auf der Erde sich regenden Kleingetier gehören.
