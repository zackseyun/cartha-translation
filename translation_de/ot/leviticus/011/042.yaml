  verdict: revise
  source_fidelity: Die Kategorien der Fortbewegung, die Erweiterung „bis hin zu“ und das Speiseverbot werden insgesamt zutreffend wiedergegeben. Das abschließende Singularpronomen „es“ verwischt jedoch den pluralischen Bezug von הֵם auf die genannten Tiere; auch die deutsche Wendung „dürft ihr“ ist gegenüber dem rechtlich-prohibitiven לֹא תֹאכְלוּ etwas weniger direkt.
  naturalness: Der Text ist überwiegend idiomatisch. „Von all dem Kleingetier“ ist an dieser Stelle jedoch syntaktisch weniger klar als eine direkte Klassifizierung der zuvor genannten Tiere; „Kleingetier, das sich auf der Erde regt“ bleibt als moderne Wiedergabe der hebräischen Wortfigur gut verständlich.
  terminology: „Kleingetier“ und „abscheulich“ sind im modernen Deutsch tragfähige, nicht konfessionell vorgeprägte Wiedergaben. „Sie sind abscheulich“ bewahrt den pluralischen Bezug und die prädikative Aussage des Hebräischen. Die Fußnotenanker werden in sinnvoller Reihenfolge unmittelbar bei den jeweiligen Ausdrücken gesetzt.
  issues:
  - severity: medium
    issue: Pluralischer Bezug des Schlusssatzes
    rationale: Das hebräische הֵם („sie“) bezieht sich auf die zuvor genannten Tiere. „Denn es ist abscheulich“ nimmt stattdessen das kollektive „Kleingetier“ im Singular auf und verändert den Bezug.
