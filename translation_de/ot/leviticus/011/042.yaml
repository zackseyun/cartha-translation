- from: Alles, was auf dem Bauch kriecht[a], und alles, was auf vier Beinen geht, bis hin zu allem, was viele Beine hat, von all dem Kleingetier, das sich auf der Erde regt[b] – davon dürft ihr nichts essen, denn es ist abscheulich[c].
  to: Alles, was auf dem Bauch kriecht[a], alles, was auf vier Beinen geht, bis hin zu allem, was viele Beine hat – all das Kleingetier, das sich auf der Erde regt[b] –, sollt ihr nicht essen; denn sie sind abscheulich[c].
  rationale: Die Revision klärt den Anschluss der Klassifizierung, gibt das Verbot in direkterer Rechtssprache wieder und stellt den pluralischen Bezug des hebräischen Schlusssatzes her. Die inklusive Funktion von עַד bleibt mit „bis hin zu“ erhalten; die Fußnote zu שֶקֶץ wurde an den pluralischen Satzbau angepasst.
