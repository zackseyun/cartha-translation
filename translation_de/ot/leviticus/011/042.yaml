base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/042.yaml
  text: Anything that goes on its belly[a], and anything that goes on four feet, even every creature with many feet, among all the swarming things that swarm on the earth—you shall not eat them[c][b], for they are detestable.
translation:
  language: de
  text: Alles, was auf dem Bauch kriecht[a], alles, was auf vier Beinen geht, bis hin zu allem, was viele Beine hat – all das Kleingetier, das sich auf der Erde regt[b] –, sollt ihr nicht essen; denn sie sind abscheulich[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »auf dem Bauch geht«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »alles Gewimmel, das auf der Erde wimmelt«; die hebräische Wortwiederholung hebt diese Gruppe kleiner Tiere hervor.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »sie sind ein Gräuel«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: alles, was
  rationale: Die distributive Wendung leitet umfassend mehrere Tiergruppen ein und klingt im Deutschen natürlich.
- source_word: הוֹלֵךְ עַל גָּח
  choice: auf dem Bauch kriecht
  rationale: Die Formulierung gibt die Fortbewegungsweise idiomatisch wieder; die wörtlichere Möglichkeit steht in der Fußnote.
- source_word: הוֹלֵךְ עַל אַרְבַּע
  choice: auf vier Beinen geht
  rationale: Dies bewahrt das konkrete Bild des Hebräischen und ist in modernem Deutsch verständlich.
- source_word: עַד כָּל מַרְבֵּה רַגְלַיִם
  choice: bis hin zu allem, was viele Beine hat
  rationale: עַד erweitert die Reihe bis zur Gruppe der Vielbeinigen; „bis hin zu“ bewahrt diesen Aufbau ohne unnatürlich zu klingen.
- source_word: לְכָל הַשֶּׁרֶץ הַשֹּׁרֵץ
  choice: von all dem Kleingetier, das sich regt
  rationale: „Kleingetier“ bezeichnet hier die umfassende Klasse kleiner, sich am Boden bewegender Tiere; der deutsche Relativsatz bildet die hebräische Wiederholung von Nomen und Partizip erkennbar nach.
- source_word: עַל הָאָרֶץ
  choice: auf der Erde
  rationale: Die direkte Entsprechung lässt sowohl Land beziehungsweise Boden als auch die umfassendere Bedeutung von „Erde“ offen.
- source_word: לֹא תֹאכְלֻם
  choice: davon dürft ihr nichts essen
  rationale: Die Formulierung gibt das verbindliche Speiseverbot in natürlichem modernem Deutsch wieder.
- source_word: שֶׁקֶץ
  choice: abscheulich
  rationale: Das Wort bezeichnet im Zusammenhang der Speisevorschriften etwas kultisch Abscheuliches beziehungsweise Verabscheutes, ohne dass zusätzliche dogmatische Aussagen eingetragen werden.
theological_decisions:
- issue: Geltungscharakter des Verbots innerhalb der Reinheitsgesetzgebung
  choice: Das Speiseverbot wird unmittelbar und verbindlich für seine angesprochenen Adressaten formuliert, ohne seine spätere heilsgeschichtliche Geltung zu bestimmen.
  alternative: Das Verbot als zeitloses Moralgesetz ausweisen oder zu einem bloßen kulturellen Tabu abschwächen.
  rationale: Der hebräische Text spricht innerhalb der levitischen Reinheitsordnung ein direktes Verbot aus, entscheidet in diesem Vers aber keine weiterführende kanonische oder konfessionelle Frage.
translation_notes:
  register: Moderne, würdige Rechtssprache mit allgemein verständlichem Wortschatz. „Kleingetier“ vermeidet das im heutigen Deutsch oft auf massenhaftes Auftreten verengte „Gewimmel“, während die Fußnote die hebräische Wortfigur sichtbar macht.
