source:
  edition: WLC
  text: כִּ֣י אֲנִ֣י יְהוָה֮ אֱלֹֽהֵי/כֶם֒ וְ/הִתְקַדִּשְׁתֶּם֙ וִ/הְיִיתֶ֣ם קְדֹשִׁ֔ים כִּ֥י קָד֖וֹשׁ אָ֑נִי וְ/לֹ֤א תְטַמְּאוּ֙ אֶת נַפְשֹׁ֣תֵי/כֶ֔ם בְּ/כָל הַ/שֶּׁ֖רֶץ הָ/רֹמֵ֥שׂ עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/044.yaml
  text: For I am Yahweh your God[a]. Consecrate yourselves therefore, and be holy, for I am holy[b]. And you shall not defile yourselves with any swarming thing that moves on the earth.
translation:
  language: de
  text: Denn ich bin Jahwe, euer Gott. Heiligt euch[a] also und seid heilig, denn ich bin heilig. Ihr sollt euch nicht durch irgendein Kleingetier[b] unrein machen, das sich auf der Erde regt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sondert euch als heilig aus.« Das hebräische Verb ist reflexiv.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet kleines Getier, das sich in großer Zahl bewegt; traditionell auch »Kriechtiere« oder »Gewürm«.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel »der HERR« ersetzt.
- source_word: אֱלֹהֵיכֶם
  choice: euer Gott
  rationale: In der Bundesformel mit Jahwe bezeichnet die grammatisch plurale Form den einen Gott Israels.
- source_word: וְהִתְקַדִּשְׁתֶּם
  choice: Heiligt euch also
  rationale: Der Hitpael von קדשׁ ist hier reflexiv und fordert dazu auf, sich als heilig auszusondern. »Heiligt euch« bewahrt den Zusammenhang mit dem folgenden »heilig«; »also« gibt die folgernde Verbindung wieder.
- source_word: וִהְיִיתֶם קְדֹשִׁים
  choice: und seid heilig
  rationale: Die Form bezeichnet hier den geforderten Zustand beziehungsweise das Ergebnis der Selbstheiligung und wird im Deutschen natürlich imperativisch wiedergegeben.
- source_word: קָדוֹשׁ
  choice: heilig
  rationale: Die gleiche Wiedergabe für Gottes Wesen und die Berufung des Volkes erhält die bewusste Verknüpfung innerhalb der Wortgruppe קדשׁ.
- source_word: תְטַמְּאוּ
  choice: unrein machen
  rationale: Der Piel von טמא bezeichnet das Herbeiführen von Unreinheit. Die Formulierung wahrt hier besonders den kultischen Reinheitskontext.
- source_word: נַפְשֹׁתֵיכֶם
  choice: euch
  rationale: נפשׁ bezeichnet hier die Personen selbst. Die reflexive Wiedergabe ist idiomatisch und vermeidet eine nicht geforderte Trennung von Seele und Körper.
- source_word: הַשֶּׁרֶץ
  choice: Kleingetier
  rationale: Der Ausdruck bezeichnet in Levitikus 11 kleine, sich zahlreich bewegende Tiere. »Kleingetier« ist verständlich und legt die Fortbewegungsart weniger eng fest als »Kriechtier«.
- source_word: הָרֹמֵשׂ
  choice: das sich regt
  rationale: Das Partizip von רמשׂ beschreibt die Bewegung solcher Tiere am Boden. »Sich regen« bewahrt die Weite des Ausdrucks, ohne ausschließlich Kriechen oder Krabbeln vorauszusetzen.
- source_word: עַל הָאָרֶץ
  choice: auf der Erde
  rationale: Die Wendung bezeichnet hier den irdischen beziehungsweise bodennahen Lebensraum; »auf der Erde« gibt sie direkt wieder.
theological_decisions:
- issue: Verhältnis zwischen Gottes Heiligkeit und der Heiligkeit seines Volkes
  choice: »heilig« wird für Gott und das Volk beibehalten
  alternative: »ausgesondert« an einer oder beiden Stellen
  rationale: Die Wiederholung derselben hebräischen Wortgruppe begründet die geforderte Heiligkeit des Volkes in Gottes eigener Heiligkeit. Eine einheitliche Wiedergabe erhält diesen theologischen Zusammenhang.
- issue: Bedeutung von נַפְשֹׁתֵיכֶם
  choice: idiomatisch »euch«
  alternative: »eure Seelen« oder »euer Leben«
  rationale: Die Aussage betrifft die Verunreinigung der ganzen Person und formuliert keine technische Lehre über das Verhältnis von Leib und Seele.
- issue: Art der Unreinheit in תְטַמְּאוּ
  choice: »unrein machen«
  alternative: »verunreinigen« oder »entweihen«
  rationale: »Unrein machen« hält den rituellen Sinn im Speise- und Reinheitskontext offen, ohne eine ausschließlich moralische Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Jahwe« bewahrt den Gottesnamen. Die Schlüsselwörter »heiligen/heilig« werden aus theologischen und literarischen Gründen eng aufeinander bezogen; »unrein machen« passt zum kultischen Zusammenhang von Levitikus 11.
