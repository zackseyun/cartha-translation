source:
  edition: WLC
  text: וְ/אֶת הַ֠/חֲזִיר כִּֽי מַפְרִ֨יס פַּרְסָ֜ה ה֗וּא וְ/שֹׁסַ֥ע שֶׁ֨סַע֙ פַּרְסָ֔ה וְ/ה֖וּא גֵּרָ֣ה לֹֽא יִגָּ֑ר טָמֵ֥א ה֖וּא לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/007.yaml
  text: And the pig[a], because it has a divided hoof and splits the hoof, but does not chew the cud[b], is unclean to you.
translation:
  language: de
  text: 'Und das Schwein: Obwohl es gespaltene Klauen hat und seine Klauen vollständig durchgespalten sind, käut es nicht wieder[a]; es ist für euch unrein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »bringt kein Wiedergekäutes herauf«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲזִיר
  choice: das Schwein
  rationale: Die geläufige moderne deutsche Bezeichnung gibt die Tierart allgemein und ohne altertümlichen Klang wieder.
- source_word: כִּי
  choice: es hat zwar … aber
  rationale: Im Zusammenhang leitet כִּי die Merkmale des Schweins ein; die deutsche Zwar-aber-Konstruktion bildet den Gegensatz zwischen erfülltem und fehlendem Reinheitsmerkmal natürlich ab.
- source_word: מַפְרִיס פַּרְסָה
  choice: hat gespaltene Klauen
  rationale: Die Wendung bezeichnet die anatomische Eigenschaft gespaltener Hufe beziehungsweise Klauen. Bei Schweinen ist „Klauen“ im Deutschen die präzisere und natürliche Tierbezeichnung.
- source_word: וְשֹׁסַע שֶׁסַע פַּרְסָה
  choice: und zwar vollständig gespaltene Klauen
  rationale: Die zweite, verstärkende Beschreibung wird nicht ausgelassen. „Und zwar“ macht ihre erläuternde beziehungsweise präzisierende Funktion verständlich, ohne sie als unabhängiges zusätzliches Merkmal erscheinen zu lassen.
- source_word: גֵּרָה לֹא יִגָּר
  choice: käut nicht wieder
  rationale: Dies ist die übliche deutsche Wiedergabe des zoologischen Vorgangs. Der hebräische Ausdruck spricht wörtlicher vom Nicht-Heraufbringen des Wiederzukäuenden; diese Bildhaftigkeit wird in einer Fußnote bewahrt.
- source_word: טָמֵא הוּא לָכֶם
  choice: es ist für euch unrein
  rationale: „Unrein“ bezeichnet hier die kultisch-speiserechtliche Kategorie, nicht moralische Bosheit. „Für euch“ bewahrt den Bezug auf die angesprochenen Israeliten.
theological_decisions:
- issue: Bedeutung von טָמֵא im Speisegesetz
  choice: unrein im kultisch-speiserechtlichen Sinn
  alternative: unrein als moralisch verwerflich oder an sich verunreinigt
  rationale: Levitikus 11 ordnet Tiere hinsichtlich Israels Reinheits- und Speisevorschriften ein. Die Formulierung „für euch“ bleibt erhalten und verhindert, dass die Aussage unnötig zu einer allgemeinen moralischen Bewertung des Tieres gemacht wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die redundanzähnliche Doppelbeschreibung der gespaltenen Klaue wird als hebräische Verstärkung beziehungsweise Präzisierung bewahrt. „Klauen“ ist beim Schwein natürlicher und fachlich passender als „Hufe“.
