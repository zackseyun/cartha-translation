id: LEV.11.5
reference: Leviticus 11:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אֶת הַ/שָּׁפָ֗ן כִּֽי מַעֲלֵ֤ה גֵרָה֙ ה֔וּא וּ/פַרְסָ֖ה לֹ֣א יַפְרִ֑יס טָמֵ֥א ה֖וּא לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/005.yaml
  text: And the rock badger[a], because it chews the cud but does not divide the hoof, is unclean for you.
translation:
  language: de
  text: 'Und den Klippdachs[a]: Er käut zwar wieder, hat aber keine gespaltenen Hufe; er ist für euch unrein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Klippschliefer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׁפָן
  choice: Klippdachs
  rationale: Das hebräische Wort bezeichnet sehr wahrscheinlich den Klippschliefer. „Klippdachs“ ist eine verständliche, traditionelle deutsche Bezeichnung; die zoologisch präzisere Alternative wird in der Fußnote genannt.
- source_word: כִּי
  choice: zwar … aber
  rationale: Der hebräische Begründungssatz stellt das erfüllte Merkmal dem fehlenden Merkmal gegenüber. Die deutsche Konstruktion gibt diesen begründenden Kontrast natürlich wieder.
- source_word: מַעֲלֵה גֵרָה
  choice: käut wieder
  rationale: Dies ist die geläufige deutsche Entsprechung der hebräischen Wendung „Wiedergekautes heraufbringen“.
- source_word: וּפַרְסָה לֹא יַפְרִיס
  choice: hat aber keine gespaltenen Hufe
  rationale: Die Formulierung gibt das fehlende Spalten des Hufes in natürlichem Deutsch wieder und wahrt die Terminologie der Speisevorschriften.
- source_word: טָמֵא
  choice: unrein
  rationale: „Unrein“ bezeichnet hier den kultisch-rituellen Status im System von Levitikus 11 und nicht eine moralische Eigenschaft des Tieres.
- source_word: לָכֶם
  choice: für euch
  rationale: Die Wendung bewahrt den ausdrücklichen Bezug der Einstufung auf die angesprochene Gemeinschaft.
theological_decisions:
- issue: Bedeutung von טָמֵא im Speisegesetz
  choice: kultisch unrein
  alternative: moralisch unrein
  rationale: Im Zusammenhang von Levitikus 11 bezeichnet das Wort einen rituell-rechtlichen Status. Die Übersetzung „unrein“ erhält diese Kategorie, ohne dem Tier moralische Schuld zuzuschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzgestaltung mit „zwar … aber“ macht den Kontrast der beiden Merkmale klar, ohne die rechtliche Aussage abzuschwächen.
