  source_fidelity: 'Der Entwurf gibt die hebräische Reihung und Begründung zutreffend wieder: שפן als Klippdachs, das Wiederkäuen, das fehlende Spalten des Hufes sowie die abschließende kultische Einstufung als unrein „für euch“. Die Verbindung „zwar … aber“ gibt den im Begründungssatz enthaltenen Kontrast idiomatisch wieder, ohne den Sinn von כִּי zu verlieren.'
