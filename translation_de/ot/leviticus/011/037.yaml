  text: וְ/כִ֤י יִפֹּל֙ מִ/נִּבְלָתָ֔/ם עַל כָּל זֶ֥רַע זֵר֖וּעַ אֲשֶׁ֣ר יִזָּרֵ֑עַ טָה֖וֹר הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/037.yaml
  text: And if any of their carcass falls on any seed for sowing that is to be sown[a], it is clean.
translation:
  language: de
  text: Und wenn etwas von ihrem Aas[a] auf irgendein Saatgut fällt, das ausgesät werden soll, ist es rein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von ihren Kadavern“. Die hebräische Form kann partitiv („etwas von ihrem Aas“) oder kollektiv beziehungsweise pluralisch verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Wenn aber
  rationale: Die Wendung führt einen weiteren bedingten Rechtsfall ein. „Wenn“ gibt die konditionale Funktion von כִּי wieder; „aber“ verbindet den Fall natürlich mit der vorangehenden Regel und markiert zugleich den Kontrast.
- source_word: יִפֹּל
  choice: fällt
  rationale: Das Qal-Imperfekt von נפל bezeichnet im kasuistischen Recht den angenommenen Fall; das deutsche Präsens ist dafür idiomatisch.
- source_word: מִנִּבְלָתָם
  choice: etwas von ihrem Aas
  rationale: מִן hat hier partitive Bedeutung. נְבֵלָה bezeichnet den toten Tierkörper, besonders als Träger kultischer Unreinheit. „Aas“ lässt sich im Deutschen natürlich kollektiv verstehen und bewahrt die ungewöhnliche Verbindung eines singularischen Substantivs mit einem pluralischen Possessivsuffix.
- source_word: עַל כָּל
  choice: auf irgendein
  rationale: עַל bezeichnet die räumliche Beziehung; כָּל hat in dieser Bedingung distributive Bedeutung und wird idiomatisch mit „irgendein“ wiedergegeben.
- source_word: זֶרַע זֵרוּעַ
  choice: Saatgut
  rationale: Die etymologisch betonte Verbindung bezeichnet Samen, der zum Säen bestimmt ist. „Saatgut“ gibt dies im modernen Deutsch knapp und präzise wieder.
- source_word: אֲשֶׁר יִזָּרֵעַ
  choice: das ausgesät werden soll
  rationale: Der Relativsatz beschreibt die vorgesehene künftige Verwendung des Saatguts und wird daher prospektiv wiedergegeben.
- source_word: טָהוֹר הוּא
  choice: ist es rein
  rationale: טָהוֹר bezeichnet im Kontext des levitischen Reinheitsrechts kultische Reinheit. Das Pronomen bezieht sich auf das Saatgut; „bleibt rein“ wäre eine zwar naheliegende, aber im Hebräischen nicht ausdrücklich formulierte Ergänzung.
theological_decisions: []
translation_notes:
  register: Modernes, sachliches und würdiges Rechtsdeutsch. „Saatgut“ vermeidet eine im Deutschen schwerfällige Wiederholung von „säen“, während der folgende Relativsatz die Zweckbestimmung ausdrücklich bewahrt.
