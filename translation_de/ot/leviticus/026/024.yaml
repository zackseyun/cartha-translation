  text: וְ/הָלַכְתִּ֧י אַף אֲנִ֛י עִמָּ/כֶ֖ם בְּ/קֶ֑רִי וְ/הִכֵּיתִ֤י אֶתְ/כֶם֙ גַּם אָ֔נִי שֶׁ֖בַע עַל חַטֹּאתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/024.yaml
  text: then I also will walk contrary to you[b][a], and I myself will strike you sevenfold for your sins.
translation:
  language: de
  text: Dann werde auch ich euch feindlich entgegentreten[a], und auch ich werde euch siebenfach[b] für eure Sünden schlagen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »euch in Gegnerschaft begegnen« / »gegen euch vorgehen«. Das seltene hebräische Wort ist in 3. Mose 26 ein wiederkehrendes Schlüsselwort für die wechselseitige Opposition zwischen Israel und dem HERRN.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »siebenmal«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָלַכְתִּי
  choice: Dann werde ich … entgegentreten
  rationale: הלך bedeutet wörtlich »gehen«. In Verbindung mit בְּקֶרִי bezeichnet es hier jedoch ein gegnerisches Vorgehen. »Dann« gibt die Folgerung innerhalb der gestaffelten Gerichtswarnungen natürlich wieder.
- source_word: אַף אֲנִי
  choice: auch ich
  rationale: Die Wendung betont die entsprechende Reaktion Gottes auf Israels Verhalten und bewahrt den wechselseitigen Charakter der Aussage.
- source_word: עִמָּכֶם בְּקֶרִי
  choice: euch feindlich entgegentreten
  rationale: Die Formulierung gibt die schwer eindeutig bestimmbare Wendung idiomatisch wieder. Sie wahrt den Gedanken des Gegensatzes, ohne ihn ausschließlich als innere Gefühlsregung zu deuten.
- source_word: וְהִכֵּיתִי אֶתְכֶם
  choice: und … werde euch schlagen
  rationale: נכה bezeichnet hier das strafende Schlagen. »Schlagen« ist klar, kräftig und nicht altertümlich.
- source_word: גַּם אָנִי
  choice: auch ich
  rationale: Die erneute ausdrückliche Nennung des göttlichen Handelnden bleibt erhalten und spiegelt die Wiederholung im Hebräischen.
- source_word: שֶׁבַע
  choice: siebenfach
  rationale: »Siebenfach« bewahrt die rhetorische Steigerung der Gerichtsankündigung, ohne die Wendung zwingend auf eine exakt abzählbare Zahl von Schlägen festzulegen.
- source_word: עַל חַטֹּאתֵיכֶם
  choice: für eure Sünden
  rationale: עַל nennt hier den Grund beziehungsweise Anlass des Gerichts. »Für eure Sünden« ist im Deutschen knapp und verständlich.
theological_decisions:
- issue: Die wechselseitige Haltung in der Bundesgerichtsaussage בְּקֶרִי
  choice: feindlich entgegentreten
  alternative: in Gegnerschaft mit euch gehen; euch entgegenhandeln
  rationale: Die gewählte Fassung lässt die gegenseitige Opposition zwischen Israel und dem HERRN erkennen, ohne zusätzliche dogmatische Kategorien oder eine rein emotionale Feindseligkeit in den Text einzutragen.
- issue: Bedeutung der Gerichtsformel שֶׁבַע
  choice: siebenfach
  alternative: siebenmal
  rationale: Die Übersetzung erhält die intensive, möglicherweise idiomatische Kraft der Warnung und lässt zugleich offen, ob eine streng rechnerische Aussage beabsichtigt ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zweimalige Hervorhebung »auch ich« folgt bewusst dem hebräischen Wortlaut. »Feindlich entgegentreten« macht die schwierige Wendung natürlich verständlich; die Fußnote bewahrt ihre lexikalische Unschärfe und ihre Funktion als Schlüsselwort im Kapitel.
