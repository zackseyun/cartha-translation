  source_fidelity: Die passive Form „wird … entschädigt werden“ gibt zwar den kompensatorischen Zusammenhang wieder, verdeckt jedoch, dass das Land im Hebräischen Subjekt beider Verben bleibt. „Seine Sabbatzeiten nachholen“ gibt den im Kontext gemeinten Ausgleich idiomatisch wieder und bewahrt die Wiederholung der Wurzel in beiden Satzteilen.
  naturalness: Die doppelte Passivkonstruktion ist schwerfällig und klingt, als würde ein nicht genannter Akteur das Land entschädigen. Die aktive Formulierung mit „nachholen“ ist modernes, verständliches Standarddeutsch und erhält den Parallelismus.
  terminology: „Land“ und „Sabbatzeiten“ sind kontextgerecht. „Sabbatzeiten“ lässt offen, dass insbesondere die dem Land zustehenden Sabbatruhen beziehungsweise Sabbatjahre gemeint sind, ohne den hebräischen Ausdruck unnötig einzuengen.
