revisions:
- from: Dann wird das Land während der ganzen Zeit seiner Verwüstung für seine Sabbatzeiten entschädigt werden[a], während ihr im Land eurer Feinde seid. Dann wird das Land ruhen und für seine Sabbatzeiten entschädigt werden.
  to: Dann wird das Land während der ganzen Zeit seiner Verwüstung seine Sabbatzeiten nachholen[a], während ihr im Land eurer Feinde seid. Dann wird das Land ruhen und seine Sabbatzeiten nachholen.
  rationale: Die Revision ersetzt das unpersönlich wirkende Passiv durch eine aktive, kontextgemäße Formulierung. Sie bewahrt die doppelte Wiederaufnahme derselben hebräischen Wurzel, die zeitliche Einbettung der Verwüstung und die Aussage, dass die Ruhe des Landes während des Exils die versäumten Sabbatruhen ausgleicht. Die Fußnotenmarkierung bleibt an der ersten Wiederholung des umstrittenen Verbs erhalten.
  reviewer_model: gpt-5.6-terra
