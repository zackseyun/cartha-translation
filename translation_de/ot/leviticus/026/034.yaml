source:
  edition: WLC
  text: אָז֩ תִּרְצֶ֨ה הָ/אָ֜רֶץ אֶת שַׁבְּתֹתֶ֗י/הָ כֹּ֚ל יְמֵ֣י הֳשַׁמָּ֔/ה וְ/אַתֶּ֖ם בְּ/אֶ֣רֶץ אֹיְבֵי/כֶ֑ם אָ֚ז תִּשְׁבַּ֣ת הָ/אָ֔רֶץ וְ/הִרְצָ֖ת אֶת שַׁבְּתֹתֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/034.yaml
  text: Then the land will enjoy its Sabbaths all the days of its desolation[a], while you are in the land of your enemies; then the land will rest and enjoy its Sabbaths.
translation:
  language: de
  text: Dann wird das Land während der ganzen Zeit seiner Verwüstung seine Sabbatzeiten nachholen[a], während ihr im Land eurer Feinde seid. Dann wird das Land ruhen und seine Sabbatzeiten nachholen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb kann auch mit „seine Sabbatzeiten genießen“ wiedergegeben werden. Im Zusammenhang bezeichnet es, dass das Land die ihm vorenthaltenen Sabbatruhen nachholt bzw. den dafür geschuldeten Ausgleich erhält.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Dann
  rationale: Das temporale Adverb kennzeichnet hier die Folge des zuvor angekündigten Gerichts.
- source_word: תִּרְצֶה / וְהִרְצָת
  choice: wird … entschädigt werden
  rationale: רצה bezeichnet in diesem Zusammenhang, dass das Land für die ihm vorenthaltenen Sabbatzeiten den geschuldeten Ausgleich erhält. Die passive deutsche Form ist idiomatisch, bewahrt den vergeltend-ausgleichenden Sinn und wird bei beiden Vorkommen gleich wiedergegeben.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Gemeint ist das Bundesland Israel, nicht die ganze Erde oder lediglich der Erdboden.
- source_word: אֶת שַׁבְּתֹתֶיהָ
  choice: für seine Sabbatzeiten
  rationale: Der Ausdruck betrifft die dem Land zustehenden Sabbatruhen, besonders die Sabbatjahre. »Sabbatzeiten« ist im Deutschen verständlicher als die mögliche, aber missverständliche Form »seine Sabbate«.
- source_word: כֹּל יְמֵי הֳשַׁמָּה
  choice: während der ganzen Zeit seiner Verwüstung
  rationale: Die Wendung bezeichnet die gesamte Dauer des verwüsteten Zustands; eine zeitliche Wiedergabe klingt im modernen Deutsch natürlicher als »alle Tage seiner Verwüstung«.
- source_word: וְאַתֶּם בְּאֶרֶץ אֹיְבֵיכֶם
  choice: während ihr im Land eurer Feinde seid
  rationale: Die Klausel beschreibt den gleichzeitig andauernden Umstand und wird daher temporal wiedergegeben.
- source_word: תִּשְׁבַּת
  choice: wird … ruhen
  rationale: Das Land kommt von der Bewirtschaftung zur Ruhe; zugleich bleibt die Verbindung zum Sabbatthema erkennbar.
theological_decisions:
- issue: Das Verhältnis des Landes zu seinen versäumten Sabbatzeiten im Exilgericht
  choice: Das Land erhält während des Exils den Ausgleich für vorenthaltene Sabbatruhe.
  alternative: Das Land »genießt« seine Sabbatzeiten oder »hat Gefallen« an ihnen.
  rationale: Der Zusammenhang der Bundesflüche legt einen ausgleichenden Sinn nahe. Die Übersetzung vermeidet zugleich eine bloß emotionale Personifizierung; die lexikalische Spannweite wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt weitgehend dem hebräischen Parallelismus; »Sabbatzeiten« erläutert knapp, dass es um die Ruhezeiten des Landes geht.
