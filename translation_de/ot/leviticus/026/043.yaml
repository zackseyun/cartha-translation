base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/043.yaml
  text: But the land will be abandoned by them and will enjoy its Sabbaths while it lies desolate without them[a], and they will accept the punishment for their iniquity, because—indeed, because—they rejected my judgments and their soul abhorred my statutes.
translation:
  language: de
  text: Doch das Land wird von ihnen verlassen werden und seine Sabbatruhen nachholen, während es ohne sie verwüstet daliegt; und sie werden die Strafe für ihre Schuld tragen[a], weil sie – ja, weil sie – meine Rechtsbestimmungen verworfen haben und ihre Seele meine Satzungen verabscheut hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Schuld hinnehmen“ oder „für ihre Schuld Genugtuung leisten“. Die hebräische Wendung lässt mehrere Deutungen zu; im Zusammenhang des Bundesgerichts wird sie hier als Tragen der Strafe wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּעָזֵב
  choice: wird von ihnen verlassen sein
  rationale: Das Nifal bewahrt den passiven Sinn; das Land ist verlassen, weil das Volk abwesend ist.
- source_word: וְתִרֶץ אֶת שַׁבְּתֹתֶיהָ
  choice: wird seine Sabbatzeiten nachholen
  rationale: Im Zusammenhang mit den versäumten Ruhezeiten des Landes bezeichnet רצה, dass das Land die ihm zustehende Sabbatruhe erhält; „nachholen“ gibt diesen Ausgleich im Deutschen natürlich wieder.
- source_word: בָּהְשַׁמָּה מֵהֶם
  choice: solange es ohne sie verwüstet daliegt
  rationale: Die Formulierung verbindet den Zustand der Verwüstung mit der Abwesenheit des Volkes.
- source_word: יִרְצוּ אֶת עֲוֺנָם
  choice: sie werden die Strafe für ihre Schuld tragen
  rationale: רצה mit עון hat hier im Kontext des Bundesgerichts wahrscheinlich einen strafrechtlichen Sinn. „tragen“ klingt im Deutschen idiomatischer als „annehmen“, ohne die Mehrdeutigkeit von עון ganz aufzulösen.
- source_word: יַעַן וּבְיַעַן
  choice: weil – ja, weil –
  rationale: Die Wiederholung bildet die verstärkte kausale Wendung des Hebräischen ab.
- source_word: בְּמִשְׁפָּטַי
  choice: meine Rechtsbestimmungen
  rationale: Der Ausdruck bezeichnet verbindliche Rechtsentscheide beziehungsweise Ordnungen und bleibt von חֻקֹּתַי unterschieden.
- source_word: חֻקֹּתַי
  choice: meine Satzungen
  rationale: „Satzungen“ ist eine würdige, verständliche Wiedergabe des rechtlichen Bundesbegriffs.
- source_word: גָּעֲלָה נַפְשָׁם
  choice: ihre Seele ... verabscheut hat
  rationale: Die kollektive Singularform „ihre Seele“ und die starke Bedeutung von געל werden formal bewahrt.
theological_decisions:
- issue: Bedeutung von עון in יִרְצוּ אֶת עֲוֺנָם
  choice: die Strafe für ihre Schuld tragen
  alternative: ihre Schuld annehmen; für ihre Schuld Genugtuung leisten
  rationale: Exil, Bundesfluch und die nachgeholten Sabbatzeiten des Landes sprechen für die Folge beziehungsweise Strafe der Schuld. Die Fußnote bewahrt jedoch die echte lexikalische Mehrdeutigkeit und vermeidet, eine mögliche Sühneleistung eindeutig in den Text hineinzulesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rechtlichen Begriffe werden differenziert wiedergegeben; die emphatische kausale Wiederholung und der kollektive Ausdruck „ihre Seele“ bleiben erhalten.
