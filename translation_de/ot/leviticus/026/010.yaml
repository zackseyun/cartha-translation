source:
  edition: WLC
  text: וַ/אֲכַלְתֶּ֥ם יָשָׁ֖ן נוֹשָׁ֑ן וְ/יָשָׁ֕ן מִ/פְּנֵ֥י חָדָ֖שׁ תּוֹצִֽיאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/010.yaml
  text: You will eat old stores long kept[a], and you will clear out the old because of the new.
translation:
  language: de
  text: Ihr werdet alte, lange gelagerte Vorräte essen und die alten Vorräte wegen der neuen hinausschaffen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: Die neuen Vorräte werden so reichlich sein, dass die alten hinausgeschafft werden müssen.'
    reason: contextual_explanation
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  choice: Ihr werdet essen
  rationale: Das Qal-Perfekt mit vorangestelltem Waw hat in der Abfolge der Bundessegnungen futurische Bedeutung.
- source_word: יָשָׁן נוֹשָׁן
  choice: lange gelagerte Vorräte
  rationale: יָשָׁן ist substantivisch gebraucht und bezeichnet Vorräte aus früheren Ernten; נוֹשָׁן hebt ihre lange Lagerzeit hervor, ohne einen negativen Beiklang wie »verdorben« einzutragen.
- source_word: וְיָשָׁן
  choice: die alten Vorräte
  rationale: Auch hier steht »alt« substantivisch für bereits eingelagerte Erzeugnisse; die Wiederaufnahme mit »Vorräte« sorgt im Deutschen für Klarheit.
- source_word: מִפְּנֵי
  choice: wegen
  rationale: 'Die Präposition bezeichnet hier den Anlass der Verdrängung: Die alten Vorräte werden angesichts der neuen herausgebracht.'
- source_word: חָדָשׁ
  choice: der neuen
  rationale: Das substantivisch gebrauchte Adjektiv bezieht sich auf neue Vorräte beziehungsweise die neue Ernte; die knappe Ausdrucksweise des Hebräischen bleibt erhalten.
- source_word: תּוֹצִיאוּ
  choice: hinausschaffen
  rationale: Der Hifil von יצא bedeutet wörtlich »hinausbringen«. »Hinausschaffen« gibt den Vorgang natürlich wieder, ohne den Zweck »Platz schaffen« ausdrücklich in den Text einzutragen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede steht im Plural. Die Übersetzung wahrt das Bild überreichlicher Vorräte und folgt bei תּוֹצִיאוּ bewusst näher der hebräischen Bewegungsbedeutung; die praktische Folgerung wird in der Fußnote erläutert.
