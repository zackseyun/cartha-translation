  text: וְ/הִשְׁלַחְתִּ֨י בָ/כֶ֜ם אֶת חַיַּ֤ת הַ/שָּׂדֶה֙ וְ/שִׁכְּלָ֣ה אֶתְ/כֶ֔ם וְ/הִכְרִ֨יתָה֙ אֶת בְּהֶמְתְּ/כֶ֔ם וְ/הִמְעִ֖יטָה אֶתְ/כֶ֑ם וְ/נָשַׁ֖מּוּ דַּרְכֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/022.yaml
  text: And I will send against you the wild animals of the field[a], and they will bereave you, cut off your livestock, reduce your number[c][b], and your roads will become desolate.
translation:
  language: de
  text: Und ich werde die wilden Tiere des Feldes[a] gegen euch schicken. Sie werden euch der Kinder berauben[b], euer Vieh ausrotten und eure Zahl verringern, und eure Straßen werden veröden[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Tiere des Feldes“; gemeint sind wild lebende Tiere.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Verb bezeichnet gewöhnlich das Berauben von Kindern oder Kinderlosmachen; „Kinder“ wird im Hebräischen nicht ausdrücklich genannt.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „eure Wege werden veröden“. Im Zusammenhang sind wahrscheinlich Straßen oder Verkehrswege gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁלַחְתִּי בָכֶם
  choice: Und ich werde ... gegen euch schicken
  rationale: Der Hifil von שלח bedeutet hier schlicht „schicken“; ב bezeichnet im Zusammenhang die feindliche Ausrichtung „gegen euch“.
- source_word: חַיַּת הַשָּׂדֶה
  choice: die wilden Tiere des Feldes
  rationale: Die Wendung bezeichnet wild lebende Landtiere. Die Formulierung bleibt nahe am Hebräischen und ist zugleich in modernem Deutsch verständlich.
- source_word: וְשִׁכְּלָה אֶתְכֶם
  choice: Sie werden euch der Kinder berauben
  rationale: שׁכל im Piel bezeichnet das Berauben beziehungsweise Verwaisenlassen, gewöhnlich durch den Verlust von Kindern. Das im Hebräischen nur implizite Bezugswort wird für verständliches Deutsch ergänzt und in einer Fußnote kenntlich gemacht.
- source_word: וְהִכְרִיתָה אֶת בְּהֶמְתְּכֶם
  choice: euer Vieh ausrotten
  rationale: הכרית drückt hier vollständige Vernichtung aus; „ausrotten“ gibt die Schärfe des Gerichts idiomatisch wieder. בְּהֵמָה meint in diesem Zusammenhang den domestizierten Tierbestand.
- source_word: וְהִמְעִיטָה אֶתְכֶם
  choice: eure Zahl verringern
  rationale: Der Hifil von מעט bedeutet „weniger machen“; die Formulierung bezeichnet hier die zahlenmäßige Verminderung des Volkes.
- source_word: וְנָשַׁמּוּ דַּרְכֵיכֶם
  choice: sodass eure Straßen veröden
  rationale: נשׁם bedeutet „veröden, verwüstet werden“. דְּרָכִים meint im Kontext am ehesten tatsächliche Straßen oder Verkehrswege. „Sodass“ macht die naheliegende Folgebeziehung natürlich deutlich.
theological_decisions:
- issue: Nicht ausdrücklich genanntes Objekt beim Verb שׁכל
  choice: „der Kinder berauben“ im Text, mit Fußnote zur Ellipse
  alternative: „euch kinderlos machen“ oder ohne Ergänzung „euch berauben“
  rationale: Das Verb bezeichnet idiomatisch den Verlust von Kindern. Die Ergänzung wahrt den üblichen Sinn, während die Fußnote transparent macht, dass „Kinder“ nicht eigens im hebräischen Text steht.
- issue: Bezug von דַּרְכֵיכֶם
  choice: konkrete Straßen beziehungsweise Verkehrswege
  alternative: übertragene „Wege“ im Sinn von Lebensführung
  rationale: Die Abfolge von Entvölkerung, Verlust des Viehs und Verödung spricht für verlassene Verkehrswege; die grundsätzlich mögliche weitere Bedeutung wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Strafankündigung bleibt direkt und eindringlich; traditionelle, heute aber unnötig altertümliche Wörter wie „Getier“ werden vermieden. Der letzte Teilsatz wird mit „sodass“ natürlich als Folge der vorausgehenden Verwüstung wiedergegeben.
