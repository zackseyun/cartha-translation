source:
  edition: WLC
  text: וְ/נָתַתִּ֥י גִשְׁמֵי/כֶ֖ם בְּ/עִתָּ֑/ם וְ/נָתְנָ֤ה הָ/אָ֨רֶץ֙ יְבוּלָ֔/הּ וְ/עֵ֥ץ הַ/שָּׂדֶ֖ה יִתֵּ֥ן פִּרְיֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/004.yaml
  text: then I will give you your rains in their season[a], and the land will yield its produce[b], and the tree of the field will give their fruit.
translation:
  language: de
  text: Dann werde ich euch Regen zur rechten Zeit[a] geben. Das Land wird seinen Ertrag hervorbringen, und die Bäume des Feldes[b] werden ihre Früchte tragen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „zu ihrer festgesetzten Zeit“ oder „zur gebührenden Zeit“. Im Hebräischen steht „eure Regenfälle zu ihrer Zeit“.'
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen steht „der Baum des Feldes“ im Singular mit kollektiver Bedeutung.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Dann werde ich … geben
  rationale: נתן bedeutet gewöhnlich „geben“. Die direkte Wiedergabe erhält die Form der göttlichen Bundeszusage; „dann“ stellt den Zusammenhang mit der vorausgehenden Bedingung her.
- source_word: גִשְׁמֵיכֶם
  choice: euch Regen
  rationale: Der hebräische Plural bezeichnet die benötigten saisonalen Regenfälle. Im natürlichen Standarddeutsch wird dies am besten mit dem kollektiven Singular „Regen“ und dem Dativ „euch“ ausgedrückt.
- source_word: בְּעִתָּם
  choice: zur rechten Zeit
  rationale: Die Wendung bezeichnet den jeweils angemessenen Zeitpunkt. „Zur rechten Zeit“ ist natürlich und bewahrt den landwirtschaftlichen Sinn, ohne ihn näher festzulegen.
- source_word: וְנָתְנָה הָאָרֶץ
  choice: Das Land wird … hervorbringen
  rationale: Wörtlich steht erneut „geben“. Bei landwirtschaftlichem Ertrag ist „hervorbringen“ im Deutschen idiomatischer, während „das Land“ den konkreten Bundes- und Agrarkontext wahrt.
- source_word: יְבוּלָהּ
  choice: seinen Ertrag
  rationale: יְבוּל bezeichnet den Ertrag beziehungsweise die Erzeugnisse des Landes. „Ertrag“ ist präzise, verständlich und nicht unnötig eingeengt.
- source_word: וְעֵץ הַשָּׂדֶה
  choice: und die Bäume des Feldes
  rationale: Der hebräische Singular hat kollektive Bedeutung. Der deutsche Plural gibt diese Bedeutung natürlich wieder; eine Fußnote macht die Form des Ausgangstextes sichtbar.
- source_word: יִתֵּן פִּרְיוֹ
  choice: werden ihre Früchte tragen
  rationale: Wörtlich heißt es „wird seine Frucht geben“. „Früchte tragen“ ist die natürliche deutsche Verbindung für das Hervorbringen von Baumfrucht und bewahrt den konkreten landwirtschaftlichen Sinn.
theological_decisions:
- issue: Bundessegen in Form von Regen und Fruchtbarkeit des Landes
  choice: Die Zusage wird konkret als Gottes Gewährung von rechtzeitigem Regen und landwirtschaftlichem Ertrag wiedergegeben.
  alternative: Die Aussage als allgemeine zeitlose Garantie materiellen Wohlstands zu formulieren oder die Segnungen ausschließlich zu vergeistigen.
  rationale: Der unmittelbare Zusammenhang handelt von den konkreten Segnungen des Bundes für Israel. Die Übersetzung sollte weder eine umfassendere Wohlstandsverheißung eintragen noch den landwirtschaftlichen Sinn metaphorisch auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die natürlichen deutschen Wendungen „Ertrag hervorbringen“ und „Früchte tragen“ haben Vorrang vor einer mechanischen Wiederholung von „geben“. Die kollektive Bedeutung des hebräischen Singulars und die Mehrzahl der Regenfälle werden in den Fußnoten offengelegt.
