source:
  edition: WLC
  text: וְ/נָתַתִּ֤י אֶת עָֽרֵי/כֶם֙ חָרְבָּ֔ה וַ/הֲשִׁמּוֹתִ֖י אֶת מִקְדְּשֵׁי/כֶ֑ם וְ/לֹ֣א אָרִ֔יחַ בְּ/רֵ֖יחַ נִיחֹֽחֲ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/031.yaml
  text: And I will make your cities a ruin[a], and I will lay waste your sanctuaries, and I will not smell the pleasing aroma of your offerings.
translation:
  language: de
  text: Ich werde eure Städte zu Ruinen machen und eure Heiligtümer verwüsten. Den wohlgefälligen Duft eurer Opfer werde ich nicht riechen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Euren wohlgefälligen Duft werde ich nicht riechen.“ Gemeint ist der Duft der Opfer; die Wendung bezeichnet im Opferkult Gottes wohlgefällige Annahme.'
    reason: Die Ergänzung „eurer Opfer“ macht den kultischen Bezug deutlich, während die Fußnote die wörtliche Form und ihre idiomatische Bedeutung dokumentiert.
lexical_decisions:
- source_word: וְנָתַתִּי אֶת־עָרֵיכֶם חָרְבָּה
  choice: Ich werde eure Städte zu Ruinen machen
  rationale: נתן bedeutet grundsätzlich „geben, setzen, machen“; mit „Städte“ und dem Zustandswort חָרְבָּה ergibt sich idiomatisch „zu Ruinen machen“. Der Plural „Ruinen“ ist im Deutschen bei mehreren Städten natürlich.
- source_word: וַהֲשִׁמּוֹתִי
  choice: und ... verwüsten
  rationale: Der Hifil-Stamm von שמם bezeichnet das Veröden- oder Verwüstetmachen. „Verwüsten“ gibt die verursachende und zerstörerische Aussage knapp wieder.
- source_word: מִקְדְּשֵׁיכֶם
  choice: eure Heiligtümer
  rationale: Der Plural von מִקְדָּשׁ bezeichnet heilige beziehungsweise kultische Stätten. „Heiligtümer“ bewahrt sowohl den Plural als auch den kultischen Sinn.
- source_word: וְלֹא אָרִיחַ
  choice: werde ich nicht riechen
  rationale: Das Verb ריח bezeichnet hier ausdrücklich das Riechen. Die konkrete, anthropomorphe Bildsprache bleibt erhalten, statt sie lediglich als „annehmen“ auszulegen.
- source_word: בְּרֵיחַ נִיחֹחֲכֶם
  choice: den wohlgefälligen Duft eurer Opfer
  rationale: רֵיחַ נִיחֹחַ ist eine feste kultische Wendung für den Duft eines Opfers, der Wohlgefallen ausdrückt. „Eurer Opfer“ verdeutlicht den im Kontext vorausgesetzten Bezug und verhindert das Missverständnis, die Menschen selbst seien der Duft.
theological_decisions:
- issue: Wörtliche Geruchssprache oder auslegende Wiedergabe als Zurückweisung der Opfer
  choice: 'Die Geruchssprache wird beibehalten: „werde ich nicht riechen“'
  alternative: „werde ich nicht annehmen“ oder „werde ich kein Gefallen haben an“
  rationale: Der hebräische Text verbindet das konkrete Verb „riechen“ mit der kultischen Formel vom wohlgefälligen Duft. Die wörtliche Bildsprache bewahrt die theologische Spannung; ihre Bedeutung als verweigerte Annahme wird nicht an die Stelle des Bildes gesetzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung verbessert die Lesbarkeit, ohne die Abfolge der drei Strafankündigungen zu verändern. „Wohlgefällig“ ist leicht gehoben, aber als kultischer Ausdruck präzise und verständlich.
