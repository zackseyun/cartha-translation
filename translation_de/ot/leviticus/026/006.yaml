  text: וְ/נָתַתִּ֤י שָׁלוֹם֙ בָּ/אָ֔רֶץ וּ/שְׁכַבְתֶּ֖ם וְ/אֵ֣ין מַחֲרִ֑יד וְ/הִשְׁבַּתִּ֞י חַיָּ֤ה רָעָה֙ מִן הָ/אָ֔רֶץ וְ/חֶ֖רֶב לֹא תַעֲבֹ֥ר בְּ/אַרְצְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/006.yaml
  text: And I will give peace in the land[a], and you will lie down, with no one making you afraid. And I will remove harmful beasts from the land[b], and the sword will not pass through your land.
translation:
  language: de
  text: Und ich werde Frieden im Land schenken, und ihr werdet euch hinlegen, ohne dass jemand euch aufschreckt. Ich werde die gefährlichen Wildtiere aus dem Land entfernen[a], und das Schwert wird nicht durch euer Land ziehen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »schädliche/böse Tiere«. Gemeint sind bedrohliche Wildtiere; »böse« beschreibt hier ihre Gefährlichkeit, nicht eine moralische Eigenschaft.'
    reason: lexical_alternative
  - marker: b
    text: Das »Schwert« ist hier ein Bild für Krieg oder einen bewaffneten Einfall.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי שָׁלוֹם
  choice: Und ich werde Frieden … schenken
  rationale: נתן bedeutet grundlegend „geben“; mit שָׁלוֹם klingt im Deutschen „Frieden schenken“ natürlich und würdig. „Frieden“ umfasst hier die konkret entfaltete Sicherheit, ohne den Begriff auf bloß inneren oder politischen Frieden zu verengen.
- source_word: בָּאָרֶץ
  choice: im Land
  rationale: אֶרֶץ bezeichnet hier das Israel zugesagte Bundesland; „Land“ bewahrt den territorialen Bezug.
- source_word: וּשְׁכַבְתֶּם
  choice: sodass ihr euch hinlegen könnt
  rationale: שׁכב bezeichnet das Sichhinlegen. Die Formulierung bewahrt das Bild sicherer Ruhe; „könnt“ drückt die durch den geschenkten Frieden ermöglichte Sicherheit aus.
- source_word: וְאֵין מַחֲרִיד
  choice: ohne dass euch jemand aufschreckt
  rationale: Das Hifil-Partizip von חרד bezeichnet jemanden oder etwas, das Schrecken verursacht. „Aufschreckt“ erhält die Verknüpfung mit dem ruhigen Hinliegen und die verursachende Bedeutung.
- source_word: וְהִשְׁבַּתִּי
  choice: Ich werde … verschwinden lassen
  rationale: Das Hifil von שׁבת bedeutet „aufhören lassen, beseitigen“. Im Zusammenhang mit gefährlichen Tieren gibt „verschwinden lassen“ das Ergebnis idiomatisch wieder.
- source_word: חַיָּה רָעָה
  choice: die gefährlichen Tiere
  rationale: חַיָּה bezeichnet Tiere beziehungsweise Wildtiere; רָעָה kennzeichnet sie hier als schädlich oder gefährlich, nicht als moralisch böse.
- source_word: וְחֶרֶב לֹא תַעֲבֹר
  choice: und kein Schwert wird … ziehen
  rationale: חֶרֶב bleibt als konkretes hebräisches Bild für Krieg oder bewaffneten Einfall erhalten. עבר beschreibt das Durchqueren; „durch das Land ziehen“ ist dafür natürliches Deutsch.
- source_word: בְּאַרְצְכֶם
  choice: durch euer Land
  rationale: Das Suffix der zweiten Person Plural wird ausdrücklich mit „euer“ wiedergegeben; der territoriale Bundesbezug bleibt erhalten.
theological_decisions:
- issue: Reichweite des verheißenen Friedens
  choice: 'Konkrete, umfassende Sicherheit im Land: Ruhe ohne Schrecken, Schutz vor gefährlichen Tieren und vor bewaffnetem Einfall.'
  alternative: Ausschließlich innerer beziehungsweise ausschließlich politischer Frieden.
  rationale: Der Vers entfaltet שָׁלוֹם durch konkrete Bilder leiblicher, gesellschaftlicher und territorialer Sicherheit. Die Übersetzung hält diese Breite offen.
- issue: Das Schwert als Bild
  choice: Das wörtliche Bild „Schwert“ wird im Text bewahrt und in der Fußnote als Bezeichnung für Krieg oder bewaffneten Einfall erläutert.
  alternative: Direkte Wiedergabe mit „Krieg“ oder „Heer“.
  rationale: So bleiben sowohl die Bildsprache des Hebräischen als auch ihre kontextuelle Bedeutung erkennbar.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Wiederholung von „Land“ und das Bild des Schwertes wurden bewusst bewahrt. Die Satzverknüpfung mit „sodass“ macht den Zusammenhang zwischen Frieden und sicherer Ruhe natürlich verständlich, ohne die konkreten Aspekte der Verheißung zu vergeistigen.
