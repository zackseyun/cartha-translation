  text: וְ/הִתְהַלַּכְתִּי֙ בְּ/ת֣וֹכְ/כֶ֔ם וְ/הָיִ֥יתִי לָ/כֶ֖ם לֵֽ/אלֹהִ֑ים וְ/אַתֶּ֖ם תִּהְיוּ לִ֥/י לְ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/012.yaml
  text: I will walk among you and will be your God[a], and you will be my people.
translation:
  language: de
  text: Ich werde mitten unter euch umhergehen und euer Gott sein, und ihr werdet mein Volk sein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִתְהַלַּכְתִּי
  choice: Ich werde umhergehen
  rationale: Der Hitpael von הלך bezeichnet hier ein Sich-Bewegen bzw. Umhergehen. Die konkrete Bildsprache der göttlichen Gegenwart bleibt so erhalten; „wohnen“ würde mehr aussagen als das Verb selbst.
- source_word: בְּתוֹכְכֶם
  choice: mitten unter euch
  rationale: Die Wendung bezeichnet Gottes Gegenwart inmitten der Gemeinschaft. „Mitten unter euch“ ist im Deutschen natürlich und vermeidet die mögliche Fehlvorstellung eines innerlichen Innewohnens bei „in euch“.
- source_word: וְהָיִיתִי לָכֶם לֵאלֹהִים
  choice: und euer Gott sein
  rationale: Die idiomatische deutsche Wiedergabe bewahrt die relationale Kraft der hebräischen Bundesformel היה + ל.
- source_word: לֵאלֹהִים
  choice: Gott
  rationale: Im Bundeszusammenhang ist der Gott Israels gemeint, nicht unbestimmt „ein Gott“.
- source_word: וְאַתֶּם תִּהְיוּ לִי לְעָם
  choice: und ihr werdet mein Volk sein
  rationale: Diese natürliche deutsche Formulierung gibt die wechselseitige Bundesbeziehung genau wieder, ohne die schwerfälligere wörtliche Form „mir zum Volk“ zu benötigen.
theological_decisions:
- issue: Wiedergabe der Bundesformel
  choice: „euer Gott … mein Volk“
  alternative: „euch zum Gott … mir zum Volk“
  rationale: Die gewählte Form bewahrt Gegenseitigkeit und Beziehungscharakter der etablierten Bundesformel, ohne zusätzliche dogmatische Aussagen einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Umhergehen“ bewahrt die konkrete Bewegungsmetapher; „mitten unter euch“ macht den gemeinschaftlichen räumlichen Sinn ausdrücklich. Keine Fußnote nötig, da beide Nuancen im Haupttext wiedergegeben werden.
