source:
  edition: WLC
  text: וְ/שָׁבַרְתִּ֖י אֶת גְּא֣וֹן עֻזְּ/כֶ֑ם וְ/נָתַתִּ֤י אֶת שְׁמֵי/כֶם֙ כַּ/בַּרְזֶ֔ל וְ/אֶֽת אַרְצְ/כֶ֖ם כַּ/נְּחֻשָֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/019.yaml
  text: And I will break the pride of your strength[b][a], and I will make your heavens like iron and your land like bronze.
translation:
  language: de
  text: Und ich werde euren Stolz auf eure Stärke brechen. Ich werde euren Himmel[a] wie Eisen machen und euer Land wie Bronze[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „eure Himmel“. Die hebräische Pluralform bezeichnet häufig den Himmel über der Erde.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Kupfer“. Das hebräische Wort kann Kupfer oder Bronze bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁבַרְתִּי
  choice: Und ich werde … brechen
  rationale: שׁבר bedeutet gewöhnlich „brechen“ oder „zerschmettern“. „Brechen“ gibt das Bild klar und ohne unnötige Verstärkung wieder.
- source_word: גְּאוֹן עֻזְּכֶם
  choice: euren Stolz auf eure Stärke
  rationale: גְּאוֹן kann Stolz, Hoheit oder Erhabenheit bezeichnen, עֹז Stärke oder Macht. Im Zusammenhang der Bundesstrafe ist selbstsicherer Stolz gemeint. Die Präposition „auf“ macht die Beziehung im heutigen Deutsch natürlich verständlich, ohne das Bild aufzulösen.
- source_word: וְנָתַתִּי
  choice: Ich werde … machen
  rationale: נתן heißt wörtlich „geben“ oder „setzen“, bezeichnet in dieser Konstruktion jedoch, dass etwas in einen bestimmten Zustand versetzt wird. „Machen“ ist hier idiomatisches Deutsch.
- source_word: שְׁמֵיכֶם
  choice: euren Himmel
  rationale: Die hebräische Pluralform שָׁמַיִם bezeichnet häufig den sichtbaren Himmel. Der deutsche Singular ist in diesem Zusammenhang die natürliche Entsprechung; die formale Abweichung wird in einer Fußnote kenntlich gemacht.
- source_word: כַּבַּרְזֶל
  choice: wie Eisen
  rationale: Das Vergleichsbild stellt den Himmel als hart und unnachgiebig dar; „wie Eisen“ bewahrt diese Metapher.
- source_word: אַרְצְכֶם
  choice: euer Land
  rationale: אֶרֶץ kann Land, Erde oder Boden bedeuten. Im landwirtschaftlichen und bundesbezogenen Zusammenhang erfasst „Land“ sowohl Gebiet als auch Ackerboden.
- source_word: כַּנְּחֻשָׁה
  choice: wie Bronze
  rationale: נְחֻשָׁה kann Kupfer oder Bronze bezeichnen. „Bronze“ ist die geläufige Wiedergabe des Bildes von hart gewordenem, unfruchtbarem Land; „Kupfer“ bleibt als lexikalische Alternative in der Fußnote erhalten.
theological_decisions:
- issue: Bildkraft der Bundesstrafe
  choice: Die Metaphern vom eisernen Himmel und bronzenen Land bleiben unausgedeutet stehen.
  alternative: Die Bilder ausdrücklich als Dürre und Unfruchtbarkeit erklären.
  rationale: Der Kontext legt Dürre und ausbleibenden Ertrag nahe, doch der hebräische Text nennt diese Folgen hier nicht ausdrücklich. Die Übersetzung bewahrt daher Bild und theologische Spannung, statt sie im Haupttext erklärend festzulegen.
- issue: Bedeutung von גְּאוֹן עֻזְּכֶם
  choice: „euren Stolz auf eure Stärke“ als negative Selbstüberhebung
  alternative: „die Hoheit eurer Macht“ als neutralere oder positivere Größe
  rationale: Im Zusammenhang des angekündigten Gerichts über widerspenstiges Israel liegt die negative Bedeutung „Stolz“ nahe. Die Formulierung lässt zugleich erkennen, dass sich dieser Stolz auf die eigene Stärke richtet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am Hebräischen, wird aber für natürliche Lesbarkeit in zwei Sätze gegliedert. Die konkreten Metallbilder werden bewahrt; ihre wahrscheinliche Bedeutung als Dürre und verhärteter Boden wird nicht in den Haupttext eingetragen.
