  terminology: „Stolz auf eure Stärke“ gibt גְּאוֹן עֻזְּכֶם im gerichtlichen Kontext sinnvoll wieder, ohne die Metapher übermäßig zu deuten. „Land“, „Eisen“ und „Bronze“ sind treffend. Die Alternative „Kupfer“ ist korrekt in der Fußnote vermerkt.
