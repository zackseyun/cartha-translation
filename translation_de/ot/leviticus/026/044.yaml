source:
  edition: WLC
  text: וְ/אַף גַּם זֹ֠את בִּֽ/הְיוֹתָ֞/ם בְּ/אֶ֣רֶץ אֹֽיְבֵי/הֶ֗ם לֹֽא מְאַסְתִּ֤י/ם וְ/לֹֽא גְעַלְתִּי/ם֙ לְ/כַלֹּתָ֔/ם לְ/הָפֵ֥ר בְּרִיתִ֖/י אִתָּ֑/ם כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/044.yaml
  text: Yet even then[a], when they are in the land of their enemies, I will not reject them, and I will not abhor them so as to destroy them, to break my covenant with them[c][b]; for I am Yahweh their God.
translation:
  language: de
  text: Doch selbst dann, wenn sie im Land ihrer Feinde sind, werde ich sie nicht verwerfen und sie nicht verabscheuen, bis hin dazu, sie völlig zu vernichten und meinen Bund mit ihnen zu brechen. Denn ich bin Jahwe, ihr Gott.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַף גַּם זֹאת
  choice: Doch selbst dann
  rationale: 'Die gehäufte Partikelverbindung hat hier eine verstärkende, einräumend-gegensätzliche Kraft: Trotz der zuvor angekündigten Gerichte bleibt Gottes Zusage bestehen.'
- source_word: בִּהְיוֹתָם בְּאֶרֶץ אֹיְבֵיהֶם
  choice: wenn sie im Land ihrer Feinde sind
  rationale: Der Infinitiv mit בְּ bezeichnet den zeitlichen Begleitumstand; die Konstruktkette wird direkt und natürlich wiedergegeben.
- source_word: לֹא מְאַסְתִּים
  choice: werde ich sie nicht verwerfen
  rationale: מָאַס bezeichnet Ablehnung oder Verwerfung. Das deutsche Futur bringt im Zusammenhang der angekündigten Verbannung den Zusagecharakter zum Ausdruck, ohne das hebräische Qatal als bloße Vergangenheitsform zu behandeln.
- source_word: וְלֹא גְעַלְתִּים
  choice: und nicht verabscheuen
  rationale: גָּעַל ist stärker als bloßes Ablehnen und bezeichnet Abscheu oder Ekel. „Verabscheuen“ ist würdig, verständlich und wahrt die Abstufung gegenüber „verwerfen“.
- source_word: לְכַלֹּתָם
  choice: sodass ich sie völlig vernichte
  rationale: Der לְ-Infinitiv kann Folge oder Zweck ausdrücken. „Sodass“ gibt hier den Sinn wieder, dass Gottes Abscheu nicht bis zur vollständigen Vernichtung führt; „völlig“ verdeutlicht den Gedanken des Zu-Ende-Bringens.
- source_word: לְהָפֵר בְּרִיתִי אִתָּם
  choice: und meinen Bund mit ihnen breche
  rationale: הֵפֵר bezeichnet beim Bund dessen Bruch, Aufhebung oder Außerkraftsetzung. „Den Bund brechen“ ist im Deutschen transparent und bewahrt den Ernst der Aussage.
- source_word: כִּי אֲנִי יְהוָה אֱלֹהֵיהֶם
  choice: Denn ich bin Jahwe, ihr Gott
  rationale: כִּי begründet die vorangehende Zusage. Der Eigenname יהוה wird als „Jahwe“ wiedergegeben; Gottes Bundesidentität bildet den Grund dafür, dass er sein Volk nicht endgültig preisgibt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen YHWH. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Zeitbezug der Qatal-Formen מְאַסְתִּים und גְעַלְתִּים
  choice: 'zukunftsbezogene Wiedergabe: „werde ich … nicht“'
  alternative: „habe ich … nicht“ oder „verwerfe ich … nicht“
  rationale: Im Zusammenhang blickt der Text auf Israels Aufenthalt im Feindesland voraus und formuliert Gottes bleibende Bundeszusage. Das Futur vermittelt diesen promissorischen Bezug, ohne zu behaupten, Qatal trage für sich allein eine festgelegte Zukunftsbedeutung.
- issue: Verhältnis der Infinitive לְכַלֹּתָם und לְהָפֵר
  choice: 'Folge: „sodass ich … vernichte und … breche“'
  alternative: 'Zweck: „um sie zu vernichten und … zu brechen“'
  rationale: Die hebräische Konstruktion lässt Zweck und Folge eng beieinanderstehen. Im Kontext beschreibt sie die äußerste Konsequenz, zu der Gottes Verwerfung und Abscheu gerade nicht führen; „sodass“ vermeidet im Deutschen die missverständliche Aussage einer von Gott verfolgten, aber nicht ausgeführten Absicht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen starken Verben „verwerfen“ und „verabscheuen“ bleiben erhalten. Der Satzbau wurde nur so weit geglättet, dass Zweck beziehungsweise Folge im Deutschen verständlich werden; die Spannung zwischen Gericht und fortbestehender Bundestreue bleibt bestehen.
