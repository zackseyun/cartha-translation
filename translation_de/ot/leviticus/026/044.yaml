  revised_text: Doch selbst dann, wenn sie im Land ihrer Feinde sind, werde ich sie nicht verwerfen und sie nicht verabscheuen, bis hin dazu, sie völlig zu vernichten und meinen Bund mit ihnen zu brechen. Denn ich bin Jahwe, ihr Gott.
