  source_fidelity: 'Die Grundbedeutung ist zutreffend: die verstärkte Einräumung, der Aufenthalt im Feindesland, die beiden Verben der Zurückweisung bzw. des Abscheus, die vollständige Vernichtung, der Bundesbruch und der Gottesname sind angemessen wiedergegeben. Die Infinitivfolge לְכַלֹּתָם לְהָפֵר ist jedoch enger an die vorangehende Verneinung gebunden, als die Formulierung mit „sodass“ erkennen lässt.'
  naturalness: Der Entwurf ist insgesamt modernes, würdevolles Standarddeutsch. „Sodass ich sie völlig vernichte“ kann allerdings im Deutschen eine tatsächlich eintretende Folge nahelegen und lässt die Reichweite der Verneinung weniger klar erkennen. „Bis hin dazu“ stellt klar, dass die genannten äußersten Folgen gerade ausgeschlossen werden, ohne einen im Hebräischen nicht entschiedenen reinen Zweck zu erzwingen.
  terminology: „verwerfen“, „verabscheuen“, „völlig vernichten“, „Bund“ und „Jahwe“ sind treffend und registergerecht. Die Fußnote zum Gottesnamen ist sachlich. Die lexikalische Alternative zu כָּלָה wird knapper formuliert, ohne die Übersetzung als zusätzliche Auslegung zu belasten.
  issues:
