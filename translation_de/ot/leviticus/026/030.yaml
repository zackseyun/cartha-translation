- from: Und ich werde eure Kulthöhen[a] vernichten und eure Räucheraltäre niederhauen. Ich werde eure Leichen auf die Leichen eurer Götzen[b] legen, und meine Seele wird euch verabscheuen.
  to: Und ich werde eure Kulthöhen vernichten und eure Räucheraltäre[a] niederreißen. Ich werde eure Leichen auf die Leichen eurer Götzen[b] legen, und meine Seele wird euch verabscheuen.
  rationale: Die Revision korrigiert den sachlich falschen Fußnotenanker und glättet die Verbindung von „niederhauen“ mit „Räucheraltäre“, ohne den konkreten Charakter von כרת oder die lexikalische Unsicherheit von חַמָּנִים zu verdecken. Die zweite Fußnote wird auf die im Vers selbst vorliegende Wortwiederholung beschränkt.
