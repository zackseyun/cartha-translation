source:
  edition: WLC
  text: וְ/הִשְׁמַדְתִּ֞י אֶת בָּמֹֽתֵי/כֶ֗ם וְ/הִכְרַתִּי֙ אֶת חַמָּ֣נֵי/כֶ֔ם וְ/נָֽתַתִּי֙ אֶת פִּגְרֵי/כֶ֔ם עַל פִּגְרֵ֖י גִּלּוּלֵי/כֶ֑ם וְ/גָעֲלָ֥ה נַפְשִׁ֖/י אֶתְ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/030.yaml
  text: And I will destroy your high places[a], and cut down your incense altars, and place your corpses on the carcasses of your idols[b], and my soul will abhor you.
translation:
  language: de
  text: Und ich werde eure Kulthöhen vernichten und eure Räucheraltäre[a] niederreißen. Ich werde eure Leichen auf die Leichen eurer Götzen[b] legen, und meine Seele wird euch verabscheuen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eure Sonnensäulen«. Das hebräische Wort bezeichnet Kultobjekte, die möglicherweise mit Sonnenverehrung oder Räucherwerk verbunden waren; ihre genaue Form und Funktion sind umstritten.'
    reason: lexical_alternative
  - marker: b
    text: 'Im Hebräischen steht für eure Leichen und für die Götzen dasselbe Wort: »Leichen«. Dadurch werden die Leblosigkeit und die Entehrung der Götzen besonders hervorgehoben.'
    reason: wordplay
lexical_decisions:
- source_word: וְהִשְׁמַדְתִּי
  choice: Und ich werde … vernichten
  rationale: Der Hifil von שׁמד bezeichnet das Herbeiführen von Zerstörung. »Vernichten« bewahrt die Stärke der angekündigten Gerichtsmaßnahme.
- source_word: בָּמֹתֵיכֶם
  choice: eure Kulthöhen
  rationale: במות bezeichnet erhöhte beziehungsweise als »Höhen« bezeichnete Kultstätten. »Kulthöhen« ist im heutigen Deutsch verständlicher als das missverständliche »Höhen« und lässt die örtliche wie kultische Bedeutung erkennen.
- source_word: וְהִכְרַתִּי
  choice: niederhauen
  rationale: כרת bedeutet grundsätzlich »abschneiden«. Bei aufgerichteten Kultobjekten gibt »niederhauen« die konkrete Zerstörung anschaulich wieder.
- source_word: חַמָּנֵיכֶם
  choice: eure Räucheraltäre
  rationale: חמנים bezeichnet Kultobjekte, deren genaue Gestalt und Funktion umstritten ist; wahrscheinlich waren sie mit Sonnenkult oder Räucherwerk verbunden. Die lesbare funktionale Wiedergabe wird durch Fußnote [a] als unsicher ausgewiesen.
- source_word: פִּגְרֵיכֶם עַל פִּגְרֵי גִּלּוּלֵיכֶם
  choice: eure Leichen auf die Leichen eurer Götzen
  rationale: Die Wiederholung von פגר wird im Deutschen bewusst mit »Leichen« bewahrt. So tritt die makabre Gleichsetzung hervor, durch die auch die Götzen als leblos und geschändet erscheinen.
- source_word: גִּלּוּלֵיכֶם
  choice: eurer Götzen
  rationale: גלולים ist eine verächtliche Bezeichnung für Götzenbilder. »Götzen« ist klar und trägt im Deutschen bereits eine abwertende Färbung, ohne eine unsichere Etymologie in den Haupttext einzutragen.
- source_word: וְגָעֲלָה נַפְשִׁי אֶתְכֶם
  choice: und meine Seele wird euch verabscheuen
  rationale: Die wörtliche Subjektkonstruktion mit נפשי, »meine Seele«, bleibt erhalten. »Verabscheuen« gibt die intensive Abneigung von געל wieder und bewahrt die anthropopathische Ausdrucksweise.
theological_decisions:
- issue: Anthropopathische Aussage über Gottes Abscheu
  choice: meine Seele wird euch verabscheuen
  alternative: ich werde euch verabscheuen / ich werde euch verwerfen
  rationale: Der hebräische Text nennt ausdrücklich »meine Seele« und formuliert intensive göttliche Abscheu. Die Übersetzung glättet diese theologische Spannung nicht zu einer bloßen Aussage des Verwerfens.
- issue: Bezeichnung der Kultobjekte als Leichen
  choice: die Leichen eurer Götzen
  alternative: die Trümmer / Überreste eurer Götzen
  rationale: 'Die Wiederholung desselben hebräischen Wortes פגר für Menschen und Götzen ist rhetorisch und theologisch bedeutsam: Die verehrten Bilder werden als tot und ohnmächtig vorgeführt. Diese Spannung wird nicht sachlich abgeschwächt.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit konkreter und bewusst harter Gerichtssprache. »Kulthöhen« vermeidet die Unklarheit des isolierten »Höhen«. Die Wiederholung »Leichen … Leichen« sowie »meine Seele« bewahren die auffällige Bildsprache und theologische Spannung des Hebräischen.
