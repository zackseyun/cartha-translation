review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung gibt die Abfolge der hebräischen Gerichtsankündigungen, die Wiederholung von פגר („Leichen“) und die auffällige Wendung „meine Seele“ insgesamt treffend wieder. Die Anmerkung zur umstrittenen Bedeutung von חַמָּנִים ist sachgerecht. Der Anker dieser Anmerkung steht jedoch beim falschen Bezugswort: „Sonnensäulen“ ist eine mögliche Deutung von חַמָּנֵיכֶם, nicht von בָּמֹתֵיכֶם („Kulthöhen“).'
  naturalness: „Kulthöhen“, „Leichen“ und „meine Seele wird euch verabscheuen“ sind im würdevollen modernen Standarddeutsch verständlich und dem Register angemessen. „Räucheraltäre niederhauen“ verbindet sich weniger natürlich, da Altäre eher niedergerissen oder zerstört werden; „niederreißen“ bewahrt die konkrete Zerstörungsmetapher und passt sowohl zu Altären als auch zur in der Anmerkung genannten Deutung als Säulen.
  terminology: „Kulthöhen“ für בָּמוֹת und „Götzen“ für גִּלּוּלִים sind passend. Die bewusste Wiederholung von „Leichen“ wahrt das hebräische Wortspiel. Die Fußnote zu [b] sollte nicht zusätzlich präzisieren, die Menschen seien „getötet“, da der Vers lediglich ihre Leichen nennt.
