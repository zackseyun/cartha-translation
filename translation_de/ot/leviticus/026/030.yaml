    rationale: „Niederreißen“ ist für Altäre idiomatischer und kann zugleich die mögliche Vorstellung aufgerichteter Kultobjekte abdecken, ohne die umstrittene Referenz im Haupttext festzulegen.
  - severity: low
    issue: Fußnote [b] ergänzt „getöteten Menschen“.
    rationale: Der hebräische Text bezeichnet sie als Leichen, erklärt aber an dieser Stelle nicht ausdrücklich ihren Tod als Tötung. Die Erläuterung sollte beim Textbefund bleiben.
