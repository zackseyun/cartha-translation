id: LEV.26.1
reference: Leviticus 26:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לֹֽא תַעֲשׂ֨וּ לָ/כֶ֜ם אֱלִילִ֗ם וּ/פֶ֤סֶל וּ/מַצֵּבָה֙ לֹֽא תָקִ֣ימוּ לָ/כֶ֔ם וְ/אֶ֣בֶן מַשְׂכִּ֗ית לֹ֤א תִתְּנוּ֙ בְּ/אַרְצְ/כֶ֔ם לְ/הִֽשְׁתַּחֲוֺ֖ת עָלֶ֑י/הָ כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/001.yaml
  text: You shall not make idols for yourselves[a], and you shall not set up for yourselves a carved image or a standing stone, and you shall not place a figured stone in your land to bow down to it[b], for I am Yahweh your God.
translation:
  language: de
  text: Ihr sollt euch keine Götzen machen. Weder ein geschnitztes Bild noch einen aufgerichteten Stein sollt ihr für euch errichten. Auch sollt ihr in eurem Land keinen Stein mit einer Darstellung[a] aufstellen, um euch vor ihm niederzuwerfen[b]. Denn ich bin Jahwe[c], euer Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „behauener Stein“, „Steinbild“ oder „Stein mit einer bildlichen Darstellung“. Die genaue Bedeutung des hebräischen Ausdrucks ist umstritten; gemeint ist wahrscheinlich ein Steinobjekt im Zusammenhang verbotener Verehrung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „um euch auf ihm niederzuwerfen“. Die hebräische Präposition kann sowohl den Gegenstand der Verehrung als auch den Ort der Niederwerfung bezeichnen.'
    reason: alternative_reading
  - marker: c
    text: Hebräisch JHWH; traditionell mit „der HERR“ wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלִילִם
  choice: Götzen
  rationale: Das Wort bezeichnet verehrte Götterbilder oder falsche Götter und trägt oft einen abwertenden Beiklang. „Götzen“ ist im modernen Deutschen klar und bewahrt diesen Beiklang, ohne ihn durch einen Zusatz zu verstärken.
- source_word: פֶסֶל
  choice: geschnitztes Bild
  rationale: Der Ausdruck bezeichnet ein durch Schnitzen oder Behauen angefertigtes Bild. Die Wiedergabe hält es von den übrigen Kultgegenständen des Verses unterscheidbar.
- source_word: מַצֵּבָה
  choice: aufgerichteter Stein
  rationale: Gemeint ist ein aufrecht errichtetes Steinmal beziehungsweise eine Steinsäule. „Aufgerichteter Stein“ ist konkret und vermeidet es, die kultische Funktion stärker auszudeuten, als das Substantiv allein verlangt.
- source_word: אֶבֶן מַשְׂכִּית
  choice: Bildstein
  rationale: Die seltene Verbindung bezeichnet wahrscheinlich einen mit einem Bild, Relief oder einer Verzierung versehenen Stein. „Bildstein“ wahrt den Unterschied zu פֶסֶל; die unsichere genaue Bedeutung wird in einer Fußnote kenntlich gemacht.
- source_word: תַעֲשׂוּ לָכֶם
  choice: sollt euch … machen
  rationale: Die Formulierung erhält sowohl das Verbot als auch die reflexiv-benefaktive Bedeutung von לָכֶם.
- source_word: תָקִימוּ לָכֶם
  choice: sollt ihr euch errichten
  rationale: Der Hifil von קום bezeichnet hier das Errichten beziehungsweise Aufstellen eines Gegenstands. Das Dativpronomen bewahrt לָכֶם.
- source_word: תִתְּנוּ בְּאַרְצְכֶם
  choice: sollt ihr in eurem Land aufstellen
  rationale: נתן mit einer Ortsangabe bedeutet hier „setzen/platzieren“. „Aufstellen“ ist bei einem Stein idiomatisch und erhält den Bezug auf das Land.
- source_word: לְהִשְׁתַּחֲוֺת עָלֶיהָ
  choice: um euch vor ihm niederzuwerfen
  rationale: Der Infinitiv gibt den Zweck an. השתחוה bezeichnet das Niederwerfen als Huldigungs- oder Verehrungsgeste. עַל kann hier den Gegenstand bezeichnen, vor dem man sich niederwirft; die räumliche Alternative wird in einer Fußnote bewahrt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: „Jahwe“ ist die im Deutschen gebräuchliche Wiedergabe des göttlichen Eigennamens JHWH und ersetzt ihn nicht durch einen Titel.
- source_word: כִּי אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: Denn ich bin Jahwe, euer Gott
  rationale: כִּי begründet das Verbot. „Denn“ gibt diese Funktion knapp wieder; die Nominalformel bleibt ihrem feierlichen Bundescharakter entsprechend erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. Die deutsche Form „Jahwe“ bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen; eine Fußnote nennt die traditionelle Wiedergabe.
- issue: Unterscheidung der verbotenen Kultgegenstände
  choice: Götzen, geschnitztes Bild, aufgerichteter Stein und Bildstein werden lexikalisch unterschieden
  alternative: Alle Ausdrücke einheitlich als „Götzen“ oder „Götterbilder“ wiedergeben
  rationale: Der Vers häuft vier verschiedene hebräische Bezeichnungen an. Ihre Unterscheidung bewahrt die Konkretheit und Reichweite des Verbots, ohne die Gegenstände einer bestimmten späteren Kultpraxis zuzuordnen.
- issue: Bezug der Präposition עַל in לְהִשְׁתַּחֲוֺת עָלֶיהָ
  choice: sich vor dem Stein niederwerfen
  alternative: sich auf dem Stein niederwerfen
  rationale: Im Zusammenhang verbotener Verehrung ist der Stein als Gegenstand der Huldigung am wahrscheinlichsten. Da עַל auch räumlich „auf“ bedeuten kann, wird diese echte syntaktisch-semantische Möglichkeit in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Gesetzesstil. Die Satzgliederung macht die Reihe der Verbote übersichtlich. Konkrete Gegenstandsbezeichnungen bleiben voneinander unterschieden; seltene oder umstrittene Bedeutungen werden nicht im Haupttext ausgedeutet, sondern in Fußnoten offengehalten.
