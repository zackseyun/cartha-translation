base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/008.yaml
  text: Five of you will chase a hundred[a], and a hundred of you will chase ten thousand[b], and your enemies will fall before you by the sword.
translation:
  language: de
  text: Fünf von euch werden hundert verfolgen[a], und hundert von euch werden zehntausend verfolgen[b]. Eure Feinde werden vor euch durch das Schwert fallen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nachjagen“; ebenso im folgenden Satzteil.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann „zehntausend“ oder „eine Myriade“ bedeuten; hier passt „zehntausend“ zum Zahlenvergleich.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָדְפוּ / יִרְדֹּפוּ
  choice: werden … verfolgen
  rationale: רדף bedeutet „verfolgen, nachjagen“. „Verfolgen“ ist im militärischen Zusammenhang natürlich und bewahrt den in beiden Satzteilen wiederholten Ausdruck.
- source_word: מִכֶּם
  choice: von euch
  rationale: 'Die Präposition מן mit Suffix wird hier partitiv gebraucht: „fünf von euch“ beziehungsweise „hundert von euch“.'
- source_word: חֲמִשָּׁה מֵאָה
  choice: Fünf von euch werden hundert verfolgen
  rationale: Die knappe Zahlenkonstruktion wird im Deutschen idiomatisch wiedergegeben, ohne das starke Zahlenverhältnis abzuschwächen.
- source_word: רְבָבָה
  choice: zehntausend
  rationale: Das Wort kann „Zehntausend“ oder allgemeiner eine sehr große Menge bezeichnen. Im zahlenmäßigen Parallelismus ist die konkrete Zahl „zehntausend“ vorzuziehen.
- source_word: וְנָפְלוּ
  choice: werden … fallen
  rationale: Die wörtliche Bildsprache von נפל bleibt erhalten; im Kampfzusammenhang bezeichnet sie die Niederlage beziehungsweise den Tod der Feinde.
- source_word: אֹיְבֵיכֶם
  choice: eure Feinde
  rationale: Direkte und übliche Entsprechung im militärischen Zusammenhang des Bundessegens.
- source_word: לִפְנֵיכֶם
  choice: vor euch
  rationale: „Vor euch fallen“ gibt die hebräische Wendung eng und im Deutschen verständlich wieder.
- source_word: לֶחָרֶב
  choice: durch das Schwert
  rationale: Die Präposition bezeichnet hier das Mittel ihres Fallens. „Durch das Schwert“ bewahrt das konkrete militärische Bild.
theological_decisions:
- issue: Militärische Verheißung im Rahmen des Bundessegens
  choice: Die konkrete Zusage eines zahlenmäßig weit überlegenen Sieges wird ungemildert beibehalten.
  alternative: Die Aussage als allgemeine Ermutigung oder bloß bildhafte Siegesgewissheit wiederzugeben.
  rationale: Der hebräische Text nennt bestimmte Zahlen und das Fallen der Feinde durch das Schwert. Die Übersetzung sollte weder die Konkretheit abschwächen noch entscheiden, ob die Zahlen rhetorisch überhöht oder strikt wörtlich gemeint sind.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur und die konkrete militärische Bildsprache des Hebräischen bleiben erhalten.
