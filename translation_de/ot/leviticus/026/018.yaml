  text: וְ/אִ֨ם עַד אֵ֔לֶּה לֹ֥א תִשְׁמְע֖וּ לִ֑/י וְ/יָסַפְתִּי֙ לְ/יַסְּרָ֣ה אֶתְ/כֶ֔ם שֶׁ֖בַע עַל חַטֹּאתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/018.yaml
  text: And if[a], despite these things, you do not listen to me[b], then I will continue to discipline you sevenfold for your sins.
translation:
  language: de
  text: Wenn ihr aber trotz alledem[a] nicht auf mich hört, werde ich euch für eure Sünden weiterhin siebenfach[b] züchtigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „bei alledem“; die hebräische Wendung meint hier: trotz der vorangehenden Strafgerichte.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „siebenmal“. Das Hebräische kann ein gesteigertes Strafmaß bezeichnen und muss nicht zwingend als genaue Anzahl verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Wenn ihr aber
  rationale: Die Formulierung führt die nächste Bedingung innerhalb der fortlaufenden Bundeswarnungen ein. „Aber“ gibt die verbindende und zugleich kontrastierende Wirkung des ו im Deutschen natürlich wieder.
- source_word: עַד אֵלֶּה
  choice: trotz alledem
  rationale: Die Wendung bezeichnet hier fortgesetzten Ungehorsam trotz der zuvor angekündigten beziehungsweise erfahrenen Strafgerichte, nicht bloß einen zeitlichen Endpunkt.
- source_word: לֹא תִשְׁמְעוּ לִי
  choice: nicht auf mich hört
  rationale: שׁמע mit ל umfasst ein Hören, das gehorsame Reaktion erwartet. „Auf mich hört“ bewahrt das hebräische Hörbild und lässt dessen Gehorsamsaspekt im Zusammenhang mitschwingen.
- source_word: וְיָסַפְתִּי
  choice: werde ich … weiterhin
  rationale: יסף drückt hier die Fortsetzung und Steigerung der Züchtigung aus. „Weiterhin“ ist im Deutschen natürlicher als ein wörtliches „hinzufügen“.
- source_word: לְיַסְּרָה אֶתְכֶם
  choice: euch … züchtigen
  rationale: יסר verbindet strafende mit zurechtbringender Einwirkung. „Züchtigen“ bewahrt in diesem Bundesfluchzusammenhang beide Aspekte besser als das rein vergeltende „bestrafen“ oder das zu milde „zurechtweisen“.
- source_word: שֶׁבַע
  choice: siebenfach
  rationale: שׁבע steht adverbial und kann das gesteigerte Maß der Züchtigung bezeichnen. „Siebenfach“ ist knapp und lässt sowohl Intensivierung als auch zahlenbezogene Deutung zu.
- source_word: עַל חַטֹּאתֵיכֶם
  choice: für eure Sünden
  rationale: עַל nennt hier den Grund der Züchtigung. „Für eure Sünden“ gibt diesen kausalen Zusammenhang knapp und idiomatisch wieder.
theological_decisions:
- issue: Bedeutung von יָסַר im Zusammenhang der Bundesflüche
  choice: züchtigen
  alternative: bestrafen
  rationale: Die angekündigten Maßnahmen sind strafend, haben innerhalb der Bundesbeziehung aber zugleich einen zurechtbringenden Zug. „Züchtigen“ erhält diese Spannung, ohne den Ausdruck auf reine Vergeltung oder bloß sanfte Erziehung zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Züchtigen“ ist bewusst kräftiger als „zurechtweisen“ und bewahrt den strafenden wie zurechtbringenden Sinn des hebräischen Verbs; die mögliche zahlenmäßige oder intensivierend-symbolische Bedeutung von „siebenfach“ bleibt durch die Fußnote offen.
