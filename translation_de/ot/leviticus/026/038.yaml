source:
  edition: WLC
  text: וַ/אֲבַדְתֶּ֖ם בַּ/גּוֹיִ֑ם וְ/אָכְלָ֣ה אֶתְ/כֶ֔ם אֶ֖רֶץ אֹיְבֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/038.yaml
  text: You will perish among the nations[a], and the land of your enemies will consume you.
translation:
  language: de
  text: Ihr werdet unter den Völkern zugrunde gehen, und das Land eurer Feinde wird euch verschlingen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wird euch essen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲבַדְתֶּם
  choice: ihr werdet zugrunde gehen
  rationale: Das Qal von אבד bezeichnet hier als Folge der Bundesflüche Untergang oder Verderben. „Zugrunde gehen“ ist im Deutschen natürlich und legt nicht unnötig eine bestimmte Todesart fest.
- source_word: בַּגּוֹיִם
  choice: unter den Völkern
  rationale: גּוֹיִם bedeutet „Völker“ oder „Nationen“. „Unter den Völkern“ gibt den Aufenthaltsbereich im Exil idiomatisch wieder, ohne die spätere Bedeutung von „Heiden“ einzutragen.
- source_word: וְאָכְלָה
  choice: wird verschlingen
  rationale: אכל bedeutet wörtlich „essen“. Mit „Land“ als Subjekt ist es ein starkes Bild für das Aufzehren der Verbannten; „verschlingen“ bewahrt diese Personifikation und klingt im Deutschen natürlich.
- source_word: אֶתְכֶם
  choice: euch
  rationale: Die direkte Objektmarkierung mit dem Suffix der 2. Person maskulin Plural wird natürlich mit „euch“ wiedergegeben.
- source_word: אֶרֶץ
  choice: das Land
  rationale: אֶרֶץ kann „Land“, „Erde“ oder „Gebiet“ bedeuten. In diesem Exilzusammenhang ist „das Land eurer Feinde“ die sachlich und idiomatisch passende Wiedergabe.
- source_word: אֹיְבֵיכֶם
  choice: eurer Feinde
  rationale: Die Status-constructus-Verbindung bezeichnet das Land, das den Feinden des angesprochenen Volkes gehört; „eurer Feinde“ gibt sie direkt wieder.
theological_decisions:
- issue: Bildhafte Aussage, dass das Land die Verbannten „isst“
  choice: Das Bild bleibt als „das Land eurer Feinde wird euch verschlingen“ erhalten.
  alternative: Das Land eurer Feinde wird euch vernichten.
  rationale: Der hebräische Text gebraucht אכל („essen“) bildlich und macht das Land selbst zum handelnden Subjekt. Die Übersetzung bewahrt die Härte und Spannung des Bundesfluchs, ohne das Bild erklärend aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Zugrunde gehen“ und „verschlingen“ sind allgemein verständlich; die markante Personifikation des Landes bleibt erhalten.
