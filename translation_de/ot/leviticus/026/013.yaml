source:
  edition: WLC
  text: אֲנִ֞י יְהוָ֣ה אֱלֹֽהֵי/כֶ֗ם אֲשֶׁ֨ר הוֹצֵ֤אתִי אֶתְ/כֶם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם מִֽ/הְיֹ֥ת לָ/הֶ֖ם עֲבָדִ֑ים וָ/אֶשְׁבֹּר֙ מֹטֹ֣ת עֻלְּ/כֶ֔ם וָ/אוֹלֵ֥ךְ אֶתְ/כֶ֖ם קֽוֹמְמִיּֽוּת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/013.yaml
  text: I am Yahweh your God[a], who brought you out of the land of Egypt, from being their servants[c][b]; I broke the bars of your yoke and made you walk upright.
translation:
  language: de
  text: Ich bin Jahwe, euer Gott, der euch aus dem Land Ägypten herausgeführt hat, sodass ihr nicht länger ihre Sklaven wart. Ich zerbrach die Stangen eures Jochs[a] und ließ euch aufrecht gehen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Querhölzer eures Jochs“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ließ euch erhobenen Hauptes gehen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel wie „der HERR“ ersetzt; „Jahwe“ ist die im Deutschen übliche Umschrift.
- source_word: אֱלֹהֵיכֶם
  choice: euer Gott
  rationale: Im Bundeszusammenhang bezeichnet die grammatisch plurale Form eindeutig den einen Gott Israels.
- source_word: הוֹצֵאתִי אֶתְכֶם מֵאֶרֶץ מִצְרַיִם
  choice: der euch aus dem Land Ägypten herausgeführt hat
  rationale: Die Hifil-Form von יצא bezeichnet das Herausführen; die Formulierung bewahrt das Exodusmotiv und die geografisch-bundestheologische Wendung „Land Ägypten“.
- source_word: מִהְיֹת לָהֶם עֲבָדִים
  choice: sodass ihr nicht länger ihre Sklaven wart
  rationale: Die Konstruktion bezeichnet die Befreiung aus einem bestehenden Zustand. „Sklaven“ macht den erzwungenen Status unter ägyptischer Herrschaft deutlich, während „sodass“ den resultativen Zusammenhang natürlich wiedergibt.
- source_word: וָאֶשְׁבֹּר
  choice: Ich zerbrach
  rationale: Die Wiedergabe bewahrt die konkrete, nachdrückliche göttliche Handlung des Verbs שבר.
- source_word: מֹטֹת עֻלְּכֶם
  choice: die Stangen eures Jochs
  rationale: מוֹטוֹת bezeichnet die Stangen oder Querhölzer eines Jochs. Die Übersetzung erhält das konkrete Bild der gebrochenen Zwangsherrschaft.
- source_word: וָאוֹלֵךְ אֶתְכֶם
  choice: und ließ euch ... gehen
  rationale: Die Form ist kausativ; „ließ euch gehen“ gibt den bewirkten Übergang zu freier, aufrechter Bewegung im Deutschen natürlich wieder.
- source_word: קוֹמְמִיּוּת
  choice: aufrecht
  rationale: Das Wort bezeichnet eine aufgerichtete Haltung und kann zugleich die wiederhergestellte Würde der Befreiten ausdrücken, ohne das Bild durch eine eindeutige Deutung einzuengen.
theological_decisions:
- issue: Bezeichnung des Status Israels in Ägypten
  choice: Sklaven
  alternative: Diener
  rationale: Der Zusammenhang handelt von bedrückender, erzwungener Knechtschaft. „Diener“ könnte diesen Status im heutigen Deutsch unangemessen abschwächen.
- issue: Deutung des abschließenden Befreiungsbildes
  choice: ließ euch aufrecht gehen
  alternative: führte euch erhobenen Hauptes
  rationale: Die gewählte Fassung erhält sowohl die kausative Bewegung als auch die körperliche und sinnbildliche Aufrichtung. Die Alternative verdeutlicht stärker die wiedergewonnene Würde, legt das Bild aber enger aus.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nah am hebräischen Bundeswort, wird aber so gegliedert, dass Befreiung, Zerbrechen des Jochs und wiederhergestellte aufrechte Haltung klar und natürlich verständlich sind.
