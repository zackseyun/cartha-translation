source:
  edition: WLC
  text: אַף אֲנִ֗י אֵלֵ֤ךְ עִמָּ/ם֙ בְּ/קֶ֔רִי וְ/הֵבֵאתִ֣י אֹתָ֔/ם בְּ/אֶ֖רֶץ אֹיְבֵי/הֶ֑ם אוֹ אָ֣ז יִכָּנַ֗ע לְבָבָ/ם֙ הֶֽ/עָרֵ֔ל וְ/אָ֖ז יִרְצ֥וּ אֶת עֲוֺנָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/041.yaml
  text: I too will walk contrary to them and bring them into the land of their enemies[a]; or then their uncircumcised heart will be humbled[e][d][c][b], and then they will accept the punishment for their iniquity.
translation:
  language: de
  text: Auch ich werde ihnen feindlich entgegentreten und sie in das Land ihrer Feinde bringen. Oder vielleicht wird dann ihr unbeschnittenes Herz gedemütigt[a], und dann werden sie die Folgen ihrer Schuld tragen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ihr unbeschnittenes Herz“. Das ist ein Bild für ein Inneres, das sich Gott widersetzt und nicht seinem Bund entspricht. Die Wendung „oder dann“ ist im Hebräischen syntaktisch schwierig; sie kann den Zeitpunkt oder die Möglichkeit ihrer Demütigung einleiten.'
    reason: cultural_note_and_alternative_reading
  - marker: b
    text: 'Auch möglich: „dann werden sie die Strafe für ihre Schuld hinnehmen“ oder „dann wird ihre Schuld abgetragen“. Gemeint ist, dass sie die aufgrund ihrer Schuld fälligen Folgen tragen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף אֲנִי
  choice: Auch ich
  rationale: 'אַף mit dem selbstständigen Pronomen betont Gottes entsprechendes Handeln: Wie das Volk ihm begegnete, so handelt auch er an ihm.'
- source_word: אֵלֵךְ עִמָּם בְּקֶרִי
  choice: werde ihnen feindlich entgegentreten
  rationale: Die Wendung nimmt die wiederkehrende Fluchformel des Kapitels auf. קֶרִי bezeichnet hier feindlichen Widerstand; die deutsche Formulierung gibt den Sinn natürlich wieder, ohne das hebräische Bild des Gehens gekünstelt nachzuahmen.
- source_word: וְהֵבֵאתִי אֹתָם בְּאֶרֶץ אֹיְבֵיהֶם
  choice: und sie in das Land ihrer Feinde bringen
  rationale: Der Hifil von בוא bedeutet „bringen“; die Formulierung bewahrt den Zusammenhang von Verbannung und Fremdherrschaft.
- source_word: אוֹ אָז
  choice: Oder dann
  rationale: Die syntaktisch schwierige Wendung wird bewusst nicht geglättet. „Oder dann“ erhält ihre disjunktive Kraft und die Mehrdeutigkeit des Gedankengangs.
- source_word: יִכָּנַע
  choice: wird sich … demütigen
  rationale: Der Nifal von כנע kann „gedemütigt werden“ oder „sich demütigen“ bedeuten. Beim Herzen als Subjekt drückt die reflexive Form innere Beugung aus, ohne die grammatische Spannung völlig aufzulösen.
- source_word: לְבָבָם הֶעָרֵל
  choice: ihr unbeschnittenes Herz
  rationale: Das Bundeszeichen wird metaphorisch auf das Innere bezogen. Die wörtliche Metapher bleibt erhalten, weil „widerspenstiges Herz“ ihre kulturelle und theologische Tiefe abschwächen würde.
- source_word: וְאָז יִרְצוּ אֶת עֲוֺנָם
  choice: und dann werden sie die Folgen ihrer Schuld tragen
  rationale: רצה mit עון bezeichnet hier das Abtragen beziehungsweise Hinnehmen der aufgrund von Schuld fälligen Folgen. „Die Folgen ihrer Schuld tragen“ ist verständlich und vermeidet sowohl die Verengung auf eine konkrete Strafe als auch den Eindruck verdienstlicher Selbstsühne.
theological_decisions:
- issue: Die Beschneidungsmetapher הֶעָרֵל für das Herz
  choice: Die Metapher wird als „unbeschnittenes Herz“ beibehalten.
  alternative: „widerspenstiges Herz“ oder „verstocktes Herz“
  rationale: Der Text verwendet einen gewichtigen Bundesbegriff und nicht nur eine allgemeine Charakterisierung. Die Beibehaltung wahrt die Bezüge zu Deuteronomium und den Propheten.
- issue: Bedeutung von יִרְצוּ אֶת עֲוֺנָם
  choice: Sie tragen die Folgen ihrer Schuld.
  alternative: Sie sühnen ihre Schuld; sie nehmen die Strafe für ihre Schuld an; ihre Schuld wird abgetragen.
  rationale: Die Wendung betrifft das Tragen beziehungsweise Abtragen der Bundesstrafe. Die Übersetzung wahrt den gerichtlichen Sinn, ohne eine verdienstliche Selbstsühne in den Text hineinzulesen.
- issue: Funktion von אוֹ אָז
  choice: „Oder dann“ wird als schwierige, disjunktive Wendung erhalten.
  alternative: „wenn sich dann“ oder „vielleicht wird dann“
  rationale: Der hebräische Satz lässt das genaue logische Verhältnis offen. Eine glättende Bedingungsform würde diese echte Mehrdeutigkeit vorschnell auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung „dann … dann“ folgt der hebräischen Struktur. Die schwer verständliche Wendung „Oder dann“ sowie die Bundesmetapher „unbeschnittenes Herz“ wurden nicht interpretierend eingeebnet.
