base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/003.yaml
  text: If you walk in my statutes and keep my commandments and do them,[a]
translation:
  language: de
  text: Wenn ihr nach meinen Satzungen lebt[a], meine Gebote haltet und sie ausführt,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ihr geht in meinen Satzungen“. Das ist eine bundesbezogene Ausdrucksweise dafür, das ganze Leben nach ihnen auszurichten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Wenn
  rationale: Leitet ausdrücklich den Bedingungssatz ein; „wenn“ gibt die konditionale Funktion im Deutschen natürlich wieder.
- source_word: בְּחֻקֹּתַי תֵּלֵכוּ
  choice: nach meinen Satzungen lebt
  rationale: Die Verbindung von ב mit הלך bezeichnet bildhaft eine Lebensführung, die sich an Gottes festgesetzten Ordnungen ausrichtet. Die Formulierung ist in modernem Deutsch verständlich; die zugrunde liegende Geh-Metapher wird in der Fußnote offengelegt.
- source_word: מִצְוֺתַי
  choice: meine Gebote
  rationale: „Gebote“ bewahrt den rechtlich-bundestheologischen Sinn von מִצְוָה und unterscheidet sich passend von „Satzungen“.
- source_word: תִּשְׁמְרוּ
  choice: haltet
  rationale: שׁמר bedeutet im Zusammenhang mit Geboten, sie zu beachten und einzuhalten; „halten“ ist knapp, geläufig und sachgerecht.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: und sie ausführt
  rationale: Die Wendung betont die tatsächliche Umsetzung der Gebote. „Ausführen“ vermeidet im Deutschen die schwerfällige Formulierung „sie tun“, ohne den Handlungsaspekt abzuschwächen.
theological_decisions:
- issue: Bundesgehorsam als Weg- bzw. Geh-Metapher
  choice: Die idiomatische Bedeutung wird im Haupttext mit „nach meinen Satzungen lebt“ wiedergegeben und die wörtliche Metapher in einer Fußnote bewahrt.
  alternative: „in meinen Satzungen wandelt“ oder „in meinen Satzungen geht“
  rationale: „Wandeln“ wirkt im heutigen Standarddeutsch altertümlich, während „in meinen Satzungen gehen“ unnatürlich klingt. Die gewählte Fassung vermittelt die Lebensführung nach Gottes Satzungen, ohne die Metapher stillschweigend verschwinden zu lassen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Satzungen“, „Gebote“ und „halten“ bewahren den rechtlich-bundestheologischen Ton; die Satzform bleibt offen, da der Bedingungssatz im folgenden Vers fortgesetzt wird.
