source:
  edition: WLC
  text: וְ/נָתַתִּ֤י פָנַ/י֙ בָּ/כֶ֔ם וְ/נִגַּפְתֶּ֖ם לִ/פְנֵ֣י אֹיְבֵי/כֶ֑ם וְ/רָד֤וּ בָ/כֶם֙ שֹֽׂנְאֵי/כֶ֔ם וְ/נַסְתֶּ֖ם וְ/אֵין רֹדֵ֥ף אֶתְ/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/017.yaml
  text: And I will set my face against you[a], and you will be struck down before your enemies; those who hate you will rule over you[c][b], and you will flee when no one is pursuing you.
translation:
  language: de
  text: Ich werde mein Angesicht gegen euch richten[a], und ihr werdet vor euren Feinden geschlagen werden[b]. Die euch hassen, werden über euch herrschen, und ihr werdet fliehen, ohne dass euch jemand verfolgt.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Wendung „das Angesicht gegen jemanden richten“ bezeichnet entschlossene Gegnerschaft im Gericht.
    reason: cultural_note
  - marker: b
    text: 'Oder: „besiegt werden“.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „obwohl euch niemand verfolgt“ oder wörtlicher: „und niemand verfolgt euch“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי פָנַי בָכֶם
  choice: Ich werde mein Angesicht gegen euch richten
  rationale: Die hebräische Wendung bezeichnet Gottes entschlossene, persönliche Gegnerschaft im Gericht. Die bildhafte Rede vom Angesicht bleibt erhalten, während „richten“ die zielgerichtete Haltung natürlich ausdrückt.
- source_word: וְנִגַּפְתֶּם
  choice: ihr werdet geschlagen werden
  rationale: Das Nifal von נגף bezeichnet hier das Geschlagen- oder Besiegtwerden vor einem Feind. „Geschlagen werden“ bewahrt sowohl die militärische Bedeutung als auch die Bildhaftigkeit des Verbs.
- source_word: לִפְנֵי אֹיְבֵיכֶם
  choice: vor euren Feinden
  rationale: 'Die räumliche Wendung ist zugleich im militärischen Sinn verständlich: Israel wird angesichts seiner Feinde eine Niederlage erleiden.'
- source_word: וְרָדוּ בָכֶם
  choice: werden über euch herrschen
  rationale: רדה bezeichnet Herrschaft oder Machtausübung. „Über euch herrschen“ gibt die Unterwerfung direkt wieder, ohne die Art oder Härte dieser Herrschaft über den Wortlaut hinaus festzulegen.
- source_word: שֹׂנְאֵיכֶם
  choice: die euch hassen
  rationale: Das Partizip benennt ausdrücklich die Hassenden und wahrt damit den Unterschied zum zuvor verwendeten אֹיְבֵיכֶם („eure Feinde“).
- source_word: וְנַסְתֶּם
  choice: ihr werdet fliehen
  rationale: נוס ist das übliche Verb für die Flucht und passt knapp und natürlich zum militärischen Zusammenhang.
- source_word: וְאֵין רֹדֵף אֶתְכֶם
  choice: ohne dass euch jemand verfolgt
  rationale: Die Formulierung bringt die panische Flucht bei völliger Abwesenheit eines Verfolgers natürlich zum Ausdruck. Das einfache hebräische וְ lässt daneben auch eine stärker beigeordnete oder konzessive Wiedergabe zu.
theological_decisions:
- issue: Anthropomorphe Rede von Gottes Angesicht im Gericht
  choice: Die Wendung „mein Angesicht gegen euch richten“ wird beibehalten.
  alternative: Ich werde mich gegen euch stellen.
  rationale: Die bildhafte Sprache stellt Gottes Gericht als persönliche und entschlossene Gegnerschaft im Bundesverhältnis dar. Eine rein abstrakte Wiedergabe würde diese relationale Kraft abschwächen.
- issue: Art der Herrschaft durch Israels Hasser
  choice: „über euch herrschen“
  alternative: euch unterdrücken / euch beherrschen
  rationale: Der Text kündigt Unterwerfung an, bestimmt in diesem Satz jedoch nicht ausdrücklich den Grad der Grausamkeit. Die gewählte Formulierung vermeidet eine unnötige Verstärkung.
- issue: Logisches Verhältnis im letzten Satzteil
  choice: „ohne dass euch jemand verfolgt“
  alternative: obwohl euch niemand verfolgt / und niemand verfolgt euch
  rationale: Das Hebräische verbindet die Aussagen schlicht mit וְ. Die gewählte Fassung drückt die Abwesenheit eines Verfolgers klar aus, ohne eine zeitliche Beziehung festzulegen; die konzessive Lesart bleibt als Alternative vermerkt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Angesicht“ ist bewusst als gehobene, aber verständliche Form gewählt, um die markante hebräische Bildsprache zu bewahren. Satzbau und Wortwahl bleiben ansonsten unmittelbar und gut vorlesbar.
