lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  choice: Und ihr werdet … essen
  rationale: Das Qal mit Präformativkonjugation und vorangestelltem Waw steht in der Abfolge der Bundesflüche. Das deutsche Futur gibt die hier vorherrschende Vorhersage angemessen wieder; „Und“ bewahrt die Verknüpfung mit dem Kontext.
- source_word: בְּשַׂר
  choice: das Fleisch
  rationale: „Fleisch“ entspricht בָּשָׂר unmittelbar und bewahrt die erschütternde Aussage, ohne sie durch eine kulinarische oder beschönigende Bezeichnung abzuschwächen.
- source_word: בְּנֵיכֶם
  choice: eurer Söhne
  rationale: Der maskuline Plural wird spezifisch als „Söhne“ wiedergegeben, da im folgenden Parallelglied ausdrücklich die Töchter genannt werden.
- source_word: וּבְשַׂר
  choice: und das Fleisch
  rationale: Die Wiederholung des Substantivs wird beibehalten, um Parallelismus, Nachdruck und Rhythmus des Hebräischen zu bewahren.
- source_word: בְּנֹתֵיכֶם
  choice: eurer Töchter
  rationale: Die direkte Wiedergabe erhält die ausdrückliche Paarung von Söhnen und Töchtern.
- source_word: תֹּאכֵלוּ
  choice: werdet ihr essen
  rationale: Das zweite finite Verb wird wie im Hebräischen ausdrücklich wiederholt. Die nachgestellte Wortfolge bewahrt den Parallelismus und setzt einen düsteren Nachdruck.
theological_decisions:
- issue: Wiedergabe der Kannibalismusankündigung innerhalb des Bundesfluchs
  choice: 'Direkte Vorhersage: „ihr werdet das Fleisch eurer Söhne essen …“'
  alternative: Eine abgeschwächte oder umschreibende Wiedergabe
  rationale: Der hebräische Text formuliert eine konkrete, erschütternde Fluchfolge. Die Übersetzung bewahrt diese Härte, ohne sie zu euphemisieren oder durch zusätzliche theologische Deutung zu erweitern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die bewusste Wiederholung von „Fleisch“ und „essen“ erhält die eindringliche Parallelstruktur des hebräischen Textes.
