translation:
  language: de
  text: Dann werde auch ich euch in grimmiger Feindschaft entgegengehen[a] und euch siebenfach für eure Sünden züchtigen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „euch im Grimm der Widersetzlichkeit entgegengehen“; קֶרִי ist in diesem Kapitel ein schwer zu deutender, wiederkehrender Ausdruck und kann auch „Widersetzlichkeit“ oder „Gegnerschaft“ bedeuten.'
    reason: lexical_alternative
  - marker: b
