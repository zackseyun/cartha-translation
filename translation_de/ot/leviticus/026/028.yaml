lexical_decisions:
- source_word: וְהָלַכְתִּי עִמָּכֶם
  choice: Dann werde ich euch … entgegengehen
  rationale: הלך bedeutet wörtlich „gehen“. „Entgegengehen“ bewahrt das Bewegungsbild und gibt zusammen mit עִם und קֶרִי den gegnerischen Beziehungssinn im Deutschen natürlich wieder.
- source_word: בַּחֲמַת קֶרִי
  choice: in grimmiger Feindseligkeit
  rationale: חֵמָה bezeichnet heftigen Zorn oder Grimm; קֶרִי ist ein schwieriger, in Levitikus 26 wiederkehrender Ausdruck für Widersetzlichkeit, Gegnerschaft oder Feindseligkeit. Die gewählte Formulierung ist verständlich und erhält die Intensität.
- source_word: וְיִסַּרְתִּי
  choice: werde … züchtigen
  rationale: יסר kann erziehen, zurechtweisen oder züchtigen bedeuten. „Züchtigen“ wahrt hier sowohl den disziplinierenden als auch den strafenden Ton der Bundeswarnung.
- source_word: אַף אֲנִי
  choice: ich selbst
  rationale: Die Wendung hebt den göttlichen Sprecher nachdrücklich hervor. „Ich selbst“ gibt diese Betonung in natürlichem Deutsch wieder.
- source_word: שֶׁבַע
  choice: siebenfach
  rationale: Die Kardinalzahl wird in diesem Abschnitt idiomatisch zur Bezeichnung einer siebenfach gesteigerten Züchtigung gebraucht.
- source_word: עַל חַטֹּאתֵיכֶם
  choice: für eure Sünden
  rationale: עַל bezeichnet hier den Grund der Züchtigung; „für eure Sünden“ gibt diesen Zusammenhang knapp und idiomatisch wieder.
theological_decisions:
- issue: Art der göttlichen Reaktion im Bundesfluch
  choice: Sowohl die gegnerische Haltung („in grimmiger Feindseligkeit entgegengehen“) als auch die disziplinierende Strafe („züchtigen“) bleiben erhalten.
  alternative: Den Vers ausschließlich mit allgemeinem „bestrafen“ wiedergeben oder die gegnerische Bildsprache zu bloßem Missfallen abschwächen.
  rationale: Der hebräische Text verbindet das relationale Gegenübertreten mit יסר, das Züchtigung und Zurechtweisung bezeichnen kann. Die Übersetzung legt sich daher weder auf rein vergeltende Strafe fest noch mildert sie die Härte der Warnung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Entgegengehen“ erhält das hebräische Bild des Gehens, ohne im Deutschen unnatürlich zu wirken; „züchtigen“ entspricht dem ernsten Kontext und bewahrt zugleich die mögliche disziplinierende Nuance.
