source:
  edition: WLC
  text: וְ/זָכַרְתִּ֥י לָ/הֶ֖ם בְּרִ֣ית רִאשֹׁנִ֑ים אֲשֶׁ֣ר הוֹצֵֽאתִי אֹתָ/ם֩ מֵ/אֶ֨רֶץ מִצְרַ֜יִם לְ/עֵינֵ֣י הַ/גּוֹיִ֗ם לִ/הְיֹ֥ת לָ/הֶ֛ם לֵ/אלֹהִ֖ים אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/045.yaml
  text: 'But I will remember for them the covenant with their forefathers, whom I brought out from the land of Egypt in the sight of the nations, to be their God: I am Yahweh.'
translation:
  language: de
  text: Doch ich werde für sie an den Bund mit den Vorfahren[a] denken, die ich vor den Augen der Völker aus dem Land Ägypten herausgeführt habe, um ihr Gott zu sein. Ich bin Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „den Bund der Früheren“; die knappe hebräische Formulierung bezieht sich wahrscheinlich auf die Menschen früherer Generationen, die Gott aus Ägypten herausführte.'
    reason: Die Fußnote gibt die hebräische Konstruktion ohne ergänztes „mit“ genauer wieder und wahrt zugleich die verbleibende Auslegungsnuance.
lexical_decisions:
- source_word: וְזָכַרְתִּי
  choice: Doch ich werde … denken
  rationale: Das Präfix וְ kann mit „und“ wiedergegeben werden; im Zusammenhang markiert es jedoch eine Gegenbewegung zu Gericht und Verwerfung. „Doch“ bildet diesen Kontrast natürlich ab. זכר mit בְּרִית wird im Deutschen idiomatisch als „an den Bund denken“ ausgedrückt.
- source_word: לָהֶם
  choice: für sie
  rationale: Die Präposition ל wird bewahrt und zeigt, dass dieses Gedenken ihnen zugutekommt.
- source_word: בְּרִית רִאשֹׁנִים
  choice: den Bund mit den Vorfahren
  rationale: רִאשֹׁנִים ist ein substantiviertes maskulines Pluraladjektiv („die Früheren“). Der folgende Relativsatz bezeichnet diese als die aus Ägypten Herausgeführten; „Vorfahren“ gibt den generationellen Bezug verständlich wieder, ohne ihn auf einzelne Stammväter einzuengen.
- source_word: אֲשֶׁר הוֹצֵאתִי אֹתָם
  choice: die ich … herausgeführt habe
  rationale: Der Relativsatz bezieht sich am natürlichsten auf die zuvor genannten Menschen, nicht auf den Bund.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: aus dem Land Ägypten
  rationale: Bewahrt die feierliche Exodusformel und die ausdrückliche Nennung des Landes.
- source_word: לְעֵינֵי הַגּוֹיִם
  choice: vor den Augen der Völker
  rationale: Nahe Wiedergabe des hebräischen Bildes; sie betont, dass der Exodus öffentlich vor den Völkern geschah.
- source_word: לִהְיֹת לָהֶם לֵאלֹהִים
  choice: um ihr Gott zu sein
  rationale: Natürliche deutsche Wiedergabe der Bundesformel. Die finale Bedeutung des Infinitivs bleibt erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Bezug von בְּרִית רִאשֹׁנִים
  choice: der Bund mit den Vorfahren beziehungsweise den früheren Angehörigen Israels
  alternative: der frühere beziehungsweise erste Bund als abstrakte Bundesordnung
  rationale: Die hebräische Wendung ist knapp und ohne ausdrückliche Präposition zwischen „Bund“ und „Frühere“. Der anschließende Relativsatz „die ich … herausgeführt habe“ legt jedoch Personen als Bezug von רִאשֹׁנִים nahe. Die Fußnote bewahrt die wörtlichere Möglichkeit.
- issue: Reichweite von „Vorfahren“
  choice: generationeller Sammelbegriff ohne Festlegung allein auf die Erzväter
  alternative: spezifisch die Erzväter Abraham, Isaak und Jakob
  rationale: Der Relativsatz verweist unmittelbar auf Menschen, die aus Ägypten geführt wurden. Daher wird keine ausschließliche Identifikation mit den Erzvätern in den Text hineingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Doch“ macht den Kontrast im Zusammenhang sichtbar; „vor den Augen der Völker“ erhält das hebräische Bild. Der Satz wird vor der abschließenden Selbstvorstellung mit einem Punkt statt mit einem Doppelpunkt gegliedert, was im heutigen Deutschen natürlicher wirkt.
