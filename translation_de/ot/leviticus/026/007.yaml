  text: You will pursue your enemies[a], and they will fall before you by the sword.
translation:
  language: de
  text: Ihr werdet eure Feinde verfolgen, und sie werden vor euch durchs Schwert fallen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּרְדַפְתֶּם
  choice: Ihr werdet verfolgen
  rationale: רדף bedeutet gewöhnlich „verfolgen, nachjagen“. „Verfolgen“ ist im militärischen Zusammenhang natürlich und bewahrt die Aussageform des hebräischen Textes.
- source_word: אֹיְבֵיכֶם
  choice: eure Feinde
  rationale: אֹיֵב ist die übliche Bezeichnung für einen Feind; das angehängte Pronomen wird direkt mit „eure“ wiedergegeben.
- source_word: וְנָפְלוּ
  choice: und sie werden fallen
  rationale: נפל bedeutet wörtlich „fallen“ und kann im Kampf Niederlage oder Tod einschließen. „Fallen“ bewahrt das hebräische Bild, ohne es weiter auszudeuten.
- source_word: לִפְנֵיכֶם
  choice: vor euch
  rationale: לִפְנֵי mit Suffix bedeutet idiomatisch „vor“ beziehungsweise „in Gegenwart von“. „Vor euch“ passt klar zum militärischen Zusammenhang.
- source_word: לֶחָרֶב
  choice: durch das Schwert
  rationale: Die Präposition לְ bei חֶרֶב bezeichnet hier den Zusammenhang beziehungsweise das Mittel ihres Fallens. „Durch das Schwert“ ist im Deutschen verständlich und bildet die hebräische Wendung eng ab.
