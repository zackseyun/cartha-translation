  yaml_path: translation/ot/leviticus/026/040.yaml
  text: But if they confess their iniquity and the iniquity of their fathers[a], in the unfaithfulness by which they were unfaithful to me, and also that they walked contrary to me[b],
translation:
  language: de
  text: Dann werden sie ihre Schuld und die Schuld ihrer Väter bekennen, ihre Untreue, mit der sie mir gegenüber treulos gehandelt haben,[a] und auch, dass sie sich mir widersetzt haben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich mit nachdrücklicher Wiederholung derselben hebräischen Wortwurzel: „ihre Untreue, mit der sie mir gegenüber treulos gehandelt haben“. Gemeint sein können auch Treuebruch oder verräterisches Handeln.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dass sie mir feindlich entgegengetreten sind“. Das hier verwendete hebräische Wort ist schwer zu bestimmen und bezeichnet in diesem Kapitel wiederholt ein gegnerisches oder feindseliges Verhalten gegenüber Gott.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְוַדּוּ
  choice: Dann werden sie … bekennen
  rationale: Das Hitpael von ידה bezeichnet hier das Bekennen bzw. Eingestehen von Schuld. Das vorangestellte ו führt den Gedankengang aus dem vorherigen Vers fort; „Dann werden sie“ gibt diesen Zusammenhang wieder, ohne ein im Hebräischen nicht ausdrücklich vorhandenes „wenn“ einzufügen.
- source_word: עֲוֺנָם
  choice: ihre Schuld
  rationale: עָוֹן kann Vergehen, Schuld oder Schuldfolge bezeichnen. „Schuld“ umfasst hier sowohl das schuldhafte Handeln als auch die persönliche Verantwortlichkeit und klingt im heutigen Deutsch natürlicher als „Missetat“.
- source_word: עֲוֺן אֲבֹתָם
  choice: die Schuld ihrer Väter
  rationale: Die Genitivverbindung wird direkt wiedergegeben. „Väter“ bewahrt die ausdrücklich männliche Bezeichnung für die Vorfahren im hebräischen Text.
- source_word: בְּמַעֲלָם אֲשֶׁר מָעֲלוּ בִי
  choice: ihre Untreue, durch die sie mir untreu geworden sind
  rationale: Substantiv und Verb stammen von derselben Wurzel מעל und betonen den Treuebruch. Die deutsche Wiederholung „Untreue … untreu“ erhält diesen Nachdruck und den relationalen, bundestheologischen Sinn.
- source_word: וְאַף
  choice: und auch
  rationale: Die Wendung fügt dem Bekenntnis einen weiteren Gesichtspunkt hinzu, ohne die Aussage unnötig zu verstärken.
- source_word: הָלְכוּ עִמִּי בְּקֶרִי
  choice: dass sie sich mir widersetzt haben
  rationale: Wörtlich steht eine Verbindung aus „mit mir gehen“ und dem schwer bestimmbaren קֶרִי. „Sich mir widersetzen“ drückt die gegnerische Haltung in natürlichem Deutsch aus; die verbleibende Bedeutungsunsicherheit wird in der Fußnote kenntlich gemacht.
theological_decisions:
- issue: Gemeinschaftliches Bekenntnis unter Einschluss der Schuld der Väter
  choice: „die Schuld ihrer Väter“ bleibt uneingeschränkt im Haupttext stehen
  alternative: „die Sünden ihrer Vorfahren“ oder eine ausdrückliche Beschränkung auf deren Folgen
  rationale: Der hebräische Text stellt die eigene Schuld und die Schuld der Väter nebeneinander. Die Übersetzung bewahrt diese gemeinschaftliche und generationenübergreifende Dimension, ohne eine spätere dogmatische Erklärung über die Zurechnung von Schuld einzutragen.
- issue: Bedingung oder zeitliche Folgerung bei וְהִתְוַדּוּ
  choice: „Dann werden sie … bekennen“
  alternative: „Wenn sie … bekennen“ oder „Und sie werden … bekennen“
  rationale: Der Vers selbst enthält keine ausdrückliche Konditionalpartikel. „Dann“ wahrt den fortlaufenden Zusammenhang und lässt offen, wie die größere Satzfolge der Verse 39–42 syntaktisch genau zu gliedern ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Schuld“ ist allgemein verständlich und trägt das moralische Gewicht von עָוֹן. Die Wiederholung „Untreue … untreu“ ist bewusst beibehalten, um das hebräische Wortspiel und den Nachdruck des Treuebruchs hörbar zu machen.
