  text: וְ/אֶתְ/כֶם֙ אֱזָרֶ֣ה בַ/גּוֹיִ֔ם וַ/הֲרִיקֹתִ֥י אַחֲרֵי/כֶ֖ם חָ֑רֶב וְ/הָיְתָ֤ה אַרְצְ/כֶם֙ שְׁמָמָ֔ה וְ/עָרֵי/כֶ֖ם יִהְי֥וּ חָרְבָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/033.yaml
  text: And I will scatter you among the nations[a], and I will draw out the sword after you; and your land will become a desolation, and your cities will become ruins.
translation:
  language: de
  text: Und euch werde ich unter die Völker zerstreuen und das Schwert hinter euch her ziehen[a]. Euer Land wird zur Einöde werden und eure Städte zu Ruinen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Schwert hinter euch her aus der Scheide ziehen“.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: אֱזָרֶה
  choice: werde ich … zerstreuen
  rationale: Das Hifil von זרה bezeichnet hier das Zerstreuen oder Verstreuen. „Zerstreuen“ ist im Deutschen natürlich und bewahrt das Bild des Bundesgerichts.
- source_word: בַגּוֹיִם
  choice: unter die Völker
  rationale: גּוֹיִם bezeichnet Völker beziehungsweise Nationen. „Unter die Völker“ ist die geläufige deutsche Wendung für die Zerstreuung unter fremde Völker und vermeidet spätere Nebenbedeutungen von „Heiden“.
- source_word: וַהֲרִיקֹתִי ... חָרֶב
  choice: werde ich … das Schwert ziehen
  rationale: Die Verbindung von ריק mit חֶרֶב ist eine kriegerische Redewendung für das Ziehen beziehungsweise Zücken eines Schwertes. „Das Schwert ziehen“ gibt sie klar und bildhaft wieder.
- source_word: אַחֲרֵיכֶם
  choice: hinter euch
  rationale: Die Wendung bedeutet wörtlich „hinter euch“ oder „euch nach“. Im Zusammenhang drückt sie feindliche Verfolgung aus; die räumliche Formulierung bewahrt das konkrete hebräische Bild.
- source_word: שְׁמָמָה
  choice: Einöde
  rationale: Das Substantiv bezeichnet einen verwüsteten, verlassenen Zustand. „Zur Einöde werden“ wahrt die substantivische Form und den feierlich-ernsten Ton.
- source_word: חָרְבָּה
  choice: Ruinen
  rationale: Das Substantiv bezeichnet einen zerstörten oder verwüsteten Ort. Bei Städten ist „zu Ruinen“ eine natürliche und prägnante deutsche Wiedergabe.
- source_word: וְהָיְתָה ... יִהְיוּ
  choice: wird … werden / werden … zu
  rationale: 'היה hat hier einen resultativen Sinn: Land und Städte geraten in einen neuen Zustand. „Werden“ bringt diesen Übergang im modernen Deutsch deutlich zum Ausdruck.'
theological_decisions:
- issue: Bundesgericht in Gestalt von Zerstreuung und militärischer Verfolgung
  choice: 'Die direkte göttliche Urheberschaft bleibt erhalten: „werde ich … zerstreuen“ und „werde ich … das Schwert ziehen“.'
  alternative: Passive oder unpersönliche Formulierungen, die Gottes unmittelbares Handeln abschwächen.
  rationale: Der hebräische Text schreibt diese Bundesflüche ausdrücklich dem Handeln Gottes zu. Diese theologische Spannung darf nicht abgemildert werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, wird aber durch zwei Hauptsätze gut lesbar gestaltet. „Einöde“ und „Ruinen“ bewahren den feierlichen Gerichtston, ohne altertümlich zu wirken.
