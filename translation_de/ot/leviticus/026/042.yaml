  text: וְ/זָכַרְתִּ֖י אֶת בְּרִיתִ֣/י יַעֲק֑וֹב וְ/אַף֩ אֶת בְּרִיתִ֨/י יִצְחָ֜ק וְ/אַ֨ף אֶת בְּרִיתִ֧/י אַבְרָהָ֛ם אֶזְכֹּ֖ר וְ/הָ/אָ֥רֶץ אֶזְכֹּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/042.yaml
  text: Then I will remember my covenant with Jacob[a], and also my covenant with Isaac, and also my covenant with Abraham I will remember; and I will remember the land.
translation:
  language: de
  text: Dann werde ich meines Bundes mit Jakob[a] gedenken, auch meines Bundes mit Isaak; meines Bundes mit Abraham werde ich gedenken und auch des Landes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und ich werde gedenken.“ Das hebräische Bindewort kann schlicht mit „und“ wiedergegeben werden; „dann“ verdeutlicht den Zusammenhang mit dem vorausgehenden Kontext.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתִּי
  choice: Dann werde ich … gedenken
  rationale: זכר bezeichnet im Bundeskontext nicht bloßes Erinnern, sondern ein Gedenken mit Blick auf entsprechendes Handeln. „Dann“ gibt den Folgezusammenhang mit dem vorausgehenden Kontext natürlich wieder; die wörtlichere Alternative „Und“ wird in der Fußnote bewahrt.
- source_word: בְּרִיתִי
  choice: meines Bundes
  rationale: בְּרִית ist der feste biblische Ausdruck für eine bindende Bundesbeziehung. Die Genitivkonstruktion mit „gedenken“ ist im Deutschen würdig und erhält den theologischen Fachbegriff „Bund“.
- source_word: יַעֲקֹב
  choice: Jakob
  rationale: Wiedergabe des Personennamens in der üblichen deutschen Form.
- source_word: וְאַף
  choice: und auch
  rationale: Die Formulierung erhält sowohl die verbindende als auch die hinzufügende und leicht verstärkende Funktion von וְאַף, ohne unnötig schwer zu klingen.
- source_word: יִצְחָק
  choice: Isaak
  rationale: Wiedergabe des Personennamens in der üblichen deutschen Form.
- source_word: אַבְרָהָם
  choice: Abraham
  rationale: Wiedergabe des Personennamens in der üblichen deutschen Form.
- source_word: אֶזְכֹּר
  choice: werde ich gedenken
  rationale: Das wiederholte finite Verb wird nicht geglättet, da seine Wiederholung Abraham und anschließend das Land rhetorisch hervorhebt.
- source_word: וְהָאָרֶץ
  choice: und des Landes
  rationale: אֶרֶץ bezeichnet hier im Bundeskontext das verheißene Land. Der Genitiv folgt der deutschen Rektion von „gedenken“.
theological_decisions:
- issue: Reihenfolge und Hervorhebung der Bundesschlüsse mit den Erzvätern
  choice: Die hebräische Reihenfolge Jakob, Isaak, Abraham sowie die dreimalige Zuordnung „meines Bundes“ werden beibehalten.
  alternative: Chronologische Umstellung zu Abraham, Isaak und Jakob oder Zusammenfassung als „des Bundes mit Abraham, Isaak und Jakob“.
  rationale: Die umgekehrte Reihenfolge und die Wiederholung sind im Hebräischen auffällig und rhetorisch bedeutsam. Eine Glättung würde eine geläufige Formel eintragen, die so nicht im Vers steht.
- issue: Bedeutung des göttlichen Gedenkens
  choice: „gedenken“ ohne erklärende Erweiterung
  alternative: „mich erinnern und danach handeln“ oder „erneuern“
  rationale: Göttliches Gedenken schließt im Bundeskontext die Hinwendung zum Handeln ein; der Ausgangstext formuliert dies jedoch nicht ausdrücklich. Die knappe Wiedergabe bewahrt diese theologische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Gedenken“ ist gehobener als „sich erinnern“, passt jedoch zur feierlichen Bundessprache und ermöglicht die rhetorische Wiederholung des Hebräischen. Die Satzstellung bei Abraham und beim Land bewahrt deren Hervorhebung.
