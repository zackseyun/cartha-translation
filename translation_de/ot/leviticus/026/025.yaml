source:
  edition: WLC
  text: וְ/הֵבֵאתִ֨י עֲלֵי/כֶ֜ם חֶ֗רֶב נֹקֶ֨מֶת֙ נְקַם בְּרִ֔ית וְ/נֶאֱסַפְתֶּ֖ם אֶל עָרֵי/כֶ֑ם וְ/שִׁלַּ֤חְתִּי דֶ֨בֶר֙ בְּ/ת֣וֹכְ/כֶ֔ם וְ/נִתַּתֶּ֖ם בְּ/יַד אוֹיֵֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/025.yaml
  text: And I will bring against you a sword executing the vengeance of the covenant[a], and you will be gathered into your cities. Then I will send pestilence among you, and you will be given into the hand of the enemy.
translation:
  language: de
  text: Und ich werde ein Schwert gegen euch bringen, das die Rache des Bundes vollstreckt[a]. Ihr werdet in eure Städte getrieben werden; dann werde ich eine Seuche unter euch senden, und ihr werdet in die Hand des Feindes gegeben werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „das Rache für den Bund übt“, „das die Bundesrache vollstreckt“ oder freier: „das den Bund rächt“. Im Hebräischen steht eine emphatische Verbindung eines Partizips mit einem stammverwandten Substantiv, etwa: „ein Schwert, das Vergeltung übt – die Vergeltung des Bundes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתִי עֲלֵיכֶם חֶרֶב
  choice: Und ich werde ein Schwert gegen euch bringen
  rationale: Der Hifil von בוא bezeichnet das Herbeiführen; עַל hat im Gerichtskontext feindliche Bedeutung. Die deutsche Wendung bleibt nah am Bild des Hebräischen.
- source_word: נֹקֶמֶת נְקַם בְּרִית
  choice: das die Rache des Bundes vollstreckt
  rationale: Das Partizip mit dem stammverwandten Substantiv ist eine emphatische Fügung. „Vollstreckt“ gibt die wirksame Ausübung des Bundesgerichts natürlich wieder, während „Rache des Bundes“ die mehrdeutige Konstruktverbindung bewahrt.
- source_word: וְנֶאֱסַפְתֶּם אֶל עָרֵיכֶם
  choice: Ihr werdet euch in eure Städte zurückziehen
  rationale: Der Nifal von אסף kann hier reflexiv verstanden werden. Im Zusammenhang eines Schwertangriffs bezeichnet die Aussage das Zusammendrängen beziehungsweise Zurückziehen in die Städte; die deutsche Formulierung ist anschaulich und natürlich.
- source_word: וְשִׁלַּחְתִּי דֶבֶר בְּתוֹכְכֶם
  choice: dann werde ich die Pest unter euch ausbrechen lassen
  rationale: שׁלח bedeutet wörtlich „senden“, kann mit einer Seuche aber idiomatisch als deren Loslassen beziehungsweise Ausbrechenlassen wiedergegeben werden. דֶבֶר bezeichnet hier eine schwere epidemische Seuche.
- source_word: וְנִתַּתֶּם בְּיַד אוֹיֵב
  choice: und ihr werdet in die Hand des Feindes gegeben werden
  rationale: Die Passivform von נתן und das hebräische Machtidiom „in die Hand“ werden bewusst erhalten; der Singular „Feind“ entspricht dem Ausgangstext.
theological_decisions:
- issue: Bedeutung von „Rache des Bundes“
  choice: Die mehrdeutige Genitivverbindung bleibt als „Rache des Bundes“ erhalten.
  alternative: „Rache für den Bund“ oder „im Bund festgelegte Vergeltung“
  rationale: Der Bund kann als Grund, Bezugspunkt oder normativer Rahmen des Gerichts verstanden werden. Die Übersetzung legt keine dieser eng verwandten Nuancen exklusiv fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das traditionelle Gerichtsbild „in die Hand des Feindes gegeben“ bleibt erhalten; schwer verständliche Wörtlichkeit wird sonst behutsam idiomatisiert.
