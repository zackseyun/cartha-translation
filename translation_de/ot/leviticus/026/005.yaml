id: LEV.26.5
reference: Leviticus 26:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הִשִּׂ֨יג לָ/כֶ֥ם דַּ֨יִשׁ֙ אֶת בָּצִ֔יר וּ/בָצִ֖יר יַשִּׂ֣יג אֶת זָ֑רַע וַ/אֲכַלְתֶּ֤ם לַחְמְ/כֶם֙ לָ/שֹׂ֔בַע וִֽ/ישַׁבְתֶּ֥ם לָ/בֶ֖טַח בְּ/אַרְצְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/005.yaml
  text: Your threshing will last for you until the grape harvest, and the grape harvest will last until sowing; and you will eat your bread to the full and live securely in your land.
translation:
  language: de
  text: Eure Dreschzeit wird bis zur Weinlese reichen und die Weinlese bis zur Aussaat. Ihr werdet euch an eurem Brot satt essen und sicher in eurem Land wohnen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּיִשׁ
  choice: Dreschzeit
  rationale: Das Substantiv bezeichnet das Dreschen beziehungsweise die Zeit dieser landwirtschaftlichen Arbeit; im Zusammenhang mit den aufeinanderfolgenden Erntezeiten ist „Dreschzeit“ natürlich und präzise.
- source_word: בָּצִיר
  choice: Weinlese
  rationale: Bezeichnet die Traubenernte; „Weinlese“ ist die geläufige deutsche Entsprechung.
- source_word: זָרַע
  choice: Aussaat
  rationale: Das hier substantivisch gebrauchte Wort bezeichnet das Säen beziehungsweise die Saatzeit; „Aussaat“ passt zur zeitlichen Abfolge.
- source_word: לָשֹׂבַע
  choice: satt
  rationale: Die Wendung bedeutet, bis zur Sättigung zu essen; „sich satt essen“ gibt dies idiomatisch wieder.
- source_word: וִישַׁבְתֶּם לָבֶטַח
  choice: sicher … wohnen
  rationale: יָשַׁב bedeutet hier „wohnen“, לָבֶטַח bezeichnet einen Zustand der Sicherheit; die Formulierung bewahrt sowohl die Sesshaftigkeit als auch die zugesagte Sicherheit.
theological_decisions:
- issue: Charakter der Verheißung
  choice: Die überreichen, ineinandergreifenden Erntezeiten und das sichere Wohnen werden als direkte Zusage wiedergegeben.
  alternative: Die Bilder verallgemeinernd als bloßen Wohlstand umschreiben.
  rationale: Der konkrete landwirtschaftliche Wortlaut trägt die Bundesthematik des Kontextes und sollte nicht abstrahiert werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer landwirtschaftlicher Bildsprache. Das idiomatische „wird … reichen“ bildet הִשִּׂיג … אֶת als zeitliches Heranreichen ab; das im Hebräischen stehende לָכֶם wird durch den Bezug auf „eure Dreschzeit“ natürlich mitgetragen.
