  text: וַ/הֲשִׁמֹּתִ֥י אֲנִ֖י אֶת הָ/אָ֑רֶץ וְ/שָֽׁמְמ֤וּ עָלֶ֨י/הָ֙ אֹֽיְבֵי/כֶ֔ם הַ/יֹּשְׁבִ֖ים בָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/032.yaml
  text: And I myself will lay the land waste[a], and your enemies who dwell in it will be appalled at it.
translation:
  language: de
  text: Ich selbst werde das Land verwüsten, und eure Feinde, die darin wohnen, werden sich darüber entsetzen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »werden darüber erstaunt sein« oder »werden darüber bestürzt sein«. Das hebräische Verb kann erschrockenes Staunen oder Entsetzen angesichts einer Verwüstung ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲשִׁמֹּתִי
  choice: werde … verwüsten
  rationale: Die Kausativform von שׁמם bezeichnet das Verödenlassen oder Verwüsten. »Verwüsten« gibt die verursachende Bedeutung im Deutschen natürlich und prägnant wieder.
- source_word: אֲנִי
  choice: ich selbst
  rationale: Das selbstständige Pronomen verstärkt das bereits in der Verbform enthaltene Subjekt und betont, dass der HERR selbst dieses Gericht vollzieht.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Im Zusammenhang der Bundesflüche ist das Israel verheißene Land gemeint, nicht die ganze Erde.
- source_word: וְשָׁמְמוּ
  choice: werden sich … entsetzen
  rationale: Die Grundform von שׁמם kann hier die erschrockene oder entsetzte Reaktion der im verwüsteten Land wohnenden Feinde ausdrücken. Die Wendung bewahrt zugleich die semantische Nähe zur Verwüstung.
- source_word: עָלֶיהָ
  choice: darüber
  rationale: עַל bezeichnet mit שׁמם den Anlass beziehungsweise Gegenstand des Entsetzens; »darüber« ist dafür eine natürliche deutsche Wiedergabe.
- source_word: אֹיְבֵיכֶם
  choice: eure Feinde
  rationale: Direkte Wiedergabe der Possessivverbindung.
- source_word: הַיֹּשְׁבִים בָּהּ
  choice: die darin wohnen
  rationale: Das Partizip von ישׁב bezeichnet hier den dauernden Aufenthalt im Land. »Darin wohnen« ist sachlich und im modernen Standarddeutsch gut verständlich.
theological_decisions:
- issue: Bezug von הָאָרֶץ im Zusammenhang des Bundesgerichts
  choice: das Land
  alternative: die Erde
  rationale: Der unmittelbare Zusammenhang handelt von den Bundesflüchen über Israels Land. »Das Land« vermeidet eine nicht vom Kontext geforderte Ausweitung auf die ganze Erde.
- issue: Bedeutung von וְשָׁמְמוּ bei den Feinden als Subjekt
  choice: sie werden sich entsetzen
  alternative: sie werden erstarren / sie werden verwüstet sein
  rationale: Da die Feinde im verwüsteten Land wohnen, liegt ihre bestürzte Reaktion auf dessen Zustand nahe. Die Fußnote hält die weitere Bedeutungsbreite des hebräischen Verbs offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die emphatische Subjektsetzung wird mit »ich selbst« erhalten; die beiden mit וְ verbundenen Aussagen bleiben durch »und« koordiniert, ohne zusätzlich ein Zweck- oder Folgeverhältnis einzutragen.
