  text: And I will turn toward you and make you fruitful and multiply you[a], and I will establish my covenant with you.
translation:
  language: de
  text: Ich werde mich euch zuwenden und euch fruchtbar machen und euch zahlreich machen; ich werde meinen Bund mit euch bestätigen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meinen Bund mit euch aufrichten“ oder „etablieren“. Das hebräische Verb kann bei einem Bund dessen Aufrichtung oder Bestätigung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָנִיתִי אֲלֵיכֶם
  choice: Ich werde mich euch zuwenden
  rationale: Die Wendung bewahrt das konkrete Bild des hebräischen פנה mit Richtungsangabe. Im Zusammenhang der Segensverheißung schwingt Gottes wohlwollende Zuwendung mit, ohne dass diese Deutung den Wortlaut ersetzt.
- source_word: וְהִפְרֵיתִי אֶתְכֶם
  choice: euch fruchtbar machen
  rationale: Der Hifil von פרה ist kausativ und bezeichnet, dass Gott dem Volk Fruchtbarkeit verleiht. Die Formulierung bewahrt zugleich den vertrauten Sprachklang der biblischen Segensverheißungen.
- source_word: וְהִרְבֵּיתִי אֶתְכֶם
  choice: euch zahlreich machen
  rationale: Der Hifil von רבה bedeutet, jemanden zu vermehren beziehungsweise zahlreich zu machen. Im modernen Deutschen ist „zahlreich machen“ hier natürlicher und eindeutiger als „euch mehren“.
- source_word: וַהֲקִימֹתִי אֶת־בְּרִיתִי אִתְּכֶם
  choice: ich werde meinen Bund mit euch aufrichten
  rationale: קום im Hifil kann in Verbindung mit בְּרִית das Aufrichten, Bestätigen oder Inkraftsetzen eines Bundes bezeichnen. „Aufrichten“ erhält die traditionelle Bundesformel und lässt offen, ob die Betonung auf Stiftung oder Bestätigung liegt.
theological_decisions:
- issue: Soll der wohlwollende Sinn von Gottes Zuwendung ausdrücklich formuliert werden?
  choice: Das konkrete Bild „mich euch zuwenden“ bleibt im Haupttext erhalten.
  alternative: „euch wohlwollend ansehen“
  rationale: Der Segenszusammenhang zeigt deutlich, dass die Zuwendung günstig ist; das Verb selbst bezeichnet jedoch zunächst das Sich-Zuwenden. Die Übersetzung bewahrt deshalb Bild und Bedeutungsweite.
- issue: Bedeutet das Aufrichten des Bundes hier dessen erstmalige Stiftung oder dessen Bestätigung?
  choice: „meinen Bund mit euch aufrichten“
  alternative: „meinen Bund mit euch bestätigen“
  rationale: Die hebräische Bundesformel kann je nach Zusammenhang Stiftung, Bestätigung oder Bestandssicherung bezeichnen. „Aufrichten“ legt sich nicht unnötig auf nur eine dieser Nuancen fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Kausativverben werden flüssig zusammengezogen, während das abschließende Bundeswort durch das Semikolon hervorgehoben wird. Der Fußnotenmarker steht unmittelbar nach dem betreffenden Satzteil.
