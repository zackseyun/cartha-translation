base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/037.yaml
  text: They will stumble over one another as if before a sword[a], though no one is pursuing[b]; and you will have no power to stand before your enemies.
translation:
  language: de
  text: Sie werden übereinander stolpern[a], als flöhen sie vor dem Schwert, obwohl niemand sie verfolgt; und ihr werdet vor euren Feinden nicht standhalten können.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ein Mann gegen seinen Bruder“; die Wendung beschreibt, dass sie in ihrer Panik gegeneinander stoßen und übereinander fallen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und ihr werdet vor euren Feinden keinen Bestand haben.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָשְׁלוּ
  choice: sie werden stolpern
  rationale: כשל bezeichnet hier ein Stolpern oder Straucheln. „Stolpern“ bewahrt das konkrete Bild der panischen Flucht.
- source_word: אִישׁ בְּאָחִיו
  choice: einer über den anderen
  rationale: Die wörtliche distributive Wendung „ein Mann an/gegen seinem Bruder“ beschreibt, wie die Menschen in ihrer Panik aneinandergeraten und übereinander stolpern.
- source_word: כְּמִפְּנֵי חֶרֶב
  choice: wie vor einem Schwert
  rationale: Die Wiedergabe bleibt bei der knappen Vergleichsform des Hebräischen und ergänzt das nur sinngemäß vorausgesetzte Fliehen nicht ausdrücklich.
- source_word: וְרֹדֵף אָיִן
  choice: obwohl niemand sie verfolgt
  rationale: Wörtlich heißt es „und kein Verfolger ist da“. „Obwohl“ macht den im Zusammenhang erkennbaren Gegensatz zum panischen Stolpern natürlich verständlich.
- source_word: וְלֹא תִהְיֶה לָכֶם תְּקוּמָה
  choice: ihr werdet … nicht standhalten können
  rationale: תְּקוּמָה kann Aufstehen, Bestand oder die Fähigkeit zum Widerstand bezeichnen. Im militärischen Zusammenhang geht es darum, vor den Feinden keinen Stand halten zu können.
- source_word: לִפְנֵי אֹיְבֵיכֶם
  choice: vor euren Feinden
  rationale: Die übliche Wiedergabe von לִפְנֵי bewahrt hier das Bild der unmittelbaren Konfrontation.
