source:
  edition: WLC
  text: וְ/אִם לֹ֥א תִשְׁמְע֖וּ לִ֑/י וְ/לֹ֣א תַעֲשׂ֔וּ אֵ֥ת כָּל הַ/מִּצְוֺ֖ת הָ/אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/014.yaml
  text: But if you do not listen to me and do not do all these commandments,[a]
translation:
  language: de
  text: Doch wenn ihr nicht auf mich hört[a] und nicht alle diese Gebote befolgt,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mir gehorcht“. Das hebräische Verb bezeichnet hier ein Hören, das Gehorsam einschließen kann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Doch wenn
  rationale: Die Verbindung leitet im Gegensatz zum vorhergehenden Segensabschnitt die Bedingung für die folgenden Fluchandrohungen ein. „Doch wenn“ gibt sowohl den Kontrast als auch die Bedingung natürlich wieder.
- source_word: לֹא תִשְׁמְעוּ לִי
  choice: ihr nicht auf mich hört
  rationale: שׁמע mit ל bezeichnet ein Hören auf jemanden und kann gehorsames Hören einschließen. „Auf mich hört“ bewahrt das hebräische Bild und lässt die Gehorsamskomponente anklingen, ohne sie mit dem folgenden Tun gleichzusetzen.
- source_word: וְלֹא תַעֲשׂוּ
  choice: und nicht … befolgt
  rationale: עשה bedeutet grundsätzlich „tun“. Im Deutschen verbindet sich „Gebote tun“ jedoch unnatürlich; „Gebote befolgen“ gibt die konkrete Ausführung im rechtlichen Zusammenhang idiomatisch und präzise wieder.
- source_word: אֵת כָּל הַמִּצְוֺת הָאֵלֶּה
  choice: alle diese Gebote
  rationale: כָּל bezeichnet die Gesamtheit, מִצְוֺת konkrete Gebote und הָאֵלֶּה verweist auf die zuvor genannten Weisungen. „Alle diese Gebote“ entspricht dem Wortlaut und dem bundesrechtlichen Register.
theological_decisions:
- issue: Ob שׁמע ל ausdrücklich als „gehorchen“ oder bildnäher als „auf jemanden hören“ wiederzugeben ist
  choice: auf mich hört
  alternative: mir gehorcht
  rationale: Das Hebräische kann gehorsames Hören meinen, formuliert aber zunächst mit dem Verb „hören“. Da der zweite Satzteil die Ausführung der Gebote eigens nennt, wahrt „auf mich hört“ die Unterscheidung zwischen Hören und Tun sowie die vorhandene Bedeutungsbreite.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Doch wenn“ markiert den scharfen Übergang vom Segen zur Warnung. Der abschließende Beistrich bleibt stehen, weil Vers 14 den Bedingungssatz eröffnet, dessen Folgesatz erst in Vers 16 einsetzt.
