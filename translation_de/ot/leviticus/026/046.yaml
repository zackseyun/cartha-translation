  text: אֵ֠לֶּה הַֽ/חֻקִּ֣ים וְ/הַ/מִּשְׁפָּטִים֮ וְ/הַ/תּוֹרֹת֒ אֲשֶׁר֙ נָתַ֣ן יְהוָ֔ה בֵּינ֕/וֹ וּ/בֵ֖ין בְּנֵ֣י יִשְׂרָאֵ֑ל בְּ/הַ֥ר סִינַ֖י בְּ/יַד מֹשֶֽׁה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/046.yaml
  text: These are the statutes and the judgments and the laws that Yahweh gave between himself and the sons of Israel at Mount Sinai by the hand of Moses[a][b].
translation:
  language: de
  text: Dies sind die Satzungen, die Rechtsbestimmungen und die Weisungen, die Jahwe zwischen sich und den Israeliten[a] auf dem Berg Sinai durch Mose[b] gegeben hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „den Söhnen Israels“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „durch die Hand Moses“; eine hebräische Formel für Vermittlung durch Mose.'
    reason: cultural_note
lexical_decisions:
- source_word: אֵלֶּה
  choice: Dies sind
  rationale: Die natürliche deutsche Einleitung einer abschließenden Zusammenfassung.
- source_word: הַחֻקִּים
  choice: die Satzungen
  rationale: Bewahrt den rechtlich-bundestheologischen Sinn festgesetzter Vorschriften.
- source_word: הַמִּשְׁפָּטִים
  choice: die Rechtsbestimmungen
  rationale: Gibt den juristischen Gehalt von מִשְׁפָּט im Deutschen klarer wieder als das mehrdeutige „Urteile“.
- source_word: הַתּוֹרֹת
  choice: die Weisungen
  rationale: Der Plural bezeichnet autoritative Unterweisungen beziehungsweise Einzelgesetze; „Weisungen“ bewahrt die größere Bedeutungsbreite von תּוֹרָה.
- source_word: אֲשֶׁר נָתַן
  choice: die ... gegeben hat
  rationale: Entspricht unmittelbar dem Verb נָתַן und vermeidet eine interpretierende Erweiterung zu „festgesetzt“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: בֵּינוֹ וּבֵין בְּנֵי יִשְׂרָאֵל
  choice: zwischen sich und den Israeliten
  rationale: „Israeliten“ ist im modernen Deutsch die natürliche kollektive Wiedergabe der ethnischen Bezeichnung „Söhne Israels“; „zwischen sich und“ wahrt die relationale Bundesformulierung.
- source_word: בְּהַר סִינַי
  choice: auf dem Berg Sinai
  rationale: Die Präposition בְּ kann hier den Ort bezeichnen; „auf dem Berg Sinai“ ist präzise und idiomatisch.
- source_word: בְּיַד מֹשֶׁה
  choice: durch Mose
  rationale: Gibt die hebräische Vermittlungsformel idiomatisch wieder; die wörtliche Bildsprache wird in der Fußnote dokumentiert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen; „Jahwe“ bewahrt dies, ohne ihn durch einen traditionellen Titel zu ersetzen.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: Die feste hebräische Volksbezeichnung umfasst Israel als Gemeinschaft. Die idiomatische deutsche Wiedergabe vermeidet, die Aussage unnötig auf männliche Personen einzuengen; die Form des Hebräischen bleibt in der Fußnote sichtbar.
- issue: Verhältnisformel „zwischen ... und ...“
  choice: zwischen sich und den Israeliten gegeben
  alternative: für sich und die Israeliten gegeben
  rationale: Die ungewöhnliche Formulierung wird erhalten, weil sie das Bundesverhältnis markieren kann; sie wird nicht stillschweigend zu einer bloßen Empfängerangabe umgedeutet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die juristische Dreierreihe wird differenziert wiedergegeben, ohne die Bedeutungsfelder vollständig gleichzusetzen. Der hebräische Vermittlungsidiom wird im Haupttext natürlich formuliert und in der Fußnote offengelegt.
