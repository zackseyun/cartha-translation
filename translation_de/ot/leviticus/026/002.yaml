  text: You shall keep my Sabbaths and revere my sanctuary[a]; I am Yahweh.
translation:
  language: de
  text: Haltet meine Sabbate und habt Ehrfurcht vor meinem Heiligtum[a]. Ich bin Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „fürchtet mein Heiligtum“ oder „steht in ehrfürchtigem Staunen vor meinem Heiligtum“. Das hebräische Verb kann je nach Zusammenhang Furcht, Ehrfurcht oder Staunen ausdrücken.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: שַׁבְּתֹתַי
  choice: meine Sabbate
  rationale: Der hebräische Plural mit Suffix der ersten Person Singular wird direkt wiedergegeben. „Sabbate“ bewahrt die mögliche Breite der von Jahwe bestimmten Ruhe- und Festzeiten.
- source_word: תִּשְׁמֹרוּ
  choice: Haltet
  rationale: שׁמר bezeichnet bei Geboten und heiligen Zeiten ein achtsames Einhalten oder Beachten. „Haltet“ ist knapp, natürlich und entspricht der deutschen Wendung „den Sabbat halten“.
- source_word: וּמִקְדָּשִׁי
  choice: und … vor meinem Heiligtum
  rationale: מִקְדָּשׁ bezeichnet einen geheiligten Ort beziehungsweise ein Heiligtum. Die Präposition „vor“ ist im Deutschen erforderlich, weil „Ehrfurcht haben“ anders konstruiert wird als das hebräische Verb.
- source_word: תִּירָאוּ
  choice: habt Ehrfurcht
  rationale: ירא kann Furcht, Ehrfurcht oder ehrfürchtiges Erschauern ausdrücken. Im Bezug auf das Heiligtum vermittelt „Ehrfurcht haben“ heiligen Respekt, ohne die mögliche Bedeutungsnähe zu Furcht ganz zu verdecken.
- source_word: אֲנִי יְהוָה
  choice: Ich bin Jahwe
  rationale: Die Bundesformel wird als ausdrückliche Selbstidentifikation wiedergegeben; der Gottesname יהוה erscheint als „Jahwe“ und wird nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext nennt den Gottesnamen unmittelbar. „Jahwe“ bewahrt ihn als persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von ירא in Bezug auf das Heiligtum
  choice: habt Ehrfurcht vor
  alternative: fürchtet; steht in Ehrfurcht vor
  rationale: Die Formulierung drückt die gebotene heilige Achtung aus. Eine Fußnote bewahrt die echte Spannweite zwischen Furcht, Ehrfurcht und ehrfürchtigem Erschauern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der knappe imperativische Parallelismus und die abschließende Bundesformel bleiben erhalten. „Sabbate“ bewahrt den Plural des Hebräischen; „Heiligtum“ ist der geläufige kultische Ausdruck.
