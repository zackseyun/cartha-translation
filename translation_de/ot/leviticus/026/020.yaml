  text: וְ/תַ֥ם לָ/רִ֖יק כֹּחֲ/כֶ֑ם וְ/לֹֽא תִתֵּ֤ן אַרְצְ/כֶם֙ אֶת יְבוּלָ֔/הּ וְ/עֵ֣ץ הָ/אָ֔רֶץ לֹ֥א יִתֵּ֖ן פִּרְיֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/020.yaml
  text: Your strength will be spent in vain[a], and your land will not yield its produce, and the trees of the land will not yield their fruit.
translation:
  language: de
  text: Eure Kraft wird sich vergeblich erschöpfen,[a] und euer Land wird seinen Ertrag nicht hervorbringen, und die Bäume des Landes werden ihre Früchte nicht tragen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, formaler: »Eure Kraft wird sich ins Leere erschöpfen.« Hebräisch steht anschließend im kollektiven Singular: »Der Baum des Landes wird seine Frucht nicht geben.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתַם
  choice: wird sich verzehren
  rationale: תמם bezeichnet hier, dass die Kraft vollständig aufgebraucht wird. „Sich verzehren“ gibt den fortschreitenden Verbrauch der Kraft in würdiger, verständlicher Sprache wieder.
- source_word: לָרִיק
  choice: vergeblich
  rationale: לריק drückt Zwecklosigkeit und ausbleibenden Erfolg aus. „Vergeblich“ ist die natürliche deutsche Entsprechung im Zusammenhang der Bundesflüche.
- source_word: כֹּחֲכֶם
  choice: eure Kraft
  rationale: כח bezeichnet Kraft oder Leistungsvermögen; im landwirtschaftlichen Zusammenhang ist „Kraft“ präzise und bewahrt das Bild erfolgloser Anstrengung.
- source_word: תִתֵּן
  choice: wird … hervorbringen / werden … tragen
  rationale: נתן bedeutet wörtlich „geben“. Bei Land und Ertrag ist „hervorbringen“, bei Bäumen und Früchten „tragen“ im Deutschen idiomatisch und erhält jeweils den landwirtschaftlichen Sinn.
- source_word: אַרְצְכֶם
  choice: euer Land
  rationale: ארץ bezeichnet hier das Land als bewirtschafteten Lebensraum Israels; „euer Land“ ist sachlich und natürlich.
- source_word: יְבוּלָהּ
  choice: seinen Ertrag
  rationale: יבול bezeichnet den Ertrag beziehungsweise die Erzeugnisse des Bodens. „Ertrag“ ist prägnant und passt zur Aussage über erfolglose Arbeit.
- source_word: וְעֵץ הָאָרֶץ
  choice: die Bäume des Landes
  rationale: Das formal singularische עץ wird hier kollektiv verstanden. Der deutsche Plural gibt diesen kollektiven Sinn natürlich wieder.
- source_word: פִּרְיוֹ
  choice: ihre Früchte
  rationale: Das hebräische Singularsuffix stimmt mit dem kollektiven Singular עץ überein. Nach der natürlichen deutschen Wiedergabe „die Bäume“ werden Numerus und Pronomen entsprechend angepasst; der Plural „Früchte“ ist im Deutschen idiomatisch.
