source:
  edition: WLC
  text: וְ/הַ/נִּשְׁאָרִ֣ים בָּ/כֶ֔ם וְ/הֵבֵ֤אתִי מֹ֨רֶךְ֙ בִּ/לְבָבָ֔/ם בְּ/אַרְצֹ֖ת אֹיְבֵי/הֶ֑ם וְ/רָדַ֣ף אֹתָ֗/ם ק֚וֹל עָלֶ֣ה נִדָּ֔ף וְ/נָס֧וּ מְנֻֽסַת חֶ֛רֶב וְ/נָפְל֖וּ וְ/אֵ֥ין רֹדֵֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/036.yaml
  text: As for those of you who remain, I will bring faintness into their hearts in the lands of their enemies, and the sound of a driven leaf will pursue them; they will flee as one flees from the sword, and they will fall when no one is pursuing.
translation:
  language: de
  text: Den Übriggebliebenen unter euch werde ich in den Ländern ihrer Feinde Verzagtheit in ihre Herzen legen. Das Geräusch eines verwehten Blattes[a] wird sie verfolgen; sie werden fliehen, als flöhen sie vor dem Schwert, und fallen, und niemand verfolgt sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eines fortgetriebenen Blattes“.'
    reason: Das hebräische נִדָּף kann „verweht“ oder allgemeiner „fortgetrieben“ bedeuten; der antreibende Wind wird nicht ausdrücklich genannt.
lexical_decisions:
- source_word: הַנִּשְׁאָרִים בָּכֶם
  choice: die Übriggebliebenen unter euch
  rationale: Das Partizip bezeichnet diejenigen, die nach dem Gericht übrig bleiben; „unter euch“ bewahrt den Bezug auf die angesprochene Gemeinschaft.
- source_word: וְהֵבֵאתִי מֹרֶךְ בִּלְבָבָם
  choice: werde ich … Verzagtheit ins Herz bringen
  rationale: Die Hifilform von בוא bezeichnet Gottes verursachendes Handeln. מֹרֶךְ meint ein Schwinden von Mut oder innerer Festigkeit; „Verzagtheit“ gibt dies würdig und verständlich wieder. Der kollektive Singular „Herz“ bleibt erhalten.
- source_word: בְּאַרְצֹת אֹיְבֵיהֶם
  choice: in den Ländern ihrer Feinde
  rationale: Der Plural „Länder“ entspricht dem Hebräischen und lässt die Zerstreuung in mehreren feindlichen Gebieten erkennen.
- source_word: קוֹל עָלֶה נִדָּף
  choice: das Geräusch eines verwehten Blattes
  rationale: קוֹל bezeichnet hier ein hörbares Geräusch; נִדָּף beschreibt das Blatt als fortgetrieben oder verweht, ohne den Wind ausdrücklich als Handelnden zu nennen.
- source_word: וְרָדַף אֹתָם
  choice: wird sie verfolgen
  rationale: 'Die personifizierende Aussage wird direkt bewahrt: Schon ein unbedeutendes Geräusch erscheint den Verängstigten als Verfolger.'
- source_word: וְנָסוּ מְנֻסַת חֶרֶב
  choice: sie werden fliehen, wie man vor dem Schwert flieht
  rationale: Die konstruktionsbedingte Angabe der Art und Weise wird als Vergleich verständlich wiedergegeben, ohne eine tatsächlich anwesende Streitmacht vorauszusetzen.
- source_word: וְנָפְלוּ וְאֵין רֹדֵף
  choice: und fallen, obwohl niemand sie verfolgt
  rationale: „Fallen“ bewahrt die knappe und mehrdeutige Aussage von נפל; „obwohl“ hebt den ausdrücklichen Gegensatz zur Abwesenheit eines wirklichen Verfolgers hervor.
theological_decisions:
- issue: Art des angekündigten Gerichts
  choice: Von Gott bewirkte innere Verzagtheit und panische Flucht im Exil
  alternative: Nur eine äußere militärische Verfolgung oder lediglich bildhafte Unruhe
  rationale: Der Vers schreibt Gott ausdrücklich das Schwinden des Mutes zu und schildert danach eine unverhältnismäßige Flucht vor einem bloßen Geräusch. Die Übersetzung erhält sowohl Gottes Handeln als auch die psychische Erfahrung, ohne zusätzliche Lehrbegriffe einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Verzagtheit“ wahrt den Sinn innerer Mutlosigkeit, ohne ihn auf bloße Angst zu verengen. Der Satzbau bleibt bildhaft und eindringlich, wurde aber für heutige Leser in zwei Sätze gegliedert.
