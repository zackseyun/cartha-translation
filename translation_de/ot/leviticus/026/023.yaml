  text: וְ/אִ֨ם בְּ/אֵ֔לֶּה לֹ֥א תִוָּסְר֖וּ לִ֑/י וַ/הֲלַכְתֶּ֥ם עִמִּ֖/י קֶֽרִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/023.yaml
  text: And if by these things you are not corrected by me[a], but walk contrary to me,
translation:
  language: de
  text: Wenn ihr euch durch all dies nicht von mir zurechtweisen lasst und euch mir gegenüber feindselig verhaltet,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּאֵלֶּה
  choice: dadurch
  rationale: Die Präposition בְּ mit dem Demonstrativ verweist instrumental auf die zuvor genannten Strafgerichte. „Dadurch“ stellt diesen Rückbezug im Deutschen knapp und natürlich her.
- source_word: תִוָּסְרוּ
  choice: euch zurechtweisen lasst
  rationale: Der Nifal von יסר bezeichnet Züchtigung, Erziehung oder Zurechtweisung. Die reflexiv-passive Formulierung macht deutlich, dass die Maßnahmen erfolgt sind, die Angesprochenen sich durch sie aber nicht korrigieren lassen.
- source_word: לִי
  choice: von mir
  rationale: Das ל mit Suffix ist hier idiomatisch und kann die Beziehung zu Gott beziehungsweise den Urheber der Zurechtweisung bezeichnen. „Von mir“ passt zum passiven Sinn des Verbs; die formal nähere Möglichkeit „für mich“ bleibt in der Fußnote sichtbar.
- source_word: וַהֲלַכְתֶּם
  choice: sondern euch … verhaltet
  rationale: הלך bedeutet wörtlich „gehen“, bezeichnet hier aber die fortgesetzte Lebens- und Verhaltensweise. „Sondern“ gibt den adversativen Zusammenhang des Waw in der Bedingung wieder.
- source_word: עִמִּי קֶרִי
  choice: euch mir gegenüber feindselig verhaltet
  rationale: Die ungewöhnliche Verbindung aus „mit mir“ und קֶרִי beschreibt eine Haltung der Gegnerschaft oder Feindseligkeit. Die deutsche Wendung bewahrt den relationalen Gegensatz, ohne das seltene hebräische Idiom unverständlich wörtlich nachzubilden.
theological_decisions:
- issue: Wiedergabe der Bundesbeziehungsformel עִמִּי קֶרִי
  choice: euch mir gegenüber feindselig verhaltet
  alternative: mir zuwiderhandelt / in Gegnerschaft mit mir geht
  rationale: 'Die Formulierung bezeichnet mehr als einzelne Ungehorsamshandlungen: Sie beschreibt eine anhaltend gegnerische Haltung gegenüber Gott. „Feindselig“ wahrt diese Spannung, ohne sie durch eine konfessionell geprägte Deutung näher festzulegen.'
- issue: Bezug von לִי bei der Zurechtweisung
  choice: von mir
  alternative: für mich
  rationale: „Von mir“ versteht Gott als den hinter den Strafmaßnahmen stehenden Urheber und ergibt idiomatisches Deutsch. Da das לִי formal auch relational oder zielbezogen verstanden werden kann, wird „für mich“ als mögliche Lesart in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der unabgeschlossene Bedingungssatz endet entsprechend dem hebräischen Verszuschnitt mit einem Komma; der Gedanke wird im folgenden Vers fortgeführt.
