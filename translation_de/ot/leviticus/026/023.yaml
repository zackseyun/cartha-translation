  naturalness: „Durch all dies“ ist im heutigen Standarddeutsch als Rückverweis auf die vorher genannten Strafmaßnahmen klarer als das etwas unbestimmte „dadurch“. Die Formulierung „euch mir gegenüber feindselig verhaltet“ ist natürlich und angemessen würdig.
