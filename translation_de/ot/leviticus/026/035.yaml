base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/035.yaml
  text: All the days of its desolation it shall rest—the rest that it did not have during your Sabbaths[b][a], while you were dwelling on it.
translation:
  language: de
  text: Während all der Tage seiner Verwüstung wird das Land ruhen – die Ruhe, die es während eurer Sabbate[a] nicht hatte, als ihr darauf wohntet.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „euren Sabbaten“ sind hier im Zusammenhang besonders die Sabbatruhen gemeint, die dem Land zustanden.
    reason: cross_reference
  - marker: b
    text: 'Wörtlicher in der Satzstruktur: „Alle Tage seiner Verwüstung wird es ruhen, [das], was es während eurer Sabbate nicht ruhte, als ihr darauf wohntet.“ Im Hebräischen wird das Verb „ruhen“ wiederholt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל יְמֵי הָשַּׁמָּה
  choice: Solange es verwüstet daliegt
  rationale: Die Wendung bezeichnet umfassend die gesamte Zeit der Verwüstung. Die deutsche Formulierung gibt den temporalen Gesamtumfang natürlich wieder; das Pronomen bezieht sich auf das Land.
- source_word: תִּשְׁבֹּת
  choice: wird das Land ruhen
  rationale: Das feminine Verb bezieht sich auf das Land. „Ruhen“ wahrt die Wiederholung des hebräischen Verbs שׁבת und den Bezug zur Sabbatruhe.
- source_word: אֵת אֲשֶׁר לֹא שָׁבְתָה
  choice: die Ruhe, die es … nicht hatte
  rationale: אֵת אֲשֶׁר bezeichnet hier das, was das Land zuvor nicht als Ruhe erhielt. Die substantivische Ergänzung „die Ruhe“ ist im Deutschen idiomatisch und bewahrt das Wortspiel mit „ruhen“.
- source_word: בְּשַׁבְּתֹתֵיכֶם
  choice: an euren Sabbaten
  rationale: Die formnahe Wiedergabe lässt die ungewöhnliche Zuordnung „eure Sabbate“ stehen; der Kontext bezieht sie besonders auf die dem Land zustehenden Sabbatzeiten.
- source_word: בְּשִׁבְתְּכֶם עָלֶיהָ
  choice: als ihr darauf wohntet
  rationale: Der Infinitiv von ישׁב mit Suffix und עַל bezeichnet Israels Wohnen auf dem Land; die temporale Wiedergabe ist klar und natürlich.
theological_decisions:
- issue: Bezug der Sabbate
  choice: „eure Sabbate“ im Haupttext beibehalten und kontextuell erläutern
  alternative: „eure Sabbatjahre“
  rationale: Der hebräische Plural ist allgemein formuliert, während der Zusammenhang besonders die Ruhejahre des Landes meint. Die Übersetzung soll diese Spannung nicht durch eine engere Deutung im Haupttext auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Solange es verwüstet daliegt“ vermeidet die schwerfällige Wendung „alle Tage seiner Verwüstung“, während die Fußnote die formale Struktur dokumentiert. Beide Fußnotenmarker stehen im Haupttext.
