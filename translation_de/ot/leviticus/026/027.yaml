id: LEV.26.27
reference: Leviticus 26:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אִ֨ם בְּ/זֹ֔את לֹ֥א תִשְׁמְע֖וּ לִ֑/י וַ/הֲלַכְתֶּ֥ם עִמִּ֖/י בְּ/קֶֽרִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/027.yaml
  text: But if in spite of this you will not listen to me[a], and you walk contrary to me[b],
translation:
  language: de
  text: Doch wenn ihr trotz alledem[a] nicht auf mich hört und euch mir widersetzt[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „trotz all dessen“ oder „selbst dadurch nicht“.'
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Wendung lautet sinngemäß „mit mir in Widerstreben gehen“; das seltene Wort kann oppositionelles oder feindseliges Verhalten bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Doch wenn
  rationale: Leitet eine weitere Bedingungsstufe in der sich steigernden Bundeswarnung ein; „doch“ gibt den adversativen Fortgang wieder.
- source_word: בְּזֹאת
  choice: trotz alledem
  rationale: Bezieht sich rückblickend auf die zuvor genannten Züchtigungen und hat hier konzessive Bedeutung.
- source_word: לֹא תִשְׁמְעוּ לִי
  choice: nicht auf mich hört
  rationale: Bewahrt das hebräische Bild des Hörens; im Zusammenhang schließt es gehorsames Beachten ein.
- source_word: וַהֲלַכְתֶּם
  choice: euch … widersetzt
  rationale: Das Verb „gehen“ beschreibt zusammen mit der folgenden Wendung die Lebensführung beziehungsweise das Verhalten; eine wörtliche Wiedergabe wäre im modernen Deutschen unnatürlich.
- source_word: עִמִּי בְּקֶרִי
  choice: euch mir widersetzt
  rationale: Gibt die schwierige idiomatische Wendung als oppositionelles Verhalten gegenüber Gott wieder, ohne ihre Nuance unnötig auf offene Feindseligkeit festzulegen.
theological_decisions:
- issue: Bundeswarnungsformel in Levitikus 26
  choice: „euch mir widersetzt“ als relationale Oppositionsaussage
  alternative: „euch mir gegenüber feindselig verhaltet“ oder wörtlicher „mir in Widerstreben begegnet“
  rationale: Die Formulierung bezeichnet mehr als bloßen Ungehorsam, doch die genaue Nuance von קֶרִי ist umstritten. Die Übersetzung wahrt den Gedanken bewusster Gegenstellung, ohne ihn dogmatisch zuzuspitzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt als Konditionalsatz offen, da der Vers in den folgenden Vers hineinführt. Das idiomatische „Gehen“ wird im Haupttext natürlich wiedergegeben und in der Fußnote kenntlich gemacht.
