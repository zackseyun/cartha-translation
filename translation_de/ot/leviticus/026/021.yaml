base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/021.yaml
  text: And if you walk contrary to me and are not willing to listen to me[b][a], then I will continue to strike you sevenfold according to your sins.
translation:
  language: de
  text: Wenn ihr euch mir aber entgegenstellt[a] und nicht bereit seid, auf mich zu hören, dann werde ich euch weiterhin schlagen – siebenfach, euren Sünden entsprechend.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „euch mir gegenüber feindselig verhaltet“ / „mir zuwiderhandelt“. Die hebräische Wendung ist schwierig; in diesem Kapitel bezeichnet sie eine Haltung des Widerstands, nicht bloßen Zufall.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „Dann werde ich euch einen weiteren Schlag hinzufügen, sieben entsprechend euren Sünden.“ Die hebräische Satzfügung ist hier knapp und schwierig. Möglich ist auch: „siebenmal wegen eurer Sünden“.'
    reason: alternative_reading
lexical_decisions:
- source_word: קֶרִי
  choice: sich entgegenstellen
  rationale: Das seltene und schwierige Wort bezeichnet in der wiederkehrenden Wendung dieses Kapitels eine Haltung des Widerstands oder der Feindseligkeit. „Sich entgegenstellen“ gibt diesen Sinn verständlich wieder, ohne die umstrittene Herleitung des Wortes festzuschreiben.
- source_word: תֵּלְכוּ עִמִּי קֶרִי
  choice: ihr euch mir entgegenstellt
  rationale: „Gehen“ bezeichnet hier idiomatisch die Lebensführung. Eine wörtliche Wiedergabe wäre im Deutschen missverständlich; die gewählte Formulierung bewahrt den Gedanken fortgesetzten widerständigen Verhaltens.
- source_word: תֹאבוּ
  choice: nicht bereit seid
  rationale: Das Verb bezeichnet fehlende Bereitschaft oder Einwilligung und betont damit den willentlichen Charakter der Weigerung.
- source_word: לִשְׁמֹעַ לִי
  choice: auf mich zu hören
  rationale: Die Formulierung bewahrt das hebräische Bild des Hörens; der im Bundeszusammenhang mitschwingende Sinn des Gehorchens bleibt dabei erhalten, ohne ausdrücklich eingetragen zu werden.
- source_word: וְיָסַפְתִּי
  choice: weiterhin
  rationale: Das Verb bedeutet wörtlich „hinzufügen“. Im Zusammenhang der sich steigernden Strafankündigungen bezeichnet es weiteres, zusätzliches Schlagen.
- source_word: מַכָּה
  choice: schlagen
  rationale: Das Substantiv kann Schlag, Heimsuchung oder Plage bezeichnen. Die verbale Wiedergabe „schlagen“ ist im Deutschen natürlich und vermeidet eine unnötige Festlegung auf eine bestimmte Art der Strafe.
- source_word: שֶׁבַע
  choice: siebenfach
  rationale: Die Zahl wird in der Strafandrohung adverbial gebraucht und bezeichnet die gesteigerte beziehungsweise volle Intensität der angekündigten Strafe.
- source_word: כְּחַטֹּאתֵיכֶם
  choice: euren Sünden entsprechend
  rationale: Die Präposition כ bezeichnet hier am ehesten Entsprechung oder Verhältnis. Die Wiedergabe bewahrt diesen proportionalen Zug besser als das bloß kausale „wegen eurer Sünden“.
theological_decisions:
- issue: Art und Maß der Bundesstrafe
  choice: Die Aussage wird als Steigerung des göttlichen Gerichts wiedergegeben, die den Sünden Israels entspricht, ohne die konkrete Form der Strafe näher festzulegen.
  alternative: מַכָּה ausdrücklich als „Plage“ und כְּחַטֹּאתֵיכֶם rein kausal als „wegen eurer Sünden“ wiederzugeben.
  rationale: Der hebräische Wortlaut kündigt verschärftes Gericht an, lässt aber die genaue Art der Heimsuchung offen. „Euren Sünden entsprechend“ erhält zudem den möglichen Gedanken einer Entsprechung zwischen Schuld und Strafe.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die schwierige hebräische Wendung wird verständlich, aber nicht konfessionell zugespitzt wiedergegeben. Der Gedankenstrich hebt die siebenfache Steigerung hervor, ohne zusätzliche Deutung einzutragen.
