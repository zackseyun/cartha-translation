revisions:
- from: Die von euch übrig bleiben, werden in den Ländern eurer Feinde wegen ihrer Schuld dahinschwinden[a]. Und auch wegen der Verfehlungen ihrer Väter werden sie mit ihnen dahinschwinden[b].
  to: Diejenigen von euch, die übrig bleiben, werden wegen ihrer Schuld in den Ländern eurer Feinde dahinsiechen[a]. Auch wegen der Verfehlungen ihrer Väter, die mit ihnen sind, werden sie dahinsiechen[b].
  rationale: Die notwendige grammatische Korrektur am Satzanfang verbessert die Verständlichkeit. Die Stellung von „die mit ihnen sind“ folgt der naheliegenden syntaktischen Verbindung des hebräischen אִתָּם mit den Verfehlungen der Väter, während die Fußnote ausdrücklich die verbleibende Mehrdeutigkeit dokumentiert. Die Aussage über eigene Schuld und die Verfehlungen der Väter wird weder abgeschwächt noch theologisch aufgelöst.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T07:21:22Z'
