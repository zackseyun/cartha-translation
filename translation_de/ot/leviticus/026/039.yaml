base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/039.yaml
  text: And those of you who remain will waste away in the lands of your enemies because of their iniquity[b][a]; and also because of the iniquities of their fathers with them they will waste away.
translation:
  language: de
  text: Diejenigen von euch, die übrig bleiben, werden wegen ihrer Schuld in den Ländern eurer Feinde dahinsiechen[a]. Auch wegen der Verfehlungen ihrer Väter, die mit ihnen sind, werden sie dahinsiechen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werden vergehen“, „werden verfaulen“ oder „werden dahinschwinden“. Das hebräische Verb bezeichnet ein allmähliches Vergehen oder Zerfallen unter dem Gericht.'
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Wendung „mit ihnen“ ist in ihrer Zuordnung nicht eindeutig. Sie kann besagen, dass die Verfehlungen der Väter weiterhin bei ihnen sind, oder dass sie zusammen mit diesen fortwirkenden Verfehlungen dahinsiechen.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַנִּשְׁאָרִים בָּכֶם
  choice: Die von euch übrig bleiben
  rationale: Die substantivierte Partizipialform bezeichnet diejenigen, die nach dem Gericht übrig geblieben sind; בָּכֶם wird als „von euch“ in die natürliche deutsche Wendung aufgenommen.
- source_word: יִמַּקּוּ
  choice: werden dahinschwinden
  rationale: Das Nifal von מקק bezeichnet ein Vergehen, Zerfallen oder allmähliches Aufgeriebenwerden unter dem Gericht. „Dahinschwinden“ gibt diesen ernsten, fortschreitenden Vorgang in würdigem Gegenwartsdeutsch wieder.
- source_word: בַּעֲוֺנָם
  choice: wegen ihrer Schuld
  rationale: עָוֹן kann Verfehlung, Schuld und deren Folgen bezeichnen. Die kausale Wiedergabe mit „wegen“ passt zum Gerichtszusammenhang, ohne die persönliche Verantwortlichkeit abzuschwächen.
- source_word: בְּאַרְצֹת אֹיְבֵיכֶם
  choice: in den Ländern eurer Feinde
  rationale: „Ländern“ bewahrt den hebräischen Plural; „eurer Feinde“ erhält den Wechsel zur direkten Anrede in der zweiten Person Plural.
- source_word: וְאַף
  choice: Und auch
  rationale: Die Formulierung bewahrt die steigernd-additive Kraft der hebräischen Verbindung in natürlichem Deutsch.
- source_word: בַּעֲוֺנֹת אֲבֹתָם
  choice: wegen der Verfehlungen ihrer Väter
  rationale: Der Plural wird mit „Verfehlungen“ erhalten, und „Väter“ entspricht dem konkreten Generationenbezug von אֲבֹתָם.
- source_word: אִתָּם
  choice: mit ihnen
  rationale: Die knappe Wiedergabe erhält die Mehrdeutigkeit, ob die Verfehlungen der Väter bei den Übriggebliebenen sind oder ob diese zusammen mit jenen fortwirkenden Verfehlungen dahinschwinden.
theological_decisions:
- issue: Schuld und Gericht über Generationen hinweg
  choice: Sowohl die eigene Schuld der Übriggebliebenen als auch die Verfehlungen ihrer Väter werden als Gründe ihres Dahinschwindens genannt.
  alternative: Die Aussage ausschließlich als Folgen früherer Sünden oder ausschließlich als Wiederholung derselben Sünden zu deuten.
  rationale: Der hebräische Text stellt beide Größen nebeneinander und erklärt ihr Verhältnis nicht vollständig. Die Übersetzung bewahrt diese Spannung und löst sie nicht konfessionell oder systematisch auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Dahinschwinden“ wahrt das Bild eines allmählichen Vergehens, ohne altertümlich zu wirken. Die Wiederholung des Verbs und die Mehrdeutigkeit von „mit ihnen“ bleiben bewusst erhalten.
