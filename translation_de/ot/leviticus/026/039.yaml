  naturalness: „Die von euch übrig bleiben“ ist als substantivierte Konstruktion im modernen Standarddeutsch nicht vollständig; „Diejenigen von euch, die übrig bleiben“ ist klar und natürlich. Die Umstellung der zweiten Satzhälfte ermöglicht eine lesbare, zugleich eng am Hebräischen bleibende Wiedergabe.
  terminology: „Schuld“ für עָוֹן und „Verfehlungen“ für den pluralischen Ausdruck עֲוֺנֹת sind angemessen. „Dahinschwinden“ ist möglich; „dahinsiechen“ bildet den andauernden Verfall unter Gericht etwas konkreter ab, ohne die Alternative des Verfaulens auszuschließen. „Väter“ ist beizubehalten.
