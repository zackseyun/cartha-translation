  text: בְּ/שִׁבְרִ֣/י לָ/כֶם֮ מַטֵּה לֶחֶם֒ וְ֠/אָפוּ עֶ֣שֶׂר נָשִׁ֤ים לַחְמְ/כֶם֙ בְּ/תַנּ֣וּר אֶחָ֔ד וְ/הֵשִׁ֥יבוּ לַחְמְ/כֶ֖ם בַּ/מִּשְׁקָ֑ל וַ/אֲכַלְתֶּ֖ם וְ/לֹ֥א תִשְׂבָּֽעוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/026.yaml
  text: When I break your supply of bread[a], ten women will bake your bread in a single oven and return your bread by weight; and you will eat, but you will not be satisfied.
translation:
  language: de
  text: Wenn ich eure Brotversorgung[a] zunichtemache, werden zehn Frauen euer Brot in einem einzigen Ofen backen und euch euer Brot abgewogen zurückgeben. Ihr werdet essen, aber nicht satt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »den Stab des Brotes«. Eine hebräische Bildrede für die tragende Versorgung mit Brot.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשִׁבְרִי
  choice: Wenn ich … zerbreche
  rationale: Der Infinitiv mit בְּ bildet eine temporale Aussage. „Zerbrechen“ bewahrt das anschauliche Bild des hebräischen Verbs שׁבר.
- source_word: מַטֵּה לֶחֶם
  choice: die Stütze des Brotes
  rationale: Die ungewöhnliche Metapher bezeichnet das Brot als tragende Lebensgrundlage. Die relativ formnahe Wiedergabe bewahrt das Bild; die Fußnote erläutert den Sinn.
- source_word: עֶשֶׂר נָשִׁים
  choice: zehn Frauen
  rationale: Die ausdrücklich genannten Frauen bleiben erhalten und veranschaulichen die extreme Knappheit beim Brotbacken.
- source_word: בְּתַנּוּר אֶחָד
  choice: in einem einzigen Ofen
  rationale: „Einzigen“ hebt hervor, dass wegen des Mangels das Brot von zehn Haushalten in einen Ofen passt.
- source_word: וְהֵשִׁיבוּ לַחְמְכֶם בַּמִּשְׁקָל
  choice: euch das Brot abgewogen zurückgeben
  rationale: Das Hifil von שוב bezeichnet das Zurückgeben; „abgewogen“ gibt die durch Knappheit bedingte Rationierung natürlich wieder.
- source_word: וְלֹא תִשְׂבָּעוּ
  choice: aber nicht satt werden
  rationale: שׂבע bezeichnet im Zusammenhang mit Essen das Sattwerden. Diese Wiedergabe ist direkt und idiomatisch.
theological_decisions: []
