  text: אַף אֲנִ֞י אֶֽעֱשֶׂה זֹּ֣את לָ/כֶ֗ם וְ/הִפְקַדְתִּ֨י עֲלֵי/כֶ֤ם בֶּֽהָלָה֙ אֶת הַ/שַּׁחֶ֣פֶת וְ/אֶת הַ/קַּדַּ֔חַת מְכַלּ֥וֹת עֵינַ֖יִם וּ/מְדִיבֹ֣ת נָ֑פֶשׁ וּ/זְרַעְתֶּ֤ם לָ/רִיק֙ זַרְעֲ/כֶ֔ם וַ/אֲכָלֻ֖/הוּ אֹיְבֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/016.yaml
  text: 'I also will do this to you: I will appoint over you sudden terror[a], wasting disease and fever, consuming the eyes and draining the life; and you will sow your seed in vain[c][b], and your enemies will eat it.'
translation:
  language: de
  text: 'Auch ich werde euch Folgendes antun: Ich werde Schrecken über euch bringen[a] sowie eine auszehrende Krankheit[b] und Fieber. Diese werden eure Augen erlöschen und euer Leben dahinschwinden lassen[c]. Ihr werdet eure Saat vergeblich aussäen, und eure Feinde werden sie essen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ich werde jähen Schrecken über euch verhängen.« Das hebräische Verb kann das Auferlegen oder Herbeiführen eines Gerichts bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Der genaue Krankheitsbegriff ist unsicher; gemeint ist wahrscheinlich eine auszehrende Krankheit.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: »die Augen verzehren und das Leben dahinschwinden lassen«; die hebräische Wendung beschreibt versagende Augen und schwindende Lebenskraft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף אֲנִי
  choice: Auch ich
  rationale: Gibt die emphatische und fortführende Wendung wieder und bewahrt im Zusammenhang den Gedanken der entsprechenden Reaktion Gottes.
- source_word: אֶעֱשֶׂה זֹּאת לָכֶם
  choice: werde euch Folgendes antun
  rationale: Im Gerichtszusammenhang gibt „antun“ die gegen die Angesprochenen gerichtete Handlung natürlich und deutlich wieder.
- source_word: וְהִפְקַדְתִּי עֲלֵיכֶם
  choice: Ich werde … über euch bringen
  rationale: Das Hiphil von פקד kann hier das Auferlegen beziehungsweise Verhängen eines Gerichts bezeichnen; die deutsche Wendung ist idiomatisch, ohne die Bildlichkeit unnötig auszuweiten.
- source_word: בֶּהָלָה
  choice: Schrecken
  rationale: Bezeichnet jähen Schrecken oder Bestürzung. „Schrecken“ ist prägnant; die mögliche Nuance des Plötzlichen wird in der Fußnote genannt.
- source_word: הַשַּׁחֶפֶת
  choice: Schwindsucht
  rationale: Der genaue Krankheitsbegriff ist unsicher. „Schwindsucht“ bewahrt den Gedanken einer auszehrenden Krankheit, ohne sie mit Tuberkulose gleichzusetzen.
- source_word: הַקַּדַּחַת
  choice: Fieber
  rationale: Gibt die Vorstellung fieberhafter Hitze klar und in heutigem Deutsch wieder.
- source_word: מְכַלּוֹת עֵינַיִם
  choice: die die Augen erlöschen … lassen
  rationale: Bewahrt das drastische Bild des Aufhörens beziehungsweise Vergehens und ist im Deutschen verständlicher als eine wörtliche Rede vom „Verzehren“ der Augen.
- source_word: וּמְדִיבֹת נָפֶשׁ
  choice: das Leben dahinschwinden lassen
  rationale: נפש bezeichnet hier die lebendige Kraft beziehungsweise das Leben; die Formulierung vermeidet eine unnötige Festlegung auf eine immaterielle „Seele“.
- source_word: וּזְרַעְתֶּם לָרִיק זַרְעֲכֶם
  choice: Ihr werdet eure Saat vergeblich aussäen
  rationale: Gibt sowohl das Wortspiel mit der Wurzel זרע als auch die Erfolglosigkeit von לריק natürlich wieder.
- source_word: וַאֲכָלֻהוּ אֹיְבֵיכֶם
  choice: und eure Feinde werden sie essen
  rationale: Folgt der hebräischen Verbindung mit waw direkt. Das feminine Pronomen „sie“ bezieht sich im Deutschen auf „Saat“.
theological_decisions:
- issue: Bedeutung von נָפֶשׁ im Kontext des Bundesfluchs
  choice: Leben
  alternative: Seele
  rationale: Der Zusammenhang beschreibt körperliche Auszehrung und den Verlust von Lebenskraft. „Leben“ bewahrt diesen hebräischen Sinn, ohne spätere anthropologische Vorstellungen einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Gerichtssprache bleibt direkt und bildkräftig. Der schwierige Krankheitsbegriff und die beiden bildhaften Partizipialwendungen werden im Haupttext verständlich wiedergegeben und in Fußnoten transparent erläutert.
