id: LEV.26.15
reference: Leviticus 26:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אִם בְּ/חֻקֹּתַ֣/י תִּמְאָ֔סוּ וְ/אִ֥ם אֶת מִשְׁפָּטַ֖/י תִּגְעַ֣ל נַפְשְׁ/כֶ֑ם לְ/בִלְתִּ֤י עֲשׂוֹת֙ אֶת כָּל מִצְוֺתַ֔/י לְ/הַפְרְ/כֶ֖ם אֶת בְּרִיתִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/015.yaml
  text: and if you reject my statutes[a], and if your soul abhors my judgments, so that you do not do all my commandments, thereby breaking my covenant[c][b],
translation:
  language: de
  text: und wenn ihr meine Satzungen verwerft und euer Innerstes meine Rechtsbestimmungen verabscheut,[a] sodass ihr nicht alle meine Gebote befolgt und damit meinen Bund brecht,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „eure Seele meine Rechtsbestimmungen verabscheut“. נֶפֶשׁ kann hier auch das ganze Selbst beziehungsweise Wesen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „sodass ihr nicht alle meine Gebote befolgt, um meinen Bund zu verletzen“. Die hebräische Konstruktion kann sowohl Folge als auch Absicht ausdrücken.'
    reason: ambiguity
lexical_decisions:
- source_word: בְּחֻקֹּתַי
  choice: meine Satzungen
  rationale: „Satzungen“ bewahrt den rechtlich-bundestheologischen Ton von חֻקִּים und unterscheidet den Ausdruck von מִשְׁפָּטִים im folgenden Satzglied.
- source_word: תִּמְאָסוּ
  choice: verwerft
  rationale: מָאַס bezeichnet eine nachdrückliche, mit Geringschätzung verbundene Zurückweisung; „verwerft“ gibt dies in würdigem, verständlichem Deutsch wieder.
- source_word: מִשְׁפָּטַי
  choice: meine Rechtsbestimmungen
  rationale: מִשְׁפָּטִים bezeichnet hier verbindliche rechtliche Entscheidungen beziehungsweise Ordnungen. „Rechtsbestimmungen“ wahrt die juristische Nuance und bleibt von „Satzungen“ unterscheidbar.
- source_word: תִּגְעַל נַפְשְׁכֶם
  choice: euer Innerstes … verabscheut
  rationale: Das Hebräische macht נֶפֶשׁ zum Subjekt. „Euer Innerstes“ erhält diese ausdrückliche anthropologische und intensive Wendung, ohne im Deutschen eine technische Leib-Seele-Trennung nahezulegen.
- source_word: לְבִלְתִּי עֲשׂוֹת
  choice: sodass ihr nicht … befolgt
  rationale: Die Konstruktion kann Folge oder Absicht ausdrücken. „Sodass“ lässt die Beziehung als Folge anklingen; „befolgt“ ist bei Geboten natürlicher als das wörtliche „tut“.
- source_word: כָּל מִצְוֺתַי
  choice: alle meine Gebote
  rationale: מִצְוֹת bezeichnet verbindliche Gebote. Die traditionelle und allgemein verständliche Wiedergabe erhält den rechtlich-bundestheologischen Ton.
- source_word: לְהַפְרְכֶם
  choice: und damit … brecht
  rationale: Der Hifil von פרר bezeichnet das Aufheben, Verletzen oder Brechen des Bundes. „Damit … brecht“ verbindet den Ungehorsam folgerichtig mit dem Bundesbruch, ohne die mögliche Zwecknuance völlig auszuschließen.
- source_word: בְּרִיתִי
  choice: meinen Bund
  rationale: „Bund“ ist die präzise und etablierte deutsche Wiedergabe des zentralen hebräischen Bundesbegriffs בְּרִית.
theological_decisions:
- issue: Wiedergabe von נֶפֶשׁ in der idiomatischen Verbindung תִּגְעַל נַפְשְׁכֶם
  choice: euer Innerstes … verabscheut
  alternative: eure Seele … verabscheut / ihr verabscheut
  rationale: Die gewählte Form erhält ein ausdrückliches inneres Subjekt und die emotionale Intensität des Hebräischen, vermeidet aber, „Seele“ als dogmatisch festgelegten Fachbegriff erscheinen zu lassen. Die formnähere Alternative wird in der Fußnote genannt.
- issue: Unterscheidung der Begriffe für die Bundesordnung
  choice: Satzungen / Rechtsbestimmungen / Gebote / Bund
  alternative: Ordnungen / Rechtssätze / Weisungen / Bund
  rationale: Die Häufung verschiedener Rechtsbegriffe im Ausgangstext wird nicht eingeebnet. Zugleich bleiben die gewählten deutschen Begriffe für heutige Leser verständlich.
- issue: Semantische Beziehung von לְבִלְתִּי und לְהַפְרְכֶם
  choice: 'Folge: „sodass … und damit“'
  alternative: 'Absicht: „um … nicht zu … und … zu brechen“'
  rationale: Die Präpositionalkonstruktionen lassen Zweck und Folge ineinandergreifen. Der Haupttext formuliert idiomatisch als Folge, während die Fußnote die mögliche Ziel- beziehungsweise Absichtsnuance offenhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit rechtlich-bundestheologischem Klang. Der Vers setzt syntaktisch den Bedingungssatz aus dem Kontext fort; deshalb beginnt er mit „und wenn“. Die Satzzeichen und Fußnotenmarker sind so gesetzt, dass beide Anmerkungen eindeutig auf die betreffenden Wendungen verweisen.
