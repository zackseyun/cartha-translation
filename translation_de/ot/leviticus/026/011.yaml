  text: וְ/נָתַתִּ֥י מִשְׁכָּנִ֖/י בְּ/תוֹכְ/כֶ֑ם וְ/לֹֽא תִגְעַ֥ל נַפְשִׁ֖/י אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/011.yaml
  text: And I will set my dwelling place among you, and my soul will not abhor you.
translation:
  language: de
  text: Und ich werde meine Wohnung mitten unter euch errichten, und meine Seele wird euch nicht verabscheuen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁכָּנִי
  choice: meine Wohnung
  rationale: Das Substantiv מִשְׁכָּן bezeichnet hier Gottes Wohnstätte unter seinem Volk. „Wohnung“ ist natürliches modernes Deutsch und bewahrt den Bezug zum Wohnen, ohne vorschnell ausschließlich das kultische Zelt zu bezeichnen.
- source_word: בְּתוֹכְכֶם
  choice: mitten unter euch
  rationale: Die Wendung bezeichnet eine Wohnstätte innerhalb der Gemeinschaft; „mitten unter euch“ gibt die räumliche und gemeinschaftliche Nähe idiomatisch wieder.
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: Die ausdrückliche Wendung des Hebräischen bleibt erhalten, statt sie lediglich als „ich“ wiederzugeben. So wird die anthropomorphe Ausdrucksweise und ihre Spannung bewahrt.
- source_word: תִגְעַל ... אֶתְכֶם
  choice: wird euch nicht verabscheuen
  rationale: געל drückt starke Abneigung oder Zurückweisung aus; „verabscheuen“ trifft diese Intensität in verständlichem, würdigem Deutsch.
theological_decisions:
- issue: Anthropomorphe Rede von Gottes נֶפֶשׁ
  choice: „meine Seele“ ausdrücklich wiedergeben
  alternative: „ich werde euch nicht verabscheuen“
  rationale: Der Ausgangstext nennt Gottes „Seele“ ausdrücklich. Die Übersetzung bewahrt diese genuine biblische Redeweise, ohne sie dogmatisch zu glätten oder näher zu erklären.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am Hebräischen, klingt aber natürlich; die markante Formulierung „meine Seele“ wird bewusst bewahrt.
