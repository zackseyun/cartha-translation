  source_fidelity: Der Entwurf gibt beide hebräischen Teilsätze vollständig und in ihrer Reihenfolge wieder. „meine Wohnung“ vermittelt מִשְׁכָּנִי als Gottes Wohnstätte; „mitten unter euch“ trifft בְּתוֹכְכֶם. Die ausdrücklich anthropomorphe Formulierung נַפְשִׁי bleibt mit „meine Seele“ erhalten. „nicht verabscheuen“ gibt תִגְעַל angemessen stark wieder.
