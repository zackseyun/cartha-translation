id: LEV.4.11
reference: Leviticus 4:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אֶת ע֤וֹר הַ/פָּר֙ וְ/אֶת כָּל בְּשָׂר֔/וֹ עַל רֹאשׁ֖/וֹ וְ/עַל כְּרָעָ֑י/ו וְ/קִרְבּ֖/וֹ וּ/פִרְשֽׁ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/011.yaml
  text: But the hide of the bull[a], and all its flesh[c][b], with its head and with its legs and its entrails and its dung—
translation:
  language: de
  text: Die Haut des Stiers[a] aber und sein ganzes Fleisch samt seinem Kopf und seinen Beinen[b], seinen Eingeweiden und seinem Kot –
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des jungen Stiers“.'
    reason: lexical_alternative
  - marker: b
    text: 'Genauer möglicherweise: „seinen Unterschenkeln“.'
    reason: lexical_precision
lexical_decisions:
- source_word: עוֹר
  choice: Haut
  rationale: Im Zusammenhang mit einem geschlachteten Opfertier bezeichnet עוֹר die abgezogene Tierhaut. „Haut“ ist im modernen Deutsch klarer und neutraler als „Fell“.
- source_word: הַפָּר
  choice: des Stiers
  rationale: פַּר bezeichnet einen Stier, häufig einen jungen Stier. „Stier“ gibt die Tierart knapp und natürlich wieder; die mögliche Altersangabe bleibt in einer Fußnote erhalten.
- source_word: כָּל בְּשָׂרוֹ
  choice: sein ganzes Fleisch
  rationale: Die konkrete Bedeutung von בָּשָׂר wird bewahrt; „Körper“ wäre weiter gefasst und würde die anatomische Aufzählung glätten.
- source_word: עַל רֹאשׁוֹ וְעַל כְּרָעָיו
  choice: samt seinem Kopf und seinen Beinen
  rationale: עַל hat in dieser Aufzählung einschließende Funktion. „Samt“ drückt diese Zugehörigkeit idiomatisch aus; כְּרָעַיִם bezeichnet die Beine beziehungsweise unteren Beinabschnitte des Tieres.
- source_word: וְקִרְבּוֹ
  choice: seinen Eingeweiden
  rationale: קֶרֶב bezeichnet hier konkret die inneren Teile beziehungsweise Eingeweide des Opfertiers.
- source_word: וּפִרְשׁוֹ
  choice: seinem Kot
  rationale: פֶּרֶשׁ bezeichnet den Darminhalt beziehungsweise die Ausscheidung. „Kot“ ist direkt und unterscheidet ihn klar von den Eingeweiden.
theological_decisions: []
