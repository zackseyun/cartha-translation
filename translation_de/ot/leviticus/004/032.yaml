base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/032.yaml
  text: And if he brings a lamb as his offering for a sin offering[a], he shall bring a female without blemish.
translation:
  language: de
  text: Und wenn er ein Lamm als seine Opfergabe zum Sündopfer[a] darbringt, soll er ein weibliches Tier ohne Fehler darbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Reinigungsopfer“. Das hebräische Wort חַטָּאת kann die Opferart bezeichnen, die sich auf Sünde und kultische Unreinheit bezieht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Und wenn
  rationale: Die konditionale Verbindung führt einen weiteren möglichen Opferfall ein und bewahrt den Zusammenhang mit dem vorangehenden Abschnitt.
- source_word: כֶּבֶשׂ
  choice: ein Lamm
  rationale: Das Wort bezeichnet hier ein Tier aus der Schafherde; „Lamm“ ist im Kontext der Opferbestimmungen die geläufige und passende Wiedergabe.
- source_word: יָבִיא
  choice: bringt
  rationale: Der Hifil von בוא bezeichnet konkret das Herbeibringen der Opfergabe.
- source_word: קָרְבָּנוֹ
  choice: seine Gabe
  rationale: קָרְבָּן bezeichnet eine Gott dargebrachte beziehungsweise vor ihn gebrachte Gabe; „Gabe“ ist hier natürlich und vermeidet eine unnötige Wiederholung von „Opfer“.
- source_word: לְחַטָּאת
  choice: zum Sündopfer
  rationale: Im levitischen Opferrecht bezeichnet חַטָּאת die Opferart, die sich mit Sünde und auch kultischer Verunreinigung befasst. „Sündopfer“ ist die etablierte deutsche Bezeichnung; die mögliche Nuance „Reinigungsopfer“ bleibt in der Fußnote erhalten.
- source_word: נְקֵבָה
  choice: ein weibliches Tier
  rationale: Das Wort bestimmt das Geschlecht des Lammes. Die Wiedergabe macht den Bezug im Deutschen eindeutig.
- source_word: תְמִימָה
  choice: ohne Fehler
  rationale: תמים bezeichnet bei Opfertieren das Fehlen körperlicher Mängel; „ohne Fehler“ ist klar, gegenwärtig und sachlich präzise.
- source_word: יְבִיאֶנָּה
  choice: soll er ... bringen
  rationale: Die Verbform mit femininem Objektsuffix greift das weibliche Tier auf und hat im gesetzlichen Kontext anweisenden Charakter.
theological_decisions:
- issue: Wiedergabe von חַטָּאת im Opferrecht
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: „Sündopfer“ wahrt die traditionelle und allgemein verständliche Bezeichnung der Opferkategorie. Da חַטָּאת zugleich die Beseitigung kultischer Verunreinigung bezeichnen kann, wird „Reinigungsopfer“ als echte lexikalisch-theologische Alternative in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem hebräischen Konditionalsatz, ohne im Deutschen schwerfällig zu wirken; die Wiederholung von „bringen“ bewahrt die Hervorhebung des Ausgangstextes.
