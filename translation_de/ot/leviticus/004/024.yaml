source:
  edition: WLC
  text: וְ/סָמַ֤ךְ יָד/וֹ֙ עַל רֹ֣אשׁ הַ/שָּׂעִ֔יר וְ/שָׁחַ֣ט אֹת֔/וֹ בִּ/מְק֛וֹם אֲשֶׁר יִשְׁחַ֥ט אֶת הָ/עֹלָ֖ה לִ/פְנֵ֣י יְהוָ֑ה חַטָּ֖את הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/024.yaml
  text: And he shall lay his hand on the head of the goat and slaughter it in the place where they slaughter the burnt offering before Yahweh[a]. It is a sin offering.
translation:
  language: de
  text: Er soll seine Hand auf den Kopf des Ziegenbocks legen und ihn dort schlachten, wo man das Brandopfer vor Jahwe schlachtet. Es ist ein Sündopfer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Reinigungsopfer“. Das hebräische Wort חַטָּאת kann sowohl „Sünde“ als auch das Opfer bezeichnen, das mit der Beseitigung von Sünde oder Unreinheit verbunden ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ יָדוֹ
  choice: Er soll seine Hand … legen
  rationale: Die Wendung bezeichnet das rituelle Auflegen der Hand; der Singular des Hebräischen bleibt erhalten.
- source_word: עַל רֹאשׁ הַשָּׂעִיר
  choice: auf den Kopf des Ziegenbocks
  rationale: שָׂעִיר bezeichnet hier das männliche Tier; „Ziegenbock“ ist im Deutschen eindeutig und passt zum Opferkontext.
- source_word: וְשָׁחַט אֹתוֹ
  choice: und ihn … schlachten
  rationale: שׁחט ist das übliche Verb für rituelles Schlachten und wird daher nicht allgemein mit „töten“ wiedergegeben.
- source_word: בִּמְקוֹם אֲשֶׁר יִשְׁחַט
  choice: dort …, wo man … schlachtet
  rationale: Die aktive hebräische Konstruktion bleibt durch das unpersönliche „man“ erhalten; „dort, wo“ ist natürliches modernes Deutsch.
- source_word: הָעֹלָה
  choice: das Brandopfer
  rationale: „Brandopfer“ ist die etablierte und verständliche deutsche Bezeichnung für עֹלָה.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי wird räumlich-kultisch mit „vor“ wiedergegeben; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: חַטָּאת הוּא
  choice: Es ist ein Sündopfer
  rationale: Die Aussage ordnet das Tier beziehungsweise den Ritus der Opferart חַטָּאת zu. „Sündopfer“ ist die gebräuchliche Hauptwiedergabe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Gottesnamen ausdrücklich. „Jahwe“ gibt ihn als Eigennamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Kultische Bedeutung von חַטָּאת
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: חַטָּאת kann sowohl auf Sünde als auch auf das der Beseitigung von Sünde beziehungsweise Unreinheit dienende Opfer verweisen. Die traditionelle, klare Hauptwiedergabe bleibt im Text; die wichtige Bedeutungsalternative wird in der Fußnote bewahrt.
translation_notes:
  register: Moderne, würdevolle Gesetzessprache. Die Satzstruktur folgt dem Hebräischen eng, ohne im Deutschen steif zu wirken; kultische Fachbegriffe werden verständlich und konsistent wiedergegeben.
