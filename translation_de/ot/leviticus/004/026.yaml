id: LEV.4.26
reference: Leviticus 4:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אֶת כָּל חֶלְבּ/וֹ֙ יַקְטִ֣יר הַ/מִּזְבֵּ֔חָ/ה כְּ/חֵ֖לֶב זֶ֣בַח הַ/שְּׁלָמִ֑ים וְ/כִפֶּ֨ר עָלָ֧י/ו הַ/כֹּהֵ֛ן מֵ/חַטָּאת֖/וֹ וְ/נִסְלַ֥ח לֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/026.yaml
  text: And he shall burn all its fat on the altar[a], like the fat of the sacrifice of peace offerings. Thus the priest shall make atonement for him for his sin[b], and he shall be forgiven.
translation:
  language: de
  text: Und sein ganzes Fett soll er auf dem Altar in Rauch aufgehen lassen, wie das Fett des Heilsopfers.[a] So soll der Priester für ihn wegen seiner Sünde[b] Sühne erwirken, und ihm wird vergeben werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Heilsopfer“ kann auch mit „Friedensopfer“, „Gemeinschaftsopfer“ oder „Wohlergehensopfer“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort חַטָּאת kann sowohl „Sünde“ als auch „Sündopfer“ bedeuten; hier ist wahrscheinlich die Sünde des Mannes gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶלְבּוֹ
  choice: sein ganzes Fett
  rationale: חֵלֶב bezeichnet hier die für den Altar bestimmten Fettstücke des Opfertiers; das Suffix wird mit „sein“ wiedergegeben, und כָּל ausdrücklich mit „ganzes“.
- source_word: יַקְטִיר
  choice: in Rauch aufgehen lassen
  rationale: Das Hifil von קטר bezeichnet im Opferkontext das Verbrennen auf dem Altar mit dem Akzent auf dem aufsteigenden Rauch. Die Formulierung ist präziser als das allgemeinere „verbrennen“.
- source_word: הַמִּזְבֵּחָה
  choice: auf dem Altar
  rationale: Obwohl die Richtungsendung Bewegung zum Altar ausdrücken kann, bezeichnet die Wendung idiomatisch den Ort des kultischen Verbrennens.
- source_word: כְּחֵלֶב זֶבַח הַשְּׁלָמִים
  choice: wie das Fett des Heilsopfers
  rationale: זֶבַח הַשְּׁלָמִים ist die Opfergattung des Gemeinschafts-, Friedens- oder Wohlergehensopfers. „Heilsopfer“ ist eine etablierte, knappe deutsche Bezeichnung; eine Fußnote bewahrt die Bedeutungsbreite.
- source_word: וְכִפֶּר עָלָיו
  choice: so soll der Priester für ihn Sühne erwirken
  rationale: כפר im priesterlichen Opferkontext bezeichnet die kultische Sühnehandlung. „Sühne erwirken“ bewahrt den Vorgangscharakter, ohne eine bestimmte Sühnetheorie festzulegen.
- source_word: מֵחַטָּאתוֹ
  choice: wegen seiner Sünde
  rationale: חַטָּאת kann „Sünde“ oder „Sündopfer“ bedeuten. Nach כפר und vor der Vergebungszusage bezeichnet es hier am wahrscheinlichsten die Verfehlung, deretwegen Sühne nötig ist.
- source_word: וְנִסְלַח לוֹ
  choice: und ihm wird vergeben werden
  rationale: Das Niphal von סלח mit ל bezeichnet den Empfänger der Vergebung. Die unpersönliche Passivform bewahrt den im Hebräischen unausgesprochenen göttlichen Handelnden.
theological_decisions:
- issue: Wiedergabe der Opferbezeichnung שְׁלָמִים
  choice: Heilsopfer
  alternative: Friedensopfer; Gemeinschaftsopfer; Wohlergehensopfer
  rationale: Der Begriff umfasst Vorstellungen von Frieden, Ganzheit, Wohlergehen und Gemeinschaft. „Heilsopfer“ ist im deutschen Bibel- und Kultwortschatz geläufig; die Fußnote erhält die semantische Offenheit.
- issue: Bedeutung von חַטָּאת in מֵחַטָּאתוֹ
  choice: seiner Sünde
  alternative: seines Sündopfers
  rationale: Die Konstruktion mit כפר, der Personenbezug עָלָיו und die folgende Vergebungszusage sprechen hier stärker für die Verfehlung als für das Opfertier. Die lexikalische Mehrdeutigkeit wird in einer Fußnote ausgewiesen.
- issue: Unausgesprochener Handelnder bei der Vergebung
  choice: ihm wird vergeben werden
  alternative: Gott wird ihm vergeben
  rationale: Das hebräische Passiv nennt Gott nicht ausdrücklich. Die Übersetzung bewahrt dieses sogenannte göttliche Passiv und ergänzt den Handelnden nicht interpretierend.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltenem kultischem Fachwortschatz. Die Satzstruktur folgt dem hebräischen Ablauf, bleibt aber natürlich lesbar. „In Rauch aufgehen lassen“ macht die spezifische Opferhandlung deutlich; die Fußnoten dokumentieren echte lexikalische Mehrdeutigkeit.
