  text: וְ/אֵת֙ שְׁתֵּ֣י הַ/כְּלָיֹ֔ת וְ/אֶת הַ/חֵ֨לֶב֙ אֲשֶׁ֣ר עֲלֵי/הֶ֔ן אֲשֶׁ֖ר עַל הַ/כְּסָלִ֑ים וְ/אֶת הַ/יֹּתֶ֨רֶת֙ עַל הַ/כָּבֵ֔ד עַל הַ/כְּלָי֖וֹת יְסִירֶֽ/נָּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/009.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, along with the kidneys, he shall remove it.
translation:
  language: de
  text: und die beiden Nieren samt dem Fett an ihnen, das an den Lenden liegt, sowie das Anhängsel an der Leber[a]. Dieses soll er zusammen mit den Nieren abtrennen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Lappen der Leber“. Die genaue Bedeutung des hebräischen Ausdrucks für diesen Körperteil ist unsicher; „Anhängsel“ ist eine zurückhaltende Wiedergabe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: die beiden Nieren
  rationale: Die konkrete anatomische Angabe und die ausdrückliche Zweizahl des Hebräischen werden klar und natürlich wiedergegeben.
- source_word: הַחֵלֶב
  choice: das Fett
  rationale: Im Opferkontext bezeichnet das Wort die für die Darbringung bestimmten Fettteile. „Fett“ ist im modernen Deutsch verständlicher als das fachsprachliche „Talg“.
- source_word: אֲשֶׁר עֲלֵיהֶן
  choice: an ihnen
  rationale: Die Wendung bezieht sich auf die Nieren und gibt die räumliche Beziehung idiomatisch wieder.
- source_word: הַכְּסָלִים
  choice: die Lenden
  rationale: Der Ausdruck bezeichnet hier den anatomischen Bereich der Lenden beziehungsweise Flanken; „Lenden“ wahrt die traditionelle und konkrete Ausdrucksweise.
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד
  choice: das Anhängsel an der Leber
  rationale: Die genaue anatomische Bedeutung von יֹתֶרֶת ist unsicher. „Anhängsel“ vermeidet eine nicht gesicherte Präzisierung als bestimmter Leberlappen; „an der Leber“ bewahrt zudem die hebräische Präposition.
- source_word: עַל הַכְּלָיוֹת
  choice: zusammen mit den Nieren
  rationale: In der wiederkehrenden Opferformel bezeichnet die Wendung am ehesten die gemeinsame Abtrennung; eine rein räumliche Wiedergabe wie „auf den Nieren“ wäre im Deutschen missverständlich.
- source_word: יְסִירֶנָּה
  choice: Dieses soll er … abtrennen
  rationale: Das feminine Singularsuffix greift am natürlichsten das feminine יֹתֶרֶת („Anhängsel“) auf. „Abtrennen“ bezeichnet den konkreten Vorgang genauer als das allgemeinere „entfernen“.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller Anweisungsstil. Die lange hebräische Reihung wurde zur besseren Verständlichkeit in zwei Sätze gegliedert; „Dieses“ wahrt dabei den femininen Singularbezug des hebräischen Verbs. „Samt“ und „sowie“ geben die Aufzählungsstruktur flüssig wieder.
