  source_fidelity: Die Übersetzung gibt die hebräische Aufzählung der beiden Nieren, des daran bzw. im Lendenbereich befindlichen Fetts und des unsicher bestimmten Leberanhängsels zuverlässig wieder. Die Auflösung des femininen Singularsuffixes in „Dieses“ entspricht naheliegend dem unmittelbar vorausgehenden femininen יֹתֶרֶת. „Zusammen mit den Nieren“ ist für עַל הַכְּלָיוֹת eine im rituell-anatomischen Zusammenhang vertretbare, verständliche Wiedergabe, ohne die unsichere genaue räumliche Beziehung unnötig zu präzisieren.
