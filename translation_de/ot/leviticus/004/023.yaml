source:
  edition: WLC
  text: אֽוֹ הוֹדַ֤ע אֵלָי/ו֙ חַטָּאת֔/וֹ אֲשֶׁ֥ר חָטָ֖א בָּ֑/הּ וְ/הֵבִ֧יא אֶת קָרְבָּנ֛/וֹ שְׂעִ֥יר עִזִּ֖ים זָכָ֥ר תָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/023.yaml
  text: or if the sin that he has committed is made known to him[a], then he shall bring as his offering a male goat without blemish.
translation:
  language: de
  text: oder wenn ihm seine Sünde, die er begangen hat, bekannt gemacht wird, dann soll er als seine Opfergabe einen Ziegenbock ohne Makel bringen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֽוֹ
  choice: oder
  rationale: Die einfache disjunktive Konjunktion führt den in den vorherigen Versen begonnenen Rechtsfall fort.
- source_word: הוֹדַע אֵלָיו
  choice: ihm … bekannt gemacht wird
  rationale: Der Hofal von ידע bezeichnet ein passives Bekanntwerden beziehungsweise Bekanntmachen; der Text sagt nicht ausdrücklich, dass er die Sünde selbst erkennt.
- source_word: חַטָּאתוֹ
  choice: seine Sünde
  rationale: Hier bezeichnet חטאת wegen des folgenden Relativsatzes die begangene Verfehlung, nicht das Sündopfer.
- source_word: אֲשֶׁר חָטָא בָּהּ
  choice: die er begangen hat
  rationale: Die Präposition ב ist in Verbindung mit חטא idiomatisch. Im Deutschen gibt „eine Sünde begehen“ den Sinn natürlich und genau wieder.
- source_word: וְהֵבִיא
  choice: dann soll er … bringen
  rationale: Das Waw mit der Perfektform drückt in diesem Rechtstext die vorgeschriebene Folge aus.
- source_word: קָרְבָּנוֹ
  choice: als seine Opfergabe
  rationale: קרבן ist eine Gott dargebrachte Gabe. „Als seine Opfergabe“ fügt sich natürlich in die deutsche Satzstruktur ein.
- source_word: שְׂעִיר עִזִּים זָכָר
  choice: einen … männlichen Ziegenbock
  rationale: Die Formulierung bezeichnet einen Ziegenbock; „männlich“ bewahrt zusätzlich die ausdrückliche Geschlechtsangabe זָכָר, auch wenn sie im Deutschen teilweise redundant klingt.
- source_word: תָּמִים
  choice: fehlerlosen
  rationale: Im Opferkontext bezeichnet das Wort ein Tier ohne körperlichen Makel. „Fehlerlos“ ist verständlich und wahrt den kultischen Sinn.
theological_decisions:
- issue: Bedeutung von חַטָּאת in diesem Vers
  choice: Sünde beziehungsweise Verfehlung
  alternative: Sündopfer
  rationale: Der Relativsatz „die er begangen hat“ kennzeichnet חַטָּאת als die Verfehlung selbst; die Opfergabe wird anschließend gesondert mit קָרְבָּנוֹ bezeichnet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rechtlich-vorschreibendem Ton. Die passive Formulierung bewahrt die Aussage des hebräischen Hofal; die leichte Redundanz „männlicher Ziegenbock“ bildet die ausdrückliche Geschlechtsangabe der Vorlage ab.
