base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/020.yaml
  text: He shall do with the bull just as he did with the bull of the sin offering; so he shall do with it. And the priest shall make atonement for them[a], and they shall be forgiven.
translation:
  language: de
  text: Mit dem Stier soll er genauso verfahren, wie er mit dem Stier des Sündopfers[a] verfahren ist; ebenso soll er mit ihm verfahren. So soll der Priester für sie Sühne erwirken, und ihnen wird vergeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Stier des Reinigungsopfers“. Der hebräische Ausdruck kann ein Opfer bezeichnen, das Sünde behandelt, indem es Reinigung bewirkt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה לַפָּר
  choice: Mit dem Stier soll er … verfahren
  rationale: Die Verbindung von עשה mit ל beschreibt hier die rituelle Behandlung des Tieres. „Mit … verfahren“ ist im Deutschen natürlich und bewahrt den prozeduralen Charakter.
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: genauso … wie er … verfahren ist
  rationale: כַּאֲשֶׁר führt den ausdrücklichen Vergleich mit dem zuvor beschriebenen Ritual ein; „genauso … wie“ gibt diese Entsprechung klar wieder.
- source_word: לְפַר הַחַטָּאת
  choice: mit dem Stier des Sündopfers
  rationale: Die Wendung bezeichnet den zuvor behandelten Opferstier. „Stier des Sündopfers“ ist verständlich und bleibt nahe an der hebräischen Konstruktion.
- source_word: הַחַטָּאת
  choice: Sündopfer
  rationale: חטאת bezeichnet im Opferkontext das Opfer, das Sünde behandelt und Reinigung bewirkt. „Sündopfer“ ist die etablierte, unmittelbar verständliche Wiedergabe; die sachlich mögliche Alternative „Reinigungsopfer“ wird in der Fußnote genannt.
- source_word: כֵּן יַעֲשֶׂה לּוֹ
  choice: ebenso soll er mit ihm verfahren
  rationale: כֵּן bezeichnet die genaue Entsprechung; das Pronomen bezieht sich auf den Stier. Die maskuline Form „ihm“ erhält diesen Bezug.
- source_word: וְכִפֶּר עֲלֵהֶם
  choice: So soll … für sie Sühne erwirken
  rationale: כפר ist ein zentraler kultischer Begriff. „Sühne erwirken“ bringt sowohl die priesterliche Handlung als auch ihre zugunsten der Betroffenen eintretende Wirkung zum Ausdruck; על wird idiomatisch mit „für“ wiedergegeben.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Direkte und geläufige Wiedergabe der Bezeichnung für den amtierenden Kultdiener.
- source_word: וְנִסְלַח לָהֶם
  choice: und ihnen wird vergeben werden
  rationale: Der Niphal von סלח bezeichnet die gewährte Vergebung. Die deutsche unpersönliche Konstruktion bewahrt die hebräische Formulierung, ohne den Geber der Vergebung ausdrücklich zu ergänzen.
theological_decisions:
- issue: Wiedergabe von חטאת in der Opfergesetzgebung
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: Der Ausdruck kann sowohl die behandelte Sünde als auch die durch das Opfer bewirkte Reinigung hervorheben. „Sündopfer“ bleibt als etablierte und allgemein verständliche Bezeichnung im Haupttext; „Reinigungsopfer“ wird als echte lexikalische Alternative in der Fußnote bewahrt.
- issue: Wiedergabe von כפר
  choice: Sühne erwirken
  alternative: entsühnen / Sühne schaffen
  rationale: Die Formulierung wahrt die kultisch-theologische Bedeutung, ohne den Mechanismus der Sühne näher festzulegen oder eine konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit sachlich-ritueller Ausdrucksweise. Die Wiederholung des Verfahrens bleibt erhalten, weil sie dem hebräischen Text entspricht. Der Fußnotenmarker [a] steht unmittelbar beim betreffenden Ausdruck.
