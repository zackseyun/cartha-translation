id: LEV.4.3
reference: Leviticus 4:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אִ֣ם הַ/כֹּהֵ֧ן הַ/מָּשִׁ֛יחַ יֶחֱטָ֖א לְ/אַשְׁמַ֣ת הָ/עָ֑ם וְ/הִקְרִ֡יב עַ֣ל חַטָּאת/וֹ֩ אֲשֶׁ֨ר חָטָ֜א פַּ֣ר בֶּן בָּקָ֥ר תָּמִ֛ים לַ/יהוָ֖ה לְ/חַטָּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/003.yaml
  text: If the anointed priest sins[a], bringing guilt on the people, then he shall present for the sin that he has committed a bull, a son of the herd, without blemish[b], to Yahweh as a sin offering.
translation:
  language: de
  text: Wenn der gesalbte Priester sündigt und dadurch Schuld über das Volk bringt[a], soll er für die Sünde, die er begangen hat, dem HERRN einen fehlerlosen jungen Stier als Sündopfer darbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: »zur Schuld des Volkes«. Die knappe hebräische Formulierung kann hervorheben, dass die Sünde des gesalbten Priesters Schuld für das Volk zur Folge hat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן הַמָּשִׁיחַ
  choice: der gesalbte Priester
  rationale: Gibt die hebräische Bezeichnung unmittelbar wieder; »Hohepriester« wäre im Kontext sachlich naheliegend, steht aber nicht ausdrücklich im Wortlaut.
- source_word: יֶחֱטָא
  choice: sündigt
  rationale: Der Imperfekt nach אִם bildet hier natürlich den Bedingungsfall eines Rechtssatzes.
- source_word: לְאַשְׁמַת הָעָם
  choice: und dadurch Schuld über das Volk bringt
  rationale: Die knappe hebräische Wendung bezeichnet eine Folge für das Volk, lässt aber deren genauen Mechanismus offen.
- source_word: וְהִקְרִיב
  choice: soll ... darbringen
  rationale: הקריב bezeichnet im Opferkontext das Heranbringen beziehungsweise Darbringen einer Opfergabe.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: für die Sünde, die er begangen hat
  rationale: Bewahrt den Bezug auf die konkrete begangene Sünde in natürlichem Deutsch.
- source_word: פַּר בֶּן בָּקָר
  choice: einen jungen Stier
  rationale: Die feste hebräische Tierbezeichnung meint einen Stier aus dem Rinderbestand; »junger Stier« ist die geläufige und präzise deutsche Wiedergabe.
- source_word: תָּמִים
  choice: fehlerlosen
  rationale: Im Opferrecht bezeichnet das Wort ein Tier ohne körperlichen Makel.
- source_word: לַיהוָה
  choice: dem HERRN
  rationale: Wiedergabe des Gottesnamens יהוה nach der etablierten deutschen Bibelkonvention.
- source_word: לְחַטָּאת
  choice: als Sündopfer
  rationale: חַטָּאת bezeichnet hier aufgrund des Opferkontexts nicht nur Sünde, sondern die dafür bestimmte Opferart.
theological_decisions:
- issue: Amtsbezeichnung הַכֹּהֵן הַמָּשִׁיחַ
  choice: der gesalbte Priester
  alternative: der gesalbte Hohepriester
  rationale: Der Kontext weist auf den obersten Priester, doch der hebräische Wortlaut enthält keine eigene Entsprechung für »hoch«; die formale Bezeichnung bleibt deshalb im Text erhalten.
- issue: Gemeinschaftliche Folge in לְאַשְׁמַת הָעָם
  choice: und dadurch Schuld über das Volk bringt
  alternative: zur Schuld des Volkes
  rationale: Die Übersetzung macht die gemeinschaftliche Auswirkung verständlich, ohne zu bestimmen, wie die Schuld des Priesters dem Volk zugerechnet wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit rechtssprachlich klarer Bedingungsstruktur und geläufiger Opferterminologie. Der Gottesname wird als »HERR« wiedergegeben.
