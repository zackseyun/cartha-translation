  text: וְ/אֵ֥ת כָּל חֶלְבּ֖/וֹ יָרִ֣ים מִמֶּ֑/נּוּ וְ/הִקְטִ֖יר הַ/מִּזְבֵּֽחָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/019.yaml
  text: And he shall remove all its fat from it and burn it on the altar[a].
translation:
  language: de
  text: Und alles Fett soll er von ihm abheben und auf dem Altar als Rauch aufsteigen lassen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb bezeichnet im Opferdienst das Verbrennen einer Gabe, sodass sie als Rauch aufsteigt.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת כָּל חֶלְבּוֹ
  choice: Und alles Fett
  rationale: Die Konjunktion führt die Ritualfolge weiter; כָּל bezeichnet die Gesamtheit des für das Opfer bestimmten Fetts. Das Suffix bezieht sich auf das Opfertier und muss im Deutschen hier nicht eigens wiedergegeben werden.
- source_word: יָרִים מִמֶּנּוּ
  choice: soll er von ihm abheben
  rationale: Der Hifil von רום bezeichnet hier das Abheben beziehungsweise Abnehmen des Fetts vom Opfertier. „Abheben“ bewahrt das konkrete Bild und ist im rituellen Zusammenhang verständlich; „ihm“ entspricht dem grammatisch maskulinen Tierbezug.
- source_word: וְהִקְטִיר
  choice: und … in Rauch aufgehen lassen
  rationale: Das Verb הקטיר ist priesterliche Opfersprache und bezeichnet nicht bloß gewöhnliches Verbrennen, sondern das Verbrennen einer Opfergabe, sodass sie als Rauch aufsteigt.
- source_word: הַמִּזְבֵּחָה
  choice: auf dem Altar
  rationale: Die Richtungsendung kann formal eine Bewegung zum Altar anzeigen; zusammen mit הקטיר bezeichnet die Wendung idiomatisch den Altar als Ort des Verbrennens.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die Formulierung „in Rauch aufgehen lassen“ bewahrt die besondere kultische Bedeutung des hebräischen Verbs; die Wiederholung „von ihm“ folgt dem Ausgangstext und hält den Bezug auf das Opfertier ausdrücklich fest.
