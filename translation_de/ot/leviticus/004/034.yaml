source:
  edition: WLC
  text: וְ/לָקַ֨ח הַ/כֹּהֵ֜ן מִ/דַּ֤ם הַֽ/חַטָּאת֙ בְּ/אֶצְבָּע֔/וֹ וְ/נָתַ֕ן עַל קַרְנֹ֖ת מִזְבַּ֣ח הָ/עֹלָ֑ה וְ/אֶת כָּל דָּמָ֣/הּ יִשְׁפֹּ֔ךְ אֶל יְס֖וֹד הַ/מִּזְבֵּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/034.yaml
  text: Then the priest shall take some of the blood of the sin offering with his finger and put it on the horns of the altar of burnt offering[a], and he shall pour out all its blood at the base of the altar.
translation:
  language: de
  text: Dann soll der Priester mit seinem Finger etwas vom Blut des Sündopfers[a] nehmen und es auf die Hörner des Brandopferaltars streichen. Das ganze Blut soll er am Fuß des Altars ausgießen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Reinigungsopfer“. Der hebräische Ausdruck kann ein Opfer bezeichnen, das im Zusammenhang mit Sünde und ritueller Reinigung dargebracht wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Dann soll ... nehmen
  rationale: Das Waw mit der Verbform führt die schrittweise Ritualanweisung fort; „Dann soll“ gibt diese Abfolge in natürlichem Deutsch wieder.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Direkte Wiedergabe der bestimmten Bezeichnung für den amtierenden Priester.
- source_word: מִדַּם
  choice: etwas vom Blut
  rationale: 'Die Präposition מִן ist hier im Zusammenhang partitiv: Nur ein Teil des Blutes wird mit dem Finger verwendet.'
- source_word: הַחַטָּאת
  choice: Sündopfer
  rationale: Im kultischen Zusammenhang bezeichnet חַטָּאת das Opfer in Beziehung zu Sünde beziehungsweise Reinigung; „Sündopfer“ ist die geläufige deutsche Bezeichnung.
- source_word: בְּאֶצְבָּעוֹ
  choice: mit seinem Finger
  rationale: Das בְּ kennzeichnet hier das Mittel, mit dem der Priester das Blut aufträgt.
- source_word: וְנָתַן
  choice: es ... streichen
  rationale: נתן bedeutet grundsätzlich „geben, setzen, anbringen“. „Streichen“ beschreibt in diesem Ritualzusammenhang natürlich das Anbringen des Blutes, ohne die Handlung unnötig auszudeuten.
- source_word: עַל קַרְנֹת מִזְבַּח הָעֹלָה
  choice: an die Hörner des Brandopferaltars
  rationale: „Hörner“ bewahrt das kultische Bild der vorspringenden Altarecken; „Brandopferaltar“ ist eine klare und knappe deutsche Zusammensetzung.
- source_word: וְאֶת כָּל דָּמָהּ
  choice: das ganze übrige Blut
  rationale: Wörtlich steht „all ihr Blut“. Da zuvor bereits etwas davon genommen wurde, macht „das ganze übrige Blut“ den im Ablauf zwingend gemeinten Rest im Deutschen verständlich.
- source_word: יִשְׁפֹּךְ
  choice: soll er ... gießen
  rationale: שפך bezeichnet hier das absichtliche Ausgießen des Blutes als Teil der Opferhandlung.
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: an den Fuß des Altars
  rationale: יְסוֹד bezeichnet Fundament oder Sockel. „Fuß des Altars“ ist anschaulich und im modernen Deutsch für den unteren Bereich des Altars verständlich.
theological_decisions:
- issue: Wiedergabe von חַטָּאת in der Opfergesetzgebung
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: Im vorliegenden Ritual bezeichnet das Wort sicher eine Opfergabe, kann aber sowohl ihre Beziehung zur Sünde als auch ihre reinigende Funktion hervorheben. Die Hauptübersetzung verwendet den etablierten Ausdruck „Sündopfer“; die sachlich mögliche Alternative bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzfolge. Traditionelle kultische Begriffe wie „Sündopfer“, „Brandopferaltar“ und „Hörner“ bleiben erhalten; weniger geläufige Bedeutungsaspekte werden durch die Fußnote erschlossen.
