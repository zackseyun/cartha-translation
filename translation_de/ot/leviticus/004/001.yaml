  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: de
  text: 'Und Jahwe[a] sprach zu Mose:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; alternativ als „Jehova“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: sprach
  rationale: Das Narrativ-Waw mit דבר eröffnet eine neue Redeeinheit. „Sprach“ entspricht der wiederkehrenden feierlichen Redeeinleitung und ist im Deutschen natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird in seiner im Deutschen üblichen wissenschaftlichen Form „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: אֶל־מֹשֶׁה
  choice: zu Mose
  rationale: Die Präposition אֶל bezeichnet hier den Adressaten der Rede; „zu Mose“ ist die natürliche deutsche Entsprechung.
- source_word: לֵאמֹר
  choice: Doppelpunkt
  rationale: Der Infinitiv לֵאמֹר leitet den Inhalt der folgenden Rede ein. Ein Doppelpunkt erfüllt diese Funktion im modernen Deutschen idiomatischer als das wörtliche „und sagte“ oder „folgendermaßen“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Eigennamen יהוה. „Jahwe“ bewahrt diesen als persönlichen Gottesnamen; die Fußnote weist auf die hebräische Form und die alternative Wiedergabe „Jehova“ hin.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die feste hebräische Redeeinleitung wird knapp und idiomatisch wiedergegeben; der Doppelpunkt kündigt die in den Folgeversen einsetzende direkte Rede an.
