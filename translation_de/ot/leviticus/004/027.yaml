base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/027.yaml
  text: And if one person from the common people sins unintentionally by doing one of Yahweh’s commandments that must not be done, and becomes guilty,
translation:
  language: de
  text: Und wenn eine Person aus dem einfachen Volk[a] unabsichtlich sündigt, indem sie eine der Handlungen begeht, die nach Yahwehs Geboten nicht getan werden dürfen, und dadurch schuldig wird[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „aus dem Volk des Landes“. Gemeint ist hier ein gewöhnliches Mitglied der Gemeinschaft, im Unterschied zu einem Priester oder Oberhaupt in den umgebenden Bestimmungen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „und Schuld auf sich lädt“ oder „und schuldig ist“. Das hebräische Verb kann bezeichnen, dass jemand schuldig wird oder Schuld trägt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ אַחַת
  choice: eine einzelne Person
  rationale: Die Wendung bezeichnet im rechtlichen Zusammenhang einen einzelnen Menschen. Die Übersetzung bewahrt den Singular und vermeidet das hier missverständliche wörtliche „eine Seele“.
- source_word: תֶּחֱטָא
  choice: sündigt
  rationale: חטא ist das übliche Verb für „sündigen“; die einfache verbale Wiedergabe ist präzise und natürlich.
- source_word: בִשְׁגָגָה
  choice: unabsichtlich
  rationale: Das Wort bezeichnet im Opferrecht eine unbeabsichtigte Verfehlung und nicht bloß einen beiläufigen Irrtum.
- source_word: מֵעַם הָאָרֶץ
  choice: aus dem einfachen Volk
  rationale: Im unmittelbaren Zusammenhang bezeichnet die Wendung ein gewöhnliches Mitglied des Volkes im Unterschied zum gesalbten Priester, zur ganzen Gemeinde oder zu einem führenden Mann.
- source_word: בַּעֲשֹׂתָהּ אַחַת מִמִּצְוֺת יְהוָה אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: indem sie eines von Yahwehs Geboten übertritt, das nicht übertreten werden darf
  rationale: Im Deutschen kann man ein Verbot beziehungsweise ein Gebot mit negativem Inhalt „übertreten“. Diese Fassung gibt den Tatbestand idiomatisch wieder und bewahrt zugleich die normative Kraft des hebräischen Relativsatzes.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְאָשֵׁם
  choice: und dadurch schuldig wird
  rationale: אשם kann das Eintreten in einen Schuldzustand oder das Tragen von Schuld ausdrücken. „Dadurch“ verdeutlicht knapp den Zusammenhang mit der zuvor genannten Tat, ohne eine zusätzliche theologische Deutung einzuführen.
theological_decisions:
- issue: Bedeutung von מֵעַם הָאָרֶץ im Opfergesetz
  choice: aus dem einfachen Volk
  alternative: aus dem Volk des Landes
  rationale: Die Wendung bildet hier eine rechtlich-soziale Kategorie für ein gewöhnliches Mitglied der Gemeinschaft. Die gewählte Formulierung macht den Gegensatz zu Priester und führendem Mann verständlich; die wörtlichere Alternative bleibt in der Fußnote sichtbar.
- issue: Aussagekraft von וְאָשֵׁם
  choice: und dadurch schuldig wird
  alternative: und Schuld auf sich lädt / und schuldig ist
  rationale: Die Übersetzung bewahrt die mögliche resultative Bedeutung des Verbs, ohne die ebenfalls mögliche Zustands- oder Haftungsnuance zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch in rechtlich-sakralem Register. Der Satz bleibt wegen des folgenden Verses offen und endet daher mit einem Komma. Das feminine Pronomen „sie“ nimmt das grammatisch und sachlich geschlechtsneutrale „Person“ auf.
