  source_fidelity: 'Der Entwurf gibt die Abfolge und die zentralen kultischen Handlungen zutreffend wieder: Eintauchen des Fingers, siebenmaliges Sprengen von Blut und die Ausrichtung vor Yahweh. „Vor die Vorderseite“ ist jedoch im Deutschen keine natürliche Wiedergabe von אֶת־פְּנֵי und klingt, als sei die Vorderseite selbst ein räumliches Ziel. Die Zielrichtung auf die dem Priester zugewandte Seite des Vorhangs lässt sich idiomatischer mit „gegen die Vorderseite“ ausdrücken.'
  naturalness: „Vor die Vorderseite des Vorhangs“ ist sprachlich schwerfällig und unidiomatisch. „Gegen die Vorderseite des Vorhangs des Heiligtums“ ist modernes, verständliches Standarddeutsch und bewahrt die im Hebräischen vorhandene Zielrichtung. Der übrige Vorschriftenstil ist natürlich und angemessen.
  terminology: „Priester“, „Blut“, „siebenmal“, „Yahweh“, „sprengen“ und „Vorhang des Heiligtums“ sind sachgerecht. „Sprengen“ ist im kultischen Zusammenhang ein etablierter deutscher Ausdruck. Die Fußnote soll die mögliche, stärker lokative Wiedergabe knapp dokumentieren, ohne eine syntaktische Erklärung als sichere Bedeutung auszugeben.
