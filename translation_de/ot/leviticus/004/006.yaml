source:
  edition: WLC
  text: וְ/טָבַ֧ל הַ/כֹּהֵ֛ן אֶת אֶצְבָּע֖/וֹ בַּ/דָּ֑ם וְ/הִזָּ֨ה מִן הַ/דָּ֜ם שֶׁ֤בַע פְּעָמִים֙ לִ/פְנֵ֣י יְהוָ֔ה אֶת פְּנֵ֖י פָּרֹ֥כֶת הַ/קֹּֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/006.yaml
  text: The priest shall dip his finger in the blood and sprinkle some of the blood seven times before Yahweh[a], in front of the curtain of the sanctuary.
translation:
  language: de
  text: Der Priester soll seinen Finger in das Blut tauchen und siebenmal etwas von dem Blut vor Yahweh gegen die Vorderseite des Vorhangs des Heiligtums sprengen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor Yahweh, vor dem Vorhang des Heiligen.“'
    reason: Die hebräische Ortsbestimmung kann auch stärker lokativ als „vor dem Vorhang“ wiedergegeben werden; „das Heilige“ ist eine mögliche Bezeichnung für den heiligen Bereich.
lexical_decisions:
- source_word: וְטָבַל
  choice: soll … tauchen
  rationale: Das Waw mit Qatal setzt die kultische Anweisungsfolge fort; im modernen deutschen Vorschriftenstil gibt „soll“ diese Funktion natürlich wieder.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Bestimmtes Substantiv im Singular für den amtierenden Priester.
- source_word: אֶצְבָּעוֹ בַּדָּם
  choice: seinen Finger in das Blut
  rationale: Das Suffix bezeichnet den Finger des Priesters; ב markiert hier das Medium beziehungsweise die Substanz, in die er ihn taucht.
- source_word: וְהִזָּה מִן־הַדָּם
  choice: etwas von dem Blut … sprengen
  rationale: נזה im Hifil bezeichnet im priesterlichen Ritual das Versprengen; מן ist hier am natürlichsten partitativ verstanden.
- source_word: שֶׁבַע פְּעָמִים
  choice: siebenmal
  rationale: Direkte und idiomatische Wiedergabe der adverbialen Zahlenangabe.
- source_word: לִפְנֵי יְהוָה
  choice: vor Yahweh
  rationale: לִפְנֵי drückt räumliche und kultische Ausrichtung aus; der Gottesname wird als Yahweh wiedergegeben.
- source_word: אֶת־פְּנֵי פָּרֹכֶת הַקֹּדֶשׁ
  choice: vor die Vorderseite des Vorhangs des Heiligtums
  rationale: אֶת־פְּנֵי benennt die dem Priester zugewandte Vorderseite als Zielrichtung des Sprengens. Diese Wiedergabe wahrt die schwierige Syntax und vermeidet, die Wendung mit לִפְנֵי יְהוָה zusammenzuziehen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm; die Umschrift bewahrt den persönlichen Bundesnamen.
- issue: Bezug und Bedeutung von פָּרֹכֶת הַקֹּדֶשׁ
  choice: Vorhang des Heiligtums
  alternative: Vorhang des Heiligen
  rationale: הַקֹּדֶשׁ kann den heiligen Bereich beziehungsweise das Heiligtum bezeichnen. „Heiligtum“ ist verständlich, ohne eine übermäßig genaue architektonische Zuordnung zu erzwingen.
- issue: Syntaktisches Verhältnis von לִפְנֵי יְהוָה und אֶת־פְּנֵי פָּרֹכֶת הַקֹּדֶשׁ
  choice: beide Bestimmungen im Haupttext bewahren
  alternative: „vor Yahweh, das heißt vor dem Vorhang des Heiligen“
  rationale: Der Text enthält beide räumlichen Wendungen. Eine Gleichsetzung ist möglich, aber nicht ausdrücklich markiert; deshalb bleibt die Spannung im Haupttext erhalten und die alternative Auffassung wird in einer Fußnote genannt.
translation_notes:
  register: Moderner, würdiger Vorschriftenstil. „Sprengen“ wird als etablierter kultischer Ausdruck verwendet; „Vorhang“ ist allgemeinverständlich. Die doppelte Ortsangabe des Hebräischen bleibt sichtbar.
