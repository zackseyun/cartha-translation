- from: Und all sein Fett soll er entfernen, so wie das Fett des Lammes vom Heilsopfer entfernt wird. Der Priester soll die Fettstücke auf dem Altar verbrennen, auf den Feueropfern für Jahwe.[a] So soll der Priester für ihn Sühne erwirken wegen der Sünde, die er begangen hat; dann wird ihm vergeben werden.
  to: Und das gesamte Fett soll er entfernen, so wie das Fett des Lammes vom Heilsopfer entfernt wird. Der Priester soll die Fettstücke auf dem Altar als Feueropfer für Jahwe verbrennen.[a] So soll der Priester für ihn Sühne erwirken wegen der Sünde, die er begangen hat; dann wird ihm vergeben werden.
  rationale: Die Revision beseitigt die unidiomatische und potenziell missverständliche Haupttextformulierung zu עַל אִשֵּׁי יְהוָה und verlegt deren wörtlichere Nuance in die Fußnote. Ferner wird der unklare maskuline Bezug von „sein Fett“ neutral formuliert. Der Sinn, die kultische Terminologie, der Gottesname, der Plural von אֹתָם und die nicht näher bestimmte Vergebung bleiben erhalten.
