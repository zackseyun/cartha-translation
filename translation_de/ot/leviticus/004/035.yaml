id: LEV.4.35
reference: Leviticus 4:35
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אֶת כָּל חֶלְבָּ֣/ה יָסִ֗יר כַּ/אֲשֶׁ֨ר יוּסַ֥ר חֵֽלֶב הַ/כֶּשֶׂב֮ מִ/זֶּ֣בַח הַ/שְּׁלָמִים֒ וְ/הִקְטִ֨יר הַ/כֹּהֵ֤ן אֹתָ/ם֙ הַ/מִּזְבֵּ֔חָ/ה עַ֖ל אִשֵּׁ֣י יְהוָ֑ה וְ/כִפֶּ֨ר עָלָ֧י/ו הַ/כֹּהֵ֛ן עַל חַטָּאת֥/וֹ אֲשֶׁר חָטָ֖א וְ/נִסְלַ֥ח לֽ/וֹ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/035.yaml
  text: And he shall remove all its fat[a], just as the fat of the lamb is removed from the sacrifice of peace offerings, and the priest shall burn them on the altar, on the food offerings of Yahweh. Thus the priest shall make atonement for him concerning the sin that he committed, and he shall be forgiven.
translation:
  language: de
  text: Und das gesamte Fett soll er entfernen, so wie das Fett des Lammes vom Heilsopfer entfernt wird. Der Priester soll die Fettstücke auf dem Altar als Feueropfer für Jahwe verbrennen.[a] So soll der Priester für ihn Sühne erwirken wegen der Sünde, die er begangen hat; dann wird ihm vergeben werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „auf den Feueropfern Jahwes“. Der hebräische Ausdruck ist ein technischer Begriff der Opfersprache.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶלְבָּהּ / חֵלֶב
  choice: sein Fett / die Fettstücke
  rationale: חֵלֶב bezeichnet das für den Altar bestimmte Fett. Zunächst bleibt der Sammelbegriff „Fett“ stehen; beim pluralischen אֹתָם verdeutlicht „die Fettstücke“ die mehreren abgetrennten Teile.
- source_word: יָסִיר / יוּסַר
  choice: entfernen / entfernt wird
  rationale: Die Formen von סור bezeichnen hier das rituelle Abtrennen beziehungsweise Entfernen des Fettes.
- source_word: הַכֶּשֶׂב
  choice: das Lamm
  rationale: Im Opferkontext bezeichnet כֶּשֶׂב hier am natürlichsten ein Lamm.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: Heilsopfer
  rationale: „Heilsopfer“ ist eine etablierte deutsche Bezeichnung für diese Opferart und lässt die Bedeutungsspanne von Frieden, Wohlergehen und Gemeinschaft offen.
- source_word: וְהִקְטִיר
  choice: soll ... verbrennen
  rationale: Das Verb bezeichnet im Kult das Verbrennen beziehungsweise Aufsteigenlassen in Rauch auf dem Altar; „verbrennen“ ist im Zusammenhang klar und natürlich.
- source_word: אֹתָם
  choice: die Fettstücke
  rationale: Das hebräische Pronomen ist pluralisch. Die Wiederaufnahme als „Fettstücke“ bewahrt diesen Numerus, ohne im Deutschen ein unpassendes Pronomen an den singularischen Sammelbegriff „Fett“ anzuschließen.
- source_word: עַל אִשֵּׁי יְהוָה
  choice: auf den Feueropfern für Jahwe
  rationale: אִשֶּׁה ist ein technischer Opferausdruck, wahrscheinlich für etwas, das im Feuer dargebracht wird. Die Wiedergabe wahrt den Bezug von עַל und vermeidet die unsichere Ableitung „Speiseopfer“ im Haupttext.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְכִפֶּר עָלָיו
  choice: soll ... für ihn Sühne erwirken
  rationale: Die Formulierung gibt die priesterliche Kulttätigkeit wieder, ohne eine bestimmte systematische Sühnetheorie festzulegen.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: wegen der Sünde, die er begangen hat
  rationale: Dies gibt den Bezug der Sühnehandlung auf die konkrete begangene Sünde in natürlichem Deutsch wieder.
- source_word: וְנִסְלַח לוֹ
  choice: dann wird ihm vergeben werden
  rationale: Die unpersönliche Passivkonstruktion entspricht dem hebräischen Passiv und lässt den göttlichen Urheber der Vergebung implizit.
theological_decisions:
- issue: Wiedergabe der kultischen Sühnesprache
  choice: für ihn Sühne erwirken
  alternative: für ihn Sühne schaffen / für ihn Versöhnung erwirken
  rationale: „Sühne erwirken“ bewahrt den kultisch-theologischen Gehalt von כפר, ohne dessen Wirkweise enger zu bestimmen, als es der Vers selbst tut.
- issue: Wiedergabe von זֶבַח הַשְּׁלָמִים
  choice: Heilsopfer
  alternative: Friedensopfer / Gemeinschaftsopfer
  rationale: Die hebräische Opferbezeichnung trägt mehrere mögliche Assoziationen. „Heilsopfer“ ist im Deutschen verständlich und etabliert, ohne die Kategorie ausschließlich auf Frieden oder Gemeinschaft zu verengen.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen; seine Wiedergabe als „Jahwe“ bewahrt diese Unterscheidung gegenüber einem bloßen Titel.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt nahe am hebräischen Ritualablauf. „Fettstücke“ löst den Numeruswechsel zwischen dem kollektiven „Fett“ und dem pluralischen hebräischen Pronomen transparent; die passive Vergebungsformel bewahrt die zurückhaltende Ausdrucksweise des Ausgangstextes.
