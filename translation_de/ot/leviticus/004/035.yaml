  - severity: low
    issue: „sein Fett“
    rationale: Der feminine Suffix bezieht sich im unmittelbaren Kontext auf das weibliche Opfertier. Ein maskuliner deutscher Possessivartikel ist daher missverständlich; „das gesamte Fett“ wahrt den Bezug ohne unnötigen Genuskonflikt.
