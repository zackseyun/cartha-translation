  naturalness: Die revidierte Fassung verwendet modernes, würdiges Standarddeutsch. „Das gesamte Fett“ vermeidet einen unklaren Genusbezug, und „auf dem Altar als Feueropfer für Jahwe“ ist idiomatischer als „auf den Feueropfern für Jahwe“.
  terminology: „Heilsopfer“, „Sühne erwirken“ und „Jahwe“ sind geeignete, nicht konfessionell verengende Wiedergaben. „Feueropfer“ bleibt als technischer kultischer Ausdruck erhalten. Die Anmerkung erläutert die wörtlichere Präpositionsfügung, ohne eine unsichere Deutung als „Speiseopfer“ zu behaupten.
