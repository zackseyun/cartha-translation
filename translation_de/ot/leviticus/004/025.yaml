id: LEV.4.25
reference: Leviticus 4:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/לָקַ֨ח הַ/כֹּהֵ֜ן מִ/דַּ֤ם הַֽ/חַטָּאת֙ בְּ/אֶצְבָּע֔/וֹ וְ/נָתַ֕ן עַל קַרְנֹ֖ת מִזְבַּ֣ח הָ/עֹלָ֑ה וְ/אֶת דָּמ֣/וֹ יִשְׁפֹּ֔ךְ אֶל יְס֖וֹד מִזְבַּ֥ח הָ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/025.yaml
  text: Then the priest shall take some of the blood of the sin offering with his finger and put it on the horns of the altar of burnt offering[a], and he shall pour out the rest of its blood at the base of the altar of burnt offering.
translation:
  language: de
  text: Dann soll der Priester mit seinem Finger etwas vom Blut des Sündopfers[a] nehmen und es an die Hörner des Brandopferaltars streichen. Das übrige Blut soll er an den Fuß des Brandopferaltars gießen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Reinigungsopfer“. Das hebräische Wort kann ein Opfer bezeichnen, das sowohl mit der Beseitigung von Unreinheit als auch mit Sünde verbunden ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Dann soll … nehmen
  rationale: Die Form führt die schrittweise Ritualanweisung fort; „Dann soll“ gibt diesen Ablauf in natürlichem deutschem Vorschriftenstil wieder.
- source_word: מִדַּם
  choice: etwas vom Blut
  rationale: 'Die Präposition מִן ist hier partitiv: Der Priester nimmt nur einen Teil des Blutes zur Anwendung an den Altarhörnern.'
- source_word: הַחַטָּאת
  choice: des Sündopfers
  rationale: Im Opferkontext bezeichnet חַטָּאת das Opfer beziehungsweise Opfertier und nicht abstrakt die Sünde. „Sündopfer“ ist die verständliche, herkömmliche Bezeichnung; die mögliche Wiedergabe „Reinigungsopfer“ wird in der Fußnote bewahrt.
- source_word: בְּאֶצְבָּעוֹ
  choice: mit seinem Finger
  rationale: Die Präposition ב bezeichnet hier das Mittel, mit dem der Priester das Blut nimmt beziehungsweise aufträgt.
- source_word: וְנָתַן עַל
  choice: und es an … streichen
  rationale: Das allgemeine hebräische „geben auf/an“ bezeichnet im konkreten Ritualzusammenhang das Auftragen von Blut. „Streichen“ formuliert die Handlung im Deutschen anschaulich und idiomatisch.
- source_word: קַרְנוֹת
  choice: die Hörner
  rationale: Gemeint sind die hornartigen Vorsprünge des Altars; „Hörner“ ist die sachlich genaue und etablierte Kultbezeichnung.
- source_word: מִזְבַּח הָעֹלָה
  choice: des Brandopferaltars
  rationale: Das deutsche Kompositum bezeichnet klar und knapp den Altar, auf dem Brandopfer dargebracht wurden.
- source_word: וְאֶת־דָּמוֹ יִשְׁפֹּךְ
  choice: Das übrige Blut soll er … gießen
  rationale: Nachdem zuvor ausdrücklich ein Teil des Blutes genommen wurde, macht „das übrige Blut“ die im Hebräischen vorausgesetzte Fortsetzung verständlich, ohne einen neuen Ritualschritt hinzuzufügen.
- source_word: אֶל יְסוֹד
  choice: an den Fuß
  rationale: יְסוֹד bezeichnet den unteren Grund- oder Sockelbereich des Altars. „An den Fuß“ ist im Deutschen eine natürliche räumliche Wiedergabe.
theological_decisions:
- issue: Wiedergabe von חַטָּאת in der Opfergesetzgebung
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: Der Ausdruck bezeichnet hier eindeutig eine Opferkategorie, lässt aber hinsichtlich ihrer Funktion sowohl den Bezug auf Sünde als auch auf kultische Reinigung anklingen. Der Haupttext verwendet die geläufige Bezeichnung, während die Fußnote die sachlich mögliche Alternative offenhält.
translation_notes:
  register: Moderner, würdevoller und gut verständlicher Vorschriftenstil. Die kultischen Fachbegriffe „Sündopfer“, „Brandopferaltar“ und „Hörner“ bleiben erhalten; die Satzfolge bildet die einzelnen Ritualschritte klar ab.
