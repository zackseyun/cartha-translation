  text: וְ/לָקַ֛ח הַ/כֹּהֵ֥ן הַ/מָּשִׁ֖יחַ מִ/דַּ֣ם הַ/פָּ֑ר וְ/הֵבִ֥יא אֹת֖/וֹ אֶל אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/005.yaml
  text: And the anointed priest shall take some of the bull's blood and bring it into the tent of meeting[a][b].
translation:
  language: de
  text: Dann soll der gesalbte Priester etwas vom Blut des Stieres nehmen und es zum Zelt der Begegnung bringen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in das Zelt der Begegnung bringen“. Das Hebräische lautet wörtlich „zum Zelt der Begegnung“; der folgende Ritualablauf setzt voraus, dass der Priester hineingeht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Dann soll … nehmen
  rationale: Das Waw mit Qatal führt die kultische Handlungsanweisung fort. Im Deutschen gibt „Dann soll“ sowohl die Abfolge als auch den anweisenden Charakter natürlich wieder.
- source_word: הַכֹּהֵן הַמָּשִׁיחַ
  choice: der gesalbte Priester
  rationale: Die Wiedergabe bewahrt den ausdrücklichen Bezug auf die Salbung, ohne die deutende Amtsbezeichnung „Hohepriester“ einzusetzen oder eine spätere messianische Bedeutung einzutragen.
- source_word: מִדַּם הַפָּר
  choice: etwas vom Blut des Stieres
  rationale: 'מִן ist hier am besten partitiv zu verstehen: Der Priester nimmt einen Teil des Blutes. „Vom Blut des Stieres“ bildet die hebräische Beziehung natürlich und präzise ab.'
- source_word: וְהֵבִיא אֹתוֹ
  choice: und es … bringen
  rationale: Das Suffix bezieht sich auf das zuvor genannte Blut. Das Modalverb „soll“ gilt im koordinierten deutschen Satz auch für „bringen“.
- source_word: אֶל אֹהֶל מוֹעֵד
  choice: zum Zelt der Begegnung
  rationale: אֶל bezeichnet zunächst die Bewegung hin zu einem Ziel. „Zum“ bewahrt diese sprachliche Offenheit; der weitere Ritualablauf macht deutlich, dass der Priester anschließend im Zelt handelt.
theological_decisions:
- issue: Wiedergabe von הַכֹּהֵן הַמָּשִׁיחַ
  choice: der gesalbte Priester
  alternative: der Hohepriester; der geweihte Priester
  rationale: „Gesalbt“ entspricht dem hebräischen Ausdruck unmittelbar und wahrt die kultische Amtsbezeichnung, ohne sie durch eine funktionale Gleichsetzung oder christologische Deutung zu ersetzen.
- issue: Richtungsaussage bei אֶל אֹהֶל מוֹעֵד
  choice: zum Zelt der Begegnung
  alternative: in das Zelt der Begegnung
  rationale: Die Präposition bedeutet wörtlich „zu/auf … hin“. Der Kontext legt ein Hineingehen nahe, doch der Vers selbst formuliert dies nicht ausdrücklich; die Übersetzung wahrt daher die genuine sprachliche Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Zelt der Begegnung“ ist verständlich und gibt מוֹעֵד als bezeichnete Begegnung wieder. Die Satzstruktur bleibt nah am hebräischen Verfahrensstil, ohne im Deutschen schwerfällig zu wirken.
