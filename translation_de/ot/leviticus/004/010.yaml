  text: just as it is removed from the ox of the sacrifice of peace offerings[a], and the priest shall burn them on the altar of burnt offering.
translation:
  language: de
  text: wie man es vom Stier des Heilsopfers abhebt[a], und der Priester soll sie auf dem Brandopferaltar in Rauch aufgehen lassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: Friedensopfer oder Gemeinschaftsopfer. Die genaue Bedeutung der hebräischen Opferbezeichnung ist nicht völlig eindeutig.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: so wie
  rationale: Leitet den Vergleich mit dem bereits geregelten Verfahren beim Heilsopfer natürlich und präzise ein.
- source_word: יוּרַם
  choice: abgehoben wird
  rationale: Bewahrt sowohl die Grundbedeutung des Hophal von רום („emporgehoben werden“) als auch den kultischen Sinn des Abnehmens der Fettstücke vom Tier.
- source_word: מִשּׁוֹר
  choice: vom Rind
  rationale: שׁוֹר bezeichnet ein Tier der Rindergattung; „Rind“ ist hier im Deutschen natürlich und legt das Geschlecht nicht unnötig fest.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: des Heilsopfers
  rationale: „Heilsopfer“ ist eine knappe, etablierte Wiedergabe des kultischen Ausdrucks und wahrt dessen Verbindung zu שׁלם, ohne den Sinn ausschließlich als Gemeinschaft oder Frieden auszulegen.
- source_word: וְהִקְטִירָם
  choice: Der Priester soll sie ... in Rauch aufgehen lassen
  rationale: Gibt die kultische Bedeutung des Hiphil von קטר genauer wieder als bloßes „verbrennen“; das Suffix „sie“ verweist auf die zuvor genannten Fettstücke.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Übliche und eindeutige Wiedergabe der kultischen Amtsbezeichnung.
- source_word: עַל מִזְבַּח הָעֹלָה
  choice: auf dem Brandopferaltar
  rationale: Natürliche deutsche Zusammensetzung für den Altar, der dem Brandopfer zugeordnet ist.
theological_decisions:
- issue: Bedeutung von זֶבַח הַשְּׁלָמִים
  choice: Heilsopfer
  alternative: Friedensopfer; Gemeinschaftsopfer
  rationale: Der hebräische Kultbegriff besitzt einen breiteren Bedeutungsraum, als eine einzelne interpretierende deutsche Benennung ausdrücken kann. „Heilsopfer“ wahrt die traditionelle Nähe zur Wortwurzel, ohne den theologischen Sinn weiter festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „In Rauch aufgehen lassen“ erhält den besonderen Opferwortschatz. Der Satzanschluss bleibt wie im Hebräischen vergleichend und setzt die in Vers 9 genannten Fettstücke als Bezug von „es“ beziehungsweise „sie“ voraus.
