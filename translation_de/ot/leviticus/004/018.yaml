- from: Und von dem Blut soll er etwas an die Hörner des Altars tun, der vor Jahwe[a] im Zelt der Begegnung steht. Das ganze Blut aber soll er an den Sockel des Brandopferaltars gießen, der am Eingang des Zeltes der Begegnung steht.
  to: Und etwas von dem Blut soll er auf die Hörner des Altars geben, der vor Jahwe steht und sich im Zelt der Begegnung befindet[a]. Das ganze Blut aber soll er an den Sockel des Brandopferaltars ausgießen, der am Eingang des Zeltes der Begegnung steht.
  rationale: Die Revision ersetzt allein die unnatürliche Verbindung „an die Hörner … tun“ durch die idiomatische, quellennahe Formulierung „auf die Hörner … geben“. Außerdem werden die beiden Ortsangaben zum ersten Altar explizit und ohne Bedeutungszuwachs wiedergegeben. „Ausgießen“ entspricht שׁפך präziser als das bloße „gießen“.
