  text: וּ/מִן הַ/דָּ֞ם יִתֵּ֣ן עַל קַרְנֹ֣ת הַ/מִּזְבֵּ֗חַ אֲשֶׁר֙ לִ/פְנֵ֣י יְהוָ֔ה אֲשֶׁ֖ר בְּ/אֹ֣הֶל מוֹעֵ֑ד וְ/אֵ֣ת כָּל הַ/דָּ֗ם יִשְׁפֹּךְ֙ אֶל יְסוֹד֙ מִזְבַּ֣ח הָ/עֹלָ֔ה אֲשֶׁר פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/018.yaml
  text: And from the blood he shall put some on the horns of the altar that is before Yahweh[a], which is in the tent of meeting, and all the blood he shall pour out at the base of the altar of burnt offering, which is at the entrance of the tent of meeting.
translation:
  language: de
  text: Und etwas von dem Blut soll er auf die Hörner des Altars geben, der vor Jahwe steht und sich im Zelt der Begegnung befindet[a]. Das ganze Blut aber soll er an den Sockel des Brandopferaltars ausgießen, der am Eingang des Zeltes der Begegnung steht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH (יהוה), der Gottesname; hier mit „Jahwe“ wiedergegeben.'
    reason: Kennzeichnung und Erläuterung des im Ausgangstext stehenden Gottesnamens.
lexical_decisions:
- source_word: וּמִן הַדָּם
  choice: Und von dem Blut … etwas
  rationale: Die hebräische Formulierung beginnt wörtlich mit „und von dem Blut“. Das ergänzte „etwas“ verdeutlicht den partitiven Sinn und bildet den Gegensatz zu „das ganze Blut“ im zweiten Satzteil ab.
- source_word: יִתֵּן
  choice: soll er … tun
  rationale: נתן bedeutet gewöhnlich „geben, setzen, tun“. „An die Hörner … tun“ ist direkt, verständlich und weniger technisch als „auftragen“.
- source_word: קַרְנֹת הַמִּזְבֵּחַ
  choice: die Hörner des Altars
  rationale: Die wörtliche kultische Bezeichnung „Hörner“ wird bewahrt und nicht durch eine erklärende Umschreibung ersetzt.
- source_word: אֲשֶׁר לִפְנֵי יְהוָה
  choice: der vor Jahwe … steht
  rationale: לִפְנֵי bezeichnet hier primär die räumliche Lage „vor“ Jahwe. Das ergänzte „steht“ ergibt im Deutschen einen natürlichen Relativsatz.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֹהֶל מוֹעֵד
  choice: Zelt der Begegnung
  rationale: Die Wendung gibt beide Bestandteile transparent wieder und ist im modernen Deutschen verständlich.
- source_word: וְאֵת כָּל הַדָּם
  choice: Das ganze Blut aber
  rationale: Der hebräische Wortlaut „alles/das ganze Blut“ bleibt erhalten. „Aber“ macht den im Kontext liegenden Gegensatz zu dem zuvor entnommenen Teil natürlich sichtbar, ohne „den Rest“ in den Text einzutragen.
- source_word: יִשְׁפֹּךְ
  choice: soll er … gießen
  rationale: שׁפך bezeichnet das Ausgießen einer Flüssigkeit; „gießen“ ist hier idiomatisch und der Zielangabe „an den Sockel“ angemessen.
- source_word: אֶל יְסוֹד
  choice: an den Sockel
  rationale: יְסוֹד kann „Grundlage, Fundament, Sockel“ bedeuten. Beim Altar bezeichnet „Sockel“ den unteren baulichen Bereich präzise und natürlich.
- source_word: מִזְבַּח הָעֹלָה
  choice: Brandopferaltar
  rationale: Das deutsche Kompositum ist knapp, gebräuchlich und bewahrt den Bezug auf das Brandopfer.
- source_word: אֲשֶׁר פֶּתַח אֹהֶל מוֹעֵד
  choice: der am Eingang des Zeltes der Begegnung steht
  rationale: פֶּתַח wird räumlich als „Eingang“ wiedergegeben; das im Deutschen ergänzte „steht“ verdeutlicht, dass sich der Relativsatz auf den Altar bezieht.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ bewahrt ihn als persönlichen Gottesnamen, statt ihn durch den Titel „der HERR“ zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter kultischer Fachsprache. Die Satzstruktur wurde zur besseren Verständlichkeit in zwei Sätze gegliedert. Die Relativsätze bleiben sachlich eng am hebräischen Text.
