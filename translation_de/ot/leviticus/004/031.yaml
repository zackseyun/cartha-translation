source:
  edition: WLC
  text: וְ/אֶת כָּל חֶלְבָּ֣/הּ יָסִ֗יר כַּ/אֲשֶׁ֨ר הוּסַ֣ר חֵלֶב֮ מֵ/עַ֣ל זֶ֣בַח הַ/שְּׁלָמִים֒ וְ/הִקְטִ֤יר הַ/כֹּהֵן֙ הַ/מִּזְבֵּ֔חָ/ה לְ/רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָ֑ה וְ/כִפֶּ֥ר עָלָ֛י/ו הַ/כֹּהֵ֖ן וְ/נִסְלַ֥ח לֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/031.yaml
  text: And he shall remove all its fat[a], just as the fat is removed from the sacrifice of peace offerings, and the priest shall burn it on the altar as a pleasing aroma to Yahweh. And the priest shall make atonement for him[b], and he will be forgiven.
translation:
  language: de
  text: Er soll all ihr Fett entfernen, so wie das Fett vom Friedensopfer[a] entfernt wird. Der Priester soll es auf dem Altar zu einem wohlgefälligen Duft[b] für den HERRN verbrennen. Der Priester soll für ihn Sühne erwirken, und ihm wird vergeben werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gemeinschaftsopfer“.'
    reason: lexical_alternative
  - marker: b
    text: „Ein wohlgefälliger Duft“ ist eine feststehende Opferformel und bezeichnet ein Opfer, das der HERR annimmt.
    reason: cultural_note
lexical_decisions:
- source_word: חֶלְבָּהּ / חֵלֶב
  choice: ihr Fett / das Fett
  rationale: Das hebräische Wort bezeichnet hier das für die Opferung abzutrennende Fett. „Fett“ ist die direkte, verständliche Entsprechung; „Fettstücke“ wäre erklärender, als der Wortlaut verlangt.
- source_word: יָסִיר
  choice: soll … entfernen
  rationale: Der Hifil von סור bezeichnet hier das Wegnehmen beziehungsweise Abtrennen und hat in diesem Gesetzestext anweisenden Charakter.
- source_word: כַּאֲשֶׁר הוּסַר
  choice: so wie … entfernt wird
  rationale: Die Formulierung verweist auf das festgelegte Verfahren beim Friedensopfer. Das deutsche Passiv bewahrt den verfahrensbezogenen Vergleich.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: Friedensopfer
  rationale: „Friedensopfer“ ist die herkömmliche, lexikalisch naheliegende Bezeichnung dieser Opfergattung; „Gemeinschaftsopfer“ bringt einen möglichen Bedeutungsaspekt stärker interpretierend zum Ausdruck.
- source_word: וְהִקְטִיר
  choice: soll es … verbrennen
  rationale: Im Opferkontext bezeichnet das Verb das Verbrennen auf dem Altar. Die ausdrückliche Nennung des Altars macht die kultische Handlung hinreichend deutlich.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: als einen wohlgefälligen Duft
  rationale: Die feste Opferformel wird bildhaft und zugleich in verständlichem, würdigem Deutsch wiedergegeben, ohne ihre Aussage über die Annahme des Opfers auszudeuten.
- source_word: לַיהוָה
  choice: für den HERRN
  rationale: Der Gottesname יהוה wird entsprechend der verbreiteten deutschen Bibelkonvention mit „der HERR“ wiedergegeben; die Präposition bezeichnet hier die Ausrichtung der Opfergabe.
- source_word: וְכִפֶּר עָלָיו
  choice: Der Priester soll für ihn Sühne vollziehen
  rationale: Die Formulierung bewahrt die kultische Bedeutung von כפר sowie den Bezug auf die betroffene Person, ohne einen späteren theologischen Mechanismus in den Text einzutragen.
- source_word: וְנִסְלַח לוֹ
  choice: und ihm wird vergeben werden
  rationale: Die passive Form und das Ergebnis der priesterlichen Sühnehandlung bleiben erhalten; wer vergibt, wird wie im Hebräischen nicht ausdrücklich genannt.
theological_decisions:
- issue: Zusammenhang von priesterlicher Sühnehandlung und Vergebung
  choice: Der Priester soll für ihn Sühne vollziehen, und ihm wird vergeben werden.
  alternative: Der Priester soll für ihn Sühne erwirken, und ihm wird vergeben werden.
  rationale: „Sühne vollziehen“ hält die priesterliche Kulthandlung und die folgende Vergebung zusammen, ohne die Art der Wirksamkeit näher zu bestimmen oder eine zusätzliche dogmatische Erklärung einzuführen.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: der HERR
  alternative: JHWH
  rationale: Die traditionelle deutsche Wiedergabe ist für gewöhnliche Leser verständlich und erkennbar; die Großschreibung kennzeichnet, dass im Ausgangstext der Eigenname steht.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem gesetzlich-kultischem Ton. Die Satzfolge folgt den hebräischen Handlungen, ohne den einfachen Anschluss durch eine zusätzliche Folgerung wie „somit“ zu verstärken. Alle Fußnotenmarker stehen unmittelbar bei dem Ausdruck, den sie erläutern.
