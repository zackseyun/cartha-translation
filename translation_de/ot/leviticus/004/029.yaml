id: LEV.4.29
reference: Leviticus 4:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/סָמַךְ֙ אֶת יָד֔/וֹ עַ֖ל רֹ֣אשׁ הַֽ/חַטָּ֑את וְ/שָׁחַט֙ אֶת הַ֣/חַטָּ֔את בִּ/מְק֖וֹם הָ/עֹלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/029.yaml
  text: And he shall lay his hand on the head of the sin offering and slaughter the sin offering in the place of the burnt offering[a].
translation:
  language: de
  text: Er soll seine Hand auf den Kopf des Sündopfers legen und das Sündopfer an der Stelle schlachten, an der das Brandopfer geschlachtet wird.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Reinigungsopfer“. Das hebräische Wort חטאת kann das mit Sünde und Reinigung verbundene Opfer bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ
  choice: Er soll … legen
  rationale: סמך bezeichnet im Opferzusammenhang das Auflegen beziehungsweise Aufstützen der Hand. Die deutsche Vorschriftsform mit „soll“ gibt die Verfahrensanweisung natürlich wieder.
- source_word: יָדוֹ
  choice: seine Hand
  rationale: Der hebräische Ausdruck steht im Singular und wird daher nicht zu „seine Hände“ verallgemeinert.
- source_word: עַל רֹאשׁ
  choice: auf den Kopf
  rationale: Die räumliche Beziehung und die konkrete rituelle Handlung werden direkt und idiomatisch wiedergegeben.
- source_word: הַחַטָּאת
  choice: das Sündopfer
  rationale: חטאת bezeichnet hier eindeutig das dargebrachte Opfertier. „Sündopfer“ ist die geläufige deutsche Fachbezeichnung; die ebenfalls mögliche Deutung als Reinigungsopfer wird in der Fußnote bewahrt.
- source_word: וְשָׁחַט
  choice: schlachten
  rationale: שחט ist der sachgerechte Ausdruck für das rituelle Schlachten eines Opfertiers und genauer als das allgemeinere „töten“.
- source_word: בִּמְקוֹם הָעֹלָה
  choice: an der Stelle …, an der das Brandopfer geschlachtet wird
  rationale: Wörtliches „am Ort des Brandopfers“ wäre im Deutschen mehrdeutig. Die Formulierung bezeichnet klar den für die Schlachtung des Brandopfers bestimmten Ort, ohne einen zusätzlichen Ort einzuführen.
- source_word: הָעֹלָה
  choice: das Brandopfer
  rationale: „Brandopfer“ ist die etablierte und sachlich passende deutsche Wiedergabe des Opferbegriffs עֹלָה.
theological_decisions:
- issue: Wiedergabe von חטאת in der Opfergesetzgebung
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: Der Kontext verlangt eine Opferbezeichnung. „Sündopfer“ wahrt den erkennbaren Bezug zur Sünde und ist allgemein verständlich; „Reinigungsopfer“ hebt die reinigende Wirkung des Ritus hervor, ist aber stärker deutend. Die echte lexikalische Spannweite wird in der Fußnote genannt.
- issue: Verbform der rituellen Anweisung
  choice: Er soll … legen und … schlachten
  alternative: Und er legte … und schlachtete
  rationale: Obwohl die hebräischen Formen formal eine Handlungsfolge ausdrücken, stehen sie hier innerhalb gesetzlicher Verfahrensanweisungen. Die deutsche Soll-Form vermittelt diesen normativen Charakter klar und natürlich.
translation_notes:
  register: Moderne, würdige Standardsprache mit geläufigen kultischen Fachbegriffen. Der Satz bleibt knapp und verfahrensorientiert; die Fußnote bewahrt die Bedeutungsbreite von חטאת.
