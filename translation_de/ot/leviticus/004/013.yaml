source:
  edition: WLC
  text: וְ/אִ֨ם כָּל עֲדַ֤ת יִשְׂרָאֵל֙ יִשְׁגּ֔וּ וְ/נֶעְלַ֣ם דָּבָ֔ר מֵ/עֵינֵ֖י הַ/קָּהָ֑ל וְ֠/עָשׂוּ אַחַ֨ת מִ/כָּל מִצְוֺ֧ת יְהוָ֛ה אֲשֶׁ֥ר לֹא תֵעָשֶׂ֖ינָה וְ/אָשֵֽׁמוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/013.yaml
  text: And if the whole congregation of Israel sins unintentionally[a], and the matter is hidden from the eyes of the assembly, and they do one of all the things that Yahweh has commanded not to be done, and they become guilty[d][c][b],
translation:
  language: de
  text: Wenn aber die ganze Gemeinde Israels sich unabsichtlich verfehlt[a], die Sache den Augen der Versammlung verborgen bleibt[b] und sie etwas tut, was nach einem der Gebote Yahwehs nicht getan werden darf, und dadurch schuldig wird,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus Versehen irrt“. Gemeint ist eine unbeabsichtigte Verfehlung, nicht bewusste Auflehnung.'
    reason: lexical_alternative
  - marker: b
    text: „Den Augen der Versammlung verborgen“ ist eine hebräische Wendung dafür, dass die Versammlung den betreffenden Verstoß nicht bemerkt hat.
    reason: cultural_note
lexical_decisions:
- source_word: עֲדַת יִשְׂרָאֵל
  choice: die ganze Gemeinde Israels
  rationale: עֵדָה bezeichnet hier die gesamte Gemeinschaft Israels; „Gemeinde“ ist im kultisch-rechtlichen Zusammenhang würdig und geläufig. Für הַקָּהָל wird zur Wahrung der lexikalischen Unterscheidung „Versammlung“ verwendet.
- source_word: יִשְׁגּוּ
  choice: sich unabsichtlich verfehlt
  rationale: שׁגה bezeichnet in diesem Opfergesetz eine aus Irrtum oder Versehen begangene Verfehlung, nicht vorsätzlichen Trotz. Die Formulierung macht diese rechtlich-theologische Kategorie ausdrücklich.
- source_word: וְנֶעְלַם דָּבָר מֵעֵינֵי הַקָּהָל
  choice: die Sache den Augen der Versammlung verborgen bleibt
  rationale: Die Übersetzung bewahrt das hebräische Wahrnehmungsbild „vor den Augen verborgen“, bleibt aber im Deutschen verständlich; „die Sache“ bezeichnet den betreffenden Verstoß oder Sachverhalt.
- source_word: וְעָשׂוּ אַחַת מִכָּל מִצְוֺת יְהוָה אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: sie eines von all den Geboten Yahwehs übertreten, die nicht übertreten werden dürfen
  rationale: 'Wörtlich ist die Konstruktion schwierig: Sie tun „eines“ aus der Gesamtheit der Gebote, die nicht getan werden dürfen. Im Deutschen bringt „ein Gebot übertreten“ den gemeinten verbotenen Akt natürlich zum Ausdruck und erhält mit „eines von all den Geboten“ den Umfang von מִכָּל.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְאָשֵׁמוּ
  choice: dadurch schuldig werden
  rationale: Das Verb bezeichnet den infolge der Tat eintretenden Schuldstatus beziehungsweise die Schuldhaftigkeit. „Dadurch“ verdeutlicht den resultativen Zusammenhang, ohne eine Sühnetheorie einzutragen.
theological_decisions:
- issue: Art der durch שׁגה bezeichneten Sünde
  choice: unabsichtliche Verfehlung
  alternative: irren / abirren
  rationale: Der Zusammenhang von Levitikus 4 betrifft aus Versehen begangene Verstöße. Die Übersetzung grenzt diese von vorsätzlicher Auflehnung ab, ohne die tatsächliche Schuld aufzuheben.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR
  rationale: Der Ausgangstext nennt den persönlichen Gottesnamen; dessen Transliteration bewahrt diese Unterscheidung gegenüber einem bloßen Titel.
- issue: Verhältnis zwischen unbeabsichtigter Tat und Schuld
  choice: und dadurch schuldig werden
  alternative: und Schuld auf sich laden
  rationale: 'Der Vers hält beides zusammen: Die Tat ist unbeabsichtigt beziehungsweise zunächst unerkannt, führt aber dennoch zu Schuld. Diese Spannung wird nicht aufgelöst.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rechtlich-kultischem Ton. Die Satzstruktur folgt dem konditionalen Aufbau des Hebräischen; der Vers endet wie der Ausgangstext mit einem Komma, da der Gedanke im folgenden Vers fortgeführt wird. „Gemeinde“ und „Versammlung“ unterscheiden עֵדָה und קָהָל, ohne einen sachlichen Gegensatz zu erzwingen.
