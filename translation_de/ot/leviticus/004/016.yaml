id: LEV.4.16
reference: Leviticus 4:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הֵבִ֛יא הַ/כֹּהֵ֥ן הַ/מָּשִׁ֖יחַ מִ/דַּ֣ם הַ/פָּ֑ר אֶל אֹ֖הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/016.yaml
  text: Then the anointed priest shall bring some of the bull's blood into the tent of meeting[a][b].
translation:
  language: de
  text: Dann soll der gesalbte Priester etwas von dem Blut des Stieres in das Zelt der Begegnung bringen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „von dem Blut des Stieres“. Das Hebräische ist wahrscheinlich im Sinn eines Teils zu verstehen: Nur etwas von dem Blut wird hineingebracht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הֵבִיא
  choice: Dann soll … bringen
  rationale: Das mit וְ verbundene Hifil-Perfekt führt die Abfolge der Ritualanweisungen fort. „Dann soll“ gibt sowohl die zeitliche Folge als auch den Weisungscharakter in natürlichem Deutsch wieder.
- source_word: הַ/כֹּהֵן
  choice: der Priester
  rationale: Die übliche und sachlich passende Wiedergabe von כֹּהֵן im kultischen Zusammenhang.
- source_word: הַ/מָּשִׁיחַ
  choice: gesalbte
  rationale: Das Wort bezeichnet hier den durch Salbung in sein Amt eingesetzten Priester. „Gesalbt“ bewahrt den hebräischen Ausdruck, ohne ihn als messianischen Titel misszuverstehen.
- source_word: מִ/דַּם
  choice: etwas von dem Blut
  rationale: 'מִן ist hier wahrscheinlich partitiv gebraucht: Nicht das gesamte Blut, sondern ein Teil davon wird hineingebracht. Die gewählte Formulierung ist im Deutschen klar und idiomatisch.'
- source_word: הַ/פָּר
  choice: des Stieres
  rationale: פַּר bezeichnet im Opferkontext einen Stier. „Des Stieres“ entspricht der hebräischen Genitivbeziehung und klingt im Deutschen natürlich.
- source_word: אֶל
  choice: in
  rationale: Obwohl אֶל grundsätzlich „zu“ bedeuten kann, bezeichnet es hier das Ziel einer Bewegung in den heiligen Raum hinein; daher ist „in“ im Deutschen angemessen.
- source_word: אֹהֶל מוֹעֵד
  choice: das Zelt der Begegnung
  rationale: Die Wendung gibt die Bestandteile des hebräischen Heiligtumsnamens transparent wieder und ist für heutige Leser verständlicher als das traditionelle „Stiftshütte“.
theological_decisions:
- issue: Bedeutung von הַמָּשִׁיחַ im priesterlichen Zusammenhang
  choice: gesalbte
  alternative: geweihte; Messias
  rationale: Hier fungiert der Ausdruck als Amtsbeschreibung des durch Salbung eingesetzten Priesters, nicht als messianischer Titel. „Geweihte“ wäre stärker deutend, „Messias“ in diesem Zusammenhang irreführend.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, verständlichem Gesetzesstil. „Zelt der Begegnung“ wahrt die Bildsprache des Hebräischen; das traditionelle „Stiftshütte“ wurde vermieden, weil es weniger transparent ist.
