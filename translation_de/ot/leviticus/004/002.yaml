id: LEV.4.2
reference: Leviticus 4:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֣י יִשְׂרָאֵ֘ל לֵ/אמֹר֒ נֶ֗פֶשׁ כִּֽי תֶחֱטָ֤א בִ/שְׁגָגָה֙ מִ/כֹּל֙ מִצְוֺ֣ת יְהוָ֔ה אֲשֶׁ֖ר לֹ֣א תֵעָשֶׂ֑ינָה וְ/עָשָׂ֕ה מֵ/אַחַ֖ת מֵ/הֵֽנָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/002.yaml
  text: 'Speak to the sons of Israel[a], saying: If a person sins unintentionally in regard to any of the commandments of Yahweh concerning things that should not be done, and does one of them[b],'
translation:
  language: de
  text: 'Rede zu den Söhnen Israels[a] und sag: Wenn jemand unabsichtlich[b] sündigt, indem er gegen irgendeines der Gebote Jahwes verstößt und eine der Handlungen begeht, die nicht getan werden dürfen,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder „zu den Kindern Israels“ beziehungsweise „zu den Israeliten“; wörtlich: „zu den Söhnen Israels“.'
    reason: lexical_alternative
  - marker: b
    text: Oder „aus Versehen“ beziehungsweise „irrtümlich“; gemeint ist eine nicht vorsätzlich begangene Sünde.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר ... לֵאמֹר
  choice: Rede ... und sag
  rationale: Gibt die Aufforderung samt Einleitung der direkten Rede im Deutschen natürlich und zugleich formnah wieder.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Bewahrt die familiäre Bildsprache des hebräischen Ausdrucks; eine Fußnote nennt geläufigere deutsche Alternativen.
- source_word: נֶפֶשׁ
  choice: jemand
  rationale: נֶפֶשׁ bezeichnet hier idiomatisch eine einzelne Person, nicht speziell eine immaterielle Seele.
- source_word: בִשְׁגָגָה
  choice: unabsichtlich
  rationale: Bezeichnet ein aus Versehen oder Irrtum begangenes Vergehen im Gegensatz zu vorsätzlichem, trotzigem Handeln.
- source_word: מִכֹּל מִצְוֺת יְהוָה
  choice: gegen eines der Gebote Jahwes
  rationale: Die מן-Konstruktion bezeichnet hier den Bezugspunkt des Verstoßes; „gegen eines ... verstoßen“ ist im deutschen Rechts- und Alltagssprachgebrauch klar.
- source_word: אֲשֶׁר לֹא תֵעָשֶׂינָה וְעָשָׂה מֵאַחַת מֵהֵנָּה
  choice: und eine der Handlungen begeht, die nicht getan werden dürfen
  rationale: Gibt den sachlichen Sinn der hebräischen Verbotsformel verständlich wieder, ohne das im Deutschen missverständliche „eines der Gebote tun“ zu verwenden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm; „Jahwe“ gibt den persönlichen Bundesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Art der Sünde in בִשְׁגָגָה
  choice: unabsichtlich
  alternative: aus Versehen; irrtümlich
  rationale: Die Formulierung wahrt den Gegensatz zu vorsätzlicher oder herausfordernder Sünde, ohne zu behaupten, jede solche Tat sei völlig unwissentlich geschehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle familiäre Wendung „Söhne Israels“ bleibt im Haupttext erhalten und wird in der Fußnote erläutert. Der Vers endet wie im Kontext als noch nicht abgeschlossener Bedingungssatz mit Komma.
