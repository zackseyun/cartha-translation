id: LEV.4.7
reference: Leviticus 4:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/נָתַן֩ הַ/כֹּהֵ֨ן מִן הַ/דָּ֜ם עַל קַ֠רְנוֹת מִזְבַּ֨ח קְטֹ֤רֶת הַ/סַּמִּים֙ לִ/פְנֵ֣י יְהוָ֔ה אֲשֶׁ֖ר בְּ/אֹ֣הֶל מוֹעֵ֑ד וְ/אֵ֣ת כָּל דַּ֣ם הַ/פָּ֗ר יִשְׁפֹּךְ֙ אֶל יְסוֹד֙ מִזְבַּ֣ח הָ/עֹלָ֔ה אֲשֶׁר פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/007.yaml
  text: And the priest shall put some of the blood on the horns of the altar of fragrant incense before Yahweh[a], which is in the tent of meeting, and he shall pour out all the bull’s blood at the base of the altar of burnt offering[b], which is at the entrance of the tent of meeting.
translation:
  language: de
  text: Der Priester soll etwas von dem Blut auf die Hörner des Altars für wohlriechendes Räucherwerk geben, der vor Jahwe im Zelt der Begegnung steht. Das ganze Blut des Stieres[b] soll er an den Sockel des Brandopferaltars gießen, der am Eingang des Zeltes der Begegnung steht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Wörtlich: »das ganze Blut des Stieres«. Im Zusammenhang ist das nach dem Anbringen eines Teils an den Altarhörnern noch vorhandene Blut gemeint.'
    reason: contextual_clarification
lexical_decisions:
- source_word: וְנָתַן
  choice: soll … geben
  rationale: נתן bedeutet allgemein »geben, setzen, anbringen«. »An die Hörner … geben« wahrt die konkrete, aber nicht näher bestimmte Handlung, ohne eine bestimmte Auftragungsmethode hinzuzufügen.
- source_word: מִן הַדָּם
  choice: etwas von dem Blut
  rationale: 'מִן ist hier partitiv: Der Priester verwendet einen Teil des Blutes.'
- source_word: קַרְנוֹת
  choice: Hörner
  rationale: Bezeichnet die hornartigen Vorsprünge an den Ecken des Altars und ist die etablierte kultische Bezeichnung.
- source_word: מִזְבַּח קְטֹרֶת הַסַּמִּים
  choice: Altar für wohlriechendes Räucherwerk
  rationale: Die Wendung bezeichnet den Räucheraltar; הַסַּמִּים hebt die aromatischen Bestandteile des Räucherwerks hervor.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: Bewahrt sowohl den räumlich-liturgischen Sinn von לִפְנֵי als auch den im Hebräischen verwendeten Gottesnamen.
- source_word: אֹהֶל מוֹעֵד
  choice: Zelt der Begegnung
  rationale: Gibt die Funktion des Zeltes als Ort der Begegnung wieder und ist im Deutschen verständlich und würdig.
- source_word: כָּל דַּם הַפָּר
  choice: das ganze Blut des Stieres
  rationale: Entspricht dem ausdrücklichen Wortlaut. Dass zuvor ein Teil verwendet wurde, wird nicht stillschweigend durch »das übrige Blut« aufgelöst, sondern in einer Fußnote erläutert.
- source_word: יִשְׁפֹּךְ
  choice: soll … gießen
  rationale: שׁפך bezeichnet hier das Ausgießen des Blutes im vorgeschriebenen Ritual.
- source_word: אֶל יְסוֹד
  choice: an den Sockel
  rationale: יְסוֹד bezeichnet den unteren Grund- oder Sockelbereich des Altars; »an den Sockel« gibt Ziel und Ort des Ausgießens natürlich wieder.
- source_word: מִזְבַּח הָעֹלָה
  choice: Brandopferaltar
  rationale: Die geläufige und präzise deutsche Bezeichnung für den Altar, auf dem Brandopfer dargebracht wurden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen; »Jahwe« macht ihn als solchen sichtbar, ohne ihn durch einen Titel zu ersetzen.
- issue: כָּל דַּם הַפָּר nach der vorherigen Verwendung eines Teils des Blutes
  choice: das ganze Blut des Stieres
  alternative: das ganze übrige Blut des Stieres
  rationale: Die Übersetzung bewahrt die formale Spannung des hebräischen Wortlauts. Der ritualisierte Ablauf legt nahe, dass das noch vorhandene Blut gemeint ist; diese Kontextinformation wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kultischen Fachbegriffe »Hörner« und »Brandopferaltar« bleiben erhalten. Zwei Sätze vermeiden eine schwerfällige Reihung und machen die beiden Ritualhandlungen klar, ohne inhaltliche Spannung zu beseitigen.
