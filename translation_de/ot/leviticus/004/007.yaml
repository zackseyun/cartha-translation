  to: Der Priester soll etwas von dem Blut auf die Hörner des Altars für wohlriechendes Räucherwerk geben, der vor Jahwe im Zelt der Begegnung steht. Das ganze Blut des Stieres[b] soll er an den Sockel des Brandopferaltars gießen, der am Eingang des Zeltes der Begegnung steht.
