  text: וְ/הוֹצִ֣יא אֶת הַ/פָּ֗ר אֶל מִ/חוּץ֙ לַֽ/מַּחֲנֶ֔ה וְ/שָׂרַ֣ף אֹת֔/וֹ כַּ/אֲשֶׁ֣ר שָׂרַ֔ף אֵ֖ת הַ/פָּ֣ר הָ/רִאשׁ֑וֹן חַטַּ֥את הַ/קָּהָ֖ל הֽוּא־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/021.yaml
  text: He shall bring the bull outside the camp and burn it[a], just as he burned the first bull. It is the sin offering for the assembly.
translation:
  language: de
  text: Er soll den Stier aus dem Lager hinausbringen und ihn verbrennen, wie er den ersten Stier verbrannt hat. Er ist das Sündopfer[a] der Gemeinde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Reinigungsopfer“. Der hebräische Ausdruck kann neben dem Umgang mit Sünde auch die Beseitigung kultischer Unreinheit hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצִיא
  choice: Er soll ... hinausbringen
  rationale: Der Hifil von יצא bezeichnet hier das Hinausbringen des Tieres; die deutsche Wendung gibt Bewegung und Ziel natürlich wieder.
- source_word: הַפָּר
  choice: den Stier
  rationale: פַּר bezeichnet einen Stier beziehungsweise Jungstier; „Stier“ ist präzise und im Zusammenhang eindeutig.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: vor das Lager hinaus
  rationale: Die Präpositionsfolge beschreibt eine Bewegung an einen Ort außerhalb des Lagers; „vor das Lager hinaus“ ist idiomatisches Deutsch.
- source_word: וְשָׂרַף אֹתוֹ
  choice: und ihn verbrennen
  rationale: שׂרף ist das gewöhnliche Verb für „verbrennen“; das Pronomen bezieht sich grammatisch auf den Stier.
- source_word: כַּאֲשֶׁר שָׂרַף
  choice: wie er ... verbrannt hat
  rationale: כַּאֲשֶׁר führt einen Vergleich mit dem zuvor beschriebenen Vorgang ein.
- source_word: הַפָּר הָרִאשׁוֹן
  choice: den ersten Stier
  rationale: רִאשׁוֹן verweist hier auf den zuvor behandelten Stier; die wörtliche Wiedergabe ist auch im Deutschen klar.
- source_word: חַטַּאת
  choice: Sündopfer
  rationale: Im kultischen Zusammenhang bezeichnet חַטָּאת das Opfer, das mit Sünde und Reinigung befasst ist. „Sündopfer“ ist die geläufige, verständliche Bezeichnung; die mögliche Nuance „Reinigungsopfer“ wird in der Fußnote bewahrt.
- source_word: הַקָּהָל
  choice: die versammelte Gemeinde
  rationale: קָהָל bezeichnet die als Gemeinschaft versammelte Gesamtheit. „Versammelte Gemeinde“ bewahrt sowohl den korporativen als auch den versammlungsbezogenen Sinn.
- source_word: הוּא
  choice: Er ist
  rationale: Das Pronomen identifiziert den grammatisch männlichen Stier als das Opfer der Gemeinde; „Er“ erhält diesen unmittelbaren Bezug.
theological_decisions:
- issue: Wiedergabe von חַטַּאת in der Opfergesetzgebung
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: Der Ausdruck kann sowohl den Bezug auf Sünde als auch die reinigende Funktion des Opfers hervorheben. Der Haupttext verwendet die allgemein verständliche traditionelle Bezeichnung, während die Fußnote die echte lexikalische Alternative offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, ohne unnatürlich zu wirken; kultische Terminologie wird verständlich und konsistent wiedergegeben.
