  text: א֚וֹ הוֹדַ֣ע אֵלָ֔י/ו חַטָּאת֖/וֹ אֲשֶׁ֣ר חָטָ֑א וְ/הֵבִ֨יא קָרְבָּנ֜/וֹ שְׂעִירַ֤ת עִזִּים֙ תְּמִימָ֣ה נְקֵבָ֔ה עַל חַטָּאת֖/וֹ אֲשֶׁ֥ר חָטָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/028.yaml
  text: Or if the sin that he has committed is made known to him[b][a], then he shall bring as his offering for the sin that he has committed a female goat without blemish.
translation:
  language: de
  text: Oder wenn ihm seine Sünde, die er begangen hat, bekannt wird,[a] dann soll er für seine Sünde, die er begangen hat, eine fehlerlose weibliche Ziege als seine Opfergabe bringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihm seine Sünde bekannt gemacht wird“ beziehungsweise „man ihn über seine Sünde informiert“. Die hebräische Passivform lässt offen, ob die Sünde ihm selbst bewusst wird oder ob er von anderen davon erfährt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: א֚וֹ
  choice: Oder wenn
  rationale: א֚וֹ leitet innerhalb der Rechtsbestimmung einen alternativen Fall ein. Das im Hebräischen nur durch den Zusammenhang erkennbare Bedingungsverhältnis wird im Deutschen mit „wenn“ natürlich ausgedrückt.
- source_word: הוֹדַע אֵלָיו
  choice: ihm … bekannt gemacht wird
  rationale: Der Hophal von ידע bezeichnet hier, dass etwas zu seiner Kenntnis gebracht wird. Die passive Formulierung bewahrt die Offenheit, ob er selbst zur Erkenntnis gelangt oder von anderen informiert wird.
- source_word: חַטָּאתוֹ
  choice: seine Sünde
  rationale: חַטָּאת bezeichnet an dieser Stelle die begangene Sünde, nicht das Reinigungs- beziehungsweise Sündopfer; das Opfer selbst wird ausdrücklich קָרְבָּנוֹ genannt.
- source_word: אֲשֶׁר חָטָא
  choice: die er begangen hat
  rationale: Die Verbindung wird im Deutschen idiomatisch mit „eine Sünde begehen“ wiedergegeben und behält den Rückbezug auf die konkrete Tat.
- source_word: וְהֵבִיא
  choice: dann soll er … bringen
  rationale: In der gesetzlichen Anweisung führt die Verbform zur vorgeschriebenen Folgehandlung. „Dann soll er“ macht diesen Ablauf in natürlichem Deutsch deutlich.
- source_word: קָרְבָּנוֹ
  choice: als seine Opfergabe
  rationale: קָרְבָּן ist eine dargebrachte Gabe. „Opfergabe“ erhält den kultischen Sinn, ohne die Gabe vorschnell als „Sündopfer“ zu bestimmen.
- source_word: שְׂעִירַת עִזִּים … נְקֵבָה
  choice: eine … weibliche Ziege
  rationale: Die Wendung bezeichnet ausdrücklich ein weibliches Tier aus der Ziegengattung. „Weibliche Ziege“ gibt diese Spezifizierung klar und in modernem Deutsch wieder.
- source_word: תְּמִימָה
  choice: fehlerlose
  rationale: Im Opferkontext bezeichnet תָּמִים ein Tier ohne körperlichen Makel. „Fehlerlos“ ist präzise und allgemein verständlich.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: für die Sünde, die er begangen hat
  rationale: עַל bezeichnet hier die Beziehung beziehungsweise den Anlass der Opfergabe. „Für“ ist im Deutschen knapp und lässt die genaue kultische Wirkweise unausgedeutet.
theological_decisions:
- issue: Bedeutung von חַטָּאת in beiden Vorkommen
  choice: Beide Vorkommen werden als „Sünde“ wiedergegeben.
  alternative: Das zweite Vorkommen als „Sündopfer“ wiedergeben.
  rationale: Die Opfergabe wird bereits durch קָרְבָּנוֹ und das genannte Tier bezeichnet. Die wiederholte Formulierung חַטָּאתוֹ אֲשֶׁר חָטָא verweist jeweils auf die begangene Verfehlung, für die das Tier gebracht wird.
- issue: Art des Bekanntwerdens der Sünde
  choice: Die passive und in Bezug auf den Vermittlungsweg offene Formulierung „bekannt gemacht wird“ bleibt im Haupttext erhalten.
  alternative: Interpretierend mit „wenn er seine Sünde erkennt“ oder „wenn man ihn informiert“ übersetzen.
  rationale: Der hebräische Hophal lässt sowohl ein persönliches Bekanntwerden als auch eine Mitteilung durch andere zu. Keine dieser Möglichkeiten soll dogmatisch oder erzählerisch festgelegt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Rechtssatzstruktur. Die Wiederholung „die er begangen hat“ folgt der bewussten Wiederholung im Hebräischen; die Satzstellung wurde zugleich so geordnet, dass sie im Deutschen flüssig bleibt.
