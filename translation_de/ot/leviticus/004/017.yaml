revisions:
- from: Dann soll der Priester seinen Finger in etwas von dem Blut tauchen und siebenmal vor Jahwe gegen die Vorderseite des Vorhangs[a] sprengen.
  to: Dann soll der Priester seinen Finger in das Blut tauchen und es siebenmal vor Jahwe gegen die Vorderseite des Vorhangs[a] sprengen.
  rationale: Die Revision glättet allein die deutsche Ausdrucksweise bei der Tauchhandlung. Das Pronomen „es“ macht das beim hebräischen Sprengverb implizite Blut idiomatisch explizit. Die räumliche Ausrichtung auf die Vorderseite des Vorhangs und damit die begrenzte Mehrdeutigkeit des hebräischen Ausdrucks bleiben erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T07:16:33Z'
review_pass:
  verdict: revise
  source_fidelity: Der Vers gibt die Abfolge, den Priester, den einzelnen Finger, die siebenmalige Sprengung und die Orts-/Richtungsangaben zutreffend wieder. Das im Hebräischen bei הִזָּה nicht ausdrücklich genannte Blut kann im Deutschen mit einem Pronomen aufgenommen werden. Die Wendung אֶת־פְּנֵי הַפָּרֹכֶת bezeichnet die Vorderseite bzw. die Ausrichtung auf den Vorhang; „gegen die Vorderseite“ wahrt diese konkrete, ohne eine Berührung ausdrücklich zu behaupten.
  naturalness: „In etwas von dem Blut tauchen“ ist verständlich, aber im modernen Standarddeutsch unnötig schwerfällig und weniger idiomatisch. „In das Blut tauchen“ beschreibt bei einem Finger keine Gesamteintauchung und gibt die Handlung klar wieder.
  terminology: „Jahwe“, „Priester“, „Vorhang“ und das kultisch präzise Verb „sprengen“ sind angemessen. Die Fußnote bietet „Schleier“ als legitime lexikalische Alternative und erläutert den kultischen Bezug zurückhaltend.
  issues:
  - severity: low
    issue: Unidiomatische partitive Formulierung
    rationale: „in etwas von dem Blut“ versucht, מִן־הַדָּם ausdrücklich partitiv wiederzugeben, klingt aber auf Deutsch sperrig. Bei „seinen Finger in das Blut tauchen“ ist weder ein vollständiges Eintauchen der Hand noch eine Aussage über die gesamte Blutmenge impliziert.
  revised_text: Dann soll der Priester seinen Finger in das Blut tauchen und es siebenmal vor Jahwe gegen die Vorderseite des Vorhangs[a] sprengen.
  revised_footnotes:
  - marker: a
    text: 'Oder: „Schleiers“. Gemeint ist der Vorhang des Heiligtums, der den besonders heiligen Bereich abtrennte.'
    reason: lexical_alternative
  revision_rationale: Die Revision glättet allein die deutsche Ausdrucksweise bei der Tauchhandlung. Das Pronomen „es“ macht das beim hebräischen Sprengverb implizite Blut idiomatisch explizit. Die räumliche Ausrichtung auf die Vorderseite des Vorhangs und damit die begrenzte Mehrdeutigkeit des hebräischen Ausdrucks bleiben erhalten.
