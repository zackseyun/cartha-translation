id: LEV.4.17
reference: Leviticus 4:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/טָבַ֧ל הַ/כֹּהֵ֛ן אֶצְבָּע֖/וֹ מִן הַ/דָּ֑ם וְ/הִזָּ֞ה שֶׁ֤בַע פְּעָמִים֙ לִ/פְנֵ֣י יְהוָ֔ה אֵ֖ת פְּנֵ֥י הַ/פָּרֹֽכֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/017.yaml
  text: Then the priest shall dip his finger in some of the blood and sprinkle some of the blood seven times before Yahweh[a], in front of the curtain.
translation:
  language: de
  text: Dann soll der Priester seinen Finger in das Blut tauchen und es siebenmal vor Jahwe gegen die Vorderseite des Vorhangs[a] sprengen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schleiers“. Gemeint ist der Vorhang des Heiligtums, der den besonders heiligen Bereich abtrennte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְטָבַל
  choice: Dann soll … tauchen
  rationale: Die Form führt die Abfolge der vorgeschriebenen Ritualhandlungen fort. „Dann soll“ gibt diese sequenzielle Anweisung im Deutschen natürlich wieder.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Die bestimmte Form und die kultische Amtsbezeichnung werden unmittelbar wiedergegeben.
- source_word: אֶצְבָּעוֹ
  choice: seinen Finger
  rationale: Wörtliche Wiedergabe des Singulars mit Possessivsuffix.
- source_word: מִן הַדָּם
  choice: in etwas von dem Blut
  rationale: 'Die Formulierung bewahrt den durch מִן ausgedrückten partitiven Sinn: Der Finger wird in eine vorhandene Menge des Blutes getaucht, nicht notwendigerweise in dessen Gesamtheit.'
- source_word: וְהִזָּה
  choice: und … sprengen
  rationale: הזה bezeichnet im priesterlichen Ritual das Versprengen einer Flüssigkeit, besonders von Blut. Das deutsche „sprengen“ ist in diesem kultischen Zusammenhang präziser als das alltägliche „spritzen“.
- source_word: שֶׁבַע פְּעָמִים
  choice: siebenmal
  rationale: Direkte und idiomatische Wiedergabe der Zahl und der Wiederholung.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי bezeichnet hier die räumlich und kultisch verstandene Gegenwart Jahwes; „vor Jahwe“ ist knapp und wahrt den Gottesnamen.
- source_word: אֵת פְּנֵי הַפָּרֹכֶת
  choice: gegen die Vorderseite des Vorhangs
  rationale: Die Wendung nennt die dem Priester zugewandte Vorderseite des inneren Heiligtumsvorhangs als Richtung der Sprengung. „Gegen“ gibt diese Ausrichtung im Deutschen natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von פָּרֹכֶת
  choice: Vorhang
  alternative: Schleier
  rationale: Das Wort bezeichnet den inneren Vorhang des Heiligtums. „Vorhang“ benennt den baulichen Gegenstand in heutigem Deutsch klar; „Schleier“ bleibt als traditionsgeprägte Alternative möglich.
- issue: Zielrichtung der Blutsprengung
  choice: gegen die Vorderseite des Vorhangs
  alternative: vor dem Vorhang
  rationale: אֵת פְּנֵי הַפָּרֹכֶת kann die dem Priester zugewandte Fläche beziehungsweise die Richtung auf sie bezeichnen. Die gewählte Fassung erhält diese konkrete Ausrichtung, ohne zu behaupten, dass das Blut den Vorhang zwingend berührt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit der für Gesetzestexte natürlichen Soll-Form. Kultische Fachsprache wird nur dort verwendet, wo sie Präzision schafft; „Vorhang“ bleibt allgemein verständlich.
