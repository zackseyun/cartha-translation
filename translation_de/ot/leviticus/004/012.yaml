base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/012.yaml
  text: He shall bring out the whole bull to a clean place[a] outside the camp, to the ash dump, and burn it on wood in the fire[b]; it shall be burned at the ash dump.
translation:
  language: de
  text: Er soll den ganzen Stier aus dem Lager hinaus zu einem reinen Ort[a] bringen, zur Aschenablagerungsstätte[b], und ihn auf Holz im Feuer verbrennen. An der Aschenablagerungsstätte soll er verbrannt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt hier wahrscheinlich: einen kultisch reinen Ort.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „zur Ausschüttung der Asche“; gemeint ist der dafür bestimmte Ablagerungsort der Altarasche.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצִיא
  choice: Er soll … hinausbringen
  rationale: Der Hifil von יצא bezeichnet das Hinausbringen. Die geteilte deutsche Verbform „soll … hinaus … bringen“ gibt Richtung und gesetzlichen Anweisungsstil natürlich wieder.
- source_word: כָּל הַפָּר
  choice: den ganzen Stier
  rationale: כָּל mit bestimmtem Substantiv betont das gesamte Tier beziehungsweise seine vollständigen Überreste.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: aus dem Lager hinaus
  rationale: Die Formulierung bezeichnet die Bewegung über die Grenze des Lagers hinaus und verbindet sich im Deutschen idiomatisch mit „hinausbringen“.
- source_word: מָקוֹם טָהוֹר
  choice: einen reinen Ort
  rationale: „Rein“ ist in diesem levitischen Zusammenhang verständlich und lässt den kultischen Sinn anklingen, ohne ihn im Haupttext ausdrücklich auszudeuten.
- source_word: שֶׁפֶךְ הַדֶּשֶׁן
  choice: die Aschenablagerungsstätte
  rationale: Die Wendung bezeichnet den vorgesehenen Ort, an dem die Altarasche ausgeschüttet beziehungsweise entsorgt wird. „Aschenablagerungsstätte“ wahrt diesen funktionalen Ortsbezug besser als das unspezifische „Aschenhaufen“.
- source_word: וְשָׂרַף אֹתוֹ
  choice: und ihn dort … verbrennen
  rationale: שׂרף ist das gewöhnliche Verb für „verbrennen“. „Dort“ macht im Deutschen den bereits genannten Ort eindeutig zum Schauplatz der Handlung, ohne neue Sachinformation einzuführen.
- source_word: עַל עֵצִים בָּאֵשׁ
  choice: auf Holz im Feuer
  rationale: Die Übersetzung erhält sowohl den Brennstoff beziehungsweise die Unterlage „auf Holz“ als auch die Wendung „im Feuer“.
- source_word: עַל שֶׁפֶךְ הַדֶּשֶׁן יִשָּׂרֵף
  choice: An der Aschenablagerungsstätte soll er verbrannt werden
  rationale: Der abschließende Passivsatz und die Wiederholung des vorgeschriebenen Ortes bleiben als rechtliche Hervorhebung erhalten.
theological_decisions:
- issue: Reinheitsnuance von טָהוֹר
  choice: einen reinen Ort
  alternative: einen kultisch reinen Ort
  rationale: Im Opferkontext ist kultische Reinheit wahrscheinlich gemeint. Der Haupttext bewahrt jedoch die knappe Form des Hebräischen; eine Fußnote verdeutlicht die mögliche kultische Spezifizierung.
- issue: Bedeutung von שֶׁפֶךְ הַדֶּשֶׁן
  choice: Aschenablagerungsstätte
  alternative: Ort, an dem die Asche ausgeschüttet wird
  rationale: Gemeint ist ein bestimmter Platz für die Ablagerung der Altarasche, nicht bloß irgendein Aschenhaufen. Die gewählte Bezeichnung ist knapp genug für den Haupttext und vermeidet zugleich eine abwertend-moderne Vorstellung wie bei „Müllplatz“.
translation_notes:
  register: Moderner, würdevoller Gesetzesstil mit „soll“. Die Satzstellung folgt dem hebräischen Ablauf, bleibt aber im Deutschen gut lesbar. Die Wiederholung der Aschenablagerungsstätte wurde wegen ihrer rechtlichen und räumlichen Hervorhebung beibehalten.
