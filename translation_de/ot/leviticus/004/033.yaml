id: LEV.4.33
reference: Leviticus 4:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/סָמַךְ֙ אֶת יָד֔/וֹ עַ֖ל רֹ֣אשׁ הַֽ/חַטָּ֑את וְ/שָׁחַ֤ט אֹתָ/הּ֙ לְ/חַטָּ֔את בִּ/מְק֕וֹם אֲשֶׁ֥ר יִשְׁחַ֖ט אֶת הָ/עֹלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/033.yaml
  text: And he shall lay his hand on the head of the sin offering and slaughter it for a sin offering in the place where the burnt offering is slaughtered[a].
translation:
  language: de
  text: Er soll seine Hand auf den Kopf des Sündopfers[a] legen und es als Sündopfer an dem Ort schlachten, an dem das Brandopfer geschlachtet wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Reinigungsopfer“; so auch beim zweiten Vorkommen von „Sündopfer“. Das hebräische Wort kann ein Opfer bezeichnen, das Sünde und kultische Unreinheit behandelt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ אֶת יָדוֹ
  choice: Er soll seine Hand ... legen
  rationale: Das Verb סמך bezeichnet im Opferkontext das Auflegen beziehungsweise Aufstützen der Hand auf das Tier. Der Singular יָדוֹ wird bewahrt.
- source_word: עַל רֹאשׁ
  choice: auf den Kopf
  rationale: Direkte und im modernen Deutschen natürliche Wiedergabe der räumlichen Beziehung.
- source_word: הַחַטָּאת / לְחַטָּאת
  choice: das Sündopfer / als Sündopfer
  rationale: חטאת ist hier die Bezeichnung der Opferart. „Sündopfer“ ist verständlich und etabliert; die ebenfalls sachlich mögliche Wiedergabe „Reinigungsopfer“ wird in der Fußnote erhalten.
- source_word: וְשָׁחַט
  choice: schlachten
  rationale: שׁחט ist der konkrete Fachausdruck für das rituelle Schlachten eines Opfertiers.
- source_word: בִּמְקוֹם אֲשֶׁר יִשְׁחַט
  choice: an dem Ort, an dem ... geschlachtet wird
  rationale: Die passive deutsche Form gibt die allgemeine kultische Verfahrensregel natürlich wieder, ohne einen ungenannten Handelnden festzulegen.
- source_word: הָעֹלָה
  choice: das Brandopfer
  rationale: „Brandopfer“ ist die etablierte deutsche Bezeichnung für עֹלָה und passt zum levitischen Opferkontext.
theological_decisions:
- issue: Bedeutung von חטאת im Opfergesetz
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: Der Ausdruck kann sowohl den Bezug zur Sünde als auch die reinigende Funktion des Opfers hervorheben. Der Haupttext verwendet die geläufige Bezeichnung, während die Fußnote die bedeutsame lexikalische Alternative bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer gesetzlicher Ausdrucksweise. Der hebräische Singular „seine Hand“ bleibt erhalten; die Wiederholung von „Sündopfer“ bildet die Wiederholung von חטאת im Ausgangstext ab.
