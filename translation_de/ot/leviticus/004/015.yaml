base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/015.yaml
  text: And the elders of the congregation shall lay their hands on the head of the bull before Yahweh[a], and the bull shall be slaughtered before Yahweh.
translation:
  language: de
  text: Und die Ältesten der Gemeinde sollen ihre Hände auf den Kopf des Stieres legen vor Jahwe; man soll den Stier vor Jahwe schlachten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Hebräische wechselt hier von „die Ältesten“ zu einem Verb im Singular. Der Handelnde wird nicht ausdrücklich genannt; auch möglich: „Dann soll er den Stier vor Jahwe schlachten.“'
    reason: Erläutert den auffälligen Numeruswechsel und hält offen, wer die Schlachtung ausführt.
lexical_decisions:
- source_word: וְסָמְכוּ
  choice: sollen … legen
  rationale: סמך bezeichnet im Opferkontext das rituelle Auflegen beziehungsweise Aufstützen der Hände. „Die Hände … legen“ ist im Deutschen klar und kultisch passend.
- source_word: זִקְנֵי הָעֵדָה
  choice: die Ältesten der Gemeinde
  rationale: עֵדָה bezeichnet hier die versammelte Gemeinschaft Israels; „Gemeinde“ gibt den gemeinschaftlichen und religiösen Bezug natürlich wieder.
- source_word: אֶת יְדֵיהֶם
  choice: ihre Hände
  rationale: Der Plural des hebräischen Textes wird bewahrt.
- source_word: עַל רֹאשׁ הַפָּר
  choice: auf den Kopf des Stieres
  rationale: Direkte und natürliche Wiedergabe der räumlichen Formulierung; פַּר wird als „Stier“ übersetzt.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי bedeutet „vor“ beziehungsweise „in der Gegenwart von“; die knappe Wendung passt zur Opfersprache.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְשָׁחַט
  choice: dann soll er … schlachten
  rationale: Die hebräische Verbform steht in der dritten Person Singular und folgt auf das pluralische Subjekt „die Ältesten“. Das singularische „er“ bewahrt diesen auffälligen Numeruswechsel; „schlachten“ ist im Opferkontext präzise.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen; „Jahwe“ bewahrt ihn als Namen.
- issue: Numeruswechsel bei וְשָׁחַט
  choice: den Singular mit „er soll … schlachten“ bewahren
  alternative: „sie sollen schlachten“ oder „der Stier soll geschlachtet werden“
  rationale: Der hebräische Text wechselt vom Plural „Älteste“ zu einem singularischen Verb. Die Übersetzung sollte die möglicherweise gemeinte Handlung eines Vertreters nicht durch einen Plural glätten; da der Handelnde nicht ausdrücklich genannt wird, erläutert eine Fußnote die Form.
translation_notes:
  register: Moderne, würdige Gesetzessprache. „Gemeinde“, „Stier“ und „schlachten“ sind verständlich und sachlich. Der Singular im zweiten Satzteil wird nicht geglättet; die Fußnote hält die unpersönliche Deutung offen.
