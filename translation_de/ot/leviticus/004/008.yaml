source:
  edition: WLC
  text: וְ/אֶת כָּל חֵ֛לֶב פַּ֥ר הַֽ/חַטָּ֖את יָרִ֣ים מִמֶּ֑/נּוּ אֶת הַ/חֵ֨לֶב֙ הַֽ/מְכַסֶּ֣ה עַל הַ/קֶּ֔רֶב וְ/אֵת֙ כָּל הַ/חֵ֔לֶב אֲשֶׁ֖ר עַל הַ/קֶּֽרֶב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/008.yaml
  text: 'And he shall remove from it all the fat of the sin offering bull: the fat that covers the entrails and all the fat that is on the entrails,[a]'
translation:
  language: de
  text: 'Und alles Fett des Sündopferstiers[a] soll er von ihm abheben: das Fett, das die Eingeweide bedeckt, und alles Fett, das an den Eingeweiden ist.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des Stiers für das Reinigungsopfer“. Das hebräische Wort חַטָּאת kann sowohl „Sünde“ als auch das mit der Beseitigung von Sünde oder Unreinheit verbundene Opfer bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: alles
  rationale: Bewahrt den umfassenden Sinn des Hebräischen und bezieht sich auf die gesamte vorgeschriebene Fettpartie.
- source_word: חֵלֶב
  choice: Fett
  rationale: Bezeichnet hier die für das Opfer bestimmten Fettpartien; die folgenden anatomischen Angaben verdeutlichen den kultischen Bezug.
- source_word: פַּר הַחַטָּאת
  choice: Sündopferstier
  rationale: 'Gibt die Konstruktverbindung knapp und im Deutschen verständlich wieder: der für das Sündopfer bestimmte Stier.'
- source_word: יָרִים
  choice: soll er ... abheben
  rationale: Das Verb bedeutet wörtlich „erheben“; im Opferverfahren bezeichnet es das Abtrennen und Wegnehmen der genannten Teile. „Abheben“ bewahrt sowohl die Grundbedeutung als auch den rituellen Handlungssinn.
- source_word: מִמֶּנּוּ
  choice: von ihm
  rationale: Das maskuline Pronomen bezieht sich grammatisch auf den Stier; im Deutschen ist „von ihm“ bei einem Tier möglich und bleibt formal nah am Ausgangstext.
- source_word: הַמְכַסֶּה
  choice: das ... bedeckt
  rationale: Das Partizip beschreibt das Fett attributiv; ein Relativsatz ist dafür die natürlichste deutsche Form.
- source_word: קֶרֶב
  choice: Eingeweide
  rationale: Im opferanatomischen Zusammenhang ist „Eingeweide“ konkret, verständlich und hinreichend präzise.
- source_word: אֲשֶׁר עַל הַקֶּרֶב
  choice: das an den Eingeweiden ist
  rationale: „An“ gibt die räumliche Zuordnung natürlich wieder und unterscheidet dieses Fett von dem zuvor genannten Fett, das die Eingeweide bedeckt.
theological_decisions:
- issue: Wiedergabe von חַטָּאת im Opferkontext
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: „Sündopfer“ ist die geläufige und sachlich vertretbare Wiedergabe. Da חַטָּאת zugleich den Aspekt der Reinigung beziehungsweise Entsühnung tragen kann, wird die alternative Deutung in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer kultisch-anatomischer Ausdrucksweise. Der Doppelpunkt bildet die erläuternde Apposition des Hebräischen ab; die Wiederholung von „Fett“ bleibt zur Wahrung der Struktur erhalten.
