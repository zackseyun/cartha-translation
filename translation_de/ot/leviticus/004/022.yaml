  source_fidelity: 'Der Entwurf gibt die Satzstruktur und den Sinn des Hebräischen zuverlässig wieder: ein nָשִׂיא sündigt, begeht aus Unabsicht eine untersagte Handlung innerhalb der Gebote Jahwes, seines Gottes, und wird schuldig. Die explizierende Verbindung „eines der Gebote … übertritt, indem es etwas tut“ macht im Deutschen verständlich, was die hebräische partitive Wendung voraussetzt, ohne einen zusätzlichen Sachverhalt einzutragen. Der fortführende Schlusssatz mit Komma entspricht dem Anschluss an V. 23.'
