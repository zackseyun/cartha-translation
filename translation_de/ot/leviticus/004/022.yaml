id: LEV.4.22
reference: Leviticus 4:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֲשֶׁ֥ר נָשִׂ֖יא יֶֽחֱטָ֑א וְ/עָשָׂ֡ה אַחַ֣ת מִ/כָּל מִצְוֺת֩ יְהוָ֨ה אֱלֹהָ֜י/ו אֲשֶׁ֧ר לֹא תֵעָשֶׂ֛ינָה בִּ/שְׁגָגָ֖ה וְ/אָשֵֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/022.yaml
  text: When a leader sins and unintentionally does one of any of the things that Yahweh his God has commanded not to be done[a], and becomes guilty[b],
translation:
  language: de
  text: Wenn ein Oberhaupt[a] sündigt und aus Versehen[b] eines der Gebote Jahwes, seines Gottes, übertritt, indem es etwas tut, was nicht getan werden darf, und dadurch schuldig wird,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Anführer“, „ein Vorsteher“ oder „ein Fürst“. Das hebräische Wort bezeichnet ein anerkanntes Oberhaupt oder einen führenden Mann.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „unbeabsichtigt“ beziehungsweise „irrtümlich“. Gemeint ist eine nicht vorsätzlich begangene Übertretung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשִׂיא
  choice: Oberhaupt
  rationale: Das Wort bezeichnet hier einen anerkannten führenden Mann oder Vorsteher. „Oberhaupt“ ist im Deutschen verständlich und legt anders als „Fürst“ keine monarchische Stellung nahe.
- source_word: יֶחֱטָא
  choice: sündigt
  rationale: Das einfache Verb gibt den üblichen und direkten Sinn von חטא wieder.
- source_word: וְעָשָׂה אַחַת מִכָּל מִצְוֺת
  choice: eines der Gebote … übertritt
  rationale: Die partitive Wendung bezeichnet das Zuwiderhandeln gegen eines aus der Gesamtheit der Gebote. „Übertritt“ macht im Deutschen deutlich, dass nicht das Gebot selbst getan, sondern eine darin untersagte Handlung begangen wird.
- source_word: יְהוָה אֱלֹהָיו
  choice: Jahwes, seines Gottes
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; das Suffix an אֱלֹהָיו bleibt durch „seines Gottes“ erhalten.
- source_word: אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: indem es etwas tut, was nicht getan werden darf
  rationale: Die Formulierung bewahrt den passiv-prohibitiven Sinn der Relativkonstruktion und verbindet ihn in natürlichem Deutsch mit dem Übertreten des Gebots.
- source_word: בִּשְׁגָגָה
  choice: aus Versehen
  rationale: Die Wendung bezeichnet im Kontext des Opferrechts eine unbeabsichtigte oder irrtümliche Übertretung.
- source_word: וְאָשֵׁם
  choice: und dadurch schuldig wird
  rationale: Das Verb bezeichnet den als Folge der Tat eintretenden Schuldzustand. „Dadurch“ macht diesen im Hebräischen angelegten Folgezusammenhang deutlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. Die gebräuchliche deutsche Form „Jahwe“ bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Art der Schuld
  choice: aus Versehen … schuldig wird
  alternative: irrt und Schuld auf sich lädt
  rationale: Der Text hält unbeabsichtigtes Handeln und tatsächliche Schuld zusammen. Die Übersetzung bewahrt diese Spannung, ohne die Schuld wegen fehlender Absicht abzuschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Oberhaupt“ vermeidet die heute leicht monarchisch verstandene Bezeichnung „Fürst“. Der abschließende Beistrich zeigt, dass der Satz im folgenden Vers weitergeführt wird.
