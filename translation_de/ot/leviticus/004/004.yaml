  text: וְ/הֵבִ֣יא אֶת הַ/פָּ֗ר אֶל פֶּ֛תַח אֹ֥הֶל מוֹעֵ֖ד לִ/פְנֵ֣י יְהוָ֑ה וְ/סָמַ֤ךְ אֶת יָד/וֹ֙ עַל רֹ֣אשׁ הַ/פָּ֔ר וְ/שָׁחַ֥ט אֶת הַ/פָּ֖ר לִ/פְנֵ֥י יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/004.yaml
  text: He shall bring the bull to the entrance of the tent of meeting before Yahweh[b][a], and he shall lay his hand on the head of the bull and slaughter the bull before Yahweh.
translation:
  language: de
  text: Er soll den Stier an den Eingang des Zeltes der Begegnung vor Jahwe[a] bringen, seine Hand auf den Kopf des Stieres legen und den Stier vor Jahwe schlachten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »im Angesicht Jahwes«; gemeint ist: in Jahwes Gegenwart.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: Er soll ... bringen
  rationale: Der Hifil von בוא bezeichnet hier im vorschreibenden Ritualkontext das Herbeibringen des Tieres. Die deutsche Soll-Form gibt die Anweisung natürlich und präzise wieder.
- source_word: הַפָּר
  choice: den Stier
  rationale: פַּר bezeichnet einen Stier, im Opferkontext häufig einen jungen Stier. Da das Alter hier nicht ausdrücklich genannt wird, wird es nicht ergänzt.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: an den Eingang des Zeltes der Begegnung
  rationale: פֶּתַח bezeichnet den Eingang oder die Öffnung. אֹהֶל מוֹעֵד wird als feste Heiligtumsbezeichnung mit „Zelt der Begegnung“ wiedergegeben.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי kann „vor“, „angesichts“ oder „in der Gegenwart von“ bedeuten. „Vor Jahwe“ bewahrt die knappe kultische Ausdrucksweise des Hebräischen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als persönlicher Gottesname „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְסָמַךְ אֶת יָדוֹ עַל רֹאשׁ הַפָּר
  choice: seine Hand auf den Kopf des Stieres legen
  rationale: סמך bezeichnet hier die rituelle Handlung des Auflegens beziehungsweise Aufstützens der Hand. Die Übersetzung beschreibt die Handlung, ohne ihre Symbolik auszudeuten.
- source_word: וְשָׁחַט
  choice: und ... schlachten
  rationale: שׁחט ist der Fachausdruck für das Schlachten eines Opfertieres; „schlachten“ bewahrt diesen rituellen Sinn besser als das allgemeinere „töten“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. „Jahwe“ bewahrt ihn als persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung der Handauflegung beim Sündopfer
  choice: Nur die körperliche Handlung wiedergeben
  alternative: Identifikation oder Schuldübertragung ausdrücklich benennen
  rationale: Der Vers beschreibt die Handlung, erklärt aber ihre theologische Bedeutung nicht. Die Übersetzung vermeidet daher, eine bestimmte Deutung in den Wortlaut einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer ritueller Terminologie. Die hebräische Satzfolge wird in einen natürlichen deutschen Satz überführt; die wiederholte Wendung „vor Jahwe“ bleibt erhalten.
