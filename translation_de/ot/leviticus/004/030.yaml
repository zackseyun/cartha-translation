source:
  edition: WLC
  text: וְ/לָקַ֨ח הַ/כֹּהֵ֤ן מִ/דָּמָ/הּ֙ בְּ/אֶצְבָּע֔/וֹ וְ/נָתַ֕ן עַל קַרְנֹ֖ת מִזְבַּ֣ח הָ/עֹלָ֑ה וְ/אֶת כָּל דָּמָ֣/הּ יִשְׁפֹּ֔ךְ אֶל יְס֖וֹד הַ/מִּזְבֵּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/030.yaml
  text: And the priest shall take some of its blood with his finger and put it on the horns of the altar of burnt offering[c][b][a], and he shall pour out all its blood at the base of the altar.
translation:
  language: de
  text: Und der Priester soll mit seinem Finger etwas von ihrem Blut nehmen und es an die Hörner des Brandopferaltars[b] streichen. Ihr ganzes Blut[c] soll er an den Sockel des Altars gießen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich kann יְסוֹד auch „Grundlage“ oder „Sockel“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: Die „Hörner“ waren hornartige Vorsprünge an den Ecken des Altars.
    reason: cultural_note
  - marker: c
    text: Obwohl es wörtlich „ihr ganzes Blut“ heißt, zeigt der Ablauf, dass nach dem Auftragen eines Teils das verbleibende Blut ausgegossen wird.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Und ... soll ... nehmen
  rationale: Die Form steht in einer kultischen Verfahrensanweisung und wird daher im Deutschen präskriptiv wiedergegeben.
- source_word: מִדָּמָהּ
  choice: etwas von ihrem Blut
  rationale: 'מִן ist hier am natürlichsten partitiv zu verstehen: Der Priester nimmt einen Teil des Blutes zur Anwendung am Altar.'
- source_word: בְּאֶצְבָּעוֹ
  choice: mit seinem Finger
  rationale: Das בְּ bezeichnet hier das Mittel bzw. Werkzeug.
- source_word: וְנָתַן
  choice: es ... streichen
  rationale: נתן bedeutet grundsätzlich „geben, setzen, anbringen“; im Zusammenhang mit Blut und Finger gibt „streichen“ die konkrete Handlung natürlich wieder, ohne die Richtung oder Menge näher festzulegen.
- source_word: קַרְנֹת מִזְבַּח הָעֹלָה
  choice: die Hörner des Brandopferaltars
  rationale: Der kultische Ausdruck „Hörner“ bleibt erhalten; das deutsche Kompositum bezeichnet knapp den Altar für Brandopfer.
- source_word: וְאֶת כָּל דָּמָהּ
  choice: Ihr ganzes Blut
  rationale: כָּל wird seinem Wortlaut entsprechend mit „ganzes“ wiedergegeben, obwohl der Ablauf zeigt, dass nach dem Auftragen eines Teils das verbleibende Blut gemeint ist.
- source_word: יִשְׁפֹּךְ
  choice: soll er ... gießen
  rationale: שׁפך bezeichnet im Opferkontext das Ausgießen des Blutes.
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: an den Fuß des Altars
  rationale: יְסוֹד bezeichnet hier den unteren Bereich bzw. Sockel des Altars; „Fuß“ ist im Deutschen anschaulich und idiomatisch.
theological_decisions:
- issue: Verbformen in der Ritualanweisung
  choice: präskriptiv mit „soll“
  alternative: erzählend im Präteritum
  rationale: Der literarische Zusammenhang ist eine verbindliche Opferanweisung, kein Bericht über einen einmaligen vergangenen Vorgang.
- issue: Kultische Bezeichnung קַרְנוֹת
  choice: wörtlich „Hörner“
  alternative: erklärend „Eckvorsprünge“
  rationale: Die konkrete kultische Bildsprache wird bewahrt und durch eine Fußnote verständlich gemacht.
- issue: Spannung zwischen einem Teil und „ganzem“ Blut
  choice: den Wortlaut „ihr ganzes Blut“ bewahren
  alternative: deutend „das übrige Blut“
  rationale: Der Ablauf legt das restliche Blut nahe, doch der hebräische Text sagt ausdrücklich כָּל; diese Spannung wird nicht stillschweigend aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt der Abfolge der Ritualhandlung; traditionelle kultische Begriffe werden beibehalten, aber knapp erläutert.
