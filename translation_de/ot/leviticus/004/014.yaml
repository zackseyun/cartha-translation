source:
  edition: WLC
  text: וְ/נֽוֹדְעָה֙ הַֽ/חַטָּ֔את אֲשֶׁ֥ר חָטְא֖וּ עָלֶ֑י/הָ וְ/הִקְרִ֨יבוּ הַ/קָּהָ֜ל פַּ֤ר בֶּן בָּקָר֙ לְ/חַטָּ֔את וְ/הֵבִ֣יאוּ אֹת֔/וֹ לִ/פְנֵ֖י אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/014.yaml
  text: and the sin that they committed becomes known[a], then the assembly shall present a bull, a son of the herd, as a sin offering and bring it before the tent of meeting.
translation:
  language: de
  text: und die Sünde, die sie begangen haben, wird bekannt[a], dann soll die Versammlung einen jungen Stier als Sündopfer darbringen und ihn vor das Zelt der Begegnung bringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Wort חַטָּאת (ḥaṭṭā’t) steht in diesem Vers zweimal: zuerst in der Bedeutung „Sünde“, danach in der Bedeutung „Sündopfer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנֽוֹדְעָה
  choice: wird bekannt
  rationale: Das Nifal von ידע bezeichnet hier, dass die Verfehlung ins Bewusstsein tritt, ohne denjenigen zu benennen, der sie bekannt macht.
- source_word: הַחַטָּאת
  choice: die Sünde
  rationale: Der Relativsatz „die sie begangen haben“ verlangt hier die Bedeutung „Sünde“, nicht „Sündopfer“.
- source_word: אֲשֶׁר חָטְאוּ עָלֶיהָ
  choice: die sie begangen haben
  rationale: Diese natürliche deutsche Verbindung gibt den Bezug auf die konkrete begangene Sünde wieder, ohne die hebräische Präposition übermäßig wörtlich abzubilden.
- source_word: הַקָּהָל
  choice: die Versammlung
  rationale: „Versammlung“ bewahrt den gemeinschaftlichen und rechtlich-kultischen Sinn, ohne unnötig kirchlich geprägt zu sein.
- source_word: וְהִקְרִיבוּ
  choice: soll … darbringen
  rationale: Im Opferkontext bezeichnet das Hifil von קרב das kultische Darbringen; „darbringen“ unterscheidet sich zugleich sinnvoll vom folgenden „bringen“.
- source_word: פַּר בֶּן בָּקָר
  choice: einen jungen Stier
  rationale: Die feste hebräische Tierbezeichnung meint einen Stier aus dem Rindvieh; „junger Stier“ ist im Deutschen natürlich und erfasst die durch בֶּן ausgedrückte Altersangabe besser als das unidiomatische „Sohn des Rindes“.
- source_word: לְחַטָּאת
  choice: als Sündopfer
  rationale: Hier bezeichnet חטאת eindeutig die Opferart und nicht die zuvor genannte Verfehlung.
- source_word: וְהֵבִיאוּ אֹתוֹ
  choice: und ihn … bringen
  rationale: Das Objektpronomen bezieht sich auf den Stier; das Hifil von בוא bedeutet „bringen“.
- source_word: לִפְנֵי אֹהֶל מוֹעֵד
  choice: vor das Zelt der Begegnung
  rationale: Die Formulierung gibt sowohl die Zielrichtung des Bringens als auch den kultischen Ort idiomatisch wieder.
theological_decisions:
- issue: Die doppelte Verwendung von חטאת mit zwei kontextuellen Bedeutungen
  choice: Das erste Vorkommen wird mit „Sünde“, das zweite mit „Sündopfer“ wiedergegeben.
  alternative: Beide Vorkommen einheitlich mit „Sünde“ oder „Sündopfer“ wiederzugeben beziehungsweise das zweite als „Reinigungsopfer“ zu übersetzen.
  rationale: Der Relativsatz kennzeichnet das erste Vorkommen als begangene Verfehlung, während die Präposition לְ und der Opferkontext beim zweiten die Opferart anzeigen. Die unterschiedliche Wiedergabe wahrt die kontextuelle Bedeutung, während die Fußnote die gemeinsame hebräische Wortform sichtbar macht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer kultischer Terminologie. Der mit „und“ beginnende Satz wahrt den Anschluss an den vorausgehenden Vers. „Zelt der Begegnung“ folgt der hebräischen Benennung und vermeidet die stärker traditionsgeprägte Bezeichnung „Stiftshütte“.
