id: LEV.16.7
reference: Leviticus 16:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/לָקַ֖ח אֶת שְׁנֵ֣י הַ/שְּׂעִירִ֑ם וְ/הֶעֱמִ֤יד אֹתָ/ם֙ לִ/פְנֵ֣י יְהוָ֔ה פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/007.yaml
  text: And he shall take the two goats and set them before Yahweh at the entrance of the tent of meeting[a].
translation:
  language: de
  text: Dann soll er die beiden Ziegenböcke nehmen und sie vor Jahwe an den Eingang des Zeltes der Begegnung stellen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַח
  choice: Dann soll er … nehmen
  rationale: Das Qal-Perfekt mit וְ führt in dieser rituellen Anweisungsfolge den nächsten Handlungsschritt ein; „Dann soll er“ gibt den sequenziellen und verpflichtenden Sinn natürlich wieder.
- source_word: שְׁנֵי הַשְּׂעִירִם
  choice: die beiden Ziegenböcke
  rationale: שָׂעִיר bezeichnet hier die für das Ritual bestimmten männlichen Ziegen; „Ziegenböcke“ wahrt diese Spezifizierung und ist im Deutschen eindeutig.
- source_word: וְהֶעֱמִיד אֹתָם
  choice: und sie … stellen
  rationale: Der Hifil von עמד bedeutet, jemanden oder etwas zum Stehen zu bringen beziehungsweise aufzustellen. „stellen“ bewahrt den konkreten räumlichen Vorgang, ohne ihn als kultische „Darbringung“ auszudeuten.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי bezeichnet hier die räumlich-relationale Stellung „vor/in der Gegenwart von“. Der Gottesname יְהוָה wird als „Jahwe“ wiedergegeben.
- source_word: פֶּתַח
  choice: an den Eingang
  rationale: פֶּתַח bezeichnet die Öffnung beziehungsweise den Eingang. Mit dem Bewegungsverb „stellen“ ist im Deutschen „an den Eingang“ idiomatisch.
- source_word: אֹהֶל מוֹעֵד
  choice: Zelt der Begegnung
  rationale: Die Benennung gibt beide Bestandteile des hebräischen Ausdrucks wieder und vermeidet den architektonisch stärker festgelegten Begriff „Stiftshütte“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich den Eigennamen יְהוָה. „Jahwe“ macht den Bundesnamen im Haupttext sichtbar, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz folgt dem Charakter einer fortlaufenden Ritualanweisung; die konkrete Orts- und Bewegungssprache des Hebräischen bleibt erhalten.
