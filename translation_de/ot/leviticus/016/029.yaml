  text: וְ/הָיְתָ֥ה לָ/כֶ֖ם לְ/חֻקַּ֣ת עוֹלָ֑ם בַּ/חֹ֣דֶשׁ הַ֠/שְּׁבִיעִי בֶּֽ/עָשׂ֨וֹר לַ/חֹ֜דֶשׁ תְּעַנּ֣וּ אֶת נַפְשֹֽׁתֵי/כֶ֗ם וְ/כָל מְלָאכָה֙ לֹ֣א תַעֲשׂ֔וּ הָֽ/אֶזְרָ֔ח וְ/הַ/גֵּ֖ר הַ/גָּ֥ר בְּ/תוֹכְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/029.yaml
  text: 'And this shall be for you a permanent statute: in the seventh month[a], on the tenth day of the month, you shall humble yourselves, and you shall do no work, whether the native-born or the sojourner who sojourns among you.'
translation:
  language: de
  text: 'Und dies soll für euch eine ewige Ordnung sein: Im siebten Monat, am zehnten Tag des Monats, sollt ihr euch selbst demütigen[a] und keinerlei Arbeit verrichten. Das gilt sowohl für den Einheimischen als auch für den Fremden, der unter euch lebt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder näher am Wortlaut: „sollt ihr euch selbst bedrücken“. Der Ausdruck wird traditionell so verstanden, dass er auch Fasten einschließt.'
    reason: Lexikalische Alternative und Hinweis auf die traditionelle Auslegung, ohne den Haupttext auf Fasten oder eine spezifisch asketische Praxis zu verengen.
lexical_decisions:
- source_word: וְהָיְתָה
  choice: Und dies soll ... sein
  rationale: Die Rechtsformel mit היה führt eine bleibende Bestimmung ein; „dies“ verweist natürlich auf die vorausgehenden Vorschriften.
- source_word: לְחֻקַּת עוֹלָם
  choice: eine ewige Ordnung
  rationale: חֻקָּה bezeichnet eine festgesetzte Ordnung; עוֹלָם drückt hier ihre unbefristete, fortdauernde Geltung aus.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: im siebten Monat
  rationale: חֹדֶשׁ bezeichnet in dieser Datumsangabe den Kalendermonat.
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: am zehnten Tag des Monats
  rationale: Die hebräische Wendung lautet wörtlich „am Zehnten des Monats“; die Ergänzung „Tag“ sorgt im Deutschen für eindeutige, natürliche Sprache.
- source_word: תְּעַנּוּ אֶת־נַפְשֹׁתֵיכֶם
  choice: sollt ihr euch selbst demütigen
  rationale: Die Piel-Konstruktion von ענה mit נֶפֶשׁ bezeichnet hier Selbsterniedrigung beziehungsweise Selbstentsagung. Die breite Formulierung wahrt den Bedeutungsumfang, ohne das Gebot im Haupttext allein auf Fasten festzulegen.
- source_word: וְכָל־מְלָאכָה לֹא תַעֲשׂוּ
  choice: und keinerlei Arbeit verrichten
  rationale: מְלָאכָה meint Arbeit oder Tätigkeit; „keinerlei Arbeit verrichten“ gibt das umfassende Verbot würdig und idiomatisch wieder.
- source_word: הָאֶזְרָח
  choice: der Einheimische
  rationale: אֶזְרָח bezeichnet das einheimische Mitglied der Gemeinschaft im Gegensatz zum ansässigen Fremden.
- source_word: הַגֵּר הַגָּר בְּתוֹכְכֶם
  choice: der Fremde, der unter euch lebt
  rationale: גֵּר bezeichnet einen ortsansässigen Außenstehenden. Die Wiedergabe vermeidet missverständliche moderne Rechtsbegriffe; das verwandte Verb wird natürlich mit „lebt“ ausgedrückt.
theological_decisions:
- issue: Bedeutung des Gebots zur Selbsterniedrigung am Versöhnungstag
  choice: „sollt ihr euch selbst demütigen“ als breite Wiedergabe im Haupttext
  alternative: „sollt ihr euch kasteien“ beziehungsweise ausdrücklich „sollt ihr fasten“
  rationale: Der hebräische Ausdruck umfasst Selbsterniedrigung oder Selbstentsagung und wird traditionell mit Fasten verbunden, legt sich lexikalisch aber nicht ausschließlich darauf fest. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Rechtsformel bleibt feierlich und verständlich; „Einheimischer“ und „Fremder, der unter euch lebt“ bilden den sozialen Gegensatz ohne unnötig technische oder politisch belastete Begriffe ab.
