  text: וְ/הָֽיְתָה זֹּ֨את לָ/כֶ֜ם לְ/חֻקַּ֣ת עוֹלָ֗ם לְ/כַפֵּ֞ר עַל בְּנֵ֤י יִשְׂרָאֵל֙ מִ/כָּל חַטֹּאתָ֔/ם אַחַ֖ת בַּ/שָּׁנָ֑ה וַ/יַּ֕עַשׂ כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/034.yaml
  text: This shall be for you a permanent statute[a], to make atonement for the sons of Israel for all their sins once in the year[b]. And he did as Yahweh commanded Moses.
translation:
  language: de
  text: 'Dies soll für euch eine ewige Ordnung sein: Einmal im Jahr soll für die Israeliten wegen all ihrer Sünden Sühne erwirkt werden.[a] Und er tat, wie Jahwe Mose geboten hatte.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „um die Israeliten von all ihren Sünden zu reinigen“. Die hebräische Präposition kann die Sünden neben dem Anlass der Sühne auch als das bezeichnen, wovon gereinigt wird.'
    reason: lexical_alternative
  - marker: b
    text: Das Hebräische nennt den Handelnden hier nicht ausdrücklich; im Zusammenhang ist wahrscheinlich Aaron gemeint.
    reason: source_ambiguity
lexical_decisions:
- source_word: וְהָיְתָה זֹּאת לָכֶם
  choice: Dies soll für euch … sein
  rationale: Gibt die rechtliche Festsetzung in natürlichem, würdevollem Deutsch wieder und bewahrt den Bezug auf die angesprochenen Israeliten.
- source_word: לְחֻקַּת עוֹלָם
  choice: eine ewige Ordnung
  rationale: חֻקָּה bezeichnet eine verbindliche Satzung oder Ordnung; עוֹלָם drückt hier bleibende, unabsehbare Geltung aus. „Ewige Ordnung“ bleibt nah am Hebräischen und ist im Deutschen verständlich.
- source_word: לְכַפֵּר
  choice: Sühne geschaffen werden
  rationale: Das priesterliche כפר bezeichnet im Zusammenhang des Versöhnungstags den Vollzug von Sühne. Die passive Formulierung ist im Deutschen natürlich und vermeidet es, den im Infinitiv nicht genannten Handelnden ausdrücklich einzusetzen.
- source_word: עַל בְּנֵי יִשְׂרָאֵל
  choice: für die Israeliten
  rationale: בְּנֵי יִשְׂרָאֵל ist hier die feste Volksbezeichnung. „Israeliten“ ist die natürliche moderne deutsche Entsprechung und meint das ganze Volk, ohne den Ausdruck unnötig auf männliche Angehörige einzuengen.
- source_word: מִכָּל חַטֹּאתָם
  choice: wegen all ihrer Sünden
  rationale: Die Formulierung bezeichnet die Sünden als Anlass beziehungsweise Gegenstand der Sühne. „Wegen“ ergibt klares Deutsch; die mögliche ablösende oder reinigende Nuance von מִן wird in der Fußnote bewahrt.
- source_word: אַחַת בַּשָּׁנָה
  choice: einmal im Jahr
  rationale: Gibt die jährliche Wiederholung idiomatisch und genau wieder.
- source_word: וַיַּעַשׂ
  choice: Und er tat
  rationale: Bewahrt das maskuline Singularverb und lässt wie der hebräische Vers unausgesprochen, wer das Subjekt ist; aus dem Zusammenhang liegt Aaron nahe.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: wie Jahwe Mose geboten hatte
  rationale: Entspricht der hebräischen Erzählformel. Das Plusquamperfekt macht im Deutschen deutlich, dass das Gebot dem Vollzug vorausging; der Gottesname wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Bedeutung von כפר im priesterlichen Zusammenhang
  choice: Sühne schaffen
  alternative: reinigen; entsühnen
  rationale: „Sühne“ hält den kultisch-theologischen Kern des Verbs fest, ohne die im Kontext ebenfalls vorhandene Reinigungsdimension auszuschließen.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen Gottes. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Nicht ausdrücklich genanntes Subjekt von וַיַּעַשׂ
  choice: er
  alternative: Aaron
  rationale: Das Hebräische hat ein maskulines Singularverb, nennt den Handelnden in diesem Vers aber nicht ausdrücklich. Deshalb wird Aaron nicht in den Haupttext eingefügt; die kontextuell wahrscheinliche Zuordnung wird nur erläutert.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem rechtlich-kultischem Ton. „Ewige Ordnung“ und „Sühne“ bewahren die Levitikus eigene Begrifflichkeit; unnötige Archaismen werden vermieden.
