id: LEV.16.3
reference: Leviticus 16:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בְּ/זֹ֛את יָבֹ֥א אַהֲרֹ֖ן אֶל הַ/קֹּ֑דֶשׁ בְּ/פַ֧ר בֶּן בָּקָ֛ר לְ/חַטָּ֖את וְ/אַ֥יִל לְ/עֹלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/003.yaml
  text: 'With this Aaron shall enter the Holy Place: with a bull from the herd for a sin offering[b][a], and a ram for a burnt offering.'
translation:
  language: de
  text: 'So soll Aaron in das Heiligtum hineingehen: mit einem jungen Stier als Sündopfer[a] und einem Widder als Brandopfer.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Reinigungsopfer“. Der hebräische Begriff kann neben dem Bezug auf Sünde auch die kultische Reinigung hervorheben.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּזֹאת
  choice: So
  rationale: Die Verbindung aus ב und זֹאת bezeichnet hier die vorgeschriebene Art und Weise beziehungsweise die dafür nötige Ausstattung. „So“ ist im Deutschen natürlich und führt passend die folgenden Opfergaben ein.
- source_word: יָבֹא
  choice: soll … hineingehen
  rationale: Das Imperfekt hat im gesetzlichen Zusammenhang vorschreibende Kraft. „Soll“ gibt diese Anweisung wieder; „hineingehen“ macht die gerichtete Bewegung in den heiligen Bereich deutlich.
- source_word: אֶל הַקֹּדֶשׁ
  choice: in das Heiligtum
  rationale: הַקֹּדֶשׁ bezeichnet hier im Zusammenhang des Versöhnungstags den heiligen inneren Bereich. „Heiligtum“ ist würdig und lässt die genaue räumliche Abgrenzung so offen, wie es der Ausdruck in diesem Vers tut.
- source_word: בְּפַר בֶּן־בָּקָר
  choice: mit einem jungen Stier
  rationale: פַר בֶּן־בָּקָר ist eine idiomatische Bezeichnung für einen jungen Stier aus dem Rinderbestand. Die deutsche Wiedergabe vermeidet das unnatürliche „Sohn des Rindes“, ohne den Sinn einzuengen.
- source_word: לְחַטָּאת
  choice: als Sündopfer
  rationale: Im Opferkontext bezeichnet חַטָּאת die entsprechende Opferart. „Sündopfer“ ist die herkömmliche, verständliche Wiedergabe; die ebenfalls mögliche Betonung der kultischen Reinigung wird in einer Fußnote bewahrt.
- source_word: וְאַיִל
  choice: und einem Widder
  rationale: אַיִל bedeutet hier eindeutig „Widder“.
- source_word: לְעֹלָה
  choice: als Brandopfer
  rationale: עֹלָה bezeichnet das vollständig auf dem Altar verbrannte Opfer; „Brandopfer“ ist der etablierte deutsche Kultbegriff.
theological_decisions:
- issue: Bedeutungsumfang des Opferbegriffs חַטָּאת
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: „Sündopfer“ wahrt die traditionelle Verbindung des Begriffs mit Sünde, während „Reinigungsopfer“ seine kultisch reinigende Funktion hervorhebt. Da der hebräische Ausdruck beide Aspekte berühren kann, wird die Alternative ausdrücklich in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe gesetzliche Satzform und die kultischen Fachbegriffe bleiben erhalten; unnötig wörtliche Hebraismen werden vermieden.
