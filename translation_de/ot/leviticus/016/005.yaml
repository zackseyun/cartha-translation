id: LEV.16.5
reference: Leviticus 16:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/מֵ/אֵ֗ת עֲדַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל יִקַּ֛ח שְׁנֵֽי שְׂעִירֵ֥י עִזִּ֖ים לְ/חַטָּ֑את וְ/אַ֥יִל אֶחָ֖ד לְ/עֹלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/005.yaml
  text: And from the congregation of the sons of Israel he shall take two male goats for a sin offering and one ram for a burnt offering[a][b].
translation:
  language: de
  text: Und von der Gemeinschaft der Israeliten soll er zwei Ziegenböcke zum Sündopfer[a] und einen Widder zum Brandopfer nehmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Reinigungsopfer«. Der hebräische Ausdruck חַטָּאת kann in Levitikus das Opfer bezeichnen, das Sünde und kultische Unreinheit beseitigt.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּמֵאֵת
  choice: Und von
  rationale: Die Konjunktion und die Präposition führen die Anweisung fort und bezeichnen die Herkunft der Opfertiere.
- source_word: עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: der Gemeinschaft der Israeliten
  rationale: עֵדָה bezeichnet hier die kultisch verfasste Gemeinschaft Israels. Die idiomatische deutsche Wiedergabe erfasst den korporativen Sinn von בְּנֵי יִשְׂרָאֵל, ohne die Zugehörigkeit auf männliche Personen zu beschränken.
- source_word: יִקַּח
  choice: soll er … nehmen
  rationale: Der Imperfekt hat in dieser Ritualvorschrift anweisende Kraft; die deutsche Soll-Form gibt sie natürlich und angemessen wieder.
- source_word: שְׁנֵי שְׂעִירֵי עִזִּים
  choice: zwei Ziegenböcke
  rationale: Die Wortgruppe bezeichnet ausdrücklich zwei männliche Ziegen und wird im Deutschen präzise und knapp wiedergegeben.
- source_word: לְחַטָּאת
  choice: zum Sündopfer
  rationale: Im Opferkontext bezeichnet חַטָּאת die Opferart, die Sünde und kultische Unreinheit behandelt. »Sündopfer« ist die verständliche traditionelle Bezeichnung; die funktionale Alternative wird in einer Fußnote bewahrt.
- source_word: וְאַיִל אֶחָד
  choice: und einen Widder
  rationale: אַיִל bezeichnet spezifisch einen Widder; אֶחָד markiert, im Gegensatz zu den zwei Böcken, die Einzahl.
- source_word: לְעֹלָה
  choice: zum Brandopfer
  rationale: עֹלָה bezeichnet das vollständig auf dem Altar verbrannte Opfer. »Brandopfer« ist dafür der etablierte und verständliche deutsche Ausdruck.
theological_decisions:
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: Israeliten
  alternative: Söhne Israels
  rationale: Die hebräische Wendung lautet formal »Söhne Israels«, bezeichnet hier jedoch idiomatisch das Volk Israel als Ganzes. »Israeliten« wahrt den korporativen Bezug in natürlichem Deutsch und vermeidet eine unbeabsichtigte Beschränkung auf Männer.
- issue: Wiedergabe von חַטָּאת als Opferbezeichnung
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: »Sündopfer« hält die lexikalische Verbindung zu Sünde sichtbar und ist im Deutschen geläufig. Da חַטָּאת in Levitikus zugleich eine reinigende Funktion hat und auch kultische Unreinheit behandelt, wird »Reinigungsopfer« als echte Übersetzungsalternative in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit vertrauter kultischer Terminologie. Die Satzstellung bleibt nah am Hebräischen, ist aber durch die deutsche Verbklammer natürlich gestaltet.
