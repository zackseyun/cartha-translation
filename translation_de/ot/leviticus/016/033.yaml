id: LEV.16.33
reference: Leviticus 16:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/כִפֶּר֙ אֶת מִקְדַּ֣שׁ הַ/קֹּ֔דֶשׁ וְ/אֶת אֹ֧הֶל מוֹעֵ֛ד וְ/אֶת הַ/מִּזְבֵּ֖חַ יְכַפֵּ֑ר וְ/עַ֧ל הַ/כֹּהֲנִ֛ים וְ/עַל כָּל עַ֥ם הַ/קָּהָ֖ל יְכַפֵּֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/033.yaml
  text: Thus he shall make atonement for the Holy Sanctuary[a], and for the Tent of Meeting, and for the altar[b]; and he shall make atonement for the priests and for all the people of the assembly.
translation:
  language: de
  text: So soll er für das heilige Heiligtum[a], für das Zelt der Begegnung und für den Altar Sühne erwirken; ebenso soll er für die Priester und für das ganze Volk der Versammlung Sühne erwirken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das hochheilige Heiligtum“; die hebräische Wendung kann den besonders heiligen Bereich des Heiligtums bezeichnen, ohne hier eindeutig „das Allerheiligste“ zu sagen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר / יְכַפֵּר / יְכַפֵּר
  choice: Sühne erwirken
  rationale: Das wiederholte כפר ist ein kultischer Fachbegriff. „Sühne erwirken“ bewahrt seine ritualtheologische Weite und lässt sowohl die Beseitigung von Verunreinigung als auch die Wiederherstellung des gestörten Verhältnisses anklingen, ohne eine bestimmte Sühnetheorie festzulegen.
- source_word: מִקְדַּשׁ הַקֹּדֶשׁ
  choice: das heilige Heiligtum
  rationale: Die Verbindung bezeichnet den besonders heiligen Bereich des Heiligtums. Die Wiedergabe bleibt nah an der ungewöhnlichen hebräischen Formulierung und legt sie nicht vorschnell auf „das Allerheiligste“ fest.
- source_word: אֹהֶל מוֹעֵד
  choice: das Zelt der Begegnung
  rationale: Diese natürliche deutsche Wiedergabe bewahrt sowohl das Bild des Zeltes als auch dessen Funktion als Ort der Begegnung.
- source_word: הַמִּזְבֵּחַ
  choice: der Altar
  rationale: Direkte und geläufige Wiedergabe des kultischen Begriffs.
- source_word: עַל
  choice: für
  rationale: In Verbindung mit כפר bezeichnet עַל idiomatisch diejenigen, für die Sühne erwirkt wird.
- source_word: הַכֹּהֲנִים
  choice: die Priester
  rationale: Übliche und kontextgerechte Wiedergabe.
- source_word: כָּל עַם הַקָּהָל
  choice: das ganze Volk der versammelten Gemeinde
  rationale: Die Formulierung bewahrt sowohl עַם („Volk“) als auch הַקָּהָל („Versammlung/Gemeinde“) und gibt den gemeinschaftlichen Charakter verständlich wieder.
theological_decisions:
- issue: Sühnesprache für heilige Orte und Personen
  choice: Für Heiligtum, Zelt, Altar, Priester und Volk durchgehend „Sühne erwirken“ verwenden.
  alternative: Bei den heiligen Orten „reinigen“, bei den Personen „Sühne erwirken“ verwenden.
  rationale: Das Hebräische verwendet bewusst dasselbe Verb כפר für Sachen und Personen. Die einheitliche Wiedergabe wahrt die rituelle Einheit und vermeidet eine interpretierende Aufteilung, obwohl Reinigung bei den heiligen Orten mitgemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „Sühne erwirken“ bildet den kultischen Leitbegriff des hebräischen Textes ab; das zweite Vorkommen wird syntaktisch auf Heiligtum, Zelt und Altar bezogen, während das abschließende Vorkommen Priester und Volk umfasst.
