source:
  edition: WLC
  text: וְ/לָקַ֣ח מְלֹֽא הַ֠/מַּחְתָּה גַּֽחֲלֵי אֵ֞שׁ מֵ/עַ֤ל הַ/מִּזְבֵּ֨חַ֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה וּ/מְלֹ֣א חָפְנָ֔י/ו קְטֹ֥רֶת סַמִּ֖ים דַּקָּ֑ה וְ/הֵבִ֖יא מִ/בֵּ֥ית לַ/פָּרֹֽכֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/012.yaml
  text: And he shall take a full censer of coals of fire from upon the altar before Yahweh[a], and both the fullness of his hands of finely ground fragrant incense, and bring it inside the veil.
translation:
  language: de
  text: Dann soll er eine Räucherpfanne voll glühender Kohlen vom Altar nehmen, der vor Jahwe steht, dazu beide Hände voll fein zerstoßenes, wohlriechendes Räucherwerk, und das alles hinter den Vorhang[a] bringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in den Bereich innerhalb des Vorhangs“. Die ungewöhnlich verdichtete hebräische Wendung meint den Raum auf der inneren Seite des Vorhangs, also das innere Heiligtum.'
    reason: lexikalische und räumliche Alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Dann soll er nehmen
  rationale: Die Verbform führt die rituelle Anweisung fort; „soll“ gibt ihren vorschreibenden Charakter in natürlichem Deutsch wieder.
- source_word: מְלֹא הַמַּחְתָּה
  choice: eine Pfanne voll
  rationale: Die Konstruktion bezeichnet eine bis zur vorgesehenen Menge gefüllte Kohlenpfanne. „Eine Pfanne voll“ ist im Deutschen natürlich und bewahrt Gefäß und Mengenangabe.
- source_word: גַּחֲלֵי אֵשׁ
  choice: glühende Kohlen
  rationale: Die hebräische Verbindung bedeutet wörtlich „Feuerkohlen“; „glühende Kohlen“ gibt den konkreten Sinn idiomatisch wieder.
- source_word: מֵעַל הַמִּזְבֵּחַ מִלִּפְנֵי יְהוָה
  choice: vom Altar, der vor Jahwe steht
  rationale: Die Formulierung wahrt sowohl die Herkunft der Kohlen von der Oberfläche des Altars als auch dessen Lage vor Jahwe, ohne im Deutschen schwerfällig zu werden.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וּמְלֹא חָפְנָיו
  choice: dazu beide Hände voll
  rationale: Der Dual bezeichnet beide hohlen Hände; die deutsche Wendung drückt die damit abgemessene Menge klar aus.
- source_word: קְטֹרֶת סַמִּים דַּקָּה
  choice: fein zerstoßenes, wohlriechendes Räucherwerk
  rationale: „Räucherwerk“ bezeichnet den kultischen Stoff, „wohlriechend“ die aromatischen Bestandteile und „fein zerstoßen“ den ausdrücklich genannten Zerkleinerungsgrad.
- source_word: וְהֵבִיא
  choice: und das alles … bringen
  rationale: Das ergänzte „das alles“ macht auf Deutsch deutlich, dass Pfanne und Räucherwerk in den inneren Bereich gebracht werden, ohne einen zusätzlichen Vorgang einzuführen.
- source_word: מִבֵּית לַפָּרֹכֶת
  choice: hinter den Vorhang
  rationale: Die räumlich verdichtete Wendung bezeichnet im Zusammenhang die Bewegung in den durch den Vorhang abgetrennten inneren Bereich. Eine Fußnote hält eine formal nähere Alternative offen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht der Eigenname. „Jahwe“ bewahrt diese Namensform, während „der HERR“ die traditionelle ersetzende Lesung wäre.
- issue: Ziel der Bewegung bei מִבֵּית לַפָּרֹכֶת
  choice: hinter den Vorhang
  alternative: in den Bereich innerhalb des Vorhangs
  rationale: Beide Formulierungen bezeichnen das innere Heiligtum, ohne dessen theologische Bedeutung weiter auszudeuten; die Fußnote bewahrt die sprachliche Alternative.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Sprache für eine rituelle Vorschrift. Konkrete kultische Begriffe bleiben erhalten; schwerfällige Nachbildung hebräischer Mengenformeln wird vermieden, während „beide Hände voll“ die Dualform ausdrücklich wiedergibt.
