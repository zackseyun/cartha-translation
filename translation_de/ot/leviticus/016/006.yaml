  text: וְ/הִקְרִ֧יב אַהֲרֹ֛ן אֶת פַּ֥ר הַ/חַטָּ֖את אֲשֶׁר ל֑/וֹ וְ/כִפֶּ֥ר בַּעֲד֖/וֹ וּ/בְעַ֥ד בֵּיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/006.yaml
  text: Aaron shall present the bull of the sin offering that is for himself[a], and he shall make atonement for himself and for his household.
translation:
  language: de
  text: Aaron soll den Stier für sein Sündopfer[a] herbeibringen und für sich und sein Haus Sühne erwirken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sein Reinigungsopfer“. Das hebräische Wort חַטָּאת kann ein Sündopfer bezeichnen; in manchen Zusammenhängen wird dabei besonders die rituelle Reinigung betont.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: soll … herbeibringen
  rationale: Im Opferkontext bezeichnet הקריב das Heranbringen beziehungsweise Darbringen eines Opfertiers. „Herbeibringen“ wahrt hier den Verfahrensschritt, ohne bereits die vollzogene Schlachtung oder Opferung auszudrücken.
- source_word: פַּר
  choice: den Stier
  rationale: פַּר bezeichnet einen Stier beziehungsweise Jungstier; „Stier“ ist die klare, moderne Entsprechung.
- source_word: הַחַטָּאת
  choice: das Sündopfer
  rationale: Im kultischen Zusammenhang bezeichnet חַטָּאת nicht die abstrakte Sünde, sondern das entsprechende Opfer. Die mögliche funktionale Wiedergabe „Reinigungsopfer“ wird in der Fußnote festgehalten.
- source_word: אֲשֶׁר לוֹ
  choice: das für ihn bestimmt ist
  rationale: Die Wendung kennzeichnet den Stier als Aarons eigenes, für ihn vorgesehenes Opfer. „Für ihn bestimmt“ ist natürlich und vermeidet die mögliche Fehldeutung, es gehe lediglich um Besitz.
- source_word: וְכִפֶּר
  choice: und … Sühne erwirken
  rationale: כפר bezeichnet im priesterlichen Opferkontext das Vollziehen beziehungsweise Bewirken von Sühne. „Sühne erwirken“ erhält die kultisch-theologische Aussage, ohne ihren Mechanismus näher festzulegen.
- source_word: בַּעֲדוֹ
  choice: für sich
  rationale: בְּעַד mit Suffix bezeichnet das Handeln zugunsten beziehungsweise stellvertretend für jemanden; „für sich“ ist hier knapp und idiomatisch.
- source_word: וּבְעַד בֵּיתוֹ
  choice: und sein Haus
  rationale: בַּיִת kann die Hausgemeinschaft oder Familie bezeichnen. „Sein Haus“ bewahrt die traditionelle und im Deutschen verständliche kollektive Ausdrucksweise sowie die leichte Bedeutungsweite des Hebräischen.
theological_decisions:
- issue: Wiedergabe von חַטָּאת in der Opfergesetzgebung
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: Der unmittelbare Zusammenhang verlangt die Bedeutung eines Opfers, nicht die abstrakte Bedeutung „Sünde“. „Sündopfer“ ist die geläufige und transparente Wiedergabe; „Reinigungsopfer“ hebt einen möglichen rituellen Funktionsaspekt hervor und wird deshalb als Alternative in der Fußnote genannt.
- issue: Bedeutungsumfang von בֵּיתוֹ
  choice: sein Haus
  alternative: seine Hausgemeinschaft / seine Familie
  rationale: Das Hebräische meint wahrscheinlich Aarons Familie beziehungsweise Hausgemeinschaft, kann dies jedoch mit dem gewöhnlichen Wort für „Haus“ ausdrücken. Die Hauptübersetzung bewahrt diese Ausdrucksweise, ohne sie auf ein Gebäude zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Verfahrenssprache. „Soll“ gibt den anweisenden Charakter wieder. „Sein Haus“ ist als Hausgemeinschaft zu verstehen und bewahrt zugleich die Bildlichkeit und Bedeutungsweite des Ausgangstextes.
