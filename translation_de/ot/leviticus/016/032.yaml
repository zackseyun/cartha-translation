base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/032.yaml
  text: And the priest who is anointed and whose hand is filled to serve as priest in place of his father shall make atonement[a], and he shall put on the linen garments, the holy garments.
translation:
  language: de
  text: Der Priester, der gesalbt und zum Priesterdienst anstelle seines Vaters eingesetzt wird[a], soll Sühne erwirken. Er soll die leinenen Gewänder anziehen, die heiligen Gewänder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „dessen Hand gefüllt wird“; eine hebräische Wendung für die Einsetzung in den priesterlichen Dienst.'
    reason: Die Fußnote bewahrt die zugrunde liegende hebräische Ordinationsidiomatik, während der Text eine verständliche moderne Wiedergabe bietet.
lexical_decisions:
- source_word: וְכִפֶּר
  choice: soll die Sühne vollziehen
  rationale: כפר bezeichnet hier im priesterlichen Ritualkontext die Durchführung der vorgeschriebenen Sühnehandlung. Diese Wiedergabe ist verständlich und wahrt den kultischen Sinn, ohne den Wirkmechanismus näher festzulegen.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Das Hebräische nennt ihn schlicht „den Priester“ und bestimmt ihn anschließend durch Salbung, Einsetzung und Nachfolge näher. Der kontextuell naheliegende Titel „Hohepriester“ wird daher nicht in den Text eingeführt.
- source_word: אֲשֶׁר יִמְשַׁח אֹתוֹ
  choice: der gesalbt ... wird
  rationale: Die Passivform gibt die identifizierende Relativkonstruktion im Deutschen natürlich wieder; der Kontext betrifft den ordnungsgemäß gesalbten Nachfolger.
- source_word: וַאֲשֶׁר יְמַלֵּא אֶת יָדוֹ
  choice: und ... eingesetzt wird
  rationale: „Die Hand füllen“ ist eine hebräische Wendung für die Einsetzung in das Priesteramt. „Eingesetzt“ vermittelt diesen institutionellen Sinn in natürlichem Deutsch.
- source_word: לְכַהֵן
  choice: zum Priesterdienst
  rationale: Der Infinitiv bezeichnet die Ausübung des priesterlichen Dienstes. Das Substantivgefüge ist im deutschen Satz knapp und idiomatisch.
- source_word: תַּחַת אָבִיו
  choice: anstelle seines Vaters
  rationale: תחת bezeichnet hier die Nachfolge beziehungsweise das Eintreten in die amtliche Stellung des Vaters.
- source_word: וְלָבַשׁ
  choice: Er soll ... anziehen
  rationale: Das Verb bezeichnet das Anlegen der Kleidung und passt zur konkreten rituellen Handlung.
- source_word: בִּגְדֵי הַבָּד
  choice: die leinenen Gewänder
  rationale: בד bezeichnet in diesem Kontext Leinen; „leinene Gewänder“ ist klar und würdevoll.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: die heiligen Gewänder
  rationale: Die appositionelle Wiederholung kennzeichnet die leinenen Gewänder als für den heiligen Gebrauch ausgesondert und bewahrt die Verbindung zu קדשׁ.
theological_decisions:
- issue: Wiedergabe von הַכֹּהֵן als „Priester“ oder „Hohepriester“
  choice: der Priester
  alternative: der Hohepriester
  rationale: Obwohl der Kontext den für den Versöhnungstag zuständigen hohenpriesterlichen Nachfolger bezeichnet, verwendet der hebräische Text nicht den Titel „Hohepriester“, sondern beschreibt „den Priester“ durch seine Salbung, Einsetzung und Nachfolge.
- issue: Wiedergabe der Einsetzungswendung „seine Hand füllen“
  choice: eingesetzt wird
  alternative: dessen Hand gefüllt wird / ordiniert wird
  rationale: Eine wörtliche Wiedergabe wäre für heutige Leser ohne Erklärung undurchsichtig. „Eingesetzt“ gibt die amtliche Installation wieder, ohne eine moderne konfessionelle Ordinationsvorstellung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung verbessert die Lesbarkeit, ohne die Abfolge der beiden hebräischen Verbformen zu verändern. Die appositionelle Wiederholung „die leinenen Gewänder, die heiligen Gewänder“ bleibt erhalten.
