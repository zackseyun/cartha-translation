id: LEV.16.1
reference: Leviticus 16:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר יְהוָה֙ אֶל מֹשֶׁ֔ה אַחֲרֵ֣י מ֔וֹת שְׁנֵ֖י בְּנֵ֣י אַהֲרֹ֑ן בְּ/קָרְבָתָ֥/ם לִ/פְנֵי יְהוָ֖ה וַ/יָּמֻֽתוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/001.yaml
  text: And Yahweh spoke to Moses after the death of Aaron’s two sons[a], when they came near before Yahweh and died.
translation:
  language: de
  text: Und Jahwe sprach zu Mose nach dem Tod der beiden Söhne Aarons, die starben, als sie sich Jahwe näherten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „bei ihrem Nahen vor Jahwe“. Die hebräische Wendung kann auch wiedergegeben werden: „als sie vor Jahwe nahten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: sprach
  rationale: Die übliche Einleitungsformel für eine göttliche Rede wird direkt und würdig wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אַחֲרֵי מוֹת
  choice: nach dem Tod
  rationale: Die Konstruktverbindung bezeichnet idiomatisch den Tod als gemeinsames Ereignis.
- source_word: שְׁנֵי בְּנֵי אַהֲרֹן
  choice: der beiden Söhne Aarons
  rationale: Diese Form bewahrt Zahl und Verwandtschaftsverhältnis in natürlichem Deutsch.
- source_word: בְּקָרְבָתָם
  choice: als sie … traten
  rationale: Die Präposition mit Infinitivus constructus hat hier zeitliche Bedeutung; „vor Jahwe traten“ gibt die Annäherung in kultischem Zusammenhang natürlich wieder.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: Die Wendung bewahrt sowohl den räumlichen als auch den kultischen Bezug auf Jahwes Gegenwart.
- source_word: וַיָּמֻתוּ
  choice: die starben
  rationale: Im Deutschen wird der knappe hebräische Zusammenhang natürlich als Relativsatz wiedergegeben, ohne die Aussage kausal festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen; „Jahwe“ bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Verhältnis zwischen dem Nahen vor Jahwe und dem Tod
  choice: 'zeitlich: „die starben, als sie vor Jahwe traten“'
  alternative: 'kausal: „weil sie vor Jahwe traten und starben“'
  rationale: Die Konstruktion בְּקָרְבָתָם ist zunächst temporal. Die Übersetzung wahrt die Spannung des Textes und legt nicht ausdrücklich fest, ob das Nahen selbst die Ursache ihres Todes war.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, wird jedoch so geordnet, dass der Bezug des Sterbens auf Aarons beide Söhne klar und natürlich verständlich ist.
