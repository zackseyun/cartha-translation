  text: וְ/כִפֶּ֣ר עַל הַ/קֹּ֗דֶשׁ מִ/טֻּמְאֹת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וּ/מִ/פִּשְׁעֵי/הֶ֖ם לְ/כָל חַטֹּאתָ֑/ם וְ/כֵ֤ן יַעֲשֶׂה֙ לְ/אֹ֣הֶל מוֹעֵ֔ד הַ/שֹּׁכֵ֣ן אִתָּ֔/ם בְּ/ת֖וֹךְ טֻמְאֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/016.yaml
  text: Thus he shall make atonement for the sanctuary because of the uncleannesses of the sons of Israel and because of their transgressions[a], for all their sins[c][b]; and so he shall do for the tent of meeting that dwells with them in the midst of their uncleannesses.
translation:
  language: de
  text: So soll er für das Heiligtum Sühne erwirken[a] wegen der Unreinheiten der Israeliten und wegen ihrer Vergehen, wegen all ihrer Sünden. Ebenso soll er es für das Zelt der Begegnung tun, das bei ihnen inmitten ihrer Unreinheiten wohnt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „entsühnen“ beziehungsweise „reinigen“. Das hebräische Verb bezeichnet hier eine kultische Handlung, die das Heiligtum von den Auswirkungen der Unreinheiten und Sünden befreit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר
  choice: soll er Sühne erwirken
  rationale: כפר bezeichnet hier die kultische Handlung, die Sünde und Unreinheit hinsichtlich des Heiligtums behandelt. „Sühne erwirken“ bewahrt den umfassenden ritualtheologischen Gehalt besser als das engere „reinigen“.
- source_word: עַל הַקֹּדֶשׁ
  choice: für das Heiligtum
  rationale: הַקֹּדֶשׁ bezeichnet in diesem Zusammenhang den heiligen Bezirk beziehungsweise das Heiligtum. „Für“ gibt עַל bei כפר im Deutschen idiomatisch wieder.
- source_word: מִטֻּמְאֹת
  choice: wegen der Unreinheiten
  rationale: מִן bezeichnet hier den Anlass beziehungsweise die Ursache der Sühnung. Der Plural „Unreinheiten“ wahrt die kultische Kategorie und die hebräische Form.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: der Israeliten
  rationale: Die idiomatische deutsche Volksbezeichnung gibt den korporativen Bezug von בְּנֵי יִשְׂרָאֵל präzise wieder; „Söhne Israels“ könnte im heutigen Deutsch fälschlich nur männliche Personen nahelegen.
- source_word: וּמִפִּשְׁעֵיהֶם
  choice: und wegen ihrer Vergehen
  rationale: פשע bezeichnet schuldhafte Übertretung und kann auch den Beiklang der Auflehnung tragen. „Vergehen“ ist verständlich, ernst und legt den rebellischen Aspekt nicht in jedem Fall zwingend fest.
- source_word: לְכָל חַטֹּאתָם
  choice: wegen all ihrer Sünden
  rationale: חטאות meint im Parallelismus am ehesten Sünden, nicht Sündopfer. Die Wiederholung von „wegen“ macht den Bezug im Deutschen klar.
- source_word: וְכֵן יַעֲשֶׂה
  choice: Ebenso soll er es tun
  rationale: Die Formulierung bezeichnet eine entsprechende rituelle Handlung am Zelt der Begegnung und ist zugleich knapp und natürlich.
- source_word: לְאֹהֶל מוֹעֵד
  choice: für das Zelt der Begegnung
  rationale: Die Wendung bildet אֹהֶל מוֹעֵד transparent und im Deutschen verständlich ab, ohne den traditionelleren, aber weniger unmittelbaren Ausdruck „Stiftshütte“ einzutragen.
- source_word: הַשֹּׁכֵן אִתָּם
  choice: das bei ihnen … wohnt
  rationale: Das Partizip שׁכן beschreibt das Zelt als bleibend bei Israel befindlich. „Wohnt“ bewahrt die auffällige Personifikation des hebräischen Textes.
- source_word: בְּתוֹךְ טֻמְאֹתָם
  choice: inmitten ihrer Unreinheiten
  rationale: „Inmitten“ erhält das räumliche Bild; der Plural entspricht dem Hebräischen und betont die fortdauernde Nähe des Heiligtums zu den kultischen Unreinheiten des Volkes.
theological_decisions:
- issue: Bedeutung von כפר am Versöhnungstag
  choice: Sühne erwirken
  alternative: reinigen; entsühnen
  rationale: Der Ritus behandelt sowohl Unreinheit als auch Sünde. Die gewählte Formulierung bewahrt die umfassende kultische Bedeutung, ohne כפר auf bloße Reinigung oder auf eine einzelne Sühnetheorie zu verengen.
- issue: Bezug von הַשֹּׁכֵן
  choice: Das Zelt der Begegnung ist das grammatische Bezugswort und wird als bei ihnen wohnend beschrieben.
  alternative: Die Formulierung indirekt auf Gottes Wohnen unter Israel beziehen.
  rationale: Das nächstliegende grammatische Bezugswort ist אֹהֶל מוֹעֵד. Die ungewöhnliche Aussage wird erhalten, statt sie durch eine theologische Explikation zu ersetzen.
- issue: Bedeutung von חַטֹּאתָם
  choice: ihre Sünden
  alternative: ihre Sündopfer
  rationale: Der Zusammenhang mit Unreinheiten und Vergehen spricht für begangene Sünden. Die mögliche kultische Bedeutung des Substantivs wird hier nicht gewählt, weil sie den Parallelismus weniger überzeugend erklärt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlichem kultischem Wortschatz. „Zelt der Begegnung“ ist transparent; „wohnt“ bewahrt bewusst die markante Ausdrucksweise des Ausgangstextes. Der einzige Fußnotenmarker [a] steht unmittelbar beim erläuterten Ausdruck.
