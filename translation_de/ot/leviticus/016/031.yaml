  text: שַׁבַּ֨ת שַׁבָּת֥וֹן הִיא֙ לָ/כֶ֔ם וְ/עִנִּיתֶ֖ם אֶת נַפְשֹׁתֵי/כֶ֑ם חֻקַּ֖ת עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/031.yaml
  text: It is a Sabbath of complete rest for you[a], and you shall humble yourselves; it is a permanent statute.
translation:
  language: de
  text: Es ist für euch ein Sabbat völliger Ruhe, und ihr sollt euch demütigen[a]; das ist eine immerwährende Ordnung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: euch selbst peinigen; traditionell wird dies auch als Fasten und Selbstverzicht verstanden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבַּת
  choice: Sabbat
  rationale: Der feste kultisch-theologische Begriff der Tora wird beibehalten; gemeint ist nicht bloß ein beliebiger Ruhetag.
- source_word: שַׁבָּתוֹן
  choice: völliger Ruhe
  rationale: Die Formulierung gibt die verstärkende Verbindung שַׁבַּת שַׁבָּתוֹן natürlich als einen Sabbat uneingeschränkter Ruhe wieder.
- source_word: הִיא לָכֶם
  choice: Es ist für euch
  rationale: Die prädikative Aussage an die Gemeinschaft wird in natürlichem Deutsch wiedergegeben, ohne eine zusätzliche zeitliche Nuance einzutragen.
- source_word: וְעִנִּיתֶם
  choice: ihr sollt euch selbst demütigen
  rationale: Im kultischen Zusammenhang bezeichnet das Piel von ענה eine Selbsterniedrigung beziehungsweise Selbstentsagung. Die allgemeine Formulierung wahrt den weiteren Sinn des Hebräischen und legt ihn nicht ausschließlich auf Fasten fest.
- source_word: נַפְשֹׁתֵיכֶם
  choice: euch selbst
  rationale: נֶפֶשׁ ist hier Bestandteil einer reflexiven hebräischen Wendung. Die wörtliche Wiedergabe „eure Seelen“ wäre im modernen Deutschen missverständlich.
- source_word: חֻקַּת עוֹלָם
  choice: eine immerwährende Ordnung
  rationale: Die Wendung vermittelt die dauerhaft geltende kultisch-rechtliche Vorschrift in verständlichem, würdigem Deutsch.
theological_decisions:
- issue: Bedeutung des Gebots zur Selbsterniedrigung am Versöhnungstag
  choice: ihr sollt euch selbst demütigen
  alternative: ihr sollt euch selbst kasteien; ihr sollt fasten
  rationale: Die hebräische Wendung ענה + נפשׁ ist weiter gefasst als ein ausdrückliches Verb für Fasten. Daher bleibt der Haupttext allgemein, während die traditionelle Einbeziehung von Fasten und Selbstentsagung in der Fußnote genannt wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sabbat“ bewahrt die kultische Bezeichnung; „völlige Ruhe“ verdeutlicht die verstärkende Doppelwendung. Die breitere hebräische Formulierung zur Selbsterniedrigung bleibt erhalten.
