base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/022.yaml
  text: The goat shall carry on itself all their iniquities to a cut-off land[a], and he shall send the goat away into the wilderness.
translation:
  language: de
  text: Der Ziegenbock soll alle ihre Verfehlungen auf sich in ein abgesondertes Land[a] tragen; dann soll man den Ziegenbock in die Wüste schicken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in ein einsames Land«, »in ein unzugängliches Land« oder »in ein ödes Land«. Der hebräische Ausdruck bezeichnet wahrscheinlich ein von bewohntem Gebiet abgesondertes oder getrenntes Land.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשָׂא
  choice: soll … tragen
  rationale: נשׂא bezeichnet hier das konkrete Tragen bzw. Forttragen. Die Formulierung bewahrt das anschauliche Ritualbild.
- source_word: הַשָּׂעִיר
  choice: der Ziegenbock
  rationale: שָׂעִיר bezeichnet in diesem kultischen Zusammenhang einen männlichen Ziegenbock; im Deutschen ist die Geschlechtsangabe natürlich und präzise.
- source_word: עָלָיו
  choice: auf sich
  rationale: Die Wendung gibt wieder, dass die Verfehlungen auf dem Ziegenbock liegen und von ihm getragen werden.
- source_word: כָּל עֲוֺנֹתָם
  choice: alle ihre Verfehlungen
  rationale: עָוֹן kann Schuld, Verkehrtheit oder schuldhafte Verfehlung bezeichnen. „Verfehlungen“ erhält den moralischen Gehalt, ohne ausschließlich den Schuldzustand statt der schuldhaften Taten zu bezeichnen.
- source_word: אֶל אֶרֶץ גְּזֵרָה
  choice: in ein abgesondertes Land
  rationale: גְּזֵרָה ist selten und wohl von der Vorstellung des Abtrennens oder Abgesondertseins geprägt. „Abgesondertes Land“ bleibt nahe am Bild und klingt im Deutschen verständlicher als „abgeschnittenes Land“.
- source_word: וְשִׁלַּח
  choice: dann soll er … schicken
  rationale: שׁלח bezeichnet hier das Wegschicken bzw. Freilassen des Tieres. Der Kontext macht die Bewegung fort von der Gemeinschaft deutlich.
- source_word: בַּמִּדְבָּר
  choice: in die Wüste
  rationale: מִדְבָּר bezeichnet unbewohntes Wildnis-, Steppen- oder Wüstenland. „Wüste“ ist hier eine natürliche und kontextgerechte deutsche Wiedergabe.
theological_decisions:
- issue: Das Bild vom Tragen der Verfehlungen im Ritual des Ziegenbocks
  choice: Die konkrete Aussage, dass der Ziegenbock die Verfehlungen auf sich trägt, bleibt erhalten.
  alternative: 'Interpretierend formulieren: „nimmt ihre Sünden weg“.'
  rationale: Der hebräische Text schildert sichtbar Übertragung und Entfernung. Die konkrete Formulierung bewahrt diese Symbolik, ohne spätere theologische Deutungen in den Vers einzutragen.
- issue: Bedeutung von אֶרֶץ גְּזֵרָה
  choice: „ein abgesondertes Land“ im Haupttext
  alternative: „ein einsames Land“, „ein unzugängliches Land“ oder „ein ödes Land“
  rationale: Der seltene Ausdruck ist lexikalisch nicht völlig eindeutig. Die Hauptfassung wahrt das Trennungsbild; die Fußnote erhält plausible kontextuelle Alternativen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Ziegenbock“ ist präzise und allgemein verständlich; „Verfehlungen“ bewahrt die moralisch-kultische Tragweite von עָוֹן. Das Semikolon bildet die eng verbundenen, aufeinanderfolgenden Ritualhandlungen ab.
