id: LEV.16.9
reference: Leviticus 16:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הִקְרִ֤יב אַהֲרֹן֙ אֶת הַ/שָּׂעִ֔יר אֲשֶׁ֨ר עָלָ֥ה עָלָ֛י/ו הַ/גּוֹרָ֖ל לַ/יהוָ֑ה וְ/עָשָׂ֖/הוּ חַטָּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/009.yaml
  text: Then Aaron shall present the goat on which the lot for Yahweh fell[a], and make it a sin offering.
translation:
  language: de
  text: Dann soll Aaron den Ziegenbock, auf den das Los für Jahwe gefallen ist,[a] herbeibringen und ihn als Sündopfer darbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für den das Los für Jahwe herauskam“.'
    reason: Die hebräische Wendung lässt sich näher an ihrer bildhaften Form auch mit „herauskam“ wiedergeben; „auf den … gefallen ist“ ist im Deutschen idiomatischer.
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: soll … herbeibringen
  rationale: Das Hifil von קרב bezeichnet im Opferkontext das rituelle Heranbringen bzw. Vorführen. „Herbeibringen“ wahrt diesen vorbereitenden Sinn, ohne bereits vorwegzunehmen, dass das Tier geopfert wird.
- source_word: הַשָּׂעִיר
  choice: den Ziegenbock
  rationale: שָׂעִיר bezeichnet hier den männlichen Ziegenbock. Die ausdrückliche Wiedergabe des Geschlechts ist im Deutschen natürlich und entspricht der kultischen Tierbezeichnung.
- source_word: אֲשֶׁר עָלָה עָלָיו הַגּוֹרָל
  choice: auf den das Los … gefallen ist
  rationale: „Das Los fällt auf jemanden/etwas“ ist die idiomatische deutsche Entsprechung der hebräischen Wendung עלה עליו הגורל und bezeichnet die durch das Los erfolgte Zuweisung.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition ל kennzeichnet die Bestimmung des Loses; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: וְעָשָׂהוּ חַטָּאת
  choice: und ihn als Sündopfer darbringen
  rationale: חַטָּאת bezeichnet in diesem kultischen Zusammenhang ein Sündopfer. עשה mit Objektpronomen und Opferbezeichnung meint, das Tier entsprechend zu behandeln bzw. darzubringen; die Formulierung ist im Deutschen klarer als das wörtlichere „ihn zum Sündopfer machen“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Bundesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von חַטָּאת im Opfergesetz
  choice: Sündopfer
  alternative: Sünde
  rationale: Im unmittelbaren Ritualzusammenhang bezeichnet חַטָּאת die Opferart, nicht abstrakt die Sünde. Die kultische Bedeutung wird daher ausdrücklich wiedergegeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am hebräischen Ablauf; kultische Fachbegriffe werden verständlich und konsistent wiedergegeben.
