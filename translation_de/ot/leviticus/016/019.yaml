id: LEV.16.19
reference: Leviticus 16:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הִזָּ֨ה עָלָ֧י/ו מִן הַ/דָּ֛ם בְּ/אֶצְבָּע֖/וֹ שֶׁ֣בַע פְּעָמִ֑ים וְ/טִהֲר֣/וֹ וְ/קִדְּשׁ֔/וֹ מִ/טֻּמְאֹ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/019.yaml
  text: He shall sprinkle some of the blood on it with his finger seven times[c][b][a], and cleanse it and consecrate it from the uncleannesses of the sons of Israel.
translation:
  language: de
  text: Dann soll er mit seinem Finger siebenmal etwas von dem Blut darauf sprengen. So soll er ihn[a] von den Unreinheiten der Israeliten reinigen[b] und heiligen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist der Altar aus dem vorhergehenden Vers.
    reason: Referenzklärung
  - marker: b
    text: 'Oder: „rituell rein machen“. Das hebräische Verb bezeichnet hier die kultische Reinigung.'
    reason: Lexikalische Alternative
  - marker: c
    text: 'Oder: „als heilig aussondern“.'
    reason: Lexikalische Alternative
lexical_decisions:
- source_word: וְהִזָּה
  choice: Dann soll er … sprengen
  rationale: Das Hifil von נזה bezeichnet im priesterlichen Ritual das Sprengen von Blut. „Sprengen“ ist im Deutschen die geläufige kultische Bezeichnung; „dann“ gibt den fortlaufenden Anweisungscharakter natürlich wieder.
- source_word: עָלָיו
  choice: darauf
  rationale: Das Suffix verweist auf den im vorherigen Vers genannten Altar. Das maskuline Pronomen „ihn“ im Folgesatz macht diesen Bezug deutlich.
- source_word: מִן־הַדָּם
  choice: etwas von dem Blut
  rationale: Die partitive Bedeutung von מִן wird idiomatisch und genau wiedergegeben.
- source_word: בְּאֶצְבָּעוֹ
  choice: mit seinem Finger
  rationale: Das instrumentale ב bezeichnet das Mittel der Handlung.
- source_word: שֶׁבַע פְּעָמִים
  choice: siebenmal
  rationale: Bewahrt die genaue rituelle Anzahl in natürlichem Deutsch.
- source_word: וְטִהֲרוֹ
  choice: So soll er ihn … reinigen
  rationale: טהר bezeichnet hier das rituelle Reinigen eines Kultgegenstands. „Reinigen“ ist verständlich und wahrt den kultischen Sinn.
- source_word: וְקִדְּשׁוֹ
  choice: und heiligen
  rationale: קדש bedeutet hier, den Altar heilig zu machen beziehungsweise als heilig auszusondern. „Heiligen“ bildet den hebräischen Begriff transparent ab.
- source_word: מִטֻּמְאֹת
  choice: von den Unreinheiten
  rationale: Der Plural des Hebräischen bleibt erhalten. „Unreinheiten“ bezeichnet hier kultische Verunreinigungen, nicht bloß Schmutz oder moralische Schuld.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: der Israeliten
  rationale: Die feste hebräische Kollektivbezeichnung wird in modernem Standarddeutsch natürlich als „Israeliten“ wiedergegeben; sie bezeichnet das Volk Israel insgesamt.
theological_decisions:
- issue: Rituelle Reinigung und Heiligung des Altars
  choice: Der Altar wird von den kultischen Unreinheiten Israels gereinigt und geheiligt.
  alternative: „entsühnen und weihen“ oder „rein machen und heilig machen“
  rationale: Die beiden ausdrücklich gebrauchten Verben טהר und קדש werden getrennt wiedergegeben. Die Formulierung beschreibt die kultische Wirkung des Rituals auf den Altar, ohne sie als moralische Bekehrung oder innere Erneuerung umzudeuten.
- issue: Bezug der maskulinen Objektsuffixe
  choice: „ihn“ bezieht sich auf den Altar aus Vers 18.
  alternative: Das im Deutschen weniger eindeutige „ihn/es“ oder die Wiederholung „den Altar“
  rationale: Der hebräische Text setzt den Bezug aus dem Kontext voraus. Das deutsche Maskulinum wahrt diesen Zusammenhang knapp; eine Fußnote macht ihn ausdrücklich kenntlich.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: „Israeliten“
  alternative: „Söhne Israels“ oder „Kinder Israels“
  rationale: In dieser festen Kollektivformel bezeichnet בְּנֵי יִשְׂרָאֵל das ganze Volk. „Israeliten“ ist im modernen Deutschen sachlich genau und vermeidet den möglichen Fehlschluss, nur männliche Personen seien gemeint.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlicher priesterlicher Fachsprache. Die Satzteilung erhöht die Lesbarkeit, ohne die Abfolge oder den Zusammenhang der hebräischen Verben aufzulösen. Alle Fußnotenmarker stehen unmittelbar bei den erläuterten Ausdrücken.
