  text: וְ/לָקַח֙ מִ/דַּ֣ם הַ/פָּ֔ר וְ/הִזָּ֧ה בְ/אֶצְבָּע֛/וֹ עַל פְּנֵ֥י הַ/כַּפֹּ֖רֶת קֵ֑דְמָ/ה וְ/לִ/פְנֵ֣י הַ/כַּפֹּ֗רֶת יַזֶּ֧ה שֶֽׁבַע פְּעָמִ֛ים מִן הַ/דָּ֖ם בְּ/אֶצְבָּעֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/014.yaml
  text: And he shall take some of the bull's blood and sprinkle it with his finger on the front of the mercy seat[a], eastward; and before the mercy seat he shall sprinkle some of the blood with his finger seven times.
translation:
  language: de
  text: Dann soll er etwas vom Blut des Stieres nehmen und es mit seinem Finger auf die dem Osten zugewandte Seite der Sühneplatte[a] sprengen. Vor der Sühneplatte soll er mit seinem Finger siebenmal etwas von dem Blut sprengen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Deckplatte“. Das hebräische Wort kapporet bezeichnet die Deckplatte der Bundeslade, die mit der Sühnehandlung verbunden ist.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Dann soll er nehmen
  rationale: Die Verbform führt im Zusammenhang die vorgeschriebene Abfolge des Rituals fort; „soll“ gibt den Anweisungscharakter im modernen Deutschen natürlich wieder.
- source_word: מִדַּם הַפָּר
  choice: etwas vom Blut des Stieres
  rationale: 'מִן ist hier partitiv: Es wird eine gewisse Menge des Blutes genommen, nicht das gesamte Blut.'
- source_word: וְהִזָּה / יַזֶּה
  choice: sprengen
  rationale: נזה bezeichnet im priesterschriftlichen Ritual das gezielte Aufbringen von Blut. „Sprengen“ ist im Deutschen für diesen kultischen Vorgang präziser als das alltägliche „spritzen“.
- source_word: בְאֶצְבָּעוֹ
  choice: mit seinem Finger
  rationale: Die Präposition bezeichnet das verwendete Mittel; die Formulierung ist klar und idiomatisch.
- source_word: עַל פְּנֵי הַכַּפֹּרֶת
  choice: auf die Vorderseite der Sühneplatte
  rationale: פְּנֵי kann die Vorderseite beziehungsweise zugewandte Fläche bezeichnen. Zusammen mit קֵדְמָה wird die östliche Ausrichtung der besprengten Seite angegeben.
- source_word: הַכַּפֹּרֶת
  choice: Sühneplatte
  rationale: Der Ausdruck bezeichnet die Deckplatte der Bundeslade und ist mit dem Sühneritus verbunden. „Sühneplatte“ wahrt sowohl den Gegenstandsbezug als auch die kultische Bedeutung.
- source_word: קֵדְמָה
  choice: nach Osten hin
  rationale: Das Richtungsadverb bezeichnet die Ausrichtung nach Osten, ohne genauer festzulegen, ob die gesamte Fläche oder speziell deren östlicher Bereich gemeint ist.
- source_word: וְלִפְנֵי הַכַּפֹּרֶת
  choice: Vor die Sühneplatte
  rationale: לִפְנֵי bezeichnet den Raum vor dem Gegenstand und unterscheidet diese zweite Blutapplikation von der ersten auf der Platte.
- source_word: שֶׁבַע פְּעָמִים
  choice: siebenmal
  rationale: Die ausdrücklich genannte Zahl wird unverändert bewahrt, da sie zum vorgeschriebenen Ritual gehört.
theological_decisions:
- issue: Wiedergabe von הַכַּפֹּרֶת
  choice: Sühneplatte
  alternative: Deckplatte
  rationale: Der hebräische Begriff bezeichnet konkret den Deckel beziehungsweise die Deckplatte der Lade, steht aber zugleich in enger Beziehung zur Sühnehandlung. „Sühneplatte“ erhält beide Aspekte; die sachlich-konkretere Alternative wird in einer Fußnote genannt.
- issue: Räumliches Verhältnis der ersten Besprengung
  choice: auf die Vorderseite der Sühneplatte, nach Osten hin
  alternative: auf die Ostseite der Sühneplatte
  rationale: Die gewählte Formulierung hält die Verbindung von עַל פְּנֵי und dem Richtungsadverb קֵדְמָה sichtbar und vermeidet eine unnötig enge geometrische Festlegung.
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer ritualrechtlicher Satzführung. Der traditionelle Fachbegriff „Sühneplatte“ wird durch eine knappe Fußnote erläutert; unnötig altertümliche Formen werden vermieden.
