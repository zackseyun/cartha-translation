review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt die rituale Anweisung, das partitive „etwas vom Blut“, das Instrument („mit seinem Finger“) und die siebenfache Besprengung zutreffend wieder. Bei לִפְנֵי handelt es sich jedoch um eine Ortsangabe („vor der Sühneplatte“), nicht um eine Bewegungsrichtung („vor die Sühneplatte“). Die erste Ortsbestimmung sollte zudem die östliche Ausrichtung als Lage der besprengten Seite klarer ausdrücken.
  naturalness: „Vor die Sühneplatte ... sprengen“ klingt im Deutschen wegen des Akkusativs richtungsbezogen und ist daher unnatürlich. „Vor der Sühneplatte“ ist idiomatisch und sachlich präzise. Die Formulierung „auf die dem Osten zugewandte Seite“ vermeidet die etwas sperrige Verbindung „Vorderseite ..., nach Osten hin“.
  terminology: „Sühneplatte“ ist als konkrete und zugleich kultisch profilierte Wiedergabe von כַּפֹּרֶת vertretbar. Die Fußnote wahrt mit „Deckplatte“ die konkrete lexikalische Alternative und erklärt den Bezug zur Bundeslade ohne zusätzliche dogmatische Deutung.
  issues:
  - severity: medium
    issue: Kasus und räumliche Bedeutung bei „Vor die Sühneplatte“
    rationale: Das hebräische לִפְנֵי bezeichnet hier den Ort vor der kapporet, an dem Blut gesprengt wird. Deutsch verlangt hierfür „vor der Sühneplatte“ (Dativ); „vor die“ legt eine Bewegung bis vor den Gegenstand nahe.
  - severity: low
    issue: Unklare Verbindung von „Vorderseite“ und „nach Osten hin“
    rationale: קֵדְמָה spezifiziert die östliche Ausrichtung der ersten Besprengung. „Auf die dem Osten zugewandte Seite“ gibt diesen räumlichen Zusammenhang im modernen Deutsch klarer wieder, ohne über die genaue Geometrie hinauszugehen.
  revised_text: Dann soll er etwas vom Blut des Stieres nehmen und es mit seinem Finger auf die dem Osten zugewandte Seite der Sühneplatte[a] sprengen. Vor der Sühneplatte soll er mit seinem Finger siebenmal etwas von dem Blut sprengen.
  revised_footnotes:
