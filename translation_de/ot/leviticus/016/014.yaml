- from: Dann soll er etwas vom Blut des Stieres nehmen und es mit seinem Finger auf die Vorderseite der Sühneplatte[a], nach Osten hin, sprengen. Vor die Sühneplatte soll er mit seinem Finger siebenmal etwas von dem Blut sprengen.
  to: Dann soll er etwas vom Blut des Stieres nehmen und es mit seinem Finger auf die dem Osten zugewandte Seite der Sühneplatte[a] sprengen. Vor der Sühneplatte soll er mit seinem Finger siebenmal etwas von dem Blut sprengen.
  rationale: Die Revision berichtigt die Ortsangabe der zweiten Besprengung und präzisiert die östliche Ausrichtung der ersten. Sie bewahrt Reihenfolge, Partitiv, Instrument und Zahl des hebräischen Textes sowie den bestehenden Fußnotenanker.
