  text: וְ/הַ/שָּׂעִ֗יר אֲשֶׁר֩ עָלָ֨ה עָלָ֤י/ו הַ/גּוֹרָל֙ לַ/עֲזָאזֵ֔ל יָֽעֳמַד חַ֛י לִ/פְנֵ֥י יְהוָ֖ה לְ/כַפֵּ֣ר עָלָ֑י/ו לְ/שַׁלַּ֥ח אֹת֛/וֹ לַ/עֲזָאזֵ֖ל הַ/מִּדְבָּֽרָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/010.yaml
  text: But the goat on which the lot for Azazel fell shall be presented alive before Yahweh[a], to make atonement over it[b], to send it away into the wilderness to Azazel.
translation:
  language: de
  text: Der Ziegenbock aber, auf den das Los für Asasel fiel, soll lebendig vor den HERRN gestellt werden, um an ihm Sühne zu vollziehen[b] und ihn zu Asasel[a] in die Wüste fortzuschicken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Bedeutung des hebräischen Ausdrucks „Asasel“ ist umstritten. Er kann ein Name sein oder mit dem Wegschaffen in Verbindung stehen; traditionell wird er auch mit „Sündenbock“ wiedergegeben.
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „um über ihm Sühne zu vollziehen“. Oder: „um für ihn Sühne zu erwirken“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשָּׂעִיר
  choice: Der Ziegenbock aber
  rationale: שָׂעִיר bezeichnet hier im Ritual einen männlichen Ziegenbock. „Aber“ macht den Gegensatz zum zuvor genannten Bock deutlich.
- source_word: אֲשֶׁר עָלָה עָלָיו הַגּוֹרָל
  choice: auf den das Los … fiel
  rationale: Die deutsche Wendung gibt das hebräische Losentscheidungsidiom natürlich und genau wieder.
- source_word: לַעֲזָאזֵל
  choice: für Asasel
  rationale: Die umstrittene Bezeichnung עֲזָאזֵל wird transliteriert, damit ihre mögliche Bedeutung als Name, Ortsbezeichnung oder Ausdruck der Entfernung nicht vorschnell festgelegt wird.
- source_word: יָעֳמַד חַי
  choice: soll lebend … gestellt werden
  rationale: Die passive beziehungsweise kausative Form wird mit „gestellt werden“ wiedergegeben; „lebend“ betont den Gegensatz zum geschlachteten Bock.
- source_word: לִפְנֵי יְהוָה
  choice: vor den HERRN
  rationale: „Vor“ entspricht dem kultischen Präsentationskontext; der Gottesname wird in der geläufigen deutschen Bibelkonvention als „der HERR“ wiedergegeben.
- source_word: לְכַפֵּר עָלָיו
  choice: um über ihm Sühne zu erwirken
  rationale: „Sühne erwirken“ gibt die kultische Bedeutung von כפר wieder, während „über ihm“ die Präposition עַל bewahrt und die genaue Beziehung des Bockes zur Sühne offenlässt.
- source_word: לְשַׁלַּח אֹתוֹ
  choice: ihn … fortzuschicken
  rationale: Die Zweckangabe bezeichnet das Wegsenden des Bockes und wird in natürlichem Deutsch wiedergegeben.
- source_word: הַמִּדְבָּרָה
  choice: in die Wüste
  rationale: Die hebräische Richtungsendung bezeichnet eine Bewegung zur beziehungsweise in die Wüste.
theological_decisions:
- issue: Bedeutung von עֲזָאזֵל
  choice: Asasel (Transliteration)
  alternative: Sündenbock; vollständige Entfernung; Name eines Wesens oder Ortes
  rationale: Die Bedeutung ist umstritten. Die Transliteration bewahrt die Mehrdeutigkeit und vermeidet, eine bestimmte Deutung in den Haupttext einzutragen.
- issue: Bedeutung von לְכַפֵּר עָלָיו
  choice: über ihm Sühne erwirken
  alternative: für ihn Sühne erwirken
  rationale: Die Wiedergabe mit „über“ hält offen, ob der Bock als Gegenstand, Träger oder ritueller Bezugspunkt der Sühnehandlung verstanden wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, ist aber flüssig lesbar. Die umstrittenen kultischen Ausdrücke werden nicht konfessionell vereindeutigt.
