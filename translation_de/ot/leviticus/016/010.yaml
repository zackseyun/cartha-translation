  source_fidelity: Der Entwurf gibt die Satzstruktur, den Losentscheid, die Lebendpräsentation vor JHWH, die umstrittene Bezeichnung Asasel und die Sendung in die Wüste insgesamt zuverlässig wieder. Die Transliteration „Asasel“ bewahrt die Mehrdeutigkeit von לַעֲזָאזֵל angemessen. Die Präposition עַל bei לְכַפֵּר עָלָיו sollte jedoch nicht durch die im Deutschen kaum verständliche Wendung „über ihm Sühne erwirken“ wiedergegeben werden.
  naturalness: „Über ihm Sühne zu erwirken“ ist im modernen Standarddeutsch nicht idiomatisch. „An ihm Sühne zu vollziehen“ ist eine natürliche, würdige kultische Formulierung und legt die durch עַל bezeichnete genaue Relation weniger fest als „für ihn“. Die Stellung „zu Asasel in die Wüste“ macht zudem beide Zielangaben klarer erkennbar.
  terminology: „Ziegenbock“, „der HERR“, „Sühne“ und „Asasel“ sind registergerecht. Die Fußnote zu Asasel sollte die umstrittene Deutung als „Sündenbock“ als traditionelle Wiedergabe, nicht als gleichrangige eindeutige Bedeutung, kennzeichnen. Die Fußnote zu b kann die wörtliche Präposition transparent machen und die mögliche Lesart „für ihn“ erhalten.
