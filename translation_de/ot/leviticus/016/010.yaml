revisions:
- from: Der Ziegenbock aber, auf den das Los für Asasel fiel, soll lebend vor den HERRN gestellt werden, um über ihm Sühne zu erwirken[b] und ihn für Asasel[a] in die Wüste fortzuschicken.
  to: Der Ziegenbock aber, auf den das Los für Asasel fiel, soll lebendig vor den HERRN gestellt werden, um an ihm Sühne zu vollziehen[b] und ihn zu Asasel[a] in die Wüste fortzuschicken.
  rationale: Die Revision ersetzt ausschließlich die nicht idiomatische Wendung „über ihm Sühne zu erwirken“ durch eine im Deutschen verständliche kultische Formulierung und dokumentiert die wörtliche Präposition sowie die alternative Auslegung in der Fußnote. Die Stellung der Zielangaben beim Wegsenden wird zur besseren Verständlichkeit angepasst, ohne die Mehrdeutigkeit von Asasel aufzulösen.
