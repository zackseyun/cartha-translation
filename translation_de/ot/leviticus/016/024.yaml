  text: וְ/רָחַ֨ץ אֶת בְּשָׂר֤/וֹ בַ/מַּ֨יִם֙ בְּ/מָק֣וֹם קָד֔וֹשׁ וְ/לָבַ֖שׁ אֶת בְּגָדָ֑י/ו וְ/יָצָ֗א וְ/עָשָׂ֤ה אֶת עֹֽלָת/וֹ֙ וְ/אֶת עֹלַ֣ת הָ/עָ֔ם וְ/כִפֶּ֥ר בַּעֲד֖/וֹ וּ/בְעַ֥ד הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/024.yaml
  text: He shall wash his body with water in a holy place[a], put on his garments, come out, and offer his burnt offering and the burnt offering of the people[c][b], and make atonement for himself and for the people.
translation:
  language: de
  text: Er soll seinen Leib mit Wasser an einem heiligen Ort[a] waschen, seine Gewänder anziehen und hinausgehen. Dann soll er sein Brandopfer und das Brandopfer des Volkes darbringen und für sich und für das Volk Sühne erwirken[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „an einem heiligen Ort“; nicht zwingend eine Bezeichnung für den inneren Heiligtumsraum.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Sühne schaffen“; je nach rituellem Zusammenhang kann das hebräische Verb auch den Gedanken des Entsühnens oder Reinigens einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָחַץ אֶת־בְּשָׂרוֹ בַמַּיִם
  choice: Er soll seinen Leib mit Wasser … waschen
  rationale: Die Verbfolge hat in dieser Ritualanweisung vorschreibenden Sinn. „Leib“ gibt בשרו in gehobenem, aber verständlichem Deutsch körperlich wieder; „mit Wasser waschen“ entspricht natürlichem deutschen Sprachgebrauch.
- source_word: בְּמָקוֹם קָדוֹשׁ
  choice: an einem heiligen Ort
  rationale: מקום ist nicht determiniert. Daher ist ein heiliger Ort gemeint, ohne die Wendung vorschnell als technische Bezeichnung „das Heilige“ beziehungsweise „Heiligtum“ festzulegen.
- source_word: וְלָבַשׁ אֶת־בְּגָדָיו
  choice: seine Gewänder anziehen
  rationale: „Gewänder“ bewahrt den würdigen, kultischen Ton und bleibt modern verständlich.
- source_word: וְיָצָא
  choice: hinausgehen
  rationale: Das Verb bezeichnet die Bewegung aus dem heiligen Ort hinaus; „hinausgehen“ ist im Deutschen klar und idiomatisch.
- source_word: וְעָשָׂה אֶת־עֹלָתוֹ וְאֶת־עֹלַת הָעָם
  choice: sein Brandopfer und das Brandopfer des Volkes darbringen
  rationale: עשה bedeutet wörtlich „machen/tun“, wird mit Opfergaben im Deutschen jedoch sachgerecht als „darbringen“ wiedergegeben. „Brandopfer“ ist die eingebürgerte kultische Bezeichnung für עֹלָה.
- source_word: וְכִפֶּר בַּעֲדוֹ וּבְעַד הָעָם
  choice: für sich und für das Volk Sühne erwirken
  rationale: Die Formulierung wahrt die kultische Bedeutung von כפר, ohne eine bestimmte Sühnetheorie festzuschreiben. בעד wird natürlich und repräsentativ mit „für“ wiedergegeben.
theological_decisions:
- issue: Bedeutung von כפר im levitischen Opferritual
  choice: Sühne erwirken
  alternative: Sühne schaffen; entsühnen; Reinigung bewirken
  rationale: „Sühne erwirken“ ist im Deutschen verständlich und theologisch offen genug, um die versöhnende beziehungsweise entsühnende Funktion des Rituals auszudrücken. Eine ausschließlich auf Reinigung oder Tilgung eingeengte Deutung wird vermieden.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, kultischem Register. Die Satzfolge wurde durch „Dann“ gegliedert, ohne den Ablauf zu verändern. Alle Fußnotenmarker stehen unmittelbar bei der betreffenden Wendung.
