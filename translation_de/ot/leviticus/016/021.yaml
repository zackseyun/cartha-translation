  variant: modern standard German
source:
  edition: WLC
  text: וְ/סָמַ֨ךְ אַהֲרֹ֜ן אֶת שְׁתֵּ֣י יד/ו עַ֨ל רֹ֣אשׁ הַ/שָּׂעִיר֮ הַ/חַי֒ וְ/הִתְוַדָּ֣ה עָלָ֗י/ו אֶת כָּל עֲוֺנֹת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אֶת כָּל פִּשְׁעֵי/הֶ֖ם לְ/כָל חַטֹּאתָ֑/ם וְ/נָתַ֤ן אֹתָ/ם֙ עַל רֹ֣אשׁ הַ/שָּׂעִ֔יר וְ/שִׁלַּ֛ח בְּ/יַד אִ֥ישׁ עִתִּ֖י הַ/מִּדְבָּֽרָ/ה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/021.yaml
  text: And Aaron shall lay both his hands on the head of the live goat[a], and confess over it all the iniquities of the sons of Israel, and all their transgressions, all their sins, and put them on the head of the goat[b], and send it away into the wilderness by the hand of a man appointed for the task.
translation:
  language: de
  text: Aaron soll seine beiden Hände auf den Kopf des lebenden Ziegenbocks legen und über ihm alle Verfehlungen der Israeliten, alle ihre Auflehnungen, alle ihre Sünden bekennen. Er soll sie auf den Kopf des Ziegenbocks legen und ihn durch einen dafür bereitstehenden Mann[a] in die Wüste fortschicken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die seltene hebräische Bezeichnung für diesen Mann kann bedeuten, dass er für die Aufgabe bereitstand, dafür bestimmt war oder für den vorgesehenen Zeitpunkt zur Verfügung stand.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ
  choice: soll … legen
  rationale: סמך bezeichnet hier das rituelle Auflegen der Hände. „legen“ ist im Deutschen natürlich und lässt offen, wie stark dabei Druck ausgeübt wird.
- source_word: שְׁתֵּי יָדוֹ
  choice: seine beiden Hände
  rationale: Die duale Form wird im modernen Deutschen idiomatisch mit „seine beiden Hände“ wiedergegeben.
- source_word: הַשָּׂעִיר הַחַי
  choice: der lebende Ziegenbock
  rationale: שָׂעִיר bezeichnet hier ausdrücklich einen männlichen Ziegenbock; „lebend“ unterscheidet ihn von dem zuvor geschlachteten Bock.
- source_word: וְהִתְוַדָּה עָלָיו
  choice: über ihm … bekennen
  rationale: Die Formulierung bewahrt die räumlich-rituelle Bedeutung von עַל. Das Pronomen „ihm“ entspricht dem grammatischen und natürlichen Bezug auf den Ziegenbock.
- source_word: עֲוֺנֹת
  choice: Verfehlungen
  rationale: עָוֹן kann Schuld, Verkehrtheit oder schuldhafte Verfehlung bezeichnen. „Verfehlungen“ bewahrt das moralische Gewicht und bleibt von den folgenden Begriffen unterscheidbar.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die feste hebräische Kollektivbezeichnung bedeutet im Kontext das Volk Israel insgesamt. „Israeliten“ ist natürlich, präzise und schließt die gesamte Gemeinschaft ein.
- source_word: פִּשְׁעֵיהֶם
  choice: ihre Auflehnungen
  rationale: פֶּשַׁע bezeichnet nicht nur eine Übertretung, sondern häufig einen rebellischen Bruch. „Auflehnungen“ erhält diese besondere Nuance innerhalb der dreifachen Sündenbezeichnung.
- source_word: לְכָל חַטֹּאתָם
  choice: alle ihre Sünden
  rationale: Das לְ lässt sich hier als zusammenfassende bzw. spezifizierende Verknüpfung mit der vollständigen Aufzählung verstehen. Die asyndetische Wiedergabe „alle ihre Sünden“ ist im Deutschen klar und entspricht dem summierenden Sinn.
- source_word: וְנָתַן אֹתָם
  choice: Er soll sie … legen
  rationale: Das maskuline Pluralpronomen greift die zuvor bekannten Verfehlungen, Auflehnungen und Sünden auf; der neue Satz macht diesen Bezug im Deutschen deutlich.
- source_word: וְשִׁלַּח
  choice: fortschicken
  rationale: Das Verb bezeichnet das Wegsenden des Tieres und bewahrt damit das Motiv der Entfernung besser als das bloße „freilassen“.
- source_word: בְּיַד אִישׁ עִתִּי
  choice: durch einen dafür bereitstehenden Mann
  rationale: בְּיַד bezeichnet die handelnde Vermittlung. Das seltene עִתִּי kann Bereitschaft, Bestimmung oder Eignung für den vorgesehenen Zeitpunkt ausdrücken; „dafür bereitstehend“ wahrt diese Unsicherheit besser als eine eindeutige Amtsbezeichnung.
- source_word: הַמִּדְבָּרָה
  choice: in die Wüste
  rationale: Die Direktivendung bezeichnet eine Bewegung zur bzw. in die Wüste hinein.
theological_decisions:
- issue: Dreifache Sündenbezeichnung
  choice: Verfehlungen / Auflehnungen / Sünden
  alternative: Schuld / Übertretungen / Sünden
  rationale: Die drei hebräischen Begriffe werden unterschieden, ohne aus ihnen ein starres theologisches Klassifikationssystem abzuleiten. So bleibt die rhetorische Aussage umfassender Schuld erhalten.
- issue: Rituelle Übertragung auf den Ziegenbock
  choice: „Er soll sie auf den Kopf des Ziegenbocks legen“
  alternative: „Er soll damit den Kopf des Ziegenbocks beladen“
  rationale: Die konkrete Bildsprache des Textes wird bewahrt, ohne zu erklären, auf welche metaphysische Weise die bekannte Schuld übertragen wird.
- issue: Kollektivbezeichnung בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: Die Wendung bezeichnet hier die gesamte Bundesgemeinschaft. Die idiomatische deutsche Kollektivbezeichnung vermeidet den irreführenden Eindruck, nur männliche Personen seien gemeint.
- issue: Bedeutung von אִישׁ עִתִּי
  choice: ein dafür bereitstehender Mann
  alternative: ein dafür bestimmter Mann
  rationale: Das seltene Adjektiv ist semantisch unsicher. Die Übersetzung betont die situationsbezogene Bereitschaft, während die Fußnote die ebenfalls mögliche Bestimmung oder Beauftragung nennt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kultisch konkreter Bildsprache. „Ziegenbock“ präzisiert das Tier; „Auflehnungen“ erhält die rebellische Nuance von פֶּשַׁע. Der einzige Fußnotenmarker [a] steht nach der Wendung, deren lexikalische Unsicherheit erläutert wird.
