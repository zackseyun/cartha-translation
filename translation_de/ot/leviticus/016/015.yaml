  text: וְ/שָׁחַ֞ט אֶת שְׂעִ֤יר הַֽ/חַטָּאת֙ אֲשֶׁ֣ר לָ/עָ֔ם וְ/הֵבִיא֙ אֶת דָּמ֔/וֹ אֶל מִ/בֵּ֖ית לַ/פָּרֹ֑כֶת וְ/עָשָׂ֣ה אֶת דָּמ֗/וֹ כַּ/אֲשֶׁ֤ר עָשָׂה֙ לְ/דַ֣ם הַ/פָּ֔ר וְ/הִזָּ֥ה אֹת֛/וֹ עַל הַ/כַּפֹּ֖רֶת וְ/לִ/פְנֵ֥י הַ/כַּפֹּֽרֶת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/015.yaml
  text: Then he shall slaughter the goat of the sin offering that is for the people[a], and bring its blood inside the veil, and do with its blood as he did with the blood of the bull, and sprinkle it on the atonement cover and before the mercy seat.
translation:
  language: de
  text: 'Dann soll er den Bock des Sündopfers schlachten, der für das Volk bestimmt ist, und sein Blut hinter den Vorhang bringen. Mit seinem Blut soll er so verfahren, wie er mit dem Blut des Stieres verfahren ist: Er soll es auf den Sühnedeckel[a] und vor den Sühnedeckel sprengen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell auch: „Gnadenthron“. Gemeint ist die goldene Deckplatte der Bundeslade.'
    reason: Bewahrt die traditionelle deutsche Wiedergabe von כַּפֹּרֶת und erläutert den konkreten kultischen Gegenstand.
lexical_decisions:
- source_word: וְשָׁחַט
  choice: Dann soll er … schlachten
  rationale: Das Verb bezeichnet das rituelle Schlachten. „Soll“ gibt den anweisenden Charakter des Rechtstextes wieder; „Dann“ markiert die Fortsetzung der Ritualabfolge.
- source_word: שְׂעִיר הַחַטָּאת
  choice: den Bock des Sündopfers
  rationale: „Bock“ bezeichnet hier den männlichen Ziegenbock; die Genitivverbindung bildet die hebräische Constructus-Verbindung knapp und sachgerecht ab. „Sündopfer“ ist der verständliche, eingebürgerte deutsche Kultbegriff.
- source_word: אֲשֶׁר לָעָם
  choice: der für das Volk bestimmt ist
  rationale: Die Formulierung unterscheidet diesen Bock von dem zuvor für Aaron dargebrachten Stier und gibt den Zweckbezug klar wieder.
- source_word: וְהֵבִיא אֶת־דָּמוֹ
  choice: und sein Blut … bringen
  rationale: Der Hifil von בוא bedeutet hier, das Blut hineinzubringen. „Sein“ bezieht sich eindeutig auf den Bock.
- source_word: אֶל מִבֵּית לַפָּרֹכֶת
  choice: hinter den Vorhang
  rationale: Die hebräische Wendung bezeichnet den Raum auf der Innenseite des trennenden Vorhangs. „Hinter den Vorhang“ ist im Deutschen räumlich klar und natürlich.
- source_word: וְעָשָׂה אֶת־דָּמוֹ כַּאֲשֶׁר עָשָׂה לְדַם הַפָּר
  choice: Mit seinem Blut soll er so verfahren, wie er mit dem Blut des Stieres verfahren ist
  rationale: Die etwas elliptische hebräische Formulierung wird eng nachgebildet, zugleich aber in verständliches Deutsch gefasst. Der Rückbezug auf die zuvor beschriebene Blutbehandlung bleibt erhalten.
- source_word: הַפָּר
  choice: der Stier
  rationale: פַּר bezeichnet hier den bereits zuvor genannten Opferstier.
- source_word: וְהִזָּה אֹתוֹ
  choice: Er soll es … sprengen
  rationale: „Sprengen“ ist der etablierte deutsche Fachausdruck für das rituelle Ausbringen von Blut und wahrt die konkrete kultische Handlung.
- source_word: עַל הַכַּפֹּרֶת
  choice: auf die Sühneplatte
  rationale: כַּפֹּרֶת bezeichnet die goldene Deckplatte der Bundeslade und steht sprachlich mit dem hebräischen Wortfeld der Sühne in Verbindung. „Sühneplatte“ benennt sowohl den Gegenstand als auch seinen kultischen Zusammenhang.
- source_word: וְלִפְנֵי הַכַּפֹּרֶת
  choice: vor die Sühneplatte
  rationale: לִפְנֵי bezeichnet die Position vor dem Gegenstand. Die Wiederholung von „Sühneplatte“ bewahrt die räumliche Unterscheidung zwischen „auf“ und „vor“.
theological_decisions:
- issue: Wiedergabe von כַּפֹּרֶת
  choice: Sühneplatte
  alternative: Gnadenthron
  rationale: Der Ausdruck bezeichnet hier zunächst die Deckplatte der Bundeslade im Ritual des Versöhnungstages. „Sühneplatte“ ist gegenständlich verständlich und bewahrt die Verbindung zum hebräischen Sühnewortfeld, ohne eine spätere theologische Deutung zum Haupttext zu machen. Die traditionelle Wiedergabe wird in der Fußnote genannt.
- issue: Wiedergabe von חַטָּאת als Opferbezeichnung
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: Der hebräische Kultbegriff kann unter dem Gesichtspunkt von Sünde oder Reinigung beschrieben werden. „Sündopfer“ bleibt im deutschen Bibelwortschatz verständlich und etabliert; die Übersetzung legt damit nicht fest, dass nur ein einziger Aspekt des Opfers gemeint ist.
translation_notes:
  register: Moderner, würdiger Anweisungsstil mit klaren Hauptsätzen. Die kultischen Fachwörter „Sündopfer“, „sprengen“ und „Sühneplatte“ werden beibehalten, weil sie den Ritualcharakter präzise wiedergeben; die traditionelle Bezeichnung „Gnadenthron“ wird erläutert.
