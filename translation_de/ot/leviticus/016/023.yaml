source:
  edition: WLC
  text: וּ/בָ֤א אַהֲרֹן֙ אֶל אֹ֣הֶל מוֹעֵ֔ד וּ/פָשַׁט֙ אֶת בִּגְדֵ֣י הַ/בָּ֔ד אֲשֶׁ֥ר לָבַ֖שׁ בְּ/בֹא֣/וֹ אֶל הַ/קֹּ֑דֶשׁ וְ/הִנִּיחָ֖/ם שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/023.yaml
  text: Then Aaron shall come into the tent of meeting and take off the linen garments that he put on when he went into the holy place[a], and he shall leave them there.
translation:
  language: de
  text: Dann soll Aaron in das Zelt der Begegnung gehen, die Leinengewänder ausziehen, die er beim Betreten des Heiligtums[a] getragen hatte, und sie dort lassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das Heilige“; im Zusammenhang des Versöhnungstages verstehen manche damit genauer das Allerheiligste.'
    reason: Bewahrt die Mehrdeutigkeit von הַקֹּדֶשׁ und nennt die kontextuell mögliche engere Deutung, ohne sie im Haupttext festzuschreiben.
lexical_decisions:
- source_word: וּבָא
  choice: Dann soll ... gehen
  rationale: Das Waw mit der Perfektform setzt in der Ritualanweisung den Handlungsablauf fort. „Dann soll“ gibt diese Folge wieder; „gehen“ ist im Deutschen bei einer Bewegung in ein Ziel hinein natürlicher als „kommen“.
- source_word: אֹהֶל מוֹעֵד
  choice: das Zelt der Begegnung
  rationale: Die Wendung bezeichnet das Heiligtumszelt. „Zelt der Begegnung“ ist transparent, würdig und nah am hebräischen Ausdruck.
- source_word: וּפָשַׁט
  choice: ausziehen
  rationale: Das Verb bezeichnet hier das Ablegen von Kleidung. „Ausziehen“ ist im modernen Deutschen die natürliche Entsprechung.
- source_word: בִּגְדֵי הַבָּד
  choice: die leinenen Gewänder
  rationale: בֶּגֶד bezeichnet Kleidung beziehungsweise ein Gewand, und בַּד hier Leinen. Die Materialangabe ist für den Ritus bedeutsam und wird ausdrücklich erhalten.
- source_word: אֲשֶׁר לָבַשׁ
  choice: die er angezogen hatte
  rationale: Das Plusquamperfekt macht im Deutschen deutlich, dass Aaron die Gewänder vor seinem Eintritt angelegt hatte, ohne den Sinn des Verbs לָבַשׁ auf bloßes Tragen zu verengen.
- source_word: בְּבֹאוֹ
  choice: als er ... ging
  rationale: Die Präposition mit Infinitivkonstrukt beschreibt den Zeitpunkt beziehungsweise Begleitumstand. Wegen des Zieles mit אֶל ist „als er ... ging“ idiomatisch.
- source_word: הַקֹּדֶשׁ
  choice: das Heiligtum
  rationale: Der substantivierte Ausdruck „das Heilige“ kann den heiligen Bereich beziehungsweise das Heiligtum bezeichnen. „Heiligtum“ wahrt hier die räumliche Unbestimmtheit besser als das im Deutschen leicht technisch verstandene „Heilige“.
- source_word: וְהִנִּיחָם שָׁם
  choice: und sie dort lassen
  rationale: הניח kann „hinlegen“, „abstellen“ oder „zurücklassen“ bedeuten. „Dort lassen“ gibt die Anweisung natürlich wieder, ohne die Art des Ablegens näher festzulegen.
theological_decisions:
- issue: Räumlicher Bezug von הַקֹּדֶשׁ
  choice: Im Haupttext steht allgemein „das Heiligtum“.
  alternative: „das Heilige“ oder, aus dem Zusammenhang präzisiert, „das Allerheiligste“
  rationale: Der hebräische Vers verwendet nur הַקֹּדֶשׁ und nicht die ausführlichere Bezeichnung für den innersten Raum. Daher wird die mögliche Deutung als Allerheiligstes nicht in den Haupttext eingetragen, sondern in der Fußnote offengehalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem kultischem Wortschatz. Der Satz folgt dem hebräischen Handlungsablauf, vermeidet jedoch unnötig steife Syntax.
