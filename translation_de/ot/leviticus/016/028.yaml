base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/028.yaml
  text: The one who burns them shall wash his clothes and bathe his body in water[b][a], and afterward he may come into the camp.
translation:
  language: de
  text: Wer sie verbrennt, soll seine Kleider waschen und seinen Körper[a] im Wasser waschen. Danach darf er ins Lager kommen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „sein Fleisch“. In dieser Wendung ist der Körper gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Danach soll er ins Lager kommen“; auch möglich: „Danach wird er ins Lager kommen.“ Die hebräische Verbform kann als Anweisung oder einfache Zukunft verstanden werden; im Zusammenhang bezeichnet sie wahrscheinlich den nach der Reinigung erlaubten Wiedereintritt.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַשֹּׂרֵף
  choice: Wer … verbrennt
  rationale: Das substantivierte Partizip bezeichnet die Person, die die zuvor genannten Überreste verbrennt. Die deutsche Relativkonstruktion ist natürlich und bewahrt den Rollenbezug.
- source_word: אֹתָם
  choice: sie
  rationale: Das Objektpronomen verweist auf die im unmittelbaren Zusammenhang genannten Tiere beziehungsweise deren Überreste; „sie“ gibt den hebräischen Bezug knapp wieder.
- source_word: יְכַבֵּס
  choice: soll … waschen
  rationale: Das Imperfekt hat in dieser Ritualvorschrift verpflichtende Kraft. „soll“ wahrt den anweisenden Ton, ohne unnötig zu verschärfen.
- source_word: בְּגָדָיו
  choice: seine Kleider
  rationale: „Kleider“ ist eine verständliche und würdige Wiedergabe von בגד im Zusammenhang ritueller Reinigung.
- source_word: וְרָחַץ
  choice: und … baden
  rationale: Das Verb bezeichnet hier die Reinigung des Körpers. „baden“ unterscheidet sie klar vom Waschen der Kleider.
- source_word: אֶת־בְּשָׂרוֹ
  choice: seinen Körper
  rationale: Wörtlich bedeutet בשר „Fleisch“; in dieser Waschformel ist jedoch der Körper der Person gemeint. „Körper“ vermittelt den idiomatischen Sinn im heutigen Deutsch.
- source_word: בַּמָּיִם
  choice: im Wasser
  rationale: Die Präposition ב wird in Verbindung mit dem Baden natürlich lokal als „im“ wiedergegeben.
- source_word: וְאַחֲרֵי כֵן
  choice: Danach
  rationale: Die Wendung kennzeichnet die zeitliche Abfolge nach den vorgeschriebenen Reinigungshandlungen.
- source_word: יָבֹא
  choice: darf er … kommen
  rationale: Im rituellen Zusammenhang bezeichnet die Form wahrscheinlich die nach der Reinigung wieder erlaubte Rückkehr. Die mögliche einfache Zukunft beziehungsweise anweisende Lesart wird in einer Fußnote bewahrt.
- source_word: אֶל־הַמַּחֲנֶה
  choice: ins Lager
  rationale: Bei בוא mit אֶל bezeichnet „ins Lager kommen“ idiomatisch die Bewegung zurück in den Lagerbereich.
theological_decisions:
- issue: Rituelle Bedeutung des Schlusssatzes
  choice: „Danach darf er ins Lager kommen“ als erlaubter Wiedereintritt nach der Reinigung
  alternative: „Danach soll/wird er ins Lager kommen“ als Anweisung oder einfache Zukunft
  rationale: Die Abfolge von Verunreinigung, Waschung und Rückkehr legt eine Erlaubnis zum Wiedereintritt nahe. Da die hebräische Verbform diese modale Deutung nicht ausdrücklich markiert, bleibt die alternative Lesart in der Fußnote sichtbar.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Gesetzesstil. „Kleider“ und „Körper“ vermeiden unnötig altertümliche oder missverständliche Formulierungen; die Satzteilung macht die rituelle Abfolge klar.
