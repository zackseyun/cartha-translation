  text: וְ/אֵת֩ פַּ֨ר הַֽ/חַטָּ֜את וְ/אֵ֣ת שְׂעִ֣יר הַֽ/חַטָּ֗את אֲשֶׁ֨ר הוּבָ֤א אֶת דָּמָ/ם֙ לְ/כַפֵּ֣ר בַּ/קֹּ֔דֶשׁ יוֹצִ֖יא אֶל מִ/ח֣וּץ לַֽ/מַּחֲנֶ֑ה וְ/שָׂרְפ֣וּ בָ/אֵ֔שׁ אֶת עֹרֹתָ֥/ם וְ/אֶת בְּשָׂרָ֖/ם וְ/אֶת פִּרְשָֽׁ/ם׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/027.yaml
  text: And the bull for the sin offering and the goat for the sin offering, whose blood was brought in to make atonement in the sanctuary, he shall bring out to outside the camp, and they shall burn their hides, their flesh, and their dung in the fire.
translation:
  language: de
  text: Den Stier des Sündopfers und den Ziegenbock des Sündopfers, deren Blut zur Sühnung ins Heiligtum gebracht worden ist, soll er vor das Lager hinausbringen.[a] Ihre Häute, ihr Fleisch und ihren Kot sollen sie im Feuer verbrennen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „soll er hinausbringen nach außerhalb des Lagers“.'
    reason: Die Fußnote macht die im Deutschen idiomatisch geglättete doppelte Richtungsangabe des Hebräischen sichtbar.
  - marker: b
    text: Im Hebräischen wechselt die Form hier vom Singular („soll er hinausbringen“) zum Plural („sollen sie verbrennen“).
    reason: Der Numeruswechsel kann verschiedene Ausführende unterscheiden und sollte für die Leser erkennbar bleiben.
lexical_decisions:
- source_word: פַּר הַחַטָּאת / שְׂעִיר הַחַטָּאת
  choice: Stier des Sündopfers / Ziegenbock des Sündopfers
  rationale: Die etablierten deutschen Opferbezeichnungen geben die kultische Funktion knapp und verständlich wieder; „Ziegenbock“ präzisiert שָׂעִיר.
- source_word: הוּבָא אֶת־דָּמָם
  choice: deren Blut ... gebracht worden ist
  rationale: Die Passivform und der gemeinsame Bezug auf beide Opfertiere bleiben erhalten.
- source_word: לְכַפֵּר
  choice: zur Sühnung
  rationale: „Sühnung“ ist in diesem kultischen Zusammenhang eine geläufige, theologisch zurückhaltende Wiedergabe von כפר und legt den genauen Wirkungsmodus nicht enger fest.
- source_word: בַּקֹּדֶשׁ
  choice: ins Heiligtum
  rationale: Bei einem Bewegungsverb ist im Deutschen „ins Heiligtum“ natürlich; קֹדֶשׁ bezeichnet hier den heiligen Bereich.
- source_word: יוֹצִיא אֶל־מִחוּץ לַמַּחֲנֶה
  choice: vor das Lager hinausbringen
  rationale: Die idiomatische deutsche Wendung bewahrt sowohl die kausative Bedeutung von יצא als auch die gerichtete Bewegung an einen Ort außerhalb des Lagers.
- source_word: וְשָׂרְפוּ בָאֵשׁ
  choice: sollen sie im Feuer verbrennen
  rationale: Der Wechsel zum Plural wird beibehalten; „im Feuer verbrennen“ entspricht der instrumentalen beziehungsweise lokalen Formulierung des Hebräischen.
- source_word: עֹרֹתָם / בְּשָׂרָם / פִּרְשָׁם
  choice: ihre Häute / ihr Fleisch / ihren Kot
  rationale: Die Ausdrücke benennen präzise die zu verbrennenden Teile beziehungsweise Ausscheidungen der Tiere.
theological_decisions:
- issue: Wiedergabe von חַטָּאת und כפר in der Opfergesetzgebung
  choice: Sündopfer und Sühnung
  alternative: Reinigungsopfer und Reinigung vollziehen
  rationale: Die gewählte Formulierung verwendet verständliche, etablierte Kultsprache, ohne die mögliche reinigende Dimension auszuschließen oder כפר auf eine einzige dogmatische Theorie festzulegen.
- issue: Wechsel vom Singular יוֹצִיא zum Plural וְשָׂרְפוּ
  choice: „soll er ... hinausbringen“ und „sollen sie ... verbrennen“
  alternative: Beide Verben mit demselben deutschen Subjekt wiedergeben
  rationale: Der auffällige Numeruswechsel des hebräischen Textes bleibt sichtbar und kann den Handelnden beim Hinausbringen von den an der Verbrennung Beteiligten unterscheiden.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die kultischen Fachwörter „Sündopfer“, „Sühnung“ und „Heiligtum“ sind traditionsnah, aber allgemein verständlich. Die Satzteilung vermeidet einen schwerfälligen deutschen Periodensatz und bewahrt zugleich den hebräischen Numeruswechsel.
