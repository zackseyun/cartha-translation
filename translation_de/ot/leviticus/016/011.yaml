source:
  edition: WLC
  text: וְ/הִקְרִ֨יב אַהֲרֹ֜ן אֶת פַּ֤ר הַֽ/חַטָּאת֙ אֲשֶׁר ל֔/וֹ וְ/כִפֶּ֥ר בַּֽעֲד֖/וֹ וּ/בְעַ֣ד בֵּית֑/וֹ וְ/שָׁחַ֛ט אֶת פַּ֥ר הַֽ/חַטָּ֖את אֲשֶׁר לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/011.yaml
  text: Aaron shall present the bull of the sin offering that is for himself[a], and he shall make atonement for himself and for his household[b]; then he shall slaughter the bull of the sin offering that is for himself.
translation:
  language: de
  text: Aaron soll den Stier für das Sündopfer, der für ihn selbst bestimmt ist, heranbringen und für sich und sein Haus[a] Sühne erwirken. Dann soll er den Stier für das Sündopfer schlachten, der für ihn selbst bestimmt ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »für sich und für sein Haus«; mit »Haus« sind hier die Angehörigen seines Haushalts gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: soll … heranbringen
  rationale: Das Hifil von קרב bezeichnet im Opferkontext das Heranbringen bzw. Darbringen. »Heranbringen« wahrt hier die Abfolge, da die Schlachtung erst anschließend genannt wird.
- source_word: פַּר הַחַטָּאת
  choice: den Stier für das Sündopfer
  rationale: Die Konstruktion bezeichnet einen Stier, der als Sündopfer dient. Diese Formulierung ist im modernen Deutsch natürlicher als »Stier des Sündopfers«.
- source_word: אֲשֶׁר לוֹ
  choice: der für ihn selbst bestimmt ist
  rationale: Im Ritualzusammenhang bezeichnet die Wendung nicht bloß Aarons Eigentum, sondern den ihm zugeordneten und für ihn dienenden Opferstier.
- source_word: וְכִפֶּר
  choice: Sühne erwirken
  rationale: כפר wird im priesterlichen Opferkontext mit der etablierten, theologisch offenen Wendung »Sühne erwirken« wiedergegeben, ohne einen bestimmten Mechanismus der Sühne festzulegen.
- source_word: בַּעֲדוֹ וּבְעַד בֵּיתוֹ
  choice: für sich und sein Haus
  rationale: בעד bezeichnet den Begünstigten der Handlung. Die wörtliche Wiedergabe von בית als »Haus« bewahrt den Ausdruck des Hebräischen; eine Fußnote erläutert den gemeinten Haushalt.
- source_word: וְשָׁחַט
  choice: Dann soll er … schlachten
  rationale: שׁחט ist der übliche Ausdruck für rituelles Schlachten. »Dann« gibt die durch ו angezeigte Handlungsfolge idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe der priesterlichen כפר-Terminologie
  choice: Sühne erwirken
  alternative: entsühnen; Sühne schaffen
  rationale: Die Formulierung bewahrt den kultischen Sühnebegriff, ohne die Aussage auf Reinigung oder auf eine bestimmte spätere Sühnetheorie zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung der Bezeichnung des Stiers bleibt entsprechend dem ritualsprachlichen Nachdruck des Hebräischen erhalten.
