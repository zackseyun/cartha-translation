  source_fidelity: 'Die Übersetzung gibt die Abfolge der hebräischen Verben treffend wieder: Aaron bringt den ihm zugeordneten Sündopferstier heran, erwirkt Sühne für sich und sein Haus und schlachtet anschließend denselben Stier. Die Wiederholung von פַּר הַחַטָּאת אֲשֶׁר לוֹ bleibt erhalten. »Sühne erwirken« ist für וְכִפֶּר im priesterlich-kultischen Kontext sachgerecht und legt keinen engeren theologischen Mechanismus fest.'
  naturalness: Der Text ist verständliches, würdevolles modernes Standarddeutsch. »Heranbringen« wahrt sinnvoll die Unterscheidung zwischen dem Heranführen des Tieres und seiner späteren Schlachtung. Die Formulierung »sein Haus« ist im Haupttext bewusst quellennahe; die Fußnote erläutert den hier gemeinten Haushalt idiomatisch ausreichend.
  terminology: »Stier für das Sündopfer«, »Sühne erwirken« und »schlachten« sind terminologisch konsistent, registergerecht und dem Opferkontext angemessen. »Der für ihn selbst bestimmt ist« gibt die kontextuelle Zuordnung von אֲשֶׁר לוֹ angemessen wieder, ohne sie auf bloßen Besitz zu reduzieren.
