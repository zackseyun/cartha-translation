source:
  edition: WLC
  text: וְ/נָתַ֧ן אַהֲרֹ֛ן עַל שְׁנֵ֥י הַ/שְּׂעִירִ֖ם גּוֹרָל֑וֹת גּוֹרָ֤ל אֶחָד֙ לַ/יהוָ֔ה וְ/גוֹרָ֥ל אֶחָ֖ד לַ/עֲזָאזֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/008.yaml
  text: 'And Aaron shall cast lots over the two goats: one lot for Yahweh and one lot for Azazel[a].'
translation:
  language: de
  text: 'Und Aaron soll über die beiden Ziegenböcke Lose werfen: ein Los für den HERRN und ein Los für Asasel[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Los für den Sündenbock“. Die Bedeutung des hebräischen Ausdrucks „Asasel“ ist umstritten; er kann als Eigenname, als Bezeichnung für die Funktion des Bocks oder als ein mit Entfernung zusammenhängender Ausdruck verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָתַן
  choice: soll … Lose werfen
  rationale: Das Verb bedeutet wörtlich „geben/legen“. In Verbindung mit גּוֹרָלוֹת und עַל bezeichnet es hier idiomatisch die Zuteilung durch Los; „Lose werfen“ ist im Deutschen natürlich und bewahrt die rituelle Handlung.
- source_word: עַל
  choice: über
  rationale: Die Präposition bedeutet „auf/über“. „Über die beiden Ziegenböcke Lose werfen“ erhält das konkrete Bild des hebräischen Ausdrucks.
- source_word: שְׁנֵי הַשְּׂעִירִם
  choice: die beiden Ziegenböcke
  rationale: שָׂעִיר bezeichnet hier männliche Ziegen; „Ziegenböcke“ gibt diese Spezifizierung präzise und verständlich wieder.
- source_word: גּוֹרָלוֹת
  choice: Lose
  rationale: Die übliche deutsche Bezeichnung für die beim Losverfahren verwendeten Gegenstände beziehungsweise die dadurch ermittelten Zuweisungen.
- source_word: גּוֹרָל אֶחָד
  choice: ein Los
  rationale: Die wiederholte Singularform wird direkt und in natürlichem Deutsch wiedergegeben.
- source_word: לַיהוָה
  choice: für den HERRN
  rationale: Die Präposition לְ kennzeichnet die Zuweisung; der Gottesname wird gemäß der vorgegebenen Übersetzungskonvention mit „der HERR“ wiedergegeben.
- source_word: לַעֲזָאזֵל
  choice: für Asasel
  rationale: Die Bedeutung von עֲזָאזֵל ist umstritten. Die Transliteration als Eigenname bewahrt die Mehrdeutigkeit, statt sie im Haupttext als „Sündenbock“ oder „vollständige Entfernung“ festzulegen.
theological_decisions:
- issue: Bedeutung von עֲזָאזֵל im Ritual des Versöhnungstags
  choice: Asasel als unübersetzter, transkribierter Name im Haupttext
  alternative: der Sündenbock; vollständige Entfernung; eine mit der Wüste verbundene personale oder dämonische Gestalt
  rationale: Der Vers entscheidet nicht eindeutig, ob der Ausdruck die Funktion des Bocks, sein Ziel oder ein personales Wesen bezeichnet. Die Transkription bewahrt diese theologische und lexikalische Spannung; die traditionsreiche Deutung „Sündenbock“ wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt dem knappen rituellen Stil des Hebräischen; „Ziegenböcke“ ist präziser als das allgemeinere „Ziegen“, und die umstrittene Bezeichnung „Asasel“ bleibt bewusst offen.
