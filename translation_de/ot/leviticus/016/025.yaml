  source_fidelity: 'Die Übersetzung gibt alle Elemente des Hebräischen angemessen wieder: וְ verbindet mit dem vorigen Handlungsablauf; „das Fett“ entspricht חֵלֶב; „des Sündopfers“ gibt die genitivische Verbindung zu הַחַטָּאת wieder; „soll er … in Rauch aufgehen lassen“ trifft den kultisch-technischen Hifil von קטר; „auf dem Altar“ ist im Kontext eine idiomatische und sachgemäße Wiedergabe der Richtungsform הַמִּזְבֵּחָה.'
