source:
  edition: WLC
  text: וְ/אֵ֛ת חֵ֥לֶב הַֽ/חַטָּ֖את יַקְטִ֥יר הַ/מִּזְבֵּֽחָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/025.yaml
  text: And he shall burn the fat of the sin offering on the altar[a].
translation:
  language: de
  text: Und das Fett des Sündopfers[a] soll er auf dem Altar in Rauch aufgehen lassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Reinigungsopfers“. Der hebräische Ausdruck kann das Opfer bezeichnen, das der Reinigung von Sünde oder Unreinheit dient.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: Und das
  rationale: וְ verbindet die Handlung mit dem vorausgehenden Ritualablauf; die Objektmarkierung אֵת wird im Deutschen nicht eigens wiedergegeben.
- source_word: חֵלֶב
  choice: das Fett
  rationale: חֵלֶב bezeichnet hier das zum Opfer bestimmte Fett. „Das Fett“ gibt den Ausdruck direkt wieder, ohne die im Vers nicht ausdrücklich genannten einzelnen Fettstücke hinzuzufügen.
- source_word: הַחַטָּאת
  choice: des Sündopfers
  rationale: חַטָּאת bezeichnet im Opferkontext gewöhnlich das Sündopfer. Die funktional orientierte Wiedergabe „Reinigungsopfer“ bleibt als echte lexikalische Alternative in der Fußnote erhalten.
- source_word: יַקְטִיר
  choice: soll er … in Rauch aufgehen lassen
  rationale: Der Hifil von קטר bezeichnet im Opferkontext das Verbrennen auf dem Altar mit dem Gedanken des aufsteigenden Rauchs. Diese Wiedergabe ist präziser als das allgemeinere „verbrennen“ und bleibt in modernem Deutsch verständlich.
- source_word: הַמִּזְבֵּחָה
  choice: auf dem Altar
  rationale: Die Richtungsendung kann formal „zum Altar hin“ anzeigen; im Zusammenhang bezeichnet die natürliche deutsche Fassung den Ort, an dem das Fett verbrannt wird.
theological_decisions:
- issue: Wiedergabe von חַטָּאת in der Opfergesetzgebung
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: Der hebräische Ausdruck kann sowohl Sünde als auch die kultische Reinigung von Sünde oder Unreinheit in den Blick nehmen. „Sündopfer“ ist die geläufige und verständliche Hauptwiedergabe; „Reinigungsopfer“ wird als bedeutsame funktionale Alternative nicht verschwiegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kultische Fachsprache bleibt klar erkennbar; „in Rauch aufgehen lassen“ bildet den spezifischen Opfergebrauch des Verbs ab.
