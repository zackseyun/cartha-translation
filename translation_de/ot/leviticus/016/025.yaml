  terminology: „Sündopfer“ ist im deutschen Bibel- und Fachgebrauch die etablierte Wiedergabe von חַטָּאת. Die Fußnote bewahrt mit „Reinigungsopfer“ die wichtige funktionale Alternative, ohne die Hauptübersetzung unnötig zu überladen. „Altar“ und die kultische Formel sind konsistent und registergerecht.
