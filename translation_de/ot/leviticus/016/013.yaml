  text: וְ/נָתַ֧ן אֶֽת הַ/קְּטֹ֛רֶת עַל הָ/אֵ֖שׁ לִ/פְנֵ֣י יְהוָ֑ה וְ/כִסָּ֣ה עֲנַ֣ן הַ/קְּטֹ֗רֶת אֶת הַ/כַּפֹּ֛רֶת אֲשֶׁ֥ר עַל הָ/עֵד֖וּת וְ/לֹ֥א יָמֽוּת־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/013.yaml
  text: And he shall put the incense on the fire before Yahweh[a], so that the cloud of the incense may cover the mercy seat that is over the testimony, so that he may not die.
translation:
  language: de
  text: Dann soll er das Räucherwerk auf das Feuer vor Jahwe legen, damit die Rauchwolke des Räucherwerks die Sühneplatte bedeckt, die über dem Zeugnis liegt, damit er nicht stirbt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתַן
  choice: Dann soll er … legen
  rationale: Die Verbform führt im Zusammenhang die rituelle Anweisung fort. „Soll … legen“ gibt den verpflichtenden Charakter in natürlichem modernem Deutsch wieder; „dann“ markiert den Ablauf.
- source_word: הַקְּטֹרֶת
  choice: das Räucherwerk
  rationale: Der Ausdruck bezeichnet das im Heiligtumsritual verwendete Räuchermittel. „Räucherwerk“ ist im Deutschen präzise und verständlich.
- source_word: עַל הָאֵשׁ
  choice: auf das Feuer
  rationale: Die Präposition bezeichnet das Auflegen des Räucherwerks auf das Feuer beziehungsweise die glühenden Kohlen, ohne diese näher erklärend in den Text einzutragen.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: Die Wendung bezeichnet die kultische Gegenwart Jahwes. „Vor“ bewahrt die knappe räumlich-kultische Ausdrucksweise des Hebräischen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt. „Jahwe“ ist die im Deutschen übliche wissenschaftlich begründete Form.
- source_word: וְכִסָּה
  choice: sodass … bedeckt
  rationale: Im Zusammenhang beschreibt der Satz die beabsichtigte beziehungsweise schützende Folge des Auflegens. „Sodass“ lässt die enge Zweck-Folge-Beziehung erkennen, ohne sie unnötig auszudeuten.
- source_word: עֲנַן הַקְּטֹרֶת
  choice: die Rauchwolke des Räucherwerks
  rationale: „Rauchwolke“ macht in natürlichem Deutsch deutlich, welche Wolke durch das Räucherwerk entsteht, und bewahrt zugleich das Wolkenbild des Ausgangstextes.
- source_word: הַכַּפֹּרֶת
  choice: die Sühneplatte
  rationale: Das Wort bezeichnet die Deckplatte der Bundeslade in ihrer besonderen Funktion im Sühneritual. „Sühneplatte“ ist transparent und vermeidet die mögliche Fehlvorstellung eines Sitzmöbels.
- source_word: אֲשֶׁר עַל הָעֵדוּת
  choice: die über dem Zeugnis liegt
  rationale: „Zeugnis“ bewahrt die kultisch-bundestheologische Bezeichnung עֵדוּת. Das Verb „liegt“ ist im Deutschen zur Beschreibung der räumlichen Lage natürlich, ohne den Gegenstand ausdrücklich als Tafeln auszulegen.
- source_word: וְלֹא יָמוּת
  choice: und er nicht stirbt
  rationale: Die Wendung bezeichnet die lebensbewahrende Folge der vorgeschriebenen Handlung. In Verbindung mit „sodass“ ist die Formulierung knapp, klar und nicht archaisch.
theological_decisions:
- issue: Wiedergabe von הַכַּפֹּרֶת im Zusammenhang des Sühnerituals
  choice: Sühneplatte
  alternative: Gnadenthron
  rationale: „Sühneplatte“ bezeichnet sowohl den konkreten Teil der Bundeslade als auch dessen rituelle Funktion. Das traditionelle „Gnadenthron“ ist theologisch geprägt und kann einen eigentlichen Thron vermuten lassen; es wird deshalb als Übersetzungsalternative in der Fußnote genannt.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Übersetzung bewahrt den im Hebräischen stehenden persönlichen Gottesnamen. Die traditionelle Ersetzung durch „der HERR“ ist möglich, würde hier jedoch einen Namen durch einen Titel ersetzen.
- issue: Verhältnis der letzten Satzglieder
  choice: Zweck- beziehungsweise Folgebeziehung mit „sodass“
  alternative: rein fortlaufende Wiedergabe mit „und“
  rationale: Der rituelle Zusammenhang legt nahe, dass die Wolke die Sühneplatte zum Schutz des Priesters bedeckt. „Sodass“ gibt diese Beziehung wieder, ohne abschließend zwischen Zweck und Folge zu entscheiden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer ritueller Satzführung. Kultische Schlüsselbegriffe wie „Zeugnis“ und „Sühneplatte“ bleiben erhalten; unnötig altertümliche Formen werden vermieden.
