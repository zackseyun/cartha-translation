source:
  edition: WLC
  text: כְּתֹֽנֶת בַּ֨ד קֹ֜דֶשׁ יִלְבָּ֗שׁ וּ/מִֽכְנְסֵי בַד֮ יִהְי֣וּ עַל בְּשָׂר/וֹ֒ וּ/בְ/אַבְנֵ֥ט בַּד֙ יַחְגֹּ֔ר וּ/בְ/מִצְנֶ֥פֶת בַּ֖ד יִצְנֹ֑ף בִּגְדֵי קֹ֣דֶשׁ הֵ֔ם וְ/רָחַ֥ץ בַּ/מַּ֛יִם אֶת בְּשָׂר֖/וֹ וּ/לְבֵשָֽׁ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/004.yaml
  text: He shall put on the holy linen tunic[a], and the linen undergarments shall be on his body; he shall tie the linen sash around himself and wrap the linen turban around himself. These are holy garments[b]. He shall wash his body with water then put them on.
translation:
  language: de
  text: Er soll das heilige Leinengewand[a] anziehen und die leinenen Untergewänder am Leib tragen. Er soll sich den leinenen Gürtel umbinden und sich den leinenen Turban um den Kopf wickeln. Das sind heilige Gewänder. Er soll seinen Körper[b] mit Wasser waschen und sie dann anziehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: das geweihte Leinengewand.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich steht hier jeweils „Fleisch“: „auf seinem Fleisch“ und „sein Fleisch mit Wasser waschen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּתֹנֶת בַּד קֹדֶשׁ
  choice: das heilige Leinengewand
  rationale: כְּתֹנֶת bezeichnet ein am Körper getragenes Gewand; „Leinengewand“ ist im Deutschen verständlich und würdevoll. קֹדֶשׁ kennzeichnet es als für den Heiligtumsdienst ausgesondert.
- source_word: מִכְנְסֵי בַד
  choice: leinene Untergewänder
  rationale: Gemeint ist die den Unterkörper bedeckende priesterliche Unterbekleidung. „Untergewänder“ vermeidet sowohl das altertümliche „Beinkleider“ als auch die alltagssprachliche Wirkung von „Unterhose“.
- source_word: עַל בְּשָׂרוֹ
  choice: unmittelbar auf dem Leib
  rationale: Die Wendung bezeichnet Kleidung, die direkt am Körper getragen wird. „Leib“ bewahrt die Körperlichkeit des Ausdrucks, während „unmittelbar“ seine praktische Bedeutung verdeutlicht.
- source_word: אַבְנֵט בַּד
  choice: leinener Gürtel
  rationale: אַבְנֵט ist ein umgebundener Stoffgürtel der priesterlichen Kleidung. „Gürtel“ ist die geläufige und konkrete deutsche Entsprechung.
- source_word: מִצְנֶפֶת בַּד
  choice: leinener Turban
  rationale: מִצְנֶפֶת bezeichnet die gewundene priesterliche Kopfbedeckung; „Turban“ gibt ihre Form präzise wieder.
- source_word: יִצְנֹף
  choice: um den Kopf wickeln
  rationale: Das Verb bezeichnet das Winden oder Wickeln der Kopfbedeckung. Die ausdrückliche Nennung des Kopfes macht die deutsche Formulierung natürlich und eindeutig.
- source_word: בִּגְדֵי קֹדֶשׁ
  choice: Heilige Gewänder
  rationale: Die Wendung bezeichnet für den Heiligtumsdienst ausgesonderte Kleidung; „heilig“ wahrt den zentralen kultischen Begriff קֹדֶשׁ.
- source_word: וְרָחַץ בַּמַּיִם אֶת־בְּשָׂרוֹ
  choice: Er soll seinen Körper mit Wasser waschen
  rationale: Wörtlich steht „sein Fleisch mit Wasser waschen“. Im Deutschen bezeichnet „seinen Körper waschen“ die konkrete rituelle Waschung klar, ohne spätere theologische Nebenbedeutungen von „Fleisch“ einzutragen.
- source_word: וּלְבֵשָׁם
  choice: und sie dann anziehen
  rationale: Das Suffix bezieht sich auf die heiligen Gewänder. „Dann“ gibt die im Zusammenhang erkennbare Abfolge von Waschung und Ankleiden wieder.
theological_decisions:
- issue: Bedeutung der Heiligkeit der Gewänder
  choice: „heilig“ als kultische Aussonderung für den Dienst am Heiligtum
  alternative: „geweiht“ oder „sakral“
  rationale: Der Text selbst nennt die Gewänder קֹדֶשׁ, ohne ihre Symbolik weiter auszulegen. „Heilig“ bewahrt diese Aussage und fügt keine spätere Deutung hinzu.
- issue: Wiedergabe von בָּשָׂר im rituellen Zusammenhang
  choice: im Haupttext „Leib“ beziehungsweise „Körper“
  alternative: „Fleisch“
  rationale: Die körperliche Bedeutung bleibt erhalten, doch missverständliche theologische Assoziationen des deutschen Wortes „Fleisch“ werden vermieden. Eine Fußnote dokumentiert den wörtlichen Ausdruck.
- issue: Abfolge von Waschung und Ankleiden
  choice: „und sie dann anziehen“
  alternative: 'nur koordinierend: „und sie anziehen“'
  rationale: Das hebräische וּלְבֵשָׁם kann formal koordinierend gelesen werden; im Anweisungszusammenhang liegt jedoch eine zeitliche Abfolge nahe. „Dann“ macht diese natürliche Abfolge deutlich, ohne eine zusätzliche rituelle Lehre einzuführen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Anweisungsstil. Kultische Schlüsselbegriffe wie „heilig“ bleiben erhalten; altertümliche oder unnötig fachsprachliche Kleidungsbezeichnungen werden vermieden.
