  text: וְ/כִלָּה֙ מִ/כַּפֵּ֣ר אֶת הַ/קֹּ֔דֶשׁ וְ/אֶת אֹ֥הֶל מוֹעֵ֖ד וְ/אֶת הַ/מִּזְבֵּ֑חַ וְ/הִקְרִ֖יב אֶת הַ/שָּׂעִ֥יר הֶ/חָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/020.yaml
  text: When he has finished making atonement for the sanctuary[a], the tent of meeting, and the altar[c][b], he shall present the live goat.
translation:
  language: de
  text: Wenn er die Entsühnung des Heiligtums[a], des Zeltes der Begegnung und des Altars abgeschlossen hat[b], soll er den lebenden Ziegenbock herbeibringen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des Heiligen“ beziehungsweise „der heiligen Stätte“.'
    reason: lexical_alternative
  - marker: b
    text: „Entsühnung“ kann hier auch als Durchführung ritueller Reinigung verstanden werden.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „nahebringen“; gemeint ist das Heranführen für die nächste rituelle Handlung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִלָּה מִכַּפֵּר
  choice: Wenn er die Entsühnung … vollendet hat
  rationale: Die Verbindung bezeichnet den Abschluss des zuvor beschriebenen כפר-Ritus. Der deutsche Temporalsatz gibt die Abfolge natürlich wieder; „Entsühnung“ bewahrt den kultischen Fachcharakter, ohne den Vorgang auf bloße Reinigung zu verengen.
- source_word: הַקֹּדֶשׁ
  choice: das Heiligtum
  rationale: Im Zusammenhang des Versöhnungstags bezeichnet der Ausdruck den heiligen Bereich; „Heiligtum“ ist im Deutschen präzise und verständlich.
- source_word: אֹהֶל מוֹעֵד
  choice: das Zelt der Begegnung
  rationale: Die Wendung bildet die hebräischen Bestandteile transparent und in geläufigem biblischem Deutsch ab.
- source_word: הַמִּזְבֵּחַ
  choice: der Altar
  rationale: Direkte und natürliche Entsprechung des kultischen Begriffs.
- source_word: וְהִקְרִיב
  choice: soll er … herbeibringen
  rationale: Das Hifil von קרב bedeutet wörtlich „nahebringen“ und kann kultisch „darbringen“ heißen. Hier wird der lebende Bock für die nächste Handlung herangeführt; „herbeibringen“ wahrt diese Offenheit besser als „opfern“.
- source_word: הַשָּׂעִיר הֶחָי
  choice: den lebenden Ziegenbock
  rationale: חי unterscheidet diesen Bock ausdrücklich von dem bereits geschlachteten. „Lebender Ziegenbock“ gibt Tierart und Kontrast klar wieder.
theological_decisions:
- issue: Bedeutung von כפר bei heiligen Räumen und dem Altar
  choice: Entsühnung
  alternative: Sühne erwirken; rituell reinigen
  rationale: כפר umfasst hier eine kultische Handlung an Heiligtum, Zelt und Altar. „Entsühnung“ lässt sowohl Sühne als auch die in diesem Kontext erkennbare Reinigung beziehungsweise Beseitigung kultischer Verunreinigung anklingen, ohne eine bestimmte Sühnetheorie festzulegen.
- issue: Funktion von הקריב beim lebenden Bock
  choice: herbeibringen
  alternative: darbringen; nahebringen
  rationale: Da der Bock lebend für den folgenden Ritus vorgestellt wird, darf הקריב nicht vorschnell als Schlachtopfer verstanden werden. Die Übersetzung erhält den rituellen Vorgang und seine Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kultische Schlüsselbegriffe werden präzise, aber ohne konfessionelle Festlegung wiedergegeben. Die Satzstellung hält die zeitliche Abfolge des Hebräischen klar fest.
