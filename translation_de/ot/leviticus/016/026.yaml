  text: וְ/הַֽ/מְשַׁלֵּ֤חַ אֶת הַ/שָּׂעִיר֙ לַֽ/עֲזָאזֵ֔ל יְכַבֵּ֣ס בְּגָדָ֔י/ו וְ/רָחַ֥ץ אֶת בְּשָׂר֖/וֹ בַּ/מָּ֑יִם וְ/אַחֲרֵי כֵ֖ן יָב֥וֹא אֶל הַֽ/מַּחֲנֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/026.yaml
  text: The one who sends the goat away to Azazel shall wash his clothes and bathe his body in water[a], and afterward he may come into the camp.
translation:
  language: de
  text: Wer den Ziegenbock zu Asasel[a] fortschickt, soll seine Kleider waschen und seinen Körper mit Wasser waschen. Danach darf er ins Lager kommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »für Asasel«. Die Bedeutung der hebräischen Bezeichnung ist umstritten. Sie kann als Name oder Benennung verstanden oder funktional auf das Wegschaffen beziehungsweise den sogenannten »Sündenbock« bezogen werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַמְשַׁלֵּחַ
  choice: Wer … fortschickt
  rationale: Das substantivierte Partizip bezeichnet die mit dem Fortschicken beauftragte Person. Die deutsche Relativkonstruktion ist natürlich und bewahrt den rollenbezogenen Sinn.
- source_word: הַשָּׂעִיר
  choice: den Ziegenbock
  rationale: Das Wort bezeichnet hier im Opferzusammenhang einen männlichen Ziegenbock. Die genauere Wiedergabe ist im Deutschen idiomatisch.
- source_word: לַעֲזָאזֵל
  choice: zu Asasel
  rationale: Die umstrittene hebräische Bezeichnung wird als Name beziehungsweise Benennung transkribiert. „Zu“ gibt die Richtung des Fortschickens wieder, ohne die Bedeutung von Asasel festzulegen.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: soll seine Kleider waschen
  rationale: Dies ist die geläufige und klare deutsche Wiedergabe der rituellen Waschvorschrift.
- source_word: וְרָחַץ אֶת־בְּשָׂרוֹ בַּמָּיִם
  choice: und seinen Körper im Wasser baden
  rationale: „Körper“ gibt בשר in diesem Reinheitszusammenhang natürlich wieder; „im Wasser“ bewahrt die Formulierung des Hebräischen.
- source_word: וְאַחֲרֵי כֵן
  choice: Danach
  rationale: Die knappe Zeitangabe stellt die vorgeschriebene Reihenfolge klar und idiomatisch dar.
- source_word: יָבֹא אֶל־הַמַּחֲנֶה
  choice: darf er ins Lager kommen
  rationale: Der Imperfekt beschreibt hier die nach der Waschung erlaubte Rückkehr, nicht einen zusätzlichen Befehl.
theological_decisions:
- issue: Bedeutung von לַעֲזָאזֵל im Ritual des Versöhnungstags
  choice: 'Als nicht erklärte Bezeichnung transkribieren: „zu Asasel“'
  alternative: „zur Beseitigung“, „für Asasel“ oder eine Deutung als Wüsten- beziehungsweise dämonisches Wesen
  rationale: Die Bedeutung des Ausdrucks ist sprachlich und religionsgeschichtlich umstritten. Die Transkription bewahrt diese Offenheit und trägt keine bestimmte theologische Deutung in den Haupttext ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Sprache für eine rituell-rechtliche Vorschrift. „Asasel“ bewahrt die Auslegungsoffenheit; „darf“ verdeutlicht, dass die Rückkehr erst nach der Reinigung gestattet ist.
