review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Satzstruktur und den rituellen Ablauf zutreffend wieder: die beauftragte Person, der Ziegenbock, Asasel als bewusst nicht gedeutete Bezeichnung, die Reinigung und die anschließende Rückkehr ins Lager. „Darf“ ist für den hier erlaubenden bzw. regelnden Imperfektgebrauch angemessen. „Zu Asasel“ wahrt die strittige Bedeutung besser als eine funktionale Deutung.'
  naturalness: 'Modernes Standarddeutsch ist weitgehend erreicht. „seinen Körper im Wasser baden“ ist jedoch semantisch und kollokativ weniger präzise: Man badet üblicherweise sich selbst, während der hebräische Ausdruck eine Waschung des Körpers/Fleisches bezeichnet. „seinen Körper mit Wasser waschen“ ist natürlich und näher am Ausgangstext.'
  terminology: „Ziegenbock“, „Kleider“, „Lager“ und „Asasel“ sind passend. Die Fußnote bewahrt die Auslegungsvielfalt. Für die rituelle Waschung ist „mit Wasser waschen“ gegenüber „im Wasser baden“ vorzuziehen, ohne eine theologische Deutung einzutragen.
