- from: Wer den Ziegenbock zu Asasel[a] fortschickt, soll seine Kleider waschen und seinen Körper im Wasser baden. Danach darf er ins Lager kommen.
  to: Wer den Ziegenbock zu Asasel[a] fortschickt, soll seine Kleider waschen und seinen Körper mit Wasser waschen. Danach darf er ins Lager kommen.
  rationale: Die einzige sichere Verbesserung betrifft die deutsche Wiedergabe der rituellen Körperwaschung. „Mit Wasser waschen“ entspricht dem hebräischen Waschverb mit der Präpositionalangabe und ist im modernen Deutschen natürlicher als „im Wasser baden“. Alle übrigen Entscheidungen können unverändert bleiben.
