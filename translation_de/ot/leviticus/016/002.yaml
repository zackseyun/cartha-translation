source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה דַּבֵּר֮ אֶל אַהֲרֹ֣ן אָחִי/ךָ֒ וְ/אַל יָבֹ֤א בְ/כָל עֵת֙ אֶל הַ/קֹּ֔דֶשׁ מִ/בֵּ֖ית לַ/פָּרֹ֑כֶת אֶל פְּנֵ֨י הַ/כַּפֹּ֜רֶת אֲשֶׁ֤ר עַל הָ/אָרֹן֙ וְ/לֹ֣א יָמ֔וּת כִּ֚י בֶּֽ/עָנָ֔ן אֵרָאֶ֖ה עַל הַ/כַּפֹּֽרֶת־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/002.yaml
  text: And Yahweh said to Moses[a], “Tell Aaron your brother that he must not come at just any time into the Holy Place, inside the veil, before the atonement cover that is on the ark, so that he may not die. For I will appear in the cloud over the atonement cover.”
translation:
  language: de
  text: 'Und Jahwe sagte zu Mose: »Sag deinem Bruder Aaron, dass er nicht zu jeder beliebigen Zeit in das Heiligtum hinter den Vorhang treten darf, vor den Sühndeckel[a], der auf der Lade liegt, damit er nicht stirbt. Denn ich erscheine in einer Wolke über dem Sühndeckel.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionell auch »Gnadenthron« genannt.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Umschrift des Gottesnamens bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- source_word: דַּבֵּר
  choice: Sag
  rationale: Der Imperativ fordert Mose auf, Aaron die folgende Weisung mitzuteilen; »Sag« ist natürliches, gegenwärtiges Deutsch.
- source_word: אַהֲרֹן אָחִיךָ
  choice: deinem Bruder Aaron
  rationale: Diese Wortstellung ist im Deutschen idiomatisch und gibt sowohl das Verwandtschaftsverhältnis als auch den Namen ausdrücklich wieder.
- source_word: וְאַל יָבֹא
  choice: dass er … nicht … treten darf
  rationale: Der verneinte Jussiv drückt ein klares Verbot aus. Die deutsche Formulierung bindet dieses natürlich an den einleitenden Redeauftrag an.
- source_word: בְּכָל עֵת
  choice: zu jeder beliebigen Zeit
  rationale: Gemeint ist nicht fortwährendes Eintreten, sondern ein Betreten ohne die vorgeschriebene zeitliche Beschränkung.
- source_word: הַקֹּדֶשׁ
  choice: das Heiligtum
  rationale: Der Ausdruck bezeichnet hier den heiligen inneren Bereich. »Heiligtum« bleibt nah am Hebräischen, ohne die spezifischere Bezeichnung »Allerheiligstes« in den Wortlaut einzutragen.
- source_word: מִבֵּית לַפָּרֹכֶת
  choice: innerhalb des Vorhangs
  rationale: Die Formulierung bezeichnet den Raum auf der Innenseite des trennenden Vorhangs und folgt der räumlichen Perspektive des hebräischen Ausdrucks.
- source_word: הַכַּפֹּרֶת
  choice: Sühndeckel
  rationale: Das deutsche Kompositum bezeichnet sowohl den konkreten Deckel der Lade als auch seine Bedeutung im Sühneritus. Die traditionelle Alternative wird in einer Fußnote genannt.
- source_word: הָאָרֹן
  choice: die Lade
  rationale: Der hebräische Text sagt lediglich »die Lade«; die Ergänzung »des Bundes« wird daher nicht in den Haupttext aufgenommen.
- source_word: וְלֹא יָמוּת
  choice: damit er nicht stirbt
  rationale: Die Wendung gibt die tödliche Folge wieder, die durch die Befolgung des Verbots vermieden werden soll.
- source_word: כִּי בֶעָנָן אֵרָאֶה
  choice: Denn in der Wolke werde ich … erscheinen
  rationale: כִּי begründet das Verbot; das passive Erscheinungsverb und der Zukunftsbezug werden im Deutschen klar wiedergegeben.
theological_decisions:
- issue: Wiedergabe von כַּפֹּרֶת im kultischen Zusammenhang
  choice: Sühndeckel
  alternative: Gnadenthron
  rationale: »Sühndeckel« hält den konkreten Gegenstand und seine Funktion im Sühneritus zusammen. »Gnadenthron« ist traditionsreich, kann jedoch den Eindruck eines ausdrücklich als Thron bezeichneten Gegenstands erwecken, was der hebräische Wortlaut nicht unmittelbar sagt.
- issue: Bedeutung von בְּכָל עֵת
  choice: Verbot eines zeitlich uneingeschränkten Zutritts
  alternative: zu allen Zeiten
  rationale: Der Zusammenhang regelt den Zutritt zum inneren Heiligtum zu einer vorgeschriebenen Gelegenheit. »Zu jeder beliebigen Zeit« macht deutlich, dass eigenmächtiger Zutritt untersagt ist, ohne zusätzliche Einzelheiten vorwegzunehmen.
- issue: Benennung des inneren heiligen Bereichs
  choice: das Heiligtum innerhalb des Vorhangs
  alternative: das Allerheiligste
  rationale: Der Text verwendet הַקֹּדֶשׁ. Die gewählte Fassung lässt die räumliche Präzisierung durch »innerhalb des Vorhangs« wirken und vermeidet, eine stärker spezifizierte traditionelle Benennung direkt in das Substantiv einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt klar und verbindlich; kultische Begriffe werden verständlich wiedergegeben, ohne die sachliche und theologische Dichte des hebräischen Textes zu glätten.
