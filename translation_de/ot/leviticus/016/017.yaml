  terminology: „Zelt der Begegnung“, „Heiligtum“, „Sühne“ und „Versammlung Israels“ sind konsistent, sachgerecht und im kultischen Register angemessen. „Sein Haus“ bewahrt die Offenheit von בֵּיתוֹ für Haushalt bzw. Familie.
