source:
  edition: WLC
  text: וְ/כָל אָדָ֞ם לֹא יִהְיֶ֣ה בְּ/אֹ֣הֶל מוֹעֵ֗ד בְּ/בֹא֛/וֹ לְ/כַפֵּ֥ר בַּ/קֹּ֖דֶשׁ עַד צֵאת֑/וֹ וְ/כִפֶּ֤ר בַּעֲד/וֹ֙ וּ/בְעַ֣ד בֵּית֔/וֹ וּ/בְעַ֖ד כָּל קְהַ֥ל יִשְׂרָאֵֽל־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/017.yaml
  text: And no man shall be in the tent of meeting when he enters to make atonement in the holy place, until he comes out. And he shall make atonement for himself, and for his household, and for all the assembly of Israel.
translation:
  language: de
  text: Kein Mensch darf im Zelt der Begegnung sein, wenn er hineingeht, um im Heiligtum Sühne zu erwirken, bis er herauskommt. Und er soll für sich selbst, für sein Haus und für die ganze Versammlung Israels Sühne erwirken.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָל־אָדָם
  choice: kein Mensch
  rationale: In der verneinten Konstruktion bedeutet der Ausdruck umfassend „kein Mensch“. Die Wiedergabe ist geschlechtsübergreifend und entspricht dem Verbot für alle anderen Personen.
- source_word: אֹהֶל מוֹעֵד
  choice: Zelt der Begegnung
  rationale: Gibt die kultische Bezeichnung verständlich und nah am hebräischen Ausdruck wieder.
- source_word: לְכַפֵּר / וְכִפֶּר
  choice: Sühne zu erwirken / Sühne erwirken
  rationale: Bewahrt den kultisch-theologischen Sinn von כפר, ohne ihn auf bloßes Vergeben oder Reinigen zu verengen.
- source_word: בַּקֹּדֶשׁ
  choice: im Heiligtum
  rationale: Der substantivierte Ausdruck bezeichnet hier den heiligen Bereich, in dem die Sühnehandlung vollzogen wird; „Heiligtum“ lässt den genauen räumlichen Umfang offen.
- source_word: בֵּיתוֹ
  choice: sein Haus
  rationale: Die knappe, formnahe Wiedergabe kann sowohl den Haushalt als auch die Familie einschließen.
- source_word: קְהַל יִשְׂרָאֵל
  choice: Versammlung Israels
  rationale: Entspricht dem kollektiven und kultischen Charakter von קהל, ohne vorschnell „Gemeinde“ im späteren kirchlichen Sinn zu verwenden.
theological_decisions:
- issue: Bedeutungsumfang von כפר
  choice: Sühne erwirken
  alternative: Versöhnung schaffen / entsühnen
  rationale: „Sühne erwirken“ wahrt den Opfer- und Reinigungszusammenhang des Kapitels sowie die theologische Spannung des Verbs, ohne eine einzelne Sühnetheorie festzuschreiben.
- issue: Bezug von בַּקֹּדֶשׁ
  choice: im Heiligtum
  alternative: im Allerheiligsten / am heiligen Ort
  rationale: Der hebräische Ausdruck sagt hier wörtlich „im Heiligen/Heiligtum“. Die Übersetzung vermeidet eine unbegründete Präzisierung auf das Allerheiligste allein.
- issue: Abfolge des abschließenden Verbs
  choice: So soll er ... Sühne erwirken
  alternative: Und er wird ... Sühne erwirkt haben
  rationale: Das Verb fasst Zweck und Vollzug seines Hineingehens zusammen. Die deutsche Soll-Form passt zur gesetzlichen Anweisung, ohne zwingend eine streng vorzeitige Lesart festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit kultischer Fachsprache. Der Satzbau bleibt eng an der hebräischen Abfolge, wird aber durch „wieder“ und „So“ im Deutschen natürlich verbunden.
