  text: כִּֽי בַ/יּ֥וֹם הַ/זֶּ֛ה יְכַפֵּ֥ר עֲלֵי/כֶ֖ם לְ/טַהֵ֣ר אֶתְ/כֶ֑ם מִ/כֹּל֙ חַטֹּ֣אתֵי/כֶ֔ם לִ/פְנֵ֥י יְהוָ֖ה תִּטְהָֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/030.yaml
  text: For on this day atonement shall be made for you to cleanse you[b][a]; from all your sins before Yahweh you shall be clean.
translation:
  language: de
  text: Denn an diesem Tag wird für euch Sühne erwirkt[a], um euch zu reinigen. Von all euren Sünden werdet ihr vor Jahwe[b] rein sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird er für euch Sühne erwirken“. Das hebräische Verb steht im Singular; das Subjekt wird in diesem Satz nicht ausdrücklich genannt.'
    reason: lexical_alternative
  - marker: b
    text: Hebräisch JHWH; traditionell mit „der HERR“ wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Anordnung ein und gibt den erklärenden Zusammenhang natürlich wieder.
- source_word: בַיּוֹם הַזֶּה
  choice: an diesem Tag
  rationale: Bewahrt die zeitliche Bestimmung und den hebräischen Demonstrativbezug im Zusammenhang des Versöhnungstages.
- source_word: יְכַפֵּר עֲלֵיכֶם
  choice: wird für euch Sühne vollzogen
  rationale: כפר ist hier der kultische Ausdruck für das Vollziehen von Sühne. Die Passivform vermeidet es, das im hebräischen Satz nicht ausdrücklich genannte Subjekt festzulegen; עֲלֵיכֶם bezeichnet die Personen, für die die Sühne vollzogen wird.
- source_word: לְטַהֵר אֶתְכֶם
  choice: um euch zu reinigen
  rationale: Der Infinitiv bezeichnet Zweck beziehungsweise Ergebnis der Sühne. „Reinigen“ ist verständlich und wahrt zugleich den kultischen Sinn.
- source_word: מִכֹּל חַטֹּאתֵיכֶם
  choice: von all euren Sünden
  rationale: חטאת kann auch ein Sündopfer bezeichnen, meint hier jedoch angesichts der Reinigung des Volkes dessen Sünden.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי bezeichnet das Sein vor beziehungsweise in der Gegenwart Gottes; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: תִּטְהָרוּ
  choice: werdet ihr rein sein
  rationale: Die Form beschreibt hier am ehesten den aus der Reinigung hervorgehenden Zustand. Die Wiedergabe unterscheidet diesen Zustand von der zuvor genannten Handlung des Reinigens.
theological_decisions:
- issue: Nicht ausdrücklich genanntes Subjekt von יְכַפֵּר
  choice: unpersönliche Passivform im Haupttext
  alternative: „er wird für euch Sühne vollziehen“
  rationale: Das hebräische Verb steht zwar im maskulinen Singular, doch sein Subjekt wird in diesem Satz nicht ausdrücklich genannt. Die Passivform bewahrt diese Offenheit; die wörtlichere Möglichkeit wird in einer Fußnote genannt.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird im Haupttext als „Jahwe“ wiedergegeben; die traditionelle deutsche Wiedergabe wird in der Fußnote dokumentiert, ohne beide Formen im Text zu vermischen.
- issue: Kultischer Ausdruck כפר
  choice: Sühne vollziehen
  alternative: entsühnen
  rationale: Die Übersetzung hält an der kultischen Aussage fest, ohne eine bestimmte spätere Theorie der Sühne in den Vers hineinzutragen.
- issue: Verhältnis von Reinigung und Reinsein
  choice: Handlung und resultierender Zustand werden unterschieden
  alternative: beide Formen mit „reinigen/gereinigt werden“ wiedergeben
  rationale: Das Piel לְטַהֵר bezeichnet das Reinigen, während das Qal תִּטְהָרוּ den daraus hervorgehenden Zustand des Reinseins ausdrückt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sühne“ und „rein“ bewahren den kultischen Wortgebrauch, bleiben aber für heutige Leser verständlich. Der Satzbau folgt dem Gedankenfortschritt des Hebräischen, ohne dessen Wortstellung künstlich nachzuahmen.
