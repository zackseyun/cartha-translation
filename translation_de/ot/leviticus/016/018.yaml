id: LEV.16.18
reference: Leviticus 16:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/יָצָ֗א אֶל הַ/מִּזְבֵּ֛חַ אֲשֶׁ֥ר לִ/פְנֵֽי יְהוָ֖ה וְ/כִפֶּ֣ר עָלָ֑י/ו וְ/לָקַ֞ח מִ/דַּ֤ם הַ/פָּר֙ וּ/מִ/דַּ֣ם הַ/שָּׂעִ֔יר וְ/נָתַ֛ן עַל קַרְנ֥וֹת הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/018.yaml
  text: Then he shall go out to the altar that is before Yahweh and make atonement for it[a], and he shall take some of the bull's blood and some of the goat's blood and put it on the horns of the altar all around.
translation:
  language: de
  text: Dann soll er zu dem Altar hinausgehen, der vor Jahwe steht, und für ihn Sühne erwirken[a]. Er soll etwas von dem Blut des Stiers und von dem Blut des Ziegenbocks nehmen und es ringsum an die Hörner des Altars streichen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihn entsühnen“; das hebräische Verb kann bei priesterlichen Ritualen auch die Reinigung von kultischer Verunreinigung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: Dann soll er … hinausgehen
  rationale: Die Verbfolge setzt die vorgeschriebenen Ritualhandlungen fort. „Dann soll er“ gibt den Ablauf natürlich wieder; „hinausgehen“ bewahrt die räumliche Bewegung aus dem inneren Heiligtumsbereich.
- source_word: הַמִּזְבֵּחַ אֲשֶׁר לִפְנֵי יְהוָה
  choice: der Altar, der vor Jahwe steht
  rationale: לִפְנֵי bezeichnet hier die Lage des Altars vor beziehungsweise in der Gegenwart Jahwes. „Vor Jahwe steht“ ist im Deutschen natürlich und räumlich klar.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְכִפֶּר עָלָיו
  choice: und für ihn Sühne erwirken
  rationale: כפר bezeichnet im priesterlichen Ritual die sühnende und zugleich reinigende Handlung am Altar. „Sühne erwirken“ erhält die kultisch-theologische Tragweite; das maskuline Pronomen bezieht sich im Deutschen natürlich auf den Altar.
- source_word: וְלָקַח מִדַּם הַפָּר וּמִדַּם הַשָּׂעִיר
  choice: etwas von dem Blut des Stiers und von dem Blut des Ziegenbocks nehmen
  rationale: 'Das wiederholte מִן ist partitiv: Von beiden Blutmengen wird etwas genommen. שָׂעִיר wird präzise als männliches Tier mit „Ziegenbock“ wiedergegeben.'
- source_word: וְנָתַן עַל קַרְנוֹת הַמִּזְבֵּחַ סָבִיב
  choice: es ringsum an die Hörner des Altars streichen
  rationale: נתן bedeutet grundsätzlich „geben/bringen/legen“; im konkreten Blutritus ist „streichen“ im Deutschen anschaulich und idiomatisch. „Es“ folgt dem singularischen Bezug des Hebräischen, während סָבִיב als „ringsum“ wiedergegeben wird.
theological_decisions:
- issue: Bedeutung von כפר bei einer Ritualhandlung am Altar
  choice: für ihn Sühne erwirken
  alternative: ihn entsühnen / ihn reinigen
  rationale: Die Hauptfassung bewahrt den etablierten Sühnebegriff, ohne eine bestimmte Sühnetheorie einzutragen. Da כפר in priesterlichen Texten auch eine reinigende beziehungsweise entsühnende Dimension hat, wird diese echte Bedeutungsnuance in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer ritualsprachlicher Abfolge. „Sühne erwirken“ wahrt den theologischen Gehalt; die Fußnote erhält die kultische Reinigungsnuance. Der Gottesname wird als „Jahwe“ wiedergegeben.
