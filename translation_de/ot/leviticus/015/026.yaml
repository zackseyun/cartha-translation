source:
  edition: WLC
  text: כָּל הַ/מִּשְׁכָּ֞ב אֲשֶׁר תִּשְׁכַּ֤ב עָלָי/ו֙ כָּל יְמֵ֣י זוֹבָ֔/הּ כְּ/מִשְׁכַּ֥ב נִדָּתָ֖/הּ יִֽהְיֶה לָּ֑/הּ וְ/כָֽל הַ/כְּלִי֙ אֲשֶׁ֣ר תֵּשֵׁ֣ב עָלָ֔י/ו טָמֵ֣א יִהְיֶ֔ה כְּ/טֻמְאַ֖ת נִדָּתָֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/026.yaml
  text: Every bed on which she lies during all the days of her discharge shall be to her like the bed of her menstruation[a], and every vessel on which she sits shall be unclean[b], like the uncleanness of her menstruation.
translation:
  language: de
  text: Jedes Bett, auf dem sie während aller Tage ihres Ausflusses liegt, soll für sie wie das Bett bei ihrer Monatsblutung[a] sein. Und jeder Gegenstand, auf dem sie sitzt, wird unrein sein[b], entsprechend der Unreinheit bei ihrer Monatsblutung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wie das Bett bei ihrer menstruellen Unreinheit«. Das hebräische Wort kann die Monatsblutung und den damit verbundenen Zustand kultischer Absonderung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: »Gegenstand« gibt hier einen weit gefassten hebräischen Begriff für einen Gebrauchsartikel oder ein Gerät wieder, auf dem sie sitzt; gemeint ist nicht nur ein Gefäß.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁכָּב
  choice: Bett
  rationale: Das Wort bezeichnet hier die Liegestätte; »Bett« ist im Deutschen natürlich und passt zum Reinheitsgesetz.
- source_word: כָּל יְמֵי זוֹבָהּ
  choice: während der ganzen Zeit ihres Ausflusses
  rationale: זוֹב bezeichnet in diesem Abschnitt einen körperlichen, hier anhaltenden Ausfluss. Die zeitliche Wendung gibt כָּל יְמֵי idiomatisch wieder.
- source_word: נִדָּה
  choice: Monatsblutung
  rationale: Im Kontext bezeichnet das Wort den menstruellen Zustand einschließlich seiner kultischen Folgen. »Monatsblutung« benennt den körperlichen Bezug klar, ohne ihn im Haupttext vollständig mit Unreinheit gleichzusetzen.
- source_word: כְּלִי
  choice: Gegenstand
  rationale: כְּלִי ist ein weiter Begriff für Gerät, Artikel oder Gegenstand. Da man darauf sitzt, wäre »Gefäß« im modernen Deutschen irreführend eng.
- source_word: טָמֵא / טֻמְאָה
  choice: unrein / Unreinheit
  rationale: Diese Wortwahl wahrt die sichtbare lexikalische Verbindung und bezeichnet im Kontext einen kultischen Status, nicht persönliche moralische Schuld.
- source_word: יִהְיֶה לָּהּ
  choice: soll für sie … sein
  rationale: Die Formulierung bewahrt die hebräische Statuszuweisung und bleibt verständliches deutsches Gesetzesdeutsch.
theological_decisions:
- issue: Art der Unreinheit
  choice: »unrein/Unreinheit« als kultischen Status wiedergeben
  alternative: »unrein« moralisch verstehen oder mit »sündig« wiedergeben
  rationale: Der Vers regelt den kultischen Reinheitsstatus von Liege- und Sitzgegenständen; er spricht nicht von persönlicher Schuld.
- issue: Bedeutungsumfang von נִדָּה
  choice: Im Haupttext konkret »Monatsblutung«, mit einer Fußnote zum mitgemeinten kultischen Absonderungszustand
  alternative: »menstruelle Unreinheit« unmittelbar in den Haupttext aufnehmen
  rationale: Die konkrete körperliche Referenz ist im Kontext eindeutig, doch das hebräische Wort kann zugleich den damit verbundenen Zustand kultischer Absonderung bezeichnen. Die Fußnote bewahrt diese Spannung, ohne den Haupttext interpretativ zu überladen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlicher Terminologie für die Reinheitsgesetzgebung. »Ausfluss« und »Monatsblutung« sind sachlich und direkt; »unrein« bleibt als etablierter kultischer Fachbegriff erhalten. Die Satzstruktur folgt dem hebräischen Parallelismus, ohne unnatürlich steif zu wirken.
