  text: וּ/בַ/יּ֣וֹם הַ/שְּׁמִינִ֗י תִּֽקַּֽח לָ/הּ֙ שְׁתֵּ֣י תֹרִ֔ים א֥וֹ שְׁנֵ֖י בְּנֵ֣י יוֹנָ֑ה וְ/הֵבִיאָ֤ה אוֹתָ/ם֙ אֶל הַ/כֹּהֵ֔ן אֶל פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/029.yaml
  text: And on the eighth day she shall take for herself two turtledoves or two young pigeons[a], and bring them to the priest at the entrance of the tent of meeting.
translation:
  language: de
  text: Am achten Tag soll sie für sich zwei Turteltauben oder zwei junge Tauben nehmen und sie zum Priester an den Eingang des Zeltes der Begegnung bringen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁמִינִי
  choice: Am achten Tag
  rationale: Die Zeitangabe wird im Deutschen natürlich wiedergegeben; das einleitende ו markiert den Fortgang der Vorschrift und muss nicht eigens mit „und“ übersetzt werden.
- source_word: תִּקַּח לָהּ
  choice: soll sie für sich … nehmen
  rationale: Der Imperfekt hat im Gesetzeskontext anweisenden Charakter. Das benefaktive לָהּ wird mit „für sich“ bewahrt.
- source_word: שְׁתֵּי תֹרִים
  choice: zwei Turteltauben
  rationale: Sachlich genaue und im deutschen biblischen Opferwortschatz geläufige Bezeichnung.
- source_word: שְׁנֵי בְּנֵי יוֹנָה
  choice: zwei junge Tauben
  rationale: Die hebräische Konstruktverbindung bezeichnet junge Tauben; eine wörtliche Wiedergabe als „Söhne von Tauben“ wäre im Deutschen irreführend.
- source_word: וְהֵבִיאָה אֹתָם
  choice: und sie … bringen
  rationale: Die Verbform setzt die rechtliche Anweisung fort. Im Deutschen kann sie mit dem Modalverb „soll“ des ersten Prädikats koordiniert werden.
- source_word: אֶל הַכֹּהֵן אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: zum Priester an den Eingang des Zeltes der Begegnung
  rationale: Beide Vorkommen von אֶל werden richtungsbezogen wiedergegeben. So bleibt deutlich, dass das Ziel der Priester am Eingang des Zeltes ist.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die hebräische Rechtsformulierung. „Zelt der Begegnung“ gibt אֹהֶל מוֹעֵד transparent und verständlich wieder.
