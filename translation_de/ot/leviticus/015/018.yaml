source:
  edition: WLC
  text: וְ/אִשָּׁ֕ה אֲשֶׁ֨ר יִשְׁכַּ֥ב אִ֛ישׁ אֹתָ֖/הּ שִׁכְבַת זָ֑רַע וְ/רָחֲצ֣וּ בַ/מַּ֔יִם וְ/טָמְא֖וּ עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/018.yaml
  text: If a man lies with a woman and has an emission of semen[b][a], both of them shall wash in water and be unclean until the evening.
translation:
  language: de
  text: Wenn ein Mann mit einer Frau schläft und es zum Samenerguss kommt, sollen sich beide mit Wasser waschen und bis zum Abend unrein sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist rituelle Unreinheit; der Vers spricht nicht von moralischer Schuld.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִשָּׁה אֲשֶׁר יִשְׁכַּב אִישׁ אֹתָהּ
  choice: Wenn ein Mann mit einer Frau schläft
  rationale: Die hebräische Relativkonstruktion hat im gesetzlichen Zusammenhang kasuistische Kraft. Die deutsche Wenn-Konstruktion gibt dies natürlich wieder; „mit einer Frau schlafen“ bewahrt das hebräische Idiom und ist im modernen Standarddeutsch eindeutig.
- source_word: שִׁכְבַת זָרַע
  choice: und es zum Samenerguss kommt
  rationale: Die Wendung bezeichnet hier spezifisch den Austritt von Samen. „Samenerguss“ ist präzise und natürlich; die unpersönliche Form vermeidet die zusätzliche Festlegung, wer grammatisch als Handelnder des Ergusses erscheint.
- source_word: וְרָחֲצוּ בַמַּיִם
  choice: sollen sich beide mit Wasser waschen
  rationale: Der Plural bezieht beide Beteiligten ein. „Beide“ macht den Bezug im Deutschen deutlich; „mit Wasser waschen“ gibt die Waschung wieder, ohne ihre genaue Form näher zu bestimmen.
- source_word: וְטָמְאוּ עַד הָעָרֶב
  choice: und bis zum Abend unrein sein
  rationale: „Unrein“ wahrt den zentralen levitischen Begriff, ohne moralische Schuld einzutragen. „Bis zum Abend“ entspricht der zeitlichen Grenze des hebräischen Textes.
theological_decisions:
- issue: Art der Unreinheit
  choice: Im Haupttext schlicht „unrein“; eine Fußnote erläutert den kultisch-rituellen Sinn.
  alternative: „rituell unrein“ unmittelbar im Haupttext
  rationale: Der hebräische Text verwendet טמא ohne ausdrückliches Adverb. Die knappe Wiedergabe bewahrt den Wortlaut, während die Fußnote verhindert, dass die vorübergehende rituelle Unreinheit als moralische Schuld missverstanden wird.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Der gesetzliche Ton wird durch „sollen“ gewahrt; unnötig technische oder altertümliche Formulierungen werden vermieden.
