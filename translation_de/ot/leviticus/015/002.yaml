  text: דַּבְּרוּ֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/אֲמַרְתֶּ֖ם אֲלֵ/הֶ֑ם אִ֣ישׁ אִ֗ישׁ כִּ֤י יִהְיֶה֙ זָ֣ב מִ/בְּשָׂר֔/וֹ זוֹב֖/וֹ טָמֵ֥א הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/002.yaml
  text: 'Speak to the sons of Israel and say to them: When any man has a discharge from his body[b][a], his discharge is unclean.'
translation:
  language: de
  text: 'Sprecht zu den Söhnen Israels[a] und sagt ihnen: Wenn ein Mann einen Ausfluss aus seinem Körper[b] hat, ist sein Ausfluss unrein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu den Israeliten“; wörtlich: „zu den Söhnen Israels“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „aus seinem Fleisch“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבְּרוּ
  choice: Redet
  rationale: Der Imperativ Plural eröffnet die göttliche Weisung an Mose und Aaron; „Redet“ bewahrt den formellen Anweisungsstil.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die formnahe Wiedergabe erhält die hebräische Wendung; die geläufige Alternative „die Israeliten“ steht in der Fußnote.
- source_word: וַאֲמַרְתֶּם אֲלֵהֶם
  choice: und sagt zu ihnen
  rationale: Gibt die fortlaufende Befehlsformel natürlich und zugleich eng am Hebräischen wieder.
- source_word: אִישׁ אִישׁ
  choice: irgendein Mann
  rationale: Die Wiederholung hat distributiven Sinn und bezieht sich im Kontext ausdrücklich auf einen Mann.
- source_word: זָב
  choice: einen Ausfluss … hat
  rationale: „Ausfluss“ ist im modernen Deutschen die verständliche medizinisch-rechtliche Bezeichnung für den hier beschriebenen Körperfluss.
- source_word: מִבְּשָׂרוֹ
  choice: aus seinem Körper
  rationale: „Körper“ vermittelt die kontextuelle Bedeutung von בשר verständlich; die wörtlichere Wiedergabe „Fleisch“ wird als Alternative angegeben.
- source_word: זוֹבוֹ
  choice: sein Ausfluss
  rationale: Die Wiederholung von „Ausfluss“ wahrt den Zusammenhang mit dem stammverwandten זָב und die juristische Genauigkeit.
- source_word: טָמֵא הוּא
  choice: ist … unrein
  rationale: Die Formulierung bezieht das Prädikat grammatisch auf „sein Ausfluss“ und bewahrt den kultisch-rechtlichen Begriff „unrein“.
theological_decisions:
- issue: Wiedergabe der kultischen Unreinheit
  choice: unrein
  alternative: rituell unrein
  rationale: טָמֵא bezeichnet hier kultische Unreinheit, nicht notwendig moralische Schuld. „Unrein“ ist der etablierte Begriff; der Kontext macht die rituelle Bedeutung deutlich, ohne eine erklärende Ergänzung in den Text einzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit formnaher Wiedergabe der Anweisungsformel und klarer medizinisch-rechtlicher Terminologie.
