  text: וְ/זֹ֛את תִּהְיֶ֥ה טֻמְאָת֖/וֹ בְּ/זוֹב֑/וֹ רָ֣ר בְּשָׂר֞/וֹ אֶת זוֹב֗/וֹ אֽוֹ הֶחְתִּ֤ים בְּשָׂר/וֹ֙ מִ/זּוֹב֔/וֹ טֻמְאָת֖/וֹ הִֽוא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/003.yaml
  text: 'And this shall be his uncleanness in his discharge: whether his body runs with his discharge[a], or his body is stopped up from his discharge, it is his uncleanness.'
translation:
  language: de
  text: 'Und dies soll seine Unreinheit bei seinem Ausfluss sein: Ob sein Körper seinen Ausfluss absondert[a] oder seinen Ausfluss zurückhält – das ist seine Unreinheit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ob sein Fleisch seinen Ausfluss fließen lässt oder sein Fleisch von seinem Ausfluss verschlossen ist“. Die hebräische Beschreibung des zweiten Zustands ist medizinisch nicht eindeutig; sie bezeichnet offenbar das Ausbleiben oder Zurückhalten des Ausflusses. „Fleisch“ meint hier den betroffenen Körperbereich bzw. körperlichen Zustand.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טֻמְאָתוֹ
  choice: seine Unreinheit
  rationale: Das Substantiv bezeichnet im Kontext der levitischen Reinheitsbestimmungen kultische beziehungsweise rituelle Unreinheit, nicht moralische Schuld.
- source_word: זוֹב
  choice: Ausfluss
  rationale: Der Ausdruck bezeichnet hier einen krankhaften körperlichen, wahrscheinlich genitalen Ausfluss. „Ausfluss“ ist im Deutschen klar, sachlich und medizinisch verständlich.
- source_word: רָר
  choice: fließen lässt
  rationale: Das Verb beschreibt das Austreten beziehungsweise Fließen des Ausflusses und wahrt den aktiven Gegensatz zum nachfolgenden Verstopftsein.
- source_word: בְּשָׂרוֹ
  choice: sein Körper
  rationale: Wörtlich steht „sein Fleisch“; hier ist jedoch der betroffene Körperbereich beziehungsweise das körperliche Geschehen gemeint. „Körper“ ist im Deutschen natürlich und vermeidet sachfremde theologische Assoziationen.
- source_word: הֶחְתִּים
  choice: verstopft ist
  rationale: Die Form bezeichnet ein Verschlossensein oder eine Blockierung, sodass der Ausfluss nicht frei austritt. „Verstopft ist“ erhält den Gegensatz zum Fließen.
- source_word: מִזּוֹבוֹ
  choice: vom Ausfluss
  rationale: Die Präposition wird nah an ihrer Trennungs- beziehungsweise Ursprungsbedeutung wiedergegeben und lässt die schwierige medizinische Beschreibung des Hebräischen stehen.
- source_word: וְזֹאת תִּהְיֶה
  choice: Und dies ist
  rationale: Die einleitende Rechtsformel wird in natürlichem modernem Deutsch präsentisch formuliert; das Waw bleibt durch „Und“ sichtbar.
- source_word: אוֹ
  choice: ob … oder
  rationale: Die Konjunktion verbindet zwei alternative Erscheinungsformen, für die dieselbe Feststellung der Unreinheit gilt.
theological_decisions:
- issue: Art der Unreinheit
  choice: „Unreinheit“ als rituell-rechtliche Kategorie
  alternative: moralische Schuld oder Sündhaftigkeit
  rationale: Der unmittelbare Kontext behandelt kultische Reinheitsbestimmungen; der Vers setzt den körperlichen Zustand nicht mit persönlicher moralischer Schuld gleich.
translation_notes:
  register: Moderne, sachliche und würdige Rechtssprache. Die medizinisch schwierige Gegenüberstellung von fließendem und blockiertem Ausfluss bleibt erhalten, ohne den betroffenen Körperteil genauer festzulegen, als es der hebräische Text tut.
