  rationale: Die einzige sichere Änderung ersetzt die unidiomatische Körperformulierung durch „sich in lebendigem Wasser waschen“. Dadurch wird die Ganzkörperwaschung natürliches modernes Deutsch und bleibt dem hebräischen רחץ בשרו במים חיים eng verbunden. Textliche Ambiguitäten und die rituelle, nicht moralische Bedeutung von Reinheit bleiben gewahrt.
