source:
  edition: WLC
  text: וְ/כִֽי יִטְהַ֤ר הַ/זָּב֙ מִ/זּוֹב֔/וֹ וְ/סָ֨פַר ל֜/וֹ שִׁבְעַ֥ת יָמִ֛ים לְ/טָהֳרָת֖/וֹ וְ/כִבֶּ֣ס בְּגָדָ֑י/ו וְ/רָחַ֧ץ בְּשָׂר֛/וֹ בְּ/מַ֥יִם חַיִּ֖ים וְ/טָהֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/013.yaml
  text: And when the man with the discharge is cleansed from his discharge[a], then he shall count seven days for his cleansing, and wash his clothes and bathe his body in living water; then he shall be clean.
translation:
  language: de
  text: Wenn der Mann mit dem Ausfluss von seinem Ausfluss rein geworden ist, soll er für seine Reinigung sieben Tage zählen, seine Kleider waschen und sich in lebendigem Wasser[a] waschen; dann ist er rein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „lebendigem Wasser“; gemeint ist frisches oder fließendes Wasser.
    reason: Erläuterung des hebräischen Ausdrucks מַיִם חַיִּים und seiner sachlichen Bedeutung im Reinheitsgesetz.
lexical_decisions:
- source_word: הַזָּב
  choice: der Mann mit dem Ausfluss
  rationale: Das substantivierte Partizip bezeichnet hier den männlichen Betroffenen mit dem in diesem Kapitel beschriebenen krankhaften Körperausfluss. Die Formulierung ist klar, sachlich und wahrt den männlichen Bezug des Kontexts.
- source_word: יִטְהַר מִזּוֹבוֹ
  choice: von seinem Ausfluss rein geworden ist
  rationale: טהר bezeichnet im Zusammenhang den Übergang zur rituellen Reinheit; מן bezeichnet, wovon der Betroffene rein geworden ist. Die Wiedergabe bewahrt diese kultische Kategorie, ohne moralische Schuld anzudeuten.
- source_word: וְסָפַר לוֹ שִׁבְעַת יָמִים
  choice: soll er … sieben Tage zählen
  rationale: Die fortführende Verbform hat in der Verfahrensanweisung gebietenden Charakter. „Soll“ ist im modernen deutschen Gesetzes- und Anweisungsstil natürlich.
- source_word: לְטָהֳרָתוֹ
  choice: für seine Reinigung
  rationale: Die Wendung bezeichnet die rituelle Reinigung beziehungsweise den Weg zur vollen Reinheit. Die offene Formulierung vermeidet eine unnötige Präzisierung des zeitlichen Verhältnisses.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: seine Kleider waschen
  rationale: כבס bezeichnet hier ausdrücklich das Waschen von Kleidung; die deutsche Formulierung ist präzise und geläufig.
- source_word: וְרָחַץ בְּשָׂרוֹ
  choice: seinen Körper … baden
  rationale: בשר bedeutet wörtlich „Fleisch“, bezeichnet hier aber den ganzen Körper. „Körper baden“ gibt die Ganzkörperwaschung natürlich wieder und unterscheidet sie vom Waschen der Kleider.
- source_word: בְּמַיִם חַיִּים
  choice: in lebendigem Wasser
  rationale: Die wörtliche Wendung lautet „lebendiges Wasser“ und bezeichnet frisches, natürlich zufließendes oder fließendes Wasser. Der bildhafte hebräische Ausdruck bleibt im Text erhalten und wird in der Fußnote erklärt.
- source_word: וְטָהֵר
  choice: dann ist er rein
  rationale: Die Schlussformel bezeichnet das Ergebnis der vorgeschriebenen Reinigungsschritte. „Dann“ verdeutlicht die Abfolge, ohne einen zusätzlichen Gedanken einzutragen.
theological_decisions:
- issue: Rituelle Reinheit gegenüber moralischer Schuld
  choice: „rein“, „Reinigung“
  alternative: „entsündigt“, „von Schuld gereinigt“
  rationale: Der Abschnitt behandelt kultische Unreinheit infolge eines Körperausflusses. Die Übersetzung verwendet Reinheitssprache, ohne eine vom Vers nicht ausgesagte moralische Schuld oder Sündenvergebung einzutragen.
- issue: Bedeutung von „lebendigem Wasser“
  choice: Bildhafte Ausgangsform im Text mit sachlicher Erklärung in der Fußnote
  alternative: „Quellwasser“ oder „fließendes Wasser“ unmittelbar im Text
  rationale: Der hebräische Ausdruck kann frisches oder fließendes Wasser bezeichnen und ist nicht zwingend auf nur eine konkrete Wasserquelle beschränkt. Die wörtlich-nahe Form wahrt diese Bedeutungsbreite.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlicher ritueller Fachsprache. Der lange hebräische Verfahrenssatz bleibt als zusammenhängende Abfolge erhalten; das Semikolon hebt das abschließende Ergebnis hervor.
