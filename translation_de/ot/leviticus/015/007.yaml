  text: וְ/הַ/נֹּגֵ֖עַ בִּ/בְשַׂ֣ר הַ/זָּ֑ב יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/007.yaml
  text: Whoever touches the flesh of the man with the discharge shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: de
  text: Wer den Leib des Mannes berührt, der einen Ausfluss hat, muss seine Kleidung waschen und im Wasser baden; er wird bis zum Abend unrein sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das Fleisch dessen, der den Ausfluss hat“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנֹּגֵעַ
  choice: Wer … berührt
  rationale: Das substantivierte Partizip bezeichnet allgemein jeden, der die Handlung ausführt. Die deutsche Relativkonstruktion gibt den generischen Rechtsfall natürlich wieder.
- source_word: בִּבְשַׂר
  choice: den Leib
  rationale: בָּשָׂר bedeutet wörtlich „Fleisch“, kann hier aber konkret den Körper beziehungsweise Leib bezeichnen. „Leib“ ist im Deutschen würdig und vermeidet die mögliche Fehlvorstellung, nur entblößtes Fleisch sei gemeint; die wörtlichere Wiedergabe wird in der Fußnote genannt.
- source_word: הַזָּב
  choice: des Mannes …, der den Ausfluss hat
  rationale: Das maskuline Partizip bezeichnet im Zusammenhang einen Mann mit krankhaftem Körperausfluss. „Ausfluss“ wahrt die knappe Begrifflichkeit des Reinheitsgesetzes.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: muss seine Kleidung waschen
  rationale: כִּבֵּס bezeichnet das Waschen von Textilien. „Muss“ bringt die verbindliche Vorschrift in natürlichem modernem Deutsch zum Ausdruck.
- source_word: וְרָחַץ בַּמַּיִם
  choice: und sich mit Wasser waschen
  rationale: רָחַץ bezeichnet hier die Reinigung des Körpers. Die reflexive Form ist im Deutschen idiomatisch; „mit Wasser“ entspricht der instrumentalen beziehungsweise medialen Präposition.
- source_word: וְטָמֵא
  choice: er ist … unrein
  rationale: טָמֵא bezeichnet hier kultische oder rituelle Unreinheit, nicht moralische Schuld. Der eigenständige Hauptsatz bildet die Folge der Berührung klar ab.
- source_word: עַד הָעָרֶב
  choice: bis zum Abend
  rationale: Die Formulierung bezeichnet die zeitliche Dauer der Unreinheit und gibt den bestimmten Artikel idiomatisch wieder.
theological_decisions:
- issue: Art der Unreinheit
  choice: „unrein“ als Status innerhalb der levitischen Reinheitsordnung
  alternative: „verunreinigt“ oder „unrein geworden“ mit möglichem Anklang an moralische Schuld
  rationale: Der Zusammenhang behandelt rituelle Unreinheit infolge von Körperausfluss und Berührung. Die Übersetzung vermeidet es, die Berührung als moralisches Vergehen darzustellen.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Gesetzesdeutsch. „Muss“ ist heute natürlicher als ein rechtssprachlich altertümliches „soll“. Die männliche Referenz des hebräischen Singulars bleibt ausdrücklich erhalten.
