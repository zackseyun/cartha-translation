  variant: modern standard German
source:
  edition: WLC
  text: וְ/כֹל֩ אֲשֶׁ֨ר תִּשְׁכַּ֥ב עָלָ֛י/ו בְּ/נִדָּתָ֖/הּ יִטְמָ֑א וְ/כֹ֛ל אֲשֶׁר תֵּשֵׁ֥ב עָלָ֖י/ו יִטְמָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/020.yaml
  text: And everything on which she lies during her menstrual impurity shall be unclean[a], and everything on which she sits shall be unclean.
translation:
  language: de
  text: Alles, worauf sie während ihrer menstruationsbedingten Unreinheit liegt, wird unrein sein[a]; und alles, worauf sie sitzt, wird unrein sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »während ihrer Menstruation«. Der hebräische Begriff umfasst hier nicht nur den körperlichen Vorgang, sondern auch den damit verbundenen Zustand ritueller Unreinheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִדָּה
  choice: menstruationsbedingte Unreinheit
  rationale: Die Formulierung bewahrt sowohl den Bezug zur Menstruation als auch die kultisch-rituelle Bedeutung des Begriffs im Reinheitsgesetz, ohne moralische Schuld anzudeuten.
- source_word: תִּשְׁכַּב
  choice: liegt
  rationale: Das Verb bezeichnet hier das Liegen auf einem Gegenstand, nicht notwendigerweise Schlafen.
- source_word: תֵּשֵׁב
  choice: sitzt
  rationale: Die direkte und natürliche Wiedergabe des Sitzens auf einem Gegenstand.
- source_word: עָלָיו
  choice: worauf
  rationale: Gibt den räumlichen Bezug in den beiden Relativsätzen idiomatisch wieder.
- source_word: יִטְמָא
  choice: wird unrein sein
  rationale: Bezeichnet im gesetzlichen Zusammenhang einen rituell unreinen Zustand; die Zukunftsform entspricht der normativen Aussage des Hebräischen.
- source_word: וְכֹל אֲשֶׁר
  choice: alles, worauf
  rationale: Bewahrt den umfassenden Sinn der hebräischen Konstruktion und klingt im Deutschen natürlich.
theological_decisions:
- issue: Art der Unreinheit im levitischen Reinheitsgesetz
  choice: טמא und נִדָּה werden als rituelle beziehungsweise kultische Unreinheit wiedergegeben, ohne moralische Schuld zu unterstellen.
  alternative: Eine Formulierung, die Menstruation als moralische Befleckung oder Sünde erscheinen lassen könnte.
  rationale: Der Vers regelt den Zustand ritueller Unreinheit im israelitischen Reinheitssystem und trifft keine Aussage über persönliche Schuld.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wendung »menstruationsbedingte Unreinheit« ist präzise und vermeidet sowohl beschönigende Umschreibungen als auch eine moralische Wertung.
