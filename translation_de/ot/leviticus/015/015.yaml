base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/015.yaml
  text: The priest shall offer them[a], one as a sin offering and the other as a burnt offering, and the priest shall make atonement for him before Yahweh because of his discharge.
translation:
  language: de
  text: Der Priester soll sie darbringen, den einen als Sündopfer[a] und den anderen als Brandopfer. Der Priester soll vor Jahwe für ihn Sühne erwirken wegen seines Ausflusses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Reinigungsopfer“. Das hebräische Wort חַטָּאת kann ein Opfer bezeichnen, das rituelle Unreinheit beseitigt, nicht nur ein Opfer wegen moralischer Sünde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה אֹתָם
  choice: soll sie darbringen
  rationale: Im Opferkontext bezeichnet עשה die rituelle Darbringung der beiden zuvor genannten Vögel; „darbringen“ ist im Deutschen natürlich und sachlich präzise.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Die übliche und eindeutige Wiedergabe von כֹּהֵן in den kultischen Vorschriften.
- source_word: אֶחָד חַטָּאת
  choice: den einen als Sündopfer
  rationale: חַטָּאת ist die traditionelle Bezeichnung dieses Opfers. Da es hier der Beseitigung ritueller Unreinheit dient, wird die fachlich mögliche Wiedergabe „Reinigungsopfer“ in einer Fußnote bewahrt.
- source_word: וְהָאֶחָד עֹלָה
  choice: und den anderen als Brandopfer
  rationale: עֹלָה bezeichnet das vollständig verbrannte Opfer; „Brandopfer“ ist die etablierte deutsche Wiedergabe.
- source_word: וְכִפֶּר עָלָיו
  choice: für ihn Sühne erwirken
  rationale: Die Formulierung bewahrt die kultisch-theologische Bedeutung von כפר, ohne den Wirkmechanismus enger festzulegen, und gibt עָלָיו als „für ihn“ wieder.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: „Vor“ gibt die Vorstellung des Handelns in Gottes Gegenwart knapp und natürlich wieder; der Gottesname wird entsprechend der Projektvorgabe mit „Jahwe“ wiedergegeben.
- source_word: מִזּוֹבוֹ
  choice: wegen seines Ausflusses
  rationale: מִן bezeichnet hier den Anlass beziehungsweise die Verunreinigung, derentwegen die Sühnehandlung nötig ist. „Ausfluss“ entspricht dem medizinisch-rituellen Zusammenhang.
theological_decisions:
- issue: Bedeutung von חַטָּאת im Zusammenhang ritueller Unreinheit
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: „Sündopfer“ wahrt die traditionelle Opferbezeichnung, während die Fußnote deutlich macht, dass hier nicht zwingend persönliche moralische Schuld gemeint ist, sondern die Beseitigung ritueller Unreinheit.
- issue: Wiedergabe von כפר
  choice: Sühne erwirken
  alternative: entsühnen; Reinigung schaffen
  rationale: „Sühne erwirken“ erhält die theologische und kultische Spannung des hebräischen Ausdrucks, ohne ihn auf eine bestimmte Sühnetheorie oder ausschließlich auf Reinigung einzuengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am hebräischen Ablauf, wird aber durch Doppelpunkt und Satzteilung für heutige Leser klar gegliedert.
