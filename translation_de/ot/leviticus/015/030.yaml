  text: וְ/עָשָׂ֤ה הַ/כֹּהֵן֙ אֶת הָ/אֶחָ֣ד חַטָּ֔את וְ/אֶת הָ/אֶחָ֖ד עֹלָ֑ה וְ/כִפֶּ֨ר עָלֶ֤י/הָ הַ/כֹּהֵן֙ לִ/פְנֵ֣י יְהוָ֔ה מִ/זּ֖וֹב טֻמְאָתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/030.yaml
  text: Then the priest shall offer one as a sin offering and the other as a burnt offering, and the priest shall make atonement for her before Yahweh because of her unclean discharge.
translation:
  language: de
  text: Dann soll der Priester das eine als Sündopfer[a] und das andere als Brandopfer darbringen, und der Priester soll vor Yahweh für sie Sühne erwirken wegen des Ausflusses ihrer Unreinheit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Reinigungsopfer“. Das hebräische Wort חַטָּאת kann in den Opferbestimmungen ein Opfer bezeichnen, dessen kultische Reinigungsfunktion im Vordergrund steht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: soll … darbringen
  rationale: Das allgemeinere Verb „tun/machen“ bezeichnet hier im Opferkontext die Darbringung der beiden Opfer und wird so im Deutschen natürlich wiedergegeben.
- source_word: הָאֶחָד חַטָּאת
  choice: die eine als Sündopfer
  rationale: חַטָּאת bezeichnet hier die Opferart. „Sündopfer“ ist die geläufige deutsche Bezeichnung; die kultische Reinigungsfunktion wird in einer Fußnote als Übersetzungsalternative bewahrt.
- source_word: וְאֶת־הָאֶחָד עֹלָה
  choice: die andere als Brandopfer
  rationale: Die Wiederholung von „die eine“ hat distributiven Sinn; auf Deutsch ist „die andere“ idiomatisch. עֹלָה bezeichnet das vollständig verbrannte Opfer.
- source_word: וְכִפֶּר עָלֶיהָ
  choice: für sie Sühne erwirken
  rationale: Die Formulierung gibt die kultische Bedeutung von כפר und den Personenbezug von עָלֶיהָ verständlich wieder, ohne den Vorgang auf bloße Reinigung zu verengen.
- source_word: לִפְנֵי יְהוָה
  choice: vor Yahweh
  rationale: לִפְנֵי wird in der kultischen Wendung mit „vor“ wiedergegeben; der im hebräischen Text stehende Gottesname wird als „Yahweh“ bewahrt.
- source_word: מִזּוֹב טֻמְאָתָהּ
  choice: wegen ihres unreinen Ausflusses
  rationale: זוֹב bezeichnet einen körperlichen Ausfluss, während טֻמְאָה dessen kultische Unreinheit bestimmt. „Wegen“ gibt die ursächliche Beziehung des מִן in natürlichem Deutsch wieder.
theological_decisions:
- issue: Wiedergabe von יְהוָה
  choice: Yahweh
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm; „Yahweh“ gibt den Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von חַטָּאת in der Opfergesetzgebung
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: Das Wort bezeichnet hier eine feststehende Opferart. „Sündopfer“ bleibt als geläufige Benennung im Haupttext; „Reinigungsopfer“ macht die in diesem Zusammenhang wichtige kultische Funktion deutlicher und wird deshalb in der Fußnote genannt.
- issue: Art der Unreinheit und Sühne
  choice: kultische Unreinheit wird benannt, ohne persönliche moralische Schuld zu behaupten
  alternative: die Opferhandlung als Vergebung einer persönlichen Sünde zu formulieren
  rationale: Der Kontext handelt von einem körperlichen Ausfluss und der damit verbundenen rituellen Unreinheit. Die Übersetzung bewahrt die Sühneterminologie, setzt diese Unreinheit aber nicht stillschweigend mit persönlicher Schuld gleich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung verbessert die Lesbarkeit, ohne die Abfolge des Hebräischen zu verändern. „Ausfluss“ ist sachlich und für den gesetzlichen Kontext angemessen; „Sühne erwirken“ bewahrt die kultisch-theologische Spannung.
