source:
  edition: WLC
  text: וְ/הִזַּרְתֶּ֥ם אֶת בְּנֵי יִשְׂרָאֵ֖ל מִ/טֻּמְאָתָ֑/ם וְ/לֹ֤א יָמֻ֨תוּ֙ בְּ/טֻמְאָתָ֔/ם בְּ/טַמְּאָ֥/ם אֶת מִשְׁכָּנִ֖/י אֲשֶׁ֥ר בְּ/תוֹכָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/031.yaml
  text: Thus you shall warn the sons of Israel about their uncleanness[a], so that they may not die in their uncleanness by defiling my tabernacle, which is among them.
translation:
  language: de
  text: So sollt ihr die Israeliten von ihrer Unreinheit fernhalten[a], damit sie nicht in ihrer Unreinheit sterben, indem sie meine Wohnstätte verunreinigen, die mitten unter ihnen ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, bei einer anderen Deutung der Verbform: vor ihrer Unreinheit warnen.'
    reason: Die masoretische Form wird gewöhnlich als Hifil von נזר („absondern, fernhalten“) verstanden. Die alternative Deutung im Sinn von „warnen“ soll als solche kenntlich bleiben.
lexical_decisions:
- source_word: וְהִזַּרְתֶּם
  choice: sollt ihr … fernhalten
  rationale: Die Form wird am besten als Hifil von נזר verstanden und bezeichnet hier das Absondern beziehungsweise Fernhalten von ritueller Unreinheit. „Fernhalten“ gibt den vorbeugenden Sinn in natürlichem Deutsch wieder; die ebenfalls vertretene Deutung als Warnung wird in der Fußnote genannt.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die feste hebräische Bezeichnung bedeutet wörtlich „Söhne Israels“, bezeichnet hier aber das Volk als Ganzes. „Die Israeliten“ ist im modernen Deutschen präzise und idiomatisch.
- source_word: מִטֻּמְאָתָם
  choice: von ihrer Unreinheit
  rationale: Die Präposition מִן passt zur Bedeutung „fernhalten von“. „Unreinheit“ bezeichnet hier den kultisch-rituellen Zustand und ist nicht als bloß moralisches Urteil zu verstehen.
- source_word: בְּטֻמְאָתָם
  choice: in ihrer Unreinheit
  rationale: Die Präposition בְּ bezeichnet den Zustand, in dem ihnen der Tod droht. Die Formulierung bewahrt die knappe Ausdrucksweise und die mögliche Bedeutungsnähe zu „wegen ihrer Unreinheit“.
- source_word: בְּטַמְּאָם
  choice: wenn sie … verunreinigen
  rationale: Der Infinitiv mit בְּ kann den begleitenden beziehungsweise auslösenden Umstand ausdrücken. „Wenn“ stellt im Deutschen verständlich den Zusammenhang zwischen der Verunreinigung der Wohnstätte und der Todesgefahr her, ohne ihn ausschließlich kausal festzulegen.
- source_word: מִשְׁכָּנִי
  choice: meine Wohnstätte
  rationale: מִשְׁכָּן bezeichnet Gottes Wohnung inmitten Israels, konkret das Heiligtum beziehungsweise die Stiftshütte. „Wohnstätte“ bewahrt das Motiv des göttlichen Wohnens und klingt im Deutschen würdig.
- source_word: אֲשֶׁר בְּתוֹכָם
  choice: die mitten unter ihnen ist
  rationale: Die Wendung betont Gottes gegenwärtige Wohnung in der Mitte des Volkes und wird eng am Hebräischen wiedergegeben.
theological_decisions:
- issue: Rituelle Unreinheit
  choice: „Unreinheit“ als kultisch-rituellen Zustand beibehalten
  alternative: Die Aussage mit moralischer Schuld oder Sünde wiedergeben
  rationale: Der Zusammenhang handelt von körperlich beziehungsweise kultisch bedingter Unreinheit und von der Gefährdung der göttlichen Wohnstätte. Der Text setzt Unreinheit hier nicht einfach mit persönlicher Sünde gleich.
- issue: Bezug zwischen Unreinheit, Verunreinigung der Wohnstätte und Tod
  choice: Die Todesgefahr an den Zustand der Unreinheit und an die Verunreinigung der Wohnstätte binden
  alternative: Den Tod ausschließlich als unmittelbare Strafe für moralisches Fehlverhalten darstellen
  rationale: Die hebräischen בְּ-Konstruktionen lassen Zustands-, Umstands- und Kausalnuancen zu. Die Übersetzung bewahrt diesen kultischen Zusammenhang, ohne ihn dogmatisch zu verengen.
- issue: Gottes מִשְׁכָּן unter Israel
  choice: „meine Wohnstätte“
  alternative: „mein Heiligtum“ oder „meine Stiftshütte“
  rationale: „Wohnstätte“ hält das theologisch bedeutsame Motiv fest, dass Gott mitten unter Israel wohnt, während der konkrete Bezug auf die Stiftshütte im Kontext bestehen bleibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Israeliten“ ist die natürliche deutsche Wiedergabe der kollektiven Bezeichnung בְּנֵי יִשְׂרָאֵל. „Wohnstätte“ vermeidet das alltagssprachliche „Wohnung“ und bewahrt zugleich das Motiv des göttlichen Wohnens. Der Satzbau bleibt nah an der hebräischen Folge, ohne unnatürlich zu wirken.
