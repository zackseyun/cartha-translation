  text: וְ/כֹ֨ל אֲשֶׁ֤ר יִגַּע בּ/וֹ֙ הַ/זָּ֔ב וְ/יָדָ֖י/ו לֹא שָׁטַ֣ף בַּ/מָּ֑יִם וְ/כִבֶּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/011.yaml
  text: And everyone whom the man with the discharge touches[a], without having washed his hands in water, shall wash his clothes and bathe in water, and be unclean until the evening.
translation:
  language: de
  text: Und jeder, den der Mann mit dem Ausfluss berührt, ohne dass der Mann mit dem Ausfluss zuvor seine Hände mit Wasser abgespült hat,[a] muss seine Kleider waschen, sich im Wasser waschen und bleibt bis zum Abend unrein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn der Mann mit dem Ausfluss seine Hände nicht mit Wasser abgespült hat“. Der hebräische Satzteil kann als Bedingung verstanden werden, unter der die Berührung Unreinheit überträgt.'
    reason: lexikalisch-syntaktische Alternative
lexical_decisions:
- source_word: הַזָּב
  choice: der Mann mit dem Ausfluss
  rationale: Das substantivierte Partizip bezeichnet in diesem Reinheitsgesetz einen Mann mit einem körperlichen Ausfluss; die Wiedergabe bewahrt den männlichen Bezug und ist im Deutschen klar.
- source_word: יִגַּע בּוֹ
  choice: berührt
  rationale: נגע mit ב bezeichnet körperliche Berührung; „berührt“ gibt dies natürlich und präzise wieder.
- source_word: וְיָדָיו לֹא שָׁטַף בַּמָּיִם
  choice: ohne seine Hände mit Wasser abgespült zu haben
  rationale: Die Wendung wird als Umstandsangabe zum Mann mit dem Ausfluss verstanden. „abgespült“ bildet שטף ab und unterscheidet es von der später genannten Körper- und Kleiderwäsche.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: muss seine Kleider waschen
  rationale: כּבס bezeichnet hier das Waschen von Kleidung; „muss“ bringt die rechtliche Verpflichtung in natürlichem Deutsch zum Ausdruck.
- source_word: וְרָחַץ בַּמַּיִם
  choice: sich mit Wasser baden
  rationale: רחץ bezeichnet in diesem Reinheitskontext die Reinigung des Körpers und bleibt damit von der Kleiderwäsche unterschieden.
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: bleibt bis zum Abend unrein
  rationale: טמא bezeichnet kultische beziehungsweise rituelle Unreinheit, nicht moralische Schuld. „bleibt“ gibt den bis zum Abend andauernden Zustand idiomatisch wieder.
- source_word: כֹל אֲשֶׁר
  choice: jeder, den
  rationale: Die distributive, personenbezogene Formulierung wird im Deutschen natürlich durch „jeder, den“ wiedergegeben.
theological_decisions:
- issue: Bedeutung der Unreinheit im levitischen Reinheitsgesetz
  choice: „unrein“ als rituelle beziehungsweise kultische Kategorie
  alternative: „befleckt“ oder moralisch schuldig
  rationale: Der Zusammenhang behandelt durch Berührung übertragene Unreinheit, die durch Waschen und Zeitablauf endet; moralische Schuld ist nicht gemeint.
- issue: Bezug der nicht abgespülten Hände
  choice: Die Hände gehören dem Mann mit dem Ausfluss; ihr Nichtabspülen ist der Umstand, unter dem seine Berührung Unreinheit überträgt.
  alternative: 'Die Formulierung kann ausdrücklich konditional wiedergegeben werden: „wenn er seine Hände nicht mit Wasser abgespült hat“.'
  rationale: Die hebräische Satzfügung erlaubt eine umstandsbezogene beziehungsweise konditionale Lesart. Der Haupttext bewahrt sie in knapper deutscher Form, während die Fußnote die konditionale Alternative nennt.
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch. Die drei Waschhandlungen werden lexikalisch unterschieden: Hände abspülen, Kleider waschen, sich baden. Der Rechtssatz bleibt verständlich, ohne die rituelle Unreinheit moralisch umzudeuten.'
