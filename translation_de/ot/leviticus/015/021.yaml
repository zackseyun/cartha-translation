  text: And everyone who touches her bed shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: de
  text: Und jeder, der ihr Bett[a] berührt, muss seine Kleider waschen und sich mit Wasser waschen; er ist bis zum Abend unrein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Liegestätte“ oder „ihre Schlafunterlage“. Das hebräische Wort bezeichnet den Ort oder die Unterlage, auf der sie liegt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הַנֹּגֵעַ
  choice: Und jeder, der … berührt
  rationale: Die Verbindung aus כָּל und substantivischem Partizip formuliert eine allgemeine Regel; diese Wiedergabe bewahrt den umfassenden Sinn in natürlichem Deutsch.
- source_word: בְּמִשְׁכָּבָהּ
  choice: ihr Bett
  rationale: מִשְׁכָּב bezeichnet hier den Ort beziehungsweise die Unterlage, auf der sie liegt. „Bett“ ist im Deutschen die direkte und verständliche Hauptwiedergabe; die weitere Bedeutungsbreite wird in der Fußnote erhalten.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: soll seine Kleider waschen
  rationale: כבס bezeichnet besonders das Waschen von Textilien. „Soll“ gibt die rechtlich-anweisende Funktion angemessen wieder.
- source_word: וְרָחַץ בַּמַּיִם
  choice: sich mit Wasser waschen
  rationale: רחץ bezeichnet hier im Unterschied zum Waschen der Kleider die Reinigung des Körpers. Das reflexive „sich waschen“ macht dies im Deutschen klar, ohne ein vollständiges Bad über den Wortlaut hinaus festzulegen.
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: und bis zum Abend unrein sein
  rationale: טמא bezeichnet in diesem Zusammenhang kultische Unreinheit; die zeitliche Begrenzung durch עַד הָעָרֶב bleibt unmittelbar erhalten.
theological_decisions:
- issue: Art der Unreinheit
  choice: „unrein“ als kultisch-rechtliche Kategorie
  alternative: „verunreinigt“ oder „unrein werden“ mit möglichem moralischem Beiklang
  rationale: Der Kontext regelt kultische Reinheit und behauptet an dieser Stelle keine persönliche moralische Schuld. Die knappe Wiedergabe „unrein sein“ bewahrt diese Kategorie, ohne sie dogmatisch weiter auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer rechtlicher Formulierung. Die Wiederholung von „waschen“ bildet den hebräischen Unterschied zwischen dem Waschen der Kleider und des Körpers verständlich ab.
