  text: וְ/כָל בֶּ֣גֶד וְ/כָל ע֔וֹר אֲשֶׁר יִהְיֶ֥ה עָלָ֖י/ו שִׁכְבַת זָ֑רַע וְ/כֻבַּ֥ס בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/017.yaml
  text: And every garment and every skin on which there is an emission of semen shall be washed with water and be unclean until the evening[a][b].
translation:
  language: de
  text: Und jedes Kleidungsstück und jede Tierhaut, auf der sich ein Samenerguss befindet, muss mit Wasser gewaschen werden und ist bis zum Abend unrein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Tierhaut“ ist hier wahrscheinlich ein Gegenstand aus Tierhaut gemeint; möglich ist auch die Übersetzung „Leder“.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּגֶד
  choice: Kleidungsstück
  rationale: Der breite Sachbegriff bezeichnet ein Kleid beziehungsweise einen textilen Gegenstand; „Kleidungsstück“ ist im modernen Deutschen klar und konkret.
- source_word: עוֹר
  choice: Fell
  rationale: Das hebräische Wort bezeichnet Haut oder Fell, hier wahrscheinlich einen Gegenstand aus Tierhaut. „Fell“ bleibt näher am Ausgangswort als das stärker verarbeitungsbezogene „Leder“.
- source_word: אֲשֶׁר יִהְיֶה עָלָיו
  choice: auf dem sich … befindet
  rationale: Die Formulierung gibt die lokale Aussage des Hebräischen natürlich wieder, ohne über den Zustand oder das Material hinauszugehen.
- source_word: שִׁכְבַת זָרַע
  choice: Samenerguss
  rationale: Die feste Wendung bezeichnet hier ausgestoßenes Sperma beziehungsweise einen Samenerguss. „Samenerguss“ ist ausdrücklich, verständlich und im Zusammenhang angemessen.
- source_word: וְכֻבַּס
  choice: muss … gewaschen werden
  rationale: Das Passiv steht in einer rechtlichen Anweisung. „Muss … gewaschen werden“ gibt die verpflichtende Funktion im heutigen Deutsch natürlich wieder.
- source_word: בַּמַּיִם
  choice: mit Wasser
  rationale: Die Präposition bezeichnet hier das Mittel; „mit Wasser waschen“ ist die natürliche deutsche Verbindung.
- source_word: וְטָמֵא
  choice: und ist … unrein
  rationale: Die Wendung beschreibt den nach dem Waschen fortbestehenden Zustand ritueller Unreinheit. Das Präsens ist in deutscher Rechtssprache klar und knapp.
- source_word: עַד הָעָרֶב
  choice: bis zum Abend
  rationale: Die Formulierung entspricht dem bestimmten hebräischen Ausdruck und klingt im Deutschen natürlich.
theological_decisions:
- issue: Art der Unreinheit im levitischen Reinheitsrecht
  choice: טָמֵא wird mit „unrein“ wiedergegeben, ohne moralische Schuld anzudeuten.
  alternative: „verunreinigt“ oder „kultisch unrein“
  rationale: Der Zusammenhang behandelt rituelle Unreinheit. „Unrein“ bewahrt den traditionellen Sachbegriff, während „kultisch“ eine erklärende Ergänzung wäre, die nicht ausdrücklich im Vers steht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die verpflichtende Rechtsanweisung wird mit „muss“ ausgedrückt; die rituelle Kategorie bleibt mit „unrein“ unkommentiert erhalten.
