source:
  edition: WLC
  text: וְ/אִ֨ם עַֽל הַ/מִּשְׁכָּ֜ב ה֗וּא א֧וֹ עַֽל הַ/כְּלִ֛י אֲשֶׁר הִ֥וא יֹשֶֽׁבֶת עָלָ֖י/ו בְּ/נָגְע/וֹ ב֑/וֹ יִטְמָ֖א עַד הָ/עָֽרֶב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/023.yaml
  text: And if it is on the bed or on the item on which she sits[a], when he touches it he shall be unclean until the evening.
translation:
  language: de
  text: Und wenn es auf dem Bett oder auf dem Gegenstand ist, auf dem sie sitzt[a], wird jeder, der es berührt, bis zum Abend unrein sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gerät“ oder „Gefäß“. Das hebräische Wort כְּלִי bezeichnet allgemein einen Gegenstand, ein Gerät oder ein Gefäß.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Und wenn
  rationale: Bewahrt sowohl die Verknüpfung mit dem vorausgehenden Fallrecht als auch die konditionale Bedeutung.
- source_word: עַל הַמִּשְׁכָּב
  choice: auf dem Bett
  rationale: מִשְׁכָּב bezeichnet hier natürlich einen Liegeplatz beziehungsweise ein Bett; „Bett“ ist im modernen Deutsch klar und treffend.
- source_word: הוּא
  choice: es … liegt
  rationale: Das maskuline Pronomen verweist im Zusammenhang auf das zuvor vorausgesetzte Verunreinigende. Das ergänzte Verb „liegt“ ergibt zusammen mit עַל eine natürliche deutsche Formulierung, ohne die Sache näher festzulegen.
- source_word: עַל הַכְּלִי
  choice: auf dem Gegenstand
  rationale: כְּלִי ist ein weiter Begriff für einen Gegenstand, ein Gerät oder Gefäß. „Gegenstand“ bewahrt diese Bedeutungsbreite hier am besten.
- source_word: אֲשֶׁר הִוא יֹשֶׁבֶת עָלָיו
  choice: auf dem sie sitzt
  rationale: Gibt den Relativsatz und den partizipialen Sinn schlicht und idiomatisch wieder.
- source_word: בְּנָגְעוֹ בוֹ
  choice: jeder, der es berührt
  rationale: Die Infinitivkonstruktion bezeichnet den Zeitpunkt beziehungsweise Umstand der Berührung. Das grammatische Maskulinum Singular wird im Deutschen als allgemeine Rechtsfallformulierung natürlich mit „jeder, der“ wiedergegeben.
- source_word: יִטְמָא
  choice: wird … unrein sein
  rationale: Das Imperfekt bezeichnet hier die eintretende Rechtsfolge. Die Formulierung ist modernes Deutsch und wahrt den rituellen Statusbegriff.
- source_word: עַד הָעָרֶב
  choice: bis zum Abend
  rationale: Entspricht der wiederkehrenden levitischen Formel und gibt den hebräischen Artikel idiomatisch wieder.
theological_decisions:
- issue: Bedeutung von טָמֵא im levitischen Reinheitsrecht
  choice: unrein
  alternative: kultisch unrein; verunreinigt
  rationale: Gemeint ist ein ritueller Status, nicht notwendig moralische Schuld. „Unrein“ bewahrt die knappe Ausdrucksweise des Hebräischen, ohne eine zusätzliche theologische Deutung einzutragen.
- issue: Bezug von הוּא und den Objektsuffixen
  choice: sachlicher Bezug, im Deutschen mit „es“ wiedergegeben
  alternative: personenbezogene Wiedergabe „er“
  rationale: Der Zusammenhang der Reinheitsvorschriften legt einen sachlichen Bezug nahe. Die deutsche Wiedergabe lässt die genaue Art dessen, was auf dem Bett oder Gegenstand liegt, dennoch unbestimmt.
translation_notes:
  register: Moderne, würdevolle Rechtssprache mit verständlichem Satzbau. „Wird … unrein sein“ vermeidet das heute steife „soll unrein sein“, während die rechtliche Folge klar bleibt.
