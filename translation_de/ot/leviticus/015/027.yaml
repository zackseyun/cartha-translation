  text: וְ/כָל הַ/נּוֹגֵ֥עַ בָּ֖/ם יִטְמָ֑א וְ/כִבֶּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/027.yaml
  text: And everyone who touches them shall be unclean[a], and he shall wash his clothes and bathe in water, and be unclean until the evening.
translation:
  language: de
  text: Und jeder, der sie berührt, wird unrein. Er soll seine Kleider waschen, sich mit Wasser waschen und ist bis zum Abend unrein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כָל הַ/נּוֹגֵעַ
  choice: Und jeder, der … berührt
  rationale: כָּל mit dem substantivisch gebrauchten Partizip bezeichnet umfassend jeden, der die Handlung vollzieht; diese Wiedergabe ist natürlich und erhält den universalen Umfang.
- source_word: בָּ/ם
  choice: sie
  rationale: Das maskuline Pluralsuffix verweist auf die im vorherigen Zusammenhang genannten Gegenstände. Das Pronomen bewahrt den Textbezug, ohne den Referenten im Haupttext stärker festzulegen.
- source_word: יִטְמָא
  choice: wird unrein
  rationale: טמא bezeichnet hier kultische Unreinheit. „Wird unrein“ gibt das Eintreten dieses Zustands wieder, ohne moralische Schuld anzudeuten.
- source_word: וְ/כִבֶּס בְּגָדָי/ו
  choice: Er soll seine Kleider waschen
  rationale: כבס bezeichnet das Waschen von Textilien; „Kleider“ ist im modernen Standarddeutsch klar und sachgerecht.
- source_word: וְ/רָחַץ בַּ/מַּיִם
  choice: und sich mit Wasser waschen
  rationale: רחץ meint hier die Waschung des Körpers. Das reflexive „sich waschen“ ist im Deutschen natürlich; „mit Wasser“ entspricht der hebräischen Formulierung.
- source_word: וְ/טָמֵא עַד הָ/עָרֶב
  choice: und bleibt bis zum Abend unrein
  rationale: Die knappe hebräische Anschlusskonstruktion beschreibt die Fortdauer des Zustands. „Bleibt“ macht diesen zeitlichen Sinn im Deutschen klar.
theological_decisions:
- issue: Bedeutung der Unreinheit im levitischen Reinheitsrecht
  choice: „unrein“ als kultisch-rituellen Status wiedergeben
  alternative: „befleckt“ oder eine Formulierung, die moralische Schuld nahelegt
  rationale: Der Zusammenhang regelt rituelle Unreinheit. Die Übersetzung darf die Berührung nicht stillschweigend als moralische Verfehlung darstellen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „unrein“ erhält den rechtlich-rituellen Nachdruck des Hebräischen; der Wechsel zu „Er soll“ vermeidet eine schwerfällige Reihung.
