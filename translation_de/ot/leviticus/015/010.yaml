  text: וְ/כָל הַ/נֹּגֵ֗עַ בְּ/כֹל֙ אֲשֶׁ֣ר יִהְיֶ֣ה תַחְתָּ֔י/ו יִטְמָ֖א עַד הָ/עָ֑רֶב וְ/הַ/נּוֹשֵׂ֣א אוֹתָ֔/ם יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/010.yaml
  text: And everyone who touches anything that was under him shall be unclean until the evening[a], and whoever carries them shall wash his clothes and bathe in water[b], and be unclean until the evening.
translation:
  language: de
  text: Und jeder, der irgendetwas berührt, was unter ihm war, ist bis zum Abend unrein.[a] Wer sie trägt,[b] muss seine Kleidung waschen und sich mit Wasser waschen; er ist bis zum Abend unrein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher ist auch möglich: „was unter ihm ist“. Im Zusammenhang sind wahrscheinlich Gegenstände gemeint, die zuvor unter dem Betroffenen waren.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Pronomen steht im Plural („sie“). Es bezieht sich offenbar zusammenfassend auf die verunreinigten Gegenstände, die unter ihm waren.
    reason: referent_clarification
lexical_decisions:
- source_word: הַנֹּגֵעַ
  choice: der … berührt
  rationale: Das Partizip von נגע bezeichnet hier unmittelbare körperliche Berührung; „berührt“ ist im Zusammenhang der Reinheitsvorschriften klar und natürlich.
- source_word: בְּכֹל אֲשֶׁר יִהְיֶה תַחְתָּיו
  choice: irgendetwas …, was unter ihm war
  rationale: Die Wendung bezieht sich im Zusammenhang auf Gegenstände, die sich unter dem vom Ausfluss Betroffenen befanden. Das deutsche Präteritum gibt diesen rückblickenden Verfahrenszusammenhang natürlich wieder, ohne die räumliche Bedeutung von תַּחַת aufzugeben.
- source_word: יִטְמָא
  choice: ist … unrein
  rationale: טמא bezeichnet in dieser Gesetzessprache den rituellen Zustand der Unreinheit. Das Präsens formuliert die allgemein geltende Rechtsfolge im modernen Deutschen natürlicher als eine futurische Form.
- source_word: עַד הָעָרֶב
  choice: bis zum Abend
  rationale: Die Formulierung entspricht dem bestimmten hebräischen Ausdruck und ist im Deutschen idiomatisch.
- source_word: הַנּוֹשֵׂא אֹתָם
  choice: Wer diese Dinge trägt
  rationale: נשא bedeutet hier „tragen“. Das pluralische אֹתָם wird entsprechend seiner Form wiedergegeben und kollektiv auf die zuvor gemeinten verunreinigten Gegenstände bezogen.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: muss seine Kleidung waschen
  rationale: „Kleidung“ ist eine moderne, natürliche Entsprechung für בְּגָדִים. „Muss“ bringt die verbindliche Vorschrift klar zum Ausdruck.
- source_word: וְרָחַץ בַּמַּיִם
  choice: und sich mit Wasser waschen
  rationale: רחץ bezeichnet in dieser Reinigungsformel das Waschen des Körpers. Die reflexive Formulierung macht dies deutlich, ohne ein vollständiges Eintauchen vorauszusetzen.
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: er ist bis zum Abend unrein
  rationale: Der selbstständige Satz bewahrt die abschließende Rechtsfolge und vermeidet im Deutschen eine missverständliche Koordination mit den vorausgehenden Geboten.
theological_decisions:
- issue: Art der Unreinheit
  choice: unrein
  alternative: kultisch unrein
  rationale: Der Text verwendet den üblichen Reinheitsbegriff טמא, ohne ihn an dieser Stelle näher zu qualifizieren. „Unrein“ bewahrt die biblische Fachsprache und fügt keine auslegende Einschränkung in den Haupttext ein.
translation_notes:
  register: Moderne, würdige Gesetzessprache. Das allgemein geltende Präsens und „muss“ vermitteln den rechtlichen Charakter ohne altertümliches „soll“. Die Wiederholung „bis zum Abend unrein“ bleibt wegen ihrer strukturellen und inhaltlichen Bedeutung erhalten.
