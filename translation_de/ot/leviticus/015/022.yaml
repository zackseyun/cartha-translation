  text: וְ/כָל הַ/נֹּגֵ֔עַ בְּ/כָל כְּלִ֖י אֲשֶׁר תֵּשֵׁ֣ב עָלָ֑י/ו יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/022.yaml
  text: And everyone who touches any object on which she sits shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: de
  text: Und jeder, der jeden Gegenstand berührt, auf dem sie sitzt, muss seine Kleider waschen und sich mit Wasser waschen[a]; er ist bis zum Abend unrein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »baden«. Das hebräische Verb bezeichnet hier das Waschen des Körpers mit Wasser.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הַנֹּגֵעַ
  choice: Und jeder, der … berührt
  rationale: Die Verbindung aus כָל und substantivischem Partizip bezeichnet umfassend jede Person, die den genannten Kontakt hat. Die Formulierung ist im modernen Deutschen natürlich und bewahrt den allgemeinen Geltungsbereich.
- source_word: בְּכָל כְּלִי
  choice: irgendeinen Gegenstand
  rationale: כְּלִי ist ein weiter Begriff für einen Gegenstand, ein Gerät, Gefäß oder Gebrauchsstück. »Gegenstand« passt hier zu etwas, auf dem man sitzen kann, ohne die Bedeutung unnötig auf ein Gefäß zu verengen.
- source_word: אֲשֶׁר תֵּשֵׁב עָלָיו
  choice: auf dem sie sitzt
  rationale: Der Relativsatz bezieht sich auf כְּלִי; das feminine Subjekt von תֵּשֵׁב verweist auf die Frau aus dem vorausgehenden Zusammenhang.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: muss seine Kleider waschen
  rationale: כִּבֵּס bezeichnet bei Kleidern das Waschen. »Muss« gibt die rechtlich-anweisende Kraft der Verbform in natürlichem modernem Deutsch wieder.
- source_word: וְרָחַץ בַּמַּיִם
  choice: und sich mit Wasser waschen
  rationale: רָחַץ bezeichnet hier die körperliche Waschung. Das reflexive »sich waschen« macht dies im Deutschen klar, während »mit Wasser« das hebräische בַּמַּיִם wiedergibt.
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: er ist bis zum Abend unrein
  rationale: טָמֵא bezeichnet im Kontext den kultisch-rituellen Status. Die knappe deutsche Aussage bewahrt diesen Status und seine zeitliche Begrenzung.
theological_decisions:
- issue: Art der Unreinheit im Reinheitsgesetz
  choice: טָמֵא wird mit »unrein« als ritueller Status wiedergegeben.
  alternative: »verunreinigt« oder »unrein geworden«
  rationale: Der Vers beschreibt durch Berührung eintretende kultische Unreinheit, nicht moralische Schuld. »Unrein« erhält die zentrale Kategorie des Levitikus, ohne eine ethische Verurteilung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Rechtssprache. »Kleider« entspricht dem biblisch-rechtlichen Register, bleibt aber allgemein verständlich. Das Semikolon gliedert Waschungsgebot und anschließenden Reinheitsstatus.
