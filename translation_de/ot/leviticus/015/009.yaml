source:
  edition: WLC
  text: וְ/כָל הַ/מֶּרְכָּ֗ב אֲשֶׁ֨ר יִרְכַּ֥ב עָלָ֛י/ו הַ/זָּ֖ב יִטְמָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/009.yaml
  text: And every saddle on which the man with the discharge rides shall be unclean[a].
translation:
  language: de
  text: Und jeder Sattel, auf dem der Mann mit dem Ausfluss reitet, wird unrein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „jeder Gegenstand, auf dem er reitet“; der hebräische Ausdruck kann allgemeiner das bezeichnen, worauf man reitet, nicht nur einen Sattel im engeren Sinn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: Und jeder
  rationale: וְ verbindet die Vorschrift mit dem vorangehenden Abschnitt; כָּל hat hier distributiven Sinn. „Und jeder“ bewahrt beides in natürlichem Deutsch.
- source_word: הַ/מֶּרְכָּב
  choice: Sattel
  rationale: מֶרְכָּב bezeichnet etwas, worauf man reitet. Im Kontext ist „Sattel“ die naheliegende konkrete Wiedergabe; die mögliche weitere Bedeutung wird in der Fußnote erhalten.
- source_word: אֲשֶׁר יִרְכַּב עָלָיו
  choice: auf dem ... reitet
  rationale: Die Wiedergabe bildet den Relativsatz und die räumliche Bedeutung von עַל idiomatisch und eng am Hebräischen ab.
- source_word: הַ/זָּב
  choice: der Mann mit dem Ausfluss
  rationale: Das substantivierte maskuline Partizip bezeichnet im Kapitel einen Mann mit einem körperlichen, im Zusammenhang insbesondere genitalen Ausfluss. Die Formulierung ist klar und bewahrt den männlichen Bezug.
- source_word: יִטְמָא
  choice: wird unrein sein
  rationale: Das Qal bezeichnet den daraus folgenden kultisch-rechtlichen Status. „Wird unrein sein“ ist im Deutschen verständlich, ohne moralische Schuld oder eine genauere Aspektbedeutung einzutragen.
theological_decisions:
- issue: Art der Unreinheit in Levitikus 15
  choice: טמא wird als „unrein“ im kultisch-rechtlichen Sinn wiedergegeben.
  alternative: „verunreinigt“ oder „unrein werden“
  rationale: Der Vers behandelt rituelle Unreinheit infolge eines körperlichen Ausflusses, nicht ausdrücklich moralische Schuld. „Unrein“ wahrt diese Unterscheidung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Rechtssprache bleibt knapp und klar; „Ausfluss“ und „unrein“ entsprechen dem sachlichen kultischen Kontext.
