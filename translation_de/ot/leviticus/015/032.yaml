  terminology: „Weisung“ ist für תּוֹרָה in dieser levitischen Zusammenfassungsformel gut gewählt. „Ausfluss“ und „unrein“ entsprechen dem Sprachgebrauch des Abschnitts. Die unmarkierte Wiedergabe von טָמֵא als „unrein“ bewahrt den Wortlaut; der kultische Rahmen ergibt sich aus dem Kontext und muss nicht in den Vers eingetragen werden.
