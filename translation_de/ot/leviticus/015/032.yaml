id: LEV.15.32
reference: Leviticus 15:32
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: זֹ֥את תּוֹרַ֖ת הַ/זָּ֑ב וַ/אֲשֶׁ֨ר תֵּצֵ֥א מִמֶּ֛/נּוּ שִׁכְבַת זֶ֖רַע לְ/טָמְאָה בָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/032.yaml
  text: 'This is the law for the one with a discharge[a], and for him from whom an emission of semen goes out, making him unclean by it:'
translation:
  language: de
  text: 'Das ist die Weisung für den, der einen Ausfluss hat, und für den, bei dem Samen austritt, sodass er dadurch unrein wird:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֹאת תּוֹרַת
  choice: Das ist die Weisung
  rationale: Die Formel leitet eine zusammenfassende kultrechtliche Bestimmung ein. »Weisung« gibt תּוֹרָה hier natürlich und weniger missverständlich als das allgemeinere »Gesetz« wieder.
- source_word: הַזָּב
  choice: den, der einen Ausfluss hat
  rationale: Das substantivierte Partizip bezeichnet eine Person mit einem körperlichen Ausfluss; die Formulierung ist verständlich und wahrt den sachlichen Charakter.
- source_word: וַאֲשֶׁר תֵּצֵא מִמֶּנּוּ
  choice: und für den, bei dem … austritt
  rationale: Die deutsche Konstruktion bildet den zweiten Fall flüssig ab und bewahrt die im Hebräischen ausgesagte Bewegung des Austretens.
- source_word: שִׁכְבַת זֶרַע
  choice: Samen
  rationale: Der feste Ausdruck bezeichnet hier männlichen Samen beziehungsweise eine Samenabsonderung. Im Zusammenhang mit »austritt« ist »Samen« klar und vermeidet eine unnötige Verdoppelung wie »Samenerguss tritt aus«.
- source_word: לְטָמְאָה בָהּ
  choice: sodass er dadurch unrein wird
  rationale: Der Infinitiv kann Folge oder Zweck ausdrücken; »sodass« gibt hier die naheliegende Folge wieder, während »dadurch« den femininen Rückbezug auf die Absonderung sinngemäß aufnimmt.
theological_decisions:
- issue: Art der Unreinheit
  choice: unrein
  alternative: kultisch unrein
  rationale: Der Ausgangstext sagt lediglich »unrein«; der kultische Zusammenhang ist aus dem Kapitel ersichtlich und muss nicht erklärend in den Vers eingefügt werden.
- issue: Deutung von לְטָמְאָה als Folge oder Zweck
  choice: sodass er dadurch unrein wird
  alternative: um dadurch unrein zu werden
  rationale: Die Folgedeutung ist im Kontext idiomatischer, ohne die grammatische Spannung unnötig dogmatisch aufzuladen.
translation_notes:
  register: Modernes, sachliches und würdiges Standarddeutsch. Die medizinisch-kultrechtliche Aussage wird direkt formuliert, ohne archaische Euphemismen oder konfessionelle Zusätze.
