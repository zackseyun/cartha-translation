  source_fidelity: Die Übersetzung gibt die zusammenfassende Formel זֹאת תּוֹרַת sachgerecht als „Das ist die Weisung“ wieder. Sie unterscheidet zutreffend zwischen dem Menschen mit einem Ausfluss (הַזָּב) und demjenigen, aus dem Samen austritt (אֲשֶׁר תֵּצֵא מִמֶּנּוּ שִׁכְבַת זֶרַע). „sodass er dadurch unrein wird“ gibt die resultative bzw. zweckhafte Funktion von לְטָמְאָה בָהּ angemessen wieder, ohne eine nicht erforderliche Entscheidung zwischen den Nuancen zu erzwingen.
