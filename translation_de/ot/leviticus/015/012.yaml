  text: וּ/כְלִי חֶ֛רֶשׂ אֲשֶׁר יִגַּע בּ֥/וֹ הַ/זָּ֖ב יִשָּׁבֵ֑ר וְ/כָל כְּלִי עֵ֔ץ יִשָּׁטֵ֖ף בַּ/מָּֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/012.yaml
  text: And an earthen vessel that the one with the discharge touches shall be broken[c][b][a], and every wooden vessel shall be rinsed with water.
translation:
  language: de
  text: Ein Tongefäß[a], das ein Mann mit Ausfluss[b] berührt, muss zerbrochen werden; jedes Holzgefäß aber muss mit Wasser abgespült[c] werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gefäß aus Ton“ beziehungsweise „Töpferware“.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „der Ausfließende“; ein Fachausdruck des Reinheitsrechts für einen Mann mit körperlichem Ausfluss.'
    reason: cultural_note
  - marker: c
    text: 'Oder: „mit Wasser gewaschen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְלִי חֶרֶשׂ
  choice: Tongefäß
  rationale: Die Wortverbindung bezeichnet ein Gefäß aus gebranntem Ton. „Tongefäß“ ist im modernen Deutschen natürlich und bewahrt den für das Reinheitsgesetz wichtigen Materialunterschied.
- source_word: אֲשֶׁר יִגַּע בּוֹ
  choice: das ... berührt
  rationale: נגע bedeutet im Qal gewöhnlich „berühren“. Die direkte Wiedergabe erhält die klare Formulierung des Hebräischen.
- source_word: הַזָּב
  choice: der Ausflusskranke
  rationale: Das substantivierte Partizip ist hier ein technischer Ausdruck des Reinheitsrechts für einen von körperlichem Ausfluss betroffenen Menschen. Der weitere Zusammenhang bezieht sich auf einen Mann; die kompakte deutsche Bezeichnung gibt Zustand und Personenbezug wieder.
- source_word: יִשָּׁבֵר
  choice: muss zerbrochen werden
  rationale: Der Niphal drückt im gesetzlichen Zusammenhang eine verbindliche passive Anweisung aus. „Muss ... werden“ vermittelt diese Rechtskraft in natürlichem modernem Deutsch.
- source_word: כָל כְּלִי עֵץ
  choice: jedes Holzgefäß
  rationale: Die Wendung bezeichnet ein Gefäß beziehungsweise Gerät aus Holz. „Jedes Holzgefäß“ wahrt knapp die Parallele zum Tongefäß.
- source_word: יִשָּׁטֵף בַּמָּיִם
  choice: muss mit Wasser abgespült werden
  rationale: שטף bezeichnet hier das Spülen oder Waschen durch Wasser. „Mit Wasser abgespült“ passt idiomatisch zu einem Gefäß und bildet die Handlung konkret ab.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die verbindliche Gesetzessprache wird mit „muss ... werden“ wiedergegeben; die knappe Parallelstruktur des hebräischen Verses bleibt erhalten.
