source:
  edition: WLC
  text: וְ/כִֽי יָרֹ֛ק הַ/זָּ֖ב בַּ/טָּה֑וֹר וְ/כִבֶּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/008.yaml
  text: And if the man with the discharge spits on a clean person[a], he shall wash his clothes and bathe in water[b], and he shall be unclean until the evening.
translation:
  language: de
  text: Und wenn der Mann mit dem Ausfluss einen Reinen anspuckt[a], soll dieser seine Kleider waschen und sich im Wasser waschen; er ist bis zum Abend unrein[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „auf einen Reinen“, das heißt auf jemanden, der rituell rein ist.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist rituelle Unreinheit bis zum Abend, nicht notwendig moralische Schuld.
    reason: cultural_note
lexical_decisions:
- source_word: וְכִי
  choice: Und wenn
  rationale: Gibt sowohl die anknüpfende Funktion von וְ als auch die konditionale Bedeutung von כִּי im fortlaufenden Rechtsfall wieder.
- source_word: יָרֹק
  choice: anspuckt
  rationale: Das Verb bedeutet „spucken“; mit einer Person als Ziel ist „jemanden anspucken“ im Deutschen natürlich und präzise.
- source_word: הַזָּב
  choice: der Mann mit dem Ausfluss
  rationale: Das substantivierte Partizip bezeichnet hier den männlichen Betroffenen mit einem Ausfluss und knüpft an den Kontext des Abschnitts an.
- source_word: בַּטָּהוֹר
  choice: einen Reinen
  rationale: Das substantivierte Adjektiv bezeichnet einen Menschen, der kultisch rein ist. Die knappe Form bewahrt die Struktur des Hebräischen; eine Fußnote erläutert den rituellen Sinn.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: soll dieser seine Kleider waschen
  rationale: Das ungenannte Subjekt wechselt sachlich zum angespuckten Reinen. „Dieser“ macht den Bezug im Deutschen eindeutig; כִּבֶּס bezeichnet hier das Waschen von Kleidung.
- source_word: וְרָחַץ בַּמַּיִם
  choice: und sich mit Wasser baden
  rationale: רָחַץ bezeichnet in diesem Reinigungszusammenhang die körperliche Waschung; das reflexive „sich baden“ ist idiomatisches Deutsch.
- source_word: וְטָמֵא
  choice: er ist unrein
  rationale: Bezeichnet den infolge des Kontakts eintretenden rituellen Status, nicht notwendig moralische Schuld.
- source_word: עַד הָעָרֶב
  choice: bis zum Abend
  rationale: Entspricht der wiederkehrenden levitischen Zeitformel für die Dauer ritueller Unreinheit.
theological_decisions:
- issue: Reinheitsterminologie
  choice: טָהוֹר und טָמֵא mit „rein“ und „unrein“ wiedergegeben
  alternative: „kultisch rein“ und „kultisch unrein“ im Haupttext
  rationale: Die traditionellen und verständlichen Begriffe bewahren die Terminologie des Textes. Die Fußnoten verdeutlichen, dass hier der rituelle Status gemeint ist, ohne die Übersetzung interpretierend aufzublähen.
- issue: Bezugswort der Waschhandlungen
  choice: „dieser“ bezieht die Waschhandlungen auf den angespuckten Reinen
  alternative: Das Pronomen „er“ ohne ausdrückliche Klärung
  rationale: Die maskulinen Verbformen sind formal mehrdeutig, doch Rechtslogik und Parallelen im Kapitel weisen auf die vom Ausfluss Betroffenen beziehungsweise Kontaminierten als Subjekt der Reinigung. „Dieser“ verhindert im Deutschen eine irreführende Rückbeziehung auf den Mann mit dem Ausfluss.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit der knappen Form eines Rechtssatzes. „Ausfluss“, „rein“ und „unrein“ halten die Terminologie des Kapitels konsistent; erläuterungsbedürftige rituelle Aspekte stehen in Fußnoten.
