  text: וְ/הַ/יֹּשֵׁב֙ עַֽל הַ/כְּלִ֔י אֲשֶׁר יֵשֵׁ֥ב עָלָ֖י/ו הַ/זָּ֑ב יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/006.yaml
  text: Whoever sits on the object on which the man with the discharge sat shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: de
  text: Wer sich auf den Gegenstand[a] setzt, auf dem der Mann mit dem Ausfluss gesessen hat, muss seine Kleider waschen und sich im Wasser waschen; er ist bis zum Abend unrein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Gerät“ beziehungsweise „Gefäß“; das hebräische Wort bezeichnet allgemein einen Gegenstand oder Gebrauchsartikel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיֹּשֵׁב
  choice: Wer sich … setzt
  rationale: Das substantivierte Partizip mit Artikel bezeichnet allgemein jeden, der sich darauf setzt. Die Formulierung ist in deutschem Gesetzesstil natürlich und bewahrt den generischen Sinn.
- source_word: הַכְּלִי
  choice: der Gegenstand
  rationale: כְּלִי kann ein Gefäß, Gerät, Werkzeug oder allgemein einen Gegenstand bezeichnen. Da hier etwas gemeint ist, auf dem man sitzen kann, wahrt „Gegenstand“ die Bedeutungsbreite, ohne eine bestimmte Art von Behälter vorauszusetzen.
- source_word: אֲשֶׁר יֵשֵׁב עָלָיו
  choice: auf dem … gesessen hat
  rationale: Der Relativsatz bestimmt den Gegenstand durch den vorherigen Kontakt. Das deutsche Perfekt gibt diesen zeitlichen Bezug natürlich wieder, ohne die hebräische Form unnötig nachzuahmen.
- source_word: הַזָּב
  choice: der Mann mit dem Ausfluss
  rationale: Das substantivierte Partizip bezeichnet in diesem Abschnitt einen männlichen Menschen mit einem körperlichen, im Kontext genitalen Ausfluss. „Der Mann mit dem Ausfluss“ macht Geschlecht und Zustand klar, ohne eine Diagnose hinzuzufügen.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: muss seine Kleider waschen
  rationale: כִּבֵּס bezeichnet gewöhnlich das Waschen von Textilien. „Muss“ gibt die verpflichtende Rechtsanweisung in modernem Deutsch klarer wieder als das heute missverständliche futurische „wird“.
- source_word: וְרָחַץ בַּמַּיִם
  choice: und sich mit Wasser baden
  rationale: רָחַץ bezeichnet hier die Waschung des Körpers. „Sich mit Wasser baden“ hält den Bezug auf ein körperliches Bad fest und gibt בַּמַּיִם ausdrücklich wieder.
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: er ist bis zum Abend unrein
  rationale: Die Aussage bezeichnet den daraus folgenden Reinheitsstatus und dessen zeitliche Grenze. Die deutsche Zustandsformulierung ist knapp und natürlich.
theological_decisions:
- issue: Art der Unreinheit
  choice: „unrein“ ohne moralischen Zusatz
  alternative: „kultisch unrein“, „verunreinigt“
  rationale: Der Zusammenhang behandelt den levitischen Reinheitsstatus und behauptet nicht notwendig moralische Schuld. „Unrein“ übersetzt den Status direkt; „kultisch“ wäre eine erklärende Ergänzung, „verunreinigt“ könnte den Sinn verstärken.
- issue: Geschlecht des von הַזָּב bezeichneten Menschen
  choice: „der Mann mit dem Ausfluss“; anschließend männlicher Singular
  alternative: „die Person mit dem Ausfluss“ mit geschlechtsneutralem Bezug
  rationale: Der vorliegende Abschnitt handelt ausdrücklich von einem männlichen Ausflusspatienten, und die hebräischen Formen stehen im maskulinen Singular. Die Übersetzung bewahrt diese konkrete Referenz.
translation_notes:
  register: Moderner, würdiger Gesetzesstil mit klarer Verpflichtungsform. Der Semikolon trennt die vorgeschriebenen Waschungen von der anschließenden Feststellung des Reinheitsstatus. Der Fußnotenmarker steht unmittelbar bei „Gegenstand“, auf den sich die lexikalische Anmerkung bezieht.
