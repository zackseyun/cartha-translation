    rationale: רחץ במים bezeichnet in diesem Reinheitskontext eine körperliche Waschung. Modernes Deutsch verwendet hierfür natürlicher „sich im Wasser waschen“; dies vermeidet zudem die mögliche Assoziation eines Vollbads, die der hebräische Text nicht ausdrücklich fordert.
  revised_text: Wer sich auf den Gegenstand[a] setzt, auf dem der Mann mit dem Ausfluss gesessen hat, muss seine Kleider waschen und sich im Wasser waschen; er ist bis zum Abend unrein.
