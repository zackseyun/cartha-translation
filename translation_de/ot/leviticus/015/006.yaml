  source_fidelity: 'Der Entwurf gibt die Satzstruktur und den Inhalt des Hebräischen zuverlässig wieder: die Person, die auf dem zuvor vom Mann mit dem Ausfluss benutzten Gegenstand sitzt, hat die genannten Waschungen vorzunehmen und bleibt bis zum Abend unrein. „Unrein“ bewahrt den rituellen Status ohne moralische Zuspitzung. Die Wiedergabe des Relativsatzes mit „gesessen hat“ ist im Deutschen idiomatisch und im Kontext angemessen.'
  naturalness: „Sich mit Wasser baden“ ist im modernen Standarddeutsch weniger idiomatisch und kann eher ein Baden als die hier gemeinte körperliche Waschung nahelegen. „Sich im Wasser waschen“ ist natürlich, gibt בַּמַּיִם angemessen wieder und lässt offen, wie genau die Waschung erfolgt.
  terminology: „Gegenstand“ ist als weiter Ausdruck für כְּלִי vertretbar; die Fußnote sichert die möglichen engeren Bedeutungen „Gerät“ und „Gefäß“. „Mann mit dem Ausfluss“, „Kleider“ und „unrein“ sind kontextgerecht und terminologisch konsistent.
