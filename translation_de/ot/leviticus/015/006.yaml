- from: Wer sich auf den Gegenstand[a] setzt, auf dem der Mann mit dem Ausfluss gesessen hat, muss seine Kleider waschen und sich mit Wasser baden; er ist bis zum Abend unrein.
  to: Wer sich auf den Gegenstand[a] setzt, auf dem der Mann mit dem Ausfluss gesessen hat, muss seine Kleider waschen und sich im Wasser waschen; er ist bis zum Abend unrein.
  rationale: Eine begrenzte sprachliche Korrektur ersetzt das weniger natürliche „sich mit Wasser baden“ durch „sich im Wasser waschen“. Der übrige Text und der Fußnotenanker bleiben unverändert, da sie den hebräischen Wortlaut, den rechtlichen Registerton und die lexikalische Breite von כְּלִי angemessen wiedergeben.
