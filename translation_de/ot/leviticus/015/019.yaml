revisions:
- from: Wenn eine Frau einen Ausfluss hat und dieser Ausfluss aus ihrem Körper Blut ist,[a] befindet sie sich sieben Tage lang in ihrer menstruellen Unreinheit.[b] Jeder, der sie berührt, wird bis zum Abend unrein.
  to: Wenn eine Frau einen Ausfluss hat und es sich dabei um Blut aus ihrem Körper handelt,[a] soll sie sieben Tage lang in ihrer menstruellen Unreinheit bleiben.[b] Jeder, der sie berührt, wird bis zum Abend unrein.
  rationale: Die Revision ersetzt die unidiomatische Konstruktion durch einen natürlichen deutschen Satz, bewahrt aber die Verbindung von Ausfluss und Blut. Sie gibt den normativen Charakter der Vorschrift wieder und schärft die Fußnote zur wörtlichen, jedoch im Deutschen nicht gleichermaßen natürlichen Formulierung „in ihrem Fleisch“.
