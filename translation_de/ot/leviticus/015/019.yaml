  source_fidelity: 'Die Übersetzung gibt die zentralen Begriffe zutreffend wieder: זוב als „Ausfluss“, דם als „Blut“, נדה als menstruell bedingten rituellen Unreinheitsstatus und טמא als „unrein“. „Aus ihrem Körper“ ist als kontextuelle Deutung von בִּבְשָׂרָהּ vertretbar, sollte aber durch eine präzisere Fußnote als nicht wörtliche Wiedergabe ausgewiesen werden. Die rechtliche Imperfektform bei תִּהְיֶה wird besser mit „soll ... bleiben“ wiedergegeben.'
