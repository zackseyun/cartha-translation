  variant: modern standard German
source:
  edition: WLC
  text: וְ/אִשָּׁה֙ כִּֽי תִהְיֶ֣ה זָבָ֔ה דָּ֛ם יִהְיֶ֥ה זֹבָ֖/הּ בִּ/בְשָׂרָ֑/הּ שִׁבְעַ֤ת יָמִים֙ תִּהְיֶ֣ה בְ/נִדָּתָ֔/הּ וְ/כָל הַ/נֹּגֵ֥עַ בָּ֖/הּ יִטְמָ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/019.yaml
  text: When a woman has a discharge[a], and her discharge in her body is blood, she shall remain in her menstrual impurity seven days[b], and everyone who touches her shall be unclean until evening.
translation:
  language: de
  text: Wenn eine Frau einen Ausfluss hat und es sich dabei um Blut aus ihrem Körper handelt,[a] soll sie sieben Tage lang in ihrer menstruellen Unreinheit bleiben.[b] Jeder, der sie berührt, wird bis zum Abend unrein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in ihrem Fleisch“. „Fleisch“ kann hier den Körper bezeichnen; „aus ihrem Körper“ gibt den Zusammenhang des Blutflusses wieder.'
    reason: lexical_alternative
  - marker: b
    text: „Menstruelle Unreinheit“ bezeichnet hier einen rituellen Status nach dem Gesetz in Levitikus, nicht notwendigerweise eine moralische Verfehlung.
    reason: cultural_note
lexical_decisions:
- source_word: זָבָה / זֹבָהּ
  choice: einen Ausfluss hat / dieser Ausfluss
  rationale: Das Verb זוּב bezeichnet hier einen körperlichen Ausfluss. „Ausfluss“ ist im modernen Deutschen sachlich und erhält die Wortverbindung zwischen Partizip und Substantiv.
- source_word: דָּם
  choice: Blut
  rationale: Direkte Wiedergabe der Art des Ausflusses.
- source_word: בִּבְשָׂרָהּ
  choice: aus ihrem Körper
  rationale: בשר bezeichnet hier den Körper beziehungsweise das Fleisch. „Aus ihrem Körper“ gibt im Deutschen die gemeinte Herkunft des Ausflusses natürlich wieder; die örtlich wörtlichere Formulierung mit „in“ wird in einer Fußnote kenntlich gemacht.
- source_word: שִׁבְעַת יָמִים
  choice: sieben Tage lang
  rationale: Direkte und idiomatische Wiedergabe der Zeitspanne.
- source_word: בְנִדָּתָהּ
  choice: in ihrer menstruellen Unreinheit
  rationale: נִדָּה bezeichnet in diesem Reinheitsgesetz den mit der Menstruation verbundenen rituellen Status, nicht bloß den biologischen Vorgang.
- source_word: כָל הַנֹּגֵעַ בָּהּ
  choice: Jeder, der sie berührt
  rationale: כל mit dem Partizip bezeichnet allgemein jede Person, die sie berührt.
- source_word: יִטְמָא
  choice: wird … unrein
  rationale: טמא ist der übliche Ausdruck für rituelle Unreinheit. Die Zukunftsform passt zum rechtlichen Folgesatz und vermeidet die Deutung als moralische Verfehlung.
- source_word: עַד הָעָרֶב
  choice: bis zum Abend
  rationale: Entspricht der hebräischen Wendung einschließlich des bestimmten Artikels und ist im Deutschen natürlich.
theological_decisions:
- issue: Rituelle Unreinheit gegenüber moralischer Schuld
  choice: „menstruelle Unreinheit“ und „unrein“ als Bezeichnungen eines rituellen Status
  alternative: „Verunreinigung“, „Befleckung“ oder eine Formulierung, die moralische Schuld nahelegt
  rationale: Der Zusammenhang von Levitikus 15 regelt kultische beziehungsweise rituelle Reinheit. Der Vers erklärt die Menstruation nicht ausdrücklich zu einer moralischen Verfehlung.
- issue: Räumliche beziehungsweise herkunftsbezogene Bedeutung von בִּבְשָׂרָהּ
  choice: Im Haupttext „aus ihrem Körper“, mit wörtlicherer Alternative in der Fußnote
  alternative: „in ihrem Körper“ oder „in ihrem Fleisch“
  rationale: Die Präposition ב bedeutet formal „in/an“, während der Zusammenhang einen aus dem Körper austretenden Blutfluss beschreibt. Die Fußnote bewahrt die Form und mögliche Nuance des Hebräischen.
translation_notes:
  register: Modernes, sachliches und würdevolles Standarddeutsch. Die Formulierung bleibt für ein breites Publikum verständlich und bewahrt zugleich den rechtlich-rituellen Charakter des Abschnitts.
