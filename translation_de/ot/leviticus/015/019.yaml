  terminology: „Menstruelle Unreinheit“ und „unrein“ sind für den rituellen Status angemessen und vermeiden eine moralische Wertung. Die Erläuterung in Fußnote b ist ausgewogen. Die Fußnote zu בשר sollte die wörtliche Form deutlicher benennen, statt „in ihrem Körper“ als gleichrangige wörtliche Alternative auszugeben.
