source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/001.yaml
  text: Then Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: de
  text: 'Jahwe[a] sprach zu Mose und zu Aaron:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Dann redete
  rationale: Das Wayyiqtol führt die Erzählung weiter. „Dann redete“ gibt sowohl die Abfolge als auch das Verb דבר wieder und vermeidet eine unnötige Doppelung mit לֵאמֹר.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: zu Mose und zu Aaron
  rationale: Die Wiederholung der Präposition אֶל wird beibehalten; die Namen folgen ihrer geläufigen deutschen Form.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Die hebräische Formel leitet die unmittelbar folgende direkte Rede ein. Im natürlichen modernen Deutsch erfüllt der Doppelpunkt diese Funktion besser als das schwerfällige „und sprach“ oder „indem er sagte“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als Namen; die traditionelle Wiedergabe wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt gibt die einleitende Formel לֵאמֹר idiomatisch wieder und zeigt an, dass die Rede im folgenden Vers beginnt.
