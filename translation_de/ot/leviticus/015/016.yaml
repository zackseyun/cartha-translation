source:
  edition: WLC
  text: וְ/אִ֕ישׁ כִּֽי תֵצֵ֥א מִמֶּ֖/נּוּ שִׁכְבַת זָ֑רַע וְ/רָחַ֥ץ בַּ/מַּ֛יִם אֶת כָּל בְּשָׂר֖/וֹ וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/016.yaml
  text: And if a man has an emission of semen[b][a], he shall wash all his flesh in water and be unclean until the evening.
translation:
  language: de
  text: Wenn einem Mann Samenflüssigkeit austritt[a], soll er seinen ganzen Körper mit Wasser waschen; er ist bis zum Abend unrein[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Ausfluss von Samen“; auch: „Samenerguss“.'
    reason: lexical_alternative
  - marker: b
    text: „Unrein“ bezeichnet hier den rituellen Status nach den levitischen Reinheitsvorschriften, nicht notwendigerweise moralische Schuld.
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ
  choice: bei einem Mann
  rationale: Das Substantiv bezeichnet hier aufgrund des ausdrücklich männlichen körperlichen Vorgangs einen Mann, nicht allgemein einen Menschen.
- source_word: כִּי
  choice: wenn
  rationale: In dieser kasuistischen Rechtsbestimmung leitet כִּי den eintretenden Fall ein; deutsches „wenn“ gibt dies natürlich wieder.
- source_word: תֵצֵא מִמֶּנּוּ
  choice: bei ihm … austritt
  rationale: Die hebräische Wendung bedeutet wörtlich „aus ihm herausgeht“. „Austritt“ ist im Deutschen idiomatisch und bewahrt den Ereignischarakter.
- source_word: שִׁכְבַת זָרַע
  choice: Samenflüssigkeit
  rationale: Die Konstruktverbindung bezeichnet in diesem Zusammenhang eine Absonderung von Samen. „Samenflüssigkeit“ ist modern, eindeutig und weniger missverständlich als das alleinstehende „Samen“.
- source_word: וְרָחַץ
  choice: soll … waschen
  rationale: Das Verb bezeichnet das Waschen oder Baden; in der gesetzlichen Abfolge drückt es die vorgeschriebene Handlung aus.
- source_word: בַּמַּיִם
  choice: mit Wasser
  rationale: Die Präposition kann hier instrumental verstanden werden. „Mit Wasser waschen“ ist natürliches Deutsch und gibt das verwendete Reinigungsmittel klar an.
- source_word: אֶת כָּל בְּשָׂרוֹ
  choice: seinen ganzen Körper
  rationale: Wörtlich steht „sein ganzes Fleisch“; gemeint ist der gesamte Körper. Die deutsche Wiedergabe vermeidet eine unnatürliche oder missverständliche Formulierung.
- source_word: וְטָמֵא
  choice: und ist … unrein
  rationale: Die koordinierte Verbform bezeichnet den anschließenden Zustand. „Unrein“ bewahrt den in den Reinheitsbestimmungen üblichen Schlüsselbegriff.
- source_word: עַד הָעָרֶב
  choice: bis zum Abend
  rationale: Die Formulierung entspricht dem hebräischen Ausdruck mit Artikel und ist im Deutschen idiomatisch.
theological_decisions:
- issue: Bedeutung von טָמֵא innerhalb der levitischen Reinheitsvorschriften
  choice: unrein, mit Fußnote als ritueller Status erläutert
  alternative: moralisch unrein; kultisch verunreinigt
  rationale: Der unmittelbare Zusammenhang behandelt körperliche Absonderungen und den dadurch entstehenden Status nach den Reinheitsvorschriften. Der Haupttext behält den knappen traditionellen Begriff „unrein“ bei; die Fußnote verhindert, dass daraus ohne Textgrund moralische Schuld abgeleitet wird.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Gesetzesstil. Die konkrete männliche Referenz bleibt erhalten. Hebräische Körperidiomatik wird natürlich als „ganzer Körper“ wiedergegeben; der theologisch wichtige Begriff „unrein“ bleibt im Haupttext stehen und wird knapp erläutert.
