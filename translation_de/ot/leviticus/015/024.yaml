  text: וְ/אִ֡ם שָׁכֹב֩ יִשְׁכַּ֨ב אִ֜ישׁ אֹתָ֗/הּ וּ/תְהִ֤י נִדָּתָ/הּ֙ עָלָ֔י/ו וְ/טָמֵ֖א שִׁבְעַ֣ת יָמִ֑ים וְ/כָל הַ/מִּשְׁכָּ֛ב אֲשֶׁר יִשְׁכַּ֥ב עָלָ֖י/ו יִטְמָֽא־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/024.yaml
  text: If a man indeed lies with her[a], and her menstrual impurity comes upon him, he shall be unclean seven days, and every bed on which he lies shall be unclean.
translation:
  language: de
  text: Wenn ein Mann tatsächlich mit ihr schläft[a] und ihre menstruelle Unreinheit auf ihn kommt, ist er sieben Tage unrein; und jedes Bett, auf dem er liegt, wird unrein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wenn ein Mann tatsächlich mit ihr liegt“; gemeint ist Geschlechtsverkehr.'
    reason: Die Fußnote erläutert die hebräische Verstärkung durch Infinitivus absolutus und die idiomatische Bedeutung von „mit ihr liegen“, ohne den Haupttext unnötig klinisch zu formulieren.
lexical_decisions:
- source_word: שָׁכֹב יִשְׁכַּב
  choice: tatsächlich mit ihr schläft
  rationale: Die Verbindung aus Infinitivus absolutus und finiter Verbform verstärkt den Verbalgedanken. „Tatsächlich“ gibt diese Hervorhebung wieder; „mit ihr schlafen“ ist im Deutschen eine natürliche und eindeutige Bezeichnung für Geschlechtsverkehr.
- source_word: אִישׁ
  choice: ein Mann
  rationale: Das singularische maskuline Substantiv bezeichnet hier einen erwachsenen Mann und wird geschlechtsgenau wiedergegeben.
- source_word: נִדָּתָהּ
  choice: ihre menstruelle Unreinheit
  rationale: נִדָּה bezeichnet in diesem Reinheitsgesetz nicht nur die biologische Menstruation, sondern den damit verbundenen kultischen Unreinheitszustand.
- source_word: וּתְהִי ... עָלָיו
  choice: auf ihn kommt
  rationale: Die Formulierung bewahrt das hebräische Bild „auf ihm sein/werden“ und drückt im Deutschen verständlich aus, dass der Unreinheitszustand nun auch ihn betrifft.
- source_word: וְטָמֵא
  choice: ist er ... unrein
  rationale: Im Bedingungssatz bezeichnet die Form die eintretende Rechtsfolge. Das deutsche Präsens ist für allgemeingültige Gesetzesbestimmungen natürlich.
- source_word: שִׁבְעַת יָמִים
  choice: sieben Tage
  rationale: Direkte und idiomatische Wiedergabe der Zeitangabe.
- source_word: הַמִּשְׁכָּב
  choice: Bett
  rationale: Das Wort bezeichnet eine Liegestätte; „Bett“ ist hier die natürliche, kontextgerechte deutsche Entsprechung.
- source_word: אֲשֶׁר יִשְׁכַּב עָלָיו
  choice: auf dem er liegt
  rationale: Die Relativkonstruktion wird eng am Hebräischen und zugleich idiomatisch wiedergegeben.
- source_word: יִטְמָא
  choice: wird unrein
  rationale: Die Imperfektform beschreibt als weitere Rechtsfolge, dass die Liegestätte in den Zustand kultischer Unreinheit gerät.
theological_decisions:
- issue: Rituelle Unreinheit von moralischer Schuld unterscheiden
  choice: „unrein“ und „menstruelle Unreinheit“ als Begriffe des kultischen Reinheitsrechts
  alternative: „befleckt“, „verunreinigt“ oder eine ausdrücklich moralische Deutung
  rationale: Der Vers regelt einen rituellen Reinheitszustand und behauptet für sich genommen keine persönliche moralische Schuld. Die gewählten Begriffe lassen diese Unterscheidung bestehen.
- issue: Bedeutung von „ihre menstruelle Unreinheit kommt auf ihn“
  choice: Das Bild der hebräischen Formulierung bewahren
  alternative: Explizit von einer „Übertragung“ der Unreinheit sprechen
  rationale: „Auf ihn kommt“ gibt die Aussage verständlich wieder, ohne einen über den Wortlaut hinausgehenden Mechanismus der Übertragung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz folgt der juristischen Bedingungs- und Folgestruktur des Hebräischen, vermeidet aber unnötig altertümliche Formulierungen. Der Fußnotenmarker [a] steht unmittelbar bei der erläuterten Wendung.
