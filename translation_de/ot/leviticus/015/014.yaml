id: LEV.15.14
reference: Leviticus 15:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/בַ/יּ֣וֹם הַ/שְּׁמִינִ֗י יִֽקַּֽח ל/וֹ֙ שְׁתֵּ֣י תֹרִ֔ים א֥וֹ שְׁנֵ֖י בְּנֵ֣י יוֹנָ֑ה וּ/בָ֣א לִ/פְנֵ֣י יְהוָ֗ה אֶל פֶּ֨תַח֙ אֹ֣הֶל מוֹעֵ֔ד וּ/נְתָנָ֖/ם אֶל הַ/כֹּהֵֽן־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/014.yaml
  text: And on the eighth day he shall take for himself two turtledoves or two young pigeons[a], and he shall come before Yahweh at the entrance of the tent of meeting and give them to the priest.
translation:
  language: de
  text: Am achten Tag soll er für sich zwei Turteltauben oder zwei junge Tauben nehmen. Dann soll er vor Jahwe[a] an den Eingang des Zeltes der Begegnung kommen und sie dem Priester geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben. „Jahwe“ ist eine gebräuchliche Rekonstruktion der Aussprache.'
    reason: Der Konsonantentext überliefert den Gottesnamen JHWH, während seine ursprüngliche Aussprache nicht mit letzter Sicherheit feststeht.
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁמִינִי
  choice: Am achten Tag
  rationale: Die Zeitangabe führt die gesetzliche Handlungsfolge fort; im Deutschen ist ein zusätzliches „Und“ nicht nötig.
- source_word: יִקַּח לוֹ
  choice: soll er für sich … nehmen
  rationale: Das „soll“ gibt die rechtliche Anweisung wieder; „für sich“ bewahrt den Dativ לוֹ und bezeichnet die persönliche Beschaffung durch den Betroffenen.
- source_word: שְׁתֵּי תֹרִים
  choice: zwei Turteltauben
  rationale: תֹרִים bezeichnet Turteltauben, die als Opfertiere verwendet wurden.
- source_word: אוֹ שְׁנֵי בְּנֵי יוֹנָה
  choice: oder zwei junge Tauben
  rationale: Die hebräische Wendung, wörtlich „Söhne einer Taube“, ist eine übliche Bezeichnung für junge Tauben.
- source_word: וּבָא לִפְנֵי יְהוָה אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: Dann soll er vor Jahwe an den Eingang des Zeltes der Begegnung kommen
  rationale: „Vor Jahwe“ entspricht לִפְנֵי יְהוָה; „an den Eingang“ wahrt die durch אֶל ausgedrückte Zielrichtung. „Zelt der Begegnung“ gibt אֹהֶל מוֹעֵד transparent und in natürlichem Deutsch wieder.
- source_word: וּנְתָנָם אֶל הַכֹּהֵן
  choice: und sie dem Priester geben
  rationale: נתן bezeichnet hier die unmittelbare Übergabe der beiden Vögel an den Priester.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen JHWH. „Jahwe“ gibt ihn als Eigennamen wieder; die traditionelle Wiedergabe wird in der Fußnote genannt, ohne die Aussprachefrage als völlig sicher darzustellen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die längere hebräische Satzfolge wurde zur besseren Verständlichkeit in zwei Sätze gegliedert; „Dann“ hält den Verfahrenszusammenhang aufrecht.
