source:
  edition: WLC
  text: וְ/אִ֕ישׁ אֲשֶׁ֥ר יִגַּ֖ע בְּ/מִשְׁכָּב֑/וֹ יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/005.yaml
  text: And a man who touches his bed shall wash his clothes and bathe in water[b][a], and he shall be unclean until the evening.
translation:
  language: de
  text: Und ein Mann, der sein Lager[a] berührt, soll seine Kleidung waschen und sich im Wasser waschen und bis zum Abend unrein sein[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sein Bett“ beziehungsweise „seine Liegestätte“. Das hebräische Wort kann allgemein den Ort oder die Unterlage bezeichnen, auf der er lag.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: unrein im Sinne der kultischen Reinheitsvorschriften.'
    reason: cultural_note
lexical_decisions:
- source_word: וְ/אִישׁ
  choice: Und ein Mann
  rationale: אִישׁ bezeichnet hier im Singular einen Mann. Die maskuline Form wird im gesetzlichen Zusammenhang beibehalten.
- source_word: יִגַּע
  choice: berührt
  rationale: נגע bedeutet gewöhnlich „berühren“ und bezeichnet hier den Kontakt, der kultische Unreinheit überträgt.
- source_word: בְּ/מִשְׁכָּב/וֹ
  choice: sein Lager
  rationale: מִשְׁכָּב bezeichnet den Ort oder die Unterlage des Liegens. „Lager“ bewahrt den weiteren Bedeutungsumfang besser als das engere „Bett“.
- source_word: יְכַבֵּס בְּגָדָי/ו
  choice: soll seine Kleidung waschen
  rationale: כִּבֵּס bezeichnet hier ausdrücklich das Waschen von Kleidung; „soll“ gibt die rechtliche Anweisung in natürlichem modernem Deutsch wieder.
- source_word: וְ/רָחַץ בַּ/מַּיִם
  choice: und sich mit Wasser baden
  rationale: רחץ meint in diesem Zusammenhang das Waschen des Körpers. „Mit Wasser“ ist eine mögliche und natürliche Wiedergabe der Präposition בְּ.
- source_word: וְ/טָמֵא
  choice: er ist … unrein
  rationale: טָמֵא bezeichnet hier einen kultischen Status. Das deutsche Präsens entspricht der hebräischen Statusaussage und vermeidet moralische Zusatzbedeutungen.
- source_word: עַד הָ/עָרֶב
  choice: bis zum Abend
  rationale: Die Wendung gibt die zeitliche Dauer der Unreinheit präzise und idiomatisch wieder.
theological_decisions:
- issue: Bedeutung von „unrein“ im Reinheitsrecht
  choice: „unrein“ als kultischer Status
  alternative: „kultisch unrein“ im Haupttext
  rationale: Der Zusammenhang betrifft den durch Berührung eintretenden Status nach den Reinheitsvorschriften, nicht moralische Schuld. Der Haupttext bewahrt die knappe hebräische Kategorie; eine Fußnote klärt den kulturell-rechtlichen Sinn.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Rechtssprache. „Lager“ erhält die Bedeutungsbreite des Hebräischen; „soll“ formuliert die vorgeschriebene Handlung natürlich. Die Fußnotenmarker stehen jeweils unmittelbar bei dem erklärten Ausdruck.
