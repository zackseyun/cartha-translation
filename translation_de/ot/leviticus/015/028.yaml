base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/028.yaml
  text: But if she is cleansed from her discharge[a], then she shall count seven days for herself, and after that she shall be clean.
translation:
  language: de
  text: Wenn sie aber von ihrem Ausfluss rein geworden ist, soll sie für sich sieben Tage zählen; danach wird sie rein sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn sie von ihrem Ausfluss frei geworden ist … danach wird sie rein sein.“ Im Hebräischen steht in beiden Satzteilen derselbe Wortstamm: zunächst im Zusammenhang mit dem Ende des Ausflusses, dann für den daraus folgenden kultischen Reinheitsstatus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Wenn sie aber
  rationale: Die Verbindung aus Konjunktion und Bedingungspartikel leitet einen bedingten Gegensatz zum vorherigen Fall ein. Die deutsche Nachstellung von „aber“ ist natürlich und bewahrt diese Funktion.
- source_word: טָהֲרָה מִזּוֹבָהּ
  choice: von ihrem Ausfluss rein geworden ist
  rationale: Das Qal von טהר bezeichnet hier den Übergang aus dem durch den Ausfluss verursachten Zustand; מן markiert die Trennung davon. „Ausfluss“ ist in diesem körperlich-kultischen Zusammenhang klar und sachlich. Die Formulierung bewahrt zugleich die Wiederholung desselben hebräischen Stammes am Versende.
- source_word: וְסָפְרָה לָּהּ שִׁבְעַת יָמִים
  choice: soll sie für sich sieben Tage zählen
  rationale: Die Verbfolge führt die vorgeschriebene Handlung weiter. „Soll“ gibt den rechtlich-anweisenden Charakter wieder; „für sich“ erhält den Dativ לָהּ, und „sieben Tage“ entspricht der Zahlwortverbindung.
- source_word: וְאַחַר
  choice: danach
  rationale: Bezeichnet knapp und natürlich die nächste Stufe nach Ablauf der gezählten sieben Tage.
- source_word: תִּטְהָר
  choice: ist sie rein
  rationale: Das erneute טהר bezeichnet hier den erreichten kultischen Status. Das deutsche Präsens ist in einer Rechtsbestimmung idiomatisch und drückt die nach Ablauf der Frist eintretende Folge aus.
theological_decisions:
- issue: Terminologie kultischer Reinheit
  choice: „rein“ im Sinn des kultisch-rituellen Status
  alternative: „geläutert“ oder moralisch „rein“
  rationale: Levitikus 15 behandelt den kultischen Status im Zusammenhang mit Körperausflüssen, nicht moralische Schuld. „Rein“ bewahrt die gesetzliche Kategorie, ohne eine ethische Verurteilung einzutragen.
- issue: Doppelte Verwendung von טהר
  choice: Den Stamm in beiden Satzteilen mit „rein“ wiedergeben und die unterschiedliche Funktion in einer Fußnote erläutern
  alternative: Im ersten Satzteil eindeutig „der Ausfluss hat aufgehört“ und im zweiten „sie ist rein“
  rationale: Der hebräische Text verwendet denselben Stamm zunächst für das Reinwerden vom Ausfluss und anschließend für den daraus folgenden kultischen Status. Die Übersetzung bewahrt diese sprachliche Spannung, ohne beide Aussagen gleichzusetzen.
translation_notes:
  register: Modernes, sachliches Standarddeutsch mit würdigem Ton. Die gesetzliche Abfolge bleibt klar; der kultische Fachbegriff „rein“ wird beibehalten und nicht moralisiert.
