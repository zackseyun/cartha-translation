base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/004.yaml
  text: Every bed on which the man with the discharge lies shall be unclean[a], and every vessel on which he sits shall be unclean.
translation:
  language: de
  text: Jedes Bett, auf dem der Mann mit dem Ausfluss liegt, wird unrein; und jeder Gegenstand[a], auf dem er sitzt, wird unrein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann allgemein einen Gegenstand, ein Gerät, ein Utensil oder ein Gefäß bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּשְׁכָּב
  choice: Lager
  rationale: מִשְׁכָּב bezeichnet einen Ort oder eine Unterlage zum Liegen. „Lager“ gibt den Begriff natürlicher und etwas weiter wieder als das ausschließlich als Möbelstück verstandene „Bett“.
- source_word: הַזָּב
  choice: der Mann mit dem Ausfluss
  rationale: Das substantivierte maskuline Partizip bezeichnet im Zusammenhang einen Mann mit einem körperlichen Ausfluss. Die Wiedergabe wahrt Geschlecht und medizinisch-kultischen Kontext, ohne eine Diagnose hinzuzufügen.
- source_word: יִשְׁכַּב עָלָיו
  choice: auf dem ... liegt
  rationale: Die relative Konstruktion mit עַל wird in natürlichem Deutsch als „auf dem ... liegt“ wiedergegeben; das Präsens formuliert den allgemeinen Fall des Gesetzestextes.
- source_word: יִטְמָא
  choice: wird unrein
  rationale: Das Qal von טמא bezeichnet hier die eintretende kultische Unreinheit. „Wird unrein“ macht die gesetzliche Folge deutlich, ohne moralische Schuld anzudeuten.
- source_word: הַכְּלִי
  choice: Gegenstand
  rationale: כְּלִי ist ein weiter Begriff für Gegenstand, Gerät, Utensil oder Gefäß. Da man auf dem Gemeinten sitzen kann, ist „Gegenstand“ im Deutschen sachlich passender als das enger verstandene „Gefäß“.
- source_word: יֵשֵׁב עָלָיו
  choice: auf dem er sitzt
  rationale: ישׁב mit עַל bedeutet hier „auf etwas sitzen“. Die generische Präsensform entspricht dem Stil einer allgemeinen Rechtsbestimmung.
theological_decisions:
- issue: Art der Unreinheit
  choice: unrein
  alternative: kultisch unrein; verunreinigt
  rationale: Im Zusammenhang geht es um den levitischen Reinheitsstatus, nicht notwendig um moralische Schuld. „Unrein“ bewahrt den Fachbegriff, ohne den im Hebräischen fehlenden Zusatz „kultisch“ in den Haupttext einzufügen.
- issue: Geschlecht der betroffenen Person
  choice: der Mann mit dem Ausfluss / er
  alternative: die Person mit dem Ausfluss
  rationale: Die hebräischen Formen sind maskulin Singular, und der unmittelbare Zusammenhang behandelt den Ausfluss eines Mannes. Die männliche Referenz wird daher ausdrücklich beibehalten.
translation_notes:
  register: Moderner, würdiger Gesetzesstil mit klarer Satzstruktur. „Lager“ bewahrt die Breite des hebräischen Ausdrucks, während „Gegenstand“ im Sitzkontext verständlicher ist als „Gefäß“. Das wiederholte „wird unrein“ erhält die Parallelität des hebräischen Satzes.
