source:
  edition: WLC
  text: וְ/הַ/דָּוָה֙ בְּ/נִדָּתָ֔/הּ וְ/הַ/זָּב֙ אֶת זוֹב֔/וֹ לַ/זָּכָ֖ר וְ/לַ/נְּקֵבָ֑ה וּ/לְ/אִ֕ישׁ אֲשֶׁ֥ר יִשְׁכַּ֖ב עִם טְמֵאָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/033.yaml
  text: and for the woman who is sick in her menstrual impurity, and for the one who has a discharge, whether male or female, and for a man who lies with an unclean woman.
translation:
  language: de
  text: und für die Frau während ihrer Monatsblutung[a], für jeden, der einen Ausfluss hat, ob männlich oder weiblich, und für einen Mann, der mit einer unreinen Frau[b] schläft.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „die Frau in ihrer menstruellen Unreinheit“; der hebräische Ausdruck bezeichnet hier die Frau in dem durch die Monatsblutung bedingten rituellen Zustand.'
    reason: lexical_alternative
  - marker: b
    text: „Unrein“ bezeichnet hier rituelle Unreinheit nach den Reinheitsvorschriften des Levitikus, nicht moralische Unreinheit.
    reason: cultural_note
lexical_decisions:
- source_word: הַדָּוָה בְּנִדָּתָהּ
  choice: die Frau während ihrer Monatsblutung
  rationale: Die Wortgruppe bezeichnet hier die Frau in ihrem menstruationsbedingten Absonderungs- bzw. Unreinheitszustand. Die natürliche deutsche Wiedergabe vermeidet die missverständliche Aussage, sie sei krank, ohne den konkreten Bezug zur Menstruation zu verlieren.
- source_word: הַזָּב אֶת זוֹבוֹ
  choice: jeder, der einen Ausfluss hat
  rationale: Die hebräische Verbindung aus Partizip und stammverwandtem Substantiv wird im Deutschen idiomatisch verbal wiedergegeben. „Jeder“ dient als allgemeine Kategorienbezeichnung; der folgende Ausdruck schließt männliche und weibliche Personen ein.
- source_word: לַזָּכָר וְלַנְּקֵבָה
  choice: ob männlich oder weiblich
  rationale: Die Formulierung bestimmt den Geltungsbereich der zuvor genannten Ausflussbestimmungen und gibt die beiden Geschlechterkategorien knapp und natürlich wieder.
- source_word: אֲשֶׁר יִשְׁכַּב עִם
  choice: der mit … schläft
  rationale: Die deutsche Wendung bewahrt den euphemistischen Charakter des hebräischen Ausdrucks, der in diesem Zusammenhang Geschlechtsverkehr meint.
- source_word: טְמֵאָה
  choice: einer unreinen Frau
  rationale: Das feminine Adjektiv bezeichnet eine Frau im Zustand kultischer Unreinheit. „Unrein“ wahrt die feste Terminologie der Reinheitsvorschriften.
theological_decisions:
- issue: Rituelle statt moralische Unreinheit
  choice: „unrein“ als kultisch-rechtlichen Begriff beibehalten und durch eine Fußnote erläutern
  alternative: „moralisch befleckt“, „schmutzig“ oder eine andere ethisch wertende Formulierung
  rationale: Der Zusammenhang behandelt den rituellen Status nach den levitischen Reinheitsvorschriften und enthält an dieser Stelle kein Urteil über den moralischen Wert der Frau.
- issue: Bedeutung von הַדָּוָה בְּנִדָּתָהּ
  choice: „die Frau während ihrer Monatsblutung“
  alternative: „die kranke Frau in ihrer menstruellen Unreinheit“
  rationale: Im Kontext fungiert הַדָּוָה als Bezeichnung der menstruierenden Frau. Eine ausdrückliche Krankheitsdiagnose wäre im modernen Deutschen missverständlich und stärker, als der Kontext verlangt; eine Fußnote hält die formnähere Alternative fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzform bleibt als abschließende Fortsetzung der vorangehenden Zusammenfassung erhalten. Kultische Fachsprache wird bewahrt, aber missverständliche medizinische oder moralische Wertungen werden vermieden.
