id: LEV.15.25
reference: Leviticus 15:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אִשָּׁ֡ה כִּֽי יָזוּב֩ ז֨וֹב דָּמָ֜/הּ יָמִ֣ים רַבִּ֗ים בְּ/לֹא֙ עֶת נִדָּתָ֔/הּ א֥וֹ כִֽי תָז֖וּב עַל נִדָּתָ֑/הּ כָּל יְמֵ֞י ז֣וֹב טֻמְאָתָ֗/הּ כִּ/ימֵ֧י נִדָּתָ֛/הּ תִּהְיֶ֖ה טְמֵאָ֥ה הִֽוא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/025.yaml
  text: If a woman has a discharge of blood for many days[a], not at the time of her menstrual impurity, or if she has a discharge beyond her menstrual impurity, all the days of her unclean discharge she shall be unclean[b], as in the days of her menstrual impurity.
translation:
  language: de
  text: Wenn eine Frau viele Tage lang einen Blutfluss hat, außerhalb der Zeit ihrer Monatsunreinheit,[a] oder wenn ihr Blutfluss über ihre Monatsunreinheit hinaus anhält,[b] dann ist sie an allen Tagen ihres unreinen Ausflusses unrein, wie in den Tagen ihrer Monatsunreinheit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nicht zur Zeit ihrer Monatsunreinheit“. Der hebräische Ausdruck umfasst nicht nur die Menstruationsblutung, sondern auch den damit verbundenen Zustand ritueller Unreinheit.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zusätzlich zu ihrer Monatsunreinheit“, das heißt über die gewöhnliche Menstruationszeit hinaus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָזוּב / תָזוּב + זוֹב
  choice: einen Blutfluss haben / ihr Blutfluss hält an
  rationale: Die Verbindung aus Verb und Substantiv bezeichnet einen anhaltenden, hier ungewöhnlichen Körperfluss. „Blutfluss“ ist im Deutschen natürlich und präzise; im zweiten Satzteil gibt „hält … an“ zusammen mit „hinaus“ die zeitliche Fortdauer wieder.
- source_word: דָּמָהּ
  choice: Blutfluss
  rationale: Wörtlich steht „ihr Blut“. In Verbindung mit זוֹב ergibt sich idiomatisch „Blutfluss“.
- source_word: יָמִים רַבִּים
  choice: viele Tage lang
  rationale: Die Formulierung bewahrt die konkrete Zeitangabe und drückt die Dauer im Deutschen natürlich aus.
- source_word: בְּלֹא עֶת נִדָּתָהּ
  choice: außerhalb der Zeit ihrer Monatsunreinheit
  rationale: עֵת bezeichnet die Zeit; נִדָּה umfasst in diesem Rechtszusammenhang sowohl die Menstruation als auch den damit verbundenen rituellen Unreinheitszustand.
- source_word: נִדָּה
  choice: Monatsunreinheit
  rationale: Der Ausdruck hält die kultisch-rechtliche Bedeutung fest und bleibt zugleich für heutige Leser verständlich. Er bezeichnet nicht moralische Schuld.
- source_word: עַל נִדָּתָהּ
  choice: über ihre Monatsunreinheit hinaus
  rationale: עַל kann hier eine zeitliche Erstreckung über den gewöhnlichen Zeitraum hinaus beziehungsweise zusätzlich dazu bezeichnen. Die Übersetzung lässt diese kontextuelle Bedeutung erkennen.
- source_word: כָּל יְמֵי זֹב טֻמְאָתָהּ
  choice: an allen Tagen ihres unreinen Ausflusses
  rationale: Die Wiedergabe erhält sowohl den Ausfluss als auch dessen rituell verunreinigenden Status.
- source_word: טְמֵאָה
  choice: unrein
  rationale: „Unrein“ ist der etablierte deutsche Ausdruck für den levitischen Ritualstatus und impliziert hier keine moralische Verfehlung.
- source_word: כִּימֵי נִדָּתָהּ
  choice: wie in den Tagen ihrer Monatsunreinheit
  rationale: 'Die Formulierung bewahrt den Vergleich: Während des ungewöhnlichen Blutflusses gilt derselbe Status wie während der Monatsunreinheit.'
theological_decisions:
- issue: Rituelle Unreinheit darf nicht als moralische Schuld missverstanden werden
  choice: Die kultisch-rechtlichen Begriffe werden mit „unrein“ und „Monatsunreinheit“ wiedergegeben.
  alternative: Nur von „Menstruation“ oder „Periode“ sprechen und die rituelle Dimension unausgedrückt lassen.
  rationale: Der Vers regelt einen rituellen Status im levitischen Reinheitsrecht. Die gewählte Sprache wahrt diese Dimension, ohne Sündhaftigkeit oder persönliche Schuld zu behaupten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Monatsunreinheit“ bewahrt die levitische Ritualterminologie; „Blutfluss“ und „Ausfluss“ vermeiden zugleich unnötig technische oder beschönigende Sprache. Die Fußnoten markieren die echte Bedeutungsbreite der beiden Zeitangaben.
