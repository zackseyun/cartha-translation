source:
  edition: WLC
  text: וְ/זָרַ֨ק הַ/כֹּהֵ֤ן אֶת הַ/דָּם֙ עַל מִזְבַּ֣ח יְהוָ֔ה פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וְ/הִקְטִ֣יר הַ/חֵ֔לֶב לְ/רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/006.yaml
  text: And the priest shall throw the blood against the altar of Yahweh at the entrance of the tent of meeting[b][a], and shall burn the fat as a pleasing aroma to Yahweh.
translation:
  language: de
  text: Der Priester soll das Blut an den Altar Jahwes am Eingang des Zeltes der Begegnung sprengen[a] und das Fett als einen für Jahwe wohlgefälligen Duft[b] in Rauch aufgehen lassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Blut gegen den Altar schleudern“ beziehungsweise „an den Altar spritzen“. Das hebräische Verb bezeichnet hier das kräftige rituelle Anbringen des Blutes.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „zu einem Duft der Beruhigung“; traditionell auch „zu einem angenehmen Duft“ oder „zu einem lieblichen Geruch“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָרַק
  choice: soll … sprengen
  rationale: זָרַק bezeichnet hier das kräftige rituelle Anbringen des Blutes am Altar. Das deutsche „sprengen“ ist in diesem Opferkontext idiomatisch und meint mehr als ein leichtes Besprengen; die mögliche Vorstellung des Schleuderns oder Spritzens wird in einer Fußnote offengehalten.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Entspricht der üblichen Bedeutung von כֹּהֵן und bewahrt den bestimmten Artikel.
- source_word: הַדָּם
  choice: das Blut
  rationale: Direkte und eindeutige Wiedergabe des durch אֶת markierten Objekts.
- source_word: עַל מִזְבַּח יְהוָה
  choice: an den Altar Jahwes
  rationale: In Verbindung mit זָרַק beschreibt עַל das Anbringen des Blutes an beziehungsweise auf der Altarfläche. „An den Altar“ gibt die gerichtete Bewegung im Deutschen natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als persönlicher Gottesname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: am Eingang des Zeltes der Begegnung
  rationale: פֶּתַח bezeichnet den Eingang beziehungsweise die Öffnung; אֹהֶל מוֹעֵד wird präzise und verständlich als „Zelt der Begegnung“ wiedergegeben.
- source_word: וְהִקְטִיר
  choice: soll … in Rauch aufgehen lassen
  rationale: Die Hifil-Form von קטר bezeichnet im priesterlichen Opferwortschatz das Verbrennen auf dem Altar, wobei die Opfergabe als Rauch aufsteigt. Die Formulierung bewahrt diese kultische Nuance genauer als das allgemeinere „verbrennen“.
- source_word: הַחֵלֶב
  choice: das Fett
  rationale: Gemeint sind die für die Verbrennung auf dem Altar bestimmten Fettstücke; „das Fett“ ist die direkte, etablierte Wiedergabe.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: als einen … wohlgefälligen Duft
  rationale: Die feste Opferformel beschreibt einen Duft, der von Gott wohlgefällig angenommen wird. „Wohlgefälliger Duft“ ist würdig, verständlich und lässt die traditionelle Alternative „beruhigender Duft“ in der Fußnote offen.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition kennzeichnet Jahwe als den, dem der Opferduft gilt und wohlgefällt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung der Opferformel רֵיחַ נִיחֹחַ
  choice: für Jahwe wohlgefälliger Duft
  alternative: Jahwe beruhigender Duft; angenehmer Duft für Jahwe
  rationale: Die gewählte Fassung drückt die Annahme des Opfers aus, ohne die Formulierung auf eine bestimmte Lehre über eine Veränderung in Gott festzulegen. Die lexikalisch mögliche Nuance des Beruhigens bleibt als Alternative vermerkt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kultische Fachsprache bleibt anschaulich, ohne altertümliche Satzformen. „In Rauch aufgehen lassen“ verdeutlicht den spezifischen Opferakt; „wohlgefällig“ bewahrt den formelhaften Charakter der Wendung.
