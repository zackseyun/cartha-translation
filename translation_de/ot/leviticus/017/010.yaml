base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/010.yaml
  text: And any man from the house of Israel[a], or from the sojourner who sojourns among them, who eats any blood—I will set my face against the person who eats the blood[c][b], and I will cut him off from among his people.
translation:
  language: de
  text: 'Und jeder Mann aus dem Haus Israel oder jeder Fremde, der unter ihnen lebt,[a] der Blut irgendeiner Art isst: Ich werde mein Angesicht gegen den Menschen richten, der das Blut isst,[b] und ihn aus der Mitte seines Volkes abschneiden.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist ein ansässiger Nichtisraelit, der innerhalb der Gemeinschaft Israels lebt.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „gegen die Person, die das Blut isst“. Das hebräische Wort נֶפֶשׁ bezeichnet hier den einzelnen Menschen.'
    reason: lexical_alternative
  - marker: c
    text: Die hebräische Gerichtsformel lautet wörtlich „abschneiden“. Sie bezeichnet schweres Bundesgericht; ob damit hier Tod, Ausschluss oder eine andere Form göttlichen Gerichts gemeint ist, wird nicht näher bestimmt.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִישׁ אִישׁ
  choice: Und wenn irgendein Mann
  rationale: 'Die Verdopplung von אִישׁ hat distributive beziehungsweise verstärkende Kraft: Gemeint ist jeder einzelne Mann. Die Formulierung bleibt im gesetzlichen Eingangssatz geschlechtsgenau und klingt zugleich idiomatisch deutsch.'
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: aus dem Haus Israel
  rationale: Die bundesrechtliche Wendung wird bewahrt; „Haus Israel“ gibt den hebräischen Ausdruck genauer wieder als die Verkürzung „aus Israel“.
- source_word: וּמִן הַגֵּר הַגָּר בְּתוֹכָם
  choice: oder von den Fremden, die unter ihnen leben
  rationale: גֵּר bezeichnet hier einen Nichtisraeliten, der dauerhaft innerhalb der israelitischen Gemeinschaft lebt. Natürliches modernes Deutsch ist wichtiger als eine künstliche Nachbildung des hebräischen Wortspiels.
- source_word: אֲשֶׁר יֹאכַל כָּל דָּם
  choice: irgendwelches Blut isst
  rationale: אָכַל ist das gewöhnliche Verb „essen“. כָּל דָּם bezeichnet Blut jeder Art und wird durch „irgendwelches Blut“ umfassend wiedergegeben.
- source_word: וְנָתַתִּי פָנַי
  choice: werde ich mein Angesicht gegen ... richten
  rationale: Die anthropomorphe Gerichtsformel bleibt erkennbar erhalten und bezeichnet Gottes entschlossene Gegnerschaft.
- source_word: בַּנֶּפֶשׁ הָאֹכֶלֶת
  choice: gegen den Menschen, der ... isst
  rationale: נֶפֶשׁ bezeichnet in diesem Rechtszusammenhang die betreffende Einzelperson, nicht ausdrücklich eine vom Körper getrennte „Seele“.
- source_word: וְהִכְרַתִּי אֹתָהּ
  choice: und ihn ... ausrotten
  rationale: Das deutsche „ausrotten“ bewahrt die Schwere der Karet-Formel, ohne ihren hier nicht näher bestimmten Vollzug ausdrücklich als Hinrichtung, Ausschluss oder unmittelbares Gottesgericht festzulegen.
- source_word: מִקֶּרֶב עַמָּהּ
  choice: aus der Mitte seines Volkes
  rationale: Die räumlich-soziale Wendung מִקֶּרֶב wird formal als „aus der Mitte“ wiedergegeben. Das männliche Pronomen knüpft im Deutschen an den eingangs genannten Mann an.
theological_decisions:
- issue: Bedeutung der Straf- beziehungsweise Gerichtsformel וְהִכְרַתִּי
  choice: Die Formel mit „ausrotten“ wiedergeben und ihren genauen Vollzug offenlassen.
  alternative: „hinrichten“, „aus der Gemeinschaft ausschließen“ oder „durch göttliches Gericht beseitigen“
  rationale: Der Vers kündigt ein schweres göttliches Bundesgericht an, bestimmt an dieser Stelle jedoch nicht eindeutig, auf welche Weise es vollzogen wird. Die Übersetzung soll diese Spannung nicht auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erkennbar gesetzlichem Ton. Die traditionellen Wendungen „Haus Israel“ und „mein Angesicht gegen ... richten“ bewahren die bundesrechtliche und bildhafte Sprache des Hebräischen; erklärungsbedürftige Begriffe werden knapp in Fußnoten erläutert.
