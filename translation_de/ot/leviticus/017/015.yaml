id: LEV.17.15
reference: Leviticus 17:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/כָל נֶ֗פֶשׁ אֲשֶׁ֨ר תֹּאכַ֤ל נְבֵלָה֙ וּ/טְרֵפָ֔ה בָּ/אֶזְרָ֖ח וּ/בַ/גֵּ֑ר וְ/כִבֶּ֨ס בְּגָדָ֜י/ו וְ/רָחַ֥ץ בַּ/מַּ֛יִם וְ/טָמֵ֥א עַד הָ/עֶ֖רֶב וְ/טָהֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/015.yaml
  text: And every person who eats an animal found dead or one torn by beasts[a], whether native or sojourner, shall wash his clothes and bathe in water, and he shall be unclean until the evening[b]; then he shall be clean.
translation:
  language: de
  text: Jeder, der von einem verendeten oder von Raubtieren gerissenen Tier[a] isst, sei es ein Einheimischer oder ein ansässiger Fremder[b], soll seine Kleider waschen und sich mit Wasser waschen. Er ist bis zum Abend unrein; danach ist er rein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Aas oder Zerrissenes“; gemeint sind ein ohne ordnungsgemäße Schlachtung verendetes Tier und ein von Raubtieren gerissenes Tier.'
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Ausdruck bezeichnet einen Fremden, der dauerhaft unter den Israeliten lebt.
    reason: lexical_clarification
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: jeder
  rationale: Im Rechtstext bezeichnet נֶפֶשׁ die einzelne Person. Das substantivierte „jeder“ ist im Deutschen natürlich und schließt hier jede Person ein.
- source_word: נְבֵלָה
  choice: ein verendetes Tier
  rationale: Der Ausdruck bezeichnet den Kadaver eines Tieres, das ohne ordnungsgemäße Schlachtung gestorben ist. „Verendetes Tier“ gibt die Kategorie verständlich wieder.
- source_word: טְרֵפָה
  choice: ein von Raubtieren gerissenes Tier
  rationale: Das Wort bezeichnet ein durch Tiere gerissenes Beutetier; die Wiedergabe benennt die im Hebräischen vorausgesetzte Ursache.
- source_word: בָּאֶזְרָח
  choice: Einheimischer
  rationale: Gemeint ist ein einheimisches Mitglied der israelitischen Gesellschaft; „Einheimischer“ bildet einen klaren Gegensatz zum ansässigen Fremden.
- source_word: בַגֵּר
  choice: ansässiger Fremder
  rationale: גֵּר meint einen dauerhaft unter Israel lebenden Nichtisraeliten, nicht bloß einen Durchreisenden.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: soll seine Kleider waschen
  rationale: Die Formulierung gibt die vorgeschriebene rituelle Handlung in natürlichem, heutigem Deutsch wieder.
- source_word: וְרָחַץ בַּמַּיִם
  choice: sich mit Wasser waschen
  rationale: Das Verb bezeichnet hier die Waschung des Körpers. Diese Wiedergabe ist klar und vermeidet die mögliche moderne Engführung von „baden“.
- source_word: וְטָמֵא עַד הָעֶרֶב
  choice: Er ist bis zum Abend unrein
  rationale: „Unrein“ bewahrt die kultisch-rituelle Kategorie des Textes, ohne moralische Schuld einzutragen.
- source_word: וְטָהֵר
  choice: danach ist er rein
  rationale: Die Wendung bezeichnet das Ende des vorübergehenden Unreinheitszustands; „danach“ verdeutlicht die zeitliche Abfolge.
theological_decisions:
- issue: Art der Unreinheit im levitischen Reinheitsrecht
  choice: „unrein/rein“ als rituellen Status wiedergeben
  alternative: „verunreinigt/gereinigt“
  rationale: Der Vers beschreibt einen kultisch-rechtlichen Zustand nach dem Essen von Aas oder gerissenem Wild und spricht nicht ausdrücklich von persönlicher moralischer Schuld.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Rechtssprache. Die Satzfolge bleibt nahe am Hebräischen, wird aber für natürliche deutsche Lesbarkeit gegliedert. Die kultischen Begriffe „unrein“ und „rein“ werden beibehalten.
