id: LEV.17.5
reference: Leviticus 17:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לְמַעַן֩ אֲשֶׁ֨ר יָבִ֜יאוּ בְּנֵ֣י יִשְׂרָאֵ֗ל אֶֽת זִבְחֵי/הֶם֮ אֲשֶׁ֣ר הֵ֣ם זֹבְחִים֮ עַל פְּנֵ֣י הַ/שָּׂדֶה֒ וֶֽ/הֱבִיאֻ֣/ם לַֽ/יהוָ֗ה אֶל פֶּ֛תַח אֹ֥הֶל מוֹעֵ֖ד אֶל הַ/כֹּהֵ֑ן וְ/זָ֨בְח֜וּ זִבְחֵ֧י שְׁלָמִ֛ים לַֽ/יהוָ֖ה אוֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/005.yaml
  text: so that the sons of Israel may bring their sacrifices that they are sacrificing in the open field[a], and bring them to Yahweh at the entrance of the tent of meeting, to the priest[b], and sacrifice them as peace offerings to Yahweh.
translation:
  language: de
  text: damit die Söhne Israels[a] ihre Schlachtopfer, die sie auf freiem Feld schlachten, zum Priester am Eingang des Zeltes der Begegnung bringen und sie dort Jahwe als Friedensopfer[b] darbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Israeliten“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „Gemeinschaftsopfer“ oder „Heilsopfer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן אֲשֶׁר
  choice: damit
  rationale: Leitet den vom vorausgehenden Gebot beabsichtigten Zweck ein und gibt die hebräische Finalkonstruktion natürlich wieder.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Bewahrt die familiäre Ausdrucksweise und die grammatisch maskuline Form des Hebräischen; gemeint ist das Bundesvolk Israel.
- source_word: זִבְחֵיהֶם
  choice: ihre Opfer
  rationale: Gibt den kultischen Sinn von זֶבַח verständlich wieder; das folgende Verb „schlachten“ verdeutlicht, dass es sich um Schlachtopfer handelt.
- source_word: אֲשֶׁר הֵם זֹבְחִים
  choice: die sie … schlachten
  rationale: Die partizipiale Form bezeichnet hier die bestehende beziehungsweise übliche Praxis. Das konkrete „schlachten“ erhält die lexikalische Verbindung zu זֶבַח.
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: auf freiem Feld
  rationale: Natürliche deutsche Wiedergabe für Opferhandlungen draußen im offenen Land, außerhalb des Heiligtums.
- source_word: וְהֱבִיאֻם
  choice: und sie … bringen
  rationale: Bewahrt das ausdrückliche Objektsuffix „sie“ und die erneute Verwendung des Verbs בוא im hebräischen Satz.
- source_word: לַיהוָה
  choice: zu Jahwe / Jahwe
  rationale: Gibt den im Ausgangstext stehenden Gottesnamen יהוה als Eigennamen wieder; die jeweilige Präposition richtet sich nach der deutschen Satzverbindung.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: den Eingang des Zeltes der Begegnung
  rationale: Formnahe und zugleich verständliche Bezeichnung des Zugangs zum zentralen Heiligtum.
- source_word: אֶל הַכֹּהֵן
  choice: zum Priester
  rationale: Der bestimmte Artikel bezeichnet den dort amtierenden Priester; die Apposition hält die Zuordnung zum Heiligtum offen und folgt der hebräischen Abfolge.
- source_word: זִבְחֵי שְׁלָמִים
  choice: Friedensopfer
  rationale: Traditionelle, knappe Bezeichnung dieser besonderen Opferart; eine Fußnote nennt heutige Alternativen, da שְׁלָמִים auch Gemeinschaft und Wohlergehen anklingen lässt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Tetragrammaton als Gottes Eigennamen. „Jahwe“ macht diesen Namen sichtbar, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Israeliten
  rationale: Die formnahe Wiedergabe erhält das familiäre Bundesvokabular und die sprachliche Spannung, dass die maskuline Pluralform das Volk repräsentativ bezeichnet.
- issue: Bedeutungsumfang von זִבְחֵי שְׁלָמִים
  choice: Friedensopfer
  alternative: Gemeinschaftsopfer / Heilsopfer
  rationale: Keine einzelne deutsche Bezeichnung deckt die mit שׁלם verbundenen Aspekte von Frieden, Ganzsein, Wohlergehen und kultischer Gemeinschaft vollständig ab; die Alternativen werden daher offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit moderater Formnähe. Die Wiederholung von „herbeibringen“ und „bringen“ spiegelt die auffällige Wiederaufnahme des hebräischen Verbs, ohne den Satz unverständlich zu machen. Kultische Fachbegriffe werden sparsam verwendet und in den Fußnoten erläutert.
