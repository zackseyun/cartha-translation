  to: damit die Söhne Israels[a] ihre Schlachtopfer, die sie auf freiem Feld schlachten, zum Priester am Eingang des Zeltes der Begegnung bringen und sie dort Jahwe als Friedensopfer[b] darbringen.
  rationale: 'Die Revision beseitigt die schwer verständliche Verb- und Präpositionshäufung. „Zum Priester am Eingang des Zeltes der Begegnung“ gibt אֶל־הַכֹּהֵן nach der Ortsangabe idiomatisch wieder; „dort“ nimmt den genannten Heiligtumsort auf. „Darbringen“ entspricht im kultischen deutschen Sprachgebrauch dem zweiten hebräischen Bringverb und bewahrt die Abfolge: Die außerhalb geschlachteten Opfer werden zum Heiligtum gebracht und dort Jahwe als Friedensopfer dargebracht. „Schlachtopfer“ macht den kultischen Sinn von זִבְחֵיהֶם deutlicher.'
