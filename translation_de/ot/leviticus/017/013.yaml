  naturalness: Die Konstruktion „ein jagdbares Wildtier oder einen Vogel erlegt, das oder der gegessen werden darf“ ist im modernen Standarddeutsch schwerfällig. Eine vorangestellte, rechtlich passende Bestimmung bei beiden Substantiven ist klarer.
  terminology: „Söhne Israels“ bewahrt die quellennahe Bezeichnung בני ישראל. „Fremde, die als Ansässige unter ihnen leben“ gibt גר הגר verständlich als soziale und rechtliche Kategorie wieder, ohne einen modernen Rechtsstatus zu unterstellen. „Erde“ ist für עפר hier idiomatisch und präzise genug.
