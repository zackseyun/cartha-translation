revisions:
- from: Und jeder Mann von den Söhnen Israels oder von den ansässigen Fremden, die unter ihnen leben,[a] der ein jagdbares Wildtier oder einen Vogel erlegt, das oder der gegessen werden darf, soll dessen Blut ausgießen und es mit Erde bedecken.[b]
  to: Und jeder Mann von den Söhnen Israels oder von den Fremden, die als Ansässige unter ihnen leben,[a] der ein zum Verzehr erlaubtes Wildtier oder einen zum Verzehr erlaubten Vogel erjagt, soll dessen Blut ausgießen und es mit Erde bedecken.[b]
  rationale: Die Revision ersetzt die nicht vom hebräischen Text gedeckte Eigenschaft „jagdbar“ durch „zum Verzehr erlaubt“, das die permissive Bedeutung von יֵאָכֵל im gesetzlichen Zusammenhang wiedergibt. Zugleich wird die schwerfällige Kombination „das oder der“ vermieden. Die Aussage, die Rechtsform und die bestehenden Fußnotenanker bleiben erhalten.
