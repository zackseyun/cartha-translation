  text: וְ/אִ֨ישׁ אִ֜ישׁ מִ/בְּנֵ֣י יִשְׂרָאֵ֗ל וּ/מִן הַ/גֵּר֙ הַ/גָּ֣ר בְּ/תוֹכָ֔/ם אֲשֶׁ֨ר יָצ֜וּד צֵ֥יד חַיָּ֛ה אוֹ ע֖וֹף אֲשֶׁ֣ר יֵאָכֵ֑ל וְ/שָׁפַךְ֙ אֶת דָּמ֔/וֹ וְ/כִסָּ֖/הוּ בֶּ/עָפָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/013.yaml
  text: And any man from the sons of Israel[a], or from the sojourner who sojourns among them, who hunts game—whether wild animal or bird—that may be eaten[b], shall pour out its blood and cover it with earth.
translation:
  language: de
  text: Und jeder Mann von den Söhnen Israels oder von den Fremden, die als Ansässige unter ihnen leben,[a] der ein zum Verzehr erlaubtes Wildtier oder einen zum Verzehr erlaubten Vogel erjagt, soll dessen Blut ausgießen und es mit Erde bedecken.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet einen Nichtisraeliten, der dauerhaft innerhalb der Gemeinschaft lebt.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „es mit Staub/Erde bedecken“. Das Pronomen bezieht sich am natürlichsten auf das Blut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: jeder Mann
  rationale: Die Verdoppelung hat distributive Bedeutung und wird mit „jeder Mann“ sowohl genau als auch natürlich wiedergegeben.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: von den Söhnen Israels
  rationale: Die familiär-bundestheologische Formulierung בני ישראל bleibt bewusst erhalten, statt sie zu „Israeliten“ zu verkürzen.
- source_word: הַגֵּר הַגָּר בְּתוֹכָם
  choice: von den ansässigen Fremden, die unter ihnen leben
  rationale: גר bezeichnet hier einen Nichtisraeliten mit dauerhaftem Aufenthalt innerhalb der Gemeinschaft. Die deutsche Formulierung gibt die rechtliche Kategorie verständlich wieder, ohne moderne ausländerrechtliche Begriffe einzutragen.
- source_word: יָצוּד צֵיד
  choice: erlegt
  rationale: Die hebräische Verbindung aus Verb und stammverwandtem Substantiv bezeichnet das Erjagen von Wild; zusammen mit „jagdbares Wildtier oder einen Vogel“ ist „erlegt“ im Deutschen knapp und idiomatisch.
- source_word: חַיָּה אוֹ עוֹף
  choice: ein jagdbares Wildtier oder einen Vogel
  rationale: חיה meint im Jagdkontext ein Wildtier. „Jagdbar“ verbindet sich mit dem anschließenden Relativsatz und macht deutlich, dass es um als Nahrung zulässiges Wild geht.
- source_word: אֲשֶׁר יֵאָכֵל
  choice: das oder der gegessen werden darf
  rationale: 'Der Niphal wird im gesetzlichen Kontext permissiv verstanden: Gemeint sind Tiere beziehungsweise Vögel, deren Verzehr erlaubt ist.'
- source_word: וְשָׁפַךְ אֶת־דָּמוֹ
  choice: soll dessen Blut ausgießen
  rationale: Die Verbform hat hier vorschreibende Kraft. „Dessen“ bezieht sich eindeutig auf das erlegte Tier beziehungsweise den Vogel.
- source_word: וְכִסָּהוּ בֶּעָפָר
  choice: und es mit Erde bedecken
  rationale: Das Objektsuffix bezieht sich am natürlichsten auf das unmittelbar zuvor genannte Blut. עפר bezeichnet Staub oder lockere Erde; „Erde“ ist für diesen konkreten Vorgang im Deutschen natürlicher.
theological_decisions:
- issue: Bezugswort des Suffixes in וְכִסָּהוּ
  choice: Das Blut soll bedeckt werden.
  alternative: Das erlegte Tier soll bedeckt beziehungsweise begraben werden.
  rationale: Das Blut ist das nächstliegende grammatische Bezugswort und steht im thematischen Mittelpunkt von Levitikus 17. Die Fußnote macht den Bezug ausdrücklich, ohne zusätzliche ritualtheologische Folgerungen einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rechtlich-vorschreibendem Ton. Die ungewöhnliche Bundesbezeichnung „Söhne Israels“ wird quellennah bewahrt; die Wendung für den ansässigen Fremden wird dagegen verständlich und ohne unnötige Fremdwörter formuliert.
