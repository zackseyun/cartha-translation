source:
  edition: WLC
  text: וְ/לֹא יִזְבְּח֥וּ עוֹד֙ אֶת זִבְחֵי/הֶ֔ם לַ/שְּׂעִירִ֕ם אֲשֶׁ֛ר הֵ֥ם זֹנִ֖ים אַחֲרֵי/הֶ֑ם חֻקַּ֥ת עוֹלָ֛ם תִּֽהְיֶה זֹּ֥את לָ/הֶ֖ם לְ/דֹרֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/007.yaml
  text: They shall no longer sacrifice their sacrifices to the goat-demons, after which they prostitute themselves. This shall be a permanent statute for them throughout their generations.
translation:
  language: de
  text: Sie sollen nicht länger ihre Schlachtopfer den Ziegendämonen[a] darbringen, denen sie in ihrer Hurerei nachlaufen[b]. Das soll für sie von Generation zu Generation eine dauerhafte Satzung[c] sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ziegengötzen“, „Ziegenböcken“ oder „Satyrn“; das hebräische Wort bezeichnet wörtlich „Haarige“ beziehungsweise ziegenartige Wesen und steht hier im Zusammenhang unerlaubter Verehrung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „denen sie nachhuren“; ein sexuelles Bild für religiöse Untreue und Götzendienst.'
    reason: cultural_note
  - marker: c
    text: 'Oder: „eine ewige Satzung“ beziehungsweise „eine immerwährende Satzung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזְבְּחוּ ... זִבְחֵיהֶם
  choice: ihre Schlachtopfer ... darbringen
  rationale: Die Verbindung aus Verb und stammverwandtem Substantiv bezeichnet das Darbringen von Schlachtopfern. Eine wörtliche Wiederholung wie „ihre Opfer opfern“ wäre im Deutschen schwerfällig; „Schlachtopfer darbringen“ bewahrt den kultischen Sinn.
- source_word: עוֹד
  choice: nicht länger
  rationale: Mit der Verneinung bezeichnet עוֹד hier das Ende einer bisherigen oder fortdauernden Praxis.
- source_word: לַשְּׂעִירִם
  choice: den Ziegendämonen
  rationale: שׂעירים bedeutet wörtlich „Ziegenböcke“ beziehungsweise „Haarige“, bezeichnet hier im Zusammenhang unerlaubter Opfer jedoch wahrscheinlich ziegenartig vorgestellte dämonische Wesen. Die Fußnote hält andere Deutungen offen.
- source_word: זֹנִים אַחֲרֵיהֶם
  choice: denen sie sich in Hurerei zuwenden
  rationale: Die Wiedergabe bewahrt sowohl die Wendung אַחֲרֵי „sich jemandem zuwenden/nachfolgen“ als auch die ausdrücklich sexuelle Metapher von זנה für kultische Untreue.
- source_word: חֻקַּת עוֹלָם
  choice: eine dauerhafte Ordnung
  rationale: Die feste Rechtsformel bezeichnet eine bleibend geltende Bestimmung. „Dauerhaft“ gibt die zeitliche Tragweite wieder, ohne den idiomatischen Ausdruck vorschnell metaphysisch als absolut endlos festzulegen.
- source_word: לְדֹרֹתָם
  choice: von Generation zu Generation
  rationale: Die natürliche deutsche Wendung drückt die fortlaufende Geltung über die aufeinanderfolgenden Generationen hinweg aus.
theological_decisions:
- issue: Referent von שְּׂעִירִם im unerlaubten Kult
  choice: Ziegendämonen
  alternative: Ziegenböcke, Ziegengötzen oder Satyrn
  rationale: Der Opferkontext und die folgende Metapher kultischer Untreue sprechen für übernatürliche beziehungsweise kultische Wesen. „Ziegendämonen“ vermittelt dies, ohne die Gestalten mit der griechisch-römischen Satyrvorstellung gleichzusetzen.
- issue: Metapher der kultischen Untreue in זֹנִים
  choice: die Hurerei-Metapher ausdrücklich bewahren
  alternative: ihnen untreu nachlaufen / Götzendienst treiben
  rationale: Der hebräische Text gebraucht bewusst sexuelle Sprache. „In Hurerei zuwenden“ lässt ihre Härte und theologische Spannung stehen, statt sie interpretierend zu verallgemeinern.
- issue: Zeitliche Tragweite von חֻקַּת עוֹלָם
  choice: dauerhafte Ordnung
  alternative: ewige Ordnung / immerwährende Satzung
  rationale: עוֹלָם bezeichnet in solchen Rechtsformeln eine fortdauernde Geltung im Bundes- und Generationenrahmen. Die Übersetzung wahrt diesen Sinn, ohne mehr festzulegen, als die Formel selbst eindeutig aussagt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Schlachtopfer“ hält den kultischen Bezug deutlich, „Ziegendämonen“ ist verständlich und quellenorientiert, und die bewusst anstößige Untreue-Metapher bleibt in einer lesbaren deutschen Form erhalten.
