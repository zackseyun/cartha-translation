  yaml_path: translation/ot/leviticus/017/016.yaml
  text: But if he does not wash his clothes and does not bathe his body[b][a], then he shall bear his guilt.
translation:
  language: de
  text: Wenn er aber seine Kleidung nicht wäscht und seinen Körper[a] nicht wäscht, wird er seine Schuld tragen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: sein Fleisch; gemeint ist hier sein Körper.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: wird sein Vergehen tragen; oder: wird die Strafe für sein Vergehen tragen. Die hebräische Rechtsformel kann sowohl die Schuld als auch deren Folge einschließen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: Wenn … aber
  rationale: Die konditionale Wendung führt den negativen Gegensatz zur vorgeschriebenen Reinigung im vorherigen Vers ein; die deutsche Nachstellung von „aber“ klingt natürlich.
- source_word: יְכַבֵּס
  choice: seine Kleidung … wäscht
  rationale: Das Piel von כבס bezeichnet gewöhnlich das Waschen von Kleidungsstücken. Das im Hebräischen ausgelassene Objekt ergibt sich eindeutig aus dem vorherigen Vers und wird im Deutschen ergänzt.
- source_word: וּבְשָׂרוֹ
  choice: seinen Körper
  rationale: בשר bedeutet wörtlich „Fleisch“, bezeichnet hier beim rituellen Waschen aber den Körper der Person.
- source_word: יִרְחָץ
  choice: badet
  rationale: רחץ bezeichnet hier das Waschen des Körpers; „baden“ unterscheidet diesen Vorgang klar vom Waschen der Kleidung.
- source_word: וְנָשָׂא
  choice: muss … tragen
  rationale: Die Verbindung drückt die rechtliche Folge der unterlassenen Reinigung aus. „Muss“ gibt die verbindliche Konsequenz in natürlichem deutschem Gesetzesstil wieder.
- source_word: עֲוֹנוֹ
  choice: seine Schuld
  rationale: עון kann Vergehen, Schuld oder die daraus erwachsende Strafhaftung bezeichnen. „Seine Schuld tragen“ bewahrt die rechtliche und theologische Bedeutungsbreite, ohne die genaue Folge festzulegen.
theological_decisions:
- issue: Bedeutung der Rechtsformel „sein עון tragen“
  choice: „seine Schuld tragen“ ohne nähere Bestimmung der Strafe
  alternative: „sein Vergehen tragen“ oder „die Strafe für sein Vergehen tragen“
  rationale: Die hebräische Rechtsformel kann sowohl die Schuld als auch deren Folge beziehungsweise Strafhaftung umfassen. Die Übersetzung lässt diese Spannung bestehen, statt sie einseitig auf moralische Schuld oder konkrete Bestrafung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist verständlich und bewahrt zugleich den knappen rechtlichen Charakter des hebräischen Satzes.
