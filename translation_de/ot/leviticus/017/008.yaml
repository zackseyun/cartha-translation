  text: וַ/אֲלֵ/הֶ֣ם תֹּאמַ֔ר אִ֥ישׁ אִישׁ֙ מִ/בֵּ֣ית יִשְׂרָאֵ֔ל וּ/מִן הַ/גֵּ֖ר אֲשֶׁר יָג֣וּר בְּ/תוֹכָ֑/ם אֲשֶׁר יַעֲלֶ֥ה עֹלָ֖ה אוֹ זָֽבַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/008.yaml
  text: 'And you shall say to them: Any man from the house of Israel[a], or from the sojourner who sojourns among them[b], who offers up a burnt offering or a sacrifice—'
translation:
  language: de
  text: 'Und zu ihnen sollst du sagen: Jeder Mann aus dem Haus Israel[a] oder jeder ansässige Fremde, der unter ihnen lebt[b], der ein Brandopfer oder ein Schlachtopfer darbringt –'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Hebräischen eine verdoppelte Form („Mann, Mann“), eine rechtssprachliche Wendung für jeden einzelnen Fall.
    reason: lexical_alternative
  - marker: b
    text: Mit „ansässiger Fremder“ ist hier ein Nichtisraelit gemeint, der unter den Israeliten lebt.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲלֵהֶם תֹּאמַר
  choice: Und zu ihnen sollst du sagen
  rationale: Bewahrt die anschließende Konjunktion und gibt den an Mose gerichteten, rechtlich verbindlichen Auftrag in natürlichem Deutsch wieder.
- source_word: אִישׁ אִישׁ
  choice: Jeder Mann
  rationale: Die Verdoppelung ist eine distributive Rechtsformel für jeden einzelnen Fall; das grammatisch männliche Substantiv wird sichtbar beibehalten.
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: aus dem Haus Israel
  rationale: Erhält die feste gemeinschaftlich-bundestheologische Bezeichnung und bildet die Präposition מִן mit „aus“ ab.
- source_word: וּמִן הַגֵּר אֲשֶׁר יָגוּר בְּתוֹכָם
  choice: oder von den ansässigen Fremden, die unter ihnen leben
  rationale: גֵּר bezeichnet hier einen nichtisraelitischen Bewohner innerhalb Israels. Die idiomatische deutsche Formulierung vermittelt sowohl den Fremdenstatus als auch den dauerhaften Aufenthalt; der kollektive Singular des Hebräischen wird natürlich als Gruppenbezeichnung wiedergegeben.
- source_word: אֲשֶׁר יַעֲלֶה
  choice: der ... darbringt
  rationale: Der Hifil von עלה bezeichnet mit Opferobjekten das Darbringen; „darbringen“ ist im Deutschen klar und kultisch angemessen.
- source_word: עֹלָה
  choice: Brandopfer
  rationale: Die etablierte deutsche Bezeichnung für das Opfer, das vollständig auf dem Altar verbrannt wird.
- source_word: אוֹ זָבַח
  choice: oder ein Schlachtopfer
  rationale: „Schlachtopfer“ wahrt die Abgrenzung zum Brandopfer und den Bezug des Ausdrucks auf ein geschlachtetes Opfer deutlicher als das allgemeinere „Opfer“.
theological_decisions:
- issue: Distributive männliche Form אִישׁ אִישׁ
  choice: Jeder Mann
  alternative: Jeder; wer auch immer
  rationale: Die Rechtsformel ist distributiv, bleibt aber im Hebräischen ausdrücklich männlich. Die Übersetzung bewahrt beides, ohne den Anwendungsbereich über den Text hinaus dogmatisch zu bestimmen.
- issue: Sozial-rechtliche Kategorie גֵּר
  choice: ansässiger Fremder
  alternative: Fremdling; Schutzbürger
  rationale: Die Wendung bezeichnet einen Nichtisraeliten, der innerhalb Israels lebt und diesen kultischen Vorschriften untersteht. „Ansässiger Fremder“ ist modern verständlich und vermeidet zusätzliche rechtliche oder konfessionelle Festlegungen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit rechtlich-kultischem Ton. Der Satz bleibt wie im Ausgangstext offen und wird im folgenden Vers fortgesetzt; deshalb steht am Ende ein Gedankenstrich.
