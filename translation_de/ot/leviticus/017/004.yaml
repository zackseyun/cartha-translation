base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/004.yaml
  text: 'and has not brought it to the entrance of the tent of meeting to present it as an offering to Yahweh before the tabernacle of Yahweh[a], blood shall be imputed to that man: he has shed blood[c][b], and that man shall be cut off from among his people.'
translation:
  language: de
  text: 'und es nicht an den Eingang des Zeltes der Begegnung gebracht hat, um es dem HERRN vor der Wohnung des HERRN als Opfer darzubringen, so wird jenem Mann Blut angerechnet[a]: Er hat Blut vergossen. Jener Mann soll aus der Mitte seines Volkes abgeschnitten werden[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „So wird jenem Mann Blut zugerechnet.“ Gemeint ist, dass er wegen Blutvergießens schuldig wird.'
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Ausdruck „abgeschnitten werden“ legt hier nicht fest, ob damit Tod, Ausschluss oder eine andere Form der Entfernung aus der Gemeinschaft gemeint ist.
    reason: cultural_note
lexical_decisions:
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: Eingang des Zeltes der Begegnung
  rationale: „Eingang“ gibt פֶּתַח natürlich wieder; „Zelt der Begegnung“ ist eine verständliche und quellennah bleibende Wiedergabe der festen Heiligtumsbezeichnung.
- source_word: הֱבִיאוֹ
  choice: es ... gebracht hat
  rationale: Das Hifil von בוא bedeutet „bringen“; das Suffix verweist auf das im vorausgehenden Vers geschlachtete Tier.
- source_word: לְהַקְרִיב קָרְבָּן
  choice: um es ... als Opfer darzubringen
  rationale: Die Formulierung wahrt den kultischen Sinn von הקריב und vermeidet die im Deutschen schwerfällige Wiederholung „ein Opfer opfern“.
- source_word: לַיהוָה
  choice: dem HERRN
  rationale: Der Gottesname wird nach verbreiteter deutscher Bibelkonvention mit „HERR“ in Kapitälchen wiedergegeben.
- source_word: לִפְנֵי מִשְׁכַּן יְהוָה
  choice: vor der Wohnung des HERRN
  rationale: מִשְׁכָּן bezeichnet wörtlich die Wohnstätte Gottes; „Wohnung“ ist präzise, verständlich und unterscheidet den Ausdruck vom zuvor genannten Zelt der Begegnung.
- source_word: דָּם יֵחָשֵׁב לָאִישׁ הַהוּא
  choice: so wird jenem Mann Blut angerechnet
  rationale: Die formal nahe Wiedergabe bewahrt das hebräische Rechtsidiom und seine Spannung; eine Fußnote erläutert, dass es um Schuld wegen Blutvergießens geht.
- source_word: דָּם שָׁפָךְ
  choice: Er hat Blut vergossen
  rationale: Dies entspricht sowohl dem Wortlaut als auch dem rechtlich-moralischen Gewicht der hebräischen Wendung.
- source_word: וְנִכְרַת ... מִקֶּרֶב עַמּוֹ
  choice: soll aus der Mitte seines Volkes entfernt werden
  rationale: „Entfernt werden“ gibt die Ausschlussformel in natürlichem heutigen Deutsch wieder, ohne die hier nicht genannte Art der Strafe festzulegen.
theological_decisions:
- issue: Rechtliche Bedeutung von דָּם יֵחָשֵׁב
  choice: wird jenem Mann Blut angerechnet
  alternative: lädt jener Mann Blutschuld auf sich
  rationale: Der Haupttext bleibt beim bildhaften hebräischen Wortlaut. Die interpretierende Bedeutung „Blutschuld“ wird in der Fußnote genannt, statt die Mehrdeutigkeit im Text aufzulösen.
- issue: Bedeutung der כרת-Strafe
  choice: soll aus der Mitte seines Volkes entfernt werden
  alternative: soll aus seinem Volk ausgerottet werden
  rationale: Der Vers legt nicht fest, ob Tod, Ausschluss oder eine andere Form der Entfernung gemeint ist. Die gewählte Formulierung wahrt diese rechtliche und theologische Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rechtlich-kultischem Ton. Der Satz setzt die Fallbeschreibung aus Vers 3 fort. Die bildhafte Rechtsformel wird im Haupttext bewahrt und knapp erläutert; die Art der angekündigten Entfernung bleibt bewusst offen.
