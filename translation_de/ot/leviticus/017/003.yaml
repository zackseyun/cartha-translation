source:
  edition: WLC
  text: אִ֥ישׁ אִישׁ֙ מִ/בֵּ֣ית יִשְׂרָאֵ֔ל אֲשֶׁ֨ר יִשְׁחַ֜ט שׁ֥וֹר אוֹ כֶ֛שֶׂב אוֹ עֵ֖ז בַּֽ/מַּחֲנֶ֑ה א֚וֹ אֲשֶׁ֣ר יִשְׁחַ֔ט מִ/ח֖וּץ לַֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/003.yaml
  text: Any man from the house of Israel who slaughters an ox or a sheep or a goat in the camp[a], or who slaughters it outside the camp—
translation:
  language: de
  text: Jeder Mann[a] aus dem Haus Israel, der im Lager ein Rind, ein Schaf oder eine Ziege schlachtet oder der es außerhalb des Lagers schlachtet —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Hebräischen „Mann, Mann“. Diese distributive Wendung meint jeden Einzelnen und wird hier allgemein für ein Mitglied der israelitischen Gemeinschaft gebraucht.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: Jeder Mann
  rationale: 'Die Verdopplung ist eine distributive hebräische Wendung: Gemeint ist jeder einzelne Mann beziehungsweise jedes einzelne Mitglied der angesprochenen Gemeinschaft. Die Übersetzung bewahrt die grammatisch maskuline Form des Ausgangstextes; die Fußnote erläutert ihre generische Funktion.'
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: aus dem Haus Israel
  rationale: Die wörtliche, im Deutschen verständliche Bundes- und Volksbezeichnung bleibt erhalten, statt sie zu „aus Israel“ oder „von den Israeliten“ zu verflachen.
- source_word: יִשְׁחַט
  choice: schlachtet
  rationale: שׁחט bezeichnet das Schlachten eines Tieres und passt hier sowohl zum konkreten Vorgang als auch zum kultischen Zusammenhang besser als das allgemeinere „tötet“.
- source_word: שׁוֹר
  choice: Rind
  rationale: Das Wort bezeichnet hier ein einzelnes Tier aus der Rindergattung. „Rind“ vermeidet die im modernen Deutschen engere Bedeutung von „Ochse“ als kastriertem männlichem Tier.
- source_word: כֶשֶׂב
  choice: Schaf
  rationale: Der Ausdruck bezeichnet allgemein ein Schaf und nicht notwendig ein junges Lamm.
- source_word: עֵז
  choice: Ziege
  rationale: Dies ist die übliche und kontextgerechte Bezeichnung für das Tier.
- source_word: בַּמַּחֲנֶה
  choice: im Lager
  rationale: Die knappe Ortsangabe wird unmittelbar und idiomatisch wiedergegeben.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: außerhalb des Lagers
  rationale: Die Übersetzung gibt die räumliche Gegenüberstellung zum Schlachten im Lager klar wieder.
- source_word: אֲשֶׁר ... אֲשֶׁר
  choice: der ... oder der
  rationale: Die Wiederholung des Relativpronomens bewahrt die parallele Struktur der beiden Rechtsfallformulierungen.
- source_word: '[implizites Objekt nach dem zweiten יִשְׁחַט]'
  choice: es schlachtet
  rationale: Das Pronomen nimmt im Deutschen die zuvor genannten Tiere auf und macht die im Hebräischen mögliche Ellipse verständlich, ohne neue Sachinformation hinzuzufügen.
