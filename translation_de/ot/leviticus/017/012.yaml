  text: עַל כֵּ֤ן אָמַ֨רְתִּי֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל כָּל נֶ֥פֶשׁ מִ/כֶּ֖ם לֹא תֹ֣אכַל דָּ֑ם וְ/הַ/גֵּ֛ר הַ/גָּ֥ר בְּ/תוֹכְ/כֶ֖ם לֹא יֹ֥אכַל דָּֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/012.yaml
  text: Therefore I said to the sons of Israel[a], ‘No person among you shall eat blood[b], and the sojourner who sojourns among you shall not eat blood.’
translation:
  language: de
  text: 'Darum sagte ich zu den Söhnen Israels[a]: Niemand von euch darf Blut essen, und der Fremde[b], der unter euch wohnt, darf kein Blut essen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zu den Söhnen Israels“; sinngemäß auch: „zu den Israeliten“ oder „zu den Kindern Israels“.'
    reason: lexical_alternative
  - marker: b
    text: 'Der „Fremde“ bezeichnet hier einen Nichtisraeliten, der unter Israel ansässig ist; auch: „ansässiger Fremder“.'
    reason: cultural_note
lexical_decisions:
- source_word: עַל כֵּן
  choice: Darum
  rationale: Die Wendung zieht eine Folgerung aus der vorausgehenden Begründung, dass das Leben im Blut ist. „Darum“ ist natürlich und bewahrt diesen Schlusscharakter.
- source_word: אָמַרְתִּי
  choice: habe ich … gesagt
  rationale: Das deutsche Perfekt gibt die vorausgehende, weiterhin maßgebliche Anordnung in natürlicher Standardsprache wieder; das schlichte Verb „sagen“ bleibt nahe am Hebräischen.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: zu den Söhnen Israels
  rationale: Dies bewahrt die wörtliche, maskulin formulierte Bundesbezeichnung des Hebräischen. Eine Fußnote nennt die im Deutschen geläufigere Alternative „Israeliten“.
- source_word: כָּל נֶפֶשׁ מִכֶּם
  choice: Keiner von euch
  rationale: נֶפֶשׁ bezeichnet hier idiomatisch eine einzelne Person. „Keiner von euch“ vermittelt die distributive Reichweite des Verbots klar, ohne das missverständliche „Seele“.
- source_word: לֹא תֹאכַל דָּם
  choice: darf Blut essen
  rationale: Zusammen mit „Keiner“ ergibt sich ein klares gesetzliches Verbot. „Blut essen“ bildet die konkrete hebräische Formulierung direkt ab.
- source_word: הַגֵּר
  choice: der Fremde
  rationale: גֵּר bezeichnet hier einen Nichtisraeliten, der dauerhaft in Israels Gemeinschaft lebt und ihrer Rechtsordnung untersteht. „Fremder“ ist würdig und verständlich; die Fußnote grenzt die Bedeutung gegen einen bloß vorübergehenden Ausländer ab.
- source_word: הַגָּר בְּתוֹכְכֶם
  choice: der unter euch lebt
  rationale: Die partizipiale Wendung beschreibt den ansässigen Fremden. „Unter euch lebt“ klingt im modernen Deutsch natürlicher als eine etymologische Wiederholung und bewahrt den Sinn.
- source_word: לֹא יֹאכַל דָּם
  choice: darf kein Blut essen
  rationale: Die wiederholte Formulierung überträgt dasselbe Verbot ausdrücklich auf den ansässigen Fremden und wahrt die Parallelität in natürlichem Deutsch.
theological_decisions:
- issue: Geschlechtsspezifische Bundesbezeichnung לִבְנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  alternative: Israeliten / Kinder Israels
  rationale: Die Übersetzung erhält die ausdrücklich maskuline hebräische Form, ohne daraus eine Aussage abzuleiten, dass nur männliche Personen gemeint seien. Die idiomatische Alternative wird in der Fußnote kenntlich gemacht.
- issue: Reichweite des Blutverbots
  choice: Das Verbot gilt ausdrücklich sowohl Israel als auch dem ansässigen Fremden.
  alternative: Den גֵּר lediglich als beliebigen auswärtigen Besucher verstehen.
  rationale: Der Relativsatz „der unter euch lebt“ kennzeichnet den גֵּר als in der Gemeinschaft ansässigen Nichtisraeliten; diese rechtliche und gemeinschaftliche Spannung darf nicht auf einen bloßen Besucher reduziert werden.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit klar erkennbarem Gesetzeston. Die wörtliche Bundesbezeichnung „Söhne Israels“ bleibt erhalten; das Verbot wird mit dem heute natürlichen „darf … nicht/kein“ ausgedrückt. Der zweite Fußnotenmarker steht nach dem vollständigen Satz, auf den die kulturelle Erläuterung zum Fremden Bezug nimmt.
