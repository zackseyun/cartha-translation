  terminology: „Söhne Israels“ bewahrt die Formulierung בני ישראל; die Alternative in der Anmerkung ist sinnvoll. „Fremde“ ist als Wiedergabe von גֵּר möglich, sollte aber durch eine sachliche Anmerkung als ansässiger Nichtisraelit präzisiert werden. Die Aussage, er unterstehe einer umfassenden gemeinschaftlichen Rechtsordnung, geht über die lexikalische Bedeutung des einzelnen Wortes hinaus und wird daher zurückhaltender formuliert.
