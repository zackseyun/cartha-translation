source:
  edition: WLC
  text: כִּ֣י נֶ֣פֶשׁ הַ/בָּשָׂר֮ בַּ/דָּ֣ם הִוא֒ וַ/אֲנִ֞י נְתַתִּ֤י/ו לָ/כֶם֙ עַל הַ/מִּזְבֵּ֔חַ לְ/כַפֵּ֖ר עַל נַפְשֹׁתֵי/כֶ֑ם כִּֽי הַ/דָּ֥ם ה֖וּא בַּ/נֶּ֥פֶשׁ יְכַפֵּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/011.yaml
  text: For the life of the flesh is in the blood[a], and I have given it to you on the altar to make atonement for your lives[b], for it is the blood that makes atonement by the life.
translation:
  language: de
  text: Denn das Leben des Fleisches ist im Blut[b]. Ich selbst habe es euch für den Altar gegeben, um Sühne für euer Leben zu erwirken; denn das Blut ist es, das durch das Leben Sühne erwirkt[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn das Blut erwirkt Sühne durch das Leben, das in ihm ist.“'
    reason: Alternative, stärker erläuternde Wiedergabe des knappen hebräischen בַּנֶּפֶשׁ.
  - marker: b
    text: Das hebräische Wort nefesch kann je nach Zusammenhang „Leben“, „Selbst“, „Person“ oder „Seele“ bedeuten; hier ist „Leben“ gemeint.
    reason: Lexikalische Bedeutungsbreite von נֶפֶשׁ.
lexical_decisions:
- source_word: נֶפֶשׁ / נַפְשֹׁתֵיכֶם
  choice: Leben / euer Leben
  rationale: Im Zusammenhang des Blut- und Opfergesetzes bezeichnet נֶפֶשׁ das belebende Leben beziehungsweise die lebende Person, nicht ausdrücklich eine vom Körper getrennte Seele. „Leben“ wahrt zugleich die Wiederholung und die Argumentation des Verses.
- source_word: הַבָּשָׂר
  choice: das Fleisch
  rationale: „Fleisch“ ist die direkte kultisch-anthropologische Entsprechung und meint hier lebendiges, geschöpfliches Fleisch, nicht bloß Fleisch als Nahrung.
- source_word: בַּדָּם
  choice: im Blut
  rationale: Die Präposition ב mit Artikel bezeichnet hier am natürlichsten den Bereich beziehungsweise Ort, in dem das Leben des Fleisches liegt.
- source_word: וַאֲנִי נְתַתִּיו לָכֶם
  choice: Ich selbst habe es euch gegeben
  rationale: Das ausdrücklich gesetzte Pronomen אֲנִי wird durch „ich selbst“ hervorgehoben. Das Perfekt wird mit Blick auf die fortdauernde göttliche Bestimmung als deutsches Perfekt wiedergegeben; „es“ bezieht sich im Hebräischen auf das Blut.
- source_word: עַל הַמִּזְבֵּחַ
  choice: auf den Altar
  rationale: Die Formulierung bewahrt die konkrete kultische Vorstellung, dass das Blut zur Verwendung am Altar gegeben ist.
- source_word: לְכַפֵּר / יְכַפֵּר
  choice: Sühne erwirken
  rationale: כפר bezeichnet im levitischen Kult die sühnende Handlung. „Sühne erwirken“ ist im Deutschen verständlich und präzise, ohne eine bestimmte Theorie ihrer Wirkungsweise festzulegen.
- source_word: בַּנֶּפֶשׁ
  choice: durch das Leben
  rationale: Das ב wird instrumental beziehungsweise mittelbezogen verstanden. Die knappe, auffällige Formulierung lässt offen, wie genau Blut und das in ihm befindliche Leben in der Sühnehandlung zusammenwirken.
theological_decisions:
- issue: Bedeutung von נֶפֶשׁ im Opfergesetz
  choice: Durchgehend mit „Leben“ wiedergegeben.
  alternative: „Seele“, „Selbst“ oder „Person“
  rationale: Der Vers begründet die kultische Bedeutung des Blutes mit dem darin befindlichen Leben. „Seele“ könnte eine Leib-Seele-Trennung nahelegen, die der hebräische Text hier nicht ausdrücklich lehrt.
- issue: Bedeutung von בַּנֶּפֶשׁ im Schlusssatz
  choice: „durch das Leben“
  alternative: „wegen des Lebens“ oder „durch das Leben, das in ihm ist“
  rationale: Die hebräische Wendung ist knapp und syntaktisch mehrdeutig. Die Hauptfassung bewahrt diese Spannung; die Fußnote bietet eine verständlichere, aber stärker auslegende Möglichkeit.
- issue: Bezug des Pronomens in נְתַתִּיו
  choice: Das Pronomen wird auf das Blut bezogen.
  alternative: Bezug auf das Leben
  rationale: Das maskuline Suffix passt grammatisch zu דָּם („Blut“), während נֶפֶשׁ feminin ist. Gemeint ist daher das von Gott für den Altar bestimmte Blut.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter kultischer Fachsprache. Der markierte Ausdruck „durch das Leben“ bleibt bewusst etwas ungeglättet, um die Mehrdeutigkeit des hebräischen Schlusssatzes nicht vorschnell aufzulösen.
