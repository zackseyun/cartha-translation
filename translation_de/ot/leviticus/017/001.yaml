base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: de
  text: 'Und Jahwe sprach zu Mose[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: sprach
  rationale: Das Wayyiqtol von דבר eröffnet ein neues Redeereignis. „sprach“ entspricht der feierlichen, formelhaften Erzählsprache und ist im Deutschen in dieser Einleitungsformel natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, der im modernen Deutschen üblichen wissenschaftlichen Umschrift, statt ihn durch einen Titel zu ersetzen.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition kennzeichnet den Adressaten der Rede; „zu“ ist in der deutschen Verbindung „zu jemandem sprechen“ idiomatisch.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: „Mose“ ist die etablierte deutsche Form des Personennamens מֹשֶׁה.
- source_word: לֵאמֹר
  choice: durch den Doppelpunkt ausgedrückt
  rationale: Der Infinitiv leitet formelhaft den Inhalt der Rede ein. Ein Doppelpunkt gibt diese Funktion im heutigen Deutsch natürlicher wieder als das schwerfällige „und sagte“ oder „folgendermaßen“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ bewahrt ihn als persönlichen Gottesnamen; die traditionelle Ersetzung durch „der HERR“ wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die formelhafte Redeeröffnung bleibt durch „sprach“ erhalten; לֵאמֹר wird ohne unnötige Verdopplung funktional durch den Doppelpunkt wiedergegeben.
