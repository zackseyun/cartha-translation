review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von נֶפֶשׁ als „Leben“, בָּשָׂר als „Fleisch“ und דָּם als „Blut“ ist quellentreu. Die bewusst gedrängte zweite Satzhälfte bildet die schwierige hebräische Formulierung בְּנַפְשׁוֹ הוּא angemessen ab und wird zutreffend erläutert. Die Sanktion יִכָּרֵת sollte jedoch nicht durch „aus seinem Volk entfernt werden“ konkretisiert werden, da „aus seinem Volk“ im hebräischen Vers nicht steht und die Formel selbst hinsichtlich der Vollzugsweise offenbleibt.
  naturalness: Der Text ist überwiegend modernes, würdiges Standarddeutsch. „Ihr sollt ... nicht essen“ gibt den gesetzlichen Charakter der direkten hebräischen Prohibition klarer wieder als „Ihr dürft ... nicht essen“. „Abgeschnitten werden“ ist als bewusst formelhafte, ansonsten im Deutschen ungebräuchliche Wiedergabe hier vorzuziehen, weil die Fußnote die Bedeutungsoffenheit erklärt.
  terminology: „Israeliten“ ist idiomatisch und die Fußnote bewahrt die wörtliche hebräische Wendung. „Leben“, „Fleisch“ und „Blut“ sind konsistent. Für יִכָּרֵת bewahrt „abgeschnitten werden“ die etablierte hebräische Rechtsformel besser als „entfernt werden“ oder die im bisherigen Hinweis genannte, zu stark festlegende Formulierung „ausgerottet werden“.
  issues:
  - severity: medium
    issue: Die Wiedergabe „soll aus seinem Volk entfernt werden“ fügt „aus seinem Volk“ hinzu.
    rationale: Der hebräische Text lautet nur יִכָּרֵת („wird/soll abgeschnitten werden“) und nennt in diesem Vers kein Volk. Die Ergänzung schränkt die bewusst offene Sanktion in eine bestimmte soziale Richtung ein.
  - severity: medium
    issue: Fußnote [c] nennt „soll ausgerottet werden“ als wörtliche Wiedergabe.
    rationale: „Ausrotten“ ist keine wörtliche deutsche Entsprechung der Formel und kann eine konkrete tödliche Vernichtung nahelegen. Gerade diese Vollzugsweise bleibt im Ausdruck umstritten und soll nicht festgelegt werden.
  - severity: low
    issue: „Ihr dürft ... nicht essen“ ist gegenüber der Rechtsform des Hebräischen abgeschwächt.
    rationale: Die Form kann im Deutschen zwar ein Verbot ausdrücken, „Ihr sollt ... nicht essen“ wahrt jedoch deutlicher den normativen Gesetzesregisterton des hebräischen Imperfekts mit לֹא.
