revisions:
- from: 'Denn das Leben allen Fleisches ist sein Blut[a]; in seinem Leben ist es. Darum habe ich zu den Israeliten[b] gesagt: »Ihr dürft das Blut keines Fleisches essen; denn das Leben allen Fleisches ist sein Blut.« Jeder, der es isst, soll aus seinem Volk entfernt werden[c].'
  to: 'Denn das Leben allen Fleisches ist sein Blut[a]; in seinem Leben ist es. Darum habe ich zu den Israeliten[b] gesagt: »Ihr sollt das Blut keines Fleisches essen; denn das Leben allen Fleisches ist sein Blut.« Jeder, der es isst, soll abgeschnitten werden[c].'
  rationale: Die Revision entfernt die nicht im Vers ausgedrückte Ergänzung „aus seinem Volk“ und ersetzt die irreführende Fußnotenparaphrase „ausgerottet werden“ durch eine formelhafte, eng am Hebräischen bleibende Wiedergabe. Zugleich wird die direkte gesetzliche Prohibition mit „Ihr sollt ... nicht essen“ klarer markiert. Die schwierige Blut-Leben-Formulierung und ihre Fußnotenalternativen bleiben unverändert erhalten.
  reviewer_model: gpt-5.6-terra
