source:
  edition: WLC
  text: כִּֽי נֶ֣פֶשׁ כָּל בָּשָׂ֗ר דָּמ֣/וֹ בְ/נַפְשׁ/וֹ֮ הוּא֒ וָֽ/אֹמַר֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל דַּ֥ם כָּל בָּשָׂ֖ר לֹ֣א תֹאכֵ֑לוּ כִּ֣י נֶ֤פֶשׁ כָּל בָּשָׂר֙ דָּמ֣/וֹ הִ֔וא כָּל אֹכְלָ֖י/ו יִכָּרֵֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/014.yaml
  text: For the life of all flesh is its blood[a]; in its life it is. So I said to the sons of Israel, ‘You shall not eat the blood of any flesh[b], for the life of all flesh is its blood.’ Everyone who eats it shall be cut off.
translation:
  language: de
  text: 'Denn das Leben allen Fleisches ist sein Blut[a]; in seinem Leben ist es. Darum habe ich zu den Israeliten[b] gesagt: »Ihr sollt das Blut keines Fleisches essen; denn das Leben allen Fleisches ist sein Blut.« Jeder, der es isst, soll abgeschnitten werden[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sein Blut ist in seinem Leben«; sinngemäßer auch: »sein Blut ist sein Leben«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »zu den Söhnen Israels«.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebräisch: »soll abgeschnitten werden«. Die genaue Art dieser Sanktion wird durch die hebräische Formel nicht näher bestimmt.'
    reason: theological_ambiguity
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: Leben
  rationale: Im Speise- und Opferkontext bezeichnet נֶפֶשׁ das belebende Leben des Geschöpfes, nicht ausdrücklich eine immaterielle Seele.
- source_word: כָּל־בָּשָׂר
  choice: alles Fleisch / keines Fleisches
  rationale: Die formale Wiedergabe bewahrt den wiederholten hebräischen Ausdruck und dessen körperlich-kreatürlichen Bezug.
- source_word: דָּם / דָּמוֹ
  choice: Blut / sein Blut
  rationale: Blut ist der tragende Begriff der Begründung und des Verbots und wird daher unmittelbar wiedergegeben.
- source_word: בְנַפְשׁוֹ הוּא
  choice: in seinem Leben ist es
  rationale: Die ungewöhnlich verdichtete hebräische Formulierung wird bewusst nicht geglättet; ihre möglichen Bedeutungsbeziehungen werden in der Fußnote offengehalten.
- source_word: וָאֹמַר
  choice: Darum habe ich ... gesagt
  rationale: Das deutsche Perfekt klingt natürlich und »darum« gibt den folgernden Zusammenhang zwischen Grundsatz und Gebot wieder.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: zu den Israeliten
  rationale: Dies ist die natürliche moderne deutsche Bezeichnung für die Angehörigen Israels; die wörtliche Form steht in der Fußnote.
- source_word: לֹא תֹאכֵלוּ
  choice: Ihr dürft ... nicht essen
  rationale: Die Formulierung gibt das direkte gesetzliche Verbot klar und in heutigem Deutsch wieder.
- source_word: יִכָּרֵת
  choice: soll aus seinem Volk entfernt werden
  rationale: Die feste levitische Sanktionsformel wird verständlich wiedergegeben, ohne die konkrete Art der Strafe als Hinrichtung, Ausschluss oder unmittelbares göttliches Gericht festzulegen.
theological_decisions:
- issue: Bedeutung von נֶפֶשׁ im Verhältnis zum Blut
  choice: »Leben« bezeichnet die Lebenskraft beziehungsweise das Leben des Geschöpfes, das unauflöslich mit seinem Blut verbunden ist.
  alternative: »Seele« im metaphysischen Sinn
  rationale: Die Begründung des Blutverbots beruht hier auf dem Zusammenhang von Blut und Leben; eine ausgearbeitete Lehre von einer immateriellen Seele sollte nicht in den Text eingetragen werden.
- issue: Bedeutung der Ausrottungsformel יִכָּרֵת
  choice: Die Sanktion bleibt als Entfernung aus dem Volk formuliert, ohne ihre Vollzugsweise festzulegen.
  alternative: »muss hingerichtet werden«, »wird aus der Gemeinschaft ausgeschlossen« oder unmittelbares göttliches Gericht
  rationale: Die hebräische Formel lässt in ihrem weiteren biblischen Gebrauch die genaue Form des Bundesgerichts offen; die Übersetzung soll diese Spannung nicht entscheiden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die schwer verständliche Doppelwendung im ersten Satz bleibt nahe am Hebräischen und wird durch Fußnote [a] erläutert. Die traditionelle Rechtsformel am Versende wird verständlich formuliert, während Fußnote [c] ihre wörtliche Gestalt und sachliche Offenheit bewahrt.
