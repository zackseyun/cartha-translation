id: LEV.17.2
reference: Leviticus 17:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: דַּבֵּ֨ר אֶֽל אַהֲרֹ֜ן וְ/אֶל בָּנָ֗י/ו וְ/אֶל֙ כָּל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵי/הֶ֑ם זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/002.yaml
  text: Speak to Aaron and to his sons and to all the sons of Israel[a], and say to them, ‘This is the thing that Yahweh has commanded[b], saying,’
translation:
  language: de
  text: 'Rede zu Aaron, zu seinen Söhnen und zu allen Israeliten[a] und sag ihnen: »Folgendes hat Jahwe geboten[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zu allen Söhnen Israels“; traditionell auch: „zu allen Kindern Israels“.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlicher kann זֶה הַדָּבָר auch mit „Dies ist das Wort“ oder „Dies ist die Sache“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Rede
  rationale: Der Piel-Imperativ richtet einen unmittelbaren, formellen Sprechauftrag an Mose; „Rede“ gibt ihn knapp und würdig wieder.
- source_word: בָּנָיו
  choice: seinen Söhnen
  rationale: Die maskuline Pluralform mit Suffix bezeichnet hier ausdrücklich Aarons Söhne im priesterlichen Zusammenhang.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: alle Israeliten
  rationale: בני ישראל ist eine feste Volksbezeichnung. „Alle Israeliten“ ist im heutigen Deutsch natürlich und schließt das gesamte Volk ein; die wörtliche familiäre Ausdrucksweise bleibt in der Fußnote sichtbar.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: und sag ihnen
  rationale: Die fortgesetzte Aufforderung wird direkt und idiomatisch wiedergegeben; „sag“ ist modernes Standarddeutsch und steht nicht im Widerspruch zum würdigen Register.
- source_word: זֶה הַדָּבָר
  choice: Folgendes
  rationale: Die Formel führt den unmittelbar anschließenden Inhalt des göttlichen Gebots ein. „Folgendes“ ist im Deutschen natürlicher als „dies ist die Sache“, ohne die Bedeutungsbreite von דָּבָר dogmatisch festzulegen.
- source_word: צִוָּה
  choice: hat geboten
  rationale: Das Perfekt bezeichnet das ergangene göttliche Gebot; das deutsche Perfekt ist in dieser Einleitungsformel klar und gegenwartsbezogen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die geläufige deutsche Form der wissenschaftlich üblichen Rekonstruktion.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv leitet den Wortlaut des Gebots ein. Im modernen Deutschen übernimmt der Doppelpunkt diese Funktion natürlich und ohne das schwerfällige „indem er sagte“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen. Die Wiedergabe „Jahwe“ bewahrt diesen, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe der Volksbezeichnung בני ישראל
  choice: alle Israeliten
  alternative: alle Söhne Israels
  rationale: Die Wendung fungiert hier als Bezeichnung des gesamten Bundesvolkes. Die natürliche deutsche Volksbezeichnung vermeidet den möglichen Fehlschluss, nur männliche Personen seien angesprochen; die formale Gestalt wird in der Fußnote dokumentiert.
- issue: Bedeutungsbreite von זה הדבר
  choice: Folgendes
  alternative: Dies ist das Wort / Dies ist die Sache
  rationale: „Folgendes“ wahrt die einleitende Funktion, ohne דָּבָר unnötig auf „Wort“ oder „Sache“ festzulegen. Die möglichen formnäheren Wiedergaben werden in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede bleibt direkt, während feste hebräische Wendungen dort idiomatisch wiedergegeben werden, wo eine formale Nachbildung im Deutschen missverständlich oder schwerfällig wäre. Der abschließende Doppelpunkt signalisiert, dass der Wortlaut des Gebots im nächsten Vers folgt; das öffnende Anführungszeichen bleibt deshalb in diesem Einzelvers bewusst ohne Abschluss.
