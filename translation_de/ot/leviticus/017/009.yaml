id: LEV.17.9
reference: Leviticus 17:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אֶל פֶּ֜תַח אֹ֤הֶל מוֹעֵד֙ לֹ֣א יְבִיאֶ֔/נּוּ לַ/עֲשׂ֥וֹת אֹת֖/וֹ לַ/יהוָ֑ה וְ/נִכְרַ֛ת הָ/אִ֥ישׁ הַ/ה֖וּא מֵ/עַמָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/009.yaml
  text: and does not bring it to the entrance of the tent of meeting to offer it to Yahweh[b][a], that man shall be cut off from his people.
translation:
  language: de
  text: und es nicht zum Eingang des Zeltes der Begegnung bringt, um es Jahwe als Opfer darzubringen[a], dann soll dieser Mann aus seinem Volk abgeschnitten werden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher etwa: „um es für Jahwe zu tun/zu machen“; im Opferzusammenhang meint die hebräische Wendung die Darbringung des Opfers.'
    reason: lexical_alternative
  - marker: b
    text: „Abgeschnitten werden“ ist eine rechtliche Formel. Welche Strafe genau damit gemeint ist, wird hier nicht gesagt; denkbar sind die Entfernung aus der Bundesgemeinschaft oder ein unmittelbares göttliches Gericht.
    reason: alternative_reading
lexical_decisions:
- source_word: פֶּתַח
  choice: Eingang
  rationale: פֶּתַח bezeichnet die Öffnung beziehungsweise den Zugang. „Eingang“ ist im Heiligtumskontext natürlich und präzise.
- source_word: אֹהֶל מוֹעֵד
  choice: Zelt der Begegnung
  rationale: Die feste Bezeichnung des Heiligtums wird mit der im Deutschen verständlichen und etablierten Wendung „Zelt der Begegnung“ wiedergegeben.
- source_word: יְבִיאֶנּוּ
  choice: es … bringt
  rationale: Das Suffix bezieht sich auf das Opfertier aus dem vorausgehenden Zusammenhang. „Es bringt“ bewahrt die konkrete Handlung.
- source_word: לַעֲשׂוֹת אֹתוֹ לַיהוָה
  choice: um es Jahwe als Opfer darzubringen
  rationale: Wörtlich bedeutet die Wendung etwa „um es für Jahwe zu tun/zu machen“; im Opferkontext bezeichnet עשה idiomatisch die Darbringung des Opfers. Die Übersetzung macht diesen kultischen Sinn verständlich, während die Fußnote die wörtlichere Fassung dokumentiert.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in der im Deutschen gebräuchlichen Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְנִכְרַת
  choice: soll … abgeschnitten werden
  rationale: Die formelhafte passive Wendung wahrt das Bild von כרת und legt die hier nicht näher bestimmte Art der Strafe nicht fest.
- source_word: הָאִישׁ הַהוּא
  choice: dieser Mann
  rationale: Die hebräische Rechtssprache bezeichnet den einzelnen männlich formulierten Täter ausdrücklich; „dieser Mann“ bildet dies genau ab.
- source_word: מֵעַמָּיו
  choice: aus seinem Volk
  rationale: Die knappe Formulierung bewahrt den Gedanken der Trennung von der eigenen Volks- und Bundesgemeinschaft, ohne ihn näher auszudeuten.
theological_decisions:
- issue: Bedeutung der Strafe „abgeschnitten werden“
  choice: Die formelhafte Aussage bleibt als „aus seinem Volk abgeschnitten werden“ stehen.
  alternative: „aus der Gemeinschaft ausgeschlossen“, „getötet“ oder „vernichtet werden“
  rationale: Der hebräische Rechtssatz bestimmt an dieser Stelle nicht ausdrücklich, ob Ausschluss aus der Gemeinschaft, Tod oder unmittelbares göttliches Gericht gemeint ist. Die Übersetzung bewahrt diese Spannung.
- issue: Wiedergabe von הָאִישׁ
  choice: „dieser Mann“
  alternative: „dieser Mensch“ oder „der Betreffende“
  rationale: Der Ausgangstext verwendet eine ausdrücklich maskuline Singularform. Die gewählte Fassung bewahrt die Form der hebräischen Rechtsaussage.
translation_notes:
  register: Moderne, würdevolle deutsche Rechtssprache. Der Satzanfang mit „und“ wahrt den Anschluss an den vorausgehenden Vers; „dann“ verdeutlicht im Deutschen die Folgerung, ohne den Sinn zu erweitern. Die kultische Wendung wird verständlich wiedergegeben, die unbestimmte Strafandrohung dagegen bewusst nicht präzisiert.
