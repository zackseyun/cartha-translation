id: LEV.21.12
reference: Leviticus 21:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/מִן הַ/מִּקְדָּשׁ֙ לֹ֣א יֵצֵ֔א וְ/לֹ֣א יְחַלֵּ֔ל אֵ֖ת מִקְדַּ֣שׁ אֱלֹהָ֑י/ו כִּ֡י נֵ֠זֶר שֶׁ֣מֶן מִשְׁחַ֧ת אֱלֹהָ֛י/ו עָלָ֖י/ו אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/012.yaml
  text: And he shall not go out from the sanctuary[a], nor shall he profane the sanctuary of his God, because the consecration of the anointing oil of his God is upon him. I am Yahweh.
translation:
  language: de
  text: Er darf das Heiligtum nicht verlassen und das Heiligtum seines Gottes nicht entweihen; denn die Weihe durch das Salböl seines Gottes liegt auf ihm.[a] Ich bin der HERR.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: »das Diadem des Salböls seines Gottes liegt auf ihm«. Das hebräische Wort kann ein »Diadem« oder die damit bezeichnete Weihe meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן הַמִּקְדָּשׁ לֹא יֵצֵא
  choice: Er darf das Heiligtum nicht verlassen
  rationale: מִקְדָּשׁ bezeichnet das Heiligtum; יָצָא bedeutet konkret „hinausgehen“. In dieser Rechtsbestimmung gibt „darf … nicht verlassen“ das Verbot in natürlichem modernem Deutsch wieder.
- source_word: וְלֹא יְחַלֵּל אֵת מִקְדַּשׁ אֱלֹהָיו
  choice: und das Heiligtum seines Gottes nicht entweihen
  rationale: חלל im Piel bedeutet im kultischen Zusammenhang „entweihen“. Die Wiederholung von „Heiligtum“ folgt dem hebräischen Nachdruck.
- source_word: כִּי נֵזֶר שֶׁמֶן מִשְׁחַת אֱלֹהָיו עָלָיו
  choice: denn die Weihe durch das Salböl seines Gottes liegt auf ihm
  rationale: כִּי ist hier begründend. נֵזֶר kann „Diadem/Krone“ oder den dadurch bezeichneten Weihe- bzw. Sonderstatus meinen. „Weihe durch das Salböl“ vermittelt im Kontext den fortdauernden geweihten Status, während die bildlich-konkretere Möglichkeit in der Fußnote erhalten bleibt.
- source_word: אֲנִי יְהוָה
  choice: Ich bin der HERR
  rationale: Die wiederkehrende göttliche Bekräftigungsformel wird vollständig wiedergegeben; der Gottesname wird gemäß etablierter deutscher Bibelkonvention mit „der HERR“ dargestellt.
theological_decisions:
- issue: Bedeutung von נֵזֶר für den Status des Hohepriesters
  choice: „die Weihe durch das Salböl“ im Haupttext
  alternative: „das Diadem des Salböls seines Gottes“
  rationale: Im Zusammenhang begründet der Ausdruck das besondere, fortdauernde Geweihtsein des Hohepriesters. Da נֵזֶר zugleich konkret „Diadem“ bedeuten kann, wird diese echte lexikalische Spannung nicht beseitigt, sondern in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Rechtsbestimmung ist klar und direkt formuliert; die Wiederholung von „Heiligtum“ und die feierliche Schlussformel bleiben erhalten.
