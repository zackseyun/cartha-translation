lexical_decisions:
- source_word: גִבֵּן
  choice: einen Buckel hat
  rationale: Das Wort bezeichnet wahrscheinlich eine Verformung des Rückens. Die Formulierung ist im heutigen Deutsch klar und bewahrt den konkreten körperlichen Sinn.
- source_word: דַק
  choice: kleinwüchsig ist
  rationale: Die genaue Bedeutung ist unsicher; im Zusammenhang bezeichnet das Wort wahrscheinlich eine ungewöhnlich kleine, verkümmerte oder ausgezehrte Körpergestalt. „Kleinwüchsig“ gibt die traditionelle Deutung verständlich wieder, ohne die Unsicherheit zu verschweigen.
- source_word: תְּבַלֻּל בְּעֵינוֹ
  choice: einen Fehler am Auge hat
  rationale: Gemeint ist eine nicht näher bestimmbare Auffälligkeit oder Schädigung des Auges. Die allgemeine Wiedergabe vermeidet eine unbelegte moderne Diagnose.
- source_word: גָרָב
  choice: an Krätze leidet
  rationale: Das Wort bezeichnet eine Hautkrankheit oder einen starken Hautausschlag. „Krätze“ ist eine traditionelle, konkrete Wiedergabe, darf jedoch nicht als sichere moderne Diagnose verstanden werden.
- source_word: יַלֶּפֶת
  choice: an Flechte leidet
  rationale: Das Wort bezeichnet eine weitere, von גָרָב unterschiedene Hautkrankheit. „Flechte“ bewahrt diese Unterscheidung, ohne diagnostische Sicherheit zu beanspruchen.
- source_word: מְרוֹחַ אָשֶׁךְ
  choice: zerquetschte Hoden hat
  rationale: Die Wendung bezeichnet eine Verletzung beziehungsweise Quetschung der Hoden. Die anatomisch direkte Wiedergabe entspricht dem konkreten Hebräisch.
- source_word: אוֹ
  choice: oder
  rationale: Die wiederholte disjunktive Partikel gliedert die einzelnen Merkmale der Aufzählung und wird konsequent mit „oder“ wiedergegeben.
theological_decisions:
- issue: Körperliche Merkmale in einer priesterlichen Heiligkeitsvorschrift
  choice: Direkte körperbezogene Sprache ohne moralische Wertung
  alternative: Euphemistische Formulierungen oder moderne medizinische Fachdiagnosen
  rationale: Der Vers nennt körperliche Zustände im Zusammenhang mit der Zulassung zum Priesterdienst; er erklärt diese nicht zu persönlicher Schuld. Die Übersetzung bewahrt die Konkretheit des Textes, ohne eine moralische Verurteilung oder unbelegte diagnostische Genauigkeit einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Aufzählungsstruktur des Hebräischen bleibt erhalten. Körperliche Zustände werden klar benannt, aber nicht moralisch bewertet; medizinisch unsichere Begriffe werden durch Fußnoten kenntlich gemacht.
