translation:
  language: de
  text: oder einen stark gekrümmten Rücken hat[a] oder von kleiner oder verkümmerter Gestalt ist[b] oder eine Beeinträchtigung am Auge hat[c] oder an einer Hautkrankheit oder an Flechte leidet[d] oder zerquetschte Hoden hat.
