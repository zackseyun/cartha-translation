base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/017.yaml
  text: 'Speak to Aaron[b][a], saying: Any man from your offspring throughout their generations who has a defect shall not come near to offer the food of his God.'
translation:
  language: de
  text: 'Sprich zu Aaron und sage: Wenn einer deiner Nachkommen in irgendeiner Generation einen Makel[a] hat, darf er nicht herantreten, um die Speise[b] seines Gottes darzubringen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Makel“ ist hier ein körperlicher Fehler gemeint, der für diesen priesterlichen Dienst ausschließt.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „das Brot seines Gottes“; im priesterlichen Zusammenhang bezeichnet „Brot“ die Opferspeise im weiteren Sinn.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל־אַהֲרֹן לֵאמֹר
  choice: Rede zu Aaron und sage
  rationale: Gibt die hebräische Einleitungsformel für direkte Rede nah am Wortlaut und zugleich in natürlichem Deutsch wieder.
- source_word: אִישׁ מִזַּרְעֲךָ
  choice: Ein Mann von deinen Nachkommen
  rationale: Bewahrt den maskulinen Singular und den Bezug auf einen männlichen Nachkommen Aarons, der grundsätzlich für den Priesterdienst infrage kommt.
- source_word: לְדֹרֹתָם
  choice: über ihre Generationen hinweg
  rationale: Drückt die fortdauernde Geltung für die aufeinanderfolgenden Generationen der Nachkommenschaft Aarons aus.
- source_word: מוּם
  choice: Makel
  rationale: Bezeichnet hier einen körperlichen Fehler, der für diese priesterliche Aufgabe disqualifiziert. „Makel“ wahrt den kultisch-rechtlichen Ausdruck; eine Fußnote grenzt ihn gegen eine moralische Deutung ab.
- source_word: לֹא יִקְרַב
  choice: darf nicht herantreten
  rationale: Bewahrt die kultische Annäherungssprache von קרב und gibt das rechtliche Verbot idiomatisch wieder.
- source_word: לְהַקְרִיב
  choice: darzubringen
  rationale: Das Hifil von קרב bezeichnet hier das Darbringen eines Opfers; „darbringen“ ist im deutschen Opferkontext präzise und würdig.
- source_word: לֶחֶם אֱלֹהָיו
  choice: die Speise seines Gottes
  rationale: לֶחֶם bedeutet wörtlich „Brot“, bezeichnet in diesem priesterlichen Zusammenhang aber weiter gefasst die als Opfer dargebrachte Speise.
theological_decisions:
- issue: Kultische Einschränkung für Priester mit körperlichem Makel
  choice: Die Aussage wird als Verbot des Herantretens zum Darbringen der Opferspeise wiedergegeben.
  alternative: Die Formulierung als allgemeine Ausgrenzung oder als Aussage über moralische Schuld beziehungsweise geringeren persönlichen Wert verstehen.
  rationale: Der Vers regelt eine bestimmte priesterliche Funktion im Heiligtum. Er trifft keine ausdrückliche Aussage über moralische Schuld, menschlichen Wert oder die Zugehörigkeit zum Bundesvolk.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Ton. Die kultische Fachsprache bleibt erkennbar, ohne unnötig altertümlich zu wirken. Die Fußnotenmarker stehen unmittelbar bei den erklärten Begriffen.
