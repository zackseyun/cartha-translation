source:
  edition: WLC
  text: אִשָּׁ֨ה זֹנָ֤ה וַ/חֲלָלָה֙ לֹ֣א יִקָּ֔חוּ וְ/אִשָּׁ֛ה גְּרוּשָׁ֥ה מֵ/אִישָׁ֖/הּ לֹ֣א יִקָּ֑חוּ כִּֽי קָדֹ֥שׁ ה֖וּא לֵ/אלֹהָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/007.yaml
  text: They shall not take a woman who is a prostitute or defiled, and they shall not take a woman divorced from her husband, for he is holy to his God.
translation:
  language: de
  text: Sie dürfen keine Frau heiraten, die eine Prostituierte oder entweiht ist, und sie dürfen keine Frau heiraten, die von ihrem Mann geschieden wurde; denn der Priester ist seinem Gott heilig.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִקָּחוּ
  choice: heiraten
  rationale: Wörtlich »nehmen« bezeichnet in diesem Zusammenhang die Eheschließung; »heiraten« gibt den gemeinten Vorgang im heutigen Deutsch klar wieder.
- source_word: אִשָּׁה זֹנָה
  choice: eine Frau, die als Prostituierte lebt
  rationale: זוֹנָה bezeichnet eine Prostituierte beziehungsweise eine Frau, die Prostitution ausübt. Die Formulierung ist verständlich und vermeidet ein unnötig abwertendes Etikett.
- source_word: וַחֲלָלָה
  choice: oder entweiht ist
  rationale: חֲלָלָה bezeichnet hier eine Frau, deren heiliger beziehungsweise priesterlicher Status verletzt oder aberkannt ist. »Entweiht« bewahrt den kultisch-rechtlichen Gehalt besser als das allgemeinere »unrein« oder »befleckt«.
- source_word: אִשָּׁה גְּרוּשָׁה מֵאִישָׁהּ
  choice: eine Frau, die von ihrem Mann geschieden wurde
  rationale: Die hebräische Wendung beschreibt eine vom Ehemann entlassene beziehungsweise geschiedene Frau; die passive Form erhält diese Perspektive.
- source_word: כִּי קָדֹשׁ הוּא לֵאלֹהָיו
  choice: denn der Priester ist seinem Gott heilig
  rationale: Der hebräische Singular wechselt nach den pluralischen Verboten zu einer begründenden Aussage über den einzelnen Priester. Das ausdrücklich eingesetzte Substantiv klärt den Bezug, ohne den Sinn zu verändern.
theological_decisions:
- issue: Bedeutung von חֲלָלָה
  choice: entweiht
  alternative: befleckt / unrein / profaniert
  rationale: Der Begriff gehört zum Wortfeld der Entheiligung und bezeichnet wahrscheinlich einen beschädigten kultisch-rechtlichen Status. Da seine genaue soziale Reichweite umstritten ist, wird keine spezifischere Kategorie in den Text eingetragen.
- issue: Numeruswechsel im Begründungssatz
  choice: »der Priester ist«
  alternative: »sie sind«
  rationale: Der masoretische Text hat ausdrücklich den Singular הוּא. Dieser Wechsel wird bewahrt und durch die Nennung des Priesters verständlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das idiomatische »heiraten« ersetzt das im Deutschen missverständliche wörtliche »eine Frau nehmen«. Der rechtlich-kultische Ausdruck »entweiht« bleibt bewusst knapp und bewahrt die Unbestimmtheit des hebräischen Begriffs.
