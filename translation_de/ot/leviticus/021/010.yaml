  text: וְ/הַ/כֹּהֵן֩ הַ/גָּד֨וֹל מֵ/אֶחָ֜י/ו אֲֽשֶׁר יוּצַ֥ק עַל רֹאשׁ֣/וֹ שֶׁ֤מֶן הַ/מִּשְׁחָה֙ וּ/מִלֵּ֣א אֶת יָד֔/וֹ לִ/לְבֹּ֖שׁ אֶת הַ/בְּגָדִ֑ים אֶת רֹאשׁ/וֹ֙ לֹ֣א יִפְרָ֔ע וּ/בְגָדָ֖י/ו לֹ֥א יִפְרֹֽם־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/010.yaml
  text: And the high priest, who is greater than his brothers[a], on whose head the anointing oil has been poured and whose hand has been filled to wear the garments, shall not let his head hang loose[b], nor shall he tear his garments.
translation:
  language: de
  text: Der Hohepriester aber, der höher steht als seine Brüder, auf dessen Kopf das Salböl gegossen worden ist und dessen Hand gefüllt wurde[a], um die Gewänder anzulegen, darf sein Haar nicht ungepflegt lassen[b] und seine Gewänder nicht zerreißen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „dessen Hand gefüllt wurde“. Das ist eine hebräische Wendung für die Einsetzung in den priesterlichen Dienst.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist ein übliches Trauerzeichen, das Haar ungeordnet zu lassen. Die Wendung kann auch als „seinen Kopf nicht entblößen“ verstanden werden.
    reason: cultural_note
lexical_decisions:
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: der Hohepriester
  rationale: Die etablierte deutsche Bezeichnung gibt das besondere priesterliche Amt präzise und natürlich wieder.
- source_word: מֵאֶחָיו
  choice: der größer ist als seine Brüder
  rationale: Die Präposition מִן wird hier vergleichend verstanden und bezeichnet den Vorrang des Hohepriesters gegenüber den übrigen Priestern; „Brüder“ bewahrt die konkrete männliche Bezugsgruppe.
- source_word: יוּצַק עַל רֹאשׁוֹ שֶׁמֶן הַמִּשְׁחָה
  choice: auf dessen Kopf das Salböl gegossen worden ist
  rationale: Die passive Form und das konkrete Bild des Ausgießens auf den Kopf bleiben erhalten.
- source_word: וּמִלֵּא אֶת יָדוֹ
  choice: dem die Hand gefüllt wurde
  rationale: Die kultische hebräische Einsetzungsformel wird im Haupttext bewahrt; eine Fußnote erklärt ihren idiomatischen Sinn.
- source_word: לִלְבֹּשׁ אֶת הַבְּגָדִים
  choice: damit er die Gewänder trägt
  rationale: Die Zweckangabe wird natürlich wiedergegeben, ohne das im Hebräischen nicht ausdrücklich stehende Adjektiv „priesterlich“ einzufügen.
- source_word: אֶת רֹאשׁוֹ לֹא יִפְרָע
  choice: darf sein Haar nicht ungepflegt lassen
  rationale: Die Wendung bezeichnet wahrscheinlich das Lockerlassen beziehungsweise ungeordnete Lassen des Haupthaars als Trauerzeichen. Die Übersetzung macht den Sinn verständlich, ohne die mögliche Deutung als Entblößen des Kopfes völlig zu verschweigen; diese wird in der Fußnote genannt.
- source_word: וּבְגָדָיו לֹא יִפְרֹם
  choice: und seine Gewänder nicht zerreißen
  rationale: Dies ist eine klare, gegenwärtige deutsche Wiedergabe des üblichen Trauerzeichens.
theological_decisions:
- issue: Wiedergabe der Einsetzungsformel מִלֵּא אֶת יָדוֹ
  choice: Das konkrete Idiom „dem die Hand gefüllt wurde“ bleibt im Haupttext stehen und wird in einer Fußnote erklärt.
  alternative: der in sein Amt eingesetzt/geweiht wurde
  rationale: So bleibt die kultisch bedeutsame Bildsprache des Hebräischen sichtbar, während die Fußnote heutigen Lesern den gemeinten Vorgang erschließt.
- issue: Deutung von מֵאֶחָיו
  choice: größer als seine Brüder
  alternative: aus der Mitte seiner Brüder; der Oberste unter seinen Brüdern
  rationale: Der Vergleichssinn von מִן wird gewahrt, ohne die Art des Vorrangs über das vom Text Gesagte hinaus festzulegen.
- issue: Deutung von לֹא יִפְרָע
  choice: sein Haar nicht ungepflegt lassen
  alternative: seinen Kopf nicht entblößen; sein Haar nicht frei hängen lassen
  rationale: Im Zusammenhang mit dem Zerreißen der Gewänder liegt ein verbotenes Trauerzeichen nahe. Da die genaue Handlung sprachlich nicht völlig eindeutig ist, nennt die Fußnote auch die alternative Deutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem Hebräischen, bleibt aber gut lesbar. Kultische Schlüsselbegriffe und echte Deutungsunsicherheiten werden bewahrt und knapp erläutert.
