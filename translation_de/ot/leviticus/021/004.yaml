  text: לֹ֥א יִטַּמָּ֖א בַּ֣עַל בְּ/עַמָּ֑י/ו לְ/הֵ֖חַלּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/004.yaml
  text: He shall not defile himself as a husband among his people[a], and so profane himself.
translation:
  language: de
  text: Als Ehemann unter seinem Volk darf er sich nicht unrein machen[a] und sich dadurch entweihen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Als angesehener Mann unter seinem Volk darf er sich nicht unrein machen und sich dadurch entweihen.« Die hebräische Wendung ist schwer zu deuten. Manche verstehen sie allgemeiner als Verbot, sich in einer gesellschaftlich herausgehobenen Stellung unrein zu machen, nicht speziell als Ehemann.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִטַּמָּא
  choice: sich unrein machen
  rationale: Die Hitpael-Form von טמא bezeichnet hier das Eintreten ritueller Unreinheit durch den Kontakt mit einem Toten. »Sich unrein machen« ist im Deutschen klar und entspricht dem priesterlichen Reinheitskontext.
- source_word: בַּעַל
  choice: Ehemann
  rationale: בַּעַל kann »Ehemann«, »Herr« oder einen angesehenen Mann bezeichnen. Im Zusammenhang der unmittelbar zuvor genannten nahen Angehörigen ist die relationale Bedeutung »Ehemann« plausibel, ohne dass die schwierige Stelle dadurch als eindeutig ausgegeben wird.
- source_word: בְּעַמָּיו
  choice: unter seinem Volk
  rationale: Die Wiedergabe bleibt nahe am hebräischen Wortlaut. Der Zusammenhang kann dabei auf die eigene Sippe beziehungsweise Verwandtschaft hinweisen.
- source_word: לְהֵחַלּוֹ
  choice: und sich dadurch entheiligen
  rationale: Die Infinitivkonstruktion beschreibt Zweck oder Folge der Verunreinigung. »Entheiligen« bewahrt den Gegensatz zwischen priesterlicher Heiligkeit und Profanierung; »dadurch« macht den Folgesinn im Deutschen verständlich.
theological_decisions:
- issue: Deutung der schwierigen Wendung בַּעַל בְּעַמָּיו
  choice: Das Verbot wird auf den Priester als Ehemann bezogen.
  alternative: 'Er darf sich als angesehener Mann beziehungsweise als Oberhaupt unter seinem Volk nicht unrein machen; oder allgemeiner: Er darf sich unter seinem Volk nicht unrein machen und dadurch entheiligen.'
  rationale: Die hebräische Syntax ist stark verdichtet und lässt mehrere Deutungen zu. Die häufige Bedeutung von בַּעַל als »Ehemann« passt zum Kontext der Ausnahmen für die Verunreinigung beim Tod naher Angehöriger. Die ernst zu nehmende alternative Deutung wird deshalb in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt bewusst knapp und bewahrt die ungewöhnliche hebräische Wendung; die echte Mehrdeutigkeit wird nicht im Haupttext aufgelöst, sondern in der Fußnote kenntlich gemacht.
