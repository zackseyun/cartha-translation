  yaml_path: translation/ot/leviticus/021/019.yaml
  text: or a man who has a broken foot or a broken hand,[a]
translation:
  language: de
  text: oder ein Mann, der einen gebrochenen Fuß oder eine gebrochene Hand hat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »oder ein Mann, bei dem ein Bruch des Fußes oder ein Bruch der Hand vorliegt«.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: אוֹ
  choice: oder
  rationale: Die einfache disjunktive Konjunktion setzt die Aufzählung der körperlichen Beeinträchtigungen fort.
- source_word: אִישׁ
  choice: ein Mann
  rationale: Das maskuline Singularnomen bezeichnet in diesem priesterrechtlichen Zusammenhang einen einzelnen männlichen Priester.
- source_word: אֲשֶׁר יִהְיֶה בוֹ
  choice: der … hat
  rationale: Die hebräische Wendung lautet wörtlich etwa »bei/in dem sich … befindet«; die Besitzkonstruktion mit »hat« gibt sie im Deutschen natürlich und sinngenau wieder.
- source_word: שֶׁבֶר
  choice: gebrochen
  rationale: Das Nomen bezeichnet einen Bruch. In Verbindung mit den Körperteilen ist die adjektivische Wiedergabe »gebrochen« natürlich und verständlich.
- source_word: רָגֶל
  choice: Fuß
  rationale: »Fuß« ist die unmittelbare Grundbedeutung; eine Erweiterung zu »Bein« ist hier nicht kontextuell erforderlich.
- source_word: שֶׁבֶר יָד
  choice: eine gebrochene Hand
  rationale: Die wiederholte Nominalfügung wird parallel wiedergegeben. יָד bezeichnet hier am unmittelbarsten die Hand; für »Arm« besteht kein zwingender Anlass.
