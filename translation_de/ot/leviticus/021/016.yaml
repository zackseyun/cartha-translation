  yaml_path: translation/ot/leviticus/021/016.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: de
  text: 'Und Jahwe sprach zu Mose[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: sprach
  rationale: Das Wayyiqtol von דבר eröffnet ein neues Redeereignis; „sprach“ entspricht der würdevollen deutschen Erzähl- und Offenbarungsformel.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als Eigenname „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: אֶל
  choice: zu
  rationale: Bei Verben des Sprechens ist „zu“ die natürliche deutsche Entsprechung.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: „Mose“ ist die etablierte deutsche Namensform.
- source_word: לֵאמֹר
  choice: durch Doppelpunkt ausgedrückt
  rationale: Die hebräische Redeeinleitung לֵאמֹר kündigt den folgenden Redeinhalt an; im natürlichen modernen Deutsch leistet dies hier der Doppelpunkt ohne ein schwerfälliges „und sagte“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als Eigennamen; die traditionelle Ersetzung wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die formelhafte hebräische Wendung לֵאמֹר wird idiomatisch durch den Doppelpunkt wiedergegeben, da die eigentliche Rede im folgenden Vers beginnt.
