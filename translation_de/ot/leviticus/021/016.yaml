  source_fidelity: „Und Jahwe sprach zu Mose:“ gibt וַיְדַּבֵּר יְהוָה אֶל־מֹשֶׁה לֵאמֹר sachgerecht wieder. Das einleitende Wayyiqtol ist mit „sprach“ angemessen erfasst; „zu Mose“ entspricht אֶל־מֹשֶׁה. Der Doppelpunkt gibt die prospektive Redeformel לֵאמֹר idiomatisch wieder, zumal der Redetext erst im folgenden Vers beginnt.
  naturalness: Die Formulierung ist natürliches, modernes und zugleich würdiges Standarddeutsch. Der Doppelpunkt ist als Anschluss an den folgenden Vers klar und vermeidet ein im Deutschen unnötig formelhaftes „indem er sagte“ oder „mit den Worten“.
