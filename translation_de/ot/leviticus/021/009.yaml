source:
  edition: WLC
  text: וּ/בַת֙ אִ֣ישׁ כֹּהֵ֔ן כִּ֥י תֵחֵ֖ל לִ/זְנ֑וֹת אֶת אָבִ֨י/הָ֙ הִ֣יא מְחַלֶּ֔לֶת בָּ/אֵ֖שׁ תִּשָּׂרֵֽף־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/009.yaml
  text: And the daughter of a priest[a], if she profanes herself by prostituting herself, profanes her father[b]; she shall be burned with fire.
translation:
  language: de
  text: Wenn die Tochter eines Priesters sich entweiht[a], indem sie Hurerei treibt[b], entweiht sie ihren Vater. Sie soll mit Feuer verbrannt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »anfängt, Hurerei zu treiben«. Die hebräische Form kann auch von einem Verb mit der Bedeutung »anfangen« verstanden werden; im Zusammenhang liegt jedoch »sich entweihen« näher.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »sich prostituiert« oder »als Prostituierte handelt«. Das hebräische Verb kann Prostitution bezeichnen, muss aber nicht zwingend eine gewerbsmäßige Form meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַת אִישׁ כֹּהֵן
  choice: Wenn die Tochter eines Priesters
  rationale: Die hebräische Wendung bedeutet idiomatisch »die Tochter eines Priesters«. Das einleitende וּ wird im Deutschen nicht eigens mit »und« wiedergegeben, da der Vers als eigenständige Rechtsbestimmung natürlicher beginnt.
- source_word: כִּי
  choice: wenn
  rationale: כִּי leitet hier den Rechtsfall ein. »Wenn« entspricht dem kasuistischen Charakter und klingt im modernen deutschen Rechtssatz natürlicher als »falls«.
- source_word: תֵחֵל
  choice: sich entweiht
  rationale: Die Form wird hier von חלל im Sinn von »entweiht werden/sich entweihen« verstanden. Die reflexive Formulierung gibt den resultativen Sinn verständlich wieder und bewahrt zugleich den Wortstammbezug zum folgenden מְחַלֶּלֶת.
- source_word: לִזְנוֹת
  choice: indem sie sich prostituiert
  rationale: Der Infinitiv von זנה bezeichnet hier das Handeln als Prostituierte beziehungsweise Hurerei. »Sich prostituieren« ist konkret, modern und stellt die erklärende Beziehung zu תֵחֵל klar heraus.
- source_word: אֶת אָבִיהָ הִיא מְחַלֶּלֶת
  choice: entweiht sie ihren Vater
  rationale: »Entweihen« bewahrt die kultisch-theologische Bedeutung von חלל und die bewusste Wiederaufnahme desselben Wortfeldes; das bloß soziale »entehren« wäre schwächer.
- source_word: בָּאֵשׁ תִּשָּׂרֵף
  choice: Sie soll mit Feuer verbrannt werden
  rationale: Der passive Imperfekt bezeichnet in diesem Rechtstext die vorgeschriebene Strafe. »Mit Feuer« hält sich eng an die hebräische Strafbestimmung, ohne über deren Vollzugsweise hinauszugehen.
theological_decisions:
- issue: Wiedergabe des Wortfeldes חלל im priesterlichen Heiligkeitsrecht
  choice: In beiden Satzteilen »entweihen« verwenden
  alternative: Im ersten Satzteil »sich verunreinigen« und im zweiten »den Vater entehren«
  rationale: Die einheitliche Wiedergabe erhält die sprachliche Verknüpfung zwischen der Tat der Tochter und der Beeinträchtigung der priesterlichen Heiligkeit ihres Vaters, ohne zusätzliche dogmatische Folgerungen einzutragen.
- issue: Art der mit זנה bezeichneten sexuellen Handlung
  choice: »sich prostituieren«
  alternative: »Hurerei treiben« oder allgemeiner »sexuell unmoralisch handeln«
  rationale: Die konkrete Aussage des hebräischen Verbs bleibt erhalten. Die Übersetzung legt jedoch nicht fest, ob zwingend eine gewerbsmäßige Form von Prostitution gemeint ist; diese Bedeutungsbreite wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Moderner, würdevoller Rechtssatz mit bewahrter priesterlicher Heiligkeitsterminologie. Der Satzbau ist gegenüber dem Hebräischen leicht geglättet; die Härte und Unbestimmtheit der Strafbestimmung werden nicht abgeschwächt oder näher erklärt.
