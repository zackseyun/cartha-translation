source:
  edition: WLC
  text: כִּ֥י כָל אִ֛ישׁ אֲשֶׁר בּ֥/וֹ מ֖וּם לֹ֣א יִקְרָ֑ב אִ֤ישׁ עִוֵּר֙ א֣וֹ פִסֵּ֔חַ א֥וֹ חָרֻ֖ם א֥וֹ שָׂרֽוּעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/018.yaml
  text: 'For no man who has a defect shall come near: a blind man[a], or a lame man, or one with a disfigured face[d][c][b], or one with a limb too long.'
translation:
  language: de
  text: 'Denn kein Mann, der ein körperliches Gebrechen[a] hat, darf herantreten[b]: ein Mann, der blind ist oder hinkt, einer mit einer Entstellung im Gesicht[c] oder mit einem überlangen Körperglied[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet hier ein körperliches Gebrechen, das vom Herantreten zum Priesterdienst ausschließt; auch »körperlicher Mangel« oder »Makel« ist möglich.
    reason: lexical_alternative
  - marker: b
    text: Mit dem Herantreten ist hier das Herantreten zum Priesterdienst gemeint.
    reason: cultural_note
  - marker: c
    text: Das seltene hebräische Wort bezeichnet wahrscheinlich eine Entstellung oder Schädigung im Gesicht, möglicherweise genauer an der Nase.
    reason: lexical_alternative
  - marker: d
    text: Das hebräische Wort kann ein übermäßig verlängertes oder unverhältnismäßig geformtes Körperteil bezeichnen; die genaue Bedeutung ist unsicher.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorangehende Bestimmung ein und gibt den erklärenden Zusammenhang natürlich wieder.
- source_word: כָל אִישׁ ... לֹא
  choice: kein Mann
  rationale: Die Verbindung von »jeder Mann« mit der Verneinung ergibt idiomatisch »kein Mann«. Der männliche Bezug bleibt erhalten, weil es im unmittelbaren Zusammenhang um männliche Aaroniden im Priesterdienst geht.
- source_word: אֲשֶׁר בּוֹ מוּם
  choice: der ein körperliches Gebrechen hat
  rationale: מוּם bezeichnet hier eine körperliche Auffälligkeit oder Beeinträchtigung, die vom priesterlichen Herantreten ausschließt. »Körperliches Gebrechen« ist im Deutschen verständlich und bildet den rechtlich-kultischen Kontext ab, ohne lediglich einen oberflächlichen Schönheitsfehler anzudeuten.
- source_word: לֹא יִקְרָב
  choice: darf sich nicht nähern
  rationale: Die modale Formulierung gibt das Verbot im Deutschen natürlich wieder. Das Nähern bezieht sich im Kontext auf den Priesterdienst, ohne dass diese Präzisierung in den Haupttext eingefügt werden muss.
- source_word: אִישׁ עִוֵּר
  choice: keiner, der blind ist
  rationale: Die personenbezogene Formulierung ist natürlich, präzise und weniger etikettierend als das substantivierte Adjektiv »ein Blinder«.
- source_word: פִסֵּחַ
  choice: der hinkt
  rationale: Das Wort bezeichnet eine Einschränkung des Gehens beziehungsweise Lahmheit. Die verbale Wiedergabe ist klares, heutiges Deutsch.
- source_word: חָרֻם
  choice: mit einer Entstellung im Gesicht
  rationale: Das seltene Wort bezeichnet wahrscheinlich eine Verstümmelung oder Fehlbildung, möglicherweise besonders an der Nase. Die Übersetzung wahrt die wahrscheinliche Bedeutung, ohne ungesicherte anatomische Genauigkeit vorzutäuschen.
- source_word: שָׂרוּעַ
  choice: mit einem überlangen Körperglied
  rationale: Das Wort weist wahrscheinlich auf ein übermäßig verlängertes oder unverhältnismäßiges Körperteil hin. Die konkrete Wiedergabe folgt dem wahrscheinlichsten Sinn; die verbleibende Unsicherheit wird in der Fußnote genannt.
theological_decisions:
- issue: Reichweite der Einschränkung im Priestergesetz
  choice: Die Aussage wird als kultische Voraussetzung für das Herantreten zum Priesterdienst wiedergegeben.
  alternative: Der Vers könnte als allgemeine soziale Ausgrenzung oder als Urteil über den persönlichen beziehungsweise moralischen Wert verstanden werden.
  rationale: Der hebräische Zusammenhang beschränkt die Regel auf das priesterliche Herantreten. Die Übersetzung fügt weder eine Aussage über persönliche Würde noch einen Zusammenhang mit Schuld oder Sünde hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Personenbezogene Formulierungen wie »der blind ist« vermeiden unnötige Etikettierung. Die kultisch-rechtliche Knappheit des Ausgangstextes bleibt erhalten; seltene und unsichere Körperbezeichnungen werden im Haupttext lesbar und in den Fußnoten vorsichtig erläutert.
