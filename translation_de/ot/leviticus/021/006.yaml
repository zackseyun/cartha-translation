review_pass:
  verdict: approve
  source_fidelity: 'Die Übersetzung gibt die hebräische Satzfolge und den kultischen Sinn zuverlässig wieder: die priesterliche Heiligkeit in Beziehung zu ihrem Gott, das Verbot, seinen Namen zu entweihen, die Begründung durch das Darbringen der Opfer und die abschließende Heiligkeitsforderung. „Feueropfer“ ist für אִשֵּׁי eine sachgerechte, transparente Wiedergabe; „Speise ihres Gottes“ wahrt die kultische Metapher von לֶחֶם, ohne sie auf Brot zu verengen.'
  naturalness: Der Text ist modernes, würdiges und gut verständliches Standarddeutsch. „Sie sollen ihrem Gott heilig sein“, „den Namen ihres Gottes nicht entweihen“ und „bringen … dar“ sind idiomatisch. Die Wiederholung von „heilig“ bewahrt den Nachdruck des Hebräischen.
  terminology: „Jahwe“ gibt den Gottesnamen יהוה konsistent als Eigennamen wieder. „Entweihen“ erhält den kultischen Gegensatz von heilig und profan. Die Begriffskombination „Jahwes Feueropfer, die Speise ihres Gottes“ bildet die appositionelle kultische Ausdrucksweise des Ausgangstextes angemessen ab. Die Fußnote erläutert die wörtlichere Möglichkeit „Brot“ und ist sinnvoll am betroffenen Ausdruck verankert.
