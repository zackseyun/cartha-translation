id: LEV.21.6
reference: Leviticus 21:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: קְדֹשִׁ֤ים יִהְיוּ֙ לֵ/אלֹ֣הֵי/הֶ֔ם וְ/לֹ֣א יְחַלְּל֔וּ שֵׁ֖ם אֱלֹהֵי/הֶ֑ם כִּי֩ אֶת אִשֵּׁ֨י יְהוָ֜ה לֶ֧חֶם אֱלֹהֵי/הֶ֛ם הֵ֥ם מַקְרִיבִ֖ם וְ/הָ֥יוּ קֹֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/006.yaml
  text: They shall be holy to their God and shall not profane the name of their God[a], because they present the food offerings of Yahweh, the food of their God; therefore they shall be holy.
translation:
  language: de
  text: Sie sollen ihrem Gott heilig sein und den Namen ihres Gottes nicht entweihen; denn sie bringen Jahwes Feueropfer dar, die Speise ihres Gottes.[a] Darum sollen sie heilig sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Jahwes Feueropfer, das Brot ihres Gottes“. „Brot“ bezeichnet hier die als Opfer dargebrachte Speise.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קְדֹשִׁים יִהְיוּ לֵאלֹהֵיהֶם
  choice: Sie sollen ihrem Gott heilig sein
  rationale: Gibt die kultisch-ethische Heiligkeit und den verpflichtenden Sinn des Imperfekts in natürlichem, würdigem Deutsch wieder.
- source_word: יְחַלְּלוּ
  choice: entweihen
  rationale: Bewahrt den Gegensatz zwischen heilig und profan und ist im Deutschen verständlicher und idiomatischer als „profanieren“.
- source_word: אִשֵּׁי יְהוָה
  choice: Jahwes Feueropfer
  rationale: אִשִּׁים ist ein kultischer Fachausdruck für Feueropfer beziehungsweise durch Feuer dargebrachte Opfer; „Feueropfer“ wahrt diese konkrete Bedeutung.
- source_word: לֶחֶם אֱלֹהֵיהֶם
  choice: die Speise ihres Gottes
  rationale: לֶחֶם kann zwar „Brot“ heißen, bezeichnet hier im Opferkontext allgemeiner die dargebrachte Speise.
- source_word: מַקְרִיבִם
  choice: sie bringen … dar
  rationale: Der Hifil-Partizip von קרב bezeichnet das Heranbringen beziehungsweise Darbringen eines Opfers; „darbringen“ ist im Deutschen präzise und idiomatisch.
- source_word: וְהָיוּ קֹדֶשׁ
  choice: Darum sollen sie heilig sein
  rationale: Das abschließende ו kann im Zusammenhang folgernd verstanden werden; „Darum“ macht den durch כִּי begründeten Gedankengang deutlich, ohne die Forderung abzuschwächen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Kultische Wendung אִשֵּׁי יְהוָה לֶחֶם אֱלֹהֵיהֶם
  choice: Jahwes Feueropfer, die Speise ihres Gottes
  alternative: die Speiseopfer Jahwes, das Brot ihres Gottes
  rationale: Die gewählte Fassung bewahrt sowohl den technischen Bezug auf das Feuer als auch das Bild der göttlichen „Speise“, ohne anzudeuten, Gott sei auf Nahrung angewiesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kultische Fachsprache bleibt erkennbar, wird aber durch die Fußnote verständlich gemacht. Die Wiederholung von „heilig“ am Anfang und Ende wurde als prägendes Stilmerkmal des hebräischen Textes bewahrt.
