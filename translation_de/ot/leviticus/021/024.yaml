  text: וַ/יְדַבֵּ֣ר מֹשֶׁ֔ה אֶֽל אַהֲרֹ֖ן וְ/אֶל בָּנָ֑י/ו וְ/אֶֽל כָּל בְּנֵ֖י יִשְׂרָאֵֽל־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/024.yaml
  text: So Moses spoke to Aaron and to his sons and to all the sons of Israel[a].
translation:
  language: de
  text: So sprach Mose zu Aaron, zu seinen Söhnen und zu allen Israeliten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Söhne Israels«; traditionell auch: »Kinder Israels«. Die hebräische Wendung ist eine feste Bezeichnung für das Volk Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: So sprach Mose
  rationale: Das Waw-Konsekutiv führt die Erzählung fort; am Ende des Abschnitts gibt »so« zugleich den zusammenfassenden Charakter natürlich wieder.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition bezeichnet hier die Adressaten der Rede; »zu« ist die direkte und idiomatische deutsche Wiedergabe.
- source_word: בָּנָיו
  choice: seinen Söhnen
  rationale: Der maskuline Plural mit Suffix der 3. Person Singular bezeichnet ausdrücklich Aarons Söhne.
- source_word: כָּל
  choice: allen
  rationale: כָּל umfasst hier die gesamte nachfolgend bezeichnete Gruppe.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Israeliten
  rationale: Die wörtliche Form lautet »Söhne Israels«, fungiert aber als feste Volksbezeichnung. »Israeliten« gibt diese Bedeutung im modernen Deutschen klar und natürlich wieder, ohne die Zugehörigkeit von Frauen zum angesprochenen Volk auszublenden; die Quellform bleibt in der Fußnote erhalten.
theological_decisions:
- issue: Wiedergabe der Bundes- und Volksbezeichnung בְּנֵי יִשְׂרָאֵל
  choice: Israeliten
  alternative: Söhne Israels; Kinder Israels
  rationale: Die Wendung bezeichnet kollektiv das Volk Israel. »Israeliten« ist im heutigen Deutschen die natürliche, sachlich genaue Volksbezeichnung. Die wörtliche maskuline Form wird in einer Fußnote dokumentiert, damit ihre sprachliche und bundestheologische Prägung sichtbar bleibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Schlussformel des hebräischen Verses bleibt erhalten; »Israeliten« vermeidet im Deutschen die missverständliche Beschränkung auf männliche Angehörige, während die wörtliche Form in der Fußnote ausgewiesen wird.
