  text: וְ/עַ֛ל כָּל נַפְשֹׁ֥ת מֵ֖ת לֹ֣א יָבֹ֑א לְ/אָבִ֥י/ו וּ/לְ/אִמּ֖/וֹ לֹ֥א יִטַּמָּֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/011.yaml
  text: He shall not go near any dead body[a]; he shall not make himself unclean even for his father or for his mother.
translation:
  language: de
  text: Er darf sich keinem Toten[a] nähern; selbst wegen seines Vaters oder seiner Mutter darf er sich nicht unrein machen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „keinem Leichnam“. Wörtlich steht eine ungewöhnliche Wendung, die etwa „tote Personen“ bedeutet und in den Reinheitsvorschriften menschliche Leichname bezeichnet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל ... לֹא יָבֹא
  choice: Er darf sich ... nicht nähern
  rationale: בוא mit עַל bezeichnet hier im Kontext priesterlicher Reinheitsvorschriften das Herantreten an einen Toten. Die deutsche Verbfügung gibt das Verbot natürlich und präzise wieder.
- source_word: כָּל
  choice: keinem
  rationale: In Verbindung mit der Verneinung drückt „keinem“ das umfassende Verbot idiomatisch aus.
- source_word: נַפְשֹׁת מֵת
  choice: Toten
  rationale: Die ungewöhnliche Wendung bezeichnet im Kontext der Reinheitsgesetze einen verstorbenen Menschen beziehungsweise dessen Leichnam. „Toten“ ist würdig und natürlich; die sachlich genauere Alternative „Leichnam“ wird in der Fußnote genannt.
- source_word: לְאָבִיו וּלְאִמּוֹ
  choice: selbst wegen seines Vaters oder seiner Mutter
  rationale: ל bezeichnet hier den Anlass beziehungsweise den betreffenden Angehörigen. „Selbst“ macht die im Satz angelegte Zuspitzung auf die engsten Angehörigen deutlich, ohne eine Ausnahme einzuführen.
- source_word: לֹא יִטַּמָּא
  choice: darf er sich nicht unrein machen
  rationale: Der Hitpael ist reflexiv. „Sich unrein machen“ bewahrt die Terminologie ritueller Unreinheit und vermeidet eine vorschnelle Moralisierung.
theological_decisions:
- issue: Terminologie ritueller Unreinheit
  choice: „sich nicht unrein machen“
  alternative: „sich nicht verunreinigen“ oder „nicht kultisch unrein werden“
  rationale: Die Formulierung erhält die Kategorie der levitischen Reinheitsordnung, ohne sie mit persönlicher Sündhaftigkeit gleichzusetzen. „Kultisch“ wäre eine erklärende Ergänzung, die im hebräischen Text nicht ausdrücklich steht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rechtliche Verbindlichkeit wird mit „darf nicht“ ausgedrückt; die Sprache der Unreinheit bleibt als biblische Reinheitskategorie erhalten.
