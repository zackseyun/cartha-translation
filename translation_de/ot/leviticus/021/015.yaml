base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/015.yaml
  text: He shall not profane his offspring among his people[c][b][a], for I am Yahweh who sanctifies him.
translation:
  language: de
  text: Er soll seine Nachkommenschaft unter seinem Volk nicht entweihen[a][b]; denn ich bin Jahwe, der ihn heiligt.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „nicht profan machen“ oder „nicht unheilig machen“. Das hebräische Verb bezeichnet, etwas Heiliges profan zu machen.'
    reason: lexical_alternative
  - marker: b
    text: Im Zusammenhang der Ehevorschriften kann dies darauf hinweisen, dass eine verbotene Ehe seine Nachkommenschaft innerhalb der Gemeinschaft entweihen würde.
    reason: cultural_note
  - marker: c
    text: 'Auch: „der ihn heilig macht“ oder „der ihn weiht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְחַלֵּל
  choice: entweihen
  rationale: Das Piel von חלל bezeichnet im priesterlichen Heiligkeitskontext, etwas Heiliges profan beziehungsweise unheilig zu machen. „Entweihen“ bewahrt diesen kultisch-theologischen Sinn in natürlichem Deutsch.
- source_word: זַרְעוֹ
  choice: seine Nachkommen
  rationale: זֶרַע kann „Same“, „Nachkommenschaft“ oder „Nachkommen“ bedeuten. Im Zusammenhang der Ehebestimmungen und der priesterlichen Linie ist „Nachkommen“ verständlich und genealogisch passend.
- source_word: בְּעַמָּיו
  choice: unter seinem Volk
  rationale: Die Verbindung von ב mit עַם und dem Suffix der 3. Person Singular wird sachgerecht mit „unter seinem Volk“ wiedergegeben und erhält den gemeinschaftlichen Bezug.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מְקַדְּשׁוֹ
  choice: der ihn heiligt
  rationale: Das Partizip von קדשׁ bezeichnet hier den, der heilig macht beziehungsweise absondert. „Der ihn heiligt“ bewahrt die Heiligkeitsterminologie und den fortdauernden Charakter der Aussage.
theological_decisions:
- issue: Bezug des Verbots und der Heiligkeitsbegründung
  choice: Der Priester soll seine Nachkommen innerhalb seines Volkes nicht entweihen, weil Jahwe ihn heiligt.
  alternative: Der Vers kann enger so verstanden werden, dass der Hohepriester durch eine verbotene Ehe seine Nachkommen für den Priesterdienst untauglich macht.
  rationale: Der unmittelbare Zusammenhang betrifft die Ehevorschriften für den Hohepriester. Der hebräische Wortlaut formuliert jedoch allgemeiner und spricht nicht ausdrücklich von der Aberkennung des Priesterstatus; deshalb bleibt diese Spannung im Haupttext erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Entweihen“ und „heiligt“ erhalten das zentrale Wortfeld von profan und heilig; die Satzstruktur bleibt eng am Hebräischen, ohne unnatürlich zu wirken.
