id: LEV.21.8
reference: Leviticus 21:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/קִדַּשְׁתּ֔/וֹ כִּֽי אֶת לֶ֥חֶם אֱלֹהֶ֖י/ךָ ה֣וּא מַקְרִ֑יב קָדֹשׁ֙ יִֽהְיֶה לָּ֔/ךְ כִּ֣י קָד֔וֹשׁ אֲנִ֥י יְהוָ֖ה מְקַדִּשְׁ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/008.yaml
  text: You shall treat him as holy[a], because he offers the food of your God. He shall be holy to you, for I, Yahweh who sanctify you, am holy.
translation:
  language: de
  text: Du sollst ihn als heilig behandeln, denn er bringt die Nahrung[a] deines Gottes dar. Er soll dir heilig sein, denn ich, Jahwe, der euch heiligt, bin heilig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das Brot deines Gottes“. Im Zusammenhang sind damit wahrscheinlich die Gott dargebrachten Speise- und Opfergaben insgesamt gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתּוֹ
  choice: Du sollst ihn als heilig behandeln
  rationale: Das Piel von קדשׁ fordert hier dazu auf, den Priester als heilig anzuerkennen und entsprechend zu behandeln. Die Formulierung ist natürliches modernes Deutsch und bewahrt den verpflichtenden Charakter.
- source_word: לֶחֶם אֱלֹהֶיךָ
  choice: die Nahrung[a] deines Gottes
  rationale: לֶחֶם bedeutet wörtlich „Brot“, kann im priesterlichen Opferkontext aber umfassender die Gott dargebrachte Opfernahrung bezeichnen. „Nahrung“ gibt diesen kultischen Sinn wieder; die wörtliche Alternative bleibt in der Fußnote sichtbar.
- source_word: מַקְרִיב
  choice: er bringt ... dar
  rationale: Das Hifil-Partizip von קרב bezeichnet im Opferkontext das Darbringen einer Gabe. „Darbringen“ ist im Deutschen klar, würdig und kultisch passend.
- source_word: קָדֹשׁ יִהְיֶה לָּךְ
  choice: Er soll dir heilig sein
  rationale: Die Wendung erhält sowohl die Aussage über den heiligen Status des Priesters als auch den relationalen Dativ לָּךְ.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מְקַדִּשְׁכֶם
  choice: der euch heiligt
  rationale: „Heiligt“ bewahrt die Wortverbindung zu „heilig“ und gibt das Partizip als kennzeichnendes, fortdauerndes Handeln Jahwes wieder.
theological_decisions:
- issue: Kultischer Ausdruck לֶחֶם אֱלֹהֶיךָ
  choice: die Nahrung deines Gottes
  alternative: das Brot deines Gottes
  rationale: Im Zusammenhang des Priesterdienstes bezeichnet לֶחֶם wahrscheinlich die Opfernahrung insgesamt und nicht nur Brot. Die wörtliche Lesart wird dennoch nicht ausgeschlossen, sondern in einer Fußnote genannt.
- issue: Wiederholung des Wortfeldes קדשׁ
  choice: heilig / heiligt
  alternative: geweiht / weiht
  rationale: Die wiederholte Sprache von Heiligkeit verbindet die Behandlung des Priesters, seinen Status, Jahwes Wesen und Jahwes Handeln am Volk. Diese innere Verknüpfung bleibt im Deutschen deutlich.
- issue: Wechsel zwischen Singular und Plural in den Anredeformen
  choice: deines / dir; euch
  alternative: durchgehend singularische oder pluralische Anrede
  rationale: Der hebräische Text wechselt von singularischer Anrede in Bezug auf den einzelnen Israeliten beziehungsweise Israel als Kollektiv zu pluralischem „euch“ bei Jahwes heiligendem Handeln. Dieser Wechsel wird nicht geglättet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Als heilig behandeln“ vermeidet unnötig technische Sakralsprache, während „darbringen“ und „heiligt“ den priesterlichen Kontext und die wiederholte Heiligkeitssprache bewahren.
