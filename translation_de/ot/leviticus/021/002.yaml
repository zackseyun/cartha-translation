    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: außer an
  rationale: Die Verbindung leitet im rechtlichen Zusammenhang eine Ausnahme vom Verbot des vorhergehenden Verses ein. „Außer“ gibt diese einschränkende Funktion natürlich wieder; „an“ schließt an das Verunreinigen an einem Toten an.
- source_word: שְׁאֵרוֹ
  choice: seinem Blutsverwandten
  rationale: שְׁאֵר bezeichnet hier einen nahen Angehörigen und trägt wörtlich den Gedanken von „Fleisch“ beziehungsweise leiblicher Verwandtschaft. „Blutsverwandter“ bewahrt diesen familiären Sinn in verständlichem Deutsch.
- source_word: הַקָּרֹב אֵלָיו
  choice: nächsten
  rationale: Die Wendung bestimmt den Grad der verwandtschaftlichen Nähe. Das attributive „nächsten“ ist im Deutschen knapp und idiomatisch.
- source_word: לְאִמּוֹ וּלְאָבִיו וְלִבְנוֹ וּלְבִתּוֹ וּלְאָחִיו
  choice: an seiner Mutter, seinem Vater, seinem Sohn, seiner Tochter und seinem Bruder
  rationale: Die wiederholte Präposition לְ bezeichnet die Personen, bei deren Tod die Verunreinigung gestattet ist. Im Deutschen genügt das einmal gesetzte „an“ für die gesamte Aufzählung; Geschlecht und Singularformen bleiben erhalten.
