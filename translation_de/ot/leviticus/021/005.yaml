source:
  edition: WLC
  text: לֹֽא יקרחה קָרְחָה֙ בְּ/רֹאשָׁ֔/ם וּ/פְאַ֥ת זְקָנָ֖/ם לֹ֣א יְגַלֵּ֑חוּ וּ/בִ֨/בְשָׂרָ֔/ם לֹ֥א יִשְׂרְט֖וּ שָׂרָֽטֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/005.yaml
  text: They shall not make a bald patch on their head[a], nor shave off the edge of their beard, nor make cuts in their flesh.
translation:
  language: de
  text: Sie sollen sich auf dem Kopf keine kahle Stelle machen, den Rand[a] ihres Bartes nicht abrasieren und keine Einschnitte in ihr Fleisch machen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Seite« oder »die Ecke«. Das hebräische Wort kann einen Rand, eine Seite oder eine Ecke bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקְרְחוּ קָרְחָה
  choice: sich … keine kahle Stelle machen
  rationale: Die Verbindung aus Verb und stammverwandtem Substantiv bezeichnet das absichtliche Erzeugen einer kahlen Stelle. Die Wiedergabe ist im Deutschen natürlich und unterscheidet die Handlung von natürlichem Haarausfall, ohne eine im Verb nicht ausdrücklich genannte Methode festzulegen.
- source_word: בְּרֹאשָׁם
  choice: auf dem Kopf
  rationale: 'Das Hebräische hat ein Substantiv im Singular mit pluralischem Suffix. Der deutsche Singular wird hier distributiv verstanden: Jeder Einzelne ist gemeint.'
- source_word: פְאַת זְקָנָם
  choice: den Rand ihres Bartes
  rationale: פֵּאָה kann einen Rand, eine Seite oder eine Ecke bezeichnen. »Rand« bewahrt die räumliche Vorstellung, ohne eine bestimmte Bartform oder Rasierpraxis vorauszusetzen.
- source_word: יְגַלֵּחוּ
  choice: abrasieren
  rationale: Die Piel-Form bezeichnet hier das Entfernen der Haare durch Rasieren. »Abrasieren« bringt den Entfernungssinn knapp und idiomatisch zum Ausdruck.
- source_word: וּבִבְשָׂרָם
  choice: ins Fleisch
  rationale: בָּשָׂר bedeutet konkret »Fleisch«. Diese Wiedergabe erhält die körperliche Anschaulichkeit des hebräischen Ausdrucks.
- source_word: יִשְׂרְטוּ שָׂרָטֶת
  choice: sich keine Schnitte … ritzen
  rationale: Die Verbindung aus Verb und stammverwandtem Substantiv bezeichnet absichtliche Einschnitte oder Ritzwunden. Die Formulierung ist klar und gegenwärtig, ohne klinisch oder erklärend zu werden.
theological_decisions:
- issue: Anlass und Charakter der verbotenen Handlungen
  choice: Die konkreten Veränderungen an Haar, Bart und Körper werden ohne ergänzende Zweckangabe wiedergegeben.
  alternative: Die Handlungen ausdrücklich als Trauerbräuche oder als Handlungen für Verstorbene bezeichnen.
  rationale: Der Vers selbst nennt keinen Anlass wie »für einen Toten«. Eine solche Erklärung aus Parallelstellen würde den vorliegenden Wortlaut im Haupttext erweitern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Verbote bleiben knapp und konkret; die distributiven Singularformen »Kopf« und »Bart« sind im Deutschen natürlich. Die Fußnote bewahrt die räumliche Unschärfe von פֵּאָה.
