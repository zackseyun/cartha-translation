  text: כָּל אִ֞ישׁ אֲשֶׁר בּ֣/וֹ מ֗וּם מִ/זֶּ֨רַע֙ אַהֲרֹ֣ן הַ/כֹּהֵ֔ן לֹ֣א יִגַּ֔שׁ לְ/הַקְרִ֖יב אֶת אִשֵּׁ֣י יְהוָ֑ה מ֣וּם בּ֔/וֹ אֵ֚ת לֶ֣חֶם אֱלֹהָ֔י/ו לֹ֥א יִגַּ֖שׁ לְ/הַקְרִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/021.yaml
  text: No man from the offspring of Aaron the priest who has a defect shall come near to offer the food offerings of Yahweh[a]. A defect is in him[b]; he shall not come near to offer the bread of his God.
translation:
  language: de
  text: Kein Mann von den Nachkommen Aarons, des Priesters, der einen Makel hat, darf herantreten, um die Feueropfer Jahwes[a] darzubringen. Er hat einen Makel; er darf nicht herantreten, um das Brot seines Gottes[b] darzubringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Opfergaben als Speise für Jahwe“. Der hebräische Ausdruck wird traditionell auch mit „Feueropfer“ wiedergegeben und verbindet den Opferdienst mit der Vorstellung einer Gott dargebrachten Speise.'
    reason: lexical_alternative
  - marker: b
    text: '„Das Brot seines Gottes“ ist eine priesterliche Ausdrucksweise für die Gott im Opfer dargebrachte Speise; daher auch: „die Speise seines Gottes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אִישׁ ... לֹא
  choice: Kein Mann ... darf
  rationale: Die Verbindung von כָּל אִישׁ mit der Verneinung formuliert ein ausnahmsloses Verbot. „Mann“ entspricht der männlichen Einzahl und dem Zusammenhang des männlichen Priestertums.
- source_word: מוּם
  choice: Makel
  rationale: Das Wort bezeichnet hier eine körperliche Beeinträchtigung, die nach dem vorliegenden Kultgesetz vom Altardienst ausschließt. „Makel“ hält die rechtlich-kultische Wertung des Ausgangstextes fest, ohne sie über den Text hinaus auszuweiten.
- source_word: מִזֶּרַע אַהֲרֹן הַכֹּהֵן
  choice: von den Nachkommen Aarons, des Priesters
  rationale: זֶרַע bezeichnet hier die Abstammungslinie; die Apposition „des Priesters“ bleibt auf Aaron bezogen.
- source_word: יִגַּשׁ
  choice: darf herantreten
  rationale: נגשׁ bezeichnet im kultischen Zusammenhang das Herantreten zum priesterlichen Dienst. Mit „darf“ wird die negative Rechtsvorschrift natürlich auf Deutsch wiedergegeben; die Wiederholung des Verbs bleibt erhalten.
- source_word: לְהַקְרִיב
  choice: darzubringen
  rationale: הקריב ist der übliche kultische Ausdruck für das Präsentieren beziehungsweise Darbringen eines Opfers.
- source_word: אִשֵּׁי יְהוָה
  choice: die Feueropfer Jahwes
  rationale: אִשֶּׁה ist ein kultischer Fachausdruck für eine durch Feuer dargebrachte Opfergabe. „Feueropfer“ wahrt diesen Bezug; die mögliche Speisevorstellung wird in der Fußnote genannt.
- source_word: לֶחֶם אֱלֹהָיו
  choice: das Brot seines Gottes
  rationale: לֶחֶם bedeutet wörtlich „Brot“, bezeichnet in priesterlicher Sprache hier aber umfassender die Gott dargebrachte Opferspeise. Die wörtliche Kultmetapher bleibt im Haupttext erhalten und wird in der Fußnote erläutert.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird im Deutschen in seiner geläufigen wissenschaftlichen Form wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Namen, statt ihn durch den traditionellen Ersatztitel wiederzugeben.
- issue: Charakter des Verbots
  choice: kultische Einschränkung des Herantretens zum Opferdienst
  alternative: allgemeine religiöse oder soziale Ausgrenzung
  rationale: Der Vers beschränkt ausdrücklich das Herantreten zum Darbringen der Opfergaben. Die Übersetzung weitet diese konkrete kultische Vorschrift nicht zu einer allgemeinen Aussage über den Wert oder die Zugehörigkeit der betroffenen Person aus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener kultischer Fachsprache. Die Wiederholung von „Makel“ und „herantreten“ bildet die nachdrückliche Wiederholung des Hebräischen ab; „deshalb“ macht den im zweiten Satz implizierten Folgezusammenhang im Deutschen deutlich.
