source:
  edition: WLC
  text: וְ/לַ/אֲחֹת֤/וֹ הַ/בְּתוּלָה֙ הַ/קְּרוֹבָ֣ה אֵלָ֔י/ו אֲשֶׁ֥ר לֹֽא הָיְתָ֖ה לְ/אִ֑ישׁ לָ֖/הּ יִטַּמָּֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/003.yaml
  text: and for his virgin sister who is near to him[a], who has not belonged to a man, he may make himself unclean.
translation:
  language: de
  text: und wegen seiner jungfräulichen Schwester, die ihm nahesteht und noch keinem Mann verbunden war[a], darf er sich unrein machen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „noch keinen Ehemann hatte“ beziehungsweise „noch mit keinem Mann verbunden gewesen war“. Die hebräische Wendung ist idiomatisch und meint, dass sie noch keine eheliche oder geschlechtliche Verbindung mit einem Mann eingegangen war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַאֲחֹתוֹ
  choice: und wegen seiner Schwester
  rationale: 'Die Präposition führt einen weiteren Ausnahmefall an: Wegen dieser nahen Angehörigen darf der Priester die sonst verbotene Totenunreinheit auf sich nehmen.'
- source_word: הַבְּתוּלָה
  choice: jungfräulichen
  rationale: בְּתוּלָה bezeichnet hier unmittelbar die sexuelle beziehungsweise eheliche Unberührtheit der Schwester; „jungfräulich“ bewahrt diesen für die Rechtsbestimmung wichtigen Aspekt.
- source_word: הַקְּרוֹבָה אֵלָיו
  choice: die ihm nahesteht
  rationale: Die Formulierung wahrt das hebräische Bild der Nähe und bezeichnet hier vor allem die enge familiäre Zugehörigkeit, ohne sie ausschließlich als räumliche oder emotionale Nähe festzulegen.
- source_word: אֲשֶׁר לֹא הָיְתָה לְאִישׁ
  choice: noch keinem Mann verbunden war
  rationale: Die hebräische Wendung lautet formal etwa „die keinem Mann zugehörig geworden ist“ und kann Ehe beziehungsweise geschlechtliche Verbindung bezeichnen. Die gewählte Formulierung bleibt natürlich und lässt den Umfang des Idioms offen; die Fußnote nennt engere Wiedergaben.
- source_word: יִטַּמָּא
  choice: darf er sich unrein machen
  rationale: Im Zusammenhang erlaubt die Form eine Ausnahme vom Verbot der Verunreinigung durch einen Toten. „Unrein“ bezeichnet dabei einen kultisch-rituellen Status und keine moralische Schuld.
theological_decisions:
- issue: Art der Unreinheit im priesterlichen Gesetz
  choice: „sich unrein machen“ als rituelle Unreinheit
  alternative: „sich entweihen“ als moralisch oder sakral schuldhafte Verunreinigung
  rationale: Der Zusammenhang regelt die durch Kontakt mit Toten entstehende kultische Unreinheit. Die Übersetzung vermeidet deshalb den Eindruck, die ausdrücklich erlaubte Handlung sei an sich eine moralische Verfehlung.
- issue: Bedeutung der Verbindung mit einem Mann
  choice: Die idiomatische Offenheit zwischen Ehezugehörigkeit und geschlechtlicher Verbindung bleibt erhalten.
  alternative: Die Wendung ausschließlich als „noch keinen Ehemann hatte“ oder ausschließlich als „noch mit keinem Mann geschlechtlich verkehrt hatte“ festlegen.
  rationale: Das Hebräische kann im rechtlich-familiären Zusammenhang die Zugehörigkeit zu einem Ehemann meinen, berührt durch die Verbindung mit בְּתוּלָה aber zugleich den sexuellen Status. Eine eindeutige Verengung wäre nicht zwingend.
translation_notes:
  register: Moderne, würdevolle Rechtssprache mit verständlicher Satzführung. „Jungfräulich“ und „unrein“ bewahren die zentralen Begriffe des hebräischen Textes; die Fußnote erläutert die genuine Mehrdeutigkeit der idiomatischen Wendung.
