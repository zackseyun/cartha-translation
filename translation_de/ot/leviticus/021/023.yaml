source:
  edition: WLC
  text: אַ֣ךְ אֶל הַ/פָּרֹ֜כֶת לֹ֣א יָבֹ֗א וְ/אֶל הַ/מִּזְבֵּ֛חַ לֹ֥א יִגַּ֖שׁ כִּֽי מ֣וּם בּ֑/וֹ וְ/לֹ֤א יְחַלֵּל֙ אֶת מִקְדָּשַׁ֔/י כִּ֛י אֲנִ֥י יְהוָ֖ה מְקַדְּשָֽׁ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/023.yaml
  text: However[a], he shall not go in to the veil or come near the altar, because there is a defect in him, so that he may not profane my sanctuaries[c][b]; for I am Yahweh who sanctifies them.
translation:
  language: de
  text: Doch zum Vorhang[a] darf er nicht kommen und nicht an den Altar herantreten, denn an ihm ist ein Makel[b]. So soll er meine Heiligtümer[c] nicht entweihen; denn ich bin Jahwe, der sie heiligt.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist der innere Vorhang des Heiligtums.
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Ausdruck bezeichnet hier einen körperlichen Makel, der von diesem priesterlichen Dienst ausschließt, nicht eine moralische Schuld oder einen geringeren Wert des Menschen.
    reason: lexical_alternative
  - marker: c
    text: Wörtlich steht im Hebräischen der Plural „meine Heiligtümer“; manche Übersetzungen glätten ihn zu „mein Heiligtum“.
    reason: lexical_alternative
  - marker: d
    text: „Sie“ bezieht sich grammatisch am ehesten auf die Heiligtümer; im weiteren Zusammenhang könnte auch an die Priester oder das Volk gedacht sein.
    reason: theological_ambiguity
lexical_decisions:
- source_word: אַךְ
  choice: Doch
  rationale: Kennzeichnet die Einschränkung gegenüber der in Vers 22 gewährten Erlaubnis und gibt die adversative Funktion knapp und natürlich wieder.
- source_word: הַפָּרֹכֶת
  choice: der Vorhang
  rationale: Bezeichnet den inneren Vorhang des Heiligtums. „Vorhang“ ist im Deutschen verständlich und bewahrt den kultischen Bezug.
- source_word: יָבֹא
  choice: hineingehen
  rationale: Im Zusammenhang mit dem Heiligtum bezeichnet das Verb den Eintritt in den Bereich beim Vorhang; „bis zum Vorhang hineingehen“ bildet die Verbindung mit אֶל idiomatisch ab.
- source_word: הַמִּזְבֵּחַ
  choice: der Altar
  rationale: Übliche und eindeutige Wiedergabe im priesterlichen Opferkontext.
- source_word: יִגַּשׁ
  choice: herantreten
  rationale: Gibt die kultische Annäherung an den Altar natürlich und präzise wieder.
- source_word: מוּם בּוֹ
  choice: an ihm ist ein Makel
  rationale: Bewahrt die hebräische Ausdrucksweise und bezeichnet im Rechtszusammenhang ein körperliches Merkmal, das vom betreffenden Priesterdienst ausschließt, nicht eine moralische Schuld.
- source_word: יְחַלֵּל
  choice: entweihen
  rationale: Drückt im Heiligkeitswortschatz aus, dass Heiliges wie etwas Gewöhnliches behandelt und dadurch entheiligt wird.
- source_word: מִקְדָּשַׁי
  choice: meine Heiligtümer
  rationale: Bewahrt ausdrücklich den Plural des hebräischen Textes, ohne ihn zum Singular zu glätten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt das Tetragramm als persönlichen Gottesnamen wieder, statt es durch einen Titel zu ersetzen.
- source_word: מְקַדְּשָׁם
  choice: der sie heiligt
  rationale: Bewahrt das maskuline Pluralpronomen und die Wortverbindung mit dem Stamm קדשׁ. Der nächste grammatische Bezug ist „meine Heiligtümer“.
theological_decisions:
- issue: Bedeutung von מוּם im priesterlichen Heiligkeitsgesetz
  choice: Makel als körperliches Merkmal, das von diesem Priesterdienst ausschließt
  alternative: Gebrechen; körperlicher Fehler
  rationale: Der Vers spricht von einer kultisch-rechtlichen Einschränkung, nicht von moralischer Schuld oder geringerem menschlichem Wert. Die Fußnote macht diese Begrenzung ausdrücklich.
- issue: Bezug des Suffixes in מְקַדְּשָׁם
  choice: „sie“ bezieht sich am ehesten auf „meine Heiligtümer“
  alternative: „sie“ bezieht sich im weiteren Zusammenhang auf die Priester oder das Volk
  rationale: Der nächste grammatische Bezug ist das unmittelbar vorausgehende pluralische מִקְדָּשַׁי. Da ein weiter gefasster Rückbezug möglich bleibt, wird die Mehrdeutigkeit in einer Fußnote offengelegt.
- issue: Verhältnis von וְלֹא יְחַלֵּל zum vorangehenden Verbot
  choice: „So soll er … nicht entweihen“ als Folge beziehungsweise Zweck der Zugangsbeschränkung
  alternative: 'rein koordinierend: „und er soll … nicht entweihen“'
  rationale: Die Formulierung stellt den Schutz der Heiligkeit als Ziel oder beabsichtigte Folge des Verbots dar, ohne eine schärfere Kausalbeziehung zu behaupten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kultischen Begriffe „Vorhang“, „Altar“, „Heiligtümer“, „entweihen“ und „heiligen“ bleiben erhalten. Die Satzstruktur ist lesbar gegliedert, während Plural, Zugangsbeschränkung und mögliche Bezugsmehrdeutigkeit nicht eingeebnet werden.
