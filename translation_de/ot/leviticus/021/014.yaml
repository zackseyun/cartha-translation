id: LEV.21.14
reference: Leviticus 21:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אַלְמָנָ֤ה וּ/גְרוּשָׁה֙ וַ/חֲלָלָ֣ה זֹנָ֔ה אֶת אֵ֖לֶּה לֹ֣א יִקָּ֑ח כִּ֛י אִם בְּתוּלָ֥ה מֵ/עַמָּ֖י/ו יִקַּ֥ח אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/014.yaml
  text: 'He shall not take these as wife: a widow[a], or a divorced woman, or a defiled woman, or a prostitute. Rather, he shall take a virgin from his own people as wife.'
translation:
  language: de
  text: Eine Witwe, eine geschiedene Frau, eine entweihte Frau[a] oder eine Prostituierte – keine von ihnen darf er zur Frau nehmen. Sondern nur eine Jungfrau aus seinem eigenen Volk soll er zur Frau nehmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine verunreinigte Frau“. Das hebräische Wort bezeichnet im priesterlichen Heiligkeitsrecht einen für diese Ehe als ungeeignet geltenden Status; die genaue Ursache wird hier nicht genannt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלְמָנָה
  choice: eine Witwe
  rationale: Die übliche und eindeutige deutsche Entsprechung im Rahmen der Aufzählung.
- source_word: גְרוּשָׁה
  choice: eine geschiedene Frau
  rationale: Gibt die passive Bedeutung einer Frau wieder, die aus der Ehe entlassen beziehungsweise geschieden wurde, und ist in modernem Deutsch klar.
- source_word: חֲלָלָה
  choice: eine entweihte Frau
  rationale: Bewahrt den Bezug der Wortwurzel auf Entheiligung beziehungsweise Verlust eines heiligen Status; der Ausdruck bleibt bewusst weiter als eine rein moralische Verunreinigung.
- source_word: זֹנָה
  choice: eine Prostituierte
  rationale: Direkte, gegenwärtige und nicht archaische Wiedergabe des Ausdrucks.
- source_word: אֶת אֵלֶּה לֹא יִקָּח
  choice: keine von ihnen darf er zur Frau nehmen
  rationale: Macht den kollektiven Rückbezug auf die genannten Gruppen sowie den ehelichen Sinn von לקח idiomatisch deutlich.
- source_word: כִּי אִם
  choice: vielmehr
  rationale: Kennzeichnet nach der Verneinung den ausschließenden Gegensatz und leitet die erlaubte Alternative natürlich ein.
- source_word: בְּתוּלָה
  choice: eine Jungfrau
  rationale: Entspricht im Kontext des Ehegebots der konkreten Bedeutung des hebräischen Begriffs.
- source_word: מֵעַמָּיו
  choice: aus seinem eigenen Volk
  rationale: Gibt Herkunft aus der eigenen Volksgemeinschaft wieder; „eigenen“ verdeutlicht den Bezug des Suffixes.
- source_word: יִקַּח אִשָּׁה
  choice: soll er … zur Frau nehmen
  rationale: Bewahrt die rechtlich geprägte Redeweise des Nehmens einer Frau und klingt zugleich natürlich und würdevoll.
theological_decisions:
- issue: Wiedergabe von חֲלָלָה im priesterlichen Heiligkeitsrecht
  choice: eine entweihte Frau
  alternative: eine verunreinigte Frau; eine Frau mit entweihtem Status
  rationale: „Entweiht“ erhält die kultisch-rechtliche Spannung zwischen heilig und profan, ohne genauer festzulegen, wodurch der betreffende Status entstanden ist. So wird weder eine bloß körperliche Unreinheit noch eine bestimmte moralische Verfehlung in den Text eingetragen.
- issue: Verpflichtungsgrad der Heiratsbestimmung
  choice: darf er nicht … vielmehr soll er
  alternative: soll er nicht … sondern nur
  rationale: Die Kombination gibt das gesetzliche Verbot und das anschließende positive Gebot in natürlichem Deutsch wieder, ohne den normativen Charakter abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vorangestellte Aufzählung hebt die verbotenen Kategorien hervor; der Gedankenstrich gliedert den langen Rechtssatz. Keine konfessionelle Zusatzdeutung wurde aufgenommen.
