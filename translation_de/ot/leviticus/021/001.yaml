base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/001.yaml
  text: 'And Yahweh said to Moses[a], “Speak to the priests, the sons of Aaron[b], and say to them: None shall make himself unclean for a dead person among his people,”'
translation:
  language: de
  text: 'Und Jahwe sprach zu Mose: »Sprich zu den Priestern, den Söhnen Aarons, und sage ihnen: Keiner von ihnen darf sich wegen eines Toten[a] in seinem Volk unrein machen[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch נֶפֶשׁ (nefesch), gewöhnlich „Person“ oder „Lebewesen“. In diesem Reinheitsgesetz bezeichnet das Wort einen Toten beziehungsweise einen Leichnam.
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „darf nicht unrein werden“. Gemeint ist rituelle Unreinheit im Zusammenhang mit einem Toten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel wie „der HERR“ ersetzt.
- source_word: אֱמֹר ... וְאָמַרְתָּ
  choice: Sprich ... und sage
  rationale: Die Wiederholung desselben hebräischen Verbs bleibt erkennbar, ohne im Deutschen unnatürlich zu wirken.
- source_word: הַכֹּהֲנִים בְּנֵי אַהֲרֹן
  choice: die Priester, die Söhne Aarons
  rationale: Die appositionelle Formulierung bewahrt die familiäre und amtliche Bezeichnung des Hebräischen.
- source_word: לְנֶפֶשׁ
  choice: wegen eines Toten
  rationale: נֶפֶשׁ bezeichnet in diesem Reinheitsgesetz idiomatisch einen Verstorbenen beziehungsweise Leichnam; „eines Toten“ ist klar und würdig.
- source_word: יִטַּמָּא
  choice: darf sich ... nicht unrein machen
  rationale: Die reflexive Form und der kultisch-rituelle Sinn werden bewahrt; die Formulierung vermeidet eine vorschnelle moralische Deutung.
- source_word: בְּעַמָּיו
  choice: inmitten seines Volkes
  rationale: Die Wendung gibt den kollektiven Bezug wieder, ohne die Bedeutung bereits auf engste Verwandte zu verengen; diese werden erst in den Folgeversen näher bestimmt.
theological_decisions:
- issue: Art der Unreinheit im priesterlichen Gesetz
  choice: rituelle Unreinheit („sich unrein machen“)
  alternative: moralisch gefärbte Verunreinigung („sich beflecken“ oder „sich entweihen“)
  rationale: Der Zusammenhang handelt von der durch Tote ausgelösten kultischen Unreinheit. Die Übersetzung wahrt diese Kategorie, ohne daraus unmittelbar ein moralisches Urteil zu machen.
- issue: Reichweite des Verbots innerhalb der pluralischen Anrede
  choice: „Keiner von ihnen darf ...“
  alternative: „Ein Priester darf ... nicht“
  rationale: Die Formulierung macht den Bezug auf die zuvor angeredeten Priester deutlich und gibt die singularische Verbform distributiv wieder.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Doppelung „sprich ... und sage“ wurde beibehalten. Die beiden Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
