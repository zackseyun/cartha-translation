  text: And he shall take a wife in her virginity[a].
translation:
  language: de
  text: Und er soll sich eine Frau in ihrer Jungfräulichkeit[a] zur Frau nehmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als Jungfrau“. Wörtlich heißt es im Hebräischen: „in ihrer Jungfräulichkeit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: Und er
  rationale: Die Konjunktion führt den Zusammenhang fort; das selbstständige Pronomen nennt und betont das Subjekt leicht, ohne dass im Deutschen ein stärkeres „selbst“ nötig ist.
- source_word: אִשָּׁה
  choice: eine Frau … zur Frau
  rationale: Im Zusammenhang mit לקח bezeichnet אִשָּׁה die Frau als Ehefrau. Die deutsche Wendung „zur Frau nehmen“ gibt den ehelichen Sinn idiomatisch und zugleich formell wieder.
- source_word: בִּבְתוּלֶיהָ
  choice: in ihrer Jungfräulichkeit
  rationale: Die Präposition ב mit בְּתוּלִים und dem Suffix der 3. Person feminin Singular bezeichnet wörtlich ihren jungfräulichen Zustand. Die formelle Wiedergabe bewahrt die hebräische Konstruktion und ihre leichte Ungewöhnlichkeit.
- source_word: יִקָּח
  choice: soll … zur Frau nehmen
  rationale: לקח bedeutet grundsätzlich „nehmen“ und wird hier als feste Heiratswendung gebraucht. „zur Frau nehmen“ bewahrt dieses Bild und passt zum rechtlichen Sprachgebrauch.
theological_decisions:
- issue: Heiratsterminologie in der priesterlichen Gesetzgebung
  choice: Die Heiratsformel „eine Frau … zur Frau nehmen“ wird beibehalten.
  alternative: „Er soll eine Jungfrau heiraten.“
  rationale: Die gewählte Fassung erhält die formelhafte Struktur und das Verb „nehmen“, ohne den ehelichen Sinn im Deutschen unklar zu lassen.
- issue: Wiedergabe des jungfräulichen Zustands
  choice: „in ihrer Jungfräulichkeit“
  alternative: „als Jungfrau“
  rationale: Die wörtlichere Form bewahrt die hebräische Präpositionalfügung; die natürlichere Alternative wird in der Fußnote genannt, ohne eine zusätzliche Auslegung in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst formellem Ton entsprechend der priesterlichen Gesetzessprache. Die ungewöhnliche, aber verständliche Wendung „in ihrer Jungfräulichkeit“ bewahrt die Ausdrucksweise des Hebräischen; die idiomatischere deutsche Möglichkeit steht in der Fußnote.
