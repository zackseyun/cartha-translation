  source_fidelity: Die Übersetzung gibt לֶחֶם in seinem kultisch erweiterten Sinn angemessen als „Speise“ wieder und bewahrt mit „seines Gottes“ den maskulinen Singularbezug. „Er darf … essen“ trifft die im Kontext naheliegende permissive Funktion des Imperfekts. Die Reihenfolge sowie die Unterscheidung zwischen קדשי הקדשים und קדשים bleiben erhalten.
  naturalness: Die Formulierung ist knappes, modernes und zugleich für einen priesterrechtlichen Text angemessenes Standarddeutsch. Die substantivierten Kategorien „das Hochheilige“ und „das Heilige“ sind in diesem Kontext idiomatisch und vermeiden eine unnötige Festlegung auf bestimmte Opferarten.
  terminology: „Hochheiliges“ und „Heiliges“ markieren den kultischen Rangunterschied konsistent. Die Fußnote erläutert die wörtliche Lesart „Brot“ sowie den hier gemeinten weiteren Sinn sachgerecht. Der Anker steht eindeutig bei der betreffenden Aussage.
