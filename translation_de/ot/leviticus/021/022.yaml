id: LEV.21.22
reference: Leviticus 21:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לֶ֣חֶם אֱלֹהָ֔י/ו מִ/קָּדְשֵׁ֖י הַ/קֳּדָשִׁ֑ים וּ/מִן הַ/קֳּדָשִׁ֖ים יֹאכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/022.yaml
  text: He may eat the food of his God[a], from the most holy things and from the holy things.
translation:
  language: de
  text: 'Er darf von der Speise seines Gottes essen: vom Hochheiligen und vom Heiligen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »vom Brot seines Gottes«. »Brot« bezeichnet hier die Speiseanteile, die den Priestern von den heiligen Gaben zustehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  choice: Speise
  rationale: Das Wort bedeutet wörtlich »Brot«, bezeichnet hier im priesterlich-kultischen Zusammenhang aber umfassender die dem Priester zustehenden heiligen Speiseanteile. »Speise« bewahrt einen würdigen Ton und vermeidet die Verengung auf Backbrot.
- source_word: אֱלֹהָיו
  choice: seines Gottes
  rationale: Die maskuline Singularendung bezieht sich auf den Priester. Die Formulierung bewahrt die persönliche, bundesbezogene Ausdrucksweise des Hebräischen.
- source_word: מִקָּדְשֵׁי הַקֳּדָשִׁים
  choice: vom Hochheiligen
  rationale: Die Constructusverbindung bildet den kultischen Superlativ und bezeichnet die höchste Heiligkeitsklasse. »das Hochheilige« ist im Deutschen eine knappe, sachgerechte Bezeichnung für diese Kategorie.
- source_word: וּמִן הַקֳּדָשִׁים
  choice: und vom Heiligen
  rationale: Die Formulierung bezeichnet die zweite, weniger streng geheiligte Kategorie und hält durch die parallele Wortwahl die lexikalische Verbindung zur Wurzel קדש sowie den rechtlichen Kontrast fest.
- source_word: יֹאכֵל
  choice: er darf … essen
  rationale: 'Im gesetzlichen Zusammenhang drückt das Imperfekt eine Erlaubnis aus: Trotz der zuvor genannten Einschränkung bleibt dem Priester das Essen der heiligen Anteile gestattet.'
theological_decisions:
- issue: Aussagekraft des gesetzlichen Imperfekts יֹאכֵל
  choice: Erlaubnis (»er darf essen«)
  alternative: Einfaches Futur (»er wird essen«) oder Verpflichtung (»er soll essen«)
  rationale: Der Zusammenhang stellt dem Verbot, sich dem Heiligtum beziehungsweise dem Opferdienst zu nähern, das fortbestehende Recht gegenüber, von den heiligen Anteilen zu essen. Die Erlaubnisform gibt diesen Gegensatz wieder, ohne eine Pflicht einzutragen.
- issue: Bezeichnung der beiden Heiligkeitsklassen
  choice: »das Hochheilige« und »das Heilige«
  alternative: »die hochheiligen Gaben« und »die heiligen Gaben«
  rationale: Der hebräische Text nennt beide Kategorien substantivisch und ohne ein ausdrückliches Wort für »Gaben« oder »Opfer«. Die gewählte Fassung bewahrt diese Offenheit und den kultischen Rangunterschied.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Speise« ist natürlicher als das wörtliche »Brot«, bleibt aber kultisch angemessen. Die substantivierten Formen »Hochheiliges« und »Heiliges« bewahren die knappe rechtliche Kategorisierung des Ausgangstextes.
