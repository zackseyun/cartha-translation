  text: וַ/יֵּצֵא֙ בֶּן אִשָּׁ֣ה יִשְׂרְאֵלִ֔ית וְ/הוּא֙ בֶּן אִ֣ישׁ מִצְרִ֔י בְּ/ת֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יִּנָּצוּ֙ בַּֽ/מַּחֲנֶ֔ה בֶּ֚ן הַ/יִּשְׂרְאֵלִ֔ית וְ/אִ֖ישׁ הַ/יִּשְׂרְאֵלִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/010.yaml
  text: The son of an Israelite woman[a], and he was the son of an Egyptian man, went out among the sons of Israel[b]; and in the camp the son of the Israelite woman and an Israelite man fought.
translation:
  language: de
  text: Der Sohn einer Israelitin – sein Vater war ein Ägypter – ging hinaus, mitten unter die Israeliten[a]. Im Lager gerieten der Sohn der Israelitin und ein israelitischer Mann miteinander in Streit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »mitten unter den Söhnen Israels«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »kämpften miteinander«. Das hebräische Verb kann sowohl einen Streit als auch eine körperliche Auseinandersetzung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: ging hinaus
  rationale: Das Verb יצא bezeichnet eine Bewegung nach draußen beziehungsweise hinaus, ohne den Ausgangspunkt ausdrücklich zu nennen. »Ging hinaus« bewahrt diese Offenheit.
- source_word: בֶּן אִשָּׁה יִשְׂרְאֵלִית
  choice: der Sohn einer Israelitin
  rationale: Die Wendung kennzeichnet den Mann über seine mütterliche Herkunft. Die bestimmte Form nimmt die spätere Wiederholung im Vers auf.
- source_word: וְהוּא בֶּן אִישׁ מִצְרִי
  choice: sein Vater war ein Ägypter
  rationale: Die hebräische Zuordnung wird in natürlichem Deutsch als Angabe der väterlichen Herkunft wiedergegeben; inhaltlich bleibt »er war der Sohn eines ägyptischen Mannes« erhalten.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: unter die Israeliten
  rationale: בְּתוֹךְ bedeutet hier »mitten unter/unter«. Die feste Volksbezeichnung בְּנֵי יִשְׂרָאֵל wird im modernen Deutschen idiomatisch mit »Israeliten« wiedergegeben; die wörtliche Form steht in der Fußnote.
- source_word: וַיִּנָּצוּ
  choice: gerieten ... miteinander in Streit
  rationale: Der Niphal von נצה kann einen Streit oder eine körperliche Auseinandersetzung bezeichnen. Die Formulierung bewahrt diese Spannweite besser als das eindeutig körperliche »kämpften«.
- source_word: בַּמַּחֲנֶה
  choice: im Lager
  rationale: Schlichte und genaue Ortsangabe für das Lager Israels.
- source_word: בֶּן הַיִּשְׂרְאֵלִית
  choice: der Sohn der Israelitin
  rationale: Die wiederholte Bezeichnung wird zur Identifikation und wegen ihrer literarischen Funktion beibehalten.
- source_word: וְאִישׁ הַיִּשְׂרְאֵלִי
  choice: und ein israelitischer Mann
  rationale: Die Wiedergabe erhält den Kontrast zwischen dem über beide Elternteile beschriebenen Sohn und dem als israelitisch bezeichneten Mann.
theological_decisions:
- issue: Volksbezeichnung בְּנֵי יִשְׂרָאֵל
  choice: Israeliten
  alternative: Söhne Israels
  rationale: Die Wendung fungiert hier als nationale Sammelbezeichnung. »Israeliten« ist im modernen Deutsch natürlich und umfasst das Volk, während eine Fußnote die formale hebräische Ausdrucksweise sichtbar hält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der eingeschobene Satz zur väterlichen Herkunft entlastet die im Deutschen schwerfällige hebräische Reihung. Die Wiederholung »der Sohn der Israelitin« bleibt erhalten. Beide Fußnotenmarker erscheinen an den jeweils einschlägigen Stellen im Haupttext.
