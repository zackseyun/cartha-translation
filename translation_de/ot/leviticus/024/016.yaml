source:
  edition: WLC
  text: וְ/נֹקֵ֤ב שֵׁם יְהוָה֙ מ֣וֹת יוּמָ֔ת רָג֥וֹם יִרְגְּמוּ ב֖/וֹ כָּל הָ/עֵדָ֑ה כַּ/גֵּר֙ כָּֽ/אֶזְרָ֔ח בְּ/נָקְב/וֹ שֵׁ֖ם יוּמָֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/016.yaml
  text: Whoever blasphemes the name of Yahweh shall surely be put to death[a]; all the congregation shall certainly stone him[b]. The sojourner as well as the native-born—when he blasphemes the Name—shall be put to death.
translation:
  language: de
  text: 'Wer den Namen Yahwehs lästert, muss getötet werden.[a] Die ganze Gemeinde muss ihn steinigen. Der ansässige Fremde wie der Einheimische: Wenn er den Namen lästert, muss er getötet werden.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wer den Namen Yahwehs ausspricht oder nennt“ beziehungsweise „verflucht“. Das hebräische Verb kann ein deutliches Aussprechen oder Nennen, in diesem Zusammenhang aber auch ein schmähendes Entweihen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „den Namen“. Gemeint ist der zuvor genannte Name Yahwehs; die Wendung kann als ehrfürchtige Ersatzbezeichnung für den Gottesnamen dienen.'
    reason: cultural_note
lexical_decisions:
- source_word: וְנֹקֵב / בְּנָקְבוֹ
  choice: lästert / wenn er … lästert
  rationale: נקב kann ein deutliches Aussprechen oder Nennen bezeichnen, in dieser Rechtsbestimmung aber auch ein schmähendes Entweihen des Gottesnamens. „lästern“ gibt den wahrscheinlichen kontextuellen Sinn natürlich wieder; die echte lexikalische Mehrdeutigkeit bleibt in Fußnote [a] erhalten.
- source_word: שֵׁם יְהוָה
  choice: den Namen Yahwehs
  rationale: שֵׁם bedeutet „Name“; das Tetragramm wird als der Eigenname „Yahweh“ wiedergegeben.
- source_word: מוֹת יוּמָת
  choice: muss mit dem Tod bestraft werden
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt die passive rechtliche Tötungsformel. Die deutsche Formulierung bewahrt Verpflichtungscharakter und Passivbedeutung, ohne unnatürlich wörtlich zu klingen.
- source_word: רָגוֹם יִרְגְּמוּ בוֹ
  choice: soll ihn steinigen
  rationale: Der hebräische Ausdruck bezeichnet ausdrücklich die Hinrichtung durch Steinigung. Im Deutschen trägt „soll“ den verbindlichen Rechtscharakter; eine zusätzliche Wiedergabe der innerhebräischen Verstärkung wäre hier stilistisch schwerfällig.
- source_word: כָּל הָעֵדָה
  choice: die ganze Gemeinde
  rationale: עֵדָה bezeichnet die versammelte Gemeinschaft Israels; „Gemeinde“ wahrt den gemeinschaftlichen und rechtlichen Bezug.
- source_word: כַּגֵּר כָּאֶזְרָח
  choice: Für den ansässigen Fremden gilt dasselbe wie für den Einheimischen
  rationale: גֵּר ist ein unter Israel lebender Nichtisraelit beziehungsweise ortsfremder Bewohner, nicht bloß ein Durchreisender. אֶזְרָח bezeichnet im Gegensatz dazu den Einheimischen. Die Formulierung drückt die elliptische hebräische Gleichstellung klar aus.
- source_word: בְּנָקְבוֹ שֵׁם
  choice: Wenn er den Namen lästert
  rationale: ב mit dem Infinitivus constructus wird temporal wiedergegeben. Das absolut gebrauchte שֵׁם verweist im Kontext ehrfürchtig auf den zuvor genannten Namen Yahwehs; dies wird in Fußnote [b] erläutert.
- source_word: יוּמָת
  choice: muss er mit dem Tod bestraft werden
  rationale: Die passive gerichtliche Formel wird am Versende entsprechend dem Hebräischen wiederholt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR / Jehova
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Yahweh“ gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von נקב in Verbindung mit dem Gottesnamen
  choice: lästern
  alternative: aussprechen / nennen / verfluchen
  rationale: Im unmittelbaren Rechtskontext bezeichnet das Verb wahrscheinlich die entehrende oder schmähende Verwendung des Namens, nicht notwendig dessen bloße Aussprache. Da die Konstruktion lexikalisch umstritten ist, werden die Alternativen in einer Fußnote bewahrt.
- issue: Absolutes שֵׁם im letzten Satzteil
  choice: der Name
  alternative: der Name Yahwehs
  rationale: Die knappe Wiederaufnahme des hebräischen Textes bleibt erhalten; im Kontext fungiert „der Name“ als ehrfürchtige Bezeichnung für den Gottesnamen. Eine Fußnote macht diesen Bezug transparent.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlichem Rechtsstil. „muss mit dem Tod bestraft werden“ gibt die passive, nachdrückliche Rechtsformel natürlich wieder. Die parallele Gleichstellung von ansässigem Fremden und Einheimischem wird zur Klarheit als vollständiger deutscher Satz formuliert. Alle Fußnotenmarker stehen im Haupttext.
