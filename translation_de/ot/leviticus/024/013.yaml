base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/013.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: de
  text: 'Darauf sprach Jahwe zu Mose:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Darauf sprach
  rationale: Das Waw mit der narrativen Verbform führt die Handlung weiter. „Darauf“ macht die zeitliche Folge im modernen Deutsch natürlich deutlich; „sprach“ entspricht דבר in der feierlichen Redeeinleitungsformel.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt. „Jahwe“ ist die im Deutschen übliche Form.
- source_word: אֶל־מֹשֶׁה
  choice: zu Mose
  rationale: Die Präposition אֶל bezeichnet hier den Adressaten der Rede; „zu Mose“ ist die natürliche deutsche Wiedergabe.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv „sagend/um zu sagen“ leitet den unmittelbar folgenden Redeinhalt ein. Im heutigen Deutsch erfüllt ein Doppelpunkt diese Funktion klar und idiomatisch, ohne ein schwerfälliges „und sagte“ hinzuzufügen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. Die Wiedergabe „Jahwe“ bewahrt diesen Unterschied gegenüber einem bloßen Titel.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe hebräische Redeeinleitungsformel wird idiomatisch mit einem Doppelpunkt abgeschlossen, da der Redeinhalt im nächsten Vers folgt.
