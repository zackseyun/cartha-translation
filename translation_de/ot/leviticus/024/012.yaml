source:
  edition: WLC
  text: וַ/יַּנִּיחֻ֖/הוּ בַּ/מִּשְׁמָ֑ר לִ/פְרֹ֥שׁ לָ/הֶ֖ם עַל פִּ֥י יְהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/012.yaml
  text: So they put him in custody[a], to clarify for them according to the word of Yahweh.
translation:
  language: de
  text: Dann nahmen sie ihn in Gewahrsam, um ihnen nach dem Wort Jahwes Klarheit zu verschaffen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »um ihnen nach dem Wort Jahwes ausdrücklich darzulegen«. Das hebräische Verb kann bedeuten, etwas klarzumachen, zu erklären oder deutlich auszusprechen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנִּיחֻהוּ
  choice: Dann nahmen sie ihn
  rationale: Die Hifilform von נוח bedeutet hier »hinlegen, hinstellen, unterbringen«. Zusammen mit בַּמִּשְׁמָר gibt »in Gewahrsam nehmen« den fortschreitenden Erzählzusammenhang und die rechtliche Situation natürlich wieder.
- source_word: בַּמִּשְׁמָר
  choice: in Gewahrsam
  rationale: מִשְׁמָר bezeichnet hier bewachtes Festhalten beziehungsweise Verwahrung, nicht lediglich eine Wache.
- source_word: לִפְרֹשׁ לָהֶם
  choice: um für sie … Klarheit zu schaffen
  rationale: פרשׁ kann bedeuten, etwas deutlich zu machen, ausdrücklich darzulegen oder zu erklären. Die Wiedergabe vermeidet es, ein im Hebräischen nicht ausdrücklich genanntes Objekt wie »die Entscheidung« oder »die Sache« einzufügen.
- source_word: עַל־פִּי
  choice: nach dem Wort
  rationale: Die Wendung bedeutet wörtlich »nach dem Mund« und bezeichnet hier die maßgebliche Äußerung Jahwes. »Nach dem Wort« bewahrt sowohl den sprachlichen als auch den autoritativen Aspekt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in der im Deutschen geläufigen Form »Jahwe« wiedergegeben, statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. »Jahwe« bewahrt den Eigennamen, während »der HERR« ihn durch einen traditionellen Ersatztitel wiedergibt.
- issue: Nicht ausdrücklich genanntes Objekt von לִפְרֹשׁ
  choice: Klarheit schaffen, ohne »Entscheidung« zu ergänzen
  alternative: die Entscheidung klären
  rationale: Der rechtliche Zusammenhang legt eine ausstehende Entscheidung nahe, doch der Vers nennt kein ausdrückliches Objekt. Die Übersetzung erhält diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »In Gewahrsam nehmen« entspricht dem rechtlichen Kontext; »Klarheit schaffen« bleibt verständlich, ohne ein im Ausgangstext unausgesprochenes Objekt festzulegen.
