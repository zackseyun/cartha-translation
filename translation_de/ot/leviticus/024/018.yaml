  text: וּ/מַכֵּ֥ה נֶֽפֶשׁ בְּהֵמָ֖ה יְשַׁלְּמֶ֑/נָּה נֶ֖פֶשׁ תַּ֥חַת נָֽפֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/018.yaml
  text: 'And whoever strikes down an animal shall make restitution for it: life for life[a].'
translation:
  language: de
  text: 'Wer ein Tier erschlägt, muss dafür Ersatz leisten: Leben für Leben[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Leben anstelle von Leben“. Im Zusammenhang mit der Ersatzpflicht für ein Tier bezeichnet die Formel eine gleichwertige Entschädigung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַכֵּה
  choice: Wer … totschlägt
  rationale: Das Hifil-Partizip von נכה formuliert einen allgemeinen Rechtssatz. In Verbindung mit נֶפֶשׁ und einem Tier bezeichnet es hier eine tödliche Handlung; „totschlägt“ gibt dies im Deutschen knapp und eindeutig wieder.
- source_word: נֶפֶשׁ בְּהֵמָה
  choice: ein Tier
  rationale: נֶפֶשׁ bezeichnet hier das Leben beziehungsweise das lebende Tier, nicht eine immaterielle „Seele“. Natürliches Deutsch drückt die tödliche Handlung direkt mit „ein Tier totschlägt“ aus. בְּהֵמָה meint ein Tier, im Kontext besonders ein gehaltenes Nutztier.
- source_word: יְשַׁלְּמֶנָּה
  choice: muss es ersetzen
  rationale: Das Piel von שלם bezeichnet vollständigen Ersatz beziehungsweise Wiedergutmachung; das feminine Suffix verweist auf בְּהֵמָה. „Muss“ entspricht dem verpflichtenden Charakter des Rechtssatzes, „es ersetzen“ bewahrt den konkreten Bezug zum getöteten Tier.
- source_word: נֶפֶשׁ תַּחַת נָפֶשׁ
  choice: Leben für Leben
  rationale: Die knappe Rechtsformel wird formal bewahrt. In Verbindung mit der Ersatzpflicht bezeichnet sie eine dem verlorenen Leben entsprechende Gegenleistung, ohne deren genaue Form ausdrücklich festzulegen.
theological_decisions:
- issue: Bedeutung der Vergeltungsformel im Zusammenhang mit einem getöteten Tier
  choice: Die Ersatzpflicht wird mit der offenen Formel „Leben für Leben“ wiedergegeben.
  alternative: Die Formulierung könnte ausdrücklich als Übergabe eines anderen Tieres oder allgemeiner als materieller beziehungsweise finanzieller Schadenersatz erklärt werden.
  rationale: Das Verb יְשַׁלֵּם fordert Ersatz, doch der Vers legt dessen genaue rechtliche Form nicht ausdrücklich fest. Die Übersetzung bewahrt daher sowohl die hebräische Formel als auch ihre Spannung und vermeidet eine konfessionelle oder sachlich unnötige Festlegung.
translation_notes:
  register: Modernes, klares und würdevolles Rechtsdeutsch. „Totschlägt“ macht die im Kontext vorausgesetzte tödliche Wirkung deutlich; „muss es ersetzen“ ist für heutige Leser natürlicher als „soll es erstatten“. Die traditionelle Kurzformel „Leben für Leben“ bleibt erhalten.
