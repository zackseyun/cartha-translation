  text: וּ/מַכֵּ֥ה בְהֵמָ֖ה יְשַׁלְּמֶ֑/נָּה וּ/מַכֵּ֥ה אָדָ֖ם יוּמָֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/021.yaml
  text: And whoever strikes down an animal shall make restitution for it[a], but whoever strikes down a man shall be put to death.
translation:
  language: de
  text: Wer ein Tier erschlägt, soll dafür Ersatz leisten; wer einen Menschen erschlägt, soll getötet werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַכֵּה
  choice: wer … erschlägt
  rationale: Das Hifil-Partizip von נכה bezeichnet hier aufgrund der Folgen in beiden parallelen Rechtssätzen einen tödlichen Schlag. „Erschlägt“ gibt sowohl den Schlag als auch dessen tödlichen Ausgang knapp und natürlich wieder.
- source_word: בְהֵמָה
  choice: ein Tier
  rationale: בְּהֵמָה bezeichnet ein Tier, häufig ein Nutz- oder Haustier. „Tier“ wahrt den weiteren Bedeutungsumfang und passt in den rechtlichen Zusammenhang.
- source_word: יְשַׁלְּמֶנָּה
  choice: soll es ersetzen
  rationale: Das Piel von שלם verlangt hier Ersatz beziehungsweise Entschädigung; das feminine Suffix bezieht sich auf בְהֵמָה. „Es ersetzen“ ist im Deutschen eine klare und knappe Rechtsformulierung.
- source_word: אָדָם
  choice: einen Menschen
  rationale: Im Gegensatz zu בְהֵמָה bezeichnet אָדָם hier eine einzelne menschliche Person, nicht die Menschheit als Kollektiv. „Einen Menschen“ gibt diesen Sinn im modernen Deutschen präzise und ohne unnötige geschlechtliche Verengung wieder.
- source_word: יוּמָת
  choice: soll getötet werden
  rationale: Die Hophal-Form bezeichnet ein veranlasstes Töten und steht hier als passive Rechtsfolge. „Soll getötet werden“ bildet die grammatische Form ab, ohne den Text durch einen moderneren Fachbegriff wie „hingerichtet“ stärker festzulegen.
theological_decisions:
- issue: Wiedergabe von אָדָם im Rechtssatz
  choice: einen Menschen
  alternative: einen Mann
  rationale: אָדָם kann einen Menschen allgemein bezeichnen und steht hier im sachlichen Gegensatz zum Tier. Obwohl die Form grammatisch maskulin ist, schränkt der Kontext die betroffene Person nicht auf einen erwachsenen Mann ein; „Mensch“ bewahrt daher den Umfang des hebräischen Ausdrucks.
- issue: Art der in יוּמָת bezeichneten Todesfolge
  choice: soll getötet werden
  alternative: soll hingerichtet werden
  rationale: Der Kontext beschreibt eine rechtlich angeordnete Todesfolge. Die passivische Form sagt jedoch unmittelbar nur, dass der Täter getötet werden soll; „hingerichtet“ würde den institutionellen Vollzug deutlicher auslegen, als es die einzelne Form ausdrücklich tut.
translation_notes:
  register: Knapper, würdevoller Rechtssatz in modernem Standarddeutsch. Die parallele Satzstruktur des Hebräischen bleibt erhalten; „soll“ entspricht dem normativen Charakter der beiden Verbformen.
