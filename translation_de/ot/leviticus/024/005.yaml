source:
  edition: WLC
  text: וְ/לָקַחְתָּ֣ סֹ֔לֶת וְ/אָפִיתָ֣ אֹתָ֔/הּ שְׁתֵּ֥ים עֶשְׂרֵ֖ה חַלּ֑וֹת שְׁנֵי֙ עֶשְׂרֹנִ֔ים יִהְיֶ֖ה הַֽ/חַלָּ֥ה הָ/אֶחָֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/005.yaml
  text: And you shall take fine flour and bake it into twelve loaves[b][a]; each loaf shall be of two-tenths of an ephah.
translation:
  language: de
  text: Du sollst Feinmehl nehmen und daraus zwölf Brote[a] backen. Jedes Brot soll aus zwei Zehnteln eines Efa[b] bestehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Brotfladen“. Das hebräische Wort bezeichnet einzelne gebackene Brote, besonders auch im rituellen Zusammenhang.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „zwei Zehntel“. Gemeint sind für jedes Brot zwei Zehntel eines Efa, also etwa 4,4 Liter Mehl.'
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Du sollst … nehmen
  rationale: Das Qal-Perfekt mit וְ führt im gesetzlichen Anweisungszusammenhang die Abfolge der Gebote fort. Die deutsche Soll-Form gibt diesen verbindlichen Verfahrenscharakter natürlich wieder.
- source_word: סֹלֶת
  choice: Feinmehl
  rationale: Der Ausdruck bezeichnet sorgfältig ausgemahlenes beziehungsweise verfeinertes Mehl für kultische Gaben. „Feinmehl“ ist die übliche, präzise deutsche Entsprechung, ohne die im Hebräischen nicht ausdrücklich genannte Getreideart hinzuzufügen.
- source_word: וְאָפִיתָ אֹתָהּ
  choice: und daraus … backen
  rationale: Das feminine Suffix bezieht sich auf das Mehl. „Daraus … backen“ ist im Deutschen idiomatisch und macht deutlich, dass aus dem Mehl die anschließend genannten Brote hergestellt werden.
- source_word: שְׁתֵּים עֶשְׂרֵה חַלּוֹת
  choice: zwölf Brote
  rationale: חַלּוֹת bezeichnet einzelne gebackene Broteinheiten, besonders auch im kultischen Gebrauch. „Brote“ ist im modernen Deutschen klar; „Brotfladen“ bleibt als mögliche Formangabe in der Fußnote erhalten.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: zwei Zehntel eines Efa
  rationale: עִשָּׂרוֹן ist ein Zehntelmaß, das in den priesterlichen Maßangaben als Zehntel eines Efa verstanden wird. Die Ergänzung „eines Efa“ macht den impliziten Bezugsmaßstab verständlich.
- source_word: יִהְיֶה הַחַלָּה הָאֶחָת
  choice: Jedes Brot soll … bestehen
  rationale: Wörtlich heißt es etwa „das eine Brot soll sein“. Der distributive Sinn wird im Deutschen mit „jedes Brot“ natürlich und genau wiedergegeben; „bestehen“ verbindet die Mengenangabe idiomatisch mit dem verwendeten Mehl.
