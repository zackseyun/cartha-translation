source:
  edition: WLC
  text: הוֹצֵ֣א אֶת הַֽ/מְקַלֵּ֗ל אֶל מִ/חוּץ֙ לַֽ/מַּחֲנֶ֔ה וְ/סָמְכ֧וּ כָֽל הַ/שֹּׁמְעִ֛ים אֶת יְדֵי/הֶ֖ם עַל רֹאשׁ֑/וֹ וְ/רָגְמ֥וּ אֹת֖/וֹ כָּל הָ/עֵדָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/014.yaml
  text: Bring the one who cursed outside the camp[a], and let all who heard lay their hands on his head[b], and let all the congregation stone him.
translation:
  language: de
  text: Bring den, der geflucht hat[a], aus dem Lager hinaus. Alle, die es gehört haben, sollen ihre Hände auf seinen Kopf legen[b], und die ganze Gemeinde soll ihn steinigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Gotteslästerer« beziehungsweise »den, der gelästert hat«. Das Hebräische bezeichnet ihn wörtlich als »den, der geflucht hat«.'
    reason: alternative_reading
  - marker: b
    text: Die Handauflegung kennzeichnet hier wahrscheinlich die förmliche Identifizierung des Schuldigen durch die Zeugen; manche verstehen sie darüber hinaus auch als symbolische Handlung.
    reason: cultural_note
lexical_decisions:
- source_word: הוֹצֵא
  choice: Bring ... hinaus
  rationale: Der Hifil-Imperativ von יצא bedeutet, jemanden hinauszubringen. Die deutsche Verbklammer mit „aus dem Lager hinaus“ gibt Richtung und Ziel natürlich wieder.
- source_word: הַמְקַלֵּל
  choice: den, der geflucht hat
  rationale: Das substantivierte Partizip von קלל bezeichnet hier den konkreten Täter. Die Formulierung wahrt den unmittelbaren Sinn „fluchen“, ohne im Haupttext bereits interpretierend „Gotteslästerer“ zu setzen.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: aus dem Lager hinaus
  rationale: Die räumliche Wendung bezeichnet den Bereich außerhalb des Lagers; zusammen mit dem kausativen Bewegungsverb ist „aus dem Lager hinaus“ im Deutschen idiomatisch.
- source_word: וְסָמְכוּ
  choice: sollen ... legen
  rationale: סמך mit Händen und Kopf wird konventionell als „die Hände auflegen“ beziehungsweise „auf den Kopf legen“ wiedergegeben. „Sollen“ führt die Befehlsfolge angemessen fort.
- source_word: כָל הַשֹּׁמְעִים
  choice: alle, die es gehört haben
  rationale: Das Partizip bezeichnet sämtliche Hörer beziehungsweise Zeugen. Das neutrale „es“ bezieht sich natürlich auf den zuvor berichteten Fluch, ohne das im Hebräischen nicht ausdrücklich gesetzte persönliche Objekt „ihn“ einzuführen.
- source_word: יְדֵיהֶם עַל רֹאשׁוֹ
  choice: ihre Hände auf seinen Kopf
  rationale: Die Plurale und das konkrete Körperteil werden eng am Hebräischen bewahrt.
- source_word: וְרָגְמוּ אֹתוֹ
  choice: soll ihn steinigen
  rationale: רגם ist der übliche Ausdruck für die Hinrichtung durch Steinigung; „steinigen“ ist im Deutschen präzise und etabliert.
- source_word: כָל הָעֵדָה
  choice: die ganze Gemeinde
  rationale: עֵדָה bezeichnet die versammelte Gemeinschaft Israels. „Gemeinde“ bewahrt den gemeinschaftlich-rechtlichen Charakter und ist zugleich verständlich.
theological_decisions:
- issue: Bezeichnung des Täters als Fluchender oder Gotteslästerer
  choice: den, der geflucht hat
  alternative: den Gotteslästerer / den, der gelästert hat
  rationale: קלל bedeutet unmittelbar „fluchen“; der Kontext bezieht den Fluch auf den göttlichen Namen. Die Übersetzung bewahrt den lexikalischen Wortlaut im Haupttext und nennt die kontextuell mögliche Deutung in der Fußnote.
- issue: Bedeutung der Handauflegung
  choice: Die Handlung wird im Haupttext wörtlich wiedergegeben, ohne ihre Bedeutung festzulegen.
  alternative: Auslegung als förmliche Identifizierung durch die Zeugen oder als symbolische Übertragung von Schuld
  rationale: Der Vers ordnet die Handlung an, erklärt ihre Symbolik jedoch nicht. Daher wird keine einzelne Deutung in den Haupttext aufgenommen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen Hauptsätze bilden die Folge der Anordnungen klar ab. „Es gehört haben“ ist im Deutschen natürlicher als ein objektloses „gehört haben“ und vermeidet zugleich das nicht ausdrücklich im hebräischen Text stehende „ihn“.
