base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/020.yaml
  text: fracture for fracture[a], eye for eye, tooth for tooth; as he inflicts an injury on a person[b], so it shall be inflicted on him.
translation:
  language: de
  text: Bruch für Bruch, Auge für Auge, Zahn für Zahn; wie jemand einem Menschen eine Verletzung zufügt[a], so soll sie auch ihm zugefügt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht hier eine Verbindung aus „geben“ und „Makel/Schädigung“; gemeint ist, einem Menschen eine körperliche Schädigung zuzufügen. Möglich ist daher auch: „wie jemand einen Menschen entstellt“ oder „ihm einen Makel zufügt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁבֶר
  choice: Bruch
  rationale: Das Substantiv bezeichnet hier eine körperliche Fraktur bzw. einen Bruch. „Bruch“ ist im Deutschen präzise und bewahrt die knappe Rechtsformel.
- source_word: תַּחַת
  choice: für
  rationale: In der talionischen Formel bezeichnet תַּחַת die entsprechende Gegenleistung beziehungsweise Gleichwertigkeit. Das idiomatische deutsche „für“ erhält die feste Formulierung.
- source_word: עַיִן
  choice: Auge
  rationale: Direkte Wiedergabe des anatomischen Begriffs.
- source_word: שֵׁן
  choice: Zahn
  rationale: Direkte Wiedergabe des anatomischen Begriffs.
- source_word: כַּאֲשֶׁר
  choice: wie
  rationale: Leitet den Vergleich ein, auf dem die rechtliche Entsprechung beruht.
- source_word: יִתֵּן
  choice: zufügt
  rationale: נתן bedeutet wörtlich „geben/setzen“, bildet mit מוּם aber eine idiomatische Verbindung für das Verursachen einer körperlichen Schädigung. „Eine Verletzung zufügen“ ist natürliches juristisches Deutsch.
- source_word: מוּם
  choice: Verletzung
  rationale: Das Wort kann „Makel“, „Gebrechen“ oder „körperliche Schädigung“ bedeuten. Im Zusammenhang einer von einem Menschen verursachten Gewalttat trifft „Verletzung“ den Sinn am klarsten, ohne die mögliche bleibende Entstellung eigens festzulegen.
- source_word: אָדָם
  choice: Mensch
  rationale: Hier bezeichnet der Singular in einem Rechtssatz einen beliebigen Menschen. „Einem Menschen“ ist quellennah, natürlich und schließt keine Personengruppe unnötig aus.
- source_word: כֵּן
  choice: so
  rationale: Markiert knapp die entsprechende Rechtsfolge und erhält die Symmetrie des Satzes.
- source_word: יִנָּתֶן בּוֹ
  choice: soll sie auch ihm zugefügt werden
  rationale: Der Niphal von נתן ist passiv; das feminine Pronomen „sie“ nimmt im Deutschen die zuvor genannte „Verletzung“ auf. „Ihm“ gibt das pronominale בּוֹ kontextgerecht wieder, und „soll“ entspricht dem normativen Charakter des Rechtssatzes.
theological_decisions:
- issue: Charakter der Talionsformel
  choice: Die konkrete Formel „Bruch für Bruch, Auge für Auge, Zahn für Zahn“ wird beibehalten.
  alternative: Eine Verletzung soll durch gleichwertige Entschädigung vergolten werden.
  rationale: Der hebräische Text formuliert konkrete Entsprechungen. Ob diese körperliche Vergeltung, eine Begrenzung des Strafmaßes oder eine Form von Ersatzleistung regeln, wird im Vers selbst nicht ausdrücklich entschieden und darf nicht in die Übersetzung eingetragen werden.
- issue: Bedeutungsumfang von מוּם
  choice: Verletzung
  alternative: Makel, Gebrechen oder Entstellung
  rationale: „Verletzung“ passt zum unmittelbaren Rechtskontext und bleibt breit genug. Die Übersetzung soll weder bloß einen kosmetischen Makel noch zwingend eine dauerhafte Entstellung voraussetzen.
- issue: Generischer Bezug von אָדָם
  choice: einem Menschen
  alternative: einem Mann
  rationale: אָדָם bezeichnet hier im kasuistischen Recht einen Menschen als Opfer. Die inklusive generische Bedeutung wird mit „Mensch“ natürlich wiedergegeben, ohne eine geschlechtsspezifische Lehraussage einzuführen.
translation_notes:
  register: Knappe, würdige Rechtssprache in modernem Standarddeutsch. Die traditionelle und einprägsame Talionsformel bleibt erhalten; der Folgesatz wird idiomatisch formuliert, ohne die rechtliche Art ihrer Vollstreckung näher zu bestimmen.
