base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: de
  text: 'Da redete Jahwe[a] zu Mose:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Da redete
  rationale: Das konsekutive וַ führt die Erzählung weiter. „Da redete“ gibt die zeitlich-fortschreitende Funktion in natürlichem, würdigem Deutsch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, statt ihn durch den Titel „der HERR“ zu ersetzen.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition bezeichnet hier den Adressaten der Rede; „zu Mose reden“ ist die natürliche deutsche Verbindung.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: „Mose“ ist die etablierte deutsche Form des hebräischen Personennamens.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv leitet die unmittelbar folgende wörtliche Rede ein. Im modernen Deutschen erfüllt ein Doppelpunkt diese Funktion natürlicher als das formelhafte „und sprach“ oder „indem er sagte“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ bewahrt ihn als persönlichen Gottesnamen; die traditionelle Ersatzlesung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, gut verständliches und zugleich würdevolles Standarddeutsch. Der Doppelpunkt gibt die hebräische Einleitungsformel לֵאמֹר idiomatisch wieder und verweist auf die in Vers 2 folgende direkte Rede.
