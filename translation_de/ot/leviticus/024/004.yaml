  text: עַ֚ל הַ/מְּנֹרָ֣ה הַ/טְּהֹרָ֔ה יַעֲרֹ֖ךְ אֶת הַ/נֵּר֑וֹת לִ/פְנֵ֥י יְהוָ֖ה תָּמִֽיד־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/004.yaml
  text: On the pure lampstand he shall arrange the lamps before Yahweh continually[a].
translation:
  language: de
  text: Auf dem reinen Leuchter soll er die Lampen vor Jahwe beständig anordnen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל
  choice: auf
  rationale: Die Präposition bezeichnet hier am natürlichsten die Position der Lampen auf dem Leuchter.
- source_word: הַמְּנֹרָה הַטְּהֹרָה
  choice: dem reinen Leuchter
  rationale: מְנוֹרָה bezeichnet den kultischen Leuchter; טָהוֹר wird im priesterlichen Zusammenhang treffend mit „rein“ wiedergegeben.
- source_word: יַעֲרֹךְ
  choice: soll er … in Ordnung bringen
  rationale: ערך bezeichnet das geordnete Aufstellen beziehungsweise Herrichten der Lampen, ohne darüber hinaus eine umfassende Wartung auszudrücken.
- source_word: הַנֵּרוֹת
  choice: die Lampen
  rationale: Gemeint sind die einzelnen Lampen des Leuchters.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי ist eine übliche kultische Wendung für Handeln vor beziehungsweise in der Gegenwart Gottes; der Gottesname wird ausdrücklich wiedergegeben.
- source_word: תָּמִיד
  choice: beständig
  rationale: Das Wort bezeichnet im priesterlichen Sprachgebrauch eine fortdauernde beziehungsweise regelmäßig wiederkehrende Verrichtung; „beständig“ bewahrt diese Spannweite knapp.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ gibt ihn im Deutschen als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von תָּמִיד
  choice: beständig
  alternative: ständig; regelmäßig
  rationale: Im kultischen Kontext kann der Ausdruck sowohl fortdauernde Geltung als auch regelmäßige Ausführung bezeichnen. „Beständig“ lässt diese Spannung bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung folgt dem hebräischen Schwerpunkt auf dem reinen Leuchter, bleibt aber natürlich verständlich.
