  terminology: „Reiner Leuchter“, „Lampen“, „vor Jahwe“ und „beständig“ sind angemessen. „Jahwe“ gibt den im Ausgangstext stehenden Gottesnamen direkt wieder. „Beständig“ bewahrt die bei תָּמִיד mögliche Nuance kontinuierlicher bzw. regelmäßig fortgesetzter kultischer Handlung.
