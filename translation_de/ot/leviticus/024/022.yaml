  text: מִשְׁפַּ֤ט אֶחָד֙ יִהְיֶ֣ה לָ/כֶ֔ם כַּ/גֵּ֥ר כָּ/אֶזְרָ֖ח יִהְיֶ֑ה כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/022.yaml
  text: There shall be one standard of judgment for you, for the sojourner as for the native, for I am the LORD your God.
translation:
  language: de
  text: Ein und dasselbe Recht soll für euch gelten, für den Fremden ebenso wie für den Einheimischen; denn ich bin der HERR, euer Gott.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁפָּט אֶחָד
  choice: ein und dasselbe Recht
  rationale: Die Wendung bezeichnet hier eine einheitliche Rechtsnorm beziehungsweise Rechtsprechung. „Ein und dasselbe Recht“ gibt den rechtlichen Sinn natürlich und prägnant wieder.
- source_word: גֵּר
  choice: Fremder
  rationale: Gemeint ist ein nichtisraelitischer Fremder, der dauerhaft unter Israel lebt. „Fremder“ bleibt knapp und wahrt den Gegensatz zum Einheimischen, ohne einen modernen Rechtsstatus wie „Ausländer“ zu unterstellen.
- source_word: אֶזְרָח
  choice: Einheimischer
  rationale: Das Wort bezeichnet den im Land geborenen beziehungsweise zur einheimischen Bevölkerung gehörenden Menschen und bildet den natürlichen Gegenbegriff zu גֵּר.
- source_word: יְהוָה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens in Kapitälchen entspricht dem üblichen bibelsprachlichen Gebrauch und kennzeichnet, dass im Hebräischen der Eigenname JHWH steht.
theological_decisions:
- issue: Gleiche Rechtsnorm für Fremde und Einheimische
  choice: „für den Fremden ebenso wie für den Einheimischen“
  alternative: „wie der Fremde, so der Einheimische“
  rationale: Die gewählte Formulierung macht die rechtliche Gleichbehandlung klar, ohne den Geltungsbereich über den im Kontext bezeichneten ansässigen Fremden hinaus stillschweigend auszudehnen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die verbindliche Rechtsaussage wird mit „soll … gelten“ idiomatisch wiedergegeben; das abschließende Gotteswort behält seine feierliche Begründungsfunktion.
