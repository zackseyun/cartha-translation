id: LEV.24.7
reference: Leviticus 24:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/נָתַתָּ֥ עַל הַֽ/מַּעֲרֶ֖כֶת לְבֹנָ֣ה זַכָּ֑ה וְ/הָיְתָ֤ה לַ/לֶּ֨חֶם֙ לְ/אַזְכָּרָ֔ה אִשֶּׁ֖ה לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/007.yaml
  text: And you shall put pure frankincense on each row[a], and it shall be for the bread as a memorial portion[b], a food offering to Yahweh.
translation:
  language: de
  text: Auf jede Reihe[a] sollst du reinen Weihrauch legen. Er soll für das Brot als Gedenkanteil dienen, als Feueropfer[b] für Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: auf die Anordnung; gemeint sind hier die geordneten Reihen der Brote.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: als eine durch Feuer dargebrachte Gabe. Die genaue Herleitung des hebräischen Opferbegriffs ist umstritten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: sollst du … legen
  rationale: Das Qal-Perfekt mit waw hat in dieser kultischen Anweisung gebietenden Sinn. „Legen“ gibt die konkrete Platzierung natürlich wieder.
- source_word: עַל הַמַּעֲרֶכֶת
  choice: auf jede Reihe
  rationale: 'מַעֲרֶכֶת bezeichnet eine geordnete Aufstellung. Im Zusammenhang mit den zwei Brotreihen aus Vers 6 ist der Singular distributiv zu verstehen: Der Weihrauch wird auf beziehungsweise zu jeder Reihe gelegt.'
- source_word: לְבֹנָה זַכָּה
  choice: reinen Weihrauch
  rationale: לְבֹנָה bezeichnet Weihrauchharz; זַכָּה hebt seine kultische Reinheit hervor.
- source_word: וְהָיְתָה לַלֶּחֶם
  choice: Er soll für das Brot … dienen
  rationale: Das feminine Pronomen bezieht sich auf den Weihrauch. לֶחֶם ist hier kollektiv gebraucht und bezeichnet die ausgelegten Brote.
- source_word: לְאַזְכָּרָה
  choice: als Gedenkanteil
  rationale: Der priesterliche Fachausdruck bezeichnet den repräsentativen Anteil, der auf dem Altar dargebracht wird und das gesamte Opfer vor Gott in Erinnerung bringt.
- source_word: אִשֶּׁה
  choice: als Feueropfer
  rationale: Der kultische Ausdruck bezeichnet eine für Gott bestimmte Opfergabe, die gewöhnlich auf dem Altar verbrannt wird. „Feueropfer“ ist im Deutschen knapp und sachlich; eine alternative Deutung wird in der Fußnote genannt.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition bezeichnet den Empfänger beziehungsweise die Bestimmung der Opfergabe; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. „Jahwe“ bewahrt den Charakter als Eigenname, ohne ihn durch einen Titel zu ersetzen.
- issue: Funktion des Weihrauchs als אַזְכָּרָה
  choice: Gedenkanteil
  alternative: Erinnerungszeichen
  rationale: Der Text beschreibt nicht bloß ein gedankliches Erinnerungszeichen, sondern die kultische Funktion des Weihrauchs als stellvertretend dargebrachten Anteil für das Brot.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem kultischem Register. Die Satzteilung verdeutlicht den Bezug des Pronomens auf den Weihrauch. Fachbegriffe werden beibehalten, soweit sie für die Opferpraxis wesentlich sind, und durch Fußnoten abgesichert.
