  text: And you shall speak to the sons of Israel, saying, ‘If any man curses his God, then he shall bear his sin.
translation:
  language: de
  text: 'Und zu den Söhnen Israels[a] sollst du sagen: »Jeder Mann[b], der seinen Gott verflucht, soll seine Sünde tragen[c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Söhne Israels«; die Wendung bezeichnet hier das Volk Israel insgesamt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »wer auch immer«. Im Hebräischen wird »Mann« zur distributiven Hervorhebung wiederholt: »Mann, Mann«.'
    reason: lexical_alternative
  - marker: c
    text: »Seine Sünde tragen« ist eine hebräische Wendung dafür, die Schuld beziehungsweise die Verantwortung für die Verfehlung zu tragen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶל בְּנֵי יִשְׂרָאֵל
  choice: Zu den Söhnen Israels
  rationale: Die Wendung ist wörtlich mit »Söhnen Israels« wiedergegeben; sie bezeichnet hier das Volk Israel insgesamt. Das einleitende וְ muss im Deutschen bei diesem neuen Redeauftrag nicht eigens mit »und« ausgedrückt werden.
- source_word: תְּדַבֵּר לֵאמֹר
  choice: sollst du sagen
  rationale: Die rechtliche Anweisung an Mose wird mit »sollst du« wiedergegeben. Das hebräische »reden, indem man sagt« wird im natürlichen Deutschen knapp mit »sagen« formuliert.
- source_word: אִישׁ אִישׁ
  choice: irgendein Mann
  rationale: 'Die Wiederholung von אִישׁ hat distributive Bedeutung: Gemeint ist jeder beliebige Mann, auf den der Fall zutrifft. »Irgendein Mann« wahrt zugleich die maskuline Einzelform.'
- source_word: כִּי
  choice: wenn
  rationale: כִּי leitet hier den Tatbestand eines Rechtssatzes ein und wird daher konditional mit »wenn« wiedergegeben.
- source_word: יְקַלֵּל
  choice: verflucht
  rationale: Das Piel von קלל bezeichnet hier das Verfluchen oder verächtliche Schmähreden. »Verfluchen« gibt den Grundsinn wieder, ohne bereits die spezifischere Aussage des folgenden Verses vorwegzunehmen.
- source_word: אֱלֹהָיו
  choice: seinen Gott
  rationale: Der Possessivsuffix wird ausdrücklich bewahrt. Die Wiedergabe wird weder zu »den HERRN« verengt noch pluralisch als »seine Götter« verstanden.
- source_word: וְנָשָׂא חֶטְאוֹ
  choice: dann soll er seine Sünde tragen
  rationale: Das einleitende »dann« verdeutlicht im Deutschen die Folge des konditionalen Tatbestands. Die hebräische Wendung wird im Haupttext bewahrt und in einer Fußnote als Übernahme von Schuld beziehungsweise Haftung erläutert.
theological_decisions:
- issue: Bezug von אֱלֹהָיו
  choice: seinen Gott
  alternative: den HERRN; Gott; seine Götter
  rationale: Der hebräische Text enthält sowohl den Possessivbezug als auch die Bezeichnung אֱלֹהִים und unterscheidet diese Formulierung von der ausdrücklich auf den Namen bezogenen Bestimmung im folgenden Vers. Die Übersetzung lässt diese Spannung bestehen.
- issue: Geschlecht des Rechtssubjekts
  choice: irgendein Mann
  alternative: wer; irgendjemand; jeder Mensch
  rationale: אִישׁ steht zweimal im maskulinen Singular und wirkt distributiv. Die Übersetzung wahrt Form und Funktion, statt das Rechtssubjekt stillschweigend geschlechtsneutral wiederzugeben.
- issue: Bedeutung von »seine Sünde tragen«
  choice: Das hebräische Bild bleibt im Haupttext erhalten.
  alternative: seine Schuld tragen; für seine Verfehlung einstehen; die Strafe für seine Sünde tragen
  rationale: Die Wendung kann Schuld, Verantwortlichkeit und daraus folgende Haftung umfassen. Eine ausdeutende Übersetzung würde diese Bedeutungsbreite unnötig auf nur einen Aspekt festlegen.
translation_notes:
  register: Moderner, würdiger Gesetzesstil mit direkter Anrede Moses. Die Satzstellung ist natürlich deutsch, während die markanten hebräischen Ausdrücke »Söhne Israels«, »seinen Gott« und »seine Sünde tragen« bewusst erhalten bleiben.
