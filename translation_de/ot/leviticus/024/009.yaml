base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/009.yaml
  text: It shall belong to Aaron and to his sons[a], and they shall eat it in a holy place, because it is most holy to him from the food offerings of Yahweh, a permanent statute.
translation:
  language: de
  text: Es soll Aaron und seinen Söhnen gehören, und sie sollen es an einem heiligen Ort essen; denn es ist für ihn von den Feueropfern Jahwes hochheilig. Das ist eine ewige Ordnung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von den Opfergaben Jahwes“. Der hebräische Ausdruck bezeichnet traditionell Gaben, die auf dem Altar durch Feuer dargebracht werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה לְאַהֲרֹן וּלְבָנָיו
  choice: Es soll Aaron und seinen Söhnen gehören
  rationale: היה mit לְ und einem Empfänger bezeichnet hier Zugehörigkeit beziehungsweise Zuteilung. „Gehören“ gibt diesen rechtlichen Sinn im Deutschen natürlich wieder.
- source_word: וַאֲכָלֻהוּ
  choice: und sie sollen es essen
  rationale: Die Verbform führt die Rechtsanweisung fort. „Sollen“ bewahrt den verbindlichen Charakter, ohne eine stärkere Modalität einzutragen.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: an einem heiligen Ort
  rationale: Im Hebräischen steht kein Artikel. Daher wird nicht vorschnell ein bestimmter Heiligtumsraum bezeichnet.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: etwas Hochheiliges
  rationale: Die hebräische Steigerungsform bezeichnet den höchsten Heiligkeitsgrad. Die substantivische Formulierung passt zum Gegenstand, dem Brot.
- source_word: הוּא לוֹ
  choice: es ist für ihn
  rationale: Der Singular des hebräischen Pronomens bleibt erhalten; Aaron steht im Zusammenhang als Haupt der priesterlichen Linie.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: von den Feueropfern Jahwes
  rationale: אִשֶּׁה bezeichnet traditionell eine durch Feuer dargebrachte Opfergabe. „Feueropfer“ wahrt diesen kultischen Bezug; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: חָק עוֹלָם
  choice: eine immerwährende Bestimmung
  rationale: Die Wendung bezeichnet eine dauerhaft geltende kultische Festlegung. „Immerwährende Bestimmung“ ist würdig, verständlich und lässt offen, ob besonders die Ordnung oder der festgesetzte Anteil betont ist.
theological_decisions:
- issue: Bezug des singularischen לֹו nach der Nennung Aarons und seiner Söhne
  choice: „für ihn“ im Singular
  alternative: „für sie“ als kollektive Angleichung an Aaron und seine Söhne
  rationale: Der Singular des Ausgangstextes wird nicht stillschweigend geglättet. Der Kontext lässt erkennen, dass Aaron die priesterliche Linie repräsentiert.
- issue: Bedeutungsumfang von חָק עוֹלָם
  choice: „eine immerwährende Bestimmung“
  alternative: „ein immerwährender Anteil“
  rationale: חֹק kann sowohl eine festgesetzte Ordnung als auch einen zustehenden Anteil bezeichnen. Die Hauptübersetzung folgt dem rechtlichen Ausdruck, ohne die kultische Dauerhaftigkeit abzuschwächen.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit klarer Rechtssprache. Der Satzbau folgt dem hebräischen Gedankengang, bleibt aber flüssig; der Gedankenstrich kennzeichnet die abschließende rechtliche Festlegung.
