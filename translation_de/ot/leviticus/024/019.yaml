revisions:
- from: Und wenn jemand seinem Mitmenschen eine Verletzung zufügt[a], soll ihm ebenso getan werden, wie er getan hat.
  to: 'Und wenn jemand seinem Mitmenschen eine Verletzung zufügt[a]: Wie er gehandelt hat, so soll an ihm gehandelt werden.'
  rationale: Die Revision beseitigt die im Deutschen unnatürliche Objektellipse, ohne die rechtliche Proportionalitätsformel zu paraphrasieren oder einen privaten Vollstrecker einzutragen. Der Doppelklang von „gehandelt“ und „an ihm gehandelt werden“ spiegelt die hebräische Wiederholung von עשה und das Passiv von יֵעָשֶׂה wider. Die Fußnote wurde näher an die wörtliche hebräische Konstruktion gefasst.
