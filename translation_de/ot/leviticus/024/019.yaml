  edition: WLC
  text: וְ/אִ֕ישׁ כִּֽי יִתֵּ֥ן מ֖וּם בַּ/עֲמִית֑/וֹ כַּ/אֲשֶׁ֣ר עָשָׂ֔ה כֵּ֖ן יֵעָ֥שֶׂה לּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/019.yaml
  text: And if a man inflicts an injury on his fellow[a], just as he has done[b], so it shall be done to him.
translation:
  language: de
  text: 'Und wenn jemand seinem Mitmenschen eine Verletzung zufügt[a]: Wie er gehandelt hat, so soll an ihm gehandelt werden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „seinem Mitmenschen einen Makel/Defekt zufügt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי
  choice: Und wenn jemand
  rationale: Die Verbindung eröffnet einen kasuistischen Rechtsfall. „Wenn“ gibt die Bedingung wieder; „jemand“ klingt im modernen Deutschen natürlich und lässt das grammatische Maskulinum nicht unnötig als ausschließlich männlich erscheinen.
- source_word: יִתֵּן מוּם
  choice: eine Verletzung zufügt
  rationale: Wörtlich steht „einen Makel/Defekt gibt“. Im Zusammenhang körperlicher Schädigung bezeichnet die Wendung idiomatisch das Zufügen einer Verletzung.
- source_word: בַּעֲמִיתוֹ
  choice: seinem Mitmenschen
  rationale: עָמִית bezeichnet einen Mitangehörigen beziehungsweise Nächsten innerhalb der Gemeinschaft. „Mitmensch“ bewahrt den zwischenmenschlichen Bezug in natürlichem modernem Deutsch.
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: wie er getan hat
  rationale: Die Vergleichsformel bestimmt das Maß der entsprechenden Ahndung und bleibt bewusst knapp.
- source_word: כֵּן יֵעָשֶׂה לּוֹ
  choice: soll ihm ebenso getan werden
  rationale: Die passive Form bewahrt den unpersönlich-rechtlichen Charakter. „Soll“ gibt die normative Kraft des hebräischen Imperfekts in diesem Gesetzeskontext wieder.
theological_decisions:
- issue: Vergeltungsgrundsatz im rechtlichen Zusammenhang
  choice: Als unpersönlich formulierten Grundsatz entsprechender Ahndung wiedergegeben
  alternative: Als Aufforderung zu persönlicher Rache formulieren
  rationale: Das hebräische Passiv nennt keinen privaten Vollstrecker. Die Übersetzung bewahrt den gerichtlichen Charakter und führt keine spätere konfessionelle Deutung ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper Rechtssprache. Die Wiederholung von „getan“ bildet die hebräische Entsprechungsformel ab; die konkrete Bedeutung von מוּם wird in der Fußnote sichtbar gehalten.
