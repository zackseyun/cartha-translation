    issue: Unidiomatische und semantisch unvollständige Formel „wie er getan hat“
    rationale: Das hebräische עָשָׂה kann in der Vergleichsformel ohne ausdrücklich wiederholtes Objekt stehen; im modernen Deutschen wirkt „wie er getan hat“ jedoch elliptisch und lässt offen, was er getan haben soll. Eine parallele Formulierung mit „gehandelt“ gibt die Entsprechung klar wieder.
  revised_text: 'Und wenn jemand seinem Mitmenschen eine Verletzung zufügt[a]: Wie er gehandelt hat, so soll an ihm gehandelt werden.'
