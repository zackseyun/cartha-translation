source:
  edition: WLC
  text: וְ/שַׂמְתָּ֥ אוֹתָ֛/ם שְׁתַּ֥יִם מַֽעֲרָכ֖וֹת שֵׁ֣שׁ הַֽ/מַּעֲרָ֑כֶת עַ֛ל הַ/שֻּׁלְחָ֥ן הַ/טָּהֹ֖ר לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/006.yaml
  text: And you shall place them in two rows[a], six in each row[b], on the pure table before Yahweh.
translation:
  language: de
  text: Du sollst sie in zwei Reihen[a] auflegen, sechs in jeder Reihe, auf den reinen Tisch vor Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in zwei Anordnungen“ oder „in zwei Stapeln“. Das hebräische Wort bezeichnet eine geordnete Anordnung der Brote.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ אוֹתָם
  choice: Du sollst sie … auflegen
  rationale: שׂוּם bedeutet „setzen, legen, platzieren“. Im Zusammenhang mit den Broten auf dem Tisch ist „auflegen“ natürlich und gibt die Anweisung in der zweiten Person Singular wieder; „sie“ verweist auf die zwölf Brote aus dem vorherigen Vers.
- source_word: שְׁתַּיִם מַעֲרָכוֹת
  choice: in zwei Reihen
  rationale: מַעֲרָכָה bezeichnet eine geordnete Anordnung. „Reihen“ ist hier verständlich und idiomatisch, ohne die mögliche räumliche Ausgestaltung übermäßig festzulegen.
- source_word: שֵׁשׁ הַמַּעֲרָכֶת
  choice: sechs in jeder Reihe
  rationale: 'Die knappe hebräische Formulierung „sechs die Anordnung“ ist distributiv zu verstehen: Jede der beiden Anordnungen umfasst sechs Brote.'
- source_word: עַל הַשֻּׁלְחָן הַטָּהֹר
  choice: auf den reinen Tisch
  rationale: טָהוֹר trägt im Heiligtumskontext einen kultischen Sinn. „Rein“ bewahrt diesen Bezug und entspricht zugleich dem natürlichen deutschen Sprachgebrauch.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי bedeutet „vor, in der Gegenwart von“. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt den offenbarten Bundesnamen direkt wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Kultische Bedeutung von הַטָּהֹר
  choice: der reine Tisch
  alternative: der saubere Tisch
  rationale: Im Zusammenhang mit dem Heiligtum bezeichnet das Adjektiv kultische Reinheit und nicht lediglich äußerliche Sauberkeit.
translation_notes:
  register: Moderne, würdevolle Anweisungssprache. „Auflegen“ passt zum kultischen Aufstellen der Brote; der Singular „Du“ folgt der hebräischen Anrede. Die knappe Satzstruktur bleibt nahe am Ausgangstext.
