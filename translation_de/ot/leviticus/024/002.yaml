source:
  edition: WLC
  text: צַ֞ו אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/יִקְח֨וּ אֵלֶ֜י/ךָ שֶׁ֣מֶן זַ֥יִת זָ֛ךְ כָּתִ֖ית לַ/מָּא֑וֹר לְ/הַעֲלֹ֥ת נֵ֖ר תָּמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/002.yaml
  text: Command the sons of Israel that they bring to you pure oil of beaten olives for the light[b][a], to keep a lamp burning continually.
translation:
  language: de
  text: Gebiete den Israeliten[a], dass sie dir reines Öl aus zerstoßenen Oliven[b] für die Beleuchtung bringen, um beständig eine Lampe brennen zu lassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „den Söhnen Israels“; dies ist eine herkömmliche Bezeichnung für das Volk Israel.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „reines, aus zerstoßenen Oliven gewonnenes Öl“. Das Hebräische nennt sowohl die Reinheit des Öls als auch die Art seiner Gewinnung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  choice: Gebiete
  rationale: Der Imperativ von צוה ist eine verbindliche Befehlsformel. „Gebiete“ bewahrt ihre autoritative Kraft in würdigem, verständlichem Deutsch.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: den Israeliten
  rationale: Wörtlich steht „den Söhnen Israels“. Als konventionelle Bezeichnung für das Bundesvolk wird die Wendung im heutigen Deutsch natürlich mit „den Israeliten“ wiedergegeben; die Form des Hebräischen wird in einer Fußnote genannt.
- source_word: וְיִקְחוּ אֵלֶיךָ
  choice: dass sie dir … bringen
  rationale: לקח bedeutet gewöhnlich „nehmen“, bezeichnet mit אֵלֶיךָ („zu dir“) hier aber idiomatisch das Bringen beziehungsweise Bereitstellen.
- source_word: שֶׁמֶן זַיִת זָךְ כָּתִית
  choice: reines Öl aus zerstoßenen Oliven
  rationale: Die Wiedergabe nennt sowohl den Ausgangsstoff als auch die durch כָּתִית bezeichnete Gewinnungsweise und bewahrt zugleich זָךְ als „rein“.
- source_word: לַמָּאוֹר
  choice: für die Beleuchtung
  rationale: מָאוֹר bezeichnet hier Licht beziehungsweise Beleuchtung. „Für die Beleuchtung“ ist im Deutschen natürlicher als das formnahe „für das Licht“, ohne einen Lampenständer in den Text einzutragen.
- source_word: לְהַעֲלֹת נֵר
  choice: um … eine Lampe brennen zu lassen
  rationale: Die Hifil-Verbindung bedeutet idiomatisch, eine Lampe anzuzünden beziehungsweise brennend zu halten. Die gewählte Form ist natürlich und lässt mit תָּמִיד den fortdauernden Vollzug hervortreten.
- source_word: תָּמִיד
  choice: beständig
  rationale: Das Wort bezeichnet im priesterlichen Zusammenhang einen fortlaufenden beziehungsweise regelmäßig andauernden Vollzug. „Beständig“ wahrt diese mögliche Spannweite.
theological_decisions:
- issue: Bundesbezeichnung בְּנֵי יִשְׂרָאֵל
  choice: den Israeliten
  alternative: den Söhnen Israels
  rationale: Die wörtlich maskuline Pluralform ist eine feststehende Bezeichnung für das Volk Israel und nicht eindeutig auf männliche Einzelpersonen beschränkt. Der Haupttext verwendet deshalb die natürliche deutsche Volksbezeichnung, während die Fußnote die hebräische Form transparent macht.
- issue: Bedeutungsumfang von תָּמִיד
  choice: beständig
  alternative: ununterbrochen / regelmäßig
  rationale: Im kultischen Sprachgebrauch kann תָּמִיד fortdauernde oder regelmäßig wiederkehrende Ausübung bezeichnen. „Beständig“ bewahrt diese Spannung, ohne vorschnell absolute Unterbrechungslosigkeit festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Gebiete“ erhält den verbindlichen Ton der göttlichen Anweisung; „Israeliten“ und „für die Beleuchtung“ vermeiden unnötig sperrige Formulierungen. Die Satzstruktur bleibt nahe am Hebräischen, klingt aber im Deutschen flüssig.
