  verdict: approve
  source_fidelity: '„Und wenn ein Mann einen Menschen erschlägt, muss er getötet werden“ gibt die Abfolge und den Rechtssatz des Hebräischen zuverlässig wieder: וְאִישׁ כִּי als angeschlossener Konditionalsatz, יַכֶּה als tödliches Erschlagen im Kontext und מוֹת יוּמָת als nachdrückliche passive Todesstrafe. „Einen Menschen“ trifft כָּל־נֶפֶשׁ אָדָם idiomatisch als menschliche Person und vermeidet die sachlich unzutreffende Einengung auf eine immaterielle Seele.'
  naturalness: Der Satz ist knapp, klar und in modernem Standarddeutsch als Rechtssatz natürlich. „Erschlägt“ wahrt das Bild des Schlagens und ist wegen der unmittelbar folgenden Strafbestimmung angemessen.
  terminology: „Mann“ bewahrt das maskuline אִישׁ; „Mensch“ gibt אָדָם im Zusammenhang generisch wieder. Die Fußnoten erläutern die semantische Spannweite von נֶפֶשׁ und die hier tödliche Bedeutung von נכה zutreffend. Die Anker sind sinnvoll unmittelbar bei den erläuterten Ausdrücken platziert.
