id: LEV.24.17
reference: Leviticus 24:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אִ֕ישׁ כִּ֥י יַכֶּ֖ה כָּל נֶ֣פֶשׁ אָדָ֑ם מ֖וֹת יוּמָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/017.yaml
  text: And if a man strikes down any human being[b][a], he shall surely be put to death.
translation:
  language: de
  text: Und wenn ein Mann einen Menschen[a] erschlägt[b], muss er getötet werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „irgendein Menschenleben“ oder „irgendeine menschliche Person“. Das hebräische נֶפֶשׁ meint hier den Menschen beziehungsweise sein Leben, nicht speziell eine immaterielle „Seele“.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Verb bedeutet wörtlich „schlagen“; in diesem Zusammenhang ist ein tödlicher Schlag gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי
  choice: Und wenn ein Mann
  rationale: Das וְ verbindet die Bestimmung mit dem Zusammenhang; כִּי leitet hier einen Rechtsfall ein. אִישׁ ist ausdrücklich maskulin und wird daher mit „ein Mann“ wiedergegeben.
- source_word: יַכֶּה
  choice: erschlägt
  rationale: Das Hifil von נכה bedeutet wörtlich „schlagen“, bezeichnet hier aber aufgrund des Gegenstands und der folgenden Todesstrafe einen tödlichen Schlag. „Erschlägt“ bringt beides knapp zum Ausdruck.
- source_word: כָּל נֶפֶשׁ אָדָם
  choice: einen Menschen
  rationale: נֶפֶשׁ bezeichnet hier die menschliche Person beziehungsweise ihr Leben, nicht eigens eine immaterielle Seele. Im Deutschen gibt „einen Menschen“ den gemeinten persönlichen Bezug natürlicher wieder als „eine menschliche Seele“ oder das abstraktere „menschliches Leben“.
- source_word: מוֹת יוּמָת
  choice: muss er getötet werden
  rationale: Die Verbindung aus Infinitivus absolutus und passiver Verbform bekräftigt die verbindliche Todesfolge. Das Passiv des hebräischen Rechtssatzes bleibt erhalten.
theological_decisions:
- issue: Bedeutung von נֶפֶשׁ in כָּל נֶפֶשׁ אָדָם
  choice: einen Menschen
  alternative: jedes menschliche Leben; eine Menschenseele
  rationale: Der Ausdruck meint hier einen lebenden Menschen als Opfer. Die Übersetzung vermeidet sowohl eine Verengung auf eine immaterielle „Seele“ als auch eine unnötige Abstraktion.
- issue: Maskulines אִישׁ als Täterbezeichnung
  choice: ein Mann
  alternative: wer; ein Mensch
  rationale: Die ausdrücklich maskuline Form des Ausgangstextes wird bewahrt, ohne über die mögliche repräsentative Reichweite des Rechtssatzes hinauszugehen.
- issue: Verstärkte Todesformel מוֹת יוּמָת
  choice: muss er getötet werden
  alternative: soll er unbedingt getötet werden; muss er sterben
  rationale: „Muss“ vermittelt die nachdrückliche Verbindlichkeit, während „getötet werden“ das Passiv und damit die auferlegte Strafe wahrt.
translation_notes:
  register: Knapper, würdevoller Rechtsstil in modernem Standarddeutsch. „Erschlägt“ bewahrt das konkrete Bild des Schlagens und macht zugleich dessen tödlichen Ausgang deutlich; „muss … getötet werden“ gibt die nachdrückliche passive Strafbestimmung natürlich wieder.
