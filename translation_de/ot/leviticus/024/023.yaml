source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר מֹשֶׁה֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ וַ/יּוֹצִ֣יאוּ אֶת הַֽ/מְקַלֵּ֗ל אֶל מִ/חוּץ֙ לַֽ/מַּחֲנֶ֔ה וַ/יִּרְגְּמ֥וּ אֹת֖/וֹ אָ֑בֶן וּ/בְנֵֽי יִשְׂרָאֵ֣ל עָשׂ֔וּ כַּֽ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/023.yaml
  text: So Moses spoke to the sons of Israel[a], and they brought the one who had cursed outside the camp and stoned him with stones. Thus the sons of Israel did as Yahweh had commanded Moses.
translation:
  language: de
  text: Da redete Mose zu den Israeliten. Sie führten den, der geflucht hatte,[a] aus dem Lager hinaus und steinigten ihn. So taten die Israeliten, wie Jahwe es Mose geboten hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Gotteslästerer“. Wörtlich: „den Fluchenden“; gemeint ist der Mann, der im vorausgehenden Zusammenhang den göttlichen Namen verflucht hatte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: redete
  rationale: Das Piel von דבר bedeutet hier „reden/sprechen“. „Redete“ passt natürlich zu Moses öffentlicher Mitteilung an Israel.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die geläufige deutsche Volksbezeichnung gibt das hebräische Idiom „Söhne Israels“ natürlich und ohne Bedeutungsverlust wieder.
- source_word: וַיּוֹצִיאוּ
  choice: sie führten … hinaus
  rationale: Das Hifil von יצא bezeichnet das Hinausbringen. Bei einer Person in diesem gerichtlichen Zusammenhang ist „hinausführen“ idiomatisch und präzise.
- source_word: הַמְקַלֵּל
  choice: der, der geflucht hatte
  rationale: Das substantivierte Partizip von קלל bezeichnet den Fluchenden und verweist auf die vorausgehende Tat. Das Plusquamperfekt bildet diesen Rückbezug im Deutschen klar ab, ohne den stärker deutenden Begriff „Gotteslästerer“ in den Haupttext einzutragen.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: vor das Lager hinaus
  rationale: Die Wendung bezeichnet das Gebiet außerhalb des Lagers; zusammen mit dem Bewegungsverb gibt „vor das Lager hinaus“ Ziel und Bewegung natürlich wieder.
- source_word: וַיִּרְגְּמוּ אֹתוֹ אָבֶן
  choice: steinigten ihn
  rationale: Das deutsche Verb „steinigen“ enthält das im Hebräischen zusätzlich genannte Mittel אָבֶן („Stein“) bereits. „Mit Steinen steinigen“ wäre unnötig schwerfällig.
- source_word: עָשׂוּ כַּאֲשֶׁר צִוָּה
  choice: taten …, wie … geboten hatte
  rationale: Die Formel fasst die Ausführung eines zuvor erteilten Befehls zusammen; das Plusquamperfekt verdeutlicht die zeitliche Abfolge.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
theological_decisions:
- issue: Ob הַמְקַלֵּל als „Gotteslästerer“ wiederzugeben ist
  choice: der, der geflucht hatte
  alternative: der Gotteslästerer
  rationale: Der Kontext betrifft das Verfluchen des göttlichen Namens, doch die Form selbst ist ein Partizip von קלל („fluchen/verfluchen“). Die direkte Wiedergabe bewahrt den Wortlaut und vermeidet eine stärkere theologische Festlegung im Haupttext.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Israeliten“ ist gegenüber dem im Deutschen markierten „Söhne Israels“ die natürliche Volksbezeichnung. Die Satzfolge bleibt eng am hebräischen Erzählgang; „So“ gibt die abschließende Gehorsamsformel klar wieder.
