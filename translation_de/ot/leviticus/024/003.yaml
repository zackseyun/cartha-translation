source:
  edition: WLC
  text: מִ/חוּץ֩ לְ/פָרֹ֨כֶת הָ/עֵדֻ֜ת בְּ/אֹ֣הֶל מוֹעֵ֗ד יַעֲרֹךְ֩ אֹת֨/וֹ אַהֲרֹ֜ן מֵ/עֶ֧רֶב עַד בֹּ֛קֶר לִ/פְנֵ֥י יְהוָ֖ה תָּמִ֑יד חֻקַּ֥ת עוֹלָ֖ם לְ/דֹרֹֽתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/003.yaml
  text: Outside the veil of the testimony[a], in the tent of meeting, Aaron shall arrange it from evening until morning before Yahweh continually[c][b]. It is a permanent statute throughout your generations.
translation:
  language: de
  text: Außerhalb des Vorhangs des Zeugnisses[a], im Zelt der Begegnung, soll Aaron es vom Abend bis zum Morgen beständig[b] vor Jahwe herrichten. Das ist eine dauerhafte Ordnung[c] für alle eure Generationen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »des Schleiers des Zeugnisses«.'
    reason: lexical_alternative
  - marker: b
    text: »Beständig« meint hier die fortlaufende regelmäßige Einhaltung des Rituals; als Zeitraum nennt der Vers jeweils den Abend bis zum Morgen.
    reason: cultural_note
  - marker: c
    text: 'Auch: »ewige Ordnung« oder »immerwährende Ordnung«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִחוּץ לְפָרֹכֶת הָעֵדֻת
  choice: Außerhalb des Vorhangs des Zeugnisses
  rationale: Die Wendung bezeichnet den Bereich außerhalb des inneren Heiligtumsvorhangs. Die Genitivverbindung bewahrt die knappe kultische Ausdrucksweise des Hebräischen, ohne das Verhältnis zum »Zeugnis« genauer festzulegen.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: im Zelt der Begegnung
  rationale: Dies ist eine verständliche und im Deutschen etablierte Wiedergabe der Bezeichnung für das Heiligtumszelt.
- source_word: יַעֲרֹךְ אֹתוֹ
  choice: soll ... es ... herrichten
  rationale: ערך bezeichnet hier das ordnungsgemäße Herrichten beziehungsweise Betreuen im Rahmen des Rituals. Das Pronomen »es« erhält den Rückverweis des hebräischen Textes auf das Licht beziehungsweise die Lampe aus dem vorherigen Vers.
- source_word: מֵעֶרֶב עַד בֹּקֶר
  choice: vom Abend bis zum Morgen
  rationale: Die Übersetzung gibt den ausdrücklich genannten nächtlichen Zeitraum direkt und natürlich wieder.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי bezeichnet im kultischen Zusammenhang die Gegenwart Gottes; der Gottesname wird als »Jahwe« wiedergegeben.
- source_word: תָּמִיד
  choice: beständig
  rationale: Das Wort bezeichnet hier die fortdauernde, regelmäßig wiederkehrende Einhaltung des Rituals, deren täglicher Zeitraum unmittelbar als »vom Abend bis zum Morgen« bestimmt wird.
- source_word: חֻקַּת עוֹלָם
  choice: eine dauerhafte Ordnung
  rationale: Die Formulierung bezeichnet eine bleibend geltende kultische Vorschrift. »Dauerhafte Ordnung« ist in modernem Deutsch verständlich, ohne die zeitliche Tragweite stärker festzulegen als der Zusammenhang.
- source_word: לְדֹרֹתֵיכֶם
  choice: für alle eure Generationen
  rationale: Die Wendung bringt die fortdauernde Geltung für die aufeinanderfolgenden Generationen Israels zum Ausdruck.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. »Jahwe« gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von תָּמִיד beim Lampenritual
  choice: beständig
  alternative: ununterbrochen; regelmäßig
  rationale: Da derselbe Vers den Zeitraum auf »vom Abend bis zum Morgen« eingrenzt, bezeichnet das Wort hier am ehesten die beständige beziehungsweise regelmäßig fortgesetzte Einhaltung. Die Übersetzung lässt die Spannung zwischen Dauer und wiederkehrender Verrichtung bestehen.
- issue: Zeitliche Tragweite von חֻקַּת עוֹלָם
  choice: dauerhafte Ordnung
  alternative: ewige Ordnung; immerwährende Ordnung
  rationale: עוֹלָם kann eine unabsehbar lange oder bleibende Geltung ausdrücken. »Dauerhaft« wahrt diese Aussage, ohne eine bestimmte systematisch-theologische Deutung des Bundesgesetzes vorwegzunehmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kultischer Fachsprache, die aus dem Zusammenhang verständlich bleibt. Der Satzbau folgt weitgehend der hebräischen Abfolge, ohne unnatürlich zu wirken. Die Pronomenreferenz und die zeitlichen Mehrdeutigkeiten werden nicht stillschweigend aufgelöst.
