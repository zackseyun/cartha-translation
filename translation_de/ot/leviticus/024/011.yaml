source:
  edition: WLC
  text: וַ֠/יִּקֹּב בֶּן הָֽ/אִשָּׁ֨ה הַ/יִּשְׂרְאֵלִ֤ית אֶת הַ/שֵּׁם֙ וַ/יְקַלֵּ֔ל וַ/יָּבִ֥יאוּ אֹת֖/וֹ אֶל מֹשֶׁ֑ה וְ/שֵׁ֥ם אִמּ֛/וֹ שְׁלֹמִ֥ית בַּת דִּבְרִ֖י לְ/מַטֵּה דָֽן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/011.yaml
  text: The son of the Israelite woman blasphemed the Name and cursed[a], and they brought him to Moses. Now his mother's name was Shelomith daughter of Dibri, of the tribe of Dan.
translation:
  language: de
  text: Der Sohn der Israelitin sprach den Namen ausdrücklich aus und fluchte[a]. Da brachten sie ihn zu Mose. Seine Mutter hieß Schelomit, eine Tochter Dibris aus dem Stamm Dan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „lästerte den Namen und fluchte“. Das hebräische Verb kann „ausdrücklich nennen“ oder „aussprechen“ bedeuten, in diesem Zusammenhang aber auch als Teil der Lästerung verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקֹּב
  choice: sprach … ausdrücklich aus
  rationale: נקב kann hier das deutliche bzw. ausdrückliche Nennen bezeichnen. Zusammen mit dem folgenden eigenständigen Verb וַיְקַלֵּל wird so die Abfolge bewahrt, ohne beide Verben vorschnell zu ‚lästern‘ zusammenzuziehen.
- source_word: אֶת הַשֵּׁם
  choice: den Namen
  rationale: Der bestimmte Ausdruck bezeichnet in diesem Zusammenhang ehrfürchtig den göttlichen Namen. Die Formulierung wahrt diese verhüllende Redeweise, ohne den Gottesnamen einzusetzen.
- source_word: וַיְקַלֵּל
  choice: und verfluchte ihn
  rationale: Das Piel von קלל bedeutet gewöhnlich ‚verfluchen‘. Das Pronomen macht im Deutschen natürlich kenntlich, dass sich die Handlung auf den zuvor genannten Namen beziehungsweise dessen Träger richtet; die genaue Art des Fluches bleibt offen.
- source_word: בֶּן הָאִשָּׁה הַיִּשְׂרְאֵלִית
  choice: Der Sohn der Israelitin
  rationale: Eine knappe, natürliche Wiedergabe der im Zusammenhang bereits eingeführten Frau.
- source_word: וַיָּבִיאוּ אֹתוֹ אֶל מֹשֶׁה
  choice: Da brachten sie ihn zu Mose
  rationale: Die aktive dritte Person Plural mit ungenanntem Subjekt bleibt als unbestimmtes ‚sie‘ erhalten.
- source_word: וְשֵׁם אִמּוֹ
  choice: Seine Mutter hieß
  rationale: Natürliches modernes Deutsch für die eingeschobene Angabe zum Namen der Mutter.
- source_word: שְׁלֹמִית בַּת דִּבְרִי
  choice: Schelomit; sie war eine Tochter Dibris
  rationale: Die Eigennamen werden deutsch transliteriert; die Abstammungsangabe wird klar und idiomatisch ausgedrückt.
- source_word: לְמַטֵּה דָן
  choice: aus dem Stamm Dan
  rationale: Die Wendung bezeichnet die Stammeszugehörigkeit.
theological_decisions:
- issue: Bedeutung von נקב in Verbindung mit ‚dem Namen‘
  choice: Das Verb als ausdrückliches Aussprechen des Namens wiedergeben und das anschließende Verfluchen als eigene Handlung bewahren.
  alternative: ‚Den Namen lästern und fluchen‘ beziehungsweise ‚den Namen verlästern‘.
  rationale: Im Vers stehen zwei Verben, נקב und קלל. Die gewählte Fassung erhält ihre Unterscheidung und zugleich die mögliche rechtliche und theologische Bedeutung des ausdrücklichen Nennens. Eine Fußnote macht transparent, dass נקב im Kontext auch als ‚lästern‘ verstanden werden kann.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Sätze sind gegenüber der hebräischen Reihung leicht gegliedert. ‚Schelomit‘ und ‚Dibri‘ folgen geläufiger deutscher Umschrift; ‚Mose‘ und ‚Dan‘ den etablierten deutschen Namensformen.
