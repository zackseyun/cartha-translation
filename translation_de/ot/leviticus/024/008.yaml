base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/008.yaml
  text: Every Sabbath day he shall arrange it before Yahweh continually[c][b][a], from the sons of Israel as an everlasting covenant.
translation:
  language: de
  text: 'Sabbat für Sabbat[a] soll er es[b] vor Jahwe beständig zurechtlegen: ein ewiger Bund vonseiten der Israeliten.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „am Sabbattag, am Sabbattag“; die Wiederholung bedeutet „an jedem Sabbat“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „soll er es geordnet auflegen“. Das singularische „es“ bezieht sich wahrscheinlich zusammenfassend auf das Brot beziehungsweise die gesamte Brotanordnung.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder deutender: „als dauernde Bundesverpflichtung“. Der knappe hebräische Wortlaut lässt den genauen syntaktischen Anschluss der Bundesformel offen.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיוֹם הַשַּׁבָּת בְּיוֹם הַשַּׁבָּת
  choice: Sabbat für Sabbat
  rationale: Die Wiederholung hat distributiven Sinn und bezeichnet die regelmäßige Wiederkehr an jedem Sabbat. Die deutsche Wendung gibt diesen Sinn knapp und natürlich wieder.
- source_word: יַעַרְכֶנּוּ
  choice: soll er es anordnen
  rationale: ערך bezeichnet das geordnete Auflegen beziehungsweise Aufstellen kultischer Gegenstände. Das singularische Suffix wird beibehalten und bezieht sich kollektiv auf das Brot beziehungsweise die Brotanordnung.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: Die kultische Wendung bezeichnet das Darbringen oder Anordnen in Jahwes Gegenwart. Der Gottesname wird im Deutschen als „Jahwe“ wiedergegeben.
- source_word: תָּמִיד
  choice: beständig
  rationale: Im priesterlichen Zusammenhang bezeichnet das Wort eine fortdauernde, regelmäßig eingehaltene Ordnung; der vorausgehende Wochentakt verhindert das Missverständnis einer ununterbrochenen Handlung.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: von den Israeliten
  rationale: מֵאֵת kennzeichnet Herkunft beziehungsweise Quelle. „Die Israeliten“ gibt den korporativen Ausdruck בְּנֵי יִשְׂרָאֵל in natürlichem modernem Deutsch wieder, ohne seinen Bezug auf Israel abzuschwächen.
- source_word: בְּרִית עוֹלָם
  choice: als ewiger Bund
  rationale: Die wörtliche Bundesformulierung bleibt erhalten; eine erklärende Erweiterung wie „Bundesverpflichtung“ würde die rechtlich-kultische Funktion stärker auslegen, als es der hebräische Wortlaut selbst tut.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ bewahrt den Eigennamen in der im Deutschen geläufigen Form.
- issue: Korporative Bezeichnung בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: Die Wendung bezeichnet hier das Bundesvolk als Ganzes. „Die Israeliten“ ist bedeutungsgenau und in modernem Deutsch natürlicher; die wörtlichere Form wird in der Anmerkung genannt.
- issue: Bedeutung und syntaktischer Anschluss von בְּרִית עוֹלָם
  choice: als ewiger Bund
  alternative: als dauernde Bundesverpflichtung
  rationale: Die Übersetzung erhält die theologisch gewichtige und zugleich knappe Bundesformel, ohne ihre genaue kultisch-rechtliche Funktion oder ihren syntaktischen Bezug stillschweigend festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst knapper kultischer Ausdrucksweise. Die leicht verdichtete Schlussfügung bewahrt die syntaktische Spannung des Hebräischen, statt sie durch zusätzliche Substantive oder Verben eindeutig auszulegen.
