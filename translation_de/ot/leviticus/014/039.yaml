  text: וְ/שָׁ֥ב הַ/כֹּהֵ֖ן בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֑י וְ/רָאָ֕ה וְ/הִנֵּ֛ה פָּשָׂ֥ה הַ/נֶּ֖גַע בְּ/קִירֹ֥ת הַ/בָּֽיִת׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/039.yaml
  text: Then the priest shall return on the seventh day and look, and if the infection has spread in the walls of the house,
translation:
  language: de
  text: Dann soll der Priester am siebten Tag wiederkommen und nachsehen. Wenn sich der Befall an den Wänden des Hauses ausgebreitet hat,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁב
  choice: Dann soll … wiederkommen
  rationale: Das Verb שׁוב bezeichnet hier die Rückkehr des Priesters; „soll“ gibt den Anweisungscharakter des Rechtsabschnitts wieder.
- source_word: וְרָאָה
  choice: und nachsehen
  rationale: ראה bedeutet wörtlich „sehen“, bezeichnet hier aber die amtliche Untersuchung des Hauses; „nachsehen“ ist im Deutschen natürlich und präzise.
- source_word: הַנֶּגַע
  choice: der Befall
  rationale: נגע bezeichnet in diesem Zusammenhang eine auffällige Schädigung beziehungsweise einen Befall am Haus. „Befall“ vermeidet die zu enge medizinische Bedeutung von „Infektion“.
- source_word: פָּשָׂה
  choice: sich … ausgebreitet hat
  rationale: Das Verb bezeichnet die räumliche Ausbreitung des Befalls.
- source_word: בְּקִירֹת הַבָּיִת
  choice: an den Wänden des Hauses
  rationale: Die Präposition ב kann hier örtlich mit „an“ wiedergegeben werden; קִירוֹת ist der Plural „Wände“.
theological_decisions:
- issue: Wiedergabe von וְהִנֵּה vor einer Bedingung
  choice: „Wenn“ ohne eigenständiges „siehe“
  alternative: „und siehe, der Befall hat sich … ausgebreitet“
  rationale: Im Prüfungs- und Rechtskontext leitet וְהִנֵּה den festgestellten Fall ein. Natürliches Deutsch formuliert dies konditional; dabei wird keine theologische Aussage festgelegt oder verändert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt wie im Hebräischen zum folgenden Vers hin offen; die abschließende Interpunktion ist daher ein Komma.
