  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und den Sinn des Hebräischen zuverlässig wieder: תּוֹרַת als „Weisung“, נֶגַע צָרָעַת als eine nicht mit modernem Aussatz gleichgesetzte Hautkrankheit, das Idiom von der nicht ausreichenden Hand als fehlende Mittel und בְּטָהֳרָתוֹ im Kontext der rituellen Reinigung. Die notwendige, im Hebräischen nicht ausdrücklich ausgeführte finanzielle Implikation wird angemessen wiedergegeben.'
