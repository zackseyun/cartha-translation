id: LEV.14.32
reference: Leviticus 14:32
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: זֹ֣את תּוֹרַ֔ת אֲשֶׁר בּ֖/וֹ נֶ֣גַע צָרָ֑עַת אֲשֶׁ֛ר לֹֽא תַשִּׂ֥יג יָד֖/וֹ בְּ/טָהֳרָתֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/032.yaml
  text: This is the law for him in whom there is an infection of skin disease[b][a], whose means cannot afford what is required for his cleansing.
translation:
  language: de
  text: Dies ist die Weisung für jemanden, der von einer Hautkrankheit[a] befallen ist und nicht die Mittel für seine Reinigung aufbringen kann.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort צָרָעַת wird traditionell mit „Aussatz“ wiedergegeben. In Levitikus bezeichnet es jedoch eine größere Gruppe auffälliger Krankheitserscheinungen und ist nicht einfach mit dem heutigen Morbus Hansen gleichzusetzen.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „dessen Hand bei seiner Reinigung nicht ausreicht“; gemeint ist, dass die Person die Mittel für das erforderliche Reinigungsopfer nicht aufbringen kann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרַת
  choice: Weisung
  rationale: תּוֹרָה bezeichnet hier die verbindliche priesterliche Vorschrift beziehungsweise Verfahrensordnung. „Weisung“ gibt diesen Sinn wieder, ohne ausschließlich an ein einzelnes Gesetz zu denken.
- source_word: נֶגַע צָרָעַת
  choice: von einer Hautkrankheit befallen
  rationale: Die Verbindung bezeichnet einen krankhaften Befund aus der in Levitikus behandelten Kategorie צָרָעַת. Die Formulierung ist natürliches Deutsch, gibt נֶגַע durch „befallen“ wieder und vermeidet die irreführende Gleichsetzung mit modernem Morbus Hansen.
- source_word: לֹא תַשִּׂיג יָדוֹ
  choice: nicht die Mittel … aufbringen kann
  rationale: Wörtlich erreicht die Hand der Person das Erforderliche nicht. Das hebräische Idiom bezeichnet hier unzureichende finanzielle Mittel; die gewählte Formulierung gibt diesen Sinn verständlich wieder.
- source_word: בְּטָהֳרָתוֹ
  choice: für seine Reinigung
  rationale: Gemeint ist die kultische Reinigung und das dafür erforderliche Opfer. „Reinigung“ bleibt nahe am hebräischen Ausdruck und am Sprachgebrauch des Abschnitts.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die idiomatische Wendung über die nicht ausreichende „Hand“ wird im Haupttext sinngemäß und in der Fußnote wörtlich wiedergegeben; die kultische Bedeutung von „Reinigung“ bleibt erhalten.
