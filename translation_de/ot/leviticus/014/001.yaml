base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: de
  text: 'Und Jahwe redete zu Mose[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: redete
  rationale: Das Wayyiqtol von דבר eröffnet einen neuen göttlichen Redeabschnitt. „redete“ entspricht der wiederkehrenden feierlichen Redeformel und klingt im heutigen Deutsch natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben; so bleibt der im Hebräischen verwendete Eigenname erkennbar, statt durch einen Titel ersetzt zu werden.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition bezeichnet hier den Adressaten der Rede; in der deutschen Verbindung „zu jemandem reden“ ist „zu“ idiomatisch.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: „Mose“ ist die etablierte deutsche Form des hebräischen Personennamens.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv לֵאמֹר leitet formelhaft den Inhalt der folgenden Rede ein. Im natürlichen modernen Deutsch übernimmt der Doppelpunkt diese Funktion präzise, ohne das schwerfällige „und sprach“ zu verdoppeln.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als Eigennamen; die traditionelle Titelwiedergabe wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feste hebräische Redeeinleitung wird natürlich mit „redete zu …:“ wiedergegeben; der Doppelpunkt leitet den in Vers 2 folgenden Redeinhalt ein.
