  text: וְ/רָאָ֣ה אֶת הַ/נֶּ֗גַע וְ/הִנֵּ֤ה הַ/נֶּ֨גַע֙ בְּ/קִירֹ֣ת הַ/בַּ֔יִת שְׁקַֽעֲרוּרֹת֙ יְרַקְרַקֹּ֔ת א֖וֹ אֲדַמְדַּמֹּ֑ת וּ/מַרְאֵי/הֶ֥ן שָׁפָ֖ל מִן הַ/קִּֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/037.yaml
  text: He shall examine the infection, and if the infection is in the walls of the house as sunken areas, greenish or reddish, and their appearance is deeper than the wall,
translation:
  language: de
  text: Er soll den Befall[a] untersuchen. Zeigt sich dieser an den Wänden des Hauses als grünliche oder rötliche Vertiefungen[b], und erscheinen diese tiefer als die Wandoberfläche[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Schadstelle“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „eingesunkenen Stellen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „und ihr Aussehen ist niedriger als die Wand“; gemeint ist offenbar, dass sie gegenüber der Wandoberfläche vertieft erscheinen.'
    reason: literal_rendering
lexical_decisions:
- source_word: וְרָאָה
  choice: Er soll … untersuchen
  rationale: Im priesterlichen Prüfverfahren bezeichnet ראה nicht nur das Sehen, sondern das gezielte Untersuchen eines Befunds.
- source_word: הַנֶּגַע
  choice: der Befall
  rationale: נגע bezeichnet hier eine auffällige Schadstelle beziehungsweise einen Befall am Haus. „Befall“ ist im Deutschen für Gebäude verständlich und vermeidet die medizinische Engführung von „Infektion“ sowie die irreführende Wiedergabe „Plage“.
- source_word: וְהִנֵּה
  choice: Zeigt sich
  rationale: Die Wendung führt in diesem Rechtstext das bei der Untersuchung festgestellte Merkmal ein. „Zeigt sich“ gibt diese bedingte Feststellung natürlicher wieder als das wörtliche „siehe“.
- source_word: בְּקִירֹת הַבַּיִת
  choice: an den Wänden des Hauses
  rationale: Die Präposition bezeichnet hier die Stelle, an beziehungsweise in deren Oberfläche der Befund sichtbar ist. „An den Wänden“ ist im Deutschen idiomatisch, während die Vertiefungen den Bezug zur Wandoberfläche verdeutlichen.
- source_word: שְׁקַעֲרוּרֹת
  choice: Vertiefungen
  rationale: Das seltene Wort bezeichnet eingesunkene, hohle oder vertiefte Stellen. „Vertiefungen“ ist präzise und allgemein verständlich.
- source_word: יְרַקְרַקֹּת
  choice: grünlich
  rationale: Die reduplizierte Form bezeichnet wahrscheinlich einen grünlichen Farbton und nicht zwingend ein kräftiges Grün.
- source_word: אֲדַמְדַּמֹּת
  choice: rötlich
  rationale: Die reduplizierte Form bezeichnet einen rötlichen Farbton und bewahrt die im Hebräischen ausgedrückte Abstufung.
- source_word: וּמַרְאֵיהֶן שָׁפָל מִן־הַקִּיר
  choice: und sieht es so aus, als lägen sie tiefer als die Wandoberfläche
  rationale: Wörtlich ist ihr Erscheinungsbild „niedriger als die Wand“. Die Formulierung macht deutlich, dass es um den visuellen Eindruck eingesunkener Stellen gegenüber der Oberfläche geht, ohne eine tatsächlich gemessene Tiefe zu behaupten.
