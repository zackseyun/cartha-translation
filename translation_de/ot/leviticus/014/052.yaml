base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/052.yaml
  text: Thus he shall cleanse the house with the blood of the bird[a], with the living water, with the live bird, with cedar wood, with hyssop[b], and with scarlet yarn.
translation:
  language: de
  text: So soll er das Haus mit dem Blut des Vogels, mit dem lebendigen Wasser[a], mit dem lebenden Vogel, mit Zedernholz, mit Ysop und mit scharlachrotem Garn[b] reinigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „frisches Wasser“ oder „fließendes Wasser“. Wörtlich steht im Hebräischen „lebendiges Wasser“, eine feste Bezeichnung für Wasser aus einer frischen, fließenden Quelle.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „scharlachroter Faden“. Der hebräische Ausdruck bezeichnet scharlachrot gefärbtes Material, das bei der Reinigung verwendet wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחִטֵּא
  choice: So soll er … reinigen
  rationale: Das Piel von חטא bezeichnet hier die rituelle Reinigung beziehungsweise Entsühnung des Hauses. „Reinigen“ ist im Deutschen verständlich und bewahrt den kultischen Sinn im Zusammenhang; „so“ verbindet den abschließenden Vollzug mit dem zuvor beschriebenen Verfahren.
- source_word: הַבַּיִת
  choice: das Haus
  rationale: Gemeint ist das konkrete Gebäude, das von dem zuvor beschriebenen Befall gereinigt wird.
- source_word: בְּדַם הַצִּפּוֹר
  choice: mit dem Blut des Vogels
  rationale: Die Präposition ב bezeichnet hier das Mittel der rituellen Reinigung; „mit“ gibt dies natürlich wieder.
- source_word: וּבַמַּיִם הַחַיִּים
  choice: mit dem lebendigen Wasser
  rationale: Die wörtliche Wiedergabe bewahrt die feste hebräische Wendung und ihre biblischen Bezüge. Gemeint ist frisches Wasser aus einer fließenden beziehungsweise natürlichen Quelle; dies wird in einer Fußnote erläutert.
- source_word: וּבַצִּפֹּר הַחַיָּה
  choice: mit dem lebenden Vogel
  rationale: Die Formulierung unterscheidet diesen Vogel ausdrücklich von dem getöteten Vogel, dessen Blut verwendet wird.
- source_word: וּבְעֵץ הָאֶרֶז
  choice: mit Zedernholz
  rationale: עֵץ bezeichnet zusammen mit der Baumart hier das im Ritus verwendete Holz.
- source_word: וּבָאֵזֹב
  choice: mit Ysop
  rationale: „Ysop“ ist die herkömmliche Bezeichnung in biblischen Ritualtexten; die genaue botanische Bestimmung ist unsicher.
- source_word: וּבִשְׁנִי הַתּוֹלָעַת
  choice: mit scharlachrotem Garn
  rationale: Die Wendung bezeichnet scharlachrot gefärbtes Material, wahrscheinlich Garn oder einen Faden, das bei der Reinigung verwendet wird.
theological_decisions:
- issue: Kultische Bedeutung von וְחִטֵּא
  choice: reinigen
  alternative: entsühnen / von Sünde reinigen
  rationale: Der unmittelbare Zusammenhang betrifft rituelle Verunreinigung durch einen Befall des Hauses, nicht persönliche moralische Schuld. „Reinigen“ vermeidet deshalb eine sachfremde dogmatische Festlegung, ohne den kultischen Charakter aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Präposition „mit“ bildet die instrumentale Reihung des Hebräischen klar ab. Die wörtliche Wendung „lebendiges Wasser“ bleibt im Haupttext erhalten und wird für heutige Leser in der Fußnote erklärt.
