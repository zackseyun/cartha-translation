id: LEV.14.24
reference: Leviticus 14:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/לָקַ֧ח הַ/כֹּהֵ֛ן אֶת כֶּ֥בֶשׂ הָ/אָשָׁ֖ם וְ/אֶת לֹ֣ג הַ/שָּׁ֑מֶן וְ/הֵנִ֨יף אֹתָ֧/ם הַ/כֹּהֵ֛ן תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/024.yaml
  text: Then the priest shall take the guilt-offering lamb and the log of oil[b][a], and the priest shall wave them as a wave offering before Yahweh.
translation:
  language: de
  text: Dann soll der Priester das Lamm für das Schuldopfer[a] und das Log Öl[b] nehmen; der Priester soll beides als Schwingopfer vor Jahwe schwingen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »das Lamm des Schuldopfers«.'
    reason: lexical_alternative
  - marker: b
    text: Ein Log war ein kleines israelitisches Flüssigkeitsmaß.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַח
  choice: Dann soll … nehmen
  rationale: Das mit Waw angeschlossene Verb führt die Abfolge des Rituals weiter; „Dann“ gibt diesen Verfahrensfortschritt in natürlichem Deutsch wieder.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Die übliche Wiedergabe von כֹּהֵן im kultischen Zusammenhang; die Wiederholung des Subjekts im zweiten Satzteil folgt dem Hebräischen.
- source_word: כֶּבֶשׂ הָאָשָׁם
  choice: das Lamm für das Schuldopfer
  rationale: Die Formulierung bewahrt die kultische Opferkategorie אָשָׁם und drückt die Zuordnung des Lammes in verständlichem Deutsch aus.
- source_word: לֹג הַשָּׁמֶן
  choice: das Log Öl
  rationale: לֹג bezeichnet ein bestimmtes kleines Flüssigkeitsmaß. Die Transliteration erhält den technischen Ausdruck; eine Fußnote erläutert ihn.
- source_word: וְהֵנִיף
  choice: soll … schwingen
  rationale: Der Hifil von נוּף bezeichnet hier die rituelle Schwing- beziehungsweise Darbringungshandlung.
- source_word: אֹתָם
  choice: beides
  rationale: Das pluralische Objekt bezieht sich gemeinsam auf das Lamm und das Log Öl; „beides“ ist im Deutschen präzise und natürlich.
- source_word: תְּנוּפָה
  choice: als Schwingopfer
  rationale: Das mit נוּף verwandte Substantiv bezeichnet die kultische Darbringungsform; „Schwingopfer“ erhält den Fachbegriff.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: Die Wendung bezeichnet die Darbringung in der Gegenwart Jahwes; der Gottesname wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt ihn im modernen deutschen Bibelregister direkt wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von אָשָׁם im Opfergesetz
  choice: Schuldopfer
  alternative: Sühneopfer; Vergehenopfer
  rationale: „Schuldopfer“ ist der klare und etablierte deutsche Ausdruck für diese besondere Opferkategorie und lässt deren kultische Eigenständigkeit erkennen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit erhaltener kultischer Fachsprache. Der Satz bleibt verfahrensorientiert; die Wiederholung von „der Priester“ und die Verbindung von Verb und verwandtem Substantiv („als Schwingopfer … schwingen“) spiegeln die hebräische Form.
