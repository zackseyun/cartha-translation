base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/045.yaml
  text: Then he shall tear down the house—its stones[a], its timbers, and all the plaster of the house—and carry them out to an unclean place outside the city.
translation:
  language: de
  text: Dann soll er das Haus niederreißen – seine Steine, sein Holz und den ganzen Staub des Hauses[a] – und dies alles außerhalb der Stadt an einen unreinen Ort bringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „den ganzen Staub des Hauses“. Im Bauzusammenhang kann damit auch Mörtel, Putz oder loser Wandabrieb gemeint sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַץ
  choice: Dann soll er … niederreißen
  rationale: נתץ bezeichnet hier den vollständigen Abbruch des befallenen Hauses. „Niederreißen“ gibt die starke, konkrete Handlung natürlich wieder; „Dann“ nimmt die Abfolge im Kontext auf.
- source_word: הַבַּיִת
  choice: das Haus
  rationale: בית bezeichnet hier das untersuchte Gebäude als bauliche Struktur.
- source_word: אֲבָנָיו
  choice: seine Steine
  rationale: Die konkrete Pluralform wird beibehalten und bezeichnet die Steine des Mauerwerks.
- source_word: עֵצָיו
  choice: sein Holz
  rationale: Der Ausdruck bezeichnet die hölzernen Bestandteile des Hauses. „Sein Holz“ bleibt näher am Hebräischen und legt sich nicht ausschließlich auf Balken oder Gebälk fest.
- source_word: כָּל עֲפַר הַבָּיִת
  choice: den gesamten Lehmverputz des Hauses
  rationale: עפר bedeutet wörtlich „Staub“ oder „Erde“. Im Zusammenhang mit dem zuvor angeordneten Abkratzen der Wände ist damit wahrscheinlich erdhaltiger Putz beziehungsweise loses Wandmaterial gemeint. „Lehmverputz“ ist im Deutschen konkret und dem antiken Baukontext angemessen; die wörtliche und weitere mögliche Deutung wird in einer Fußnote bewahrt.
- source_word: וְהוֹצִיא
  choice: und alles … hinaus … bringen
  rationale: Das Hifil von יצא bedeutet „hinausbringen“. „Alles“ nimmt die zuvor genannten Abbruchmaterialien gesammelt auf, ohne eine im Hebräischen nicht ausdrücklich genannte Transportweise festzulegen.
- source_word: אֶל מִחוּץ לָעִיר
  choice: vor die Stadt hinaus
  rationale: Die Formulierung bringt sowohl die Richtung als auch das Ziel außerhalb des Stadtgebiets idiomatisch zum Ausdruck.
- source_word: אֶל מָקוֹם טָמֵא
  choice: an einen unreinen Ort
  rationale: „Unrein“ bewahrt die kultisch-rechtliche Bedeutung von טמא im Kontext des Levitikus.
theological_decisions:
- issue: Wiedergabe der kultischen Reinheitssprache
  choice: unrein
  alternative: 'unrein beziehungsweise kultisch unrein; als rein lexikalische Alternative: „nicht rein“'
  rationale: טמא gehört zum zentralen Reinheitsvokabular des Levitikus. „Unrein“ wahrt den kultischen und rechtlichen Sinn, ohne bloße Verschmutzung oder eine spätere dogmatische Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich gliedert die Aufzählung der abzubrechenden Bestandteile. Das maskuline Singularsubjekt „er“ folgt der hebräischen Verbform und lässt die im Zusammenhang bestehende Frage nach dem konkret Ausführenden offen.
