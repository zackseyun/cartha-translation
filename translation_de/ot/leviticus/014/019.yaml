  register: Moderne, würdevolle Standardsprache mit geläufiger kultischer Terminologie. Die Satzfolge ist zur besseren deutschen Lesbarkeit in zwei Sätze gegliedert; Ablauf und Aussage des Hebräischen bleiben erhalten.
