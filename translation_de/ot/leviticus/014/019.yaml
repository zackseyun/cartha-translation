source:
  edition: WLC
  text: וְ/עָשָׂ֤ה הַ/כֹּהֵן֙ אֶת הַ֣/חַטָּ֔את וְ/כִפֶּ֕ר עַל הַ/מִּטַּהֵ֖ר מִ/טֻּמְאָת֑/וֹ וְ/אַחַ֖ר יִשְׁחַ֥ט אֶת הָ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/019.yaml
  text: Then the priest shall offer the sin offering and make atonement for the one being cleansed from his uncleanness[a]; and afterward he shall slaughter the burnt offering.
translation:
  language: de
  text: Dann soll der Priester das Sündopfer[a] darbringen und für den, der von seiner Unreinheit gereinigt wird, Sühne erwirken. Danach soll er das Brandopfer schlachten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Reinigungsopfer“. Der hebräische Ausdruck חַטָּאת kann in den Reinheitsvorschriften des 3. Mosebuches das zur Reinigung dienende Opfer bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: soll … darbringen
  rationale: Das Verb עשה bedeutet grundsätzlich „tun/machen“, bezeichnet im Opferkontext jedoch die Ausführung beziehungsweise Darbringung eines Opfers. „Darbringen“ gibt diesen kultischen Sinn natürlich und präzise wieder.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Die übliche und kontextgerechte Wiedergabe des bestimmten Substantivs.
- source_word: הַחַטָּאת
  choice: das Sündopfer
  rationale: Als direktes Objekt einer Opferhandlung bezeichnet חַטָּאת hier das Opfer. „Sündopfer“ ist der geläufige deutsche Fachbegriff; die im Reinheitskontext plausible Wiedergabe „Reinigungsopfer“ wird in der Fußnote bewahrt.
- source_word: וְכִפֶּר עַל
  choice: für … Sühne erwirken
  rationale: כפר mit על bezeichnet hier die priesterliche Sühnehandlung zugunsten einer Person. „Sühne erwirken“ bewahrt die kultisch-theologische Aussage, ohne eine bestimmte Sühnetheorie festzulegen.
- source_word: הַמִּטַּהֵר
  choice: der … gereinigt wird
  rationale: Das Hitpael-Partizip bezeichnet in diesem Zusammenhang die Person, die sich dem rituellen Reinigungsverfahren unterzieht. Die passive Formulierung ist im Deutschen natürlich und wahrt den prozesshaften Sinn.
- source_word: מִטֻּמְאָתוֹ
  choice: von seiner Unreinheit
  rationale: טֻמְאָה bezeichnet im Levitikus kultische beziehungsweise rituelle Unreinheit. Das maskuline Singularsuffix wird mit „seiner“ wiedergegeben.
- source_word: וְאַחַר
  choice: Danach
  rationale: Kennzeichnet klar die zeitliche Abfolge der vorgeschriebenen Handlungen.
- source_word: יִשְׁחַט
  choice: soll … schlachten
  rationale: שחט ist der übliche Ausdruck für das Schlachten eines Opfertieres; „schlachten“ bewahrt den konkreten kultischen Vorgang.
- source_word: הָעֹלָה
  choice: das Brandopfer
  rationale: „Brandopfer“ ist die etablierte deutsche Wiedergabe des technischen Opferbegriffs עֹלָה.
theological_decisions:
- issue: Wiedergabe von חַטָּאת im levitischen Opfer- und Reinheitskontext
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: חַטָּאת ist ein technischer Opferbegriff, der besonders in Reinheitsvorschriften eine reinigende Funktion haben kann. „Sündopfer“ wahrt die herkömmliche terminologische Zuordnung; die sachlich plausible Alternative „Reinigungsopfer“ bleibt durch eine Fußnote sichtbar.
- issue: Bedeutung von כפר
  choice: Sühne erwirken
  alternative: entsühnen / Reinigung bewirken
  rationale: Die gewählte Formulierung bewahrt die ritualtheologische Kraft des Verbs, ohne den Vorgang ausschließlich als moralische Vergebung oder ausschließlich als kultische Reinigung zu deuten.
- issue: Maskulines Singularsuffix in מִטֻּמְאָתוֹ
  choice: seiner Unreinheit
  alternative: der eigenen Unreinheit
  rationale: Die Übersetzung bildet den maskulinen Singular des hebräischen Textes ausdrücklich ab.
