id: LEV.14.21
reference: Leviticus 14:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אִם דַּ֣ל ה֗וּא וְ/אֵ֣ין יָד/וֹ֮ מַשֶּׂגֶת֒ וְ֠/לָקַח כֶּ֣בֶשׂ אֶחָ֥ד אָשָׁ֛ם לִ/תְנוּפָ֖ה לְ/כַפֵּ֣ר עָלָ֑י/ו וְ/עִשָּׂר֨וֹן סֹ֜לֶת אֶחָ֨ד בָּל֥וּל בַּ/שֶּׁ֛מֶן לְ/מִנְחָ֖ה וְ/לֹ֥ג שָֽׁמֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/021.yaml
  text: But if he is poor and his means are insufficient[a], then he shall take one male lamb for a guilt offering to be waved, to make atonement for him, and one-tenth of an ephah of fine flour mixed with oil for a grain offering[b], and one log of oil.
translation:
  language: de
  text: Wenn er aber arm ist und seine Mittel nicht ausreichen[a], soll er ein männliches Lamm als Schuldopfer für das Schwingritual nehmen, um für ihn Sühne zu erwirken, dazu ein Zehntel Efa feines Mehl, mit Öl vermengt, als Speiseopfer und ein Log Öl[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „seine Hand reicht nicht hin“; gemeint ist, dass er nicht über ausreichende Mittel verfügt.'
    reason: lexical_alternative
  - marker: b
    text: Ein Log war ein kleines Flüssigkeitsmaß im israelitischen Opferrecht.
    reason: cultural_note
lexical_decisions:
- source_word: דַּל
  choice: arm
  rationale: Bezeichnet hier einen Menschen mit geringen wirtschaftlichen Mitteln; „arm“ ist im gesetzlichen Zusammenhang direkt und natürlich.
- source_word: וְאֵין יָדוֹ מַשֶּׂגֶת
  choice: seine Mittel nicht ausreichen
  rationale: Gibt den wirtschaftlichen Sinn der hebräischen Wendung verständlich wieder, ohne sie unnötig stark zu paraphrasieren.
- source_word: כֶּבֶשׂ אֶחָד
  choice: ein einziges männliches Lamm
  rationale: כֶּבֶשׂ bezeichnet ein männliches Lamm; „ein einziges“ hebt die gegenüber dem regulären Opfer verringerte Zahl hervor.
- source_word: אָשָׁם
  choice: Schuldopfer
  rationale: Der etablierte deutsche Fachausdruck bewahrt die Eigenart dieser Opferkategorie.
- source_word: לִתְנוּפָה
  choice: das als Schwingopfer dargebracht wird
  rationale: Die Formulierung bezieht die rituelle Schwingdarbringung auf das Schuldopfer und vermeidet den Eindruck eines zusätzlichen, getrennten Opfers.
- source_word: לְכַפֵּר עָלָיו
  choice: um Sühne für ihn zu erwirken
  rationale: Bewahrt den priesterlich-rituellen Gehalt von כפר, ohne eine bestimmte Sühnetheorie festzulegen.
- source_word: וְעִשָּׂרוֹן סֹלֶת אֶחָד
  choice: ein Zehntel Efa Feinmehl
  rationale: עִשָּׂרוֹן ist in diesem Opferkontext ein Zehntel Efa; die Maßeinheit bleibt transparent erhalten.
- source_word: בָּלוּל בַּשֶּׁמֶן
  choice: mit Öl vermengt
  rationale: Eine natürliche, würdige Wiedergabe des mit Öl vermischten Mehls.
- source_word: לְמִנְחָה
  choice: als Speiseopfer
  rationale: „Speiseopfer“ ist ein geläufiger deutscher Fachbegriff für מִנְחָה im levitischen Opferrecht.
- source_word: לֹג שָׁמֶן
  choice: ein Log Öl
  rationale: Die technische antike Flüssigkeitsmaßeinheit wird beibehalten und in einer Fußnote erläutert.
theological_decisions:
- issue: Wiedergabe der priesterlichen Opferterminologie
  choice: Die etablierten Fachbegriffe „Schuldopfer“, „Schwingopfer“, „Sühne“ und „Speiseopfer“ werden beibehalten.
  alternative: Umschreibungen wie „Wiedergutmachungsopfer“, „rituelle Schwingdarbringung“ oder „Reinigung bewirken“.
  rationale: Die Fachbegriffe bilden die unterschiedlichen hebräischen Kategorien präzise ab und bewahren ihre theologischen Spannungen, ohne sie konfessionell auszudeuten.
- issue: Verhältnis von Schuldopfer und Schwingritus
  choice: Das männliche Lamm ist das Schuldopfer, das im Schwingritus dargebracht wird.
  alternative: „als Schuldopfer und als Schwingopfer“, was zwei Opferkategorien nahelegen könnte.
  rationale: Die hebräische Konstruktion beschreibt die Schwingdarbringung als rituelle Behandlung des einen Schuldopfers, nicht als ein zusätzliches Opfer.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit präziser kultischer Fachsprache. Die Satzstruktur folgt dem rechtlichen Charakter des hebräischen Textes, bleibt aber für heutige Leser verständlich.
