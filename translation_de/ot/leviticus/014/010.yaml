  source_fidelity: 'Die wesentlichen Vorgaben des Hebräischen sind zutreffend wiedergegeben: der achte Tag, zwei männliche und ein weibliches Lamm, die Fehlerlosigkeit, das Alter des weiblichen Lammes, die drei Zehntel Efa Feinmehl, die Vermengung mit Öl und ein Log Öl. Die Stellung von „dazu“ ist jedoch gegenüber dem einfachen additiven וְ weniger eng am Ausgangstext; außerdem ist „drei Zehntel eines Efa“ im heutigen Deutsch als Mengenangabe klarer.'
  naturalness: Der Entwurf ist überwiegend idiomatisches modernes Standarddeutsch. Die Revision glättet die Aufzählung, vermeidet die leicht interpretierende Ergänzung „dazu“ und macht den Bezug von „mit Öl vermengt“ auf das Feinmehl/Getreideopfer eindeutiger.
  terminology: „fehlerlos“, „Getreideopfer“, „Feinmehl“, „Efa“ und „Log“ sind im kultisch-rechtlichen Register angemessen. Die Fußnote erklärt das nicht geläufige Flüssigkeitsmaß knapp und sachlich; ihr Anker steht korrekt bei „Log“.
