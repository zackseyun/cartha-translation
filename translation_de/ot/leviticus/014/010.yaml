  to: Und am achten Tag soll er zwei fehlerlose männliche Lämmer nehmen und ein einjähriges fehlerloses weibliches Lamm, drei Zehntel eines Efa Feinmehl als mit Öl vermengtes Getreideopfer sowie ein Log[a] Öl.
  rationale: Die Übersetzung wird nur stilistisch und syntaktisch nachgeschärft. Die additive Reihung des Hebräischen bleibt erhalten, die Mengenangabe wird deutlicher formuliert, und die Ölvermengung wird eindeutig dem Feinmehl/Getreideopfer zugeordnet. Bedeutung, historische Maßeinheiten und kultische Terminologie bleiben unverändert.
