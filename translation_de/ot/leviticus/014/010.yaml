    rationale: Sie ist verständlich, doch „drei Zehntel eines Efa“ markiert im modernen Deutsch die zugrunde liegende Teilmenge klarer.
  - severity: low
    issue: Bezug von „mit Öl vermengt“
    rationale: Die Kommasetzung im Entwurf erlaubt formal einen etwas lockeren Bezug. Eine Umstellung macht deutlich, dass das Feinmehl als Getreideopfer mit Öl vermengt ist.
