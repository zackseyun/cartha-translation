source:
  edition: WLC
  text: וּ/בַ/יּ֣וֹם הַ/שְּׁמִינִ֗י יִקַּ֤ח שְׁנֵֽי כְבָשִׂים֙ תְּמִימִ֔ים וְ/כַבְשָׂ֥ה אַחַ֛ת בַּת שְׁנָתָ֖/הּ תְּמִימָ֑ה וּ/שְׁלֹשָׁ֣ה עֶשְׂרֹנִ֗ים סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַ/שֶּׁ֔מֶן וְ/לֹ֥ג אֶחָ֖ד שָֽׁמֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/010.yaml
  text: And on the eighth day he shall take two male lambs without blemish[a], and one ewe lamb a year old without blemish, and three-tenths of an ephah of fine flour as a grain offering mixed with oil, and one log of oil.
translation:
  language: de
  text: Und am achten Tag soll er zwei fehlerlose männliche Lämmer nehmen und ein einjähriges fehlerloses weibliches Lamm, drei Zehntel eines Efa Feinmehl als mit Öl vermengtes Getreideopfer sowie ein Log[a] Öl.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Log ist ein kleines Flüssigkeitsmaß, das im Opferdienst Israels verwendet wurde.
    reason: cultural_note
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁמִינִי
  choice: Und am achten Tag
  rationale: Bewahrt die Fortsetzung der rituellen Anweisungsfolge und klingt im modernen Deutschen natürlich.
- source_word: יִקַּח
  choice: soll er … nehmen
  rationale: Der Imperfekt hat hier in einem Rechtstext vorschreibende Funktion; „soll“ gibt diese verbindliche Anweisung angemessen wieder.
- source_word: שְׁנֵי כְבָשִׂים
  choice: zwei … männliche Lämmer
  rationale: Die maskuline Form wird ausdrücklich wiedergegeben, da sie im Kontrast zum folgenden weiblichen Lamm steht.
- source_word: תְּמִימִים / תְּמִימָה
  choice: fehlerlos
  rationale: Im Opferkontext bezeichnet תמים Tiere ohne körperlichen Makel oder Defekt; „fehlerlos“ ist klar und sachgerecht.
- source_word: וְכַבְשָׂה אַחַת בַּת שְׁנָתָהּ
  choice: dazu ein einjähriges … weibliches Lamm
  rationale: Die feminine Tierbezeichnung und die Altersangabe werden ausdrücklich bewahrt; „dazu“ verbindet die weitere Anforderung idiomatisch mit den beiden männlichen Lämmern.
- source_word: וּשְׁלֹשָׁה עֶשְׂרֹנִים
  choice: drei Zehntel Efa
  rationale: עשרון bezeichnet ein Zehntel des hier vorausgesetzten Efa; die historische Maßeinheit bleibt erhalten.
- source_word: סֹלֶת מִנְחָה
  choice: Feinmehl als Getreideopfer
  rationale: סלת ist fein gemahlenes Mehl; מנחה bezeichnet in diesem kultischen Zusammenhang das Getreideopfer.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: mit Öl vermengt
  rationale: Gibt die Zubereitung des Feinmehls genau und in einem würdigen, verständlichen Register wieder.
- source_word: וְלֹג אֶחָד שָׁמֶן
  choice: sowie ein Log Öl
  rationale: Log ist eine bestimmte altisraelitische Flüssigkeitsmaßeinheit ohne genaues geläufiges deutsches Gegenstück; daher wird sie transliteriert und in einer Fußnote erklärt.
