source:
  edition: WLC
  text: וְ/יָצָא֙ הַ/כֹּהֵ֔ן אֶל מִ/ח֖וּץ לַֽ/מַּחֲנֶ֑ה וְ/רָאָה֙ הַ/כֹּהֵ֔ן וְ/הִנֵּ֛ה נִרְפָּ֥א נֶֽגַע הַ/צָּרַ֖עַת מִן הַ/צָּרֽוּעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/003.yaml
  text: The priest shall go out to a place outside the camp[a], and the priest shall examine him; and behold, the disease of leprosy has been healed in the one with the skin disease,
translation:
  language: de
  text: Der Priester soll vor das Lager hinausgehen, und der Priester soll ihn untersuchen. Stellt er dabei fest, dass das Aussatzleiden[a] bei dem vom Aussatzleiden Betroffenen abgeheilt ist,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionell wird das hebräische Wort mit „Aussatz“ wiedergegeben. Es bezeichnet jedoch verschiedene auffällige Hautaffektionen und nicht speziell die heute als Lepra oder Hansen-Krankheit bezeichnete Erkrankung.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָצָא
  choice: soll … hinausgehen
  rationale: Das Qal-Perfekt mit וְ hat in diesem gesetzlichen Verfahrenszusammenhang vorschreibende Bedeutung; „soll“ gibt diese Funktion im Deutschen natürlich wieder.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Die übliche und sachlich genaue Wiedergabe; die Wiederholung des Hebräischen bleibt erhalten.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: vor das Lager hinaus
  rationale: Gibt sowohl die durch אֶל bezeichnete Bewegung als auch die Lage außerhalb des Lagers in idiomatischem Deutsch wieder.
- source_word: וְרָאָה
  choice: soll … ihn untersuchen
  rationale: ראה bedeutet grundsätzlich „sehen“, bezeichnet hier im Kontext priesterlicher Begutachtung jedoch eine Untersuchung. Das Objekt „ihn“ ergibt sich aus dem Zusammenhang und wird im Deutschen ergänzt.
- source_word: וְהִנֵּה
  choice: 'Wenn sich zeigt:'
  rationale: Bewahrt die Funktion des hebräischen Aufmerksamkeitssignals als Einführung des festgestellten Befunds, ohne das heute markiert wirkende „siehe“ zu erzwingen.
- source_word: נִרְפָּא
  choice: ist … abgeheilt
  rationale: Das Nifal bezeichnet einen passiven beziehungsweise resultativen Zustand. Bei einem Leiden ist „abgeheilt“ im Deutschen präzise und natürlich.
- source_word: נֶגַע הַצָּרַעַת
  choice: das Aussatzleiden
  rationale: נֶגַע bezeichnet hier den krankhaften Befund beziehungsweise das Leiden, צָרַעַת die kultisch relevante Erkrankung. „Aussatz“ wahrt die traditionelle biblische Bezeichnung, ohne sie mit moderner Lepra gleichzusetzen; die Fußnote klärt den Bedeutungsumfang.
- source_word: מִן הַצָּרוּעַ
  choice: bei dem Erkrankten
  rationale: מן bezeichnet hier die Trennung des Leidens von der betroffenen Person. „Bei dem Erkrankten … abgeheilt“ gibt das Resultat natürlich wieder, ohne die Person durch eine substantivische Krankheitsbezeichnung festzulegen.
theological_decisions:
- issue: Wiedergabe von צָרַעַת und הַצָּרוּעַ
  choice: Aussatzleiden / der Erkrankte
  alternative: Lepra / der Aussätzige; Hautkrankheit / der Hautkranke
  rationale: Das biblisch-hebräische צָרַעַת umfasst kultisch relevante Erscheinungen und ist nicht deckungsgleich mit der modernen Hansen-Krankheit. „Aussatzleiden“ wahrt den traditionellen biblischen Begriff, während die Fußnote medizinische Fehldeutungen verhindert; „der Erkrankte“ vermeidet eine unnötig stigmatisierende Personenbezeichnung.
- issue: Funktion von וְהִנֵּה
  choice: 'Wenn sich zeigt:'
  alternative: und siehe
  rationale: Die Wendung hebt den bei der Untersuchung festgestellten Sachverhalt hervor. Die gewählte Form bewahrt diese diskursive Funktion in gegenwärtigem gesetzlich-prozeduralem Deutsch, ohne die Bedingung als bloße hypothetische Aussage zu verflachen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Verfahrenssprache. Die kurzen Sätze machen den Ortswechsel und die anschließende Untersuchung verständlich. Der Doppelpunkt nach „Wenn sich zeigt“ bildet die hervorhebende Funktion von וְהִנֵּה ab. Der Vers bleibt als syntaktisch offener Bedingungssatz stehen, da die Anweisung im folgenden Vers fortgeführt wird.
