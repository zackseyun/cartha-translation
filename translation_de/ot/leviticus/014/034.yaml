  text: כִּ֤י תָבֹ֨אוּ֙ אֶל אֶ֣רֶץ כְּנַ֔עַן אֲשֶׁ֥ר אֲנִ֛י נֹתֵ֥ן לָ/כֶ֖ם לַ/אֲחֻזָּ֑ה וְ/נָתַתִּי֙ נֶ֣גַע צָרַ֔עַת בְּ/בֵ֖ית אֶ֥רֶץ אֲחֻזַּתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/034.yaml
  text: When you enter the land of Canaan that I am giving to you as a possession[a], and I put an outbreak of skin disease in a house in the land of your possession,
translation:
  language: de
  text: Wenn ihr in das Land Kanaan kommt, das ich euch zum Besitz gebe, und ich ein Aussatzmal[a] an einem Haus in dem Land entstehen lasse, das ihr besitzt,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Ausdruck bezeichnet verschiedene auffällige, verunreinigende Befunde an Menschen, Kleidungsstücken oder Häusern. Er ist nicht auf die heute als Lepra bezeichnete Krankheit beschränkt.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תָבֹאוּ
  choice: Wenn ihr … kommt
  rationale: כִּי leitet hier den künftig erwarteten Fall ein; zusammen mit בוא ist die natürliche deutsche Wiedergabe „Wenn ihr … kommt“.
- source_word: אֶל אֶרֶץ כְּנַעַן
  choice: in das Land Kanaan
  rationale: Gibt die Zielrichtung von אֶל und die übliche geografische Bezeichnung klar wieder.
- source_word: אֲשֶׁר אֲנִי נֹתֵן לָכֶם
  choice: das ich euch … gebe
  rationale: Das Partizip נֹתֵן bezeichnet Gottes gegenwärtig zugesagte beziehungsweise bevorstehende Gabe; im Deutschen ist das Präsens natürlich.
- source_word: לַאֲחֻזָּה
  choice: zum Besitz
  rationale: אֲחֻזָּה bezeichnet dauerhaften Landbesitz; „zum Besitz“ wahrt den rechtlichen und territorialen Sinn.
- source_word: וְנָתַתִּי
  choice: und ich … entstehen lasse
  rationale: Das hebräische Verb bedeutet wörtlich „ich gebe/setze“. Die gewählte Formulierung erhält Gottes ausdrückliche Verursachung, klingt bei einem Befund an einem Haus jedoch natürlicher als „ich gebe“.
- source_word: נֶגַע צָרַעַת
  choice: ein schädliches Mal
  rationale: Die Wortverbindung bezeichnet einen als ṣāraʿat einzuordnenden Befall beziehungsweise auffälligen Schadensbefund. Da auch Häuser betroffen sein können, wären „Aussatz“ oder „Hautkrankheit“ hier irreführend; „schädliches Mal“ bleibt anschaulich und kategorisch offen.
- source_word: בְּבֵית
  choice: an einem Haus
  rationale: Im Kontext des sichtbaren Hausbefalls ist „an einem Haus“ im Deutschen idiomatischer als „in einem Haus“, ohne festzulegen, ob der Befund innen oder außen liegt.
- source_word: אֶרֶץ אֲחֻזַּתְכֶם
  choice: im Land eures Besitzes
  rationale: Die formnahe Wiedergabe bewahrt die bewusste Wiederaufnahme von אֲחֻזָּה und den Gedanken des zugesprochenen Landbesitzes.
theological_decisions:
- issue: Göttliche Urheberschaft des Hausbefalls
  choice: „und ich … entstehen lasse“ mit Gott als ausdrücklich handelndem Subjekt
  alternative: Eine unpersönliche Formulierung wie „wenn … ein Mal auftritt“
  rationale: וְנָתַתִּי schreibt das Geschehen ausdrücklich Gott zu. Diese theologische Spannung darf nicht durch eine unpersönliche Wiedergabe abgeschwächt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt als Einleitung zum folgenden Gesetz offen. „Schädliches Mal“ vermeidet eine unpassende moderne medizinische Diagnose und ist zugleich für gewöhnliche Leser verständlich.
