source:
  edition: WLC
  text: וְ/שָׁחַ֖ט אֶת הַ/צִּפֹּ֣ר הָ/אֶחָ֑ת אֶל כְּלִי חֶ֖רֶשׂ עַל מַ֥יִם חַיִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/050.yaml
  text: Then he shall slaughter the one bird into an earthenware vessel over living water[a].
translation:
  language: de
  text: Dann soll er den einen Vogel über frischem Wasser[a] in ein Tongefäß schlachten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „lebendigem Wasser“; gemeint ist frisches beziehungsweise fließendes Wasser.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  choice: Dann soll er … schlachten
  rationale: Das Verb führt die rituelle Handlungsfolge fort. „Dann“ gibt die Abfolge wieder, und „soll … schlachten“ entspricht dem anweisenden Charakter des Abschnitts.
- source_word: הַצִּפֹּר הָאֶחָת
  choice: den einen Vogel
  rationale: Die bestimmte Wendung unterscheidet diesen Vogel von dem anderen bereits genannten Vogel, ohne ihn als den „ersten“ zu bezeichnen.
- source_word: אֶל כְּלִי חֶרֶשׂ
  choice: in einem Tongefäß
  rationale: אֶל bezeichnet hier die Ausrichtung der Schlachtung auf das Gefäß, sodass das Blut hineingelangt. Natürliches Deutsch beschreibt den Vollzug als Schlachtung in einem Gefäß; „Tongefäß“ gibt Material und Funktion knapp wieder.
- source_word: עַל מַיִם חַיִּים
  choice: über frischem Wasser
  rationale: Die Wendung bezeichnet im rituellen Zusammenhang frisches, nicht abgestandenes beziehungsweise zufließendes Wasser. „Über“ bewahrt die räumliche Relation des hebräischen עַל; die wörtliche Form wird in der Fußnote festgehalten.
theological_decisions:
- issue: Wiedergabe von מַיִם חַיִּים im Reinheitsritual
  choice: frisches Wasser
  alternative: lebendiges Wasser; fließendes Wasser; Quellwasser
  rationale: Im Kontext ist eine konkrete Beschaffenheit des Wassers gemeint, nicht vorrangig eine Metapher. „Frisches Wasser“ ist verständlich und legt die Herkunft nicht so eng wie „Quellwasser“ fest; die wörtliche und biblisch resonante Form „lebendiges Wasser“ bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hält Gefäß und Wasser eng zusammen und bleibt zugleich gut verständlich; „schlachten“ wahrt den rituellen Charakter der Handlung.
