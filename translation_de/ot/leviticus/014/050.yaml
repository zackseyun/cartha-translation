  verdict: revise
  source_fidelity: 'Die Präposition אֶל bezeichnet die Richtung bzw. das Ziel der Schlachtung: Der Vogel wird so geschlachtet, dass das Blut in das Tongefäß gelangt. „In einem Tongefäß schlachten“ lässt dagegen einen bloßen Handlungsort erkennen und gibt diese Richtung nicht ausreichend wieder. „Über frischem Wasser“ ist als idiomatische Wiedergabe von עַל מַיִם חַיִּים vertretbar; die Fußnote erhält die wörtliche Form.'
  naturalness: Die revidierte Wortstellung ist modernes, verständliches Standarddeutsch und verdeutlicht zugleich die beiden räumlichen Beziehungen des Ritualvorgangs.
  terminology: „Schlachten“, „Tongefäß“, „frisches Wasser“ und „den einen Vogel“ sind treffend. Die Fußnote bewahrt „lebendiges Wasser“ als wörtliche, traditionsgeschichtlich bekannte Form, ohne die konkrete rituelle Bedeutung einzuengen.
