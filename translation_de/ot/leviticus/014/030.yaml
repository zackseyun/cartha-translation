id: LEV.14.30
reference: Leviticus 14:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/עָשָׂ֤ה אֶת הָֽ/אֶחָד֙ מִן הַ/תֹּרִ֔ים א֖וֹ מִן בְּנֵ֣י הַ/יּוֹנָ֑ה מֵ/אֲשֶׁ֥ר תַּשִּׂ֖יג יָדֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/030.yaml
  text: And he shall offer one of the turtledoves or one of the young pigeons[a], according to what his means can afford—
translation:
  language: de
  text: Und er soll eine von den Turteltauben oder eine von den jungen Tauben darbringen, je nachdem, was er sich leisten kann[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »von dem, was seine Hand erreicht«; eine hebräische Wendung für das, was seine Mittel erlauben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: Und er soll … darbringen
  rationale: עָשָׂה bedeutet grundsätzlich »tun/machen«, bezeichnet im Opferkontext jedoch die Ausführung beziehungsweise Darbringung eines Opfers. »Darbringen« gibt diesen kultischen Sinn im Deutschen natürlich wieder.
- source_word: אֶת הָאֶחָד
  choice: eine
  rationale: Das Zahlwort mit Artikel bezeichnet hier ein einzelnes Tier aus den anschließend genannten Vogelarten. Das feminine »eine« richtet sich im Deutschen nach »Taube«.
- source_word: מִן הַתֹּרִים
  choice: von den Turteltauben
  rationale: תֹּרִים bezeichnet in der Opfergesetzgebung spezifisch Turteltauben und nicht Tauben im Allgemeinen.
- source_word: אוֹ מִן בְּנֵי הַיּוֹנָה
  choice: oder eine von den jungen Tauben
  rationale: בְּנֵי הַיּוֹנָה ist die übliche hebräische Bezeichnung für junge Tauben. Die Wiederholung von »eine von« macht im Deutschen deutlich, dass ein einzelner Vogel aus einer der beiden Gruppen gemeint ist.
- source_word: מֵאֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: je nachdem, was er sich leisten kann
  rationale: Wörtlich heißt die Wendung »von dem, was seine Hand erreicht«. Sie bezeichnet die wirtschaftlichen Möglichkeiten einer Person; die gewählte Formulierung gibt diesen idiomatischen Sinn in gegenwärtigem Deutsch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. »Darbringen« bewahrt den kultischen Zusammenhang; der abschließende Gedankenstrich zeigt, dass der Satz im folgenden Vers weitergeführt wird.
