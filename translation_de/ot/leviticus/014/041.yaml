source:
  edition: WLC
  text: וְ/אֶת הַ/בַּ֛יִת יַקְצִ֥עַ מִ/בַּ֖יִת סָבִ֑יב וְ/שָׁפְכ֗וּ אֶת הֶֽ/עָפָר֙ אֲשֶׁ֣ר הִקְצ֔וּ אֶל מִ/ח֣וּץ לָ/עִ֔יר אֶל מָק֖וֹם טָמֵֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/041.yaml
  text: He shall have the inside of the house scraped all around[a], and they shall pour out the dust that they scraped off outside the city into an unclean place.
translation:
  language: de
  text: Er soll das Innere des Hauses ringsum abschaben lassen. Den Staub[a], den sie abgeschabt haben, sollen sie außerhalb der Stadt an einen unreinen Ort schütten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist hier das von den Innenflächen des Hauses abgeschabte Material.
    reason: Erläutert den kontextbezogenen Bezug von עָפָר, ohne den Haupttext über „Staub“ hinaus auf Putz oder eine bestimmte Beschaffenheit des Materials festzulegen.
lexical_decisions:
- source_word: יַקְצִעַ
  choice: soll … abschaben lassen
  rationale: Der Hifil drückt hier aus, dass der Priester das Abschaben veranlasst; die deutsche Konstruktion mit „lassen“ gibt diese kausative Bedeutung natürlich wieder.
- source_word: מִבַּיִת סָבִיב
  choice: das Haus innen ringsum
  rationale: Die Wendung bezeichnet das gesamte Innere beziehungsweise die umlaufenden Innenflächen des Hauses. „innen ringsum“ ist knapp und verständlich.
- source_word: וְשָׁפְכוּ
  choice: sollen sie … schütten
  rationale: שׁפך bedeutet grundsätzlich „ausgießen/ausschütten“. Bei abgeschabtem Staub ist „schütten“ im Deutschen sachgerecht und idiomatisch.
- source_word: הֶעָפָר
  choice: den Staub
  rationale: עָפָר heißt wörtlich „Staub“ beziehungsweise loses Erdmaterial. Die Übersetzung vermeidet die im Hebräischen nicht ausdrücklich enthaltene Präzisierung „Putzstaub“.
- source_word: אֲשֶׁר הִקְצוּ
  choice: den sie abgeschabt haben
  rationale: Die Form bezeichnet das zuvor durch Abschaben entfernte Material und greift den ersten Satz sachlich auf.
- source_word: אֶל מִחוּץ לָעִיר
  choice: vor die Stadt hinaus
  rationale: Die Präpositionsfolge bezeichnet eine Bewegung aus der Stadt heraus an einen Ort außerhalb ihrer Grenzen.
- source_word: אֶל מָקוֹם טָמֵא
  choice: an einen unreinen Ort
  rationale: „Unrein“ bewahrt den kultisch-rituellen Fachbegriff von טָמֵא; „an“ bezeichnet hier idiomatisch den Zielort der Entsorgung.
theological_decisions:
- issue: Wiedergabe von טָמֵא im levitischen Reinheitskontext
  choice: unrein
  alternative: verunreinigt; rituell unrein
  rationale: „Unrein“ wahrt die kultisch-rituelle Kategorie, ohne eine moralische Verfehlung anzudeuten oder durch „rituell“ eine erklärende Ergänzung in den Haupttext einzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kausative Anweisung wird mit „abschaben lassen“ ausgedrückt; der Wechsel vom Singular beim Veranlasser zum Plural bei den Ausführenden bleibt erhalten.
