id: LEV.14.42
reference: Leviticus 14:42
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/לָקְחוּ֙ אֲבָנִ֣ים אֲחֵר֔וֹת וְ/הֵבִ֖יאוּ אֶל תַּ֣חַת הָ/אֲבָנִ֑ים וְ/עָפָ֥ר אַחֵ֛ר יִקַּ֖ח וְ/טָ֥ח אֶת הַ/בָּֽיִת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/042.yaml
  text: Then they shall take other stones and bring them in place of the stones[b][a], and he shall take other mortar and plaster the house.
translation:
  language: de
  text: Dann sollen sie andere Steine nehmen und sie an die Stelle der Steine bringen[a]. Und man soll anderes Erdmaterial nehmen[b] und das Haus neu verputzen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „unter die Steine“; hier ist gemeint: an deren Stelle, als Ersatz für sie.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „anderen Mörtel“; wörtlicher: „andere Erde“ oder „anderen Staub“. Gemeint ist das Material, mit dem das Haus neu verputzt wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: Dann sollen sie nehmen
  rationale: Das mit וְ verbundene Perfekt setzt die Verfahrensanweisung fort; „dann“ gibt die Abfolge natürlich wieder, während „sollen“ den rechtlich-anweisenden Charakter ausdrückt.
- source_word: אֲבָנִים אֲחֵרוֹת
  choice: andere Steine
  rationale: Die direkte Wiedergabe bezeichnet Ersatzsteine, ohne den Text unnötig zu erweitern.
- source_word: וְהֵבִיאוּ אֶל תַּחַת הָאֲבָנִים
  choice: und sie an die Stelle der Steine bringen
  rationale: תַּחַת bezeichnet hier im Zusammenhang mit den zuvor entfernten Steinen Ersatz beziehungsweise Stellvertretung, nicht die räumliche Lage darunter.
- source_word: וְעָפָר אַחֵר
  choice: anderes Erdmaterial
  rationale: עָפָר bedeutet wörtlich Staub oder Erde; hier ist erdiges Material zum erneuten Verputzen gemeint. „Erdmaterial“ bewahrt die lexikalische Bildlichkeit besser als das bereits verarbeitete „Putz“ und ist weniger spezifisch als „Mörtel“.
- source_word: יִקַּח
  choice: man soll nehmen
  rationale: Der hebräische Text wechselt vom Plural zur dritten Person Singular. Das unpersönliche „man“ erhält den Wechsel, ohne ein sachlich unbegründetes männliches Subjekt einzuführen.
- source_word: וְטָח אֶת הַבָּיִת
  choice: und das Haus neu verputzen
  rationale: טוח bezeichnet das Bestreichen beziehungsweise Verputzen. „Neu“ macht im Deutschen knapp deutlich, dass das Haus nach dem Entfernen des alten Putzes wieder verputzt wird.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Verfahrenssprache. Der Numeruswechsel vom pluralischen „sie“ zum singularischen unpersönlichen „man“ bleibt sichtbar. Die Wiederholung von „Steine“ spiegelt den hebräischen Text; „neu verputzen“ ist im Deutschen natürlicher als „das Haus verputzen“ und ergibt sich aus dem unmittelbaren Sanierungszusammenhang.
