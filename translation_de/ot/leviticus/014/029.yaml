source:
  edition: WLC
  text: וְ/הַ/נּוֹתָ֗ר מִן הַ/שֶּׁ֨מֶן֙ אֲשֶׁר֙ עַל כַּ֣ף הַ/כֹּהֵ֔ן יִתֵּ֖ן עַל רֹ֣אשׁ הַ/מִּטַּהֵ֑ר לְ/כַפֵּ֥ר עָלָ֖י/ו לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/029.yaml
  text: And the rest of the oil that is in the priest’s palm he shall put on the head of the one being cleansed[a], to make atonement for him before Yahweh.
translation:
  language: de
  text: Was von dem Öl in der Handfläche des Priesters übrig ist, soll er auf den Kopf dessen geben, der gereinigt wird, um vor Yahweh Sühne für ihn zu erwirken.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַנּוֹתָר מִן הַשֶּׁמֶן
  choice: Was von dem Öl … übrig ist
  rationale: Die substantivierte Niphal-Partizipialform bezeichnet das, was verbleibt. Die partitive Wendung mit מִן wird im Deutschen natürlich mit „von dem Öl“ wiedergegeben.
- source_word: אֲשֶׁר עַל כַּף הַכֹּהֵן
  choice: in der Handfläche des Priesters
  rationale: כַּף bezeichnet die Handfläche beziehungsweise die hohle Hand. Obwohl עַל wörtlich „auf“ bedeutet, ist bei darin gehaltenem Öl „in der Handfläche“ im Deutschen anschaulich und idiomatisch.
- source_word: יִתֵּן עַל רֹאשׁ
  choice: soll er auf den Kopf … geben
  rationale: נתן kann „geben“, „setzen“ oder „legen“ bedeuten. „Auf den Kopf geben“ beschreibt das Auftragen des Öls natürlich, ohne eine bestimmte Auftragungsweise hinzuzufügen.
- source_word: הַמִּטַּהֵר
  choice: dessen, der gereinigt wird
  rationale: Das Hitpael-Partizip bezeichnet hier die Person, die sich im rituellen Reinigungsverfahren befindet. Die Formulierung bewahrt den prozesshaften Sinn.
- source_word: לְכַפֵּר עָלָיו
  choice: um … Sühne für ihn zu erwirken
  rationale: כפר ist ein zentraler kultischer Begriff. „Sühne erwirken“ wahrt sein theologisches Gewicht; עַל bezeichnet hier die Person, zu deren Gunsten die Sühne geschieht.
- source_word: לִפְנֵי יְהוָה
  choice: vor Yahweh
  rationale: לִפְנֵי bezeichnet das Handeln in Gottes Gegenwart; der Gottesname יהוה wird als „Yahweh“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen ausdrücklich. „Yahweh“ gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von כפר im Reinigungsritual
  choice: Sühne für ihn erwirken
  alternative: ihn entsühnen
  rationale: Die gewählte Formulierung lässt den kultisch-theologischen Gehalt des Verbs bestehen und macht zugleich deutlich, dass die Handlung zugunsten der betroffenen Person erfolgt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung folgt dem Ablauf des hebräischen Ritualsatzes, bleibt jedoch natürlich verständlich. „Handfläche“ bewahrt das konkrete Körperbild; „der gereinigt wird“ vermeidet die missverständliche Annahme, die Reinigung sei bereits vollständig abgeschlossen.
