  text: וְ/הָיָה֩ בַ/יּ֨וֹם הַ/שְּׁבִיעִ֜י יְגַלַּ֣ח אֶת כָּל שְׂעָר֗/וֹ אֶת רֹאשׁ֤/וֹ וְ/אֶת זְקָנ/וֹ֙ וְ/אֵת֙ גַּבֹּ֣ת עֵינָ֔י/ו וְ/אֶת כָּל שְׂעָר֖/וֹ יְגַלֵּ֑חַ וְ/כִבֶּ֣ס אֶת בְּגָדָ֗י/ו וְ/רָחַ֧ץ אֶת בְּשָׂר֛/וֹ בַּ/מַּ֖יִם וְ/טָהֵֽר־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/009.yaml
  text: 'And on the seventh day he shall shave off all his hair: his head[a], his beard, and his eyebrows. He shall shave off all his hair, wash his clothes, and bathe his body in water; then he shall be clean.'
translation:
  language: de
  text: 'Am siebten Tag soll er sein ganzes Haar abrasieren: sein Kopfhaar, seinen Bart und seine Augenbrauen; ja, all sein Haar soll er abrasieren. Er soll seine Kleider waschen und seinen Körper im Wasser waschen; dann wird er rein sein.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַשְּׁבִיעִי
  choice: Am siebten Tag
  rationale: Die hebräische Wendung leitet den nächsten zeitlich bestimmten Schritt des Reinigungsverfahrens ein; die natürliche deutsche Zeitangabe bewahrt diese Funktion.
- source_word: יְגַלַּח אֶת כָּל שְׂעָרוֹ
  choice: soll er alle seine Haare abrasieren
  rationale: Das Piel von גלח bezeichnet hier die vollständige Entfernung der Haare. „Abrasieren“ gibt den Vorgang im Deutschen eindeutig wieder.
- source_word: אֶת רֹאשׁוֹ
  choice: die Haare auf seinem Kopf
  rationale: Wörtlich steht „seinen Kopf“ als Bereich des Rasierens. Im Deutschen vermeidet die Explizierung das missverständliche Bild, der Kopf selbst werde rasiert.
- source_word: וְאֶת זְקָנוֹ
  choice: seinen Bart
  rationale: זָקָן bezeichnet hier gewöhnlich den Bart.
- source_word: גַּבֹּת עֵינָיו
  choice: seine Augenbrauen
  rationale: Die hebräische Wendung „Brauen seiner Augen“ entspricht idiomatisch den Augenbrauen.
- source_word: וְאֶת כָּל שְׂעָרוֹ יְגַלֵּחַ
  choice: Ja, alle seine Haare soll er abrasieren
  rationale: Die Wiederholung wird als Hervorhebung der Vollständigkeit beibehalten und nicht mit der vorigen Aussage verschmolzen.
- source_word: וְכִבֶּס אֶת בְּגָדָיו
  choice: Dann soll er seine Kleider waschen
  rationale: כבס bezeichnet typischerweise das Waschen von Textilien; „Kleider waschen“ ist klar und gegenwärtig.
- source_word: וְרָחַץ אֶת בְּשָׂרוֹ בַּמַּיִם
  choice: seinen Körper mit Wasser waschen
  rationale: בשר bedeutet wörtlich „Fleisch“, bezeichnet hier aber idiomatisch den Körper der Person. „Mit Wasser“ gibt das Mittel der Waschung natürlich wieder.
- source_word: וְטָהֵר
  choice: und wird rein sein
  rationale: Die Form bezeichnet den daraus folgenden Zustand ritueller Reinheit, nicht moralische Schuldlosigkeit.
theological_decisions:
- issue: Terminologie ritueller Reinheit
  choice: rein sein
  alternative: für rein erklärt sein; gereinigt sein
  rationale: טהר bezeichnet hier den erreichten kultisch-rituellen Status. „Rein sein“ wahrt die Zustandsaussage und vermeidet sowohl eine gerichtliche Erklärung als auch eine unnötige Verschiebung zum Reinigungsvorgang.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Gesetzesstil. Die auffällige Wiederholung des vollständigen Abrasierens bleibt erhalten; die elliptische Angabe „seinen Kopf“ wird zur Vermeidung eines deutschen Missverständnisses als „die Haare auf seinem Kopf“ ausgedrückt.
