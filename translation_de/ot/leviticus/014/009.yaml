review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Abfolge, die vollständige Haarentfernung einschließlich Kopfhaar, Bart und Augenbrauen, das Waschen der Kleider und des Körpers sowie den resultierenden rituellen Status zutreffend wieder. Die Wiederholung von „all sein Haar“ sollte erhalten bleiben. Für בַּמַּיִם ist „im Wasser“ näher als „mit Wasser“, ohne unnatürlich zu werden.
  naturalness: Die Verbindung „Dann soll er … waschen und wird rein sein“ ist syntaktisch uneinheitlich. Eine klare Trennung der abschließenden Folge („dann wird er rein sein“) entspricht sowohl modernem Standarddeutsch als auch der hebräischen Handlungsfolge.
  terminology: „rein“ ist für טָהֵר im Kontext ritueller Reinheit passend. „Körper“ gibt בְּשָׂרוֹ hier idiomatisch wieder, ohne die wörtliche, im Deutschen missverständliche Wiedergabe „Fleisch“ zu erzwingen. „Kopfhaar“ vermeidet eine unnötig umständliche Umschreibung und bezeichnet den gemeinten Bereich präzise.
  issues:
  - severity: medium
    issue: Syntaktisch nicht parallele Schlussverbindung
    rationale: In „Dann soll er seine Kleider waschen, seinen Körper mit Wasser waschen und wird rein sein“ werden „soll“ und „wird“ innerhalb derselben Koordination vermischt. Der resultative Schlusssatz muss eigenständig formuliert werden.
  - severity: low
    issue: Wiedergabe von בַּמַּיִם
    rationale: „Mit Wasser“ ist möglich, doch „im Wasser“ entspricht der hebräischen Präpositionalphrase unmittelbarer und beschreibt den Waschvollzug genauer.
