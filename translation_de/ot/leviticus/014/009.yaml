revisions:
- from: 'Am siebten Tag soll er alle seine Haare abrasieren: die Haare auf seinem Kopf, seinen Bart und seine Augenbrauen. Ja, alle seine Haare soll er abrasieren. Dann soll er seine Kleider waschen, seinen Körper mit Wasser waschen und wird rein sein.'
  to: 'Am siebten Tag soll er sein ganzes Haar abrasieren: sein Kopfhaar, seinen Bart und seine Augenbrauen; ja, all sein Haar soll er abrasieren. Er soll seine Kleider waschen und seinen Körper im Wasser waschen; dann wird er rein sein.'
  rationale: Die Revision behebt die syntaktische Uneinheitlichkeit am Satzende und gibt die Waschung „im Wasser“ quellenäher wieder. Die im Hebräischen ausdrücklich wiederholte Forderung nach vollständigem Abrasieren bleibt erhalten; „ja“ markiert ihre Bekräftigungsfunktion, ohne einen zusätzlichen Sachinhalt einzutragen.
