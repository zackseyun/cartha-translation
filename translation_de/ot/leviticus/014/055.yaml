  text: and for a skin disease in a garment or in a house,[a]
translation:
  language: de
  text: und für den Befall an einem Kleidungsstück und an einem Haus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort zaraʿat wird traditionell mit „Aussatz“ wiedergegeben. In Levitikus bezeichnet es jedoch ein breiteres Spektrum auffälliger Veränderungen oder Verunreinigungen, darunter auch solche an Kleidungsstücken und Häusern.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְ
  choice: und für
  rationale: Die Verbindung aus Konjunktion und Präposition setzt die Aufzählung dessen fort, worauf sich die vorausgehende Weisung bezieht.
- source_word: צָרַעַת
  choice: Befall
  rationale: Der hebräische Begriff bezeichnet in Levitikus ein Spektrum auffälliger Veränderungen, das Menschen, Textilien und Häuser betreffen kann. „Befall“ ist bei Kleidungsstücken und Häusern natürlich und vermeidet die sachlich irreführende Wiedergabe „Aussatz“.
- source_word: הַבֶּגֶד
  choice: einem Kleidungsstück
  rationale: Obwohl das Hebräische den Artikel hat, verlangt die allgemeine Aufzählung im Deutschen eine generische Form. „Kleidungsstück“ gibt den singularischen Gegenstand präzise wieder.
- source_word: וְלַבָּיִת
  choice: oder an einem Haus
  rationale: Das hebräische „und“ verbindet zwei mögliche Träger desselben Befalls; im Deutschen drückt „oder“ diese Verteilung idiomatisch aus. „An“ bezeichnet den Befall der jeweiligen Sache.
