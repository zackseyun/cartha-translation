id: LEV.14.12
reference: Leviticus 14:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/לָקַ֨ח הַ/כֹּהֵ֜ן אֶת הַ/כֶּ֣בֶשׂ הָ/אֶחָ֗ד וְ/הִקְרִ֥יב אֹת֛/וֹ לְ/אָשָׁ֖ם וְ/אֶת לֹ֣ג הַ/שָּׁ֑מֶן וְ/הֵנִ֥יף אֹתָ֛/ם תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/012.yaml
  text: Then the priest shall take the one male lamb and present it as a guilt offering[a], along with the log of oil[b], and he shall wave them as a wave offering before Yahweh.
translation:
  language: de
  text: Dann soll der Priester das eine männliche Lamm nehmen und es zusammen mit dem Log Öl[a] als Schuldopfer[b] darbringen. Er soll beides als Schwingopfer vor Jahwe schwingen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Log war ein kleines Flüssigkeitsmaß im israelitischen Kult.
    reason: cultural_note
  - marker: b
    text: 'Oder: „Wiedergutmachungsopfer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Dann soll ... nehmen
  rationale: Das Waw mit der Verbform führt die vorgeschriebene Ritualfolge weiter; „Dann“ macht die Abfolge im Deutschen deutlich.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Die übliche und sachlich genaue Wiedergabe von כֹּהֵן im kultischen Zusammenhang.
- source_word: הַכֶּבֶשׂ הָאֶחָד
  choice: das eine männliche Lamm
  rationale: כֶּבֶשׂ bezeichnet hier das männliche Lamm; Artikel und Zahlwort heben dieses eine Tier unter den Tieren des Rituals hervor.
- source_word: וְהִקְרִיב אֹתוֹ
  choice: es ... darbringen
  rationale: הקריב bezeichnet im Opferkontext das Heranbringen beziehungsweise Darbringen; „darbringen“ ist im Deutschen natürlich und kultisch passend.
- source_word: לְאָשָׁם
  choice: als Schuldopfer
  rationale: אָשָׁם ist hier die technische Bezeichnung einer Opferart; „Schuldopfer“ ist die etablierte deutsche Entsprechung, während „Wiedergutmachungsopfer“ einen ebenfalls vorhandenen Bedeutungsaspekt hervorhebt.
- source_word: לֹג הַשָּׁמֶן
  choice: das Log Öl
  rationale: לֹג ist ein bestimmtes altes Flüssigkeitsmaß. Die Beibehaltung als „Log“ wahrt die historische Maßeinheit, die in einer Fußnote erklärt wird.
- source_word: וְהֵנִיף אֹתָם
  choice: Er soll beides ... schwingen
  rationale: Das pluralische Objekt bezieht sich auf Lamm und Öl; idiomatisches deutsches „beides“ macht diesen Bezug klar. הניף bezeichnet die rituelle Schwingbewegung.
- source_word: תְּנוּפָה
  choice: als Schwingopfer
  rationale: תְּנוּפָה ist der Fachausdruck für die rituelle Darbringung durch Schwingen und entspricht dem vorausgehenden Verb.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי bedeutet im Ritualzusammenhang „vor“ beziehungsweise „in der Gegenwart von“; der Gottesname wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich den Eigennamen יהוה. „Jahwe“ gibt den Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von אָשָׁם
  choice: Schuldopfer
  alternative: Wiedergutmachungsopfer
  rationale: „Schuldopfer“ wahrt die geläufige kultische Fachsprache; die Alternative macht den Aspekt der Wiedergutmachung stärker sichtbar und wird deshalb in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit verständlicher Satzführung. Kultische Fachbegriffe werden beibehalten und nötigenfalls knapp erläutert. Die Fußnotenreihenfolge wurde gegenüber der englischen Vorlage sachgerecht den jeweiligen Textstellen zugeordnet.
