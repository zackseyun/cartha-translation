source:
  edition: WLC
  text: וְ/צִוָּה֙ הַ/כֹּהֵ֔ן וְ/לָקַ֧ח לַ/מִּטַּהֵ֛ר שְׁתֵּֽי צִפֳּרִ֥ים חַיּ֖וֹת טְהֹר֑וֹת וְ/עֵ֣ץ אֶ֔רֶז וּ/שְׁנִ֥י תוֹלַ֖עַת וְ/אֵזֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/004.yaml
  text: Then the priest shall command that two live clean birds[a], cedar wood, scarlet yarn[b], and hyssop be taken for the one being cleansed.
translation:
  language: de
  text: Dann soll der Priester anordnen, dass man für den, der gereinigt wird, zwei lebende, reine Vögel nimmt, dazu Zedernholz, Scharlachgarn[a] und Ysop[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Scharlachfaden“. Der hebräische Ausdruck bezeichnet scharlachrot gefärbtes Material; seine genaue Form lässt sich nicht sicher bestimmen.'
    reason: lexical_alternative
  - marker: b
    text: Welche Pflanze mit „Ysop“ genau gemeint ist, ist unsicher; die traditionelle Bezeichnung wurde beibehalten.
    reason: cultural_note
lexical_decisions:
- source_word: וְצִוָּה
  choice: Dann soll der Priester anordnen
  rationale: Das Waw mit der Perfektform führt in dieser Ritualvorschrift den nächsten Handlungsschritt ein. „Dann“ gibt diese Abfolge in natürlichem Deutsch wieder; „soll … anordnen“ bewahrt den Weisungscharakter.
- source_word: וְלָקַח
  choice: dass man … nimmt
  rationale: Die Form ist morphologisch 3. Person Singular, bezeichnet hier nach dem Befehl des Priesters jedoch idiomatisch die Ausführung der Anordnung, ohne den ausführenden Menschen ausdrücklich zu benennen. Das unpersönliche „man“ vermeidet die unbegründete Festlegung, der Priester müsse die Gegenstände selbst nehmen.
- source_word: לַמִּטַּהֵר
  choice: für den, der gereinigt wird
  rationale: Das Hitpael-Partizip bezeichnet den Menschen, der sich im Vorgang der rituellen Reinigung befindet. Die Formulierung erhält den Prozesscharakter und legt nicht nahe, die Reinigung sei bereits abgeschlossen.
- source_word: שְׁתֵּי צִפֳּרִים חַיּוֹת טְהֹרוֹת
  choice: zwei lebende, reine Vögel
  rationale: צִפּוֹר ist die allgemeine Bezeichnung für einen Vogel und nicht speziell für einen Sperling. „Lebend“ und „rein“ geben beide Attribute knapp wieder; „rein“ entspricht der levitischen Terminologie ritueller Reinheit.
- source_word: עֵץ אֶרֶז
  choice: Zedernholz
  rationale: Die Konstruktverbindung bezeichnet Holz der Zeder beziehungsweise Zedernmaterial. „Zedernholz“ ist die natürliche und hinreichend genaue deutsche Wiedergabe.
- source_word: שְׁנִי תוֹלַעַת
  choice: Scharlachgarn
  rationale: Der Ausdruck bezeichnet mit Scharlach gefärbtes Material, wahrscheinlich Garn oder Faden. „Scharlachgarn“ ist verständlich und wahrt die Unsicherheit über seine genaue Gestalt durch eine Fußnote.
- source_word: אֵזֹב
  choice: Ysop
  rationale: „Ysop“ ist die traditionelle deutsche Wiedergabe in biblischen Ritualtexten. Da die genaue botanische Art unsicher ist, wird keine spekulative Pflanzenbestimmung in den Haupttext aufgenommen.
theological_decisions:
- issue: Bedeutung von טְהֹרוֹת im levitischen Kontext
  choice: reine Vögel
  alternative: kultisch reine Vögel
  rationale: „Rein“ bewahrt die feste biblische Gegensatzterminologie von rein und unrein. Der Zusammenhang macht den rituellen Sinn deutlich, ohne das interpretierende Wort „kultisch“ in den Text einzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlichem Satzbau. Die unpersönliche Konstruktion nach der Anordnung des Priesters bildet die offene Rollenverteilung des Hebräischen ab. Die Fußnotenmarker stehen bei den tatsächlich erläuterten Ausdrücken; so wird eine offenkundige Verschiebung der Marker in der englischen Konsultationsschicht nicht übernommen.
