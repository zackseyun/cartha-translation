  text: וְ/שָׁחַ֣ט אֶת הַ/כֶּ֗בֶשׂ בִּ֠/מְקוֹם אֲשֶׁ֨ר יִשְׁחַ֧ט אֶת הַֽ/חַטָּ֛את וְ/אֶת הָ/עֹלָ֖ה בִּ/מְק֣וֹם הַ/קֹּ֑דֶשׁ כִּ֡י כַּ֠/חַטָּאת הָ/אָשָׁ֥ם הוּא֙ לַ/כֹּהֵ֔ן קֹ֥דֶשׁ קָֽדָשִׁ֖ים הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/013.yaml
  text: And he shall slaughter the lamb in the place where they slaughter the sin offering and the burnt offering[a], in the holy place; for like the sin offering, the guilt offering belongs to the priest[b]; it is most holy.
translation:
  language: de
  text: Und er soll das Lamm an dem Ort schlachten, wo man das Sündopfer[a] und das Brandopfer schlachtet, an der heiligen Stätte. Denn wie das Sündopfer steht auch das Schuldopfer[b] dem Priester zu; es ist hochheilig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Reinigungsopfer“. Das hebräische Wort חַטָּאת kann in den priesterlichen Vorschriften die reinigende Funktion des Opfers hervorheben.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Wiedergutmachungsopfer“. Diese Wiedergabe hebt den mit dem hebräischen אָשָׁם verbundenen Aspekt der Ersatzleistung hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  choice: Und er soll … schlachten
  rationale: שׁחט bezeichnet im Opferkontext das rituelle Schlachten; „schlachten“ bewahrt diesen kultischen Sinn.
- source_word: הַכֶּבֶשׂ
  choice: das Lamm
  rationale: כֶּבֶשׂ bezeichnet hier das bereits im Zusammenhang bestimmte Opfertier; „Lamm“ ist natürlich und sachgerecht.
- source_word: בִּמְקוֹם אֲשֶׁר יִשְׁחַט
  choice: an dem Ort, wo man … schlachtet
  rationale: Das singularische Verb ist in dieser Rechtsanweisung unpersönlich-generisch gebraucht; deutsches „man“ gibt dies idiomatisch wieder.
- source_word: הַחַטָּאת
  choice: das Sündopfer
  rationale: „Sündopfer“ ist die etablierte Bezeichnung der Opferkategorie; die ebenfalls mögliche funktionsbezogene Wiedergabe „Reinigungsopfer“ wird in einer Fußnote genannt.
- source_word: הָעֹלָה
  choice: das Brandopfer
  rationale: „Brandopfer“ ist die übliche deutsche Wiedergabe der vollständig auf dem Altar verbrannten Opferart עֹלָה.
- source_word: בִּמְקוֹם הַקֹּדֶשׁ
  choice: an der heiligen Stätte
  rationale: Die bestimmte Form verweist auf den vorgeschriebenen geheiligten Bereich; „Stätte“ vermeidet eine mögliche Verwechslung mit einem Innenraum des Heiligtums.
- source_word: כִּי כַּחַטָּאת הָאָשָׁם הוּא לַכֹּהֵן
  choice: Denn wie das Sündopfer steht auch das Schuldopfer dem Priester zu
  rationale: Die Formulierung bewahrt den Vergleich zwischen beiden Opferarten und gibt לַכֹּהֵן als priesterlichen Anspruch idiomatisch wieder.
- source_word: קֹדֶשׁ קָדָשִׁים הוּא
  choice: es ist hochheilig
  rationale: „Hochheilig“ gibt die hebräische Verstärkungsform als technische Heiligkeitsstufe knapp und traditionsgemäß wieder.
theological_decisions:
- issue: Wiedergabe von חַטָּאת im priesterlichen Opferrecht
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: Der Ausdruck kann sowohl den Bezug zur Sünde als auch die reinigende Funktion des Ritus hervorheben. Der Haupttext verwendet die geläufige Opferbezeichnung, während die sachlich bedeutsame Alternative in der Fußnote erhalten bleibt.
- issue: Wiedergabe von אָשָׁם
  choice: Schuldopfer
  alternative: Wiedergutmachungsopfer
  rationale: „Schuldopfer“ ist die geläufige Bezeichnung der Opferkategorie und passt zur ausdrücklichen Analogie mit dem Sündopfer. „Wiedergutmachungsopfer“ hebt den mit אָשָׁם teils verbundenen Ersatzleistungsaspekt hervor und wird deshalb als Alternative vermerkt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kultischen Fachbegriffe bleiben erkennbar; die unpersönliche Rechtsformel wird mit „man“ natürlich wiedergegeben. Die Satzgliederung folgt dem Hebräischen, ohne im Deutschen schwerfällig zu wirken.
