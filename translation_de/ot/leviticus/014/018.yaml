  terminology: „Handfläche“, „gereinigt wird“, „Sühne“ und „Jahwe“ sind terminologisch konsistent und quellennah. Die Formulierung „der Mensch, der gereinigt wird“ bewahrt den prozesshaften Charakter des hebräischen Partizips, ohne eine weitergehende dogmatische Deutung einzutragen.
