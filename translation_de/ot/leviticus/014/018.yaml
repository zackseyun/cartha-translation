source:
  edition: WLC
  text: וְ/הַ/נּוֹתָ֗ר בַּ/שֶּׁ֨מֶן֙ אֲשֶׁר֙ עַל כַּ֣ף הַ/כֹּהֵ֔ן יִתֵּ֖ן עַל רֹ֣אשׁ הַ/מִּטַּהֵ֑ר וְ/כִפֶּ֥ר עָלָ֛י/ו הַ/כֹּהֵ֖ן לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/018.yaml
  text: And what remains of the oil that is on the priest’s palm he shall put on the head of the one being cleansed[a], and the priest shall make atonement for him before Yahweh.
translation:
  language: de
  text: Was von dem Öl auf der Handfläche des Priesters übrig ist, soll er auf den Kopf des Menschen tun, der gereinigt wird; und der Priester soll vor Jahwe Sühne für ihn erwirken.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַנּוֹתָר בַּשֶּׁמֶן
  choice: Was von dem Öl … übrig ist
  rationale: Das substantivisch gebrauchte Partizip bezeichnet den verbleibenden Rest. Die partitive Formulierung mit „von dem Öl“ ist im Deutschen natürlich und entspricht dem Zusammenhang.
- source_word: אֲשֶׁר עַל כַּף הַכֹּהֵן
  choice: auf der Handfläche des Priesters
  rationale: כַּף bezeichnet hier präzise die Handfläche; עַל wird quellennah mit „auf“ wiedergegeben.
- source_word: יִתֵּן עַל רֹאשׁ
  choice: soll er auf den Kopf … tun
  rationale: נתן kann „geben“, „setzen“ oder „tun“ bedeuten. Bei der rituellen Verwendung des Öls ist „auf … tun“ verständlich und bleibt der allgemeinen Bedeutung des Verbs nahe.
- source_word: הַמִּטַּהֵר
  choice: des Menschen, der gereinigt wird
  rationale: Das Hitpael-Partizip bezeichnet die Person, die sich im rituellen Reinigungsverfahren befindet. Die Formulierung bewahrt den Vorgangscharakter und ist verständlicher als das substantivierte „der zu Reinigende“.
- source_word: וְכִפֶּר עָלָיו
  choice: und der Priester soll … Sühne für ihn erwirken
  rationale: כפר hat im priesterlichen Ritual einen etablierten Sühnebezug. „Sühne erwirken“ bewahrt diesen theologischen Gehalt, ohne eine bestimmte Theorie der Sühne festzulegen; „für ihn“ gibt עָלָיו idiomatisch wieder.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי bedeutet „vor“ beziehungsweise „in der Gegenwart von“. Der Gottesname wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm; „Jahwe“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von כפר im priesterlichen Reinigungsritual
  choice: Sühne für ihn erwirken
  alternative: ihn entsühnen
  rationale: Die gewählte Formulierung bewahrt die rituell-theologische Bedeutung und den Bezug zugunsten der betreffenden Person, ohne den Ausdruck auf eine bestimmte konfessionelle Sühnelehre zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt dem hebräischen Ablauf, wird aber durch ein Semikolon übersichtlich gegliedert. Die handelnde Person bleibt im ersten Teilsatz als „er“ bezeichnet und wird im zweiten ausdrücklich als der Priester benannt, entsprechend dem Ausgangstext.
