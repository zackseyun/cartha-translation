  source_fidelity: Die Übersetzung gibt den partitiv verstandenen Rest des Öls, dessen Lage auf der Handfläche des Priesters, die Aufbringung auf den Kopf der sich im Reinigungsverfahren befindenden Person sowie die abschließende Sühnehandlung vor Jahwe zuverlässig wieder. „Sühne für ihn erwirken“ ist für וְכִפֶּר עָלָיו in diesem priesterlich-rituellen Kontext angemessen.
