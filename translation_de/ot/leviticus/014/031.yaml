base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/031.yaml
  text: whatever his means can afford[a], one as a sin offering and one as a burnt offering, along with the grain offering[b]. Thus the priest shall make atonement for the one being cleansed before Yahweh.
translation:
  language: de
  text: 'was er sich leisten kann[a]: das eine als Sündopfer[b] und das andere als Brandopfer, zusammen mit dem Speiseopfer. So soll der Priester für den, der gereinigt wird, vor Jahwe Sühne erwirken.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „was seine Hand erreicht“; gemeint ist, was er sich leisten kann.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Reinigungsopfer“.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: was er sich leisten kann
  rationale: Die hebräische Wendung bedeutet wörtlich etwa „was seine Hand erreicht“ und bezeichnet hier seine wirtschaftlichen Möglichkeiten. Die idiomatische deutsche Wiedergabe vermittelt diesen Sinn klar.
- source_word: חַטָּאת
  choice: Sündopfer
  rationale: Der etablierte deutsche Opferbegriff bewahrt den kultischen Zusammenhang; „Reinigungsopfer“ bleibt als sachlich mögliche Alternative in der Fußnote erhalten.
- source_word: עֹלָה
  choice: Brandopfer
  rationale: Dies ist die geläufige und sachgerechte deutsche Bezeichnung für das Opfer, das vollständig auf dem Altar verbrannt wird.
- source_word: עַל הַמִּנְחָה
  choice: zusammen mit dem Speiseopfer
  rationale: עַל bezeichnet hier die begleitende beziehungsweise zusätzliche Darbringung, nicht eine räumliche Lage. „Speiseopfer“ ist der traditionelle deutsche Fachbegriff für מִנְחָה in diesem Ritualkontext.
- source_word: וְכִפֶּר
  choice: soll … Sühne erwirken
  rationale: Die Formulierung gibt die kultische Funktion von כפר wieder, ohne eine bestimmte spätere Theorie der Sühne in den Vers hineinzulesen.
- source_word: הַמִּטַּהֵר
  choice: der, der gereinigt wird
  rationale: Das Partizip bezeichnet die Person, die sich im rituellen Reinigungsprozess befindet.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: „Vor“ gibt לִפְנֵי knapp und natürlich wieder; der Gottesname wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe der Opferterminologie und der Sühneaussage
  choice: Sündopfer, Brandopfer und Sühne erwirken
  alternative: Reinigungsopfer; reinigen/Entsühnung bewirken
  rationale: Die gewählten Begriffe bewahren die kultische und theologische Spannung des hebräischen Textes, ohne den Vorgang auf eine bestimmte Sühnetheorie festzulegen.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Die Umschrift als Eigenname wahrt die persönliche Namensform des hebräischen Textes.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem kultischem Wortschatz. Da der Vers syntaktisch an den vorhergehenden Vers anschließt, beginnt die Übersetzung entsprechend mit einem kleingeschriebenen Satzfragment. Der Marker [b] steht unmittelbar bei „Sündopfer“, auf das sich die alternative Wiedergabe bezieht.
