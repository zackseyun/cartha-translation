base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/020.yaml
  text: Then the priest shall offer up the burnt offering and the grain offering on the altar[a], and the priest shall make atonement for him, and he shall be clean.
translation:
  language: de
  text: Dann soll der Priester das Brandopfer und das Speiseopfer auf dem Altar darbringen, und der Priester soll für ihn Sühne erwirken, und er wird rein sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und er ist rein.“ Das Hebräische bezeichnet den daraus folgenden Zustand der kultischen Reinheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱלָה
  choice: soll … darbringen
  rationale: Der Hifil von עלה bezeichnet im Opferkontext das Darbringen auf dem Altar. „Darbringen“ gibt die kultische Handlung natürlich und präzise wieder.
- source_word: הָעֹלָה
  choice: das Brandopfer
  rationale: עֹלָה ist die übliche Bezeichnung für das Brandopfer, das vollständig auf dem Altar verbrannt wird.
- source_word: הַמִּנְחָה
  choice: das Speiseopfer
  rationale: מִנְחָה bezeichnet in der Opfergesetzgebung des Levitikus das unblutige, vorwiegend aus Getreide bestehende Opfer. „Speiseopfer“ ist die etablierte und verständliche deutsche Wiedergabe.
- source_word: הַמִּזְבֵּחָה
  choice: auf dem Altar
  rationale: Die Richtungsendung bezeichnet hier idiomatisch das Darbringen beziehungsweise Platzieren auf dem Altar.
- source_word: וְכִפֶּר עָלָיו
  choice: soll … für ihn Sühne erwirken
  rationale: כפר bezeichnet im priesterlichen Opferkontext das Herbeiführen von Sühne; עָלָיו kennzeichnet die Person, zu deren Gunsten die Handlung geschieht.
- source_word: וְטָהֵר
  choice: dann ist er rein
  rationale: Die Qal-Form beschreibt den daraus folgenden Status der betreffenden Person. Die Formulierung bewahrt die Kategorie kultischer Reinheit, ohne sie als moralische Läuterung auszulegen.
theological_decisions:
- issue: Art der Reinheit im priesterlichen Gesetz
  choice: „rein“ als kultischer Status
  alternative: moralisch rein oder innerlich geläutert
  rationale: Levitikus 14 behandelt die Wiederherstellung nach kultischer Unreinheit infolge einer Hautkrankheit. Die Übersetzung belässt es beim schlichten Begriff „rein“ und trägt keine moralische Deutung ein.
- issue: Bedeutung von כפר
  choice: Sühne für die betroffene Person erwirken
  alternative: die Person entsündigen oder moralisch reinigen
  rationale: Der Vers unterscheidet die priesterliche Sühnehandlung vom anschließend festgestellten Reinheitsstatus. Diese Spannung bleibt erhalten, ohne beide Aussagen gleichzusetzen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit geläufiger Terminologie der levitischen Opfergesetze. Der Satzbau folgt dem Ablauf des hebräischen Ritualtexts, vermeidet jedoch unnötig altertümliche Formen.
