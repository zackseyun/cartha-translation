  text: אֶת הַ/צִּפֹּ֤ר הַֽ/חַיָּה֙ יִקַּ֣ח אֹתָ֔/הּ וְ/אֶת עֵ֥ץ הָ/אֶ֛רֶז וְ/אֶת שְׁנִ֥י הַ/תּוֹלַ֖עַת וְ/אֶת הָ/אֵזֹ֑ב וְ/טָבַ֨ל אוֹתָ֜/ם וְ/אֵ֣ת הַ/צִּפֹּ֣ר הַֽ/חַיָּ֗ה בְּ/דַם֙ הַ/צִּפֹּ֣ר הַ/שְּׁחֻטָ֔ה עַ֖ל הַ/מַּ֥יִם הַֽ/חַיִּֽים־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/006.yaml
  text: As for the living bird, he shall take it, along with the cedar wood, the scarlet yarn, and the hyssop, and dip them and the living bird in the blood of the bird that was slaughtered over the fresh water.
translation:
  language: de
  text: Den lebenden Vogel soll er zusammen mit dem Zedernholz, dem karmesinroten Garn und dem Ysop nehmen. Dann soll er sie und den lebenden Vogel in das Blut des Vogels tauchen, der über fließendem Wasser[a] geschlachtet wurde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »lebendigem Wasser«; auch: frischem Wasser.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּפֹּר הַחַיָּה
  choice: der lebende Vogel
  rationale: Gibt die attributive Wendung wörtlich und natürlich wieder und bewahrt den Gegensatz zum geschlachteten Vogel.
- source_word: יִקַּח
  choice: soll er nehmen
  rationale: Der Imperfekt hat im Zusammenhang der Ritualanweisung vorschreibende Funktion; „soll“ ist dafür im modernen Deutschen angemessen.
- source_word: עֵץ הָאֶרֶז
  choice: das Zedernholz
  rationale: Bezeichnet das im Ritus verwendete Holz beziehungsweise ein Stück davon; die knappe Stoffbezeichnung ist im Deutschen verständlich.
- source_word: שְׁנִי הַתּוֹלַעַת
  choice: das karmesinrote Garn
  rationale: Die Wendung bezeichnet ein mit Karmesin gefärbtes textiles Material. „Garn“ passt zu dem als Ritualgegenstand verwendeten Material, ohne eine genauere Form vorzugeben.
- source_word: הָאֵזֹב
  choice: der Ysop
  rationale: Traditionelle und transparente Wiedergabe der Ritualpflanze, deren genaue botanische Bestimmung nicht völlig sicher ist.
- source_word: וְטָבַל
  choice: dann soll er … tauchen
  rationale: Das Verb bezeichnet das Eintauchen in eine Flüssigkeit. Die Wiederaufnahme mit „Dann soll er“ macht die lange hebräische Reihung im Deutschen klar lesbar.
- source_word: אוֹתָם וְאֵת הַצִּפֹּר הַחַיָּה
  choice: sie und den lebenden Vogel
  rationale: Das Pluralpronomen verweist auf die zuvor genannten Ritualgegenstände; der lebende Vogel wird ausdrücklich als weiteres Objekt des Eintauchens genannt.
- source_word: בְּדַם הַצִּפֹּר הַשְּׁחֻטָה
  choice: in das Blut des Vogels …, der … geschlachtet wurde
  rationale: „In das Blut“ bezeichnet nach טבל das Medium des Eintauchens; „geschlachtet“ bewahrt den rituellen Sinn von שׁחט.
- source_word: עַל הַמַּיִם הַחַיִּים
  choice: über dem Quellwasser
  rationale: מַיִם חַיִּים bezeichnet natürlich vorhandenes, frisches beziehungsweise fließendes Wasser. „Quellwasser“ ist im Ritualzusammenhang verständlich und vermeidet die im Deutschen missverständliche wörtliche Form „lebendiges Wasser“; die Alternativen werden in der Fußnote bewahrt.
theological_decisions:
- issue: Wiedergabe von מַיִם חַיִּים im Reinheitsritual
  choice: Quellwasser
  alternative: lebendiges Wasser; fließendes Wasser; frisches Wasser
  rationale: Die hebräische Wendung lautet wörtlich „lebendiges Wasser“ und meint hier frisches, natürlich zufließendes Wasser. „Quellwasser“ vermittelt diesen konkreten Sinn, ohne mögliche spätere theologische Assoziationen in den Vers hineinzutragen; die echte lexikalische Spannweite bleibt in der Fußnote sichtbar.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die lange hebräische Satzkette wurde zur besseren Verständlichkeit in zwei Sätze gegliedert. Die Wiederholung von „den lebenden Vogel“ bleibt erhalten, weil sie im Ausgangstext ausdrücklich steht.
