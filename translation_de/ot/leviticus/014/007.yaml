source:
  edition: WLC
  text: וְ/הִזָּ֗ה עַ֧ל הַ/מִּטַּהֵ֛ר מִן הַ/צָּרַ֖עַת שֶׁ֣בַע פְּעָמִ֑ים וְ/טִ֣הֲר֔/וֹ וְ/שִׁלַּ֛ח אֶת הַ/צִּפֹּ֥ר הַֽ/חַיָּ֖ה עַל פְּנֵ֥י הַ/שָּׂדֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/007.yaml
  text: He shall sprinkle it on the one being cleansed from the skin disease seven times[a], and he shall pronounce him clean[b], and he shall let the living bird go free over the open field.
translation:
  language: de
  text: Er soll den, der von der Hautkrankheit gereinigt wird, siebenmal besprengen und ihn für rein erklären[a]. Dann soll er den lebenden Vogel ins freie Feld freilassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihn reinigen«. Gemeint ist hier die priesterliche Feststellung beziehungsweise Erklärung seines rituellen Reinheitsstatus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזָּה
  choice: Er soll … besprengen
  rationale: Das Hifil von נזה bezeichnet im kultischen Zusammenhang das Besprengen mit einer Flüssigkeit. Im Deutschen kann das im vorausgehenden Zusammenhang genannte Mittel unausgesprochen bleiben.
- source_word: הַמִּטַּהֵר
  choice: den, der … gereinigt wird
  rationale: Das Hitpael-Partizip bezeichnet die Person, die sich im Reinigungsverfahren befindet; die Formulierung bewahrt den prozesshaften Sinn.
- source_word: מִן הַצָּרַעַת
  choice: von der Hautkrankheit
  rationale: צָרַעַת bezeichnet in Levitikus eine breitere, kultisch relevante Gruppe von Hauterscheinungen und darf nicht ohne Weiteres mit der modernen Lepra gleichgesetzt werden.
- source_word: שֶׁבַע פְּעָמִים
  choice: siebenmal
  rationale: Natürliche und genaue Wiedergabe der adverbialen Zahlenangabe.
- source_word: וְטִהֲרוֹ
  choice: und ihn für rein erklären
  rationale: Hier bezeichnet טהר die priesterliche Feststellung beziehungsweise Erklärung des Reinheitsstatus, nicht bloß eine medizinische Heilung.
- source_word: וְשִׁלַּח
  choice: Dann soll er … fliegen lassen
  rationale: שׁלח bedeutet senden oder freilassen. Bei einem lebenden Vogel gibt „fliegen lassen“ die konkrete Freilassung natürlich wieder.
- source_word: הַצִּפֹּר הַחַיָּה
  choice: den lebenden Vogel
  rationale: Die Bezeichnung unterscheidet diesen Vogel ausdrücklich von dem zuvor geschlachteten.
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: über dem freien Feld
  rationale: Die Wiedergabe erhält die räumliche Bildlichkeit von עַל־פְּנֵי und versteht הַשָּׂדֶה als offene Landschaft.
theological_decisions:
- issue: Wiedergabe von צָרַעַת
  choice: Hautkrankheit
  alternative: Aussatz / Lepra
  rationale: Der hebräische Begriff ist breiter als die moderne Hansen-Krankheit und bezeichnet in Levitikus eine Kategorie kultisch relevanter Hauterscheinungen. „Hautkrankheit“ vermeidet eine anachronistische medizinische Festlegung.
- issue: Bedeutung von וְטִהֲרוֹ
  choice: ihn für rein erklären
  alternative: ihn reinigen
  rationale: Die Formulierung hebt den priesterlich-rituellen Statusentscheid hervor, ohne zu behaupten, der Priester bewirke an dieser Stelle eine körperliche Heilung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt eng am Hebräischen, während „fliegen lassen“ die Freilassung des lebenden Vogels idiomatisch ausdrückt. Der Fußnotenmarker [a] steht unmittelbar bei der erklärungsbedürftigen Statusformel.
