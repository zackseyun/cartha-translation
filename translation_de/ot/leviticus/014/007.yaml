  verdict: revise
  source_fidelity: Die Wiedergabe des Besprengens, der siebenmaligen Handlung, der Person im Reinigungsverfahren und der Hautkrankheit ist quellentreu. „Für rein erklären“ ist für וְטִהֲרוֹ im priesterlich-rituellen Kontext vertretbar und bewahrt die formale Statusfeststellung; die Fußnote hält die mögliche aktivere Lesart „reinigen“ offen.
  naturalness: Der erste Satz ist modernes, gut verständliches Standarddeutsch. „Den Vogel über dem freien Feld fliegen lassen“ kann jedoch bedeuten, dass der Priester den Flug über dem Feld veranlasst oder kontrolliert, statt dass er den Vogel freilässt. „Ins freie Feld freilassen“ gibt die beabsichtigte Entlassung idiomatischer wieder.
  terminology: „Hautkrankheit“ vermeidet die anachronistische Gleichsetzung von צָרַעַת mit moderner Lepra. „Rein“ und „für rein erklären“ passen zum rituellen Register. „Lebender Vogel“ ist als Gegenüber zum zuvor getöteten Vogel sachgerecht.
