  to: Und der Priester soll etwas von dem Öl, das auf seiner Handfläche ist, auf das Ohrläppchen des rechten Ohres des Menschen, der gereinigt wird, auf den Daumen seiner rechten Hand und auf die große Zehe seines rechten Fußes auftragen, und zwar an die Stelle, an der das Blut des Schuldopfers aufgetragen worden war.[a]
  rationale: Die Fassung ersetzt die sachlich unzutreffende Gegenwartsbeschreibung des Blutes durch einen kontextgemäßen Rückverweis auf dessen vorheriges Auftragen. Die Fußnote hält die knappere, dem hebräischen Nominalausdruck nähere Lesart transparent. „Auftragen“ gibt die rituelle Handlung idiomatisch wieder, ohne über die Art der Anwendung hinauszugehen.
