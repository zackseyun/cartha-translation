source:
  edition: WLC
  text: וְ/נָתַ֨ן הַ/כֹּהֵ֜ן מִן הַ/שֶּׁ֣מֶן אֲשֶׁ֣ר עַל כַּפּ֗/וֹ עַל תְּנ֞וּךְ אֹ֤זֶן הַ/מִּטַּהֵר֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֤הֶן יָד/וֹ֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְל֖/וֹ הַ/יְמָנִ֑ית עַל מְק֖וֹם דַּ֥ם הָ/אָשָֽׁם־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/028.yaml
  text: And the priest shall put some of the oil that is on his palm on the lobe of the right ear of the one being cleansed[a], and on the thumb of his right hand, and on the big toe of his right foot, on the place of the guilt-offering blood.
translation:
  language: de
  text: Und der Priester soll etwas von dem Öl, das auf seiner Handfläche ist, auf das Ohrläppchen des rechten Ohres des Menschen, der gereinigt wird, auf den Daumen seiner rechten Hand und auf die große Zehe seines rechten Fußes auftragen, und zwar an die Stelle, an der das Blut des Schuldopfers aufgetragen worden war.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an die Stelle des Blutes des Schuldopfers“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: soll … tun
  rationale: נתן bedeutet allgemein „geben, setzen, tun“. Im Zusammenhang des Rituals gibt „tun“ das Auftragen des Öls natürlich wieder, ohne die Art der Handlung stärker festzulegen.
- source_word: מִן הַשֶּׁמֶן
  choice: etwas von dem Öl
  rationale: Das partitive מִן wird im Deutschen idiomatisch mit „etwas von“ wiedergegeben.
- source_word: אֲשֶׁר עַל כַּפּוֹ
  choice: das auf seiner Handfläche ist
  rationale: כַּף bezeichnet hier die Handfläche beziehungsweise die hohle Hand des Priesters; „auf seiner Handfläche“ folgt zugleich der hebräischen Präposition.
- source_word: תְּנוּךְ אֹזֶן
  choice: das Läppchen des … Ohres
  rationale: תְּנוּךְ bezeichnet in diesem priesterlichen Ritual wahrscheinlich das Ohrläppchen; die Formulierung bleibt nah am hebräischen Ausdruck.
- source_word: הַמִּטַּהֵר
  choice: der Mensch, der gereinigt wird
  rationale: Das Hitpael-Partizip bezeichnet die Person, die den rituellen Reinigungsprozess durchläuft. Die passive Verlaufsform bewahrt diesen Aspekt.
- source_word: הַיְמָנִית
  choice: rechten
  rationale: „Rechten“ ist die natürliche deutsche anatomische Richtungsangabe an allen drei Stellen.
- source_word: בֹּהֶן יָדוֹ
  choice: den Daumen seiner … Hand
  rationale: בֹּהֶן bezeichnet bei der Hand den Daumen.
- source_word: בֹּהֶן רַגְלוֹ
  choice: die große Zehe seines … Fußes
  rationale: בֹּהֶן bezeichnet beim Fuß die große Zehe; dies ist die übliche moderne deutsche Benennung.
- source_word: עַל מְקוֹם דַּם הָאָשָׁם
  choice: auf die Stelle, an der sich das Blut des Schuldopfers befindet
  rationale: Die Wendung bezeichnet die Stelle, auf die zuvor das Blut des Schuldopfers getan wurde. Die Formulierung macht den räumlichen Bezug verständlich, ohne ein im Hebräischen nicht ausdrücklich genanntes Verb für das frühere Auftragen einzufügen.
theological_decisions:
- issue: Wiedergabe von אָשָׁם
  choice: Schuldopfer
  alternative: Entschädigungsopfer / Wiedergutmachungsopfer
  rationale: אָשָׁם kann Schuld sowie das damit verbundene Opfer bezeichnen. „Schuldopfer“ ist im Deutschen der geläufige und hinreichend präzise levitische Opferbegriff; mögliche Aspekte von Wiedergutmachung werden dadurch nicht dogmatisch ausgeschlossen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt der ritualsprachlichen Aufzählung des Hebräischen, wird aber durch „und zwar“ am Schluss verständlich gegliedert. „Mensch“ vermeidet eine unnötige Festlegung des Geschlechts der gereinigten Person.
