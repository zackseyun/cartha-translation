- from: Dies ist die Weisung für jeden Fall eines aussatzartigen Befalls und für einen schuppigen Ausschlag[a].
  to: Dies ist die Weisung für jede aussatzartige Hautkrankheit und für Grind[a].
  rationale: Die Revision ersetzt die doppelte und unklare Formulierung „Fall eines aussatzartigen Befalls“ durch eine verständliche, quellentreue Bezeichnung der in diesem Kontext gemeinten Hautkrankheitskategorie. Für נֶתֶק wird die im Deutschen etablierte, aber nicht modern-diagnostisch festlegende Bezeichnung „Grind“ gewählt. Die Fußnote erhält die lexikalische Unsicherheit sowie den Bezug zu Kopf oder Bart, ohne eine umstrittene medizinische Identifikation in den Haupttext einzutragen.
