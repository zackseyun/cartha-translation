  register: Modernes, würdiges Standarddeutsch. Die Formulierung vermeidet eine Gleichsetzung von צָרַעַת mit der heutigen Hansen-Krankheit und bewahrt zugleich den traditionellen Bedeutungsanklang. „Befall“ ist bewusst weiter als „Hautkrankheit“, da der unmittelbare Zusammenhang auch Textilien und Häuser umfasst.
