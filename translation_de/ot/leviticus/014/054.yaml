  text: זֹ֖את הַ/תּוֹרָ֑ה לְ/כָל נֶ֥גַע הַ/צָּרַ֖עַת וְ/לַ/נָּֽתֶק־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/054.yaml
  text: This is the law for every case of leprous disease and for an itch[a].
translation:
  language: de
  text: Dies ist die Weisung für jede aussatzartige Hautkrankheit und für Grind[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für einen Kahlgrind“. Das hebräische Wort bezeichnet einen besonderen Befund, besonders an Kopf oder Bart; seine genaue medizinische Entsprechung ist ungewiss.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: Dies ist
  rationale: Das feminine Demonstrativpronomen eröffnet eine zusammenfassende Rechtsformel; im Deutschen wird die Kopula natürlich ergänzt.
- source_word: הַתּוֹרָה
  choice: die Weisung
  rationale: תּוֹרָה bezeichnet hier die verbindliche Vorschrift für die Feststellung und Behandlung der beschriebenen Fälle. „Weisung“ wahrt den konkreten Anweisungscharakter, ohne den Ausdruck auf ein modernes Gesetzeskonzept zu verengen.
- source_word: לְכָל
  choice: für jeden
  rationale: לְ mit כָּל bezeichnet den Geltungsbereich der Weisung.
- source_word: נֶגַע הַצָּרַעַת
  choice: Fall eines aussatzartigen Befalls
  rationale: נֶגַע bezeichnet hier einen untersuchten Befall beziehungsweise Krankheitsfall. צָרַעַת ist nicht zuverlässig mit der modernen Hansen-Krankheit gleichzusetzen und kann im Kontext auch Textilien und Häuser betreffen; „aussatzartig“ erhält die traditionelle Verbindung, während „Befall“ die sachliche Breite wahrt.
- source_word: וְלַנָּתֶק
  choice: und für einen schuppigen Ausschlag
  rationale: נֶתֶק bezeichnet in Levitikus 13 einen besonderen Befund an Kopf oder Bart, dessen genaue medizinische Entsprechung unsicher ist. „Schuppiger Ausschlag“ ist verständlich und kennzeichnet ihn vorsichtig als Hautbefund.
theological_decisions: []
