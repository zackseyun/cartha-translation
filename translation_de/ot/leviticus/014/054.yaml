    issue: „Fall eines aussatzartigen Befalls“ ist eine unpräzise und stilistisch holprige Wiedergabe von נֶגַע הַצָּרַעַת.
    rationale: Die Wendung verdoppelt praktisch „Fall“ und „Befall“ und lässt offen, worin der Befall besteht. Der Kontext betrifft eine Kategorie von Hautkrankheiten; „aussatzartige Hautkrankheit“ gibt dies klarer wieder, ohne moderne Leprakonzepte zu behaupten.
  - severity: medium
    issue: „schuppiger Ausschlag“ legt für נֶתֶק eine nicht gesicherte dermatologische Eigenschaft fest.
    rationale: Der Ausdruck bezeichnet einen speziellen Befund, insbesondere im Bereich von Kopf oder Bart, und wird in den Lexika bzw. Übersetzungen unterschiedlich bestimmt. „Grind“ mit erläuternder Fußnote ist zurückhaltender.
