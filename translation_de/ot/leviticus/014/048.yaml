base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/048.yaml
  text: But if the priest comes in and looks[a], and behold, the disease has not spread in the house after the house was plastered, then the priest shall pronounce the house clean[b], because the disease is healed.
translation:
  language: de
  text: Wenn aber der Priester hineingeht und sieht, dass sich der Befall[a] im Haus nicht ausgebreitet hat, nachdem das Haus verputzt worden ist, soll der Priester das Haus für rein erklären[b], denn der Befall ist abgeheilt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann auch mit »Schädigung« oder traditionell mit »Plage« wiedergegeben werden. Gemeint ist der das Haus betreffende Befall.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »soll der Priester das Haus reinigen«. Das hebräische Verb kann sowohl das Reinigen als auch die priesterliche Feststellung der Reinheit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Wenn aber
  rationale: Leitet den gegensätzlichen Bedingungsfall innerhalb des gesetzlichen Verfahrens ein.
- source_word: בֹּא יָבֹא
  choice: tatsächlich hineingeht
  rationale: Gibt die durch den Infinitivus absolutus verstärkte Verbform wieder und bezeichnet das Eintreten zur Nachprüfung.
- source_word: וְרָאָה וְהִנֵּה
  choice: und sieht, dass
  rationale: Verbindet das Sehen mit dem hervorgehobenen Ergebnis der Untersuchung in natürlichem modernem Deutsch, ohne über das Hebräische hinaus ein fachliches »untersuchen« einzutragen.
- source_word: לֹא פָשָׂה
  choice: sich nicht ausgebreitet hat
  rationale: פשה bezeichnet in den Vorschriften über Haut- und Hausbefall dessen weitere Ausbreitung.
- source_word: הַנֶּגַע
  choice: der Befall
  rationale: »Befall« bezeichnet den schädigenden Zustand des Hauses, ohne eine moderne medizinische Diagnose oder die irreführende Vorstellung einer Epidemie nahezulegen.
- source_word: אַחֲרֵי הִטֹּחַ אֶת־הַבָּיִת
  choice: nachdem das Haus verputzt worden ist
  rationale: טוח bezeichnet hier das Verputzen beziehungsweise Beschichten des Hauses; die Passivform entspricht dem fehlenden Nachdruck auf den Handelnden.
- source_word: וְטִהַר הַכֹּהֵן אֶת־הַבַּיִת
  choice: soll der Priester das Haus für rein erklären
  rationale: Im priesterlichen Reinheitsverfahren bezeichnet טהר hier die Feststellung beziehungsweise Erklärung des reinen Zustands, nicht bloß eine materielle Säuberung.
- source_word: כִּי נִרְפָּא הַנָּגַע
  choice: denn der Befall ist geheilt
  rationale: Bewahrt die auffällige Heilungssprache von רפא, die der hebräische Text auch auf den Befall eines Hauses anwendet.
theological_decisions:
- issue: Rituelle Reinheitserklärung oder praktische Reinigung bei וְטִהַר
  choice: Der Priester erklärt das Haus für rein.
  alternative: Der Priester reinigt das Haus.
  rationale: Der Zusammenhang beschreibt die priesterliche Feststellung des Reinheitsstatus nach erfolgter Sanierung. Die Übersetzung wahrt die rechtlich-rituelle Funktion, ohne dem Priester die praktische Reinigung zuzuschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Tatsächlich« bildet die hebräische Verstärkung ab; die ungewöhnliche Aussage, der Hausbefall sei »geheilt«, bleibt bewusst erhalten.
