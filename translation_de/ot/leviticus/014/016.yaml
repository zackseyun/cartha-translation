id: LEV.14.16
reference: Leviticus 14:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/טָבַ֤ל הַ/כֹּהֵן֙ אֶת אֶצְבָּע֣/וֹ הַ/יְמָנִ֔ית מִן הַ/שֶּׁ֕מֶן אֲשֶׁ֥ר עַל כַּפּ֖/וֹ הַ/שְּׂמָאלִ֑ית וְ/הִזָּ֨ה מִן הַ/שֶּׁ֧מֶן בְּ/אֶצְבָּע֛/וֹ שֶׁ֥בַע פְּעָמִ֖ים לִ/פְנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/016.yaml
  text: The priest shall dip his right finger into some of the oil that is on his left palm[a], and with his finger he shall sprinkle some of the oil seven times before Yahweh.
translation:
  language: de
  text: Der Priester soll den Finger seiner rechten Hand in das Öl tauchen, das sich auf seiner linken Handfläche befindet. Dann soll er mit seinem Finger siebenmal etwas von dem Öl vor Jahwe sprengen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְטָבַל
  choice: soll … tauchen
  rationale: טבל bezeichnet das Eintauchen in eine Flüssigkeit. Im Deutschen verlangt „tauchen“ hier idiomatisch die Präposition „in“.
- source_word: אֶצְבָּעוֹ הַיְמָנִית
  choice: den Finger seiner rechten Hand
  rationale: Die Formulierung bewahrt die für die Ritualhandlung wichtige Angabe der rechten Seite und klingt eindeutiger als „seinen rechten Finger“, ohne einen bestimmten Finger zu ergänzen.
- source_word: מִן הַשֶּׁמֶן
  choice: in das Öl / etwas von dem Öl
  rationale: Nach טבל wird מִן im Deutschen idiomatisch durch „in“ wiedergegeben; beim anschließenden Sprengen bezeichnet es eine Teilmenge des Öls.
- source_word: אֲשֶׁר עַל כַּפּוֹ הַשְּׂמָאלִית
  choice: das sich auf seiner linken Handfläche befindet
  rationale: כַּף bezeichnet hier genauer die Handfläche, nicht bloß die Hand. „Auf“ entspricht der räumlichen Formulierung des Hebräischen.
- source_word: וְהִזָּה
  choice: Dann soll er … sprengen
  rationale: Im priesterlichen Ritual bezeichnet נזה das gezielte Versprengen einer Flüssigkeit. „Sprengen“ ist dafür ein präziser, würdiger deutscher Ritualausdruck.
- source_word: בְּאֶצְבָּעוֹ
  choice: mit seinem Finger
  rationale: Die Präposition בְּ kennzeichnet hier das verwendete Mittel.
- source_word: שֶׁבַע פְּעָמִים
  choice: siebenmal
  rationale: Die genaue Zahl ist Bestandteil der vorgeschriebenen Ritualhandlung und wird wörtlich wiedergegeben.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי bezeichnet hier die Handlung in der Gegenwart Jahwes; „vor“ erhält die knappe kultische Ausdrucksweise.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im modernen Deutschen geläufige Form.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. Die Wiedergabe „Jahwe“ lässt den Bundesnamen im Haupttext sichtbar, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Moderner, würdiger Standarddeutsch-Stil mit klarer Ritualsprache. Der lange hebräische Satz wird zur besseren Verständlichkeit in zwei deutsche Sätze gegliedert; die Abfolge der Handlungen bleibt unverändert.
