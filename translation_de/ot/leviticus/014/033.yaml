  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/033.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: de
  text: 'Und Jahwe[a] redete zu Mose und Aaron:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: redete
  rationale: Das Waw-Konsekutiv mit דבר führt im erzählenden Kontext einen neuen Sprechakt ein. „redete“ gibt die feierliche, formelhafte Wendung natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, damit der im Hebräischen stehende Eigenname erhalten bleibt.
- source_word: אֶל מֹשֶׁה
  choice: zu Mose
  rationale: אֶל bezeichnet hier den Adressaten der Rede; „zu Mose“ ist die natürliche deutsche Entsprechung.
- source_word: וְאֶל אַהֲרֹן
  choice: und Aaron
  rationale: Im Deutschen regiert das bereits gesetzte „zu“ beide verbundenen Namen. Dadurch bleibt Aaron ausdrücklich als zweiter Adressat erkennbar, ohne die Präposition unnatürlich zu wiederholen.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Die formelhafte Einleitung der folgenden direkten Rede wird im modernen Deutschen idiomatisch durch einen Doppelpunkt wiedergegeben; ein zusätzliches „und sprach“ wäre redundant.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst und keinen Titel. „Jahwe“ bewahrt diese Unterscheidung; die traditionelle Wiedergabe wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Redeeinleitungsformel wird knapp und idiomatisch mit einem Doppelpunkt abgeschlossen.
