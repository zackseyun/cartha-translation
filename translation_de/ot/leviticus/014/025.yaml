base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/025.yaml
  text: Then he shall slaughter the guilt-offering lamb[a], and the priest shall take some of the blood of the guilt offering and put it on the lobe of the right ear of the one being cleansed, and on the thumb of his right hand[b], and on the big toe of his right foot.
translation:
  language: de
  text: Dann soll der Priester das Lamm für das Schuldopfer[a] schlachten. Er soll etwas von dem Blut des Schuldopfers nehmen und es dem, der gereinigt wird, auf das Ohrläppchen[b] des rechten Ohres, auf den Daumen seiner rechten Hand und auf die große Zehe seines rechten Fußes streichen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch „Wiedergutmachungsopfer“. Gemeint ist eine bestimmte Opferart.
    reason: lexical_alternative
  - marker: b
    text: Oder „den äußeren Rand“. Das seltene hebräische Wort bezeichnet einen äußeren Teil des Ohres; die genaue anatomische Stelle ist nicht sicher.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: שָׁחַט
  choice: schlachten
  rationale: Im kultischen Opferzusammenhang bezeichnet das Verb das rituelle Schlachten, nicht lediglich ein allgemeines Töten.
- source_word: כֶּבֶשׂ הָאָשָׁם
  choice: das Lamm für das Schuldopfer
  rationale: Die Formulierung bezeichnet das für dieses Opfer bestimmte Lamm; die Wiedergabe ist im Deutschen natürlicher als „das Schuldopferlamm“.
- source_word: אָשָׁם
  choice: Schuldopfer
  rationale: Der Begriff bezeichnet hier eine bestimmte Opferart. „Schuldopfer“ ist die geläufige, knappe deutsche Fachbezeichnung, ohne die Bedeutung auf abstrakte Schuld zu reduzieren.
- source_word: מִדַּם הָאָשָׁם
  choice: etwas von dem Blut des Schuldopfers
  rationale: 'Die Präposition מִן ist hier partitiv: Nur ein Teil des Blutes wird für die beschriebene Handlung genommen.'
- source_word: תְּנוּךְ אֹזֶן
  choice: das Läppchen des ... Ohres
  rationale: Das seltene Wort bezeichnet einen äußeren beziehungsweise vorspringenden Teil des Ohres; „Läppchen“ entspricht dem traditionellen Ritualausdruck, während die genaue anatomische Stelle unsicher bleibt.
- source_word: הַמִּטַּהֵר
  choice: dem, der gereinigt wird
  rationale: Das Hitpael-Partizip bezeichnet die Person, die sich im laufenden Reinigungsverfahren befindet; die Formulierung bewahrt diesen prozesshaften Sinn.
- source_word: בֹּהֶן יָדוֹ
  choice: den Daumen seiner ... Hand
  rationale: בֹּהֶן bezeichnet in Verbindung mit der Hand den Daumen.
- source_word: בֹּהֶן רַגְלוֹ
  choice: die große Zehe seines ... Fußes
  rationale: בֹּהֶן bezeichnet in Verbindung mit dem Fuß die große Zehe.
- source_word: וְנָתַן עַל
  choice: und ... auf ... streichen
  rationale: Wörtlich steht „und geben/tun auf“. „Auf ... streichen“ beschreibt die rituelle Anwendung des Blutes im Deutschen klar und idiomatisch, ohne eine zusätzliche Handlung einzutragen.
theological_decisions:
- issue: Wiedergabe der Opferbezeichnung אָשָׁם
  choice: Schuldopfer
  alternative: Wiedergutmachungsopfer
  rationale: „Schuldopfer“ ist die etablierte deutsche Bezeichnung für diese konkrete levitische Opferart. „Wiedergutmachungsopfer“ hebt einen realen Bedeutungsaspekt hervor, würde die Funktion des Opfers hier aber stärker festlegen, als der Vers selbst es tut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Verfahrenssprache. Die Satzfolge wahrt den Ablauf des hebräischen Textes; die Wiederholungen bei rechter Hand und rechtem Fuß bleiben zur Genauigkeit erhalten.
