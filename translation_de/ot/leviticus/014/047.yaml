base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/047.yaml
  text: And whoever lies down in the house shall wash his clothes[b][a], and whoever eats in the house shall wash his clothes.
translation:
  language: de
  text: Und wer sich im Haus hinlegt[a], muss seine Kleider[b] waschen; und wer im Haus isst, muss seine Kleider waschen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »schläft«. Das hebräische Verb kann sowohl das Hinlegen als auch das Schlafen bezeichnen; »sich hinlegt« ist weiter gefasst.'
    reason: lexical_alternative
  - marker: b
    text: Das Hebräische verwendet bei »seine Kleider« ein maskulines Singularsuffix in einem allgemein geltenden Rechtssatz.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשֹּׁכֵב
  choice: Und wer sich … hinlegt
  rationale: Das substantivierte Partizip bezeichnet allgemein jede Person, die sich im Haus hinlegt. »Sich hinlegt« bewahrt gegenüber »schläft« die weitere Bedeutung von שׁכב und klingt im modernen Deutsch natürlich.
- source_word: בַּבַּיִת
  choice: in dem Haus
  rationale: Direkte und idiomatische Wiedergabe der Ortsangabe; »dem« nimmt das im Zusammenhang bereits bestimmte Haus auf.
- source_word: יְכַבֵּס
  choice: muss … waschen
  rationale: Das Imperfekt drückt in diesem priesterlichen Rechtszusammenhang eine verbindliche Vorschrift aus. »Muss« vermittelt diese Verpflichtung im heutigen Deutsch klarer als das mehrdeutige »soll«.
- source_word: אֶת־בְּגָדָיו
  choice: seine Kleider
  rationale: בֶּגֶד bezeichnet Kleidungsstücke. »Kleider« wahrt den hebräischen Plural und den maskulinen Singularbezug des Suffixes.
- source_word: וְהָאֹכֵל
  choice: und wer … isst
  rationale: Auch dieses substantivierte Partizip hat allgemeinen rechtlichen Sinn. »Wer … isst« ist eine natürliche deutsche Entsprechung.
theological_decisions:
- issue: Wiedergabe der generisch gebrauchten maskulinen Singularformen in der Rechtsvorschrift
  choice: »wer … seine Kleider«
  alternative: »wer … die eigene Kleidung«
  rationale: Das Hebräische verwendet maskuline Singularpartizipien und ein maskulines Singularsuffix mit allgemeinem Geltungsbereich. Die Übersetzung wahrt diese grammatische Form, ohne den Anwendungsbereich ausdrücklich auf Männer zu beschränken.
translation_notes:
  register: Moderner, würdiger Gesetzesstil. »Muss« macht die verbindliche Vorschrift deutlich; der parallele Satzbau des Hebräischen bleibt erhalten.
