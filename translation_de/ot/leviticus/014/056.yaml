id: LEV.14.56
reference: Leviticus 14:56
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/לַ/שְׂאֵ֥ת וְ/לַ/סַּפַּ֖חַת וְ/לַ/בֶּהָֽרֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/056.yaml
  text: and for a swelling[a], and for a scab[b], and for a bright spot.
translation:
  language: de
  text: und für eine Schwellung, einen Hautausschlag[a] und einen hellen Fleck[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Schorf“, „Ausschlag“ oder „schuppige Stelle“; die genaue Art der Hautveränderung ist ungewiss.
    reason: lexical_alternative
  - marker: b
    text: Oder „glänzender Fleck“; im Zusammenhang möglicherweise „weißer Fleck“.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאֵת
  choice: Schwellung
  rationale: Das Wort bezeichnet in Levitikus 13–14 eine erhabene Hautveränderung. „Schwellung“ ist knapp, verständlich und diagnostisch zurückhaltend.
- source_word: סַפַּחַת
  choice: Hautausschlag
  rationale: Der genaue dermatologische Befund ist unsicher. „Hautausschlag“ gibt den allgemeinen Sinn einer Hautveränderung natürlicher wieder als das enger gefasste „Schorf“.
- source_word: בֶּהֶרֶת
  choice: heller Fleck
  rationale: Das Substantiv bezeichnet einen hellen beziehungsweise auffälligen Fleck auf der Haut. „Heller Fleck“ bewahrt den Bezug zur Helligkeit, ohne die Farbe vorschnell als weiß festzulegen.
- source_word: וְ/לַ
  choice: und für
  rationale: Die Verbindung führt weitere Gegenstände der vorausgehenden gesetzlichen Zusammenfassung an. Im Deutschen muss „für“ nicht vor jedem Glied wiederholt werden.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Gesetzesstil. Die knappe Listenform des Hebräischen bleibt erhalten; die dermatologischen Begriffe werden nicht mit modernen Diagnosen gleichgesetzt.
