  text: וְ/אִם יָשׁ֤וּב הַ/נֶּ֨גַע֙ וּ/פָרַ֣ח בַּ/בַּ֔יִת אַחַ֖ר חִלֵּ֣ץ אֶת הָ/אֲבָנִ֑ים וְ/אַחֲרֵ֛י הִקְצ֥וֹת אֶת הַ/בַּ֖יִת וְ/אַחֲרֵ֥י הִטּֽוֹחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/043.yaml
  text: But if the disease returns and breaks out in the house after he has removed the stones[a], and after he has scraped the house, and after it has been plastered,
translation:
  language: de
  text: Wenn aber der Befall[a] zurückkehrt und im Haus ausbricht, nachdem man die Steine entfernt, das Haus abgeschabt und verputzt hat,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „der Schaden“ oder „die Plage“. Das hebräische negaʿ ist im Levitikus ein Fachausdruck für einen auffälligen Befund, der Menschen, Kleidungsstücke oder Häuser betreffen kann.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Wenn aber
  rationale: Leitet die Fortsetzung des Rechtsfalls als Bedingung ein und gibt zugleich den kontrastierenden Anschluss natürlich wieder.
- source_word: יָשׁוּב הַנֶּגַע
  choice: der Befall zurückkehrt
  rationale: שוב bezeichnet hier das erneute Auftreten; „Befall“ eignet sich für den technischen, auch Gebäude betreffenden Gebrauch von נגע, ohne eine menschliche Krankheit vorauszusetzen.
- source_word: וּפָרַח
  choice: sich wieder ausbreitet
  rationale: Das Verb bedeutet bildlich „aussprossen/ausbrechen“ und bezeichnet hier das erneute Hervortreten beziehungsweise Ausgreifen des Befalls. „Wieder“ verdeutlicht zusammen mit „zurückkehrt“ die Wiederholung, ohne die Bildlichkeit unnatürlich nachzuahmen.
- source_word: בַּבַּיִת
  choice: im Haus
  rationale: Die Präposition ist lokativ; „im Haus“ ist im Deutschen die natürliche Formulierung.
- source_word: אַחַר חִלֵּץ אֶת הָאֲבָנִים
  choice: nachdem man die Steine entfernt ... hat
  rationale: Das unbestimmte „man“ gibt den nicht ausdrücklich genannten Handelnden wieder; „entfernt“ bezeichnet den vorgeschriebenen Ausbau der betroffenen Steine klar.
- source_word: וְאַחֲרֵי הִקְצוֹת אֶת הַבַּיִת
  choice: das Haus abgeschabt
  rationale: Das Verb bezeichnet das Abkratzen beziehungsweise Abschaben der Oberflächen; die konkrete bauliche Maßnahme bleibt erhalten.
- source_word: וְאַחֲרֵי הִטּוֹחַ
  choice: und neu verputzt hat
  rationale: טוח bezeichnet das Bestreichen beziehungsweise Verputzen. „Neu“ ist aus der Abfolge nach dem Abschaben erschließbar und macht den Vorgang idiomatisch deutlich; das Haus wird als im Hebräischen ausgelassenes Objekt aus dem Kontext ergänzt.
theological_decisions: []
translation_notes:
  register: Moderne, sachliche und würdige Rechtssprache. Der technische Ausdruck נגע wird mit „Befall“ wiedergegeben, da der Zustand ein Haus betrifft und „Krankheit“ im Deutschen missverständlich wäre. Die dreifache hebräische Nachher-Konstruktion wird zu einem flüssigen deutschen Nebensatz gebündelt; das abschließende Komma bewahrt den offenen Satzanschluss an Vers 44.
