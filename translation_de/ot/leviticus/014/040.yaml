source:
  edition: WLC
  text: וְ/צִוָּה֙ הַ/כֹּהֵ֔ן וְ/חִלְּצוּ֙ אֶת הָ֣/אֲבָנִ֔ים אֲשֶׁ֥ר בָּ/הֵ֖ן הַ/נָּ֑גַע וְ/הִשְׁלִ֤יכוּ אֶתְ/הֶן֙ אֶל מִ/ח֣וּץ לָ/עִ֔יר אֶל מָק֖וֹם טָמֵֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/040.yaml
  text: then the priest shall command that they remove the stones in which the infection is[a], and throw them outside the city to an unclean place.
translation:
  language: de
  text: Dann soll der Priester anordnen, dass man die Steine, in denen der Befall ist[a], entfernt und sie außerhalb der Stadt an einen unreinen Ort wirft.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Steine, an denen der Befall auftritt“. Wörtlich: „die Steine, in denen der Befall ist“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוָּה הַכֹּהֵן
  choice: Dann soll der Priester anordnen
  rationale: Das mit וְ fortgeführte Perfekt beschreibt den nächsten Schritt der Ritualanweisung. „Dann“ gibt die Abfolge natürlich wieder; „soll … anordnen“ bewahrt den verbindlichen Charakter.
- source_word: וְחִלְּצוּ אֶת הָאֲבָנִים
  choice: dass man die Steine … entfernt
  rationale: חלץ bezeichnet hier das Herausnehmen der betroffenen Steine aus dem Mauerwerk. „Entfernt“ ist präzise, ohne eine bestimmte Arbeitsweise wie das Herausbrechen ausdrücklich in den Text einzutragen. Das unbestimmte „man“ entspricht dem nicht näher bezeichneten Subjekt der hebräischen Pluralform.
- source_word: אֲשֶׁר בָּהֵן הַנָּגַע
  choice: in denen der Befall ist
  rationale: Die Formulierung folgt der räumlichen Aussage des Hebräischen eng. „Befall“ bezeichnet die schädigende Erscheinung am Haus, ohne sie vorschnell mit einer modernen medizinischen oder baubiologischen Diagnose gleichzusetzen.
- source_word: וְהִשְׁלִיכוּ אֶתְהֶן
  choice: und sie … wirft
  rationale: „Werfen“ ist die natürliche moderne Entsprechung von השליך; das Pronomen bezieht sich eindeutig auf die Steine.
- source_word: אֶל מִחוּץ לָעִיר
  choice: außerhalb der Stadt
  rationale: Die Wendung bezeichnet eine Bewegung an einen Ort jenseits der Stadtgrenze. Die deutsche Formulierung ist idiomatisch und wahrt die räumliche Aussage.
- source_word: אֶל מָקוֹם טָמֵא
  choice: an einen unreinen Ort
  rationale: „Unrein“ gibt den feststehenden kultischen Reinheitsbegriff טמא in Levitikus wieder und vermeidet eine bloß hygienische Deutung.
theological_decisions:
- issue: Bezeichnung der schädigenden Erscheinung am Haus
  choice: Befall
  alternative: Plage; Aussatz; Schimmel; Schadstelle
  rationale: נגע bezeichnet im Kontext von Levitikus 13–14 eine verunreinigende Erscheinung an Menschen, Textilien oder Häusern, ohne eine moderne Diagnose festzulegen. „Befall“ ist im Hauskontext verständlich und lässt die genaue Art der Erscheinung offen.
- issue: Wiedergabe der levitischen Reinheitskategorie
  choice: unrein
  alternative: verunreinigt; kultisch unrein
  rationale: „Unrein“ bewahrt die kultisch-rechtliche Kategorie des hebräischen טמא. Ein Zusatz wie „kultisch“ würde erklären, was der Ausgangstext hier nicht eigens ausspricht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt verfahrensorientiert und gut verständlich; zentrale Reinheitsterminologie und die Unbestimmtheit der Erscheinung am Haus werden bewahrt.
