  text: וּ/מִן הַ/שֶּׁ֖מֶן יִצֹ֣ק הַ/כֹּהֵ֑ן עַל כַּ֥ף הַ/כֹּהֵ֖ן הַ/שְּׂמָאלִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/026.yaml
  text: And from the oil the priest shall pour onto the palm of his own left hand[a].
translation:
  language: de
  text: Dann gießt der Priester von dem Öl auf seine linke Handfläche.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „auf die Handfläche des Priesters, die linke“.'
    reason: Die Fußnote dokumentiert die ungewöhnliche hebräische Konstruktion, die im Haupttext idiomatisch als „seine linke Handfläche“ wiedergegeben ist.
lexical_decisions:
- source_word: וּ/מִן הַ/שֶּׁמֶן
  choice: Dann … etwas von dem Öl
  rationale: Das Präfix ו führt den nächsten Schritt der Ritualhandlung fort; im Deutschen ist „Dann“ dafür natürlich. מִן bezeichnet die Entnahme aus der vorhandenen Ölmenge. „Etwas“ ist durch den Vorgang sachlich vorausgesetzt und ergibt eine idiomatische deutsche Formulierung.
- source_word: יִצֹק
  choice: gießt
  rationale: Das Yiqtol beschreibt innerhalb der Ritualanweisung die auszuführende Handlung. Das deutsche Präsens ist in Gesetzes- und Verfahrensanweisungen natürlich und verbindlich.
- source_word: הַ/כֹּהֵן
  choice: der Priester
  rationale: Die übliche und sachlich genaue Wiedergabe von כֹּהֵן im kultischen Zusammenhang.
- source_word: עַל כַּף
  choice: auf … Handfläche
  rationale: עַל bezeichnet hier das Ziel des Gießens; כַּף meint genauer die Innen- beziehungsweise Hohlfläche der Hand und wird daher mit „Handfläche“ wiedergegeben.
- source_word: הַ/כֹּהֵן הַ/שְּׂמָאלִית
  choice: seine linke Handfläche
  rationale: Der hebräische Wortlaut lautet formal „die Handfläche des Priesters, die linke“. Das reflexive Possessiv „seine“ vermeidet im Deutschen eine schwerfällige Wiederholung und macht deutlich, dass die eigene linke Handfläche des handelnden Priesters gemeint ist.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Verfahrenssprache des Ritualgesetzes bleibt erhalten; das Präsens entspricht natürlicher deutscher Anweisungssprache.
