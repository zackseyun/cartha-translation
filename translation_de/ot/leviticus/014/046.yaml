source:
  edition: WLC
  text: וְ/הַ/בָּא֙ אֶל הַ/בַּ֔יִת כָּל יְמֵ֖י הִסְגִּ֣יר אֹת֑/וֹ יִטְמָ֖א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/046.yaml
  text: And whoever enters the house during all the days that it is quarantined shall be unclean until the evening[a].
translation:
  language: de
  text: Wer das Haus betritt, solange es abgesperrt ist[a], wird bis zum Abend unrein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »solange es verschlossen gehalten wird« beziehungsweise »solange es abgesondert ist«. Das hebräische Wort bezeichnet hier die angeordnete Sperrung des Hauses zur priesterlichen Prüfung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/בָּא
  choice: Wer … betritt
  rationale: Der substantivierte Partizipialausdruck bezeichnet allgemein jeden, der das Haus betritt; die deutsche Wer-Konstruktion gibt diese allgemeine Rechtsbestimmung natürlich wieder.
- source_word: אֶל הַ/בַּיִת
  choice: das Haus betritt
  rationale: Bei בוא mit אֶל bezeichnet die Wendung das Hineingehen in das Haus; »das Haus betreten« drückt dies im Deutschen idiomatisch aus.
- source_word: כָּל יְמֵי
  choice: solange
  rationale: Die Wendung umfasst die gesamte Dauer der angeordneten Absperrung. »Solange« gibt diesen zeitlichen Umfang knapp und natürlich wieder.
- source_word: הִסְגִּיר אֹת/וֹ
  choice: es abgesperrt ist
  rationale: סגר bezeichnet hier die amtlich angeordnete Absonderung beziehungsweise Sperrung des Hauses zur priesterlichen Prüfung. »Abgesperrt« vermeidet die primär medizinische Färbung von »unter Quarantäne« und passt auf ein Gebäude.
- source_word: יִטְמָא
  choice: wird … unrein
  rationale: Das Verb bezeichnet den Eintritt beziehungsweise Bestand ritueller Unreinheit; der deutsche Rechtssatz wird mit »wird unrein« klar und gegenwärtig formuliert.
- source_word: עַד הָ/עָרֶב
  choice: bis zum Abend
  rationale: Dies ist die übliche deutsche Wiedergabe der zeitlichen Begrenzung vorübergehender ritueller Unreinheit.
theological_decisions:
- issue: Art der Unreinheit
  choice: unrein
  alternative: kultisch unrein
  rationale: Der Kontext des Heiligkeitsgesetzes macht die kultisch-rituelle Bedeutung deutlich. Der schlichte biblische Terminus bewahrt zugleich die Ausdrucksweise des Ausgangstextes, ohne eine erklärende Deutung in den Haupttext einzufügen.
translation_notes:
  register: Moderner, würdiger Rechtssatz in allgemein verständlichem Standarddeutsch. Die knappe Wer-Konstruktion und »solange« vermeiden schwerfällige Nominalformulierungen; »abgesperrt« wahrt den sachlichen Bezug auf das Haus und die amtliche Isolation.
