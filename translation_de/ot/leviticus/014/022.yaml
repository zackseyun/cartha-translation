source:
  edition: WLC
  text: וּ/שְׁתֵּ֣י תֹרִ֗ים א֤וֹ שְׁנֵי֙ בְּנֵ֣י יוֹנָ֔ה אֲשֶׁ֥ר תַּשִּׂ֖יג יָד֑/וֹ וְ/הָיָ֤ה אֶחָד֙ חַטָּ֔את וְ/הָ/אֶחָ֖ד עֹלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/022.yaml
  text: and two turtledoves or two young pigeons[a], as his means can afford; and one shall be a sin offering and the other a burnt offering.
translation:
  language: de
  text: Und zwei Turteltauben oder zwei junge Tauben, die er sich leisten kann; die eine soll ein Sündopfer[a] und die andere ein Brandopfer sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Reinigungsopfer«. Der hebräische Begriff kann in rituellen Zusammenhängen ein Opfer zur Reinigung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁתֵּי תֹרִים
  choice: und zwei Turteltauben
  rationale: Die Wendung setzt die Opferliste aus dem vorherigen Vers fort; תֹרִים bezeichnet spezifisch Turteltauben.
- source_word: אוֹ שְׁנֵי בְּנֵי יוֹנָה
  choice: oder zwei junge Tauben
  rationale: Die hebräische Wendung bezeichnet junge Tauben; die Altersangabe bleibt erhalten.
- source_word: אֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: die er sich leisten kann
  rationale: Die wörtliche Rede vom Erreichen der Hand ist ein Idiom für die wirtschaftlichen Möglichkeiten einer Person.
- source_word: וְהָיָה אֶחָד ... וְהָאֶחָד
  choice: Die eine soll ... und die andere ... sein
  rationale: Die feminine Form im Deutschen bezieht sich natürlich auf die beiden Tauben und gibt die Verteilung der Opferfunktionen klar wieder.
- source_word: חַטָּאת
  choice: Sündopfer
  rationale: Dies ist die geläufige deutsche Bezeichnung des Opfertyps; der in diesem Ritual ebenfalls wichtige Reinigungsaspekt wird in der Fußnote bewahrt.
- source_word: עֹלָה
  choice: Brandopfer
  rationale: Die etablierte deutsche Kultbezeichnung gibt das vollständig verbrannte Opfer natürlich und präzise wieder.
theological_decisions:
- issue: Wiedergabe von חַטָּאת im levitischen Reinigungsritual
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: חַטָּאת ist die traditionelle Bezeichnung für diesen Opfertyp, kann im vorliegenden rituellen Zusammenhang aber besonders dessen reinigende Funktion hervorheben. Die Alternative wird deshalb in einer Fußnote genannt, ohne die Spannung einseitig aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die idiomatische Aussage zur wirtschaftlichen Leistungsfähigkeit wird verständlich wiedergegeben; die kultischen Fachbegriffe bleiben knapp und traditionsnah.
