id: LEV.14.23
reference: Leviticus 14:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הֵבִ֨יא אֹתָ֜/ם בַּ/יּ֧וֹם הַ/שְּׁמִינִ֛י לְ/טָהֳרָת֖/וֹ אֶל הַ/כֹּהֵ֑ן אֶל פֶּ֥תַח אֹֽהֶל מוֹעֵ֖ד לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/023.yaml
  text: And on the eighth day he shall bring them for his cleansing to the priest[a], at the entrance of the tent of meeting, before Yahweh.
translation:
  language: de
  text: Am achten Tag soll er sie zu seiner Reinigung zum Priester bringen, an den Eingang des Zeltes der Begegnung, vor Jahwe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵבִיא
  choice: soll er … bringen
  rationale: Die Verbform hat im gesetzlichen Anweisungskontext vorschreibende Kraft; die deutsche Soll-Form gibt dies natürlich wieder.
- source_word: אֹתָם
  choice: sie
  rationale: Das maskuline Pluralobjekt verweist auf die im vorherigen Vers genannten Opfergaben.
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: Am achten Tag
  rationale: Idiomat.Traditionelle und genaue Wiedergabe der Zeitangabe.
- source_word: לְטָהֳרָתוֹ
  choice: zu seiner Reinigung
  rationale: Bezeichnet hier den rituellen Reinigungsvorgang beziehungsweise dessen Vollzug; „Reinigung“ ist verständlich und wahrt den kultischen Zusammenhang.
- source_word: אֶל הַכֹּהֵן
  choice: zum Priester
  rationale: Gibt die gerichtete Bewegung zum Priester knapp und idiomatisch wieder.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: an den Eingang des Zeltes der Begegnung
  rationale: Das wiederholte אֶל bezeichnet das Ziel des Bringens. „Zelt der Begegnung“ ist eine transparente, sachgemäße Wiedergabe von אֹהֶל מוֹעֵד.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: Bewahrt die geläufige kultische Wendung und gibt das Tetragramm als persönlichen Gottesnamen wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst; „Jahwe“ gibt ihn im Deutschen als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Rituelle Bedeutung von לְטָהֳרָתוֹ
  choice: zu seiner Reinigung
  alternative: zu seiner Reinsprechung / zu seiner rituellen Reinigung
  rationale: „Reinigung“ wahrt den rituellen Bezug, ohne eine moralische Verunreinigung zu unterstellen oder den Ausdruck unnötig technisch zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung folgt dem hebräischen Verfahrensablauf, bleibt aber natürlich lesbar. Keine Fußnote ist nötig, da „Reinigung“ den kultischen Sinn im Kontext hinreichend trägt.
