id: LEV.14.11
reference: Leviticus 14:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הֶעֱמִ֞יד הַ/כֹּהֵ֣ן הַֽ/מְטַהֵ֗ר אֵ֛ת הָ/אִ֥ישׁ הַ/מִּטַּהֵ֖ר וְ/אֹתָ֑/ם לִ/פְנֵ֣י יְהוָ֔ה פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/011.yaml
  text: And the priest who cleanses shall present the man who is being cleansed, along with those things, before Yahweh at the entrance of the tent of meeting.
translation:
  language: de
  text: Und der Priester, der die Reinigung vollzieht, soll den Mann, der gereinigt wird, und diese Dinge vor Jahwe an den Eingang des Zeltes der Begegnung stellen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֶעֱמִיד
  choice: soll … stellen
  rationale: Der Hifil von עמד bedeutet hier, jemanden oder etwas in einem rituellen Zusammenhang vor Jahwe treten beziehungsweise aufstellen zu lassen. „Vor Jahwe … stellen“ bewahrt das konkrete Bild und klingt im Deutschen natürlich.
- source_word: הַכֹּהֵן הַמְטַהֵר
  choice: der Priester, der die Reinigung vollzieht
  rationale: Das Partizip bezeichnet die amtliche Mitwirkung des Priesters am Reinigungsritus. Diese Wiedergabe vermeidet den Eindruck, es gehe um moralische Reinigung oder lediglich um eine Reinheitserklärung.
- source_word: הָאִישׁ הַמִּטַּהֵר
  choice: den Mann, der gereinigt wird
  rationale: „Mann“ entspricht dem ausdrücklich maskulinen אִישׁ. Das Hitpael-Partizip beschreibt hier denjenigen, der den rituellen Reinigungsprozess durchläuft.
- source_word: וְאֹתָם
  choice: und diese Dinge
  rationale: Das maskuline Pluralpronomen verweist im Zusammenhang auf die in Vers 10 genannten Opfergaben und Gegenstände, nicht auf weitere Personen. Die explizite Wiedergabe verhindert im Deutschen ein missverständliches „sie“.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: Die kultische Wendung bezeichnet das Darbringen in Jahwes Gegenwart. Der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: an den Eingang des Zeltes der Begegnung
  rationale: Die Formulierung bezeichnet den Zugang zum Heiligtumszelt. „Zelt der Begegnung“ gibt den etablierten kultischen Ausdruck verständlich und nah am Hebräischen wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Rolle des Priesters bei der Reinigung
  choice: der die Reinigung vollzieht
  alternative: der reinigt
  rationale: Die gewählte Formulierung beschreibt die rituelle Amtsfunktion des Priesters, ohne weitergehend festzulegen, auf welche Weise er die Reinheit bewirkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die hebräische Satzstruktur. Der kultische Fachausdruck „Zelt der Begegnung“ und der Gottesname „Jahwe“ werden beibehalten; unnötige kirchliche oder konfessionelle Terminologie wird vermieden.
