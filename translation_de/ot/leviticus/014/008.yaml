  text: וְ/כִבֶּס֩ הַ/מִּטַּהֵ֨ר אֶת בְּגָדָ֜י/ו וְ/גִלַּ֣ח אֶת כָּל שְׂעָר֗/וֹ וְ/רָחַ֤ץ בַּ/מַּ֨יִם֙ וְ/טָהֵ֔ר וְ/אַחַ֖ר יָב֣וֹא אֶל הַֽ/מַּחֲנֶ֑ה וְ/יָשַׁ֛ב מִ/ח֥וּץ לְ/אָהֳל֖/וֹ שִׁבְעַ֥ת יָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/008.yaml
  text: The one being cleansed shall wash his clothes[a], shave off all his hair, and bathe in water; then he shall be clean. Afterward he may come into the camp[b], but he shall stay outside his tent for seven days.
translation:
  language: de
  text: Derjenige, der gereinigt wird, soll seine Kleider waschen, sich alle seine Haare abscheren und sich im Wasser waschen; dann ist er rein. Danach darf er ins Lager kommen[a], muss aber sieben Tage außerhalb seines Zeltes bleiben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Danach soll er ins Lager kommen.“ Die hebräische Verbform kann eine bevorstehende beziehungsweise angeordnete Handlung oder, wie hier im Zusammenhang verstanden, die Erlaubnis zur Rückkehr ausdrücken.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַמִּטַּהֵר
  choice: derjenige, der gereinigt wird
  rationale: Das Hitpael-Partizip bezeichnet hier die Person, die sich im vorgeschriebenen rituellen Reinigungsprozess befindet. Die Formulierung wahrt diesen Vorgangs- und Ritualbezug.
- source_word: כִבֶּס ... בְּגָדָיו
  choice: soll seine Kleider waschen
  rationale: כִּבֵּס bezeichnet gewöhnlich das Waschen von Textilien; „Kleider waschen“ ist im modernen Deutsch natürlich und genau.
- source_word: גִלַּח אֶת כָּל שְׂעָרוֹ
  choice: sein gesamtes Haar abscheren
  rationale: Die Verbindung mit כָּל fordert die vollständige Entfernung des Körperhaars. „abscheren“ gibt die umfassende Rasur knapp und würdig wieder.
- source_word: רָחַץ בַּמַּיִם
  choice: sich mit Wasser baden
  rationale: Im rituellen Zusammenhang ist die Waschung des Körpers gemeint. Die Wiedergabe unterscheidet sie klar vom vorausgehenden Waschen der Kleider.
- source_word: וְטָהֵר
  choice: dann ist er rein
  rationale: Die Klausel bezeichnet den daraus folgenden rituellen Status. „dann“ macht die Abfolge deutlich, ohne eine moralische Reinigung hineinzulesen.
- source_word: יָבֹא אֶל הַמַּחֲנֶה
  choice: darf er ins Lager kommen
  rationale: Der folgende Vorbehalt zeigt, dass die Rückkehr ins Lager nun gestattet ist, obwohl der Betroffene noch nicht in seinem Zelt wohnen darf. Die modale Deutung bleibt in einer Fußnote als nicht einzig mögliche Lesart ausgewiesen.
- source_word: וְיָשַׁב מִחוּץ לְאָהֳלוֹ
  choice: muss aber ... außerhalb seines Zeltes bleiben
  rationale: יָשַׁב bezeichnet hier einen zeitweiligen Aufenthalt. „aber“ verdeutlicht den sachlichen Gegensatz zwischen der Rückkehr ins Lager und der fortbestehenden Einschränkung.
- source_word: שִׁבְעַת יָמִים
  choice: sieben Tage
  rationale: Die bloße Zeitangabe ist im Deutschen auch ohne zusätzliche Präposition idiomatisch und eindeutig.
theological_decisions:
- issue: Charakter der Reinheitsbegriffe טהר und מטהר
  choice: „gereinigt“ und „rein“ als Bezeichnungen des rituellen Status
  alternative: „geläutert“ und „lauter“ beziehungsweise „gereinigt“ im moralischen Sinn
  rationale: Der Zusammenhang betrifft die kultisch geregelte Wiederaufnahme nach einer Hauterkrankung, nicht ausdrücklich innere oder moralische Läuterung.
- issue: Modalität von יָבֹא
  choice: 'permissiv: „darf ... kommen“'
  alternative: 'schlicht futurisch beziehungsweise anordnend: „soll ... kommen“'
  rationale: Die anschließende Einschränkung legt die Erlaubnis zur Rückkehr ins Lager nahe; die grammatisch mögliche nichtpermissive Lesart wird jedoch nicht verschwiegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Gesetzesstil. Die rituelle Bedeutung von Reinheit bleibt erhalten; unnötig altertümliche Wörter werden vermieden. Der einzige Fußnotenmarker [a] steht unmittelbar bei der von der Alternative betroffenen Formulierung.
