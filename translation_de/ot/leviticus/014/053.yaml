base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/053.yaml
  text: Then he shall release the live bird outside the city into the open field. Thus he shall make atonement for the house[a], and it shall be clean.
translation:
  language: de
  text: Dann soll er den lebenden Vogel außerhalb der Stadt ins freie Feld freilassen. So soll er für das Haus Sühne erwirken[a], und es wird rein sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Haus entsühnen“ beziehungsweise im rituellen Zusammenhang „das Haus reinigen“. Das Hebräische verwendet hier die priesterliche Sprache der Sühne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּח
  choice: Dann soll er … freilassen
  rationale: Das Piel von שלח bezeichnet hier das rituelle Freilassen des Vogels. „Dann“ gibt die Handlungsfolge des Waw natürlich wieder.
- source_word: הַצִּפֹּר הַחַיָּה
  choice: den lebenden Vogel
  rationale: Die Formulierung hebt den Gegensatz zu dem zuvor getöteten Vogel hervor und ist im Deutschen klar und knapp.
- source_word: אֶל מִחוּץ לָעִיר
  choice: außerhalb der Stadt
  rationale: Die Präpositionalverbindung bezeichnet einen Ort jenseits der Stadtgrenze; die deutsche Wendung gibt dies natürlich wieder.
- source_word: אֶל פְּנֵי הַשָּׂדֶה
  choice: ins freie Feld
  rationale: Die hebräische Wendung meint die offene Feldflur beziehungsweise das freie Land; eine wörtliche Wiedergabe mit „vor das Angesicht des Feldes“ wäre im Deutschen missverständlich.
- source_word: וְכִפֶּר עַל הַבַּיִת
  choice: So soll er für das Haus Sühne schaffen
  rationale: כפר gehört zur priesterlichen Sühneterminologie. Die Wiedergabe bewahrt bewusst die auffällige Anwendung auf ein Haus, ohne sie auf bloße Reinigung zu verengen.
- source_word: וְטָהֵר
  choice: und es wird rein sein
  rationale: טהר bezeichnet hier den daraus folgenden Reinheitsstatus des Hauses. Das ausdrücklich gesetzte „es“ macht den Bezug im Deutschen eindeutig.
theological_decisions:
- issue: Wiedergabe von כפר bei einem rituell zu reinigenden Haus
  choice: für das Haus Sühne schaffen
  alternative: das Haus entsühnen / das Haus von Verunreinigung befreien
  rationale: Der Text verwendet auch für das Haus priesterliche Sühnesprache. Die Hauptübersetzung erhält diese theologische Spannung; die Fußnote nennt mögliche kontextbezogene Wiedergaben, ohne eine bestimmte Sühnetheorie einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt nah am hebräischen Ritualablauf; „ins freie Feld“ gibt die hebräische Ortswendung idiomatisch wieder.
