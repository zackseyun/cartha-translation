base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/036.yaml
  text: Then the priest shall command that they empty the house before the priest goes in to inspect the diseased area[a], so that everything in the house may not become unclean; and afterward the priest shall go in to inspect the house.
translation:
  language: de
  text: Dann soll der Priester anordnen, dass man das Haus ausräumt, bevor der Priester hineingeht, um die befallene Stelle[a] zu untersuchen, damit nicht alles, was im Haus ist, unrein wird. Danach soll der Priester hineingehen, um das Haus zu untersuchen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Befall«, »das Mal«; traditionell auch: »die Plage«. Das hebräische Wort negaʿ bezeichnet die betroffene Stelle oder den Zustand, den der Priester untersucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוָּה
  choice: Dann soll ... anordnen
  rationale: Das Waw mit Perfekt setzt in der Verfahrensanweisung den nächsten Schritt fort; »Dann soll« gibt diese Abfolge im Deutschen natürlich wieder.
- source_word: וּפִנּוּ אֶת הַבַּיִת
  choice: dass man das Haus ausräumt
  rationale: Das pluralische Verb hat ein unbestimmtes Subjekt. »Man« bewahrt diese Unbestimmtheit; »ausräumen« bezeichnet hier treffend das Entfernen des Hausrats.
- source_word: בְּטֶרֶם
  choice: bevor
  rationale: Klare und natürliche Wiedergabe der temporalen Beziehung.
- source_word: לִרְאוֹת
  choice: zu untersuchen
  rationale: Das Verb bedeutet wörtlich »sehen«, bezeichnet hier jedoch die amtliche Prüfung durch den Priester.
- source_word: הַנֶּגַע
  choice: die befallene Stelle
  rationale: נֶגַע bezeichnet in diesem Zusammenhang die sichtbare betroffene Stelle beziehungsweise den Befall, ohne eine moderne medizinische Diagnose festzulegen.
- source_word: וְלֹא יִטְמָא
  choice: So wird ... nicht ... unrein
  rationale: Die Klausel nennt den beabsichtigten beziehungsweise vermiedenen Ausgang des vorherigen Ausräumens und wahrt die levitische Reinheitsterminologie.
- source_word: כָּל אֲשֶׁר בַּבָּיִת
  choice: alles, was im Haus ist
  rationale: Formnah und zugleich idiomatisch; gemeint ist der gesamte Inhalt des Hauses.
- source_word: וְאַחַר כֵּן
  choice: Danach
  rationale: Markiert knapp den folgenden Verfahrensschritt.
- source_word: לִרְאוֹת אֶת הַבָּיִת
  choice: um das Haus zu untersuchen
  rationale: Der Gegenstand der abschließenden Untersuchung ist ausdrücklich das Haus als Ganzes.
theological_decisions:
- issue: Terminologie ritueller Unreinheit
  choice: unrein werden
  alternative: verunreinigt werden; kultisch unrein werden
  rationale: טמא bezeichnet hier rituelle Unreinheit, nicht notwendig moralische Schuld. »Unrein werden« entspricht der etablierten levitischen Begrifflichkeit, ohne eine konfessionelle Deutung hinzuzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge wurde für gute Verständlichkeit in drei Sätze gegliedert; die rechtlich-rituelle Verfahrensstruktur und die Wiederholung des Priesters bleiben erhalten.
