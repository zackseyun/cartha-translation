base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/044.yaml
  text: then the priest shall come and inspect[a], and if indeed the infection has spread in the house, it is a destructive mildew in the house[b]; it is unclean.
translation:
  language: de
  text: Dann soll der Priester kommen und das Haus untersuchen. Wenn sich der Befall tatsächlich im Haus ausgebreitet hat, ist es ein zerstörerischer Zaraat-Befall[a] im Haus; das Haus ist unrein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch zaraat. Der Ausdruck bezeichnet in 3. Mose eine kultisch verunreinigende Befallserscheinung an Menschen, Textilien oder Häusern. Er darf hier weder mit moderner Lepra noch sicher mit Schimmel gleichgesetzt werden. Das zugehörige Eigenschaftswort kann auch mit „bösartig“ oder „hartnäckig“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  choice: Dann soll … kommen
  rationale: Das Waw mit Qatal setzt in diesem gesetzlichen Verfahrensablauf den nächsten vorgeschriebenen Schritt fort.
- source_word: וְרָאָה
  choice: das Haus untersuchen
  rationale: Wörtlich bedeutet das Verb „sehen“; hier bezeichnet es die fachliche Begutachtung durch den Priester. Das ergänzte Objekt ergibt sich eindeutig aus dem Zusammenhang.
- source_word: וְהִנֵּה
  choice: Wenn … tatsächlich
  rationale: Die Wendung führt in diesem Prüfverfahren den festgestellten Befund ein; „tatsächlich“ bewahrt ihren hervorhebenden, evidenziellen Sinn.
- source_word: פָּשָׂה הַנֶּגַע
  choice: sich der Befall … ausgebreitet hat
  rationale: Das Verb bezeichnet bei solchen Schadenserscheinungen deren Ausbreitung; „Befall“ vermeidet eine ungesicherte medizinische oder biologische Diagnose.
- source_word: צָרַעַת מַמְאֶרֶת
  choice: ein bösartiger Zaraat-Befall
  rationale: צָרַעַת ist eine kultisch bestimmte Befallskategorie, die Menschen, Textilien und Häuser betreffen kann, und keine eindeutige moderne Diagnose. Das Lehnwort wahrt diese Breite; „bösartig“ gibt die ernste, fortschreitende Qualität von מַמְאֶרֶת wieder.
- source_word: בַּבָּיִת
  choice: am Haus
  rationale: Beim strukturellen Befall klingt im Deutschen „am Haus“ natürlicher als die wiederholte Formulierung „im Haus“, ohne den Bezug zum Gebäude zu verändern.
- source_word: טָמֵא הוּא
  choice: es ist unrein
  rationale: „Unrein“ ist die übliche und sachgerechte Wiedergabe des kultischen Status טָמֵא.
theological_decisions:
- issue: Bezeichnung von צָרַעַת bei einem Haus
  choice: Zaraat-Befall
  alternative: Aussatz; Schimmel; Hautkrankheit
  rationale: „Aussatz“ würde fälschlich eine bestimmte menschliche Krankheit nahelegen, „Hautkrankheit“ passt semantisch nicht zu einem Haus, und „Schimmel“ legt eine naturwissenschaftliche Identifikation fest, die der hebräische Text nicht liefert. Die transliterierte Kategorie mit dem erklärenden Wort „Befall“ erhält die kultische und sachliche Offenheit.
- issue: Modus des Verfahrenssatzes
  choice: gesetzliche Anweisung mit „soll“ und konditionalem Befund
  alternative: Vergangenheit als Erzählung
  rationale: Der Kontext enthält priesterliche Verfahrensvorschriften; daher ist die Satzfolge normativ und nicht als vergangenes Einzelereignis wiederzugeben.
- issue: Referent von „unrein“
  choice: Das Haus beziehungsweise der festgestellte Befall wird im Deutschen durch „es“ aufgenommen
  alternative: Der Priester oder Bewohner ist unrein
  rationale: Das maskuline hebräische Pronomen greift im unmittelbaren Satzgefüge das Haus beziehungsweise den daran festgestellten Zustand auf; eine Übertragung der Unreinheit auf Personen wäre unbegründet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Befall“ ist allgemein verständlich und diagnostisch zurückhaltend; das erklärte Lehnwort „Zaraat“ erhält die ungewöhnliche, im Hebräischen einheitliche Kategorie. Die Wiederholung des Hausbezugs wird wie im Ausgangstext beibehalten.
