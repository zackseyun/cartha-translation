  yaml_path: translation/ot/leviticus/014/005.yaml
  text: Then the priest shall command that one bird be slaughtered over an earthenware vessel containing fresh water[a].
translation:
  language: de
  text: Dann soll der Priester anordnen, dass der eine Vogel in ein Tongefäß über frischem Wasser[a] geschlachtet wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »lebendigem Wasser«, das heißt fließendem oder frischem Wasser.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוָּה
  choice: Dann soll … anordnen
  rationale: Das Waw mit Perfekt hat in dieser Verfahrensanweisung modale beziehungsweise futurische Kraft. „Dann“ gibt die Abfolge wieder, „soll … anordnen“ die autoritative Weisung.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Die übliche und sachgerechte Wiedergabe von כֹּהֵן im kultisch-rechtlichen Zusammenhang.
- source_word: וְשָׁחַט
  choice: dass … geschlachtet wird
  rationale: Die aktive hebräische Form steht nach dem Gebot des Priesters; im Deutschen lässt sich die angeordnete Handlung natürlich als passiver dass-Satz ausdrücken. „Schlachten“ bezeichnet die rituelle Tötung genauer als „töten“.
- source_word: אֶת הַצִּפּוֹר הָאֶחָת
  choice: der eine Vogel
  rationale: Der Ausdruck bestimmt einen der beiden zuvor genannten Vögel. „Der eine Vogel“ bewahrt diese individualisierende und kontrastierende Funktion.
- source_word: אֶל כְּלִי חֶרֶשׂ
  choice: über einem Tongefäß
  rationale: Im Zusammenhang des Schlachtens bezeichnet אֶל hier die Ausrichtung auf das Gefäß, in das das Blut gelangt. „Über einem Tongefäß“ ist im Deutschen anschaulich und passt zur folgenden Angabe des darin befindlichen Wassers.
- source_word: עַל מַיִם חַיִּים
  choice: mit frischem Wasser
  rationale: Wörtlich bedeutet die Wendung „lebendiges Wasser“ und bezeichnet hier nicht abgestandenes, frisch gewonnenes beziehungsweise fließendes Wasser. Mit der Gefäßangabe verbunden macht „mit“ deutlich, dass sich das Wasser im Gefäß befindet.
theological_decisions:
- issue: Wiedergabe von מַיִם חַיִּים im Reinigungsritual
  choice: frisches Wasser
  alternative: lebendiges Wasser; fließendes Wasser
  rationale: Die Wendung bezeichnet in diesem Zusammenhang Wasser aus einer lebendigen, nicht stehenden Quelle und nicht ausdrücklich eine spätere theologische Symbolik. Die verständliche Sachbedeutung steht im Haupttext; die wörtlichere, traditionsreiche Form bleibt in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt als kultische Verfahrensanweisung klar; traditionelle Fachsprache wird nur verwendet, wo sie allgemein verständlich ist.
