  source_fidelity: Die Richtungsangabe אֶל vor „Tongefäß“ ist im Entwurf als „über einem Tongefäß“ wiedergegeben. Dadurch wird die vom Hebräischen nahegelegte Beziehung der Schlachtung zum Gefäß verschoben. Die anschließende Wendung עַל מַיִם חַיִּים ist am besten als „über frischem/lebendigem Wasser“ beim Gefäß zu erhalten. Die passive Anordnungsform ist ansonsten angemessen.
  naturalness: „Dann soll der Priester anordnen, dass …“ ist modernes, klares Standarddeutsch. Die revidierte Stellung der Präpositionalgruppen ist in rituell-instruktivem Deutsch natürlich, auch wenn „in ein Tongefäß schlachten“ das kultische Verfahren knapp und konkret ausdrückt.
