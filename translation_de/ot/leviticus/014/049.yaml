  edition: WLC
  text: וְ/לָקַ֛ח לְ/חַטֵּ֥א אֶת הַ/בַּ֖יִת שְׁתֵּ֣י צִפֳּרִ֑ים וְ/עֵ֣ץ אֶ֔רֶז וּ/שְׁנִ֥י תוֹלַ֖עַת וְ/אֵזֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/049.yaml
  text: And he shall take, to purify the house from sin, two birds, cedar wood, scarlet yarn, and hyssop.
translation:
  language: de
  text: Dann soll er, um das Haus zu reinigen[a], zwei Vögel, Zedernholz, karmesinrotes Garn[b] und Ysop nehmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „zu entsündigen“. Das hebräische Verb bezeichnet hier die rituelle Reinigung des Hauses, also die Beseitigung seiner Unreinheit.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „karmesinroten Faden“ oder „Scharlachgarn“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Dann soll er … nehmen
  rationale: Das mit וְ verbundene Qal-Perfekt führt die Abfolge der Ritualvorschriften fort und hat hier verpflichtenden Sinn. „Dann soll er“ ist in modernem Deutsch natürlich und bildet sowohl die Abfolge als auch den Anweisungscharakter ab.
- source_word: לְחַטֵּא אֶת הַבַּיִת
  choice: um das Haus zu reinigen
  rationale: Das Piel von חטא bezeichnet mit einem Haus als Objekt die rituelle Reinigung beziehungsweise die Beseitigung von Unreinheit. „Reinigen“ ist verständlich und vermeidet, dem Haus moralische Schuld zuzuschreiben; die besondere kultische Bedeutung wird in Fußnote [a] bewahrt.
- source_word: שְׁתֵּי צִפֳּרִים
  choice: zwei Vögel
  rationale: Der Vers nennt schlicht zwei Vögel. Die in benachbarten Versen enthaltene nähere Bestimmung „lebend“ wird hier nicht ergänzt.
- source_word: וְעֵץ אֶרֶז
  choice: Zedernholz
  rationale: Die Verbindung bezeichnet Holz der Zeder; „Zedernholz“ ist die klare und übliche deutsche Wiedergabe.
- source_word: וּשְׁנִי תוֹלַעַת
  choice: karmesinrotes Garn
  rationale: Die feste Wortverbindung bezeichnet karmesinfarbenes beziehungsweise scharlachfarbenes Material, wohl Faden oder Garn. „Karmesinrotes Garn“ ist konkret, modern und für einen Ritualgegenstand natürlich.
- source_word: וְאֵזֹב
  choice: Ysop
  rationale: „Ysop“ ist die herkömmliche deutsche Bezeichnung. Obwohl die genaue botanische Identifizierung umstritten ist, sollte sie im Haupttext nicht spekulativ präzisiert werden.
theological_decisions:
- issue: Rituelle Bedeutung von לְחַטֵּא bei einem Haus als Objekt
  choice: „um das Haus zu reinigen“ mit erläuternder Fußnote
  alternative: „um das Haus zu entsündigen“ oder „um für das Haus Sühne zu erwirken“
  rationale: Im Zusammenhang von Levitikus 14 geht es um die kultische Reinigung eines befallenen Hauses, nicht um dessen moralische Vergebung. „Entsündigen“ spiegelt zwar die Wortwurzel deutlicher, klingt im heutigen Deutsch jedoch ungewöhnlich und kann missverstanden werden. „Sühne erwirken“ würde einen theologischen Mechanismus ausdrücklich machen, den dieser Infinitiv hier nicht eindeutig bezeichnet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzführung. Die Formulierung bleibt nahe an der hebräischen Ritualanweisung, ohne unnatürliche Fachsprache in den Haupttext zu zwingen. Sämtliche Fußnotenmarker stehen unmittelbar bei den erläuterten Ausdrücken.
