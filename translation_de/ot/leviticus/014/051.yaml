id: LEV.14.51
reference: Leviticus 14:51
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/לָקַ֣ח אֶת עֵֽץ הָ֠/אֶרֶז וְ/אֶת הָ֨/אֵזֹ֜ב וְ/אֵ֣ת שְׁנִ֣י הַ/תּוֹלַ֗עַת וְ/אֵת֮ הַ/צִּפֹּ֣ר הַֽ/חַיָּה֒ וְ/טָבַ֣ל אֹתָ֗/ם בְּ/דַם֙ הַ/צִּפֹּ֣ר הַ/שְּׁחוּטָ֔ה וּ/בַ/מַּ֖יִם הַֽ/חַיִּ֑ים וְ/הִזָּ֥ה אֶל הַ/בַּ֖יִת שֶׁ֥בַע פְּעָמִֽים־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/051.yaml
  text: Then he shall take the cedar wood[a], the hyssop, the scarlet yarn, and the living bird, and dip them in the blood of the slaughtered bird and in the fresh water[b], and sprinkle the house seven times.
translation:
  language: de
  text: Dann soll er das Zedernholz, den Ysop, den Scharlachfaden[a] und den lebenden Vogel nehmen, sie in das Blut des geschlachteten Vogels und in das frische Wasser[b] tauchen und das Haus siebenmal besprengen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch wörtlich „Scharlach des Wurms“; traditionell als scharlachrot gefärbter Faden oder als scharlachrote Wolle verstanden.
    reason: lexical_alternative
  - marker: b
    text: Hebräisch „lebendiges Wasser“, das heißt frisches oder fließendes Wasser.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Dann soll er … nehmen
  rationale: Die Verbform führt in diesem rituellen Anweisungstext den nächsten vorgeschriebenen Handlungsschritt ein; „soll“ gibt den verpflichtenden Charakter natürlich wieder.
- source_word: עֵץ הָאֶרֶז
  choice: das Zedernholz
  rationale: Die Verbindung bezeichnet Zedernholz als rituell verwendetes Material; die deutsche Zusammensetzung ist präzise und idiomatisch.
- source_word: הָאֵזֹב
  choice: den Ysop
  rationale: „Ysop“ ist die etablierte deutsche Wiedergabe der Pflanzenbezeichnung, ohne die im Hebräischen nicht näher bestimmte Art festzulegen.
- source_word: שְׁנִי הַתּוֹלַעַת
  choice: den Scharlachfaden
  rationale: Die Wendung bezeichnet scharlachrot gefärbtes Material. „Scharlachfaden“ ist im Zusammenhang des Rituals anschaulich; die wörtliche Ausdrucksweise wird in einer Fußnote dokumentiert.
- source_word: הַצִּפֹּר הַחַיָּה
  choice: den lebenden Vogel
  rationale: Das Adjektiv unterscheidet diesen Vogel ausdrücklich von dem geschlachteten Vogel.
- source_word: וְטָבַל אֹתָם
  choice: sie … tauchen
  rationale: Das Pronomen ist pluralisch und bezieht die genannten Ritualgegenstände samt dem lebenden Vogel ein; „tauchen“ gibt טבל in diesem Zusammenhang natürlich wieder.
- source_word: בְּדַם הַצִּפֹּר הַשְּׁחוּטָה
  choice: in das Blut des geschlachteten Vogels
  rationale: „Geschlachtet“ bewahrt den rituellen Bedeutungsgehalt von שׁחט genauer als das allgemeinere „getötet“.
- source_word: וּבַמַּיִם הַחַיִּים
  choice: und in das frische Wasser
  rationale: Die hebräische Wendung bedeutet wörtlich „lebendiges Wasser“ und bezeichnet frisches beziehungsweise fließendes Wasser; die Haupttextfassung ist im Gesetzeskontext unmittelbar verständlich.
- source_word: וְהִזָּה אֶל הַבַּיִת
  choice: und das Haus … besprengen
  rationale: נזה im Hifil bezeichnet das rituelle Sprengen. „Besprengen“ ist im Deutschen präzise und lässt die durch אֶל ausgedrückte Ausrichtung auf das Haus natürlich erkennen.
- source_word: שֶׁבַע פְּעָמִים
  choice: siebenmal
  rationale: Die kompakte deutsche Adverbform gibt die eindeutige Zahlangabe genau wieder.
theological_decisions:
- issue: Wiedergabe von מַיִם חַיִּים in der Ritualgesetzgebung
  choice: frisches Wasser
  alternative: lebendiges Wasser; fließendes Wasser; Quellwasser
  rationale: Die Wendung bezeichnet Wasser aus einer frischen beziehungsweise fließenden Quelle. „Frisches Wasser“ vermittelt hier den sachlichen Sinn, ohne spätere theologische Assoziationen der Formulierung „lebendiges Wasser“ in den Vordergrund zu rücken; Wortlaut und Bedeutungsbreite bleiben in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Syntax für eine rituelle Anweisung. Die Fachwörter „Ysop“ und „besprengen“ sind etabliert und im Kontext verständlich. Der Fußnotenmarker [a] steht sachgerecht bei „Scharlachfaden“.
