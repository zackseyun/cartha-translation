id: LEV.14.2
reference: Leviticus 14:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: זֹ֤את תִּֽהְיֶה֙ תּוֹרַ֣ת הַ/מְּצֹרָ֔ע בְּ/י֖וֹם טָהֳרָת֑/וֹ וְ/הוּבָ֖א אֶל הַ/כֹּהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/002.yaml
  text: 'This shall be the law for the leprous person on the day of his cleansing: he shall be brought to the priest[a].'
translation:
  language: de
  text: 'Dies soll die Weisung für den von Aussatz Betroffenen[a] am Tag seiner Reinigung sein: Er soll zum Priester gebracht werden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet einen Menschen, der von צָרַעַת (zaraat) betroffen ist. Dieser biblische Befund ist nicht ohne Weiteres mit der heute als Lepra bezeichneten Hansen-Krankheit gleichzusetzen.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת תִּהְיֶה
  choice: Dies soll ... sein
  rationale: Die Verbindung aus Demonstrativpronomen und Qal-Imperfekt eröffnet eine rechtlich-rituelle Vorschrift; „soll ... sein“ bewahrt den normativen Charakter in natürlichem Deutsch.
- source_word: תּוֹרַת
  choice: die Weisung für
  rationale: תּוֹרָה bezeichnet hier die vorgeschriebene rituelle Verfahrensordnung. „Weisung“ gibt den Sinn wieder, ohne nur an ein abstraktes Gesetz denken zu lassen.
- source_word: הַמְּצֹרָע
  choice: den von Aussatz Betroffenen
  rationale: מְצֹרָע bezeichnet einen Menschen, der von צָרַעַת betroffen ist. Die Formulierung wahrt den traditionellen Bezug zu „Aussatz“, setzt die Erkrankung aber nicht mit moderner Lepra gleich und reduziert den Menschen nicht auf seinen Zustand.
- source_word: בְּיוֹם טָהֳרָתוֹ
  choice: am Tag seiner Reinigung
  rationale: Die Wendung bezeichnet den Zeitpunkt der rituellen Reinigung beziehungsweise Wiederherstellung; „Reinigung“ ist verständlich und im kultischen Zusammenhang angemessen.
- source_word: וְהוּבָא
  choice: Er soll ... gebracht werden
  rationale: Die Hofal-Form ist passiv und führt den rituellen Ablauf fort. Ein neuer deutscher Hauptsatz nach dem Doppelpunkt bildet dies klar und natürlich ab.
- source_word: אֶל הַכֹּהֵן
  choice: zum Priester
  rationale: Der bestimmte Artikel bezeichnet den für das Verfahren zuständigen Priester; „zum Priester“ ist die idiomatische deutsche Wiedergabe.
theological_decisions:
- issue: Verhältnis von מְצֹרָע beziehungsweise צָרַעַת zum Begriff „Lepra“
  choice: den von Aussatz Betroffenen
  alternative: den Aussätzigen; den an einer Hautkrankheit Erkrankten
  rationale: Der hebräische Ausdruck bezeichnet einen kultisch relevanten Befund, der nicht eindeutig mit der modernen Hansen-Krankheit gleichzusetzen ist. „Aussatz“ erhält den biblisch-traditionellen Zusammenhang, während „Betroffenen“ eine vorschnelle medizinische Gleichsetzung und eine Reduktion der Person vermeidet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rechtlich-rituellem Klang. „Weisung“ ist verständlicher und semantisch breiter als „Gesetz“; „Aussatz“ wird wegen seiner traditionellen Verankerung beibehalten, aber durch personenzentrierte Formulierung und Fußnote präzisiert.
