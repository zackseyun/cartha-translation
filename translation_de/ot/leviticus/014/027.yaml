id: LEV.14.27
reference: Leviticus 14:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הִזָּ֤ה הַ/כֹּהֵן֙ בְּ/אֶצְבָּע֣/וֹ הַ/יְמָנִ֔ית מִן הַ/שֶּׁ֕מֶן אֲשֶׁ֥ר עַל כַּפּ֖/וֹ הַ/שְּׂמָאלִ֑ית שֶׁ֥בַע פְּעָמִ֖ים לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/027.yaml
  text: Then the priest shall sprinkle with his right finger some of the oil that is on his left palm seven times before Yahweh.
translation:
  language: de
  text: Dann soll der Priester mit seinem rechten Finger siebenmal etwas von dem Öl, das auf seiner linken Handfläche ist, vor Jahwe sprengen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִזָּה
  choice: Dann soll … sprengen
  rationale: Das Hifil von נזה bezeichnet im kultischen Zusammenhang das Sprengen einer Flüssigkeit. „Dann“ gibt die durch וְ angezeigte Abfolge im Deutschen natürlich wieder.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Übliche und sachlich genaue Wiedergabe von כֹּהֵן in kultischen Vorschriften.
- source_word: בְּאֶצְבָּעוֹ הַיְמָנִית
  choice: mit seinem rechten Finger
  rationale: Die Formulierung bewahrt den Singular und die ausdrückliche Angabe der rechten Seite.
- source_word: מִן הַשֶּׁמֶן
  choice: etwas von dem Öl
  rationale: 'מִן ist hier partitiv: Versprengt wird ein Teil des Öls, nicht das gesamte Öl.'
- source_word: אֲשֶׁר עַל כַּפּוֹ הַשְּׂמָאלִית
  choice: das auf seiner linken Handfläche ist
  rationale: כַּף bezeichnet hier präzise die Handfläche, auf der sich das Öl befindet.
- source_word: שֶׁבַע פְּעָמִים
  choice: siebenmal
  rationale: Natürliche deutsche Wiedergabe der Zählformel.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי beschreibt die Handlung vor Gottes Gegenwart; der Gottesname יְהוָה wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich den Gottesnamen. „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Moderne, würdige und gut verständliche Gesetzessprache. Die Satzstellung hält den rituellen Ablauf klar und bewahrt zugleich die konkreten Angaben zu Finger, Öl und Handfläche.
