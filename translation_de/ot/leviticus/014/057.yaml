  text: to give instruction about when it is unclean and when it is clean. This is the law concerning the defiling condition[a].
translation:
  language: de
  text: um zu unterweisen, wann etwas unrein und wann es rein ist. Das ist die Weisung über die verunreinigende Erscheinung[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: »Aussatz« oder »Lepra«. Der hebräische Begriff bezeichnet verunreinigende Erscheinungen an Menschen, Textilien oder Häusern und ist nicht auf die heutige Hansen-Krankheit beschränkt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהוֹרֹת
  choice: um anzuweisen
  rationale: Der Hifil-Infinitiv bezeichnet hier verbindliche Unterweisung zur Feststellung der in den vorausgehenden Vorschriften behandelten Reinheitszustände.
- source_word: בְּיוֹם הַטָּמֵא וּבְיוֹם הַטָּהֹר
  choice: wann etwas unrein und wann es rein ist
  rationale: 'בְּיוֹם ist in dieser Schlussformel zeitlich-funktional zu verstehen: Es geht darum, wann der jeweilige Zustand vorliegt, nicht um bestimmte Kalendertage.'
- source_word: תּוֹרַת
  choice: die Weisung über
  rationale: תּוֹרָה bezeichnet hier die maßgebliche kultische Unterweisung; „Weisung“ gibt den Sinn natürlicher und weniger missverständlich wieder als ausschließlich „Gesetz“.
- source_word: הַצָּרָעַת
  choice: der verunreinigende Befall
  rationale: Der hebräische Oberbegriff umfasst Erscheinungen an Menschen, Textilien und Häusern. „Befall“ ist dafür breit genug, während „verunreinigend“ seine kultische Wirkung erkennen lässt, ohne ihn mit einer modernen Diagnose gleichzusetzen.
theological_decisions:
- issue: Wiedergabe von צָרַעַת im levitischen Reinheitsrecht
  choice: verunreinigender Befall
  alternative: Aussatz; Lepra; Hautkrankheit
  rationale: Der Kontext der Kapitel 13–14 umfasst Menschen, Textilien und Häuser. Eine rein medizinische oder auf die Haut beschränkte Wiedergabe wäre daher zu eng; die traditionelle Benennung bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Zweckkonstruktion setzt den vorangehenden Satz fort. Das unbestimmte „etwas“ bewahrt den umfassenden Bezug auf Menschen, Gegenstände und Häuser.
