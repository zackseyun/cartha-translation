  text: וְ/יָצָ֧א הַ/כֹּהֵ֛ן מִן הַ/בַּ֖יִת אֶל פֶּ֣תַח הַ/בָּ֑יִת וְ/הִסְגִּ֥יר אֶת הַ/בַּ֖יִת שִׁבְעַ֥ת יָמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/038.yaml
  text: Then the priest shall go out of the house to the doorway of the house and shut up the house for seven days[a].
translation:
  language: de
  text: Dann soll der Priester das Haus verlassen, zum Eingang des Hauses gehen und das Haus für sieben Tage verschließen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Haus sieben Tage lang absperren“. Das hebräische Verb kann das Absperren des Zugangs während einer Untersuchungsfrist bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: Dann soll … hinausgehen
  rationale: Das Waw mit Qatal führt im gesetzlichen Verfahrensablauf den nächsten Schritt ein. „Dann“ gibt diese Abfolge natürlich wieder; „soll“ bewahrt den anweisenden Charakter.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Die übliche und sachgerechte Wiedergabe von כֹּהֵן im levitischen Rechtskontext; der bestimmte Artikel bleibt erhalten.
- source_word: מִן הַבַּיִת
  choice: aus dem Haus hinaus
  rationale: In Verbindung mit יָצָא gibt diese Formulierung die Bewegung aus dem Inneren des bestimmten Hauses idiomatisch wieder.
- source_word: אֶל פֶּתַח הַבָּיִת
  choice: an den Eingang des Hauses
  rationale: פֶּתַח bezeichnet die Öffnung beziehungsweise den Eingangsbereich. „Eingang“ ist konkret, natürlich und setzt keine vorhandene Tür voraus.
- source_word: וְהִסְגִּיר
  choice: und … verschließen
  rationale: Der Hifil von סגר bezeichnet hier das Schließen beziehungsweise Absperren des Hauses für einen festgelegten Zeitraum. „Verschließen“ bewahrt den Verfahrenssinn, ohne mit „unter Quarantäne stellen“ stärker auszudeuten.
- source_word: אֶת הַבַּיִת
  choice: das Haus
  rationale: Die Akkusativmarkierung wird nicht eigens wiedergegeben; der bestimmte Gegenstand bleibt ausdrücklich genannt.
- source_word: שִׁבְעַת יָמִים
  choice: für sieben Tage
  rationale: „Für“ bezeichnet im modernen Deutschen die zeitliche Dauer natürlich und eindeutig.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer gesetzlicher Verfahrenssprache. Die Wiederholung von „Haus“ wird entsprechend dem Hebräischen beibehalten; „Eingang“ vermeidet die übergenaue Annahme einer Tür.
