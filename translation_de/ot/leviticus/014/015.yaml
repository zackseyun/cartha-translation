source:
  edition: WLC
  text: וְ/לָקַ֥ח הַ/כֹּהֵ֖ן מִ/לֹּ֣ג הַ/שָּׁ֑מֶן וְ/יָצַ֛ק עַל כַּ֥ף הַ/כֹּהֵ֖ן הַ/שְּׂמָאלִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/015.yaml
  text: Then the priest shall take some of the log of oil and pour it into the palm of his own left hand[a].
translation:
  language: de
  text: Dann soll der Priester etwas von dem Öl aus dem Log nehmen und es in seine linke Handfläche gießen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein „Log“ war ein altes Maß für Flüssigkeiten.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַח
  choice: Dann soll … nehmen
  rationale: Das Waw mit Qatal führt die vorgeschriebene Ritualfolge weiter; „Dann soll“ gibt diese sequenzielle Anweisung im Deutschen natürlich wieder.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Die übliche Wiedergabe von כֹּהֵן im kultischen Zusammenhang; der bestimmte Artikel bleibt erhalten.
- source_word: מִלֹּג הַשָּׁמֶן
  choice: etwas von dem Log Öl
  rationale: מִן bezeichnet hier Herkunft beziehungsweise einen Teil des abgemessenen Öls. „Etwas von“ verdeutlicht, dass der Priester Öl aus dem Log nimmt, nicht zwingend das ganze Maß.
- source_word: לֹג
  choice: Log
  rationale: Die Bezeichnung eines alten Flüssigkeitsmaßes wird transliteriert, da eine moderne Umrechnung unsicher wäre und die konkrete Maßeinheit erhalten bleiben soll.
- source_word: וְיָצַק
  choice: und … gießen
  rationale: Das zweite Verb steht in derselben fortlaufenden Vorschrift und wird im Deutschen unter der Modalwirkung von „soll“ koordiniert.
- source_word: עַל כַּף
  choice: in … Handfläche
  rationale: עַל bedeutet wörtlich „auf“; beim Gießen in die hohle Hand gibt „in die Handfläche“ den praktischen Sinn im Deutschen idiomatisch wieder.
- source_word: כַּף
  choice: Handfläche
  rationale: כַּף bezeichnet konkret die Innenfläche beziehungsweise Höhlung der Hand und nicht nur die Hand allgemein.
- source_word: הַשְּׂמָאלִית
  choice: linke
  rationale: Das Adjektiv kennzeichnet die linke Handfläche des Priesters.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlicher Syntax. „Seine eigene“ macht entsprechend der wiederholten hebräischen Bezeichnung des Priesters deutlich, dass dessen eigene linke Hand gemeint ist. Der Fachausdruck „Log“ bleibt erhalten und wird in der Fußnote erklärt.
