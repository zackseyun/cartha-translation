  text: וְ/לָקַ֣ח הַ/כֹּהֵן֮ מִ/דַּ֣ם הָ/אָשָׁם֒ וְ/נָתַן֙ הַ/כֹּהֵ֔ן עַל תְּנ֛וּךְ אֹ֥זֶן הַ/מִּטַּהֵ֖ר הַ/יְמָנִ֑ית וְ/עַל בֹּ֤הֶן יָד/וֹ֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְל֖/וֹ הַ/יְמָנִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/014.yaml
  text: Then the priest shall take some of the blood of the guilt offering[a], and the priest shall put it on the lobe of the right ear of the one being cleansed, and on the thumb of his right hand[b], and on the big toe of his right foot.
translation:
  language: de
  text: Dann soll der Priester etwas vom Blut[a] des Schuldopfers nehmen und es auf das rechte Ohrläppchen[b] der Person streichen, die gereinigt wird, ebenso auf den Daumen ihrer rechten Hand und auf die große Zehe ihres rechten Fußes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vom Blut des Schuldopfers“. Gemeint ist ein Teil davon.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „auf die Spitze des rechten Ohrs“. Die genaue Bedeutung des hebräischen Ausdrucks ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדַּם
  choice: etwas vom Blut
  rationale: Das מִן ist hier partitiv. „Etwas vom Blut“ gibt den Sinn der rituellen Anweisung im Deutschen klar wieder, ohne anzudeuten, dass der Priester das gesamte Blut nimmt.
- source_word: הָאָשָׁם
  choice: Schuldopfer
  rationale: אָשָׁם bezeichnet hier die festgelegte Opferart. „Schuldopfer“ ist die geläufige und sachlich präzise deutsche Entsprechung.
- source_word: תְּנוּךְ אֹזֶן
  choice: Ohrläppchen
  rationale: תְּנוּךְ bezeichnet einen äußeren beziehungsweise weichen Teil des Ohrs; „Ohrläppchen“ ist im rituellen Zusammenhang die wahrscheinlichste und natürlichste Wiedergabe.
- source_word: הַמִּטַּהֵר
  choice: die Person, die gereinigt wird
  rationale: Das Hitpael-Partizip bezeichnet hier die Person, die sich im Reinigungsritus befindet. Die Formulierung stellt verständlich heraus, dass sie die Reinigung erfährt.
- source_word: וְנָתַן
  choice: streichen
  rationale: Das allgemeinere „geben/tun“ bezeichnet hier das Auftragen von Blut auf bestimmte Körperstellen. „Streichen“ gibt die konkrete rituelle Handlung natürlich wieder.
- source_word: בֹּהֶן יָדוֹ
  choice: Daumen ihrer rechten Hand
  rationale: בֹּהֶן bezeichnet in Verbindung mit יָד den Daumen.
- source_word: בֹּהֶן רַגְלוֹ
  choice: große Zehe ihres rechten Fußes
  rationale: בֹּהֶן bezeichnet in Verbindung mit רֶגֶל die große Zehe.
- source_word: וְלָקַח ... וְנָתַן
  choice: soll ... nehmen und ... streichen
  rationale: Die Verbformen haben in dieser gesetzlichen Verfahrensanweisung vorschreibende Bedeutung; deutsches „soll“ bringt dies klar und idiomatisch zum Ausdruck.
theological_decisions:
- issue: Rolle der zu reinigenden Person
  choice: „die Person, die gereinigt wird“ beschreibt sie als Empfängerin des priesterlichen Reinigungsritus
  alternative: „die sich reinigt“ oder „die gereinigte Person“
  rationale: Der Zusammenhang beschreibt einen noch ablaufenden, vom Priester vollzogenen Ritus. Die Übersetzung vermeidet sowohl die Vorstellung autonomer Selbstreinigung als auch die vorzeitige Aussage, die Reinigung sei bereits abgeschlossen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit klarer ritueller Terminologie. Die Wiederholung von „der Priester“ im zweiten hebräischen Satzteil wurde zugunsten eines natürlichen deutschen Satzflusses durch „es“ aufgenommen; „ebenso“ bildet die parallele Reihung der drei Körperstellen ab.
