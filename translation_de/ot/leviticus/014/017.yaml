  text: וּ/מִ/יֶּ֨תֶר הַ/שֶּׁ֜מֶן אֲשֶׁ֣ר עַל כַּפּ֗/וֹ יִתֵּ֤ן הַ/כֹּהֵן֙ עַל תְּנ֞וּךְ אֹ֤זֶן הַ/מִּטַּהֵר֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֤הֶן יָד/וֹ֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְל֖/וֹ הַ/יְמָנִ֑ית עַ֖ל דַּ֥ם הָ/אָשָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/017.yaml
  text: And from the rest of the oil that is on his palm[a], the priest shall put some on the lobe of the right ear of the one being cleansed, and on the thumb of his right hand, and on the big toe of his right foot[b], on top of the blood of the guilt offering.
translation:
  language: de
  text: Von dem übrigen Öl auf seiner Handfläche soll der Priester etwas auf das Ohrläppchen[a] des rechten Ohres desjenigen, der gereinigt wird, auf den Daumen seiner rechten Hand und auf die große Zehe seines rechten Fußes tun, und zwar auf das Blut des Schuldopfers.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf den äußersten Teil des rechten Ohres“. Das hebräische Wort bezeichnet die äußere Partie beziehungsweise das Ende des Ohres; im Zusammenhang dieses Rituals ist wahrscheinlich das Ohrläppchen gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „über das Blut des Schuldopfers“. Gemeint ist offenbar, dass das Öl an derselben Stelle aufgetragen wird, an der sich bereits das Blut befindet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיֶּתֶר הַשֶּׁמֶן
  choice: von dem übrigen Öl
  rationale: יֶתֶר bezeichnet den verbleibenden Rest; die Präposition מִן hat hier partitive Bedeutung. Die Formulierung ist natürlich und hält beides fest.
- source_word: עַל כַּפּוֹ
  choice: auf seiner Handfläche
  rationale: כַּף bezeichnet hier die Handfläche beziehungsweise die hohle Hand. „Auf“ entspricht עַל und passt zum beschriebenen Ritual.
- source_word: יִתֵּן
  choice: soll … etwas … tun
  rationale: נתן kann „geben“, „legen“ oder „tun“ bedeuten. „Etwas … tun“ gibt idiomatisch wieder, dass nur ein Teil des restlichen Öls aufgetragen wird.
- source_word: תְּנוּךְ אֹזֶן
  choice: das Läppchen … des Ohres
  rationale: תְּנוּךְ bezeichnet die äußere Partie beziehungsweise das Ende des Ohres. „Ohrläppchen“ ist im Deutschen die verständlichste Bezeichnung für die Stelle in diesem Ritual; die lexikalische Unschärfe wird in einer Fußnote bewahrt.
- source_word: הַמִּטַּהֵר
  choice: des zu Reinigenden
  rationale: Das Hitpael-Partizip bezeichnet die Person, an der die rituelle Reinigung vollzogen wird. Die Formulierung wahrt den Vorgangscharakter.
- source_word: בֹּהֶן יָדוֹ
  choice: den Daumen seiner rechten Hand
  rationale: בֹּהֶן bezeichnet an der Hand den Daumen; der Körperteil wird im Deutschen kontextgerecht benannt.
- source_word: בֹּהֶן רַגְלוֹ
  choice: die große Zehe seines rechten Fußes
  rationale: Dasselbe hebräische Wort בֹּהֶן bezeichnet am Fuß die große Zehe. Diese Wiedergabe ist modernes Standarddeutsch.
- source_word: עַל דַּם הָאָשָׁם
  choice: auf das Blut des Schuldopfers
  rationale: עַל wird bewusst knapp mit „auf“ wiedergegeben und lässt erkennen, dass das Öl an den bereits mit Blut bezeichneten Stellen aufgetragen wird, ohne das räumliche Verhältnis unnötig auszudeuten.
theological_decisions:
- issue: Wiedergabe von אָשָׁם als Opferbezeichnung
  choice: Schuldopfer
  alternative: Entschädigungsopfer
  rationale: אָשָׁם ist im levitischen Opferrecht die feste Bezeichnung eines mit Schuld beziehungsweise Haftung verbundenen Opfers. „Schuldopfer“ ist die geläufige und hinreichend genaue deutsche Entsprechung, ohne eine spätere Lehrdeutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt der dreifachen Körperteilformel des Hebräischen, bleibt aber durch „und zwar“ am Satzende verständlich. Fachsprachliche Opferterminologie wird konsistent und ohne konfessionelle Zusätze verwendet.
