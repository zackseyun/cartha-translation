source:
  edition: WLC
  text: וּ/בָא֙ אֲשֶׁר ל֣/וֹ הַ/בַּ֔יִת וְ/הִגִּ֥יד לַ/כֹּהֵ֖ן לֵ/אמֹ֑ר כְּ/נֶ֕גַע נִרְאָ֥ה לִ֖/י בַּ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/035.yaml
  text: then the owner of the house shall come and tell the priest[a], saying, ‘Something like a plague has appeared to me in the house.’
translation:
  language: de
  text: 'Dann soll der Besitzer des Hauses kommen und dem Priester melden: »Etwas wie ein Befall[a] ist mir im Haus erschienen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »wie ein Befall/eine Plage«. Der Hausbesitzer meldet nur eine entsprechende Erscheinung und stellt noch keine endgültige Diagnose.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  choice: Dann soll ... kommen
  rationale: Das mit וְ verbundene Qal-Perfekt bezeichnet im gesetzlichen Verfahrensablauf den nächsten Schritt. »Dann« und »soll kommen« geben diese Abfolge im Deutschen natürlich wieder.
- source_word: אֲשֶׁר לוֹ הַבַּיִת
  choice: der Besitzer des Hauses
  rationale: 'Wörtlich: »der, dem das Haus gehört«. »Der Besitzer des Hauses« ist eine natürliche und genaue deutsche Wiedergabe.'
- source_word: וְהִגִּיד לַכֹּהֵן
  choice: dem Priester melden
  rationale: Der Hifil von נגד bedeutet »bekannt machen, berichten«. »Melden« passt zum amtlichen Vorgang und gibt den Empfänger mit dem Dativ idiomatisch wieder.
- source_word: לֵאמֹר
  choice: Doppelpunkt mit direkter Rede
  rationale: Der hebräische Einleiter der direkten Rede wird im modernen Deutschen natürlich durch einen Doppelpunkt wiedergegeben.
- source_word: כְּנֶגַע
  choice: etwas wie ein Befall
  rationale: 'Das Präfix כְּ drückt Ähnlichkeit beziehungsweise Vorläufigkeit aus: Der Hausbesitzer stellt keine verbindliche Diagnose. »Befall« bezeichnet eine auffällige Schädigung am Gebäude, ohne eine moderne medizinische Kategorie einzutragen.'
- source_word: נִרְאָה לִי
  choice: ist mir ... sichtbar geworden
  rationale: Der Nifal von ראה bezeichnet hier, dass etwas in Erscheinung getreten beziehungsweise wahrgenommen worden ist. Die Formulierung wahrt die eingeschränkte Perspektive des Hausbesitzers.
- source_word: בַּבָּיִת
  choice: im Haus
  rationale: Die Präposition בְּ bezeichnet das Haus als den Ort der wahrgenommenen Erscheinung; »im Haus« ist die naheliegende deutsche Wiedergabe.
theological_decisions:
- issue: Vorläufige Meldung gegenüber priesterlicher Feststellung
  choice: »etwas wie ein Befall«
  alternative: »ein Befall«
  rationale: Der Vergleichspartikel כְּ lässt die Meldung bewusst vorläufig. Der Besitzer beobachtet eine Erscheinung, während die anschließende Beurteilung dem Priester zukommt; diese Spannung darf nicht durch eine definitive Benennung eingeebnet werden.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Ton. »Melden« unterstreicht den geregelten Vorgang; »Befall« ist im Zusammenhang mit einem Gebäude verständlicher als das medizinisch oder katastrophisch klingende »Seuche/Plage«.
