base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/015.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, with the kidneys[b], he shall remove.
translation:
  language: de
  text: Auch die beiden Nieren und das Fett an ihnen, das an den Lenden liegt, sowie den Fortsatz[a] an der Leber soll er zusammen mit den Nieren[b] entfernen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Leberlappen“. Welcher Körperteil mit dem hebräischen Ausdruck genau gemeint ist, ist unsicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „auf den Nieren“. Wahrscheinlich ist gemeint, dass dieser Teil zusammen mit den Nieren entfernt wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: die beiden Nieren
  rationale: Die Wendung bezeichnet eindeutig die zwei Nieren des Opfertiers.
- source_word: הַחֵלֶב אֲשֶׁר עֲלֵהֶן
  choice: das Fett an ihnen
  rationale: חֵלֶב bezeichnet hier die für das Opfer abzusondernden Fettteile; die relative Bestimmung bezieht sich auf die Nieren.
- source_word: הַכְּסָלִים
  choice: die Lenden
  rationale: Das Wort bezeichnet in diesem anatomischen Zusammenhang die Lenden- beziehungsweise Flankengegend; „Lenden“ bewahrt die traditionelle und hinreichend genaue Bezeichnung.
- source_word: הַיֹּתֶרֶת
  choice: der Fortsatz
  rationale: Der genaue anatomische Bezug des hebräischen Ausdrucks ist unsicher. „Fortsatz“ gibt die Vorstellung eines hervorstehenden oder anhängenden Teils wieder, ohne eine nicht gesicherte moderne Identifikation festzulegen.
- source_word: עַל הַכָּבֵד
  choice: an der Leber
  rationale: עַל beschreibt hier die räumliche Zuordnung zur Leber; im Deutschen klingt „an der Leber“ anatomisch natürlicher als das wörtlichere „auf der Leber“.
- source_word: עַל הַכְּלָיֹת
  choice: zusammen mit den Nieren
  rationale: Im Opferverfahren ist wahrscheinlich gemeint, dass der Fortsatz gemeinsam mit den Nieren entfernt wird. Eine Fußnote bewahrt die wörtliche räumliche Formulierung.
- source_word: יְסִירֶנָּה
  choice: soll er … entfernen
  rationale: Die Hifil-Form von סור bezeichnet hier das Entfernen im Rahmen einer kultischen Anweisung. „Soll … entfernen“ ist natürliches modernes Deutsch mit rechtlich-anweisendem Ton.
