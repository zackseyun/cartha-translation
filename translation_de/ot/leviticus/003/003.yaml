  text: וְ/הִקְרִיב֙ מִ/זֶּ֣בַח הַ/שְּׁלָמִ֔ים אִשֶּׁ֖ה לַ/יהוָ֑ה אֶת הַ/חֵ֨לֶב֙ הַֽ/מְכַסֶּ֣ה אֶת הַ/קֶּ֔רֶב וְ/אֵת֙ כָּל הַ/חֵ֔לֶב אֲשֶׁ֖ר עַל הַ/קֶּֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/003.yaml
  text: And from the sacrifice of peace offerings he shall present as a food offering to Yahweh the fat that covers the entrails[a], and all the fat that is on the entrails,
translation:
  language: de
  text: Vom Friedensopfer soll er als Feueropfer für Jahwe das Fett darbringen, das die Eingeweide bedeckt, und alles Fett, das an den Eingeweiden liegt,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: soll er … darbringen
  rationale: Der Hifil von קרב bezeichnet im Opferkontext das rituelle Darbringen; die deutsche Formulierung ist natürlich und bewahrt den verpflichtenden Charakter.
- source_word: מִזֶּבַח הַשְּׁלָמִים
  choice: vom Friedensopfer
  rationale: זֶבַח bezeichnet hier das Schlachtopfer, שְׁלָמִים die traditionelle Opferkategorie. „Friedensopfer“ ist im Deutschen verständlich und fachsprachlich etabliert, auch wenn der Begriff ebenfalls Wohlergehen und Gemeinschaft anklingen lässt.
- source_word: אִשֶּׁה
  choice: Feueropfer
  rationale: Der Ausdruck bezeichnet eine Opfergabe, die auf dem Altar verbrannt beziehungsweise in Rauch aufgehen gelassen wird. „Feueropfer“ gibt diese kultische Kategorie knapp und transparent wieder, ohne die Gabe als buchstäbliche Nahrung Gottes missverständlich zu beschreiben.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition ל markiert den Empfänger beziehungsweise die Bestimmung der Opfergabe; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: הַחֵלֶב הַמְכַסֶּה אֶת הַקֶּרֶב
  choice: das Fett, das die Eingeweide bedeckt
  rationale: חֵלֶב bezeichnet die für das Opfer bestimmten Fettpartien; das Partizip מְכַסֶּה beschreibt das Fett als Bedeckung der inneren Organe.
- source_word: וְאֵת כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: und alles Fett, das an den Eingeweiden liegt
  rationale: Die Formulierung unterscheidet das bedeckende Fett von sämtlichem weiteren Fett an den inneren Organen. „An“ ist in diesem anatomischen Zusammenhang natürlicher als das wörtlichere „auf“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. „Jahwe“ bewahrt den offenbarten Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von אִשֶּׁה im Opfergesetz
  choice: Feueropfer
  alternative: Speisegabe; eine im Feuer dargebrachte Opfergabe
  rationale: Die Etymologie und der priesterliche Gebrauch beziehen den Ausdruck auf eine durch Feuer dargebrachte Gabe. „Feueropfer“ ist im Deutschen prägnant und vermeidet die mögliche Fehlvorstellung, Gott benötige Nahrung.
- issue: Bedeutungsumfang von שְׁלָמִים
  choice: Friedensopfer
  alternative: Gemeinschaftsopfer; Heilsopfer
  rationale: Der hebräische Begriff kann Frieden, Wohlergehen und Gemeinschaft umfassen. „Friedensopfer“ bewahrt die traditionelle Bezeichnung, ohne den weiteren Bedeutungsumfang dogmatisch festzulegen.
