base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/013.yaml
  text: And he shall lay his hand on its head and slaughter it before the tent of meeting[a], and the sons of Aaron shall throw its blood against the altar all around.
translation:
  language: de
  text: Er soll seine Hand auf den Kopf des Tieres legen und es vor dem Zelt der Begegnung schlachten. Dann sollen die Söhne Aarons dessen Blut ringsum an den Altar sprengen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dessen Blut ringsum gegen den Altar werfen“. Das hebräische Verb bezeichnet hier das schwungvolle Anbringen des Blutes am Altar; „sprengen“ ist die traditionelle deutsche Wiedergabe, meint aber nicht unbedingt ein feines Besprengen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ אֶת יָדוֹ עַל רֹאשׁוֹ
  choice: Er soll seine Hand auf den Kopf des Tieres legen
  rationale: Die Wendung bezeichnet im Opferzusammenhang das Auflegen beziehungsweise Aufstützen der Hand auf das Tier. „Legen“ ist im Deutschen natürlich; „des Tieres“ macht den Bezug des im Hebräischen mehrdeutigen Suffixes verständlich.
- source_word: וְשָׁחַט אֹתוֹ
  choice: und es … schlachten
  rationale: שׁחט ist der übliche Ausdruck für rituelles Schlachten und wird präziser mit „schlachten“ als mit dem allgemeineren „töten“ wiedergegeben.
- source_word: לִפְנֵי אֹהֶל מוֹעֵד
  choice: vor dem Zelt der Begegnung
  rationale: „Zelt der Begegnung“ gibt die kultische Bezeichnung אֹהֶל מוֹעֵד transparent und in modernem Standarddeutsch wieder.
- source_word: בְּנֵי אַהֲרֹן
  choice: die Söhne Aarons
  rationale: Die formale priesterliche Bezeichnung und die hebräische Genitivverbindung bleiben erhalten.
- source_word: וְזָרְקוּ … אֶת דָּמוֹ עַל הַמִּזְבֵּחַ סָבִיב
  choice: Dann sollen … sein Blut ringsum an den Altar sprengen
  rationale: זרק bezeichnet hier das schwungvolle Anbringen des Blutes am Altar. „Sprengen“ ist die etablierte deutsche Opferterminologie, darf aber nicht als bloß feines Besprengen verstanden werden; deshalb erläutert die Fußnote die mögliche Wiedergabe „werfen“. „Ringsum an den Altar“ bewahrt sowohl die Richtung von עַל als auch die distributive Bedeutung von סָבִיב.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer kultischer Terminologie. Der lange hebräische Satz wird zur besseren Verständlichkeit in zwei Sätze gegliedert. Das maskuline Pronomen „sein“ bezieht sich grammatisch auf „das Tier“ und gibt den Bezug des hebräischen Suffixes wieder.
