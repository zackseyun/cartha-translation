base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/002.yaml
  text: He shall lay his hand on the head of his offering and slaughter it at the entrance of the tent of meeting[a], and Aaron’s sons, the priests[b], shall throw the blood against the altar all around.
translation:
  language: de
  text: Er soll seine Hand auf den Kopf seiner Opfergabe legen und sie am Eingang des Zeltes der Begegnung[a] schlachten. Dann sollen die Söhne Aarons, die Priester, das Blut ringsum gegen den Altar schleudern[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an der Türöffnung des Zeltes der Begegnung“.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Verb bezeichnet hier ein Werfen oder Schleudern des Blutes gegen den Altar, nicht notwendig ein feines Besprengen.
    reason: lexical_clarification
lexical_decisions:
- source_word: וְסָמַךְ יָדוֹ
  choice: Er soll seine Hand ... legen
  rationale: סמך bezeichnet im Opferkontext das Auflegen beziehungsweise Aufstützen der Hand. „Die Hand auf ... legen“ ist natürliches, würdevolles Deutsch und wahrt die Einzahl von יָדוֹ.
- source_word: רֹאשׁ קָרְבָּנוֹ
  choice: auf den Kopf seiner Opfergabe
  rationale: רֹאשׁ ist die konkrete anatomische Bezeichnung „Kopf“. קָרְבָּן ist ein allgemeiner Begriff für eine dargebrachte Gabe; „Opfergabe“ ist hier präziser als das enger wirkende „Opfer“.
- source_word: וּשְׁחָטוֹ
  choice: und sie ... schlachten
  rationale: שׁחט ist das übliche Verb für das rituelle Schlachten eines Opfertiers. Das feminine Pronomen bezieht sich im Deutschen auf „Opfergabe“.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: am Eingang des Zeltes der Begegnung
  rationale: פֶּתַח bezeichnet die Öffnung beziehungsweise den Eingang. „Zelt der Begegnung“ gibt אֹהֶל מוֹעֵד transparent wieder und vermeidet spätere Tempelterminologie.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: die Söhne Aarons, die Priester
  rationale: Die Apposition bleibt erhalten und kennzeichnet Aarons Söhne ausdrücklich als die handelnden Priester.
- source_word: וְזָרְקוּ
  choice: sollen ... sprengen
  rationale: זרק bezeichnet hier das Werfen beziehungsweise Schleudern des Blutes an den Altar. „Sprengen“ ist im deutschen Opferwortschatz idiomatisch, darf jedoch nicht im Sinn feinen Besprengens missverstanden werden; deshalb erläutert eine Fußnote die Handlung.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: ringsum gegen den Altar
  rationale: Mit זרק gibt „gegen den Altar“ die gerichtete Blutapplikation besser wieder als bloßes „auf“. סָבִיב bezeichnet die Verteilung rings um den Altar.
theological_decisions:
- issue: Art der Blutapplikation
  choice: das Blut ringsum gegen den Altar sprengen
  alternative: das Blut ringsum gegen den Altar werfen/schleudern
  rationale: Die Übersetzung bewahrt eine rituelle, nicht bloß lokative Handlung. Die Fußnote hält fest, dass זרק ein Werfen oder Schleudern bezeichnet und nicht zwingend ein feines Besprengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung vermeidet eine schwerfällige Kette, ohne die Abfolge der Handlungen zu verändern. „Er soll“ und „sollen“ geben die rechtlich-rituelle Anweisung wieder.
