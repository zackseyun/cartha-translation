source:
  edition: WLC
  text: וְ/הִקְטִירָ֥/ם הַ/כֹּהֵ֖ן הַ/מִּזְבֵּ֑חָ/ה לֶ֤חֶם אִשֶּׁה֙ לְ/רֵ֣יחַ נִיחֹ֔חַ כָּל חֵ֖לֶב לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/016.yaml
  text: And the priest shall burn them on the altar as food[a], an offering made by fire for a pleasing aroma[c][b]. All the fat belongs to Yahweh.
translation:
  language: de
  text: Und der Priester soll sie auf dem Altar in Rauch aufgehen lassen als Speise eines Feueropfers, zu einem wohlgefälligen Duft. Alles Fett ist für Jahwe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְטִירָם
  choice: Und der Priester soll sie … in Rauch aufgehen lassen
  rationale: Der Hifil von קטר bezeichnet im Opferkontext das Verbrennen auf dem Altar, wobei die Opferteile als Rauch aufsteigen. Das Suffix der 3. Person Plural wird mit „sie“ wiedergegeben und verweist auf die zuvor genannten Opferteile.
- source_word: הַמִּזְבֵּחָה
  choice: auf dem Altar
  rationale: Die Richtungsendung bezeichnet hier idiomatisch den Ort, an dem die Opferteile verbrannt werden.
- source_word: לֶחֶם אִשֶּׁה
  choice: als Speise, ein Feueropfer
  rationale: לֶחֶם bedeutet hier weiter gefasst „Speise“ und nicht ausschließlich Brot. Die knappe Apposition wahrt die ungewöhnliche kultische Bildsprache des Hebräischen, ohne sie erklärend aufzulösen.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: zum wohlgefälligen Duft
  rationale: Die feste Opferformel bezeichnet einen Duft, der Wohlgefallen findet. Die Wiedergabe bewahrt das konkrete Bild und bleibt zugleich im Deutschen würdig und verständlich.
- source_word: כָּל חֵלֶב
  choice: Alles Fett
  rationale: Die Formulierung erhält die umfassende Kraft von כָּל und bezeichnet im Zusammenhang das Opferfett.
- source_word: לַיהוָה
  choice: ist für Jahwe
  rationale: Das ל drückt hier Bestimmung beziehungsweise Zueignung aus. „Ist für“ bleibt näher an der knappen hebräischen Aussage als die stärker ausdeutende Wiedergabe „gehört“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, damit der im Hebräischen ausdrücklich stehende Bundesname erkennbar bleibt.
- issue: Opferformel לְרֵיחַ נִיחֹחַ
  choice: zum wohlgefälligen Duft
  alternative: zum beruhigenden Duft / zum angenehmen Duft
  rationale: Die Übersetzung bewahrt die kultische Metapher, ohne die Art des göttlichen Wohlgefallens näher zu definieren.
- issue: Zueignungsformel כָּל חֵלֶב לַיהוָה
  choice: Alles Fett ist für Jahwe
  alternative: Alles Fett gehört Jahwe
  rationale: Die knappe Form wahrt die mögliche Nuance von Bestimmung, Zueignung und Zugehörigkeit, statt sie allein als Besitzverhältnis festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kultischen Begriffe und die knappe Schlussformel werden bewusst beibehalten; „in Rauch aufgehen lassen“ bildet den Opferhandlungssinn genauer ab als das allgemeinere „verbrennen“.
