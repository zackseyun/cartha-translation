  text: וְ/הִקְרִ֨יב מִ/זֶּ֣בַח הַ/שְּׁלָמִים֮ אִשֶּׁ֣ה לַ/יהוָה֒ חֶלְבּ/וֹ֙ הָ/אַלְיָ֣ה תְמִימָ֔ה לְ/עֻמַּ֥ת הֶ/עָצֶ֖ה יְסִירֶ֑/נָּה וְ/אֶת הַ/חֵ֨לֶב֙ הַֽ/מְכַסֶּ֣ה אֶת הַ/קֶּ֔רֶב וְ/אֵת֙ כָּל הַ/חֵ֔לֶב אֲשֶׁ֖ר עַל הַ/קֶּֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/009.yaml
  text: 'And from the sacrifice of peace offerings he shall present an offering made by fire to Yahweh: its fat[a], the whole fat tail, which he shall remove close to the backbone, and the fat that covers the entrails, and all the fat that is on the entrails[c][b],'
translation:
  language: de
  text: 'Vom Friedensopfer soll er als Feueropfer für Jahwe darbringen: sein Fett, den ganzen Fettschwanz[a], den er dicht am Rückgrat abtrennen soll, ferner das Fett, das die Eingeweide bedeckt, und alles Fett an den Eingeweiden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der »Fettschwanz« ist der breite, fettreiche Schwanz bestimmter Schafrassen, der bei diesem Opfer vollständig abgetrennt wurde. Die folgende Ortsangabe kann auch mit »gegenüber dem Rückgrat« oder »am Ansatz der Wirbelsäule« wiedergegeben werden.
    reason: Kulturhinweis und lexikalische Alternative
lexical_decisions:
- source_word: זֶבַח הַשְּׁלָמִים
  choice: Friedensopfer
  rationale: Die traditionelle deutsche Wiedergabe bewahrt den kultischen Fachbegriff; zugleich umfasst שְׁלָמִים auch Gemeinschaft und Wohlergehen.
- source_word: אִשֶּׁה
  choice: Feueropfer
  rationale: Bezeichnet eine auf dem Altar durch Feuer dargebrachte Opfergabe und ist im Deutschen prägnant und kultisch verständlich.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen direkt wieder und bezeichnet den Empfänger der Opfergabe natürlich.
- source_word: חֶלְבּוֹ
  choice: sein Fett
  rationale: Bezeichnet die für die Opferung vorgesehenen Fettteile des Tieres.
- source_word: הָאַלְיָה תְמִימָה
  choice: den ganzen Fettschwanz
  rationale: אַלְיָה bezeichnet den breiten, fettreichen Schwanz eines Fettschwanzschafes; תְמִימָה betont dessen Ganzheit beziehungsweise Unversehrtheit.
- source_word: לְעֻמַּת הֶעָצֶה
  choice: dicht am Rückgrat
  rationale: Die anatomisch nicht völlig eindeutige Wendung gibt den Ort an, an dem der Fettschwanz nahe der Wirbelsäule abgetrennt wird.
- source_word: יְסִירֶנָּה
  choice: den er … abtrennen soll
  rationale: Das Hifil von סור bedeutet hier entfernen beziehungsweise abtrennen; das feminine Suffix bezieht sich auf אַלְיָה.
- source_word: הַחֵלֶב הַמְכַסֶּה אֶת הַקֶּרֶב
  choice: das Fett, das die Eingeweide bedeckt
  rationale: קֶרֶב bezeichnet in diesem opferanatomischen Zusammenhang die inneren Organe beziehungsweise Eingeweide.
- source_word: כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: alles Fett an den Eingeweiden
  rationale: Bewahrt die Unterscheidung zwischen dem bedeckenden Fett und dem übrigen an den Eingeweiden befindlichen Fett.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird entsprechend der direkten Form des hebräischen Ausgangstextes wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von שְׁלָמִים
  choice: Friedensopfer
  alternative: Gemeinschaftsopfer oder Heilsopfer
  rationale: Friedensopfer ist ein etablierter kultischer Begriff, ohne die im hebräischen Wort anklingenden Aspekte von Gemeinschaft und Wohlergehen dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kultischer Fachsprache. Die Satzstruktur bleibt nahe am Hebräischen, wird jedoch durch »ferner« und deutsche Kasusführung lesbar gegliedert. Die anatomische Unschärfe von לְעֻמַּת הֶעָצֶה wird in der Fußnote offengehalten.
