review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von וְהִקְטִירוֹ als „in Rauch aufgehen lassen“ trifft den kultischen Hifil von קטר präzise. „auf dem Altar“ und „für Jahwe“ geben die syntaktischen Beziehungen angemessen wieder. Die Apposition „als Speise, eine Feueropfergabe“ verwischt jedoch die hebräische Konstruktverbindung לֶחֶם אִשֶּׁה („Speise/Brot eines Feueropfers“).
  naturalness: Der Satz ist modernes, verständliches Standarddeutsch und hat einen angemessen würdevollen Registerton. Die genitivische Verbindung „als Speise eines Feueropfers“ ist zugleich natürlich und genauer als die Apposition.
  terminology: „Priester“, „Altar“, „in Rauch aufgehen lassen“, „Speise“, „Feueropfer“ und „Jahwe“ sind im kultischen Kontext konsistent und sachgerecht. „Feueropfer“ ist gegenüber „Feueropfergabe“ für die enge hebräische Nominalverbindung vorzuziehen.
  issues:
  - severity: medium
    issue: Die Beziehung von לֶחֶם zu אִשֶּׁה ist im Haupttext als Apposition wiedergegeben.
    rationale: לֶחֶם אִשֶּׁה ist eine Konstruktverbindung, wörtlich etwa „Brot/Speise eines Feueropfers“. „als Speise, eine Feueropfergabe“ kann beide Ausdrücke fälschlich gleichsetzen, statt die Speise als zum Feueropfer gehörig zu kennzeichnen.
  - severity: low
    issue: Die Fußnote gibt die Konstruktverbindung mit „einer Feueropfergabe“ wieder.
    rationale: „Feueropfer“ entspricht dem technischen Ausdruck אִשֶּׁה unmittelbarer; außerdem sollte die Fußnote die im Haupttext gewählte genitivische Beziehung transparent machen.
  revised_text: 'Der Priester soll es auf dem Altar in Rauch aufgehen lassen: als Speise eines Feueropfers für Jahwe.[a]'
