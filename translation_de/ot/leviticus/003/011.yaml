  text: וְ/הִקְטִיר֥/וֹ הַ/כֹּהֵ֖ן הַ/מִּזְבֵּ֑חָ/ה לֶ֥חֶם אִשֶּׁ֖ה לַ/יהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/011.yaml
  text: The priest shall burn it on the altar as food[a], an offering made by fire to Yahweh.
translation:
  language: de
  text: 'Der Priester soll es auf dem Altar in Rauch aufgehen lassen: als Speise eines Feueropfers für Jahwe.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »Brot eines Feueropfers für Jahwe«; »Brot« bezeichnet hier im Opferidiom allgemein Speise.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִירוֹ
  choice: soll es … in Rauch aufgehen lassen
  rationale: Der Hifil von קטר bezeichnet im Opferzusammenhang das Verbrennen auf dem Altar, wobei die Gabe als Rauch aufsteigt. Die Formulierung bewahrt diese konkrete Nuance.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Übliche und sachlich eindeutige Wiedergabe im kultischen Zusammenhang.
- source_word: הַמִּזְבֵּחָה
  choice: auf dem Altar
  rationale: Das Richtungs-He am Substantiv bezeichnet hier das Hinbringen beziehungsweise Darbringen auf dem Altar.
- source_word: לֶחֶם
  choice: Speise
  rationale: לֶחֶם bedeutet häufig wörtlich »Brot«, bezeichnet hier im Opferidiom jedoch die auf dem Altar dargebrachte Speise; »Speise« vermeidet den falschen Eindruck, es handle sich um gebackenes Brot.
- source_word: אִשֶּׁה
  choice: Feueropfergabe
  rationale: Der kultische Fachausdruck bezeichnet eine durch Feuer dargebrachte Gabe. »Feueropfergabe« ist knapp und hält sowohl den Opfer- als auch den Gabecharakter fest.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition ל kennzeichnet hier den Empfänger beziehungsweise die Widmung der Opfergabe; der Gottesname wird als »Jahwe« wiedergegeben.
theological_decisions:
- issue: Das Opferidiom לֶחֶם אִשֶּׁה
  choice: als Speise, eine Feueropfergabe
  alternative: Brot einer Feueropfergabe
  rationale: Die Wiedergabe wahrt die kultische Rede von der Altarportion als »Speise«, ohne eine körperliche Nahrungsbedürftigkeit Gottes auszusagen oder fälschlich buchstäbliches Brot vorauszusetzen. Die Apposition lässt zugleich die knappe Beziehung der beiden hebräischen Begriffe offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »In Rauch aufgehen lassen« bildet den kultischen Vorgang genauer ab als das allgemeinere »verbrennen«. Der Doppelpunkt verdeutlicht die knappe appositionelle Beschreibung des Hebräischen.
