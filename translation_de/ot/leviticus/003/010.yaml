source:
  edition: WLC
  text: וְ/אֵת֙ שְׁתֵּ֣י הַ/כְּלָיֹ֔ת וְ/אֶת הַ/חֵ֨לֶב֙ אֲשֶׁ֣ר עֲלֵ/הֶ֔ן אֲשֶׁ֖ר עַל הַ/כְּסָלִ֑ים וְ/אֶת הַ/יֹּתֶ֨רֶת֙ עַל הַ/כָּבֵ֔ד עַל הַ/כְּלָיֹ֖ת יְסִירֶֽ/נָּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/010.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, which he shall remove with the kidneys.
translation:
  language: de
  text: und die beiden Nieren samt dem Fett an ihnen, das an den Lenden sitzt, sowie den Fortsatz[a] an der Leber; diesen soll er zusammen mit den Nieren entfernen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Lappen“. Die genaue Bedeutung des hebräischen Ausdrucks für diesen Körperteil (יֹתֶרֶת) ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: die beiden Nieren
  rationale: Die Wendung bezeichnet im Zusammenhang der Opferanweisungen eindeutig die zwei Nieren.
- source_word: הַחֵלֶב
  choice: das Fett
  rationale: חֵלֶב bezeichnet hier das für die Opferung bestimmte innere Fett. „Fett“ ist verständlich und gibt den kultischen Kontext ohne unnötige anatomische Verengung wieder.
- source_word: אֲשֶׁר עֲלֵהֶן
  choice: an ihnen
  rationale: Die Formulierung bewahrt die räumliche Zuordnung des Fettes zu den Nieren und klingt im modernen Deutschen natürlich.
- source_word: הַכְּסָלִים
  choice: die Lenden
  rationale: כְּסָלִים bezeichnet den Lenden- beziehungsweise Flankenbereich. „Lenden“ wahrt die traditionelle anatomische Bezeichnung, ohne die Aussage stärker festzulegen als der hebräische Ausdruck.
- source_word: הַיֹּתֶרֶת
  choice: der Fortsatz
  rationale: Die genaue anatomische Bedeutung des seltenen Ausdrucks ist unsicher. „Fortsatz“ gibt eine mit der Leber verbundene Struktur wieder, ohne sie vorschnell als bestimmten Leberlappen zu identifizieren.
- source_word: עַל הַכָּבֵד
  choice: an der Leber
  rationale: עַל bezeichnet hier eine räumliche Lage oder Verbindung. „An der Leber“ lässt die genaue anatomische Beziehung offen.
- source_word: עַל הַכְּלָיֹת
  choice: zusammen mit den Nieren
  rationale: In der wiederkehrenden Opferformel beschreibt die Wendung die gemeinsame Entfernung des Leberfortsatzes und der Nieren. Diese Wiedergabe ist im Deutschen verständlich und entspricht dem Verfahrenszusammenhang.
- source_word: יְסִירֶנָּה
  choice: diesen soll er ... entfernen
  rationale: Das Hifil von סור bedeutet hier „entfernen“. Das feminine Suffix bezieht sich auf יֹתֶרֶת; das Demonstrativpronomen macht diesen Bezug im Deutschen eindeutig.
