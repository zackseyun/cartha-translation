  text: חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם בְּ/כֹ֖ל מֽוֹשְׁבֹתֵי/כֶ֑ם כָּל חֵ֥לֶב וְ/כָל דָּ֖ם לֹ֥א תֹאכֵֽלוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/017.yaml
  text: 'It shall be a permanent statute throughout your generations, in all your dwellings: you shall eat neither any fat nor any blood.'
translation:
  language: de
  text: 'Dies soll eine bleibende Satzung[a] für alle eure Generationen sein, überall, wo ihr wohnt: Ihr sollt weder Fett noch Blut essen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eine ewige Satzung« oder »eine immerwährende Satzung«. Das hebräische Wort עוֹלָם bezeichnet in Rechtsformeln häufig eine dauerhaft fortgeltende Ordnung.'
    reason: lexikalische Alternative und Bewahrung der Bedeutungsbreite von עוֹלָם
lexical_decisions:
- source_word: חֻקַּת
  choice: Satzung
  rationale: חֻקָּה bezeichnet eine festgesetzte, verbindliche Vorschrift. »Satzung« bewahrt den rechtlich-bundestheologischen Klang und ist im Deutschen verständlich.
- source_word: עוֹלָם
  choice: bleibende
  rationale: In dieser Rechtsformel bezeichnet עוֹלָם fortdauernde, generationenübergreifende Geltung. »Bleibend« gibt dies natürlich wieder, ohne die mögliche Bedeutung vorschnell auf metaphysische Endlosigkeit festzulegen.
- source_word: לְדֹרֹתֵיכֶם
  choice: für alle eure Generationen
  rationale: Die Wendung beschreibt die Geltung über die aufeinanderfolgenden Generationen hinweg. Das im Deutschen ergänzte »alle« macht diesen umfassenden Sinn deutlich.
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  choice: überall, wo ihr wohnt
  rationale: מוֹשָׁב bezeichnet Wohn- oder Aufenthaltsorte. Die Wiedergabe ist modernes, natürliches Deutsch und bewahrt den räumlich umfassenden Geltungsbereich.
- source_word: כָּל חֵלֶב וְכָל דָּם
  choice: weder Fett noch Blut
  rationale: כָּל hat im negierten Verbot umfassende Kraft. Die deutsche Konstruktion »weder … noch« drückt das Verbot beider Stoffe klar und idiomatisch aus.
- source_word: לֹא תֹאכֵלוּ
  choice: Ihr dürft … nicht essen / Ihr dürft weder … noch … essen
  rationale: Der Imperfekt mit לֹא formuliert hier ein verbindliches Verbot. »Ihr dürft« ist im heutigen Deutschen klar, würdig und rechtlich eindeutig.
theological_decisions:
- issue: Dauer der Satzung in עוֹלָם
  choice: bleibende Satzung
  alternative: ewige Satzung; immerwährende Satzung
  rationale: Die hebräische Rechtsformel betont die fortdauernde Geltung über die Generationen hinweg. »Bleibend« erhält diese Aussage, ohne festzulegen, ob עוֹלָם hier philosophisch absolute Endlosigkeit bezeichnet.
- issue: Geltungsbereich des Verbots
  choice: überall, wo ihr wohnt
  alternative: in allen euren Wohnsitzen
  rationale: Die Vorschrift gilt nach dem hebräischen Wortlaut an sämtlichen Wohnorten. Die natürliche deutsche Formulierung vermeidet eine Einschränkung auf das Heiligtum oder das verheißene Land, die der Vers selbst nicht ausdrücklich vornimmt.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Rechtsstil. Die hebräische Nominalformel wird durch »Dies ist« zu einem natürlichen deutschen Satz ergänzt. »Überall, wo ihr wohnt« vermeidet das heute ungebräuchlich wirkende »in allen euren Wohnsitzen«.
