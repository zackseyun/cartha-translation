    rationale: In „er sie von den Rindern darbringt … soll er es … darbringen“ kann das feminine „sie“ auf „Opfergabe“ und das neutrale „es“ auf „Tier“ bezogen werden, obwohl der hebräische Text in beiden Fällen das dargebrachte Opfertier meint. Die explizite Nennung eines Rindes stellt den Bezug klar.
  - severity: low
    issue: Die zweite Kondition wird nicht deutlich genug abgebildet
    rationale: 'Das Hebräische setzt nach der Benennung des Heilsopfers nochmals an: „wenn er [es] vom Rindvieh darbringt“. Eine Formulierung mit „und er ein Rind darbringt“ bildet diese sachliche weitere Bedingung im Deutschen klar und flüssig ab.'
