id: LEV.3.1
reference: Leviticus 3:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אִם זֶ֥בַח שְׁלָמִ֖ים קָרְבָּנ֑/וֹ אִ֤ם מִן הַ/בָּקָר֙ ה֣וּא מַקְרִ֔יב אִם זָכָר֙ אִם נְקֵבָ֔ה תָּמִ֥ים יַקְרִיבֶ֖/נּוּ לִ/פְנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/001.yaml
  text: If his offering is a sacrifice of peace offerings[a], if he offers it from the herd, whether male or female[b], he shall offer it without blemish before Yahweh.
translation:
  language: de
  text: Wenn seine Opfergabe ein Heilsopfer[a] ist und er ein Rind darbringt, sei es männlich oder weiblich, soll er es fehlerlos vor Jahwe darbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »ein Schlachtopfer von Heilsopfern«; auch »Friedensopfer« oder »Gemeinschaftsopfer«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶבַח שְׁלָמִים
  choice: Heilsopfer
  rationale: Die Verbindung bezeichnet eine bestimmte Art von Schlachtopfer. »Heilsopfer« gibt den Bedeutungsbereich von Wohlergehen, Heil und Frieden knapp wieder; die formale Konstruktion und weitere gebräuchliche Benennungen werden in der Fußnote offengelegt.
- source_word: קָרְבָּנוֹ
  choice: seine Opfergabe
  rationale: קָרְבָּן bezeichnet allgemein eine Gott dargebrachte Gabe. »Opfergabe« ist im kultischen Zusammenhang klar und im modernen Deutsch natürlich.
- source_word: מִן הַבָּקָר
  choice: von den Rindern
  rationale: בָּקָר bezeichnet hier Rinder beziehungsweise Großvieh. »Von den Rindern« benennt die Tiergruppe präzise und verständlich.
- source_word: מַקְרִיב / יַקְרִיבֶנּוּ
  choice: darbringt / soll er es ... darbringen
  rationale: Der Hifil von קרב bedeutet im Opferkontext »darbringen« oder »als Opfer präsentieren«. Die wiederholte Wortwahl bildet die Wiederholung des hebräischen Verbs ab.
- source_word: אִם זָכָר אִם נְקֵבָה
  choice: sei es ein männliches oder ein weibliches Tier
  rationale: Die paarige Konstruktion אִם ... אִם lässt beide Geschlechter zu. Die Ergänzung »Tier« macht die substantivisch gebrauchten Adjektive im Deutschen eindeutig.
- source_word: תָּמִים
  choice: ohne Fehler
  rationale: Im Opferrecht bezeichnet תָּמִים ein Tier ohne körperlichen Makel. »Ohne Fehler« ist präzise, verständlich und weniger altertümlich als »makellos«.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי bedeutet »vor« beziehungsweise »in der Gegenwart von«; der Gottesname יהוה wird als »Jahwe« wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Tetragrammaton. »Jahwe« gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Benennung der Opferart שְׁלָמִים
  choice: Heilsopfer
  alternative: Friedensopfer oder Gemeinschaftsopfer
  rationale: Der Ausdruck hat einen breiten Bedeutungsbereich, der Heil, Wohlergehen und Frieden einschließt. »Heilsopfer« vermeidet eine vorschnelle Beschränkung auf zwischenmenschliche Gemeinschaft; die anderen möglichen Wiedergaben bleiben in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der konditionale Gesetzesstil und die Wiederholung von »darbringen« bleiben erhalten. Die schwerfällige wörtliche Verbindung »Schlachtopfer von Heilsopfern« steht nicht im Haupttext, wird aber in der Fußnote dokumentiert.
