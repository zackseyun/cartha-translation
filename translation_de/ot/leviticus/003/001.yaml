  to: Wenn seine Opfergabe ein Heilsopfer[a] ist und er ein Rind darbringt, sei es männlich oder weiblich, soll er es fehlerlos vor Jahwe darbringen.
  rationale: Die Revision klärt, dass sich die Vorschriften auf ein als Opfer dargebrachtes Rind beziehen, ohne den offenen Charakter der hebräischen Tierkategorie zu verändern. Die zulässigen Geschlechter, die Fehlerlosigkeit und die Wiederholung von „darbringen“ bleiben erhalten. Die Fußnote ist weiterhin korrekt am Ausdruck für die Opferart verankert.
