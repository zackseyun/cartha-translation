source:
  edition: WLC
  text: וְ/אִם מִן הַ/צֹּ֧אן קָרְבָּנ֛/וֹ לְ/זֶ֥בַח שְׁלָמִ֖ים לַ/יהוָ֑ה זָכָר֙ א֣וֹ נְקֵבָ֔ה תָּמִ֖ים יַקְרִיבֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/006.yaml
  text: And if his offering for a sacrifice of peace offerings to Yahweh is from the flock[a], male or female, he shall offer it without blemish.
translation:
  language: de
  text: Und wenn seine Opfergabe als Friedensopfer[a] für Jahwe vom Kleinvieh stammt, soll er ein männliches oder weibliches Tier ohne Fehler darbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch „Gemeinschaftsopfer“. Der hebräische Ausdruck שְׁלָמִים wird traditionell mit „Friedensopfer“ wiedergegeben, kann aber auch das gemeinsame Wohlergehen oder die Gemeinschaft beim Opfermahl betonen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Und wenn
  rationale: Bewahrt sowohl die Verknüpfung mit den vorausgehenden Opferbestimmungen als auch den bedingenden Sinn.
- source_word: מִן הַצֹּאן
  choice: vom Kleinvieh
  rationale: צֹאן bezeichnet kollektiv vor allem Schafe und Ziegen; „Kleinvieh“ gibt den Umfang präzise wieder, ohne eine Tierart festzulegen.
- source_word: קָרְבָּנוֹ
  choice: seine Opfergabe
  rationale: קָרְבָּן ist hier die zum Heiligtum gebrachte Gabe und wird im kultischen Zusammenhang natürlich als „Opfergabe“ wiedergegeben.
- source_word: לְזֶבַח שְׁלָמִים
  choice: als Friedensmahlopfer
  rationale: Die Wiedergabe verbindet den traditionellen Friedensaspekt von שְׁלָמִים mit dem Opfermahl, das bei dieser Opferart eine wesentliche Rolle spielt; die mögliche Betonung von Gemeinschaft wird in der Fußnote offengehalten.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition kennzeichnet die Bestimmung der Opfergabe; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: זָכָר אוֹ נְקֵבָה
  choice: ein männliches oder weibliches Tier
  rationale: Die biologische Unterscheidung wird ausdrücklich bewahrt; „Tier“ wird für natürliches Deutsch aus dem Kontext ergänzt.
- source_word: תָּמִים
  choice: ohne Fehler
  rationale: Im Opferrecht bezeichnet תָּמִים ein Tier ohne körperlichen Makel oder Defekt.
- source_word: יַקְרִיבֶנּוּ
  choice: soll er … darbringen
  rationale: Die Hifil-Form von קרב bezeichnet im Opferkontext das rituelle Heranbringen beziehungsweise Darbringen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה; „Jahwe“ gibt den offenbarten Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von שְׁלָמִים
  choice: Friedensmahlopfer
  alternative: Gemeinschaftsopfer
  rationale: Die genaue Bedeutungsnuance des Fachbegriffs ist umstritten. „Friedensmahlopfer“ wahrt den Bezug zu Frieden beziehungsweise Wohlergehen und zum gemeinsamen Opfermahl; die alternative Betonung der Gemeinschaft wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kultischen Fachbegriffe bleiben erkennbar, werden jedoch in einer für heutige Leser verständlichen Satzstruktur wiedergegeben.
