id: LEV.3.12
reference: Leviticus 3:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אִ֥ם עֵ֖ז קָרְבָּנ֑/וֹ וְ/הִקְרִיב֖/וֹ לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/012.yaml
  text: But if his offering is a goat[a], then he shall present it before Yahweh.
translation:
  language: de
  text: Wenn seine Opfergabe aber eine Ziege ist, soll er sie vor Jahwe[a] darbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH, der Gottesname; traditionell mit »der HERR« wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: Wenn … aber
  rationale: Die Verbindung aus Konjunktion und Bedingung leitet innerhalb der Opferbestimmungen einen weiteren Fall ein. Die deutsche Wortstellung mit »aber« kennzeichnet den Übergang natürlich, ohne einen starken Gegensatz zu erzeugen.
- source_word: עֵז
  choice: eine Ziege
  rationale: Das Substantiv bezeichnet eine Ziege beziehungsweise ein Tier aus der Gattung der Ziegen. Der unbestimmte Artikel ist im Deutschen für den prädikativen Gebrauch erforderlich.
- source_word: קָרְבָּנוֹ
  choice: seine Opfergabe
  rationale: קָרְבָּן ist die allgemeine Bezeichnung für eine dargebrachte Gabe. »Opfergabe« bewahrt den kultischen Zusammenhang, ohne den Ausdruck unnötig auf eine bestimmte Opferhandlung zu verengen.
- source_word: וְהִקְרִיבוֹ
  choice: soll er sie … darbringen
  rationale: Der Hifil von קרב bezeichnet hier das Heranbringen beziehungsweise Präsentieren als Opfer. »Darbringen« ist im Deutschen klar und kultisch passend; »soll« gibt die rechtlich-anweisende Funktion der Verbform wieder.
- source_word: לִפְנֵי
  choice: vor
  rationale: »Vor« gibt die räumliche und kultische Bedeutung knapp und idiomatisch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Text enthält den Gottesnamen JHWH. »Jahwe« gibt den Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. Die Umschrift »Jahwe« bewahrt den Charakter als persönlicher Gottesname; die traditionelle Wiedergabe »der HERR« wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist knapp und gesetzessprachlich, bleibt aber für heutige Leser gut verständlich. Das Pronomen »sie« bezieht sich grammatisch sowohl auf die Opfergabe als auch auf die Ziege.
