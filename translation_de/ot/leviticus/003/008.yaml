  variant: modern standard German
source:
  edition: WLC
  text: וְ/סָמַ֤ךְ אֶת יָד/וֹ֙ עַל רֹ֣אשׁ קָרְבָּנ֔/וֹ וְ/שָׁחַ֣ט אֹת֔/וֹ לִ/פְנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וְ֠/זָרְקוּ בְּנֵ֨י אַהֲרֹ֧ן אֶת דָּמ֛/וֹ עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/008.yaml
  text: He shall lay his hand on the head of his offering and slaughter it before the tent of meeting[a], and Aaron’s sons shall throw its blood against the altar all around.
translation:
  language: de
  text: Er soll seine Hand auf den Kopf seiner Opfergabe legen und sie vor dem Zelt der Begegnung schlachten. Dann sollen die Söhne Aarons ihr Blut ringsum an den Altar sprengen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werfen“ oder „schleudern“. Das hebräische Verb bezeichnet hier eine kräftige rituelle Bewegung, nicht ein sanftes Besprengen.'
    reason: lexikalische Alternative und Klärung der Art der Blutanwendung
lexical_decisions:
- source_word: וְסָמַךְ
  choice: soll … legen
  rationale: Im Opferkontext bezeichnet סמך das rituelle Auflegen beziehungsweise Aufstützen der Hand. „legen“ ist im Deutschen natürlich und lässt das genaue Maß des ausgeübten Drucks offen.
- source_word: יָדוֹ
  choice: seine Hand
  rationale: Der hebräische Singular mit Suffix der 3. Person maskulin Singular wird direkt wiedergegeben.
- source_word: רֹאשׁ
  choice: den Kopf
  rationale: Die übliche anatomische Bedeutung passt zur Opferanweisung.
- source_word: קָרְבָּנוֹ
  choice: seiner Opfergabe
  rationale: קָרְבָּן bezeichnet etwas, das Gott als Gabe dargebracht wird. „Opfergabe“ bewahrt sowohl den Darbringungs- als auch den Opferkontext.
- source_word: וְשָׁחַט
  choice: schlachten
  rationale: Das Verb ist der sachgerechte Ausdruck für das rituelle Schlachten eines Opfertiers und genauer als das allgemeine „töten“.
- source_word: לִפְנֵי
  choice: vor
  rationale: Die knappe räumlich-kultische Wendung entspricht dem Hebräischen und ist im Deutschen idiomatisch.
- source_word: אֹהֶל מוֹעֵד
  choice: Zelt der Begegnung
  rationale: Die Bezeichnung gibt sowohl אֹהֶל („Zelt“) als auch מוֹעֵד in seiner Bedeutung als festgesetzte Begegnung wieder.
- source_word: וְזָרְקוּ
  choice: sollen … sprengen
  rationale: זרק bezeichnet hier ein kräftiges rituelles Werfen beziehungsweise Schleudern des Blutes. „sprengen“ ist der etablierte deutsche Kultausdruck, darf aber nicht als sanftes Besprengen verstanden werden; deshalb wird die Nuance in einer Fußnote erläutert.
- source_word: בְּנֵי אַהֲרֹן
  choice: die Söhne Aarons
  rationale: Die konkrete männliche Verwandtschaftsbezeichnung des Hebräischen bleibt erhalten.
- source_word: דָּמוֹ
  choice: ihr Blut
  rationale: Das Suffix bezieht sich auf die im Deutschen feminine „Opfergabe“ beziehungsweise auf das darin eingeschlossene Opfertier; das Pronomen folgt dem deutschen Genus.
- source_word: עַל הַמִּזְבֵּחַ
  choice: an den Altar
  rationale: In Verbindung mit זרק bezeichnet עַל das Aufbringen des Blutes auf beziehungsweise gegen den Altar. „an den Altar“ vermittelt im Deutschen die seitliche Zielrichtung besser als eine bloße Lage oben auf dem Altar.
- source_word: סָבִיב
  choice: ringsum
  rationale: Das Adverb zeigt an, dass das Blut rund um den Altar angebracht wird.
theological_decisions:
- issue: Rituelles Auflegen der Hand
  choice: Die Handlung wird schlicht als „seine Hand … legen“ beschrieben.
  alternative: „seine Hand darauf stützen“ oder eine deutende Formulierung, die Schuldübertragung beziehungsweise Identifikation ausdrücklich macht
  rationale: Der Vers nennt die rituelle Handlung, erklärt aber ihre theologische Bedeutung nicht. Die Übersetzung vermeidet daher eine dogmatische Festlegung.
- issue: Geschlechtsspezifische Bezeichnung בְּנֵי אַהֲרֹן
  choice: die Söhne Aarons
  alternative: die Nachkommen Aarons; die Priester
  rationale: Der Ausgangstext bezeichnet ausdrücklich Aarons Söhne. Eine Verallgemeinerung würde die konkrete Formulierung verdecken.
- issue: Art der Blutanwendung am Altar
  choice: „an den Altar sprengen“ mit erklärender Fußnote
  alternative: an den Altar werfen; gegen den Altar schleudern; auf den Altar sprengen
  rationale: Die Übersetzung wahrt den kultischen Fachgebrauch und stellt zugleich klar, dass eine kräftige Wurfbewegung gemeint ist, nicht ein sanftes Versprengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer kultischer Terminologie. Der Satzbau wurde für natürliche deutsche Lesbarkeit in zwei Sätze gegliedert; die Abfolge der hebräischen Handlungen bleibt erhalten.
