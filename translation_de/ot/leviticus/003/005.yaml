  text: וְ/הִקְטִ֨ירוּ אֹת֤/וֹ בְנֵֽי אַהֲרֹן֙ הַ/מִּזְבֵּ֔חָ/ה עַל הָ֣/עֹלָ֔ה אֲשֶׁ֥ר עַל הָ/עֵצִ֖ים אֲשֶׁ֣ר עַל הָ/אֵ֑שׁ אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַֽ/יהוָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/005.yaml
  text: And Aaron’s sons shall burn it on the altar[a], on top of the burnt offering that is on the wood that is on the fire. It is a food offering, a pleasing aroma to Yahweh.
translation:
  language: de
  text: Und Aarons Söhne sollen es auf dem Altar in Rauch aufgehen lassen, auf dem Brandopfer, das auf dem Holz liegt, das auf dem Feuer liegt. Es ist ein Feueropfer[a], ein angenehmer Duft für Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine im Feuer dargebrachte Opfergabe“; möglicherweise: „eine Speisegabe“.'
    reason: Lexikalische Alternative bei dem kultischen Fachwort אִשֶּׁה; die mögliche Speisebedeutung wird wegen der unsicheren Herleitung vorsichtig formuliert.
lexical_decisions:
- source_word: וְהִקְטִירוּ
  choice: sollen es … in Rauch aufgehen lassen
  rationale: Der Hifil von קטר bezeichnet im Opferkontext das Verbrennen auf dem Altar mit dem Ergebnis, dass die Gabe als Rauch aufsteigt. Die Wiedergabe bewahrt diesen kultischen Sinn genauer als das allgemeinere „verbrennen“.
- source_word: בְנֵי אַהֲרֹן
  choice: die Söhne Aarons
  rationale: Natürliche deutsche Wiedergabe der Status-constructus-Verbindung; zugleich bleibt die priesterliche Familienbezeichnung erhalten.
- source_word: הַמִּזְבֵּחָה
  choice: auf dem Altar
  rationale: Das lokale He ist hier idiomatisch als Ziel beziehungsweise Ort der Opferhandlung wiedergegeben.
- source_word: עַל הָעֹלָה
  choice: auf dem Brandopfer
  rationale: עַל bezeichnet am ehesten die Lage auf beziehungsweise über dem bereits aufgeschichteten Brandopfer. „Brandopfer“ ist die etablierte und sachgerechte Wiedergabe von עֹלָה.
- source_word: אֲשֶׁר עַל הָעֵצִים אֲשֶׁר עַל הָאֵשׁ
  choice: das auf dem Holz über dem Feuer liegt
  rationale: Die räumliche Anordnung wird verständlich wiedergegeben. Das zweite עַל ist mit „über“ übersetzt, da Holz nicht sinnvoll auf dem Feuer ruht, sondern sich über der Flamme beziehungsweise Glut befindet.
- source_word: אִשֵּׁה
  choice: Feueropfer
  rationale: Der technische Opferbegriff hängt etymologisch und sachlich mit Feuer zusammen. „Feueropfer“ ist im Deutschen knapp und verständlich; die ebenfalls mögliche Deutung als Speisegabe wird in der Fußnote bewahrt.
- source_word: רֵיחַ נִיחֹחַ
  choice: ein angenehmer Duft
  rationale: Die feste Opferformel bezeichnet einen für Gott wohlgefälligen Geruch. „Angenehmer Duft“ ist natürlich und vermeidet die mögliche Fehlvorstellung, Gott müsse besänftigt werden.
- source_word: לַיהוָה
  choice: für Yahweh
  rationale: ל bezeichnet hier die Ausrichtung beziehungsweise Bestimmung des Opfers. Der Gottesname wird als „Yahweh“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der persönliche Bundesname steht ausdrücklich im hebräischen Text. „Yahweh“ gibt ihn als Namen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung des technischen Ausdrucks אִשֵּׁה
  choice: Feueropfer
  alternative: Speiseopfer; Speisegabe; Gabe, die im Feuer dargebracht wird
  rationale: Die genaue Ableitung und Bedeutungsbreite des kultischen Fachworts ist umstritten. „Feueropfer“ bewahrt den klaren Bezug zur Verbrennung; die kultische Speisedeutung bleibt als echte Alternative in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt der rituellen Abfolge des Hebräischen, wird aber bei der Beschreibung von Holz und Feuer leicht geglättet. Der technische Ausdruck אִשֵּׁה bleibt durch Haupttext und Fußnote bewusst offen.
