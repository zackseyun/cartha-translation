id: LEV.3.7
reference: Leviticus 3:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אִם כֶּ֥שֶׂב הֽוּא מַקְרִ֖יב אֶת קָרְבָּנ֑/וֹ וְ/הִקְרִ֥יב אֹת֖/וֹ לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/007.yaml
  text: If he is presenting a sheep as his offering[a], then he shall present it before Yahweh.
translation:
  language: de
  text: Wenn er ein Schaf als seine Opfergabe darbringt[a], soll er es vor Jahwe darbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ein Lamm als seine Opfergabe.'
    reason: 'Lexikalische Alternative: כֶּשֶׂב kann je nach Zusammenhang auch ein Lamm beziehungsweise junges Schaf bezeichnen.'
lexical_decisions:
- source_word: אִם
  choice: Wenn
  rationale: Leitet innerhalb der Opferbestimmungen einen Bedingungsfall ein; „wenn“ ist im Deutschen die natürliche Entsprechung.
- source_word: כֶּשֶׂב
  choice: Schaf
  rationale: Der Ausdruck kann ein Schaf, häufig auch ein junges Schaf beziehungsweise Lamm, bezeichnen. „Schaf“ wahrt hier die allgemeinere Bedeutung; die engere Möglichkeit wird in der Fußnote genannt.
- source_word: מַקְרִיב
  choice: darbringt
  rationale: Das Hifil-Partizip von קרב bezeichnet das Heranbringen beziehungsweise Darbringen einer Gabe. Im deutschen Bedingungssatz gibt das Präsens den fallsetzenden Charakter natürlich wieder.
- source_word: קָרְבָּנוֹ
  choice: seine Opfergabe
  rationale: קָרְבָּן ist die allgemeine Bezeichnung für eine Gott dargebrachte Gabe. „Opfergabe“ ist verständlich und vermeidet die mögliche Verengung von „Opfer“.
- source_word: וְהִקְרִיב אֹתוֹ
  choice: soll er es darbringen
  rationale: In diesem gesetzlichen Zusammenhang drückt die Verbform eine Anweisung aus; „soll“ gibt diesen normativen Sinn idiomatisch wieder.
- source_word: לִפְנֵי
  choice: vor
  rationale: Entspricht der räumlichen und kultischen Bedeutung des Ausdrucks knapp und natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „darbringen“ spiegelt bewusst die hebräische Wiederaufnahme desselben Verbstamms wider; „Opfergabe“ hält den kultischen Bezug klar, ohne den Oberbegriff unnötig einzuengen.
