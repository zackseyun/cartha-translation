source:
  edition: WLC
  text: וְ/הִקְרִ֤יב מִמֶּ֨/נּוּ֙ קָרְבָּנ֔/וֹ אִשֶּׁ֖ה לַֽ/יהוָ֑ה אֶת הַ/חֵ֨לֶב֙ הַֽ/מְכַסֶּ֣ה אֶת הַ/קֶּ֔רֶב וְ/אֵת֙ כָּל הַ/חֵ֔לֶב אֲשֶׁ֖ר עַל הַ/קֶּֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/014.yaml
  text: 'And from it he shall present his offering[a], a food offering to Yahweh: the fat that covers the entrails, and all the fat that is on the entrails,'
translation:
  language: de
  text: 'Davon soll er seine Opfergabe darbringen, ein Feueropfer für Jahwe: das Fett, das die Eingeweide bedeckt, und alles Fett, das an den Eingeweiden ist.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: soll er … darbringen
  rationale: Der Hifil von קרב bezeichnet im Opferkontext das rituelle Darbringen beziehungsweise Heranbringen einer Gabe. „Darbringen“ ist im Deutschen klar und angemessen würdevoll.
- source_word: מִמֶּנּוּ
  choice: davon
  rationale: Das Suffix verweist auf das zuvor genannte Opfertier. „Davon“ gibt den partitivischen Sinn natürlich wieder.
- source_word: קָרְבָּנוֹ
  choice: seine Opfergabe
  rationale: קָרְבָּן ist hier ein kultischer Fachbegriff. „Opfergabe“ bezeichnet sowohl die dargebrachte Gabe als auch ihren Opfercharakter.
- source_word: אִשֶּׁה
  choice: ein Feueropfer
  rationale: Die genaue Herleitung und Bedeutung des priesterlichen Ausdrucks ist umstritten. „Feueropfer“ bewahrt die traditionelle Verbindung mit dem Verbrennen, ohne die mögliche Speiseterminologie als sicher vorauszusetzen.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Das ל bezeichnet hier den Empfänger beziehungsweise die Bestimmung des Opfers; „für“ ist im Deutschen idiomatisch. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: הַחֵלֶב
  choice: das Fett
  rationale: חֵלֶב bezeichnet in diesem Opfergesetz die bestimmten Fettpartien des Tieres, die verbrannt werden sollen.
- source_word: הַמְכַסֶּה
  choice: das … bedeckt
  rationale: Das Partizip wird als natürlicher deutscher Relativsatz wiedergegeben.
- source_word: הַקֶּרֶב
  choice: die Eingeweide
  rationale: קֶרֶב meint hier die inneren Bauchorgane beziehungsweise den Bereich der Eingeweide. „Eingeweide“ ist konkret und im kultisch-anatomischen Kontext verständlich.
- source_word: וְאֵת כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: und alles Fett, das an den Eingeweiden ist
  rationale: „An“ gibt die räumliche Zuordnung von עַל im natürlichen Deutschen genauer wieder als das hier missverständliche „auf“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ macht den Bundesnamen sichtbar und vermeidet, ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von אִשֶּׁה
  choice: Feueropfer
  alternative: Speiseopfer; eine durchs Feuer dargebrachte Gabe
  rationale: Der Ausdruck ist lexikalisch nicht völlig sicher. „Feueropfer“ wahrt den traditionellen Opferbezug und legt nicht eindeutig fest, dass der Begriff selbst „Speise“ bedeutet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer kultischer Terminologie. Die Satzstruktur folgt dem Hebräischen eng, bleibt aber idiomatisch. Da keine Fußnote erforderlich ist, enthält der Haupttext keine Fußnotenmarkierung.
