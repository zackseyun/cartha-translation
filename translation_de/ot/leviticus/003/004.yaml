  text: וְ/אֵת֙ שְׁתֵּ֣י הַ/כְּלָיֹ֔ת וְ/אֶת הַ/חֵ֨לֶב֙ אֲשֶׁ֣ר עֲלֵ/הֶ֔ן אֲשֶׁ֖ר עַל הַ/כְּסָלִ֑ים וְ/אֶת הַ/יֹּתֶ֨רֶת֙ עַל הַ/כָּבֵ֔ד עַל הַ/כְּלָי֖וֹת יְסִירֶֽ/נָּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/004.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, with the kidneys, he shall remove.
translation:
  language: de
  text: auch die beiden Nieren und das Fett auf ihnen, das an den Lenden liegt, sowie den Anhang an der Leber[a]. Ihn soll er zusammen mit den Nieren abtrennen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Lappen an der Leber«. Welcher Körperteil mit dem hebräischen Ausdruck genau gemeint ist, ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: die beiden Nieren
  rationale: כְּלָיוֹת bezeichnet hier eindeutig die Nieren als anatomische Organe; »die beiden Nieren« ist direkt und natürlich.
- source_word: הַחֵלֶב
  choice: das Fett
  rationale: חֵלֶב bezeichnet im Opferkontext die für die Darbringung bestimmten Fettteile. »Fett« ist verständlich und sachlich; »Talg« wäre technischer.
- source_word: אֲשֶׁר עֲלֵהֶן
  choice: auf ihnen
  rationale: Die Wendung beschreibt die Lage des Fetts auf den Nieren und bewahrt den räumlichen Sinn von עַל.
- source_word: הַכְּסָלִים
  choice: die Lenden
  rationale: כְּסָלִים bezeichnet den Lenden- beziehungsweise Flankenbereich. »Lenden« passt zum anatomischen und kultischen Sprachgebrauch.
- source_word: הַיֹּתֶרֶת
  choice: der Anhang
  rationale: Der genaue anatomische Bezug von יוֹתֶרֶת ist unsicher. »Anhang« hält diese Unsicherheit offen, während »Lappen« bereits eine genauere Identifikation voraussetzt.
- source_word: עַל הַכָּבֵד
  choice: an der Leber
  rationale: עַל bezeichnet hier die anatomische Lage oder Verbindung. »An der Leber« klingt im Deutschen natürlich, ohne so präzise wie »mit der Leber verbunden« zu interpretieren.
- source_word: עַל הַכְּלָיוֹת
  choice: zusammen mit den Nieren
  rationale: In der wiederkehrenden Opferformel beschreibt die Wendung, dass der Leberanhang gemeinsam mit den Nieren abgetrennt wird. Eine rein räumliche Wiedergabe wäre anatomisch missverständlich.
- source_word: יְסִירֶנָּה
  choice: Ihn soll er abtrennen
  rationale: Der Hifil von סור bezeichnet hier das Entfernen eines Opferteils. Das vorangestellte Pronomen gibt das feminine Objektsuffix wieder und bezieht es auf den zuvor genannten Anhang.
