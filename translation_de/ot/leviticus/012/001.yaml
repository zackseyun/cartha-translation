lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Und … redete
  rationale: Das Waw mit der Verbform führt die Erzählung weiter. „Redete“ entspricht der feierlichen, im Deutschen vertrauten Formel für göttliches Sprechen, ohne altertümlich zu wirken.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname JHWH wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶל־מֹשֶׁה
  choice: zu Mose
  rationale: Die Präposition אֶל bezeichnet hier den Adressaten der Rede. „Zu Mose“ ist die natürliche deutsche Wiedergabe.
- source_word: לֵאמֹר
  choice: und sprach
  rationale: Der Infinitiv leitet regelmäßig den Inhalt der folgenden direkten Rede ein. Die deutsche Formel „und sprach“ bewahrt diese Funktion idiomatisch und bereitet den anschließenden Wortlaut vor.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova; der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm JHWH. „Jahwe“ gibt den persönlichen Gottesnamen wieder; die Fußnote weist auf die hebräische Form und eine weitere gebräuchliche Namensform hin.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle Redeformel „redete … und sprach“ bewahrt den feierlichen Charakter und die Struktur des Hebräischen; der Doppelpunkt zeigt an, dass die direkte Rede im folgenden Vers beginnt.
