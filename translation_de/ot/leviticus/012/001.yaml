  yaml_path: translation/ot/leviticus/012/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: de
  text: 'Und Jahwe[a] redete zu Mose und sprach:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „JHWH“; auch als „Jehova“ wiedergegeben.'
