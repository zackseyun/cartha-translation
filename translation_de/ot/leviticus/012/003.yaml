  text: And on the eighth day the flesh of his foreskin shall be circumcised[a].
translation:
  language: de
  text: Und am achten Tag soll das Fleisch seiner Vorhaut beschnitten werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dynamischer: »Am achten Tag soll er beschnitten werden.« Das Hebräische ist formal passiv und spricht wörtlich vom »Fleisch seiner Vorhaut«; der Haupttext bewahrt diese Ausdrucksweise.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/יּוֹם
  choice: Und am … Tag
  rationale: Die Verbindung aus Konjunktion, Präposition und Substantiv wird als natürliche zeitliche Fortführung einer Rechtsanweisung wiedergegeben.
- source_word: הַ/שְּׁמִינִי
  choice: achten
  rationale: Das Ordinaladjektiv bestimmt »Tag« und wird mit der üblichen deutschen Ordnungszahl wiedergegeben.
- source_word: יִמּוֹל
  choice: soll … beschnitten werden
  rationale: Der Nifal-Imperfekt 3. Person Singular ist formal passiv und hat hier vorschreibende Kraft. »Soll … beschnitten werden« bewahrt im Deutschen sowohl das Passiv als auch den rechtlichen Anweisungston.
- source_word: בְּשַׂר
  choice: das Fleisch
  rationale: Das Substantiv bedeutet »Fleisch« und bildet mit dem folgenden Wort eine Genitivverbindung.
- source_word: עָרְלָתוֹ
  choice: seiner Vorhaut
  rationale: Das Substantiv bedeutet »Vorhaut« und trägt ein Suffix der 3. Person maskulin Singular; im Deutschen wird die Verbindung natürlich als »das Fleisch seiner Vorhaut« formuliert.
