id: LEV.12.6
reference: Leviticus 12:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/בִ/מְלֹ֣את יְמֵ֣י טָהֳרָ֗/הּ לְ/בֵן֮ א֣וֹ לְ/בַת֒ תָּבִ֞יא כֶּ֤בֶשׂ בֶּן שְׁנָת/וֹ֙ לְ/עֹלָ֔ה וּ/בֶן יוֹנָ֥ה אוֹ תֹ֖ר לְ/חַטָּ֑את אֶל פֶּ֥תַח אֹֽהֶל מוֹעֵ֖ד אֶל הַ/כֹּהֵֽן׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/006.yaml
  text: And when the days of her purification are completed[a], whether for a son or for a daughter, she shall bring a year-old lamb for a burnt offering, and a young pigeon or a turtledove for a sin offering, to the priest at the entrance of the tent of meeting.
translation:
  language: de
  text: Wenn die Tage ihrer Reinigung nach der Geburt eines Sohnes oder einer Tochter vollendet sind, soll sie ein einjähriges Lamm als Brandopfer und eine junge Taube oder eine Turteltaube als Sündopfer[a] zum Priester an den Eingang des Zeltes der Begegnung bringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Reinigungsopfer“. Der hebräische Ausdruck kann ein Opfer bezeichnen, das rituelle Unreinheit beseitigt, und nicht nur ein Opfer wegen moralischer Verfehlung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִמְלֹאת
  choice: wenn … vollendet sind
  rationale: Die Präposition mit dem Infinitiv von מלא bezeichnet den Abschluss eines Zeitraums; die gewählte Formulierung gibt den zeitlichen Sinn in natürlichem Deutsch wieder.
- source_word: יְמֵי טָהֳרָהּ
  choice: die Tage ihrer Reinigung
  rationale: טָהֳרָה bezeichnet hier rituelle Reinigung beziehungsweise Reinheit. „Reinigung“ bewahrt den kultischen Bezug und ist allgemein verständlich.
- source_word: לְבֵן אוֹ לְבַת
  choice: nach der Geburt eines Sohnes oder einer Tochter
  rationale: Wörtlich steht „für einen Sohn oder für eine Tochter“. Die kontextbezogene Formulierung macht im Deutschen klar, dass die jeweilige Reinigungsfrist nach einer Geburt gemeint ist, ohne den Geltungsbereich zu verändern.
- source_word: תָּבִיא
  choice: soll sie … bringen
  rationale: Der Hifil-Imperfekt hat im Gesetzestext verpflichtenden Charakter. „Soll“ bewahrt den rechtlich-normativen Ton, ohne ihn unnötig zu verschärfen.
- source_word: כֶּבֶשׂ בֶּן שְׁנָתוֹ
  choice: ein einjähriges Lamm
  rationale: Die hebräische Altersangabe bezeichnet ein Lamm im ersten Lebensjahr beziehungsweise von etwa einem Jahr; „einjähriges Lamm“ ist die geläufige knappe deutsche Wiedergabe.
- source_word: לְעֹלָה
  choice: als Brandopfer
  rationale: עֹלָה ist der feste kultische Ausdruck für das vollständig auf dem Altar verbrannte Opfer; „Brandopfer“ ist die etablierte deutsche Bezeichnung.
- source_word: וּבֶן יוֹנָה אוֹ תֹר
  choice: eine junge Taube oder eine Turteltaube
  rationale: בֶּן יוֹנָה bezeichnet eine junge Taube, תֹר dagegen ausdrücklich eine Turteltaube. Die Formulierung erhält diese Unterscheidung, ohne eine nicht sicher festgelegte Taubenart einzutragen.
- source_word: לְחַטָּאת
  choice: als Sündopfer
  rationale: חַטָּאת ist die traditionelle technische Opferbezeichnung. Da das Wort hier eine rituelle Reinigungsfunktion bezeichnet und nicht zwingend moralische Schuld voraussetzt, wird die Alternative in einer Fußnote genannt.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד אֶל הַכֹּהֵן
  choice: zum Priester an den Eingang des Zeltes der Begegnung
  rationale: Die Wiedergabe erhält sowohl den Empfänger als auch den Ort der Übergabe und folgt dabei der Abfolge des Hebräischen möglichst eng.
theological_decisions:
- issue: Bedeutung von חַטָּאת im Zusammenhang der Reinigung nach einer Geburt
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: „Sündopfer“ wahrt die traditionelle und im levitischen Opfersystem wiedererkennbare Benennung. Zugleich wird durch die Fußnote offengehalten, dass das Opfer hier der Beseitigung ritueller Unreinheit dient und die Geburt nicht als moralische Sünde bewertet wird.
translation_notes:
  register: Moderner, würdevoller Gesetzesstil mit geläufigen kultischen Fachbegriffen. „Zelt der Begegnung“ gibt אֹהֶל מוֹעֵד transparent wieder; der Satzbau bleibt gut verständlich und folgt zugleich der hebräischen Abfolge.
