reference: Leviticus 12:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ לֵ/אמֹ֔ר אִשָּׁה֙ כִּ֣י תַזְרִ֔יעַ וְ/יָלְדָ֖ה זָכָ֑ר וְ/טָֽמְאָה֙ שִׁבְעַ֣ת יָמִ֔ים כִּ/ימֵ֛י נִדַּ֥ת דְּוֺתָ֖/הּ תִּטְמָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/002.yaml
  text: 'Speak to the sons of Israel[a], saying: If a woman conceives and gives birth to a male child, then she shall be unclean seven days[c][b]; she shall be unclean as in the days of her menstrual impurity.'
translation:
  language: de
  text: 'Sag den Israeliten[a]: Wenn[b] eine Frau schwanger wird und einen Jungen zur Welt bringt, soll sie sieben Tage lang unrein sein[c]; wie während der Tage ihrer menstruationsbedingten Unreinheit soll sie unrein sein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zu den Söhnen Israels“; gemeint ist das Volk Israel.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Falls“. Die hebräische Partikel leitet hier einen Rechtsfall ein und kann je nach Zusammenhang mit „wenn“ oder „falls“ wiedergegeben werden.'
    reason: lexical_alternative
  - marker: c
    text: Gemeint ist ein ritueller Unreinheitsstatus, keine moralische Schuld.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die geläufige deutsche Volksbezeichnung gibt den nationalen Sammelbegriff natürlich und einschließlich des gesamten angesprochenen Volkes wieder; die wörtliche Form wird in Fußnote [a] genannt.
- source_word: אִשָּׁה
  choice: eine Frau
  rationale: Im Rechtssatz ist die allgemeine Bedeutung gemeint; der Text verlangt nicht die speziellere Wiedergabe „Ehefrau“.
- source_word: כִּי
  choice: wenn
  rationale: Die Partikel leitet hier einen allgemeinen Rechtsfall ein. Im Deutschen passt „wenn“ natürlicher als „falls“, ohne die bedingte Form aufzugeben.
- source_word: תַזְרִיעַ
  choice: schwanger wird
  rationale: Die Hifil-Form von זרע bezeichnet wörtlich ein Hervorbringen von Samen, meint in dieser Verbindung jedoch die Empfängnis beziehungsweise den Eintritt einer Schwangerschaft. „Schwanger wird“ ist klares, modernes Deutsch.
- source_word: וְיָלְדָה זָכָר
  choice: und ein männliches Kind zur Welt bringt
  rationale: Die Wiedergabe bewahrt die ausdrückliche Geschlechtsangabe זָכָר und formuliert den Geburtsvorgang in natürlichem Deutsch.
- source_word: וְטָמְאָה ... תִּטְמָא
  choice: ist sie ... unrein ... ist sie unrein
  rationale: Die zweimalige Feststellung des Unreinseins wird entsprechend dem Hebräischen beibehalten. „Rituell“ wird nicht in den Haupttext eingefügt, da es zwar aus dem gesetzlichen Zusammenhang folgt, aber nicht ausdrücklich im Verb steht.
- source_word: שִׁבְעַת יָמִים
  choice: sieben Tage lang
  rationale: Die deutsche Zeitangabe gibt die festgelegte Dauer klar und idiomatisch wieder.
- source_word: כִּימֵי נִדַּת דְּוֺתָהּ
  choice: wie in den Tagen ihrer menstruationsbedingten Unreinheit
  rationale: Die Formulierung erhält den Vergleich und bezeichnet den durch die Menstruation bestimmten Reinheitsstatus, ohne ihn als Krankheit missverständlich zu charakterisieren.
theological_decisions:
- issue: Art der durch טמא bezeichneten Unreinheit
  choice: unrein
  alternative: rituell unrein
  rationale: Der Zusammenhang betrifft kultisch-rituelle Reinheitsvorschriften, doch das hebräische Verb selbst sagt schlicht „unrein sein“. Die Erläuterung steht deshalb in der Fußnote statt als Zusatz im Haupttext.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל als Volksbezeichnung
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: Die Wendung bezeichnet hier das ganze Bundesvolk, das durch die folgende Anordnung angesprochen wird. „Die Israeliten“ gibt diese kollektive Bedeutung im modernen Deutschen präzise wieder; die formale Gestalt bleibt durch die Fußnote sichtbar.
- issue: Bedingter oder zeitlicher Sinn von כִּי
  choice: wenn
  alternative: falls
  rationale: Die Partikel eröffnet einen typischen Rechtsfall und kann sowohl konditional als auch zeitlich verstanden werden. Das deutsche „wenn“ bewahrt diese Überlappung besser als das stärker hypothetische „falls“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer rechtlicher Aussage. Die Wiederholung von „ist sie unrein“ folgt bewusst der hebräischen Struktur. Fachsprachliche Zusätze werden im Haupttext vermieden und, wo nötig, in Fußnoten erklärt.
