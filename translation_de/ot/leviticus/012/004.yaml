base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/004.yaml
  text: Then she shall remain for thirty-three days in the blood of her purification. She shall not touch any holy thing[a], and she shall not come into the sanctuary, until the days of her purification are completed.
translation:
  language: de
  text: Dann soll sie dreiunddreißig Tage im Blut der Reinigung bleiben.[a] Sie darf nichts Heiliges berühren und nicht in das Heiligtum kommen, bis die Tage ihrer Reinigung erfüllt sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht hier eine schwierige Wendung: „im Blut der Reinigung“. Gemeint ist die Zeit nach der Geburt, die mit Blutung und ritueller Reinigung verbunden ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁלֹשִׁים יוֹם וּ/שְׁלֹשֶׁת יָמִים
  choice: dreiunddreißig Tage
  rationale: Die wörtliche Zählung „dreißig Tage und drei Tage“ wird im heutigen Deutsch idiomatisch als „dreiunddreißig Tage“ wiedergegeben.
- source_word: תֵּשֵׁב
  choice: soll sie … bleiben
  rationale: ישׁב kann „sitzen“, „wohnen“ oder „bleiben“ bedeuten; hier bezeichnet es das Verbleiben in einem rituellen Zustand während eines bestimmten Zeitraums.
- source_word: בִּ/דְמֵי טָהֳרָה
  choice: im Blut ihrer Reinigung
  rationale: Die schwierige Wendung wird konkret und quellennah wiedergegeben. „Reinigung“ bezeichnet hier den rituellen Vorgang, nicht moralische Schuld; der feminine Bezug ergibt sich aus dem Zusammenhang.
- source_word: בְּ/כָל קֹדֶשׁ
  choice: nichts Heiliges
  rationale: Die substantivierte Form gibt die umfassende Wendung „irgendetwas Heiliges“ natürlich und prägnant wieder.
- source_word: לֹא תִגָּע
  choice: darf … nicht berühren
  rationale: Im deutschen Gesetzesstil drückt „darf nicht“ ein Verbot natürlicher aus als eine futurische Form.
- source_word: וְ/אֶל הַ/מִּקְדָּשׁ לֹא תָבֹא
  choice: und nicht in das Heiligtum kommen
  rationale: „Heiligtum“ entspricht dem kultischen Sinn von מִקְדָּשׁ; „in … kommen“ bewahrt die Verbwahl des Hebräischen und dessen räumliche Ausrichtung.
- source_word: עַד מְלֹאת
  choice: bis … vollendet sind
  rationale: Die Infinitivkonstruktion bezeichnet das vollständige Ablaufen des genannten Zeitraums.
- source_word: יְמֵי טָהֳרָהּ
  choice: die Tage ihrer Reinigung
  rationale: „Reinigung“ bewahrt die kultisch-rituelle Bedeutung von טָהֳרָה, und „ihrer“ gibt das ausdrückliche Suffix wieder.
theological_decisions:
- issue: Rituelle Reinheit ohne den Beiklang moralischer Schuld wiedergeben
  choice: Reinigung
  alternative: Reinwerden; Läuterung
  rationale: Der Vers regelt den kultischen Status nach einer Geburt. „Reinigung“ wahrt diese Kategorie, ohne persönliche Schuld oder sittliche Verunreinigung zu behaupten.
- issue: Die schwierige Wendung בִּדְמֵי טָהֳרָה nicht auflösen
  choice: im Blut ihrer Reinigung
  alternative: während ihrer reinigungsbedingten Blutung
  rationale: Die konkrete hebräische Bildsprache und ihre Deutungsoffenheit bleiben erhalten; eine erklärende Umschreibung würde die Verbindung von Blut und Reinigung stärker festlegen als der Wortlaut.
translation_notes:
  register: Moderner, würdiger Gesetzesstil. „Soll … bleiben“ markiert die Vorschrift, während „darf … nicht“ die beiden Verbote idiomatisch ausdrückt. Der kultische Fachwortschatz bleibt erhalten, ohne moralische Wertung einzutragen.
