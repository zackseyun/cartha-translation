base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/005.yaml
  text: But if she gives birth to a female child[a], then she shall be unclean for two weeks, as in her menstruation[b]; and for sixty-six days she shall remain in the blood of purification.
translation:
  language: de
  text: Wenn sie aber ein Mädchen zur Welt bringt, ist sie zwei Wochen lang unrein, wie während ihrer Monatsblutung[a]; und sechsundsechzig Tage soll sie im Blut der Reinigung bleiben[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist kultische Unreinheit wie während der Menstruation, nicht moralische Schuld.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „im Blut der Reinigung“. Die hebräische Wendung bezeichnet den vorgeschriebenen Zeitraum der Reinigung nach der Geburt, nicht moralische Schuld.'
    reason: cultural_note
lexical_decisions:
- source_word: וְאִם נְקֵבָה תֵלֵד
  choice: Wenn sie aber ein Mädchen zur Welt bringt
  rationale: Die Wendung führt den Gegenfall zum männlichen Kind ein. נְקֵבָה bezeichnet hier ein weibliches Kind; „Mädchen“ ist im Deutschen natürlich und bewahrt die Geschlechtsangabe.
- source_word: וְטָמְאָה שְׁבֻעַיִם
  choice: ist sie zwei Wochen unrein
  rationale: Der Text beschreibt einen kultisch-rechtlichen Status. „Unrein“ wahrt den zentralen Begriff, ohne im Haupttext eine nicht ausdrücklich vorhandene Erläuterung hinzuzufügen.
- source_word: כְּנִדָּתָהּ
  choice: wie während ihrer Monatsblutung
  rationale: נִדָּה bezeichnet hier den mit der Menstruation verbundenen Zustand beziehungsweise Zeitraum. Die Formulierung ist verständlich und erhält den Vergleich.
- source_word: וְשִׁשִּׁים יוֹם וְשֵׁשֶׁת יָמִים
  choice: sechsundsechzig Tage
  rationale: Die beiden hebräischen Zahlbestandteile werden im natürlichen Deutschen zu einer Zahl zusammengezogen.
- source_word: תֵּשֵׁב עַל דְּמֵי טָהֳרָה
  choice: bleibt sie … in der Zeit der Reinigung von ihrer Blutung
  rationale: תֵּשֵׁב bedeutet in diesem rechtlichen Zusammenhang das Verbleiben in einem Zustand oder Zeitraum. Die idiomatische Wendung דְּמֵי טָהֳרָה wird verständlich wiedergegeben, ohne die ungewöhnliche hebräische Form „Blut/Blutungen der Reinigung“ unkommentiert nachzubilden.
theological_decisions:
- issue: Art der Unreinheit nach der Geburt
  choice: „unrein“ als kultisch-rituellen Status beibehalten und durch eine Fußnote erläutern
  alternative: „kultisch unrein“ oder „rituell unrein“ unmittelbar im Haupttext
  rationale: טמא bezeichnet hier keine persönliche Schuld oder sittliche Verfehlung. Der traditionelle Leitbegriff bleibt sichtbar, während die Erläuterung eine moralische Fehlinterpretation verhindert.
- issue: Bedeutung von דְּמֵי טָהֳרָה
  choice: als vorgeschriebenen Reinigungszeitraum im Zusammenhang mit der Blutung wiedergeben
  alternative: formal „im Blut der Reinigung“
  rationale: Die hebräische Wendung ist idiomatisch und bezeichnet den Zeitraum beziehungsweise Zustand der Reinigung nach der Geburt; sie trifft keine Aussage über moralische Schuld.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlicher Rechtssprache. Die Formulierung vermeidet altertümliches „gebären“ und erklärt die kultische Bedeutung der Unreinheit in den Fußnoten.
