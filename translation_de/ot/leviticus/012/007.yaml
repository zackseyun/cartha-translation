source:
  edition: WLC
  text: וְ/הִקְרִיב֞/וֹ לִ/פְנֵ֤י יְהוָה֙ וְ/כִפֶּ֣ר עָלֶ֔י/הָ וְ/טָהֲרָ֖ה מִ/מְּקֹ֣ר דָּמֶ֑י/הָ זֹ֤את תּוֹרַת֙ הַ/יֹּלֶ֔דֶת לַ/זָּכָ֖ר א֥וֹ לַ/נְּקֵבָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/007.yaml
  text: And he shall present it before Yahweh and make atonement for her[a], and she shall be cleansed from the source of her blood. This is the law for the woman who gives birth, whether to a male or to a female.
translation:
  language: de
  text: Und er soll es vor Yahweh darbringen und für sie Sühne erwirken; dann wird sie von der Quelle ihres Blutes[a] rein werden. Das ist die Weisung für eine Frau, die ein männliches oder ein weibliches Kind zur Welt bringt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von ihrem Blutfluss“. Wörtlich: „von der Quelle ihres Blutes“.'
    reason: Die wörtliche Körpermetapher des Hebräischen kann im Zusammenhang den nachgeburtlichen Blutfluss bezeichnen.
lexical_decisions:
- source_word: וְהִקְרִיבוֹ
  choice: Und er soll es … darbringen
  rationale: Das Hifil von קרב mit Objektsuffix bezeichnet hier, dass der Priester die zuvor genannte Opfergabe vor Yahweh bringt. „Darbringen“ ist im Deutschen natürlich und kultisch passend.
- source_word: לִפְנֵי יְהוָה
  choice: vor Yahweh
  rationale: Die Wendung bedeutet „vor/in der Gegenwart von“. Der Gottesname יְהוָה wird als „Yahweh“ wiedergegeben.
- source_word: וְכִפֶּר עָלֶיהָ
  choice: für sie Sühne erwirken
  rationale: כפר bezeichnet im priesterlichen Opferkontext die kultische Sühnung. Die Formulierung wahrt den Vorgang, ohne eine bestimmte Sühnetheorie einzutragen.
- source_word: וְטָהֲרָה
  choice: dann wird sie … rein sein
  rationale: Das Qal bezeichnet als Folge der priesterlichen Handlung den Zustand kultischer Reinheit. „Rein sein“ gibt die levitische Reinheitssprache präzise wieder.
- source_word: מִמְּקֹר דָּמֶיהָ
  choice: von der Quelle ihres Blutes
  rationale: מָקוֹר bedeutet wörtlich „Quelle“ oder „Quellort“. Die konkrete Bedeutung im Zusammenhang mit dem Blutfluss bleibt in einer Fußnote kenntlich.
- source_word: זֹאת תּוֹרַת
  choice: Das ist die Weisung für
  rationale: תּוֹרָה bezeichnet hier eine verbindliche kultische Anweisung. „Weisung“ bewahrt den instruktiven Sinn und klingt im modernen Deutsch natürlicher als eine pauschale Wiedergabe mit „Gesetz“.
- source_word: הַיֹּלֶדֶת
  choice: eine Frau, die … zur Welt bringt
  rationale: Das Partizip bezeichnet die gebärende Frau. Die Wiedergabe ist ausdrücklich und idiomatisch.
- source_word: לַזָּכָר אֹו לַנְּקֵבָה
  choice: ein männliches oder ein weibliches Kind
  rationale: Der hebräische Text verwendet die Geschlechtsbezeichnungen „männlich“ und „weiblich“. „Kind“ wird im Deutschen zur natürlichen und eindeutigen Formulierung ergänzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jahwe
  rationale: Der Text nennt das Tetragramm ausdrücklich. „Yahweh“ gibt den persönlichen Bundesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von כפר im Zusammenhang der Reinheitsvorschriften
  choice: für sie Sühne erwirken
  alternative: sie entsühnen; für sie Versöhnung schaffen
  rationale: Die Formulierung hält die kultische Dimension fest, ohne die rituelle Reinigung mit persönlicher moralischer Schuld gleichzusetzen oder eine bestimmte Sühnetheorie festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit levitischer Kultsprache. Der Satzbau bleibt quellennah, wird aber für heutige Leser geglättet; die sachliche Geschlechtsbezeichnung wird durch „Kind“ idiomatisch ergänzt.
