id: LEV.12.8
reference: Leviticus 12:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אִם לֹ֨א תִמְצָ֣א יָדָ/הּ֮ דֵּ֣י שֶׂה֒ וְ/לָקְחָ֣ה שְׁתֵּֽי תֹרִ֗ים א֤וֹ שְׁנֵי֙ בְּנֵ֣י יוֹנָ֔ה אֶחָ֥ד לְ/עֹלָ֖ה וְ/אֶחָ֣ד לְ/חַטָּ֑את וְ/כִפֶּ֥ר עָלֶ֛י/הָ הַ/כֹּהֵ֖ן וְ/טָהֵֽרָה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/008.yaml
  text: But if she cannot afford a lamb[a], then she shall take two turtledoves or two young pigeons, one for a burnt offering and one for a sin offering; and the priest shall make atonement for her, and she shall be clean.
translation:
  language: de
  text: Wenn sie sich jedoch kein Lamm leisten kann, soll sie zwei Turteltauben oder zwei junge Tauben nehmen, eine als Brandopfer und eine als Sündopfer[a]. Der Priester soll für sie Sühne erwirken, und sie wird rein sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Reinigungsopfer«. In diesem Zusammenhang betrifft das Opfer die kultische Unreinheit nach der Geburt.'
    reason: Lexikalische Alternative, die den besonderen Reinheitskontext verdeutlicht, ohne die traditionelle Wiedergabe im Haupttext zu ersetzen.
lexical_decisions:
- source_word: תִמְצָא יָדָהּ דֵּי שֶׂה
  choice: sie sich jedoch kein Lamm leisten kann
  rationale: Die hebräische Wendung »ihre Hand findet nicht genug für ein Lamm« bezeichnet unzureichende finanzielle Mittel. Die gewählte Formulierung gibt den Sinn natürlich und genau wieder.
- source_word: שֶׂה
  choice: Lamm
  rationale: Der vorhergehende Vers bestimmt das erwartete Tier als einjähriges Lamm; daher ist »Lamm« hier kontextuell genauer als das allgemeinere »Stück Kleinvieh«.
- source_word: שְׁתֵּי תֹרִים
  choice: zwei Turteltauben
  rationale: תֹרִים bezeichnet spezifisch Turteltauben und nicht bloß Tauben im Allgemeinen.
- source_word: שְׁנֵי בְּנֵי יוֹנָה
  choice: zwei junge Tauben
  rationale: Die wörtliche Konstruktion »zwei Söhne der Taube« ist eine idiomatische Bezeichnung für junge Tauben.
- source_word: עֹלָה
  choice: Brandopfer
  rationale: »Brandopfer« ist die geläufige und sachlich passende deutsche Wiedergabe des Opfers, das auf dem Altar vollständig verbrannt wird.
- source_word: חַטָּאת
  choice: Sündopfer
  rationale: »Sündopfer« bewahrt die traditionelle Zuordnung des hebräischen Opferbegriffs; die im vorliegenden Reinheitskontext plausible Wiedergabe »Reinigungsopfer« wird in einer Fußnote genannt.
- source_word: וְכִפֶּר עָלֶיהָ
  choice: Der Priester soll für sie Sühne erwirken
  rationale: Die Formulierung bewahrt die kultisch-theologische Bedeutung von כפר, ohne den genauen Mechanismus der Sühne über den hebräischen Text hinaus festzulegen.
- source_word: וְטָהֵרָה
  choice: sie wird rein sein
  rationale: Das Verb bezeichnet hier die Wiederherstellung kultischer Reinheit. »Rein sein« gibt dies knapp wieder, ohne moralische Schuld zu unterstellen.
theological_decisions:
- issue: Wiedergabe von חַטָּאת im Zusammenhang der Reinigung nach einer Geburt
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: Der Haupttext behält die etablierte Wiedergabe des Opferbegriffs bei. Da der Zusammenhang kultische Unreinheit nach einer Geburt und nicht ausdrücklich persönliche moralische Verfehlung betrifft, hält die Fußnote die kontextuell plausible Alternative »Reinigungsopfer« offen.
- issue: Bedeutung der abschließenden Reinheitserklärung
  choice: sie wird rein sein
  alternative: sie wird gereinigt sein
  rationale: Die Formulierung wahrt den Statuswechsel zur kultischen Reinheit und vermeidet, den Vorgang unnötig als moralische Reinigung zu deuten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem kultischem Wortschatz. Die Satzstruktur ist flüssig, die Fachbegriffe »Brandopfer«, »Sündopfer« und »Sühne« bleiben zur Wahrung der theologischen und kultischen Präzision erhalten.
