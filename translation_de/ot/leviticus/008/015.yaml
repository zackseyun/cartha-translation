base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/015.yaml
  text: And he slaughtered it, and Moses took the blood and put it on the horns of the altar all around with his finger, and he purified the altar, and he poured out the blood at the base of the altar and consecrated it to make atonement for it.
translation:
  language: de
  text: Er schlachtete ihn. Mose nahm das Blut und strich es mit seinem Finger ringsum an die Hörner des Altars und reinigte den Altar.[a] Dann goss er das Blut an den Sockel des Altars und weihte ihn, um für ihn Sühne zu erwirken.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „entsühnte den Altar“. Das hebräische Verb bezeichnet hier die rituelle Reinigung des Altars von Verunreinigung, nicht ein sündiges Handeln des Altars.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „um ihn zu entsühnen“ oder „um an ihm Sühne zu vollziehen“. Das hebräische Verb kann im Opferkult Sühne, Entsühnung oder rituelle Reinigung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחָט
  choice: Dann schlachtete er ihn
  rationale: שׁחט bezeichnet im Opferkontext das rituelle Schlachten. Das maskuline Pronomen nimmt das Opfertier aus dem Kontext auf.
- source_word: וַיִּתֵּן עַל קַרְנוֹת הַמִּזְבֵּחַ סָבִיב בְּאֶצְבָּעוֹ
  choice: strich mit seinem Finger etwas davon ringsum an die Hörner des Altars
  rationale: נתן ist allgemein „geben, anbringen“; „strich … an“ beschreibt die hier gemeinte Blutapplikation natürlich. „Etwas davon“ verdeutlicht, dass anschließend noch Blut ausgegossen wird, ohne den Sinn zu verändern. סָבִיב wird distributiv mit „ringsum“ wiedergegeben.
- source_word: וַיְחַטֵּא אֶת הַמִּזְבֵּחַ
  choice: und entsündigte so den Altar
  rationale: Das Piel von חטא bezeichnet im priesterlichen Ritual die Entfernung kultischer Verunreinigung. „Entsündigte“ bewahrt die auffällige Wortbildung und den Zusammenhang mit Sünde besser als das allgemeinere „reinigte“; „so“ kennzeichnet die vorausgehende Blutapplikation als Mittel.
- source_word: וְאֶת הַדָּם יָצַק אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: Das übrige Blut goss er an den Fuß des Altars
  rationale: יסוד bezeichnet hier den unteren Teil beziehungsweise Fuß des Altars. „Das übrige Blut“ macht den durch die vorangehende Teilverwendung implizierten Rest idiomatisch deutlich.
- source_word: וַיְקַדְּשֵׁהוּ
  choice: So heiligte er ihn
  rationale: קדשׁ bedeutet hier, den Altar für den heiligen Gebrauch zu heiligen beziehungsweise zu weihen. „Heiligte“ erhält die direkte Verbindung zum Begriff der Heiligkeit.
- source_word: לְכַפֵּר עָלָיו
  choice: um für ihn Sühne zu erwirken
  rationale: כפר mit על und dem Altar als Bezugspunkt bezeichnet eine sühnende beziehungsweise entsühnende kultische Handlung am Altar. „Für ihn Sühne zu erwirken“ ist im Deutschen verständlich und bewahrt die ungewöhnliche Aussage, dass der Altar selbst Gegenstand der Sühnehandlung ist.
theological_decisions:
- issue: Rituelle Bedeutung des Piel von חטא
  choice: entsündigte so den Altar
  alternative: reinigte den Altar
  rationale: Der Altar wird nicht als sündig handelnd dargestellt; gemeint ist seine kultische Reinigung durch das Blutritual. Die gewählte Formulierung wahrt zugleich die Verbindung des Verbs zur Wortfamilie „Sünde“.
- issue: Bedeutung von כפר in Bezug auf den Altar
  choice: um für ihn Sühne zu erwirken
  alternative: um ihn zu entsühnen / um an ihm Sühne zu vollziehen
  rationale: Der hebräische Text macht den Altar zum Bezugspunkt der כפר-Handlung. Die Übersetzung erhält diese theologisch auffällige Spannung, ohne sie auf eine bestimmte spätere Sühnetheorie festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlicher Ritualsprache. Kurze Hauptsätze lösen die lange hebräische Verbfolge lesefreundlich auf. Die ungewöhnliche Vorstellung einer Sühnehandlung für den Altar bleibt erhalten; Fachalternativen werden in den Fußnoten genannt.
