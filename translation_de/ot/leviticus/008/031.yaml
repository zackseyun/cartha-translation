base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/031.yaml
  text: And Moses said to Aaron and to his sons[a], “Boil the meat at the entrance of the tent of meeting, and there eat it and the bread that is in the basket of ordination offerings, just as I commanded, saying, ‘Aaron and his sons shall eat it.’”
translation:
  language: de
  text: 'Und Mose sagte zu Aaron und seinen Söhnen: »Kocht das Fleisch am Eingang des Zeltes der Begegnung. Dort sollt ihr es essen, ebenso das Brot, das im Korb mit den Speisen zur Einsetzung[a] liegt, wie ich befohlen habe: ›Aaron und seine Söhne sollen es essen.‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Weihe«. Das hebräische Wort bezeichnet hier den Ritus und die dazugehörigen Speisen, durch die Aaron und seine Söhne in den Priesterdienst eingesetzt werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשְּׁלוּ
  choice: Kocht
  rationale: בשׁל bezeichnet hier im Zusammenhang der Opfermahlzeit das Kochen beziehungsweise Sieden; »kochen« ist im Deutschen natürlich und lässt die genaue Zubereitungsweise angemessen offen.
- source_word: הַבָּשָׂר
  choice: das Fleisch
  rationale: Im kulinarisch-rituellen Zusammenhang bezeichnet בשר den essbaren Anteil des Opfertiers; »Fleisch« ist die direkte und natürliche deutsche Entsprechung.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: am Eingang des Zeltes der Begegnung
  rationale: פתח bezeichnet den Eingang oder die Öffnung. »Zelt der Begegnung« gibt אהל מועד verständlich wieder, ohne מועד einseitig nur zeitlich oder nur räumlich festzulegen.
- source_word: וְשָׁם תֹּאכְלוּ אֹתוֹ
  choice: Dort sollt ihr es essen
  rationale: Die Voranstellung von »Dort« bewahrt die örtliche Betonung von שׁם; »sollt ihr« bringt den anweisenden Sinn des Imperfekts idiomatisch zum Ausdruck.
- source_word: הַלֶּחֶם
  choice: das Brot
  rationale: לחם bezeichnet hier das Brot, das zum Einsetzungsritus gehört; die schlichte Wiedergabe ist sachlich und klar.
- source_word: סַל הַמִּלֻּאִים
  choice: Korb für die Einsetzung
  rationale: מִלֻּאִים bezeichnet in diesem priesterlichen Kontext den Ritus der Einsetzung in das Amt. Die Formulierung vermeidet die unpräzise Ergänzung »Opfergaben«, da das Brot selbst im Korb liegt, und bewahrt den kultischen Bezug.
- source_word: כַּאֲשֶׁר צִוֵּיתִי לֵאמֹר
  choice: wie ich befohlen habe
  rationale: Die anschließende direkte Rede macht die im Hebräischen durch לֵאמֹר eingeführte Befehlsformel im Deutschen ohne ein schwerfälliges »indem ich sagte« deutlich.
- source_word: יֹאכְלֻהוּ
  choice: sollen es essen
  rationale: Das Imperfekt hat innerhalb des zitierten Befehls direktiven Charakter; »sollen« wahrt diesen, ohne die Aussage als bloße Zukunft oder als verschärftes Müssen zu deuten.
theological_decisions:
- issue: Bedeutung von מִלֻּאִים im Zusammenhang der Priestereinsetzung
  choice: Einsetzung
  alternative: Weihe
  rationale: Das Wort bezieht sich auf die rituelle Einsetzung Aarons und seiner Söhne in den Priesterdienst (wörtlich mit dem Hintergrund des »Füllens der Hand«). »Einsetzung« benennt den Amtsantritt, ohne spätere kirchliche Ordinationsvorstellungen einzutragen; »Weihe« ist eine mögliche, stärker kultisch klingende Alternative.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bewahrt die örtliche Betonung des Hebräischen, gestaltet die Befehlsformel aber idiomatisch. Der Fußnotenmarker steht unmittelbar bei dem erklärungsbedürftigen Ausdruck.
