source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ אַהֲרֹ֖ן וּ/בָנָ֑י/ו אֵ֚ת כָּל הַ/דְּבָרִ֔ים אֲשֶׁר צִוָּ֥ה יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/036.yaml
  text: And Aaron and his sons did all the things that Yahweh had commanded through Moses[a].
translation:
  language: de
  text: Aaron und seine Söhne taten alles, was Jahwe durch Mose[a] geboten hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „durch die Hand Moses“; eine hebräische Wendung für die Vermittlung durch Mose.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: taten
  rationale: Das Verb עשה fasst hier die gehorsame Ausführung der Anweisungen zusammen. „Taten“ ist schlicht, natürlich und bleibt nahe am hebräischen Ausdruck.
- source_word: אַהֲרֹן וּבָנָיו
  choice: Aaron und seine Söhne
  rationale: בָּנָיו bezeichnet in diesem priesterlichen Zusammenhang Aarons männliche Nachkommen; „Söhne“ ist daher präziser als „Kinder“.
- source_word: אֵת כָּל הַדְּבָרִים
  choice: alles
  rationale: דְּבָרִים kann „Worte“, „Angelegenheiten“ oder „Dinge“ bedeuten. Mit עשה bezeichnet es hier den gesamten Inhalt der auszuführenden Anweisungen; idiomatisches Deutsch gibt dies am besten mit „alles“ wieder.
- source_word: צִוָּה
  choice: geboten hatte
  rationale: Das Plusquamperfekt verdeutlicht im Deutschen natürlich, dass Jahwes Gebot der hier zusammengefassten Ausführung vorausging.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt. „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Form.
- source_word: בְּיַד מֹשֶׁה
  choice: durch Mose
  rationale: Wörtlich steht „durch die Hand Moses“. Die Wendung bezeichnet hier Mose als Vermittler des göttlichen Gebots; „durch Mose“ gibt das in natürlichem Deutsch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. Die Wiedergabe als „Jahwe“ bewahrt den Charakter als Gottes Eigenname, ohne ihn durch einen Titel zu ersetzen.
- issue: Implizites Objekt bei צִוָּה
  choice: ihnen
  alternative: 'ohne ausdrückliches Objekt: „was Jahwe durch Mose geboten hatte“'
  rationale: Im Hebräischen ist kein pronominales Objekt ausgedrückt. „Ihnen“ macht im Deutschen den aus dem Zusammenhang klaren Adressaten der Gebote deutlich, ohne den sachlichen Sinn zu verändern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Schlusszusammenfassung des hebräischen Verses bleibt erhalten; die idiomatische Wendung בְּיַד wird verständlich übersetzt und in der Fußnote wörtlich dokumentiert.
