id: LEV.8.23
reference: Leviticus 8:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּשְׁחָ֓ט וַ/יִּקַּ֤ח מֹשֶׁה֙ מִ/דָּמ֔/וֹ וַ/יִּתֵּ֛ן עַל תְּנ֥וּךְ אֹֽזֶן אַהֲרֹ֖ן הַ/יְמָנִ֑ית וְ/עַל בֹּ֤הֶן יָד/וֹ֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְל֖/וֹ הַ/יְמָנִֽית׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/023.yaml
  text: And he slaughtered it[a], and Moses took some of its blood and put it on the lobe of Aaron’s right ear, and on the thumb of his right hand, and on the big toe of his right foot.
translation:
  language: de
  text: Dann schlachtete er ihn. Mose nahm etwas von seinem Blut und strich es an Aarons rechtes Ohrläppchen[a], an den Daumen seiner rechten Hand und an die große Zehe seines rechten Fußes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: an die Spitze von Aarons rechtem Ohr.'
    reason: Der seltene hebräische Ausdruck תְּנוּךְ אֹזֶן kann als Ohrläppchen oder allgemeiner als äußerste Spitze des Ohres verstanden werden.
lexical_decisions:
- source_word: וַיִּשְׁחָט
  choice: Dann schlachtete er ihn
  rationale: Das Verb bezeichnet im Opferkontext das rituelle Schlachten. Das im Hebräischen nicht ausdrücklich genannte Objekt wird aus dem unmittelbaren Zusammenhang aufgenommen; das maskuline Pronomen entspricht dem zuvor genannten Widder.
- source_word: מִדָּמוֹ
  choice: etwas von seinem Blut
  rationale: Die Präposition מִן bezeichnet hier eine entnommene Teilmenge; die Formulierung ist im modernen Deutsch natürlich und präzise.
- source_word: וַיִּתֵּן עַל
  choice: strich es an
  rationale: Die Wendung beschreibt das Aufbringen des Blutes auf die genannten Körperstellen. „Strich … an“ gibt die konkrete Handlung natürlich wieder, ohne ihre symbolische Bedeutung auszudeuten.
- source_word: תְּנוּךְ אֹזֶן
  choice: Ohrläppchen
  rationale: Der seltene anatomische Ausdruck bezeichnet den äußeren Teil beziehungsweise die Spitze des Ohres. „Ohrläppchen“ ist im Deutschen die verständlichste Wiedergabe; die mögliche Alternative „Spitze des Ohres“ bleibt in einer Fußnote erhalten.
- source_word: הַיְמָנִית
  choice: recht-
  rationale: Das Adjektiv kennzeichnet jeweils die Körperstelle auf der rechten Seite; im Deutschen wird dies idiomatisch mit „rechtes“ beziehungsweise „rechten“ ausgedrückt.
- source_word: בֹּהֶן יָדוֹ
  choice: Daumen seiner rechten Hand
  rationale: בֹּהֶן bezeichnet an der Hand eindeutig den Daumen.
- source_word: בֹּהֶן רַגְלוֹ
  choice: große Zehe seines rechten Fußes
  rationale: Am Fuß bezeichnet בֹּהֶן die große Zehe; diese anatomische Genauigkeit wird bewahrt.
theological_decisions:
- issue: Rituelles Aufbringen des Opferblutes auf Aarons Körperstellen
  choice: Die Handlung wird rein beschreibend wiedergegeben.
  alternative: Die Körperstellen im Haupttext symbolisch auf Hören, Handeln und Wandeln beziehen oder die priesterliche Weihe ausdrücklich erläutern.
  rationale: Der Vers berichtet die rituelle Handlung, deutet ihre einzelnen Elemente jedoch nicht ausdrücklich. Eine symbolische Erklärung im Übersetzungstext würde über den hebräischen Wortlaut hinausgehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung verhindert eine schwerfällige Reihung; die wiederholte Präposition „an“ bildet die Abfolge des hebräischen Ritualberichts klar nach.
