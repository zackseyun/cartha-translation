  text: וַ/יִּקַּ֤ח מֹשֶׁה֙ אֶת הֶ֣/חָזֶ֔ה וַ/יְנִיפֵ֥/הוּ תְנוּפָ֖ה לִ/פְנֵ֣י יְהוָ֑ה מֵ/אֵ֣יל הַ/מִּלֻּאִ֗ים לְ/מֹשֶׁ֤ה הָיָה֙ לְ/מָנָ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/029.yaml
  text: Then Moses took the breast and waved it as a wave offering before Yahweh. It was Moses' portion from the ram of ordination[a], just as Yahweh had commanded Moses.
translation:
  language: de
  text: Dann nahm Mose die Brust und schwang sie als Schwingopfer vor Jahwe. Sie war Moses Anteil vom Widder der Einsetzung[a], so wie Jahwe es Mose geboten hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vom Widder der Weihe“.'
    reason: Lexikalische Alternative für מִלֻּאִים, das im Kontext sowohl die Priestereinsetzung als auch die Weihe bezeichnen kann.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Dann nahm Mose
  rationale: Das Wayyiqtol führt die Erzählung fort; „Dann“ gibt die zeitliche Abfolge in natürlichem Deutsch wieder.
- source_word: הֶחָזֶה
  choice: die Brust
  rationale: Im Opferkontext bezeichnet חָזֶה das als Opferanteil bestimmte Bruststück.
- source_word: וַיְנִיפֵהוּ תְנוּפָה
  choice: schwang sie als Schwingopfer
  rationale: Die Verbindung des Verbs נוף mit dem stammverwandten Substantiv תְּנוּפָה bezeichnet die rituelle Schwingbewegung beziehungsweise Darbringung; „Schwingopfer“ bewahrt den kultischen Fachbegriff.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: Die Wendung bezeichnet die Darbringung in Jahwes Gegenwart und gibt den Gottesnamen ausdrücklich wieder.
- source_word: מֵאֵיל הַמִּלֻּאִים
  choice: von dem Einsetzungswidder
  rationale: אֵיל bedeutet „Widder“; מִלֻּאִים bezeichnet hier die Einsetzung Aarons und seiner Söhne in das Priesteramt. „Einsetzungswidder“ ist prägnant und im Kontext verständlich.
- source_word: לְמֹשֶׁה הָיָה לְמָנָה
  choice: Sie fiel Mose als Anteil zu
  rationale: מָנָה ist ein zugewiesener Anteil. Die deutsche Formulierung bringt sowohl die Zuweisung als auch die Zugehörigkeit zu Mose natürlich zum Ausdruck.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: so wie Jahwe es Mose geboten hatte
  rationale: Die formelhafte Aussage bestätigt, dass Mose entsprechend einem vorausgegangenen göttlichen Gebot handelte; „es“ bezieht sich auf das vollzogene Ritual.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Jahwe“ gibt ihn im Deutschen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von מִלֻּאִים im Zusammenhang der Priestereinsetzung
  choice: Einsetzung
  alternative: Weihe
  rationale: Das Wort bezeichnet in Levitikus 8 die Einsetzung in das Priesteramt, hat zugleich aber einen Weiheaspekt. „Einsetzung“ hebt die amtliche Installation hervor; die mögliche Wiedergabe „Weihe“ wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kultische Fachsprache wird dort bewahrt, wo sie für den priesterlichen Kontext wesentlich ist; Satzbau und Verweisstruktur bleiben zugleich gut verständlich.
