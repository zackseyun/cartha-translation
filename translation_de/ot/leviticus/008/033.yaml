source:
  edition: WLC
  text: וּ/מִ/פֶּתַח֩ אֹ֨הֶל מוֹעֵ֜ד לֹ֤א תֵֽצְאוּ֙ שִׁבְעַ֣ת יָמִ֔ים עַ֚ד י֣וֹם מְלֹ֔את יְמֵ֖י מִלֻּאֵי/כֶ֑ם כִּ֚י שִׁבְעַ֣ת יָמִ֔ים יְמַלֵּ֖א אֶת יֶדְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/033.yaml
  text: And you shall not go out from the entrance of the tent of meeting for seven days[a], until the day the days of your ordination are completed, for he will ordain you for seven days.
translation:
  language: de
  text: Vom Eingang des Zeltes der Begegnung dürft ihr sieben Tage lang nicht weggehen, bis zu dem Tag, an dem die Tage eurer Einsetzung vollendet sind; denn sieben Tage lang wird er euch in den Priesterdienst einsetzen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »wird er eure Hand füllen«. Das ist eine hebräische Wendung für die Einsetzung in den Priesterdienst.'
    reason: Die Fußnote bewahrt die bildhafte Form und erklärt zugleich die kultische Bedeutung des hebräischen Fachausdrucks.
lexical_decisions:
- source_word: וּמִפֶּתַח
  choice: Vom Eingang
  rationale: פֶּתַח bezeichnet den Eingang beziehungsweise die Öffnung. Die vorangestellte Konjunktion muss im Deutschen hier nicht eigens mit „und“ wiedergegeben werden; „vom Eingang“ bildet den räumlichen Ausgangspunkt natürlich ab.
- source_word: אֹהֶל מוֹעֵד
  choice: Zelt der Begegnung
  rationale: Die transparente Wiedergabe bewahrt sowohl das Bild des Zeltes als auch die Funktion als Ort der Begegnung; „Stiftshütte“ wäre traditionell, für heutige Leser aber weniger unmittelbar verständlich.
- source_word: לֹא תֵצְאוּ
  choice: dürft ihr … nicht weggehen
  rationale: Die negierte Verbform hat in diesem Anweisungskontext verbindliche Kraft. „Weggehen“ gibt im Deutschen passend wieder, dass sie den Bereich am Eingang nicht verlassen sollen.
- source_word: שִׁבְעַת יָמִים
  choice: sieben Tage lang
  rationale: Diese Formulierung bezeichnet im modernen Deutschen klar die Dauer und kommt im Vers entsprechend der hebräischen Wiederholung zweimal vor.
- source_word: עַד יוֹם מְלֹאת יְמֵי מִלֻּאֵיכֶם
  choice: bis zu dem Tag, an dem die Zeit eurer Einsetzung abgeschlossen ist
  rationale: מלא bezeichnet hier das Vollwerden beziehungsweise den Abschluss, מִלֻּאִים die kultische Einsetzung in das Priesteramt. „Die Zeit“ vermeidet die im Deutschen schwer verständliche wörtliche Verbindung „der Tag, an dem die Tage … vollendet sind“, ohne den zeitlichen Endpunkt aufzugeben.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt die Begründung für das siebentägige Verbot ein.
- source_word: יְמַלֵּא אֶת יֶדְכֶם
  choice: wird er euch in den Priesterdienst einsetzen
  rationale: Die Wendung bedeutet wörtlich „eure Hand füllen“, ist hier aber ein technischer Ausdruck für die Einsetzung in den Priesterdienst. Die idiomatische Bedeutung steht verständlich im Haupttext; die konkrete hebräische Bildsprache wird in der Fußnote dokumentiert.
theological_decisions:
- issue: Wiedergabe der priesterlichen Einsetzungsformel מלא את־יד
  choice: euch in den Priesterdienst einsetzen
  alternative: eure Hände füllen
  rationale: Eine rein wörtliche Wiedergabe wäre im Deutschen missverständlich und würde die kultische Funktion nicht erkennen lassen. Die gewählte Fassung wahrt den konkreten priesterlichen Kontext, ohne eine spätere konfessionelle Amtslehre in den Text einzutragen; die Fußnote bewahrt die hebräische Bildform.
- issue: Bezug des nicht ausdrücklich genannten Subjekts in יְמַלֵּא
  choice: er
  alternative: Mose
  rationale: Das Hebräische hat eine maskuline Singularform, nennt den Handelnden in diesem Satz jedoch nicht ausdrücklich. Deshalb bleibt auch die Übersetzung bei „er“ und löst den Bezug nicht stillschweigend auf.
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer Anweisungsform. Die doppelte Angabe „sieben Tage lang“ bleibt entsprechend dem hebräischen Text erhalten. Die ungewohnte hebräische Redewendung wird im Haupttext sinngemäß und in der Fußnote wörtlich wiedergegeben.
