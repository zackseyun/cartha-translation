  text: וַ/יַּגֵּ֕שׁ אֵ֖ת פַּ֣ר הַֽ/חַטָּ֑את וַ/יִּסְמֹ֨ךְ אַהֲרֹ֤ן וּ/בָנָי/ו֙ אֶת יְדֵי/הֶ֔ם עַל רֹ֖אשׁ פַּ֥ר הַֽ/חַטָּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/014.yaml
  text: Then he brought near the bull of the sin offering[a], and Aaron and his sons laid their hands on the head of the bull of the sin offering.
translation:
  language: de
  text: Dann brachte er den Stier für das Sündopfer[a] herbei, und Aaron und seine Söhne legten ihre Hände auf den Kopf des Stiers für das Sündopfer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „führte den Stier für das Sündopfer vor“ beziehungsweise „brachte ihn näher heran“.'
    reason: Lexikalische Alternative für וַיַּגֵּשׁ; das Verb kann sowohl das Heranbringen als auch das Vorführen beziehungsweise Darbringen bezeichnen.
lexical_decisions:
- source_word: וַיַּגֵּשׁ
  choice: brachte … herbei
  rationale: Das Hifil von נגשׁ bezeichnet hier das Heranbringen beziehungsweise Vorführen des Opfertiers. „Herbeibringen“ ist modernes, natürliches Deutsch und bewahrt den rituellen Vorgang, ohne einen im Vers nicht ausdrücklich genannten Zielort zu ergänzen.
- source_word: פַּר
  choice: Stier
  rationale: פַּר bezeichnet im Opferkontext einen Stier. Das Alter des Tieres wird in diesem Vers nicht näher bestimmt, daher wird weder „Jungstier“ noch „Stierkalb“ ergänzt.
- source_word: הַחַטָּאת
  choice: Sündopfer
  rationale: חַטָּאת bezeichnet hier aufgrund des Opferkontexts nicht die Sünde selbst, sondern das entsprechende Opfer. „Sündopfer“ ist die klare und etablierte deutsche Wiedergabe.
- source_word: וַיִּסְמֹךְ
  choice: legten
  rationale: סמך bezeichnet im Opferritual das Auflegen beziehungsweise Aufstützen der Hand. „Die Hände auf den Kopf legen“ gibt die Handlung idiomatisch wieder, ohne die Stärke des ausgeübten Drucks festzulegen.
- source_word: יְדֵיהֶם
  choice: ihre Hände
  rationale: Der hebräische Text verwendet ausdrücklich den Plural „Hände“. Die deutsche Wiedergabe bewahrt diesen Numerus.
- source_word: עַל רֹאשׁ
  choice: auf den Kopf
  rationale: Die räumliche Wendung wird direkt und in modernem Deutsch wiedergegeben.
theological_decisions:
- issue: Bedeutung der Handauflegung im Opferritual
  choice: 'Die Handlung wird lediglich beschrieben: Aaron und seine Söhne legten ihre Hände auf den Kopf des Stiers.'
  alternative: Die Geste ausdrücklich als Übertragung von Schuld, Identifikation mit dem Opfer oder Weihe beziehungsweise Bestimmung des Tieres deuten.
  rationale: Der Vers berichtet die rituelle Handlung, erklärt aber ihre theologische Wirkweise nicht. Die Übersetzung bewahrt diese Offenheit und trägt keine bestimmte Deutung in den Text ein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „Stier für das Sündopfer“ folgt der hebräischen Ausdrucksweise und hält den Gegenstand der Handlung eindeutig fest. Der Fußnotenmarker [a] steht unmittelbar bei der relevanten Wendung.
