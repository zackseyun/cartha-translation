  text: וַ/יַּ֣עַשׂ מֹשֶׁ֔ה כַּֽ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֹת֑/וֹ וַ/תִּקָּהֵל֙ הָֽ/עֵדָ֔ה אֶל פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/004.yaml
  text: And Moses did as Yahweh commanded him[a], and the congregation assembled at the entrance to the tent of meeting.
translation:
  language: de
  text: Und Mose tat, was Jahwe ihm geboten hatte, und die Gemeinde versammelte sich[a] am Eingang des Zeltes der Begegnung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und die Versammlung kam am Eingang des Zeltes der Begegnung zusammen«; auch die passive Auffassung »wurde versammelt« ist möglich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: tat
  rationale: עשה bedeutet allgemein »tun/machen«; im Zusammenhang des Gehorsams gegenüber einem Gebot ist »tat« direkt und natürlich.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: was … geboten hatte
  rationale: Die deutsche Formulierung gibt die Übereinstimmung mit dem vorausgegangenen göttlichen Gebot idiomatisch wieder und bewahrt dessen verbindlichen Charakter.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; »Jahwe« ist die im Deutschen übliche wissenschaftliche Umschrift.
- source_word: וַתִּקָּהֵל
  choice: versammelte sich
  rationale: Der Nifal von קהל bezeichnet hier das Zusammenkommen der Gemeinde; das reflexive deutsche Verb ist natürlich und lässt die mögliche mediale Nuance erkennen.
- source_word: הָעֵדָה
  choice: die Gemeinde
  rationale: עדה bezeichnet die Gemeinschaft Israels. »Gemeinde« ist im pentateuchischen Zusammenhang verständlich und würdevoll, ohne sie auf einen modernen Gottesdienst zu beschränken.
- source_word: אֶל פֶּתַח
  choice: am Eingang
  rationale: אֶל bezeichnet die Richtung beziehungsweise das Ziel; nach einem Verb des Zusammenkommens gibt »am Eingang« das erreichte Ziel im Deutschen idiomatisch wieder.
- source_word: אֹהֶל מוֹעֵד
  choice: Zelt der Begegnung
  rationale: 'Die feste Bezeichnung wird transparent wiedergegeben: אֹהֶל ist »Zelt«, מוֹעֵד bezeichnet hier den bestimmten Ort beziehungsweise Zeitpunkt der Begegnung.'
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Gottesnamen selbst. »Jahwe« bewahrt ihn als Eigennamen und verwendet die im modernen Deutschen geläufige Form.
- issue: Bedeutung von אֹהֶל מוֹעֵד
  choice: Zelt der Begegnung
  alternative: Stiftshütte; Zelt der Zusammenkunft
  rationale: »Zelt der Begegnung« bewahrt die Grundbestandteile der hebräischen Wendung und vermeidet, die funktionale Bedeutung durch einen traditionellen, aber weniger transparenten Ausdruck zu ersetzen.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur bleibt nahe am Hebräischen, während idiomatische deutsche Wendungen verwendet werden.
