  text: וַ/יַּ֥ז מִמֶּ֛/נּוּ עַל הַ/מִּזְבֵּ֖חַ שֶׁ֣בַע פְּעָמִ֑ים וַ/יִּמְשַׁ֨ח אֶת הַ/מִּזְבֵּ֜חַ וְ/אֶת כָּל כֵּלָ֗י/ו וְ/אֶת הַ/כִּיֹּ֛ר וְ/אֶת כַּנּ֖/וֹ לְ/קַדְּשָֽׁ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/011.yaml
  text: He sprinkled some of it on the altar seven times[a], and he anointed the altar and all its utensils, and the basin and its stand[b], to consecrate them.
translation:
  language: de
  text: Er sprengte siebenmal etwas davon[a] auf den Altar und salbte den Altar und alle seine Geräte sowie das Becken und sein Gestell, um sie zu heiligen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »davon«; gemeint ist das zuvor erwähnte Salböl.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּז
  choice: Er sprengte
  rationale: Die Hifil-Form von נזה bezeichnet hier das rituelle Versprengen einer Flüssigkeit. „Sprengte“ ist im Deutschen die übliche präzise Wiedergabe in kultischem Zusammenhang.
- source_word: מִמֶּנּוּ
  choice: etwas davon
  rationale: Wörtlich „davon/aus ihm“; der Rückbezug gilt dem im Kontext genannten Salböl. „Etwas davon“ ist nach „sprengte“ natürlich und wahrt den partitiven Sinn.
- source_word: הַמִּזְבֵּחַ
  choice: den Altar
  rationale: Etablierte und eindeutige Wiedergabe von מִזְבֵּחַ im Opferkult.
- source_word: שֶׁבַע פְּעָמִים
  choice: siebenmal
  rationale: Natürliche deutsche Wiedergabe der adverbialen Wiederholungsangabe.
- source_word: וַיִּמְשַׁח
  choice: und salbte
  rationale: משׁח bezeichnet im kultischen Zusammenhang das Salben zur Weihe; „salbte“ erhält den rituellen Gehalt.
- source_word: כָּל כֵּלָיו
  choice: alle seine Geräte
  rationale: כְּלִי ist ein weiter Ausdruck für Gerätschaften beziehungsweise Gegenstände. „Geräte“ ist modern, verständlich und für Heiligtumsinventar passend.
- source_word: הַכִּיֹּר
  choice: das Becken
  rationale: Gemeint ist das Waschbecken im Bereich des Heiligtums. „Becken“ ist verständlicher und gegenwärtiger als das traditionelle „Waschfass“.
- source_word: כַּנּוֹ
  choice: sein Gestell
  rationale: כֵּן bezeichnet hier die tragende Vorrichtung des Beckens. „Gestell“ macht diese Funktion klar; „Sockel“ wäre ebenfalls möglich.
- source_word: לְקַדְּשָׁם
  choice: um sie zu heiligen
  rationale: Das Piel von קדשׁ bezeichnet das Aussondern beziehungsweise Bestimmen für den heiligen Gebrauch. „Heiligen“ bewahrt den Leitwortbezug zur Heiligkeit und ist im Deutschen verständlich.
theological_decisions:
- issue: Kultische Sprache für Handlungen und Gegenstände
  choice: Etablierte, aber verständliche Ausdrücke wie „salben“ und „heiligen“ verwenden
  alternative: Technischer „weihen“ oder umschreibend „für den heiligen Gebrauch aussondern“
  rationale: Der Text beschreibt die kultische Heiligung der Stiftshüttengeräte. Die gewählte Sprache wahrt die sakrale Dimension, ohne spätere konfessionelle Vorstellungen einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem hebräischen Handlungsablauf, wird aber durch „sowie“ natürlich gegliedert. „Becken“ und „Gestell“ vermeiden altertümliche Fachwörter.
