  text: וְ/אֶת הַ/קֶּ֥רֶב וְ/אֶת הַ/כְּרָעַ֖יִם רָחַ֣ץ בַּ/מָּ֑יִם וַ/יַּקְטֵר֩ מֹשֶׁ֨ה אֶת כָּל הָ/אַ֜יִל הַ/מִּזְבֵּ֗חָ/ה עֹלָ֨ה ה֤וּא לְ/רֵֽיחַ נִיחֹ֨חַ֙ אִשֶּׁ֥ה הוּא֙ לַ/יהוָ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/021.yaml
  text: He washed the entrails and the legs with water[a], and Moses burned the whole ram on the altar. It was a burnt offering for a pleasing aroma, a food offering to Yahweh, just as Yahweh had commanded Moses.
translation:
  language: de
  text: Die Eingeweide und die Unterschenkel wusch er mit Wasser. Dann ließ Mose den ganzen Widder auf dem Altar in Rauch aufgehen. Es war ein Brandopfer zu einem wohlgefälligen Duft, ein Feueropfer[a] für Jahwe, so wie Jahwe es Mose geboten hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Speisegabe für Jahwe“. Der hebräische Opferbegriff kann als durch Feuer dargebrachte Gabe oder als Gabe für den Altar verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֶּרֶב
  choice: die Eingeweide
  rationale: Bezeichnet die inneren Teile beziehungsweise Organe des Opfertiers; „Eingeweide“ ist im deutschen Opferkontext konkret und verständlich.
- source_word: הַכְּרָעַיִם
  choice: die Unterschenkel
  rationale: Das Wort bezeichnet hier die unteren Gliedmaßen des Tieres. „Unterschenkel“ ist genauer als das allgemeinere „Beine“.
- source_word: רָחַץ בַּמָּיִם
  choice: wusch ... mit Wasser
  rationale: Gibt sowohl das Verb „waschen“ als auch die ausdrücklich genannte Verwendung von Wasser wieder.
- source_word: וַיַּקְטֵר
  choice: ließ ... in Rauch aufgehen
  rationale: Das kultische Verb bezeichnet das Verbrennen auf dem Altar mit dem besonderen Gedanken, dass das Opfer als Rauch aufsteigt; diese Wiedergabe ist präziser als ein bloßes „verbrannte“.
- source_word: כָּל הָאַיִל
  choice: den ganzen Widder
  rationale: כָּל hebt hervor, dass der Widder vollständig dargebracht wurde.
- source_word: הַמִּזְבֵּחָה
  choice: auf dem Altar
  rationale: Natürliche deutsche Wiedergabe der lokalen Richtungsform im Opferzusammenhang.
- source_word: עֹלָה
  choice: Brandopfer
  rationale: Der etablierte deutsche Begriff für diese Opferart, bei der das Opfer vollständig auf dem Altar verbrannt wird.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: zu einem wohlgefälligen Duft
  rationale: Bewahrt das sinnliche Bild der hebräischen Kultformel und bringt zugleich zum Ausdruck, dass das Opfer als angenehm beziehungsweise annehmbar gilt.
- source_word: אִשֶּׁה
  choice: Feueropfer
  rationale: Die traditionelle und formal naheliegende Wiedergabe bezeichnet eine durch Feuer dargebrachte Opfergabe; die mögliche Deutung als Speisegabe wird in der Fußnote offengehalten.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Drückt die Bestimmung und Darbringung des Opfers für den mit seinem Eigennamen genannten Gott aus.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: so wie Jahwe es Mose geboten hatte
  rationale: Die Formulierung bewahrt die betonte Übereinstimmung des Vollzugs mit dem göttlichen Gebot und fügt sich natürlich in die Erzählfolge ein.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen יהוה. „Jahwe“ bewahrt diesen als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Kultische Formel לְרֵיחַ נִיחֹחַ
  choice: zu einem wohlgefälligen Duft
  alternative: zu einem beruhigenden Duft
  rationale: Die gewählte Formulierung bewahrt die Duftmetapher und den Gedanken göttlichen Wohlgefallens, ohne sie durch eine weitergehende theologische Erklärung aufzulösen.
- issue: Bedeutung von אִשֶּׁה
  choice: Feueropfer
  alternative: Speisegabe
  rationale: Die genaue Herleitung und Bedeutungsnuance des kultischen Ausdrucks ist umstritten. Der Haupttext folgt der formnahen traditionellen Deutung; die alternative Auffassung als Altar- beziehungsweise Speisegabe bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt nah am Hebräischen, während „Dann“ den Subjektwechsel zu Mose verdeutlicht. Kultische Fachbegriffe werden verständlich, aber nicht paraphrasierend wiedergegeben.
