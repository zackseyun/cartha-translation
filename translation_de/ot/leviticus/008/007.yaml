  text: וַ/יִּתֵּ֨ן עָלָ֜י/ו אֶת הַ/כֻּתֹּ֗נֶת וַ/יַּחְגֹּ֤ר אֹת/וֹ֙ בָּֽ/אַבְנֵ֔ט וַ/יַּלְבֵּ֤שׁ אֹת/וֹ֙ אֶֽת הַ/מְּעִ֔יל וַ/יִּתֵּ֥ן עָלָ֖י/ו אֶת הָ/אֵפֹ֑ד וַ/יַּחְגֹּ֣ר אֹת֗/וֹ בְּ/חֵ֨שֶׁב֙ הָֽ/אֵפֹ֔ד וַ/יֶּאְפֹּ֥ד ל֖/וֹ בּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/007.yaml
  text: And he put the tunic on him[a], and fastened him with the sash, and clothed him with the robe, and put the ephod on him, and fastened it on him with the skillfully woven band of the ephod[b], and tied the ephod to him with it.
translation:
  language: de
  text: Und er legte ihm das Untergewand an, band ihm die Schärpe um, bekleidete ihn mit dem Obergewand und legte ihm das Efod an; dann band er ihm den kunstvoll gewebten Gurt des Efods um und befestigte das Efod damit an ihm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das seltene hebräische Verb ist von »Efod« abgeleitet. Gemeint ist wahrscheinlich, dass das Efod mit seinem kunstvoll gewebten Gurt an Aaron befestigt wurde.
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: כֻּתֹּנֶת
  choice: Untergewand
  rationale: Bezeichnet hier das grundlegende priesterliche Kleidungsstück, das unter den weiteren Gewändern getragen wurde; »Untergewand« ist im Deutschen verständlich und in diesem kultischen Zusammenhang präzise.
- source_word: אַבְנֵט
  choice: Schärpe
  rationale: Gemeint ist ein um den Leib gelegtes Stoffband; »Schärpe« unterscheidet es sachgerecht von einem gewöhnlichen Ledergürtel.
- source_word: מְעִיל
  choice: Obergewand
  rationale: Bezeichnet das über dem Untergewand getragene Kleidungsstück; »Obergewand« gibt die relative Lage klar und natürlich wieder.
- source_word: אֵפֹד
  choice: Efod
  rationale: Für dieses besondere priesterliche Kleidungsstück gibt es keine genaue deutsche Entsprechung; die eingebürgerte Transliteration bewahrt den kultischen Fachbegriff.
- source_word: חֵשֶׁב הָאֵפֹד
  choice: kunstvoll gearbeiteter Gurt des Efods
  rationale: חֵשֶׁב bezeichnet hier den zum Efod gehörenden, handwerklich gefertigten Gurt beziehungsweise Bund; die Wiedergabe verbindet Funktion und Herstellungsart.
- source_word: וַיַּחְגֹּר אֹתוֹ
  choice: band ihm die Schärpe um
  rationale: חגר beschreibt das Umgürten. Die Formulierung ist modernes, idiomatisches Deutsch und bildet die konkrete Handlung ab.
- source_word: וַיֶּאְפֹּד לוֹ בּוֹ
  choice: befestigte damit das Efod an ihm
  rationale: Das seltene, von אֵפֹד abgeleitete Verb bezeichnet hier offenbar das Festmachen des Efods; בּוֹ verweist auf den zuvor genannten Gurt.
- source_word: וַיִּתֵּן עָלָיו
  choice: legte ihm ... an
  rationale: Die hebräische Wendung beschreibt hier das Anlegen eines Kleidungsstücks; »legte ihm ... an« ist im Deutschen idiomatisch und wahrt den Ablauf der Einkleidung.
theological_decisions:
- issue: Wiedergabe der priesterlichen Gewandbezeichnungen
  choice: Den kultischen Fachbegriff »Efod« beibehalten, allgemein verständliche Gewänder jedoch funktional übersetzen
  alternative: Das Efod beschreibend als »schürzenartiges Priestergewand« wiedergeben
  rationale: Die Transliteration wahrt die besondere kultische Bedeutung, ohne dem Gegenstand eine nicht ausdrücklich im Vers genannte Form zuzuschreiben. Die übrigen Begriffe bleiben für heutige Leser verständlich.
- issue: Bezug des abschließenden בּוֹ und Bedeutung des seltenen Verbs וַיֶּאְפֹּד
  choice: Den Gurt als Mittel zur Befestigung des Efods verstehen
  alternative: 'Wörtlicher und weniger eindeutig: »und umgürtete ihn damit«'
  rationale: Wortbildung, unmittelbarer Kontext und Abfolge der Einkleidung sprechen dafür, dass das Efod mithilfe seines Gurtes an Aaron befestigt wird; wegen der sprachlichen Seltenheit wird die Unsicherheit in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholten Handlungen der feierlichen Einkleidung bleiben klar erkennbar; ungebräuchliche Archaismen wie »gürtete ihn« werden vermieden. Der technische Begriff »Efod« wird beibehalten.
