  text: And he slaughtered it[a], and Moses threw the blood against the altar all around.
translation:
  language: de
  text: Er schlachtete ihn, und Mose schleuderte[a] das Blut an alle Seiten des Altars.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „warf das Blut an alle Seiten des Altars“. Das hebräische Verb bezeichnet hier ein kräftiges Anbringen des Opferblutes am Altar, nicht ein leichtes Besprengen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחָט
  choice: Er schlachtete ihn
  rationale: שׁחט bezeichnet im Opferkontext das Schlachten eines Tieres. Das im Deutschen erforderliche Objekt „ihn“ wird aus dem unmittelbar vorausgehenden Kontext ergänzt und bezieht sich auf den Widder.
- source_word: וַיִּזְרֹק
  choice: sprengte
  rationale: זרק bezeichnet hier das kräftige Werfen beziehungsweise Sprengen von Opferblut an den Altar. „Sprengte“ ist im deutschen Opferwortschatz verständlich und wird durch die Fußnote gegen die Vorstellung eines feinen Besprühens abgegrenzt.
- source_word: הַדָּם
  choice: das Blut
  rationale: Die bestimmte Nominalform wird direkt und natürlich wiedergegeben.
- source_word: הַמִּזְבֵּחַ
  choice: den Altar
  rationale: „Altar“ ist die übliche und sachlich genaue Wiedergabe von מִזְבֵּחַ.
- source_word: סָבִיב
  choice: ringsum
  rationale: Das Adverb bezeichnet die Verteilung des Blutes rings um die Seiten beziehungsweise den Umfang des Altars.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Der Personenname wird nach der etablierten deutschen Bibeltradition wiedergegeben.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. „Schlachtete“ wahrt den Opferkontext; „ringsum“ gibt die räumliche Verteilung knapp und idiomatisch wieder.
