lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Da sprach
  rationale: Das Narrativ-Waw führt die Handlung fort. „Da sprach“ gibt die zeitliche Abfolge in natürlichem, würdigem Deutsch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: אֶל מֹשֶׁה
  choice: zu Mose
  rationale: אֶל kennzeichnet hier den Adressaten des Sprechens; „zu Mose“ ist die übliche deutsche Fügung.
- source_word: לֵאמֹר
  choice: Doppelpunkt
  rationale: Die hebräische Einleitungsformel kündigt die folgende direkte Rede an. Im modernen Deutschen erfüllt ein Doppelpunkt diese Funktion natürlicher als das formelhafte „und sagte“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Gottesnamen unmittelbar. „Jahwe“ bewahrt seinen Charakter als Eigenname; die traditionelle Ersetzung und eine weitere Namensform werden in der Fußnote genannt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die knappe Redeeinleitung wird idiomatisch durch einen Doppelpunkt abgeschlossen, da der Inhalt in Vers 2 folgt.
