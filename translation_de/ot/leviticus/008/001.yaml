base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: de
  text: 'Da sprach Jahwe zu Mose[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben. Eine andere Wiedergabe ist „Jehova“.'
