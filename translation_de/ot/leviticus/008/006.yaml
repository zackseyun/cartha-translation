base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/006.yaml
  text: Then Moses brought Aaron and his sons near and washed them with water.
translation:
  language: de
  text: Dann ließ Mose Aaron und seine Söhne herantreten und wusch sie mit Wasser.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: ließ … herantreten
  rationale: Der Hifil von קרב bedeutet „nahebringen“ bzw. „herantreten lassen“. Im Deutschen gibt „ließ … herantreten“ die konkrete Annäherung im Einsetzungsritual natürlich und präzise wieder.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Im modernen deutschen Bibelgebrauch übliche Namensform.
- source_word: אַהֲרֹן
  choice: Aaron
  rationale: Im Deutschen übliche Namensform.
- source_word: בָּנָיו
  choice: seine Söhne
  rationale: בנים bezeichnet hier Aarons männliche Nachkommen, die in das Priesteramt eingesetzt werden.
- source_word: וַיִּרְחַץ
  choice: wusch
  rationale: רחץ bezeichnet Waschen oder Baden. „Wusch“ ist hier idiomatisch und legt den Umfang der rituellen Waschung nicht näher fest, als es der hebräische Text tut.
- source_word: אֹתָם
  choice: sie
  rationale: Das Akkusativpronomen bezieht sich gemeinsam auf Aaron und seine Söhne.
- source_word: בַּמָּיִם
  choice: mit Wasser
  rationale: Die Präposition ב bezeichnet hier am natürlichsten das Mittel der Waschung; „mit Wasser“ ist die entsprechende deutsche Wendung.
- source_word: וַ
  choice: Dann
  rationale: Das narrative Waw führt die Handlung fort; „Dann“ macht die zeitliche Abfolge in modernem Deutsch deutlich.
