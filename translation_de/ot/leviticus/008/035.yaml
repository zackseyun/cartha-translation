  variant: modern standard German
source:
  edition: WLC
  text: וּ/פֶתַח֩ אֹ֨הֶל מוֹעֵ֜ד תֵּשְׁב֨וּ יוֹמָ֤ם וָ/לַ֨יְלָה֙ שִׁבְעַ֣ת יָמִ֔ים וּ/שְׁמַרְתֶּ֛ם אֶת מִשְׁמֶ֥רֶת יְהוָ֖ה וְ/לֹ֣א תָמ֑וּתוּ כִּי כֵ֖ן צֻוֵּֽיתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/035.yaml
  text: And you shall stay at the entrance of the tent of meeting day and night for seven days[a], and keep the charge of Yahweh, so that you may not die; for so I have been commanded.
translation:
  language: de
  text: Am Eingang des Zeltes der Begegnung sollt ihr sieben Tage lang Tag und Nacht bleiben und Jahwes Weisung befolgen, damit ihr nicht sterbt[a]; denn so ist es mir geboten worden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „und ihr werdet nicht sterben“; oder warnend: „sonst sterbt ihr“.'
    reason: Die hebräische Verbindung וְלֹא kann hier als Folge beziehungsweise Zweck oder als koordinierte Aussage verstanden werden.
lexical_decisions:
- source_word: וּפֶתַח אֹהֶל מוֹעֵד
  choice: Am Eingang des Zeltes der Begegnung
  rationale: פֶתַח bezeichnet den Eingang oder die Öffnung. אֹהֶל מוֹעֵד wird als feste Bezeichnung des Heiligtums mit „Zelt der Begegnung“ wiedergegeben.
- source_word: תֵּשְׁבוּ
  choice: sollt ihr … bleiben
  rationale: ישׁב kann „sitzen“, „wohnen“ oder „bleiben“ bedeuten. Im Zusammenhang der siebentägigen Priesterweihe ist das fortdauernde Verbleiben gemeint.
- source_word: יוֹמָם וָלַיְלָה שִׁבְעַת יָמִים
  choice: sieben Tage lang Tag und Nacht
  rationale: Die Zeitangabe wird in natürlichem Deutsch wiedergegeben; „Tag und Nacht“ bezeichnet die ununterbrochene Dauer.
- source_word: וּשְׁמַרְתֶּם אֶת מִשְׁמֶרֶת יְהוָה
  choice: und Jahwes Dienstauftrag befolgen
  rationale: Die Verbindung von שׁמר und משׁמרת bezeichnet das gewissenhafte Einhalten einer übertragenen kultischen Pflicht. „Dienstauftrag“ wahrt den priesterlichen Zusammenhang, während „befolgen“ im modernen Deutsch natürlicher ist als die wörtliche Verbindung „eine Wache bewahren“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְלֹא תָמֻתוּ
  choice: damit ihr nicht sterbt
  rationale: Nach den Aufforderungen lässt sich die mit וְלֹא eingeleitete Aussage als vermiedene Folge des Gehorsams verstehen. Die formal mögliche koordinierte Lesart bleibt in der Fußnote erhalten.
- source_word: כִּי כֵן צֻוֵּיתִי
  choice: denn so ist es mir geboten worden
  rationale: Die passive Form bezeichnet den an Mose ergangenen Befehl. Das deutsche Perfekt betont seine fortdauernde Geltung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. „Jahwe“ bewahrt ihn als persönlichen Namen, ohne ihn durch einen Titel zu ersetzen.
- issue: Aussagekraft der Todeswarnung וְלֹא תָמֻתוּ
  choice: damit ihr nicht sterbt
  alternative: und ihr werdet nicht sterben; sonst müsst ihr sterben
  rationale: Im Zusammenhang fungiert die Aussage wahrscheinlich als Warnung vor der durch Ungehorsam drohenden Folge. Da die hebräische Reihung auch koordinierend verstanden werden kann, wird diese Mehrdeutigkeit in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt dem feierlichen Weisungscharakter des hebräischen Textes nahe, vermeidet jedoch unnötig altertümliche Wendungen.
