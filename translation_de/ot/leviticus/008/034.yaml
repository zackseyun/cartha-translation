id: LEV.8.34
reference: Leviticus 8:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֥ר עָשָׂ֖ה בַּ/יּ֣וֹם הַ/זֶּ֑ה צִוָּ֧ה יְהוָ֛ה לַ/עֲשֹׂ֖ת לְ/כַפֵּ֥ר עֲלֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/034.yaml
  text: Just as has been done on this day[a], Yahweh has commanded to be done, to make atonement for you.
translation:
  language: de
  text: Wie es an diesem Tag getan wurde,[a] so hat Jahwe geboten, es zu tun, um für euch Sühne zu erwirken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Was heute getan wurde, hat Jahwe zu tun geboten, um für euch Sühne zu erwirken.«'
    reason: 'Syntaktische Alternative: Die hebräische Vergleichskonstruktion kann im Deutschen auch als vorangestellter Gegenstand des göttlichen Gebots wiedergegeben werden.'
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Wie … so
  rationale: Gibt den vergleichenden Zusammenhang mit den zuvor vollzogenen Ritualhandlungen wieder und bewahrt die syntaktische Entsprechung des Hebräischen.
- source_word: עָשָׂה
  choice: es … getan wurde
  rationale: Die morphologische Form ist 3. Person maskulin Singular, doch der Handelnde bleibt im Zusammenhang unausgesprochen. Das deutsche Passiv vermeidet eine nicht ausdrücklich genannte Person und verweist natürlich auf den vollzogenen Ritus.
- source_word: בַּיּוֹם הַזֶּה
  choice: an diesem Tag
  rationale: Bewahrt die konkrete zeitliche Wendung und den feierlich-rituellen Ton; „heute“ wäre ebenfalls möglich.
- source_word: צִוָּה
  choice: hat … geboten
  rationale: Das Perfekt bezeichnet den ergangenen, weiterhin maßgeblichen Befehl. „Geboten“ ist prägnant und dem würdevollen Register angemessen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt das Tetragramm als persönlichen Gottesnamen wieder, statt es durch einen Titel zu ersetzen.
- source_word: לַעֲשֹׂת
  choice: es zu tun
  rationale: Nimmt die Wiederholung von עשה auf. Das Pronomen „es“ bezieht sich auf die genannten Ritualhandlungen, ohne einen Handelnden festzulegen.
- source_word: לְכַפֵּר
  choice: um … Sühne zu erwirken
  rationale: Gibt die kultisch-priesterliche Bedeutung von כפר in verständlichem, gegenwärtigem Deutsch wieder, ohne den genauen theologischen Mechanismus enger zu bestimmen.
- source_word: עֲלֵיכֶם
  choice: für euch
  rationale: Mit כפר bezeichnet על hier die Personen, zu deren Gunsten die Sühne geschieht; „für euch“ ist natürlich und präzise.
theological_decisions:
- issue: Wiedergabe von כפר im Opferkontext
  choice: um für euch Sühne zu erwirken
  alternative: um euch zu entsühnen; um für euch Versöhnung zu schaffen
  rationale: „Sühne erwirken“ bewahrt den kultischen Sinn und bleibt verständlich. „Entsühnen“ könnte stärker auf Reinigung festlegen, während „Versöhnung“ den Ausdruck relational verengen könnte.
- issue: Unausgesprochener Handelnder bei עָשָׂה und לַעֲשֹׂת
  choice: passive beziehungsweise unpersönliche Wiedergabe
  alternative: „Wie er es an diesem Tag getan hat …“
  rationale: Das Hebräische hat bei עָשָׂה formal ein maskulines Singularsubjekt, nennt es jedoch nicht ausdrücklich. Die gewählte Form vermeidet, Mose oder eine andere Person interpretierend einzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter kultischer Terminologie. Die Wiederholung von „tun“ entspricht der Wiederaufnahme von עשה im Hebräischen und wurde trotz leichter stilistischer Schwere beibehalten.
