  naturalness: Modernes, würdiges Standarddeutsch. Die Änderung von „über dem Brandopfer“ zu „auf dem Brandopfer“ beseitigt eine im Deutschen naheliegende räumliche Fehlassoziation. „als wohlgefälliger Duft“ gibt die feste Opferformel idiomatischer und genauer wieder als „zum wohlgefälligen Duft“.
  terminology: „Einsetzungsopfer“ ist im unmittelbaren Kontext der priesterlichen Einsetzung eine gute, nicht konfessionell verengte Wiedergabe von מִלֻּאִים. „Feueropfer“ ist für אִשֶּׁה als tradierter kultischer Fachausdruck vertretbar; die Fußnote wahrt die allgemeinere Deutungsmöglichkeit. „Jahwe“ entspricht der im Entwurf gewählten Namenspraxis.
