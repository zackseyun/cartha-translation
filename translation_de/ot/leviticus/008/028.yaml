base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/028.yaml
  text: Then Moses took them from their palms and burned them on the altar[a], on top of the burnt offering. They were an ordination offering for a pleasing aroma[b], a food offering to Yahweh.
translation:
  language: de
  text: Dann nahm Mose sie von ihren Handflächen und ließ sie auf dem Altar, auf dem Brandopfer, in Rauch aufgehen. Sie waren ein Einsetzungsopfer[a] als wohlgefälliger Duft, ein Feueropfer[b] für Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Weiheopfer“. Das hebräische Wort ist ein Fachausdruck für das Opfer bei der Einsetzung der Priester.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder allgemeiner: „Opfergabe“. Das hebräische Wort bezeichnet eine auf dem Altar dargebrachte Gabe und wird traditionell als „Feueropfer“ wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעַל כַּפֵּיהֶם
  choice: von ihren Handflächen
  rationale: כַּפַּיִם bezeichnet hier konkret die Handflächen, auf denen die Opferteile zuvor lagen. Die körperlich anschauliche Formulierung bleibt auch im Deutschen natürlich verständlich.
- source_word: וַיַּקְטֵר
  choice: ließ … in Rauch aufgehen
  rationale: Der Hifil von קטר bezeichnet im Opferkontext das Verbrennen beziehungsweise Aufsteigenlassen als Rauch auf dem Altar. Diese Wiedergabe ist genauer als das allgemeinere „verbrannte“.
- source_word: הַמִּזְבֵּחָה עַל הָעֹלָה
  choice: auf dem Altar über dem Brandopfer
  rationale: Die Richtungsform bei „Altar“ bezeichnet den Ort der Opferhandlung; עַל wird in seinem gewöhnlichen räumlichen Sinn wiedergegeben, ohne mehr über die genaue Anordnung auszusagen.
- source_word: מִלֻּאִים
  choice: Einsetzungsopfer
  rationale: Der technische Ausdruck gehört zum Ritual der Einsetzung Aarons und seiner Söhne. „Einsetzungsopfer“ benennt diese Funktion verständlich, ohne spätere kirchliche Amtsvorstellungen einzutragen.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: zum wohlgefälligen Duft
  rationale: Die feste priesterliche Opferformel bezeichnet einen Duft, der Wohlgefallen beziehungsweise Annahme ausdrückt. Die traditionelle und würdige deutsche Wendung bewahrt dieses Bild.
- source_word: אִשֶּׁה
  choice: Feueropfer
  rationale: Der kultische Fachausdruck bezeichnet eine auf dem Altar dargebrachte Opfergabe. „Feueropfer“ erhält den Zusammenhang mit dem Verbrennen und vermeidet die sachlich stärker deutende Wiedergabe „Speiseopfer“.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition kennzeichnet Jahwe als Empfänger der Opfergabe; der Gottesname wird als Eigenname wiedergegeben.
theological_decisions:
- issue: Bedeutung des technischen Ausdrucks מִלֻּאִים
  choice: Einsetzungsopfer
  alternative: Weiheopfer
  rationale: Der Kontext ist die Einsetzung der Priester. „Einsetzungsopfer“ beschreibt die konkrete rituelle Funktion, während „Weiheopfer“ ebenfalls möglich, aber allgemeiner ist.
- issue: Wiedergabe von אִשֶּׁה
  choice: Feueropfer
  alternative: Opfergabe
  rationale: Die genaue Herleitung des priesterlichen Fachworts ist nicht völlig sicher. „Feueropfer“ wahrt die herkömmliche Verbindung mit der Darbringung auf dem Altar; die Fußnote hält die allgemeinere Möglichkeit offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkrete Ritualsprache bleibt erhalten; technische Begriffe werden knapp in Fußnoten erläutert. Der Gottesname wird als „Jahwe“ wiedergegeben.
