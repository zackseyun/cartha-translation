base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/022.yaml
  text: Then he brought near the second ram[a], the ram of ordination, and Aaron and his sons laid their hands on the head of the ram.
translation:
  language: de
  text: Dann brachte er den zweiten Widder herbei, den Widder für die Einsetzung[a]. Aaron und seine Söhne legten ihre Hände auf den Kopf des Widders.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Widder für die Weihe«. Der hebräische Ausdruck ist ein priesterlicher Fachbegriff für das Ritual der Einsetzung in das Amt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: Dann brachte er ... herbei
  rationale: Die Hifil-Form von קרב bedeutet hier, ein Opfertier heranzubringen beziehungsweise vorzuführen. »Brachte ... herbei« gibt die kultische Handlung natürlich wieder; »Dann« bildet die fortschreitende Erzählung ab.
- source_word: הָאַיִל הַשֵּׁנִי
  choice: den zweiten Widder
  rationale: אַיִל bezeichnet einen Widder, הַשֵּׁנִי ist die Ordnungszahl »zweite« und verweist auf die Abfolge der Opfer.
- source_word: אֵיל הַמִּלֻּאִים
  choice: den Widder für die Einsetzung
  rationale: מִלֻּאִים ist hier ein priesterlicher Fachbegriff für das Ritual, durch das Aaron und seine Söhne in ihr Amt eingesetzt werden. »Für die Einsetzung« ist im modernen Deutsch verständlich und bewahrt den Amtsbezug.
- source_word: וַיִּסְמְכוּ ... אֶת יְדֵיהֶם
  choice: legten ihre Hände
  rationale: סמך bezeichnet im Opferzusammenhang das Auflegen beziehungsweise feste Aufstützen der Hände auf das Opfertier. Der Plural »ihre Hände« folgt dem hebräischen Wortlaut.
- source_word: עַל רֹאשׁ הָאָיִל
  choice: auf den Kopf des Widders
  rationale: Direkte und natürliche Wiedergabe der räumlichen Angabe und des Gegenstands der rituellen Handlung.
- source_word: אַהֲרֹן וּבָנָיו
  choice: Aaron und seine Söhne
  rationale: בָנָיו meint in diesem Zusammenhang Aarons männliche Nachkommen, die zusammen mit ihm in den Priesterdienst eingesetzt werden.
theological_decisions:
- issue: Wiedergabe des priesterlichen Fachbegriffs מִלֻּאִים
  choice: Widder für die Einsetzung
  alternative: Widder für die Weihe
  rationale: Der Abschnitt handelt sowohl von Heiligung als auch von der Einsetzung in das Priesteramt. »Einsetzung« bringt den konkreten Amtsantritt deutlicher zum Ausdruck; die ebenfalls mögliche Wiedergabe »Weihe« wird in der Fußnote bewahrt, ohne die begriffliche Spannung aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung erleichtert das Lesen, ohne die Abfolge oder den Zusammenhang der beiden Handlungen zu verändern. Der technische Begriff wird verständlich übersetzt und durch eine knappe Fußnote ergänzt.
