source:
  edition: WLC
  text: וַ/יִּקַּ֞ח אֶת הַ/חֵ֣לֶב וְ/אֶת הָֽ/אַלְיָ֗ה וְ/אֶֽת כָּל הַ/חֵלֶב֮ אֲשֶׁ֣ר עַל הַ/קֶּרֶב֒ וְ/אֵת֙ יֹתֶ֣רֶת הַ/כָּבֵ֔ד וְ/אֶת שְׁתֵּ֥י הַ/כְּלָיֹ֖ת וְ/אֶֽת חֶלְבְּ/הֶ֑ן וְ/אֵ֖ת שׁ֥וֹק הַ/יָּמִֽין־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/025.yaml
  text: Then he took the fat[a], and the fat tail, and all the fat that was on the entrails, and the lobe of the liver, and the two kidneys with their fat, and the right thigh.
translation:
  language: de
  text: Dann nahm er das Fett, den Fettschwanz, alles Fett an den Eingeweiden, den Leberlappen[a], die beiden Nieren samt ihrem Fett und die rechte Keule.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Fortsatz der Leber“. Der hebräische Ausdruck bezeichnet einen bestimmten Teil, der beim Opferverfahren entfernt wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Dann nahm er
  rationale: Das Waw-Konsekutiv führt die Handlung fort; „Dann“ gibt die zeitliche Abfolge im Deutschen natürlich wieder.
- source_word: הַחֵלֶב
  choice: das Fett
  rationale: Der übliche Ausdruck für die im Opferverfahren ausgesonderten Fettteile.
- source_word: הָאַלְיָה
  choice: den Fettschwanz
  rationale: Gemeint ist der ausgeprägte fettreiche Schwanz eines Schafes, nicht lediglich ein beliebiger Schwanz.
- source_word: כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: alles Fett an den Eingeweiden
  rationale: קֶרֶב bezeichnet hier die inneren Organe; die Formulierung ist konkret, verständlich und anatomisch angemessen.
- source_word: יֹתֶרֶת הַכָּבֵד
  choice: den Leberlappen
  rationale: Der Ausdruck bezeichnet einen bestimmten, beim Opfer entfernten Teil beziehungsweise Fortsatz der Leber; „Leberlappen“ ist die knappste natürliche Wiedergabe.
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: die beiden Nieren
  rationale: Direkte und natürliche Wiedergabe der anatomischen Bezeichnung samt Zweizahl.
- source_word: חֶלְבְּהֶן
  choice: samt ihrem Fett
  rationale: „Samt“ verbindet die Nieren idiomatisch mit dem ihnen zugehörigen Fett und bewahrt die possessive Beziehung.
- source_word: שׁוֹק הַיָּמִין
  choice: die rechte Keule
  rationale: שׁוֹק bezeichnet hier den kräftigen oberen Abschnitt des Beins; „Keule“ passt zum Kontext der Zerlegung eines Opfertiers.
