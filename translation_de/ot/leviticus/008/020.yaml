  text: Then he cut the ram into its pieces[a], and Moses burned the head, the pieces, and the suet in smoke.
translation:
  language: de
  text: Den Widder zerlegte er in seine Stücke. Dann ließ Mose den Kopf, die Stücke und das Fett in Rauch aufgehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאַיִל
  choice: den Widder
  rationale: אַיִל bezeichnet im Opferkontext einen ausgewachsenen männlichen Schafbock; „Widder“ ist die übliche und präzise deutsche Bezeichnung.
- source_word: נִתַּח לִנְתָחָיו
  choice: zerlegte er in seine Stücke
  rationale: Die Verbindung aus dem Verb נתּח und dem stammverwandten Substantiv bezeichnet das Zerlegen des Opfertiers in einzelne Teile. Das Deutsche gibt die hebräische Konstruktion natürlich wieder.
- source_word: וַיַּקְטֵר
  choice: ließ ... auf dem Altar in Rauch aufgehen
  rationale: Der Hifil von קטר bezeichnet im Opferdienst das Verbrennen, durch das die Opferteile als Rauch aufsteigen. „Auf dem Altar“ ist aus dem unmittelbaren Ritualzusammenhang erschlossen und macht den kultischen Vorgang verständlich.
- source_word: הָרֹאשׁ
  choice: den Kopf
  rationale: Direkte und kontextgemäße Wiedergabe des anatomischen Begriffs.
- source_word: הַנְּתָחִים
  choice: die Stücke
  rationale: Das Wort nimmt die zuvor genannten, beim Zerlegen entstandenen Teile wieder auf; „Stücke“ bewahrt diese lexikalische Verbindung.
- source_word: הַפָּדֶר
  choice: das Fett
  rationale: פָּדֶר bezeichnet eine Fettpartie des Opfertiers. „Fett“ wahrt die lexikalische Breite, ohne die im hebräischen Text nicht ausdrücklich genannte Deutung als Fettschwanz festzuschreiben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Wechsel vom zunächst nicht ausdrücklich genannten Handelnden zu „Mose“ bleibt erhalten. „Auf dem Altar“ verdeutlicht den im Kontext vorausgesetzten Ort des kultischen Verbrennens.
