  text: And he placed the breastpiece on him[b][a], and he put the Urim and the Thummim into the breastpiece.
translation:
  language: de
  text: Er legte ihm das Bruststück[a] an und legte die Urim und die Tummim[b] in das Bruststück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionell auch »Brustschild«. Gemeint ist ein am Brustbereich getragenes Teil der hohenpriesterlichen Kleidung; »Bruststück« vermeidet die Vorstellung einer Rüstung.
    reason: lexical_alternative
  - marker: b
    text: »Urim« und »Tummim« sind hebräische kultische Bezeichnungen. Ihre genaue Gestalt und Verwendungsweise sind unbekannt.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשֶׂם עָלָיו
  choice: legte er ihm … an
  rationale: שׂוּם עַל bezeichnet hier im Zusammenhang der priesterlichen Einkleidung das Anlegen eines Kleidungs- bzw. Ausrüstungsstücks. Die deutsche Wendung ist natürlich und bewahrt den räumlichen Sinn.
- source_word: הַחֹשֶׁן
  choice: die Brusttasche
  rationale: חֹשֶׁן bezeichnet das am Brustbereich getragene hohepriesterliche Stück, das die Urim und Tummim aufnehmen konnte. „Brusttasche“ vermeidet die irreführende Vorstellung eines Rüstungsteils, ohne die genaue Gestalt als sicher auszugeben.
- source_word: וַיִּתֵּן אֶל
  choice: tat … in
  rationale: נתן mit אֶל hat hier den Sinn, Gegenstände in die Brusttasche hineinzulegen. „tat … in“ gibt den Vorgang schlicht und idiomatisch wieder.
- source_word: הָאוּרִים וְאֶת הַתֻּמִּים
  choice: die Urim und die Tummim
  rationale: Beide Wörter sind kultische Fachbegriffe für Gegenstände oder Mittel priesterlicher Entscheidungsfindung, deren genaue Beschaffenheit und Verwendung unsicher sind. Die Umschrift bewahrt diese Unbestimmtheit.
theological_decisions:
- issue: Wiedergabe der priesterlichen Gegenstände אוּרִים וְתֻּמִּים
  choice: die Urim und die Tummim
  alternative: die Lichter und die Vollkommenheiten; die heiligen Lose
  rationale: Eine Übersetzung der Namen oder ihre Gleichsetzung mit Losen würde eine umstrittene Deutung festlegen. Die traditionelle Umschrift wahrt die Eigenart und Unsicherheit der hebräischen Begriffe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Anlegen“ passt zum zeremoniellen Einkleidungsvorgang; „tat … in“ ist bewusst schlicht. Die Fachbegriffe Urim und Tummim bleiben unübersetzt.
