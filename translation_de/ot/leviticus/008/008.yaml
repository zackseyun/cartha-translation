  terminology: „Bruststück“ ist für חֹשֶׁן ein geeigneter, formneutraler Terminus und vermeidet sowohl die Rüstungsassoziation von „Brustschild“ als auch die zu enge Festlegung von „Brusttasche“. Die traditionellen kultischen Bezeichnungen „die Urim und die Tummim“ sollen erhalten bleiben. Die Fußnote darf ihre Funktion nicht als Gegenstände oder Mittel zur Ermittlung einer göttlichen Entscheidung darstellen, da dies über die im Vers selbst gesicherte Aussage hinausgeht.
