source:
  edition: WLC
  text: וַ/יִּצֹק֙ מִ/שֶּׁ֣מֶן הַ/מִּשְׁחָ֔ה עַ֖ל רֹ֣אשׁ אַהֲרֹ֑ן וַ/יִּמְשַׁ֥ח אֹת֖/וֹ לְ/קַדְּשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/012.yaml
  text: Then he poured some of the anointing oil on Aaron’s head and anointed him to consecrate him.
translation:
  language: de
  text: Dann goss er etwas von dem Salböl auf Aarons Kopf und salbte ihn, um ihn zu weihen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצֹק
  choice: goss
  rationale: יצק bezeichnet hier das Ausgießen einer Flüssigkeit; „goss“ ist im modernen Deutschen die natürliche und genaue Wiedergabe.
- source_word: מִשֶּׁמֶן הַמִּשְׁחָה
  choice: etwas von dem Salböl
  rationale: 'Die Präposition מִן hat hier wahrscheinlich partitiven Sinn: Mose nahm eine gewisse Menge vom Salböl. „Salböl“ gibt שֶׁמֶן הַמִּשְׁחָה idiomatisch wieder.'
- source_word: עַל רֹאשׁ אַהֲרֹן
  choice: auf Aarons Kopf
  rationale: Die Ortsangabe wird direkt und in natürlichem modernem Deutsch wiedergegeben.
- source_word: וַיִּמְשַׁח
  choice: salbte
  rationale: „Salben“ ist die etablierte, sachlich genaue Wiedergabe von משׁח und bewahrt die rituelle Bedeutung des Vorgangs.
- source_word: לְקַדְּשׁוֹ
  choice: um ihn zu weihen
  rationale: Im Zusammenhang der Einsetzung Aarons bezeichnet קדשׁ sein Aussondern und Bestimmen für den heiligen Dienst. „Weihen“ drückt diesen kultischen Sinn klar und knapp aus.
- source_word: וַ
  choice: Dann
  rationale: Das narrative Waw führt die Abfolge der Handlungen fort; „Dann“ macht diese zeitliche Folge im Deutschen natürlich deutlich.
theological_decisions:
- issue: Wiedergabe von קדשׁ bei der Einsetzung zum Priesterdienst
  choice: um ihn zu weihen
  alternative: um ihn zu heiligen / um ihn für den heiligen Dienst auszusondern
  rationale: „Weihen“ bezeichnet hier Aarons rituelle Aussonderung und Bestimmung zum Priesterdienst, ohne dem Ausdruck eine über den Kontext hinausgehende konfessionelle Deutung aufzuerlegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt nah an der hebräischen Handlungsfolge und ist zugleich für heutige Leser unmittelbar verständlich.
