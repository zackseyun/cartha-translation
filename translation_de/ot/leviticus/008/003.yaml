translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Der Imperativ richtet sich an eine einzelne Person, Mose. Die lexikalische Spannweite von עֵדָה wird in der Fußnote bewahrt.
