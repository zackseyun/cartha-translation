  text: וְ/אֵ֥ת כָּל הָ/עֵדָ֖ה הַקְהֵ֑ל אֶל פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/003.yaml
  text: And assemble all the congregation at the entrance of the tent of meeting[a].
translation:
  language: de
  text: Und versammle die ganze Gemeinde am Eingang des Zeltes der Begegnung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die ganze Versammlung“. Das hebräische Wort עֵדָה kann je nach Zusammenhang „Gemeinde“, „Versammlung“ oder „Gemeinschaft“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵת
  choice: Und
  rationale: וְ führt den nächsten Befehl in der Abfolge weiter; אֵת ist der bestimmte Akkusativmarker und bleibt im Deutschen unübersetzt.
- source_word: כָּל הָעֵדָה
  choice: die ganze Gemeinde
  rationale: כָּל bezeichnet hier die Gesamtheit, und עֵדָה meint die versammelte Gemeinschaft Israels. „Die ganze Gemeinde“ ist im Deutschen natürlich und bewahrt den gemeinschaftlichen sowie kultischen Bezug.
- source_word: הַקְהֵל
  choice: versammle
  rationale: Der Hifil-Imperativ von קהל fordert Mose auf, die Gemeinde zusammenzubringen. „Versammle“ gibt Form und Sinn knapp und würdig wieder.
- source_word: אֶל פֶּתַח
  choice: am Eingang
  rationale: Obwohl אֶל häufig „zu“ bedeutet, bezeichnet die Verbindung hier idiomatisch den Ort, an dem die Gemeinde zusammenkommen soll; „am Eingang“ ist natürliches Deutsch.
- source_word: אֹהֶל מוֹעֵד
  choice: Zelt der Begegnung
  rationale: Die Wendung bezeichnet das Heiligtumszelt als Ort der festgesetzten Begegnung. „Zelt der Begegnung“ ist verständlich und bildet den Bedeutungsgehalt der hebräischen Verbindung ab.
