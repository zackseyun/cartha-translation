base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/017.yaml
  text: But the bull[a], along with its hide, its flesh, and its dung, he burned with fire outside the camp[b], just as Yahweh had commanded Moses.
translation:
  language: de
  text: Den Stier aber verbrannte er samt seiner Haut[a], seinem Fleisch und seinem Kot[b] im Feuer außerhalb des Lagers, genau wie Jahwe es Mose geboten hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seinem Fell“.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet konkret Kot, nicht bloß allgemeinen Abfall.
    reason: lexical_clarification
lexical_decisions:
- source_word: הַפָּר
  choice: den Stier
  rationale: פַּר bezeichnet einen Stier beziehungsweise jungen Stier. „Stier“ gibt den schlichten Wortsinn wieder, ohne die aus dem Kontext erschließbare Funktion als Sündopfer in den Vers hineinzutragen.
- source_word: עֹרוֹ
  choice: sein Fell
  rationale: עוֹר kann „Haut“ oder „Fell“ bedeuten. Bei einem Opfertier bezeichnet „Fell“ natürlich und präzise die äußere Tierhaut.
- source_word: בְּשָׂרוֹ
  choice: sein Fleisch
  rationale: בָּשָׂר bedeutet hier das Fleisch des Tieres; „Fleisch“ bewahrt den konkreten und kultischen Sprachgebrauch.
- source_word: פִּרְשׁוֹ
  choice: sein Kot
  rationale: פֶּרֶשׁ bezeichnet konkret den Darminhalt beziehungsweise Kot, nicht allgemein Abfall oder Eingeweide.
- source_word: שָׂרַף בָּאֵשׁ
  choice: verbrannte er … im Feuer
  rationale: Die Wiedergabe erhält sowohl das Verb שׂרף („verbrennen“) als auch die ausdrückliche Feuerangabe בָּאֵשׁ, ohne einen technischen Ausdruck wie „einäschern“ zu verwenden.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: außerhalb des Lagers
  rationale: Dies ist die übliche, klare deutsche Wiedergabe der räumlichen Angabe.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: genau wie … geboten hatte
  rationale: כַּאֲשֶׁר drückt die genaue Übereinstimmung mit dem zuvor erteilten Gebot aus. Das Plusquamperfekt macht im Deutschen dessen Vorzeitigkeit deutlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: וְאֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: Den Stier aber … samt seinem Fell, seinem Fleisch und seinem Kot
  rationale: „Samt“ und die Aufzählung geben die kumulative Folge der hebräischen Objektmarkierungen und Konjunktionen in natürlichem Deutsch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht der Eigenname יְהוָה. „Jahwe“ bewahrt diesen als persönlichen Namen, statt ihn durch einen Hoheitstitel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlicher kultischer Terminologie. Die vorangestellte Form „Den Stier aber“ bewahrt den kontrastierenden Anschluss des hebräischen וְ, während „samt“ die Aufzählung flüssig wiedergibt. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Wörtern.
