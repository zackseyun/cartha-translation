id: LEV.8.5
reference: Leviticus 8:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה אֶל הָ/עֵדָ֑ה זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לַ/עֲשֽׂוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/005.yaml
  text: And Moses said to the congregation[a], “This is the thing that Yahweh has commanded to be done.”
translation:
  language: de
  text: 'Und Mose sagte zu der versammelten Gemeinde: »Das ist es, was Jahwe zu tun geboten hat.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Das ist es, was auf Jahwes Befehl hin getan werden soll.« Der hebräische Infinitiv lautet formal »zu tun«, kann hier aber unpersönlich verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und … sagte
  rationale: Die Form führt die Erzählung fort; »Und … sagte« wahrt den hebräischen Anschluss und klingt in gehobener deutscher Erzählsprache natürlich.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Die im Deutschen geläufige Form des Personennamens.
- source_word: הָעֵדָה
  choice: die versammelte Gemeinde
  rationale: עֵדָה bezeichnet hier die zusammengekommene Gemeinschaft Israels. »Versammelte Gemeinde« macht sowohl den gemeinschaftlichen als auch den konkreten Versammlungscharakter deutlich.
- source_word: זֶה הַדָּבָר
  choice: Das ist es
  rationale: Die idiomatische deutsche Wendung gibt die demonstrative Aussage wieder, ohne mit dem allzu wörtlichen »Dies ist die Sache« unnötig schwerfällig zu klingen.
- source_word: צִוָּה
  choice: geboten hat
  rationale: Das Perfekt bezeichnet einen bereits ergangenen, weiterhin maßgeblichen Befehl. Das deutsche Perfekt passt zum unmittelbaren Redezusammenhang; »gebieten« bewahrt den verbindlichen Charakter.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. »Jahwe« ist die geläufige deutsche wissenschaftliche Umschrift.
- source_word: לַעֲשׂוֹת
  choice: zu tun
  rationale: Der hebräische Infinitiv ist formal aktiv. »Zu tun« erhält diese Form und bleibt im Deutschen natürlich, während der Zusammenhang offenlässt, wer die angeordnete Handlung ausführt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht der Eigenname יהוה. Seine Wiedergabe als »Jahwe« bewahrt den persönlichen Gottesnamen, statt ihn durch den traditionellen Titel »der HERR« zu ersetzen.
- issue: Handelnder bei לַעֲשׂוֹת
  choice: aktive Infinitivform »zu tun«
  alternative: 'unpersönlich-passiv: »getan werden soll«'
  rationale: Der hebräische Infinitiv ist formal aktiv, nennt den Handelnden aber nicht ausdrücklich. Die Hauptübersetzung bewahrt diese Spannung; die Fußnote nennt die im Kontext mögliche unpersönlich-passive Auffassung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Versammelte Gemeinde« ist im kultischen Zusammenhang verständlich, ohne einen späteren kirchlichen Gemeindebegriff vorauszusetzen. Die Satzstellung bleibt nahe am Hebräischen, ist aber idiomatisch deutsch.
