source:
  edition: WLC
  text: וַ/יַּקְרֵ֨ב מֹשֶׁ֜ה אֶת בְּנֵ֣י אַהֲרֹ֗ן וַ/יַּלְבִּשֵׁ֤/ם כֻּתֳּנֹת֙ וַ/יַּחְגֹּ֤ר אֹתָ/ם֙ אַבְנֵ֔ט וַ/יַּחֲבֹ֥שׁ לָ/הֶ֖ם מִגְבָּע֑וֹת כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/013.yaml
  text: Then Moses brought Aaron’s sons near[a], and clothed them with tunics, and girded them with sashes, and bound caps on them[c][b], just as Yahweh had commanded Moses.
translation:
  language: de
  text: Dann führte Mose die Söhne Aarons heran[a], bekleidete sie mit Tuniken, legte ihnen Schärpen um[b] und setzte ihnen Kopfbedeckungen auf. So geschah es, wie Jahwe es Mose geboten hatte[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „stellte die Söhne Aarons vor“. Das hebräische Verb kann in einem rituellen Zusammenhang das Heranbringen oder Präsentieren bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Das hebräische Substantiv steht im Singular; bei mehreren Trägern ist es wohl distributiv zu verstehen: Jeder von ihnen erhielt seine priesterliche Schärpe.'
    reason: lexical_alternative
  - marker: c
    text: Der hebräische Gottesname lautet JHWH; traditionell wird er mit „der HERR“ wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: ließ … herantreten
  rationale: Der Hifil von קרב bezeichnet hier das Heranbringen beziehungsweise rituelle Herantretenlassen. Die Formulierung wahrt den kultischen Sinn, ohne eine technische Präsentationshandlung festzulegen.
- source_word: בְּנֵי אַהֲרֹן
  choice: die Söhne Aarons
  rationale: Die deutsche Genitivkonstruktion gibt die hebräische Status-constructus-Verbindung natürlich und genau wieder.
- source_word: וַיַּלְבִּשֵׁם כֻּתֳּנֹת
  choice: bekleidete sie mit Untergewändern
  rationale: Der Hifil von לבשׁ bedeutet, jemanden zu bekleiden. כֻּתֹּנֶת bezeichnet ein langes, hemdartiges Grundgewand; „Untergewand“ ist im priesterlichen Kleidungskontext verständlich und vermeidet die modern-antikisierende Färbung von „Tunika“.
- source_word: וַיַּחְגֹּר אֹתָם אַבְנֵט
  choice: legte ihnen Schärpen um
  rationale: חגר bezeichnet das Umgürten, אַבְנֵט eine textile priesterliche Schärpe. Der hebräische Singular ist bei der Mehrzahl der Träger distributiv zu verstehen.
- source_word: וַיַּחֲבֹשׁ לָהֶם מִגְבָּעוֹת
  choice: setzte ihnen Kopfbedeckungen auf
  rationale: חבשׁ kann das Befestigen oder Umbinden einer Kopfbedeckung bezeichnen. מִגְבָּעוֹת sind die Kopfbedeckungen der gewöhnlichen Priester und werden bewusst neutral wiedergegeben, da ihre genaue Form unsicher ist.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: So hatte Jahwe es Mose geboten
  rationale: Die wiederkehrende Erfüllungsformel hebt Moses genaue Befolgung des göttlichen Gebots hervor. Das deutsche Plusquamperfekt fügt sich natürlich in die Erzählfolge.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, statt ihn durch den Titel „der HERR“ zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen unmittelbar. „Jahwe“ bewahrt den Charakter als Eigenname; die traditionelle deutsche Ersatzlesung wird in einer Fußnote genannt.
- issue: Ritueller Sinn von וַיַּקְרֵב
  choice: ließ … herantreten
  alternative: führte … heran / stellte … vor
  rationale: Die Formulierung erhält die mögliche kultische Bedeutung, ohne zu entscheiden, ob der Vorgang als formelle Präsentation zu verstehen ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Kultische Fachsprache wird nur dort verwendet, wo sie verständlich bleibt. „Kopfbedeckungen“ bewahrt die Unsicherheit über die genaue Form, und die Fußnoten kennzeichnen echte lexikalische beziehungsweise traditionelle Alternativen.
