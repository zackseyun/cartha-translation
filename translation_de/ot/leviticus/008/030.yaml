  verdict: revise
  source_fidelity: Die Personen- und Gegenstandsliste, die wiederholte Nennung der Gewänder sowie die kultische Bedeutung von קדשׁ sind grundsätzlich quellentreu wiedergegeben. Die zweimalige Präposition מִן sollte jedoch im Deutschen bei beiden Stoffen ausdrücklich als Teilmenge erkennbar sein. Für das im Hebräischen unausgedrückte Objekt von וַיַּז ist „davon“ idiomatischer und eindeutiger als das singuläre „es“ nach zwei genannten Stoffen.
  naturalness: „Etwas von dem Salböl und etwas von dem Blut“ ist klar und modernes Standarddeutsch. „Sprengte davon auf“ ist in diesem rituellen Kontext natürlicher als „sprengte es auf“ und vermeidet ein missverständliches singuläres Pronomen. Der Relativsatz zu den Söhnen bleibt verständlich; „bei ihm“ gibt die knappe, im Hebräischen nicht näher aufgelöste Bezugnahme von אִתּוֹ wieder.
  terminology: „Salböl“, „Altar“, „Gewänder“, „Söhne“ und „heiligte“ sind angemessen. „Heiligte“ wahrt die weite kultische Semantik von קדשׁ; die Fußnote bietet „weihte“ als kontextuelle Alternative an, ohne den Haupttext einzuengen.
  issues:
