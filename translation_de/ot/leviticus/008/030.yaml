- from: Dann nahm Mose etwas von dem Salböl und von dem Blut, das auf dem Altar war, und sprengte es auf Aaron, auf seine Gewänder, auf seine Söhne und auf die Gewänder seiner Söhne, die bei ihm waren. So heiligte[a] er Aaron, seine Gewänder, seine Söhne und die Gewänder seiner Söhne, die bei ihm waren.
  to: Dann nahm Mose etwas von dem Salböl und etwas von dem Blut, das auf dem Altar war, und sprengte davon auf Aaron, auf seine Gewänder, auf seine Söhne und auf die Gewänder seiner Söhne, die bei ihm waren. So heiligte[a] er Aaron, seine Gewänder, seine Söhne und die Gewänder seiner Söhne, die bei ihm waren.
  rationale: Die Revision macht die zweimalige Teilmengenangabe des Hebräischen ausdrücklich und ersetzt das missverständliche singuläre „es“ durch das idiomatische „davon“. Die vollständige Objektliste, der unaufgelöste knappe Bezug von „bei ihm“ und die kultische Terminologie bleiben erhalten.
