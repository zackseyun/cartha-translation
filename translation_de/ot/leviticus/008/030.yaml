  text: וַ/יִּקַּ֨ח מֹשֶׁ֜ה מִ/שֶּׁ֣מֶן הַ/מִּשְׁחָ֗ה וּ/מִן הַ/דָּם֮ אֲשֶׁ֣ר עַל הַ/מִּזְבֵּחַ֒ וַ/יַּ֤ז עַֽל אַהֲרֹן֙ עַל בְּגָדָ֔י/ו וְ/עַל בָּנָ֛י/ו וְ/עַל בִּגְדֵ֥י בָנָ֖י/ו אִתּ֑/וֹ וַ/יְקַדֵּ֤שׁ אֶֽת אַהֲרֹן֙ אֶת בְּגָדָ֔י/ו וְ/אֶת בָּנָ֛י/ו וְ/אֶת בִּגְדֵ֥י בָנָ֖י/ו אִתּֽ/וֹ־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/030.yaml
  text: Then Moses took some of the anointing oil and some of the blood that was on the altar[a], and sprinkled it on Aaron, on his garments, on his sons, and on the garments of his sons with him; so he consecrated Aaron, his garments, his sons, and the garments of his sons with him.
translation:
  language: de
  text: Dann nahm Mose etwas von dem Salböl und etwas von dem Blut, das auf dem Altar war, und sprengte davon auf Aaron, auf seine Gewänder, auf seine Söhne und auf die Gewänder seiner Söhne, die bei ihm waren. So heiligte[a] er Aaron, seine Gewänder, seine Söhne und die Gewänder seiner Söhne, die bei ihm waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „weihte“; das hebräische Wort bedeutet hier, für den heiligen Dienst auszusondern.'
    reason: Das Verb קדשׁ hat eine breitere Grundbedeutung als das im Kontext mögliche deutsche „weihen“. Die Anmerkung erläutert die kultische Bedeutung, ohne sie im Haupttext einzuengen.
lexical_decisions:
- source_word: וַיִּקַּח ... מִשֶּׁמֶן ... וּמִן הַדָּם
  choice: nahm ... etwas von dem Salböl und von dem Blut
  rationale: לקח bedeutet „nehmen“; die zweimalige Präposition מִן bezeichnet hier eine Teilmenge. Die deutsche Formulierung macht deutlich, dass Mose jeweils einen Teil nahm.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: Salböl
  rationale: Die etablierte deutsche Zusammensetzung gibt das für die Salbung bestimmte Öl knapp und kultisch angemessen wieder.
- source_word: הַדָּם אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: das Blut, das auf dem Altar war
  rationale: Die Relativkonstruktion und die Ortsangabe werden unmittelbar und ohne zusätzliche Deutung wiedergegeben.
- source_word: וַיַּז
  choice: sprengte es
  rationale: Das Hifil von נזה bezeichnet im priesterlichen Ritual das Versprengen einer Flüssigkeit. Das Pronomen „es“ nimmt zusammenfassend das zuvor genannte Öl und Blut auf.
- source_word: בְּגָדָיו
  choice: seine Gewänder
  rationale: „Gewänder“ bewahrt den feierlichen kultischen Kontext, ohne durch „Priestergewänder“ mehr zu spezifizieren, als der Ausdruck selbst sagt.
- source_word: בָּנָיו
  choice: seine Söhne
  rationale: Der hebräische maskuline Plural bezeichnet hier ausdrücklich Aarons Söhne, die am Einsetzungsritual teilnehmen.
- source_word: בִּגְדֵי בָנָיו אִתּוֹ
  choice: die Gewänder seiner Söhne, die bei ihm waren
  rationale: אִתּוֹ bezieht sich dem Sinn nach auf die Söhne, nicht auf ihre Gewänder. Der Relativsatz beseitigt im Deutschen eine unbeabsichtigte syntaktische Unklarheit.
- source_word: וַיְקַדֵּשׁ
  choice: So heiligte er
  rationale: קדשׁ bedeutet, jemanden oder etwas dem heiligen Bereich zuzuordnen beziehungsweise heilig zu machen. „Heiligte“ bewahrt die breite kultisch-theologische Bedeutung besser als das stärker amtlich eingeengte „weihte“.
theological_decisions:
- issue: Wiedergabe von קדשׁ im Zusammenhang der Priestereinsetzung
  choice: heiligte
  alternative: weihte; sonderte als heilig aus
  rationale: „Heiligte“ hält sowohl die kultische Aussonderung als auch den Bezug zur Heiligkeit fest, ohne den Vorgang ausschließlich als Amtsweihe zu deuten. Die Fußnote erläutert den gemeinten Handlungssinn.
- issue: Bezug der Heiligung auf Personen und Gewänder
  choice: Die vollständige Objektliste wird wiederholt
  alternative: verkürzte Wiedergabe mit zusammenfassendem Pronomen
  rationale: Der hebräische Text nennt Aaron, seine Gewänder, seine Söhne und deren Gewänder ausdrücklich als Gegenstände der Heiligung. Die Wiederholung erhält diesen Nachdruck und die theologische Spannung, dass auch Gegenstände geheiligt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Aufzählungen und ihre Wiederholung folgen dem hebräischen Nachdruck. „Sprengte“ ist als geläufiger kultischer Fachausdruck gewählt; „Gewänder“ vermeidet sowohl das alltägliche „Kleider“ als auch die interpretierende Spezifizierung „Priestergewänder“.
