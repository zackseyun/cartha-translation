    issue: Die Teilmenge beim Blut ist im Haupttext nicht ausdrücklich markiert.
    rationale: Das Hebräische wiederholt מִן vor „Blut“. Die bisherige Ellipse ist möglich, aber „etwas von dem Blut“ bildet die syntaktische Wiederholung genauer ab.
  - severity: low
    issue: „sprengte es“ hat nach der Nennung von Öl und Blut ein unnatürliches singuläres Bezugswort.
    rationale: Das hebräische Verb hat kein ausgedrücktes Objekt. „Sprengte davon“ nimmt idiomatisch auf die zuvor genannten Stoffe Bezug, ohne eine bestimmte Mischung oder ein singuläres Referenzobjekt zu behaupten.
