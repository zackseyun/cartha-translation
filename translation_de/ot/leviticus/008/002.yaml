id: LEV.8.2
reference: Leviticus 8:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: קַ֤ח אֶֽת אַהֲרֹן֙ וְ/אֶת בָּנָ֣י/ו אִתּ֔/וֹ וְ/אֵת֙ הַ/בְּגָדִ֔ים וְ/אֵ֖ת שֶׁ֣מֶן הַ/מִּשְׁחָ֑ה וְ/אֵ֣ת פַּ֣ר הַֽ/חַטָּ֗את וְ/אֵת֙ שְׁנֵ֣י הָֽ/אֵילִ֔ים וְ/אֵ֖ת סַ֥ל הַ/מַּצּֽוֹת־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/002.yaml
  text: Take Aaron and his sons with him[a], and the garments, and the anointing oil, and the bull of the sin offering, and the two rams, and the basket of unleavened bread.
translation:
  language: de
  text: Nimm Aaron und seine Söhne mit ihm, dazu die Gewänder, das Salböl, den Stier für das Sündopfer[a], die beiden Widder und den Korb mit den ungesäuerten Broten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Stier für das Reinigungsopfer“. Das hebräische Wort kann das Opfer bezeichnen, das mit Sünde und ritueller Reinigung verbunden ist.'
    reason: alternative_reading
lexical_decisions:
- source_word: קַח
  choice: Nimm
  rationale: Der Imperativ 2. Person Maskulin Singular von לקח wird direkt wiedergegeben. „Nimm“ bewahrt die Befehlsform, ohne eine im Verb nicht ausdrücklich bezeichnete Bewegung hinzuzufügen.
- source_word: אַהֲרֹן
  choice: Aaron
  rationale: Der Personenname wird nach der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: בָּנָיו אִתּוֹ
  choice: seine Söhne mit ihm
  rationale: Die Formulierung erhält sowohl „seine Söhne“ als auch das ausdrücklich gesetzte אִתּוֹ („mit ihm“); das Pronomen bezieht sich am natürlichsten auf Aaron.
- source_word: הַבְּגָדִים
  choice: die Gewänder
  rationale: „Gewänder“ gibt בְּגָדִים in diesem priesterlichen Zusammenhang würdig und verständlich wieder, ohne einen engeren Fachbegriff einzutragen.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: das Salböl
  rationale: Die deutsche Zusammensetzung ist die natürliche und präzise Wiedergabe von „Öl der Salbung“.
- source_word: פַּר הַחַטָּאת
  choice: den Stier für das Sündopfer
  rationale: פַּר bezeichnet einen Stier; חַטָּאת bezeichnet hier das Opfer. „Für das Sündopfer“ macht deutlich, dass der Stier als Opfertier bestimmt ist, und wahrt die traditionelle Benennung.
- source_word: שְׁנֵי הָאֵילִים
  choice: die beiden Widder
  rationale: Direkte Wiedergabe der bestimmten Zahlwort-Nomen-Verbindung; „beiden“ klingt im Deutschen in der Aufzählung natürlich.
- source_word: סַל הַמַּצּוֹת
  choice: den Korb mit den ungesäuerten Broten
  rationale: מַצּוֹת bezeichnet ungesäuerte Backwaren beziehungsweise Brote. „Korb mit“ ist im modernen Deutsch natürlicher als „Korb der“, ohne den Inhalt näher festzulegen als der hebräische Text.
theological_decisions:
- issue: Wiedergabe von חַטָּאת im Opferkontext
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: Der Begriff kann das mit Sünde verbundene Opfer bezeichnen und zugleich dessen reinigende Funktion hervorheben. Im Haupttext steht die geläufige Wiedergabe „Sündopfer“; die sachlich begründete Alternative „Reinigungsopfer“ wird in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die polysyndetische hebräische Aufzählung wird durch „dazu“ und Kommas natürlich gegliedert; sämtliche Gegenstände bleiben in derselben Befehlsstruktur. Das im Hebräischen ausdrücklich vorhandene „mit ihm“ wird trotz leichter deutscher Redundanz bewahrt.
