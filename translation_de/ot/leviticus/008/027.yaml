id: LEV.8.27
reference: Leviticus 8:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּתֵּ֣ן אֶת הַ/כֹּ֔ל עַ֚ל כַּפֵּ֣י אַהֲרֹ֔ן וְ/עַ֖ל כַּפֵּ֣י בָנָ֑י/ו וַ/יָּ֧נֶף אֹתָ֛/ם תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/027.yaml
  text: He put all of it into the palms of Aaron and into the palms of his sons[a], and he waved them as a wave offering before Yahweh.
translation:
  language: de
  text: Er legte alles in die Handflächen Aarons und in die Handflächen seiner Söhne[a] und schwang es als Schwingopfer vor Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf die Handflächen Aarons und auf die Handflächen seiner Söhne“. Die hebräische Präposition bedeutet wörtlich „auf“; gemeint ist hier das Legen der Opferteile in die geöffneten Hände.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Er legte
  rationale: נתן kann „geben“, „legen“ oder „setzen“ bedeuten; im Zusammenhang der körperlichen Platzierung der Opferstücke ist „legte“ präzise und natürlich.
- source_word: אֶת הַכֹּל
  choice: alles
  rationale: Die Wendung verweist umfassend auf die im vorigen Vers genannten Opferteile.
- source_word: עַל כַּפֵּי
  choice: in die Handflächen
  rationale: עַל bedeutet wörtlich „auf“, doch bei den offenbar geöffneten beziehungsweise hohl gehaltenen Händen gibt „in die Handflächen“ den gemeinten Vorgang im Deutschen natürlich wieder; die wörtlichere Möglichkeit wird in der Fußnote bewahrt.
- source_word: וְעַל כַּפֵּי בָנָיו
  choice: und in die Handflächen seiner Söhne
  rationale: Die Wiederholung der hebräischen Satzstruktur sowie die geschlechtsspezifische Bezeichnung בָּנָיו werden erhalten.
- source_word: וַיָּנֶף
  choice: und schwang
  rationale: Der Hifil von נוף bezeichnet im Opferkult das rituelle Schwingen beziehungsweise Darbringen durch Schwingen.
- source_word: אֹתָם
  choice: es
  rationale: Das Pronomen bezieht sich sinngemäß auf alles beziehungsweise das gesamte zuvor in die Hände Gelegte, nicht auf Aaron und seine Söhne.
- source_word: תְּנוּפָה
  choice: als Schwingopfer
  rationale: „Schwingopfer“ ist eine verständliche und etablierte deutsche Bezeichnung für die kultische תְּנוּפָה und bewahrt die Verbindung zum Verb „schwang“.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: Die feste Wendung bezeichnet eine Handlung in Jahwes Gegenwart; der Gottesname wird entsprechend dem Projektstandard als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: „Jahwe“ gibt den Eigennamen transparent wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Geschlechtsspezifisches בָנָיו
  choice: seiner Söhne
  alternative: seiner Kinder
  rationale: Im Kontext der Priesterweihe sind ausdrücklich Aarons männliche Nachkommen gemeint; „Kinder“ würde die Spezifik des Ausgangstextes abschwächen.
- issue: Bezug von אֹתָם
  choice: auf die Opferteile als Gesamtheit („es“)
  alternative: auf Aaron und seine Söhne („sie“)
  rationale: Satzbau und Ritualablauf zeigen, dass Mose die aufgelegten Opferteile schwingt; die Personen sind nicht das Objekt des Schwingens.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Handflächen“ verdeutlicht die konkrete rituelle Handlung; „Schwingopfer“ bewahrt den kultischen Fachbegriff und den Wortklang des hebräischen Verb-Substantiv-Paares.
