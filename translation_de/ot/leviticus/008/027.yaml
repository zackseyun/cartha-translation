  source_fidelity: Der Text gibt וַיִּתֵּן ... עַל כַּפֵּי ... präzise als körperliches Auflegen in die offenen Handflächen wieder. „Alles“ erfasst אֶת־הַכֹּל; „seiner Söhne“ bewahrt die spezifisch männliche Bezeichnung בָנָיו. Das singuläre „es“ hat eindeutig die zuvor aufgelegten Opferteile als Bezugsgröße und nicht Aaron und seine Söhne. „Schwang es als Schwingopfer vor Jahwe“ trifft וַיָּנֶף אֹתָם תְּנוּפָה לִפְנֵי יְהוָה einschließlich des kultischen Verb-Substantiv-Paares.
  naturalness: Modernes, verständliches und würdiges Standarddeutsch. Die Wiederholung von „in die Handflächen“ ist zwar etwas formell, bildet aber die betonte Wiederholung des Hebräischen angemessen ab und verdeutlicht die rituelle Handlung. „Schwingopfer“ ist im biblisch-kultischen Register etabliert.
  terminology: „Jahwe“ folgt dem angegebenen Projektstandard für יהוה. „Schwingopfer“ ist der sachgerechte deutsche Fachausdruck für תְּנוּפָה. Die Fußnote markiert die wörtlichere räumliche Alternative „auf die Handflächen“ korrekt, ohne die idiomatische Hauptübersetzung zu beeinträchtigen.
