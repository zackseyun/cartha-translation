  text: וּ/מִ/סַּ֨ל הַ/מַּצּ֜וֹת אֲשֶׁ֣ר לִ/פְנֵ֣י יְהוָ֗ה לָ֠קַח חַלַּ֨ת מַצָּ֤ה אַחַת֙ וְֽ/חַלַּ֨ת לֶ֥חֶם שֶׁ֛מֶן אַחַ֖ת וְ/רָקִ֣יק אֶחָ֑ד וַ/יָּ֨שֶׂם֙ עַל הַ֣/חֲלָבִ֔ים וְ/עַ֖ל שׁ֥וֹק הַ/יָּמִֽין׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/026.yaml
  text: And from the basket of unleavened bread that was before Yahweh[a], he took one unleavened cake, one cake of bread with oil, and one wafer, and put them on the fat portions and on the right thigh.
translation:
  language: de
  text: Und aus dem Korb mit den ungesäuerten Broten, der vor Jahwe stand, nahm er einen ungesäuerten Brotlaib, einen mit Öl zubereiteten Brotlaib[a] und einen dünnen Fladen. Er legte sie auf die Fettstücke und auf die rechte Keule.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen mit Öl vermischten Brotlaib“. Das Hebräische verbindet das Brot mit Öl, nennt aber die genaue Art der Zubereitung nicht ausdrücklich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִסַּל הַמַּצּוֹת
  choice: Und aus dem Korb mit den ungesäuerten Broten
  rationale: מִן bezeichnet die Herkunft; מַצּוֹת meint hier die verschiedenen ungesäuerten Brote im Korb. Die Formulierung ist konkret und im Deutschen natürlich.
- source_word: אֲשֶׁר לִפְנֵי יְהוָה
  choice: der vor Jahwe stand
  rationale: Die Ergänzung „stand“ macht den Bezug des Relativsatzes auf den Korb im Deutschen eindeutig, ohne den Sinn der kultischen Wendung „vor Jahwe“ zu verändern.
- source_word: חַלַּת מַצָּה אַחַת
  choice: einen ungesäuerten Brotlaib
  rationale: חַלָּה bezeichnet ein einzelnes Brot beziehungsweise einen Brotlaib; מַצָּה bestimmt ihn als ungesäuert.
- source_word: חַלַּת לֶחֶם שֶׁמֶן אַחַת
  choice: einen mit Öl zubereiteten Brotlaib
  rationale: Die hebräische Wortverbindung bringt das Brot mit Öl in Verbindung, legt aber die genaue Zubereitungsweise nicht ausdrücklich fest. „Mit Öl zubereitet“ bewahrt diese Offenheit.
- source_word: וְרָקִיק אֶחָד
  choice: und einen dünnen Fladen
  rationale: רָקִיק bezeichnet ein dünnes, flaches Gebäck; „dünner Fladen“ ist verständlicher und sachlich genauer als das im heutigen Deutsch missverständliche „Waffel“.
- source_word: וַיָּשֶׂם
  choice: Er legte sie
  rationale: Das pluralische Pronomen bezieht sich natürlich auf die drei zuvor genannten Brotstücke. Ein neuer Satz verbessert die Lesbarkeit, ohne den Zusammenhang zu verändern.
- source_word: הַחֲלָבִים
  choice: die Fettstücke
  rationale: Der Plural bezeichnet im Opferkontext die dafür bestimmten fetten Teile des Tieres, nicht Fett im allgemeinen Sinn.
- source_word: שׁוֹק הַיָּמִין
  choice: die rechte Keule
  rationale: שׁוֹק bezeichnet hier den als Opferstück abgetrennten oberen beziehungsweise kräftigen Teil des Beins; „Keule“ ist im Deutschen die passende Schlacht- und Opfersprache.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Konkrete kultische Begriffe bleiben erhalten; ungebräuchliche oder potenziell missverständliche Wörter werden durch verständliche Sachbezeichnungen wiedergegeben. Der Fußnotenmarker steht unmittelbar bei der tatsächlich erläuterten Ölformulierung.
