  yaml_path: translation/ot/leviticus/008/032.yaml
  text: And what remains of the meat and of the bread you shall burn with fire[a].
translation:
  language: de
  text: Was aber vom Fleisch und vom Brot übrig bleibt, sollt ihr im Feuer verbrennen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַנּוֹתָר
  choice: Was aber … übrig bleibt
  rationale: Das substantivisch gebrauchte Niphal-Partizip bezeichnet das, was übrig bleibt. Die deutsche Formulierung ist natürlich und gibt die fortführende Konjunktion וְ angemessen mit „aber“ wieder.
- source_word: בַּבָּשָׂר
  choice: von dem Fleisch
  rationale: בָּשָׂר bezeichnet wörtlich „Fleisch“ und meint hier das Fleisch des Opfertiers. Im Deutschen ist „Fleisch“ zugleich wörtlich und in diesem Speisekontext idiomatisch.
- source_word: וּבַלָּחֶם
  choice: und dem Brot
  rationale: לֶחֶם ist die gewöhnliche Bezeichnung für Brot; die Präposition wird parallel zu „von dem Fleisch“ verstanden.
- source_word: בָּאֵשׁ
  choice: im Feuer
  rationale: Die Präposition ב bezeichnet hier den Bereich beziehungsweise das Mittel des Verbrennens. „Im Feuer“ ist eine direkte und natürliche deutsche Wiedergabe.
- source_word: תִּשְׂרֹפוּ
  choice: sollt ihr … verbrennen
  rationale: Das Imperfekt der zweiten Person Maskulin Plural hat in diesem gesetzlichen Zusammenhang anweisende Kraft. „Sollt ihr“ wahrt den verbindlichen, würdigen Ton.
