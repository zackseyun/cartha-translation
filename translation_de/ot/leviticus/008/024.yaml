source:
  edition: WLC
  text: וַ/יַּקְרֵ֞ב אֶת בְּנֵ֣י אַהֲרֹ֗ן וַ/יִּתֵּ֨ן מֹשֶׁ֤ה מִן הַ/דָּם֙ עַל תְּנ֤וּךְ אָזְנָ/ם֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֤הֶן יָדָ/ם֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְלָ֖/ם הַ/יְמָנִ֑ית וַ/יִּזְרֹ֨ק מֹשֶׁ֧ה אֶת הַ/דָּ֛ם עַל הַֽ/מִּזְבֵּ֖חַ סָבִֽיב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/024.yaml
  text: Then he brought Aaron’s sons near, and Moses put some of the blood on the lobe of their right ear, on the thumb of their right hand, and on the big toe of their right foot. Then Moses threw the blood against the altar all around.
translation:
  language: de
  text: Dann ließ er die Söhne Aarons herantreten. Mose strich etwas von dem Blut an das Läppchen ihres rechten Ohres, an den Daumen ihrer rechten Hand und an die große Zehe ihres rechten Fußes. Danach sprengte Mose das Blut ringsum an den Altar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: ließ … herantreten
  rationale: Das Hifil von קרב bezeichnet hier das Heranbringen beziehungsweise Herantretenlassen der Söhne Aarons; die deutsche Formulierung gibt die Veranlassung natürlich wieder.
- source_word: וַיִּתֵּן … מִן־הַדָּם עַל
  choice: strich etwas von dem Blut an
  rationale: Wörtlich steht ‚gab/setzte von dem Blut auf‘. Im beschriebenen Ritual ist ‚strich … an‘ eine klare, konkrete deutsche Wiedergabe, ohne die Blutmenge über ‚etwas von‘ hinaus festzulegen.
- source_word: תְּנוּךְ
  choice: Läppchen
  rationale: Das seltene anatomische Wort bezeichnet einen Teil beziehungsweise Vorsprung des Ohres und wird traditionell als Ohrläppchen verstanden; ‚Läppchen ihres rechten Ohres‘ bewahrt diese übliche Deutung bei natürlichem Deutsch.
- source_word: בֹּהֶן יָד
  choice: Daumen
  rationale: בֹּהֶן bezeichnet an der Hand den Daumen.
- source_word: בֹּהֶן רֶגֶל
  choice: große Zehe
  rationale: Dasselbe Wort bezeichnet am Fuß die große Zehe.
- source_word: וַיִּזְרֹק
  choice: sprengte
  rationale: זרק bezeichnet im priesterlichen Ritual das gezielte Werfen beziehungsweise Sprengen von Blut an den Altar; ‚sprengte‘ ist im Deutschen präziser und idiomatischer als das mechanisch klingende ‚warf‘.
- source_word: עַל־הַמִּזְבֵּחַ סָבִיב
  choice: ringsum an den Altar
  rationale: Die Formulierung drückt aus, dass das Blut rings um den Altar an dessen Seiten gebracht wurde.
theological_decisions:
- issue: Symbolische Bedeutung der Blutbestreichung an Ohr, Hand und Fuß
  choice: Keine Deutung in den Vers eingefügt
  alternative: Die Körperteile ausdrücklich mit Hören, Handeln und Lebenswandel verbinden
  rationale: Der hebräische Text beschreibt die Weihehandlung, erklärt ihre Symbolik an dieser Stelle jedoch nicht. Eine bestimmte Auslegung würde über den Wortlaut hinausgehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer ritueller Terminologie. Der Wechsel vom zunächst nicht ausdrücklich genannten Subjekt ‚er‘ zu ‚Mose‘ folgt dem hebräischen Satzbau und dem unmittelbaren Kontext.
