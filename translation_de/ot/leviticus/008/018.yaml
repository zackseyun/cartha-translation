source:
  edition: WLC
  text: וַ/יַּקְרֵ֕ב אֵ֖ת אֵ֣יל הָ/עֹלָ֑ה וַֽ/יִּסְמְכ֞וּ אַהֲרֹ֧ן וּ/בָנָ֛י/ו אֶת יְדֵי/הֶ֖ם עַל רֹ֥אשׁ הָ/אָֽיִל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/018.yaml
  text: Then he brought near the ram of the burnt offering[b][a], and Aaron and his sons laid their hands on the head of the ram.
translation:
  language: de
  text: Dann brachte er den Widder für das Brandopfer herbei[a], und Aaron und seine Söhne legten[b] ihre Hände auf den Kopf des Widders.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »brachte … heran« beziehungsweise »führte … vor«.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Verb kann wörtlich auch das Aufstützen oder Anlehnen der Hände bezeichnen; hier beschreibt es die rituelle Handauflegung auf ein Opfertier.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: Dann brachte er … herbei
  rationale: Der Hifil von קרב bezeichnet hier das Heranbringen beziehungsweise Darbringen des Opfertiers. „Brachte … herbei“ ist natürliches Deutsch und bewahrt den konkreten Vorgang; das Subjekt „er“ ist im unmittelbaren Zusammenhang Mose.
- source_word: אֵיל
  choice: Widder
  rationale: Übliche und präzise deutsche Bezeichnung für das hier genannte männliche Schaf.
- source_word: הָעֹלָה
  choice: für das Brandopfer
  rationale: עֹלָה ist der feste Opferbegriff „Brandopfer“. Die Präposition „für“ gibt im Deutschen natürlich wieder, dass dieser Widder für dieses Opfer bestimmt ist.
- source_word: וַיִּסְמְכוּ
  choice: legten
  rationale: סמך bezeichnet im Opferkontext das rituelle Auflegen beziehungsweise Aufstützen der Hände auf das Tier. „Legten ihre Hände auf“ ist verständlich und deutet die Bedeutung der Handlung nicht über den Wortlaut hinaus aus.
- source_word: יְדֵיהֶם
  choice: ihre Hände
  rationale: Der im Hebräischen ausdrücklich vorliegende Plural wird beibehalten.
- source_word: עַל רֹאשׁ הָאָיִל
  choice: auf den Kopf des Widders
  rationale: Direkte, klare und natürliche Wiedergabe der hebräischen Präpositionalverbindung.
theological_decisions:
- issue: Rituelles Handauflegen beim Opfer
  choice: legten ihre Hände auf den Kopf des Widders
  alternative: stützten ihre Hände auf den Kopf des Widders; stemmten ihre Hände gegen den Kopf des Widders
  rationale: Der Vers beschreibt die rituelle Handlung, erklärt aber nicht ausdrücklich deren theologische Bedeutung. Daher wird weder eine Schuldübertragung noch eine Identifikation in den Text hineingelesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt nah am hebräischen Ritualwortschatz, ohne eine im Vers nicht ausgesprochene Deutung der Handauflegung hinzuzufügen.
