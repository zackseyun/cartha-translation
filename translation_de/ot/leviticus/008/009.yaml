id: LEV.8.9
reference: Leviticus 8:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יָּ֥שֶׂם אֶת הַ/מִּצְנֶ֖פֶת עַל רֹאשׁ֑/וֹ וַ/יָּ֨שֶׂם עַֽל הַ/מִּצְנֶ֜פֶת אֶל מ֣וּל פָּנָ֗י/ו אֵ֣ת צִ֤יץ הַ/זָּהָב֙ נֵ֣זֶר הַ/קֹּ֔דֶשׁ כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/009.yaml
  text: And he put the turban on his head[a], and on the front of the turban he placed the gold plate, the holy crown, just as Yahweh had commanded Moses.
translation:
  language: de
  text: Er setzte ihm den Turban auf den Kopf und befestigte vorn am Turban die Goldplatte, das heilige Diadem[a], ganz wie Jahwe es Mose geboten hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die heilige Krone.'
    reason: Lexikalische Alternative für נֵזֶר הַקֹּדֶשׁ; „Krone“ ist möglich, kann im Deutschen jedoch stärker königlich verstanden werden.
lexical_decisions:
- source_word: מִצְנֶפֶת
  choice: Turban
  rationale: Bezeichnet die charakteristische Kopfbedeckung des Hohepriesters; „Turban“ ist im Deutschen klar und konkreter als das allgemeinere „Kopfbedeckung“.
- source_word: אֶל מוּל פָּנָיו
  choice: vorn am Turban
  rationale: Die Wendung bezeichnet hier die nach vorn gerichtete Stelle der Kopfbedeckung. Die Übersetzung gibt den Ort der Befestigung natürlich wieder, ohne den hebräischen Ausdruck irreführend als bloßes „vor seinem Gesicht“ zu formulieren.
- source_word: צִיץ הַזָּהָב
  choice: die Goldplatte
  rationale: צִיץ kann sonst eine Blüte oder ein Schmuckstück bezeichnen, meint im Zusammenhang der priesterlichen Kleidung jedoch das aus Gold gefertigte und am Turban befestigte Stirnstück; „Goldplatte“ ist dafür verständlich und sachlich.
- source_word: נֵזֶר הַקֹּדֶשׁ
  choice: das heilige Diadem
  rationale: Die appositionelle Wendung kennzeichnet die Goldplatte als heiliges, der Weihe zugehöriges Hoheitszeichen. „Diadem“ vermeidet die mögliche Vorstellung einer gewöhnlichen Königskrone; „heilige Krone“ bleibt als lexikalische Alternative in der Fußnote erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben statt durch einen Titel wie „der HERR“ ersetzt; „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: וַיָּשֶׂם ... וַיָּשֶׂם
  choice: setzte ... auf und befestigte
  rationale: Dasselbe hebräische Verb bezeichnet zunächst das Aufsetzen des Turbans und dann das Anbringen der Goldplatte. Die kontextgerechte Variation ergibt natürliches Deutsch und wahrt beide Handlungen.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: ganz wie Jahwe es Mose geboten hatte
  rationale: „Ganz wie“ bringt die genaue Übereinstimmung mit dem göttlichen Gebot idiomatisch zum Ausdruck; das Plusquamperfekt ordnet das frühere Gebot gegenüber der ausgeführten Handlung ein.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Übersetzung bewahrt ihn als persönlichen Namen und ersetzt ihn nicht durch einen Herrschaftstitel.
- issue: Deutung von נֵזֶר הַקֹּדֶשׁ
  choice: das heilige Diadem
  alternative: die heilige Krone
  rationale: Beide Wiedergaben sind lexikalisch möglich. Im priesterlichen Zusammenhang bezeichnet die Wendung das geweihte Zeichen am Turban, nicht notwendig eine Königskrone; die Alternative wird deshalb offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am hebräischen Ablauf, während „befestigte vorn am Turban“ die räumliche Beziehung idiomatisch und eindeutig ausdrückt.
