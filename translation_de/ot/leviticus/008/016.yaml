base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/016.yaml
  text: He took all the fat that was on the entrails[a], the lobe of the liver, the two kidneys and their fat[b], and Moses burned them on the altar.
translation:
  language: de
  text: Er nahm das ganze Fett, das auf den Eingeweiden lag, den Leberlappen[a], die beiden Nieren und ihr Fett. Mose ließ alles auf dem Altar in Rauch aufgehen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Fortsatz der Leber“. Das hebräische Wort bezeichnet vermutlich einen bestimmten Teil der Leber, der bei der Opferzurichtung entfernt wurde.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „verbrannte“. Das hebräische Verb kann im Opferzusammenhang speziell bedeuten, etwas auf dem Altar in Rauch aufgehen zu lassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Er nahm
  rationale: Das Wayyiqtol von לקח führt die Erzählung mit einer abgeschlossenen Handlung fort; im modernen Deutschen kann die einleitende Konjunktion unausgedrückt bleiben.
- source_word: כָּל הַחֵלֶב
  choice: das ganze Fett
  rationale: חֵלֶב bezeichnet hier die für das Opfer bestimmten Fettteile; die schlichte anatomische Wiedergabe passt zur folgenden Aufzählung.
- source_word: אֲשֶׁר עַל הַקֶּרֶב
  choice: das auf den Eingeweiden lag
  rationale: קֶרֶב bezeichnet in diesem Opferkontext die inneren Teile beziehungsweise Eingeweide. „lag“ macht die räumliche Beziehung im Deutschen natürlich deutlich.
- source_word: יֹתֶרֶת הַכָּבֵד
  choice: den Leberlappen
  rationale: Die Wendung bezeichnet ein bestimmtes, bei der Opferzurichtung entferntes Teil der Leber; „Leberlappen“ ist knapp und verständlich, während die genaue anatomische Zuordnung unsicher bleibt.
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: die beiden Nieren
  rationale: Direkte Wiedergabe der dualischen anatomischen Bezeichnung.
- source_word: חֶלְבְּהֶן
  choice: ihr Fett
  rationale: Das Suffix bezieht sich auf die beiden Nieren; der Singular „ihr“ entspricht im Deutschen dem zusammenfassenden Bezugswort „Fett“.
- source_word: וַיַּקְטֵר
  choice: ließ alles ... in Rauch aufgehen
  rationale: קטר bezeichnet im Opferkontext das Verbrennen auf dem Altar mit dem spezifischen Gedanken des Aufsteigens als Rauch. „alles“ nimmt die vorangehende Aufzählung natürlich auf.
- source_word: הַמִּזְבֵּחָה
  choice: auf dem Altar
  rationale: Die Richtungsendung bezeichnet hier den Ort beziehungsweise das Ziel der Opferverbrennung; „auf dem Altar“ ist die natürliche deutsche Formulierung.
theological_decisions:
- issue: Opfersprachliche Bedeutung von קטר
  choice: in Rauch aufgehen lassen
  alternative: verbrennen
  rationale: Die gewählte Formulierung bewahrt die kultische Nuance des Verbs, ohne eine zusätzliche Aussage über Annahme, Sühnung oder göttliches Wohlgefallen einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit konkreter anatomischer Sprache. Die Satzteilung verbessert die Lesbarkeit und hält Mose als ausdrücklich genanntes Subjekt der abschließenden Opferhandlung fest.
