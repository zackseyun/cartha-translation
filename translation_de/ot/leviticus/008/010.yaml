  text: וַ/יִּקַּ֤ח מֹשֶׁה֙ אֶת שֶׁ֣מֶן הַ/מִּשְׁחָ֔ה וַ/יִּמְשַׁ֥ח אֶת הַ/מִּשְׁכָּ֖ן וְ/אֶת כָּל אֲשֶׁר בּ֑/וֹ וַ/יְקַדֵּ֖שׁ אֹתָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/010.yaml
  text: Then Moses took the anointing oil and anointed the tabernacle and all that was in it[a], and consecrated them.
translation:
  language: de
  text: Dann nahm Mose das Salböl, salbte die Stiftshütte und alles, was darin war, und weihte sie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „heiligte sie“ beziehungsweise „sonderte sie als heilig aus“.'
    reason: „Weihte“ gibt die kultisch-rituelle Funktion von וַיְקַדֵּשׁ אֹתָם idiomatisch wieder; die Anmerkung dokumentiert die näher an der Grundbedeutung liegenden Alternativen.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Dann nahm Mose
  rationale: Das Wayyiqtol führt die Erzählung weiter. „Dann“ gibt die zeitliche Abfolge in natürlichem Deutsch wieder.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: das Salböl
  rationale: Die deutsche Zusammensetzung bezeichnet präzise das zur Salbung verwendete Öl und entspricht dem hebräischen Konstruktus.
- source_word: וַיִּמְשַׁח
  choice: salbte
  rationale: Der etablierte kultische Begriff bewahrt sowohl den konkreten Vollzug mit Öl als auch dessen rituelle Bedeutung.
- source_word: הַמִּשְׁכָּן
  choice: die Stiftshütte
  rationale: „Stiftshütte“ ist im Deutschen die geläufige Bezeichnung für das transportable Heiligtum in Exodus und Levitikus.
- source_word: כָּל אֲשֶׁר בּוֹ
  choice: alles, was darin war
  rationale: Die Formulierung gibt den umfassenden Bezug auf den Inhalt beziehungsweise die Ausstattung der Stiftshütte klar und quellennah wieder.
- source_word: וַיְקַדֵּשׁ אֹתָם
  choice: und heiligte sie
  rationale: „Heiligte“ gibt קדשׁ unmittelbar wieder und bewahrt die kultische Bedeutung des Absonderns als heilig. Das Pluralpronomen bezieht sich gemeinsam auf die Stiftshütte und alles darin.
theological_decisions:
- issue: Wiedergabe von קדשׁ im priesterlich-kultischen Zusammenhang
  choice: heiligte
  alternative: weihte
  rationale: „Heiligte“ bewahrt die enge Verbindung zur Grundbedeutung „heilig“ und lässt offen, ob der Vorgang als Weihung, Absonderung oder Heiligmachung näher beschrieben wird. „Weihte“ wäre idiomatisch, würde den Bedeutungsumfang aber stärker auf einen rituellen Akt festlegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit vertrauter biblischer Kultterminologie. Der Satz folgt der knappen hebräischen Erzählstruktur, bleibt aber im Deutschen flüssig.
