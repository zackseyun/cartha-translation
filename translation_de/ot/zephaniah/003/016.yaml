  text: בַּ/יּ֣וֹם הַ/ה֔וּא יֵאָמֵ֥ר לִ/ירֽוּשָׁלִַ֖ם אַל תִּירָ֑אִי צִיּ֖וֹן אַל יִרְפּ֥וּ יָדָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/016.yaml
  text: On that day it will be said to Jerusalem[a], “Do not fear”; to Zion, “Do not let your hands grow weak.”
translation:
  language: de
  text: 'An jenem Tag wird zu Jerusalem gesagt werden: „Fürchte dich nicht, Zion! Deine Hände sollen nicht erschlaffen!“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Deine Hände sollen nicht sinken“ oder „nicht schlaff werden“. Die hebräische Wendung beschreibt den Verlust von Kraft, Entschlossenheit oder Mut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Die geläufige deutsche Zeitangabe bewahrt den prophetischen Bezug und klingt natürlich.
- source_word: יֵאָמֵר
  choice: wird … gesagt werden
  rationale: Das Nifal Imperfekt wird als unpersönliches Passiv wiedergegeben; der im Hebräischen ungenannte Sprecher bleibt unbestimmt.
- source_word: לִירוּשָׁלַם
  choice: zu Jerusalem
  rationale: Die Präposition ל kennzeichnet hier die Adressatin der Rede.
- source_word: אַל תִּירָאִי
  choice: Fürchte dich nicht!
  rationale: Die feminine Singularform richtet sich an die personifizierte Stadt; die Übersetzung wahrt Aufforderungscharakter und Numerus.
- source_word: צִיּוֹן
  choice: Zu Zion
  rationale: Obwohl vor צִיּוֹן keine Präposition steht, setzt die parallele Konstruktion die Anrede fort. Die Ergänzung „Zu“ macht diese Parallelität im Deutschen deutlich.
- source_word: אַל יִרְפּוּ יָדַיִךְ
  choice: Lass deine Hände nicht kraftlos werden!
  rationale: רפה in Verbindung mit „Händen“ bezeichnet das Nachlassen von Kraft, Entschlossenheit oder Mut. Die Formulierung erhält das Bild der Hände und vermittelt zugleich den idiomatischen Sinn.
theological_decisions:
- issue: Personifizierung Jerusalems beziehungsweise Zions als feminine Singularadressatin
  choice: Die Städtenamen bleiben unmittelbar und im Singular angeredet.
  alternative: Die Anrede ausdrücklich auf die Einwohner Jerusalems beziehungsweise Zions beziehen.
  rationale: Der hebräische Text personifiziert Jerusalem und Zion. Eine Erweiterung zu deren Einwohnern würde eine sachlich naheliegende, aber nicht ausdrücklich formulierte Deutung in den Haupttext eintragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Stadtpersonifizierung, das unpersönliche Passiv und das konkrete Bild der Hände bleiben erhalten; die idiomatische Bedeutung wird in der Fußnote erläutert.
