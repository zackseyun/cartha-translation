id: ZEP.3.14
reference: Zephaniah 3:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: רָנִּי֙ בַּת צִיּ֔וֹן הָרִ֖יעוּ יִשְׂרָאֵ֑ל שִׂמְחִ֤י וְ/עָלְזִי֙ בְּ/כָל לֵ֔ב בַּ֖ת יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/014.yaml
  text: Sing for joy[a], daughter Zion; shout aloud, Israel! Rejoice and exult with all your heart, daughter Jerusalem!
translation:
  language: de
  text: Juble, Tochter Zion[a]; jauchzt, Israel! Freue dich und frohlocke von ganzem Herzen, Tochter Jerusalem!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Tochter Zions“ und entsprechend „Tochter Jerusalems“. Im Hebräischen werden die Städte als Personen angeredet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָנִּי
  choice: Juble
  rationale: Der feminine Singularimperativ von רנן bezeichnet einen hörbaren, freudigen Jubel. „Juble“ gibt die ausgelassene Freude natürlich und knapp wieder, ohne den musikalischen Aspekt stärker festzulegen, als es das Verb verlangt.
- source_word: בַּת צִיּוֹן
  choice: Tochter Zion
  rationale: Die personifizierende Stadtbezeichnung wird in ihrer knappen hebräischen Form bewahrt und ist als Anrede verständlich.
- source_word: הָרִיעוּ
  choice: jauchzt
  rationale: Der pluralische Imperativ bezeichnet einen lauten, freudigen Ruf. „Jauchzt“ bewahrt sowohl den hörbaren als auch den festlich-jubelnden Charakter.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Eigenname bleibt nach üblicher deutscher Form erhalten und wird hier als Anrede verstanden.
- source_word: שִׂמְחִי
  choice: Freue dich
  rationale: Der feminine Singularimperativ von שמח ruft zur Freude auf. „Freue dich“ ist im heutigen Deutsch natürlich und wahrt die direkte Anrede.
- source_word: וְעָלְזִי
  choice: und frohlocke
  rationale: עלז bezeichnet ausgelassene, triumphierende Freude. „Frohlocke“ erhält die gesteigerte poetische Nuance und unterscheidet sich von שׂמח.
- source_word: בְּכָל לֵב
  choice: von ganzem Herzen
  rationale: Die deutsche Wendung gibt die Totalität des inneren Empfindens idiomatisch wieder.
- source_word: בַּת יְרוּשָׁלִָם
  choice: Tochter Jerusalem
  rationale: Die Formulierung bleibt parallel zu „Tochter Zion“ und bewahrt die Personifizierung sowie den Anredecharakter.
