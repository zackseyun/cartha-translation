source:
  edition: WLC
  text: יְהוָ֤ה צַדִּיק֙ בְּ/קִרְבָּ֔/הּ לֹ֥א יַעֲשֶׂ֖ה עַוְלָ֑ה בַּ/בֹּ֨קֶר בַּ/בֹּ֜קֶר מִשְׁפָּט֨/וֹ יִתֵּ֤ן לָ/אוֹר֙ לֹ֣א נֶעְדָּ֔ר וְ/לֹֽא יוֹדֵ֥עַ עַוָּ֖ל בֹּֽשֶׁת־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/005.yaml
  text: Yahweh is righteous in her midst; he does no injustice[a]. Morning by morning he brings his justice to light; it does not fail. But the unjust knows no shame.
translation:
  language: de
  text: Jahwe ist gerecht in ihrer Mitte; er tut kein Unrecht. Morgen für Morgen bringt er sein Recht[a] ans Licht; es bleibt nicht aus. Doch der Ungerechte kennt keine Scham.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: seinen Rechtsspruch.'
    reason: Lexikalisch kann מִשְׁפָּטוֹ neben dem umfassenderen »Recht« auch eine konkrete richterliche Entscheidung bezeichnen.
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: צַדִּיק
  choice: gerecht
  rationale: Das prädikative Adjektiv bezeichnet Jahwes moralische und rechtliche Integrität; »gerecht« bewahrt beide Aspekte.
- source_word: בְּקִרְבָּהּ
  choice: in ihrer Mitte
  rationale: Das feminine Suffix bezieht sich im Zusammenhang auf die als Frau personifizierte Stadt Jerusalem und bleibt daher sichtbar.
- source_word: לֹא יַעֲשֶׂה עַוְלָה
  choice: er tut kein Unrecht
  rationale: Die Formulierung gibt die ethische und rechtliche Aussage knapp und idiomatisch wieder.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: Morgen für Morgen
  rationale: Die Wiederholung drückt eine regelmäßig wiederkehrende Handlung aus und wird im Deutschen in entsprechender Form bewahrt.
- source_word: מִשְׁפָּטוֹ
  choice: sein Recht
  rationale: »Recht« umfasst hier sowohl Jahwes Gerechtigkeit als auch sein richterliches Entscheiden und erhält damit die Bedeutungsbreite des hebräischen Ausdrucks.
- source_word: יִתֵּן לָאוֹר
  choice: bringt er … ans Licht
  rationale: Die hebräische Wendung bedeutet wörtlich, etwas dem Licht zu übergeben, und bezeichnet dessen sichtbares Offenbarwerden.
- source_word: לֹא נֶעְדָּר
  choice: es bleibt nicht aus
  rationale: Der Niphal bezeichnet das Nichtfehlen beziehungsweise Nichtausbleiben; die gewählte Formulierung ist natürlich und bezieht sich klar auf Jahwes Recht.
- source_word: וְלֹא יוֹדֵעַ עַוָּל בֹּשֶׁת
  choice: Doch der Ungerechte kennt keine Scham
  rationale: »Der Ungerechte« wahrt die begriffliche Verbindung zu »Unrecht«; »doch« macht den im Zusammenhang deutlichen Gegensatz kenntlich.
theological_decisions:
- issue: Bezug und Geschlecht des Suffixes in בְּקִרְבָּהּ
  choice: »in ihrer Mitte« mit Bezug auf die personifizierte Stadt Jerusalem
  alternative: »in ihrer Mitte« ohne erkennbare Personifizierung beziehungsweise »in seiner Mitte« bei sachlichem Stadtbezug
  rationale: Das Hebräische verwendet ausdrücklich ein feminines Suffix, und der Kontext behandelt Jerusalem als weiblich personifizierte Stadt.
- issue: Bedeutung von מִשְׁפָּטוֹ
  choice: »sein Recht«
  alternative: »seinen Rechtsspruch« oder »sein Gericht«
  rationale: Der Ausdruck kann sowohl die gerechte Rechtsordnung beziehungsweise Rechtsausübung als auch eine konkrete richterliche Entscheidung bezeichnen. »Recht« lässt diese Spannung im Haupttext bestehen; die stärker forensische Möglichkeit wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzstruktur. Die weibliche Personifizierung der Stadt sowie die Wiederholung »Morgen für Morgen« bleiben erhalten; der Gegensatz im Schlusssatz wird natürlich mit »Doch« ausgedrückt.
