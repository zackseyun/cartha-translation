source:
  edition: WLC
  text: הִכְרַ֣תִּי גוֹיִ֗ם נָשַׁ֨מּוּ֙ פִּנּוֹתָ֔/ם הֶחֱרַ֥בְתִּי חֽוּצוֹתָ֖/ם מִ/בְּלִ֣י עוֹבֵ֑ר נִצְדּ֧וּ עָרֵי/הֶ֛ם מִ/בְּלִי אִ֖ישׁ מֵ/אֵ֥ין יוֹשֵֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/006.yaml
  text: I have cut off nations[a]; their corner towers are laid waste. I have made their streets desolate, with no one passing through. Their cities are devastated, without a man[c][b], with no inhabitant.
translation:
  language: de
  text: Ich habe Völker vernichtet; ihre Ecktürme[a] sind verwüstet. Ich habe ihre Straßen[b] veröden lassen, sodass niemand hindurchgeht. Ihre Städte sind verheert, ohne einen Menschen[c], ohne Bewohner.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: ihre Ecken; möglicherweise sind Eckbefestigungen oder Ecktürme gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: ihre Plätze; gemeint sein können allgemein die öffentlichen Bereiche der Städte.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: ohne einen Mann; die hebräische Wendung bezeichnet hier vollständige Entvölkerung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכְרַתִּי
  choice: Ich habe … vernichtet
  rationale: Das Hifil von כרת bezeichnet hier das Beseitigen bzw. Vernichten der Völker. „Vernichtet“ gibt den Gerichtskontext im Deutschen natürlicher wieder als das wörtlichere „abgeschnitten“; das Perfekt wahrt den vollendeten Charakter der hebräischen Form.
- source_word: גוֹיִם
  choice: Völker
  rationale: גּוֹיִם bezeichnet politische bzw. ethnische Gemeinschaften. „Völker“ ist im Deutschen idiomatisch und vermeidet die mögliche moderne Engführung von „Nationen“ auf Nationalstaaten.
- source_word: נָשַׁמּוּ
  choice: sind verwüstet
  rationale: Die Form von שמם beschreibt den eingetretenen Zustand der Verwüstung und passt zum parallelen Bild zerstörter Städte.
- source_word: פִּנּוֹתָם
  choice: ihre Ecktürme
  rationale: Wörtlich steht „ihre Ecken“. Im Zusammenhang mit der Zerstörung befestigter Städte sind wahrscheinlich markante Eckbauten oder Ecktürme gemeint. Die Fußnote bewahrt die wörtliche und allgemeinere Möglichkeit.
- source_word: הֶחֱרַבְתִּי
  choice: Ich habe … veröden lassen
  rationale: Das Hifil von חרב kann „verwüsten“ oder „öde machen“ bedeuten. Bei Straßen hebt „veröden lassen“ passend ihre völlige Leere hervor.
- source_word: חוּצוֹתָם
  choice: ihre Straßen
  rationale: Der Plural von חוּץ bezeichnet häufig die Straßen oder öffentlichen Plätze einer Stadt. „Straßen“ ist hier die klarste moderne Wiedergabe; andere öffentliche Freiräume bleiben als Alternative in der Fußnote erhalten.
- source_word: מִבְּלִי עוֹבֵר
  choice: sodass niemand mehr hindurchgeht
  rationale: Die Wendung beschreibt das Ergebnis völliger Verlassenheit. „Mehr“ ist im Deutschen eine natürliche kontextuelle Verdeutlichung, ohne einen neuen Sachinhalt einzuführen.
- source_word: נִצְדּוּ
  choice: sind verheert
  rationale: Das seltene und schwierige Verb bezeichnet im Zusammenhang eindeutig den ruinösen Zustand der Städte. „Verheert“ bildet diesen Sinn ab, ohne eine unsichere Wortbedeutung zu präzise festzulegen.
- source_word: עָרֵיהֶם
  choice: ihre Städte
  rationale: עָרִים bezeichnet hier die urbanen Siedlungen der gerichteten Völker; „Städte“ ist die übliche Entsprechung.
- source_word: מִבְּלִי אִישׁ
  choice: ohne einen Menschen
  rationale: אִישׁ ist formal ein maskulines Singularwort, bezeichnet in dieser festen Entvölkerungsformel jedoch menschliche Anwesenheit allgemein. „Mensch“ wahrt den Singular und gibt die idiomatische Aussage im Deutschen präzise wieder.
- source_word: מֵאֵין יוֹשֵׁב
  choice: ohne Bewohner
  rationale: Die abschließende Wendung verstärkt das Bild vollständiger Entvölkerung. Der deutsche Kollektivgebrauch „ohne Bewohner“ ist knapp und natürlich.
theological_decisions:
- issue: Maskulines אִישׁ in einer Formel vollständiger Entvölkerung
  choice: ohne einen Menschen
  alternative: ohne einen Mann
  rationale: Obwohl אִישׁ formal maskulin ist, meint die parallele Wendung hier nicht speziell die Abwesenheit männlicher Personen, sondern keinerlei menschliche Anwesenheit. „Mensch“ bewahrt die singularische Form und verhindert eine sachlich irreführende geschlechtliche Einschränkung; eine Fußnote dokumentiert den Wortlaut.
translation_notes:
  register: 'Modernes, würdevolles Standarddeutsch mit klarer prophetischer Gerichtssprache. Die kurzen parallelen Sätze bilden die Steigerung des Hebräischen nach: Vernichtung der Völker, Verödung ihrer Verkehrswege und schließlich völlige Entvölkerung ihrer Städte.'
