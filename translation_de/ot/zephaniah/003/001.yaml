  text: ה֥וֹי מֹרְאָ֖ה וְ/נִגְאָלָ֑ה הָ/עִ֖יר הַ/יּוֹנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/001.yaml
  text: Woe to the rebellious and defiled city[b][a], the oppressing one!
translation:
  language: de
  text: Wehe der widerspenstigen und befleckten[a] Stadt, der Unterdrückerin[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und verunreinigten“.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort הַיּוֹנָה kann wörtlicher als „die Taube“ gelesen werden; im Zusammenhang wird es jedoch meist als bildhafte Bezeichnung der Stadt als Unterdrückerin verstanden.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Wehe
  rationale: Leitet einen prophetischen Wehruf ein und bewahrt sowohl den klagenden als auch den ankündigenden Gerichtston.
- source_word: מֹרְאָה
  choice: widerspenstig
  rationale: Gibt die von מרה her verstandene Auflehnung gegen Zurechtweisung und Autorität natürlich und prägnant wieder.
- source_word: וְנִגְאָלָה
  choice: und befleckt
  rationale: Der Zusammenhang verlangt eine negative Beschreibung moralischer oder kultischer Verunreinigung; die gewöhnliche Bedeutung „erlöst“ passt hier nicht. „Verunreinigt“ bleibt als nahe Alternative in der Fußnote erhalten.
- source_word: הָעִיר
  choice: Stadt
  rationale: Direkte und kontextgerechte Wiedergabe von עִיר.
- source_word: הַיּוֹנָה
  choice: der Unterdrückerin
  rationale: Folgt der im anklagenden Parallelismus naheliegenden Deutung als Bezeichnung einer unterdrückenden Stadt. Die grammatisch mögliche wörtliche Lesart „die Taube“ wird wegen der echten lexikalischen Mehrdeutigkeit in einer Fußnote bewahrt.
theological_decisions:
- issue: Bezug und Deutung von הַיּוֹנָה
  choice: 'Apposition zur Stadt: „der Unterdrückerin“'
  alternative: „der Taube“
  rationale: Der Gerichtskontext stützt die traditionelle Deutung als weitere moralische Anklage, doch die mögliche nominale Lesart „Taube“ darf nicht verschwiegen werden.
translation_notes:
  register: Moderner, würdevoller prophetischer Stil. „Wehe“ erhält die traditionelle Kraft des Wehrufs; „widerspenstig“ und „befleckt“ sind allgemein verständlich. Die feminine Apposition „der Unterdrückerin“ bezieht sich eindeutig auf „Stadt“.
