base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/020.yaml
  text: At that time I will bring you in[a], and at that time I will gather you; for I will make you a name and a praise among all the peoples of the earth, when I restore your fortunes before your eyes, says Yahweh.
translation:
  language: de
  text: Zu jener Zeit werde ich euch herbeibringen, zur Zeit, in der ich euch sammle. Denn ich werde euch zu Ruhm und Lob machen unter allen Völkern der Erde, wenn ich vor euren Augen euer Geschick wende[a], spricht Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Möglicherweise enger: „eure Gefangenschaft wenden“ oder „eure Gefangenen zurückbringen“. Die hebräische Wendung bezeichnet die Wiederherstellung nach Exil oder schwerem Unglück.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: Zu jener Zeit
  rationale: Gibt die prophetische Zeitformel idiomatisch und würdevoll wieder.
- source_word: אָבִיא אֶתְכֶם
  choice: werde ich euch herbeibringen
  rationale: Das Hifil von בוא bezeichnet das Herbeibringen; „her-“ lässt das im Zusammenhang vorausgesetzte Ziel erkennen, ohne ausdrücklich „zurück“ in den Text einzutragen.
- source_word: וּבָעֵת קַבְּצִי אֶתְכֶם
  choice: zu der Zeit, wenn ich euch sammle
  rationale: Bewahrt die wiederholte Zeitangabe und gibt den Infinitiv mit Suffix als zeitlichen Nebensatz wieder, statt ihn ohne Kennzeichnung in ein zweites selbstständiges Futur umzuwandeln.
- source_word: אֶתֵּן אֶתְכֶם לְשֵׁם וְלִתְהִלָּה
  choice: ich werde euch zu Ruhm und Lob machen
  rationale: Natürliches Deutsch für die hebräische Wendung „zu einem Namen und zum Lob geben“; der Gedanke öffentlich verliehenen Ansehens bleibt erhalten.
- source_word: בְּכֹל עַמֵּי הָאָרֶץ
  choice: unter allen Völkern der Erde
  rationale: „Unter“ bezeichnet den Kreis, in dem Israel Ruhm und Lob erfährt; der Plural „Völker“ und die globale Bedeutung von הָאָרֶץ bleiben erhalten.
- source_word: בְּשׁוּבִי אֶת שְׁבוּתֵיכֶם
  choice: wenn ich euer Geschick wende
  rationale: Gibt die Wiederherstellungsformel in einem geläufigen deutschen biblischen Ausdruck wieder, ohne sie ausschließlich auf Gefangenschaft oder Gefangene festzulegen.
- source_word: לְעֵינֵיכֶם
  choice: vor euren Augen
  rationale: Bewahrt das anschauliche hebräische Idiom und betont, dass die Angesprochenen die Wiederherstellung selbst erleben werden.
- source_word: אָמַר יְהוָה
  choice: spricht Jahwe
  rationale: Entspricht der prophetischen Botenformel und gibt den Gottesnamen ausdrücklich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als solcher erkennbar wiedergegeben, statt durch einen Titel ersetzt zu werden.
- issue: Bedeutungsumfang der Formel שׁוּב שְׁבוּת
  choice: euer Geschick wenden
  alternative: eure Gefangenschaft wenden / eure Gefangenen zurückbringen
  rationale: Die Formel kann umfassende Wiederherstellung nach Exil oder Not bezeichnen. Die Hauptübersetzung wahrt diesen weiteren Sinn; die konkreteren möglichen Deutungen werden in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich macht die enge zeitliche Verbindung der beiden ersten Satzglieder lesbar und wahrt zugleich die wiederholte Zeitangabe des Hebräischen.
