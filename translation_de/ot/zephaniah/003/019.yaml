source:
  edition: WLC
  text: הִנְ/נִ֥י עֹשֶׂ֛ה אֶת כָּל מְעַנַּ֖יִ/ךְ בָּ/עֵ֣ת הַ/הִ֑יא וְ/הוֹשַׁעְתִּ֣י אֶת הַ/צֹּלֵעָ֗ה וְ/הַ/נִּדָּחָה֙ אֲקַבֵּ֔ץ וְ/שַׂמְתִּי/ם֙ לִ/תְהִלָּ֣ה וּ/לְ/שֵׁ֔ם בְּ/כָל הָ/אָ֖רֶץ בָּשְׁתָּֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/019.yaml
  text: Behold[a], at that time I will deal with all your oppressors, and I will save the lame and gather the outcast[d][c][b], and I will make them a praise and a name in every land where they were put to shame.
translation:
  language: de
  text: Siehe, zu jener Zeit werde ich gegen alle vorgehen, die dich bedrücken. Ich werde die Hinkende retten und die Vertriebene sammeln[a]. Ich werde sie zu Lob und Ansehen machen in jedem Land, in dem sie beschämt wurden[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »die Hinkende« und »die Weggetriebene«. Das Hebräische verwendet feminine Singularformen und personifiziert wahrscheinlich die bedrängte Gemeinschaft.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »auf der ganzen Erde«.'
    reason: lexical_alternative
  - marker: c
    text: Die hebräische Schlusswendung ist schwierig; wörtlicher kann sie auch mit »in ihrer Schande« wiedergegeben werden.
    reason: textual_difficulty
lexical_decisions:
- source_word: הִנְנִי
  choice: Siehe
  rationale: Bewahrt die feierliche prophetische Ankündigungsformel und bleibt in würdevollem, verständlichem Deutsch natürlich.
- source_word: עֹשֶׂה אֶת כָּל מְעַנַּיִךְ
  choice: werde ich gegen alle vorgehen, die dich bedrücken
  rationale: Das an sich allgemeine עֹשֶׂה erhält durch das Objekt einen gerichtlichen Sinn; die Wiedergabe bezeichnet entschlossenes Handeln, ohne dessen konkrete Form zu überbestimmen.
- source_word: בָּעֵת הַהִיא
  choice: zu jener Zeit
  rationale: Direkte Wiedergabe der prophetischen Zeitangabe, ohne sie mit der anderen Formel »an jenem Tag« gleichzusetzen.
- source_word: וְהוֹשַׁעְתִּי
  choice: Ich werde ... retten
  rationale: Gibt den üblichen Sinn von ישׁע wieder und erhält zugleich den theologischen Klang der Rettung.
- source_word: הַצֹּלֵעָה
  choice: die Hinkende
  rationale: Bewahrt die feminine Singularform und das konkrete Bild einer hinkenden Person beziehungsweise der personifizierten leidenden Gemeinschaft.
- source_word: הַנִּדָּחָה אֲקַבֵּץ
  choice: die Vertriebene sammeln
  rationale: נדח bezeichnet das Wegtreiben oder Vertreiben; »sammeln« erhält das typische Motiv der Wiederherstellung der Zerstreuten.
- source_word: וְשַׂמְתִּים לִתְהִלָּה וּלְשֵׁם
  choice: Ich werde ihnen Lob und Ansehen verschaffen
  rationale: Gibt den hebräischen Ergebnissinn idiomatisch wieder. »Ansehen« vermittelt שֵׁם als guten Ruf, während »Lob« das Substantiv תְּהִלָּה wahrt.
- source_word: בְּכָל הָאָרֶץ
  choice: in jedem Land
  rationale: Im Zusammenhang von Vertreibung und Wiederherstellung ist der distributive Sinn plausibel; die mögliche Bedeutung »auf der ganzen Erde« bleibt in einer Fußnote erhalten.
- source_word: בָּשְׁתָּם
  choice: in dem sie beschämt wurden
  rationale: Die schwierige Schlussform wird entsprechend dem Zusammenhang als Orts- beziehungsweise Relationsangabe zu ihrer erlittenen Schande verstanden, ohne die wörtlichere Möglichkeit zu verschweigen.
theological_decisions:
- issue: Personifizierung der bedrängten Gemeinschaft
  choice: die Hinkende ... die Vertriebene
  alternative: die Hinkenden ... die Vertriebenen
  rationale: Die femininen Singularformen des Hebräischen werden bewahrt. So bleibt offen, ob eine personifizierte Tochter Zion oder die Gemeinschaft kollektiv gemeint ist.
- issue: Reichweite von הָאָרֶץ
  choice: in jedem Land
  alternative: auf der ganzen Erde
  rationale: Der Kontext der Zerstreuung unterstützt die örtlich-distributive Lesart; die universalere Lesart ist sprachlich ebenfalls möglich und wird nicht ausgeschlossen.
- issue: Deutung der schwierigen Schlusswendung בָּשְׁתָּם
  choice: in dem sie beschämt wurden
  alternative: in ihrer Schande
  rationale: Die kontextuelle Wiedergabe beschreibt die Umkehr früherer Erniedrigung. Wegen der knappen und schwierigen hebräischen Form wird die wörtlichere Alternative ausdrücklich dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit erkennbar prophetischem Ton. Die feminine Bildsprache des Ausgangstextes und die Mehrdeutigkeit der Schlusswendung werden bewahrt; schwer verständliche Hebraismen werden im Haupttext behutsam idiomatisiert.
