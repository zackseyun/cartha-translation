- from: Siehe, zu jener Zeit werde ich gegen alle vorgehen, die dich bedrücken. Ich werde die Hinkende retten und die Vertriebene sammeln[a]. Ich werde ihnen Lob und Ansehen verschaffen in jedem Land, in dem sie beschämt wurden[b][c].
