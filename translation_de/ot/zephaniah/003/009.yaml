id: ZEP.3.9
reference: Zephaniah 3:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּֽי אָ֛ז אֶהְפֹּ֥ךְ אֶל עַמִּ֖ים שָׂפָ֣ה בְרוּרָ֑ה לִ/קְרֹ֤א כֻלָּ/ם֙ בְּ/שֵׁ֣ם יְהוָ֔ה לְ/עָבְד֖/וֹ שְׁכֶ֥ם אֶחָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/009.yaml
  text: For then I will change the speech of the peoples to a pure speech[c][b][a], so that all of them may call on the name of Yahweh and serve him with one accord.
translation:
  language: de
  text: Denn dann werde ich die Sprache der Völker in eine reine Sprache verwandeln[a], damit sie alle den Namen Jahwes[b] anrufen und ihm Schulter an Schulter dienen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Dann werde ich den Völkern eine reine Lippe zuwenden.“ Gemeint sein können eine geläuterte Rede, gereinigte Lippen oder eine wiederhergestellte reine Sprache.'
    reason: lexical_alternative
  - marker: b
    text: „Jahwe“ gibt den Gottesnamen JHWH wieder; traditionell wird er mit „der HERR“ übersetzt.
    reason: alternative_reading
  - marker: c
    text: 'Wörtlich: „mit einer Schulter“; das Bild bezeichnet gemeinsamen, geeinten Dienst.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶהְפֹּךְ
  choice: werde … verwandeln
  rationale: הפך bezeichnet ein Wenden oder Verändern. „Verwandeln“ gibt hier den Übergang zu einem neuen, reinen Zustand wieder, ohne eine innere Bekehrung ausdrücklich in das Verb hineinzulesen.
- source_word: עַמִּים
  choice: die Völker
  rationale: Der Plural bezeichnet mehrere Volksgruppen und unterstreicht die umfassende Reichweite der Verheißung.
- source_word: שָׂפָה בְרוּרָה
  choice: eine reine Sprache
  rationale: שָׂפָה bedeutet wörtlich „Lippe“ und kann metonymisch Sprache oder Rede bezeichnen; בְרוּרָה bedeutet „rein“ beziehungsweise „geläutert“. „Reine Sprache“ ist verständlich und lässt offen, ob vor allem die Rede, die Lippen oder eine gemeinsame Sprache gemeint sind.
- source_word: לִקְרֹא … בְּשֵׁם יְהוָה
  choice: den Namen Jahwes anrufen
  rationale: קרא בשם ist eine feste Wendung für das anbetende oder bittende Anrufen Gottes. Die Zwecknuance des Infinitivs wird durch „damit“ ausgedrückt.
- source_word: לְעָבְדוֹ
  choice: ihm … dienen
  rationale: עבד umfasst den Dienst für Gott einschließlich der Anbetung. „Dienen“ bewahrt diese größere Bedeutungsbreite.
- source_word: שְׁכֶם אֶחָד
  choice: Schulter an Schulter
  rationale: Die Wendung bedeutet wörtlich „mit einer Schulter“ und beschreibt gemeinsames, geeintes Handeln. „Schulter an Schulter“ bewahrt das hebräische Bild und ist im Deutschen verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen. Die verbreitete traditionelle Wiedergabe „der HERR“ wird in der Fußnote genannt.
- issue: Art der verheißenen Veränderung
  choice: die Sprache der Völker in eine reine Sprache verwandeln
  alternative: den Völkern reine Lippen geben / die Lippen der Völker reinigen
  rationale: Die ungewöhnliche hebräische Konstruktion lässt offen, ob eine geläuterte Rede, gereinigte Lippen als Bild für erneuerte Anbetung oder eine wiederhergestellte reine Sprache im Vordergrund steht. Der Haupttext bleibt verständlich; die Fußnote bewahrt die Mehrdeutigkeit.
- issue: Einheit des Dienstes
  choice: Schulter an Schulter dienen
  alternative: einmütig dienen
  rationale: Die bildhafte Formulierung wahrt die konkrete hebräische Metapher und drückt zugleich die gemeinsame Ausrichtung der Völker aus, ohne die Einheit näher dogmatisch zu bestimmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau ist klar und flüssig; „Schulter an Schulter“ erhält das einprägsame hebräische Bild. Die Fußnoten machen die ungewöhnliche Konstruktion und ihre echte Bedeutungsbreite sichtbar.
