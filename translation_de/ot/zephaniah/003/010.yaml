base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/010.yaml
  text: From beyond the rivers of Cush, my worshipers, the daughter of my dispersed ones, will bring my offering.
translation:
  language: de
  text: Von jenseits der Flüsse von Kusch[c] werden meine Beter[a], die Tochter meiner Zerstreuten[b], mir meine Opfergabe bringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Flehenden“. Das hebräische Wort bezeichnet Menschen, die bitten oder beten, und kann in diesem Zusammenhang auch Gottesverehrer meinen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Tochter meiner Verstreuten“. Der knappe hebräische Ausdruck kann als poetische Bezeichnung einer zerstreuten Gemeinschaft verstanden werden.'
    reason: alternative_reading
  - marker: c
    text: Kusch bezeichnet die antike Region südlich von Ägypten und ist nicht genau mit dem heutigen Äthiopien gleichzusetzen.
    reason: cultural_note
lexical_decisions:
- source_word: מֵעֵבֶר
  choice: von jenseits
  rationale: Bezeichnet die Herkunft aus einem Gebiet auf der anderen Seite einer geografischen Grenze und bewahrt die räumliche Perspektive des Hebräischen.
- source_word: לְנַהֲרֵי כוּשׁ
  choice: der Flüsse von Kusch
  rationale: Der antike Ortsname Kusch wird beibehalten, da er nicht genau mit dem heutigen Äthiopien gleichzusetzen ist; der Plural נַהֲרֵי wird mit „Flüsse“ wiedergegeben.
- source_word: עֲתָרַי
  choice: meine Beter
  rationale: Die Bezeichnung ist von עתר, „bitten, flehen“, abzuleiten und meint Menschen, die sich im Gebet an Gott wenden. „Beter“ ist präziser als das allgemeinere „Anbeter“, ohne den kultischen Zusammenhang auszuschließen.
- source_word: בַּת
  choice: die Tochter
  rationale: Die personifizierende Kollektivmetapher des hebräischen Ausdrucks wird erhalten und nicht durch eine erklärende Umschreibung eingeebnet.
- source_word: פוּצַי
  choice: meiner Zerstreuten
  rationale: Die substantivierte Form mit Suffix bezeichnet die dem Sprecher zugehörigen Zerstreuten; die Übersetzung lässt offen, ob er selbst sie zerstreut hat.
- source_word: יוֹבִלוּן
  choice: werden … bringen
  rationale: Das Hifil von יבל bezeichnet hier das Herbeibringen beziehungsweise Darbringen einer Gabe; „bringen“ ist im Deutschen natürlich.
- source_word: מִנְחָתִי
  choice: mir meine Opfergabe
  rationale: מִנְחָה kann Gabe, Tribut oder Opfergabe bedeuten. Der religiöse Kontext stützt „Opfergabe“; das zusätzliche „mir“ macht im Deutschen den Empfänger deutlich, ohne den Besitzbezug des Suffixes aufzugeben.
theological_decisions:
- issue: Deutung von עֲתָרַי בַּת פוּצַי
  choice: 'Appositionelle Beschreibung einer aus der Ferne kommenden Gemeinschaft: „meine Beter, die Tochter meiner Zerstreuten“'
  alternative: 'Zwei Gruppen: „meine Beter … meine Zerstreuten“, oder eine freie kollektive Umschreibung wie „die Gemeinschaft meiner Zerstreuten“'
  rationale: Die hebräische Wortfolge ist gedrängt und syntaktisch mehrdeutig. Die gewählte Fassung bewahrt sowohl die Apposition als auch das personifizierende Bild, ohne die Beziehung zwischen den Betern und den Zerstreuten genauer festzulegen, als es der Text erlaubt.
- issue: Bedeutung von מִנְחָתִי
  choice: meine Opfergabe
  alternative: meine Gabe; meinen Tribut
  rationale: Der Zusammenhang der erneuerten Gottesverehrung spricht für eine kultische Gabe, doch der weitere Bedeutungsumfang des hebräischen Wortes bleibt in der Fußnote kenntlich.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrter prophetischer Bildsprache. „Beter“ gibt den engeren Wortsinn wieder; die ungewöhnliche Formulierung „die Tochter meiner Zerstreuten“ bleibt wegen der echten syntaktischen und poetischen Mehrdeutigkeit erhalten.
