  terminology: „Jahwe“ ist als Wiedergabe des Tetragramms konsequent. „Mächtiger Held“ gibt גִּבּוֹר natürlich wieder, ohne die militärische Konnotation durch „Krieger“ unnötig festzulegen. Die objektlose Aussage „in seiner Liebe wird er schweigen“ bewahrt die syntaktische Mehrdeutigkeit von יַחֲרִישׁ בְּאַהֲבָתוֹ.
