  text: יְהוָ֧ה אֱלֹהַ֛יִ/ךְ בְּ/קִרְבֵּ֖/ך גִּבּ֣וֹר יוֹשִׁ֑יעַ יָשִׂ֨ישׂ עָלַ֜יִ/ךְ בְּ/שִׂמְחָ֗ה יַחֲרִישׁ֙ בְּ/אַ֣הֲבָת֔/וֹ יָגִ֥יל עָלַ֖יִ/ךְ בְּ/רִנָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/017.yaml
  text: Yahweh your God is in your midst[a], a mighty one who saves; he will rejoice over you with gladness; he will be quiet in his love; he will exult over you with singing.
translation:
  language: de
  text: Jahwe, dein Gott, ist in deiner Mitte, ein mächtiger Held, der rettet. Er wird sich über dich mit Freude freuen; in seiner Liebe wird er schweigen[a]; er wird über dich mit Jubelgesang jubeln.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er wird dich durch seine Liebe beruhigen.“ Eine andere, weniger wahrscheinliche Deutung lautet: „In seiner Liebe wird er dich erneuern.“'
    reason: Alternative Deutungen der mehrdeutigen Wendung יַחֲרִישׁ בְּאַהֲבָתוֹ. Die Hauptfassung bewahrt das im Hebräischen fehlende ausdrückliche Objekt; die erste Alternative ergänzt es interpretierend.
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel wie „der HERR“ ersetzt.
- source_word: אֱלֹהַיִךְ
  choice: dein Gott
  rationale: Das Suffix der 2. Person feminin Singular richtet sich kollektiv an Zion/Jerusalem; „dein Gott“ bewahrt diese direkte Bundesanrede.
- source_word: בְּקִרְבֵּךְ
  choice: in deiner Mitte
  rationale: Die Wendung bezeichnet Jahwes Gegenwart im Zentrum seines Volkes und bleibt im Deutschen natürlich und räumlich konkret.
- source_word: גִּבּוֹר יוֹשִׁיעַ
  choice: ein mächtiger Retter
  rationale: גִּבּוֹר bezeichnet einen Mächtigen bzw. Helden, und יוֹשִׁיעַ beschreibt sein rettendes Handeln. Die kompakte deutsche Nominalwendung bewahrt beides, ohne die militärische Bedeutung von „Krieger“ festzuschreiben.
- source_word: יָשִׂישׂ עָלַיִךְ בְּשִׂמְחָה
  choice: Er freut sich über dich mit großer Freude
  rationale: יָשִׂישׂ drückt lebhafte Freude aus; die Ergänzung „großer“ vermittelt die Intensität idiomatisch, während בְּשִׂמְחָה ausdrücklich als „mit ... Freude“ erhalten bleibt.
- source_word: יַחֲרִישׁ בְּאַהֲבָתוֹ
  choice: in seiner Liebe schweigt er
  rationale: Das Verb bedeutet im vorliegenden Konsonantentext am unmittelbarsten „schweigen/still sein“ und hat kein ausdrückliches Objekt. Die Wortstellung lässt die spannungsreiche Aussage im Deutschen bestehen.
- source_word: יָגִיל עָלַיִךְ
  choice: er jubelt über dich
  rationale: יָגִיל bezeichnet freudiges Frohlocken; „jubeln“ unterscheidet es passend vom vorherigen יָשִׂישׂ.
- source_word: בְּרִנָּה
  choice: mit lautem Gesang
  rationale: רִנָּה kann einen Jubelruf oder jubelnden Gesang bezeichnen. „Lauter Gesang“ wahrt sowohl den stimmlichen als auch den feierlichen Charakter.
theological_decisions:
- issue: Bedeutung von יַחֲרִישׁ בְּאַהֲבָתוֹ
  choice: in seiner Liebe schweigt er
  alternative: 'er bringt dich durch seine Liebe zur Ruhe; weniger wahrscheinlich: er erneuert dich in seiner Liebe'
  rationale: Im masoretischen Text steht bei „schweigen/still sein“ kein ausdrückliches Objekt. Die Hauptfassung folgt daher der naheliegenden Syntax, ohne die theologisch bedeutsamen Deutungen zu verdecken; diese werden in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede Zions im femininen Singular. Poetische Parallelität und die Steigerung von Freude zu Jubel bleiben erhalten; ungebräuchliche Sakralsprache wird vermieden.
