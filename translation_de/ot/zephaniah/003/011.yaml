language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא לֹ֤א תֵב֨וֹשִׁי֙ מִ/כֹּ֣ל עֲלִילֹתַ֔יִ/ךְ אֲשֶׁ֥ר פָּשַׁ֖עַתְּ בִּ֑/י כִּי אָ֣ז אָסִ֣יר מִ/קִּרְבֵּ֗/ךְ עַלִּיזֵי֙ גַּאֲוָתֵ֔/ךְ וְ/לֹֽא תוֹסִ֧פִי לְ/גָבְהָ֛ה ע֖וֹד בְּ/הַ֥ר קָדְשִֽׁ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/011.yaml
  text: On that day you will not be put to shame because of all your deeds by which you rebelled against me[a], for then I will remove from your midst those who exult in your pride[b], and you will no longer be haughty on my holy mountain.
translation:
  language: de
  text: An jenem Tag wirst du wegen all deiner Taten, mit denen du dich gegen mich aufgelehnt hast, nicht beschämt dastehen[a]. Denn dann werde ich aus deiner Mitte diejenigen entfernen, die in deinem Hochmut jubeln[b], und du wirst dich auf meinem heiligen Berg nicht länger überheben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wirst du dich nicht schämen“. Das hebräische Verb kann sowohl das Empfinden von Scham als auch den Zustand der Beschämung oder Schande bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „die Jubelnden deines Hochmuts“. Der hebräische Ausdruck kann Menschen bezeichnen, die durch Hochmut geprägt sind oder in ihm jubeln.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵבוֹשִׁי
  choice: wirst du … nicht beschämt dastehen
  rationale: בושׁ bezeichnet Scham oder Schande. Die Formulierung gibt hier den Zustand beziehungsweise das Ergebnis der Beschämung wieder, ohne die mögliche Bedeutung eines inneren Schamgefühls auszuschließen.
- source_word: מִכֹּל עֲלִילֹתַיִךְ
  choice: wegen all deiner Taten
  rationale: Die Präposition מִן nach בושׁ bezeichnet idiomatisch den Grund der Scham; עֲלִילָה bleibt mit „Taten“ hinreichend breit, erhält aber durch den Folgesatz seine negative Färbung.
- source_word: פָּשַׁעַתְּ בִּי
  choice: mit denen du dich gegen mich aufgelehnt hast
  rationale: פשע bezeichnet nicht bloß allgemeines Sündigen, sondern Auflehnung beziehungsweise Treuebruch; die reflexive deutsche Wendung gibt den relationalen Charakter natürlich wieder.
- source_word: אָסִיר
  choice: entferne ich
  rationale: 'Das Hifil von סור hat hier kausative Bedeutung: Gott beseitigt beziehungsweise entfernt die betreffenden Menschen aus der Gemeinschaft.'
- source_word: מִקִּרְבֵּךְ
  choice: aus deiner Mitte
  rationale: Die feste Wendung bewahrt den gemeinschaftlichen Bezug auf die als Frau angeredete Stadt beziehungsweise Zionsgemeinschaft.
- source_word: עַלִּיזֵי גַּאֲוָתֵךְ
  choice: alle, die hochmütig jubeln
  rationale: עַלִּיזֵי bezeichnet jubelnde oder frohlockende Menschen; גַּאֲוָה ist im Zusammenhang negativ als Hochmut zu verstehen. Die deutsche Formulierung beschreibt ihre von Hochmut geprägte Freude, ohne das schwierige Konstruktverhältnis zu überpräzisieren.
- source_word: וְלֹא תוֹסִפִי לְגָבְהָה עוֹד
  choice: und du wirst dich … nicht länger überheben
  rationale: Die Verbindung von „hinzufügen/fortfahren“ mit Infinitiv und עוֹד bedeutet „nicht länger“. גבה bezeichnet hier arrogante Selbsterhöhung, nicht körperliche Höhe.
- source_word: בְּהַר קָדְשִׁי
  choice: auf meinem heiligen Berg
  rationale: Gemeint ist Zion als der heilige Berg Gottes; „auf“ entspricht dem räumlichen Bild im natürlichen Deutschen.
theological_decisions:
- issue: Ob die Anfangsverheißung jedes Schamgefühl verneint oder die durch frühere Auflehnung verursachte Beschämung im Zuge der Reinigung beendet
  choice: Die Übersetzung spricht davon, dass Zion wegen seiner wirklichen früheren Taten nicht mehr beschämt dastehen wird.
  alternative: Zion wird keinerlei Scham mehr empfinden oder seine früheren Taten gelten als unschuldig.
  rationale: Der Relativsatz benennt die Auflehnung ausdrücklich als tatsächlich geschehen; zugleich begründet Gottes anschließendes reinigendes Handeln das Ende der Beschämung. So bleiben Schuld und Wiederherstellung nebeneinander stehen.
- issue: Bezug von עַלִּיזֵי גַּאֲוָתֵךְ
  choice: Menschen in Zions Mitte, deren Jubel von Hochmut geprägt ist
  alternative: Menschen, die über Zions eigenen Hochmut jubeln, oder „deine hochmütig Frohlockenden“
  rationale: Die hebräische Konstruktverbindung lässt sich unterschiedlich entfalten. Der Zusammenhang mit der Entfernung aus Zions Mitte und dem anschließenden Ende der Selbsterhöhung legt hochmütige Menschen nahe, ohne den genauen semantischen Bezug völlig festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die feminine Einzahl der Anrede wird im Deutschen nicht eigens markiert, bezieht sich aber auf Zion beziehungsweise Jerusalem. „Beschämt dastehen“ und „sich überheben“ sind verständlich und zugleich gehoben genug für prophetische Rede; unnötig konfessionelle Terminologie wurde vermieden.
