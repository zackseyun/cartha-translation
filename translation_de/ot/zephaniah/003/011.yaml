revisions:
- from: An jenem Tag wirst du wegen all deiner Taten, mit denen du dich gegen mich aufgelehnt hast, nicht beschämt dastehen[a]. Denn dann entferne ich aus deiner Mitte alle, die hochmütig jubeln[b], und du wirst dich auf meinem heiligen Berg nicht länger überheben.
  to: An jenem Tag wirst du wegen all deiner Taten, mit denen du dich gegen mich aufgelehnt hast, nicht beschämt dastehen[a]. Denn dann werde ich aus deiner Mitte diejenigen entfernen, die in deinem Hochmut jubeln[b], und du wirst dich auf meinem heiligen Berg nicht länger überheben.
  rationale: Die Revision entfernt die nicht im Ausgangstext enthaltene Quantifizierung „alle“, gibt das zukünftige Handeln Gottes ausdrücklich futurisch wieder und glättet die Fußnote. „Diejenigen, die in deinem Hochmut jubeln“ folgt der im englischen Audit gewählten Entfaltung, bewahrt aber durch die Fußnote die umstrittene beziehungsweise mehrdeutige Konstruktverbindung.
