  text: Her officials within her are roaring lions[a]; her judges are evening wolves that leave nothing for the morning.
translation:
  language: de
  text: Ihre führenden Amtsträger in ihrer Mitte sind brüllende Löwen; ihre Richter sind Wölfe am Abend, die bis zum Morgen nichts übrig lassen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „die bis zum Morgen keine Knochen nagen“. Die schwierige hebräische Wendung kann bedeuten, dass sie alles restlos verzehren und nichts für den Morgen übrig lassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֶיהָ
  choice: ihre führenden Männer
  rationale: שַׂר bezeichnet je nach Zusammenhang Fürsten, Herrscher oder hohe Amtsträger. „Führende Männer“ gibt die städtische Führung in heutigem Deutsch wieder, ohne eine bestimmte erbliche Adelsstellung vorauszusetzen.
- source_word: בְקִרְבָּהּ
  choice: in ihrer Mitte
  rationale: Die Wendung bezeichnet das Innere beziehungsweise die Mitte der als Frau dargestellten Stadt und bleibt so bildhaft und natürlich.
- source_word: אֲרָיוֹת שֹׁאֲגִים
  choice: brüllende Löwen
  rationale: Das Partizip שֹׁאֲגִים beschreibt das bedrohliche Brüllen der Raubtiere; die knappe Nominalfügung wird im Deutschen mit „sind“ wiedergegeben.
- source_word: שֹׁפְטֶיהָ
  choice: ihre Richter
  rationale: שֹׁפֵט bezeichnet hier unmittelbar die für Rechtsprechung zuständigen Autoritäten.
- source_word: זְאֵבֵי עֶרֶב
  choice: Wölfe am Abend
  rationale: Die Constructusverbindung bedeutet wörtlich „Wölfe des Abends“. „Wölfe am Abend“ bewahrt das Bild der bei Einbruch der Nacht jagenden Raubtiere und klingt im modernen Deutsch natürlicher als „Abendwölfe“.
- source_word: לֹא גָרְמוּ לַבֹּקֶר
  choice: die bis zum Morgen nichts übrig lassen
  rationale: Die schwierige, mit dem Zernagen beziehungsweise Brechen von Knochen verbundene Wendung schildert restlosen, gierigen Verbrauch. Die Haupttextfassung vermittelt diesen Sinn klar; die konkretere mögliche Wiedergabe steht in der Fußnote.
