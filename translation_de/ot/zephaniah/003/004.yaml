id: ZEP.3.4
reference: Zephaniah 3:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: נְבִיאֶ֨י/הָ֙ פֹּֽחֲזִ֔ים אַנְשֵׁ֖י בֹּֽגְד֑וֹת כֹּהֲנֶ֨י/הָ֙ חִלְּלוּ קֹ֔דֶשׁ חָמְס֖וּ תּוֹרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/004.yaml
  text: Her prophets are reckless[a], treacherous men; her priests have profaned the holy[b]; they have done violence to the law.
translation:
  language: de
  text: Ihre Propheten sind leichtfertig, treulose Männer; ihre Priester haben das Heilige[a] entweiht und dem Gesetz Gewalt angetan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Heiligtum“ oder „heilige Dinge“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der Weisung“; hebräisch Tora.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבִיאֶיהָ
  choice: ihre Propheten
  rationale: Der Plural im Constructus mit Suffix der 3. Person feminin Singular bezieht sich auf die personifizierte Stadt; „ihre Propheten“ gibt dieses Verhältnis natürlich wieder.
- source_word: פֹּחֲזִים
  choice: leichtfertig
  rationale: Das Wort bezeichnet unbeherrschtes, vorschnelles und moralisch haltloses Verhalten. „Leichtfertig“ ist im heutigen Deutsch verständlich und bewahrt sowohl den ethischen als auch den verhaltensbezogenen Vorwurf.
- source_word: אַנְשֵׁי בֹּגְדוֹת
  choice: treulose Männer
  rationale: Wörtlich steht eine Verbindung wie „Männer der Treulosigkeiten/Verrätereien“. „Treulose Männer“ ist idiomatisch und kennzeichnet sie als Menschen, deren Verhalten von wiederholter Untreue geprägt ist; das ausdrücklich maskuline אֲנָשִׁים wird als „Männer“ wiedergegeben.
- source_word: כֹּהֲנֶיהָ
  choice: ihre Priester
  rationale: Die Form ist parallel zu „ihre Propheten“ aufgebaut und wird entsprechend wiedergegeben.
- source_word: חִלְּלוּ
  choice: haben … entweiht
  rationale: Der Piel von חלל bezeichnet im kultischen Zusammenhang das Entheiligen oder Entweihen. „Entweiht“ ist präzise, geläufig und gibt den kultischen Vorwurf wieder.
- source_word: קֹדֶשׁ
  choice: das Heilige
  rationale: Das Substantiv kann das Heilige allgemein, heilige Dinge oder das Heiligtum bezeichnen. „Das Heilige“ erhält die im Hebräischen vorhandene Bedeutungsbreite, ohne sie auf das Tempelgebäude einzuengen.
- source_word: חָמְסוּ
  choice: haben … Gewalt angetan
  rationale: Das Verb trägt die Vorstellung von Gewalt, Unrecht und Verletzung. Die deutsche Wendung „jemandem oder etwas Gewalt antun“ bewahrt das starke Bild einer gewaltsamen Verfälschung oder Verletzung.
- source_word: תּוֹרָה
  choice: dem Gesetz
  rationale: תּוֹרָה kann allgemein „Weisung“ oder konkreter das Bundesgesetz bezeichnen. Im Zusammenhang mit den Priestern ist „Gesetz“ eine natürliche und institutionell passende Wiedergabe; „Weisung“ bleibt als Fußnotenalternative erhalten.
theological_decisions:
- issue: Bedeutungsumfang von קֹדֶשׁ bei der Entweihung durch die Priester
  choice: das Heilige als breite, nicht näher festgelegte Bezeichnung
  alternative: das Heiligtum; heilige Dinge
  rationale: Der hebräische Text nennt nicht ausdrücklich allein das Tempelgebäude. Die breite Wiedergabe bewahrt die echte Mehrdeutigkeit und vermeidet eine unnötige theologische oder kultische Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur wahrt den Parallelismus zwischen Propheten und Priestern. „Leichtfertig“ und „Gewalt angetan“ sind verständlich, behalten aber die Schärfe und Bildhaftigkeit des hebräischen Vorwurfs bei.
