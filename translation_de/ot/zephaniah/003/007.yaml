  source_fidelity: 'Die Grundstruktur ist zutreffend wiedergegeben: Gottes erwartete Reaktion der weiblichen Einzahl, die Wohnstätte in der dritten femininen Einzahl und der Wechsel zu den pluralischen Handelnden bleiben erhalten. Die Gerichtsklausel wird als schwierige, resultative Verknüpfung angemessen mit Fußnotenalternative dargestellt. „Vernichtet“ ist für נִכְרָת jedoch stärker und weniger bildnah als nötig; „ausgelöscht“ wahrt den Sinn des Beseitigtwerdens bzw. Abgeschnittenwerdens ohne unnötige Präzisierung.'
