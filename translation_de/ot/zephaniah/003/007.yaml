  terminology: „Zurechtweisung annehmen“, „Gewiss“, „gegen sie verhängt“ und „Taten“ sind angemessen. „Ausgelöscht“ ist als Wiedergabe von נִכְרָת in diesem Zusammenhang geeigneter als „vernichtet“, ohne eine bestimmte Art des Gerichts festzulegen.
