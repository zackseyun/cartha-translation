source:
  edition: WLC
  text: אָמַ֜רְתִּי אַךְ תִּירְאִ֤י אוֹתִ/י֙ תִּקְחִ֣י מוּסָ֔ר וְ/לֹֽא יִכָּרֵ֣ת מְעוֹנָ֔/הּ כֹּ֥ל אֲשֶׁר פָּקַ֖דְתִּי עָלֶ֑י/הָ אָכֵן֙ הִשְׁכִּ֣ימוּ הִשְׁחִ֔יתוּ כֹּ֖ל עֲלִילוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/007.yaml
  text: I said[a], ‘Surely you will fear me; you will accept correction. Then her dwelling would not be cut off, according to all that I had appointed against her.’ But instead, they rose early[b]; they corrupted all their deeds.
translation:
  language: de
  text: 'Ich sagte: »Gewiss wirst du mich fürchten und Zurechtweisung annehmen. Dann würde ihre Wohnstätte nicht ausgelöscht werden, entsprechend allem, was ich gegen sie verhängt hatte.[a]« Doch stattdessen standen sie früh auf; sie verdarben alle ihre Taten.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „Dann würde ihre Wohnstätte trotz allem, was ich gegen sie verhängt hatte, nicht ausgelöscht werden.“'
    reason: alternative_reading
  - marker: b
    text: „Früh aufstehen“ ist hier eine hebräische Wendung, die Eifer oder beharrliches Handeln ausdrücken kann.
    reason: cultural_note
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: Ich sagte
  rationale: Die erste Person Perfekt von אמר wird direkt wiedergegeben und leitet die göttliche Rede ein; „ich dachte“ wäre idiomatisch möglich, aber weniger unmittelbar.
- source_word: אַךְ
  choice: Gewiss
  rationale: Die Partikel drückt hier eine zuversichtliche Erwartung aus, nicht bloß eine Einschränkung.
- source_word: תִּירְאִי אוֹתִי
  choice: du wirst mich fürchten
  rationale: „Fürchten“ bewahrt sowohl den direkten Wortsinn als auch die bei Gottesfurcht mitschwingende Bedeutung ehrfürchtiger Anerkennung.
- source_word: תִּקְחִי מוּסָר
  choice: Zurechtweisung annehmen
  rationale: לקח mit מוּסָר bezeichnet das Annehmen erzieherischer Korrektur; die Formulierung ist im Deutschen natürlich und wahrt den disziplinierenden Sinn.
- source_word: וְלֹא יִכָּרֵת
  choice: würde nicht vernichtet werden
  rationale: Das Niphal von כרת bezeichnet hier das Beseitigt- oder Zerstörtwerden. Der Konjunktiv gibt den im Zusammenhang liegenden, nicht eingetretenen Folgesinn wieder.
- source_word: מְעוֹנָהּ
  choice: ihre Wohnstätte
  rationale: Die feminine Endung wird als dritte Person Singular erhalten und verweist auf die als Frau dargestellte Stadt; „Wohnstätte“ gibt den räumlichen Sinn würdig und verständlich wieder.
- source_word: כֹּל אֲשֶׁר פָּקַדְתִּי עָלֶיהָ
  choice: entsprechend allem, was ich gegen sie verhängt hatte
  rationale: פקד kann ein bestimmendes oder strafendes Einschreiten bezeichnen. „Verhängt“ macht den Gerichtskontext deutlich, ohne zu behaupten, das Gericht sei bereits vollständig vollzogen worden; die schwierige Verknüpfung bleibt in einer Fußnote offen.
- source_word: אָכֵן
  choice: Doch stattdessen
  rationale: Die Partikel markiert hier den scharfen Gegensatz zwischen der erwarteten Umkehr und dem tatsächlichen Verhalten.
- source_word: הִשְׁכִּימוּ
  choice: sie standen früh auf
  rationale: Die konkrete hebräische Wendung bleibt im Haupttext erhalten; ihre idiomatische Bedeutung von Eifer oder Beharrlichkeit wird in der Fußnote erläutert.
- source_word: הִשְׁחִיתוּ
  choice: verdarben
  rationale: Das Hiphil von שׁחת kann transitiv „verderben“ oder „zugrunde richten“ bedeuten und verbindet sich hier unmittelbar mit den Taten.
- source_word: כֹּל עֲלִילוֹתָם
  choice: alle ihre Taten
  rationale: עלילות bezeichnet Handlungen oder Taten und trägt im Kontext eine deutliche moralische Wertung.
theological_decisions:
- issue: Wechsel zwischen der femininen Einzahl und der Mehrzahl
  choice: Jerusalem wird zunächst als Frau angesprochen und mit „ihre Wohnstätte“ bezeichnet; anschließend bezieht sich „sie“ in der Mehrzahl auf die Bewohner beziehungsweise das Volk.
  alternative: Die feminine Form könnte allgemeiner die Stadt oder das Gemeinwesen bezeichnen, ohne dass die Personifikation besonders betont wird.
  rationale: Die Übersetzung bewahrt den auffälligen Numeruswechsel des Hebräischen, statt ihn durch einheitliche Pronomen zu glätten.
- issue: Bezug der Gerichtsklausel כֹּל אֲשֶׁר פָּקַדְתִּי עָלֶיהָ
  choice: 'Die Klausel gehört zum nicht eingetretenen Ergebnis: Bei Annahme der Zurechtweisung wäre ihre Wohnstätte nicht entsprechend den gegen sie verhängten Gerichten vernichtet worden.'
  alternative: 'Die Klausel kann konzessiv verstanden werden: Ihre Wohnstätte würde trotz allem, was Gott gegen sie verhängt hatte, nicht vernichtet.'
  rationale: Der hebräische Satz ist gedrängt und syntaktisch mehrdeutig. Die Hauptfassung folgt dem wahrscheinlichen Zusammenhang von erwarteter Umkehr und abwendbarem Gericht; die konzessive Lesart wird ausdrücklich in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Gottesrede bleibt klar und knapp. Der Wechsel von der angesprochenen weiblichen Einzahl zur Mehrzahl wird bewusst nicht geglättet; ebenso bleibt das hebräische Bild des frühen Aufstehens im Text erhalten und wird erläutert.
