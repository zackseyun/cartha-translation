  variant: modern standard German
source:
  edition: WLC
  text: נוּגֵ֧י מִ/מּוֹעֵ֛ד אָסַ֖פְתִּי מִמֵּ֣/ךְ הָי֑וּ מַשְׂאֵ֥ת עָלֶ֖י/הָ חֶרְפָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/018.yaml
  text: I have gathered those grieving over the appointed festival from you[a]; they were a reproach upon her[c][b], a burden.
translation:
  language: de
  text: Die wegen des Festes Trauernden[a] habe ich von dir gesammelt[b]; sie waren für sie[c] eine Last, eine Schmach.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die vom Fest / von der Festversammlung Bedrückten oder Entfernten habe ich von dir gesammelt.“ Das Hebräische ist schwierig; gemeint sein können Menschen, die über das entbehrte Fest trauern, oder Menschen, die von der Festversammlung ausgeschlossen beziehungsweise entfernt waren.'
    reason: alternative_reading
  - marker: b
    text: „Habe ich gesammelt“ kann auch mit „ich sammelte“ oder im prophetischen Zusammenhang mit „ich werde sammeln“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: c
    text: „Sie“ bezieht sich wahrscheinlich auf Zion beziehungsweise Jerusalem.
    reason: cross_reference
lexical_decisions:
- source_word: נוּגֵי
  choice: die Menschen, die … trauerten
  rationale: Gibt den substantivisch gebrauchten Ausdruck als Personen in Trauer wieder, ohne die Ursache über den Kontext hinaus festzulegen.
- source_word: מִמּוֹעֵד
  choice: wegen des Festes
  rationale: מוֹעֵד bezeichnet hier wahrscheinlich das festgesetzte Kultfest beziehungsweise die Festversammlung. Die Präposition מִן lässt jedoch mehrere Beziehungen zu, was in der Fußnote offengehalten wird.
- source_word: אָסַפְתִּי
  choice: habe ich … gesammelt
  rationale: Bewahrt die formale perfektive Vergangenheitsform des Qatal; ein prophetisch zukünftiger Sinn bleibt als Alternative möglich.
- source_word: מִמֵּךְ
  choice: aus deiner Mitte
  rationale: Gibt die Herkunft aus der weiblich angeredeten Stadt natürlicher wieder als das im Deutschen missverständliche „von dir“.
- source_word: מַשְׂאֵת
  choice: eine Last
  rationale: Der seltene Ausdruck wird hier im Sinn einer zu tragenden Last verstanden, nicht als „Ausspruch“.
- source_word: עָלֶיהָ
  choice: auf ihr
  rationale: Folgt der Präposition und dem femininen Suffix möglichst direkt; der Bezug ist wahrscheinlich Zion beziehungsweise Jerusalem.
- source_word: חֶרְפָּה
  choice: eine Schmach
  rationale: Erfasst öffentliche Entehrung und Beschämung in knapper, würdiger Sprache.
theological_decisions:
- issue: Mehrdeutige Syntax und Beziehung der Trauernden zum Fest
  choice: Menschen aus Zion trauern wegen des entbehrten Festes und werden von Gott gesammelt.
  alternative: Gemeint sein können vom Fest beziehungsweise von der Festversammlung entfernte oder bedrückte Menschen.
  rationale: Der hebräische Satz ist stark verdichtet. Die Hauptfassung ist kontextuell plausibel, während die Fußnote die echte syntaktische Alternative bewahrt.
- issue: Zeitwert von אָסַפְתִּי
  choice: 'Perfekt: „habe ich gesammelt“'
  alternative: Präteritum „ich sammelte“ oder prophetisch zukünftig „ich werde sammeln“
  rationale: Die Übersetzung folgt zunächst der hebräischen Qatal-Form, ohne den im Wiederherstellungskontext möglichen Zukunftsbezug auszuschließen.
- issue: Bezug des femininen Pronomens עָלֶיהָ
  choice: Das Pronomen bleibt als „ihr“ im Haupttext erhalten.
  alternative: Explizite Wiedergabe als „Zion/Jerusalem“
  rationale: So wird der wahrscheinliche Bezug erläutert, aber die im Text vorhandene pronominale Form nicht stillschweigend aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Schlusswendung „eine Schmach auf ihr, eine Last“ bleibt bewusst nahe an der verdichteten und schwierigen hebräischen Wortfolge, statt sie durch eine eindeutige Deutung zu glätten.
