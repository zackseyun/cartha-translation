    issue: „niemand wird sie aufschrecken“ für אֵין מַחֲרִיד
    rationale: Das hebräische Partizip bezeichnet einen, der in Angst oder Schrecken versetzt. „Aufschrecken“ kann lediglich das kurzfristige Erschrecken bzw. Aufwecken meinen und ist daher semantisch enger und schwächer. „Niemand wird sie in Schrecken versetzen“ gibt die zugesagte umfassende Sicherheit genauer wieder.
