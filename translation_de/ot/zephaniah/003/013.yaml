source:
  edition: WLC
  text: שְׁאֵרִ֨ית יִשְׂרָאֵ֜ל לֹֽא יַעֲשׂ֤וּ עַוְלָה֙ וְ/לֹא יְדַבְּר֣וּ כָזָ֔ב וְ/לֹֽא יִמָּצֵ֥א בְּ/פִי/הֶ֖ם לְשׁ֣וֹן תַּרְמִ֑ית כִּֽי הֵ֛מָּה יִרְע֥וּ וְ/רָבְצ֖וּ וְ/אֵ֥ין מַחֲרִֽיד־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/013.yaml
  text: The remnant of Israel will do no wrong and speak no lies[a], and no deceitful tongue will be found in their mouth; for they will graze and lie down[b], with no one to make them afraid.
translation:
  language: de
  text: Der Rest Israels wird kein Unrecht tun und keine Lüge reden; und keine betrügerische Zunge wird in ihrem Mund zu finden sein. Denn sie werden weiden und sich lagern[a], und niemand wird sie in Schrecken versetzen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Weiden und sich lagern“ ist das Bild einer Herde, die ungestört und sicher lebt.
    reason: cultural_note
lexical_decisions:
- source_word: שְׁאֵרִית יִשְׂרָאֵל
  choice: der Rest Israels
  rationale: שְׁאֵרִית bezeichnet den übrig gebliebenen beziehungsweise bewahrten Teil eines Volkes. „Der Rest Israels“ ist im Deutschen verständlich und bewahrt den prophetischen Bedeutungsgehalt.
- source_word: יַעֲשׂוּ עַוְלָה
  choice: wird kein Unrecht tun
  rationale: עַוְלָה umfasst Unrecht, Ungerechtigkeit und Verkehrtheit. „Unrecht tun“ gibt den breiten moralischen Sinn natürlich wieder, ohne ihn auf gerichtliche Ungerechtigkeit zu verengen.
- source_word: יְדַבְּרוּ כָזָב
  choice: keine Lüge reden
  rationale: כָזָב bedeutet Lüge oder Falschheit. Die Wendung bleibt nahe am hebräischen Verb und klingt zugleich würdig und verständlich.
- source_word: יִמָּצֵא בְּפִיהֶם
  choice: wird in ihrem Mund zu finden sein
  rationale: Der hebräische Singular „Mund“ mit pluralischem Suffix ist kollektiv gebraucht. Der deutsche kollektive Singular erhält dieses Bild.
- source_word: לְשׁוֹן תַּרְמִית
  choice: betrügerische Zunge
  rationale: Die konkrete Metapher bezeichnet täuschende Rede. „Betrügerische Zunge“ bewahrt das Körperbild, statt es zu „Betrug“ oder „Täuschung“ zu abstrahieren.
- source_word: כִּי
  choice: denn
  rationale: כִּי stellt hier eine begründende beziehungsweise erläuternde Verbindung her; „denn“ erhält diese Beziehung, ohne sie genauer festzulegen als der Ausgangstext.
- source_word: יִרְעוּ
  choice: sie werden weiden
  rationale: Das Verb bezeichnet das Grasen beziehungsweise Weiden einer Herde. „Weiden“ wahrt das Hirten- und Herdenbild und passt zum folgenden Sichlagern.
- source_word: וְרָבְצוּ
  choice: und sich lagern
  rationale: רבץ bezeichnet besonders das Niederlegen von Tieren. „Sich lagern“ bewahrt die pastorale Bildsprache in natürlichem, gehobenem Deutsch.
- source_word: אֵין מַחֲרִיד
  choice: niemand wird sie aufschrecken
  rationale: מַחֲרִיד ist ein Partizip für jemanden, der erschreckt oder in Unruhe versetzt. „Niemand wird sie aufschrecken“ gibt den persönlichen Verursacher und die sichere Ruhe prägnant wieder.
theological_decisions:
- issue: Pastorale Bildsprache im Schlussteil
  choice: „sie werden weiden und sich lagern“
  alternative: „sie werden Nahrung finden und sicher ruhen“
  rationale: Die konkreten Herdenbilder des Hebräischen werden beibehalten. So bleibt die prophetische Darstellung von Frieden und Sicherheit erhalten, ohne sie durch eine abstrakte Deutung zu ersetzen.
- issue: Bezeichnung des bewahrten Teils Israels
  choice: „der Rest Israels“
  alternative: „die Übriggebliebenen Israels“
  rationale: „Rest“ bildet שְׁאֵרִית knapp ab und erhält den in prophetischen Texten angelegten Gedanken eines übrig gebliebenen beziehungsweise bewahrten Teils, ohne dessen Identität weiter auszudeuten.
- issue: Reichweite der Zukunftsaussagen
  choice: Zukünftige Verbformen ohne nähere zeitliche oder heilsgeschichtliche Festlegung
  alternative: Auslegung als ausdrückliche Verheißung für eine bestimmte endzeitliche Gruppe
  rationale: Die Übersetzung gibt die hebräischen Imperfektformen als Zukunft wieder, bestimmt aber weder Zeitpunkt noch genaue heilsgeschichtliche Erfüllung über den Wortlaut hinaus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die Parallelität der drei Verneinungen und die konkrete pastorale Bildsprache bleiben erhalten. „Lüge reden“ ist bewusst etwas feierlicher als „lügen“, um die formale Entsprechung zum hebräischen Ausdruck zu wahren.
