id: ZEP.3.15
reference: Zephaniah 3:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הֵסִ֤יר יְהוָה֙ מִשְׁפָּטַ֔יִ/ךְ פִּנָּ֖ה אֹֽיְבֵ֑/ךְ מֶ֣לֶךְ יִשְׂרָאֵ֤ל יְהוָה֙ בְּ/קִרְבֵּ֔/ךְ לֹא תִֽירְאִ֥י רָ֖ע עֽוֹד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/015.yaml
  text: Yahweh has taken away your judgments[a]; he has turned away your enemy. The King of Israel, Yahweh, is in your midst[b]; you will fear evil no more.
translation:
  language: de
  text: Jahwe hat die Urteile gegen dich aufgehoben[a]; er hat deinen Feind beseitigt. Der König Israels, Jahwe, ist in deiner Mitte; du wirst nichts Böses mehr fürchten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „deine Urteile“; gemeint sein können auch die gegen dich ergangenen Rechtssprüche oder dein Strafurteil.'
    reason: lexical_alternative
  - marker: b
    text: „Böses“ kann hier auch „Unheil“, „Unglück“ oder „Schaden“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵסִיר
  choice: hat … aufgehoben
  rationale: Der Hifil von סור bezeichnet hier das Entfernen oder Wegnehmen. Bei gegen Zion ergangenen Urteilen ist „aufgehoben“ im Deutschen sachlich und idiomatisch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מִשְׁפָּטַיִךְ
  choice: die Urteile gegen dich
  rationale: מִשְׁפָּט kann Rechtsspruch, Urteil oder Gericht bezeichnen. Der Kontext der Wiederherstellung Zions spricht für belastende Urteile, die gegen sie ergangen sind; die Formulierung vermeidet das missverständliche „deine Urteile“.
- source_word: פִּנָּה
  choice: hat … beseitigt
  rationale: Das Verb bezeichnet das Wegschaffen oder Fortwenden. Mit dem Feind als Objekt gibt „beseitigt“ die vollzogene Entfernung natürlich wieder.
- source_word: אֹיְבֵךְ
  choice: deinen Feind
  rationale: Der masoretische Text hat den Singular; dieser wird beibehalten, auch wenn er kollektiv verstanden werden kann.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: Der König Israels
  rationale: Die Status-constructus-Verbindung wird als Gottesbezeichnung unmittelbar wiedergegeben.
- source_word: בְּקִרְבֵּךְ
  choice: in deiner Mitte
  rationale: Die Wendung bezeichnet Jahwes Gegenwart mitten unter seinem Volk und bewahrt zugleich die räumliche Bildsprache.
- source_word: לֹא תִירְאִי
  choice: du wirst … nicht mehr fürchten
  rationale: Das Imperfekt der 2. Person feminin Singular wird als Zukunftsaussage verstanden; die feminine Anrede gilt Zion.
- source_word: רָע
  choice: nichts Böses
  rationale: רָע kann sowohl Böses als auch Unglück, Unheil oder Schaden bezeichnen. „Nichts Böses“ bewahrt die semantische Breite; die kontextuell naheliegende Bedeutung wird in der Fußnote genannt.
- source_word: עוֹד
  choice: nicht mehr
  rationale: Mit der Verneinung bedeutet עוֹד idiomatisch „nicht mehr“ oder „nicht länger“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den persönlichen Bundesnamen statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von מִשְׁפָּטַיִךְ im Heilswort
  choice: die Urteile gegen dich
  alternative: deine Gerichte; dein Strafurteil
  rationale: Im Zusammenhang sind belastende göttliche Rechtssprüche gemeint, doch das Substantiv ist weiter als „Strafe“. Die gewählte Formulierung macht die Richtung der Urteile deutlich, ohne sie auf eine einzelne Strafart einzuengen.
- issue: Bedeutung von רָע im Schlusssatz
  choice: nichts Böses
  alternative: kein Unheil; kein Unglück
  rationale: Das Wort kann moralisch Böses oder erfahrenes Unheil bezeichnen. Der Haupttext wahrt diese Spannung; die Fußnote nennt die im Wiederherstellungskontext wahrscheinliche Nuance.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feminine Singularanrede an Zion bleibt im Deutschen durch „dich“ formal unmarkiert. Der Satzbau folgt der feierlichen Abfolge des Hebräischen, ohne unnatürliche Archaismen.
