  text: לֹ֤א שָֽׁמְעָה֙ בְּ/ק֔וֹל לֹ֥א לָקְחָ֖ה מוּסָ֑ר בַּֽ/יהוָה֙ לֹ֣א בָטָ֔חָה אֶל אֱלֹהֶ֖י/הָ לֹ֥א קָרֵֽבָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/002.yaml
  text: She did not obey the voice[a]; she did not accept correction. She did not trust in Yahweh[d][c][b]; she did not draw near to her God.
translation:
  language: de
  text: Sie hörte nicht auf die Stimme[a] und nahm keine Zurechtweisung an. Auf Jahwe[b] vertraute sie nicht; ihrem Gott kam sie nicht nahe.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie gehorchte der Stimme nicht“ beziehungsweise „sie achtete nicht auf die Stimme“. Das hebräische „auf die Stimme hören“ schließt gewöhnlich gehorsames Hören ein.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: JHWH, hier „Jahwe“ wiedergegeben.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: „sie näherte sich ihrem Gott nicht“. Das hebräische Wort kann sowohl Annäherung als auch relationale oder gottesdienstliche Hinwendung ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעָה בְּקוֹל
  choice: hörte nicht auf die Stimme
  rationale: Die Verbindung שׁמע בְּקוֹל bezeichnet ein Hören, das Gehorsam einschließt. Die deutsche Wendung „auf die Stimme hören“ bewahrt sowohl das Bild der Stimme als auch den Sinn des Befolgens, ohne den im Hebräischen unausgesprochenen Sprecher zu ergänzen.
- source_word: לָקְחָה מוּסָר
  choice: nahm keine Zurechtweisung an
  rationale: Die idiomatische Verbindung meint, erziehende Korrektur oder Unterweisung anzunehmen. „Zurechtweisung annehmen“ ist im Deutschen verständlich und passt zum prophetischen Vorwurf.
- source_word: בַּיהוָה לֹא בָטָחָה
  choice: Auf Jahwe vertraute sie nicht
  rationale: בטח bezeichnet Vertrauen oder Sichverlassen; בְּ markiert hier dessen Gegenüber. „Auf … vertrauen“ ist die natürliche deutsche Entsprechung. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: אֱלֹהֶיהָ
  choice: ihrem Gott
  rationale: אֱלֹהִים bezeichnet hier trotz seiner formalen Pluralgestalt den Gott der personifizierten Stadt im Singular; das Suffix ist feminin Singular.
- source_word: קָרֵבָה
  choice: kam … nicht nahe
  rationale: קרב kann räumliche Annäherung sowie relationale oder gottesdienstliche Hinwendung bezeichnen. „Nahekommen“ lässt diese Bedeutungsbreite bestehen.
theological_decisions:
- issue: Bezug des femininen Subjekts
  choice: Das Subjekt bleibt als „sie“ unausgesprochen im Verb beziehungsweise wird durch feminine Pronomen aufgenommen, ohne es ausdrücklich als Jerusalem oder Stadt zu benennen.
  alternative: „Jerusalem“ oder „die Stadt“ ausdrücklich ergänzen.
  rationale: Die femininen Singularformen beziehen sich im Zusammenhang auf die personifizierte Stadt. Da in diesem Vers selbst kein Substantiv steht, wird die literarische Personifikation bewahrt, ohne den Bezug im Haupttext zu verdeutlichen.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; JHWH; Jehova
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt ihn im modernen Standarddeutsch als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsweite des Nahens zu Gott
  choice: „ihrem Gott kam sie nicht nahe“
  alternative: „sie näherte sich ihrem Gott nicht“ oder „sie trat nicht vor ihren Gott“
  rationale: Die Formulierung wahrt sowohl die relationale als auch die mögliche gottesdienstliche Dimension und legt den Vorgang nicht ausschließlich kultisch aus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst parallelem Satzbau. „Zurechtweisung“ ist gehoben, aber allgemein verständlich. Die feminine Personifikation und die vierfache Verneinung des Hebräischen bleiben erhalten; die Verben werden im Deutschen zur besseren Lesbarkeit in zwei parallelen Sätzen angeordnet.
