source:
  edition: WLC
  text: לָ/כֵ֤ן חַכּוּ לִ/י֙ נְאֻם יְהוָ֔ה לְ/י֖וֹם קוּמִ֣/י לְ/עַ֑ד כִּ֣י מִשְׁפָּטִ/י֩ לֶ/אֱסֹ֨ף גּוֹיִ֜ם לְ/קָבְצִ֣/י מַמְלָכ֗וֹת לִ/שְׁפֹּ֨ךְ עֲלֵי/הֶ֤ם זַעְמִ/י֙ כֹּ֚ל חֲר֣וֹן אַפִּ֔/י כִּ֚י בְּ/אֵ֣שׁ קִנְאָתִ֔/י תֵּאָכֵ֖ל כָּל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/008.yaml
  text: Therefore wait for me[a], declares Yahweh, for the day when I rise up for plunder; for my judgment is to gather nations, to assemble kingdoms, to pour out on them my indignation, all my burning anger[c][b]; for in the fire of my jealousy all the earth will be consumed.
translation:
  language: de
  text: 'Darum wartet auf mich[a] – Ausspruch Jahwes – bis zu dem Tag, an dem ich aufstehe, um Beute zu machen[b]. Denn mein Beschluss lautet: Nationen zu versammeln und Königreiche zusammenzubringen, um meinen Grimm über sie auszugießen – meinen ganzen glühenden Zorn. Denn im Feuer meines Eifers[c] wird die ganze Erde[d] verzehrt werden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Warten kann hier auch erwartungsvolles Hoffen auf Jahwe bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Wendung ist schwierig. Andere verstehen sie als: „an dem ich mich als Zeuge erhebe“.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: „meiner Eifersucht“.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „das ganze Land“. Der Zusammenhang mit Nationen und Königreichen spricht hier eher für „Erde“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Gibt den folgernden Anschluss an den vorausgehenden Zusammenhang knapp und natürlich wieder.
- source_word: חַכּוּ לִי
  choice: wartet auf mich
  rationale: Der Pluralimperativ mit ל bezeichnet das auf Jahwe gerichtete Warten; die deutsche Wendung bewahrt sowohl Aufforderung als auch Beziehungsrichtung.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Gibt die feste prophetische Botenformel würdevoll und nahe an ihrer substantivischen Form wieder.
- source_word: לְיוֹם קוּמִי
  choice: bis zu dem Tag, an dem ich mich … erhebe
  rationale: Im Anschluss an das Warten ist das temporale „bis zu dem Tag“ im Deutschen natürlich; „mich erhebe“ bewahrt das Bild göttlichen Tätigwerdens.
- source_word: לְעַד
  choice: zur Beute
  rationale: Die schwierige Form wird im vorliegenden Gerichtskontext wahrscheinlich im Sinn von Beute beziehungsweise Raub verstanden; die mögliche Deutung als Zeuge wird in der Fußnote bewahrt.
- source_word: מִשְׁפָּטִי
  choice: mein Beschluss
  rationale: Bezeichnet hier die richterliche Entscheidung, deren Inhalt durch die folgenden Infinitive entfaltet wird; „Beschluss“ vermeidet die mögliche Verwechslung von Urteil und Gerichtsgeschehen.
- source_word: לֶאֱסֹף גּוֹיִם / לְקָבְצִי מַמְלָכוֹת
  choice: Nationen zu versammeln und Königreiche zusammenzubringen
  rationale: Bewahrt den synonymen Parallelismus, ohne im Deutschen dasselbe Verb zu wiederholen.
- source_word: לִשְׁפֹּךְ עֲלֵיהֶם זַעְמִי
  choice: meinen Grimm über sie auszugießen
  rationale: Erhält das Bild des Ausgießens und gibt זַעַם als heftigen göttlichen Unwillen wieder.
- source_word: כֹּל חֲרוֹן אַפִּי
  choice: meinen ganzen glühenden Zorn
  rationale: Gibt die Intensität und das Hitze-Bild der hebräischen Wendung idiomatisch wieder.
- source_word: בְּאֵשׁ קִנְאָתִי
  choice: im Feuer meines Eifers
  rationale: „Eifer“ trägt hier sowohl die leidenschaftliche Ausschließlichkeit als auch den gerichtlichen Nachdruck; „Eifersucht“ bleibt als lexikalische Alternative in der Fußnote erhalten.
- source_word: כָּל הָאָרֶץ
  choice: die ganze Erde
  rationale: Der Zusammenhang mit Nationen und Königreichen begünstigt die globale Bedeutung, während „Land“ sprachlich möglich bleibt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Umschrift macht den Eigennamen sichtbar und folgt der Projektvorgabe, ohne eine konfessionelle Deutung einzutragen.
- issue: Deutung des schwierigen לְעַד
  choice: zur Beute
  alternative: als Zeuge
  rationale: Die Konsonanten- und Vokalgestalt sowie die Überlieferungs- und Übersetzungsgeschichte lassen verschiedene Deutungen zu. „Zur Beute“ passt wahrscheinlich zur angekündigten Sammlung der Völker zum Gericht; die juristisch passende Alternative „als Zeuge“ wird ausdrücklich offengehalten.
- issue: Bedeutung von קִנְאָה
  choice: Eifer
  alternative: Eifersucht
  rationale: Beide Bedeutungsbereiche sind möglich. „Eifer“ klingt im modernen Deutschen natürlicher für die verzehrende göttliche Leidenschaft, während die relationale Ausschließlichkeit von „Eifersucht“ in der Fußnote erhalten bleibt.
- issue: Reichweite von הָאָרֶץ
  choice: Erde
  alternative: Land
  rationale: Die Erwähnung von Nationen und Königreichen spricht für den umfassenderen Sinn; die engere räumliche Bedeutung ist jedoch lexikalisch möglich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischem Ernst. Der Gedankenfluss und die Bildsprache des Hebräischen bleiben erkennbar; ungewöhnliche oder umstrittene Lesarten werden nicht geglättet, sondern durch knappe Fußnoten transparent gemacht.
