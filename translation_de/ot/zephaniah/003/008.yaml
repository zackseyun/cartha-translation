  to: 'Darum wartet auf mich[a] – Ausspruch Jahwes – bis zu dem Tag, an dem ich aufstehe, um Beute zu machen[b]. Denn mein Beschluss lautet: Nationen zu versammeln und Königreiche zusammenzubringen, um meinen Grimm über sie auszugießen – meinen ganzen glühenden Zorn. Denn im Feuer meines Eifers[c] wird die ganze Erde[d] verzehrt werden.'
  rationale: Die Revision klärt ausschließlich die im Deutschen missverständliche Wendung „mich zur Beute erhebe“ zu „aufstehe, um Beute zu machen“ und glättet die Konstruktion zu „Mein Beschluss lautet“. Die umstrittene Alternativdeutung „als Zeuge“ bleibt ausdrücklich in der Fußnote erhalten; die Bedeutung und der Umfang der Passage werden nicht verändert.
