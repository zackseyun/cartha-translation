  text: וְ/הִשְׁאַרְתִּ֣י בְ/קִרְבֵּ֔/ךְ עַ֥ם עָנִ֖י וָ/דָ֑ל וְ/חָס֖וּ בְּ/שֵׁ֥ם יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/012.yaml
  text: But I will leave in your midst a people humble and lowly[a], and they will take refuge in the name of Yahweh.
translation:
  language: de
  text: Doch ich werde in deiner Mitte ein demütiges und geringes Volk übrig lassen[a], und sie werden beim Namen Jahwes Zuflucht suchen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein bedrängtes und armes Volk« oder »ein armes und schwaches Volk«. Die hebräischen Wörter können sowohl Bedrängnis und Armut als auch Demut und einen niedrigen Stand bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁאַרְתִּי
  choice: Doch ich werde … übrig lassen
  rationale: Der Hifil von שׁאר bezeichnet das Zurück- beziehungsweise Übriglassen. „Doch“ gibt den Gegensatz zum vorausgehenden Zusammenhang wieder, obwohl וְ für sich genommen lediglich „und“ bedeutet.
- source_word: בְקִרְבֵּךְ
  choice: in deiner Mitte
  rationale: Die Wendung bezeichnet den Ort innerhalb der als weiblicher Singular angeredeten Stadt Zion beziehungsweise Jerusalem und bewahrt die direkte Anrede.
- source_word: עַם
  choice: ein … Volk
  rationale: עַם bezeichnet hier die Gemeinschaft, die nach dem Gericht zurückbleibt; „Volk“ ist im Deutschen natürlicher und weniger politisch als „Nation“.
- source_word: עָנִי
  choice: demütig
  rationale: עָנִי kann „elend“, „bedrängt“ oder „arm“ bedeuten, bezeichnet im Kontext aber auch eine gebeugte, abhängige Haltung. „Demütig“ gibt diese Seite wieder, ohne die soziale Dimension durch die Fußnote auszublenden.
- source_word: וָדָל
  choice: und gering
  rationale: דַּל kann arm, schwach oder niedrig beziehungsweise gering bedeuten. „Gering“ bewahrt neben möglicher Armut besonders den niedrigen gesellschaftlichen Stand und verbindet sich im Deutschen natürlich mit „demütig“.
- source_word: וְחָסוּ
  choice: und sie werden … Zuflucht suchen
  rationale: חסה enthält das Bild, bei jemandem Schutz zu suchen. „Zuflucht suchen“ bewahrt dieses Bild deutlicher als das allgemeinere „vertrauen“.
- source_word: בְּשֵׁם
  choice: beim Namen
  rationale: Die Konstruktion bezeichnet den Namen als den Ort beziehungsweise Grund des Schutzes. „Beim Namen Jahwes Zuflucht suchen“ ist idiomatisches Deutsch und erhält die Schutzmetapher.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im modernen Deutschen etablierte Form der wissenschaftlichen Umschrift.
theological_decisions:
- issue: Bedeutung von עָנִי וָדָל für den übrig gebliebenen Rest
  choice: „demütiges und geringes Volk“
  alternative: „bedrängtes und armes Volk“ beziehungsweise „armes und schwaches Volk“
  rationale: Das Wortpaar kann sowohl äußere Bedrängnis und Armut als auch Niedrigkeit und eine abhängige Haltung ausdrücken. Der Haupttext hebt im Zusammenhang mit dem Zufluchtsuchen die Haltung hervor; die Fußnote bewahrt die soziale und leidensbezogene Bedeutung.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Die Wiedergabe als Eigenname bewahrt, dass der hebräische Text den persönlichen Gottesnamen und nicht einen Titel verwendet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bleibt klar und nah am hebräischen Aufbau. „Gering“ ist bewusst etwas gehobener, aber allgemein verständlich; die Fußnote hält die echte Bedeutungsbreite des hebräischen Wortpaares offen.
