source:
  edition: WLC
  text: וְ/נָטִ֤יתִי יָדִ/י֙ עַל יְהוּדָ֔ה וְ/עַ֖ל כָּל יוֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם וְ/הִכְרַתִּ֞י מִן הַ/מָּק֤וֹם הַ/זֶּה֙ אֶת שְׁאָ֣ר הַ/בַּ֔עַל אֶת שֵׁ֥ם הַ/כְּמָרִ֖ים עִם הַ/כֹּהֲנִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/004.yaml
  text: And I will stretch out my hand against Judah and against all the inhabitants of Jerusalem[a], and I will cut off from this place the remnant of Baal, the name of the idolatrous priests along with the priests[b],
translation:
  language: de
  text: Und ich werde meine Hand gegen Juda und gegen alle Bewohner Jerusalems ausstrecken. Von diesem Ort werde ich ausrotten, was von Baal noch übrig ist, ebenso den Namen[a] der Götzenpriester[b] samt den Priestern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Erinnerung an“. Die hebräische Wendung „den Namen“ meint hier, dass selbst die Erinnerung beseitigt wird.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet heidnische oder synkretistische Kultpriester und unterscheidet sie hier von den anschließend genannten „Priestern“.
    reason: cultural_note
lexical_decisions:
- source_word: וְנָטִיתִי יָדִי
  choice: ich werde meine Hand … ausstrecken
  rationale: Bewahrt das hebräische Bild für Gottes entschlossenes, hier gegen Juda gerichtetes Eingreifen. Das Futur entspricht der Abfolge der angekündigten Gerichtshandlungen.
- source_word: עַל יְהוּדָה וְעַל כָּל יוֹשְׁבֵי יְרוּשָׁלָם
  choice: gegen Juda und gegen alle Bewohner Jerusalems
  rationale: עַל hat im Zusammenhang der drohend ausgestreckten Hand feindliche Bedeutung. „Bewohner“ ist im städtischen Zusammenhang eine natürliche Wiedergabe.
- source_word: וְהִכְרַתִּי
  choice: werde ich ausrotten
  rationale: Das Hifil von כרת bezeichnet hier vollständige Beseitigung im Gericht. „Ausrotten“ gibt die Wirkung im Deutschen natürlicher wieder als das wörtliche „abschneiden“.
- source_word: מִן הַמָּקוֹם הַזֶּה
  choice: von diesem Ort
  rationale: Bewahrt den deiktischen Ausdruck, ohne den gemeinten Bereich über den unmittelbaren Kontext hinaus genauer festzulegen.
- source_word: שְׁאָר הַבַּעַל
  choice: was von Baal noch übrig ist
  rationale: Gibt שְׁאָר verständlich als verbliebenen Rest wieder und belässt zugleich die Verdichtung des Hebräischen, das Baals Präsenz, Verehrung oder Kult meinen kann.
- source_word: שֵׁם הַכְּמָרִים
  choice: den Namen der Götzenpriester
  rationale: „Den Namen“ bewahrt das hebräische Bild einer so vollständigen Beseitigung, dass selbst Name und Erinnerung verschwinden. כְּמָרִים bezeichnet heidnische oder synkretistische Kultpriester.
- source_word: עִם הַכֹּהֲנִים
  choice: samt den Priestern
  rationale: „Samt“ gibt עִם knapp und natürlich wieder. Die allgemeine Bezeichnung „Priester“ bleibt von den zuvor genannten Götzenpriestern unterschieden.
theological_decisions:
- issue: Unterscheidung zwischen כְּמָרִים und כֹּהֲנִים
  choice: „Götzenpriester“ für כְּמָרִים und „Priester“ für כֹּהֲנִים
  alternative: Beide Ausdrücke mit „Priester“ wiedergeben oder כְּמָרִים als „Kemarim“ transkribieren
  rationale: Der hebräische Text unterscheidet zwei Gruppen. Die gewählte Wiedergabe macht diese Unterscheidung verständlich, ohne die gewöhnlichen Priester ausdrücklich als identisch mit den Götzenpriestern zu bezeichnen.
- issue: Bedeutung von „den Namen“
  choice: Das Bild „den Namen“ bleibt im Haupttext erhalten.
  alternative: „die Erinnerung“ oder „jede Erwähnung“
  rationale: Die Formulierung bezeichnet eine vollständige Tilgung, bewahrt aber als wörtliches Bild die Ausdrucksweise und theologische Schärfe des Ausgangstextes.
- issue: Referenz von שְׁאָר הַבַּעַל
  choice: „was von Baal noch übrig ist“
  alternative: „der Rest des Baalskults“
  rationale: Die Alternative legt ausdrücklich den Kult als Referenten fest. Die gewählte Form lässt wie das Hebräische offen, ob Baalskult, Kultgegenstände, Amtsträger oder Baals Präsenz insgesamt im Blick sind.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das traditionelle Gottesgerichtsbild der ausgestreckten Hand bleibt erhalten; schwer verständliche Wörtlichkeit wird nur dort idiomatisch geglättet, wo sie im Deutschen missverständlich wäre.
