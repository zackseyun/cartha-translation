id: ZEP.1.13
reference: Zephaniah 1:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הָיָ֤ה חֵילָ/ם֙ לִ/מְשִׁסָּ֔ה וּ/בָתֵּי/הֶ֖ם לִ/שְׁמָמָ֑ה וּ/בָנ֤וּ בָתִּים֙ וְ/לֹ֣א יֵשֵׁ֔בוּ וְ/נָטְע֣וּ כְרָמִ֔ים וְ/לֹ֥א יִשְׁתּ֖וּ אֶת יֵינָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/013.yaml
  text: Their wealth will become plunder[a], and their houses a desolation; they will build houses but not inhabit them[b], and plant vineyards but not drink their wine.
translation:
  language: de
  text: Ihr Besitz wird zur Beute[a] und ihre Häuser zur Einöde. Sie werden Häuser bauen, aber nicht darin wohnen, und Weinberge pflanzen, aber deren Wein nicht trinken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihr Vermögen“; das hebräische Wort kann auch „ihre Stärke“ oder „ihr Heer“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵילָם
  choice: ihr Besitz
  rationale: חַיִל kann Stärke, Vermögen, Besitz oder Streitmacht bezeichnen. Im Parallelismus mit Häusern und Weinbergen bezeichnet es hier am ehesten den materiellen Besitz, der geplündert wird.
- source_word: לִמְשִׁסָּה
  choice: zur Beute
  rationale: Die Wendung bezeichnet das Ergebnis einer Plünderung. „Zur Beute werden“ ist im Deutschen natürlich und bewahrt den Gerichtston.
- source_word: וּבָתֵּיהֶם לִשְׁמָמָה
  choice: und ihre Häuser zur Einöde
  rationale: Die knappe Nominalkonstruktion wird parallel zum ersten Satzglied wiedergegeben; „zur Einöde“ bezeichnet den Zustand von Verwüstung und Verlassenheit.
- source_word: וּבָנוּ בָתִּים וְלֹא יֵשֵׁבוּ
  choice: Sie werden Häuser bauen, aber nicht darin wohnen
  rationale: Die prophetische Abfolge hat zukünftigen Sinn. „Darin wohnen“ gibt das implizite Objekt idiomatisch wieder.
- source_word: וְנָטְעוּ כְרָמִים וְלֹא יִשְׁתּוּ אֶת יֵינָם
  choice: und Weinberge pflanzen, aber deren Wein nicht trinken
  rationale: „Deren Wein“ bezieht den Wein eindeutig auf die zuvor genannten Weinberge und erhält die Ironie, dass die Pflanzenden den Ertrag nicht genießen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit engem Anschluss an die knappe prophetische Satzstruktur. „Besitz“ ist allgemein verständlich; „Einöde“ bewahrt die markante nominale Bildsprache des Hebräischen.
