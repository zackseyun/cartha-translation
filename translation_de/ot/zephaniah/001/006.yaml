revisions:
- from: und die, die sich von der Nachfolge Jahwes[a] abwenden[b], und die Jahwe nicht suchen und nicht nach ihm fragen[c].
  to: und diejenigen, die sich davon abwenden, Jahwe[a] zu folgen[b], und diejenigen, die Jahwe nicht suchen und nicht bei ihm Rat suchen[c].
  rationale: Die Revision glättet die koordinierte Satzstruktur, bildet das Bild des Aufhörens, Jahwe zu folgen, unmittelbarer ab und ersetzt die im Gegenwartsdeutschen missverständliche Wendung „nach ihm fragen“ durch die idiomatische, kontextgerechte Wendung „bei ihm Rat suchen“. Die Fußnote hält die enger am Wortlaut liegenden Alternativen ausdrücklich offen.
