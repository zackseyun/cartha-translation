  text: וְ/אֶת הַ/נְּסוֹגִ֖ים מֵ/אַחֲרֵ֣י יְהוָ֑ה וַ/אֲשֶׁ֛ר לֹֽא בִקְשׁ֥וּ אֶת יְהוָ֖ה וְ/לֹ֥א דְרָשֻֽׁ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/006.yaml
  text: and those who turn back from following Yahweh[c][b][a], and who do not seek Yahweh or inquire of him.
translation:
  language: de
  text: und diejenigen, die sich davon abwenden, Jahwe[a] zu folgen[b], und diejenigen, die Jahwe nicht suchen und nicht bei ihm Rat suchen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „die sich von Jahwe abwenden“; wörtlich: „die sich von hinter Jahwe zurückziehen“ beziehungsweise „abwenden“.'
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Verb kann auch mit „ihn suchen“, „nach ihm fragen“ oder „ihn befragen“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּסוֹגִים
  choice: die, die sich … abwenden
  rationale: Das Partizip bezeichnet Menschen, die zurückweichen oder sich abwenden. Die gewählte Formulierung gibt den Abfall als fortdauernde Haltung in natürlichem Deutsch wieder, ohne den später geprägten kirchlichen Ausdruck „Abtrünnige“ einzuführen.
- source_word: מֵאַחֲרֵי יְהוָה
  choice: von der Nachfolge Jahwes
  rationale: Die hebräische Wendung bedeutet, nicht länger hinter Jahwe herzugehen beziehungsweise ihm zu folgen. „Nachfolge“ bewahrt dieses Bild und verbindet sich im Deutschen klar mit „sich abwenden“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בִקְשׁוּ
  choice: suchen
  rationale: בקש bedeutet hier, Jahwe zu suchen beziehungsweise sich ihm zuzuwenden. Das vertraute und theologisch offene Verb „suchen“ bewahrt die Breite des Ausdrucks.
- source_word: דְרָשֻׁהוּ
  choice: nach ihm fragen
  rationale: דרש kann „suchen“, „befragen“ oder „sich erkundigen“ bedeuten. Nach dem bereits verwendeten „suchen“ bringt „nach ihm fragen“ die verwandte, aber unterscheidbare Nuance zum Ausdruck, ohne einen scharfen Bedeutungsunterschied zu behaupten.
- source_word: וַאֲשֶׁר לֹא … וְלֹא
  choice: und die … nicht … und nicht
  rationale: Die doppelte Verneinung und die Koordination des Hebräischen werden ausdrücklich beibehalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht der Eigenname JHWH. „Jahwe“ bewahrt diesen persönlichen Bundesnamen, während eine Fußnote die traditionelle Ersatzlesung erläutert.
- issue: Verhältnis von בקש und דרש
  choice: mit „suchen“ und „nach ihm fragen“ unterschiedlich, aber eng verwandt wiedergeben
  alternative: beide Verben mit „suchen“ wiedergeben
  rationale: Die zwei hebräischen Verben überschneiden sich semantisch. Zwei verwandte deutsche Wendungen erhalten die rhetorische Fülle, ohne daraus zwei klar getrennte geistliche Handlungen zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzanfang mit „und“ bleibt erhalten, weil der Vers die Aufzählung des vorangehenden Satzes fortsetzt. „Nachfolge“ ist leicht gehoben, aber allgemein verständlich und bildet die hebräische Wendung prägnant ab.
