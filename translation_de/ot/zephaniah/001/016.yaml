  text: י֥וֹם שׁוֹפָ֖ר וּ/תְרוּעָ֑ה עַ֚ל הֶ/עָרִ֣ים הַ/בְּצֻר֔וֹת וְ/עַ֖ל הַ/פִּנּ֥וֹת הַ/גְּבֹהֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/016.yaml
  text: a day of trumpet and battle cry against the fortified cities and against the high battlements[a][b].
translation:
  language: de
  text: ein Tag des Hornsignals und des Kriegsgeschreis gegen die befestigten Städte und gegen die hohen Mauerecken.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Tag des Hornsignals und des Alarmrufs“ beziehungsweise „ein Tag des Hornsignals und des Geschreis“. Das hebräische Wort kann einen lauten Ruf, ein Alarmsignal oder Kriegsgeschrei bezeichnen; wegen des Angriffs auf befestigte Städte ist hier die militärische Bedeutung wahrscheinlich.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die hohen Ecken“. Gemeint sind wahrscheinlich erhöhte Eckbereiche der Stadtmauern oder entsprechende Eckbefestigungen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹם
  choice: ein Tag des
  rationale: Setzt die Aufzählung der Kennzeichen des Tages des HERRN fort; die deutsche Form mit unbestimmtem Artikel ist natürlich und wahrt den aufzählenden Charakter.
- source_word: שׁוֹפָר
  choice: Hornsignal
  rationale: Das Schofar dient hier als Alarm- oder Kriegssignal. „Hornsignal“ gibt Funktion und Klang verständlich wieder, ohne das Instrument unnötig auf eine moderne Trompete festzulegen.
- source_word: תְרוּעָה
  choice: Kriegsgeschrei
  rationale: Das Wort kann lautes Rufen, einen Alarmruf oder Kriegsgeschrei bezeichnen. Der Zusammenhang mit befestigten Städten legt die militärische Bedeutung nahe, ohne die weiteren Möglichkeiten auszuschließen.
- source_word: עַל
  choice: gegen
  rationale: Im Zusammenhang eines feindlichen Angriffs gibt „gegen“ die adversative Bedeutung idiomatisch wieder.
- source_word: הֶעָרִים הַבְּצֻרוֹת
  choice: die befestigten Städte
  rationale: Direkte und natürliche Wiedergabe der Städte, die durch Verteidigungsanlagen gesichert sind.
- source_word: הַפִּנּוֹת הַגְּבֹהוֹת
  choice: die hohen Mauerecken
  rationale: „Ecken“ ist die formale Grundbedeutung; „Mauerecken“ macht im Belagerungskontext den Bezug auf erhöhte Eckbereiche der Stadtbefestigung verständlich, ohne spezifisch Türme vorauszusetzen.
theological_decisions: []
