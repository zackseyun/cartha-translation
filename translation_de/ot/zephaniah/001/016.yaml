  source_fidelity: Die Übersetzung gibt die Konstruktion und den militärisch-gerichtlichen Zusammenhang des Hebräischen zuverlässig wieder. „Hornsignal“ vermittelt die mit שׁוֹפָר verbundene Signalfunktion, ohne eine moderne Instrumentengattung festzulegen; „Kriegsgeschrei“ ist im Kontext für תְּרוּעָה gut begründet und wird durch die Anmerkung angemessen als nicht einzig mögliche Nuance ausgewiesen. „Gegen“ gibt עַל im Angriffskontext idiomatisch wieder. „Hohe Mauerecken“ bleibt nahe bei der Grundbedeutung von הַפִּנּוֹת und vermeidet eine nicht zwingende Festlegung auf Türme.
