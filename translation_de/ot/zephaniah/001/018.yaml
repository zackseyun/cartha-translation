source:
  edition: WLC
  text: גַּם כַּסְפָּ֨/ם גַּם זְהָבָ֜/ם לֹֽא יוּכַ֣ל לְ/הַצִּילָ֗/ם בְּ/יוֹם֙ עֶבְרַ֣ת יְהוָ֔ה וּ/בְ/אֵשׁ֙ קִנְאָת֔/וֹ תֵּאָכֵ֖ל כָּל הָ/אָ֑רֶץ כִּֽי כָלָ֤ה אַךְ נִבְהָלָה֙ יַֽעֲשֶׂ֔ה אֵ֥ת כָּל יֹשְׁבֵ֖י הָ/אָֽרֶץ־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/018.yaml
  text: Neither their silver nor their gold will be able to deliver them on the day of Yahweh’s wrath[a], and in the fire of his jealousy all the earth will be consumed; for he will make a complete, indeed sudden[c][b], end of all the inhabitants of the earth.
translation:
  language: de
  text: Weder ihr Silber noch ihr Gold wird sie am Tag des Zorns Jahwes retten können, und im Feuer seiner Eifersucht[b] wird die ganze Erde[a] verzehrt werden; denn er wird allen Bewohnern der Erde[a] ein völliges, ja jähes Ende[c] bereiten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das ganze Land“ und „allen Bewohnern des Landes“. Das hebräische אֶרֶץ kann sowohl „Land“ als auch „Erde“ bedeuten; wegen der umfassenden Gerichtssprache steht im Haupttext „Erde“.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „im Feuer seines Eifers“. Das hebräische Wort kann „Eifersucht“ oder „Eifer“ bedeuten.'
    reason: lexical_alternative
  - marker: c
    text: 'Die hebräische Wendung ist schwierig. Möglich sind auch: „ein völliges, schreckliches Ende“ oder „ein völliges Ende – ja, ein bestürzendes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם ... גַּם ... לֹא
  choice: Weder ... noch ...
  rationale: Die Verbindung der beiden גַּם mit der folgenden Verneinung wird im Deutschen idiomatisch und nachdrücklich mit „weder ... noch“ wiedergegeben.
- source_word: כַּסְפָּם ... זְהָבָם
  choice: ihr Silber ... ihr Gold
  rationale: Da Silber und Gold parallel stehen, sind die Edelmetalle und damit der Besitz gemeint, nicht lediglich Geld im abstrakten Sinn.
- source_word: יוּכַל לְהַצִּילָם
  choice: wird sie ... retten können
  rationale: Die Konstruktion bezeichnet die Unfähigkeit des Reichtums, seine Besitzer aus dem kommenden Gericht zu retten.
- source_word: בְּיוֹם עֶבְרַת יְהוָה
  choice: am Tag des Zorns Jahwes
  rationale: עֶבְרָה bezeichnet heftigen Zorn; der Gottesname wird in der im Deutschen gebräuchlichen Form „Jahwe“ wiedergegeben.
- source_word: וּבְאֵשׁ קִנְאָתוֹ
  choice: Im Feuer seiner Eifersucht
  rationale: קִנְאָה kann Eifersucht oder Eifer bedeuten. „Eifersucht“ bewahrt hier die relationale, auf ausschließliche Treue zielende Nuance.
- source_word: תֵּאָכֵל
  choice: wird ... verzehrt werden
  rationale: Die passive Form und das Feuerbild werden mit „verzehrt werden“ natürlich und genau wiedergegeben.
- source_word: כָּל הָאָרֶץ
  choice: die ganze Erde
  rationale: אֶרֶץ kann „Land“ oder „Erde“ bedeuten. Die umfassende Gerichtssprache legt im Haupttext „Erde“ nahe, während die engere Möglichkeit in der Fußnote erhalten bleibt.
- source_word: כָּלָה אַךְ נִבְהָלָה
  choice: ein vollständiges, ja jähes Ende
  rationale: כָּלָה bezeichnet ein vollständiges Ende; אַךְ verstärkt, und das schwierige נִבְהָלָה wird als Hinweis auf ein plötzlich hereinbrechendes, erschreckendes Ende verstanden.
- source_word: יַעֲשֶׂה אֵת כָּל יֹשְׁבֵי הָאָרֶץ
  choice: er wird allen Bewohnern der Erde ... ein Ende bereiten
  rationale: Die deutsche Wendung „jemandem ein Ende bereiten“ gibt die hebräische Konstruktion verständlich wieder, ohne ihren umfassenden Gerichtssinn abzuschwächen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. „Jahwe“ ist dessen übliche deutsche Wiedergabe und vermeidet die Ersetzung durch einen Titel.
- issue: Bedeutungsumfang von הָאָרֶץ
  choice: Erde, mit „Land“ als Fußnotenalternative
  alternative: Land
  rationale: Die wiederholte umfassende Formulierung begünstigt die globale Lesart, doch die mögliche Bezugnahme auf das Land bleibt sprachlich echt und wird nicht ausgeschlossen.
- issue: Bedeutung von קִנְאָה bei Gott
  choice: Eifersucht
  alternative: Eifer
  rationale: „Eifersucht“ erhält den Beziehungs- und Ausschließlichkeitsaspekt des prophetischen Gerichtsbildes; „Eifer“ bleibt lexikalisch möglich.
- issue: Deutung von נִבְהָלָה
  choice: jäh
  alternative: schrecklich; bestürzend
  rationale: Die Form und die gesamte Wendung sind schwierig. „Jäh“ bringt die wahrscheinlich adverbiale Bedeutung eines plötzlich eintretenden Endes zum Ausdruck, ohne die anderen Deutungen zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am prophetischen Hebräisch, wird jedoch für heutige Leser geglättet. „Jäh“ ist knapp und gehoben, aber allgemein verständlich; die echte Unsicherheit der schwierigen Schlusswendung wird in der Fußnote offengehalten.
