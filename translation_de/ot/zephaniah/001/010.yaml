  text: וְ/הָיָה֩ בַ/יּ֨וֹם הַ/ה֜וּא נְאֻם יְהוָ֗ה ק֤וֹל צְעָקָה֙ מִ/שַּׁ֣עַר הַ/דָּגִ֔ים וִֽ/ילָלָ֖ה מִן הַ/מִּשְׁנֶ֑ה וְ/שֶׁ֥בֶר גָּד֖וֹל מֵ/הַ/גְּבָעֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/010.yaml
  text: And on that day[a], declares Yahweh, there will be the sound of a cry from the Fish Gate, and a wail from the Second Quarter[c][b], and a great crash from the hills.
translation:
  language: de
  text: Und an jenem Tag – Spruch Jahwes – wird vom Fischtor her der Schall eines Aufschreis zu hören sein, aus dem zweiten Stadtviertel Wehklagen und von den Hügeln her gewaltiges Krachen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה
  choice: wird … zu hören sein
  rationale: Die hebräische Geschehensformel leitet die angekündigte Situation ein. Zusammen mit den folgenden Lautbezeichnungen ergibt die deutsche Konstruktion eine natürliche und zugleich quellennah formulierte Aussage.
- source_word: בַיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Bewahrt die geläufige prophetische Zeitformel und ihren Bezug auf den angekündigten Gerichtstag.
- source_word: נְאֻם יְהוָה
  choice: Spruch Jahwes
  rationale: Eine knappe, würdevolle Wiedergabe der prophetischen Botenformel; sie kennzeichnet das Folgende als göttlichen Ausspruch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text ausdrücklich stehenden Gottesnamen wieder.
- source_word: קוֹל צְעָקָה
  choice: lautes Geschrei
  rationale: קוֹל bezeichnet hier den hörbaren Laut, צְעָקָה einen Not- oder Hilferuf. Die Formulierung ist im Deutschen natürlicher als das wörtliche „Stimme eines Geschreis“, ohne den akustischen Nachdruck einzuebnen.
- source_word: מִשַּׁעַר הַדָּגִים
  choice: vom Fischtor her
  rationale: Behandelt die Bezeichnung als Namen eines bekannten Jerusalemer Tores und gibt die Herkunft des Schalls idiomatisch wieder.
- source_word: וִילָלָה
  choice: Wehklagen
  rationale: Bezeichnet lautes Klagen in Not und passt zum poetischen Parallelismus des Verses.
- source_word: מִן הַמִּשְׁנֶה
  choice: aus dem Zweiten Stadtviertel
  rationale: מִשְׁנֶה bezeichnet hier wahrscheinlich einen bestimmten Jerusalemer Stadtbezirk. „Zweites Stadtviertel“ wahrt die Bedeutung des Namens, ohne die Identifikation stärker festzulegen, als der Text erlaubt.
- source_word: וְשֶׁבֶר גָּדוֹל
  choice: gewaltiges Krachen
  rationale: שֶׁבֶר kann Bruch, Zusammenbruch oder Verderben bezeichnen. Im Zusammenhang mit Geschrei und Wehklagen wird die akustische Seite mit „Krachen“ hervorgehoben, während eine Fußnote die weitere Bedeutungsbreite wahrt.
- source_word: מֵהַגְּבָעוֹת
  choice: von den Hügeln her
  rationale: Gibt den gewöhnlichen Sinn von גְּבָעוֹת wieder und lässt offen, ob Anhöhen innerhalb Jerusalems oder der Umgebung gemeint sind.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen יהוה. „Jahwe“ bewahrt diesen unmittelbaren Namensgebrauch, statt ihn durch einen Titel zu ersetzen.
- issue: Deutung von שֶׁבֶר im Gerichtskontext
  choice: Krachen
  alternative: Zerstörung / Zusammenbruch
  rationale: 'Die Reihe besteht aus wahrnehmbaren Lauten: Geschrei, Wehklagen und שֶׁבֶר. Daher ist die akustische Wiedergabe im Haupttext wahrscheinlich, doch die mögliche Aussage von Zerstörung oder Zusammenbruch bleibt in der Fußnote ausdrücklich erhalten.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetischem Sprachklang. Die dreigliedrige Folge der aus verschiedenen Richtungen kommenden Geräusche bleibt erhalten; ungewöhnliche Orts- und Bedeutungsfragen werden knapp in Fußnoten erläutert.
