  source_fidelity: 'Der Text gibt die Abfolge und Bildsprache des Hebräischen präzise wieder: Schweigegebot vor אֲדֹנָי יְהוִה, Nähe des Tages Jahwes, das bereitete Schlachtopfer und die geweihten bzw. ausgesonderten Geladenen. Die knappen Hauptsätze entsprechen dem nachdrücklichen prophetischen Duktus. „Schlachtopfer“ ist für זֶבַח vertretbar und bewahrt sowohl den kultischen Bezug als auch die bedrohliche Bilddimension.'
  naturalness: „Still vor dem Herrn Jahwe!“ ist als feierlicher, prophetischer Ausruf im modernen Standarddeutsch natürlich und eindringlich. „Der Tag Jahwes ist nahe“ sowie „hat ... bereitet“ sind idiomatisch. „seine Geladenen“ ist eine verständliche nominalisierte Form mit angemessen gehobenem Register.
  terminology: „Jahwe“ wird konsequent wiedergegeben; „der Herr Jahwe“ erhält beide Bestandteile von אֲדֹנָי יְהוִה ohne eine künstliche deutsche Titelverdoppelung. „Geweiht“ gibt הִקְדִּישׁ im kultischen Zusammenhang gut wieder. Die Fußnote dokumentiert die lexikalische Offenheit von קְרֻאָיו und kennzeichnet die Kontextdeutung vorsichtig, ohne sie in den Haupttext einzutragen.
