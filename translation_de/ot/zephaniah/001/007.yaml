source:
  edition: WLC
  text: הַ֕ס מִ/פְּנֵ֖י אֲדֹנָ֣/י יְהוִ֑ה כִּ֤י קָרוֹב֙ י֣וֹם יְהוָ֔ה כִּֽי הֵכִ֧ין יְהוָ֛ה זֶ֖בַח הִקְדִּ֥ישׁ קְרֻאָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/007.yaml
  text: Be silent before the Lord GOD[a], for the day of Yahweh is near; for Yahweh has prepared a sacrifice; he has consecrated his invited ones.
translation:
  language: de
  text: Still vor dem Herrn Jahwe! Denn der Tag Jahwes ist nahe. Jahwe hat ein Schlachtopfer bereitet; er hat seine Geladenen[a] geweiht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Gäste“, „die von ihm Herbeigerufenen“ oder „die von ihm Berufenen“. Im Zusammenhang sind wahrscheinlich diejenigen gemeint, die Jahwe zum Opfergericht herbeigerufen hat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַס
  choice: Still!
  rationale: Die Interjektion fordert mit feierlichem Nachdruck zum Schweigen auf. „Still!“ ist im Deutschen knapp und eindringlich, ohne die Wendung als bloße Aufforderung zur inneren Ruhe misszuverstehen.
- source_word: מִפְּנֵי
  choice: vor
  rationale: In Verbindung mit dem Schweigegebot bezeichnet die Präposition das Verhalten in der Gegenwart Gottes; „vor“ ist knapp und idiomatisch.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  rationale: Die Wiedergabe bewahrt sowohl den Titel אֲדֹנָי als auch den persönlichen Gottesnamen יְהוִה und vermeidet die im Deutschen schwer verständliche Verdoppelung „Herr HERR“.
- source_word: כִּי
  choice: denn
  rationale: Das erste כִּי begründet das Schweigegebot. Beim zweiten wird der begründende Zusammenhang durch einen neuen Hauptsatz natürlich fortgeführt, ohne ein weiteres „denn“ erzwingen zu müssen.
- source_word: קָרוֹב
  choice: ist nahe
  rationale: Die prädikative Wendung bezeichnet die unmittelbar bevorstehende Nähe des angekündigten Tages und erhält die prophetische Dringlichkeit.
- source_word: יוֹם יְהוָה
  choice: der Tag Jahwes
  rationale: Die feststehende prophetische Wendung bleibt erkennbar und enthält den Gottesnamen ausdrücklich.
- source_word: הֵכִין
  choice: hat bereitet
  rationale: Das Perfekt stellt die Vorbereitung als vollzogen beziehungsweise gewiss dar. „Bereitet“ passt zum kultischen Bild und zum gehobenen prophetischen Ton.
- source_word: זֶבַח
  choice: ein Schlachtopfer
  rationale: „Schlachtopfer“ gibt den kultischen Begriff genauer wieder als das allgemeinere „Opfer“ und lässt zugleich die bedrohliche Gerichtssymbolik hörbar werden, ohne sie auszudeuten.
- source_word: הִקְדִּישׁ
  choice: hat geweiht
  rationale: Das Verb bezeichnet ein Heiligen oder Aussondern. „Geweiht“ bewahrt hier den kultischen Bezug zum Schlachtopfer und klingt im modernen Deutschen natürlicher als „konsekriert“.
- source_word: קְרֻאָיו
  choice: seine Geladenen
  rationale: Das passive Partizip kann Eingeladene oder Herbeigerufene bezeichnen. „Geladene“ erhält das Bild eines Opfermahls, ohne ihre genaue Rolle im Gerichtsgeschehen festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: 'Jahwe; in der Verbindung אֲדֹנָי יְהוִה: „der Herr Jahwe“'
  alternative: „der HERR“ beziehungsweise „Gott, der HERR“
  rationale: Der persönliche Gottesname wird ausdrücklich wiedergegeben. Zugleich bleibt in der zusammengesetzten Anrede der Titel אֲדֹנָי erhalten.
- issue: Deutung des Opferbildes
  choice: Das Bild vom bereiteten Schlachtopfer und den geweihten Geladenen bleibt im Haupttext unausgedeutet.
  alternative: Das Schlachtopfer ausdrücklich mit der Tötung Judas und die Geladenen ausdrücklich mit fremden Vollstreckern des Gerichts gleichsetzen.
  rationale: Der hebräische Text benennt weder das Opfer noch die genaue Rolle der Geladenen ausdrücklich. Die knappe Bildsprache bewahrt daher ihre beabsichtigte Spannung; mögliche kontextuelle Deutungen gehören in die Anmerkung.
translation_notes:
  register: Knappes, feierliches prophetisches Deutsch mit kultischem Wortschatz. Die kurzen Sätze bewahren den eindringlichen Rhythmus des Hebräischen. Der Fußnotenmarker steht unmittelbar bei der mehrdeutigen Wendung „seine Geladenen“.
