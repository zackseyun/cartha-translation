    issue: Ungebräuchliche Wiedergabe von עֲרָפֶל als »Wolkendunkel«
    rationale: »Wolkendunkel« ist im modernen Standarddeutsch kaum idiomatisch. עֲרָפֶל bezeichnet in diesem Kontext dichtes bzw. tiefes Dunkel und kann daneben die Nuance einer dunklen Wolke tragen. »dichtes Dunkel« ist die sichere Hauptwiedergabe; die Wolkennuance kann in einer Fußnote stehen.
