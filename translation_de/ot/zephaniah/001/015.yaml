  text: י֥וֹם עֶבְרָ֖ה הַ/יּ֣וֹם הַ/ה֑וּא י֧וֹם צָרָ֣ה וּ/מְצוּקָ֗ה י֤וֹם שֹׁאָה֙ וּ/מְשׁוֹאָ֔ה י֥וֹם חֹ֨שֶׁךְ֙ וַ/אֲפֵלָ֔ה י֥וֹם עָנָ֖ן וַ/עֲרָפֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/015.yaml
  text: That day is a day of wrath[a], a day of distress and anguish, a day of ruin and devastation, a day of darkness and gloom[c][b], a day of clouds and thick darkness.
translation:
  language: de
  text: 'Ein Tag des Zorns[a] ist jener Tag,

    ein Tag der Not und Bedrängnis,

    ein Tag der Verheerung und Verwüstung,

    ein Tag der Finsternis und des Dunkels,

    ein Tag der Wolken und des dichten Dunkels.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »des Grimms«.'
    reason: lexical_alternative
  - marker: b
    text: »Dichtes Dunkel« kann auch als »dunkle Wolke« verstanden werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: י֥וֹם עֶבְרָ֖ה הַ/יּ֣וֹם הַ/ה֑וּא
  choice: Ein Tag des Zorns ist jener Tag
  rationale: Die Wortstellung bewahrt sowohl die emphatische Voranstellung des »Tages des Zorns« als auch den rückverweisenden Ausdruck »jener Tag«. עֶבְרָה bezeichnet hier heftigen, überströmenden Zorn.
- source_word: י֧וֹם צָרָ֣ה וּ/מְצוּקָ֗ה
  choice: ein Tag der Not und Bedrängnis
  rationale: צָרָה bezeichnet Not oder Bedrängnis; מְצוּקָה hebt Enge und bedrückenden Druck hervor. Die gewählte Paarung ist natürlich, gewichtig und erhält den Parallelismus.
- source_word: י֤וֹם שֹׁאָה֙ וּ/מְשׁוֹאָ֔ה
  choice: ein Tag der Verheerung und Verwüstung
  rationale: Die eng verwandten Substantive häufen Bilder katastrophaler Zerstörung. Zwei nahe, aber nicht identische deutsche Begriffe erhalten diese poetische Steigerung.
- source_word: י֥וֹם חֹ֨שֶׁךְ֙ וַ/אֲפֵלָ֔ה
  choice: ein Tag der Finsternis und des Dunkels
  rationale: חֹשֶׁךְ ist Finsternis; אֲפֵלָה bezeichnet tiefes Dunkel. Die substantivische Form wahrt die knappe poetische Reihung.
- source_word: י֥וֹם עָנָ֖ן וַ/עֲרָפֶֽל
  choice: ein Tag des Gewölks und des Wolkendunkels
  rationale: עָנָן steht im Singular und bezeichnet Wolke beziehungsweise Gewölk; עֲרָפֶל kann dichtes Dunkel oder dunkles Wolkendunkel meinen. Die Formulierung bewahrt das Wetter- und Dunkelheitsbild.
theological_decisions:
- issue: Bezug des prophetischen »Tages«
  choice: Die wiederholte Struktur »ein Tag …« bleibt ohne zeitliche Eingrenzung erhalten.
  alternative: Den Vers ausschließlich auf ein geschichtliches Gericht über Juda oder ausschließlich auf das endzeitliche Gericht beziehen.
  rationale: Der hebräische Vers beschreibt den Tag des Gerichts durch eine poetische Häufung, legt hier aber nicht fest, ob sein Bezug ausschließlich zeitgeschichtlich, typologisch oder endgültig ist.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit bewusst erhaltener fünfgliedriger Wiederholung. Die Zeilenform macht den hebräischen Parallelismus und die zunehmende Verdichtung der Gerichtsbilder sichtbar.
