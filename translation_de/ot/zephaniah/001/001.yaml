id: ZEP.1.1
reference: Zephaniah 1:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: דְּבַר יְהוָ֣ה אֲשֶׁ֣ר הָיָ֗ה אֶל צְפַנְיָה֙ בֶּן כּוּשִׁ֣י בֶן גְּדַלְיָ֔ה בֶּן אֲמַרְיָ֖ה בֶּן חִזְקִיָּ֑ה בִּ/ימֵ֛י יֹאשִׁיָּ֥הוּ בֶן אָמ֖וֹן מֶ֥לֶךְ יְהוּדָֽה־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/001.yaml
  text: 'The word of Yahweh that came to Zephaniah son of Cushi[a], son of Gedaliah, son of Amariah, son of Hezekiah, in the days of Josiah son of Amon[b], king of Judah:'
translation:
  language: de
  text: 'Das Wort Jahwes, das an Zefanja erging, dem Sohn Kuschis[a], des Sohnes Gedaljas, des Sohnes Amarjas, des Sohnes Hiskias[b], in den Tagen Josias, des Sohnes Amons, des Königs von Juda:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kuschi kann auch als „Kuschit“ verstanden werden; hier wird das Wort innerhalb des Stammbaums als Personenname wiedergegeben.
    reason: lexical_alternative
  - marker: b
    text: Mit Hiskia könnte König Hiskia gemeint sein. Dann wäre Zefanja königlicher Abstammung; der Text selbst bezeichnet diesen Hiskia jedoch nicht ausdrücklich als König.
    reason: cross_reference
lexical_decisions:
- source_word: דְּבַר
  choice: Wort
  rationale: Bewahrt die feste prophetische Überschriftsformel דְּבַר־יְהוָה; „Botschaft“ wäre sinngemäß möglich, würde aber den formelhaften Wortlaut weniger deutlich wiedergeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als im Deutschen geläufige Form von JHWH wieder, statt ihn durch den Titel „der HERR“ zu ersetzen.
- source_word: אֲשֶׁר הָיָה אֶל
  choice: das an … erging
  rationale: „An jemanden ergehen“ ist eine natürliche, würdige deutsche Wiedergabe der üblichen prophetischen Formel und drückt aus, dass Zefanja das Wort empfing.
- source_word: צְפַנְיָה
  choice: Zefanja
  rationale: Verwendet die etablierte deutsche Namensform.
- source_word: בֶּן
  choice: Sohn / des Sohnes
  rationale: Die wiederholte Abstammungsformel wird als direkte Sohn-Vater-Folge wiedergegeben, ohne mögliche ausgelassene Generationen interpretierend einzutragen.
- source_word: כּוּשִׁי
  choice: Kuschi
  rationale: Im Stammbaum liegt die Auffassung als Personenname nahe; die mögliche Bedeutung „Kuschit“ wird in einer Fußnote bewahrt.
- source_word: גְּדַלְיָה
  choice: Gedalja
  rationale: Etablierte deutsche Form des Personennamens.
- source_word: אֲמַרְיָה
  choice: Amarja
  rationale: Etablierte deutsche Form des Personennamens.
- source_word: חִזְקִיָּה
  choice: Hiskia
  rationale: Etablierte deutsche Namensform; der Haupttext setzt die Person nicht ausdrücklich mit König Hiskia gleich.
- source_word: בִּימֵי
  choice: in den Tagen
  rationale: Gibt den hebräischen Zeitausdruck eng wieder und bleibt im Deutschen verständlich; „zur Zeit“ wäre idiomatischer, aber weniger formnah.
- source_word: יֹאשִׁיָּהוּ
  choice: Josia
  rationale: Etablierte deutsche Namensform des Königs.
- source_word: אָמֹון
  choice: Amon
  rationale: Etablierte deutsche Form des Personennamens.
- source_word: מֶלֶךְ יְהוּדָה
  choice: König von Juda
  rationale: Natürliche deutsche Wiedergabe des königlichen Titels und Herrschaftsgebiets.
theological_decisions:
- issue: Mögliche Gleichsetzung von חִזְקִיָּה mit König Hiskia
  choice: Im Haupttext steht lediglich „Hiskia“; die mögliche Identifizierung mit dem König erscheint nur in einer Fußnote.
  alternative: „König Hiskia“ in den Haupttext setzen und damit Zefanjas königliche Abstammung ausdrücklich behaupten.
  rationale: Der hebräische Text nennt zwar Hiskia, versieht ihn hier aber nicht mit dem Königstitel. Die historisch plausible Gleichsetzung darf daher nicht als sicher in den Haupttext aufgenommen werden.
- issue: Deutung von כּוּשִׁי als Name oder Herkunftsbezeichnung
  choice: Als Personenname „Kuschi“ im genealogischen Zusammenhang.
  alternative: Als Herkunfts- oder Volksbezeichnung „der Kuschit“.
  rationale: Die Stellung nach בֶּן innerhalb einer durchgehenden Namensreihe spricht für einen Personennamen, ohne die lexikalisch mögliche andere Deutung auszuschließen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit bewahrter prophetischer Überschriftsformel. Die deutschen biblischen Namensformen sorgen für Vertrautheit; „in den Tagen“ hält bewusst eine leicht feierliche, aber verständliche Nähe zum Hebräischen.
