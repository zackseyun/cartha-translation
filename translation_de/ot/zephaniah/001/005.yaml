  text: וְ/אֶת הַ/מִּשְׁתַּחֲוִ֥ים עַל הַ/גַּגּ֖וֹת לִ/צְבָ֣א הַ/שָּׁמָ֑יִם וְ/אֶת הַ/מִּֽשְׁתַּחֲוִים֙ הַ/נִּשְׁבָּעִ֣ים לַֽ/יהוָ֔ה וְ/הַ/נִּשְׁבָּעִ֖ים בְּ/מַלְכָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/005.yaml
  text: those who bow down on the rooftops to the host of heaven[a], and those who bow down, who swear by Yahweh and swear by Milcom.
translation:
  language: de
  text: und die, die sich auf den Dächern vor dem Heer des Himmels niederwerfen, und die, die sich niederwerfen, Jahwe einen Eid schwören und bei Milkom[a] schwören.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bei ihrem König«; manche verstehen den Namen hier als »Moloch«.'
    reason: Die hebräische Form מַלְכָּם kann als Gottesname Milkom oder als »ihr König« verstanden werden; außerdem besteht eine traditionelle Verbindung zu Moloch.
lexical_decisions:
- source_word: הַמִּשְׁתַּחֲוִים
  choice: die, die sich … niederwerfen
  rationale: Das Partizip von שׁחה bezeichnet ein körperliches Niederwerfen als Ausdruck der Verehrung. Die Formulierung bewahrt sowohl die konkrete Handlung als auch ihren kultischen Sinn.
- source_word: עַל הַגַּגּוֹת
  choice: auf den Dächern
  rationale: Die schlichte Ortsangabe wird natürlich und kulturgeschichtlich unverändert wiedergegeben.
- source_word: לִצְבָא הַשָּׁמַיִם
  choice: vor dem Heer des Himmels
  rationale: צְבָא הַשָּׁמַיִם bezeichnet die Gesamtheit der Himmelskörper beziehungsweise als Mächte verehrten Himmelserscheinungen. „Heer des Himmels“ wahrt das Bild des Hebräischen; „vor“ verbindet sich im Deutschen natürlich mit „sich niederwerfen“.
- source_word: הַנִּשְׁבָּעִים לַיהוָה
  choice: bei Jahwe schwören
  rationale: נשׁבע mit ל bezeichnet hier einen Schwur unter Berufung auf beziehungsweise in Bindung an Jahwe. „Bei Jahwe schwören“ entspricht zugleich der parallelen Konstruktion mit בְּמַלְכָּם.
- source_word: יהוה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben, sodass die im Vers beanstandete doppelte kultische Loyalität deutlich bleibt.
- source_word: בְּמַלְכָּם
  choice: bei Milkom
  rationale: Im polemischen Zusammenhang liegt die Deutung als Name der ammonitischen Gottheit Milkom nahe. Die Konsonanten und die masoretische Vokalisierung ermöglichen jedoch auch „bei ihrem König“; diese echte Unsicherheit wird in der Fußnote bewahrt.
theological_decisions:
- issue: Identität von מַלְכָּם
  choice: Milkom als fremde Gottheit im Haupttext
  alternative: „ihr König“; teilweise wird der Ausdruck auf „Moloch“ bezogen
  rationale: Die Parallelität zweier Schwurformeln und die Verurteilung synkretistischer Verehrung sprechen für einen fremden Gott als zweiten Loyalitätsbezug. Da die hebräische Form auch appellativ verstanden werden kann und traditionell mit Moloch verbunden wurde, werden die Alternativen nicht verschwiegen.
- issue: Verhältnis der beiden Schwüre
  choice: „zugleich aber“ macht die synkretistische Verbindung deutlich
  alternative: bloßes „und“
  rationale: Das Hebräische verbindet beide Partizipialgruppen mit וְ. Im Kontext bezeichnet dies dieselben Verehrer mit konkurrierenden Bindungen; „zugleich aber“ gibt diesen Gegensatz idiomatisch wieder, ohne die beiden Schwüre voneinander zu trennen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „die, die sich niederwerfen“ bildet die hebräische Wiederaufnahme bewusst ab. „Heer des Himmels“ wahrt das Quellbild, während „vor … niederwerfen“ im Deutschen natürlicher ist als eine wörtliche Wiedergabe der hebräischen Präposition.
