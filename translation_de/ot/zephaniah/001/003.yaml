  variant: modern standard German
source:
  edition: WLC
  text: אָסֵ֨ף אָדָ֜ם וּ/בְהֵמָ֗ה אָסֵ֤ף עוֹף הַ/שָּׁמַ֨יִם֙ וּ/דְגֵ֣י הַ/יָּ֔ם וְ/הַ/מַּכְשֵׁל֖וֹת אֶת הָ/רְשָׁעִ֑ים וְ/הִכְרַתִּ֣י אֶת הָ/אָדָ֗ם מֵ/עַ֛ל פְּנֵ֥י הָ/אֲדָמָ֖ה נְאֻם יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/003.yaml
  text: I will sweep away man and beast[a]; I will sweep away the birds of the heavens and the fish of the sea, and the stumbling blocks with the wicked[d][c][b]. And I will cut off man from the face of the ground,” declares Yahweh.
translation:
  language: de
  text: »Ich werde Menschen und Vieh hinwegraffen[a]; ich werde die Vögel des Himmels[b] und die Fische des Meeres hinwegraffen und die Stolpersteine[c] samt den Frevlern. Und ich werde die Menschen vom Angesicht des Erdbodens[d] ausrotten«, spricht Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Menschheit und die Tiere«. Das hebräische Wort für »Mensch« wird hier kollektiv gebraucht.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »die Vögel des Himmelsraums« beziehungsweise »des Himmels« im Sinn des Luftraums.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich auch: »die Ursachen des Strauchelns«. Gemeint sein können Dinge, die zu Fall oder zum Fehltritt führen; die genaue Beziehung zu den Frevlern bleibt im Hebräischen knapp und mehrdeutig.'
    reason: lexical_and_syntactic_ambiguity
  - marker: d
    text: 'Oder: »von der Oberfläche der Erde«. »Erdboden« kann bewusst an frühere Schöpfungs- und Gerichtssprache erinnern.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָסֵף
  choice: hinwegraffen
  rationale: Im Gerichtszusammenhang bezeichnet das Hifil hier ein umfassendes Beseitigen, nicht ein neutrales Sammeln. »Hinwegraffen« bewahrt die Wucht und lässt sich in der Wiederholung natürlich verwenden.
- source_word: אָדָם / הָאָדָם
  choice: Mensch / den Menschen
  rationale: אָדָם wird kollektiv für die Menschheit gebraucht. Der deutsche Singular bewahrt die knappe, repräsentative Ausdrucksweise des Hebräischen.
- source_word: בְהֵמָה
  choice: Vieh
  rationale: »Vieh« ist eine natürliche deutsche Sammelbezeichnung für Landtiere im Gegenüber zu Mensch, Vögeln und Fischen; der Kontext muss sie nicht auf Nutztiere verengen.
- source_word: עוֹף הַשָּׁמַיִם
  choice: die Vögel des Himmels
  rationale: Die formnahe Wendung bewahrt den Anklang an die Schöpfungsordnung und den gehobenen prophetischen Ton.
- source_word: דְגֵי הַיָּם
  choice: die Fische des Meeres
  rationale: Direkte Wiedergabe der hebräischen Genitivverbindung und des Bereichs Meer.
- source_word: הַמַּכְשֵׁלוֹת
  choice: die Stolpersteine
  rationale: Das Wort bezeichnet Dinge oder Ursachen, die zum Straucheln beziehungsweise zu Fall bringen. »Stolpersteine« ist anschaulich und lässt offen, worauf der Ausdruck im Gerichtskontext konkret zielt.
- source_word: אֶת הָרְשָׁעִים
  choice: samt den Frevlern
  rationale: Die gedrängte Syntax verbindet die Frevler mit den Stolpersteinen, ohne das genaue Verhältnis eindeutig festzulegen. »Samt« gibt die gemeinsame Einbeziehung in das Gericht wieder, ohne eine Apposition zu behaupten.
- source_word: וְהִכְרַתִּי
  choice: Und ich werde … ausrotten
  rationale: Das Hifil von כרת bezeichnet hier vernichtendes Abschneiden im Gericht. »Ausrotten« gibt diese idiomatische Wirkung im Deutschen klar wieder.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: vom Angesicht des Erdbodens
  rationale: Die formnahe Wiedergabe erhält sowohl das hebräische Bild als auch den möglichen Anklang an frühere Schöpfungs- und Gerichtssprache.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: »Spricht« ist eine würdevolle, geläufige Wiedergabe der prophetischen Botenformel; der Gottesname wird als »Jahwe« wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Quelltext nennt das Tetragramm ausdrücklich. »Jahwe« gibt den persönlichen Bundesnamen in der im Deutschen üblichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Kollektiver Sinn von אָדָם
  choice: Mensch / den Menschen
  alternative: die Menschheit
  rationale: Der kollektive Sinn bleibt erkennbar, während der Singular die wiederholte Ausdrucksweise und die Spannung zwischen dem einzelnen Wort »Mensch« und seiner umfassenden Reichweite bewahrt.
- issue: Verhältnis von הַמַּכְשֵׁלוֹת zu אֶת הָרְשָׁעִים
  choice: die Stolpersteine samt den Frevlern
  alternative: die Stolpersteine, nämlich die Frevler
  rationale: Die hebräische Konstruktion ist gedrängt und lässt Koordination oder eine engere erklärende Beziehung erwägen. Die Übersetzung legt sie nicht appositionell fest, sondern bewahrt die gemeinsame Einbeziehung in das Gericht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetischer Wucht. Die Wiederholung von »hinwegraffen« bildet die hebräische Wiederholung nach. Formnahe Wendungen wie »Vögel des Himmels« und »Angesicht des Erdbodens« erhalten die Schöpfungs- und Gerichtsklänge, während die schwierige Verbindung von »Stolpersteinen« und »Frevlern« nicht dogmatisch aufgelöst wird.
