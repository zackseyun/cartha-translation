id: ZEP.1.8
reference: Zephaniah 1:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הָיָ֗ה בְּ/יוֹם֙ זֶ֣בַח יְהוָ֔ה וּ/פָקַדְתִּ֥י עַל הַ/שָּׂרִ֖ים וְ/עַל בְּנֵ֣י הַ/מֶּ֑לֶךְ וְ/עַ֥ל כָּל הַ/לֹּבְשִׁ֖ים מַלְבּ֥וּשׁ נָכְרִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/008.yaml
  text: And on the day of Yahweh’s sacrifice[a], I will punish the officials, the king’s sons[c][b], and all who wear foreign clothing.
translation:
  language: de
  text: 'Und es wird geschehen: Am Tag des Schlachtopfers Jahwes[a] werde ich die Amtsträger[b], die Söhne des Königs und alle bestrafen, die fremdländische Kleidung tragen[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „des Opfers Jahwes“. Im Zusammenhang kann die Wendung zudem an ein von Jahwe zum Gericht bereitetes Opfermahl denken lassen (vgl. Zefanja 1,7).'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Obersten“, „die Fürsten“ beziehungsweise „die Herrschenden“.'
    reason: lexical_alternative
  - marker: c
    text: Gemeint ist Kleidung, die mit fremden Völkern verbunden ist. Die Wendung kann über die Kleidung hinaus auf die Übernahme fremder Bräuche oder Loyalitäten hinweisen.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: Und es wird geschehen
  rationale: Die prophetische Zukunftsformel wird ausdrücklich wiedergegeben; der Doppelpunkt leitet die zeitliche Bestimmung und die angekündigte Handlung natürlich ein.
- source_word: בְּיוֹם
  choice: Am Tag
  rationale: Dies ist die natürliche deutsche Wiedergabe der temporalen Präpositionalverbindung und bewahrt den prophetischen Zeitpunkt.
- source_word: זֶבַח יְהוָה
  choice: Schlachtopfer Jahwes
  rationale: 'Die Constructusverbindung bleibt knapp und formal offen: Sie kann das Jahwe gehörende beziehungsweise von ihm bereitete Opfer bezeichnen; eine Festmahl-Deutung wird nicht in den Haupttext eingetragen.'
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in der im Deutschen geläufigen Transliteration wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וּפָקַדְתִּי עַל
  choice: werde ich ... bestrafen
  rationale: פקד mit עַל bezeichnet in diesem Gerichtskontext ein strafendes Einschreiten. „Bestrafen“ ist klar, gegenwärtig und weniger altertümlich als „heimsuchen“.
- source_word: הַשָּׂרִים
  choice: die Amtsträger
  rationale: שׂרים bezeichnet hochgestellte politische oder staatliche Funktionsträger. „Amtsträger“ vermeidet hier eine Verwechslung mit den unmittelbar danach genannten Königssöhnen.
- source_word: בְּנֵי הַמֶּלֶךְ
  choice: die Söhne des Königs
  rationale: Die Constructusverbindung wird genau wiedergegeben; „Söhne“ bewahrt die ausdrücklich maskuline Familienbezeichnung.
- source_word: כָּל הַלֹּבְשִׁים
  choice: alle ..., die ... tragen
  rationale: Die substantivierte Partizipialform wird in natürlichem Deutsch als Relativsatz wiedergegeben.
- source_word: מַלְבּוּשׁ נָכְרִי
  choice: fremdländische Kleidung
  rationale: Die Formulierung bezeichnet Kleidung, die mit fremden Völkern verbunden ist. „Fremdländisch“ bringt diesen Bezug deutlicher zum Ausdruck als das mehrdeutige „fremd“, ohne die möglichen kulturellen oder politischen Implikationen in den Haupttext einzubauen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den persönlichen Gottesnamen; die deutsche Schreibweise ist gegenüber dem englischen „Yahweh“ idiomatisch.
- issue: Bedeutung von זֶבַח יְהוָה
  choice: Schlachtopfer Jahwes
  alternative: das von Jahwe bereitete Opfermahl
  rationale: Die knappe Genitivverbindung lässt die genaue Beziehung offen. Der Kontext von Zefanja 1,7 kann ein von Jahwe bereitetes Opfer beziehungsweise Opfermahl im Gericht nahelegen, doch diese Deutung wird nicht vereindeutigend in den Haupttext aufgenommen.
- issue: Bedeutung der fremdländischen Kleidung
  choice: wörtliche Bezeichnung im Haupttext, mögliche symbolische Tragweite in der Fußnote
  alternative: Menschen, die fremde Bräuche und Loyalitäten übernommen haben
  rationale: Der Wortlaut nennt Kleidung. Eine Verbindung mit der Übernahme fremder Sitten, religiöser Praktiken oder politischer Loyalitäten ist möglich, aber nicht so eindeutig, dass sie die konkrete Bildsprache ersetzen sollte.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die Zukunftsformel des Hebräischen bleibt sichtbar. „Schlachtopfer“ bewahrt den kultischen Charakter von זֶבַח, während die Fußnote die im Kontext mögliche Mahl- und Gerichtsdimension nennt. Die Fußnotenmarker stehen jeweils unmittelbar bei der erläuterten Wendung.
