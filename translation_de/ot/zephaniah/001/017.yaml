  text: וַ/הֲצֵרֹ֣תִי לָ/אָדָ֗ם וְ/הָֽלְכוּ֙ כַּֽ/עִוְרִ֔ים כִּ֥י לַֽ/יהוָ֖ה חָטָ֑אוּ וְ/שֻׁפַּ֤ךְ דָּמָ/ם֙ כֶּֽ/עָפָ֔ר וּ/לְחֻמָ֖/ם כַּ/גְּלָלִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/017.yaml
  text: And I will bring distress on mankind[a], and they will walk like the blind, because they have sinned against Yahweh; their blood will be poured out like dust[b], and their flesh like dung.
translation:
  language: de
  text: Und ich werde die Menschen[a] in Bedrängnis bringen; sie werden wie Blinde umhergehen, denn gegen Jahwe haben sie gesündigt. Ihr Blut wird wie Staub ausgeschüttet werden und ihr Fleisch[b] wie Kot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Hebräischen der Singular „der Mensch“; das Wort ist hier kollektiv gemeint.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihre Eingeweide“ beziehungsweise „ihre Gedärme“. Die genaue Bedeutung des hebräischen Wortes ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲצֵרֹתִי
  choice: ich werde … in Bedrängnis bringen
  rationale: Die Kausativform von צרר bezeichnet, dass jemand in Bedrängnis oder Enge gebracht wird. Die Wendung wahrt sowohl Gottes Handeln als auch den Gerichtston.
- source_word: לָאָדָם
  choice: die Menschen
  rationale: אָדָם steht im Hebräischen im Singular, ist hier aber kollektiv gebraucht. „Die Menschen“ gibt diesen umfassenden Sinn in natürlichem modernem Deutsch wieder.
- source_word: וְהָלְכוּ כַּעִוְרִים
  choice: sie werden wie Blinde umhergehen
  rationale: „Umhergehen“ bewahrt das konkrete Bild von Menschen, die sich orientierungslos bewegen; „wie Blinde“ entspricht dem Vergleich des Ausgangstextes.
- source_word: כִּי לַיהוָה חָטָאוּ
  choice: denn gegen Jahwe haben sie gesündigt
  rationale: כִּי begründet das Gericht, und חטא mit ל bezeichnet hier das Sündigen gegen Jahwe. Die Wortstellung hebt in natürlichem Deutsch den Betroffenen hervor.
- source_word: וְשֻׁפַּךְ דָּמָם כֶּעָפָר
  choice: Ihr Blut wird wie Staub ausgeschüttet werden
  rationale: Die passive Form und das drastische Gerichtsbild bleiben erhalten. „Staub“ ist die naheliegende Entsprechung für עָפָר.
- source_word: וּלְחֻמָם
  choice: ihr Fleisch
  rationale: Das seltene Wort ist in diesem Zusammenhang unsicher. „Fleisch“ passt zum Parallelismus mit „Blut“, während die anatomisch spezifischeren Deutungen in der Fußnote erhalten bleiben.
- source_word: כַּגְּלָלִים
  choice: wie Kot
  rationale: גְּלָלִים bezeichnet Kot oder Exkremente. „Kot“ ist im heutigen Deutsch direkt, verständlich und schwächt das harte Bild nicht ab.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Kollektiver Sinn von אָדָם
  choice: die Menschen
  alternative: der Mensch; die Menschheit
  rationale: Der hebräische Singular hat hier kollektive Bedeutung, wie auch der anschließende Plural „sie werden umhergehen“ zeigt. „Die Menschen“ ist im Deutschen natürlich und wahrt den umfassenden Bezug.
- issue: Deutung von לְחֻמָם
  choice: ihr Fleisch
  alternative: ihre Eingeweide; ihre Gedärme
  rationale: Die genaue Bedeutung des seltenen Ausdrucks ist umstritten. Der Haupttext folgt der allgemeineren, zum Parallelismus passenden Deutung, ohne die spezifischeren Möglichkeiten zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klaren, kräftigen Gerichtsbildern. Die Satzstruktur folgt eng dem hebräischen Gedankengang, bleibt aber idiomatisch; echte lexikalische Unsicherheiten werden in Fußnoten ausgewiesen.
