id: ZEP.1.11
reference: Zephaniah 1:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הֵילִ֖ילוּ יֹשְׁבֵ֣י הַ/מַּכְתֵּ֑שׁ כִּ֤י נִדְמָה֙ כָּל עַ֣ם כְּנַ֔עַן נִכְרְת֖וּ כָּל נְטִ֥ילֵי כָֽסֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/011.yaml
  text: Wail[a], inhabitants of the Mortar, for all the merchant people are destroyed[b]; all who weigh out silver are cut off.
translation:
  language: de
  text: Heult, ihr Bewohner des Mörsers[a]! Denn das ganze Händlervolk[b] ist vernichtet; ausgerottet sind alle, die Silber abwiegen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch Maktesch, wörtlich »Mörser«; wahrscheinlich der Name eines Marktviertels in Jerusalem, möglicherweise nach seiner muldenartigen Lage benannt.
    reason: alternative_reading
  - marker: b
    text: 'Oder: »das ganze Volk Kanaans«. »Kanaan« kann hier, wie auch sonst in wirtschaftlichen Zusammenhängen, im Sinn von »Händler« gebraucht sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵילִילוּ
  choice: Heult
  rationale: Der Imperativ Plural von ילל bezeichnet einen lauten Klage- oder Schreckensruf. »Heult« bewahrt die Eindringlichkeit der prophetischen Gerichtssprache.
- source_word: יֹשְׁבֵי
  choice: Bewohner
  rationale: Das substantivisch gebrauchte Partizip im Konstrukt bezeichnet die Menschen, die an dem genannten Ort wohnen.
- source_word: הַמַּכְתֵּשׁ
  choice: des Mörsers
  rationale: Das Wort bedeutet wörtlich »Mörser« und dient hier wahrscheinlich als Bezeichnung eines tiefer gelegenen Stadt- oder Marktviertels Jerusalems. Die Übersetzung erhält sowohl das Bild als auch den Ortsnamencharakter.
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion leitet den Grund für den vorausgehenden Klageruf ein.
- source_word: נִדְמָה
  choice: ist vernichtet
  rationale: Der Nifal von דמה kann hier das Zugrundegehen oder Verstummen infolge des Gerichts bezeichnen. »Ist vernichtet« passt zum parallelen »ausgerottet« und lässt den Gerichtszusammenhang klar hervortreten.
- source_word: כָּל עַם כְּנַעַן
  choice: das ganze Händlervolk
  rationale: »Kanaan« kann in kommerziellen Zusammenhängen metonymisch Händler bezeichnen. Der unmittelbare Bezug auf Silber macht diese Bedeutung wahrscheinlich; »Händlervolk« bewahrt zugleich das kollektive עַם.
- source_word: נִכְרְתוּ
  choice: ausgerottet sind
  rationale: Der Nifal von כרת bedeutet häufig »abgeschnitten« oder »ausgerottet werden«. Die gewählte Form ist im Deutschen eine natürliche und gewichtige Gerichtsformel.
- source_word: כָּל נְטִילֵי כָסֶף
  choice: alle, die Silber abwiegen
  rationale: Im Handelskontext sind Menschen gemeint, die Silber als Zahlungsmittel handhaben und abwiegen. Die Formulierung gibt die konkrete antike Handelspraxis verständlich wieder.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit der eindringlichen Kürze prophetischer Gerichtsdichtung. Die parallelen Verben »vernichtet« und »ausgerottet« bleiben deutlich, ohne die lexikalische Mehrdeutigkeit von דמה in der Fußnote unnötig dogmatisch festzulegen.
