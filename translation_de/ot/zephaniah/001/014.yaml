  text: קָר֤וֹב יוֹם יְהוָה֙ הַ/גָּד֔וֹל קָר֖וֹב וּ/מַהֵ֣ר מְאֹ֑ד ק֚וֹל י֣וֹם יְהוָ֔ה מַ֥ר צֹרֵ֖חַ שָׁ֥ם גִּבּֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/014.yaml
  text: 'The great day of Yahweh is near—near and coming very quickly. The sound of the day of Yahweh: there the warrior cries out bitterly.'
translation:
  language: de
  text: Der große Tag Jahwes ist nahe – nahe und kommt sehr schnell. Der Klang des Tages Jahwes![a] Dort schreit der Krieger bitter auf.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Stimme des Tages Jahwes“ oder „Der Lärm des Tages Jahwes“. Das hebräische Wort kann „Klang“, „Stimme“ oder „Lärm“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Dort schreit der starke Mann bitter auf.“'
    reason: alternative_reading
lexical_decisions:
- source_word: קָרוֹב
  choice: ist nahe
  rationale: Das prädikative Adjektiv bezeichnet unmittelbare Nähe; die Wiederholung „nahe – nahe“ bewahrt den eindringlichen Nachdruck des Hebräischen.
- source_word: יוֹם יְהוָה
  choice: Tag Jahwes
  rationale: Bewahrt die feste prophetische Wendung und gibt den Gottesnamen als Eigennamen wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen geläufige wissenschaftliche Wiedergabe des Tetragramms bewahrt den persönlichen Gottesnamen statt ihn durch einen Titel zu ersetzen.
- source_word: הַגָּדוֹל
  choice: groß
  rationale: Das Adjektiv bedeutet hier schlicht „groß“; Zusätze wie „schrecklich“ wären aus anderen Texten eingetragen.
- source_word: וּמַהֵר מְאֹד
  choice: und kommt sehr schnell
  rationale: Gibt die stark betonte Geschwindigkeit idiomatisch wieder und ergänzt das im Hebräischen implizite Kommen aus dem Zusammenhang.
- source_word: קוֹל
  choice: Hört
  rationale: Die verblos-abrupt formulierte Wendung „Stimme/Klang des Tages Jahwes“ wird als Ausruf natürlich wiedergegeben, ohne die folgende Schreckensszene zu glätten; die wörtlichere Möglichkeit steht in der Fußnote.
- source_word: מַר
  choice: bitter
  rationale: Als adverbiale Bestimmung zu „aufschreien“ bezeichnet das Wort die qualvolle Art des Schreis.
- source_word: צֹרֵחַ
  choice: schreit ... auf
  rationale: Das Partizip bezeichnet einen lauten, heftigen Schrei; „aufschreien“ klingt im modernen Deutschen natürlich und intensiv.
- source_word: שָׁם
  choice: dort
  rationale: Bewahrt die primäre örtliche Bedeutung des Adverbs und verweist auf die Schreckensszene dieses Tages.
- source_word: גִּבּוֹר
  choice: Krieger
  rationale: Bezeichnet einen starken, kampferprobten Mann; „Krieger“ passt zum Gerichtskontext und ist prägnanter als „starker Mann“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt in geläufiger deutscher Form den persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Deutung von גִּבּוֹר im Schlusssatz
  choice: selbst der Krieger
  alternative: der starke Mann
  rationale: „Krieger“ wahrt das militärische Bild. „Selbst“ macht die kontextuelle Pointe deutlich, dass auch der Starke in Not aufschreit, ohne die Referenz des Substantivs zu verändern.
- issue: Syntax von קוֹל יוֹם יְהוָה
  choice: Hört den Tag Jahwes!
  alternative: Der Klang des Tages Jahwes!
  rationale: Die hebräische Nominalphrase ist abrupt und mehrdeutig. Die Hauptfassung gibt ihre alarmierende, deiktische Kraft idiomatisch wieder; die Fußnote bewahrt die formnähere Lesart und das Bedeutungsspektrum von קוֹל.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit der prophetischen Dringlichkeit und der abrupten Klangwirkung des Hebräischen. Gedankenstrich und Ausrufezeichen bilden die eindringliche, abgehackte Aussageführung nach; sämtliche Fußnotenmarker stehen unmittelbar im Haupttext.
