  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הָיָה֙ בָּ/עֵ֣ת הַ/הִ֔יא אֲחַפֵּ֥שׂ אֶת יְרוּשָׁלִַ֖ם בַּ/נֵּר֑וֹת וּ/פָקַדְתִּ֣י עַל הָ/אֲנָשִׁ֗ים הַ/קֹּֽפְאִים֙ עַל שִׁמְרֵי/הֶ֔ם הָ/אֹֽמְרִים֙ בִּ/לְבָבָ֔/ם לֹֽא יֵיטִ֥יב יְהוָ֖ה וְ/לֹ֥א יָרֵֽעַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/012.yaml
  text: 'And it will happen at that time: I will search Jerusalem with lamps, and I will punish the men who have grown thick on their dregs, who say in their hearts, ''The LORD will not do good, nor will he do harm.'''
translation:
  language: de
  text: 'Und zu jener Zeit werde ich Jerusalem mit Lampen durchsuchen. Ich werde die Männer zur Rechenschaft ziehen, die auf ihrem Bodensatz eingedickt sind[a] und in ihrem Herzen sagen: »Der HERR tut weder Gutes noch Böses.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die auf ihrem Bodensatz eingedickt sind«; das Bild stammt von Wein, der lange ungestört auf seinem Bodensatz steht. Gemeint sind Menschen, die in ihrer selbstsicheren Haltung erstarrt sind.'
    reason: Das ungewöhnliche hebräische Weinbild ist im Haupttext bewahrt, braucht für heutige Leser aber eine knappe Erläuterung.
lexical_decisions:
- source_word: אֲחַפֵּשׂ ... בַּנֵּרוֹת
  choice: mit Lampen durchsuchen
  rationale: Gibt das intensive, sorgfältige Suchen und das ausdrücklich genannte Hilfsmittel unmittelbar wieder.
- source_word: וּפָקַדְתִּי עַל
  choice: zur Rechenschaft ziehen
  rationale: פקד על bezeichnet hier im Gerichtskontext ein strafendes Heimsuchen; die gewählte Formulierung ist natürlich und wahrt den Gedanken göttlicher Ahndung.
- source_word: הַקֹּפְאִים עַל שִׁמְרֵיהֶם
  choice: die auf ihrem Bodensatz eingedickt sind
  rationale: Bewahrt das Bild von Wein, der ungestört auf seinem Bodensatz bleibt und dadurch eindickt; zugleich bleibt die metaphorische Aussage bewusst offen.
- source_word: בִּלְבָבָם
  choice: in ihrem Herzen
  rationale: Behält die biblische Wendung für das innere Denken und Urteilen bei.
- source_word: יְהוָה
  choice: der HERR
  rationale: Folgt der etablierten deutschen Bibelkonvention für das Tetragramm und kennzeichnet es durch Großschreibung.
- source_word: לֹא יֵיטִיב ... וְלֹא יָרֵעַ
  choice: tut weder Gutes noch Böses
  rationale: 'Gibt die parallele Aussage knapp und in ihrer theologischen Spannung wieder: Die Sprecher bestreiten sowohl wohltätiges als auch schädigendes beziehungsweise richtendes Eingreifen JHWHs.'
theological_decisions:
- issue: Aussage über das Handeln des HERRN
  choice: »Der HERR tut weder Gutes noch Böses.«
  alternative: »Der HERR bewirkt weder Gutes noch Unheil.«
  rationale: Die direkte, symmetrische Form wahrt den zynischen Deismus der Männer, ohne ihre Behauptung abzuschwächen oder als Aussage des Erzählers erscheinen zu lassen.
- issue: Weinbild als Charakterisierung der Männer
  choice: Bild vom Eindicken auf dem Bodensatz beibehalten
  alternative: als selbstzufrieden oder gleichgültig deuten
  rationale: Der hebräische Text verwendet ein konkretes, deutungsoffenes Weinbild. Eine rein abstrakte Wiedergabe würde die Metapher und ihre mögliche Nuance von Erstarrung, Behäbigkeit oder Selbstzufriedenheit vorschnell festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Rede ist klar gegliedert; das markante Weinbild bleibt erhalten, während »zur Rechenschaft ziehen« die gerichtliche Bedeutung idiomatisch vermittelt.
