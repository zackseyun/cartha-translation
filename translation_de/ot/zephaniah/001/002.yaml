  text: אָסֹ֨ף אָסֵ֜ף כֹּ֗ל מֵ/עַ֛ל פְּנֵ֥י הָ/אֲדָמָ֖ה נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/002.yaml
  text: I will utterly sweep away everything from the face of the earth[a], declares Yahweh.
translation:
  language: de
  text: »Ich werde alles restlos von der Erdoberfläche hinwegfegen[a]«, spricht Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich werde alles vollständig vom Erdboden oder vom Land entfernen.“ Das Hebräische verwendet einen Infinitivus absolutus zusammen mit einer finiten Form desselben Verbs zur Verstärkung; wörtlich dem Sinn nach: „Gewiss werde ich alles wegraffen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָסֹף אָסֵף
  choice: restlos … hinwegfegen
  rationale: Der Infinitivus absolutus mit der finiten Form desselben Verbs verstärkt Gewissheit und Intensität. Im Gerichtszusammenhang gibt „restlos hinwegfegen“ die umfassende Beseitigung idiomatisch wieder, ohne das zugrunde liegende Bild des Zusammenraffens in den Haupttext zu zwingen.
- source_word: כֹּל
  choice: alles
  rationale: Das absolut gebrauchte כֹּל bezeichnet hier umfassend die Gesamtheit dessen, was vom angekündigten Gericht betroffen ist.
- source_word: מֵעַל פְּנֵי
  choice: von der … Oberfläche
  rationale: Die hebräische Wendung bezeichnet die Entfernung von der Oberfläche eines Gebietes. Die deutsche Formulierung bewahrt das räumliche Bild in natürlicher Sprache.
- source_word: הָאֲדָמָה
  choice: Erde (in „Erdoberfläche“)
  rationale: אֲדָמָה kann „Erdboden“, „Land“ oder im weiteren Sinn „Erde“ bedeuten. Der umfassende Auftakt der Gerichtsankündigung legt „Erde“ nahe; die Alternativen bleiben in der Fußnote sichtbar.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Die prophetische Formel kennzeichnet eine feierliche, autoritative Gottesrede. „Spricht Jahwe“ ist im modernen Deutschen klar und würdig.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt. „Jahwe“ ist die im Deutschen geläufige Form.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet das Tetragramm als Gottesnamen. Die Transliteration „Jahwe“ bewahrt den Eigennamen und vermeidet die Ersetzung durch einen Titel.
- issue: Reichweite von הָאֲדָמָה
  choice: Erde
  alternative: Erdboden; Land
  rationale: Der umfassende Wortlaut mit כֹּל kann eine weltweite Gerichtsansage nahelegen, doch das Substantiv selbst ist mehrdeutig. Daher steht „Erde“ im Haupttext, während die engeren Bedeutungen in der Fußnote erhalten bleiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Hinwegfegen“ vermittelt die Wucht des Gerichtswortes; „restlos“ bildet die emphatische hebräische Verbkonstruktion ab. Die sachliche Mehrdeutigkeit von אֲדָמָה wird durch die Fußnote bewahrt.
