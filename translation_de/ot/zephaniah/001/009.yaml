  text: וּ/פָקַדְתִּ֗י עַ֧ל כָּל הַ/דּוֹלֵ֛ג עַל הַ/מִּפְתָּ֖ן בַּ/יּ֣וֹם הַ/ה֑וּא הַֽ/מְמַלְאִ֛ים בֵּ֥ית אֲדֹנֵי/הֶ֖ם חָמָ֥ס וּ/מִרְמָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/009.yaml
  text: And on that day I will punish all who leap over the threshold[b][a], who fill their masters’ house with violence and deceit.
translation:
  language: de
  text: Und an jenem Tag werde ich alle zur Rechenschaft ziehen, die über die Schwelle springen[a] und das Haus ihrer Herren[b] mit Gewalt und Betrug füllen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die über die Schwelle hüpfen“. Gemeint sein könnte ein bekannter ritueller oder abergläubischer Brauch, vielleicht in Verbindung mit dem Schwellentabu in 1. Samuel 5,5; andere verstehen die Wendung bildlich als Bezeichnung gewaltsamer Eindringlinge.'
    reason: alternative_reading
  - marker: b
    text: 'Hebräisch: „das Haus ihrer Herren“; manche Übersetzungen geben die Wendung mit „das Haus ihres Herrn“ wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָקַדְתִּי
  choice: werde ich … zur Rechenschaft ziehen
  rationale: Im prophetischen Gerichtskontext bezeichnet פקד ein zur Verantwortung Ziehen beziehungsweise Bestrafen. Die gewählte Wendung wahrt den richterlichen Sinn und klingt im modernen Deutsch würdevoll.
- source_word: הַדּוֹלֵג עַל הַמִּפְתָּן
  choice: die über die Schwelle springen
  rationale: דלג bezeichnet Springen oder Hüpfen. Die anschauliche, aber deutungsoffene Formulierung wird beibehalten, statt sie auf einen bestimmten Brauch oder gewaltsames Eindringen festzulegen.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Die geläufige prophetische Zeitformel wird in natürlichem, gehobenem Standarddeutsch wiedergegeben.
- source_word: הַמְמַלְאִים
  choice: und … füllen
  rationale: Das Partizip kennzeichnet dieselbe Personengruppe durch ihr fortgesetztes oder charakteristisches Handeln. Die koordinierte Wiedergabe ist im Deutschen flüssig und erhält den Bezug.
- source_word: בֵּית אֲדֹנֵיהֶם
  choice: das Haus ihrer Herren
  rationale: אֲדֹנֵיהֶם ist morphologisch pluralisch und meint am naheliegendsten die Herren beziehungsweise gesellschaftlich Höhergestellten dieser Personen; ein ausdrücklicher göttlicher Bezug liegt nicht vor.
- source_word: חָמָס
  choice: Gewalt
  rationale: חמס bezeichnet gewaltsames Unrecht und häufig auch Unterdrückung. „Gewalt“ ist die direkte, breit verständliche Entsprechung.
- source_word: מִרְמָה
  choice: Betrug
  rationale: מרמה umfasst Täuschung, Betrug und Arglist. „Betrug“ passt zum Kontext unrechtmäßig erworbenen Besitzes, ohne den Mechanismus zu eng festzulegen.
theological_decisions:
- issue: Bedeutung des Springens über die Schwelle
  choice: Das konkrete Bild bleibt im Haupttext unaufgelöst.
  alternative: Anspielung auf ein Schwellentabu (vgl. 1. Samuel 5,5) oder bildliche Bezeichnung gewaltsamer Eindringlinge
  rationale: Der hebräische Text erklärt die Handlung nicht. Eine Festlegung im Haupttext würde eine echte historische und exegetische Mehrdeutigkeit beseitigen.
- issue: Bezug von „Haus ihrer Herren“
  choice: Die pluralische menschliche beziehungsweise soziale Lesart wird im Haupttext wiedergegeben.
  alternative: „das Haus ihres Herrn“, möglicherweise mit göttlichem Bezug
  rationale: Die Morphologie weist auf „ihre Herren“ hin. Da kein göttlicher Referent ausdrücklich genannt wird, soll die Übersetzung ihn nicht eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am Hebräischen, wird aber durch die koordinierte Verbfügung natürlich lesbar. Beide Fußnotenmarker stehen an den jeweils sachlich zugehörigen Stellen im Haupttext.
