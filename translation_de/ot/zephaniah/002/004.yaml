  text: כִּ֤י עַזָּה֙ עֲזוּבָ֣ה תִֽהְיֶ֔ה וְ/אַשְׁקְל֖וֹן לִ/שְׁמָמָ֑ה אַשְׁדּ֗וֹד בַּֽ/צָּהֳרַ֨יִם֙ יְגָ֣רְשׁ֔וּ/הָ וְ/עֶקְר֖וֹן תֵּעָקֵֽר׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/004.yaml
  text: For Gaza will be abandoned[a], and Ashkelon a desolation; Ashdod—they will drive her out at noon[b], and Ekron will be uprooted.
translation:
  language: de
  text: Denn Gaza wird verlassen daliegen[a], und Aschkelon wird zur Einöde werden. Aschdod wird man am Mittag vertreiben[b], und Ekron wird entwurzelt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen liegt wahrscheinlich ein Wortspiel vor: »Gaza« (ʿAzzah) und »verlassen« (ʿazuvah) klingen ähnlich.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »am Mittag«. Die Zeitangabe kann die öffentliche, unverhüllte Art der Vertreibung hervorheben.'
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für den vorausgehenden Aufruf ein und bewahrt den kausalen Zusammenhang natürlich.
- source_word: עַזָּה
  choice: Gaza
  rationale: Im Deutschen übliche Form des Ortsnamens.
- source_word: עֲזוּבָה תִהְיֶה
  choice: wird verlassen sein
  rationale: Gibt den passiv-resultativen Sinn wieder. Das hebräische Klangspiel mit dem Namen Gaza lässt sich im Deutschen nicht natürlich nachbilden und wird daher in einer Fußnote erklärt.
- source_word: אַשְׁקְלוֹן לִשְׁמָמָה
  choice: Aschkelon zur Einöde werden
  rationale: שְׁמָמָה bezeichnet einen verwüsteten, menschenleeren Zustand; das ergänzte »werden« macht die im Hebräischen elliptische Aussage im Deutschen verständlich.
- source_word: אַשְׁדּוֹד
  choice: Aschdod
  rationale: Im Deutschen gebräuchliche biblische Form des Ortsnamens.
- source_word: בַּצָּהֳרַיִם
  choice: am helllichten Mittag
  rationale: Gibt die wörtliche Zeitangabe »am Mittag« wieder und macht ihren Nachdruck – offen und bei vollem Tageslicht – idiomatisch deutlich.
- source_word: יְגָרְשׁוּהָ
  choice: wird man vertreiben
  rationale: Das unbestimmte Subjekt der dritten Person Plural wird im Deutschen natürlich mit »man« wiedergegeben. Auf ein feminines Pronomen für die Stadt wird verzichtet, da es im Deutschen beim Neutrum des Ortsnamens unnatürlich wäre.
- source_word: וְעֶקְרוֹן תֵּעָקֵר
  choice: und Ekron wird entwurzelt werden
  rationale: Bewahrt das Bild des Ausreißens samt Wurzel und den passiven Sinn des hebräischen Verbs.
theological_decisions: []
