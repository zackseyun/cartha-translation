source:
  edition: WLC
  text: גַּם אַתֶּ֣ם כּוּשִׁ֔ים חַֽלְלֵ֥י חַרְבִּ֖/י הֵֽמָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/012.yaml
  text: You Cushites also will be slain by my sword[a][b].
translation:
  language: de
  text: Auch ihr Kuschiter werdet von meinem Schwert erschlagen werden.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Auch ihr Kuschiter – sie sind die von meinem Schwert Erschlagenen.“'
    reason: lexical_alternative
  - marker: b
    text: „Kuschiter“ kann auch mit „Äthiopier“ wiedergegeben werden; gemeint sind die Menschen aus Kusch, nicht ohne Weiteres der heutige Staat Äthiopien.
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם
  choice: auch
  rationale: Bewahrt die additive Funktion und bezieht die Kuschiter in das Gericht über die umliegenden Völker ein.
- source_word: אַתֶּם
  choice: ihr
  rationale: Gibt die direkte Anrede in der zweiten Person Plural natürlich wieder.
- source_word: כּוּשִׁים
  choice: Kuschiter
  rationale: Die Wiedergabe des Ethnonyms als „Kuschiter“ vermeidet eine irreführende Gleichsetzung mit dem heutigen Äthiopien.
- source_word: חַֽלְלֵי
  choice: erschlagen
  rationale: Das Substantiv bezeichnet gewaltsam Getötete; die verbale Passivkonstruktion ist im Deutschen natürlich und wahrt den resultativen Sinn.
- source_word: חַרְבִּי
  choice: von meinem Schwert
  rationale: Bewahrt das konkrete Bild des Schwertes und gibt zugleich die im Hebräischen ausgedrückte Zugehörigkeit zur Tötungsmacht des Sprechers idiomatisch wieder.
- source_word: הֵמָּה
  choice: werdet … werden
  rationale: Die selbstständige Pronomenform steht prädikativ beziehungsweise emphatisch in einem verblosen Satz. Der Zukunftsbezug wird aus dem prophetischen Gerichtskontext ergänzt.
theological_decisions:
- issue: Zeitbezug des verblosen Satzes
  choice: 'Zukunft: „werdet … erschlagen werden“'
  alternative: 'Gegenwartsnahe, formalere Fassung: „Ihr seid die von meinem Schwert Erschlagenen“'
  rationale: Der Zusammenhang kündigt kommendes Gericht an. Die Zukunftsform macht diesen pragmatischen Sinn im Deutschen deutlich, während die wörtlichere Nominalkonstruktion in einer Fußnote erhalten bleibt.
- issue: Sprecherbezug in „mein Schwert“
  choice: Das Possessivpronomen ohne erklärende Identifizierung bewahren
  alternative: Den Sprecher ausdrücklich als Gott benennen
  rationale: Der hebräische Text sagt lediglich „mein Schwert“. Eine ausdrückliche Ergänzung würde eine kontextuelle Identifizierung in den Vers hineintragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede und das konkrete Schwertbild bleiben erhalten; die markierte Nominalkonstruktion des Hebräischen wird im Haupttext idiomatisch verbalisiert und in Fußnote [a] formal sichtbar gemacht.
