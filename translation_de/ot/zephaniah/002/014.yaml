id: ZEP.2.14
reference: Zephaniah 2:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/רָבְצ֨וּ בְ/תוֹכָ֤/הּ עֲדָרִים֙ כָּל חַיְת/וֹ ג֔וֹי גַּם קָאַת֙ גַּם קִפֹּ֔ד בְּ/כַפְתֹּרֶ֖י/הָ יָלִ֑ינוּ ק֠וֹל יְשׁוֹרֵ֤ר בַּֽ/חַלּוֹן֙ חֹ֣רֶב בַּ/סַּ֔ף כִּ֥י אַרְזָ֖ה עֵרָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/014.yaml
  text: Herds will lie down in her midst[a], every beast of the nations; both the desert owl and the hedgehog will spend the night among her capitals. A voice will sing in the window; devastation will be on the threshold[c][b], for her cedarwork has been laid bare.
translation:
  language: de
  text: Mitten in ihr werden Herden lagern, Tiere aller Art.[a] Sowohl der Pelikan[b] als auch der Igel[c] werden auf ihren Säulenkapitellen übernachten. Eine Stimme wird am Fenster singen, Verwüstung liegt auf der Schwelle; denn ihr Zedernwerk ist bloßgelegt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich möglicherweise: „alles Getier einer Nation/eines Volkes“. Die hebräische Wortfolge ist schwierig; wahrscheinlich sind Tiere aller Art gemeint.'
    reason: alternative_reading
  - marker: b
    text: Die genaue Tierart ist unsicher; statt „Pelikan“ ist auch „Wüsteneule“ möglich.
    reason: lexical_alternative
  - marker: c
    text: Die genaue Tierart ist umstritten; statt „Igel“ ist auch „Stachelschwein“ möglich.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָבְצוּ
  choice: werden lagern
  rationale: רבץ bezeichnet besonders bei Tieren das Sich-Niederlegen oder Lagern; die deutsche Zukunftsform passt zum prophetischen Zusammenhang.
- source_word: עֲדָרִים
  choice: Herden
  rationale: Der Ausdruck bezeichnet Tiergruppen und wird mit „Herden“ breit und natürlich wiedergegeben.
- source_word: בְתוֹכָהּ
  choice: Mitten in ihr
  rationale: Das feminine Suffix verweist auf die als weiblich vorgestellte Stadt; die Formulierung bewahrt diese Personifikation.
- source_word: כָּל חַיְתוֹ גוֹי
  choice: Tiere aller Art
  rationale: Die hebräische Wortfolge ist schwierig und wörtlich etwa „alles Getier einer Nation/eines Volkes“. Im Kontext ist wahrscheinlich eine umfassende Vielfalt von Tieren gemeint; die Unsicherheit wird in einer Fußnote offengelegt.
- source_word: קָאַת
  choice: Pelikan
  rationale: Die Tierbezeichnung ist unsicher. „Pelikan“ ist eine traditionsreiche lexikalische Möglichkeit; als Alternative wird „Wüsteneule“ genannt.
- source_word: קִפֹּד
  choice: Igel
  rationale: Die genaue Tierart ist umstritten. „Igel“ ist eine geläufige Wiedergabe; „Stachelschwein“ bleibt als Alternative in der Fußnote erhalten.
- source_word: בְכַפְתֹּרֶיהָ
  choice: auf ihren Säulenkapitellen
  rationale: כפתור bezeichnet hier wahrscheinlich die knaufartigen Kapitelle von Säulen. „Auf“ gibt die lokale Präposition im architektonischen Bild anschaulich wieder.
- source_word: יָלִינוּ
  choice: werden … übernachten
  rationale: לין bedeutet, die Nacht zu verbringen; „übernachten“ ist präzise und idiomatisch.
- source_word: קוֹל יְשׁוֹרֵר
  choice: Eine Stimme wird … singen
  rationale: Die Wiedergabe erhält sowohl קוֹל „Stimme/Laut“ als auch den ungewöhnlichen, poetischen Gebrauch des Verbs „singen“.
- source_word: בַחַלּוֹן
  choice: am Fenster
  rationale: „Am Fenster“ ist im Deutschen für einen dort vernehmbaren Laut natürlicher als „im Fenster“, ohne die räumliche Unbestimmtheit unnötig aufzulösen.
- source_word: חֹרֶב בַסַּף
  choice: Verwüstung liegt auf der Schwelle
  rationale: חֹרֶב kann Dürre, Öde oder Verwüstung bezeichnen; im Bild der zerstörten Stadt passt „Verwüstung“. סף bleibt konkret als „Schwelle“ erhalten.
- source_word: כִּי אַרְזָה עֵרָה
  choice: denn ihr Zedernwerk ist bloßgelegt
  rationale: ארזה wird als Zedernholz beziehungsweise Zedernwerk des Gebäudes verstanden; ערה bezeichnet das Entblößen oder Freilegen.
