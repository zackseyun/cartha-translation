reference: Zephaniah 2:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הָ֣יָה חֶ֗בֶל לִ/שְׁאֵרִ֛ית בֵּ֥ית יְהוּדָ֖ה עֲלֵי/הֶ֣ם יִרְע֑וּ/ן בְּ/בָתֵּ֣י אַשְׁקְל֗וֹן בָּ/עֶ֨רֶב֙ יִרְבָּצ֔וּ/ן כִּ֧י יִפְקְדֵ֛/ם יְהוָ֥ה אֱלֹהֵי/הֶ֖ם וְ/שָׁ֥ב שבות/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/007.yaml
  text: And the coastland shall belong to the remnant of the house of Judah; on it they shall pasture. In the houses of Ashkelon they shall lie down at evening, for Yahweh their God will attend to them and restore their fortunes.
translation:
  language: de
  text: Und der Küstenstrich wird dem Rest des Hauses Juda gehören; dort werden sie weiden. In den Häusern Aschkelons werden sie sich am Abend niederlegen. Denn Jahwe, ihr Gott, wird sich ihrer annehmen[a] und ihr Geschick wenden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird sie aufsuchen“ beziehungsweise „wird für sie sorgen“. Das hebräische Verb kann ein aufmerksames Eingreifen zum Segen oder zum Gericht bezeichnen; hier spricht der Zusammenhang für gnädige Zuwendung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihre Gefangenen zurückbringen“. Die hebräische Wendung bedeutet häufig, dass die frühere gute Lage eines Volkes wiederhergestellt wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֶבֶל
  choice: Küstenstrich
  rationale: Das Wort bezeichnet hier im Zusammenhang mit der Küste der Philister ein abgegrenztes Gebiet. „Küstenstrich“ gibt sowohl den territorialen als auch den geografischen Bezug natürlich wieder.
- source_word: שְׁאֵרִית
  choice: Rest
  rationale: „Rest“ bewahrt den prophetischen Sinn einer erhalten gebliebenen Gruppe aus Juda und ist im Deutschen würdevoll und geläufig.
- source_word: עֲלֵיהֶם
  choice: dort
  rationale: Das hebräische Pronomen ist formal pluralisch und bezieht sich wahrscheinlich auf die zuvor genannten Landflächen beziehungsweise Orte. „Dort“ wahrt den örtlichen Bezug, ohne die grammatische Spannung künstlich aufzulösen.
- source_word: יִרְעוּן
  choice: werden sie weiden
  rationale: רעה kann „weiden“, „abweiden“ oder „hüten“ bedeuten. Die knappe Formulierung erhält die pastorale Bildsprache und lässt offen, ob die Menschen als Hirten oder ihre Herden als weidende Tiere im Blick sind.
- source_word: בְּבָתֵּי אַשְׁקְלוֹן
  choice: In den Häusern Aschkelons
  rationale: Die direkte Ortsangabe bewahrt das konkrete Bild einer erneuten, sicheren Nutzung der zuvor gerichteten Stadt.
- source_word: בָּעֶרֶב
  choice: am Abend
  rationale: Dies ist die natürliche moderne deutsche Wiedergabe der Zeitangabe.
- source_word: יִרְבָּצוּן
  choice: werden sie sich niederlegen
  rationale: Das Verb wird häufig vom Lagern der Tiere gebraucht. „Sich niederlegen“ erhält dieses konkrete pastorale Bild, ohne das Subjekt ausdrücklich auf Menschen oder Herden festzulegen.
- source_word: יִפְקְדֵם
  choice: wird sich ihrer annehmen
  rationale: פקד bezeichnet ein aufmerksames Eingreifen, das je nach Kontext Segen oder Gericht bringen kann. Hier weist die anschließende Wiederherstellung auf fürsorgliches Handeln hin; eine Fußnote nennt die wörtlichere Alternative.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen übliche Umschrift gibt den im hebräischen Text stehenden Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: וְשָׁב שְׁבוּתָם
  choice: und ihr Geschick wenden
  rationale: Die feste hebräische Wendung bezeichnet häufig die Wiederherstellung einer früheren guten Lage. „Ihr Geschick wenden“ ist idiomatisch und lässt den umfassenderen Sinn erkennen; die mögliche konkrete Deutung als Rückführung Gefangener steht in der Fußnote.
theological_decisions:
- issue: Bedeutung von וְשָׁב שְׁבוּתָם
  choice: ihr Geschick wenden
  alternative: ihre Gefangenen zurückbringen
  rationale: Die prophetische Wendung kann eine umfassende Umkehr des Unheils bezeichnen und muss nicht auf eine buchstäbliche Gefangenenrückkehr beschränkt werden. Die alternative Lesart bleibt durch die Fußnote sichtbar.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen. Seine Umschrift bewahrt diesen Unterschied gegenüber einem bloßen Hoheitstitel.
- issue: Subjekt der pastoralen Verben
  choice: Das Pronomen „sie“ bleibt ohne ausdrückliche Festlegung auf den Rest Judas oder dessen Herden stehen.
  alternative: Die Herden als ausdrückliches Subjekt einsetzen.
  rationale: Der hebräische Wortlaut lässt im Zusammenhang ein Ineinandergreifen von menschlicher Ansiedlung und pastoraler Bildsprache zu. Eine Präzisierung würde die echte Mehrdeutigkeit unnötig beseitigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzgliederung. Die Zukunftsformen entsprechen der prophetischen Aussage. „Jahwe“ gibt den Gottesnamen direkt wieder; „Aschkelon“ folgt der geläufigen deutschen Namensform. Die pastorale Mehrdeutigkeit der Verben wird nicht durch ergänzte Substantive aufgelöst.
