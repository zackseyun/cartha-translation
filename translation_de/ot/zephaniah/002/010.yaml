- from: Das trifft sie als Vergeltung für ihren Hochmut, weil sie das Volk Jahwes der Heere[a] verhöhnt und sich gegen es erhoben haben.
  to: Das wird ihnen als Vergeltung für ihren Hochmut zuteil, denn sie haben das Volk Jahwes der Heere verhöhnt und sich über es erhoben.[a]
  rationale: Die Revision macht die in וַיַּגְדִּילוּ עַל enthaltene Selbstüberhöhung mit „sich über es erhoben“ deutlich, ohne über den hebräischen Sinn hinauszugehen. Zugleich wird die einleitende Nominalformel natürlich und ergebnisbezogen wiedergegeben. Die Fußnotenmarke wird an den vollständigen Gottesnamenstitel gesetzt, auf den sich die lexikalische Alternative bezieht.
