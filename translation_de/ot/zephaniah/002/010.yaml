source:
  edition: WLC
  text: זֹ֥את לָ/הֶ֖ם תַּ֣חַת גְּאוֹנָ֑/ם כִּ֤י חֵֽרְפוּ֙ וַ/יַּגְדִּ֔לוּ עַל עַ֖ם יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/010.yaml
  text: This will be their lot in return for their pride[a], because they taunted and magnified themselves against the people of Yahweh of Armies.
translation:
  language: de
  text: Das wird ihnen als Vergeltung für ihren Hochmut zuteil, denn sie haben das Volk Jahwes der Heere verhöhnt und sich über es erhoben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: der HERR der Heerscharen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת לָהֶם
  choice: Das trifft sie
  rationale: Die knappe hebräische Nominalkonstruktion verweist auf das zuvor angekündigte Gericht. Die deutsche Formulierung macht den impliziten Ergebnissinn verständlich, ohne ein zusätzliches Los oder Schicksal in den Text einzutragen.
- source_word: תַּחַת גְּאוֹנָם
  choice: als Vergeltung für ihren Hochmut
  rationale: תַּחַת bezeichnet hier den Ausgleich beziehungsweise die entsprechende Ahndung; גָּאוֹן meint im Gerichtszusammenhang überheblichen Stolz. „Hochmut“ gibt diesen negativen Sinn prägnant wieder.
- source_word: כִּי
  choice: weil
  rationale: Die Konjunktion begründet das angekündigte Gericht.
- source_word: חֵרְפוּ
  choice: verhöhnt
  rationale: Das Verb bezeichnet verächtliches Schmähreden. „Verhöhnt“ ist gegenwärtiges, würdiges Deutsch und bewahrt die feindselige Geringschätzung.
- source_word: וַיַּגְדִּילוּ עַל
  choice: und sich gegen es erhoben
  rationale: Die Hifil-Form von גדל mit עַל drückt selbstüberhebendes Großmachen gegenüber oder gegen jemanden aus. „Sich gegen es erhoben“ bewahrt sowohl die Selbstüberhöhung als auch die feindliche Ausrichtung; das Pronomen bezieht sich auf „das Volk“.
- source_word: עַם
  choice: das Volk
  rationale: Im Zusammenhang mit dem Gottesnamen bezeichnet עַם Jahwes Volk, nicht lediglich eine politische Nation.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname Gottes wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: צְבָאוֹת
  choice: der Heere
  rationale: „Heere“ gibt die Grundbedeutung des traditionellen Titels für heutige Leser transparenter wieder als das ältere „Heerscharen“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens und Titels יְהוָה צְבָאוֹת
  choice: Jahwe der Heere
  alternative: der HERR der Heerscharen
  rationale: Die Hauptfassung bewahrt den persönlichen Gottesnamen und übersetzt צְבָאוֹת semantisch. Die traditionelle deutsche Titelform wird in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist verständlich, hält aber die gerichtliche Schärfe des Verses fest. Die Wiederaufnahme von „das Volk“ durch „es“ vermeidet eine mögliche Fehlbeziehung auf Jahwe.
