translation:
  language: de
  text: Und der Küstenstrich wird zu Weideland, mit Brunnen[a] für Hirten und Pferchen für Schafherden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort ist unsicher; es kann auch „Hütten“ oder „Unterkünfte“ für Hirten bedeuten.
    reason: Kennzeichnet die umstrittene Bedeutung von כְּרֹת, ohne die im Haupttext gewählte, auch in der englischen POB-Fassung vertretene Deutung zu verdrängen.
lexical_decisions:
- source_word: חֶבֶל הַיָּם
  choice: der Küstenstrich
  rationale: Die Wortverbindung bezeichnet hier den Landstrich am Meer; „Küstenstrich“ gibt den räumlichen Sinn natürlich und präzise wieder.
- source_word: נְוֺת
  choice: Weideland
  rationale: Der Plural bezeichnet Weideplätze beziehungsweise Weiden; der deutsche Kollektivbegriff passt zum Küstengebiet als neuem Weideland.
- source_word: כְּרֹת
  choice: Brunnen
  rationale: Die seltene Form wird hier im Anschluss an die masoretische Lesung und eine mögliche Ableitung im Sinn von gegrabenen Anlagen als „Brunnen“ verstanden. Andere Deutungen wie „Hütten“ sind lexikalisch möglich, werden aber nicht stillschweigend in den Haupttext übernommen.
- source_word: גִדְרוֹת צֹאן
  choice: Pferchen für Schafe
  rationale: גדרות sind umfriedete Einhegungen; „Pferche“ bezeichnet im Deutschen natürliche und konkrete Einfriedungen für Kleinvieh.
