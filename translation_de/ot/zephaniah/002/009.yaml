  text: לָ/כֵ֣ן חַי אָ֡נִי נְאֻם֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל כִּֽי מוֹאָ֞ב כִּ/סְדֹ֤ם תִּֽהְיֶה֙ וּ/בְנֵ֤י עַמּוֹן֙ כַּֽ/עֲמֹרָ֔ה מִמְשַׁ֥ק חָר֛וּל וּ/מִכְרֵה מֶ֥לַח וּ/שְׁמָמָ֖ה עַד עוֹלָ֑ם שְׁאֵרִ֤ית עַמִּ/י֙ יְבָזּ֔וּ/ם וְ/יֶ֥תֶר גוי יִנְחָלֽוּ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/009.yaml
  text: Therefore[a], as I live, declares Yahweh of hosts, the God of Israel, Moab will surely become like Sodom, and the sons of Ammon like Gomorrah—a place overgrown with weeds, a salt pit, and a perpetual desolation. The remnant of my people will plunder them[b], and the remainder of my nation will inherit them.
translation:
  language: de
  text: 'Darum – so wahr ich lebe, spricht Jahwe der Heerscharen, der Gott Israels – wird Moab gewiss wie Sodom werden und die Ammoniter[a] wie Gomorra: ein von Unkraut überwucherter Ort[b], eine Salzgrube und eine Einöde für immer. Der Rest meines Volkes wird sie plündern, und der Überrest meiner Nation wird sie erben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Söhne Ammons“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder formaler: „ein Besitz von Nesseln“. Die hebräische Wendung ist schwierig; gemeint ist offenbar verlassenes Land, das von dornigem oder brennnesselartigem Unkraut überwuchert ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die Schlussfolgerung aus der vorangehenden Anklage und klingt im prophetischen Zusammenhang natürlich.
- source_word: חַי אָנִי
  choice: so wahr ich lebe
  rationale: Gibt die feierliche göttliche Schwurformel idiomatisch und zugleich eng am Sinn des Hebräischen wieder.
- source_word: נְאֻם יְהוָה צְבָאוֹת אֱלֹהֵי יִשְׂרָאֵל
  choice: spricht Jahwe der Heerscharen, der Gott Israels
  rationale: „Spricht“ ist die etablierte prophetische Redeeinleitung; „Jahwe“ gibt den Gottesnamen wieder, und „der Heerscharen“ bewahrt den traditionellen Titel.
- source_word: כִּי
  choice: gewiss
  rationale: Leitet den Inhalt des Schwurs mit bekräftigender Wirkung ein; „gewiss“ bringt diese Emphase in natürlichem Deutsch zum Ausdruck.
- source_word: וּבְנֵי עַמּוֹן
  choice: die Ammoniter
  rationale: Die idiomatische deutsche Volksbezeichnung vermittelt die Bedeutung klar; die wörtliche Form wird in einer Fußnote genannt.
- source_word: מִמְשַׁק חָרוּל
  choice: ein von Unkraut überwucherter Ort
  rationale: Die schwierige Wendung bezeichnet offenbar verödetes, von dornigem beziehungsweise brennnesselartigem Bewuchs eingenommenes Land, ohne dass die genaue Wortbedeutung oder Pflanzenart sicher wäre.
- source_word: וּמִכְרֵה מֶלַח
  choice: eine Salzgrube
  rationale: Bewahrt das Bild eines salzhaltigen, unfruchtbaren Ortes und gibt die grammatische Einzahl wieder.
- source_word: וּשְׁמָמָה עַד עוֹלָם
  choice: und eine Einöde für immer
  rationale: Gibt sowohl den Zustand der Verwüstung als auch seine unbegrenzte Dauer direkt und verständlich wieder.
- source_word: שְׁאֵרִית עַמִּי
  choice: Der Rest meines Volkes
  rationale: „Rest“ bewahrt den wichtigen prophetischen Begriff, bleibt aber für heutige Leser unmittelbar verständlich.
- source_word: יְבָזּוּם
  choice: wird sie plündern
  rationale: Das Verb bezeichnet das Erbeuten von Besitz besiegter Gegner; „plündern“ wahrt seine Stärke.
- source_word: יִנְחָלוּם
  choice: wird sie in Besitz nehmen
  rationale: Das Verb kann „erben“ oder „als Besitz erhalten/in Besitz nehmen“ bedeuten; im Zusammenhang mit besiegten Gebieten ist die gewählte Form natürlich, ohne den Besitzgedanken abzuschwächen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm; „Jahwe“ bewahrt den persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von יִנְחָלוּם
  choice: sie in Besitz nehmen
  alternative: sie erben
  rationale: Beide Bedeutungsnuancen gehören zum hebräischen Verb. „In Besitz nehmen“ passt zur angekündigten Übernahme der Gebiete, während die Fußnoten nicht unnötig eine theologische Deutung des Erbmotivs festlegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetischer Feierlichkeit. Gedankenstriche fassen die Schwur- und Redeeinleitung übersichtlich ein. Die schwer deutbare Vegetationsformel wird im Haupttext anschaulich, in der Fußnote jedoch mit ihrer wörtlicheren Alternative und der bestehenden Unsicherheit wiedergegeben.
