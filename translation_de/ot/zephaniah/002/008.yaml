base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/008.yaml
  text: I have heard the reproach of Moab and the insults of the sons of Ammon[b][a], with which they reproached my people and magnified themselves against their border.
translation:
  language: de
  text: Ich habe den Hohn Moabs und die Schmähungen der Söhne Ammons[a] gehört, mit denen sie mein Volk verhöhnt und sich gegen ihre Grenze großgetan haben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Ammoniter“.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Suffix lautet „ihre“ (Mehrzahl). Sein Bezug ist nicht eindeutig; wahrscheinlich ist die Grenze beziehungsweise das Gebiet von Gottes Volk gemeint.
    reason: textual_ambiguity
lexical_decisions:
- source_word: שָׁמַעְתִּי
  choice: Ich habe … gehört
  rationale: Das deutsche Perfekt gibt die abgeschlossene Wahrnehmung mit fortdauernder Bedeutung in der prophetischen Rede natürlich wieder.
- source_word: חֶרְפַּת
  choice: den Hohn
  rationale: „Hohn“ bezeichnet hier die verächtliche Rede gegen ein Gegenüber und bildet eine klare, würdige Parallele zu „Schmähungen“.
- source_word: גִדּוּפֵי
  choice: die Schmähungen
  rationale: Das Wort bezeichnet verletzende, verächtliche Äußerungen. „Schmähungen“ wahrt den gehobenen Ton, ohne den nicht ausdrücklich genannten Gottesbezug von „Lästerungen“ einzutragen.
- source_word: בְּנֵי עַמּוֹן
  choice: die Söhne Ammons
  rationale: Die formnahe Wiedergabe bewahrt die hebräische Volksbezeichnung; die im heutigen Deutsch geläufigere Bezeichnung „Ammoniter“ wird in der Fußnote genannt.
- source_word: אֲשֶׁר חֵרְפוּ
  choice: mit denen sie … verhöhnt
  rationale: Der Relativsatz wird auf Hohn und Schmähungen als Mittel des verbalen Angriffs bezogen. Dadurch bleibt die syntaktische Verknüpfung des Hebräischen erkennbar.
- source_word: עַמִּי
  choice: mein Volk
  rationale: Dies entspricht unmittelbar der possessiven Bundesbezeichnung des Ausgangstextes, ohne sie auszudeuten.
- source_word: וַיַּגְדִּילוּ
  choice: sich … großgetan haben
  rationale: „Sich großtun“ bewahrt das Bild des Sich-groß-Machens und vermittelt zugleich verständlich den Sinn von Prahlen und Selbstüberhebung.
- source_word: עַל גְּבוּלָם
  choice: gegen sein Gebiet
  rationale: עַל erhält im feindseligen Zusammenhang die Bedeutung „gegen“. „Gebiet“ gibt גְּבוּל hier natürlich als Hoheitsbereich wieder. Das deutsche „sein“ bezieht sich auf „mein Volk“; die formale Mehrzahl des hebräischen Suffixes und ihre mögliche Mehrdeutigkeit werden in der Fußnote dokumentiert.
theological_decisions:
- issue: Bezug des Mehrzahlsuffixes in גְּבוּלָם
  choice: Das Gebiet gehört zu dem unmittelbar zuvor genannten „mein Volk“.
  alternative: Das Suffix kann formal auch auf das eigene Gebiet Moabs und Ammons oder allgemeiner auf eine Grenze bezogen werden.
  rationale: Der unmittelbare Kontext schildert die feindselige Haltung Moabs und Ammons gegenüber Gottes Volk und dessen Gebiet. Die Hauptübersetzung gibt diesen wahrscheinlichsten Bezug wieder, während die Fußnote die knappe und nicht völlig eindeutige Formulierung des Hebräischen offenlegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit formnahen Wendungen, wo sie verständlich bleiben. „Sich großtun“ vermittelt die hebräische Metapher natürlicher als das steife „sich groß machen“. Sämtliche Fußnotenmarker stehen im Haupttext.
