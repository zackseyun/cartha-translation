id: ZEP.2.13
reference: Zephaniah 2:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/יֵ֤ט יָד/וֹ֙ עַל צָפ֔וֹן וִֽ/יאַבֵּ֖ד אֶת אַשּׁ֑וּר וְ/יָשֵׂ֤ם אֶת נִֽינְוֵה֙ לִ/שְׁמָמָ֔ה צִיָּ֖ה כַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/013.yaml
  text: And he will stretch out his hand against the north and destroy Assyria[a], and he will make Nineveh a desolation, dry like the wilderness.
translation:
  language: de
  text: Und er wird seine Hand gegen den Norden ausstrecken und Assyrien vernichten. Ninive wird er zur Einöde machen, dürr wie die Wüste.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „wie die Wildnis“. Das hebräische Wort kann je nach Zusammenhang auch Steppe, Weideland oder wüstenähnliches Ödland bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵט יָדוֹ
  choice: er wird seine Hand … ausstrecken
  rationale: נטה bezeichnet mit „Hand“ als Objekt gewöhnlich das Ausstrecken. Die konkrete, anthropomorphe Bildsprache des Hebräischen bleibt erhalten.
- source_word: עַל צָפוֹן
  choice: gegen den Norden
  rationale: עַל ist angesichts des folgenden Gerichts über Assyrien feindlich beziehungsweise gerichtlich zu verstehen; „der Norden“ bezeichnet die nördlich von Juda gelegene Machtregion.
- source_word: וִיאַבֵּד אֶת אַשּׁוּר
  choice: und Assyrien vernichten
  rationale: Der Hifil von אבד drückt hier das Herbeiführen von Untergang oder Zerstörung aus. אַשּׁוּר bezeichnet in diesem Zusammenhang das assyrische Reich beziehungsweise Land.
- source_word: וְיָשֵׂם אֶת נִינְוֵה לִשְׁמָמָה
  choice: Ninive wird er zur Einöde machen
  rationale: שׂים mit Ergebnisangabe bedeutet hier „zu etwas machen“; שְׁמָמָה bezeichnet einen verwüsteten, verlassenen Zustand. Die Voranstellung „Ninive“ ergibt im Deutschen einen natürlichen Anschluss und bewahrt den Fokus auf der Stadt.
- source_word: צִיָּה
  choice: dürr
  rationale: Das Wort bezeichnet Trockenheit beziehungsweise dürres Land. Die prädikative Wiedergabe beschreibt knapp den Zustand der verwüsteten Stadt.
- source_word: כַּמִּדְבָּר
  choice: wie die Wüste
  rationale: מִדְבָּר kann Wildnis, Steppe, Weideland oder Wüste bezeichnen. Im Zusammenhang mit צִיָּה und שְׁמָמָה gibt „Wüste“ die trockene, menschenleere Landschaft natürlich wieder, ohne die weitere Bedeutungsbreite zu verschweigen.
theological_decisions:
- issue: Anthropomorphe Darstellung des göttlichen Gerichts
  choice: Das konkrete Bild „seine Hand … ausstrecken“ wird beibehalten.
  alternative: „gegen den Norden vorgehen“
  rationale: Der hebräische Text beschreibt Gottes Gericht ausdrücklich mit körperhafter Bildsprache. Eine abstrakte Umschreibung würde die prophetische Rhetorik abschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kräftige prophetische Bildsprache bleibt erhalten; die zwei deutschen Hauptsätze vermeiden eine schwerfällige Reihung. Der Fußnotenmarker steht bei dem Ausdruck, auf den sich die lexikalische Alternative tatsächlich bezieht.
