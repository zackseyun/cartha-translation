id: ZEP.2.5
reference: Zephaniah 2:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: ה֗וֹי יֹֽשְׁבֵ֛י חֶ֥בֶל הַ/יָּ֖ם גּ֣וֹי כְּרֵתִ֑ים דְּבַר יְהוָ֣ה עֲלֵי/כֶ֗ם כְּנַ֨עַן֙ אֶ֣רֶץ פְּלִשְׁתִּ֔ים וְ/הַאֲבַדְתִּ֖י/ךְ מֵ/אֵ֥ין יוֹשֵֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/005.yaml
  text: Woe[a], inhabitants of the seacoast, nation of the Cherethites! The word of Yahweh is against you, Canaan, land of the Philistines; and I will destroy you until no inhabitant remains.
translation:
  language: de
  text: Wehe, ihr Bewohner des Küstenstreifens, Volk der Keretiter![a] Das Wort Jahwes richtet sich gegen euch, Kanaan, Land der Philister. Ich werde dich vernichten, sodass kein Bewohner mehr da ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch כְּרֵתִים (Keretim); auch „Kreter“ oder traditionell „Krethi“ wiedergegeben. Ob damit unmittelbar Menschen von Kreta gemeint sind, bleibt umstritten.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Wehe
  rationale: Die prophetische Interjektion kündigt Gericht an; „Wehe“ bewahrt ihre eindringliche, unheilverkündende Kraft.
- source_word: יֹשְׁבֵי חֶבֶל הַיָּם
  choice: ihr Bewohner des Küstenstreifens
  rationale: חֶבֶל bezeichnet hier das Gebiet beziehungsweise den Landstrich am Meer. „Küstenstreifen“ ist geografisch präzise und im Deutschen natürlich.
- source_word: גּוֹי כְּרֵתִים
  choice: Volk der Keretiter
  rationale: גּוֹי wird im vokativischen Beisatz passend mit „Volk“ wiedergegeben. „Keretiter“ gibt den hebräischen Volksnamen wieder, ohne die mögliche Gleichsetzung mit Kretern stillschweigend festzulegen.
- source_word: דְּבַר יְהוָה
  choice: Das Wort Jahwes
  rationale: Die feste prophetische Formel bleibt transparent erhalten; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: עֲלֵיכֶם
  choice: richtet sich gegen euch
  rationale: Im Gerichtszusammenhang bezeichnet die Präposition die feindliche Ausrichtung des göttlichen Wortes; diese Formulierung ist zugleich klar und idiomatisch.
- source_word: כְּנַעַן אֶרֶץ פְּלִשְׁתִּים
  choice: Kanaan, Land der Philister
  rationale: Die appositionelle Benennung bleibt erhalten und bewahrt sowohl die geografische als auch die rhetorische Spannung des Ausgangstextes.
- source_word: וְהַאֲבַדְתִּיךְ
  choice: Ich werde dich vernichten
  rationale: Das Hifil von אבד mit femininem Singularsuffix bezeichnet die Vernichtung des als Land angesprochenen Kanaan; der Wechsel vom pluralischen „euch“ zum singularischen „dich“ wird bewahrt.
- source_word: מֵאֵין יוֹשֵׁב
  choice: sodass kein Bewohner mehr da ist
  rationale: Die Wendung beschreibt vollständige Entvölkerung. Die deutsche Formulierung gibt das Resultat klar wieder, ohne über den hebräischen Text hinauszugehen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Gottesnamen im modernen Deutschen unmittelbar wieder.
- issue: Wechsel der angeredeten Größe von Plural zu femininem Singular
  choice: „gegen euch“ … „dich vernichten“
  alternative: Beide Anreden grammatisch angleichen
  rationale: Der Ausgangstext spricht zunächst die Bewohner beziehungsweise das Volk im Plural und anschließend Kanaan als Land im femininen Singular an. Diese rhetorische Verschiebung wird nicht eingeebnet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter prophetischer Gerichtsansage. Die Anrede bleibt kraftvoll, der ungewöhnliche Numeruswechsel des Hebräischen wird bewusst erhalten.
