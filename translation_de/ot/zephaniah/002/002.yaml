source:
  edition: WLC
  text: בְּ/טֶ֨רֶם֙ לֶ֣דֶת חֹ֔ק כְּ/מֹ֖ץ עָ֣בַר י֑וֹם בְּ/טֶ֣רֶם לֹא יָב֣וֹא עֲלֵי/כֶ֗ם חֲרוֹן֙ אַף יְהוָ֔ה בְּ/טֶ֨רֶם֙ לֹא יָב֣וֹא עֲלֵי/כֶ֔ם י֖וֹם אַף יְהוָֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/002.yaml
  text: before the decree gives birth—before the day passes away like chaff—before the burning anger of Yahweh comes upon you[c][b][a], before the day of Yahweh’s anger comes upon you.
translation:
  language: de
  text: Ehe der Beschluss gebiert[a], ehe der Tag wie Spreu vorüberzieht[b], ehe Jahwes glühender Zorn über euch kommt, ehe der Tag von Jahwes Zorn über euch kommt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „ehe der Beschluss wirksam wird“. Wörtlich steht hier das ungewöhnliche Bild, dass der Beschluss „gebiert“; gemeint sein kann sein Hervortreten oder seine Ausführung.'
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Formulierung ist sehr knapp; auch die genaue Zuordnung von „wie Spreu“ und „der Tag zieht vorüber“ lässt sich unterschiedlich auffassen.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: ehe
  rationale: Die dreimalige temporale Einleitung wird anaphorisch mit „ehe“ wiedergegeben; das wahrt die eindringliche, poetische Warnung.
- source_word: לֶדֶת חֹק
  choice: der Beschluss gebiert
  rationale: Die ungewöhnliche Geburtsmetapher des hebräischen Textes bleibt bewusst erhalten. „Beschluss“ bezeichnet hier eher eine festgesetzte Entscheidung als ein allgemeines Gesetz.
- source_word: כְּמֹץ עָבַר יוֹם
  choice: der Tag wie Spreu vorüberzieht
  rationale: „Spreu“ bewahrt das Bild des Leichten und rasch Vergehenden; „vorüberzieht“ gibt עבר idiomatisch wieder, ohne die knappe poetische Fügung unnötig auszudeuten.
- source_word: חֲרוֹן אַף
  choice: glühender Zorn
  rationale: Die Wendung bezeichnet heftigen, gleichsam brennenden Zorn. „Glühend“ erhält das Wärmebild und klingt im Deutschen natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: יָבוֹא עֲלֵיכֶם
  choice: über euch kommt
  rationale: Die übliche Gerichtswendung wird klar und richtungsgetreu ins Deutsche übertragen.
- source_word: יוֹם אַף יְהוָה
  choice: der Tag von Jahwes Zorn
  rationale: Die hebräische Genitivverbindung wird direkt wiedergegeben, ohne sie zur feststehenden Formel „Tag Jahwes“ umzuformen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen; die Transliteration bewahrt diesen Unterschied gegenüber einem bloßen Titel.
- issue: Geburtsbild in לֶדֶת חֹק
  choice: die Metapher mit „der Beschluss gebiert“ bewahren
  alternative: „der Beschluss wirksam wird“ oder „der Beschluss geboren wird“
  rationale: Die ungewöhnliche Formulierung des Ausgangstextes soll nicht stillschweigend in eine abstrakte Aussage über Vollzug oder Inkrafttreten aufgelöst werden. Eine Fußnote nennt die sachlich mögliche Deutung.
- issue: Beziehung von כְּמֹץ zu עָבַר יוֹם
  choice: „der Tag wie Spreu vorüberzieht“
  alternative: „wie Spreu – der Tag ist vergangen“
  rationale: Die gewählte Fassung verbindet das Spreubild mit dem raschen Vergehen des Tages, lässt aber durch die Fußnote erkennen, dass die hebräische Poesie syntaktisch äußerst knapp ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst poetischer Anapher. Die befremdliche Geburtsmetapher und die knappe Syntax werden nicht geglättet; erläuternde Alternativen stehen in den Fußnoten.
