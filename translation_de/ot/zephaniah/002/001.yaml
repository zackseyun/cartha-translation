source:
  edition: WLC
  text: הִֽתְקוֹשְׁשׁ֖וּ וָ/ק֑וֹשּׁוּ הַ/גּ֖וֹי לֹ֥א נִכְסָֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/001.yaml
  text: Gather yourselves together[a], yes, gather, O shameless nation,
translation:
  language: de
  text: Sammelt euch, ja, sammelt euch, schamloses Volk[a]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: „Volk, das nicht begehrt wird“ oder „Volk ohne Verlangen“. Der hebräische Ausdruck ist schwer zu deuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְקוֹשְׁשׁוּ
  choice: Sammelt euch
  rationale: Der Hitpolel-Imperativ Plural von קשׁשׁ ruft hier idiomatisch und reflexiv zum Zusammenkommen oder Sich-Sammeln auf. Die wörtliche Grundbedeutung des Stammes, Stroh oder Stoppeln zu sammeln, passt im Zusammenhang weniger gut.
- source_word: וָקֹשּׁוּ
  choice: ja, sammelt euch
  rationale: Der zweite Imperativ wiederholt und verstärkt den ersten. „Ja“ gibt dem verbindenden ו die emphatische Wirkung in natürlichem Deutsch, während die hebräische Wiederholung gewahrt bleibt.
- source_word: הַגּוֹי
  choice: Volk
  rationale: גּוֹי kann „Nation“ oder „Volk“ bedeuten. In der direkten prophetischen Anrede klingt „Volk“ im Deutschen natürlicher und bewahrt den kollektiven Sinn.
- source_word: לֹא נִכְסָף
  choice: schamloses
  rationale: Die schwierige Wendung bedeutet formal etwa „nicht ersehnt/begehrt“. Im Kontext wird sie häufig als moralischer Vorwurf verstanden; „schamloses“ gibt diese wahrscheinliche idiomatische Bedeutung wieder. Die wörtlicheren Möglichkeiten stehen wegen der echten lexikalischen Unsicherheit in der Fußnote.
theological_decisions:
- issue: Charakterisierung des angesprochenen Volkes durch לֹא נִכְסָף
  choice: schamloses Volk
  alternative: nicht begehrtes Volk / Volk ohne Verlangen
  rationale: „Schamlos“ passt zur prophetischen Mahnung und ist eine anerkannte kontextuelle Deutung, geht jedoch über die formale Bedeutung der Wörter hinaus. Darum wird die Spannung nicht stillschweigend aufgelöst, sondern durch eine Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit eindringlicher prophetischer Wiederholung. Die Anrede bleibt knapp und direkt; die schwierige hebräische Wendung wird im Haupttext idiomatisch und in der Fußnote formal näher wiedergegeben.
