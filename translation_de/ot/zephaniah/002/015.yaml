base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/015.yaml
  text: This is the exultant city that lived securely[a], that said in her heart, ‘I am, and there is none besides me.’ How she has become a desolation[b], a resting place for wild animals! Everyone who passes by her will hiss and wave his hand.
translation:
  language: de
  text: 'Das ist die ausgelassene Stadt, die in Sicherheit lebte und in ihrem Herzen sagte: »Ich bin, und außer mir gibt es niemanden.« Wie ist sie zur Einöde[a] geworden, zu einem Lagerplatz für wilde Tiere! Jeder, der an ihr vorbeikommt, wird sie auszischen[b] und mit der Hand abwinken.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zu einem Bild des Schreckens«. Das hebräische Wort kann neben der Verwüstung auch das Entsetzen bezeichnen, das sie hervorruft.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »wird pfeifen«. Das hebräische Verb kann einen scharfen Laut der Verwunderung oder des Spotts bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעִיר הָעַלִּיזָה
  choice: die ausgelassene Stadt
  rationale: „Ausgelassen“ gibt die freudig-selbstzufriedene Haltung der Stadt in natürlichem Deutsch wieder, ohne den Ausdruck auf bloße Freude oder Sorglosigkeit zu verengen.
- source_word: הַיּוֹשֶׁבֶת לָבֶטַח
  choice: die in Sicherheit lebte
  rationale: Die partizipiale Wendung bezeichnet einen anhaltenden Zustand sicheren Wohnens; die deutsche Formulierung ist gegenwärtig und idiomatisch.
- source_word: הָאֹמְרָה בִּלְבָבָהּ
  choice: in ihrem Herzen sagte
  rationale: Bewahrt das hebräische Bild innerer Selbstrede und die weibliche Personifikation der Stadt.
- source_word: אֲנִי וְאַפְסִי עוֹד
  choice: Ich bin es, und außer mir gibt es keine
  rationale: Bewahrt den absoluten, selbstüberheblichen Ausschließlichkeitsanspruch und seinen auffälligen Anklang an Aussagen göttlicher Einzigkeit.
- source_word: לְשַׁמָּה
  choice: zur Einöde
  rationale: „Einöde“ bezeichnet hier knapp und anschaulich den verwüsteten, verlassenen Zustand; die mögliche Schreckensnuance wird in der Fußnote erhalten.
- source_word: מַרְבֵּץ לַחַיָּה
  choice: ein Lagerplatz für wilde Tiere
  rationale: Gibt den Ort wieder, an dem Tiere sich niederlegen; „wilde Tiere“ passt zum Bild einer unbewohnten Ruinenstätte.
- source_word: יִשְׁרֹק
  choice: wird sie auszischen
  rationale: „Auszischen“ vermittelt im Deutschen den gegen die Stadt gerichteten Laut des Spotts; die ebenfalls mögliche Bedeutung „pfeifen“ bleibt in der Fußnote sichtbar.
- source_word: יָנִיעַ יָדוֹ
  choice: mit der Hand abwinken
  rationale: Die idiomatische deutsche Wendung bezeichnet eine verächtliche oder abweisende Handbewegung, ohne das Bild durch das missverständliche „die Hand schütteln“ zu verfälschen.
theological_decisions:
- issue: Der Ausschließlichkeitsanspruch der Stadt in אֲנִי וְאַפְסִי עוֹד
  choice: Ich bin es, und außer mir gibt es keine
  alternative: Ich bin es, und sonst gibt es nichts
  rationale: Die gewählte Formulierung lässt den bewussten Anklang an Aussagen von der einzigartigen Souveränität des HERRN bestehen, die hier ironisch und anmaßend von der stolzen Stadt auf sich selbst bezogen werden. Sie löst die Spannung nicht erklärend auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die weibliche Personifikation der Stadt bleibt erhalten. „Ausgelassen“ bewahrt den Ton selbstzufriedener Freude; „mit der Hand abwinken“ vermeidet im Deutschen die irreführende Vorstellung des Händeschüttelns.
