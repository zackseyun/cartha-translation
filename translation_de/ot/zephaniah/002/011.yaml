source:
  edition: WLC
  text: נוֹרָ֤א יְהוָה֙ עֲלֵי/הֶ֔ם כִּ֣י רָזָ֔ה אֵ֖ת כָּל אֱלֹהֵ֣י הָ/אָ֑רֶץ וְ/יִשְׁתַּֽחֲווּ ל/וֹ֙ אִ֣ישׁ מִ/מְּקוֹמ֔/וֹ כֹּ֖ל אִיֵּ֥י הַ/גּוֹיִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/011.yaml
  text: Yahweh will be fearsome against them[a], for he will make all the gods of the earth waste away; and they will bow down to him, each from his own place[b], all the coastlands of the nations.
translation:
  language: de
  text: Jahwe wird sich furchtbar gegen sie erweisen, denn er wird alle Götter der Erde auszehren[a]; und sie werden sich vor ihm niederwerfen, jeder von seinem Ort aus – alle Küstenländer der Nationen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aushungern“. Das hebräische Verb bezeichnet wörtlich das Mager- oder Ausgezehrtwerden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „alle Inseln der Nationen“. „Küstenländer“ ist in prophetischer Sprache eine geläufige Bezeichnung für ferne maritime Völker und Gebiete.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹרָא
  choice: furchtbar
  rationale: Das prädikative Adjektiv bezeichnet jemanden, der Furcht oder ehrfürchtigen Schrecken hervorruft. „Furchtbar“ bewahrt diesen Sinn in knapper, würdiger Sprache.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עֲלֵיהֶם
  choice: für sie
  rationale: In der Verbindung „für sie furchtbar sein“ bringt die Formulierung verständlich zum Ausdruck, dass Jahwes furchterregendes Handeln gegen die zuvor genannten Völker gerichtet ist.
- source_word: רָזָה
  choice: auszehren
  rationale: Das Verb gehört zum Bildfeld des Mager- und Ausgezehrtwerdens. „Auszehren“ erhält das drastische Bild, ohne dessen konkrete Deutung vorwegzunehmen.
- source_word: אֵת כָּל אֱלֹהֵי הָאָרֶץ
  choice: alle Götter der Erde
  rationale: Die direkte Wiedergabe bewahrt die polemische Rede des Textes über die Gottheiten der Völker und den weltweiten Horizont.
- source_word: וְיִשְׁתַּחֲווּ לוֹ
  choice: Sie werden sich vor ihm niederwerfen
  rationale: Die Formulierung hält sowohl die körperliche Geste des Sich-Niederwerfens als auch ihren kultischen Sinn offen.
- source_word: אִישׁ מִמְּקוֹמוֹ
  choice: jeder von seinem Ort aus
  rationale: „Jeder“ gibt die distributive Einzahl wieder; „von seinem Ort aus“ wahrt die natürliche Bedeutung der Präposition und das Bild dezentralen Gottesdienstes.
- source_word: כֹּל אִיֵּי הַגּוֹיִם
  choice: alle Küstenländer der Nationen
  rationale: „Küstenländer“ entspricht dem prophetischen Sprachgebrauch für ferne maritime Gebiete und lässt den möglichen wörtlichen Sinn „Inseln“ in der Fußnote sichtbar.
theological_decisions:
- issue: Wie die Aussage über „alle Götter der Erde“ wiederzugeben ist
  choice: Die Götter werden als „Götter“ bezeichnet, und Jahwe „zehrt“ sie aus.
  alternative: Die Götter ausdrücklich als bloße Götzen bezeichnen oder die Aussage als Vernichtung falscher Religion paraphrasieren.
  rationale: Der hebräische Text verwendet ausdrücklich אֱלֹהִים und formuliert eine polemische Aussage über Jahwes Überlegenheit. Die Übersetzung vermeidet eine darüber hinausgehende metaphysische Erklärung.
- issue: Ob die Schlusswendung eine Wallfahrt oder weltweite Anbetung an verschiedenen Orten beschreibt
  choice: „jeder von seinem Ort aus“
  alternative: „jeder an seinem Ort“ oder eine Wallfahrt zu einem einzigen Heiligtum ausdrücklich machen.
  rationale: Die Präposition מִן wird am natürlichsten mit „von … aus“ wiedergegeben. So bleibt das Bild von Anbetung aus verstreuten Orten erhalten, ohne mehr festzulegen, als der Text sagt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bewahrt das ausdrücklich gesetzte Verb „sie werden sich niederwerfen“ und stellt „alle Küstenländer der Nationen“ wie im Hebräischen erläuternd ans Ende. Die Gedankenstrichkonstruktion macht diese nachgestellte Apposition im Deutschen verständlich.
