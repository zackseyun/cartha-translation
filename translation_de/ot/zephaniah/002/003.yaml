  text: בַּקְּשׁ֤וּ אֶת יְהוָה֙ כָּל עַנְוֵ֣י הָ/אָ֔רֶץ אֲשֶׁ֥ר מִשְׁפָּט֖/וֹ פָּעָ֑לוּ בַּקְּשׁוּ צֶ֨דֶק֙ בַּקְּשׁ֣וּ עֲנָוָ֔ה אוּלַי֙ תִּסָּ֣תְר֔וּ בְּ/י֖וֹם אַף יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/003.yaml
  text: Seek Yahweh[a], all you humble of the land, who have carried out his justice; seek righteousness, seek humility[d][c][b]; perhaps you will be hidden in the day of Yahweh’s anger.
translation:
  language: de
  text: Sucht Jahwe, all ihr Demütigen des Landes[a], die ihr nach seinem Recht gehandelt habt[b]! Sucht Gerechtigkeit[c], sucht Demut! Vielleicht werdet ihr am Tag des Zorns Jahwes verborgen werden[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Erde“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die ihr seine Rechtsordnung befolgt habt“; wörtlicher: „die ihr sein Recht ausgeübt habt“.'
    reason: lexical_alternative
  - marker: c
    text: Auch im Sinn von „Recht“ oder „das Rechte“.
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „versteckt“ beziehungsweise „geschützt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּקְּשׁוּ
  choice: Sucht
  rationale: Der pluralische Imperativ ist ein unmittelbarer Aufruf. Die dreimalige Wiederholung wird als prägendes rhetorisches Element bewahrt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen geläufige Umschrift des Gottesnamens bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- source_word: עַנְוֵי הָאָרֶץ
  choice: ihr Demütigen des Landes
  rationale: עַנְוֵי bezeichnet Demütige, Sanftmütige oder Niedrige. „Demütigen“ entspricht der späteren Aufforderung, Demut zu suchen; „Land“ passt zum prophetischen Adressatenkreis, ohne die mögliche Bedeutung „Erde“ auszuschließen.
- source_word: אֲשֶׁר מִשְׁפָּטוֹ פָּעָלוּ
  choice: die ihr nach seinem Recht handelt
  rationale: פּעל bezeichnet Tun oder Ausüben, מִשְׁפָּט Recht, Gericht, Rechtsordnung oder Rechtsspruch. Die Formulierung ist idiomatisch und bewahrt den aktiven Gehorsam gegenüber Jahwes Recht.
- source_word: צֶדֶק
  choice: Gerechtigkeit
  rationale: Das Wort umfasst Gerechtigkeit, Recht und das, was richtig ist. „Gerechtigkeit“ wahrt hier die ethische und relationale Breite.
- source_word: עֲנָוָה
  choice: Demut
  rationale: Das Substantiv bezeichnet Demut, Sanftmut oder Niedrigkeit. „Demut“ ist im modernen Deutsch klar und stellt die Wortverbindung zu den zuvor angeredeten Demütigen her.
- source_word: אוּלַי
  choice: Vielleicht
  rationale: Das Adverb drückt eine Möglichkeit und keine Gewissheit aus; die prophetische Spannung bleibt erhalten.
- source_word: תִּסָּתְרוּ
  choice: werdet ihr verborgen
  rationale: Der Nifal von סתר bezeichnet das Verborgen- oder Verstecktwerden. „Verborgen“ bleibt näher am Bild als das stärker deutende „geschützt“; die Unsicherheit wird bereits durch „vielleicht“ ausgedrückt.
- source_word: בְּיוֹם אַף יְהוָה
  choice: am Tag des Zorns Jahwes
  rationale: אַף bezeichnet hier Zorn. „Am Tag“ ist natürliches Deutsch und „Zorn Jahwes“ gibt die Genitivverbindung knapp und würdig wieder.
theological_decisions:
- issue: Ob der Vers sicheren Schutz verheißt oder nur die Möglichkeit des Schutzes eröffnet
  choice: „Vielleicht werdet ihr verborgen“ drückt Möglichkeit, nicht Gewissheit aus.
  alternative: Der Vers garantiert dem gerechten Rest die Rettung.
  rationale: אוּלַי kennzeichnet ausdrücklich eine offene Möglichkeit. Die Übersetzung macht daraus keine sichere Verheißung und bewahrt so die theologische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreifache Aufforderung „Sucht“ bleibt erhalten. Die Satzstellung ist leicht gehoben, aber gut verständlich; weder die mögliche Bedeutung „Erde“ noch die Ungewissheit von אוּלַי wird im Haupttext dogmatisch eingeengt.
