  text: אֹהֵ֥ב כֶּ֨סֶף֙ לֹא יִשְׂבַּ֣ע כֶּ֔סֶף וּ/מִֽי אֹהֵ֥ב בֶּ/הָמ֖וֹן לֹ֣א תְבוּאָ֑ה גַּם זֶ֖ה הָֽבֶל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/009.yaml
  text: Whoever loves silver will not be satisfied with silver[a], nor whoever loves abundance with income[b]; this too is vapor.
translation:
  language: de
  text: Wer Geld liebt, wird vom Geld nicht satt; und wer Reichtum liebt, wird vom Ertrag nicht satt.[a] Auch das ist Dunst.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der zweite Satzteil ist im Hebräischen syntaktisch schwierig und elliptisch. Die Übersetzung ergänzt „wird … nicht satt“ aus dem ersten Satzglied. Möglich ist auch: „Wer Reichtum liebt, hat keinen Ertrag.“ „Reichtum“ kann auch „Überfluss“ und „Ertrag“ auch „Zuwachs“ oder „Gewinn“ bedeuten.'
    reason: alternative_reading
  - marker: b
    text: Hebräisch „Dunst“ (traditionell oft „Nichtigkeit“ oder „Eitelkeit“); ein Leitwort des Predigerbuches für das, was flüchtig, unfassbar oder ohne Bestand ist.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֵב
  choice: wer … liebt
  rationale: Das Partizip bezeichnet allgemein jeden Menschen, dessen Haltung von dieser Liebe geprägt ist. Die Formulierung ist im modernen Deutsch natürlich und bewahrt den allgemeinen Sinn.
- source_word: כֶּסֶף
  choice: Geld
  rationale: Das hebräische Wort bedeutet wörtlich „Silber“, bezeichnet aber häufig metonymisch Geld. „Geld“ gibt den gemeinten Sinn im heutigen Deutsch unmittelbar wieder; die Wiederholung des Ausgangstextes bleibt erhalten.
- source_word: יִשְׂבַּע
  choice: wird … nicht satt
  rationale: Das Verb bezeichnet Sättigung beziehungsweise Genughaben. Die Wendung drückt die hier gemeinte Unersättlichkeit knapp und anschaulich aus.
- source_word: וּמִי
  choice: und wer
  rationale: Die Verbindung wird als Einleitung eines parallelen allgemeinen Satzes verstanden. „Und wer“ bewahrt die formale Verknüpfung, ohne die schwierige Konstruktion als echte Frage festzulegen.
- source_word: בֶּהָמוֹן
  choice: Überfluss
  rationale: הָמוֹן kann eine Menge, Fülle oder Reichtum bezeichnen. „Überfluss“ wahrt die Bedeutungsbreite und passt zur Parallelität mit der Liebe zum Geld.
- source_word: תְבוּאָה
  choice: Ertrag
  rationale: Das Substantiv bezeichnet Ernte, Zuwachs oder Gewinn. „Ertrag“ lässt sowohl den landwirtschaftlichen als auch den wirtschaftlichen Sinn anklingen und legt sich weniger eng als „Einkommen“ fest.
- source_word: הָבֶל
  choice: Dunst
  rationale: Das Leitwort des Predigerbuches bezeichnet wörtlich Atemhauch oder Dunst und steht für das Flüchtige, Unfassbare und Unbeständige. „Dunst“ bewahrt das konkrete Bild, ohne es vorschnell als „sinnlos“ auszudeuten.
theological_decisions:
- issue: Wiedergabe des Leitworts הָבֶל im Predigerbuch
  choice: Dunst
  alternative: Nichtigkeit; Hauch; sinnlos
  rationale: „Dunst“ erhält die bildhafte und mehrdeutige Aussage über Flüchtigkeit, Unfassbarkeit und mangelnde Dauer. Eine abstrakte Wiedergabe wie „sinnlos“ würde die theologische und existenzielle Spannung auf nur eine Deutung verengen.
- issue: Aussage des syntaktisch schwierigen zweiten Satzglieds
  choice: Parallele Aussage über die Unersättlichkeit dessen, der Überfluss liebt
  alternative: Wer Reichtum liebt, hat keinen Ertrag; oder eine elliptische beziehungsweise fragende Lesart
  rationale: Die parallele Wiedergabe folgt dem Zusammenhang und der Struktur des Verses, kennzeichnet die syntaktische Unsicherheit jedoch in der Fußnote, statt sie als zweifelsfrei auszugeben.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper weisheitlicher Satzform. Die Wiederholung von „Geld“ und „nicht satt“ bildet den Parallelismus deutlich ab. „Ertrag“ wahrt bewusst die wirtschaftliche und landwirtschaftliche Bedeutungsbreite; „Dunst“ hält die Leitmetapher offen.
