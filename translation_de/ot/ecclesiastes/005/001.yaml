base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/001.yaml
  text: Do not be hasty with your mouth[a], and do not let your heart be quick to bring forth a word before God, for God is in heaven and you are on earth. Therefore let your words be few.
translation:
  language: de
  text: Sei nicht vorschnell im Reden[a], und dein Herz soll nicht eilen, ein Wort vor Gott hervorzubringen. Denn Gott ist im Himmel, und du bist auf der Erde. Darum sollen deine Worte wenige sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sei nicht vorschnell, etwas auszusprechen.“ Im Zusammenhang können unbedachte Gelübde mitgemeint sein; der hebräische Wortlaut spricht hier jedoch allgemeiner vom Reden vor Gott.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּבַהֵל עַל־פִּיךָ
  choice: Sei nicht vorschnell mit deinem Mund
  rationale: בהל bezeichnet hier hastiges oder unbedachtes Handeln. Die Wiedergabe bewahrt das konkrete Bild des Mundes und warnt allgemein vor vorschnellem Reden.
- source_word: לִבְּךָ
  choice: dein Herz
  rationale: Das hebräische Herz umfasst Denken, Wollen und das innere Selbst; die körperhafte Ausdrucksweise bleibt im Deutschen verständlich.
- source_word: אַל־יְמַהֵר
  choice: soll nicht übereilt
  rationale: מהר bezeichnet Eile. „Übereilt“ bringt die unangemessene Hast zum Ausdruck und passt natürlich zum Hervorbringen eines Wortes.
- source_word: לְהוֹצִיא דָבָר
  choice: ein Wort hervorbringen
  rationale: Die Formulierung bildet das konkrete hebräische „ein Wort herausbringen“ relativ eng ab, ohne den Sinn auf ein Gelübde oder Versprechen einzuengen.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: vor Gott
  rationale: Dies ist eine knappe, natürliche Wiedergabe der räumlich-präsentischen Wendung und wahrt den feierlichen Bezug auf Gottes Gegenwart.
- source_word: בַּשָּׁמַיִם
  choice: im Himmel
  rationale: Obwohl שׁמים formal pluralisch ist, bezeichnet es hier idiomatisch den Himmel als Gegenpol zur Erde.
- source_word: עַל־הָאָרֶץ
  choice: auf der Erde
  rationale: Die Wiedergabe erhält den ausdrücklichen räumlichen Gegensatz zwischen Gott im Himmel und dem Menschen auf der Erde.
- source_word: עַל־כֵּן
  choice: Darum
  rationale: Die Folgerung aus dem Himmel-Erde-Gegensatz wird in modernem, würdigem Deutsch klar markiert.
- source_word: יִהְיוּ דְבָרֶיךָ מְעַטִּים
  choice: sollen deine Worte wenige sein
  rationale: Die jussivische Mahnung wird unmittelbar wiedergegeben; zugleich bleibt die prägnante hebräische Formulierung erhalten.
theological_decisions:
- issue: Ob die Aussage ausdrücklich auf Gelübde oder Versprechen im Gottesdienst zu beschränken ist
  choice: Die allgemeinere Rede von einem Wort vor Gott bleibt erhalten.
  alternative: „Lege nicht vorschnell ein Gelübde vor Gott ab.“
  rationale: Der folgende Zusammenhang behandelt Gelübde, doch dieser Vers selbst spricht weiter gefasst vom Hervorbringen eines Wortes. Die Übersetzung legt die mögliche Anwendung auf Gelübde daher nicht als alleinigen Sinn fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter hebräischer Bildsprache. „Vorschnell“, „übereilt“ und „hervorbringen“ halten die Parallelität und die konkrete Ausdrucksweise aufrecht, ohne den Vers konfessionell oder kontextuell auf Gelübde zu verengen.
