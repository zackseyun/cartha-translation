base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/003.yaml
  text: When you make a vow to God[a], do not delay in paying it, for he takes no pleasure in fools[b]. Pay what you vow.
translation:
  language: de
  text: Wenn du Gott ein Gelübde ablegst, zögere nicht, es zu erfüllen[a], denn an den Toren hat er kein Gefallen.[b] Was du gelobst, das erfülle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „es zu bezahlen.“ Das hebräische Verb kann das Bezahlen, Vollenden oder Erfüllen des Gelobten bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „denn an den Toren ist kein Gefallen“; das Subjekt bleibt im Hebräischen unausgesprochen. Dem Zusammenhang nach ist gemeint, dass Gott an ihnen kein Gefallen hat.'
    reason: alternative_reading
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Wenn
  rationale: Leitet den zeitlichen Fall ein, in dem jemand ein Gelübde ablegt; „Wenn“ ist im Deutschen natürlich und bewahrt den mahnenden Charakter.
- source_word: תִּדֹּר נֶדֶר
  choice: ein Gelübde ablegst
  rationale: Gibt die hebräische figura etymologica idiomatisch wieder und bezeichnet einen förmlichen Gelübdeakt.
- source_word: לֵאלֹהִים
  choice: Gott
  rationale: Der gottesdienstliche Zusammenhang verlangt hier die singularische Bezeichnung Gottes.
- source_word: אַל תְּאַחֵר
  choice: zögere nicht
  rationale: Drückt das verbotene Hinausschieben knapp und idiomatisch aus.
- source_word: לְשַׁלְּמוֹ
  choice: es zu erfüllen
  rationale: שׁלם kann das Bezahlen, Vollenden oder Erfüllen des Gelobten bezeichnen. Bei einem Gelübde ist „erfüllen“ im Deutschen natürlich und umfasst auch nichtmaterielle Verpflichtungen.
- source_word: כִּי אֵין חֵפֶץ
  choice: denn … hat er kein Gefallen
  rationale: Die hebräische Aussage lässt das Subjekt unausgesprochen; aus dem unmittelbaren Zusammenhang ist Gott als Bezug naheliegend.
- source_word: בַּכְּסִילִים
  choice: an den Toren
  rationale: „Toren“ bewahrt die ethisch-religiöse Kategorie der Weisheitsliteratur und bezeichnet nicht bloß mangelnde Intelligenz.
- source_word: אֵת אֲשֶׁר תִּדֹּר שַׁלֵּם
  choice: Was du gelobst, das erfülle
  rationale: Die Voranstellung des Objekts und das abschließende Gebot bleiben erkennbar; die Formulierung ist würdig und im Deutschen verständlich.
theological_decisions:
- issue: Unausgesprochenes Subjekt in כִּי אֵין חֵפֶץ בַּכְּסִילִים
  choice: Gott als durch „er“ aufgenommenes Subjekt
  alternative: 'Unpersönlich: „denn an Toren besteht kein Gefallen“'
  rationale: Der unmittelbare Kontext handelt von einem Gott abgelegten Gelübde. Die Ergänzung macht den naheliegenden Bezug verständlich, während eine Fußnote die Ellipse des Hebräischen offenlegt.
- issue: Ethischer Sinn von כְּסִילִים
  choice: Toren
  alternative: Narren; Unverständige
  rationale: „Toren“ trägt im Kontext der Weisheitsliteratur die moralische und geistliche Bedeutung, ohne die Aussage auf geringe Intelligenz zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gelübde ablegen“ und „erfüllen“ sind geläufig und präzise; „Toren“ bewahrt bewusst den traditionellen Begriff der Weisheitsliteratur. Die Wiederholung von „erfüllen“ bildet die Wiederaufnahme desselben hebräischen Verbs ab.
