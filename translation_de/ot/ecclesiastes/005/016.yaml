base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/016.yaml
  text: Also[a], all his days he eats in darkness[b], with much vexation and sickness and anger.
translation:
  language: de
  text: Auch isst er all seine Tage in Finsternis[a], mit viel Verdruss[b], Krankheit und Zorn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „In Finsternis“ kann wörtlich verstanden werden oder bildlich für ein trostloses, freudloses Leben stehen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mit viel Kummer“ oder „mit viel Ärger“; die gedrängte hebräische Wendung kann Verdruss, Frustration oder Kummer bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Auch
  rationale: Bewahrt die ergänzende Funktion des hebräischen Ausdrucks und knüpft den Satz natürlich an den zuvor beschriebenen Zustand an.
- source_word: כָּל יָמָיו
  choice: all seine Tage
  rationale: Gibt die hebräische Zeitangabe bildnah wieder; „sein Leben lang“ wäre idiomatischer, würde aber die für Kohelet typische Rede von den „Tagen“ auflösen.
- source_word: בַּחֹשֶׁךְ
  choice: in Finsternis
  rationale: Bewahrt das konkrete Bild des hebräischen Nomens, ohne festzulegen, ob tatsächliche Dunkelheit oder ein trostloses, freudloses Leben gemeint ist.
- source_word: יֹאכֵל
  choice: isst er
  rationale: Das Imperfekt bezeichnet im Zusammenhang ein anhaltendes oder kennzeichnendes Verhalten; das deutsche Präsens gibt diesen Sinn natürlich wieder.
- source_word: וְכָעַס הַרְבֵּה
  choice: mit viel Verdruss
  rationale: Die gedrängte hebräische Fügung bezeichnet starke innere Erregung, Kränkung oder Bekümmernis. „Verdruss“ wahrt die Bedeutungsbreite besser als eine stärker festlegende Wiedergabe.
- source_word: חָלְיוֹ
  choice: Krankheit
  rationale: Das Nomen bezeichnet Krankheit oder Leiden. Die deutsche Reihung gibt den konkreten Sinn wieder, ohne eine zusätzliche verbale Aussage einzutragen.
- source_word: וָקָצֶף
  choice: und Zorn
  rationale: Das Nomen kann Zorn, Ärger oder Empörung bezeichnen. Hier liegt der verbitterte Zustand des Menschen näher als ein ausdrücklicher Hinweis auf göttlichen Zorn.
theological_decisions:
- issue: Bezug und Art von Finsternis
  choice: Die Bildsprache bleibt unaufgelöst.
  alternative: „in einem trostlosen Leben“
  rationale: Der hebräische Text lässt offen, ob die Finsternis wörtlich, metaphorisch oder in beiden Sinnen verstanden werden soll.
- issue: Träger des Zorns
  choice: „Zorn“ wird ohne nähere Bestimmung wiedergegeben.
  alternative: „Gottes Zorn“ oder „sein Zorn“
  rationale: Der hebräische Text nennt keinen ausdrücklichen Urheber oder Gegenstand des Zorns; eine nähere Festlegung würde die theologische Spannung unnötig auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusster Nähe zur Bildsprache Kohelets. Die leicht markierte Wendung „all seine Tage“ erhält den hebräischen Stil; die elliptische Schlussreihe wird durch „mit“ im Deutschen lesbar gemacht, ohne ihre inhaltliche Spannung zu glätten.
