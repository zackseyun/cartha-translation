translation:
  language: de
  text: 'Es gibt ein schlimmes Übel, das ich unter der Sonne gesehen habe: Reichtum, den sein Besitzer zu seinem Schaden bewahrt.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Reichtum, der für seinen Besitzer zu seinem Schaden bewahrt wird.“ Die hebräischen Präpositionen lassen das Verhältnis zwischen dem Reichtum, seinem Besitzer und dem schädlichen Ergebnis unterschiedlich ausdrücken; der Sinn bleibt im Wesentlichen gleich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ
  choice: Es gibt
  rationale: Die Existenzpartikel leitet die Beobachtung ein; „Es gibt“ entspricht der hebräischen Konstruktion in natürlichem modernem Deutsch.
- source_word: רָעָה חוֹלָה
  choice: ein schlimmes Übel
  rationale: חוֹלָה, wörtlich mit Krankheit verbunden, verstärkt רָעָה und bezeichnet hier ein schwerwiegendes, leidvolles Übel. „Schlimmes Übel“ bewahrt das Gewicht, ohne die hebräische Wendung unnatürlich wörtlich wiederzugeben.
- source_word: רָאִיתִי
  choice: das ich … gesehen habe
  rationale: Das Perfekt berichtet von einer persönlichen Beobachtung des Sprechers; das deutsche Perfekt ist hier natürlich.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: unter der Sonne
  rationale: Die wiederkehrende Formel des Predigerbuches wird wörtlich und konsistent beibehalten.
- source_word: עֹשֶׁר
  choice: Reichtum
  rationale: „Reichtum“ ist eine natürliche moderne Entsprechung des abstrakten Nomens.
- source_word: שָׁמוּר
  choice: aufbewahrt wird
  rationale: Das passive Partizip beschreibt Reichtum, der behalten oder verwahrt wird. „Aufbewahrt“ lässt offen, ob besonders Horten, Bewachen oder bloßes Behalten gemeint ist.
- source_word: לִבְעָלָיו
  choice: für seinen Besitzer
  rationale: בעל bezeichnet hier den Besitzer. Das ל drückt am natürlichsten die Zuordnung aus; die passive Form vermeidet, dem Besitzer durch ein deutsches „von“ ausdrücklich eine im Hebräischen nicht eindeutig markierte Agensrolle zuzuschreiben.
- source_word: לְרָעָתוֹ
  choice: zu seinem eigenen Schaden
  rationale: Die Wendung bezeichnet die schädliche Folge für den Besitzer. „Eigenen“ verdeutlicht im Deutschen den Rückbezug des Suffixes, ohne den Sinn zu verändern.
