  naturalness: Die vorgeschlagene Fassung ist modernes, würdiges Standarddeutsch. „die ihn verbrauchen“ ist im wirtschaftlichen Zusammenhang klar; „der Anblick mit eigenen Augen“ gibt die hebräische Formel idiomatisch wieder, ohne ein Objekt hinzuzufügen.
  terminology: „Wohlstand“, „Besitzer“ und „Gewinn“ passen zum wirtschaftlichen Kontext. Der kollektive Bezug des Singulars wird im Deutschen mit „seine Besitzer“ und der distributiven Wendung „mit eigenen Augen“ sinnvoll wiedergegeben.
