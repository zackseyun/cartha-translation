  text: בִּ/רְבוֹת֙ הַ/טּוֹבָ֔ה רַבּ֖וּ אוֹכְלֶ֑י/הָ וּ/מַה כִּשְׁרוֹן֙ לִ/בְעָלֶ֔י/הָ כִּ֖י אִם ראית עֵינָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/010.yaml
  text: When goods increase[a], those who consume them increase[b]; and what advantage is there to their owners except the seeing of their eyes?
translation:
  language: de
  text: Wenn der Wohlstand wächst[a], werden auch die zahlreicher, die ihn verbrauchen. Und welchen Gewinn haben seine Besitzer außer dem Anblick mit eigenen Augen?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „das Gute“, „der Besitz“ oder „die Güter“. Das hebräische Wort kann Gutes oder Wohlergehen allgemein bezeichnen; der Zusammenhang legt materiellen Besitz oder Wohlstand nahe, der verbraucht und besessen werden kann.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „außer dem Sehen seiner Augen“. Nach „seine Besitzer“ steht im Hebräischen „seiner Augen“ im Singular; dies kann den einzelnen Besitzer jeweils meinen. Der Ausdruck hebt als einzigen Vorteil das bloße Sehen hervor.'
    reason: lexical_and_grammatical_clarification
lexical_decisions:
- source_word: בִּרְבוֹת
  choice: Wenn ... wächst
  rationale: Die Präposition ב mit dem Infinitiv von רבה hat hier zeitliche Bedeutung. „Wenn … wächst“ gibt dies in natürlichem Deutsch wieder.
- source_word: הַטּוֹבָה
  choice: der Wohlstand
  rationale: טוֹבָה kann Gutes, materiellen Besitz oder Wohlstand bezeichnen. Der Zusammenhang mit denen, die davon zehren, und mit Besitzern legt materiellen Wohlstand nahe, ohne den Ausdruck auf einzelne Waren zu verengen.
- source_word: רַבּוּ
  choice: werden auch die zahlreicher
  rationale: Die wiederholte Wurzel רבה wird durch „wächst … zahlreicher“ hörbar aufgenommen; zugleich klingt der Satz im Deutschen natürlich.
- source_word: אֹכְלֶיהָ
  choice: die davon zehren
  rationale: Wörtlich sind es „die sie essen“. Da sich das Wort auf Wohlstand beziehungsweise Besitz bezieht, vermittelt „davon zehren“ sowohl das Bild des Essens als auch den weiteren Sinn des Verbrauchens.
- source_word: וּמַה כִּשְׁרוֹן
  choice: Und welchen Gewinn haben ... davon
  rationale: כִּשְׁרוֹן bezeichnet hier Nutzen, Vorteil oder Gewinn. „Gewinn“ passt zur wirtschaftlichen Fragestellung und zur rhetorischen Form.
- source_word: לִבְעָלֶיהָ
  choice: seine Besitzer
  rationale: בעל bezeichnet einen Besitzer oder Eigentümer; die Form steht hier im Plural mit einem Suffix, das auf den Wohlstand zurückweist.
- source_word: כִּי אִם
  choice: außer
  rationale: Nach der rhetorischen Frage führt כִּי אִם den einzigen verbleibenden Nutzen ein.
- source_word: רְאִית עֵינָיו
  choice: dass ihre Augen ihn sehen
  rationale: Der hebräische Ausdruck lautet sehr konkret „das Sehen seiner Augen“. Die verbale deutsche Fassung wahrt das Augenmotiv und macht den gemeinten bloßen Anblick verständlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Davon zehren“ erhält das konkrete Bild des Essens, ohne den wirtschaftlichen Zusammenhang auf Lebensmittel zu beschränken. Die rhetorische Zuspitzung und der spannungsvolle Wechsel von pluralischen Besitzern zum singularischen Augen-Ausdruck werden nicht theologisch geglättet, sondern in einer Fußnote offengelegt.
