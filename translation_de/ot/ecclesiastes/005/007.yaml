  text: אִם עֹ֣שֶׁק רָ֠שׁ וְ/גֵ֨זֶל מִשְׁפָּ֤ט וָ/צֶ֨דֶק֙ תִּרְאֶ֣ה בַ/מְּדִינָ֔ה אַל תִּתְמַ֖הּ עַל הַ/חֵ֑פֶץ כִּ֣י גָבֹ֜הַּ מֵ/עַ֤ל גָּבֹ֨הַ֙ שֹׁמֵ֔ר וּ/גְבֹהִ֖ים עֲלֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/007.yaml
  text: If you see the oppression of the poor and the robbery of justice and righteousness in the province, do not be astonished at the matter; for a high official is watched by one higher, and there are even higher ones over them.
translation:
  language: de
  text: Wenn du in der Provinz die Unterdrückung der Armen[a] und den Raub von Recht und Gerechtigkeit[b] siehst, sei darüber nicht erstaunt; denn über einen hohen Amtsträger wacht ein Höherer, und über ihnen stehen noch Höhere.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Ausbeutung der Armen“ beziehungsweise „die Erpressung der Armen“. Das hebräische Wort kann allgemeine Unterdrückung wie auch ausbeuterische Wegnahme bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Plünderung von Recht und Gerechtigkeit“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „Denn ein Hoher wacht über einen Hohen, und Hohe sind über ihnen.“ Gemeint sein können mehrere Ebenen menschlicher Amtsträger; zugleich kann eine letztgültige göttliche Aufsicht mitschwingen.'
    reason: alternative_reading
lexical_decisions:
- source_word: עֹשֶׁק
  choice: Unterdrückung
  rationale: Das Substantiv bezeichnet bedrückende Ausbeutung bis hin zu Erpressung. „Unterdrückung“ gibt den sozialen Unrechtskontext breit und natürlich wieder.
- source_word: רָשׁ
  choice: die Armen
  rationale: Das substantivierte Adjektiv bezeichnet arme oder bedürftige Menschen. Der Plural ist im Deutschen eine idiomatische kollektive Wiedergabe.
- source_word: גֵזֶל
  choice: Raub
  rationale: Das Wort bezeichnet gewaltsames Wegnehmen oder Beraubung. „Raub an Recht und Gerechtigkeit“ bewahrt das eindringliche Bild, dass die Rechtsordnung ihrer Wirkung beraubt wird.
- source_word: מִשְׁפָּט וָצֶדֶק
  choice: Recht und Gerechtigkeit
  rationale: מִשְׁפָּט verweist hier auf geordnetes Recht und gerechtes Gericht, צֶדֶק auf das sittlich und gesellschaftlich Rechte. Die deutsche Wortpaarung erhält beide Aspekte.
- source_word: מְדִינָה
  choice: Provinz
  rationale: Der Ausdruck bezeichnet einen Verwaltungsbezirk und passt zur im Vers vorausgesetzten Amtshierarchie.
- source_word: תִּתְמַהּ עַל הַחֵפֶץ
  choice: sei darüber nicht erstaunt
  rationale: Die Wendung warnt vor Verwunderung angesichts des geschilderten Vorgangs. Das Pronomen „darüber“ gibt den situationsbezogenen Sinn von הַחֵפֶץ in natürlichem Deutsch wieder.
- source_word: גָבֹהַּ מֵעַל גָבֹהַּ
  choice: über einen hohen Amtsträger wacht ein höherer
  rationale: Das substantivisch gebrauchte „hoch“ bezeichnet sehr wahrscheinlich Ranghöhere. „Amtsträger“ verdeutlicht den Verwaltungskontext, während die Steigerung „höherer“ die Rangordnung erhält.
- source_word: שֹׁמֵר
  choice: wacht
  rationale: Das Partizip bedeutet „wachen, beobachten, beaufsichtigen“. Die aktive Form folgt dem Hebräischen und lässt offen, ob kontrollierende Aufsicht oder schützendes Wachen gemeint ist.
- source_word: וּגְבֹהִים עֲלֵיהֶם
  choice: und über ihnen stehen noch Höhere
  rationale: Der Plural setzt die gestufte Rangordnung fort. „noch Höhere“ drückt die weitere Steigerung aus, ohne festzulegen, ob nur menschliche Amtsträger oder auch göttliche Aufsicht gemeint sind.
theological_decisions:
- issue: Ob der höchste Wächter im Haupttext ausdrücklich als Gott bezeichnet werden soll
  choice: Die offene Rede von höheren Amtsträgern beziehungsweise „Höheren“ wird beibehalten.
  alternative: Den Schluss ausdrücklich auf Gott als höchsten Aufseher beziehen.
  rationale: Der hebräische Text nennt Gott an dieser Stelle nicht, kann aber eine letztgültige göttliche Aufsicht anklingen lassen. Die Übersetzung bewahrt diese theologische Offenheit.
- issue: Ob שֹׁמֵר ausschließlich als kontrollierende Beaufsichtigung verstanden werden soll
  choice: „wacht“
  alternative: „wird beaufsichtigt“ beziehungsweise „kontrolliert“
  rationale: „Wacht“ erhält den aktiven Satzbau und das Bedeutungsspektrum des Verbs; der Zusammenhang legt hierarchische Aufsicht nahe, zwingt aber nicht zu einer ausschließlich negativen Kontrolle.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Der Verwaltungskontext wird durch „Provinz“ und „Amtsträger“ erkennbar gemacht. Das markante Bild vom Raub an Recht und Gerechtigkeit sowie die Mehrdeutigkeit der gestuften Aufsicht bleiben erhalten.
