base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/006.yaml
  text: For in many dreams and vanities there are also many words[b][a]; but fear God.
translation:
  language: de
  text: Denn bei vielen Träumen, Nichtigkeiten und vielen Worten – Gott aber fürchte!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Das erste כִּי begründet die vorangehende Warnung. „Denn“ bewahrt diese Verknüpfung in natürlichem Deutsch.
- source_word: בְרֹב
  choice: bei vielen
  rationale: בְּ mit רֹב bezeichnet hier eine große Menge. „Bei vielen“ gibt den Ausdruck knapp wieder und passt zum elliptischen Satzbau.
- source_word: חֲלֹמוֹת
  choice: Träumen
  rationale: Dies ist die gewöhnliche Wiedergabe des Plurals von חֲלוֹם; im Zusammenhang stehen Träume neben Nichtigkeiten und vielen Worten.
- source_word: הֲבָלִים
  choice: Nichtigkeiten
  rationale: Der Plural des Leitworts הֶבֶל bezeichnet Flüchtiges, Unbeständiges oder Gehaltloses. „Nichtigkeiten“ erhält die begriffliche Verbindung zum wiederkehrenden Motiv des Buches, ohne es einseitig als Sinnlosigkeit auszulegen.
- source_word: וּדְבָרִים הַרְבֵּה
  choice: auch viele Worte
  rationale: Die Wendung bezeichnet eine Fülle von Worten. Das ergänzte „gibt es“ und „auch“ machen den im Hebräischen elliptischen Nominalsatz im Deutschen verständlich.
- source_word: כִּי
  choice: doch
  rationale: Das zweite כִּי ist syntaktisch schwierig. Im Zusammenhang kann es die abschließende Aufforderung kontrastiv oder folgernd einleiten; „doch“ gibt die kontrastive Lesart knapp wieder, während die Fußnote die Unsicherheit wahrt.
- source_word: אֶת הָאֱלֹהִים
  choice: Gott
  rationale: אֵת kennzeichnet das bestimmte direkte Objekt; הָאֱלֹהִים wird hier als „Gott“ wiedergegeben.
- source_word: יְרָא
  choice: fürchte
  rationale: Der singularische Imperativ von ירא wird mit „fürchte“ wiedergegeben. So bleibt der gewichtige Weisheitsbegriff erhalten, der Ehrfurcht und Unterordnung einschließt.
theological_decisions:
- issue: Wiedergabe von ירא im Weisheitskontext
  choice: fürchte Gott
  alternative: verehre Gott; habe Ehrfurcht vor Gott
  rationale: „Gott fürchten“ ist ein prägnanter Schlüsselbegriff der biblischen Weisheit. Die Formulierung bewahrt sowohl die Ernsthaftigkeit als auch den Sinn ehrfürchtiger Unterordnung, ohne sie auf bloße Angst zu verengen.
- issue: Funktion des zweiten כִּי
  choice: doch
  alternative: denn; darum
  rationale: Die hebräische Verknüpfung kann kontrastiv oder folgernd verstanden werden. Der Haupttext folgt der kontrastiven Deutung, während die Fußnote die genuine Mehrdeutigkeit ausdrücklich offenhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der elliptische hebräische Satz wird durch „gibt es auch“ lesbar gemacht; die ungewöhnliche Reihung und ihre syntaktische Mehrdeutigkeit werden nicht eingeebnet. Der Imperativ „fürchte Gott“ bewahrt den traditionellen Weisheitsbegriff in einer heute noch verständlichen Form.
