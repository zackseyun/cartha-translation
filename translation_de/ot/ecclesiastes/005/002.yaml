    issue: Präpositionsanschluss „bei viel Beschäftigung / bei vielen Worten“
    rationale: Die Formulierung ist im Deutschen zu schwach kontextuell und im zweiten Glied kaum verständlich. בְּ kann hier ursächlich beziehungsweise als Hervorgehen aus einer Fülle verstanden werden; „durch“ gibt dies idiomatisch wieder und bleibt mit der audit-trail-Alternative vereinbar.
  - severity: low
    issue: „Beschäftigung“ für עִנְיָן
    rationale: Das Wort ist möglich, bezeichnet aber leicht eine konkrete Beschäftigung oder Arbeit. „Geschäftigkeit“ gibt die geschäftige Vielzahl von Angelegenheiten und die sprichwörtliche Beobachtung treffender wieder.
  - severity: low
    issue: Fußnotenalternative „Mühe“
    rationale: „Mühe“ ist als Deutung möglich, aber keine gleichwertig naheliegende knappe lexikalische Entsprechung für עִנְיָן in diesem Zusammenhang. Die Fußnote sollte die relevante Spannweite Tätigkeit/Angelegenheit und die Präpositionsnuance erklären.
