  text: For a dream comes with much preoccupation[a], and a fool’s voice with many words.
translation:
  language: de
  text: Denn ein Traum kommt durch viel Geschäftigkeit[a], und die Stimme eines Narren durch viele Worte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn ein Traum kommt bei viel Geschäftigkeit, und die Stimme eines Narren bei vielen Worten.“ Das hebräische Wort kann Tätigkeit, Angelegenheit oder belastendes Anliegen bezeichnen; die Präposition kann hier sowohl begleitend als auch ursächlich verstanden werden.'
    reason: Bewahrt die mögliche begleitende Lesart von בְּ bei zugleich idiomatischer Hauptübersetzung und erläutert die Bedeutungsbreite von עִנְיָן.
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet eine Begründung bzw. Erläuterung zur vorausgehenden Mahnung ein und bewahrt den knappen sprichwörtlichen Anschluss.
- source_word: בָּא
  choice: kommt
  rationale: Das Qal-Perfekt beschreibt hier eine allgemeine, sprichwörtliche Erfahrung; im Deutschen ist dafür das Präsens natürlich.
- source_word: הַחֲלוֹם
  choice: ein Traum
  rationale: Der bestimmte Artikel steht generisch; im Deutschen gibt der unbestimmte Artikel die allgemeine Aussage idiomatisch wieder.
- source_word: בְּרֹב עִנְיָן
  choice: bei viel Beschäftigung
  rationale: עִנְיָן bezeichnet Beschäftigung, Tätigkeit oder eine beanspruchende Angelegenheit. „Bei“ lässt die genaue kausale oder begleitende Beziehung bewusst offen.
- source_word: וְקוֹל כְּסִיל
  choice: und die Stimme eines Narren
  rationale: Bewahrt das hebräische Bild der Stimme und gibt die Genitivbeziehung würdig und natürlich wieder.
- source_word: כְּסִיל
  choice: Narr
  rationale: „Narr“ ist der etablierte Begriff der Weisheitsliteratur für einen moralisch und geistig uneinsichtigen Menschen und klingt weniger pauschal abwertend als „Dummkopf“.
- source_word: בְּרֹב דְּבָרִים
  choice: bei vielen Worten
  rationale: Spiegelt die Formulierung des ersten Satzglieds und bewahrt den Zusammenhang zwischen Wortfülle und der Stimme des Narren, ohne die Präposition ausschließlich kausal zu deuten.
