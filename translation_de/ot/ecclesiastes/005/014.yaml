revisions:
- from: Wie er aus dem Leib seiner Mutter kam, so wird er nackt wieder gehen, wie er gekommen ist. Und von all seiner Mühe wird er nichts mitnehmen, das er in seiner Hand davontragen könnte.[a]
  to: Wie er aus dem Leib seiner Mutter kam, so wird er nackt wieder fortgehen, wie er gekommen ist. Und von seiner Mühe wird er nichts mitnehmen, was er in seiner Hand mitnehmen kann.
  rationale: Die Revision klärt die deutsche Wiedergabe des hebräischen „zurückkehren, um zu gehen“ durch „wieder fortgehen“, ohne ein Ziel des Fortgehens oder eine bestimmte Jenseitsdeutung einzutragen. Die letzte Relativkonstruktion bleibt konkret („in seiner Hand“) und gibt ihren kontextuellen Sinn natürlich wieder. Die entbehrliche und missverständliche Fußnote wird entfernt.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T04:37:04Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Grundbewegung des hebräischen Spruchs zutreffend wieder: nackt aus dem Mutterleib kommen, ebenso wieder fortgehen und nichts aus der Mühe mitnehmen. „Wieder gehen“ ist im Deutschen jedoch mehrdeutig und kann schlicht bedeuten, erneut zu Fuß zu gehen; es bildet יָשׁוּב („zurückkehren/wiederum“) mit לָלֶכֶת daher weniger klar ab. Die Schlusswendung wird besser als das Mitnehmen mit der Hand ausgedrückt.'
  naturalness: „Wie … so“ und „nackt“ sind natürlich und dem würdevollen Register angemessen. „Wird er nackt wieder fortgehen“ ist idiomatischer und semantisch präziser als „wird er nackt wieder gehen“. „Was er in seiner Hand mitnehmen kann“ ist klarer als die unnötig hypothetische Form „das er … davontragen könnte“.
  terminology: „Leib seiner Mutter“, „nackt“ und „Mühe“ sind passend. „Von seiner Mühe“ entspricht בַּעֲמָלוֹ ohne die nicht ausdrücklich im Hebräischen stehende Verstärkung „all“.
  issues:
  - severity: medium
    issue: „wieder gehen“ ist für יָשׁוּב לָלֶכֶת unpräzise.
    rationale: Die Formulierung kann im heutigen Deutsch ein erneutes Gehen statt eines Fortgehens bzw. Zurückkehrens bezeichnen. „Wieder fortgehen“ bewahrt die Bewegungs- und Wiederholungsdimension besser.
  - severity: low
    issue: Die Fußnote bietet eine missverständliche wörtliche Wiedergabe und behauptet eine nur mögliche Personifikation.
    rationale: „Das in seiner Hand mitgehen könnte“ ist weder eine hilfreiche deutsche wörtliche Übersetzung noch nötig, um den Sinn der hebräischen Relativkonstruktion zu sichern. Der Haupttext kann das Handbild unmittelbar wiedergeben.
  - severity: low
    issue: „all seiner Mühe“ fügt eine Verstärkung hinzu.
    rationale: Die vollständige Verneinung liegt bereits in „nichts“ (וּמְאוּמָה לֹא). „Von seiner Mühe“ ist näher am Singular עָמָל.
  revised_text: Wie er aus dem Leib seiner Mutter kam, so wird er nackt wieder fortgehen, wie er gekommen ist. Und von seiner Mühe wird er nichts mitnehmen, was er in seiner Hand mitnehmen kann.
  revised_footnotes: []
  revision_rationale: Die Revision klärt die deutsche Wiedergabe des hebräischen „zurückkehren, um zu gehen“ durch „wieder fortgehen“, ohne ein Ziel des Fortgehens oder eine bestimmte Jenseitsdeutung einzutragen. Die letzte Relativkonstruktion bleibt konkret („in seiner Hand“) und gibt ihren kontextuellen Sinn natürlich wieder. Die entbehrliche und missverständliche Fußnote wird entfernt.
