base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/014.yaml
  text: As he came from his mother’s womb[a], naked he will return, going as he came; and he will carry away nothing from his labor that he can take in his hand.
translation:
  language: de
  text: Wie er aus dem Leib seiner Mutter kam, so wird er nackt wieder fortgehen, wie er gekommen ist. Und von seiner Mühe wird er nichts mitnehmen, was er in seiner Hand mitnehmen kann.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Wie … so
  rationale: Die deutsche Vergleichskonstruktion gibt die Entsprechung zwischen Geburt und Tod klar und natürlich wieder.
- source_word: יָצָא מִבֶּטֶן אִמּוֹ
  choice: er aus dem Leib seiner Mutter kam
  rationale: Bewahrt das konkrete Bild der Geburt in natürlichem modernem Deutsch.
- source_word: עָרוֹם
  choice: nackt
  rationale: Gibt die wörtliche Mittellosigkeit unverblümt wieder und bezieht das Wort entsprechend seiner Stellung zunächst auf das Fortgehen.
- source_word: יָשׁוּב לָלֶכֶת
  choice: wird er … wieder gehen
  rationale: Bewahrt sowohl den Zukunftsbezug als auch den Gedanken der Rückkehr beziehungsweise Wiederholung, ohne ein bestimmtes Jenseitsbild einzutragen.
- source_word: כְּשֶׁבָּא
  choice: wie er gekommen ist
  rationale: Erhält die knappe Parallelität zwischen Kommen und Gehen.
- source_word: וּמְאוּמָה לֹא יִשָּׂא
  choice: wird er nichts mitnehmen
  rationale: Im Zusammenhang des Todes bezeichnet נשׂא das Tragen beziehungsweise Mitnehmen; „nichts“ gibt die vollständige Verneinung idiomatisch wieder.
- source_word: בַעֲמָלוֹ
  choice: von all seiner Mühe
  rationale: „Mühe“ bewahrt den für Prediger typischen Beiklang belastender Arbeit; „all“ verdeutlicht idiomatisch den Gesamtbereich, ohne einen Ertrag vorauszusetzen.
- source_word: שֶׁיֹּלֵךְ בְּיָדוֹ
  choice: das er in seiner Hand davontragen könnte
  rationale: Die Formulierung bewahrt das konkrete Bild der Hand und gibt den gemeinten Mangel an etwas Mitnehmbarem in verständlichem Deutsch wieder.
theological_decisions:
- issue: Bedeutung des „Wiedergehens“
  choice: Keine ausdrückliche Deutung als Rückkehr in den Mutterleib, zur Erde oder in einen bestimmten Zustand nach dem Tod
  alternative: Das Ziel des Zurückkehrens ausdrücklich benennen
  rationale: Der hebräische Text lässt das Ziel unausgesprochen und betont stattdessen die Entsprechung von Ankunft und Abschied.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zweiteilige Vergleichsform „Wie … so“ trägt den sprichwortartigen Ton; konkrete Bilder wie „nackt“ und „in seiner Hand“ bleiben erhalten.
