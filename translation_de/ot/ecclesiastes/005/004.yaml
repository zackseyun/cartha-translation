  text: ט֖וֹב אֲשֶׁ֣ר לֹֽא תִדֹּ֑ר מִ/שֶׁ/תִּדּ֖וֹר וְ/לֹ֥א תְשַׁלֵּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/004.yaml
  text: It is better that you should not vow than that you should vow and not fulfill it[a].
translation:
  language: de
  text: Es ist besser, kein Gelübde abzulegen, als eines abzulegen und es nicht zu erfüllen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „und es nicht zu bezahlen“. Mit „bezahlen“ ist hier gemeint, das Gelübde einzulösen oder zu erfüllen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב אֲשֶׁר
  choice: Es ist besser
  rationale: Die prädikative Wendung drückt eine vergleichende Wertung aus; die deutsche Konstruktion ist natürlich und bewahrt den sprichwörtlichen Charakter.
- source_word: לֹא תִדֹּר
  choice: kein Gelübde abzulegen
  rationale: Das Qal-Imperfekt in der allgemeinen Aussage wird idiomatisch durch einen Infinitiv wiedergegeben; „Gelübde“ bezeichnet ein feierliches Versprechen gegenüber Gott.
- source_word: מִשֶׁתִּדּוֹר
  choice: als eines abzulegen
  rationale: מִן mit שֶׁ leitet das zweite Glied des Vergleichs ein. „Eines“ nimmt „Gelübde“ auf und vermeidet schwerfällige Wiederholung.
- source_word: וְלֹא תְשַׁלֵּם
  choice: und es nicht zu erfüllen
  rationale: Das Piel von שׁלם bedeutet im Zusammenhang eines Gelübdes dessen Leistung beziehungsweise Erfüllung. Das im Hebräischen unausgesprochene Objekt wird im Deutschen mit „es“ aufgenommen.
theological_decisions: []
translation_notes:
