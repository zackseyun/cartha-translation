base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/005.yaml
  text: Do not let your mouth cause your flesh to sin[a], and do not say before the messenger, “It was a mistake.” Why should God be angry at your voice and destroy the work of your hands?
translation:
  language: de
  text: 'Lass nicht zu, dass dein Mund dein Fleisch in Schuld bringt, und sage nicht vor dem Boten[a]: »Es war ein Versehen.« Warum sollte Gott wegen deiner Worte zornig werden und das Werk deiner Hände zerstören?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: vor dem Engel. Das hebräische Wort kann sowohl einen menschlichen als auch einen himmlischen Boten bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: תִּתֵּן אֶת־פִּיךָ
  choice: Lass nicht zu, dass dein Mund
  rationale: Die wörtliche Wendung »gib deinen Mund nicht« wäre im Deutschen unnatürlich. »Lass nicht zu, dass dein Mund« bewahrt den zulassenden beziehungsweise verursachenden Sinn.
- source_word: לַחֲטִיא אֶת־בְּשָׂרֶךָ
  choice: deinen Leib zur Sünde verleitet
  rationale: Der Hifil von חטא hat verursachende Kraft. »Leib« gibt בשר als den leiblichen Menschen wieder, ohne die im Deutschen missverständliche Wendung »das Fleisch sündigen lassen« zu verwenden.
- source_word: הַמַּלְאָךְ
  choice: der Bote
  rationale: מלאך kann einen menschlichen oder himmlischen Boten bezeichnen. Im Zusammenhang mit Gelübden ist ein menschlicher Beauftragter plausibel; die mögliche Bedeutung »Engel« bleibt in der Fußnote erhalten.
- source_word: שְׁגָגָה
  choice: ein Versehen
  rationale: Das Wort bezeichnet einen Irrtum beziehungsweise eine unbeabsichtigte Verfehlung. »Versehen« passt zu dem Versuch, eine unbedachte Äußerung nachträglich zu entschuldigen.
- source_word: קוֹלֶךָ
  choice: deine Worte
  rationale: Wörtlich steht »deine Stimme«; hier bezeichnet die Stimme metonymisch das Gesagte. »Deine Worte« ist im modernen Deutschen natürlich und hält den Bezug zum ausgesprochenen Gelübde fest.
- source_word: וְחִבֵּל
  choice: zerstören
  rationale: Das Verb bezeichnet das Verderben oder Zugrunderichten und bringt hier die Schwere des angedrohten göttlichen Gerichts zum Ausdruck.
- source_word: מַעֲשֵׂה יָדֶיךָ
  choice: das Werk deiner Hände
  rationale: Die klare deutsche Wendung bewahrt das hebräische Bild für die Arbeit eines Menschen und deren Ertrag.
theological_decisions:
- issue: Identität von הַמַּלְאָךְ im Zusammenhang mit Gelübden
  choice: der Bote
  alternative: der Engel
  rationale: Der Tempel- und Gelübdekontext lässt an einen menschlichen Beauftragten denken, doch das hebräische Wort legt nicht fest, ob ein menschlicher oder himmlischer Bote gemeint ist. Die Hauptlesart wird daher nicht dogmatisch verengt; die andere Möglichkeit steht in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am hebräischen Gedankengang, während unnatürliche Hebraismen behutsam geglättet werden. Die Anrede steht entsprechend dem Ausgangstext im Singular.
