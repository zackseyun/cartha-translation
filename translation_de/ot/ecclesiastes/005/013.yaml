id: ECC.5.13
reference: Ecclesiastes 5:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אָבַ֛ד הָ/עֹ֥שֶׁר הַ/ה֖וּא בְּ/עִנְיַ֣ן רָ֑ע וְ/הוֹלִ֣יד בֵּ֔ן וְ/אֵ֥ין בְּ/יָד֖/וֹ מְאֽוּמָה׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/013.yaml
  text: And that wealth was lost in a bad venture[b][a], and he fathered a son and had nothing in his hand.
translation:
  language: de
  text: Und jenes Vermögen ging durch ein unglückliches Geschäft verloren[a]. Er zeugte einen Sohn, hatte aber nichts in der Hand[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch eine schlimme Angelegenheit“ oder „bei einem unglücklichen Vorhaben“. Der hebräische Ausdruck kann ein schädliches Unternehmen, aber auch eine unheilvolle Angelegenheit oder Situation bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „und in seiner Hand ist gar nichts“. Gemeint ist, dass er überhaupt nichts besitzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָבַד
  choice: ging … verloren
  rationale: Das Qal-Verb hat הָעֹשֶׁר als Subjekt. „Ging verloren“ gibt den eingetretenen Verlust natürlich wieder, ohne eine handelnde Ursache hinzuzufügen.
- source_word: הָעֹשֶׁר הַהוּא
  choice: jenes Vermögen
  rationale: עֹשֶׁר bezeichnet Reichtum oder Vermögen; „jenes“ bildet Artikel und Demonstrativum ab und knüpft an den zuvor genannten Besitz an.
- source_word: בְּעִנְיַן רָע
  choice: durch ein unglückliches Geschäft
  rationale: עִנְיָן kann eine Angelegenheit, ein Vorhaben oder ein Geschäft bezeichnen. Im Zusammenhang des Vermögensverlusts ist „Geschäft“ naheliegend; „unglücklich“ beschreibt die schädliche Folge, ohne moralische Bosheit festzulegen.
- source_word: וְהוֹלִיד
  choice: er zeugte
  rationale: Der Hifil von ילד bezeichnet hier das Zeugen beziehungsweise Vaterwerden. „Zeugte“ ist präzise, verständlich und bewahrt das männliche Subjekt.
- source_word: בֵּן
  choice: einen Sohn
  rationale: בֵּן bezeichnet ausdrücklich einen Sohn und sollte hier nicht zum geschlechtsneutralen „Kind“ verallgemeinert werden.
- source_word: וְאֵין בְּיָדוֹ מְאוּמָה
  choice: hatte aber nichts in der Hand
  rationale: Die konkrete hebräische Wendung bleibt erhalten. Sie besagt im Zusammenhang, dass ihm keinerlei Besitz für seinen Sohn verblieben war; „aber“ macht den sachlichen Gegensatz im Deutschen deutlich.
