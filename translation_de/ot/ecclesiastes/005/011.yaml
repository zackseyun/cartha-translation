base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/011.yaml
  text: Sweet is the sleep of the worker[a], whether he eats little or much, but the abundance of the rich man does not let him sleep.
translation:
  language: de
  text: Süß ist der Schlaf dessen, der arbeitet, ob er wenig oder viel isst; doch der Überfluss[a] des Reichen lässt ihn nicht schlafen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Fülle“ oder „die Sättigung“. Das hebräische Wort kann sowohl Besitzfülle als auch körperliche Sättigung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְתוּקָה
  choice: süß
  rationale: Das Adjektiv bezeichnet wörtlich Süße und wird hier bildlich auf den Schlaf bezogen. „Süß“ bewahrt das anschauliche hebräische Bild.
- source_word: שְׁנַת הָעֹבֵד
  choice: der Schlaf dessen, der arbeitet
  rationale: Die Constructusverbindung bezeichnet den Schlaf des Arbeitenden. Die Relativformulierung klingt im modernen Deutschen natürlich und gibt das substantivierte maskuline Partizip wieder, ohne die Aussage unnötig auf einen Berufsstand zu verengen.
- source_word: אִם מְעַט וְאִם הַרְבֵּה יֹאכֵל
  choice: ob er wenig oder viel isst
  rationale: Die korrelative Konstruktion stellt zwei Möglichkeiten gegenüber; „ob … oder“ ist dafür die natürliche deutsche Entsprechung.
- source_word: וְהַשָּׂבָע
  choice: doch der Überfluss
  rationale: Das Substantiv kann Fülle, Sättigung oder einen Zustand des Überflusses bezeichnen. Im Kontrast zum Arbeitenden und in Verbindung mit dem Reichen ist „Überfluss“ gut verständlich, während eine Fußnote die echte lexikalische Mehrdeutigkeit bewahrt.
- source_word: לֶעָשִׁיר
  choice: des Reichen
  rationale: Das ל bezeichnet hier plausibel die Zuordnung bzw. Zugehörigkeit der Fülle zum Reichen. Der substantivierte Singular erhält den individuellen Kontrast des hebräischen Textes.
- source_word: אֵינֶנּוּ מַנִּיחַ לוֹ לִישׁוֹן
  choice: lässt ihn nicht schlafen
  rationale: Die Konstruktion mit מַנִּיחַ und Infinitiv drückt aus, dass ihm das Schlafen nicht ermöglicht wird. Die gewählte Formulierung ist idiomatisch und syntaktisch eng am Hebräischen.
