source:
  edition: WLC
  text: כִּ֚י לֹ֣א הַרְבֵּ֔ה יִזְכֹּ֖ר אֶת יְמֵ֣י חַיָּ֑י/ו כִּ֧י הָ/אֱלֹהִ֛ים מַעֲנֶ֖ה בְּ/שִׂמְחַ֥ת לִבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/019.yaml
  text: For he will not remember much the days of his life[b][a], because God keeps him occupied with the joy of his heart.
translation:
  language: de
  text: Denn er denkt nicht viel über die Tage seines Lebens nach[a], weil Gott ihn mit der Freude seines Herzens beschäftigt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Denn er wird sich nicht viel an die Tage seines Lebens erinnern.“ Das Verb kann auch „sich erinnern“ oder „an etwas denken“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „weil Gott ihm mit der Freude seines Herzens antwortet“. Das hebräische Verb kann wörtlicher „antworten“ bedeuten; im Zusammenhang ist wahrscheinlich gemeint, dass Gott ihn mit Freude beschäftigt oder davon in Anspruch nehmen lässt.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Das erste כִּי erläutert den vorausgehenden Gedanken; „Denn“ stellt diesen Zusammenhang im Deutschen natürlich her.
- source_word: לֹא הַרְבֵּה יִזְכֹּר
  choice: er denkt nicht viel … nach
  rationale: זכר bedeutet grundsätzlich „sich erinnern, an etwas denken“. Im Zusammenhang bezeichnet die Wendung wohl anhaltendes Nachdenken; die Übersetzung bleibt nahe am Wortlaut und ist zugleich idiomatisch.
- source_word: אֶת יְמֵי חַיָּיו
  choice: über die Tage seines Lebens
  rationale: Die bildhafte hebräische Ausdrucksweise wird bewahrt; die Präposition „über“ ergibt sich im Deutschen aus „nachdenken“.
- source_word: כִּי
  choice: weil
  rationale: Das zweite כִּי nennt den Grund für die vorausgehende Aussage.
- source_word: הָאֱלֹהִים
  choice: Gott
  rationale: Die Bezeichnung verweist hier eindeutig auf Gott und wird im Deutschen ohne Artikel wiedergegeben.
- source_word: מַעֲנֶה
  choice: beschäftigt
  rationale: Die Hifil-Form von ענה wird in diesem Zusammenhang wahrscheinlich im Sinn von „beschäftigen, in Anspruch nehmen“ gebraucht. Die mögliche wörtlichere Deutung „antworten“ bleibt in einer Fußnote erhalten.
- source_word: בְּשִׂמְחַת לִבּוֹ
  choice: mit der Freude seines Herzens
  rationale: Die Übersetzung bewahrt sowohl die instrumentale Bedeutung der Präposition בְּ als auch das hebräische Bild vom Herzen als innerem Zentrum der Freude.
theological_decisions:
- issue: Art des göttlichen Handelns in מַעֲנֶה
  choice: Gott beschäftigt den Menschen mit der Freude seines Herzens.
  alternative: Gott antwortet ihm durch die Freude seines Herzens.
  rationale: Der unmittelbare Zusammenhang beschreibt die Fähigkeit, das Leben zu genießen, als Gabe Gottes. Daher passt die positive Bedeutung „beschäftigen/in Anspruch nehmen“ am besten; die lexikalisch mögliche Lesart „antworten“ wird jedoch nicht ausgeschlossen, sondern in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die Satzstruktur folgt dem hebräischen Begründungsgang. Lexikalische Mehrdeutigkeiten bei יִזְכֹּר und מַעֲנֶה werden im Haupttext kontextgerecht wiedergegeben und in den Fußnoten offengehalten.
