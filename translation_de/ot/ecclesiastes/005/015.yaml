  yaml_path: translation/ot/ecclesiastes/005/015.yaml
  text: 'This too is a grievous evil: exactly as he came[a], so he will go. And what profit is there for him who toils for the wind?'
translation:
  language: de
  text: 'Auch dies ist ein schweres Übel: Genauso, wie er gekommen ist, so wird er gehen. Und welchen Gewinn hat er davon, dass er sich für den Wind[a] abmüht?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »für den Atem« oder »für den Geist«. Das hebräische Wort רוּחַ kann »Wind«, »Atem« oder »Geist« bedeuten. Hier passt »Wind« am besten zum Gedanken vergeblicher Mühe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָה חוֹלָה
  choice: ein schweres Übel
  rationale: Die Verbindung bezeichnet idiomatisch ein besonders schlimmes, schmerzliches Übel. „Schweres Übel“ bewahrt die Intensität, ohne fälschlich eine buchstäbliche Krankheit anzunehmen.
- source_word: כָּל עֻמַּת שֶׁבָּא
  choice: Genauso, wie er gekommen ist
  rationale: עֻמַּת drückt eine genaue Entsprechung aus. „Genauso, wie“ gibt diesen Vergleich natürlich und präzise wieder.
- source_word: יֵלֵךְ
  choice: wird er wieder gehen
  rationale: Das Imperfekt bezeichnet hier die Gewissheit seines Fortgehens im Tod. „Wieder“ verdeutlicht die durch den Vergleich ausgedrückte Rückkehr in den besitzlosen Zustand, ohne ein zusätzliches Ziel festzulegen.
- source_word: יִתְרוֹן
  choice: Gewinn
  rationale: „Gewinn“ gibt den für Kohelet charakteristischen Gedanken eines bleibenden Überschusses oder Vorteils in allgemein verständlichem Deutsch wieder.
- source_word: שֶׁיַּעֲמֹל
  choice: dass er sich abmüht
  rationale: עמל bezeichnet mühevolle, belastende Arbeit. Die reflexive Wendung „sich abmühen“ vermittelt diesen Beiklang natürlich.
- source_word: לָרוּחַ
  choice: für den Wind
  rationale: רוּחַ kann Wind, Atem oder Geist bedeuten. Im Zusammenhang des vergeblichen Strebens passt das konkrete Bild vom Wind am besten; die echte lexikalische Mehrdeutigkeit wird in der Fußnote bewahrt.
theological_decisions:
- issue: Bedeutung von רוּחַ im Zusammenhang von Gewinn und Vergänglichkeit
  choice: Wind
  alternative: Atem oder Geist
  rationale: „Wind“ erhält das anschauliche Bild fruchtloser Mühe und vermeidet eine nicht vom Kontext verlangte Vergeistigung. Da der hebräische Ausdruck mehrdeutig bleibt, werden die anderen möglichen Bedeutungen in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt nahe an der prägnanten Weisheitssprache des Hebräischen und bewahrt bei רוּחַ die lexikalische Mehrdeutigkeit durch eine Fußnote.
