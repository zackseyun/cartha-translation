source:
  edition: WLC
  text: הִנֵּ֞ה אֲשֶׁר רָאִ֣יתִי אָ֗נִי ט֣וֹב אֲשֶׁר יָפֶ֣ה לֶֽ/אֶכוֹל וְ֠/לִ/שְׁתּוֹת וְ/לִ/רְא֨וֹת טוֹבָ֜ה בְּ/כָל עֲמָל֣/וֹ שֶׁ/יַּעֲמֹ֣ל תַּֽחַת הַ/שֶּׁ֗מֶשׁ מִסְפַּ֧ר יְמֵי חי/ו אֲשֶׁר נָֽתַן ל֥/וֹ הָ/אֱלֹהִ֖ים כִּי ה֥וּא חֶלְקֽ/וֹ־־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/017.yaml
  text: Behold[a], what I myself have seen to be good and fitting is to eat and to drink and to see good in all the labor at which he labors under the sun during the number of the days of his life that God has given him, for this is his portion.
translation:
  language: de
  text: 'Siehe, was ich selbst als gut und angemessen erkannt habe: zu essen und zu trinken und bei all seiner Mühe, mit der er sich unter der Sonne abmüht, Gutes zu genießen[a], während der ihm von Gott gewährten Zahl seiner Lebenstage; denn das ist sein Anteil.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Gutes zu sehen“; auch: „Gutes zu erfahren“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh
  rationale: Markiert nachdrücklich die folgende Beobachtung; „Sieh“ bewahrt den Aufforderungs- und Aufmerksamkeitston in natürlichem, würdigem Deutsch.
- source_word: רָאִיתִי אָ֗נִי
  choice: was ich selbst … erkannt habe
  rationale: „selbst“ gibt die Betonung durch das ausdrückliche Pronomen אָ֗נִי wieder; „erkannt“ bezeichnet hier eine aus Beobachtung gewonnene Einsicht natürlicher als das rein visuelle „gesehen“.
- source_word: טוֹב אֲשֶׁר יָפֶה
  choice: gut und angemessen
  rationale: Die Wortverbindung bezeichnet sowohl das Gute als auch das in dieser Lage Passende; „angemessen“ ist kontextuell klarer als das wörtlich mögliche „schön“.
- source_word: לֶאֱכוֹל וְלִשְׁתּוֹת
  choice: zu essen und zu trinken
  rationale: Die klaren Infinitive werden unmittelbar und formnah wiedergegeben.
- source_word: וְלִרְאוֹת טוֹבָה
  choice: Gutes zu genießen
  rationale: Wörtlich steht „Gutes zu sehen“; in diesem Zusammenhang meint die hebräische Wendung, Gutes zu erfahren beziehungsweise zu genießen. Die konkrete Ausgangsform bleibt in der Fußnote sichtbar.
- source_word: בְּכָל עֲמָלוֹ שֶׁיַּעֲמֹל
  choice: bei all seiner Mühe, mit der er sich abmüht
  rationale: Die Verbindung von Substantiv und gleichstämmigem Verb wird durch „Mühe/abmüht“ hörbar bewahrt; das männliche Singularpronomen des Textes bleibt erhalten.
- source_word: תַּחַת הַשֶּׁמֶשׁ
  choice: unter der Sonne
  rationale: Die für Kohelet charakteristische Wendung wird formnah und konsequent wiedergegeben.
- source_word: מִסְפַּר יְמֵי חַיָּו
  choice: während der Zahl seiner Lebenstage
  rationale: Bewahrt die ungewöhnliche, aber bedeutungsvolle Formulierung „Zahl der Tage“ und ergänzt weder „wenige“ noch „alle“.
- source_word: אֲשֶׁר נָתַן לוֹ הָאֱלֹהִים
  choice: die Gott ihm gegeben hat
  rationale: Gibt den Relativsatz und die Aussage von Gottes Gabe direkt wieder.
- source_word: כִּי הוּא חֶלְקוֹ
  choice: denn das ist sein Anteil
  rationale: „Anteil“ bezeichnet den einem Menschen zugewiesenen Lebensanteil und bewahrt das wiederkehrende Motiv des Buches.
theological_decisions:
- issue: Bezug des männlichen Singulars in der Weisheitsrede
  choice: seiner … er … ihm … sein
  alternative: die Mühe eines Menschen / diesem Menschen
  rationale: Der hebräische Text führt keinen ausdrücklichen Ausdruck für „Mann“ oder „Mensch“ ein, sondern verwendet Suffixe und Verbformen im männlichen Singular. Die deutsche Fassung bewahrt diese pronominale Form, ohne ein zusätzliches Substantiv einzutragen.
- issue: Idiom וְלִרְאוֹת טוֹבָה
  choice: Gutes zu genießen
  alternative: Gutes zu sehen / Gutes zu erfahren
  rationale: Die kontextuelle Bedeutung des hebräischen Idioms wird verständlich wiedergegeben, während die wörtliche Bildgestalt und die mögliche weitere Bedeutung in der Fußnote erhalten bleiben.
- issue: Umfang der Lebenszeit
  choice: während der Zahl seiner Lebenstage
  alternative: während der wenigen Tage seines Lebens / alle Tage seines Lebens
  rationale: Das Hebräische sagt an dieser Stelle weder ausdrücklich „wenige“ noch „alle“. Die ungewöhnliche Formulierung bleibt deshalb offen und wird nicht interpretierend erweitert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt der nachdrücklichen, reflektierenden Weisheitsrede nahe. „Während der Zahl seiner Lebenstage“ ist bewusst quellennah und leicht markiert; „Gutes zu genießen“ sorgt an der idiomatischen Schlüsselstelle für unmittelbare Verständlichkeit.
