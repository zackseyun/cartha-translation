  text: וְ/יִתְר֥וֹן אֶ֖רֶץ בַּ/כֹּ֣ל היא מֶ֥לֶךְ לְ/שָׂדֶ֖ה נֶעֱבָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/008.yaml
  text: The land’s profit is for everyone; even a king is served by the field.[a]
translation:
  language: de
  text: Der Ertrag des Landes kommt allen zugute; selbst ein König wird vom Feld versorgt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Text ist an dieser Stelle ausgesprochen schwierig. Eine andere mögliche Übersetzung lautet: „Ein Vorteil für ein Land in jeder Hinsicht ist ein König, der sich um die bestellten Felder kümmert.“ Der letzte Satzteil kann auch so verstanden werden: „Selbst ein König ist vom Feld abhängig.“'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיִתְרוֹן אֶרֶץ
  choice: Der Ertrag des Landes
  rationale: יִתְרוֹן bezeichnet im Predigerbuch Gewinn, Vorteil oder Ertrag. Im Zusammenhang mit אֶרֶץ und שָׂדֶה gibt „Ertrag“ den landwirtschaftlichen Bezug natürlich wieder, ohne den wiederkehrenden Gedanken des Nutzens aufzugeben.
- source_word: בַּכֹּל
  choice: kommt allen zugute
  rationale: בַּכֹּל wird hier auf den umfassenden Empfängerkreis bezogen. Die Formulierung ist idiomatisches Deutsch; die mögliche adverbiale Deutung „in jeder Hinsicht“ bleibt in der Fußnote erhalten.
- source_word: מֶלֶךְ לְשָׂדֶה נֶעֱבָד
  choice: selbst ein König wird vom Feld versorgt
  rationale: Die stark verdichtete Wendung wird so verstanden, dass der König Empfänger der durch das Feld geleisteten Versorgung ist. „Versorgt“ bildet den Sinn von נֶעֱבָד in diesem Zusammenhang natürlicher ab als das missverständliche „bedient“, während „vom Feld“ die instrumentale Zuordnung wahrt.
