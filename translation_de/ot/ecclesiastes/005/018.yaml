source:
  edition: WLC
  text: גַּ֣ם כָּֽל הָ/אָדָ֡ם אֲשֶׁ֣ר נָֽתַן ל֣/וֹ הָ/אֱלֹהִים֩ עֹ֨שֶׁר וּ/נְכָסִ֜ים וְ/הִשְׁלִיט֨/וֹ לֶ/אֱכֹ֤ל מִמֶּ֨/נּוּ֙ וְ/לָ/שֵׂ֣את אֶת חֶלְק֔/וֹ וְ/לִ/שְׂמֹ֖חַ בַּ/עֲמָל֑/וֹ זֹ֕ה מַתַּ֥ת אֱלֹהִ֖ים הִֽיא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/018.yaml
  text: Also[a], every man to whom God has given wealth and possessions, and has empowered him to eat from them, and to take his portion[c][b], and to rejoice in his labor—this is the gift of God.
translation:
  language: de
  text: Auch jeder Mensch, dem Gott Reichtum und Besitz gegeben hat und den er befähigt hat, davon zu essen, seinen Anteil zu nehmen[a] und sich an seiner Mühe zu freuen – das ist eine Gabe Gottes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seinen Anteil anzunehmen“ beziehungsweise „seinen zugeteilten Anteil zu erhalten“. „Anteil“ ist im Predigerbuch ein Schlüsselwort für das, was einem im Leben zufällt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Auch
  rationale: Bewahrt die additive Verknüpfung mit dem vorausgehenden Gedanken knapp und natürlich.
- source_word: כָּל הָאָדָם
  choice: jeder Mensch
  rationale: Gibt den distributiven, generisch gebrauchten Singular im heutigen Standarddeutsch natürlich wieder, ohne das Geschlecht unnötig festzulegen.
- source_word: נָתַן לוֹ הָאֱלֹהִים
  choice: dem Gott … gegeben hat
  rationale: Das Perfekt bezeichnet eine vollzogene Gabe mit gegenwärtiger Bedeutung; das deutsche Perfekt passt zum allgemeinen Weisheitssatz.
- source_word: עֹשֶׁר וּנְכָסִים
  choice: Reichtum und Besitz
  rationale: Unterscheidet materiellen Wohlstand von dem, was jemand besitzt, und bleibt allgemeinverständlich.
- source_word: וְהִשְׁלִיטוֹ
  choice: den er befähigt hat
  rationale: Der Hifil von שלט bezeichnet hier die von Gott verliehene Fähigkeit bzw. Verfügungsmacht, den Besitz tatsächlich zu nutzen und zu genießen, nicht bloß Erlaubnis.
- source_word: לֶאֱכֹל מִמֶּנּוּ
  choice: davon zu essen
  rationale: Erhält das konkrete hebräische Bild; das singularische מִמֶּנּוּ kann sich zusammenfassend auf den genannten Reichtum und Besitz beziehen.
- source_word: וְלָשֵׂאת אֶת חֶלְקוֹ
  choice: seinen Anteil anzunehmen
  rationale: חֵלֶק ist im Predigerbuch der zugeteilte Anteil am Leben; נשׂא kann das Nehmen bzw. Annehmen dieses Anteils ausdrücken. Eine Fußnote wahrt die mögliche konkretere Wiedergabe.
- source_word: וְלִשְׂמֹחַ בַּעֲמָלוֹ
  choice: sich an seiner Mühe zu freuen
  rationale: Bewahrt sowohl die Freude von שמח als auch die belastete Arbeits- und Mühekomponente von עמל.
- source_word: זֹה מַתַּת אֱלֹהִים הִיא
  choice: das ist eine Gabe Gottes
  rationale: Die anaphorische Formulierung bezieht sich auf die gesamte zuvor beschriebene Möglichkeit. Der unbestimmte Artikel vermeidet die unbegründete Aussage, dies sei die einzige Gabe Gottes.
theological_decisions:
- issue: Generischer Gebrauch von הָאָדָם
  choice: jeder Mensch
  alternative: jeder Mann
  rationale: Das hebräische Maskulinum Singular bezeichnet hier distributiv einen Menschen allgemein. Modernes Deutsch gibt den Aussageumfang mit „jeder Mensch“ klar wieder, ohne den Referenzkreis auf Männer zu verengen.
- issue: Art des göttlichen Gewährens in וְהִשְׁלִיטוֹ
  choice: befähigt hat
  alternative: Macht darüber gegeben hat
  rationale: Der Vers unterscheidet zwischen dem Geben des Besitzes und der von Gott verliehenen Fähigkeit, davon Gebrauch zu machen. „Befähigt“ erhält diesen theologischen Akzent, ohne eine umfassendere Herrschaftslehre einzutragen.
- issue: Bestimmtheit von מַתַּת אֱלֹהִים
  choice: eine Gabe Gottes
  alternative: die Gabe Gottes
  rationale: Das Hebräische besitzt hier keinen Artikel. „Eine Gabe Gottes“ identifiziert das beschriebene Vermögen als göttliche Gabe, ohne Exklusivität zu behaupten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem langen hebräischen Konditionalgefüge, bleibt aber durch klare Infinitivgruppen lesbar. Das konkrete Bild „davon zu essen“ und der gewichtige Ausdruck „Mühe“ wurden bewusst erhalten.
