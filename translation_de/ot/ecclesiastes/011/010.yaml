base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/010.yaml
  text: So remove vexation from your heart, and put away harm from your flesh, for youth and the dawn of life are vapor.
translation:
  language: de
  text: Halte den Ärger aus deinem Herzen fern und das Übel von deinem Leib; denn Jugend und Morgenröte des Lebens sind ein Hauch.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '„Morgenröte des Lebens“: Das seltene hebräische Wort kann auch mit der dunklen Farbe des Jugendhaars zusammenhängen und entsprechend als „Zeit des schwarzen Haars“ verstanden werden. „Ein Hauch“ bezeichnet etwas Flüchtiges und Vergängliches.'
    reason: Die Bedeutung von הַשַּׁחֲרוּת ist umstritten; die Fußnote bewahrt diese lexikalische Unsicherheit. Sie erläutert zugleich die bildhafte Wiedergabe von הָבֶל.
lexical_decisions:
- source_word: כַּעַס
  choice: Kummer
  rationale: Das Wort bezeichnet hier belastenden Verdruss, Ärger oder seelischen Kummer. „Kummer“ passt zum Herzen und lässt die emotionale Spannweite erkennen.
- source_word: רָעָה
  choice: das Übel
  rationale: Der breite Ausdruck kann Böses, Unglück oder Schaden bezeichnen. „Das Übel“ bewahrt diese Mehrdeutigkeit besser als eine rein moralische oder rein körperliche Festlegung.
- source_word: בָּשָׂר
  choice: Leib
  rationale: Im Zusammenhang ist der menschliche Körper gemeint; „Leib“ ist natürlich und würdevoll, ohne den Ausdruck unnötig zu vergeistigen.
- source_word: הַיַּלְדוּת
  choice: Jugend
  rationale: Bezeichnet die Jugendzeit beziehungsweise das Jungsein.
- source_word: הַשַּׁחֲרוּת
  choice: Morgenröte des Lebens
  rationale: Das seltene Wort ist mit „Schwärze“ im Sinn dunklen Jugendhaars oder mit „Morgenzeit“ verbunden worden. Im Parallelismus mit „Jugend“ gibt „Morgenröte des Lebens“ die frühe Lebensphase anschaulich wieder, während die Unsicherheit in der Fußnote erhalten bleibt.
- source_word: הָבֶל
  choice: ein Hauch
  rationale: Das Leitwort des Buches bezeichnet etwas Flüchtiges, Vergängliches und schwer Greifbares. „Hauch“ erhält das konkrete Bild und vermeidet eine vorschnelle Wertung als bloße Sinnlosigkeit.
theological_decisions:
- issue: Bedeutung von רָעָה
  choice: das Übel
  alternative: Schaden / Böses
  rationale: Der Vers kann sowohl das Meiden schädlicher Folgen als auch des Bösen ansprechen. Die Übersetzung legt sich nicht unnötig auf eine ausschließlich ethische oder körperliche Deutung fest.
- issue: Aussage von הָבֶל über die Jugend
  choice: ein Hauch
  alternative: nichtig / vergänglich
  rationale: Die Formulierung betont Flüchtigkeit und kurze Dauer, ohne zu behaupten, Jugend sei wertlos oder schlechthin sinnlos.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, leicht bildhaftem Ton. Der Imperativ wird idiomatisch mit „halte … fern“ und „wehre … ab“ wiedergegeben; der Parallelismus des Hebräischen bleibt erhalten.
