source:
  edition: WLC
  text: אִם יִמָּלְא֨וּ הֶ/עָבִ֥ים גֶּ֨שֶׁם֙ עַל הָ/אָ֣רֶץ יָרִ֔יקוּ וְ/אִם יִפּ֥וֹל עֵ֛ץ בַּ/דָּר֖וֹם וְ/אִ֣ם בַּ/צָּפ֑וֹן מְק֛וֹם שֶׁ/יִּפּ֥וֹל הָ/עֵ֖ץ שָׁ֥ם יְהֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/003.yaml
  text: If the clouds are full of rain[a], they pour it out on the earth; and if a tree falls to the south or to the north, in the place where the tree falls, there it will lie.
translation:
  language: de
  text: 'Wenn die Wolken voller Regen sind, schütten sie ihn auf die Erde aus. Und wenn ein Baum nach Süden oder nach Norden fällt: An dem Ort, an dem der Baum fällt, dort wird er liegen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „dort wird er sein“. Das hebräische Verb bedeutet einfach „sein“; bei einem gefallenen Baum gibt „liegen“ den Sinn im Deutschen natürlicher wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּלְאוּ ... גֶּשֶׁם
  choice: voller Regen sind
  rationale: Das Nifal von מלא bezeichnet hier das Vollsein beziehungsweise Gefülltsein. „Voller Regen“ gibt den Zustand der Wolken natürlich und bildhaft wieder.
- source_word: הֶעָבִים
  choice: die Wolken
  rationale: עבים bezeichnet in diesem Wetterzusammenhang die Wolken.
- source_word: יָרִיקוּ
  choice: schütten sie ihn ... aus
  rationale: Das Hifil von ריק bedeutet „leeren, ausschütten“. Das Pronomen „ihn“ nimmt den Regen auf und macht das Bild im Deutschen verständlich, ohne den Sinn zu erweitern.
- source_word: עַל הָאָרֶץ
  choice: auf die Erde
  rationale: ארץ kann „Erde“ oder „Land“ bedeuten; die allgemeine Naturbeobachtung spricht hier für „Erde“.
- source_word: יִפּוֹל עֵץ
  choice: ein Baum ... fällt
  rationale: Der Imperfekt steht in einem allgemeinen Bedingungssatz; das deutsche Präsens bewahrt den sprichwortartigen Charakter.
- source_word: בַּדָּרוֹם ... בַּצָּפוֹן
  choice: nach Süden oder nach Norden
  rationale: Beim Fallen eines Baumes ist die Richtungsangabe im Deutschen am natürlichsten. Das zweite וְאִם wird idiomatisch durch „oder“ wiedergegeben.
- source_word: מְקוֹם שֶׁיִּפּוֹל הָעֵץ
  choice: An dem Ort, an dem der Baum fällt
  rationale: Die ausdrückliche Ortsangabe und die wiederholte Erwähnung des Fallens bleiben erhalten.
- source_word: שָׁם יְהוּא
  choice: dort wird er liegen
  rationale: Das hebräische Verb bedeutet wörtlich lediglich „sein“. Bei einem gefallenen Baum bezeichnet „liegen“ im Deutschen den resultierenden Zustand natürlich; die wörtlichere Möglichkeit wird in der Fußnote genannt.
