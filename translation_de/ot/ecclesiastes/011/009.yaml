reference: Ecclesiastes 11:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: שְׂמַ֧ח בָּח֣וּר בְּ/יַלְדוּתֶ֗י/ךָ וִֽ/יטִֽיבְ/ךָ֤ לִבְּ/ךָ֙ בִּ/ימֵ֣י בְחוּרוֹתֶ֔/ךָ וְ/הַלֵּךְ֙ בְּ/דַרְכֵ֣י לִבְּ/ךָ֔ וּ/בְ/מַרְאֵ֖י עֵינֶ֑י/ךָ וְ/דָ֕ע כִּ֧י עַל כָּל אֵ֛לֶּה יְבִֽיאֲ/ךָ֥ הָ/אֱלֹהִ֖ים בַּ/מִּשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/009.yaml
  text: Rejoice[a], young man, in your youth, and let your heart cheer you in the days of your young manhood. Walk in the ways of your heart and in the sight of your eyes[d][c][b], but know that for all these things God will bring you into judgment.
translation:
  language: de
  text: 'Freue dich, junger Mann, in deiner Jugend, und dein Herz mache dich froh in den Tagen deiner jungen Jahre. Geh auf den Wegen deines Herzens und nach dem, was deine Augen sehen.[a] Doch wisse: Für all dies wird Gott dich ins Gericht bringen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »und in den Erscheinungen beziehungsweise im Anblick deiner Augen«.'
    reason: lexical_alternative
  - marker: b
    text: Der Vers hält die Freude am Leben und die Verantwortung vor Gott zusammen. Er kann als erlaubende Aufforderung mit einer klaren Grenze oder als von einer Warnung überschattete Aufforderung gelesen werden.
    reason: alternative_reading
lexical_decisions:
- source_word: שְׂמַח
  choice: Freue dich
  rationale: Der Qal-Imperativ fordert ausdrücklich zur Freude auf und entspricht einem wiederkehrenden Motiv des Predigers.
- source_word: בָּחוּר
  choice: junger Mann
  rationale: Das maskuline Substantiv und die durchgehend maskulinen Singularformen richten sich unmittelbar an einen jungen Mann.
- source_word: בְּיַלְדוּתֶיךָ
  choice: in deiner Jugend
  rationale: Im Zusammenhang bezeichnet der Ausdruck die Jugendzeit, nicht speziell die frühe Kindheit.
- source_word: וִיטִיבְךָ לִבְּךָ
  choice: dein Herz mache dich froh
  rationale: 'Die Hifil-Form von יטב mit dem Herzen als Subjekt hat kausativen Sinn: Das Herz soll Freude beziehungsweise Wohlergehen bewirken.'
- source_word: בִּימֵי בְחוּרוֹתֶךָ
  choice: in den Tagen deiner jungen Jahre
  rationale: Die Form bezeichnet die Zeit jugendlicher Kraft; die Wiedergabe vermeidet im Deutschen eine schwerfällige Wiederholung von „Jugend“.
- source_word: וְהַלֵּךְ
  choice: Geh
  rationale: Der Imperativ bewahrt die hebräische Wegmetapher für Lebensführung.
- source_word: בְּדַרְכֵי לִבְּךָ
  choice: auf den Wegen deines Herzens
  rationale: Die Übersetzung erhält sowohl die Wegmetapher als auch das Herz als Sitz von Wunsch und Absicht.
- source_word: וּבְמַרְאֵי עֵינֶיךָ
  choice: nach dem, was deine Augen sehen
  rationale: Die idiomatische deutsche Form gibt den wörtlichen Ausdruck „in den Erscheinungen/dem Anblick deiner Augen“ verständlich wieder, ohne ihn enger auszulegen.
- source_word: וְדָע
  choice: Doch wisse
  rationale: Das hebräische ו verbindet formal, leitet hier aber eine deutlich abwägende Warnung ein; „doch“ macht diese Diskursfunktion sichtbar.
- source_word: עַל כָּל אֵלֶּה
  choice: Für all dies
  rationale: Im Gerichtszusammenhang bezeichnet die Präposition die Dinge, hinsichtlich derer Rechenschaft gefordert wird.
- source_word: יְבִיאֲךָ הָאֱלֹהִים בַּמִּשְׁפָּט
  choice: wird Gott dich ins Gericht bringen
  rationale: Die Formulierung bewahrt den kausativen Sinn von בוא und den feierlichen gerichtlichen Gehalt von מִשְׁפָּט.
theological_decisions:
- issue: Ob der Vers uneingeschränkte Selbstentfaltung billigt oder die Lebensfreude unter Gottes Rechenschaft stellt
  choice: Die Aufforderungen zur Freude und zum selbstbestimmten Gehen bleiben echte Imperative; die abschließende Gerichtsaussage steht als gewichtige Begrenzung daneben.
  alternative: Die Aufforderungen könnten insgesamt ironisch als Warnung vor jugendlicher Ausschweifung verstanden werden.
  rationale: Der hebräische Text markiert die Imperative nicht ausdrücklich als Ironie. Zugleich darf die Gerichtswarnung nicht abgeschwächt werden. Die Übersetzung erhält daher die für das Buch charakteristische Spannung zwischen Lebensfreude und Verantwortung vor Gott.
- issue: Geschlecht des Angeredeten
  choice: „junger Mann“
  alternative: „junger Mensch“ oder „Jugendlicher“
  rationale: Substantiv, Verben und Suffixe stehen im maskulinen Singular; die Übersetzung bildet diese konkrete Anrede ab.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die biblische Wegmetapher bleibt erhalten; schwer verständliche Wörtlichkeit wird bei „מַרְאֵי עֵינֶיךָ“ im Haupttext idiomatisch wiedergegeben und in der Fußnote dokumentiert. Die maskuline Einzelanrede des Ausgangstextes wird beibehalten.
