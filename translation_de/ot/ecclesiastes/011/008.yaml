source:
  edition: WLC
  text: כִּ֣י אִם שָׁנִ֥ים הַרְבֵּ֛ה יִחְיֶ֥ה הָ/אָדָ֖ם בְּ/כֻלָּ֣/ם יִשְׂמָ֑ח וְ/יִזְכֹּר֙ אֶת יְמֵ֣י הַ/חֹ֔שֶׁךְ כִּֽי הַרְבֵּ֥ה יִהְי֖וּ כָּל שֶׁ/בָּ֥א הָֽבֶל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/008.yaml
  text: For if a man lives many years[a], let him rejoice in them all; but let him remember the days of darkness, for they will be many. All that comes is vapor.
translation:
  language: de
  text: Denn wenn ein Mensch viele Jahre lebt, soll er sich an ihnen allen freuen; doch soll er an die Tage der Finsternis denken, denn es werden viele sein. Alles, was kommt, ist Dunst.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »Alles, was kommt, ist Hauch«; traditionell: »Nichtigkeit« oder »Eitelkeit«. Das hebräische Wort hevel ist ein Leitwort im Buch Prediger und bezeichnet etwas Flüchtiges, Unbeständiges oder schwer Greifbares.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Denn wenn
  rationale: Die Wendung leitet eine Bedingung mit begründender Funktion ein; »Denn wenn« bewahrt beides in natürlichem Deutsch.
- source_word: שָׁנִים הַרְבֵּה
  choice: viele Jahre
  rationale: Die Formulierung bezeichnet unmittelbar eine lange Lebenszeit.
- source_word: הָאָדָם
  choice: ein Mensch
  rationale: Das singularische אָדָם ist hier allgemein und repräsentativ gebraucht. »Ein Mensch« gibt diesen Bezug im Deutschen natürlich wieder, ohne ihn auf Männer zu beschränken.
- source_word: בְּכֻלָּם יִשְׂמָח
  choice: soll er sich an ihnen allen freuen
  rationale: Der Imperfekt kann hier auffordernd verstanden werden. Das Pronomen verweist auf die vielen Jahre; die deutsche Wendung »sich an etwas freuen« gibt den Sinn idiomatisch wieder.
- source_word: וְיִזְכֹּר
  choice: doch soll er … denken
  rationale: Das hebräische וְ ist formal additiv, bildet hier aber einen inhaltlichen Gegensatz zur Freude. »Doch« macht diesen Kontrast sichtbar, ohne die Freude aufzuheben.
- source_word: יְמֵי הַחֹשֶׁךְ
  choice: die Tage der Finsternis
  rationale: Die wörtliche, bildhafte Wiedergabe erhält die mögliche Mehrdeutigkeit zwischen Leid, Alter, Tod und Grabesdunkel.
- source_word: כִּי הַרְבֵּה יִהְיוּ
  choice: denn es werden viele sein
  rationale: Der Satz begründet die Aufforderung zum Gedenken; »es« bezieht sich eindeutig auf die Tage der Finsternis.
- source_word: כָּל שֶׁבָּא
  choice: Alles, was kommt
  rationale: Die offene, allgemeine Aussage des Hebräischen bleibt erhalten, ohne den Bezug näher festzulegen.
- source_word: הָבֶל
  choice: Dunst
  rationale: »Dunst« erhält das konkrete Bild von etwas Flüchtigem, Unbeständigem und schwer Greifbarem. Es vermeidet die stärkere Auslegung »sinnlos« und die moralische Nebenbedeutung von »Eitelkeit«.
theological_decisions:
- issue: Allgemeiner Bezug von הָאָדָם
  choice: ein Mensch
  alternative: ein Mann
  rationale: Das hebräische Maskulinum bezeichnet hier einen einzelnen Menschen als Vertreter der Menschheit. Die deutsche Wiedergabe macht den allgemeinen Geltungsbereich deutlich, ohne eine männliche Ausschließlichkeit einzutragen.
- issue: Bedeutung von הָבֶל im Predigerbuch
  choice: Dunst
  alternative: Hauch; Nichtigkeit; Eitelkeit
  rationale: Das Leitwort bezeichnet bildhaft etwas Flüchtiges, Unbeständiges oder Unfassbares. »Dunst« bewahrt diese Spannung und legt den Satz nicht einseitig auf Bedeutungslosigkeit fest.
- issue: Bedeutung der »Tage der Finsternis«
  choice: Das Bild bleibt unerklärt im Haupttext
  alternative: Unglückstage; Alter; Tod oder Grab
  rationale: Der hebräische Ausdruck kann mehrere düstere Lebens- und Todeswirklichkeiten anklingen lassen. Eine eindeutige Auslegung würde die echte poetische und theologische Mehrdeutigkeit beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am hebräischen Gedankengang, während »sich an ihnen allen freuen« idiomatisches Deutsch bietet. »Finsternis« erhält den poetischen Ton; »Dunst« macht das zentrale Bild konkret, ohne es vorschnell auszudeuten.
