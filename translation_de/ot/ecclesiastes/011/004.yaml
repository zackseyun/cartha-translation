source:
  edition: WLC
  text: שֹׁמֵ֥ר ר֖וּחַ לֹ֣א יִזְרָ֑ע וְ/רֹאֶ֥ה בֶ/עָבִ֖ים לֹ֥א יִקְצֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/004.yaml
  text: Whoever watches the wind will not sow[a], and whoever looks at the clouds will not reap.
translation:
  language: de
  text: Wer auf den Wind achtet, wird nicht säen, und wer auf die Wolken schaut, wird nicht ernten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֹׁמֵר
  choice: auf … achtet
  rationale: Das Partizip bezeichnet jemanden, der etwas aufmerksam und fortwährend beobachtet. „Auf den Wind achten“ ist im Deutschen natürlich und gibt den sprichwörtlich-allgemeinen Sinn wieder, ohne die hier unpassende Schutzbedeutung von „hüten“ einzutragen.
- source_word: רוּחַ
  choice: Wind
  rationale: Zusammen mit Säen und Wolken ist eindeutig die meteorologische Bedeutung gemeint; „Geist“ oder „Atem“ wären kontextuell irreführend.
- source_word: יִזְרָע
  choice: wird nicht säen
  rationale: Das Imperfekt beschreibt hier die allgemeine Folge eines typischen Verhaltens. Die Formulierung mit „wird nicht“ bewahrt den knappen Folgezusammenhang des Spruchs.
- source_word: וְרֹאֶה
  choice: und wer … schaut
  rationale: Das Partizip steht parallel zu שֹׁמֵר und bezeichnet einen allgemeinen, wiederholt handelnden Menschen. „Wer … schaut“ ist idiomatisch und erhält die Beobachtungsnuance.
- source_word: בֶעָבִים
  choice: nach den Wolken
  rationale: Bei einem Verb des Schauens lässt sich die Präposition idiomatisch mit „nach“ wiedergeben. Die Wolken gehören zum Wetterbild des landwirtschaftlichen Spruchs.
- source_word: יִקְצוֹר
  choice: wird nicht ernten
  rationale: „Ernten“ ist die natürliche moderne Wiedergabe und bildet mit „säen“ das geläufige deutsche Wortpaar. Das Futur drückt wie im ersten Halbvers die allgemeine Folge aus.
theological_decisions: []
translation_notes:
  register: Knappes, würdiges modernes Standarddeutsch. Die parallele Wer-Konstruktion und das Paar „säen/ernten“ bewahren Form und Aussage des hebräischen Spruchs; unnötige Deutung auf Zögern oder übermäßige Vorsicht wurde nicht in den Text aufgenommen.
