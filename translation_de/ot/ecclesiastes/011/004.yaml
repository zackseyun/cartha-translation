  source_fidelity: 'Die Grundstruktur und der Sinn des hebräischen Spruchs sind zutreffend wiedergegeben: die beiden Partizipien bezeichnen generische Beobachter, und die Imperfekte drücken die sprichwörtliche Folge aus. „Wind“, „säen“ und „ernten“ treffen den Kontext und die Parallelität. In der zweiten Zeile verschiebt jedoch „nach den Wolken schauen“ die Bedeutung in Richtung „Wolken suchen/erwarten“, während בְּ bei רֹאֶה hier das Betrachtete bezeichnet: auf die Wolken sehen bzw. die Wolken beobachten.'
