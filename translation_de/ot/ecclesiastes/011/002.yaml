  text: תֶּן חֵ֥לֶק לְ/שִׁבְעָ֖ה וְ/גַ֣ם לִ/שְׁמוֹנָ֑ה כִּ֚י לֹ֣א תֵדַ֔ע מַה יִּהְיֶ֥ה רָעָ֖ה עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/002.yaml
  text: Give a portion to seven[a], and even to eight, for you do not know what disaster will happen on the earth.
translation:
  language: de
  text: Gib sieben einen Anteil, auch acht, denn du weißt nicht, welches Unheil über die Erde[a] kommen wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das Land«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּן
  choice: Gib
  rationale: Der Qal-Imperativ richtet eine unmittelbare Aufforderung an eine einzelne Person; »Gib« ist die naheliegende und natürliche Wiedergabe.
- source_word: חֵלֶק
  choice: ihren Anteil
  rationale: חֵלֶק bezeichnet einen Anteil oder Teil. Im Deutschen macht das distributive »ihren Anteil« deutlich, dass an jede der genannten Personen etwas gegeben wird, ohne die Aussage weiter auszudeuten.
- source_word: לְשִׁבְעָה וְגַם לִשְׁמוֹנָה
  choice: sieben … ja sogar acht
  rationale: Die Zahlenformel wird als literarische Steigerung bewahrt. »Ja sogar« gibt die verstärkende Kraft von וְגַם natürlich wieder.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet die Begründung der Aufforderung ein; »denn« ist knapp und idiomatisch.
- source_word: לֹא תֵדַע
  choice: du weißt nicht
  rationale: Die verneinte Imperfektform bezeichnet fehlendes Wissen; die Wiedergabe bleibt eng am Hebräischen und vermeidet die stärkere Deutung »du kannst nicht wissen«.
- source_word: מַה יִּהְיֶה רָעָה
  choice: welches Unheil … kommen wird
  rationale: רָעָה meint hier schädliches Geschehen, nicht notwendig moralisches Böses. Die deutsche Formulierung gibt היה ereignishaft wieder und verbindet מַה idiomatisch mit dem folgenden Substantiv.
- source_word: עַל הָאָרֶץ
  choice: über die Erde
  rationale: אֶרֶץ kann »Erde« oder »Land« bedeuten. »Über die Erde kommen« ist im Deutschen eine natürliche Verbindung mit Unheil und wahrt den allgemeinen Horizont des Weisheitsspruchs.
theological_decisions:
- issue: Reichweite von הָאָרֶץ
  choice: Erde
  alternative: Land
  rationale: Der allgemeine Weisheitskontext spricht für den weiteren Sinn »Erde«; die mögliche örtlich begrenzte Bedeutung »Land« bleibt in der Fußnote sichtbar.
- issue: Art des Gebens
  choice: als allgemeine Verteilung wiedergegeben
  alternative: konkret als Almosengeben, Investieren oder Handelsunternehmen deuten
  rationale: Der hebräische Wortlaut nennt den Zweck des Gebens nicht ausdrücklich. Die Übersetzung legt sich deshalb nicht auf eine bestimmte wirtschaftliche oder karitative Auslegung fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die prägnante Zahlensteigerung »sieben … ja sogar acht« bleibt erhalten; die mehrdeutige Art des Gebens wird nicht durch eine interpretierende Ergänzung festgelegt.
