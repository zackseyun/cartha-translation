base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/001.yaml
  text: Cast your bread upon the surface of the waters, for after many days you will find it.
translation:
  language: de
  text: Wirf dein Brot auf die Wasser[a], denn nach vielen Tagen wirst du es finden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Sende dein Brot auf die Wasser.“ Das hebräische Bild kann Großzügigkeit, eine Investition oder beides nahelegen; im Haupttext bleibt es bildhaft.'
    reason: lexikalische Alternative und bewusste Wahrung der Mehrdeutigkeit
lexical_decisions:
- source_word: שַׁלַּח
  choice: Wirf
  rationale: Der Imperativ bedeutet grundsätzlich „senden, losschicken, loslassen“. Im Zusammenhang mit Brot und Wasser bewahrt „wirf“ das anschauliche Bild und klingt im Deutschen natürlich, ohne dessen Anwendung festzulegen.
- source_word: לַחְמְךָ
  choice: dein Brot
  rationale: לֶחֶם bezeichnet konkret „Brot“ und kann weiter gefasst Nahrung meinen. „Brot“ erhält das hebräische Bild.
- source_word: עַל פְּנֵי הַמָּיִם
  choice: auf die Wasser
  rationale: Die Wendung lautet wörtlich „auf das Angesicht/die Oberfläche der Wasser“. „Auf die Wasser“ gibt das Bild knapp und würdig wieder; der im Hebräischen übliche Ausdruck פְּנֵי muss im Deutschen nicht ausdrücklich mit „Oberfläche“ wiedergegeben werden.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung beziehungsweise Motivation des Imperativs ein.
- source_word: בְרֹב הַיָּמִים
  choice: nach vielen Tagen
  rationale: Die Formulierung bezeichnet einen erst nach längerer Zeit eintretenden Zeitpunkt und lässt sich direkt und idiomatisch mit „nach vielen Tagen“ wiedergeben.
- source_word: תִּמְצָאֶנּוּ
  choice: wirst du es wiederfinden
  rationale: Das Verb bedeutet „finden“; das maskuline Suffix verweist am natürlichsten auf „Brot“. „Wiederfinden“ drückt im Deutschen idiomatisch aus, dass das zuvor ausgesandte Brot später gefunden wird, ohne die Art des Ertrags näher zu bestimmen.
theological_decisions:
- issue: Deutung des Bildes vom Brot auf den Wassern
  choice: Das Bild bleibt im Haupttext unaufgelöst und kann Großzügigkeit, wirtschaftliches Wagnis oder beides nahelegen.
  alternative: Den Vers ausdrücklich als Aufforderung zum Geben oder zum Handel deuten.
  rationale: Der hebräische Wortlaut nennt keine konkrete Anwendung. Eine Festlegung würde die echte Mehrdeutigkeit des Spruchs beseitigen und mehr in den Text hineintragen, als dort ausdrücklich steht.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in knapper, würdiger Spruchform. Das ungewöhnliche Bild und der Plural „Wasser“ bleiben erhalten; die Fußnote erläutert die sprachliche und sachliche Offenheit, ohne sie aufzulösen.
