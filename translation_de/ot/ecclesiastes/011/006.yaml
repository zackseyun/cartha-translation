source:
  edition: WLC
  text: בַּ/בֹּ֨קֶר֙ זְרַ֣ע אֶת זַרְעֶ֔/ךָ וְ/לָ/עֶ֖רֶב אַל תַּנַּ֣ח יָדֶ֑/ךָ כִּי֩ אֵֽינְ/ךָ֨ יוֹדֵ֜ע אֵ֣י זֶ֤ה יִכְשָׁר֙ הֲ/זֶ֣ה אוֹ זֶ֔ה וְ/אִם שְׁנֵי/הֶ֥ם כְּ/אֶחָ֖ד טוֹבִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/006.yaml
  text: In the morning sow your seed[a], and in the evening do not let your hand rest, for you do not know which will succeed, this or that[b], or whether both alike will be good.
translation:
  language: de
  text: Am Morgen säe deine Saat, und am Abend lass deine Hand nicht ruhen[a]; denn du weißt nicht, welches gelingen wird[b], dieses oder jenes, oder ob beide gleichermaßen gut ausfallen werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Lass deine Hand nicht ruhen“; gemeint ist, nicht mit der Arbeit aufzuhören.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „gedeihen wird“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּבֹּקֶר
  choice: Am Morgen
  rationale: Die natürliche deutsche Zeitangabe bewahrt die Parallele zu „am Abend“.
- source_word: זְרַע אֶת זַרְעֶךָ
  choice: säe deine Saat
  rationale: Bewahrt das konkrete landwirtschaftliche Bild und den Wortklang von Verb und zugehörigem Substantiv.
- source_word: וְלָעֶרֶב
  choice: und am Abend
  rationale: Erhält die hebräische Verknüpfung und den ausgewogenen Gegensatz zum Morgen.
- source_word: אַל תַּנַּח יָדֶךָ
  choice: lass deine Hand nicht ruhen
  rationale: Gibt das konkrete hebräische Bild verständlich wieder; gemeint ist, die Arbeit nicht einzustellen.
- source_word: כִּי אֵינְךָ יוֹדֵעַ
  choice: denn du weißt nicht
  rationale: Bewahrt die begründende Funktion des Satzteils in natürlichem deutschem Weisheitsstil.
- source_word: אֵי זֶה יִכְשָׁר
  choice: welches gelingen wird
  rationale: אֵי זֶה fragt hier nach einer von mehreren Möglichkeiten; „gelingen“ lässt sowohl den landwirtschaftlichen Bezug als auch die allgemeinere Weisheitsanwendung offen.
- source_word: הֲזֶה אוֹ זֶה
  choice: dieses oder jenes
  rationale: Gibt den demonstrativen Gegensatz knapp und offen wieder.
- source_word: וְאִם שְׁנֵיהֶם כְּאֶחָד טוֹבִים
  choice: oder ob beide gleichermaßen gut ausfallen werden
  rationale: Drückt die weitere Möglichkeit aus, dass beide Unternehmungen in vergleichbarer Weise ein gutes Ergebnis haben; „ausfallen“ macht den Ergebnisbezug im Deutschen deutlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das landwirtschaftliche Bild bleibt erhalten, ohne seine mögliche weiter gefasste Weisheitsanwendung auszudeuten. Die parallele Zeitstruktur „am Morgen … am Abend“ wird beibehalten.
