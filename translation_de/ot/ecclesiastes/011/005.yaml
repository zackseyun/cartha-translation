id: ECC.11.5
reference: Ecclesiastes 11:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֨ר אֵֽינְ/ךָ֤ יוֹדֵ֨עַ֙ מַה דֶּ֣רֶךְ הָ/ר֔וּחַ כַּ/עֲצָמִ֖ים בְּ/בֶ֣טֶן הַ/מְּלֵאָ֑ה כָּ֗כָה לֹ֤א תֵדַע֙ אֶת מַעֲשֵׂ֣ה הָֽ/אֱלֹהִ֔ים אֲשֶׁ֥ר יַעֲשֶׂ֖ה אֶת הַ/כֹּֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/005.yaml
  text: Just as you do not know the way of the wind[a], or how the bones form in the womb of a pregnant woman, so you do not know the work of God[b], who makes everything.
translation:
  language: de
  text: Wie du nicht weißt, welchen Weg der Wind[a] nimmt und wie die Knochen im Leib einer Schwangeren entstehen, so kennst du auch das Wirken Gottes nicht, der alles macht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »welchen Weg der Atem nimmt« oder »welchen Weg der Geist nimmt«. Das hebräische Wort רוּחַ kann »Wind«, »Atem« oder »Geist« bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: דֶּרֶךְ הָרוּחַ
  choice: welchen Weg der Wind nimmt
  rationale: רוּחַ kann »Wind«, »Atem« oder »Geist« bedeuten. Im Zusammenhang mit verborgenen Vorgängen in der Schöpfung liegt »Wind« nahe; die Formulierung mit »Weg« bewahrt דֶּרֶךְ.
- source_word: כַּעֲצָמִים
  choice: wie die Knochen … entstehen
  rationale: Der hebräische Ausdruck ist elliptisch. »Entstehen« macht den impliziten Vorgang der verborgenen Entwicklung verständlich, ohne ihn näher zu bestimmen.
- source_word: בְּבֶטֶן הַמְּלֵאָה
  choice: im Leib einer Schwangeren
  rationale: Wörtlich steht »im Leib der Vollen«. Gemeint ist idiomatisch eine schwangere Frau; »Leib einer Schwangeren« ist in modernem Deutsch klar und würdevoll.
- source_word: מַעֲשֵׂה הָאֱלֹהִים
  choice: das Wirken Gottes
  rationale: »Wirken« gibt das von Gott vollbrachte Werk natürlich wieder und passt zum umfassenden, für Menschen nicht durchschaubaren Handeln Gottes.
- source_word: אֲשֶׁר יַעֲשֶׂה אֶת־הַכֹּל
  choice: der alles macht
  rationale: Die Relativkonstruktion bezieht sich am natürlichsten auf Gott. »Alles macht« bewahrt sowohl den umfassenden Sinn von הַכֹּל als auch die Wiederaufnahme der Wurzel עשׂה.
theological_decisions:
- issue: Bedeutung von רוּחַ
  choice: Wind
  alternative: Atem oder Geist
  rationale: Der Kontext menschlicher Unkenntnis verborgener Vorgänge in der Schöpfung stützt »Wind«. Da רוּחַ tatsächlich mehrdeutig ist, werden »Atem« und »Geist« in der Fußnote offengehalten.
- issue: Aussage über Gottes umfassendes Handeln
  choice: Gott als der, »der alles macht«
  alternative: Gott, »der all dies tut« oder dessen Wirken »in allem« unbekannt ist
  rationale: Syntax und Wortlaut lassen die Relativkonstruktion am ehesten Gott als Urheber alles Gemachten bezeichnen. Die Übersetzung vermeidet eine weitergehende systematische Ausdeutung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Weisheitsregister. Die elliptische Formulierung zur Entwicklung im Mutterleib wird behutsam verdeutlicht; die Mehrdeutigkeit von רוּחַ bleibt durch die Fußnote erhalten.
