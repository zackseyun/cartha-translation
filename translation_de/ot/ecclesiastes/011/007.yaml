id: ECC.11.7
reference: Ecclesiastes 11:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/מָת֖וֹק הָ/א֑וֹר וְ/ט֥וֹב לַֽ/עֵינַ֖יִם לִ/רְא֥וֹת אֶת הַ/שָּֽׁמֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/007.yaml
  text: And the light is sweet[b][a], and it is good for the eyes to see the sun.
translation:
  language: de
  text: Und süß[a] ist das Licht, und gut ist es für die Augen, die Sonne zu sehen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „angenehm“; entsprechend: „Angenehm ist das Licht.“'
    reason: lexical_alternative
  - marker: b
    text: „Die Sonne sehen“ kann über den wörtlichen Sinn hinaus auch bedeuten, am Leben zu sein und das irdische Leben zu genießen.
    reason: cultural_note
lexical_decisions:
- source_word: וּמָתוֹק
  choice: süß
  rationale: מָתוֹק bezeichnet wörtlich Süße und kann übertragen etwas Angenehmes oder Erfreuliches meinen. „Süß“ bewahrt das konkrete, knappe Bild des Hebräischen.
- source_word: הָאוֹר
  choice: das Licht
  rationale: Der bestimmte Artikel wird wiedergegeben. Im Zusammenhang ist das lebensspendende Tageslicht gemeint, doch „das Licht“ vermeidet eine unnötige Präzisierung.
- source_word: וְטוֹב
  choice: gut
  rationale: טוֹב kann „gut“, „angenehm“ oder „wohltuend“ bedeuten. „Gut“ ist die unmittelbarste Entsprechung und bewahrt die hebräische Ausdrucksweise.
- source_word: לָעֵינַיִם
  choice: für die Augen
  rationale: Die Präposition ל bezeichnet hier Bezug oder Vorteil. „Für die Augen“ ist im Deutschen verständlich und bleibt dem hebräischen Bild nahe.
- source_word: לִרְאוֹת
  choice: zu sehen
  rationale: Der Infinitiv von ראה bedeutet hier schlicht „sehen“; stärker gehobene oder deutende Wiedergaben sind nicht erforderlich.
- source_word: אֶת־הַשָּׁמֶשׁ
  choice: die Sonne
  rationale: Die Akkusativpartikel mit dem bestimmten Substantiv bezeichnet „die Sonne“. Eine übertragene Deutung wird nicht in den Haupttext eingetragen.
theological_decisions:
- issue: Ob die mögliche idiomatische Bedeutung von „die Sonne sehen“ als Leben und Genießen des irdischen Daseins ausdrücklich gemacht werden soll
  choice: Die konkrete Wendung „die Sonne zu sehen“ bleibt im Haupttext erhalten.
  alternative: „das Leben zu genießen“ oder „das Sonnenlicht zu schauen“
  rationale: Die konkrete Sonnen- und Lichtmetaphorik ist für den Prediger prägend. Die wörtliche Wiedergabe bewahrt sowohl das Bild als auch die mögliche weitergehende Bedeutung, ohne diese einseitig festzulegen.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrter poetischer Kürze. Die ungewöhnliche, aber verständliche Metapher „süß ist das Licht“ und die konkrete Wendung „die Sonne zu sehen“ bleiben erhalten.
