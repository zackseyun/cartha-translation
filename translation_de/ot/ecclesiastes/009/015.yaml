base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/015.yaml
  text: And there was found in it a poor wise man[a], and he delivered the city by his wisdom; yet no one remembered that poor man.
translation:
  language: de
  text: Da fand sich in ihr ein armer, weiser Mann[a]. Er rettete die Stadt durch seine Weisheit; doch niemand erinnerte sich an diesen armen Mann.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, entsprechend der aktiven hebräischen Form: „Und er fand in ihr einen armen, weisen Mann.“ Das Subjekt von „fand“ kann der zuvor erwähnte mächtige König sein.'
    reason: textual_or_syntactic_ambiguity
lexical_decisions:
- source_word: וּמָצָא בָהּ
  choice: Da fand sich in ihr
  rationale: Die aktive hebräische Form lautet wörtlich „und er fand in ihr“, wird im Zusammenhang aber meist unpersönlich verstanden. „Da fand sich in ihr“ gibt dieses Verständnis in natürlichem Deutsch wieder, ohne ein nicht genanntes Subjekt einzuführen; die formale Alternative steht in der Fußnote.
- source_word: אִישׁ מִסְכֵּן חָכָם
  choice: ein armer, weiser Mann
  rationale: Die Wortgruppe bezeichnet einen männlichen Menschen von niedrigem sozialem oder wirtschaftlichem Stand, der weise ist. Die beiden Adjektive werden im Deutschen natürlich koordiniert.
- source_word: וּמִלַּט הוּא אֶת הָעִיר
  choice: Er rettete die Stadt
  rationale: Das Piel von מלט mit „die Stadt“ als direktem Objekt bezeichnet ihre Rettung oder Befreiung. „Rettete“ ist im heutigen Deutsch klarer und natürlicher als „befreite“.
- source_word: בְּחָכְמָתוֹ
  choice: durch seine Weisheit
  rationale: Die Präposition בְּ bezeichnet hier das Mittel, durch das die Rettung geschah.
- source_word: וְאָדָם לֹא זָכַר
  choice: doch niemand erinnerte sich
  rationale: אָדָם steht in der verneinten Aussage generisch für irgendeinen Menschen. „Niemand“ gibt diesen Sinn im modernen Deutsch präzise wieder; „doch“ bringt den deutlichen Gegensatz zur Rettung der Stadt zum Ausdruck.
- source_word: אֶת הָאִישׁ הַמִּסְכֵּן הַהוּא
  choice: an diesen armen Mann
  rationale: Das Demonstrativum hebt den bestimmten armen Mann rückblickend hervor. Das Verb „sich erinnern“ verlangt im Deutschen die Präposition „an“.
theological_decisions:
- issue: Generische Bedeutung von אָדָם in der Verneinung
  choice: niemand
  alternative: kein Mensch
  rationale: Hier ist nicht ausschließlich von Männern die Rede, sondern davon, dass kein Mensch sich an den Retter erinnerte. „Niemand“ bewahrt den generischen Umfang und klingt natürlich.
- issue: Subjekt und Diathese von וּמָצָא
  choice: 'unpersönlich: „Da fand sich in ihr“'
  alternative: 'aktiv: „Und er fand in ihr“'
  rationale: Die Konsonanten und die masoretische Vokalisierung bieten eine aktive Form in der 3. Person Singular. Der Kontext lässt jedoch ein unpersönliches Verständnis zu und legt die Existenz des weisen Mannes in der Stadt nahe. Da die formale aktive Lesart möglich bleibt, wird sie in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kurze Hauptsätze bewahren die erzählerische Zuspitzung und den Kontrast zwischen der rettenden Weisheit des armen Mannes und seinem späteren Vergessenwerden.
