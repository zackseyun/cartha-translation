base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/008.yaml
  text: Let your garments always be white[b][a], and do not let oil be lacking on your head.
translation:
  language: de
  text: Deine Kleider seien jederzeit weiß[a], und Öl auf deinem Kopf fehle nicht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: »Zu jeder Zeit sollen deine Kleider weiß sein.«'
    reason: lexical_alternative
  - marker: b
    text: Weiße Kleider und Öl auf dem Kopf stehen hier für Festlichkeit, Freude und Wohlergehen und bilden einen Gegensatz zur Trauer.
    reason: cultural_note
lexical_decisions:
- source_word: בְּכָל־עֵת
  choice: jederzeit
  rationale: Die Wendung bedeutet wörtlich »zu jeder Zeit«. »Jederzeit« gibt ihren fortdauernden Sinn natürlich und knapp wieder.
- source_word: יִהְיוּ
  choice: sollen … sein
  rationale: Das Imperfekt hat hier im Zusammenhang auffordernden Sinn. »Sollen … sein« bewahrt diesen Charakter und klingt im Deutschen natürlicher als eine Konstruktion mit »lass«.
- source_word: בְגָדֶיךָ
  choice: deine Kleider
  rationale: »Kleider« gibt den konkreten Plural verständlich und in einem würdigen, aber gegenwärtigen Sprachregister wieder.
- source_word: לְבָנִים
  choice: weiß
  rationale: Das Adjektiv bezeichnet die Farbe Weiß. Die direkte Wiedergabe wahrt das Bild, ohne seine Bedeutung in den Haupttext hineinzudeuten.
- source_word: וְשֶׁמֶן
  choice: Öl
  rationale: Der hebräische Text nennt allgemein Öl und legt weder »Olivenöl« noch »Salböl« ausdrücklich fest.
- source_word: עַל־רֹאשְׁךָ
  choice: auf deinem Kopf
  rationale: Dies ist eine direkte und natürliche Wiedergabe der Präpositionalphrase.
- source_word: אַל־יֶחְסָר
  choice: soll … nicht fehlen
  rationale: Die Verbindung aus Negationspartikel und Imperfekt drückt eine negative Aufforderung aus. »Soll … nicht fehlen« erhält sowohl den auffordernden Ton als auch den Sinn des Mangels beziehungsweise Ausbleibens.
theological_decisions:
- issue: Bedeutung der weißen Kleider und des Öls
  choice: Das Bild bleibt im Haupttext unaufgelöst; seine kulturellen Bezüge werden in einer Fußnote erläutert.
  alternative: Die Bilder unmittelbar als Freude, Festlichkeit oder Wohlergehen auslegen.
  rationale: Der Vers nennt die Bilder, aber nicht ausdrücklich ihre abstrakte Deutung. Eine Erläuterung in der Fußnote informiert, ohne die Bildsprache im Text einzuengen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, gut verständlichem Weisheitsstil. Der parallele Satzbau und die konkrete Bildsprache des Hebräischen bleiben erhalten; unnötig kirchliche Begriffe wie »Salböl« werden vermieden.
