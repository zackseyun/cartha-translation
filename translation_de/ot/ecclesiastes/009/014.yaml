  text: עִ֣יר קְטַנָּ֔ה וַ/אֲנָשִׁ֥ים בָּ֖/הּ מְעָ֑ט וּ/בָֽא אֵלֶ֜י/הָ מֶ֤לֶךְ גָּדוֹל֙ וְ/סָבַ֣ב אֹתָ֔/הּ וּ/בָנָ֥ה עָלֶ֖י/הָ מְצוֹדִ֥ים גְּדֹלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/014.yaml
  text: There was a small city[a], and few men were in it; and a great king came against it, surrounded it, and built great siegeworks against it.
translation:
  language: de
  text: Da war eine kleine Stadt, und in ihr lebten nur wenige Männer. Ein mächtiger König zog gegen sie, umzingelte sie und errichtete gewaltige Belagerungswerke[a] gegen sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »gewaltige Bollwerke« oder »gewaltige Belagerungsrampen«. Das hebräische Wort kann allgemein Belagerungsbauten oder Befestigungsanlagen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עִיר קְטַנָּה
  choice: eine kleine Stadt
  rationale: Die gewöhnliche Bedeutung von עִיר und die Größenangabe קְטַנָּה werden direkt und in natürlichem Deutsch wiedergegeben.
- source_word: וַאֲנָשִׁים בָּהּ מְעָט
  choice: und in ihr lebten nur wenige Männer
  rationale: אֲנָשִׁים wird als „Männer“ wiedergegeben; „lebten“ formuliert die hebräische Nominalkonstruktion idiomatisch, ohne ihren Sinn zu verändern.
- source_word: וּבָא אֵלֶיהָ
  choice: zog gegen sie
  rationale: בוא אל kann an sich „zu ihr kommen“ bedeuten; der anschließende Belagerungskontext macht jedoch die feindliche Bewegung deutlich. „gegen sie ziehen“ ist dafür im Deutschen natürlich.
- source_word: מֶלֶךְ גָּדוֹל
  choice: ein mächtiger König
  rationale: גָּדוֹל bezeichnet hier Größe beziehungsweise Macht und bildet den Gegensatz zur kleinen Stadt. „Mächtig“ bringt diesen militärischen Kontrast natürlich zum Ausdruck.
- source_word: וְסָבַב אֹתָהּ
  choice: umzingelte sie
  rationale: סבב bezeichnet das Einschließen beziehungsweise Umgeben; „umzingeln“ trifft im Belagerungskontext den militärischen Sinn.
- source_word: וּבָנָה עָלֶיהָ
  choice: und errichtete ... gegen sie
  rationale: בנה bedeutet „bauen/errichten“; עַל bezeichnet hier die feindliche Ausrichtung der Bauwerke gegen die Stadt.
- source_word: מְצוֹדִים גְּדֹלִים
  choice: gewaltige Belagerungswerke
  rationale: מְצוֹדִים kann unterschiedliche Belagerungsbauten oder Befestigungsanlagen bezeichnen. „Belagerungswerke“ wahrt diese sachliche Breite; „gewaltige“ gibt גְּדֹלִים idiomatisch wieder.
