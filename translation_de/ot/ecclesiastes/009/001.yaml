  text: כִּ֣י אֶת כָּל זֶ֞ה נָתַ֤תִּי אֶל לִבִּ/י֙ וְ/לָ/ב֣וּר אֶת כָּל זֶ֔ה אֲשֶׁ֨ר הַ/צַּדִּיקִ֧ים וְ/הַ/חֲכָמִ֛ים וַ/עֲבָדֵי/הֶ֖ם בְּ/יַ֣ד הָ/אֱלֹהִ֑ים גַּֽם אַהֲבָ֣ה גַם שִׂנְאָ֗ה אֵ֤ין יוֹדֵ֨עַ֙ הָֽ/אָדָ֔ם הַ/כֹּ֖ל לִ/פְנֵי/הֶֽם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/001.yaml
  text: 'For I laid all this to my heart[a], even to examine all this: that the righteous and the wise and their works are in the hand of God. Whether love or hate, man does not know[b]; everything is before them.'
translation:
  language: de
  text: 'Denn dies alles nahm ich mir zu Herzen, um es zu ergründen: Die Gerechten und die Weisen und ihre Werke[a] sind in Gottes Hand. Ob Liebe oder Hass – der Mensch weiß es nicht[b]; alles liegt vor ihnen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Diener“. Die hebräische Form legt diese Lesart nahe; viele verstehen den Ausdruck hier jedoch im Sinn von „ihre Taten“ oder „ihre Werke“.'
    reason: alternative_reading
  - marker: b
    text: Der hebräische Schlusssatz ist schwer zu deuten. Gemeint sein kann, dass ein Mensch nicht im Voraus weiß, ob Liebe oder Hass auf ihn wartet, oder dass die gegenwärtigen Umstände nicht erkennen lassen, ob jemand geliebt oder gehasst wird.
    reason: alternative_reading
lexical_decisions:
- source_word: נָתַתִּי אֶל לִבִּי
  choice: nahm ich mir zu Herzen
  rationale: Die geläufige deutsche Wendung bewahrt das hebräische Bild und bezeichnet ernsthaftes inneres Erwägen.
- source_word: וְלָבוּר
  choice: um es zu ergründen
  rationale: Gibt die gedankliche Untersuchung beziehungsweise Klärung natürlich und im Zusammenhang des Predigerbuches passend wieder.
- source_word: הַצַּדִּיקִים
  choice: die Gerechten
  rationale: Bewahrt den moralischen und religiösen Gehalt des hebräischen Ausdrucks.
- source_word: הַחֲכָמִים
  choice: die Weisen
  rationale: Ist die natürliche deutsche Bezeichnung im Kontext der Weisheitsliteratur.
- source_word: וַעֲבָדֵיהֶם
  choice: und ihre Werke
  rationale: Folgt der im Zusammenhang sinnvollen Deutung als das Tun der Gerechten und Weisen; die masoretisch naheliegende Lesart „ihre Diener“ bleibt in einer Fußnote erhalten.
- source_word: בְּיַד הָאֱלֹהִים
  choice: in Gottes Hand
  rationale: Bewahrt das konkrete Bild für Gottes Macht, Obhut und Verfügung, ohne dessen Nuance einseitig festzulegen.
- source_word: גַּם אַהֲבָה גַם שִׂנְאָה
  choice: Ob Liebe oder Hass
  rationale: Drückt die im Zusammenhang bestehende Ungewissheit zwischen den beiden gegensätzlichen Möglichkeiten idiomatisch aus.
- source_word: הָאָדָם
  choice: der Mensch
  rationale: Gibt den generischen Singular im modernen Standarddeutsch natürlich und geschlechtsübergreifend wieder.
- source_word: הַכֹּל לִפְנֵיהֶם
  choice: alles liegt vor ihnen
  rationale: Bleibt nahe an der schwierigen hebräischen Formulierung und lässt offen, ob von dem vor ihnen Liegenden oder dem ihnen Bevorstehenden die Rede ist.
theological_decisions:
- issue: Bedeutung von וַעֲבָדֵיהֶם
  choice: ihre Werke
  alternative: ihre Diener
  rationale: Die Deutung als Werke fügt sich in die Aussage, dass sowohl die Gerechten und Weisen als auch ihr Tun in Gottes Hand sind. Da die überlieferte Konsonanten- und Vokalgestalt jedoch sehr natürlich „ihre Diener“ bedeutet, wird diese echte Schwierigkeit ausdrücklich vermerkt.
- issue: Sinn der Aussage über Liebe und Hass
  choice: Der Mensch weiß nicht, ob Liebe oder Hass vor ihm liegt.
  alternative: Aus den gegenwärtigen Umständen kann der Mensch nicht erkennen, ob er geliebt oder gehasst wird.
  rationale: Der komprimierte hebräische Satz lässt offen, ob es um die unbekannte Zukunft oder um die Undurchschaubarkeit der gegenwärtigen Lage geht. Der Haupttext wahrt diese Spannung weitgehend; die Fußnote nennt beide Verständnismöglichkeiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vertrauten Bilder „sich etwas zu Herzen nehmen“ und „in Gottes Hand“ bleiben erhalten. Der Gedankenstrich macht den gedrängten Übergang zur Aussage über Liebe und Hass lesbar, ohne die syntaktische und theologische Offenheit des Hebräischen aufzulösen.
