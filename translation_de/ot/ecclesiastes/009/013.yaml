  terminology: »Weisheit« und »unter der Sonne« entsprechen den zentralen hebräischen Begriffen und dem etablierten Sprachgebrauch im Predigerbuch. »Groß« ist hier dem engeren »bedeutend« vorzuziehen, weil es die Art der positiven Bewertung nicht festlegt.
