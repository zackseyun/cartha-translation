  text: 'Auch dies sah ich: Weisheit unter der Sonne, und sie erschien mir groß:[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Auch diese Weisheit sah ich unter der Sonne, und sie war groß in meinen Augen.« Der hebräische Wortlaut bezeichnet das Beobachtete unmittelbar als »Weisheit« und lässt offen, ob damit Weisheit allgemein oder das folgende Beispiel gemeint ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם זֹה
  choice: Auch dies
  rationale: Bewahrt die additive Kraft von גַּם und den vorausweisenden Demonstrativausdruck זֹה natürlich im Deutschen.
- source_word: רָאִיתִי חָכְמָה
  choice: sah ich als Weisheit an
  rationale: Der hebräische Text lässt חָכְמָה als Gegenstand der Wahrnehmung stehen. Die deutsche Fassung macht den Zusammenhang idiomatisch verständlich, ohne ausdrücklich ein »Beispiel« in den Haupttext einzufügen.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: unter der Sonne
  rationale: Die feste Wendung des Predigerbuches wird wörtlich und im Deutschen vertraut wiedergegeben.
- source_word: וּגְדוֹלָה הִיא אֵלָי
  choice: und sie erschien mir bedeutend
  rationale: אֵלָי bezeichnet hier die persönliche Einschätzung des Sprechers. »Bedeutend« gibt גְדוֹלָה im Kontext natürlicher wieder als das missverständliche »groß«, ohne die Art der Größe enger festzulegen.
