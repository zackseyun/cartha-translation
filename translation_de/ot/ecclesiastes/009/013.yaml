  source_fidelity: 'Die Hauptfassung verschiebt die Syntax und Aussage leicht: »als Weisheit ansehen« bedeutet im Deutschen primär, etwas als Weisheit zu beurteilen, während das Hebräische חָכְמָה unmittelbar als das Gesehene nennt. Die vorwärtsweisende Beziehung von »dies« auf die anschließende Schilderung kann ohne diese zusätzliche Beurteilungsnuance bewahrt werden. »erschien mir groß« gibt וּגְדוֹלָה הִיא אֵלָי angemessen wieder und erhält die offene evaluative Bedeutung von גדוֹלה.'
