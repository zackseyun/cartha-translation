  text: כֹּ֠ל אֲשֶׁ֨ר תִּמְצָ֧א יָֽדְ/ךָ֛ לַ/עֲשׂ֥וֹת בְּ/כֹחֲ/ךָ֖ עֲשֵׂ֑ה כִּי֩ אֵ֨ין מַעֲשֶׂ֤ה וְ/חֶשְׁבּוֹן֙ וְ/דַ֣עַת וְ/חָכְמָ֔ה בִּ/שְׁא֕וֹל אֲשֶׁ֥ר אַתָּ֖ה הֹלֵ֥ךְ שָֽׁמָּ/ה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/010.yaml
  text: Whatever your hand finds to do, do it with your strength, for there is no work or planning or knowledge or wisdom in Sheol, where you are going.
translation:
  language: de
  text: Alles, was deine Hand zu tun findet, das tu mit deiner Kraft; denn im Scheol[a], wohin du gehst, gibt es weder Tun noch Planen, weder Erkenntnis noch Weisheit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »im Grab« bzw. »im Totenreich«. »Scheol« bezeichnet im Alten Testament den Ort oder Zustand der Toten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל אֲשֶׁר
  choice: Alles, was
  rationale: Gibt die umfassende Relativformel natürlich und vollständig wieder.
- source_word: תִּמְצָא יָדְךָ
  choice: deine Hand ... findet
  rationale: Bewahrt das hebräische Bild für das, was sich als Möglichkeit oder Aufgabe praktisch darbietet.
- source_word: לַעֲשׂוֹת ... עֲשֵׂה
  choice: zu tun findet, das tu
  rationale: Die Wiederaufnahme durch das Demonstrativpronomen bildet den Infinitiv und den nachfolgenden Imperativ klar und idiomatisch ab.
- source_word: בְּכֹחֲךָ
  choice: mit deiner ganzen Kraft
  rationale: Drückt den Einsatz der verfügbaren Kraft in natürlichem Deutsch aus; „ganzen“ macht die idiomatische Intensität deutlich, ohne eine zusätzliche Tätigkeit einzuführen.
- source_word: מַעֲשֶׂה
  choice: Tun
  rationale: Bezeichnet hier allgemein Tätigkeit und korrespondiert mit dem vorausgehenden Verb „tun“.
- source_word: חֶשְׁבּוֹן
  choice: Planen
  rationale: Im Zusammenhang bezeichnet das Wort Überlegen, Berechnen oder Entwerfen; „Planen“ passt natürlich in die Reihe menschlicher Tätigkeiten und Fähigkeiten.
- source_word: דַעַת
  choice: Erkenntnis
  rationale: Bewahrt den kognitiven Sinn und unterscheidet den Begriff angemessen von חָכְמָה.
- source_word: חָכְמָה
  choice: Weisheit
  rationale: Entspricht dem breiten weisheitlichen Gebrauch des Wortes im Predigerbuch.
- source_word: בִּשְׁאוֹל
  choice: im Scheol
  rationale: Die Transliteration bewahrt den alttestamentlichen Begriff, ohne ihn auf Grab oder Hölle zu verengen.
- source_word: אֲשֶׁר אַתָּה הֹלֵךְ שָׁמָּה
  choice: wohin du gehst
  rationale: Gibt die Zielrichtung des Relativsatzes knapp und natürlich wieder.
theological_decisions:
- issue: Wiedergabe von שְׁאוֹל
  choice: Scheol
  alternative: Grab; Totenreich
  rationale: „Scheol“ erhält die Bedeutungsbreite des hebräischen Begriffs und vermeidet die Eintragung späterer Vorstellungen von „Hölle“. Eine Fußnote erklärt den Begriff.
- issue: Aussage über Tätigkeit und Erkenntnis im Scheol
  choice: unmittelbare, uneingeschränkte Wiedergabe der vierfachen Verneinung
  alternative: Deutung als bloßes Ende irdischer Möglichkeiten
  rationale: Der Text formuliert die Abwesenheit von Tun, Planen, Erkenntnis und Weisheit im Scheol direkt. Die Übersetzung lässt diese theologische Spannung stehen und fügt keine harmonisierende Einschränkung ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das hebräische Hand-Bild bleibt erhalten; die paarige Formulierung „weder ... noch, weder ... noch“ macht die vier Glieder klar, ohne ihren Inhalt zu verändern.
