- from: 'Denn auch der Mensch[a] kennt seine Zeit nicht: Wie Fische, die in einem verhängnisvollen Netz gefangen sind, und wie Vögel, die in einer Schlinge gefangen sind, so werden die Menschen[b] in einer bösen Zeit[c] verstrickt, wenn diese plötzlich über sie hereinbricht.'
  to: 'Denn auch der Mensch[a] kennt seine Zeit nicht: Wie Fische, die in einem verhängnisvollen Netz gefangen sind, und wie Vögel, die in einer Schlinge gefangen sind, so werden die Menschen[b] zu einer Zeit des Unheils[c] gefangen, wenn sie plötzlich über sie hereinbricht.'
  rationale: Die Revision ersetzt das zu abstrakte „verstrickt“ durch das konkrete „gefangen“, das die wiederholte Fangmetaphorik des Hebräischen bewahrt. „Zu einer Zeit des Unheils“ macht den punktuellen, plötzlich hereinbrechenden Charakter von לְעֵת רָעָה deutlich, ohne die Wiederholung von רָעָה zu verlieren; diese wird in der Fußnote transparent gemacht. Die idiomatische Erläuterung zu בְּנֵי הָאָדָם wird von der sachlich nicht naheliegenden Bezugnahme auf Adam bereinigt.
