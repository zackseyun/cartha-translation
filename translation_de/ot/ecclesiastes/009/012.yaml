source:
  edition: WLC
  text: כִּ֡י גַּם֩ לֹֽא יֵדַ֨ע הָ/אָדָ֜ם אֶת עִתּ֗/וֹ כַּ/דָּגִים֙ שֶׁ/נֶּֽאֱחָזִים֙ בִּ/מְצוֹדָ֣ה רָעָ֔ה וְ/כַ֨/צִּפֳּרִ֔ים הָ/אֲחֻז֖וֹת בַּ/פָּ֑ח כָּ/הֵ֗ם יֽוּקָשִׁים֙ בְּנֵ֣י הָֽ/אָדָ֔ם לְ/עֵ֣ת רָעָ֔ה כְּ/שֶׁ/תִּפּ֥וֹל עֲלֵי/הֶ֖ם פִּתְאֹֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/012.yaml
  text: 'For man does not even know his time: like fish that are caught in a cruel net[a], and like birds that are caught in a snare, so the sons of man are trapped at an evil time[c][b], when it suddenly falls upon them.'
translation:
  language: de
  text: 'Denn auch der Mensch[a] kennt seine Zeit nicht: Wie Fische, die in einem verhängnisvollen Netz gefangen sind, und wie Vögel, die in einer Schlinge gefangen sind, so werden die Menschen[b] zu einer Zeit des Unheils[c] gefangen, wenn sie plötzlich über sie hereinbricht.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Auch die Menschheit kennt ihre Zeit nicht.“ Das Hebräische verwendet den generischen Singular „der Mensch“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Söhne des Menschen“; eine hebräische Wendung für die Menschen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „zu einer bösen Zeit“; gemeint ist eine Zeit des Unheils.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָדָם
  choice: der Mensch
  rationale: Der bestimmte Singular bezeichnet hier den Menschen repräsentativ und lässt sich im Deutschen natürlich mit „der Mensch“ wiedergeben.
- source_word: עִתּוֹ
  choice: seine Zeit
  rationale: Die knappe Wiedergabe bewahrt die offene Bedeutung von עֵת als Zeit oder entscheidender Zeitpunkt, ohne ausdrücklich „Todesstunde“ oder „Schicksalsstunde“ einzutragen.
- source_word: מְצוֹדָה רָעָה
  choice: ein verhängnisvolles Netz
  rationale: רָעָה beschreibt hier die schädliche, unheilvolle Wirkung des Fangnetzes; „verhängnisvoll“ ist im Deutschen idiomatischer als „böse“ und vermeidet eine unnötige moralische Personifizierung.
- source_word: פָּח
  choice: Schlinge
  rationale: „Schlinge“ gibt die Vogelfalle im poetischen Parallelismus anschaulich und geläufig wieder.
- source_word: יֽוּקָשִׁים
  choice: werden verstrickt
  rationale: Die passive Form bezeichnet das Gefangen- oder Verstricktwerden. „Verstrickt“ erhält das Fangbild und vermeidet eine dreifache Wiederholung von „gefangen“.
- source_word: בְּנֵי הָאָדָם
  choice: die Menschen
  rationale: Die hebräische Wendung bedeutet idiomatisch die Menschen beziehungsweise die menschlichen Wesen; eine wörtliche Wiedergabe als „Menschensöhne“ wäre im modernen Deutsch unnötig fremd.
- source_word: לְעֵת רָעָה
  choice: in einer bösen Zeit
  rationale: Die formnahe Wiedergabe bewahrt die Wiederholung von רָעָה und die Spannung zwischen moralischem „böse“ und widerfahrendem „unheilvoll“.
- source_word: כְּשֶׁתִּפּוֹל עֲלֵיהֶם פִּתְאֹם
  choice: wenn diese plötzlich über sie hereinbricht
  rationale: „Diese“ nimmt die grammatisch feminine „Zeit“ auf; „hereinbricht“ gibt das plötzliche Überfallen durch das Unheil natürlich wieder, ohne ein zusätzliches Substantiv einzuführen.
theological_decisions:
- issue: Generischer Singular הָאָדָם und kollektive Wendung בְּנֵי הָאָדָם
  choice: „der Mensch“ im Singular, später idiomatisch „die Menschen“
  alternative: „die Menschheit“ beziehungsweise wörtlich „die Menschensöhne“
  rationale: So bleibt der Wechsel vom repräsentativen Einzelnen zur Gesamtheit erkennbar, ohne im Deutschen eine unnatürliche oder missverständliche Geschlechtsaussage zu erzeugen.
- issue: Bedeutung von „seine Zeit“
  choice: Die offene Formulierung „seine Zeit“ beibehalten
  alternative: „seine Todesstunde“ oder „den Zeitpunkt seines Unglücks“
  rationale: Der Zusammenhang legt einen plötzlich eintretenden Unglückszeitpunkt nahe, legt ihn aber nicht ausdrücklich ausschließlich als Todesstunde fest.
- issue: „Böse Zeit“ als moralisches oder leidvolles Übel
  choice: Formnah „böse Zeit“ mit erläuternder Fußnote
  alternative: „Zeit des Unheils“
  rationale: Die Übersetzung bewahrt die lexikalische Wiederholung und lässt zugleich durch die Fußnote erkennen, dass hier vor allem eine verhängnisvolle Unglückszeit gemeint sein kann.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Bildsprache von Netz, Schlinge und Verstrickung bleibt erhalten; erklärungsbedürftige hebräische Idiome und echte Bedeutungsalternativen werden in Fußnoten ausgewiesen.
