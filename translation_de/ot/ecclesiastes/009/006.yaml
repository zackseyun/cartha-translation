  variant: modern standard German
source:
  edition: WLC
  text: גַּ֣ם אַהֲבָתָ֧/ם גַּם שִׂנְאָתָ֛/ם גַּם קִנְאָתָ֖/ם כְּבָ֣ר אָבָ֑דָה וְ/חֵ֨לֶק אֵין לָ/הֶ֥ם עוֹד֙ לְ/עוֹלָ֔ם בְּ/כֹ֥ל אֲשֶֽׁר נַעֲשָׂ֖ה תַּ֥חַת הַ/שָּֽׁמֶשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/006.yaml
  text: Their love[a], their hatred, and their jealousy have already perished, and they no longer have a share forever in anything that is done under the sun.
translation:
  language: de
  text: Auch ihre Liebe, auch ihr Hass, auch ihre Eifersucht[a] sind längst vergangen, und für immer haben sie keinen Anteil mehr an irgendetwas, das unter der Sonne getan wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ihr Eifer oder ihr Neid.'
    reason: Das hebräische קִנְאָה besitzt je nach Zusammenhang die Bedeutungsbreite „Eifersucht“, „Eifer“ oder „Neid“.
lexical_decisions:
- source_word: גַּם ... גַּם ... גַּם
  choice: Auch ... auch ... auch
  rationale: Die Wiederholung bewahrt die koordinierende und nachdrückliche Wirkung der dreifachen Partikel, ohne den Satz unnatürlich wirken zu lassen.
- source_word: אַהֲבָתָם
  choice: ihre Liebe
  rationale: Direkte Wiedergabe des abstrakten Substantivs mit Suffix der 3. Person maskulin Plural.
- source_word: שִׂנְאָתָם
  choice: ihr Hass
  rationale: „Hass“ ist die natürliche deutsche Entsprechung und steht stilistisch parallel zu „Liebe“ und „Eifersucht“.
- source_word: קִנְאָתָם
  choice: ihre Eifersucht
  rationale: קִנְאָה kann Eifersucht, Eifer oder Neid bezeichnen. Im Zusammenhang mit Liebe und Hass passt „Eifersucht“ als zwischenmenschliche Leidenschaft am besten; die Mehrdeutigkeit wird in einer Fußnote bewahrt.
- source_word: כְּבָר אָבָדָה
  choice: sind längst vergangen
  rationale: כְּבָר bezeichnet einen bereits eingetretenen Zustand; „längst“ gibt dies knapp wieder. Das singularische אָבָדָה bezieht sich kollektiv auf die vorausgehende Reihe, während im Deutschen der zusammengesetzte Satzgegenstand den Plural verlangt.
- source_word: וְחֵלֶק אֵין לָהֶם עוֹד
  choice: und ... haben sie keinen Anteil mehr
  rationale: Die hebräische Existenzkonstruktion wird idiomatisch wiedergegeben; חֵלֶק bezeichnet hier den Anteil am irdischen Geschehen.
- source_word: לְעוֹלָם
  choice: für immer
  rationale: Die Formulierung wahrt ausdrücklich die dauerhafte Geltung der Aussage und vermeidet eine Abschwächung zu bloßem „nicht mehr“.
- source_word: בְּכֹל אֲשֶׁר נַעֲשָׂה
  choice: an irgendetwas, das ... getan wird
  rationale: Nach der Verneinung gibt „irgendetwas“ die umfassende Aussage natürlich wieder; „getan wird“ bewahrt die passive Form von נַעֲשָׂה.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: unter der Sonne
  rationale: Die feste Wendung des Predigerbuchs bezeichnet den Bereich des irdischen Lebens und bleibt im Deutschen klar und verständlich.
theological_decisions:
- issue: Reichweite der Aussage über das Verhältnis der Toten zum irdischen Geschehen
  choice: Der Vers sagt, dass die Toten keinen Anteil mehr an dem haben, was „unter der Sonne“ getan wird.
  alternative: Der Vers wird als umfassende metaphysische Aussage verstanden, nach der die Toten in jeder Hinsicht ohne Bewusstsein sind.
  rationale: Die ausdrückliche Begrenzung „unter der Sonne“ bezieht die Aussage auf den irdischen Lebens- und Handlungsbereich. Die Übersetzung wahrt diese Grenze und entscheidet keine weitergehende Lehre über den Zustand der Toten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreifache Wiederholung von „auch“ bildet den Nachdruck des Hebräischen ab; die traditionelle und zentrale Wendung „unter der Sonne“ bleibt erhalten.
