source:
  edition: WLC
  text: כִּ֧י הַֽ/חַיִּ֛ים יוֹדְעִ֖ים שֶׁ/יָּמֻ֑תוּ וְ/הַ/מֵּתִ֞ים אֵינָ֧/ם יוֹדְעִ֣ים מְא֗וּמָה וְ/אֵֽין ע֤וֹד לָ/הֶם֙ שָׂכָ֔ר כִּ֥י נִשְׁכַּ֖ח זִכְרָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/005.yaml
  text: For the living know that they will die[a], but the dead know nothing at all, and there is no longer any reward for them, because their memory is forgotten.
translation:
  language: de
  text: Denn die Lebenden wissen, dass sie sterben werden; die Toten aber wissen überhaupt nichts, und es gibt keinen Lohn mehr für sie, denn ihr Andenken ist vergessen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorangehende Aussage ein und bewahrt den argumentativen Zusammenhang.
- source_word: הַחַיִּים
  choice: die Lebenden
  rationale: Gibt die substantivierte Pluralform knapp und im Deutschen idiomatisch wieder.
- source_word: יוֹדְעִים שֶׁיָּמֻתוּ
  choice: wissen, dass sie sterben werden
  rationale: Bewahrt sowohl die Grundbedeutung von ידע als auch den Inhaltssatz und den Zukunftsbezug der Verbform.
- source_word: וְהַמֵּתִים
  choice: die Toten aber
  rationale: Das Waw verbindet formal die Sätze; die Stellung von „aber“ bringt den deutlichen inhaltlichen Gegensatz im natürlichen Deutschen zum Ausdruck.
- source_word: אֵינָם יוֹדְעִים מְאוּמָה
  choice: wissen überhaupt nichts
  rationale: „Überhaupt nichts“ gibt die durch מְאוּמָה verstärkte Verneinung klar und idiomatisch wieder.
- source_word: וְאֵין עוֹד לָהֶם שָׂכָר
  choice: und es gibt keinen Lohn mehr für sie
  rationale: „Lohn“ bewahrt das Bedeutungsspektrum von שָׂכָר zwischen Entgelt und Ertrag; „mehr“ gibt עוֹד wieder.
- source_word: כִּי נִשְׁכַּח זִכְרָם
  choice: denn ihr Andenken ist vergessen
  rationale: „Andenken“ bezeichnet hier die fortbestehende Erinnerung an die Verstorbenen; die passive Form des Hebräischen bleibt erhalten.
theological_decisions:
- issue: Ob die Aussage über das Wissen der Toten durch einen erklärenden Zusatz eingeschränkt werden soll
  choice: Die Toten aber wissen überhaupt nichts
  alternative: Die Toten wissen nichts von dem, was unter der Sonne geschieht
  rationale: Der hebräische Vers formuliert die Aussage uneingeschränkt. Die Übersetzung bewahrt diese literarische und theologische Spannung, ohne daraus eine weitergehende systematische Lehre abzuleiten oder eine nicht im Vers stehende Einschränkung einzufügen.
- issue: Bedeutung von שָׂכָר im Zusammenhang mit den Toten
  choice: Lohn
  alternative: Belohnung
  rationale: „Lohn“ lässt sowohl den konkreten Ertrag menschlicher Arbeit als auch allgemeinere Vergeltung anklingen und legt den Ausdruck weniger stark auf eine jenseitige Belohnung fest.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Satzbau. Der Gegensatz zwischen Lebenden und Toten sowie die emphatische Verneinung werden deutlich bewahrt. Auf eine Fußnote wurde verzichtet, weil „überhaupt nichts“ die hebräische Verstärkung bereits im Haupttext angemessen wiedergibt.
