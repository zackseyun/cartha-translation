  source_fidelity: 'Die Übersetzung gibt den hebräischen Satzbau und die wesentlichen Aussagen zuverlässig wieder: die Lebenden wissen um ihren künftigen Tod, die Toten wissen „überhaupt nichts“, für sie gibt es keinen Lohn mehr, und ihr Andenken ist vergessen. „Denn“ bildet die begründende Funktion von כִּי angemessen ab; „aber“ vermittelt den kontextuellen Gegensatz bei וְ. Die Verstärkung durch מְאוּמָה ist mit „überhaupt nichts“ klar erhalten.'
  naturalness: Modernes, gut verständliches Standarddeutsch mit einem knappen, würdigen Register. „Die Lebenden“ und „die Toten“ sind idiomatisch. Auch „ihr Andenken ist vergessen“ ist in diesem literarisch-biblischen Register natürlich und verständlich.
  terminology: „Lohn“ ist für שָׂכָר semantisch vertretbar und bewahrt dessen offenes Spektrum zwischen Ertrag, Entgelt und Vergeltung, ohne eine spezifisch jenseitige Belohnung zu behaupten. „Andenken“ gibt זִכְרָם passend wieder. Die Übersetzung fügt keine lehrmäßige Einschränkung der Aussage über die Toten hinzu und löst die im Text vorhandene Spannung nicht harmonisierend auf.
