base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/002.yaml
  text: 'All is the same for all: one fate comes to the righteous and to the wicked[a], to the good and to the clean and to the unclean, to the one who sacrifices and to the one who does not sacrifice; as the good one, so the sinner[b]; the one who swears is as the one who fears an oath.'
translation:
  language: de
  text: 'Allen widerfährt dasselbe[a]: dem Gerechten und dem Gottlosen, dem Guten, dem Reinen und dem Unreinen, dem, der opfert, und dem, der nicht opfert. Dem Guten ergeht es wie dem Sünder; wer schwört, ist wie der, der einen Eid fürchtet[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ein Geschehen trifft alle“ oder „Ein Geschick ist allen gemeinsam“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der sich zu schwören fürchtet“.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַכֹּל כַּאֲשֶׁר לַכֹּל
  choice: Alle trifft dasselbe
  rationale: Die elliptische Eröffnung wird in natürlichem Deutsch als umfassende Aussage über alle Menschen wiedergegeben und leitet unmittelbar zum gemeinsamen Geschick über.
- source_word: מִקְרֶה אֶחָד
  choice: dasselbe
  rationale: Gemeint ist das eine Geschehen beziehungsweise Geschick, das allen widerfährt; im Zusammenhang steht besonders der Tod im Blick. Die knappe Formulierung vermeidet zugleich eine deterministische Nebenbedeutung von „Schicksal“.
- source_word: לַצַּדִּיק וְלָרָשָׁע
  choice: den Gerechten und den Gottlosen
  rationale: Bewahrt den grundlegenden ethisch-religiösen Gegensatz des Hebräischen.
- source_word: לַטּוֹב
  choice: den Guten
  rationale: Bleibt als eigene, wenn auch überlappende Kategorie neben „Gerechten“ erhalten.
- source_word: לַטָּהוֹר וְלַטָּמֵא
  choice: den Reinen und den Unreinen
  rationale: Bewahrt die wahrscheinlich kultisch-rituelle Dimension, ohne die Begriffe ausschließlich darauf festzulegen.
- source_word: לַזֹּבֵחַ וְלַאֲשֶׁר אֵינֶנּוּ זֹבֵחַ
  choice: den, der opfert, und den, der nicht opfert
  rationale: Gibt den partizipialen Gegensatz klar und unmittelbar wieder.
- source_word: כַּטּוֹב כַּחֹטֶא
  choice: Wie dem Guten ergeht es dem Sünder
  rationale: Macht die knappe Vergleichskonstruktion im Deutschen verständlich und wahrt den spruchartigen Parallelismus.
- source_word: הַנִּשְׁבָּע כַּאֲשֶׁר שְׁבוּעָה יָרֵא
  choice: wer schwört, ist wie der, der einen Eid fürchtet
  rationale: Bewahrt die Mehrdeutigkeit zwischen Scheu vor dem Schwören und ehrfürchtiger Vorsicht gegenüber einem Eid.
theological_decisions:
- issue: Bedeutung von מִקְרֶה אֶחָד
  choice: als dasselbe gemeinsame Widerfahrnis ausgedrückt
  alternative: ein Geschick; ein Ereignis
  rationale: Der Kontext legt den allen gemeinsamen Ausgang, besonders den Tod, nahe. Die Übersetzung hält die Beobachtung fest, ohne eine Lehre von unpersönlichem Fatalismus einzutragen.
- issue: Rein und unrein
  choice: rituell offene Kategorien beibehalten
  alternative: moralisch rein und verdorben
  rationale: Die kultische Bedeutung bleibt erkennbar, während die Begriffe nicht vorschnell auf eine ausschließlich rituelle oder moralische Deutung eingeengt werden.
- issue: Schlussvergleich zum Eid
  choice: „einen Eid fürchtet“ im Haupttext
  alternative: „sich zu schwören scheut“ oder „einen Eid achtet“
  rationale: Das Hebräische lässt sowohl Scheu vor dem Ablegen eines Eides als auch ehrfürchtige Vorsicht gegenüber Eiden zu; diese Spannung wird nicht aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Aufzählung und ihre rhetorischen Gegensätze bleiben erhalten; erklärende Zusätze werden vermieden. Sämtliche Fußnotenmarker stehen im Haupttext.
