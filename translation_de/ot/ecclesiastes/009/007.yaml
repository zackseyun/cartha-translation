  text: לֵ֣ךְ אֱכֹ֤ל בְּ/שִׂמְחָה֙ לַחְמֶ֔/ךָ וּֽ/שֲׁתֵ֥ה בְ/לֶב ט֖וֹב יֵינֶ֑/ךָ כִּ֣י כְבָ֔ר רָצָ֥ה הָ/אֱלֹהִ֖ים אֶֽת מַעֲשֶֽׂי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/007.yaml
  text: Go[a], eat your bread with joy, and drink your wine with a glad heart, for God has already approved your works.
translation:
  language: de
  text: Geh, iss dein Brot mit Freude und trink deinen Wein mit frohem Herzen; denn Gott hat bereits Gefallen an deinen Taten gefunden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „denn Gott hat deine Taten bereits angenommen“; auch möglich: „denn Gott hat bereits Freude an deinem Tun“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ
  choice: Geh
  rationale: Der Imperativ von הלך leitet hier idiomatisch eine Aufforderung ein. „Geh“ bewahrt die knappe hebräische Diskursform, ohne sie erklärend auszubauen.
- source_word: אֱכֹל בְּשִׂמְחָה לַחְמֶךָ
  choice: iss dein Brot mit Freude
  rationale: Die direkten Bilder und die modale Präpositionalfügung bleiben erhalten; „Brot“ ist auch im Deutschen natürlich und muss nicht zu „Essen“ verallgemeinert werden.
- source_word: וּשֲׁתֵה בְלֶב טוֹב יֵינֶךָ
  choice: und trink deinen Wein mit frohem Herzen
  rationale: „Mit frohem Herzen“ gibt die hebräische Rede vom לֵב als Sitz innerer Freude idiomatisch und dennoch bildnah wieder.
- source_word: כִּי כְבָר
  choice: denn … bereits
  rationale: כִּי begründet die Aufforderung; כְבָר bezeichnet eine schon bestehende beziehungsweise zuvor eingetretene Wirklichkeit.
- source_word: רָצָה
  choice: hat Gefallen … gefunden
  rationale: Die Wendung erfasst die günstige Annahme beziehungsweise das Wohlgefallen des Verbs, ohne es einseitig als kultische Annahme oder formale Billigung festzulegen.
- source_word: הָאֱלֹהִים
  choice: Gott
  rationale: Der bestimmte Ausdruck bezeichnet hier den einen Gott und wird im Deutschen konventionell mit „Gott“ wiedergegeben.
- source_word: מַעֲשֶׂיךָ
  choice: deinen Taten
  rationale: „Taten“ gibt den Plural konkret und in modernem Deutsch natürlicher wieder als das theologisch stärker vorgeprägte „Werke“.
theological_decisions:
- issue: Bedeutung des göttlichen Wohlgefallens im Schlusssatz
  choice: Der Vers erklärt, dass Gott bereits Gefallen an den Taten des Angeredeten gefunden hat, und begründet damit die Aufforderung, die Gaben des Lebens freudig zu genießen.
  alternative: „Gott hat deine Taten angenommen“ kann eine günstige Annahme, möglicherweise auch in kultischem Sinn, ausdrücken; „Gott freut sich über deine Taten“ betont stärker sein gegenwärtiges Wohlgefallen.
  rationale: רצה mit מַעֲשִׂים lässt günstige Annahme oder Wohlgefallen zu. „Gefallen … gefunden“ bewahrt diese Spannweite und macht aus dem Vers weder eine ausdrückliche Lehre von Verdienst noch eine Aussage über einen besonderen Opferkontext.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter, knapper Aufforderung. Die traditionelle Herzmetapher bleibt erhalten; „Taten“ vermeidet unnötig konfessionell geprägte Assoziationen von „Werken“.
