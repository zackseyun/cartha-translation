  terminology: »Flüchtig« ist für הֶבֶל in diesem Kontext eine zurückhaltende, tragfähige Wahl. »Anteil«, »unter der Sonne« und »Mühe/abmühst« sind treffend. »die Frau, die du liebst« bewahrt die im hebräischen אִשָּׁה mögliche Offenheit zwischen Frau und Ehefrau, ohne den persönlichen Bezug des Satzes zu verlieren.
