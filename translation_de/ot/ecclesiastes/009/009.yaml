  source_fidelity: Die Übersetzung gibt die hebräische Aufforderung רְאֵה חַיִּים idiomatisch als »Genieße das Leben« wieder und kennzeichnet die wörtliche Alternative angemessen in der Fußnote. Die Wiederholung von »all die Tage« und die doppelte הֶבֶל-Bestimmung bleiben erhalten. Das ungenannte Subjekt von נָתַן wird mit »er« nicht dogmatisch spezifiziert; die Fußnote erklärt den kontextuell naheliegenden Bezug. »Anteil am Leben und bei der Mühe« bildet die parallelen Präpositionalgruppen des Hebräischen vertretbar ab.
