source:
  edition: WLC
  text: רְאֵ֨ה חַיִּ֜ים עִם אִשָּׁ֣ה אֲשֶׁר אָהַ֗בְתָּ כָּל יְמֵי֙ חַיֵּ֣י הֶבְלֶ֔/ךָ אֲשֶׁ֤ר נָֽתַן לְ/ךָ֙ תַּ֣חַת הַ/שֶּׁ֔מֶשׁ כֹּ֖ל יְמֵ֣י הֶבְלֶ֑/ךָ כִּ֣י ה֤וּא חֶלְקְ/ךָ֙ בַּֽ/חַיִּ֔ים וּ/בַ/עֲמָ֣לְ/ךָ֔ אֲשֶׁר אַתָּ֥ה עָמֵ֖ל תַּ֥חַת הַ/שָּֽׁמֶשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/009.yaml
  text: Enjoy life with the wife whom you love all the days of your fleeting life that he has given you under the sun—all your fleeting days—for that is your portion in life and in your labor at which you toil under the sun[a][b][c].
translation:
  language: de
  text: Genieße das Leben[a] mit der Frau, die du liebst, all die Tage deines flüchtigen Lebens[b], die er[c] dir unter der Sonne gegeben hat – all deine flüchtigen Tage. Denn das ist dein Anteil am Leben und bei der Mühe, mit der du dich unter der Sonne abmühst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Sieh das Leben«. Die hebräische Wendung kann bedeuten, das Leben zu erfahren oder zu genießen.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch hebel: wörtlich etwa »Hauch« oder »Dunst«; hier bezeichnet das Wort den flüchtigen, vergänglichen Charakter des Lebens.'
    reason: lexical_alternative
  - marker: c
    text: Das Subjekt von »gegeben hat« wird im Hebräischen nicht ausdrücklich genannt. Der weitere Zusammenhang legt Gott nahe.
    reason: alternative_reading
lexical_decisions:
- source_word: רְאֵה חַיִּים
  choice: Genieße das Leben
  rationale: Wörtlich steht hier »sieh das Leben«. In dieser Verbindung bezeichnet das hebräische Idiom jedoch das Erleben beziehungsweise Genießen des Lebens; »Genieße das Leben« gibt den Sinn in natürlichem Deutsch wieder.
- source_word: עִם אִשָּׁה אֲשֶׁר אָהַבְתָּ
  choice: mit der Frau, die du liebst
  rationale: אִשָּׁה kann »Frau« oder »Ehefrau« bedeuten. Der bestimmte deutsche Ausdruck mit dem Relativsatz bezeichnet hier die geliebte Lebensgefährtin, ohne mehr festzulegen, als der hebräische Wortlaut ausdrücklich sagt.
- source_word: חַיֵּי הֶבְלֶךָ / יְמֵי הֶבְלֶךָ
  choice: deines flüchtigen Lebens / deine flüchtigen Tage
  rationale: הֶבֶל bezeichnet in Kohelet etwas Hauchgleiches, Vergängliches und Unbeständiges. »Flüchtig« bewahrt den Gedanken der Kürze und Vergänglichkeit, ohne ihn vorschnell als »sinnlos« auszulegen.
- source_word: אֲשֶׁר נָתַן לְךָ
  choice: die er dir ... gegeben hat
  rationale: Das Verb nennt ein männliches Subjekt der dritten Person, ohne es in diesem Satzteil ausdrücklich zu benennen. Das Pronomen »er« wahrt diese Zurückhaltung; der Relativsatz wird im Deutschen natürlich auf die Tage bezogen.
- source_word: תַּחַת הַשֶּׁמֶשׁ
  choice: unter der Sonne
  rationale: Die für Kohelet kennzeichnende Wendung wird wörtlich und im Deutschen verständlich wiedergegeben.
- source_word: כִּי הוּא חֶלְקְךָ
  choice: Denn das ist dein Anteil
  rationale: חֵלֶק bezeichnet den einem Menschen zufallenden oder zugeteilten Anteil. Das sächliche »das« lässt den Rückbezug wie im Hebräischen offen, statt ihn enger festzulegen.
- source_word: וּבַעֲמָלְךָ אֲשֶׁר אַתָּה עָמֵל
  choice: und bei der Mühe, mit der du dich ... abmühst
  rationale: Die Wiedergabe erhält die hebräische Wiederholung des Wortstamms עמל und dessen Betonung anstrengender, fortgesetzter Arbeit, bleibt dabei aber idiomatisches Deutsch.
theological_decisions:
- issue: Unausgesprochenes Subjekt von נָתַן
  choice: Im Haupttext steht »er«, ohne »Gott« ausdrücklich einzusetzen.
  alternative: »die Gott dir unter der Sonne gegeben hat«
  rationale: Im weiteren Zusammenhang ist Gott als Geber naheliegend, doch in diesem Satzteil wird er nicht namentlich genannt. Die Übersetzung bewahrt diese textliche Zurückhaltung.
- issue: Bezug von הוּא in »das ist dein Anteil«
  choice: Das neutrale Demonstrativpronomen »das« lässt den genauen Rückbezug offen.
  alternative: Den Anteil ausdrücklich auf die Frau, den Lebensgenuss oder die Tage beziehen.
  rationale: Das maskuline hebräische Pronomen kann zusammenfassend auf den vorausgehenden Gedanken weisen; eine eindeutige inhaltliche Festlegung würde die vorhandene Mehrdeutigkeit unnötig auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweimalige Nennung der flüchtigen Tage folgt der eindringlichen Wiederholung im Hebräischen. »Abmühen« hält den charakteristischen Wortstamm von עָמָל hörbar, ohne die Aussage konfessionell oder dogmatisch auszudeuten.
