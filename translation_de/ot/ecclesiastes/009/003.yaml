source:
  edition: WLC
  text: זֶ֣ה רָ֗ע בְּ/כֹ֤ל אֲשֶֽׁר נַעֲשָׂה֙ תַּ֣חַת הַ/שֶּׁ֔מֶשׁ כִּֽי מִקְרֶ֥ה אֶחָ֖ד לַ/כֹּ֑ל וְ/גַ֣ם לֵ֣ב בְּֽנֵי הָ֠/אָדָם מָלֵא רָ֨ע וְ/הוֹלֵל֤וֹת בִּ/לְבָבָ/ם֙ בְּ/חַיֵּי/הֶ֔ם וְ/אַחֲרָ֖י/ו אֶל הַ/מֵּתִֽים׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/003.yaml
  text: 'This is the evil in all that is done under the sun: that one fate comes to all[a]. Also, the heart of the sons of man is full of evil, and madness is in their hearts during their lives—and afterward[c][b], they go to the dead.'
translation:
  language: de
  text: 'Das ist das Übel bei allem, was unter der Sonne geschieht: Alle trifft dasselbe Geschick.[a] Auch das Herz der Menschenkinder[b] ist voll Bösem, und solange sie leben, ist Wahnsinn in ihrem Herzen; danach gehen sie zu den Toten.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Allen widerfährt dasselbe Ereignis.“ Das hebräische Wort kann ein Ereignis, das einem Menschen Widerfahrende oder ein gemeinsames Geschick bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „der Menschenkinder“. Die hebräische Wendung bezeichnet hier die Menschen insgesamt; der Singular „Herz“ hat kollektiven Sinn.'
    reason: source_form_clarification
  - marker: c
    text: 'Das Hebräische endet unvermittelt, wörtlich etwa: „und danach: zu den Toten“. Das Verb „gehen“ ist aus dem Zusammenhang ergänzt.'
    reason: ellipsis_clarification
lexical_decisions:
- source_word: זֶה רָע
  choice: Das ist das Übel
  rationale: Die Wendung bezeichnet wertend den beklagenswerten Sachverhalt, der nun benannt wird. „Das Übel“ wahrt die Prägnanz und den ernsten Ton.
- source_word: בְּכֹל אֲשֶׁר נַעֲשָׂה תַּחַת הַשֶּׁמֶשׁ
  choice: bei allem, was unter der Sonne geschieht
  rationale: Bewahrt die für Kohelet charakteristische Formel „unter der Sonne“ und gibt die unpersönliche Passivform im Deutschen natürlich wieder.
- source_word: כִּי מִקְרֶה אֶחָד לַכֹּל
  choice: Alle trifft dasselbe Geschick
  rationale: מִקְרֶה bezeichnet hier das allen gleichermaßen Widerfahrende. „Geschick“ trägt den existenziellen Sinn, ohne eine deterministische Lehre festzulegen; die mögliche Wiedergabe als „Ereignis“ wird in der Fußnote genannt.
- source_word: לֵב בְּנֵי הָאָדָם
  choice: das Herz der Menschenkinder
  rationale: Der kollektive Singular „Herz“ bleibt erhalten. „Menschenkinder“ bildet die hebräische Wendung quellennah und im Deutschen geschlechtsübergreifend ab.
- source_word: מָלֵא רָע
  choice: ist voll Bösem
  rationale: Direkte Wiedergabe der Prädikatskonstruktion; „Böses“ lässt sowohl moralische Verdorbenheit als auch schädliche Absichten anklingen.
- source_word: וְהוֹלֵלוֹת
  choice: und … Wahnsinn
  rationale: Das abstrakte Pluralwort beschreibt irrationale, zügellose Verblendung. „Wahnsinn“ bewahrt die Schärfe des Ausdrucks besser als das mildere „Torheit“.
- source_word: בִּלְבָבָם בְּחַיֵּיהֶם
  choice: solange sie leben, ist Wahnsinn in ihrem Herzen
  rationale: Die hebräische Herz-Metaphorik bleibt erhalten; die Zeitangabe wird in natürlicher deutscher Satzstellung wiedergegeben.
- source_word: וְאַחֲרָיו אֶל הַמֵּתִים
  choice: danach gehen sie zu den Toten
  rationale: 'Das Hebräische ist elliptisch und lautet wörtlich etwa „und danach/ nach ihm: zu den Toten“. Die Ergänzung des aus dem Zusammenhang erschlossenen Verbs ergibt einen vollständigen deutschen Satz, ohne einen bestimmten Ort oder eine ausgearbeitete Jenseitslehre einzutragen.'
theological_decisions:
- issue: Gemeinsames Geschick aller Menschen
  choice: Alle trifft dasselbe Geschick
  alternative: Dasselbe Ereignis widerfährt allen
  rationale: Der Vers betont die universale Gleichheit angesichts des Todes. „Geschick“ gibt diese Aussage wieder, ohne philosophischen Fatalismus zu behaupten.
- issue: Anthropologische Wiedergabe von בְּנֵי הָאָדָם
  choice: Menschenkinder
  alternative: Menschen / Menschenkinder Adams
  rationale: Die Formulierung ist generisch und meint die Menschheit, nicht ausschließlich Männer. „Menschenkinder“ bewahrt zugleich das konkrete Bild der hebräischen Konstruktion.
- issue: Elliptische Aussage über den Tod
  choice: danach gehen sie zu den Toten
  alternative: 'danach: zu den Toten'
  rationale: Das Bewegungsverb ist im Hebräischen nur impliziert. Es wird für verständliches Deutsch ergänzt; die Fußnote legt die abrupte Ausgangsform offen und verhindert, dass die Übersetzung als nähere Bestimmung des Jenseits missverstanden wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit der kohelettypischen Formel „unter der Sonne“. „Menschenkinder“ setzt einen leicht gehobenen, aber allgemein verständlichen Akzent; Satzbau und Verb-Ergänzung am Schluss dienen der natürlichen Lesbarkeit, während die Fußnoten die lexikalische und syntaktische Offenheit des Hebräischen bewahren.
