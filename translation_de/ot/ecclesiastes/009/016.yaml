base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/016.yaml
  text: And I said[a], “Wisdom is better than strength,” but the wisdom of the poor man is despised[c][b], and his words are not heard.
translation:
  language: de
  text: 'Da sagte ich: „Weisheit ist besser als Stärke[a].“ Doch die Weisheit des Armen[b] wird verachtet, und auf seine Worte hört man nicht[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Macht“ beziehungsweise „Kraft“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „des armen Mannes“; wahrscheinlich ist der arme Weise aus dem vorhergehenden Vers gemeint.'
    reason: cross_reference
  - marker: c
    text: 'Oder: „seine Worte finden kein Gehör“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתִּי אֲנִי
  choice: Da sagte ich
  rationale: Die Verbindung aus וְ und dem Perfekt leitet hier die Folgerung beziehungsweise Rückschau des Sprechers ein. „Da sagte ich“ gibt den Fortgang natürlich wieder, ohne den Zusammenhang stärker festzulegen.
- source_word: טוֹבָה חָכְמָה מִגְּבוּרָה
  choice: Weisheit ist besser als Stärke
  rationale: Das prädikative Adjektiv mit vergleichendem מִן bezeichnet Überlegenheit. „Stärke“ bewahrt den allgemeinen Kontrast zwischen Weisheit und menschlicher Kraft; „Macht“ bleibt kontextuell möglich.
- source_word: וְחָכְמַת
  choice: Doch die Weisheit
  rationale: 'Das וְ ist formal verbindend, wirkt im Zusammenhang jedoch adversativ: Trotz der Überlegenheit der Weisheit wird die Weisheit dieses Armen missachtet. „Doch“ macht diesen Gegensatz im Deutschen deutlich.'
- source_word: הַמִּסְכֵּן
  choice: des Armen
  rationale: Das substantivierte maskuline Singularwort bezeichnet einen armen Mann und verweist wahrscheinlich auf den armen Weisen des vorigen Verses. „Des Armen“ ist knapp, natürlich und wahrt die bestimmte Form.
- source_word: בְּזוּיָה
  choice: wird verachtet
  rationale: Die Form bezeichnet einen Zustand beziehungsweise eine passive Behandlung voller Geringschätzung. „Wird verachtet“ ist idiomatisch und bewahrt die starke negative Wertung.
- source_word: וּדְבָרָיו
  choice: und auf seine Worte
  rationale: Der Plural mit Suffix bezeichnet hier seine gesprochenen Worte beziehungsweise seinen Rat. Die Präposition „auf“ ergibt sich aus der natürlichen deutschen Verbindung „auf Worte hören“.
- source_word: אֵינָם נִשְׁמָעִים
  choice: hört man nicht
  rationale: Die negative Existenzkonstruktion mit Nifal-Partizip besagt, dass seine Worte kein Gehör finden. Die deutsche Formulierung kann wie das Hebräische sowohl das Anhören als auch das Beachten einschließen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gegensatz zwischen dem Wert der Weisheit und der gesellschaftlichen Missachtung des armen Weisen bleibt scharf erhalten. Die Schlussformulierung ist idiomatisch, ohne die mögliche Bedeutungsbreite zwischen bloßem Hören und tatsächlichem Beachten aufzulösen.
