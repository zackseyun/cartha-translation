source:
  edition: WLC
  text: דִּבְרֵ֣י חֲכָמִ֔ים בְּ/נַ֖חַת נִשְׁמָעִ֑ים מִ/זַּעֲקַ֥ת מוֹשֵׁ֖ל בַּ/כְּסִילִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/017.yaml
  text: The words of the wise are heard in quiet more than the shouting of a ruler among fools[a][b].
translation:
  language: de
  text: Die Worte der Weisen werden in Ruhe eher gehört als das Geschrei eines Herrschers unter Toren[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die in Ruhe gehörten Worte der Weisen sind besser als das Geschrei eines Herrschers unter Toren.“ Der hebräische Vergleich kann entweder als stärkeres Gehörtwerden oder als angedeutete Überlegenheit ausgedrückt werden.'
    reason: lexical_alternative
  - marker: b
    text: „Unter Toren“ kann auch als „über Toren“ verstanden werden; die hebräische Präposition bezeichnet hier jedoch eher den Ort oder die Gemeinschaft.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי חֲכָמִים
  choice: die Worte der Weisen
  rationale: Der Status constructus von דְּבָרִים bezeichnet hier gesprochene Worte; das substantivierte חֲכָמִים wird mit dem geschlechtsübergreifend verständlichen „die Weisen“ wiedergegeben.
- source_word: בְּנַחַת
  choice: in Ruhe
  rationale: נַחַת bezeichnet Ruhe, Gelassenheit oder Sanftheit. „In Ruhe“ bewahrt die nominale Ausdrucksweise und bildet den Gegensatz zum Geschrei.
- source_word: נִשְׁמָעִים
  choice: werden … gehört
  rationale: Das Nifal-Partizip von שׁמע hat hier natürlichen Passivsinn. Die Wiedergabe vermeidet, die mögliche Folgerung „beachtet“ oder „befolgt“ ausdrücklich in den Text einzutragen.
- source_word: מִזַּעֲקַת
  choice: eher … als das Geschrei
  rationale: Das מִן markiert den Vergleich. „Eher … als“ ist im Deutschen natürlicher als „mehr als“, während „Geschrei“ den lauten זַעֲקָה treffend der Ruhe gegenüberstellt.
- source_word: מוֹשֵׁל
  choice: eines Herrschers
  rationale: Das substantivierte Partizip bezeichnet eine Person, die Herrschaft oder Autorität ausübt; „Herrscher“ bleibt allgemein genug.
- source_word: בַּכְּסִילִים
  choice: unter Toren
  rationale: Die Präposition בְּ wird am natürlichsten lokal beziehungsweise sozial als „unter“ verstanden. „Toren“ entspricht dem weisheitlichen Begriff כְּסִילִים, ohne bloß geringe Intelligenz zu bezeichnen.
theological_decisions:
- issue: Art des Vergleichs zwischen stiller Weisheit und lautem Herrscherwort
  choice: Der Haupttext bewahrt mit „eher gehört als“ die grammatische Aussage über das Gehörtwerden.
  alternative: 'Der Vergleich kann sinngemäß als Werturteil formuliert werden: Die ruhig gehörten Worte seien besser als das Geschrei.'
  rationale: Der hebräische Passivsatz mit komparativem מִן lässt die Wertung erkennen, formuliert sie aber nicht ausdrücklich mit „gut/besser“. Deshalb wird diese Deutung nicht stillschweigend zum Haupttext gemacht.
- issue: Beziehung des Herrschers zu den Toren
  choice: unter Toren
  alternative: über Toren
  rationale: בְּ bezeichnet hier wahrscheinlich Umgebung oder Gemeinschaft. Eine herrschaftliche Beziehung ist möglich, aber weniger naheliegend und bleibt in der Fußnote als Alternative sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „In Ruhe“ und „Geschrei“ halten den rhetorischen Gegensatz deutlich; „Toren“ bewahrt den traditionellen weisheitlichen Sinn, ohne unnötig altertümlich zu wirken. Beide Fußnotenmarker stehen im Haupttext.
