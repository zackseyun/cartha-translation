  source_fidelity: 'Der Haupttext bildet den hebräischen Passivsatz mit dem komparativen מִן angemessen ab: „Die Worte der Weisen werden in Ruhe eher gehört als das Geschrei eines Herrschers unter Toren.“ „In Ruhe“ gibt בְּנַחַת treffend wieder, „werden ... gehört“ bewahrt den passivischen Sinn von נִשְׁמָעִים, und „eher ... als“ vermittelt die Vergleichsrelation natürlich, ohne sie zu einem ausdrücklich formulierten Werturteil zu verschieben. „Unter Toren“ ist für בַּכְּסִילִים eine plausible, quellentreue soziale/lokative Lesart.'
