id: ECC.9.4
reference: Ecclesiastes 9:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּי מִי֙ אֲשֶׁ֣ר יבחר אֶ֥ל כָּל הַ/חַיִּ֖ים יֵ֣שׁ בִּטָּח֑וֹן כִּֽי לְ/כֶ֤לֶב חַי֙ ה֣וּא ט֔וֹב מִן הָ/אַרְיֵ֖ה הַ/מֵּֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/004.yaml
  text: For whoever is joined to all the living has hope[b][a], because a living dog is better than a dead lion.
translation:
  language: de
  text: Denn wer zu den Lebenden gehört, hat Hoffnung[a][b]; denn ein lebender Hund ist besser als ein toter Löwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „Wer unter allen Lebenden erwählt ist, hat Zuversicht.“ Die hebräische Form im ersten Satzteil ist schwierig und wird unterschiedlich verstanden.'
    reason: alternative_reading
  - marker: b
    text: „Hoffnung“ kann auch mit „Zuversicht“ oder „Sicherheit“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: יבחר
  choice: zu den Lebenden gehört
  rationale: Die überlieferte Form ist schwierig. Im Zusammenhang und im Einklang mit der traditionellen Lesart ergibt sich der Sinn, dass jemand der Gemeinschaft der Lebenden verbunden beziehungsweise ihr zugehörig ist. „Gehört“ drückt dies im Deutschen natürlich aus.
- source_word: אֶל כָּל הַחַיִּים
  choice: zu den Lebenden
  rationale: Die Wendung bezeichnet die Zugehörigkeit zur Gesamtheit der Lebenden. Im Deutschen gibt „zu den Lebenden“ diese Beziehung idiomatisch wieder; „allen“ muss dabei nicht eigens ausgedrückt werden, da der substantivierte Plural die ganze Gruppe bezeichnet.
- source_word: בִּטָּחוֹן
  choice: Hoffnung
  rationale: Das Substantiv kann auch Zuversicht oder Sicherheit bezeichnen. Im Gegensatz zum Tod steht hier die noch bestehende Möglichkeit für den Lebenden im Vordergrund; daher passt „Hoffnung“ am besten.
- source_word: לְכֶלֶב חַי
  choice: ein lebender Hund
  rationale: Die unbestimmte Form wahrt den sprichwörtlichen Charakter des Vergleichs.
- source_word: טוֹב מִן
  choice: ist besser als
  rationale: Die einfache deutsche Vergleichsform entspricht der hebräischen Konstruktion und erhält die prägnante Aussage.
- source_word: הָאַרְיֵה הַמֵּת
  choice: ein toter Löwe
  rationale: Obwohl das Hebräische bestimmte Artikel verwendet, klingt der qualitative, sprichwörtliche Vergleich im Deutschen mit unbestimmtem Artikel natürlich.
theological_decisions:
- issue: Bedeutung der schwierigen Form יבחר im Eröffnungssatz
  choice: wer zu den Lebenden gehört
  alternative: wer unter allen Lebenden erwählt ist
  rationale: Kontext und traditionelle Lesart sprechen dafür, die Zugehörigkeit zu den Lebenden auszudrücken. Die abweichende Deutung wird in einer Fußnote offengehalten, ohne aus der Stelle weitergehende Lehraussagen abzuleiten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem und knappem, sprichwörtlichem Ton. Die schwierige hebräische Lesart und die Bedeutungsbreite von בִּטָּחוֹן bleiben durch Fußnoten sichtbar.
