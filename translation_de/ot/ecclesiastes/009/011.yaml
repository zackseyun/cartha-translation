  text: שַׁ֜בְתִּי וְ/רָאֹ֣ה תַֽחַת הַ/שֶּׁ֗מֶשׁ כִּ֣י לֹא֩ לַ/קַּלִּ֨ים הַ/מֵּר֜וֹץ וְ/לֹ֧א לַ/גִּבּוֹרִ֣ים הַ/מִּלְחָמָ֗ה וְ֠/גַם לֹ֣א לַ/חֲכָמִ֥ים לֶ֨חֶם֙ וְ/גַ֨ם לֹ֤א לַ/נְּבֹנִים֙ עֹ֔שֶׁר וְ/גַ֛ם לֹ֥א לַ/יֹּדְעִ֖ים חֵ֑ן כִּי עֵ֥ת וָ/פֶ֖גַע יִקְרֶ֥ה אֶת כֻּלָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/011.yaml
  text: I again saw under the sun that the race is not to the swift[a], nor the battle to the mighty, and also bread is not to the wise, nor riches to the discerning, nor favor to those who know; for time and chance happen to them all.
translation:
  language: de
  text: 'Wieder sah ich unter der Sonne: Nicht den Schnellen fällt der Wettlauf zu und nicht den Starken der Kampf; auch wird den Weisen nicht Brot zuteil, den Verständigen nicht Reichtum und den Wissenden nicht Gunst. Denn Zeit und Zufall[a] treffen sie alle.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Zeit und Geschehen“, „Zeit und Missgeschick“ oder „Zeit und unvorhergesehenes Ereignis“. Der hebräische Ausdruck betont, dass unberechenbare Umstände jeden treffen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבְתִּי וְרָאֹה
  choice: Wieder sah ich
  rationale: Die Wendung leitet eine erneute Beobachtung ein. Die natürliche deutsche Form gibt die Wiederholung wieder, ohne eine körperliche Umkehr anzunehmen.
- source_word: תַחַת הַשֶּׁמֶשׁ
  choice: unter der Sonne
  rationale: Die für Kohelet charakteristische Wendung bezeichnet die irdische menschliche Lebenswelt und wird transparent und traditionsnah wiedergegeben.
- source_word: לַקַּלִּים הַמֵּרוֹץ
  choice: Nicht den Schnellen fällt der Wettlauf zu
  rationale: Die Formulierung bewahrt die Aussage, dass Schnelligkeit den Ausgang nicht garantiert, ohne ausdrücklich das im Hebräischen nicht genannte Verb „gewinnen“ einzusetzen.
- source_word: לַגִּבּוֹרִים הַמִּלְחָמָה
  choice: nicht den Starken der Kampf
  rationale: גִּבּוֹרִים bezeichnet hier kräftige oder kampfstarke Menschen; „den Starken“ erhält den Parallelismus und legt die Bezeichnung nicht ausschließlich auf Berufskrieger fest.
- source_word: לַחֲכָמִים לֶחֶם
  choice: den Weisen nicht Brot
  rationale: „Brot“ bewahrt das konkrete hebräische Bild für Nahrung und Lebensunterhalt.
- source_word: לַנְּבֹנִים עֹשֶׁר
  choice: den Verständigen nicht Reichtum
  rationale: „Verständige“ bezeichnet Menschen mit Einsicht und Urteilsvermögen; „Reichtum“ ist die direkte, im Deutschen natürliche Entsprechung.
- source_word: לַיֹּדְעִים חֵן
  choice: den Wissenden nicht Gunst
  rationale: „Wissende“ lässt den Gegenstand ihres Wissens wie im Hebräischen offen. „Gunst“ bezeichnet günstige Aufnahme oder Wohlwollen, ohne den Ausdruck unnötig zu theologisieren.
- source_word: עֵת וָפֶגַע
  choice: Zeit und Zufall
  rationale: Die knappe Paarformel gibt unberechenbare zeitliche Umstände und eintretende Ereignisse wieder. „Zufall“ ist idiomatisch, wird jedoch durch eine Fußnote gegen die philosophische Bedeutung blinden, schlechthin ursachlosen Zufalls abgegrenzt.
- source_word: יִקְרֶה אֶת כֻּלָּם
  choice: treffen sie alle
  rationale: Das Verb beschreibt, dass solche Umstände allen begegnen beziehungsweise sie ereilen; „treffen“ gibt dies knapp und natürlich wieder.
theological_decisions:
- issue: Ob „Zufall“ eine Verneinung göttlicher Vorsehung ausdrückt
  choice: Die erfahrbare Unberechenbarkeit der Lebensausgänge wird benannt, ohne eine Aussage gegen Gottes Souveränität hinzuzufügen.
  alternative: Der Vers könnte als Behauptung verstanden werden, das Leben werde ausschließlich von blindem Zufall beherrscht.
  rationale: Der hebräische Text beschreibt, dass Zeit und unvorhersehbares Geschehen jeden treffen. Er erklärt nicht, ob oder wie diese Ereignisse mit göttlicher Vorsehung zusammenhängen; diese Spannung bleibt erhalten.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit klarer poetischer Parallelstruktur. Die elliptischen Glieder nach dem ersten Prädikat sind im Deutschen verständlich und bewahren die gedrängte Form des Hebräischen.
