  text: טוֹבָ֥ה חָכְמָ֖ה מִ/כְּלֵ֣י קְרָ֑ב וְ/חוֹטֶ֣א אֶחָ֔ד יְאַבֵּ֥ד טוֹבָ֥ה הַרְבֵּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/018.yaml
  text: Wisdom is better than weapons of war[a], but one sinner destroys much good.
translation:
  language: de
  text: Weisheit ist besser als Kriegswaffen; doch[a] ein einziger Sünder richtet viel Gutes zugrunde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und ein einziger Sünder richtet viel Gutes zugrunde.“ Die hebräische Konjunktion kann einfach „und“ bedeuten; im Zusammenhang liegt jedoch ein Gegensatz nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹבָה חָכְמָה מִן
  choice: Weisheit ist besser als
  rationale: Das prädikative טוֹבָה mit der Vergleichspartikel מִן verlangt im Deutschen eine komparative Wiedergabe.
- source_word: כְּלֵי קְרָב
  choice: Kriegswaffen
  rationale: כְּלֵי bezeichnet Geräte oder Ausrüstung; zusammen mit קְרָב ist militärische Ausrüstung gemeint. „Kriegswaffen“ ist knapp und natürlich.
- source_word: וְחוֹטֶא אֶחָד
  choice: doch ein einziger Sünder
  rationale: וְ kann schlicht verbindend sein, hat im Zusammenhang aber wahrscheinlich eine gegensätzliche Funktion. „Ein einziger“ bewahrt die Betonung von אֶחָד.
- source_word: יְאַבֵּד
  choice: richtet … zugrunde
  rationale: Der Piel von אבד drückt das Verursachen von Untergang oder Verlust aus. Die deutsche Wendung gibt die starke, zerstörerische Wirkung idiomatisch wieder.
- source_word: טוֹבָה הַרְבֵּה
  choice: viel Gutes
  rationale: Die Formulierung bezeichnet eine große Menge an Gutem oder Nutzen und bleibt bewusst weit genug für moralisches wie praktisches Gut.
