  terminology: Die Begriffe »Hüter des Hauses«, »kräftige Männer« und »Mahlende« bewahren den gehobenen poetischen Registerton. Die Fußnote erläutert die wahrscheinliche Altersmetaphorik vorsichtig mit »können« und erhebt die Einzelzuordnungen nicht zur Textaussage.
