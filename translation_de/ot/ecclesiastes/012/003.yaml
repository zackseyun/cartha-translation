  text: בַּ/יּ֗וֹם שֶׁ/יָּזֻ֨עוּ֙ שֹׁמְרֵ֣י הַ/בַּ֔יִת וְ/הִֽתְעַוְּת֖וּ אַנְשֵׁ֣י הֶ/חָ֑יִל וּ/בָטְל֤וּ הַ/טֹּֽחֲנוֹת֙ כִּ֣י מִעֵ֔טוּ וְ/חָשְׁכ֥וּ הָ/רֹא֖וֹת בָּ/אֲרֻבּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/003.yaml
  text: on the day when the keepers of the house tremble[a], and the men of strength are bent, and the grinders cease because they are few, and those looking through the windows grow dark[b],
translation:
  language: de
  text: an dem Tag, an dem die Hüter des Hauses zittern[a] und die kräftigen Männer sich krümmen und die Mahlenden aufhören, weil ihrer nur noch wenige sind, und es denen dunkel wird, die durch die Fenster[b] schauen,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Bilder schildern wahrscheinlich den Verfall im Alter: Die »Hüter des Hauses« können für Arme oder Hände stehen, die »kräftigen Männer« für die Beine, die »Mahlenden« für die Zähne und die durch die Fenster Schauenden für die Augen.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »durch die Gitterfenster«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם
  choice: an dem Tag, an dem
  rationale: Bewahrt den zeitlichen Rahmen und leitet die folgende poetische Schilderung in natürlichem Deutsch ein.
- source_word: יָזֻעוּ
  choice: zittern
  rationale: Gibt die körperliche Erschütterung prägnant wieder und passt zum Bild des altersbedingten Verfalls.
- source_word: שֹׁמְרֵי הַבַּיִת
  choice: die Hüter des Hauses
  rationale: Bewahrt das Hausbild des Hebräischen, ohne es im Haupttext vorschnell als Arme oder Hände auszudeuten.
- source_word: הִתְעַוְּתוּ
  choice: sich krümmen
  rationale: Drückt die körperliche Verformung idiomatisch und anschaulich aus; die reflexive Form entspricht im Deutschen gut dem resultativen Sinn.
- source_word: אַנְשֵׁי הֶחָיִל
  choice: die kräftigen Männer
  rationale: Erhält die ausdrücklich männliche Bezeichnung und den Gedanken körperlicher Kraft in natürlichem modernem Deutsch.
- source_word: בָטְלוּ
  choice: aufhören
  rationale: Gibt das Einstellen der Tätigkeit wieder, ohne das metaphorische Bild unnötig auszudeuten.
- source_word: הַטֹּחֲנוֹת
  choice: die Mahlenden
  rationale: Bewahrt die Tätigkeit des Mahlens und lässt den bildlichen Bezug offen. Das Deutsche kann die feminine Form des hebräischen Plurals hier nicht ohne schwerfällige Umschreibung zugleich sichtbar machen.
- source_word: כִּי מִעֵטוּ
  choice: weil ihrer nur noch wenige sind
  rationale: Macht sowohl den kausalen Zusammenhang als auch die Abnahme ihrer Zahl deutlich.
- source_word: חָשְׁכוּ
  choice: es wird ihnen dunkel
  rationale: Eine natürliche deutsche Wiedergabe des intransitiven Dunkelwerdens, die das Bild nachlassender Sicht wahrt.
- source_word: הָרֹאוֹת
  choice: denen …, die … schauen
  rationale: Erhält den partizipialen Bezug auf die Schauenden, ohne sie im Haupttext ausdrücklich mit den Augen gleichzusetzen.
- source_word: בָּאֲרֻבּוֹת
  choice: durch die Fenster
  rationale: „Fenster“ ist die verständlichste Wiedergabe; „durch“ entspricht der dargestellten Blickrichtung. Auch „Gitteröffnungen“ ist lexikalisch möglich.
theological_decisions:
- issue: Ob das Bild vom Haus und seinen Bewohnern im Haupttext ausdrücklich als Allegorie des Körpers erklärt werden soll
  choice: Die poetischen Hausbilder werden bewahrt und nicht in einzelne Körperteile aufgelöst.
  alternative: „Hüter des Hauses“ als Arme oder Hände, „kräftige Männer“ als Beine, „Mahlende“ als Zähne und „Schauende“ als Augen wiedergeben.
  rationale: Der Zusammenhang weist wahrscheinlich auf die Gebrechlichkeit des Alters, doch der hebräische Text benennt die jeweiligen Körperteile nicht ausdrücklich. Die Übersetzung bewahrt daher die echte Bildhaftigkeit und verlegt die wahrscheinliche Deutung in eine Fußnote.
- issue: Geschlechtsspezifische Wiedergabe von אַנְשֵׁי הֶחָיִל
  choice: die kräftigen Männer
  alternative: die Kräftigen
  rationale: Das hebräische Wort bezeichnet ausdrücklich Männer. Die gewählte Form wahrt diese Angabe und klingt zugleich natürlicher als „Männer der Kraft“.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter poetischer Bildsprache. Die Satzform bleibt wegen des Zusammenhangs mit den benachbarten Versen offen und endet mit einem Komma. Ungewöhnliche Bilder werden nicht geglättet oder im Haupttext allegorisch entschlüsselt.
