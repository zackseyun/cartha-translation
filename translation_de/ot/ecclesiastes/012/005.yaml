base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/005.yaml
  text: Also they are afraid of heights[a], and terrors are on the road; the almond tree blossoms, the grasshopper drags itself along, and the caper berry fails, because man is going to his eternal house[c][b], and the mourners go about in the street.
translation:
  language: de
  text: Auch vor Höhen fürchtet man sich, und auf dem Weg sind Schrecken. Der Mandelbaum blüht, die Heuschrecke schleppt sich dahin[a], und die Kaperbeere versagt[b]. Denn der Mensch geht zu seinem ewigen Haus, und die Totenkläger ziehen auf der Straße umher[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Heuschrecke wird zur Last.“ Der hebräische Ausdruck ist schwierig; das Bild kann entweder mühsame Bewegung oder das Zur-Last-Werden selbst des Geringsten im Alter bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Das Verlangen schwindet.“ Im Hebräischen steht wörtlich „die Kaperbeere“, wahrscheinlich als Bild für Appetit oder Anregung.'
    reason: lexical_alternative
  - marker: c
    text: Mit den „Totenklägern“ können auch berufsmäßige Klageleute gemeint sein, die öffentlich um Verstorbene trauerten.
    reason: cultural_note
lexical_decisions:
- source_word: מִגָּבֹהַּ יִרָאוּ
  choice: vor Höhen fürchtet man sich
  rationale: Die Verbindung bezeichnet Furcht angesichts von Höhe. Die unpersönliche Form mit „man“ gibt den allgemein-menschlichen Bezug im Zusammenhang des Alterns natürlich wieder.
- source_word: חַתְחַתִּים בַּדֶּרֶךְ
  choice: Schrecknisse lauern auf dem Weg
  rationale: חַתְחַתִּים bezeichnet Schrecken oder angsteinflößende Gefahren. „Lauern“ macht die knappe nominale Aussage im Deutschen anschaulich, ohne die Art der Gefahren festzulegen.
- source_word: יָנֵאץ הַשָּׁקֵד
  choice: der Mandelbaum blüht
  rationale: Das schwierige Verb wird im Kontext der Altersbilder traditionell und plausibel auf das Blühen des Mandelbaums bezogen; möglicherweise erinnert die helle Blüte an weißes Haar.
- source_word: יִסְתַּבֵּל הֶחָגָב
  choice: die Heuschrecke schleppt sich dahin
  rationale: Die schwierige Form kann eine mühsame Bewegung oder ein Zur-Last-Werden ausdrücken. Im Haupttext wird das Bild geschwächter Bewegung bewahrt; die Alternative steht in der Fußnote.
- source_word: תָפֵר הָאֲבִיּוֹנָה
  choice: die Kaperbeere versagt
  rationale: אֲבִיּוֹנָה wird konkret als Kaperbeere verstanden, die mit Appetit oder anregender Wirkung verbunden sein kann. „Versagt“ bewahrt das Bild und lässt seine genaue Bedeutung offen.
- source_word: הָאָדָם
  choice: der Mensch
  rationale: Hier ist der einzelne Mensch als Vertreter der menschlichen Sterblichkeit gemeint. „Der Mensch“ ist im modernen Deutschen generisch, würdig und näher am hebräischen Singular als eine kollektive Umschreibung.
- source_word: בֵּית עוֹלָמוֹ
  choice: sein ewiges Haus
  rationale: Die wörtlich-metaphorische Wendung „Haus seiner Ewigkeit“ bezeichnet das bleibende Haus des Toten. „Sein ewiges Haus“ erhält Bild und feierlichen Ton, ohne die Jenseitsvorstellung näher zu bestimmen.
- source_word: הַסֹּפְדִים
  choice: die Totenkläger
  rationale: Das Partizip bezeichnet Menschen, die öffentlich die Toten beklagen; dazu können auch berufsmäßige Klageleute gehören.
- source_word: סָבְבוּ בַשּׁוּק
  choice: ziehen auf der Straße umher
  rationale: סבב beschreibt das Umhergehen, שׁוּק hier den öffentlichen Straßen- oder Marktbereich. Die Formulierung gibt die öffentliche Totenklage natürlich wieder.
theological_decisions:
- issue: Generische Bezeichnung הָאָדָם
  choice: der Mensch
  alternative: der Mann; die Menschen
  rationale: Der Vers spricht von einem einzelnen, repräsentativen Menschen auf dem Weg zum Tod. „Der Mensch“ wahrt Singular und generische Reichweite, ohne das Wort unnötig auf das männliche Geschlecht zu beschränken.
- issue: Bedeutung von בֵּית עוֹלָמוֹ
  choice: sein ewiges Haus
  alternative: sein dauerhaftes Haus; sein Grab
  rationale: Die hebräische Metapher wird beibehalten. Eine direkte Wiedergabe als „Grab“ würde eine plausible Deutung ausdrücklich machen und die poetische sowie mögliche eschatologische Spannung verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Bildlichkeit. Die schwierigen Altersbilder bleiben konkret und werden nicht allegorisch ausgedeutet. Kurze Hauptsätze erhalten den rhythmischen, aufzählenden Charakter des Hebräischen.
