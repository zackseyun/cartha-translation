  text: עַ֠ד אֲשֶׁ֨ר לֹֽא תֶחְשַׁ֤ךְ הַ/שֶּׁ֨מֶשׁ֙ וְ/הָ/א֔וֹר וְ/הַ/יָּרֵ֖חַ וְ/הַ/כּוֹכָבִ֑ים וְ/שָׁ֥בוּ הֶ/עָבִ֖ים אַחַ֥ר הַ/גָּֽשֶׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/002.yaml
  text: before the sun and the light and the moon and the stars grow dark[a], and the clouds return after the rain.
translation:
  language: de
  text: bevor die Sonne und das Licht und der Mond und die Sterne dunkel werden[a] und die Wolken nach dem Regen wiederkehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sich verfinstern“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד אֲשֶׁר לֹא
  choice: bevor
  rationale: Die Konstruktion bezeichnet hier den Zeitpunkt, vor dessen Eintreten die vorausgehende Aufforderung gelten soll. „Bevor“ gibt diesen Sinn im modernen Deutschen natürlich wieder.
- source_word: תֶחְשַׁךְ
  choice: dunkel werden
  rationale: Das Qal von חשׁך beschreibt hier das Dunkelwerden beziehungsweise den Verlust von Helligkeit. Die intransitive Formulierung bewahrt die Offenheit des hebräischen Ausdrucks.
- source_word: הַשֶּׁמֶשׁ
  choice: die Sonne
  rationale: Direkte und kontextgemäße Entsprechung.
- source_word: וְהָאוֹר
  choice: und das Licht
  rationale: אוֹר bedeutet allgemein „Licht“. Diese Wiedergabe wahrt die schlichte poetische Reihung und legt den Ausdruck nicht enger als „Tageslicht“ aus.
- source_word: וְהַיָּרֵחַ
  choice: und der Mond
  rationale: Direkte und kontextgemäße Entsprechung.
- source_word: וְהַכּוֹכָבִים
  choice: und die Sterne
  rationale: Direkte und kontextgemäße Entsprechung.
- source_word: וְשָׁבוּ
  choice: und … wiederkehren
  rationale: שׁוב bedeutet „zurückkehren, wiederkehren“. „Wiederkehren“ bringt das erneute Aufziehen der Wolken knapp und poetisch zum Ausdruck.
- source_word: הֶעָבִים
  choice: die Wolken
  rationale: Direkte und kontextgemäße Entsprechung.
- source_word: אַחַר הַגָּשֶׁם
  choice: nach dem Regen
  rationale: Die Formulierung bildet die hebräische Präpositionalphrase natürlich und genau ab.
theological_decisions:
- issue: Deutung der Bilder vom Dunkelwerden der Himmelslichter und von wiederkehrenden Wolken
  choice: Die poetischen Bilder bleiben im Haupttext ohne ausdrückliche Deutung stehen.
  alternative: Die Bilder ausdrücklich auf Alter, nachlassende Fähigkeiten, wiederkehrende Leiden oder Gericht beziehen.
  rationale: Der Vers nennt die Bilder, erklärt ihre Bedeutung jedoch nicht ausdrücklich. Eine unaufgelöste Wiedergabe bewahrt die genuine metaphorische und theologische Offenheit des Textes.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem poetischem Klang. Die Satzform bleibt als Fortsetzung der Aufforderung aus dem vorhergehenden Vers bewusst mit „bevor“ eröffnet.
