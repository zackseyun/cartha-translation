base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/011.yaml
  text: The words of the wise are like goads[a], and like firmly planted nails are the collected sayings[b]; they are given by one shepherd.
translation:
  language: de
  text: Die Worte der Weisen sind wie Treiberstacheln, und wie fest eingeschlagene Nägel sind die Verantwortlichen für die Sammlungen[a]; sie sind von einem Hirten[b] gegeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Wendung ist schwierig und lautet wörtlich etwa „die Herren der Sammlungen“. Sie kann Verantwortliche oder Verfasser von Spruchsammlungen bezeichnen, möglicherweise aber auch Leiter versammelter Gruppen.
    reason: alternative_reading
  - marker: b
    text: Der „eine Hirte“ kann Gott als letzte Quelle der Weisheit bezeichnen; der Text benennt den Hirten jedoch nicht ausdrücklich.
    reason: theological_ambiguity
lexical_decisions:
- source_word: דִּבְרֵי חֲכָמִים
  choice: Die Worte der Weisen
  rationale: Die formale und zugleich natürliche Wiedergabe bewahrt sowohl den weiten Bedeutungsumfang von דְּבָרִים als auch die geschlechtsneutrale Klassenbezeichnung „die Weisen“.
- source_word: כַּדָּרְבֹנוֹת
  choice: wie Treiberstacheln
  rationale: דָּרְבֹן bezeichnet einen spitzen Stab zum Antreiben von Tieren. „Treiberstacheln“ vermittelt das Bild im Deutschen verständlicher als das seltene „Ochsenstacheln“, ohne die Tierart unnötig festzulegen.
- source_word: וּכְמַשְׂמְרוֹת נְטוּעִים
  choice: und wie fest eingeschlagene Nägel
  rationale: מַשְׂמְרוֹת kann Nägel oder Pflöcke bezeichnen. Das wörtlich „gepflanzt“ bedeutende נְטוּעִים beschreibt im Bild von Nägeln ein festes Einsetzen; „fest eingeschlagen“ gibt die Bildwirkung in natürlichem Deutsch wieder.
- source_word: בַּעֲלֵי אֲסֻפּוֹת
  choice: die gesammelten Sprüche
  rationale: Die schwierige Wendung bedeutet wörtlicher etwa „Herren/Meister von Sammlungen“ und kann auch auf Leiter von Versammlungen bezogen werden. Im literarischen Zusammenhang bezeichnet „die gesammelten Sprüche“ wahrscheinlich den beabsichtigten Referenten; die echte Unsicherheit wird in der Fußnote offengelegt.
- source_word: נִתְּנוּ
  choice: sie sind … gegeben
  rationale: Das passive Perfekt kann hier als allgemeingültige Aussage wiedergegeben werden. Die Formulierung bewahrt das Passiv des Hebräischen.
- source_word: מֵרֹעֶה אֶחָד
  choice: von einem Hirten
  rationale: „Von“ bewahrt die durch מִן ausgedrückte Herkunft. „Ein Hirte“ bleibt kleingeschrieben und unbestimmt, weil der hebräische Text dessen Identität nicht ausdrücklich nennt.
theological_decisions:
- issue: Identität des „einen Hirten“
  choice: Im Haupttext bleibt die Identität mit „einem Hirten“ offen.
  alternative: Der Hirte kann als Gott, als Kohelet beziehungsweise ein einzelner Weisheitslehrer oder allgemein als einheitliche Quelle der Weisheitsworte verstanden werden.
  rationale: Obwohl eine Deutung auf Gott theologisch naheliegt, identifiziert der Vers den Hirten nicht ausdrücklich. Die Übersetzung vermeidet daher eine Großschreibung oder erläuternde Einfügung, die diese Spannung auflösen würde.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Treiberstacheln“ macht das antike Bild für heutige Leser verständlich; „fest eingeschlagene Nägel“ ist idiomatisch und bewahrt die Kraft des Parallelbildes. Die umstrittene Wendung בַּעֲלֵי אֲסֻפּוֹת und die Identität des Hirten werden nicht stillschweigend vereindeutigt, sondern durch Fußnoten transparent gehalten.
