source:
  edition: WLC
  text: וְ/יֹתֵ֥ר מֵ/הֵ֖מָּה בְּנִ֣/י הִזָּהֵ֑ר עֲשׂ֨וֹת סְפָרִ֤ים הַרְבֵּה֙ אֵ֣ין קֵ֔ץ וְ/לַ֥הַג הַרְבֵּ֖ה יְגִעַ֥ת בָּשָֽׂר׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/012.yaml
  text: 'And beyond these[a], my son, be warned: of making many books there is no end, and much study is a weariness of the flesh.'
translation:
  language: de
  text: 'Und vor dem, was darüber hinausgeht, hüte dich, mein Sohn: Beim Verfassen vieler Bücher gibt es kein Ende, und viel Studieren[a] ermüdet den Leib.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „viel Lesen“ oder „viel Hingabe“. Das hier verwendete hebräische Wort ist selten und kann allgemein die intensive Beschäftigung mit Büchern oder Worten bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֹתֵר מֵהֵמָּה
  choice: 'Und was über sie hinausgeht: Davor'
  rationale: Die Wendung knüpft an die vorausgehenden Worte an und warnt vor dem, was über sie hinausgeht. Die vorangestellte Formulierung bildet den hebräischen Bezug im natürlichen Deutschen deutlich ab, ohne ihn auf bloße Quantität zu verengen.
- source_word: בְּנִי
  choice: mein Sohn
  rationale: Die wörtliche männliche Anrede wird als herkömmliche väterliche Anrede beibehalten.
- source_word: הִזָּהֵר
  choice: lass dich warnen
  rationale: Der Nifal-Imperativ hat passiv-reflexiven Sinn. Die Formulierung ist im Deutschen verständlich und erhält den warnenden Ton.
- source_word: עֲשׂוֹת סְפָרִים הַרְבֵּה
  choice: Viele Bücher zu verfassen
  rationale: „Verfassen“ gibt das Machen beziehungsweise Hervorbringen von Büchern in diesem Zusammenhang natürlicher wieder als das wörtlichere „machen“.
- source_word: אֵין קֵץ
  choice: nimmt kein Ende
  rationale: Die idiomatische deutsche Wendung entspricht der hebräischen Aussage, dass es kein Ende beziehungsweise keine Grenze gibt.
- source_word: וְלַהַג הַרְבֵּה
  choice: und vieles Studieren
  rationale: Das seltene לַהַג bezeichnet hier wahrscheinlich intensive Beschäftigung mit Büchern oder Worten. „Studieren“ passt zum unmittelbaren Buchkontext; die lexikalische Unsicherheit wird in einer Fußnote erhalten.
- source_word: יְגִעַת בָּשָׂר
  choice: ermüdet den Leib
  rationale: Die verbale deutsche Form gibt die körperliche Ermüdung klar wieder. „Leib“ bewahrt die konkrete Körperbedeutung von בָּשָׂר, ohne eine besondere theologische Bedeutung einzutragen.
theological_decisions:
- issue: Reichweite der Warnung
  choice: Die Warnung wird auf das bezogen, was über die vorausgehenden Worte hinausgeht.
  alternative: Die Wendung könnte allgemeiner als „Und außerdem, mein Sohn, lass dich warnen“ verstanden werden.
  rationale: Die Präposition מִן in מֵהֵמָּה legt einen Vergleich beziehungsweise ein Hinausgehen über „diese“ nahe. Die Übersetzung erhält diesen Rückbezug, ohne festzulegen, ob damit alle weiteren Schriften pauschal abgewertet werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede „mein Sohn“ und das konkrete Bild „Leib“ bleiben erhalten; Satzbau und Verbwahl sind für heutige Leser natürlich gestaltet.
