id: ECC.12.9
reference: Ecclesiastes 12:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/יֹתֵ֕ר שֶׁ/הָיָ֥ה קֹהֶ֖לֶת חָכָ֑ם ע֗וֹד לִמַּד דַּ֨עַת֙ אֶת הָ/עָ֔ם וְ/אִזֵּ֣ן וְ/חִקֵּ֔ר תִּקֵּ֖ן מְשָׁלִ֥ים הַרְבֵּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/009.yaml
  text: And beyond that[a], because Qoheleth was wise, he still taught the people knowledge; he also weighed, searched out, and arranged many proverbs.
translation:
  language: de
  text: 'Und darüber hinaus[a]: Weil Kohelet weise war, lehrte er das Volk weiterhin Erkenntnis; er erwog, erforschte und ordnete viele Sprüche.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und außerdem war Kohelet weise; er lehrte das Volk auch Erkenntnis, erwog, erforschte und ordnete viele Sprüche.“'
    reason: 'Die Verbindung von וְיֹתֵר, שֶׁ und עוֹד lässt sowohl eine begründende Lesart („darüber hinaus: weil … weiterhin“) als auch eine stärker nebenordnende, ergänzende Lesart („außerdem … auch“) zu.'
lexical_decisions:
- source_word: וְיֹתֵר
  choice: Und darüber hinaus
  rationale: Die Wendung führt einen zusätzlichen abschließenden Gedanken ein. „Darüber hinaus“ bewahrt sowohl die verbindende als auch die ergänzende Funktion und klingt im heutigen Deutsch natürlich.
- source_word: שֶׁהָיָה
  choice: Weil … war
  rationale: 'שֶׁ kann verschiedene Beziehungen markieren. Hier ist eine begründende Lesart gut möglich: Kohelets Weisheit bildet den Grund für seine Lehr- und Ordnungsarbeit. Die alternative syntaktische Auffassung wird in der Fußnote offengehalten.'
- source_word: קֹהֶלֶת
  choice: Kohelet
  rationale: „Kohelet“ ist im Deutschen die geläufige Umschrift dieser namenähnlichen Amts- oder Personenbezeichnung und vermeidet die interpretative Einengung auf „Prediger“ oder „Lehrer“.
- source_word: חָכָם
  choice: weise
  rationale: Die prädikative Wiedergabe entspricht knapp und unmittelbar dem Hebräischen.
- source_word: עוֹד
  choice: weiterhin
  rationale: „Weiterhin“ gibt den Gedanken der Fortsetzung wieder; je nach syntaktischer Auffassung kann das Wort auch additiv „auch“ bedeuten.
- source_word: לִמַּד דַּעַת אֶת הָעָם
  choice: lehrte er das Volk … Erkenntnis
  rationale: Die relativ formnahe Fügung bewahrt דַּעַת als „Erkenntnis“ und unterscheidet es damit von der ausdrücklich genannten Weisheit Kohelets.
- source_word: וְאִזֵּן
  choice: erwog
  rationale: Das seltene Verb bezeichnet wahrscheinlich ein prüfendes Abwägen. „Erwog“ erhält diesen Sinn, ohne im Deutschen ein unnatürlich konkretes Wiegen von Sprüchen auszudrücken.
- source_word: וְחִקֵּר
  choice: erforschte
  rationale: Das Wort bezeichnet sorgfältiges Nachforschen oder Untersuchen; „erforschte“ gibt diese aktive Prüfung prägnant wieder.
- source_word: תִּקֵּן
  choice: ordnete
  rationale: Das Verb kann „gerade machen“, „in Ordnung bringen“ oder „anordnen“ bedeuten. Bei Sprüchen bezeichnet „ordnete“ plausibel die literarische Gestaltung, ohne zwingend alleinige Autorschaft zu behaupten.
- source_word: מְשָׁלִים הַרְבֵּה
  choice: viele Sprüche
  rationale: Dies ist eine direkte, natürliche Wiedergabe der Mengenangabe und des literarischen Begriffs מָשָׁל.
theological_decisions: []
