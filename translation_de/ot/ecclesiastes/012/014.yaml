source:
  edition: WLC
  text: כִּ֤י אֶת כָּל מַֽעֲשֶׂ֔ה הָ/אֱלֹהִ֛ים יָבִ֥א בְ/מִשְׁפָּ֖ט עַ֣ל כָּל נֶעְלָ֑ם אִם ט֖וֹב וְ/אִם רָֽע־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/014.yaml
  text: For God will bring every deed into judgment[a], with every hidden thing, whether good or evil.
translation:
  language: de
  text: Denn Gott wird jede Tat vor Gericht bringen, samt allem Verborgenen[a], sei es gut oder böse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hinsichtlich alles Verborgenen“; auch möglich: „einschließlich alles Verborgenen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende abschließende Mahnung; „Denn“ gibt diese erklärende Funktion im Deutschen natürlich wieder.
- source_word: אֶת כָּל מַעֲשֶׂה
  choice: jede Tat
  rationale: Die Verbindung aus כָּל und dem singularischen מַעֲשֶׂה wird distributiv verstanden. „Tat“ passt zum Zusammenhang moralischer Beurteilung und ist präziser als das weiter gefasste „Werk“ oder „Tun“.
- source_word: הָאֱלֹהִים
  choice: Gott
  rationale: Der bestimmte Ausdruck wird nach deutschem Sprachgebrauch ohne Artikel als „Gott“ wiedergegeben.
- source_word: יָבִא בְמִשְׁפָּט
  choice: wird … vor Gericht bringen
  rationale: Der Hifil von בוא bezeichnet hier das Bringen in den Bereich richterlicher Beurteilung. „Vor Gericht bringen“ ist gegenwärtiges, verständliches Deutsch und bewahrt das Bild eines Gerichtsverfahrens.
- source_word: עַל כָּל נֶעְלָם
  choice: samt allem Verborgenen
  rationale: נֶעְלָם bezeichnet alles, was verborgen oder geheim ist. עַל kann hier die Hinsicht („hinsichtlich“) oder eine einschließende Zuordnung ausdrücken; „samt“ gibt die umfassende Einbeziehung natürlich wieder, ohne das Verborgene auf innere Gedanken zu verengen.
- source_word: אִם טוֹב וְאִם רָע
  choice: sei es gut oder böse
  rationale: Die hebräische Paarformel umfasst die ganze moralische Spannweite. Die deutsche Wendung ist knapp und idiomatisch.
theological_decisions:
- issue: Reichweite und Zeitpunkt des göttlichen Gerichts
  choice: Der Vers sagt aus, dass Gott jede Tat einschließlich des Verborgenen beurteilen wird, ohne Zeitpunkt oder Vollzugsweise näher festzulegen.
  alternative: Ausschließlich das endzeitliche Gericht; oder sowohl Gottes Gericht innerhalb der Geschichte als auch das endzeitliche Gericht.
  rationale: Der hebräische Text bekräftigt die umfassende göttliche Rechenschaft, legt aber nicht ausdrücklich fest, ob ausschließlich ein endzeitliches Gericht gemeint ist. Die Übersetzung wahrt diese Offenheit.
- issue: Bezug von „gut oder böse“
  choice: Die Wendung bleibt grammatisch offen genug, um die moralische Beschaffenheit des Verborgenen beziehungsweise des gesamten zur Beurteilung Gebrachten zu bezeichnen.
  alternative: Ausdrückliche Beschränkung allein auf die Tat oder allein auf das Verborgene.
  rationale: Das Hebräische formuliert knapp und löst den syntaktischen Bezug nicht weiter auf; eine präzisierende Ergänzung würde die Aussage unnötig verengen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. „Vor Gericht bringen“ erhält das forensische Bild, während „samt allem Verborgenen“ die syntaktische Beziehung von עַל כָּל נֶעְלָם lesbar wiedergibt und ihre echte Mehrdeutigkeit in der Fußnote dokumentiert.
