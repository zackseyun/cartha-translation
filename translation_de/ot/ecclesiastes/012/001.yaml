source:
  edition: WLC
  text: וּ/זְכֹר֙ אֶת בּ֣וֹרְאֶ֔י/ךָ בִּ/ימֵ֖י בְּחוּרֹתֶ֑י/ךָ עַ֣ד אֲשֶׁ֤ר לֹא יָבֹ֨אוּ֙ יְמֵ֣י הָֽ/רָעָ֔ה וְ/הִגִּ֣יעוּ שָׁנִ֔ים אֲשֶׁ֣ר תֹּאמַ֔ר אֵֽין לִ֥/י בָ/הֶ֖ם חֵֽפֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/001.yaml
  text: And remember your Creator in the days of your youth[a], before the evil days come and the years arrive of which you will say, “I have no pleasure in them.”
translation:
  language: de
  text: 'Und denk an deinen Schöpfer[a] in den Tagen deiner Jugend, bevor die schweren Tage kommen und die Jahre herannahen, von denen du sagen wirst: »Ich habe keine Freude an ihnen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht hier eine Pluralform, wörtlich »deine Schöpfer«; gemeint ist Gott als der eine Schöpfer.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּזְכֹר
  choice: Und denk
  rationale: Der Qal-Imperativ richtet eine unmittelbare Aufforderung an eine einzelne Person. »Und« wahrt den Zusammenhang mit dem vorangehenden Gedankengang; »denk an« ist die natürliche deutsche Entsprechung von זכר mit אֶת.
- source_word: אֶת בּוֹרְאֶיךָ
  choice: an deinen Schöpfer
  rationale: Die Form בּוֹרְאֶיךָ ist morphologisch pluralisch, bezeichnet hier im monotheistischen Zusammenhang jedoch Gott als den einen Schöpfer. Der Singular verhindert im Haupttext ein sachlich irreführendes polytheistisches Verständnis; die auffällige Form wird in einer Fußnote dokumentiert.
- source_word: בִּימֵי בְּחוּרֹתֶיךָ
  choice: in den Tagen deiner Jugend
  rationale: Die Formulierung bleibt nahe am zeitlichen Bild des Hebräischen und ist zugleich in modernem Deutsch gut verständlich.
- source_word: עַד אֲשֶׁר לֹא יָבֹאוּ
  choice: bevor ... kommen
  rationale: Die Verbindung bezeichnet hier die zeitliche Grenze vor dem Eintreten des Unerwünschten. »Bevor« gibt dies natürlicher wieder als ein wörtliches »bis ... nicht«.
- source_word: יְמֵי הָרָעָה
  choice: die schweren Tage
  rationale: רָעָה bezeichnet im Kontext die belastenden, leidvollen Tage des Alters. »Schwere Tage« vermittelt diese Bedeutung im Deutschen klarer als »böse Tage«, das leicht moralisches Bösesein nahelegen würde.
- source_word: וְהִגִּיעוּ שָׁנִים
  choice: und die Jahre herannahen
  rationale: Das Hifil von נגע beschreibt das Erreichen beziehungsweise Eintreffen. »Herannahen« bewahrt das Bild der auf den Menschen zukommenden Jahre und klingt im Satz natürlich.
- source_word: אֲשֶׁר תֹּאמַר
  choice: von denen du sagen wirst
  rationale: Der Relativsatz bezieht sich auf die Jahre; diese Wiedergabe bildet Bezug und Zukunftsaspekt eindeutig ab.
- source_word: אֵין לִי בָהֶם חֵפֶץ
  choice: Sie gefallen mir nicht
  rationale: חֵפֶץ bezeichnet Gefallen, Freude oder Wohlgefallen. Die direkte deutsche Äußerung gibt die persönliche negative Bewertung idiomatisch wieder, ohne eine stärkere Behauptung völliger Freudlosigkeit einzutragen.
theological_decisions:
- issue: Numerus von בּוֹרְאֶיךָ
  choice: 'Singular: »deinen Schöpfer«'
  alternative: 'Formnaher Plural: »deine Schöpfer«'
  rationale: Obwohl die hebräische Form pluralisch ist, verweist sie im israelitisch-monotheistischen Weisheitskontext auf den einen Gott. Der Singular gibt den gemeinten Referenten wieder; die ungewöhnliche morphologische Form bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede. Die Bildsprache »Tage deiner Jugend« bleibt erhalten; »schwere Tage« macht den kontextuellen Sinn von רָעָה verständlich, ohne moralisches Übel zu unterstellen.
