base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/004.yaml
  text: and the doors on the street are shut when the sound of the grinding is low[a], and one rises at the sound of a bird[c][b], and all the daughters of song are brought low.
translation:
  language: de
  text: und die Türen zur Straße hin geschlossen sind, wenn das Geräusch des Mahlens leise wird,[a] und man beim Laut eines Vogels aufsteht,[b] und alle Töchter des Gesangs sich senken.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „wenn die Stimme des Mahlens niedrig wird“. Das Bild kann auf nachlassendes Kauen im Alter anspielen; die genaue Zuordnung bleibt jedoch unsicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „beim Laut des Vogels“. Gemeint sein kann, dass man schon bei einem leisen Geräusch erwacht.'
    reason: alternative_reading
  - marker: c
    text: 'Wörtlich: „alle Töchter des Gesangs“. Gemeint sein können Sängerinnen, die Fähigkeit zu singen oder Klänge, die zum Gesang gehören.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסֻגְּרוּ דְלָתַיִם בַּשּׁוּק
  choice: und die Türen zur Straße geschlossen werden
  rationale: Das passive Verb wird als Vorgang wiedergegeben. דְלָתַיִם bezeichnet wörtlich Türen beziehungsweise eine Doppeltür; בַּשּׁוּק weist auf den öffentlichen Straßenraum. „Zur Straße“ ist im Deutschen räumlich natürlich und legt die mögliche Körpermetapher nicht fest.
- source_word: בִּשְׁפַל קוֹל הַטַּחֲנָה
  choice: wenn das Geräusch des Mahlens leise wird
  rationale: שְׁפַל bezeichnet ein Niedrig- oder Schwachwerden, während טַחֲנָה den Mahlvorgang beziehungsweise dessen Geräusch meint. Die Formulierung bewahrt das Bild und ist zugleich verständlich.
- source_word: וְיָקוּם לְקוֹל הַצִּפּוֹר
  choice: und man beim Laut eines Vogels aufsteht
  rationale: Das maskuline Singularverb hat hier einen allgemein-menschlichen Bezug; „man“ gibt diesen im Deutschen natürlich wieder. „Beim Laut eines Vogels“ bewahrt das singuläre Bild, ohne durch „Vogelgesang“ stärker auszudeuten.
- source_word: וְיִשַּׁחוּ
  choice: und … sich senken
  rationale: Das Verb bezeichnet ein Sichbeugen, Niedersinken oder Erniedrigtwerden. „Sich senken“ erhält die poetische Offenheit zwischen buchstäblicher Bewegung und nachlassender Kraft.
- source_word: כָּל בְּנוֹת הַשִּׁיר
  choice: alle Töchter des Gesangs
  rationale: Die wörtliche poetische Wendung bleibt erhalten, da unklar ist, ob Sängerinnen, Singvermögen, Stimme oder mit Gesang verbundene Klänge gemeint sind.
theological_decisions:
- issue: Deutung der Altersbilder in Prediger 12
  choice: Die Bilder von Türen, Mahlen und Töchtern des Gesangs bleiben im Haupttext unaufgelöst.
  alternative: Die Türen ausdrücklich als Lippen, das Mahlen als Kauen beziehungsweise Zähne und die Töchter des Gesangs als Stimme oder Hörvermögen wiedergeben.
  rationale: Der Abschnitt wird weithin als Darstellung des Alters verstanden, doch die Zuordnung einzelner Bilder ist umstritten. Eine konkrete anatomische Auslegung im Haupttext würde die Mehrdeutigkeit des Hebräischen unnötig verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter poetischer Bildsprache. Der Satzbau folgt dem parallelen Aufbau des Hebräischen, ohne im Deutschen unnötig altertümlich zu wirken.
