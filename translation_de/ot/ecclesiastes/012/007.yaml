  text: וְ/יָשֹׁ֧ב הֶ/עָפָ֛ר עַל הָ/אָ֖רֶץ כְּ/שֶׁ/הָיָ֑ה וְ/הָ/ר֣וּחַ תָּשׁ֔וּב אֶל הָ/אֱלֹהִ֖ים אֲשֶׁ֥ר נְתָנָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/007.yaml
  text: and the dust returns to the earth as it was[a], and the spirit returns to God who gave it.
translation:
  language: de
  text: und der Staub zur Erde zurückkehrt, wie er war, und der Geist[a] zu Gott zurückkehrt, der ihn gegeben hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Atem“. Das hebräische Wort רוּחַ kann „Geist“, „Atem“ oder „Wind“ bedeuten. Im Zusammenhang mit dem Tod liegt hier „Geist“ nahe; „Atem“ bleibt jedoch eine mögliche Übersetzung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשֹׁב
  choice: und … zurückkehrt
  rationale: Das Qal-Imperfekt von שוב beschreibt hier in poetisch-allgemeingültiger Weise den unausweichlichen Vorgang; der deutsche Präsenssatz fügt sich in die fortlaufende Satzstruktur des Abschnitts ein.
- source_word: הֶעָפָר
  choice: der Staub
  rationale: Der bestimmte Ausdruck bezeichnet den stofflichen Anteil des Menschen und bewahrt den Anklang an die Schöpfungs- und Sterblichkeitssprache.
- source_word: עַל הָאָרֶץ
  choice: zur Erde
  rationale: Bei שוב bezeichnet עַל hier das Ziel der Rückkehr. „Zur Erde“ ist natürliches Deutsch, wahrt אֶרֶץ als „Erde“ und erhält das Bild der körperlichen Rückkehr.
- source_word: כְּשֶׁהָיָה
  choice: wie er war
  rationale: Die Vergleichsklausel bezeichnet die Rückkehr in den früheren Zustand; das maskuline Pronomen bezieht sich im Deutschen natürlich auf „Staub“.
- source_word: וְהָרוּחַ
  choice: und der Geist[a]
  rationale: רוּחַ kann Geist, Atem oder Wind bedeuten. Im Parallelismus zur Rückkehr des Staubes und vor „zu Gott … der ihn gegeben hat“ ist „Geist“ kontextuell naheliegend; „Atem“ bleibt als echte lexikalische Alternative in der Fußnote erhalten.
- source_word: תָּשׁוּב
  choice: zurückkehrt
  rationale: Die Wiederholung desselben Verbs שוב wird ebenso übersetzt und bewahrt so den Parallelismus zwischen Staub und Geist.
- source_word: אֶל הָאֱלֹהִים
  choice: zu Gott
  rationale: אֶל bezeichnet die Richtung; im Deutschen steht „Gott“ in dieser Verwendung ohne Artikel.
- source_word: אֲשֶׁר נְתָנָהּ
  choice: der ihn gegeben hat
  rationale: Der Relativsatz bezeichnet Gott als Geber. Das Pronomen „ihn“ stimmt mit dem grammatischen Geschlecht von „Geist“ überein; das Perfekt ist im Deutschen idiomatisch und macht die vorausliegende Gabe deutlich.
theological_decisions:
- issue: Bedeutung von רוּחַ beim Tod des Menschen
  choice: Geist
  alternative: Atem
  rationale: „Geist“ erhält den Gegensatz zwischen dem Staub, der zur Erde zurückkehrt, und dem von Gott gegebenen Lebensprinzip, ohne dessen Wesen näher zu bestimmen. Da רוּחַ ebenso „Atem“ bedeuten kann, wird diese Deutung nicht ausgeschlossen, sondern ausdrücklich in der Fußnote genannt.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die wiederholte Formulierung „zurückkehrt“ wahrt den hebräischen Parallelismus. Die Satzstellung lässt den Vers als Fortsetzung des vorausgehenden poetischen Satzgefüges erkennen.
