base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/010.yaml
  text: Qoheleth sought to find delightful words[b][a], and to write uprightly words of truth.
translation:
  language: de
  text: Kohelet suchte, ansprechende Worte zu finden,[a] und Worte der Wahrheit in rechter Weise niederzuschreiben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „erfreuliche Worte“; wörtlich etwa: „Worte des Gefallens“.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Satzfügung ist knapp und kann auch anders gegliedert werden, etwa: „und: In rechter Weise geschrieben – Worte der Wahrheit“.'
    reason: alternative_reading
lexical_decisions:
- source_word: בִּקֵּשׁ
  choice: suchte
  rationale: Das Verb bezeichnet ein bewusstes, zielgerichtetes Suchen; „suchte“ bewahrt diesen Sinn knapp und unmittelbar.
- source_word: קֹהֶלֶת
  choice: Kohelet
  rationale: Die im Deutschen übliche Transliteration bewahrt die hebräische literarische Bezeichnung, ohne sie vorschnell als „Lehrer“ oder „Prediger“ funktional festzulegen.
- source_word: לִמְצֹא
  choice: zu finden
  rationale: Die Infinitivkonstruktion wird direkt und idiomatisch wiedergegeben.
- source_word: דִּבְרֵי חֵפֶץ
  choice: Worte, die Freude bereiten
  rationale: חֵפֶץ umfasst Gefallen, Freude und Begehrenswertes. Die Formulierung ist im modernen Deutsch natürlich und bewahrt den positiven, anziehenden Charakter der Worte, ohne ihn lediglich auf stilistische Schönheit zu verengen.
- source_word: וְכָתוּב
  choice: und … niederzuschreiben
  rationale: Die knappe hebräische Form lässt sich als Fortführung der vorausgehenden Infinitivkonstruktion verstehen. „Niederzuschreiben“ ergibt einen vollständigen, natürlichen deutschen Satz; die mögliche partizipiale beziehungsweise anders gegliederte Lesart wird in einer Fußnote erhalten.
- source_word: יֹשֶׁר
  choice: aufrichtig
  rationale: Das Wort bezeichnet Geradheit beziehungsweise Rechtschaffenheit. „Aufrichtig“ lässt sowohl die redliche Art des Schreibens als auch dessen sachliche Richtigkeit anklingen.
- source_word: דִּבְרֵי אֱמֶת
  choice: Worte der Wahrheit
  rationale: Die hebräische Genitivverbindung wird eng nachgebildet und hält sowohl den Wahrheitsgehalt als auch die Wahrhaftigkeit der Worte im Blick.
theological_decisions:
- issue: Wiedergabe von קֹהֶלֶת
  choice: Kohelet als transliterierte Bezeichnung
  alternative: der Lehrer; der Prediger
  rationale: Die Transliteration vermeidet eine interpretierende Festlegung der literarischen Gestalt auf eine einzelne Amts- oder Lehrfunktion.
- issue: Verhältnis von gefälliger Rede und Wahrheit
  choice: Beide Aussagen werden ohne Gegensatz oder Harmonisierung nebeneinandergestellt
  alternative: Die angenehmen Worte ausdrücklich den wahren Worten unterzuordnen oder gegenüberzustellen
  rationale: Der hebräische Text verbindet die Suche nach erfreulichen Worten mit aufrichtig geschriebenen Worten der Wahrheit, erklärt ihr Verhältnis aber nicht weiter. Diese Spannung soll im Text bestehen bleiben.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. „Kohelet“ folgt der etablierten deutschen Schreibweise. Die Satzstellung ist flüssig, ohne die Parallelität von erfreulichen Worten und Worten der Wahrheit einzuebnen.
