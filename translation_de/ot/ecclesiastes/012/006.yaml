base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/006.yaml
  text: before the silver cord is snapped[a], and the golden bowl is shattered, and the jar is broken at the spring[d][c][b], and the wheel is crushed at the pit.
translation:
  language: de
  text: bevor die silberne Schnur zerreißt[a] und die goldene Schale zerschmettert wird und der Krug an der Quelle zerbricht[b] und das Rad in die Zisterne zerschlagen wird[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „entfernt“, „durchtrennt“; traditionell auch: „gelöst“. Das hebräische Verb ist hier schwer zu deuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der Wasserkrug“ oder „der Krug“.'
    reason: lexical_alternative
  - marker: c
    text: „Rad“ kann hier genauer das Brunnenrad oder die Rolle einer Schöpfvorrichtung bezeichnen. „Zisterne“ kann auch mit „Brunnen“ oder „Grube“ wiedergegeben werden; die hebräische Präposition kann eine Richtung zum oder in den Schacht anzeigen.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד אֲשֶׁר לֹא
  choice: bevor
  rationale: Die Wendung führt im Zusammenhang den Zeitpunkt ein, ehe Tod und Verfall eintreten. Das wiederholte „bevor“ bildet im Deutschen den langen poetischen Satz klar ab.
- source_word: ירחק
  choice: zerreißt
  rationale: Das Verb ist an dieser Stelle textlich beziehungsweise semantisch schwierig. „Zerreißt“ passt zur Schnur und zum parallelen Zerstörungsmotiv; die Unsicherheit bleibt in einer Fußnote sichtbar.
- source_word: חֶבֶל הַכֶּסֶף
  choice: die silberne Schnur
  rationale: Natürliche deutsche Wiedergabe der hebräischen Genitivverbindung, ohne die Bildsprache auszudeuten.
- source_word: וְתָרֻץ גֻּלַּת הַזָּהָב
  choice: die goldene Schale zerschmettert wird
  rationale: רצץ bezeichnet gewaltsames Zerbrechen oder Zerschlagen; „zerschmettert“ bewahrt die starke poetische Wirkung. גֻּלָּה wird allgemein als „Schale“ wiedergegeben, ohne sie als Lampengefäß festzulegen.
- source_word: וְתִשָּׁבֶר כַּד עַל הַמַּבּוּעַ
  choice: der Krug an der Quelle zerbricht
  rationale: כַּד ist ein Wasserkrug; מַבּוּעַ bezeichnet eine Quelle oder einen Quellort. Die Formulierung ist konkret und idiomatisch.
- source_word: וְנָרֹץ הַגַּלְגַּל אֶל הַבּוֹר
  choice: das Rad am Brunnen zerschlagen wird
  rationale: גַּלְגַּל bedeutet „Rad“ und kann hier das Rad beziehungsweise die Rolle einer Schöpfvorrichtung meinen. בּוֹר kann Grube, Zisterne oder Brunnen bedeuten; der Wasserhebemechanismus macht „Brunnen“ im Deutschen kontextuell am plausibelsten. אֶל beschreibt hier die räumliche Zuordnung zum Brunnen, ohne zwingend eine Bewegung hinein auszudrücken.
theological_decisions:
- issue: Deutung der zerbrochenen Gegenstände
  choice: Die konkrete poetische Bilderfolge bleibt unaufgelöst stehen.
  alternative: Die einzelnen Gegenstände ausdrücklich bestimmten Körperteilen oder Lebensfunktionen zuordnen.
  rationale: Der Zusammenhang weist auf Tod und das Erlöschen des Lebens, doch die genaue allegorische Zuordnung der Bilder ist umstritten. Eine Ausdeutung im Text würde die genuine Offenheit des hebräischen Gedichts beseitigen.
translation_notes:
  register: Moderne, gehobene Standardsprache mit bewahrter poetischer Parallelstruktur. Das zweite „bevor“ dient der Klarheit innerhalb des fortlaufenden Satzes aus Vers 1–7. Die Bilder werden nicht anatomisch allegorisiert.
