  text: הֲבֵ֧ל הֲבָלִ֛ים אָמַ֥ר הַ/קּוֹהֶ֖לֶת הַ/כֹּ֥ל הָֽבֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/008.yaml
  text: “Vapor of vapors,” says the Teacher[a]; “everything is vapor.”
translation:
  language: de
  text: »Hauch der Hauche«, sagt der Lehrer[a], »alles ist Hauch.«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Nichtigkeit der Nichtigkeiten«, sagt der Prediger, »alles ist nichtig.« Das hebräische Wort הבל bezeichnet wörtlich einen Hauch oder Dunst und kann auf etwas Flüchtiges, Unbeständiges oder schwer Fassbares hinweisen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲבֵל הֲבָלִים
  choice: Hauch der Hauche
  rationale: Die Verbindung steigert הבל superlativisch. „Hauch“ bewahrt das konkrete Bild von etwas Flüchtigem, Unbeständigem und schwer Fassbarem, ohne die Mehrdeutigkeit auf bloße Sinnlosigkeit zu verengen.
- source_word: אָמַר
  choice: sagt
  rationale: Das Präsens gibt die abschließende, refrainartige Aussage im Deutschen natürlich und unmittelbar wieder; das hebräische Perfekt kann in diesem Zitierrahmen so verstanden werden.
- source_word: הַקּוֹהֶלֶת
  choice: der Lehrer
  rationale: Der Ausdruck bezeichnet hier eine Rolle bzw. einen Titel. „Der Lehrer“ ist in modernem Deutsch verständlich und gibt die unterweisende Funktion wieder, ohne den stärker kirchlich geprägten Begriff „Prediger“ vorauszusetzen.
- source_word: הַכֹּל
  choice: alles
  rationale: „Alles“ gibt die umfassende Totalität knapp und idiomatisch wieder.
- source_word: הָבֶל
  choice: Hauch
  rationale: Die Wiederholung desselben deutschen Wortes bewahrt den Leitbegriff und die literarische Geschlossenheit des hebräischen Satzes.
theological_decisions:
- issue: Wiedergabe des Leitworts הבל im Buch Kohelet
  choice: Hauch
  alternative: Nichtigkeit; Vergeblichkeit; Dunst
  rationale: „Hauch“ erhält das konkrete Bild und lässt dessen Spannweite zwischen Flüchtigkeit, Unbeständigkeit, Unfassbarkeit und mangelnder Substanz offen. Eine abstrakte Wiedergabe wie „Nichtigkeit“ oder „Vergeblichkeit“ würde die Aussage stärker auslegen und ihre Spannung reduzieren.
translation_notes:
  register: Modernes, knappes und würdevolles Standarddeutsch. Die bewusst ungewöhnliche Formulierung „Hauch der Hauche“ spiegelt die hebräische Steigerungsform und bewahrt das zentrale Bild; die Fußnote nennt die traditionelle abstrakte Wiedergabe und die Titelalternative.
