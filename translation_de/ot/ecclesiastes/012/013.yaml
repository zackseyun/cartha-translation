id: ECC.12.13
reference: Ecclesiastes 12:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: ס֥וֹף דָּבָ֖ר הַ/כֹּ֣ל נִשְׁמָ֑ע אֶת הָ/אֱלֹהִ֤ים יְרָא֙ וְ/אֶת מִצְוֺתָ֣י/ו שְׁמ֔וֹר כִּי זֶ֖ה כָּל הָ/אָדָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/013.yaml
  text: 'The end of the matter, when all has been heard: fear God and keep his commandments, for this is the whole of man.[a]'
translation:
  language: de
  text: 'Das Schlusswort, nachdem alles gehört worden ist: Fürchte Gott und halte seine Gebote; denn das ist der ganze Mensch.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „denn dies ist der ganze Mensch“. Möglich sind auch die Deutungen: „denn dies ist die ganze Bestimmung des Menschen“ oder „denn dies gilt für jeden Menschen“.'
    reason: Die knappe hebräische Wendung כִּי זֶה כָּל־הָאָדָם ist mehrdeutig; die Fußnote macht die wichtigsten Möglichkeiten sichtbar, ohne sie im Haupttext festzulegen.
lexical_decisions:
- source_word: סוֹף דָּבָר
  choice: Das Schlusswort
  rationale: Gibt die knappe hebräische Wendung natürlich wieder und bewahrt die mögliche Bedeutung eines abschließenden Fazits.
- source_word: הַכֹּל נִשְׁמָע
  choice: nachdem alles gehört worden ist
  rationale: Folgt dem passiven נִשְׁמָע und lässt offen, ob alles Gesagte oder die gesamte Untersuchung gemeint ist.
- source_word: יְרָא
  choice: Fürchte
  rationale: Bewahrt den starken biblischen Begriff der Gottesfurcht, der Ehrfurcht, Achtung und Gehorsam einschließt.
- source_word: שְׁמוֹר
  choice: halte
  rationale: ‚Gebote halten‘ ist im modernen Deutschen verständlich und gibt den Sinn von beachten, bewahren und befolgen wieder.
- source_word: כִּי זֶה כָּל־הָאָדָם
  choice: denn das ist der ganze Mensch
  rationale: Bewahrt die ungewöhnliche, theologisch offene Formulierung des Hebräischen und ergänzt nicht einschränkend ‚Pflicht‘ oder ‚Bestimmung‘.
theological_decisions:
- issue: Bedeutung von כָּל־הָאָדָם
  choice: der ganze Mensch
  alternative: die ganze Pflicht des Menschen / das gilt für jeden Menschen
  rationale: Der hebräische Text nennt weder ausdrücklich eine ‚Pflicht‘ noch ein Verb wie ‚gilt‘. Die wörtlichere Form wahrt die Spannung, ob Gottesfurcht und Gebotstreue das ganze Wesen, die ganze Bestimmung oder die umfassende Angelegenheit des Menschen bezeichnen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die imperativische Zuspitzung und die prägnante Schlussformel des Hebräischen bleiben erhalten; die ungewohnte Schlusswendung wird bewusst nicht geglättet.
