translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Wendung »keine Erinnerung« bewahrt den nachdrücklichen Aufbau des Hebräischen; »Frühere«, »Spätere« und »danach« halten die zeitliche Staffelung bewusst allgemein.
