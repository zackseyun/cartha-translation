  source_fidelity: Die zeitliche Staffelung und die dreifache Aussage über fehlende Erinnerung werden zutreffend wiedergegeben. »Frühere« und »Spätere« bewahren die im Hebräischen absichtlich offene Referenz. »Kommen werden« ist im Kontext eine vertretbare idiomatische Entfaltung von »sein werden«.
  naturalness: Die Satzstellung »An die Früheren gibt es keine Erinnerung« ist im modernen Standarddeutsch deutlich weniger idiomatisch als »Es gibt keine Erinnerung an die Früheren«. Ein Semikolon verbindet die eng parallelen Satzhälften natürlicher als ein neuer, mit »Und« beginnender Satz.
  terminology: '»Erinnerung« ist als wiederholte Wiedergabe von זִכְרוֹן / זִכָּרוֹן geeignet. Die vorhandene Fußnote ist jedoch problematisch: »Die Früheren haben keine Erinnerung« legt eine eigene Erinnerungsfähigkeit der früheren Personen nahe, während der Zusammenhang und die gewählte Hauptübersetzung das Andenken an sie meinen.'
