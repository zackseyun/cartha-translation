    rationale: Die Formulierung, die Früheren beziehungsweise Späteren hätten selbst keine Erinnerung, ist im Deutschen semantisch missverständlich und entspricht nicht sinnvoll der im Kontext gemeinten fehlenden Erinnerung an diese Personen bzw. Gruppen. Die Fußnote sollte die syntaktische Funktion von ל erläutern, ohne diese Lesart zu fördern.
