base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/011.yaml
  text: There is no remembrance of the former ones[a], and even of the later ones who will be, there will be no remembrance among those who will come afterward.
translation:
  language: de
  text: Es gibt keine Erinnerung an die Früheren[a]; auch an die Späteren, die kommen werden, wird es unter denen, die danach kommen, keine Erinnerung geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Es gibt kein Erinnern/Andenken für die Früheren.« Die hebräische Präposition ל kennzeichnet hier die von der Erinnerung Betroffenen; im Deutschen ist »Erinnerung an« die idiomatische Wiedergabe.'
    reason: Die Anmerkung erläutert die hebräische Konstruktion, ohne die missverständliche Aussage zu erzeugen, die früheren oder späteren Menschen hätten selbst kein Erinnerungsvermögen.
lexical_decisions:
- source_word: אֵין
  choice: gibt es keine
  rationale: Die Existenzverneinung wird im Deutschen natürlich mit »es gibt keine« wiedergegeben.
- source_word: זִכְרוֹן / זִכָּרוֹן
  choice: Erinnerung
  rationale: Das Substantiv bezeichnet das Erinnern beziehungsweise das fortdauernde Andenken. »Erinnerung« bewahrt den abstrakten Sinn und die Wiederholung im Vers.
- source_word: לָרִאשֹׁנִים
  choice: an die Früheren
  rationale: Der substantivierte Plural bleibt bewusst allgemein und kann frühere Menschen oder Generationen bezeichnen, ohne den Bezug unnötig einzuengen. Die Präposition wird als Bezug der Erinnerung verstanden.
- source_word: וְגַם
  choice: Und auch
  rationale: Die Wendung führt die parallele zweite Aussage mit zusätzlichem Nachdruck weiter.
- source_word: לָאַחֲרֹנִים
  choice: an die Späteren
  rationale: Die Wiedergabe erhält den zeitlichen Gegensatz zu den »Früheren« und vermeidet die interpretierende Festlegung auf eine bestimmte Generation.
- source_word: שֶׁיִּהְיוּ
  choice: die kommen werden
  rationale: Wörtlich steht »die sein werden«; im zeitlichen Zusammenhang gibt »die kommen werden« den Sinn in natürlichem Deutsch wieder.
- source_word: לֹא יִהְיֶה לָהֶם זִכָּרוֹן
  choice: wird es … keine Erinnerung geben
  rationale: Die hebräische Existenz- beziehungsweise Besitzkonstruktion wird parallel zur ersten Satzhälfte formuliert. Der Bezug »an sie« ist durch »an die Späteren« bereits ausgedrückt.
- source_word: עִם
  choice: unter
  rationale: Hier bezeichnet die Präposition den Kreis der noch später lebenden Menschen, bei denen die Erinnerung fehlen wird.
- source_word: שֶׁיִּהְיוּ לָאַחֲרֹנָה
  choice: denen, die danach kommen
  rationale: Die Formulierung macht verständlich, dass eine nochmals spätere Gruppe gemeint ist, ohne das mögliche »zuletzt« übermäßig zu präzisieren.
