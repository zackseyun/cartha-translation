  text: כָּל הַ/נְּחָלִים֙ הֹלְכִ֣ים אֶל הַ/יָּ֔ם וְ/הַ/יָּ֖ם אֵינֶ֣/נּוּ מָלֵ֑א אֶל מְק֗וֹם שֶׁ֤/הַ/נְּחָלִים֙ הֹֽלְכִ֔ים שָׁ֛ם הֵ֥ם שָׁבִ֖ים לָ/לָֽכֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/007.yaml
  text: All the streams flow into the sea[a], yet the sea is not full; to the place where the streams flow[b], there they return to flow again.
translation:
  language: de
  text: Alle Bäche fließen ins Meer[a], doch das Meer wird nicht voll. An den Ort, wohin die Bäche fließen[b], dorthin kehren sie zurück, um wieder zu fließen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Flüsse“. Das hebräische Wort נְחָלִים kann je nach Zusammenhang Bäche, Flüsse, Wadis oder Flussbetten bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „An den Ort, wohin die Bäche gehen, dorthin kehren sie zurück, um zu gehen.“ Die Formulierung kann den immer wiederkehrenden Lauf des Wassers anklingen lassen, ohne dessen Mechanismus ausdrücklich zu beschreiben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְחָלִים
  choice: Bäche
  rationale: Das hebräische Wort kann Bäche, Flüsse, Wadis oder deren Betten bezeichnen. „Bäche“ ist hier ein natürliches, nicht zu stark festlegendes deutsches Wort für fließende Gewässer; die größere Bedeutungsbreite wird in der Fußnote offengehalten.
- source_word: הֹלְכִים
  choice: fließen
  rationale: הלך bedeutet wörtlich „gehen“, wird bei Gewässern im Deutschen jedoch idiomatisch mit „fließen“ wiedergegeben.
- source_word: יָם
  choice: Meer
  rationale: „Meer“ entspricht der üblichen Bedeutung des hebräischen Wortes, ohne es wie „Ozean“ unnötig zu präzisieren.
- source_word: אֵינֶנּוּ מָלֵא
  choice: wird nicht voll
  rationale: Diese natürliche deutsche Formulierung bewahrt die Aussage, ohne ein im Hebräischen nicht ausdrücklich vorhandenes „nie“ hinzuzufügen.
- source_word: מְקוֹם
  choice: Ort
  rationale: Der Text spricht von einem „Ort“ und benennt nicht ausdrücklich eine Quelle oder den Mechanismus eines Wasserkreislaufs.
- source_word: שָׁם
  choice: dorthin
  rationale: Das hinweisende Adverb wird beibehalten und nimmt „an den Ort“ wieder auf; so bleibt die betonte, wiederaufnehmende Satzgestaltung erhalten.
- source_word: שָׁבִים
  choice: kehren sie zurück
  rationale: שוב bedeutet gewöhnlich „zurückkehren“ und trägt hier das Motiv der Wiederholung.
- source_word: לָלָכֶת
  choice: um wieder zu fließen
  rationale: Der Infinitiv bedeutet wörtlich „zu gehen“. Beim Subjekt „Bäche“ ist „fließen“ idiomatisch; „wieder“ gibt den durch „zurückkehren“ und den Infinitiv ausgedrückten wiederkehrenden Vorgang wieder.
theological_decisions:
- issue: Bezug auf den Wasserkreislauf
  choice: Der wiederkehrende Lauf des Wassers wird angedeutet, sein Mechanismus aber nicht erklärt.
  alternative: Den Ort ausdrücklich als Quelle oder die Aussage als Beschreibung von Verdunstung und Niederschlag wiederzugeben.
  rationale: Der hebräische Wortlaut spricht nur vom Ort, zu dem die Bäche gehen und wohin sie zurückkehren, und lässt die genaue Vorstellung offen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem poetischem Klang. Die Wiederholung von „Ort“ und „dorthin“ sowie die zyklische Bewegung bleiben erkennbar; unnötige naturkundliche Präzisierungen werden vermieden.
