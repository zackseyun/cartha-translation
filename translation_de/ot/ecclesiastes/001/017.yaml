base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/017.yaml
  text: And I set my heart to know wisdom[a], and to know madness and folly; I came to know that this too is a chasing after wind.
translation:
  language: de
  text: Und ich richtete mein Herz darauf, Weisheit zu erkennen und Irrsinn und Torheit kennenzulernen. Ich erkannte, dass auch dies ein Jagen nach Wind ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Streben nach Wind“. Traditionell auch: „ein Grämen des Geistes“.'
    reason: Die Bedeutung von רַעְיוֹן ist nicht völlig sicher. Neben einem vergeblichen Jagen oder Streben wurde die Wendung traditionell auf eine innere Bedrängnis bezogen; die Alternativen bewahren diese lexikalische Spannweite.
lexical_decisions:
- source_word: וָאֶתְּנָה לִבִּי
  choice: ich richtete mein Herz darauf
  rationale: Die hebräische Wendung bezeichnet die bewusste Ausrichtung des Inneren, der Aufmerksamkeit und des Willens auf ein Vorhaben. Die Übersetzung bewahrt das Bild vom Herzen und ist zugleich im modernen Deutschen verständlich.
- source_word: לָדַעַת
  choice: zu erkennen
  rationale: ידע bezeichnet hier ein durch Untersuchung und Erfahrung gewonnenes Erkennen; „erkennen“ passt zum forschenden Zusammenhang und lässt sich beim abschließenden יָדַעְתִּי wiederaufnehmen.
- source_word: חָכְמָה
  choice: Weisheit
  rationale: „Weisheit“ ist der sachlich und literarisch angemessene Standardbegriff für חָכְמָה im Buch Kohelet.
- source_word: וְדַעַת
  choice: und … kennenzulernen
  rationale: Die Form koordiniert ein zweites Erkenntnisziel mit „Weisheit zu erkennen“. „Kennenlernen“ gibt den untersuchenden Vorgang natürlich wieder und vermeidet eine schwerfällige unmittelbare Wiederholung.
- source_word: הוֹלֵלוֹת
  choice: Irrsinn
  rationale: Das Wort bezeichnet irrationales oder aberwitziges Verhalten und wird so von der folgenden „Torheit“ unterschieden.
- source_word: שִׂכְלוּת
  choice: Torheit
  rationale: „Torheit“ ist der geläufige Gegenbegriff zur Weisheit in der biblischen Weisheitsliteratur und wahrt deren würdiges Register.
- source_word: יָדַעְתִּי
  choice: Ich erkannte
  rationale: Das Perfekt nennt das Ergebnis der Untersuchung. Die Wiederaufnahme von „erkennen“ bewahrt den Zusammenhang des hebräischen Wortspiels.
- source_word: שֶׁגַּם זֶה הוּא
  choice: dass auch dies … ist
  rationale: Die Formulierung gibt sowohl die Folgerung als auch die ergänzende Kraft von גַּם unmittelbar und idiomatisch wieder.
- source_word: רַעְיוֹן רוּחַ
  choice: ein Jagen nach Wind
  rationale: Die Wendung beschreibt ein vergebliches Bemühen um etwas Unfassbares. „Jagen nach Wind“ erhält das konkrete Bild und ist im heutigen Deutsch klar; die lexikalisch mögliche Nuance des Strebens bleibt in der Fußnote erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter hebräischer Herzmetaphorik. Die Paarung „Irrsinn und Torheit“ unterscheidet die beiden benachbarten Begriffe; „Jagen nach Wind“ hält das anschauliche Leitbild Kohelets fest.
