  text: אֲנִ֣י קֹהֶ֗לֶת הָיִ֥יתִי מֶ֛לֶךְ עַל יִשְׂרָאֵ֖ל בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/012.yaml
  text: I[a], Qoheleth, was king over Israel in Jerusalem.
translation:
  language: de
  text: Ich, Kohelet[a], war König über Israel in Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kohelet kann auch mit „der Lehrer“, „der Prediger“ oder „der Versammler“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: Ich
  rationale: Das selbstständige Personalpronomen eröffnet den Satz mit einer betonten Selbstvorstellung; deshalb wird es ausdrücklich wiedergegeben.
- source_word: קֹהֶלֶת
  choice: Kohelet
  rationale: Die im Deutschen übliche Transliteration bewahrt die namen- bzw. titelartige Bezeichnung und legt ihre umstrittene genaue Bedeutung nicht vorschnell fest.
- source_word: הָיִיתִי
  choice: war
  rationale: Das Qal-Perfekt der 1. Person Singular von היה bezeichnet hier im rückblickenden Zusammenhang einen vergangenen Zustand; das deutsche Präteritum ist dafür natürlich und präzise.
- source_word: מֶלֶךְ
  choice: König
  rationale: Das Substantiv steht als Prädikatsnomen nach היה und bezeichnet das königliche Amt; im Deutschen ist „war König“ idiomatisch.
- source_word: עַל
  choice: über
  rationale: Die Präposition bezeichnet hier Herrschaft bzw. Regierungsgewalt über Israel und wird daher unmittelbar mit „über“ wiedergegeben.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Etablierte deutsche Form des Eigennamens.
- source_word: בִּירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Die Präposition ב ist hier lokal gebraucht; „in Jerusalem“ ist die natürliche deutsche Ortsangabe.
theological_decisions:
- issue: Ob קֹהֶלֶת als Titel übersetzt oder als hebräische Bezeichnung transliteriert werden soll
  choice: Kohelet
  alternative: der Lehrer; der Prediger; der Versammler
  rationale: Die genaue Bedeutung des hebräischen Ausdrucks ist umstritten, und er dient im Buch als charakteristische Sprecherbezeichnung. Die Transliteration bewahrt diese Mehrdeutigkeit, ohne eine bestimmte Auslegung in den Haupttext einzutragen.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem, knappem Satzbau. Die Apposition „Ich, Kohelet“ erhält die betonte Selbstvorstellung des Hebräischen; die bekannte deutsche Form „Kohelet“ vermeidet eine unnötig fremde Umschrift.
