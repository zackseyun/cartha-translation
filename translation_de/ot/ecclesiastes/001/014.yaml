base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/014.yaml
  text: I have seen all the works that are done under the sun[a], and behold[b], all is vanity and a striving after wind.
translation:
  language: de
  text: 'Ich habe alle Werke gesehen, die unter der Sonne getan werden; und siehe: Alles ist Hauch[a] und ein Haschen nach Wind[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dunst“, „Atem“ oder „Nichtigkeit“. Das hebräische Wort הֶבֶל bezeichnet im Predigerbuch etwas Flüchtiges, Unbeständiges und schwer Fassbares; es bedeutet nicht einfach nur „sinnlos“.'
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Wendung רְעוּת רוּחַ bezeichnet wahrscheinlich ein vergebliches Streben; wörtlicher ist möglicherweise „ein Hüten des Windes“.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתִי
  choice: Ich habe … gesehen
  rationale: Das Qal-Perfekt in der 1. Person Singular bezeichnet die abgeschlossene, für die gegenwärtige Betrachtung weiterhin bedeutsame Beobachtung des Sprechers.
- source_word: כָּל הַמַּעֲשִׂים
  choice: all die Taten
  rationale: מַעֲשִׂים umfasst menschliche Werke, Handlungen und Unternehmungen. „Taten“ bewahrt die konkrete Breite, ohne den Ausdruck auf Erwerbsarbeit zu verengen.
- source_word: שֶׁנַּעֲשׂוּ
  choice: die … getan werden
  rationale: Das Niphal-Perfekt steht in einem verallgemeinernden Relativsatz. Das deutsche Präsens gibt diese allgemeine Aussage natürlich wieder.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: unter der Sonne
  rationale: Die wörtliche und im Predigerbuch wiederkehrende Wendung bezeichnet den irdischen menschlichen Lebensbereich.
- source_word: וְהִנֵּה
  choice: Und sieh
  rationale: הִנֵּה lenkt nachdrücklich die Aufmerksamkeit auf das Ergebnis der Beobachtung. „Und sieh“ wahrt diese rhetorische Funktion in verständlichem, gehobenem Gegenwartsdeutsch.
- source_word: הַכֹּל
  choice: Alles
  rationale: Der Ausdruck fasst die Gesamtheit der zuvor betrachteten Taten zusammen; „Alles“ ist knapp und lässt den Umfang wie im Hebräischen offen.
- source_word: הֶבֶל
  choice: Hauch
  rationale: „Hauch“ bewahrt das Grundbild von etwas Flüchtigem und Unbeständigem, ohne das vielschichtige Wort vorschnell allein als „sinnlos“ oder „nichtig“ auszulegen.
- source_word: רְעוּת רוּחַ
  choice: ein Haschen nach Wind
  rationale: Die idiomatische Wiedergabe vermittelt das Bild eines vergeblichen Bemühens. Zugleich bleibt die schwierigere, möglicherweise auf das Hüten oder Weiden bezogene Wortbildung in einer Fußnote sichtbar.
theological_decisions:
- issue: Tragweite des Urteils הַכֹּל הֶבֶל
  choice: „Alles ist Hauch“ lässt die pauschale Aussage und ihre bildhafte Mehrdeutigkeit stehen.
  alternative: „Alles ist sinnlos“ oder „Alles ist vergeblich“
  rationale: Die Alternativen legen die Aussage einseitig als philosophische Sinnlosigkeit beziehungsweise Erfolglosigkeit fest. Das hebräische Bild umfasst Flüchtigkeit, Unbeständigkeit, Unfassbarkeit und frustrierende Vergeblichkeit, ohne diese Aspekte vollständig gleichzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung „Taten … getan“ folgt bewusst der hebräischen Wortwurzel, während „Und sieh“ den rhetorischen Nachdruck von וְהִנֵּה erhält, ohne das stärker altertümliche „siehe“ zu verwenden.
