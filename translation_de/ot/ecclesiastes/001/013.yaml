  text: וְ/נָתַ֣תִּי אֶת לִבִּ֗/י לִ/דְר֤וֹשׁ וְ/לָ/תוּר֙ בַּֽ/חָכְמָ֔ה עַ֛ל כָּל אֲשֶׁ֥ר נַעֲשָׂ֖ה תַּ֣חַת הַ/שָּׁמָ֑יִם ה֣וּא עִנְיַ֣ן רָ֗ע נָתַ֧ן אֱלֹהִ֛ים לִ/בְנֵ֥י הָ/אָדָ֖ם לַ/עֲנ֥וֹת בּֽ/וֹ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/013.yaml
  text: And I set my heart to seek and to explore by wisdom all that is done under heaven[b][a]. It is an unhappy task God has given to the sons of man to be occupied with.
translation:
  language: de
  text: Und ich richtete mein Herz darauf, mit Weisheit alles zu erforschen und zu erkunden, was unter dem Himmel getan wird. Das ist eine leidvolle Aufgabe, die Gott den Menschen[a] gegeben hat, damit sie sich damit abmühen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „den Söhnen des Menschen“; die hebräische Wendung meint hier die Menschen beziehungsweise die Menschheit allgemein.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „damit sie sich damit beschäftigen“; auch möglich: „damit sie dadurch bedrückt werden“. Das hebräische Verb kann sowohl Beschäftigung als auch Belastung ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי אֶת לִבִּי
  choice: Und ich richtete mein Herz darauf
  rationale: Die hebräische Wendung lautet wörtlich „ich gab mein Herz“. „Ich richtete mein Herz darauf“ bewahrt Herz als Sitz von Denken und Wollen und klingt zugleich natürlich deutsch.
- source_word: לִדְרוֹשׁ וְלָתוּר
  choice: zu erforschen und zu erkunden
  rationale: Die beiden annähernd synonymen Verben bezeichnen ein bewusstes Nachforschen und suchendes Erkunden; die Doppelung bleibt erhalten.
- source_word: בַּחָכְמָה
  choice: mit Weisheit
  rationale: Die Präposition bezeichnet hier Mittel oder Art und Weise der Untersuchung.
- source_word: עַל כָּל אֲשֶׁר נַעֲשָׂה
  choice: alles, was … getan wird
  rationale: Die Übersetzung bewahrt das Passiv und den allgemeinen, zeitübergreifenden Sinn.
- source_word: תַּחַת הַשָּׁמָיִם
  choice: unter dem Himmel
  rationale: Die feste Wendung bezeichnet den menschlichen Lebensbereich und lässt sich im Deutschen idiomatisch so wiedergeben.
- source_word: עִנְיַן רָע
  choice: eine leidvolle Aufgabe
  rationale: עִנְיַן bezeichnet eine Aufgabe oder Beschäftigung; רָע hebt hier ihren belastenden Charakter hervor, ohne zwingend moralische Bosheit auszudrücken.
- source_word: לִבְנֵי הָאָדָם
  choice: den Menschen
  rationale: Die wörtliche Form „den Söhnen des Menschen/Adams“ wird generisch für die Menschheit gebraucht. „Den Menschen“ gibt diesen gemeinten Umfang im modernen Deutschen klar wieder; die Form des Hebräischen wird in einer Fußnote dokumentiert.
- source_word: לַעֲנוֹת בּוֹ
  choice: damit sie sich damit abmühen
  rationale: Die Form kann Beschäftigung und Bedrängnis ausdrücken. „Sich damit abmühen“ bewahrt beide Aspekte besser als das neutralere „sich damit beschäftigen“.
theological_decisions:
- issue: Ob רָע Gottes Gabe als moralisch böse bezeichnet
  choice: leidvolle Aufgabe
  alternative: böse Aufgabe
  rationale: Der Zusammenhang beschreibt die belastende und bedrückende menschliche Tätigkeit. Die moralisch stärker festgelegte Wiedergabe „böse“ würde eine Aussage über Gott nahelegen, die der Ausdruck hier nicht zwingend macht.
- issue: Generische Bedeutung von לִבְנֵי הָאָדָם
  choice: den Menschen im Haupttext, mit wörtlicher Form in der Fußnote
  alternative: den Menschensöhnen
  rationale: Die hebräische maskuline Wendung hat hier umfassenden, generischen Bezug. Natürliches modernes Deutsch verlangt nicht, die semitische Form im Haupttext nachzubilden; die Fußnote erhält die sprachliche Besonderheit.
- issue: Mehrdeutigkeit von לַעֲנוֹת בּוֹ
  choice: sich damit abmühen, mit Alternativen in der Fußnote
  alternative: sich damit beschäftigen / dadurch bedrückt werden
  rationale: Die gewählte Form verbindet Tätigkeit und Belastung, während die Fußnote die genuine lexikalische Spannweite ausdrücklich offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederkehrende Wendung „unter dem Himmel“ und das anthropologisch umfassende „Herz“ bleiben erhalten. Die belastende Mehrdeutigkeit des Schlusses wird im Haupttext angedeutet und in der Fußnote entfaltet.
