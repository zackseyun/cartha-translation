  text: מַה יִּתְר֖וֹן לָֽ/אָדָ֑ם בְּ/כָל עֲמָל֔/וֹ שֶֽׁ/יַּעֲמֹ֖ל תַּ֥חַת הַ/שָּֽׁמֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/003.yaml
  text: What profit does man have in all his labor at which he toils under the sun?[a]
translation:
  language: de
  text: Welchen Gewinn hat der Mensch von all seiner Mühe, mit der er sich abmüht unter der Sonne?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Mensch“ beziehungsweise „die Menschheit“; das hebräische Wort steht im Singular und ist hier repräsentativ gebraucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה
  choice: Welchen
  rationale: Leitet die rhetorische Frage knapp ein und stimmt im Deutschen mit „Gewinn“ überein.
- source_word: יִתְרוֹן
  choice: Gewinn
  rationale: Bewahrt den für Prediger wichtigen Gedanken eines verbleibenden Nutzens oder Überschusses und zugleich die wirtschaftliche Bildsprache.
- source_word: לָאָדָם
  choice: hat der Mensch
  rationale: אָדָם steht im Singular und bezeichnet hier repräsentativ den Menschen beziehungsweise die Menschheit; die Formulierung ist im Deutschen natürlich und wahrt diese Spannung.
- source_word: בְּכָל עֲמָלוֹ
  choice: von all seiner Mühe
  rationale: „Von“ gibt idiomatisch die Quelle des erfragten Gewinns wieder; „Mühe“ erfasst den belastenden Beiklang von עָמָל.
- source_word: שֶׁיַּעֲמֹל
  choice: mit der er sich abmüht
  rationale: Bewahrt den Zusammenhang von Substantiv und Verb sowie den Gedanken beschwerlicher Anstrengung, ohne im Deutschen unverständlich zu wirken.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: unter der Sonne
  rationale: Entspricht wörtlich der programmatischen Wendung des Buches und bezeichnet den irdischen, beobachtbaren Lebensbereich.
theological_decisions:
- issue: Generische Bedeutung von אָדָם
  choice: der Mensch
  alternative: ein Mensch; die Menschen; die Menschheit
  rationale: Der hebräische Singular hat repräsentative Bedeutung. „Der Mensch“ erhält sowohl die Singularform als auch den allgemeinen Bezug, ohne die Aussage auf Männer zu beschränken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederaufnahme von „Mühe“ durch „sich abmühen“ spiegelt bewusst das hebräische Wortspiel; „unter der Sonne“ bleibt als Leitformel des Predigerbuches erhalten.
