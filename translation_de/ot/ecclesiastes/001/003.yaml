  terminology: „Gewinn“ ist für den zentralen Begriff יִתְרוֹן treffend. „Der Mensch“ ist im Deutschen eine natürliche generische Form und vermeidet eine unangebrachte männliche Einschränkung. Die Fußnote erläutert den repräsentativen Singular sachlich und bietet sinnvolle Alternativen.
