  source_fidelity: Die Übersetzung gibt die hebräische rhetorische Frage vollständig wieder. „Welchen Gewinn“ trifft יִתְרוֹן als bleibenden Ertrag/Vorteil, „der Mensch“ bewahrt den generischen repräsentativen Singular von לָאָדָם, und „unter der Sonne“ entspricht der Leitformel תַּחַת הַשָּׁמֶשׁ. „Von all seiner Mühe“ ist im Deutschen eine idiomatische Wiedergabe der Frage nach dem aus aller Mühe resultierenden Gewinn; die Wiederaufnahme in „mit der er sich abmüht“ bildet die hebräische Wortverbindung עֲמָלוֹ / שֶׁיַּעֲמֹל angemessen nach.
