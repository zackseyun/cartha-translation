  text: דִּבְרֵי֙ קֹהֶ֣לֶת בֶּן דָּוִ֔ד מֶ֖לֶךְ בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/001.yaml
  text: The words of Qoheleth[a], son of David, king in Jerusalem.
translation:
  language: de
  text: Die Worte Kohelets[a], des Sohnes Davids, des Königs in Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kohelet ist die hebräische Bezeichnung des Sprechers. Sie kann »Lehrer«, »Prediger« oder eine mit der Versammlung verbundene Person bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי
  choice: Die Worte
  rationale: Der Status constructus im Plural leitet den Inhalt des Buches ein. »Die Worte« gibt die hebräische Form unmittelbar und im Deutschen natürlich wieder; »Die Aussprüche« wäre stärker deutend.
- source_word: קֹהֶלֶת
  choice: Kohelet
  rationale: Die im Deutschen etablierte Transliteration bewahrt die umstrittene Bedeutung dieser hebräischen Bezeichnung, statt sie vorschnell als Funktionsbezeichnung festzulegen.
- source_word: בֶּן דָּוִד
  choice: des Sohnes Davids
  rationale: Die Genitivfügung gibt die hebräische Abstammungsbezeichnung genau wieder und bewahrt zugleich ihren königlichen Anklang.
- source_word: מֶלֶךְ
  choice: des Königs
  rationale: Die Apposition wird passend zur deutschen Satzstruktur in den Genitiv gesetzt; »König« ist die direkte Standardentsprechung.
- source_word: בִּירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Die Präposition בְּ ist hier lokal gebraucht; »in Jerusalem« ist die natürliche Wiedergabe im modernen Deutschen.
theological_decisions:
- issue: Ob קֹהֶלֶת als Funktionsbezeichnung übersetzt oder als hebräische Bezeichnung transliteriert werden soll
  choice: Im Haupttext »Kohelet«
  alternative: »der Lehrer«, »der Prediger« oder eine mit der Versammlung verbundene Person
  rationale: Die genaue Bedeutung und Funktion der Bezeichnung ist umstritten. Die Transliteration bewahrt die literarische und theologische Offenheit des hebräischen Textes; die wichtigsten Deutungsmöglichkeiten werden in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die etablierte deutsche Form »Kohelet« vermeidet eine unnötig fremde englischnahe Umschrift. Die wiederholten Genitive bilden die knappe hebräische Überschrift natürlich ab.
