  text: And the sun rises[a], and the sun goes down, and hastening to its place, it rises there again.
translation:
  language: de
  text: Die Sonne geht auf, und die Sonne geht unter. Zu ihrem Ort eilt[a] sie; dort geht sie auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Wort kann auch bildhaft verstanden werden: „Zu ihrem Ort keucht (oder: lechzt) sie; dort geht sie auf.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָרַח
  choice: Die Sonne geht auf
  rationale: זרח bezeichnet beim Subjekt Sonne ihr Aufgehen beziehungsweise Hervorstrahlen. Das hebräische Qatal wird im Zusammenhang als allgemeingültige, sich wiederholende Beobachtung im Präsens wiedergegeben.
- source_word: וּבָא
  choice: die Sonne geht unter
  rationale: בוא bedeutet wörtlich „kommen/eingehen“, bezeichnet bei der Sonne aber idiomatisch ihr Untergehen.
- source_word: מְקוֹמוֹ
  choice: zu ihrem Ort
  rationale: Die schlichte Bedeutung „Ort“ und der auf die Sonne bezogene Suffixbezug bleiben erhalten, ohne den Ort ausdrücklich als Aufgangsort auszudeuten.
- source_word: שׁוֹאֵף
  choice: eilt
  rationale: Das Partizip kann ein Keuchen, Lechzen oder angestrengtes Streben ausdrücken. „eilt“ gibt im Zusammenhang die zielgerichtete Bewegung natürlich wieder; die konkretere Bildlichkeit wird in der Fußnote offengehalten.
- source_word: זוֹרֵחַ הוּא שָׁם
  choice: dort geht sie wieder auf
  rationale: Das Partizip bezeichnet das erneute Aufgehen am genannten Ort. „wieder“ ist im Hebräischen nicht ausdrücklich vorhanden, ergibt sich jedoch aus dem beschriebenen Kreislauf; das selbstständige Pronomen wird durch die klare deutsche Satzstruktur nicht eigens hervorgehoben.
