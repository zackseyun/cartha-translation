  text: יֵ֥שׁ דָּבָ֛ר שֶׁ/יֹּאמַ֥ר רְאֵה זֶ֖ה חָדָ֣שׁ ה֑וּא כְּבָר֙ הָיָ֣ה לְ/עֹֽלָמִ֔ים אֲשֶׁ֥ר הָיָ֖ה מִ/לְּ/פָנֵֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/010.yaml
  text: Is there a thing of which one says[a], “See, this is new”? It has already been in the ages before us.
translation:
  language: de
  text: 'Gibt es etwas, von dem man sagt: »Sieh, das ist neu«? Das gab es schon in den Zeiten, die vor uns waren.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder freier: „Das gab es schon längst in den Zeiten vor uns.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ דָּבָר
  choice: Gibt es etwas
  rationale: Die Existenzpartikel mit דָּבָר wird im rhetorischen Zusammenhang als Frage wiedergegeben. „Etwas“ erfasst den offenen Sinn von „Sache, Ding, Angelegenheit“ idiomatisch.
- source_word: שֶׁיֹּאמַר
  choice: von dem man sagt
  rationale: Die Verbindung aus Relativpartikel und Imperfekt bezeichnet eine allgemeine, nicht näher bestimmte Aussage; das unpersönliche „man“ bewahrt diese Offenheit.
- source_word: רְאֵה זֶה חָדָשׁ הוּא
  choice: Sieh, das ist neu
  rationale: „Sieh“ gibt den Aufmerksamkeitsimperativ direkt und ohne archaisches „Siehe“ wieder; Demonstrativpronomen, Adjektiv und Kopulaussage bleiben erhalten.
- source_word: כְּבָר הָיָה
  choice: Es war schon … da
  rationale: כְּבָר betont das frühere Vorhandensein. Die deutsche Wendung „war schon da“ ist natürlich und behält den Existenzsinn von הָיָה.
- source_word: לְעֹלָמִים אֲשֶׁר הָיָה מִלְּפָנֵינוּ
  choice: in den Zeiten, die vor uns waren
  rationale: Der Plural עֹלָמִים bezeichnet hier vergangene Zeitalter beziehungsweise Zeiten, nicht ewige Dauer. Der Relativsatz wird ausdrücklich bewahrt.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Hochdeutsch mit würdigem, knappem Ton. Die rhetorische Frage und die zeitliche Weite des hebräischen Plurals bleiben erhalten; archaische Formen wurden vermieden.
