- from: 'Gibt es etwas, von dem man sagt: »Sieh, das ist neu«? Es war schon in den Zeiten da, die vor uns waren.[a]'
  to: 'Gibt es etwas, von dem man sagt: »Sieh, das ist neu«? Das gab es schon in den Zeiten, die vor uns waren.[a]'
  rationale: Die Revision ersetzt lediglich die schwerfällige Wendung „Es war ... da“ durch die im Deutschen natürliche Existenzformulierung „Das gab es schon“. Dadurch bleiben das Bezugswort, die Vorzeitigkeit von כְּבָר הָיָה und der zeitliche Relativsatz erhalten. Die Fußnote bietet weiterhin eine idiomatisch freiere Wiedergabe, ohne die Mehrdeutigkeit von עֹלָמִים übermäßig festzulegen.
