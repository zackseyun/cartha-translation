review_pass:
  verdict: revise
  source_fidelity: Die rhetorische Frage, die allgemeine Aussage durch „man“, der Aufmerksamkeitsruf und die Aussage, dass das vermeintlich Neue bereits in früheren Zeiten vorhanden war, werden zutreffend wiedergegeben. Die Formulierung „Es war ... da“ ist jedoch mit dem anschließenden Relativsatz unnötig schwerfällig.
  naturalness: „Es war schon in den Zeiten da, die vor uns waren“ klingt im modernen Standarddeutsch gestelzt. „Das gab es schon in den Zeiten, die vor uns waren“ ist idiomatischer und bewahrt die existenzielle Aussage des Hebräischen.
  terminology: „Zeiten“ ist für עֹלָמִים in diesem Zusammenhang angemessen; es sollte weder eine ewige Dauer noch eine spezifische heilsgeschichtliche Lehre nahelegen. Der Fußnotentext wird sprachlich geglättet und als freiere Alternative kenntlich gemacht.
