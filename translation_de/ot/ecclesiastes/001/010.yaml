  - severity: low
    issue: Fußnote sprachlich unpräzise gekennzeichnet
    rationale: „Oder sinngemäßer“ ist hier stilistisch holprig. Die Alternative ist besser als „freier“ zu kennzeichnen und sollte idiomatisches Deutsch bieten.
