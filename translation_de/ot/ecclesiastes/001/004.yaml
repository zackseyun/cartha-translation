id: ECC.1.4
reference: Ecclesiastes 1:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: דּ֤וֹר הֹלֵךְ֙ וְ/ד֣וֹר בָּ֔א וְ/הָ/אָ֖רֶץ לְ/עוֹלָ֥ם עֹמָֽדֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/004.yaml
  text: A generation goes[a], and a generation comes[b], but the earth stands forever.
translation:
  language: de
  text: Eine Generation geht, eine Generation kommt, doch die Erde bleibt für immer[a] bestehen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Für immer“ gibt eine hebräische Wendung für anhaltende Dauer wieder. Im Zusammenhang hebt sie den Gegensatz zwischen den wechselnden Generationen und der vergleichsweise beständigen Erde hervor.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: „steht“. Das konkrete hebräische Bild bezeichnet hier beständigen Fortbestand.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹר
  choice: Generation
  rationale: Das hebräische Wort bezeichnet hier die jeweils gleichzeitig lebende Menschengeneration. „Generation“ bewahrt die Parallelität zwischen der gehenden und der kommenden Generation.
- source_word: הֹלֵךְ
  choice: geht
  rationale: Das Partizip beschreibt eine fortlaufende, allgemein gültige Bewegung. „Geht“ gibt das konkrete Bild wieder, ohne mit „vergeht“ oder „stirbt“ zusätzliche Deutung einzutragen.
- source_word: בָּא
  choice: kommt
  rationale: „Kommt“ entspricht dem schlichten Gegenbild zu „geht“ und erhält den knappen Rhythmus des Hebräischen.
- source_word: הָאָרֶץ
  choice: die Erde
  rationale: Der umfassende Zusammenhang der Betrachtung spricht für die Erde als Ganze, nicht für ein bestimmtes Land.
- source_word: לְעוֹלָם
  choice: für immer
  rationale: Die Wendung bezeichnet andauernde Fortdauer und bildet den rhetorischen Gegensatz zum Wechsel der Generationen. „Für immer“ ist die natürliche deutsche Entsprechung, ohne die Aussage metaphysisch näher festzulegen.
- source_word: עֹמָדֶת
  choice: bleibt … bestehen
  rationale: Das Verb bedeutet wörtlich „steht“, kann aber auch fortdauernden Bestand ausdrücken. „Bleibt bestehen“ ist im modernen Deutschen natürlich und bewahrt den Gedanken stabiler Dauer.
theological_decisions:
- issue: Ob לְעוֹלָם absolute, metaphysische Ewigkeit oder rhetorisch hervorgehobene Dauer bezeichnet
  choice: Im Haupttext steht „für immer“; die Spannung bleibt bestehen.
  alternative: „auf unabsehbare Zeit“ oder „Zeitalter um Zeitalter“
  rationale: Der Vers stellt den Wechsel menschlicher Generationen der beständigen Erde gegenüber. Als weisheitliche Beobachtung formuliert er keine ausgearbeitete Lehre über die ewige Zukunft der Erde; eine abschwächende Umschreibung im Haupttext würde jedoch die Kraft des hebräischen Ausdrucks mindern.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdevoller Satzführung. Die Wiederholung von „Generation“ und die Gegenbewegung „geht – kommt“ bilden die hebräische Parallelität nach; „doch“ macht den im Hebräischen durch וְ ausgedrückten inhaltlichen Kontrast natürlich sichtbar.
