  text: הֲבֵ֤ל הֲבָלִים֙ אָמַ֣ר קֹהֶ֔לֶת הֲבֵ֥ל הֲבָלִ֖ים הַ/כֹּ֥ל הָֽבֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/002.yaml
  text: Vapor of vapors[a], says Qoheleth[b]; vapor of vapors—all is vapor.
translation:
  language: de
  text: Hauch der Hauche[a], sagt Kohelet[b]; Hauch der Hauche – alles ist Hauch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort hevel bezeichnet einen Hauch, Atem oder Dunst. »Hauch der Hauche« ist eine hebräische Steigerungsform und beschreibt etwas höchst Flüchtiges, Substanzloses oder schwer Fassbares.
    reason: lexical_choice
  - marker: b
    text: Kohelet ist die hebräische Bezeichnung der sprechenden Gestalt; traditionell wird sie unter anderem mit »Lehrer« oder »Prediger« wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲבֵל
  choice: Hauch
  rationale: Das konkrete Bild bezeichnet Atem, Hauch oder Dunst. »Hauch« ist im Deutschen natürlich, bewahrt die Vorstellungen von Flüchtigkeit und Ungreifbarkeit und vermeidet die abstrakte Festlegung auf »Sinnlosigkeit« oder »Nichtigkeit«.
- source_word: הֲבֵל הֲבָלִים
  choice: Hauch der Hauche
  rationale: Die hebräische Genitivverbindung dient als Superlativ. Die wörtlich bildhafte Wiederholung erhält die programmatische Klangwirkung des Verses.
- source_word: אָמַר
  choice: sagt
  rationale: Obwohl die Form morphologisch eine abgeschlossene Verbform ist, fungiert sie hier als lebendige literarische Redeeinleitung; das deutsche Präsens ist dafür idiomatisch.
- source_word: קֹהֶלֶת
  choice: Kohelet
  rationale: Die im Deutschen übliche Umschrift bewahrt die mehrdeutige hebräische Bezeichnung, ohne sie einseitig als »Lehrer« oder »Prediger« auszulegen.
- source_word: הַכֹּל
  choice: alles
  rationale: »Alles« gibt den umfassenden und zugleich knappen hebräischen Ausdruck natürlich wieder.
- source_word: הָבֶל
  choice: Hauch
  rationale: Die Schlussaussage wiederholt unverändert das Leitbild; ein verstärkendes »nur« oder »bloß« wäre im Ausgangstext nicht ausdrücklich vorhanden.
theological_decisions:
- issue: Wiedergabe des Leitworts הֶבֶל
  choice: Das konkrete Bild durchgehend mit »Hauch« wiedergeben.
  alternative: Nichtigkeit; Sinnlosigkeit; Vergeblichkeit; Eitelkeit; Dunst
  rationale: Das hebräische Bild lässt Flüchtigkeit, Substanzlosigkeit und Ungreifbarkeit zugleich anklingen. Eine abstrakte Wiedergabe würde diese Spannung zugunsten nur einer Deutung auflösen. »Hauch« ist im modernen Deutschen verständlich und trägt das Bild besser als »Eitelkeit«; gegenüber »Dunst« vermeidet es den Beiklang von Nebel oder Rauch.
- issue: Deutung von קֹהֶלֶת
  choice: Die Bezeichnung als »Kohelet« transliterieren.
  alternative: der Lehrer; der Prediger; der Versammler
  rationale: Die genaue Funktion und Nuance der Bezeichnung ist umstritten. Die Umschrift hält diese Frage offen und die Fußnote nennt geläufige traditionelle Wiedergaben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst knapper, rhythmischer Wiederholung. Die ungewöhnliche, aber verständliche Formel »Hauch der Hauche« erhält die hebräische Superlativkonstruktion und das zentrale Bild. Die Gedankenstrichsetzung markiert die zugespitzte Schlussaussage.
