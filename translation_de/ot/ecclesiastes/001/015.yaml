base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/015.yaml
  text: What is crooked cannot be made straight[b][a], and what is lacking cannot be counted.
translation:
  language: de
  text: Was krumm ist, kann nicht gerade gemacht werden,[a] und was fehlt, kann nicht gezählt werden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Was verdreht ist, kann nicht gerade gemacht werden.«'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Der Mangel kann nicht gezählt werden.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעֻוָּת
  choice: was krumm ist
  rationale: Das passive Partizip von עוה bezeichnet etwas Gekrümmtes, Verdrehtes oder Verformtes. »Was krumm ist« bewahrt den bildhaften, sprichwortartigen Charakter und klingt im modernen Deutschen natürlich.
- source_word: לֹא יוּכַל
  choice: kann nicht
  rationale: Die Konstruktion drückt Unvermögen beziehungsweise Unmöglichkeit aus. Mit den folgenden passiven Infinitivkonstruktionen ist »kann nicht … werden« die natürliche deutsche Wiedergabe.
- source_word: לִתְקֹן
  choice: gerade gemacht werden
  rationale: תקן bedeutet hier, etwas gerade zu machen oder in Ordnung zu bringen. Die Formulierung hält das konkrete Bild des Krummen fest, ohne es vorschnell als moralisches oder gesellschaftliches »In-Ordnung-Bringen« auszulegen.
- source_word: וְחֶסְרוֹן
  choice: und was fehlt
  rationale: חֶסְרוֹן bezeichnet Mangel, Fehlendes oder Defizit. Die substantivierte Formulierung »was fehlt« bildet im Deutschen eine klare Parallele zu »was krumm ist«.
- source_word: לְהִמָּנוֹת
  choice: gezählt werden
  rationale: Der Nifal-Infinitiv von מנה bedeutet »gezählt« oder »nummeriert werden«. »Gezählt werden« ist die unmittelbarste und idiomatischste deutsche Wiedergabe und erhält die zugespitzte Aussage, dass Fehlendes keiner Zählung zugänglich ist.
theological_decisions: []
translation_notes:
  register: Moderne, schlichte und würdige Spruchsprache. Die parallele Satzstruktur und das konkrete Bild von »krumm« und »gerade« bleiben erhalten; die Aussage wird nicht auf eine bestimmte moralische oder theologische Deutung verengt.
