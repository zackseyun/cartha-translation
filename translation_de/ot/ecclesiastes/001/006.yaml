source:
  edition: WLC
  text: הוֹלֵךְ֙ אֶל דָּר֔וֹם וְ/סוֹבֵ֖ב אֶל צָפ֑וֹן סוֹבֵ֤ב סֹבֵב֙ הוֹלֵ֣ךְ הָ/ר֔וּחַ וְ/עַל סְבִיבֹתָ֖י/ו שָׁ֥ב הָ/רֽוּחַ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/006.yaml
  text: Going toward the south and turning toward the north[a], turning and turning goes the wind[b]; and on its circuits the wind returns.
translation:
  language: de
  text: Der Wind[a] zieht nach Süden und wendet sich nach Norden. Kreisend, kreisend zieht der Wind dahin; auf seinen Bahnen[b] kehrt der Wind zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort רוּחַ kann auch „Geist“ oder „Atem“ bedeuten; im Zusammenhang ist hier „Wind“ gemeint.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „auf seinen Kreisen“ beziehungsweise „auf seinen Umläufen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלֵךְ
  choice: zieht / zieht … dahin
  rationale: Das Qal-Partizip von הלך bezeichnet fortdauernde Bewegung. „Ziehen“ ist für die Bewegung des Windes natürlich, ohne das spezifischere „wehen“ in den Text einzutragen.
- source_word: דָּרוֹם / צָפוֹן
  choice: Süden / Norden
  rationale: Die Richtungsangaben mit אֶל werden schlicht mit „nach Süden“ und „nach Norden“ wiedergegeben.
- source_word: וְסוֹבֵב / סוֹבֵב סֹבֵב
  choice: wendet sich / kreisend und immer weiter kreisend
  rationale: סבב bezeichnet Wenden, Drehen oder Kreisen. Die Formulierung bewahrt sowohl die Bewegungsrichtung als auch die nachdrückliche Wiederholung des Hebräischen in verständlichem Deutsch.
- source_word: הָרוּחַ
  choice: der Wind
  rationale: רוּחַ kann „Wind“, „Geist“ oder „Atem“ bedeuten. Im Zusammenhang der beobachtbaren Naturkreisläufe in Prediger 1,5–7 ist „Wind“ die naheliegende Bedeutung.
- source_word: סְבִיבֹתָיו
  choice: seinen Bahnen
  rationale: Das Wort bezeichnet Umläufe, Wendungen oder kreisende Wege. „Bahnen“ vermittelt die wiederkehrenden Wege des Windes in natürlichem Deutsch; die mögliche Wiedergabe „Kreisen“ wird in einer Fußnote genannt.
- source_word: שָׁב
  choice: kehrt … zurück
  rationale: שוב bedeutet „zurückkehren“ oder „umkehren“ und trägt hier zum Bild des fortwährenden Kreislaufs bei.
theological_decisions:
- issue: Bedeutung von רוּחַ
  choice: 'meteorologisch: „Wind“'
  alternative: „Geist“ oder „Atem“
  rationale: Der unmittelbare Zusammenhang nennt die wiederkehrenden Bewegungen von Sonne, Wind und Wasserläufen. Daher ist die meteorologische Lesart vorzuziehen, ohne die lexikalische Mehrdeutigkeit zu verschweigen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, rhythmischem Klang. Die Wiederholung von סוֹבֵב wird nicht geglättet, sondern durch „kreisend und immer weiter kreisend“ als fortdauernde Bewegung hörbar gemacht. Das zweimalige הָרוּחַ bleibt durch die Wiederholung von „der Wind“ erhalten.
