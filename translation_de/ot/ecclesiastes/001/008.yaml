id: ECC.1.8
reference: Ecclesiastes 1:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כָּל הַ/דְּבָרִ֣ים יְגֵעִ֔ים לֹא יוּכַ֥ל אִ֖ישׁ לְ/דַבֵּ֑ר לֹא תִשְׂבַּ֥ע עַ֨יִן֙ לִ/רְא֔וֹת וְ/לֹא תִמָּלֵ֥א אֹ֖זֶן מִ/שְּׁמֹֽעַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/008.yaml
  text: All things are wearisome; a man cannot speak of it. The eye is not satisfied with seeing, nor is the ear filled with hearing.
translation:
  language: de
  text: Alle Dinge sind ermüdend[a]; kein Mensch kann es in Worte fassen.[b] Das Auge wird vom Sehen nicht satt, und das Ohr wird vom Hören nicht voll.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Alle Worte sind ermüdend«; das hebräische Wort kann »Worte«, »Angelegenheiten« oder »Dinge« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Kein Mensch kann davon reden.« Das Hebräische kann bedeuten, dass niemand die Sache vollständig ausdrücken kann, oder dass sie zu ermüdend ist, um sie zu beschreiben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַדְּבָרִים
  choice: Alle Dinge
  rationale: דְּבָרִים kann »Worte«, »Angelegenheiten« oder »Dinge« bedeuten. Im Zusammenhang der umfassenden Kreisläufe bezeichnet »Dinge« am ehesten die Gesamtheit des Erlebten, während die Mehrdeutigkeit in einer Fußnote erhalten bleibt.
- source_word: יְגֵעִים
  choice: sind ermüdend
  rationale: Das Adjektiv bezeichnet etwas Mühsames oder Ermüdendes. »Ermüdend« gibt die Wirkung auf den Menschen natürlich wieder, ohne die Aussage zu verstärken.
- source_word: לֹא יוּכַל אִישׁ לְדַבֵּר
  choice: kein Mensch kann es in Worte fassen
  rationale: Die Wendung kann bloßes Sprechen oder das angemessene Ausdrücken des zuvor Genannten meinen. »In Worte fassen« ist im Deutschen idiomatisch und lässt den Gedanken der Unerschöpflichkeit erkennen; »es« nimmt den Gesamtgegenstand kollektiv auf.
- source_word: לֹא תִשְׂבַּע עַיִן לִרְאוֹת
  choice: Das Auge wird vom Sehen nicht satt
  rationale: שׂבע bedeutet »satt werden, gesättigt sein«. Die deutsche Wendung bewahrt das konkrete Bild und den generischen Singular.
- source_word: וְלֹא תִמָּלֵא אֹזֶן מִשְּׁמֹעַ
  choice: und das Ohr wird vom Hören nicht voll
  rationale: מלא bedeutet »voll sein/werden«. »Nicht voll« bewahrt bewusst den lexikalischen Unterschied zum vorangehenden »nicht satt« sowie den generischen Singular.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Prediger-Ton. Die parallelen Körperbilder »Auge« und »Ohr« sowie der Unterschied zwischen »satt« und »voll« bleiben erhalten.
