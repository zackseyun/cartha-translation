  text: מַה שֶּֽׁ/הָיָה֙ ה֣וּא שֶׁ/יִּהְיֶ֔ה וּ/מַה שֶׁ/נַּֽעֲשָׂ֔ה ה֖וּא שֶׁ/יֵּעָשֶׂ֑ה וְ/אֵ֥ין כָּל חָדָ֖שׁ תַּ֥חַת הַ/שָּֽׁמֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/009.yaml
  text: What has been is what will be[a], and what has been done is what will be done; and there is nothing new under the sun.
translation:
  language: de
  text: Was gewesen ist, das wird sein[a], und was getan worden ist, das wird getan werden; nichts Neues gibt es unter der Sonne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Was war, das wird sein.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה שֶּׁהָיָה
  choice: Was gewesen ist
  rationale: Die substantivierte Relativkonstruktion bezeichnet das, was bereits gewesen ist. Das deutsche Perfekt bewahrt den Rückblick und passt zum sprichwortartigen Zusammenhang.
- source_word: הוּא שֶׁיִּהְיֶה
  choice: das wird sein
  rationale: Das aufnehmende „das“ bildet die hebräische Gleichsetzung knapp und natürlich ab, ohne ein im Ausgangstext nicht ausdrücklich vorhandenes „wieder“ oder „dasselbe“ einzufügen.
- source_word: וּמַה שֶׁנַּעֲשָׂה
  choice: und was getan worden ist
  rationale: Das Nifal von עשה wird passiv-resultativ wiedergegeben und hält die Parallelität zum ersten Satzglied aufrecht.
- source_word: הוּא שֶׁיֵּעָשֶׂה
  choice: das wird getan werden
  rationale: Die passive Form und der Zukunftsbezug des Nifal-Imperfekts werden bewahrt; die Wiedergabe ist enger am Hebräischen als das allgemeinere „wird geschehen“.
- source_word: וְאֵין כָּל חָדָשׁ
  choice: nichts Neues gibt es
  rationale: Die verneinte Existenzkonstruktion wird idiomatisch und mit ihrer umfassenden Aussagekraft wiedergegeben. Die Voranstellung betont die pointierte Schlussfolgerung.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: unter der Sonne
  rationale: Die feste Wendung des Predigerbuches bezeichnet den Bereich des beobachtbaren irdischen Lebens und wird in ihrer vertrauten, transparenten Form erhalten.
theological_decisions:
- issue: Reichweite der Aussage innerhalb der Weltsicht des Predigerbuches
  choice: Die Aussage bleibt eine umfassend formulierte Beobachtung wiederkehrender Muster im irdischen Leben „unter der Sonne“.
  alternative: Eine uneingeschränkte metaphysische Behauptung, dass in keinerlei Hinsicht jemals etwas neu sein könne.
  rationale: Die Wendung „unter der Sonne“ rahmt die Aussage als Beobachtung der menschlichen Lebenswelt. Die Übersetzung bewahrt zugleich den universalen rhetorischen Nachdruck, ohne die Spannung erklärend aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper, sprichwortartiger Parallelstruktur. Das semantisch naheliegende, aber nicht ausdrücklich gesetzte „wieder“ wird vermieden; das Semikolon markiert den abschließenden Sinnspruch.
