source:
  edition: WLC
  text: כִּ֛י בְּ/רֹ֥ב חָכְמָ֖ה רָב כָּ֑עַס וְ/יוֹסִ֥יף דַּ֖עַת יוֹסִ֥יף מַכְאֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/018.yaml
  text: For with much wisdom comes much vexation[b][a], and he who increases knowledge increases pain.
translation:
  language: de
  text: Denn mit viel Weisheit kommt viel Verdruss[a], und wer sein Wissen vermehrt, vermehrt den Schmerz[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „viel Kummer“ beziehungsweise „viel Ärger“. Das hebräische Wort כָּעַס kann Verdruss, Kummer oder innere Erregung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Und wer Wissen hinzufügt, fügt Schmerz hinzu.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende Aussage und wird im Deutschen natürlich mit „Denn“ wiedergegeben.
- source_word: בְּרֹב חָכְמָה
  choice: mit viel Weisheit
  rationale: Die Wendung bezeichnet den Umstand beziehungsweise das Maß, mit dem der folgende Verdruss einhergeht. „Mit viel Weisheit“ wahrt den Zusammenhang und klingt idiomatisch.
- source_word: רָב כָּעַס
  choice: kommt viel Verdruss
  rationale: כָּעַס umfasst hier Verdruss, Kummer und innere Erregung. „Verdruss“ passt zum nachdenklichen Ton des Predigers; „kommt“ macht die im knappen hebräischen Nominalsatz ausgedrückte Zuordnung im Deutschen verständlich.
- source_word: דַּעַת
  choice: Wissen
  rationale: „Wissen“ ist die direkte, allgemein verständliche Wiedergabe und hält die begriffliche Unterscheidung zu חָכְמָה („Weisheit“) aufrecht.
- source_word: וְיוֹסִיף דַּעַת יוֹסִיף מַכְאוֹב
  choice: und wer sein Wissen vermehrt, vermehrt den Schmerz
  rationale: Die Wiederholung von יסף wird durch die Wiederholung von „vermehrt“ bewahrt. Der Relativsatz gibt die sprichwortartige Aussage in natürlichem Deutsch wieder.
- source_word: מַכְאוֹב
  choice: Schmerz
  rationale: Das Wort kann körperlichen oder seelischen Schmerz bezeichnen. „Schmerz“ lässt diese Breite offen und bewahrt die Unterscheidung zu כָּעַס.
theological_decisions:
- issue: Das Verhältnis von Weisheit und Leiden
  choice: Die zugespitzte Aussage, dass wachsende Weisheit mit wachsendem Verdruss verbunden ist, bleibt uneingeschränkt stehen.
  alternative: Die Aussage durch eine Beschränkung auf rein menschliche oder gottferne Weisheit abmildern.
  rationale: Der hebräische Vers enthält keine solche ausdrückliche Einschränkung. Die Spannung zur sonstigen positiven Bewertung von Weisheit darf nicht durch eine interpretierende Ergänzung aufgelöst werden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knappem, sprichwortartigem Rhythmus. Die Wiederholung „vermehrt … vermehrt“ bildet die hebräische Parallelstruktur nach; „Verdruss“ wahrt den würdevollen Reflexionston, ohne die Bedeutungsbreite durch eine konfessionelle Deutung einzuengen.
