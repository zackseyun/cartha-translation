base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/016.yaml
  text: I said in my heart, saying, “I—look—I have become great and increased in wisdom beyond all who were before me over Jerusalem, and my heart has seen much wisdom and knowledge.”
translation:
  language: de
  text: 'In meinem Herzen sprach ich: »Ich – sieh! – bin groß geworden und habe Weisheit vermehrt, mehr als alle, die vor mir über Jerusalem waren; und mein Herz hat viel Weisheit und Erkenntnis erfahren.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דִּבַּרְתִּי אֲנִי עִם לִבִּי
  choice: Ich sagte mir
  rationale: Die hebräische Wendung bedeutet wörtlich, mit dem eigenen Herzen zu reden; im heutigen Deutschen gibt »ich sagte mir« den inneren Monolog natürlich und präzise wieder.
- source_word: הִנֵּה
  choice: Sieh doch
  rationale: Bewahrt den aufmerksamkeitslenkenden, selbstreflexiven Ausruf, ohne das heute altertümliche »siehe« zu verwenden.
- source_word: הִגְדַּלְתִּי וְהוֹסַפְתִּי חָכְמָה
  choice: Ich bin groß geworden und habe mehr Weisheit erworben
  rationale: Gibt sowohl das Großwerden als auch die Zunahme an Weisheit wieder; »erworben« klingt im Deutschen idiomatischer als »Weisheit vermehrt«.
- source_word: עַל כָּל אֲשֶׁר הָיָה לְפָנַי עַל יְרוּשָׁלִָם
  choice: als alle, die vor mir über Jerusalem herrschten
  rationale: Das knappe hebräische »über Jerusalem gewesen sein« bezeichnet im königlichen Erzählrahmen am ehesten die Vorgänger in der Herrschaft. Die Vergleichsbedeutung von עַל wird mit »mehr … als« ausgedrückt.
- source_word: לִבִּי רָאָה
  choice: mein Verstand hat … erfahren
  rationale: לֵב bezeichnet hier das innere Erkenntnisvermögen, nicht primär Gefühle. »Erfahren« bewahrt das bildhafte Wahrnehmen besser als bloßes »besitzen«.
- source_word: חָכְמָה וָדָעַת
  choice: Weisheit und Erkenntnis
  rationale: Die traditionelle und sachlich passende Begriffspaarung unterscheidet praktische Einsicht von Wissen beziehungsweise Erkenntnis.
theological_decisions:
- issue: Identität und Herrschaftsstellung des Sprechers
  choice: Die Formulierung »über Jerusalem herrschten« wird verwendet, ohne den Sprecher ausdrücklich mit Salomo gleichzusetzen.
  alternative: »die vor mir in Jerusalem waren«
  rationale: Der Kontext präsentiert eine königliche Stimme, doch der Vers nennt keinen Eigennamen. Die Übersetzung wahrt diese Spannung und macht lediglich die wahrscheinlich implizierte Herrschaftsbeziehung deutlich.
translation_notes:
  register: 'Modernes, würdevolles Standarddeutsch. Der innere Monolog wird idiomatisch formuliert; die markierte Selbstbetonung des Hebräischen bleibt durch »Sieh doch: Ich« hörbar. Keine konfessionell geprägte Terminologie.'
