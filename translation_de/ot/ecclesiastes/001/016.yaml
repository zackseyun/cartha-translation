revisions:
- from: 'Ich sagte mir: »Sieh doch: Ich bin groß geworden und habe mehr Weisheit erworben als alle, die vor mir über Jerusalem herrschten; mein Verstand hat viel Weisheit und Erkenntnis erfahren.«'
  to: 'In meinem Herzen sprach ich: »Ich – sieh! – bin groß geworden und habe Weisheit vermehrt, mehr als alle, die vor mir über Jerusalem waren; und mein Herz hat viel Weisheit und Erkenntnis erfahren.«'
  rationale: Die Revision erhält die hebräische Herz-Terminologie, die emphatische Selbstbezeichnung und die nicht weiter spezifizierte Aussage über die Vorgänger »über Jerusalem«. »Erfahren« vermittelt für das bildhafte »hat gesehen« idiomatisch ein umfassendes Erkennen, ohne den Erkenntnischarakter von Weisheit und Erkenntnis auf bloßen Besitz zu reduzieren.
