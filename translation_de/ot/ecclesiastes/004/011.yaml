  text: גַּ֛ם אִם יִשְׁכְּב֥וּ שְׁנַ֖יִם וְ/חַ֣ם לָ/הֶ֑ם וּ/לְ/אֶחָ֖ד אֵ֥יךְ יֵחָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/011.yaml
  text: Again[a], if two lie down together, they keep warm; but how can one keep warm alone?
translation:
  language: de
  text: Auch wenn zwei zusammenliegen, wird ihnen warm; doch wie soll einem allein warm werden?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם
  choice: Auch
  rationale: Leitet eine weitere stützende Beobachtung in der Folge ein und gibt die additive Bedeutung natürlich wieder.
- source_word: אִם
  choice: wenn
  rationale: Die Aussage beschreibt hier einen typischen Fall; deutsches „wenn“ bewahrt die konditionale beziehungsweise situative Offenheit.
- source_word: יִשְׁכְּבוּ שְׁנַיִם
  choice: wenn zwei zusammenliegen
  rationale: שׁכב bedeutet „liegen“ beziehungsweise „sich hinlegen“. „Zusammenliegen“ macht den für die Wärme entscheidenden räumlichen Zusammenhang deutlich, ohne ausdrücklich „schlafen“ einzutragen.
- source_word: וְחַם לָהֶם
  choice: wird ihnen warm
  rationale: Die unpersönliche deutsche Wendung entspricht der hebräischen Konstruktion „Wärme ist/wird ihnen zuteil“ und bewahrt zugleich den möglichen inchoativen Sinn.
- source_word: וּלְאֶחָד
  choice: doch ... einem allein
  rationale: „Doch“ bringt den sachlichen Gegensatz zwischen zwei und einem idiomatisch zum Ausdruck. „Allein“ verdeutlicht im Deutschen die im Kontrast enthaltene Bedeutung.
- source_word: אֵיךְ יֵחָם
  choice: wie soll ... warm werden?
  rationale: Gibt die rhetorische Frage und den möglichen inchoativen Sinn des Verbs natürlich wieder, ohne eine absolute Unmöglichkeit ausdrücklich festzulegen.
