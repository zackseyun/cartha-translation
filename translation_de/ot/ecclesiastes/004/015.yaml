revisions:
- from: Ich sah alle Lebenden, die unter der Sonne umhergehen, zusammen mit dem zweiten jungen Mann[a], der an seine Stelle treten würde.
  to: Ich sah alle Lebenden, die unter der Sonne umhergehen, zusammen mit dem zweiten jungen Mann[a], der an die Stelle des anderen treten würde.
  rationale: Die einzige notwendige Änderung betrifft die missverständliche Referenz von „seine“ in der deutschen Hauptfassung. „Des anderen“ macht deutlich, dass der junge Mann eine andere Person ersetzt, ohne diese Person – anders als eine Ergänzung wie „den König“ – über den Wortlaut des Verses hinaus ausdrücklich zu identifizieren. Die Fußnote wird minimal geglättet und bewahrt die textlich gebotene Zurückhaltung.
