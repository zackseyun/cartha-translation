  text: רָאִ֨יתִי֙ אֶת כָּל הַ֣/חַיִּ֔ים הַֽ/מְהַלְּכִ֖ים תַּ֣חַת הַ/שָּׁ֑מֶשׁ עִ֚ם הַ/יֶּ֣לֶד הַ/שֵּׁנִ֔י אֲשֶׁ֥ר יַעֲמֹ֖ד תַּחְתָּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/015.yaml
  text: I saw all the living[a], those walking under the sun, with the second youth who would stand in his place.
translation:
  language: de
  text: Ich sah alle Lebenden, die unter der Sonne umhergehen, zusammen mit dem zweiten jungen Mann[a], der an die Stelle des anderen treten würde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit dem zweiten Kind“ beziehungsweise „mit dem zweiten Jugendlichen“. Gemeint sein kann ein Nachfolger, der den bisherigen Herrscher ablöst.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתִי
  choice: Ich sah
  rationale: Das Qal-Perfekt der 1. Person Singular führt eine persönliche Beobachtung des Predigers ein; „Ich sah“ ist direkt und idiomatisch.
- source_word: כָּל הַחַיִּים
  choice: alle Lebenden
  rationale: Die knappe substantivische Wendung entspricht dem Hebräischen und bezeichnet die lebenden Menschen.
- source_word: הַמְהַלְּכִים
  choice: die … umhergehen
  rationale: Das Partizip beschreibt die Lebenden in ihrer fortdauernden Bewegung; „umhergehen“ ist im Deutschen natürlicher als das wörtliche „gehen“ und vermeidet eine unnötig technische Formulierung.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: unter der Sonne
  rationale: Die für das Buch Prediger kennzeichnende Wendung wird wörtlich und wiedererkennbar beibehalten.
- source_word: עִם
  choice: zusammen mit
  rationale: Die Präposition bedeutet grundsätzlich „mit“. Die Wiedergabe lässt offen, ob bloße Begleitung oder eine Zugehörigkeit beziehungsweise Parteinahme gemeint ist.
- source_word: הַיֶּלֶד הַשֵּׁנִי
  choice: dem zweiten jungen Mann
  rationale: יֶלֶד kann ein Kind, einen Jugendlichen oder jungen Mann bezeichnen; der politische Zusammenhang legt „junger Mann“ nahe. „Der zweite“ bewahrt die auffällige Ordnungszahl, ohne sie bereits als „Nachfolger“ auszulegen.
- source_word: אֲשֶׁר יַעֲמֹד
  choice: der … treten würde
  rationale: Das Imperfekt bezeichnet hier aus der Perspektive der Beobachtung ein bevorstehendes Eintreten in eine Stellung; „würde“ gibt dieses Zukunftsverhältnis natürlich wieder.
- source_word: תַּחְתָּיו
  choice: an seine Stelle
  rationale: Wörtlich steht „unter ihm“; im Zusammenhang eines Herrschaftswechsels bezeichnet die Wendung idiomatisch das Einnehmen der Stellung eines anderen.
theological_decisions:
- issue: Identität und Rolle des „zweiten jungen Mannes“
  choice: Die Hauptfassung bezeichnet ihn wörtlich als „den zweiten jungen Mann“ und sagt lediglich, dass er an die Stelle des vorherigen Herrschers treten würde.
  alternative: „der nächste junge Mann“ oder ausdrücklich „der Nachfolger“
  rationale: Der Vers lässt die genaue Beziehung zwischen dem jungen Mann, dem Herrscher und den Lebenden offen. Eine ausdrückliche Deutung als politischer Nachfolger wäre plausibel, würde die Mehrdeutigkeit aber stärker auflösen als der hebräische Text.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die charakteristische Wendung „unter der Sonne“ und die ungewöhnliche Bezeichnung „der zweite junge Mann“ bleiben erhalten; die Syntax wird nur so weit geglättet, dass der Vers für heutige Leser verständlich bleibt.
