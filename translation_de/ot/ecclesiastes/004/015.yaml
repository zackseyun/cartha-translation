    rationale: Das Possessivpronomen kann nach deutscher Syntax auf den unmittelbar vorher genannten „zweiten jungen Mann“ bezogen werden. Gemeint ist im Kontext hingegen, dass dieser junge Mann die Stellung eines anderen einnimmt. Die hebräische Referenz soll nicht weiter spezifiziert, aber im Deutschen verständlich formuliert werden.
