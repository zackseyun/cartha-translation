translation:
  language: de
  text: Dann wandte ich mich um und sah etwas Nichtiges unter der Sonne:[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wieder wandte ich mich um und sah etwas Nichtiges unter der Sonne.“'
    reason: lexical_alternative
  - marker: b
    text: Hebräisch hebel, ein Schlüsselwort im Predigerbuch; je nach Zusammenhang auch mit „Hauch“, „Dunst“, „Vergänglichkeit“ oder „Vergeblichkeit“ wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְתִּי
  choice: Dann wandte ich mich um
  rationale: שׁוב bedeutet wörtlich „umkehren/zurückkehren“, dient im Predigerbuch aber häufig als Übergang zu einer neuen Beobachtung. Die Formulierung bewahrt das konkrete Bild und klingt zugleich natürlich; die mögliche Bedeutung „wieder“ wird in einer Fußnote genannt.
- source_word: אֲנִי
  choice: ich
  rationale: Das selbstständige Pronomen hebt das Subjekt im Hebräischen hervor. Im Deutschen ist „ich“ bereits notwendig; ein zusätzliches „ich selbst“ wäre hier unnötig schwerfällig.
- source_word: וָאֶרְאֶה
  choice: und sah
  rationale: ראה ist das gewöhnliche Verb für „sehen“. „Sah“ bleibt näher am Ausgangstext als das stärker deutende „beobachtete“.
- source_word: הֶבֶל
  choice: etwas Nichtiges
  rationale: הבל bezeichnet wörtlich einen Hauch oder Dunst und entfaltet im Predigerbuch die Bedeutungen Vergänglichkeit, Flüchtigkeit und Vergeblichkeit. „Etwas Nichtiges“ passt hier idiomatisch zu „sah“, ohne den Ausdruck einseitig als völlige Sinnlosigkeit festzulegen.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: unter der Sonne
  rationale: Die feste Wendung bezeichnet im Predigerbuch den irdischen Lebensbereich. „Unter der Sonne“ ist die direkte und im Deutschen geläufige Entsprechung.
