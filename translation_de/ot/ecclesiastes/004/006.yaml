  text: ט֕וֹב מְלֹ֥א כַ֖ף נָ֑חַת מִ/מְּלֹ֥א חָפְנַ֛יִם עָמָ֖ל וּ/רְע֥וּת רֽוּחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/006.yaml
  text: Better is a handful with rest than two handfuls with toil and a striving after wind[a][b].
translation:
  language: de
  text: Besser eine Handvoll Ruhe als beide Hände voll Mühe und Haschen nach Wind.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Gelassenheit«.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: »und ein Haschen/Streben nach Wind«; traditionell auch: »und Quälerei des Geistes«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Besser
  rationale: Das wertende Adjektiv eröffnet einen sprichwortartigen Vergleich; im Deutschen ist die knappe Ellipse natürlich und prägnant.
- source_word: מְלֹא כַף
  choice: eine Handvoll
  rationale: Die Wendung bezeichnet wörtlich die Fülle einer Handfläche; »eine Handvoll« gibt das Maß idiomatisch und quellennah wieder.
- source_word: נָחַת
  choice: Ruhe
  rationale: Das Substantiv bezeichnet Ruhe, Gelassenheit oder stilles Behagen und steht hier im Gegensatz zu mühseligem Erwerbsstreben.
- source_word: מִמְלֹא חָפְנַיִם
  choice: als beide Hände voll
  rationale: Die Präposition markiert den Vergleich; die Dualform bezeichnet zwei hohle Hände. Diese Wiedergabe bewahrt das anschauliche Gegenbild zur einen Handvoll.
- source_word: עָמָל
  choice: Mühe
  rationale: Das Wort umfasst belastende Arbeit und die damit verbundene Plage; »Mühe« ist im Kontext natürlich und bewahrt diese Bedeutungsbreite.
- source_word: וּרְעוּת רוּחַ
  choice: und ein Haschen nach Wind
  rationale: Die wiederkehrende Metapher bezeichnet ein vergebliches, nicht greifbares Streben. »Haschen nach Wind« bleibt bildhaft und lässt die genaue Nuance der seltenen Nominalform offen.
theological_decisions:
- issue: Deutung von רְעוּת רוּחַ
  choice: Haschen nach Wind
  alternative: Quälerei des Geistes
  rationale: Der Wind wird als Gegenstand eines vergeblichen Strebens verstanden; eine psychologische oder anthropologische Festlegung auf den menschlichen Geist wird nicht in den Text eingetragen.
translation_notes:
  register: Knappe, sprichwortartige Syntax in modernem, würdigem Standarddeutsch. Die Gegenüberstellung von einer Handvoll und beiden vollen Händen bleibt anschaulich erhalten.
