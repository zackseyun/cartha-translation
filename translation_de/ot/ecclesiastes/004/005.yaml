  terminology: „Tor“ ist für כְּסִיל im Kontext der Weisheitsliteratur treffend. „Eigenes Fleisch“ gibt בְּשָׂרוֹ angemessen wieder, ohne die Metapher in eine einzige Auslegung aufzulösen.
