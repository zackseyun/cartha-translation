  text: The fool folds his hands and eats his own flesh[a][b].
translation:
  language: de
  text: Der Tor verschränkt seine Hände[a] und verzehrt sein eigenes Fleisch.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „schließt seine Hände zusammen“; die Geste kann Untätigkeit ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: Ein Bild dafür, dass der Tor sich selbst zugrunde richtet; die genaue Ausgestaltung des Bildes bleibt offen.
    reason: metaphor_explanation
lexical_decisions:
- source_word: הַכְּסִיל
  choice: der Tor
  rationale: כְּסִיל bezeichnet in der Weisheitsliteratur einen moralisch und geistig törichten Menschen. „Der Tor“ ist im Deutschen eine geläufige, würdige Wiedergabe mit sprichwörtlichem Klang.
- source_word: חֹבֵק אֶת יָדָיו
  choice: legt die Hände in den Schoß
  rationale: חֹבֵק bedeutet wörtlich „umschließt/verschränkt“. In Verbindung mit den Händen zeichnet es das Bild untätiger Muße. Die deutsche Wendung gibt dieses Bild natürlich wieder, ohne seine Bedeutung im Haupttext auszudeuten.
- source_word: וְאֹכֵל
  choice: und verzehrt
  rationale: Das Partizip führt die allgemeingültige sprichwörtliche Aussage fort. „Verzehrt“ bewahrt sowohl das Bild des Essens als auch dessen selbstzerstörerische Schärfe.
- source_word: בְּשָׂרוֹ
  choice: sein eigenes Fleisch
  rationale: בָּשָׂר bedeutet wörtlich „Fleisch“. Die konkrete Metapher bleibt erhalten; „eigenes“ verdeutlicht die selbstbezügliche Wirkung des Possessivsuffixes.
theological_decisions:
- issue: Bildhafte Bedeutung von „sein eigenes Fleisch verzehren“
  choice: Die wörtliche, drastische Metapher bleibt im Haupttext als Bild selbstzerstörerischer Torheit beziehungsweise Untätigkeit erhalten.
  alternative: 'Deutend übersetzen: „richtet sich selbst zugrunde“ oder „zehrt sich selbst auf“.'
  rationale: Der hebräische Text erklärt das Bild nicht abstrakt. Seine Beibehaltung wahrt die bildhafte Offenheit und vermeidet es, die Ursache ausschließlich auf Faulheit oder ausschließlich auf Torheit festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knappem, sprichwörtlichem und würdigem Ton. Die traditionelle Weisheitsbezeichnung „Tor“ und die drastische Körpermetapher werden bewahrt.
