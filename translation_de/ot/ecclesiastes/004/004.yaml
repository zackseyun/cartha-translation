base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/004.yaml
  text: And I saw that all labor and all skillful work come from a man's envy of his neighbor[c][b][a]. This too is vanity and a chasing after wind.
translation:
  language: de
  text: Und ich sah, dass alle Mühe und alles Können bei der Arbeit[a] aus dem Neid eines Menschen auf seinen Mitmenschen[b] hervorgehen. Auch das ist nichtig und ein Haschen nach Wind.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »aller Erfolg bei der Arbeit«; das hebräische Wort כִּשְׁרוֹן kann Können und Tüchtigkeit oder den daraus entstehenden Erfolg bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »der Neid eines Mannes auf seinen Mitmenschen«. Die männliche Einzahl ist wahrscheinlich stellvertretend gemeint.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »ein Streben nach Wind«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָמָל
  choice: Mühe
  rationale: Das Wort bezeichnet im Prediger häufig die beschwerliche menschliche Arbeit und Anstrengung. »Mühe« bewahrt diesen belastenden Beiklang.
- source_word: כִּשְׁרוֹן הַמַּעֲשֶׂה
  choice: Können bei der Arbeit
  rationale: כִּשְׁרוֹן kann sowohl Geschick und Befähigung als auch den daraus erwachsenden Erfolg bezeichnen. »Können bei der Arbeit« gibt den Kompetenzaspekt natürlich wieder, ohne die mögliche Bedeutung »Erfolg« auszuschließen; diese steht in der Fußnote.
- source_word: כִּי הִיא
  choice: dass … hervorgehen
  rationale: Die wörtlich knappe Nominalkonstruktion »denn sie ist« bezeichnet hier den Neid als antreibenden Ursprung. Die deutsche Formulierung macht diesen Zusammenhang verständlich, ohne ihn über das im Kontext Naheliegende hinaus auszudeuten.
- source_word: קִנְאַת
  choice: Neid
  rationale: Im Zusammenhang menschlicher Konkurrenz bezeichnet das Wort am ehesten den Neid, den der Erfolg oder das Können eines anderen hervorruft.
- source_word: אִישׁ מֵרֵעֵהוּ
  choice: eines Menschen auf den anderen
  rationale: Die singularische Wendung beschreibt repräsentativ das Konkurrenzverhältnis zwischen einzelnen Menschen. Diese Formulierung bleibt singularisch und klingt im modernen Deutschen natürlicher als »eines Mannes auf seinen Nächsten«.
- source_word: הֶבֶל
  choice: nichtig
  rationale: Das Leitwort des Predigerbuches umfasst Vergänglichkeit, Vergeblichkeit und Unbeständigkeit. »Nichtig« hält diese Bedeutungsbreite offen und bewahrt den würdevollen Ton.
- source_word: רְעוּת רוּחַ
  choice: ein Haschen nach Wind
  rationale: Die bildhafte Wendung beschreibt ein vergebliches Bemühen, den Wind zu ergreifen. »Haschen nach Wind« ist im Deutschen anschaulich und etabliert, ohne das Bild aufzulösen.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Ton. Die parallele Struktur »alle Mühe und alles Können« bleibt erhalten. Das für den Prediger zentrale הֶבֶל wird bewusst nicht auf »Sinnlosigkeit« verengt; die Fußnoten dokumentieren die wesentlichen lexikalischen Alternativen.
