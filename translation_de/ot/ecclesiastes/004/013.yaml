id: ECC.4.13
reference: Ecclesiastes 4:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: ט֛וֹב יֶ֥לֶד מִסְכֵּ֖ן וְ/חָכָ֑ם מִ/מֶּ֤לֶךְ זָקֵן֙ וּ/כְסִ֔יל אֲשֶׁ֛ר לֹא יָדַ֥ע לְ/הִזָּהֵ֖ר עֽוֹד־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/013.yaml
  text: Better is a poor but wise youth than an old and foolish king who no longer knows how to heed warning[a].
translation:
  language: de
  text: Besser ist ein armer, aber weiser junger Mensch als ein alter und törichter König, der sich nicht mehr warnen lässt[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der sich nicht mehr zurechtweisen lässt“; auch: „der keine Unterweisung mehr annimmt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב ... מִן
  choice: Besser ist ... als
  rationale: טוֹב steht mit dem vergleichenden מִן; die deutsche Vergleichskonstruktion gibt dies natürlich und genau wieder.
- source_word: יֶלֶד
  choice: junger Mensch
  rationale: Das Wort bezeichnet hier eine junge Person. „Junger Mensch“ wahrt den Gegensatz zum alten König, ohne das Alter unnötig auf ein Kind oder einen Erwachsenen einzugrenzen.
- source_word: מִסְכֵּן
  choice: arm
  rationale: Das Adjektiv bezeichnet Armut beziehungsweise eine niedrige soziale Stellung; „arm“ ist hier die knappste und natürlichste Wiedergabe.
- source_word: וְחָכָם
  choice: aber weise
  rationale: Die Konjunktion verbindet die Eigenschaften des jungen Menschen. Das deutsche „aber“ bringt den im Zusammenhang liegenden Gegensatz zwischen Armut und Weisheit idiomatisch zum Ausdruck.
- source_word: מֶלֶךְ זָקֵן וּכְסִיל
  choice: ein alter und törichter König
  rationale: Die Wiedergabe erhält sowohl den Alterskontrast als auch die für die Weisheitsliteratur typische moralisch-praktische Bedeutung von כְּסִיל.
- source_word: אֲשֶׁר לֹא יָדַע לְהִזָּהֵר עוֹד
  choice: der sich nicht mehr warnen lässt
  rationale: Die Formulierung gibt die mangelnde Bereitschaft oder Fähigkeit wieder, Warnung beziehungsweise Zurechtweisung anzunehmen. עוֹד in Verbindung mit der Verneinung wird als „nicht mehr“ wiedergegeben.
theological_decisions: []
