  source_fidelity: 'Die Übersetzung bildet die Vergleichskonstruktion טוֹב ... מִן mit „Besser ... als“ korrekt ab. „Ein armer, aber weiser junger Mensch“ wahrt die offene Altersbezeichnung יֶלֶד und den Gegensatz zum alten König. „Der sich nicht mehr warnen lässt“ gibt לֹא יָדַע לְהִזָּהֵר עוֹד angemessen wieder: Gemeint ist nicht bloß Vorsicht, sondern die fehlende Bereitschaft bzw. Fähigkeit, Warnung oder Zurechtweisung anzunehmen.'
