  text: And if someone overpowers one[a], two will stand against him; and a threefold cord is not quickly broken.
translation:
  language: de
  text: Und wenn jemand den Einzelnen überwältigt, werden die beiden ihm standhalten; und eine dreifach geflochtene Schnur[a] reißt nicht so schnell.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine dreisträngige Schnur“. Das Hebräische beschreibt eine Schnur, die dreifach gemacht ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Und wenn
  rationale: Bewahrt den fortführenden Anschluss durch וְ und leitet zugleich die Bedingung natürlich ein.
- source_word: יִתְקְפוֹ הָאֶחָד
  choice: jemand den Einzelnen überwältigt
  rationale: תקף bezeichnet das Starksein gegen jemanden beziehungsweise das Überwältigen. Das unbestimmte „jemand“ gibt das im Hebräischen nicht ausdrücklich genannte Subjekt wieder; „den Einzelnen“ verweist auf den alleinstehenden Menschen des Zusammenhangs.
- source_word: הַשְּׁנַיִם יַעַמְדוּ נֶגְדּוֹ
  choice: können die beiden ihm standhalten
  rationale: Die konkrete Wendung „gegen ihn stehen“ wird im Deutschen idiomatisch mit „ihm standhalten“ wiedergegeben. „Die beiden“ erhält den zahlenmäßigen Gegensatz zum Einzelnen.
- source_word: וְהַחוּט הַמְשֻׁלָּשׁ
  choice: und eine dreifach gelegte Schnur
  rationale: חוּט kann Faden oder Schnur bedeuten; für das Bild der Festigkeit passt „Schnur“. מְשֻׁלָּשׁ beschreibt sie als dreifach gemacht, ohne zwingend festzulegen, ob drei Stränge gemeint sind.
- source_word: לֹא בִמְהֵרָה יִנָּתֵק
  choice: reißt nicht so schnell
  rationale: בִמְהֵרָה bedeutet „schnell“; der Nifal von נתק bezeichnet hier das Auseinanderreißen beziehungsweise Reißen einer Schnur. „Nicht so schnell“ ist natürlich und bleibt näher am zeitlichen Ausdruck als „nicht leicht“.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Sprichwortsprache. Die Zahlenfolge vom Einzelnen über die beiden zur dreifach gelegten Schnur bleibt deutlich; die mögliche Deutung von מְשֻׁלָּשׁ als „dreisträngig“ wird nicht in den Haupttext gezwungen, sondern in der Fußnote erhalten.
