  text: כִּֽי מִ/בֵּ֥ית הָ/סוּרִ֖ים יָצָ֣א לִ/מְלֹ֑ךְ כִּ֛י גַּ֥ם בְּ/מַלְכוּת֖/וֹ נוֹלַ֥ד רָֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/014.yaml
  text: For he came out from the house of prisoners to reign[b][a], though even in his kingdom he had been born poor.
translation:
  language: de
  text: Denn aus dem Gefängnis kam er heraus, um König zu werden[a]; obwohl er sogar in seinem Königtum arm geboren worden war.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »aus dem Haus der Gefangenen«. Oder: »um zu herrschen«.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort für »Königtum« kann auch »Königreich« oder »Herrschaftszeit« bedeuten. Die genaue Beziehung dieser Wendung zu »arm geboren« bleibt im Hebräischen knapp und auslegungsbedürftig.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֵּית הָסוּרִים
  choice: aus dem Haus der Gefangenen
  rationale: Gibt die hebräische Wendung wörtlich und verständlich wieder; das glattere »aus dem Gefängnis« steht in der Fußnote.
- source_word: יָצָא
  choice: kam er heraus
  rationale: Bewahrt das konkrete Bild des Herauskommens aus der Gefangenschaft und klingt im Deutschen natürlich.
- source_word: לִמְלֹךְ
  choice: um König zu werden
  rationale: Der Infinitiv von מלך kann »König sein/herrschen« bedeuten; im Zusammenhang bezeichnet er den Übergang zur Königsherrschaft.
- source_word: גַּם
  choice: sogar
  rationale: Gibt die verstärkende Funktion der Partikel in der zweiten Aussage wieder.
- source_word: בְּמַלְכוּתוֹ
  choice: in seinem Königreich
  rationale: Bewahrt die räumlich-politische Lesart; die ebenfalls mögliche zeitliche Bedeutung »während seiner Herrschaft« wird in der Fußnote genannt.
- source_word: נוֹלַד
  choice: geboren worden war
  rationale: Das Plusquamperfekt macht im Deutschen deutlich, dass seine Geburt vor seinem Aufstieg zum König lag.
- source_word: רָשׁ
  choice: arm
  rationale: Direkte, allgemein verständliche Wiedergabe des hebräischen Wortes für einen Armen oder Bedürftigen.
- source_word: כִּי ... כִּי
  choice: Denn ... obwohl
  rationale: Das erste כִּי erläutert den vorausgehenden Gedanken; das zweite lässt sich im Kontext konzessiv verstehen, ohne die Spannung der Aussage aufzulösen.
theological_decisions:
- issue: Bezug und zeitliche Einordnung von בְּמַלְכוּתוֹ
  choice: »in seinem Königreich« als Haupttext
  alternative: »während seiner Herrschaft«
  rationale: Das hebräische מַלְכוּת kann Königreich, Königtum oder Herrschaftszeit bezeichnen. Der Haupttext erhält die konkrete Lesart, während die zeitliche Alternative ausdrücklich dokumentiert wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche hebräische Wendung »Haus der Gefangenen« bleibt im Haupttext erhalten; Alternativen und die Mehrdeutigkeit von מַלְכוּת werden in Fußnoten kenntlich gemacht.
