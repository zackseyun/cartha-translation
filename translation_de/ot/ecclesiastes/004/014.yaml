  source_fidelity: Der Sinn des ersten Satzteils ist zutreffend wiedergegeben. Im zweiten Satzteil ist בְּמַלְכוּתוֹ jedoch semantisch offen (Königtum, Königreich oder Herrschaftszeit). Die Formulierung »in seinem Königreich ... geboren« ist zwar möglich, im Deutschen aber unnötig räumlich und die Fußnotenalternative »während seiner Herrschaft« erzeugt eine kaum plausible zeitliche Aussage. Die Revision bewahrt die hebräische Mehrdeutigkeit mit »in seinem Königtum« und dokumentiert die weiteren Bedeutungen.
  naturalness: »Aus dem Haus der Gefangenen kam er heraus« ist im Deutschen verständlich, aber weniger idiomatisch als »aus dem Gefängnis«. Die wörtliche hebräische Bildform kann in der Fußnote erhalten bleiben. »Sogar in seinem Königtum arm geboren worden war« ist stilistisch gestrafft und lässt die bewusst schwierige Aussage stehen, ohne sie durch eine räumliche Lesart zu verengen.
  terminology: »Gefängnis«, »König werden«, »Königtum« und »arm« sind moderne, angemessene Wiedergaben. »Königtum« eignet sich hier besser als »Königreich«, weil es die abstrakte Bedeutungsbreite von מַלְכוּת wahrt.
