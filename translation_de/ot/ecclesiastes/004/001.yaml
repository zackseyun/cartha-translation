  naturalness: Der Text ist grundsätzlich verständlich und würdig. „all die Unterdrückung“ wirkt jedoch als Singular nach „all“ weniger glatt; der Plural „alle Unterdrückungen“ ist klarer. Die wiederholte Formulierung „sie hatten keinen Tröster“ bewahrt den knappen, eindringlichen Parallelismus des Hebräischen besser als die verbale Umschreibung.
  terminology: „Unterdrückungen / Unterdrückten / Unterdrücker“ erhält die hebräische Wortfeldverbindung sinnvoll. „Tröster“ gibt מְנַחֵם als substantiviertes Partizip präzise und modern verständlich wieder.
