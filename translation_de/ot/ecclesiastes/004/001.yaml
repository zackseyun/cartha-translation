revisions:
- from: Dann wandte ich mich wieder um und sah all die Unterdrückung, die unter der Sonne verübt wird.[a] Siehe, da waren die Tränen der Unterdrückten, und niemand tröstete sie. In der Hand ihrer Unterdrücker lag die Macht,[b] und niemand tröstete sie.
  to: Dann wandte ich mich wieder um und sah alle Unterdrückungen, die unter der Sonne geschehen.[a] Siehe, die Tränen der Unterdrückten, doch sie hatten keinen Tröster. In der Hand ihrer Unterdrücker war Macht,[b] doch sie hatten keinen Tröster.
  rationale: Die Revision glättet die abstrakte Pluralform im Deutschen, stellt die substantivische Aussage über den fehlenden „Tröster“ wieder her und präzisiert die formnahe Fußnote zur Präposition. Die mögliche Personenlesart des anfänglichen passiven Partizips bleibt ausdrücklich in der Fußnote erhalten.
