source:
  edition: WLC
  text: וְ/שַׁ֣בְתִּֽי אֲנִ֗י וָ/אֶרְאֶה֙ אֶת כָּל הָ֣/עֲשֻׁקִ֔ים אֲשֶׁ֥ר נַעֲשִׂ֖ים תַּ֣חַת הַ/שָּׁ֑מֶשׁ וְ/הִנֵּ֣ה דִּמְעַ֣ת הָ/עֲשֻׁקִ֗ים וְ/אֵ֤ין לָ/הֶם֙ מְנַחֵ֔ם וּ/מִ/יַּ֤ד עֹֽשְׁקֵי/הֶם֙ כֹּ֔חַ וְ/אֵ֥ין לָ/הֶ֖ם מְנַחֵֽם־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/001.yaml
  text: 'Then I turned and saw all the oppressions that are done under the sun: and behold[a], the tears of the oppressed, and they had no comforter. Power was in the hand of their oppressors[b], and they had no comforter.'
translation:
  language: de
  text: Dann wandte ich mich wieder um und sah alle Unterdrückungen, die unter der Sonne geschehen.[a] Siehe, die Tränen der Unterdrückten, doch sie hatten keinen Tröster. In der Hand ihrer Unterdrücker war Macht,[b] doch sie hatten keinen Tröster.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle Unterdrückten, die unter der Sonne sind“. Das hebräische passive Partizip kann unterdrückte Menschen oder, in erweitertem Sinn, Fälle beziehungsweise Taten der Unterdrückung bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „und aus der Hand ihrer Unterdrücker: Macht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְתִּי אֲנִי
  choice: Dann wandte ich mich wieder um
  rationale: שׁוב leitet hier eine erneute Beobachtung ein, nicht notwendig eine räumliche Rückkehr. Die Formulierung bewahrt sowohl den Gedanken der Wiederaufnahme als auch das konkrete Bild des Sich-Umwendens.
- source_word: וָאֶרְאֶה
  choice: und sah
  rationale: ראה bezeichnet hier die unmittelbare Wahrnehmung des Sprechers und gehört zur wiederkehrenden Beobachtungsformel des Buches.
- source_word: כָּל הָעֲשֻׁקִים אֲשֶׁר נַעֲשִׂים
  choice: all die Unterdrückung, die … verübt wird
  rationale: Die maskuline passive Pluralform kann unterdrückte Menschen oder, erweitert, Fälle beziehungsweise Taten der Unterdrückung bezeichnen. Die Verbindung mit נַעֲשִׂים („die geschehen/verübt werden“) legt im Haupttext den Vorgang der Unterdrückung nahe; die konkrete Personenlesart bleibt in der Fußnote erhalten.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: unter der Sonne
  rationale: Die für Kohelet charakteristische Wendung wird wörtlich und wiedererkennbar wiedergegeben.
- source_word: וְהִנֵּה
  choice: Siehe, da waren
  rationale: „Siehe“ bewahrt den nachdrücklichen Aufmerksamkeitsruf; „da waren“ bindet ihn natürlich an die folgende Nominalphrase an.
- source_word: דִּמְעַת הָעֲשֻׁקִים
  choice: die Tränen der Unterdrückten
  rationale: Obwohl דִּמְעַת formal im Singular steht, bezeichnet es kollektiv das Weinen der Opfer. Der deutsche Plural ist in diesem Zusammenhang idiomatisch und anschaulich.
- source_word: וְאֵין לָהֶם מְנַחֵם
  choice: und niemand tröstete sie
  rationale: Die Existenzverneinung besagt, dass es für sie keinen Tröstenden gab. Die verbale deutsche Fassung ist natürlich und erhält durch ihre identische Wiederholung den refrainartigen Nachdruck.
- source_word: וּמִיַּד עֹשְׁקֵיהֶם כֹּחַ
  choice: In der Hand ihrer Unterdrücker lag die Macht
  rationale: Die Wiedergabe bewahrt das Bild der Hand als Ort beziehungsweise Träger der Macht und macht das im Hebräischen hervorgehobene Machtgefälle im Deutschen klar.
- source_word: עֹשְׁקֵיהֶם
  choice: ihre Unterdrücker
  rationale: Das aktive Partizip bezeichnet diejenigen, die andere bedrängen, ausbeuten oder unterdrücken. „Unterdrücker“ ist im Kontext klar und hält die Wortfeldverbindung zu „Unterdrückung“ und „Unterdrückten“ aufrecht.
theological_decisions:
- issue: Bezug von הָעֲשֻׁקִים im ersten Satz
  choice: Im Haupttext als „Unterdrückung“ verstanden
  alternative: „alle Unterdrückten“
  rationale: Die Form bezeichnet ihrer Gestalt nach „Unterdrückte“, kann aber auch auf Fälle oder Taten der Unterdrückung zielen. נַעֲשִׂים („verübt/geschehen“) stützt im Kontext die abstraktere Lesart. Da die Personenlesart echt möglich bleibt, wird sie ausdrücklich in einer Fußnote genannt.
- issue: Zeitbezug der Aussage über den fehlenden Trost
  choice: Vergangenheitsform im Rahmen des Beobachtungsberichts
  alternative: 'Präsens: „niemand tröstet sie“'
  rationale: Die Aussage ist in den Bericht „ich wandte mich … und sah“ eingebettet. Das Präteritum folgt diesem Erzählrahmen, ohne den grundsätzlichen Charakter der beobachteten Not auszuschließen.
- issue: Deutung der Machtformulierung
  choice: Die Macht befindet sich bildlich in der Hand der Unterdrücker
  alternative: „Von der Hand ihrer Unterdrücker ging Macht/Gewalt aus“
  rationale: Die knappe hebräische Nominalkonstruktion lässt das genaue Verhältnis der Präposition zur „Macht“ offen. Der Haupttext stellt das offenkundige Machtgefälle dar, während die Fußnote die formnähere Konstruktion dokumentiert, ohne „Macht“ vorschnell als Gewalttat zu spezifizieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit der für Kohelet typischen Wendung „unter der Sonne“. Das markante „Siehe“ erhält den rhetorischen Aufmerksamkeitsruf. Die zweimalige Formulierung „niemand tröstete sie“ bildet den hebräischen Refrain natürlich und eindringlich nach.
