base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/016.yaml
  text: There was no end to all the people[a], to all who were before them; yet those who come later will not rejoice in him[c][b]. For this too is vanity and a chasing after wind.
translation:
  language: de
  text: Die Menge all dieser Menschen nahm kein Ende[a], all jener, die vor ihnen gewesen waren; doch die später Kommenden werden sich nicht über ihn freuen[b]. Denn auch das ist nichtig[c] und ein Haschen nach Wind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Für all die Menschen, für alle, die vor ihnen gewesen waren, gab es kein Ende.“ Der hebräische Satzbau ist schwierig und lässt mehrere Deutungen zu.'
    reason: alternative_reading
  - marker: b
    text: 'Auch möglich: „werden sich nicht an ihm freuen“ oder „werden nicht über ihn jubeln“.'
    reason: lexical_alternative
  - marker: c
    text: Hebräisch hebel, ein Leitwort im Buch Prediger für das, was flüchtig, substanzlos oder frustrierend vergeblich ist.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין קֵץ
  choice: nahmen kein Ende
  rationale: Die Verbindung bezeichnet eine unübersehbare, nicht begrenzte Menge. Die Vergangenheitsform passt zur rückblickenden Darstellung im Zusammenhang, ohne die schwierige Syntax weiter auszudeuten.
- source_word: לְכָל הָעָם
  choice: all die Menschen
  rationale: הָעָם bezeichnet hier die Gesamtheit beziehungsweise Menge der Menschen. Die deutsche Formulierung gibt den Sinn natürlich wieder, während die Relation zu אֵין קֵץ erhalten bleibt.
- source_word: לְכֹל אֲשֶׁר הָיָה לִפְנֵיהֶם
  choice: all jene, die vor ihnen gewesen waren
  rationale: Die syntaktisch schwierige Wendung wird eng am hebräischen Wortlaut wiedergegeben. Dadurch bleibt offen, auf wen sich „ihnen“ genau bezieht.
- source_word: הָאַחֲרוֹנִים
  choice: die später Kommenden
  rationale: Das Wort bezeichnet nachfolgende Menschen oder Generationen. Die substantivierte Wendung bewahrt den zeitlichen Gegensatz zu denen, die vorher da waren.
- source_word: לֹא יִשְׂמְחוּ בוֹ
  choice: werden sich nicht über ihn freuen
  rationale: שׂמח bedeutet „sich freuen“, und בּוֹ verweist im unmittelbaren Zusammenhang wahrscheinlich auf den jungen Herrscher. „Über ihn“ ist im Deutschen natürlich, ohne die Art dieser Freude genauer festzulegen.
- source_word: הֶבֶל
  choice: nichtig
  rationale: Das Leitwort des Predigerbuches bezeichnet, was flüchtig, substanzlos oder vergeblich ist. „Nichtig“ bewahrt diese Bedeutungsbreite besser als das heute oft auf Selbstgefälligkeit verengte „eitel“.
- source_word: רַעְיוֹן רוּחַ
  choice: ein Haschen nach Wind
  rationale: Die feste Wendung beschreibt ein aussichtsloses Bemühen. „Haschen nach Wind“ erhält das Bild einer vergeblichen Jagd nach etwas Unfassbarem.
theological_decisions:
- issue: Bezug der Pronomen in dem syntaktisch schwierigen Vers
  choice: „ihnen“ und „ihn“ bleiben ohne erklärenden Zusatz stehen; „ihn“ weist im Zusammenhang am ehesten auf den jungen Herrscher zurück.
  alternative: Die Bezüge ausdrücklich auf den jungen Mann, der König wurde, und auf die von ihm beherrschten Menschen festlegen.
  rationale: Der hebräische Text ist stark verdichtet und lässt die genauen Bezüge umstritten. Eine ausdrückliche Identifizierung würde mehr festlegen, als der Wortlaut sicher hergibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Reihung im ersten Satz spiegelt bewusst die verdichtete und mehrdeutige hebräische Syntax; die Fußnote bietet eine alternative Gliederung. „Haschen nach Wind“ ist bildhaft und im Deutschen gut verständlich.
