id: ECC.4.10
reference: Ecclesiastes 4:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֣י אִם יִפֹּ֔לוּ הָ/אֶחָ֖ד יָקִ֣ים אֶת חֲבֵר֑/וֹ וְ/אִ֣י/ל֗/וֹ הָֽ/אֶחָד֙ שֶׁ/יִּפּ֔וֹל וְ/אֵ֥ין שֵׁנִ֖י לַ/הֲקִימֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/010.yaml
  text: For if they fall[a], one will lift up his companion[b]; but woe to the one who falls when there is not a second to lift him up.
translation:
  language: de
  text: Denn wenn sie fallen, richtet der eine seinen Gefährten auf. Doch wehe dem einen, der fällt, wenn kein Zweiter da ist, um ihn aufzurichten!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי אִם
  choice: Denn wenn
  rationale: Die Wendung führt einen begründenden Bedingungssatz ein und verbindet den Vers mit der vorausgehenden Aussage über den Vorteil der Gemeinschaft.
- source_word: יִפֹּלוּ
  choice: sie fallen
  rationale: Der Plural und das konkrete Bild des Fallens bleiben erhalten; zugleich wird die Wiederholung desselben Verbs im Singular nachvollziehbar.
- source_word: הָאֶחָד
  choice: der eine
  rationale: Die Formulierung bewahrt den bestimmten, auf ein Paar bezogenen Zahlbegriff und klingt im Deutschen natürlich.
- source_word: יָקִים
  choice: richtet … auf
  rationale: Der Hifil von קום bezeichnet hier das Bewirken des Aufstehens. „Aufrichten“ wahrt das körperliche Bild und lässt zugleich dessen weitergehende Anwendung offen.
- source_word: חֲבֵרוֹ
  choice: seinen Gefährten
  rationale: חבר bezeichnet einen Verbundenen oder Gefährten, ohne zwingend die engere emotionale Bedeutung von „Freund“ vorauszusetzen.
- source_word: וְאִילוֹ
  choice: Doch wehe
  rationale: Die Wiedergabe erhält sowohl den Gegensatz als auch den ernsten Klage- und Warnruf des hebräischen Ausdrucks.
- source_word: וְאֵין שֵׁנִי
  choice: wenn kein Zweiter da ist
  rationale: Das für den Zusammenhang wichtige Zahlenmotiv bleibt erhalten; „da ist“ macht die im Hebräischen knapp ausgedrückte Situation idiomatisch verständlich.
- source_word: לַהֲקִימוֹ
  choice: um ihn aufzurichten
  rationale: Die Wiederholung von קום wird entsprechend der ersten Vershälfte mit demselben deutschen Verb wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkrete Bildsprache des Fallens und Aufrichtens bleibt erhalten, ohne sie auf körperliche Hilfe oder eine übertragene Bedeutung festzulegen. „Gefährte“ ist bewusst weiter als „Freund“ und bewahrt den Bezug auf gemeinschaftliche Verbundenheit.
