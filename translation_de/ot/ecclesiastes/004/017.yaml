source:
  edition: WLC
  text: שְׁמֹ֣ר רגלי/ך כַּ/אֲשֶׁ֤ר תֵּלֵךְ֙ אֶל בֵּ֣ית הָ/אֱלֹהִ֔ים וְ/קָר֣וֹב לִ/שְׁמֹ֔עַ מִ/תֵּ֥ת הַ/כְּסִילִ֖ים זָ֑בַח כִּֽי אֵינָ֥/ם יוֹדְעִ֖ים לַ/עֲשׂ֥וֹת רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/017.yaml
  text: Guard your steps when you go to the house of God[a], and draw near to listen rather than to offer the sacrifice of fools[c][b], for they do not know that they are doing evil.
translation:
  language: de
  text: Achte auf deine Schritte, wenn du zum Haus Gottes gehst.[a] Tritt näher, um zuzuhören, statt wie die Toren ein Schlachtopfer darzubringen.[b] Denn sie erkennen nicht, dass sie Böses tun.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Bewahre deine Füße, wenn du zum Haus Gottes gehst.«'
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Satz ist knapp. Auch möglich: »Zuzuhören ist besser, als wenn die Toren ein Schlachtopfer darbringen.«'
    reason: syntactic_ambiguity
  - marker: c
    text: 'Hebräisch wörtlich: »Denn sie wissen nicht, Böses zu tun.« Gemeint ist wahrscheinlich, dass sie nicht erkennen, dass ihr Handeln böse ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמֹר רגליך
  choice: Achte auf deine Schritte
  rationale: שׁמר fordert zu wachsamer Sorgfalt auf. Das konkret gemeinte »Fuß« bezeichnet hier idiomatisch das Verhalten beim Gang zum Heiligtum; »Schritte« bewahrt das Bild und klingt im modernen Deutschen natürlich.
- source_word: בֵּית הָאֱלֹהִים
  choice: Haus Gottes
  rationale: Die formale hebräische Bezeichnung bleibt erhalten. »Tempel« wäre eine sachlich plausible, aber stärker auslegende Konkretisierung.
- source_word: וְקָרוֹב לִשְׁמֹעַ
  choice: Tritt näher, um zuzuhören
  rationale: Die knappe Formulierung wird im Zusammenhang mit dem vorangehenden Imperativ als weitere Aufforderung verstanden. »Zuhören« vermittelt aufmerksames, aufnahmebereites Hören.
- source_word: מִתֵּת הַכְּסִילִים זָבַח
  choice: statt wie die Toren ein Schlachtopfer darzubringen
  rationale: נתן mit זבח bezeichnet das Darbringen eines Opfers. Die deutsche Formulierung macht deutlich, dass die Toren die Opfernden sind, und erhält den Vergleich mit aufmerksamem Hören.
- source_word: הַכְּסִילִים
  choice: die Toren
  rationale: »Toren« ist die prägnante, würdige Weisheitsbezeichnung für Menschen, denen moralische und geistliche Einsicht fehlt; gemeint ist nicht bloß geringe Intelligenz.
- source_word: כִּי אֵינָם יוֹדְעִים לַעֲשׂוֹת רָע
  choice: Denn sie erkennen nicht, dass sie Böses tun
  rationale: Die komprimierte Infinitivkonstruktion wird so verstanden, dass den Toren der böse Charakter ihres eigenen Handelns nicht bewusst ist. »Erkennen« gibt diese fehlende moralische Einsicht idiomatisch wieder.
theological_decisions:
- issue: Verhältnis von aufmerksamem Hören und Opfer im Gottesdienst
  choice: Der Vers gibt dem aufmerksamen Hören vor Gott den Vorrang vor dem Opfer der Toren und kritisiert damit uneinsichtige, leere Gottesverehrung.
  alternative: Der Vers verwirft jedes Opfer grundsätzlich.
  rationale: Der Text nennt ausdrücklich das Opfer der Toren und bezeichnet ihr Tun als böse, nicht aber Opfer als solche. Daher wird die Kritik nicht zu einer allgemeinen Abschaffung des Opferdienstes ausgeweitet.
- issue: Sinn der Schlussklausel לַעֲשׂוֹת רָע
  choice: Die Toren erkennen nicht, dass ihr Handeln böse ist.
  alternative: 'Die Toren verstehen sich nicht darauf, Böses zu tun; oder: Sie wissen nichts anderes, als Böses zu tun.'
  rationale: 'Im unmittelbaren Zusammenhang erklärt die Klausel am ehesten, warum ihr Opfer töricht ist: Ihnen fehlt das Bewusstsein für die Bosheit ihres Handelns. Die ungewöhnlich knappe hebräische Form bleibt in einer Fußnote sichtbar.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener Weisheitssprache (»Toren«). Kurze Sätze machen die Mahnung gut verständlich; »Haus Gottes« und »Schlachtopfer« bewahren die kultische Bildwelt des hebräischen Textes.
