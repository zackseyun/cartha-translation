source:
  edition: WLC
  text: וְ/טוֹב֙ מִ/שְּׁנֵי/הֶ֔ם אֵ֥ת אֲשֶׁר עֲדֶ֖ן לֹ֣א הָיָ֑ה אֲשֶׁ֤ר לֹֽא רָאָה֙ אֶת הַ/מַּעֲשֶׂ֣ה הָ/רָ֔ע אֲשֶׁ֥ר נַעֲשָׂ֖ה תַּ֥חַת הַ/שָּֽׁמֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/003.yaml
  text: But better than both of them is the one who has not yet been[a], who has not seen the evil deed that is done under the sun.
translation:
  language: de
  text: Doch besser als diese beiden ist, wer noch nicht gewesen ist[a] und das böse Tun nicht gesehen hat, das unter der Sonne geschieht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder deutender: „wer noch nicht geboren ist“. Wörtlicher heißt es im Hebräischen: „wer noch nicht gewesen ist“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְטוֹב
  choice: Doch besser
  rationale: טוֹב wird durch den Vergleich mit den beiden Gruppen aus Vers 2 komparativ gebraucht. „Doch“ gibt den weiterführenden, zugleich steigernden Kontrast im Deutschen natürlich wieder.
- source_word: מִשְּׁנֵיהֶם
  choice: als diese beiden
  rationale: Die Wendung verweist ausdrücklich auf die Lebenden und die Toten aus dem vorausgehenden Vers und bewahrt den Vergleich mit beiden Gruppen.
- source_word: אֵת אֲשֶׁר עֲדֶן לֹא הָיָה
  choice: wer noch nicht gewesen ist
  rationale: Die substantivierte Relativkonstruktion wird im Deutschen knapp mit „wer“ wiedergegeben. „Noch nicht gewesen ist“ bleibt bewusst nahe am unspezifischen hebräischen היה und legt die Aussage nicht stillschweigend auf „geboren“ fest.
- source_word: אֲשֶׁר לֹא רָאָה
  choice: und … nicht gesehen hat
  rationale: Das zweite אֲשֶׁר beschreibt dieselbe Person. Die koordinierte deutsche Fassung vermeidet eine schwerfällige Wiederholung und bewahrt den inhaltlichen Bezug.
- source_word: הַמַּעֲשֶׂה הָרָע
  choice: das böse Tun
  rationale: מַעֲשֶׂה kann Tat, Werk oder Tun bezeichnen. Im Zusammenhang der vielfältigen Unterdrückung aus Vers 1 gibt „das böse Tun“ sowohl konkrete Handlungen als auch das beobachtete Geschehen wieder, ohne den Singular auf eine einzige Tat zu verengen.
- source_word: אֲשֶׁר נַעֲשָׂה
  choice: das … geschieht
  rationale: Die passive Form bezeichnet hier das fortdauernd beziehungsweise allgemein vorkommende Geschehen. Das idiomatische „geschieht“ erhält diesen allgemeinen Charakter.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: unter der Sonne
  rationale: Die feste Wendung wird als wiederkehrende Leitformel des Predigerbuches einheitlich und natürlich wiedergegeben.
theological_decisions:
- issue: Identität dessen, der „noch nicht gewesen ist“
  choice: Die unbestimmte Formulierung des Hebräischen bleibt im Haupttext erhalten.
  alternative: „wer noch nicht geboren ist“
  rationale: Im Kontext ist wahrscheinlich ein noch nicht geborener Mensch gemeint; das Verb היה selbst bedeutet jedoch allgemeiner „sein/werden“. Die Fußnote nennt die naheliegende Deutung, ohne sie in den Text einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Wendung „noch nicht gewesen ist“ ist bewusst beibehalten, um die Offenheit des hebräischen Verbs zu wahren; die Fußnote bietet die kontextuell naheliegende Deutung.
