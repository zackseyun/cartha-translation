    rationale: עִנְיָן bezeichnet eine Angelegenheit, Beschäftigung oder ein unerquicklich belastendes Geschäft. „Plage“ kann das Resultat oder Erleben benennen, ersetzt aber die im Wort liegende Kategorie der Angelegenheit/Beschäftigung.
