  naturalness: Der Entwurf ist modernes, würdiges Standarddeutsch. „Auch seine Augen werden des Reichtums nicht satt“ ist natürlich und erhält die additive Partikel גַּם ohne einen nicht zwingenden Gegensatz. „Weder Sohn noch Bruder hat er“ ist flüssiger als „Auch Sohn und Bruder hat er nicht“.
  terminology: „Mühe“, „Reichtum“, „Gutes vorenthalten“ und „nichtig“ sind angemessen. „Nichtig“ bewahrt für הֶבֶל eine etablierte, offene Leitwortübersetzung; die Fußnote erläutert die Bild- und Bedeutungsebene sinnvoll. „Schlimme Angelegenheit“ gibt עִנְיָן als Sachverhalt/Beschäftigung weiter, ohne die Bedeutung auf eine konkrete Plage zu verengen.
