source:
  edition: WLC
  text: יֵ֣שׁ אֶחָד֩ וְ/אֵ֨ין שֵׁנִ֜י גַּ֣ם בֵּ֧ן וָ/אָ֣ח אֵֽין ל֗/וֹ וְ/אֵ֥ין קֵץ֙ לְ/כָל עֲמָל֔/וֹ גַּם עיני/ו לֹא תִשְׂבַּ֣ע עֹ֑שֶׁר וּ/לְ/מִ֣י אֲנִ֣י עָמֵ֗ל וּ/מְחַסֵּ֤ר אֶת נַפְשִׁ/י֙ מִ/טּוֹבָ֔ה גַּם זֶ֥ה הֶ֛בֶל וְ/עִנְיַ֥ן רָ֖ע הֽוּא־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/008.yaml
  text: There is one man[a], and he has no second; he has neither son nor brother, and there is no end to all his labor[c][b]. Yet his eyes are not satisfied with wealth, and he says, “And for whom am I laboring and depriving myself of good?” This too is vanity and a grievous business.
translation:
  language: de
  text: 'Da ist einer[a], und es gibt keinen Zweiten. Weder Sohn noch Bruder hat er, und all seine Mühe nimmt kein Ende. Auch seine Augen werden des Reichtums nicht satt: »Für wen mühe ich mich ab und enthalte mir Gutes vor?« Auch das ist nichtig[b] und eine schlimme Angelegenheit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Da ist ein Einzelner«; wörtlich: »Da ist einer, und es gibt keinen Zweiten.«'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann auch »Hauch« bedeuten und Vergänglichkeit oder Vergeblichkeit ausdrücken.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ אֶחָד וְאֵין שֵׁנִי
  choice: Da ist einer allein, und kein Zweiter ist bei ihm
  rationale: Die Formulierung bewahrt das Bild des »Einen« und des fehlenden »Zweiten«, während »allein« den im Zusammenhang klaren Sinn natürlich ausdrückt.
- source_word: גַּם בֵּן וָאָח אֵין לוֹ
  choice: Auch Sohn und Bruder hat er nicht
  rationale: Die genannten nahen Angehörigen werden konkret beibehalten und nicht zum allgemeineren Begriff »Familie« verflacht.
- source_word: וְאֵין קֵץ לְכָל עֲמָלוֹ
  choice: all seine Mühe nimmt kein Ende
  rationale: עָמָל bezeichnet belastende Arbeit oder Mühsal. »Mühe« lässt sich zudem mit dem folgenden Verb »mühe ich mich ab« verbinden.
- source_word: גַּם עֵינָיו לֹא תִשְׂבַּע עֹשֶׁר
  choice: Doch seine Augen werden des Reichtums nicht satt
  rationale: Das hebräische Bild der ungesättigten Augen bleibt erhalten. »Doch« gibt die kontextuell adversative Kraft von גַּם wieder.
- source_word: וּלְמִי אֲנִי עָמֵל
  choice: Für wen mühe ich mich ab
  rationale: Die Frage nach dem Nutznießer der Arbeit und die belastende Nuance von עמל werden natürlich wiedergegeben.
- source_word: וּמְחַסֵּר אֶת נַפְשִׁי מִטּוֹבָה
  choice: und enthalte mir Gutes vor
  rationale: נֶפֶשׁ bezeichnet hier idiomatisch die eigene Person. Die Wiedergabe vermeidet eine nicht geforderte Leib-Seele-Festlegung und bewahrt das breite »Gute«.
- source_word: גַּם זֶה הֶבֶל
  choice: Auch das ist nichtig
  rationale: »Nichtig« ist im Deutschen verständlich und trägt die kontextuellen Bedeutungsanteile von Vergänglichkeit, Leere und Vergeblichkeit, ohne sie auf nur einen Aspekt zu reduzieren.
- source_word: וְעִנְיַן רָע הוּא
  choice: und eine schlimme Plage
  rationale: עִנְיָן kann Aufgabe, Beschäftigung oder Angelegenheit bezeichnen; zusammen mit רָע hebt es hier die bedrückende, leidvolle Beschäftigung hervor. »Plage« gibt diese Wertung idiomatisch wieder.
theological_decisions:
- issue: Anthropologische Bedeutung von נַפְשִׁי
  choice: mir
  alternative: meiner Seele
  rationale: In diesem Weisheitskontext steht נֶפֶשׁ für die eigene Person. »Mir« wahrt den Sinn, ohne eine technische Aussage über die Beschaffenheit des Menschen einzutragen.
- issue: Bedeutung des Leitworts הֶבֶל
  choice: nichtig
  alternative: Hauch; vergeblich
  rationale: Das Wort verbindet das Bild des flüchtigen Hauchs mit Vergänglichkeit und Vergeblichkeit. Die Hauptübersetzung lässt diese Spannung bestehen; die Fußnote nennt die zentralen Bedeutungsaspekte.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Rede bleibt knapp und bildhaft; der unmarkierte Übergang zur inneren Frage wird durch einen Doppelpunkt kenntlich gemacht, ohne ein im Hebräischen fehlendes »er sagt« einzufügen.
