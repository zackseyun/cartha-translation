source:
  edition: WLC
  text: וְ/שַׁבֵּ֧חַ אֲנִ֛י אֶת הַ/מֵּתִ֖ים שֶׁ/כְּבָ֣ר מֵ֑תוּ מִן הַ֣/חַיִּ֔ים אֲשֶׁ֛ר הֵ֥מָּה חַיִּ֖ים עֲדֶֽנָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/002.yaml
  text: And I considered the dead[a], who have already died, more fortunate than the living, who are still alive.
translation:
  language: de
  text: Und ich hielt die Toten, die bereits gestorben sind, für glücklicher als die Lebenden, die noch am Leben sind.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und ich pries die Toten … mehr als die Lebenden.“ Das hebräische Verb bedeutet wörtlicher „preisen“ oder „rühmen“; hier drückt es Kohelets Urteil aus, dass die Toten besser gestellt sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבֵּחַ
  choice: Und ich hielt … für glücklicher
  rationale: Das Piel von שׁבח bedeutet gewöhnlich „preisen“ oder „rühmen“. Im Zusammenhang bezeichnet es jedoch keine moralische Würdigung der Toten, sondern Kohelets vergleichendes Urteil, dass sie angesichts der Unterdrückung besser gestellt sind. Die deutsche Konstruktion „für glücklicher halten“ gibt diese Wertung natürlich wieder.
- source_word: אֲנִי
  choice: ich
  rationale: Das ausdrücklich gesetzte Personalpronomen wird beibehalten und unterstreicht Kohelets persönliches Urteil.
- source_word: אֶת הַמֵּתִים
  choice: die Toten
  rationale: Die substantivische Form bezeichnet die Toten als Gruppe; „die Toten“ ist direkt und idiomatisch.
- source_word: שֶׁכְּבָר מֵתוּ
  choice: die bereits gestorben sind
  rationale: כבר bedeutet „bereits/schon“, während die Perfektform von מות die abgeschlossene Handlung ausdrückt.
- source_word: מִן הַחַיִּים
  choice: glücklicher als die Lebenden
  rationale: מן kennzeichnet nach der wertenden Aussage den Vergleich. „Glücklicher als“ macht den im Hebräischen enthaltenen komparativen Sinn im Deutschen ausdrücklich.
- source_word: הַחַיִּים
  choice: die Lebenden
  rationale: Die substantivische Bezeichnung wird knapp und natürlich als „die Lebenden“ wiedergegeben.
- source_word: אֲשֶׁר הֵמָּה חַיִּים עֲדֶנָה
  choice: die noch am Leben sind
  rationale: Die Relativkonstruktion betont den fortdauernden gegenwärtigen Zustand; עֲדֶנָה wird mit „noch“ wiedergegeben.
theological_decisions:
- issue: Existentieller Vergleich zwischen Toten und Lebenden
  choice: Der Vers gibt Kohelets Urteil wieder, dass die bereits Verstorbenen angesichts der Unterdrückung glücklicher beziehungsweise besser gestellt sind als die noch Lebenden.
  alternative: Eine Aussage über einen seligen Zustand der Toten nach dem Tod oder lediglich eine Hyperbel ohne wirklichen Vergleich.
  rationale: Der unmittelbare Zusammenhang in 4,1–3 handelt von Unterdrückung unter der Sonne. Die Übersetzung wahrt die zugespitzte vergleichende Aussage, ohne daraus eine systematische Lehre über das Leben nach dem Tod abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bewusste Wiederholung „die Toten, die bereits gestorben sind“ und „die Lebenden, die noch am Leben sind“ bleibt erhalten, weil sie die nachdrückliche Formulierung des Hebräischen wiedergibt.
