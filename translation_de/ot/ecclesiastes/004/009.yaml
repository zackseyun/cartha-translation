  text: טוֹבִ֥ים הַ/שְּׁנַ֖יִם מִן הָ/אֶחָ֑ד אֲשֶׁ֧ר יֵשׁ לָ/הֶ֛ם שָׂכָ֥ר ט֖וֹב בַּ/עֲמָלָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/009.yaml
  text: Two are better than one[a], because they have a good reward for their labor.
translation:
  language: de
  text: Zwei sind besser als einer, denn sie haben einen guten Lohn für ihre Mühe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טוֹבִים
  choice: besser
  rationale: Das prädikative Adjektiv steht mit מִן in einem Vergleich; im Deutschen ist daher der Komparativ »besser« idiomatisch.
- source_word: הַשְּׁנַיִם
  choice: zwei
  rationale: Die Zahl mit Artikel ist hier allgemein-sprichwörtlich gemeint und bezeichnet keine zuvor bestimmten zwei Personen.
- source_word: מִן הָאֶחָד
  choice: als einer
  rationale: מִן markiert den Vergleich. »Einer« bewahrt die knappe Gegenüberstellung des Hebräischen, ohne ausdrücklich »allein« zu ergänzen.
- source_word: אֲשֶׁר
  choice: denn
  rationale: Das Relativwort leitet hier die Begründung der vorausgehenden Aussage ein; »denn« gibt diesen Zusammenhang natürlich wieder.
- source_word: יֵשׁ לָהֶם
  choice: gemeinsam erhalten sie
  rationale: Die Existenzkonstruktion mit ל drückt aus, was ihnen zukommt. »Gemeinsam« verdeutlicht den Bezug auf die beiden, ohne den Ertrag näher zu bestimmen.
- source_word: שָׂכָר טוֹב
  choice: einen guten Ertrag
  rationale: שָׂכָר bezeichnet Lohn, Vergeltung oder den aus Arbeit erwachsenden Nutzen. »Ertrag« passt zum Arbeitskontext und lässt sowohl materiellen als auch weiteren Nutzen offen.
- source_word: בַּעֲמָלָם
  choice: für ihre Mühe
  rationale: עָמָל bezeichnet im Predigerbuch häufig mühevolle Arbeit. Die Präposition ב beschreibt hier die Beziehung zwischen Mühe und Ertrag; »für« ist im Deutschen idiomatisch.
