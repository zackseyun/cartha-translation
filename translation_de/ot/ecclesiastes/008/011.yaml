source:
  edition: WLC
  text: אֲשֶׁר֙ אֵין נַעֲשָׂ֣ה פִתְגָ֔ם מַעֲשֵׂ֥ה הָ/רָעָ֖ה מְהֵרָ֑ה עַל כֵּ֡ן מָלֵ֞א לֵ֧ב בְּֽנֵי הָ/אָדָ֛ם בָּ/הֶ֖ם לַ/עֲשׂ֥וֹת רָֽע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/011.yaml
  text: Because the sentence against an evil deed is not carried out quickly[b][a], therefore the heart of the sons of man is fully set in them to do evil.
translation:
  language: de
  text: Weil das Urteil über eine böse Tat nicht rasch vollstreckt wird, ist das Herz der Menschen[a] ganz darauf aus, Böses zu tun[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Söhne des Menschen«; gemeint sind die Menschen im Allgemeinen.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich heißt es, das Herz sei »in ihnen voll«, Böses zu tun. Das Bild bezeichnet eine starke innere Neigung oder Entschlossenheit zum Bösen.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִתְגָם
  choice: Urteil
  rationale: Das seltene Wort bezeichnet hier im Zusammenhang mit einer bösen Tat eine maßgebliche richterliche Entscheidung. »Urteil« gibt den gerichtlichen Sinn im modernen Deutsch klar wieder.
- source_word: מַעֲשֵׂה הָרָעָה
  choice: eine böse Tat
  rationale: Die Genitivverbindung bedeutet wörtlich etwa »Tat des Bösen«. Der Singular bleibt erhalten, wird aber wie im Hebräischen allgemein gebraucht.
- source_word: אֵין נַעֲשָׂה ... מְהֵרָה
  choice: nicht rasch vollstreckt wird
  rationale: Das passive עשה meint in diesem gerichtlichen Zusammenhang die Ausführung des Urteils; »vollstreckt« macht diesen Bezug deutlich. »Rasch« entspricht dem adverbialen מְהֵרָה.
- source_word: עַל־כֵּן
  choice: darum / als Folgerung in der Konstruktion »Weil …, ist …«
  rationale: Die deutsche Weil-Konstruktion drückt denselben eindeutigen Zusammenhang zwischen verzögerter Rechtsprechung und der Neigung zum Bösen aus, ohne das Folgeverhältnis doppelt zu markieren.
- source_word: לֵב
  choice: Herz
  rationale: »Herz« bezeichnet das innere Zentrum von Wollen und Entscheiden und bewahrt zugleich das Bild des hebräischen Textes.
- source_word: בְּנֵי הָאָדָם
  choice: Menschenkinder
  rationale: Das gebräuchliche deutsche Sammelwort bewahrt den bildhaften Charakter von »Söhne des Menschen«, bezeichnet hier aber erkennbar die Menschen im Allgemeinen.
- source_word: מָלֵא לֵב ... בָּהֶם לַעֲשׂוֹת רָע
  choice: ist das Herz … ganz darauf aus, Böses zu tun
  rationale: Die Formulierung gibt die im Bild des »vollen« Herzens ausgedrückte gefestigte Absicht in natürlichem Deutsch wieder. Eine Fußnote dokumentiert die wörtlichere Ausdrucksweise und das im Deutschen nicht eigens wiedergegebene בָּהֶם.
- source_word: רָע
  choice: Böses
  rationale: Die substantivierte Form ist im Deutschen natürlich und bewahrt die moralische Aussage sowie den lexikalischen Bezug zur vorausgehenden »bösen Tat«.
theological_decisions:
- issue: Generische Bedeutung von בְּנֵי הָאָדָם
  choice: Menschenkinder
  alternative: 'Menschen; wörtlich: Söhne des Menschen'
  rationale: Der Ausdruck ist grammatisch bildhaft und maskulin formuliert, meint im Kontext jedoch die Menschheit allgemein. »Menschenkinder« wahrt das Ausgangsbild besser als »Menschen«, ohne die Aussage auf männliche Personen zu beschränken.
- issue: Stärke der durch מָלֵא לֵב ausgedrückten Hinwendung zum Bösen
  choice: ganz darauf aus
  alternative: davon erfüllt; fest entschlossen; dazu ermutigt
  rationale: Der Text beschreibt eine starke, innere Ausrichtung zum bösen Handeln. Die Übersetzung wahrt diese moralische Zuspitzung, legt aber nicht enger fest, ob ausschließlich Entschlossenheit oder auch durch ausbleibende Strafe entstandene Ermutigung gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Menschenkinder« bewahrt bewusst die Bildhaftigkeit des Hebräischen, während Satzbau und gerichtliche Terminologie unmittelbar verständlich bleiben.
