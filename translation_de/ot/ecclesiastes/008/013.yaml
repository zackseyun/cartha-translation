source:
  edition: WLC
  text: וְ/טוֹב֙ לֹֽא יִהְיֶ֣ה לָֽ/רָשָׁ֔ע וְ/לֹֽא יַאֲרִ֥יךְ יָמִ֖ים כַּ/צֵּ֑ל אֲשֶׁ֛ר אֵינֶ֥/נּוּ יָרֵ֖א מִ/לִּ/פְנֵ֥י אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/013.yaml
  text: But it will not go well for the wicked[a], and he will not prolong his days like a shadow[b], because he does not fear before God.
translation:
  language: de
  text: Doch dem Frevler wird es nicht gut ergehen, und er wird seine Tage nicht verlängern wie ein Schatten[a], weil er sich vor Gott nicht fürchtet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und er wird seine Tage nicht verlängern, die wie ein Schatten sind“.'
    reason: Die genaue syntaktische Anbindung von כַּצֵּל („wie ein Schatten“) ist im Hebräischen knapp; der Vergleich kann auf das Verlängern der Tage oder auf deren Flüchtigkeit bezogen werden.
lexical_decisions:
- source_word: וְטוֹב לֹא יִהְיֶה לָרָשָׁע
  choice: Doch dem Frevler wird es nicht gut ergehen
  rationale: טוֹב mit היה bezeichnet hier ein gutes Ergehen oder einen günstigen Ausgang. „Doch“ gibt den Gegensatz zur Aussage über die Gottesfürchtigen im vorhergehenden Vers wieder; „Frevler“ bewahrt die moralische Kategorie von רָשָׁע, ohne sie auf juristische Schuld zu verengen.
- source_word: וְלֹא יַאֲרִיךְ יָמִים
  choice: und er wird seine Tage nicht … verlängern
  rationale: Die Hifil-Form von ארך mit יָמִים bedeutet wörtlich, die Tage zu verlängern. Die deutsche Formulierung erhält dieses Bild, statt es nur mit „lange leben“ wiederzugeben.
- source_word: כַּצֵּל
  choice: wie einen Schatten
  rationale: Das Schattenbild wird unmittelbar bewahrt. Die Stellung lässt am ehesten an einen sich verlängernden Schatten denken, doch eine Zuordnung des Schattens zu den flüchtigen Lebenstagen bleibt möglich und wird in der Fußnote genannt.
- source_word: אֲשֶׁר
  choice: weil
  rationale: אֲשֶׁר leitet hier plausibel den Grund für das Geschick des Frevlers ein. Das kausale „weil“ ergibt einen natürlichen deutschen Satz.
- source_word: אֵינֶנּוּ יָרֵא מִלִּפְנֵי אֱלֹהִים
  choice: er sich vor Gott nicht fürchtet
  rationale: „Sich vor Gott fürchten“ ist die natürliche deutsche Wiedergabe für ehrfürchtige Gottesfurcht; „vor Gott“ entspricht dem idiomatischen מִלִּפְנֵי אֱלֹהִים, ohne das hebräische Bild von Gottes Angesicht steif nachzubilden.
theological_decisions:
- issue: Vergeltung und beobachtbare Wirklichkeit in der Weisheitsliteratur
  choice: 'Die Aussage bleibt als uneingeschränkter Weisheitssatz stehen: Dem Frevler wird es nicht gut ergehen, und seine Tage werden nicht verlängert.'
  alternative: Die Aussage ausdrücklich auf jeden Einzelfall im gegenwärtigen Leben beschränken oder durch erklärende Zusätze abschwächen.
  rationale: Kohelet hält die Spannung zwischen moralischer Ordnung und widersprüchlicher Erfahrung aus. Die Übersetzung fügt weder eine mechanische Garantie frühen Todes noch eine relativierende Einschränkung hinzu.
- issue: Bezug des Schattenbildes
  choice: Das Schattenbild wird im Haupttext mit dem Verlängern der Tage verbunden.
  alternative: Die Tage selbst werden als schattenhaft und vergänglich beschrieben.
  rationale: Die Wortstellung unterstützt den Vergleich mit einem sich verlängernden Schatten, während die alternative syntaktische und bildliche Deutung möglich bleibt; sie wird deshalb nicht verschwiegen, sondern in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Frevler“ entspricht dem weisheitlichen Sprachgebrauch und vermeidet sowohl die juristische Verengung „Schuldiger“ als auch die mögliche konfessionelle Aufladung von „Gottloser“. Der etwas markante Schattenvergleich wurde bewusst erhalten und nicht paraphrasiert.
