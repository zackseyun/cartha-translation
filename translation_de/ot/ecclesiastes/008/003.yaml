source:
  edition: WLC
  text: אַל תִּבָּהֵ֤ל מִ/פָּנָי/ו֙ תֵּלֵ֔ךְ אַֽל תַּעֲמֹ֖ד בְּ/דָבָ֣ר רָ֑ע כִּ֛י כָּל אֲשֶׁ֥ר יַחְפֹּ֖ץ יַעֲשֶֽׂה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/003.yaml
  text: Do not be hasty to leave his presence[a]. Do not take your stand in an evil matter[b], for he does whatever he pleases.
translation:
  language: de
  text: Übereile dich nicht, seine Gegenwart zu verlassen[a]. Halte nicht an einer bösen Sache fest[b], denn er tut, was er will.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Lass dich nicht erschrecken und geh nicht aus seiner Gegenwart weg.“ Das hebräische Verb kann neben überstürzter Eile auch Bestürzung oder Erschrecken ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Beziehe nicht Stellung für eine böse Sache“ beziehungsweise „Verharre nicht in einer bösen Angelegenheit.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּבָּהֵל
  choice: übereile dich nicht
  rationale: Das Verb בהל kann Bestürzung oder erschreckte Unruhe bezeichnen, daraus aber auch ein überstürztes Handeln. Im Zusammenhang mit dem Weggehen aus der Gegenwart des Königs gibt „übereile dich nicht“ die praktische Warnung natürlich wieder, ohne die emotionale Nebenbedeutung auszuschließen.
- source_word: מִפָּנָיו תֵּלֵךְ
  choice: seine Gegenwart zu verlassen
  rationale: Wörtlich steht hier „von seinem Angesicht hinweggehen“. „Seine Gegenwart verlassen“ ist idiomatisches Deutsch und bewahrt den höfischen Zusammenhang.
- source_word: תַּעֲמֹד
  choice: halte … fest
  rationale: עמד kann hier ein Einstehen, Verharren oder Beharren ausdrücken, nicht nur körperliches Stehen. „Festhalten“ gibt im Deutschen besonders gut die mögliche Bedeutung des Beharrens wieder; die Alternative einer Stellungnahme wird in der Fußnote genannt.
- source_word: בְּדָבָר רָע
  choice: an einer bösen Sache
  rationale: דבר ist weit gefasst und kann Sache, Angelegenheit, Vorhaben oder Anliegen bedeuten. „Böse Sache“ bewahrt diese Offenheit und zugleich die moralische Stärke von רע.
- source_word: כִּי כָּל אֲשֶׁר יַחְפֹּץ יַעֲשֶׂה
  choice: denn er tut alles, was ihm gefällt
  rationale: Die Formulierung gibt die wirksame Willensmacht des Königs in natürlichem Deutsch wieder. „Was ihm gefällt“ bewahrt die Bedeutungsbreite von חפץ zwischen Wollen, Begehren und Gefallenfinden.
- source_word: כִּי
  choice: denn
  rationale: „Denn“ verbindet die abschließende Begründung klar mit den beiden vorausgehenden Warnungen.
theological_decisions:
- issue: Bezug der Pronomen in der dritten Person Singular
  choice: Die Pronomen bleiben als „seine“ und „er“ stehen und beziehen sich im unmittelbaren Zusammenhang auf den König.
  alternative: Allgemeiner Bezug auf einen Herrscher oder eine Autoritätsperson.
  rationale: Der König wird in 8,2 ausdrücklich genannt, und 8,4 spricht weiter von seiner Vollmacht. Die pronominale Wiedergabe folgt dem Hebräischen und vermeidet dennoch eine über den Wortlaut hinausgehende Einfügung des Titels.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Mahnton. Die höfische Situation bleibt durch „seine Gegenwart“ erkennbar. Die Mehrdeutigkeit bei בהל sowie bei עמד בדבר רע wird nicht im Haupttext überladen, sondern durch Fußnoten offengehalten.
