id: ECC.8.17
reference: Ecclesiastes 8:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/רָאִיתִי֮ אֶת כָּל מַעֲשֵׂ֣ה הָ/אֱלֹהִים֒ כִּי֩ לֹ֨א יוּכַ֜ל הָ/אָדָ֗ם לִ/מְצוֹא֙ אֶת הַֽ/מַּעֲשֶׂה֙ אֲשֶׁ֣ר נַעֲשָׂ֣ה תַֽחַת הַ/שֶּׁ֔מֶשׁ בְּ֠/שֶׁ/ל אֲשֶׁ֨ר יַעֲמֹ֧ל הָ/אָדָ֛ם לְ/בַקֵּ֖שׁ וְ/לֹ֣א יִמְצָ֑א וְ/גַ֨ם אִם יֹאמַ֤ר הֶֽ/חָכָם֙ לָ/דַ֔עַת לֹ֥א יוּכַ֖ל לִ/מְצֹֽא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/017.yaml
  text: 'Then I saw all the work of God: that man cannot find out the work that is done under the sun[a]. However much man labors to seek it out, he will not find it; and even if the wise man says he knows[b], he cannot find it out.'
translation:
  language: de
  text: 'Da sah ich das ganze Werk Gottes: Der Mensch kann das Werk, das unter der Sonne getan wird, nicht ergründen.[a] So sehr der Mensch sich auch abmüht, danach zu forschen, er wird es nicht ergründen. Und selbst wenn der Weise sagt, er wisse es,[b] kann er es nicht ergründen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „nicht finden“. Gemeint ist hier, Gottes Wirken durch Nachforschen zu erfassen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „behauptet, es zu wissen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאִיתִי
  choice: Da sah ich
  rationale: Das Waw mit Perfekt führt die Betrachtung folgernd fort. „Da sah ich“ klingt im Deutschen natürlich und bewahrt den beobachtenden Ton.
- source_word: מַעֲשֵׂה הָאֱלֹהִים
  choice: das ganze Werk Gottes
  rationale: מַעֲשֶׂה bezeichnet Werk, Tun oder Wirken; „Werk Gottes“ ist breit genug und erhält die Wiederaufnahme durch הַמַּעֲשֶׂה. כָּל wird ausdrücklich mit „ganze“ wiedergegeben.
- source_word: הָאָדָם
  choice: der Mensch
  rationale: Der bestimmte Singular wird generisch gebraucht und bezeichnet die Menschheit in ihrer repräsentativen Einheit, nicht eigens einen Mann. „Der Mensch“ erhält im Deutschen sowohl Singularform als auch Allgemeingültigkeit.
- source_word: לִמְצוֹא
  choice: ergründen
  rationale: מצא meint hier nicht bloß räumliches Finden, sondern das durch Forschen erstrebte Erfassen von Gottes Wirken. „Ergründen“ gibt diese Erkenntnisdimension idiomatisch wieder.
- source_word: הַמַּעֲשֶׂה אֲשֶׁר נַעֲשָׂה תַחַת הַשֶּׁמֶשׁ
  choice: das Werk, das unter der Sonne geschieht
  rationale: Die Wiederholung von „Werk“ bleibt erhalten; das passive נַעֲשָׂה wird mit dem natürlichen deutschen „geschieht“ wiedergegeben. Die leitmotivische Wendung „unter der Sonne“ bleibt wörtlich stehen.
- source_word: בְּשֶׁל אֲשֶׁר
  choice: So sehr … auch
  rationale: Die seltene Verbindung bezeichnet hier den Umfang der vergeblichen menschlichen Anstrengung. Die konzessive deutsche Konstruktion gibt den Zusammenhang natürlich wieder.
- source_word: יַעֲמֹל
  choice: sich abmüht
  rationale: עמל trägt die Nuance mühevoller, belastender Arbeit. „Sich abmühen“ macht diese Anstrengung deutlich.
- source_word: לְבַקֵּשׁ
  choice: danach zu forschen
  rationale: בקש bezeichnet zielgerichtetes Suchen. „Forschen“ passt zum Erkenntniszusammenhang; „danach“ verweist eindeutig auf Gottes Werk.
- source_word: וְגַם אִם יֹאמַר הֶחָכָם לָדַעַת
  choice: Und selbst wenn der Weise sagt, er wisse es
  rationale: Der Infinitiv לָדַעַת nach יֹאמַר ist elliptisch. Der Konjunktiv „er wisse“ gibt die indirekte Behauptung wieder, ohne schon zu entscheiden, ob tatsächliches Wissen oder nur ein Anspruch gemeint ist.
- source_word: לֹא יוּכַל לִמְצֹא
  choice: kann er es nicht ergründen
  rationale: Die Schlussformulierung wiederholt und bekräftigt die menschliche Unfähigkeit. Dieselbe Wiedergabe von מצא erhält den lexikalischen Zusammenhang.
theological_decisions:
- issue: Generischer Gebrauch von הָאָדָם in der Aussage über menschliche Erkenntnisgrenzen
  choice: der Mensch
  alternative: die Menschen / die Menschheit
  rationale: „Der Mensch“ bewahrt den generischen Singular und bezeichnet im modernen Standarddeutsch eindeutig den Menschen als solchen. Die Aussage gilt der gesamten Menschheit, nicht nur männlichen Personen.
- issue: Reichweite der menschlichen Unfähigkeit gegenüber Gottes Werk
  choice: nicht ergründen
  alternative: nicht finden
  rationale: Der Kontext spricht von Suchen, Wissen und Weisheit; daher ist intellektuelles Erfassen gemeint. Die Übersetzung lässt die Spannung bestehen, dass Gottes Werk wahrgenommen, aber nicht umfassend ergründet werden kann.
- issue: Aussage des Weisen in לָדַעַת
  choice: sagt, er wisse es
  alternative: behauptet, es zu wissen
  rationale: „Sagt“ bleibt näher am hebräischen יֹאמַר und vermeidet, die Äußerung ausdrücklich als anmaßende Behauptung zu werten. Der Kontext stellt dennoch klar, dass auch der Weise das Werk nicht ergründen kann.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „ergründen“ bildet die dreifache Folge von מצא ab und hält den Erkenntnisgedanken zusammen. „Unter der Sonne“ bleibt als prägende Wendung des Predigerbuches unverändert. Alle Fußnotenmarker stehen unmittelbar an den betreffenden Textstellen.
