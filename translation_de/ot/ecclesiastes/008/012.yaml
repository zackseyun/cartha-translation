  text: אֲשֶׁ֣ר חֹטֶ֗א עֹשֶׂ֥ה רָ֛ע מְאַ֖ת וּ/מַאֲרִ֣יךְ ל֑/וֹ כִּ֚י גַּם יוֹדֵ֣עַ אָ֔נִי אֲשֶׁ֤ר יִהְיֶה טּוֹב֙ לְ/יִרְאֵ֣י הָ/אֱלֹהִ֔ים אֲשֶׁ֥ר יִֽירְא֖וּ מִ/לְּ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/012.yaml
  text: Though a sinner does evil a hundred times and prolongs his life[a], yet I also know that it will be well for those who fear God[b], who fear before him.
translation:
  language: de
  text: Auch wenn ein Sünder hundertmal Böses tut und lange lebt[a], weiß ich doch auch, dass es denen gut gehen wird[b], die Gott fürchten, die sich vor ihm fürchten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und sein Leben verlängert“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dass es gut sein wird für die, die Gott fürchten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: Auch wenn
  rationale: Die Partikel leitet im Zusammenhang einen konzessiven Nebensatz ein; „Auch wenn“ gibt diesen Sinn in modernem Deutsch natürlich wieder.
- source_word: חֹטֶא
  choice: ein Sünder
  rationale: Das substantivisch gebrauchte Partizip bezeichnet einen Menschen, der durch Sündigen gekennzeichnet ist; der Singular bleibt erhalten.
- source_word: עֹשֶׂה רָע
  choice: Böses tut
  rationale: Die Formulierung bewahrt die konkrete verbale Aussage und klingt im Deutschen natürlich.
- source_word: מְאַת
  choice: hundertmal
  rationale: Das Zahlwort wird hier adverbial als Angabe wiederholten Handelns verstanden; die konkrete Zahl wird nicht zu „oft“ verallgemeinert.
- source_word: וּמַאֲרִיךְ לוֹ
  choice: und sein Leben verlängert
  rationale: Die hebräische Wendung spricht wörtlich vom Verlängern für ihn beziehungsweise für sich; im Kontext ist eine Verlängerung des Lebens gemeint. Die mögliche idiomatische Wiedergabe „und lange lebt“ wird in der Fußnote genannt.
- source_word: כִּי גַּם
  choice: weiß ich doch auch
  rationale: „Doch“ markiert den Gegensatz zum konzessiven Vordersatz, während „auch“ die additive beziehungsweise hervorhebende Kraft von גַּם wahrt.
- source_word: יוֹדֵעַ אָנִי
  choice: weiß ich
  rationale: Die explizite erste Person wird im deutschen Verb ausgedrückt; die Wortstellung nach „doch auch“ trägt die Betonung natürlich weiter.
- source_word: אֲשֶׁר יִהְיֶה טּוֹב
  choice: dass es … gut gehen wird
  rationale: Die idiomatische deutsche Wendung gibt die zukunftsbezogene Zusicherung wieder, ohne die Alternative „dass es gut sein wird“ auszuschließen.
- source_word: לְיִרְאֵי הָאֱלֹהִים
  choice: denen …, die Gott fürchten
  rationale: Das substantivierte Partizip wird als Personengruppe wiedergegeben und behält zugleich seinen verbalen Charakter.
- source_word: אֲשֶׁר יִירְאוּ מִלְּפָנָיו
  choice: die sich vor ihm fürchten
  rationale: Die Wiederholung der Wurzel für „fürchten“ bleibt sichtbar; „vor ihm“ bewahrt die räumlich-ehrfürchtige Nuance von מִלְּפָנָיו.
theological_decisions:
- issue: Bezug des pronominalen Suffixes in מִלְּפָנָיו
  choice: „vor ihm“, bezogen auf Gott
  alternative: „vor Gott“ zur ausdrücklicheren Klarstellung
  rationale: Der nächste und natürlichste Bezug ist „Gott“. Das Pronomen wahrt den Zusammenhang des Hebräischen und vermeidet unnötige Wiederholung.
- issue: Verhältnis zwischen langem Leben des Sünders und dem Wohlergehen der Gottesfürchtigen
  choice: Die Spannung bleibt durch den konzessiven Satzbau erhalten.
  alternative: Den langen Bestand des Sünders ausdrücklich als bloßen Aufschub des Gerichts deuten.
  rationale: Der Vers selbst erklärt nicht, weshalb der Sünder lange lebt; er stellt diesem Befund lediglich die Gewissheit gegenüber, dass es den Gottesfürchtigen gut gehen wird. Eine weitergehende Deutung würde den Text vereindeutigen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die doppelte Aussage des Fürchtens wird bewusst beibehalten, ebenso die Spannung zwischen dem langen Leben des Sünders und der Zuversicht für die Gottesfürchtigen.
