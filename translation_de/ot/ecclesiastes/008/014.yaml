id: ECC.8.14
reference: Ecclesiastes 8:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יֶשׁ הֶבֶל֮ אֲשֶׁ֣ר נַעֲשָׂ֣ה עַל הָ/אָרֶץ֒ אֲשֶׁ֣ר יֵ֣שׁ צַדִּיקִ֗ים אֲשֶׁ֨ר מַגִּ֤יעַ אֲלֵ/הֶם֙ כְּ/מַעֲשֵׂ֣ה הָ/רְשָׁעִ֔ים וְ/יֵ֣שׁ רְשָׁעִ֔ים שֶׁ/מַּגִּ֥יעַ אֲלֵ/הֶ֖ם כְּ/מַעֲשֵׂ֣ה הַ/צַּדִּיקִ֑ים אָמַ֕רְתִּי שֶׁ/גַּם זֶ֖ה הָֽבֶל־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/014.yaml
  text: 'There is a vanity that is done on the earth: there are righteous people to whom it happens according to the deeds of the wicked[a], and there are wicked people to whom it happens according to the deeds of the righteous. I said that this too is vanity.'
translation:
  language: de
  text: 'Es gibt eine Nichtigkeit[a], die auf der Erde geschieht: Es gibt Gerechte, denen widerfährt, was den Taten der Frevler entspricht, und es gibt Frevler, denen widerfährt, was den Taten der Gerechten entspricht. Ich sagte: Auch das ist Nichtigkeit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Vergänglichkeit“ oder „Hauch“. Das hebräische Wort הֶבֶל ist ein Leitwort im Buch Prediger für das, was flüchtig, unfassbar oder auf widersinnige Weise vergeblich ist.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶבֶל
  choice: Nichtigkeit
  rationale: Das Leitwort des Predigerbuches bezeichnet etwas Flüchtiges, Unfassbares oder widersinnig Vergebliches. „Nichtigkeit“ bewahrt die wiederkehrende Begrifflichkeit und passt hier zur enttäuschenden Verkehrung gerechter Erwartungen, ohne den Ausdruck auf „Sinnlosigkeit“ zu verengen.
- source_word: נַעֲשָׂה
  choice: geschieht
  rationale: Das Niphal von עשה bezeichnet hier etwas, das sich ereignet. „Geschieht“ ist im Deutschen natürlicher als das formal mögliche „getan wird“.
- source_word: עַל הָאָרֶץ
  choice: auf der Erde
  rationale: Dies entspricht der Formulierung des hebräischen Textes und vermeidet, sie durch die an anderen Stellen gebrauchte Wendung „unter der Sonne“ zu ersetzen.
- source_word: צַדִּיקִים
  choice: Gerechte
  rationale: Das substantivierte Adjektiv bezeichnet Menschen, die der moralischen Kategorie der Gerechten angehören, und bildet den direkten Gegensatz zu den Frevlern.
- source_word: מַגִּיעַ אֲלֵהֶם
  choice: ihnen widerfährt
  rationale: Die Wendung beschreibt das Geschick, das jemanden erreicht oder trifft. „Widerfährt“ gibt dies knapp und in einem würdigen, noch geläufigen Register wieder.
- source_word: כְּמַעֲשֵׂה
  choice: was den Taten … entspricht
  rationale: Die Formulierung bewahrt den Vergleich mit dem Tun der jeweiligen Gruppe und macht im Deutschen verständlich, dass es um das ihnen entsprechende Geschick geht, ohne ausdrücklich eine Vergeltungslehre in den Text einzutragen.
- source_word: רְשָׁעִים
  choice: Frevler
  rationale: „Frevler“ bezeichnet moralisch schuldige oder böse Menschen und erhält den weisheitlichen Gegensatz zu „Gerechte“, ohne die stärker religionsbezogene Deutung „Gottlose“ festzulegen.
- source_word: אָמַרְתִּי
  choice: Ich sagte
  rationale: Die schlichte Wiedergabe wahrt die direkte Ich-Aussage und deutet sie nicht ausdrücklich als Schlussfolgerung oder Urteil aus.
- source_word: שֶׁגַּם זֶה הָבֶל
  choice: Auch das ist Nichtigkeit
  rationale: Die Stellung von „auch“ klingt im Deutschen natürlich und erhält sowohl den Rückverweis als auch die refrainartige Wiederholung des Leitworts.
theological_decisions:
- issue: Bedeutung des Leitworts הֶבֶל
  choice: Nichtigkeit
  alternative: Vergänglichkeit; Hauch; Sinnlosigkeit
  rationale: Der Kontext betont die widersinnige Diskrepanz zwischen moralischem Handeln und erfahrenem Geschick. „Nichtigkeit“ lässt zugleich die weiteren Bedeutungsaspekte des Leitworts offen; „Sinnlosigkeit“ würde eine umfassende philosophische Aussage stärker festlegen, als der hebräische Ausdruck verlangt.
- issue: Verhältnis zwischen Taten und widerfahrendem Geschick
  choice: „was den Taten … entspricht“
  alternative: „als hätten sie die Taten … begangen“
  rationale: Der Text stellt eine paradoxe Entsprechung zwischen dem Geschick einer Gruppe und den Taten der jeweils anderen fest. Die gewählte Fassung wahrt diese Spannung, ohne zu behaupten, die Gerechten oder Frevler hätten tatsächlich wie die Gegengruppe gehandelt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzparallelität des Hebräischen und die zweimalige Verwendung des Leitworts „Nichtigkeit“ bleiben erhalten. „Frevler“ gehört zu einem gehobenen weisheitlichen Register, ist aber verständlich und vermeidet die mögliche Engführung von „Gottlose“.
