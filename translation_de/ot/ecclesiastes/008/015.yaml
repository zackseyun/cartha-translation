source:
  edition: WLC
  text: וְ/שִׁבַּ֤חְתִּֽי אֲנִי֙ אֶת הַ/שִּׂמְחָ֔ה אֲשֶׁ֨ר אֵֽין ט֤וֹב לָֽ/אָדָם֙ תַּ֣חַת הַ/שֶּׁ֔מֶשׁ כִּ֛י אִם לֶ/אֱכ֥וֹל וְ/לִ/שְׁתּ֖וֹת וְ/לִ/שְׂמ֑וֹחַ וְ/ה֞וּא יִלְוֶ֣/נּוּ בַ/עֲמָל֗/וֹ יְמֵ֥י חַיָּ֛י/ו אֲשֶׁר נָֽתַן ל֥/וֹ הָ/אֱלֹהִ֖ים תַּ֥חַת הַ/שָּֽׁמֶשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/015.yaml
  text: So I commended joy[a], because there is nothing better for man under the sun than to eat and to drink and to rejoice[c][b]; and this will accompany him in his labor during the days of his life that God has given him under the sun.
translation:
  language: de
  text: Und ich lobte die Freude[a]; denn für den Menschen[b] gibt es unter der Sonne nichts Besseres, als zu essen und zu trinken und sich zu freuen. Und das wird ihn in seiner Mühe begleiten[c] während der Tage seines Lebens, die Gott ihm unter der Sonne gegeben hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und ich pries die Freude.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich auch möglich: „Für den Menschen gibt es nichts Gutes unter der Sonne außer …“'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Und es wird ihn bei seiner Mühe begleiten.“ „Das“ kann die Freude oder zusammenfassend das zuvor beschriebene freudige Genießen bezeichnen.'
    reason: ambiguity
lexical_decisions:
- source_word: וְשִׁבַּחְתִּי
  choice: Darum lobte ich
  rationale: שׁבח im Piel bedeutet „loben, preisen“. „Lobte“ ist im modernen Deutsch natürlich und bewahrt die wertende Aussage; „darum“ gibt den folgernden Anschluss des וְ im Kontext wieder.
- source_word: הַשִּׂמְחָה
  choice: die Freude
  rationale: „Freude“ ist die breite, natürliche Entsprechung und greift ein wiederkehrendes Thema des Predigerbuchs auf.
- source_word: אֵין טוֹב לָאָדָם
  choice: für den Menschen gibt es … nichts Besseres
  rationale: Die Formulierung gibt den hier naheliegenden komparativen Sinn der hebräischen Wendung verständlich wieder, ohne die wörtlich mögliche Lesart „es gibt nichts Gutes“ in den Haupttext zu übernehmen.
- source_word: לָאָדָם
  choice: für den Menschen
  rationale: Der generische Singular bezeichnet den Menschen allgemein. Das deutsche „der Mensch“ bewahrt Singular und Allgemeingültigkeit, ohne die Aussage auf Männer zu beschränken.
- source_word: תַּחַת הַשֶּׁמֶשׁ
  choice: unter der Sonne
  rationale: Die wörtliche, etablierte Wiedergabe bewahrt ein wichtiges Leitmotiv des Predigerbuchs.
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת וְלִשְׂמוֹחַ
  choice: zu essen und zu trinken und sich zu freuen
  rationale: Die dreigliedrige Infinitivfolge und ihre wiederholten Bindewörter werden erhalten; „sich freuen“ gibt die verbale Aussage natürlich wieder.
- source_word: וְהוּא יִלְוֶנּוּ
  choice: Und das wird ihn … begleiten
  rationale: „Das“ fasst die zuvor beschriebene Freude beziehungsweise das freudige Genießen zusammen. Es vermeidet, das maskuline Pronomen wegen des deutschen Genus von „Freude“ künstlich mit „sie“ wiederzugeben, und erhält zugleich die mögliche zusammenfassende Bezugnahme.
- source_word: בַעֲמָלוֹ
  choice: bei seiner Mühe
  rationale: עָמָל bezeichnet im Predigerbuch häufig belastende Arbeit oder Mühsal. „Mühe“ ist verständlich und bewahrt den beschwerlichen Unterton.
- source_word: יְמֵי חַיָּיו אֲשֶׁר נָתַן לוֹ הָאֱלֹהִים
  choice: während der Tage seines Lebens, die Gott ihm … gegeben hat
  rationale: Die Formulierung erhält das Leben als Gabe Gottes und bezeichnet dessen zeitliche Dauer, ohne ein im Hebräischen nicht ausdrücklich vorhandenes „alle“ einzufügen.
theological_decisions:
- issue: Generischer Singular אָדָם
  choice: der Mensch
  alternative: ein Mensch; die Menschen
  rationale: Die Aussage gilt allgemein für Menschen und ist nicht auf Männer beschränkt. „Der Mensch“ bewahrt dennoch den generischen Singular des Ausgangstextes.
- issue: Bezug von וְהוּא in „und das wird ihn begleiten“
  choice: zusammenfassender Bezug auf die Freude beziehungsweise das freudige Genießen
  alternative: unmittelbarer Bezug allein auf „die Freude“
  rationale: Das maskuline הוּא kann zusammenfassend auf den vorausgehenden Sachverhalt weisen. „Das“ wahrt diese Offenheit besser als ein durch das deutsche Genus erzwungenes „sie“.
- issue: Sinn von אֵין טוֹב
  choice: nichts Besseres
  alternative: nichts Gutes
  rationale: Im Zusammenhang führt כִּי אִם die als beste beziehungsweise einzig sinnvolle Möglichkeit dargestellte Lebensweise ein. Die komparative Wiedergabe ist idiomatisch und kontextuell wahrscheinlich; die formal mögliche Alternative wird in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die charakteristische Wendung „unter der Sonne“ und die hebräische Reihung mit wiederholtem „und“ bleiben erhalten. „Mühe“ trägt den belastenden Beiklang von עָמָל, ohne altertümlich zu wirken.
