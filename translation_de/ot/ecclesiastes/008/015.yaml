- from: Darum lobte ich die Freude[a]; denn für den Menschen[b] gibt es unter der Sonne nichts Besseres, als zu essen und zu trinken und sich zu freuen. Und das wird ihn bei seiner Mühe begleiten[c] während der Tage seines Lebens, die Gott ihm unter der Sonne gegeben hat.
  to: Und ich lobte die Freude[a]; denn für den Menschen[b] gibt es unter der Sonne nichts Besseres, als zu essen und zu trinken und sich zu freuen. Und das wird ihn in seiner Mühe begleiten[c] während der Tage seines Lebens, die Gott ihm unter der Sonne gegeben hat.
