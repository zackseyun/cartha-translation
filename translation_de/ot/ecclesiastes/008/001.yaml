  variant: modern standard German
source:
  edition: WLC
  text: מִ֚י כְּ/הֶ֣/חָכָ֔ם וּ/מִ֥י יוֹדֵ֖עַ פֵּ֣שֶׁר דָּבָ֑ר חָכְמַ֤ת אָדָם֙ תָּאִ֣יר פָּנָ֔י/ו וְ/עֹ֥ז פָּנָ֖י/ו יְשֻׁנֶּֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/001.yaml
  text: Who is like the wise man[a], and who knows the interpretation of a matter? A man's wisdom lights up his face[b], and the hardness of his face is changed.
translation:
  language: de
  text: Wer ist wie der Weise, und wer kennt die Deutung einer Sache? Die Weisheit eines Menschen[a] lässt sein Gesicht leuchten, und die Härte seines Gesichts[b] verändert sich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht „die Weisheit eines Menschen“; der Singular ist allgemein beziehungsweise repräsentativ gemeint.
    reason: generic_singular_clarification
  - marker: b
    text: „Härte“ kann hier auch die Stärke, Kühnheit oder Strenge des Gesichtsausdrucks bezeichnen. Die hebräische Wendung ist nicht eindeutig.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי כְּהֶחָכָם
  choice: Wer ist wie der Weise
  rationale: מִי eröffnet eine rhetorische Frage; כְּ bezeichnet den Vergleich, und הֶחָכָם ist ein bestimmtes substantiviertes Adjektiv im Singular. „Der Weise“ bewahrt diese Form und klingt im Deutschen würdig und natürlich.
- source_word: יוֹדֵעַ
  choice: kennt
  rationale: Das Verb bezeichnet hier das Wissen um beziehungsweise Erfassen einer Deutung. „Kennt“ gibt die Grundbedeutung direkt wieder, ohne stärker als der Ausgangstext auf bloßes intellektuelles Verstehen festzulegen.
- source_word: פֵּשֶׁר דָּבָר
  choice: die Deutung einer Sache
  rationale: פֵּשֶׁר meint Deutung oder Erklärung; דָּבָר ist weit gefasst und kann eine Sache oder Angelegenheit bezeichnen. „Deutung einer Sache“ erhält die offene, weisheitliche Formulierung.
- source_word: חָכְמַת אָדָם
  choice: Die Weisheit eines Menschen
  rationale: Die hebräische Genitivverbindung verwendet אָדָם generisch im Singular. „Eines Menschen“ bewahrt Singular und Allgemeingültigkeit in natürlichem modernem Deutsch.
- source_word: תָּאִיר פָּנָיו
  choice: lässt sein Gesicht leuchten
  rationale: 'Die Hifil-Form von אור hat kausativen Sinn: Weisheit bewirkt, dass das Gesicht hell wird oder leuchtet. Die deutsche Wendung ist anschaulich und idiomatisch.'
- source_word: עֹז פָּנָיו
  choice: die Härte seines Gesichts
  rationale: עֹז bedeutet grundsätzlich Stärke oder Festigkeit; in Verbindung mit dem Gesicht kann es dessen harten, strengen oder kühnen Ausdruck bezeichnen. „Härte“ wahrt das Bild und lässt die genaue Nuance offen.
- source_word: יְשֻׁנֶּא
  choice: verändert sich
  rationale: Die Form von שנה bezeichnet eine Veränderung. Das deutsche reflexive Passiväquivalent ist natürlicher als „wird verändert“ und macht keinen ausdrücklich genannten Handelnden erforderlich.
theological_decisions:
- issue: Generischer Singular אָדָם
  choice: eines Menschen
  alternative: eines Mannes; menschliche Weisheit
  rationale: אָדָם bezeichnet hier einen Menschen in allgemeiner, repräsentativer Weise. „Eines Menschen“ gibt diese Reichweite wieder, ohne die Aussage unnötig auf Männer zu begrenzen oder den konkreten Singular in ein Abstraktum aufzulösen.
- issue: Wirkung der Weisheit auf עֹז פָּנָיו
  choice: Die Härte seines Gesichts verändert sich
  alternative: Der trotzige/strenge Ausdruck seines Gesichts wird verändert; die Kühnheit seines Gesichts verdoppelt sich
  rationale: Die traditionelle Vokalisierung versteht יְשֻׁנֶּא als Form von שנה, „verändert werden“. Was עֹז im Gesicht genau bezeichnet, bleibt idiomatisch mehrdeutig; deshalb wird weder eine moralische Besserung noch eine bestimmte innere Verwandlung ausdrücklich behauptet.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, weisheitlichem Ton. Der Parallelismus und die wiederholte Rede vom „Gesicht“ bleiben sichtbar; schwer verständliche Idiomatik wird nicht vorschnell theologisch aufgelöst.
