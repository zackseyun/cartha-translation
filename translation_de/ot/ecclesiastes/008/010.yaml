  text: וּ/בְ/כֵ֡ן רָאִיתִי֩ רְשָׁעִ֨ים קְבֻרִ֜ים וָ/בָ֗אוּ וּ/מִ/מְּק֤וֹם קָדוֹשׁ֙ יְהַלֵּ֔כוּ וְ/יִֽשְׁתַּכְּח֥וּ בָ/עִ֖יר אֲשֶׁ֣ר כֵּן עָשׂ֑וּ גַּם זֶ֖ה הָֽבֶל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/010.yaml
  text: And so I saw the wicked buried[a]; they had come and gone from the holy place, and they were forgotten in the city where they had done so[c][b]. This too is vanity.
translation:
  language: de
  text: Und so sah ich, wie Gottlose begraben wurden. Sie waren gekommen und vom heiligen Ort[b] fortgegangen, und in der Stadt, in der sie so gehandelt hatten, wurden sie vergessen.[a] Auch das ist nichtig.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nach einigen alten Übersetzungen und bei anderer Deutung des hebräischen Textes: »… und in der Stadt, in der sie so gehandelt hatten, wurden sie gerühmt.«'
    reason: textual_variant
  - marker: b
    text: Mit dem »heiligen Ort« können der Tempelbezirk oder ein anderer geweihter Ort gemeint sein.
    reason: cultural_note
  - marker: c
    text: Das hebräische Wort hevel, hier mit »nichtig« wiedergegeben, bedeutet auch »Hauch« oder »Dunst« und kann etwas Flüchtiges oder schwer Fassbares bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכֵן
  choice: Und so
  rationale: Gibt sowohl die verbindende Funktion des ו als auch die folgernde bzw. überleitende Bedeutung von בְכֵן in natürlichem Deutsch wieder.
- source_word: רְשָׁעִים קְבֻרִים
  choice: wie Gottlose begraben wurden
  rationale: Die Konstruktion nach »ich sah« wird im Deutschen mit einem abhängigen Satz idiomatisch wiedergegeben; »Gottlose« bewahrt die moralische Kategorie des Hebräischen.
- source_word: וָבָאוּ וּמִמְּקוֹם קָדוֹשׁ יְהַלֵּכוּ
  choice: Sie waren gekommen und vom heiligen Ort wieder fortgegangen
  rationale: Bewahrt die schwer verständliche Bewegungsfolge des Hebräischen, ohne ausdrücklich festzulegen, zu welchem Zweck die Gottlosen den heiligen Ort aufsuchten. »Wieder fortgegangen« ergibt im Deutschen einen natürlichen Zusammenhang.
- source_word: וְיִשְׁתַּכְּחוּ
  choice: wurden sie vergessen
  rationale: Folgt der masoretischen Lesung und der gewöhnlichen Bedeutung der Wurzel שכח. Die alte Alternativüberlieferung »wurden gerühmt« wird in einer Fußnote erhalten.
- source_word: בָעִיר אֲשֶׁר כֵּן עָשׂוּ
  choice: in der Stadt, in der sie so gehandelt hatten
  rationale: »So gehandelt« wahrt den knappen, rückbezüglichen und inhaltlich nicht näher bestimmten Ausdruck אֲשֶׁר כֵּן עָשׂוּ.
- source_word: גַּם זֶה הָבֶל
  choice: Auch das ist nichtig
  rationale: »Nichtig« gibt den wertenden Sinn des wiederkehrenden הֶבֶל-Refrains knapp und würdig wieder; das zugrunde liegende Bild von Hauch bzw. Dunst wird in der Fußnote erläutert.
theological_decisions:
- issue: Bezug der Gottlosen zum heiligen Ort
  choice: Der Text sagt lediglich, dass sie gekommen und vom heiligen Ort wieder fortgegangen waren.
  alternative: Ihre Anwesenheit dort ausdrücklich als religiöse Heuchelei oder als Tempeldienst zu deuten.
  rationale: Die hebräische Syntax ist schwierig und nennt weder den Zweck ihres Kommens noch ihr genaues Verhalten am heiligen Ort. Die Übersetzung bewahrt diese Spannung.
- issue: 'Überlieferungsfrage: vergessen oder gerühmt'
  choice: Im Haupttext steht gemäß dem masoretischen Text »wurden sie vergessen«.
  alternative: »wurden sie gerühmt« nach einigen alten Übersetzungen und einer anderen Deutung der Textüberlieferung.
  rationale: Die masoretische Lesung bietet den unmittelbar vorliegenden hebräischen Wortlaut; die bedeutsame alte Alternative wird jedoch nicht verschwiegen, sondern in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die schwer verständliche Satzfolge wird maßvoll geglättet, ohne den Zweck des Besuchs am heiligen Ort oder den Inhalt des Handelns näher festzulegen. Sämtliche Fußnotenmarker stehen unmittelbar bei der jeweils erläuterten Wendung.
