  yaml_path: translation/ot/ecclesiastes/008/002.yaml
  text: I say[a], keep the king’s command[c][b], because of your oath before God.
translation:
  language: de
  text: 'Ich sage[a]: Befolge den Befehl des Königs[b] wegen deines Eides vor Gott[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, mit anderer Gliederung: „Befolge den Befehl des Königs – und zwar wegen des Eides Gottes.“ Der hebräische Satz ist stark verkürzt und lässt verschiedene syntaktische Verknüpfungen zu.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „den Mund eines Königs“.'
    reason: lexical_alternative
  - marker: c
    text: „Eid vor Gott“ kann auch als „Eid gegenüber Gott“ oder „Eid Gottes“ verstanden werden.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲנִי
  choice: Ich sage
  rationale: Das selbstständige Pronomen „ich“ steht unvermittelt am Satzanfang; ein Verb ist vermutlich mitzudenken. „Ich sage“ ergänzt nur das für einen verständlichen deutschen Satz Nötige.
- source_word: פִּי מֶלֶךְ
  choice: den Befehl des Königs
  rationale: Wörtlich steht „den Mund eines Königs“. Gemeint ist idiomatisch das, was der König ausspricht und verbindlich anordnet.
- source_word: שְׁמֹר
  choice: Befolge
  rationale: Das Verb kann „bewahren, beachten, einhalten“ bedeuten. Bei einem königlichen Befehl gibt „befolge“ den kontextuellen Sinn natürlich wieder.
- source_word: וְעַל דִּבְרַת
  choice: wegen
  rationale: Die verdichtete Verbindung bezeichnet hier wahrscheinlich den Grund oder Beweggrund des geforderten Handelns. Das einleitende וְ kann jedoch auch koordinierend verstanden werden; darauf weist Fußnote [a] hin.
- source_word: שְׁבוּעַת אֱלֹהִים
  choice: deines Eides vor Gott
  rationale: Die Genitivverbindung ist mehrdeutig. Im Zusammenhang liegt ein Eid des Angesprochenen unter Gottes Zeugenschaft nahe; die anderen grammatisch möglichen Beziehungen werden in Fußnote [c] offengehalten.
theological_decisions:
- issue: Verhältnis des „Eides Gottes“ zum Gehorsam gegenüber dem König
  choice: Ein vom Angesprochenen vor Gott geleisteter Eid begründet die Aufforderung, den königlichen Befehl zu befolgen.
  alternative: Gemeint sein kann auch ein Gott geleisteter Eid oder ein Eid, der von Gott ausgeht beziehungsweise ihm gehört.
  rationale: Der Imperativ richtet sich an den Hörer und legt einen ihn bindenden Eid nahe. Da die hebräische Genitivverbindung die genaue Beziehung nicht festlegt, wird die Mehrdeutigkeit ausdrücklich vermerkt; daraus wird keine Lehre uneingeschränkter Königstreue abgeleitet.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. „Befolge“ ist bei „Befehl“ idiomatischer als das wörtlichere „bewahre“. Die knappe hebräische Syntax wird im Haupttext lesbar entfaltet, während die Fußnoten ihre echte syntaktische und theologische Mehrdeutigkeit bewahren.
