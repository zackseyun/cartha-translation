  text: אֶת כָּל זֶ֤ה רָאִ֨יתִי֙ וְ/נָת֣וֹן אֶת לִבִּ֔/י לְ/כָֽל מַעֲשֶׂ֔ה אֲשֶׁ֥ר נַעֲשָׂ֖ה תַּ֣חַת הַ/שָּׁ֑מֶשׁ עֵ֗ת אֲשֶׁ֨ר שָׁלַ֧ט הָ/אָדָ֛ם בְּ/אָדָ֖ם לְ/רַ֥ע לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/009.yaml
  text: All this I have seen[a], while applying my heart to every deed that is done under the sun, at a time when man has ruled over man to his harm.
translation:
  language: de
  text: Dies alles habe ich gesehen, während ich mein Herz auf jedes Werk richtete, das unter der Sonne getan wird, zu einer Zeit, in der ein Mensch über einen anderen herrscht – zu seinem Schaden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Zu seinem Schaden“ kann sich entweder auf den Menschen beziehen, der beherrscht wird, oder auf den, der herrscht.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: רָאִיתִי
  choice: habe ich gesehen
  rationale: Das Perfekt gibt die rückblickende, aus wiederholter Erfahrung gewonnene Beobachtung des Predigers im heutigen Deutsch natürlich wieder.
- source_word: וְנָתוֹן אֶת־לִבִּי
  choice: als ich mein Herz … richtete
  rationale: Die Wendung bezeichnet bewusstes, nachdenkliches Zuwenden. „Mein Herz richten“ bewahrt das hebräische Bild; „als“ verbindet die Konstruktion idiomatisch mit dem vorausgehenden Sehen.
- source_word: מַעֲשֶׂה
  choice: Tun
  rationale: „Tun“ bezeichnet hier umfassend das, was geschieht oder getan wird, ohne den Sinn auf Erwerbsarbeit einzuengen.
- source_word: נַעֲשָׂה
  choice: geschieht
  rationale: Im Deutschen passt „geschieht“ natürlich zu „Tun“ und umfasst sowohl menschliche Handlungen als auch das Geschehen unter der Sonne.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: unter der Sonne
  rationale: Die charakteristische Formel des Predigerbuches wird wörtlich und wiedererkennbar beibehalten.
- source_word: עֵת אֲשֶׁר
  choice: Es gibt eine Zeit, in der
  rationale: Diese Wiedergabe macht das temporale Substantiv עֵת ausdrücklich und führt den beobachteten Umstand in natürlichem Deutsch ein.
- source_word: שָׁלַט
  choice: herrscht
  rationale: Das Verb bezeichnet die Ausübung von Macht oder Herrschaft; „herrscht über“ ist prägnant und nicht unnötig deutend.
- source_word: הָאָדָם בְּאָדָם
  choice: ein Mensch über einen anderen
  rationale: Die Formulierung gibt die Beziehung zwischen zwei Menschen natürlich und geschlechtsübergreifend wieder, ohne die Aussage auf Männer oder auf die Menschheit als Kollektiv zu verengen.
- source_word: לְרַע לוֹ
  choice: zu seinem Schaden
  rationale: Die knappe Form wahrt die mögliche Rückbeziehung des Pronomens und legt nicht stillschweigend fest, ob der Beherrschte oder der Herrschende Schaden nimmt.
theological_decisions:
- issue: Bezug von לוֹ in לְרַע לוֹ
  choice: Die Mehrdeutigkeit bleibt in „zu seinem Schaden“ erhalten.
  alternative: „zum Schaden des anderen“ oder „zu seinem eigenen Schaden“
  rationale: Das maskuline Singularpronomen kann grammatisch auf den beherrschten Menschen oder auf den Herrschenden bezogen werden. Der Ausgangstext entscheidet dies nicht ausdrücklich; daher wird keine der beiden theologischen beziehungsweise ethischen Lesarten im Haupttext festgelegt.
- issue: Generische Bedeutung von אָדָם
  choice: ein Mensch … einen anderen
  alternative: der Mensch … den Menschen; ein Mann … einen anderen Mann
  rationale: אָדָם bezeichnet hier Menschen in einer sprichwortartig-allgemeinen Machtbeziehung. Die gewählte Form ist im modernen Standarddeutsch natürlich und wahrt den individuellen Singular.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrten Leitbildern des Hebräischen („mein Herz“, „unter der Sonne“). Der Doppelpunkt und der Gedankenstrich strukturieren den langen Reflexionssatz, ohne seine gedankliche Spannung aufzulösen.
