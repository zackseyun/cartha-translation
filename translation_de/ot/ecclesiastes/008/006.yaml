source:
  edition: WLC
  text: כִּ֣י לְ/כָל חֵ֔פֶץ יֵ֖שׁ עֵ֣ת וּ/מִשְׁפָּ֑ט כִּֽי רָעַ֥ת הָ/אָדָ֖ם רַבָּ֥ה עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/006.yaml
  text: For every matter there is a time and a judgment[b][a], because the evil of man weighs heavily upon him.
translation:
  language: de
  text: Denn für jede Angelegenheit gibt es eine Zeit und ein Urteil[a], denn das Unheil des Menschen lastet schwer auf ihm.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Recht“, „eine Entscheidung“ oder „eine angemessene Ordnung“; „Angelegenheit“ kann auch „Vorhaben“ oder „Zweck“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „das Böse des Menschen ist groß über ihm“; auch „die Not“ oder „das Elend des Menschen“ ist möglich.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Das erste כִּי begründet die Aussage aus dem vorangehenden Zusammenhang; „Denn“ gibt diese Funktion im Deutschen natürlich wieder.
- source_word: לְכָל חֵפֶץ
  choice: für jede Angelegenheit
  rationale: חֵפֶץ kann Wunsch, Vorhaben, Zweck oder Angelegenheit bezeichnen. Zusammen mit „Zeit“ ist hier der breite, sachbezogene Sinn „Angelegenheit“ passend.
- source_word: יֵשׁ עֵת
  choice: gibt es eine Zeit
  rationale: Die schlichte Existenzkonstruktion bleibt erhalten, ohne eine ausdrücklich festgesetzte Zeit in den Text hineinzulesen.
- source_word: וּמִשְׁפָּט
  choice: und ein Urteil
  rationale: מִשְׁפָּט kann Urteil, Recht, gerichtliche Entscheidung oder angemessene Ordnung bedeuten. „Urteil“ bewahrt den rechtlichen Kern und die Mehrdeutigkeit besser als eine erklärende Umschreibung.
- source_word: כִּי
  choice: doch
  rationale: Das zweite כִּי lässt sich kausal verstehen, kann im Zusammenhang aber auch die belastende Gegenlage hervorheben. „Doch“ stellt den Kontrast zwischen der geordneten Zeit beziehungsweise Entscheidung und der schweren menschlichen Not idiomatisch dar, ohne eine unnatürliche deutsche Begründung zu erzwingen.
- source_word: רָעַת הָאָדָם
  choice: das Unheil des Menschen
  rationale: רָעָה umfasst Böses, Not, Unglück und Unheil. „Unheil“ lässt offen, ob eigenes böses Tun, erfahrene Not oder beides gemeint ist, und passt zur Belastung, die auf dem Menschen liegt.
- source_word: הָאָדָם
  choice: des Menschen
  rationale: Der bestimmte Singular ist generisch. „Der Mensch“ entspricht dieser Form im modernen Standarddeutsch und bezeichnet den Menschen allgemein.
- source_word: רַבָּה עָלָיו
  choice: lastet schwer auf ihm
  rationale: Die wörtliche Vorstellung, dass etwas „groß auf ihm“ ist, wird als schwere Belastung natürlich und bildhaft wiedergegeben.
theological_decisions:
- issue: Bedeutungsumfang von רָעָה
  choice: Unheil
  alternative: Böses; Not; Elend
  rationale: Der Kontext erlaubt sowohl moralisches Böses als auch erfahrene Not. „Unheil“ wahrt diese Spannung; die Fußnote nennt die wichtigsten Alternativen.
- issue: Generischer Gebrauch von הָאָדָם
  choice: des Menschen
  alternative: der Menschheit
  rationale: Der hebräische Singular wird bewahrt, während die Formulierung im Deutschen eindeutig allgemein-menschlich verstanden werden kann.
- issue: Verhältnis des zweiten כִּי zum ersten Satzteil
  choice: kontrastierend mit „doch“
  alternative: kausal mit „denn/weil“
  rationale: Ein kausales Verständnis ist grammatisch möglich, ergibt im Deutschen aber einen schwer bestimmbaren Begründungszusammenhang. Der Kontext von 8,5–7 unterstützt auch eine adversative Nuance; die Übersetzung legt keine weitergehende theologische Deutung fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt knapp und nahe am Hebräischen; „lastet schwer“ gibt das hebräische Belastungsbild idiomatisch wieder. Alle Fußnotenmarker stehen an der jeweils einschlägigen Stelle im Haupttext.
