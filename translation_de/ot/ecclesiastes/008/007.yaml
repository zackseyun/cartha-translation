  yaml_path: translation/ot/ecclesiastes/008/007.yaml
  text: For he does not know what will be, for who can tell him how it will be?
translation:
  language: de
  text: Denn er weiß nicht, was geschehen wird; denn wer kann ihm sagen, wie es geschehen wird?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „denn wer kann ihm sagen, wann es geschehen wird?“ Das hebräische כַּאֲשֶׁר kann hier die Art und Weise beziehungsweise den Verlauf, aber auch den Zeitpunkt bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die Aussage im vorausgehenden Zusammenhang; „denn“ gibt diese erklärende Funktion im Deutschen knapp und natürlich wieder.
- source_word: אֵינֶנּוּ יֹדֵעַ
  choice: er weiß nicht
  rationale: Die Negation mit dem maskulinen Singularsuffix und das Partizip von ידע bezeichnen hier die Unkenntnis des allgemein verstandenen Menschen.
- source_word: מַה שֶּׁיִּהְיֶה
  choice: was geschehen wird
  rationale: Die Wendung bezeichnet das künftig Eintretende. „Geschehen“ ist im heutigen Deutsch natürlicher als das formal mögliche „sein“, ohne den Sinn einzuengen.
- source_word: כִּי
  choice: denn
  rationale: Das zweite כִּי führt die Begründung für die Unkenntnis des Zukünftigen ein und bewahrt so die parallele Struktur.
- source_word: כַּאֲשֶׁר יִהְיֶה
  choice: wie es geschehen wird
  rationale: כַּאֲשֶׁר kann hier die Weise beziehungsweise den Verlauf des Kommenden bezeichnen. Die Wiedergabe wahrt die Unterscheidung zum vorherigen „was geschehen wird“, ohne die alternative zeitliche Deutung auszuschließen.
- source_word: מִי יַגִּיד לוֹ
  choice: wer kann ihm sagen
  rationale: Der Hifil von נגד bedeutet „mitteilen, kundtun“. Das Modalverb „kann“ macht die rhetorisch vorausgesetzte Unmöglichkeit im natürlichen Deutschen deutlich.
