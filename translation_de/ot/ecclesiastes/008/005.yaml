source:
  edition: WLC
  text: שׁוֹמֵ֣ר מִצְוָ֔ה לֹ֥א יֵדַ֖ע דָּבָ֣ר רָ֑ע וְ/עֵ֣ת וּ/מִשְׁפָּ֔ט יֵדַ֖ע לֵ֥ב חָכָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/005.yaml
  text: Whoever keeps a command will not know an evil thing[b][a], and a wise heart knows the proper time and judgment.
translation:
  language: de
  text: Wer ein Gebot befolgt, wird nichts Schlimmes erfahren[a]; und ein weises Herz erkennt Zeit und Urteil[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wird keine schlimme/böse Sache kennen“. Gemeint sein kann moralisch Böses, hier aber wahrscheinlich eher Unheil, eine schädliche Folge oder Schwierigkeiten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „den richtigen Zeitpunkt und das rechte Vorgehen“. Das hebräische Wort für „Urteil“ kann auch Entscheidung, Recht oder Verfahren bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹמֵר
  choice: befolgt
  rationale: Das Partizip bezeichnet jemanden, der ein Gebot beachtet oder hält. „Befolgt“ gibt den Gehorsamsaspekt im modernen Deutschen natürlich wieder.
- source_word: מִצְוָה
  choice: ein Gebot
  rationale: Der Singular ist hier wahrscheinlich allgemein zu verstehen. Der unbestimmte Artikel bewahrt diesen generischen Sinn.
- source_word: לֹא יֵדַע
  choice: wird … nicht erfahren
  rationale: Das Imperfekt kann eine allgemeine Folge ausdrücken. Bei einem schlimmen Ereignis bezeichnet ידע idiomatisch auch das Erleben; „erfahren“ ist im Deutschen verständlicher als das wörtliche „kennen“.
- source_word: דָּבָר רָע
  choice: nichts Schlimmes
  rationale: Wörtlich steht „eine schlimme/böse Sache“. Im Zusammenhang ist wahrscheinlich ein schädliches Ereignis oder Unglück gemeint; „nichts Schlimmes“ wahrt die semantische Breite.
- source_word: וְעֵת
  choice: Zeit
  rationale: עֵת bezeichnet den Zeitpunkt oder die passende Zeit. Die knappe Wiedergabe „Zeit“ bewahrt die Mehrdeutigkeit und die enge Paarung mit „Urteil“.
- source_word: וּמִשְׁפָּט
  choice: Urteil
  rationale: מִשְׁפָּט kann Urteil, Entscheidung, Recht oder Verfahren bezeichnen. „Urteil“ erhält diese richterlich-weisheitliche Spannung, ohne vorschnell auf „richtiges Vorgehen“ einzuengen.
- source_word: יֵדַע לֵב חָכָם
  choice: ein weises Herz erkennt
  rationale: „Herz“ bleibt als hebräisches Bild für Einsicht und Urteilsvermögen erhalten. „Erkennt“ klingt bei der Wahrnehmung von Zeit und Urteil im Deutschen natürlich.
theological_decisions:
- issue: Allgemeiner Sinn des maskulinen Singulars שׁוֹמֵר
  choice: Wer ein Gebot befolgt
  alternative: Der das Gebot hält
  rationale: „Wer“ gibt die allgemeine Aussage geschlechtsübergreifend wieder, ohne aus dem grammatischen Maskulinum eine Beschränkung abzuleiten.
- issue: Weisheitssprachliches Menschenbild in לֵב חָכָם
  choice: ein weises Herz
  alternative: ein weiser Mensch
  rationale: Die Bildsprache des Herzens als Zentrum von Einsicht, Willen und Urteilsvermögen wird bewahrt und nicht auf bloße Verstandestätigkeit reduziert.
- issue: Reichweite der Verheißung לֹא יֵדַע דָּבָר רָע
  choice: wird nichts Schlimmes erfahren
  alternative: kennt nichts Böses
  rationale: Im Zusammenhang mit dem Befolgen eines königlichen Gebots liegt eine schädliche Folge nahe. Die Formulierung bleibt dennoch allgemein und macht daraus weder eine absolute Leidensfreiheit noch ausschließlich eine moralische Aussage.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Parallelstruktur und das hebräische Bild „ein weises Herz“ bleiben erhalten. Die schwer eindeutig festzulegende Verbindung „Zeit und Urteil“ wird im Haupttext bewusst knapp wiedergegeben und in der Fußnote erläutert.
