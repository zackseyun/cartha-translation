id: ECC.8.8
reference: Ecclesiastes 8:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֵ֣ין אָדָ֞ם שַׁלִּ֤יט בָּ/ר֨וּחַ֙ לִ/כְל֣וֹא אֶת הָ/ר֔וּחַ וְ/אֵ֤ין שִׁלְטוֹן֙ בְּ/י֣וֹם הַ/מָּ֔וֶת וְ/אֵ֥ין מִשְׁלַ֖חַת בַּ/מִּלְחָמָ֑ה וְ/לֹֽא יְמַלֵּ֥ט רֶ֖שַׁע אֶת בְּעָלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/008.yaml
  text: No man has power over the wind to restrain the wind[a], and there is no authority over the day of death, and there is no discharge in war, and wickedness will not deliver its master.
translation:
  language: de
  text: Kein Mensch hat Macht über den Wind, ihn zurückzuhalten[a]; und über den Tag des Todes hat niemand Macht. Im Krieg gibt es keine Entlassung, und Bosheit rettet ihren Herrn nicht[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kein Mensch hat Macht über den Geist, ihn zurückzuhalten.“ Das hebräische Wort kann „Wind“, „Geist“ oder „Lebenshauch“ bedeuten.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „ihren Besitzer“ oder „ihren Herrn“. Die Bosheit wird personifiziert; gemeint ist die Person, die ihr zugehört oder sie verübt.'
    reason: literal_rendering
lexical_decisions:
- source_word: אָדָם
  choice: Mensch
  rationale: Der generische Singular bezeichnet hier einen Menschen allgemein; „Mensch“ gibt dies im modernen Deutschen natürlich und ohne unnötige geschlechtliche Verengung wieder.
- source_word: שַׁלִּיט
  choice: hat Macht über
  rationale: Die Wendung bezeichnet Verfügungsgewalt oder Herrschaft und lässt sich mit dem folgenden בּ idiomatisch als „Macht über“ wiedergeben.
- source_word: רוּחַ
  choice: Wind
  rationale: Das Verb „zurückhalten/einschließen“ und die Reihe unbeherrschbarer Gegebenheiten sprechen im Kontext für „Wind“; „Geist“ oder „Lebenshauch“ bleibt jedoch möglich und wird in der Fußnote bewahrt.
- source_word: לִכְלוֹא
  choice: um ihn zurückzuhalten
  rationale: Das Verb bedeutet einsperren, einschließen oder zurückhalten. Beim Wind ist „zurückhalten“ im Deutschen natürlich.
- source_word: שִׁלְטוֹן
  choice: Macht
  rationale: Das Substantiv bezeichnet Herrschafts- oder Verfügungsgewalt. Die Wiederholung von „Macht“ bildet die hebräische Wortverwandtschaft mit שַׁלִּיט angemessen ab.
- source_word: בְּיוֹם הַמָּוֶת
  choice: über den Tag des Todes
  rationale: In Verbindung mit שִׁלְטוֹן bezeichnet die Präposition den Bereich, über den niemand verfügen kann.
- source_word: מִשְׁלַחַת
  choice: Entlassung
  rationale: Im militärischen Zusammenhang meint das Wort ein Fortschicken beziehungsweise eine Entlassung aus dem Dienst oder Kampf.
- source_word: בַּמִּלְחָמָה
  choice: im Krieg
  rationale: Die breite, direkte Wiedergabe wahrt den militärischen Zusammenhang, ohne den Ausdruck unnötig auf eine einzelne Schlacht zu begrenzen.
- source_word: רֶשַׁע
  choice: Bosheit
  rationale: Das abstrakte Substantiv bleibt abstrakt und wird wie im Hebräischen personifiziert.
- source_word: יְמַלֵּט
  choice: rettet ... nicht
  rationale: Das Verb bezeichnet das Entkommenlassen oder In-Sicherheit-Bringen. „Retten“ ist klar und idiomatisch.
- source_word: בְּעָלָיו
  choice: der ihr verfallen ist
  rationale: Wörtlich steht „ihr Besitzer/Herr“. Da die Bosheit im Deutschen ihren Täter nicht natürlich als „Besitzer“ hat, gibt „der ihr verfallen ist“ die Zugehörigkeitsbeziehung verständlich wieder; die wörtlichere Möglichkeit wird in einer Fußnote erhalten.
theological_decisions:
- issue: Bedeutung von רוּחַ im ersten Satz
  choice: Wind
  alternative: Geist oder Lebenshauch
  rationale: Die konkrete Bedeutung „Wind“ passt zu „zurückhalten“ und zur Folge von Dingen, die menschlicher Kontrolle entzogen sind. Da רוּחַ zugleich Geist oder Lebenshauch bedeuten kann und damit ein Bezug auf das Festhalten des Lebens bis zum Tod möglich ist, bleibt diese echte Mehrdeutigkeit in der Fußnote sichtbar.
- issue: Beziehung zwischen Bosheit und בְּעָלָיו
  choice: die Bosheit rettet den nicht, der ihr verfallen ist
  alternative: die Bosheit rettet ihren Besitzer/Herrn nicht
  rationale: 'Die Aussage bleibt personifiziert: Bosheit vermag den Menschen, der ihr zugehört beziehungsweise sich ihr verschrieben hat, nicht zu retten. Die Formulierung vermeidet die dogmatische Ausdeutung als bestimmte Tätergruppe, während die wörtlichere Metapher in der Fußnote dokumentiert wird.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit kurzen, klaren Sätzen. Die Parallelität der vier Aussagen wird erhalten; die Wiederholung von „Macht“ spiegelt die Wortverwandtschaft im Hebräischen. Beide Fußnotenmarker stehen im Haupttext.
