  text: כַּ/אֲשֶׁ֨ר נָתַ֤תִּי אֶת לִבִּ/י֙ לָ/דַ֣עַת חָכְמָ֔ה וְ/לִ/רְאוֹת֙ אֶת הָ֣/עִנְיָ֔ן אֲשֶׁ֥ר נַעֲשָׂ֖ה עַל הָ/אָ֑רֶץ כִּ֣י גַ֤ם בַּ/יּוֹם֙ וּ/בַ/לַּ֔יְלָה שֵׁנָ֕ה בְּ/עֵינָ֖י/ו אֵינֶ֥/נּוּ רֹאֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/016.yaml
  text: When I applied my heart to know wisdom and to observe the activity that is done on the earth—for even by day and by night his eyes do not see sleep—[a]
translation:
  language: de
  text: Als ich mein Herz darauf richtete, Weisheit zu erkennen und das Treiben zu betrachten, das auf der Erde geschieht – denn weder bei Tag noch bei Nacht sehen seine Augen Schlaf –,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sinngemäß: „Denn weder bei Tag noch bei Nacht bekommt er Schlaf.“ Wörtlich steht im Hebräischen: „Schlaf sehen seine Augen nicht.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Als
  rationale: Leitet den zeitlichen Umstand ein, unter dem der Sprecher seine Untersuchung unternahm.
- source_word: נָתַתִּי אֶת־לִבִּי
  choice: ich mein Herz darauf richtete
  rationale: Bewahrt das hebräische Herzbild und drückt zugleich eine bewusste, konzentrierte Hinwendung aus.
- source_word: לָדַעַת חָכְמָה
  choice: Weisheit zu erkennen
  rationale: Gibt ידע mit „erkennen“ wieder und wahrt den engen Bezug zur Weisheit, ohne bloßes Faktenwissen anzudeuten.
- source_word: וְלִרְאוֹת
  choice: und … zu betrachten
  rationale: Vermittelt in diesem Zusammenhang aufmerksames Beobachten und Untersuchen.
- source_word: הָעִנְיָן
  choice: das Treiben
  rationale: Bezeichnet hier die menschliche Tätigkeit und Geschäftigkeit; „Treiben“ ist breit, anschaulich und nicht auf Handel beschränkt.
- source_word: אֲשֶׁר נַעֲשָׂה עַל־הָאָרֶץ
  choice: das auf der Erde geschieht
  rationale: Gibt die passive beziehungsweise unpersönliche Wendung natürlich wieder und bewahrt den umfassenden irdischen Horizont.
- source_word: כִּי גַם
  choice: denn weder … noch
  rationale: „Denn“ bewahrt die erklärende Funktion von כִּי; die Verbindung mit Tag und Nacht wird im Deutschen idiomatisch als umfassendes „weder … noch“ ausgedrückt.
- source_word: בַּיּוֹם וּבַלַּיְלָה
  choice: bei Tag noch bei Nacht
  rationale: Eine natürliche deutsche Wendung für die durchgehende Dauer über Tag und Nacht.
- source_word: שֵׁנָה בְּעֵינָיו אֵינֶנּוּ רֹאֶה
  choice: sehen seine Augen Schlaf
  rationale: Bewahrt das auffällige hebräische Bild und den maskulinen Singular der Vorlage, statt die Aussage zu „er schläft nicht“ zu glätten.
theological_decisions:
- issue: Bezug des Suffixes der 3. Person Singular in בְּעֵינָיו
  choice: „seine Augen“ ohne Festlegung des Bezugsträgers
  alternative: Auf den Prediger beziehen („meine Augen“) oder verallgemeinern („man findet keinen Schlaf“)
  rationale: Der masoretische Text bietet ausdrücklich die 3. Person maskulin Singular. Die Übersetzung bewahrt diese ungewöhnliche Form und ihre mögliche Mehrdeutigkeit, ohne zu emendieren oder einen Bezug festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Herzmetapher und das ungewöhnliche Bild vom Sehen des Schlafes bleiben erhalten. Der Vers ist syntaktisch nicht abgeschlossen und führt in Vers 17 weiter; deshalb steht am Ende ein Komma nach dem Gedankenstrich-Einschub.
