  text: בַּ/אֲשֶׁ֥ר דְּבַר מֶ֖לֶךְ שִׁלְט֑וֹן וּ/מִ֥י יֹֽאמַר ל֖/וֹ מַֽה תַּעֲשֶֽׂה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/004.yaml
  text: For the word of a king is authority[a], and who may say to him, “What are you doing?”
translation:
  language: de
  text: 'Denn das Wort eines Königs hat Macht[a], und wer dürfte zu ihm sagen: »Was tust du?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Denn wo das Wort des Königs gilt, da ist Macht.« Der hebräische Satzanfang kann auch in diesem stärker örtlichen Sinn verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּאֲשֶׁר
  choice: Denn
  rationale: Die Wendung begründet die vorausgehende Mahnung. »Denn« gibt diese erklärende Funktion im Deutschen natürlich wieder; die örtliche Deutung bleibt in der Fußnote erhalten.
- source_word: דְּבַר
  choice: das Wort
  rationale: דָּבָר bezeichnet hier das königliche Wort, das im Kontext zugleich den Beiklang eines Befehls trägt. »Wort« bewahrt die hebräische Ausdrucksweise.
- source_word: מֶלֶךְ
  choice: eines Königs
  rationale: Das artikellose Substantiv ist hier am ehesten allgemein und sprichwörtlich zu verstehen.
- source_word: שִׁלְטוֹן
  choice: Macht
  rationale: Das Substantiv bezeichnet Herrschaftsgewalt oder Autorität. Die Formulierung »hat Macht« drückt im Deutschen natürlich aus, dass das königliche Wort wirksame und verbindliche Gewalt besitzt.
- source_word: וּמִי יֹאמַר לוֹ
  choice: und wer dürfte zu ihm sagen
  rationale: Die rhetorische Frage betrifft die Möglichkeit beziehungsweise Befugnis, den König zur Rede zu stellen. »Dürfte« gibt diesen Sinn idiomatisch wieder.
- source_word: מַה תַּעֲשֶׂה
  choice: Was tust du?
  rationale: Die direkte Frage gibt die Herausforderung des Handelns des Königs knapp und ohne erklärende Zusätze wieder.
