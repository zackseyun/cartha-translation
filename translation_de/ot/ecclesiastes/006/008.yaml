base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/008.yaml
  text: For what advantage does the wise man have over the fool? What does the poor man have who knows how to conduct himself before the living?[a]
translation:
  language: de
  text: Denn welchen Vorteil hat der Weise gegenüber dem Toren? Was hat der Arme davon, dass er weiß, wie er sich vor den Lebenden verhalten soll?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Was hat der Arme davon, dass er vor den Lebenden zu gehen weiß?“ „Gehen“ kann im Hebräischen bildlich die Lebensführung oder das Verhalten bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet eine Begründung beziehungsweise Erläuterung des vorausgehenden Gedankens ein und wahrt den argumentativen Zusammenhang.
- source_word: מַה יּוֹתֵר
  choice: welchen Vorteil hat
  rationale: Die Wendung fragt nach einem Mehrwert, Gewinn oder Vorzug; „Vorteil“ ist im Deutschen natürlich und entspricht der wiederkehrenden Nutzenfrage des Predigers.
- source_word: לֶחָכָם
  choice: der Weise
  rationale: Das maskuline substantivierte Adjektiv wird entsprechend seiner Form als „der Weise“ wiedergegeben.
- source_word: מִן הַכְּסִיל
  choice: gegenüber dem Toren
  rationale: מִן kennzeichnet hier den Vergleich; „gegenüber“ gibt den erfragten relativen Vorteil idiomatisch wieder.
- source_word: מַה לֶּעָנִי
  choice: Was hat der Arme davon
  rationale: Die knappe zweite Frage nimmt den Gedanken des Vorteils aus der ersten auf, ohne ihn ausdrücklich zu wiederholen. „davon“ stellt diesen Bezug im Deutschen her, ohne „Vorteil“ erneut in den Text einzufügen.
- source_word: עָנִי
  choice: der Arme
  rationale: Im Zusammenhang ist die sozioökonomische Bedeutung „arm“ am wahrscheinlichsten; die maskuline Singularform bleibt gewahrt.
- source_word: יוֹדֵעַ לַהֲלֹךְ
  choice: weiß, wie er sich … verhalten soll
  rationale: Das Partizip bezeichnet Wissen oder Fähigkeit; הלך bedeutet wörtlich „gehen“, kann aber idiomatisch die Lebensführung oder das Verhalten bezeichnen.
- source_word: נֶגֶד הַחַיִּים
  choice: vor den Lebenden
  rationale: נֶגֶד bedeutet „vor, gegenüber, in Gegenwart von“. Die ungewöhnliche Formulierung und ihr Bezug auf lebende Menschen bleiben erhalten.
theological_decisions:
- issue: Sinn der zweiten Frage
  choice: Die elliptische Frage wird als Frage nach dem Nutzen des kundigen Verhaltens des Armen wiedergegeben.
  alternative: „Welchen Vorteil hat der Arme, der vor den Lebenden zu gehen weiß?“
  rationale: Der Parallelismus legt einen mitgedachten Nutzen oder Vorteil nahe, doch der hebräische Text nennt ihn in der zweiten Frage nicht ausdrücklich. „Was hat … davon“ bewahrt diese Kürze und lässt die rhetorische Spannung bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorischen Fragen und die knappe Parallelstruktur werden gewahrt; die zweite Frage wird nur so weit idiomatisiert, wie es für unmittelbare Verständlichkeit nötig ist.
