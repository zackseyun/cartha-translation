source:
  edition: WLC
  text: כָּל עֲמַ֥ל הָ/אָדָ֖ם לְ/פִ֑י/הוּ וְ/גַם הַ/נֶּ֖פֶשׁ לֹ֥א תִמָּלֵֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/007.yaml
  text: All a man's labor is for his mouth[a], yet even his appetite is not filled.
translation:
  language: de
  text: Alle Mühe des Menschen ist für seinen Mund[a], und doch wird sein Verlangen nicht gestillt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch נֶפֶשׁ: hier wohl „Verlangen“ oder „Appetit“; auch „Seele“ ist möglich.'
    reason: Die Anmerkung dokumentiert die lexikalische Spannweite von נֶפֶשׁ und erläutert die kontextuelle Wahl von „Verlangen“, ohne die bereits im Haupttext stehende wörtliche Formulierung zu wiederholen.
lexical_decisions:
- source_word: כָּל עֲמַל
  choice: Alle Mühe
  rationale: כָּל umfasst die gesamte Mühe; עֲמַל bezeichnet im Prediger häufig beschwerliche, mühevolle Arbeit. „Alle Mühe“ ist natürlich und bewahrt diesen Beiklang.
- source_word: הָאָדָם
  choice: des Menschen
  rationale: Der bestimmte Singular ist hier generisch und spricht vom Menschen allgemein. Die deutsche Wendung bewahrt sowohl Singular als auch repräsentative Bedeutung.
- source_word: לְפִיהוּ
  choice: für seinen Mund
  rationale: Die konkrete Metapher des hebräischen Textes wird erhalten; gemeint ist zunächst das, was der Mensch zum Lebensunterhalt verbraucht.
- source_word: וְגַם
  choice: und doch
  rationale: 'Im Zusammenhang markiert die Verbindung eine ironische Gegenüberstellung: Trotz aller Mühe bleibt das Verlangen ungestillt.'
- source_word: הַנֶּפֶשׁ
  choice: sein Verlangen
  rationale: נֶפֶשׁ bezeichnet hier angesichts von Mund, Füllung und fortdauerndem Begehren wahrscheinlich das Verlangen oder den Appetit. Das Possessivpronomen macht den Bezug auf „den Menschen“ im Deutschen deutlich.
- source_word: לֹא תִמָּלֵא
  choice: wird nicht gestillt
  rationale: Das Niphal von מלא bedeutet wörtlich „wird nicht gefüllt“. Bei „Verlangen“ ist „wird nicht gestillt“ idiomatisches Deutsch und erhält die Aussage fortdauernder Unerfülltheit.
theological_decisions:
- issue: Generische Bedeutung von הָאָדָם
  choice: des Menschen
  alternative: des Mannes
  rationale: Der Satz gilt sprichwörtlich für den Menschen als solchen. „Des Menschen“ bildet den generischen Singular im Deutschen klar ab, ohne die Aussage unnötig auf männliche Personen einzugrenzen.
- issue: Bedeutung von הַנֶּפֶשׁ im Zusammenhang von Konsum und Sättigung
  choice: sein Verlangen
  alternative: die Seele
  rationale: „Seele“ könnte hier einen Gegensatz zwischen Körper und immateriellem Seelenteil nahelegen, den der hebräische Text nicht fordert. „Verlangen“ gibt den kontextuellen Sinn wieder; die wörtlich-traditionelle Möglichkeit bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der erste Halbvers hält am konkreten Bild des Mundes fest; der zweite verwendet idiomatisches „Verlangen … gestillt“, während die Fußnote die wörtlicheren Alternativen dokumentiert.
