- from: Denn wer weiß, was für den Menschen im Leben gut ist, in den gezählten Tagen seines flüchtigen Lebens, die er wie einen Schatten verbringt? Denn wer kann dem Menschen sagen, was nach ihm unter der Sonne sein wird?
  to: Denn wer weiß, was für den Menschen im Leben gut ist während der gezählten Tage seines flüchtigen Lebens, die er wie einen Schatten verbringt? Denn wer kann dem Menschen sagen, was nach ihm unter der Sonne sein wird?
  rationale: Die Revision stellt den Bezug des Pluralobjekts auf die Lebenstage eindeutig her und glättet die Zeitangabe idiomatisch. Die semantische Offenheit von הֶבֶל und אַחֲרָיו sowie die bildhafte Wendung „unter der Sonne“ bleiben gewahrt.
