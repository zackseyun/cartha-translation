  text: כִּ֣י מִֽי יוֹדֵעַ֩ מַה טּ֨וֹב לָֽ/אָדָ֜ם בַּֽ/חַיִּ֗ים מִסְפַּ֛ר יְמֵי חַיֵּ֥י הֶבְל֖/וֹ וְ/יַעֲשֵׂ֣/ם כַּ/צֵּ֑ל אֲשֶׁר֙ מִֽי יַגִּ֣יד לָֽ/אָדָ֔ם מַה יִּהְיֶ֥ה אַחֲרָ֖י/ו תַּ֥חַת הַ/שָּֽׁמֶשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/012.yaml
  text: For who knows what is good for man in life, during the number of the days of his fleeting life, which he spends like a shadow? For who can tell man what will be after him under the sun?
translation:
  language: de
  text: Denn wer weiß, was für den Menschen im Leben gut ist während der gezählten Tage seines flüchtigen Lebens, die er wie einen Schatten verbringt? Denn wer kann dem Menschen sagen, was nach ihm unter der Sonne sein wird?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶבְלוֹ
  choice: seines flüchtigen Lebens
  rationale: הבל bezeichnet etwas Hauchhaftes, Vergängliches und schwer Greifbares. „Flüchtig“ gibt hier im Zusammenhang mit den begrenzten Lebenstagen diesen zeitlichen Aspekt natürlich wieder, ohne die Aussage auf bloße Sinnlosigkeit zu verengen.
- source_word: מִסְפַּר יְמֵי
  choice: in den gezählten Tagen
  rationale: Die Wendung bezeichnet die abgemessene, begrenzte Zahl der Lebenstage. „Gezählt“ bewahrt das Bild des hebräischen Ausdrucks und klingt im Deutschen natürlicher als „während der Zahl der Tage“.
- source_word: וְיַעֲשֵׂם כַּצֵּל
  choice: die er wie einen Schatten verbringt
  rationale: Das Verb עשה kann in Verbindung mit Zeit das Verbringen der Tage ausdrücken. Das Schattenbild bleibt erhalten und unterstreicht ihre Flüchtigkeit.
- source_word: אַחֲרָיו
  choice: nach ihm
  rationale: 'Die knappe Formulierung bewahrt die Mehrdeutigkeit: Gemeint sein kann, was zeitlich nach einem Menschen beziehungsweise nach seinem Tod geschieht.'
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: unter der Sonne
  rationale: Die für Kohelet charakteristische räumlich-metaphorische Wendung wird wörtlich und idiomatisch beibehalten.
theological_decisions:
- issue: Reichweite menschlicher Erkenntnis
  choice: Beide Fragen bleiben als offene rhetorische Fragen formuliert.
  alternative: Die Fragen durch eine ausdrückliche Aussage über Gottes alleiniges Wissen beantworten.
  rationale: Der Vers betont unmittelbar die menschliche Ungewissheit, nennt aber Gott hier nicht ausdrücklich. Eine ergänzende theologische Auflösung würde über den Quelltext hinausgehen.
- issue: Bedeutung von אַחֲרָיו („nach ihm“)
  choice: Die zeitliche und mögliche nachtodliche Offenheit bleibt mit „nach ihm“ erhalten.
  alternative: Eindeutig „nach seinem Tod“ oder „in der Zukunft“ übersetzen.
  rationale: Der hebräische Wortlaut legt sich nicht ausdrücklich auf nur eine dieser Deutungen fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Einleitung „Denn wer“ erhält den argumentativen und rhetorischen Zusammenhang. Die Bildsprache von Hauch beziehungsweise Flüchtigkeit und Schatten wird bewahrt, ohne die im Hebräischen angelegte Spannung vorschnell als reine Sinnlosigkeit zu deuten.
