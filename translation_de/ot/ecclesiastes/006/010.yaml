id: ECC.6.10
reference: Ecclesiastes 6:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: מַה שֶּֽׁ/הָיָ֗ה כְּבָר֙ נִקְרָ֣א שְׁמ֔/וֹ וְ/נוֹדָ֖ע אֲשֶׁר ה֣וּא אָדָ֑ם וְ/לֹא יוּכַ֣ל לָ/דִ֔ין עִ֥ם ש/התקיף מִמֶּֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/010.yaml
  text: Whatever has come to be has already been named[a], and it is known what man is[b]; and he cannot contend with one stronger than he.
translation:
  language: de
  text: Was auch immer geworden ist, wurde schon benannt[a], und es ist bekannt, was der Mensch[b] ist. Er kann nicht mit jemandem streiten, der stärker ist als er.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „sein Name wurde schon genannt“. Das Benennen kann hier auch den Gedanken des Festlegens oder Bestimmens einschließen.'
    reason: translation_note
  - marker: b
    text: „Der Mensch“ steht hier im Singular für die Menschheit.
    reason: lexical_alternative
  - marker: c
    text: Mit dem Stärkeren ist wahrscheinlich Gott gemeint; der hebräische Text sagt dies jedoch nicht ausdrücklich.
    reason: alternative_reading
lexical_decisions:
- source_word: מַה שֶּׁהָיָה
  choice: Was auch immer geworden ist
  rationale: Die verallgemeinernde Wendung umfasst alles, was geworden ist oder sich ereignet hat, und wahrt den perfektiven Sinn von היה.
- source_word: כְּבָר
  choice: längst
  rationale: „Längst“ gibt die zeitliche Vorordnung knapp und sprichwörtlich wieder; gemeint sein kann sowohl „schon“ als auch „seit Langem“.
- source_word: נִקְרָא שְׁמוֹ
  choice: wurde längst benannt
  rationale: Die passive Namensformel wird im Deutschen natürlich mit „benannt“ wiedergegeben und lässt offen, ob nur Bezeichnung oder auch Festlegung gemeint ist.
- source_word: וְנוֹדָע אֲשֶׁר הוּא אָדָם
  choice: und es ist bekannt, was der Mensch ist
  rationale: Die Formulierung bewahrt die Aussage über die bekannte menschliche Identität beziehungsweise Beschaffenheit, ohne sie näher auszudeuten.
- source_word: אָדָם
  choice: der Mensch
  rationale: Der hebräische Singular bezeichnet hier repräsentativ den Menschen beziehungsweise die Menschheit; „der Mensch“ ist dafür im Deutschen idiomatisch.
- source_word: וְלֹא יוּכַל לָדִין
  choice: Er kann nicht ... rechten
  rationale: דין bezeichnet hier das Austragen eines Streits oder Rechtsstreits. Das gehobene, aber verständliche „rechten“ erhält die mögliche gerichtliche Färbung, ohne den Ausdruck darauf zu beschränken.
- source_word: עִם שֶׁתַּקִּיף מִמֶּנּוּ
  choice: mit einem ..., der stärker ist als er
  rationale: Die Wiedergabe erhält den unbestimmten Bezug und den ausdrücklichen Stärkevergleich des Hebräischen.
theological_decisions:
- issue: Ob der Stärkere ausdrücklich als Gott bezeichnet werden soll
  choice: 'Der Bezug bleibt unbestimmt: „einem ..., der stärker ist als er“'
  alternative: „mit Gott, der stärker ist als er“
  rationale: Im Zusammenhang ist Gott wahrscheinlich gemeint, doch der hebräische Vers nennt ihn nicht ausdrücklich. Die Übersetzung bewahrt diese Offenheit.
- issue: Ob „Benennen“ als göttliches Bestimmen ausgelegt werden soll
  choice: Das Bild des Benennens bleibt im Haupttext erhalten
  alternative: „wurde längst festgelegt“
  rationale: Benennen kann hier Festlegung oder Bestimmung einschließen, doch eine rein deutende Wiedergabe würde die Bildsprache und ihre Mehrdeutigkeit beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Rechten“ ist leicht gehoben, hält aber sowohl den allgemeinen Streit als auch den möglichen Rechtsstreit im Blick. Die knappe, sprichwörtliche Satzführung des Hebräischen bleibt erhalten.
