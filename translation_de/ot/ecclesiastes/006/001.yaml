  text: יֵ֣שׁ רָעָ֔ה אֲשֶׁ֥ר רָאִ֖יתִי תַּ֣חַת הַ/שָּׁ֑מֶשׁ וְ/רַבָּ֥ה הִ֖יא עַל הָ/אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/001.yaml
  text: 'There is an evil that I have seen under the sun[a], and it is heavy upon man:'
translation:
  language: de
  text: 'Es gibt ein Übel, das ich unter der Sonne gesehen habe, und schwer lastet es auf dem Menschen:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֵשׁ
  choice: Es gibt
  rationale: Die Existenzpartikel führt eine beobachtete Gegebenheit ein; „Es gibt“ ist die natürliche deutsche Entsprechung.
- source_word: רָעָה
  choice: ein Übel
  rationale: Das Substantiv kann etwas Böses, Schlimmes oder Unheilvolles bezeichnen. „Übel“ bewahrt diese Bedeutungsbreite, ohne vorschnell moralische Schuld oder bloßes Missgeschick festzulegen.
- source_word: אֲשֶׁר רָאִיתִי
  choice: das ich … gesehen habe
  rationale: Der Relativsatz mit Qal Perfekt 1. Person Singular beschreibt die rückblickende Beobachtung des Sprechers; das deutsche Perfekt klingt hier natürlich.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: unter der Sonne
  rationale: Die für das Buch typische Wendung bezeichnet den irdischen menschlichen Lebensbereich und wird im Deutschen treffend und traditionsnah wiedergegeben.
- source_word: וְרַבָּה הִיא עַל
  choice: und schwer lastet es auf
  rationale: רַבָּה bedeutet wörtlich „groß/viel“; zusammen mit עַל kann die Formulierung die schwere Belastung für Menschen ausdrücken. Die Übersetzung bleibt bildhaft und idiomatisch, während eine mögliche alternative Deutung in der Fußnote genannt wird.
- source_word: הָאָדָם
  choice: dem Menschen
  rationale: Der bestimmte Singular bezeichnet hier den Menschen als Gattungsbegriff beziehungsweise die Menschheit allgemein. „Dem Menschen“ erhält die Form des hebräischen generischen Singulars und ist im Deutschen inklusiv verständlich.
theological_decisions:
- issue: Generischer Sinn von הָאָדָם
  choice: dem Menschen
  alternative: der Menschheit / den Menschen
  rationale: Der hebräische Singular ist generisch und meint nicht nur einen einzelnen Mann. „Dem Menschen“ bewahrt sowohl den Singular als auch den allgemeinmenschlichen Bezug.
- issue: Bedeutung von רַבָּה הִיא עַל הָאָדָם
  choice: schwer lastet es auf dem Menschen
  alternative: es ist weit verbreitet unter den Menschen
  rationale: Die Konstruktion kann die Größe beziehungsweise Schwere des Übels oder möglicherweise seine weite Verbreitung bezeichnen. Der Haupttext gibt den Belastungsaspekt wieder; die alternative Deutung bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt hält den Satz bewusst für die in Vers 2 folgende Erläuterung offen.
