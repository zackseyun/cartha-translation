id: ECC.6.5
reference: Ecclesiastes 6:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: גַּם שֶׁ֥מֶשׁ לֹא רָאָ֖ה וְ/לֹ֣א יָדָ֑ע נַ֥חַת לָ/זֶ֖ה מִ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/005.yaml
  text: Though it has not seen the sun or known anything[b][a], it has more rest than that man.
translation:
  language: de
  text: Auch wenn es die Sonne nicht gesehen und nichts erfahren hat,[a] hat es mehr Ruhe als jener Mann.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Die Sonne sehen« ist eine hebräische Ausdrucksweise für das Erleben des Lebens in dieser Welt.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: »Dieses hat mehr Ruhe als jenes.« Die hinweisenden Wörter beziehen sich auf das tot geborene Kind und auf den Mann aus den vorangehenden Versen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Auch wenn
  rationale: 'Im Zusammenhang leitet גַּם einen weiteren, sinngemäß konzessiven Gesichtspunkt ein: Trotz der fehlenden Lebenserfahrung hat das tot geborene Kind mehr Ruhe.'
- source_word: שֶׁמֶשׁ לֹא רָאָה
  choice: die Sonne nicht gesehen
  rationale: Die konkrete Bildsprache bleibt erhalten; im Predigerbuch bezeichnet »die Sonne sehen« das Erleben des Lebens in dieser Welt.
- source_word: וְלֹא יָדָע
  choice: und nichts erfahren hat
  rationale: יָדַע steht hier ohne ausdrückliches Objekt und meint im Kontext Erkennen beziehungsweise Erleben. »Nichts erfahren« klingt im Deutschen natürlich, ohne einen bestimmten Erkenntnisinhalt einzutragen.
- source_word: נַחַת
  choice: Ruhe
  rationale: »Ruhe« gibt den Sinn von stiller Rast beziehungsweise Ungestörtheit klar und würdig wieder.
- source_word: לָזֶה מִזֶּה
  choice: es hat mehr Ruhe als jener Mann
  rationale: 'Die hebräischen Demonstrativa werden entsprechend ihren Bezügen im Kontext wiedergegeben: Das erste verweist auf das tot geborene Kind, das zweite auf den zuvor beschriebenen Mann.'
theological_decisions:
- issue: Aussage über den Zustand des tot geborenen Kindes
  choice: Die vergleichende Aussage des Textes wird als »mehr Ruhe« wiedergegeben.
  alternative: Eine ausdrückliche Aussage über sein Heil oder sein Leben nach dem Tod.
  rationale: Der Vers vergleicht die Ruhe des Kindes mit dem mühseligen Dasein des Mannes, legt aber keine ausgearbeitete Lehre über das Schicksal tot geborener Kinder vor.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Bildsprache des Hebräischen bleibt erhalten; unklare Demonstrativbezüge werden im Haupttext maßvoll verdeutlicht und in der Fußnote offengelegt.
