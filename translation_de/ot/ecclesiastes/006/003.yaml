source:
  edition: WLC
  text: אִם יוֹלִ֣יד אִ֣ישׁ מֵאָ֡ה וְ/שָׁנִים֩ רַבּ֨וֹת יִֽחְיֶ֜ה וְ/רַ֣ב שֶׁ/יִּהְי֣וּ יְמֵֽי שָׁנָ֗י/ו וְ/נַפְשׁ/וֹ֙ לֹא תִשְׂבַּ֣ע מִן הַ/טּוֹבָ֔ה וְ/גַם קְבוּרָ֖ה לֹא הָ֣יְתָה לּ֑/וֹ אָמַ֕רְתִּי ט֥וֹב מִמֶּ֖/נּוּ הַ/נָּֽפֶל־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/003.yaml
  text: If a man fathers a hundred children and lives many years[a], however many the days of his years may be, but his soul is not satisfied with good, and he does not even have burial[c][b], I say that the stillborn child is better off than he.
translation:
  language: de
  text: 'Wenn ein Mann hundert Kinder zeugt und viele Jahre lebt – mögen die Tage seiner Jahre auch noch so zahlreich sein –, seine Seele aber des Guten nicht satt wird und ihm nicht einmal ein Begräbnis zuteilwird, dann sage ich[b]: Das totgeborene Kind[a] ist besser daran als er.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Fehlgeburt“ oder „die unzeitige Geburt“.'
    reason: Das hebräische הַנָּפֶל kann ein fehl- oder totgeborenes Kind beziehungsweise eine unzeitige Geburt bezeichnen.
  - marker: b
    text: 'Oder: „sagte ich“. Das hebräische Perfekt kann hier als vergangene Aussage oder als gegenwärtige Urteilsformel verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Wenn
  rationale: Leitet ein hypothetisches Szenario ein und entspricht unmittelbar der konditionalen Funktion.
- source_word: יוֹלִיד אִישׁ מֵאָה
  choice: ein Mann hundert Kinder zeugt
  rationale: Das Hifil von ילד bezeichnet hier das Zeugen; das nicht ausdrücklich genannte Bezugswort zu „hundert“ wird im Deutschen sinngemäß als „Kinder“ ergänzt.
- source_word: וְשָׁנִים רַבּוֹת יִחְיֶה
  choice: und viele Jahre lebt
  rationale: Gibt die Aussage über ein langes Leben natürlich und quellennah wieder.
- source_word: וְרַב שֶׁיִּהְיוּ יְמֵי שָׁנָיו
  choice: und mögen die Tage seiner Jahre noch so zahlreich sein
  rationale: Bewahrt das hebräische Bild von den „Tagen seiner Jahre“ und bringt die steigernd-konzessive Funktion idiomatisch zum Ausdruck.
- source_word: וְנַפְשׁוֹ לֹא תִשְׂבַּע מִן הַטּוֹבָה
  choice: seine Seele aber wird des Guten nicht satt
  rationale: „Seele“ bewahrt die anthropologische und literarische Färbung von נֶפֶשׁ; „des Guten nicht satt werden“ gibt שבע und das umfassende Gute beziehungsweise Wohlergehen wieder.
- source_word: וְגַם קְבוּרָה לֹא הָיְתָה לּוֹ
  choice: und nicht einmal ein Begräbnis wird ihm zuteil
  rationale: Drückt die zusätzliche, entehrende Entbehrung einer Bestattung verständlich aus und wahrt die verstärkende Bedeutung von גַּם.
- source_word: אָמַרְתִּי
  choice: dann sage ich
  rationale: Das Perfekt kann bei Kohelet als gegenwärtige Diskursformel verstanden werden; „sage ich“ leitet das aktuelle Urteil natürlich ein.
- source_word: טוֹב מִמֶּנּוּ
  choice: ist besser daran als er
  rationale: Die Wendung bezeichnet einen günstigeren Zustand, nicht moralische Überlegenheit.
- source_word: הַנָּפֶל
  choice: eine Totgeburt
  rationale: Bezeichnet hier ein fehl- oder totgeborenes Kind; „Totgeburt“ ist im Deutschen klar und knapp, während die mögliche Bedeutungsbreite in der Fußnote erhalten bleibt.
theological_decisions:
- issue: Anthropologische Bedeutungsbreite von נֶפֶשׁ
  choice: „seine Seele wird des Guten nicht satt“
  alternative: „er selbst wird des Guten nicht satt“ oder „sein Verlangen wird des Guten nicht satt“
  rationale: Der Vers formuliert keine technische Seelenlehre. Die Wiedergabe „Seele“ erhält jedoch die literarische und anthropologische Spannung des hebräischen Ausdrucks, ohne ihn auf Appetit oder bloße Selbstbezeichnung festzulegen.
- issue: Männliche repräsentative Einzelfigur
  choice: „ein Mann“
  alternative: „jemand“ oder „ein Mensch“
  rationale: אִישׁ bezeichnet ausdrücklich einen Mann; die quellensprachliche Form wird gewahrt, ohne daraus eine weitergehende Lehrentscheidung abzuleiten.
- issue: Zeitwert von אָמַרְתִּי
  choice: „sage ich“
  alternative: „sagte ich“
  rationale: Sowohl eine vergangene Aussage als auch eine gegenwärtige Urteilsformel ist grammatisch vertretbar. Im Zusammenhang funktioniert die Form natürlich als aktuelles Urteil; die Alternative wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bewusst ungewöhnliche Wendung „Tage seiner Jahre“ erhält das Bild des Hebräischen; „noch so zahlreich“ macht dessen steigernd-konzessive Wirkung verständlich. Der einzige Fußnotenmarker [a] steht unmittelbar nach dem erklärungsbedürftigen Ausdruck.
