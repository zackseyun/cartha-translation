source:
  edition: WLC
  text: אִ֣ישׁ אֲשֶׁ֣ר יִתֶּן ל֣/וֹ הָ/אֱלֹהִ֡ים עֹשֶׁר֩ וּ/נְכָסִ֨ים וְ/כָב֜וֹד וְֽ/אֵינֶ֨/נּוּ חָסֵ֥ר לְ/נַפְשׁ֣/וֹ מִ/כֹּ֣ל אֲשֶׁר יִתְאַוֶּ֗ה וְ/לֹֽא יַשְׁלִיטֶ֤/נּוּ הָֽ/אֱלֹהִים֙ לֶ/אֱכֹ֣ל מִמֶּ֔/נּוּ כִּ֛י אִ֥ישׁ נָכְרִ֖י יֹֽאכֲלֶ֑/נּוּ זֶ֥ה הֶ֛בֶל וָ/חֳלִ֥י רָ֖ע הֽוּא־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/002.yaml
  text: There is a man to whom God gives riches[a], possessions, and honor, so that he lacks nothing for himself of all that he desires, yet God does not empower him to eat from them, because a foreign man eats them[c][b]. This is vanity and a grievous sickness.
translation:
  language: de
  text: Es gibt einen Mann, dem Gott Reichtum, Besitz und Ansehen gibt, sodass ihm nichts von allem fehlt, was er begehrt. Doch Gott befähigt ihn nicht, davon zu essen[a], denn ein fremder Mann isst davon[b]. Das ist Hauch[c] und eine schlimme Krankheit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „davon zu essen“; gemeint sein kann, den Besitz zu nutzen oder zu genießen.'
    reason: Erläuterung einer konkreten hebräischen Wendung.
  - marker: b
    text: 'Oder: „ein Fremder“ beziehungsweise „ein Ausländer“. Hebräisch wörtlich: „ein fremder Mann“.'
    reason: Bewahrt die Bedeutungsbreite von אִישׁ נָכְרִי.
  - marker: c
    text: 'Oder: „Nichtigkeit“ beziehungsweise „Vergeblichkeit“. Das hebräische Wort hebel bedeutet wörtlich „Hauch“ und ist ein Leitwort des Buches.'
    reason: Kennzeichnet die Mehrdeutigkeit des zentralen Begriffs הֶבֶל.
lexical_decisions:
- source_word: אִישׁ אֲשֶׁר
  choice: Da ist ein Mann, dem
  rationale: Gibt die elliptische hebräische Eröffnung natürlich wieder und bewahrt den unbestimmten männlichen Singular.
- source_word: עֹשֶׁר וּנְכָסִים וְכָבוֹד
  choice: Reichtum, Besitz und Ansehen
  rationale: Bewahrt die dreigliedrige Aufzählung; „Ansehen“ bezeichnet hier den gesellschaftlichen Rang natürlicher als „Herrlichkeit“.
- source_word: וְאֵינֶנּוּ חָסֵר לְנַפְשׁוֹ מִכֹּל אֲשֶׁר יִתְאַוֶּה
  choice: sodass ihm nichts von allem fehlt, was er begehrt
  rationale: נפש bezeichnet hier idiomatisch die Person selbst; die deutsche Formulierung vermeidet eine unnötige anthropologische Festlegung.
- source_word: וְלֹא יַשְׁלִיטֶנּוּ הָאֱלֹהִים
  choice: Doch Gott befähigt ihn nicht
  rationale: „Befähigt“ wahrt den kausativen Sinn des Hifil von שלט und klingt im Deutschen natürlicher als eine wörtliche Rede von Herrschaftsgewalt.
- source_word: לֶאֱכֹל מִמֶּנּוּ ... יֹאכֲלֶנּוּ
  choice: davon zu essen ... isst davon
  rationale: Bewahrt das konkrete und für Kohelet typische Bild des Essens, statt es bereits als „genießen“ auszulegen.
- source_word: אִישׁ נָכְרִי
  choice: ein fremder Mann
  rationale: Gibt beide hebräischen Wörter wieder und lässt offen, ob ein Fremder, Außenstehender oder Ausländer gemeint ist.
- source_word: הֶבֶל
  choice: Hauch
  rationale: Das Leitwort bezeichnet etwas Flüchtiges und schwer Greifbares; „Hauch“ erhält das Bild, ohne es einseitig als Sinnlosigkeit auszulegen.
- source_word: חֳלִי רָע
  choice: eine schlimme Krankheit
  rationale: Bewahrt die konkrete Krankheitsmetapher und die Wertung durch רָע.
theological_decisions:
- issue: Bedeutung von לְנַפְשׁוֹ
  choice: ihm
  alternative: seiner Seele
  rationale: נפש meint in diesem Zusammenhang den Menschen als Person und formuliert keine technische Lehre über eine vom Körper getrennte Seele.
- issue: Göttliche Verfügungsgewalt und menschlicher Genuss
  choice: Gott befähigt ihn nicht
  alternative: Gott erlaubt ihm nicht
  rationale: Die Übersetzung bewahrt die ausdrückliche Zuschreibung an Gott sowie den kausativen Gedanken, ohne zu erklären, auf welche Weise die fehlende Befähigung eintritt.
- issue: Deutung von הֶבֶל
  choice: Hauch
  alternative: Nichtigkeit; Vergeblichkeit
  rationale: Das Bild bleibt in seiner Mehrdeutigkeit zwischen Flüchtigkeit, Unfassbarkeit und Vergeblichkeit erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur wurde für gute Verständlichkeit in zwei Hauptsätze gegliedert; die konkreten Bilder „essen“, „Hauch“ und „Krankheit“ bleiben erhalten.
