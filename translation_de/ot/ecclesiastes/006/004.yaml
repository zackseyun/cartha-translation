base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/004.yaml
  text: For he comes in vanity and goes in darkness[b][a], and in darkness his name is covered.
translation:
  language: de
  text: Denn es kommt als ein Hauch[a] und geht in Dunkelheit, und in Dunkelheit wird sein Name verhüllt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in Nichtigkeit« beziehungsweise »wie ein Dunst«. Das hebräische Wort הֶבֶל ist ein Schlüsselwort des Buches und kann Vergänglichkeit, Leere oder Vergeblichkeit ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: Dass sein Name »verhüllt« wird, kann bedeuten, dass seine Identität oder die Erinnerung an es im Verborgenen bleibt.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aussage ein und bewahrt die erklärend-kausale Funktion.
- source_word: הֶבֶל
  choice: ein Hauch
  rationale: Das Schlüsselwort הֶבֶל bezeichnet etwas Atem- oder Dunstartiges und kann dadurch Vergänglichkeit, Nichtigkeit oder Vergeblichkeit ausdrücken. »Ein Hauch« bewahrt hier das konkrete Bild und klingt im Deutschen natürlich.
- source_word: בָּא
  choice: kommt
  rationale: Die präsentische Wiedergabe entspricht der allgemeinen, beschreibenden Aussage und bildet mit »geht« ein klares Wortpaar.
- source_word: חֹשֶׁךְ
  choice: Dunkelheit
  rationale: Die zweimalige Wiederholung wird beibehalten; »Dunkelheit« lässt sowohl die bildhafte als auch die übertragene Bedeutung von Verborgenheit und Vergessenheit offen.
- source_word: יֵלֵךְ
  choice: geht
  rationale: Die einfache Wiedergabe bewahrt das hebräische Bild des Fortgehens, ohne es ausdrücklich als Sterben auszudeuten.
- source_word: שְׁמוֹ
  choice: sein Name
  rationale: Die wörtliche Formulierung bewahrt die mögliche Bedeutung von Identität, Ansehen oder Erinnerung, ohne diese im Haupttext festzulegen.
- source_word: יְכֻסֶּה
  choice: wird verhüllt
  rationale: Die passive Form und das Bild des Bedeckens bleiben erhalten. »Verhüllt« ist im Deutschen verständlicher und idiomatischer als »bedeckt«, ohne zur bloßen Abstraktion »vergessen« überzugehen.
theological_decisions:
- issue: Bezug des maskulinen Singularpronomens auf die Fehlgeburt aus dem Kontext
  choice: Neutrales Pronomen »es« im Deutschen
  alternative: »er«
  rationale: Das Hebräische verwendet aufgrund des grammatisch maskulinen Bezugsworts ein maskulines Pronomen. Im Deutschen ist »Fehlgeburt« feminin, während die im Kontext gemeinte tot geborene oder nicht lebensfähige Leibesfrucht idiomatisch neutral mit »es« bezeichnet werden kann. Dadurch wird kein männliches Geschlecht behauptet.
- issue: Bedeutung von »sein Name wird verhüllt«
  choice: Das Bild unverändert stehen lassen
  alternative: »man erinnert sich nicht an es«
  rationale: Der Text kann Identität, Bekanntheit oder Erinnerung meinen. Eine explizite Deutung als Vergessenwerden würde die genuine Bildhaftigkeit und Mehrdeutigkeit einschränken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von »Dunkelheit« und das Bild des verhüllten Namens werden bewusst erhalten. Das Schlüsselwort הֶבֶל wird konkret mit »Hauch« wiedergegeben; seine weiteren Bedeutungsnuancen stehen in der Fußnote.
