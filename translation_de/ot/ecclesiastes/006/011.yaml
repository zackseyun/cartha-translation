  text: כִּ֛י יֵשׁ דְּבָרִ֥ים הַרְבֵּ֖ה מַרְבִּ֣ים הָ֑בֶל מַה יֹּתֵ֖ר לָ/אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/011.yaml
  text: For there are many words that increase vanity; what advantage is there for man?
translation:
  language: de
  text: Denn es gibt viele Worte[a], die die Nichtigkeit vermehren. Welchen Vorteil hat der Mensch?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: viele Dinge.'
    reason: דְּבָרִים kann je nach Kontext »Worte« oder »Dinge/Angelegenheiten« bedeuten.
lexical_decisions:
- source_word: דְּבָרִים (devarim)
  choice: Worte
  rationale: Das Wort kann sowohl »Worte« als auch »Dinge/Angelegenheiten« bedeuten. Im Zusammenhang mit dem Reden und Streiten in Vers 10 liegt »Worte« nahe; die Mehrdeutigkeit wird in einer Fußnote kenntlich gemacht.
- source_word: הֶבֶל (hevel)
  choice: Nichtigkeit
  rationale: Bewahrt das Leitwort des Buches und dessen Bedeutungsfeld von Vergänglichkeit, Vergeblichkeit und Substanzlosigkeit, ohne es auf nur einen Aspekt zu verengen.
- source_word: יֹתֵר (yoter)
  choice: Gewinn
  rationale: Bezeichnet hier den Vorteil oder Überschuss, der dem Menschen bleibt; »Gewinn« entspricht dem wiederkehrenden wirtschaftlich geprägten Sprachgebrauch im Predigerbuch.
theological_decisions:
- issue: Wirkung vieler Worte
  choice: »die die Nichtigkeit vermehren«
  alternative: »die die Vergeblichkeit nur vergrößern«
  rationale: Die Formulierung folgt der Aussage des hebräischen Textes, ohne zu erläutern, auf welche Weise Worte die Nichtigkeit mehren, und bewahrt so die zugespitzte Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage bleibt direkt; »davon« verdeutlicht lediglich den im Deutschen erforderlichen Rückbezug.
