source:
  edition: WLC
  text: ט֛וֹב מַרְאֵ֥ה עֵינַ֖יִם מֵֽ/הֲלָךְ נָ֑פֶשׁ גַּם זֶ֥ה הֶ֖בֶל וּ/רְע֥וּת רֽוּחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/009.yaml
  text: Better is the sight of the eyes than the wandering of the soul[c][b][a]; this too is vapor and a chasing after wind.
translation:
  language: de
  text: Besser ist, was die Augen sehen,[a] als das Umherschweifen des Verlangens.[b] Auch das ist Dunst und ein Haschen nach Wind.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „der Anblick der Augen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der Seele“. Das hebräische Wort kann hier das Verlangen oder den begehrenden Menschen bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „ein Mühen um Wind“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב ... מִן
  choice: Besser ist ... als
  rationale: Die Vergleichskonstruktion wird im Deutschen idiomatisch mit „besser ... als“ wiedergegeben.
- source_word: מַרְאֵה עֵינַיִם
  choice: was die Augen sehen
  rationale: Die Wendung bezeichnet den Anblick beziehungsweise das, was vor Augen liegt; die gewählte Form ist konkret, natürlich und bewahrt das Augenmotiv.
- source_word: מֵהֲלָךְ נָפֶשׁ
  choice: als das Umherschweifen des Verlangens
  rationale: הֲלָךְ bezeichnet ein Gehen oder Umherziehen; נֶפֶשׁ meint hier wahrscheinlich das begehrende Selbst beziehungsweise sein Verlangen. Die Formulierung erhält das Bild ruhelosen Begehrens, ohne נֶפֶשׁ auf eine immaterielle „Seele“ festzulegen.
- source_word: גַּם זֶה
  choice: Auch das
  rationale: Entspricht der wiederkehrenden wertenden Formel des Predigers in natürlichem Deutsch.
- source_word: הֶבֶל
  choice: Dunst
  rationale: „Dunst“ hält die konkrete Metapher des Flüchtigen und Ungreifbaren fest und vermeidet die stärker auslegende traditionelle Wiedergabe „Nichtigkeit“.
- source_word: וּרְעוּת רוּחַ
  choice: und ein Haschen nach Wind
  rationale: Die idiomatische Wiedergabe vermittelt das Bild eines vergeblichen Bemühens und bewahrt zugleich den Wind als konkrete Metapher.
theological_decisions:
- issue: Bedeutung von נֶפֶשׁ in dieser Aussage
  choice: Verlangen
  alternative: Seele
  rationale: Im unmittelbaren Zusammenhang geht es um ungestilltes Begehren und nicht eindeutig um eine anthropologische Aussage über eine immaterielle Seele. Die Fußnote bewahrt die formnähere Alternative.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Weisheitston. Die Bildsprache von Augen, Umherschweifen, Dunst und Wind bleibt erhalten; echte lexikalische Mehrdeutigkeiten werden in den Fußnoten ausgewiesen.
