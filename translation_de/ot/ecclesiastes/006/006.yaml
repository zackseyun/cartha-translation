  text: וְ/אִלּ֣וּ חָיָ֗ה אֶ֤לֶף שָׁנִים֙ פַּעֲמַ֔יִם וְ/טוֹבָ֖ה לֹ֣א רָאָ֑ה הֲ/לֹ֛א אֶל מָק֥וֹם אֶחָ֖ד הַ/כֹּ֥ל הוֹלֵֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/006.yaml
  text: Even if he should live a thousand years twice over and not see good[c][b][a], do not all go to one place?
translation:
  language: de
  text: Und selbst wenn er zweimal tausend Jahre lebte[a] und nichts Gutes erlebte[b] – gehen nicht alle an einen Ort?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »tausend Jahre zweimal«; gemeint sein können auch »zweitausend Jahre«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »nichts Gutes sah«. »Gutes sehen« bedeutet hier, Gutes zu erfahren oder zu genießen.'
    reason: lexical_alternative
  - marker: c
    text: Der Ausdruck kann im Zusammenhang den gemeinsamen Bestimmungsort im Tod meinen; im Hebräischen steht lediglich »ein Ort«.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִלּוּ
  choice: Und selbst wenn
  rationale: Leitet eine steigernde, hypothetisch-konzessive Aussage ein; die Formulierung ist im Deutschen natürlich und bewahrt den Anschluss an den vorherigen Gedanken.
- source_word: חָיָה
  choice: er … lebte
  rationale: Der deutsche Konjunktiv II gibt das hypothetische Szenario angemessen wieder.
- source_word: אֶלֶף שָׁנִים פַּעֲמַיִם
  choice: zweimal tausend Jahre
  rationale: Bewahrt die auffällige hebräische Ausdrucksweise »tausend Jahre zweimal«, ohne sie zum bloßen Zahlwort »zweitausend« einzuebnen.
- source_word: וְטוֹבָה לֹא רָאָה
  choice: aber nichts Gutes erlebte
  rationale: »Gutes sehen« ist hier idiomatisch im Sinn von Gutes erfahren oder genießen. »Erleben« vermittelt diesen Sinn in natürlichem Deutsch; »aber« macht den konzessiven Gegensatz klar.
- source_word: הֲלֹא
  choice: gehen nicht
  rationale: Gibt die rhetorische Frage wieder, die Zustimmung erwartet.
- source_word: אֶל מָקוֹם אֶחָד
  choice: an ein und denselben Ort
  rationale: Entspricht dem Gedanken eines gemeinsamen Ortes und klingt im Deutschen natürlicher als »an einen Ort«, ohne diesen Ort näher zu bestimmen.
- source_word: הַכֹּל הוֹלֵךְ
  choice: gehen … alle
  rationale: Das Partizip formuliert eine allgemeine Wirklichkeit; das Präsens ist dafür im Deutschen passend.
theological_decisions:
- issue: Der nicht näher bezeichnete »eine Ort«
  choice: Im Haupttext bleibt das Ziel als »ein und derselbe Ort« unbestimmt.
  alternative: Tod, Grab oder Scheol ausdrücklich nennen.
  rationale: Der hebräische Text nennt nur einen gemeinsamen Ort. Eine ausdrückliche Benennung würde die im Wortlaut vorhandene Zurückhaltung auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Konjunktiv hält den hypothetischen Charakter fest; die idiomatische Wendung »Gutes sehen« wird im Haupttext verständlich wiedergegeben und in der Fußnote wörtlich dokumentiert.
