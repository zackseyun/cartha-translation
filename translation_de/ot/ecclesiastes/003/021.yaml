base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/021.yaml
  text: Who knows whether the spirit of the sons of man goes upward[b][a], and whether the spirit of the beast goes down to the earth?
translation:
  language: de
  text: Wer weiß, ob der Geist[a] der Menschen[b] nach oben steigt und ob der Geist des Tieres zur Erde hinabsteigt?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Lebensatem“. Das hebräische Wort רוּחַ kann hier Bedeutungen von Atem, Lebenskraft und Geist miteinander verbinden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „der Söhne des Menschen“. Die hebräische maskuline Wendung steht hier stellvertretend für die Menschen insgesamt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יוֹדֵעַ
  choice: Wer weiß
  rationale: Die knappe rhetorische Frage entspricht der hebräischen Form und bewahrt den skeptischen, erkenntniskritischen Ton.
- source_word: רוּחַ
  choice: Geist
  rationale: Im Zusammenhang von Tod und Geschick bezeichnet das Wort die belebende Lebenskraft; „Geist“ lässt die über bloße Atmung hinausreichende Bedeutung erkennen, ohne die ebenfalls mögliche Bedeutung „Lebensatem“ auszuschließen.
- source_word: בְּנֵי הָאָדָם
  choice: der Menschen
  rationale: Die natürliche moderne deutsche Wiedergabe bezeichnet die Menschheit insgesamt. Die wörtliche maskuline Wendung wird in einer Fußnote dokumentiert.
- source_word: הָעֹלָה הִיא לְמָעְלָה
  choice: nach oben steigt
  rationale: Die Formulierung gibt die Richtung der Bewegung klar und idiomatisch wieder, ohne aus der Frage eine Behauptung zu machen.
- source_word: וְרוּחַ הַבְּהֵמָה
  choice: und ob der Geist des Tieres
  rationale: Der hebräische Singular stellt das Tier repräsentativ dem Menschen gegenüber. Das wiederholte „ob“ macht im Deutschen deutlich, dass beide Satzteile von der Frage umfasst sind.
- source_word: הַיֹּרֶדֶת הִיא לְמַטָּה לָאָרֶץ
  choice: hinab zur Erde steigt
  rationale: Die Wendung bewahrt den räumlichen Gegensatz zu „nach oben“ sowie den Bezug zur Erde im Zusammenhang der Sterblichkeit.
theological_decisions:
- issue: Frage oder dogmatische Aussage über das Geschick nach dem Tod
  choice: 'Als offene rhetorische Frage: „Wer weiß, ob …?“'
  alternative: Als Aussage, dass der menschliche Geist nach oben und der tierische zur Erde hinabgeht
  rationale: מִי יוֹדֵעַ eröffnet ausdrücklich eine Erkenntnisfrage. Die Übersetzung wahrt diese Unsicherheit und legt keine feststehende Lehre in den Vers hinein.
- issue: Reichweite der Frage im zweiten Satzteil
  choice: „ob“ auch vor dem Geist des Tieres wiederholen
  alternative: Den zweiten Satzteil ohne wiederholtes „ob“ als Aussage formulieren
  rationale: Obwohl im Hebräischen kein zweites Fragewort steht, umfasst die eröffnete Frage syntaktisch und sinngemäß beide parallelen Glieder. Die Wiederholung ist im Deutschen eindeutig und natürlich.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die parallele Bewegungsrichtung nach oben beziehungsweise hinab bleibt hörbar; die erkenntnistheologische Spannung des Verses wird nicht aufgelöst.
