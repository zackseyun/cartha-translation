  text: What profit has the worker from that in which he labors?[a]
translation:
  language: de
  text: Welchen Gewinn hat der Arbeiter aus dem, woran er sich abmüht?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Was hat der Arbeiter von dem, woran er sich abmüht?«'
    reason: Die Präposition בְּ in בַּאֲשֶׁר kann den Bereich bzw. Gegenstand der Mühe markieren; die alternative Formulierung gibt die Frage idiomatisch als Gewinn aus dieser Mühe wieder.
lexical_decisions:
- source_word: מַה
  choice: Welchen
  rationale: Das Fragewort eröffnet eine knappe rhetorische Frage. In Verbindung mit »Gewinn« ist »Welchen Gewinn« im Deutschen natürlich und bewahrt die zugespitzte Form.
- source_word: יִתְרוֹן
  choice: Gewinn
  rationale: Das Substantiv bezeichnet im Predigerbuch den bleibenden Überschuss, Nutzen oder Vorteil einer Tätigkeit. »Gewinn« erhält den wiederkehrenden wirtschaftlichen Bildbereich des Buches.
- source_word: הָעֹשֶׂה
  choice: der Arbeiter
  rationale: Das substantivierte Partizip bedeutet wörtlich »der Handelnde/Tuende«. Zusammen mit עָמֵל bezeichnet es hier den Menschen, der arbeitet; »der Arbeiter« ist idiomatisches modernes Deutsch.
- source_word: בַּאֲשֶׁר
  choice: von dem, womit
  rationale: Die Verbindung aus Präposition und Relativpartikel bezeichnet den Bereich beziehungsweise die Sache, an der gearbeitet wird. Im Deutschen macht »von dem, womit« zugleich deutlich, woraus ein möglicher Gewinn hervorgehen soll.
- source_word: הוּא
  choice: er
  rationale: Das ausdrückliche maskuline Singularpronomen nimmt das Subjekt erneut auf. Im deutschen Relativsatz ist es in der Verbform und dem reflexiven Pronomen »sich« enthalten, ohne eigens wiederholt werden zu müssen.
- source_word: עָמֵל
  choice: sich abmüht
  rationale: Das Wort bezeichnet mühevolle, belastende Arbeit. »Sich abmühen« gibt diesen stärkeren Bedeutungsgehalt genauer wieder als das neutralere »arbeiten«.
theological_decisions:
- issue: Generisches Maskulinum
  choice: der Arbeiter … sich
  alternative: wer arbeitet … sich
  rationale: Der hebräische Text verwendet maskuline Singularformen für einen repräsentativen Menschen. Die Übersetzung bewahrt diese Form, ohne sie auf eine bestimmte Person oder ausschließlich auf Männer einzuengen.
translation_notes:
  register: Modernes, knappes und würdevolles Standarddeutsch. Die rhetorische Zuspitzung und das Schlüsselwort »Gewinn« bleiben erhalten; »sich abmühen« bringt die belastende Seite von עמל zum Ausdruck.
