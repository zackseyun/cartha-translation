    rationale: Das Hebräische hat hier keine eigene Entsprechung für „jetzt“. Die Gegenwartsbeziehung ergibt sich aus הוּא; eine Wiedergabe ohne das zusätzliche Adverb ist quellentreuer.
  - severity: medium
    issue: Fußnote zur schwierigen Schlussklausel ist semantisch zu breit und teilweise zu bestimmt
    rationale: „Verdrängte“ ist keine unmittelbare lexikalische Wiedergabe von נִרְדָּף. Die Deutung auf das vergangene Geschehen und ein göttliches Einfordern ist möglich, soll aber als Auslegung der schwierigen Gesamtwendung, nicht als direkte Bedeutung jedes einzelnen Wortes, kenntlich bleiben.
