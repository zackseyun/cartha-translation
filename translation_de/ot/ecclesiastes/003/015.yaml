  verdict: revise
  source_fidelity: Die zeitlichen Parallelglieder geben מַה שֶּׁהָיָה ... כְּבָר הוּא und וַאֲשֶׁר לִהְיוֹת כְּבָר הָיָה im Wesentlichen treffend wieder. In der ersten Zeile ist „jetzt“ jedoch eine nicht ausdrücklich im Hebräischen stehende zeitliche Präzisierung. Die Schlussklausel wird mit „das Verfolgte“ angemessen knapp und offen wiedergegeben; נִרְדָּף bleibt allerdings schwierig und sollte in der Anmerkung präziser als passives Partizip und mit seinen tragfähigen Deutungsoptionen erläutert werden.
  naturalness: „Was schon gewesen ist, ist jetzt da“ ist verständlich, aber „jetzt“ wirkt gegenüber der knappen hebräischen Kopulasatzstruktur leicht erläuternd. „Was schon gewesen ist, das ist da“ ist natürliches, aphoristisches Standarddeutsch und wahrt die Betonung durch das resumptive „das“.
  terminology: „Gott“ ist korrekt. „Das Verfolgte“ bewahrt die substantivierte, passive und nicht auf Personen beschränkte Form von נִרְדָּף. Die bisherige Fußnote vermischt hingegen „verdrängt“ und ein bestimmtes Wieder-Einfordern des Vergangenen stärker, als der hebräische Wortlaut verlangt.
