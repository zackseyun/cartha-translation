  text: מַה שֶּֽׁ/הָיָה֙ כְּבָ֣ר ה֔וּא וַ/אֲשֶׁ֥ר לִ/הְי֖וֹת כְּבָ֣ר הָיָ֑ה וְ/הָ/אֱלֹהִ֖ים יְבַקֵּ֥שׁ אֶת נִרְדָּֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/015.yaml
  text: What has been already is[a], and what is to be has already been; and God seeks what has been driven away.
translation:
  language: de
  text: Was schon gewesen ist, das ist da, und was sein wird, ist schon gewesen. Und Gott sucht das Verfolgte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gott sucht, was verfolgt wird“ oder „was vertrieben wurde“. Die hebräische Schlusswendung ist schwierig. Das passive Partizip kann das Verfolgte bzw. Verfolgte bezeichnen; im Zusammenhang wird die Klausel auch so verstanden, dass Gott das Vergangene wieder aufsucht oder zur Rechenschaft zieht.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַה שֶּׁהָיָה
  choice: Was schon gewesen ist
  rationale: Die Wendung bezeichnet allgemein das bereits Geschehene oder Vorhandene. Die Formulierung bleibt umfassend und bildet mit dem folgenden Zukunftssatz eine klare Parallele.
- source_word: כְּבָר הוּא
  choice: ist jetzt da
  rationale: כְּבָר markiert hier das bereits eingetretene Vorhandensein; הוּא steht prädikativ. „Ist jetzt da“ gibt den knappen hebräischen Nominalsatz in natürlichem Deutsch wieder, ohne ihn auf bloße zeitliche Identität zu verengen.
- source_word: וַאֲשֶׁר לִהְיוֹת
  choice: und was sein wird
  rationale: Die Infinitivwendung blickt auf das Kommende. „Was sein wird“ ist idiomatisch und bewahrt die Parallelität des Spruchs.
- source_word: כְּבָר הָיָה
  choice: ist schon gewesen
  rationale: „Schon“ gibt כְּבָר knapp wieder und erhält die pointierte Aussage, dass auch das Zukünftige bereits dagewesen ist.
- source_word: הָאֱלֹהִים
  choice: Gott
  rationale: Der Ausdruck bezeichnet im Kontext den einen Gott; „Gott“ ist die sachgemäße deutsche Wiedergabe.
- source_word: יְבַקֵּשׁ
  choice: sucht
  rationale: „Sucht“ bewahrt die Grundbedeutung von בקשׁ und lässt mögliche Bedeutungsnuancen wie Wiederherstellung oder Rechenschaft bewusst offen.
- source_word: אֶת נִרְדָּף
  choice: das Verfolgte
  rationale: Das substantivierte passive Partizip von רדף bedeutet wörtlich „das Verfolgte“. Diese Wiedergabe bewahrt Geschlecht, Zahl und semantische Offenheit besser als eine Festlegung auf Vergangenheit, Kreislauf oder bedrängte Menschen.
theological_decisions:
- issue: Deutung von וְהָאֱלֹהִים יְבַקֵּשׁ אֶת נִרְדָּף
  choice: Und Gott sucht das Verfolgte.
  alternative: 'Und Gott sucht, was vertrieben wurde; oder: Gott fordert das Vergangene wieder ein.'
  rationale: Die stark verdichtete Schlussklausel kann auf Verfolgtes beziehungsweise Verdrängtes, auf Vergangenes oder auf ein göttliches Einfordern zielen. Der Haupttext bleibt nahe an den lexikalischen Grundbedeutungen und entscheidet die theologische oder philosophische Spannung nicht stillschweigend.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit aphoristischer Kürze. Die parallele Zeitstruktur wird deutlich gehalten; die Mehrdeutigkeit der Schlussklausel bleibt im Haupttext erhalten und wird in der Fußnote erläutert.
