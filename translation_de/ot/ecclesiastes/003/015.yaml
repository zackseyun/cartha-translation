- from: Was schon gewesen ist, ist jetzt da, und was sein wird, ist schon gewesen. Und Gott sucht das Verfolgte.[a]
  to: Was schon gewesen ist, das ist da, und was sein wird, ist schon gewesen. Und Gott sucht das Verfolgte.[a]
