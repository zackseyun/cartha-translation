  text: a time to love[a], and a time to hate; a time for war[c][b], and a time for peace.
translation:
  language: de
  text: Eine Zeit[a] zu lieben und eine Zeit zu hassen[b]; eine Zeit des Krieges und eine Zeit des Friedens[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine bestimmte Zeit“ beziehungsweise „eine Zeitspanne“. Das hebräische עֵת kann einen Zeitpunkt oder einen Zeitraum bezeichnen; „Zeit“ bewahrt hier am besten den wiederkehrenden Rhythmus des Gedichts.'
    reason: lexical_alternative
  - marker: b
    text: „Hassen“ gibt das hebräische Verb direkt wieder. In diesem Weisheitskontext kann es starke Abneigung oder Gegnerschaft im Gegensatz zum Lieben ausdrücken; böswilliger Hass ist damit nicht zwangsläufig gemeint.
    reason: lexical_alternative
  - marker: c
    text: Das hebräische שָׁלוֹם kann auch „Wohlergehen“ oder „Unversehrtheit“ bedeuten; der Gegensatz zu „Krieg“ spricht hier für „Frieden“.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵת
  choice: eine Zeit
  rationale: עֵת bezeichnet einen Zeitpunkt oder Zeitraum. „Eine Zeit“ gibt die wiederkehrende Form des Gedichts unmittelbar und im Deutschen natürlich wieder; „eine bestimmte Zeit“ oder „eine Zeitspanne“ wäre interpretierender.
- source_word: לֶאֱהֹב
  choice: zu lieben
  rationale: Der Infinitiv von אָהֵב bezeichnet hier ohne erkennbare Einschränkung das Lieben und bildet den direkten Gegenpol zu „hassen“.
- source_word: לִשְׂנֹא
  choice: zu hassen
  rationale: שָׂנֵא bedeutet gewöhnlich „hassen“. Die starke, spannungsvolle Antithese des hebräischen Gedichts wird nicht durch eine mildere Umschreibung abgeschwächt.
- source_word: מִלְחָמָה
  choice: Krieg
  rationale: מִלְחָמָה bezeichnet Krieg oder bewaffneten Konflikt. In der Gegenüberstellung mit שָׁלוֹם ist „Krieg“ die klare und idiomatische Wiedergabe.
- source_word: שָׁלוֹם
  choice: Frieden
  rationale: שָׁלוֹם kann umfassender Wohlergehen oder Unversehrtheit bedeuten; der unmittelbare Gegensatz zu „Krieg“ legt hier „Frieden“ nahe.
theological_decisions:
- issue: Moralische Tragweite von „hassen“ im Weisheitskontext
  choice: „hassen“ unverändert im Haupttext beibehalten
  alternative: „sich abwenden“, „Gegnerschaft zeigen“ oder „nicht lieben“
  rationale: Der Vers stellt gegensätzliche Zeiten menschlichen Lebens nebeneinander und formuliert kein uneingeschränktes Gebot zum Hass. Die direkte Wiedergabe bewahrt die Spannung des hebräischen Textes, ohne sie durch eine Deutung im Haupttext aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Parallelstruktur. Die viermalige Wiederholung von „eine Zeit“ spiegelt den hebräischen Rhythmus; „des Krieges“ und „des Friedens“ geben die nominalen Fügungen natürlich wieder.
