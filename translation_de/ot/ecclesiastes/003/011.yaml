id: ECC.3.11
reference: Ecclesiastes 3:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֶת הַ/כֹּ֥ל עָשָׂ֖ה יָפֶ֣ה בְ/עִתּ֑/וֹ גַּ֤ם אֶת הָ/עֹלָם֙ נָתַ֣ן בְּ/לִבָּ֔/ם מִ/בְּלִ֞י אֲשֶׁ֧ר לֹא יִמְצָ֣א הָ/אָדָ֗ם אֶת הַֽ/מַּעֲשֶׂ֛ה אֲשֶׁר עָשָׂ֥ה הָ/אֱלֹהִ֖ים מֵ/רֹ֥אשׁ וְ/עַד סֽוֹף־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/011.yaml
  text: He has made everything beautiful in its time. He has also put eternity in their heart[a], yet so that man cannot find out the work that God has done from beginning to end.
translation:
  language: de
  text: Alles hat er schön gemacht zu seiner Zeit. Auch die Ewigkeit hat er ihnen ins Herz gelegt[a], ohne dass der Mensch das Werk, das Gott getan hat, von Anfang bis Ende ergründen kann.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „die Welt“ oder „das Zeitalter“. Das hebräische Wort עוֹלָם ist hier schwer zu deuten und kann ein Bewusstsein für den gesamten Zeitlauf oder für die Welt jenseits der unmittelbaren Erfahrung bezeichnen.
    reason: lexikalische Alternative
lexical_decisions:
- source_word: הַכֹּל
  choice: alles
  rationale: Gibt die umfassende Bedeutung des hebräischen Ausdrucks knapp und natürlich wieder; gemeint ist die Gesamtheit dessen, was Gott tut oder ordnet.
- source_word: יָפֶה
  choice: schön
  rationale: Bewahrt sowohl den naheliegenden Sinn von Schönheit als auch die kontextuelle Nuance des Passenden oder Wohlgeordneten.
- source_word: בְעִתּוֹ
  choice: zu seiner Zeit
  rationale: Greift das Leitmotiv der bestimmten Zeiten in diesem Kapitel auf und lässt den Rückbezug auf alles Einzelne erkennen.
- source_word: הָעֹלָם
  choice: die Ewigkeit
  rationale: Gibt die Vorstellung eines über den unmittelbaren Augenblick hinausreichenden Zeithorizonts wieder. Da das hebräische Wort an dieser Stelle umstritten ist, werden weitere Möglichkeiten in der Fußnote genannt.
- source_word: בְּלִבָּם
  choice: ihnen ins Herz
  rationale: Das Herz bezeichnet im Hebräischen den inneren Menschen einschließlich Denken und Wollen. Die deutsche Formulierung ist idiomatisch und bewahrt den pluralischen Bezug.
- source_word: מִבְּלִי אֲשֶׁר לֹא
  choice: ohne dass ... kann
  rationale: Gibt die schwerfällige hebräische Begrenzungsformel natürlich wieder und hält fest, dass dem Menschen die vollständige Ergründung verwehrt bleibt.
- source_word: הָאָדָם
  choice: der Mensch
  rationale: Bewahrt die repräsentative Singularform und macht zugleich den allgemeinen Bezug auf die Menschheit deutlich.
- source_word: יִמְצָא
  choice: ergründen kann
  rationale: Im Zusammenhang geht es nicht um bloßes Auffinden, sondern darum, Gottes gesamtes Handeln vollständig zu erfassen oder nachzuvollziehen.
- source_word: הַמַּעֲשֶׂה
  choice: das Werk
  rationale: Bezeichnet Gottes Handeln in seiner Gesamtheit und entspricht der singularischen Form des Ausgangstextes.
- source_word: מֵרֹאשׁ וְעַד סוֹף
  choice: von Anfang bis Ende
  rationale: Die geläufige deutsche Wendung bewahrt den Merismus, der vollständigen Umfang ausdrückt.
theological_decisions:
- issue: Bedeutung von הָעֹלָם im Verhältnis zu menschlicher Erkenntnis und Gottes Handeln
  choice: Im Haupttext steht „die Ewigkeit“.
  alternative: Möglich sind auch „die Welt“, „das Zeitalter“ oder ein Bewusstsein für den gesamten Zeitlauf; vereinzelt wird zudem an Verborgenheit gedacht.
  rationale: „Ewigkeit“ wahrt die Spannung zwischen dem dem Menschen gegebenen Blick über den Augenblick hinaus und seiner bleibenden Unfähigkeit, Gottes Werk vollständig zu durchschauen. Die umstrittene Bedeutung wird nicht dogmatisch festgelegt, sondern durch eine Fußnote offengehalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. „Zu seiner Zeit“ und „von Anfang bis Ende“ greifen die prägnante, poetische Struktur des Verses auf; „ergründen“ bezeichnet verständlich die Grenze menschlicher Gesamterkenntnis.
