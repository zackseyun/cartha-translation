  text: יָדַ֕עְתִּי כִּ֛י אֵ֥ין ט֖וֹב בָּ֑/ם כִּ֣י אִם לִ/שְׂמ֔וֹחַ וְ/לַ/עֲשׂ֥וֹת ט֖וֹב בְּ/חַיָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/012.yaml
  text: I know that there is nothing better for them than to rejoice and to do good during their lives[a].
translation:
  language: de
  text: 'Ich habe erkannt: Es gibt nichts Besseres für sie, als sich zu freuen und in ihrem Leben Gutes zu tun.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und es sich gut gehen zu lassen“ beziehungsweise „und das Leben zu genießen“. Die hebräische Wendung kann ethisch („Gutes tun“) oder erfahrungsbezogen („es gut haben, das Leben genießen“) verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַעְתִּי
  choice: Ich habe erkannt
  rationale: Das Qal-Perfekt 1. Person Singular bezeichnet hier eine durch Nachdenken gewonnene Einsicht. „Ich habe erkannt“ bewahrt den rückblickend-reflektierenden Ton; „ich weiß“ wäre ebenfalls möglich.
- source_word: אֵין טוֹב בָּם
  choice: Es gibt nichts Besseres für sie
  rationale: Die schwierige Wendung wird im Zusammenhang von Kohelets wiederkehrenden Aussagen idiomatisch und komparativ verstanden, nicht als Behauptung, in den Menschen sei nichts Gutes.
- source_word: כִּי אִם
  choice: als
  rationale: Nach „nichts Besseres“ gibt „als“ den ausschließend-komparativen Sinn der Partikelverbindung im Deutschen natürlich wieder.
- source_word: לִשְׂמוֹחַ
  choice: sich zu freuen
  rationale: Der Infinitiv von שׂמח bezeichnet Freude beziehungsweise Frohsein. Die reflexive deutsche Form klingt natürlich und wahrt den verbalen Charakter.
- source_word: וְלַעֲשׂוֹת טוֹב
  choice: und Gutes zu tun
  rationale: Dies entspricht dem naheliegenden ethischen Wortsinn von עשה טוב. Da die Wendung im Kontext auch erfahrungsbezogen verstanden werden kann, wird diese echte Mehrdeutigkeit in der Fußnote festgehalten.
- source_word: בְּחַיָּיו
  choice: in ihrem Leben
  rationale: Der hebräische Singular „in seinem Leben“ wird distributiv auf das zuvor pluralisch bezeichnete „sie“ bezogen. Der deutsche Singular „in ihrem Leben“ erhält diese distributive Spannung besser als die unnötig kollektive Form „in ihren Leben“.
theological_decisions:
- issue: Deutung von וְלַעֲשׂוֹת טוֹב
  choice: 'ethisch: „Gutes zu tun“'
  alternative: 'erfahrungsbezogen: „es sich gut gehen zu lassen“, „das Leben zu genießen“ oder „Wohlergehen zu erfahren“'
  rationale: Der ethische Sinn ist lexikalisch unmittelbar möglich und sollte nicht ohne zwingenden Grund abgeschwächt werden. Zugleich kann טוב bei Kohelet erfahrungsbezogenes Wohlergehen oder Genießen bezeichnen; deshalb bleibt diese Auslegung ausdrücklich als Alternative erhalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, reflektierendem Ton. Die Satzgestalt folgt dem hebräischen Gedankengang, ohne unnatürlich wörtlich zu wirken. „Ich habe erkannt“ spiegelt Kohelets beobachtende Reflexion; die lexikalische Mehrdeutigkeit am Versende wird nicht im Haupttext aufgelöst, sondern transparent in der Fußnote bewahrt.
