  text: וְ/גַ֤ם כָּל הָ/אָדָם֙ שֶׁ/יֹּאכַ֣ל וְ/שָׁתָ֔ה וְ/רָאָ֥ה ט֖וֹב בְּ/כָל עֲמָל֑/וֹ מַתַּ֥ת אֱלֹהִ֖ים הִֽיא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/013.yaml
  text: And also that every man should eat and drink and see good in all his labor—this is the gift of God[a][b].
translation:
  language: de
  text: Und auch, dass jeder Mensch isst und trinkt und bei all seiner Mühe Gutes genießt, ist eine Gabe Gottes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Gutes sehen“; gemeint ist, Gutes zu erfahren oder zu genießen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: 'Und auch:'
  rationale: Die Wendung führt ergänzend einen weiteren Gedanken aus dem vorherigen Zusammenhang an. Der Doppelpunkt bildet die inhaltliche Entfaltung im Deutschen natürlich ab.
- source_word: כָּל הָאָדָם
  choice: jeder Mensch
  rationale: אָדָם bezeichnet hier im generischen Singular jeden Menschen. „Jeder Mensch“ wahrt sowohl die distributive Aussage als auch den umfassenden Bezug und ist im modernen Deutschen natürlich.
- source_word: שֶׁיֹּאכַל וְשָׁתָה
  choice: soll essen und trinken
  rationale: Die Verbfolge beschreibt den dem Menschen gewährten beziehungsweise angemessenen Genuss. „Soll“ bewahrt die modale Offenheit zwischen Möglichkeit, Gewährung und allgemeiner Bestimmung besser als eine rein indikativische Wiedergabe.
- source_word: וְרָאָה טוֹב
  choice: und Gutes genießen
  rationale: Wörtlich steht „Gutes sehen“; im Predigerbuch bezeichnet die feste Wendung jedoch das Erfahren oder Genießen des Guten. Die idiomatische Übersetzung ist im Deutschen klar und natürlich; die wörtliche Bildsprache wird in der Fußnote dokumentiert.
- source_word: בְּכָל עֲמָלוֹ
  choice: bei all seiner Mühe
  rationale: עָמָל bezeichnet mühevolle Arbeit und deren Belastung. „Bei all seiner Mühe“ folgt der Präposition, erhält den anstrengenden Beiklang und passt zugleich zum positiven Gedanken des Genusses.
- source_word: מַתַּת אֱלֹהִים הִיא
  choice: das ist eine Gabe Gottes
  rationale: Der nominale Schlusssatz identifiziert den zuvor beschriebenen Genuss als von Gott gegeben. Der hebräische Ausdruck ist nicht ausdrücklich bestimmt; deshalb vermeidet „eine Gabe Gottes“ eine unnötige Festlegung auf „die Gabe“.
theological_decisions:
- issue: Generischer Gebrauch von אָדָם
  choice: jeder Mensch
  alternative: jeder Mann
  rationale: Gemeint ist nicht ausschließlich ein männlicher Erwachsener, sondern jeder Angehörige der Menschheit. Das Deutsche „jeder Mensch“ gibt den tatsächlichen Referenzumfang des generischen hebräischen Singulars präzise wieder, ohne eine nicht vorhandene Geschlechtsbeschränkung einzutragen.
- issue: Bestimmtheit von מַתַּת אֱלֹהִים
  choice: eine Gabe Gottes
  alternative: die Gabe Gottes
  rationale: Die artikellose hebräische Nominalfügung lässt eine qualitative beziehungsweise indefinite Wiedergabe zu. „Eine Gabe Gottes“ bewahrt diese Offenheit und bezeichnet das Genießen als göttliche Gabe, ohne es als die eine, ausschließliche Gabe auszugeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am additiven hebräischen Gedankengang, während die idiomatische Wendung וְרָאָה טוֹב verständlich wiedergegeben wird.
