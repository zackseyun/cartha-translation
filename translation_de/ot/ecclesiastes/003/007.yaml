  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Parallelstruktur. Die viermalige Konstruktion „eine Zeit zum …“ bildet die Wiederholung des Hebräischen natürlich ab; das Semikolon markiert die beiden Gegensatzpaare.
