  source_fidelity: Der Entwurf gibt die vierfach wiederholte hebräische Struktur עֵת ל־ präzise und ohne sachliche Ergänzungen wieder. „zum Zerreißen“, „zum Nähen“, „zum Schweigen“ und „zum Reden“ entsprechen den Infinitiven und bewahren die knappen Gegensatzpaare. Die mögliche, aber nicht ausdrücklich benannte Beziehung des Zerreißens zu Kleidern wird zutreffend nur in der Anmerkung erläutert.
  naturalness: „Eine Zeit zum …“ ist modernes, idiomatisches Deutsch und trägt den poetischen Rhythmus. Die Zeilengliederung sowie das Semikolon zwischen den beiden Paaren sind klar und angemessen.
