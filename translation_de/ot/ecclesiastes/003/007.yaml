base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/007.yaml
  text: a time to tear[a], and a time to sew; a time to keep silent, and a time to speak[b];
translation:
  language: de
  text: 'eine Zeit zum Zerreißen[a] und eine Zeit zum Nähen,

    eine Zeit zum Schweigen und eine Zeit zum Reden[b];'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das „Zerreißen“ kann auf das Zerreißen von Kleidern als Zeichen von Trauer, Bestürzung oder Klage anspielen; im Hebräischen wird jedoch kein Gegenstand genannt.
    reason: cultural_note
  - marker: b
    text: 'Oder: „eine Zeit, still zu sein“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵת
  choice: eine Zeit
  rationale: עֵת bezeichnet einen Zeitpunkt oder Zeitraum. „Eine Zeit“ bewahrt den wiederkehrenden Rhythmus des Gedichts und entspricht dem paarweisen Aufbau.
- source_word: לִקְרוֹעַ
  choice: zum Zerreißen
  rationale: קרע bedeutet „zerreißen“ und wird häufig vom Zerreißen von Kleidern gebraucht. Die Übersetzung bleibt nah am Wortlaut, ohne ein im Hebräischen nicht genanntes Objekt hinzuzufügen.
- source_word: לִתְפּוֹר
  choice: zum Nähen
  rationale: תפר bedeutet „nähen“. „Nähen“ wahrt den knappen Gegensatz zu „Zerreißen“, während „Flicken“ oder „Ausbessern“ den Vorgang stärker auslegen würde.
- source_word: לַחֲשׁוֹת
  choice: zum Schweigen
  rationale: חשה kann „schweigen“ oder „still sein“ bedeuten. „Schweigen“ ist im Deutschen knapp, natürlich und kann bewusste Zurückhaltung ausdrücken.
- source_word: לְדַבֵּר
  choice: zum Reden
  rationale: דבר ist das gewöhnliche Verb für „reden/sprechen“. „Reden“ bildet mit „Schweigen“ ein natürliches, poetisch knappes Gegensatzpaar.
theological_decisions: []
