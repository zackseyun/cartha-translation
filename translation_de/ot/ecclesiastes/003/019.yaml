  text: כִּי֩ מִקְרֶ֨ה בְֽנֵי הָ/אָדָ֜ם וּ/מִקְרֶ֣ה הַ/בְּהֵמָ֗ה וּ/מִקְרֶ֤ה אֶחָד֙ לָ/הֶ֔ם כְּ/מ֥וֹת זֶה֙ כֵּ֣ן מ֣וֹת זֶ֔ה וְ/ר֥וּחַ אֶחָ֖ד לַ/כֹּ֑ל וּ/מוֹתַ֨ר הָ/אָדָ֤ם מִן הַ/בְּהֵמָה֙ אָ֔יִן כִּ֥י הַ/כֹּ֖ל הָֽבֶל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/019.yaml
  text: 'For the fate of the sons of man and the fate of the beast is one fate for them: as this one dies[a], so dies that one, and one breath is for all. Man has no advantage over the beast, for all is vapor.'
translation:
  language: de
  text: 'Denn für Menschen und Tiere gibt es ein und dasselbe Geschick: Wie diese sterben, so sterben jene; und ein und derselbe Lebensatem[a] ist allen gemeinsam. Der Mensch hat keinen Vorzug vor dem Tier, denn alles ist Dunst.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein und derselbe Geist ist allen gemeinsam“. Das hebräische Wort רוּחַ kann „Atem“, „Wind“ oder „Geist“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְרֶה
  choice: Geschick
  rationale: Das Wort bezeichnet hier das gemeinsame Widerfahrnis beziehungsweise den Ausgang des Todes. „Geschick“ bewahrt den existenziellen Sinn, ohne einen starren Schicksalsdeterminismus auszudrücken.
- source_word: בְנֵי הָאָדָם
  choice: die Menschen
  rationale: Die hebräische Wendung bedeutet hier idiomatisch die Angehörigen der Menschheit. „Die Menschen“ ist im modernen Deutschen natürlich und erhält den allgemeinen Bezug.
- source_word: הַבְּהֵמָה
  choice: die Tiere / das Tier
  rationale: Der hebräische Singular wird kollektiv gebraucht. Im ersten Satz ist der deutsche Plural natürlich; im zugespitzten Vergleich wahrt der Singular „das Tier“ die hebräische Gegenüberstellung.
- source_word: וּמִקְרֶה אֶחָד לָהֶם
  choice: ist für sie ein und dasselbe
  rationale: Die Formulierung gibt אֶחָד („eins“) betont wieder und vermeidet im Deutschen die schwerfällige Wiederholung von „Geschick“.
- source_word: כְּמוֹת זֶה כֵּן מוֹת זֶה
  choice: Wie diese sterben, so sterben jene
  rationale: Die demonstrative Parallelstruktur des Hebräischen bleibt erhalten und wird passend auf die zuvor genannten Gruppen bezogen.
- source_word: רוּחַ אֶחָד לַכֹּל
  choice: alle haben denselben Lebensatem
  rationale: Im Zusammenhang gemeinsamer Sterblichkeit bezeichnet רוּחַ wahrscheinlich den belebenden Atem. „Lebensatem“ ist verständlich und erhält zugleich die Nähe zum theologischen Begriff „Geist“, dessen mögliche Lesart in der Fußnote genannt wird.
- source_word: מוֹתַר
  choice: Vorzug
  rationale: „Vorzug“ gibt den komparativen Sinn von Gewinn, Überschuss oder Überlegenheit in dieser Gegenüberstellung prägnant wieder.
- source_word: הָאָדָם
  choice: der Mensch
  rationale: Der kollektive Singular stellt die Menschheit dem kollektiv verstandenen Tier gegenüber und klingt im Deutschen natürlich.
- source_word: הָבֶל
  choice: Dunst
  rationale: „Dunst“ bewahrt das konkrete Bild des Flüchtigen, Unfassbaren und Vergänglichen, das für הֶבֶל im Predigerbuch kennzeichnend ist.
theological_decisions:
- issue: Bedeutung von רוּחַ beim Vergleich von Menschen und Tieren
  choice: Lebensatem
  alternative: Geist
  rationale: Der unmittelbare Zusammenhang betont die gemeinsame Sterblichkeit. „Lebensatem“ passt zu dieser Beobachtung, während die Fußnote die echte lexikalische und anthropologische Mehrdeutigkeit offenhält.
- issue: Wiedergabe von אָדָם / בְנֵי הָאָדָם
  choice: die Menschen … der Mensch
  alternative: die Söhne des Menschen … der Mann
  rationale: Die Ausdrücke beziehen sich generisch auf die Menschheit. Eine wörtliche Wiedergabe mit „Söhne“ wäre im heutigen Deutschen missverständlich und würde Frauen unbeabsichtigt auszuschließen scheinen.
- issue: Aussage, der Mensch habe keinen Vorzug vor dem Tier
  choice: ohne erklärende Einschränkung beibehalten
  alternative: ausdrücklich auf den Tod beschränken
  rationale: Der Kontext betrifft zwar die gemeinsame Sterblichkeit, doch der Vers formuliert umfassend. Die Übersetzung soll diese Spannung nicht durch einen erklärenden Zusatz abschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ausgewogene Satzstruktur und die demonstrative Gegenüberstellung spiegeln den hebräischen Parallelismus. „Dunst“ wird als Leitmetapher für הֶבֶל verwendet.
