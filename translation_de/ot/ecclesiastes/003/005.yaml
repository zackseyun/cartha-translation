  text: עֵ֚ת לְ/הַשְׁלִ֣יךְ אֲבָנִ֔ים וְ/עֵ֖ת כְּנ֣וֹס אֲבָנִ֑ים עֵ֣ת לַ/חֲב֔וֹק וְ/עֵ֖ת לִ/רְחֹ֥ק מֵ/חַבֵּֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/005.yaml
  text: A time to throw stones[a], and a time to gather stones; a time to embrace, and a time to refrain from embracing.
translation:
  language: de
  text: Eine Zeit, Steine zu werfen, und eine Zeit, Steine zu sammeln; eine Zeit zum Umarmen und eine Zeit, sich vom Umarmen fernzuhalten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֵת
  choice: eine Zeit
  rationale: עֵת bezeichnet einen Zeitpunkt oder Zeitraum. „Eine Zeit“ wahrt das wiederkehrende Muster des Gedichts und klingt im modernen Deutschen natürlich.
- source_word: לְהַשְׁלִיךְ
  choice: wegzuwerfen
  rationale: Der Hifil-Infinitiv von שלך bedeutet „werfen“ oder „wegwerfen“. Der Kontext mit dem gegensätzlichen Sammeln legt „wegwerfen“ nahe, ohne die Bildsprache näher auszudeuten.
- source_word: אֲבָנִים
  choice: Steine
  rationale: אֶבֶן bedeutet gewöhnlich „Stein“. „Steine“ gibt das konkrete hebräische Bild unmittelbar wieder.
- source_word: כְּנוֹס
  choice: zu sammeln
  rationale: Der Infinitiv von כנס bedeutet „sammeln“ oder „zusammentragen“. „Sammeln“ bildet einen knappen und natürlichen Gegensatz zu „wegwerfen“.
- source_word: לַחֲבוֹק
  choice: sich zu umarmen
  rationale: חבק bedeutet „umarmen“. Die reflexive Form ist im Deutschen bei einem allgemein formulierten, wechselseitigen Umarmen natürlich und bewahrt sowohl den körperlichen als auch den zwischenmenschlichen Sinn.
- source_word: לִרְחֹק מֵחַבֵּק
  choice: sich vom Umarmen fernzuhalten
  rationale: רחק bezeichnet das Fernsein oder Sich-Fernhalten; mit מן und „umarmen“ wird ein Abstandnehmen von dieser Handlung ausgedrückt. Die Wiedergabe bleibt näher am räumlichen Bild als „auf Umarmungen zu verzichten“ und ist dennoch verständlich.
theological_decisions:
- issue: Deutung des Werfens und Sammelns von Steinen
  choice: Die konkrete Bildsprache bleibt im Haupttext unaufgelöst.
  alternative: Das Bild ausdrücklich auf Beziehungen, Landwirtschaft oder Krieg beziehen.
  rationale: Der hebräische Text nennt keinen bestimmten Anwendungsbereich. Eine Festlegung würde eine mögliche Auslegung in die Übersetzung eintragen und die echte Mehrdeutigkeit beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Parallelstruktur. Das wiederholte „eine Zeit“ erhält den Rhythmus des hebräischen Gedichts; die mehrdeutige Steinmetaphorik wird nicht vereindeutigt.
