base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/002.yaml
  text: A time to be born[a], and a time to die; a time to plant, and a time to uproot what is planted.
translation:
  language: de
  text: Eine Zeit zum Gebären und eine Zeit zum Sterben; eine Zeit zum Pflanzen und eine Zeit, das Gepflanzte auszureißen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֵת
  choice: eine Zeit
  rationale: עֵת bezeichnet eine Zeit beziehungsweise einen bestimmten Zeitpunkt. „Eine Zeit“ erhält den wiederkehrenden, poetischen Satzbau des Abschnitts und klingt im modernen Deutschen natürlich.
- source_word: לָלֶדֶת
  choice: zum Gebären
  rationale: Der Qal-Infinitiv von ילד bezeichnet hier zunächst das Gebären. Die Gegenüberstellung mit dem Sterben lässt zugleich an den Beginn eines Lebens denken; diese mögliche Sinnrichtung wird in der Fußnote bewahrt.
- source_word: לָמוּת
  choice: zum Sterben
  rationale: מות bedeutet eindeutig „sterben“ und bildet den Gegenpol zum Gebären beziehungsweise Geborenwerden.
- source_word: לָטַעַת
  choice: zum Pflanzen
  rationale: נטע bedeutet im Qal „pflanzen“. Das konkrete landwirtschaftliche Bild bleibt erhalten.
- source_word: לַעֲקוֹר
  choice: auszureißen
  rationale: עקר bezeichnet das Herausreißen, besonders mitsamt der Wurzel. „Ausreißen“ ist im Zusammenhang mit Gepflanztem natürliches modernes Deutsch; „entwurzeln“ wäre ebenfalls möglich, klingt hier aber abstrakter.
- source_word: נָטוּעַ
  choice: Gepflanztes
  rationale: Das passive Partizip bezeichnet das, was gepflanzt worden ist. Die substantivierte Form „Gepflanztes“ ist knapp und bildet die hebräische Form ohne ergänztes Bezugswort ab.
theological_decisions: []
translation_notes:
  register: Poetisch-knapper, würdevoller Satzbau mit der wiederholten Wendung „eine Zeit“. Die Infinitivgruppen sind idiomatisch deutsch formuliert; das Semikolon bewahrt die Gliederung in zwei Gegensatzpaare.
