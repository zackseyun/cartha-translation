  - severity: low
    issue: „Gepflanztes auszureißen“ ist leicht elliptisch.
    rationale: „das Gepflanzte“ markiert die substantivierte partizipiale Objektfunktion klarer und bleibt dem Hebräischen eng verbunden.
  revised_text: Eine Zeit zum Gebären und eine Zeit zum Sterben; eine Zeit zum Pflanzen und eine Zeit, das Gepflanzte auszureißen.
