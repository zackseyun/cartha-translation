  source_fidelity: 'Die Wiedergabe „zum Gebären“ entspricht dem Qal-Infinitiv לָלֶדֶת (aktiv: gebären) genauer als „geboren werden“. Die übrigen Verben und die Gegenüberstellungen werden zutreffend wiedergegeben. נָטוּעַ bezeichnet das Gepflanzte bzw. das, was gepflanzt ist.'
  naturalness: Der poetisch wiederholte Satzbau ist gelungen. „eine Zeit, das Gepflanzte auszureißen“ ist im modernen Deutschen etwas flüssiger und zugleich präziser als die substantivlose Form „Gepflanztes auszureißen“.
  terminology: „Gebären“, „Sterben“, „Pflanzen“ und „ausreißen“ sind angemessene, verständliche Begriffe. Die Fußnote bietet jedoch mit „geboren zu werden“ eine Alternative, die nicht die aktive Form des hebräischen Qal-Infinitivs abbildet.
