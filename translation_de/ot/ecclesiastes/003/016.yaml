source:
  edition: WLC
  text: וְ/ע֥וֹד רָאִ֖יתִי תַּ֣חַת הַ/שָּׁ֑מֶשׁ מְק֤וֹם הַ/מִּשְׁפָּט֙ שָׁ֣מָּ/ה הָ/רֶ֔שַׁע וּ/מְק֥וֹם הַ/צֶּ֖דֶק שָׁ֥מָּ/ה הָ/רָֽשַׁע׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/016.yaml
  text: And I also saw under the sun that in the place of justice[a], there was wickedness, and in the place of righteousness, there was wickedness.
translation:
  language: de
  text: 'Und weiter sah ich unter der Sonne: Am Ort des Rechts, da war Unrecht, und am Ort der Gerechtigkeit[a], da war Unrecht.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „am Ort des Rechts“. Das Hebräische gebraucht hier צֶדֶק, ein anderes, wenn auch bedeutungsnahes Wort als zuvor מִשְׁפָּט.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְע֥וֹד
  choice: Und weiter
  rationale: Kennzeichnet eine zusätzliche Beobachtung in Kohelets Gedankengang, ohne notwendig eine Wiederholung anzudeuten.
- source_word: רָאִ֖יתִי
  choice: sah ich
  rationale: Bewahrt den unmittelbaren, erfahrungsbezogenen Ton des hebräischen Verbs.
- source_word: תַּ֣חַת הַשָּׁ֑מֶשׁ
  choice: unter der Sonne
  rationale: Entspricht der charakteristischen und im Deutschen geläufigen Wendung des Buches für den irdischen Lebensbereich.
- source_word: מְק֤וֹם הַמִּשְׁפָּט֙
  choice: am Ort des Rechts
  rationale: מִשְׁפָּט bezeichnet hier den Bereich, in dem Recht gesprochen und verwirklicht werden sollte. „Ort des Rechts“ bewahrt sowohl den institutionellen als auch den moralischen Sinn.
- source_word: שָׁ֣מָּה
  choice: herrschte
  rationale: Das örtliche „dort“ wird im Deutschen zusammen mit dem folgenden Substantiv idiomatisch wiedergegeben; „herrschte“ bringt den erschütternden Zustand an eben diesem Ort natürlich zum Ausdruck.
- source_word: הָרֶ֔שַׁע / הָרָֽשַׁע
  choice: das Unrecht
  rationale: Im gerichtlichen Zusammenhang bezeichnet רֶשַׁע schuldhaftes, böses Unrecht. Die zweimalige identische Wiedergabe erhält die Parallelstruktur; trotz der abweichenden Punktierung der zweiten Form legt der Parallelismus denselben abstrakten Sinn nahe.
- source_word: וּמְק֥וֹם הַצֶּ֖דֶק
  choice: und am Ort der Gerechtigkeit
  rationale: „Gerechtigkeit“ bewahrt den Unterschied zwischen צֶדֶק und dem zuvor stehenden מִשְׁפָּט, ohne ihre Bedeutungsüberschneidung zu leugnen.
theological_decisions:
- issue: Wiedergabe von צֶדֶק im Verhältnis zu מִשְׁפָּט
  choice: Gerechtigkeit
  alternative: Recht
  rationale: Die beiden hebräischen Begriffe überschneiden sich, sind aber nicht identisch. „Gerechtigkeit“ erhält im Haupttext die lexikalische und rhetorische Variation; die Fußnote nennt „Recht“ als kontextuell mögliche Wiedergabe.
- issue: Deutung der zweiten Form הָרָשַׁע
  choice: das Unrecht (abstrakt)
  alternative: der Frevler / der Schuldige (personal)
  rationale: Die masoretische Punktierung lässt formal an eine personale Deutung denken, doch der enge Parallelismus mit הָרֶשַׁע in der ersten Satzhälfte stützt stark den abstrakten Sinn. Eine personale Deutung würde die ausgewogene Wiederholung abschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Parallelstruktur und die zweimalige Nennung von „das Unrecht“ bleiben erhalten. „Herrschte“ ist eine natürliche deutsche Prädikation, während der Ortsbezug durch „am Ort“ ausdrücklich gewahrt wird.
