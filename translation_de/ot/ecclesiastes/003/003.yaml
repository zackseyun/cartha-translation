  text: Eine Zeit[a] zum Töten und eine Zeit zum Heilen; eine Zeit zum Einreißen[b] und eine Zeit zum Bauen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „eine Gelegenheit“; entsprechend bei jedem Vorkommen von „eine Zeit“ in diesem Vers.'
