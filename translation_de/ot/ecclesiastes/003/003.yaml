lexical_decisions:
- source_word: עֵת
  choice: eine Zeit
  rationale: עֵת bezeichnet eine Zeit, einen Zeitpunkt oder eine passende beziehungsweise festgesetzte Gelegenheit. „Eine Zeit“ wahrt den wiederkehrenden Rhythmus des Gedichts und ist im Deutschen zugleich natürlich und bewusst offen.
- source_word: לַהֲרוֹג
  choice: zum Töten
  rationale: Das Verb הרג bedeutet allgemein „töten“. Die direkte Wiedergabe erhält die Härte des hebräischen Ausdrucks, ohne einen besonderen rechtlichen oder kriegerischen Zusammenhang hinzuzufügen.
- source_word: לִרְפּוֹא
  choice: zum Heilen
  rationale: רפא bedeutet gewöhnlich „heilen“. Der Ausdruck bildet den klaren wiederherstellenden Gegenpol zum Töten und ist weiter gefasst als „kurieren“.
- source_word: לִפְרֹוץ
  choice: zum Einreißen
  rationale: פרץ kann unter anderem „durchbrechen“, „eine Bresche schlagen“ oder „einreißen“ bedeuten. Im Gegensatz zum anschließenden Bauen bezeichnet es hier am wahrscheinlichsten das Einreißen eines Bauwerks oder einer baulichen Struktur.
- source_word: לִבְנוֹת
  choice: zum Bauen
  rationale: בנה bedeutet schlicht „bauen“. „Zum Bauen“ ist eine genaue und natürliche Wiedergabe und bildet einen knappen Gegensatz zu „zum Einreißen“.
theological_decisions:
- issue: Ob „zum Töten“ wegen seiner moralischen Härte abgeschwächt werden sollte
  choice: Die direkte Formulierung „zum Töten“ bleibt erhalten.
  alternative: „zum Erschlagen“ oder „zum Töten im rechtmäßigen Sinn“
  rationale: Der Vers nennt gegensätzliche Vorgänge innerhalb der poetischen Aufzählung von Zeiten. Er erklärt nicht ausdrücklich jede genannte Handlung für moralisch gut. Eine Abschwächung oder einschränkende Deutung würde die Spannung des hebräischen Textes vorschnell auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrtem poetischem Parallelismus. Die viermalige Wendung „eine Zeit zum …“ gibt die regelmäßige hebräische Struktur wieder; die knappen Infinitivgruppen vermeiden unnötige Auslegung.
