base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/001.yaml
  text: For everything there is a season[a], and a time for every matter under the heavens.
translation:
  language: de
  text: Für alles gibt es eine Zeit und eine Zeit für jede Angelegenheit[a] unter dem Himmel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Tätigkeit“, „Vorhaben“ oder „Zweck“.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַכֹּל
  choice: für alles
  rationale: Die Verbindung aus ל und כֹּל bezeichnet den umfassenden Geltungsbereich. „Für alles“ ist im modernen Deutschen natürlich und bewahrt den umfassenden Sinn.
- source_word: זְמָן
  choice: eine bestimmte Zeit
  rationale: זְמָן bezeichnet einen festgelegten oder passenden Zeitpunkt beziehungsweise Zeitraum. „Bestimmte Zeit“ gibt diese Nuance wieder und unterscheidet den Ausdruck vom folgenden עֵת.
- source_word: וְעֵת
  choice: und … eine Zeit
  rationale: עֵת ist das gewöhnliche Wort für „Zeit“ oder „Zeitpunkt“. Die Übersetzung wahrt den Parallelismus mit זְמָן, ohne beide Begriffe völlig gleichzusetzen.
- source_word: לְכָל חֵפֶץ
  choice: für jedes Vorhaben[a]
  rationale: חֵפֶץ kann hier ein Vorhaben, eine Angelegenheit, Tätigkeit oder Absicht bezeichnen. „Vorhaben“ passt zum anschließenden Katalog menschlichen Tuns, ohne zwingend einen göttlich gesetzten Zweck zu behaupten; die Fußnote hält die Bedeutungsbreite offen.
- source_word: תַּחַת הַשָּׁמָיִם
  choice: unter dem Himmel
  rationale: Die Wendung bezeichnet den irdischen Lebensbereich. Der im Hebräischen formal plurale Ausdruck הַשָּׁמַיִם wird im idiomatischen Standarddeutsch in dieser festen Wendung natürlich mit „dem Himmel“ wiedergegeben.
theological_decisions:
- issue: Ob חֵפֶץ so wiederzugeben ist, dass für jedes Ereignis ausdrücklich ein vorgegebener Zweck behauptet wird
  choice: Vorhaben
  alternative: Zweck
  rationale: „Zweck“ würde die Aussage stärker teleologisch festlegen, als das mehrdeutige חֵפֶץ verlangt. „Vorhaben“ bewahrt den Bezug auf menschliche Angelegenheiten und Tätigkeiten sowie die theologische Spannung des weiteren Zusammenhangs.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Der annähernde Parallelismus der beiden Halbverse bleibt erhalten; „bestimmte Zeit“ und „Zeit“ bilden die nahe, aber nicht vollständige Entsprechung von זְמָן und עֵת ab.
