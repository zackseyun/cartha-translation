  text: I have seen the task that God has given to the sons of man to be occupied with[a].
translation:
  language: de
  text: Ich habe die Aufgabe gesehen, die Gott den Menschen gegeben hat, damit sie sich mit ihr beschäftigen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit sie sich damit abmühen“ oder „daran leiden“. Die hebräische Wendung ist schwierig und kann sowohl die Beschäftigung mit der Aufgabe als auch ihre belastende Wirkung hervorheben.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: רָאִיתִי
  choice: Ich habe ... gesehen
  rationale: Das Qal-Perfekt der 1. Person Singular bezeichnet eine reflektierte Beobachtung; das deutsche Perfekt klingt natürlich und lässt ihre fortdauernde Bedeutung erkennen.
- source_word: הָעִנְיָן
  choice: die Aufgabe
  rationale: עִנְיָן bezeichnet im Predigerbuch häufig eine Angelegenheit oder Beschäftigung, die dem Menschen auferlegt beziehungsweise zugewiesen ist. „Aufgabe“ ist knapp, verständlich und bewahrt diesen Gedanken.
- source_word: אֲשֶׁר נָתַן אֱלֹהִים
  choice: die Gott ... gegeben hat
  rationale: Die Formulierung gibt den Relativsatz eng und in natürlichem Deutsch wieder; אֱלֹהִים bezeichnet hier Gott.
- source_word: לִבְנֵי הָאָדָם
  choice: den Menschenkindern
  rationale: „Menschenkinder“ bewahrt das hebräische Bild „Söhne des Menschen“ und bezeichnet zugleich idiomatisch die Menschen insgesamt.
- source_word: לַעֲנוֹת בּוֹ
  choice: damit sie sich damit beschäftigen
  rationale: Die schwierige Verbindung von ענה mit ב kann hier das Beschäftigtsein mit der Aufgabe ausdrücken. Die Hauptfassung bleibt zurückhaltend; die möglicherweise belastende Bedeutung wird in der Fußnote offengehalten.
theological_decisions:
- issue: Wiedergabe von לִבְנֵי הָאָדָם
  choice: den Menschenkindern
  alternative: den Söhnen des Menschen; den Menschen
  rationale: Die gewählte Form wahrt das konkrete hebräische Abstammungsbild, ist im Deutschen aber als umfassende Bezeichnung der Menschheit verständlich, ohne den Ausdruck auf männliche Personen zu beschränken.
- issue: Bedeutung von לַעֲנוֹת בּוֹ
  choice: damit sie sich damit beschäftigen
  alternative: damit sie sich damit abmühen; damit sie dadurch bedrückt werden
  rationale: Die hebräische Wendung lässt offen, ob vor allem die Beschäftigung oder deren mühevolle beziehungsweise bedrückende Wirkung gemeint ist. Die Hauptfassung entscheidet sich für die weniger zugespitzte Lesart und nennt die stärkeren Möglichkeiten in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Menschenkinder“ erhält die Bildhaftigkeit des Hebräischen, während „sich damit beschäftigen“ die lexikalische Mehrdeutigkeit nicht unnötig zuspitzt.
