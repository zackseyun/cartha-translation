lexical_decisions:
- source_word: עֵת
  choice: eine Zeit
  rationale: עֵת bezeichnet eine Zeit oder einen bestimmten Zeitpunkt beziehungsweise Anlass. „Eine Zeit“ gibt die wiederkehrende hebräische Formulierung direkt, natürlich und rhythmisch wieder.
- source_word: לִבְכּוֹת
  choice: zum Weinen
  rationale: Der Infinitiv von בכה bedeutet „weinen“. Die substantivierte Infinitivfügung mit „zum“ ist im Deutschen idiomatisch und wahrt die poetische Parallelstruktur.
- source_word: לִשְׂחוֹק
  choice: zum Lachen
  rationale: שׂחק bedeutet hier am unmittelbarsten „lachen“ und bildet den klaren Gegensatz zum Weinen.
- source_word: סְפוֹד
  choice: zum Klagen
  rationale: ספד bezeichnet das Klagen beziehungsweise Trauern, häufig im Zusammenhang mit einem Todesfall. „Klagen“ bewahrt den aktiven verbalen Sinn und lässt den möglichen formellen Trauerkontext offen.
- source_word: רְקוֹד
  choice: zum Tanzen
  rationale: רקד bedeutet „tanzen“. Die Wiedergabe erhält den Gegensatz zum Klagen und die parallele Satzform.
