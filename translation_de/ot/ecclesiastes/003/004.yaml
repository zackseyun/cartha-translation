  text: A time to weep[a], and a time to laugh; a time to mourn[b], and a time to dance.
translation:
  language: de
  text: Eine Zeit zum Weinen[a] und eine Zeit zum Lachen, eine Zeit zum Trauern[b] und eine Zeit zum Tanzen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder durchgehend in diesem Vers: „eine Gelegenheit“.'
