  text: יָדַ֗עְתִּי כִּ֠י כָּל אֲשֶׁ֨ר יַעֲשֶׂ֤ה הָ/אֱלֹהִים֙ ה֚וּא יִהְיֶ֣ה לְ/עוֹלָ֔ם עָלָי/ו֙ אֵ֣ין לְ/הוֹסִ֔יף וּ/מִמֶּ֖/נּוּ אֵ֣ין לִ/גְרֹ֑עַ וְ/הָ/אֱלֹהִ֣ים עָשָׂ֔ה שֶׁ/יִּֽרְא֖וּ מִ/לְּ/פָנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/014.yaml
  text: I know that whatever God does will endure forever; there is nothing to add to it[a], and there is nothing to take from it. God has done it so that they may fear before him.
translation:
  language: de
  text: 'Ich weiß: Alles, was Gott tut, bleibt für immer. Daran kann man nichts hinzufügen und nichts wegnehmen. Gott hat es getan, damit die Menschen sich vor ihm fürchten.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit die Menschen Ehrfurcht vor ihm haben.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַעְתִּי
  choice: Ich weiß
  rationale: Das Qal-Perfekt bezeichnet hier eine gewonnene, weiterhin bestehende Erkenntnis; das deutsche Präsens gibt diesen Zustand natürlich wieder.
- source_word: כָּל אֲשֶׁר יַעֲשֶׂה הָאֱלֹהִים
  choice: Alles, was Gott tut
  rationale: כָּל mit אֲשֶׁר hat umfassenden Sinn. Die Formulierung ist präzise und idiomatisch.
- source_word: הוּא יִהְיֶה לְעוֹלָם
  choice: bleibt für immer
  rationale: Die Wendung besagt, dass Gottes Tun dauerhaft Bestand hat; „bleibt“ vermittelt dies in natürlichem Deutsch, ohne über den Ausgangstext hinauszugehen.
- source_word: עָלָיו אֵין לְהוֹסִיף
  choice: Man kann nichts hinzufügen
  rationale: Die unpersönliche Formulierung gibt die Aussage über die Unmöglichkeit einer Ergänzung klar wieder.
- source_word: וּמִמֶּנּוּ אֵין לִגְרֹעַ
  choice: und nichts davon wegnehmen
  rationale: גרע bedeutet vermindern oder wegnehmen. „davon wegnehmen“ bewahrt den Bezug auf Gottes Tun und bildet eine natürliche Parallele zum vorherigen Satzglied.
- source_word: וְהָאֱלֹהִים עָשָׂה
  choice: Gott hat es so getan
  rationale: Das Perfekt stellt Gottes Handeln als vollzogen dar; „so“ nimmt die zuvor beschriebene bleibende und unabänderliche Beschaffenheit seines Tuns auf.
- source_word: שֶׁיִּרְאוּ מִלְּפָנָיו
  choice: damit die Menschen sich vor ihm fürchten
  rationale: ירא trägt gegenüber Gott sowohl Furcht als auch ehrfürchtige Scheu in sich. „sich vor ihm fürchten“ erhält den lexikalischen Kern und die theologische Spannung. Das nicht ausdrücklich genannte Subjekt wird im Deutschen allgemein mit „die Menschen“ wiedergegeben.
theological_decisions:
- issue: Bedeutung der Furcht vor Gott
  choice: sich vor ihm fürchten
  alternative: Ehrfurcht vor ihm haben
  rationale: Die Hauptfassung bewahrt den Grundsinn von ירא und mildert die Spannung des Textes nicht vorschnell ab. Die mögliche Nuance ehrfürchtiger Scheu wird in der Fußnote genannt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Kurze Hauptsätze folgen der klaren Gedankenführung des Hebräischen; „die Menschen“ verdeutlicht das im Verb enthaltene unbestimmte Subjekt.
