translation:
  language: de
  text: 'Ich sagte in meinem Herzen über die Menschen[a]: Gott prüft sie, um sie erkennen zu lassen[b], dass sie selbst Tiere sind.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Söhne des Menschen“; der hebräische Ausdruck bezeichnet Menschen allgemein.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „und zu sehen“. Möglich ist auch: „und damit sie sehen“ oder „und zu sehen, dass sie selbst Tiere sind“.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָמַרְתִּי אֲנִי בְּלִבִּי
  choice: Ich sagte in meinem Herzen
  rationale: Die Formulierung bewahrt das hebräische Bild der inneren Selbstrede und ist im Deutschen verständlich und würdevoll.
- source_word: עַל דִּבְרַת
  choice: über
  rationale: Die seltene Wendung bezeichnet hier den Gegenstand der Überlegung; „über“ gibt dies knapp und natürlich wieder.
- source_word: בְּנֵי הָאָדָם
  choice: die Menschenkinder
  rationale: „Menschenkinder“ bewahrt die konkrete, repräsentative Form des Hebräischen, ohne sie auf Männer zu beschränken.
- source_word: לְבָרָם
  choice: Gott prüft sie
  rationale: Die Form wird als Infinitiv von ברר im Sinn von prüfen, erproben oder läutern verstanden. „prüft“ ist klar und hält den möglichen Erprobungscharakter fest.
- source_word: וְלִרְאוֹת
  choice: um sie erkennen zu lassen
  rationale: Die Wiedergabe versteht die Wendung im Zusammenhang als Ziel beziehungsweise Folge des göttlichen Prüfens. Da der hebräische Wortlaut wörtlich „und zu sehen“ lautet und syntaktisch mehrdeutig bleibt, wird dies in einer Fußnote ausgewiesen.
- source_word: שֶׁהֵם בְּהֵמָה הֵמָּה לָהֶם
  choice: dass sie selbst Tiere sind
  rationale: Die direkte Nominalaussage wird nicht zu einem bloßen Vergleich („wie Tiere“) abgeschwächt. „selbst“ gibt die emphatische Wiederholung des Pronomens wieder; „Tiere“ vermittelt den kollektiven Gebrauch des Singulars בְּהֵמָה in natürlichem Deutsch.
theological_decisions:
- issue: Anthropologische Aussage über Menschen und Tiere
  choice: dass sie selbst Tiere sind
  alternative: dass sie wie Tiere sind
  rationale: Im Hebräischen steht kein Vergleichspartikel. Im Zusammenhang betont die direkte Aussage die gemeinsame Sterblichkeit und Geschöpflichkeit, ohne alle anderweitigen Unterschiede zwischen Mensch und Tier aufzuheben.
- issue: Referenz und Geschlecht von בְּנֵי הָאָדָם
  choice: die Menschenkinder
  alternative: die Menschen
  rationale: Die hebräische maskuline Form hat repräsentative Bedeutung. „Menschenkinder“ hält die Bildgestalt fest und bezeichnet Menschen allgemein.
- issue: Subjekt und Funktion von וְלִרְאוֹת
  choice: um sie erkennen zu lassen
  alternative: und zu sehen
  rationale: Die Hauptfassung verbindet die Erkenntnis der Menschen als Ziel mit Gottes Prüfen, löst die echte syntaktische Mehrdeutigkeit aber nicht stillschweigend auf; die wörtlichere Möglichkeit steht in der Fußnote.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdig-reflektierendem Ton. Die Satzstruktur bleibt nahe am knappen hebräischen Gedankengang; echte syntaktische Mehrdeutigkeit wird durch eine Fußnote offengehalten.
