  text: הַ/כֹּ֥ל הוֹלֵ֖ךְ אֶל מָק֣וֹם אֶחָ֑ד הַ/כֹּל֙ הָיָ֣ה מִן הֶֽ/עָפָ֔ר וְ/הַ/כֹּ֖ל שָׁ֥ב אֶל הֶ/עָפָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/020.yaml
  text: All go to one place[a]. All came from the dust[b], and all return to the dust.
translation:
  language: de
  text: Alle gehen an einen Ort.[a] Alle stammen aus dem Staub,[b] und alle kehren zum Staub zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „an einen Ort“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Alles war aus dem Staub.“ Der „Staub“ erinnert an die Sterblichkeit des Menschen und an 1. Mose 3,19.'
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: הַכֹּל
  choice: alle
  rationale: Das dreimal wiederholte הַכֹּל bezieht sich im unmittelbaren Zusammenhang umfassend auf Menschen und Tiere. „Alle“ bewahrt diesen belebten Bezug und die eindringliche Wiederholung.
- source_word: הוֹלֵךְ
  choice: gehen
  rationale: Das Partizip bezeichnet hier eine allgemein geltende Wirklichkeit. Das deutsche Präsens passt zum spruchhaften Ton.
- source_word: מָקוֹם אֶחָד
  choice: ein und denselben Ort
  rationale: Wörtlich steht „einen Ort“. Da alle zu dem einen gemeinsamen Ort gehen, gibt „ein und denselben Ort“ den Sinn im Deutschen natürlich wieder, ohne den Ort näher zu bestimmen.
- source_word: הָיָה מִן הֶעָפָר
  choice: stammen aus dem Staub
  rationale: Das hebräische „war aus dem Staub“ bezeichnet die Herkunft. „Stammen aus“ drückt diese Herkunft im Deutschen idiomatisch aus und erhält die Gegenüberstellung von Ursprung und Rückkehr.
- source_word: עָפָר
  choice: Staub
  rationale: „Staub“ ist die sachlich und traditionsgeschichtlich passende Wiedergabe und lässt den Anklang an Genesis 3,19 erkennen.
- source_word: שָׁב אֶל הֶעָפָר
  choice: kehren zum Staub zurück
  rationale: Diese Wiedergabe erfasst die Umkehr zum Ausgangspunkt und bildet mit „stammen aus dem Staub“ einen klaren Parallelismus.
theological_decisions:
- issue: Bezugsbereich von „alle“
  choice: Der Vers beschreibt das gemeinsame Todesgeschick von Menschen und Tieren.
  alternative: Der Vers beziehe sich ausschließlich auf Menschen oder bestreite jede Unterscheidung nach dem Tod.
  rationale: Prediger 3,18–21 stellt Menschen und Tiere nebeneinander und betont ihre gemeinsame Sterblichkeit. Die Übersetzung hält diese Aussage fest, ohne daraus eine weitergehende Lehre über das Leben nach dem Tod abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreifache Wiederholung von „alle“ und der Herkunft-Rückkehr-Parallelismus wurden bewahrt; unnötige dogmatische Präzisierungen wurden vermieden.
