translation:
  language: de
  text: Eine Zeit zum Suchen[a] und eine Zeit zum Verlieren; eine Zeit zum Aufbewahren[b] und eine Zeit zum Wegwerfen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Zeit, nach etwas zu suchen, und eine Zeit, etwas als verloren aufzugeben“.'
