  - marker: b
    text: 'Oder: „eine Zeit zum Bewahren und eine Zeit zum Fortwerfen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵת
  choice: eine Zeit
  rationale: עֵת bezeichnet eine Zeit oder einen bestimmten Zeitpunkt. „Eine Zeit“ erhält den wiederholten poetischen Rhythmus und ist im Deutschen unmittelbar verständlich.
- source_word: לְבַקֵּשׁ
  choice: zum Suchen
  rationale: Das Piel von בקשׁ bedeutet „suchen“ oder „nach etwas suchen“. Die knappe Form passt zur parallelen Struktur des Verses.
- source_word: לְאַבֵּד
  choice: zum Verlieren
  rationale: Das Piel von אבד kann „verlieren“, „zugrunde gehen lassen“ oder „vernichten“ bedeuten. In der Gegenüberstellung mit „suchen“ liegt „verlieren“ nahe, ohne die Art der Verursachung näher festzulegen.
- source_word: לִשְׁמוֹר
  choice: zum Aufbewahren
  rationale: שׁמר kann „bewahren“, „hüten“ oder „behalten“ bedeuten. Im Gegensatz zu „wegwerfen“ bezeichnet „aufbewahren“ natürlich und konkret das Behalten von Dingen.
- source_word: לְהַשְׁלִיךְ
  choice: zum Wegwerfen
  rationale: Das Hifil von שלך bedeutet „werfen“ oder „fortwerfen“. „Wegwerfen“ gibt den praktischen Gegensatz zu „aufbewahren“ in modernem Deutsch klar wieder.
theological_decisions: []
