source:
  edition: WLC
  text: וְ/רָאִ֗יתִי כִּ֣י אֵ֥ין טוֹב֙ מֵ/אֲשֶׁ֨ר יִשְׂמַ֤ח הָ/אָדָם֙ בְּֽ/מַעֲשָׂ֔י/ו כִּי ה֖וּא חֶלְק֑/וֹ כִּ֣י מִ֤י יְבִיאֶ֨/נּוּ֙ לִ/רְא֔וֹת בְּ/מֶ֖ה שֶׁ/יִּהְיֶ֥ה אַחֲרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/022.yaml
  text: So I saw that there is nothing better than that a man should rejoice in his works[a], for that is his portion. For who can bring him to see what will be after him?
translation:
  language: de
  text: So sah ich, dass es nichts Besseres gibt, als dass der Mensch sich an seinem Tun freut; denn das ist sein Anteil. Denn wer kann ihn dazu bringen, zu sehen, was nach ihm sein wird?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „was geschehen wird, wenn er nicht mehr da ist“.'
    reason: Die Wendung „nach ihm“ kann sich auf das beziehen, was nach dem Tod beziehungsweise Weggang eines Menschen geschieht; der hebräische Ausdruck bleibt jedoch knapper und weiter.
lexical_decisions:
- source_word: וְרָאִיתִי
  choice: So erkannte ich
  rationale: Das Qal-Perfekt von ראה bezeichnet hier eine aus dem Vorangehenden gezogene Beobachtung oder Einsicht. „So erkannte ich“ gibt diesen folgernden Sinn im Deutschen natürlich wieder.
- source_word: אֵין טוֹב מֵאֲשֶׁר
  choice: dass es nichts Besseres gibt, als dass
  rationale: Die Wendung drückt eine vergleichende Wertung aus, nicht die Behauptung, es gebe überhaupt nichts anderes Gutes.
- source_word: הָאָדָם
  choice: der Mensch
  rationale: אָדָם steht im generischen Singular. „Der Mensch“ bewahrt sowohl die Einzahl als auch den allgemeinen Bezug und ist die natürliche deutsche Entsprechung.
- source_word: יִשְׂמַח בְּמַעֲשָׂיו
  choice: sich an seinem Tun freut
  rationale: שׂמח bezeichnet Freude, מַעֲשֶׂה das Tun, Werk oder Tätigsein. „Sein Tun“ ist weit genug, um Arbeit, Handlungen und Unternehmungen einzuschließen.
- source_word: חֶלְקוֹ
  choice: sein Anteil
  rationale: חֵלֶק bezeichnet im Predigerbuch den einem Menschen zukommenden oder zugeteilten Anteil am Leben.
- source_word: מִי יְבִיאֶנּוּ לִרְאוֹת
  choice: wer kann ihn dazu bringen, zu sehen
  rationale: Die Wiedergabe hält an der Kausativform von בוא und am Bild des Sehens fest. „Kann“ verdeutlicht die in der rhetorischen Frage vorausgesetzte menschliche Unfähigkeit, ohne den Satz als ausdrückliche Lehrbehauptung umzuformen.
- source_word: בְּמֶה שֶׁיִּהְיֶה אַחֲרָיו
  choice: was nach ihm sein wird
  rationale: Die bewusst offene Formulierung lässt unentschieden, ob es allgemein um spätere Ereignisse oder ausdrücklich um die Zeit nach dem Tod des Menschen geht.
theological_decisions:
- issue: Generischer Singular אָדָם
  choice: der Mensch
  alternative: ein Mann
  rationale: Der Vers spricht repräsentativ vom Menschen allgemein. Das deutsche „der Mensch“ bildet den generischen Singular genau und idiomatisch ab, ohne den Geltungsbereich unnötig auf Männer einzugrenzen.
- issue: Bedeutung von אַחֲרָיו
  choice: was nach ihm sein wird
  alternative: was geschehen wird, wenn er nicht mehr da ist
  rationale: Der Haupttext bewahrt die knappe zeitliche und personale Mehrdeutigkeit des Hebräischen. Die ausdrücklich posthume Deutung wird als mögliche Lesart in der Fußnote genannt, nicht in den Text hineingeschrieben.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit ruhigem, würdigem Ton. Der wiederholte Anschluss mit „denn“ bewahrt die argumentative Struktur des hebräischen Verses; zentrale Leitwörter wie „Tun“ und „Anteil“ bleiben knapp und konkret.
