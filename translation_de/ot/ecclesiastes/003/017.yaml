base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/017.yaml
  text: I said in my heart[a], “God will judge the righteous and the wicked[b], for there is a time for every matter and for every deed there.”
translation:
  language: de
  text: 'Ich sagte in meinem Herzen: „Gott wird den Gerechten und den Frevler richten; denn für jede Angelegenheit[b] und für jede Tat gibt es dort[a] eine Zeit.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier „dort“. Gemeint sein kann der Ort oder der Anlass von Gottes Gericht; der genaue Bezug bleibt im Hebräischen offen.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „für jedes Vorhaben“ beziehungsweise „für jede Sache“. Das hebräische Wort kann Angelegenheit, Zweck, Vorhaben oder Verlangen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתִּי אֲנִי בְּלִבִּי
  choice: Ich sagte in meinem Herzen
  rationale: Die hebräische Wendung bezeichnet inneres Nachdenken. Die bildhafte Rede vom Herzen bleibt erhalten und ist in gehobenem, aber verständlichem Deutsch nachvollziehbar.
- source_word: הַצַּדִּיק וְאֶת הָרָשָׁע
  choice: den Gerechten und den Frevler
  rationale: Die substantivierten Adjektive bezeichnen die beiden einander gegenübergestellten moralischen Kategorien. „Frevler“ gibt רָשָׁע ethisch wieder, ohne es auf eine bereits festgestellte rechtliche Schuld zu verengen.
- source_word: יִשְׁפֹּט הָאֱלֹהִים
  choice: Gott wird … richten
  rationale: Das Imperfekt bezeichnet hier im Zusammenhang die erwartete künftige Rechtsprechung Gottes. „Richten“ bewahrt sowohl den gerichtlichen Sinn als auch den biblischen Sprachton.
- source_word: עֵת לְכָל חֵפֶץ
  choice: für jedes Anliegen … eine Zeit
  rationale: עֵת greift das Leitwort „Zeit“ aus dem Kapitel auf. חֵפֶץ kann Anliegen, Vorhaben, Zweck oder Sache bedeuten; „Anliegen“ wahrt diese Bedeutungsbreite, ohne eine rein subjektive Freude auszudrücken.
- source_word: וְעַל כָּל הַמַּעֲשֶׂה
  choice: und für jede Tat
  rationale: מַעֲשֶׂה bezeichnet Werk, Handlung oder Tat. Im Zusammenhang des göttlichen Gerichts bringt „Tat“ den moralisch beurteilbaren Charakter menschlichen Handelns klar zum Ausdruck.
- source_word: שָׁם
  choice: dort
  rationale: 'Das Ortsadverb wird ausdrücklich wiedergegeben. Seine genaue Beziehung bleibt offen: Es kann auf den Ort oder den Anlass des göttlichen Gerichts weisen.'
theological_decisions:
- issue: Bezug und Bedeutung des abschließenden שָׁם im Zusammenhang mit Gottes Gericht
  choice: Das Adverb wird im Haupttext als „dort“ beibehalten, ohne seinen Bezug näher festzulegen.
  alternative: Man kann שָׁם glättend auslassen, zeitlich als „dann“ verstehen oder ausdrücklich auf den Ort des Gerichts beziehen.
  rationale: Der masoretische Text enthält das Adverb, bestimmt seinen Bezug jedoch nicht eindeutig. Seine Beibehaltung wahrt die textliche und theologische Spannung, statt Ort oder Zeitpunkt des Gerichts interpretierend festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Herzmetapher und das Leitwort „Zeit“ bleiben erhalten; die schwierige Schlussangabe „dort“ wird nicht geglättet. Die Satzstruktur ist im Deutschen natürlich gehalten, ohne die Mehrdeutigkeit des hebräischen Schlusses aufzulösen.
