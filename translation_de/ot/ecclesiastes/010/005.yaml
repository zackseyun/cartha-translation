  text: 'There is an evil I have seen under the sun[a], like an error that goes out from before the ruler:'
translation:
  language: de
  text: 'Es gibt ein Übel, das ich unter der Sonne gesehen habe: Es ist wie ein Versehen[a], das vom Herrscher ausgeht:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wie ein Irrtum, der aus der Gegenwart des Herrschers hervorgeht«. Der hebräische Ausdruck kann sowohl ein wirklich unbeabsichtigtes Versehen bezeichnen als auch etwas, das lediglich wie ein Versehen behandelt oder dargestellt wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ
  choice: Es gibt
  rationale: Die Existenzpartikel führt eine beobachtete Erscheinung ein; »Es gibt« ist im modernen Deutsch natürlich und bewahrt diese präsentierende Funktion.
- source_word: רָעָה
  choice: ein Übel
  rationale: Das Substantiv bezeichnet hier etwas Schlimmes oder Beklagenswertes, ohne eindeutig zwischen moralischem Unrecht und Unheil zu entscheiden. »Übel« wahrt diese Bedeutungsbreite.
- source_word: רָאִיתִי
  choice: das ich … gesehen habe
  rationale: Das Perfekt beschreibt eine eigene, weiterhin bedeutsame Beobachtung des Predigers; das deutsche Perfekt gibt dies idiomatisch wieder.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: unter der Sonne
  rationale: Die feste Wendung des Buches bezeichnet den irdischen Lebensbereich und lässt sich im Deutschen zugleich wörtlich und verständlich wiedergeben.
- source_word: כִּשְׁגָגָה
  choice: wie ein Versehen
  rationale: Das Präfix כְּ kennzeichnet einen Vergleich. שְׁגָגָה kann einen Irrtum oder eine unbeabsichtigte Verfehlung bezeichnen; »Versehen« bewahrt sowohl den Vergleich als auch die Frage, ob tatsächlich Unabsichtlichkeit vorliegt.
- source_word: שֶׁיֹּצָא
  choice: das … ausgeht
  rationale: יצא bedeutet »hinausgehen, hervorgehen«. In Verbindung mit einer Entscheidung oder einem Fehler ist »ausgehen« im Deutschen natürlich und wahrt die Vorstellung des Ursprungs.
- source_word: מִלִּפְנֵי
  choice: vom … ausgeht
  rationale: Wörtlich steht »von vor/aus der Gegenwart von«. Die idiomatische Fassung mit »von … ausgehen« erhält den Machthaber als Ursprungsinstanz, ohne eine im Deutschen schwerfällige Hofsprache zu erzwingen.
- source_word: הַשַּׁלִּיט
  choice: der Machthaber
  rationale: Das Wort bezeichnet einen, der Herrschaft oder Autorität ausübt. »Machthaber« ist breit genug und passt zum politischen Kontext der folgenden Verse.
