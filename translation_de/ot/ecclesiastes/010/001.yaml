id: ECC.10.1
reference: Ecclesiastes 10:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: זְב֣וּבֵי מָ֔וֶת יַבְאִ֥ישׁ יַבִּ֖יעַ שֶׁ֣מֶן רוֹקֵ֑חַ יָקָ֛ר מֵ/חָכְמָ֥ה מִ/כָּב֖וֹד סִכְל֥וּת מְעָֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/001.yaml
  text: Dead flies make a perfumer’s oil stink and bubble up[b][a]; so a little folly outweighs wisdom and honor.
translation:
  language: de
  text: Tote Fliegen lassen das Öl eines Salbenmischers stinken und aufschäumen.[a] So wiegt ein wenig Torheit schwerer als Weisheit und Ehre.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »gären«, »Blasen werfen« oder allgemeiner: »verderben«. Das hebräische Verb bezeichnet ein Hervorquellen oder Ausströmen und lässt den genauen Vorgang offen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Ein wenig Torheit ist kostbarer als Weisheit und Ehre.« Das hebräische Wort kann sowohl Wert als auch Gewicht beziehungsweise Bedeutung ausdrücken; im Zusammenhang ist wohl die größere schädliche Wirkung gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְבוּבֵי מָוֶת
  choice: Tote Fliegen
  rationale: Die Genitivverbindung bedeutet wörtlich »Fliegen des Todes«. Im Bild des verdorbenen Salböls bezeichnet sie am natürlichsten tote Fliegen.
- source_word: יַבְאִישׁ
  choice: lassen … stinken
  rationale: Das Hifil von באש drückt aus, dass etwas einen üblen Geruch annimmt bzw. verursacht; die gewählte Formulierung bewahrt die anschauliche Kausativbedeutung.
- source_word: יַבִּיעַ
  choice: aufschäumen
  rationale: Das Verb kann ein Hervorquellen, Sprudeln oder Ausstoßen bezeichnen. »Aufschäumen« gibt die sichtbare Aktivität des verdorbenen Öls wieder, ohne sie auf einen exakt bestimmten chemischen Vorgang festzulegen.
- source_word: שֶׁמֶן רוֹקֵחַ
  choice: das Öl eines Salbenmischers
  rationale: Die Wendung bezeichnet Öl, das von einem kundigen Mischer wohlriechender Salben hergestellt wird. »Salbenmischer« erhält den handwerklichen Bezug und ist im Deutschen verständlich.
- source_word: יָקָר
  choice: wiegt schwerer
  rationale: יָקָר bedeutet gewöhnlich »kostbar, wertvoll«, kann hier im Vergleich aber das größere Gewicht bzw. die stärkere Wirkung bezeichnen. »Wiegt schwerer« bewahrt das zugespitzte Sprichwort und dessen negative Aussage über die unverhältnismäßige Wirkung geringer Torheit.
- source_word: מֵחָכְמָה מִכָּבוֹד
  choice: als Weisheit und Ehre
  rationale: Die beiden mit מן eingeleiteten Größen werden gemeinsam als Vergleichsmaßstab verstanden. In diesem menschlich-sozialen Zusammenhang trifft »Ehre« den Sinn von כָּבוֹד besser als »Herrlichkeit«.
- source_word: סִכְלוּת מְעָט
  choice: ein wenig Torheit
  rationale: 'Die knappe Wiedergabe von Substantiv und Mengenangabe erhält den paradoxen Nachdruck: Schon eine geringe Torheit kann unverhältnismäßig schwer ins Gewicht fallen.'
theological_decisions:
- issue: Vergleich zwischen Torheit, Weisheit und Ehre
  choice: »wiegt … schwerer« als Aussage über die größere negative Wirkung der Torheit
  alternative: »ist kostbarer als« als formaler Wertvergleich
  rationale: Der unmittelbare Vergleich mit wenigen toten Fliegen, die wertvolles Öl verderben, legt eine schädliche, unverhältnismäßige Wirkung nahe. Da יָקָר jedoch normalerweise »kostbar« bedeutet, wird die formale Alternative in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, anschauliches Standarddeutsch mit sprichwörtlicher Kürze. »Salbenmischer« ist würdevoll und verständlich, ohne den altertümlichen Ausdruck »Apotheker« einzutragen. Die beiden Sätze werden mit »So« verbunden, um die Bildaussage und ihre Anwendung klar zu verknüpfen.
