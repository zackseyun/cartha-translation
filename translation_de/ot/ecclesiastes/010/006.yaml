base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/006.yaml
  text: Folly is set in many high places[a], and the rich sit in a low place.
translation:
  language: de
  text: Die Torheit wird in viele hohe Stellungen eingesetzt[a], und Reiche sitzen in der Niederung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »in vielen Höhen«; möglicherweise auch: »in großen Höhen«. Gemeint sind wahrscheinlich gehobene gesellschaftliche Stellungen oder Ämter.'
    reason: Die Fußnote bewahrt die räumliche Ausdrucksweise und weist die mögliche Lesart von רַבִּים als »groß« aus. Die gesellschaftliche Deutung wird als wahrscheinliche Metapher, nicht als zwingende Festlegung, gekennzeichnet.
lexical_decisions:
- source_word: נִתַּן
  choice: wird … gesetzt
  rationale: Das passive Nifal von נתן wird als Vorgang des Einsetzens oder Platzierens wiedergegeben, ohne den Handelnden zu benennen.
- source_word: הַסֶּכֶל
  choice: die Torheit
  rationale: Das Substantiv bezeichnet Torheit und nicht eindeutig einen einzelnen törichten Menschen; die abstrakte Wiedergabe wahrt diese Form und den thematischen Gegensatz zur Weisheit.
- source_word: בַּמְּרוֹמִים רַבִּים
  choice: auf viele hohe Posten
  rationale: Die räumliche Sprache der »Höhen« bezeichnet hier im Kontext gesellschaftlich oder amtlich gehobene Stellungen. »Hohe Posten« macht die Metapher im Deutschen verständlich und gibt רַבִּים mit »viele« wieder.
- source_word: וַעֲשִׁירִים
  choice: während Reiche
  rationale: Das substantivierte maskuline Pluraladjektiv wird geschlechtsübergreifend als Bezeichnung einer gesellschaftlichen Gruppe verstanden. »Während« bringt den deutlichen Gegensatz der beiden Satzhälften natürlich zum Ausdruck.
- source_word: בַּשֵּׁפֶל
  choice: unten
  rationale: Das Wort bezeichnet einen niedrigen Ort oder Rang. »Unten« bewahrt knapp den räumlichen Gegensatz zu den hohen Posten, ohne eine moralische Demut hineinzulesen.
- source_word: יֵשֵׁבוּ
  choice: sitzen
  rationale: Die Grundbedeutung »sitzen« erhält das anschauliche Bild und kann zugleich das Innehaben einer gesellschaftlichen Stellung ausdrücken.
