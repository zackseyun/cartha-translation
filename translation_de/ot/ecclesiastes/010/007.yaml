  text: רָאִ֥יתִי עֲבָדִ֖ים עַל סוּסִ֑ים וְ/שָׂרִ֛ים הֹלְכִ֥ים כַּ/עֲבָדִ֖ים עַל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/007.yaml
  text: I have seen servants on horses[c][b][a], and princes walking on the ground like servants.
translation:
  language: de
  text: Ich habe Sklaven[a] auf Pferden gesehen und Fürsten[b], die wie Sklaven zu Fuß gingen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Diener“. Das hebräische Wort עֲבָדִים kann sowohl Diener als auch Sklaven bezeichnen; hier unterstreicht „Sklaven“ die Umkehrung des gesellschaftlichen Ranges.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Vornehme“ beziehungsweise „Machthaber“. Das hebräische שָׂרִים bezeichnet Personen von hohem Rang oder mit Autorität.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „auf der Erde/dem Land“. Im Gegensatz zu denen auf den Pferden sind sie zu Fuß unterwegs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתִי
  choice: Ich habe … gesehen
  rationale: Das Qal-Perfekt in der 1. Person Singular berichtet eine persönliche Beobachtung. Das deutsche Perfekt gibt sie natürlich wieder, ohne ihren Bezug zur gegenwärtigen Betrachtung abzuschwächen.
- source_word: עֲבָדִים
  choice: Sklaven
  rationale: Der Kontext hebt eine scharfe Umkehrung des gesellschaftlichen Ranges hervor. „Sklaven“ bewahrt hier deutlicher als „Diener“ den niedrigen und abhängigen Status.
- source_word: עַל סוּסִים
  choice: auf Pferden
  rationale: Die knappe Wiedergabe entspricht dem Hebräischen und vermittelt im Kontext den erhöhten Status der Berittenen, ohne das Verb „reiten“ ausdrücklich hinzuzufügen.
- source_word: שָׂרִים
  choice: Fürsten
  rationale: Das Wort bezeichnet hochrangige Personen, Machthaber oder Vornehme. „Fürsten“ hält den Rangkontrast zu „Sklaven“ deutlich, ohne eine bestimmte Amtsfunktion festzulegen.
- source_word: הֹלְכִים
  choice: gingen
  rationale: Das Partizip beschreibt die beobachtete fortlaufende Bewegung. Im deutschen Relativsatz ist „gingen“ natürlich und bewahrt das konkrete Bild.
- source_word: כַּעֲבָדִים
  choice: wie Sklaven
  rationale: Das vergleichende Präfix bezeichnet eine Ähnlichkeit der Lage oder Erscheinung; die Fürsten werden nicht selbst als Sklaven identifiziert.
- source_word: עַל הָאָרֶץ
  choice: auf der Erde
  rationale: Die Formulierung bleibt nahe bei der konkreten hebräischen Wendung und bildet den Gegensatz zu „auf Pferden“. Gemeint ist, dass die Fürsten unberitten gehen.
