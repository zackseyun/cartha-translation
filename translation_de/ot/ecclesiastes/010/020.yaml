base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/020.yaml
  text: Even in your thoughts[a], do not curse a king, and in your bedroom do not curse a rich man, for a bird of the heavens may carry the sound[c][b], and a winged creature may report the matter.
translation:
  language: de
  text: Verfluche nicht einmal in deinen Gedanken[a] einen König, und verfluche in deinem Schlafzimmer[b] keinen Reichen; denn ein Vogel des Himmels[c] könnte den Laut weitertragen, und ein geflügeltes Wesen könnte die Sache weitersagen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in deinem Innersten“. Das hebräische Wort kann Wissen oder inneres Denken bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „in den Kammern deines Bettes“, also im privaten Bereich deines Schlafzimmers.'
    reason: cultural_note
  - marker: c
    text: 'Wörtlich: „ein Vogel des Himmels“. Das Bild entspricht dem Gedanken, dass selbst heimlich Gesagtes auf unerwartetem Weg bekannt werden kann.'
    reason: cultural_note
lexical_decisions:
- source_word: בְּמַדָּעֲךָ
  choice: in deinen Gedanken
  rationale: מַדָּע kann Wissen oder inneres Denken bezeichnen. Im Zusammenhang der Warnung ist der unausgesprochene Gedanke gemeint; „in deinen Gedanken“ gibt diesen privaten inneren Bereich natürlich wieder.
- source_word: מֶלֶךְ
  choice: einen König
  rationale: Das hebräische Substantiv steht ohne Artikel. Die unbestimmte Wiedergabe erhält den allgemeinen Charakter des Spruchs.
- source_word: תְּקַלֵּל
  choice: verfluche
  rationale: Das Piel von קלל kann „verfluchen“ oder „verächtlich behandeln“ bedeuten. „Verfluchen“ ist direkt und wahrt die parallelen Verbote.
- source_word: בְחַדְרֵי מִשְׁכָּבְךָ
  choice: in deinem Schlafzimmer
  rationale: Wörtlich bezeichnet die Wendung die Kammern des Bettes beziehungsweise Schlafplatzes. Gemeint ist der besonders private Raum; „Schlafzimmer“ ist dafür klares modernes Deutsch.
- source_word: עָשִׁיר
  choice: einen Reichen
  rationale: Das maskuline singularische Adjektiv wird substantivisch für einen wohlhabenden Mann gebraucht. „Einen Reichen“ bewahrt Form und Parallelismus.
- source_word: עוֹף הַשָּׁמַיִם
  choice: ein Vogel des Himmels
  rationale: Die Formulierung bildet das hebräische Bild eng ab und bleibt als biblisch geprägte deutsche Wendung verständlich.
- source_word: יוֹלִיךְ אֶת־הַקּוֹל
  choice: könnte den Laut weitertragen
  rationale: קוֹל heißt wörtlich „Laut“ oder „Stimme“. Die modale Wiedergabe mit „könnte“ bringt die warnende Möglichkeit des Spruchs zum Ausdruck, ohne das Bild in „Botschaft“ aufzulösen.
- source_word: בַעַל הַכְּנָפַיִם
  choice: ein Wesen mit Flügeln
  rationale: Wörtlich „Besitzer von Flügeln“; die gewählte Form gibt die idiomatische Bezeichnung eines geflügelten Wesens in natürlichem Deutsch wieder.
- source_word: יַגֵּיד דָּבָר
  choice: könnte die Sache verraten
  rationale: נגד bedeutet mitteilen oder berichten, und דָבָר bezeichnet hier die geäußerte Sache. „Verraten“ passt zur Warnung, dass selbst geheime Worte bekannt werden können.
