source:
  edition: WLC
  text: לֵ֤ב חָכָם֙ לִֽ/ימִינ֔/וֹ וְ/לֵ֥ב כְּסִ֖יל לִ/שְׂמֹאלֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/002.yaml
  text: A wise man's heart is at his right hand[a], but a fool's heart is at his left.
translation:
  language: de
  text: Das Herz eines Weisen ist zu seiner Rechten[a], das Herz eines Toren aber zu seiner Linken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „richtet sich nach rechts … nach links“. Das hebräische Bild von rechts und links bezeichnet wahrscheinlich eine gute beziehungsweise verfehlte Orientierung oder Urteilsfähigkeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב
  choice: Herz
  rationale: לֵב bezeichnet das innere Wesen einschließlich Denken, Urteilsvermögen und Gesinnung. „Herz“ bewahrt das hebräische Bild, ohne es auf den Verstand zu verengen.
- source_word: חָכָם
  choice: eines Weisen
  rationale: Das substantivisch gebrauchte Adjektiv steht im maskulinen Singular. Die Formulierung gibt dies knapp und idiomatisch wieder.
- source_word: לִימִינוֹ
  choice: zu seiner Rechten
  rationale: Die Wendung bewahrt die räumliche und symbolische Bildsprache der rechten Seite und lässt offen, ob eher Lage oder Ausrichtung gemeint ist.
- source_word: כְּסִיל
  choice: eines Toren
  rationale: „Tor“ ist eine etablierte, würdevolle Wiedergabe des moralisch-intellektuellen Begriffs כְּסִיל in der Weisheitsliteratur.
- source_word: לִשְׂמֹאלוֹ
  choice: zu seiner Linken
  rationale: Die parallele Formulierung erhält den pointierten Gegensatz von rechts und links.
theological_decisions:
- issue: Maskuline substantivierte Bezeichnungen im Weisheitsspruch
  choice: „eines Weisen“ und „eines Toren“
  alternative: „eines weisen Menschen“ und „eines törichten Menschen“
  rationale: Der hebräische Text verwendet repräsentative maskuline Singularformen. Die Übersetzung wahrt diese Form, ohne eine weitergehende geschlechtsspezifische Aussage in den Vers hineinzulesen.
- issue: Symbolik von rechts und links
  choice: Das räumliche Bild im Haupttext bewahren
  alternative: Deutend mit „urteilt richtig“ beziehungsweise „urteilt falsch“ übersetzen
  rationale: Der Vers erklärt die Symbolik nicht ausdrücklich. Eine ausdeutende Wiedergabe würde die genuine Bildhaftigkeit und mögliche Bedeutungsbreite vorschnell festlegen.
translation_notes:
  register: Modernes, knappes Standarddeutsch mit der würdevollen Sprache eines Weisheitsspruchs. Die bewusst auffällige Ortsangabe erhält die hebräische Metapher und den Parallelismus.
