  text: עֲמַ֥ל הַ/כְּסִילִ֖ים תְּיַגְּעֶ֑/נּוּ אֲשֶׁ֥ר לֹֽא יָדַ֖ע לָ/לֶ֥כֶת אֶל עִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/015.yaml
  text: The labor of fools wearies them[a], for he does not know how to go to the city.
translation:
  language: de
  text: Die Mühe der Toren erschöpft den, der nicht weiß, wie er zu einer Stadt gelangt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder kollektiv: »Die Mühe der Toren erschöpft sie, die nicht wissen, wie sie zu einer Stadt gelangen.« Das hebräische Suffix steht in der Einzahl; im Zusammenhang ist jedoch auch ein Bezug auf die Toren als Gruppe möglich.'
    reason: alternative_reading
lexical_decisions:
- source_word: עֲמַל
  choice: Mühe
  rationale: Das Substantiv bezeichnet mühevolle Arbeit oder Anstrengung. »Mühe« bewahrt diesen Sinn und klingt im Deutschen natürlich.
- source_word: הַכְּסִילִים
  choice: der Toren
  rationale: כְּסִיל bezeichnet in der Weisheitsliteratur einen Menschen, dessen Unvernunft auch eine moralische Dimension hat. »Toren« ist dafür die etablierte, würdevolle Wiedergabe.
- source_word: תְּיַגְּעֶנּוּ
  choice: erschöpft den
  rationale: Das Piel von יגע bedeutet »ermüden, erschöpfen«; das Suffix ist maskulin Singular. Die substantivische Form »den« ermöglicht im Deutschen den unmittelbaren Anschluss des Relativsatzes.
- source_word: אֲשֶׁר לֹא יָדַע
  choice: der nicht weiß
  rationale: Der Relativsatz wird auf den maskulinen Singular des vorangehenden Suffixes bezogen. Im sprichwörtlichen Zusammenhang bezeichnet das Perfekt einen charakteristischen Zustand und wird daher präsentisch wiedergegeben.
- source_word: לָלֶכֶת
  choice: wie er … kommt
  rationale: Nach »wissen« bezeichnet der Infinitiv die Fähigkeit beziehungsweise das Wissen, wie man ein Ziel erreicht. »Wie er … kommt« ist im Deutschen idiomatischer als das wörtliche »zu gehen«.
- source_word: אֶל עִיר
  choice: in die Stadt
  rationale: Die Wendung bezeichnet die Bewegung zur Stadt hin. Im Deutschen ist »in die Stadt kommen« die natürliche generische Formulierung; der fehlende hebräische Artikel erzwingt hier keinen unbestimmten deutschen Artikel.
theological_decisions:
- issue: Singularer Objektbezug gegenüber kollektivem Bezug auf »die Toren«
  choice: Der maskuline Singular wird im Haupttext als »den, der« bewahrt.
  alternative: 'Kollektiv: »Die Mühe der Toren erschöpft sie, denn sie wissen nicht, wie sie in die Stadt kommen.«'
  rationale: Das Suffix an תְּיַגְּעֶנּוּ ist formal maskulin Singular, und אֲשֶׁר kann den anschließenden Relativsatz darauf beziehen. Zugleich lässt der Kontext mit dem pluralischen Genitivattribut ein kollektives Verständnis zu; deshalb wird die Alternative in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt sprichwörtlich knapp; »Toren« erhält den weisheitlichen moralisch-intellektuellen Gehalt, ohne umgangssprachlich abzuwerten.
