  text: וְ/הַ/סָּכָ֖ל יַרְבֶּ֣ה דְבָרִ֑ים לֹא יֵדַ֤ע הָ/אָדָם֙ מַה שֶׁ/יִּֽהְיֶ֔ה וַ/אֲשֶׁ֤ר יִֽהְיֶה֙ מֵֽ/אַחֲרָ֔י/ו מִ֖י יַגִּ֥יד לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/014.yaml
  text: And the fool multiplies words[a]. A man does not know what will be[b], and who can tell him what will be after him?
translation:
  language: de
  text: Und der Tor redet viel.[a] Der Mensch weiß nicht, was sein wird; und wer kann ihm sagen, was nach ihm sein wird?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „macht viele Worte“. Wörtlich steht im Hebräischen eine Wendung vom Vermehren der Worte.'
    reason: lexical_alternative
  - marker: b
    text: Das kann besonders das meinen, was nach seinem Tod geschehen wird.
    reason: ambiguity
lexical_decisions:
- source_word: וְהַסָּכָל
  choice: Und der Tor
  rationale: Der bestimmte Singular wird direkt wiedergegeben. וְ führt den Gedankengang fort; „und“ bewahrt diesen Anschluss, ohne einen im Hebräischen nicht ausdrücklich markierten Gegensatz einzutragen.
- source_word: יַרְבֶּה דְבָרִים
  choice: macht viele Worte
  rationale: Die deutsche Wendung ist natürlich und bewahrt zugleich das hebräische Bild des Vermehrens von Worten.
- source_word: לֹא יֵדַע הָאָדָם
  choice: Der Mensch weiß nicht
  rationale: הָאָדָם bezeichnet hier den Menschen im allgemeinen Sinn. Der deutsche repräsentative Singular gibt sowohl die Form als auch die allgemeine Aussage angemessen wieder.
- source_word: מַה שֶׁיִּהְיֶה
  choice: was sein wird
  rationale: Die knappe Formulierung entspricht der offenen Zukunftsaussage des Hebräischen und legt nicht genauer fest, was geschehen wird.
- source_word: וַאֲשֶׁר יִהְיֶה מֵאַחֲרָיו
  choice: was nach ihm sein wird
  rationale: Die Wiedergabe bleibt nah an der räumlich-zeitlichen Formulierung und wahrt die Möglichkeit, dass die Zeit nach dem Leben eines Menschen gemeint ist.
- source_word: מִי יַגִּיד לוֹ
  choice: wer kann ihm sagen
  rationale: Die rhetorische Frage zielt auf die fehlende Möglichkeit verlässlicher Auskunft. „Sagen“ gibt das Hiphil von נגד in diesem Zusammenhang natürlich wieder.
theological_decisions:
- issue: Reichweite der menschlichen Unkenntnis über die Zukunft
  choice: 'Die Aussage bleibt allgemein: Der Mensch weiß nicht, was sein wird.'
  alternative: Die Aussage ausdrücklich auf Gottes verborgenes Handeln oder auf das Leben nach dem Tod beziehen.
  rationale: Der hebräische Text nennt weder Gottes verborgenes Handeln noch ein bestimmtes Jenseitsverständnis ausdrücklich; eine solche Präzisierung würde die offene Spannung des Verses auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Der Tor“ und „Der Mensch“ bewahren die knappen repräsentativen Singularformen; „macht viele Worte“ ist idiomatisch, aber weiterhin bildnah. Die Wiederholung von „sein wird“ erhält die formale und gedankliche Struktur des Hebräischen.
