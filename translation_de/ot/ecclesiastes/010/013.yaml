  text: תְּחִלַּ֥ת דִּבְרֵי פִ֖י/הוּ סִכְל֑וּת וְ/אַחֲרִ֣ית פִּ֔י/הוּ הוֹלֵל֖וּת רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/013.yaml
  text: The beginning of the words of his mouth is foolishness[a], and the end of his speech is evil madness.
translation:
  language: de
  text: Der Anfang der Worte seines Mundes ist Torheit, und das Ende seiner Rede ist böser Wahnsinn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „schädlicher Wahnsinn“. Im Hebräischen steht auch im zweiten Satzteil wörtlich „sein Mund“; רָעָה kann „böse“ oder allgemeiner „schädlich, verderblich“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחִלַּת
  choice: der Anfang
  rationale: Die Konstruktform bezeichnet den Anfang oder ersten Teil; „der Anfang“ bewahrt zugleich die Parallele zu „das Ende“.
- source_word: דִּבְרֵי
  choice: der Worte
  rationale: Der Plural von דָּבָר meint hier im Zusammenhang das Gesprochene; „Worte“ gibt dies unmittelbar wieder.
- source_word: פִּיהוּ
  choice: seines Mundes / seiner Rede
  rationale: Beim ersten Vorkommen bleibt das hebräische Körperbild erhalten. Beim zweiten wird die wörtliche Wiederholung idiomatisch als „seiner Rede“ wiedergegeben, ohne den Sinn zu verändern.
- source_word: סִכְלוּת
  choice: Torheit
  rationale: „Torheit“ bezeichnet den für Kohelet typischen Gegensatz zur Weisheit und wahrt den würdevollen Weisheitsstil.
- source_word: וְאַחֲרִית
  choice: und das Ende
  rationale: Die Wiedergabe spiegelt die Gegenüberstellung von Anfang und Ende im Hebräischen.
- source_word: הוֹלֵלוּת
  choice: Wahnsinn
  rationale: Das Wort bezeichnet hier gesteigerte Unvernunft oder Irrsinn und verstärkt damit die zuvor genannte Torheit.
- source_word: רָעָה
  choice: böser
  rationale: Die Grundbedeutung „böse“ bewahrt die scharfe, möglicherweise moralische Wertung; die mögliche Bedeutung „schädlich/verderblich“ wird in der Fußnote offengehalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die antithetische Struktur „Anfang … Ende“ bleibt erhalten; die zweite Wiederholung von „Mund“ wird zugunsten natürlichen Deutschen als „Rede“ formuliert.
