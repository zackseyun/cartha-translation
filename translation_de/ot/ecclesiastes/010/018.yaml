id: ECC.10.18
reference: Ecclesiastes 10:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בַּ/עֲצַלְתַּ֖יִם יִמַּ֣ךְ הַ/מְּקָרֶ֑ה וּ/בְ/שִׁפְל֥וּת יָדַ֖יִם יִדְלֹ֥ף הַ/בָּֽיִת׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/018.yaml
  text: Through laziness the roof sags[b][a], and through idle hands the house leaks.
translation:
  language: de
  text: Durch Faulheit senkt sich das Dach[a], und durch untätige Hände[b] wird das Haus undicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gibt die Dachkonstruktion nach“. Das hebräische Verb kann ein Absinken oder Nachgeben bezeichnen; das Wort für „Dach“ kann sich genauer auf die Dachkonstruktion beziehen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „durch das Herabsinken der Hände“; gemeint ist nachlässige Untätigkeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲצַלְתַּיִם
  choice: Durch Faulheit
  rationale: Die Präposition ב bezeichnet hier Mittel oder Ursache. „Durch Faulheit“ gibt den abstrakten Dualbegriff natürlich und mit der kausalen Aussage wieder.
- source_word: יִמַּךְ
  choice: senkt sich
  rationale: Das Nifal von מוך bezeichnet ein Niedrigwerden, Absinken oder Nachgeben. „Senkt sich“ passt zu einem allmählich nachgebenden Dach, ohne bereits einen vollständigen Einsturz auszusagen.
- source_word: הַמְּקָרֶה
  choice: das Dach
  rationale: מְקָרֶה kann die Dachkonstruktion beziehungsweise das Dachwerk bezeichnen. „Dach“ ist im Deutschen klar und vermeidet die unbelegte Festlegung auf Balken oder Sparren.
- source_word: וּבְשִׁפְלוּת יָדַיִם
  choice: und durch untätige Hände
  rationale: Wörtlich ist von der „Niedrigkeit“ oder dem „Herabsinken der Hände“ die Rede, idiomatisch von träger, nachlässiger Untätigkeit. „Untätige Hände“ bewahrt das Körperbild und ist in modernem Deutsch verständlich.
- source_word: יִדְלֹף
  choice: wird … undicht
  rationale: דלף bezeichnet Tropfen oder Lecken. Da im Hebräischen das Haus Subjekt ist, gibt „wird das Haus undicht“ den baulichen Sinn natürlich wieder; das konkrete Tropfen bleibt semantisch eingeschlossen.
- source_word: הַבָּיִת
  choice: das Haus
  rationale: בַּיִת hat hier seine gewöhnliche konkrete Bedeutung „Haus“ und trägt das anschauliche Spruchbild.
theological_decisions: []
translation_notes:
  register: Modernes, knappes und spruchhaftes Standarddeutsch. Die parallele Konstruktion mit „durch“ bleibt erhalten; die konkrete Metapher der Hände wird nicht aufgelöst. „Wird undicht“ vermeidet das im Deutschen unnatürliche „das Haus tropft“, ohne die Folge der Vernachlässigung abzuschwächen.
