  yaml_path: translation/ot/ecclesiastes/010/009.yaml
  text: Whoever quarries stones may be hurt by them, and whoever splits logs may be endangered by them.
translation:
  language: de
  text: Wer Steine bewegt, kann sich an ihnen verletzen; wer Holz spaltet, kann dadurch in Gefahr geraten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die genaue Bedeutung des seltenen hebräischen Verbs ist unsicher; gemeint ist wahrscheinlich, dass jemand dadurch gefährdet wird oder in Gefahr gerät. Möglich ist auch: „muss sich dabei in Acht nehmen“.'
    reason: Die Anmerkung markiert die lexikalische Unsicherheit von יִסָּכֶן, ohne die knappe Spruchform des Haupttextes zu überladen.
lexical_decisions:
- source_word: מַסִּיעַ אֲבָנִים
  choice: Wer Steine wegschafft
  rationale: Das Hifil-Partizip von נסע bezeichnet hier grundsätzlich das Bewegen oder Entfernen von Steinen. „Wegschafft“ bleibt näher am Hebräischen als die speziellere Deutung „im Steinbruch bricht“.
- source_word: יֵעָצֵב בָּהֶם
  choice: kann sich an ihnen verletzen
  rationale: Die Form beschreibt im Zusammenhang eine mögliche schmerzhafte Schädigung durch die Steine. Die deutsche Formulierung gibt die allgemeine Erfahrungsregel natürlich wieder.
- source_word: בּוֹקֵעַ עֵצִים
  choice: wer Holz spaltet
  rationale: בקע bedeutet „spalten“; עֵצִים kann Bäume, Holz oder Holzstücke bezeichnen. „Holz“ wahrt die im Kontext naheliegende, aber nicht unnötig eingeengte Bedeutung.
- source_word: יִסָּכֶן בָּם
  choice: kann sich dabei in Gefahr bringen
  rationale: Das seltene Verb wird hier im Kontext paralleler Arbeitsgefahren als Gefährdung verstanden. „Dabei“ formuliert den Bezug auf das Holzspalten idiomatisch, ohne eine bestimmte Art der Gefahr hinzuzufügen.
theological_decisions: []
translation_notes:
  register: Moderne, allgemein verständliche und zugleich würdige Spruchsprache. Die parallele Satzstruktur des Hebräischen bleibt erhalten; die Modalform „kann“ kennzeichnet eine allgemeine mögliche Folge statt einer ausnahmslosen Aussage.
