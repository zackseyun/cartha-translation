  text: לִ/שְׂחוֹק֙ עֹשִׂ֣ים לֶ֔חֶם וְ/יַ֖יִן יְשַׂמַּ֣ח חַיִּ֑ים וְ/הַ/כֶּ֖סֶף יַעֲנֶ֥ה אֶת הַ/כֹּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/019.yaml
  text: They make bread for laughter[a], and wine gladdens life[b], and money answers everything.
translation:
  language: de
  text: Zum Vergnügen bereitet man ein Mahl, und Wein erfreut das Leben, und Geld beantwortet alles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Geld antwortet auf alles.“ Die knappe Wendung kann meinen, dass Geld auf jede Lage eine Antwort oder Lösung bietet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׂחוֹק עֹשִׂים לֶחֶם
  choice: Zum Vergnügen bereitet man ein Mahl
  rationale: 'לִשְׂחוֹק bezeichnet hier Zweck oder Ergebnis: Vergnügen bzw. Fröhlichkeit. עֹשִׂים hat ein unbestimmtes plurales Subjekt, das im Deutschen natürlich mit „man“ wiedergegeben wird. לֶחֶם bedeutet wörtlich „Brot“, kann aber metonymisch eine Mahlzeit bezeichnen; „ein Mahl bereiten“ ergibt in diesem Zusammenhang natürliches, verständliches Deutsch.'
- source_word: וְיַיִן יְשַׂמַּח חַיִּים
  choice: und Wein erfreut das Leben
  rationale: Das Piel von שׂמח bedeutet „erfreuen, froh machen“. חַיִּים kann „Leben“ oder „die Lebenden“ meinen; „das Leben“ bewahrt die knappe sprichwörtliche Aussage und klingt im Deutschen natürlich.
- source_word: וְהַכֶּסֶף
  choice: doch Geld
  rationale: כֶּסֶף kann „Silber“ oder „Geld“ bedeuten; hier ist die wirtschaftliche Bedeutung gemeint. Die Konjunktion וְ wird mit „doch“ wiedergegeben, um den pointierten Übergang zur Schlussaussage idiomatisch auszudrücken, ohne deren Wahrheitsanspruch abzuschwächen.
- source_word: יַעֲנֶה אֶת־הַכֹּל
  choice: verschafft alles
  rationale: ענה bedeutet gewöhnlich „antworten, erwidern“, hat hier aber wahrscheinlich die idiomatische Bedeutung, dass Geld auf alles eine praktische Antwort bietet bzw. alles beschafft. „Verschafft alles“ ist knapp und verständlich; die wörtliche Formulierung wird in der Fußnote erhalten.
theological_decisions:
- issue: Ton und Tragweite der Schlussaussage
  choice: Die Aussage wird ohne abschwächende Zusätze als pointierte Beobachtung wiedergegeben.
  alternative: 'Die Aussage ausdrücklich als ironisch oder subjektiv markieren, etwa: „Geld scheint auf alles eine Antwort zu haben“ oder „Die Leute meinen, Geld sei die Antwort auf alles.“'
  rationale: Der hebräische Text kennzeichnet Ironie oder subjektive Distanz nicht grammatisch. Die Übersetzung bewahrt daher die Spannung und überlässt die Einordnung dem literarischen Zusammenhang des Predigerbuches.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit aphoristischer Kürze. „Mahl“ gibt die kontextuelle Bedeutung von לֶחֶם natürlicher wieder als das wörtliche „Brot“. Die Fußnote bewahrt die auffällige hebräische Wendung der Schlusszeile.
