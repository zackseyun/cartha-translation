source:
  edition: WLC
  text: אִם קֵהָ֣ה הַ/בַּרְזֶ֗ל וְ/הוּא֙ לֹא פָנִ֣ים קִלְקַ֔ל וַ/חֲיָלִ֖ים יְגַבֵּ֑ר וְ/יִתְר֥וֹן הכשיר חָכְמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/010.yaml
  text: If the iron is dull and one has not sharpened its edge[a], then he must use more strength[b]; but wisdom brings success.
translation:
  language: de
  text: Wenn das Eisen[a] stumpf ist und man die Schneide[b] nicht schärft, muss man mehr Kraft aufwenden; doch Weisheit hat den Vorteil, zum Erfolg zu verhelfen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit »Eisen« ist wahrscheinlich ein eisernes Werkzeug oder dessen Klinge gemeint.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: »Gesicht« beziehungsweise »Fläche/Vorderseite«. Im Zusammenhang ist die Schneidfläche oder Schneide gemeint.'
    reason: lexical_alternative
  - marker: c
    text: 'Der hebräische Schlusssatz ist syntaktisch knapp; auch möglich: »Der Vorteil der Weisheit besteht darin, etwas gelingen zu lassen.«'
    reason: textual_ambiguity
lexical_decisions:
- source_word: קֵהָה
  choice: stumpf geworden ist
  rationale: Das Verb bezeichnet das Stumpfwerden einer Schneide. Die Formulierung gibt den Zustandswechsel natürlich und bildhaft wieder.
- source_word: הַבַּרְזֶל
  choice: das Eisen
  rationale: Die metonymische Ausdrucksweise des Hebräischen bleibt erhalten; gemeint ist im Zusammenhang ein eisernes Werkzeug beziehungsweise dessen Klinge.
- source_word: פָנִים
  choice: seine Schneide
  rationale: Wörtlich bedeutet das Wort »Gesicht« beziehungsweise »Vorderseite«; bei einem stumpfen Eisen bezeichnet es sinngemäß die bearbeitete Schneidfläche.
- source_word: קִלְקַל
  choice: nicht schärft
  rationale: Im Zusammenhang bezeichnet das Verb das Zurichten oder Instandsetzen der Schneide, hier also ihr Schärfen.
- source_word: וַחֲיָלִים יְגַבֵּר
  choice: muss man mehr Kraft aufwenden
  rationale: חַיִל kann Kraft, Stärke oder Mittel bezeichnen; die Konstruktion drückt aus, dass wegen des stumpfen Werkzeugs ein erhöhter Kraftaufwand nötig ist.
- source_word: וְיִתְרוֹן
  choice: doch … hat den Vorzug
  rationale: Die Wiedergabe bewahrt ausdrücklich den Begriff des Vorteils oder Gewinns und macht zugleich den Gegensatz zum unnötigen Kraftaufwand deutlich.
- source_word: הַכְשֵׁיר
  choice: dass sie Erfolg bringt
  rationale: Die Hifil-Form von כשר bezeichnet das Tauglichmachen oder erfolgreiche Gelingenlassen. Die gewählte Formulierung gibt den praktischen Nutzen der Weisheit idiomatisch wieder.
- source_word: חָכְמָה
  choice: Weisheit
  rationale: Die übliche Entsprechung passt hier besonders zur praktischen Umsicht und Geschicklichkeit, die wirksames Handeln ermöglicht.
theological_decisions:
- issue: Verhältnis von Weisheit, Vorteil und Erfolg im Schlusssatz
  choice: Weisheit hat den Vorzug, dass sie Erfolg bringt
  alternative: Der Vorteil der Weisheit besteht darin, etwas gelingen zu lassen
  rationale: Der knappe hebräische Nominalsatz lässt das genaue syntaktische Verhältnis offen. Die Hauptfassung bewahrt sowohl יִתְרוֹן als »Vorzug« als auch die kausative Bedeutung von הכשיר, ohne Weisheit als Garantie jedes gewünschten Ergebnisses zu deuten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Spruchweisheitsklang. Das unpersönliche »man« vermeidet einen im Hebräischen nicht ausdrücklich genannten männlichen Handelnden; »Kraft aufwenden« ist idiomatisch und sachlich.
