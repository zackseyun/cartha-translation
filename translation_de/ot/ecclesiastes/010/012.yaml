  text: דִּבְרֵ֥י פִי חָכָ֖ם חֵ֑ן וְ/שִׂפְת֥וֹת כְּסִ֖יל תְּבַלְּעֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/012.yaml
  text: The words of the mouth of a wise man are gracious[a], but the lips of a fool swallow him up.
translation:
  language: de
  text: Die Worte aus dem Mund eines Weisen sind voller Anmut[a], doch die Lippen eines Toren verschlingen ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Die Worte aus dem Mund eines Weisen bringen Gunst.« Das hebräische Wort kann »Anmut«, »Wohlwollen« oder »Gunst« bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי פִי חָכָם
  choice: Die Worte aus dem Mund eines Weisen
  rationale: Die hebräische Constructusverbindung wird im Deutschen natürlich mit „aus dem Mund“ wiedergegeben; „eines Weisen“ bewahrt Numerus und generisches Maskulinum des substantivierten חָכָם.
- source_word: חֵן
  choice: wohltuend
  rationale: Das prädikative Substantiv bezeichnet Anmut, Gunst oder eine angenehme Wirkung. „Wohltuend“ ergibt einen natürlichen deutschen Satz und lässt offen, ob die Worte von Anmut geprägt sind oder Gunst bewirken.
- source_word: שִׂפְתוֹת כְּסִיל
  choice: die Lippen eines Toren
  rationale: „Lippen“ bewahrt das konkrete poetische Bild und den Parallelismus zu „Mund“; „Tor“ ist der geläufige Weisheitsbegriff für einen moralisch wie verstandesmäßig törichten Menschen.
- source_word: תְּבַלְּעֶנּוּ
  choice: verschlingen ihn
  rationale: 'Die Wiedergabe bewahrt das drastische Bild von בלע: Die eigene Rede des Toren wird zu seinem Verderben.'
theological_decisions: []
