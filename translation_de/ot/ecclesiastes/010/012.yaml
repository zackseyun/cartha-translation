  register: Modernes, würdevolles Standarddeutsch. Der knappe poetische Parallelismus und die Körperbilder „Mund“ und „Lippen“ bleiben erhalten; die Mehrdeutigkeit von חֵן wird durch eine Fußnote sichtbar gemacht.
