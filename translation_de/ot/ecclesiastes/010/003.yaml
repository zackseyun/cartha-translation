  text: וְ/גַם בַּ/דֶּ֛רֶךְ כ/ש/ה/סכל הֹלֵ֖ךְ לִבּ֣/וֹ חָסֵ֑ר וְ/אָמַ֥ר לַ/כֹּ֖ל סָכָ֥ל הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/003.yaml
  text: Even on the road[a], when the fool walks, his heart lacks sense, and he says to everyone that he is a fool.
translation:
  language: de
  text: Auch wenn der Tor unterwegs ist, fehlt es seinem Herzen an Verstand, und er sagt jedem, dass er ein Tor ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und er sagt zu jedem: ‚Er ist ein Tor.‘“ Das Hebräische kann entweder bedeuten, dass der Tor sich selbst als Tor zu erkennen gibt, oder dass er andere als Toren bezeichnet. Im Zusammenhang passt die erste Deutung besser.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: Selbst wenn
  rationale: 'Gibt die hervorhebende Weiterführung im Zusammenhang mit der folgenden Zeitaussage natürlich wieder: Sogar in der alltäglichen Öffentlichkeit wird die Torheit sichtbar.'
- source_word: בַּדֶּרֶךְ
  choice: auf dem Weg
  rationale: Bewahrt das räumliche Bild und ist im modernen Standarddeutsch natürlich.
- source_word: כשהסכל הֹלֵךְ
  choice: der Tor auf dem Weg geht
  rationale: Die Verbindung aus כ־ש und Partizip wird als zeitlicher Nebensatz verstanden; „geht“ bewahrt die Bewegung, ohne im Deutschen unnatürlich zu wirken.
- source_word: לִבּוֹ חָסֵר
  choice: fehlt es seinem Herzen an Verstand
  rationale: Bewahrt „Herz“ als Sitz des Denkens und Urteilens und macht zugleich den gemeinten Mangel für heutige Leser verständlich.
- source_word: וְאָמַר לַכֹּל
  choice: und er sagt jedem
  rationale: Gibt die einfache Fortführung und den umfassenden Adressatenkreis knapp und unmittelbar wieder.
- source_word: סָכָל הוּא
  choice: dass er ein Tor ist
  rationale: 'Bezieht das Pronomen auf den Gehenden: Durch sein Reden gibt er sich vor allen als Tor zu erkennen. Das hebräische Substantiv wird mit „Tor“ statt nur adjektivisch wiedergegeben.'
theological_decisions:
- issue: Bezug von הוּא und Funktion der Aussage סָכָל הוּא
  choice: 'Der Tor offenbart beziehungsweise bezeichnet sich selbst als Tor: „dass er ein Tor ist“'
  alternative: 'Er sagt über einen anderen oder über jeden: „Er ist ein Tor.“'
  rationale: Die Syntax lässt beide Bezüge zu. Im Kontext der sich selbst verratenden Torheit liegt die Selbstoffenbarung näher, doch die echte Mehrdeutigkeit wird in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Tor“ bewahrt den weisheitlichen Begriff und den substantivischen Ausdruck des Hebräischen. Die bewusst etwas bildhafte Wendung „seinem Herzen an Verstand“ erhält die hebräische Anthropologie, bleibt aber verständlich.
