base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/017.yaml
  text: Happy are you[a], O land, when your king is a son of nobles, and your princes eat at the proper time[c][b], for strength and not for drunkenness.
translation:
  language: de
  text: Glücklich bist du, Land,[a] wenn dein König aus vornehmem Haus stammt[b] und deine Fürsten zur rechten Zeit essen – zur Stärkung und nicht zum Trinken.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gut geht es dir, Land“; auch „Gesegnet bist du, Land“ ist möglich.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „ein Sohn von Vornehmen“; möglicherweise auch: „ein Sohn von Freigeborenen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „zur Stärke und nicht zum Trinken“. Der Kontrast kann Essen zur Kräftigung statt eines auf Genuss oder Rausch zielenden Trinkens meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵיךְ
  choice: Glücklich bist du
  rationale: Die Weisheitsformel bezeichnet einen beneidenswert guten Zustand. „Glücklich bist du“ ist im heutigen Deutsch natürlich und vermeidet hier den möglicherweise enger religiös verstandenen Ausdruck „gesegnet“.
- source_word: אֶרֶץ
  choice: Land
  rationale: Das Wort bezeichnet hier das politisch verfasste Gemeinwesen, das im Parallelismus durch König und Fürsten näher bestimmt wird. Die direkte Anrede bleibt erhalten.
- source_word: שֶׁמַּלְכֵּךְ
  choice: wenn dein König
  rationale: Die hebräische Relativkonstruktion kann wörtlich „dessen König“ heißen; in der deutschen Glücklichpreisung gibt „wenn dein König“ den beschreibend-bedingten Sinn idiomatisch wieder.
- source_word: בֶּן חוֹרִים
  choice: aus vornehmem Haus stammt
  rationale: Die Wendung bezeichnet einen Sohn von Vornehmen beziehungsweise Freigeborenen. Die Formulierung gibt den Gedanken vornehmer Herkunft natürlich wieder, ohne ihn auf einen erblichen Adelstitel zu verengen.
- source_word: וְשָׂרַיִךְ
  choice: und deine Fürsten
  rationale: „Fürsten“ bewahrt den höfisch-politischen Zusammenhang und bezeichnet die führenden Amtsträger des Landes.
- source_word: בָּעֵת
  choice: zur rechten Zeit
  rationale: Gemeint ist die angemessene Zeit, im Kontrast zum morgendlichen Schmausen in Vers 16.
- source_word: יֹאכֵלוּ
  choice: essen
  rationale: Die schlichte Grundbedeutung des Verbs wird beibehalten; der Zusammenhang liefert den Bezug zum höfischen Mahl.
- source_word: בִּגְבוּרָה
  choice: zur Stärkung
  rationale: 'גְּבוּרָה bezeichnet Stärke oder Kraft. In diesem Zusammenhang liegt ein zweckhafter Sinn nahe: Sie essen, um Kraft zu gewinnen.'
- source_word: וְלֹא בַשְּׁתִי
  choice: und nicht zum Zechen
  rationale: שְׁתִי bezeichnet wörtlich das Trinken, hier jedoch im Gegensatz zur Stärkung offenbar maßloses Trinkgelage. „Zechen“ drückt diese negative Konnotation knapp aus, ohne jede Form des Trinkens zu verurteilen.
