  text: אִם יִשֹּׁ֥ךְ הַ/נָּחָ֖שׁ בְּ/לוֹא לָ֑חַשׁ וְ/אֵ֣ין יִתְר֔וֹן לְ/בַ֖עַל הַ/לָּשֽׁוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/011.yaml
  text: If the snake bites before it is charmed[b][a], there is no advantage for the charmer.
translation:
  language: de
  text: Wenn die Schlange beißt, ehe sie beschworen wird[b], hat der Beschwörer[a] keinen Vorteil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der Herr/Besitzer der Zunge“. Gemeint ist wahrscheinlich ein Schlangenbeschwörer, also jemand, der einen gesprochenen Beschwörungsspruch beherrscht.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Wenn die Schlange beißt, ohne dass ein Beschwörungsspruch gesprochen wurde, hat der Herr der Zunge keinen Gewinn.“'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: Wenn
  rationale: Leitet den sprichwortartigen Bedingungsfall natürlich und sachgerecht ein.
- source_word: יִשֹּׁךְ
  choice: beißt
  rationale: נשׁך bezeichnet besonders bei einer Schlange gewöhnlich das Beißen.
- source_word: הַנָּחָשׁ
  choice: die Schlange
  rationale: Gibt das konkrete Bild ohne unnötige theologische Nebenbedeutungen wieder.
- source_word: בְּלוֹא לָחַשׁ
  choice: ehe sie beschworen wird
  rationale: 'לחש kann ein Flüstern, einen Zauberspruch oder eine Beschwörung bezeichnen. Die zeitlich-praktische Wiedergabe passt zum Bild: Beißt die Schlange, bevor der Spruch wirkt, kommt die Kunst zu spät.'
- source_word: וְאֵין יִתְרוֹן
  choice: hat … keinen Vorteil
  rationale: יתרון ist ein Leitwort in Kohelet für Vorteil, Gewinn oder Nutzen. „Vorteil“ wahrt diesen Sinn und klingt im Deutschen natürlich.
- source_word: לְבַעַל הַלָּשׁוֹן
  choice: der Beschwörer
  rationale: Wörtlich steht „Herr/Besitzer der Zunge“. Im Zusammenhang ist damit wahrscheinlich der in gesprochenen Beschwörungen kundige Schlangenbeschwörer gemeint.
