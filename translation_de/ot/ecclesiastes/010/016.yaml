base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/016.yaml
  text: Woe to you[a], O land[b], when your king is a youth and your princes eat in the morning.
translation:
  language: de
  text: Wehe dir, Land, wenn dein König ein Jugendlicher[a] ist und deine Fürsten am Morgen essen[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein Kind« beziehungsweise »ein junger Mann«. Das hebräische Wort kann ein Kind, einen Jugendlichen oder einen jungen Mann bezeichnen; hier dürfte die Jugend des Königs zugleich seine mangelnde Reife zum Regieren andeuten.'
    reason: lexical_alternative
  - marker: b
    text: Dass die Fürsten »am Morgen essen«, deutet wahrscheinlich auf selbstsüchtiges Gelage zur unpassenden Zeit hin. Dazu bildet der folgende Vers einen Gegensatz.
    reason: cultural_note
lexical_decisions:
- source_word: אִי לָךְ
  choice: Wehe dir
  rationale: Die feste deutsche Wendung gibt den an das Land gerichteten Klage- oder Unheilsruf prägnant und würdig wieder.
- source_word: אֶרֶץ
  choice: Land
  rationale: Gemeint ist hier ein politisches Gemeinwesen oder Herrschaftsgebiet, nicht die gesamte Erde.
- source_word: שֶׁמַּלְכֵּךְ
  choice: wenn dein König
  rationale: Die hebräische Relativkonstruktion lässt sich im Deutschen natürlich als Umstands- beziehungsweise Bedingungssatz wiedergeben; »dessen König« wäre ebenfalls möglich.
- source_word: נָעַר
  choice: ein junger Mann
  rationale: Das Wort kann je nach Zusammenhang ein Kind, einen Jugendlichen oder einen jungen Mann bezeichnen. Die Wiedergabe bewahrt den Altersbezug, ohne im Haupttext eindeutig auf ein kleines Kind oder ausdrücklich auf charakterliche Unreife festzulegen.
- source_word: וְשָׂרַיִךְ
  choice: und deine Fürsten
  rationale: שָׂרִים bezeichnet führende Amtsträger oder hochgestellte Herrscher. »Fürsten« erhält das höfisch-politische Gepräge des Zusammenhangs.
- source_word: בַּבֹּקֶר יֹאכֵלוּ
  choice: am Morgen essen
  rationale: Die Übersetzung folgt der schlichten Formulierung des Hebräischen. Die im Zusammenhang naheliegende Kritik an verfrühtem, selbstsüchtigem Gelage wird nicht in den Haupttext hineingetragen.
