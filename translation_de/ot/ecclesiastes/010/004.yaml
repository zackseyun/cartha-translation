  variant: modern standard German
source:
  edition: WLC
  text: אִם ר֤וּחַ הַ/מּוֹשֵׁל֙ תַּעֲלֶ֣ה עָלֶ֔י/ךָ מְקוֹמְ/ךָ֖ אַל תַּנַּ֑ח כִּ֣י מַרְפֵּ֔א יַנִּ֖יחַ חֲטָאִ֥ים גְּדוֹלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/004.yaml
  text: If the ruler’s anger rises against you[a], do not leave your place[d][c][b], for calmness lays great offenses to rest.
translation:
  language: de
  text: Wenn der Zorn des Herrschers gegen dich aufsteigt[a], verlass deinen Platz[b] nicht; denn Besonnenheit[c] bringt schwere Verfehlungen[d] zur Ruhe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »der Geist des Herrschers«; auch »die Gemütsart des Herrschers«. Gemeint ist hier wahrscheinlich sein aufwallender Zorn.
    reason: lexical_alternative
  - marker: b
    text: Oder »deine Stellung« beziehungsweise »deinen Posten«; wörtlich »deinen Platz«.
    reason: lexical_alternative
  - marker: c
    text: Oder »Linderung«, »Sanftmut« beziehungsweise »eine beruhigende Haltung«. Das hebräische Wort kann auch »Heilung« bedeuten.
    reason: lexical_alternative
  - marker: d
    text: Oder »große Sünden« beziehungsweise »schwere Fehler«.
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחַ
  choice: Zorn
  rationale: Das Wort bedeutet wörtlich »Geist«, »Wind« oder auch »Gemütsart«. Zusammen mit »gegen dich aufsteigt« bezeichnet es hier am ehesten den aufwallenden Zorn des Herrschers.
- source_word: הַמּוֹשֵׁל
  choice: der Herrscher
  rationale: Das Partizip bezeichnet allgemein jemanden, der herrscht oder Autorität ausübt. »Herrscher« wahrt diese Breite.
- source_word: תַּעֲלֶה עָלֶיךָ
  choice: gegen dich aufsteigt
  rationale: Die bildhafte Bewegung des hebräischen Verbs »hinaufsteigen« bleibt erhalten; עַל bezeichnet hier die gegen die angesprochene Person gerichtete Regung.
- source_word: מְקוֹמְךָ
  choice: deinen Platz
  rationale: Dies entspricht unmittelbar dem hebräischen Ausdruck und kann im Zusammenhang sowohl den konkreten Platz als auch die Stellung im Dienst des Herrschers meinen.
- source_word: אַל תַּנַּח
  choice: verlass ... nicht
  rationale: Im Zusammenhang fordert die Wendung dazu auf, den eigenen Platz nicht aufzugeben oder zu räumen.
- source_word: מַרְפֵּא
  choice: Besonnenheit
  rationale: Das Substantiv kann Heilung, Linderung oder eine beruhigende Haltung bezeichnen. »Besonnenheit« gibt hier eine ruhige, deeskalierende Reaktion natürlich wieder, ohne den Heilungsaspekt in der Fußnote zu verschweigen.
- source_word: יַנִּיחַ
  choice: bringt ... zur Ruhe
  rationale: Die Kausativform bezeichnet ein Ruhenlassen oder Zur-Ruhe-Bringen. Die deutsche Formulierung erhält dieses Bild und vermeidet eine eindeutige Festlegung auf »verhindern« oder »vergeben«.
- source_word: חֲטָאִים גְּדוֹלִים
  choice: schwere Verfehlungen
  rationale: חֲטָאִים kann Sünden, Fehler oder Verfehlungen bezeichnen. »Schwere Verfehlungen« bewahrt das moralische Gewicht und passt zugleich zum politischen und zwischenmenschlichen Zusammenhang.
theological_decisions:
- issue: Bedeutungsumfang von חֲטָאִים
  choice: schwere Verfehlungen
  alternative: große Sünden
  rationale: Der Kontext lässt sowohl moralisch-religiöse Sünden als auch gravierende Fehler oder Vergehen gegenüber einem Herrscher zu. Der Haupttext wahrt diese Breite; die engere Alternative wird in der Fußnote genannt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Spruchweisheitsstil. Die Satzstruktur bleibt knapp und parallel. »Besonnenheit« ist idiomatischer als das wörtliche »Heilung«, während »bringt ... zur Ruhe« das hebräische Bild und seine Deutungsoffenheit bewahrt.
