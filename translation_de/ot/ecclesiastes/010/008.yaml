source:
  edition: WLC
  text: חֹפֵ֥ר גּוּמָּ֖ץ בּ֣/וֹ יִפּ֑וֹל וּ/פֹרֵ֥ץ גָּדֵ֖ר יִשְּׁכֶ֥/נּוּ נָחָֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/008.yaml
  text: Whoever digs a pit will fall into it[b][a], and whoever breaks through a wall will be bitten by a snake.
translation:
  language: de
  text: Wer eine Grube gräbt, fällt hinein; und wer eine Mauer[a] durchbricht, den beißt eine Schlange.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das mit „Mauer“ übersetzte Wort kann auch einen Grenz- oder Schutzzaun bezeichnen, im damaligen Umfeld wahrscheinlich eine Einfriedung aus Steinen.
    reason: cultural_note
lexical_decisions:
- source_word: חֹפֵר
  choice: Wer … gräbt
  rationale: Das Qal-Partizip bezeichnet sprichwörtlich und allgemein eine beliebige Person. Die Konstruktion mit „wer“ gibt diese allgemeine Aussage im heutigen Deutsch natürlich wieder.
- source_word: גּוּמָּץ
  choice: eine Grube
  rationale: Das Wort bezeichnet eine ausgehobene Vertiefung, möglicherweise auch eine Fanggrube. „Grube“ passt sowohl zum konkreten Bild als auch zum sprichwörtlichen Charakter.
- source_word: בּוֹ
  choice: hinein
  rationale: In Verbindung mit „fallen“ gibt „hineinfallen“ idiomatisch wieder, dass die Person in eben die Grube fällt, die sie gegraben hat.
- source_word: יִפּוֹל
  choice: fällt
  rationale: Das Imperfekt beschreibt hier eine allgemeine, sprichwörtliche Folge. Das deutsche Präsens ist dafür natürlicher als eine ausdrückliche Zukunftsform.
- source_word: וּפֹרֵץ
  choice: und wer … durchbricht
  rationale: Auch dieses Partizip hat allgemeinen Bezug. „Durchbrechen“ bewahrt die aktive, gewaltsame Vorstellung von פרץ.
- source_word: גָּדֵר
  choice: eine Mauer
  rationale: גָּדֵר kann eine Mauer oder Einfriedung bezeichnen, im antiken Umfeld häufig eine aus Steinen errichtete Begrenzung. „Mauer“ ist im Haupttext prägnant; die weitere Bedeutung wird in der Fußnote bewahrt.
- source_word: יִשְּׁכֶנּוּ
  choice: den beißt
  rationale: נשך bedeutet „beißen“; das Objektsuffix verweist auf denjenigen, der die Mauer durchbricht. Die vorangestellte Formulierung „den beißt“ ist im Deutschen klar und erhält die hebräische Satzbewegung.
- source_word: נָחָשׁ
  choice: eine Schlange
  rationale: „Schlange“ ist die gewöhnliche, gegenwärtige deutsche Entsprechung und vermeidet die unnötig gehobene oder symbolisch aufgeladene Wirkung von „Schlangentier“ oder „Serpent“.
