  text: תַּ֣רְתִּי בְ/לִבִּ֔/י לִ/מְשׁ֥וֹךְ בַּ/יַּ֖יִן אֶת בְּשָׂרִ֑/י וְ/לִבִּ֞/י נֹהֵ֤ג בַּֽ/חָכְמָה֙ וְ/לֶ/אֱחֹ֣ז בְּ/סִכְל֔וּת עַ֣ד אֲשֶׁר אֶרְאֶ֗ה אֵי זֶ֨ה ט֜וֹב לִ/בְנֵ֤י הָ/אָדָם֙ אֲשֶׁ֤ר יַעֲשׂוּ֙ תַּ֣חַת הַ/שָּׁמַ֔יִם מִסְפַּ֖ר יְמֵ֥י חַיֵּי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/003.yaml
  text: I searched in my heart to draw my flesh along with wine[a], while my heart was guiding me with wisdom, and to lay hold of folly[b], until I might see what was good for the sons of man to do under the heavens during the number of the days of their lives.
translation:
  language: de
  text: Ich erforschte in meinem Herzen, meinen Leib mit Wein zu ziehen[a], während mein Herz mich mit Weisheit leitete, und die Torheit zu ergreifen, bis ich sähe, was für die Menschen gut wäre, unter dem Himmel zu tun, solange ihre Lebenstage gezählt sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Wendung ist schwer zu deuten. Wörtlich steht etwa: „meinen Leib mit Wein ziehen“. Sie kann bedeuten, den körperlichen Genuss des Weins zu erproben und dabei dennoch von Weisheit geleitet zu bleiben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּרְתִּי בְלִבִּי
  choice: Ich erforschte in meinem Herzen
  rationale: Das Verb bezeichnet ein bewusstes Erkunden oder Untersuchen. „In meinem Herzen“ bewahrt die hebräische Vorstellung vom Herzen als Zentrum des Denkens und Wollens.
- source_word: לִמְשׁוֹךְ בַּיַּיִן אֶת־בְּשָׂרִי
  choice: wie ich meinen Leib mit Wein ziehen könnte
  rationale: Die schwierige Wendung wird bewusst nicht eindeutig als Ermunterung, Genuss oder Hingabe ausgelegt. „Leib“ gibt den körperlichen Bezug von בשר im heutigen Deutsch natürlicher wieder als „Fleisch“, während „ziehen“ die ungewöhnliche Bildsprache von משׁך erhält.
- source_word: וְלִבִּי נֹהֵג בַּחָכְמָה
  choice: während mein Herz mich mit Weisheit leitete
  rationale: נהג bezeichnet Führen oder Leiten. Das im Deutschen ergänzte „mich“ macht den naheliegenden Bezug verständlich, ohne die Spannung zwischen Weinexperiment und fortbestehender Weisheit aufzulösen.
- source_word: וְלֶאֱחֹז בְּסִכְלוּת
  choice: und wie ich die Torheit ergreifen könnte
  rationale: אחז bedeutet ergreifen oder festhalten. „Torheit“ bleibt als Leitbegriff der Weisheitsliteratur erhalten.
- source_word: עַד אֲשֶׁר אֶרְאֶה
  choice: bis ich sähe
  rationale: Der Konjunktiv bewahrt den prospektiven und erforschenden Charakter des Vorhabens.
- source_word: לִבְנֵי הָאָדָם
  choice: für die Menschen
  rationale: Die hebräische Wendung „Söhne des Menschen/Adams“ bezeichnet hier die Menschheit allgemein. „Die Menschen“ ist im modernen Deutschen natürlich und sachlich geschlechtsübergreifend.
- source_word: תַּחַת הַשָּׁמַיִם
  choice: unter dem Himmel
  rationale: Die feste deutsche Wendung gibt den räumlich-existenziellen Ausdruck natürlich wieder; der hebräische Plural verlangt im Deutschen keinen Plural.
- source_word: מִסְפַּר יְמֵי חַיֵּיהֶם
  choice: während der gezählten Tage ihres Lebens
  rationale: „Gezählt“ bewahrt das Motiv der begrenzten, zählbaren Lebenszeit, ohne die nicht ausdrücklich vorhandene Deutung „wenige“ einzutragen.
theological_decisions:
- issue: Bedeutung des Weinexperiments
  choice: Die schwierige Metapher bleibt als „meinen Leib mit Wein ziehen“ offen.
  alternative: meinen Leib mit Wein erquicken / mich dem Wein hingeben
  rationale: Der hebräische Ausdruck ist ungewöhnlich und kann körperlichen Genuss unter fortbestehender weiser Leitung beschreiben. Eine eindeutig positive oder negative moralische Deutung wäre stärker als der Ausgangstext.
- issue: Generischer Ausdruck בְנֵי הָאָדָם
  choice: für die Menschen
  alternative: für die Menschensöhne / für die Söhne Adams
  rationale: Gemeint sind Menschen allgemein. Die natürliche deutsche Wiedergabe bewahrt den universalen Bezug, ohne nur männliche Personen nahezulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst erhaltener Fremdheit an der schwierigen Weinwendung. Der Satzbau folgt dem tastenden Gedankengang des hebräischen Textes, wurde aber für deutsche Leser moderat gegliedert.
