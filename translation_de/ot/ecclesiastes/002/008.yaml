base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/008.yaml
  text: I also gathered for myself silver and gold[a], and the treasure of kings and provinces. I acquired for myself male singers and female singers[b], and the delights of the sons of man—a concubine and concubines.
translation:
  language: de
  text: 'Ich sammelte mir auch Silber und Gold und die Schätze von Königen und Provinzen. Ich beschaffte mir Sänger und Sängerinnen und die Freuden der Menschen: eine Konkubine und Konkubinen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Bedeutung des hebräischen Ausdrucks ist unsicher. Möglich sind auch: »eine Geliebte und mehrere Geliebte«, »ein Mundschenk und Mundschenkinnen« oder, allgemeiner, »Luxus jeder Art«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּנַסְתִּי לִי
  choice: Ich sammelte mir
  rationale: Das Verb bezeichnet das Zusammentragen oder Ansammeln; der Dativ לִי hebt hervor, dass dies dem eigenen Besitz und Genuss diente.
- source_word: כֶּסֶף וְזָהָב
  choice: Silber und Gold
  rationale: Die direkte und im Deutschen natürliche Wiedergabe der beiden Edelmetalle als Reichtum.
- source_word: סְגֻלַּת מְלָכִים וְהַמְּדִינוֹת
  choice: die Schätze von Königen und Provinzen
  rationale: סְגֻלָּה bezeichnet wertvollen Sonderbesitz oder einen Schatz; מְדִינוֹת meint Verwaltungsgebiete beziehungsweise Provinzen.
- source_word: עָשִׂיתִי לִי
  choice: Ich beschaffte mir
  rationale: Das weit gefasste עשה hat hier im Zusammenhang erworbener Güter und Vergnügungen idiomatisch den Sinn, sich etwas zu verschaffen.
- source_word: שָׁרִים וְשָׁרוֹת
  choice: Sänger und Sängerinnen
  rationale: Die parallelen maskulinen und femininen Formen bezeichnen ausdrücklich männliche und weibliche Singende.
- source_word: תַעֲנוּגֹת בְּנֵי הָאָדָם
  choice: die Freuden der Menschen
  rationale: תַעֲנוּגֹת bezeichnet Freuden, Genüsse oder Luxus; die deutsche Wendung gibt den generischen Sinn von בְּנֵי הָאָדָם natürlich wieder.
- source_word: שִׁדָּה וְשִׁדּוֹת
  choice: eine Konkubine und Konkubinen
  rationale: Die seltene und unsichere Wendung wird nach einer traditionsreichen, im Kontext königlicher Genüsse plausiblen Deutung wiedergegeben; die erhebliche lexikalische Unsicherheit wird ausdrücklich angemerkt.
theological_decisions:
- issue: Wiedergabe von בְּנֵי הָאָדָם
  choice: der Menschen
  alternative: der Menschensöhne
  rationale: Die hebräische Form ist wörtlich maskulin, fungiert hier jedoch generisch. „Der Menschen“ ist im modernen Deutschen natürlich und bewahrt den umfassenden Bezug, ohne eine ausschließlich männliche Gruppe nahezulegen.
- issue: Deutung von שִׁדָּה וְשִׁדּוֹת
  choice: eine Konkubine und Konkubinen
  alternative: eine Geliebte und Geliebte; männliche und weibliche Mundschenken; Luxus jeder Art
  rationale: Die Bedeutung des nur hier belegten beziehungsweise äußerst seltenen Ausdrucks ist nicht sicher. Der Haupttext folgt einer im Kontext menschlicher und königlicher Genüsse plausiblen sexuellen beziehungsweise harembezogenen Deutung, ohne die Alternativen in der Fußnote zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung der Ich-Perspektive und der selbstbezogene Dativ bleiben erhalten. Die unklare Schlusswendung wird nicht geglättet, sondern im Haupttext plausibel übersetzt und in einer Fußnote als unsicher ausgewiesen.
