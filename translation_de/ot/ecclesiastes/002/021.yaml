  text: כִּי יֵ֣שׁ אָדָ֗ם שֶׁ/עֲמָל֛/וֹ בְּ/חָכְמָ֥ה וּ/בְ/דַ֖עַת וּ/בְ/כִשְׁר֑וֹן וּ/לְ/אָדָ֞ם שֶׁ/לֹּ֤א עָֽמַל בּ/וֹ֙ יִתְּנֶ֣/נּוּ חֶלְק֔/וֹ גַּם זֶ֥ה הֶ֖בֶל וְ/רָעָ֥ה רַבָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/021.yaml
  text: For there is a man whose labor is with wisdom and with knowledge and with skill[a], yet he must give his portion to a man who has not labored in it[b]. This also is vapor and a great evil.
translation:
  language: de
  text: Denn es gibt einen Menschen, der sich mit Weisheit, Erkenntnis und Geschick abgemüht[a] hat; einem Menschen aber, der sich nicht daran abgemüht hat, muss er seinen Anteil überlassen. Auch das ist Dunst[b] und ein großes Übel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mühsal“. Das hebräische Wort עָמָל bezeichnet bei Kohelet häufig beschwerliche, ermüdende Arbeit.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionell auch: „Nichtigkeit“. Das hebräische הֶבֶל bedeutet wörtlich „Hauch“ oder „Dunst“ und kann Flüchtigkeit, Unfassbarkeit oder Vergeblichkeit ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung der vorausgehenden Betrachtung ein und entspricht dem argumentativen Zusammenhang.
- source_word: יֵשׁ אָדָם
  choice: da ist ein Mensch
  rationale: Gibt die hebräische Existenzformel und den einzelnen, beispielhaft betrachteten Menschen natürlich wieder, ohne das grammatische Geschlecht im Deutschen unnötig hervorzuheben.
- source_word: עֲמָלוֹ
  choice: seine Mühe
  rationale: Bewahrt den für Kohelet wichtigen Gedanken an anstrengende, beschwerliche Arbeit; die Alternative „Mühsal“ wird in der Fußnote genannt.
- source_word: בְּחָכְמָה וּבְדַעַת וּבְכִשְׁרוֹן
  choice: von Weisheit, Erkenntnis und Geschick geprägt
  rationale: Gibt die dreigliedrige Reihe und die modale Bedeutung der Präpositionen in natürlichem Deutsch wieder. „Geschick“ bezeichnet hier Fähigkeit oder Tüchtigkeit, nicht zwingend erzielten Erfolg.
- source_word: וּלְאָדָם שֶׁלֹּא עָמַל בּוֹ
  choice: doch einem Menschen, der sich nicht darum bemüht hat
  rationale: Erhält den Gegensatz zwischen dem Arbeitenden und dem Empfänger. „Darum“ lässt den Bezug von בּוֹ auf die Arbeit beziehungsweise ihren Ertrag offen.
- source_word: יִתְּנֶנּוּ חֶלְקוֹ
  choice: muss er seinen Anteil überlassen
  rationale: Drückt die im Zusammenhang beklagte Unausweichlichkeit aus; „Anteil“ bewahrt das in Kohelet wiederkehrende Motiv des einem Menschen zufallenden Anteils.
- source_word: גַּם זֶה הֶבֶל
  choice: Auch das ist Dunst
  rationale: „Dunst“ bewahrt das konkrete Bild von etwas Flüchtigem und Unfassbarem, ohne הֶבֶל auf Stolz oder bloße Sinnlosigkeit zu verengen.
- source_word: וְרָעָה רַבָּה
  choice: und ein großes Übel
  rationale: Bewahrt die starke negative Wertung und lässt offen, ob besonders moralisches Unrecht, schweres Unglück oder umfassende Schlechtigkeit gemeint ist.
theological_decisions:
- issue: Wiedergabe des Leitworts הֶבֶל
  choice: Dunst
  alternative: Nichtigkeit; Vergänglichkeit
  rationale: Das konkrete hebräische Bild bleibt hörbar und trägt zugleich die Spannung zwischen Flüchtigkeit, Unfassbarkeit und möglicher Vergeblichkeit.
- issue: Bedeutungsumfang von רָעָה
  choice: Übel
  alternative: Unglück; schlimme Sache
  rationale: „Übel“ erhält die moralisch-existenzielle Mehrdeutigkeit des Ausdrucks, statt ihn ausschließlich als Schuld oder als äußeres Missgeschick festzulegen.
- issue: Generische Einzelperson אָדָם
  choice: Mensch
  alternative: Mann
  rationale: אָדָם bezeichnet hier einen einzelnen Menschen als Beispiel. Das deutsche „Mensch“ gibt den Referenten präzise wieder, ohne eine im Kontext nicht hervorgehobene männliche Identität einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt der gedanklichen Gegenüberstellung des Hebräischen, wird aber für gute Lesbarkeit in zwei Hauptsätze gegliedert. Die Schlüsselbegriffe „Anteil“, „Dunst“ und „Übel“ bleiben bewusst knapp und theologisch nicht vereindeutigt.
