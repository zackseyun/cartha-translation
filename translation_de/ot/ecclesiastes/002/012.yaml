  source_fidelity: 'Die Grundbedeutung wird zutreffend wiedergegeben: Kohelet wendet sich der Untersuchung von Weisheit, Wahnsinn und Torheit zu, und die rhetorische Frage begrenzt den nachfolgenden Menschen gegenüber dem König. Die Schlussklausel ist im Hebräischen jedoch grammatisch und semantisch schwierig; die Übersetzung sollte den pluralischen, unbestimmten Handelnden nicht als deutsches generisches Singular-„man“ ausgeben und die Deutung als Passiv im Haupttext klar als kontextuelle Lesart kenntlich machen.'
  naturalness: „Da wandte ich mich der Betrachtung von … zu“ ist verständlich, aber schwerfällig. „Dann wandte ich mich dazu, … zu betrachten“ ist modernes, würdiges Standarddeutsch und näher an der hebräischen Infinitivkonstruktion. Die Frage mit „kann“ ist idiomatisch und gibt die elliptische rhetorische Funktion angemessen wieder.
