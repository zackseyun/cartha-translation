  text: וּ/פָנִ֤יתִֽי אֲנִי֙ לִ/רְא֣וֹת חָכְמָ֔ה וְ/הוֹלֵל֖וֹת וְ/סִכְל֑וּת כִּ֣י מֶ֣ה הָ/אָדָ֗ם שֶׁ/יָּבוֹא֙ אַחֲרֵ֣י הַ/מֶּ֔לֶךְ אֵ֥ת אֲשֶׁר כְּבָ֖ר עָשֽׂוּ/הוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/012.yaml
  text: So I turned to consider wisdom[a], madness, and folly; for what can the man do who comes after the king? Only what has already been done.
translation:
  language: de
  text: Dann wandte ich mich dazu, Weisheit, Wahnsinn und Torheit zu betrachten. Denn was kann der Mensch tun, der nach dem König kommt? Nur das, was bereits getan worden ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Schlussklausel ist schwer verständlich; wörtlich enthält sie etwa: „was sie ihn/es bereits getan haben“. Die Form ist im Deutschen nicht glatt wiederzugeben. Möglich ist auch: „nur das, was bereits getan worden ist“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּפָנִיתִי
  choice: Da wandte ich mich … zu
  rationale: פנה bezeichnet hier den Übergang zu einem neuen Gegenstand der Untersuchung. Die deutsche Wendung ist natürlich und bewahrt diese gedankliche Bewegung.
- source_word: לִרְאוֹת
  choice: der Betrachtung
  rationale: ראה bedeutet wörtlich „sehen“, bezeichnet bei abstrakten Gegenständen aber auch prüfendes Betrachten oder Untersuchen.
- source_word: חָכְמָה
  choice: Weisheit
  rationale: Die übliche und kontextgerechte Wiedergabe für praktische und geistige Einsicht.
- source_word: הוֹלֵלוֹת
  choice: Wahnsinn
  rationale: Das Wort bezeichnet hier irrationales oder ungezügeltes Verhalten und bildet einen scharfen Gegensatz zur Weisheit.
- source_word: סִכְלוּת
  choice: Torheit
  rationale: Die traditionelle, würdevolle und weiterhin verständliche Wiedergabe für törichtes Denken und Handeln.
- source_word: מֶה הָאָדָם שֶׁיָּבוֹא אַחֲרֵי הַמֶּלֶךְ
  choice: was wird der Mensch tun, der nach dem König kommt?
  rationale: Das elliptische מֶה wird dem Zusammenhang entsprechend als Frage nach dem möglichen Tun des Nachfolgers entfaltet. Das futurische Verb wird mit „wird … tun/kommt“ sinngemäß wiedergegeben.
- source_word: אֵת אֲשֶׁר כְּבָר עָשׂוּהוּ
  choice: Nur das, was man schon getan hat
  rationale: Die stark komprimierte Schlusswendung wird im wahrscheinlichen kontextuellen Sinn wiedergegeben, ohne den unbestimmten Handelnden näher festzulegen; ihre grammatische Schwierigkeit bleibt in einer Fußnote sichtbar.
theological_decisions:
- issue: Bedeutung von הָאָדָם in der rhetorischen Frage
  choice: der Mensch
  alternative: ein Mensch; der Mann
  rationale: Gemeint ist ein einzelner menschlicher Nachfolger des Königs. „Der Mensch“ wahrt den bestimmten Singular und lässt zugleich die allgemein-repräsentative Aussage bestehen, ohne unnötig ein männliches Geschlecht des Nachfolgers zu betonen.
- issue: Deutung der Schlussklausel
  choice: Nur das, was man schon getan hat
  alternative: das, was sie ihm bereits angetan haben; das, was bereits getan worden ist
  rationale: Der Kontext legt die Begrenztheit des späteren Nachfolgers nahe. Weil Verbform und Suffix grammatisch auffällig und mehrdeutig sind, wird die wahrscheinlichste Lesart im Text geboten und die Unsicherheit ausdrücklich angemerkt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Torheit“ bleibt als präziser und im biblischen Weisheitskontext geläufiger Begriff erhalten; Satzbau und Wortwahl sind ansonsten gegenwärtig und gut verständlich.
