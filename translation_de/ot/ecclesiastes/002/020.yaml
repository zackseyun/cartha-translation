  text: So I turned to despair in my heart over all the labor at which I had labored under the sun[a][b].
translation:
  language: de
  text: Da wandte ich mich dazu, mein Herz über all die Mühe verzagen zu lassen, mit der ich mich unter der Sonne abgemüht hatte[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Da gab ich mein Herz angesichts all der Mühe der Verzweiflung preis“; auch: „Da wandte ich mich dazu, in meinem Herzen aufzugeben.“ Die hebräische Wendung ist knapp: Wörtlich ist das eigene Herz das Objekt dessen, was der Sprecher verzweifeln oder verzagen lässt.'
    reason: lexical_alternative
  - marker: b
    text: „Unter der Sonne“ ist eine wiederkehrende Wendung in Kohelet für das Leben in der gegenwärtigen Welt und in seinem irdischen Bereich.
    reason: cross_reference
lexical_decisions:
- source_word: וְסַבּוֹתִי
  choice: Da wandte ich mich um
  rationale: Das Qal Perfekt von סבב bezeichnet hier einen Wechsel der inneren Richtung oder Haltung. „Ich wandte mich um“ bewahrt das Bewegungsbild, ohne die folgende Reaktion lediglich mit „ich begann“ wiederzugeben.
- source_word: לְיַאֵשׁ אֶת־לִבִּי
  choice: und verzweifelte in meinem Herzen
  rationale: Die kompakte Konstruktion bedeutet wörtlich etwa, das eigene Herz verzagen oder verzweifeln zu lassen. Die idiomatische deutsche Fassung bewahrt sowohl die Verzweiflung als auch das Herz als Sitz des inneren Erlebens, ohne den Sinn künstlich auf den Verstand zu verengen.
- source_word: עַל כָּל הֶעָמָל
  choice: an all der Mühe
  rationale: עָמָל bezeichnet in Kohelet belastende, mühevolle Arbeit. Die Verbindung „an etwas verzweifeln“ ist im Deutschen natürlich; „Mühe“ bewahrt zugleich den belastenden Charakter des Ausdrucks.
- source_word: שֶׁעָמַלְתִּי
  choice: mit der ich mich … abgemüht hatte
  rationale: Die Wiedergabe mit „Mühe“ und „abgemüht“ erhält die im Hebräischen beabsichtigte Wiederholung von Substantiv und stammverwandtem Verb. Das Plusquamperfekt macht den Rückblick auf die bereits geleistete Arbeit deutlich.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: unter der Sonne
  rationale: Diese feste, wiederkehrende Wendung in Kohelet wird wörtlich und konsistent wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die stammverwandte Wiederholung von עָמָל und עמל wird durch „Mühe“ und „abgemüht“ hörbar gemacht. Die etwas ungewöhnliche Verbindung von innerer Wendung und Verzweiflung bleibt erhalten, wird jedoch idiomatisch formuliert.
