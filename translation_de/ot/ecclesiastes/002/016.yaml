base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/016.yaml
  text: For there is no lasting remembrance of the wise man any more than of the fool[a], since in the days to come everything will already have been forgotten[b]. And how the wise man dies just like the fool!
translation:
  language: de
  text: Denn die Erinnerung an den Weisen bleibt ebenso wenig dauerhaft wie die an den Toren[a], weil in den kommenden Tagen alles längst vergessen sein wird. Und wie doch der Weise genauso stirbt wie der Tor![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Denn es gibt für immer keine Erinnerung an den Weisen mit dem Toren.“ Gemeint ist, dass die Erinnerung weder an den Weisen noch an den Toren dauerhaft bleibt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Und wie stirbt der Weise mit dem Toren!“ Die Formulierung ist wahrscheinlich ein Ausruf des Erschreckens darüber, dass der Weise ebenso stirbt wie der Tor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זִכְרוֹן
  choice: an ... denken
  rationale: Das Substantiv bezeichnet Erinnerung bzw. fortdauerndes Gedenken. Die verbale deutsche Wendung ist natürlich und bewahrt den Gedanken, dass beide dem Vergessen anheimfallen.
- source_word: לֶחָכָם / הֶחָכָם
  choice: der Weise / den Weisen
  rationale: Das substantivierte Adjektiv ist im Hebräischen maskulin Singular; die deutsche substantivierte Form entspricht dem knapp und genau.
- source_word: עִם הַכְּסִיל
  choice: ebenso wenig ... wie / genauso wie
  rationale: עִם bedeutet wörtlich „mit“, bezeichnet hier aber die Gleichheit im Erinnertwerden und im Tod. Die deutsche Vergleichsform macht diesen Zusammenhang idiomatisch deutlich.
- source_word: לְעוֹלָם
  choice: für immer
  rationale: Die Wendung wird ausdrücklich wiedergegeben und bezeichnet hier ein dauerhaftes Gedenken, nicht notwendig eine metaphysische Aussage über die Ewigkeit.
- source_word: בְּשֶׁכְּבָר
  choice: weil ... längst
  rationale: Die Wiedergabe verteilt die kausale und die bereits eingetretene zeitliche Nuance der komprimierten hebräischen Konstruktion natürlich auf den deutschen Satz.
- source_word: הַיָּמִים הַבָּאִים
  choice: in den kommenden Tagen
  rationale: Dies bewahrt die vorwärtsgerichtete zeitliche Perspektive in geläufigem Deutsch.
- source_word: הַכֹּל נִשְׁכָּח
  choice: alles längst vergessen sein wird
  rationale: Das passive Niphal und der Zukunftsbezug werden bewahrt; zusammen mit „längst“ gibt das Futur die Vorstellung wieder, dass dann bereits alles vergessen sein wird.
- source_word: וְאֵיךְ
  choice: Und doch ...!
  rationale: Die Konstruktion ist wahrscheinlich ausrufend und beklagt die gleiche Todeswirklichkeit von Weisem und Toren. „Und doch“ gibt diese bestürzte Spannung natürlich wieder; die formale Alternative wird in der Fußnote genannt.
- source_word: יָמוּת
  choice: stirbt
  rationale: Das Präsens gibt die allgemeingültige Feststellung über die Sterblichkeit im Deutschen natürlich wieder.
theological_decisions:
- issue: Gleiches Todesgeschick von Weisheit und Torheit
  choice: Die Aussage bleibt eine beklagende Beobachtung, dass der Weise ebenso stirbt wie der Tor.
  alternative: Sie als Leugnung jedes Werts der Weisheit oder jeder jenseitigen Unterscheidung auszulegen.
  rationale: Der Vers beschreibt das gemeinsame Sterben und Vergessenwerden innerhalb des Gedankengangs, entscheidet aber keine weitergehende theologische Frage ausdrücklich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die substantivierten Bezeichnungen „der Weise“ und „der Tor“ bewahren den repräsentativen maskulinen Singular. Der Satzbau ist idiomatisch, während die hebräische Ambiguität von וְאֵיךְ in einer Fußnote sichtbar bleibt.
