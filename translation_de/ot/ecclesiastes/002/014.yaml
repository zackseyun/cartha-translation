source:
  edition: WLC
  text: הֶֽ/חָכָם֙ עֵינָ֣י/ו בְּ/רֹאשׁ֔/וֹ וְ/הַ/כְּסִ֖יל בַּ/חֹ֣שֶׁךְ הוֹלֵ֑ךְ וְ/יָדַ֣עְתִּי גַם אָ֔נִי שֶׁ/מִּקְרֶ֥ה אֶחָ֖ד יִקְרֶ֥ה אֶת כֻּלָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/014.yaml
  text: The wise man has his eyes in his head[a], but the fool walks in darkness. Yet I also knew that one fate happens to them all.
translation:
  language: de
  text: Der Weise hat seine Augen im Kopf, aber der Narr geht in der Finsternis. Doch ich erkannte auch, dass sie alle dasselbe Schicksal[a] trifft.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass ein und dasselbe Ereignis sie alle trifft“. Das hebräische Wort מִקְרֶה bezeichnet das, was jemandem widerfährt, und kann je nach Zusammenhang „Ereignis“, „Geschick“ oder „Schicksal“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחָכָם
  choice: der Weise
  rationale: Das substantivierte Adjektiv bezeichnet einen weisen Menschen und bewahrt die grammatisch maskuline Singularform sowie den Gegensatz zum Narren.
- source_word: עֵינָיו בְּרֹאשׁוֹ
  choice: hat seine Augen im Kopf
  rationale: Die konkrete hebräische Bildsprache bleibt erhalten; sie beschreibt die Wahrnehmungs- und Orientierungsfähigkeit des Weisen, ohne das Bild durch eine Erklärung wie „sieht klar“ zu ersetzen.
- source_word: וְהַכְּסִיל
  choice: aber der Narr
  rationale: Das ו verbindet hier gegensätzliche Aussagen; „aber“ gibt diesen Kontrast im Deutschen natürlich wieder.
- source_word: בַּחֹשֶׁךְ הוֹלֵךְ
  choice: geht in der Finsternis
  rationale: Die Wendung bewahrt das Bild des Gehens in Dunkelheit und legt nicht fest, ob diese geistig, moralisch oder als mangelnde Orientierung zu verstehen ist.
- source_word: וְיָדַעְתִּי גַם אֲנִי
  choice: Doch ich erkannte auch
  rationale: '„Doch“ kennzeichnet die überraschende Gegenbewegung: Trotz des Vorteils der Weisheit folgt eine beide Gruppen gleichstellende Einsicht. „Auch“ gibt גַם wieder, während die erste Person das betonte אֲנִי aufnimmt.'
- source_word: שֶׁמִּקְרֶה אֶחָד
  choice: dasselbe Schicksal
  rationale: מִקְרֶה bezeichnet das, was jemandem widerfährt. „Dasselbe Schicksal“ gibt idiomatisch wieder, dass Weiser und Narr von einem gemeinsamen Ausgang betroffen sind, ohne diesen schon im Vers ausdrücklich als Tod zu benennen.
- source_word: יִקְרֶה אֶת כֻּלָּם
  choice: sie alle trifft
  rationale: קרה kann „geschehen“ oder „widerfahren“ bedeuten. Mit „trifft“ entsteht eine natürliche deutsche Verbindung zu „Schicksal“, und der umfassende Sinn von כֻּלָּם bleibt erhalten.
theological_decisions:
- issue: Bestimmung des gemeinsamen Schicksals
  choice: Das gemeinsame Schicksal wird in diesem Vers nicht ausdrücklich als Tod bezeichnet.
  alternative: „dass sie alle derselbe Tod ereilt“
  rationale: Der weitere Zusammenhang legt den Tod als gemeinten gemeinsamen Ausgang nahe, doch מִקְרֶה bleibt hier lexikalisch weiter. Die Übersetzung bewahrt diese Offenheit und nimmt die folgende Auslegung nicht vorweg.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die anschaulichen Gegenbilder „Augen im Kopf“ und „in der Finsternis gehen“ bleiben erhalten; die abschließende Aussage ist idiomatisch formuliert, ohne ihre inhaltliche Offenheit zu beseitigen.
