  yaml_path: translation/ot/ecclesiastes/002/013.yaml
  text: And I saw that wisdom has an advantage over folly[a], as light has an advantage over darkness.
translation:
  language: de
  text: Und ich selbst sah, dass die Weisheit einen Vorzug vor der Torheit[a] hat, ebenso wie das Licht einen Vorzug vor der Finsternis hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen Gewinn gegenüber der Torheit“. Das hebräische Wort kann Überschuss, Gewinn, Vorteil oder Vorzug bezeichnen; hier geht es um die Überlegenheit der Weisheit gegenüber der Torheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאִיתִי אָ֔נִי
  choice: Und ich sah
  rationale: Das Qal Perfekt von ראה bezeichnet die eigene Wahrnehmung des Sprechers. Das selbstständige Pronomen אָ֔נִי hebt das Ich hervor; im Deutschen würde „ich selbst“ hier jedoch unnötig schwer wirken. Das ausdrücklich gesetzte „ich“ bewahrt den persönlichen Beobachtungston.
- source_word: שֶׁיֵּ֥שׁ יִתְר֛וֹן לַֽחָכְמָ֖ה
  choice: dass die Weisheit einen Vorzug … hat
  rationale: Die hebräische Existenzkonstruktion mit יֵשׁ und ל wird im Deutschen natürlich als Besitzkonstruktion wiedergegeben. יִתְרוֹן bezeichnet einen Überschuss, Gewinn oder Vorzug; im qualitativen Vergleich passt „Vorzug“ am besten.
- source_word: מִן הַסִּכְל֑וּת
  choice: vor der Torheit
  rationale: Das komparative מִן bezeichnet hier die Überlegenheit der Weisheit gegenüber der סִכְלוּת. „Torheit“ ist prägnant und entspricht dem würdevollen Weisheitsstil.
- source_word: כִּֽיתְר֥וֹן הָ/א֖וֹר מִן הַ/חֹֽשֶׁךְ
  choice: so wie das Licht vor der Finsternis
  rationale: כְּ leitet die Analogie ein. Im Deutschen kann „einen Vorzug … hat“ im zweiten Glied elliptisch ausgelassen werden; „vor der Finsternis“ nimmt die Vergleichsstruktur klar und natürlich wieder auf.
theological_decisions:
- issue: Bedeutungsumfang von יִתְרוֹן im Buch Kohelet
  choice: Vorzug
  alternative: Gewinn; Vorteil
  rationale: Der Zusammenhang stellt Weisheit und Torheit durch die Analogie von Licht und Finsternis qualitativ gegenüber. „Vorzug“ bewahrt die Vorstellung des Überlegenseins, ohne den Ausdruck unnötig auf wirtschaftlichen Gewinn einzuengen.
- issue: Mögliche symbolische Bedeutung von Licht und Finsternis
  choice: Die Begriffe werden ohne theologische Ausdeutung direkt als „Licht“ und „Finsternis“ wiedergegeben.
  alternative: Eine ausdrücklich moralische oder heilsgeschichtliche Deutung
  rationale: Der Vers nutzt zunächst einen allgemein verständlichen Vergleich. Die Übersetzung soll keine weitergehende Symbolik festlegen, die der hebräische Wortlaut hier nicht ausdrücklich benennt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Weisheitston. Die knappe Parallelität des Hebräischen bleibt durch die Ellipse im zweiten Vergleichsglied erhalten.
