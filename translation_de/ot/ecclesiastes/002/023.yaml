source:
  edition: WLC
  text: כִּ֧י כָל יָמָ֣י/ו מַכְאֹבִ֗ים וָ/כַ֨עַס֙ עִנְיָנ֔/וֹ גַּם בַּ/לַּ֖יְלָה לֹא שָׁכַ֣ב לִבּ֑/וֹ גַּם זֶ֖ה הֶ֥בֶל הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/023.yaml
  text: For all his days are pains[a], and his occupation is vexation; even in the night his heart does not lie down[b]. This too is vapor.
translation:
  language: de
  text: Denn alle seine Tage sind voller Schmerzen, und seine Beschäftigung bringt Verdruss; selbst in der Nacht kommt sein Herz nicht zur Ruhe. Auch das ist Dunst.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Hauch«, »Nichtigkeit«. Das hebräische Wort הֶבֶל bezeichnet wörtlich etwas wie Atem oder Dunst und kann Vergänglichkeit, Unfassbarkeit oder Vergeblichkeit ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aussage ein und entspricht dem Zusammenhang natürlich.
- source_word: כָל יָמָיו מַכְאֹבִים
  choice: alle seine Tage sind voller Schmerzen
  rationale: Bewahrt die konkrete Zeitangabe und gibt die nominale hebräische Wendung in natürlichem Deutsch wieder.
- source_word: וָכַעַס עִנְיָנוֹ
  choice: seine Beschäftigung bringt Verdruss
  rationale: עִנְיָן bezeichnet Aufgabe oder Beschäftigung; כַּעַס meint hier inneren Verdruss beziehungsweise Frustration. Die verbale Fassung macht das Verhältnis im Deutschen verständlich, ohne es auf körperliche Arbeit zu verengen.
- source_word: גַּם בַּלַּיְלָה
  choice: selbst in der Nacht
  rationale: Gibt die steigernde Kraft von גַּם und die Zeitangabe idiomatisch wieder.
- source_word: לֹא שָׁכַב לִבּוֹ
  choice: kommt sein Herz nicht zur Ruhe
  rationale: Gibt das wörtliche Bild ‚sein Herz legt sich nicht nieder‘ verständlich wieder und bewahrt ‚Herz‘ als Sitz des inneren Lebens.
- source_word: גַּם זֶה
  choice: Auch das
  rationale: Bewahrt die wiederkehrende additive Formel des Buches.
- source_word: הֶבֶל
  choice: Dunst
  rationale: Bewahrt das Leitbild von etwas Flüchtigem und Ungreifbarem, ohne es vorschnell nur als Sinnlosigkeit auszulegen.
theological_decisions:
- issue: Bedeutung von הֶבֶל
  choice: Dunst
  alternative: Nichtigkeit; Hauch; vergeblich
  rationale: Die konkrete Metapher bleibt erhalten und lässt die im Buch mitschwingenden Bedeutungen Vergänglichkeit, Unfassbarkeit und Vergeblichkeit offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche hebräische Wendung vom Herzen, das sich nicht niederlegt, wird idiomatisch als fehlende innere Ruhe wiedergegeben; die Leitmetapher הֶבֶל bleibt mit »Dunst« konkret und deutungsoffen.
