base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/017.yaml
  text: So I hated life[a], because the work that is done under the sun was grievous to me[b]; for everything is vapor and a chasing after wind.
translation:
  language: de
  text: Da hasste ich das Leben, denn das Geschehen unter der Sonne war mir zuwider; denn alles ist Hauch[a] und ein Haschen nach Wind[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Dunst oder Nichtigkeit. Das hebräische Wort hevel bezeichnet etwas Flüchtiges, Unbeständiges oder schwer Fassbares.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: ein Mühen um Wind; wörtlich möglicherweise auch: ein Hüten von Wind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׂנֵאתִי
  choice: So hasste ich
  rationale: Das Qal Perfekt 1. Person Singular bezeichnet die entschiedene Reaktion des Sprechers. „So“ gibt den folgernden Fortgang des Gedankens natürlicher wieder als ein rein anreihendes „und“.
- source_word: הַחַיִּים
  choice: das Leben
  rationale: Die morphologische Pluralform חַיִּים bezeichnet idiomatisch das Leben und ist hier das Objekt des Hassens.
- source_word: רַע עָלַי
  choice: war mir zuwider
  rationale: Die Wendung bedeutet wörtlich etwa „war schlecht/böse über mir“, beschreibt hier aber die bedrückende, stark negative Erfahrung des Sprechers. „War mir zuwider“ ist natürliches Deutsch und bewahrt die persönliche Abneigung.
- source_word: הַמַּעֲשֶׂה שֶׁנַּעֲשָׂה
  choice: das Tun, das … getan wird
  rationale: Das Substantiv bezeichnet menschliche Tätigkeit in kollektivem Sinn; das Nifal beschreibt allgemein das, was geschieht beziehungsweise getan wird. Die bewusste Wiederholung wahrt die hebräische Wortverbindung.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: unter der Sonne
  rationale: Die für Kohelet charakteristische Wendung bezeichnet den irdischen Lebensbereich und wird in ihrer vertrauten Bildform bewahrt.
- source_word: הַכֹּל
  choice: alles
  rationale: „Alles“ gibt den umfassenden Geltungsanspruch des Ausdrucks knapp und idiomatisch wieder.
- source_word: הֶבֶל
  choice: Dunst
  rationale: Das Wort bezeichnet konkret Hauch oder Dunst und entfaltet bei Kohelet Bedeutungen wie Flüchtigkeit, Unbeständigkeit und Unfassbarkeit. „Dunst“ erhält das Bild, ohne es auf bloße Sinnlosigkeit zu verengen.
- source_word: וּרְעוּת רוּחַ
  choice: und ein Haschen nach Wind
  rationale: Die bildhafte Wendung beschreibt das vergebliche Greifen oder Streben nach etwas Unfassbarem. „Haschen nach Wind“ ist im Deutschen anschaulich und würdevoll; eine alternative Deutung als Mühen um oder Hüten von Wind wird in der Fußnote offengehalten.
theological_decisions:
- issue: Bedeutungsbreite von הֶבֶל
  choice: Dunst
  alternative: Hauch; Nichtigkeit
  rationale: Die konkrete Metapher bleibt erhalten und lässt die bei Kohelet beabsichtigte Spannung zwischen Flüchtigkeit, Unfassbarkeit und Vergeblichkeit bestehen, statt sie vorschnell als abstrakte „Sinnlosigkeit“ festzulegen.
- issue: Deutung von רְעוּת רוּחַ
  choice: Haschen nach Wind
  alternative: Mühen um Wind; Hüten von Wind
  rationale: Die gewählte Fassung vermittelt das Bild eines unerreichbaren Ziels, während die Fußnote die lexikalische Unsicherheit der ungewöhnlichen Wendung sichtbar macht.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Satzbau. Die charakteristischen Bilder „unter der Sonne“, „Dunst“ und „Haschen nach Wind“ bleiben erhalten. Die Fußnotenmarker stehen jeweils unmittelbar bei dem Ausdruck, den sie erläutern.
