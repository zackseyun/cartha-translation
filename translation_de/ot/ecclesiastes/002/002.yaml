  text: לִ/שְׂח֖וֹק אָמַ֣רְתִּי מְהוֹלָ֑ל וּ/לְ/שִׂמְחָ֖ה מַה זֹּ֥ה עֹשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/002.yaml
  text: I said of laughter[a], “It is madness,” and of pleasure, “What does this accomplish?”
translation:
  language: de
  text: 'Über das Lachen sagte ich: »Es ist Wahnsinn!«, und über die Freude: »Was bewirkt sie?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִשְׂחוֹק
  choice: über das Lachen
  rationale: שְׂחוֹק bezeichnet Lachen oder Ausgelassenheit; ל markiert hier bei אמר idiomatisch das, worüber gesprochen wird.
- source_word: אָמַרְתִּי
  choice: sagte ich
  rationale: Das Qal Perfekt 1. Person Singular bedeutet schlicht „ich sagte“. Ein ergänztes „zu mir selbst“ wäre kontextuell möglich, steht aber nicht ausdrücklich im Vers.
- source_word: מְהוֹלָל
  choice: Es ist Wahnsinn
  rationale: Das Wort bezeichnet hier etwas Törichtes, Irrationales oder Wahnsinniges. Die substantivische Wiedergabe ist im Deutschen als Urteil über „das Lachen“ natürlich und bewahrt die Schärfe des Ausdrucks.
- source_word: וּלְשִׂמְחָה
  choice: und über die Freude
  rationale: שִׂמְחָה kann Freude, Fröhlichkeit oder Vergnügen bedeuten. „Freude“ ist die direkte, breite Wiedergabe und vermeidet eine unnötige Verengung auf bloßen Genuss.
- source_word: מַה זֹּה עֹשָׂה
  choice: Was bewirkt sie?
  rationale: Wörtlich etwa „Was tut diese?“. Im rhetorisch-evaluativen Zusammenhang fragt der Satz nach Wirkung oder Ertrag; „bewirken“ gibt dies in natürlichem Deutsch wieder. Das feminine Pronomen nimmt „Freude“ auf.
