base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/001.yaml
  text: I said in my heart[a], “Come now, I will test you with pleasure; so enjoy what is good.” But look[c][b], this too is vapor.
translation:
  language: de
  text: 'Ich sagte mir im Herzen: »Komm doch, ich will dich durch Freude auf die Probe stellen; genieße das Gute!« Doch sieh: Auch das ist Dunst.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Hauch«, »Nichtigkeit«. Das hebräische Wort bezeichnet wörtlich etwas wie Atem oder Dunst und ist in Kohelet ein wiederkehrendes Bild für das Flüchtige, Unfassbare oder Substanzlose.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתִּי אֲנִי בְּלִבִּי
  choice: Ich sagte mir in meinem Herzen
  rationale: Bewahrt das hebräische Herz-Motiv als Ort innerer Selbstansprache; das reflexive „mir“ macht den deutschen Satz natürlich, ohne die Metapher aufzulösen.
- source_word: לְכָה נָּא
  choice: Wohlan
  rationale: Gibt die auffordernde Selbstansprache knapp und in einem würdigen, noch verständlichen Register wieder.
- source_word: אֲנַסְּכָה
  choice: ich will dich … auf die Probe stellen
  rationale: Das Verb נסה bezeichnet ein Prüfen oder Erproben; das „dich“ erhält die im Hebräischen angelegte Anrede an das eigene Herz beziehungsweise Selbst.
- source_word: בְשִׂמְחָה
  choice: mit Freude
  rationale: שִׂמְחָה bezeichnet Freude, Fröhlichkeit oder Vergnügen. „Freude“ ist im Deutschen natürlich und lässt die genaue Färbung offen.
- source_word: וּרְאֵה בְטוֹב
  choice: genieße das Gute
  rationale: Das wörtliche „sieh das Gute“ ist hier eine hebräische Wendung für das Erfahren beziehungsweise Genießen des Guten; die idiomatische Wiedergabe vermittelt den Sinn klar.
- source_word: וְהִנֵּה
  choice: Doch siehe
  rationale: „Siehe“ bewahrt das aufmerksamkeitslenkende Signal von הִנֵּה; „doch“ verdeutlicht den im Zusammenhang gegebenen Gegensatz zum vorausgehenden Versuch.
- source_word: גַם הוּא
  choice: Auch das
  rationale: Verweist natürlich auf das unmittelbar zuvor beschriebene Erproben der Freude zurück.
- source_word: הָבֶל
  choice: Dunst
  rationale: „Dunst“ bewahrt die konkrete Metapher von etwas Flüchtigem, Unfassbarem und Substanzlosem, ohne sie vorschnell als „sinnlos“ auszudeuten.
theological_decisions:
- issue: Wiedergabe des Leitworts הָבֶל im Buch Kohelet
  choice: Dunst
  alternative: Nichtigkeit; Hauch; Sinnlosigkeit
  rationale: '„Dunst“ erhält die bildhafte und mehrdeutige Spannung des hebräischen Leitworts: Es kann Flüchtigkeit, Unfassbarkeit und mangelnde Beständigkeit nahelegen. „Sinnlosigkeit“ würde die Aussage auf eine einzelne Deutung verengen.'
- issue: Bedeutung von וּרְאֵה בְטוֹב
  choice: genieße das Gute
  alternative: sieh das Gute
  rationale: Die Wendung wird als hebräisches Erfahrungsidiom verstanden. Die deutsche Formulierung macht den gemeinten Genuss des Guten deutlich, ohne eine moralische Bewertung des Experiments einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Wohlan“ und „siehe“ markieren die rhetorische Selbstaufforderung und die überraschende Bilanz, ohne den Satz insgesamt zu archaisieren. Die Zeichensetzung macht deutlich, dass die direkte Rede vor der abschließenden Bewertung endet.
