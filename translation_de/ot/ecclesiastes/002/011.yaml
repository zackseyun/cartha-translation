  text: וּ/פָנִ֣יתִֽי אֲנִ֗י בְּ/כָל מַעֲשַׂ/י֙ שֶֽׁ/עָשׂ֣וּ יָדַ֔/י וּ/בֶֽ/עָמָ֖ל שֶׁ/עָמַ֣לְתִּי לַ/עֲשׂ֑וֹת וְ/הִנֵּ֨ה הַ/כֹּ֥ל הֶ֨בֶל֙ וּ/רְע֣וּת ר֔וּחַ וְ/אֵ֥ין יִתְר֖וֹן תַּ֥חַת הַ/שָּֽׁמֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/011.yaml
  text: Then I turned to consider all the works that my hands had done[a], and the labor that I had labored to do; and behold, all was vanity and a chasing after wind[c][b], and there was no profit under the sun.
translation:
  language: de
  text: 'Dann betrachtete ich all die Werke, die meine Hände vollbracht hatten, und die Mühe, mit der ich mich bei ihrer Ausführung abgemüht hatte. Und siehe: Alles war flüchtiger Dunst[a] und ein Haschen nach Wind[b]; es gab keinen Gewinn[c] unter der Sonne.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch »Hauch«; das hebräische hebel bezeichnet oft etwas Vergängliches, Unbeständiges oder nicht Greifbares.
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »ein Mühen um Wind« oder, näher am möglichen Grundbild, »ein Hüten des Windes«; gemeint ist ein vergebliches Bemühen.'
    reason: lexical_alternative
  - marker: c
    text: Auch »Vorteil«, »Ertrag« oder »Überschuss«.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָנִיתִי
  choice: Dann betrachtete ich
  rationale: פנה bezeichnet wörtlich eine Wendung; im Zusammenhang ist die Hinwendung zur prüfenden Betrachtung gemeint. Die deutsche Formulierung gibt diesen gedanklichen Übergang natürlich wieder.
- source_word: מַעֲשַׂי שֶׁעָשׂוּ יָדַי
  choice: all die Werke, die meine Hände vollbracht hatten
  rationale: Die konkrete Handmetapher und die Betonung eigener Tätigkeit bleiben erhalten; »vollbracht« ist im Deutschen bei Werken idiomatischer als eine formale Wiederholung von »machen«.
- source_word: וּבֶעָמָל שֶׁעָמַלְתִּי לַעֲשׂוֹת
  choice: und die Mühe, mit der ich mich bei ihrer Ausführung abgemüht hatte
  rationale: »Mühe« und »abgemüht« bewahren die hebräische Wiederholung des Wortstamms עמל. »Bei ihrer Ausführung« bezieht den Infinitiv natürlich auf die zuvor genannten Werke, ohne dessen Bedeutung enger als nötig festzulegen.
- source_word: וְהִנֵּה
  choice: Und siehe
  rationale: Die Wendung markiert die nachdrücklich präsentierte Erkenntnis. »Siehe« ist leicht gehoben, aber verständlich und dem würdevollen Register angemessen.
- source_word: הֶבֶל
  choice: flüchtiger Dunst
  rationale: הבל bezeichnet konkret Atem, Hauch oder Dunst und trägt im Buch zugleich die Vorstellungen von Vergänglichkeit, Unbeständigkeit und enttäuschender Unfassbarkeit. »Flüchtiger Dunst« bewahrt das Bild, ohne die Aussage vorschnell als völlige Sinnlosigkeit festzulegen.
- source_word: וּרְעוּת רוּחַ
  choice: und ein Haschen nach Wind
  rationale: Die Wendung zeichnet ein unmögliches, ergebnisloses Bemühen. »Haschen nach Wind« ist im heutigen Deutsch anschaulich und wahrt den idiomatischen Charakter; die lexikalisch mögliche Vorstellung des Hütens beziehungsweise Weidens wird in der Fußnote offengehalten.
- source_word: וְאֵין יִתְרוֹן
  choice: es gab keinen Gewinn
  rationale: יתרון bezeichnet Überschuss, Vorteil oder Ertrag. »Gewinn« passt zum bilanzierenden Ton des Abschnitts, ohne ihn auf Geldgewinn zu beschränken.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: unter der Sonne
  rationale: Die programmatische Wendung wird wörtlich und im Deutschen idiomatisch wiedergegeben.
theological_decisions:
- issue: Deutung des Leitworts הֶבֶל
  choice: flüchtiger Dunst
  alternative: Nichtigkeit; Sinnlosigkeit; Hauch
  rationale: Die bildhafte Wiedergabe hält Vergänglichkeit, Unfassbarkeit und Vergeblichkeit zusammen und vermeidet die stärkere, theologisch vorschnelle Behauptung, alles sei schlechthin sinnlos.
- issue: Bildgehalt von רְעוּת רוּחַ
  choice: ein Haschen nach Wind
  alternative: ein Mühen um Wind; ein Hüten des Windes
  rationale: Die gewählte Formulierung vermittelt die offensichtliche Vergeblichkeit, während die Fußnote die Unsicherheit über die genaue Ableitung und Bildnuance wahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht gehobene Formel »Und siehe« bewahrt die markierte Schlussfolgerung des Hebräischen. Die Stammwiederholung bei עמל wird durch »Mühe/abgemüht« aufgenommen; übermäßig altertümliche oder konfessionell geprägte Sprache wird vermieden.
