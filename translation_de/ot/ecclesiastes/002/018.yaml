source:
  edition: WLC
  text: וְ/שָׂנֵ֤אתִֽי אֲנִי֙ אֶת כָּל עֲמָלִ֔/י שֶׁ/אֲנִ֥י עָמֵ֖ל תַּ֣חַת הַ/שָּׁ֑מֶשׁ שֶׁ֣/אַנִּיחֶ֔/נּוּ לָ/אָדָ֖ם שֶׁ/יִּהְיֶ֥ה אַחֲרָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/018.yaml
  text: And I hated all my labor in which I toiled under the sun[a], because I must leave it to the man who will come after me.
translation:
  language: de
  text: Und ich hasste all meine Mühe, mit der ich mich unter der Sonne abmühte, denn ich werde sie dem Menschen[a] hinterlassen, der nach mir kommt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einem Menschen, der nach mir sein wird“.'
    reason: Der hebräische Ausdruck kann trotz des Artikels auf einen noch unbestimmten Nachfolger zielen; „nach mir sein wird“ gibt die Formulierung wörtlicher wieder.
lexical_decisions:
- source_word: וְשָׂנֵאתִי
  choice: Und ich hasste
  rationale: Das Qal-Perfekt der 1. Person Singular bezeichnet die entschiedene Reaktion des Sprechers. „Und“ bewahrt den Erzählzusammenhang, ohne die logische Beziehung stärker festzulegen.
- source_word: כָּל עֲמָלִי
  choice: all meine Mühe
  rationale: עָמָל bezeichnet belastende Arbeit oder Mühe und kann im Zusammenhang auch deren Ertrag einschließen. Die Wiedergabe bewahrt das für Kohelet charakteristische Leitwort und die Spannung, dass diese „Mühe“ einem Nachfolger hinterlassen wird.
- source_word: שֶׁאֲנִי עָמֵל
  choice: mit der ich mich … abmühte
  rationale: Die deutsche Wortfamilie „Mühe/abmühen“ bildet die Wiederholung derselben hebräischen Wurzel ab und klingt zugleich natürlich.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: unter der Sonne
  rationale: Die feste Wendung ist ein Leitmotiv des Buches und bezeichnet den irdischen Lebensbereich.
- source_word: שֶׁאַנִּיחֶנּוּ
  choice: denn ich werde sie … hinterlassen
  rationale: Das Hifil von נוח bedeutet hier „zurücklassen/hinterlassen“. „Denn“ gibt den begründenden Zusammenhang wieder; das Futur wahrt die Aussage des hebräischen Verbs, ohne die im Kontext liegende Unvermeidlichkeit durch ein zusätzliches „muss“ ausdrücklich zu machen.
- source_word: לָאָדָם
  choice: dem Menschen
  rationale: אָדָם bezeichnet hier einen einzelnen menschlichen Nachfolger. Der bestimmte Artikel wird im Haupttext beibehalten; die mögliche unbestimmte Auffassung wird in der Fußnote genannt.
- source_word: שֶׁיִּהְיֶה אַחֲרָי
  choice: der nach mir kommt
  rationale: Wörtlich heißt die Wendung „der nach mir sein wird“. Im Zusammenhang bezeichnet sie idiomatisch den späteren Nachfolger, ohne dessen Identität näher festzulegen.
theological_decisions:
- issue: Bestimmtheit und Geschlechtsbezug von אָדָם
  choice: dem Menschen
  alternative: einem Menschen; dem Mann
  rationale: Das Hebräische hat den bestimmten Artikel, doch אָדָם kann einen Menschen ohne Hervorhebung des Geschlechts bezeichnen. „Dem Menschen“ bewahrt sowohl die grammatische Bestimmtheit als auch den allgemeinmenschlichen Ausdruck; die mögliche unbestimmte Lesart bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung „Mühe/abmühte“ bewahrt das hebräische Wortspiel und ein Leitmotiv Kohelets. „Hinterlassen“ ist im Deutschen leicht spannungsvoll, lässt aber wie der Ausgangstext offen, ob die Arbeit selbst oder ihr Ertrag gemeint ist.
