  text: קָנִ֨יתִי֙ עֲבָדִ֣ים וּ/שְׁפָח֔וֹת וּ/בְנֵי בַ֖יִת הָ֣יָה לִ֑/י גַּ֣ם מִקְנֶה֩ בָקָ֨ר וָ/צֹ֤אן הַרְבֵּה֙ הָ֣יָה לִ֔/י מִ/כֹּ֛ל שֶֽׁ/הָי֥וּ לְ/פָנַ֖/י בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/007.yaml
  text: I acquired male servants and female servants[a], and homeborn servants were mine; I also had great herds of cattle and flocks[b], more than all who were before me in Jerusalem.
translation:
  language: de
  text: Ich erwarb Sklaven und Sklavinnen, und im Haus geborene Sklaven[a] gehörten mir. Auch Rinder und Kleinvieh besaß ich in großer Menge[b], mehr als alle, die vor mir in Jerusalem gewesen waren, besessen hatten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »Söhne des Hauses«; gemeint sind hier wahrscheinlich Sklaven, die im eigenen Hausstand geboren worden waren.
    reason: cultural_note
  - marker: b
    text: 'Oder: »Auch einen großen Viehbestand an Rindern sowie Schafen und Ziegen hatte ich.« Die hebräischen Ausdrücke sind Sammelbezeichnungen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָנִיתִי
  choice: Ich erwarb
  rationale: קנה bezeichnet erwerben oder kaufen. »Erwarb« lässt offen, auf welche Weise der Besitz erlangt wurde, und entspricht dem aufzählenden Stil.
- source_word: עֲבָדִים וּשְׁפָחוֹת
  choice: Sklaven und Sklavinnen
  rationale: Die Paarung unterscheidet männliche und weibliche versklavte Personen. Die Wiedergabe macht sowohl Geschlecht als auch sozialen Status deutlich.
- source_word: וּבְנֵי בַיִת
  choice: und im Haus geborene Sklaven
  rationale: Wörtlich »Söhne des Hauses«; im Zusammenhang sind damit Personen gemeint, die als Angehörige des versklavten Hausstands dort geboren wurden. Die Fußnote wahrt die bildhafte Ausgangsform.
- source_word: הָיָה לִי
  choice: gehörten mir / hatte ich
  rationale: Die hebräische Besitzformel wird je nach Satzanschluss natürlich wiedergegeben. Der Wechsel vermeidet unidiomatische Wiederholung, ohne den Sinn zu verändern.
- source_word: מִקְנֶה בָקָר וָצֹאן הַרְבֵּה
  choice: Rinder und Kleinvieh hatte ich in großer Menge
  rationale: מִקְנֶה bezeichnet Viehbesitz, der durch בָקָר und צֹאן näher bestimmt wird. »Kleinvieh« wahrt den kollektiven Oberbegriff für Schafe und Ziegen; »in großer Menge« gibt הַרְבֵּה klar wieder.
- source_word: מִכֹּל שֶׁהָיוּ לְפָנַי
  choice: mehr als alle, die vor mir ... gewesen waren
  rationale: Die vergleichende Aussage bezieht sich formal auf alle Vorgänger und wird eng am Hebräischen wiedergegeben.
- source_word: בִּירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Übliche deutsche Form des Ortsnamens.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Sklaven und Sklavinnen« benennt den abhängigen Rechts- und Sozialstatus unverhüllt. »Im Haus geboren« ist verständlicher als das im Deutschen missverständliche »hausgeboren«. Die Satzführung bewahrt den katalogartigen Charakter und den ausdrücklichen Vergleich mit den Vorgängern in Jerusalem.
