  to: Ich erwarb Sklaven und Sklavinnen, und im Haus geborene Sklaven[a] gehörten mir. Auch Rinder und Kleinvieh besaß ich in großer Menge[b], mehr als alle, die vor mir in Jerusalem gewesen waren, besessen hatten.
