base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/024.yaml
  text: There is nothing better for a man than that he should eat and drink and show himself good in his labor[b][a]. I also saw that this is from the hand of God.
translation:
  language: de
  text: 'Es gibt nichts Besseres für den Menschen, als zu essen und zu trinken und bei seiner Mühe Gutes zu genießen.[a][b] Auch das sah ich: Es kommt aus der Hand Gottes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher etwa: „und seine Seele bei seiner Mühe Gutes sehen lassen“; gemeint ist, bei seiner Mühe Gutes zu erfahren oder zu genießen.'
    reason: lexical_alternative
  - marker: b
    text: 'Der Anfang lässt sich auch formaler wiedergeben: „Es gibt für den Menschen nichts Gutes darin, dass er isst und trinkt …“ Der Zusammenhang spricht jedoch für die komparative Bedeutung „Es gibt nichts Besseres …“.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֵין טוֹב בָּאָדָם
  choice: Es gibt nichts Besseres für den Menschen
  rationale: Die schwierige hebräische Wendung wird im Zusammenhang am besten komparativ verstanden. „Für den Menschen“ gibt das generische אָדָם im heutigen Standarddeutsch natürlich wieder.
- source_word: שֶׁיֹּאכַל וְשָׁתָה
  choice: als zu essen und zu trinken
  rationale: Der Infinitivanschluss ist im Deutschen natürlich und bezeichnet den Inhalt dessen, was für den Menschen gut beziehungsweise besser ist.
- source_word: וְהֶרְאָה אֶת נַפְשׁוֹ טוֹב
  choice: und sich … Gutes zu gönnen
  rationale: Wörtlich steht etwa „seine Seele Gutes sehen lassen“. Die gewählte idiomatische Wiedergabe bezeichnet, ohne die Aussage unnötig zu erklären, das Erfahren oder Genießen des Guten.
- source_word: בַּעֲמָלוֹ
  choice: bei seiner Mühe
  rationale: עָמָל bezeichnet in Kohelet die mühevolle Arbeit beziehungsweise ihren Ertrag. „Mühe“ bewahrt den belasteten Klang des Ausdrucks.
- source_word: גַּם זֹה רָאִיתִי אָנִי
  choice: Auch das, so erkannte ich
  rationale: „Erkannte“ gibt das sehende Feststellen des Sprechers in natürlichem Deutsch wieder; „auch das“ bewahrt den Anschluss an den vorherigen Gedanken.
- source_word: מִיַּד הָאֱלֹהִים
  choice: aus der Hand Gottes
  rationale: Die Körpermetapher des Hebräischen bleibt erhalten und bezeichnet Gott als Ursprung beziehungsweise Geber.
theological_decisions:
- issue: Deutung von אֵין טוֹב בָּאָדָם
  choice: 'Komparative Aussage: „Es gibt nichts Besseres für den Menschen …“'
  alternative: 'Absolute Aussage: „Es gibt nichts Gutes im Menschen, sodass er essen und trinken könnte …“'
  rationale: Die komparative Deutung passt zur Syntax, zum unmittelbaren Zusammenhang und zur abschließenden Feststellung, dass dieser Genuss aus Gottes Hand kommt. Da der hebräische Wortlaut auch formaler verstanden werden kann, wird die Alternative in einer Fußnote genannt.
- issue: Charakter des Essens, Trinkens und Genießens
  choice: Als von Gott kommende Möglichkeit beziehungsweise Gabe formuliert
  alternative: Als uneingeschränkter Genussbefehl formuliert
  rationale: Der Vers stellt fest, dass auch dieses Gute aus Gottes Hand kommt; er formuliert hier nicht ausdrücklich einen Imperativ.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sich Gutes gönnen“ ist verständlich und idiomatisch, während die Fußnote das auffällige hebräische Bild mit נֶפֶשׁ bewahrt. Die beiden Fußnotenmarker stehen unmittelbar nach der betroffenen Aussage.
