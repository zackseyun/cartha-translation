  text: הִגְדַּ֖לְתִּי מַעֲשָׂ֑/י בָּנִ֤יתִי לִ/י֙ בָּתִּ֔ים נָטַ֥עְתִּי לִ֖/י כְּרָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/004.yaml
  text: 'I made my works great: I built houses for myself[a]; I planted vineyards for myself.'
translation:
  language: de
  text: 'Ich weitete meine Vorhaben aus[a]: Ich baute mir Häuser; ich pflanzte mir Weinberge.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »Ich machte meine Werke groß« oder »Ich vermehrte meine Unternehmungen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגְדַּלְתִּי
  choice: ich weitete … aus
  rationale: Der Hifil von גדל bezeichnet hier das Vergrößern oder Ausweiten. Die Formulierung gibt den kausativen Sinn idiomatisch wieder und leitet passend zu den anschließend genannten großen Unternehmungen über.
- source_word: מַעֲשָׂי
  choice: meine Vorhaben
  rationale: מַעֲשֶׂה kann Werk, Tat oder Unternehmung bedeuten. Im Zusammenhang mit Bauen und Pflanzen bezeichnet „Vorhaben“ die konkreten Projekte natürlich, ohne sie auf Bauwerke zu beschränken.
- source_word: בָּנִיתִי
  choice: ich baute
  rationale: Direkte und natürliche Wiedergabe des Qal von בנה.
- source_word: לִי
  choice: mir
  rationale: Der Dativ „mir“ bringt in Verbindung mit dem handelnden Ich knapp und idiomatisch zum Ausdruck, dass die Häuser und Weinberge dem eigenen Nutzen oder Besitz dienten.
- source_word: בָּתִּים
  choice: Häuser
  rationale: Das gewöhnliche deutsche Äquivalent bewahrt die Allgemeinheit des Hebräischen; „Paläste“ wäre eine nicht ausdrücklich genannte Präzisierung.
- source_word: נָטַעְתִּי
  choice: ich pflanzte
  rationale: Die übliche Wiedergabe von נטע im landwirtschaftlichen Zusammenhang.
- source_word: כְּרָמִים
  choice: Weinberge
  rationale: Das reguläre deutsche Äquivalent für כְּרָמִים und im Kontext von Anpflanzungen natürlich.
