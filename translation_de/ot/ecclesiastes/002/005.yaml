  text: עָשִׂ֣יתִי לִ֔/י גַּנּ֖וֹת וּ/פַרְדֵּסִ֑ים וְ/נָטַ֥עְתִּי בָ/הֶ֖ם עֵ֥ץ כָּל פֶּֽרִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/005.yaml
  text: I made for myself gardens and parks[a], and I planted in them every kind of fruit tree.
translation:
  language: de
  text: Ich legte mir Gärten und Parkanlagen[a] an und pflanzte darin alle Arten von Obstbäumen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Obstgärten“. Das hebräische Wort pardesim bezeichnet umfriedete, kultivierte Lustgärten, Parkanlagen oder Obstgärten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשִׂיתִי לִי
  choice: Ich legte mir … an
  rationale: Die Verbindung aus עשה und לִי beschreibt Anlagen, die der Sprecher zu seinem eigenen Nutzen schuf. Bei Gärten und Parkanlagen ist „sich etwas anlegen“ im Deutschen natürlicher als das wörtliche „für sich machen“.
- source_word: גַּנּוֹת
  choice: Gärten
  rationale: Der gewöhnliche Plural von גַּן wird direkt und idiomatisch mit „Gärten“ wiedergegeben.
- source_word: פַרְדֵּסִים
  choice: Parkanlagen
  rationale: Das Wort bezeichnet umfriedete, kultivierte Anlagen beziehungsweise Lustgärten und kann auch Obstgärten meinen. „Parkanlagen“ wahrt hier die Unterscheidung von den zuvor genannten Gärten und ist im modernen Deutsch präziser als das sehr allgemeine „Parks“.
- source_word: וְנָטַעְתִּי בָהֶם
  choice: und pflanzte darin
  rationale: Das Suffix in בָהֶם verweist auf beide zuvor genannten Anlagen. „Darin“ gibt diesen Rückbezug knapp und natürlich wieder; das deutsche Verb benötigt keine erneute ausdrückliche Nennung des Subjekts.
- source_word: עֵץ כָּל פֶּרִי
  choice: alle Arten von Obstbäumen
  rationale: Die wörtliche Fügung „Baum jeder Frucht“ bezeichnet in diesem gärtnerischen Zusammenhang Fruchtbäume verschiedenster Art. Der Plural ist im Deutschen idiomatisch und erhält den umfassenden Sinn von כָּל.
theological_decisions: []
