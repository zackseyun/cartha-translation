  text: כִּ֠י מֶֽה הֹוֶ֤ה לָֽ/אָדָם֙ בְּ/כָל עֲמָל֔/וֹ וּ/בְ/רַעְי֖וֹן לִבּ֑/ו שֶׁ/ה֥וּא עָמֵ֖ל תַּ֥חַת הַ/שָּֽׁמֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/022.yaml
  text: For what does a man gain from all his labor and from the striving of his heart with which he toils under the sun?[a]
translation:
  language: de
  text: Denn was hat ein Mensch von all seiner Mühe und vom Streben seines Herzens, womit er sich abmüht unter der Sonne?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von der Unrast seines Herzens“ oder „von dem, womit sich sein Herz beschäftigt“. Das hebräische Wort רַעְיוֹן kann im Predigerbuch inneres Streben, gedankliche Beschäftigung oder beunruhigende Unrast bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise Erläuterung des vorhergehenden Gedankens ein und bewahrt den argumentativen Zusammenhang.
- source_word: מֶה הֹוֶה לָאָדָם
  choice: was hat ein Mensch
  rationale: Die idiomatische Wendung fragt danach, was einem Menschen aus seiner Arbeit zukommt. „Was hat … davon“ gibt diesen Sinn natürlich wieder, ohne einen im Hebräischen nicht ausdrücklich genannten Gewinnbegriff festzulegen.
- source_word: בְּכָל עֲמָלוֹ
  choice: von all seiner Mühe
  rationale: עָמָל bezeichnet beschwerliche Arbeit oder Mühsal. „Mühe“ passt zum Kontext und lässt sowohl die Tätigkeit als auch ihre Belastung anklingen.
- source_word: וּבְרַעְיוֹן לִבּוֹ
  choice: und vom Streben seines Herzens
  rationale: רַעְיוֹן kann hier inneres Streben, gedankliche Beschäftigung oder beunruhigende Unrast bezeichnen. „Streben“ wahrt den aktiven Sinn, während Alternativen in der Fußnote die echte Bedeutungsbreite sichtbar machen.
- source_word: לִבּוֹ
  choice: seines Herzens
  rationale: „Herz“ bewahrt das hebräische Menschenbild, in dem Denken, Wollen und Empfinden zusammengehören.
- source_word: שֶׁהוּא עָמֵל
  choice: womit er sich abmüht
  rationale: Die Formulierung bindet das innere Streben an die fortgesetzte mühevolle Tätigkeit und gibt die Wortverwandtschaft mit עָמָל im Deutschen hörbar wieder.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: unter der Sonne
  rationale: Bewahrt die prägende und wiederkehrende Wendung des Predigerbuches für das menschliche Leben im irdischen Bereich.
