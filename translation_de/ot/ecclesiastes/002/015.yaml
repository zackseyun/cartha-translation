  text: וְ/אָמַ֨רְתִּֽי אֲנִ֜י בְּ/לִבִּ֗/י כְּ/מִקְרֵ֤ה הַ/כְּסִיל֙ גַּם אֲנִ֣י יִקְרֵ֔/נִי וְ/לָ֧/מָּה חָכַ֛מְתִּי אֲנִ֖י אָ֣ז יוֹתֵ֑ר וְ/דִבַּ֣רְתִּי בְ/לִבִּ֔/י שֶׁ/גַּם זֶ֖ה הָֽבֶל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/015.yaml
  text: And I said in my heart[a], "As happens to the fool, so it will happen to me also. Why then was I more wise?" And I said in my heart that this too is vanity.
translation:
  language: de
  text: 'Und ich sagte mir: „Was dem Toren widerfährt, wird auch mir widerfahren. Warum war ich dann weiser?“ Und ich sagte mir, dass auch dies ein Windhauch ist.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet wörtlich einen Hauch oder Dunst und kann zugleich das Flüchtige, Unfassbare oder Vergebliche ausdrücken.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתִּי אֲנִי בְּלִבִּי
  choice: Da sagte ich mir
  rationale: Die hebräische Wendung bezeichnet inneres Sprechen. Die idiomatische deutsche Form bewahrt diesen Sinn, ohne das im Deutschen ungebräuchliche „in meinem Herzen sagen“ nachzuahmen.
- source_word: כְּמִקְרֵה הַכְּסִיל גַּם אֲנִי יִקְרֵנִי
  choice: Was dem Toren widerfährt, wird auch mir widerfahren
  rationale: מִקְרֶה und קָרָה bezeichnen hier das Geschehen beziehungsweise das, was jemanden trifft. „Widerfahren“ gibt den Vergleich klar wieder, ohne das Geschehen vorschnell als festgelegtes Schicksal zu deuten.
- source_word: הַכְּסִיל
  choice: der Tor
  rationale: „Tor“ ist die geläufige, würdige Bezeichnung für den intellektuell und sittlich unverständigen Menschen in der Weisheitsliteratur.
- source_word: וְלָמָּה חָכַמְתִּי אֲנִי אָז יוֹתֵר
  choice: Warum bin ich dann so überaus weise gewesen?
  rationale: „Dann“ gibt אָז ausdrücklich wieder; „so überaus“ nimmt die steigernde Kraft von יוֹתֵר auf. Die Fußnote bewahrt die mögliche Auffassung des Verbs als „weise geworden“.
- source_word: וְדִבַּרְתִּי בְלִבִּי
  choice: Und ich sagte mir
  rationale: Obwohl דבר wörtlich „reden“ bedeutet, bezeichnet die Verbindung mit „in meinem Herzen“ erneut eine innere Aussage; „sagte ich mir“ ist dafür natürliches modernes Deutsch.
- source_word: שֶׁגַּם זֶה
  choice: dass auch dies
  rationale: Die Formulierung bewahrt sowohl den Inhaltssatz als auch die additive Bedeutung von גַּם.
- source_word: הָבֶל
  choice: Windhauch
  rationale: Das konkrete Bild eines flüchtigen Hauchs bewahrt die breite, bewusst schillernde Bedeutung des Leitworts in Kohelet besser als die stärker festlegenden Wiedergaben „Sinnlosigkeit“ oder „Nichtigkeit“.
theological_decisions:
- issue: Bedeutungsumfang von הָבֶל
  choice: Windhauch
  alternative: Nichtigkeit; Vergeblichkeit; Sinnlosigkeit
  rationale: Das hebräische Leitwort kann Vergänglichkeit, Unfassbarkeit und Vergeblichkeit anklingen lassen. „Windhauch“ erhält das Ausgangsbild und legt den Vers nicht einseitig auf eine Behauptung völliger Sinnlosigkeit fest.
- issue: Bedeutung von חָכַמְתִּי
  choice: bin … weise gewesen
  alternative: bin … weise geworden; habe … weise gehandelt
  rationale: Im Rückblick auf die zuvor beschriebene Weisheit passt die Zustandsaussage gut; da die Verbform jedoch auch ein Erlangen oder Ausüben von Weisheit bezeichnen kann, wird diese Offenheit in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die idiomatische Wendung „sagte ich mir“ macht den inneren Monolog verständlich; „Tor“ und „Windhauch“ erhalten den prägnanten Ton der Weisheitsliteratur.
