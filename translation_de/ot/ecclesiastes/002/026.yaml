revisions:
- from: Denn dem Menschen, der in seinen Augen gut ist[a], gibt er Weisheit, Erkenntnis und Freude; dem Sünder aber gibt er die Aufgabe, zu sammeln und anzuhäufen, um es dem zu geben, der in Gottes Augen gut ist. Auch das ist nichtig und ein Haschen nach Wind[b].
  to: Denn dem Menschen, der vor ihm gut ist[a], gibt er Weisheit, Erkenntnis und Freude; dem Sünder aber gibt er die Aufgabe, zu sammeln und anzuhäufen, um es dem zu geben, der vor Gott gut ist. Auch das ist nichtig und ein Haschen nach Wind[b].
  rationale: Die einzige erforderliche Änderung beseitigt eine im Deutschen sinnverkehrende bzw. stark missverständliche Rückbezüglichkeit. „Vor ihm gut“ erhält die hebräische Formulierung und ihre Verbindung zur später ausdrücklich genannten Gottesbezeichnung, ohne die mögliche Bedeutung „Gott gefällt“ zur alleinigen Lesart zu machen.
