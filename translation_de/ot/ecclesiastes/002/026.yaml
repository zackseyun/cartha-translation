reference: Ecclesiastes 2:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֤י לְ/אָדָם֙ שֶׁ/טּ֣וֹב לְ/פָנָ֔י/ו נָתַ֛ן חָכְמָ֥ה וְ/דַ֖עַת וְ/שִׂמְחָ֑ה וְ/לַ/חוֹטֶא֩ נָתַ֨ן עִנְיָ֜ן לֶ/אֱס֣וֹף וְ/לִ/כְנ֗וֹס לָ/תֵת֙ לְ/טוֹב֙ לִ/פְנֵ֣י הָֽ/אֱלֹהִ֔ים גַּם זֶ֥ה הֶ֖בֶל וּ/רְע֥וּת רֽוּחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/026.yaml
  text: For to the man who is good before him he has given wisdom and knowledge and joy[a], but to the sinner he has given the task of gathering and collecting, to give to the one who is good before God[b]. This too is vanity and a chasing after wind.
translation:
  language: de
  text: Denn dem Menschen, der vor ihm gut ist[a], gibt er Weisheit, Erkenntnis und Freude; dem Sünder aber gibt er die Aufgabe, zu sammeln und anzuhäufen, um es dem zu geben, der vor Gott gut ist. Auch das ist nichtig und ein Haschen nach Wind[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der vor ihm gut ist“; auch möglich: „der in Gottes Augen gut ist“ beziehungsweise „der Gott gefällt“.'
    reason: Die hebräische Wendung kann sowohl evaluativ als auch im Sinn göttlichen Wohlgefallens verstanden werden.
  - marker: b
    text: 'Auch möglich: „ein Mühen um Wind“.'
    reason: Die seltene Wendung רְעוּת רוּחַ bezeichnet eine vergebliche Beschäftigung oder ein erfolgloses Streben; ihre genaue bildhafte Nuance ist umstritten.
lexical_decisions:
- source_word: לְאָדָם
  choice: dem Menschen
  rationale: Das singularische אָדָם bezeichnet hier einen einzelnen Menschen im Gegensatz zum Sünder. „Mensch“ ist im Deutschen natürlich und bewahrt diesen individuellen Bezug.
- source_word: שֶׁטּוֹב לְפָנָיו
  choice: der in seinen Augen gut ist
  rationale: Die hebräische Wendung lautet wörtlich „der vor ihm gut ist“. Die deutsche idiomatische Entsprechung „in seinen Augen gut“ bewahrt das Urteil mit טוֹב, ohne es vollständig als „ihm gefällt“ auszudeuten.
- source_word: נָתַן
  choice: gibt
  rationale: Das Präsens entspricht dem betrachtenden, allgemeingültigen Charakter der Aussage und bezeichnet Gottes fortdauernde Zuteilung.
- source_word: חָכְמָה וְדַעַת וְשִׂמְחָה
  choice: Weisheit, Erkenntnis und Freude
  rationale: Die drei geläufigen Entsprechungen erhalten die Reihung des Hebräischen und das für Kohelet wichtige Motiv der von Gott geschenkten Freude.
- source_word: לַחוֹטֶא
  choice: dem Sünder
  rationale: Das substantivisch gebrauchte Partizip bezeichnet den durch Sünde gekennzeichneten Menschen und bildet den direkten Gegensatz zu dem Menschen, der vor Gott gut ist.
- source_word: עִנְיָן
  choice: die Aufgabe
  rationale: עִנְיָן bezeichnet bei Kohelet eine auferlegte Beschäftigung, oft mit belastendem Beiklang. „Aufgabe“ gibt den Sinn wieder, ohne die negative Wertung stärker als der Ausgangstext festzulegen.
- source_word: לֶאֱסוֹף וְלִכְנוֹס
  choice: zu sammeln und anzuhäufen
  rationale: Die beiden nahezu synonymen Infinitive betonen das fortgesetzte Ansammeln. „Anhäufen“ macht den Gedanken der Akkumulation im Deutschen deutlich.
- source_word: לָתֵת לְטוֹב לִפְנֵי הָאֱלֹהִים
  choice: um es dem zu geben, der in Gottes Augen gut ist
  rationale: Die Formulierung nimmt den ersten Satzteil wieder auf, nennt nun aber Gott ausdrücklich. Das ergänzte „es“ bezeichnet natürlich das zuvor Gesammelte, ohne einen neuen Sachinhalt einzuführen.
- source_word: הֶבֶל
  choice: nichtig
  rationale: „Nichtig“ wahrt den Leitwortcharakter von הֶבֶל und verbindet Vergänglichkeit, Substanzlosigkeit und Vergeblichkeit, ohne die Aussage auf absolute Sinnlosigkeit zu verengen.
- source_word: רְעוּת רוּחַ
  choice: ein Haschen nach Wind
  rationale: Die bildhafte deutsche Wendung vermittelt eine vergebliche, nicht zu vollendende Tätigkeit und erhält das Windbild des Hebräischen.
theological_decisions:
- issue: Unausgesprochenes Subjekt von נָתַן
  choice: Gott ist im ganzen Vers der Geber; das Pronomen „er“ bewahrt jedoch die Form des Ausgangstextes.
  alternative: Ein unpersönliches oder allgemein gedachtes Subjekt.
  rationale: Der unmittelbare Zusammenhang spricht von dem, was aus Gottes Hand kommt (2,24), und nennt Gott im zweiten Teil dieses Verses ausdrücklich.
- issue: Bedeutung von טוֹב לִפְנֵי הָאֱלֹהִים
  choice: „in Gottes Augen gut“
  alternative: „Gott gefällt“
  rationale: Die Hauptfassung erhält das ausdrückliche Wertungswort טוֹב und lässt offen, ob vor allem sittliche Güte oder Gottes Wohlgefallen gemeint ist. Die idiomatische Alternative wird in der Fußnote genannt.
- issue: Aussageumfang von הֶבֶל
  choice: „nichtig“ als Bild für Vergänglichkeit und Vergeblichkeit
  alternative: „sinnlos“
  rationale: „Sinnlos“ würde die theologische Aussage stärker und eindeutiger festlegen, als das vielschichtige Leitwort הֶבֶל erlaubt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die wiederholte Formulierung „in seinen/Gottes Augen gut“ erhält die innere Entsprechung beider Vershälften. Das traditionelle, aber weiterhin verständliche „Haschen nach Wind“ bewahrt die einprägsame Bildsprache.
