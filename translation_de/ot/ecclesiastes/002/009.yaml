  text: So I became great and increased more than all who were before me in Jerusalem[b][a]; also my wisdom remained with me.
translation:
  language: de
  text: Ich wurde groß und übertraf alle, die vor mir in Jerusalem gewesen waren.[a] Auch meine Weisheit blieb mir erhalten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und übertraf alles, was vor mir in Jerusalem gewesen war.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Meine Weisheit stand mir bei.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגָדַלְתִּי
  choice: So wurde ich groß
  rationale: Das Qal von גדל bezeichnet hier das Großwerden an Rang, Bedeutung oder Umfang. „Wurde ich groß“ bewahrt die resultative und persönliche Aussage; „So“ gibt den fortführenden Zusammenhang natürlich wieder.
- source_word: וְהוֹסַפְתִּי מִכֹּל
  choice: und übertraf alle
  rationale: Das Hifil von יסף bedeutet grundsätzlich „hinzufügen, zunehmen“; zusammen mit dem vergleichenden מִן ergibt sich idiomatisch der Sinn, über andere hinauszugelangen. „Übertraf“ ist im Deutschen klar und vermeidet die schwerfällige Formulierung „nahm mehr zu als“.
- source_word: שֶׁהָיָה לְפָנַי
  choice: die vor mir … gewesen waren
  rationale: Im Kontext sind wahrscheinlich frühere Personen beziehungsweise Vorgänger gemeint. Das Plusquamperfekt macht das zeitliche Verhältnis im Deutschen deutlich, ohne „vor mir“ räumlich missverständlich werden zu lassen.
- source_word: בִּירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Übliche örtliche Wiedergabe des Ortsnamens.
- source_word: אַף
  choice: Auch
  rationale: אַף fügt hier eine weitere, bemerkenswerte Aussage hinzu. „Auch“ erhält diese additive Funktion, ohne eine stärkere Hervorhebung einzutragen.
- source_word: חָכְמָתִי
  choice: meine Weisheit
  rationale: Direkte Wiedergabe des Substantivs mit Suffix der ersten Person Singular.
- source_word: עָמְדָה לִּי
  choice: blieb mir erhalten
  rationale: Wörtlich steht hier etwa „stand mir“. Idiomatisch besagt die Wendung, dass die Weisheit fortbestand und dem Sprecher weiterhin zur Verfügung stand. „Blieb mir erhalten“ drückt dies in natürlichem Deutsch aus.
