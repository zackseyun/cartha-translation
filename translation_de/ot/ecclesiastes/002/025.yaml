    reason: textual_variant
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Partikel begründet die vorausgehende Aussage; „Denn“ gibt diese erklärende Funktion im Deutschen natürlich wieder.
- source_word: מִי ... וּמִי
  choice: wer ... und wer
  rationale: Die wiederholte Frageform wird beibehalten und gibt der rhetorischen Frage ihre parallele Struktur.
- source_word: יֹאכַל
  choice: kann essen
  rationale: Das Imperfekt bezeichnet hier im Rahmen der rhetorischen Frage Möglichkeit beziehungsweise Fähigkeit; „kann essen“ entspricht dem Zusammenhang.
- source_word: יָחוּשׁ
  choice: kann genießen
  rationale: Das seltene und schwierige Verb lässt mehrere Deutungen zu. Im Zusammenhang mit Essen, Trinken und Freude in 2,24–26 liegt „genießen“ nahe; andere mögliche Bedeutungen werden in der Fußnote genannt.
- source_word: חוּץ מִמֶּנִּי
  choice: ohne ihn
  rationale: חוּץ mit der folgenden Präposition bezeichnet hier das Getrenntsein von jemandem. Obwohl der masoretische Text wörtlich „ohne mich“ lautet, wird im Kontext häufig Gott als Bezug verstanden; die Textform wird ausdrücklich in einer Fußnote bewahrt.
theological_decisions:
- issue: Bezug des pronominalen Suffixes in מִמֶּנִּי
  choice: ohne ihn
  alternative: ohne mich
  rationale: Der masoretisch vokalisierte Text hat die erste Person Singular („mich“), während der Zusammenhang Gott als Geber von Genuss hervorhebt und alte Textzeugen beziehungsweise zahlreiche Ausleger die dritte Person voraussetzen oder entsprechend verstehen. Der Haupttext folgt dem kontextuell gut begründeten Bezug auf Gott, ohne die abweichende hebräische Textform zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe rhetorische Parallelstruktur des Hebräischen bleibt erhalten. „Genießen“ ist alltagssprachlich verständlich, während die Fußnoten die lexikalische und textliche Unsicherheit offenlegen.
