  text: Denn wer kann essen, und wer kann genießen[a], ohne mich[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wer kann sich beeilen?“ oder „wer kann empfinden?“ Das hebräische Verb ist schwierig; hier wird es im Sinn von Genießen oder Erleben von Freude verstanden.'
