base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/010.yaml
  text: And whatever my eyes desired I did not withhold from them[a]; I did not keep my heart from any pleasure, for my heart rejoiced in all my labor[c][b], and this was my portion from all my labor.
translation:
  language: de
  text: Und alles, wonach meine Augen verlangten, enthielt ich ihnen nicht vor[a]. Meinem Herzen verwehrte ich keine Freude[b], denn mein Herz freute sich an all meiner Mühe[c]. Das war der Anteil, der mir aus all meiner Mühe zufiel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Alles, worum meine Augen baten, hielt ich ihnen nicht vor.“'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Ich hielt mein Herz von keiner Freude zurück.“'
    reason: lexical_alternative
  - marker: c
    text: „Mühe“ kann an beiden Stellen auch mit „Arbeit“ oder „Mühsal“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁאֲלוּ עֵינַי
  choice: wonach meine Augen verlangten
  rationale: Das Verb bedeutet wörtlich „fragen“ oder „erbitten“. Mit den Augen als Subjekt bezeichnet die Wendung jedoch bildhaft das, was sie begehrten. Die deutsche Fassung bewahrt sowohl das Bild der Augen als auch den Sinn des Verlangens.
- source_word: אָצַלְתִּי מֵהֶם
  choice: enthielt ich ihnen nicht vor
  rationale: Die Formulierung gibt das Zurückhalten oder Vorenthalten wieder und bezieht das Pronomen wie im Hebräischen auf die Augen.
- source_word: מָנַעְתִּי אֶת לִבִּי
  choice: Meinem Herzen verwehrte ich keine
  rationale: Die Wendung bezeichnet innere Selbstbeschränkung. Die Übersetzung erhält das Herz als Sitz des Erlebens und klingt zugleich in modernem Deutsch natürlich.
- source_word: שִׂמְחָה
  choice: Freude
  rationale: „Freude“ deckt sowohl Genuss als auch innere Fröhlichkeit ab und vermeidet eine unnötige Einengung auf sinnliches Vergnügen.
- source_word: לִבִּי שָׂמֵחַ
  choice: mein Herz freute sich
  rationale: Die Wiedergabe bewahrt das hebräische Bild vom Herzen als Zentrum der Freude.
- source_word: עֲמָלִי
  choice: meine Mühe
  rationale: עָמָל bezeichnet anstrengende Arbeit, Mühsal oder deren Ergebnis. „Mühe“ erhält den belastenden Unterton und lässt sich an beiden Stellen konsistent verwenden.
- source_word: חֶלְקִי
  choice: der Anteil, den ich … hatte
  rationale: „Anteil“ bewahrt das für Kohelet wichtige Motiv dessen, was einem aus seinem Tun tatsächlich zufällt.
theological_decisions:
- issue: Bewertung von Freude und Arbeit
  choice: Die Freude wird als tatsächlich empfangener Anteil aus der Mühe wiedergegeben, ohne sie moralisch positiv oder negativ zu bewerten.
  alternative: Die Aussage ausdrücklich als göttlichen Lohn oder als selbstsüchtigen Genuss deuten.
  rationale: Der Vers selbst beschreibt die Erfahrung und ihren Ertrag, legt aber an dieser Stelle keine solche theologische Bewertung ausdrücklich fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die anthropomorphen Bilder von Augen und Herz sowie die zweimalige Verwendung von עָמָל wurden bewahrt; die Syntax wurde nur so weit geglättet, wie es für natürliche deutsche Lesbarkeit nötig ist.
