  text: עָשִׂ֥יתִי לִ֖/י בְּרֵכ֣וֹת מָ֑יִם לְ/הַשְׁק֣וֹת מֵ/הֶ֔ם יַ֖עַר צוֹמֵ֥חַ עֵצִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/006.yaml
  text: I made for myself pools of water, to irrigate from them a grove sprouting trees.
translation:
  language: de
  text: Ich legte mir Wasserbecken an, um aus ihnen einen Wald[a] mit heranwachsenden Bäumen zu bewässern[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Gehölz“ bzw. „ein Waldgebiet“. Das hebräische Wort kann einen Wald oder ein bewaldetes Gebiet bezeichnen; der Zusammenhang spricht von einer bewässerten, offenbar angelegten Fläche.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zu wässern“. Das hebräische Verb kann „zu trinken geben“, „wässern“ oder „bewässern“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשִׂיתִי לִי
  choice: Ich legte mir … an
  rationale: עשה mit לִי bezeichnet hier das Herstellen zum eigenen Nutzen. Bei Wasserbecken ist „sich etwas anlegen“ im Deutschen natürlich und gibt sowohl die Tätigkeit als auch den selbstbezogenen Sinn wieder.
- source_word: בְּרֵכוֹת מָיִם
  choice: Wasserbecken
  rationale: בְּרֵכוֹת bezeichnet Becken oder Sammelbecken. „Wasserbecken“ ist konkret, verständlich und legt die genaue Bauart nicht unnötig fest.
- source_word: לְהַשְׁקוֹת מֵהֶם
  choice: um aus ihnen … zu bewässern
  rationale: Der Hifil-Infinitiv von שקה bezeichnet das Tränken oder Bewässern; מן mit Suffix kennzeichnet die Becken als Wasserquelle. „Aus ihnen“ bewahrt diesen Ausgangspunkt ausdrücklich.
- source_word: יַעַר
  choice: einen Wald
  rationale: יַעַר bedeutet gewöhnlich „Wald“ oder „Waldgebiet“. Obwohl der Zusammenhang eine kultivierte Anlage nahelegt, bleibt „Wald“ die direkte und nicht übermäßig deutende Wiedergabe.
- source_word: צוֹמֵחַ עֵצִים
  choice: mit heranwachsenden Bäumen
  rationale: Die ungewöhnliche hebräische Verbindung beschreibt ein Waldgebiet in aktivem Baumwuchs. Die deutsche Fassung bewahrt den fortdauernden Wachstumssinn des Partizips, ohne die syntaktische Härte wörtlich nachzubilden.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Ich legte mir … an“ klingt bei Wasseranlagen idiomatischer als das formal mögliche „Ich machte mir“. Die Wortstellung hält die Becken ausdrücklich als Quelle des Bewässerungswassers fest.
