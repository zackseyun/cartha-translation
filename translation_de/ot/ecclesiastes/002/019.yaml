source:
  edition: WLC
  text: וּ/מִ֣י יוֹדֵ֗עַ הֶֽ/חָכָ֤ם יִהְיֶה֙ א֣וֹ סָכָ֔ל וְ/יִשְׁלַט֙ בְּ/כָל עֲמָלִ֔/י שֶֽׁ/עָמַ֥לְתִּי וְ/שֶׁ/חָכַ֖מְתִּי תַּ֣חַת הַ/שָּׁ֑מֶשׁ גַּם זֶ֖ה הָֽבֶל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/019.yaml
  text: And who knows whether he will be wise or foolish? Yet he will rule over all my labor in which I labored and used wisdom under the sun[a]. This too is vanity.
translation:
  language: de
  text: Und wer weiß, ob er weise oder töricht sein wird? Dennoch wird er über mein ganzes Werk verfügen, das ich unter der Sonne mühevoll und mit Weisheit vollbracht habe. Auch das ist nichtig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Auch das ist ein Hauch«, mit Betonung der Vergänglichkeit; möglicherweise auch: »Auch das ist vergeblich.« Das hebräische Wort hebel hat im Buch Prediger ein breites Bedeutungsspektrum.'
    reason: Lexikalische Bedeutungsbreite des Schlüsselworts הֶבֶל transparent bewahren.
lexical_decisions:
- source_word: וּמִי יוֹדֵעַ
  choice: Und wer weiß
  rationale: Bewahrt den Anschluss an den vorherigen Gedanken und gibt die offene Ungewissheit idiomatisch wieder.
- source_word: הֶחָכָם יִהְיֶה אוֹ סָכָל
  choice: ob er weise oder töricht sein wird
  rationale: Die indirekte Frage und der Gegensatz werden ohne unnötige Substantivierung natürlich wiedergegeben.
- source_word: וְיִשְׁלַט
  choice: Dennoch wird er … verfügen
  rationale: „Verfügen über“ bezeichnet im Erbkontext natürliche und präzise die tatsächliche Herrschaft beziehungsweise Kontrolle; „dennoch“ macht den kontextuellen Gegensatz deutlich, ohne ihn zu übersteigern.
- source_word: בְּכָל עֲמָלִי שֶׁעָמַלְתִּי
  choice: über mein ganzes Werk … das ich … mühevoll … vollbracht habe
  rationale: Die Formulierung macht verständlich, dass der Nachfolger über das Ergebnis der mühevollen Arbeit verfügen wird. „mühevoll“ erhält den belastenden Sinn von עמל, auch wenn die hebräische Wortwiederholung zugunsten natürlichen Deutschen nicht formal nachgebildet wird.
- source_word: וְשֶׁחָכַמְתִּי
  choice: mit Weisheit vollbracht habe
  rationale: 'Gibt den aktiven Sinn wieder: Der Sprecher hat bei seinem Tun Weisheit eingesetzt, nicht lediglich Weisheit besessen.'
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: unter der Sonne
  rationale: Bewahrt die für Prediger charakteristische und im Deutschen vertraute Wendung.
- source_word: גַּם זֶה הָבֶל
  choice: Auch das ist nichtig
  rationale: „nichtig“ ist knapp, würdig und lässt sowohl Vergänglichkeit als auch Vergeblichkeit anklingen, ohne הבל auf bloße Bedeutungslosigkeit festzulegen.
theological_decisions:
- issue: Bedeutungsbreite von הֶבֶל im Buch Prediger
  choice: nichtig
  alternative: ein Hauch; flüchtig; vergeblich
  rationale: Das Schlüsselwort bezeichnet bildhaft einen Hauch und kann daraus Vergänglichkeit, Unbeständigkeit oder Vergeblichkeit ausdrücken. Der Haupttext wahrt diese thematische Offenheit; die Fußnote nennt die wichtigsten möglichen Akzente.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzführung bleibt gut verständlich; die traditionelle Wendung „unter der Sonne“ und die knappe Schlussformel erhalten den charakteristischen Ton des Buches.
