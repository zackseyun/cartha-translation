base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/004.yaml
  text: The heart of the wise is in the house of mourning[a], but the heart of fools is in the house of mirth.
translation:
  language: de
  text: Das Herz der Weisen ist im Haus der Trauer, das Herz der Narren aber im Haus der Freude.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Fröhlichkeit“ beziehungsweise „Festfreude“. Das hebräische Wort kann Freude allgemein bezeichnen; hier meint es im Gegensatz zur Trauer wahrscheinlich festliches Vergnügen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב
  choice: Herz
  rationale: „Herz“ bewahrt das hebräische Bild und bezeichnet hier die innere Ausrichtung, die Aufmerksamkeit und das Denken eines Menschen, nicht nur seine Gefühle.
- source_word: חֲכָמִים
  choice: der Weisen
  rationale: Das substantivierte Adjektiv wird geschlechtsübergreifend und in knapper, sprichwortartiger Form wiedergegeben.
- source_word: בֵּית
  choice: Haus
  rationale: „Haus“ entspricht dem hebräischen Bild unmittelbar und erhält die parallele Wendung „Haus der Trauer“ beziehungsweise „Haus der Freude“.
- source_word: אֵבֶל
  choice: Trauer
  rationale: Das Wort bezeichnet insbesondere Trauer im Zusammenhang mit Tod und Klage; „Trauer“ ist im Deutschen natürlich und passt zum unmittelbaren Kontext.
- source_word: וְ
  choice: aber
  rationale: Obwohl die Konjunktion formal auch „und“ heißen kann, ist sie in der antithetischen Parallelstruktur kontrastiv zu verstehen.
- source_word: כְּסִילִים
  choice: der Unverständigen
  rationale: „Unverständige“ bezeichnet in der Weisheitsliteratur Menschen, denen sittliche und lebenspraktische Einsicht fehlt, ohne im modernen Deutsch unnötig wie eine pauschale Beschimpfung zu klingen.
- source_word: שִׂמְחָה
  choice: Freude
  rationale: Das hebräische Wort bezeichnet Freude, Fröhlichkeit oder festliches Vergnügen. „Freude“ ist die direkte, natürliche Wiedergabe; der Kontext verleiht ihr hier den Sinn ausgelassener Fröhlichkeit.
