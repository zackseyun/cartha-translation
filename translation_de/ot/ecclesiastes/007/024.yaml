  text: רָח֖וֹק מַה שֶּׁ/הָיָ֑ה וְ/עָמֹ֥ק עָמֹ֖ק מִ֥י יִמְצָאֶֽ/נּוּ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/024.yaml
  text: What has been is far off and very deep—who can find it out?[a]
translation:
  language: de
  text: Was gewesen ist, ist fern und sehr tief – wer kann es ergründen?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und tief, tief“; die Wiederholung verstärkt die Aussage: „sehr tief“ oder „überaus tief“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָחוֹק
  choice: fern
  rationale: Das prädikative Adjektiv bezeichnet etwas Entferntes oder Unzugängliches. „Fern“ bewahrt das räumliche Bild und klingt in diesem Weisheitsspruch würdig und natürlich.
- source_word: מַה שֶּׁהָיָה
  choice: was geschehen ist
  rationale: Die Relativkonstruktion mit der Qatalform von היה kann das bezeichnen, was geschehen beziehungsweise geworden ist. Diese Wiedergabe wahrt den Rückbezug, ohne die Aussage auf bloße Existenz festzulegen.
- source_word: וְעָמֹק עָמֹק
  choice: und sehr tief
  rationale: Die Wiederholung von עָמֹק verstärkt die Aussage. „Sehr tief“ gibt diese Intensivierung in natürlichem Deutsch wieder; die formnähere Wiederholung wird in der Fußnote genannt.
- source_word: מִי
  choice: wer
  rationale: Das gewöhnliche Fragepronomen leitet hier eine rhetorische Frage ein.
- source_word: יִמְצָאֶנּוּ
  choice: kann es ergründen
  rationale: מצא bedeutet „finden“ oder „entdecken“. Im Weisheitskontext bringt „ergründen“ die gemeinte Erkenntnis eines schwer zugänglichen Sachverhalts idiomatisch zum Ausdruck. Das Pronomen „es“ bezieht sich auf das zuvor Beschriebene; „kann“ verdeutlicht die rhetorische Kraft der Frage.
