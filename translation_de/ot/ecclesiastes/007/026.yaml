  text: וּ/מוֹצֶ֨א אֲנִ֜י מַ֣ר מִ/מָּ֗וֶת אֶת הָֽ/אִשָּׁה֙ אֲשֶׁר הִ֨יא מְצוֹדִ֧ים וַ/חֲרָמִ֛ים לִבָּ֖/הּ אֲסוּרִ֣ים יָדֶ֑י/הָ ט֞וֹב לִ/פְנֵ֤י הָ/אֱלֹהִים֙ יִמָּלֵ֣ט מִמֶּ֔/נָּה וְ/חוֹטֵ֖א יִלָּ֥כֶד בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/026.yaml
  text: And I find more bitter than death the woman whose heart is traps and nets[a], and whose hands are chains. The one who is good before God will escape from her[b], but the sinner will be caught by her.
translation:
  language: de
  text: 'Und ich finde: Bitterer als der Tod ist die Frau, deren Herz aus Fallen und Netzen[a] besteht und deren Hände Fesseln sind. Wer vor Gott gut ist, wird ihr entkommen[b]; doch der Sünder wird von ihr gefangen genommen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus Schlingen und Netzen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Wer Gott gefällt, wird ihr entkommen.“'
    reason: alternative_reading
lexical_decisions:
- source_word: וּמוֹצֶא אֲנִי
  choice: Und ich finde
  rationale: Die partizipiale Konstruktion mit ausdrücklich genanntem Subjekt bezeichnet hier eine fortdauernde persönliche Feststellung. Das deutsche Präsens bewahrt diesen Diskurscharakter.
- source_word: מַר מִמָּוֶת
  choice: Bitterer als der Tod
  rationale: Adjektiv plus מִן drückt den Vergleich aus. Die Formulierung ist im Deutschen knapp, idiomatisch und erhält die drastische Bildsprache.
- source_word: הָאִשָּׁה
  choice: die Frau
  rationale: Der bestimmte Artikel wird wiedergegeben. Die Übersetzung legt nicht fest, ob eine bestimmte Frau, ein Typus oder eine personifizierte Gestalt gemeint ist.
- source_word: מְצוֹדִים וַחֲרָמִים
  choice: Fallen und Netze
  rationale: Beide Wörter gehören zur Bildwelt des Fangens und Verstrickens. „Fallen und Netze“ ist verständlich und erhält die beiden parallelen Fangmittel.
- source_word: לִבָּהּ
  choice: deren Herz aus Fallen und Netzen besteht
  rationale: „Herz“ bleibt als Zentrum von Absicht und Begehren erhalten. „Besteht aus“ macht die nominale Prädikation im Deutschen verständlich, ohne die Metapher aufzulösen.
- source_word: אֲסוּרִים יָדֶיהָ
  choice: deren Hände Fesseln sind
  rationale: אֲסוּרִים bezeichnet Bindungen beziehungsweise Fesseln. Die konkrete Wiedergabe wahrt den Parallelismus mit Fallen und Netzen.
- source_word: טוֹב לִפְנֵי הָאֱלֹהִים
  choice: Wer vor Gott gut ist
  rationale: Diese bewusst nahe Wiedergabe erhält den Wortwert von טוֹב und die Perspektivformel „vor Gott“. Die idiomatischere Deutung „Wer Gott gefällt“ steht in der Fußnote.
- source_word: יִמָּלֵט מִמֶּנָּה
  choice: wird ihr entkommen
  rationale: Die Nifalform von מלט bezeichnet das Entkommen. Der deutsche Dativ bei „entkommen“ gibt die Trennung von ihr natürlich wieder.
- source_word: וְחוֹטֵא
  choice: doch der Sünder
  rationale: Das substantivierte Partizip bezeichnet den sündig Handelnden. „Doch“ bringt den im Kontext vorhandenen Gegensatz deutlich zum Ausdruck.
- source_word: יִלָּכֶד בָּהּ
  choice: wird von ihr gefangen
  rationale: Die passive Verbform wird beibehalten; בָּהּ wird im Zusammenhang mit der als Fangmacht dargestellten Frau agentiv wiedergegeben.
theological_decisions:
- issue: Ob die Aussage über „die Frau“ verallgemeinert, abgeschwächt oder näher bestimmt werden soll
  choice: Die singularische, bestimmte Form „die Frau“ und die drastische Bildsprache bleiben erhalten.
  alternative: „eine Frau“, „die verführerische Frau“ oder „die personifizierte Torheit“
  rationale: Der hebräische Text lässt offen, ob eine konkrete Frau, ein moralischer Typus oder eine personifizierte Gestalt gemeint ist. Die Übersetzung bewahrt diese Spannung und trägt keine Deutung in den Haupttext ein.
- issue: Bedeutung von טוֹב לִפְנֵי הָאֱלֹהִים
  choice: Wer vor Gott gut ist
  alternative: Wer Gott gefällt
  rationale: Die Hauptfassung bleibt lexikalisch eng am Hebräischen. Da die Wendung idiomatisch auch das Gefallen Gottes bezeichnen kann, wird diese Möglichkeit in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer, bildhafter Sprache. Der eröffnende Doppelpunkt macht die hebräische Feststellung im Deutschen lesbar; die ungewöhnliche Formulierung „vor Gott gut“ bleibt bewusst erhalten, damit die mögliche Bedeutung nicht vorschnell auf „Gott gefallen“ verengt wird.
