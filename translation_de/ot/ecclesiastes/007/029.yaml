  text: לְ/בַד֙ רְאֵה זֶ֣ה מָצָ֔אתִי אֲשֶׁ֨ר עָשָׂ֧ה הָ/אֱלֹהִ֛ים אֶת הָ/אָדָ֖ם יָשָׁ֑ר וְ/הֵ֥מָּה בִקְשׁ֖וּ חִשְּׁבֹנ֥וֹת רַבִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/029.yaml
  text: 'Only see this: I have found that God made man upright[b][a], but they have sought out many schemes.'
translation:
  language: de
  text: 'Sieh, nur dies habe ich herausgefunden: Gott hat den Menschen aufrichtig gemacht, sie aber haben viele Pläne ersonnen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „viele Berechnungen“, „viele Überlegungen“ oder „viele ausgeklügelte Vorhaben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַד רְאֵה זֶה
  choice: 'Doch sieh: Dies'
  rationale: לְבַד grenzt die abschließende Feststellung gegenüber der zuvor erfolglosen Suche ab; „Doch“ gibt diese einschränkende und zugleich kontrastive Funktion im Deutschen natürlich wieder. „Sieh“ bewahrt den direkten Aufmerksamkeitsruf, „dies“ den Rückverweis.
- source_word: מָצָאתִי
  choice: habe ich herausgefunden
  rationale: Das Perfekt bezeichnet eine gewonnene, weiterhin geltende Einsicht. „Herausgefunden“ klingt im heutigen Deutsch natürlicher als das wörtlichere „gefunden“ bei einem gedanklichen Ergebnis.
- source_word: עָשָׂה הָאֱלֹהִים אֶת הָאָדָם יָשָׁר
  choice: Gott hat den Menschen aufrichtig gemacht
  rationale: הָאָדָם bezeichnet hier den Menschen beziehungsweise die Menschheit in generischem Sinn. Der Singular „den Menschen“ bewahrt die Form des Hebräischen, ohne auf einen Mann einzuengen. יָשָׁר hat hier eine ethische Bedeutung, die „aufrichtig“ angemessen wiedergibt.
- source_word: וְהֵמָּה
  choice: sie aber
  rationale: Der Plural nimmt den kollektiv gebrauchten Singular הָאָדָם wieder auf. Die nachgestellte Konjunktion „aber“ macht den Gegensatz idiomatisch deutlich, ohne das betonte Pronomen übermäßig auszubauen.
- source_word: בִּקְשׁוּ
  choice: haben ... ersonnen
  rationale: Das Grundverb bedeutet „suchen“; zusammen mit חִשְּׁבֹנוֹת bezeichnet es hier das bewusste Hervorbringen beziehungsweise Verfolgen menschlicher Entwürfe. „Ersinnen“ bildet diese idiomatische Gesamtbedeutung natürlich ab.
- source_word: חִשְּׁבֹנוֹת רַבִּים
  choice: viele Pläne
  rationale: חִשְּׁבוֹנוֹת kann Berechnungen, Überlegungen, Entwürfe oder ausgeklügelte Vorhaben bezeichnen. „Pläne“ ist verständlich und erhält eine gewisse Offenheit; weitere mögliche Nuancen werden in der Fußnote genannt.
theological_decisions:
- issue: Bezug von הָאָדָם als generische Aussage über die Menschheit
  choice: den Menschen
  alternative: die Menschen / die Menschheit
  rationale: Der bestimmte Singular ist kollektiv beziehungsweise repräsentativ gebraucht. „Den Menschen“ erhält den hebräischen Singular und ist im Deutschen geschlechtsübergreifend verständlich; der folgende Plural „sie“ bringt die kollektive Bedeutung zum Ausdruck.
- issue: Moralische Färbung von חִשְּׁבֹנוֹת רַבִּים
  choice: viele Pläne
  alternative: viele Machenschaften
  rationale: Der Gegensatz zu „aufrichtig“ legt problematische menschliche Entwürfe nahe, doch das Substantiv selbst kann auch neutral „Berechnungen“ oder „Überlegungen“ bedeuten. „Pläne“ wahrt diese Spannung besser als das eindeutig negative „Machenschaften“.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers bleibt knapp und sentenzartig. Die Wiederaufnahme des generischen Singulars durch den Plural wird wie im Hebräischen beibehalten; die mögliche Bedeutungsbreite des Schlusswortes wird nicht dogmatisch verengt.
