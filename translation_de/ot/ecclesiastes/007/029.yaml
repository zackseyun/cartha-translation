  naturalness: „Sieh, nur dies habe ich herausgefunden“ ist modernes, würdiges und knappes Standarddeutsch. Es bewahrt den aufmerksamkeitsheischenden Imperativ und die zusammenfassend-begrenzende Aussage, ohne eine im Hebräischen nicht ausdrücklich vorliegende Kontrastpartikel einzuführen.
  terminology: „Gott“, „den Menschen“ und „aufrichtig“ sind hier angemessen. Die Fußnote zu „Pläne“ erhält die lexikalische Bandbreite von חִשְּׁבֹנוֹת; „ausgeklügelte Vorhaben“ darf dabei als kontextuelle Möglichkeit, nicht als zwingende negative Lesart, erscheinen.
