  text: For your heart knows that many times you yourself have also cursed others[a].
translation:
  language: de
  text: Denn dein Herz weiß, dass auch du selbst andere schon viele Male verflucht hast[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „beschimpft hast“ oder „schlecht über andere geredet hast“. Das hebräische Verb kann ein ausgesprochenes Verfluchen bezeichnen, im Zusammenhang aber auch allgemeiner abfälliges oder verletzendes Reden über andere.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Mahnung ein und gibt den erklärenden Zusammenhang natürlich wieder.
- source_word: גַּם פְּעָמִים רַבּוֹת
  choice: oft
  rationale: Die Wendung bezeichnet zahlreiche Gelegenheiten. „Oft“ ist im Deutschen natürlich; das erste גַּם wird nicht eigens wiederholt, da seine additive bzw. verstärkende Funktion zusammen mit dem zweiten גַּם im Satz ausreichend zum Ausdruck kommt.
- source_word: יָדַע
  choice: weiß
  rationale: Das Perfekt bezeichnet hier gefestertes Wissen aus eigener Erfahrung; das deutsche Präsens gibt diesen gegenwärtigen Bewusstseinszustand passend wieder.
- source_word: לִבֶּךָ
  choice: dein Herz
  rationale: Bewahrt das hebräische Bild für das innere Selbst, das Denken und Gewissen, ohne es auf „Verstand“ oder „Gefühl“ zu verengen.
- source_word: אֲשֶׁר
  choice: dass
  rationale: Leitet den Inhalt dessen ein, was das Herz weiß.
- source_word: גַּם אַתָּה
  choice: auch du selbst
  rationale: „Auch“ wahrt die Einbeziehung des Angeredeten, und „du selbst“ gibt die Betonung durch das selbstständige Pronomen wieder.
- source_word: קִלַּלְתָּ
  choice: verflucht hast
  rationale: Gibt die unmittelbare Bedeutung des Verbs wieder und erhält die sprachliche und moralische Entsprechung zum Verfluchtwerden im Zusammenhang. Weniger starke kontextuelle Bedeutungen werden in der Fußnote genannt.
- source_word: אֲחֵרִים
  choice: andere
  rationale: Gibt den unbestimmten Personenplural knapp und idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Rede vom Herzen bleibt als Bild für inneres Wissen und Gewissen erhalten. Die Wortstellung hebt „auch du selbst“ hervor, ohne im Deutschen schwerfällig zu wirken.
