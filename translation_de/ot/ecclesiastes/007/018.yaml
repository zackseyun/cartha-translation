source:
  edition: WLC
  text: ט֚וֹב אֲשֶׁ֣ר תֶּאֱחֹ֣ז בָּ/זֶ֔ה וְ/גַם מִ/זֶּ֖ה אַל תַּנַּ֣ח אֶת יָדֶ֑/ךָ כִּֽי יְרֵ֥א אֱלֹהִ֖ים יֵצֵ֥א אֶת כֻּלָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/018.yaml
  text: It is good that you should grasp this[a], and also not let your hand rest from that; for the one who fears God will come out with them all.
translation:
  language: de
  text: Gut ist es, dass du an diesem festhältst und deine Hand auch von jenem nicht loslässt; denn wer Gott fürchtet, wird aus all dem herauskommen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Wendung ist ungewöhnlich und kann auch im Sinn von „wird mit all dem zurechtkommen“ oder „wird dem allen entgehen“ verstanden werden.
    reason: alternative_reading
lexical_decisions:
- source_word: טוֹב אֲשֶׁר
  choice: Gut ist es, wenn
  rationale: Gibt die wertende Aussage in natürlichem Deutsch wieder; der folgende Relativanschluss wird idiomatisch als Konditionalsatz formuliert.
- source_word: תֶּאֱחֹז בָּזֶה
  choice: du an diesem festhältst
  rationale: אָחַז bezeichnet das Ergreifen oder Festhalten. Die deutsche Formulierung bewahrt das Bild und bezieht sich auf den zuvor genannten Rat.
- source_word: וְגַם מִזֶּה אַל תַּנַּח אֶת יָדֶךָ
  choice: und auch von jenem deine Hand nicht lässt
  rationale: Die Wendung wahrt das Handbild und gibt den Hifil von נוח im Sinn von loslassen bzw. ruhen lassen wieder. „Diesem … jenem“ macht den Bezug auf zwei gegenübergestellte Gesichtspunkte im Deutschen deutlich.
- source_word: יְרֵא אֱלֹהִים
  choice: wer Gott fürchtet
  rationale: Die substantivisch gebrauchte Formulierung bezeichnet allgemein einen Menschen, dessen Haltung von Gottesfurcht geprägt ist.
- source_word: יֵצֵא אֶת כֻּלָּם
  choice: wird aus all dem herauskommen
  rationale: Die Wiedergabe bewahrt das Grundbild von יָצָא, ohne die schwierige Konstruktion eindeutig als Vermeiden, Erfüllen oder erfolgreiches Bewältigen festzulegen.
theological_decisions:
- issue: Sinn der Schlussaussage
  choice: Der Gottesfürchtige wird „aus all dem herauskommen“; das Ausgangsbild bleibt im Haupttext erhalten.
  alternative: Der Gottesfürchtige entgeht allen Extremen oder wird mit beidem zurechtkommen.
  rationale: Die hebräische Konstruktion יֵצֵא אֶת כֻּלָּם ist knapp und ungewöhnlich. Eine eindeutige Festlegung auf Vermeidung oder erfolgreiche Bewältigung würde die echte Auslegungsbreite unnötig verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die anschaulichen Bilder des Festhaltens, der Hand und des Herauskommens bleiben erhalten; die schwierige Schlusswendung wird nicht stillschweigend vereindeutigt.
