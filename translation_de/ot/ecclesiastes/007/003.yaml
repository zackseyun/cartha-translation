  text: ט֥וֹב כַּ֖עַס מִ/שְּׂחֹ֑ק כִּֽי בְ/רֹ֥עַ פָּנִ֖ים יִ֥יטַב לֵֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/003.yaml
  text: Sorrow is better than laughter[b][a], for by a sad face the heart is made better.
translation:
  language: de
  text: Kummer[a] ist besser als Lachen, denn ein trauriges Gesicht tut dem Herzen gut.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Zorn ist besser als Lachen“ beziehungsweise „Verdruss ist besser als Lachen“. Das hebräische Wort כַּעַס kann Kummer, Verdruss oder Zorn bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Denn durch die Schlechtigkeit des Gesichts wird das Herz gut.“ Die hebräische Wendung bezeichnet eine traurige oder bekümmerte Miene.'
    reason: literal_rendering
lexical_decisions:
- source_word: טוֹב ... מִן
  choice: besser als
  rationale: Die Verbindung von טוֹב mit מִן drückt hier einen Vergleich aus, nicht lediglich die absolute Bewertung „gut“.
- source_word: כַּעַס
  choice: Kummer
  rationale: Das Wort kann Kummer, Verdruss oder Zorn bezeichnen. Im Zusammenhang mit Trauer, Lachen und einer traurigen Miene gibt „Kummer“ den Sinn im Deutschen am natürlichsten wieder, ohne die lexikalische Mehrdeutigkeit in der Fußnote zu verschweigen.
- source_word: שְׂחוֹק
  choice: Lachen
  rationale: Die konkrete Wiedergabe entspricht dem Gegensatz zum Kummer und ist im modernen Deutschen klarer und unmittelbarer als „Heiterkeit“ oder „Frohsinn“.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt die Begründung für die vorausgehende vergleichende Aussage ein.
- source_word: בְּרֹעַ פָּנִים
  choice: ein trauriges Gesicht
  rationale: Wörtlich steht „bei/durch der Schlechtigkeit des Gesichts“; gemeint ist idiomatisch eine traurige, bekümmerte oder finstere Miene. Die gewählte Formulierung bewahrt das konkrete Bild.
- source_word: יִיטַב
  choice: tut ... gut
  rationale: Die Form von יטב bezeichnet das Gutwerden oder eine heilsame Wirkung. „Tut dem Herzen gut“ gibt diese Wirkung idiomatisch und verständlich wieder, ohne sie auf bloße Aufheiterung zu verengen.
- source_word: לֵב
  choice: Herz
  rationale: „Herz“ bewahrt das zentrale biblische Bild für das innere Leben, einschließlich Denken, Haltung und Empfinden.
theological_decisions:
- issue: Mögliche Wertung von Zorn gegenüber Lachen
  choice: Im Haupttext steht „Kummer“, während die Bedeutung „Zorn“ in einer Fußnote erhalten bleibt.
  alternative: „Zorn ist besser als Lachen“
  rationale: Der unmittelbare Zusammenhang behandelt Trauer und ihre heilsame Wirkung auf den inneren Menschen. Dennoch erlaubt כַּעַס auch „Zorn“ oder „Verdruss“, weshalb diese Spannung nicht stillschweigend beseitigt wird.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdevoller Weisheitssprache. „Tut dem Herzen gut“ ist bewusst idiomatisch; die Fußnote dokumentiert die ungewöhnliche wörtliche Formulierung. Alle echten lexikalischen Alternativen mit Auslegungsgewicht bleiben sichtbar.
