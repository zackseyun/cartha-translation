  text: גַּ֤ם לְ/כָל הַ/דְּבָרִים֙ אֲשֶׁ֣ר יְדַבֵּ֔רוּ אַל תִּתֵּ֖ן לִבֶּ֑/ךָ אֲשֶׁ֥ר לֹֽא תִשְׁמַ֥ע אֶֽת עַבְדְּ/ךָ֖ מְקַלְלֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/021.yaml
  text: Also[a], do not give your heart to every word that is spoken[b], lest you hear your servant cursing you.
translation:
  language: de
  text: Nimm dir auch nicht alles zu Herzen, was gesagt wird,[a] damit du nicht hörst, wie dein Diener[b] dich verflucht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Gib dein Herz nicht all den Worten, die sie reden.«'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »dein Sklave«. Das hebräische Wort עֶבֶד kann je nach Zusammenhang einen Diener oder einen Sklaven bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: auch
  rationale: Bewahrt die additive Verbindung zum vorausgehenden Gedankengang, ohne sie unnötig zu verstärken.
- source_word: לְכָל הַדְּבָרִים אֲשֶׁר יְדַבֵּרוּ
  choice: alles, was gesagt wird
  rationale: דְּבָרִים bezeichnet hier angesichts des folgenden Hörens gesprochene Worte; die unbestimmte dritte Person Plural wird im Deutschen natürlich durch das Passiv wiedergegeben.
- source_word: אַל תִּתֵּן לִבֶּךָ
  choice: Nimm dir … nicht zu Herzen
  rationale: Die wörtliche Wendung ‚gib dein Herz nicht‘ bezeichnet innere Aufmerksamkeit oder persönliche Betroffenheit. Die deutsche Redewendung ‚sich etwas zu Herzen nehmen‘ erhält das Herzbild und gibt den Sinn natürlich wieder.
- source_word: אֲשֶׁר לֹא תִשְׁמַע
  choice: damit du nicht hörst
  rationale: Die mehrdeutige Anschlusskonstruktion kann Ziel beziehungsweise unerwünschte Folge ausdrücken. Diese Wiedergabe bleibt nah an der hebräischen Form und ist modernes Deutsch.
- source_word: עַבְדְּךָ
  choice: dein Diener
  rationale: עֶבֶד kann je nach sozialem Kontext Diener oder Sklave bedeuten. Hier ist der genaue Rechtsstatus nicht bestimmt; ‚Diener‘ eignet sich daher für den Haupttext, während die Alternative in einer Fußnote erhalten bleibt.
- source_word: מְקַלְלֶךָ
  choice: dich verflucht
  rationale: Das Partizip von קלל bezeichnet hier das Verfluchen beziehungsweise die verächtliche Schmähung einer Person; ‚verflucht‘ ist direkt und kontextgerecht.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die idiomatische Hauptfassung bewahrt mit »zu Herzen nehmen« das hebräische Herzbild; die Fußnote dokumentiert die wörtlichere Form. Die Satzstellung hält den additiven Anschluss durch »auch« fest.
