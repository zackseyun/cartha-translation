base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/028.yaml
  text: 'which my soul still sought[a], but I did not find: one man among a thousand I found[b], but a woman among all these I did not find.'
translation:
  language: de
  text: 'was meine Seele noch suchte, aber ich nicht fand: Einen Mann unter tausend fand ich[a], doch eine Frau unter all diesen fand ich nicht.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen von tausend“.'
    reason: lexical_alternative
  - marker: b
    text: „Unter all diesen“ bezieht sich wahrscheinlich auf die gesamte Gruppe, die der Sprecher bei seiner Suche betrachtete. Der Vers berichtet von seinem Ergebnis und formuliert nicht ausdrücklich eine allgemeine Aussage über alle Frauen.
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר
  choice: was
  rationale: Das Relativpronomen führt den Gedanken aus dem vorhergehenden Vers weiter und lässt den syntaktischen Anschluss bewusst offen.
- source_word: עוֹד
  choice: noch
  rationale: Bezeichnet die fortdauernde Suche und entspricht natürlichem modernem Deutsch.
- source_word: בִּקְשָׁה נַפְשִׁי
  choice: meine Seele noch suchte
  rationale: Bewahrt die ausdrückliche hebräische Rede von der Seele als Subjekt, ohne den idiomatischen Ausdruck auf ein bloßes „ich suchte“ zu reduzieren.
- source_word: וְלֹא מָצָאתִי
  choice: ich aber nicht fand
  rationale: Der Subjektwechsel von „meine Seele“ zu „ich“ bleibt erhalten; „aber“ gibt den Gegensatz zwischen Suchen und Nichtfinden wieder.
- source_word: אָדָם
  choice: Mann
  rationale: Da אָדָם unmittelbar einer Frau gegenübergestellt wird, ist hier die geschlechtsspezifische Wiedergabe sachlich geboten.
- source_word: אֶחָד מֵאֶלֶף
  choice: einen Mann unter tausend
  rationale: Gibt die Zahlenaussage und die Suche innerhalb einer Gruppe idiomatisch wieder; „Mann“ wird aus dem vorangehenden אָדָם aufgenommen.
- source_word: מָצָאתִי
  choice: fand ich
  rationale: Direkte Wiedergabe des autobiografischen Berichts; die deutsche Wortstellung hebt das gefundene Einzelstück hervor.
- source_word: וְאִשָּׁה
  choice: doch eine Frau
  rationale: „Doch“ macht den im Zusammenhang liegenden Gegensatz deutlich, ohne zusätzliche Wertung einzutragen.
- source_word: בְכָל אֵלֶּה
  choice: unter all diesen
  rationale: Bewahrt den Bezug auf die Gesamtheit der bei dieser Suche betrachteten Gruppe und vermeidet eine ausdrückliche Universalisierung.
- source_word: לֹא מָצָאתִי
  choice: fand ich nicht
  rationale: Transparente Wiedergabe der verneinten Verbform ohne interpretierende Abschwächung oder Verschärfung.
theological_decisions:
- issue: Mögliche frauenfeindliche oder universalisierende Deutung
  choice: Die Aussage wird als direkter Bericht über das Ergebnis der Suche des Sprechers wiedergegeben.
  alternative: Die Aussage entweder abzuschwächen oder zu einem allgemeinen moralischen Urteil über alle Frauen auszuweiten.
  rationale: Der hebräische Text berichtet, was der Sprecher innerhalb der betrachteten Gruppe fand beziehungsweise nicht fand. Die Übersetzung bewahrt die anstößige Spannung, macht daraus aber keine über den Wortlaut hinausgehende Lehraussage über sämtliche Frauen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die hebräische Satzstruktur. Der Vers beginnt absichtlich als Fortsetzung des vorhergehenden Gedankens. Die Wiederholung von „fand ich“ bewahrt die rhetorische Form des Ausgangstextes.
