source:
  edition: WLC
  text: בְּ/י֤וֹם טוֹבָה֙ הֱיֵ֣ה בְ/ט֔וֹב וּ/בְ/י֥וֹם רָעָ֖ה רְאֵ֑ה גַּ֣ם אֶת זֶ֤ה לְ/עֻמַּת זֶה֙ עָשָׂ֣ה הָֽ/אֱלֹהִ֔ים עַל דִּבְרַ֗ת שֶׁ/לֹּ֨א יִמְצָ֧א הָֽ/אָדָ֛ם אַחֲרָ֖י/ו מְאֽוּמָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/014.yaml
  text: 'In a day of prosperity[a], be joyful; and in a day of adversity, consider: God has made the one as well as the other[c][b], so that man may not find out anything that will come after him.'
translation:
  language: de
  text: 'Am Tag des Glücks freue dich; am Tag des Unglücks aber bedenke: Das eine wie das andere hat Gott gemacht, damit der Mensch nichts herausfinden kann, was nach ihm kommt.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit der Mensch nichts herausfinden kann, was künftig geschehen wird.“'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיוֹם טוֹבָה
  choice: Am Tag des Glücks
  rationale: יוֹם bezeichnet hier eine Zeitlage, טוֹבָה günstige Umstände. „Tag des Glücks“ bewahrt die knappe Gegenüberstellung mit dem „Tag des Unglücks“.
- source_word: הֱיֵה בְטוֹב
  choice: freue dich
  rationale: Die idiomatische Aufforderung bedeutet, das Gute froh anzunehmen; „freue dich“ ist natürlich und knapp, ohne ein bloßes gutes Befinden auszudrücken.
- source_word: וּבְיוֹם רָעָה
  choice: doch am Tag des Unglücks
  rationale: רָעָה bezeichnet im Kontext widrige Umstände oder Unglück, nicht notwendig moralisches Böses. „doch“ markiert den deutlichen Gegensatz.
- source_word: רְאֵה
  choice: bedenke
  rationale: ראה fordert hier zu betrachtendem, reflektierendem Wahrnehmen auf; „bedenke“ gibt diese Bedeutung im Deutschen idiomatisch wieder.
- source_word: גַּם אֶת זֶה לְעֻמַּת זֶה עָשָׂה הָאֱלֹהִים
  choice: Auch diesen hat Gott ebenso wie jenen gemacht
  rationale: Die maskulinen Pronomen nehmen im Deutschen die beiden „Tage“ auf. Die Formulierung bewahrt das Gegenüber und schreibt beide Lebenslagen Gottes Handeln zu.
- source_word: עַל דִּבְרַת שֶׁלֹּא יִמְצָא הָאָדָם
  choice: damit der Mensch nicht herausfinden kann
  rationale: עַל דִּבְרַת leitet Zweck oder Folge ein; ימצא bezeichnet hier das Ermitteln oder Ergründen. הָאָדָם ist generisch und wird mit „der Mensch“ wiedergegeben.
- source_word: אַחֲרָיו מְאוּמָה
  choice: was nach ihm sein wird
  rationale: 'Die knappe hebräische Wendung bleibt mehrdeutig: Gemeint sein kann, was zeitlich nach dem Menschen oder allgemein künftig geschieht. Die deutsche Formulierung bewahrt diese Offenheit.'
theological_decisions:
- issue: Gottes Wirken in Glück und Unglück
  choice: Beide gegensätzlichen Lebenslagen werden ausdrücklich Gottes Machen zugeschrieben.
  alternative: Gott habe lediglich eine Lage der anderen gegenübergestellt, ohne dass sein Handeln am Unglück ausgesagt werde.
  rationale: Das Verb עשה steht mit Gott als Subjekt und umfasst „diesen ebenso wie jenen“. Die theologische Spannung wird weder abgeschwächt noch über den Wortlaut hinaus systematisiert.
- issue: Reichweite von אַחֲרָיו
  choice: „was nach ihm sein wird“
  alternative: „was künftig geschehen wird“
  rationale: Das Suffix „ihm“ wird im Haupttext bewahrt. Eine Fußnote erläutert die mögliche allgemeine Zukunftsbedeutung, ohne die Mehrdeutigkeit aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die paarige Bildsprache „Tag des Glücks / Tag des Unglücks“ und die knappe Weisheitsform bleiben erhalten; das generische הָאָדָם wird natürlich mit „der Mensch“ wiedergegeben.
