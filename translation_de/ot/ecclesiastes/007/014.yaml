- from: 'Am Tag des Glücks freue dich; doch am Tag des Unglücks bedenke: Auch diesen hat Gott ebenso wie jenen gemacht, damit der Mensch nicht herausfinden kann, was nach ihm sein wird.[a]'
  to: 'Am Tag des Glücks freue dich; am Tag des Unglücks aber bedenke: Das eine wie das andere hat Gott gemacht, damit der Mensch nichts herausfinden kann, was nach ihm kommt.[a]'
  rationale: Die Revision beseitigt die missverständliche pronominale Rückverweisung und gibt die paarige hebräische Wendung גַּם אֶת־זֶה לְעֻמַּת זֶה natürlich als „das eine wie das andere“ wieder. „Was nach ihm kommt“ steht näher bei אַחֲרָיו und bewahrt die offene Beziehung zur Zukunft; die Fußnote nennt die mögliche explizitere Zukunftsdeutung. Gottes Handeln an beiden Seiten des Gegensatzes bleibt uneingeschränkt erhalten.
