source:
  edition: WLC
  text: ט֥וֹב שֵׁ֖ם מִ/שֶּׁ֣מֶן ט֑וֹב וְ/י֣וֹם הַ/מָּ֔וֶת מִ/יּ֖וֹם הִוָּלְדֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/001.yaml
  text: A good name is better than good oil[a], and the day of death than the day of one's birth.
translation:
  language: de
  text: Ein guter Name ist besser als gutes Öl[a], und der Todestag ist besser als der Tag, an dem man geboren wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »als feines Duftöl« oder »als kostbare Salbe«; wörtlich: »als gutes Öl«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב שֵׁם
  choice: ein guter Ruf
  rationale: שֵׁם bedeutet wörtlich »Name«, bezeichnet in der Weisheitsliteratur aber häufig den Ruf oder das Ansehen eines Menschen. »Ein guter Ruf« gibt den gemeinten Sinn im heutigen Deutsch natürlich wieder.
- source_word: מִשֶּׁמֶן טוֹב
  choice: besser als gutes Öl
  rationale: מִן kennzeichnet den Vergleich; שֶׁמֶן ist wörtlich »Öl« und kann besonders wohlriechendes, kostbares Salböl meinen. Das Haupttextbild bleibt erhalten, während die Fußnote idiomatische Alternativen nennt.
- source_word: וְיוֹם הַמָּוֶת
  choice: und der Todestag
  rationale: Die kompakte deutsche Zusammensetzung gibt »Tag des Todes« natürlich und sprichwörtlich wieder.
- source_word: מִיּוֹם הִוָּלְדוֹ
  choice: besser als der Tag, an dem man geboren wird
  rationale: Das zweite »besser« wird aus der parallelen Vergleichskonstruktion ergänzt. Der Infinitiv mit maskulinem Singularsuffix bezeichnet hier in allgemeiner, sprichwörtlicher Rede den Tag der Geburt eines Menschen; die man-Konstruktion ist im Deutschen natürlich und bewahrt den generischen Sinn.
theological_decisions:
- issue: Die überraschende Höherwertung des Todestages gegenüber dem Geburtstag
  choice: Die Aussage wird ohne erklärende Einschränkung als »der Todestag besser als der Tag, an dem man geboren wird« wiedergegeben.
  alternative: Die Aussage auf ein gutes Lebensende oder den Tod eines Menschen mit gutem Ruf zu beziehen und dies ausdrücklich in den Text einzutragen.
  rationale: Der hebräische Wortlaut formuliert die Spannung knapp und lässt die genaue Begründung zunächst offen. Eine erläuternde Deutung im Haupttext würde die absichtliche Spannung vorschnell auflösen.
- issue: Generischer maskuliner Singular in הִוָּלְדוֹ
  choice: an dem man geboren wird
  alternative: an dem er geboren wurde
  rationale: Das Suffix ist grammatisch maskulin Singular, steht im Spruch aber repräsentativ für einen Menschen allgemein. Die deutsche man-Konstruktion bildet diese allgemeine Aussage natürlich ab, ohne sie auf eine bestimmte männliche Person einzuengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper sprichwörtlicher Struktur. »Guter Ruf« ist gegenüber dem wörtlichen »guter Name« im heutigen Deutsch unmittelbar verständlich; »gutes Öl« bewahrt zugleich das hebräische Bild. Das im zweiten Satzteil elliptisch fehlende Vergleichswort wird zur natürlichen Verständlichkeit wiederholt.
