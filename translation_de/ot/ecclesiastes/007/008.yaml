id: ECC.7.8
reference: Ecclesiastes 7:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: ט֛וֹב אַחֲרִ֥ית דָּבָ֖ר מֵֽ/רֵאשִׁית֑/וֹ ט֥וֹב אֶֽרֶךְ ר֖וּחַ מִ/גְּבַהּ רֽוּחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/008.yaml
  text: The end of a matter is better than its beginning[a]; patience is better than a proud spirit.
translation:
  language: de
  text: Besser ist das Ende einer Sache als ihr Anfang; besser ist ein geduldiger Geist[a] als ein hochmütiger Geist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „lang an Geist“; die hebräische Wendung bezeichnet Geduld, Langmut oder die Fähigkeit, nicht schnell zornig zu werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרִית
  choice: das Ende
  rationale: Das Substantiv bezeichnet das Ende, den späteren Verlauf oder den Ausgang. „Das Ende“ bewahrt den unmittelbaren zeitlichen Gegensatz zu רֵאשִׁית („Anfang“), ohne die mögliche Bedeutung eines Ergebnisses auszuschließen.
- source_word: דָּבָר
  choice: einer Sache
  rationale: דָּבָר kann „Wort“, „Ding“, „Angelegenheit“ oder „Sache“ bedeuten. Hier passt „Sache“ als natürliche, bewusst weit gefasste Bezeichnung für einen Vorgang oder eine Angelegenheit.
- source_word: מֵרֵאשִׁיתוֹ
  choice: als ihr Anfang
  rationale: Die Präposition מִן dient hier dem Vergleich. Das Suffix bezieht sich auf דָּבָר; im Deutschen nimmt „ihr“ das grammatische Geschlecht von „Sache“ auf.
- source_word: אֶרֶךְ רוּחַ
  choice: ein geduldiger Geist
  rationale: Die Wendung bedeutet wörtlich etwa „lang an Geist“ und bezeichnet Geduld, Langmut oder langsamen Zorn. „Ein geduldiger Geist“ ist verständlich und bewahrt zugleich das im Hebräischen ausdrücklich genannte רוּחַ sowie die Parallelität zum folgenden Ausdruck.
- source_word: מִגְּבַהּ רוּחַ
  choice: als ein hochmütiger Geist
  rationale: גְּבַהּ רוּחַ bezeichnet einen hohen beziehungsweise überheblichen Geist und damit Hochmut. „Hochmütiger Geist“ gibt die innere Haltung wieder und wahrt die Wiederholung von רוּחַ.
- source_word: טוֹב
  choice: besser
  rationale: טוֹב steht in beiden Satzhälften in einer ausdrücklichen Vergleichskonstruktion und wird daher idiomatisch mit „besser“ wiedergegeben.
theological_decisions: []
