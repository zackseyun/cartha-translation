id: ECC.7.12
reference: Ecclesiastes 7:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֛י בְּ/צֵ֥ל הַֽ/חָכְמָ֖ה בְּ/צֵ֣ל הַ/כָּ֑סֶף וְ/יִתְר֣וֹן דַּ֔עַת הַֽ/חָכְמָ֖ה תְּחַיֶּ֥ה בְעָלֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/012.yaml
  text: For wisdom is a shelter just as money is a shelter[b][a], but the advantage of knowledge is that wisdom preserves the life of its possessors.
translation:
  language: de
  text: 'Denn Weisheit bietet Schutz, und Geld bietet Schutz.[a] Doch der Vorzug der Erkenntnis ist: Weisheit erhält ihre Besitzer am Leben.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Denn im Schatten der Weisheit, im Schatten des Geldes.« »Schatten« ist im Hebräischen hier ein Bild für Schutz und Zuflucht.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Doch der Gewinn der Erkenntnis ist: Weisheit gibt ihren Besitzern Leben.« Das Verb kann auch »Leben geben« oder »lebendig erhalten« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet eine Begründung beziehungsweise Erläuterung zum vorausgehenden Gedanken ein.
- source_word: בְּצֵל הַחָכְמָה
  choice: Weisheit bietet Schutz
  rationale: Wörtlich steht »im Schatten der Weisheit«. Der Schatten ist hier ein Bild für schützende Deckung; die Wiedergabe formuliert dieses Bild in natürlichem Deutsch aus.
- source_word: בְּצֵל הַכָּסֶף
  choice: Geld bietet Schutz
  rationale: כֶּסֶף bezeichnet Silber und daraus abgeleitet Geld. Die parallele Formulierung bewahrt den Vergleich mit der Weisheit.
- source_word: וְיִתְרוֹן
  choice: Doch der Vorzug
  rationale: 'יִתְרוֹן kann Gewinn, Nutzen oder Vorzug bedeuten. »Doch« macht den im Zusammenhang angelegten Kontrast sichtbar: Beide schützen, Weisheit besitzt jedoch einen besonderen Vorteil.'
- source_word: דַּעַת
  choice: der Erkenntnis
  rationale: Bewahrt den substantivischen Erkenntnisbegriff und lässt die schwierige Beziehung zwischen Erkenntnis und Weisheit bestehen.
- source_word: תְּחַיֶּה
  choice: erhält … am Leben
  rationale: Das Piel von חיה kann »am Leben erhalten«, »Leben geben« oder »beleben« bedeuten. Im Schutzvergleich ist »am Leben erhalten« kontextuell passend, ohne die andere mögliche Nuance zu verschweigen.
- source_word: בְעָלֶיהָ
  choice: ihre Besitzer
  rationale: Gibt die wörtliche Vorstellung derjenigen wieder, die Weisheit besitzen; das feminine Pronomen bezieht sich auf die Weisheit.
theological_decisions:
- issue: Bedeutung von תְּחַיֶּה
  choice: erhält ihre Besitzer am Leben
  alternative: gibt ihren Besitzern Leben
  rationale: Der Kontext legt Bewahrung und Erhaltung nahe, doch die mögliche stärkere Bedeutung »Leben geben« bleibt in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur macht den Vergleich klar; die Fußnoten bewahren das hebräische Schattenbild und die Bedeutungsbreite des Verbs. Die sachlich ungewöhnliche Verbindung von Erkenntnis und Weisheit wird nicht harmonisiert.
