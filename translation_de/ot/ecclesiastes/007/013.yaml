  text: Consider the work of God[a], for who can straighten what he has made crooked?
translation:
  language: de
  text: Betrachte das Werk Gottes; denn wer kann gerade machen, was er gekrümmt hat?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „was er gebogen hat“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: Betrachte
  rationale: Der Imperativ fordert hier zu nachdenklicher Aufmerksamkeit auf, nicht nur zum körperlichen Sehen. „Betrachte“ gibt diesen weisheitlichen Sinn knapp und würdig wieder.
- source_word: מַעֲשֵׂה הָאֱלֹהִים
  choice: das Werk Gottes
  rationale: Die singularische Verbindung bezeichnet umfassend Gottes Tun beziehungsweise das von ihm Gewirkte. „Das Werk Gottes“ bewahrt Form und Bedeutungsweite des Hebräischen.
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion leitet die Begründung für die Aufforderung ein und wird im Deutschen natürlich mit „Denn“ wiedergegeben.
- source_word: מִי יוּכַל לְתַקֵּן
  choice: wer kann gerade machen
  rationale: Die rhetorische Frage nach dem Vermögen bleibt erhalten. „Gerade machen“ bewahrt zudem den konkreten Gegensatz zum folgenden Verb.
- source_word: אֵת אֲשֶׁר עִוְּתוֹ
  choice: was er gekrümmt hat
  rationale: „Gekrümmt“ erhält das räumliche Bild und den Kontrast zu „gerade machen“. Das maskuline Singularsuffix wird entsprechend dem unmittelbaren Bezug auf Gott mit „er“ wiedergegeben.
theological_decisions:
- issue: Bezug und Aussagekraft des maskulinen Singularsuffixes in עִוְּתוֹ
  choice: 'Das Subjekt ist Gott: Niemand kann gerade machen, was er gekrümmt hat.'
  alternative: was gekrümmt worden ist
  rationale: Der unmittelbare Zusammenhang nennt Gottes Werk; das Suffix verweist daher am natürlichsten auf Gott. Die persönliche Form bewahrt sowohl die hebräische Grammatik als auch die theologische Spannung, statt sie durch ein unpersönliches Passiv abzuschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt knapp und bildhaft; „Betrachte“ trägt den nachdenklichen Ton der Weisheitsliteratur, während „gerade machen“ und „gekrümmt“ den hebräischen Gegensatz sichtbar halten.
