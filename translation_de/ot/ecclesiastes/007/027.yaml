base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/027.yaml
  text: See, this is what I found, says Qoheleth, adding one thing to another to find the sum.
translation:
  language: de
  text: 'Sieh, das habe ich herausgefunden, sagt Kohelet: Ich fügte eins zum anderen, um das Ergebnis zu finden.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קֹהֶלֶת
  choice: Kohelet
  rationale: Die eingebürgerte deutsche Wiedergabe des hebräischen Titels bewahrt dessen Eigenart, ohne seine genaue Bedeutung vorschnell festzulegen.
- source_word: אַחַת לְאַחַת
  choice: eins zum anderen fügen
  rationale: Die Wendung beschreibt ein schrittweises Zusammenstellen oder Vergleichen einzelner Beobachtungen; die verbale Formulierung ergibt im Deutschen einen natürlichen Satz.
- source_word: חֶשְׁבּוֹן
  choice: Ergebnis
  rationale: Das Wort bezeichnet hier das Resultat einer prüfenden Berechnung oder Untersuchung. „Ergebnis“ passt zum Kontext, ohne eine bloß mathematische Summe zu erzwingen.
- source_word: מָצָאתִי
  choice: habe ich herausgefunden
  rationale: Neben dem wörtlichen „finden“ bezeichnet das Verb im Untersuchungskontext das Gewinnen einer Erkenntnis.
theological_decisions:
- issue: Grammatisches Geschlecht bei אָמְרָה קֹהֶלֶת
  choice: sagt Kohelet
  alternative: sagte die Kohelet
  rationale: Das feminine Verb stimmt mit der grammatischen Form des Titels überein. Im Deutschen wird „Kohelet“ herkömmlich als Titel oder Name behandelt; die Präsensformel ist idiomatisch und trifft die berichtende Funktion, ohne eine Aussage über das natürliche Geschlecht der sprechenden Gestalt zu erzwingen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der einleitende Aufmerksamkeitsruf „Sieh“ bleibt erhalten; der Doppelpunkt macht den anschließenden methodischen Zusatz klar, ohne die gedankliche Spannung des Verses aufzulösen.
