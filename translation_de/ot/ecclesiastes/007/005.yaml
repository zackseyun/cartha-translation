translation:
  language: de
  text: Es ist besser, die Zurechtweisung eines Weisen zu hören als das Lied von Toren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Es ist besser, die Zurechtweisung eines Weisen zu hören, als dass ein Mann das Lied von Toren hört.“ Das zweite Versglied lautet im Hebräischen wörtlich: „als ein Mann, der das Lied von Toren hört“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Es ist besser
  rationale: Das prädikativ gebrauchte Adjektiv eröffnet einen Vergleich; „Es ist besser“ ist im modernen Deutschen die natürliche vollständige Form.
- source_word: לִשְׁמֹעַ
  choice: zu hören
  rationale: Der Infinitiv bezeichnet die vorzuziehende Handlung. „Hören“ wahrt zudem die Wortverbindung zum Partizip שֹׁמֵעַ im zweiten Versglied.
- source_word: גַּעֲרַת
  choice: die Zurechtweisung
  rationale: Das Substantiv bezeichnet eine deutliche verbale Korrektur. „Zurechtweisung“ bewahrt deren Ernst und klingt würdig, ohne unnötig altertümlich zu sein.
- source_word: חָכָם
  choice: eines Weisen
  rationale: Das maskuline Singularwort bezeichnet hier einen weisen Menschen; die substantivierte Form „eines Weisen“ entspricht der Form des Ausgangstextes und ist im Kontext der Weisheitsliteratur idiomatisch.
- source_word: מֵאִישׁ
  choice: als
  rationale: מִן kennzeichnet den Vergleich. Im flüssigen Haupttext wird die ungewöhnliche hebräische Nominalkonstruktion geglättet; die ausdrückliche Angabe אִישׁ wird in der Fußnote dokumentiert.
- source_word: שֹׁמֵעַ
  choice: zu hören
  rationale: Das Partizip bedeutet wörtlich „hörend“. Die deutsche Vergleichskonstruktion lässt das Verb im zweiten Glied sachgerecht mitverstehen und erhält so einen natürlichen Parallelismus.
- source_word: שִׁיר
  choice: das Lied
  rationale: Der Singular kann ein konkretes oder allgemein-typisches Lied beziehungsweise Singen bezeichnen. „Das Lied“ gibt die bildhafte Gegenüberstellung zur Zurechtweisung knapp wieder.
- source_word: כְּסִילִים
  choice: von Toren
  rationale: Das Wort bezeichnet in der Weisheitsliteratur nicht bloß Ungebildete, sondern moralisch und geistlich Uneinsichtige. „Toren“ bewahrt diesen prägnanten weisheitlichen Sinn.
