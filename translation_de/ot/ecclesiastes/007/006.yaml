  text: כִּ֣י כְ/ק֤וֹל הַ/סִּירִים֙ תַּ֣חַת הַ/סִּ֔יר כֵּ֖ן שְׂחֹ֣ק הַ/כְּסִ֑יל וְ/גַם זֶ֖ה הָֽבֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/006.yaml
  text: For like the crackling of thorns under a pot[a], so is the laughter of the fool[b]; this too is vapor.
translation:
  language: de
  text: Denn wie das Prasseln von Dornen unter dem Topf[a], so ist das Lachen des Toren; auch das ist Hauch[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wie das Geräusch der Dornen unter dem Topf“. Gemeint ist offenbar ihr scharfes Prasseln beim Verbrennen.'
    reason: lexical_alternative
  - marker: b
    text: Hebräisch hevel; auch mit „Dunst“, „Nichtigkeit“ oder „Vergänglichkeit“ wiedergegeben. Das Wort bezeichnet wörtlich einen Hauch und steht bildlich für etwas Flüchtiges und Ungreifbares.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die begründende Erläuterung zum vorausgehenden Gedanken ein, ohne den Zusammenhang stärker kausal festzulegen als der hebräische Text.
- source_word: כְקוֹל הַסִּירִים
  choice: wie das Prasseln von Dornen
  rationale: קוֹל bedeutet wörtlich „Stimme“ oder „Geräusch“; „Prasseln“ gibt hier natürlich und anschaulich das scharfe Geräusch brennender Dornen wieder. הַסִּירִים bezeichnet dornige Pflanzen, die rasch verbrennen.
- source_word: תַּחַת הַסִּיר
  choice: unter einem Topf
  rationale: Gemeint ist ein Kochgefäß. Der unbestimmte Artikel entspricht im Deutschen dem allgemeinen, sprichwortartigen Vergleich.
- source_word: כֵּן שְׂחֹק הַכְּסִיל
  choice: so ist das Lachen des Toren
  rationale: Die Formulierung bewahrt die hörbare Parallele zwischen dem Prasseln und dem Lachen. „Tor“ ist der etablierte, würdige Weisheitsbegriff für einen Menschen, dem sittliche und verständige Einsicht fehlt.
- source_word: וְגַם זֶה
  choice: auch das
  rationale: Gibt die additive Bewertung knapp und idiomatisch wieder.
- source_word: הָבֶל
  choice: Hauch
  rationale: Das Leitwort Kohelets bezeichnet wörtlich einen Hauch oder Dunst und kann bildlich Vergänglichkeit, Unbeständigkeit und mangelnde Greifbarkeit ausdrücken. „Hauch“ erhält das konkrete Bild, ohne es auf „Nichtigkeit“ oder „Sinnlosigkeit“ festzulegen.
theological_decisions:
- issue: Bedeutungsweite von הָבֶל
  choice: Hauch
  alternative: Nichtigkeit; Sinnlosigkeit; Dunst
  rationale: 'Die Übersetzung bewahrt die bildhafte und theologisch offene Spannung des Leitworts: Es kann Flüchtigkeit und Unfassbarkeit bezeichnen, ohne notwendig ein abschließendes Urteil völliger Wertlosigkeit auszusprechen.'
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit knapper, sprichwortartiger Satzgestalt. „Prasseln“ macht das Klangbild natürlich hörbar; „Hauch“ wahrt die zentrale Metapher und ihre Mehrdeutigkeit.
