id: ECC.7.16
reference: Ecclesiastes 7:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אַל תְּהִ֤י צַדִּיק֙ הַרְבֵּ֔ה וְ/אַל תִּתְחַכַּ֖ם יוֹתֵ֑ר לָ֖/מָּה תִּשּׁוֹמֵֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/016.yaml
  text: Do not be overly righteous[a], and do not make yourself too wise[b]. Why should you ruin yourself?
translation:
  language: de
  text: Sei nicht allzu gerecht[a], und sei nicht übermäßig weise[b]. Warum solltest du dich selbst zugrunde richten?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „Sei nicht in übermäßigem Maß gerecht.“ Die Formulierung kann vor selbstgerechter Übersteigerung warnen, benennt diese Deutung aber nicht ausdrücklich.'
    reason: lexical_alternative
  - marker: b
    text: 'Das hebräische Verb ist reflexiv und kann auch bedeuten: „Erweise dich nicht als allzu weise“ oder „Mach dich nicht übermäßig weise.“'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Warum solltest du zugrunde gehen?“ Das hebräische Verb kann auch das Verödet- oder Verwüstetwerden sowie das Erstarren vor Entsetzen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תְּהִי
  choice: Sei nicht
  rationale: Die Negationspartikel אַל mit dem Imperfekt von היה formuliert ein Verbot beziehungsweise eine eindringliche Warnung. „Sei nicht“ gibt dies im Deutschen knapp und natürlich wieder.
- source_word: צַדִּיק הַרְבֵּה
  choice: allzu gerecht
  rationale: צַדִּיק bezeichnet einen Gerechten beziehungsweise jemanden, der gerecht ist; הַרְבֵּה kennzeichnet hier das problematische Übermaß. „Allzu gerecht“ bewahrt die zugespitzte, bewusst spannungsreiche Formulierung.
- source_word: וְאַל תִּתְחַכַּם יוֹתֵר
  choice: und sei nicht übermäßig weise
  rationale: Das Hitpael von חכם kann reflexiv oder als ein Sich-weise-Erweisen verstanden werden; יוֹתֵר bezeichnet hier ein Überschreiten des Maßes. Die Hauptfassung ist natürliches modernes Deutsch, während die Fußnote die reflexive Nuance offenhält.
- source_word: לָמָּה
  choice: Warum solltest du
  rationale: Die Frage ist rhetorisch und hat warnenden Charakter. Der deutsche Konjunktiv gibt diesen Sinn idiomatisch wieder.
- source_word: תִּשּׁוֹמֵם
  choice: dich selbst zugrunde richten
  rationale: Die Form von שמם kann Verwüstung, Verödung oder Entsetzen ausdrücken. Im Zusammenhang bezeichnet sie wahrscheinlich die selbstschädigende Folge des zuvor beschriebenen Übermaßes; „zugrunde richten“ ist verständlich, ohne die stärkere Aussage „vernichten“ zwingend festzulegen.
theological_decisions:
- issue: Warnung davor, „allzu gerecht“ und „übermäßig weise“ zu sein
  choice: Die paradoxe Warnung vor einem selbstschädigenden Übermaß bleibt im Wortlaut stehen.
  alternative: Die Aussage ausdrücklich als Warnung allein vor Selbstgerechtigkeit, vorgetäuschter Frömmigkeit oder öffentlicher Selbstdarstellung wiederzugeben.
  rationale: הַרְבֵּה und יוֹתֵר kennzeichnen ein Übermaß, doch der Vers benennt dessen genaue Art nicht ausdrücklich. Eine Deutung als Selbstgerechtigkeit ist möglich, sollte aber nicht in den Haupttext eingetragen werden. So bleibt die theologische Spannung erhalten, ohne Gerechtigkeit oder Weisheit als solche abzuwerten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdevoller Mahnrede. Die anstößig-paradoxe Wendung „allzu gerecht“ wird nicht erklärend geglättet. „Übermäßig weise“ hält den Parallelismus aufrecht; die reflexive Verbnuance wird in der Fußnote ausgewiesen.
