  text: אַל תִּרְשַׁ֥ע הַרְבֵּ֖ה וְ/אַל תְּהִ֣י סָכָ֑ל לָ֥/מָּה תָמ֖וּת בְּ/לֹ֥א עִתֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/017.yaml
  text: Do not be excessively wicked, and do not be a fool. Why should you die before your time?
translation:
  language: de
  text: Sei nicht übermäßig böse[a] und sei kein Narr. Warum solltest du vor deiner Zeit sterben?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sei nicht allzu böse.“ Das Hebräische enthält ausdrücklich eine Gradangabe. Dadurch entsteht im Zusammenhang eine bewusste Spannung; irgendein Maß an Bosheit wird damit nicht gutgeheißen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „nicht zu deiner Zeit“, das heißt: vor deiner angemessenen oder erwarteten Zeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּרְשַׁע
  choice: sei … böse
  rationale: Das Qal von רשע bezeichnet hier böses beziehungsweise schuldhaftes Verhalten oder Wesen. „Böse sein“ bewahrt die moralische Kategorie knapp und verständlich, ohne eine speziell konfessionelle Deutung einzutragen.
- source_word: הַרְבֵּה
  choice: übermäßig
  rationale: Der Gradbegriff modifiziert das Verbot und erzeugt im Zusammenhang bewusst eine Spannung. „Übermäßig“ gibt diese Steigerung in natürlichem, aber nicht verharmlosendem Deutsch wieder.
- source_word: תְּהִי סָכָל
  choice: sei kein Narr
  rationale: Die Verbindung aus היה und dem Substantiv סָכָל wird nominal wiedergegeben. „Narr“ entspricht dem weisheitlichen Gegensatz zur Einsicht und ist würdevoller sowie semantisch treffender als „Dummkopf“.
- source_word: לָמָּה
  choice: warum solltest
  rationale: Die Formulierung leitet eine mahnende rhetorische Frage ein; der deutsche Konjunktiv „solltest“ gibt diesen Ton natürlich wieder.
- source_word: תָמוּת
  choice: du … sterben
  rationale: Direkte Wiedergabe des Qal-Imperfekts von מות innerhalb der rhetorischen Frage.
- source_word: בְּלֹא עִתֶּךָ
  choice: vor deiner Zeit
  rationale: Die idiomatische Wiedergabe bezeichnet einen Tod vor der eigenen erwarteten beziehungsweise angemessenen Zeit, ohne „bestimmt“ oder „festgesetzt“ in den Text einzutragen.
theological_decisions:
- issue: Ob die Formulierung maßvolle Bosheit zu billigen scheint
  choice: Der Gradbegriff „übermäßig“ bleibt erhalten, sodass die bewusste Spannung des hebräischen Weisheitsspruchs sichtbar bleibt.
  alternative: „Sei überhaupt nicht böse“ oder „Handle nicht böse“ ohne Gradangabe.
  rationale: Der hebräische Text sagt ausdrücklich אַל תִּרְשַׁע הַרְבֵּה und steht in pointierter Beziehung zum vorangehenden Vers. Die Übersetzung soll diese Spannung weder in eine Erlaubnis zu begrenzter Bosheit umdeuten noch durch Tilgung des Gradbegriffs auflösen.
- issue: Bedeutung von „deiner Zeit“
  choice: „vor deiner Zeit“ als Warnung vor vorzeitigem Tod.
  alternative: „vor deiner festgesetzten Zeit“ beziehungsweise „nicht zu deiner Zeit“.
  rationale: Der Kontext stützt die idiomatische Bedeutung eines vorzeitigen Todes. Das Wort „festgesetzt“ wäre jedoch eine theologische Präzisierung, die im hebräischen Ausdruck selbst nicht ausdrücklich steht.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem weisheitlichem Ton. Die Anrede bleibt im Singular. „Narr“ erhält den nominalen Charakter von סָכָל und passt zum Register der Weisheitsliteratur; die provokante Gradangabe wird nicht geglättet.
