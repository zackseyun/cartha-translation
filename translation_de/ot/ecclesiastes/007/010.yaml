  text: אַל תֹּאמַר֙ מֶ֣ה הָיָ֔ה שֶׁ֤/הַ/יָּמִים֙ הָ/רִ֣אשֹׁנִ֔ים הָי֥וּ טוֹבִ֖ים מֵ/אֵ֑לֶּה כִּ֛י לֹ֥א מֵ/חָכְמָ֖ה שָׁאַ֥לְתָּ עַל זֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/010.yaml
  text: Do not say[b][a], “Why were the former days better than these?” For it is not from wisdom that you ask this.
translation:
  language: de
  text: 'Sag nicht: „Warum waren die früheren Tage besser als diese?“ Denn nicht aus Weisheit fragst du danach.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: Sag nicht
  rationale: Die Verneinung אַל mit dem Imperfekt formuliert ein Verbot an eine einzelne angesprochene Person; „Sag nicht“ ist die natürliche deutsche Entsprechung.
- source_word: מֶה הָיָה
  choice: Warum waren
  rationale: Die hebräische Wendung fragt hier idiomatisch nach dem Grund. Eine wörtliche Wiedergabe mit „Was war es“ wäre im Deutschen schwer verständlich.
- source_word: הַיָּמִים הָרִאשֹׁנִים
  choice: die früheren Tage
  rationale: Die Formulierung bezeichnet vergangene Zeiten, ohne festzulegen, ob persönliche Lebenszeit oder Geschichte gemeint ist.
- source_word: הָיוּ טוֹבִים מֵאֵלֶּה
  choice: besser als diese
  rationale: Die Vergleichskonstruktion wird im Deutschen natürlich mit dem Komparativ wiedergegeben; „diese“ verweist auf die gegenwärtigen Tage.
- source_word: כִּי
  choice: Denn
  rationale: כִּי leitet hier die Begründung des vorausgehenden Verbots ein und wahrt mit „Denn“ den sprichwortartigen Ton.
- source_word: לֹא מֵחָכְמָה
  choice: nicht aus Weisheit
  rationale: „Aus Weisheit“ bewahrt die durch מִן ausgedrückte Herkunft beziehungsweise Grundlage der Frage.
- source_word: שָׁאַלְתָּ עַל זֶה
  choice: fragst du danach
  rationale: Obwohl שָׁאַלְתָּ formal ein Perfekt ist, lässt der allgemeine, sprichwortartige Zusammenhang im Deutschen ein Präsens zu. „Danach fragen“ gibt עַל זֶה idiomatisch vollständig wieder.
