source:
  edition: WLC
  text: ט֞וֹב לָ/לֶ֣כֶת אֶל בֵּֽית אֵ֗בֶל מִ/לֶּ֨כֶת֙ אֶל בֵּ֣ית מִשְׁתֶּ֔ה בַּ/אֲשֶׁ֕ר ה֖וּא ס֣וֹף כָּל הָ/אָדָ֑ם וְ/הַ/חַ֖י יִתֵּ֥ן אֶל לִבּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/002.yaml
  text: It is better to go to a house of mourning than to go to a house of feasting[a], because that is the end of every person, and the living should take it to heart.
translation:
  language: de
  text: Es ist besser, in ein Haus der Trauer zu gehen als in ein Haus, in dem gefeiert wird; denn das ist das Ende jedes Menschen[a], und wer noch lebt, soll es sich zu Herzen nehmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Ende der ganzen Menschheit“. Das hebräische Wort אָדָם bezeichnet hier die Menschheit allgemein.'
    reason: alternative_reading
lexical_decisions:
- source_word: טוֹב
  choice: Es ist besser
  rationale: Das wertende Adjektiv leitet einen vergleichenden Weisheitsspruch ein; im Deutschen ergibt die Ergänzung „Es ist“ einen natürlichen vollständigen Satz.
- source_word: לָלֶכֶת / מִלֶּכֶת
  choice: zu gehen … als … zu gehen
  rationale: הלך bezeichnet hier das Aufsuchen zweier Orte beziehungsweise Anlässe; „gehen“ ist die natürliche deutsche Entsprechung.
- source_word: בֵּית אֵבֶל
  choice: ein Haus der Trauer
  rationale: Die Konstruktverbindung bezeichnet ein Haus, in dem getrauert wird. Die Formulierung bewahrt das Bild und vermeidet die mögliche moderne Verengung von „Trauerhaus“ auf ein Bestattungsinstitut.
- source_word: בֵּית מִשְׁתֶּה
  choice: ein Haus des Festmahls
  rationale: מִשְׁתֶּה bezeichnet ein Fest oder Bankett, häufig mit Trinken. „Festmahl“ bildet einen klaren, würdigen Gegensatz zur Trauer.
- source_word: בַּאֲשֶׁר
  choice: denn
  rationale: Die Konjunktion führt die Begründung des vorangehenden Vergleichs ein; „denn“ bewahrt den kausalen Zusammenhang in natürlichem Deutsch.
- source_word: סוֹף כָּל הָאָדָם
  choice: das Ende jedes Menschen
  rationale: אָדָם ist hier generisch und bezieht sich auf Menschen insgesamt. „Jedes Menschen“ gibt die distributive Form wieder, ohne eine männliche Einschränkung nahezulegen.
- source_word: וְהַחַי
  choice: und wer noch lebt
  rationale: Der substantivierte Singular ist generisch. „Wer noch lebt“ gibt ihn idiomatisch wieder und hebt im Kontext der Sterblichkeit den Gegensatz zum Tod hervor.
- source_word: יִתֵּן אֶל לִבּוֹ
  choice: soll es sich zu Herzen nehmen
  rationale: Die wörtliche Wendung „zu seinem Herzen geben“ fordert zu ernsthafter innerer Besinnung auf. Die deutsche Redewendung bewahrt diesen Sinn; „soll“ macht die weisheitliche Aufforderung deutlich.
theological_decisions:
- issue: Generische Bedeutung von הָאָדָם in der Aussage über die Sterblichkeit
  choice: jedes Menschen
  alternative: der ganzen Menschheit
  rationale: Der Ausdruck umfasst alle Menschen und nicht nur Männer. Die gewählte distributive Form entspricht כָּל mit dem generischen אָדָם; die kollektive Lesart bleibt in der Fußnote sichtbar.
- issue: Bezug von „das“ in „das ist das Ende“
  choice: das
  alternative: der Tod
  rationale: Das hebräische הוּא verweist im Zusammenhang auf Tod beziehungsweise Trauer, benennt den Bezug aber nicht ausdrücklich. Die pronominale Wiedergabe bewahrt diese knappe Offenheit, statt sie durch „der Tod“ auszulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Struktur „Haus der Trauer … Haus des Festmahls“ bewahrt den bildhaften Gegensatz; die Formulierung bleibt verständlich, ohne den hebräischen Weisheitsspruch unnötig auszudeuten.
