source:
  edition: WLC
  text: טוֹבָ֥ה חָכְמָ֖ה עִֽם נַחֲלָ֑ה וְ/יֹתֵ֖ר לְ/רֹאֵ֥י הַ/שָּֽׁמֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/011.yaml
  text: Wisdom is good with an inheritance[b][a], and an advantage to those who see the sun.
translation:
  language: de
  text: Weisheit ist gut in Verbindung mit einer Erbschaft[a] und von Vorteil für die, die die Sonne sehen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Weisheit ist ebenso gut wie eine Erbschaft.“ Die hebräische Formulierung kann Weisheit mit einer Erbschaft vergleichen oder beides zusammen empfehlen.'
    reason: lexical_alternative
  - marker: b
    text: „Die Sonne sehen“ ist eine bildhafte Bezeichnung für die Lebenden, also für Menschen, die in dieser Welt leben.
    reason: cultural_note
lexical_decisions:
- source_word: טוֹבָה
  choice: ist gut
  rationale: Das prädikative Adjektiv bedeutet hier „gut“. Da der hebräische Satz kein ausdrückliches Verb enthält, wird „ist“ im Deutschen ergänzt; ein Komparativ wie „besser“ steht nicht ausdrücklich im Text.
- source_word: חָכְמָה
  choice: Weisheit
  rationale: Die übliche Wiedergabe in Kohelet; gemeint ist lebenspraktische Einsicht, ohne den Begriff darauf zu verengen.
- source_word: עִם
  choice: zusammen mit
  rationale: Die Präposition bezeichnet am naheliegendsten Begleitung oder Verbindung. Die mögliche vergleichende Auffassung bleibt in Fußnote [a] erhalten.
- source_word: נַחֲלָה
  choice: einer Erbschaft
  rationale: Der Ausdruck bezeichnet Erbbesitz beziehungsweise eine Erbschaft. „Erbschaft“ vermeidet die im Deutschen bei „ein Erbe“ naheliegende Bedeutung „männlicher Erbe“.
- source_word: וְיֹתֵר
  choice: und ein Vorteil
  rationale: יֹתֵר kann einen Mehrwert, Nutzen oder Vorteil bezeichnen. Die substantivische Wiedergabe passt zur knappen hebräischen Konstruktion und zur folgenden לְ-Verbindung.
- source_word: לְרֹאֵי
  choice: für alle, die … sehen
  rationale: Die Präposition לְ wird bei „Vorteil“ idiomatisch mit „für“ wiedergegeben. Das substantivierte Partizip wird als Relativsatz ausgedrückt; „alle“ bezeichnet die durch das Partizip erfasste Gruppe, ohne sie näher zu bestimmen.
- source_word: הַשָּׁמֶשׁ
  choice: die Sonne
  rationale: Die wörtliche Bildsprache bleibt erhalten. Im Zusammenhang bezeichnet „die Sonne sehen“ die Lebenden.
theological_decisions:
- issue: Verhältnis von Weisheit und Erbschaft
  choice: Weisheit wird zusammen mit einer Erbschaft als gut bezeichnet.
  alternative: Weisheit ist ebenso gut wie eine Erbschaft.
  rationale: Die hebräische Verbindung mit עִם kann hier sowohl ein Zusammenwirken als auch einen Vergleich nahelegen. Der Haupttext folgt der gewöhnlichen Bedeutung „mit“, während Fußnote [a] die echte syntaktische Mehrdeutigkeit wahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Satzstruktur und das Bild vom Sehen der Sonne bleiben erhalten; die schwer im Haupttext abzubildende Mehrdeutigkeit von עִם wird durch eine Fußnote transparent gemacht.
