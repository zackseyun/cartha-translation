  - severity: low
    issue: Leicht sperrige Formulierung „gut zusammen mit“
    rationale: Die Formulierung ist verständlich, wirkt jedoch weniger idiomatisch als „gut in Verbindung mit“. Die alternative Vergleichslesart bleibt weiterhin in der Fußnote gesichert.
