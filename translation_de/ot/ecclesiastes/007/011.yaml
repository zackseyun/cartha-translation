  to: Weisheit ist gut in Verbindung mit einer Erbschaft[a] und von Vorteil für die, die die Sonne sehen.[b]
  rationale: Die Revision glättet die deutsche Syntax und entfernt die nicht ausdrücklich im Ausgangstext enthaltene Verallgemeinerung „alle“. Sie bewahrt sowohl die primäre Lesart von עִם als Verbindung als auch die in der Fußnote ausgewiesene Vergleichsmöglichkeit. Die Fußnotenanker bleiben jeweils beim einschlägigen Ausdruck.
