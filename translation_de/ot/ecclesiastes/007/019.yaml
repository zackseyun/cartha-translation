  text: Wisdom gives strength to a wise man more than ten rulers who were in a city[a].
translation:
  language: de
  text: Die Weisheit verleiht einem Weisen mehr Kraft als zehn Herrscher, die in der Stadt waren[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in einer Stadt“. Die hebräische Form ist bestimmt („in der Stadt“), doch der Ausspruch kann allgemein und nicht auf eine bestimmte Stadt bezogen gemeint sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחָכְמָה
  choice: die Weisheit
  rationale: Der bestimmte Artikel wird im Deutschen natürlich wiedergegeben; das abstrakte Substantiv wird dabei nicht personifiziert.
- source_word: תָּעֹז
  choice: verleiht … Kraft
  rationale: Die Wendung gibt die stärkende beziehungsweise Kraft verleihende Bedeutung des Verbs klar und in natürlichem Deutsch wieder.
- source_word: לֶחָכָם
  choice: einem Weisen
  rationale: Das Präfix ל bezeichnet hier den Empfänger beziehungsweise Begünstigten; die substantivierte Form bewahrt den singularischen Personenbezug.
- source_word: מֵעֲשָׂרָה
  choice: mehr … als zehn
  rationale: מִן markiert hier den Vergleich und wird idiomatisch mit „mehr … als“ wiedergegeben.
- source_word: שַׁלִּיטִים
  choice: Machthaber
  rationale: Das Wort bezeichnet Personen, die Herrschaft oder Autorität ausüben; „Machthaber“ bleibt breit und passt zum städtischen Kontext.
- source_word: אֲשֶׁר הָיוּ בָּעִיר
  choice: die in der Stadt sind
  rationale: Der Relativsatz bezieht sich auf die zehn Machthaber. Das Hebräische verwendet eine bestimmte Form; das deutsche Präsens entspricht dem allgemeinen, sprichwortartigen Sinn natürlicher als ein vergangenheitsbezogenes „waren“.
