source:
  edition: WLC
  text: כָּל זֹ֖ה נִסִּ֣יתִי בַֽ/חָכְמָ֑ה אָמַ֣רְתִּי אֶחְכָּ֔מָה וְ/הִ֖יא רְחוֹקָ֥ה מִמֶּֽ/נִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/023.yaml
  text: All this I tested by wisdom[a]. I said[c][b], “I will become wise,” but it was far from me.
translation:
  language: de
  text: 'All dies prüfte ich mit Weisheit. Ich sagte: »Ich will weise werden.« Doch sie war mir fern.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל זֹה
  choice: All dies
  rationale: Die Verbindung aus כָּל und dem singularischen Demonstrativpronomen fasst die vorangehenden Überlegungen als Ganzes zusammen; »all dies« ist im Deutschen präzise und natürlich.
- source_word: נִסִּיתִי
  choice: prüfte ich
  rationale: Das Piel von נסה bezeichnet hier ein untersuchendes Erproben oder Prüfen und passt zu Kohelets reflektierendem Vorgehen.
- source_word: בַחָכְמָה
  choice: mit Weisheit
  rationale: Die Präposition ב bezeichnet hier Mittel oder Instrument. »Mit Weisheit« gibt dies im modernen Deutschen idiomatisch wieder.
- source_word: אָמַרְתִּי
  choice: Ich sagte
  rationale: Die direkte Wiedergabe wahrt das gewöhnliche Verb »sagen«; im Zusammenhang kann es zugleich einen inneren Entschluss einleiten.
- source_word: אֶחְכָּמָה
  choice: Ich will weise werden
  rationale: Die Verbform drückt ein Streben oder einen Entschluss aus. »weise werden« bewahrt die Bewegung hin zu einer noch nicht erreichten Weisheit.
- source_word: וְהִיא
  choice: Doch sie
  rationale: Das Pronomen greift die feminine »Weisheit« auf. Das formal verbindende ו erhält im Kontext eine adversative Nuance, die »doch« natürlich ausdrückt.
- source_word: רְחוֹקָה מִמֶּנִּי
  choice: blieb mir fern
  rationale: Die Formulierung gibt die Distanz direkt wieder. »blieb« verdeutlicht im Kontext das Scheitern des angestrebten Zugriffs, ohne die Aussage stärker als »unerreichbar« festzulegen.
theological_decisions:
- issue: Reichweite menschlicher Weisheit
  choice: Die Weisheit »blieb mir fern«
  alternative: Die Weisheit war für mich unerreichbar
  rationale: Der hebräische Text spricht von Ferne, nicht ausdrücklich von absoluter Unerreichbarkeit. Die Übersetzung wahrt diese Spannung und vermeidet eine weitergehende theologische Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurze Satzfolge und das Bild räumlicher Ferne bleiben erhalten; die feminine Rückverweisung »sie« macht den Bezug auf die Weisheit deutlich.
