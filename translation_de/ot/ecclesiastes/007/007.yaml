source:
  edition: WLC
  text: כִּ֥י הָ/עֹ֖שֶׁק יְהוֹלֵ֣ל חָכָ֑ם וִֽ/יאַבֵּ֥ד אֶת לֵ֖ב מַתָּנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/007.yaml
  text: For oppression drives a wise man mad[b][a], and a bribe destroys the heart.
translation:
  language: de
  text: Denn Unterdrückung bringt einen Weisen um den Verstand, und ein Bestechungsgeschenk[b] richtet das Herz[a] zugrunde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das „Herz“ bezeichnet im Hebräischen häufig den inneren Menschen, darunter Urteilskraft, Einsicht und Willen.
    reason: cultural_note
  - marker: b
    text: 'Oder: „eine Gabe“. Das hebräische Wort kann allgemein ein Geschenk bezeichnen; der Zusammenhang legt hier jedoch ein korrumpierendes Geschenk nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion führt eine Begründung beziehungsweise Erläuterung zum vorausgehenden Gedanken ein; „Denn“ gibt diesen argumentativen Anschluss natürlich wieder.
- source_word: הָעֹשֶׁק
  choice: Unterdrückung
  rationale: Das Substantiv bezeichnet unterdrückerische Ausbeutung und kann auch Erpressung einschließen. „Unterdrückung“ bewahrt die soziale und moralische Bedeutungsbreite.
- source_word: יְהוֹלֵל
  choice: macht … zum Narren
  rationale: Die Verbform bezeichnet hier das Verursachen törichten, irrationalen oder rasenden Verhaltens. „Macht … zum Narren“ ist idiomatisch, vermeidet eine unnötig klinische Deutung und bewahrt die Verbindung von Weisheit und Torheit.
- source_word: חָכָם
  choice: einen Weisen
  rationale: Das substantivierte maskuline Adjektiv steht im sprichwörtlichen Singular. „Einen Weisen“ bildet Form und Aussage prägnant ab.
- source_word: וִיאַבֵּד
  choice: richtet … zugrunde
  rationale: Das Hifil von אבד bedeutet zugrunde richten, ruinieren oder vernichten. Die Wendung wahrt die starke Aussage und klingt mit „Herz“ im Deutschen natürlich.
- source_word: אֶת לֵב
  choice: das Herz
  rationale: „Herz“ bewahrt das hebräische Bild für die innere Person, besonders Urteilskraft, Einsicht und Willen; eine Fußnote erläutert den weiteren Bedeutungsumfang.
- source_word: מַתָּנָה
  choice: ein Bestechungsgeschenk
  rationale: Das Wort kann allgemein „Gabe/Geschenk“ bedeuten. Im negativen Zusammenhang mit Unterdrückung und innerer Zerstörung bezeichnet es sehr wahrscheinlich ein korrumpierendes Geschenk; „Bestechungsgeschenk“ hält sowohl den Geschenkcharakter als auch die negative Funktion fest.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die sprichwörtliche Kürze und der Parallelismus werden bewahrt. „Zum Narren machen“ gibt die Spannung zwischen Weisheit und irrationalem Verhalten wieder, ohne den Ausdruck medizinisch als psychische Erkrankung festzulegen.
