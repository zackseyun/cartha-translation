source:
  edition: WLC
  text: אֶת הַ/כֹּ֥ל רָאִ֖יתִי בִּ/ימֵ֣י הֶבְלִ֑/י יֵ֤שׁ צַדִּיק֙ אֹבֵ֣ד בְּ/צִדְק֔/וֹ וְ/יֵ֣שׁ רָשָׁ֔ע מַאֲרִ֖יךְ בְּ/רָעָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/015.yaml
  text: 'I have seen it all in the days of my vanity: there is a righteous man perishing in his righteousness[c][b][a], and there is a wicked man prolonging his life in his evil.'
translation:
  language: de
  text: 'Dies alles habe ich in den Tagen meiner Nichtigkeit[a] gesehen: Da ist ein gerechter Mann, der in seiner Gerechtigkeit zugrunde geht[b], und da ist ein böser Mann, der in seiner Bosheit lange lebt[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „in den Tagen meiner Vergänglichkeit“, „meines flüchtigen Daseins“ oder bildhaft „meines Hauchs“. Das hebräische Wort הֶבֶל ist ein Schlüsselwort im Buch Prediger und bezeichnet Vergänglichkeit, Unfassbarkeit und Vergeblichkeit.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „der trotz seiner Gerechtigkeit zugrunde geht“. Das Hebräische lässt das genaue Verhältnis zwischen seinem Ergehen und seiner Gerechtigkeit offen.'
    reason: alternative_reading
  - marker: c
    text: 'Auch: „der trotz seiner Bosheit sein Leben verlängert“ oder „der in seiner Bosheit seine Tage verlängert“.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֶת הַכֹּל רָאִיתִי
  choice: Dies alles habe ich … gesehen
  rationale: Die Formulierung gibt den umfassenden Rückblick natürlich wieder; das Perfekt passt zum betrachtenden Erfahrungsbericht des Predigers.
- source_word: בִּימֵי הֶבְלִי
  choice: in den Tagen meiner Nichtigkeit
  rationale: „Nichtigkeit“ wahrt das thematische Schlüsselwort הֶבֶל und umfasst Vergänglichkeit, Unfassbarkeit und Vergeblichkeit. Die Fußnote verdeutlicht, dass hier nicht moralische Eitelkeit gemeint ist.
- source_word: יֵשׁ ... וְיֵשׁ
  choice: Da ist … und da ist
  rationale: Die wiederholte Existenzformel bewahrt den ausgewogenen, spruchhaften Satzbau des Hebräischen.
- source_word: צַדִּיק
  choice: ein gerechter Mann
  rationale: Das substantivierte maskuline Singularwort bezeichnet hier einen repräsentativen einzelnen Mann.
- source_word: אֹבֵד
  choice: zugrunde geht
  rationale: Die Wendung kann Sterben wie auch umfassenderes Verderben oder Scheitern bezeichnen und ist daher weiter als nur „stirbt“.
- source_word: בְּצִדְקוֹ
  choice: in seiner Gerechtigkeit
  rationale: Die relativ formnahe Wiedergabe lässt offen, ob die Gerechtigkeit Begleitumstand, Gegensatz oder Ursache ist.
- source_word: רָשָׁע
  choice: ein gottloser Mann
  rationale: Das substantivierte maskuline Singularwort steht parallel zu „ein gerechter Mann“; „gottlos“ ist eine geläufige ethisch-religiöse Wiedergabe von רָשָׁע.
- source_word: מַאֲרִיךְ
  choice: lange lebt
  rationale: Die Hifil-Form bezeichnet eine Verlängerung; im Deutschen drückt „lange lebt“ die gemeinte verlängerte Lebensdauer natürlich aus, ohne ein im Hebräischen unausgesprochenes Objekt schwerfällig einzufügen.
- source_word: בְּרָעָתוֹ
  choice: in seiner Bosheit
  rationale: Die Formulierung erhält die Präpositionsparallele zu „in seiner Gerechtigkeit“ und lässt die genaue Beziehung bewusst offen.
theological_decisions:
- issue: Bedeutung von הֶבְלִי im Buch Prediger
  choice: „meiner Nichtigkeit“ als Bezeichnung des flüchtigen, schwer fassbaren und frustrierenden menschlichen Daseins
  alternative: „meiner Vergänglichkeit“, „meines flüchtigen Daseins“ oder bildhaft „meines Hauchs“
  rationale: Das Wort gehört zur Leitmotivik des Buches. Die Übersetzung soll weder moralische Eitelkeit unterstellen noch die Bedeutung allein auf kurze Lebensdauer verengen.
- issue: Funktion von ב in בְּצִדְקוֹ und בְּרָעָתוֹ
  choice: „in seiner Gerechtigkeit“ und „in seiner Bosheit“
  alternative: „trotz seiner Gerechtigkeit/Bosheit“ oder „wegen seiner Gerechtigkeit/Bosheit“
  rationale: Die hebräische Präposition lässt Umstand, Einräumung oder Ursache zu. Der Haupttext bewahrt diese Spannung, statt eine bestimmte Erklärung für das unerwartete Ergehen festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst parallelem Satzbau. „Nichtigkeit“ hält die Leitmotivik des Buches fest, wird aber wegen möglicher Missverständnisse in der Fußnote erläutert. Die wiederholten Wendungen mit „in“ bewahren die echte semantische Offenheit des hebräischen Textes.
