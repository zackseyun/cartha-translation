  text: סַבּ֨וֹתִֽי אֲנִ֤י וְ/לִבִּ/י֙ לָ/דַ֣עַת וְ/לָ/ת֔וּר וּ/בַקֵּ֥שׁ חָכְמָ֖ה וְ/חֶשְׁבּ֑וֹן וְ/לָ/דַ֨עַת֙ רֶ֣שַׁע כֶּ֔סֶל וְ/הַ/סִּכְל֖וּת הוֹלֵלֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/025.yaml
  text: I turned[a], I and my heart, to know and to search out and seek wisdom and an explanation[c][b], and to know that wickedness is folly and foolishness is madness.
translation:
  language: de
  text: Ich wandte mich[a] – ich und mein Herz –, um zu erkennen, zu erforschen und Weisheit und eine Erklärung[b] zu suchen, und um Bosheit als Torheit und Unvernunft als Wahnsinn zu erkennen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich kehrte mich um“. Das hebräische Verb zeichnet das Bild einer bewussten Neuorientierung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „eine Berechnung“, „einen Gedankengang“ oder „eine Rechenschaft“. Das hebräische Wort kann eine Rechnung, einen gedanklichen Zusammenhang oder eine Erklärung bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Der knappe hebräische Ausdruck kann auch wiedergegeben werden: „und um zu erkennen, dass Bosheit Torheit ist und Unvernunft Wahnsinn ist.“ Eine genitivische Auffassung der beiden Nominalverbindungen ist ebenfalls möglich.'
    reason: alternative_reading
lexical_decisions:
- source_word: סַבּוֹתִי
  choice: Ich wandte mich
  rationale: Das Verb סבב bezeichnet ein Sichwenden oder eine Neuorientierung. „Ich wandte mich“ bewahrt das konkrete Bild und passt zugleich zu einer bewusst aufgenommenen Untersuchung.
- source_word: אֲנִי וְלִבִּי
  choice: ich und mein Herz
  rationale: Die ausdrückliche Verbindung des Sprechers mit seinem Herzen bleibt erhalten. Im Hebräischen umfasst „Herz“ hier Denken, Urteilen und inneren Entschluss, ohne auf das moderne Wort „Verstand“ verengt zu werden.
- source_word: לָדַעַת
  choice: zu erkennen
  rationale: ידע bedeutet grundlegend „wissen/erkennen“. „Erkennen“ fügt sich im Deutschen natürlich in die Reihe der untersuchenden Tätigkeiten und lässt sich bei der Wiederholung des Verbs beibehalten.
- source_word: לָתוּר
  choice: zu erforschen
  rationale: תור bezeichnet suchendes Erkunden oder Ausforschen. „Erforschen“ unterscheidet dieses Verb vom folgenden בקש und gibt die zielgerichtete Untersuchung wieder.
- source_word: וּבַקֵּשׁ
  choice: zu suchen
  rationale: בקש ist das gewöhnliche Verb für „suchen“. Die eigene Wiedergabe erhält die Häufung verschiedener Verben des Erkenntnisstrebens.
- source_word: חָכְמָה
  choice: Weisheit
  rationale: Dies ist die sachlich und traditionsgeschichtlich passende Wiedergabe des zentralen Begriffs der Weisheitsliteratur.
- source_word: חֶשְׁבּוֹן
  choice: eine Erklärung
  rationale: Das Wort kann Berechnung, gedankliche Rechnung, Plan oder Rechenschaft bezeichnen. Im Zusammenhang einer intellektuellen Suche gibt „Erklärung“ den wahrscheinlichen Sinn verständlich wieder; die größere Bedeutungsbreite wird in einer Fußnote offengehalten.
- source_word: רֶשַׁע
  choice: Bosheit
  rationale: רשע bezeichnet moralisch schuldhafte Bosheit oder Frevelhaftigkeit. „Bosheit“ bewahrt die ethische Schärfe besser als das allgemeinere „Böse“.
- source_word: כֶּסֶל
  choice: Torheit
  rationale: In der Weisheitsliteratur bezeichnet das Wort eine intellektuell und moralisch geprägte Torheit. Der etablierte Begriff „Torheit“ wahrt diesen Zusammenhang.
- source_word: הַסִּכְלוּת
  choice: Unverstand
  rationale: Das Wort ist ein nahes Synonym zu כֶּסֶל. „Unverstand“ erhält die Bedeutungsnähe, ohne beide hebräischen Wörter im Deutschen völlig gleich wiederzugeben.
- source_word: הוֹלֵלוֹת
  choice: Wahnsinn
  rationale: Der Ausdruck bezeichnet rasende Irrationalität oder Wahnsinn. „Wahnsinn“ ist im Kontext des Predigerbuches prägnant und sachgemäß.
theological_decisions:
- issue: Anthropologische Bedeutung des Herzens
  choice: Die Formulierung „ich und mein Herz“ bleibt im Haupttext erhalten.
  alternative: „ich und mein Verstand“ oder „ich selbst mit all meinem Denken“
  rationale: Das Herz ist im hebräischen Sprachgebrauch auch der Ort des Denkens und Entschließens. Die formnahe Wiedergabe bewahrt dieses Menschenbild, ohne es auf eine moderne Trennung von Gefühl und Verstand festzulegen.
- issue: Verhältnis von Bosheit, Torheit, Unverstand und Wahnsinn
  choice: Die beiden knappen Nominalverbindungen werden mit „als“ wiedergegeben.
  alternative: „dass Bosheit Torheit ist und Unverstand Wahnsinn ist“; möglich ist auch eine genitivische Auffassung wie „die Bosheit der Torheit und den Unverstand des Wahnsinns“
  rationale: Im Hebräischen fehlen ausdrückliche Kopulaverben und Verhältniswörter. „Als“ erhält die gedrängte, wertende Zuordnung, während die Fußnote die prädikative Lesart offenlegt und keine weitergehende Lehrentscheidung einträgt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Gedankenstriche machen die im Deutschen ungewöhnliche, aber quelltextnahe Wendung „ich und mein Herz“ lesbar. Die gestufte Verbfolge und die begriffliche Spannung der beiden Schlussglieder bleiben erhalten.
