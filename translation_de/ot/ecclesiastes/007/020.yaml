id: ECC.7.20
reference: Ecclesiastes 7:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֣י אָדָ֔ם אֵ֥ין צַדִּ֖יק בָּ/אָ֑רֶץ אֲשֶׁ֥ר יַעֲשֶׂה טּ֖וֹב וְ/לֹ֥א יֶחֱטָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/020.yaml
  text: For there is no righteous man on the earth who does good and does not sin[a].
translation:
  language: de
  text: Denn es gibt auf Erden keinen gerechten Menschen, der Gutes tut und nicht sündigt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende Aussage und stellt in natürlichem Deutsch den logischen Zusammenhang her.
- source_word: אָדָם
  choice: Mensch
  rationale: Das singularische אָדָם bezeichnet hier repräsentativ einen Menschen und formuliert damit eine allgemeine Aussage über die Menschheit. „Mensch“ bewahrt sowohl Singular als auch universalen Sinn.
- source_word: אֵין
  choice: es gibt keinen
  rationale: Die existentielle Verneinung wird im Deutschen idiomatisch mit „es gibt keinen“ wiedergegeben.
- source_word: צַדִּיק
  choice: gerecht
  rationale: „Gerecht“ ist die sachlich und theologisch transparente Wiedergabe von צַדִּיק und passt zum moralischen Zusammenhang der Weisheitsliteratur.
- source_word: בָּאָרֶץ
  choice: auf Erden
  rationale: Die Wendung bezeichnet hier die menschliche Welt insgesamt und nicht ein bestimmtes Land. „Auf Erden“ ist prägnant und dem würdevollen Register angemessen.
- source_word: אֲשֶׁר
  choice: der
  rationale: Das Relativpronomen bezieht sich auf den singularischen „Menschen“ und wird im Deutschen entsprechend mit „der“ wiedergegeben.
- source_word: יַעֲשֶׂה טּוֹב
  choice: Gutes tut
  rationale: Die knappe moralische Aussage des Hebräischen wird natürlich und in ihrer sprichwortartigen Prägnanz bewahrt.
- source_word: וְלֹא יֶחֱטָא
  choice: und nicht sündigt
  rationale: Die koordinierte hebräische Form bleibt ausdrücklich erhalten. Die Wiedergabe vermeidet die aspektuell stärker festlegende Formulierung „niemals sündigt“.
theological_decisions:
- issue: Singularische, repräsentative Bezeichnung des Menschen
  choice: Mensch
  alternative: Mann
  rationale: אָדָם ist hier singularisch, aber generisch gebraucht. Das deutsche „Mensch“ erhält den repräsentativen Singular und macht ohne sachfremde geschlechtliche Verengung deutlich, dass die Aussage allgemein für Menschen gilt.
- issue: Verhältnis von Gerechtigkeit und Sünde
  choice: keinen gerechten Menschen, der Gutes tut und nicht sündigt
  alternative: niemand ist gerecht; niemand tut Gutes, ohne zu sündigen
  rationale: 'Die gewählte Fassung bewahrt die syntaktische Spannung des Hebräischen: Verneint wird die Existenz eines Gerechten, der Gutes tut und dabei nicht sündigt. Sie löst diese Aussage nicht in mehrere weitergehende Behauptungen auf.'
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdevoller und sprichwortartiger Satzführung. „Auf Erden“ wahrt den weiten Horizont und den gehobenen Ton, ohne altertümlich zu wirken.
