  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des hebräischen Satzes zutreffend wieder: כִּי als begründendes „Denn“, die generische singularische Aussage mit „Mensch“, die existentielle Verneinung, „gerecht“, den umfassenden Sinn von בָּאָרֶץ als „auf Erden“ sowie die Relativbestimmung „der Gutes tut und nicht sündigt“. Die Verneinung bezieht sich korrekt auf einen gerechten Menschen, der sowohl Gutes tut als auch nicht sündigt.'
  naturalness: „Denn es gibt auf Erden keinen gerechten Menschen, der Gutes tut und nicht sündigt“ ist idiomatisches modernes Standarddeutsch. Die Satzstellung ist klar, knapp und dem Weisheitsspruch angemessen. „Auf Erden“ hat einen leicht gehobenen, aber keineswegs unnatürlichen biblisch-literarischen Ton.
