base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/009.yaml
  text: Do not be quick in your spirit to become angry[a], for anger rests in the bosom of fools.
translation:
  language: de
  text: Werde in deinem Inneren nicht vorschnell zornig; denn der Zorn ruht im Schoß[a] der Toren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Busen“ oder „auf dem Schoß“. Das hebräische Bild beschreibt den Zorn als etwas, das sich bei Toren eng an sie schmiegt und dort verweilt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּבַהֵל
  choice: vorschnell
  rationale: Das Piel mit אַל warnt hier vor innerer Übereilung. „Vorschnell“ gibt die Bereitschaft wieder, sich rasch dem Zorn hinzugeben, ohne den Ausdruck auf Erschrecken zu beziehen.
- source_word: בְּרוּחֲךָ
  choice: in deinem Geist
  rationale: רוּחַ bezeichnet hier die innere Haltung oder das innere Selbst. „In deinem Geist“ bewahrt das hebräische Menschenbild und vermeidet die Verengung auf bloßes Temperament.
- source_word: לִכְעוֹס
  choice: zornig werden
  rationale: Der Infinitiv bezeichnet das Eintreten in den Zustand des Zorns; „zornig werden“ gibt diesen beginnenden Aspekt natürlich wieder.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung der vorangehenden Mahnung ein; „denn“ ist in deutscher Weisheitsrede knapp und idiomatisch.
- source_word: כַעַס
  choice: der Zorn
  rationale: כַעַס kann Zorn, Ärger oder Verdruss bezeichnen. „Zorn“ stellt den direkten Bezug zum Verb im ersten Satzteil her und passt zum gehobenen, aber verständlichen Register.
- source_word: בְּחֵיק
  choice: im Schoß
  rationale: חֵיק bezeichnet Schoß, Brustbereich oder Busen als Ort, an dem etwas eng bei sich gehalten wird. „Im Schoß“ bewahrt das räumliche Bild, ohne es zum abstrakten „Herzen“ abzuflachen.
- source_word: כְּסִילִים
  choice: der Toren
  rationale: כְּסִיל ist ein fester Begriff der Weisheitsliteratur für moralisch und verständig unbelehrbare Menschen. „Toren“ wahrt diesen traditionellen, würdevollen Sinn.
- source_word: יָנוּחַ
  choice: ruht
  rationale: נוּחַ bedeutet ruhen, sich niederlassen oder verweilen. „Ruht“ erhält das Bild, dass der Zorn bei Toren einen vertrauten Aufenthaltsort findet.
