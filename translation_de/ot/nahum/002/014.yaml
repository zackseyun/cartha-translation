  text: הִנְ/נִ֣י אֵלַ֗יִ/ךְ נְאֻם֙ יְהוָ֣ה צְבָא֔וֹת וְ/הִבְעַרְתִּ֤י בֶֽ/עָשָׁן֙ רִכְבָּ֔/הּ וּ/כְפִירַ֖יִ/ךְ תֹּ֣אכַל חָ֑רֶב וְ/הִכְרַתִּ֤י מֵ/אֶ֨רֶץ֙ טַרְפֵּ֔/ךְ וְ/לֹֽא יִשָּׁמַ֥ע ע֖וֹד ק֥וֹל מַלְאָכֵֽ/כֵה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/014.yaml
  text: Behold[a], I am against you, declares Yahweh of hosts, and I will burn your chariots in smoke; the sword will devour your young lions. I will cut off your prey from the earth[c][b], and the voice of your messengers will no longer be heard.
translation:
  language: de
  text: Siehe, ich bin gegen dich – Ausspruch Yahwehs der Heerscharen. Ich werde deine Streitwagen im Rauch verbrennen[a], und das Schwert wird deine jungen Löwen fressen[b]. Ich werde deine Beute von der Erde ausrotten, und die Stimme deiner Boten[c] wird nicht mehr zu hören sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu Rauch verbrennen“. Die hebräische Wendung kann die Begleitumstände des Verbrennens („im Rauch“) oder dessen Ergebnis („zu Rauch“) hervorheben.'
    reason: lexical_alternative
  - marker: b
    text: Die „jungen Löwen“ führen das Löwenbild für Ninive fort; wahrscheinlich sind damit bildlich ihre Krieger oder Herrscher gemeint.
    reason: cultural_note
  - marker: c
    text: 'Oder: „Gesandten“. Das hebräische Wort kann menschliche Boten bezeichnen, die mit einem offiziellen Auftrag ausgesandt werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי אֵלַיִךְ
  choice: Siehe, ich bin gegen dich
  rationale: Die prophetische Konfrontationsformel wird feierlich und zugleich verständlich wiedergegeben; das feminine „dich“ richtet sich an Ninive.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: Ausspruch Yahwehs der Heerscharen
  rationale: „Ausspruch“ bewahrt den formelhaften prophetischen Charakter von נְאֻם; der Gottesname wird als „Yahweh“ wiedergegeben, צְבָאוֹת wörtlich als „der Heerscharen“.
- source_word: וְהִבְעַרְתִּי בֶעָשָׁן רִכְבָּהּ
  choice: Ich werde deine Streitwagen im Rauch verbrennen
  rationale: Das kollektiv gebrauchte רֶכֶב wird natürlich im Plural wiedergegeben. „Im Rauch“ hält die Präposition eng am Hebräischen; die mögliche Ergebnisbedeutung wird in einer Fußnote genannt.
- source_word: וּכְפִירַיִךְ תֹּאכַל חָרֶב
  choice: das Schwert wird deine jungen Löwen fressen
  rationale: Die Personifikation des Schwertes und das fortlaufende Löwenbild bleiben erhalten, ohne die Metapher im Haupttext auf Krieger oder Herrscher festzulegen.
- source_word: וְהִכְרַתִּי מֵאֶרֶץ טַרְפֵּךְ
  choice: Ich werde deine Beute von der Erde verschwinden lassen
  rationale: Die Wiedergabe drückt das verursachte vollständige Entfernen aus; „Beute“ bewahrt das Löwen- und Raubtierbild, „Erde“ die mögliche Weite von אֶרֶץ.
- source_word: וְלֹא יִשָּׁמַע עוֹד קוֹל מַלְאָכֵכֵה
  choice: die Stimme deiner Boten wird nicht mehr zu hören sein
  rationale: Die passive hebräische Konstruktion und ihre Endgültigkeit werden in natürlichem Deutsch bewahrt; מַלְאָךְ bezeichnet hier menschliche Boten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der Eigenname wird als „Yahweh“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Deutung der jungen Löwen
  choice: Bildsprache im Haupttext bewahrt
  alternative: Krieger oder Herrscher
  rationale: Der Kontext legt eine metaphorische Beziehung zu Ninives Machtträgern nahe, bestimmt den konkreten Bezug jedoch nicht eindeutig; deshalb wird er nur in der Fußnote erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetischer Feierlichkeit. Der Gedankenstrich markiert nach der direkten Anrede die göttliche Ausspruchsformel. Bildsprache und genuine lexikalische Mehrdeutigkeit bleiben erhalten; die Alternativen stehen in den Fußnoten.
