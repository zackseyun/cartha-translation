source:
  edition: WLC
  text: מָגֵ֨ן גִּבֹּרֵ֜י/הוּ מְאָדָּ֗ם אַנְשֵׁי חַ֨יִל֙ מְתֻלָּעִ֔ים בְּ/אֵשׁ פְּלָד֥וֹת הָ/רֶ֖כֶב בְּ/י֣וֹם הֲכִינ֑/וֹ וְ/הַ/בְּרֹשִׁ֖ים הָרְעָֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/004.yaml
  text: The shield of his mighty men is red[a]; the men of valor are clothed in scarlet. The chariots flash with the fire of steel on the day of his preparation[b], and the cypress spears are brandished.
translation:
  language: de
  text: Der Schild seiner Helden ist rot gefärbt; die Krieger sind in Scharlach gekleidet. Die Streitwagen blitzen von feurigem Stahl[a] am Tag seiner Vorbereitung[b], und die Zypressenspeere werden geschwungen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Streitwagen sind von feurigem Metall umgeben.“ Die hebräische Wendung ist unsicher und kann auf blitzende Metallbeschläge oder Klingen der Streitwagen hinweisen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „an dem Tag, an dem er sich bereitmacht“. Das Hebräische lässt offen, was oder wen er vorbereitet.'
    reason: grammatical_ambiguity
  - marker: c
    text: 'Wörtlich: „die Zypressen werden geschüttelt“. Gemeint sind wahrscheinlich Speere oder Lanzen mit Schäften aus Zypressenholz oder einem ähnlichen Nadelholz.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָגֵן גִּבֹּרֵיהוּ
  choice: Der Schild seiner Helden
  rationale: Der Singular von מָגֵן und das Possessivsuffix werden bewahrt. „Helden“ bezeichnet hier kampferprobte, starke Krieger und erhält den gehobenen militärischen Ton.
- source_word: מְאָדָּם
  choice: ist rot gefärbt
  rationale: Die Form beschreibt den Schild als gerötet beziehungsweise rot gemacht. „Rot gefärbt“ gibt den passiv-statischen Sinn natürlicher wieder als das bloße „ist rot“.
- source_word: אַנְשֵׁי חַיִל
  choice: die Krieger
  rationale: Die feste Wendung bezeichnet tüchtige, kampffähige Männer. Im unmittelbaren Kriegskontext ist „Krieger“ klar, knapp und idiomatisch.
- source_word: מְתֻלָּעִים
  choice: sind in Scharlach gekleidet
  rationale: Das Wort verweist auf scharlachrote beziehungsweise karmesinrote Färbung; bei Personen ist Kleidung sinngemäß mitgemeint.
- source_word: בְּאֵשׁ פְּלָדוֹת הָרֶכֶב
  choice: Die Streitwagen blitzen von feurigem Stahl
  rationale: Die schwierige Wendung verbindet Feuer mit Metall beziehungsweise Stahl und schildert wahrscheinlich den feurigen Lichtschein metallener Beschläge oder Klingen. Die Wiedergabe wahrt das Bild, ohne eine bestimmte technische Ausstattung festzulegen.
- source_word: בְּיוֹם הֲכִינוֹ
  choice: am Tag seiner Vorbereitung
  rationale: Die nominale Form mit Suffix lässt offen, worin das Vorbereiten besteht und was genau vorbereitet wird. Die bewusst knappe Formulierung bewahrt diese Unbestimmtheit.
- source_word: וְהַבְּרֹשִׁים
  choice: die Zypressenspeere
  rationale: Wörtlich sind Zypressen beziehungsweise entsprechende Nadelhölzer gemeint; im militärischen Zusammenhang liegt eine metonymische Bezeichnung von Speeren oder Lanzen nach ihrem Holzschaft nahe.
- source_word: הָרְעָלוּ
  choice: werden geschwungen
  rationale: Das seltene Verb bezeichnet hier wahrscheinlich ein Schütteln, Erzitternlassen oder Schwingen. Bei Speeren ist „geschwungen“ eine natürliche, kontextgerechte Wiedergabe.
