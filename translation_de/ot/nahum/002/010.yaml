  text: בֹּ֥זּוּ כֶ֖סֶף בֹּ֣זּוּ זָהָ֑ב וְ/אֵ֥ין קֵ֨צֶה֙ לַ/תְּכוּנָ֔ה כָּבֹ֕ד מִ/כֹּ֖ל כְּלִ֥י חֶמְדָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/010.yaml
  text: Plunder silver! Plunder gold! There is no end to the treasure[b][a], an abundance of every precious thing.
translation:
  language: de
  text: Plündert Silber! Plündert Gold! Die Vorräte nehmen kein Ende[a]; eine Fülle von allerlei kostbaren Gegenständen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Schätze nehmen kein Ende.“ Das seltene hebräische Wort kann angesammelte Vorräte, Bestände oder Schätze bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „von jedem kostbaren Gegenstand“. Das hebräische Wort kann Gefäße, Geräte oder Gegenstände allgemein bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּזּוּ
  choice: Plündert!
  rationale: Der Pluralimperativ von בזז bezeichnet das gewaltsame Erbeuten im Krieg. Die Wiederholung wird wegen ihrer Dringlichkeit und poetischen Wirkung beibehalten.
- source_word: כֶסֶף
  choice: Silber
  rationale: Das Edelmetall entspricht dem Parallelbegriff „Gold“ und passt zum Kontext der Kriegsbeute.
- source_word: זָהָב
  choice: Gold
  rationale: Direkte Wiedergabe des Edelmetalls im Parallelismus mit „Silber“.
- source_word: וְאֵין קֵצֶה
  choice: Kein Ende ist
  rationale: Die knappe deutsche Form bewahrt die emphatische Aussage von der unermesslichen Menge.
- source_word: תְּכוּנָה
  choice: Vorräten
  rationale: Das seltene Substantiv bezeichnet hier wahrscheinlich angesammelte Bestände oder einen Vorrat. „Vorräte“ wahrt diese konkrete Nuance; „Schätzen“ bleibt als kontextuell plausible Alternative in der Fußnote erhalten.
- source_word: כָּבֹד
  choice: eine Fülle
  rationale: Im Zusammenhang materieller Kostbarkeiten bezeichnet das Wort die beeindruckende Menge beziehungsweise den Reichtum; „eine Fülle“ verbindet sich natürlich mit der folgenden Wendung.
- source_word: מִכֹּל כְּלִי חֶמְדָּה
  choice: von allerlei kostbaren Gegenständen
  rationale: כְּלִי kann Gefäß, Gerät, Artikel oder Gegenstand bedeuten; חֶמְדָּה kennzeichnet Begehrenswertes oder Kostbares. Die Wiedergabe bleibt bewusst breit und versteht מִכֹּל idiomatisch im Sinn einer Vielfalt.
