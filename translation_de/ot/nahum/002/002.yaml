  text: עָלָ֥ה מֵפִ֛יץ עַל פָּנַ֖יִ/ךְ נָצ֣וֹר מְצֻרָ֑ה צַפֵּה דֶ֨רֶךְ֙ חַזֵּ֣ק מָתְנַ֔יִם אַמֵּ֥ץ כֹּ֖חַ מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/002.yaml
  text: A scatterer has come up against your face[a]. Guard the fortress; watch the road; strengthen your loins[c][b]; muster your strength greatly.
translation:
  language: de
  text: Ein Zerschmetterer[a] ist gegen dich[b] angerückt. Bewache die Festung,[c] halte den Weg im Auge, stärke deine Lenden, biete deine Kraft mit aller Kraft auf!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch „ein Zerstreuer“ oder „einer, der zerschlägt“; das hebräische Wort kann sowohl das Zerstreuen als auch das zerschmetternde Zerstören hervorheben.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „gegen dein Angesicht“; gemeint ist, dass der Angreifer unmittelbar vor dir steht oder gegen dich vorgeht.
    reason: lexical_alternative
  - marker: c
    text: Auch „die befestigte Stellung“ oder möglicherweise „die Belagerungswerke“; das hebräische Nomen kann unterschiedliche Arten von Befestigung oder eine belagerte Stellung bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה
  choice: ist … angerückt
  rationale: Das Qatal stellt den feindlichen Vormarsch als bereits eingetreten bzw. unmittelbar gegenwärtig dar. „Angerückt“ gibt den militärischen Gebrauch von עלה im Deutschen natürlich wieder.
- source_word: מֵפִיץ
  choice: ein Zerschmetterer
  rationale: Das substantivierte Partizip bezeichnet den zerstörerischen Angreifer. „Zerschmetterer“ bewahrt die gewaltsame Bildsprache; die ebenfalls mögliche Bedeutung „Zerstreuer“ wird in der Fußnote offengehalten.
- source_word: עַל־פָּנַיִךְ
  choice: gegen dich
  rationale: Die wörtliche Wendung „gegen/auf dein Angesicht“ bezeichnet hier die direkte Konfrontation. „Gegen dich“ ist im modernen Deutschen klar, während die konkrete hebräische Bildform in der Fußnote dokumentiert wird.
- source_word: נָצוֹר
  choice: Bewache
  rationale: Der Imperativ fordert zu unmittelbarer militärischer Sicherung auf. „Bewache“ ist knapp und erhält den Befehlscharakter.
- source_word: מְצֻרָה
  choice: die Festung
  rationale: Das Nomen kann eine befestigte Stellung, Festung oder einen mit Belagerung verbundenen Befestigungskomplex bezeichnen. Im Zusammenhang der Verteidigungsbefehle ist „Festung“ die naheliegendste Haupttextfassung.
- source_word: צַפֵּה דֶרֶךְ
  choice: halte den Weg im Auge
  rationale: Die Wendung fordert dazu auf, den Anmarschweg aufmerksam zu beobachten. Die deutsche Formulierung ist gegenwärtig und anschaulich, ohne den Wachpostencharakter abzuschwächen.
- source_word: חַזֵּק מָתְנַיִם
  choice: stärke deine Lenden
  rationale: Die körperliche Metapher für entschlossene Kampfbereitschaft bleibt erhalten. „Lenden“ trägt einen leicht gehobenen, aber weiterhin verständlichen prophetischen Ton.
- source_word: אַמֵּץ כֹּחַ מְאֹד
  choice: biete all deine Kraft auf
  rationale: Die Formulierung gibt sowohl den aktiven Imperativ אמץ als auch die starke Intensivierung durch מאד idiomatisch wieder.
theological_decisions:
- issue: Nicht ausdrücklich genannte Adressatin
  choice: Das im Hebräischen feminine singularische „du“ wird nicht durch den Namen „Ninive“ ergänzt.
  alternative: „Ninive“ ausdrücklich in den Vers einsetzen.
  rationale: Der Kontext identifiziert die angeredete Stadt, doch der hebräische Vers nennt sie nicht. Die Übersetzung bewahrt diese implizite Anrede und vermeidet eine erläuternde Ergänzung im Haupttext.
translation_notes:
  register: Kurze, scharf gesetzte Imperative erhalten den militärischen Alarmton. Die Sprache ist modernes Standarddeutsch mit würdig-prophetischem Klang; „Lenden“ wird bewusst als verständliche, leicht gehobene Körpermetapher beibehalten.
