base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/012.yaml
  text: Where is the lions’ den[a], the feeding place of the young lions, where the lion and lioness walked, where the lion’s cub was[b], with none to make them afraid?
translation:
  language: de
  text: Wo ist die Höhle der Löwen, der Weideplatz[a] für die Junglöwen, wo der Löwe umherging, die Löwin[b] dort war und das Löwenjunge, und niemand sie aufschreckte?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Futterplatz“. Das hebräische Wort kann eine Weide, einen Weideplatz oder einen Ort der Nahrungsaufnahme bezeichnen und wird hier im Löwenbild gebraucht.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „starker Löwe“. Das hebräische Wort לָבִיא kann unterschiedliche löwenbezogene Bedeutungen haben; „Löwin“ passt hier zur Abfolge von Löwe, Löwin und Löwenjungem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיֵּה
  choice: Wo ist
  rationale: Die Ortsfrage eröffnet den spöttischen Rückblick auf Ninive; im Deutschen ist die Ergänzung von „ist“ natürlich.
- source_word: מְעוֹן אֲרָיוֹת
  choice: die Höhle der Löwen
  rationale: מְעוֹן bezeichnet eine Wohnstätte; im durchgehenden Löwenbild gibt „Höhle“ den konkreten Sinn idiomatisch wieder.
- source_word: וּמִרְעֶה הוּא לַכְּפִרִים
  choice: der Weideplatz für die Junglöwen
  rationale: מִרְעֶה kann Weide, Weideplatz oder Futterplatz bedeuten. „Weideplatz“ bewahrt das Bild und die Zweckbeziehung der Präposition לְ.
- source_word: אֲשֶׁר הָלַךְ
  choice: wo … umhergingen
  rationale: Das Relativwort erhält im Zusammenhang lokalen Sinn. „Umhergingen“ ist natürlich und bleibt näher am Grundverb הלך als das stärker deutende „herumstreiften“.
- source_word: אַרְיֵה
  choice: Löwe
  rationale: Die übliche Wiedergabe des singularischen Löwenbegriffs.
- source_word: לָבִיא
  choice: Löwin
  rationale: Im Zusammenhang mit Löwe und Löwenjungem ergibt „Löwin“ eine stimmige Familiengruppe; die mögliche allgemeinere Bedeutung wird in einer Fußnote offengehalten.
- source_word: גּוּר אַרְיֵה
  choice: das Löwenjunge
  rationale: Die Konstruktverbindung bezeichnet das Junge eines Löwen; „Löwenjunge“ ist klares, heutiges Deutsch.
- source_word: וְאֵין מַחֲרִיד
  choice: und niemand sie aufschreckte
  rationale: Die Wendung bezeichnet das Fehlen eines Wesens, das Furcht oder Aufschrecken verursacht. Das im Deutschen ergänzte Objekt „sie“ bezieht sich natürlich auf die Löwengruppe.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Ortsangabe „wo“ erhält die hebräische Struktur und den Charakter der höhnischen Frage. „Junglöwen“ und „Löwenjunge“ unterscheiden die beiden hebräischen Bezeichnungen ohne unnatürliche Formulierungen.
