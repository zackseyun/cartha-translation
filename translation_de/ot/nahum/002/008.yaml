source:
  edition: WLC
  text: וְ/הֻצַּ֖ב גֻּלְּתָ֣ה הֹֽעֲלָ֑תָה וְ/אַמְהֹתֶ֗י/הָ מְנַֽהֲגוֹת֙ כְּ/ק֣וֹל יוֹנִ֔ים מְתֹפְפֹ֖ת עַל לִבְבֵ/הֶֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/008.yaml
  text: 'It is fixed: she is stripped bare[a], she is carried away; and her servant girls are led off, moaning like the sound of doves[b], beating on their hearts.'
translation:
  language: de
  text: 'Es steht fest: sie wird entblößt[a] und weggeführt. Ihre Sklavinnen klagen wie Tauben und schlagen sich aufs Herz[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aufgedeckt“; möglicherweise auch: „in die Verbannung geführt“. Das schwierige hebräische Wort kann Bilder der Erniedrigung und der Verschleppung miteinander verbinden.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „auf ihre Herzen“. Gemeint sein kann das Schlagen an die Brust als Trauergeste.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֻצַּב
  choice: Es steht fest
  rationale: 'Die schwierige passive Form wird als unpersönliche Feststellung verstanden: Das Geschehen steht fest. So bleibt der Kontext des unabwendbaren Gerichts erhalten, ohne ausdrücklich eine rechtliche Verfügung („es ist beschlossen“) oder eine konkrete Aufstellung („sie wird hingestellt“) anzunehmen.'
- source_word: גֻּלְּתָה
  choice: sie wird entblößt
  rationale: Das Passiv von גלה kann Entblößung, Aufdeckung oder Verbannung bezeichnen. „Entblößt“ bewahrt hier das Bild öffentlicher Erniedrigung und verdoppelt nicht einfach das anschließende Wegführen.
- source_word: הֹעֲלָתָה
  choice: und weggeführt
  rationale: Der Hofal von עלה bezeichnet hier erzwungene Bewegung. „Weggeführt“ gibt im Zusammenhang der Einnahme einer Stadt die Verschleppung natürlich wieder, ohne die im Deutschen missverständliche wörtliche Richtung „hinauf“ zu betonen.
- source_word: אַמְהֹתֶיהָ
  choice: ihre Sklavinnen
  rationale: אָמָה bezeichnet eine sozial unfreie weibliche Dienerin. „Sklavinnen“ wahrt diesen Status deutlicher als das verharmlosende „Mägde“ oder „Dienerinnen“.
- source_word: מְנַהֲגוֹת
  choice: werden fortgetrieben
  rationale: Die Form beschreibt hier, dass die Frauen gegen ihren Willen weggebracht werden. „Fortgetrieben“ vermittelt den Zwang stärker als „geführt“ und passt zur Gefangenenprozession.
- source_word: כְּקוֹל יוֹנִים
  choice: sie klagen mit einer Stimme wie Tauben
  rationale: Der Vergleich gilt ausdrücklich dem Laut beziehungsweise der Stimme der Tauben. Das im Deutschen ergänzte „sie klagen“ macht die Funktion des Vergleichs als Trauerlaut verständlich, ohne das Klangbild aufzugeben.
- source_word: מְתֹפְפֹת עַל לִבְבֵהֶן
  choice: und schlagen sich aufs Herz
  rationale: Die Form bezeichnet rhythmisches Schlagen als Trauergeste; „aufs Herz“ folgt der Körperbezeichnung des Hebräischen. Eine Fußnote nennt die idiomatisch naheliegende Wiedergabe „an die Brust“.
theological_decisions:
- issue: Ob וְהֻצַּב ein göttliches Dekret bezeichnet
  choice: 'Unpersönlich und zurückhaltend: „Es steht fest“'
  alternative: „Es ist beschlossen“ oder „Es ist verfügt“
  rationale: Der schwierige Ausdruck macht das Geschehen gewiss, nennt aber nicht ausdrücklich den Urheber oder einen rechtlichen Beschluss. Die Übersetzung vermeidet daher eine theologisch stärker festgelegte Deutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit kurzen, eindringlichen Sätzen. „Sklavinnen“ benennt den antiken sozialen Status klar. Die Taubenstimme und das Schlagen aufs Herz bewahren die poetischen Trauerbilder; die ungewöhnliche Ausgangsformulierung wird nicht unnötig geglättet.
