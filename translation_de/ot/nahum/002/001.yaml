reference: Nahum 2:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הִנֵּ֨ה עַל הֶ/הָרִ֜ים רַגְלֵ֤י מְבַשֵּׂר֙ מַשְׁמִ֣יעַ שָׁל֔וֹם חָגִּ֧י יְהוּדָ֛ה חַגַּ֖יִ/ךְ שַׁלְּמִ֣י נְדָרָ֑יִ/ךְ כִּי֩ לֹ֨א יוֹסִ֥יף ע֛וֹד ל/עבור בָּ֥/ךְ בְּלִיַּ֖עַל כֻּלֹּ֥/ה נִכְרָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/001.yaml
  text: Look[a], on the mountains are the feet of one who brings good news, who announces peace. Celebrate your festivals, Judah; fulfill your vows[b], for the worthless one will never again pass through you; he is completely cut off.
translation:
  language: de
  text: Sieh, auf den Bergen sind die Füße eines, der gute Nachricht bringt, der Frieden verkündet. Feiere deine Feste, Juda, erfülle deine Gelübde; denn der Bösewicht wird nie wieder durch dich ziehen. Er ist völlig vernichtet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh doch
  rationale: Die aufmerksamkeitslenkende und anschauliche Kraft der Partikel wird in natürlichem, gegenwärtigem Deutsch wiedergegeben.
- source_word: עַל הֶהָרִים
  choice: auf den Bergen
  rationale: Die konkrete Ortsangabe und das Bild des herannahenden Boten bleiben erhalten.
- source_word: רַגְלֵי מְבַשֵּׂר
  choice: die Füße eines Freudenboten
  rationale: „Freudenbote“ gibt das Partizip knapp und idiomatisch als Überbringer guter Nachricht wieder; das auffällige konkrete Bild der Füße bleibt stehen.
- source_word: מַשְׁמִיעַ שָׁלוֹם
  choice: der Frieden verkündet
  rationale: Der Hifil-Ausdruck bezeichnet das öffentliche Bekanntmachen; „verkündet“ wahrt den heraldischen Ton.
- source_word: חָגִּי יְהוּדָה חַגַּיִךְ
  choice: Feiere deine Feste, Juda
  rationale: Die feminine Singularanrede an Juda wird natürlich wiedergegeben; „Feste“ bezeichnet religiöse Festzeiten, ohne sie auf Mahlzeiten zu verengen.
- source_word: שַׁלְּמִי נְדָרָיִךְ
  choice: erfülle deine Gelübde
  rationale: Dies gibt die hebräische Wendung, Gelübde zu entrichten beziehungsweise zu erfüllen, in geläufigem Deutsch wieder.
- source_word: לֹא יוֹסִיף עוֹד לַעֲבוֹר בָּךְ
  choice: wird nicht noch einmal durch dich ziehen
  rationale: Die Wiederholungsnegation und das räumliche Bild bleiben erhalten, ohne die feindliche Bewegung ausdrücklich als „Einmarsch“ auszudeuten.
- source_word: בְּלִיַּעַל
  choice: der Nichtswürdige
  rationale: Der Ausdruck wird im Kontext als beschreibende Bezeichnung eines ruchlosen beziehungsweise untauglichen Feindes verstanden, nicht zwingend als Eigenname.
- source_word: כֻּלֹּה נִכְרָת
  choice: Er ist vollständig ausgerottet
  rationale: Die Totalität seiner Beseitigung wird klar ausgedrückt; die maskuline Rückbeziehung entspricht dem im Haupttext gewählten substantivierten Ausdruck.
theological_decisions:
- issue: Ob בְּלִיַּעַל ein Eigenname oder eine beschreibende Bezeichnung ist
  choice: Im Haupttext „der Nichtswürdige“
  alternative: „der Frevler“ oder traditionell „Belial“
  rationale: In diesem prophetischen Zusammenhang liegt eine abwertende Bezeichnung des Feindes näher als die eindeutige Benennung einer dämonischen Gestalt. Die Fußnote bewahrt die sprachlich und traditionsgeschichtlich bedeutsamen Alternativen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die lebhafte Einleitung, das konkrete Botenbild und die direkte feminine Anrede Judas bleiben erhalten. Die Satzgrenze nach der Friedensbotschaft gliedert Verkündigung und Aufforderung klar.
