review_pass:
  verdict: revise
  source_fidelity: Die Satzstruktur, die Imperative an Juda, das Botenbild und die abschließende Aussage über das endgültige Abgeschnittensein des Feindes entsprechen dem Hebräischen im Wesentlichen. »Ausgerottet« ist für נִכְרָת möglich, aber semantisch enger und gewaltsamer als das allgemeinere »abgeschnitten/vernichtet«.
  naturalness: »Freudenbote« und besonders »der Nichtswürdige« wirken im heutigen Standarddeutsch literarisch bzw. ungebräuchlich. Eine verbalere Wiedergabe des Partizips und »Bösewicht« sind klarer und natürlicher, ohne den Sinn zu verändern.
  terminology: Juda, Frieden, Feste und Gelübde sind angemessen. בְּלִיַּעַל sollte im Haupttext als beschreibende Feindbezeichnung erscheinen; die traditionelle Lesart »Belial« gehört als Alternative in die Fußnote, nicht als dogmatische Festlegung.
  issues:
  - severity: medium
    issue: Unnatürliche Wiedergabe von בְּלִיַּעַל
    rationale: »Der Nichtswürdige« ist zwar etymologisch nachvollziehbar, im modernen Deutsch aber kaum idiomatisch und kann eher Unfähigkeit als die verächtliche Charakterisierung des feindlichen Gegners nahelegen. »Der Bösewicht« ist eine natürliche, kontextgerechte Wiedergabe; die wörtlichere und die traditionelle Alternative werden in der Fußnote bewahrt.
  - severity: low
    issue: Stilistisch altertümliches »Freudenbote«
    rationale: Der Ausdruck ist verständlich, aber weniger natürlich als die transparente Partizipialwendung »einer, der gute Nachricht bringt«. Diese bewahrt zugleich die hebräische Verbalform ohne zusätzlichen Erklärungsbedarf.
  - severity: low
    issue: »ausgerottet« verengt die Schlussaussage
    rationale: נִכְרָת bezeichnet das völlige Abgeschnitten- bzw. Beseitigtsein. »Völlig vernichtet« ist im Deutschen weiter und vermeidet die spezifische Konnotation von Ausrottung.
  revised_text: Sieh, auf den Bergen sind die Füße eines, der gute Nachricht bringt, der Frieden verkündet. Feiere deine Feste, Juda, erfülle deine Gelübde; denn der Bösewicht wird nie wieder durch dich ziehen. Er ist völlig vernichtet.
  revised_footnotes:
  - marker: b
    text: 'Auch: »der Nichtswürdige« oder »der Frevler«; traditionell: »Belial«.'
    reason: Die Fußnote bewahrt sowohl die nähere lexikalische Wiedergabe von בְּלִיַּעַל als auch die traditionsgeschichtlich wichtige Deutung als Eigenname, ohne diese im Haupttext festzulegen.
  revision_rationale: Die Revision modernisiert zwei im Deutschen wenig gebräuchliche Personenbezeichnungen und gibt die Schlussformel weniger eng wieder. Das konkrete Bild der Füße, die Friedensverkündigung, die Aufforderungen an Juda sowie die endgültige Abwehr des Feindes bleiben erhalten. Die nicht eindeutige Deutung von בְּלִיַּעַל wird ausdrücklich in der Fußnote offen gehalten.
