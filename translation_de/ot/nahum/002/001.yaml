revisions:
- from: 'Sieh doch: Auf den Bergen sind die Füße eines Freudenboten[a], der Frieden verkündet. Feiere deine Feste, Juda, erfülle deine Gelübde; denn der Nichtswürdige[b] wird nicht noch einmal durch dich ziehen. Er ist vollständig ausgerottet.'
  to: Sieh, auf den Bergen sind die Füße eines, der gute Nachricht bringt, der Frieden verkündet. Feiere deine Feste, Juda, erfülle deine Gelübde; denn der Bösewicht wird nie wieder durch dich ziehen. Er ist völlig vernichtet.
  rationale: Die Revision modernisiert zwei im Deutschen wenig gebräuchliche Personenbezeichnungen und gibt die Schlussformel weniger eng wieder. Das konkrete Bild der Füße, die Friedensverkündigung, die Aufforderungen an Juda sowie die endgültige Abwehr des Feindes bleiben erhalten. Die nicht eindeutige Deutung von בְּלִיַּעַל wird ausdrücklich in der Fußnote offen gehalten.
