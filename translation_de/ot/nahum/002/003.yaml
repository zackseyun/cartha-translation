source:
  edition: WLC
  text: כִּ֣י שָׁ֤ב יְהוָה֙ אֶת גְּא֣וֹן יַעֲקֹ֔ב כִּ/גְא֖וֹן יִשְׂרָאֵ֑ל כִּ֤י בְקָקוּ/ם֙ בֹּֽקְקִ֔ים וּ/זְמֹרֵי/הֶ֖ם שִׁחֵֽתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/003.yaml
  text: For Yahweh is restoring the majesty of Jacob like the majesty of Israel[c][b][a], though destroyers have destroyed them and ruined their vine branches.
translation:
  language: de
  text: Denn Jahwe stellt die Hoheit Jakobs wieder her wie die Hoheit Israels[a][b]; denn Plünderer haben sie ausgeplündert und ihre Weinranken verwüstet.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hat die Hoheit Jakobs wiederhergestellt“ beziehungsweise „wird sie wiederherstellen“; die hebräische Verbform kann prophetische Gewissheit ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Hoheit Jakobs, die Hoheit Israels“. Die genaue Funktion des hebräischen Vergleichspartikels ist hier nicht völlig eindeutig.'
    reason: textual_or_syntactic_ambiguity
  - marker: c
    text: 'Wörtlich: „Denn Leerende haben sie geleert“; gemeint ist, dass Verwüster sie gründlich ausgeplündert haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁב
  choice: stellt ... wieder her
  rationale: Das Qatal von שוב kann hier eine bereits vollzogene, gegenwärtig gewisse oder prophetisch als sicher dargestellte Wiederherstellung bezeichnen. Das deutsche Präsens gibt die lebendige Gewissheit wieder, ohne ausschließlich Vergangenheit oder Zukunft festzulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: גְּאוֹן
  choice: Hoheit
  rationale: גְּאוֹן kann Hoheit, Erhabenheit oder Stolz bedeuten. Da Jahwe sie wiederherstellt, liegt hier die positive Bedeutung nahe; „Hoheit“ bewahrt zugleich den würdevollen poetischen Ton.
- source_word: כִּגְאוֹן
  choice: wie die Hoheit
  rationale: Das Präfix כ wird entsprechend der masoretischen Lesung vergleichend verstanden. Die syntaktisch ebenfalls erwogene Deutung als bloße Verstärkung oder Gleichsetzung wird in der Fußnote kenntlich gemacht.
- source_word: בְקָקוּם ... בֹּקְקִים
  choice: Plünderer haben sie ausgeplündert
  rationale: Die figura etymologica aus Verb und Partizip wird durch die verwandten Wörter „Plünderer“ und „ausgeplündert“ hörbar gemacht. Damit kommt das gründliche Leeren und Verwüsten zum Ausdruck.
- source_word: וּזְמֹרֵיהֶם
  choice: ihre Weinranken
  rationale: זְמֹרָה bezeichnet einen Rebzweig beziehungsweise eine Weinranke; die konkrete Weinbau-Metapher bleibt erhalten.
- source_word: שִׁחֵתוּ
  choice: verwüstet
  rationale: Das Piel von שׁחת bezeichnet das Verderben oder Zerstören. „Verwüstet“ passt zur gewaltsamen Schädigung der Weinranken und zum Gesamtbild der Plünderung.
theological_decisions:
- issue: Bedeutung von גְּאוֹן bei Jakob und Israel
  choice: positive Hoheit beziehungsweise Würde
  alternative: Stolz
  rationale: Die Wiederherstellung durch Jahwe spricht im Kontext für einen positiven Sinn. „Stolz“ könnte im heutigen Deutsch unnötig sündhafte Überheblichkeit nahelegen.
- issue: Zeitbezug von שָׁב
  choice: gegenwärtig formulierte, prophetisch gewisse Wiederherstellung
  alternative: „hat wiederhergestellt“ oder „wird wiederherstellen“
  rationale: Der hebräische Verbgebrauch lässt mehrere zeitliche Nuancen zu. Die Hauptfassung wahrt den lebendigen Orakelton; die Alternativen werden nicht dogmatisch ausgeschlossen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit erhaltener poetischer Bildsprache. Die Wiederholung in „Plünderer ... ausgeplündert“ bildet die hebräische Wortfigur nach. Sämtliche Fußnotenmarker stehen an den jeweils einschlägigen Stellen im Haupttext.
