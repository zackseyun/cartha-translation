  text: וְ/נִינְוֵ֥ה כִ/בְרֵֽכַת מַ֖יִם מִ֣/ימֵי הִ֑יא וְ/הֵ֣מָּה נָסִ֔ים עִמְד֥וּ עֲמֹ֖דוּ וְ/אֵ֥ין מַפְנֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/009.yaml
  text: Nineveh has been like a pool of water from her earliest days[a], yet they are fleeing[b]. “Stop! Stop!”—but no one turns back.
translation:
  language: de
  text: Ninive ist seit jeher[a] wie ein Wasserbecken. Doch sie fliehen. »Bleibt stehen! Bleibt stehen!«[b] Aber niemand wendet sich um.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „seit den Tagen, da sie war“; gemeint ist Ninives weit zurückreichende Vergangenheit.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder sinngemäß: „Haltet an! Haltet an!“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִינְוֵה
  choice: Ninive
  rationale: Der geläufige deutsche Name der Stadt; das einleitende וְ wird im Deutschen nicht eigens wiedergegeben, da der Satzanschluss auch ohne „und“ natürlich erkennbar ist.
- source_word: כִבְרֵכַת מַיִם
  choice: wie ein Wasserbecken
  rationale: Bewahrt das Bild eines Beckens beziehungsweise einer Ansammlung von Wasser, ohne die Art der Anlage als künstlichen Stausee festzulegen.
- source_word: מִימֵי הִיא
  choice: seit jeher
  rationale: Die wörtlich schwierige Wendung „seit den Tagen, da sie war“ bezeichnet den lange zurückreichenden Bestand der Stadt. „Seit jeher“ gibt diesen idiomatischen Zeitsinn knapp und natürlich wieder.
- source_word: וְהֵמָּה נָסִים
  choice: Doch sie fliehen
  rationale: Das selbstständige Pronomen mit Partizip stellt die fliehenden Menschen nachdrücklich vor Augen. „Doch“ bringt den Gegensatz zum Bild der seit Langem bestehenden, wassergefüllten Stadt zum Ausdruck, ohne „sie“ näher zu bestimmen.
- source_word: עִמְדוּ עֲמֹדוּ
  choice: Bleibt stehen! Bleibt stehen!
  rationale: Die wiederholten Pluralimperative werden direkt und mit ihrer Dringlichkeit wiedergegeben. „Bleibt stehen“ wahrt zugleich die Grundbedeutung von עמד und passt zum Zuruf an Flüchtende.
- source_word: וְאֵין מַפְנֶה
  choice: Aber niemand dreht sich um
  rationale: 'Die persönliche Formulierung gibt die Szene natürlich wieder: Niemand reagiert auf den Ruf, indem er sich umwendet.'
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kurze Sätze und der doppelte Zuruf bewahren das rasche Tempo der Fluchtszene. Das unbestimmte „sie“ bleibt entsprechend dem Hebräischen erhalten; eine ausdrückliche Ergänzung wie „die Einwohner“ wurde vermieden.
