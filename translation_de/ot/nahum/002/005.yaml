  text: בַּֽ/חוּצוֹת֙ יִתְהוֹלְל֣וּ הָ/רֶ֔כֶב יִֽשְׁתַּקְשְׁק֖וּ/ן בָּ/רְחֹב֑וֹת מַרְאֵי/הֶן֙ כַּ/לַּפִּידִ֔ם כַּ/בְּרָקִ֖ים יְרוֹצֵֽצוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/005.yaml
  text: In the streets the chariots race wildly[a]; they rattle through the squares. Their appearance is like torches[c][b]; like lightning they dart about.
translation:
  language: de
  text: Auf den Straßen rasen die Streitwagen[a]; auf den Plätzen rattern sie[b]. Sie sehen aus wie Fackeln; wie Blitze schießen sie hin und her[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sie toben«; das hebräische Verb kann wildes oder rasendes Verhalten bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »sie klappern«. Das seltene hebräische Verb ist wahrscheinlich lautmalerisch und betont lärmende, ruckartige Bewegung.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »sie rasen umher«; das hebräische Verb betont schnelle Bewegung hin und her.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחוּצוֹת
  choice: auf den Straßen
  rationale: חוּצוֹת bezeichnet hier im Parallelismus mit den weiten Plätzen die Straßen der Stadt; diese Wiedergabe ist im Deutschen natürlich und konkret.
- source_word: יִתְהוֹלְלוּ
  choice: rasen ... wie toll
  rationale: Die Hitpolel-Form beschreibt hier ein wildes, beinahe wahnsinniges Verhalten beziehungsweise eine entsprechend rasende Bewegung. Die Formulierung erhält sowohl das hohe Tempo als auch den Eindruck entfesselter Unordnung.
- source_word: הָרֶכֶב
  choice: die Wagen
  rationale: רֶכֶב steht morphologisch im Singular, ist hier aber kollektiv für die Streitwagen beziehungsweise Wagenverbände gebraucht. Der deutsche Plural gibt diesen Sinn natürlich wieder.
- source_word: יִשְׁתַּקְשְׁקוּן
  choice: rattern sie
  rationale: Das seltene, wohl lautmalerische Verb vermittelt klappernd-ratternden Lärm und stoßartige Bewegung. „Rattern“ bewahrt im Deutschen beide Aspekte knapp und anschaulich.
- source_word: בָּרְחֹבוֹת
  choice: über die Plätze
  rationale: רְחֹבוֹת sind breite öffentliche Flächen oder Plätze innerhalb der Stadt. „Plätze“ wahrt den städtischen Schauplatz und den Gegensatz zu den Straßen.
- source_word: מַרְאֵיהֶן
  choice: ihr Anblick
  rationale: Das Wort bezeichnet die sichtbare Erscheinung. „Ihr Anblick“ leitet den folgenden Vergleich idiomatisch ein.
- source_word: כַּלַּפִּידִם
  choice: wie der von Fackeln
  rationale: לַפִּידִים sind Fackeln oder brennende Feuerbrände. Die leicht ergänzte Vergleichsform macht im Deutschen deutlich, dass der Anblick der Wagen mit Fackeln verglichen wird.
- source_word: כַּבְּרָקִים
  choice: wie Blitze
  rationale: Der Plural bezeichnet Blitzerscheinungen. „Wie Blitze“ erhält Bildkraft und grammatische Zahl.
- source_word: יְרוֹצֵצוּ
  choice: schießen sie hin und her
  rationale: Das Verb beschreibt rasche, wiederholte Bewegung in verschiedene Richtungen. Die Wiedergabe passt zum Blitzvergleich und bewahrt das Moment des Hin und Her.
