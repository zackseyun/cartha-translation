translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit kurzen, bewegten Satzgliedern. Die lautliche Wirkung von „rasen“ und „rattern“ unterstützt die tumultartige Szene, ohne den seltenen hebräischen Verben eine übermäßig genaue Bedeutung aufzuzwingen.
