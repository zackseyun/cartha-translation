base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/007.yaml
  text: The gates of the rivers are opened[b][a], and the palace melts away.
translation:
  language: de
  text: Die Tore der Flüsse[a] werden geöffnet, und der Palast[b] zerfließt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kanäle“. Gemeint sein können Ninives Wasserläufe oder künstlich angelegte Kanäle.'
