  - marker: b
    text: 'Oder: „Tempel“; das hebräische Wort kann sowohl einen Palast als auch einen Tempel bezeichnen. Hier spricht der Zusammenhang eher für „Palast“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁעֲרֵי
  choice: Tore der
  rationale: Der Konstruktplural von שַׁעַר bezeichnet Tore oder Zugänge. „Tore der Flüsse“ bewahrt die knappe, bildhafte Verbindung des Hebräischen, ohne bereits eine bestimmte historische Anlage vorauszusetzen.
- source_word: הַנְּהָרוֹת
  choice: Flüsse
  rationale: נָהָר bezeichnet gewöhnlich einen Fluss oder Strom. Im Zusammenhang mit Ninive können künstlich regulierte Wasserläufe oder Kanäle gemeint sein; diese Möglichkeit wird in der Fußnote offengehalten.
- source_word: נִפְתָּחוּ
  choice: werden geöffnet
  rationale: Das Nifal Perfekt von פָּתַח hat hier passiven Sinn. Das deutsche Präsens gibt die lebendige prophetische Darstellung wieder, ohne einen Handelnden hinzuzufügen.
- source_word: הַהֵיכָל
  choice: Palast
  rationale: הֵיכָל kann einen Palast oder einen Tempel bezeichnen. Im Gerichtswort über Ninive spricht der Zusammenhang eher für den königlichen Palast; die lexikalische Alternative bleibt in der Fußnote erhalten.
- source_word: נָמוֹג
  choice: zerfließt
  rationale: Das Verb beschreibt Schmelzen, Zergehen oder den Verlust von Festigkeit. „Zerfließt“ wahrt das starke Bild und lässt offen, ob baulicher Zusammenbruch, Auflösung der Ordnung oder verzagtes Dahinsinken im Vordergrund steht.
