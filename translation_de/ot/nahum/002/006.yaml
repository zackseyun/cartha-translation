  yaml_path: translation/ot/nahum/002/006.yaml
  text: He summons his nobles; they stumble in their march. They hurry to her wall, and the siege shelter is set up.
translation:
  language: de
  text: Er erinnert sich an seine Mächtigen; bei ihrem Marsch stolpern sie. Sie eilen zu ihrer Mauer, und der Schutzschirm wird aufgestellt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schutzdach“ oder „Belagerungsschutzvorrichtung“. Das seltene hebräische Wort bezeichnet wahrscheinlich eine abschirmende Vorrichtung; ihre genaue Art ist unsicher.'
    reason: Der technische Sinn von הַסֹּכֵךְ ist nicht eindeutig. Die Anmerkung wahrt die sachliche Unsicherheit, ohne festzulegen, ob die Vorrichtung den Angreifern oder den Verteidigern dient.
lexical_decisions:
- source_word: יִזְכֹּר
  choice: ruft … zusammen
  rationale: Das Verb bedeutet wörtlich „gedenken/ sich erinnern“, kann hier im militärischen Zusammenhang jedoch das Aufbieten bzw. Zusammenrufen der maßgeblichen Kämpfer ausdrücken. Der Kontext verlangt eine aktive Mobilisierung.
- source_word: אַדִּירָיו
  choice: seine Mächtigen
  rationale: אַדִּיר bezeichnet vornehme, mächtige oder führende Männer. „Mächtige“ bewahrt die mögliche Verbindung von Rang und militärischer Stärke, ohne sie enger als „Offiziere“ festzulegen.
- source_word: בַּהֲלִיכוֹתָם
  choice: auf ihrem Weg
  rationale: Die Form bezeichnet ihr Gehen bzw. ihren Gang. „Auf ihrem Weg“ ist natürlich und legt nicht unnötig fest, ob ein geordneter Marsch gemeint ist.
- source_word: הַסֹּכֵךְ
  choice: das Schutzdach
  rationale: Das seltene Wort bezeichnet etwas Deckendes oder Abschirmendes. Im Belagerungskontext ist wahrscheinlich eine Schutzvorrichtung gemeint; „Schutzdach“ wahrt diese Funktion, ohne eine genauer unbekannte Konstruktion vorzutäuschen.
theological_decisions:
- issue: Bezug der männlichen und weiblichen Pronomen
  choice: „seine Mächtigen“ und „ihre Mauer“
  alternative: Beide Pronomen auf dieselbe Partei oder Stadt beziehen
  rationale: Der hebräische Text wechselt vom maskulinen Besitzer der Mächtigen zum femininen Bezug der Mauer. Die Übersetzung erhält diesen Wechsel und entscheidet nicht ausdrücklich, welche historische Gestalt mit „er“ gemeint ist.
translation_notes:
  register: Moderne, würdige Standardsprache. Die kurzen, raschen Hauptsätze spiegeln die hektische militärische Szene. Der seltene technische Ausdruck wird verständlich, aber nicht überpräzise wiedergegeben.
