base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/013.yaml
  text: The lion tore enough for his cubs and strangled prey for his lionesses[b][a]; he filled his dens with prey and his lairs with torn flesh.
translation:
  language: de
  text: Der Löwe riss genug Beute[a] für seine Jungen und erwürgte Beute für seine Löwinnen. Er füllte seine Höhlen mit Beute und seine Lagerstätten mit zerrissenem Fleisch.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Der Löwe riss immer wieder genug Beute für seine Jungen.“ Das hebräische Partizip kann einen andauernden oder wiederholten Vorgang ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: „Zerrissenes Fleisch“ kann auch mit „Beute“ oder „Zerrissenes“ wiedergegeben werden. Die Übersetzung unterscheidet den Ausdruck von dem zuvor verwendeten Wort für „Beute“ und erhält so die sprachliche Variation des Hebräischen.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְיֵה
  choice: der Löwe
  rationale: Der Singular zeichnet in der gegen Ninive gerichteten Bildrede einen repräsentativen Raublöwen; der bestimmte Artikel passt zur bereits entfalteten Löwenmetapher.
- source_word: טֹרֵף בְּדֵי
  choice: riss genug Beute
  rationale: טרף bezeichnet das Reißen von Beute, und בְּדֵי bringt ausdrücklich das ausreichende Maß zum Ausdruck. Die deutsche Wortstellung macht den impliziten Gegenstand natürlich verständlich.
- source_word: גֹרוֹתָיו
  choice: seine Jungen
  rationale: Gemeint sind die Jungen des Löwen. „Junge“ ist im modernen Deutschen natürlich und im Kontext eindeutig.
- source_word: וּמְחַנֵּק
  choice: und erwürgte Beute
  rationale: חנק bedeutet „würgen/erwürgen“. „Beute“ wird als aus dem Zusammenhang erschlossener Gegenstand ergänzt, da eine objektlose Formulierung im Deutschen missverständlich wäre.
- source_word: לְלִבְאֹתָיו
  choice: für seine Löwinnen
  rationale: Die feminine Pluralform bezeichnet die weiblichen Löwen und bewahrt das zoologische Bild.
- source_word: וַיְמַלֵּא
  choice: Er füllte
  rationale: Die finite Verbform führt die Schilderung weiter; ein neuer deutscher Hauptsatz gibt den poetischen Fortgang klar wieder.
- source_word: טֶרֶף
  choice: Beute
  rationale: „Beute“ erhält sowohl das Löwenbild als auch den im weiteren Kontext mitschwingenden Gedanken des Plünderns.
- source_word: חֹרָיו
  choice: seine Höhlen
  rationale: Das Wort bezeichnet Löcher oder Höhlen als Tierbehausungen. „Höhlen“ ist anschaulich und lässt sich vom parallelen „Lager“ unterscheiden.
- source_word: וּמְעֹנֹתָיו
  choice: seine Lager
  rationale: Das Wort bezeichnet Wohn- oder Zufluchtsstätten. „Lager“ wahrt im Löwenbild die Vorstellung eines Tierlagers und erhält die poetische Variation.
- source_word: טְרֵפָה
  choice: zerrissenes Fleisch
  rationale: Das Substantiv bezeichnet Zerrissenes beziehungsweise gerissenes Tierfleisch. Die Wiedergabe unterscheidet es bewusst vom vorherigen טֶרֶף („Beute“) und bewahrt die drastische Bildsprache.
theological_decisions:
- issue: Löwenbild für Assyrien beziehungsweise Ninive
  choice: Das konkrete Löwenbild bleibt im Haupttext ohne politische Ausdeutung erhalten.
  alternative: Eine Paraphrase wie „Der assyrische König plünderte für sein Volk“.
  rationale: Der Vers wirkt als poetische Bildrede im Gerichtswort gegen Ninive. Eine direkte politische Auflösung würde die Metapher verengen und Auslegung in den Übersetzungstext eintragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit anschaulicher Raubtiermetaphorik. Die beiden hebräischen Begriffe für Tierbehausungen werden durch „Höhlen“ und „Lager“ unterschieden; die harten Verben und das Schlussbild werden nicht abgeschwächt.
