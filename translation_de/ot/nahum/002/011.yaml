base_translation:
  language: en
  yaml_path: translation/ot/nahum/002/011.yaml
  text: Devastation[a], desolation, and destruction! Hearts melt, knees give way, anguish is in every waist, and all their faces grow pale.
translation:
  language: de
  text: Leere, Verödung und Verwüstung! Die Herzen schmelzen dahin, die Knie knicken ein, Qual ist in allen Hüften, und alle Gesichter verlieren ihre Farbe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich möglicherweise: »Alle ihre Gesichter sammeln Dunkelheit.« Der schwierige hebräische Ausdruck kann eine dunkle oder vor Schrecken entfärbte Gesichtsfarbe bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוּקָה וּמְבוּקָה וּמְבֻלָּקָה
  choice: Leere, Verödung und Verwüstung
  rationale: Die drei klanglich eng verbundenen Substantive schildern in rascher Steigerung die vollständige Verwüstung. Die deutsche Dreierfolge wahrt die rhetorische Wucht und unterscheidet zugleich Zustand, Verlassenheit und Zerstörung.
- source_word: לֵב נָמֵס
  choice: Die Herzen schmelzen dahin
  rationale: Das hebräische Bild bezeichnet Furcht und den Verlust des Mutes. Der Plural gibt den kollektiven Sinn natürlich wieder, ohne die Metapher aufzulösen.
- source_word: פִק בִּרְכַּיִם
  choice: die Knie knicken ein
  rationale: פִק bezeichnet hier das Nachgeben oder Zusammenbrechen der Knie. Die Formulierung ist im heutigen Deutsch anschaulich und idiomatisch.
- source_word: חַלְחָלָה בְּכָל מָתְנַיִם
  choice: alle Hüften zittern
  rationale: חַלְחָלָה kann Zittern, Winden oder qualvolle Erschütterung bezeichnen; מָתְנַיִם meint Hüften beziehungsweise Lenden. Die knappe Formulierung vermittelt die körperliche Reaktion auf den Schrecken verständlich.
- source_word: וּפְנֵי כֻלָּם קִבְּצוּ פָארוּר
  choice: alle Gesichter verlieren ihre Farbe
  rationale: Die schwierige Wendung beschreibt offenbar eine durch Schrecken veränderte Gesichtsfarbe. Die Hauptfassung gibt die Wirkung natürlich wieder; die mögliche wörtlichere Deutung als Verdunkelung bleibt in der Fußnote erhalten.
