source:
  edition: WLC
  text: מַה תְּחַשְּׁבוּ/ן֙ אֶל יְהוָ֔ה כָּלָ֖ה ה֣וּא עֹשֶׂ֑ה לֹֽא תָק֥וּם פַּעֲמַ֖יִם צָרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/009.yaml
  text: What are you plotting against Yahweh? He will make a complete end[b][a]; trouble will not rise up a second time.
translation:
  language: de
  text: Was plant ihr gegen Jahwe?[a] Er wird ein endgültiges Ende herbeiführen; die Not wird kein zweites Mal aufkommen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Was ersinnt ihr gegen Jahwe?“ Das Verb kann „denken“, „planen“ oder „ersinnen“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Die Bedrängnis wird nicht ein zweites Mal aufkommen“ beziehungsweise „Das Unheil wird nicht ein zweites Mal kommen.“ Das knappe Hebräisch kann sich entweder auf einen erneuten Angriff des Feindes oder auf die Notwendigkeit eines wiederholten Gerichts beziehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַה
  choice: Was
  rationale: Das Interrogativ eröffnet eine rhetorische Frage. „Was“ entspricht der hebräischen Form unmittelbar; idiomatisch wäre auch „Warum“ denkbar.
- source_word: תְּחַשְּׁבוּן
  choice: schmiedet ihr
  rationale: חשׁב kann „denken“, „planen“ oder „ersinnen“ bedeuten. In Verbindung mit אֶל יְהוָה und der folgenden Gerichtsankündigung bezeichnet es hier feindliches Planen; „schmieden“ gibt diese Nuance im Deutschen knapp und natürlich wieder.
- source_word: אֶל
  choice: gegen
  rationale: אֶל bedeutet gewöhnlich „zu/auf … hin“, bezeichnet in diesem feindlichen Zusammenhang aber die Ausrichtung der Pläne gegen Jahwe.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כָּלָה
  choice: ein vollständiges Ende
  rationale: Das Substantiv bezeichnet Vollendung beziehungsweise ein restloses Ende und kann im Gerichtskontext völlige Vernichtung einschließen. Die Formulierung bewahrt beide Aspekte, ohne die Aussage unnötig zu verengen.
- source_word: הוּא עֹשֶׂה
  choice: Er wird … herbeiführen
  rationale: Pronomen und Partizip betonen Jahwe als Handelnden. Im prophetischen Kontext gibt das deutsche Futur die bevorstehende beziehungsweise gewisse Handlung angemessen wieder; „herbeiführen“ verbindet sich natürlich mit „Ende“.
- source_word: לֹא תָקוּם
  choice: wird … nicht aufkommen
  rationale: קום bedeutet wörtlich „aufstehen/sich erheben“ und kann übertragen „aufkommen/entstehen“ heißen. „Aufkommen“ erhält einen Rest des Bildes und klingt mit „Not“ idiomatisch.
- source_word: פַּעֲמַיִם
  choice: kein zweites Mal
  rationale: Dies ist im Deutschen in diesem Satz natürlicher als das formal mögliche „nicht zweimal“.
- source_word: צָרָה
  choice: Not
  rationale: צָרָה kann Not, Bedrängnis, Drangsal oder Unheil bezeichnen. „Not“ ist knapp und lässt den im Hebräischen offenen Bezug der Schlussaussage bestehen.
theological_decisions:
- issue: Bezug und Aussagekraft des Schlusssatzes
  choice: 'Die knappe Aussage bleibt allgemein: „Die Not wird kein zweites Mal aufkommen.“'
  alternative: Gemeint sein könnte entweder, dass der feindliche Angriff nicht nochmals aufkommt, oder dass die Bedrängnis beziehungsweise das Gericht nicht wiederholt werden muss.
  rationale: Das Hebräische nennt keinen enger bestimmten Träger oder Betroffenen der צָרָה. Die Übersetzung bewahrt daher die Mehrdeutigkeit und betont zugleich die Endgültigkeit von Jahwes Handeln, ohne sie ausschließlich auf Juda oder dessen Feinde zu beziehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Schmiedet“ vermittelt die feindliche Planung ohne umständliche Umschreibung; „vollständiges Ende“ hält die ungewöhnliche, nachdrückliche Ausdrucksweise des Hebräischen sichtbar. Die Satzstruktur bleibt knapp und prophetisch.
