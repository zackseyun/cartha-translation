id: NAM.1.5
reference: Nahum 1:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הָרִים֙ רָעֲשׁ֣וּ מִמֶּ֔/נּוּ וְ/הַ/גְּבָע֖וֹת הִתְמֹגָ֑גוּ וַ/תִּשָּׂ֤א הָ/אָ֨רֶץ֙ מִ/פָּנָ֔י/ו וְ/תֵבֵ֖ל וְ/כָל יֹ֥שְׁבֵי בָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/005.yaml
  text: The mountains quake before him[a], and the hills melt away; the earth rises up before his face[b], the world and all who dwell in it.
translation:
  language: de
  text: Die Berge beben vor ihm[a], und die Hügel zerschmelzen. Die Erde hebt sich vor seinem Angesicht[b] – die Welt mit allen, die auf ihr wohnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von ihm her“; auch möglich: „seinetwegen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „vor seinem Gesicht“. Für „hebt sich“ sind im Zusammenhang auch „bäumt sich auf“ oder „wallt auf“ möglich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִים
  choice: die Berge
  rationale: Die bestimmte Pluralform wird direkt und idiomatisch wiedergegeben.
- source_word: רָעֲשׁוּ
  choice: beben
  rationale: Das Verb bezeichnet heftiges Zittern oder Erschüttertwerden und passt zur kosmischen Theophanie.
- source_word: מִמֶּנּוּ
  choice: vor ihm
  rationale: Wörtlich steht „von ihm her“; im Zusammenhang beschreibt die Präposition die Reaktion der Berge auf Gottes Gegenwart beziehungsweise sein Herannahen.
- source_word: הַגְּבָעוֹת
  choice: die Hügel
  rationale: Dies ist die übliche und sachlich genaue Entsprechung.
- source_word: הִתְמֹגָגוּ
  choice: zerschmelzen
  rationale: Die Form zeichnet ein völliges Schmelzen oder Zerfließen; „zerschmelzen“ bewahrt das kräftige Bild in würdigem Deutsch.
- source_word: וַתִּשָּׂא
  choice: hebt sich
  rationale: Die Form von נשׂא vermittelt hier ein Sichheben beziehungsweise Aufwallen der Erde. Die Übersetzung wahrt die Aufwärtsbewegung, ohne die im Kontext mögliche Vorstellung eines Aufbäumens oder Aufgewühltwerdens festzulegen.
- source_word: הָאָרֶץ
  choice: die Erde
  rationale: Die folgende Parallele mit der Welt und ihren Bewohnern legt den umfassenden Sinn „Erde“ statt des engeren „Land“ nahe.
- source_word: מִפָּנָיו
  choice: vor seinem Angesicht
  rationale: Die Wiedergabe erhält die wörtliche, anthropomorphe Wendung „vor seinem Gesicht/Angesicht“ und ihren feierlichen Klang.
- source_word: תֵבֵל
  choice: die Welt
  rationale: תֵבֵל bezeichnet die bewohnte beziehungsweise geordnete Welt; „die Welt“ ist im heutigen Deutsch die natürlichste Entsprechung.
- source_word: וְכָל יֹשְׁבֵי בָהּ
  choice: mit allen, die auf ihr wohnen
  rationale: Die partizipiale Wendung bezeichnet sämtliche Bewohner der Erde beziehungsweise Welt. „Mit“ macht die erläuternde Fortführung im Deutschen verständlich, ohne ihren umfassenden Sinn abzuschwächen.
theological_decisions:
- issue: Kosmisch-theophanische Bildsprache des göttlichen Gerichts
  choice: Die Reaktion der gesamten Schöpfung auf Gottes Gegenwart wird in ihren starken kosmischen Bildern wiedergegeben.
  alternative: Die Aussagen ausschließlich als Bild für politische Erschütterungen auszulegen.
  rationale: Der unmittelbare Zusammenhang schildert eine Theophanie in Zorn und Majestät. Die Übersetzung bewahrt Reichweite und Spannung der Bildsprache, ohne über den Text hinaus zu entscheiden, wie wörtlich sie zu verstehen ist.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Klang. „Angesicht“ ist bewusst als leicht gehobene, aber geläufige Form gewählt, um das hebräische Bild zu erhalten. Der Gedankenstrich kennzeichnet „die Welt mit allen, die auf ihr wohnen“ als entfaltende Erläuterung der Erde.
