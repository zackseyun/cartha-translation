id: NAM.1.2
reference: Nahum 1:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֵ֣ל קַנּ֤וֹא וְ/נֹקֵם֙ יְהוָ֔ה נֹקֵ֥ם יְהוָ֖ה וּ/בַ֣עַל חֵמָ֑ה נֹקֵ֤ם יְהוָה֙ לְ/צָרָ֔י/ו וְ/נוֹטֵ֥ר ה֖וּא לְ/אֹיְבָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/002.yaml
  text: Yahweh is a jealous and avenging God[a]; Yahweh is avenging and full of wrath. Yahweh takes vengeance on his adversaries[c][b], and he keeps wrath for his enemies.
translation:
  language: de
  text: Jahwe ist ein eifersüchtiger[a] und Rache übender Gott; Jahwe übt Rache und ist voller Zorn[b]. Jahwe übt Rache an seinen Widersachern und bewahrt seinen Zorn für seine Feinde[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eifernd“. Das hebräische Wort bezeichnet Jahwes leidenschaftlichen Anspruch auf ungeteilte Treue.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Besitzer/Herr des Zorns“. Die hebräische Wendung bezeichnet jemanden, der von Zorn erfüllt oder durch Zorn gekennzeichnet ist.'
    reason: literal_rendering
  - marker: c
    text: '„Seinen Zorn“ ist im Hebräischen nicht ausdrücklich genannt, ergibt sich aber aus dem vorherigen Satzteil. Auch möglich: „und er bewahrt ihn für seine Feinde auf“ oder, je nach Nuance von „bewahren“, „und er trägt seinen Feinden nach“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  choice: Gott
  rationale: אֵל bezeichnet hier den Gott Israels und steht mit den folgenden Charakterisierungen in enger Verbindung. „Gott“ ist im Deutschen klar und natürlich; „mächtiger Gott“ würde eine im Ausdruck nicht ausdrücklich enthaltene Nuance hinzufügen.
- source_word: קַנּוֹא
  choice: eifersüchtig
  rationale: Das Adjektiv bezeichnet Jahwes leidenschaftlichen Anspruch auf ungeteilte Treue. „Eifersüchtig“ bewahrt den relationalen und bundeshaften Gehalt; die mögliche Wiedergabe „eifernd“ wird in der Fußnote genannt.
- source_word: נֹקֵם / וְנֹקֵם
  choice: vergeltend / vergilt
  rationale: Die dreifache Wiederholung des Partizips von נקם wird durch Formen desselben deutschen Verbs hörbar bewahrt. „Vergelten“ vermittelt gerichtliche Ahndung, ohne die Aussage zu mildern oder mit dem psychologisch belasteten Adjektiv „rachsüchtig“ wiederzugeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: וּבַעַל חֵמָה
  choice: und ist Herr des Zorns
  rationale: Die relativ formale Wiedergabe bewahrt die markante hebräische Konstruktion „Herr/Besitzer des Zorns“. Im Deutschen bezeichnet sie hier jemanden, der über Zorn verfügt beziehungsweise von ihm erfüllt ist, nicht jemanden, der ihm unterworfen wäre.
- source_word: חֵמָה
  choice: Zorn
  rationale: „Zorn“ gibt im prophetischen Gerichtskontext die starke, auf Ahndung gerichtete göttliche Reaktion angemessen wieder. „Wut“ könnte unbeherrscht klingen, „Hitze“ wäre zu wörtlich.
- source_word: לְצָרָיו
  choice: seinen Widersachern
  rationale: Die Präposition לְ markiert hier beim Verb נקם die Zielpersonen der Vergeltung. Der deutsche Dativ bei „vergelten“ bildet die Konstruktion idiomatisch ab.
- source_word: וְנוֹטֵר
  choice: und bewahrt
  rationale: נטר kann „bewahren, aufrechterhalten, nachtragen“ bedeuten. „Bewahrt“ lässt offen, ob besonders an das Festhalten am Zorn oder dessen Aufsparen für das Gericht gedacht ist.
- source_word: הוּא
  choice: Jahwe … bewahrt
  rationale: Das ausdrückliche Pronomen hebt im Hebräischen das Subjekt hervor. Die Wiederaufnahme des Namens am Satzanfang und das finite Verb ergeben im Deutschen eine klare, nachdrückliche Aussage; eine zusätzliche isolierte Wiedergabe von הוּא wäre schwerfällig.
- source_word: לְאֹיְבָיו
  choice: für seine Feinde
  rationale: '„Für“ bewahrt die dative Zielrichtung: Was Jahwe festhält beziehungsweise aufspart, ist für seine Feinde bestimmt.'
theological_decisions:
- issue: Göttliche Eifersucht
  choice: Jahwe wird als „eifersüchtig“ im Sinn seines ausschließlichen Anspruchs auf Treue bezeichnet.
  alternative: „eifernd“ oder „voll leidenschaftlichen Eifers“
  rationale: Die Übersetzung bewahrt die anstößige und theologisch gewichtige Bildsprache, ohne sie als kleinliche Missgunst zu erklären. Die Fußnote sichert die positive Nuance leidenschaftlichen Eifers.
- issue: Göttliche Vergeltung und göttlicher Zorn
  choice: Die dreifache Vergeltungsaussage und der starke Begriff „Zorn“ bleiben ungemildert stehen.
  alternative: Mildere Wiedergaben wie „bestraft“ oder „ist zornig“
  rationale: Der Ausgangstext betont נקם dreimal und verwendet חֵמָה. Eine Abschwächung würde den gerichtlichen Ernst und die rhetorische Wucht des Verses vermindern.
- issue: Objekt von וְנוֹטֵר
  choice: „seinen Zorn“ wird als aus dem vorherigen Ausdruck ergänztes Objekt wiedergegeben.
  alternative: 'Ohne ausdrückliches Objekt: „und er trägt seinen Feinden nach“'
  rationale: Im Hebräischen fehlt ein ausgesprochenes Objekt; aus „Zorn“ im vorherigen Glied ergibt es sich jedoch naheliegend. Die Fußnote macht diese Ergänzung und die mögliche Nuance des Aufsparens transparent.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit bewusst kräftiger Gerichtssemantik. Die dreifache Wiederholung von נקם wird durch „vergeltend/vergilt/vergilt“ erhalten. „Widersacher“ ist leicht gehoben, aber allgemein verständlich und passt zum prophetisch-poetischen Register.
