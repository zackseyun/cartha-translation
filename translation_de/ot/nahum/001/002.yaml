  rationale: Die Revision ersetzt die missverständliche deutsche בעל-Konstruktion durch die idiomatische, quellensprachlich angemessene Wendung „voller Zorn“. Zugleich verdeutlicht „Rache übt an“ die Zielrichtung der Vergeltung und bewahrt die dreifache rhetorische Wiederholung. Die abschließende Ergänzung von „seinen Zorn“ bleibt bestehen, wird aber in der Fußnote korrekt als im Deutschen explizit gemachte, im Hebräischen nur implizite Größe ausgewiesen.
