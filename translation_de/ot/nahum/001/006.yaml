  text: לִ/פְנֵ֤י זַעְמ/וֹ֙ מִ֣י יַֽעֲמ֔וֹד וּ/מִ֥י יָק֖וּם בַּ/חֲר֣וֹן אַפּ֑/וֹ חֲמָת/וֹ֙ נִתְּכָ֣ה כָ/אֵ֔שׁ וְ/הַ/צֻּרִ֖ים נִתְּצ֥וּ מִמֶּֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/006.yaml
  text: Who can stand before his indignation? And who can rise up in the heat of his anger? His wrath is poured out like fire[c][b][a], and the rocks are shattered by him.
translation:
  language: de
  text: Wer kann vor seinem Grimm bestehen? Und wer kann sich angesichts der Glut seines Zorns erheben? Sein Zorn ergießt sich wie Feuer, und die Felsen bersten seinetwegen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und die Felsen werden von ihm zerschmettert“ beziehungsweise „bersten vor ihm“. Das hebräische Verhältniswort kann Ursache, Ausgangspunkt oder Urheberschaft ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי זַעְמוֹ
  choice: vor seinem Grimm
  rationale: לִפְנֵי bezeichnet hier das Stehen vor bzw. in der Gegenwart Gottes; „Grimm“ gibt זַעַם als heftigen, richtenden Zorn in würdigem modernem Deutsch wieder.
- source_word: מִי יַעֲמוֹד
  choice: Wer kann … bestehen?
  rationale: עמד bedeutet wörtlich „stehen“; in der rhetorischen Frage bezeichnet es zugleich das Standhalten. „Bestehen“ vermittelt beide Aspekte natürlich.
- source_word: וּמִי יָקוּם
  choice: Und wer kann sich erheben
  rationale: קום bedeutet „aufstehen/sich erheben“. Die Wiedergabe wahrt den Wechsel gegenüber עמד und den poetischen Parallelismus.
- source_word: בַּחֲרוֹן אַפּוֹ
  choice: gegen die Glut seines Zorns
  rationale: Die Wendung bewahrt das hebräische Bild des brennenden Zorns. „Gegen“ bringt im Deutschen den Gedanken des Standhaltens angesichts dieser Glut klar zum Ausdruck.
- source_word: חֲמָתוֹ
  choice: Sein Zorn
  rationale: חֵמָה bezeichnet hier den heftigen göttlichen Zorn. „Zorn“ ist verständlich, würdig und vermeidet eine unnötig emotionale Verengung auf „Wut“.
- source_word: נִתְּכָה כָאֵשׁ
  choice: ergießt sich wie Feuer
  rationale: Das Niphal von נתך beschreibt hier das Ausgegossenwerden bzw. Sich-Ergießen; „wie Feuer“ erhält den ausdrücklichen Vergleich.
- source_word: הַצֻּרִים נִתְּצוּ
  choice: die Felsen bersten
  rationale: צוּר bezeichnet Fels oder Felsklippe; נתץ drückt gewaltsames Zerbrechen aus. „Bersten“ gibt die machtvolle Naturbildsprache prägnant wieder.
- source_word: מִמֶּנּוּ
  choice: seinetwegen
  rationale: Die Präposition מן kann hier Ursache oder Ausgangspunkt, möglicherweise auch mittelbare Urheberschaft ausdrücken. „Seinetwegen“ wahrt diese Offenheit besser als das eindeutig instrumentale „durch ihn“.
theological_decisions:
- issue: Mehrere Bezeichnungen für Gottes Zorn
  choice: „Grimm“, „Glut seines Zorns“ und „Zorn“
  alternative: Alle drei hebräischen Ausdrücke einheitlich mit „Zorn“ wiedergeben
  rationale: Die variierte Wiedergabe spiegelt die Häufung unterschiedlicher hebräischer Zornbegriffe, ohne daraus verschiedene göttliche Eigenschaften abzuleiten.
- issue: Rhetorische Fragen nach menschlichem Standhalten
  choice: Mit „kann“ als Fragen nach der Fähigkeit formuliert
  alternative: 'Schlichter Indikativ: „Wer besteht …? Wer erhebt sich …?“'
  rationale: Im Zusammenhang fragen die Sätze rhetorisch danach, wer Gottes Zorn standhalten kann. „Kann“ macht diese im Hebräischen implizite modale Kraft deutlich.
- issue: Bedeutung von מִמֶּנּוּ im Schlussglied
  choice: Kausale/offene Wiedergabe „seinetwegen“
  alternative: Instrumental „durch ihn“ oder quellenbezogen „von ihm her“
  rationale: Das Hebräische lässt Ursache, Quelle oder Urheberschaft anklingen. Die Übersetzung soll diese Spannung nicht unnötig auf eine rein instrumentale Aussage festlegen.
translation_notes:
  register: Moderne, würdige Standardsprache mit poetischer Kraft. „Bestehen“, „Grimm“, „Glut“ und „bersten“ sind allgemein verständlich und bewahren die verdichtete Bildsprache des prophetischen Textes.
