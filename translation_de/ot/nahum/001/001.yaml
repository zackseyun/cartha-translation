  variant: modern standard German
source:
  edition: WLC
  text: מַשָּׂ֖א נִֽינְוֵ֑ה סֵ֧פֶר חֲז֛וֹן נַח֖וּם הָ/אֶלְקֹשִֽׁי׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/001.yaml
  text: An oracle concerning Nineveh[a]. The book of the vision of Nahum the Elkoshite.
translation:
  language: de
  text: Ausspruch über Ninive[a]. Das Buch der Vision Nahums, des Elkoschiters.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Last Ninives“ oder „Verkündigung über Ninive“.'
    reason: Lexikalische Alternativen zu מַשָּׂא und die knappe, im Hebräischen mehrdeutige Verbindung mit Ninive werden sichtbar gemacht.
lexical_decisions:
- source_word: מַשָּׂא
  choice: Ausspruch
  rationale: In prophetischen Überschriften bezeichnet das Wort eine gewichtige prophetische Kundgabe. „Ausspruch“ ist im heutigen Deutsch verständlich und bewahrt die formelle Bedeutung, ohne das Bild einer wörtlichen Last in den Vordergrund zu stellen.
- source_word: נִינְוֵה
  choice: Ninive
  rationale: Der Ortsname wird in der etablierten deutschen Form wiedergegeben.
- source_word: סֵפֶר
  choice: Buch
  rationale: Das Wort bezeichnet ein Buch, Schriftstück oder Dokument; „Buch“ ist hier als Teil der Überschrift natürlich und direkt.
- source_word: חֲזוֹן
  choice: Vision
  rationale: Der prophetische Fachbegriff bezeichnet eine offenbarte Schau beziehungsweise Botschaft. „Vision“ erhält diese Bedeutung, ohne die genaue Offenbarungsweise näher festzulegen.
- source_word: נַחוּם
  choice: Nahum
  rationale: Der Personenname wird in seiner etablierten deutschen biblischen Form wiedergegeben.
- source_word: הָאֶלְקֹשִׁי
  choice: des Elkoschiters
  rationale: Die Bezeichnung mit Artikel kennzeichnet Nahum nach seiner Herkunft oder Verbindung mit Elkosch. „Elkoschiter“ gibt die hebräische Herkunftsbezeichnung knapp und formal wieder.
theological_decisions:
- issue: Verhältnis der beiden Nominalsätze in der Überschrift
  choice: 'Wiedergabe als zwei kurze Überschriftensätze: „Ausspruch über Ninive. Das Buch der Vision Nahums, des Elkoschiters.“'
  alternative: 'Wiedergabe als eine einzige Titelzeile: „Der Ausspruch Ninives, das Buch der Vision Nahums, des Elkoschiters“, oder Übersetzung von מַשָּׂא mit „Last“.'
  rationale: Der hebräische Text enthält zwei nebeneinandergestellte Überschriftselemente. Zwei Sätze machen die Struktur im Deutschen klar und vermeiden das Missverständnis, Ninive sei Urheber des Ausspruchs. „Über Ninive“ kennzeichnet idiomatisch den Gegenstand, ohne die Beziehung stärker als nötig festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Form einer prophetischen Buchüberschrift bleibt erhalten; die traditionelle, heute jedoch leicht missverständliche Wiedergabe „Last“ wird in der Fußnote genannt.
