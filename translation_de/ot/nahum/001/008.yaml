source:
  edition: WLC
  text: וּ/בְ/שֶׁ֣טֶף עֹבֵ֔ר כָּלָ֖ה יַעֲשֶׂ֣ה מְקוֹמָ֑/הּ וְ/אֹיְבָ֖י/ו יְרַדֶּף חֹֽשֶׁךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/008.yaml
  text: But with an overwhelming flood he will make a complete end of its place[a], and darkness will pursue his enemies.
translation:
  language: de
  text: Doch mit einer alles überschwemmenden Flut wird er ihrer Stätte ein völliges Ende bereiten[a], und Finsternis wird seine Feinde verfolgen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich „ihrer Stätte“. Das Hebräische hat ein feminines Singularsuffix und stellt die Stadt unter dem Gericht wahrscheinlich wie eine Frau dar. Möglich ist auch: „ihres Ortes“.'
    reason: Der Bezug des femininen Suffixes ist im Vers nicht ausdrücklich genannt und bleibt daher auslegungsbedürftig.
lexical_decisions:
- source_word: וּבְשֶׁטֶף עֹבֵר
  choice: Doch mit einer alles überschwemmenden Flut
  rationale: Das וּ kann nach dem Schutzwort in Vers 7 einen Gegensatz markieren. שֶׁטֶף bezeichnet eine überströmende Flut, und עֹבֵר stellt sie als hinweg- beziehungsweise darüberströmend dar. Die deutsche Wendung bewahrt Bild und zerstörerische Gewalt.
- source_word: כָּלָה יַעֲשֶׂה
  choice: wird er … ein völliges Ende bereiten
  rationale: כָּלָה bezeichnet hier ein vollständiges Ende beziehungsweise vollständige Vernichtung. Mit „ein Ende bereiten“ wird יַעֲשֶׂה im Deutschen idiomatisch wiedergegeben, ohne die Vollständigkeit abzuschwächen.
- source_word: מְקוֹמָהּ
  choice: ihrer Stätte
  rationale: Das Suffix ist feminin Singular und verweist wahrscheinlich auf die unter Gericht stehende, personifiziert gedachte Stadt oder Macht. „Stätte“ eignet sich im gehobenen prophetischen Kontext und lässt den impliziten Bezug offen.
- source_word: וְאֹיְבָיו
  choice: und seine Feinde
  rationale: Das maskuline Singularsuffix bezieht sich im Kontext am natürlichsten auf den HERRN und bewahrt den Wechsel gegenüber dem femininen Suffix in מְקוֹמָהּ.
- source_word: יְרַדֶּף
  choice: wird … verfolgen
  rationale: Das Piel von רדף bedeutet verfolgen oder nachjagen. „Verfolgen“ gibt die bedrohliche Bewegung direkt wieder.
- source_word: חֹשֶׁךְ
  choice: Finsternis
  rationale: Das Wort bedeutet wörtlich Dunkelheit. „Finsternis“ trägt im Deutschen den prophetischen Gerichtsklang, ohne die Bildsprache auszudeuten.
theological_decisions:
- issue: Bezug der Suffixe in „ihrer Stätte“ und „seine Feinde“
  choice: „ihrer Stätte“ bezieht sich wahrscheinlich auf die Stadt beziehungsweise feindliche Macht unter dem Gericht, „seine Feinde“ dagegen auf die Feinde des HERRN.
  alternative: „ihres Ortes“ mit unpersönlichem Bezug; oder beide Suffixe auf denselben Bezugsträger beziehen.
  rationale: Der hebräische Text wechselt bewusst von einem femininen Singularsuffix zu einem maskulinen Singularsuffix. Die Übersetzung erhält diesen Wechsel und damit die echte Bezugsspannung des Textes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischer Bildkraft. „Stätte“ und „Finsternis“ sind leicht gehoben, aber allgemein verständlich. Der feminine und maskuline Suffixwechsel wird nicht eingeebnet.
