id: NAM.1.11
reference: Nahum 1:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: מִמֵּ֣/ךְ יָצָ֔א חֹשֵׁ֥ב עַל יְהוָ֖ה רָעָ֑ה יֹעֵ֖ץ בְּלִיָּֽעַל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/011.yaml
  text: From you has come one who plots evil against Yahweh[a], a counselor of worthlessness.
translation:
  language: de
  text: Aus dir ist einer hervorgegangen, der Böses gegen Jahwe plant, ein Ratgeber der Niedertracht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Ratgeber Belials“, falls בְּלִיָּעַל hier als namensartige Bezeichnung und nicht im Sinn von „Niedertracht“ verstanden wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִמֵּךְ
  choice: Aus dir
  rationale: Die Präposition מִן mit femininem Singularsuffix bezeichnet Herkunft oder Ursprung. „Aus dir“ gibt das Hervorgehen aus der angeredeten Stadt beziehungsweise Macht natürlich wieder.
- source_word: יָצָא
  choice: ist … hervorgegangen
  rationale: Das Qatal bezeichnet hier ein abgeschlossenes Hervortreten. Zusammen mit מִמֵּךְ ist „ist aus dir hervorgegangen“ im Deutschen idiomatisch und bewahrt das Herkunftsmotiv.
- source_word: חֹשֵׁב
  choice: der … plant
  rationale: Das Partizip von חשׁב bezeichnet in diesem feindseligen Zusammenhang das ersinnende Planen; „plant“ ist klar und natürlich.
- source_word: עַל יְהוָה
  choice: gegen Jahwe
  rationale: עַל hat bei der geschilderten feindlichen Absicht adversative Bedeutung. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, nicht durch einen Titel ersetzt.
- source_word: רָעָה
  choice: Böses
  rationale: Hier steht die moralisch böse, feindselige Absicht im Vordergrund; „Böses“ lässt sowohl einen bösen Plan als auch beabsichtigtes Unheil anklingen.
- source_word: יֹעֵץ
  choice: ein Ratgeber
  rationale: Das Partizip steht substantivisch und appositionell zu der zuvor beschriebenen Person. „Ratgeber“ bewahrt diese Form knapp und würdevoll.
- source_word: בְּלִיָּעַל
  choice: der Niedertracht
  rationale: בְּלִיָּעַל bezeichnet im hebräischen Bibelgebrauch häufig Nichtswürdigkeit, Verderbtheit oder Niedertracht. „Ratgeber der Niedertracht“ bewahrt die nominale Fügung, ohne vorschnell einen Eigennamen anzunehmen.
theological_decisions:
- issue: Deutung von בְּלִיָּעַל
  choice: Gattungsbegriff im Sinn von „Niedertracht“
  alternative: Eigenname „Belial“
  rationale: Der unmittelbare hebräische Sprachgebrauch verlangt hier keine Personifizierung oder spätere dämonologische Deutung. Da eine namensartige Auffassung möglich und traditionell belegt ist, wird sie in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die feminine Form von „dir“ ist im Deutschen nicht sichtbar; im Zusammenhang richtet sich die Anrede wahrscheinlich an Ninive beziehungsweise Assyrien. Die appositionelle Satzstruktur des Hebräischen bleibt erhalten.
