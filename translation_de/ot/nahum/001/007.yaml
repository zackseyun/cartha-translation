base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/007.yaml
  text: Yahweh is good[a], a stronghold in the day of distress[c][b]; he knows those who take refuge in him.
translation:
  language: de
  text: Jahwe ist gut, eine Zuflucht[a] am Tag der Not[b]; er kennt[c] die, die bei ihm Schutz suchen[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: eine Festung; ein sicherer Ort.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: in einer Zeit der Bedrängnis.'
    reason: lexical_alternative
  - marker: c
    text: „Kennt“ kann hier persönliche Anerkennung und fürsorgliche Zuwendung einschließen.
    reason: semantic_range
  - marker: d
    text: 'Wörtlicher: die bei ihm Zuflucht suchen; sinngemäß auch: die auf ihn vertrauen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: gut
  rationale: Das Adjektiv bezeichnet Jahwes Wesen in einem umfassenden moralischen und wohltätigen Sinn. „Gut“ ist die knappe und natürliche deutsche Entsprechung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel wie „der HERR“ ersetzt.
- source_word: לְמָעוֹז
  choice: eine Zuflucht
  rationale: מָעוֹז bezeichnet einen sicheren, schützenden Ort. „Zuflucht“ ist im Deutschen natürlich und bewahrt das Schutzbild; „Festung“ ist als konkretere Alternative möglich.
- source_word: בְּיוֹם צָרָה
  choice: am Tag der Not
  rationale: Die Wendung ist temporal und bezeichnet zunächst allgemein eine Zeit der Bedrängnis, ohne zwingend einen bestimmten endzeitlichen Tag vorauszusetzen.
- source_word: וְיֹדֵעַ
  choice: er kennt
  rationale: ידע bedeutet grundlegend „kennen“, kann hier aber persönliche Zuwendung und fürsorgliche Anerkennung einschließen. Die wörtliche Wiedergabe erhält diesen Bedeutungsraum.
- source_word: חֹסֵי בוֹ
  choice: alle, die bei ihm Schutz suchen
  rationale: Das Partizip von חסה beschreibt Menschen, die bei jemandem Zuflucht und Schutz suchen. Die Formulierung bewahrt das konkrete Schutzbild und klingt im modernen Deutsch natürlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. „Jahwe“ bewahrt ihn als persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von „am Tag der Not“
  choice: allgemeine zeitliche Bedeutung
  alternative: ein bestimmter endzeitlicher Tag der Not
  rationale: Der Vers allein verlangt keine technische endzeitliche Deutung. Die Übersetzung lässt einen konkreten Bezug im Zusammenhang zu, legt ihn aber nicht dogmatisch fest.
- issue: Bedeutungsumfang von ידע
  choice: „er kennt“ mit möglicher persönlicher und fürsorglicher Nuance
  alternative: „er kümmert sich um“
  rationale: Eine rein gedankliche Kenntnis wäre im Kontext zu eng, doch die paraphrasierende Alternative würde die fürsorgliche Nuance ausdrücklich festlegen. „Er kennt“ wahrt die theologische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper prophetischer Satzstruktur. Das wiederholte Schutzmotiv wird durch „Zuflucht“ und „Schutz suchen“ verständlich gehalten; die Fußnote bewahrt die engere wörtliche Formulierung.
