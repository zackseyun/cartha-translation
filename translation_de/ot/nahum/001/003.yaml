source:
  edition: WLC
  text: יְהֹוָ֗ה אֶ֤רֶךְ אַפַּ֨יִם֙ ו/גדול כֹּ֔חַ וְ/נַקֵּ֖ה לֹ֣א יְנַקֶּ֑ה יְהוָ֗ה בְּ/סוּפָ֤ה וּ/בִ/שְׂעָרָה֙ דַּרְכּ֔/וֹ וְ/עָנָ֖ן אֲבַ֥ק רַגְלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/003.yaml
  text: Yahweh is slow to anger and great in power[a], and he will by no means leave the guilty unpunished. Yahweh—his way is in the whirlwind and the storm, and clouds are the dust of his feet.
translation:
  language: de
  text: Jahwe ist langsam zum Zorn und groß an Kraft; die Schuldigen lässt er keineswegs ungestraft. Jahwe – im Wirbelsturm und im Unwetter ist sein Weg, und Wolken sind der Staub seiner Füße.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהֹוָה / יְהוָה
  choice: Jahwe
  rationale: Die direkte Wiedergabe des Tetragramms bewahrt den im Hebräischen verwendeten Gottesnamen; „Jahwe“ ist die im modernen Deutschen übliche wissenschaftlich begründete Form.
- source_word: אֶרֶךְ אַפַּיִם
  choice: langsam zum Zorn
  rationale: Das hebräische Idiom bezeichnet Langmut beziehungsweise verzögerten Zorn. Die Formulierung ist verständlich und bleibt nahe am Bildgehalt der Wendung.
- source_word: וּגְדוֹל־כֹּחַ
  choice: und groß an Kraft
  rationale: Die Wiedergabe erhält die einfache Verbindung von גָּדוֹל („groß“) und כֹּחַ („Kraft, Macht“) und klingt zugleich würdig.
- source_word: וְנַקֵּה לֹא יְנַקֶּה
  choice: doch lässt er keineswegs ungestraft
  rationale: Die figura etymologica mit emphatischer Verneinung wird durch „keineswegs“ wiedergegeben. „Ungestraft lassen“ macht den gerichtlichen Sinn natürlich verständlich, ohne ein im Hebräischen unausgesprochenes Objekt ausdrücklich festzulegen.
- source_word: בְּסוּפָה וּבִשְׂעָרָה
  choice: im Wirbelsturm und im Unwetter
  rationale: Die beiden Ausdrücke bezeichnen heftige Wettererscheinungen. „Wirbelsturm“ erhält die bewegte Bildsprache, während „Unwetter“ die zweite, allgemeinere Sturmbezeichnung natürlich wiedergibt.
- source_word: דַּרְכּוֹ
  choice: sein Weg
  rationale: Die direkte Wiedergabe wahrt das Bild vom machtvollen Kommen Jahwes.
- source_word: וְעָנָן אֲבַק רַגְלָיו
  choice: und Wolken sind der Staub seiner Füße
  rationale: Das kollektive Singularwort עָנָן wird im Deutschen idiomatisch als Plural wiedergegeben. Das poetische Bild des bei Jahwes Schreiten aufgewirbelten Staubes bleibt erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens JHWH
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. Die Transliteration bewahrt den Eigennamen, ohne die ehrfürchtige traditionelle Ersatzlesung „der HERR“ in den Ausgangstext einzutragen.
- issue: Aussagekraft von וְנַקֵּה לֹא יְנַקֶּה
  choice: doch lässt er keineswegs ungestraft
  alternative: doch spricht er keineswegs frei
  rationale: Die Aussage hält Gottes Langmut und sein unnachgiebiges Gericht zusammen. Die gewählte Formulierung bewahrt diese Spannung; die forensisch engere, ebenfalls mögliche Wiedergabe wird in der Fußnote genannt.
- issue: Verhältnis der beiden Satzglieder
  choice: doch
  alternative: und
  rationale: Das hebräische ו verbindet die Aussagen formal. Im Deutschen verdeutlicht „doch“ die im Vers beabsichtigte Spannung zwischen Langmut und ausbleibender Straffreiheit, ohne einen Gegensatz zu erfinden, der den Inhalt verändert.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit klarer poetischer Bildsprache. Der Satzbau bleibt dem hebräischen Parallelismus nahe, vermeidet jedoch unnatürliche Hebraismen. Der Gedankenstrich markiert den erneuten Einsatz des Gottesnamens und die folgende majestätische Wettertheophanie.
