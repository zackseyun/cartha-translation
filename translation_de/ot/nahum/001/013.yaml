  text: וְ/עַתָּ֕ה אֶשְׁבֹּ֥ר מֹטֵ֖/הוּ מֵֽ/עָלָ֑יִ/ךְ וּ/מוֹסְרֹתַ֖יִ/ךְ אֲנַתֵּֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/013.yaml
  text: And now I will break his yoke from upon you[a], and I will tear off your bonds.
translation:
  language: de
  text: Und nun werde ich sein Joch, das auf dir liegt, zerbrechen und deine Fesseln zerreißen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seine Stange, die auf dir liegt«. Das hebräische Wort kann eine Stange oder ein Joch bezeichnen; hier passt »Joch« gut zum Bild von Unterdrückung und Fesseln.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl die Konjunktion als auch den zeitlichen Übergang und klingt im modernen Deutschen würdig und natürlich.
- source_word: אֶשְׁבֹּר
  choice: zerbreche ich
  rationale: Das Qal-Imperfekt 1. Person Singular von שׁבר bezeichnet das Brechen; das deutsche Präsens gibt hier im prophetischen Kontext die unmittelbar angekündigte zukünftige Handlung natürlich wieder.
- source_word: מֹטֵהוּ
  choice: sein Joch
  rationale: מֹטָה kann Stange, Tragholz oder Joch bezeichnen. Zusammen mit den Fesseln bildet »Joch« ein verständliches Bild politischer Unterdrückung; das maskuline Suffix bleibt als »sein« erhalten.
- source_word: מֵעָלָיִךְ
  choice: das auf dir liegt
  rationale: Gibt die räumliche Vorstellung von מֵעַל wieder, ohne die im Deutschen schwerfällige Formulierung »von auf dir« zu verwenden; die feminine Singularanrede erscheint als »dir«.
- source_word: וּמוֹסְרֹתַיִךְ
  choice: und deine Fesseln
  rationale: מוֹסֵרוֹת bezeichnet Bindungen oder Fesseln. »Fesseln« ist anschaulich, idiomatisch und passt zum Bild erzwungener Unterwerfung.
- source_word: אֲנַתֵּק
  choice: zerreiße
  rationale: Das Piel von נתק drückt gewaltsames Abreißen, Zerreißen oder Sprengen aus. »zerreiße« bewahrt die Kraft der angekündigten Befreiung und verbindet sich natürlich mit »Fesseln«.
theological_decisions:
- issue: Bezug des Suffixes der 3. Person maskulin Singular in מֹטֵהוּ
  choice: »sein Joch« ohne ausdrückliche Benennung des Unterdrückers
  alternative: »das Joch Assyriens« oder »seine Stange«
  rationale: Der Zusammenhang weist wahrscheinlich auf Assyrien beziehungsweise dessen Herrscher, doch der hebräische Wortlaut nennt den Bezug hier nicht ausdrücklich. Die Übersetzung wahrt diese Zurückhaltung.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem prophetischem Ton. Die feminine Singularanrede des Hebräischen wird im Deutschen formal nicht sichtbar, bleibt aber durch »dir« und »deine« korrekt wiedergegeben. Der Parallelismus von Joch und Fesseln wird bewahrt.
