source:
  edition: WLC
  text: וְ/צִוָּ֤ה עָלֶ֨י/ךָ֙ יְהוָ֔ה לֹֽא יִזָּרַ֥ע מִ/שִּׁמְ/ךָ֖ ע֑וֹד מִ/בֵּ֨ית אֱלֹהֶ֜י/ךָ אַכְרִ֨ית פֶּ֧סֶל וּ/מַסֵּכָ֛ה אָשִׂ֥ים קִבְרֶ֖/ךָ כִּ֥י קַלּֽוֹתָ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/014.yaml
  text: 'Yahweh has commanded concerning you: No more will your name be sown[a]. From the house of your gods I will cut off carved image and cast image. I will make your grave[c][b], for you are contemptible.'
translation:
  language: de
  text: 'Jahwe hat über dich verfügt: »Dein Name wird nicht mehr weitergegeben werden.[a] Aus dem Haus deiner Götter[b] werde ich Schnitzbild und Gussbild ausrotten. Ich werde dein Grab bereiten, denn du bist verächtlich.[c]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Von deinem Namen wird nicht mehr gesät werden.“ Gemeint sein kann, dass aus deinem Namen keine Nachkommen mehr hervorgehen und dein Name beziehungsweise deine Dynastie nicht fortbesteht.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Aus dem Haus deines Gottes“, das heißt: aus dem Tempel deines Gottes. Wörtlich steht „Haus deiner Götter“.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „denn du bist gering“ oder „denn du bist unbedeutend“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוָּה עָלֶיךָ יְהוָה
  choice: Jahwe hat über dich verfügt
  rationale: Das Perfekt bezeichnet den ergangenen göttlichen Beschluss mit fortdauernder Geltung. „Über dich verfügt“ gibt die Verbindung von צוה und עַל natürlich wieder, ohne die feindliche Nuance zusätzlich in die Präposition hineinzulesen.
- source_word: לֹא יִזָּרַע מִשִּׁמְךָ עוֹד
  choice: Dein Name wird nicht weiter ausgesät werden
  rationale: Die deutsche Fassung bewahrt das landwirtschaftliche Bild des hebräischen Niphal von זרע. Im Zusammenhang bezeichnet es wahrscheinlich das Ende des Namens, der Nachkommenschaft oder der Dynastie.
- source_word: מִבֵּית אֱלֹהֶיךָ
  choice: Aus dem Haus deiner Götter
  rationale: „Haus“ wahrt die konkrete Ausdrucksweise des Hebräischen; die morphologische Pluralform אֱלֹהֶיךָ wird angesichts des assyrischen polytheistischen Umfelds als „deiner Götter“ wiedergegeben.
- source_word: אַכְרִית
  choice: werde ich … ausrotten
  rationale: Das Hiphil von כרת bezeichnet hier die vollständige Beseitigung. „Ausrotten“ vermittelt die entschiedene Gerichtsansage im Deutschen natürlicher als das wörtlichere „abschneiden“.
- source_word: פֶּסֶל וּמַסֵּכָה
  choice: Schnitzbild und Gussbild
  rationale: Die beiden Begriffe unterscheiden ein durch Schnitzen angefertigtes Bild von einem gegossenen Bild. Die knappen deutschen Komposita erhalten diese konkrete Gegenüberstellung.
- source_word: אָשִׂים קִבְרֶךָ
  choice: Ich werde dein Grab bereiten
  rationale: Die knappe hebräische Wendung lautet wörtlich etwa „ich werde dein Grab setzen/machen“. „Dein Grab bereiten“ ist idiomatisches Deutsch und bewahrt die unheilvolle Aussage, dass Gott Tod und Begräbnis des Angeredeten bestimmt.
- source_word: כִּי קַלּוֹתָ
  choice: denn du bist verächtlich
  rationale: קלל kann „leicht, gering, unbedeutend“ und daraus „geringgeschätzt, verächtlich“ bedeuten. Im Gerichtskontext passt „verächtlich“, während die Fußnote die semantische Spannweite offenhält.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird in der im Deutschen üblichen Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. Die Transliteration bewahrt den Eigennamen, während „der HERR“ ihn durch einen Titel ersetzen würde.
- issue: Deutung des Bildes vom Aussäen des Namens
  choice: Das Bild bleibt im Haupttext erhalten
  alternative: Du wirst keine Nachkommen mehr haben / deine Dynastie wird nicht fortbestehen
  rationale: Der hebräische Wortlaut lässt das konkrete Bild stehen und deutet dessen Bezug nicht ausdrücklich aus. Die Fußnote nennt deshalb die wahrscheinliche dynastische beziehungsweise genealogische Bedeutung, ohne sie in den Haupttext einzutragen.
- issue: Numerus von אֱלֹהֶיךָ
  choice: deiner Götter
  alternative: deines Gottes
  rationale: Die Form ist morphologisch plural und kann im assyrischen Kontext auf mehrere Gottheiten bezogen werden. Da der Numerus prinzipiell kontextabhängig sein kann, bleibt die singularische Lesart in der Fußnote sichtbar.
- issue: Bewertung durch כִּי קַלּוֹתָ
  choice: denn du bist verächtlich
  alternative: denn du bist gering / unbedeutend
  rationale: Die Wortwurzel verbindet die Vorstellung des Leicht- oder Geringseins mit Geringschätzung. Die gewählte Fassung entspricht dem Gerichtston, ohne die lexikalischen Alternativen zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede macht den Umfang des göttlichen Beschlusses klar. Konkrete Kultbegriffe und das ungewöhnliche Bild vom Aussäen des Namens bleiben erhalten; erklärungsbedürftige Mehrdeutigkeiten werden in Fußnoten ausgewiesen.
