id: NAM.1.4
reference: Nahum 1:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: גּוֹעֵ֤ר בַּ/יָּם֙ וַֽ/יַּבְּשֵׁ֔/הוּ וְ/כָל הַ/נְּהָר֖וֹת הֶֽחֱרִ֑יב אֻמְלַ֤ל בָּשָׁן֙ וְ/כַרְמֶ֔ל וּ/פֶ֥רַח לְבָנ֖וֹן אֻמְלָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/004.yaml
  text: He rebukes the sea and dries it up; he makes all the rivers run dry[a]. Bashan and Carmel wither; even the blossom of Lebanon withers.
translation:
  language: de
  text: Er schilt das Meer und trocknet es aus; alle Flüsse lässt er versiegen[a]. Baschan und Karmel welken, und die Blüte des Libanon welkt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Er trocknet alle Flüsse aus.'
    reason: Lexikalisch direktere Wiedergabe des hebräischen Verbs; im Zusammenhang mit Gewässern ist auch „versiegen lassen“ möglich.
lexical_decisions:
- source_word: גּוֹעֵר
  choice: schilt
  rationale: Das Verb bezeichnet ein machtvolles, mündliches Zurechtweisen. „Schilt“ bewahrt die personifizierende Bildsprache und den Anklang an Gottes Herrschaft über das Meer.
- source_word: בַּיָּם
  choice: das Meer
  rationale: Der bestimmte Singular wird natürlich und ohne unbegründete Deutung als Eigenname wiedergegeben.
- source_word: וַיַּבְּשֵׁהוּ
  choice: trocknet es aus
  rationale: Das Suffix bezieht sich auf das Meer; „austrocknen“ gibt die verursachte Trockenheit idiomatisch wieder.
- source_word: וְכָל הַנְּהָרוֹת הֶחֱרִיב
  choice: alle Flüsse lässt er versiegen
  rationale: Der Hifil von חרב bezeichnet hier das Herbeiführen von Trockenheit. „Versiegen lassen“ ist im Zusammenhang mit Flüssen natürlich und wahrt die kausative Bedeutung.
- source_word: אֻמְלַל
  choice: welken
  rationale: Das Verb beschreibt das Erschlaffen und Austrocknen von Pflanzen. „Welken“ passt zur Vegetationsbildsprache und wird in beiden Vorkommen wiederholt.
- source_word: בָּשָׁן
  choice: Baschan
  rationale: Der Ortsname wird in der etablierten deutschen Form wiedergegeben; die fruchtbare Landschaft verstärkt das Gerichtsbild.
- source_word: וְכַרְמֶל
  choice: und Karmel
  rationale: Der Ortsname wird ohne den im Hebräischen nicht ausdrücklich stehenden Zusatz „Berg“ wiedergegeben.
- source_word: וּפֶרַח לְבָנוֹן
  choice: und die Blüte des Libanon
  rationale: פֶרַח bedeutet „Blüte“ oder „Blume“. Der Singular kann kollektiv verstanden werden; „Blüte“ erhält die poetische Offenheit.
- source_word: אֻמְלָל
  choice: welkt
  rationale: Die Wiederholung desselben deutschen Verbs bildet die hebräische Wiederholung und den Parallelismus ab.
theological_decisions:
- issue: Das göttliche Subjekt wird im Vers nicht ausdrücklich genannt
  choice: Die Verben werden mit „er“ wiedergegeben; das Subjekt ergibt sich aus Nahum 1,2–3 und bezieht sich auf den HERRN.
  alternative: Den Gottesnamen „der HERR“ im Vers ausdrücklich wiederholen.
  rationale: Das Hebräische setzt das Subjekt aus dem unmittelbaren Zusammenhang voraus. Das Pronomen hält den poetischen Fluss aufrecht und fügt keinen in diesem Vers fehlenden Gottesnamen ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit dichterischer Knappheit. „Schilt“ ist leicht gehoben, aber verständlich und bewahrt die kraftvolle personifizierende Rede. Das im Englischen ergänzte „even“ wird nicht als „sogar“ oder „selbst“ übernommen, weil dafür im Hebräischen kein ausdrücklicher Marker steht.
