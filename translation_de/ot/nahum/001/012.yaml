  terminology: „HERR“ für יהוה entspricht der etablierten deutschen Bibelkonvention. „Bedrängen“ ist für die beiden Formen von ענה im Kontext angemessen. „Abgeschnitten“ bewahrt die Bildlichkeit von נָגֹזּוּ. Die Deutung von עָבָר als kollektives Vergehen bleibt durch die Fußnote transparent als Glättung eines schwierigen hebräischen Numeruswechsels ausgewiesen.
