  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה אִם שְׁלֵמִים֙ וְ/כֵ֣ן רַבִּ֔ים וְ/כֵ֥ן נָגֹ֖זּוּ וְ/עָבָ֑ר וְ/עִ֨נִּתִ֔/ךְ לֹ֥א אֲעַנֵּ֖/ךְ עֽוֹד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/012.yaml
  text: 'Thus says the LORD: Though they are whole, and likewise many, even so they will be cut down and pass away. Though I have afflicted you, I will afflict you no more.'
translation:
  language: de
  text: 'So spricht der HERR:


    »Auch wenn sie unversehrt und noch so zahlreich sind,


    werden sie dennoch abgeschnitten und vergehen.[a]


    Ich habe dich zwar bedrängt,


    doch werde ich dich nicht mehr bedrängen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich beim letzten Verb: „und er zieht vorüber“ oder „und es vergeht“; der hebräische Text wechselt hier vom Plural zum Singular.'
    reason: Der auffällige Numeruswechsel in וְעָבָר lässt sowohl eine kollektive Aussage als auch einen neuen singularischen Bezug zu und sollte nicht stillschweigend eingeebnet werden.
lexical_decisions:
- source_word: שְׁלֵמִים
  choice: unversehrt
  rationale: Das Adjektiv bezeichnet hier einen vollständigen, ungeschwächten Zustand. „Unversehrt“ gibt dies im Zusammenhang mit der Stärke der feindlichen Macht natürlich wieder, ohne die mögliche Nuance von Vollständigkeit auszuschließen.
- source_word: רַבִּים
  choice: noch so zahlreich
  rationale: Die idiomatische deutsche Wendung bildet die zugestandene große Zahl der Gegner innerhalb des konzessiven Satzes ab.
- source_word: נָגֹזּוּ
  choice: werden … abgeschnitten
  rationale: Das seltene Verb bezeichnet ein Abschneiden beziehungsweise Beseitigen. Die Bildsprache des hebräischen Textes bleibt erhalten.
- source_word: עִנִּתִךְ / אֲעַנֵּךְ
  choice: habe dich … bedrängt / werde ich dich … bedrängen
  rationale: Das Piel von ענה meint hier bedrücken oder Leid zufügen. „Bedrängen“ ist verständlich und bewahrt, dass Gott selbst als Handelnder spricht.
theological_decisions:
- issue: Gottes bisherige und künftige Bedrängnis der weiblich angeredeten Person beziehungsweise Gemeinschaft
  choice: „Ich habe dich zwar bedrängt, doch werde ich dich nicht noch einmal bedrängen.“
  alternative: „Auch wenn ich dich gedemütigt habe, werde ich dich nicht weiter demütigen.“
  rationale: Die Übersetzung lässt Gottes ausdrücklich genannte Urheberschaft stehen und versteht die feminine Singularform als Anrede an Juda beziehungsweise die Stadt, ohne diese Identifikation in den Text einzutragen. „Nicht noch einmal“ entspricht עוֹד und vermeidet eine unnötige dogmatische Erklärung des Leidens.
- issue: Numeruswechsel beim Untergang der Gegner
  choice: Im Haupttext flüssig pluralisch „werden sie … vergehen“, mit Hinweis in der Fußnote
  alternative: „werden sie abgeschnitten, und er zieht dahin“
  rationale: נָגֹזּוּ ist Plural, עָבָר dagegen formal Singular. Die Syntax ist unsicher; eine Fußnote bewahrt die echte Mehrdeutigkeit, während der Haupttext dem wahrscheinlich gemeinten kollektiven Untergang folgt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Zeilengliederung. Der Gottesname יהוה wird nach verbreiteter deutscher Bibelkonvention mit „HERR“ wiedergegeben. Die Formulierung bleibt nah an der hebräischen Bildsprache, erläutert aber die syntaktische Unsicherheit in einer knappen Fußnote.
