  terminology: „Dornen“, „ineinander verflochten“, „Trank“, „verzehrt“ und „dürres Stroh“ sind sachgerecht. Die Wahl von „Stroh“ für קַשׁ ist im Deutschen für den trockenen, rasch verbrennenden Pflanzenrest gut vertretbar; „Stoppeln“ wäre möglich, aber nicht zwingend vorzuziehen. Die Fußnotenanker stehen an den jeweils erläuterten schwierigen Einheiten und die Fußnoten benennen die relevanten Alternativen.
