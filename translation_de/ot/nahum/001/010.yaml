source:
  edition: WLC
  text: כִּ֚י עַד סִירִ֣ים סְבֻכִ֔ים וּ/כְ/סָבְאָ֖/ם סְבוּאִ֑ים אֻ֨כְּל֔וּ כְּ/קַ֥שׁ יָבֵ֖שׁ מָלֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/001/010.yaml
  text: For though they are tangled like thorns[a], and drenched with their drink[b], they will be consumed like fully dry stubble.
translation:
  language: de
  text: Denn mögen sie auch wie Dornen ineinander verflochten sein[a] und von ihrem Trank durchtränkt[b], so werden sie verzehrt wie völlig dürres Stroh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn während sie wie Dornen ineinander verflochten sind …“ Die hebräische Eröffnung ist eine stark verdichtete und schwierige poetische Wendung.'
    reason: alternative_reading
  - marker: b
    text: 'Hebräisch schwierig; auch möglich: „und wie Betrunkene von ihrem Trank berauscht“ oder „und wie bei ihrem Trinkgelage“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי עַד
  choice: Denn mögen sie auch …, so
  rationale: Die verdichtete poetische Fügung ist schwierig. Die konzessive Wiedergabe verbindet den Vers natürlich mit dem vorausgehenden Gerichtswort, ohne die Unsicherheit des Hebräischen zu verdecken.
- source_word: סִירִים סְבֻכִים
  choice: wie Dornen ineinander verflochten
  rationale: סִירִים bezeichnet dorniges Gestrüpp, סְבֻכִים dessen dichtes Verflochtensein. Die Formulierung bewahrt das Bild eines undurchdringlichen, zugleich leicht brennbaren Geflechts.
- source_word: וּכְסָבְאָם סְבוּאִים
  choice: und von ihrem Trank durchtränkt
  rationale: Die Wortgruppe spielt mit verwandten Ausdrücken für Trank beziehungsweise Trinkgelage und Satt- oder Betrunkensein. „durchtränkt“ erhält das Flüssigkeitsbild und lässt die genaue Nuance offen.
- source_word: אֻכְּלוּ
  choice: sie werden verzehrt
  rationale: Das prophetische Perfekt stellt das kommende Gericht als gewiss dar. Das Passiv und „verzehrt“ passen zum unausgesprochenen Feuerbild.
- source_word: כְּקַשׁ יָבֵשׁ מָלֵא
  choice: wie völlig dürres Stroh
  rationale: קַשׁ ist trockener Pflanzenrest, etwa Stroh oder Stoppeln; מָלֵא verstärkt hier die vollständige Trockenheit. „völlig dürres Stroh“ gibt das rasch brennbare Material natürlich wieder.
theological_decisions:
- issue: Zeitbezug des prophetischen Perfekts אֻכְּלוּ
  choice: 'Futur: „werden … verzehrt“'
  alternative: 'Präsens/Perfekt: „werden verzehrt“ beziehungsweise „sind verzehrt worden“'
  rationale: Im Zusammenhang kündigt der Prophet das sichere Gericht an; das deutsche Futur macht diesen Bezug verständlich, ohne eine besondere dogmatische Deutung einzutragen.
- issue: Verhältnis der ersten Satzhälfte zum Gerichtswort
  choice: 'konzessiv: „mögen sie auch …, so“'
  alternative: 'temporal oder rein begründend: „während/denn sie sind …“'
  rationale: Die konzessive Lesart ergibt einen schlüssigen Gegensatz zwischen ihrem dichten, trunkenen Zustand und ihrer leichten Vernichtung; wegen der sprachlichen Unsicherheit wird die Alternative in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer poetischer Bildsprache. „Ineinander verflochten“, „durchtränkt“ und „dürres Stroh“ bewahren die Klang- und Bilddichte des Hebräischen; die zwei Fußnoten machen dessen echte syntaktische und lexikalische Unsicherheit sichtbar.
