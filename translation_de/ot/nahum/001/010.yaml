  source_fidelity: Die Übersetzung gibt die schwierige, bildreiche hebräische Zeile insgesamt sorgfältig wieder. Die konzessive Entfaltung von כִּי עַד ist eine vertretbare Deutung und wird durch die Fußnote ausdrücklich als nicht alternativlose Lesart kenntlich gemacht. „von ihrem Trank durchtränkt“ bewahrt die mit סבא/סבואים verbundene Sättigungs-, Trink- bzw. Rauschbildlichkeit, ohne die umstrittene genaue Konstruktion zu stark festzulegen. Das Futur bei „werden sie verzehrt“ gibt das prophetische Perfekt im Gerichtskontext angemessen wieder.
