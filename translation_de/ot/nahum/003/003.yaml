base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/003.yaml
  text: Horsemen charging[a], and the flashing sword and the gleaming spear, and a multitude of slain, and heaps of corpses[c][b]; and there is no end to the bodies— they stumble over the bodies.
translation:
  language: de
  text: 'Reiter stürmen heran[a],

    das Flammen des Schwertes,

    das Blitzen des Speers,

    eine Menge Erschlagener,

    Massen von Leichen!

    Kein Ende der Leichen –

    sie stolpern über ihre Leichen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch Singular; das Wort kann im Schlachtbild kollektiv gemeint sein. Das Verb bedeutet wörtlich „heraufkommen, heraufziehen“; auch „Reiterei zieht herauf“ ist möglich.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „über ihre Leiber“ oder „über ihre Leichen“. Worauf sich „ihre“ genau bezieht, bleibt im gedrängten hebräischen Schlachtbild offen.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: פָּרָשׁ מַעֲלֶה
  choice: Ein Reiter stürmt heran
  rationale: פָּרָשׁ steht im Singular und kann im Schlachtbild kollektiv verstanden werden. מַעֲלֶה bezeichnet ein Herauf- oder Herankommen; „stürmt heran“ gibt die heftige Bewegung im militärischen Zusammenhang natürlich wieder, ohne die Singularform aufzugeben.
- source_word: לַהַב חֶרֶב
  choice: Schwerter flammen
  rationale: לַהַב bedeutet wörtlich „Flamme, Flammenschein“ und beschreibt hier den feurigen Lichtschein der Waffe. Das deutsche Verb „flammen“ bewahrt das Bild und lässt den kollektiv gebrauchten Singular natürlich erklingen.
- source_word: בְרַק חֲנִית
  choice: Speere blitzen
  rationale: בְרַק bezeichnet Blitz oder Aufleuchten. „Speere blitzen“ erhält das anschauliche Bild und bildet im Deutschen einen prägnanten Parallelismus zu „Schwerter flammen“.
- source_word: רֹב חָלָל
  choice: eine Menge Erschlagener
  rationale: חָלָל bezeichnet hier im Schlachtzusammenhang Getötete, während רֹב ihre große Zahl hervorhebt. „Erschlagene“ ist genauer als das weiter gefasste „Verwundete“.
- source_word: כֹבֶד פָּגֶר
  choice: Leichen in Massen
  rationale: כֹבֶד bedeutet eigentlich „Schwere, Gewicht“ und bezeichnet hier eine schwere, große Masse; פָּגֶר ist ein lebloser Körper. Die Wendung gibt den idiomatischen Sinn eindringlich und in natürlichem Deutsch wieder.
- source_word: אֵין קֵצֶה לַגְּוִיָּה
  choice: Kein Ende ist bei den Toten
  rationale: Die hebräische Aussage betont die unabsehbare Zahl der leblosen Körper. „bei den Toten“ vermeidet unmittelbar aufeinanderfolgende Wiederholungen von „Leichen“, ohne den Sinn abzuschwächen.
- source_word: יכשלו
  choice: sie stolpern
  rationale: Die Form bezeichnet ein Straucheln oder Stolpern. Das Subjekt bleibt wie im Hebräischen unausgesprochen und wird lediglich durch die Verbform als Mehrzahl angezeigt.
- source_word: בִּגְוִיָּתָם
  choice: über die Leichen
  rationale: Wörtlich steht ein Suffix der dritten Person Plural („ihre Leiber/Leichen“). Da dessen Bezug im verdichteten Schlachtbild nicht eindeutig ist und ein deutsches „ihre Leichen“ fälschlich als die eigenen Leichen der Stolpernden verstanden werden könnte, steht die natürliche Wiedergabe im Text; die Form des Hebräischen wird in der Fußnote offengelegt.
