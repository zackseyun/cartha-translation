  register: Poetisch verdichtetes, modernes Standarddeutsch. Kurze, rhythmische Zeilen und starke Verben bewahren Tempo und Bildkraft des hebräischen Schlachtbildes. Die Waffen stehen entsprechend dem kollektiv deutbaren hebräischen Singular im Deutschen im Plural; die unklare Beziehung des abschließenden Pronominalsuffixes wird nicht stillschweigend festgelegt, sondern in einer Fußnote ausgewiesen.
