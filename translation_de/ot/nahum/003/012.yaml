base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/012.yaml
  text: All your fortresses are fig trees with first-ripe figs; if they are shaken[a], they fall into the mouth of the eater.
translation:
  language: de
  text: Alle deine Festungen sind wie Feigenbäume[a] mit Frühfeigen; wenn sie geschüttelt werden, fallen sie dem Esser in den Mund.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Feigen mit frühen Früchten«; dann bezieht sich das Bild auf die Früchte statt auf die Bäume. Im Haupttext steht »Feigenbäume«, weil dies besser zum Vergleich mit den befestigten Orten passt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְצָרַיִךְ
  choice: deine Festungen
  rationale: Das Substantiv bezeichnet befestigte Orte oder starke Verteidigungsanlagen. »Festungen« ist konkret und bewahrt das militärische Bild.
- source_word: תְּאֵנִים
  choice: wie Feigenbäume
  rationale: Die Form kann Feigen oder Feigenbäume bezeichnen. Als Feigenbäume ergibt sie zusammen mit den Frühfeigen und dem Schütteln ein klares Bild für die leicht fallenden Festungen. Das vergleichende »wie« macht die im Hebräischen ohne Kopula formulierte Metapher im Deutschen natürlich verständlich.
- source_word: עִם בִּכּוּרִים
  choice: mit Frühfeigen
  rationale: בִּכּוּרִים bezeichnet hier die zuerst reifenden Früchte. »Frühfeigen« bewahrt das konkrete landwirtschaftliche Bild und vermeidet eine unnötig kultische Deutung als »Erstlingsfrüchte«.
- source_word: אִם
  choice: wenn
  rationale: Die Bedingung beschreibt einen typischen, erwartbaren Vorgang innerhalb des Vergleichs. Daher gibt »wenn« den Sinn im Deutschen natürlicher wieder als das stärker hypothetische »falls«.
- source_word: יִנּוֹעוּ
  choice: wenn man sie schüttelt
  rationale: Das Verb נוע kann schwanken, wanken oder geschüttelt werden bezeichnen. Die unpersönliche deutsche Form gibt die vorausgesetzte Einwirkung auf die Bäume wieder.
- source_word: וְנָפְלוּ
  choice: fallen
  rationale: Das Perfekt bezeichnet nach dem Bedingungssatz die eintretende Folge. Das Präsens passt zum allgemein formulierten Bild und erhält dessen Unmittelbarkeit.
- source_word: עַל פִּי אוֹכֵל
  choice: dem Esser in den Mund
  rationale: Wörtlich steht »auf/an den Mund eines Essenden«. Die deutsche Wendung drückt anschaulich aus, wie mühelos und unmittelbar die reifen Feigen erlangt werden.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Bild bleibt knapp und anschaulich; »Frühfeigen« erhält die Besonderheit der zuerst reifenden, leicht fallenden Früchte. Im Folgesatz wird »die Feigen« ausdrücklich genannt, damit das feminine Pronomen »sie« nicht missverständlich auf die Festungen oder Feigenbäume bezogen wird.
