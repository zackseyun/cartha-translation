source:
  edition: WLC
  text: נָמ֤וּ רֹעֶ֨י/ךָ֙ מֶ֣לֶךְ אַשּׁ֔וּר יִשְׁכְּנ֖וּ אַדִּירֶ֑י/ךָ נָפֹ֧שׁוּ עַמְּ/ךָ֛ עַל הֶ/הָרִ֖ים וְ/אֵ֥ין מְקַבֵּֽץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/018.yaml
  text: Your shepherds slumber[a], O king of Assyria; your nobles lie down. Your people are scattered on the mountains[d][c][b], and there is no one to gather them.
translation:
  language: de
  text: Deine Hirten[a] schlummern[b], König von Assyrien; deine Mächtigen ruhen[c]. Dein Volk ist über die Berge zerstreut[d], und niemand sammelt es.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Hirten“ ist hier ein Bild für die Herrscher oder Führer Assyriens.
    reason: cultural_note
  - marker: b
    text: 'Oder: „schlafen“. Das hebräische Bild kann auf untätige oder handlungsunfähige Führer hinweisen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „wohnen“ oder „sich niederlassen“. Das hebräische Verb bedeutet häufig „wohnen“; im Zusammenhang kann es jedoch auch ein Ruhen oder Niederliegen der Mächtigen bezeichnen.'
    reason: alternative_reading
  - marker: d
    text: 'Die zugrunde liegende hebräische Form ist schwierig. Der Sinn „zerstreut“ wird durch den folgenden Satz gestützt: Niemand sammelt das Volk.'
    reason: textual_difficulty
lexical_decisions:
- source_word: נָמוּ
  choice: schlummern
  rationale: Das Verb נום bezeichnet Schlafen oder Schlummern. „Schlummern“ bewahrt das poetische Bild untätiger oder handlungsunfähiger Führer.
- source_word: רֹעֶיךָ
  choice: deine Hirten
  rationale: Die wörtliche Hirtenmetapher für Herrscher und Führer bleibt im Haupttext erhalten.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: König von Assyrien
  rationale: Die Fügung wird als direkte Anrede verstanden; im Deutschen ist dafür kein zusätzliches „o“ erforderlich.
- source_word: יִשְׁכְּנוּ
  choice: ruhen
  rationale: שׁכן bedeutet gewöhnlich „wohnen“, kann im poetischen Zusammenhang hier aber ein Sichniederlassen oder Ruhen ausdrücken. „Ruhen“ erhält die Parallelität zum Schlummern, ohne die mögliche Todesnähe ausdrücklich festzulegen.
- source_word: אַדִּירֶיךָ
  choice: deine Mächtigen
  rationale: אַדִּיר kann mächtige, vornehme oder führende Personen bezeichnen. „Mächtige“ wahrt die semantische Breite besser als das gesellschaftlich engere „Adlige“.
- source_word: נָפֹשׁוּ
  choice: ist ... zerstreut
  rationale: Die schwierige Form wird aus dem Zusammenhang mit den Bergen und dem fehlenden Sammler als Zerstreuung verstanden. Die Unsicherheit wird in einer Fußnote offengelegt.
- source_word: עַמְּךָ
  choice: dein Volk
  rationale: Dies ist die normale und kontextuell hinreichende Bedeutung; eine Einengung auf Truppen wäre nicht sicher begründet.
- source_word: עַל הֶהָרִים
  choice: über die Berge
  rationale: „Über die Berge zerstreut“ gibt die räumliche Verteilung idiomatisch wieder, ohne den Bezug zu den Bergen abzuschwächen.
- source_word: וְאֵין מְקַבֵּץ
  choice: und niemand sammelt es
  rationale: Das im Hebräischen unausgesprochene Objekt wird aus „dein Volk“ ergänzt. Der deutsche Singular „es“ stimmt mit dem Kollektivnomen überein.
theological_decisions:
- issue: Zustand der assyrischen Führung
  choice: Die Schlaf- und Ruhemetaphorik bleibt offen für Untätigkeit, Handlungsunfähigkeit oder Tod.
  alternative: Die Führer ausdrücklich als tot bezeichnen.
  rationale: Der hebräische Text entfaltet Todesnähe möglicherweise indirekt, legt sie mit diesen Verben jedoch nicht eindeutig fest.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper prophetischer Bildhaftigkeit. Die direkte Anrede klingt ohne archaisches „o“ natürlich. Echte lexikalische Unsicherheiten werden nicht im Haupttext geglättet, sondern in den Fußnoten sichtbar gemacht.
