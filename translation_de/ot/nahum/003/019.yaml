base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/019.yaml
  text: There is no healing for your fracture[a]; your wound is grievous. All who hear the report about you clap their hands over you[b], for over whom has your evil not continually passed?
translation:
  language: de
  text: Für deinen Bruch gibt es keine Heilung[a]; deine Wunde ist schwer. Alle, die die Nachricht von dir hören, schlagen über dich in die Hände[b]. Denn wen hat deine Bosheit nicht immer wieder getroffen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Für deinen Zusammenbruch gibt es keine Linderung; deine Verletzung ist schwer.“'
    reason: lexical_alternative
  - marker: b
    text: Die rhetorische Frage besagt, dass Ninives Bosheit nahezu alle getroffen hatte; deshalb freuen sich die Hörenden über ihren Untergang.
    reason: cultural_note
lexical_decisions:
- source_word: אֵין כֵּהָה לְשִׁבְרֶךָ
  choice: Für deinen Bruch gibt es keine Heilung
  rationale: Die Formulierung bewahrt das Bild einer nicht mehr heilbaren Verletzung. כֵּהָה kann eine Linderung oder ein Nachlassen bezeichnen; „Heilung“ ergibt im Zusammenhang mit „Bruch“ und „Wunde“ eine natürliche deutsche Bildfolge, ohne den Ausdruck ausdrücklich als „unheilbar“ zu übersteigern.
- source_word: נַחְלָה מַכָּתֶךָ
  choice: deine Wunde ist schwer
  rationale: מַכָּה bezeichnet hier eine Wunde oder Verletzung; נַחְלָה beschreibt ihren ernsten, leidvollen Zustand. „Schwer“ gibt die Aussage zurück, ohne die im Zusammenhang naheliegende Unheilbarkeit ein zweites Mal ausdrücklich einzutragen.
- source_word: כֹּל שֹׁמְעֵי שִׁמְעֲךָ
  choice: Alle, die die Kunde von dir hören
  rationale: שֵׁמַע kann Nachricht, Kunde oder Bericht bedeuten. „Die Kunde von dir“ lässt offen, ob vor allem die Nachricht von Ninives Fall oder seine weithin bekannte Geschichte gemeint ist.
- source_word: תָּקְעוּ כַף עָלֶיךָ
  choice: klatschen über dich in die Hände
  rationale: Die hebräische Wendung bezeichnet das Zusammenschlagen der Hände. Im Gerichtszusammenhang drückt sie triumphierende Freude über Ninives Untergang aus; die Formulierung erhält zugleich die Richtung „über dich“.
- source_word: רָעָתְךָ
  choice: deine Bosheit
  rationale: רָעָה bezeichnet hier das moralisch Böse, das sich in Ninives gewaltsamem und unterdrückerischem Handeln auswirkt. „Bosheit“ hält moralische Schuld und verursachtes Leid zusammen.
- source_word: עָבְרָה ... תָּמִיד
  choice: ist ... ständig hinweggegangen
  rationale: Die Übersetzung bewahrt das Bewegungsbild von עבר und die fortdauernde beziehungsweise wiederholte Wirkung von תָּמִיד. Die rhetorische Frage unterstreicht die weite Reichweite von Ninives Unrecht.
theological_decisions:
- issue: Bedeutung von רָעָתְךָ im Gerichtswort gegen Ninive
  choice: deine Bosheit
  alternative: dein Unheil / deine Grausamkeit
  rationale: Der Zusammenhang klagt Ninive moralisch an und beschreibt zugleich die Folgen seiner Gewalt. „Bosheit“ vermeidet sowohl eine rein schicksalhafte Deutung als „Unheil“ als auch die Verengung auf nur eine Erscheinungsform des Bösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Verletzungsmetaphorik und das Bewegungsbild des hebräischen Textes bleiben erhalten; ungebräuchliche Fachsprache und konfessionell geprägte Deutungen werden vermieden.
