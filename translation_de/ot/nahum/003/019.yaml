- from: Für deinen Bruch gibt es keine Heilung[a]; deine Wunde ist schwer. Alle, die die Kunde von dir hören, klatschen über dich in die Hände[b]. Denn über wen ist deine Bosheit nicht ständig hinweggegangen?
  to: Für deinen Bruch gibt es keine Heilung[a]; deine Wunde ist schwer. Alle, die die Nachricht von dir hören, schlagen über dich in die Hände[b]. Denn wen hat deine Bosheit nicht immer wieder getroffen?
  rationale: Die Revision beseitigt unidiomatische deutsche Verbindungen und verdeutlicht die beabsichtigte Betroffenheit in der rhetorischen Frage. Sie erhält die medizinische Metaphorik, die feindliche Freude der Hörenden und die moralische Wertung von רָעָה, ohne die Aussage über das im Hebräischen Gesagte hinaus zu spezifizieren.
