  text: הִנֵּ֨ה עַמֵּ֤/ךְ נָשִׁים֙ בְּ/קִרְבֵּ֔/ךְ לְ/אֹ֣יְבַ֔יִ/ךְ פָּת֥וֹחַ נִפְתְּח֖וּ שַׁעֲרֵ֣י אַרְצֵ֑/ךְ אָכְלָ֥ה אֵ֖שׁ בְּרִיחָֽיִ/ך׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/013.yaml
  text: Look[a], your troops are women in your midst; the gates of your land stand wide open to your enemies[c][b]; fire has consumed your bars.
translation:
  language: de
  text: Sieh, deine Truppen[a] sind Frauen in deiner Mitte. Die Tore deines Landes stehen deinen Feinden weit offen[b]; Feuer hat deine Riegel[c] verzehrt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dein Volk“. Das hebräische Wort bedeutet gewöhnlich „Volk“, bezieht sich hier im militärischen Zusammenhang aber wahrscheinlich auf Ninives Verteidiger.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „geöffnet, sind sie geöffnet“; diese nachdrückliche hebräische Konstruktion bedeutet „weit“ oder „vollständig geöffnet“.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch: „Torriegel“ oder „Querbalken“. Gemeint sind die Sicherungsbalken der Tore.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh
  rationale: Die hinweisende Interjektion leitet eine nachdrückliche Feststellung ein. „Sieh“ ist gegenwärtig, verständlich und weniger altertümlich als „siehe“.
- source_word: עַמֵּךְ
  choice: deine Truppen
  rationale: עַם bedeutet gewöhnlich „Volk“, bezeichnet im militärischen Zusammenhang hier aber wahrscheinlich die zur Verteidigung verfügbaren Kräfte Ninives. Die wörtlichere Möglichkeit bleibt in der Fußnote erhalten.
- source_word: נָשִׁים
  choice: Frauen
  rationale: Der hebräische Plural wird direkt wiedergegeben. Die genderbezogene militärische Verspottung des Ausgangstextes wird weder abgeschwächt noch durch einen ausdrücklich hinzugefügten Vergleich erweitert.
- source_word: בְּקִרְבֵּךְ
  choice: in deiner Mitte
  rationale: Die Ortsangabe wird nah am hebräischen Bild und zugleich in natürlichem Deutsch wiedergegeben.
- source_word: לְאֹיְבַיִךְ
  choice: deinen Feinden
  rationale: Der deutsche Dativ bei „offenstehen“ gibt die Beziehung beziehungsweise Zugänglichkeit für die Feinde idiomatisch wieder.
- source_word: פָּתוֹחַ נִפְתְּחוּ
  choice: stehen … weit offen
  rationale: Infinitivus absolutus und finite Verbform verstärken gemeinsam die Aussage. „weit offenstehen“ bewahrt den emphatischen und resultativen Sinn in natürlichem Deutsch.
- source_word: שַׁעֲרֵי אַרְצֵךְ
  choice: die Tore deines Landes
  rationale: Die Constructusverbindung wird direkt wiedergegeben; „Land“ kann hier das gesamte Herrschaftsgebiet samt seinen Zugängen bezeichnen.
- source_word: אָכְלָה אֵשׁ
  choice: Feuer hat … verzehrt
  rationale: Das Feuer ist Subjekt des Qal-Perfekts. Das deutsche Perfekt stellt die vollendete Zerstörung mit gegenwärtigem Ergebnis heraus.
- source_word: בְּרִיחָיִךְ
  choice: deine Riegel
  rationale: Gemeint sind die Balken oder Riegel, mit denen Tore gesichert wurden. „Riegel“ ist im Deutschen knapp und im vorliegenden Torkontext eindeutig.
theological_decisions:
- issue: Genderbezogene militärische Verspottung in נָשִׁים
  choice: Das wörtliche „Frauen“ bleibt im Haupttext stehen.
  alternative: „wie Frauen“ oder „schwach wie Frauen“
  rationale: Im Hebräischen steht das Substantiv ohne ausdrückliche Vergleichspartikel. Die Alternativen würden die rhetorische Aussage erklärend erweitern und teilweise auslegen. Die anstößige Spannung des prophetischen Spottworts wird daher nicht geglättet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper prophetischer Wucht. Die direkte Anrede an die personifiziert gedachte Stadt bleibt erhalten. Das ungewöhnlich harte „deine Truppen sind Frauen“ folgt bewusst der ungemilderten Form des Hebräischen.
