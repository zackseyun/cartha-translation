source:
  edition: WLC
  text: מִנְּזָרַ֨יִ/ךְ֙ כָּֽ/אַרְבֶּ֔ה וְ/טַפְסְרַ֖יִ/ךְ כְּ/ג֣וֹב גֹּבָ֑י הַֽ/חוֹנִ֤ים בַּ/גְּדֵרוֹת֙ בְּ/י֣וֹם קָרָ֔ה שֶׁ֤מֶשׁ זָֽרְחָה֙ וְ/נוֹדַ֔ד וְ/לֹֽא נוֹדַ֥ע מְקוֹמ֖/וֹ אַיָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/017.yaml
  text: Your guards are like locusts[a], and your scribes like swarms of locusts, settling on the walls on a cold day. The sun rises, and they fly away[d][c][b]; no one knows where they are.
translation:
  language: de
  text: Deine Wächter[a] sind wie Heuschrecken, und deine Schreiber[b] wie Heuschreckenschwärme, die sich an einem kalten Tag auf den Mauern[c] niederlassen. Geht die Sonne auf, fliegen sie davon; niemand weiß, wo sie sind.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das seltene hebräische Wort kann auch „deine Gekrönten“, „deine Fürsten“ oder „deine Geweihten“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „deine Beamten“ beziehungsweise „deine Heerführer“.'
    reason: lexical_alternative
  - marker: c
    text: Das Hebräische kann hier auch Zäune oder Einfriedungen meinen.
    reason: lexical_alternative
  - marker: d
    text: 'Wörtlich etwa: „Und sein Ort ist nicht bekannt – wo sind sie?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְּזָרַיִךְ
  choice: deine Wächter
  rationale: Das seltene und umstrittene Substantiv bezeichnet hier im Parallelismus wahrscheinlich eine herausgehobene Schutz-, Militär- oder Amtsträgergruppe. „Wächter“ passt zum Kontext Ninives, während die Fußnote die Unsicherheit offenlegt.
- source_word: כָּאַרְבֶּה
  choice: wie Heuschrecken
  rationale: Der Vergleich ist kollektiv und allgemein; der deutsche Plural gibt das Bild natürlich wieder.
- source_word: טַפְסְרַיִךְ
  choice: deine Schreiber
  rationale: Das Lehnwort kann hohe Verwaltungs- oder Militärbeamte bezeichnen. „Schreiber“ bewahrt den wahrscheinlichen lexikalischen Kern; mögliche Amts- und Militärbedeutungen stehen in der Fußnote.
- source_word: כְּגֹב גֹּבָי
  choice: wie Heuschreckenschwärme
  rationale: Die verdoppelte Form zeichnet eine große, gedrängte Menge von Heuschrecken; „Heuschreckenschwärme“ vermittelt diese kollektive Wirkung idiomatisch.
- source_word: הַחוֹנִים
  choice: die sich … niederlassen
  rationale: חנה bedeutet „lagern“ oder „sich niederlassen“. Für Insekten an einer Oberfläche ist „sich niederlassen“ im Deutschen das natürliche Bild.
- source_word: בַּגְּדֵרוֹת
  choice: auf den Mauern
  rationale: Das Wort kann Mauern, Zäune oder Einfriedungen meinen. Im städtischen Belagerungskontext sind „Mauern“ naheliegend; die weitere Bedeutungsbreite bleibt in der Fußnote erhalten.
- source_word: בְּיוֹם קָרָה
  choice: an einem kalten Tag
  rationale: Eine direkte, natürliche Wiedergabe der Zeitangabe.
- source_word: שֶׁמֶשׁ זָרְחָה
  choice: Geht die Sonne auf
  rationale: Die poetische Szene beschreibt, wie die erwärmende Sonne die zuvor ruhenden Insekten zum Fortziehen bringt. Die deutsche Präsensform macht den Vorgang anschaulich.
- source_word: וְנוֹדַד
  choice: fliegen sie davon
  rationale: Das Verb kann fortziehen, umherziehen oder fliehen bedeuten. „Davonfliegen“ führt das Heuschreckenbild natürlich weiter; der deutsche Plural bezieht die Aussage auf die dargestellten Gruppen.
- source_word: וְלֹא נוֹדַע מְקוֹמוֹ אַיָּם
  choice: niemand weiß, wo sie sind
  rationale: Die idiomatische Wiedergabe vermittelt ihr spurloses Verschwinden. Die ungewöhnliche Verbindung von singularischem „sein Ort“ und pluralischem „Wo sind sie?“ wird in der Fußnote sichtbar gemacht.
