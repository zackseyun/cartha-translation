  text: And I will throw filth upon you[a], and treat you with contempt[b], and make you a spectacle.
translation:
  language: de
  text: Ich werde Unrat auf dich werfen[a], dich verächtlich machen und dich zur Schau stellen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Abscheuliches“ beziehungsweise „abscheuliche Dinge“. Das hebräische Wort bezeichnet oft etwas, das kultisch oder moralisch als abscheulich gilt; hier kann es konkret widerwärtigen Unrat meinen, mit dem Ninive öffentlich entehrt wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Ich werde dich als etwas zum Ansehen hinstellen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁלַכְתִּי
  choice: Ich werde … werfen
  rationale: Das Hifil von שׁלך bezeichnet hier das gezielte Werfen. „Werfen“ ist im modernen Deutschen natürlich und bewahrt die Wucht der angekündigten Handlung.
- source_word: עָלַיִךְ
  choice: auf dich
  rationale: Die Präposition עַל mit femininem Singularsuffix hat hier räumlichen Sinn; angesprochen ist Ninive, als Frau personifiziert.
- source_word: שִׁקֻּצִים
  choice: Unrat
  rationale: Das Wort bezeichnet Abscheuliches oder Verabscheuungswürdiges, häufig in kultischem oder moralischem Sinn. Im Zusammenhang öffentlicher Erniedrigung legt der Plural etwas Widerwärtiges nahe, das auf Ninive geworfen wird; „Unrat“ gibt dieses konkrete Schandbild verständlich wieder, ohne mögliche weitere Bedeutungen in der Fußnote auszuschließen.
- source_word: וְנִבַּלְתִּיךְ
  choice: dich verächtlich machen
  rationale: Das Piel von נבל drückt Entehrung, Herabsetzung oder Verächtlichmachung aus. Die Formulierung wahrt sowohl die aktive Handlung als auch den dadurch herbeigeführten Zustand.
- source_word: וְשַׂמְתִּיךְ
  choice: dich … machen
  rationale: שׂים bedeutet grundlegend „setzen, stellen, machen“. Mit der folgenden Prädikatsbestimmung ist „machen“ im Deutschen idiomatisch.
- source_word: כְּרֹאִי
  choice: zum Schauspiel
  rationale: Die Wendung bezeichnet etwas, das zum Ansehen beziehungsweise öffentlichen Betrachten dargeboten wird. „Zum Schauspiel“ vermittelt die öffentliche Bloßstellung in würdigem, verständlichem Deutsch; die wörtlichere Möglichkeit wird in der Fußnote genannt.
theological_decisions:
- issue: Prophetisches Bild der Erniedrigung Ninives, das als Frau angeredet wird
  choice: Die drastische Gerichts- und Schandsprache bleibt erhalten, ohne sie zu sexualisieren oder abzumildern.
  alternative: Das Bild durch allgemeinere Ausdrücke wie „bestrafen“ oder „demütigen“ zu umschreiben.
  rationale: Der hebräische Text schildert Gottes Gericht als öffentliche Entehrung. Diese Spannung gehört zur Aussage des Verses und darf weder entschärft noch über den Wortlaut hinaus ausgestaltet werden.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem prophetischem Ton. Die parallelen Verben und die direkte Anrede im femininen Singular bleiben erkennbar; unnötig altertümliche Ausdrücke werden vermieden.
