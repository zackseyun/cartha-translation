base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/015.yaml
  text: There the fire will devour you; the sword will cut you off; it will devour you like the locust[a]. Multiply yourself like the locust; multiply yourself like the swarming locust.
translation:
  language: de
  text: Dort wird das Feuer dich verzehren; das Schwert wird dich vernichten; es wird dich verzehren wie die Heuschrecke.[a] Vermehre dich wie die Heuschrecke, vermehre dich wie die Heuschrecke!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen stehen hier zwei verwandte Insektenbezeichnungen: יֶלֶק und אַרְבֶּה. יֶלֶק kann eine Heuschreckenart oder ein Entwicklungsstadium bezeichnen; die genaue zoologische Unterscheidung gegenüber אַרְבֶּה ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם
  choice: Dort
  rationale: Das Ortsadverb verweist knapp und nachdrücklich auf den vermeintlich sicheren Ort Ninives.
- source_word: תֹּאכְלֵךְ ... אֵשׁ
  choice: das Feuer wird dich verzehren
  rationale: „Verzehren“ gibt das bildhafte אָכַל bei Feuer natürlich wieder und bewahrt die Vorstellung eines fressenden Feuers.
- source_word: תַּכְרִיתֵךְ חֶרֶב
  choice: das Schwert wird dich ausrotten
  rationale: Der Hifil von כרת bezeichnet hier vernichtendes Beseitigen. „Ausrotten“ ist im Deutschen natürlicher als das wörtliche „abschneiden“ und wahrt die Stärke des Gerichtsbildes.
- source_word: תֹּאכְלֵךְ
  choice: es wird dich verzehren
  rationale: Das wiederholte Verb wird gleich übersetzt; das Pronomen lässt wie der hebräische Text einen gewissen Spielraum beim Bezug, liegt aber zunächst beim Schwert.
- source_word: כַּיָּלֶק / כַּיֶּלֶק
  choice: wie die Fresserheuschrecke
  rationale: יֶלֶק bezeichnet ein verheerendes, zur Heuschreckengruppe gehörendes Insekt beziehungsweise möglicherweise ein Entwicklungsstadium. „Fresserheuschrecke“ unterscheidet den Ausdruck im Haupttext von אַרְבֶּה, ohne eine unsichere zoologische Bestimmung vorzutäuschen.
- source_word: הִתְכַּבֵּד / הִתְכַּבְּדִי
  choice: Vermehre dich
  rationale: Die Imperative des Hitpael von כבד fordern die personifizierte Stadt spöttisch auf, zahlreich zu werden. „Vermehre dich“ ist knapp, verständlich und erhält den ironischen Befehl.
- source_word: כָּאַרְבֶּה
  choice: wie die Heuschrecke
  rationale: אַרְבֶּה ist die gewöhnliche Bezeichnung für die Heuschrecke und wird gegenüber יֶלֶק bewusst einfacher wiedergegeben.
