  text: מֵ֤י מָצוֹר֙ שַֽׁאֲבִי לָ֔/ךְ חַזְּקִ֖י מִבְצָרָ֑יִ/ךְ בֹּ֧אִי בַ/טִּ֛יט וְ/רִמְסִ֥י בַ/חֹ֖מֶר הַחֲזִ֥יקִי מַלְבֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/014.yaml
  text: Draw water for yourself for the siege; strengthen your fortresses[a]. Go into the clay and tread the mortar; take hold of the brick mold.
translation:
  language: de
  text: Schöpfe dir Wasser für die Belagerung; verstärke deine Festungen. Geh in den Lehm und tritt den Mörtel; ergreife die Ziegelform.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Ziegelofen«. Das seltene hebräische Wort מַלְבֵּן kann eine Ziegelform oder einen Ziegelofen bezeichnen; der unmittelbare Zusammenhang mit Lehm und Mörtel spricht eher für »Ziegelform«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵי מָצוֹר
  choice: Wasser für die Belagerung
  rationale: Die Konstruktverbindung bedeutet wörtlich »Wasser der Belagerung«. Gemeint ist Wasser, das angesichts der bevorstehenden Belagerung bereitgestellt wird.
- source_word: שַׁאֲבִי לָךְ
  choice: Schöpfe dir
  rationale: Der feminine Singular richtet sich an die als Frau personifizierte Stadt; »dir« bewahrt die dativisch-reflexive Nuance von לָךְ.
- source_word: חַזְּקִי מִבְצָרָיִךְ
  choice: verstärke deine Festungen
  rationale: Der Piel-Imperativ bezeichnet das Stärken oder Befestigen; מִבְצָרִים sind konkrete befestigte Orte bzw. Festungen.
- source_word: בֹּאִי בַטִּיט
  choice: Geh in den Lehm
  rationale: טִיט kann Schlamm oder Lehm bezeichnen; das anschließende Bild der Ziegelherstellung legt hier »Lehm« nahe.
- source_word: וְרִמְסִי בַחֹמֶר
  choice: und tritt den Mörtel
  rationale: רמס bezeichnet das Treten oder Stampfen. »Mörtel« gibt חֹמֶר im Zusammenhang der Verarbeitung von Baustoff wieder, ohne die körperliche Handlung abzuschwächen.
- source_word: הַחֲזִיקִי
  choice: greif nach
  rationale: Der Hiphil-Imperativ bedeutet hier angesichts des folgenden Gegenstands am ehesten »ergreifen« bzw. »danach greifen«, nicht »verstärken«.
- source_word: מַלְבֵּן
  choice: Ziegelform
  rationale: Das seltene Wort kann eine Ziegelform oder möglicherweise einen Ziegelofen bezeichnen. Die Abfolge von Lehm, Mörtel und manueller Bearbeitung spricht eher für eine Form zur Ziegelherstellung.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit kurzen, energischen Imperativen. Die feminine Anrede der personifizierten Stadt bleibt in den deutschen Pronomen erkennbar. Das handwerklich-militärische Bild und die lexikalische Unsicherheit am Versende werden bewahrt.
