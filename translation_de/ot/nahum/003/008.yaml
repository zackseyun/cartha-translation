base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/008.yaml
  text: Are you better than No-amon, who sat among the Nile channels, with waters all around her, whose rampart was the sea, whose wall was from the sea?
translation:
  language: de
  text: Bist du besser als No-Amon, die an den Nilarmen lag, ringsum von Wasser umgeben, deren Bollwerk das Meer war, deren Mauer aus dem Meer bestand?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲתֵיטְבִי מִנֹּא אָמוֹן
  choice: Bist du besser als No-Amon
  rationale: Die feminine Verbform spricht Ninive direkt an; der Vergleich und der ägyptische Ortsname werden unverändert wiedergegeben.
- source_word: הַיֹּשְׁבָה בַּיְאֹרִים
  choice: die an den Nilarmen lag
  rationale: יְאֹרִים bezeichnet hier die Wasserläufe beziehungsweise Arme des Nils. „lag“ gibt die Lage einer Stadt im Deutschen natürlicher wieder als das wörtliche „saß“.
- source_word: מַיִם סָבִיב לָהּ
  choice: ringsum von Wasser umgeben
  rationale: Die räumliche Umschließung durch Wasser wird klar und idiomatisch ausgedrückt.
- source_word: חֵיל יָם
  choice: Das Meer war ihr Bollwerk
  rationale: חֵיל kann eine Befestigung oder ein Bollwerk bezeichnen; יָם wird als „Meer“ belassen, da der Text die schützenden Nilgewässer bildhaft so nennt.
- source_word: מִיָּם חוֹמָתָהּ
  choice: aus dem Meer bestand ihre Mauer
  rationale: 'Die auffällige Formulierung des Hebräischen wird bewahrt: Das Wasser selbst fungierte als Stadtmauer.'
theological_decisions:
- issue: Identität und Schutz No-Amons
  choice: Der Ortsname und die Wasser-/Meeresmetaphorik bleiben ohne erklärende Deutung im Vers stehen.
  alternative: No-Amon als Theben erläutern und „Meer“ ausdrücklich als Nil deuten.
  rationale: Solche historischen Identifikationen sind wahrscheinlich, gehören aber nicht ausdrücklich zum Wortlaut und sollen dessen Bildsprache nicht ersetzen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die rhetorische Anrede bleibt direkt; die ungewöhnliche Aussage über Meer, Bollwerk und Mauer wird trotz ihrer Spannung nicht geglättet.
