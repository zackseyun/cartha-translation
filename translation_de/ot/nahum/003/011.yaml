id: NAM.3.11
reference: Nahum 3:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: גַּם אַ֣תְּ תִּשְׁכְּרִ֔י תְּהִ֖י נַֽעֲלָמָ֑ה גַּם אַ֛תְּ תְּבַקְשִׁ֥י מָע֖וֹז מֵ/אוֹיֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/011.yaml
  text: You too will become drunk[a]; you will be hidden[b]. You too will seek a refuge from the enemy.
translation:
  language: de
  text: Auch du wirst trunken werden[a] und verborgen sein. Auch du wirst Zuflucht vor dem Feind suchen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Trunkenwerden ist hier wahrscheinlich ein prophetisches Bild dafür, im Gericht überwältigt zu werden und zu taumeln, nicht nur ein Hinweis auf buchstäbliche Trunkenheit.
    reason: cultural_note
  - marker: b
    text: 'Oder: „eine Festung vor dem Feind suchen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אַתְּ
  choice: Auch du
  rationale: Die wiederholte Wendung stellt Ninive ausdrücklich neben das zuvor genannte No-Amon und bewahrt den Nachdruck des hebräischen Textes.
- source_word: תִּשְׁכְּרִי
  choice: wirst trunken werden
  rationale: Das Qal-Imperfekt von שׁכר bezeichnet das Betrunkenwerden. Die konkrete prophetische Bildsprache bleibt erhalten, ohne sie im Haupttext ausdrücklich als göttliches Gericht auszudeuten.
- source_word: תְּהִי נַעֲלָמָה
  choice: wirst verborgen sein
  rationale: Die Verbindung von היה mit der femininen Form נַעֲלָמָה beschreibt den Zustand des Verborgenseins. Die Wiedergabe erhält den passivisch-resultativen Sinn und vermeidet die stärker deutende Übersetzung „verschwinden“.
- source_word: תְּבַקְשִׁי
  choice: wirst … suchen
  rationale: בקש im Piel bedeutet hier, etwas zu suchen beziehungsweise zu erlangen zu versuchen. „suchen“ ist knapp, natürlich und dem prophetischen Stil angemessen.
- source_word: מָעוֹז
  choice: Zuflucht
  rationale: מָעוֹז kann einen Ort oder ein Mittel des Schutzes und der Stärke bezeichnen. „Zuflucht“ gibt in diesem Zusammenhang die Schutzfunktion natürlich wieder; die konkretere Möglichkeit „Festung“ bleibt in einer Fußnote erhalten.
- source_word: מֵאוֹיֵב
  choice: vor dem Feind
  rationale: Die Präposition מִן bezeichnet hier am natürlichsten die Bedrohung, vor der Schutz gesucht wird. Im Deutschen ist „Zuflucht vor dem Feind“ idiomatisch.
theological_decisions:
- issue: Bild des Betrunkenseins im Gerichtskontext
  choice: Die konkrete Formulierung „trunken werden“ bleibt im Haupttext stehen.
  alternative: Die Metapher deutend als „vom Gericht überwältigt werden“ wiederzugeben.
  rationale: Der nähere prophetische Zusammenhang legt Taumeln und Überwältigtwerden im Gericht nahe, doch der Vers nennt den Zorn oder das Gericht nicht ausdrücklich. Daher wird die Spannung durch das Bild selbst bewahrt und nur in der Fußnote erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper prophetischer Satzführung. „Trunken“ wahrt den gehobenen biblischen Ton, bleibt aber allgemein verständlich. Die weibliche Anrede an Ninive wird durch „du“ natürlich wiedergegeben.
