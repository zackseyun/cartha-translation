  terminology: „Blutvergießen“ trifft die idiomatische Bedeutung von דָּמִים besser als „Bluttaten“, ohne die Aussage auf einzelne Taten einzuengen. „Täuschung“ ist für כַּחַשׁ in diesem Zusammenhang etwas umfassender als „Lüge“ und passt zur politischen bzw. gewaltsamen Hinterlist; „Raub“ und „Beute“ bewahren die unterschiedliche, aber bildlich verwandte Wortwahl von פֶּרֶק und טָרֶף.
