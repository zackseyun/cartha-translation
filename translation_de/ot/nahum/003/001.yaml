  text: ה֖וֹי עִ֣יר דָּמִ֑ים כֻּלָּ֗/הּ כַּ֤חַשׁ פֶּ֨רֶק֙ מְלֵאָ֔ה לֹ֥א יָמִ֖ישׁ טָֽרֶף׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/001.yaml
  text: Woe to the city of bloodshed[a], all of it full of lies, full of plunder[d][c][b]; prey never departs.
translation:
  language: de
  text: Wehe der Stadt des Blutvergießens![a] Ganz und gar ist sie voll von Täuschung und Raub. Nie weicht die Beute.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich „Stadt der Blut[e]“; gemeint ist eine Stadt, die von Blutvergießen und Blutschuld geprägt ist. Möglich ist auch: „die blutige Stadt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder sinngemäß: „Das Beutemachen hört nicht auf.“ Der hebräische Wortlaut lautet näher: „Beute weicht nicht.“'
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹי
  choice: Wehe
  rationale: Die Interjektion verbindet Klage mit prophetischer Gerichtsankündigung; „Wehe“ bewahrt diese doppelte Kraft.
- source_word: עִיר דָּמִים
  choice: Stadt der Bluttaten
  rationale: Die wörtliche Mehrzahl „Bluttaten“ gibt die idiomatische Wendung „Stadt des Blutes/der Blut(schuld)“ als Kennzeichnung einer von Mord und Blutvergießen geprägten Stadt wieder.
- source_word: כֻּלָּהּ
  choice: Ganz und gar
  rationale: Die Form bezieht sich auf die gesamte Stadt und verstärkt die Aussage über ihren durchgängigen Zustand.
- source_word: כַּחַשׁ
  choice: Lüge
  rationale: Das Substantiv bezeichnet Falschheit oder Täuschung; „Lüge“ ist knapp, anschaulich und entspricht dem prophetischen Vorwurf.
- source_word: פֶּרֶק
  choice: Raub
  rationale: Das seltene Wort bezeichnet gewaltsames Wegreißen beziehungsweise das so Geraubte. „Raub“ bewahrt sowohl Gewalt als auch unrechtmäßige Aneignung.
- source_word: מְלֵאָה
  choice: ist sie erfüllt von
  rationale: Die feminine Form beschreibt die Stadt. Die gewählte Konstruktion verbindet כַּחַשׁ und פֶּרֶק natürlich als Inhalte, von denen sie durch und durch erfüllt ist.
- source_word: לֹא יָמִישׁ
  choice: Nie weicht
  rationale: Das Verb bedeutet „weichen, sich entfernen“; mit der Verneinung bezeichnet es die fortdauernde Gegenwart der Beute.
- source_word: טָרֶף
  choice: die Beute
  rationale: Das Wort bezeichnet besonders die von einem Raubtier gerissene Beute und erhält so das Bild unaufhörlicher räuberischer Gewalt.
theological_decisions: []
