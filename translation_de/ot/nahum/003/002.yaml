translation_notes:
  register: Knapp, rhythmisch und lautmalerisch. Die verblose Reihung des Hebräischen bleibt erhalten; geläufige deutsche Zusammensetzungen verdichten die ersten beiden Klangbilder. Die repräsentativen Singularformen des Hebräischen werden für ein natürliches deutsches Schlachtbild kollektiv im Plural wiedergegeben.
