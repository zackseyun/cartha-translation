translation:
  language: de
  text: Knall der Peitsche[a] und Rasseln des Rades, ein galoppierendes Pferd und ein springender Streitwagen![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Klang der Peitsche und Klang des Rasselns eines Rades“.'
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen stehen knappe Klang- und Bewegungsbilder ohne ein finites Verb nebeneinander. Dadurch wirkt die Kampfszene besonders unmittelbar.
    reason: literary_note
lexical_decisions:
- source_word: קוֹל שׁוֹט
  choice: Peitschenknall
  rationale: קוֹל bezeichnet einen Laut oder ein Geräusch, שׁוֹט die Peitsche. Das zusammengesetzte deutsche Wort gibt das scharfe Geräusch knapp und anschaulich wieder.
- source_word: קוֹל רַעַשׁ אוֹפָן
  choice: Rädergedröhn
  rationale: רַעַשׁ bezeichnet heftiges Lärmen, Dröhnen oder Rasseln. Im Zusammenhang mit אוֹפָן („Rad“) vermittelt „Rädergedröhn“ den schweren, lauten Klang fahrender Streitwagen; der Plural ist im Deutschen als kollektives Szenenbild natürlich.
- source_word: סוּס דֹּהֵר
  choice: galoppierende Pferde
  rationale: דֹּהֵר beschreibt die schnelle Bewegung eines Pferdes. „Galoppierend“ ist im Deutschen anschaulich und idiomatisch. Der Plural lässt die kollektiv geschilderte Angriffsszene natürlich klingen, obwohl der hebräische Ausdruck formal im Singular steht.
- source_word: מֶרְכָּבָה מְרַקֵּדָה
  choice: hüpfende Streitwagen
  rationale: מְרַקֵּדָה bezeichnet wörtlich ein Springen oder Hüpfen. „Hüpfend“ bewahrt das Bild der auf unebenem Boden auf- und niederspringenden Wagen, ohne die festliche Nebenbedeutung von „tanzen“. „Streitwagen“ verdeutlicht im Deutschen die militärische Bedeutung von מֶרְכָּבָה.
