source:
  edition: WLC
  text: גַּם הִ֗יא לַ/גֹּלָה֙ הָלְכָ֣ה בַ/שֶּׁ֔בִי גַּ֧ם עֹלָלֶ֛י/הָ יְרֻטְּשׁ֖וּ בְּ/רֹ֣אשׁ כָּל חוּצ֑וֹת וְ/עַל נִכְבַּדֶּ֨י/הָ֙ יַדּ֣וּ גוֹרָ֔ל וְ/כָל גְּדוֹלֶ֖י/הָ רֻתְּק֥וּ בַ/זִּקִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/010.yaml
  text: Yet she too went into exile[a], into captivity; her children too were dashed to pieces at the head of every street. They cast lots for her honored men[d][c][b], and all her great men were bound in chains.
translation:
  language: de
  text: Auch sie ging in die Verbannung, in die Gefangenschaft. Auch ihre Kleinkinder wurden an jeder Straßenecke[a] zerschmettert. Über ihre angesehenen Männer[b] warf man das Los, und alle ihre Großen wurden mit Ketten gefesselt[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „am Anfang jeder Straße“; gemeint sind wahrscheinlich Straßeneingänge, -einmündungen oder -ecken.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „ihre Vornehmen“ beziehungsweise „ihre Würdenträger“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „mit Fesseln festgebunden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם הִיא
  choice: Auch sie
  rationale: Bewahrt die emphatische Einbeziehung und den femininen Rückbezug auf No-Amon, ohne einen im Hebräischen nicht ausdrücklich markierten Gegensatz hinzuzufügen.
- source_word: לַגֹּלָה הָלְכָה בַשֶּׁבִי
  choice: ging in die Verbannung, in die Gefangenschaft
  rationale: Gibt die Bewegung in Exil und Gefangenschaft wieder und erhält die nachdrückliche, appositionelle Doppelung des Hebräischen.
- source_word: עֹלָלֶיהָ
  choice: ihre Kleinkinder
  rationale: עֹלָלִים bezeichnet sehr junge Kinder; „Kleinkinder“ ist im heutigen Deutsch präzise und verständlich.
- source_word: יְרֻטְּשׁוּ
  choice: wurden zerschmettert
  rationale: Bewahrt die drastische Gewalt des Verbs רטש und schwächt die geschilderte Tötung nicht ab.
- source_word: בְּרֹאשׁ כָּל חוּצוֹת
  choice: an jeder Straßenecke
  rationale: Die wörtliche Wendung „am Kopf aller Straßen“ bezeichnet wahrscheinlich markante Straßenanfänge, -einmündungen oder Ecken; „an jeder Straßenecke“ ist die natürliche deutsche Wiedergabe.
- source_word: נִכְבַּדֶּיהָ
  choice: ihre angesehenen Männer
  rationale: Spiegelt die Grundbedeutung von כבד als gesellschaftliches Gewicht beziehungsweise Ansehen wider, ohne den Personenkreis vorschnell auf einen formalen Adelsstand einzugrenzen.
- source_word: יַדּוּ גוֹרָל
  choice: warf man das Los
  rationale: Entspricht der hebräischen Redewendung für eine Zuteilung oder Verteilung durch Los.
- source_word: גְּדוֹלֶיהָ
  choice: ihre Großen
  rationale: Bewahrt die breite Statusbezeichnung für bedeutende oder mächtige Personen; „Führer“ wäre enger als der hebräische Ausdruck.
- source_word: רֻתְּקוּ בַזִּקִּים
  choice: wurden mit Ketten gefesselt
  rationale: Gibt sowohl das Festbinden als auch die verwendeten metallenen Fesseln klar und idiomatisch wieder.
theological_decisions: []
