  register: Modernes, würdiges Standarddeutsch. Die knappe Satzfolge und die wiederholte Hervorhebung durch „auch“ bleiben erhalten; die Gewaltdarstellung wird nicht beschönigt. Gesellschaftliche Rangbezeichnungen werden bewusst breit wiedergegeben, damit der hebräische Text nicht unnötig auf formale Ämter oder einen Adelsstand festgelegt wird.
