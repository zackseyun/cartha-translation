  text: הִנְ/נִ֣י אֵלַ֗יִ/ךְ נְאֻם֙ יְהוָ֣ה צְבָא֔וֹת וְ/גִלֵּיתִ֥י שׁוּלַ֖יִ/ךְ עַל פָּנָ֑יִ/ךְ וְ/הַרְאֵיתִ֤י גוֹיִם֙ מַעְרֵ֔/ךְ וּ/מַמְלָכ֖וֹת קְלוֹנֵֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/005.yaml
  text: Behold[a], I am against you, declares Yahweh of hosts, and I will uncover your skirts over your face, and I will show the nations your nakedness and the kingdoms your shame.
translation:
  language: de
  text: Siehe, ich bin gegen dich – Ausspruch Jahwes der Heerscharen. Ich werde deine Gewandsäume über dein Gesicht hochheben und den Nationen deine Blöße[a] zeigen, den Königreichen deine Schande.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich kann das Wort die entblößten Körperteile bezeichnen. Das Hebräische gebraucht hier das Bild hochgehobener Gewandsäume für öffentliche Bloßstellung und Erniedrigung.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי אֵלַיִךְ
  choice: Siehe, ich bin gegen dich
  rationale: Die feste Wendung kündigt feierlich Jahwes feindliches Einschreiten gegen das als Frau angeredete Ninive an. „Siehe“ erhält den prophetischen Aufmerksamkeitsruf.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: Ausspruch Jahwes, des Herrn der Heerscharen
  rationale: „Ausspruch“ gibt die prophetische Formel נְאֻם knapp wieder; der Gottesname wird als „Jahwe“ wiedergegeben. „Herr der Heerscharen“ bewahrt den militärisch-kosmischen Titel in geläufigem Deutsch.
- source_word: וְגִלֵּיתִי שׁוּלַיִךְ עַל פָּנָיִךְ
  choice: Ich werde deine Gewandsäume bis über dein Gesicht hochheben
  rationale: Die Formulierung bewahrt das konkrete Bild des Anhebens beziehungsweise Entblößens des unteren Gewandrandes und macht die Bewegungsrichtung im Deutschen verständlich.
- source_word: גֹּויִם
  choice: den Nationen
  rationale: „Nationen“ entspricht dem politischen und internationalen Rahmen des Gerichtsworts.
- source_word: מַעְרֵךְ
  choice: deine Blöße
  rationale: „Blöße“ bezeichnet hier die öffentlich sichtbar gemachte Nacktheit, ohne die Bildsprache unnötig explizit zu machen.
- source_word: וּמַמְלָכוֹת קְלוֹנֵךְ
  choice: den Königreichen deine Schande
  rationale: Die knappe Parallelkonstruktion des Hebräischen bleibt erhalten; קָלוֹן bezeichnet öffentliche Schmach oder Entehrung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich; „Jahwe“ bewahrt den offenbarten Eigennamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bild öffentlicher Entblößung als Gericht
  choice: Konkrete Schandbildsprache beibehalten
  alternative: Allgemein als Demütigung umschreiben
  rationale: Der Vers verbindet sexuelle Entblößung und öffentliche politische Schmach. Eine abstrakte Umschreibung würde die Härte und Spannung des Gerichtsworts abschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst bewahrter prophetischer Direktheit. Die feminine Anrede bezieht sich auf Ninive als personifizierte Stadt. Der Gedankenstrich markiert die eingeschobene Botenformel, ohne den Satzfluss zu glätten.
