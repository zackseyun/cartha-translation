source:
  edition: WLC
  text: כּ֥וּשׁ עָצְמָ֛/ה וּ/מִצְרַ֖יִם וְ/אֵ֣ין קֵ֑צֶה פּ֣וּט וְ/לוּבִ֔ים הָי֖וּ בְּ/עֶזְרָתֵֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/009.yaml
  text: Cush was her strength[a], and Egypt without end[d][c][b]; Put and the Libyans were among your helpers.
translation:
  language: de
  text: Kusch war ihre Stärke[a] und Ägypten ohne Ende; Put[b] und die Libyer[c] waren deine Helfer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen wechselt die Anrede innerhalb des Verses: Hier steht „ihre Stärke“ (3. Person feminin), später „deine Helfer“ (2. Person feminin). Manche Übersetzungen gleichen dies zu „deine Stärke“ an.'
    reason: alternative_reading
  - marker: b
    text: Traditionell auch „Phut“ geschrieben.
    reason: lexical_alternative
  - marker: c
    text: Hebräisch „Lubim“; wahrscheinlich sind libysche Völker gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: כּוּשׁ
  choice: Kusch
  rationale: Der Eigenname wird entsprechend dem Hebräischen transliteriert; „Äthiopien“ wäre eine stärker deututende geografische Zuordnung.
- source_word: עָצְמָהּ
  choice: war ihre Stärke
  rationale: Das Suffix ist feminin Singular der 3. Person und bezieht sich im Kontext auf No-Amon; der spätere Wechsel zur 2. Person wird nicht geglättet.
- source_word: וּמִצְרַיִם
  choice: dazu Ägypten
  rationale: Der Eigenname ist eindeutig; „dazu“ verbindet Ägypten natürlich mit Kusch als weiterer Machtressource.
- source_word: וְאֵין קֵצֶה
  choice: ohne Ende
  rationale: Die knappe hebräische Wendung bezeichnet eine nicht begrenzte beziehungsweise unermessliche Macht oder Menge und bleibt in ihrer syntaktischen Zuordnung offen.
- source_word: פּוּט
  choice: Put
  rationale: Direkte Transliteration des hebräischen Eigennamens; „Phut“ ist eine ältere traditionelle Schreibweise.
- source_word: לוּבִים
  choice: die Libyer
  rationale: Das Ethnonym bezeichnet wahrscheinlich libysche Völker; die geläufige deutsche Volksbezeichnung ist verständlicher als „Lubim“.
- source_word: הָיוּ בְּעֶזְרָתֵךְ
  choice: gehörten zu deinen Helfern
  rationale: Die idiomatische Formulierung gibt wieder, dass Put und die Libyer zu den unterstützenden Kräften der angeredeten Stadt zählten; das feminine Suffix der 2. Person bleibt als „deinen“ erhalten.
theological_decisions:
- issue: Wechsel von der 3. zur 2. Person feminin Singular
  choice: „ihre Stärke“ und später „deinen Helfern“
  alternative: „deine Stärke“ und „deinen Helfern“
  rationale: Der masoretische Text enthält tatsächlich den Personenwechsel. Eine Harmonisierung würde die grammatische Spannung des Ausgangstextes beseitigen.
- issue: Zuordnung von „ohne Ende“
  choice: Die knappe, mehrdeutige Stellung nach „Ägypten“ bleibt erhalten.
  alternative: „Kusch und das zahllose Ägypten“ oder „Ägypten, dessen Macht grenzenlos war“
  rationale: Der hebräische Nominalsatz legt nicht ausdrücklich fest, ob die Grenzenlosigkeit Ägypten, den vereinten Kräften oder ihrer Stärke gilt; eine erklärende Ergänzung würde dies unnötig festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe prophetische Reihung und der auffällige Personenwechsel des Hebräischen bleiben bewahrt. „Gehörten zu deinen Helfern“ ist idiomatischer als das wörtliche „waren in deiner Hilfe“, ohne den Sinn zu erweitern.
