  text: וְ/הָיָ֤ה כָל רֹאַ֨יִ/ךְ֙ יִדּ֣וֹד מִמֵּ֔/ךְ וְ/אָמַר֙ שָׁדְּדָ֣ה נִֽינְוֵ֔ה מִ֖י יָנ֣וּד לָ֑/הּ מֵ/אַ֛יִן אֲבַקֵּ֥שׁ מְנַחֲמִ֖ים לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/007.yaml
  text: And it will happen that all who see you will shrink from you and say, ‘Nineveh is devastated; who will grieve for her? Where can I seek comforters for you?’
translation:
  language: de
  text: 'Dann werden alle, die dich sehen, vor dir zurückweichen und sagen: »Ninive ist verwüstet! Wer wird sie beklagen? Woher soll ich Tröster für dich suchen?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִדּוֹד מִמֵּךְ
  choice: vor dir zurückweichen
  rationale: Das seltene Verb דּוּד bezeichnet hier eine abwehrende Bewegung weg von Ninive. »Zurückweichen« gibt sowohl die räumliche Distanzierung als auch den erschrockenen Widerwillen natürlich wieder.
- source_word: שָׁדְּדָה
  choice: ist verwüstet
  rationale: Die Form bezeichnet Ninives gewaltsame Zerstörung bzw. Verwüstung. Das deutsche Perfekt passt zur ausgerufenen Feststellung des eingetretenen Unheils.
- source_word: יָנוּד לָהּ
  choice: hat Mitleid mit ihr
  rationale: נוּד kann im Trauerkontext Mitgefühl, Beileid oder beklagendes Anteilnehmen ausdrücken. »Mitleid haben« bewahrt den Sinn, ohne eine bestimmte Trauergeste vorauszusetzen.
- source_word: מֵאַיִן אֲבַקֵּשׁ
  choice: Wo soll ich … suchen?
  rationale: מֵאַיִן fragt wörtlich nach dem Herkunftsort (»woher«); mit »suchen« ist im Deutschen die idiomatische Frage »Wo soll ich … suchen?« natürlich und sinngleich.
- source_word: מְנַחֲמִים
  choice: Tröster
  rationale: Das Partizip im Plural bezeichnet Personen, die Trost spenden. »Tröster« erhält die konkrete personale Aussage.
theological_decisions:
- issue: Art des beklagenden Anteilnehmens in יָנוּד
  choice: hat Mitleid mit ihr
  alternative: trauert um sie / beklagt sie
  rationale: Der hebräische Ausdruck umfasst Anteilnahme und beklagendes Mitgefühl. Die gewählte Fassung legt nicht unnötig fest, ob formelle Totenklage gemeint ist.
- issue: Wechsel der Anrede zwischen dritter und zweiter Person
  choice: »mit ihr« und anschließend »für dich« beibehalten
  alternative: beide Bezüge auf dieselbe grammatische Person vereinheitlichen
  rationale: Der hebräische Text wechselt bewusst von Ninive als besprochener Stadt zur direkten Anrede. Diese rhetorische Spannung bleibt erhalten.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die direkte Rede ist knapp und eindringlich; der auffällige Personenwechsel des Hebräischen wird nicht geglättet.
