  text: You multiplied your merchants more than the stars of the heavens[b][a]; the locust strips bare and flies away.
translation:
  language: de
  text: Du hast deine Händler zahlreicher gemacht als die Sterne am Himmel. Die Heuschrecke[a] frisst alles kahl[b] und fliegt davon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die junge Heuschrecke“; das hebräische Wort bezeichnet eine bestimmte Art oder Entwicklungsstufe der Heuschrecke.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „breitet sich aus“ oder „streift ab“. Das hebräische Verb kann Ausbreiten oder Abstreifen/Entblößen bezeichnen; im Zusammenhang mit der Heuschrecke kann es ihr Kahlfressen vor dem Davonfliegen ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִרְבֵּית
  choice: Du hast … zahlreicher gemacht
  rationale: Das Hifil Perfekt 2. Person Feminin Singular richtet sich an Ninive als weiblich gedachte Stadt und bezeichnet eine zahlenmäßige Vermehrung.
- source_word: רֹכְלַיִךְ
  choice: deine Händler
  rationale: Das Wort bezeichnet Handel treibende Personen; „Händler“ ist im modernen Deutschen natürlich und passt zur wirtschaftlichen Bildwelt.
- source_word: מִכּוֹכְבֵי הַשָּׁמָיִם
  choice: als die Sterne am Himmel
  rationale: מִן ist nach רבה komparativ zu verstehen. „Sterne am Himmel“ gibt den hebräischen Ausdruck würdig und idiomatisch wieder.
- source_word: יֶלֶק
  choice: die Heuschrecke
  rationale: יֶלֶק bezeichnet wohl eine bestimmte Art oder Entwicklungsstufe der Heuschrecke; der allgemein verständliche Oberbegriff vermeidet ungesicherte zoologische Präzision.
- source_word: פָּשַׁט
  choice: häutet sich
  rationale: Das Verb kann „abstreifen/ausziehen“ oder „sich ausbreiten“ bedeuten. Mit יֶלֶק kann es das Abstreifen der Haut beim Übergang zum flugfähigen Stadium bezeichnen; diese Lesart erklärt unmittelbar das anschließende Davonfliegen, ohne die echte Mehrdeutigkeit zu verschweigen.
- source_word: וַיָּעֹף
  choice: und fliegt davon
  rationale: Das Qal wayyiqtol von עוף bezeichnet das Fliegen; „fliegt davon“ bewahrt die Abfolge und das Bild des plötzlichen Verschwindens.
theological_decisions: []
