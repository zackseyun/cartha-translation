id: NAM.3.4
reference: Nahum 3:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: מֵ/רֹב֙ זְנוּנֵ֣י זוֹנָ֔ה ט֥וֹבַת חֵ֖ן בַּעֲלַ֣ת כְּשָׁפִ֑ים הַ/מֹּכֶ֤רֶת גּוֹיִם֙ בִּ/זְנוּנֶ֔י/הָ וּ/מִשְׁפָּח֖וֹת בִּ/כְשָׁפֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/nahum/003/004.yaml
  text: because of the many prostitutions of the prostitute[a], charming in grace, mistress of sorceries[b], who sells nations by her prostitutions and clans by her sorceries.
translation:
  language: de
  text: Wegen der vielen Hurereien der Hure, von verführerischer Anmut[a], einer Herrin der Zauberkünste, die Nationen durch ihre Hurereien verkauft und Sippen[b] durch ihre Zauberkünste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von anziehender Anmut“ oder „von lieblichem Reiz“. Die hebräische Wendung beschreibt eine Anziehungskraft, mit der sie andere für sich einnimmt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Familien“. Das hebräische Wort kann größere Familienverbände oder Sippen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרֹב
  choice: Wegen der vielen
  rationale: 'Die Verbindung aus מִן und רֹב bezeichnet hier den Grund des Gerichts und bewahrt zugleich den quantitativen Sinn: Es geht um die große Zahl ihrer Taten.'
- source_word: זְנוּנֵי / זוֹנָה
  choice: Hurereien der Hure
  rationale: Die bewusst zugespitzte Wiederholung des hebräischen Wortstamms bleibt erhalten. Die Formulierung wahrt das Bild sexueller Untreue und Verführung, ohne es auf buchstäbliche sexuelle Sünde einzuengen.
- source_word: טוֹבַת חֵן
  choice: von verführerischer Anmut
  rationale: Die Wendung bezeichnet anziehenden Reiz oder gewinnende Anmut. „Verführerisch“ macht im Zusammenhang die Wirkung dieser Anmut deutlich, ohne sie lediglich auf körperliche Schönheit zu reduzieren.
- source_word: בַּעֲלַת כְּשָׁפִים
  choice: einer Herrin der Zauberkünste
  rationale: Das feminine בַּעֲלַת bezeichnet eine Frau, die durch etwas gekennzeichnet ist oder darüber verfügt. „Herrin“ erhält die weibliche Personifikation; „Zauberkünste“ gibt den Plural כְּשָׁפִים natürlich wieder.
- source_word: הַמֹּכֶרֶת
  choice: die ... verkauft
  rationale: „Verkauft“ wahrt das direkte Bild kommerzieller Auslieferung und Ausbeutung, ohne deutender auf „verrät“ oder „versklavt“ festgelegt zu werden.
- source_word: גּוֹיִם
  choice: Nationen
  rationale: Im prophetischen und geopolitischen Zusammenhang sind ganze Nationen gemeint; „Heiden“ wäre hier sachlich verengend.
- source_word: בִּזְנוּנֶיהָ
  choice: durch ihre Hurereien
  rationale: Die Präposition בְּ bezeichnet das Mittel. „Durch“ ist im Deutschen idiomatisch und zeigt, wodurch die Nationen verkauft werden.
- source_word: וּמִשְׁפָּחוֹת
  choice: und Sippen
  rationale: מִשְׁפָּחוֹת kann größere verwandtschaftlich verbundene Gruppen bezeichnen. „Sippen“ bildet dazu den passenden Gegenbegriff zu „Nationen“, lässt aber die Alternative „Familien“ offen.
- source_word: בִּכְשָׁפֶיהָ
  choice: durch ihre Zauberkünste
  rationale: Auch hier bezeichnet בְּ das Mittel. Die Wiederholung von „Zauberkünste“ erhält die lexikalische Entsprechung zum ersten Vorkommen.
theological_decisions:
- issue: Bedeutung des Bildes von Hure und Zauberkünsten
  choice: Das prophetische Bild bleibt mehrdeutig und beschreibt Ninives verführerische, korrumpierende und ausbeuterische Macht.
  alternative: Das Bild ausschließlich auf Götzendienst oder ausschließlich auf politische und wirtschaftliche Manipulation beziehen.
  rationale: Der Vers selbst verbindet sexuelle, magische und wirtschaftliche Bildsprache. Die Übersetzung erhält diese Spannung, statt sie auf nur einen theologischen oder politischen Bezug festzulegen.
- issue: Bedeutung von הַמֹּכֶרֶת
  choice: verkauft
  alternative: verrät oder versklavt
  rationale: Die Grundbedeutung „verkaufen“ lässt offen, ob Auslieferung, Versklavung, politische Preisgabe oder allgemeine Ausbeutung im Vordergrund steht.
translation_notes:
  register: Moderne, würdige prophetische Sprache. „Hurereien der Hure“ ist bewusst kräftig und erhält die hebräische Stammwiederholung; „Zauberkünste“ klingt natürlicher als das fachsprachlichere „Zaubereien“ und wahrt den Plural. Die Satzstruktur folgt dem verdichteten Charakter des hebräischen Nominalsatzes.
