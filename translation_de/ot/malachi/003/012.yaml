source:
  edition: WLC
  text: וְ/אִשְּׁר֥וּ אֶתְ/כֶ֖ם כָּל הַ/גּוֹיִ֑ם כִּֽי תִהְי֤וּ אַתֶּם֙ אֶ֣רֶץ חֵ֔פֶץ אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/012.yaml
  text: Then all the nations will call you blessed[a], for you will be a delightful land, says Yahweh of hosts.
translation:
  language: de
  text: Dann werden euch alle Völker glücklich preisen, denn ihr werdet ein begehrenswertes Land sein, spricht Jahwe der Heerscharen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִשְּׁרוּ
  choice: werden ... glücklich preisen
  rationale: Das Piel von אשר bezeichnet hier, jemanden als glücklich bzw. gesegnet anzusehen und öffentlich so zu bezeichnen. „Glücklich preisen“ ist im Deutschen idiomatisch und bewahrt diesen Sinn.
- source_word: כָּל הַגּוֹיִם
  choice: alle Völker
  rationale: גּוֹיִם bezeichnet hier die Völker beziehungsweise Nationen insgesamt; „Völker“ ist natürlich und vermeidet die spätere technische Bedeutung von „Heiden“.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet den Grund dafür ein, weshalb die Völker Israel glücklich preisen werden.
- source_word: תִהְיוּ אַתֶּם
  choice: ihr werdet ... sein
  rationale: Die ausdrückliche Anrede אַתֶּם hebt die Angesprochenen hervor; das deutsche „ihr“ gibt sie in der Futurkonstruktion angemessen wieder.
- source_word: אֶרֶץ חֵפֶץ
  choice: ein Land der Freude
  rationale: Die Genitivverbindung kann ein Land bezeichnen, an dem man Freude hat beziehungsweise das begehrenswert ist. Die Wiedergabe bewahrt die bildhafte und leicht mehrdeutige Form des Hebräischen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: צְבָאוֹת
  choice: der Heerscharen
  rationale: Die traditionelle, würdevolle Wiedergabe lässt die mögliche Breite himmlischer und irdischer Heere bestehen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes; „Jahwe“ bewahrt diesen statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von אֶרֶץ חֵפֶץ
  choice: ein Land der Freude
  alternative: ein begehrenswertes Land
  rationale: Die hebräische Verbindung kann sowohl Freude beziehungsweise Wohlgefallen als auch Begehrenswertsein ausdrücken. Die Hauptfassung erhält die Substantivkonstruktion; die Fußnote nennt natürliche Alternativen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Glücklich preisen“ ist verständlich und bildet die öffentliche Anerkennung nach; „spricht Jahwe der Heerscharen“ wahrt den prophetischen Formelstil.
