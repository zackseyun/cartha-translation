base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/013.yaml
  text: Your words have been hard against me[a], says Yahweh. But you say, “What have we spoken against you?”
translation:
  language: de
  text: '»Eure Worte sind hart gegen mich gewesen[a]«, sagt Jahwe. Doch ihr sagt: »Was haben wir gegen dich geredet?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Eure Worte sind heftig gegen mich gewesen.« Wörtlich steht im Hebräischen: »Eure Worte sind stark gegen mich gewesen«; »stark« bezeichnet hier sinngemäß scharfe oder harte Rede.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָזְקוּ
  choice: sind hart gewesen
  rationale: Das Verb bezeichnet wörtlich Stärke. Mit »Worte« als Subjekt und עַל in gegnerischem Sinn beschreibt es hier scharfe, heftige oder harte Rede. Die Formulierung bewahrt das hebräische Bild und klingt zugleich natürlich.
- source_word: עָלַי
  choice: gegen mich
  rationale: Die Präposition hat in diesem Zusammenhang adversative Bedeutung und bezeichnet die gegen Gott gerichtete Rede.
- source_word: דִּבְרֵיכֶם
  choice: eure Worte
  rationale: Die direkte und im Deutschen natürliche Wiedergabe des Plurals mit Suffix der zweiten Person maskulin Plural.
- source_word: אָמַר יְהוָה
  choice: sagt Jahwe
  rationale: Das Präsens entspricht der üblichen deutschen Wiedergabe der prophetischen Botenformel und vermittelt ihre fortdauernde Unmittelbarkeit.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: וַאֲמַרְתֶּם
  choice: Doch ihr fragt
  rationale: Die Konjunktion markiert den Einwand des Volkes. Da unmittelbar eine Frage folgt, ist »fragt« im Deutschen idiomatischer als »sagt«, ohne die Aussagefunktion zu verändern.
- source_word: מַה
  choice: Was
  rationale: Das Fragewort erkundigt sich knapp nach dem Inhalt der angeblich gegen Gott gerichteten Rede.
- source_word: נִּדְבַּרְנוּ
  choice: haben wir geredet
  rationale: Der Niphal von דבר wird hier idiomatisch als gemeinsames beziehungsweise eigenes Reden wiedergegeben; »geredet« passt natürlich zur Verbindung mit »gegen«.
- source_word: עָלֶיךָ
  choice: gegen dich
  rationale: Die Wiederholung von עַל greift die adversative Bedeutung aus dem ersten Satz auf und bewahrt die sprachliche Parallelität.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. »Jahwe« gibt den Gottesnamen als Namen wieder, ohne ihn durch einen Hoheitstitel zu ersetzen.
- issue: Ausrichtung der Worte gegen Gott
  choice: gegen mich / gegen dich
  alternative: über mich / über dich
  rationale: Beide Präpositionalverbindungen können formal auch ein Reden über jemanden bezeichnen. Der Vorwurf und die parallele Wiederholung im Streitgespräch sprechen hier jedoch für die gegnerische Bedeutung, ohne den Inhalt der Worte näher festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bewahrt den Streitgesprächsstil Maleachis. »hart« hält die ungewöhnliche hebräische Stärke-Metapher sichtbar; die Fußnote erläutert die wörtliche Form und eine mögliche Alternative.
