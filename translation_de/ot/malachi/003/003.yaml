source:
  edition: WLC
  text: וְ/יָשַׁ֨ב מְצָרֵ֤ף וּ/מְטַהֵר֙ כֶּ֔סֶף וְ/טִהַ֤ר אֶת בְּנֵֽי לֵוִי֙ וְ/זִקַּ֣ק אֹתָ֔/ם כַּ/זָּהָ֖ב וְ/כַ/כָּ֑סֶף וְ/הָיוּ֙ לַֽ/יהוָ֔ה מַגִּישֵׁ֥י מִנְחָ֖ה בִּ/צְדָקָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/003.yaml
  text: He will sit as a refiner and purifier of silver[a], and he will purify the sons of Levi and refine them like gold and like silver, and they will be for Yahweh, presenting an offering in righteousness.
translation:
  language: de
  text: Er wird als Läuterer und Reiniger von Silber dasitzen. Er wird die Söhne Levis reinigen und sie läutern wie Gold und wie Silber. Dann werden sie dem HERRN in Gerechtigkeit eine Opfergabe[a] darbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Speisopfer“ beziehungsweise „ein Getreideopfer“. Das hebräische Wort minḥā bezeichnet häufig ein Getreideopfer, kann aber auch allgemeiner eine Opfergabe oder Gabe meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשַׁב
  choice: Er wird … dasitzen
  rationale: Das Verb bezeichnet hier das Sitzen beziehungsweise Platznehmen. „Dasitzen“ bewahrt das anschauliche Bild des Metallhandwerkers, der seiner Arbeit aufmerksam nachgeht.
- source_word: מְצָרֵף וּמְטַהֵר כֶּסֶף
  choice: als Schmelzer und Reiniger des Silbers
  rationale: Die beiden Partizipien bezeichnen das Schmelzen beziehungsweise Läutern und Reinigen von Metall. Die substantivische Wiedergabe erhält die Berufsmetapher und den Parallelismus.
- source_word: וְטִהַר
  choice: Er wird … reinigen
  rationale: „Reinigen“ wahrt sowohl die metallurgische Bildwelt als auch den kultischen und ethischen Bedeutungsraum des Verbs.
- source_word: בְּנֵי לֵוִי
  choice: die Söhne Levis
  rationale: Die wörtliche Stammes- und Abstammungsbezeichnung wird beibehalten, statt sie stillschweigend zu „die Leviten“ zu verallgemeinern.
- source_word: וְזִקַּק
  choice: und sie läutern
  rationale: „Läutern“ ist im Deutschen die passende Bezeichnung für die Reinigung von Edelmetallen und trägt zugleich die übertragene Bedeutung der persönlichen Reinigung.
- source_word: כַּזָּהָב וְכַכָּסֶף
  choice: wie Gold und wie Silber
  rationale: Das wiederholte Vergleichswort des Hebräischen wird durch das zweimalige „wie“ abgebildet.
- source_word: לַיהוָה
  choice: dem HERRN
  rationale: Der Gottesname JHWH wird gemäß der ehrfürchtigen deutschen Bibelkonvention mit „HERR“ in Kapitälchenform wiedergegeben.
- source_word: מַגִּישֵׁי מִנְחָה
  choice: eine Opfergabe darbringen
  rationale: Die idiomatische deutsche Verbalkonstruktion gibt die hebräische Bezeichnung „Darbringende einer Opfergabe“ natürlich wieder, ohne die Opferart im Haupttext enger festzulegen.
- source_word: בִּצְדָקָה
  choice: in Gerechtigkeit
  rationale: Die substantivische Form erhält den ethischen und kultischen Bedeutungsumfang von צְדָקָה, statt ihn auf das Adverb „gerecht“ zu verengen.
theological_decisions:
- issue: Bezug der Läuterungsmetapher
  choice: Die Reinigung gilt im unmittelbaren Text den Söhnen Levis und befähigt sie zu rechter Opferdarbringung.
  alternative: Die Läuterung kann weiterführend auf ganz Israel oder messianisch gedeutet werden.
  rationale: Der hebräische Vers nennt ausdrücklich die Söhne Levis. Weitergehende kanonische Deutungen werden nicht in den Wortlaut der Übersetzung eingetragen.
- issue: Bedeutungsumfang von מִנְחָה
  choice: Im Haupttext steht der weitere Ausdruck „Opfergabe“.
  alternative: „Speisopfer“ beziehungsweise „Getreideopfer“.
  rationale: מִנְחָה kann allgemein eine Gabe oder Opfergabe und im Kult speziell ein unblutiges Getreideopfer bezeichnen. Die engere Möglichkeit bleibt in der Fußnote sichtbar.
- issue: Verhältnis von Zugehörigkeit und Dienst in וְהָיוּ לַיהוָה מַגִּישֵׁי
  choice: Die Wendung wird idiomatisch als künftiges Darbringen für den HERRN wiedergegeben.
  alternative: „Dann werden sie für den HERRN Darbringende einer Opfergabe sein.“
  rationale: Die gewählte Fassung ist natürliches modernes Deutsch und bewahrt Zielrichtung und priesterliche Tätigkeit, auch wenn das hebräische „sie werden sein“ nicht eigens lexicalisiert wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst erhaltener Metallurgie-Metapher. „Söhne Levis“ wahrt die hebräische Abstammungsformel; „in Gerechtigkeit“ erhält die theologisch und kultisch offene Nominalform.
