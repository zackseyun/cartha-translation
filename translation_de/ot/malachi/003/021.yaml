source:
  edition: WLC
  text: וְ/עַסּוֹתֶ֣ם רְשָׁעִ֔ים כִּֽי יִהְי֣וּ אֵ֔פֶר תַּ֖חַת כַּפּ֣וֹת רַגְלֵי/כֶ֑ם בַּ/יּוֹם֙ אֲשֶׁ֣ר אֲנִ֣י עֹשֶׂ֔ה אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/021.yaml
  text: And you will trample the wicked[a], for they will be ashes under the soles of your feet on the day when I act, says Yahweh of Armies.
translation:
  language: de
  text: Ihr werdet die Gottlosen zertreten, denn sie werden Asche unter euren Fußsohlen sein an dem Tag, an dem ich handle, spricht Jahwe der Heerscharen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַסּוֹתֶם
  choice: Ihr werdet … zertreten
  rationale: Das seltene Verb bezeichnet hier im Kontext das Niedertreten. „Zertreten“ bewahrt das körperliche Bild siegreicher Unterwerfung und klingt im modernen Deutsch natürlich.
- source_word: רְשָׁעִים
  choice: die Gottlosen
  rationale: Das substantivierte pluralische Adjektiv bezeichnet Menschen, die als schuldig beziehungsweise böse charakterisiert sind. „Die Gottlosen“ ist eine geläufige, würdevolle Wiedergabe der moralisch-religiösen Kategorie.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung für das Zertreten ein; „denn“ gibt diese erklärende Funktion knapp wieder.
- source_word: יִהְיוּ אֵפֶר
  choice: sie werden zu Asche
  rationale: Hebräisch steht wörtlich „sie werden Asche sein“. Die deutsche Fügung „zu Asche werden“ gibt den prädikativen Sinn natürlich wieder, ohne einen bloßen Vergleich einzuführen.
- source_word: תַּחַת כַּפּוֹת רַגְלֵיכֶם
  choice: unter euren Fußsohlen
  rationale: כַּף bezeichnet in Verbindung mit רֶגֶל die Fußsohle. Die räumliche Metapher wird direkt und idiomatisch wiedergegeben.
- source_word: בַּיּוֹם אֲשֶׁר אֲנִי עֹשֶׂה
  choice: an dem Tag, an dem ich handle
  rationale: Die elliptische Wendung mit dem Partizip von עשה verweist auf Jahwes entscheidendes Tun. „Ich handle“ bleibt zurückhaltend und ergänzt keinen ausdrücklich genannten Gegenstand.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben. „Heerscharen“ übersetzt צְבָאוֹת und bewahrt die Breite des traditionellen Titels, der sowohl himmlische als auch militärische Mächte bezeichnen kann.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, damit sein Charakter als offenbarter Bundesname sichtbar bleibt.
- issue: Wiedergabe von צְבָאוֹת im Gottestitel
  choice: der Heerscharen
  alternative: der Armeen
  rationale: „Heerscharen“ ist im Deutschen verständlich und lässt die mögliche kosmische wie militärische Reichweite des hebräischen Ausdrucks offen; „Armeen“ könnte den Titel unnötig auf irdische Streitkräfte verengen.
- issue: Art der Vernichtung der Gottlosen
  choice: sie werden zu Asche
  alternative: sie werden wie Asche sein
  rationale: Im Hebräischen fehlt eine Vergleichspartikel. Daher wird die Aussage direkt formuliert und nicht zu einem bloßen Vergleich abgeschwächt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nah am Hebräischen, vermeidet aber unnatürliche Wörtlichkeit. „Zertreten“, „Asche“ und „Fußsohlen“ bewahren die drastische Bildsprache; „ich handle“ erhält die Ellipse des göttlichen Eingreifens.
