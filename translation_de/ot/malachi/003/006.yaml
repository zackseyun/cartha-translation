id: MAL.3.6
reference: Malachi 3:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֛י אֲנִ֥י יְהוָ֖ה לֹ֣א שָׁנִ֑יתִי וְ/אַתֶּ֥ם בְּנֵֽי יַעֲקֹ֖ב לֹ֥א כְלִיתֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/006.yaml
  text: For I[a], Yahweh, do not change; and you, sons of Jacob[b], have not come to an end.
translation:
  language: de
  text: Denn ich, Jahwe, ändere mich nicht; und ihr, Söhne Jakobs[a], seid nicht zugrunde gegangen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Söhne Jakobs“; dies ist eine Bundes- und Herkunftsbezeichnung für Jakobs Nachkommen, also Israel.
    reason: cultural_note
  - marker: b
    text: 'Oder: „seid nicht vernichtet worden“ beziehungsweise „habt kein Ende genommen“. Das hebräische Verb kann bedeuten, zu Ende zu gehen, aufgerieben oder vernichtet zu werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise Erläuterung des vorausgehenden Zusammenhangs ein und gibt diese Funktion im Deutschen natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen direkt wieder; „Jahwe“ ist die im Deutschen übliche Form.
- source_word: לֹא שָׁנִיתִי
  choice: ändere mich nicht
  rationale: Das Perfekt von שנה bezeichnet hier im Zusammenhang die beständige Unveränderlichkeit Jahwes. Das deutsche Präsens bringt die fortdauernde Aussage idiomatisch zum Ausdruck.
- source_word: וְאַתֶּם
  choice: und ihr
  rationale: Bewahrt die einfache hebräische Konjunktion, ohne das im Zusammenhang naheliegende Folgeverhältnis durch „darum“ ausdrücklich festzulegen.
- source_word: בְּנֵי יַעֲקֹב
  choice: Söhne Jakobs
  rationale: Erhält die hebräische Bundes- und Herkunftsbezeichnung in ihrer konkreten Form; gemeint sind Jakobs Nachkommen, also Israel.
- source_word: לֹא כְלִיתֶם
  choice: seid nicht zugrunde gegangen
  rationale: כלה kann das Zu-Ende-Gehen, Aufgeriebenwerden oder Vernichtetwerden bezeichnen. „Zugrunde gegangen“ ist im Gerichtskontext natürlich, ohne die genaue Art des Untergangs festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Seine direkte Wiedergabe bewahrt diese textliche Besonderheit.
- issue: Zeitform und Aussage von לֹא שָׁנִיתִי
  choice: ändere mich nicht
  alternative: habe mich nicht geändert
  rationale: Das Präsens gibt die im Kontext ausgesagte bleibende Beständigkeit Gottes wieder, ohne über den Text hinaus ein philosophisches System der Unveränderlichkeit zu formulieren.
- issue: Verhältnis der beiden Satzhälften
  choice: und ihr
  alternative: darum seid ihr
  rationale: Das Fortbestehen Israels erscheint im Zusammenhang als Folge von Jahwes Beständigkeit; dennoch steht im Hebräischen lediglich die Konjunktion וְ. Die Übersetzung bewahrt diese Offenheit.
- issue: Bedeutung von לֹא כְלִיתֶם
  choice: seid nicht zugrunde gegangen
  alternative: seid nicht vernichtet worden / habt kein Ende genommen
  rationale: Die Form lässt sowohl ein intransitives Zu-Ende-Gehen als auch im Kontext den Gedanken des Verschontbleibens vor Vernichtung anklingen. Die gewählte Fassung wahrt diese Spannung weitgehend.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe am knappen hebräischen Parallelismus; „und“ vermeidet eine überdeutende logische Verknüpfung.
