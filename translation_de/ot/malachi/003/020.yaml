  text: וְ/זָרְחָ֨ה לָ/כֶ֜ם יִרְאֵ֤י שְׁמִ/י֙ שֶׁ֣מֶשׁ צְדָקָ֔ה וּ/מַרְפֵּ֖א בִּ/כְנָפֶ֑י/הָ וִֽ/יצָאתֶ֥ם וּ/פִשְׁתֶּ֖ם כְּ/עֶגְלֵ֥י מַרְבֵּֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/020.yaml
  text: But for you who fear my name[a], the sun of righteousness will rise with healing in its wings[c][b]; and you will go out and leap like calves from the stall.
translation:
  language: de
  text: Doch für euch, die ihr meinen Namen fürchtet, wird die Sonne der Gerechtigkeit[a] aufgehen, mit Heilung in ihren Flügeln[b]. Ihr werdet hinausgehen und springen[c] wie Kälber aus dem Maststall.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Sonne des Rechts“ oder „die Sonne, die Recht schafft“. Das hebräische Wort kann Gerechtigkeit, Recht oder die Wiederherstellung des Rechts bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in ihren Strahlen“. Das hebräische Wort bedeutet wörtlich „Flügel“, kann bildlich aber auch die äußersten Bereiche oder Strahlen der Sonne bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „hüpfen“ oder „umherspringen“. Das hebräische Verb ist selten und bezeichnet möglicherweise eine ausgelassene Bewegung; andere verstehen es als „fett werden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָרְחָה
  choice: wird … aufgehen
  rationale: זרח bezeichnet bei einem Himmelskörper sein Aufgehen oder Hervorstrahlen. „Aufgehen“ bewahrt das Sonnenbild und gibt den hebräischen Verbalsatz im Deutschen natürlich wieder.
- source_word: יִרְאֵי שְׁמִי
  choice: die ihr meinen Namen fürchtet
  rationale: Die partizipiale Wendung bezeichnet die Angesprochenen. Zusammen mit לָכֶם wahrt die direkte Anrede „für euch, die ihr …“ die zweite Person.
- source_word: שֶׁמֶשׁ צְדָקָה
  choice: die Sonne der Gerechtigkeit
  rationale: Die traditionelle und sprachlich naheliegende Wiedergabe erhält das umfassende Bild. צדקה kann auch Gerechtigkeit im Sinn von Rechtsschaffung oder Rechtfertigung bezeichnen; diese Möglichkeit wird in einer Fußnote offengehalten.
- source_word: וּמַרְפֵּא
  choice: mit Heilung
  rationale: מַרְפֵּא bezeichnet Heilung oder ein Heilmittel. „Mit Heilung“ verbindet die nominale Wendung verständlich mit dem Bild der aufgehenden Sonne, ohne eine zusätzliche Handlung einzutragen.
- source_word: בִּכְנָפֶיהָ
  choice: in ihren Flügeln
  rationale: כָּנָף bedeutet wörtlich „Flügel“, kann aber bildlich auch die äußersten Bereiche und damit die Strahlen der Sonne bezeichnen. Das feminine Pronomen entspricht dem grammatischen Geschlecht von „Sonne“ im Hebräischen wie im Deutschen.
- source_word: וִיצָאתֶם
  choice: ihr werdet hinausgehen
  rationale: יצא bedeutet „hinausgehen“ oder „herauskommen“. „Hinausgehen“ passt zum Bild der Kälber, die den Stall verlassen.
- source_word: וּפִשְׁתֶּם
  choice: springen
  rationale: Das seltene Verb ist unsicher. Im Zusammenhang wird es häufig als lebhafte, ausgelassene Bewegung verstanden; „springen“ wahrt das anschauliche Bild, während Alternativen in der Fußnote genannt werden.
- source_word: כְּעֶגְלֵי מַרְבֵּק
  choice: wie Kälber aus dem Maststall
  rationale: מַרְבֵּק bezeichnet einen Stall beziehungsweise einen Ort, an dem Vieh gehalten und gemästet wird. „Aus dem Maststall“ macht im Deutschen das durch ויצאתם angelegte Bild des Herauskommens verständlich.
theological_decisions:
- issue: Messianische Deutung der „Sonne der Gerechtigkeit“
  choice: Das Bild bleibt ohne ausdrückliche Gleichsetzung mit dem Messias stehen.
  alternative: Die Wendung als direkten Titel des Messias beziehungsweise Christi wiedergeben.
  rationale: Die christliche Auslegung hat das Bild oft messianisch verstanden. Der hebräische Vers selbst nennt jedoch keine Person ausdrücklich, sondern verheißt denen, die Gottes Namen fürchten, Heil und Rechtsschaffung. Die Übersetzung bewahrt deshalb die Metapher und lässt ihre christologische Deutung offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede. Das konkrete Sonnen- und Flügelbild bleibt erhalten; seltene oder mehrdeutige Ausdrücke werden nicht im Haupttext aufgelöst, sondern knapp in Fußnoten erläutert.
