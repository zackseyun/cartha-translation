source:
  edition: WLC
  text: הֲ/יִקְבַּ֨ע אָדָ֜ם אֱלֹהִ֗ים כִּ֤י אַתֶּם֙ קֹבְעִ֣ים אֹתִ֔/י וַ/אֲמַרְתֶּ֖ם בַּ/מֶּ֣ה קְבַעֲנ֑וּ/ךָ הַֽ/מַּעֲשֵׂ֖ר וְ/הַ/תְּרוּמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/008.yaml
  text: Will a man rob God? Yet you are robbing me[a]. But you say[b], “How have we robbed you?” In the tithe and the contribution.
translation:
  language: de
  text: 'Kann ein Mensch Gott berauben? Und doch beraubt ihr mich! Ihr aber fragt: »Worin haben wir dich beraubt?« Beim Zehnten und bei der Abgabe.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Opfergabe«. Das hebräische Wort bezeichnet eine für den heiligen Gebrauch ausgesonderte Gabe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקְבַּע / קֹבְעִים / קְבַעֲנוּךָ
  choice: berauben / beraubt / beraubt
  rationale: קבע bezeichnet hier, dass dem Gott Israels vorenthalten wird, was ihm zusteht. „Berauben“ wahrt die zugespitzte Anklage und lässt sich im Deutschen natürlich mit einer Person als Objekt verbinden.
- source_word: אָדָם
  choice: ein Mensch
  rationale: אָדָם ist hier generisch und bezeichnet einen Menschen, nicht ausschließlich einen Mann. „Ein Mensch“ bewahrt die knappe, sprichwortartige rhetorische Frage.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: אֱלֹהִים bezeichnet hier den Gott Israels; „Gott“ ist die klare Standardwiedergabe.
- source_word: כִּי
  choice: Und doch
  rationale: כִּי leitet hier die überraschende, der rhetorischen Frage entgegenstehende Wirklichkeit ein. „Und doch“ bringt diese adversative Zuspitzung im Deutschen idiomatisch zum Ausdruck.
- source_word: בַּמֶּה
  choice: Worin
  rationale: Die Frage zielt im Kontext auf den Bereich, in dem Gott beraubt wird; die Antwort folgt mit בְּ. „Worin“ stellt diesen Zusammenhang prägnant her.
- source_word: הַמַּעֲשֵׂר
  choice: der Zehnte
  rationale: מַעֲשֵׂר bezeichnet die vorgeschriebene Abgabe eines Zehntels. „Der Zehnte“ ist die etablierte und verständliche deutsche Bezeichnung.
- source_word: הַתְּרוּמָה
  choice: die Abgabe
  rationale: תְּרוּמָה bezeichnet eine für den heiligen Gebrauch ausgesonderte Gabe oder Abgabe. „Abgabe“ unterscheidet sie vom Zehnten, ohne eine bestimmte Ritualhandlung in den Text hineinzulesen.
theological_decisions:
- issue: Generische Bedeutung von אָדָם
  choice: ein Mensch
  alternative: ein Mann
  rationale: Der hebräische Singular ist allgemein-menschlich gebraucht. Die Wiedergabe „ein Mensch“ wahrt diesen Umfang ohne männliche Exklusivität.
- issue: Art der תְּרוּמָה
  choice: Abgabe
  alternative: Opfergabe
  rationale: Der Ausdruck kann eine für Gott ausgesonderte Gabe bezeichnen, legt hier aber nicht zwingend eine bestimmte Opferart fest. „Abgabe“ erhält die kultisch-wirtschaftliche Breite; die Alternative wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „berauben“ erhält die rhetorische Schärfe des hebräischen Wortspiels; „Und doch“ macht den Kontrast natürlich hörbar. Die Schlussantwort bleibt entsprechend dem knappen Nominalsatz des Ausgangstextes fragmentarisch.
