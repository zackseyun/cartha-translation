id: MAL.3.4
reference: Malachi 3:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/עָֽרְבָה֙ לַֽ/יהוָ֔ה מִנְחַ֥ת יְהוּדָ֖ה וִ/ירֽוּשָׁלִָ֑ם כִּ/ימֵ֣י עוֹלָ֔ם וּ/כְ/שָׁנִ֖ים קַדְמֹנִיּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/004.yaml
  text: Then the offering of Judah and Jerusalem will be pleasing to Yahweh[b][a], as in the days of old and as in former years.
translation:
  language: de
  text: Dann wird die Opfergabe Judas und Jerusalems Jahwe wohlgefällig sein[a], wie in den Tagen der Vorzeit und wie in früheren Jahren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »annehmbar sein«. Das hier verwendete Wort kann ausdrücken, dass eine Opfergabe angenehm beziehungsweise akzeptabel ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָרְבָה
  choice: Dann wird ... wohlgefällig sein
  rationale: Das Verb ערב bedeutet hier »angenehm, wohlgefällig, annehmbar sein«. Das Futur ergibt sich aus dem prophetischen Zusammenhang; »Dann« gibt das Waw als zeitliche beziehungsweise folgernde Verknüpfung wieder.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Die Präposition ל bezeichnet die Person, der die Opfergabe wohlgefällig ist. Der Gottesname יהוה wird als »Jahwe« wiedergegeben.
- source_word: מִנְחַת
  choice: Opfergabe
  rationale: מִנְחָה kann speziell ein Speiseopfer, aber auch allgemeiner eine Gott dargebrachte Gabe bezeichnen. »Opfergabe« wahrt den kultischen Zusammenhang, ohne die Art der Gabe unnötig festzulegen.
- source_word: יְהוּדָה וִירוּשָׁלִָם
  choice: Juda und Jerusalem
  rationale: Die Ortsnamen werden in ihren im Deutschen etablierten Formen wiedergegeben.
- source_word: כִּימֵי עוֹלָם
  choice: wie in den Tagen der Vorzeit
  rationale: עוֹלָם bezeichnet hier die weit zurückliegende Vergangenheit, nicht metaphysische Ewigkeit. Die Formulierung bewahrt den gehobenen zeitlichen Vergleich.
- source_word: וּכְשָׁנִים קַדְמֹנִיּוֹת
  choice: und wie in früheren Jahren
  rationale: Die Wendung bildet eine poetische Parallele zum vorhergehenden Ausdruck und verweist auf eine frühere Zeit.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. »Jahwe« gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von מִנְחָה
  choice: Opfergabe
  alternative: Speiseopfer; Gabe
  rationale: Der Ausdruck kann im Kult ein Speiseopfer bezeichnen, ist lexikalisch aber weiter. »Opfergabe« erhält den kultischen Sinn und bewahrt die mögliche Unbestimmtheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der poetische Parallelismus der beiden Zeitangaben bleibt erhalten; die kultische Terminologie ist verständlich, ohne den hebräischen Ausdruck auf ein Speiseopfer einzuengen.
