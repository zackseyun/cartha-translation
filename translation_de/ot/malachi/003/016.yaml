id: MAL.3.16
reference: Malachi 3:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אָ֧ז נִדְבְּר֛וּ יִרְאֵ֥י יְהוָ֖ה אִ֣ישׁ אֶת רֵעֵ֑/הוּ וַ/יַּקְשֵׁ֤ב יְהוָה֙ וַ/יִּשְׁמָ֔ע וַ֠/יִּכָּתֵב סֵ֣פֶר זִכָּר֤וֹן לְ/פָנָי/ו֙ לְ/יִרְאֵ֣י יְהוָ֔ה וּ/לְ/חֹשְׁבֵ֖י שְׁמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/016.yaml
  text: Then those who feared Yahweh spoke with one another[a], and Yahweh paid attention and heard[b]; and a book of remembrance was written before him for those who fear Yahweh and who esteem his name.
translation:
  language: de
  text: Damals redeten die, die Jahwe fürchteten, miteinander.[a] Jahwe achtete darauf und hörte es. Und vor ihm wurde ein Gedenkbuch geschrieben für die, die Jahwe fürchten und seinen Namen achten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ein Mann mit seinem Gefährten“. Die hebräische Wendung bezeichnet hier ein gegenseitiges Reden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „an seinen Namen denken“ beziehungsweise „seinen Namen hochachten“. Das hebräische Wort kann bedenkendes Beachten und wertschätzende Achtung ausdrücken.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָז
  choice: Damals
  rationale: Die Zeitangabe knüpft die Reaktion der Gottesfürchtigen an die vorausgehende Situation an; „damals“ ist im Deutschen natürlich und wahrt den erzählerischen Bezug.
- source_word: נִדְבְּרוּ ... אִישׁ אֶת־רֵעֵהוּ
  choice: redeten ... miteinander
  rationale: Der Nifal trägt hier im Zusammenhang reziproke Bedeutung; die wörtliche Wendung „ein Mann mit seinem Gefährten“ wird idiomatisch und ohne unnötige Geschlechtsmarkierung wiedergegeben.
- source_word: יִרְאֵי יְהוָה
  choice: die, die Jahwe fürchteten
  rationale: „Fürchten“ bewahrt das Gewicht von ירא, das ehrfürchtige Scheu und treue Hinwendung einschließt, statt es auf bloße Verehrung abzuschwächen.
- source_word: וַיַּקְשֵׁב ... וַיִּשְׁמָע
  choice: achtete darauf und hörte es
  rationale: Die Wiedergabe hält die hebräische Abfolge von aufmerksamer Zuwendung und Hören fest. Das ergänzte „es“ macht den deutschen Satz verständlich, ohne einen neuen Gegenstand einzuführen.
- source_word: סֵפֶר זִכָּרוֹן
  choice: Gedenkbuch
  rationale: Das zusammengesetzte deutsche Wort bezeichnet knapp und würdig eine schriftliche Aufzeichnung, die der Erinnerung dient.
- source_word: לְפָנָיו
  choice: vor ihm
  rationale: Die räumlich-relationale Formulierung des Hebräischen bleibt erhalten und bezeichnet das Buch als in Gottes Gegenwart befindlich.
- source_word: לְיִרְאֵי יְהוָה
  choice: für die, die Jahwe fürchten
  rationale: Die Präposition ל bezeichnet hier die Personen, auf die sich die Aufzeichnung bezieht oder zu deren Gunsten sie besteht; „für“ lässt diese leichte Offenheit bestehen.
- source_word: וּלְחֹשְׁבֵי שְׁמוֹ
  choice: und seinen Namen achten
  rationale: חשב kann hier bedenkendes Beachten, Wertschätzung oder Hochachtung ausdrücken. „Achten“ ist natürlich und lässt sowohl bewusste Beachtung als auch Wertschätzung anklingen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Bezeichnung der Gottesfürchtigen
  choice: die, die Jahwe fürchteten / fürchten
  alternative: die, die Jahwe verehrten
  rationale: Die Übersetzung behält „fürchten“ bei, weil der Ausdruck ehrfürchtige Scheu und Bundestreue umfasst und nicht stillschweigend auf Verehrung verengt werden soll.
- issue: Bedeutung von וּלְחֹשְׁבֵי שְׁמוֹ
  choice: die ... seinen Namen achten
  alternative: die an seinen Namen denken / seinen Namen hochachten
  rationale: Der hebräische Ausdruck erlaubt sowohl den Gedanken bewusster Beachtung als auch den der Wertschätzung. „Achten“ bewahrt diese Spannung; die Fußnote nennt die wichtigsten Nuancen.
- issue: Funktion des Gedenkbuchs
  choice: ein Gedenkbuch ... für die
  alternative: ein Gedenkbuch ... über die / zugunsten derer
  rationale: Der Vers erklärt nicht vollständig, ob die Aufzeichnung primär diese Menschen betrifft oder ihnen zugutekommt. Das deutsche „für“ wahrt diese Offenheit.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Der Gottesname erscheint als „Jahwe“. Die kurzen Hauptsätze bewahren die hebräische Erzählfolge; genuine Bedeutungsbreiten werden in den Fußnoten offengelegt.
