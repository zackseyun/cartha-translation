  - severity: low
    issue: „Tagelöhner“ ist enger als שָׂכִיר.
    rationale: Das hebräische Wort bezeichnet allgemein einen entlohnten bzw. gedungenen Arbeiter und verlangt keine tägliche Entlohnung.
  - severity: low
    issue: Die Fußnote ist als Hinweis auf eine wörtliche Formulierung unpräzise.
    rationale: Der Haupttext lautet bereits „Jahwe der Heerscharen“. Die Anmerkung sollte stattdessen die mögliche Bedeutungsweite und die traditionelle Wiedergabe benennen.
