source:
  edition: WLC
  text: וְ/קָרַבְתִּ֣י אֲלֵי/כֶם֮ לַ/מִּשְׁפָּט֒ וְ/הָיִ֣יתִי עֵ֣ד מְמַהֵ֗ר בַּֽ/מְכַשְּׁפִים֙ וּ/בַ/מְנָ֣אֲפִ֔ים וּ/בַ/נִּשְׁבָּעִ֖ים לַ/שָּׁ֑קֶר וּ/בְ/עֹשְׁקֵ֣י שְׂכַר שָׂ֠כִיר אַלְמָנָ֨ה וְ/יָת֤וֹם וּ/מַטֵּי גֵר֙ וְ/לֹ֣א יְרֵא֔וּ/נִי אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/005.yaml
  text: Then I will come near to you for judgment[a], and I will be a swift witness against sorcerers, against adulterers, against those who swear falsely, against those who oppress the wage of a hired worker, the widow, and the fatherless, and those who turn aside the sojourner, and do not fear me[c][b], says Yahweh of Armies.
translation:
  language: de
  text: Dann werde ich zu euch kommen, um Gericht zu halten, und ich werde ein rascher Zeuge sein gegen die Zauberer, gegen die Ehebrecher, gegen die, die falsch schwören, gegen die, die den Lohn eines Arbeiters, die Witwe und die Waise bedrücken, gegen die, die den Fremden abweisen, und gegen die, die mich nicht fürchten, spricht Jahwe der Heerscharen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der Titel kann sich auf Jahwes Heere oder auf alle ihm unterstehenden Mächte beziehen. Traditionelle Wiedergabe: „der HERR Zebaoth“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְקָרַבְתִּי אֲלֵיכֶם לַמִּשְׁפָּט
  choice: Dann werde ich zu euch kommen, um Gericht zu halten
  rationale: Die futurische Fortführung der prophetischen Rede wird natürlich mit „Dann werde ich“ wiedergegeben. „Zu euch“ wahrt die Richtung von אֲלֵיכֶם, ohne vorschnell „gegen euch“ zu setzen; die Zweckangabe gibt den forensischen Sinn von לַמִּשְׁפָּט wieder.
- source_word: וְהָיִיתִי עֵד מְמַהֵר
  choice: und ich werde ein schneller Zeuge sein
  rationale: Die nominale Aussage und das Bild des göttlichen Zeugen bleiben erhalten. „Schnell“ kann sowohl unverzügliches Zeugnis als auch rasch eintretendes Gericht anklingen lassen.
- source_word: בַּמְכַשְּׁפִים
  choice: gegen die Zauberer
  rationale: Das Partizip bezeichnet Menschen, die Zauberei betreiben. „Zauberer“ ist knapp, verständlich und weniger enggeführt als „Hexer“.
- source_word: וּבַמְנָאֲפִים
  choice: gegen die Ehebrecher
  rationale: Direkte und natürliche Wiedergabe des substantivisch gebrauchten Partizips.
- source_word: וּבַנִּשְׁבָּעִים לַשָּׁקֶר
  choice: gegen die, die falsch schwören
  rationale: Die Formulierung erfasst falsche Eide allgemein und beschränkt die Aussage nicht auf Meineid vor Gericht.
- source_word: וּבְעֹשְׁקֵי שְׂכַר שָׂכִיר אַלְמָנָה וְיָתוֹם
  choice: gegen die, die den Lohn des Tagelöhners, die Witwe und die Waise bedrücken
  rationale: 'Die koordinierte hebräische Konstruktion wird bewusst bewahrt: Das Verb des Bedrückens bezieht sich auf den Lohn sowie auf Witwe und Waise. „Tagelöhner“ bezeichnet hier verständlich einen abhängig Beschäftigten; „Waise“ ist im heutigen Deutsch natürlicher als „Vaterloser“.'
- source_word: וּמַטֵּי גֵר
  choice: gegen die, die den Fremden abweisen
  rationale: „Abweisen“ hält das Bild des Abdrängens oder Beiseiteschiebens fest, ohne das im Hebräischen nicht ausdrücklich vorhandene Wort „Recht“ einzufügen. „Fremder“ bezeichnet hier einen Nicht-Einheimischen, der unter Israel lebt.
- source_word: וְלֹא יְרֵאוּנִי
  choice: und mich nicht fürchten
  rationale: „Fürchten“ bewahrt sowohl den Ernst als auch die religiöse Dimension des Verbs; „verehren“ würde dessen Bedeutungsgewicht abschwächen.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben. „Heerscharen“ ist im Deutschen eine eingebürgerte, würdige Wiedergabe des pluralischen צְבָאוֹת und vermeidet die unnatürliche Form „Jahwe der Armeen“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als Name erkennbar wiedergegeben, statt durch einen Titel ersetzt zu werden.
- issue: Bedeutung von צְבָאוֹת im Gottestitel
  choice: der Heerscharen
  alternative: der himmlischen Heere
  rationale: „Heerscharen“ lässt den Umfang des Ausdrucks offen und bewahrt die traditionelle, zugleich semantisch passende Sprache. Die Alternative wäre erklärender, würde den Bezug jedoch auf himmlische Heere festlegen.
- issue: Reichweite der abschließenden Aussage „und mich nicht fürchten“
  choice: als gemeinsames Kennzeichen der zuvor genannten Tätergruppen formuliert
  alternative: nur auf diejenigen beziehen, die den Fremden abweisen
  rationale: Die hebräische Reihung erlaubt syntaktisch einen engen Anschluss, doch inhaltlich fungiert die fehlende Gottesfurcht plausibel als zusammenfassende Charakterisierung. Die deutsche Formulierung bewahrt den Anschluss innerhalb derselben Aufzählung, ohne eine ausdrückliche universale Quantifizierung einzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer forensischer Sprache. Die lange Aufzählung des Hebräischen bleibt als ein Satz erhalten, wird aber durch wiederholtes „gegen“ gegliedert. Der einzige Fußnotenmarker [a] steht unmittelbar nach dem erklärungsbedürftigen Gottestitel.
