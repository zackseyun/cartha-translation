  verdict: revise
  source_fidelity: Die Grundstruktur und die einzelnen Tätergruppen folgen dem Hebräischen weitgehend genau. Eine sichere Korrektur ist jedoch nötig, weil „und mich nicht fürchten“ im Entwurf unmittelbar an „die den Fremden abweisen“ angeschlossen wird und dadurch nur diese letzte Gruppe kennzeichnet. Die hebräische Reihung stellt die Gottesfurcht als weitere, durch das vorangehende „gegen“ mitregierte Tätergruppe dar. Außerdem ist שָׂכִיר ein angestellter bzw. gedungener Arbeiter, nicht spezifisch ein Tagelöhner.
  naturalness: Die Satzperiode ist für modernes, würdiges Standarddeutsch gut verständlich. „Rascher Zeuge“ ist in diesem forensisch-prophetischen Register etwas idiomatischer als „schneller Zeuge“. „Arbeiter“ vermeidet die unnötige Spezifizierung von „Tagelöhner“.
  terminology: „Jahwe der Heerscharen“, „Zauberer“, „Ehebrecher“, „falsch schwören“ und „Waise“ sind angemessen. Die Fußnote soll nicht behaupten, der bereits im Text identische Titel stehe dort „wörtlich“, sondern die Bedeutung und die traditionelle Titelwiedergabe erklären.
