revisions:
- from: Dann werde ich zu euch kommen, um Gericht zu halten, und ich werde ein schneller Zeuge sein gegen die Zauberer, gegen die Ehebrecher, gegen die, die falsch schwören, gegen die, die den Lohn des Tagelöhners, die Witwe und die Waise bedrücken, und gegen die, die den Fremden abweisen und mich nicht fürchten, spricht Jahwe der Heerscharen.[a]
  to: Dann werde ich zu euch kommen, um Gericht zu halten, und ich werde ein rascher Zeuge sein gegen die Zauberer, gegen die Ehebrecher, gegen die, die falsch schwören, gegen die, die den Lohn eines Arbeiters, die Witwe und die Waise bedrücken, gegen die, die den Fremden abweisen, und gegen die, die mich nicht fürchten, spricht Jahwe der Heerscharen.[a]
  rationale: Die Überarbeitung stellt die letzte Gruppe („die mich nicht fürchten“) als selbständiges Glied der Aufzählung heraus, ohne zu entscheiden, ob die fehlende Gottesfurcht zugleich die gesamte Liste charakterisiert. „Arbeiter“ gibt שָׂכִיר ohne die zusätzliche zeitliche Spezifizierung von „Tagelöhner“ wieder. Die Fußnote wurde inhaltlich präzisiert; ihr Anker bleibt am Gottestitel.
