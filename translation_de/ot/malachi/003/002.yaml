source:
  edition: WLC
  text: וּ/מִ֤י מְכַלְכֵּל֙ אֶת י֣וֹם בּוֹא֔/וֹ וּ/מִ֥י הָ/עֹמֵ֖ד בְּ/הֵרָֽאוֹת֑/וֹ כִּֽי הוּא֙ כְּ/אֵ֣שׁ מְצָרֵ֔ף וּ/כְ/בֹרִ֖ית מְכַבְּסִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/002.yaml
  text: But who can endure the day of his coming[a], and who can stand when he appears? For he is like a refiner’s fire and like launderers’ soap.
translation:
  language: de
  text: Doch wer kann den Tag seines Kommens ertragen, und wer kann bestehen, wenn er erscheint? Denn er ist wie das Feuer eines Schmelzers und wie die Waschlauge der Wäscher.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet ein starkes alkalisches Reinigungsmittel, das zum Waschen von Stoffen verwendet wurde; traditionell auch „Seife der Tuchwäscher“.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְכַלְכֵּל
  choice: kann … ertragen
  rationale: Das Verb bezeichnet hier die Fähigkeit, unter dem erschreckenden Kommen auszuhalten. „Ertragen“ ist im heutigen Deutsch natürlich und bewahrt die rhetorische Zuspitzung.
- source_word: יוֹם בּוֹאוֹ
  choice: den Tag seines Kommens
  rationale: Die substantivische Fügung hält sich eng an die hebräische Konstruktion und bewahrt den gewichtigen prophetischen Klang.
- source_word: הָעֹמֵד
  choice: kann bestehen
  rationale: Im Parallelismus zur ersten Frage geht es darum, beim Erscheinen der kommenden Gestalt standhalten zu können. „Bestehen“ gibt diesen Sinn idiomatisch wieder.
- source_word: בְּהֵרָאוֹתוֹ
  choice: wenn er erscheint
  rationale: Der Infinitiv im Niphal wird als temporale Aussage wiedergegeben. „Erscheint“ vermittelt natürlich, dass er sichtbar hervortritt, ohne die Form unnötig wörtlich als „gesehen wird“ abzubilden.
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion leitet die Begründung für die beiden rhetorischen Fragen ein.
- source_word: כְּאֵשׁ מְצָרֵף
  choice: wie das Feuer des Läuterers
  rationale: Die Formulierung bewahrt sowohl den Vergleich als auch die Person, die Metall durch Feuer reinigt. „Läuterer“ ist würdevoll und im Bildzusammenhang verständlich.
- source_word: וּכְבֹרִית מְכַבְּסִים
  choice: und wie die Waschlauge der Wäscher
  rationale: בֹרִית bezeichnet ein kräftiges alkalisches Reinigungsmittel. „Waschlauge“ ist sachlich genauer als gewöhnliche Seife; „der Wäscher“ bildet den hebräischen Plural des Berufs- beziehungsweise Tätigkeitswortes ab.
theological_decisions:
- issue: Wirkung der kommenden Gestalt
  choice: Die Bilder von Läuterungsfeuer und Waschlauge werden als scharfe Reinigungsbilder unverändert nebeneinandergestellt.
  alternative: Die Bilder ausschließlich als vernichtendes Gericht oder ausschließlich als geistliche Heiligung auszulegen.
  rationale: Der Vers verbindet bedrohliche Intensität mit Reinigung. Die Übersetzung wahrt diese theologische Spannung und legt die Wirkung nicht auf nur eine dogmatische Deutung fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen rhetorischen Fragen und die beiden Reinigungsbilder bleiben formal deutlich. Der Fußnotenmarker steht bei dem Ausdruck, auf den sich die lexikalische Erläuterung tatsächlich bezieht.
