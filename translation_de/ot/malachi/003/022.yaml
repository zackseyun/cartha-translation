source:
  edition: WLC
  text: זִכְר֕וּ תּוֹרַ֖ת מֹשֶׁ֣ה עַבְדִּ֑/י אֲשֶׁר֩ צִוִּ֨יתִי אוֹת֤/וֹ בְ/חֹרֵב֙ עַל כָּל יִשְׂרָאֵ֔ל חֻקִּ֖ים וּ/מִשְׁפָּטִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/022.yaml
  text: Remember the law of Moses my servant[c][b][a], which I commanded him at Horeb for all Israel—statutes and judgments.
translation:
  language: de
  text: 'Denkt an das Gesetz[a] des Mose, meines Dieners, das ich ihm am Horeb[b] für ganz Israel geboten habe: Satzungen und Rechtsbestimmungen.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Weisung des Mose, meines Dieners“.'
    reason: lexical_alternative
  - marker: b
    text: „Horeb“ ist eine andere Bezeichnung für den Sinai, den Berg, an dem Gott Israel durch Mose das Bundesgesetz gab.
    reason: cultural_note
  - marker: c
    text: 'Auch: „Ordnungen und Rechtsbestimmungen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זִכְרוּ
  choice: Denkt an
  rationale: Der Pluralimperativ von זכר fordert die Angeredeten zu aktivem, handlungswirksamem Erinnern auf. „Denkt an“ ist im heutigen Deutsch natürlich und bewahrt den auffordernden Charakter.
- source_word: תּוֹרַת מֹשֶׁה
  choice: das Gesetz … Mose
  rationale: תּוֹרָה kann allgemein „Weisung“ bedeuten; die Verbindung mit Mose, Horeb und den nachfolgenden Rechtsbegriffen bezeichnet hier jedoch die mosaische Bundesordnung. „Gesetz“ gibt diesen Kontext prägnant wieder, während die weitere Bedeutung in Fußnote [a] erhalten bleibt.
- source_word: עַבְדִּי
  choice: meines Dieners
  rationale: Bei Mose ist עֶבֶד eine ehrende Bezeichnung für den von Gott beauftragten Diener; „Sklave“ würde hier einen nicht hervorgehobenen sozialen Aspekt in den Vordergrund rücken.
- source_word: אֲשֶׁר צִוִּיתִי אוֹתוֹ
  choice: das ich ihm … geboten habe
  rationale: Der Relativsatz bezieht sich auf das Gesetz; „ihm“ bezeichnet Mose als Empfänger und Mittler des göttlichen Gebots. Die Formulierung bleibt nah am ausdrücklichen Verb צוה.
- source_word: בְחֹרֵב
  choice: am Horeb
  rationale: Die Präposition ist hier örtlich zu verstehen. „Am Horeb“ ist die natürliche deutsche Ortsangabe für das Berggebiet.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: für ganz Israel
  rationale: עַל bezeichnet hier den Geltungsbereich beziehungsweise die Bezogenheit des Gebots auf das gesamte Volk.
- source_word: חֻקִּים
  choice: Ordnungen
  rationale: Der Ausdruck bezeichnet festgesetzte, verbindliche Regelungen des Bundes. „Ordnungen“ ist verständlich und wahrt den rechtlichen Gehalt.
- source_word: וּמִשְׁפָּטִים
  choice: und Rechtsbestimmungen
  rationale: מִשְׁפָּטִים bezeichnet in diesem Zusammenhang rechtliche Regelungen oder Urteile. „Rechtsbestimmungen“ bewahrt die juristische Nuance und unterscheidet den Begriff von חֻקִּים.
theological_decisions:
- issue: Bedeutungsumfang von תּוֹרָה im Bundeskontext
  choice: Gesetz
  alternative: Weisung
  rationale: Mose, Horeb und die abschließenden Rechtsbegriffe legen hier die konkrete mosaische Bundesordnung nahe. Die Übersetzung „Gesetz“ verengt den Begriff daher nicht willkürlich; die allgemeinere mögliche Bedeutung wird in Fußnote [a] offengelegt.
- issue: Statusbezeichnung עֶבֶד für Mose
  choice: Diener
  alternative: Sklave
  rationale: Der Ausdruck kennzeichnet Mose hier ehrenvoll als Gottes beauftragten Repräsentanten. Eine Wiedergabe mit „Sklave“ würde eine soziale und eigentumsrechtliche Dimension betonen, die der Kontext nicht fokussiert.
- issue: Bezug der Schlusswendung חֻקִּים וּמִשְׁפָּטִים
  choice: Apposition zum gebotenen Gesetz, durch Doppelpunkt angeschlossen
  alternative: 'Unverbundene Fortsetzung: „Ordnungen und Rechtsbestimmungen“'
  rationale: Die beiden Substantive erläutern den Inhalt beziehungsweise die Gestalt des Gesetzes. Der Doppelpunkt macht diesen syntaktisch knappen Bezug verständlich, ohne zusätzliche Aussage einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Plural „Denkt“ spricht die Gemeinschaft direkt an. Traditionell verständliche Bundes- und Rechtssprache wird beibehalten, ohne unnötig altertümliche Wendungen zu verwenden; die Bedeutungsbreite zentraler hebräischer Begriffe wird in den Fußnoten dokumentiert.
