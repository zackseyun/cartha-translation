- from: „Sie werden mir gehören“, spricht Jahwe der Heerscharen[a], „an dem Tag, den ich herbeiführe, als mein kostbarer Besitz[b]. Ich werde sie verschonen, wie ein Mann seinen Sohn verschont, der ihm dient.“
  to: 'Jahwe der Heerscharen spricht: „Sie werden mir gehören am Tag, an dem ich sie zu meinem besonderen Besitz mache. Ich werde sie verschonen, wie ein Mann seinen Sohn verschont, der ihm dient.“'
  rationale: Die Revision stellt die im Hebräischen implizite, aber vom Kontext eindeutig verlangte Ergänzung „sie“ bei „ich mache“ her und bindet die Besitzbezeichnung korrekt als Zielprädikativ an. Sie bewahrt die Zukunftsaussage, den göttlichen Namen, die Wiederholung von „verschonen“ und die ausdrücklich männliche Vater-Sohn-Metapher. Die Fußnoten bleiben auf echte lexikalische Alternativen beschränkt.
