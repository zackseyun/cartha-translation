  text: וְ/הָ֣יוּ לִ֗/י אָמַר֙ יְהוָ֣ה צְבָא֔וֹת לַ/יּ֕וֹם אֲשֶׁ֥ר אֲנִ֖י עֹשֶׂ֣ה סְגֻלָּ֑ה וְ/חָמַלְתִּ֣י עֲלֵי/הֶ֔ם כַּֽ/אֲשֶׁר֙ יַחְמֹ֣ל אִ֔ישׁ עַל בְּנ֖/וֹ הָ/עֹבֵ֥ד אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/017.yaml
  text: And they will be mine[a], says Yahweh of Armies, on the day when I make them a treasured possession[c][b], and I will spare them as a man spares his son who serves him.
translation:
  language: de
  text: 'Jahwe der Heerscharen spricht: „Sie werden mir gehören am Tag, an dem ich sie zu meinem besonderen Besitz mache. Ich werde sie verschonen, wie ein Mann seinen Sohn verschont, der ihm dient.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיוּ לִי
  choice: Sie werden mir gehören
  rationale: Gibt das künftige Zugehören natürlich wieder und bewahrt den Beziehungs- und Bundesklang der hebräischen Wendung.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; „Heerscharen“ bewahrt die militärische und kosmische Weite von צְבָאוֹת und ist im Deutschen verständlich.
- source_word: לַיּוֹם אֲשֶׁר אֲנִי עֹשֶׂה
  choice: an dem Tag, den ich herbeiführe
  rationale: Die wörtlich schwierige Verbindung „der Tag, den ich mache“ bezeichnet den von Gott bestimmten und bewirkten Tag; „herbeiführe“ ist idiomatisches Deutsch, ohne Gottes aktives Handeln abzuschwächen.
- source_word: סְגֻלָּה
  choice: als mein kostbarer Besitz
  rationale: סְגֻלָּה bezeichnet einen besonders geschätzten, einem Herrscher gehörenden Besitz. „Mein“ ergibt sich aus „sie werden mir gehören“, ist im Einzelwort selbst aber nur kontextuell enthalten und wird deshalb in einer Fußnote erläutert.
- source_word: וְחָמַלְתִּי עֲלֵיהֶם
  choice: Ich werde sie verschonen
  rationale: חמל kann Mitleid oder Erbarmen bezeichnen, meint hier angesichts des kommenden Gerichtstags besonders das Verschonen.
- source_word: כַּאֲשֶׁר יַחְמֹל אִישׁ עַל בְּנוֹ
  choice: wie ein Mann seinen Sohn verschont
  rationale: Die Wiederholung desselben Verbs חמל wird durch „verschont“ sichtbar gehalten; die ausdrücklich männliche Vater-Sohn-Bildsprache bleibt erhalten.
- source_word: הָעֹבֵד אֹתוֹ
  choice: der ihm dient
  rationale: „Dient“ gibt עבד in der persönlichen Beziehung zwischen Sohn und Vater treffender wieder als das wirtschaftlich enger klingende „für ihn arbeitet“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Bundesnamen ausdrücklich. „Jahwe“ macht den Eigennamen sichtbar, während die traditionelle Wiedergabe „der HERR“ als Alternative vermerkt wird.
- issue: Bedeutungsumfang von חמל
  choice: verschonen
  alternative: sich erbarmen über
  rationale: Im Zusammenhang mit dem von Gott herbeigeführten Tag steht das Bewahren vor Gericht im Vordergrund. Die alternative Bedeutung „Erbarmen haben“ bleibt lexikalisch möglich.
- issue: Bezug und Besitzanzeige bei סְגֻלָּה
  choice: als mein kostbarer Besitz
  alternative: als einen kostbaren Besitz
  rationale: Die Aussage „sie werden mir gehören“ legt den possessiven Bezug nahe. Da סְגֻלָּה selbst ohne ausdrückliches Possessivsuffix steht, wird die formal nähere Alternative in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede wird zur besseren Lesbarkeit mit deutschen Anführungszeichen gegliedert. „Heerscharen“ wahrt den biblischen Registerton, während „herbeiführe“ die im Deutschen unnatürliche wörtliche Formulierung „den Tag machen“ idiomatisch ausdrückt.
