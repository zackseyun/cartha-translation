  variant: modern standard German
source:
  edition: WLC
  text: וְ/שַׁבְתֶּם֙ וּ/רְאִיתֶ֔ם בֵּ֥ין צַדִּ֖יק לְ/רָשָׁ֑ע בֵּ֚ין עֹבֵ֣ד אֱלֹהִ֔ים לַ/אֲשֶׁ֖ר לֹ֥א עֲבָדֽ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/018.yaml
  text: Then you will again see the difference between the righteous and the wicked[a], between one who serves God and one who does not serve him.
translation:
  language: de
  text: Dann werdet ihr wieder den Unterschied sehen zwischen dem Gerechten und dem Gottlosen,[a] zwischen dem, der Gott dient, und dem, der ihm nicht dient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Dann werdet ihr zurückkehren und sehen zwischen dem Gerechten und dem Gottlosen.“ Die hebräische Wendung meint wahrscheinlich, dass sie den Unterschied erneut erkennen werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְתֶּם
  choice: Dann werdet ihr wieder
  rationale: שׁוב bedeutet wörtlich „zurückkehren/umkehren“. In Verbindung mit „sehen“ bezeichnet es hier wahrscheinlich ein erneutes Wahrnehmen. „wieder“ gibt diesen idiomatischen Sinn in natürlichem Deutsch wieder.
- source_word: וּרְאִיתֶם
  choice: sehen
  rationale: ראה bedeutet gewöhnlich „sehen“ und schließt hier das Erkennen der offenbar werdenden Unterscheidung ein, ohne den konkreten Ausdruck zu verlieren.
- source_word: בֵּין ... לְ
  choice: den Unterschied sehen zwischen
  rationale: Die wiederholte Gegenüberstellung mit בֵּין bezeichnet den Kontrast. Die deutsche Wendung macht den im Hebräischen vorausgesetzten Unterschied natürlich und verständlich deutlich.
- source_word: צַדִּיק
  choice: dem Gerechten
  rationale: צַדִּיק bezeichnet einen gerechten Menschen. Der substantivierte Singular bewahrt die im Hebräischen paarweise formulierte moralisch-theologische Kategorie.
- source_word: רָשָׁע
  choice: dem Gottlosen
  rationale: רָשָׁע ist der übliche Gegenbegriff zu צַדִּיק und bezeichnet einen schuldigen, frevelhaften oder bösen Menschen. „Gottloser“ ist in diesem prophetisch-theologischen Gegensatz prägnant und im deutschen Bibelregister etabliert.
- source_word: עֹבֵד אֱלֹהִים
  choice: dem, der Gott dient
  rationale: עבד mit Gott als Objekt umfasst Dienst, Gehorsam und verehrende Zugehörigkeit. „Gott dient“ bewahrt diese Breite und verengt den Ausdruck nicht auf kultische Anbetung.
- source_word: לַאֲשֶׁר לֹא עֲבָדוֹ
  choice: dem, der ihm nicht dient
  rationale: Die Relativkonstruktion bildet den direkten Gegenpol zum Dienenden; das Suffix verweist auf Gott. Das deutsche Präsens gibt den Gegensatz zwischen zwei Menschengruppen treffend wieder, obwohl die hebräische Verbform auch wörtlicher als „ihm nicht gedient hat“ verstanden werden kann.
theological_decisions:
- issue: Ob der Gegensatz ausdrücklich auf das Endgericht bezogen werden soll
  choice: Die zukünftige Erkenntnis des Unterschieds wird wiedergegeben, ohne ausdrücklich vom Endgericht zu sprechen.
  alternative: Den Vers mit einem Zusatz wie „beim Gericht“ ausdrücklich eschatologisch deuten.
  rationale: Der Zusammenhang handelt von Gottes kommendem Eingreifen und seiner Rechtfertigung der Treuen; der Vers selbst sagt jedoch nur, dass die Angesprochenen den Unterschied wieder sehen werden. Zusätzliche Gerichtssprache würde die theologische Spannung vorschnell auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die paarweise Struktur des Hebräischen bleibt erhalten. „Gottloser“ entspricht dem prophetisch-biblischen Register; die Fußnote bewahrt die wörtliche und möglicherweise mehrdeutige Form von וְשַׁבְתֶּם.
