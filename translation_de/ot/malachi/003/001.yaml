  variant: modern standard German
source:
  edition: WLC
  text: הִנְ/נִ֤י שֹׁלֵחַ֙ מַלְאָכִ֔/י וּ/פִנָּה דֶ֖רֶךְ לְ/פָנָ֑/י וּ/פִתְאֹם֩ יָב֨וֹא אֶל הֵיכָל֜/וֹ הָ/אָד֣וֹן אֲשֶׁר אַתֶּ֣ם מְבַקְשִׁ֗ים וּ/מַלְאַ֨ךְ הַ/בְּרִ֜ית אֲשֶׁר אַתֶּ֤ם חֲפֵצִים֙ הִנֵּה בָ֔א אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/001.yaml
  text: Behold[a], I am sending my messenger, and he will clear the way before me. And suddenly the Lord whom you seek will come to his temple, and the messenger of the covenant in whom you delight—behold, he is coming[b], says Yahweh of Armies.
translation:
  language: de
  text: Siehe, ich sende meinen Boten[a], und er wird den Weg vor mir freimachen. Und plötzlich wird der Herr, den ihr sucht, zu seinem Tempel kommen, und der Bote des Bundes, an dem ihr Gefallen habt, wird kommen. Siehe, er kommt, spricht Jahwe der Heerscharen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meinen Engel“. Das hebräische Wort מַלְאָךְ kann „Bote“ oder „Engel“ bedeuten; ebenso bei „Bote des Bundes“.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionell: „der HERR der Heerscharen“; auch: „der HERR Zebaoth“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי שֹׁלֵחַ
  choice: Siehe, ich sende
  rationale: Die deiktische Partikel mit dem Partizip kündigt das Handeln nachdrücklich und als unmittelbar beziehungsweise gewiss an. „Siehe“ bewahrt den prophetischen Ton.
- source_word: מַלְאָכִי
  choice: meinen Boten
  rationale: מַלְאָךְ kann einen menschlichen oder himmlischen Boten bezeichnen. „Bote“ hält den Sinn hier bewusst offen; „Engel“ bleibt als Fußnotenalternative erhalten.
- source_word: וּפִנָּה דֶרֶךְ לְפָנָי
  choice: und er wird den Weg vor mir freimachen
  rationale: Das Verb bezeichnet hier das Bereiten eines Weges durch das Beseitigen von Hindernissen. Die erste Person „vor mir“ bleibt erhalten, weil Jahwe spricht.
- source_word: וּפִתְאֹם
  choice: Dann wird plötzlich
  rationale: „Plötzlich“ gibt die abrupte, unerwartete Ankunft wieder; „dann“ stellt im Deutschen einen natürlichen Anschluss her.
- source_word: יָבֹוא אֶל הֵיכָלוֹ
  choice: zu seinem Tempel kommen
  rationale: הֵיכָל kann Palast oder Tempel bedeuten; der kultische Zusammenhang in Maleachi verlangt hier „Tempel“.
- source_word: הָאָדוֹן
  choice: der Herr
  rationale: Der bestimmte Titel wird mit „der Herr“ würdig und kontextgerecht wiedergegeben, ohne die Identität der Gestalt näher auszulegen.
- source_word: אֲשֶׁר אַתֶּם מְבַקְשִׁים
  choice: den ihr sucht
  rationale: Die knappe Relativkonstruktion gibt die fortdauernde Suche in natürlichem Deutsch wieder.
- source_word: וּמַלְאַךְ הַבְּרִית
  choice: und der Bote des Bundes
  rationale: Die bestimmte Wendung wird direkt wiedergegeben. „Bote“ bewahrt dieselbe lexikalische Offenheit wie beim ersten Vorkommen von מַלְאָךְ.
- source_word: אֲשֶׁר אַתֶּם חֲפֵצִים
  choice: an dem ihr Gefallen habt
  rationale: חפץ bezeichnet Gefallen, Freude oder Verlangen. Die Formulierung ist im Deutschen natürlich und bewahrt den persönlichen Bezug.
- source_word: הִנֵּה בָא
  choice: Siehe, er kommt
  rationale: Die Partikel mit der Ankunftsaussage vermittelt lebendige Unmittelbarkeit und Gewissheit.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; צְבָאוֹת erscheint in der traditionellen, würdigen Form „Heerscharen“, ohne die Bezugsgröße näher festzulegen.
theological_decisions:
- issue: Verhältnis zwischen „dem Herrn“ und „dem Boten des Bundes“
  choice: Beide Titel werden nebeneinandergestellt, ohne ihre Träger ausdrücklich gleichzusetzen oder voneinander zu unterscheiden.
  alternative: Beide Bezeichnungen ausdrücklich auf dieselbe Gestalt beziehen oder den Boten ausdrücklich vom Herrn unterscheiden.
  rationale: Die hebräische Satzfügung erlaubt eine enge Identifikation, erzwingt aber keine übersetzerische Auflösung. Die Formulierung bewahrt diese theologische Spannung.
- issue: Deutung von הָאָדוֹן in einem häufig messianisch gelesenen Vers
  choice: der Herr
  alternative: der Gebieter / der Herrscher
  rationale: „Der Herr“ erhält den erhabenen Titelcharakter, ohne eine über den hebräischen Text hinausgehende christologische Identifikation einzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst prophetischem „Siehe“. Der Satzbau folgt dem Hebräischen eng, bleibt jedoch gut lesbar. Die Wiederholung von „Bote“ wahrt die lexikalische Verbindung beider מַלְאָךְ-Vorkommen; die mögliche Identität des Herrn und des Bundesboten wird nicht entschieden.
