  to: Siehe, ich sende meinen Boten[a], und er wird den Weg vor mir freimachen. Und plötzlich wird der Herr, den ihr sucht, zu seinem Tempel kommen, und der Bote des Bundes, an dem ihr Gefallen habt, wird kommen. Siehe, er kommt, spricht Jahwe der Heerscharen.[b]
