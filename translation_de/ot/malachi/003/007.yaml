source:
  edition: WLC
  text: לְ/מִ/ימֵ֨י אֲבֹתֵי/כֶ֜ם סַרְתֶּ֤ם מֵֽ/חֻקַּ/י֙ וְ/לֹ֣א שְׁמַרְתֶּ֔ם שׁ֤וּבוּ אֵלַ/י֙ וְ/אָשׁ֣וּבָה אֲלֵי/כֶ֔ם אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת וַ/אֲמַרְתֶּ֖ם בַּ/מֶּ֥ה נָשֽׁוּב׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/007.yaml
  text: From the days of your fathers you have turned aside from my statutes and have not kept them. Return to me[a], and I will return to you, says Yahweh of hosts. But you say, “How shall we return?”
translation:
  language: de
  text: 'Seit den Tagen eurer Väter[a] seid ihr von meinen Satzungen abgewichen und habt sie nicht gehalten. Kehrt zu mir zurück, und ich werde zu euch zurückkehren, spricht Jahwe der Heerscharen. Doch ihr sagt: »Wie sollen wir zurückkehren?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eurer Vorfahren«. Wörtlich steht im Hebräischen »eurer Väter«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמִימֵי אֲבֹתֵיכֶם
  choice: Seit den Tagen eurer Väter
  rationale: לְמִימֵי bezeichnet hier den zeitlichen Ausgangspunkt eines bis in die Gegenwart reichenden Verhaltens. „Seit den Tagen“ gibt dies im Deutschen natürlich wieder; „Väter“ bewahrt die konkrete Form des Hebräischen.
- source_word: סַרְתֶּם מֵחֻקַּי
  choice: seid ihr von meinen Satzungen abgewichen
  rationale: סור beschreibt das Abweichen von einem Weg oder einer verbindlichen Norm. „Abgewichen“ erhält dieses Bild; „Satzungen“ ist eine präzise, verständliche Wiedergabe von חֻקִּים im Bundes- und Rechtskontext.
- source_word: וְלֹא שְׁמַרְתֶּם
  choice: und habt sie nicht gehalten
  rationale: שׁמר bedeutet im Zusammenhang von Geboten und Satzungen „halten“ oder „befolgen“. Das Pronomen „sie“ nimmt die unmittelbar zuvor genannten Satzungen auf.
- source_word: שׁוּבוּ אֵלַי וְאָשׁוּבָה אֲלֵיכֶם
  choice: Kehrt zu mir zurück, dann werde ich zu euch zurückkehren
  rationale: Die zweimalige Verwendung von שׁוב wird durch die Wiederholung von „zurückkehren“ hörbar gemacht. „Dann“ drückt die im Zusammenhang liegende Folge idiomatisch aus, ohne eine darüber hinausgehende Bedingung einzutragen.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben. „Heerscharen“ bewahrt die militärische beziehungsweise himmlische Bildwelt von צְבָאוֹת.
- source_word: בַּמֶּה נָשׁוּב
  choice: Wie sollen wir zurückkehren?
  rationale: בַּמֶּה fragt hier nach Art oder Weise; „Wie“ ist im modernen Deutschen die natürliche Entsprechung. Die Form נָשׁוּב wird als fragende, zukunftsbezogene Aussage mit „sollen wir“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Wechselseitige Formulierung der Umkehr
  choice: „Kehrt zu mir zurück, dann werde ich zu euch zurückkehren“
  alternative: „Bekehrt euch zu mir, dann wende ich mich euch wieder zu“
  rationale: Die gewählte Fassung bewahrt die lexikalische Wiederholung von שׁוב und damit die Spannung der wechselseitigen Aussage, ohne die erste Verwendung ausschließlich als innere Bekehrung und die zweite ausschließlich als Zuwendung auszulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt knapp und prophetisch; die Wiederholung von „zurückkehren“ erhält die Rhetorik des hebräischen Textes. Der Fußnotenmarker steht unmittelbar bei dem Ausdruck, auf den sich die Anmerkung bezieht.
