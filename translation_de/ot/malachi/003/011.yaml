- from: Und ich werde für euch den Fresser[a] abwehren, damit er euch die Frucht des Bodens nicht vernichtet; auch wird euch der Weinstock auf dem Feld seine Frucht nicht vorzeitig verlieren[b], spricht Jahwe der Heerscharen.[c]
  to: Und ich werde den Fresser um euretwillen zurechtweisen, damit er euch die Frucht des Erdbodens nicht vernichtet und der Weinstock auf dem Feld für euch seine Frucht nicht abwirft[a], spricht Jahwe der Heerscharen.[b]
  rationale: Die Revision stellt bei גָּעַר die Sprechhandlung wieder her und behält zugleich die offene Bezeichnung „Fresser“ bei. Für den Weinstock wird eine im modernen Deutsch natürliche Agrarformulierung gewählt; die auffällige hebräische Metapher bleibt transparent in der Fußnote dokumentiert. Die Aussagen über den Gottesnamen und den Titel bleiben ohne konfessionelle Einengung erhalten.
