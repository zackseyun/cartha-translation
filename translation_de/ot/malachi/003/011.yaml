source:
  edition: WLC
  text: וְ/גָעַרְתִּ֤י לָ/כֶם֙ בָּֽ/אֹכֵ֔ל וְ/לֹֽא יַשְׁחִ֥ת לָ/כֶ֖ם אֶת פְּרִ֣י הָ/אֲדָמָ֑ה וְ/לֹא תְשַׁכֵּ֨ל לָ/כֶ֤ם הַ/גֶּ֨פֶן֙ בַּ/שָּׂדֶ֔ה אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/011.yaml
  text: And I will rebuke the devourer for you[a], so that it will not destroy for you the fruit of the ground, and the vine in the field will not fail to bear for you[b], says Yahweh of Armies.
translation:
  language: de
  text: Und ich werde den Fresser um euretwillen zurechtweisen, damit er euch die Frucht des Erdbodens nicht vernichtet und der Weinstock auf dem Feld für euch seine Frucht nicht abwirft[a], spricht Jahwe der Heerscharen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb verwendet vom Weinstock das Bild einer Fehlgeburt beziehungsweise des Verlusts der Frucht.
    reason: lexical_alternative
  - marker: b
    text: 'Traditionell: „der HERR der Heerscharen“; oder: „Jahwe der Armeen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגָעַרְתִּי
  choice: Und ich werde … abwehren
  rationale: גּער bezeichnet ein machtvolles Schelten oder Bedrohen, das hier die schädigende Kraft wirksam zurückhält. „Abwehren“ gibt im Deutschen die beabsichtigte Wirkung natürlich wieder; die konkrete Redehandlung bleibt in der Fußnote sichtbar.
- source_word: בָּאֹכֵל
  choice: den Fresser
  rationale: Das substantivierte Partizip bezeichnet das, was die Ernte verzehrt, ohne die Ursache auf Heuschrecken, andere Schädlinge oder eine Krankheit festzulegen. „Fresser“ bewahrt diese Offenheit.
- source_word: יַשְׁחִת
  choice: vernichtet
  rationale: Die Hifilform von שׁחת bezeichnet hier das Zugrunderichten landwirtschaftlichen Ertrags. „Vernichten“ gibt die Stärke des Verbs wieder.
- source_word: פְּרִי הָאֲדָמָה
  choice: die Frucht des Bodens
  rationale: Die konkrete hebräische Wendung bleibt erhalten und wird nicht vorschnell auf eine bestimmte Art von Ernte eingeengt.
- source_word: תְשַׁכֵּל
  choice: seine Frucht nicht vorzeitig verlieren
  rationale: שׁכל gebraucht für den Weinstock das Bild des Verlusts von Nachwuchs beziehungsweise Frucht. Die Formulierung macht den landwirtschaftlichen Sinn verständlich, ohne das Bild ganz zu einer bloßen Aussage über Ertrag zu verflachen.
- source_word: הַגֶּפֶן בַּשָּׂדֶה
  choice: der Weinstock auf dem Feld
  rationale: Die bestimmte Singularform und der konkrete landwirtschaftliche Ort werden direkt wiedergegeben.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: „Jahwe“ gibt den Gottesnamen als Namen wieder. „Heerscharen“ bewahrt die Breite des Titels und ist im Deutschen idiomatischer als „Armeen“; die transparentere Alternative wird angemerkt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen. „Jahwe“ wahrt seinen Charakter als Bundesname, während „der HERR“ die traditionelle Ersatzlesung darstellt.
- issue: Bedeutung von צְבָאוֹת im Gottestitel
  choice: der Heerscharen
  alternative: der Armeen
  rationale: „Heerscharen“ lässt offen, ob irdische oder himmlische Mächte im Vordergrund stehen. „Der Armeen“ ist sprachlich unmittelbarer, kann den Titel jedoch militärisch verengen.
- issue: Bildsprache von תְשַׁכֵּל beim Weinstock
  choice: seine Frucht nicht vorzeitig verlieren
  alternative: nicht fehlgebären
  rationale: Das hebräische Verb überträgt die Vorstellung von Fehlgeburt beziehungsweise Kinderverlust auf den Weinstock. Die Hauptfassung vermittelt den Sinn in natürlichem Deutsch; die Fußnote erhält die auffällige Metapher.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz folgt der hebräischen Abfolge, vermeidet aber unnatürliche Wiederholungen von לָכֶם. Die ungewöhnliche Geburtsmetapher des Weinstocks wird in der Hauptfassung verständlich vermittelt und in der Fußnote formal bewahrt.
