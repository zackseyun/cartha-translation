source:
  edition: WLC
  text: אֲמַרְתֶּ֕ם שָׁ֖וְא עֲבֹ֣ד אֱלֹהִ֑ים וּ/מַה בֶּ֗צַע כִּ֤י שָׁמַ֨רְנוּ֙ מִשְׁמַרְתּ֔/וֹ וְ/כִ֤י הָלַ֨כְנוּ֙ קְדֹ֣רַנִּ֔ית מִ/פְּנֵ֖י יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/014.yaml
  text: You have said[a], ‘It is vain to serve God[d][c][b]. And what profit is it that we have kept his charge and that we have walked in mourning before Yahweh of hosts?’
translation:
  language: de
  text: 'Ihr habt gesagt: »Es ist vergeblich, Gott zu dienen. Was bringt es uns, dass wir seinen Auftrag befolgt haben und in Trauer[a] vor Jahwe, dem Herrn der Heerscharen, einhergegangen sind?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „düster einhergegangen“ oder „in Schwarz gegangen“; gemeint ist wahrscheinlich ein trauerndes oder bußfertiges Auftreten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁוְא
  choice: vergeblich
  rationale: Das Wort bezeichnet Leere, Nichtigkeit oder Vergeblichkeit. „Es ist vergeblich“ gibt die wertende Klage natürlich und präzise wieder.
- source_word: עֲבֹד
  choice: zu dienen
  rationale: עבד bezeichnet hier umfassend den Dienst für Gott und nicht nur kultische Anbetung.
- source_word: בֶּצַע
  choice: Was bringt es uns
  rationale: בֶּצַע meint Gewinn oder Vorteil. Die idiomatische Frage bewahrt den auf Nutzen gerichteten, beinahe geschäftsmäßigen Unterton der Klage.
- source_word: מִשְׁמַרְתּוֹ
  choice: seinen Auftrag befolgt
  rationale: מִשְׁמֶרֶת bezeichnet eine anvertraute Pflicht oder verbindliche Anordnung. „Seinen Auftrag befolgt“ ist im heutigen Deutsch verständlich und erhält den Verpflichtungscharakter.
- source_word: קְדֹרַנִּית
  choice: in Trauer ... einhergegangen
  rationale: Das Adverb vermittelt Dunkelheit bzw. düstere, mit Trauer oder Buße verbundene Haltung und möglicherweise entsprechende Kleidung. Die Formulierung wahrt den bildhaften Charakter.
- source_word: מִפְּנֵי
  choice: vor
  rationale: Die Präposition bezeichnet hier das Verhalten vor bzw. in der Gegenwart Jahwes und wird nicht kausal als „wegen“ aufgelöst.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe, der Herr der Heerscharen
  rationale: „Jahwe“ gibt den Gottesnamen wieder; „Herr der Heerscharen“ formuliert den festen Titel im Deutschen würdig und bewahrt dessen himmlisch-militärische Bildwelt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung der Klage über den Gottesdienst
  choice: Zynische Klage, dass Dienst, Gehorsam und Trauerverhalten keinen Nutzen gebracht hätten
  alternative: Ausschließlich auf rituelle Trauer bezogene Klage
  rationale: Die Syntax verbindet den Dienst für Gott, das Befolgen seines Auftrags und das trauernde Einhergehen als Formen religiöser Treue. Die Übersetzung wahrt diese Verbindung, ohne die Aussage theologisch zu bestätigen.
- issue: Deutung von קְדֹרַנִּית
  choice: in Trauer einhergehen
  alternative: düster einhergehen / in Schwarz gehen
  rationale: Der Ausdruck kann Stimmung, äußeres Auftreten oder Trauerkleidung bezeichnen. Der Haupttext nennt den wahrscheinlichen Trauerbezug; die Fußnote erhält die konkrete und allgemeinere Alternative.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede klingt als scharfe, nutzenorientierte Klage. „Heerscharen“ bewahrt die traditionelle Bildwelt, während Satzbau und übriger Wortschatz allgemein verständlich bleiben.
