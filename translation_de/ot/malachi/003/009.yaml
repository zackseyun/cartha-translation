  text: בַּ/מְּאֵרָה֙ אַתֶּ֣ם נֵֽאָרִ֔ים וְ/אֹתִ֖/י אַתֶּ֣ם קֹבְעִ֑ים הַ/גּ֖וֹי כֻּלּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/009.yaml
  text: You are cursed with a curse[a], for you are robbing me—the whole nation of you.
translation:
  language: de
  text: Mit einem Fluch seid ihr verflucht[a], denn ihr beraubt mich – ihr, das ganze Volk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Unter einem Fluch steht ihr, und ihr beraubt mich – ihr alle, das ganze Volk.«'
    reason: 'Lexikalische und syntaktische Alternative: בַּמְּאֵרָה kann zustandsbezogen als »unter einem Fluch« verstanden werden; ו kann neutral mit »und« wiedergegeben werden.'
lexical_decisions:
- source_word: בַּמְּאֵרָה
  choice: mit einem Fluch
  rationale: Das Substantiv מְאֵרָה bedeutet »Fluch«. Die Präposition ב wird instrumental bzw. zustandsbezogen verstanden. Die Formulierung bewahrt die nachdrückliche hebräische Verbindung mit dem folgenden Passivpartizip.
- source_word: נֵאָרִים
  choice: seid ihr verflucht
  rationale: Das Passivpartizip von ארר bezeichnet den gegenwärtigen, aus einer Verfluchung hervorgegangenen Zustand des Volkes. Das deutsche Perfektpassiv gibt diesen resultativen Sinn natürlich wieder.
- source_word: וְאֹתִי
  choice: und doch beraubt ihr mich
  rationale: 'ו kann schlicht »und« bedeuten; im Zusammenhang ist auch ein adversativer Unterton möglich: Trotz des Fluches beraubt das Volk Gott weiterhin. Das betonte אֹתִי wird ausdrücklich mit »mich« wiedergegeben.'
- source_word: קֹבְעִים
  choice: beraubt
  rationale: קבע bedeutet hier »berauben« bzw. »betrügen« und bezieht sich im unmittelbaren Zusammenhang auf vorenthaltene Zehnten und Abgaben. »Berauben« gibt die deutliche Anklage prägnant wieder.
- source_word: הַגּוֹי כֻּלּוֹ
  choice: ihr, das ganze Volk
  rationale: Wörtlich steht »das ganze Volk, es ganz«. Die appositionelle Wiedergabe bewahrt sowohl die direkte Anrede im Plural als auch den korporativen Umfang der Anklage.
theological_decisions:
- issue: Korporativer Umfang des Gerichts
  choice: 'Die Anklage gilt dem ganzen Volk als Gemeinschaft: Es steht unter dem Fluch und beraubt Gott.'
  alternative: Die Schlusswendung kann vor allem als verstärkende Apposition im Sinn von »ihr alle« verstanden werden, ohne den nationalen Aspekt besonders hervorzuheben.
  rationale: הַגּוֹי כֻּלּוֹ bezeichnet das Volk kollektiv. Die Übersetzung wahrt zugleich die nationale Gemeinschaft und die unmittelbare Anrede, ohne spätere theologische Kategorien einzutragen.
- issue: Verhältnis der beiden Satzhälften
  choice: '»und doch« gibt den möglichen adversativen Sinn von ו wieder: Obwohl das Volk bereits verflucht ist, beraubt es Gott weiterhin.'
  alternative: Das ו kann neutral mit »und« oder im Zusammenhang kausal mit »denn« verstanden werden.
  rationale: Die knappe hebräische Verknüpfung lässt das genaue logische Verhältnis offen. Die Hauptfassung folgt dem adversativen Zusammenhang; die Fußnote bewahrt die neutralere Möglichkeit.
translation_notes:
  register: Moderne, würdige Standardsprache. Die ungewöhnlich nachdrückliche Wiederholung »Mit einem Fluch … verflucht« bewahrt die hebräische Rhetorik; der Gedankenstrich hebt die abschließende Ausweitung auf das ganze Volk hervor.
