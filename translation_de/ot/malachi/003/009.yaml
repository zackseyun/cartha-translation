- from: Mit einem Fluch seid ihr verflucht[a], und doch beraubt ihr mich – ihr, das ganze Volk.
  to: Mit einem Fluch seid ihr verflucht[a], denn ihr beraubt mich – ihr, das ganze Volk.
  rationale: Die Hauptfassung ersetzt das interpretativ adversative „und doch“ durch „denn“, das den kontextuell naheliegenden begründenden Zusammenhang wiedergibt und der englischen POB-Auditspur folgt. Die Fußnote bewahrt ausdrücklich die neutrale syntaktische Möglichkeit, sodass die Offenheit der Konjunktion nicht verdeckt wird. Im Übrigen sind keine sicheren Änderungen erforderlich.
