    issue: „und doch“ als Hauptlesart
    rationale: Die Konjunktion ו ist semantisch offen. Zwar ist ein adversativer Beiklang denkbar, doch die Satzfolge erklärt im Kontext am wahrscheinlichsten den Fluch mit dem fortgesetzten Berauben. „Und doch“ macht eine mögliche Nuance zur ausdrücklich behaupteten Satzlogik; „denn“ entspricht zudem der englischen POB-Auditentscheidung. Die neutrale Alternative bleibt in der Fußnote erhalten.
