id: MAL.3.23
reference: Malachi 3:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הִנֵּ֤ה אָֽנֹכִי֙ שֹׁלֵ֣חַ לָ/כֶ֔ם אֵ֖ת אֵלִיָּ֣ה הַ/נָּבִ֑יא לִ/פְנֵ֗י בּ֚וֹא י֣וֹם יְהוָ֔ה הַ/גָּד֖וֹל וְ/הַ/נּוֹרָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/023.yaml
  text: Look[b][a], I am sending Elijah the prophet to you before the coming of the great and fearful day of Yahweh.
translation:
  language: de
  text: Seht, ich sende euch den Propheten Elia[a], bevor der große und furchtbare Tag Jahwes kommt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Elia“ kann wörtlich verstanden werden oder als Bezeichnung eines Vorläufers nach der Art Elias; der hebräische Text selbst sagt schlicht „Elia, den Propheten“.
    reason: cross_reference
  - marker: b
    text: 'Oder: „der große und schreckliche Tag Jahwes“; das hebräische Wort kann etwas bezeichnen, das Furcht, Schrecken oder Ehrfurcht hervorruft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Seht
  rationale: Leitet eine nachdrückliche Ankündigung ein. Das pluralische „Seht“ passt zu „euch“ und bewahrt die hinweisende Kraft in heutigem Deutsch.
- source_word: אָנֹכִי
  choice: ich
  rationale: Das selbstständige Pronomen setzt Nachdruck. Im Deutschen vermittelt „ich“ in dieser Ankündigungsform die Betonung natürlich, ohne mit „ich selbst“ zu überzeichnen.
- source_word: שֹׁלֵחַ
  choice: sende
  rationale: Das Partizip stellt das Handeln unmittelbar und prophetisch gewiss dar. Das Präsens „sende“ erhält diese Wirkung und kann im Deutschen zugleich bevorstehendes Handeln ausdrücken.
- source_word: לָכֶם
  choice: euch
  rationale: Der Dativ bezeichnet die Empfänger, zu denen Elia gesandt wird.
- source_word: אֵלִיָּה הַנָּבִיא
  choice: den Propheten Elia
  rationale: Die natürliche deutsche Wortstellung gibt sowohl den Eigennamen als auch den bestimmten Titel wieder, ohne die Identität Elias näher auszulegen.
- source_word: לִפְנֵי בּוֹא
  choice: bevor … kommt
  rationale: Die finite deutsche Konstruktion gibt die zeitliche Bedeutung des hebräischen Ausdrucks klar und idiomatisch wieder.
- source_word: יוֹם יְהוָה
  choice: Tag Jahwes
  rationale: Bewahrt die feste prophetische Wendung und gibt den Gottesnamen als „Jahwe“ wieder.
- source_word: הַגָּדוֹל
  choice: große
  rationale: Gibt Größe, Tragweite und Bedeutung des Tages direkt wieder.
- source_word: וְהַנּוֹרָא
  choice: und furchtbare
  rationale: Das Wort bezeichnet etwas, das Furcht oder Scheu hervorruft. „Furchtbar“ bewahrt im Gerichtskontext die bedrohliche Kraft, ohne die mögliche Nuance ehrfurchtgebietender Majestät auszuschließen.
theological_decisions:
- issue: Worauf sich „Elia“ bezieht
  choice: Der Name „Elia“ bleibt ohne deutende Ergänzung im Haupttext stehen.
  alternative: Ein Vorläufer nach der Art Elias oder in Elias Geist und Kraft
  rationale: Der hebräische Text nennt ausdrücklich „Elia, den Propheten“. Ob dies wörtlich oder typologisch zu verstehen ist, wird nicht im Übersetzungstext entschieden.
- issue: Charakter des Tages Jahwes
  choice: „der große und furchtbare Tag Jahwes“
  alternative: „der große und schreckliche Tag Jahwes“ oder „der große und ehrfurchtgebietende Tag Jahwes“
  rationale: Die Formulierung hält Größe und Schrecken zusammen. Sie schwächt den Gerichtston nicht ab, legt das Wort aber auch nicht ausschließlich auf Entsetzen fest.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Das einleitende „Seht“ ist eindringlich, ohne altertümlich zu wirken; die Satzstellung bleibt flüssig und klar.
