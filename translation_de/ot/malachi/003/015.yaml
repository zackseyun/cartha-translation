source:
  edition: WLC
  text: וְ/עַתָּ֕ה אֲנַ֖חְנוּ מְאַשְּׁרִ֣ים זֵדִ֑ים גַּם נִבְנוּ֙ עֹשֵׂ֣י רִשְׁעָ֔ה גַּ֧ם בָּחֲנ֛וּ אֱלֹהִ֖ים וַ/יִּמָּלֵֽטוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/015.yaml
  text: So now we call the arrogant blessed[a]; evildoers are even built up[c][b]; they even test God and escape.’
translation:
  language: de
  text: Und jetzt preisen wir die Überheblichen glücklich[a]. Die Übeltäter kommen sogar zu Wohlstand[b]; sie stellen sogar Gott auf die Probe[c] und kommen davon.«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Stolzen«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »werden gebaut«; gemeint sein kann, dass sie gefestigt werden oder zu Wohlstand kommen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »sie prüfen Gott«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl den Anschluss an die vorausgehende Klage als auch den Übergang zur gegenwärtigen Schlussfolgerung der Sprecher.
- source_word: מְאַשְּׁרִים
  choice: nennen wir ... glücklich
  rationale: 'Gibt den deklarativen Sinn von אשר wieder: Jemand wird als glücklich bzw. begünstigt bezeichnet.'
- source_word: זֵדִים
  choice: die Überheblichen
  rationale: Bezeichnet hochmütige, vermessene Menschen; „überheblich“ ist im heutigen Deutsch verständlich und trägt die moralische Wertung des Kontextes.
- source_word: גַּם
  choice: sogar
  rationale: Bringt in beiden Vorkommen die steigernde, empörte Aussage zur Geltung.
- source_word: נִבְנוּ
  choice: werden ... aufgebaut
  rationale: Bewahrt das Passiv und das Bild von בנה („bauen“), das hier metaphorisch auf Festigung oder Gedeihen bezogen ist.
- source_word: עֹשֵׂי רִשְׁעָה
  choice: die Übeltäter
  rationale: Knappe und idiomatische Wiedergabe der partizipialen Wendung für Menschen, die Unrecht bzw. Böses tun.
- source_word: בָּחֲנוּ אֱלֹהִים
  choice: sie stellen ... Gott auf die Probe
  rationale: Gibt בחן als herausforderndes Erproben Gottes wieder, ohne über die Aussage des hebräischen Textes hinauszugehen.
- source_word: וַיִּמָּלֵטוּ
  choice: und kommen davon
  rationale: Drückt im Kontext natürlich aus, dass sie entkommen und offenbar ungestraft bleiben; das Ergebnis wird nicht näher bestimmt.
theological_decisions:
- issue: Wiedergabe von אֱלֹהִים als Bezeichnung für Israels Gott
  choice: Gott
  alternative: ein Gott / Götter
  rationale: Der Kontext bezeichnet eindeutig Israels Gott; אֱלֹהִים fungiert hier als gewöhnliche Gottesbezeichnung und nicht als Eigenname.
- issue: Art der Herausforderung Gottes in בָּחֲנוּ אֱלֹהִים
  choice: Gott auf die Probe stellen
  alternative: Gott prüfen
  rationale: Die Formulierung bewahrt den Sinn eines vermessenen Erprobens, ohne eine bestimmte dogmatische Deutung darüber einzutragen, worin die Probe bestand.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die auffällige Baumetapher des Hebräischen bleibt im Haupttext sichtbar und wird in der Fußnote erläutert. Das schließende Anführungszeichen setzt die in den vorausgehenden Versen begonnene Rede fort.
