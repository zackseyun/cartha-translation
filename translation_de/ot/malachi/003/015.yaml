revisions:
- from: Und nun nennen wir die Überheblichen glücklich[a]. Die Übeltäter werden sogar aufgebaut[b]; sie stellen sogar Gott auf die Probe[c] und kommen davon.«
  to: Und jetzt preisen wir die Überheblichen glücklich[a]. Die Übeltäter kommen sogar zu Wohlstand[b]; sie stellen sogar Gott auf die Probe[c] und kommen davon.«
  rationale: Die Revision ersetzt die im Deutschen missverständliche Formulierung »werden ... aufgebaut« durch eine natürliche kontextuelle Wiedergabe der hebräischen Bau-Metapher und hält deren wörtliche Form in der Fußnote fest. Zudem wird die wertende Sprechhandlung mit »glücklich preisen« präziser und idiomatischer ausgedrückt. Die beiden emphatischen Vorkommen von גַּם, die Gottesbezeichnung und das offene »davonkommen« bleiben erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:06:43Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Abfolge und den Sinn des hebräischen Textes insgesamt zutreffend wieder: die Sprecher erklären die Überheblichen für glücklich, beobachten das Wohlergehen der Übeltäter und beklagen, dass Menschen Gott herausfordern und dennoch entkommen. »Die Übeltäter werden sogar aufgebaut« ist jedoch im modernen Deutschen keine natürliche und hinreichend klare Wiedergabe der metaphorischen Passivform נִבְנוּ; sie kann fälschlich einen konkreten Aufbau durch eine handelnde Instanz nahelegen. Die Fußnote kann die wörtliche Baumetapher bewahren.'
  naturalness: »Und jetzt« und »glücklich preisen« sind modernes, würdiges Standarddeutsch und bilden den folgernden Charakter von וְעַתָּה sowie den deklarativen Sinn von מְאַשְּׁרִים idiomatisch ab. »kommen sogar zu Wohlstand« vermittelt die kontextuelle Metapher natürlich. »Gott auf die Probe stellen und davonkommen« ist ebenfalls idiomatisch und wahrt die Aussage, ohne ausdrücklich von Strafe zu sprechen.
  terminology: »Überhebliche«, »Übeltäter« und »Gott« sind angemessen. »glücklich preisen« ist für אשר treffender als »glücklich nennen«, da es die wertende öffentliche Zuschreibung deutlicher ausdrückt. Die Alternative »die Stolzen« bleibt als lexikalische Fußnote sinnvoll. Die Fußnote zu נִבְנוּ erläutert die wörtliche Form, ohne die metaphorische Haupttextwiedergabe als einzige Deutung auszugeben.
