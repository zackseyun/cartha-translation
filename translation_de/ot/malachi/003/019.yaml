  to: Denn siehe, der Tag kommt, brennend wie ein Ofen. Alle Überheblichen und alle, die Unrecht tun, werden zu Stoppeln werden. Der kommende Tag wird sie in Brand setzen, spricht Jahwe der Heerscharen, und wird ihnen weder Wurzel noch Zweig übrig lassen.
