  terminology: „Jahwe der Heerscharen“ ist eine angemessene und transparente Wiedergabe von יְהוָה צְבָאוֹת. „Stoppeln“, „Wurzel“ und „Zweig“ erhalten die konkreten agrarischen Bilder. Die vorhandene Fußnote ist entbehrlich, da sie lediglich die bereits im Text stehende Formulierung als „wörtlich“ wiederholt und keine echte Alternative oder notwendige Erklärung bietet.
