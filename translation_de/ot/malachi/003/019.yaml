source:
  edition: WLC
  text: כִּֽי הִנֵּ֤ה הַ/יּוֹם֙ בָּ֔א בֹּעֵ֖ר כַּ/תַּנּ֑וּר וְ/הָי֨וּ כָל זֵדִ֜ים וְ/כָל עֹשֵׂ֤ה רִשְׁעָה֙ קַ֔שׁ וְ/לִהַ֨ט אֹתָ֜/ם הַ/יּ֣וֹם הַ/בָּ֗א אָמַר֙ יְהוָ֣ה צְבָא֔וֹת אֲשֶׁ֛ר לֹא יַעֲזֹ֥ב לָ/הֶ֖ם שֹׁ֥רֶשׁ וְ/עָנָֽף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/019.yaml
  text: For behold[a], the day is coming, burning like an oven, when all the arrogant and every evildoer will be stubble. The coming day will set them ablaze, says Yahweh of Armies[c][b], so that it will leave them neither root nor branch.
translation:
  language: de
  text: Denn siehe, der Tag kommt, brennend wie ein Ofen. Alle Überheblichen und alle, die Unrecht tun, werden zu Stoppeln werden. Der kommende Tag wird sie in Brand setzen, spricht Jahwe der Heerscharen, und wird ihnen weder Wurzel noch Zweig übrig lassen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: Denn seht
  rationale: כִּי führt die Begründung zum vorherigen Zusammenhang ein; הִנֵּה lenkt mit prophetischer Eindringlichkeit die Aufmerksamkeit auf das Kommende. „Denn seht“ ist würdig und zugleich gegenwärtig verständlich.
- source_word: הַיּוֹם בָּא
  choice: Der Tag kommt
  rationale: Die knappe deutsche Gegenwartsform bewahrt die Unmittelbarkeit und das Herannahen des angekündigten Tages.
- source_word: בֹּעֵר כַּתַּנּוּר
  choice: brennend wie ein Ofen
  rationale: תַּנּוּר bezeichnet primär einen Ofen. Die partizipiale Form wird als Beschreibung des kommenden Tages beibehalten.
- source_word: זֵדִים
  choice: die Überheblichen
  rationale: Das Wort bezeichnet vermessene, hochmütige Menschen. „Überheblich“ gibt die sittliche Haltung in modernem Deutsch klar wieder.
- source_word: כָל עֹשֵׂה רִשְׁעָה
  choice: jeder, der Unrecht tut
  rationale: Die substantivierte Partizipialkonstruktion wird distributiv und handlungsbezogen wiedergegeben, ohne sie auf eine feste Personenkategorie zu verengen.
- source_word: קַשׁ
  choice: Stoppeln
  rationale: Gemeint sind trockene Erntereste, die leicht verbrennen. „Stoppeln“ wahrt das landwirtschaftliche Feuerbild genauer als „Spreu“.
- source_word: וְלִהַט אֹתָם
  choice: wird sie in Brand setzen
  rationale: Das Verb bezeichnet das Entflammen oder Versengen. Die Übersetzung bewahrt die Bildfolge, bevor der nächste Satzteil die vollständige Vernichtung ausdrückt.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben. „Heerscharen“ bewahrt die Weite des Titels, der himmlische wie militärische Mächte umfassen kann, ohne ihn auf moderne Armeen zu verengen.
- source_word: אֲשֶׁר לֹא יַעֲזֹב לָהֶם
  choice: sodass er ihnen … übrig lässt
  rationale: אֲשֶׁר kann hier die Folge des entflammenden Tages einführen. Das Subjekt „er“ bezieht sich natürlich auf „der kommende Tag“.
- source_word: שֹׁרֶשׁ וְעָנָף
  choice: weder Wurzel noch Zweig
  rationale: Die Paarformel bezeichnet umfassende Vernichtung vom Ursprung bis zum sichtbaren Auswuchs; das konkrete Pflanzenbild bleibt erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen direkt. „Jahwe“ macht den Bundesnamen sichtbar, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von צְבָאוֹת
  choice: der Heerscharen
  alternative: der Heere
  rationale: „Heerscharen“ lässt offen, ob irdische, himmlische oder kosmische Mächte im Vordergrund stehen, und bewahrt so die Breite des hebräischen Titels.
- issue: Stufenfolge des Gerichtsbildes
  choice: „in Brand setzen“ und danach „weder Wurzel noch Zweig übrig lässt“
  alternative: „vollständig verbrennen/vernichten“
  rationale: Die zweistufige Bildsprache des Ausgangstextes wird nicht zu einer erklärenden Zusammenfassung verdichtet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischer Eindringlichkeit. Die Bildsprache bleibt konkret; altertümliche Formen wie „siehe“ werden zugunsten des verständlichen „seht“ vermieden. Der Fußnotenmarker [a] steht unmittelbar beim erklärten Gottesnamen-Titel.
