id: MAL.3.24
reference: Malachi 3:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הֵשִׁ֤יב לֵב אָבוֹת֙ עַל בָּנִ֔ים וְ/לֵ֥ב בָּנִ֖ים עַל אֲבוֹתָ֑/ם פֶּן אָב֕וֹא וְ/הִכֵּיתִ֥י אֶת הָ/אָ֖רֶץ חֵֽרֶם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/024.yaml
  text: And he will turn the hearts of fathers to their children[a], and the hearts of children to their fathers, lest I come and strike the land with a ban of destruction.
translation:
  language: de
  text: Und er wird das Herz der Väter den Kindern zuwenden und das Herz der Kinder ihren Vätern, sonst komme ich und schlage das Land mit dem Vernichtungsbann[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit völliger Vernichtung“; traditionell: „mit einem Fluch“. Das hebräische Wort bezeichnet etwas, das unter Bann gestellt und der Vernichtung geweiht ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵשִׁיב
  choice: Und er wird … zuwenden
  rationale: Der Hifil von שוב bezeichnet hier eine Umkehr beziehungsweise Neuausrichtung. „Zuwenden“ gibt die relationale Bewegung des Herzens im heutigen Deutsch natürlich wieder, ohne ihren Vorgang näher festzulegen.
- source_word: לֵב
  choice: das Herz
  rationale: Das hebräische Singularwort steht jeweils kollektiv und bezeichnet den inneren Menschen einschließlich Wollen und Empfinden. Der Singular bleibt im Deutschen in der Wendung verständlich und wahrt die Form des Ausgangstextes.
- source_word: אָבוֹת
  choice: der Väter
  rationale: Das Wort bezeichnet hier „Väter“. Die Gegenüberstellung mit den Kindern legt die Beziehung zwischen den Generationen näher als die allgemeinere Wiedergabe „Vorfahren“.
- source_word: עַל
  choice: den Kindern / ihren Vätern
  rationale: Die Präposition bezeichnet in dieser Wendung die relationale Ausrichtung. Der deutsche Dativ bei „zuwenden“ gibt diese Bedeutung idiomatisch wieder.
- source_word: בָּנִים
  choice: Kinder
  rationale: Obwohl die Form auch „Söhne“ bedeuten kann, kann sie Nachkommen beziehungsweise Kinder beiderlei Geschlechts einschließen. In der parallelen Gegenüberstellung der Generationen ist „Kinder“ sachgerecht.
- source_word: אֲבוֹתָם
  choice: ihren Vätern
  rationale: Das Suffix der dritten Person Plural wird mit „ihren“ wiedergegeben; „Väter“ bewahrt die unmittelbare Beziehung der beiden Generationen.
- source_word: פֶּן
  choice: sonst
  rationale: פֶּן leitet die angedrohte unerwünschte Folge ein. „Sonst“ ist im modernen Deutsch klarer und natürlicher als eine Konstruktion mit „damit nicht“, bewahrt aber den warnenden Ernst.
- source_word: אָבוֹא
  choice: komme ich
  rationale: Die erste Person des Verbs בוא wird unmittelbar wiedergegeben und lässt den Sprecherwechsel zu Gott unverändert stehen.
- source_word: וְהִכֵּיתִי
  choice: und schlage
  rationale: „Schlagen“ entspricht dem kausativen Verb in diesem Gerichtswort und bewahrt das Bild des hebräischen Textes, ohne auf das altertümliche „schmettern“ oder eine erklärende Umschreibung auszuweichen.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: אֶרֶץ kann „Land“ oder „Erde“ bedeuten. Im bundesbezogenen Gerichtskontext Maleachis liegt „das Land“ näher, ohne das Urteil unnötig kosmisch auszuweiten.
- source_word: חֵרֶם
  choice: mit dem Vernichtungsbann
  rationale: חֵרֶם bezeichnet etwas, das unter Bann gestellt und der Vernichtung geweiht ist. „Vernichtungsbann“ erhält sowohl den Bannbegriff als auch seine tödliche Tragweite; das traditionelle „Fluch“ wäre begrifflich weniger genau.
theological_decisions:
- issue: Wiedergabe von חֵרֶם am Schluss des Buches
  choice: mit dem Vernichtungsbann
  alternative: mit völliger Vernichtung; mit einem Fluch; mit dem Bann
  rationale: Das hebräische Wort ist nicht die gewöhnliche Bezeichnung für einen Fluch, sondern benennt den Bann, durch den etwas im göttlichen Gericht der Vernichtung geweiht wird. Die gewählte Fassung bewahrt das besondere theologische und rechtliche Gewicht des Begriffs, ohne es auf einen bloßen Fluch zu verengen.
- issue: Beziehung zwischen Vätern und Kindern
  choice: unmittelbare generationenübergreifende Zuwendung
  alternative: Väter als Vorfahren und Kinder als spätere Nachkommen
  rationale: Beide Deutungsweiten sind sprachlich möglich. Die Übersetzung „Väter“ und „Kinder“ bewahrt den Wortlaut und lässt sowohl familiäre Versöhnung als auch eine weiter reichende Wiederherstellung zwischen Generationen zu, statt die Aussage auf eine einzige Auslegung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt knapp und prophetisch. „Sonst“ vermeidet eine missverständliche Zweckkonstruktion, während „Vernichtungsbann“ den besonderen hebräischen Gerichtsbegriff transparent macht.
