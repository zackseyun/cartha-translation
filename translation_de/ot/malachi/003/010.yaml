source:
  edition: WLC
  text: הָבִ֨יאוּ אֶת כָּל הַֽ/מַּעֲשֵׂ֜ר אֶל בֵּ֣ית הָ/אוֹצָ֗ר וִ/יהִ֥י טֶ֨רֶף֙ בְּ/בֵיתִ֔/י וּ/בְחָנ֤וּ/נִי נָא֙ בָּ/זֹ֔את אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת אִם לֹ֧א אֶפְתַּ֣ח לָ/כֶ֗ם אֵ֚ת אֲרֻבּ֣וֹת הַ/שָּׁמַ֔יִם וַ/הֲרִיקֹתִ֥י לָ/כֶ֛ם בְּרָכָ֖ה עַד בְּלִי דָֽי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/010.yaml
  text: Bring the full tithe into the storehouse[a], so that there may be food in my house. And test me now in this, says Yahweh of hosts[c][b], whether I will not open for you the windows of heaven and pour out for you blessing until there is no more need.
translation:
  language: de
  text: Bringt den ganzen Zehnten in das Vorratshaus[a], damit Nahrung in meinem Haus ist. Stellt mich doch darin auf die Probe, spricht Jahwe der Heerscharen, ob ich euch nicht die Fenster des Himmels[b] öffnen und Segen über euch ausschütten werde – bis zum Übermaß.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „den gesamten Zehnten“ oder „allen Zehnten“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „die Schleusen des Himmels“. Wörtlich steht im Hebräischen „die Fenster des Himmels“.'
    reason: lexical_alternative
  - marker: c
    text: 'Die hebräische Wendung bezeichnet eine Fülle, die über das Ausreichende hinausgeht; traditionell auch: „bis kein Raum mehr da ist“ oder „über alle Maßen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבִיאוּ
  choice: Bringt
  rationale: Der Hifil-Imperativ Plural von בוא bezeichnet hier das Hineinbringen bzw. Abliefern; „Bringt“ bewahrt die direkte Aufforderung.
- source_word: כָּל הַמַּעֲשֵׂר
  choice: den ganzen Zehnten
  rationale: כָּל mit dem singularischen הַמַּעֲשֵׂר betont die Gesamtheit des geschuldeten Zehnten, nicht mehrere unterschiedliche Zehnten.
- source_word: בֵּית הָאוֹצָר
  choice: das Vorratshaus
  rationale: Die Constructusverbindung bezeichnet ein Haus bzw. einen Raum zur Aufbewahrung von Vorräten; „Vorratshaus“ passt zum Tempelzusammenhang und bleibt anschaulich.
- source_word: וִיהִי
  choice: damit … ist
  rationale: Die Jussivform drückt nach dem Imperativ den beabsichtigten Zweck bzw. das Ergebnis aus.
- source_word: טֶרֶף
  choice: Nahrung
  rationale: Obwohl das Wort auch „Beute“ bedeuten kann, bezeichnet es hier den im Haus Gottes verfügbaren Unterhalt bzw. Proviant.
- source_word: וּבְחָנוּנִי נָא בָּזֹאת
  choice: Stellt mich doch darin auf die Probe
  rationale: בחן bedeutet prüfen oder erproben; נָא verstärkt hier die auffordernde Einladung und wird natürlich mit „doch“ wiedergegeben. „Darin“ verweist auf die unmittelbar zuvor genannte Handlung.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: „Jahwe“ gibt den Gottesnamen ausdrücklich wieder; „Heerscharen“ bewahrt die militärisch-kosmische Bildkraft des Titels צְבָאוֹת.
- source_word: אִם לֹא
  choice: Seht, ob ich … nicht
  rationale: Nach der Aufforderung zur Probe führt אִם לֹא das zu Erweisende ein. Die Form bleibt rhetorisch offen, trägt aber eine stark bejahende Erwartung.
- source_word: אֲרֻבּוֹת הַשָּׁמַיִם
  choice: die Fenster des Himmels
  rationale: אֲרֻבּוֹת bezeichnet wörtlich Öffnungen oder Fenster. Die Wiedergabe erhält das biblische Bild und seine Bezüge zu anderen Texten; „Schleusen“ ist eine mögliche kontextuelle Deutung.
- source_word: וַהֲרִיקֹתִי לָכֶם בְּרָכָה
  choice: Segen über euch ausschütten
  rationale: ריק im Hifil kann „ausleeren, ausschütten“ bedeuten. Die deutsche Formulierung bewahrt das Bild einer reichlichen Zuwendung, ohne den allgemeinen Begriff „Segen“ auf materiellen Wohlstand zu verengen.
- source_word: עַד בְּלִי דָי
  choice: bis zum Übermaß
  rationale: Die knappe hebräische Wendung bezeichnet eine Fülle, die das Ausreichende übersteigt. „Bis zum Übermaß“ ist verständlich, während eine Fußnote die traditionellen Alternativen dokumentiert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Art des verheißenen Segens
  choice: allgemein „Segen“
  alternative: materieller Überfluss; landwirtschaftlicher Regen
  rationale: Der Zusammenhang betrifft Vorräte, Ernte und Bundesversorgung, doch בְּרָכָה bleibt semantisch allgemein. Die Übersetzung verengt die Zusage daher nicht auf eine bestimmte Wohlstandslehre.
- issue: Rhetorische Form von אִם לֹא
  choice: Seht, ob ich … nicht
  alternative: Ich werde ganz gewiss
  rationale: Die gewählte Form bewahrt die Spannung der göttlichen Aufforderung zur Erprobung und löst die rhetorische Konstruktion nicht stillschweigend in eine bloße Behauptung auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter prophetischer Rede. „Vorratshaus“, „Nahrung“ und „Fenster des Himmels“ halten die konkrete Tempel- und Himmelsbildsprache fest. Das ungewöhnliche göttliche Angebot, ihn zu prüfen, bleibt unverdeckt; „doch“ gibt die auffordernde Partikel נָא idiomatisch wieder.
