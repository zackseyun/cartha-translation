base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/006.yaml
  text: A son honors his father, and a servant his master. If, then, I am a father, where is my honor? And if I am a master, where is the fear due me? says the LORD of Armies to you, O priests who despise my name. Yet you say, “How have we despised your name?”
translation:
  language: de
  text: 'Ein Sohn ehrt seinen Vater, und ein Sklave seinen Herrn. Wenn ich nun Vater bin, wo bleibt die Ehre, die mir gebührt? Und wenn ich Herr bin, wo bleibt die Furcht, die mir gebührt? Das spricht der HERR der Heerscharen zu euch, ihr Priester, die ihr meinen Namen verachtet. Doch ihr sagt: »Wodurch haben wir deinen Namen verachtet?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֶבֶד
  choice: Knecht
  rationale: Der Begriff bezeichnet einen abhängigen Diener bis hin zum Sklaven. »Knecht« wahrt hier die soziale Unterordnung und bildet zugleich ein natürliches Gegenstück zu »Herr«, ohne den Status enger festzulegen, als es der Kontext verlangt.
- source_word: אֲדֹנִים / אֲדֹנָיו
  choice: Herr / seinen Herrn
  rationale: Das Hebräische verwendet die Herrschaftsbezeichnung in der menschlichen Analogie und anschließend für Gott. Die einheitliche Wiedergabe erhält das Wortspiel.
- source_word: מוֹרָאִי
  choice: die Furcht, die mir gebührt
  rationale: מוֹרָא bezeichnet ehrfürchtige Furcht beziehungsweise Scheu. Die Formulierung bewahrt den kräftigen Ausdruck »Furcht« und macht den relationalen Sinn im Deutschen verständlich.
- source_word: יְהוָה צְבָאוֹת
  choice: der HERR der Heerscharen
  rationale: Die traditionelle deutsche Wiedergabe kennzeichnet den Gottesnamen typografisch und gibt צְבָאוֹת formal als »Heerscharen« wieder.
- source_word: שֵׁם
  choice: Name
  rationale: »Name« bezeichnet hier Gottes offenbare Person, Ehre und Ansehen; die wörtliche Wiedergabe bewahrt diese biblische Bedeutungsfülle.
- source_word: בזה
  choice: verachten
  rationale: Das Verb meint geringschätzen oder mit Verachtung behandeln. »Verachten« entspricht der Schärfe des Vorwurfs und wird in der Gegenfrage wiederholt.
theological_decisions:
- issue: Gottes Selbstbezeichnung als Vater und Herr
  choice: Beide Titel und die parallelen Ansprüche auf Ehre und Furcht werden unverändert nebeneinandergestellt.
  alternative: Die Vaterbezeichnung fürsorglich und die Herrscherbezeichnung autoritativ ausdeuten.
  rationale: Der Vers selbst verbindet beide Bilder, ohne ihre Beziehung systematisch zu erklären; diese Spannung soll bestehen bleiben.
- issue: Wiedergabe des Tetragramms
  choice: HERR in Kapitälchenkonvention
  alternative: Jahwe
  rationale: Die etablierte deutsche Bibelkonvention wahrt die Unterscheidung zum Titel »Herr« und vermeidet eine nicht ausdrücklich geforderte Ausspracheentscheidung.
- issue: Adressaten des Vorwurfs
  choice: Der direkte Vorwurf gilt den Priestern.
  alternative: Den Vorwurf verallgemeinernd auf ganz Israel beziehen.
  rationale: לכם הכהנים redet ausdrücklich die Priester an; diese konkrete Verantwortlichkeit darf nicht abgeschwächt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klar erhaltener Parallelstruktur. »Wo bleibt …?« gibt das rhetorische אַיֵּה idiomatisch wieder. Die direkte Anrede »ihr Priester« und die disputative Gegenfrage bleiben deutlich hörbar.
