  text: וַ/אֲמַרְתֶּם֩ הִנֵּ֨ה מַ/תְּלָאָ֜ה וְ/הִפַּחְתֶּ֣ם אוֹת֗/וֹ אָמַר֙ יְהוָ֣ה צְבָא֔וֹת וַ/הֲבֵאתֶ֣ם גָּז֗וּל וְ/אֶת הַ/פִּסֵּ֨חַ֙ וְ/אֶת הַ֣/חוֹלֶ֔ה וַ/הֲבֵאתֶ֖ם אֶת הַ/מִּנְחָ֑ה הַ/אֶרְצֶ֥ה אוֹתָ֛/הּ מִ/יֶּדְ/כֶ֖ם אָמַ֥ר יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/013.yaml
  text: And you say[a], ‘Look, what a weariness this is,’ and you snort at it, says Yahweh of hosts. And you bring what is stolen, and the lame, and the sick; thus you bring the offering[b]. Should I accept it from your hand? says Yahweh.
translation:
  language: de
  text: 'Und ihr sagt: »Was für eine Mühsal!«, und ihr schnaubt verächtlich darüber[a], spricht Jahwe der Heerscharen. Ihr bringt Geraubtes, Lahmes und Krankes her – so bringt ihr die Opfergabe dar. Sollte ich sie aus eurer Hand mit Wohlgefallen annehmen? – spricht Jahwe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Verb bezeichnet ein Blasen oder Schnauben und drückt hier Verachtung aus; sinngemäß auch: »ihr verachtet es«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַתְּלָאָה
  choice: Was für eine Mühsal!
  rationale: Das Substantiv bezeichnet Mühsal, Beschwerde oder lästige Anstrengung. Die Ausrufkonstruktion mit הִנֵּה wird im Deutschen natürlich als verächtliche Klage wiedergegeben.
- source_word: וְהִפַּחְתֶּם אֹתוֹ
  choice: und ihr schnaubt verächtlich darüber
  rationale: נפח bezeichnet konkret ein Blasen oder Schnauben; der Kontext macht die verächtliche Haltung deutlich. Die Formulierung bewahrt sowohl das körperliche Bild als auch seine pragmatische Bedeutung.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Der Eigenname יהוה wird als Jahwe wiedergegeben; צְבָאוֹת bleibt mit »Heerscharen« als militärisch-kosmischer Titel erkennbar.
- source_word: גָּזוּל
  choice: Geraubtes
  rationale: Das passive Partizip bezeichnet etwas, das durch Raub oder gewaltsame Wegnahme erlangt wurde. »Geraubtes« bewahrt die moralische Schärfe.
- source_word: הַפִּסֵּחַ
  choice: Lahmes
  rationale: Gemeint ist ein Opfertier mit einer Gehbehinderung. Die substantivierte neutrale Form passt zur Aufzählung dargebrachter Tiere.
- source_word: הַחוֹלֶה
  choice: Krankes
  rationale: Die Form bezeichnet ein krankes Tier und wird parallel zu »Lahmes« substantiviert wiedergegeben.
- source_word: הַמִּנְחָה
  choice: die Opfergabe
  rationale: מִנְחָה kann eine Gabe oder speziell ein Speisopfer bezeichnen; hier legt die Aufzählung von Tieren einen allgemeineren kultischen Sinn nahe. »Opfergabe« wahrt diesen Umfang.
- source_word: הַאֶרְצֶה אֹתָהּ
  choice: Sollte ich sie wohlgefällig annehmen?
  rationale: רצה bezeichnet im Opferkontext das gnädige beziehungsweise wohlgefällige Annehmen. Die Fragepartikel markiert eine rhetorische Frage.
- source_word: מִיֶּדְכֶם
  choice: aus eurer Hand
  rationale: Die konkrete hebräische Wendung lässt sich verständlich und bildhaft im Deutschen bewahren.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen ausdrücklich. »Jahwe« gibt ihn als Eigennamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von יהוה צבאות
  choice: Jahwe der Heerscharen
  alternative: Jahwe, der Allmächtige
  rationale: »Heerscharen« bewahrt das konkrete, potenziell himmlisch-militärische Bild des Titels; »der Allmächtige« wäre stärker deutend.
- issue: Gegenstand der verächtlichen Geste
  choice: darüber
  alternative: ihn beziehungsweise es
  rationale: Das Suffix ist grammatisch maskulin und kann sich auf den vorangehenden Gedanken oder den kultischen Dienst beziehen. »Darüber« erhält den Bezug bewusst allgemein, statt ihn dogmatisch festzulegen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Anklage und die körperlich-konkrete Metapher des verächtlichen Schnaubens bleiben erhalten. »Mühsal« ist bewusst gehoben, aber allgemein verständlich; »Opfergabe« vermeidet die im Kontext zu enge Festlegung auf ein Speisopfer.
