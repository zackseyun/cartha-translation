  text: וְ/עַתָּ֛ה חַלּוּ נָ֥א פְנֵי אֵ֖ל וִֽ/יחָנֵ֑/נוּ מִ/יֶּדְ/כֶם֙ הָ֣יְתָה זֹּ֔את הֲ/יִשָּׂ֤א מִ/כֶּם֙ פָּנִ֔ים אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/009.yaml
  text: And now[a], entreat God for favor, that he may be gracious to us. From your hand has this come[b]; will he show favor to any of you? says Yahweh of hosts.
translation:
  language: de
  text: 'Und nun: Fleht Gott doch an, damit er uns gnädig sei! Dies ist von eurer Hand ausgegangen[b]. Wird er einem von euch seine Gunst erweisen? – spricht Jahwe der Heerscharen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Oder: „Dies ist von eurer Hand gekommen; wird er einen von euch annehmen?“'
    reason: alternative_reading
lexical_decisions:
- source_word: חַלּוּ נָא פְנֵי אֵל
  choice: Besänftigt doch Gott
  rationale: Die Piel-Aufforderung חַלּוּ mit נָא und פְנֵי bezeichnet das eindringliche Suchen der Gunst Gottes. „Besänftigt doch Gott“ gibt den idiomatischen Sinn natürlich wieder; die wörtliche Bildsprache wird in der Fußnote bewahrt.
- source_word: וִיחָנֵּנוּ
  choice: damit er uns gnädig sei
  rationale: Das Imperfekt von חנן nach der Aufforderung lässt sich als beabsichtigte Folge verstehen. „Gnädig sei“ bewahrt sowohl den Wunschcharakter als auch den Gedanken erwiesener Gunst.
- source_word: מִיֶּדְכֶם הָיְתָה זֹּאת
  choice: Von eurer Hand ist dies geschehen
  rationale: Die Formulierung wahrt die hebräische Wendung für Ursprung beziehungsweise Verantwortlichkeit und bezieht sich im Kontext auf das Handeln der Priester.
- source_word: הֲיִשָּׂא מִכֶּם פָּנִים
  choice: Wird er einem von euch seine Gunst erweisen?
  rationale: נשׂא פנים bedeutet hier, jemanden günstig aufzunehmen beziehungsweise ihm Gunst zu erweisen. Die rhetorische Frage bleibt erhalten, ohne sie auf Parteilichkeit zu verengen.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben. „Heerscharen“ bewahrt die traditionelle Breite des Titels צְבָאוֹת.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname des Gottes Israels wird erkennbar als Name wiedergegeben, statt durch einen Titel ersetzt zu werden.
- issue: Sinn der rhetorischen Frage הֲיִשָּׂא מִכֶּם פָּנִים
  choice: Wird er einem von euch seine Gunst erweisen?
  alternative: Wird er einen von euch annehmen?
  rationale: Die gewählte Fassung bewahrt den Gedanken günstiger Aufnahme und lässt offen, ob der Akzent stärker auf Gunst oder Annahme liegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die eindringliche Partikel נָא wird durch „doch“ ausgedrückt. Der abrupte Wechsel vom Aufruf zur Anklage und die rhetorische Spannung des Hebräischen bleiben erhalten.
