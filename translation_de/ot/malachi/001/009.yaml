  rationale: Die imperativische Aufforderung wird von der sinnverengenden Vorstellung des Besänftigens zu einem dringlichen Anflehen Gottes korrigiert. Die Fußnote erläutert die hebräische Bildsprache zutreffend. Die zweite Satzhälfte wird idiomatischer formuliert, ohne den Gedanken von Herkunft und Verantwortlichkeit zu verändern. Der Fußnotenanker a entfällt im Fließtext, weil die revidierte Hauptfassung die idiomatische Bedeutung ohne zusätzliche lexikalische Alternative ausdrückt; Fußnote b bleibt an der einschlägigen Stelle verankert.
