base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/002.yaml
  text: “I have loved you,” says Yahweh. But you say[a], “How have you loved us?” “Was not Esau Jacob’s brother?” declares Yahweh. “Yet I loved Jacob,”
translation:
  language: de
  text: '„Ich habe euch geliebt“, spricht der HERR. Doch ihr sagt[a]: „Wie hast du uns geliebt?“ „War Esau nicht Jakobs Bruder?“, spricht der HERR. „Und doch habe ich Jakob geliebt,“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Formaler können die hebräischen Perfektformen auch mit dem Präteritum wiedergegeben werden: „Ich liebte euch … Wie liebtest du uns? … Und doch liebte ich Jakob.“'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: אָהַבְתִּי
  choice: Ich habe euch geliebt
  rationale: Das Qal-Perfekt 1. Person Singular von אהב bezeichnet die erklärte Liebe JHWHs zu Israel. Das deutsche Perfekt gibt den Rückbezug mit fortwirkender Bedeutung wieder, ohne das Verb als „erwählt“ oder „meine Bundestreue erwiesen“ auszudeuten.
- source_word: אֶתְכֶם
  choice: euch
  rationale: Der Suffix der 2. Person maskulin Plural richtet sich an Israel als Gemeinschaft; „euch“ bildet Numerus und Objektfunktion natürlich ab.
- source_word: אָמַר יְהוָה
  choice: spricht der HERR
  rationale: Die geläufige deutsche prophetische Redeformel gibt die fortgeltende göttliche Aussage würdig wieder. Der Gottesname JHWH wird traditionsgemäß als „der HERR“ wiedergegeben.
- source_word: וַאֲמַרְתֶּם
  choice: Doch ihr fragt
  rationale: Das Waw leitet im prophetischen Streitgespräch den Einwand des Volkes ein und ist hier sinnvoll adversativ. „Fragt“ entspricht der unmittelbar folgenden Frage im Deutschen natürlicher als „sagt“.
- source_word: בַּמָּה
  choice: Wie
  rationale: Die Wendung fragt idiomatisch nach der Weise oder dem erkennbaren Ausdruck der Liebe; „Wie“ bleibt knapp und bewahrt den herausfordernden Ton.
- source_word: אֲהַבְתָּנוּ
  choice: hast du uns geliebt
  rationale: Das Qal-Perfekt 2. Person maskulin Singular mit Objekt der 1. Person Plural wird parallel zur eröffnenden Aussage im deutschen Perfekt wiedergegeben.
- source_word: הֲלוֹא
  choice: War … nicht?
  rationale: Die Partikel eröffnet eine rhetorische Frage, die Zustimmung erwartet.
- source_word: אָח עֵשָׂו לְיַעֲקֹב
  choice: Esau … Jakobs Bruder
  rationale: אָח bezeichnet die Bruderschaft; לְ markiert hier die Beziehung zu Jakob. Der deutsche Genitiv ist die natürliche Wiedergabe.
- source_word: נְאֻם יְהוָה
  choice: erklärt der HERR
  rationale: Die feierliche prophetische Formel wird von der ersten Redeeinleitung unterschieden, ohne das im Deutschen schwerfällige „Ausspruch des HERRN“ zu verwenden.
- source_word: וָאֹהַב אֶת יַעֲקֹב
  choice: Und doch habe ich Jakob geliebt
  rationale: 'Das Waw trägt im Zusammenhang einen kontrastiven Sinn: Trotz der Bruderschaft Esaus galt die genannte Liebe Jakob. „Und doch“ macht diesen Kontrast deutlich, ohne den Begriff „lieben“ auszulegen.'
theological_decisions:
- issue: Bedeutung der göttlichen Liebe zu Jakob und Israel
  choice: Das einfache Verb „lieben“ bleibt im Haupttext erhalten.
  alternative: „erwählen“ oder „meine Bundesliebe zuwenden“
  rationale: Der Zusammenhang kann Erwählung und Bundestreue einschließen, doch der hebräische Text verwendet das gewöhnliche Verb אהב. Eine erklärende Erweiterung würde die theologische Spannung vorzeitig auflösen.
- issue: Zeitliche Bedeutung der hebräischen Perfektformen
  choice: Wiedergabe mit deutschem Perfekt
  alternative: Präteritum („Ich liebte euch … Wie liebtest du uns?“) oder präsentische Deutung („Ich liebe euch“)
  rationale: Das Perfekt hält vergangenes Handeln und seine gegenwärtige Relevanz zusammen. Da das Hebräische nicht exakt den deutschen Tempuskategorien entspricht, wird die mögliche formalere Vergangenheitswiedergabe in der Fußnote genannt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Die direkte Rede und die knappen Fragen bewahren die Form des Streitgesprächs; „spricht“ und „erklärt“ unterscheiden die beiden Redeeinleitungen, ohne altertümlich zu wirken.
