  naturalness: Der Haupttext ist modernes, würdiges Standarddeutsch. „sodass ihr nicht mehr“ stellt den Zusammenhang zwischen dem Schließen der Türen und der Beendigung des vergeblichen Altarfeuers idiomatischer dar als das etwas zweideutige „damit ihr nicht“.
