source:
  edition: WLC
  text: מִ֤י גַם בָּ/כֶם֙ וְ/יִסְגֹּ֣ר דְּלָתַ֔יִם וְ/לֹֽא תָאִ֥ירוּ מִזְבְּחִ֖/י חִנָּ֑ם אֵֽין לִ֨/י חֵ֜פֶץ בָּ/כֶ֗ם אָמַר֙ יְהוָ֣ה צְבָא֔וֹת וּ/מִנְחָ֖ה לֹֽא אֶרְצֶ֥ה מִ/יֶּדְ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/010.yaml
  text: Oh[a], that there were even one among you who would shut the doors, so that you would not kindle my altar in vain! I have no pleasure in you, says Yahweh of hosts[c][b], and I will not accept an offering from your hand.
translation:
  language: de
  text: Wenn doch wenigstens einer von euch die Türen schließen würde,[a] sodass ihr nicht mehr vergeblich Feuer auf meinem Altar entzündet![b] Ich habe kein Gefallen an euch, spricht Jahwe der Heerscharen, und eine Opfergabe[c] aus eurer Hand nehme ich nicht an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder als rhetorische Frage: „Wer von euch würde wenigstens die Türen schließen?“ Der hebräische Wortlaut kann sowohl als Frage als auch als Wunsch verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: 'Auch möglich: „sodass ihr meinen Altar nicht vergeblich anzündet“ oder „... nicht umsonst Feuer auf meinem Altar entzündet“. Gemeint ist das Entzünden des Altarfeuers.'
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Wort kann im Opferdienst genauer ein Speisopfer bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי גַם בָּכֶם
  choice: Wenn doch wenigstens einer von euch
  rationale: Die formal mögliche Frage wird im Zusammenhang am besten als entrüsteter Wunsch verstanden. „Wenn doch“ gibt diese optative Kraft natürlich wieder, ohne die alternative interrogative Lesart zu verschweigen.
- source_word: וְיִסְגֹּר דְּלָתַיִם
  choice: die Türen schließen würde
  rationale: Gemeint sind im Kontext die Türen des Tempels. Der deutsche Konditionalsatz fügt sich natürlich in die Wiedergabe des vorangehenden Wunsches ein.
- source_word: וְלֹא תָאִירוּ מִזְבְּחִי
  choice: damit ihr nicht Feuer auf meinem Altar entzündet
  rationale: Das Hifil von אור bezeichnet hier das Entzünden beziehungsweise Brennenlassen des Altarfeuers. Die Formulierung ist verständlicher als das im Deutschen missverständliche „meinen Altar anzünden“.
- source_word: חִנָּם
  choice: vergeblich
  rationale: Im Zusammenhang bezeichnet das Wort einen nutzlosen, von Gott nicht angenommenen Kultdienst. „Vergeblich“ wahrt diese Pointe in würdigem, heutigem Deutsch.
- source_word: אֵין לִי חֵפֶץ בָּכֶם
  choice: Ich habe kein Gefallen an euch
  rationale: חֵפֶץ bezeichnet Gefallen oder Wohlgefallen. Die Formulierung erhält sowohl den persönlichen Bezug als auch den feierlich-gerichtlichen Ton.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: „Jahwe“ gibt den göttlichen Eigennamen wieder; „Heerscharen“ bewahrt das traditionsreiche und intertextuell gewichtige Gottesprädikat צְבָאוֹת.
- source_word: וּמִנְחָה
  choice: eine Opfergabe
  rationale: מִנְחָה kann im Kult insbesondere ein Speisopfer bezeichnen, hat aber auch den weiteren Sinn einer Gabe. „Opfergabe“ bewahrt den kultischen Bezug, ohne die Art des Opfers im Haupttext festzulegen.
- source_word: לֹא אֶרְצֶה מִיֶּדְכֶם
  choice: aus eurer Hand nehme ich nicht an
  rationale: רצה bezeichnet im Opferkontext die gnädige Annahme. Die vorangestellte Wendung „aus eurer Hand“ bewahrt das hebräische Bild und den Nachdruck.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt das Tetragramm unmittelbar. „Jahwe“ macht den Eigennamen sichtbar, statt ihn durch einen Titel zu ersetzen.
- issue: Satzart von מִי גַם בָּכֶם
  choice: 'Wunschsatz: „Wenn doch wenigstens einer …“'
  alternative: 'Rhetorische Frage: „Wer von euch würde wenigstens die Türen schließen?“'
  rationale: Beide Analysen sind grammatisch möglich. Der scharfe Wunsch, den nutzlosen Tempeldienst ganz zu beenden, passt besonders gut zum Kontext; die echte Mehrdeutigkeit wird in Fußnote [a] erhalten.
- issue: Bedeutungsumfang von מִנְחָה
  choice: Opfergabe
  alternative: Speisopfer
  rationale: Im kultischen Gebrauch kann das Wort enger ein Speisopfer meinen. Der weitere Ausdruck vermeidet eine unnötige Festlegung, während die Fußnote die engere Möglichkeit dokumentiert.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem prophetischem Ton. Die Tempeltüren werden kontextuell, aber ohne erklärenden Zusatz im Haupttext genannt. Die syntaktische und lexikalische Mehrdeutigkeit wird knapp in Fußnoten offengehalten.
