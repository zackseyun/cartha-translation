source:
  edition: WLC
  text: מַגִּישִׁ֤ים עַֽל מִזְבְּחִ/י֙ לֶ֣חֶם מְגֹאָ֔ל וַ/אֲמַרְתֶּ֖ם בַּ/מֶּ֣ה גֵֽאַלְנ֑וּ/ךָ בֶּ/אֱמָרְ/כֶ֕ם שֻׁלְחַ֥ן יְהוָ֖ה נִבְזֶ֥ה הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/007.yaml
  text: By presenting defiled food on my altar[a]. But you say, “How have we defiled you?” By saying[c][b], “The table of Yahweh is despised.”
translation:
  language: de
  text: 'Ihr bringt verunreinigte Speise[a] auf meinem Altar dar. Doch ihr fragt: »Wodurch haben wir dich verunreinigt?[b]« Dadurch, dass ihr sagt: »Der Tisch Jahwes[c] ist verachtet.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »Brot«; im Opferzusammenhang ist die auf dem Altar dargebrachte Speise gemeint.
    reason: lexical_alternative
  - marker: b
    text: 'Das Hebräische redet Gott unmittelbar mit »dich« an: Die Verachtung seines Altars trifft ihn selbst.'
    reason: alternative_reading
  - marker: c
    text: Der »Tisch Jahwes« ist ein Bild für den Altar und den dort vollzogenen Opferdienst.
    reason: cultural_note
lexical_decisions:
- source_word: מַגִּישִׁים
  choice: Indem ihr … darbringt
  rationale: Das Hifil-Partizip führt die Anklage aus dem vorherigen Vers erläuternd weiter. Die Konstruktion mit »indem« gibt diese funktionale Verknüpfung im Deutschen natürlich wieder.
- source_word: לֶחֶם
  choice: Speise
  rationale: Wörtlich bedeutet das Wort »Brot«, bezeichnet im Opferkontext jedoch allgemeiner die auf dem Altar dargebrachte Nahrung. »Speise« wahrt den kultischen Zusammenhang und passt zugleich zum Bild des Tisches.
- source_word: מְגֹאָל
  choice: verunreinigte
  rationale: Die Form bezeichnet hier etwas Entweihtes oder Verunreinigtes. »Verunreinigt« ist verständlich und lässt sowohl die kultische als auch die sittliche Dimension offen.
- source_word: בַּמֶּה גֵאַלְנוּךָ
  choice: Wodurch haben wir dich verunreinigt?
  rationale: »Wodurch« passt zur anschließenden Angabe des Mittels durch »Dadurch, dass«. Das Suffix der zweiten Person Singular wird ausdrücklich mit »dich« wiedergegeben.
- source_word: בֶּאֱמָרְכֶם
  choice: Dadurch, dass ihr sagt
  rationale: Die Präposition mit Infinitiv erklärt, wodurch die Verunreinigung geschieht. Die deutsche Formulierung macht diesen Bezug klar, ohne die Aussage inhaltlich zu erweitern.
- source_word: שֻׁלְחַן יְהוָה
  choice: der Tisch Jahwes
  rationale: Die kultische Metapher wird bewahrt und nicht unmittelbar mit »Altar« aufgelöst.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben, statt ihn durch den Titel »HERR« zu ersetzen.
- source_word: נִבְזֶה הוּא
  choice: ist verachtet
  rationale: Die knappe prädikative Aussage des Hebräischen bleibt erhalten. »Verachtet« gibt das Urteil über Jahwes Tisch direkt wieder.
theological_decisions:
- issue: Direktes Objekt in der Frage der Priester
  choice: »Wie haben wir dich verunreinigt?« wird sinngemäß als »Wodurch haben wir dich verunreinigt?« mit direktem »dich« bewahrt.
  alternative: »Wodurch haben wir ihn/deinen Altar verunreinigt?«
  rationale: Das hebräische Suffix bezeichnet ausdrücklich Gott als angesprochenes Gegenüber. So bleibt die Spannung erhalten, dass die Missachtung seines Altars als gegen Gott selbst gerichtet erscheint.
- issue: Bedeutungsumfang von לֶחֶם im Opferkontext
  choice: Speise
  alternative: Brot
  rationale: Im kultischen Zusammenhang ist nicht nur gewöhnliches Brot gemeint, sondern Opfergabe beziehungsweise Nahrung auf dem Altar. Die Fußnote bewahrt dennoch den wörtlichen Sinn.
- issue: Metapher »Tisch Jahwes«
  choice: Die Metapher wird wörtlich beibehalten.
  alternative: »Jahwes Altar«
  rationale: Der Text selbst wechselt vom Altar zum Bild des Tisches. Diese Bildsprache soll nicht durch eine erklärende Übersetzung eingeebnet werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Konstruktion »Wodurch …? Dadurch, dass …« bildet die Frage-und-Antwort-Struktur klar ab. »Speise« und »Tisch« halten den Opferkontext verständlich, ohne die Bildsprache aufzulösen.
