  - severity: low
    issue: Die Erläuterung zu נורא nennt „Staunen“ zu bestimmt.
    rationale: Der Kontext und das Wortfeld betreffen Furcht bzw. ehrfürchtiges Erschauern. „Furcht und Ehrfurcht“ erläutert die Nuance präziser.
