- from: Doch verflucht ist der Betrüger, der ein männliches Tier in seiner Herde hat und es gelobt, dem Herrn aber ein schadhaftes Tier opfert! Denn ich bin ein großer König, spricht Jahwe der Heerscharen[a], und mein Name ist gefürchtet unter den Völkern.[b]
  to: Doch verflucht ist der Betrüger, der ein männliches Tier in seiner Herde hat, ein Gelübde ablegt und dem Herrn ein schadhaftes Tier opfert. Denn ich bin ein großer König, spricht Jahwe der Heerscharen[a], und mein Name ist unter den Völkern gefürchtet.[b]
