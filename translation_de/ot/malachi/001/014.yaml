  text: וְ/אָר֣וּר נוֹכֵ֗ל וְ/יֵ֤שׁ בְּ/עֶדְר/וֹ֙ זָכָ֔ר וְ/נֹדֵ֛ר וְ/זֹבֵ֥חַ מָשְׁחָ֖ת לַֽ/אדֹנָ֑/י כִּי֩ מֶ֨לֶךְ גָּד֜וֹל אָ֗נִי אָמַר֙ יְהוָ֣ה צְבָא֔וֹת וּ/שְׁמִ֖/י נוֹרָ֥א בַ/גּוֹיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/014.yaml
  text: But cursed is the deceiver who has a male in his flock[a], and vows it, but sacrifices a blemished animal to the Lord. For I am a great King, says Yahweh of Armies[b], and my name is feared among the nations.
translation:
  language: de
  text: Doch verflucht ist der Betrüger, der ein männliches Tier in seiner Herde hat, ein Gelübde ablegt und dem Herrn ein schadhaftes Tier opfert. Denn ich bin ein großer König, spricht Jahwe der Heerscharen[a], und mein Name ist unter den Völkern gefürchtet.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jahwe der Heere“. Traditionell auch: „der HERR der Heerscharen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und meinem Namen wird unter den Völkern Ehrfurcht entgegengebracht“. Das hebräische Wort umfasst Furcht und Ehrfurcht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: verflucht
  rationale: Gibt das prädikative Gerichtswort klar und in geläufiger biblischer Sprache wieder.
- source_word: נוֹכֵל
  choice: der Betrüger
  rationale: Bezeichnet denjenigen, der beim Gelübde und Opfer vorsätzlich täuscht; „Betrüger“ ist präzise und modern.
- source_word: יֵשׁ בְּעֶדְרוֹ זָכָר
  choice: der ein männliches Tier in seiner Herde hat
  rationale: Bewahrt die Aussage, dass ein geeignetes männliches Opfertier vorhanden ist, ohne die Tierart enger festzulegen als der hebräische Text.
- source_word: וְנֹדֵר
  choice: und es gelobt
  rationale: Das im Hebräischen unausgesprochene Objekt wird aus dem unmittelbaren Zusammenhang natürlich ergänzt; gemeint ist das vorhandene männliche Tier.
- source_word: וְזֹבֵחַ
  choice: dem Herrn aber … opfert
  rationale: Das hebräische Waw verbindet formal, trägt im Kontext jedoch einen deutlichen Gegensatz zwischen Gelübde und tatsächlichem Opfer.
- source_word: מָשְׁחָת
  choice: ein schadhaftes Tier
  rationale: Bezeichnet im Opferkontext ein verdorbenes oder mangelhaftes, daher ungeeignetes Tier. „Schadhaft“ erhält die kultische Untauglichkeit, ohne einen bestimmten Makel zu behaupten.
- source_word: לַאדֹנָי
  choice: dem Herrn
  rationale: אֲדֹנָי ist hier die Gottesbezeichnung „Herr“ und bezeichnet den souveränen Empfänger des Opfers.
- source_word: כִּי מֶלֶךְ גָּדוֹל אָנִי
  choice: Denn ich bin ein großer König
  rationale: Bewahrt die begründende Funktion von כִּי sowie die nachdrückliche göttliche Selbstaussage.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: „Jahwe“ gibt den Gottesnamen wieder; „Heerscharen“ bewahrt die umfassende militärische und himmlische Konnotation von צְבָאוֹת und ist im Deutschen würdevoll verständlich.
- source_word: נוֹרָא
  choice: ist gefürchtet
  rationale: Bewahrt die starke Bedeutung von Furcht, während eine Fußnote auf die mitklingende Ehrfurcht hinweist.
- source_word: בַּגּוֹיִם
  choice: unter den Völkern
  rationale: Gibt die räumlich-soziale Bedeutung natürlich wieder und vermeidet die enger konnotierte Wiedergabe „Heiden“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm; „Jahwe“ wahrt den persönlichen Bundesnamen, während die traditionelle Ersatzlesung als mögliche Übersetzungstradition bestehen bleibt.
- issue: Wiedergabe von צְבָאוֹת
  choice: Heerscharen
  alternative: Heere
  rationale: „Heerscharen“ umfasst irdische wie himmlische Mächte und vermeidet eine vorschnelle Beschränkung auf menschliche Armeen.
- issue: Bedeutungsumfang von נוֹרָא
  choice: gefürchtet
  alternative: verehrt
  rationale: Das Wort bezeichnet das Hervorrufen von Furcht und Ehrfurcht. Die Hauptfassung erhält die stärkere Komponente; die alternative Nuance wird in der Fußnote ausgewiesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischer Schärfe. Der Ausruf nach dem Opferbetrug trägt die hebräische Fluchankündigung; die Satzstellung hebt den Gegensatz zwischen dem gelobten geeigneten Tier und dem tatsächlich dargebrachten schadhaften Tier hervor. Sämtliche Fußnotenmarker stehen im Haupttext.
