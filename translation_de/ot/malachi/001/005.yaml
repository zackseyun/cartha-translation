source:
  edition: WLC
  text: וְ/עֵינֵי/כֶ֖ם תִּרְאֶ֑ינָה וְ/אַתֶּ֤ם תֹּֽאמְרוּ֙ יִגְדַּ֣ל יְהוָ֔ה מֵ/עַ֖ל לִ/גְב֥וּל יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/005.yaml
  text: Your own eyes will see[a], and you yourselves will say, “Great is Yahweh beyond the border of Israel.”
translation:
  language: de
  text: 'Ihr werdet es mit eigenen Augen sehen, und ihr selbst werdet sagen: »Groß ist Jahwe[a] über die Grenze Israels hinaus.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Jahwe erweist sich als groß über die Grenze Israels hinaus« oder: »Möge Jahwe über die Grenze Israels hinaus groß sein.« Das Hebräische lässt sich als Aussage oder als feierlicher Zuruf verstehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעֵינֵיכֶם תִּרְאֶינָה
  choice: Ihr werdet es mit eigenen Augen sehen
  rationale: Die hebräische Formulierung hat wörtlich die Augen als Subjekt. Die idiomatische deutsche Wendung „mit eigenen Augen sehen“ bewahrt sowohl das konkrete Bild als auch die Betonung unmittelbarer eigener Wahrnehmung. „Es“ verweist zurück auf das zuvor angekündigte Geschehen, ohne es näher auszudeuten.
- source_word: וְאַתֶּם תֹּאמְרוּ
  choice: und ihr selbst werdet sagen
  rationale: Das selbstständige Pronomen אַתֶּם hebt die Angesprochenen hervor; „ihr selbst“ gibt diese Betonung im Deutschen wieder.
- source_word: יִגְדַּל יְהוָה
  choice: Groß ist Jahwe
  rationale: Die knappe, feierliche Formulierung gibt die Aussage beziehungsweise Akklamation natürlich wieder, ohne die mögliche Aussageweise unnötig auf eine Wunschform oder ein Passiv festzulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מֵעַל לִגְבוּל יִשְׂרָאֵל
  choice: über Israels Grenzen hinaus
  rationale: 'Die Formulierung gibt den räumlichen Sinn idiomatisch wieder: Jahwes Größe reicht über das Gebiet beziehungsweise die Grenze Israels hinaus. Der deutsche Plural ist in dieser Wendung natürlicher als der hebräische Singular.'
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm; „Jahwe“ bewahrt den Charakter als Eigenname.
- issue: Aussagekraft von יִגְדַּל יְהוָה
  choice: Groß ist Jahwe
  alternative: Jahwe erweist sich als groß / Möge Jahwe groß sein
  rationale: Die Verbform kann als Akklamation oder als Aussage verstanden werden. Der Haupttext bleibt knapp und feierlich; die Fußnote weist auf die Spannweite der möglichen Wiedergaben hin.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die idiomatische Wendung „mit eigenen Augen“ erhält die hebräische Anschaulichkeit; der parallele Nachdruck „ihr selbst“ bleibt ausdrücklich stehen.
