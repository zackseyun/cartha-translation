source:
  edition: WLC
  text: כִּֽי תֹאמַ֨ר אֱד֜וֹם רֻשַּׁ֗שְׁנוּ וְ/נָשׁוּב֙ וְ/נִבְנֶ֣ה חֳרָב֔וֹת כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת הֵ֥מָּה יִבְנ֖וּ וַ/אֲנִ֣י אֶהֱר֑וֹס וְ/קָרְא֤וּ לָ/הֶם֙ גְּב֣וּל רִשְׁעָ֔ה וְ/הָ/עָ֛ם אֲשֶׁר זָעַ֥ם יְהוָ֖ה עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/004.yaml
  text: 'Though Edom says[a], “We are shattered, but we will return and rebuild the ruins,” this is what Yahweh of Armies says: “They may build, but I will tear down, and they will be called the territory of wickedness[d][c][b], the people with whom Yahweh is indignant forever.”'
translation:
  language: de
  text: 'Auch wenn Edom sagt: „Wir sind zerschlagen, doch wir werden zurückkehren und die Trümmerstätten wieder aufbauen“, spricht Jahwe der Heerscharen: „Sie mögen bauen[a], ich aber werde niederreißen. Man wird sie nennen: ‚Gebiet der Bosheit‘ und ‚das Volk, dem Jahwe für immer zürnt‘.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '„Sie mögen bauen“ kann auch prädiktiv übersetzt werden: „Sie werden bauen, ich aber werde niederreißen.“'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי תֹאמַר
  choice: Auch wenn ... sagt
  rationale: 'Die Wendung wird im Zusammenhang konzessiv verstanden: Edoms Absicht steht im Gegensatz zu Jahwes Antwort. Das Imperfekt lässt sich hier anschaulich präsentisch wiedergeben.'
- source_word: רֻשַּׁשְׁנוּ
  choice: Wir sind zerschlagen
  rationale: Das passive Verb bezeichnet schwere Verwüstung oder Zerschlagung und wird nicht auf wirtschaftliche Verarmung verengt.
- source_word: וְנָשׁוּב וְנִבְנֶה חֳרָבוֹת
  choice: doch wir werden zurückkehren und die Trümmerstätten wieder aufbauen
  rationale: שׁוב behält den Sinn „zurückkehren“; „wieder aufbauen“ gibt die idiomatische Bedeutung von „die verwüsteten Orte bauen“ wieder.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben. „Heerscharen“ wahrt den etablierten, würdevollen deutschen Titel und lässt dessen umfassende militärische und himmlische Konnotation offen.
- source_word: הֵמָּה יִבְנוּ וַאֲנִי אֶהֱרֹס
  choice: Sie mögen bauen, ich aber werde niederreißen
  rationale: Das hervorgehobene „sie“ und „ich“ erzeugt einen scharfen Gegensatz. „Mögen“ bringt die konzessive Kraft im Kontext zum Ausdruck; die prädiktive Lesart bleibt in einer Fußnote erhalten.
- source_word: גְּבוּל רִשְׁעָה
  choice: Gebiet der Bosheit
  rationale: גְּבוּל kann ein Gebiet oder Grenzland bezeichnen. „Gebiet“ passt zur Bezeichnung Edoms als Land, während „Bosheit“ die moralische Wertung wahrt.
- source_word: זָעַם יְהוָה עַד עוֹלָם
  choice: über das Jahwe für immer zürnt
  rationale: זעם bezeichnet starken göttlichen Unwillen beziehungsweise Zorn. Das Präsens gibt den anhaltenden Zustand natürlich wieder, ohne die Dauerangabe abzuschwächen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als Name wiedergegeben, statt durch einen Titel ersetzt zu werden.
- issue: Wiedergabe von צְבָאוֹת
  choice: der Heerscharen
  alternative: der Heere
  rationale: „Heerscharen“ ist im Deutschen verständlich und würdevoll und vermeidet eine vorschnelle Beschränkung auf irdische Armeen.
- issue: Aussagekraft von הֵמָּה יִבְנוּ
  choice: 'konzessiv: „Sie mögen bauen“'
  alternative: 'prädiktiv: „Sie werden bauen“'
  rationale: Im Kontext steht die Vergeblichkeit jedes Wiederaufbaus im Vordergrund. Da die hebräische Verbform auch prädiktiv gelesen werden kann, wird diese Möglichkeit ausdrücklich vermerkt.
- issue: Bezug von וְהָעָם אֲשֶׁר זָעַם יְהוָה
  choice: 'zweite Benennung Edoms: „das Volk, über das Jahwe für immer zürnt“'
  alternative: appositionell ohne wiederholte Anführungszeichen
  rationale: Der hebräische Text nennt nach dem Gebiet auch das Volk. Die parallele Benennung wird sichtbar gemacht, ohne daraus zwei verschiedene Gruppen zu bilden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die prophetische Botenformel wird knapp mit „spricht“ wiedergegeben. Die Bildsprache von Zerschlagung, Wiederaufbau und Niederreißen bleibt erhalten; echte lexikalische und modale Mehrdeutigkeit wird in den Fußnoten ausgewiesen.
