  to: Denn vom Aufgang der Sonne bis zu ihrem Untergang[a] ist mein Name groß unter den Völkern[b][c]. An jedem Ort wird Räucherwerk verbrannt und meinem Namen eine reine Opfergabe[d] dargebracht; denn mein Name ist groß unter den Völkern, spricht Jahwe der Heerscharen.
  rationale: Die sichere Korrektur unterscheidet מֻקְטָר („wird verbrannt/geräuchert“) von מֻגָּשׁ („wird dargebracht“) und bindet „meinem Namen“ an das zweite, im Hebräischen damit verbundene Partizip. Die Anmerkung zur offenen Zeitreferenz wird an eine Stelle gesetzt, an der ihr Bezug auf die Aussagefolge des Verses klar ist. Alle übrigen Entscheidungen bleiben erhalten.
