  variant: modern standard German
source:
  edition: WLC
  text: כִּ֣י מִ/מִּזְרַח שֶׁ֜מֶשׁ וְ/עַד מְבוֹא֗/וֹ גָּד֤וֹל שְׁמִ/י֙ בַּ/גּוֹיִ֔ם וּ/בְ/כָל מָק֗וֹם מֻקְטָ֥ר מֻגָּ֛שׁ לִ/שְׁמִ֖/י וּ/מִנְחָ֣ה טְהוֹרָ֑ה כִּֽי גָד֤וֹל שְׁמִ/י֙ בַּ/גּוֹיִ֔ם אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/011.yaml
  text: For from the rising of the sun to its setting[a], my name is great among the nations, and in every place incense is offered, and a pure offering is brought, to my name; for my name is great among the nations[d][c][b], says Yahweh of hosts.
translation:
  language: de
  text: Denn vom Aufgang der Sonne bis zu ihrem Untergang[a] ist mein Name groß unter den Völkern[b][c]. An jedem Ort wird Räucherwerk verbrannt und meinem Namen eine reine Opfergabe[d] dargebracht; denn mein Name ist groß unter den Völkern, spricht Jahwe der Heerscharen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vom Osten bis zum Westen“; wörtlich: „vom Aufgang der Sonne bis zu ihrem Untergang“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „unter den Heidenvölkern“.'
    reason: lexical_alternative
  - marker: c
    text: Das Hebräische kann als Beschreibung gegenwärtiger Wirklichkeit, als prophetische Gegenwart oder als Ausdruck zukünftiger Gewissheit verstanden werden; die Übersetzung entscheidet die Zeitfrage nicht ausdrücklich.
    reason: alternative_reading
  - marker: d
    text: „Opfergabe“ übersetzt das hebräische Wort minchah. Es kann allgemein eine Gabe oder Opfergabe bezeichnen, in Opferzusammenhängen häufig auch ein Speiseopfer.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für den vorausgehenden Tadel ein, ohne die mögliche bekräftigende Nuance auszuschließen.
- source_word: מִמִּזְרַח שֶׁמֶשׁ וְעַד מְבוֹאוֹ
  choice: vom Aufgang der Sonne bis zu ihrem Untergang
  rationale: Bewahrt das hebräische Bild und gibt den Suffixbezug auf die Sonne ausdrücklich wieder.
- source_word: גָּדוֹל שְׁמִי
  choice: mein Name ist groß
  rationale: Natürliches deutsches Prädikatsgefüge; „Name“ bleibt als Ausdruck für Ansehen und Ehre konkret erhalten.
- source_word: בַּגּוֹיִם
  choice: unter den Völkern
  rationale: Gibt גּוֹיִם breit und kontextgemäß wieder, ohne es unnötig auf eine bestimmte ethnische oder neutestamentliche Kategorie zu verengen.
- source_word: וּבְכָל מָקוֹם
  choice: An jedem Ort
  rationale: Bewahrt den verteilenden Sinn und klingt in modernem Standarddeutsch natürlich.
- source_word: מֻקְטָר
  choice: Räucherwerk wird dargebracht
  rationale: Vermittelt den kultischen Sinn des passiven Partizips, ohne die Wendung bloß technisch als Verbrennen wiederzugeben.
- source_word: מֻגָּשׁ לִשְׁמִי
  choice: meinem Namen wird … dargebracht / gebracht
  rationale: Behält die ungewöhnliche, theologisch gewichtige Zielangabe „meinem Namen“ bei und lässt beide Opferausdrücke darauf bezogen sein.
- source_word: וּמִנְחָה טְהוֹרָה
  choice: und eine reine Opfergabe
  rationale: מִנְחָה kann allgemein eine Gabe oder Opfergabe und in kultischen Zusammenhängen besonders ein Speiseopfer bezeichnen; die breitere Wiedergabe vermeidet eine unbegründete Verengung.
- source_word: אָמַר יְהוָה צְבָאוֹת
  choice: spricht Jahwe der Heerscharen
  rationale: Gibt den Gottesnamen als Eigennamen und צְבָאוֹת direkt mit dem traditionellen, kosmisch-militärischen Titel wieder.
theological_decisions:
- issue: Beschreibt der Vers gegenwärtige Verehrung unter den Völkern oder eine zukünftige beziehungsweise ideale Wirklichkeit?
  choice: Die nominalen und partizipialen Aussagen werden im Präsens wiedergegeben.
  alternative: Eine ausdrückliche Zukunftsform („wird groß sein … wird dargebracht werden“) oder eine als solche markierte prophetische Gegenwart.
  rationale: Der hebräische Wortlaut enthält keine ausdrückliche Zukunftsmarkierung. Das Präsens wahrt die Oberflächenstruktur, während eine Fußnote die zeitliche Deutung offenhält.
- issue: Wie ist die Opfersprache im Blick auf die Verehrung Jahwes unter den Völkern zu verstehen?
  choice: Die kultischen Begriffe „Räucherwerk“ und „Opfergabe“ werden ohne deutende Erweiterung beibehalten.
  alternative: Eine metaphorische Auflösung als Gebet beziehungsweise Gottesdienst oder eine ausdrückliche eschatologische Deutung.
  rationale: Der Text verwendet konkrete Opfersprache; eine direkte Wiedergabe bewahrt die Spannung, ohne ein bestimmtes theologisches Erfüllungsmodell einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit naher Bindung an die hebräische Bildsprache. Die Wiederholung „mein Name ist groß unter den Völkern“ sowie die kultischen Begriffe bleiben erhalten. Die leicht markierte Formulierung „meinem Namen“ bewahrt bewusst den Ausdruck des Ausgangstextes.
