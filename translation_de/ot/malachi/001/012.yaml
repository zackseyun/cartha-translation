source:
  edition: WLC
  text: וְ/אַתֶּ֖ם מְחַלְּלִ֣ים אוֹת֑/וֹ בֶּ/אֱמָרְ/כֶ֗ם שֻׁלְחַ֤ן אֲדֹנָ/י֙ מְגֹאָ֣ל ה֔וּא וְ/נִיב֖/וֹ נִבְזֶ֥ה אָכְלֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/012.yaml
  text: But you are profaning it by saying[a], ‘The table of the Lord is defiled, and its fruit, its food[b], is despised.’
translation:
  language: de
  text: 'Ihr aber entweiht ihn[a], indem ihr sagt: »Der Tisch des Herrn ist verunreinigt, und sein Ertrag – seine Speise – wird verachtet.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Pronomen bezieht sich wahrscheinlich auf den Namen des Herrn in Vers 11; es kann aber auch unmittelbar auf den Herrn bezogen werden.
    reason: alternative_reading
lexical_decisions:
- source_word: מְחַלְּלִים
  choice: entweiht
  rationale: Das Piel von חלל bezeichnet hier, etwas Heiliges als gewöhnlich oder unheilig zu behandeln. »Entweihen« bewahrt die kultische Aussage und klingt im Deutschen natürlich und gewichtig.
- source_word: אוֹתוֹ
  choice: ihn
  rationale: Das Pronomen ist im Hebräischen maskulin und verweist am wahrscheinlichsten auf »meinen Namen« aus Vers 11; da »Name« im Deutschen maskulin ist, lautet der Rückbezug »ihn«. Ein unmittelbarer Bezug auf den Herrn bleibt grammatisch möglich und wird in der Fußnote genannt.
- source_word: בֶּאֱמָרְכֶם
  choice: indem ihr sagt
  rationale: Die Präposition mit dem Infinitivus constructus bezeichnet hier das Mittel beziehungsweise die Art und Weise, durch die die Entweihung geschieht.
- source_word: שֻׁלְחַן אֲדֹנָי
  choice: der Tisch des Herrn
  rationale: Die formale Wiedergabe bewahrt das kultische Bild des Altars als Tisch und das Genitivverhältnis.
- source_word: אֲדֹנָי
  choice: Herr
  rationale: Der Text hat den Gottestitel אֲדֹנָי und nicht das Tetragramm; deshalb steht »Herr«, nicht die für JHWH vorbehaltene Wiedergabe.
- source_word: מְגֹאָל
  choice: verunreinigt
  rationale: Das passive Partizip bezeichnet kultische Befleckung oder Verunreinigung. »Verunreinigt« gibt dies präzise wieder, ohne den Wortstamm von »entweihen« unnötig zu wiederholen.
- source_word: נִיבוֹ
  choice: seine Frucht
  rationale: ניב bedeutet wörtlich »Frucht«, »Ertrag« oder »Hervorgebrachtes«. Die direkte Wiedergabe erhält die verdichtete Ausdrucksweise des Hebräischen.
- source_word: נִבְזֶה
  choice: ist verachtet
  rationale: Die Form beschreibt etwas als gering geachtet beziehungsweise verächtlich behandelt. »Ist verachtet« bewahrt die passive Aussage.
- source_word: אָכְלוֹ
  choice: seine Speise
  rationale: Wörtlich steht »seine Speise«. Die appositionelle Folge »seine Frucht, seine Speise« bewahrt beide hebräischen Ausdrücke und lässt deren genaue Beziehung offen.
theological_decisions:
- issue: Bezugswort des Objektpronomens in »ihr entweiht ihn«
  choice: Das Pronomen wird als Rückverweis auf »meinen Namen« in Vers 11 verstanden.
  alternative: Das Pronomen kann sich unmittelbar auf den Herrn beziehen.
  rationale: Der vorhergehende Vers stellt Gottes Namen in den Mittelpunkt, sodass dieser den naheliegenden Bezug bildet. Weil sowohl »Name« als auch »Herr« im Deutschen maskulin sind, hält »ihn« die im Hebräischen vorhandene Mehrdeutigkeit offen; die Fußnote benennt sie ausdrücklich.
- issue: Wiedergabe des Gottestitels אֲדֹנָי
  choice: des Herrn
  alternative: des HERRN
  rationale: Hier steht אֲדֹנָי, nicht JHWH. Die Übersetzung unterscheidet daher den Titel »Herr« von der besonderen Wiedergabe des Gottesnamens.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kultischer Präzision. Die Syntax bleibt quellennah, ohne unnatürlich zu wirken. Die Wiederholung »seine Frucht, seine Speise« erhält die knappe und möglicherweise appositionelle hebräische Formulierung.
