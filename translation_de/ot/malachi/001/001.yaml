  text: מַשָּׂ֥א דְבַר יְהוָ֖ה אֶל יִשְׂרָאֵ֑ל בְּ/יַ֖ד מַלְאָכִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/001.yaml
  text: 'The burden of the word of the LORD to Israel by the hand of Malachi:'
translation:
  language: de
  text: Ausspruch. Das Wort des HERRN an Israel durch Maleachi:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Maleachi“ kann im Hebräischen auch „mein Bote“ bedeuten.
    reason: Bewahrt die lexikalische Mehrdeutigkeit von מַלְאָכִי, ohne den Haupttext unnötig zu verkomplizieren.
lexical_decisions:
- source_word: מַשָּׂא
  choice: Ausspruch
  rationale: Das Substantiv bezeichnet in prophetischen Überschriften eine gewichtige göttliche Botschaft bzw. einen Ausspruch. „Last“ wäre zwar etymologisch naheliegend, klingt im heutigen Deutsch hier jedoch missverständlich und legt eine negative Bedeutung fest, die der Kontext nicht zwingend verlangt.
- source_word: דְבַר יְהוָה
  choice: Wort des HERRN
  rationale: Gibt die geläufige prophetische Formel sachgerecht und würdig wieder; das Tetragramm wird entsprechend deutscher Bibeltradition mit „HERR“ dargestellt.
- source_word: אֶל יִשְׂרָאֵל
  choice: an Israel
  rationale: Bewahrt die Zielrichtung der Botschaft.
- source_word: בְּיַד מַלְאָכִי
  choice: durch Maleachi
  rationale: Die hebräische Wendung „durch die Hand von“ bezeichnet hier die Vermittlung; natürliches Deutsch gibt sie mit „durch“ wieder.
theological_decisions:
- issue: Bedeutung von מַשָּׂא als Überschrift
  choice: Ausspruch
  alternative: Last
  rationale: „Ausspruch“ bewahrt die Funktion als Bezeichnung einer prophetischen Botschaft, ohne von vornherein ausschließlich Gericht oder Belastung einzutragen; die Gewichtigkeit des Ausdrucks bleibt im Kontext erkennbar.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: HERR
  alternative: JHWH
  rationale: „HERR“ entspricht einer etablierten deutschen Konvention und macht durch Großschreibung kenntlich, dass im Ausgangstext der Gottesname steht.
- issue: מַלְאָכִי als Eigenname oder Funktionsbezeichnung
  choice: Maleachi
  alternative: mein Bote
  rationale: Die traditionelle Lesart als Name passt zur Überschrift und zur Buchbezeichnung; da die hebräische Form zugleich „mein Bote“ bedeuten kann, wird diese echte Mehrdeutigkeit in einer Fußnote bewahrt.
translation_notes:
  register: Moderne, würdevolle prophetische Überschrift. Der Doppelpunkt zeigt an, dass der folgende Abschnitt den angekündigten Ausspruch entfaltet.
