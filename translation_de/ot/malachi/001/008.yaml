  text: וְ/כִֽי תַגִּשׁ֨וּ/ן עִוֵּ֤ר לִ/זְבֹּ֨חַ֙ אֵ֣ין רָ֔ע וְ/כִ֥י תַגִּ֛ישׁוּ פִּסֵּ֥חַ וְ/חֹלֶ֖ה אֵ֣ין רָ֑ע הַקְרִיבֵ֨/הוּ נָ֜א לְ/פֶחָתֶ֗/ךָ הֲ/יִּרְצְ/ךָ֙ א֚וֹ הֲ/יִשָּׂ֣א פָנֶ֔י/ךָ אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/008.yaml
  text: When you present a blind animal for sacrifice[a], is that not evil? And when you present one that is lame or sick, is that not evil? Present it, please, to your governor. Will he accept you[c][b], or show you favor? says Yahweh of hosts.
translation:
  language: de
  text: Wenn ihr ein blindes Tier als Opfer darbringt – ist das etwa nichts Böses?[a] Und wenn ihr ein lahmes oder krankes Tier darbringt – ist das etwa nichts Böses? Bring es doch deinem Statthalter dar! Wird er Gefallen an dir haben,[b] oder wird er dir Gunst erweisen?[c] – spricht Jahwe der Heerscharen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht an beiden Stellen: „Da ist nichts Böses.“ Im Zusammenhang ist dies als vorwurfsvolle, ironische Frage wiedergegeben.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Wird er dich wohlwollend annehmen?“'
    reason: alternative_reading
  - marker: c
    text: 'Wörtlich: „Wird er dein Angesicht erheben?“ Das hebräische Idiom bezeichnet eine günstige Aufnahme oder erwiesene Gunst.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַגִּשׁוּן / תַגִּישׁוּ
  choice: darbringen
  rationale: Der Hifil von נגשׁ bezeichnet hier das Heranbringen einer Opfergabe. „Darbringen“ passt sowohl zum Opferkontext als auch zur ironischen Aufforderung gegenüber dem Statthalter.
- source_word: עִוֵּר
  choice: ein blindes Tier
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet im Kontext ein fehlerhaftes Opfertier; „Tier“ wird im Deutschen zur natürlichen Verdeutlichung ergänzt.
- source_word: לִזְבֹּחַ
  choice: zum Schlachten
  rationale: Der Infinitiv bezeichnet den Opferzweck. „Zum Schlachten“ wahrt den konkreten Sinn von זבח, ohne die Handlung bereits mit dem allgemeineren „opfern“ gleichzusetzen.
- source_word: אֵין רָע
  choice: ist das etwa nichts Böses?
  rationale: Wörtlich lautet die Wendung „da ist nichts Böses“. Als rhetorische Frage gibt sie im Kontext den vorwurfsvollen, ironischen Ton wieder; „etwa“ unterstreicht die Herausforderung.
- source_word: פִּסֵּחַ
  choice: lahm
  rationale: Das Adjektiv bezeichnet ein Tier mit einer das Gehen beeinträchtigenden Fehlbildung oder Verletzung; „lahm“ ist präzise und geläufig.
- source_word: חֹלֶה
  choice: krank
  rationale: „Krank“ ist eine klare, allgemein verständliche Entsprechung und legt keine spezifische Erkrankung fest.
- source_word: הַקְרִיבֵהוּ נָא
  choice: Bring es doch ... dar!
  rationale: Der Imperativ mit נָא ist hier eine zugespitzte, ironische Aufforderung. „doch“ vermittelt diese pragmatische Funktion im modernen Deutschen natürlicher als „bitte“.
- source_word: פֶחָה
  choice: Statthalter
  rationale: Das Wort bezeichnet einen persischzeitlichen Provinzverwalter. „Statthalter“ bildet diese historische Amtsstellung prägnant ab.
- source_word: הֲיִרְצְךָ
  choice: Wird er Gefallen an dir haben
  rationale: רצה kann Wohlgefallen beziehungsweise günstige Annahme bezeichnen. Die Form bezieht sich auf die angesprochene Person, nicht nur auf deren Gabe.
- source_word: הֲיִשָּׂא פָנֶיךָ
  choice: wird er dir Gunst erweisen
  rationale: Die wörtliche Wendung „dein Angesicht erheben“ ist ein Idiom für günstige Aufnahme oder Bevorzugung; „Gunst erweisen“ gibt den Sinn verständlich wieder.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: „Jahwe“ gibt den Gottesnamen als Namen wieder. „Heerscharen“ bewahrt die traditionelle, weite Bildsprache des Titels, ohne sie auf menschliche Armeen zu verengen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen יהוה. „Jahwe“ gibt ihn als Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Aussageform und rhetorische Kraft von אֵין רָע
  choice: 'rhetorische Frage: „ist das etwa nichts Böses?“'
  alternative: 'wörtliche Aussage: „da ist nichts Böses“'
  rationale: Die formale Aussage kann die von Maleachi angegriffene Haltung zitieren oder ironisch aufgreifen. Im Zusammenhang machen rhetorische Fragen die zurechtweisende Kraft deutlich; die wörtliche Gestalt wird in der Fußnote offengelegt.
- issue: Verhältnis von רצה und נשא פנים
  choice: „Gefallen an dir haben“ und „dir Gunst erweisen“
  alternative: „dich annehmen“ und „dein Angesicht erheben“
  rationale: 'Die Übersetzung hält die beiden parallelen, aber nicht völlig identischen Aussagen auseinander: persönliche Billigung einerseits und gewährte Gunst andererseits.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zweimalige rhetorische Frage bewahrt den scharfen Vorwurf; „doch“ trägt den ironischen Ton von נָא. „Statthalter“ markiert das historische Amt, und „Jahwe der Heerscharen“ erhält Eigenname und Gottestitel.
