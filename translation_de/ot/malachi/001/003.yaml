source:
  edition: WLC
  text: וְ/אֶת עֵשָׂ֖ו שָׂנֵ֑אתִי וָ/אָשִׂ֤ים אֶת הָרָי/ו֙ שְׁמָמָ֔ה וְ/אֶת נַחֲלָת֖/וֹ לְ/תַנּ֥וֹת מִדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/003.yaml
  text: but Esau I hated[c][b][a], and I made his mountains a desolation and his inheritance for the jackals of the wilderness.
translation:
  language: de
  text: Esau aber habe ich gehasst[a]. Ich machte seine Berge zur Einöde[b] und sein Erbteil zum Gebiet der Schakale in der Wüste[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verworfen“ beziehungsweise „weniger geliebt“. Das hebräische Verb bedeutet gewöhnlich „hassen“; die Alternativen deuten die Aussage als Zurücksetzung oder geringere Bevorzugung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sein Bergland“.'
    reason: lexical_alternative
  - marker: c
    text: 'Traditionell: „Drachen der Wüste“; nach heutigem Verständnis sind wahrscheinlich Schakale gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂנֵאתִי
  choice: habe ich gehasst
  rationale: Das Qal von שׂנא bedeutet gewöhnlich „hassen“. Die direkte Formulierung bewahrt die Schärfe und theologische Spannung des Hebräischen, statt sie deutend abzumildern.
- source_word: וָאָשִׂים
  choice: Ich machte
  rationale: שׂים kann „setzen, stellen, machen“ bedeuten. Mit שְׁמָמָה bezeichnet „machen zu“ idiomatisch den herbeigeführten Zustand.
- source_word: הָרָיו
  choice: seine Berge
  rationale: Der Plural von הַר wird direkt mit „Berge“ wiedergegeben; je nach geografischem Bezug ist auch „Bergland“ möglich.
- source_word: שְׁמָמָה
  choice: zur Einöde
  rationale: „Einöde“ gibt das Substantiv für Verwüstung in knapper, würdiger prophetischer Sprache wieder.
- source_word: נַחֲלָתוֹ
  choice: sein Erbteil
  rationale: „Erbteil“ bewahrt den Gedanken eines ererbten Besitzes und den möglichen Land- beziehungsweise Bundesanklang von נַחֲלָה.
- source_word: לְתַנּוֹת מִדְבָּר
  choice: zum Gebiet der Schakale in der Wüste
  rationale: תַנּוֹת wird nach heutigem lexikalischem Verständnis als „Schakale“ aufgefasst. Die Formulierung macht natürlich verständlich, dass das verwüstete Erbteil diesen Wüstentieren überlassen wurde.
- source_word: וְאֶת
  choice: aber
  rationale: Das formal koordinierende וְ führt im Zusammenhang den Gegensatz zu Jakob aus Vers 2 fort; „aber“ bildet diese adversative Funktion im Deutschen natürlich ab.
theological_decisions:
- issue: Aussage über Gottes Hass gegenüber Esau
  choice: Die direkte Aussage „habe ich gehasst“ bleibt im Haupttext stehen.
  alternative: „habe ich verworfen“ oder „habe ich weniger geliebt“
  rationale: Der hebräische Wortlaut verwendet das gewöhnliche Verb für „hassen“. Abschwächende Wiedergaben würden eine mögliche Deutung von Erwählung, Zurücksetzung oder Bundespräferenz in den Haupttext eintragen und die Spannung vorzeitig auflösen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem prophetischem Ton. Die markierte Gegenüberstellung „Esau aber“ knüpft an Jakob in Vers 2 an. „Erbteil“ erhält die land- und bundesbezogene Färbung, während „Einöde“ die Verwüstung knapp und bildhaft ausdrückt.
