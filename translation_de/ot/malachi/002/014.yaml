source:
  edition: WLC
  text: וַ/אֲמַרְתֶּ֖ם עַל מָ֑ה עַ֡ל כִּי יְהוָה֩ הֵעִ֨יד בֵּינְ/ךָ֜ וּ/בֵ֣ין אֵ֣שֶׁת נְעוּרֶ֗י/ךָ אֲשֶׁ֤ר אַתָּה֙ בָּגַ֣דְתָּה בָּ֔/הּ וְ/הִ֥יא חֲבֶרְתְּ/ךָ֖ וְ/אֵ֥שֶׁת בְּרִיתֶֽ/ךָ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/014.yaml
  text: But you say[a], “Why?” Because Yahweh has been a witness between you and the wife of your youth, to whom you have been unfaithful[b], though she is your companion and your wife by covenant.
translation:
  language: de
  text: 'Doch ihr sagt: »Warum?« Weil Jahwe Zeuge zwischen dir und der Frau deiner Jugend gewesen ist, an der du treulos gehandelt hast[a], obwohl sie deine Gefährtin und die Frau deines Bundes ist[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „die du verraten hast“. Das hebräische Verb kann treuloses Handeln, Verrat oder Wortbruch bezeichnen, besonders im Zusammenhang eines Bundes.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „deine Bundesfrau“ oder „die Frau, mit der du im Bund verbunden bist“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: Doch ihr fragt
  rationale: Das Waw leitet hier den Einwand der Angesprochenen ein. „Doch“ gibt den Gegensatz zum vorherigen Vorwurf natürlich wieder; wegen des unmittelbar folgenden „Warum?“ ist „fragt“ im Deutschen idiomatischer als das wörtliche „sagt“.
- source_word: עַל־מָה
  choice: Warum?
  rationale: Die knappe deutsche Frage entspricht der hebräischen Wendung und bewahrt ihre rhetorische Schärfe.
- source_word: עַל כִּי
  choice: Weil
  rationale: Die Wendung führt die Antwort auf die vorausgehende Frage ein.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird transliteriert und nicht durch einen Titel ersetzt.
- source_word: הֵעִיד
  choice: als Zeuge … aufgetreten ist
  rationale: Die Form bezeichnet hier Jahwes Zeugenschaft im rechtlich-bundeshaften Verhältnis. Diese Formulierung ist im Deutschen natürlicher als „Zeuge gewesen ist“ und wahrt den gerichtlichen Klang.
- source_word: בֵּינְךָ וּבֵין
  choice: zwischen dir und
  rationale: Die Präpositionsfolge bezeichnet die beiden Parteien, zwischen denen Jahwe als Zeuge steht.
- source_word: אֵשֶׁת נְעוּרֶיךָ
  choice: der Frau deiner Jugend
  rationale: Die bildkräftige hebräische Wendung bleibt erhalten und bezeichnet die Frau, mit der der Mann seit seiner Jugend verbunden ist.
- source_word: אֲשֶׁר אַתָּה בָּגַדְתָּה בָּהּ
  choice: an der du treulos gehandelt hast
  rationale: בגד bezeichnet Verrat beziehungsweise treuloses Handeln, besonders in einem Bundeskontext. „An der“ gibt die gegen sie gerichtete Handlung im Deutschen idiomatisch wieder.
- source_word: וְהִיא
  choice: obwohl sie … ist
  rationale: 'Der Zusammenhang ist konzessiv: Sein treuloses Verhalten steht im scharfen Gegensatz zu ihrer bestehenden Beziehung als Gefährtin und Bundesfrau.'
- source_word: חֲבֶרְתְּךָ
  choice: deine Gefährtin
  rationale: „Gefährtin“ bezeichnet eine eng verbundene Lebensbegleiterin und passt zum ehelichen Zusammenhang.
- source_word: אֵשֶׁת בְּרִיתֶךָ
  choice: die Frau deines Bundes
  rationale: Die formnahe Wiedergabe bewahrt ausdrücklich den Bundescharakter der Ehe, ohne ihn durch eine spätere dogmatische Formulierung näher zu bestimmen.
theological_decisions:
- issue: Bundescharakter der Ehe
  choice: Jahwe erscheint als Zeuge, und die Ehefrau wird ausdrücklich als „die Frau deines Bundes“ bezeichnet.
  alternative: Die Aussage lediglich als zwischenmenschliche Untreue wiederzugeben, ohne den Bund ausdrücklich zu nennen.
  rationale: בגד und בְּרִיתֶךָ verbinden den Vorwurf der Treulosigkeit unmittelbar mit dem Bund. Diese rechtliche und theologische Spannung muss im Text sichtbar bleiben.
- issue: Wechsel von der Mehrzahl zur Einzahl
  choice: „ihr fragt“ und anschließend „zwischen dir“
  alternative: Die Anrede zur stilistischen Glättung vollständig in die Mehrzahl oder Einzahl zu setzen.
  rationale: Der hebräische Text wechselt von der kollektiven Anrede in der Mehrzahl zur beispielhaften beziehungsweise individuellen Anrede in der Einzahl. Die Übersetzung bewahrt diesen bedeutsamen Wechsel.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anredeformen folgen bewusst dem hebräischen Wechsel von der Mehrzahl zur Einzahl. Die Formulierung „Frau deines Bundes“ ist leicht ungewohnt, bewahrt aber die prägnante Bundesmetaphorik des Ausgangstextes; eine Fußnote nennt natürlichere Alternativen.
