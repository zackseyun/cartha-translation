source:
  edition: WLC
  text: אִם לֹ֣א תִשְׁמְע֡וּ וְ/אִם לֹא֩ תָשִׂ֨ימוּ עַל לֵ֜ב לָ/תֵ֧ת כָּב֣וֹד לִ/שְׁמִ֗/י אָמַר֙ יְהוָ֣ה צְבָא֔וֹת וְ/שִׁלַּחְתִּ֤י בָ/כֶם֙ אֶת הַ/מְּאֵרָ֔ה וְ/אָרוֹתִ֖י אֶת בִּרְכֽוֹתֵי/כֶ֑ם וְ/גַם֙ אָרוֹתִ֔י/הָ כִּ֥י אֵינְ/כֶ֖ם שָׂמִ֥ים עַל לֵֽב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/002.yaml
  text: If you will not listen[a], and if you will not take it to heart to give glory to my name, says Yahweh of Armies, then I will send the curse among you, and I will curse your blessings; indeed, I have already cursed them[b], because you are not taking it to heart.
translation:
  language: de
  text: Wenn ihr nicht hört und es euch nicht zu Herzen nehmt, meinem Namen Ehre zu geben, spricht Jahwe der Heerscharen[a], dann werde ich den Fluch über euch senden und eure Segnungen verfluchen. Ja, ich habe sie bereits verflucht[b], weil ihr es euch nicht zu Herzen nehmt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jahwe der Heere“. Traditionell: „der HERR der Heerscharen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Hebräische kann auch bedeuten: „Ich werde sie ebenfalls verfluchen“; das Suffix steht formal im Femininum Singular, daher ist auch „ich habe es bereits verflucht“ möglich.'
    reason: alternative_reading
lexical_decisions:
- source_word: תִשְׁמְעוּ
  choice: hört
  rationale: Das Grundverb bezeichnet Hören bzw. aufmerksames Zuhören und kann im Kontext Gehorsam einschließen. „Hört“ bewahrt diese Bedeutungsbreite, ohne den Gehorsamsaspekt ausdrücklich einzutragen.
- source_word: תָשִׂימוּ עַל לֵב
  choice: es euch zu Herzen nehmt
  rationale: 'Die geläufige deutsche Wendung gibt das hebräische Idiom natürlich wieder und bewahrt seine Bedeutung: etwas ernst nehmen und aufmerksam bedenken.'
- source_word: לָתֵת כָּבוֹד לִשְׁמִי
  choice: meinem Namen Ehre zu geben
  rationale: „Ehre geben“ ist in modernem Deutsch natürlich und bildet כָּבוֹד angemessen ab; „meinem Namen“ bewahrt den Bezug auf Jahwes offenbarte Identität und Ansehen.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: „Jahwe“ gibt den Gottesnamen wieder. „Heerscharen“ ist eine würdevolle, etablierte Wiedergabe von צְבָאוֹת und umfasst mehr als ausschließlich menschliche Armeen.
- source_word: וְשִׁלַּחְתִּי בָכֶם אֶת הַמְּאֵרָה
  choice: dann sende ich den Fluch unter euch
  rationale: Das Präsens kann im Deutschen eine fest angekündigte Zukunft ausdrücken. „Unter euch“ bildet die Präposition ב ab und stellt den Fluch als in ihre Mitte gesandt dar.
- source_word: וְאָרוֹתִי אֶת בִּרְכוֹתֵיכֶם
  choice: und verfluche eure Segnungen
  rationale: Die direkte Formulierung bewahrt die Mehrdeutigkeit, ob empfangene Segnungen oder von den Priestern ausgesprochene Segensworte gemeint sind.
- source_word: וְגַם אָרוֹתִיהָ
  choice: Ja, ich habe sie bereits verflucht
  rationale: „Ja“ gibt die verstärkende Fortführung durch וְגַם wieder. Das Perfekt wird als schon eingetretene Handlung verstanden; Genus und Numerus des Suffixes bleiben jedoch textlich auffällig und werden in einer Fußnote erläutert.
- source_word: כִּי אֵינְכֶם שָׂמִים עַל לֵב
  choice: weil ihr es euch nicht zu Herzen nehmt
  rationale: Die Wiederholung derselben deutschen Wendung bildet die rhetorische Wiederaufnahme des hebräischen Idioms ab.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, sodass der Bundesname im Text sichtbar bleibt. Die traditionelle Umschreibung „der HERR“ wäre ebenfalls geläufig, würde den Namen jedoch ersetzen.
- issue: Bezug von „eure Segnungen“
  choice: Die offene Formulierung „eure Segnungen“ wird beibehalten
  alternative: euch gewährte Segnungen oder von euch ausgesprochene Segensworte
  rationale: Der Kontext richtet sich an Priester, doch die hebräische Formulierung entscheidet nicht ausdrücklich, ob ihre Segenssprüche, ihre empfangenen Segnungen oder beides gemeint ist.
- issue: Zeitwert und Suffix von אָרוֹתִיהָ
  choice: ich habe sie bereits verflucht
  alternative: ich werde sie ebenfalls verfluchen / ich habe es bereits verflucht
  rationale: Der Wechsel zum Perfekt legt nahe, dass das Gericht bereits eingesetzt hat. Zugleich ist eine zukunftsbezogene prophetische Verwendung möglich, und das feminine Singularsuffix kann formal singularisch verstanden werden; diese Spannung wird nicht verschwiegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an die hebräische Satzstruktur. Die idiomatische Wendung „sich etwas zu Herzen nehmen“ wird an beiden Stellen gleich wiedergegeben. Die Mehrdeutigkeit der Segnungen sowie des abschließenden Perfekts und Suffixes bleibt durch Text und Fußnote erhalten.
