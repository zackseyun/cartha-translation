source:
  edition: WLC
  text: יַכְרֵ֨ת יְהוָ֜ה לָ/אִ֨ישׁ אֲשֶׁ֤ר יַעֲשֶׂ֨/נָּה֙ עֵ֣ר וְ/עֹנֶ֔ה מֵ/אָהֳלֵ֖י יַֽעֲקֹ֑ב וּ/מַגִּ֣ישׁ מִנְחָ֔ה לַֽ/יהוָ֖ה צְבָאֽוֹת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/012.yaml
  text: May Yahweh cut off from the tents of Jacob the man who does this[a], him who is awake and him who answers, and him who brings an offering to Yahweh of hosts.
translation:
  language: de
  text: 'Yahweh möge aus den Zelten Jakobs jeden ausrotten, der dies tut: den Wachenden und den Antwortenden[a] und den, der Yahweh der Heerscharen eine Opfergabe darbringt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wachend und antwortend“. Die hebräische Wendung ist schwer zu deuten. Gemeint sein könnten etwa „Zeuge und Fürsprecher“ oder, als umfassende Redewendung, alle Beteiligten.'
    reason: alternative_reading
lexical_decisions:
- source_word: יַכְרֵת
  choice: möge … ausrotten
  rationale: Das Hifil von כרת bezeichnet hier ein Ausschließen bzw. Vernichten im Gericht. Die Form lässt sich im Zusammenhang als Wunsch- oder Fluchformel wiedergeben; „möge“ bewahrt diese jussivische Kraft.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לָאִישׁ אֲשֶׁר יַעֲשֶׂנָּה
  choice: jeden …, der dies tut
  rationale: Der maskuline Singular hat repräsentative Bedeutung. „Jeden“ bildet den allgemeinen Geltungsbereich im Deutschen natürlich ab; „dies“ verweist auf das zuvor verurteilte Verhalten.
- source_word: עֵר וְעֹנֶה
  choice: den Wachenden und den Antwortenden
  rationale: Die Partizipien werden möglichst transparent wiedergegeben, da die idiomatische Bedeutung der schwierigen Wendung unsicher ist.
- source_word: מֵאָהֳלֵי יַעֲקֹב
  choice: aus den Zelten Jakobs
  rationale: Die konkrete Bildsprache für die Gemeinschaft Israels bleibt erhalten.
- source_word: וּמַגִּישׁ מִנְחָה
  choice: und den, der … eine Opfergabe darbringt
  rationale: Die einfache hebräische Verbindung wird ohne einen nicht ausdrücklich markierten Gegensatz wie „dennoch“ wiedergegeben. Das Partizip bezeichnet jemanden, der im Kult eine Gabe darbringt.
- source_word: מִנְחָה
  choice: Opfergabe
  rationale: מִנְחָה kann Gabe, Tribut oder Speiseopfer bezeichnen. „Opfergabe“ wahrt im kultischen Zusammenhang die Bedeutung, ohne die Art des Opfers unnötig festzulegen.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh der Heerscharen
  rationale: Die Wiedergabe erhält sowohl den Gottesnamen als auch das Bild der צְבָאוֹת, der Heerscharen.
theological_decisions:
- issue: Aussageweise von יַכְרֵת in der prophetischen Gerichtsrede
  choice: Yahweh möge … ausrotten
  alternative: Yahweh wird … ausrotten
  rationale: Der Kontext erlaubt und begünstigt eine jussivische Verwünschung. Die Übersetzung wahrt diese rhetorische Form, ohne den Gerichtssinn abzuschwächen.
- issue: Deutung von עֵר וְעֹנֶה
  choice: Eine relativ wörtliche Wiedergabe im Haupttext mit erklärender Fußnote
  alternative: Zeuge und Fürsprecher; eine umfassende Bezeichnung für alle Beteiligten
  rationale: Die genaue idiomatische Bedeutung ist nicht sicher. Der Haupttext soll diese Unsicherheit nicht durch eine einzelne Auslegung verdecken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Wendung „den Wachenden und den Antwortenden“ bleibt wegen der Unsicherheit des Hebräischen bewusst sichtbar; die Satzgliederung macht den schwierigen Aufbau zugleich lesbar.
