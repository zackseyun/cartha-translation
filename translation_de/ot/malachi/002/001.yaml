source:
  edition: WLC
  text: וְ/עַתָּ֗ה אֲלֵי/כֶ֛ם הַ/מִּצְוָ֥ה הַ/זֹּ֖את הַ/כֹּהֲנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/001.yaml
  text: And now[a], this command is for you, O priests.
translation:
  language: de
  text: Und nun ergeht dieses Gebot an euch, ihr Priester.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl die verbindende Konjunktion als auch den zeitlich-rhetorischen Übergang von der vorausgehenden Zurechtweisung zur direkten Anrede.
- source_word: אֲלֵיכֶם
  choice: an euch
  rationale: אֶל bezeichnet hier die Adressaten, an die das Gebot gerichtet ist. Die Verbindung „ergeht … an euch“ gibt dies im Deutschen natürlich und präzise wieder, ohne die mögliche Bedeutung „gegen euch“ einzutragen.
- source_word: הַמִּצְוָה
  choice: Gebot
  rationale: מִצְוָה bezeichnet einen verbindlichen Befehl oder eine Weisung. „Gebot“ entspricht dem Ausdruck im prophetischen Kontext und wahrt dessen Autorität.
- source_word: הַזֹּאת
  choice: dieses
  rationale: Der Demonstrativartikel bestimmt das unmittelbar angekündigte Gebot und wird im Deutschen regulär vor das Substantiv gestellt.
- source_word: הַכֹּהֲנִים
  choice: ihr Priester
  rationale: Das Substantiv steht als direkte Anrede. „Ihr Priester“ kennzeichnet den Vokativ in modernem, würdigem Deutsch natürlicher als „o Priester“.
theological_decisions: []
translation_notes:
  register: Knappe, nachdrückliche prophetische Anrede in modernem Standarddeutsch. Die Konstruktion „ergeht … an euch“ bildet den elliptischen hebräischen Nominalsatz idiomatisch ab und erhält zugleich die gezielte Ausrichtung des Gebots auf die Priester.
