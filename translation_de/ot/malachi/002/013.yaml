source:
  edition: WLC
  text: וְ/זֹאת֙ שֵׁנִ֣ית תַּֽעֲשׂ֔וּ כַּסּ֤וֹת דִּמְעָה֙ אֶת מִזְבַּ֣ח יְהוָ֔ה בְּכִ֖י וַֽ/אֲנָקָ֑ה מֵ/אֵ֣ין ע֗וֹד פְּנוֹת֙ אֶל הַ/מִּנְחָ֔ה וְ/לָ/קַ֥חַת רָצ֖וֹן מִ/יֶּדְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/013.yaml
  text: 'And this second thing you do: you cover the altar of Yahweh with tears[a], with weeping and groaning, because he no longer regards the offering or accepts it with favor from your hand.'
translation:
  language: de
  text: 'Und dies ist das Zweite, was ihr tut: Ihr bedeckt den Altar Jahwes mit Tränen, mit Weinen und Stöhnen, weil er sich der Opfergabe[a] nicht mehr zuwendet und sie nicht mehr wohlgefällig aus eurer Hand annimmt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem Speisopfer“. Das hebräische Wort מִנְחָה kann ein bestimmtes Speisopfer oder allgemeiner eine Opfergabe bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת שֵׁנִית
  choice: Und dies ist das Zweite
  rationale: Die Formulierung führt einen weiteren Anklagepunkt ein und bewahrt die ordinale Bedeutung von שֵׁנִית in natürlichem Deutsch.
- source_word: תַּעֲשׂוּ
  choice: was ihr tut
  rationale: Das Imperfekt bezeichnet hier ein gegenwärtiges beziehungsweise wiederkehrendes Handeln innerhalb der prophetischen Anklage.
- source_word: כַּסּוֹת דִּמְעָה אֶת מִזְבַּח יְהוָה
  choice: Ihr bedeckt den Altar Jahwes mit Tränen
  rationale: „Bedecken“ gibt כסה direkt wieder und erhält das eindringliche Bild des hebräischen Textes.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen geläufige Wiedergabe des göttlichen Eigennamens bewahrt den Namen, statt ihn durch einen Titel zu ersetzen.
- source_word: בְּכִי וַאֲנָקָה
  choice: mit Weinen und Stöhnen
  rationale: Die beiden Ausdrücke bezeichnen hörbaren Kummer; die Wortwahl ist klar, würdevoll und nahe an der hebräischen Bildsprache.
- source_word: מֵאֵין עוֹד פְּנוֹת אֶל
  choice: weil er sich … nicht mehr zuwendet
  rationale: Die Wendung drückt aus, dass die Hinwendung beziehungsweise Beachtung aufgehört hat. „Sich zuwenden“ bewahrt das Bild von פנה, ohne dessen Bedeutung vorschnell auf bloßes Anschauen zu verengen.
- source_word: הַמִּנְחָה
  choice: der Opfergabe
  rationale: מִנְחָה kann ein bestimmtes Speisopfer oder allgemeiner eine Opfergabe bezeichnen. Der Oberbegriff bleibt im Kontext angemessen; die engere Möglichkeit wird in der Fußnote genannt.
- source_word: וְלָקַחַת רָצוֹן מִיֶּדְכֶם
  choice: und sie nicht mehr wohlgefällig aus eurer Hand annimmt
  rationale: Die Formulierung gibt sowohl das Annehmen beziehungsweise Empfangen als auch רָצוֹן im Sinn gnädiger oder wohlgefälliger Annahme wieder und erhält das Bild der Hand.
theological_decisions:
- issue: Subjekt der Verben „sich zuwenden“ und „annehmen“
  choice: Das unausgesprochene Subjekt wird mit „er“ auf Jahwe bezogen.
  alternative: Eine unpersönliche Formulierung wie „weil der Opfergabe keine Beachtung mehr geschenkt wird“.
  rationale: Der unmittelbare Zusammenhang handelt davon, dass Jahwe die dargebrachten Gaben nicht mehr beachtet oder annimmt. Das Pronomen macht die im Hebräischen komprimierte Aussage im Deutschen verständlich, ohne eine zusätzliche theologische Behauptung einzuführen.
- issue: Logisches Verhältnis des abschließenden Satzteils
  choice: „weil“
  alternative: „sodass“ beziehungsweise eine rein beigeordnete Formulierung
  rationale: Die Tränen und Klagen werden als Reaktion auf Jahwes ausbleibende Annahme der Opfergabe verstanden. Die hebräische Konstruktion mit מֵאֵין lässt die Begründung natürlich hervortreten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die direkte Anrede im Plural und das starke Bild des mit Tränen bedeckten Altars bleiben erhalten. Der Fußnotenmarker steht unmittelbar bei dem lexikalisch mehrdeutigen Ausdruck „Opfergabe“.
