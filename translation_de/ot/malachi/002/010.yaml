  text: הֲ/ל֨וֹא אָ֤ב אֶחָד֙ לְ/כֻלָּ֔/נוּ הֲ/ל֛וֹא אֵ֥ל אֶֽחָ֖ד בְּרָאָ֑/נוּ מַדּ֗וּעַ נִבְגַּד֙ אִ֣ישׁ בְּ/אָחִ֔י/ו לְ/חַלֵּ֖ל בְּרִ֥ית אֲבֹתֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/010.yaml
  text: Do we not all have one Father? Has not one God created us? Why then are we faithless[a], each man to his brother[b], profaning the covenant of our fathers?
translation:
  language: de
  text: Haben wir nicht alle einen Vater[b]? Hat uns nicht ein einziger Gott erschaffen? Warum handelt dann jeder von uns seinem Bruder gegenüber treulos[a] und entweiht damit den Bund unserer Väter?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Warum handelt dann jeder von uns verräterisch gegenüber seinem Bruder?“ Das hebräische Verb bezeichnet treuloses oder verräterisches Handeln, besonders innerhalb einer verbindlichen Beziehung.'
    reason: lexical_alternative
  - marker: b
    text: Der „eine Vater“ ist im Zusammenhang wahrscheinlich Gott, wie die parallele Aussage vom einen Gott, der uns erschaffen hat, nahelegt. Möglich ist auch ein Verständnis als gemeinsamer Stammvater.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלוֹא
  choice: Haben wir nicht / Hat uns nicht
  rationale: Leitet rhetorische Fragen ein, die eine bejahende Antwort erwarten; die deutsche Formulierung bewahrt diese Wirkung.
- source_word: אָב אֶחָד לְכֻלָּנוּ
  choice: Haben wir nicht alle einen Vater?
  rationale: Bewahrt die Einzahl und das Einheitsmotiv, ohne die Identität des Vaters im Haupttext ausdrücklich festzulegen.
- source_word: אֵל אֶחָד
  choice: ein Gott
  rationale: Gibt Substantiv und Zahlwort direkt wieder und wahrt die Betonung der Einheit Gottes.
- source_word: בְּרָאָנוּ
  choice: hat uns ... erschaffen
  rationale: ברא bezeichnet besonders das göttliche Schaffen; „erschaffen“ trägt dieses Gewicht im Deutschen.
- source_word: מַדּוּעַ
  choice: Warum ... dann
  rationale: „Dann“ macht den Folgerungszusammenhang zwischen den vorausgehenden Fragen und dem Vorwurf natürlich deutlich.
- source_word: נִבְגַּד
  choice: handeln wir ... treulos
  rationale: בגד bezeichnet treuloses oder verräterisches Handeln, besonders im Rahmen einer Beziehung oder eines Bundes.
- source_word: אִישׁ בְּאָחִיו
  choice: einer an seinem Bruder
  rationale: „Einer“ gibt den distributiven Gebrauch von אִישׁ wieder; „an seinem Bruder“ bleibt nahe an der Präposition ב und vermeidet eine stärkere feindselige Nuance, als der Ausdruck zwingend verlangt.
- source_word: לְחַלֵּל
  choice: und entweihen so
  rationale: Der Infinitiv kann Folge oder Zweck ausdrücken. „So“ verbindet die Entweihung natürlich mit dem treulosen Handeln, ohne die Beziehung zu eng festzulegen.
- source_word: בְּרִית אֲבֹתֵינוּ
  choice: den Bund unserer Väter
  rationale: Bewahrt die Genitivverbindung und die geschichtliche Kontinuität mit den Vorfahren.
theological_decisions:
- issue: Identität des „einen Vaters“
  choice: Im Text steht schlicht „einen Vater“; die Parallele zum einen Gott legt Gott als Vater nahe.
  alternative: Der Ausdruck kann als Hinweis auf einen gemeinsamen Stammvater verstanden werden.
  rationale: Der hebräische Text nennt zunächst „einen Vater“ und danach gesondert den „einen Gott“, der alle erschaffen hat. Die Übersetzung wahrt diese Formulierung und löst die mögliche Spannung nicht stillschweigend auf.
- issue: Beziehung zwischen Treulosigkeit und Entweihung des Bundes
  choice: „und entweihen so“ gibt die Entweihung als Folge oder begleitende Wirkung des treulosen Handelns wieder.
  alternative: „um ... zu entweihen“ als ausdrückliche Zweckangabe.
  rationale: Das ל des Infinitivs lässt Zweck oder Ergebnis zu; die gewählte Form vermeidet eine unnötige Festlegung auf bewusste Absicht.
- issue: Geschlechtsspezifische Formulierung in אִישׁ ... אָחִיו
  choice: „einer an seinem Bruder“ bewahrt den maskulinen Bruderausdruck.
  alternative: „einer am anderen“ oder „einer am Mitmenschen“.
  rationale: Das Hebräische verwendet maskuline Singularformen mit gemeinschaftsweiter, distributiver Kraft; die Übersetzung neutralisiert den konkreten Verwandtschaftsausdruck nicht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorischen Fragen bleiben knapp und eindringlich; „Bund unserer Väter“ erhält den biblisch-bundestheologischen Klang, ohne altertümlich zu wirken.
