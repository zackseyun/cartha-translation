source:
  edition: WLC
  text: הִנְ/נִ֨י גֹעֵ֤ר לָ/כֶם֙ אֶת הַ/זֶּ֔רַע וְ/זֵרִ֤יתִי פֶ֨רֶשׁ֙ עַל פְּנֵי/כֶ֔ם פֶּ֖רֶשׁ חַגֵּי/כֶ֑ם וְ/נָשָׂ֥א אֶתְ/כֶ֖ם אֵלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/003.yaml
  text: Look[a], I am rebuking your offspring[c][b], and I will spread dung on your faces—the dung of your festival sacrifices—and one will carry you away with it.
translation:
  language: de
  text: Siehe, ich werde eure Nachkommen[a] zurechtweisen. Ich werde euch Mist ins Gesicht streuen, den Mist eurer Feste[b], und man wird euch zu ihm hintragen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich auch „eure Saat“ oder „euren Samen“; möglicherweise sind Getreide oder Ernte statt der Nachkommen gemeint.
    reason: alternative_reading
  - marker: b
    text: Gemeint ist wahrscheinlich der Mist oder Unrat der Tiere, die bei euren Festen geopfert werden.
    reason: lexical_alternative
  - marker: c
    text: Der hebräische Schlusssatz ist schwer verständlich. Wörtlich steht „zu ihm hin“, wahrscheinlich mit Bezug auf den Mist. Gemeint ist wohl, dass die Priester zu dem Opferabfall an einen unreinen Ort geschafft werden.
    reason: alternative_reading
lexical_decisions:
- source_word: הִנְנִי
  choice: Seht, ich
  rationale: Die Präsentativform kündigt Gottes unmittelbar bevorstehendes Handeln nachdrücklich an. „Seht“ ist verständlich und bewahrt den aufrüttelnden Charakter.
- source_word: גֹעֵר
  choice: schelte
  rationale: גער bezeichnet ein machtvolles Schelten oder Zurechtweisen und kann im Gerichtskontext zugleich eine Drohung einschließen. „Schelte“ bewahrt den lexikalischen Kern, ohne die Drohkomponente allein festzuschreiben.
- source_word: הַזֶּרַע
  choice: eure Nachkommen
  rationale: זֶרַע kann wörtlich Saat/Samen und übertragen Nachkommenschaft bedeuten. Im Gerichtswort an die Priester ist die Nachkommenschaft wahrscheinlich gemeint; die sachlich mögliche landwirtschaftliche Deutung wird in der Fußnote erhalten.
- source_word: וְזֵרִיתִי
  choice: Ich werde … streuen
  rationale: זרה bedeutet im Piel ausstreuen oder zerstreuen. Mit Mist als Objekt und den Gesichtern als Ziel gibt „streuen“ das demütigende Bild direkt wieder.
- source_word: פֶּרֶשׁ
  choice: Mist
  rationale: Das Wort bezeichnet tierischen Kot beziehungsweise den Unrat der Opfertiere. „Mist“ ist im Deutschen direkt, natürlich und bewahrt die beabsichtigte Anstößigkeit.
- source_word: פֶּרֶשׁ חַגֵּיכֶם
  choice: den Mist eurer Feste
  rationale: Die knappe hebräische Genitivverbindung wird formal bewahrt. Gemeint ist wahrscheinlich der Mist beziehungsweise Unrat der bei den Festen geopferten Tiere; dies wird in einer Fußnote erläutert, statt es im Text auszudeuten.
- source_word: וְנָשָׂא אֶתְכֶם אֵלָיו
  choice: und man wird euch zusammen mit ihm wegtragen
  rationale: Die komprimierte Konstruktion hat ein nicht ausdrücklich genanntes maskulines Subjekt und einen maskulinen Singularbezug. Das unpersönliche „man“ lässt den Handelnden offen; „zusammen mit ihm“ bezieht sich sinngemäß auf den Mist und gibt die wahrscheinlich gemeinte Beseitigung mit dem Opferabfall wieder.
theological_decisions:
- issue: Bedeutung von הַזֶּרַע im Gerichtswort an die Priester
  choice: Nachkommen
  alternative: Saat beziehungsweise Getreide oder Ernte
  rationale: Der priesterliche und bundesbezogene Zusammenhang spricht eher für ein Gericht an der Nachkommenschaft der Priester. Da die landwirtschaftliche Bedeutung lexikalisch möglich bleibt, wird sie ausdrücklich angemerkt.
- issue: Deutung des Schlusses וְנָשָׂא אֶתְכֶם אֵלָיו
  choice: Ein ungenannter Handelnder trägt die Priester zusammen mit dem Mist weg.
  alternative: Der Mist selbst trägt sie zu sich beziehungsweise sie werden zu ihm hingetragen.
  rationale: Der hebräische Satz ist syntaktisch schwierig und lässt Subjekt und Bezug nicht eindeutig erkennen. Die gewählte Form vermittelt das Bild der entehrenden Entfernung mit dem Opferabfall, ohne den Handelnden näher zu bestimmen.
- issue: Bezug von „Mist eurer Feste“
  choice: Mist beziehungsweise Unrat der Festopfer
  alternative: Wörtlicher Bezug auf die Feste selbst
  rationale: Der kultische Kontext legt die bei den Festen dargebrachten Tiere nahe. Im Haupttext bleibt jedoch die knappe hebräische Formulierung stehen, während die wahrscheinliche sachliche Bedeutung in der Fußnote erklärt wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst drastischer Bildsprache. Die kurzen Gerichtssätze spiegeln den Nachdruck des Hebräischen. „Schelte“ ist gehoben, aber allgemein verständlich; „Mist ins Gesicht streuen“ wahrt die Härte des Ausgangstextes. Echte lexikalische und syntaktische Mehrdeutigkeiten werden nicht im Haupttext übererklärt, sondern in den Fußnoten kenntlich gemacht.
