source:
  edition: WLC
  text: תּוֹרַ֤ת אֱמֶת֙ הָיְתָ֣ה בְּ/פִ֔י/הוּ וְ/עַוְלָ֖ה לֹא נִמְצָ֣א בִ/שְׂפָתָ֑י/ו בְּ/שָׁל֤וֹם וּ/בְ/מִישׁוֹר֙ הָלַ֣ךְ אִתִּ֔/י וְ/רַבִּ֖ים הֵשִׁ֥יב מֵ/עָוֺֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/006.yaml
  text: The law of truth was in his mouth[a], and no injustice was found on his lips. He walked with me in peace and uprightness[c][b], and he turned many back from iniquity.
translation:
  language: de
  text: Wahre Weisung war in seinem Mund[a], und kein Unrecht fand sich auf seinen Lippen. In Frieden und Aufrichtigkeit ging er mit mir, und viele brachte er von Schuld ab[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Zuverlässige Unterweisung war in seinem Mund“; wörtlicher: „Weisung der Wahrheit“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und viele brachte er dazu, sich von Sünde abzuwenden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרַת אֱמֶת
  choice: wahre Weisung
  rationale: תּוֹרָה bezeichnet hier besonders die priesterliche Unterweisung, behält aber seinen Bezug zur göttlichen Weisung. אֱמֶת beschreibt sie als wahr und zuverlässig. „Wahre Weisung“ gibt beides in natürlichem Deutsch wieder.
- source_word: בְּפִיהוּ
  choice: in seinem Mund
  rationale: Die konkrete hebräische Redeweise wird bewahrt; sie bezeichnet das, was der Priester lehrte und aussprach.
- source_word: עַוְלָה
  choice: Unrecht
  rationale: Das Wort umfasst Unrecht, Verkehrtheit und ungerechtes Handeln. „Unrecht“ ist im Deutschen weit genug und passt zum Zusammenhang wahrhaftiger priesterlicher Rede.
- source_word: נִמְצָא בִשְׂפָתָיו
  choice: fand sich auf seinen Lippen
  rationale: Die passive Aussage und das Bild der Lippen werden nahe am Hebräischen und zugleich idiomatisch wiedergegeben.
- source_word: בְּשָׁלוֹם
  choice: in Frieden
  rationale: Die Formulierung bewahrt sowohl den Gedanken friedlichen Verhaltens als auch den weiteren Sinn von Heil und unversehrter Gemeinschaft.
- source_word: וּבְמִישׁוֹר
  choice: und Aufrichtigkeit
  rationale: מִישׁוֹר bezeichnet wörtlich Geradheit oder Ebenheit und übertragen rechtschaffenes, geradliniges Verhalten. „Aufrichtigkeit“ ist hier natürlich und treffend.
- source_word: הָלַךְ אִתִּי
  choice: ging er mit mir
  rationale: Das Bild des Gehens mit Gott bleibt als relationale und bundestheologisch gewichtige Redeweise erhalten.
- source_word: הֵשִׁיב
  choice: führte er zurück
  rationale: 'Der Hifil von שׁוב ist kausativ: Der Priester bewirkte die Umkehr anderer. „Führte zurück“ wahrt diese Kraft, ohne den Vorgang unnötig auszudeuten.'
- source_word: מֵעָוֺן
  choice: von Schuld
  rationale: עָוֹן kann Verkehrtheit, Schuld oder die Folge von Schuld bezeichnen. „Schuld“ lässt die moralische und die verantwortungsbezogene Dimension offen.
theological_decisions:
- issue: Bedeutung der priesterlichen Tora
  choice: „Wahre Weisung“ im Haupttext
  alternative: „Weisung der Wahrheit“ oder „zuverlässige Unterweisung“
  rationale: Der Zusammenhang handelt vom Lehrauftrag des Priesters. „Weisung“ vermeidet eine Verengung auf ein Gesetzbuch, ohne den verbindlichen Charakter von תּוֹרָה abzuschwächen.
- issue: Bundesbezogenes Bild des Gehens mit Gott
  choice: Das Bild „ging er mit mir“ bleibt erhalten.
  alternative: „lebte er in Gemeinschaft mit mir“ oder „verhielt er sich mir gegenüber“
  rationale: Die bildhafte hebräische Aussage verbindet Lebensführung und Gottesbeziehung. Eine erklärende Paraphrase würde diese Spannung vorschnell auflösen.
- issue: Kausative Umkehr von Schuld
  choice: „viele führte er von Schuld zurück“
  alternative: „viele brachte er dazu, sich von Sünde abzuwenden“
  rationale: Die gewählte Fassung bewahrt die kausative Form und lässt offen, wie priesterliche Unterweisung diese Umkehr bewirkte.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Körperbilder „Mund“ und „Lippen“ sowie das biblische Bild des Gehens mit Gott bleiben erhalten. Die leicht markierte Wendung „von Schuld zurückführen“ bewahrt bewusst die Bewegungsrichtung des hebräischen שׁוב.
