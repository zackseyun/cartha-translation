source:
  edition: WLC
  text: כִּֽי שָׂנֵ֣א שַׁלַּ֗ח אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל וְ/כִסָּ֤ה חָמָס֙ עַל לְבוּשׁ֔/וֹ אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת וְ/נִשְׁמַרְתֶּ֥ם בְּ/רוּחֲ/כֶ֖ם וְ/לֹ֥א תִבְגֹּֽדוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/016.yaml
  text: For he hates divorce[a], says Yahweh, the God of Israel, and the one who covers his garment with violence, says Yahweh of Armies. So guard yourselves in your spirit[b], and do not act faithlessly.
translation:
  language: de
  text: Denn er hasst Scheidung[a], spricht der HERR, der Gott Israels, und den, der sein Gewand mit Gewalt bedeckt, spricht der HERR der Heerscharen. Darum achtet auf euren Geist und handelt nicht treulos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionelle Wiedergabe: „Denn ich hasse Scheidung“, spricht der HERR, der Gott Israels. Der hebräische Text ist an dieser Stelle schwierig und kann unterschiedlich verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „Begeht keinen Treuebruch“ / „Seid nicht untreu“. Das hebräische Wort bezeichnet treuloses Handeln innerhalb einer Bundesbeziehung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Mahnung ein und gibt den argumentativen Zusammenhang natürlich wieder.
- source_word: שָׂנֵא
  choice: er hasst
  rationale: Die masoretische Form ist morphologisch 3. Person Singular maskulin und nicht 1. Person Singular. Die Übersetzung bewahrt diese schwierige Lesart, statt sie stillschweigend zur traditionellen Form „ich hasse“ zu glätten.
- source_word: שַׁלַּח
  choice: Scheidung
  rationale: Das Fortschicken bezieht sich im ehelichen Zusammenhang auf die Entlassung der Ehefrau und damit auf Scheidung.
- source_word: יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: der HERR, der Gott Israels
  rationale: Gibt den Gottesnamen gemäß der verbreiteten deutschen Bibelkonvention als „der HERR“ und den Titel wörtlich wieder.
- source_word: וְכִסָּה חָמָס עַל לְבוּשׁוֹ
  choice: und den, der sein Gewand mit Gewalt bedeckt
  rationale: Die syntaktisch schwierige Wendung wird als weiteres Objekt zu „hasst“ verstanden. Die Gewandmetapher und ihre Mehrdeutigkeit bleiben erhalten.
- source_word: חָמָס
  choice: Gewalt
  rationale: Bezeichnet schweres gewaltsames Unrecht; „Gewalt“ bewahrt die Schärfe des Vorwurfs knapp und verständlich.
- source_word: לְבוּשׁוֹ
  choice: sein Gewand
  rationale: Die konkrete Metapher wird ohne eine weitergehende Deutung auf Ehe oder Bund in den Text einzutragen beibehalten.
- source_word: יְהוָה צְבָאוֹת
  choice: der HERR der Heerscharen
  rationale: Die im Deutschen etablierte, würdige Wiedergabe bewahrt den militärischen und kosmischen Gehalt des Titels.
- source_word: וְנִשְׁמַרְתֶּם בְּרוּחֲכֶם
  choice: Darum hütet euch in eurem Geist
  rationale: Der reflexive Sinn der Aufforderung zur Wachsamkeit und ihr innerer, moralischer Bezug werden möglichst nah am Hebräischen wiedergegeben.
- source_word: וְלֹא תִבְגֹּדוּ
  choice: und handelt nicht treulos
  rationale: בגד bezeichnet hier einen treulosen Verrat innerhalb einer Bundes- beziehungsweise Ehebeziehung. „Treulos handeln“ ist gegenwärtiges, verständliches Deutsch und erhält diese Beziehungsdimension.
theological_decisions:
- issue: Traditionelle Ich-Aussage oder schwierige Lesart der masoretischen dritten Person
  choice: Im Haupttext steht „er hasst Scheidung“.
  alternative: „Denn ich hasse Scheidung“, spricht der HERR, der Gott Israels.
  rationale: Die Konsonanten und die masoretische Form weisen auf die dritte Person Singular. Da der Satz syntaktisch umstritten ist, wird die vertraute erste Person nicht ohne Kennzeichnung in den Haupttext eingesetzt, sondern als mögliche traditionelle Lesart in der Fußnote bewahrt.
- issue: Bezug und Deutung der Gewand-Gewalt-Wendung
  choice: 'Die Wendung wird als zweites Objekt von „hasst“ formuliert: „und den, der sein Gewand mit Gewalt bedeckt“.'
  alternative: „und er bedeckt sein Gewand mit Gewalt“ beziehungsweise „und Gewalt bedeckt sein Gewand“.
  rationale: Der hebräische Satz ist stark verdichtet und syntaktisch unsicher. Die gewählte Fassung folgt der konsultierten Hauptlesart, lässt aber das Bild selbst stehen und legt weder seine genaue Symbolik noch sämtliche syntaktischen Fragen dogmatisch fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Formulierung „er hasst Scheidung“ und die Gewandmetapher wurden bewusst nicht stärker geglättet, damit die sprachliche Schwierigkeit und theologische Spannung des hebräischen Textes sichtbar bleiben.
