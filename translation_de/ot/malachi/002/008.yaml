  to: Ihr aber seid vom Weg abgewichen; ihr habt viele durch die Weisung[a] zu Fall gebracht; ihr habt den Bund Levis verdorben, spricht Jahwe der Heerscharen.
  rationale: Die Hauptfassung ersetzt allein die missverständliche und unidiomatische Verbindung „an der Weisung“ durch die im Kontext gut belegte instrumentale Wiedergabe „durch die Weisung“. Die Fußnote hält die bereichsbezogene Deutung sowie „Gesetz“ als lexikalische Alternative fest. Bedeutung, Satzstruktur, Gottesname und die bewusste Offenheit von „Bund Levis“ bleiben erhalten.
