source:
  edition: WLC
  text: וְ/אַתֶּם֙ סַרְתֶּ֣ם מִן הַ/דֶּ֔רֶךְ הִכְשַׁלְתֶּ֥ם רַבִּ֖ים בַּ/תּוֹרָ֑ה שִֽׁחַתֶּם֙ בְּרִ֣ית הַ/לֵּוִ֔י אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/008.yaml
  text: But you have turned aside from the way; you have caused many to stumble in the law; you have corrupted the covenant of Levi[a], says Yahweh of hosts.
translation:
  language: de
  text: Ihr aber seid vom Weg abgewichen; ihr habt viele durch die Weisung[a] zu Fall gebracht; ihr habt den Bund Levis verdorben, spricht Jahwe der Heerscharen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: im Gesetz. Das hebräische Wort Tora kann „Weisung“ oder „Gesetz“ bedeuten; die Präposition kann auch den Bereich der Weisung bezeichnen.'
    reason: Die Bedeutung von תורה und die Funktion der Präposition ב sind an dieser Stelle mehrdeutig.
lexical_decisions:
- source_word: סַרְתֶּם מִן הַדֶּרֶךְ
  choice: seid vom Weg abgewichen
  rationale: Bewahrt das Bild des Verlassens eines Weges und gibt die vollzogene Abkehr in natürlichem Deutsch wieder.
- source_word: הִכְשַׁלְתֶּם רַבִּים
  choice: habt viele … zu Fall gebracht
  rationale: Gibt die kausative Form von כשל wieder und lässt sowohl moralisches Straucheln als auch dessen schwerwiegende Folgen anklingen.
- source_word: בַּתּוֹרָה
  choice: an der Weisung
  rationale: תורה bezeichnet hier die den Priestern anvertraute Weisung; die Formulierung wahrt zugleich die Mehrdeutigkeit der Präposition ב, ohne eindeutig zu behaupten, die Weisung selbst sei das verursachende Mittel.
- source_word: שִׁחַתֶּם
  choice: habt … verdorben
  rationale: Entspricht der intensiven Form von שׁחת und bewahrt die kräftige Aussage, ohne sie enger als bloßen Rechtsbruch zu bestimmen.
- source_word: בְּרִית הַלֵּוִי
  choice: den Bund Levis
  rationale: Gibt die hebräische Genitivverbindung knapp wieder und lässt offen, ob Levi als Stammvater oder für das levitische Priestertum steht.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Gibt den Gottesnamen als Eigennamen wieder und bewahrt mit „Heerscharen“ die umfassende, feierliche Bedeutung des Titels צבאות.
theological_decisions:
- issue: Bedeutung von תורה im priesterlichen Zusammenhang
  choice: Weisung
  alternative: Gesetz
  rationale: „Weisung“ deckt die Lehrfunktion der Priester gut ab; „Gesetz“ bleibt als mögliche bundesbezogene Bedeutung in der Fußnote erhalten.
- issue: Verhältnis der Präposition ב zu תורה
  choice: an der Weisung
  alternative: durch die Weisung / bei der Unterweisung / im Gesetz
  rationale: Das Hebräische kann einen Bereich, Anlass oder ein Mittel bezeichnen. Die Hauptfassung vermeidet eine vorschnelle Festlegung; die Fußnote nennt die wesentlichen Alternativen.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich; die Transliteration bewahrt ihn als Eigennamen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der parallele Satzbau und die kräftigen Verben bewahren den prophetischen Anklageton; „Heerscharen“ erhält den feierlichen Charakter des Gottesprädikats.
