  source_fidelity: Der Entwurf gibt die drei Anklagen, die Kausalform von הִכְשַׁלְתֶּם („ihr habt ... zu Fall gebracht“), den Bundbegriff und die Gottesredeformel zutreffend wieder. „An der Weisung“ ist für בַּתּוֹרָה jedoch weder die naheliegende instrumentale noch die bereichsbezogene Wiedergabe und kann im Deutschen missverständlich nahelegen, die Weisung sei das Hindernis, an dem die Betroffenen scheiterten.
  naturalness: „An der Weisung zu Fall gebracht“ ist in modernem Standarddeutsch idiomatisch deutlich schwächer als „durch die Weisung zu Fall gebracht“. Die übrige Formulierung ist klar, würdig und dem prophetischen Anklageton angemessen.
  terminology: „Weisung“ ist eine gute Wiedergabe von Tora im priesterlichen Zusammenhang; „Gesetz“ soll als lexikalische Alternative in der Fußnote stehen bleiben. „Jahwe der Heerscharen“ gibt יהוה צבאות präzise und in einem angemessen feierlichen Register wieder. „Bund Levis“ bewahrt die knappe hebräische Genitivverbindung, ohne die Referenz näher festzulegen.
  issues:
