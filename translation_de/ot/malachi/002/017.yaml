source:
  edition: WLC
  text: הוֹגַעְתֶּ֤ם יְהוָה֙ בְּ/דִבְרֵי/כֶ֔ם וַ/אֲמַרְתֶּ֖ם בַּ/מָּ֣ה הוֹגָ֑עְנוּ בֶּ/אֱמָרְ/כֶ֗ם כָּל עֹ֨שֵׂה רָ֜ע ט֣וֹב בְּ/עֵינֵ֣י יְהוָ֗ה וּ/בָ/הֶם֙ ה֣וּא חָפֵ֔ץ א֥וֹ אַיֵּ֖ה אֱלֹהֵ֥י הַ/מִּשְׁפָּֽט־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/017.yaml
  text: You have wearied Yahweh with your words. Yet you say[a], “How have we wearied him?” By saying, “Everyone who does evil is good in the eyes of Yahweh, and he delights in them,” or, “Where is the God of justice?”
translation:
  language: de
  text: 'Ihr habt Jahwe mit euren Worten ermüdet. Doch ihr sagt: „Wodurch haben wir ihn ermüdet?“ Dadurch, dass ihr sagt: „Jeder, der Böses tut, ist gut in den Augen Jahwes, und an solchen hat er Gefallen“, oder: „Wo ist der Gott des Rechts[a]?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Gott des Gerichts“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹגַעְתֶּם / הוֹגָעְנוּ
  choice: habt … ermüdet / haben … ermüdet
  rationale: Der Hifil von יגע bezeichnet hier das Verursachen von Müdigkeit oder Erschöpfung. „Ermüdet“ bewahrt die anschauliche, anthropopathische Aussage des Hebräischen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּדִבְרֵיכֶם
  choice: mit euren Worten
  rationale: Die Präposition ב bezeichnet hier das Mittel; „mit euren Worten“ ist im Deutschen natürlich und präzise.
- source_word: בַּמָּה
  choice: Wodurch
  rationale: Die Frage zielt in diesem Zusammenhang darauf, wodurch sie Jahwe ermüdet haben. „Wodurch“ stellt den Bezug zu ihren Worten und zur folgenden Erklärung klar her.
- source_word: בֶּאֱמָרְכֶם
  choice: Dadurch, dass ihr sagt
  rationale: Die Konstruktion erklärt, auf welche Weise ihre Worte Jahwe ermüden, und gibt den instrumentalen beziehungsweise kausalen Zusammenhang deutlich wieder.
- source_word: כָּל עֹשֵׂה רָע
  choice: Jeder, der Böses tut
  rationale: Die Wiedergabe bewahrt den generischen und distributiven Sinn des Partizips in verständlichem modernem Deutsch.
- source_word: טוֹב
  choice: ist gut
  rationale: Das schlichte Adjektiv „gut“ erhält die zugespitzte und ironische Behauptung des Volkes.
- source_word: בְּעֵינֵי יְהוָה
  choice: in den Augen Jahwes
  rationale: Die hebräische Metapher der bewertenden Augen bleibt erhalten und ist auch im Deutschen verständlich.
- source_word: וּבָהֶם הוּא חָפֵץ
  choice: und an solchen hat er Gefallen
  rationale: „Gefallen haben an“ gibt חפץ treffend wieder. „An solchen“ bezieht den hebräischen Plural natürlich auf die zuvor allgemein bezeichneten Übeltäter.
- source_word: אוֹ
  choice: oder
  rationale: אוֹ führt eine alternative Form derselben zynischen Klage ein.
- source_word: אַיֵּה
  choice: Wo ist
  rationale: Die direkte Frage bewahrt die scharfe Herausforderung des Ausgangstextes.
- source_word: אֱלֹהֵי הַמִּשְׁפָּט
  choice: der Gott des Rechts
  rationale: מִשְׁפָּט bezeichnet hier Gottes gerechte Ordnung und sein gerechtes Handeln. „Recht“ wahrt im Deutschen die mögliche Verbindung von Gerechtigkeit und richterlichem Urteil.
theological_decisions:
- issue: Anthropopathische Rede davon, dass Gott ermüdet wird
  choice: „Ihr habt Jahwe … ermüdet“
  alternative: „Ihr habt Jahwe beleidigt“ oder „belastet“
  rationale: Der hebräische Text spricht ausdrücklich vom Verursachen von Ermüdung. Diese personale und spannungsreiche Ausdrucksweise wird nicht zu einer abstrakten Aussage abgeschwächt.
- issue: Bedeutung von מִשְׁפָּט im Schlusswort
  choice: Recht
  alternative: Gericht
  rationale: Die Klage betrifft Gottes scheinbar ausbleibendes gerechtes Eingreifen und damit seine Rechtsordnung; zugleich bleibt „Gericht“ als sachlich mögliche Alternative in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte prophetische Anklage und die rhetorischen Fragen bleiben erhalten; die anthropopathische Sprache wird nicht geglättet.
