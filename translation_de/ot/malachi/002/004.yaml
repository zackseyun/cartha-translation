source:
  edition: WLC
  text: וִֽ/ידַעְתֶּ֕ם כִּ֚י שִׁלַּ֣חְתִּי אֲלֵי/כֶ֔ם אֵ֖ת הַ/מִּצְוָ֣ה הַ/זֹּ֑את לִֽ/הְי֤וֹת בְּרִיתִ/י֙ אֶת לֵוִ֔י אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/004.yaml
  text: Then you will know that I have sent this command to you[a], that my covenant with Levi may be[b], says Yahweh of Armies.
translation:
  language: de
  text: Dann werdet ihr erkennen, dass ich dieses Gebot an euch gesandt habe, damit mein Bund mit Levi besteht[a], spricht der HERR der Heere[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „damit mein Bund mit Levi sei“. Das Hebräische ist knapp; möglich ist auch: „damit dies mein Bund mit Levi sei“. Im Zusammenhang kann die Aussage auf das Bestehen beziehungsweise Fortbestehen des Bundes zielen.'
    reason: alternative_reading
  - marker: b
    text: 'Traditionell: „der HERR Zebaoth“ oder „der HERR der Heerscharen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִידַעְתֶּם
  choice: Dann werdet ihr erkennen
  rationale: Das Qal Perfekt mit vorangestelltem Waw bezeichnet hier im prophetischen Zusammenhang eine künftige, aus dem angekündigten Gericht folgende Erkenntnis. „Dann“ gibt diesen Folgesinn natürlich wieder.
- source_word: כִּי
  choice: dass
  rationale: Die Konjunktion leitet hier den Inhalt dessen ein, was die Priester erkennen werden, nicht dessen Begründung.
- source_word: שִׁלַּחְתִּי
  choice: ich ... gesandt habe
  rationale: 'Das Perfekt bezeichnet eine vollzogene Sendung mit gegenwärtigem Ergebnis: Das Gebot ist an die Adressaten ergangen.'
- source_word: אֲלֵיכֶם
  choice: an euch
  rationale: אֶל bezeichnet gewöhnlich die Richtung beziehungsweise die Empfänger; „an euch“ ist im Deutschen bei einem gesandten Gebot idiomatisch.
- source_word: הַמִּצְוָה הַזֹּאת
  choice: dieses Gebot
  rationale: מִצְוָה bezeichnet ein Gebot oder eine Weisung. „Gebot“ ist präzise, geläufig und dem würdevollen Register angemessen.
- source_word: לִהְיוֹת
  choice: damit ... besteht
  rationale: Der Infinitiv von „sein“ leitet eine knappe Zweck- oder Ergebnisaussage ein. „Besteht“ bleibt näher am hebräischen „sein“ als eine ausdrückliche Aussage über Fortdauer und ergibt dennoch natürliches Deutsch.
- source_word: בְּרִיתִי אֶת־לֵוִי
  choice: mein Bund mit Levi
  rationale: אֶת bezeichnet hier die Gemeinschaft beziehungsweise Beziehung „mit“. Der Eigenname Levi bleibt wie im Hebräischen im Singular stehen, auch wenn er im Kontext die levitische Priesterschaft mit einschließen kann.
- source_word: אָמַר יְהוָה צְבָאוֹת
  choice: spricht der HERR der Heere
  rationale: „Spricht“ entspricht der prophetischen Botenformel. Der Gottesname wird nach deutscher Bibelkonvention als „der HERR“ wiedergegeben; „der Heere“ übersetzt צְבָאוֹת transparent und bewahrt dessen militärischen Pluralsinn.
theological_decisions:
- issue: Sinn der knappen Zweckangabe zum Bund mit Levi
  choice: Das Gebot wird gesandt, damit Gottes Bund mit Levi besteht.
  alternative: Das Gebot selbst soll Gottes Bund mit Levi sein; oder das Gebot soll bewirken, dass der Bund fortbesteht.
  rationale: לִהְיוֹת בְּרִיתִי אֶת־לֵוִי ist syntaktisch knapp und lässt offen, ob vor allem Sein, Geltung oder Fortbestand des Bundes gemeint ist. „Damit ... besteht“ ist verständlich, ohne „fortbesteht“ oder eine neue Stiftung des Bundes ausdrücklich in den Text einzutragen; die Fußnote hält die engere wörtliche und die alternative syntaktische Möglichkeit offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem prophetischen Ausspruch, ohne die knappe hebräische Zweckangabe unnötig zu glätten. „HERR der Heere“ ist verständlicher als das tradierte „Zebaoth“, während die Fußnote die geläufigen traditionellen Formen nennt.
