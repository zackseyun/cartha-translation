  text: בְּרִיתִ֣/י הָיְתָ֣ה אִתּ֗/וֹ הַֽ/חַיִּים֙ וְ/הַ֨/שָּׁל֔וֹם וָ/אֶתְּנֵֽ/ם ל֥/וֹ מוֹרָ֖א וַ/יִּֽירָאֵ֑/נִי וּ/מִ/פְּנֵ֥י שְׁמִ֖/י נִחַ֥ת הֽוּא׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/005.yaml
  text: My covenant with him was one of life and peace[a], and I gave them to him; this called for reverence, and he revered me[b], and he stood in awe before my name.
translation:
  language: de
  text: Mein Bund mit ihm war ein Bund des Lebens und des Friedens, und ich gab sie ihm; das sollte Ehrfurcht wecken[a]. Er fürchtete mich, und vor meinem Namen erbebte er[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Hebräische lautet hier knapp „und ich gab sie ihm: Furcht/Ehrfurcht“. Die genaue Beziehung ist umstritten; möglich sind etwa „zur Ehrfurcht“, „als Anlass zur Ehrfurcht“ oder „um Furcht zu wecken“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „erschrak er“, „war er bestürzt“ oder „verzagte er“ vor meinem Namen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרִיתִי הָיְתָה אִתּוֹ
  choice: Mein Bund mit ihm war
  rationale: Gibt die Zugehörigkeits- bzw. Beziehungsformel natürlich wieder und bewahrt den ausdrücklich genannten Bund.
- source_word: הַחַיִּים וְהַשָּׁלוֹם
  choice: Leben und Frieden
  rationale: Direkte, im Deutschen idiomatische Wiedergabe; »Frieden« lässt den weiteren Sinn von Wohlergehen mitklingen.
- source_word: וָאֶתְּנֵם לוֹ
  choice: und ich gab sie ihm
  rationale: Das maskuline Pluralsuffix wird am naheliegendsten auf »Leben und Frieden« bezogen.
- source_word: מוֹרָא וַיִּירָאֵנִי
  choice: damit er Ehrfurcht hätte. Er fürchtete mich
  rationale: Die schwierige, gedrängte Syntax wird als Zweck- oder Wirkungsbeziehung verstanden. Der Wechsel zwischen »Ehrfurcht« und »fürchtete« verbindet natürliches Deutsch mit der Wiederholung des hebräischen Wortfeldes.
- source_word: וּמִפְּנֵי שְׁמִי נִחַת הוּא
  choice: und vor meinem Namen erbebte er
  rationale: »Vor meinem Namen« wahrt die räumliche Metapher; »erbebte« bewahrt die starke körperlich-emotionale Reaktion des Niphal von חתת, ohne sie bloß als innere Bewunderung abzuschwächen.
theological_decisions:
- issue: Art der Reaktion auf Gott innerhalb des Bundes
  choice: Ehrfürchtige Furcht wird mit starkem Erbeben ausgedrückt.
  alternative: Die Wendung kann stärker als Bestürzung, Demütigung oder Verzagtheit verstanden werden.
  rationale: Der positive Zusammenhang von Leben und Frieden legt ehrfürchtige Gottesfurcht nahe; die kräftige Bedeutung von נחת darf jedoch nicht zu »stand in Ehrfurcht« verflacht werden.
- issue: Funktion von מוֹרָא nach »ich gab sie ihm«
  choice: 'als Zweck bzw. beabsichtigte Wirkung: »damit er Ehrfurcht hätte«'
  alternative: »als Ehrfurcht«, »zur Ehrfurcht« oder eine lose Fortführung ohne ausdrückliche syntaktische Verknüpfung
  rationale: Der hebräische Satz ist komprimiert und lässt die genaue Beziehung offen. Die gewählte Form ergibt verständliches Deutsch, während eine Fußnote die Unsicherheit festhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung »Ehrfurcht … fürchtete« erhält das hebräische Wortfeld, während »erbebte« die Stärke des abschließenden Verbs wahrt. Sämtliche Fußnotenmarker stehen im Haupttext.
