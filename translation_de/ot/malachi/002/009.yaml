source:
  edition: WLC
  text: וְ/גַם אֲנִ֞י נָתַ֧תִּי אֶתְ/כֶ֛ם נִבְזִ֥ים וּ/שְׁפָלִ֖ים לְ/כָל הָ/עָ֑ם כְּ/פִ֗י אֲשֶׁ֤ר אֵֽינְ/כֶם֙ שֹׁמְרִ֣ים אֶת דְּרָכַ֔/י וְ/נֹשְׂאִ֥ים פָּנִ֖ים בַּ/תּוֹרָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/009.yaml
  text: So I also have made you despised and abased before all the people[a], because you are not keeping my ways but are showing partiality in the law.
translation:
  language: de
  text: So habe auch ich euch vor dem ganzen Volk zu Verachteten und Erniedrigten gemacht, weil ihr meine Wege nicht bewahrt, sondern im Gesetz die Person anseht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bei der Weisung« oder »bei der Tora«.'
    reason: תּוֹרָה kann sowohl Weisung im weiteren Sinn als auch das Gesetz beziehungsweise die Tora bezeichnen.
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: Darum habe auch ich
  rationale: Die Verbindung mit dem betonten Pronomen knüpft an die vorausgehende Zurechtweisung an und drückt hier eine entsprechende göttliche Reaktion aus.
- source_word: נָתַתִּי אֶתְכֶם
  choice: habe euch … gemacht
  rationale: 'נתן hat mit den folgenden prädikativen Adjektiven resultative Bedeutung: Gott versetzt sie in diesen Zustand.'
- source_word: נִבְזִים וּשְׁפָלִים
  choice: verachtet und erniedrigt
  rationale: Die Wiedergabe bewahrt sowohl die öffentliche Verachtung als auch die Herabsetzung ihres Ansehens.
- source_word: לְכָל הָעָם
  choice: vor dem ganzen Volk
  rationale: Die Präposition bezeichnet hier den öffentlichen sozialen Raum, in dem ihre Erniedrigung sichtbar wird.
- source_word: כְּפִי אֲשֶׁר
  choice: weil
  rationale: Die Wendung führt in diesem Zusammenhang den Grund für das Gericht ein.
- source_word: אֵינְכֶם שֹׁמְרִים אֶת דְּרָכַי
  choice: ihr meine Wege nicht bewahrt
  rationale: שמר bezeichnet das Beachten und Einhalten; „meine Wege bewahren“ erhält die bildhafte und bundestheologische Ausdrucksweise.
- source_word: וְנֹשְׂאִים פָּנִים
  choice: sondern … die Person anseht
  rationale: Die hebräische Redewendung bezeichnet Parteilichkeit. Die etablierte deutsche Wendung wahrt das Bild und ist im rechtlichen Zusammenhang verständlich.
- source_word: בַּתּוֹרָה
  choice: beim Gesetz
  rationale: תורה bezeichnet hier Gottes maßgebende Weisung, mit der die Priester umgehen; „Gesetz“ passt zum rechtlich-priesterlichen Kontext, ohne die breitere Bedeutung auszuschließen.
theological_decisions:
- issue: Bedeutung von תּוֹרָה im priesterlichen Zusammenhang
  choice: beim Gesetz
  alternative: bei der Weisung; bei der Tora
  rationale: Der Vorwurf betrifft parteiliches Handeln bei der Anwendung oder Vermittlung der göttlichen Norm. „Gesetz“ gibt diesen Zusammenhang klar wieder; die Fußnote erhält die echte lexikalische Spannweite.
- issue: Öffentliche Schande als göttliches Gericht
  choice: verachtet und erniedrigt gemacht vor dem ganzen Volk
  alternative: verächtlich und niedrig gemacht beim ganzen Volk
  rationale: Die Formulierung stellt die soziale Herabsetzung als Folge göttlichen Handelns dar, ohne Art oder Ausmaß des Gerichts über den hebräischen Text hinaus zu bestimmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Die Person ansehen“ ist eine etablierte gehobene Wendung für Parteilichkeit; die Satzstruktur bleibt eng am hebräischen Gedankengang.
