  text: וְ/לֹא אֶחָ֣ד עָשָׂ֗ה וּ/שְׁאָ֥ר ר֨וּחַ֙ ל֔/וֹ וּ/מָה֙ הָֽ/אֶחָ֔ד מְבַקֵּ֖שׁ זֶ֣רַע אֱלֹהִ֑ים וְ/נִשְׁמַרְתֶּם֙ בְּ/ר֣וּחֲ/כֶ֔ם וּ/בְ/אֵ֥שֶׁת נְעוּרֶ֖י/ךָ אַל יִבְגֹּֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/015.yaml
  text: Did not the one God make them[a]? Yet a remnant of the Spirit was his. And what was the one seeking? Godly offspring. So guard yourselves in your spirit[c][b], and let no one deal treacherously with the wife of his youth.
translation:
  language: de
  text: Hat nicht der eine Gott sie gemacht?[a] Doch ein Rest des Geistes gehörte ihm.[b] Und wonach suchte der Eine? Nach gottesfürchtigen Nachkommen.[c] Darum hütet euch in eurem Geist, und keiner von euch soll der Frau seiner Jugend untreu werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut ist äußerst schwierig und lautet knapp: „Hat nicht einer gemacht, und ein Rest von Geist war ihm?“ Andere Deutungen sind: „Keiner, der auch nur einen Rest Geist besitzt, tut dies“, oder ein Bezug von „der Eine“ auf Abraham.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „ein Rest von Geist war ihm“; möglicherweise auch: „er besaß Geist in Fülle“. Ob Gottes Geist, menschlicher Geist, Atem oder Lebenskraft gemeint ist, bleibt offen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „Samen Gottes“; auch möglich: „Nachkommen Gottes“ oder „von Gott gegebene Nachkommen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא אֶחָד עָשָׂה
  choice: Hat nicht der eine Gott sie gemacht?
  rationale: Der stark verkürzte hebräische Satz wird im Zusammenhang auf den einen Gott als Schöpfer der ehelichen Verbindung bezogen. „Gott“ und das Objekt „sie“ sind sinngemäß ergänzt; die echte syntaktische Unsicherheit wird in Fußnote [a] offengelegt.
- source_word: וּשְׁאָר רוּחַ לוֹ
  choice: Doch ein Rest des Geistes gehörte ihm
  rationale: שְׁאָר bezeichnet einen Rest oder Überrest, und לוֹ drückt Zugehörigkeit aus. „Geist“ wird großgeschrieben, weil ein Bezug auf Gottes Geist möglich ist; da dies im Hebräischen nicht eindeutig ist, nennt Fußnote [b] die Alternative.
- source_word: וּמָה הָאֶחָד מְבַקֵּשׁ
  choice: Und wonach suchte der Eine?
  rationale: Die Frageform und das Partizip „suchend“ bleiben erhalten. „Der Eine“ nimmt die vorausgehende Bezeichnung wieder auf; die Großschreibung entspricht der gewählten Deutung als Gottesbezeichnung.
- source_word: זֶרַע אֱלֹהִים
  choice: gottesfürchtige Nachkommen
  rationale: זֶרַע bedeutet im Ehekontext „Nachkommen“. Der Gottesname wird qualitativ verstanden; die wörtlichere und zugleich mehrdeutige Wiedergabe „Nachkommen Gottes“ steht in Fußnote [c].
- source_word: וְנִשְׁמַרְתֶּם בְּרוּחֲכֶם
  choice: Darum hütet euch in eurem Geist
  rationale: Die reflexive Aufforderung des Niphal wird mit „hütet euch“ wiedergegeben. „In eurem Geist“ bewahrt die innere Ausrichtung der hebräischen Formulierung.
- source_word: וּבְאֵשֶׁת נְעוּרֶיךָ אַל יִבְגֹּד
  choice: und keiner von euch soll an der Frau seiner Jugend treulos handeln
  rationale: בגד bezeichnet treuloses oder verräterisches Handeln, besonders im Bundeskontext. „Keiner von euch“ gibt den Wechsel vom vorhergehenden Plural zur dritten Person Singular verständlich wieder.
theological_decisions:
- issue: Deutung des schwierigen ersten Satzteils
  choice: Der eine Gott schuf die beiden Ehepartner.
  alternative: '„Hat nicht einer gemacht?“; Bezug auf Abraham; oder: „Keiner, der noch einen Rest Geist besitzt, tut dies.“'
  rationale: Diese Deutung passt zum unmittelbaren Zusammenhang von Gott als Zeugen des Ehebundes und zum Verbot ehelicher Treulosigkeit. Da Syntax und Bezug außergewöhnlich unsicher sind, werden andere Hauptdeutungen ausdrücklich in Fußnote [a] bewahrt.
- issue: Bezug von רוּחַ
  choice: „Geist“ als möglicher Hinweis auf Gottes Geist
  alternative: „Geist“ im Sinn menschlichen Geistes, Atems oder einer geistigen Lebenskraft
  rationale: Der unpunktierte Bedeutungsgehalt entscheidet die Referenz nicht. Die Großschreibung zeigt die im Haupttext gewählte Möglichkeit an, ohne die andere Deutung zu verschweigen.
- issue: Bedeutung von זֶרַע אֱלֹהִים
  choice: gottesfürchtige Nachkommen
  alternative: Nachkommen Gottes; von Gott gegebene Nachkommen
  rationale: Die qualitative Deutung fügt sich in die Mahnung zu bundestreuer Ehe, doch der hebräische Genitiv bleibt mehrdeutig und wird deshalb in Fußnote [c] dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Formulierung „Frau seiner Jugend“ bewahrt das biblische Bundesmotiv; „treulos handeln“ trägt den starken Sinn von בגד. Die schwer verständliche Syntax des ersten Halbverses wird im Haupttext lesbar gedeutet, während die konkurrierenden Lesarten in den Fußnoten erhalten bleiben.
