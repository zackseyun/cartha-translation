id: MAL.2.7
reference: Malachi 2:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּֽי שִׂפְתֵ֤י כֹהֵן֙ יִשְׁמְרוּ דַ֔עַת וְ/תוֹרָ֖ה יְבַקְשׁ֣וּ מִ/פִּ֑י/הוּ כִּ֛י מַלְאַ֥ךְ יְהוָֽה צְבָא֖וֹת הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/007.yaml
  text: For the lips of a priest should guard knowledge[a], and they should seek instruction from his mouth[b], because he is the messenger of Yahweh of Armies.
translation:
  language: de
  text: Denn die Lippen eines Priesters sollen Erkenntnis bewahren, und aus seinem Mund soll man Weisung[a] suchen; denn er ist ein Bote Jahwes der Heerscharen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Gesetz“ oder „Lehre“ (hebräisch Tora).
    reason: lexical_alternative
  - marker: b
    text: 'Traditionell: „des HERRN der Heerscharen“ oder „des HERRN Zebaot“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂפְתֵי כֹהֵן
  choice: die Lippen eines Priesters
  rationale: Die Konstruktion bezeichnet wörtlich die Lippen eines Priesters und bewahrt den allgemein-repräsentativen Sinn.
- source_word: יִשְׁמְרוּ
  choice: sollen … bewahren
  rationale: 'Der Imperfekt hat im Zusammenhang normativen Charakter: Er beschreibt die Pflicht des Priesters, nicht bloß eine künftige Handlung.'
- source_word: דַעַת
  choice: Erkenntnis
  rationale: „Erkenntnis“ gibt den im Zusammenhang gemeinten verlässlichen Zugang zu Gott und seinen Wegen wieder und bezeichnet nicht nur angesammeltes Wissen.
- source_word: וְתוֹרָה
  choice: Weisung
  rationale: Hier ist die maßgebliche priesterliche Unterweisung gemeint. „Weisung“ erhält die Breite von Tora, ohne den Ausdruck auf Gesetzesvorschriften zu verengen.
- source_word: יְבַקְשׁוּ מִפִּיהוּ
  choice: aus seinem Mund soll man … suchen
  rationale: Das unpersönliche „man“ gibt das nicht ausdrücklich genannte pluralische Subjekt natürlich wieder; „aus seinem Mund“ bewahrt das Bild mündlicher priesterlicher Unterweisung.
- source_word: מַלְאַךְ
  choice: Bote
  rationale: Da der Priester gemeint ist, bezeichnet das Wort hier einen beauftragten Übermittler und keinen Engel.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: „Jahwe“ gibt den Gottesnamen wieder; „der Heerscharen“ bewahrt den traditionellen und zugleich verständlichen Sinn des göttlichen Titels.
theological_decisions:
- issue: Normative oder prädiktive Bedeutung der Imperfektformen
  choice: sollen … bewahren / soll man … suchen
  alternative: werden bewahren / werden suchen
  rationale: Der Kontext tadelt die Priester wegen ihres Versagens. Deshalb formuliert der Vers ihre Pflicht und keine bloße Zukunftsaussage.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Umschrift macht den im hebräischen Text stehenden Eigennamen sichtbar; die traditionelle Ersatzlesung wird in der Fußnote genannt.
- issue: Bedeutungsumfang von תּוֹרָה
  choice: Weisung
  alternative: Gesetz oder Lehre
  rationale: Der Kontext spricht von der Unterweisung, die beim Priester gesucht wird. „Weisung“ hält den Begriff weiter als ausschließlich gesetzliche Vorschriften.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der parallele Satzbau und das Bild der Lippen beziehungsweise des Mundes bleiben erhalten. Das unpersönliche „man“ verhindert, dass ein deutsches „sie“ fälschlich auf „die Lippen“ bezogen wird.
