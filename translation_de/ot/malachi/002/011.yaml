id: MAL.2.11
reference: Malachi 2:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בָּגְדָ֣ה יְהוּדָ֔ה וְ/תוֹעֵבָ֛ה נֶעֶשְׂתָ֥ה בְ/יִשְׂרָאֵ֖ל וּ/בִ/ירֽוּשָׁלִָ֑ם כִּ֣י חִלֵּ֣ל יְהוּדָ֗ה קֹ֤דֶשׁ יְהוָה֙ אֲשֶׁ֣ר אָהֵ֔ב וּ/בָעַ֖ל בַּת אֵ֥ל נֵכָֽר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/011.yaml
  text: Judah has acted treacherously[a], and an abomination has been committed in Israel and in Jerusalem, for Judah has profaned the sanctuary of Yahweh, which he loves[b], and has married the daughter of a foreign god.
translation:
  language: de
  text: Juda hat treulos gehandelt, und in Israel und Jerusalem ist ein Gräuel verübt worden. Denn Juda hat das Heilige Jahwes, das er liebt,[a] entweiht und die Tochter eines fremden Gottes geheiratet.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das Heiligtum Jahwes« oder »das heilige Volk Jahwes«. Der hebräische Ausdruck ist mehrdeutig.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: »die Tochter eines fremden Gottes«; wahrscheinlich ist eine Frau gemeint, die mit der Verehrung eines fremden Gottes verbunden ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּגְדָה
  choice: hat treulos gehandelt
  rationale: Bewahrt den Gedanken des treuwidrigen, besonders bundbrüchigen Handelns, ohne ein nicht genanntes Objekt des Verrats festzulegen.
- source_word: תוֹעֵבָה
  choice: ein Gräuel
  rationale: Gibt das starke kultisch-moralische Gewicht des hebräischen Ausdrucks in würdigem, geläufigem Deutsch wieder.
- source_word: נֶעֶשְׂתָה
  choice: ist … verübt worden
  rationale: Erhält die Passivform und bezeichnet die schuldhafte Tat idiomatisch.
- source_word: חִלֵּל
  choice: hat … entweiht
  rationale: Bezeichnet passend die Verletzung dessen, was Gott heilig ist.
- source_word: קֹדֶשׁ יְהוָה
  choice: das Heilige Jahwes
  rationale: Bleibt nahe am Hebräischen und lässt offen, ob das Heiligtum, das heilige Volk oder allgemein das Jahwe Geweihte gemeint ist.
- source_word: אֲשֶׁר אָהֵב
  choice: das er liebt
  rationale: Gibt das Perfekt als fortdauernde Zuneigung wieder; das maskuline Pronomen bezieht sich im Kontext am natürlichsten auf Jahwe.
- source_word: וּבָעַל
  choice: und … geheiratet
  rationale: Mit einer Frau als Objekt bedeutet das Verb hier, ihr Ehemann zu werden.
- source_word: בַּת אֵל נֵכָר
  choice: die Tochter eines fremden Gottes
  rationale: Bewahrt die wörtliche, religiös aufgeladene Ausdrucksweise und reduziert die Aussage nicht auf fremde Herkunft.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Verwendet im modernen deutschen Bibelregister die geläufige Wiedergabe des göttlichen Eigennamens.
theological_decisions:
- issue: Bezug von קֹדֶשׁ יְהוָה
  choice: das Heilige Jahwes
  alternative: das Heiligtum Jahwes; das heilige Volk Jahwes
  rationale: Die offene Formulierung bewahrt die echte Mehrdeutigkeit des Hebräischen, statt den Bezug vorschnell auf Tempel oder Volk einzuengen.
- issue: Bedeutung von בַּת אֵל נֵכָר
  choice: die Tochter eines fremden Gottes
  alternative: eine fremde Frau; eine einem fremden Gott verbundene Frau
  rationale: Die wörtliche Wendung erhält den Bezug auf fremden Gottesdienst und macht die Anklage nicht bloß zu einer ethnischen Aussage.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Treulos gehandelt«, »Gräuel« und »entweiht« erhalten den prophetischen und bundestheologischen Ernst; Satzbau und Wortstellung bleiben zugleich gut verständlich.
