  terminology: »Jahwe« ist eine etablierte deutsche Wiedergabe des Gottesnamens. »Gräuel« und »entweiht« geben die kultisch-moralische Schärfe der hebräischen Begriffe angemessen wieder. »Tochter eines fremden Gottes« erhält den religiös markierten Wortlaut und vermeidet eine unzulässige Reduktion auf ethnische Fremdheit.
