  source_fidelity: 'Die Übersetzung gibt die Abfolge und die wesentlichen Aussagen des Hebräischen zutreffend wieder: Judas Treulosigkeit, die in Israel und Jerusalem verübte תועבה, die Entweihung von קֹדֶשׁ יהוה sowie die Heirat mit der Tochter eines fremden Gottes. »Das Heilige Jahwes« bewahrt die tatsächlich offene Referenz von קֹדֶשׁ יהוה, ohne sie auf Heiligtum oder Volk festzulegen. Die Relativklausel »das er liebt« ist sachgerecht als auf Jahwe bezogen verstanden.'
