source:
  edition: WLC
  text: וַ/יְהִ֗י בִּ/ימֵי֙ שְׁפֹ֣ט הַ/שֹּׁפְטִ֔ים וַ/יְהִ֥י רָעָ֖ב בָּ/אָ֑רֶץ וַ/יֵּ֨לֶךְ אִ֜ישׁ מִ/בֵּ֧ית לֶ֣חֶם יְהוּדָ֗ה לָ/גוּר֙ בִּ/שְׂדֵ֣י מוֹאָ֔ב ה֥וּא וְ/אִשְׁתּ֖/וֹ וּ/שְׁנֵ֥י בָנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/001.yaml
  text: It happened in the days when the judges judged that there was a famine in the land[c][b][a], and a man went from Bethlehem of Judah to sojourn in the fields of Moab—he and his wife and his two sons.
translation:
  language: de
  text: 'Und es geschah in den Tagen, als die Richter richteten[a]: Im Land herrschte eine Hungersnot. Und ein Mann zog aus Bethlehem in Juda fort, um sich als Fremder im Gebiet Moabs[c] aufzuhalten[b] – er, seine Frau und seine beiden Söhne.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als die Richter regierten“. Im Hebräischen stehen ein Infinitiv und eine finite Verbform aus derselben Wortwurzel, wörtlich: „als die Richter richteten“.'
    reason: lexical_alternative
  - marker: b
    text: Die Formulierung bezeichnet den Aufenthalt als Ortsfremder, möglicherweise nur für begrenzte Zeit, nicht unbedingt eine dauerhafte Ansiedlung.
    reason: cultural_note
  - marker: c
    text: 'Wörtlich: „auf den Feldern Moabs“; die Wendung kann das Land oder Gebiet Moabs bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Und es geschah
  rationale: Die narrative Wayyiqtol-Form eröffnet die Erzählung und knüpft sie zugleich im üblichen hebräischen Erzählstil an. „Und es geschah“ bewahrt diese Funktion in würdigem, noch verständlichem Deutsch.
- source_word: בִּימֵי
  choice: in den Tagen
  rationale: Die hebräische Zeitformel wird eng am Wortlaut und zugleich idiomatisch wiedergegeben.
- source_word: שְׁפֹט הַשֹּׁפְטִים
  choice: als die Richter richteten
  rationale: Die Wiedergabe erhält die auffällige Wiederholung derselben hebräischen Wortwurzel und lässt offen, ob stärker an Rechtsprechung, Leitung oder Herrschaft gedacht ist.
- source_word: רָעָב
  choice: Hungersnot
  rationale: Gemeint ist eine schwere, das Land betreffende Nahrungsmittelknappheit, nicht lediglich persönlicher Hunger.
- source_word: בָּאָרֶץ
  choice: im Land
  rationale: Die bestimmte Form wird knapp und kontextgemäß wiedergegeben; der nähere geografische Bezug ergibt sich aus der Erzählung.
- source_word: אִישׁ
  choice: ein Mann
  rationale: Das maskuline Einzelsubstantiv bezeichnet den später namentlich genannten Elimelech und wird geschlechtsgenau übersetzt.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: aus Bethlehem in Juda
  rationale: Die Formulierung unterscheidet diesen Ort von einem anderen Bethlehem; „in Juda“ ist im modernen Deutschen natürlicher als „Bethlehem Judas“.
- source_word: לָגוּר
  choice: um sich als Fremder … aufzuhalten
  rationale: גור bezeichnet den Aufenthalt eines Ortsfremden und kann einen vorläufigen, nicht fest etablierten Wohnsitz meinen. Die Formulierung bewahrt diese soziale und zeitliche Nuance ohne das heute ungebräuchliche „weilen“.
- source_word: בִּשְׂדֵי מוֹאָב
  choice: im Gebiet Moabs
  rationale: Der Plural von שׂדה lautet wörtlich „Felder“, kann hier aber idiomatisch das Land beziehungsweise Gebiet Moabs bezeichnen. Die konkrete wörtliche Form bleibt in der Fußnote sichtbar.
- source_word: הוּא וְאִשְׁתּוֹ וּשְׁנֵי בָנָיו
  choice: er, seine Frau und seine beiden Söhne
  rationale: Die einfache aufzählende Struktur des Hebräischen bleibt erhalten; „beiden“ gibt die ausdrücklich genannte Zahl zwei natürlich wieder.
theological_decisions:
- issue: Bedeutungsumfang der Tätigkeit der Richter
  choice: als die Richter richteten
  alternative: als die Richter regierten
  rationale: Das Hebräische kann richterliche wie leitende oder herrschaftliche Tätigkeit umfassen. Die wurzelgleiche Wiedergabe legt keine engere Amtsauffassung fest; die idiomatische Alternative wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener biblischer Eröffnungsformel. Die markante Wortwiederholung „Richter richteten“ bleibt als Stilmerkmal des Hebräischen erhalten. Satzteilung und Doppelpunkt dienen der Lesbarkeit; der Gedankenstrich bewahrt die nachgestellte Aufzählung der Mitreisenden.
