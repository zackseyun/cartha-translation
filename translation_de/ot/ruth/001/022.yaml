  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „zurückkehren“ sowie die ethnische Bezeichnung Ruts bleiben erhalten. Der lange erste Satz folgt der hebräischen Appositionsstruktur, bleibt aber durch Kommas verständlich.
