source:
  edition: WLC
  text: וַ/תָּ֣שָׁב נָעֳמִ֗י וְ/ר֨וּת הַ/מּוֹאֲבִיָּ֤ה כַלָּתָ/הּ֙ עִמָּ֔/הּ הַ/שָּׁ֖בָה מִ/שְּׂדֵ֣י מוֹאָ֑ב וְ/הֵ֗מָּה בָּ֚אוּ בֵּ֣ית לֶ֔חֶם בִּ/תְחִלַּ֖ת קְצִ֥יר שְׂעֹרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/022.yaml
  text: So Naomi returned[a], and Ruth the Moabite, her daughter-in-law, with her, who returned from the fields of Moab. And they came to Bethlehem at the beginning of the barley harvest.
translation:
  language: de
  text: So kehrte Noomi zurück, und mit ihr Rut, die Moabiterin, ihre Schwiegertochter, die aus den Feldern Moabs[a] zurückkehrte. Sie kamen zu Beginn der Gerstenernte nach Bethlehem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: „aus dem Land Moab“ beziehungsweise „aus dem Gebiet Moabs“. Wörtlich steht hier „aus den Feldern Moabs“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּשָׁב
  choice: kehrte zurück
  rationale: Die Grundbedeutung von שוב ist „zurückkehren“. Die Form führt den Erzählgang folgernd weiter; „So“ gibt diesen Zusammenhang im Deutschen natürlich wieder.
- source_word: הַמּוֹאֲבִיָּה
  choice: die Moabiterin
  rationale: Das substantivisch gebrauchte feminine Herkunftsadjektiv wird direkt wiedergegeben und bewahrt die erzählerisch wichtige Hervorhebung von Ruts Herkunft.
- source_word: כַלָּתָהּ
  choice: ihre Schwiegertochter
  rationale: Direkte und im heutigen Deutsch übliche Wiedergabe der Verwandtschaftsbezeichnung.
- source_word: עִמָּהּ
  choice: mit ihr
  rationale: Gibt die Begleitung Noomis durch Rut knapp und unmittelbar wieder.
- source_word: הַשָּׁבָה
  choice: die … zurückkehrte
  rationale: Das feminine singularische Partizip wird als Relativsatz wiedergegeben. Die Stellung lässt es am natürlichsten auf Rut beziehen, ohne den im Hebräischen auffälligen erneuten Gebrauch von „zurückkehren“ zu beseitigen.
- source_word: מִשְּׂדֵי מוֹאָב
  choice: aus den Feldern Moabs
  rationale: Bewahrt das konkrete Bild des hebräischen Plurals von שָׂדֶה. Eine weitere regionale Bedeutung ist möglich und wird in der Fußnote genannt.
- source_word: וְהֵמָּה בָּאוּ
  choice: Sie kamen
  rationale: Das selbstständige Pronomen mit dem Verb wird in natürlichem Deutsch durch das ausdrücklich gesetzte Subjekt „Sie“ wiedergegeben.
- source_word: בֵּית לֶחֶם
  choice: Bethlehem
  rationale: Eingebürgerte deutsche Form des Ortsnamens.
- source_word: בִּתְחִלַּת
  choice: zu Beginn der
  rationale: Natürliche temporale Wiedergabe des Konstruktausdrucks „am Anfang von“.
- source_word: קְצִיר שְׂעֹרִים
  choice: Gerstenernte
  rationale: Die hebräische Genitivverbindung bezeichnet die Ernte der Gerste; das deutsche Kompositum ist präzise und idiomatisch.
theological_decisions: []
