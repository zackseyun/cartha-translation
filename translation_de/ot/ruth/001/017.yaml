source:
  edition: WLC
  text: בַּ/אֲשֶׁ֤ר תָּמ֨וּתִי֙ אָמ֔וּת וְ/שָׁ֖ם אֶקָּבֵ֑ר כֹּה֩ יַעֲשֶׂ֨ה יְהוָ֥ה לִ/י֙ וְ/כֹ֣ה יֹסִ֔יף כִּ֣י הַ/מָּ֔וֶת יַפְרִ֖יד בֵּינִ֥/י וּ/בֵינֵֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/017.yaml
  text: Where you die[a], I will die, and there I will be buried. May Yahweh do so to me, and more also[b], if anything but death separates me from you.
translation:
  language: de
  text: Wo du stirbst, werde auch ich sterben, und dort werde ich begraben werden. Jahwe soll mir dies antun und noch mehr[a], wenn etwas anderes als der Tod mich von dir trennt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „So soll Jahwe mir antun, und so soll er hinzufügen.“ Dies ist eine hebräische Schwurformel, mit der die schwörende Person Gottes Gericht über sich selbst herbeiruft, falls sie ihr Wort bricht.'
    reason: Hebräische Redewendung und kultureller Hintergrund der Schwurformel.
  - marker: b
    text: 'Die abschließende hebräische Klausel ist Teil der Schwurformel. Im Zusammenhang bedeutet sie: Nichts außer dem Tod soll die beiden trennen.'
    reason: Erläuterung der idiomatischen Bedeutung der Schwurklausel.
lexical_decisions:
- source_word: בַּאֲשֶׁר
  choice: Wo
  rationale: Die Verbindung aus ב und אֲשֶׁר bezeichnet den Ort („an dem Ort, wo“). Das schlichte „Wo“ gibt dies im Deutschen natürlich wieder.
- source_word: תָּמוּתִי / אָמוּת
  choice: du stirbst, werde auch ich sterben
  rationale: Die Wiederholung desselben Verbs bildet ein feierliches Parallelgelöbnis. „Auch“ macht die enge Zuordnung im Deutschen deutlich, ohne den Sinn zu erweitern.
- source_word: וְשָׁם אֶקָּבֵר
  choice: und dort werde ich begraben
  rationale: וְשָׁם setzt die Ortsangabe fort; der Nifal von קבר wird sachgerecht passiv wiedergegeben.
- source_word: כֹּה יַעֲשֶׂה יְהוָה לִי וְכֹה יֹסִיף
  choice: Jahwe soll mir dies antun und noch mehr
  rationale: Die konventionelle hebräische Selbstverfluchungsformel bleibt in feierlicher, aber verständlicher Sprache erkennbar. „Noch mehr“ gibt die angedrohte Steigerung idiomatisch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כִּי הַמָּוֶת יַפְרִיד בֵּינִי וּבֵינֵךְ
  choice: wenn etwas anderes als der Tod mich von dir trennt
  rationale: Im Zusammenhang der Schwurformel besagt die Klausel idiomatisch, dass allein der Tod die Bindung lösen darf. Da der hebräische Wortlaut knapper ist und unterschiedlich aufgefasst werden kann, wird die wörtlichere Möglichkeit in einer Fußnote bewahrt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Text gebraucht den persönlichen Gottesnamen. „Jahwe“ gibt ihn in der im modernen Deutschen üblichen wissenschaftlichen Form wieder.
- issue: Reichweite der Schwurklausel über den Tod
  choice: wenn etwas anderes als der Tod mich von dir trennt
  alternative: wenn der Tod mich von dir trennt; nur der Tod wird mich von dir trennen
  rationale: 'Die gewählte Fassung bringt den üblichen Sinn des Selbstverpflichtungsschwurs zum Ausdruck: Kein geringerer Grund als der Tod darf die beiden trennen. Die knappe hebräische Form lässt jedoch eine wörtlichere beziehungsweise emphatische Deutung zu; diese Spannung wird in der Fußnote offengelegt.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feierliche Parallelität des Gelöbnisses und die Härte der Selbstverfluchungsformel bleiben erhalten; ungewohnte hebräische Wendungen werden im Haupttext verständlich und in den Fußnoten transparent gemacht.
