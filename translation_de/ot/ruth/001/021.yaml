id: RUT.1.21
reference: Ruth 1:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֲנִי֙ מְלֵאָ֣ה הָלַ֔כְתִּי וְ/רֵיקָ֖ם הֱשִׁיבַ֣/נִי יְהוָ֑ה לָ֣/מָּה תִקְרֶ֤אנָה לִ/י֙ נָעֳמִ֔י וַֽ/יהוָה֙ עָ֣נָה בִ֔/י וְ/שַׁדַּ֖י הֵ֥רַֽע לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/021.yaml
  text: I went away full[a], but Yahweh has brought me back empty. Why do you call me Naomi[b], when Yahweh has testified against me and the Almighty has brought calamity on me?
translation:
  language: de
  text: Voll bin ich fortgegangen, doch leer hat Jahwe mich zurückgebracht. Warum nennt ihr mich Noomi, wo doch Jahwe gegen mich ausgesagt[a] und der Allmächtige mir Unheil zugefügt hat[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gegen mich Zeugnis abgelegt“. Das hebräische Verb kann hier das Antworten oder Aussagen gegen jemanden bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mir Böses widerfahren lassen“. Gemeint ist Unheil oder schweres Leid, nicht notwendigerweise moralisch böses Handeln.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְלֵאָה
  choice: voll
  rationale: Das prädikative Adjektiv bezeichnet Noomis früheren Zustand. „Voll“ bewahrt den knappen, starken Gegensatz zu „leer“, ohne den gemeinten Reichtum ausdrücklich auf Familie oder Besitz festzulegen.
- source_word: הָלַכְתִּי
  choice: bin ich fortgegangen
  rationale: Das Verb bedeutet „gehen“. „Fortgegangen“ macht in natürlichem Deutsch den Aufbruch aus der Heimat deutlich, ohne zusätzliche Einzelheiten einzutragen.
- source_word: וְרֵיקָם
  choice: doch leer
  rationale: Das adverbial gebrauchte Wort kann „leer“ oder „mit leeren Händen“ bedeuten. „Leer“ entspricht unmittelbar dem Gegensatz zu מְלֵאָה und lässt offen, worin Noomis Verlust besteht.
- source_word: הֱשִׁיבַנִי
  choice: hat mich zurückgebracht
  rationale: 'Der Hifil von שוב drückt Veranlassung aus: Jahwe hat Noomi zurückkehren lassen beziehungsweise zurückgebracht. Die Formulierung wahrt die ausdrückliche göttliche Urheberschaft.'
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in der im Deutschen geläufigen Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לָמָּה תִקְרֶאנָה לִי נָעֳמִי
  choice: Warum nennt ihr mich Noomi
  rationale: Die rhetorische Frage richtet sich an mehrere Frauen. „Nennt ihr“ gibt die feminine Pluralform wieder und klingt im Deutschen natürlich.
- source_word: נָעֳמִי
  choice: Noomi
  rationale: Die im Deutschen etablierte Namensform wird verwendet. Die Bedeutung des Namens („meine Wonne/Liebliche“) wird nicht erklärend in den Vers hineingetragen.
- source_word: עָנָה בִי
  choice: gegen mich ausgesagt
  rationale: 'Die Verbindung kann forensisch verstanden werden: gegen jemanden antworten beziehungsweise Zeugnis ablegen. „Gegen mich ausgesagt“ hält diesen Sinn fest und unterscheidet die Aussage von der folgenden Rede über das Unheil.'
- source_word: שַׁדַּי
  choice: der Allmächtige
  rationale: Der Gottesbeiname wird sinngemäß und entsprechend dem geläufigen deutschen Bibelwortschatz wiedergegeben.
- source_word: הֵרַע לִי
  choice: mir Unheil zugefügt
  rationale: Der Hifil von רעע bezeichnet hier das Zufügen von Unglück oder schwerem Leid. „Unheil zugefügt“ bewahrt die starke Aussage, ohne Gott im Deutschen moralisches Böses zuzuschreiben.
theological_decisions:
- issue: Noomis Zuschreibung ihres Leidens an Gott
  choice: 'Die unmittelbare göttliche Urheberschaft bleibt erhalten: Jahwe hat sie leer zurückgebracht, gegen sie ausgesagt und ihr Unheil zugefügt.'
  alternative: 'Abschwächend übersetzen: Gott habe das Unheil nur zugelassen.'
  rationale: Der hebräische Text spricht Gottes Handeln direkt aus. Diese theologische Spannung darf nicht durch eine Deutung als bloße Zulassung aufgelöst werden.
- issue: Verhältnis der beiden Schlussaussagen
  choice: עָנָה בִי wird forensisch mit „gegen mich ausgesagt“ wiedergegeben und nicht mit „mich heimgesucht“.
  alternative: עָנָה als Aussage über Bedrängnis oder Demütigung verstehen.
  rationale: Die forensische Wiedergabe wahrt eine mögliche eigenständige Aussage und verhindert, dass beide parallelen Satzteile vorschnell zu derselben Leidensaussage eingeebnet werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst knapper Satzführung. Die ungewöhnliche Anfangsstellung „Voll bin ich …, doch leer …“ bildet den scharfen hebräischen Gegensatz nach. Die Anrede im femininen Plural wird durch „ihr“ sichtbar. Sämtliche Fußnotenmarker stehen unmittelbar bei den erläuterten Wendungen.
