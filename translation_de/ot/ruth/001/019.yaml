base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/019.yaml
  text: So the two of them went on until they came to Bethlehem. And when they came to Bethlehem[a], the whole town was stirred because of them, and the women said, “Is this Naomi?”
translation:
  language: de
  text: 'So gingen die beiden weiter, bis sie nach Bethlehem kamen. Als sie in Bethlehem ankamen, geriet die ganze Stadt ihretwegen in Aufregung, und die Frauen[a] sagten: »Ist das Noomi?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb für »sagten« steht in der weiblichen Mehrzahl und zeigt damit, dass Frauen sprechen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלַכְנָה שְׁתֵּיהֶם
  choice: So gingen die beiden weiter
  rationale: Die feminine Pluralform bezeichnet Noomi und Rut; »gingen … weiter« gibt den fortschreitenden Reiseverlauf natürlich wieder, während »die beiden« die ausdrückliche Paarform bewahrt.
- source_word: עַד בֹּאָנָה בֵּית לָחֶם
  choice: bis sie nach Bethlehem kamen
  rationale: עַד mit בוא bezeichnet den Endpunkt der Reise. Bei einem Ortsziel ist »nach Bethlehem« im Deutschen idiomatisch.
- source_word: וַיְהִי כְּבֹאָנָה בֵּית לֶחֶם
  choice: Als sie in Bethlehem ankamen
  rationale: Die hebräische Erzählformel leitet das beim Eintreffen eintretende Geschehen ein. Die Wiederholung Bethlehems bleibt wie im Ausgangstext erhalten.
- source_word: וַתֵּהֹם כָּל הָעִיר
  choice: geriet die ganze Stadt … in Aufregung
  rationale: המה bezeichnet eine erregte, unruhige Bewegung oder ein Aufgewühltsein. »In Aufregung geraten« bewahrt diese Weite, ohne zwingend einen gewaltsamen Aufruhr anzunehmen.
- source_word: עֲלֵיהֶן
  choice: ihretwegen
  rationale: 'עַל bezeichnet hier den Anlass der Erregung: Die Ankunft der beiden Frauen versetzt die Stadt in Aufregung.'
- source_word: וַתֹּאמַרְנָה
  choice: die Frauen sagten
  rationale: Die Verbform ist feminin plural und weist die Sprechenden als Frauen aus. Die ausdrückliche Benennung erhält diese im Deutschen sonst unsichtbare Information.
- source_word: הֲזֹאת נָעֳמִי
  choice: Ist das Noomi?
  rationale: Die knappe Frage gibt die erstaunte Wiedererkennung wieder, ohne verstärkende Zusätze wie »wirklich« einzutragen. »Noomi« folgt der etablierten deutschen Form des Namens.
