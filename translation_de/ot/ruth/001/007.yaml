  text: וַ/תֵּצֵ֗א מִן הַ/מָּקוֹם֙ אֲשֶׁ֣ר הָיְתָה שָׁ֔מָּ/ה וּ/שְׁתֵּ֥י כַלֹּתֶ֖י/הָ עִמָּ֑/הּ וַ/תֵּלַ֣כְנָה בַ/דֶּ֔רֶךְ לָ/שׁ֖וּב אֶל אֶ֥רֶץ יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/007.yaml
  text: So she went out from the place where she had been[a], and her two daughters-in-law with her, and they went on the way to return to the land of Judah.
translation:
  language: de
  text: Da verließ sie den Ort, an dem sie gewesen war, zusammen mit ihren beiden Schwiegertöchtern. Sie machten sich auf den Weg, um in das Land Juda zurückzukehren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּצֵא
  choice: Da verließ sie
  rationale: Die narrative Fortführung wird mit „Da“ natürlich wiedergegeben. „Verließ“ drückt das konkrete Hinausgehen im Deutschen idiomatisch aus; die wörtlichere Möglichkeit wird in der Fußnote bewahrt.
- source_word: מִן־הַמָּקוֹם אֲשֶׁר הָיְתָה שָׁמָּה
  choice: den Ort, an dem sie gelebt hatte
  rationale: Die Relativkonstruktion bezeichnet Naomis bisherigen Aufenthalts- beziehungsweise Wohnort. „Gelebt hatte“ ist im Kontext natürlicher als das blassere „gewesen war“, ohne einen engeren Wohnstatus festzulegen.
- source_word: וּשְׁתֵּי כַלֹּתֶיהָ עִמָּהּ
  choice: und ihre beiden Schwiegertöchter gingen mit ihr
  rationale: כַּלָּה bezeichnet hier eindeutig die Schwiegertochter. Das im Hebräischen elliptische „mit ihr“ wird als vollständiger deutscher Satz formuliert.
- source_word: וַתֵּלַכְנָה בַדֶּרֶךְ
  choice: Sie machten sich auf den Weg
  rationale: Die Verbindung aus „gehen“ und „auf dem Weg“ wird idiomatisch wiedergegeben und vermeidet die schwerfällige Formulierung „sie gingen auf dem Weg“.
- source_word: לָשׁוּב
  choice: um … zurückzukehren
  rationale: „Zurückkehren“ erhält das im Buch Rut wichtige Motiv von שׁוב. Der Infinitiv bezeichnet hier das Ziel ihrer Reise.
- source_word: אֶל־אֶרֶץ יְהוּדָה
  choice: in das Land Juda
  rationale: אֶרֶץ wird ausdrücklich mit „Land“ wiedergegeben; „Juda“ bezeichnet das Zielgebiet.
