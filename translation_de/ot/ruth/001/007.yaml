  naturalness: Der Entwurf ist gut verständlich und entspricht modernem Standarddeutsch. Die Satzteilung ist möglich, verdeckt aber leicht, dass Naomi und beide Schwiegertöchter gemeinsam weitergehen. Eine behutsame Umstellung macht den gemeinsamen Reisebeginn klarer.
  terminology: „Schwiegertöchter“ ist der passende Kontextwert von כַּלּוֹתֶיהָ. „Land Juda“ und „zurückkehren“ bewahren die im Hebräischen ausdrücklich genannten Begriffe und das Rückkehrmotiv.
