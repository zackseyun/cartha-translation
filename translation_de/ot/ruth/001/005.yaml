  terminology: „Machlon und Kiljon“ folgt geläufiger deutscher Bibeltransliteration. „Mann“ gibt אִישׁ im possessiven Kontext zutreffend als „Ehemann“ wieder. „Kinder“ ist als unmittelbare Wiedergabe von יְלָדֶיהָ vertretbar; die Fußnote nennt transparent die kontextuell mögliche Lesart „Söhne“.
