  text: וַ/יָּמ֥וּתוּ גַם שְׁנֵי/הֶ֖ם מַחְל֣וֹן וְ/כִלְי֑וֹן וַ/תִּשָּׁאֵר֙ הָֽ/אִשָּׁ֔ה מִ/שְּׁנֵ֥י יְלָדֶ֖י/הָ וּ/מֵ/אִישָֽׁ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/005.yaml
  text: Then both of them also died[a], Mahlon and Chilion, and the woman was left without her two children and without her husband.
translation:
  language: de
  text: Dann starben auch die beiden, Machlon und Kiljon, und die Frau blieb ohne ihre beiden Kinder[a] und ohne ihren Mann zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre beiden Söhne“. Im Hebräischen steht „ihre beiden Kinder“, ein Ausdruck, der allgemein Nachkommen bezeichnen kann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמ֥וּתוּ
  choice: Dann starben
  rationale: Das Wayyiqtol von מוּת führt die Erzählung mit einem weiteren Ereignis fort; „Dann starben“ gibt die zeitliche Abfolge im modernen Deutschen natürlich wieder.
- source_word: גַם שְׁנֵיהֶם
  choice: auch die beiden
  rationale: גַם stellt ihren Tod zu dem bereits berichteten Tod Elimelechs hinzu; שְׁנֵיהֶם betont, dass beide Söhne starben.
- source_word: מַחְלוֹן וְכִלְיוֹן
  choice: Machlon und Kiljon
  rationale: Die Eigennamen werden nach geläufigen deutschen Bibelkonventionen wiedergegeben.
- source_word: וַתִּשָּׁאֵר
  choice: blieb ... zurück
  rationale: שׁאר bezeichnet das Übrigbleiben beziehungsweise Zurückbleiben. Im Zusammenhang der Todesfälle vermittelt „blieb ... zurück“ sowohl Naomis Überleben als auch ihren Verlust.
- source_word: הָאִשָּׁה
  choice: die Frau
  rationale: Der hebräische Erzähler bezeichnet Naomi hier ausdrücklich als „die Frau“; ihr Name oder „Witwe“ würde den Wortlaut interpretierend präzisieren.
- source_word: מִשְּׁנֵי יְלָדֶיהָ
  choice: ohne ihre beiden Kinder
  rationale: Die Präposition מִן bezeichnet zusammen mit שׁאר die Trennung beziehungsweise den Verlust. יְלָדִים kann allgemein Kinder oder Nachkommen bezeichnen; „Kinder“ bewahrt die gewählte hebräische Bezeichnung, obwohl hier erwachsene Söhne gemeint sind.
- source_word: וּמֵאִישָׁהּ
  choice: und ohne ihren Mann
  rationale: אִישׁ mit dem Possessivsuffix bezeichnet hier ihren Ehemann. Das wiederholte מִן setzt den Gedanken des Verlusts fort und wird idiomatisch mit „ohne“ wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem hebräischen Erzählfluss, während „blieb ... zurück“ und die zweimalige Verwendung von „ohne“ den Verlust natürlich und klar ausdrücken.
