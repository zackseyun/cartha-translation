  source_fidelity: 'Der deutsche Text gibt alle wesentlichen Elemente des Hebräischen genau wieder: den narrativen Fortschritt, den zusätzlichen Verlust durch גַּם, den Tod beider namentlich genannter Söhne sowie Naomis Zurückbleiben ohne Kinder und Ehemann. „Die Frau“ wahrt die Bezeichnung הָאִשָּׁה, ohne den Namen ergänzend einzusetzen.'
