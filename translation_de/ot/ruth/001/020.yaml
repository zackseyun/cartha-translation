source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר אֲלֵי/הֶ֔ן אַל תִּקְרֶ֥אנָה לִ֖/י נָעֳמִ֑י קְרֶ֤אןָ לִ/י֙ מָרָ֔א כִּי הֵמַ֥ר שַׁדַּ֛י לִ֖/י מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/020.yaml
  text: But she said to them[a], “Do not call me Naomi; call me Mara, for the Almighty has made me very bitter.”
translation:
  language: de
  text: 'Doch sie sagte zu ihnen[a]: »Nennt mich nicht Noomi; nennt mich Mara, denn der Allmächtige hat mich sehr bitter gemacht.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Noomi bedeutet etwa „angenehm“, Mara „bitter“.
    reason: Die Namen bilden im Hebräischen ein Wortspiel, das der Haupttext durch die Transliteration nicht vollständig erkennen lässt.
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Doch sie sagte
  rationale: Das Waw setzt die Erzählung fort; im Zusammenhang bildet Noomis Antwort zugleich einen deutlichen Gegensatz zur Begrüßung der Frauen.
- source_word: אֲלֵיהֶן
  choice: zu ihnen
  rationale: Das feminine Pluralsuffix bezieht sich im Kontext auf die Frauen von Bethlehem; im Deutschen ist »ihnen« natürlich und eindeutig genug.
- source_word: אַל תִּקְרֶאנָה לִי נָעֳמִי
  choice: Nennt mich nicht Noomi
  rationale: קרא mit einer Person und einem Namen bedeutet hier »nennen«. Die Pluralform wird durch »nennt« wiedergegeben; der Personenname wird transliteriert.
- source_word: קְרֶאןָ לִי מָרָא
  choice: nennt mich Mara
  rationale: Die Wiederholung von »nennt mich« bewahrt den rhetorischen Gegensatz der beiden Namen. Mara wird als neue Namensbezeichnung transliteriert.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet Noomis Begründung für die gewünschte Umbenennung ein.
- source_word: הֵמַר ... לִי מְאֹד
  choice: hat mich sehr bitter gemacht
  rationale: Der Hifil von מרר kann »bitter machen« bedeuten. Diese direkte Wiedergabe bewahrt die sprachliche Verbindung zu Mara und lässt Noomis Aussage in ihrer Schärfe stehen.
- source_word: שַׁדַּי
  choice: der Allmächtige
  rationale: Der traditionelle deutsche Titel gibt die übliche Deutung des Gottesepithetons verständlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesepithetons שַׁדַּי
  choice: der Allmächtige
  alternative: Schaddai
  rationale: »Der Allmächtige« ist die etablierte, semantisch verständliche Wiedergabe des Titels; die Transliteration »Schaddai« wäre möglich, würde seine traditionelle Bedeutung aber gewöhnlichen Lesern weniger deutlich vermitteln.
- issue: Noomis Zuschreibung ihres bitteren Ergehens an Gott
  choice: hat mich sehr bitter gemacht
  alternative: ist sehr bitter mit mir umgegangen
  rationale: Die kausative Formulierung des Hebräischen wird nicht abgeschwächt. Sie bewahrt sowohl Noomis direkte Klage als auch das Wortspiel mit Mara, ohne ihre Aussage theologisch zu erklären oder zu korrigieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede steht im Plural und nimmt die Frauen von Bethlehem auf. »Noomi« folgt der im Deutschen gebräuchlichen biblischen Namensform; »Mara« wahrt den Namenscharakter, während die Fußnote das Wortspiel erschließt.
