revisions:
- from: Da machte sie sich mit ihren Schwiegertöchtern auf, um aus dem Gebiet Moabs zurückzukehren. Denn noch in Moab hatte sie gehört, dass Jahwe sich seines Volkes angenommen und ihnen Nahrung[a] gegeben hatte.
  to: Da machte sie sich mit ihren Schwiegertöchtern auf und kehrte aus dem Gebiet Moabs zurück; denn im Gebiet Moabs hatte sie gehört, dass Jahwe sich seines Volkes angenommen hatte, um ihnen Nahrung[a] zu geben.
  rationale: Die Revision stellt die beiden hebräischen Erzählverben als koordinierte Handlungen dar, entfernt die zusätzliche Nuance „noch“ und gibt die finale Infinitivkonstruktion לָתֵת als „um ... zu geben“ wieder. Die regional verstandene Wiedergabe von שָׂדֶה mit „Gebiet“ bleibt möglich und verständlich; die Fußnote bewahrt die spezifische Lesart „Brot“.
