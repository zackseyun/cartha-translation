    issue: Koordinierter Erzählverb wird als Zweckinfinitiv wiedergegeben.
    rationale: וַתָּשָׁב ist ein finites Wayyiqtol und setzt die Erzählhandlung fort. „Und kehrte ... zurück“ wahrt diese Aussage besser als „um ... zurückzukehren“.
  - severity: low
    issue: „noch in Moab“ ergänzt eine Nuance.
    rationale: בִּשְׂדֵה מוֹאָב lokalisiert das Hören in Moab, enthält aber kein ausdrückliches „noch“. Die Ergänzung sollte entfallen.
  - severity: medium
    issue: „... Nahrung gegeben hatte“ behandelt die Nahrungsgebung als abgeschlossenes Hintergrundereignis.
    rationale: לָתֵת לָהֶם לֶחֶם ist ein Infinitiv mit finaler Funktion („um ihnen Nahrung zu geben“). Diese Beziehung sollte im Deutschen sichtbar bleiben.
  revised_text: Da machte sie sich mit ihren Schwiegertöchtern auf und kehrte aus dem Gebiet Moabs zurück; denn im Gebiet Moabs hatte sie gehört, dass Jahwe sich seines Volkes angenommen hatte, um ihnen Nahrung[a] zu geben.
