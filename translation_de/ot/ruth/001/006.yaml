  text: וַ/תָּ֤קָם הִיא֙ וְ/כַלֹּתֶ֔י/הָ וַ/תָּ֖שָׁב מִ/שְּׂדֵ֣י מוֹאָ֑ב כִּ֤י שָֽׁמְעָה֙ בִּ/שְׂדֵ֣ה מוֹאָ֔ב כִּֽי פָקַ֤ד יְהוָה֙ אֶת עַמּ֔/וֹ לָ/תֵ֥ת לָ/הֶ֖ם לָֽחֶם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/006.yaml
  text: Then she arose with her daughters-in-law and returned from the fields of Moab[a], because in the field of Moab she had heard that Yahweh had visited his people to give them food.
translation:
  language: de
  text: Da machte sie sich mit ihren Schwiegertöchtern auf und kehrte aus dem Gebiet Moabs zurück; denn im Gebiet Moabs hatte sie gehört, dass Jahwe sich seines Volkes angenommen hatte, um ihnen Nahrung[a] zu geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Brot“. Das hebräische Wort kann auch Nahrung oder Lebensmittel allgemein bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּקָם
  choice: Da machte sie sich … auf
  rationale: Das Qal-Wayyiqtol von קום führt die Erzählung weiter. Im Deutschen bezeichnet „sich aufmachen“ idiomatisch den Beginn der beabsichtigten Rückreise.
- source_word: וְכַלֹּתֶיהָ
  choice: mit ihren Schwiegertöchtern
  rationale: Das mit וְ verbundene Substantiv bezeichnet hier Begleitung; „mit“ gibt dies natürlich wieder.
- source_word: וַתָּשָׁב
  choice: um … zurückzukehren
  rationale: שׁוב bedeutet „zurückkehren/umkehren“. Die Infinitivkonstruktion macht im Deutschen deutlich, dass sie die Rückkehr antrat; der folgende Vers beschreibt erst den Weg.
- source_word: מִשְּׂדֵי מוֹאָב
  choice: aus dem Gebiet Moabs
  rationale: Der Plural von שׂדה kann neben einzelnen Feldern auch das offene Land beziehungsweise Gebiet bezeichnen. „Gebiet Moabs“ vermeidet die missverständliche Vorstellung, sie habe sich lediglich auf mehreren Äckern befunden.
- source_word: שָׁמְעָה
  choice: hatte sie gehört
  rationale: Das Qatal nennt den bereits vorausliegenden Anlass ihres Aufbruchs; das Plusquamperfekt bildet dieses zeitliche Verhältnis natürlich ab.
- source_word: בִּשְׂדֵה מוֹאָב
  choice: noch in Moab
  rationale: Der Singular שׂדה bezeichnet hier regional das Land beziehungsweise Gebiet Moabs. „Noch“ verdeutlicht idiomatisch, dass sie die Nachricht vor ihrem Aufbruch dort erhielt.
- source_word: פָקַד
  choice: sich … angenommen
  rationale: פקד bezeichnet hier Jahwes wohlwollendes Eingreifen zugunsten seines Volkes. „Sich annehmen“ bewahrt diese persönliche Zuwendung, ohne die konkrete Art des Handelns über den Text hinaus festzulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben. „Jahwe“ ist die im modernen Deutschen übliche Form der wissenschaftlich begründeten Lesung des Tetragramms.
- source_word: עַמּוֹ
  choice: seines Volkes
  rationale: עַם bezeichnet hier Gottes Volk und bewahrt die relationale Aussage des Possessivsuffixes.
- source_word: לָתֵת לָהֶם לָחֶם
  choice: und ihnen Nahrung gegeben hatte
  rationale: Die Infinitivkonstruktion nennt die konkrete Gestalt von Jahwes Zuwendung. לֶחֶם bedeutet wörtlich „Brot“, kann aber metonymisch Nahrung oder Lebensmittel insgesamt bezeichnen; im Zusammenhang mit der Hungersnot ist „Nahrung“ im Haupttext natürlich und sachgerecht.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. Seine Wiedergabe als „Jahwe“ bewahrt den Eigennamecharakter, während „der HERR“ die traditionelle Ersatzlesung darstellt.
- issue: Bedeutung von פקד als göttliches Handeln
  choice: sich seines Volkes angenommen
  alternative: sein Volk besucht
  rationale: Im Zusammenhang bezeichnet פקד ein gnädiges, wirksames Eingreifen. Die gewählte Formulierung vermittelt die positive Zuwendung im natürlichen Deutschen; „besucht“ wäre formaler, könnte heute jedoch wie ein bloßer Aufenthalt klingen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzfolge bleibt nahe am hebräischen Handlungsablauf; regionale Wendungen mit שׂדה werden idiomatisch wiedergegeben. Der Fußnotenmarker [a] steht unmittelbar bei „Nahrung“, auf die sich die Anmerkung bezieht.
