  terminology: „Jahwe“ gibt das Tetragramm als Eigenname konsistent wieder. „Ruhe“ ist als bewusst offene Grundbedeutung angemessen; die Fußnote erläutert den im Kontext angesprochenen Schutz und die gefestigte Lebenssituation, ohne den Text auf eine engere Deutung festzulegen.
