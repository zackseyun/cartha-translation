  source_fidelity: Die Übersetzung gibt den Segenswunsch mit Konjunktiv I treffend wieder und bewahrt die Abfolge des hebräischen Satzes. „Ruhe“ entspricht מְנוּחָה; „jede im Haus ihres Mannes“ bringt die distributive Aussage von אִשָּׁה בֵּית אִישָׁהּ klar zum Ausdruck. Die folgenden narrativen Handlungen und das bildhafte „sie erhoben ihre Stimmen“ entsprechen dem hebräischen Text.
