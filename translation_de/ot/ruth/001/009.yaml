base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/009.yaml
  text: May Yahweh grant that you find rest[a], each of you in the house of her husband." Then she kissed them, and they lifted up their voices and wept.
translation:
  language: de
  text: Jahwe gebe euch, dass ihr Ruhe findet[a], jede im Haus ihres Mannes.« Dann küsste sie die beiden. Da erhoben sie ihre Stimmen und weinten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Geborgenheit“ oder „ein gesichertes Zuhause“. Mit „Ruhe“ ist hier ein beständiges, abgesichertes Leben im Haus eines Ehemannes gemeint.'
    reason: lexikalische Alternative und kontextuelle Erläuterung
lexical_decisions:
- source_word: יִתֵּן
  choice: gebe
  rationale: Der hebräische Verbmodus drückt hier einen Segenswunsch aus; der deutsche Konjunktiv I gibt ihn knapp und würdevoll wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וּמְצֶאןָ
  choice: dass ihr ... findet
  rationale: Das Verb führt den Segenswunsch fort. Die Konstruktion mit „dass“ ist im Deutschen natürlich und bewahrt den inhaltlichen Zusammenhang mit „gebe euch“.
- source_word: מְנוּחָה
  choice: Ruhe
  rationale: „Ruhe“ bewahrt die Grundbedeutung des Nomens; im Kontext bezeichnet es zugleich ein gesichertes, beständiges Leben durch eine neue Ehe.
- source_word: אִשָּׁה בֵּית אִישָׁהּ
  choice: jede im Haus ihres Mannes
  rationale: Die Formulierung ist distributiv auf die beiden Frauen bezogen. „Jede“ macht dies im Deutschen deutlich, ohne den hebräischen Ausdruck unnötig auszubauen.
- source_word: וַתִּשַּׁק לָהֶן
  choice: Dann küsste sie die beiden
  rationale: Das narrative Verb bezeichnet die nächste Handlung; „die beiden“ vermeidet im Deutschen eine mögliche Unklarheit des Pronomens.
- source_word: וַתִּשֶּׂאנָה קוֹלָן
  choice: Da erhoben sie ihre Stimmen
  rationale: Die hebräische Redewendung wird weitgehend formal bewahrt und bezeichnet hörbares, lautes Klagen.
- source_word: וַתִּבְכֶּינָה
  choice: und weinten
  rationale: Dies ist die direkte und natürliche Wiedergabe des abschließenden Verbs.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet das Tetragramm ausdrücklich. Die Wiedergabe als „Jahwe“ wahrt den Charakter als Eigenname, statt ihn interpretierend durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Segenswunsch bleibt knapp; die hebräische Wendung „die Stimmen erheben“ wird wegen ihrer Verständlichkeit und ihres erzählerischen Tons beibehalten.
