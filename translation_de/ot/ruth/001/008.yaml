base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/008.yaml
  text: And Naomi said to her two daughters-in-law[a], “Go, return, each to her mother’s house. May Yahweh show you kindness, as you have shown it to the dead and to me.”
translation:
  language: de
  text: 'Da sagte Naomi zu ihren beiden Schwiegertöchtern: „Geht, kehrt zurück, jede in das Haus ihrer Mutter! Jahwe erweise euch Güte[a], wie ihr sie den Toten und mir erwiesen habt.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „beständige Liebe“, „loyale Liebe“ oder „Bundestreue“ (hebräisch ḥesed).'
    reason: Lexikalische Bedeutungsbreite von חֶסֶד.
lexical_decisions:
- source_word: כַלֹּתֶיהָ
  choice: ihren beiden Schwiegertöchtern
  rationale: כַלָּה bezeichnet hier die Ehefrau eines Sohnes; „Schwiegertöchter“ ist im Deutschen die natürliche und genaue Entsprechung.
- source_word: לֵכְנָה שֹּׁבְנָה
  choice: Geht, kehrt zurück
  rationale: Die beiden femininen Pluralimperative werden jeweils wiedergegeben, damit der nachdrückliche Aufruf des Hebräischen erhalten bleibt.
- source_word: אִשָּׁה לְבֵית אִמָּהּ
  choice: jede in das Haus ihrer Mutter
  rationale: אִשָּׁה wird distributiv als „jede“ verstanden. „Haus ihrer Mutter“ bewahrt die konkrete hebräische Formulierung, statt sie zu „Elternhaus“ zu verallgemeinern.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in seiner im Deutschen geläufigen Form wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: חֶסֶד
  choice: Güte
  rationale: „Güte“ ist in diesem Segenswunsch klar und idiomatisch; die Bedeutungsanteile von beständiger Liebe, Loyalität und Bundestreue werden in der Fußnote offengehalten.
- source_word: עֲשִׂיתֶם עִם הַמֵּתִים וְעִמָּדִי
  choice: wie ihr sie den Toten und mir erwiesen habt
  rationale: עשה mit חֶסֶד wird idiomatisch als „Güte erweisen“ wiedergegeben. Das Pronomen „sie“ stellt den Bezug zu „Güte“ her; „die Toten“ bleibt entsprechend dem Hebräischen allgemein.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen, ohne ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Bedeutungsbreite von חֶסֶד
  choice: Güte mit Fußnote
  alternative: Bundestreue
  rationale: Der Zusammenhang betont das loyale, fürsorgliche Handeln der Schwiegertöchter. „Güte“ liest sich natürlich, während die Fußnote die mögliche bundestheologische und loyale Nuance bewahrt, ohne sie im Haupttext einseitig festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die doppelte Aufforderung und die konkrete Wendung „Haus ihrer Mutter“ bleiben erhalten; die Satzstellung wurde für natürliches Deutsch behutsam angepasst.
