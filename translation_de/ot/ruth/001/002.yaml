  text: וְ/שֵׁ֣ם הָ/אִ֣ישׁ אֱֽלִימֶ֡לֶךְ וְ/שֵׁם֩ אִשְׁתּ֨/וֹ נָעֳמִ֜י וְ/שֵׁ֥ם שְׁנֵֽי בָנָ֣י/ו מַחְל֤וֹן וְ/כִלְיוֹן֙ אֶפְרָתִ֔ים מִ/בֵּ֥ית לֶ֖חֶם יְהוּדָ֑ה וַ/יָּבֹ֥אוּ שְׂדֵי מוֹאָ֖ב וַ/יִּֽהְיוּ שָֽׁם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/002.yaml
  text: The man's name was Elimelech[a], and his wife's name was Naomi, and the names of his two sons were Mahlon and Chilion. They were Ephrathites from Bethlehem in Judah[c][b]. They came to the fields of Moab and were there.
translation:
  language: de
  text: Der Mann hieß Elimelech, seine Frau hieß Noomi, und seine beiden Söhne hießen Machlon und Kiljon.[a] Sie waren Efratiter aus Bethlehem in Juda. Sie kamen in das Gebiet von Moab[b] und waren dort.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name Kiljon kann auch „Chiljon“ geschrieben werden.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „in die Felder Moabs“; auch möglich: „in das Land Moab“ oder „in die Landschaft Moabs“.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „und blieben dort“ oder „und hielten sich dort auf“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם הָאִישׁ
  choice: Der Mann hieß
  rationale: Die hebräische Namensformel wird in natürliches modernes Deutsch übertragen, ohne ihren Inhalt zu verändern.
- source_word: אֱלִימֶלֶךְ
  choice: Elimelech
  rationale: Der Personenname folgt der im Deutschen gebräuchlichen biblischen Umschrift.
- source_word: נָעֳמִי
  choice: Noomi
  rationale: Die traditionelle deutsche Namensform gibt den hebräischen Namen wieder und unterscheidet sich von der englischen Form „Naomi“.
- source_word: שְׁנֵי בָנָיו
  choice: seine beiden Söhne
  rationale: Natürliche deutsche Wiedergabe der hebräischen Verbindung aus Zahlwort, Substantiv und Possessivsuffix.
- source_word: מַחְלוֹן וְכִלְיוֹן
  choice: Machlon und Kiljon
  rationale: Die Namen werden nach gebräuchlicher deutscher biblischer Umschrift wiedergegeben; bei כִלְיוֹן macht „Kiljon“ sowohl den anlautenden k-Laut als auch den Konsonanten Jod sichtbar.
- source_word: אֶפְרָתִים
  choice: Efratiter
  rationale: Das Herkunftswort bezeichnet Menschen aus Efrata beziehungsweise aus dem damit verbundenen Bethlehem; es meint nicht Ephraimiten.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: aus Bethlehem in Juda
  rationale: Die Formulierung identifiziert Bethlehem als den in Juda gelegenen Ort und klingt im modernen Deutsch natürlich.
- source_word: וַיָּבֹאוּ
  choice: Sie kamen
  rationale: Gibt das gewöhnliche Bewegungsverb בוא im Erzählzusammenhang direkt wieder.
- source_word: שְׂדֵי מוֹאָב
  choice: in das Gebiet von Moab
  rationale: Der Plural von שָׂדֶה bezeichnet hier wahrscheinlich die Landschaft beziehungsweise das offene Land Moabs. „Gebiet“ ist im modernen Deutsch klar; die konkrete hebräische Ausdrucksweise bleibt in einer Fußnote erhalten.
- source_word: וַיִּהְיוּ שָׁם
  choice: und blieben dort
  rationale: Die wörtliche Formulierung „und sie waren dort“ bezeichnet im Zusammenhang ihren fortdauernden Aufenthalt. „Blieben dort“ gibt diese Erzählfunktion idiomatisch wieder, während die wörtliche Möglichkeit in einer Fußnote genannt wird.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die wiederholte hebräische Namensformel wird leicht gestrafft, ohne Angaben auszulassen. Herkunftsbezeichnungen und Ortsnamen folgen gebräuchlichen deutschen Bibelformen; konkrete oder mehrdeutige hebräische Wendungen werden im Haupttext natürlich und in den Fußnoten genauer wiedergegeben.
