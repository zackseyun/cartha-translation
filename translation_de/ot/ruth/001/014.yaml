  yaml_path: translation/ot/ruth/001/014.yaml
  text: Then they lifted up their voices and wept again. Orpah kissed her mother-in-law[a], but Ruth clung to her.
translation:
  language: de
  text: Da erhoben sie ihre Stimmen und weinten wieder. Orpa küsste ihre Schwiegermutter[a], Rut aber hielt an ihr fest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und Rut hielt an ihr fest“. Die hebräische Konjunktion kann schlicht „und“ bedeuten; der Zusammenhang legt jedoch einen Gegensatz zwischen Orpas Kuss und Ruts anhaltendem Festhalten nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשֶּׂנָה קוֹלָן
  choice: sie erhoben ihre Stimmen
  rationale: Die hebräische Wendung bedeutet wörtlich, dass sie ihre Stimmen erhoben, und bezeichnet hier hörbares Klagen. Die deutsche Formulierung bewahrt das Bild und klingt zugleich natürlich.
- source_word: וַתִּבְכֶּינָה
  choice: weinten
  rationale: Das Verb bezeichnet Weinen. Die Wiedergabe unterscheidet den eigentlichen Vorgang des Weinens von dem zuvor genannten Erheben der Stimmen.
- source_word: עוֹד
  choice: wieder
  rationale: Im Zusammenhang bezeichnet das Adverb die Wiederholung des bereits in Vers 9 erwähnten Weinens.
- source_word: וַתִּשַּׁק
  choice: küsste
  rationale: Das Verb bedeutet schlicht „küssen“; eine Erweiterung ist nicht nötig.
- source_word: לַחֲמוֹתָהּ
  choice: ihre Schwiegermutter
  rationale: Das Substantiv bezeichnet ausdrücklich die Schwiegermutter; das Suffix bezieht sich hier auf Orpa.
- source_word: דָּבְקָה בָּהּ
  choice: hielt an ihr fest
  rationale: דבק bezeichnet ein enges Festhalten beziehungsweise eine bleibende Bindung. „Hielt an ihr fest“ gibt sowohl die persönliche Anhänglichkeit als auch Ruts Entschlossenheit natürlich wieder, ohne über den Kontext hinauszugehen.
- source_word: וְ
  choice: aber
  rationale: Die Konjunktion bedeutet formal „und“, kann im Zusammenhang jedoch einen Gegensatz ausdrücken. Hier stellt die Erzählung Ruts Festhalten Orpas Abschiedskuss gegenüber; die formale Alternative wird in der Fußnote bewahrt.
- source_word: עָרְפָּה
  choice: Orpa
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: רוּת
  choice: Rut
  rationale: Der Personenname wird in der heute üblichen deutschen Schreibweise wiedergegeben.
