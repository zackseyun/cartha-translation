base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/003.yaml
  text: Then Elimelech[a], Naomi’s husband, died, and she was left, and her two sons.
translation:
  language: de
  text: Dann starb Elimelech, Noomis Mann, und sie blieb mit ihren beiden Söhnen zurück.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: Dann starb
  rationale: Das Wayyiqtol führt die Erzählung weiter. „Dann“ gibt die zeitliche Abfolge im modernen Deutschen natürlich wieder.
- source_word: אֱלִימֶלֶךְ
  choice: Elimelech
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: אִישׁ נָעֳמִי
  choice: Noomis Mann
  rationale: אִישׁ mit dem Namen einer Frau bezeichnet hier idiomatisch ihren Ehemann; die knappe deutsche Form bewahrt diese Beziehung.
- source_word: וַתִּשָּׁאֵר
  choice: blieb ... zurück
  rationale: שׁאר bezeichnet hier das Zurückbleiben nach einem Todesfall. „Zurückbleiben“ gibt den Verlustzusammenhang natürlich und präzise wieder.
- source_word: הִיא וּשְׁנֵי בָנֶיהָ
  choice: sie ... mit ihren beiden Söhnen
  rationale: Die koordinierte hebräische Form nennt Noomi und ihre zwei Söhne als die Verbliebenen. Die deutsche Formulierung mit „mit“ drückt denselben Sachverhalt idiomatisch aus, ohne das unnatürliche „sie und ihre beiden Söhne blieben zurück“ zu erzwingen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch; knapper Erzählstil. „Noomi“ folgt der gebräuchlichen deutschen Namensform. Keine Fußnote nötig, da die idiomatische Wiedergabe den hebräischen Sinn ohne relevante Bedeutungsverengung vermittelt.
