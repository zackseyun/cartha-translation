source:
  edition: WLC
  text: הֲ/לָהֵ֣ן תְּשַׂבֵּ֗רְנָה עַ֚ד אֲשֶׁ֣ר יִגְדָּ֔לוּ הֲ/לָהֵן֙ תֵּֽעָגֵ֔נָה לְ/בִלְתִּ֖י הֱי֣וֹת לְ/אִ֑ישׁ אַ֣ל בְּנֹתַ֗/י כִּֽי מַר לִ֤/י מְאֹד֙ מִ/כֶּ֔ם כִּֽי יָצְאָ֥ה בִ֖/י יַד יְהוָֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/013.yaml
  text: Would you wait for them until they were grown? Would you refrain from belonging to a man for them? No[a], my daughters, for it is much more bitter for me than for you, because the hand of Yahweh has gone out against me.
translation:
  language: de
  text: Würdet ihr auf sie warten, bis sie herangewachsen wären? Würdet ihr ihretwegen darauf verzichten, einen Mann zu heiraten? Nein, meine Töchter! Denn für mich ist es viel bitterer als für euch, weil sich die Hand Jahwes gegen mich gewandt hat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „weil die Hand Jahwes gegen mich ausgegangen ist“.'
    reason: Bewahrt das ungewöhnliche Bewegungsbild von יָצְאָה, während der Haupttext die gemeinte feindliche Wirksamkeit natürlich ausdrückt.
lexical_decisions:
- source_word: תְּשַׂבֵּרְנָה
  choice: würdet ihr auf sie warten
  rationale: שׂבר bezeichnet hier im Zusammenhang das erwartende Warten auf die hypothetischen Söhne Noomis; „warten“ gibt die praktische Aussage im Deutschen natürlich wieder.
- source_word: עַד אֲשֶׁר יִגְדָּלוּ
  choice: bis sie herangewachsen wären
  rationale: Die Form bezeichnet das Heranwachsen der hypothetischen Söhne bis zur Heiratsfähigkeit; der Konjunktiv bewahrt den irrealen Gedankengang.
- source_word: תֵּעָגֵנָה לְבִלְתִּי הֱיוֹת לְאִישׁ
  choice: würdet ihr ihretwegen darauf verzichten, einen Mann zu heiraten
  rationale: Das seltene Verb עגן wird durch die folgende Wendung näher bestimmt und meint wahrscheinlich, sich vom Heiraten zurückzuhalten. Die Übersetzung gibt diesen Sinn verständlich wieder, ohne das seltene Verb unnötig eng festzulegen.
- source_word: אַל־בְּנֹתַי
  choice: Nein, meine Töchter!
  rationale: אַל fungiert hier als emotionaler Einspruch gegen die eben beschriebenen Möglichkeiten, nicht bloß als isoliertes Verbot.
- source_word: כִּי מַר־לִי מְאֹד מִכֶּם
  choice: Denn mir ist es viel bitterer ergangen als euch
  rationale: מִכֶּם wird komparativ verstanden. Die deutsche Formulierung bezeichnet Noomis bitteres Geschick und vermeidet das unnatürliche „es ist mir bitter“.
- source_word: יָצְאָה בִי יַד יְהוָה
  choice: weil sich die Hand Jahwes gegen mich gewandt hat
  rationale: Die Wendung beschreibt Jahwes wirksames Eingreifen gegen Noomi. „Sich gegen mich gewandt“ vermittelt die adversative Kraft idiomatisch; die Fußnote bewahrt das Bild des hebräischen Verbs יצא genauer.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Noomis Aussage über Gottes Wirken in ihrem Leid
  choice: weil sich die Hand Jahwes gegen mich gewandt hat
  alternative: weil die Hand Jahwes gegen mich ausgegangen ist
  rationale: Der Text schreibt Noomis Bedrängnis ausdrücklich Jahwes Hand zu. Die Übersetzung bewahrt diese theologische Spannung, ohne ihre Aussage abzuschwächen oder systematisch zu erklären.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beiden rhetorischen Fragen bleiben parallel. „Einen Mann heiraten“ ist im heutigen Deutsch natürlicher als eine formale Nachbildung von „einem Mann gehören“; der seltene Ausdruck wird dennoch nicht über die vom Kontext gebotene Ehebedeutung hinaus erklärt.
