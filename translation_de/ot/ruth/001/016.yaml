source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר רוּת֙ אַל תִּפְגְּעִי בִ֔/י לְ/עָזְבֵ֖/ךְ לָ/שׁ֣וּב מֵ/אַחֲרָ֑יִ/ךְ כִּ֠י אֶל אֲשֶׁ֨ר תֵּלְכִ֜י אֵלֵ֗ךְ וּ/בַ/אֲשֶׁ֤ר תָּלִ֨ינִי֙ אָלִ֔ין עַמֵּ֣/ךְ עַמִּ֔/י וֵ/אלֹהַ֖יִ/ךְ אֱלֹהָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/016.yaml
  text: But Ruth said[a], “Do not press me to leave you, to turn back from following after you. For where you go, I will go; and where you lodge, I will lodge. Your people will be my people[d][c][b], and your God my God.”
translation:
  language: de
  text: 'Rut aber sagte: „Dränge mich nicht, dich zu verlassen und dir nicht weiter zu folgen. Denn wohin du gehst, dahin werde auch ich gehen, und wo du übernachtest, da werde auch ich übernachten. Dein Volk ist mein Volk, und dein Gott ist mein Gott.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּפְגְּעִי בִי
  choice: Dränge mich nicht
  rationale: פגע mit ב kann hier eindringliches Drängen oder Zureden bezeichnen. „Dränge mich nicht“ ist im modernen Deutschen natürlich und gibt Ruts Bitte wieder, ohne körperliche Einwirkung anzudeuten.
- source_word: לְעָזְבֵךְ
  choice: dich zu verlassen
  rationale: עזב bedeutet hier schlicht, eine Person zu verlassen. Die Wiedergabe ist natürlich und vermeidet die unnötig schwerere Färbung von „im Stich lassen“.
- source_word: לָשׁוּב מֵאַחֲרָיִךְ
  choice: umzukehren, weg von dir
  rationale: שׁוב bezeichnet das Umkehren; מֵאַחֲרָיִךְ lautet wörtlich etwa „von hinter dir weg“. Die Formulierung bewahrt sowohl die Bewegungsrichtung als auch Ruts Entschluss, Noomi weiter zu folgen, ohne im Deutschen schwerfällig zu werden.
- source_word: כִּי
  choice: Denn
  rationale: כִּי leitet hier die Begründung für Ruts Bitte ein. „Denn“ passt zur gehobenen, aber gegenwärtigen direkten Rede.
- source_word: אֶל אֲשֶׁר תֵּלְכִי אֵלֵךְ
  choice: wohin du gehst, dahin werde auch ich gehen
  rationale: Die Zielrichtung von אֶל wird durch „wohin … dahin“ klar wiedergegeben; „auch“ macht die parallele Nachfolge im Deutschen idiomatisch deutlich.
- source_word: וּבַאֲשֶׁר תָּלִינִי אָלִין
  choice: wo du übernachtest, da werde auch ich übernachten
  rationale: לון bezeichnet gewöhnlich das Verbringen der Nacht. „Übernachten“ ist präziser als das allgemeinere „bleiben“ und modernes Standarddeutsch.
- source_word: עַמֵּךְ עַמִּי
  choice: Dein Volk ist mein Volk
  rationale: Die hebräische Nominalklausel enthält keine ausdrücklich markierte Zeitstufe. Das deutsche Präsens erhält die knappe Bekenntnisform und kann im Zusammenhang zugleich Ruts fortgeltende Festlegung ausdrücken.
- source_word: וֵאלֹהַיִךְ אֱלֹהָי
  choice: und dein Gott ist mein Gott
  rationale: Auch diese Nominalklausel wird parallel im Präsens wiedergegeben. אֱלֹהַיִךְ bezeichnet im Kontext Noomis Gott; Singular und Parallelismus werden klar bewahrt.
theological_decisions:
- issue: Zeitbezug der beiden verblosen Identifikationssätze
  choice: 'Beide Klauseln parallel im Präsens: „Dein Volk ist mein Volk, und dein Gott ist mein Gott.“'
  alternative: 'Beide Klauseln zukünftig: „Dein Volk wird mein Volk sein, und dein Gott wird mein Gott sein.“'
  rationale: Das Hebräische lässt die Kopula in beiden parallelen Klauseln aus und legt grammatisch weder Präsens noch Futur ausdrücklich fest. Das deutsche Präsens wahrt die bündige, feierliche Identifikation; der Kontext lässt sie zugleich als Verpflichtung für Ruts weiteren Weg verstehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Parallelstruktur. „Übernachten“ wahrt die konkrete Nachtbedeutung von לון. Die syntaktisch parallelen Schlussklauseln werden auch im Deutschen gleichförmig gestaltet; die im Hebräischen bestehende zeitliche Offenheit wird nicht durch eine unnötige Mischung aus Präsens und Futur aufgelöst.
