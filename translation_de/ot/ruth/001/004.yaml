  text: וַ/יִּשְׂא֣וּ לָ/הֶ֗ם נָשִׁים֙ מֹֽאֲבִיּ֔וֹת שֵׁ֤ם הָֽ/אַחַת֙ עָרְפָּ֔ה וְ/שֵׁ֥ם הַ/שֵּׁנִ֖ית ר֑וּת וַ/יֵּ֥שְׁבוּ שָׁ֖ם כְּ/עֶ֥שֶׂר שָׁנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/004.yaml
  text: And they took for themselves Moabite wives. The name of the one was Orpah[a], and the name of the other was Ruth. And they lived there about ten years.
translation:
  language: de
  text: Und sie nahmen sich moabitische Frauen. Die eine hieß Orpa, die andere Rut. Und sie lebten dort etwa zehn Jahre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׂאוּ לָהֶם נָשִׁים מֹאֲבִיּוֹת
  choice: sie nahmen sich moabitische Frauen
  rationale: Die Verbindung von נָשָׂא mit נָשִׁים bezeichnet die Heirat. Die deutsche Wendung bewahrt das hebräische Bild, während „Frauen“ im Zusammenhang Ehefrauen meint.
- source_word: שֵׁם הָאַחַת ... וְשֵׁם הַשֵּׁנִית
  choice: Die eine hieß ... die andere
  rationale: Dies gibt die hebräische Gegenüberstellung der beiden Frauen natürlich und klar wieder; הַשֵּׁנִית ist formal „die zweite“, bezeichnet hier aber die jeweils andere der beiden.
- source_word: עָרְפָּה
  choice: Orpa
  rationale: Gebräuchliche deutsche Wiedergabe des Personennamens.
- source_word: רוּת
  choice: Rut
  rationale: Gebräuchliche moderne deutsche Wiedergabe des Personennamens.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: Und sie lebten dort
  rationale: יָשַׁב bezeichnet hier den längerfristigen Aufenthalt und wird in natürlichem modernem Deutsch mit „leben“ wiedergegeben.
- source_word: כְּעֶשֶׂר שָׁנִים
  choice: etwa zehn Jahre
  rationale: Das Präfix כְּ kennzeichnet hier eine ungefähre Zeitangabe.
