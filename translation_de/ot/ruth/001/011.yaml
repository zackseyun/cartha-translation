source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר נָעֳמִי֙ שֹׁ֣בְנָה בְנֹתַ֔/י לָ֥/מָּה תֵלַ֖כְנָה עִמִּ֑/י הַֽ/עֽוֹד לִ֤/י בָנִים֙ בְּֽ/מֵעַ֔/י וְ/הָי֥וּ לָ/כֶ֖ם לַ/אֲנָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/011.yaml
  text: But Naomi said[a], “Turn back, my daughters. Why would you go with me? Do I still have sons in my womb, that they may become husbands for you?”
translation:
  language: de
  text: 'Doch Noomi sagte: „Kehrt um, meine Töchter[a]! Warum wollt ihr mit mir gehen? Habe ich etwa noch Söhne in meinem Leib, die eure Ehemänner werden könnten?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „meine Töchter“; Noomi spricht ihre Schwiegertöchter in familiärer Zuneigung so an.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Doch Noomi sagte
  rationale: Das Waw führt die Erzählung fort; „doch“ gibt zugleich den Gegensatz zur zuvor geäußerten Absicht der Schwiegertöchter natürlich wieder.
- source_word: שֹׁבְנָה
  choice: Kehrt um
  rationale: Der feminine Pluralimperativ von שוב fordert beide Frauen auf, umzukehren; „Kehrt um“ bewahrt die Richtungsbedeutung knapp und idiomatisch.
- source_word: בְנֹתַי
  choice: meine Töchter
  rationale: Die wörtliche Anrede drückt Noomis familiäre Zuneigung zu ihren Schwiegertöchtern aus und bleibt deshalb im Haupttext erhalten.
- source_word: לָמָּה תֵלַכְנָה עִמִּי
  choice: Warum wollt ihr mit mir gehen?
  rationale: Die Imperfektform steht in einer rhetorischen Frage. „Wollt ihr“ gibt im Deutschen die beabsichtigte beziehungsweise erwogene Handlung natürlich wieder, ohne sie als bloße Zukunftsaussage festzulegen.
- source_word: הַעוֹד לִי
  choice: Habe ich etwa noch
  rationale: עוד mit der Besitzkonstruktion bezeichnet fortdauernden Besitz; „etwa“ markiert den erwarteten negativen Ausgang der rhetorischen Frage.
- source_word: בָנִים
  choice: Söhne
  rationale: Das Hebräische bezeichnet ausdrücklich Söhne; dies ist für Noomis Argument über mögliche spätere Ehemänner wesentlich.
- source_word: בְּמֵעַי
  choice: in meinem Leib
  rationale: Das Wort bezeichnet die inneren Körperteile und kann im Zusammenhang der Schwangerschaft den Mutterleib meinen. „In meinem Leib“ ist natürlich, würdevoll und bewahrt die körperliche Bildsprache.
- source_word: וְהָיוּ לָכֶם לַאֲנָשִׁים
  choice: die eure Ehemänner werden könnten
  rationale: Die Konstruktion meint hier Männer in der Rolle von Ehemännern. Der Konjunktiv „könnten“ gibt den hypothetischen Gedankengang wieder.
theological_decisions:
- issue: Möglicher Bezug auf die Versorgung verwitweter Frauen durch eine Heirat innerhalb der Familie
  choice: Die eheliche Logik wird durch „Ehemänner“ deutlich gemacht, ohne eine bestimmte Rechtsordnung ausdrücklich zu benennen.
  alternative: Den Satz ausdrücklich als Hinweis auf die Leviratsehe erklären.
  rationale: Der Vers selbst nennt keine Rechtsvorschrift. Eine ausdrückliche Festlegung würde mehr sagen als der hebräische Text, während „Ehemänner“ Noomis Argument hinreichend klar wiedergibt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdevoll-erzählerischem Ton. Die direkte Anrede und die Folge rhetorischer Fragen bleiben erhalten; der Fußnotenmarker steht unmittelbar bei der erläuterten Anrede.
