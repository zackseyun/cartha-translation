  text: וַ/תֹּ֗אמֶר הִנֵּה֙ שָׁ֣בָה יְבִמְתֵּ֔/ךְ אֶל עַמָּ֖/הּ וְ/אֶל אֱלֹהֶ֑י/הָ שׁ֖וּבִי אַחֲרֵ֥י יְבִמְתֵּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/015.yaml
  text: And she said[a], “Look, your sister-in-law has gone back to her people and to her gods[b]. Go back after your sister-in-law.”
translation:
  language: de
  text: 'Da sagte sie: „Sieh, deine Schwägerin ist zu ihrem Volk und zu ihren Göttern[b] zurückgekehrt[a]. Kehre um und folge deiner Schwägerin!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb שוב wird in diesem Vers sowohl für Orpas Rückkehr als auch in Naomis Aufforderung an Ruth verwendet.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „zu ihren Göttern“. Manche übersetzen „zu ihrem Gott“; der Plural bezieht sich wahrscheinlich auf die Gottheiten Moabs.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Da sagte sie
  rationale: Das narrative Wayyiqtol von אמר leitet Naomis Rede ein. „Da sagte sie“ entspricht natürlichem deutschem Erzählstil, ohne den zeitlichen Ablauf zu überdeuten.
- source_word: הִנֵּה
  choice: Sieh
  rationale: Die deiktische Partikel lenkt Ruths Aufmerksamkeit auf Orpas Entscheidung. „Sieh“ bewahrt diesen auffordernden Charakter in würdigem, verständlichem Deutsch.
- source_word: שָׁבָה
  choice: ist … zurückgekehrt
  rationale: Das Qal-Perfekt von שוב bezeichnet Orpas vollzogene Rückkehr. „Zurückgekehrt“ lässt zugleich die Wiederholung desselben hebräischen Verbs im anschließenden Imperativ erkennen.
- source_word: יְבִמְתֵּךְ
  choice: deine Schwägerin
  rationale: Das Substantiv bezeichnet hier die weibliche Verwandte innerhalb der Schwagerehe-Familienbeziehung. „Schwägerin“ ist im Deutschen die verständliche und kontextgerechte Entsprechung und wird an beiden Stellen gleich wiedergegeben.
- source_word: אֶל עַמָּהּ
  choice: zu ihrem Volk
  rationale: עַם meint hier Orpas ethnische und gesellschaftliche Gemeinschaft, nicht nur ihre engere Familie. „Ihr Volk“ gibt diesen Umfang angemessen wieder.
- source_word: וְאֶל אֱלֹהֶיהָ
  choice: und zu ihren Göttern
  rationale: Die morphologisch plurale Form bezeichnet im moabitischen Zusammenhang wahrscheinlich die Gottheiten ihres Volkes. Der Plural wahrt den naheliegenden Sinn, ohne ihn stillschweigend auf eine einzelne Gottheit einzuengen.
- source_word: שׁוּבִי
  choice: Kehre … zurück
  rationale: Der feminine Singularimperativ von שוב richtet sich an Ruth. Die Wiedergabe greift bewusst dasselbe deutsche Verb wie bei Orpas Rückkehr auf.
- source_word: אַחֲרֵי
  choice: deiner Schwägerin nach
  rationale: Die Präposition bezeichnet das Nachfolgen hinter einer Person. Die deutsche Wendung „jemandem nach“ bewahrt dieses Bild knapp und ohne ein zusätzliches Verb einzuführen.
theological_decisions:
- issue: Wiedergabe von אֱלֹהֶיהָ für die moabitische Gottesverehrung
  choice: ihren Göttern
  alternative: ihrem Gott
  rationale: אֱלֹהִים kann zwar je nach Kontext singularisch gebraucht werden, doch hier sprechen die Pluralform und der Bezug auf Orpas moabitisches Volk für dessen Gottheiten. Der Plural bewahrt die wahrscheinlichste Lesart und vermeidet eine unbegründete Identifizierung mit dem Gott Israels.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht markierte Wortstellung „Kehre deiner Schwägerin nach zurück“ bewahrt sowohl das Bild des Nachfolgens als auch die bewusste Wiederholung von שוב, ohne erklärende Zusätze in den Haupttext einzuführen.
