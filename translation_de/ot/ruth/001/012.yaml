  variant: modern standard German
source:
  edition: WLC
  text: שֹׁ֤בְנָה בְנֹתַ/י֙ לֵ֔כְןָ כִּ֥י זָקַ֖נְתִּי מִ/הְי֣וֹת לְ/אִ֑ישׁ כִּ֤י אָמַ֨רְתִּי֙ יֶשׁ לִ֣/י תִקְוָ֔ה גַּ֣ם הָיִ֤יתִי הַ/לַּ֨יְלָה֙ לְ/אִ֔ישׁ וְ/גַ֖ם יָלַ֥דְתִּי בָנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/012.yaml
  text: Turn back[a], my daughters; go on, for I am too old to belong to a husband. Even if I were to say[b], ‘There is still hope for me’—even if I were with a husband tonight and even bore sons—
translation:
  language: de
  text: 'Kehrt um, meine Töchter, geht! Denn ich bin zu alt, um noch einen Mann zu haben.[a] Selbst wenn ich sagte: »Ich habe noch Hoffnung«,[b] selbst wenn ich noch diese Nacht einen Mann hätte und sogar Söhne gebären würde –'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »um einem Mann zu sein«; gemeint sein kann: einen Ehemann haben oder heiraten.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Hebräische entfaltet eine hypothetische Kette: »Denn wenn ich sagte: ›Ich habe Hoffnung‹, wenn ich sogar noch diese Nacht einen Mann hätte und auch Söhne gebären würde …«'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁבְנָה
  choice: Kehrt um
  rationale: Der feminine Pluralimperativ von שוב fordert Rut und Orpa auf, ihre bisherige Richtung umzukehren; „kehrt um“ bewahrt diese Richtungsbedeutung.
- source_word: בְנֹתַי
  choice: meine Töchter
  rationale: Die wörtliche, zugleich liebevolle Anrede wahrt die familiäre Bindung Noomis an ihre Schwiegertöchter.
- source_word: לֵכְנָה
  choice: geht
  rationale: Der zweite feminine Pluralimperativ wird knapp und natürlich wiedergegeben, ohne ein im Hebräischen nicht ausdrücklich genanntes Ziel hinzuzufügen.
- source_word: זָקַנְתִּי
  choice: ich bin zu alt
  rationale: Das Perfekt bezeichnet den durch das Altwerden erreichten gegenwärtigen Zustand; „zu alt“ macht die im Zusammenhang gemeinte Folge deutlich.
- source_word: מִהְיוֹת לְאִישׁ
  choice: um noch einen Mann zu haben
  rationale: Die ungewöhnliche relationale Wendung lautet wörtlich etwa „um einem Mann zu sein“. Im Kontext ist ein Ehemann gemeint; „einen Mann haben“ ist im Deutschen natürlich, ohne den Gedanken unnötig auf einen formalen Eheschluss zu verengen.
- source_word: כִּי אָמַרְתִּי
  choice: Selbst wenn ich sagte
  rationale: כִּי eröffnet hier eine hypothetische Gedankenkette; der deutsche Konjunktiv bewahrt ihren irrealen Charakter.
- source_word: יֶשׁ לִי תִקְוָה
  choice: Ich habe noch Hoffnung
  rationale: Die hebräische Existenzkonstruktion bedeutet idiomatisch „ich habe Hoffnung“; „noch“ bringt die rhetorische Vorstellung einer verbliebenen Möglichkeit zum Ausdruck.
- source_word: גַּם הָיִיתִי הַלַּיְלָה לְאִישׁ
  choice: selbst wenn ich noch diese Nacht einen Mann hätte
  rationale: Die Formulierung wahrt die hypothetische Steigerung und die zeitliche Zuspitzung „diese Nacht“, ohne genauer festzulegen, ob Eheschließung oder eheliche Gemeinschaft im Vordergrund steht.
- source_word: וְגַם יָלַדְתִּי בָנִים
  choice: und sogar Söhne gebären würde
  rationale: ילד bezeichnet das Gebären, und בנים nennt ausdrücklich Söhne; beides ist für Noomis Argument wesentlich.
theological_decisions:
- issue: Männlich spezifizierte Nachkommen im Zusammenhang von Familienfortführung und möglicher Schwagerehe
  choice: Söhne
  alternative: Kinder
  rationale: בָנִים bezeichnet ausdrücklich Söhne. Noomis Argument richtet sich auf mögliche männliche Nachkommen als künftige Ehemänner ihrer Schwiegertöchter; eine Neutralisierung zu „Kinder“ würde diesen Gedankengang abschwächen.
- issue: Art der hypothetischen Verbindung mit einem Mann
  choice: einen Mann hätte
  alternative: heiraten würde / einem Mann gehören würde
  rationale: Die hebräische לְ-Konstruktion bleibt mehrdeutig zwischen dem Erlangen eines Ehemanns und der ehelichen Verbindung. „Einen Mann hätte“ wahrt diese Offenheit natürlicher als eine Festlegung auf den Rechtsakt der Heirat oder eine im Deutschen missverständliche Besitzformulierung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Anrede „meine Töchter“ und die ausdrücklich genannten „Söhne“ bleiben erhalten. Der Gedankenstrich markiert, dass Noomis hypothetischer Satz im folgenden Vers weitergeführt wird.
