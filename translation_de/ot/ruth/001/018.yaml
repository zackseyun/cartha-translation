  text: וַ/תֵּ֕רֶא כִּֽי מִתְאַמֶּ֥צֶת הִ֖יא לָ/לֶ֣כֶת אִתָּ֑/הּ וַ/תֶּחְדַּ֖ל לְ/דַבֵּ֥ר אֵלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/018.yaml
  text: When she saw that she was determined to go with her[a], she stopped speaking to her.
translation:
  language: de
  text: Als sie sah, dass Rut fest entschlossen war, mit ihr zu gehen, hörte sie auf, zu ihr zu reden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: Als sie sah
  rationale: Die Wayyiqtol-Form führt die Erzählung weiter; mit „Als“ wird zugleich der zeitliche Zusammenhang im Deutschen natürlich ausgedrückt.
- source_word: כִּי
  choice: dass
  rationale: Die Konjunktion leitet hier den Inhalt dessen ein, was Noomi erkannte.
- source_word: מִתְאַמֶּצֶת
  choice: fest entschlossen war
  rationale: Der Hitpael von אמץ bezeichnet ein Sich-Stärken und kontextuell eine feste Entschlossenheit. Die deutsche Formulierung gibt diese Beharrlichkeit idiomatisch wieder.
- source_word: הִיא
  choice: Rut
  rationale: Das selbstständige Pronomen hebt das Subjekt hervor. Der Name beseitigt im Deutschen die sonst entstehende Mehrdeutigkeit zwischen den beiden Frauen, ohne den Sinn zu verändern.
- source_word: לָלֶכֶת
  choice: zu gehen
  rationale: הלך bezeichnet in diesem Reisekontext „gehen“, nicht speziell die Fortbewegungsart „zu Fuß gehen“.
- source_word: אִתָּהּ
  choice: mit ihr
  rationale: Die Präpositionalverbindung bezeichnet Ruts Begleitung Noomis.
- source_word: וַתֶּחְדַּל
  choice: hörte sie auf
  rationale: חדל bedeutet „aufhören, ablassen“; „hörte auf“ ist in modernem Deutsch klar und natürlich.
- source_word: לְדַבֵּר אֵלֶיהָ
  choice: ihr zuzureden
  rationale: Formal bedeutet die Wendung „zu ihr zu reden“. Im Kontext geht es um Noomis Versuch, Rut zur Umkehr zu bewegen; „zureden“ macht diesen pragmatischen Sinn natürlich deutlich, während die formalere Lesart in der Fußnote erhalten bleibt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Namen werden zur eindeutigen Zuordnung der beiden weiblichen Pronomen verwendet; „Rut“ ist nur dort eingesetzt, wo das Deutsche sonst unnötig mehrdeutig wäre.
