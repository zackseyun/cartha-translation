base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/010.yaml
  text: But they said to her[a], “No, we will return with you to your people.”
translation:
  language: de
  text: 'Doch sie sagten zu ihr[a]: »Nein, wir werden mit dir zu deinem Volk zurückkehren.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Denn mit dir werden wir zu deinem Volk zurückkehren.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמַרְנָה
  choice: Doch sie sagten
  rationale: Das Waw setzt die Erzählung fort; »doch« macht zugleich den Gegensatz zu Noomis vorausgehender Aufforderung deutlich. Die feminine Pluralform bezeichnet beide Schwiegertöchter.
- source_word: לָּהּ
  choice: zu ihr
  rationale: Die Präposition ל mit Suffix der 3. Person Singular feminin kennzeichnet Noomi als Adressatin.
- source_word: כִּי
  choice: Nein
  rationale: כִּי leitet hier im Zusammenhang eine nachdrückliche Zurückweisung von Noomis Aufforderung ein. »Nein« gibt diese Funktion in natürlichem Deutsch wieder; die wörtlichere kausale beziehungsweise bekräftigende Lesart bleibt in der Fußnote erhalten.
- source_word: אִתָּךְ
  choice: mit dir
  rationale: Die Präposition אֵת mit Suffix der 2. Person Singular feminin bezeichnet die Begleitung Noomis.
- source_word: נָשׁוּב
  choice: wir werden zurückkehren
  rationale: שׁוּב bedeutet »umkehren« oder »zurückkehren«. »Zurückkehren« bewahrt das im ersten Kapitel wiederkehrende Leitwort, auch wenn das Ziel für die Sprecherinnen kein früherer eigener Aufenthaltsort ist.
- source_word: לְעַמֵּךְ
  choice: zu deinem Volk
  rationale: עַם bezeichnet hier Noomis ethnische und soziale Gemeinschaft, nicht nur ihre engere Verwandtschaft.
theological_decisions: []
