  source_fidelity: 'Die Übersetzung gibt die Abfolge und den Sinn des Hebräischen zuverlässig wieder: Boas richtet sich an Rut, lenkt ihre Aufmerksamkeit auf die folgende Weisung, untersagt das Ährenlesen auf einem anderen Feld und das Weggehen und weist sie an, bei seinen weiblichen Arbeitskräften zu bleiben. „Hör gut zu“ ist eine natürliche pragmatische Wiedergabe der rhetorischen Einleitung הֲלוֹא שָׁמַעַתְּ („Hast du nicht gehört?“), ohne den Aussagegehalt der anschließenden Anweisung zu verändern. „Hier“ bei „halte dich hier zu“ ist für וְכֹה angemessen.'
