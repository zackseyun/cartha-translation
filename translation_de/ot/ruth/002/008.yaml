  terminology: „Boas“, „Rut“ und „meine Tochter“ sind korrekt und registergerecht. „Arbeiterinnen“ ist eine kontextgerechte, nicht überinterpretierende Wiedergabe von נַעֲרֹתָי; der Arbeitskontext des Verses rechtfertigt diese Präzisierung. Keine theologischen Fachbegriffe oder Fußnotenanker sind betroffen.
