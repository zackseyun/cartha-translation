  text: וַ/יֹּאמֶר֩ בֹּ֨עַז אֶל ר֜וּת הֲ/ל֧וֹא שָׁמַ֣עַתְּ בִּתִּ֗/י אַל תֵּלְכִי֙ לִ/לְקֹט֙ בְּ/שָׂדֶ֣ה אַחֵ֔ר וְ/גַ֛ם לֹ֥א תַעֲבוּרִ֖י מִ/זֶּ֑ה וְ/כֹ֥ה תִדְבָּקִ֖י/ן עִם נַעֲרֹתָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/008.yaml
  text: 'Then Boaz said to Ruth, “Listen, my daughter: do not go to glean in another field, and also do not go away from here, but stay close with my young women.”'
translation:
  language: de
  text: 'Da sagte Boas zu Rut: „Hör gut zu, meine Tochter! Geh nicht auf ein anderes Feld, um Ähren zu sammeln, und geh auch nicht von hier weg, sondern halte dich hier zu meinen Arbeiterinnen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלוֹא שָׁמַעַתְּ
  choice: Hör gut zu
  rationale: Die wörtliche Frage „Hast du nicht gehört?“ dient hier idiomatisch dazu, Ruts Aufmerksamkeit auf die folgende Anweisung zu lenken. Die Aufforderung gibt diese pragmatische Funktion in natürlichem Deutsch wieder.
- source_word: לִלְקֹט
  choice: um Ähren zu sammeln
  rationale: Das Verb bezeichnet hier das Nachlesen der auf dem Feld zurückgebliebenen Ähren; die Ergänzung „Ähren“ macht den im Kontext vorausgesetzten Gegenstand verständlich.
- source_word: וְגַם לֹא תַעֲבוּרִי מִזֶּה
  choice: und geh auch nicht von hier weg
  rationale: Die Formulierung untersagt Rut, diesen Ort beziehungsweise dieses Feld zu verlassen; die räumliche Aussage bleibt ohne unnötige Präzisierung erhalten.
- source_word: תִדְבָּקִין עִם נַעֲרֹתָי
  choice: halte dich hier zu meinen Arbeiterinnen
  rationale: דבק drückt enges Anschließen beziehungsweise Dabeibleiben aus. נַעֲרוֹת bezeichnet im Arbeitskontext die jungen weiblichen Arbeitskräfte; „Arbeiterinnen“ ist im Deutschen klarer als das missverständliche „junge Frauen“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Boas’ Anrede „meine Tochter“ bewahrt den fürsorglichen und sozial respektvollen Ton. Die direkte Rede ist klar und natürlich formuliert, ohne die Schutz- und Arbeitsverhältnisse über den hebräischen Text hinaus auszudeuten.
