  text: וַ/יֹּ֤אמֶר בֹּ֨עַז֙ לְ/נַעֲר֔/וֹ הַ/נִּצָּ֖ב עַל הַ/קּֽוֹצְרִ֑ים לְ/מִ֖י הַ/נַּעֲרָ֥ה הַ/זֹּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/005.yaml
  text: Then Boaz said to his young man who was set over the reapers[a], “Whose young woman is this?”
translation:
  language: de
  text: 'Da sagte Boas zu seinem jungen Mann, der über die Schnitter eingesetzt war: „Zu wem gehört diese junge Frau?[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Frage kann auch heißen: „Wem gehört diese junge Frau?“ Gemeint ist ihre Zugehörigkeit oder Verbindung zu einer Person beziehungsweise einem Haushalt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw mit Imperfekt führt die Erzählung weiter. „Da sagte“ gibt die zeitliche Folge in natürlichem deutschem Erzählstil wieder.
- source_word: בֹּעַז
  choice: Boas
  rationale: Die im Deutschen gebräuchliche biblische Namensform wird verwendet.
- source_word: לְנַעֲרוֹ
  choice: zu seinem jungen Mann
  rationale: נַעַר kann einen jungen Mann, Diener oder Gehilfen bezeichnen. Die Wiedergabe bewahrt den Grundsinn, während der folgende Ausdruck seine Aufsichtsfunktion ausdrücklich nennt.
- source_word: הַנִּצָּב עַל הַקּוֹצְרִים
  choice: der über die Schnitter eingesetzt war
  rationale: Das Nifal-Partizip von נצב mit עַל bezeichnet hier eine übergeordnete beziehungsweise beauftragte Stellung. Die Formulierung erhält sowohl den passiven Zug als auch die Aufsichtsfunktion.
- source_word: לְמִי
  choice: Zu wem gehört
  rationale: Die hebräische Wendung fragt nach der Zugehörigkeit beziehungsweise der Verbindung zu einem Haushalt oder einer Person. Die deutsche Formulierung lässt diese soziale Zuordnung offen.
- source_word: הַנַּעֲרָה
  choice: junge Frau
  rationale: נַעֲרָה bezeichnet eine junge weibliche Person. „Junge Frau“ ist modern und natürlich, ohne einen ausdrücklich nicht genannten Dienerinnenstatus einzutragen.
- source_word: הַזֹּאת
  choice: diese
  rationale: Das Demonstrativpronomen wird unmittelbar und idiomatisch wiedergegeben.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller Erzählstil. „Schnitter“ ist ein geläufiger biblischer Ausdruck und bildet die Tätigkeit präzise ab. Die etwas formelle Wendung „über ... eingesetzt“ bewahrt die Struktur und den passiven Sinn des Hebräischen.
