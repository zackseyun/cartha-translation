  text: וְ/הִנֵּה בֹ֗עַז בָּ֚א מִ/בֵּ֣ית לֶ֔חֶם וַ/יֹּ֥אמֶר לַ/קּוֹצְרִ֖ים יְהוָ֣ה עִמָּ/כֶ֑ם וַ/יֹּ֥אמְרוּ ל֖/וֹ יְבָרֶכְ/ךָ֥ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/004.yaml
  text: And behold[a], Boaz came from Bethlehem and said to the reapers, “Yahweh be with you.” And they said to him[b], “May Yahweh bless you.”
translation:
  language: de
  text: 'Und siehe, Boas kam aus Bethlehem. Er sagte zu den Schnittern: »Jahwe sei mit euch!« Sie antworteten ihm: »Jahwe segne dich!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Und siehe
  rationale: Die Wendung markiert anschaulich den Eintritt einer neuen Figur in die Szene. »Und siehe« bewahrt diese narrative Unmittelbarkeit in würdigem, noch verständlichem Deutsch.
- source_word: בֹּעַז
  choice: Boas
  rationale: Die im Deutschen etablierte biblische Namensform wird verwendet.
- source_word: בָּא מִבֵּית לֶחֶם
  choice: kam aus Bethlehem
  rationale: Gibt das einfache Bewegungsverb בוא und die Herkunftsangabe mit מִן direkt und idiomatisch wieder.
- source_word: לַקֹּצְרִים
  choice: zu den Schnittern
  rationale: »Schnitter« bezeichnet präzise die mit dem Schneiden des Getreides beschäftigten Arbeiter und passt zum historischen Erntekontext.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: יְהוָה עִמָּכֶם
  choice: Jahwe sei mit euch
  rationale: Der hebräische Nominalsatz lautet wörtlich »Jahwe mit euch«. Im Kontext ist er als Gruß und Segenswunsch zu verstehen; der deutsche Konjunktiv macht diese Funktion natürlich deutlich.
- source_word: יְבָרֶכְךָ יְהוָה
  choice: Jahwe segne dich
  rationale: Die Verbform hat hier volitiven beziehungsweise jussivischen Sinn. Der deutsche Konjunktiv gibt den Segenswunsch knapp und idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht der Gottesname selbst. »Jahwe« bewahrt ihn als persönlichen Namen, ohne ihn durch den traditionellen Ersatztitel zu verdecken.
- issue: Aussage oder Segenswunsch in יְהוָה עִמָּכֶם
  choice: Jahwe sei mit euch
  alternative: Jahwe ist mit euch
  rationale: Der verblose Satz könnte formal als Feststellung ergänzt werden; als Gruß an die Schnitter liegt jedoch eine Wunsch- und Segensformel näher. Die Spannung wird nicht dogmatisch aufgeladen, sondern aus der Gesprächssituation erschlossen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Und siehe« ist bewusst etwas gehoben, um die szenische Funktion von הִנֵּה zu erhalten; »Schnitter« wahrt den konkreten landwirtschaftlichen Bezug. Die direkte Rede verwendet knappe deutsche Segensformeln.
