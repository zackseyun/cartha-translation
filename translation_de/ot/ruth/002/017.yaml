  text: וַ/תְּלַקֵּ֥ט בַּ/שָּׂדֶ֖ה עַד הָ/עָ֑רֶב וַ/תַּחְבֹּט֙ אֵ֣ת אֲשֶׁר לִקֵּ֔טָה וַ/יְהִ֖י כְּ/אֵיפָ֥ה שְׂעֹרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/017.yaml
  text: So she gleaned in the field until evening[a], and beat out what she had gleaned, and it was about an ephah of barley.
translation:
  language: de
  text: Sie las auf dem Feld bis zum Abend Ähren auf und schlug dann aus, was sie aufgelesen hatte. Es war etwa ein Efa[a] Gerste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Efa war ein altes Hohlmaß für trockene Waren und entsprach ungefähr 20–22 Litern.
    reason: cultural_note
lexical_decisions:
- source_word: וַתְּלַקֵּט
  choice: So las sie … Ähren auf
  rationale: Das Verb לקט bezeichnet hier das Nachlesen der von den Schnittern zurückgelassenen Halme beziehungsweise Ähren. „Ähren auflesen“ gibt den landwirtschaftlichen und rechtlichen Zusammenhang im Deutschen verständlich wieder.
- source_word: בַּשָּׂדֶה
  choice: auf dem Feld
  rationale: שׂדה ist die gewöhnliche Bezeichnung für ein Feld; im Deutschen ist bei dieser Tätigkeit „auf dem Feld“ idiomatisch.
- source_word: עַד הָעָרֶב
  choice: bis zum Abend
  rationale: Die Wendung bezeichnet die Dauer von Ruts Arbeit und wird im modernen Deutschen natürlich wiedergegeben.
- source_word: וַתַּחְבֹּט
  choice: Dann schlug sie aus
  rationale: חבט bezeichnet das Ausschlagen der aufgelesenen Halme, um die Körner zu lösen. „Ausschlagen“ ist präziser und anschaulicher als das allgemeinere „dreschen“.
- source_word: אֵת אֲשֶׁר לִקֵּטָה
  choice: was sie aufgelesen hatte
  rationale: Die Relativkonstruktion bezieht sich auf das zuvor gesammelte Erntegut. Die Formulierung wahrt den Bezug zu לקט, ohne im Deutschen schwerfällig zu wirken.
- source_word: וַיְהִי כְּאֵיפָה
  choice: es war etwa ein Efa
  rationale: Das Präfix כ־ kennzeichnet eine ungefähre Menge. Die historische Maßeinheit bleibt als „Efa“ erhalten und wird in einer Fußnote erläutert.
- source_word: שְׂעֹרִים
  choice: Gerste
  rationale: שׂערים bezeichnet hier Gerste beziehungsweise Gerstenkörner; nach der Maßangabe genügt im Deutschen die knappe Form „Gerste“.
