base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/014.yaml
  text: At mealtime Boaz said to her[a], “Come here and eat some bread, and dip your piece in the sour wine.” So she sat beside the reapers, and he passed her roasted grain. She ate and was satisfied, and she had some left over.
translation:
  language: de
  text: 'Zur Essenszeit sagte Boas zu ihr: »Komm her, iss von dem Brot und tauche deinen Bissen in das saure Weingetränk[a].« Da setzte sie sich neben den Schnittern nieder. Er reichte ihr geröstetes Getreide, und sie aß, wurde satt und hatte noch etwas übrig.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in den Essig«. Das hebräische Wort חֹמֶץ kann Essig oder ein saures Weingetränk bezeichnen; bei dieser Mahlzeit auf dem Feld ist wahrscheinlich ein saures Weingetränk gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֵת הָאֹכֶל
  choice: Zur Essenszeit
  rationale: Die Wendung bezeichnet idiomatisch den Zeitpunkt der gemeinsamen Mahlzeit und wird im Deutschen natürlich und präzise wiedergegeben.
- source_word: גֹּשִׁי הֲלֹם
  choice: Komm her
  rationale: Der Imperativ mit Ortsadverb ist eine direkte Aufforderung, näher zu kommen; »Komm her« entspricht dem natürlichen deutschen Sprachgebrauch.
- source_word: וְאָכַלְתְּ מִן הַלֶּחֶם
  choice: iss von dem Brot
  rationale: Die partitive Bedeutung von מִן bleibt sichtbar, ohne unnatürlich zu klingen.
- source_word: וְטָבַלְתְּ פִּתֵּךְ בַּחֹמֶץ
  choice: tauche deinen Bissen in den sauren Wein
  rationale: פַּת bezeichnet hier einen Bissen beziehungsweise ein Stück Brot. חֹמֶץ kann Essig oder ein säuerliches Weingetränk bezeichnen; im Zusammenhang einer Feldarbeitermahlzeit ist »saurer Wein« wahrscheinlich, während die echte lexikalische Alternative in der Fußnote erhalten bleibt.
- source_word: מִצַּד הַקּוֹצְרִים
  choice: neben die Schnitter
  rationale: Die Formulierung bewahrt die räumliche Bedeutung »an der Seite von« und mit »Schnitter« den konkreten Erntezusammenhang.
- source_word: וַיִּצְבָּט לָהּ קָלִי
  choice: Er reichte ihr geröstetes Korn
  rationale: Das seltene Verb bezeichnet im Kontext offenbar das Darreichen der Speise. קָלִי ist geröstetes beziehungsweise gedörrtes Getreide; »geröstetes Korn« ist verständlich und sachlich passend.
- source_word: וַתִּשְׂבַּע
  choice: wurde satt
  rationale: Das Verb bezeichnet das Sattwerden und wird mit einer schlichten, idiomatischen deutschen Wendung wiedergegeben.
- source_word: וַתֹּתַר
  choice: ließ noch etwas übrig
  rationale: Die feminine Verbform führt Rut als Subjekt fort. Das im Hebräischen unausgesprochene Objekt wird im Deutschen zurückhaltend mit »etwas« ergänzt.
