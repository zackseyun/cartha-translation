  text: וַ/יַּ֗עַן הַ/נַּ֛עַר הַ/נִּצָּ֥ב עַל הַ/קּוֹצְרִ֖ים וַ/יֹּאמַ֑ר נַעֲרָ֤ה מֽוֹאֲבִיָּה֙ הִ֔יא הַ/שָּׁ֥בָה עִֽם נָעֳמִ֖י מִ/שְּׂדֵ֥ה מוֹאָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/006.yaml
  text: Then the young man who was set over the reapers answered and said[a], “She is a young Moabite woman who returned with Naomi from the fields of Moab.”
translation:
  language: de
  text: 'Da antwortete der junge Mann, der über die Schnitter eingesetzt war: „Sie ist eine junge Moabiterin, die mit Noomi aus den Feldern Moabs[a] zurückgekehrt ist.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „vom Feld Moabs“; der hebräische Singular kann kollektiv das offene oder landwirtschaftlich genutzte Land Moabs bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: antwortete ... und sagte
  rationale: Die beiden hebräischen Erzählverben werden erkennbar wiedergegeben; die im Deutschen leicht formelhafte Doppelung bewahrt die Struktur des Ausgangstextes.
- source_word: הַנַּעַר
  choice: der junge Mann
  rationale: נַעַר bezeichnet hier zunächst einen jungen Mann; seine Aufsichtsfunktion wird durch den folgenden Ausdruck gesondert benannt, statt sie bereits mit „Aufseher“ in das Substantiv einzutragen.
- source_word: הַנִּצָּב עַל הַקּוֹצְרִים
  choice: der über die Schnitter eingesetzt war
  rationale: Die Formulierung gibt sowohl die stativisch-passive Nuance von נצב als auch die durch עַל bezeichnete Aufsichtsfunktion wieder.
- source_word: הַקּוֹצְרִים
  choice: die Schnitter
  rationale: Das substantivierte Partizip von קצר bezeichnet diejenigen, die Getreide schneiden. „Schnitter“ ist präzise und in diesem landwirtschaftlichen Zusammenhang verständlich.
- source_word: נַעֲרָה מוֹאֲבִיָּה
  choice: eine junge Moabiterin
  rationale: נַעֲרָה bezeichnet eine junge Frau, und das Gentiliz מוֹאֲבִיָּה benennt ihre moabitische Herkunft. Die deutsche Formulierung ist knapp und natürlich.
- source_word: הַשָּׁבָה
  choice: die ... zurückgekehrt ist
  rationale: Das Partizip von שוב bezeichnet die Rückkehr und greift das zentrale Rückkehrmotiv der Erzählung auf.
- source_word: עִם נָעֳמִי
  choice: mit Noomi
  rationale: Die einfache Begleitung durch עִם wird direkt wiedergegeben; „Noomi“ entspricht der im Deutschen geläufigen Namensform.
- source_word: מִשְּׂדֵה מוֹאָב
  choice: aus dem Gebiet Moabs
  rationale: Das singularische שְׂדֵה kann kollektiv oder regional das offene Land beziehungsweise das Gebiet Moabs bezeichnen. „Gebiet“ ist im Deutschen idiomatisch, ohne den Ausdruck unnötig auf ein einzelnes Ackerstück zu verengen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die hebräische Erzählformel „antwortete und sagte“ bleibt bewusst erhalten; altertümliche Wörter werden vermieden, mit Ausnahme des im Erntekontext weiterhin verständlichen und präzisen „Schnitter“.
