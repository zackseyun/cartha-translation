    issue: „Sie hob es auf“ gibt וַתִּשָּׂא im Kontext zu eng wieder.
    rationale: Rut nimmt die Ernte nicht nur vom Boden auf, sondern bringt sie in die Stadt. „Sie trug es in die Stadt“ erfasst die hier naheliegende Bedeutung von נשׂא präziser.
  - severity: medium
    issue: „Dann holte sie heraus“ hat kein ausdrückliches Objekt.
    rationale: Das deutsche Verb „herausholen“ verlangt hier ein Objekt. Die hebräische Reihung „sie brachte heraus und gab ihr, was ...“ lässt sich natürlich durch „sie holte das hervor ... und gab es ihr“ wiedergeben.
  revised_text: Sie trug es in die Stadt, und ihre Schwiegermutter sah, was sie aufgelesen hatte. Dann holte sie das hervor, was sie übrig gelassen hatte, nachdem sie satt geworden war[a], und gab es ihr.
