base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/018.yaml
  text: She picked it up and went into the city[a], and her mother-in-law saw what she had gleaned. Then she brought out and gave her what she had left over after she was satisfied.
translation:
  language: de
  text: Sie trug es in die Stadt, und ihre Schwiegermutter sah, was sie aufgelesen hatte. Dann holte sie das hervor, was sie übrig gelassen hatte, nachdem sie satt geworden war[a], und gab es ihr.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: nachdem sie sich satt gegessen hatte.'
    reason: Lexikalische Alternative für מִשָּׂבְעָהּ, die den im Zusammenhang vorausgesetzten Mahlzeitenbezug ausdrücklich macht.
lexical_decisions:
- source_word: וַתִּשָּׂא
  choice: Sie hob es auf
  rationale: נשׂא bezeichnet das Aufheben bzw. Tragen. Im Zusammenhang nimmt Rut das ausgedroschene Getreide auf, um es nach Hause zu bringen; „hob es auf“ bewahrt die konkrete körperliche Handlung.
- source_word: הָעִיר
  choice: die Stadt
  rationale: עִיר bedeutet gewöhnlich „Stadt“. Auch wenn Bethlehem nach heutigen Maßstäben klein war, entspricht „Stadt“ dem hebräischen Ausdruck und passt zum biblischen Erzählzusammenhang.
- source_word: חֲמוֹתָהּ
  choice: ihre Schwiegermutter
  rationale: Dies ist die übliche und eindeutige deutsche Wiedergabe des Verwandtschaftsbegriffs; das Suffix bezeichnet Noomi als Ruts Schwiegermutter.
- source_word: אֵת אֲשֶׁר לִקֵּטָה
  choice: was sie aufgelesen hatte
  rationale: לקט bezeichnet hier das Auflesen der bei der Ernte zurückgebliebenen Ähren. „Aufgelesen“ gibt den besonderen landwirtschaftlichen Vorgang natürlicher wieder als das allgemeinere „gesammelt“.
- source_word: וַתּוֹצֵא
  choice: Dann holte sie heraus
  rationale: Die Hifil-Form von יצא bedeutet „herausbringen“ oder „herausholen“. Hier holt Rut die von ihrer Mahlzeit zurückbehaltene Speise hervor.
- source_word: וַתִּתֶּן לָהּ
  choice: und gab ihr
  rationale: Die Form bezeichnet eindeutig die Übergabe an die Schwiegermutter. „Gab ihr“ ist die natürliche deutsche Entsprechung.
- source_word: אֵת אֲשֶׁר הוֹתִרָה
  choice: was sie übrig gelassen hatte
  rationale: יתר bezeichnet etwas, das zurückbleibt oder übrig gelassen wird. Der Kontext zeigt, dass Rut einen Teil ihrer Mahlzeit für Noomi aufgehoben hatte.
- source_word: מִשָּׂבְעָהּ
  choice: nachdem sie satt geworden war
  rationale: Der Ausdruck bezeichnet den Zustand der Sättigung, von dem aus etwas übrig blieb. Die Wiedergabe bleibt nah am Hebräischen, ohne den Mahlzeitenkontext unnötig auszuweiten.
