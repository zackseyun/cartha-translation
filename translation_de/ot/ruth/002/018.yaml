  verdict: revise
  source_fidelity: Die Wiedergabe trifft die Handlung im Wesentlichen. וַתִּשָּׂא bezeichnet hier angesichts der Heimkehr mit der aufgelesenen Ernte jedoch eher das Tragen als lediglich das Aufheben. Die abschließende Aussage über das nach ihrer Sättigung Übriggelassene ist sachgerecht wiedergegeben.
  naturalness: „Dann holte sie heraus“ bleibt im Deutschen ohne genanntes Objekt unvollständig und klingt unnatürlich. Eine explizite Objektaufnahme mit anschließendem Pronomen macht die hebräische Abfolge klar und idiomatisch.
  terminology: „Schwiegermutter“, „aufgelesen“ und „Stadt“ sind angemessen. „Aufgelesen“ wahrt den für Rut zentralen Erntebezug, ohne übermäßig zu erläutern.
