source:
  edition: WLC
  text: עֵינַ֜יִ/ךְ בַּ/שָּׂדֶ֤ה אֲשֶׁר יִקְצֹרוּ/ן֙ וְ/הָלַ֣כְתִּ אַחֲרֵי/הֶ֔ן הֲ/ל֥וֹא צִוִּ֛יתִי אֶת הַ/נְּעָרִ֖ים לְ/בִלְתִּ֣י נָגְעֵ֑/ךְ וְ/צָמִ֗ת וְ/הָלַכְתְּ֙ אֶל הַ/כֵּלִ֔ים וְ/שָׁתִ֕ית מֵ/אֲשֶׁ֥ר יִשְׁאֲב֖וּ/ן הַ/נְּעָרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/009.yaml
  text: Keep your eyes on the field where they are harvesting[a], and follow behind them. Have I not commanded the young men not to touch you? When you are thirsty, go to the jars and drink from what the young men have drawn.
translation:
  language: de
  text: Behalte das Feld im Blick, auf dem sie ernten, und geh hinter ihnen her. Habe ich den jungen Männern nicht befohlen, dich nicht anzurühren[a]? Wenn du Durst hast, geh zu den Krügen und trink von dem, was die jungen Männer geschöpft haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: »nicht Hand an dich zu legen«. Das hebräische Verb bedeutet wörtlich »berühren«, kann hier aber auch Belästigung oder einen Übergriff einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינַיִךְ בַּשָּׂדֶה
  choice: Behalte das Feld im Blick
  rationale: Die Nominalformulierung »deine Augen auf das Feld« hat im Zusammenhang auffordernde Kraft. Die deutsche Wendung ist natürlich und bewahrt den Gedanken aufmerksamer Orientierung.
- source_word: אֲשֶׁר יִקְצֹרוּן
  choice: auf dem sie ernten
  rationale: Der Relativsatz bezeichnet das Feld durch die dort stattfindende Erntearbeit; die Verlaufsbedeutung ergibt sich im Deutschen aus dem Kontext.
- source_word: וְהָלַכְתְּ אַחֲרֵיהֶן
  choice: und geh hinter ihnen her
  rationale: Die Form ist als Anweisung an Rut zu verstehen. »Hinter ihnen her« bewahrt die räumliche Bedeutung von אַחֲרֵי; das feminine Pluralsuffix verweist auf die zuvor genannten Arbeiterinnen.
- source_word: הֲלוֹא צִוִּיתִי
  choice: Habe ich ... nicht befohlen
  rationale: Die rhetorische Frage wird in ihrer Form erhalten und vermittelt zugleich die beruhigende Zusicherung des Boas.
- source_word: הַנְּעָרִים
  choice: die jungen Männer
  rationale: Der maskuline Plural bezeichnet hier die männlichen Arbeitskräfte des Boas und bleibt von der zuvor genannten weiblichen Gruppe unterscheidbar.
- source_word: לְבִלְתִּי נָגְעֵךְ
  choice: dich nicht anzurühren
  rationale: נגע bedeutet wörtlich »berühren«. »Anrühren« ist im Deutschen idiomatisch und lässt die im Kontext mögliche stärkere Bedeutung eines belästigenden oder gewaltsamen Zugriffs offen.
- source_word: וְצָמִת
  choice: Wenn du Durst hast
  rationale: Die knappe hebräische Verbalform bezeichnet die zu erwartende Situation; der deutsche Konditionalsatz gibt sie natürlich wieder.
- source_word: הַכֵּלִים
  choice: die Krüge
  rationale: כֵּלִים ist allgemein »Gefäße«; im Zusammenhang mit geschöpftem Trinkwasser sind Krüge eine konkrete und gut verständliche Wiedergabe.
- source_word: וְשָׁתִית מֵאֲשֶׁר יִשְׁאֲבוּן הַנְּעָרִים
  choice: und trink von dem, was die jungen Männer geschöpft haben
  rationale: Die Formulierung wahrt, dass der hebräische Text das Wasser nicht ausdrücklich nennt, und stellt das Schöpfen als dem Trinken vorausgehende Handlung dar.
