id: RUT.2.16
reference: Ruth 2:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/גַ֛ם שֹׁל תָּשֹׁ֥לּוּ לָ֖/הּ מִן הַ/צְּבָתִ֑ים וַ/עֲזַבְתֶּ֥ם וְ/לִקְּטָ֖ה וְ/לֹ֥א תִגְעֲרוּ בָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/016.yaml
  text: And also[a], you must surely pull out some for her from the bundles and leave it, so that she may gather it[b], and you must not rebuke her.
translation:
  language: de
  text: Zieht außerdem unbedingt etwas für sie aus den Bündeln[a] heraus und lasst es liegen, damit sie es auflesen[b] kann. Weist sie nicht zurecht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus den Garben“. Das hebräische Wort bezeichnet zusammengebundene Büschel von Halmen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „damit sie Nachlese halten kann“. Das hebräische Verb ist der übliche Ausdruck für das Auflesen von Ernteresten auf einem Feld.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: außerdem
  rationale: Gibt sowohl den Anschluss als auch die zusätzliche Anweisung natürlich und prägnant wieder.
- source_word: שֹׁל תָּשֹׁלּוּ
  choice: zieht … unbedingt … heraus
  rationale: Die Verbindung des Infinitivus absolutus mit der finiten Verbform verstärkt den Befehl. Im Zusammenhang geht es darum, absichtlich Halme aus dem bereits gebündelten Getreide herauszuziehen.
- source_word: לָהּ
  choice: für sie
  rationale: 'Die Präposition bezeichnet hier den Nutzen: Das Herausgezogene ist für Rut bestimmt.'
- source_word: מִן הַצְּבָתִים
  choice: aus den Bündeln
  rationale: Das hebräische Wort bezeichnet zusammengefasste Büschel oder Bündel von Halmen; „Bündel“ ist im heutigen Deutsch klar, während „Garben“ ebenfalls möglich ist.
- source_word: וַעֲזַבְתֶּם
  choice: und lasst es liegen
  rationale: Gemeint ist, dass die Arbeiter das herausgezogene Getreide für Rut liegen lassen sollen; die Formulierung macht den räumlichen Sinn im Deutschen deutlich.
- source_word: וְלִקְּטָה
  choice: damit sie es auflesen kann
  rationale: לקט ist das übliche Verb für das Auflesen beziehungsweise die Nachlese auf einem abgeernteten Feld. Die finale Wiedergabe entspricht hier dem beabsichtigten Ergebnis der Anweisung.
- source_word: וְלֹא תִגְעֲרוּ בָהּ
  choice: Weist sie nicht zurecht
  rationale: גער bezeichnet ein scharfes Schelten oder Zurechtweisen. Die gewählte Formulierung bewahrt den Nachdruck in würdigem, modernem Deutsch.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Der verstärkte hebräische Befehl wird durch „unbedingt“ wiedergegeben; die kurzen Imperativsätze erhalten die Entschiedenheit von Boas’ Anweisung.
