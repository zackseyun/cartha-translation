  source_fidelity: 'Die Grundbedeutung ist zutreffend: Ruth bleibt bei Boas’ weiblichen Arbeitskräften, liest Ähren auf, und zwar bis zum Abschluss beider Erntezeiten; anschließend bzw. zugleich wohnt sie bei ihrer Schwiegermutter. Die koordinierte Formulierung „hielt sie sich an … und las Ähren auf“ macht לְלַקֵּט jedoch eher zu einer gleichgeordneten Handlung als zum im Hebräischen markierten Zweck. Außerdem wird die Nähebedeutung von דבק besser ausdrücklich wiedergegeben.'
  naturalness: „Sich an die jungen Frauen des Boas halten“ ist verständlich, aber „bei den Arbeiterinnen des Boas bleiben“ ist im modernen Standarddeutsch idiomatischer und bezeichnet ihre Rolle im Kontext klar. „Bis zum Ende der Gersten- und der Weizenernte“ liest sich flüssiger als die Prädikatskonstruktion mit „beendet waren“.
  terminology: „Boas“ und „Schwiegermutter“ sind angemessen. „Arbeiterinnen“ ist hier eine natürliche kontextuelle Wiedergabe von נַעֲרוֹת und vermeidet, dass „junge Frauen“ primär als Altersangabe verstanden wird. „Ähren auflesen“ bewahrt die konkrete Bedeutung von לקט; der Begriff „Nachlese“ wäre möglich, aber weniger unmittelbar.
