base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/023.yaml
  text: So she stayed close to Boaz's young women to glean[a], until the end of the barley harvest and the wheat harvest[b]. And she lived with her mother-in-law.
translation:
  language: de
  text: So blieb sie bei den Arbeiterinnen des Boas, um Ähren aufzulesen,[a] bis zum Ende der Gersten- und der Weizenernte. Und sie wohnte bei ihrer Schwiegermutter.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie hielt sich eng an die Arbeiterinnen des Boas.“ Das hebräische Verb kann eine enge Verbundenheit betonen.'
