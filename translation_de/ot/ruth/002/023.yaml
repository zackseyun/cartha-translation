revisions:
- from: So hielt sie sich an die jungen Frauen des Boas und las Ähren auf, bis die Gersten- und die Weizenernte beendet waren. Und sie wohnte bei ihrer Schwiegermutter.[a]
  to: So blieb sie bei den Arbeiterinnen des Boas, um Ähren aufzulesen,[a] bis zum Ende der Gersten- und der Weizenernte. Und sie wohnte bei ihrer Schwiegermutter.[b]
  rationale: Die Revision macht die Zweckbeziehung des Infinitivs sichtbar, gibt die enge fortgesetzte Nähe zu Boas’ Arbeiterinnen in natürlichem Deutsch wieder und ergänzt die relevante lexikalische Alternative zu דבק. Beide im Hebräischen ausdrücklich genannten Erntezeiten sowie die mögliche Bedeutung von וַתֵּשֶׁב bleiben erhalten.
