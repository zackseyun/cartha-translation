  - marker: b
    text: 'Oder: „Und sie blieb bei ihrer Schwiegermutter.“ Das hebräische Verb kann „wohnen“, „bleiben“ oder „sich aufhalten“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּדְבַּק
  choice: hielt sie sich an
  rationale: דבק bezeichnet ein enges Sich-Anschließen oder Festhalten. „Sich an jemanden halten“ gibt hier die fortdauernde enge Verbindung zu den Arbeiterinnen natürlich wieder, ohne körperliches Anklammern nahezulegen.
- source_word: בְּנַעֲרוֹת בֹּעַז
  choice: an die jungen Frauen des Boas
  rationale: נַעֲרוֹת bezeichnet die jungen Frauen beziehungsweise Arbeiterinnen des Boas. Mit דבק ist die deutsche Verbindung „sich an … halten“ idiomatisch.
- source_word: לְלַקֵּט
  choice: und las Ähren auf
  rationale: Das Infinitivpräfix bezeichnet hier Zweck oder begleitende Tätigkeit. „Ähren auflesen“ ist im Deutschen verständlicher als das fachsprachliche „nachlesen“ und benennt die im Kontext gemeinte Tätigkeit.
- source_word: עַד כְּלוֹת קְצִיר הַשְּׂעֹרִים וּקְצִיר הַחִטִּים
  choice: bis die Gersten- und die Weizenernte beendet waren
  rationale: Die Formulierung bewahrt beide ausdrücklich genannten Ernten und gibt עַד כְּלוֹת als zeitliche Dauer bis zu ihrem Abschluss wieder. Der Plural „waren“ versteht die beiden Erntezeiten als aufeinanderfolgende Größen.
- source_word: וַתֵּשֶׁב אֶת חֲמוֹתָהּ
  choice: Und sie wohnte bei ihrer Schwiegermutter
  rationale: ישב kann sitzen, bleiben oder wohnen bedeuten. Im Zusammenhang bezeichnet es am ehesten Ruths fortdauernden Wohnaufenthalt bei Noomi; אֶת wird in dieser Verbindung idiomatisch mit „bei“ wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Boas“ folgt der etablierten deutschen Namensform. Die Wendung „sich an die jungen Frauen halten“ bewahrt die stärkere Nähe von דבק, bleibt aber im Erzählzusammenhang natürlich. Nur die kontextuell relevante Mehrdeutigkeit von וַתֵּשֶׁב wird in einer Fußnote ausgewiesen.
