source:
  edition: WLC
  text: וַ/תִּפֹּל֙ עַל פָּנֶ֔י/הָ וַ/תִּשְׁתַּ֖חוּ אָ֑רְצָ/ה וַ/תֹּ֣אמֶר אֵלָ֗י/ו מַדּוּעַ֩ מָצָ֨אתִי חֵ֤ן בְּ/עֵינֶ֨י/ךָ֙ לְ/הַכִּירֵ֔/נִי וְ/אָּנֹכִ֖י נָכְרִיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/010.yaml
  text: Then she fell on her face and bowed to the ground and said to him[a], “Why have I found favor in your eyes, that you should take notice of me, though I am a foreign woman?”
translation:
  language: de
  text: 'Da fiel sie auf ihr Gesicht, verbeugte sich bis zur Erde und sagte zu ihm: »Warum habe ich Gunst in deinen Augen gefunden, dass du mich beachtest[a], obwohl ich eine Ausländerin bin?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wahrnimmst«, »anerkennst« oder »zur Kenntnis nimmst«.'
    reason: Lexikalische Alternativen für לְהַכִּירֵנִי.
lexical_decisions:
- source_word: וַתִּפֹּל עַל־פָּנֶיהָ
  choice: Da fiel sie auf ihr Gesicht
  rationale: Bewahrt das hebräische Bild einer tiefen Demutsgeste; im Deutschen ist die Formulierung verständlich, ohne die folgende Verbeugung vorwegzunehmen.
- source_word: וַתִּשְׁתַּחוּ אָרְצָה
  choice: verbeugte sich bis zur Erde
  rationale: Gibt die körperliche Niederbeugung wieder, ohne in dieser zwischenmenschlichen Szene kultische Anbetung anzudeuten.
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: habe ich Gunst in deinen Augen gefunden
  rationale: Erhält die konkrete hebräische Wendung und vermeidet die in diesem sozialen Zusammenhang möglicherweise stärker theologisch gefärbte Wiedergabe „Gnade“.
- source_word: לְהַכִּירֵנִי
  choice: dass du mich beachtest
  rationale: Der Hifil von נכר kann hier „wahrnehmen“, „anerkennen“ oder „beachten“ bedeuten. „Beachten“ drückt natürlich aus, dass Boas Ruth wohlwollende Aufmerksamkeit schenkt.
- source_word: וְאָנֹכִי נָכְרִיָּה
  choice: obwohl ich eine Ausländerin bin
  rationale: Das konzessive „obwohl“ macht den im Zusammenhang angelegten Gegensatz deutlich; „Ausländerin“ bewahrt die feminine Form und Ruths Fremdenstatus.
theological_decisions:
- issue: Mögliche kultische Bedeutung von וַתִּשְׁתַּחוּ
  choice: Als respektvolle Niederbeugung vor Boas wiedergegeben
  alternative: „betete an“ oder eine andere ausdrücklich kultische Formulierung
  rationale: Der Erzählzusammenhang beschreibt gesellschaftliche Ehrerbietung gegenüber Boas, nicht Gottesverehrung. Die Übersetzung bewahrt die Handlung, ohne eine nicht ausgesagte theologische Behauptung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt klar und natürlich; die hebräischen Bilder „auf ihr Gesicht“ und „Gunst in deinen Augen“ werden bewusst erhalten.
