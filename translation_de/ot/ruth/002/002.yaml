  naturalness: Der Erzählton ist modernes, gut verständliches Standarddeutsch. „Ähren auflesen“ und „Geh, meine Tochter!“ sind idiomatisch und dem Register angemessen. „Bei dem ich Wohlwollen finde“ ist natürlich und präziser als die gegenwärtige Relativsatzform.
