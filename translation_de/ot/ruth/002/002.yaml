base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/002.yaml
  text: And Ruth the Moabite said to Naomi[a], “Please let me go to the field and glean among the ears of grain after him in whose eyes I find favor.” And she said to her, “Go[b], my daughter.”
translation:
  language: de
  text: 'Und die Moabiterin Rut sagte zu Noomi: »Lass mich doch aufs Feld gehen und hinter demjenigen Ähren auflesen, bei dem ich Wohlwollen finde.« Sie sagte zu ihr: »Geh, meine Tochter!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמּוֹאֲבִיָּה
  choice: die Moabiterin
  rationale: Das Gentiliz bezeichnet Ruts Herkunft und bewahrt die im Erzählzusammenhang hervorgehobene Identität; im modernen Deutschen ist „Moabiterin“ sachlich und natürlich.
- source_word: אֵלְכָה נָּא
  choice: Lass mich doch … gehen
  rationale: Der Kohortativ mit נָא formuliert eine höfliche Bitte. „Lass mich doch“ gibt sowohl Ruts eigenen Willen als auch ihre respektvolle Bitte an Noomi wieder.
- source_word: הַשָּׂדֶה
  choice: aufs Feld
  rationale: Die konkrete landwirtschaftliche Fläche ist gemeint; „aufs Feld“ ist die natürliche deutsche Wiedergabe.
- source_word: וַאֲלַקֳטָּה
  choice: Ähren auflesen
  rationale: לקט bezeichnet hier das Nachlesen dessen, was bei der Ernte zurückbleibt. Die Formulierung macht diese soziale und landwirtschaftliche Praxis verständlich.
- source_word: בַשִּׁבֳּלִים
  choice: Ähren
  rationale: שִׁבֳּלִים sind Getreideähren beziehungsweise Ährenstände, nicht gebundene Garben. Zusammen mit „auflesen“ ergibt sich eine knappe, idiomatische Wiedergabe.
- source_word: אַחַר אֲשֶׁר אֶמְצָא חֵן בְּעֵינָיו
  choice: hinter demjenigen, der mir wohlgesinnt ist
  rationale: „Hinter“ bewahrt die räumliche Vorstellung des Nachlesens hinter einem Erntearbeiter oder Verantwortlichen. Die hebräische Wendung „Gunst in seinen Augen finden“ wird natürlich als „wohlgesinnt sein“ wiedergegeben; das maskuline Singularsuffix bleibt durch „demjenigen“ erkennbar.
- source_word: חֵן
  choice: wohlgesinnt
  rationale: חֵן bezeichnet in dieser sozialen Situation freundliche Aufnahme beziehungsweise günstige Haltung, nicht vorrangig einen theologischen Begriff von Gnade.
- source_word: לְכִי בִתִּי
  choice: Geh, meine Tochter!
  rationale: Der schlichte Imperativ und die herzliche familiäre Anrede werden unmittelbar und idiomatisch wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Ähren auflesen“ vermittelt die historische Praxis der Nachlese ohne altertümliche Ausdrucksweise. Die hebräische Augen-Redewendung wird idiomatisch wiedergegeben, während der unbestimmte maskuline Bezug erhalten bleibt.
