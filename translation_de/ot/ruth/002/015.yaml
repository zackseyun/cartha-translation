base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/015.yaml
  text: When she rose to glean[a], Boaz commanded his young men, saying, “Let her glean even among the sheaves[b], and do not humiliate her.”
translation:
  language: de
  text: 'Als sie aufstand, um Ähren zu lesen, wies Boas seine jungen Männer an: »Sie darf sogar zwischen den Garben Ähren lesen. Beschämt sie nicht.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּקָם לְלַקֵּט
  choice: Als sie aufstand, um Ähren zu lesen
  rationale: Die Konstruktion führt die Erzählung weiter und verbindet Rut zeitlich mit Boas’ Anweisung. „Ähren lesen“ ist im Deutschen die natürliche Bezeichnung für das Nachsammeln bei der Ernte.
- source_word: וַיְצַו ... לֵאמֹר
  choice: wies ... an
  rationale: צוה bezeichnet eine verbindliche Weisung. „Wies ... an“ gibt ihre Autorität in natürlichem Deutsch wieder; die hebräische Redeeinleitungsformel muss nicht eigens mit „indem er sagte“ abgebildet werden.
- source_word: נְעָרָיו
  choice: seine jungen Männer
  rationale: נַעַר kann einen jungen Mann, Diener oder Arbeiter bezeichnen. Die Form ist hier männlich; die Wiedergabe bewahrt diese ausdrückliche Referenz, ohne die Rolle enger festzulegen als der Ausgangstext.
- source_word: גַּם בֵּין הָעֳמָרִים
  choice: sogar zwischen den Garben
  rationale: גַּם erweitert die Erlaubnis nachdrücklich. בֵּין bedeutet „zwischen“; diese im Deutschen natürliche Formulierung bewahrt das räumliche Bild des Hebräischen.
- source_word: תְּלַקֵּט
  choice: Sie darf ... Ähren lesen
  rationale: Der Imperfekt hat im Rahmen des Befehls permissiv-jussive Kraft. Da Boas zu den Arbeitern spricht, formuliert „Sie darf“ die gewährte Erlaubnis idiomatisch und klar.
- source_word: וְלֹא תַכְלִימוּהָ
  choice: Beschämt sie nicht
  rationale: Das Hifil von כלם bezeichnet das Zufügen von Scham oder öffentlicher Bloßstellung. „Beschämen“ bewahrt die Verbindung zum Grundbegriff Scham und ist würdig sowie verständlich.
