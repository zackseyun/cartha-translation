base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/022.yaml
  text: Then Naomi said to Ruth her daughter-in-law[a], “It is good, my daughter, that you go out with his young women, so that they do not come upon you in another field.”
translation:
  language: de
  text: 'Da sagte Noomi zu ihrer Schwiegertochter Rut: „Es ist gut, meine Tochter, dass du mit seinen jungen Frauen hinausgehst, damit dir auf einem anderen Feld niemand begegnet[a].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit man dir auf einem anderen Feld nicht begegnet“. Das hebräische Verb kann eine bloße Begegnung oder ein Antreffen bezeichnen, im Kontext aber auch eine feindselige oder schädigende Begegnung. Noomis Sorge um Ruts Sicherheit legt eine negative Nuance nahe, bestimmt ihre Art jedoch nicht näher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Da sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; „Da sagte“ gibt die zeitliche Folge in natürlichem deutschem Erzählstil wieder.
- source_word: כַּלָּתָהּ
  choice: zu ihrer Schwiegertochter
  rationale: Die Form bezeichnet ausdrücklich Noomis verwandtschaftliche Beziehung zu Rut.
- source_word: טוֹב
  choice: Es ist gut
  rationale: Die schlichte positive Bewertung wird bewahrt, ohne sie zu einem Superlativ wie „am besten“ zu steigern.
- source_word: בִּתִּי
  choice: meine Tochter
  rationale: Die familiäre und liebevolle Anrede wird wörtlich und im Deutschen verständlich wiedergegeben.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier passend den Inhalt dessen ein, was Noomi als gut bezeichnet.
- source_word: תֵצְאִי
  choice: du ... hinausgehst
  rationale: Die Grundbedeutung „hinausgehen“ bleibt erhalten; die Tätigkeit des Ährenlesens wird nicht in das Verb hineingetragen.
- source_word: נַעֲרוֹתָיו
  choice: seinen jungen Frauen
  rationale: Die feminine Pluralform bezeichnet die jungen weiblichen Arbeitskräfte des Boas; „junge Frauen“ ist modern und legt ihren rechtlichen Status nicht unnötig fest.
- source_word: וְלֹא יִפְגְּעוּ בָךְ
  choice: damit man dir ... nicht zu nahe tritt
  rationale: פגע kann eine bloße Begegnung oder eine feindliche beziehungsweise übergriffige Begegnung bezeichnen. Die unpersönliche Form „man“ vermeidet einen missverständlichen Rückbezug auf die jungen Frauen und lässt die handelnden Personen unbestimmt.
- source_word: בְּשָׂדֶה אַחֵר
  choice: auf einem anderen Feld
  rationale: Die Ortsangabe wird direkt und idiomatisch wiedergegeben.
