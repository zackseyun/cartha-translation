  text: יְשַׁלֵּ֥ם יְהוָ֖ה פָּעֳלֵ֑/ךְ וּ/תְהִ֨י מַשְׂכֻּרְתֵּ֜/ךְ שְׁלֵמָ֗ה מֵ/עִ֤ם יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁר בָּ֖את לַ/חֲס֥וֹת תַּֽחַת כְּנָפָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/012.yaml
  text: May Yahweh repay your work[a], and may your reward be full from Yahweh, the God of Israel, under whose wings you have come to seek refuge.
translation:
  language: de
  text: Jahwe möge dir dein Tun vergelten, und von Jahwe, dem Gott Israels, mögest du vollen Lohn erhalten, zu dem du gekommen bist, um unter seinen Flügeln Zuflucht zu suchen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „volle Belohnung“. Das hebräische Wort kann sowohl Lohn als auch Belohnung bezeichnen. „Vergelten“ und „voll“ geben zudem Wörter aus derselben hebräischen Wortfamilie wieder.'
    reason: lexikalische Alternative und Hinweis auf die im Hebräischen vorhandene Wortverbindung
lexical_decisions:
- source_word: יְשַׁלֵּם
  choice: vergelte
  rationale: Die Piel-Form ist hier als Segenswunsch zu verstehen. „Vergelte“ gibt den Wunschcharakter und den Gedanken angemessener Gegenleistung knapp und idiomatisch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. „Jahwe“ ist die im Deutschen übliche Form.
- source_word: פָּעֳלֵךְ
  choice: dein Tun
  rationale: Das Substantiv bezeichnet Werk, Tat oder Tätigkeit. „Dein Tun“ umfasst hier Ruths gesamtes loyales Handeln und klingt im Deutschen natürlicher als „dein Werk“.
- source_word: וּתְהִי
  choice: und mögest du ... erhalten
  rationale: Die jussivische Fortsetzung des Segenswunsches wird idiomatisch umgeformt. Dadurch bleibt der Wunschcharakter erhalten, ohne die im Deutschen schwerfällige Formulierung „dein Lohn sei voll von ...“ zu erzeugen.
- source_word: מַשְׂכֻּרְתֵּךְ
  choice: Lohn
  rationale: Das Wort kann Arbeitslohn oder allgemein Vergeltung beziehungsweise Belohnung bezeichnen. „Lohn“ bewahrt die konkrete Bildlichkeit und passt zur göttlichen Vergeltung.
- source_word: שְׁלֵמָה
  choice: vollen
  rationale: Das Adjektiv bezeichnet Vollständigkeit oder Unversehrtheit. „Vollen Lohn“ ist natürliches Deutsch und drückt eine vollständige Vergeltung aus.
- source_word: מֵעִם
  choice: von
  rationale: Die Präposition kennzeichnet hier Jahwe als Ursprung beziehungsweise Geber des Lohns.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: dem Gott Israels
  rationale: Die hebräische Genitivverbindung wird direkt und im Deutschen idiomatisch wiedergegeben.
- source_word: לַחֲסוֹת
  choice: Zuflucht gesucht hast
  rationale: Der Infinitiv bezeichnet das Suchen beziehungsweise Nehmen von Zuflucht. Die deutsche Perfektform verbindet sich natürlich mit dem vorausgehenden Kommen und bewahrt den zielgerichteten Sinn.
- source_word: תַּחַת כְּנָפָיו
  choice: unter dessen Flügeln
  rationale: Das Schutzbild der Flügel wird unverändert bewahrt, statt es abstrakt als bloßen „Schutz“ wiederzugeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich den Gottesnamen. Die Transliteration „Jahwe“ bewahrt den Charakter als Eigenname, während „der HERR“ ihn durch einen Titel ersetzen würde.
- issue: Göttliche Vergeltung als Lohn
  choice: Segenswunsch auf vollständigen Lohn von Jahwe
  alternative: Feststellung, dass Jahwe den Lohn sicher geben wird
  rationale: Die Verbformen drücken hier am besten einen Wunsch beziehungsweise Segen aus. Die Übersetzung macht daraus weder eine uneingeschränkte Zukunftsverheißung noch einen technischen Anspruch auf Verdienst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die doppelte Nennung Jahwes und das Schutzbild der Flügel bleiben erhalten. Die zweite Wunschformel ist für natürliches Deutsch syntaktisch umgestellt, ohne ihren Sinn zu verändern.
