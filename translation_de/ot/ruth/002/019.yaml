  source_fidelity: 'Die Hauptaussage wird zutreffend wiedergegeben: Rut hat auf einem Feld Ähren gelesen, Naomi spricht einen Segenswunsch aus, und Rut nennt Boas. Die Wiedergabe von עשה („tun“) als Feldarbeit ist im Kontext vertretbar. In der Berichtseinleitung bezeichnet der hebräische Text jedoch zunächst „was sie mit ihm getan hatte“, nicht unmittelbar die Person, „bei wem“ sie gearbeitet hatte. Die vorgeschlagene Revision erhält diesen Gegenstand des Berichts, ohne den Kontext der Feldarbeit zu verlieren.'
  naturalness: Der Text ist überwiegend idiomatisches, modernes Standarddeutsch. „Ähren gelesen“ ist verständlich und bibelsprachlich angemessen. „Bei wem sie gearbeitet hatte“ ist zwar natürlich, lässt aber in der Satzkonstruktion den im Hebräischen genannten Berichtsinhaltsgegenstand aus. „Was sie bei ihm getan hatte“ ist hier klar und ausreichend natürlich.
  terminology: „Schwiegermutter“, „Ähren gelesen“, „gesegnet“ und „Boas“ sind passend. Die Fußnote muss syntaktisch vollständige deutsche Wiedergaben des hebräischen Wortlauts bieten und sollte die nicht ausdrücklich im Wortlaut enthaltene Aussage „unter seiner Verantwortung“ vermeiden.
  issues:
