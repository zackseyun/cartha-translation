    rationale: Der Kontext erlaubt die Deutung als Feldarbeit, doch die Satzstruktur des Ausgangstextes nennt zunächst die Tätigkeit bzw. das Geschehen. „Was sie bei ihm getan hatte“ bewahrt dies besser und bleibt im Deutschen verständlich.
  - severity: medium
    issue: 'Die Fußnote enthält in der zweiten wörtlichen Wiedergabe keinen vollständigen deutschen Satz: „mit dem ich heute getan habe“.'
    rationale: Der Bezug von „was“ und „ihm“ muss im Deutschen ausgedrückt werden. Außerdem ist „unter seiner Verantwortung“ eine über den hebräischen Wortlaut hinausgehende Einordnung.
