base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/019.yaml
  text: And her mother-in-law said to her[a], “Where did you glean today, and where have you worked? Blessed be the one who took notice of you.” So she told her mother-in-law with whom she had worked, and she said, “The name of the man with whom I worked today is Boaz.”
translation:
  language: de
  text: 'Da sagte ihre Schwiegermutter zu ihr: »Wo hast du heute Ähren gelesen, und wo hast du gearbeitet? Gesegnet sei, wer dich beachtet hat!« Darauf erzählte sie ihrer Schwiegermutter, was sie bei ihm getan hatte, und sagte: »Der Name des Mannes, bei dem ich heute gearbeitet habe, ist Boas.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher lautet der hebräische Ausdruck an beiden Stellen: »was sie mit ihm getan hatte« beziehungsweise »was ich heute mit ihm getan habe«. Im Zusammenhang geht es um die Feldarbeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמוֹתָהּ
  choice: ihre Schwiegermutter
  rationale: Die übliche und natürliche deutsche Bezeichnung für Naomis Verwandtschaftsverhältnis zu Rut.
- source_word: לִקַּטְתְּ
  choice: Ähren gelesen
  rationale: Das Verb bezeichnet hier das Auflesen zurückgebliebener Feldfrüchte; »Ähren lesen« bewahrt den konkreten landwirtschaftlichen und sozialen Kontext.
- source_word: עָשִׂית
  choice: gearbeitet
  rationale: Das allgemeinere »tun/machen« meint im Zusammenhang die Feldarbeit und wird so im Deutschen verständlich wiedergegeben.
- source_word: יְהִי מַכִּירֵךְ בָּרוּךְ
  choice: Gesegnet sei, wer dich beachtet hat
  rationale: מכיר bezeichnet jemanden, der Rut wahrgenommen und ihr Aufmerksamkeit geschenkt hat; die Formulierung wahrt den Segenswunsch.
- source_word: אֵת אֲשֶׁר עָשְׂתָה עִמּוֹ
  choice: bei wem sie gearbeitet hatte
  rationale: Der hebräische Wortlaut ist allgemeiner, doch der Kontext bezeichnet die Arbeit auf dem Feld. »Bei wem« gibt zudem das Verhältnis zum Feldherrn im Deutschen natürlicher wieder als »mit wem«.
- source_word: שֵׁם הָאִישׁ אֲשֶׁר עָשִׂיתִי עִמּוֹ הַיּוֹם בֹּעַז
  choice: Der Mann, bei dem ich heute gearbeitet habe, heißt Boas
  rationale: Natürliche deutsche Namensnennung, die Inhalt und Satzglieder des Hebräischen klar bewahrt.
- source_word: בֹּעַז
  choice: Boas
  rationale: Im modernen deutschen Bibelgebrauch etablierte Form des hebräischen Personennamens.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Ähren lesen« hält den agrarischen Hintergrund anschaulich fest; »bei ihm arbeiten« vermeidet die im Deutschen mögliche Vorstellung, Boas habe gemeinsam mit Rut Feldarbeit verrichtet.
