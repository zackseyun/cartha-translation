  naturalness: „Möge ich Gunst in deinen Augen finden“ und „mein Herr“ sind in einem würdevollen modernen Bibelregister verständlich. Für דיבר על־לב ist „deiner Magd freundlich zugesprochen“ idiomatischer und kontextgerecht. Der Verzicht auf „nicht einmal“ vermeidet eine gegenüber dem Hebräischen zusätzliche Verstärkung.
  terminology: „Magd/Mägde“ bewahrt die weibliche und sozial untergeordnete Selbstbezeichnung konsistent. „Mein Herr“ ist als respektvolle menschliche Anrede an Boas angemessen.
