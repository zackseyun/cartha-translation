  text: וַ֠/תֹּאמֶר אֶמְצָא חֵ֨ן בְּ/עֵינֶ֤י/ךָ אֲדֹנִ/י֙ כִּ֣י נִֽחַמְתָּ֔/נִי וְ/כִ֥י דִבַּ֖רְתָּ עַל לֵ֣ב שִׁפְחָתֶ֑/ךָ וְ/אָנֹכִי֙ לֹ֣א אֶֽהְיֶ֔ה כְּ/אַחַ֖ת שִׁפְחֹתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/013.yaml
  text: Then she said[a], “May I find favor in your eyes, my lord, because you have comforted me and because you have spoken to the heart of your servant, though I am not like one of your female servants.”
translation:
  language: de
  text: 'Da sagte sie: »Möge ich Gunst in deinen Augen finden, mein Herr! Denn du hast mich getröstet und deiner Magd freundlich zugesprochen[a], obwohl ich nicht wie eine deiner Mägde bin.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »du hast zum Herzen deiner Magd geredet«; oder: »du hast deiner Magd ermutigend zugesprochen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶמְצָא חֵן
  choice: Möge ich Gunst … finden
  rationale: Der Imperfekt steht hier als höflicher Wunsch beziehungsweise ehrerbietige Äußerung. Die deutsche Wendung bewahrt das hebräische Bild und den zurückhaltenden Ton.
- source_word: בְּעֵינֶיךָ
  choice: in deinen Augen
  rationale: Die geläufige hebräische Wendung bezeichnet wohlwollende Beurteilung. Das Bild ist auch im Deutschen verständlich und wird daher beibehalten.
- source_word: אֲדֹנִי
  choice: mein Herr
  rationale: Es handelt sich um eine ehrerbietige Anrede an Boas, nicht um einen Gottesnamen. »Mein Herr« gibt das soziale Gefälle wieder, ohne ausdrücklich ein Besitzverhältnis zu behaupten.
- source_word: נִחַמְתָּנִי
  choice: du hast mich getröstet
  rationale: נחם bezeichnet hier Trost und Zuspruch angesichts von Ruts verletzlicher Lage. »Getröstet« entspricht dem emotionalen Gehalt unmittelbar.
- source_word: דִבַּרְתָּ עַל־לֵב
  choice: du hast … zu Herzen geredet
  rationale: Die bildhafte hebräische Redewendung wird mit einer natürlichen deutschen Wendung wiedergegeben, die einfühlsamen, ermutigenden Zuspruch ausdrückt. Eine explizitere Sinnwiedergabe steht in der Fußnote.
- source_word: שִׁפְחָתֶךָ / שִׁפְחֹתֶיךָ
  choice: deiner Magd / deiner Mägde
  rationale: Das Substantiv bezeichnet ausdrücklich eine weibliche Dienerin oder Sklavin. »Magd« wahrt Geschlecht, soziale Stellung und Ruts ehrerbietige Selbstbezeichnung, ohne im Deutschen unnötig sperrig zu werden.
- source_word: וְאָנֹכִי לֹא אֶהְיֶה כְּאַחַת
  choice: obwohl ich nicht einmal einer … gleich bin
  rationale: 'Der Satz ist sinngemäß konzessiv: Boas behandelt Rut freundlich, obwohl sie nach ihrer eigenen Einschätzung nicht den Status einer seiner Mägde besitzt. »Nicht einmal« macht die Abstufung natürlich deutlich; das Präsens gibt den zuständlichen Sinn wieder.'
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die respektvolle Anrede und Ruts demütige Selbstbezeichnung bleiben erhalten. Die Bildsprache »Gunst in deinen Augen« und »zu Herzen geredet« wird bewahrt, weil sie im Deutschen verständlich ist; die Fußnote erläutert die zweite Wendung.
