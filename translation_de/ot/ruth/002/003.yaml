base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/003.yaml
  text: So she went and came and gleaned in the field behind the reapers[a], and she happened to come to the portion of the field belonging to Boaz, who was from the family of Elimelech.
translation:
  language: de
  text: Da ging sie hin, kam und las auf dem Feld hinter den Schnittern Ähren auf. Zufällig geriet sie auf den Feldteil, der Boas gehörte; er stammte aus der Familie Elimelechs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Ihr Zufall ereignete sich“ – eine hebräische Redewendung für das, was aus menschlicher Sicht zufällig geschieht. Der größere Erzählzusammenhang lädt zugleich dazu ein, darin Gottes Vorsehung zu erkennen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ וַתָּבוֹא
  choice: Da ging sie hin, kam auf das Feld
  rationale: Die beiden aufeinanderfolgenden Bewegungsverben bleiben erkennbar, werden im Deutschen aber natürlich mit dem Ziel des Kommens verbunden.
- source_word: וַתְּלַקֵּט
  choice: las … Ähren auf
  rationale: לקט bezeichnet hier das Nachlesen der bei der Ernte zurückgebliebenen Halme beziehungsweise Ähren. Die Wendung ist im modernen Deutschen verständlicher als das seltene Verb „nachlesen“ allein.
- source_word: בַּשָּׂדֶה
  choice: auf das Feld
  rationale: Bei landwirtschaftlich genutztem Gelände ist „auf dem Feld“ beziehungsweise nach einem Bewegungsverb „auf das Feld“ idiomatisches Deutsch.
- source_word: אַחֲרֵי הַקֹּצְרִים
  choice: hinter den Schnittern
  rationale: 'אַחֲרֵי ist hier räumlich zu verstehen: Rut sammelt hinter den Männern, die das Getreide schneiden. „Schnitter“ ist präzise und im biblisch-landwirtschaftlichen Zusammenhang weiterhin verständlich.'
- source_word: וַיִּקֶר מִקְרֶהָ
  choice: Dabei traf es sich
  rationale: Die deutsche Wendung gibt die hebräische figura etymologica idiomatisch als scheinbar zufälliges Zusammentreffen wieder, ohne die im Erzählzusammenhang anklingende Vorsehung ausdrücklich zu machen.
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: Feldstück
  rationale: חֶלְקָה bezeichnet einen abgegrenzten Teil beziehungsweise eine Parzelle des Feldes. „Feldstück“ ist knapp, natürlich und vermeidet unnötig technische Sprache.
- source_word: לְבֹעַז
  choice: das Boas gehörte
  rationale: Das לְ kennzeichnet hier Besitz oder Zuordnung; der Relativsatz drückt dies im Deutschen eindeutig aus.
- source_word: אֲשֶׁר מִמִּשְׁפַּחַת אֱלִימֶלֶךְ
  choice: Er stammte aus der Familie Elimelechs
  rationale: מִשְׁפָּחָה kann Familie oder Sippenverband bezeichnen. „Familie“ ist zugänglich und bewahrt die genealogische Verbindung, ohne einen engeren technischen Sinn zu erzwingen.
theological_decisions:
- issue: Scheinbarer Zufall und göttliche Vorsehung
  choice: Die Redewendung wird mit „Dabei traf es sich“ als menschlich wahrgenommener Zufall wiedergegeben.
  alternative: Eine ausdrücklich providenzielle Formulierung wie „Gott führte sie“ oder eine wörtliche, im Deutschen schwer verständliche Wiedergabe wie „ihr Zufall ereignete sich“.
  rationale: Der hebräische Text nennt an dieser Stelle keine göttliche Ursache ausdrücklich, während die Gesamterzählung dazu einlädt, hinter dem scheinbaren Zufall Vorsehung zu erkennen. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Schnitter“ bewahrt die konkrete Ernteszene; das sonst seltenere Wort wird durch „Ähren auflesen“ unmittelbar verständlich. Die kurzen Sätze halten den fortschreitenden Erzählrhythmus lebendig.
