revisions:
- from: Da ging sie hin, kam auf das Feld und las hinter den Schnittern Ähren auf. Dabei traf es sich[a], dass sie zu dem Feldstück kam, das Boas gehörte. Er stammte aus der Familie Elimelechs.
  to: Da ging sie hin, kam und las auf dem Feld hinter den Schnittern Ähren auf. Zufällig geriet sie auf den Feldteil, der Boas gehörte; er stammte aus der Familie Elimelechs.[a]
  rationale: Die Revision erhält die schrittweise hebräische Erzählfolge, vermeidet die doppelte Zielangabe und gibt das Wortspiel mit מִקְרֶה in einer natürlichen deutschen Form als scheinbaren Zufall wieder. Die Fußnote bleibt am Zufallsausdruck verankert und erläutert die narrative Spannung, ohne sie im Haupttext dogmatisch aufzulösen.
