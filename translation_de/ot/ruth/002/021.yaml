base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/021.yaml
  text: Then Ruth the Moabite said[a], “He also said to me, ‘You are to stay close by my young women until they have finished all my harvest.’”
translation:
  language: de
  text: 'Da sagte Rut, die Moabiterin: „Er sagte außerdem zu mir: ›Halte dich bei meinen jungen Männern[a] auf, bis sie meine ganze Ernte eingebracht haben.‹“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch „meinen jungen Männern“. Da im unmittelbaren Zusammenhang auch von Boas’ jungen Frauen die Rede ist, wird mitunter erwogen, hier „junge Frauen“ zu verstehen oder zu lesen.
    reason: Die Fußnote erhält die maskuline Lesart des Ausgangstextes im Haupttext und erläutert die kontextuell bedingte, umstrittene Alternative ohne Harmonisierung oder Festlegung.
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Da sagte
  rationale: Das Waw mit der Erzählform führt die Handlung weiter; „Da sagte“ gibt die zeitliche Abfolge in natürlichem deutschem Erzählstil wieder.
- source_word: רוּת הַמּוֹאֲבִיָּה
  choice: Rut, die Moabiterin
  rationale: Der Personenname folgt der im Deutschen üblichen Form „Rut“; die Herkunftsbezeichnung wird modern und eindeutig wiedergegeben.
- source_word: גַּם כִּי אָמַר אֵלַי
  choice: Er sagte außerdem zu mir
  rationale: גַּם fügt eine weitere Aussage des Boas zu Ruts Bericht hinzu; „außerdem“ bildet diese ergänzende Funktion idiomatisch ab.
- source_word: עִם הַנְּעָרִים אֲשֶׁר לִי
  choice: an meine jungen Männer
  rationale: נְעָרִים ist morphologisch maskuliner Plural und bezeichnet hier die jungen männlichen Arbeiter beziehungsweise Diener des Boas. „Sich an jemanden halten“ gibt die Verbindung von עִם und דבק natürlich wieder.
- source_word: תִּדְבָּקִין
  choice: Halte dich an
  rationale: דבק bezeichnet enges Anschließen oder Dabeibleiben. Der deutsche Imperativ gibt die als direkte Anweisung zitierte Form klar und natürlich wieder.
- source_word: עַד אִם כִּלּוּ
  choice: bis sie … eingebracht haben
  rationale: Die Wendung bezeichnet den Endpunkt des Dabeibleibens. Das deutsche Perfekt nach „bis“ passt zur abgeschlossenen Erntearbeit.
- source_word: אֵת כָּל הַקָּצִיר אֲשֶׁר לִי
  choice: meine ganze Ernte
  rationale: Die kompakte deutsche Form bewahrt sowohl die Gesamtheit als auch die Zugehörigkeit zu Boas. „Eingebracht“ verdeutlicht im Deutschen idiomatisch den Abschluss der Erntearbeit.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller Erzählstil. Die direkte Rede bleibt knapp und mündlich. Die männliche Form des hebräischen Textes wird trotz der kontextuellen Erwähnung junger Frauen nicht stillschweigend angeglichen.
