base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/007.yaml
  text: She said[a], ‘Please let me glean and gather among the sheaves after the reapers.’ So she came and has remained from morning until now; she has sat in the house only a little.
translation:
  language: de
  text: 'Sie sagte: »Bitte lass mich hinter den Schnittern zwischen den Garben Ähren auflesen und sie sammeln.« So kam sie und ist vom Morgen bis jetzt geblieben; nur wenig hat sie im Haus gesessen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Nur wenig hat sie sich im Unterstand ausgeruht.« Der hebräische Wortlaut des letzten Satzteils ist schwierig; das mit »Haus« wiedergegebene Wort kann hier einen Schutzraum für die Feldarbeiter bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲלַקֳטָה
  choice: lass mich … Ähren auflesen
  rationale: Der Kohortativ drückt hier eine höfliche Bitte aus. »Ähren auflesen« bezeichnet die Nachlese verständlich und passend zum landwirtschaftlichen Zusammenhang.
- source_word: נָּא
  choice: bitte
  rationale: Die Höflichkeitspartikel kennzeichnet Rut respektvolle Bitte und wird im heutigen Deutsch natürlich mit »bitte« wiedergegeben.
- source_word: וְאָסַפְתִּי
  choice: und sie sammeln
  rationale: Die Wiedergabe unterscheidet das Sammeln vom vorausgehenden Auflesen und macht den pronominalen Bezug im Deutschen natürlich deutlich.
- source_word: בָעֳמָרִים
  choice: zwischen den Garben
  rationale: עֳמָרִים bezeichnet gebundene Garben; die Präposition kann in diesem räumlichen Zusammenhang idiomatisch mit »zwischen« wiedergegeben werden.
- source_word: אַחֲרֵי הַקּוֹצְרִים
  choice: hinter den Schnittern
  rationale: 'Die räumliche Bedeutung steht im Vordergrund: Rut folgt den Erntearbeitern und liest hinter ihnen auf.'
- source_word: וַתָּבֹא וַתַּעֲמֹד
  choice: So kam sie und ist … hier geblieben
  rationale: Wörtlich steht »sie kam und stand«; zusammen mit der Zeitangabe bezeichnet das Verb wahrscheinlich ihr anhaltendes Verbleiben beziehungsweise Arbeiten. »Hier geblieben« gibt diesen durativen Sinn natürlich wieder.
- source_word: מֵאָז הַבֹּקֶר וְעַד עַתָּה
  choice: vom Morgen bis jetzt
  rationale: Die Formulierung bewahrt die zeitliche Spanne des hebräischen Textes knapp und verständlich.
- source_word: זֶה שִׁבְתָּהּ הַבַּיִת מְעָט
  choice: nur kurze Zeit hat sie im Unterstand gesessen
  rationale: Die stark komprimierte und textlich schwierige Klausel besagt wahrscheinlich, dass Rut nur wenig Zeit im Schutzraum verbracht hat. »Unterstand« erschließt den möglichen feldbezogenen Sinn von »Haus«, während die Unsicherheit in der Fußnote offengelegt wird.
