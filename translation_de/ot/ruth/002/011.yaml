  text: וַ/יַּ֤עַן בֹּ֨עַז֙ וַ/יֹּ֣אמֶר לָ֔/הּ הֻגֵּ֨ד הֻגַּ֜ד לִ֗/י כֹּ֤ל אֲשֶׁר עָשִׂית֙ אֶת חֲמוֹתֵ֔/ךְ אַחֲרֵ֖י מ֣וֹת אִישֵׁ֑/ךְ וַ/תַּֽעַזְבִ֞י אָּבִ֣י/ךְ וְ/אִמֵּ֗/ךְ וְ/אֶ֨רֶץ֙ מֽוֹלַדְתֵּ֔/ךְ וַ/תֵּ֣לְכִ֔י אֶל עַ֕ם אֲשֶׁ֥ר לֹא יָדַ֖עַתְּ תְּמ֥וֹל שִׁלְשֽׁוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/011.yaml
  text: Then Boaz answered and said to her[a], “I have been fully told all that you have done for your mother-in-law after the death of your husband, and how you left your father and your mother and the land of your birth, and went to a people whom you did not know before.”
translation:
  language: de
  text: 'Boas antwortete ihr: „Mir ist ausführlich berichtet worden, was du alles nach dem Tod deines Mannes für deine Schwiegermutter getan hast: Du hast deinen Vater, deine Mutter und dein Geburtsland verlassen und bist zu einem Volk gegangen, das du vorher nicht kanntest.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das du gestern und vorgestern nicht kanntest“, das heißt: das dir zuvor unbekannt war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֻגֵּד הֻגַּד לִי
  choice: Mir ist ausführlich berichtet worden
  rationale: Die Verbindung aus Infinitivus absolutus und finiter Hofal-Form verstärkt die passive Aussage. „Ausführlich“ gibt die nachdrückliche bzw. umfassende Unterrichtung in natürlichem Deutsch wieder, ohne eine nicht ausdrücklich genannte Quelle einzuführen.
- source_word: כֹּל אֲשֶׁר עָשִׂית אֶת חֲמוֹתֵךְ
  choice: was du alles ... für deine Schwiegermutter getan hast
  rationale: „Was ... alles“ bildet das umfassende כֹּל idiomatisch ab; „für“ bringt im Deutschen den aus dem Zusammenhang hervorgehenden begünstigenden Sinn natürlich zum Ausdruck.
- source_word: אַחֲרֵי מוֹת אִישֵׁךְ
  choice: nach dem Tod deines Mannes
  rationale: Die nominale Formulierung des Hebräischen bleibt erhalten und wirkt zugleich würdevoll und modern.
- source_word: וַתַּעַזְבִי
  choice: du hast ... verlassen
  rationale: „Verlassen“ ist die natürliche neuhochdeutsche Entsprechung und trägt hier keine unnötig wertende Nebenbedeutung.
- source_word: אָבִיךְ וְאִמֵּךְ
  choice: deinen Vater, deine Mutter
  rationale: Beide Elternteile werden wie im Hebräischen einzeln genannt statt zu „deine Eltern“ zusammengezogen.
- source_word: וְאֶרֶץ מוֹלַדְתֵּךְ
  choice: dein Geburtsland
  rationale: „Geburtsland“ gibt die Herkunfts- und Heimatbedeutung von מוֹלֶדֶת knapp und verständlich wieder.
- source_word: וַתֵּלְכִי אֶל עַם
  choice: und bist zu einem Volk gegangen
  rationale: „Gegangen“ bewahrt die Perspektive und Grundbedeutung von הלך; „Volk“ bezeichnet hier eine ethnisch-soziale Gemeinschaft, nicht primär einen politischen Staat.
- source_word: אֲשֶׁר לֹא יָדַעַתְּ
  choice: das du ... nicht kanntest
  rationale: ידע bezeichnet hier persönliche Vertrautheit. Beim grammatisch sächlichen deutschen Wort „Volk“ ist „das“ die natürliche Relativform.
- source_word: תְּמוֹל שִׁלְשׁוֹם
  choice: vorher
  rationale: Die feste Wendung „gestern und vorgestern“ bedeutet idiomatisch „zuvor/bisher“. „Vorher“ gibt den Sinn flüssig wieder; die bildhafte wörtliche Form bleibt in der Fußnote sichtbar.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die einleitende Doppelung „antwortete und sagte“ wird idiomatisch zu „antwortete“ gestrafft. Der Doppelpunkt nach „getan hast“ macht deutlich, dass das anschließende Verlassen von Familie und Geburtsland den berichteten Einsatz näher entfaltet. Der Fußnotenmarker steht unmittelbar nach der betroffenen Aussage.
