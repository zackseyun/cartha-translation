  text: וּֽ/לְ/נָעֳמִ֞י מידע לְ/אִישָׁ֗/הּ אִ֚ישׁ גִּבּ֣וֹר חַ֔יִל מִ/מִּשְׁפַּ֖חַת אֱלִימֶ֑לֶךְ וּ/שְׁמ֖/וֹ בֹּֽעַז׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/001.yaml
  text: Naomi had a relative of her husband[a], a man of great worth, from the clan of Elimelech[b], and his name was Boaz.
translation:
  language: de
  text: Noomi hatte einen Verwandten ihres Mannes[a], einen bedeutenden Mann aus der Sippe Elimelechs[c]. Er hieß Boas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »einen Bekannten ihres Mannes«; das hebräische Wort kann eine bekannte oder verwandte Person bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »aus der Familie Elimelechs«; gemeint sein kann ein größerer Verwandtschaftsverband.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מידע
  choice: Verwandten
  rationale: Das Wort bezeichnet eine bekannte oder verbundene Person. Da der Mann zugleich zur Sippe Elimelechs gehört, ist hier eine verwandtschaftliche Verbindung wahrscheinlich; »Verwandter« legt jedoch seine spätere rechtliche Rolle noch nicht genauer fest.
- source_word: לְאִישָׁהּ
  choice: ihres Mannes
  rationale: Die Präposition mit dem Suffix ordnet die Beziehung Noomis Ehemann zu, nicht unmittelbar Noomi.
- source_word: אִישׁ גִּבּוֹר חַיִל
  choice: einen angesehenen und vermögenden Mann
  rationale: Die Wendung umfasst je nach Zusammenhang Stärke, Tüchtigkeit, Einfluss, gesellschaftliches Ansehen und Besitz. Im nichtmilitärischen Zusammenhang des Rutbuchs gibt die Doppelformulierung den sozialen und wirtschaftlichen Gehalt natürlich wieder, ohne die Bedeutung auf Tapferkeit im Kampf zu verengen.
- source_word: מִמִּשְׁפַּחַת
  choice: aus der Sippe
  rationale: מִשְׁפָּחָה bezeichnet häufig einen größeren Verwandtschaftsverband und nicht nur die unmittelbare Familie.
- source_word: וּשְׁמוֹ
  choice: Er hieß
  rationale: Die selbstständige deutsche Satzform gibt die hebräische Einführung der Person knapp und idiomatisch im Erzähltempus wieder.
- source_word: בֹּעַז
  choice: Boas
  rationale: »Boas« ist die im Deutschen etablierte Form des biblischen Namens.
- source_word: וּלְנָעֳמִי
  choice: Noomi hatte
  rationale: Die Verbindung eröffnet eine neue Erzählangabe. Im Deutschen ist kein zusätzlicher zeitlicher Übergangsausdruck nötig, da im Hebräischen kein ausdrückliches Wort für »nun« steht.
theological_decisions: []
