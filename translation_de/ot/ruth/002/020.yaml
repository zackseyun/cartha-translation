base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/020.yaml
  text: Naomi said to her daughter-in-law[a], “Blessed be he by Yahweh, whose kindness has not forsaken the living or the dead.” Then Naomi said to her, “The man is a close relative of ours[b]; he is one of our redeemers.”
translation:
  language: de
  text: 'Noomi sagte zu ihrer Schwiegertochter: „Gesegnet sei er von Jahwe, der seine Güte den Lebenden und den Toten nicht entzogen hat.“[a] Dann sagte Noomi zu ihr: „Der Mann ist ein naher Verwandter von uns; er ist einer unserer Löser.“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, mit Bezug auf Boas: „Gesegnet sei er von Jahwe, denn Boas hat den Lebenden und den Toten seine Güte nicht entzogen.“'
    reason: alternative_reading
  - marker: b
    text: Das hebräische Wort bezeichnet einen nahen Verwandten, der nach israelitischem Recht die Aufgabe oder das Recht hatte, einen Angehörigen oder Familienbesitz auszulösen.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ הוּא לַיהוָה
  choice: Gesegnet sei er von Jahwe
  rationale: Die verblosen hebräischen Worte bilden eine Segensformel. Der deutsche Wunschsatz gibt ihren feierlichen Charakter wieder; „von Jahwe“ bezeichnet Jahwe als Ursprung des Segens.
- source_word: חַסְדּוֹ
  choice: seine Güte
  rationale: חֶסֶד bezeichnet hier verlässliche, zugewandte Güte. „Güte“ ist verständlich und lässt offen, ob Gottes treue Zuwendung oder die konkrete Güte des Boas gemeint ist.
- source_word: לֹא עָזַב
  choice: nicht entzogen hat
  rationale: Das Verb bedeutet grundsätzlich „verlassen, aufgeben“. In Verbindung mit Güte gibt „nicht entzogen“ den relationalen Sinn im Deutschen natürlich wieder, ohne das Hebräische zu „nicht aufgehört zu erweisen“ umzudeuten.
- source_word: אֶת הַחַיִּים וְאֶת הַמֵּתִים
  choice: den Lebenden und den Toten
  rationale: Die koordinierende hebräische Verbindung wird direkt mit „und“ wiedergegeben; beide Gruppen sind gemeinsam Gegenstand der nicht entzogenen Güte.
- source_word: קָרוֹב לָנוּ
  choice: ein naher Verwandter von uns
  rationale: קָרוֹב bezeichnet im Zusammenhang keine räumliche Nähe, sondern enge Verwandtschaft.
- source_word: מִגֹּאֲלֵנוּ
  choice: er gehört zu unseren Lösern
  rationale: גֹּאֵל bezeichnet einen nahen Angehörigen mit anerkanntem Recht oder anerkannter Pflicht, Familienbesitz oder Angehörige aus einer Notlage auszulösen. „Löser“ bewahrt den wiederkehrenden Rechtsbegriff; die Fußnote erläutert ihn.
theological_decisions:
- issue: Bezug der Pronomen in der Segensaussage
  choice: „er“ bezeichnet Boas; „der seine Güte … nicht entzogen hat“ bezieht sich im Haupttext auf Jahwe
  alternative: 'Das Relativpronomen kann sich auf Boas beziehen: Jahwe möge Boas segnen, der den Lebenden und den Toten seine Güte nicht entzogen hat.'
  rationale: Boas ist der naheliegende Bezug von „er“. Für den folgenden Relativsatz ist Jahwe der nächststehende mögliche Bezug und die Lesart passt zum Motiv göttlicher Güte durch menschliches Handeln. Da die hebräische Syntax den Bezug auf Boas ebenfalls zulässt, wird diese Spannung ausdrücklich in einer Fußnote bewahrt.
- issue: Bedeutung des Lösers
  choice: Der Rechts- und Verwandtschaftsbegriff wird übersetzt und in einer Fußnote erklärt.
  alternative: „Verwandtenlöser“ oder „einer unserer nahen Verwandten, die zur Auslösung berechtigt sind“
  rationale: „Löser“ hält die Verbindung zum hebräischen Leitwort גאל aufrecht, ohne eine spätere konfessionelle Deutung einzutragen; die rechtlich-familiäre Bedeutung wird erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gottesname wird entsprechend der konsultierten POB-Schicht als „Jahwe“ wiedergegeben. „Noomi“ und „Löser“ folgen einer quellennahen deutschen Form; die ungewohnte rechtliche Bezeichnung wird durch die Fußnote verständlich gemacht. Sämtliche Fußnotenmarker stehen im Haupttext.
