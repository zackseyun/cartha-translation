source:
  edition: WLC
  text: וְ/גַ֣ם אֶת ר֣וּת הַ/מֹּאֲבִיָּה֩ אֵ֨שֶׁת מַחְל֜וֹן קָנִ֧יתִי לִ֣/י לְ/אִשָּׁ֗ה לְ/הָקִ֤ים שֵׁם הַ/מֵּת֙ עַל נַ֣חֲלָת֔/וֹ וְ/לֹא יִכָּרֵ֧ת שֵׁם הַ/מֵּ֛ת מֵ/עִ֥ם אֶחָ֖י/ו וּ/מִ/שַּׁ֣עַר מְקוֹמ֑/וֹ עֵדִ֥ים אַתֶּ֖ם הַ/יּֽוֹם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/010.yaml
  text: And also Ruth the Moabite[a], the wife of Mahlon, I have acquired for myself as a wife, to raise up the name of the dead over his inheritance, so that the name of the dead may not be cut off from among his brothers and from the gate of his place[c][b]. You are witnesses today.
translation:
  language: de
  text: Und auch Rut, die Moabiterin, die Frau Machlons, habe ich mir zur Frau erworben[a], um den Namen des Verstorbenen auf seinem Erbbesitz fortbestehen zu lassen[b], damit der Name des Verstorbenen weder unter seinen Brüdern noch aus dem Tor seines Ortes getilgt wird[c]. Ihr seid heute Zeugen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »habe ich mir zur Frau gekauft«. Das hebräische Verb kann bei einem Rechtsgeschäft den Erwerb durch Kauf bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist, dass die Familienlinie und die rechtliche Stellung des Verstorbenen in Verbindung mit seinem Erbbesitz erhalten bleiben.
    reason: cultural_note
  - marker: c
    text: Das Stadttor war der öffentliche Ort, an dem Rechtsangelegenheiten verhandelt, bezeugt und entschieden wurden.
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם
  choice: Und auch
  rationale: Bewahrt die additive Verknüpfung und den Nachdruck der rechtlichen Erklärung.
- source_word: רוּת הַמֹּאֲבִיָּה
  choice: Rut, die Moabiterin
  rationale: Natürliche moderne deutsche Wiedergabe des Namens und der Herkunftsbezeichnung.
- source_word: אֵשֶׁת מַחְלוֹן
  choice: die Frau Machlons
  rationale: Folgt der hebräischen Konstruktion; der Text sagt hier nicht ausdrücklich »Witwe«.
- source_word: קָנִיתִי לִי לְאִשָּׁה
  choice: habe ich mir zur Frau erworben
  rationale: Erhält den rechtlich-transaktionalen Sinn von קנה und nennt zugleich ausdrücklich den ehelichen Zweck.
- source_word: לְהָקִים שֵׁם הַמֵּת
  choice: um den Namen des Verstorbenen … fortbestehen zu lassen
  rationale: Gibt die Absicht des hebräischen Bildes verständlich wieder, ohne die Fortführung allein auf biologische Nachkommenschaft zu verengen.
- source_word: עַל נַחֲלָתוֹ
  choice: auf seinem Erbbesitz
  rationale: Bewahrt die Verbindung des Namens mit dem vererbten Land; »Erbbesitz« bezeichnet den rechtlichen Landbesitz präziser als das abstraktere »Erbe«.
- source_word: וְלֹא יִכָּרֵת
  choice: damit … nicht ausgelöscht wird
  rationale: Vermittelt das gewichtige Bild des Abgeschnitten- beziehungsweise Getilgtwerdens in idiomatischem Deutsch.
- source_word: מֵעִם אֶחָיו
  choice: unter seinen Brüdern
  rationale: Gibt אֶחָיו formal als »Brüder« wieder und lässt eine im Sippenzusammenhang mögliche weitere Reichweite offen.
- source_word: וּמִשַּׁעַר מְקוֹמוֹ
  choice: und am Tor seines Ortes
  rationale: Erhält das konkrete Tor als Ort öffentlicher und rechtlicher Anerkennung sowie die Mehrdeutigkeit von מְקוֹמוֹ.
- source_word: עֵדִים אַתֶּם הַיּוֹם
  choice: Ihr seid heute Zeugen
  rationale: Klare, würdevolle Wiedergabe der förmlichen Erklärung vor der Versammlung.
theological_decisions:
- issue: Art von Boas’ Handeln gegenüber Rut im rechtlichen Lösungszusammenhang
  choice: »habe ich mir zur Frau erworben«
  alternative: »habe ich mir zur Frau gekauft« oder »habe ich zur Frau genommen«
  rationale: Die Formulierung bewahrt sowohl den Erwerbscharakter von קנה als auch den ausdrücklich ehelichen Zweck, ohne den Text zu einer bloßen Kaufhandlung oder zu einer rein romantischen Eheschließung umzudeuten.
- issue: Bedeutung des Aufrichtens des Namens des Verstorbenen
  choice: »den Namen des Verstorbenen auf seinem Erbbesitz fortbestehen zu lassen«
  alternative: »den Namen des Verstorbenen auf seinem Erbbesitz aufzurichten«
  rationale: Die natürliche deutsche Formulierung erklärt die Wirkung des hebräischen Bildes, bewahrt aber die rechtliche Verbindung von Familienname, Linie und Erbbesitz.
- issue: Reichweite von אֶחָיו
  choice: »seinen Brüdern«
  alternative: »seinen Verwandten« oder »seinen Sippenangehörigen«
  rationale: Der hebräische Wortlaut nennt Brüder; eine möglicherweise weitere verwandtschaftliche Bedeutung wird nicht in den Haupttext eingetragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit erkennbar rechtlichem Ton. Die leicht formelle Wendung »am Tor seines Ortes« wahrt den konkreten hebräischen Ausdruck; die Fußnote erläutert seine gesellschaftliche Funktion. Alle Fußnotenmarker stehen im Haupttext.
