  language: de
  text: 'Dann nahm er[a] zehn Männer aus den Ältesten der Stadt und sagte: »Setzt euch hier hin.« Und sie setzten sich.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wählte er zehn Männer aus den Ältesten der Stadt aus«. Das hebräische Verb bedeutet grundsätzlich »nahm« und kann in diesem Zusammenhang auch ein gezieltes Auswählen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: holte er
  rationale: לקח bedeutet grundsätzlich »nehmen«; im Zusammenhang holt beziehungsweise bestimmt Boas zehn Älteste für das Rechtsverfahren. »Holte« ist im Deutschen natürlicher als das missverständliche »nahm« und lässt die zielgerichtete Auswahl offen.
- source_word: עֲשָׂרָה אֲנָשִׁים
  choice: zehn Männer
  rationale: Die maskuline Wendung bezeichnet zehn erwachsene Männer, die an dem öffentlichen Rechtsverfahren teilnehmen.
- source_word: מִזִּקְנֵי הָעִיר
  choice: aus dem Kreis der Ältesten der Stadt
  rationale: 'Die Präposition מן hat hier partitive Bedeutung: Die zehn Männer gehören zur Gruppe der anerkannten städtischen Ältesten.'
- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: Die gewöhnliche Erzählform wird direkt und natürlich mit »sagte« wiedergegeben.
- source_word: שְׁבוּ פֹה
  choice: Setzt euch hierher!
  rationale: Der Imperativ von ישב fordert die Männer auf, für das Verfahren Platz zu nehmen; פֹה bezeichnet den vom Sprecher angewiesenen Ort.
- source_word: וַיֵּשֵׁבוּ
  choice: Da setzten sie sich
  rationale: Die Erzählform berichtet die unmittelbare Ausführung der Aufforderung; »Da« gibt den Fortgang der hebräischen Erzählung natürlich wieder.
