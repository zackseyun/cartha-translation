  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/תֹּאמַ֤רְנָה הַ/נָּשִׁים֙ אֶֽל נָעֳמִ֔י בָּר֣וּךְ יְהוָ֔ה אֲ֠שֶׁר לֹ֣א הִשְׁבִּ֥ית לָ֛/ךְ גֹּאֵ֖ל הַ/יּ֑וֹם וְ/יִקָּרֵ֥א שְׁמ֖/וֹ בְּ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/014.yaml
  text: Then the women said to Naomi[a], “Blessed be Yahweh, who has not left you without a redeemer today[c][b], and may his name be renowned in Israel.”
translation:
  language: de
  text: 'Da sagten die Frauen zu Noomi: »Gepriesen sei Jahwe, der dich heute nicht ohne einen Löser[a] gelassen hat! Sein[b] Name werde in Israel bekannt[c]!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Löser“ bezeichnet hier einen nahen Verwandten, der die Pflicht übernimmt, die Familie zu schützen, ihren Besitz zu sichern und ihre Linie zu erhalten; möglich ist daher auch „Familienlöser“ oder „verwandter Beschützer“.
    reason: lexical_alternative
  - marker: b
    text: Mit dem „Löser“ und mit „sein“ kann besonders das neugeborene Kind als Noomis Wiederhersteller gemeint sein; manche beziehen die Aussage im weiteren Zusammenhang auch auf Boas als Familienlöser.
    reason: alternative_reading
  - marker: c
    text: 'Wörtlich: „und sein Name werde in Israel genannt“. Gemeint ist, dass sein Name in Israel bekannt, ausgerufen oder in Ehren gehalten wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמַרְנָה הַנָּשִׁים אֶל נָעֳמִי
  choice: Da sagten die Frauen zu Noomi
  rationale: Das Wayyiqtol führt die Erzählung fort; „Da“ gibt diese Abfolge in natürlichem deutschem Erzählstil wieder. „Noomi“ entspricht der im Deutschen geläufigen biblischen Namensform.
- source_word: בָּרוּךְ יְהוָה
  choice: Gepriesen sei Jahwe
  rationale: Die Formulierung bewahrt den Charakter der hebräischen Segens- und Lobpreisformel und gibt den Gottesnamen als „Jahwe“ wieder.
- source_word: אֲשֶׁר לֹא הִשְׁבִּית לָךְ
  choice: der dich ... nicht ohne ... gelassen hat
  rationale: Die idiomatische deutsche Wendung gibt das Hifil von שבת im Sinn von „jemandem etwas nicht fehlen lassen“ verständlich wieder.
- source_word: גֹּאֵל
  choice: Löser
  rationale: „Löser“ bewahrt den zentralen familienrechtlichen und wiederherstellenden Begriff des Buches Rut, ohne den Bezug im Haupttext stärker festzulegen als das Hebräische.
- source_word: הַיּוֹם
  choice: heute
  rationale: Direkte und natürliche Wiedergabe der Zeitangabe.
- source_word: וְיִקָּרֵא שְׁמוֹ בְּיִשְׂרָאֵל
  choice: Sein Name werde in Israel bekannt
  rationale: Die Formulierung gibt den Sinn der wörtlichen Wendung „sein Name werde in Israel genannt“ in verständlichem Deutsch wieder, ohne sie auf bloße Namensgebung zu verengen.
theological_decisions:
- issue: Bezug des Wortes גֹּאֵל („Löser“) und des Pronomens „sein“
  choice: Der Haupttext lässt offen, ob der neugeborene Sohn unmittelbar als Noomis Löser bezeichnet wird oder ob Boas als handelnder Familienlöser mit im Blick bleibt.
  alternative: Der Bezug könnte ausdrücklich entweder auf den neugeborenen Obed oder ausschließlich auf Boas festgelegt werden.
  rationale: Der unmittelbare Zusammenhang nach der Geburt und die anschließende Aussage über „seinen Namen“ sprechen besonders für das Kind. Zugleich prägt Boas’ Tätigkeit als Löser den gesamten rechtlichen und erzählerischen Zusammenhang. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlichem Erzählfluss. Der Schlüsselbegriff „Löser“ bleibt bewusst knapp und wird in der Fußnote familienrechtlich erläutert. Die mögliche Mehrdeutigkeit des Bezugs wird nicht im Haupttext aufgelöst.
