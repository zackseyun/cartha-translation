id: RUT.4.3
reference: Ruth 4:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ לַ/גֹּאֵ֔ל חֶלְקַת֙ הַ/שָּׂדֶ֔ה אֲשֶׁ֥ר לְ/אָחִ֖י/נוּ לֶ/אֱלִימֶ֑לֶךְ מָכְרָ֣ה נָעֳמִ֔י הַ/שָּׁ֖בָה מִ/שְּׂדֵ֥ה מוֹאָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/003.yaml
  text: Then he said to the redeemer[a], “Naomi, who has returned from the fields of Moab[c][b], is selling the portion of the field that belonged to our brother Elimelech.”
translation:
  language: de
  text: 'Dann sagte er zu dem Löser[a]: „Das Stück Land[b], das unserem Bruder Elimelech gehörte, verkauft[c] Noomi, die aus dem Gebiet von Moab[d] zurückgekehrt ist.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein „Löser“ war ein naher Verwandter, der bestimmte familiäre und rechtliche Pflichten übernehmen konnte.
    reason: cultural_note
  - marker: b
    text: 'Oder: „das Grundstück“; wörtlich „den Anteil des Feldes“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „hat verkauft“. Die hebräische Form kann eine bereits abgeschlossene Handlung bezeichnen; hier kann der Verkauf auch als gegenwärtiger Gegenstand der Rechtsverhandlung verstanden werden.'
    reason: alternative_reading
  - marker: d
    text: Wörtlich „aus dem Feld“ oder „aus den Gefilden Moabs“, eine Wendung für das Land beziehungsweise die Gegend von Moab.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Dann sagte er
  rationale: Die Erzählform führt die Handlung weiter; „Dann sagte er“ gibt die zeitliche Abfolge in natürlichem Deutsch wieder.
- source_word: לַגֹּאֵל
  choice: zu dem Löser
  rationale: גֹּאֵל bezeichnet hier den nahen Verwandten, der im Rahmen des Familienrechts als Löser eintritt. „Löser“ bewahrt den rechtlich-theologischen Begriff, ohne seine Aufgaben auf eine einzige Funktion zu verengen.
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: das Stück Land
  rationale: Die Wendung bezeichnet einen abgegrenzten Anteil beziehungsweise ein Grundstück. „Stück Land“ ist verständlich und gibt den konkreten Besitzbezug wieder.
- source_word: אֲשֶׁר לְאָחִינוּ לֶאֱלִימֶלֶךְ
  choice: das unserem Bruder Elimelech gehörte
  rationale: Die Präposition לְ drückt hier Besitz oder Zuordnung aus. „Unser Bruder“ bewahrt die Verwandtschaftssprache, die nicht zwingend einen leiblichen Bruder meint.
- source_word: מָכְרָה
  choice: verkauft
  rationale: Die hebräische Perfektform kann eine bereits vollzogene Handlung bezeichnen; im Rahmen der laufenden Rechtsverhandlung lässt sie sich jedoch plausibel als gegenwärtig anstehender Verkauf verstehen. Das deutsche Präsens hält diesen Bezug offen.
- source_word: נָעֳמִי
  choice: Noomi
  rationale: „Noomi“ ist die im Deutschen verbreitete biblische Namensform.
- source_word: הַשָּׁבָה
  choice: die … zurückgekehrt ist
  rationale: Die substantivierte beziehungsweise attributive Form kennzeichnet Noomi als die Zurückgekehrte; das Perfekt gibt die für die gegenwärtige Situation relevante Rückkehr natürlich wieder.
- source_word: מִשְּׂדֵה מוֹאָב
  choice: aus dem Gebiet von Moab
  rationale: Wörtlich steht „aus dem Feld/Gefilde Moabs“, eine Bezeichnung für das Land oder die ländliche Region Moabs. „Gebiet von Moab“ vermittelt den idiomatischen Sinn in modernem Deutsch.
theological_decisions:
- issue: Bedeutungsumfang von גֹּאֵל
  choice: Löser
  alternative: nächster Verwandter; Verwandtenlöser
  rationale: „Löser“ erhält den besonderen Rechtsbegriff und lässt dessen im Buch Rut entfaltete familiäre Pflichten offen; „nächster Verwandter“ wäre verständlicher, aber enger und weniger terminologisch.
- issue: Zeitbezug von מָכְרָה
  choice: verkauft (Präsens)
  alternative: hat verkauft
  rationale: Die Form ist grammatisch perfektiv, doch die Szene behandelt den Erwerb als aktuellen Gegenstand der Verhandlung. Eine Fußnote bewahrt die mögliche Deutung als bereits vollzogene Handlung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vorangestellte Landangabe folgt der hebräischen Informationsstruktur, bleibt aber gut verständlich. Der Rechtsbegriff „Löser“ wird beibehalten und knapp erklärt; die grammatische Mehrdeutigkeit des Verbs wird nicht stillschweigend aufgelöst.
