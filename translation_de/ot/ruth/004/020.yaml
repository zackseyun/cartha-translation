base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/020.yaml
  text: Amminadab fathered Nahshon[a], and Nahshon fathered Salmah.
translation:
  language: de
  text: Amminadab zeugte Nachschon, und Nachschon zeugte Salma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch Salma; in parallelen Geschlechtsregistern erscheint auch die Namensform Salmon.
