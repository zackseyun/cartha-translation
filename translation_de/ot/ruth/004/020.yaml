lexical_decisions:
- source_word: עַמִּינָדָב
  choice: Amminadab
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: הוֹלִיד
  choice: zeugte
  rationale: Der Hifil von ילד bezeichnet in Geschlechtsregistern das Zeugen beziehungsweise Vaterwerden. „Zeugte“ ist knapp, verständlich und wahrt den männlichen genealogischen Sinn.
- source_word: אֶת
  choice: nicht gesondert wiedergegeben
  rationale: Der hebräische Akkusativmarker hat keine eigenständige lexikalische Entsprechung im Deutschen; seine Funktion wird durch den Satzbau ausgedrückt.
- source_word: נַחְשׁוֹן
  choice: Nachschon
  rationale: Der Personenname wird nach gängiger deutscher Bibeltradition und entsprechend seiner hebräischen Lautgestalt wiedergegeben.
- source_word: וְ
  choice: und
  rationale: Die einfache Konjunktion verbindet die beiden genealogischen Aussagen unmittelbar.
- source_word: שַׂלְמָה
  choice: Salma
  rationale: Diese Form gibt den im WLC an dieser Stelle bezeugten hebräischen Namen unmittelbar wieder; die Form „Salmon“ ist aus parallelen Geschlechtsregistern und der Übersetzungstradition bekannt.
