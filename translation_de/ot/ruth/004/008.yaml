id: RUT.4.8
reference: Ruth 4:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר הַ/גֹּאֵ֛ל לְ/בֹ֖עַז קְנֵה לָ֑/ךְ וַ/יִּשְׁלֹ֖ף נַעֲלֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/008.yaml
  text: So the redeemer said to Boaz[b][a], “Buy it for yourself,” and he took off his sandal.
translation:
  language: de
  text: 'Da sagte der Löser[a] zu Boas: »Kauf es für dich!« Dann zog er seine Sandale aus.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der verwandte Löser«. Das hebräische Wort bezeichnet einen nahen Verwandten, der rechtlich dafür verantwortlich war, Familienbesitz oder die Familienlinie zu sichern.'
    reason: lexical_alternative
  - marker: b
    text: Das Ausziehen der Sandale diente bei diesem Rechtsgeschäft als herkömmliches Zeichen; siehe Rut 4,7.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw consecutivum führt die Handlung weiter; »Da« gibt die erzählerische Folge im modernen Deutsch natürlich wieder.
- source_word: הַגֹּאֵל
  choice: der Löser
  rationale: Der Ausdruck bezeichnet hier den nahen Verwandten, dem die rechtliche Aufgabe zukam, Familienbesitz beziehungsweise die Familienlinie zu sichern. »Löser« bewahrt den zentralen Begriff des Buches, ohne die Funktion im Haupttext auszudeuten.
- source_word: לְבֹעַז
  choice: zu Boas
  rationale: Natürliche Wiedergabe der Präposition mit dem im Deutschen üblichen biblischen Eigennamen »Boas«.
- source_word: קְנֵה
  choice: Kauf
  rationale: Der Imperativ von קנה bezeichnet in diesem rechtlichen Geschäft unmittelbar den Erwerb durch Kauf.
- source_word: לָךְ
  choice: für dich
  rationale: Die Präposition mit Suffix zeigt an, dass Boas den Erwerb für sich selbst vornehmen soll.
- source_word: וַיִּשְׁלֹף
  choice: Dann zog er ... aus
  rationale: Das Verb bedeutet herausziehen beziehungsweise abstreifen; bei einer Sandale ist »ausziehen« die natürliche deutsche Formulierung. »Dann« verdeutlicht die anschließende Handlung.
- source_word: נַעֲלוֹ
  choice: seine Sandale
  rationale: Der Ausdruck bezeichnet das damalige Schuhwerk; »Sandale« ist kulturgeschichtlich genauer als »Schuh«.
