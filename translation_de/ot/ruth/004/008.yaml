  source_fidelity: 'Der hebräische Text wird vollständig und zutreffend wiedergegeben: der Löser spricht Boas an, fordert ihn zum Erwerb für sich selbst auf und zieht anschließend seine Sandale aus. Die Abfolge der Waw-Konsekutive ist mit „Da“ und „Dann“ angemessen wiedergegeben. Das maskuline Pronomen „er“ hat im deutschen Satz weiterhin eindeutig den Löser als Subjekt.'
