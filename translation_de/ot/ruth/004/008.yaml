  terminology: „Löser“ bewahrt den zentralen Rechts- und Verwandtschaftsbegriff גֹּאֵל ohne ihn im Haupttext übermäßig auszudeuten. Die Fußnote bietet die sinnvolle Alternative und erklärt die Funktion zurückhaltend. „Sandale“ ist kulturgeschichtlich passend. Namen und Verweis „Rut 4,7“ sind korrekt.
