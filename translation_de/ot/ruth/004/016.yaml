  text: Then Naomi took the child and laid him in her lap[a], and she became his nurse.
translation:
  language: de
  text: Dann nahm Noomi das Kind, legte es auf ihren Schoß und wurde seine Betreuerin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Pflegerin“, „seine Pflegemutter“ oder „seine Amme“. Das hebräische Wort bezeichnet eine Frau, die ein Kind versorgt und aufzieht; ob damit auch Stillen gemeint ist, bleibt offen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקַּח
  choice: nahm
  rationale: לקח bezeichnet hier in der fortlaufenden Erzählung schlicht das Nehmen des Kindes; „nahm“ gibt die körperliche Handlung natürlich wieder.
- source_word: הַיֶּלֶד
  choice: das Kind
  rationale: יֶלֶד kann „Kind“ oder „Junge“ bedeuten. Im Zusammenhang mit dem neugeborenen Obed ist „Kind“ altersgemäß und idiomatisch.
- source_word: וַתְּשִׁתֵהוּ
  choice: legte es
  rationale: Das Verb שׁית bedeutet „setzen, legen, platzieren“. Bei einem Säugling und dem Schoß ist „legte“ im Deutschen die natürlichste Entsprechung.
- source_word: בְחֵיקָהּ
  choice: auf ihren Schoß
  rationale: חֵיק bezeichnet den Schoß- oder Brustbereich. „Auf ihren Schoß“ vermittelt das konkrete Bild in natürlichem modernem Deutsch, ohne das möglicherweise missverständliche „an ihre Brust“.
- source_word: וַתְּהִי לוֹ
  choice: wurde seine
  rationale: Die Konstruktion היה + ל bezeichnet hier das Eintreten in eine Rolle oder Beziehung. „wurde seine“ gibt diese Entwicklung idiomatisch wieder.
- source_word: לְאֹמֶנֶת
  choice: Pflegemutter
  rationale: אֹמֶנֶת bezeichnet eine Frau, die ein Kind betreut und aufzieht. „Pflegemutter“ ist im heutigen Deutsch verständlicher als „Amme“, legt aber möglicherweise eine formalisierte Pflegschaft nahe; die Fußnote bewahrt deshalb die Bedeutungsbreite.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Pflegemutter“ vermeidet die heute medizinisch verstandene „Pflegerin“ und das altertümliche „Amme“; die Fußnote weist auf die weitere und nicht eindeutig auf Stillen festgelegte Bedeutung hin.
