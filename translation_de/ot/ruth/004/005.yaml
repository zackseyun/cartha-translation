  text: וַ/יֹּ֣אמֶר בֹּ֔עַז בְּ/יוֹם קְנוֹתְ/ךָ֥ הַ/שָּׂדֶ֖ה מִ/יַּ֣ד נָעֳמִ֑י וּ֠/מֵ/אֵת ר֣וּת הַ/מּוֹאֲבִיָּ֤ה אֵֽשֶׁת הַ/מֵּת֙ קניתי לְ/הָקִ֥ים שֵׁם הַ/מֵּ֖ת עַל נַחֲלָתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/005.yaml
  text: Then Boaz said[a], “On the day you acquire the field from the hand of Naomi, you also acquire Ruth the Moabite, the wife of the dead man[c][b], in order to raise up the name of the dead on his inheritance.”
translation:
  language: de
  text: 'Da sagte Boas: „An dem Tag, an dem du das Feld aus der Hand Noomis erwirbst, erwirbst du auch[a] die Moabiterin Rut, die Frau des Verstorbenen[b], um den Namen des Verstorbenen auf seinem Erbbesitz[c] zu erhalten.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der masoretische hebräische Text lautet wörtlich: „ich erwarb“ oder „ich habe erworben“ Rut, die Moabiterin. Dem Zusammenhang nach verstehen viele den Sinn als „erwirbst du auch“.'
    reason: textual_variant
  - marker: b
    text: 'Wörtlich: „die Frau des Toten“.'
    reason: lexical_alternative
  - marker: c
    text: Gemeint ist, dass die Familienlinie und der erbrechtliche Anspruch des Verstorbenen an seinem Erbbesitz erhalten bleiben.
    reason: cultural_note
lexical_decisions:
- source_word: בְּיוֹם קְנוֹתְךָ
  choice: An dem Tag, an dem du … erwirbst
  rationale: Bewahrt den zeitlichen und rechtlichen Charakter der hebräischen Wendung und klingt zugleich im modernen Deutschen natürlich.
- source_word: הַשָּׂדֶה
  choice: das Feld
  rationale: Direkte und im Zusammenhang präzise Wiedergabe des konkret verhandelten Grundstücks.
- source_word: מִיַּד נָעֳמִי
  choice: aus Noomis Hand
  rationale: Erhält das verständliche hebräische Bild für die Übertragung aus Noomis Verfügungsgewalt.
- source_word: וּמֵאֵת רוּת הַמּוֹאֲבִיָּה … קניתי
  choice: erwirbst du auch die Moabiterin Rut
  rationale: Gibt den durch den Erzählzusammenhang geforderten Sinn als Verpflichtung des angesprochenen Lösers wieder; die schwierige masoretische Lesart in der ersten Person wird in Fußnote [a] offengelegt.
- source_word: אֵשֶׁת הַמֵּת
  choice: die Frau des Verstorbenen
  rationale: Entspricht dem Hebräischen genauer als das deutende Wort „Witwe“ und ist im Deutschen natürlich.
- source_word: לְהָקִים שֵׁם הַמֵּת
  choice: um den Namen des Verstorbenen … fortbestehen zu lassen
  rationale: Gibt die idiomatische Bedeutung der Bewahrung von Familienlinie und Rechtsanspruch verständlich wieder, ohne das hebräische Konzept auf bloßes Erinnern zu verengen.
- source_word: עַל נַחֲלָתוֹ
  choice: auf seinem Erbbesitz
  rationale: „Erbbesitz“ bringt den rechtlich-familiären Sinn von נַחֲלָה präziser zum Ausdruck als das im Deutschen potenziell mehrdeutige „Erbe“.
theological_decisions:
- issue: Textkritische und syntaktische Schwierigkeit bei קניתי und der Rut betreffenden Klausel
  choice: 'Im Haupttext wird die kontextuell erforderliche Anrede an den näheren Löser wiedergegeben: „erwirbst du auch … Rut“.'
  alternative: 'Masoretisch vokalisiert: „habe ich … Rut erworben“ beziehungsweise „erwerbe ich … Rut“; außerdem sind andere syntaktische Zuordnungen von „von Rut“ möglich.'
  rationale: Die Vokalisierung des MT weist auf die erste Person Singular, doch die Logik des Gesprächs verlangt hier offenbar eine Darlegung dessen, was der angesprochene Löser mit dem Feld übernehmen würde. Die Hauptübersetzung folgt diesem Zusammenhang, während Fußnote [a] die echte Textschwierigkeit transparent bewahrt.
- issue: Bedeutung des Aufrichtens des Namens des Verstorbenen
  choice: „den Namen des Verstorbenen auf seinem Erbbesitz fortbestehen zu lassen“
  alternative: 'Wörtlicher: „den Namen des Verstorbenen auf seinem Erbbesitz aufzurichten“'
  rationale: Die natürliche deutsche Formulierung vermittelt die familien- und erbrechtliche Fortdauer, ohne eine bestimmte spätere leviratsrechtliche oder konfessionelle Deutung in den Text einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit juristisch-familiärem Ton. „Aus Noomis Hand“ bewahrt bewusst das hebräische Rechtsbild; „Erbbesitz“ hält den Zusammenhang von Familie, Land und dauerhaftem Anspruch fest. Alle Fußnotenmarker stehen im Haupttext.
