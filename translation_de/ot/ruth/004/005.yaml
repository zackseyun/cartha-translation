  terminology: „Boas“, „Rut“, „Moabiterin“, „Verstorbener“ und „Erbbesitz“ sind angemessen und konsistent. „Frau des Verstorbenen“ hält die hebräische Formulierung offen und vermeidet die stärker interpretierende Bezeichnung „Witwe“.
