  text: וַ/יִּקַּ֨ח בֹּ֤עַז אֶת רוּת֙ וַ/תְּהִי ל֣/וֹ לְ/אִשָּׁ֔ה וַ/יָּבֹ֖א אֵלֶ֑י/הָ וַ/יִּתֵּ֨ן יְהוָ֥ה לָ֛/הּ הֵרָי֖וֹן וַ/תֵּ֥לֶד בֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/013.yaml
  text: So Boaz took Ruth[a], and she became his wife. He went in to her, and Yahweh granted her conception, and she bore a son.
translation:
  language: de
  text: So nahm Boas Rut zu sich, und sie wurde seine Frau. Er ging zu ihr ein, und Jahwe ließ sie schwanger werden[a], und sie gebar einen Sohn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Jahwe gab ihr Empfängnis/Schwangerschaft“; auch: „Jahwe schenkte ihr eine Schwangerschaft“.'
    reason: Die Verbindung von נתן („geben“) und הֵרָיוֹן („Empfängnis, Schwangerschaft“) kann enger am hebräischen Wortlaut wiedergegeben werden; der Haupttext formuliert sie idiomatisch im Deutschen.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: nahm ... zu sich
  rationale: לקח bedeutet wörtlich „nehmen“; „zu sich nehmen“ klingt im Deutschen natürlich und lässt den unmittelbar folgenden Satz die Eheschließung ausdrücklich benennen.
- source_word: וַתְּהִי לוֹ לְאִשָּׁה
  choice: sie wurde seine Frau
  rationale: Die Wendung bezeichnet den Eintritt in den Ehestand und bewahrt mit „wurde“ die erzählerische Abfolge.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: Er ging zu ihr ein
  rationale: Die verhüllende hebräische Wendung für den Geschlechtsverkehr wird in einem würdevollen, bibelnahen deutschen Euphemismus wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: וַיִּתֵּן יְהוָה לָהּ הֵרָיוֹן
  choice: Jahwe schenkte ihr, schwanger zu werden
  rationale: נתן wahrt den Geschenkcharakter, während die deutsche Infinitivfügung die Bedeutung von הֵרָיוֹן natürlich ausdrückt und Jahwes Handeln hervorhebt.
- source_word: וַתֵּלֶד בֵּן
  choice: sie gebar einen Sohn
  rationale: Dies ist eine knappe, genaue und dem würdevollen Erzählstil entsprechende Wiedergabe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen ausdrücklich; die Transliteration bewahrt ihn als Eigennamen.
- issue: Jahwes Wirken bei Ruts Schwangerschaft
  choice: Jahwe schenkte ihr, schwanger zu werden
  alternative: Jahwe gab ihr Schwangerschaft
  rationale: Die Übersetzung erhält die ausdrücklich ausgesagte göttliche Urheberschaft, ohne die Aussage über den Wortlaut hinaus dogmatisch zu entfalten.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Erzählton. Der traditionelle Euphemismus „zu ihr eingehen“ bleibt wegen seiner Nähe zur verhüllenden Ausdrucksweise des Hebräischen erhalten; „nahm ... zu sich“ vermeidet eine unnötige Vorwegnahme der direkt folgenden Eheschließung.
