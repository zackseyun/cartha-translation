lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Und dies ist
  rationale: Die Verbindung aus ו und אֵלֶּה leitet hier formelhaft einen neuen Abschnitt ein. „Und dies ist“ gibt den Anschluss wieder, ohne ein zeitliches „nun“ einzuführen.
- source_word: תּוֹלְדוֹת
  choice: die Geschlechterfolge
  rationale: Der Ausdruck bezeichnet hier die genealogische Folge beziehungsweise Abstammungslinie. „Geschlechterfolge“ bewahrt den formelhaften Charakter und ist im Deutschen verständlicher als das wörtliche „Zeugungen“.
- source_word: פָּרֶץ
  choice: Perez
  rationale: Der Personenname wird nach der im modernen Deutschen üblichen, am Hebräischen orientierten Form wiedergegeben.
- source_word: הוֹלִיד
  choice: zeugte
  rationale: Der Hifil von ילד bezeichnet in genealogischen Formeln das Zeugen beziehungsweise Vaterwerden. „Zeugte“ ist knapp, präzise und im genealogischen Zusammenhang idiomatisch.
- source_word: אֶת
  choice: '[unübersetzter Akkusativmarker]'
  rationale: Die Partikel kennzeichnet im Hebräischen das bestimmte direkte Objekt und hat keine eigenständige deutsche Entsprechung.
- source_word: חֶצְרוֹן
  choice: Hezron
  rationale: Der Personenname wird in der im Deutschen gebräuchlichen Form wiedergegeben.
