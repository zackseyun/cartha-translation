  text: וַ/תִּקְרֶאנָה֩ ל֨/וֹ הַ/שְּׁכֵנ֥וֹת שֵׁם֙ לֵ/אמֹ֔ר יֻלַּד בֵּ֖ן לְ/נָעֳמִ֑י וַ/תִּקְרֶ֤אנָֽה שְׁמ/וֹ֙ עוֹבֵ֔ד ה֥וּא אֲבִי יִשַׁ֖י אֲבִ֥י דָוִֽד־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/017.yaml
  text: Then the neighbor women gave him a name[a], saying, “A son has been born to Naomi.” And they named him Obed. He was the father of Jesse, the father of David.
translation:
  language: de
  text: 'Die Nachbarinnen gaben ihm einen Namen und sagten: „Noomi ist ein Sohn geboren worden.“[a] Sie nannten ihn Obed. Er war der Vater von Isai, dem Vater Davids.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Damit ist nicht gemeint, dass Noomi die leibliche Mutter war. Die Nachbarinnen sprechen davon, dass durch Ruts Kind Noomis Familie und ihre Linie wiederhergestellt worden sind.
    reason: Die wörtlich bewahrte Zuordnung des Sohnes zu Noomi kann im Deutschen als Aussage über biologische Mutterschaft missverstanden werden.
lexical_decisions:
- source_word: הַשְּׁכֵנוֹת
  choice: die Nachbarinnen
  rationale: Die feminine Pluralform bezeichnet ausdrücklich Frauen aus der Nachbarschaft; „Nachbarinnen“ gibt Ort und Geschlecht knapp und natürlich wieder.
- source_word: וַתִּקְרֶאנָה לוֹ שֵׁם
  choice: gaben ihm einen Namen
  rationale: Die hebräische Wendung lautet wörtlich etwa „riefen ihm einen Namen“; die gewählte Formulierung bewahrt den indirekten Bezug auf das Kind und klingt im modernen Deutschen natürlich.
- source_word: לֵאמֹר
  choice: und sagten
  rationale: Leitet den Inhalt der Erklärung ein; im Deutschen verbindet „und sagten“ die Namenshandlung flüssig mit der folgenden direkten Rede.
- source_word: יֻלַּד בֵּן לְנָעֳמִי
  choice: Noomi ist ein Sohn geboren worden
  rationale: Die passive Form und die Präposition לְ stellen Noomi als diejenige dar, der das Kind familiär zugerechnet beziehungsweise zugutegekommen ist. Die ungewöhnliche Aussage wird nicht zu „Enkel“ präzisiert.
- source_word: וַתִּקְרֶאנָה שְׁמוֹ עוֹבֵד
  choice: Sie nannten ihn Obed
  rationale: Gibt die hebräische Namensformel idiomatisch und präzise wieder.
- source_word: עוֹבֵד
  choice: Obed
  rationale: Der Personenname wird in seiner geläufigen deutschen Form wiedergegeben und nicht nach seiner möglichen Bedeutung „Dienender“ übersetzt.
- source_word: אֲבִי
  choice: Vater
  rationale: Die unmittelbar anschließende Genealogie spricht in beiden Fällen für die konkrete Bedeutung „Vater“ statt des weiteren Begriffs „Vorfahr“.
- source_word: יִשַׁי
  choice: Isai
  rationale: „Isai“ ist die im Deutschen geläufige biblische Namensform.
- source_word: דָוִד
  choice: David
  rationale: Geläufige deutsche Form des hebräischen Personennamens.
theological_decisions:
- issue: Noomis Verhältnis zu dem Neugeborenen in der Aussage „Noomi ist ein Sohn geboren worden“
  choice: Die Zuordnung des Sohnes zu Noomi bleibt im Haupttext erhalten, ohne sie als biologische Mutterschaft zu erklären.
  alternative: „Noomi ist ein Enkel geboren worden“ oder „Noomi hat einen Sohn bekommen“
  rationale: Die Nachbarinnen deuten Ruts Kind als Wiederherstellung von Noomis Familie und Linie. Eine Ersetzung durch „Enkel“ würde die bewusst auffällige familiäre und literarische Aussage des Hebräischen vorschnell auflösen.
translation_notes:
  register: 'Modernes, würdevolles Standarddeutsch. Die beiden hebräischen Namensformulierungen werden bewusst leicht unterschiedlich wiedergegeben: zunächst „einen Namen geben“, danach mit dem Eigennamen „ihn Obed nennen“. Die genealogische Schlussformel bleibt knapp.'
