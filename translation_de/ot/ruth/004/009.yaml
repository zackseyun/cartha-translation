base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/009.yaml
  text: Then Boaz said to the elders and all the people[b][a], “You are witnesses today that I have acquired from the hand of Naomi all that belonged to Elimelech and all that belonged to Chilion and Mahlon.”
translation:
  language: de
  text: 'Da sagte Boas zu den Ältesten und dem ganzen Volk: „Ihr seid heute Zeugen dafür, dass ich aus Noomis Hand[b] alles erworben[a] habe, was Elimelech gehörte, und alles, was Kiljon und Machlon gehörte.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gekauft“. Das hebräische Verb kann in einem Rechtsgeschäft den Erwerb durch Kauf bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Aus Noomis Hand“ ist eine hebräische Ausdrucksweise für den Erwerb aus ihrem Besitz oder ihrer Verfügungsgewalt.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter. „Da sagte“ gibt die zeitliche Abfolge in natürlichem deutschem Erzählstil wieder.
- source_word: לַזְּקֵנִים וְכָל הָעָם
  choice: zu den Ältesten und dem ganzen Volk
  rationale: Beide Gruppen werden ausdrücklich als Adressaten genannt; die gemeinsame Präposition ist im Deutschen natürlich und eindeutig.
- source_word: עֵדִים אַתֶּם הַיּוֹם
  choice: Ihr seid heute Zeugen
  rationale: Die prädikative Aussage wird in klarer deutscher Wortstellung wiedergegeben; „heute“ bewahrt den rechtlich bedeutsamen Zeitpunkt.
- source_word: כִּי
  choice: dafür, dass
  rationale: כִּי leitet hier den Inhalt dessen ein, was die Anwesenden bezeugen. Die deutsche Verbindung „Zeugen dafür, dass“ ist idiomatisch.
- source_word: קָנִיתִי
  choice: erworben
  rationale: Das Verb bezeichnet in diesem rechtlichen Zusammenhang den Erwerb beziehungsweise die Übernahme von Besitzrechten. „Erworben“ lässt offen, ob besonders der Kaufvorgang betont werden soll.
- source_word: אֶת כָּל אֲשֶׁר לֶאֱלִימֶלֶךְ
  choice: alles, was Elimelech gehörte
  rationale: Die hebräische Zugehörigkeitskonstruktion wird als Besitzverhältnis natürlich und präzise wiedergegeben.
- source_word: וְאֵת כָּל אֲשֶׁר לְכִלְיוֹן וּמַחְלוֹן
  choice: und alles, was Kiljon und Machlon gehörte
  rationale: Die Wiederholung von „alles“ erhält den Parallelismus und macht deutlich, dass auch der Besitz der beiden Söhne einbezogen ist.
- source_word: מִיַּד נָעֳמִי
  choice: aus Noomis Hand
  rationale: Die hebräische Wendung wird beibehalten, weil sie im Deutschen verständlich ist und Noomis Verfügungsgewalt im Rechtsgeschäft erkennen lässt.
theological_decisions:
- issue: Art des Rechtsgeschäfts von Boas
  choice: „erworben“ als Bezeichnung der rechtlichen Übertragung
  alternative: „gekauft“
  rationale: Der Vers spricht vom Besitz, der Elimelech, Kiljon und Machlon gehörte und unter Noomis Verfügungsgewalt stand. „Erworben“ bildet den rechtlichen Vorgang ab, ohne über den Wortlaut hinaus die genaue Form oder den Gegenstand des Kaufes festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit verständlicher rechtlicher Sprache. Die Namen folgen gebräuchlichen deutschen Bibelformen. Der hebräische Parallelismus wird weitgehend bewahrt, während die Satzstellung für heutiges Deutsch natürlich gestaltet ist.
