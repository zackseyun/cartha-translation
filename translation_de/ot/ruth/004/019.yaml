  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/חֶצְרוֹן
  choice: Hezron
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben. Das vorangestellte וְ setzt die Reihe fort, verlangt in einem einzeln zitierten deutschen Vers aber kein zusätzliches einleitendes „Und“.
- source_word: הוֹלִיד
  choice: zeugte
  rationale: Der Hifil von ילד bezeichnet in diesem genealogischen Zusammenhang das Zeugen beziehungsweise Vaterwerden. „Zeugte“ ist knapp, präzise und im Deutschen für Stammbäume geläufig.
- source_word: אֶת
  choice: nicht eigens wiedergegeben
  rationale: Der hebräische Akkusativmarker hat kein eigenständiges deutsches Äquivalent; seine Funktion wird durch den deutschen Satzbau ausgedrückt.
- source_word: רָם
  choice: Ram
  rationale: Der Personenname wird entsprechend der etablierten deutschen biblischen Namensform transliteriert.
- source_word: וְ/רָם
  choice: und Ram
  rationale: Die Konjunktion verbindet die beiden genealogischen Aussagen und wird im Deutschen ausdrücklich mit „und“ wiedergegeben.
- source_word: עַמִּינָדָב
  choice: Amminadab
  rationale: Der Personenname wird in der verbreiteten deutschen biblischen Form wiedergegeben; die Schreibung mit doppeltem m entspricht dem hebräischen Konsonantenbestand.
