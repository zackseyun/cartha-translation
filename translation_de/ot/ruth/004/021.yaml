lexical_decisions:
- source_word: וְ/שַׂלְמוֹן
  choice: Und Salmon
  rationale: Die Konjunktion וְ wird ausdrücklich mit „Und“ wiedergegeben, um die fortlaufende, verbindende Struktur des Stammbaums zu bewahren; der Personenname folgt der gebräuchlichen deutschen Form „Salmon“.
- source_word: הוֹלִיד
  choice: zeugte
  rationale: Der Hifil von ילד bezeichnet in genealogischen Zusammenhängen das Zeugen beziehungsweise Vaterwerden. „Zeugte“ ist im Deutschen prägnant und als genealogischer Ausdruck weiterhin verständlich.
- source_word: אֶת
  choice: '[nicht wiedergegeben]'
  rationale: אֶת kennzeichnet im Hebräischen das bestimmte direkte Objekt und besitzt hier keine eigenständige deutsche Entsprechung.
- source_word: בֹּעַז
  choice: Boas
  rationale: „Boas“ ist die etablierte deutsche Namensform.
- source_word: וּ/בֹעַז
  choice: und Boas
  rationale: Die vorangestellte Konjunktion wird ausdrücklich wiedergegeben, um die hebräische Reihung zu erhalten; „Boas“ ist die gebräuchliche deutsche Namensform.
- source_word: הוֹלִיד
  choice: zeugte
  rationale: Die wiederholte Verbform wird innerhalb des genealogischen Satzes einheitlich übersetzt.
- source_word: עוֹבֵד
  choice: Obed
  rationale: „Obed“ ist die etablierte deutsche Namensform.
