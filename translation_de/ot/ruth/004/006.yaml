  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר הַ/גֹּאֵ֗ל לֹ֤א אוּכַל֙ ל/גאול לִ֔/י פֶּן אַשְׁחִ֖ית אֶת נַחֲלָתִ֑/י גְּאַל לְ/ךָ֤ אַתָּה֙ אֶת גְּאֻלָּתִ֔/י כִּ֥י לֹא אוּכַ֖ל לִ/גְאֹֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/006.yaml
  text: Then the redeemer said[a], “I cannot redeem it for myself, lest I ruin my own inheritance. Redeem for yourself my right of redemption[b], for I cannot redeem it.”
translation:
  language: de
  text: 'Da sagte der Löser[a]: »Ich kann es nicht für mich lösen, sonst gefährde ich mein eigenes Erbe. Nimm du für dich mein Lösungsrecht[b] wahr, denn ich kann es nicht lösen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der »Löser« ist der näher verwandte Mann, der vor Boas das vorrangige Recht beziehungsweise die Pflicht hatte, den Familienbesitz auszulösen. Traditionell wird auch »Verwandtenlöser« gesagt.
    reason: cultural_note
  - marker: b
    text: 'Wörtlicher: »meine Lösung«. Das hebräische Substantiv bezeichnet hier das Recht beziehungsweise die Pflicht, als Löser zu handeln.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגֹּאֵל
  choice: der Löser
  rationale: Das substantivierte Partizip von גאל bezeichnet hier den nahen Verwandten mit dem vorrangigen Recht beziehungsweise der Pflicht zur Lösung. »Löser« bewahrt den Leitbegriff knapp; die verwandtschaftliche und rechtliche Funktion ergibt sich aus dem Erzählzusammenhang und wird in der Fußnote erläutert.
- source_word: לִגְאֹל / גְּאַל / גְּאֻלָּתִי
  choice: lösen / mein Lösungsrecht wahrnehmen
  rationale: Die Wiedergabe hält die Wortgruppe גאל soweit möglich durch »lösen/Lösungsrecht« zusammen. Beim Substantiv macht »Lösungsrecht« die konkrete rechtliche Bedeutung verständlich; »wahrnehmen« ergibt mit »Recht« natürliches modernes Deutsch.
- source_word: לִי
  choice: für mich
  rationale: Der Dativ bezeichnet das persönliche Interesse beziehungsweise den eigenen Vorteil des Sprechers.
- source_word: פֶּן
  choice: sonst
  rationale: »Sonst« gibt die befürchtete Folge in natürlichem Deutsch wieder, ohne sie als tatsächlich eintretend festzulegen.
- source_word: אַשְׁחִית
  choice: gefährde
  rationale: Der Hifil von שׁחת bezeichnet hier eine schwere Beeinträchtigung des eigenen Erbes, nicht zwingend dessen buchstäbliche Zerstörung. »Gefährden« passt zum wirtschaftlich-rechtlichen Zusammenhang.
- source_word: נַחֲלָתִי
  choice: mein eigenes Erbe
  rationale: »Erbe« bezeichnet den ererbten Familienbesitz; »eigenes« verdeutlicht den im Possessiv liegenden Gegensatz zu dem Besitz, der gelöst werden soll.
- source_word: לְךָ אַתָּה
  choice: du für dich
  rationale: Das selbstständige Pronomen אַתָּה verstärkt die Anrede. Die Wortfolge »du für dich« bildet diese Betonung verständlich ab.
- source_word: כִּי
  choice: denn
  rationale: »Denn« leitet die begründende Wiederholung seiner Unfähigkeit passend ein.
theological_decisions:
- issue: Umfang der Aufgabe des Lösers
  choice: Die Übersetzung nennt nur das Lösungsrecht; die Verbindung mit Ruths Heirat wird nicht in den Vers selbst eingefügt.
  alternative: Das Recht ausdrücklich als Pflicht zum Grundstückserwerb und zur Heirat mit Ruth umschreiben.
  rationale: Der hebräische Vers verwendet die גאל-Wortgruppe, ohne die einzelnen rechtlichen Folgen hier erneut auszuführen. Diese ergeben sich aus dem unmittelbaren Zusammenhang; eine Erweiterung im Haupttext würde eine Auslegung in den Wortlaut eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der rechtliche Leitbegriff »lösen« bleibt trotz seiner heute weniger geläufigen Fachbedeutung erhalten und wird durch die Fußnoten erschlossen. Die direkte Rede ist knapp und bewahrt die wiederholte Weigerung des Mannes.
