base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/007.yaml
  text: 'This was formerly the custom in Israel concerning redemption and exchange[a], to confirm any matter: a man removed his sandal and gave it to his neighbor[c][b], and this was the attestation in Israel.'
translation:
  language: de
  text: 'Früher war dies in Israel bei der Einlösung[a] und beim Tausch so: Zur Bestätigung jeder Angelegenheit[b] zog ein Mann seine Sandale aus und gab sie seinem Gegenüber[c]. Dies diente in Israel als Bezeugung[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: beim Rückkauf oder bei der Auslösung.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: um jedes Rechtsgeschäft zu bestätigen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: seinem Gefährten beziehungsweise seinem Nächsten; gemeint ist hier offenbar die andere beteiligte Person.'
    reason: lexical_clarification
  - marker: d
    text: 'Wörtlicher: Dies war die Bezeugung in Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפָנִים
  choice: früher
  rationale: Die Wendung bezeichnet eine in früherer Zeit geltende Praxis. „Früher“ ist knapp, natürlich und gibt den zeitlichen Sinn ohne einen nicht vorhandenen Gegenwartsmarker wieder.
- source_word: הַגְּאוּלָּה
  choice: Einlösung
  rationale: Das Wort bezeichnet im verwandtschaftsrechtlichen Zusammenhang die Auslösung beziehungsweise den Rückerwerb. „Einlösung“ wahrt den juristischen Kontext, ohne den Vorgang stärker festzulegen als der hebräische Ausdruck.
- source_word: הַתְּמוּרָה
  choice: Tausch
  rationale: Der Ausdruck bezeichnet Austausch oder Ersatz. „Tausch“ gibt den allgemeinen Wortsinn verständlich wieder, ohne einen bestimmten rechtlichen Mechanismus vorauszusetzen.
- source_word: לְקַיֵּם כָּל דָּבָר
  choice: jede Angelegenheit rechtskräftig zu bestätigen
  rationale: לְקַיֵּם bedeutet hier feststellen, bestätigen oder rechtswirksam machen; כָּל דָּבָר bleibt allgemein. „Rechtskräftig“ macht die rechtliche Funktion des Vorgangs im Deutschen deutlich.
- source_word: שָׁלַף ... נַעֲלוֹ
  choice: zog ... seine Sandale aus
  rationale: שָׁלַף bezeichnet ein Herausziehen oder Abnehmen. In Verbindung mit einer Sandale ist „ausziehen“ die natürliche deutsche Formulierung.
- source_word: לְרֵעֵהוּ
  choice: gab sie dem anderen
  rationale: רֵעַ kann Mitmensch, Gefährte oder Gegenüber bedeuten. Im geschäftlichen Zusammenhang ist die andere beteiligte Person gemeint; „dem anderen“ ist hier klar und vermeidet das im Deutschen missverständliche „Nachbarn“.
- source_word: הַתְּעוּדָה
  choice: rechtsgültige Bestätigung
  rationale: Das Substantiv bezeichnet hier den bezeugenden beziehungsweise bestätigenden Rechtsakt oder dessen Zeichen. Die gewählte Formulierung gibt diese Funktion verständlich wieder; die wörtlichere Möglichkeit „Bezeugung“ bleibt in der Fußnote sichtbar.
