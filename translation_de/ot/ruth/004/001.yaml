source:
  edition: WLC
  text: וּ/בֹ֨עַז עָלָ֣ה הַ/שַּׁעַר֮ וַ/יֵּ֣שֶׁב שָׁם֒ וְ/הִנֵּ֨ה הַ/גֹּאֵ֤ל עֹבֵר֙ אֲשֶׁ֣ר דִּבֶּר בֹּ֔עַז וַ/יֹּ֛אמֶר ס֥וּרָ/ה שְׁבָ/ה פֹּ֖ה פְּלֹנִ֣י אַלְמֹנִ֑י וַ/יָּ֖סַר וַ/יֵּשֵֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/001.yaml
  text: Boaz had gone up to the gate and sat down there[a], and behold, the kinsman-redeemer of whom Boaz had spoken was passing by. So he said, "Turn aside, sit down here[b], so-and-so." And he turned aside and sat down.
translation:
  language: de
  text: 'Boas ging zum Tor[a] hinauf und setzte sich dort. Und siehe, der Löser[b], von dem Boas gesprochen hatte, kam gerade vorbei. Da sagte Boas: »Komm her und setz dich hierher, Soundso!«[c] Da kam er herüber und setzte sich.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Tor der Ortschaft diente zugleich als öffentlicher Ort für Rechtsgeschäfte und andere Angelegenheiten der Gemeinschaft.
    reason: cultural_note
  - marker: b
    text: Ein „Löser“ war ein naher männlicher Verwandter, der in bestimmten familiären Notlagen Rechte und Pflichten zur Einlösung beziehungsweise Wiederherstellung hatte.
    reason: lexical_cultural_note
  - marker: c
    text: Wörtlich steht im Hebräischen eine formelhafte Wendung, die etwa „Soundso“ oder „der und der“ bedeutet und den Namen des Mannes bewusst ungenannt lässt.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה הַשַּׁעַר
  choice: ging zum Tor hinauf
  rationale: עָלָה bezeichnet ein Hinaufgehen. Die deutsche Erzählform gibt die hebräische Ereignisfolge natürlich wieder; für ein Plusquamperfekt besteht im Deutschen hier kein zwingender Grund.
- source_word: וְהִנֵּה
  choice: Und siehe
  rationale: Die Wendung lenkt die Aufmerksamkeit auf das überraschend passende Eintreffen des Mannes. „Und siehe“ bewahrt diese erzählerische Signalwirkung in würdigem, verständlichem Deutsch.
- source_word: הַגֹּאֵל
  choice: der Löser
  rationale: „Löser“ entspricht dem rechtlich geprägten גֹּאֵל, ohne die im einzelnen Fall berührten verwandtschaftlichen Pflichten bereits im Haupttext auszudeuten. Eine Fußnote erläutert die Funktion.
- source_word: עֹבֵר
  choice: kam gerade vorbei
  rationale: Das Partizip stellt das Vorbeikommen als im Verlauf befindlich dar; „gerade“ macht diesen Aspekt im Deutschen deutlich.
- source_word: סוּרָה שְׁבָה פֹה
  choice: Komm her und setz dich hierher
  rationale: סור fordert den Mann auf, seinen Weg zu verlassen und zu Boas herüberzukommen. Die Formulierung ist im Deutschen natürlicher als das wörtliche „Bieg ab“ und passt zur anschließenden Reaktion.
- source_word: פְּלֹנִי אַלְמֹנִי
  choice: Soundso
  rationale: Die idiomatische Platzhalterform lässt den Namen des Mannes bewusst ungenannt. „Soundso“ bewahrt diese Funktion auch in direkter Anrede.
- source_word: וַיָּסַר וַיֵּשֵׁב
  choice: Da kam er herüber und setzte sich
  rationale: „Kam er herüber“ nimmt die vorausgehende Aufforderung idiomatisch wieder auf; „setzte sich“ entspricht dem zweiten Verb und zeigt seine Befolgung.
theological_decisions:
- issue: Bedeutungsumfang von גֹּאֵל
  choice: Löser
  alternative: Verwandtenlöser / nächster Verwandter
  rationale: גֹּאֵל bezeichnet hier einen Verwandten mit bestimmten familiären und rechtlichen Einlösungsrechten beziehungsweise -pflichten. „Löser“ hält den Fachbegriff im Text knapp und lässt offen, welche Aspekte seiner Rolle in der folgenden Verhandlung entscheidend werden; die nähere Erklärung steht in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählbewegung. „Und siehe“ erhält bewusst die markierte Aufmerksamkeitssprache des Hebräischen; „Löser“ bleibt als erklärungsbedürftiger Rechtsbegriff stehen und wird in einer Fußnote erläutert.
