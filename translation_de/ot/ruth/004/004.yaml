source:
  edition: WLC
  text: וַ/אֲנִ֨י אָמַ֜רְתִּי אֶגְלֶ֧ה אָזְנְ/ךָ֣ לֵ/אמֹ֗ר קְ֠נֵה נֶ֥גֶד הַֽ/יֹּשְׁבִים֮ וְ/נֶ֣גֶד זִקְנֵ֣י עַמִּ/י֒ אִם תִּגְאַל֙ גְּאָ֔ל וְ/אִם לֹ֨א יִגְאַ֜ל הַגִּ֣ידָ/ה לִּ֗/י ו/אדע כִּ֣י אֵ֤ין זוּלָֽתְ/ךָ֙ לִ/גְא֔וֹל וְ/אָנֹכִ֖י אַחֲרֶ֑י/ךָ וַ/יֹּ֖אמֶר אָנֹכִ֥י אֶגְאָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/004.yaml
  text: So I thought I should inform you[a], saying, ‘Buy it in the presence of those sitting here and in the presence of the elders of my people. If you will redeem it, redeem it; but if he will not redeem it, tell me, so that I may know, for there is no one besides you to redeem it, and I am after you.’ And he said[b], ‘I will redeem it.’
translation:
  language: de
  text: 'Ich aber dachte, ich sollte es dir mitteilen[a] und sagen: »Kaufe es vor den hier Sitzenden und vor den Ältesten meines Volkes. Willst du es einlösen, dann löse es ein; wenn er es aber nicht einlösen will[b], dann sag es mir, damit ich Bescheid weiß. Denn außer dir gibt es niemanden, der es einlösen kann, und ich komme nach dir.« Da sagte er: »Ich will es einlösen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „dein Ohr aufdecken“; eine hebräische Redewendung für „dir etwas mitteilen“ oder „dich etwas wissen lassen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich lautet der hebräische Text: „wenn er nicht einlösen will“. Wegen des unvermittelten Wechsels von der zweiten zur dritten Person verstehen manche die Aussage sinngemäß als „wenn du es nicht einlösen willst“.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֶגְלֶה אָזְנְךָ
  choice: es dir mitteilen
  rationale: Die hebräische Wendung bedeutet wörtlich „dein Ohr aufdecken“, ist hier jedoch eine Redewendung für das Bekanntmachen einer Sache. „Es dir mitteilen“ gibt ihren Sinn in natürlichem Deutsch wieder; die Bildlichkeit wird in einer Fußnote bewahrt.
- source_word: קְנֵה
  choice: Kaufe es
  rationale: קנה bezeichnet das Kaufen beziehungsweise Erwerben. Im Zusammenhang mit dem Grundstück und dessen Einlösung ist „Kaufe es“ klar, natürlich und rechtlich passend.
- source_word: נֶגֶד הַיֹּשְׁבִים
  choice: vor den hier Sitzenden
  rationale: נגד bezeichnet hier die öffentliche Gegenwart von Zeugen. Das substantivierte Partizip wird knapp als „die hier Sitzenden“ wiedergegeben; „hier“ ergibt sich aus der Torsituation.
- source_word: זִקְנֵי עַמִּי
  choice: die Ältesten meines Volkes
  rationale: Die Formulierung bewahrt sowohl die anerkannte Leitungsfunktion der Ältesten als auch die gewöhnliche Bedeutung von עַם, ohne den Kreis unbegründet auf eine Sippe einzuengen.
- source_word: תִּגְאַל ... גְּאָל
  choice: Willst du es einlösen, dann löse es ein
  rationale: Die Wiederholung des Verbs גאל bleibt als „einlösen ... löse ... ein“ erhalten. Die deutsche Konditionalkonstruktion drückt die bevorstehende Entscheidung natürlich aus.
- source_word: וְאִם לֹא יִגְאַל
  choice: wenn er es aber nicht einlösen will
  rationale: Der masoretische Text hat die dritte Person Singular. Der dadurch entstehende abrupte Wechsel von „du“ zu „er“ wird im Haupttext bewahrt und in einer Fußnote erläutert.
- source_word: הַגִּידָה לִּי
  choice: dann sag es mir
  rationale: Die direkte Aufforderung wird in natürlichem, gegenwärtigem Deutsch wiedergegeben.
- source_word: אֵין זוּלָתְךָ
  choice: außer dir gibt es niemanden
  rationale: זוּלָת drückt Ausschließlichkeit aus. Die deutsche Wendung ist klar und bewahrt diese Aussage.
- source_word: וְאָנֹכִי אַחֲרֶיךָ
  choice: und ich komme nach dir
  rationale: Die Wendung bezeichnet die Reihenfolge des Einlösungsrechts. „Ich komme nach dir“ bewahrt dieses Nachgeordnetsein, ohne eine zusätzliche rechtliche Erklärung in den Text einzufügen.
- source_word: אָנֹכִי אֶגְאָל
  choice: Ich will es einlösen
  rationale: Die Antwort erklärt die Bereitschaft, das Einlösungsrecht wahrzunehmen. Das im Hebräischen unausgesprochene Objekt wird aus dem unmittelbaren Zusammenhang ergänzt.
theological_decisions:
- issue: Wiedergabe von גאל im familien- und grundstücksrechtlichen Zusammenhang
  choice: einlösen
  alternative: als Löser handeln; zurückkaufen
  rationale: „Einlösen“ bewahrt den rechtlich-familiären Schlüsselbegriff und seine weiterreichende biblische Resonanz, ohne die interpretierende Bezeichnung „Verwandtenlöser“ in das Verb selbst einzubauen.
- issue: Personenwechsel in וְאִם לֹא יִגְאַל
  choice: wenn er es aber nicht einlösen will
  alternative: wenn du es aber nicht einlösen willst
  rationale: Die dritte Person des masoretischen Textes wird trotz der Spannung mit der vorausgehenden direkten Anrede beibehalten. Die glättende Lesart in der zweiten Person wird nicht stillschweigend übernommen, sondern in der Fußnote genannt.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, gut verständlichem Erzählton. Die rechtliche Öffentlichkeit der Szene und die Wiederholung des Schlüsselverbs גאל werden bewahrt. Der auffällige Personenwechsel des masoretischen Textes bleibt sichtbar, statt im Haupttext geglättet zu werden.
