  text: וִ/יהִ֤י בֵֽיתְ/ךָ֙ כְּ/בֵ֣ית פֶּ֔רֶץ אֲשֶׁר יָלְדָ֥ה תָמָ֖ר לִֽ/יהוּדָ֑ה מִן הַ/זֶּ֗רַע אֲשֶׁ֨ר יִתֵּ֤ן יְהוָה֙ לְ/ךָ֔ מִן הַֽ/נַּעֲרָ֖ה הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/012.yaml
  text: And may your house be like the house of Perez[a], whom Tamar bore to Judah[b], from the offspring that Yahweh will give you by this young woman.
translation:
  language: de
  text: Und dein Haus[a] werde wie das Haus des Perez, den Tamar dem Juda gebar, aus dem Nachwuchs[b], den Jahwe dir von dieser jungen Frau geben wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Haus“ ist hier nicht nur ein Gebäude gemeint, sondern auch die Familie und ihre Geschlechtslinie.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: „aus/von dem Samen“. „Samen“ ist im Hebräischen eine übliche Bezeichnung für Nachwuchs oder Nachkommen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי
  choice: Und … werde
  rationale: Der Jussiv von היה formuliert einen Segenswunsch. Die deutsche Form „werde“ gibt diesen Wunsch würdig und natürlich wieder.
- source_word: בֵיתְךָ / כְּבֵית פֶּרֶץ
  choice: dein Haus / das Haus des Perez
  rationale: „Haus“ bewahrt das hebräische Bild und umfasst hier zugleich Familie, Hausgemeinschaft und Geschlechtslinie.
- source_word: אֲשֶׁר יָלְדָה תָמָר לִיהוּדָה
  choice: den Tamar dem Juda gebar
  rationale: Die Formulierung bildet Relativsatz, Geburtsverb und genealogischen Dativ knapp und quellennah ab.
- source_word: מִן הַזֶּרַע
  choice: durch die Nachkommen
  rationale: זֶרַע bedeutet wörtlich „Samen“, bezeichnet aber idiomatisch Nachwuchs beziehungsweise Nachkommen. „Durch“ lässt die Nachkommenschaft als Mittel erkennen, durch das sich der Segenswunsch erfüllt, ohne eine nicht ausdrücklich markierte Kausalität einzutragen.
- source_word: אֲשֶׁר יִתֵּן יְהוָה לְךָ
  choice: die Jahwe dir … geben wird
  rationale: Das Imperfekt bezeichnet im Segenszusammenhang die erwartete Gabe Gottes; „geben wird“ ist im Deutschen klar und unmittelbar.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben.
- source_word: מִן הַנַּעֲרָה הַזֹּאת
  choice: von dieser jungen Frau
  rationale: נַעֲרָה bezeichnet eine junge Frau. „Von“ wahrt die Quellenangabe des hebräischen מִן und ist im Zusammenhang mit Nachkommenschaft verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen; die Transliteration erhält ihn als Eigennamen.
- issue: Bedeutungsumfang von בֵּית im genealogischen Segen
  choice: Haus
  alternative: Familie / Geschlecht
  rationale: „Haus“ bewahrt die bildhafte und genealogische Weite des Hebräischen, statt sie auf nur einen Bedeutungsaspekt festzulegen.
- issue: Verknüpfung von מִן הַזֶּרַע mit dem Segenswunsch
  choice: durch die Nachkommen
  alternative: von den Nachkommen her / aufgrund der Nachkommen
  rationale: Das zweimalige מִן beschreibt Ursprung beziehungsweise Hervorgehen. Im natürlichen Deutschen macht „durch“ den Bezug der künftigen Nachkommen auf das entstehende Haus deutlich, ohne zwingend einen rein kausalen Sinn festzuschreiben.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Segensregister. Die genealogische Bildsprache „Haus“ bleibt erhalten; altertümliche Wortstellung wird weitgehend vermieden.
