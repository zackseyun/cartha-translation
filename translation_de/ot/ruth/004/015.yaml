source:
  edition: WLC
  text: וְ/הָ֤יָה לָ/ךְ֙ לְ/מֵשִׁ֣יב נֶ֔פֶשׁ וּ/לְ/כַלְכֵּ֖ל אֶת שֵׂיבָתֵ֑/ךְ כִּ֣י כַלָּתֵ֤/ךְ אֲֽשֶׁר אֲהֵבַ֨תֶ/ךְ֙ יְלָדַ֔תּ/וּ אֲשֶׁר הִיא֙ ט֣וֹבָה לָ֔/ךְ מִ/שִּׁבְעָ֖ה בָּנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/015.yaml
  text: And he will be to you a restorer of life and a sustainer of your old age[a], for your daughter-in-law, who loves you[c][b], has borne him—she who is better to you than seven sons.
translation:
  language: de
  text: Er wird dein Leben erneuern[a] und dich in deinem Alter versorgen[b]. Denn deine Schwiegertochter, die dich liebt, hat ihn geboren – sie, die für dich besser ist als sieben Söhne[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Wiederhersteller von Leben/Seele“. Das Wort נֶפֶשׁ kann hier „Leben“, „Lebenskraft“ oder „Selbst“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „dein graues Haar“; gemeint ist dein Alter.'
    reason: lexical_alternative
  - marker: c
    text: 'Die Zahl Sieben steht häufig für Fülle oder Vollständigkeit. Gemeint ist: Ruth ist Noomi mehr wert als der als ideal geltende Segen vieler Söhne.'
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: Er wird
  rationale: Das Qal-Perfekt mit vorangestelltem וְ bezeichnet hier im Zusammenhang des Segens eine erwartete künftige Folge.
- source_word: לְמֵשִׁיב נֶפֶשׁ
  choice: dir das Leben zurückbringen
  rationale: מֵשִׁיב bezeichnet ein Zurückbringen oder Wiederherstellen; נֶפֶשׁ meint hier am ehesten das konkrete Leben beziehungsweise die Lebenskraft, nicht ausdrücklich eine vom Körper getrennte Seele.
- source_word: וּלְכַלְכֵּל
  choice: und dich … versorgen
  rationale: כלכל bezeichnet anhaltendes Ernähren, Unterhalten oder Versorgen. Die verbale Formulierung klingt im modernen Deutschen natürlicher als ein substantivisches „Erhalter“.
- source_word: אֶת שֵׂיבָתֵךְ
  choice: im Alter
  rationale: שֵׂיבָה bedeutet wörtlich „graues Haar“, bezeichnet idiomatisch aber das hohe Alter.
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion führt die Begründung für die vorausgehende Aussage ein.
- source_word: כַלָּתֵךְ
  choice: deine Schwiegertochter
  rationale: Dies ist im Kontext die eindeutige Verwandtschaftsbezeichnung für Ruths Verhältnis zu Noomi.
- source_word: אֲשֶׁר אֲהֵבַתֶךְ
  choice: die dich liebt
  rationale: Das Perfekt beschreibt eine erwiesene und fortdauernde Liebe; das deutsche Präsens gibt diese bleibende Beziehung angemessen wieder.
- source_word: יְלָדַתּוּ
  choice: hat ihn geboren
  rationale: Das maskuline Suffix verweist natürlich auf den zuvor genannten Jungen. Die knappe Wiedergabe fügt kein im Ausdruck nicht ausdrücklich genanntes Substantiv hinzu.
- source_word: אֲשֶׁר הִיא טוֹבָה לָךְ
  choice: sie, die für dich besser ist
  rationale: טוֹבָה mit vergleichendem מִן drückt einen höheren Wert oder größeren Nutzen für Noomi aus.
- source_word: מִשִּׁבְעָה בָּנִים
  choice: als sieben Söhne
  rationale: Die ausdrücklich männliche Bezeichnung und die kulturell bedeutsame Siebenzahl bleiben erhalten.
theological_decisions:
- issue: Bedeutung von נֶפֶשׁ
  choice: Leben
  alternative: Seele; Lebenskraft; Selbst
  rationale: Der Zusammenhang handelt von der Wiederherstellung und künftigen Versorgung Noomis, nicht von einer Aussage über eine immaterielle Seele. „Leben“ wahrt den konkreten Sinn und lässt die bildhafte Spannung bestehen.
- issue: Geschlechtsspezifischer Vergleich in מִשִּׁבְעָה בָּנִים
  choice: sieben Söhne
  alternative: sieben Kinder
  rationale: Der hebräische Text nennt ausdrücklich Söhne. Die Formulierung spiegelt zudem die damalige Bedeutung von Söhnen für Fortbestand und Altersversorgung wider und sollte nicht neutralisiert werden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Anrede im Singular wird entsprechend dem Hebräischen beibehalten. Der Gedankenstrich hebt die abschließende, ungewöhnlich starke Würdigung Ruths hervor.
