base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/011.yaml
  text: Then all the people who were at the gate[a], and the elders, said, “We are witnesses. May Yahweh make the woman who is coming into your house like Rachel and Leah, who together built up the house of Israel. And may you prosper in Ephrathah and proclaim a name in Bethlehem.”
translation:
  language: de
  text: 'Da sagten alle Leute, die am Tor waren, und die Ältesten: „Wir sind Zeugen. Jahwe mache die Frau, die in dein Haus kommt, Rahel und Lea gleich, die beide das Haus Israel aufgebaut haben. Erweise dich als tüchtig[a] in Efrata und mach dir einen Namen in Bethlehem.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sei erfolgreich“, „handle kraftvoll“ oder „gelange zu Wohlstand“. Der hebräische Ausdruck kann Tüchtigkeit, Kraft, Ansehen, Erfolg oder Vermögen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵדִים
  choice: Wir sind Zeugen
  rationale: Das Hebräische hat nominal nur „Zeugen“; im Deutschen gibt die ergänzte Kopula die direkte Rede natürlich und präzise wieder.
- source_word: יִתֵּן יְהוָה
  choice: Jahwe mache
  rationale: נתן bedeutet grundsätzlich „geben“, hat hier mit Objekt und Vergleich jedoch den idiomatischen Sinn „machen“; der deutsche Konjunktiv I bewahrt den Segenswunsch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הָאִשָּׁה הַבָּאָה אֶל בֵּיתֶךָ
  choice: die Frau, die in dein Haus kommt
  rationale: Bewahrt sowohl den partizipialen Vorgang des Eintretens als auch das konkrete Bild des Hauses, das hier zugleich den Haushalt bezeichnet.
- source_word: אֲשֶׁר בָּנוּ שְׁתֵּיהֶם אֶת בֵּית יִשְׂרָאֵל
  choice: die beide das Haus Israel aufgebaut haben
  rationale: „Aufgebaut“ erhält das Bild von בנה und ist zugleich für die Entstehung des Volkes beziehungsweise Familienverbandes verständlich; „beide“ gibt שְׁתֵּיהֶם ausdrücklich wieder.
- source_word: וַעֲשֵׂה חַיִל
  choice: Erweise dich als tüchtig
  rationale: Die Wendung bezeichnet kraftvolles, erfolgreiches oder angesehenes Handeln. „Sich als tüchtig erweisen“ hält diese Breite besser offen als eine ausschließlich wirtschaftliche Wiedergabe.
- source_word: בְּאֶפְרָתָה
  choice: in Efrata
  rationale: Der Ortsname wird in geläufiger deutscher Form beibehalten.
- source_word: וּקְרָא שֵׁם
  choice: mach dir einen Namen
  rationale: Die hebräische Verbindung „einen Namen rufen/machen“ zielt idiomatisch auf Ansehen und Bekanntheit; die deutsche Wendung bewahrt zugleich das Bild des Namens.
- source_word: בְּבֵית לָחֶם
  choice: in Bethlehem
  rationale: Natürliche deutsche Ortsangabe und etablierte Form des Namens.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. „Jahwe“ macht dies sichtbar, ohne ihn durch den traditionellen Ersatztitel zu verdecken.
- issue: Bedeutung von וַעֲשֵׂה חַיִל im Segensspruch
  choice: Erweise dich als tüchtig
  alternative: Sei erfolgreich / Gelange zu Wohlstand / Handle kraftvoll
  rationale: חַיִל kann Tüchtigkeit, Kraft, Ansehen, Erfolg oder Vermögen bezeichnen. Die gewählte Fassung legt den Segen nicht einseitig auf Reichtum oder militärische Tapferkeit fest.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Segensform wird durch „Jahwe mache“ und den anschließenden Imperativ knapp gehalten. „Haus Israel“ bewahrt die biblische Familien- und Volksmetapher; „mach dir einen Namen“ ist gegenwärtig verständlich, ohne das hebräische Namensbild aufzugeben.
