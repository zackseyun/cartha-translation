base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/014.yaml
  text: So she lay at his feet until morning[a], and she got up before one man could recognize another. And he said[b], “Do not let it be known that the woman came to the threshing floor.”
translation:
  language: de
  text: So lag sie zu seinen Füßen[a] bis zum Morgen. Dann stand sie auf, bevor einer den anderen erkennen konnte. Und er sagte:[b] »Es soll nicht bekannt werden, dass die Frau auf die Tenne gekommen ist.«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: »am Platz seiner Füße« oder »an seinem Fußende«.'
    reason: lexical_alternative
  - marker: b
    text: 'Gemeint ist dem Zusammenhang nach sehr wahrscheinlich Boas; im Hebräischen steht jedoch nur: »Und er sagte.«'
    reason: alternative_reading
lexical_decisions:
- source_word: מרגלתיו
  choice: zu seinen Füßen
  rationale: Die Form bezeichnet den Bereich bei den Füßen beziehungsweise das Fußende seines Liegeplatzes. »Zu seinen Füßen« ist im Deutschen natürlich und legt weder Möbel noch Körperhaltung genauer fest.
- source_word: בטרום
  choice: bevor
  rationale: Die Verbindung bezeichnet einen Zeitpunkt vor dem Eintritt des folgenden Geschehens; »bevor« gibt den zeitlichen Bezug knapp und idiomatisch wieder.
- source_word: יכיר
  choice: erkennen konnte
  rationale: Das Verb meint hier das Erkennen oder Unterscheiden von Personen. Mit »konnte« kommt zum Ausdruck, dass die geringe Helligkeit das Erkennen noch nicht ermöglichte.
- source_word: איש את רעהו
  choice: einer den anderen
  rationale: Die wörtliche Wendung »ein Mann seinen Gefährten« wird als wechselseitige Redensart gebraucht. »Einer den anderen« ist natürliches Deutsch und bewahrt die Aussage, ohne unnötig auf eine konkrete Männergruppe festzulegen.
- source_word: אל יוודע
  choice: Es soll nicht bekannt werden
  rationale: Der verneinte passive Jussiv drückt aus, dass die Sache nicht bekannt werden soll. Diese Fassung bewahrt sowohl die Passivform als auch den auffordernden beziehungsweise gewünschten Charakter.
- source_word: האשה
  choice: die Frau
  rationale: Der bestimmte Artikel wird wiedergegeben und verweist in der Situation auf Ruth als die betreffende Frau.
- source_word: הגרן
  choice: die Tenne
  rationale: »Tenne« ist die übliche präzise deutsche Bezeichnung für den landwirtschaftlichen Dreschplatz.
- source_word: ויאמר
  choice: Und er sagte
  rationale: Das hebräische Verb hat ein implizites maskulines Subjekt. Der Zusammenhang weist wahrscheinlich auf Boas, doch sein Name wird im Ausgangstext nicht genannt.
theological_decisions:
- issue: Bestimmung des Sprechers bei ויאמר
  choice: Im Haupttext steht »Und er sagte«, ohne Boas ausdrücklich zu nennen.
  alternative: »Und Boas sagte« zur Verdeutlichung.
  rationale: Der Erzählzusammenhang legt Boas nahe, aber der hebräische Wortlaut lässt das Subjekt nur in der maskulinen Verbform erkennen. Die Übersetzung ergänzt daher keinen Namen.
- issue: Moralische oder sexuelle Deutung von Ruths Liegen bei Boas’ Füßen
  choice: Die räumliche Aussage wird schlicht mit »zu seinen Füßen« wiedergegeben.
  alternative: Eine Formulierung, die sexuelle Beziehungen andeutet oder ausdrücklich ausschließt.
  rationale: Der Vers nennt Ort und Zeit, stellt aber weder ausdrücklich einen sexuellen Vorgang fest noch verneint er einen solchen. Die Übersetzung bewahrt diese erzählerische Spannung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. »Tenne« bleibt als präziser und im biblisch-landwirtschaftlichen Kontext geläufiger Ausdruck erhalten. Die Rede wird mit deutschen Anführungszeichen gesetzt; echte Mehrdeutigkeit wird nicht durch erklärende Zusätze im Haupttext beseitigt.
