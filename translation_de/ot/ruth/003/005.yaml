  yaml_path: translation/ot/ruth/003/005.yaml
  text: And she said to her[a], “All that you say, I will do.”
translation:
  language: de
  text: 'Da sagte sie zu ihr: „Alles, was du sagst, werde ich tun.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Sie antwortete
  rationale: Das Wayyiqtol von אמר führt die Erzählung fort. Im Deutschen gibt „antwortete“ den Zusammenhang eines Gesprächs natürlich wieder, ohne den Inhalt zu erweitern.
- source_word: אֵלֶיהָ
  choice: ihr
  rationale: Die Präposition אֶל mit dem Suffix der 3. Person Singular feminin bezeichnet die Adressatin; „ihr“ ist die natürliche deutsche Wiedergabe.
- source_word: כֹּל אֲשֶׁר
  choice: Alles, was
  rationale: Die Verbindung bezeichnet die Gesamtheit dessen, was im Relativsatz genannt wird. „Alles, was“ folgt der hebräischen Struktur und ist idiomatisches modernes Deutsch.
- source_word: תֹּאמְרִי
  choice: du sagst
  rationale: Das Qal-Imperfekt der 2. Person Singular feminin bezieht sich hier auf Noomis Anweisung. Das deutsche Präsens ist nach „alles, was“ natürlich und wahrt die knappe Form ohne ein nicht ausdrücklich genanntes Objekt.
- source_word: אֶעֱשֶׂה
  choice: werde ich tun
  rationale: Das Qal-Imperfekt der 1. Person Singular drückt Ruts feste Absicht aus. Die Futurform gibt diese Entschlossenheit direkt wieder; ein zusätzliches Objekt ist nicht nötig.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper erzählerischer Form. Keine Fußnote erforderlich, da „Alles, was“ die lexikalische Spannweite des Hebräischen natürlich und genau wiedergibt.
