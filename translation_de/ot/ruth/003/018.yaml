  variant: modern standard German
source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ שְׁבִ֣י בִתִּ֔/י עַ֚ד אֲשֶׁ֣ר תֵּֽדְעִ֔י/ן אֵ֖יךְ יִפֹּ֣ל דָּבָ֑ר כִּ֣י לֹ֤א יִשְׁקֹט֙ הָ/אִ֔ישׁ כִּֽי אִם כִּלָּ֥ה הַ/דָּבָ֖ר הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/018.yaml
  text: Then she said[a], “Wait, my daughter, until you learn how the matter will fall out[b], for the man will not rest unless he has settled the matter today.”
translation:
  language: de
  text: 'Da sagte sie: „Warte, meine Tochter, bis du weißt, wie die Sache ausgehen wird[a]. Denn der Mann[b] wird nicht ruhen, ehe er die Sache noch heute zum Abschluss gebracht hat.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wie die Sache fallen wird“.'
    reason: lexical_alternative
  - marker: b
    text: Mit „der Mann“ ist Boas gemeint; der hebräische Text nennt seinen Namen hier jedoch nicht.
    reason: cross_reference
lexical_decisions:
- source_word: שְׁבִי
  choice: Warte
  rationale: Der Imperativ bedeutet wörtlich „sitze“ bzw. „bleibe“. Im Zusammenhang fordert Noomi Rut auf, ruhig abzuwarten; „Warte“ gibt diese pragmatische Bedeutung in natürlichem Deutsch wieder.
- source_word: בִתִּי
  choice: meine Tochter
  rationale: Bewahrt die ausdrücklich possessive und liebevolle Anrede Noomis.
- source_word: עַד אֲשֶׁר תֵּדְעִין
  choice: bis du weißt
  rationale: ידע bezeichnet hier das künftige Bekanntwerden des Ausgangs. Die geläufige deutsche Wendung bleibt nah am Wortlaut.
- source_word: אֵיךְ יִפֹּל דָּבָר
  choice: wie die Sache ausgehen wird
  rationale: Wörtlich steht „wie die Sache fallen wird“. „Wie die Sache ausgehen wird“ gibt das hebräische Idiom verständlich und würdig wieder; die Metapher wird in einer Fußnote kenntlich gemacht.
- source_word: הָאִישׁ
  choice: der Mann
  rationale: Der bestimmte Ausdruck wird beibehalten. Aus dem Zusammenhang ist Boas gemeint, doch der Eigenname steht an dieser Stelle nicht im Hebräischen.
- source_word: יִשְׁקֹט
  choice: wird nicht ruhen
  rationale: שׁקט bezeichnet hier, dass der Mann nicht untätig oder ruhig bleiben wird. „Nicht ruhen“ bewahrt Bild und Entschlossenheit.
- source_word: כִּי אִם
  choice: ehe
  rationale: In Verbindung mit der Verneinung bezeichnet die Wendung den Zeitpunkt bzw. die Bedingung, vor deren Eintritt er nicht ruhen wird. „Nicht … ehe“ ist dafür im Deutschen idiomatisch.
- source_word: כִּלָּה הַדָּבָר
  choice: die Sache … zum Abschluss gebracht hat
  rationale: כלה bedeutet vollenden oder zu Ende bringen. Die Formulierung passt zum anhängigen rechtlich-familiären Anliegen, ohne dessen Ausgang näher festzulegen.
- source_word: הַיּוֹם
  choice: noch heute
  rationale: „Heute“ ist die direkte Bedeutung; „noch heute“ bringt im Deutschen die im Zusammenhang erkennbare Unmittelbarkeit natürlich zum Ausdruck.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die liebevolle Anrede und die Entschlossenheit des Mannes bleiben erhalten; das ungewohnte hebräische Bild vom „Fallen“ einer Sache wird nicht in den Haupttext gezwungen, sondern in der Fußnote transparent gemacht.
