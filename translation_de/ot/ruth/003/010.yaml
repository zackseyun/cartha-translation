base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/010.yaml
  text: And he said[a], “May you be blessed by Yahweh, my daughter. You have made this last kindness greater than the first by not going after the young men, whether poor or rich.”
translation:
  language: de
  text: 'Da sagte er: »Sei gesegnet von Jahwe, meine Tochter! Mit dieser letzten Güte[a] hast du die erste noch übertroffen, denn du bist nicht den jungen Männern nachgegangen, weder armen noch reichen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »loyale Liebe«, »Treue« oder »Bundestreue«; das hebräische Wort חֶסֶד bezeichnet eine beständige, großzügige und verlässliche Zuwendung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרוּכָה אַתְּ לַיהוָה
  choice: Sei gesegnet von Jahwe
  rationale: Die prädikative Segensformel wird im Deutschen natürlich als Segenswunsch wiedergegeben; der Gottesname יהוה erscheint als »Jahwe«.
- source_word: בִּתִּי
  choice: meine Tochter
  rationale: Bewahrt die wörtliche, zugleich liebevolle Anrede eines sozial und altersmäßig Älteren an Ruth.
- source_word: הֵיטַבְתְּ חַסְדֵּךְ הָאַחֲרוֹן מִן הָרִאשׁוֹן
  choice: Mit dieser letzten Güte hast du die erste noch übertroffen
  rationale: Gibt die Vergleichskonstruktion verständlich wieder und bezieht das Hifil von יטב auf Ruths gegenwärtigen חסד im Vergleich zu ihrem früheren.
- source_word: חַסְדֵּךְ
  choice: deine Güte
  rationale: »Güte« bezeichnet hier Ruths konkrete, großzügige und loyale Zuwendung zur Familie Noomis; weitere Bedeutungsnuancen werden in der Fußnote erhalten.
- source_word: לְבִלְתִּי לֶכֶת אַחֲרֵי
  choice: denn du bist nicht ... nachgegangen
  rationale: Das Deutsche macht mit »denn« den erklärenden Sinn der Infinitivkonstruktion deutlich; »nachgehen« bewahrt das Bild der Suche nach einem Ehepartner.
- source_word: הַבַּחוּרִים
  choice: die jungen Männer
  rationale: Bezeichnet hier mögliche jüngere Ehepartner, ohne ausdrücklich einen Vergleich mit Boas in den Text einzutragen.
- source_word: אִם דַּל וְאִם עָשִׁיר
  choice: weder armen noch reichen
  rationale: Die Paarung umfasst junge Männer unabhängig von ihrem wirtschaftlichen Stand und schließt sich idiomatisch an die Verneinung an.
theological_decisions:
- issue: Wiedergabe von חֶסֶד in der erzählerischen Würdigung Ruths
  choice: Güte
  alternative: loyale Liebe; Treue; Bundestreue
  rationale: Im Zusammenhang steht Ruths konkrete, selbstlose Loyalität gegenüber Noomis Familie im Vordergrund. »Güte« ist im Haupttext natürlich und offen genug; die reicheren Beziehungs- und Bundeskonnotationen bleiben in der Fußnote sichtbar.
- issue: Wiedergabe des Tetragramms יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Gottesnamen יהוה. »Jahwe« gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede klingt herzlich und anerkennend; »meine Tochter« bewahrt die soziale und altersbezogene Nuance. Der Gottesname wird als »Jahwe« wiedergegeben.
