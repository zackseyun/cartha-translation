  text: וִ/יהִ֣י בְ/שָׁכְב֗/וֹ וְ/יָדַ֨עַתְּ֙ אֶת הַ/מָּקוֹם֙ אֲשֶׁ֣ר יִשְׁכַּב שָׁ֔ם וּ/בָ֛את וְ/גִלִּ֥ית מַרְגְּלֹתָ֖י/ו ו/שכבתי וְ/הוּא֙ יַגִּ֣יד לָ֔/ךְ אֵ֖ת אֲשֶׁ֥ר תַּעַשִֽׂי/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/004.yaml
  text: Then[a], when he lies down, note the place where he lies. Then go, uncover his feet, and lie down[b], and he will tell you what you should do.
translation:
  language: de
  text: Wenn er sich hinlegt, merke dir, wo er liegt. Dann geh hin, decke seine Füße[a] auf und leg dich hin[b]. Er wird dir sagen, was du tun sollst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: den Bereich an seinen Füßen; der hebräische Ausdruck kann den Platz bei den Füßen beziehungsweise den unteren Bereich meinen.'
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Konsonantentext lautet „und ich lege mich hin“; die überlieferte Lesung (Qere) und der Zusammenhang lesen „und du legst dich hin“.
    reason: textual_variant
lexical_decisions:
- source_word: וִיהִי בְשָׁכְבוֹ
  choice: Wenn er sich hinlegt
  rationale: Die Verbindung leitet zeitlich den nächsten Schritt der Anweisung ein. Im Deutschen gibt der temporale Nebensatz den Sinn natürlich wieder; ein zusätzliches „dann“ wäre vor dem folgenden Hauptsatz nicht nötig.
- source_word: וְיָדַעַתְּ אֶת־הַמָּקוֹם
  choice: merke dir, wo
  rationale: ידע bezeichnet hier das aufmerksame Feststellen und Behalten des Schlafplatzes. „Merke dir“ ist idiomatisch und bewahrt den praktischen Sinn der Anweisung.
- source_word: אֲשֶׁר יִשְׁכַּב שָׁם
  choice: wo er liegt
  rationale: Die Relativkonstruktion bestimmt den Schlafplatz. Das hebräische „dort“ muss im Deutschen neben „wo“ nicht eigens wiedergegeben werden.
- source_word: וּבָאת
  choice: Dann geh hin
  rationale: בוא kann je nach Blickrichtung „kommen“ oder „gehen“ bedeuten. In Noomis Anweisung an Rut ist „geh hin“ im Deutschen die natürliche Bewegungsangabe; „dann“ verdeutlicht die Abfolge.
- source_word: וְגִלִּית
  choice: decke … auf
  rationale: Das Verb bedeutet in diesem Stamm „aufdecken, entblößen“. Die konkrete, nicht weiter ausgedeutete Wiedergabe erhält die Mehrdeutigkeit der Szene.
- source_word: מַרְגְּלֹתָיו
  choice: seine Füße
  rationale: Die Form bezeichnet die Füße beziehungsweise den Bereich an den Füßen. „Seine Füße“ ist die knappe Haupttextwiedergabe; die räumlich weitere Möglichkeit wird in einer Fußnote festgehalten.
- source_word: וְשָׁכָבְתִּי / וְשָׁכַבְתְּ
  choice: und leg dich hin
  rationale: 'Die überlieferte Lesung und der Zusammenhang verlangen die 2. Person Singular feminin: Rut soll sich hinlegen. Die abweichende geschriebene Form wird in einer Fußnote dokumentiert.'
- source_word: וְהוּא יַגִּיד לָךְ
  choice: Er wird dir sagen
  rationale: נגד im Hifil bedeutet hier „sagen, mitteilen“. Das ausdrücklich gesetzte Pronomen wird durch einen neuen Satz mit „Er“ angemessen hervorgehoben.
- source_word: אֵת אֲשֶׁר תַּעַשִׂין
  choice: was du tun sollst
  rationale: Der Relativsatz bezeichnet die von Boas zu erteilende Handlungsanweisung. „Sollst“ gibt diesen direktiven Sinn natürlich wieder.
theological_decisions:
- issue: Mögliche sexuelle Mehrdeutigkeit der Aufforderung, Boas’ Füße aufzudecken und sich hinzulegen
  choice: Die konkrete Formulierung bleibt im Haupttext stehen, ohne die Handlung ausdrücklich sexuell oder ausdrücklich harmlos zu deuten.
  alternative: Die Wendung als sexuellen Euphemismus erklären oder ausschließlich als praktische Handlung zum Wecken von Boas verstehen.
  rationale: Der hebräische Wortlaut lässt eine erzählerische Spannung bestehen. Die Übersetzung soll diese Spannung weder verstärken noch auflösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Erzählton. Die Imperative sind natürlich formuliert, und die im Hebräischen angelegte Mehrdeutigkeit wird nicht interpretierend aufgelöst.
