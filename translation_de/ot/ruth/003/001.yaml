  text: וַ/תֹּ֥אמֶר לָ֖/הּ נָעֳמִ֣י חֲמוֹתָ֑/הּ בִּתִּ֞/י הֲ/לֹ֧א אֲבַקֶּשׁ לָ֛/ךְ מָנ֖וֹחַ אֲשֶׁ֥ר יִֽיטַב לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/001.yaml
  text: Then Naomi her mother-in-law said to her[a], “My daughter, should I not seek a resting place for you, that it may go well with you?”
translation:
  language: de
  text: 'Dann sagte Noomi, ihre Schwiegermutter, zu ihr: „Meine Tochter, sollte ich nicht für dich nach Ruhe suchen, damit es dir gut geht?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Dann sagte
  rationale: Das Wayyiqtol führt die Erzählung weiter; „Dann“ gibt die zeitliche und erzählerische Abfolge im modernen Deutschen natürlich wieder.
- source_word: נָעֳמִי
  choice: Noomi
  rationale: Der Personenname wird in der im Deutschen bibelsprachlich etablierten Form „Noomi“ wiedergegeben.
- source_word: חֲמוֹתָהּ
  choice: ihre Schwiegermutter
  rationale: Das Substantiv mit Suffix bezeichnet ausdrücklich Noomis Verwandtschaftsverhältnis zu Rut.
- source_word: בִּתִּי
  choice: Meine Tochter
  rationale: Die wörtliche, liebevolle Anrede bewahrt sowohl die familiäre Beziehung als auch den warmen Ton, ohne zusätzliche Wertung einzutragen.
- source_word: הֲלֹא
  choice: sollte ich nicht
  rationale: Die Form leitet eine rhetorische Frage ein, die Zustimmung erwartet; „sollte ich nicht“ erhält diese Wirkung idiomatisch.
- source_word: אֲבַקֶּשׁ
  choice: suchen
  rationale: בקש bedeutet hier „suchen“ beziehungsweise „sich um etwas bemühen“; die offene Formulierung lässt Noomis aktives Vorhaben erkennen, ohne es vorzeitig zu konkretisieren.
- source_word: מָנוֹחַ
  choice: einen Ruheort
  rationale: Das Wort bezeichnet Ruhe beziehungsweise einen Ort oder Zustand gesicherter Ruhe. „Ruheort“ bewahrt das hebräische Bild, während der Kontext auf eine dauerhafte Versorgung, wahrscheinlich durch Heirat, hindeutet.
- source_word: אֲשֶׁר יִיטַב לָךְ
  choice: damit es dir gut geht
  rationale: Die Wendung bezeichnet einen für Rut guten Ausgang beziehungsweise ihr Wohlergehen; diese deutsche Formulierung ist natürlich und erhält den Zweck- oder Ergebnissinn.
theological_decisions:
- issue: Ob מָנוֹחַ ausdrücklich als Ehe oder Ehemann wiederzugeben ist
  choice: Ruheort im Haupttext
  alternative: Heim, Geborgenheit oder Ehemann
  rationale: Der Zusammenhang legt eine durch Heirat gewonnene gesicherte Lebensstellung nahe, doch das Hebräische nennt nicht ausdrücklich einen Ehemann. Die bildhafte und inhaltlich offene Formulierung bleibt deshalb im Text erhalten; die kontextuelle Bedeutung wird in der Fußnote erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit natürlichem Erzählfluss. Die rhetorische Frage und die liebevolle Anrede bleiben erhalten; das Bild des Ruheortes wird nicht vorschnell als Heirat aufgelöst.
