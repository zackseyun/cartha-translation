  text: וְ/עַתָּה֙ כִּ֣י אָמְנָ֔ם כִּ֥י אם גֹאֵ֖ל אָנֹ֑כִי וְ/גַ֛ם יֵ֥שׁ גֹּאֵ֖ל קָר֥וֹב מִמֶּֽ/נִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/012.yaml
  text: And now[a], it is true that I am a redeemer[b], yet there is also a redeemer closer than I.
translation:
  language: de
  text: 'Und nun ist es tatsächlich so: Ich bin ein Löser[a], doch es gibt auch einen Löser, der näher verwandt ist als ich[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein „Löser“ war im alten Israel ein naher Verwandter, der in bestimmten Fällen Verantwortung für die Wahrung von Familienrechten und Familienbesitz übernahm.
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist eine engere Verwandtschaft und nicht räumliche Nähe; im Zusammenhang betrifft dies die Stellung innerhalb der Familie.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl die verbindende Konjunktion als auch den zeitlich-diskursiven Übergang und klingt im Deutschen natürlich.
- source_word: כִּי אָמְנָם כִּי אִם
  choice: Es stimmt
  rationale: Die Wendung bestätigt beziehungsweise räumt den folgenden Sachverhalt ein. Die knappe deutsche Form gibt diese bekräftigende Funktion idiomatisch wieder, ohne die syntaktisch schwierige hebräische Verbindung zu überdeuten.
- source_word: גֹאֵל
  choice: Löser
  rationale: Der Ausdruck bezeichnet hier einen nahen Verwandten mit anerkannten Pflichten und Rechten zur Wiederherstellung beziehungsweise Auslösung innerhalb der Familie. „Löser“ bewahrt den lexikalischen Kern; die rechtlich-familiäre Bedeutung wird in der Fußnote erläutert.
- source_word: אָנֹכִי
  choice: ich bin
  rationale: Das ausdrücklich gesetzte selbstständige Pronomen hebt Boas als Subjekt hervor; im Deutschen wird die Aussage mit der Kopula wiedergegeben.
- source_word: וְגַם יֵשׁ
  choice: Doch es gibt noch
  rationale: Die Formulierung bewahrt die zusätzliche Aussage und macht zugleich ihre einschränkende Wirkung auf Boas’ Anspruch deutlich.
- source_word: קָרוֹב מִמֶּנִּי
  choice: der näher verwandt ist als ich
  rationale: „Nah“ bezeichnet in diesem Zusammenhang den Verwandtschaftsgrad und die damit verbundene Vorrangstellung, nicht räumliche Nähe. Die explizite Wiedergabe vermeidet im Deutschen ein wahrscheinliches Missverständnis.
theological_decisions:
- issue: Wiedergabe von גֹאֵל im familienrechtlichen Zusammenhang
  choice: Löser
  alternative: Familienlöser; Verwandtenlöser; einer, der das Lösungsrecht hat
  rationale: Der Vers spricht von den Rechten und Pflichten eines nahen Verwandten im alten Israel, nicht unmittelbar von einer abstrakten oder ausschließlich geistlichen Erlösung. „Löser“ hält den theologischen und rechtlichen Wortklang offen; die Fußnote grenzt die konkrete Bedeutung ein.
- issue: Bedeutung von קָרוֹב im Verhältnis der beiden Löser
  choice: näher verwandt
  alternative: näher
  rationale: Im Kontext bestimmt der Verwandtschaftsgrad, wer vorrangig als Löser handeln darf. Die Wiedergabe benennt diesen Bezug, ohne weitere Einzelheiten des Rechtsverfahrens in den Vers einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Löser“ ist bewusst als knapper biblisch-rechtlicher Fachausdruck beibehalten und wird erklärt. Der Doppelpunkt markiert die bekräftigende Einführung; „Doch“ bringt die sachliche Einschränkung natürlich zum Ausdruck.
