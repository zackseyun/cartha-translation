  text: And it happened at midnight that the man trembled and turned himself[a], and behold[b], a woman was lying at his feet.
translation:
  language: de
  text: 'Und es geschah um Mitternacht: Der Mann erschrak und drehte sich[a] um – und siehe, da lag eine Frau bei seinen Füßen[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das seltene hebräische Verb kann eine Bewegung wie Sichdrehen, Sichwinden oder Sichbeugen aus Überraschung bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich »seine Füße«; gemeint sein kann auch allgemeiner der Bereich bei seinen Füßen oder unteren Beinen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Und es geschah
  rationale: Gibt die fortschreitende hebräische Erzählweise würdig und verständlich wieder, ohne unnötig altertümlich zu klingen.
- source_word: בַּחֲצִי הַלַּיְלָה
  choice: um Mitternacht
  rationale: Natürliche und prägnante Wiedergabe von »in der Mitte der Nacht«.
- source_word: וַיֶּחֱרַד
  choice: schrak auf
  rationale: חרד bezeichnet hier eine plötzliche körperliche Schreckreaktion; »schrak auf« passt zum nächtlichen Erwachen, ohne den genauen Gefühlszustand festzulegen.
- source_word: הָאִישׁ
  choice: der Mann
  rationale: Schlichte, kontextgerechte Bezeichnung für Boas, entsprechend dem hebräischen Wortlaut.
- source_word: וַיִּלָּפֵת
  choice: drehte sich um
  rationale: Das seltene Verb beschreibt offenbar eine überraschungsbedingte Körperbewegung. Die Wiedergabe bleibt vorsichtig; die Unsicherheit wird in einer Fußnote offengelegt.
- source_word: וְהִנֵּה
  choice: und siehe
  rationale: Bewahrt das Signal plötzlicher Wahrnehmung und den erhöhten, doch verständlichen Erzählton.
- source_word: אִשָּׁה
  choice: eine Frau
  rationale: Entspricht dem kontextuellen Sinn; »Ehefrau« wäre hier sachlich falsch.
- source_word: שֹׁכֶבֶת
  choice: da lag
  rationale: Gibt den beim Entdecken bestehenden Zustand in natürlichem Deutsch wieder.
- source_word: מַרְגְּלֹתָיו
  choice: bei seinen Füßen
  rationale: Natürliche Wiedergabe des Ortes im Bereich seiner Füße; eine mögliche weitere Bedeutung bis zum Bereich der unteren Beine wird in der Fußnote genannt.
theological_decisions:
- issue: Mögliche sexuelle oder euphemistische Überdeutung der Szene
  choice: Die Frau liegt schlicht bei den Füßen des Mannes.
  alternative: Den Ausdruck ausdrücklich als verhüllenden Hinweis auf den Bein- oder Genitalbereich wiederzugeben.
  rationale: Der hebräische Text nennt keine sexuelle Handlung. Die Übersetzung bewahrt die Spannung der Erzählung, ohne eine solche Deutung in den Haupttext einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. »Und siehe« bewahrt bewusst das plötzliche Entdeckungsmoment des hebräischen Textes. Alle Fußnotenmarker stehen unmittelbar an den betreffenden Ausdrücken.
