base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/017.yaml
  text: She said[a], “He gave me these six measures of barley, for he said, ‘Do not go to your mother-in-law empty-handed.’”
translation:
  language: de
  text: 'Sie sagte: »Diese sechs Maß Gerste[a] hat er mir gegeben; denn er sagte: ›Komm nicht mit leeren Händen zu deiner Schwiegermutter.‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »diese sechs Gersten«. Welche Maßeinheit gemeint ist, wird im Hebräischen nicht genannt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Sie sagte
  rationale: Das narrative Wayyiqtol von אמר leitet Ruts Bericht ein. Im Deutschen kann die fortlaufende Konjunktion unausgedrückt bleiben.
- source_word: שֵׁשׁ הַשְּׂעֹרִים הָאֵלֶּה
  choice: diese sechs Maß Gerste
  rationale: Der hebräische Ausdruck nennt sechs Einheiten Gerste, bezeichnet die konkrete Maßeinheit jedoch nicht. Das ergänzte, generische „Maß“ ergibt im Deutschen einen verständlichen Ausdruck; die Unsicherheit wird in der Fußnote offengelegt.
- source_word: נָתַן לִי
  choice: hat er mir gegeben
  rationale: Das Qal-Perfekt bezeichnet hier die kurz zuvor vollzogene Gabe. Das deutsche Perfekt klingt in Ruts direkter Rede natürlich.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt die von Boas gegebene Begründung für das Geschenk ein.
- source_word: אָמַר
  choice: er sagte
  rationale: Das Qal-Perfekt führt innerhalb von Ruts Rede das wörtlich wiedergegebene Wort des Boas ein.
- source_word: אַל תָּבֹאִי
  choice: Du sollst nicht … kommen
  rationale: Die verneinte Imperfektform der 2. Person Singular feminin drückt eine nachdrückliche Aufforderung aus. „Kommen“ bildet die Grundbedeutung von בוא ab und passt zur Bewegung hin zur Schwiegermutter.
- source_word: רֵיקָם
  choice: mit leeren Händen
  rationale: Die idiomatische deutsche Wendung gibt den adverbialen Sinn „leer, ohne etwas mitzubringen“ im Zusammenhang präzise wieder.
- source_word: אֶל חֲמוֹתֵךְ
  choice: zu deiner Schwiegermutter
  rationale: חֲמוֹת bezeichnet die Schwiegermutter; אֶל markiert hier das Ziel der Bewegung.
