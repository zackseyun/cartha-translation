source:
  edition: WLC
  text: וַ/יֹּ֨אכַל בֹּ֤עַז וַ/יֵּשְׁתְּ֙ וַ/יִּיטַ֣ב לִבּ֔/וֹ וַ/יָּבֹ֕א לִ/שְׁכַּ֖ב בִּ/קְצֵ֣ה הָ/עֲרֵמָ֑ה וַ/תָּבֹ֣א בַ/לָּ֔ט וַ/תְּגַ֥ל מַרְגְּלֹתָ֖י/ו וַ/תִּשְׁכָּֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/007.yaml
  text: And Boaz ate and drank[a], and his heart was merry, and he went to lie down at the end of the grain heap. Then she came quietly, uncovered his feet[b], and lay down.
translation:
  language: de
  text: Boas aß und trank, und ihm wurde wohl ums Herz[a]. Dann legte er sich am Rand des Getreidehaufens nieder. Sie kam leise, deckte seine Füße auf[b] und legte sich hin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Sein Herz wurde gut.“ Gemeint ist, dass er fröhlich oder guter Stimmung war. Die hebräische Wendung besagt für sich genommen nicht, dass er betrunken war.'
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Formulierung bezeichnet seine Füße beziehungsweise den Bereich zu seinen Füßen. Manche verstehen die Handlung rein wörtlich, andere sehen darin eine mögliche anzügliche Nebenbedeutung. Sexuelle Aktivität wird jedoch nicht ausdrücklich beschrieben.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאכַל ... וַיֵּשְׁתְּ
  choice: aß und trank
  rationale: Die beiden einfachen Erzählverben werden direkt und in natürlichem deutschem Erzählstil wiedergegeben.
- source_word: וַיִּיטַב לִבּוֹ
  choice: ihm wurde wohl ums Herz
  rationale: Die deutsche Wendung bewahrt das hebräische Bild vom Herzen und bezeichnet eine heitere, zufriedene Stimmung, ohne Trunkenheit zu behaupten.
- source_word: וַיָּבֹא לִשְׁכַּב
  choice: legte er sich ... nieder
  rationale: Die Formulierung gibt das Ziel der Bewegung idiomatisch wieder und vermeidet die nicht ausdrücklich genannte Aussage, Boas sei eingeschlafen.
- source_word: בִּקְצֵה הָעֲרֵמָה
  choice: am Rand des Getreidehaufens
  rationale: קצה bezeichnet Rand oder Ende; עֲרֵמָה ist im Kontext der Tenne ein aufgehäufter Getreidevorrat.
- source_word: בַלָּט
  choice: leise
  rationale: Das Wort bezeichnet ein unauffälliges, stilles oder heimliches Vorgehen. „Leise“ passt zur Szene, ohne eine moralische Wertung hinzuzufügen.
- source_word: וַתְּגַל מַרְגְּלֹתָיו
  choice: deckte seine Füße auf
  rationale: Die konkrete und zurückhaltende Ausdrucksweise des Hebräischen bleibt erhalten; mögliche Anspielungen werden nicht in den Haupttext hineingedeutet.
- source_word: וַתִּשְׁכָּב
  choice: legte sich hin
  rationale: Direkte Wiedergabe von „sich hinlegen“; der Vers selbst beschreibt damit nicht ausdrücklich eine sexuelle Handlung.
theological_decisions:
- issue: Ob Ruts Handeln ausdrücklich als sexuelle Annäherung dargestellt werden soll
  choice: Die zurückhaltende wörtliche Beschreibung bleibt im Haupttext erhalten.
  alternative: Die Handlung deutend als Verführung oder sexuellen Kontakt wiedergeben.
  rationale: Der hebräische Text berichtet nur, dass sie leise kommt, seine Füße aufdeckt und sich hinlegt. Seine mögliche Mehrdeutigkeit darf nicht durch eine ausdrückliche sexuelle Deutung beseitigt werden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit ruhigem, würdigem Erzählton. Die hebräische Bildsprache beim Herzen sowie die Zurückhaltung und Mehrdeutigkeit der Szene bleiben gewahrt.
