  text: לִ֣ינִי הַ/לַּ֗יְלָה וְ/הָיָ֤ה בַ/בֹּ֨קֶר֙ אִם יִגְאָלֵ֥/ךְ טוֹב֙ יִגְאָ֔ל וְ/אִם לֹ֨א יַחְפֹּ֧ץ לְ/גָֽאֳלֵ֛/ךְ וּ/גְאַלְתִּ֥י/ךְ אָנֹ֖כִי חַי יְהוָ֑ה שִׁכְבִ֖י עַד הַ/בֹּֽקֶר׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/013.yaml
  text: Stay here tonight[a], and in the morning, if he will redeem you, good—let him redeem you. But if he does not desire to redeem you, then I myself will redeem you, as Yahweh lives. Lie down until the morning.
translation:
  language: de
  text: 'Bleib über Nacht hier. Und am Morgen: Wenn er dich auslösen will, gut — dann soll er dich auslösen. Wenn er dich aber nicht auslösen will, werde ich selbst dich auslösen, so wahr Yahweh lebt. Bleib bis zum Morgen liegen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִינִי הַלַּיְלָה
  choice: Bleib diese Nacht hier
  rationale: לון bezeichnet das Übernachten bzw. Verbringen der Nacht. Die deutsche Formulierung ist natürlich und gibt den zeitlichen Sinn vollständig wieder; „hier“ ist aus der Situation erschlossen.
- source_word: וְהָיָה בַבֹּקֶר
  choice: 'Morgen früh gilt:'
  rationale: Die hebräische Wendung leitet die am Morgen eintretende Entscheidung ein. „Morgen früh gilt“ bewahrt die Abfolge und führt die Bedingung im Deutschen klar ein.
- source_word: יִגְאָלֵךְ / לְגָאֳלֵךְ / וּגְאַלְתִּיךְ
  choice: dich auslösen
  rationale: גאל bezeichnet hier das Eintreten eines nahen Verwandten mit familienrechtlicher Verpflichtung. „Auslösen“ bewahrt den Leitbegriff und seine rechtliche wie theologische Resonanz; die besondere Verwandtenrolle wird in der Fußnote erläutert.
- source_word: טוֹב
  choice: gut
  rationale: Das knappe, elliptische טוֹב billigt diesen möglichen Ausgang. „Gut“ erhält die Kürze und Offenheit des Hebräischen.
- source_word: יִגְאָל
  choice: dann soll er dich auslösen
  rationale: Nach dem elliptischen „gut“ hat die Verbform zustimmend-permissiven Sinn. „Dann soll er“ gibt diese Billigung idiomatisch wieder.
- source_word: לֹא יַחְפֹּץ
  choice: nicht auslösen will
  rationale: חפץ bezeichnet Wunsch, Gefallen oder Bereitschaft. Im Kontext ist „nicht … will“ natürlich und wahrt den volitionalen Sinn.
- source_word: וּגְאַלְתִּיךְ אָנֹכִי
  choice: werde ich selbst dich auslösen
  rationale: Das ausdrücklich gesetzte אָנֹכִי hebt Boas als handelnde Person hervor; „ich selbst“ bildet diese Betonung ab.
- source_word: חַי יְהוָה
  choice: so wahr Yahweh lebt
  rationale: Die feste Schwurformel wird mit einer geläufigen deutschen Schwurformel wiedergegeben; der Gottesname bleibt als Yahweh erhalten.
- source_word: שִׁכְבִי עַד הַבֹּקֶר
  choice: Bleib bis zum Morgen liegen
  rationale: שכב bedeutet „sich hinlegen/liegen“. Im Kontext liegt Rut bereits; „bleib … liegen“ gibt daher den gemeinten fortdauernden Zustand natürlicher wieder als ein erneutes „leg dich hin“.
theological_decisions:
- issue: גאל im familienrechtlichen Kontext des Rutbuches
  choice: „auslösen“ im Haupttext, Erklärung der Rolle in einer Fußnote
  alternative: „als Löser/Verwandtenlöser eintreten“ oder „die Pflicht des nächsten Verwandten übernehmen“
  rationale: Der hebräische Begriff verbindet konkrete familienrechtliche Verantwortung mit dem größeren Motiv der Erlösung. Eine knappe, wiederholbare Wiedergabe im Haupttext erhält diese Verbindung, während die Fußnote die kulturell-rechtliche Bedeutung erklärt, ohne sie auf eine einzelne Pflicht zu verengen.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jahwe; Jehova
  rationale: Der Ausgangstext enthält den Eigennamen Gottes. „Yahweh“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kurze Wiederholung von „auslösen“ bildet die auffällige Wiederholung von גאל ab. Der Gedankenstrich bewahrt die knappe, elliptische Zustimmung „gut“; die Schlussaufforderung berücksichtigt, dass Rut bereits liegt.
