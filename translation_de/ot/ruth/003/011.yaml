source:
  edition: WLC
  text: וְ/עַתָּ֗ה בִּתִּ/י֙ אַל תִּ֣ירְאִ֔י כֹּ֥ל אֲשֶׁר תֹּאמְרִ֖י אֶֽעֱשֶׂה לָּ֑/ךְ כִּ֤י יוֹדֵ֨עַ֙ כָּל שַׁ֣עַר עַמִּ֔/י כִּ֛י אֵ֥שֶׁת חַ֖יִל אָֽתְּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/011.yaml
  text: And now[a], my daughter, do not fear. All that you say, I will do for you[b], for all the gate of my people knows that you are a woman of noble character.
translation:
  language: de
  text: Und nun, meine Tochter, fürchte dich nicht. Alles, was du sagst, werde ich für dich tun. Denn alle Leute meiner Stadt[a] wissen, dass du eine tüchtige Frau bist[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „das ganze Tor meines Volkes“. Das Stadttor war der öffentliche Ort für Versammlungen, Rechtsgeschäfte und die Anerkennung durch die Gemeinschaft.'
    reason: cultural_note
  - marker: b
    text: 'Das hebräische Wort kann Stärke, Tüchtigkeit, Wert, Ansehen oder Tapferkeit bezeichnen; daher auch: „eine achtbare Frau“, „eine Frau von hohem Wert“ oder „eine starke Frau“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּתִּי
  choice: meine Tochter
  rationale: Die wörtliche Anrede bezeichnet hier keine leibliche Tochter, sondern drückt Wärme, Schutz und den Altersunterschied zwischen Boas und Rut aus.
- source_word: אַל תִּירְאִי
  choice: fürchte dich nicht
  rationale: Die verneinte Aufforderung wird quellennah und zugleich in würdigem, geläufigem Deutsch wiedergegeben.
- source_word: כֹּל אֲשֶׁר תֹּאמְרִי אֶעֱשֶׂה לָּךְ
  choice: Alles, was du sagst, werde ich für dich tun
  rationale: Das Verb „sagen“ bleibt erhalten, statt es enger als „bitten“ auszulegen; der Kontext macht deutlich, dass Rut ein Anliegen vorgebracht hat.
- source_word: כָּל שַׁעַר עַמִּי
  choice: alle aus meinem Volk, die am Stadttor zusammenkommen
  rationale: „Tor“ steht metonymisch für den öffentlichen Versammlungs- und Rechtsort. Die Formulierung bewahrt das konkrete Bild und macht den hebräischen Ausdruck in modernem Deutsch verständlich.
- source_word: אֵשֶׁת חַיִל
  choice: eine tüchtige Frau
  rationale: „Tüchtig“ vermittelt Fähigkeit, Tatkraft und bewährte Qualität und wahrt zugleich die Verbindung zur entsprechenden Wendung in Sprüche 31. Da חַיִל außerdem Wert, Stärke und Ansehen bezeichnen kann, wird die Bedeutungsbreite in einer Fußnote offengelegt.
theological_decisions:
- issue: Wiedergabe der Würdigung אֵשֶׁת חַיִל
  choice: eine tüchtige Frau
  alternative: eine achtbare Frau; eine Frau von hohem Wert; eine starke Frau
  rationale: Die gewählte Fassung beschränkt Ruts Auszeichnung weder allein auf Moral noch auf häusliche Fähigkeiten oder kämpferische Stärke. Sie lässt Kompetenz, Tatkraft, Integrität und öffentlich anerkannten Wert mitschwingen; die nicht vollständig abbildbare Bedeutungsbreite wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die direkte Rede bleibt warm und verbindlich. Der metonymische Ausdruck mit dem Tor wird verständlich entfaltet, ohne das kulturelle Bild aufzugeben; die reiche Bedeutung von אֵשֶׁת חַיִל wird im Haupttext knapp und in der Fußnote breiter wiedergegeben.
