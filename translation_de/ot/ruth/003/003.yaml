base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/003.yaml
  text: Wash yourself[a], anoint yourself, and put your cloak on; then go down to the threshing floor[c][b]. Do not make yourself known to the man until he has finished eating and drinking.
translation:
  language: de
  text: Wasch dich[a], salbe dich und leg deinen Mantel an[b]. Dann geh hinunter zur Tenne[c]. Gib dich dem Mann nicht zu erkennen, bis er mit Essen und Trinken fertig ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bade dich.“ Das hebräische Verb kann das Waschen oder Baden des Körpers bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „leg dein Gewand an“. Das hebräische Wort bezeichnet allgemein ein Kleidungsstück, insbesondere ein Obergewand oder einen Mantel. Manche Übersetzungen deuten es genauer als Festkleid oder bestes Kleid, doch dies steht nicht ausdrücklich im Hebräischen.'
    reason: lexical_alternative
  - marker: c
    text: 'Die Konsonantenform im hebräischen Text ist hier ungewöhnlich. Im Zusammenhang wird sie gewöhnlich als Fortsetzung von Noomis Anweisung an Rut verstanden: „Geh hinunter zur Tenne.“'
    reason: textual_variant
lexical_decisions:
- source_word: וְרָחַצְתְּ
  choice: Wasch dich
  rationale: רחץ bezeichnet das Waschen oder Baden des Körpers. „Wasch dich“ ist natürliches modernes Deutsch und bewahrt den reflexiven Sinn.
- source_word: וָסַכְתְּ
  choice: salbe dich
  rationale: סוך bezeichnet das Einreiben beziehungsweise Salben mit Öl oder Salbe. „Salbe dich“ bleibt näher am hebräischen Ausdruck als die deutendere Wiedergabe „parfümiere dich“.
- source_word: וְשַׂמְתְּ שמלתך עָלַיִךְ
  choice: leg deinen Mantel an
  rationale: שִׂמְלָה bezeichnet allgemein ein Kleidungsstück, häufig ein Obergewand oder einen Mantel. Die Übersetzung vermeidet die nicht ausdrücklich im Text stehende Deutung als Fest- oder bestes Kleid.
- source_word: וירדתי הַגֹּרֶן
  choice: Dann geh hinunter zur Tenne
  rationale: Die ungewöhnliche Konsonantenform wird im Zusammenhang als Fortsetzung von Noomis Anweisungen an Rut verstanden, also als Aufforderung in der 2. Person Singular feminin. גֹּרֶן ist die Tenne beziehungsweise der Dreschplatz.
- source_word: אַל תִּוָּדְעִי
  choice: Gib dich nicht zu erkennen
  rationale: Der Nifal von ידע hat hier passive beziehungsweise reflexive Bedeutung. Die deutsche Wendung wahrt den hebräischen Sinn und macht Ruts Verantwortung deutlich, zunächst unbemerkt zu bleiben.
- source_word: לָאִישׁ
  choice: dem Mann
  rationale: Der Ausdruck verweist im Kontext auf den bestimmten Mann, Boas, nennt ihn hier aber nicht beim Namen. „Dem Mann“ bewahrt diese Formulierung.
- source_word: עַד כַּלֹּתוֹ לֶאֱכֹל וְלִשְׁתּוֹת
  choice: bis er mit Essen und Trinken fertig ist
  rationale: כלה mit den Infinitiven bezeichnet den Abschluss beider Handlungen. Die Wiedergabe ist klar und idiomatisch.
