  text: וְ/עַתָּ֗ה הֲ/לֹ֥א בֹ֨עַז֙ מֹֽדַעְתָּ֔/נוּ אֲשֶׁ֥ר הָיִ֖ית אֶת נַעֲרוֹתָ֑י/ו הִנֵּה ה֗וּא זֹרֶ֛ה אֶת גֹּ֥רֶן הַ/שְּׂעֹרִ֖ים הַ/לָּֽיְלָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/002.yaml
  text: And now[a], is not Boaz our relative, with whose young women you have been? Look[b], he is winnowing barley at the threshing floor tonight.
translation:
  language: de
  text: 'Und nun: Ist Boas nicht unser Verwandter[a], mit dessen jungen Frauen[b] du zusammen warst? Sieh, heute Nacht worfelt er auf der Tenne Gerste.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unser Bekannter“; auch: „unser Sippenverwandter“. Das hebräische Wort kann einen Bekannten oder eine durch Verwandtschaft beziehungsweise Sippe verbundene Person bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mit dessen Dienerinnen“ beziehungsweise „Arbeiterinnen“. Das hebräische Wort kann junge Frauen sowie weibliche Bedienstete oder Arbeitskräfte bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl die Verknüpfung durch ו als auch den zeitlich-folgernden Übergang עַתָּה und leitet Noomis nächsten Gedankenschritt natürlich ein.
- source_word: הֲלֹא
  choice: Ist … nicht
  rationale: Gibt die rhetorische Frage wieder, die Zustimmung erwartet.
- source_word: מֹדַעְתָּנוּ
  choice: unser Verwandter
  rationale: Im Zusammenhang bezeichnet das Wort eine durch Verwandtschaft oder Sippenzugehörigkeit verbundene Person, nicht bloß einen Bekannten.
- source_word: אֲשֶׁר הָיִית אֶת נַעֲרוֹתָיו
  choice: bei dessen jungen Frauen du gewesen bist
  rationale: Bewahrt den Relativsatz und die Verbindung Ruths mit den weiblichen Angehörigen von Boas’ Arbeitsgemeinschaft, ohne den möglichen Status als Dienerinnen vorschnell festzulegen.
- source_word: הִנֵּה
  choice: Sieh
  rationale: Lenkt die Aufmerksamkeit auf die unmittelbar bedeutsame Situation und bleibt würdig sowie gegenwärtig.
- source_word: זֹרֶה
  choice: worfelt
  rationale: Bezeichnet den landwirtschaftlichen Vorgang, bei dem Spreu und Korn durch Werfen in die Luft getrennt werden; das Präsens gibt die gegenwärtige oder unmittelbar bevorstehende Tätigkeit des Partizips wieder.
- source_word: אֶת גֹּרֶן הַשְּׂעֹרִים
  choice: auf der Tenne die Gerste
  rationale: Die wörtliche Formulierung nennt die ‚Tenne der Gersten‘ als Objekt, doch sachlich wird die Gerste auf der Tenne geworfelt. Die deutsche Fassung gibt den Vorgang idiomatisch und kontextgerecht wieder.
- source_word: הַלָּיְלָה
  choice: heute Nacht
  rationale: Natürliche moderne Wiedergabe der adverbialen Zeitangabe ‚diese Nacht‘.
theological_decisions: []
