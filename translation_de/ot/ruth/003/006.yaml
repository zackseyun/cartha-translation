translation_notes:
  register: Modernes, würdiges Standarddeutsch mit flüssigem Erzählrhythmus. „Tenne“ bleibt als sachlich genauer landwirtschaftlicher Begriff erhalten. Die Hauptfassung gibt die Verbindlichkeit der Anweisung natürlich mit „aufgetragen“ wieder; die Fußnote bewahrt die stärkere mögliche Nuance „befohlen“.
