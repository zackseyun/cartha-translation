- from: So ging sie zur Tenne hinunter und tat alles so, wie ihre Schwiegermutter es ihr aufgetragen hatte.[a]
  to: Da ging sie zur Tenne hinunter und tat alles, was ihre Schwiegermutter ihr befohlen hatte.[a]
