    issue: „aufgetragen hatte“ ist für צִוָּתָה zu abgeschwächt.
    rationale: Das Verb צוה bezeichnet eine Anordnung bzw. einen Befehl. Die englische Audit-Spur erkennt ausdrücklich die stärkere Grundbedeutung „command“ an. „Befohlen hatte“ bewahrt diese Nuance im Deutschen besser.
  - severity: low
    issue: „alles so, wie“ ist stilistisch etwas holprig.
    rationale: Die hebräische Wendung כְּכֹל אֲשֶׁר bedeutet, dass Ruth allem entsprach, was Naomi ihr geboten hatte. „tat alles, was … befohlen hatte“ ist idiomatischer und erhält den umfassenden Sinn.
