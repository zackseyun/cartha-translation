translation:
  language: de
  text: Da ging sie zur Tenne hinunter und tat alles, was ihre Schwiegermutter ihr befohlen hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dann ging sie zur Tenne hinunter und handelte genau so, wie ihre Schwiegermutter ihr befohlen hatte.“'
    reason: 'Lexikalische Alternative: „Dann“ kann die narrative Fortführung durch וַ wiedergeben; „handelte genau so“ hebt die vollständige Übereinstimmung mit der Anweisung hervor.'
lexical_decisions:
- source_word: וַתֵּרֶד
  choice: So ging sie … hinunter
  rationale: ירד bezeichnet eine Abwärtsbewegung. „ging … hinunter“ bewahrt die Richtung und klingt im modernen deutschen Erzählstil natürlich; „So“ führt die vorausgehende Anweisung folgerichtig weiter.
- source_word: הַגֹּרֶן
  choice: zur Tenne
  rationale: גֹּרֶן bezeichnet den festgelegten Platz zum Dreschen und Worfeln. „Tenne“ ist die prägnante, im biblisch-landwirtschaftlichen Zusammenhang verständliche deutsche Entsprechung; der bestimmte Artikel ist in der Verschmelzung „zur“ enthalten.
- source_word: וַתַּעַשׂ
  choice: und tat
  rationale: עשה ist ein allgemeines Verb für „tun/machen“. In Verbindung mit der folgenden Vergleichsangabe gibt „tat“ den schlichten Erzählstil angemessen wieder.
- source_word: כְּכֹל אֲשֶׁר
  choice: alles so, wie
  rationale: Die Wendung drückt vollständige Übereinstimmung mit der vorherigen Anweisung aus. „alles so, wie“ bewahrt den umfassenden Sinn von כֹל und ist idiomatischer als „gemäß allem, was“.
- source_word: צִוַּתָּה
  choice: aufgetragen hatte
  rationale: צוה kann „befehlen“ oder „anweisen“ bedeuten. Im familiären Kontext bezeichnet „auftragen“ eine verbindliche Anweisung, ohne den hebräischen Ausdruck unnötig autoritär zuzuspitzen. Das Plusquamperfekt markiert, dass die Anweisung zuvor ergangen war.
- source_word: חֲמוֹתָהּ
  choice: ihre Schwiegermutter
  rationale: Das Substantiv bezeichnet ausdrücklich ihre Schwiegermutter; das Suffix der dritten Person Singular wird mit „ihre“ wiedergegeben.
