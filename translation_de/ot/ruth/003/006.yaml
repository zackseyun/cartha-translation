  verdict: revise
  source_fidelity: Der Satz gibt Handlung, Ziel, umfassende Befolgung und das vorausliegende Gebot zutreffend wieder. „Aufgetragen“ schwächt jedoch צִוָּה („befehlen/gebieten“) gegenüber dem Hebräischen merklich ab; „befohlen“ ist hier die genauere und zugleich natürliche Wiedergabe.
  naturalness: „So ging sie“ ist möglich, aber „Da ging sie“ klingt als erzählende Fortsetzung im modernen Standarddeutsch idiomatischer. Die Konstruktion „tat alles so, wie“ ist verständlich, aber weniger glatt als „tat alles, was … befohlen hatte“.
  terminology: „Tenne“ ist als Bezeichnung für גֹּרֶן sachgerecht und im biblisch-landwirtschaftlichen Register gut verständlich. „Schwiegermutter“ gibt חֲמוֹתָהּ präzise wieder. „Befohlen“ wahrt die Verbindlichkeit von צוה, ohne eine zusätzliche theologische oder soziale Deutung einzutragen.
