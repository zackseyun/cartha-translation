base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/015.yaml
  text: Then he said[a], “Bring the cloak that is on you and hold it out.” So she held it out, and he measured six measures of barley and put it on her[b]. Then he went into the city.
translation:
  language: de
  text: 'Dann sagte er: „Bring das Tuch her, das du umhast, und halte es.“ Sie hielt es, und er maß sechs Maß Gerste ab[a] und legte sie ihr auf. Dann ging er in die Stadt.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „sechs Gersten“. Die Maßeinheit wird im Hebräischen nicht genannt.'
    reason: lexical_alternative
  - marker: b
    text: 'Einige alte Übersetzungen und viele neuere Übersetzungen lesen: „Dann ging sie in die Stadt.“ Der masoretische Text lautet: „Dann ging er in die Stadt.“'
    reason: textual_variant
lexical_decisions:
- source_word: הָבִי
  choice: Gib mir
  rationale: Der feminine Singularimperativ fordert Rut auf, Boas das Tuch darzureichen. „Gib mir“ ist im Deutschen natürlich und bleibt nahe an der Grundbedeutung.
- source_word: הַמִּטְפַּחַת
  choice: das Tuch
  rationale: Das Wort bezeichnet hier ein umgelegtes Kleidungs- oder Hülltuch, das Gerste aufnehmen kann. „Tuch“ vermeidet die irreführende Festlegung auf einen Schleier und ist weniger spezifisch als „Mantel“.
- source_word: וְאֶחֳזִי בָהּ
  choice: und halte es fest
  rationale: אחז bedeutet ergreifen oder festhalten. Im Zusammenhang soll Rut das Tuch halten, während Boas die Gerste hineinmisst.
- source_word: וַיָּמָד
  choice: er maß … ab
  rationale: „Abmessen“ gibt die gezielte Zuteilung der Gerste idiomatisch wieder.
- source_word: שֵׁשׁ שְׂעֹרִים
  choice: sechs Maß Gerste
  rationale: Wörtlich steht „sechs Gersten“; eine Maßeinheit fehlt. „Maß“ ergänzt nur das im Deutschen nötige Mengenkonzept, ohne eine bestimmte Einheit wie Sea festzulegen.
- source_word: וַיָּשֶׁת עָלֶיהָ
  choice: und lud sie ihr auf
  rationale: Das feminine Pronomen kann sich auf die kollektiv verstandene Gerste beziehungsweise die abgemessene Last beziehen. „Lud sie ihr auf“ vermittelt natürlich, dass Boas Rut die Last zum Tragen auflegte.
- source_word: וַיָּבֹא הָעִיר
  choice: Dann ging er in die Stadt
  rationale: Der masoretische Text hat eine maskuline Verbform und bezeichnet daher Boas als Subjekt.
theological_decisions:
- issue: Subjekt des Schlusssatzes וַיָּבֹא הָעִיר
  choice: Dann ging er in die Stadt
  alternative: Dann ging sie in die Stadt
  rationale: Die masoretische Lesart ist maskulin und wird daher im Haupttext beibehalten. Die feminine Lesart alter Textzeugen und zahlreicher Übersetzungen wird aus textkritischer Transparenz in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Rede ist schlicht und erzählerisch. „Tuch“ bewahrt die lexikalische Offenheit; die ungenannte Maßeinheit und die Variante beim Subjekt des letzten Satzes werden ausdrücklich kenntlich gemacht.
