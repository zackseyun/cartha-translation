source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר מִי אָ֑תּ וַ/תֹּ֗אמֶר אָנֹכִי֙ ר֣וּת אֲמָתֶ֔/ךָ וּ/פָרַשְׂתָּ֤ כְנָפֶ֨/ךָ֙ עַל אֲמָ֣תְ/ךָ֔ כִּ֥י גֹאֵ֖ל אָֽתָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/009.yaml
  text: He said[a], “Who are you?” And she said, “I am Ruth, your servant. Spread your wing over your servant[b], for you are a redeemer.”
translation:
  language: de
  text: 'Er fragte: „Wer bist du?“ Sie antwortete: „Ich bin Rut, deine Dienerin. Breite deinen Flügel über deine Dienerin aus[a], denn du bist ein Löser[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Breite den Saum deines Gewandes über deine Dienerin.“ Das hebräische Wort kann „Flügel“ oder den Rand eines Kleidungsstücks bezeichnen. Die Formulierung kann bewusst sowohl Schutz als auch einen ehelichen Anspruch anklingen lassen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ein Verwandtenlöser“; gemeint ist ein Angehöriger, der die anerkannte Aufgabe hatte, zugunsten eines Verwandten einzutreten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי אָתּ
  choice: Wer bist du?
  rationale: Die direkte Frage wird ohne erklärende Erweiterung natürlich und genau wiedergegeben.
- source_word: אָנֹכִי רוּת
  choice: Ich bin Rut
  rationale: Der hebräische Nominalsatz wird im Deutschen idiomatisch mit „bin“ wiedergegeben; der Name folgt der üblichen deutschen Form „Rut“.
- source_word: אֲמָתֶךָ / אֲמָתְךָ
  choice: deine Dienerin
  rationale: אמה bezeichnet eine weibliche Dienerin oder Sklavin. „Dienerin“ bewahrt Ruts demütige Selbstbezeichnung, ohne das heute altertümliche „Magd“ zu verwenden; die Wiederholung bleibt erhalten.
- source_word: וּפָרַשְׂתָּ
  choice: Breite … aus
  rationale: פרשׂ bezeichnet hier das Ausbreiten oder Ausstrecken über jemanden. Die deutsche Verbklammer ist mit „Flügel“ natürlich.
- source_word: כְנָפֶךָ
  choice: deinen Flügel
  rationale: כנף bedeutet wörtlich „Flügel“, kann aber auch den Rand beziehungsweise Saum eines Gewandes bezeichnen. Der Haupttext erhält das Bild und damit die mögliche Doppelbedeutung von Schutz und ehelichem Anspruch; die Gewandbedeutung steht in der Fußnote.
- source_word: עַל
  choice: über
  rationale: „Über“ gibt die räumliche und schützende Vorstellung dieser Konstruktion in heutigem Deutsch natürlich wieder.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet die Begründung für Ruts Bitte ein. „Denn“ ist prägnant, würdig und im Dialog gut verständlich.
- source_word: גֹאֵל
  choice: ein Löser
  rationale: גֹאֵל bezeichnet einen Angehörigen mit einer rechtlich-familiären Einlösungspflicht. „Löser“ bewahrt den Schlüsselbegriff, ohne seine vielfältigen rechtlichen und theologischen Bezüge im Haupttext auf eine Erklärung zu verengen; die Verwandtschaftsrolle wird in der Fußnote erläutert.
theological_decisions:
- issue: Bildgehalt von „deinem Flügel“ in Ruts Bitte
  choice: Das konkrete Bild „deinen Flügel“ bleibt im Haupttext stehen; die mögliche Anspielung auf den Gewandsaum und eine eheliche Verbindung wird nicht aufgelöst.
  alternative: „Breite den Saum deines Gewandes über deine Dienerin“
  rationale: 'Das Hebräische kann bewusst zwei Bedeutungsebenen verbinden: den Gewandsaum in der unmittelbaren Szene und das Bild schützender Flügel. Die wörtliche Bildsprache bewahrt diese literarische und theologische Spannung.'
- issue: Wiedergabe von גֹאֵל
  choice: Im Haupttext steht „ein Löser“; die verwandtschaftsrechtliche Bedeutung wird in einer Fußnote erklärt.
  alternative: „ein Verwandtenlöser“ oder „ein Familienerlöser“
  rationale: Der hebräische Ausdruck umfasst rechtliche, familiäre und wiederherstellende Aufgaben. „Löser“ hält den zentralen Begriff offen, während die Fußnote den für das Rutbuch wesentlichen Familienbezug verständlich macht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Dienerin“ vermeidet das altertümliche „Magd“. „Löser“ ist als knapper rechtlich-theologischer Schlüsselbegriff bewusst beibehalten und wird für heutige Leser in der Fußnote erläutert. Die direkte Rede bleibt schlicht und natürlich.
