base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/016.yaml
  text: When she came to her mother-in-law[a], she said, “Who are you, my daughter?” Then she told her all that the man had done for her.
translation:
  language: de
  text: 'Als sie zu ihrer Schwiegermutter kam, fragte diese: »Wer bist du, meine Tochter?«[a] Da erzählte sie ihr alles, was der Mann für sie getan hatte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: »Wie ist es dir ergangen, meine Tochter?« Wörtlich lautet die hebräische Frage: »Wer bist du, meine Tochter?« Möglicherweise fragt Noomi damit nach Ruts neuer Stellung oder nach dem Ausgang ihrer Begegnung.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתָּבוֹא
  choice: Als sie … kam
  rationale: Das Wayyiqtol führt die Erzählung fort; die temporale Wiedergabe verbindet Ruths Ankunft im Deutschen natürlich mit Noomis anschließender Frage.
- source_word: אֶל חֲמוֹתָהּ
  choice: zu ihrer Schwiegermutter
  rationale: חֲמוֹת bezeichnet spezifisch die Schwiegermutter; das Suffix bezieht sich auf Rut.
- source_word: וַתֹּאמֶר
  choice: fragte diese
  rationale: Das Verb אמר bedeutet wörtlich »sagen«, leitet hier aber eine Frage ein. »fragte« ist im Deutschen idiomatisch; »diese« macht Noomi als Sprecherin eindeutig.
- source_word: מִי אַתְּ
  choice: Wer bist du
  rationale: Bewahrt den wörtlichen und auffälligen Sinn des Hebräischen, ohne die mögliche Frage nach Ruts neuer Stellung oder dem Ausgang der Begegnung im Haupttext festzulegen.
- source_word: בִּתִּי
  choice: meine Tochter
  rationale: Erhält die wörtliche, herzliche familiäre Anrede Noomis an Rut.
- source_word: וַתַּגֶּד לָהּ
  choice: Da erzählte sie ihr
  rationale: נגד im Hifil bedeutet mitteilen oder erzählen; »Da« gibt die folgende Handlung im Erzählfluss natürlich wieder.
- source_word: אֵת כָּל אֲשֶׁר
  choice: alles, was
  rationale: Natürliche und vollständige deutsche Entsprechung der Konstruktion.
- source_word: עָשָׂה לָהּ הָאִישׁ
  choice: was der Mann für sie getan hatte
  rationale: עשה mit ל bezeichnet hier ein Handeln zugunsten Ruts. Das Plusquamperfekt ordnet dieses Handeln vor ihrem Bericht ein; »der Mann« bewahrt die Benennung des hebräischen Textes.
theological_decisions:
- issue: Bedeutung von Noomis Frage מִי אַתְּ
  choice: Die wörtliche Frage »Wer bist du?« bleibt im Haupttext erhalten.
  alternative: »Wie ist es dir ergangen?« oder »Wie steht es nun um dich?«
  rationale: Der Kontext kann eine Frage nach dem Ausgang der Begegnung oder nach Ruts verändertem Status nahelegen, doch der hebräische Wortlaut legt diese Deutung nicht eindeutig fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der ungewöhnliche hebräische Wortlaut der Frage bleibt bewusst stehen; die kontextuelle Deutung wird in der Fußnote angeboten.
