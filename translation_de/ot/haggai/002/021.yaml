id: HAG.2.21
reference: Haggai 2:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֱמֹ֕ר אֶל זְרֻבָּבֶ֥ל פַּֽחַת יְהוּדָ֖ה לֵ/אמֹ֑ר אֲנִ֣י מַרְעִ֔ישׁ אֶת הַ/שָּׁמַ֖יִם וְ/אֶת הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/021.yaml
  text: 'Speak to Zerubbabel[a], governor of Judah, saying: I am shaking the heavens and the earth.'
translation:
  language: de
  text: 'Sprich zu Serubbabel, dem Statthalter von Juda: »Ich erschüttere[a] den Himmel und die Erde.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ich werde den Himmel und die Erde erschüttern.« Das hebräische Partizip kann hier gegenwärtig oder futurisch verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר
  choice: Sprich
  rationale: Der Imperativ von אמר leitet den prophetischen Auftrag ein. „Sprich zu“ ist im Deutschen natürlich und bewahrt die Befehlsform.
- source_word: זְרֻבָּבֶל
  choice: Serubbabel
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: פַּחַת יְהוּדָה
  choice: dem Statthalter von Juda
  rationale: פֶּחָה bezeichnet den Verwalter einer Provinz unter imperialer Oberhoheit. „Statthalter“ ist dafür im Deutschen präzise und geläufig.
- source_word: לֵאמֹר
  choice: Doppelpunkt mit direkter Rede
  rationale: Der quotative Infinitiv wird idiomatisch durch die Einleitung der direkten Rede wiedergegeben; ein zusätzliches „und sage“ wäre im Deutschen unnötig schwerfällig.
- source_word: אֲנִי
  choice: Ich
  rationale: Das ausdrücklich gesetzte Pronomen bleibt erhalten und trägt den Nachdruck der göttlichen Erklärung.
- source_word: מַרְעִישׁ
  choice: erschüttere
  rationale: Das Hifil-Partizip von רעשׁ bezeichnet das Verursachen eines Bebens oder Erschütterns. Das Präsens bewahrt die partizipiale Aussage, ohne eine zeitliche Deutung festzuschreiben; die mögliche futurische Wiedergabe wird in der Fußnote genannt.
- source_word: הַשָּׁמַיִם
  choice: den Himmel
  rationale: Obwohl das Hebräische formal pluralisch ist, lautet die natürliche deutsche kosmische Paarformel „Himmel und Erde“. „Den Himmel“ bewahrt den umfassenden kosmischen Sinn.
- source_word: הָאָרֶץ
  choice: die Erde
  rationale: In der Verbindung mit dem Himmel ist der kosmische Sinn „Erde“ vorrangig gegenüber dem örtlich begrenzten „Land“.
theological_decisions:
- issue: Reichweite des Bildes vom Erschüttern
  choice: Die umfassende Formulierung „Himmel und Erde“ bleibt als kosmisches Bild erhalten.
  alternative: Eine Beschränkung auf politische Umwälzungen unter den Völkern.
  rationale: Der unmittelbare Wortlaut umfasst Himmel und Erde, während die folgenden Verse das Bild geschichtlich und politisch entfalten. Die Übersetzung verengt die Aussage daher nicht.
- issue: Zeitbezug des hebräischen Partizips מַרְעִישׁ
  choice: Präsentische Wiedergabe „Ich erschüttere“ mit futurischer Alternative in der Fußnote.
  alternative: „Ich werde den Himmel und die Erde erschüttern“ oder „Ich bin im Begriff, … zu erschüttern“.
  rationale: Das Partizip kann eine gegenwärtige beziehungsweise als einsetzend dargestellte Handlung oder im prophetischen Zusammenhang eine bevorstehende Handlung ausdrücken. Der Haupttext wahrt die Formnähe; die Fußnote erhält die echte zeitliche Mehrdeutigkeit.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Rede wird mit einem Doppelpunkt knapp und natürlich eingeleitet. Die feste deutsche Paarformel „Himmel und Erde“ vermeidet das unnatürlich-archaische „die Himmel“, ohne den kosmischen Umfang zu mindern.
