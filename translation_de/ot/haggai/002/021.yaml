  source_fidelity: Der Imperativ „Sprich“ gibt אֱמֹר treffend wieder. „Serubbabel, dem Statthalter von Juda“ entspricht זְרֻבָּבֶל פַּחַת יְהוּדָה; „Statthalter“ ist für den perserzeitlichen Provinzverwalter sachgerecht. Die direkte Rede bildet לֵאמֹר idiomatisch ab. „Ich erschüttere den Himmel und die Erde“ wahrt das explizite אֲנִי sowie die kosmische Paarformel und lässt den aspektuell-zeitlichen Spielraum des Partizips מַרְעִישׁ offen.
  naturalness: Die Formulierung ist modernes, würdiges und flüssiges Standarddeutsch. „Himmel und Erde“ ist die natürliche deutsche Wiedergabe der hebräischen kosmischen Formel; die Singularform „Himmel“ ist hierbei idiomatisch und keine inhaltliche Einengung.
  terminology: Personenname und Amtsbezeichnung sind etabliert und angemessen. „Erschüttern“ trifft die verursachende Bedeutung des Hifil von רעשׁ. Die Fußnote benennt die legitime futurische Lesemöglichkeit, ohne sie im Haupttext vorzuziehen.
