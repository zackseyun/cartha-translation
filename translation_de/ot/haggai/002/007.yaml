  text: וְ/הִרְעַשְׁתִּי֙ אֶת כָּל הַ/גּוֹיִ֔ם וּ/בָ֖אוּ חֶמְדַּ֣ת כָּל הַ/גּוֹיִ֑ם וּ/מִלֵּאתִ֞י אֶת הַ/בַּ֤יִת הַ/זֶּה֙ כָּב֔וֹד אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/007.yaml
  text: And I will shake all the nations[a], and the treasures of all the nations will come, and I will fill this house with glory, says Yahweh of Armies.
translation:
  language: de
  text: Und ich werde alle Nationen erschüttern, und die Kostbarkeiten aller Nationen[a] werden kommen. Und ich werde dieses Haus mit Herrlichkeit erfüllen, spricht Jahwe, der Herr der Heere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder in traditioneller Wiedergabe: „Der Ersehnte aller Nationen wird kommen.“ Das Hebräische kann auch „die begehrenswerten Dinge“ oder „die Schätze“ der Nationen bedeuten; das Verb steht im Plural und spricht daher eher für einen kollektiven Sinn.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִרְעַשְׁתִּי
  choice: Und ich werde … erschüttern
  rationale: Der Hifil von רעשׁ bezeichnet das Verursachen eines Erbebens oder Erzitterns. „Erschüttern“ gibt die aktive göttliche Einwirkung natürlich und ohne unnötige Verstärkung wieder.
- source_word: כָּל־הַגּוֹיִם
  choice: alle Nationen
  rationale: גּוֹיִם bezeichnet hier umfassend die Nationen; „Nationen“ vermeidet die theologisch stärker vorgeprägte Wiedergabe „Heiden“.
- source_word: וּבָאוּ
  choice: werden kommen
  rationale: Das Verb steht im Plural und wird in der prophetischen Folge angemessen mit deutschem Futur wiedergegeben.
- source_word: חֶמְדַּת כָּל־הַגּוֹיִם
  choice: die Kostbarkeiten aller Nationen
  rationale: חֶמְדַּת ist formal Singular, kann aber kollektiv wertvolle oder begehrenswerte Dinge bezeichnen. Das zugehörige Verb וּבָאוּ steht im Plural und stützt daher eine kollektive, gegenständliche Deutung. „Kostbarkeiten“ bewahrt sowohl den Wert- als auch den Begehrensaspekt.
- source_word: וּמִלֵּאתִי
  choice: Und ich werde … erfüllen
  rationale: Der Piel von מלא bedeutet „füllen“ beziehungsweise „erfüllen“. Mit „mit Herrlichkeit erfüllen“ ergibt sich eine natürliche deutsche Konstruktion.
- source_word: הַבַּיִת הַזֶּה
  choice: dieses Haus
  rationale: בַּיִת bedeutet wörtlich „Haus“. Gemeint ist im Kontext der Tempel; „dieses Haus“ bewahrt jedoch die Ausdrucksweise des Propheten.
- source_word: כָּבוֹד
  choice: Herrlichkeit
  rationale: כָּבוֹד bezeichnet in diesem Tempelkontext Gottes majestätische Herrlichkeit; „Herrlichkeit“ erhält diese theologische und bildhafte Resonanz.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heere
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; צְבָאוֹת wird transparent mit „Heere“ übersetzt. So bleibt der militärische beziehungsweise kosmische Gehalt des Titels erhalten, ohne das heute wenig verständliche „Heerscharen“ zu verwenden.
theological_decisions:
- issue: Bedeutung von חֶמְדַּת כָּל־הַגּוֹיִם
  choice: 'kollektiv-gegenständlich: „die Kostbarkeiten aller Nationen“'
  alternative: 'personal beziehungsweise traditionell messianisch: „der Ersehnte aller Nationen“; gegenständlich: „die begehrenswerten Dinge aller Nationen“'
  rationale: Das hebräische Substantiv kann Begehrenswertes oder Kostbares bezeichnen, und das Verb „werden kommen“ steht im Plural. Dies spricht deutlich für einen kollektiven Sinn, ohne die historisch bedeutsame personale Deutung als grammatisch völlig unmöglich zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Nationen“ ist allgemein verständlich und vermeidet die konfessionell belastete Bezeichnung „Heiden“. Die wiederholte Satzverknüpfung mit „Und“ bewahrt den prophetischen Rhythmus des Hebräischen.
