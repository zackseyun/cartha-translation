base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/016.yaml
  text: When one came to a heap of twenty measures[a], there were only ten; when one came to the wine vat to draw fifty measures, there were only twenty.
translation:
  language: de
  text: Wenn man zu einem Haufen von zwanzig Maß kam, waren es nur zehn; wenn man zur Weinkelter kam, um fünfzig Maß[a] zu schöpfen, waren es nur zwanzig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch „fünfzig Pura“; Pura bezeichnet ein Flüssigkeitsmaß oder ein Gefäß; die genaue Größe ist unbekannt.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִהְיוֹתָם בָּא
  choice: wenn jemand … kam
  rationale: Die schwerfällige hebräische Konstruktion leitet im Zusammenhang eine wiederholte Situation der vorausgehenden Zeit ein. Die generische Wiedergabe ist im Deutschen natürlich und fügt keinen eigenständigen Einleitungssatz hinzu.
- source_word: עֲרֵמַת עֶשְׂרִים
  choice: ein Getreidehaufen, der zwanzig Maß ergeben sollte
  rationale: עֲרֵמָה bezeichnet einen Haufen aufgeschütteten Ernteguts. Da keine Maßeinheit genannt wird, macht „Maß“ die implizite Mengenangabe verständlich; „ergeben sollte“ verdeutlicht, dass zwanzig die erwartete Menge war.
- source_word: וְהָיְתָה עֲשָׂרָה
  choice: waren es nur zehn
  rationale: Die Formulierung gibt den unerwarteten Fehlbetrag knapp und idiomatisch wieder. „Nur“ ist im Kontrast zwischen erwarteter und tatsächlicher Menge begründet.
- source_word: הַיֶּקֶב
  choice: Weinkelter
  rationale: יֶקֶב bezeichnet hier die Kelter beziehungsweise den zugehörigen Auffangbehälter für Wein. „Weinkelter“ ist im biblisch-landwirtschaftlichen Zusammenhang verständlich und präzise genug.
- source_word: לַחְשֹׂף
  choice: zu schöpfen
  rationale: Das Verb bezeichnet hier das Entnehmen einer Flüssigkeit aus dem Kelterbehälter. „Schöpfen“ ist dafür im Deutschen anschaulich und idiomatisch.
- source_word: חֲמִשִּׁים פּוּרָה
  choice: fünfzig Maß[a]
  rationale: פּוּרָה ist eine seltene Bezeichnung für ein Flüssigkeitsmaß oder ein entsprechendes Gefäß, deren genaue Größe unsicher ist. „Maß“ erhält im Haupttext die quantitative Aussage, während die Fußnote die lexikalische Unsicherheit offenlegt.
- source_word: וְהָיְתָה עֶשְׂרִים
  choice: waren es nur zwanzig
  rationale: Wie im ersten Beispiel wird die tatsächlich vorhandene, deutlich geringere Menge natürlich wiedergegeben.
