  source_fidelity: Die Übersetzung gibt die dreifache vergleichend-urteilende Struktur von כֵּן, die Bezeichnungen „dieses Volk“ und „diese Nation“, das Urteil „vor mir“, die Gesamtheit des Tuns, das Darbringen „dort“ und den kultischen Status „unrein“ zutreffend wieder. Allerdings bleibt וַיֹּאמֶר („und sagte“) im Einleitungssatz unberücksichtigt.
  naturalness: „So steht es um“ ist modernes, würdiges Deutsch und bildet die wiederholte Schlussfolgerung gut ab. Die Ergänzung „und sagte“ ist trotz der Nähe zu „antwortete“ im Deutschen in prophetischer Erzählprosa natürlich und wahrt die hebräische Doppelung.
  terminology: „Jahwe“ gibt den Gottesnamen angemessen wieder. „Unrein“ bewahrt die kultische Reinheitsterminologie. „Nation“ ist für גּוֹי vertretbar und hält die im Ausgangstext vorhandene Unterscheidung zu עַם sichtbar, ohne eine heidnische Bedeutung einzutragen.
