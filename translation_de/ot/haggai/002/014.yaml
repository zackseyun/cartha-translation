base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/014.yaml
  text: Then Haggai answered and said[a], “So is this people, and so is this nation before me,” declares Yahweh, “and so is every work of their hands[b]; and what they offer there is unclean.”
translation:
  language: de
  text: 'Da antwortete Haggai und sagte: „So steht es um dieses Volk[a], und so steht es um diese Nation vor mir“, spricht Jahwe, „und so steht es um alles, was ihre Hände tun; und was sie dort darbringen, ist unrein.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Dieses Volk“ ist im Hebräischen eine auffällige Formulierung, die distanzierend oder tadelnd klingen kann.
    reason: cultural_note
lexical_decisions:
- source_word: כֵּן
  choice: so steht es um
  rationale: Die dreifache Wiederholung gibt die vergleichende Folgerung aus dem priesterlichen Reinheitsbeispiel der vorangehenden Verse wieder und klingt zugleich natürlich im modernen Deutschen.
- source_word: הָעָם הַזֶּה
  choice: dieses Volk
  rationale: Bewahrt den kollektiven Singular sowie den im Hebräischen auffällig distanzierenden, möglicherweise tadelnden Ausdruck.
- source_word: הַגּוֹי הַזֶּה
  choice: diese Nation
  rationale: Unterscheidet גּוֹי von dem unmittelbar vorausgehenden עַם, ohne fälschlich ein nichtjüdisches Volk anzunehmen.
- source_word: לְפָנַי
  choice: vor mir
  rationale: Gibt die räumlich-relationale Wendung knapp wieder und wahrt den Gedanken der Beurteilung in Gottes Gegenwart.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Eine geläufige, feierliche deutsche Wiedergabe der prophetischen Botenformel.
- source_word: כָּל מַעֲשֵׂה יְדֵיהֶם
  choice: alles, was ihre Hände tun
  rationale: Überträgt das hebräische Bild verständlich und bewahrt den umfassenden Sinn von כָּל.
- source_word: וַאֲשֶׁר יַקְרִיבוּ
  choice: Auch das, was sie dort darbringen
  rationale: קרב im Hifil bezeichnet im kultischen Zusammenhang das Heranbringen beziehungsweise Darbringen einer Gabe; die Formulierung bleibt offen, ohne den Altar ausdrücklich hinzuzufügen.
- source_word: טָמֵא הוּא
  choice: ist unrein
  rationale: Greift die kultische Reinheitsterminologie der vorangehenden Verse auf und bezeichnet den resultierenden Status.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als solcher wiedergegeben; „Jahwe“ ist die im Deutschen geläufige Form.
- issue: Bezug von „diese Nation“
  choice: die nachexilische Gemeinschaft Judas als Ganzes
  alternative: umliegende fremde Nationen
  rationale: Haggai wendet die priesterliche Reinheitslogik im Kontext auf die angesprochene Gemeinschaft und ihre Werke beziehungsweise Gaben an; „Nation“ bewahrt zugleich die lexikalische Unterscheidung, ohne „heidnisch“ einzutragen.
- issue: Umfang der Unreinheit
  choice: Die Unreinheit betrifft sowohl ihre Tätigkeiten als auch das dort Dargebrachte
  alternative: Nur die Opfergaben sind unrein
  rationale: Die dreifache כֵּן-Konstruktion bezieht das Urteil ausdrücklich auf das Volk, auf das Werk seiner Hände und anschließend auf das Dargebrachte.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Wendung „so steht es um“ erhält die rhetorische Struktur des Hebräischen, ohne im Deutschen steif zu wirken. „Volk“ und „Nation“ bleiben zur Wahrung der hebräischen Wortunterscheidung nebeneinander stehen.
