id: HAG.2.8
reference: Haggai 2:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לִ֥/י הַ/כֶּ֖סֶף וְ/לִ֣/י הַ/זָּהָ֑ב נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/008.yaml
  text: The silver is mine[a], and the gold is mine[b], declares Yahweh of Armies.
translation:
  language: de
  text: Mir gehört das Silber, und mir gehört das Gold, spricht Jahwe der Heerscharen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִי
  choice: mir gehört
  rationale: Die Präposition לְ mit dem Suffix der 1. Person Singular bezeichnet hier Besitz. Die Voranstellung von „mir“ bewahrt die Betonung des hebräischen לִי.
- source_word: הַכֶּסֶף
  choice: das Silber
  rationale: Im Parallelismus mit „dem Gold“ ist der konkrete Edelstoff gemeint, nicht Geld.
- source_word: וְלִי
  choice: und mir gehört
  rationale: Die Wiederholung der Besitzangabe wird beibehalten, weil sie den uneingeschränkten Anspruch Jahwes auf beide Edelmetalle betont.
- source_word: הַזָּהָב
  choice: das Gold
  rationale: Die direkte Wiedergabe bezeichnet den Edelstoff und erhält den Parallelismus mit „das Silber“.
- source_word: נְאֻם
  choice: spricht
  rationale: In der prophetischen Botenformel ist „spricht“ eine natürliche, würdevolle deutsche Wiedergabe mit dem Gewicht eines göttlichen Ausspruchs.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen stehende Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: צְבָאוֹת
  choice: der Heerscharen
  rationale: „Heerscharen“ gibt den umfassenden Plural צְבָאוֹת idiomatisch und in Verbindung mit dem Gottesnamen im Deutschen würdevoll wieder; das Wort kann irdische und himmlische Heere umfassen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen ausdrücklich. „Jahwe“ wahrt diese Unterscheidung gegenüber einem bloßen Titel.
- issue: Wiedergabe des Titels יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  alternative: Jahwe der Heere
  rationale: „Heerscharen“ lässt die mögliche Weite von צְבָאוֹת bestehen und vermeidet eine vorschnelle Beschränkung auf menschliche oder ausschließlich himmlische Armeen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der ausgewogene Parallelismus und die zweimalige betonte Besitzangabe des Hebräischen bleiben erhalten.
