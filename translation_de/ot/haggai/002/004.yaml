  text: וְ/עַתָּ֣ה חֲזַ֣ק זְרֻבָּבֶ֣ל נְאֻם יְהוָ֡ה וַ/חֲזַ֣ק יְהוֹשֻׁ֣עַ בֶּן יְהוֹצָדָק֩ הַ/כֹּהֵ֨ן הַ/גָּד֜וֹל וַ/חֲזַ֨ק כָּל עַ֥ם הָ/אָ֛רֶץ נְאֻם יְהוָ֖ה וַֽ/עֲשׂ֑וּ כִּֽי אֲנִ֣י אִתְּ/כֶ֔ם נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/004.yaml
  text: But now[a], be strong, Zerubbabel, declares Yahweh, and be strong, Joshua son of Jehozadak, the high priest, and be strong, all the people of the land, declares Yahweh, and work, for I am with you, declares Yahweh of Armies.
translation:
  language: de
  text: 'Doch nun: Sei stark, Serubbabel – spricht Jahwe. Sei stark, Josua, Sohn Jozadaks, der Hohepriester. Sei stark, ganzes Volk des Landes – spricht Jahwe –, und macht euch ans Werk! Denn ich bin mit euch – spricht Jahwe der Heerscharen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell auch: »der HERR Zebaoth« oder »der HERR der Heerscharen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Doch nun
  rationale: Die Wendung leitet nach der zuvor geschilderten Entmutigung zu einer gegenläufigen Ermutigung über. »Doch nun« gibt diesen kontextuellen Gegensatz natürlich wieder.
- source_word: חֲזַק / וַחֲזַק / וַחֲזַק
  choice: sei stark
  rationale: Die dreifache Aufforderung wird mit derselben Formulierung wiedergegeben, sodass die rhetorische Wiederholung erhalten bleibt. Beim kollektiv angeredeten Volk bleibt entsprechend dem hebräischen Singular »sei stark« stehen.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Die feste prophetische Formel wird in einem würdevollen und im Deutschen vertrauten Stil wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בֶּן
  choice: Sohn
  rationale: Die genealogische Zuordnung wird direkt und idiomatisch übersetzt.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: Hohepriester
  rationale: Dies ist die etablierte deutsche Bezeichnung für das genannte priesterliche Amt.
- source_word: כָּל עַם הָאָרֶץ
  choice: du ganzes Volk des Landes
  rationale: הָאָרֶץ bezeichnet hier im nachexilischen Zusammenhang das Land und seine Gemeinschaft, nicht die gesamte Erde. Die Anrede mit »du« bewahrt den auffälligen kollektiven Singular.
- source_word: וַעֲשׂוּ
  choice: und macht euch ans Werk
  rationale: Im unmittelbaren Zusammenhang fordert das Verb zur konkreten Arbeit am Tempel auf. Die Formulierung ist klar und handlungsbezogen, ohne das Objekt ausdrücklich in den Text einzutragen.
- source_word: כִּי אֲנִי אִתְּכֶם
  choice: Denn ich bin mit euch
  rationale: »Denn« kennzeichnet Gottes Gegenwart als Begründung der vorausgehenden Aufforderung.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Der Gottesname bleibt als Name erhalten; צְבָאוֹת wird mit dem im Deutschen verständlichen und würdevollen »Heerscharen« übersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. Die Umschrift bewahrt ihn als Namen, während die traditionelle Ersetzung durch »der HERR« nicht stillschweigend in den Haupttext übernommen wird.
- issue: Wiedergabe des Titels יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  alternative: der HERR Zebaoth; der HERR der Heerscharen
  rationale: Die gewählte Fassung unterscheidet den Eigennamen vom Titelbestandteil und macht צְבָאוֹת semantisch sichtbar. Die vertrauten traditionellen Formen werden in der Fußnote genannt.
- issue: Numerus bei der Aufforderung an das Volk
  choice: Sei stark, du ganzes Volk des Landes
  alternative: Seid stark, ihr alle vom Volk des Landes
  rationale: Der hebräische Imperativ steht trotz der kollektiven Anrede im Singular. Die Übersetzung erhält diese markierte Form, während der folgende plurale Imperativ »macht« die grammatische Spannung des Ausgangstextes sichtbar lässt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischem Nachdruck. Die dreifache Aufforderung wird parallel gestaltet; Ausrufezeichen verdeutlichen ihren exhortativen Charakter. Der kollektive Singular beim Volk sowie der anschließende Plural werden bewusst erhalten.
