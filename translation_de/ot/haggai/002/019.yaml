  text: הַ/ע֤וֹד הַ/זֶּ֨רַע֙ בַּ/מְּגוּרָ֔ה וְ/עַד הַ/גֶּ֨פֶן וְ/הַ/תְּאֵנָ֧ה וְ/הָ/רִמּ֛וֹן וְ/עֵ֥ץ הַ/זַּ֖יִת לֹ֣א נָשָׂ֑א מִן הַ/יּ֥וֹם הַ/זֶּ֖ה אֲבָרֵֽךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/019.yaml
  text: Is the seed still in the storehouse? Even the vine[a], the fig tree, the pomegranate, and the olive tree have not borne fruit. From this day on I will bless you.
translation:
  language: de
  text: Ist das Saatgut noch im Speicher? Und auch der Weinstock, der Feigenbaum, der Granatapfelbaum und der Olivenbaum haben noch keinen Ertrag gebracht. Von diesem Tag an werde ich euch[a] segnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „werde ich segnen“; wen oder was Gott segnet, bleibt im Hebräischen unausgesprochen. „Euch“ ist aus dem Zusammenhang ergänzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעֹוד
  choice: noch
  rationale: Im Fragesatz bezeichnet עוֹד das Fortbestehen eines Zustands bis zum gegenwärtigen Zeitpunkt. Das deutsche „noch“ gibt dies natürlich und knapp wieder.
- source_word: הַזֶּרַע
  choice: das Saatgut
  rationale: זֶרַע bezeichnet hier im landwirtschaftlichen Zusammenhang das zum Aussäen bestimmte Korn. „Saatgut“ ist präziser als das im Deutschen mehrdeutige „Samen“, ohne die Aussage unnötig einzuengen.
- source_word: בַּמְּגוּרָה
  choice: im Speicher
  rationale: מְגוּרָה bezeichnet einen Aufbewahrungsort für Getreide oder andere Vorräte. „Speicher“ ist eine geläufige, sachlich passende Entsprechung.
- source_word: וְעַד
  choice: Und auch
  rationale: עַד erweitert hier den Blick vom Saatgut auf die nachfolgend genannten Nutzpflanzen. „Und auch“ bildet diesen anschließenden, ausweitenden Gedankengang in natürlichem Deutsch ab; das zusätzliche „noch“ beim Prädikat wahrt den zeitlichen Bezug.
- source_word: הַגֶּפֶן וְהַתְּאֵנָה וְהָרִמּוֹן וְעֵץ הַזַּיִת
  choice: der Weinstock, der Feigenbaum, der Granatapfelbaum und der Olivenbaum
  rationale: Dies sind die üblichen modernen deutschen Bezeichnungen der genannten Kulturpflanzen. „Weinstock“ macht die Weinrebe im landwirtschaftlichen Zusammenhang eindeutig.
- source_word: לֹא נָשָׂא
  choice: haben noch keinen Ertrag gebracht
  rationale: נָשָׂא bedeutet wörtlich „tragen“; bei Nutzpflanzen ist „Ertrag bringen“ eine natürliche deutsche Wiedergabe. Die Pluralform entspricht der Aufzählung, während das Hebräische ein singularisches Sammelprädikat verwendet.
- source_word: מִן הַיּוֹם הַזֶּה
  choice: Von diesem Tag an
  rationale: Die Wendung markiert einen mit dem genannten Tag beginnenden Wendepunkt. „Von diesem Tag an“ gibt ihre prospektive Bedeutung idiomatisch wieder.
- source_word: אֲבָרֵךְ
  choice: werde ich euch segnen
  rationale: Der Piel-Imperfekt der ersten Person Singular drückt hier eine zukünftige Zusage aus. Das im Hebräischen nicht genannte Objekt wird aus dem Kontext als die angesprochene Gemeinschaft erschlossen und für verständliches Deutsch mit „euch“ ergänzt.
theological_decisions:
- issue: Nicht ausdrücklich genanntes Objekt der Zusage אֲבָרֵךְ
  choice: Das kontextuell vorausgesetzte „euch“ wird im Haupttext ergänzt und durch eine Fußnote kenntlich gemacht.
  alternative: „Von diesem Tag an werde ich segnen“, ohne ein Objekt zu nennen.
  rationale: Der hebräische Text lässt das Objekt grammatisch unausgesprochen. Im Zusammenhang richtet sich die Zusage an die angesprochene Gemeinschaft; „euch“ macht diesen Bezug im Deutschen verständlich, ohne den Zusatz als ausdrücklich im Ausgangstext vorhanden auszugeben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer landwirtschaftlicher Bildsprache. Die rhetorische Frage und der Umschlag zur abschließenden Segenszusage bleiben erhalten; die im Hebräischen bestehende Offenheit beim Objekt von „segnen“ wird nicht verschwiegen.
