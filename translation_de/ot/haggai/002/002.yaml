  text: אֱמָר נָ֗א אֶל זְרֻבָּבֶ֤ל בֶּן שַׁלְתִּיאֵל֙ פַּחַ֣ת יְהוּדָ֔ה וְ/אֶל יְהוֹשֻׁ֥עַ בֶּן יְהוֹצָדָ֖ק הַ/כֹּהֵ֣ן הַ/גָּד֑וֹל וְ/אֶל שְׁאֵרִ֥ית הָ/עָ֖ם לֵ/אמֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/002.yaml
  text: Speak now to Zerubbabel son of Shealtiel[a], governor of Judah, and to Joshua son of Jehozadak, the high priest, and to the remnant of the people, saying[b],
translation:
  language: de
  text: 'Sprich nun zu Serubbabel, dem Sohn Schealtiëls, dem Statthalter von Juda, zu Josua, dem Sohn Jozadaks, dem Hohepriester, und zum Überrest des Volkes[a] und sage:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum Rest des Volkes“ beziehungsweise „zu den Übriggebliebenen des Volkes“. Das hebräische Wort bezeichnet die Verbliebenen und kann zugleich den prophetischen Gedanken eines „Überrests“ anklingen lassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמָר נָא
  choice: Sprich nun
  rationale: Der Imperativ fordert zum Reden auf; נָא verleiht der Aufforderung hier Nachdruck bzw. Unmittelbarkeit. „Nun“ passt in diesem prophetischen Auftrag besser als das höfliche „bitte“.
- source_word: זְרֻבָּבֶל בֶּן שַׁלְתִּיאֵל
  choice: Serubbabel, dem Sohn Schealtiëls
  rationale: Die Namen werden in ihren im Deutschen geläufigen, am Hebräischen orientierten Formen wiedergegeben; die Apposition mit Dativ entspricht der deutschen Satzkonstruktion nach „zu“.
- source_word: פַּחַת יְהוּדָה
  choice: dem Statthalter von Juda
  rationale: פֶּחָה bezeichnet hier den perserzeitlichen Provinzstatthalter. „Statthalter“ ist im Deutschen präzise und verständlich.
- source_word: יְהוֹשֻׁעַ בֶּן יְהוֹצָדָק
  choice: Josua, dem Sohn Jozadaks
  rationale: יְהוֹשֻׁעַ wird als „Josua“ wiedergegeben und damit von der kürzeren hebräischen Namensform יֵשׁוּעַ unterschieden. „Jozadak“ ist die geläufige deutsche Form von יְהוֹצָדָק.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: dem Hohepriester
  rationale: „Hohepriester“ ist die etablierte deutsche Bezeichnung für dieses Amt und gibt die Verbindung aus כֹּהֵן und גָּדוֹל sachgerecht wieder.
- source_word: שְׁאֵרִית הָעָם
  choice: zum Rest des Volkes
  rationale: שְׁאֵרִית bezeichnet das, was von einer Gemeinschaft übrig geblieben ist. „Rest des Volkes“ ist natürliches Deutsch und lässt den im prophetischen Sprachgebrauch möglichen theologischen Nachklang offen.
- source_word: לֵאמֹר
  choice: 'und sage:'
  rationale: Der hebräische Infinitiv leitet den im nächsten Vers folgenden Wortlaut ein. Im Deutschen stellt „und sage:“ die syntaktische Verbindung klar und idiomatisch her.
theological_decisions:
- issue: Möglicher theologischer Nachklang von שְׁאֵרִית als prophetischem „Rest“-Begriff
  choice: Rest des Volkes
  alternative: Überrest des Volkes; die Übriggebliebenen des Volkes
  rationale: „Rest“ bewahrt sowohl die konkrete Bedeutung der verbliebenen Gemeinschaft als auch eine mögliche prophetisch-theologische Resonanz, ohne diese zu einer festgelegten Lehrdeutung auszubauen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholten Appositionen folgen der feierlichen Aufzählung des Hebräischen, während „und sage:“ den Übergang zur folgenden direkten Rede natürlich markiert.
