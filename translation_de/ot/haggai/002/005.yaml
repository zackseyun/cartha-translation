base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/005.yaml
  text: As for the promise that I made with you when you came out of Egypt[a], and my Spirit is standing in your midst[b]; do not fear.
translation:
  language: de
  text: Es gilt die Zusage, die ich euch gab, als ihr aus Ägypten zogt[a]. Und mein Geist steht in eurer Mitte[b]. Fürchtet euch nicht!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „das Wort, das ich mit euch schnitt“; „schneiden“ gehört hier zur Sprache des Bundesschlusses.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Mein Geist bleibt unter euch.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת הַדָּבָר
  choice: Es gilt die Zusage
  rationale: דָּבָר bedeutet grundsätzlich „Wort“ oder „Sache“, bezeichnet hier im Zusammenhang mit כרת jedoch Gottes bindende Zusage. „Es gilt“ macht den elliptischen Satzanfang im Deutschen verständlich, ohne den Inhalt als technischen Bundesbegriff festzulegen.
- source_word: אֲשֶׁר כָּרַתִּי אִתְּכֶם
  choice: die ich euch gab
  rationale: כרת („schneiden“) gehört hier zur Sprache des Bundesschlusses. Die natürliche deutsche Wendung „eine Zusage geben“ vermittelt die bindende Verpflichtung, während die wörtliche Bildsprache in der Fußnote erhalten bleibt.
- source_word: בְּצֵאתְכֶם מִמִּצְרַיִם
  choice: als ihr aus Ägypten zogt
  rationale: Die Präposition בְּ mit dem Infinitiv bezeichnet den Zeitpunkt. „Aus Ägypten ziehen“ ist im Deutschen eine natürliche und traditionsverständliche Bezeichnung des Exodus.
- source_word: וְרוּחִי
  choice: Und mein Geist
  rationale: רוּחַ bezeichnet in diesem Zusammenhang Gottes wirksame Gegenwart bei seinem Volk. „Geist“ gibt diesen Sinn wieder; die Großschreibung kennzeichnet den göttlichen Bezug, ohne spätere dogmatische Einzelheiten in den Vers einzutragen.
- source_word: עֹמֶדֶת
  choice: steht
  rationale: Die Wiedergabe bewahrt das konkrete Bild des hebräischen Verbs und lässt durch die Präsensform die fortdauernde Gegenwart erkennen. Das glattere „bleibt“ wird als Alternative in der Fußnote genannt.
- source_word: בְּתוֹכְכֶם
  choice: in eurer Mitte
  rationale: Die Formulierung bezeichnet Gottes Gegenwart inmitten der Gemeinschaft. Sie vermeidet die mögliche individualistische Deutung von „in euch“.
- source_word: אַל תִּירָאוּ
  choice: Fürchtet euch nicht!
  rationale: Dies ist die geläufige, prägnante und würdevolle deutsche Wiedergabe des verneinten Imperativs.
theological_decisions:
- issue: Bedeutung von רוּחִי im Zusammenhang der göttlichen Gegenwart
  choice: mein Geist
  alternative: mein Atem
  rationale: Der Exodus- und Bundeszusammenhang spricht für Gottes wirksame Gegenwart unter seinem Volk. „Geist“ trifft diesen Sinn am besten, ohne die weitere Bedeutungsbreite von רוּחַ grundsätzlich auszuschließen.
- issue: Wie ausdrücklich die Bundessprache in דָּבָר ... כָּרַתִּי wiederzugeben ist
  choice: die Zusage, die ich euch gab
  alternative: das Wort, das ich mit euch als Bund schloss
  rationale: Der hebräische Text verwendet nicht das Substantiv „Bund“, sondern דָּבָר. „Zusage“ vermittelt die bindende, bundesbezogene Bedeutung, ohne den Wortlaut durch einen technischen Begriff zu vereindeutigen.
- issue: Elliptischer Satzanfang mit אֶת הַדָּבָר
  choice: Es gilt die Zusage
  alternative: Was die Zusage betrifft
  rationale: Der hebräische Satzanfang ist syntaktisch knapp und kann rückbezüglich verstanden werden. „Es gilt“ schafft einen verständlichen deutschen Satz, bewahrt aber den Charakter einer weiterhin gültigen göttlichen Verpflichtung; die Fußnote weist auf die wörtlichere Form hin.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze Hauptsätze tragen den ermutigenden Ton. „Zusage“ ist allgemein verständlich und wahrt zugleich die bindende Bundessprache; „steht in eurer Mitte“ erhält das auffällige hebräische Bild.
