base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/003.yaml
  text: Who among you is left who saw this house in its former glory? And how do you see it now? Is it not as nothing in your eyes?[a][b]
translation:
  language: de
  text: Wer von euch ist noch übrig, der dieses Haus[a] in seiner früheren Herrlichkeit[b] gesehen hat? Und wie seht ihr es jetzt? Erscheint es euch nicht wie nichts?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „diesen Tempel“. Im Hebräischen steht wörtlich „dieses Haus“, eine übliche Bezeichnung für den Tempel.
    reason: lexical_alternative
  - marker: b
    text: Oder „in seiner ersten Herrlichkeit“.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי בָכֶם הַנִּשְׁאָר
  choice: Wer von euch ist noch übrig
  rationale: Die Formulierung bewahrt den Sinn des nifalischen Partizips als Angehörige der früheren Generation, die noch übrig sind, ohne ausdrücklich nur auf ihr Überleben einzuengen.
- source_word: אֲשֶׁר רָאָה
  choice: der … gesehen hat
  rationale: Das Perfekt bezeichnet das abgeschlossene Sehen des früheren Tempels; im Deutschen gibt das Perfekt dies natürlich wieder.
- source_word: הַבַּיִת הַזֶּה
  choice: dieses Haus
  rationale: „Haus“ entspricht dem hebräischen Wortlaut und ist hier eine geläufige Bezeichnung für den Tempel; die mögliche Verdeutlichung steht in der Fußnote.
- source_word: בִּכְבוֹדוֹ הָרִאשׁוֹן
  choice: in seiner früheren Herrlichkeit
  rationale: „Frühere“ bringt den zeitlichen Gegensatz zur Gegenwart idiomatisch zum Ausdruck; „Herrlichkeit“ wahrt das Bedeutungsfeld von כָּבוֹד zwischen Pracht, Ehre und Herrlichkeit.
- source_word: וּמָה אַתֶּם רֹאִים אֹתוֹ עַתָּה
  choice: Und wie seht ihr es jetzt?
  rationale: Die Wendung fragt nach der gegenwärtigen Wahrnehmung und Einschätzung des Hauses. Die direkte Formulierung bewahrt den evaluativen Charakter.
- source_word: הֲלוֹא
  choice: Ist es nicht
  rationale: Die deutsche rhetorische Frage gibt die erwartete Zustimmung wieder.
- source_word: כָמֹהוּ כְּאַיִן
  choice: wie nichts
  rationale: Die knappe Vergleichsformulierung erhält die starke Aussage von Bedeutungslosigkeit im Vergleich zur früheren Herrlichkeit, ohne sie weiter auszudeuten.
- source_word: בְּעֵינֵיכֶם
  choice: in euren Augen
  rationale: Die deutsche Wendung bewahrt die hebräische Metapher für Wahrnehmung und Beurteilung.
theological_decisions: []
