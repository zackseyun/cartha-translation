source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר חַגַּ֔י אִם יִגַּ֧ע טְמֵא נֶ֛פֶשׁ בְּ/כָל אֵ֖לֶּה הֲ/יִטְמָ֑א וַ/יַּעֲנ֧וּ הַ/כֹּהֲנִ֛ים וַ/יֹּאמְר֖וּ יִטְמָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/013.yaml
  text: Then Haggai said[a], “If one who is unclean by contact with a dead body touches any of these, does it become unclean?” And the priests answered and said, “It becomes unclean.”
translation:
  language: de
  text: 'Da sagte Haggai: „Wenn jemand, der durch Kontakt mit einer Leiche unrein ist,[a] etwas von alledem berührt, wird es dann unrein?“ Die Priester antworteten: „Es wird unrein.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Wendung bezeichnet rituelle Unreinheit durch Kontakt mit einer Leiche.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר חַגַּי
  choice: Da sagte Haggai
  rationale: Das Waw mit Imperfekt führt die Erzählung fort. „Da sagte“ gibt die zeitliche Folge in natürlichem, würdigem Deutsch wieder.
- source_word: אִם
  choice: Wenn
  rationale: Leitet den den Priestern vorgelegten Bedingungsfall direkt ein.
- source_word: יִגַּע
  choice: berührt
  rationale: Gibt den körperlichen Kontakt im Zusammenhang kultischer Reinheit knapp und genau wieder.
- source_word: טְמֵא נֶפֶשׁ
  choice: jemand, der durch einen Toten unrein geworden ist
  rationale: Die hebräische Wendung bezeichnet im Reinheitsrecht die durch Kontakt mit einem Toten entstandene Unreinheit; eine wörtliche Wiedergabe mit „Seele“ wäre im Deutschen irreführend.
- source_word: בְּכָל אֵלֶּה
  choice: etwas von alledem
  rationale: Verweist auf die zuvor genannten Dinge und bringt den distributiven Sinn der Frage natürlich zum Ausdruck.
- source_word: הֲיִטְמָא
  choice: wird es dann unrein?
  rationale: Die Frage betrifft die Übertragung von Unreinheit auf das Berührte. „Wird ... unrein“ bewahrt den Zustandswechsel.
- source_word: וַיַּעֲנוּ הַכֹּהֲנִים וַיֹּאמְרוּ
  choice: Die Priester antworteten
  rationale: Das deutsche Verb „antworteten“ umfasst die hebräische Doppelwendung „antworteten und sagten“ idiomatisch, ohne ihren kommunikativen Gehalt zu verlieren.
- source_word: יִטְמָא
  choice: Es wird unrein
  rationale: Greift die Formulierung der Frage auf und gibt den priesterlichen Rechtsspruch zur Übertragung der Unreinheit wieder.
theological_decisions:
- issue: Bedeutung der Unreinheit
  choice: Als rituelle Unreinheit infolge des Kontakts mit einem Toten wiedergeben
  alternative: Wörtlich „unrein an einer Person/Seele“ oder allgemein moralisch unrein
  rationale: Der Kontext greift die Reinheitsbestimmungen der Tora auf. טְמֵא נֶפֶשׁ bezeichnet hier Leichenunreinheit und nicht an sich moralische Schuld oder innere Verdorbenheit.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die kultische Kategorie „unrein“ bleibt erhalten; der zugrunde liegende hebräische Ausdruck wird im Haupttext sinngemäß verdeutlicht und in der Fußnote erläutert.
