base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/018.yaml
  text: Set your heart on this from this day onward[a], from the twenty-fourth day of the ninth month, from the day when the temple of Yahweh was founded; consider it.
translation:
  language: de
  text: Nehmt euch dies von diesem Tag an zu Herzen, vom vierundzwanzigsten Tag des neunten Monats an, von dem Tag an, an dem das Fundament des Tempels Jahwes gelegt wurde. Nehmt es euch zu Herzen!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׂימוּ נָא לְבַבְכֶם
  choice: Nehmt euch dies zu Herzen
  rationale: Die deutsche Wendung bewahrt das hebräische Bild des Herzens und gibt die Aufforderung zugleich natürlich wieder. נָא verleiht ihr Nachdruck; dieser wird durch die eindringliche Formulierung und die Wiederholung ausgedrückt, ohne ein unpassend höfliches »bitte« einzufügen.
- source_word: מִן הַיּוֹם הַזֶּה וָמָעְלָה
  choice: von diesem Tag an
  rationale: Dies ist die natürliche deutsche Wiedergabe des hier vorherrschenden zeitlichen Sinnes. Die bildhafte Bedeutung »aufwärts« wird nicht mechanisch übertragen; eine mögliche rückblickende Deutung wird in der Fußnote genannt.
- source_word: מִיּוֹם עֶשְׂרִים וְאַרְבָּעָה לַתְּשִׁיעִי
  choice: vom vierundzwanzigsten Tag des neunten Monats an
  rationale: Die im Hebräischen knapp formulierte Datumsangabe wird im Deutschen vollständig und eindeutig ausgedrückt.
- source_word: אֲשֶׁר יֻסַּד
  choice: an dem das Fundament ... gelegt wurde
  rationale: Das passive Verb יסד bezeichnet das Gründen beziehungsweise Legen eines Fundaments. Bei einem Tempel ist »das Fundament wurde gelegt« im Deutschen präzise und idiomatisch.
- source_word: הֵיכַל יְהוָה
  choice: des Tempels Jahwes
  rationale: הֵיכַל bezeichnet hier den Tempelbau; der Gottesname יהוה wird als »Jahwe« wiedergegeben.
- source_word: שִׂימוּ לְבַבְכֶם
  choice: Nehmt es euch zu Herzen!
  rationale: Die abschließende Wiederholung bleibt als eigener, nachdrücklicher Aufforderungssatz erhalten. Das Pronomen »es« nimmt den zuvor genannten Sachverhalt natürlich wieder auf.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm יהוה. »Jahwe« gibt den persönlichen Gottesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Zeitliche Blickrichtung von מִן הַיּוֹם הַזֶּה וָמָעְלָה
  choice: von diesem Tag an
  alternative: von diesem Tag zurück
  rationale: Im Zusammenhang mit der unmittelbar folgenden Verheißung in Vers 19 liegt die vorwärts gerichtete Lesart nahe. Da die Wendung im Kontext auch rückblickend verstanden werden kann, wird diese Möglichkeit nicht verschwiegen, sondern in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die idiomatische Herz-Metapher und ihre emphatische Wiederholung bleiben erhalten; die verschachtelte hebräische Zeitangabe wird durch wiederholtes »an« verständlich gegliedert.
