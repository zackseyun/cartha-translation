  source_fidelity: 'Der Text gibt die beiden wiederholten Imperative שִׂימוּ ... לְבַבְכֶם angemessen durch „Nehmt euch ... zu Herzen“ wieder. Die Datierung und die passive Aussage über das Legen des Tempelfundaments sind sachgerecht übertragen. Die Fußnote ist jedoch nicht quellentreu: וָמָעְלָה bedeutet hier vorwärtsgerichtet „von diesem Tag an/weiterhin“, nicht „von diesem Tag zurück“.'
  naturalness: Die Übersetzung ist modernes, würdiges Standarddeutsch. Die Wiederholung von „an“ gliedert die dichte hebräische Zeitangabe verständlich; die abschließende Wiederholung der Aufforderung ist wirksam erhalten.
