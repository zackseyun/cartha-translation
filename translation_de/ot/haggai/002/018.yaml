    rationale: Die Fußnote behauptet eine mögliche Bedeutung „von diesem Tag zurück“. Die Wendung וָמָעְלָה bezeichnet jedoch die Fortsetzung ab dem genannten Zeitpunkt („von diesem Tag an/weiterhin“). Die Fußnote schafft daher eine nicht vom hebräischen Wortlaut gedeckte Ambiguität.
