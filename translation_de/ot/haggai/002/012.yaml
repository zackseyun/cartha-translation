source:
  edition: WLC
  text: הֵ֣ן יִשָּׂא אִ֨ישׁ בְּשַׂר קֹ֜דֶשׁ בִּ/כְנַ֣ף בִּגְד֗/וֹ וְ/נָגַ֣ע בִּ֠/כְנָפ/וֹ אֶל הַ/לֶּ֨חֶם וְ/אֶל הַ/נָּזִ֜יד וְ/אֶל הַ/יַּ֧יִן וְ/אֶל שֶׁ֛מֶן וְ/אֶל כָּל מַאֲכָ֖ל הֲ/יִקְדָּ֑שׁ וַ/יַּעֲנ֧וּ הַ/כֹּהֲנִ֛ים וַ/יֹּאמְר֖וּ לֹֽא׀־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/012.yaml
  text: Suppose a man carries holy meat in the fold of his garment[a], and with his fold touches bread, stew, wine, oil, or any food—does it become holy? And the priests answered and said[b], “No.”
translation:
  language: de
  text: 'Angenommen, jemand trägt heiliges Fleisch[a] im Zipfel seines Gewandes[b] und berührt mit diesem Zipfel Brot, ein gekochtes Gericht, Wein, Öl oder irgendeine Speise: Wird sie heilig? Die Priester antworteten: »Nein.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »geweihtes Fleisch«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »im Rand«, »in der Ecke« oder »im Saum seines Gewandes«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Angenommen
  rationale: Leitet hier einen hypothetischen Rechtsfall ein und gibt diese Funktion im modernen Deutschen natürlich wieder.
- source_word: יִשָּׂא אִישׁ
  choice: jemand trägt
  rationale: Gibt die generische Einzelfallform natürlich wieder, ohne den Sinn auf eine bestimmte Person einzugrenzen.
- source_word: בְּשַׂר קֹדֶשׁ
  choice: heiliges Fleisch
  rationale: Bewahrt die direkte kultische Bezeichnung des Hebräischen; gemeint ist Fleisch eines geheiligten Opfers.
- source_word: בִּכְנַף בִּגְדוֹ
  choice: im Bausch seines Gewandes
  rationale: כָּנָף bezeichnet Rand, Zipfel oder heraufgenommenen Gewandteil; „Bausch“ macht verständlich, wie darin Fleisch getragen werden kann.
- source_word: וְנָגַע בִּכְנָפוֹ
  choice: und berührt mit diesem Bausch
  rationale: Verdeutlicht den instrumentalen Kontakt durch den Gewandteil, ohne einen unmittelbaren Kontakt des heiligen Fleisches mit den Speisen anzunehmen.
- source_word: לֶחֶם
  choice: Brot
  rationale: Entspricht der üblichen Bedeutung im vorliegenden Zusammenhang.
- source_word: נָזִיד
  choice: ein gekochtes Gericht
  rationale: Bezeichnet eine gekochte oder geschmorte Speise; die Formulierung ist breiter und im Deutschen würdiger als das enger festgelegte „Eintopf“.
- source_word: יַיִן
  choice: Wein
  rationale: Direkte Standardentsprechung.
- source_word: שֶׁמֶן
  choice: Öl
  rationale: Bewahrt die allgemeine Bezeichnung; Olivenöl ist wahrscheinlich, wird im Hebräischen aber nicht ausdrücklich genannt.
- source_word: כָּל מַאֲכָל
  choice: irgendeine andere Speise
  rationale: Weitet die vorausgehende Aufzählung auf jede weitere Speise aus; „andere“ macht diese Listenfunktion im Deutschen deutlich.
- source_word: הֲיִקְדָּשׁ
  choice: Wird sie dadurch heilig?
  rationale: Bewahrt den resultativen Sinn der Verbform und den kultisch-rechtlichen Begriff der Heiligkeit; „sie“ nimmt die jeweils berührte Speise auf.
- source_word: וַיַּעֲנוּ הַכֹּהֲנִים וַיֹּאמְרוּ לֹא
  choice: 'Die Priester antworteten: »Nein.«'
  rationale: Gibt die hebräische Antwortformel idiomatisch und ohne inhaltlichen Verlust wieder.
theological_decisions:
- issue: Übertragung kultischer Heiligkeit durch mittelbaren Kontakt
  choice: Die Frage betrifft die Berührung einer Speise durch den Gewandbausch, in dem heiliges Fleisch getragen wird; die Priester verneinen, dass die Speise dadurch heilig wird.
  alternative: Man könnte die Berührung als unmittelbaren Kontakt des heiligen Fleisches mit der Speise verstehen.
  rationale: Die Formulierung וְנָגַע בִּכְנָפוֹ nennt ausdrücklich den Gewandbausch als Mittel der Berührung. Der Text behandelt kultisch-rechtliche Heiligkeit und macht keine Aussage über moralische oder innere Heiligung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hypothetische priesterrechtliche Frage bleibt klar erkennbar; kultische Fachsprache wird verständlich, aber nicht paraphrasierend wiedergegeben. Beide Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
