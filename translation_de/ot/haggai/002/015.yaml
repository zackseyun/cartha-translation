source:
  edition: WLC
  text: וְ/עַתָּה֙ שִֽׂימוּ נָ֣א לְבַבְ/כֶ֔ם מִן הַ/יּ֥וֹם הַ/זֶּ֖ה וָ/מָ֑עְלָ/ה מִ/טֶּ֧רֶם שֽׂוּם אֶ֛בֶן אֶל אֶ֖בֶן בְּ/הֵיכַ֥ל יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/015.yaml
  text: 'And now[a], please set your heart on this from today onward: before one stone was placed upon another in the temple of Yahweh,'
translation:
  language: de
  text: 'Und nun bedenkt doch[a] von diesem Tag an: Bevor man im Tempel Jahwes Stein auf Stein legte,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Richtet/legt bitte euer Herz darauf.« Die Wendung fordert zu aufmerksamer Erwägung auf. »Von diesem Tag an« gibt die hebräische Richtungsangabe wörtlich wieder; wegen des anschließenden Rückblicks auf die Zeit vor dem Bauen verstehen manche sie im Zusammenhang rückblickend.'
    reason: Die Fußnote bewahrt die hebräische Herzmetapher und weist auf die durch den Kontext entstehende Auslegungsfrage hin, ohne die vorwärts gerichtete Formulierung des hebräischen Textes im Haupttext umzukehren.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl die verbindende Konjunktion als auch den zeitlichen Übergang zur unmittelbar folgenden Aufforderung.
- source_word: שִׂימוּ נָא לְבַבְכֶם
  choice: richtet bitte euer Herz darauf
  rationale: Erhält das hebräische Bild vom »Herz« als Zentrum bewusster Aufmerksamkeit; »bitte« gibt die auffordernde Partikel נָא wieder. Die singularische Form »euer Herz« bewahrt zudem die kollektive Ausdrucksweise des Hebräischen.
- source_word: מִן הַיּוֹם הַזֶּה וָמָעְלָה
  choice: von diesem Tag aus zurückzublicken
  rationale: Die räumlich formulierte Zeitangabe bedeutet wörtlich etwa »von diesem Tag und aufwärts«. Wegen des unmittelbar folgenden Rückblicks auf die Zeit vor der Bautätigkeit wird sie hier kontextuell rückwärts gerichtet verstanden; eine Fußnote hält die sprachliche Mehrdeutigkeit offen.
- source_word: מִטֶּרֶם
  choice: Bevor
  rationale: Leitet die zeitlich vorausliegende Situation vor dem genannten Bauvorgang knapp und idiomatisch ein.
- source_word: שׂוּם אֶבֶן אֶל אֶבֶן
  choice: Stein auf Stein gelegt wurde
  rationale: Gibt das Bau-Bild der hebräischen Wendung natürlich wieder, ohne es zu verallgemeinern.
- source_word: בְּהֵיכַל
  choice: im Tempel
  rationale: הֵיכָל bezeichnet hier aufgrund des Zusammenhangs das Tempelgebäude Jahwes, nicht einen königlichen Palast.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. »Jahwe« bewahrt den Charakter als persönlicher Gottesname und ist die im Deutschen geläufige wissenschaftliche Umschrift.
- issue: Zeitliche Richtung von מִן הַיּוֹם הַזֶּה וָמָעְלָה
  choice: Rückblick von diesem Tag aus
  alternative: von diesem Tag an vorwärts
  rationale: Die anschließende Aussage über die Zeit, bevor im Tempel Stein auf Stein gelegt wurde, legt einen Rückblick nahe. Da die hebräische Wendung auch vorwärts verstanden werden kann, wird diese Möglichkeit nicht verschwiegen, sondern in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Herzensmetapher bleibt wegen ihrer inhaltlichen Bedeutung erhalten; der Satzbau wird behutsam geglättet. Der abschließende Beistrich zeigt, dass der Gedanke im folgenden Vers weitergeführt wird.
