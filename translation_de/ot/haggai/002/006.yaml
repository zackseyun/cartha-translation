source:
  edition: WLC
  text: כִּ֣י כֹ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת ע֥וֹד אַחַ֖ת מְעַ֣ט הִ֑יא וַ/אֲנִ֗י מַרְעִישׁ֙ אֶת הַ/שָּׁמַ֣יִם וְ/אֶת הָ/אָ֔רֶץ וְ/אֶת הַ/יָּ֖ם וְ/אֶת הֶ/חָרָבָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/006.yaml
  text: 'For this is what Yahweh of Armies says: Yet once more[a], in a little while[b], I will shake the heavens and the earth and the sea and the dry land.'
translation:
  language: de
  text: 'Denn so spricht Jahwe der Heere[a]: Noch einmal – in nur kurzer Zeit[b] – werde ich den Himmel und die Erde, das Meer und das trockene Land erschüttern.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: „der HERR der Heerscharen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Hebräische ist knapp formuliert: „Noch einmal – nur noch kurze Zeit ist es.“'
    reason: textual_clarity
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heere
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; צְבָאוֹת wird mit dem verständlichen „Heere“ übersetzt. So bleibt der Charakter als göttlicher Titel erhalten, ohne das traditionelle, heute weniger geläufige „Heerscharen“ in den Haupttext zu übernehmen.
- source_word: כִּי כֹה אָמַר
  choice: Denn so spricht
  rationale: Diese natürliche und zugleich würdevolle deutsche Wendung bewahrt die feste prophetische Botenformel. Das einleitende כִּי wird mit „Denn“ wiedergegeben.
- source_word: עוֹד אַחַת מְעַט הִיא
  choice: Noch einmal – in nur kurzer Zeit
  rationale: Die knappe hebräische Formulierung enthält sowohl den Gedanken einer weiteren, einzelnen Erschütterung als auch den einer kurzen verbleibenden Zeit. Die Gedankenstriche spiegeln die eingeschobene Zeitangabe, ohne die syntaktische Spannung auszuebnen.
- source_word: מַרְעִישׁ
  choice: werde ich ... erschüttern
  rationale: Das Hifil-Partizip mit ausdrücklich gesetztem אֲנִי bezeichnet hier eine bevorstehende göttliche Handlung. Das Futur ist im Deutschen klar und „erschüttern“ erfasst die kausative Kraft.
- source_word: הַשָּׁמַיִם
  choice: den Himmel
  rationale: Das morphologisch plurale hebräische Wort bezeichnet im Deutschen idiomatisch den Himmel als kosmischen Bereich; der Singular vermeidet die mögliche Verengung von „die Himmel“ auf religiös gedachte Sphären.
- source_word: הָאָרֶץ
  choice: die Erde
  rationale: In der umfassenden kosmischen Aufzählung und in Verbindung mit dem Himmel ist „Erde“ gegenüber dem örtlicheren „Land“ vorzuziehen.
- source_word: הַיָּם
  choice: das Meer
  rationale: Direkte Wiedergabe des kosmischen Bereichs in der Aufzählung.
- source_word: הֶחָרָבָה
  choice: das trockene Land
  rationale: Im Gegensatz zum Meer bezeichnet das Wort hier das Festland beziehungsweise trockene Land, nicht speziell eine Wüste. Die Wiedergabe bewahrt zugleich den Anklang an die Schöpfungssprache.
theological_decisions:
- issue: Wiedergabe des Gottesnamens und des Titels יְהוָה צְבָאוֹת
  choice: Jahwe der Heere
  alternative: der HERR der Heerscharen
  rationale: Der Eigenname יְהוָה bleibt als „Jahwe“ sichtbar, statt durch einen Titel ersetzt zu werden. „Der Heere“ gibt צְבָאוֹת konkret wieder, ohne festzulegen, ob ausschließlich himmlische oder auch irdische Heere gemeint sind.
- issue: Zeitliche Aussage עוֹד אַחַת מְעַט הִיא
  choice: Noch einmal – in nur kurzer Zeit
  alternative: Noch einmal – nur eine kurze Zeit ist es noch
  rationale: Die gewählte Fassung bewahrt Wiederholung beziehungsweise Einmaligkeit und zeitliche Nähe. Sie deutet die Aussage nicht im Licht von Hebräer 12 aus und lässt offen, wie genau das „noch einmal“ heilsgeschichtlich einzuordnen ist.
- issue: Aspekt von מַרְעִישׁ
  choice: werde ich ... erschüttern
  alternative: ich bin dabei, ... zu erschüttern
  rationale: Der Kontext weist auf eine bevorstehende Handlung. Das deutsche Futur drückt dies verständlich aus, ohne einen bereits begonnenen Vorgang zu behaupten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit erkennbarer prophetischer Sprachform. Die kosmische Aufzählung bleibt rhythmisch und vollständig erhalten; die ungewöhnlich knappe Zeitformel wird im Haupttext lesbar gestaltet und in der Fußnote formaler wiedergegeben.
