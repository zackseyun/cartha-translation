id: HAG.2.10
reference: Haggai 2:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בְּ/עֶשְׂרִ֤ים וְ/אַרְבָּעָה֙ לַ/תְּשִׁיעִ֔י בִּ/שְׁנַ֥ת שְׁתַּ֖יִם לְ/דָרְיָ֑וֶשׁ הָיָה֙ דְּבַר יְהוָ֔ה אֶל חַגַּ֥י הַ/נָּבִ֖יא לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/010.yaml
  text: On the twenty-fourth day of the ninth month, in the second year of Darius, the word of Yahweh came to Haggai the prophet, saying,
translation:
  language: de
  text: 'Am vierundzwanzigsten Tag des neunten Monats, im zweiten Jahr des Darius, erging das Wort Jahwes an den Propheten Haggai:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּ/עֶשְׂרִים וְ/אַרְבָּעָה
  choice: Am vierundzwanzigsten Tag
  rationale: Die hebräische Datumsformel lautet wörtlich „am vierundzwanzigsten“; im Deutschen wird „Tag“ zur natürlichen und eindeutigen Wiedergabe ergänzt.
- source_word: לַ/תְּשִׁיעִי
  choice: des neunten Monats
  rationale: Der substantivisch gebrauchte Ordinal bezeichnet in dieser Datumsformel den neunten Monat; „Monat“ wird im Deutschen sinnvoll ergänzt.
- source_word: בִּ/שְׁנַת שְׁתַּיִם
  choice: im zweiten Jahr
  rationale: Dies ist die übliche deutsche Form einer Regierungsjahrangabe und gibt die hebräische Status-constructus-Verbindung genau wieder.
- source_word: לְ/דָרְיָוֶשׁ
  choice: des Darius
  rationale: Das Präfix לְ kennzeichnet hier die Zuordnung des Regierungsjahres zu Darius; der Name folgt der etablierten deutschen Form.
- source_word: הָיָה דְּבַר יְהוָה
  choice: erging das Wort Jahwes
  rationale: „Das Wort ... erging an“ ist eine natürliche, würdevolle deutsche Wiedergabe der geläufigen prophetischen Wortereignisformel und bewahrt deren dynamischen Charakter.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im deutschen Haupttext als „Jahwe“ transliteriert und nicht durch einen Titel ersetzt.
- source_word: אֶל
  choice: an
  rationale: Bei der deutschen Wendung „das Wort erging“ bezeichnet „an“ idiomatisch den Empfänger.
- source_word: חַגַּי
  choice: Haggai
  rationale: Der Personenname wird gemäß der im Deutschen etablierten biblischen Namensform wiedergegeben.
- source_word: הַ/נָּבִיא
  choice: den Propheten
  rationale: Die Apposition bezeichnet Haggais Amt; der bestimmte Artikel des Hebräischen bleibt erhalten.
- source_word: לֵ/אמֹר
  choice: ':'
  rationale: Der Infinitiv leitet die unmittelbar folgende Rede ein. Im modernen Deutschen erfüllt ein Doppelpunkt diese Funktion natürlicher als das formelhafte „folgendermaßen“ oder „indem er sprach“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: HERR; Jehova
  rationale: Der hebräische Text verwendet den Eigennamen unmittelbar. „Jahwe“ bewahrt diesen Namen und entspricht der geläufigen deutschen Transliteration, ohne ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe der prophetischen Formel הָיָה דְּבַר יְהוָה
  choice: erging das Wort Jahwes
  alternative: das Wort Jahwes geschah; das Wort Jahwes kam
  rationale: „Erging“ gibt die etablierte Bedeutung der Formel idiomatisch wieder, ohne das Wort als bloße statische Aussage zu behandeln. Die stärker formale Möglichkeit „geschah“ bleibt semantisch möglich, klingt hier aber im Deutschen unnatürlich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Datumsformel bleibt knapp und sachlich. Der Doppelpunkt bildet לֵאמֹר idiomatisch ab und öffnet den Satz zur folgenden Gottesrede.
