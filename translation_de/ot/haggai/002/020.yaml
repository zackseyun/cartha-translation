id: HAG.2.20
reference: Haggai 2:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְהִ֨י דְבַר יְהוָ֤ה שֵׁנִית֙ אֶל חַגַּ֔י בְּ/עֶשְׂרִ֧ים וְ/אַרְבָּעָ֛ה לַ/חֹ֖דֶשׁ לֵ/אמֹֽר־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/020.yaml
  text: And the word of Yahweh came a second time to Haggai on the twenty-fourth day of the month[a], saying,
translation:
  language: de
  text: 'Und das Wort Jahwes[a] erging zum zweiten Mal an Haggai, am vierundzwanzigsten Tag des Monats:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: „des HERRN“. Im Hebräischen steht der Gottesname יהוה (JHWH).'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: erging
  rationale: In der festen prophetischen Wendung וַיְהִי דְבַר־יְהוָה gibt „das Wort … erging“ den Eintritt der Offenbarung idiomatisch und würdig wieder.
- source_word: דְבַר יְהוָה
  choice: das Wort Jahwes
  rationale: „Wort“ bewahrt sowohl die Grundbedeutung von דָּבָר als auch die vertraute prophetische Offenbarungsformel; der Gottesname wird als Eigenname wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen geläufige Form „Jahwe“ gibt das Tetragramm als Gottesnamen wieder, statt es durch einen Titel zu ersetzen.
- source_word: שֵׁנִית
  choice: zum zweiten Mal
  rationale: Diese Formulierung gibt die ausdrückliche Ordnungszahl präziser wieder als das allgemeinere „wieder“.
- source_word: אֶל חַגַּי
  choice: an Haggai
  rationale: Bei einer Mitteilung oder Offenbarung ist „an Haggai“ im Deutschen die natürliche Entsprechung von אֶל.
- source_word: בְּעֶשְׂרִים וְאַרְבָּעָה לַחֹדֶשׁ
  choice: am vierundzwanzigsten Tag des Monats
  rationale: Die ausgeschriebene Datumsangabe entspricht dem Hebräischen und ist in modernem Standarddeutsch klar.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Doppelpunkt führt die in Vers 21 folgende direkte Rede natürlich ein und erfüllt im Deutschen die Funktion des hebräischen לֵאמֹר, ohne ein schwerfälliges „indem er sprach“ hinzuzufügen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יְהוָה. „Jahwe“ wahrt diesen Namenscharakter; die traditionelle Ersatzlesung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die etablierte prophetische Formel „das Wort … erging“ bleibt erhalten. Der Doppelpunkt zeigt an, dass die Botschaft im folgenden Vers beginnt.
