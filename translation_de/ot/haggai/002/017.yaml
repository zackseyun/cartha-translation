source:
  edition: WLC
  text: הִכֵּ֨יתִי אֶתְ/כֶ֜ם בַּ/שִּׁדָּפ֤וֹן וּ/בַ/יֵּֽרָקוֹן֙ וּ/בַ/בָּרָ֔ד אֵ֖ת כָּל מַעֲשֵׂ֣ה יְדֵי/כֶ֑ם וְ/אֵין אֶתְ/כֶ֥ם אֵלַ֖/י נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/017.yaml
  text: I struck you with blight and mildew and hail[a], all the work of your hands; yet you did not turn to me, declares Yahweh.
translation:
  language: de
  text: Ich schlug euch mit Getreidebrand, Vergilbung und Hagel, alles Werk eurer Hände; doch ihr habt euch mir nicht zugewandt[a] – Ausspruch Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Doch ihr wart nicht zu mir“ oder „doch keiner von euch war zu mir“. Gemeint ist im Zusammenhang, dass sie sich Jahwe trotz dieser Schläge nicht zuwandten.'
    reason: Die hebräische Wendung ist elliptisch und lässt die Art der ausgebliebenen Hinwendung unausgesprochen.
lexical_decisions:
- source_word: הִכֵּיתִי
  choice: Ich schlug
  rationale: Das Verb נכה bezeichnet das Schlagen beziehungsweise Treffen. „Ich schlug“ bewahrt die unmittelbare göttliche Urheberschaft und den kräftigen Ausdruck des Hebräischen.
- source_word: בַּשִּׁדָּפוֹן
  choice: mit Getreidebrand
  rationale: שִׁדָּפוֹן bezeichnet eine schädigende Versengung beziehungsweise Pflanzenkrankheit der Feldfrucht. „Getreidebrand“ ist im landwirtschaftlichen Gerichtskontext präzise und unterscheidet den Begriff vom folgenden Vergilben.
- source_word: וּבַיֵּרָקוֹן
  choice: Vergilben
  rationale: יֵרָקוֹן bezeichnet bei Pflanzen ein krankhaftes Gelb- oder Blasswerden. „Vergilben“ gibt das sichtbare Schadbild wieder, ohne es auf eine bestimmte moderne Pflanzenkrankheit festzulegen.
- source_word: וּבַבָּרָד
  choice: und Hagel
  rationale: בָּרָד bedeutet eindeutig „Hagel“.
- source_word: אֵת כָּל מַעֲשֵׂה יְדֵיכֶם
  choice: und traf damit alles, was eure Hände erarbeitet hatten
  rationale: Die zweite Akkusativgruppe hängt weiterhin von „ich schlug“ ab. Die deutsche Formulierung macht diesen syntaktischen Bezug verständlich; „was eure Hände erarbeitet hatten“ bewahrt zugleich das hebräische Bild menschlicher Arbeit und ihres Ertrags.
- source_word: וְאֵין אֶתְכֶם אֵלַי
  choice: Doch ihr habt euch mir nicht zugewandt
  rationale: Die hebräische Nominalkonstruktion ist elliptisch und lautet wörtlich etwa „doch ihr wart nicht zu mir“. Im Zusammenhang bezeichnet sie die ausgebliebene Hinwendung zu Gott; „euch mir zugewandt“ gibt diesen Sinn natürlich wieder, ohne ausdrücklich den stärkeren theologischen Begriff „umkehren“ einzusetzen.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: נְאֻם ist eine feierliche prophetische Botenformel. „Ausspruch Jahwes“ bewahrt ihre knappe und gewichtige Form.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen übliche wissenschaftliche Umschrift.
theological_decisions:
- issue: Deutung der elliptischen Wendung וְאֵין אֶתְכֶם אֵלַי
  choice: „Doch ihr habt euch mir nicht zugewandt“ als ausgebliebene Reaktion auf Gottes Gericht
  alternative: „Doch ihr wart nicht zu mir“ beziehungsweise „doch keiner von euch kam zu mir“
  rationale: Im Hebräischen fehlt ein ausdrückliches Verb der Umkehr. Der Kontext legt eine verweigerte Hinwendung zu Gott nahe, lässt aber die genaue Nuance offen. Die Übersetzung vermittelt den kontextuellen Sinn; die Fußnote erhält die ungewöhnlich offene Form des Ausgangstextes.
- issue: Bezug von אֵת כָּל מַעֲשֵׂה יְדֵיכֶם
  choice: 'Als weiteres Objekt des göttlichen Schlagens: Gott traf den gesamten Ertrag ihrer Arbeit'
  alternative: Als lose Apposition zu den genannten Plagen oder als elliptische Wendung ohne ergänztes Verb
  rationale: Die Akkusativpartikel אֵת spricht für den Anschluss an הִכֵּיתִי. Im Deutschen wird „traf“ wiederaufgenommen, damit der Satz verständlich bleibt, ohne die Wirkung als vollständige Vernichtung zu überdehnen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die landwirtschaftlichen Schadensbegriffe bleiben konkret und voneinander unterschieden. Die Ergänzung „traf damit“ dient der natürlichen deutschen Syntax, ohne eine vollständige Vernichtung zu behaupten; die ungewöhnliche Offenheit der abschließenden hebräischen Wendung wird durch eine Fußnote bewahrt.
