source:
  edition: WLC
  text: וְ/הָֽפַכְתִּי֙ כִּסֵּ֣א מַמְלָכ֔וֹת וְ/הִ֨שְׁמַדְתִּ֔י חֹ֖זֶק מַמְלְכ֣וֹת הַ/גּוֹיִ֑ם וְ/הָפַכְתִּ֤י מֶרְכָּבָה֙ וְ/רֹ֣כְבֶ֔י/הָ וְ/יָרְד֤וּ סוּסִים֙ וְ/רֹ֣כְבֵי/הֶ֔ם אִ֖ישׁ בְּ/חֶ֥רֶב אָחִֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/022.yaml
  text: I will overturn the throne of kingdoms[a], and I will destroy the strength of the kingdoms of the nations. I will overturn the chariot and its rider, and horses and their riders will go down[b], each by the sword of his brother.
translation:
  language: de
  text: Ich werde den Thron der Königreiche umstürzen[a] und die Macht der Königreiche der Völker vernichten. Ich werde den Streitwagen samt seinen Fahrern umstürzen. Pferde und ihre Reiter werden fallen, jeder durch das Schwert seines Bruders.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich werde die Herrschaft der Königreiche zu Fall bringen.“ Der hebräische Text hat wörtlich den Singular „Thron“.'
    reason: lexical_alternative
  - marker: b
    text: „Jeder durch das Schwert seines Bruders“ bezeichnet gegenseitiges Töten oder Kämpfe untereinander.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָפַכְתִּי
  choice: ich werde … umstürzen
  rationale: הפך bezeichnet hier das Umstürzen oder Beseitigen bestehender Macht. „Umstürzen“ bewahrt das konkrete Bild und lässt sich bei Thron und Streitwagen wiederholen.
- source_word: כִּסֵּא מַמְלָכוֹת
  choice: den Thron der Königreiche
  rationale: Der Singular כִּסֵּא wird bewahrt; er kann kollektiv oder symbolisch für die Herrschaft der Königreiche stehen, ohne dass dies im Haupttext festgelegt wird.
- source_word: וְהִשְׁמַדְתִּי
  choice: ich werde … vernichten
  rationale: Der Hifil von שׁמד ist ein starkes Gerichtswort. „Vernichten“ gibt seine Intensität in würdigem, heutigem Deutsch wieder.
- source_word: חֹזֶק
  choice: die Macht
  rationale: חֹזֶק bedeutet Stärke oder Macht. Im Zusammenhang politischer und militärischer Königreiche ist „Macht“ natürlich und prägnant.
- source_word: מַמְלְכוֹת הַגּוֹיִם
  choice: die Königreiche der Völker
  rationale: גּוֹיִם bezeichnet hier die Völker beziehungsweise Nationen im geopolitischen Sinn. „Völker“ ist im deutschen prophetischen Kontext klar und vermeidet eine unnötig konfessionell geprägte Wiedergabe.
- source_word: מֶרְכָּבָה וְרֹכְבֶיהָ
  choice: den Streitwagen samt seinen Fahrern
  rationale: Der singularische Streitwagen wird als kollektives militärisches Bild bewahrt; der hebräische Plural „seine Fahrer“ wird durch „samt seinen Fahrern“ natürlich ins Deutsche übertragen.
- source_word: וְיָרְדוּ
  choice: werden fallen
  rationale: ירד bedeutet wörtlich „hinabgehen“. Im Kampfzusammenhang bezeichnet es das Fallen beziehungsweise Unterliegen; „werden fallen“ vermittelt diesen Sinn in natürlichem Deutsch.
- source_word: סוּסִים וְרֹכְבֵיהֶם
  choice: Pferde und ihre Reiter
  rationale: Die schlichte Bildsprache des Hebräischen wird ohne die interpretierende Ergänzung „Kriegs-“ wiedergegeben.
- source_word: אִישׁ בְּחֶרֶב אָחִיו
  choice: einer durch das Schwert seines Bruders
  rationale: Die distributive maskuline Form und das Bild des Bruderschwerts bleiben erhalten. Eine Fußnote erklärt, dass die Wendung gegenseitiges Töten oder innere Fehde ausdrückt.
theological_decisions:
- issue: Singular „Thron“ als Bild über die Königreiche
  choice: den Thron der Königreiche
  alternative: die Throne der Königreiche
  rationale: Der hebräische Singular wird nicht stillschweigend pluralisiert. So bleibt offen, ob ein kollektiver Thron oder die königliche Herrschaft als solche gemeint ist.
- issue: Geschlechtsspezifische Sprache in אִישׁ … אָחִיו
  choice: einer durch das Schwert seines Bruders
  alternative: einer durch das Schwert des anderen
  rationale: Die maskuline Einzelform des hebräischen Ausdrucks wird in einem militärischen Kontext bewahrt, ohne die idiomatische Aussage auf eine darüber hinausgehende Lehre festzulegen.
- issue: Deutung von ירד im Kampfzusammenhang
  choice: werden fallen
  alternative: werden hinabgehen
  rationale: „Fallen“ gibt die kontextuelle Bedeutung der Niederlage wieder; die Aussage über das Gericht wird weder zu einer spezifischen Todes- noch zu einer Jenseitsvorstellung erweitert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Wiedergabe von הפך mit „umstürzen“ erhält die sprachliche Verknüpfung zwischen politischer Herrschaft und militärischer Macht. Kurze Hauptsätze bewahren den kraftvollen Rhythmus des Gerichtswortes.
