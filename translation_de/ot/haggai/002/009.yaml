source:
  edition: WLC
  text: גָּד֣וֹל יִֽהְיֶ֡ה כְּבוֹד֩ הַ/בַּ֨יִת הַ/זֶּ֤ה הָ/אַֽחֲרוֹן֙ מִן הָ֣/רִאשׁ֔וֹן אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת וּ/בַ/מָּק֤וֹם הַ/זֶּה֙ אֶתֵּ֣ן שָׁל֔וֹם נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/009.yaml
  text: The latter glory of this house will be greater than the former[a], says Yahweh of Armies; and in this place I will give peace[b], declares Yahweh of Armies.
translation:
  language: de
  text: Die spätere Herrlichkeit dieses Hauses wird größer sein als die frühere, spricht Jahwe der Heerscharen. Und an diesem Ort werde ich Frieden geben[a], spricht Jahwe der Heerscharen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort für »Frieden« kann auch Wohlergehen, Heil oder Ganzheit bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּדוֹל יִהְיֶה ... מִן
  choice: wird größer sein als
  rationale: Die prädikative Verbindung mit היה und der Vergleich mit מִן verlangen im natürlichen Deutschen eine Komparativkonstruktion.
- source_word: כְּבוֹד
  choice: Herrlichkeit
  rationale: „Herrlichkeit“ bewahrt im Tempelkontext sowohl den Sinn von Pracht und Ehre als auch die theologische Resonanz des hebräischen Begriffs.
- source_word: הַבַּיִת הַזֶּה
  choice: dieses Hauses
  rationale: „Haus“ entspricht dem hebräischen Wortlaut; aus dem Kontext ergibt sich, dass der Tempel gemeint ist.
- source_word: הָאַחֲרוֹן ... הָרִאשׁוֹן
  choice: die spätere ... die frühere
  rationale: Die Adjektive bezeichnen hier kontrastierende zeitliche Zustände der Herrlichkeit. „Später“ und „früher“ geben dies wieder, ohne eine endgültige oder eschatologische Phase ausdrücklich festzulegen.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: „Jahwe“ gibt den Gottesnamen wieder; „Heerscharen“ ist die eingebürgerte, würdevolle Übersetzung des pluralischen צְבָאוֹת und lässt dessen umfassende Bedeutung offen.
- source_word: וּבַמָּקוֹם הַזֶּה
  choice: Und an diesem Ort
  rationale: „An diesem Ort“ ist im Deutschen idiomatisch und bewahrt die demonstrative Hervorhebung.
- source_word: אֶתֵּן
  choice: werde ich ... geben
  rationale: Die einfache Wiedergabe mit „geben“ entspricht dem gewöhnlichen Sinn von נתן und bewahrt die Form der göttlichen Zusage.
- source_word: שָׁלוֹם
  choice: Frieden
  rationale: „Frieden“ ist die zentrale und kontextuell passende Bedeutung; eine Fußnote weist auf den weiteren Sinn von Wohlergehen und Ganzheit hin.
- source_word: נְאֻם
  choice: spricht
  rationale: In der festen prophetischen Formel ist „spricht Jahwe“ natürlich, feierlich und näher an heutiger deutscher Bibelsprache als eine substantivische Wiedergabe wie „Ausspruch“.
theological_decisions:
- issue: Bezug der späteren Herrlichkeit dieses Hauses
  choice: Die Aussage wird als Verheißung über die spätere Herrlichkeit dieses Hauses wiedergegeben, ohne ihre geschichtliche oder endzeitliche Erfüllung näher festzulegen.
  alternative: Ausdrückliche Deutung als Vergleich des zweiten Tempels mit Salomos Tempel oder als messianisch-eschatologische Verheißung.
  rationale: Der hebräische Wortlaut nennt den Vergleich, entscheidet aber nicht ausdrücklich zwischen aufeinanderfolgenden Tempeln, Zuständen desselben Heiligtums oder einer endzeitlichen Erfüllung.
- issue: Wiedergabe des Gottesnamens
  choice: Jahwe
  alternative: der HERR
  rationale: Der Text enthält das Tetragramm יהוה; „Jahwe“ gibt den offenbarten Eigennamen unmittelbar wieder.
- issue: Umfang der Zusage שָׁלוֹם
  choice: Frieden mit Hinweis auf den weiteren Bedeutungsumfang in einer Fußnote
  alternative: Wohlergehen oder Ganzheit im Haupttext
  rationale: „Frieden“ wahrt die traditionelle und primäre Aussage, während die Fußnote verhindert, dass der umfassendere hebräische Sinn verengt wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt textnah, ohne unnötige Altertümlichkeit. „Haus“ bewahrt die Bildsprache des Hebräischen; „Heerscharen“ erhält die traditionelle Weite des Gottestitels.
