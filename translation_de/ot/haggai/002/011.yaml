base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/011.yaml
  text: 'Thus says Yahweh of hosts: Ask the priests for a ruling[a], saying,'
translation:
  language: de
  text: 'So spricht Jahwe der Heerscharen: Frag doch die Priester nach einer Weisung[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach dem Gesetz“ beziehungsweise „nach einer Rechtsentscheidung“. Das hebräische Wort Tora meint hier wahrscheinlich eine priesterliche Weisung zu einer kultrechtlichen Frage, nicht notwendigerweise die Tora als Buch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Gängige, würdevolle deutsche Wiedergabe der prophetischen Botenformel; das Präsens entspricht ihrer aktuellen Verkündigungsfunktion.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: צְבָאוֹת
  choice: der Heerscharen
  rationale: Bewahrt die traditionelle Breite des göttlichen Titels, ohne ihn ausschließlich auf menschliche Armeen festzulegen.
- source_word: שְׁאַל נָא
  choice: Fragt doch
  rationale: Der Imperativ gibt den Befehl wieder; „doch“ nimmt die abmildernde beziehungsweise auffordernde Nuance von נָא natürlich auf.
- source_word: אֶת הַכֹּהֲנִים
  choice: die Priester
  rationale: Direkte und sachgerechte Wiedergabe der bestimmten pluralischen Personenbezeichnung.
- source_word: תּוֹרָה
  choice: nach einer Weisung
  rationale: Im Zusammenhang bezeichnet תּוֹרָה wahrscheinlich eine priesterliche Unterweisung oder Entscheidung zu einer kultrechtlichen Frage, nicht zwingend die Tora als Schriftcorpus.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Doppelpunkt leitet im modernen Deutsch die im nächsten Vers folgende Frage natürlicher ein als das hebraisierende „indem ihr sagt“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst; seine Wiedergabe als Eigenname erhält diese Unterscheidung gegenüber einem bloßen Titel.
- issue: Bedeutung von תּוֹרָה in priesterlichem Kontext
  choice: Weisung
  alternative: Gesetz / Rechtsentscheid
  rationale: „Weisung“ bewahrt die semantische Breite und passt zur Aufgabe der Priester, die folgende kultrechtliche Frage verbindlich zu beantworten, ohne den Ausdruck auf den Pentateuch als Buch festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die prophetische Formel bleibt erkennbar; „Fragt doch“ bildet נָא ab. Der Doppelpunkt gibt die Funktion von לֵאמֹר idiomatisch wieder und verbindet den Vers mit der folgenden Frage.
