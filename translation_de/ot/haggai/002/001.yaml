id: HAG.2.1
reference: Haggai 2:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בַּ/שְּׁבִיעִ֕י בְּ/עֶשְׂרִ֥ים וְ/אֶחָ֖ד לַ/חֹ֑דֶשׁ הָיָה֙ דְּבַר יְהוָ֔ה בְּ/יַד חַגַּ֥י הַ/נָּבִ֖יא לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/001.yaml
  text: On the twenty-first day of the seventh month[a], the word of Yahweh came by the hand of Haggai the prophet, saying,
translation:
  language: de
  text: 'Am einundzwanzigsten Tag des siebten Monats erging das Wort Jahwes durch den Propheten Haggai[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „durch die Hand des Propheten Haggai“; eine hebräische Wendung für die Vermittlung durch Haggai.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשְּׁבִיעִי בְּעֶשְׂרִים וְאֶחָד לַחֹדֶשׁ
  choice: Am einundzwanzigsten Tag des siebten Monats
  rationale: Die gesamte Wendung ist eine Datumsangabe. „Tag“ ist im Hebräischen nicht ausdrücklich genannt, wird aber durch die Zahl innerhalb der Monatsangabe vorausgesetzt und muss im natürlichen Deutschen ergänzt werden.
- source_word: הָיָה דְּבַר יְהוָה
  choice: erging das Wort Jahwes
  rationale: Die feste prophetische Offenbarungsformel bezeichnet das Eintreten einer göttlichen Mitteilung. „Erging“ gibt sie im Deutschen präzise und idiomatisch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im deutschen Sprachraum übliche Form des ausdrücklich im hebräischen Text stehenden Gottesnamens wird beibehalten, statt ihn durch einen Titel zu ersetzen.
- source_word: בְּיַד חַגַּי הַנָּבִיא
  choice: durch den Propheten Haggai[a]
  rationale: בְּיַד („durch die Hand“) ist hier eine hebräische Vermittlungsformel. Natürliches Deutsch drückt die gemeinte Mittlerschaft mit „durch“ aus; die wörtliche Bildsprache wird in der Fußnote dokumentiert.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv leitet die unmittelbar folgende Rede ein. Im heutigen Deutschen erfüllt ein Doppelpunkt diese Funktion natürlicher als das formelhafte „indem er sprach“ oder „mit den Worten“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen ausdrücklich. „Jahwe“ bewahrt ihn als Namen und vermeidet die Ersetzung durch den Titel „HERR“.
- issue: Vermittlung des prophetischen Wortes
  choice: durch den Propheten Haggai
  alternative: durch die Hand des Propheten Haggai
  rationale: Die idiomatische Wiedergabe bezeichnet Haggai als Vermittler, ohne über die Quelle oder Autorität des Wortes hinauszugehen; die wörtliche Form bleibt per Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Datumsformel ist natürlich formuliert, die prophetische Offenbarungsformel bleibt markant. Der Doppelpunkt führt knapp in die folgende Gottesrede über.
