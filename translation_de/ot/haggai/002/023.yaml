source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֣וּא נְאֻם יְהוָ֣ה צְבָא֡וֹת אֶ֠קָּחֲ/ךָ זְרֻבָּבֶ֨ל בֶּן שְׁאַלְתִּיאֵ֤ל עַבְדִּ/י֙ נְאֻם יְהוָ֔ה וְ/שַׂמְתִּ֖י/ךָ כַּֽ/חוֹתָ֑ם כִּֽי בְ/ךָ֣ בָחַ֔רְתִּי נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/023.yaml
  text: On that day[a], declares Yahweh of Armies, I will take you, Zerubbabel son of Shealtiel, my servant, declares Yahweh, and I will make you like a signet ring, for I have chosen you[b], declares Yahweh of Armies.
translation:
  language: de
  text: An jenem Tag, spricht Jahwe der Heerscharen, werde ich dich nehmen, Serubbabel, Sohn Schealtiels, meinen Diener, spricht Jahwe, und dich zum Siegelring machen[b]; denn dich habe ich erwählt, spricht Jahwe der Heerscharen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell auch: „der HERR der Heerscharen“; צְבָאוֹת kann auch mit „Heere“ wiedergegeben werden.'
    reason: lexical_alternative
  - marker: b
    text: Das Bild des Siegelrings kann kostbare Zugehörigkeit bzw. Eigentum, Autorität und Beglaubigung andeuten; vergleiche Jeremia 22,24.
    reason: cross_reference
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Bewahrt die prophetische Zeitformel in natürlichem, würdigem Gegenwartsdeutsch, ohne ihre mögliche endzeitliche Tragweite näher festzulegen.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: spricht Jahwe der Heerscharen
  rationale: „spricht“ gibt die feierliche prophetische Ausspruchsformel idiomatisch wieder. Der Gottesname wird als „Jahwe“ wiedergegeben; „Heerscharen“ bewahrt die Vorstellung der himmlischen und irdischen Streitkräfte.
- source_word: אֶקָּחֲךָ
  choice: werde ich dich nehmen
  rationale: Die Grundbedeutung von לקח wird erhalten. Eine Deutung als „annehmen“, „erwählen“ oder „erhöhen“ wird vermieden, da die Erwählung später ausdrücklich genannt wird.
- source_word: זְרֻבָּבֶל בֶּן שְׁאַלְתִּיאֵל
  choice: Serubbabel, Sohn Schealtiëls
  rationale: Verwendet die im Deutschen etablierten Namensformen und gibt die Abstammungsangabe knapp und eindeutig wieder.
- source_word: עַבְדִּי
  choice: mein Diener
  rationale: Im königlich-prophetischen Zusammenhang bezeichnet עבד den von Gott beauftragten Diener; „Sklave“ würde hier den Kontext unnötig verengen.
- source_word: וְשַׂמְתִּיךָ כַּחוֹתָם
  choice: und ich werde dich einem Siegelring gleichmachen
  rationale: Gibt sowohl das Verb שׂים als auch den durch כ markierten Vergleich wieder. „Siegelring“ vermittelt die konkrete königlich-administrative Bildwelt besser als das allgemeinere „Siegel“.
- source_word: כִּי בְךָ בָחַרְתִּי
  choice: denn dich habe ich erwählt
  rationale: „denn“ wahrt den begründenden Charakter von כִּי. Die Voranstellung von „dich“ spiegelt die Hervorhebung durch בְךָ, während das Perfekt als vollzogene, fortgeltende Wahl erscheint.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Die wiederholte prophetische Formel bleibt an allen drei Stellen sichtbar und wird nicht stilistisch geglättet.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der im hebräischen Text stehende Eigenname wird als solcher wiedergegeben, statt durch einen Titel ersetzt zu werden.
- issue: Wiedergabe von צְבָאוֹת
  choice: der Heerscharen
  alternative: der Heere; Zebaot
  rationale: „Heerscharen“ bewahrt den militärisch-kosmischen Sinn und ist als Gottesbezeichnung im Deutschen verständlich, ohne die Referenz ausschließlich auf menschliche Armeen festzulegen.
- issue: Königliche oder messianische Tragweite des Siegelringbildes
  choice: Das Bild ohne erklärende Erweiterung im Haupttext bewahren
  alternative: mein königlicher Siegelring
  rationale: Der Zusammenhang mit Serubbabels davidischer Herkunft und Jeremia 22,24 kann eine königlich-messianische Bedeutung nahelegen. Der hebräische Wortlaut nennt jedoch nur den Vergleich mit einem Siegelring; daher bleibt die weitergehende Deutung in der Fußnote beziehungsweise beim Querverweis.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst erhaltener prophetischer Wiederholung. Die direkte Rede wird durch Anführungszeichen gegliedert; „werde ich dich nehmen“ bleibt absichtlich nah am hebräischen Ausdruck, obwohl die Formulierung im Deutschen markanter wirkt.
