  naturalness: Die verschachtelte direkte Rede mit mehrfach geöffneten bzw. unterbrochenen Anführungszeichen ist im Deutschen schwer lesbar. Die prophetische Formel lässt sich natürlicher ohne Anführungszeichen in den Satz einfügen. Zudem ist „Schealtiel“ die im modernen deutschen Bibelgebrauch übliche Namensschreibung.
