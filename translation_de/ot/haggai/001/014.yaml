id: HAG.1.14
reference: Haggai 1:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יָּ֣עַר יְהוָ֡ה אֶת רוּחַ֩ זְרֻבָּבֶ֨ל בֶּן שַׁלְתִּיאֵ֜ל פַּחַ֣ת יְהוּדָ֗ה וְ/אֶת ר֨וּחַ֙ יְהוֹשֻׁ֤עַ בֶּן יְהוֹצָדָק֙ הַ/כֹּהֵ֣ן הַ/גָּד֔וֹל וְֽ/אֶת ר֔וּחַ כֹּ֖ל שְׁאֵרִ֣ית הָ/עָ֑ם וַ/יָּבֹ֨אוּ֙ וַ/יַּעֲשׂ֣וּ מְלָאכָ֔ה בְּ/בֵית יְהוָ֥ה צְבָא֖וֹת אֱלֹהֵי/הֶֽם־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/014.yaml
  text: And Yahweh stirred up the spirit of Zerubbabel son of Shealtiel[a], governor of Judah, and the spirit of Joshua son of Jehozadak, the high priest, and the spirit of all the remnant of the people; and they came and did work on the house of Yahweh of Armies, their God.
translation:
  language: de
  text: Und Jahwe weckte den Geist Serubbabels, des Sohnes Schealtiels, des Statthalters von Juda, und den Geist Josuas, des Sohnes Jozadaks, des Hohen Priesters, und den Geist des ganzen Restes des Volkes. Da kamen sie und arbeiteten am Haus Jahwes der Heerscharen[a], ihres Gottes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: »HERR der Heerscharen«.'
    reason: Nennt die verbreitete traditionelle Wiedergabe des Gottesnamens und des Titels.
lexical_decisions:
- source_word: וַיָּעַר
  choice: weckte ... den Geist
  rationale: Das Verb bezeichnet hier, dass Jahwe die innere Bereitschaft zum Handeln wachruft. Die Formulierung bleibt nahe am hebräischen Bild und ist im Deutschen verständlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: רוּחַ
  choice: Geist
  rationale: „Geist“ bewahrt sowohl die anthropologische als auch die theologische Weite des hebräischen Wortes, ohne es auf Gesinnung, Mut oder Motivation festzulegen.
- source_word: פַּחַת יְהוּדָה
  choice: Statthalter von Juda
  rationale: „Statthalter“ ist eine geläufige deutsche Wiedergabe des perserzeitlichen Verwaltungstitels.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: der Hohe Priester
  rationale: Dies ist die etablierte deutsche Bezeichnung für dieses priesterliche Amt.
- source_word: כֹּל שְׁאֵרִית הָעָם
  choice: der ganze Rest des Volkes
  rationale: „Rest“ erhält den möglichen theologischen Klang des in der Prophetie bedeutsamen Restmotivs und kann zugleich schlicht die verbliebene Volksgemeinschaft bezeichnen.
- source_word: וַיָּבֹאוּ
  choice: da kamen sie
  rationale: Die schlichte Erzählfolge des hebräischen Verbs wird bewahrt; „da“ stellt den Anschluss im modernen Deutschen natürlich her.
- source_word: וַיַּעֲשׂוּ מְלָאכָה
  choice: verrichteten Arbeit
  rationale: Die Wiedergabe erhält die hebräische Verb-Nomen-Verbindung und fügt nicht ausdrücklich den im Verb nicht markierten Aspekt „begannen“ hinzu.
- source_word: בְּבֵית
  choice: am Haus
  rationale: Im Zusammenhang des Tempelbaus bezeichnet die Präposition die Arbeit an dem Gebäude; „am Haus“ ist dafür idiomatisches Deutsch.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Die Wendung bewahrt den Gottesnamen und gibt צְבָאוֹת mit dem im Deutschen verständlichen, traditionsreichen „Heerscharen“ wieder.
- source_word: אֱלֹהֵיהֶם
  choice: ihres Gottes
  rationale: Die natürliche deutsche Possessivkonstruktion bewahrt die im Suffix ausgedrückte Beziehung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen; „Jahwe“ macht dies sichtbar, während „der HERR“ die traditionelle Ersatzlesung darstellt.
- issue: Bedeutungsweite von שְׁאֵרִית
  choice: Rest
  alternative: die Übriggebliebenen / der übrige Teil
  rationale: „Rest“ lässt sowohl die konkrete Bedeutung der verbliebenen Gemeinschaft als auch den prophetisch-theologischen Nachklang offen.
- issue: Wiedergabe des Titels יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  alternative: HERR der Heerscharen
  rationale: Die gewählte Form bewahrt zugleich den Gottesnamen und das Bild der Heerscharen, ohne die Wendung konfessionell auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an die hebräische Satzstruktur. Die dreifache Wiederholung von „den Geist“ bleibt als rhetorische Hervorhebung erhalten; die etwas markante Wendung „Rest des Volkes“ bewahrt die mögliche theologische Resonanz.
