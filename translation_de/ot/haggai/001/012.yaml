  naturalness: Die Satzfügung ist würdig und gut verständlich. „der gesamte Rest des Volkes“ klingt im modernen Standarddeutsch etwas idiomatischer als „der ganze Rest des Volkes“, ohne die Aussage zu verändern.
  terminology: „Jahwe“, „Hohepriester“, „Prophet“ und „Rest“ sind angemessen. „Josua“ stellt die Namensform genauer nach dem hebräischen Text her; „Serubbabel“, „Schealtiël“ und „Jozadak“ können beibehalten werden.
