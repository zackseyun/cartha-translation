  - severity: medium
    issue: „Jeschua“ entspricht nicht der in diesem Vers bezeugten Namensform יְהוֹשֻׁעַ.
    rationale: Der WLC-Text hat die volle Form Yehoshua, die im modernen Deutschen als „Josua“ wiederzugeben ist. „Jeschua“ entspricht einer verkürzten hebräischen/arameisierenden Form und wäre hier eine Angleichung an andere Stellen.
