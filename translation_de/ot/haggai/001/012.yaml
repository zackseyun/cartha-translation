revisions:
- from: Da hörten Serubbabel, der Sohn Schealtiëls, und Jeschua, der Sohn Jozadaks, der Hohepriester, sowie der ganze Rest des Volkes[a] auf die Stimme Jahwes, ihres Gottes, und auf die Worte des Propheten Haggai, weil[b] Jahwe, ihr Gott, ihn gesandt hatte. Und das Volk fürchtete sich vor Jahwe.[c]
  to: Da hörten Serubbabel, der Sohn Schealtiëls, und Josua, der Sohn Jozadaks, der Hohepriester, sowie der gesamte Rest des Volkes[a] auf die Stimme Jahwes, ihres Gottes, und auf die Worte des Propheten Haggai, wie[b] Jahwe, ihr Gott, ihn gesandt hatte. Und das Volk fürchtete sich vor Jahwe.[c]
  rationale: Die Revision korrigiert die deutsche Namensform entsprechend der tatsächlich vorliegenden hebräischen Vollform יְהוֹשֻׁעַ und ersetzt die in der Hauptfassung zu stark festgelegte kausale Deutung von כַּאֲשֶׁר durch „wie“. Die Fußnote bewahrt die mögliche kausale Deutung. Die geringfügige Umstellung zu „der gesamte Rest“ verbessert die natürliche deutsche Ausdrucksweise, ohne die prophetische Resonanz von שְׁאֵרִית zu verlieren.
