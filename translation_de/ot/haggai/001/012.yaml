source:
  edition: WLC
  text: וַ/יִּשְׁמַ֣ע זְרֻבָּבֶ֣ל בֶּֽן שַׁלְתִּיאֵ֡ל וִ/יהוֹשֻׁ֣עַ בֶּן יְהוֹצָדָק֩ הַ/כֹּהֵ֨ן הַ/גָּד֜וֹל וְ/כֹ֣ל שְׁאֵרִ֣ית הָ/עָ֗ם בְּ/קוֹל֙ יְהוָ֣ה אֱלֹֽהֵי/הֶ֔ם וְ/עַל דִּבְרֵי֙ חַגַּ֣י הַ/נָּבִ֔יא כַּ/אֲשֶׁ֥ר שְׁלָח֖/וֹ יְהוָ֣ה אֱלֹהֵי/הֶ֑ם וַ/יִּֽירְא֥וּ הָ/עָ֖ם מִ/פְּנֵ֥י יְהוָֽה׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/012.yaml
  text: Then Zerubbabel son of Shealtiel[a], and Joshua son of Jehozadak, the high priest, and all the remnant of the people, listened to the voice of Yahweh their God and to the words of Haggai the prophet, as Yahweh their God had sent him[d][c][b]; and the people feared before Yahweh.
translation:
  language: de
  text: Da hörten Serubbabel, der Sohn Schealtiëls, und Josua, der Sohn Jozadaks, der Hohepriester, sowie der gesamte Rest des Volkes[a] auf die Stimme Jahwes, ihres Gottes, und auf die Worte des Propheten Haggai, wie[b] Jahwe, ihr Gott, ihn gesandt hatte. Und das Volk fürchtete sich vor Jahwe.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle Übrigen des Volkes“. „Rest“ kann im prophetischen Sprachgebrauch zugleich die übrig gebliebene Gemeinschaft bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „weil Jahwe, ihr Gott, ihn gesandt hatte“. Das Hebräische kann hier einen Grund oder eine Entsprechung ausdrücken.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: „Und das Volk hatte Ehrfurcht vor Jahwe.“ Das hebräische Verb kann Furcht ebenso wie ehrfürchtige Scheu bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: hörten ... auf
  rationale: Die deutsche Wendung „auf jemanden hören“ umfasst aufmerksames Hören und responsive Beachtung, ohne die stärkere Bedeutung „gehorchen“ ausdrücklich festzulegen.
- source_word: שְׁאֵרִית הָעָם
  choice: der ganze Rest des Volkes
  rationale: „Rest“ ist natürliches Deutsch und bewahrt zugleich den im prophetischen Sprachgebrauch möglichen Nachklang der übrig gebliebenen Gemeinschaft.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: der Hohepriester
  rationale: Dies ist die etablierte deutsche Bezeichnung für das Amt und entspricht dem hebräischen Titel idiomatisch.
- source_word: בְּקוֹל יְהוָה אֱלֹהֵיהֶם
  choice: auf die Stimme Jahwes, ihres Gottes
  rationale: Mit „auf die Stimme ... hören“ wird die hebräische Konstruktion idiomatisch und eng am Wortlaut wiedergegeben; der Gottesname wird als Jahwe transliteriert.
- source_word: דִּבְרֵי חַגַּי הַנָּבִיא
  choice: die Worte des Propheten Haggai
  rationale: „Worte“ erhält die Parallelität zur „Stimme Jahwes“ und vermeidet eine unnötige Abstraktion zu „Botschaft“.
- source_word: כַּאֲשֶׁר שְׁלָחוֹ יְהוָה אֱלֹהֵיהֶם
  choice: weil Jahwe, ihr Gott, ihn gesandt hatte
  rationale: 'כַּאֲשֶׁר kann hier kausal verstanden werden: Das Volk hört auf Haggais Worte, weil er von Jahwe gesandt ist. Die mögliche vergleichende bzw. bestätigende Lesart wird in einer Fußnote erhalten.'
- source_word: וַיִּירְאוּ הָעָם מִפְּנֵי יְהוָה
  choice: Und das Volk fürchtete sich vor Jahwe
  rationale: Die Formulierung bewahrt die Mehrdeutigkeit von ירא zwischen Furcht und ehrfürchtiger Scheu besser als eine ausschließlich positive Umschreibung.
theological_decisions:
- issue: Bedeutung von שְׁאֵרִית im prophetischen Zusammenhang
  choice: der ganze Rest des Volkes
  alternative: alle Übrigen des Volkes
  rationale: „Rest“ kann sowohl die historisch verbliebene Bevölkerung als auch die prophetisch bedeutsame Restgemeinschaft bezeichnen, ohne eine dieser Ebenen auszuschließen.
- issue: Art der Reaktion in וַיִּשְׁמַע
  choice: hörten ... auf
  alternative: gehorchten
  rationale: Der Kontext legt eine gehorsame Reaktion nahe, doch das Verb bezeichnet zunächst ein Hören mit Beachtung. Die Übersetzung lässt beides anklingen, ohne vollzogenen Gehorsam in das einzelne Verb hineinzulesen.
- issue: Syntaktische Funktion von כַּאֲשֶׁר
  choice: weil
  alternative: so wie / entsprechend dem, dass
  rationale: Eine kausale Verknüpfung ist im Kontext gut verständlich und sprachlich natürlich; da die hebräische Konjunktion auch Vergleich oder Entsprechung ausdrücken kann, wird diese Alternative ausdrücklich vermerkt.
- issue: Nuance der Gottesfurcht
  choice: fürchtete sich vor Jahwe
  alternative: hatte Ehrfurcht vor Jahwe
  rationale: Die gewählte Fassung hält Furcht, Scheu und Ehrfurcht in Spannung und beschränkt den Ausdruck nicht auf eine rein positive religiöse Haltung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit vertrauter biblischer Satzmelodie. Die Namen folgen gebräuchlichen deutschen Bibelformen; „Jahwe“ gibt den persönlichen Gottesnamen wieder. Die koordinierte Struktur des hebräischen Satzes bleibt erkennbar, wurde aber durch deutsche Zeichensetzung lesbar gegliedert.
