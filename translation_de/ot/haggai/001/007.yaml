id: HAG.1.7
reference: Haggai 1:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כֹּ֥ה אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת שִׂ֥ימוּ לְבַבְ/כֶ֖ם עַל דַּרְכֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/007.yaml
  text: 'Thus says Yahweh of hosts: Consider your ways.'
translation:
  language: de
  text: 'So spricht Jahwe der Heerscharen: Denkt über eure Wege nach.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Richtet euer Herz auf eure Wege.“'
    reason: Die Fußnote bewahrt die konkrete hebräische Ausdrucksweise שִׂימוּ לְבַבְכֶם עַל, während der Haupttext ihre idiomatische Bedeutung natürlich wiedergibt.
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die feste prophetische Botenformel wird im Deutschen natürlich und zugleich würdevoll mit „So spricht“ wiedergegeben; das morphologische Perfekt אָמַר hat in dieser Formel präsentische Funktion.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: צְבָאוֹת
  choice: der Heerscharen
  rationale: Die traditionelle deutsche Wiedergabe wahrt die Bedeutungsbreite des Titels, ohne ausschließlich irdische oder himmlische Heere festzulegen.
- source_word: שִׂימוּ לְבַבְכֶם עַל
  choice: Denkt … nach
  rationale: Die wörtliche Wendung „richtet euer Herz auf“ fordert dazu auf, etwas aufmerksam zu bedenken. „Denkt … nach“ gibt diese idiomatische Bedeutung in heutigem Deutsch klar wieder; die konkrete Bildsprache wird in der Fußnote bewahrt.
- source_word: דַּרְכֵיכֶם
  choice: eure Wege
  rationale: „Wege“ erhält sowohl das hebräische Bild als auch dessen Sinn als Lebensführung beziehungsweise Verhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname steht ausdrücklich im Ausgangstext. Seine Wiedergabe als „Jahwe“ bewahrt die Unterscheidung zwischen Gottes Namen und einem bloßen Titel.
- issue: Bedeutungsumfang von צְבָאוֹת
  choice: der Heerscharen
  alternative: der himmlischen Heere
  rationale: Der hebräische Ausdruck kann unterschiedlich verstandene Heerscharen bezeichnen. Die Übersetzung vermeidet eine theologische Einengung auf ausschließlich himmlische Wesen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdevoller prophetischer Sprachform. „Heerscharen“ ist bewusst traditionell, da es den festen Gottestitel prägnant und ohne unnötige Festlegung wiedergibt.
