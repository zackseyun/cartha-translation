id: HAG.1.10
reference: Haggai 1:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: עַל כֵּ֣ן עֲלֵי/כֶ֔ם כָּלְא֥וּ שָמַ֖יִם מִ/טָּ֑ל וְ/הָ/אָ֖רֶץ כָּלְאָ֥ה יְבוּלָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/010.yaml
  text: Therefore the heavens above you have withheld the dew[a], and the earth has withheld its produce.
translation:
  language: de
  text: Darum hat der Himmel über euch den Tau zurückgehalten, und die Erde hat ihren Ertrag zurückgehalten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und das Land hat seinen Ertrag zurückgehalten“. Das hebräische Wort אֶרֶץ kann sowohl „Erde“ als auch „Land“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Darum
  rationale: Die geläufige Folgerungsformel bewahrt den ursächlichen Anschluss an den vorausgehenden Tadel und klingt im modernen Deutsch natürlich.
- source_word: עֲלֵיכֶם
  choice: über euch
  rationale: In Verbindung mit „Himmel“ ist die räumliche Bedeutung der Präposition am naheliegendsten.
- source_word: כָּלְאוּ / כָּלְאָה
  choice: hat … zurückgehalten
  rationale: כלא bezeichnet hier das Vorenthalten beziehungsweise Zurückhalten. Die gleiche Wiedergabe in beiden Satzhälften wahrt den hebräischen Parallelismus.
- source_word: שָׁמַיִם
  choice: der Himmel
  rationale: Obwohl das hebräische Wort formal pluralisch ist, bezeichnet es hier den Himmel als Bereich über den Menschen; der deutsche Singular ist idiomatisch und würdevoll.
- source_word: מִטָּל
  choice: den Tau
  rationale: Nach כלא kennzeichnet מן das, was vorenthalten wird; im Deutschen ist „den Tau zurückhalten“ die natürliche Wiedergabe.
- source_word: וְהָאָרֶץ
  choice: und die Erde
  rationale: אֶרֶץ kann „Erde“ oder „Land“ bedeuten. Die Gegenüberstellung mit dem Himmel spricht im Haupttext für „Erde“, ohne die örtliche Bedeutung auszuschließen.
- source_word: יְבוּלָהּ
  choice: ihren Ertrag
  rationale: יְבוּל bezeichnet den landwirtschaftlichen Ertrag beziehungsweise die hervorgebrachten Früchte. „Ertrag“ ist prägnant und bewahrt die Bildweite.
theological_decisions:
- issue: 'Bezug von אֶרֶץ: kosmische Erde oder örtliches Land'
  choice: Erde
  alternative: Land
  rationale: Der Parallelismus „Himmel … Erde“ stützt die kosmische Formulierung; im Zusammenhang der Dürre kann zugleich das konkrete Land gemeint sein. Diese Mehrdeutigkeit wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Klang. Die Wiederholung von „zurückgehalten“ bildet den Parallelismus des Hebräischen bewusst ab.
