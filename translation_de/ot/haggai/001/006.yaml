  text: זְרַעְתֶּ֨ם הַרְבֵּ֜ה וְ/הָבֵ֣א מְעָ֗ט אָכ֤וֹל וְ/אֵין לְ/שָׂבְעָה֙ שָׁת֣וֹ וְ/אֵין לְ/שָׁכְרָ֔ה לָב֖וֹשׁ וְ/אֵין לְ/חֹ֣ם ל֑/וֹ וְ/הַ֨/מִּשְׂתַּכֵּ֔ר מִשְׂתַּכֵּ֖ר אֶל צְר֥וֹר נָקֽוּב־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/006.yaml
  text: You have sown much[a], but brought in little. You eat, but there is not enough to be satisfied; you drink, but there is not enough to be filled; you clothe yourselves, but no one is warm[c][b]; and the one who earns wages earns them for a bag with holes.
translation:
  language: de
  text: Ihr habt viel gesät, aber wenig eingebracht.[a] Ihr esst, werdet aber nicht satt; ihr trinkt, werdet aber nicht berauscht;[b] ihr zieht euch an, aber keinem wird warm;[c] und wer Lohn verdient, verdient ihn in einen durchlöcherten Beutel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aber wenig geerntet“. Wörtlich steht im Hebräischen: „aber wenig eingebracht“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „aber nicht bis zur Trunkenheit“. Das hebräische Wort bezeichnet ausdrücklich das Berauschtwerden.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „aber ihm wird nicht warm“. Der Singular ist allgemein gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְרַעְתֶּם הַרְבֵּה
  choice: Ihr habt viel gesät
  rationale: Das Perfekt in direkter Anrede bezeichnet die bereits vollzogene Aussaat mit gegenwärtig spürbaren Folgen; „viel“ gibt die adverbiale Mengenangabe knapp wieder.
- source_word: וְהָבֵא מְעָט
  choice: aber wenig eingebracht
  rationale: „Einbringen“ bewahrt das hebräische Bild des Hereinbringens der Ernte und ist im Deutschen zugleich ein verständlicher landwirtschaftlicher Ausdruck.
- source_word: אָכוֹל וְאֵין לְשָׂבְעָה
  choice: Ihr esst, werdet aber nicht satt
  rationale: Die knappe deutsche Gegenüberstellung bildet das Essen ohne eintretende Sättigung natürlich und präzise ab.
- source_word: שָׁתוֹ וְאֵין לְשָׁכְרָה
  choice: ihr trinkt, werdet aber nicht berauscht
  rationale: Die Wurzel שׁכר bezeichnet hier Rausch beziehungsweise Trunkenheit, nicht bloß das Stillen von Durst. „Berauscht“ wahrt den spezifischen Sinn ohne unnötig grobe Ausdrucksweise.
- source_word: לָבוֹשׁ וְאֵין לְחֹם לוֹ
  choice: ihr zieht euch an, aber keinem wird warm
  rationale: Der singularische Ausdruck „ihm“ ist generisch. „Keinem wird warm“ gibt diese allgemeine Aussage in idiomatischem Deutsch wieder.
- source_word: וְהַמִּשְׂתַּכֵּר מִשְׂתַּכֵּר
  choice: und wer Lohn verdient, verdient ihn
  rationale: Die Wiederholung von „verdient“ erhält die betonte Wiederholung des hebräischen Partizips und Verbs.
- source_word: אֶל צְרוֹר נָקוּב
  choice: für einen durchlöcherten Beutel
  rationale: Die Formulierung bewahrt das anschauliche Bild eines Geldbeutels, aus dem der Lohn wegen der Löcher wieder verloren geht.
theological_decisions:
- issue: Bedeutung von לְשָׁכְרָה
  choice: werdet aber nicht berauscht
  alternative: bekommt aber nicht genug / werdet aber nicht satt
  rationale: Der hebräische Ausdruck benennt spezifisch das Berauschtwerden. Eine Verallgemeinerung zu bloßer ausreichender Flüssigkeitsmenge würde die lexikalische Spannung abschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knappen, rhythmisch parallelen Sätzen. Die anklagende Folge vergeblicher Tätigkeiten bleibt erhalten; unnötige konfessionelle oder auslegende Zusätze wurden vermieden.
