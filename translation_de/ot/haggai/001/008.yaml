source:
  edition: WLC
  text: עֲל֥וּ הָ/הָ֛ר וַ/הֲבֵאתֶ֥ם עֵ֖ץ וּ/בְנ֣וּ הַ/בָּ֑יִת וְ/אֶרְצֶה בּ֥/וֹ ו/אכבד אָמַ֥ר יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/008.yaml
  text: Go up into the hills[a], bring wood, and build the house, so that I may take pleasure in it and be glorified[c][b], says Yahweh.
translation:
  language: de
  text: Steigt ins Bergland hinauf[a], bringt Holz herbei und baut das Haus[b], damit ich Gefallen daran finde und geehrt werde[c], spricht Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf den Berg“ beziehungsweise „in die Hügel“. Das hebräische Wort kann einen einzelnen Berg, eine Anhöhe oder eine bergige Gegend bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Gemeint ist der Tempel; wörtlich: „das Haus“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „verherrlicht werde“.'
    reason: alternative_reading
lexical_decisions:
- source_word: עֲלוּ
  choice: Steigt … hinauf
  rationale: Der Qal-Imperativ Plural von עלה bezeichnet das Hinaufgehen; die trennbare deutsche Formulierung gibt Befehl und Bewegungsrichtung natürlich wieder.
- source_word: הָהָר
  choice: ins Bergland
  rationale: הַר kann einen Berg, eine Anhöhe oder eine bergige Gegend bezeichnen. Im Zusammenhang der Holzbeschaffung ist „Bergland“ eine natürliche, nicht übermäßig festlegende Wiedergabe.
- source_word: וַהֲבֵאתֶם עֵץ
  choice: holt Holz
  rationale: Die Hifil-Form von בוא bedeutet hier, Holz herbeizubringen. Im Deutschen gibt „holt Holz“ die auf den Bauplatz gerichtete Handlung idiomatisch wieder; עֵץ steht als Stoffbezeichnung.
- source_word: וּבְנוּ
  choice: und baut
  rationale: Der Qal-Imperativ Plural von בנה bedeutet schlicht „bauen“. „Wiederaufbauen“ wäre kontextuell möglich, fügte aber eine im Verb selbst nicht ausdrücklich markierte Bedeutung hinzu.
- source_word: הַבַּיִת
  choice: das Haus
  rationale: בַּיִת bedeutet wörtlich „Haus“ und bezeichnet hier den Tempel. Die Wiedergabe bewahrt die Ausdrucksweise des hebräischen Textes; eine Fußnote klärt den Bezug.
- source_word: וְאֶרְצֶה בּוֹ
  choice: damit ich daran Gefallen habe
  rationale: רצה kann „Gefallen haben“, „Wohlgefallen finden“ oder „wohlwollend annehmen“ bedeuten. Die Zweckformulierung verbindet die gebotenen Handlungen natürlich mit der göttlichen Reaktion; בוֹ wird mit „daran“ aufgenommen.
- source_word: ואכבד
  choice: und geehrt werde
  rationale: Die überlieferte Konsonantenfolge wird als Niphal von כבד verstanden. „Geehrt werde“ bewahrt die passive Bedeutung und ist in modernem Deutsch natürlicher als „verherrlicht werde“; diese Alternative bleibt in der Fußnote erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als persönlicher Gottesname „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Namen ausdrücklich. „Jahwe“ bewahrt diesen, statt ihn durch den traditionellen Ersatztitel wiederzugeben.
- issue: Tempelbezeichnung הַבַּיִת
  choice: das Haus
  alternative: der Tempel
  rationale: Obwohl im Kontext eindeutig der Tempel gemeint ist, lautet das hebräische Wort „Haus“. Der Haupttext wahrt diese Metapher, während die Fußnote den Bezug erklärt.
- issue: Bedeutung und Textgestalt von ואכבד
  choice: und geehrt werde
  alternative: und verherrlicht werde / und meine Herrlichkeit erweise
  rationale: Der masoretisch verstandene Niphal lässt eine passive Wiedergabe als „geehrt“ oder „verherrlicht“ zu. Die Übersetzung entscheidet sich für natürliches Deutsch, ohne die theologisch gewichtige Alternative zu verschweigen. Die aktive Lesart beruht auf einer abweichenden Vokalisierung beziehungsweise alten Übersetzungstradition und wird nicht in den Haupttext übernommen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Befehlsfolge. „Bergland“ hält die räumliche Bedeutung offen, „das Haus“ bewahrt die hebräische Tempelbezeichnung, und „spricht Jahwe“ entspricht einer knappen prophetischen Botenformel.
