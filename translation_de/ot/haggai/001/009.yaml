base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/009.yaml
  text: You looked for much[a], but behold, it was little; and when you brought it home, I blew it away. Why? declares Yahweh of Armies. Because of my house, which lies in ruins[b], while each of you runs to his own house.
translation:
  language: de
  text: 'Ihr habt nach vielem Ausschau gehalten, doch siehe: Es war wenig. Und als ihr es nach Hause brachtet, blies ich es fort.[a] Warum? – Ausspruch Jahwes der Heerscharen. Weil mein Haus in Trümmern liegt, während jeder von euch zu seinem eigenen Haus eilt.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „blies ich darauf“; gemeint sein kann, dass Jahwe den eingebrachten Ertrag durch seinen Hauch fortblies oder schwinden ließ.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „während ihr lauft, jeder zu seinem eigenen Haus“; „eilt“ gibt die mit dem Laufen verbundene Eile idiomatisch wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּנֹה אֶל הַרְבֵּה
  choice: Ihr habt nach vielem Ausschau gehalten
  rationale: Die Wendung bezeichnet im Kontext die Erwartung eines reichen Ertrags. „Nach vielem Ausschau halten“ wahrt das Bild des Sich-Hinwendens bzw. Ausschauhaltens, ohne die Erwartung bloß abstrakt wiederzugeben.
- source_word: וְהִנֵּה לִמְעָט
  choice: doch siehe, es wurde wenig
  rationale: הִנֵּה wird mit dem würdevollen, aufmerksamkeitslenkenden „siehe“ wiedergegeben; לִמְעָט beschreibt das enttäuschende geringe Ergebnis.
- source_word: וַהֲבֵאתֶם הַבַּיִת
  choice: als ihr es nach Hause brachtet
  rationale: Das ungenannte Objekt ist der Ertrag; הַבַּיִת bezeichnet hier am natürlichsten das Zuhause, im Kontrast zu dem später genannten Haus Jahwes.
- source_word: וְנָפַחְתִּי בוֹ
  choice: blies ich es fort
  rationale: נפח bedeutet wörtlich „blasen, hauchen“. „Fortblasen“ bewahrt das Bild und macht im Deutschen die vernichtende Wirkung verständlich, ohne sie übermäßig auszudeuten.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: Ausspruch Jahwes der Heerscharen
  rationale: נְאֻם ist eine prophetische Ausspruchsformel. „Jahwe“ gibt den Gottesnamen wieder; „der Heerscharen“ ist im Deutschen die etablierte, breite Bedeutung wahrende Wiedergabe von צְבָאוֹת.
- source_word: יַעַן בֵּיתִי אֲשֶׁר הוּא חָרֵב
  choice: Weil mein Haus in Trümmern liegt
  rationale: חָרֵב bezeichnet den verwüsteten beziehungsweise verödeten Zustand des Tempels. „In Trümmern liegt“ ist anschaulich und natürlich.
- source_word: וְאַתֶּם רָצִים אִישׁ לְבֵיתוֹ
  choice: während ihr euch jeder um sein eigenes Haus bemüht
  rationale: רוץ bedeutet grundsätzlich „laufen/eilen“, kann hier aber das eifrige Betreiben der eigenen Hausangelegenheiten ausdrücken. Die distributive Form אִישׁ ... לְבֵיתוֹ bleibt durch „jeder ... sein eigenes Haus“ erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von צְבָאוֹת
  choice: der Heerscharen
  alternative: der Heere
  rationale: „Heerscharen“ wahrt die mögliche Weite des Ausdrucks für himmlische und irdische Scharen; „Heere“ wäre moderner, könnte die Bedeutung jedoch stärker auf militärische Verbände verengen.
- issue: Sinn von רָצִים im Kontrast zum vernachlässigten Tempel
  choice: euch ... bemüht
  alternative: eilt
  rationale: Die Wahl hebt den Eifer für die eigenen Häuser hervor, ohne anzunehmen, dass lediglich eine körperliche Laufbewegung gemeint ist. Die wörtlichere Alternative wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener prophetischer Prägnanz. „Siehe“ und „Ausspruch“ markieren bewusst den biblisch-prophetischen Ton; die Satzführung bleibt für heutige Leser verständlich. Sämtliche Fußnotenmarker stehen im Haupttext.
