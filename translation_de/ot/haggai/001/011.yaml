  text: וָ/אֶקְרָ֨א חֹ֜רֶב עַל הָ/אָ֣רֶץ וְ/עַל הֶ/הָרִ֗ים וְ/עַל הַ/דָּגָן֙ וְ/עַל הַ/תִּיר֣וֹשׁ וְ/עַל הַ/יִּצְהָ֔ר וְ/עַ֛ל אֲשֶׁ֥ר תּוֹצִ֖יא הָ/אֲדָמָ֑ה וְ/עַל הָֽ/אָדָם֙ וְ/עַל הַ/בְּהֵמָ֔ה וְ/עַ֖ל כָּל יְגִ֥יעַ כַּפָּֽיִם־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/011.yaml
  text: And I called for a drought on the land and on the mountains[a], on the grain, on the new wine, on the fresh oil, on what the ground produces, on man and on beast[b], and on all the labor of the hands.
translation:
  language: de
  text: Und ich rief eine Dürre über das Land und über die Berge, über das Getreide, über den jungen Wein, über das frische Öl[a], über alles, was der Ackerboden hervorbringt, über den Menschen[b] und über das Vieh und über alle Arbeit ihrer Hände herbei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist wahrscheinlich Olivenöl.
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort steht in der Einzahl und meint hier die Menschen beziehungsweise die Menschheit allgemein.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶקְרָא
  choice: ich rief
  rationale: קרא bezeichnet hier das wirksame Herbeirufen des Gerichts. „Ich rief eine Dürre über …“ bewahrt die göttliche Urheberschaft und die wiederholte Präposition des Hebräischen.
- source_word: חֹרֶב
  choice: Dürre
  rationale: Im Zusammenhang mit Land, Feldfrüchten, Menschen und Vieh bezeichnet חֹרֶב am natürlichsten eine Dürre beziehungsweise austrocknende Trockenheit.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Gemeint ist hier das betroffene Land als Lebens- und Anbaugebiet, nicht die gesamte Erde.
- source_word: הֶהָרִים
  choice: die Berge
  rationale: Die direkte Wiedergabe erhält die geografische Spannweite und den prophetischen Sprachklang.
- source_word: הַדָּגָן
  choice: das Getreide
  rationale: דָּגָן ist die allgemeine Bezeichnung für Getreideerzeugnisse.
- source_word: הַתִּירוֹשׁ
  choice: der junge Wein
  rationale: תִּירוֹשׁ bezeichnet Wein als frisches landwirtschaftliches Erzeugnis. „Junger Wein“ ist verständlich, ohne den Begriff eindeutig auf unvergorenen Most festzulegen.
- source_word: הַיִּצְהָר
  choice: das frische Öl
  rationale: יִצְהָר bezeichnet frisch gewonnenes Öl, gewöhnlich Olivenöl. Die Übersetzung wahrt die landwirtschaftliche Nuance; die wahrscheinlich gemeinte Ölsorte wird in einer Fußnote erläutert.
- source_word: אֲשֶׁר תּוֹצִיא הָאֲדָמָה
  choice: alles, was der Ackerboden hervorbringt
  rationale: Die Formulierung bewahrt das Bild des Bodens, der Ertrag hervorbringt, und fasst umfassend dessen Erzeugnisse zusammen.
- source_word: הָאָדָם
  choice: den Menschen
  rationale: Der bestimmte generische Singular bezeichnet hier die Menschheit beziehungsweise Menschen allgemein und steht rhetorisch dem Vieh gegenüber. Der deutsche Singular erhält diese Form.
- source_word: הַבְּהֵמָה
  choice: das Vieh
  rationale: Im agrarischen Zusammenhang bezeichnet בְּהֵמָה besonders die domestizierten Tiere; „Vieh“ ist dafür präzise und idiomatisch.
- source_word: כָּל יְגִיעַ כַּפָּיִם
  choice: alle Arbeit ihrer Hände
  rationale: Die Wendung bezeichnet die menschliche Mühe und deren Ertrag. Das Possessivpronomen stellt im Deutschen den natürlichen Bezug zu den Menschen her, während das Bild der Hände erhalten bleibt.
theological_decisions:
- issue: Generischer Sinn von הָאָדָם
  choice: den Menschen
  alternative: die Menschen / die Menschheit
  rationale: Der hebräische Text verwendet einen bestimmten Singular für Menschen allgemein und stellt ihn בְּהֵמָה gegenüber. „Den Menschen“ bewahrt Singular und rhetorische Paarung; die Fußnote macht den kollektiven Sinn ausdrücklich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Konstruktion „über …“ bildet die eindringliche Reihung des Hebräischen ab. „Ackerboden“ unterscheidet אֲדָמָה sachgerecht von אֶרֶץ („Land“).
