lexical_decisions:
- source_word: בְּיוֹם
  choice: am … Tag
  rationale: Die Präposition בְּ bezeichnet in dieser Datumsformel den Zeitpunkt; im Deutschen ist „am … Tag“ die natürliche Entsprechung.
- source_word: עֶשְׂרִים וְאַרְבָּעָה
  choice: vierundzwanzigsten
  rationale: Die hebräische Kardinalzahl wird in einer deutschen Datumsangabe idiomatisch als Ordinalzahl wiedergegeben.
- source_word: לַחֹדֶשׁ בַּשִּׁשִּׁי
  choice: des sechsten Monats
  rationale: Die beiden Ausdrücke bilden zusammen die Monatsangabe; „des sechsten Monats“ ist im Deutschen präzise und natürlich.
- source_word: בִּשְׁנַת שְׁתַּיִם
  choice: im zweiten Jahr
  rationale: Die hebräische Wendung ist eine übliche Formel zur Angabe eines Regierungsjahres; Deutsch verwendet hier eine Ordinalzahl.
- source_word: לְדָרְיָוֶשׁ הַמֶּלֶךְ
  choice: des Königs Darius
  rationale: Das לְ ordnet das Regierungsjahr Darius zu. „des Königs Darius“ bewahrt den Königstitel und entspricht natürlichem, würdigem Deutsch.
