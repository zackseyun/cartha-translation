  text: כֹּ֥ה אָמַ֛ר יְהוָ֥ה צְבָא֖וֹת לֵ/אמֹ֑ר הָ/עָ֤ם הַ/זֶּה֙ אָֽמְר֔וּ לֹ֥א עֶת בֹּ֛א עֶת בֵּ֥ית יְהוָ֖ה לְ/הִבָּנֽוֹת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/002.yaml
  text: 'Thus says Yahweh of hosts: These people say[a], “The time has not come[b], the time for the house of Yahweh to be rebuilt.”'
translation:
  language: de
  text: 'So spricht Jahwe der Heerscharen: Dieses Volk sagt[a]: »Die Zeit ist nicht gekommen, die Zeit, in der das Haus Jahwes wieder aufgebaut wird[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb steht im Plural und lautet wörtlich »haben gesagt«. Die Formulierung kann einen Ton der Distanz oder Zurechtweisung tragen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »gebaut wird«. Der hebräische Infinitiv enthält nicht ausdrücklich die Bedeutung »wieder-«; der nachexilische Zusammenhang weist jedoch auf den Wiederaufbau hin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die geläufige deutsche Prophetenformel bewahrt den feierlichen Botenstil; das hebräische Perfekt wird darin idiomatisch präsentisch wiedergegeben.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben. »Heerscharen« lässt die mögliche Breite himmlischer und irdischer Heere bestehen und entspricht dem etablierten würdevollen Register.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der hebräische Ausdruck zur Einführung direkter Rede wird im Deutschen natürlich durch einen Doppelpunkt vertreten.
- source_word: הָעָם הַזֶּה
  choice: Dieses Volk
  rationale: Die Formulierung entspricht Numerus und Demonstrativ des Hebräischen und kann zugleich die mitschwingende Distanz oder Zurechtweisung tragen.
- source_word: אָמְרוּ
  choice: sagt
  rationale: Obwohl die hebräische Form formal pluralisch ist, verlangt das deutsche Kollektivsingular »Volk« ein singularisches Verb. Das Präsens gibt die fortdauernde Haltung im Zusammenhang natürlich wieder.
- source_word: לֹא עֶת בֹּא עֶת
  choice: Die Zeit ist nicht gekommen, die Zeit
  rationale: Die bewusst knappe Wiederholung von עֶת bleibt erhalten. »Ist nicht gekommen« bildet בֹּא idiomatisch und ohne ein im Hebräischen nicht ausdrücklich vorhandenes »noch« ab.
- source_word: בֵּית יְהוָה
  choice: das Haus Jahwes
  rationale: »Haus« bewahrt die hebräische Bezeichnung, statt sie auslegend durch »Tempel« zu ersetzen; der Gottesname bleibt ausdrücklich erhalten.
- source_word: לְהִבָּנוֹת
  choice: wieder aufgebaut wird
  rationale: 'Der Nifal-Infinitiv ist passiv: »gebaut zu werden«. Im nachexilischen Zusammenhang handelt es sich um den Wiederaufbau; die Fußnote hält die formal engere Wiedergabe offen.'
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Text verwendet den Eigennamen Gottes. »Jahwe« gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Rhetorische Färbung von הָעָם הַזֶּה
  choice: Dieses Volk
  alternative: Diese Leute
  rationale: »Dieses Volk« ist formal nah, natürlich und würdevoll und lässt einen Ton der Distanz oder Zurechtweisung erkennen, ohne ihn stärker festzulegen.
- issue: Historische Präzisierung von לְהִבָּנוֹת
  choice: wieder aufgebaut wird
  alternative: gebaut wird
  rationale: Die nachexilische Situation macht den Wiederaufbau des zerstörten Tempels zum gemeinten Vorgang. Da das Präfix »wieder-« lexikalisch nicht ausdrücklich dasteht, wird die engere Alternative in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener prophetischer Formel und rhetorischer Wiederholung. Die Syntax wurde nur so weit geglättet, dass sie verständlich bleibt; echte Bedeutungsnuancen werden in den Fußnoten offengehalten.
