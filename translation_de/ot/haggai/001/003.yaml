id: HAG.1.3
reference: Haggai 1:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה בְּ/יַד חַגַּ֥י הַ/נָּבִ֖יא לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/003.yaml
  text: Then the word of Yahweh came by the hand of Haggai the prophet[a], saying,
translation:
  language: de
  text: 'Da erging das Wort Jahwes durch Haggai, den Propheten[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „durch die Hand Haggais, des Propheten“. Die hebräische Wendung bezeichnet die Vermittlung durch eine Person.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Da erging
  rationale: Die narrative Verbfolge führt das nächste Geschehen ein. Zusammen mit דְּבַר יְהוָה entspricht „Da erging das Wort Jahwes“ einer natürlichen und würdigen deutschen Prophetenformel.
- source_word: דְּבַר
  choice: das Wort
  rationale: In dieser prophetischen Formel bezeichnet דָּבָר die göttliche Botschaft. „Wort“ bewahrt den geprägten Offenbarungsbegriff.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: בְּיַד
  choice: durch
  rationale: Das hebräische Idiom bedeutet wörtlich „durch die Hand von“ und kennzeichnet Haggai als Vermittler. Im heutigen Deutsch gibt „durch“ diese instrumentale Bedeutung klar und natürlich wieder; der Wortlaut des Idioms wird in der Fußnote genannt.
- source_word: חַגַּי
  choice: Haggai
  rationale: Der Personenname wird in seiner etablierten deutschen biblischen Form wiedergegeben.
- source_word: הַנָּבִיא
  choice: den Propheten
  rationale: Die Apposition bezeichnet Haggais Amt. Der Akkusativ folgt im Deutschen aus der durch בְּיַד ausgedrückten Vermittlung und der Wiedergabe mit „durch“.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv leitet die unmittelbar folgende Gottesrede ein. Im natürlichen modernen Deutsch erfüllt der Doppelpunkt diese Funktion präziser als das schwerfällige „indem er sprach“ oder „mit den Worten“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen Gottes. „Jahwe“ bewahrt diesen Namen, statt ihn durch einen Titel zu ersetzen, und verwendet die im modernen Deutschen übliche Lautform.
- issue: Haggais Rolle bei der Übermittlung des Gotteswortes
  choice: durch Haggai
  alternative: durch die Hand Haggais
  rationale: בְּיַד stellt Haggai als vermittelndes Werkzeug beziehungsweise als Überbringer dar. „Durch“ wahrt diese Aussage, ohne über die Art der Inspiration oder Vermittlung hinauszugehen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die feste Formel „das Wort Jahwes erging“ bleibt erkennbar; der Doppelpunkt leitet idiomatisch die folgende direkte Rede ein.
