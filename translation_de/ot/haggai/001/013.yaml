id: HAG.1.13
reference: Haggai 1:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ֠/יֹּאמֶר חַגַּ֞י מַלְאַ֧ךְ יְהוָ֛ה בְּ/מַלְאֲכ֥וּת יְהוָ֖ה לָ/עָ֣ם לֵ/אמֹ֑ר אֲנִ֥י אִתְּ/כֶ֖ם נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/013.yaml
  text: Then Haggai[a], the messenger of Yahweh, spoke to the people with Yahweh’s message, saying[b], “I am with you,” declares Yahweh.
translation:
  language: de
  text: 'Da sagte Haggai, der Bote Jahwes,[a] im Auftrag Jahwes[b] zum Volk: »Ich bin mit euch«, spricht Jahwe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit »Bote« ist hier Haggai als menschlicher Gesandter Jahwes gemeint, nicht ein Engelwesen.
    reason: alternative_reading
  - marker: b
    text: Wörtlicher etwa »im Botendienst Jahwes«; die hebräische Wendung kann den Auftrag oder die Funktion bezeichnen, in der Haggai sprach.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das häufige Verb für »sagen« wird im fortlaufenden Erzählzusammenhang natürlich mit »Da sagte« wiedergegeben.
- source_word: מַלְאַךְ יְהוָה
  choice: der Bote Jahwes
  rationale: מַלְאַךְ bezeichnet hier den ausdrücklich genannten Propheten Haggai als menschlichen Gesandten Jahwes, nicht ein Engelwesen.
- source_word: בְּמַלְאֲכוּת יְהוָה
  choice: im Auftrag Jahwes
  rationale: Die seltene Wendung bezeichnet den Botendienst beziehungsweise die Beauftragung durch Jahwe. »Im Auftrag Jahwes« ist im heutigen Deutsch klar und natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; »Jahwe« ist die im Deutschen geläufige Form.
- source_word: לָעָם
  choice: zum Volk
  rationale: Gemeint ist die von Haggai angesprochene Gemeinschaft; »zum Volk« gibt den Bezug knapp und idiomatisch wieder.
- source_word: לֵאמֹר
  choice: Doppelpunkt vor der direkten Rede
  rationale: Der hebräische Einleitungsinfinitiv wird im Deutschen natürlich durch die syntaktische Einführung des Zitats mit Doppelpunkt ausgedrückt.
- source_word: אֲנִי אִתְּכֶם
  choice: Ich bin mit euch
  rationale: Die knappe Zusage wird wörtlich und mit ihrem möglichen bundestheologischen Gewicht bewahrt; »euch« gibt die Pluralform wieder.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Die feste prophetische Autoritätsformel wird in würdigem, verständlichem Deutsch wiedergegeben.
theological_decisions:
- issue: Bedeutung von מַלְאַךְ in Bezug auf Haggai
  choice: menschlicher »Bote«
  alternative: »Engel Jahwes«
  rationale: Da Haggai namentlich genannt und als Jahwes Beauftragter bezeichnet wird, ist ein menschlicher Gesandter gemeint. »Engel« würde hier unbegründet ein himmlisches Wesen nahelegen.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Gottesnamen. Die Wiedergabe als »Jahwe« bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Verhältnis von מַלְאַךְ יְהוָה und בְּמַלְאֲכוּת יְהוָה
  choice: Rollenbezeichnung und göttlicher Auftrag werden beide ausdrücklich wiedergegeben
  alternative: eine der beiden Wendungen als bloße Wiederholung auslassen
  rationale: Die auffällige Wiederaufnahme des Botenbegriffs gehört zum hebräischen Text. Die Übersetzung bewahrt beide Aussagen, formuliert die zweite jedoch idiomatisch als »im Auftrag Jahwes«.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem prophetischem Ton. Die Satzstellung bleibt natürlich, während die doppelte Bezugnahme auf Haggais Botenrolle und Jahwes Auftrag erhalten bleibt.
