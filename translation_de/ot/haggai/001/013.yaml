  terminology: „Bote Jahwes“ trifft מַלְאַךְ יְהוָה im gegebenen Kontext besser als „Engel“. „Jahwe“ gibt das Tetragramm als Eigenname konsistent wieder. „Im Auftrag Jahwes“ ist eine vertretbare, idiomatische Wiedergabe der schwierigen Wendung בְּמַלְאֲכוּת יְהוָה und wird durch die Fußnote angemessen erläutert.
