base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/004.yaml
  text: Is it a time for you yourselves to live in your paneled houses while this house lies in ruins?[a]
translation:
  language: de
  text: Ist es etwa für euch selbst an der Zeit, in euren getäfelten Häusern zu wohnen, während dieses Haus in Trümmern liegt?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Häusern mit Deckenverkleidung“; gemeint sind ausgebaute oder mit Holz verkleidete Häuser.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעֵת
  choice: Ist es etwa … an der Zeit
  rationale: Die Frage greift die Zeitbehauptung aus Vers 2 rhetorisch auf. „Etwa“ macht den vorwurfsvollen Fragecharakter im Deutschen natürlich hörbar, ohne das Urteil vorwegzunehmen.
- source_word: לָכֶם אַתֶּם
  choice: für euch selbst
  rationale: Das selbstständige Pronomen אַתֶּם verstärkt das bereits in לָכֶם enthaltene „euch“. „Für euch selbst“ bewahrt diese pointierte Hervorhebung.
- source_word: לָשֶׁבֶת
  choice: zu wohnen
  rationale: ישׁב bedeutet in Verbindung mit Häusern „wohnen“. Diese Wiedergabe ist im modernen Deutsch idiomatisch und bleibt näher am räumlichen Bild als eine freiere Formulierung.
- source_word: בְּבָתֵּיכֶם
  choice: in euren … Häusern
  rationale: „Häuser“ erhält den konkreten sprachlichen Gegensatz zu „dieses Haus“ im zweiten Satzteil.
- source_word: סְפוּנִים
  choice: getäfelten
  rationale: Das passive Partizip bezeichnet mit Material, besonders Holz, verkleidete beziehungsweise ausgebaute Häuser. „Getäfelt“ gibt die Vorstellung einer aufwendig verkleideten Innenfläche knapp und verständlich wieder; die mögliche Bedeutung „mit Decken versehen“ bleibt in der Fußnote erhalten.
- source_word: וְהַבַּיִת הַזֶּה
  choice: während dieses Haus
  rationale: Das ו verbindet hier zwei scharf kontrastierende Zustände. „Während“ bringt diese rhetorische Gegenüberstellung natürlich zum Ausdruck, ohne ein zusätzliches explizites „aber“ einzuführen.
- source_word: חָרֵב
  choice: in Trümmern liegt
  rationale: Das Adjektiv beschreibt den verwüsteten, ruinösen Zustand. „In Trümmern liegt“ ist eine natürliche deutsche Zustandsbeschreibung und lässt die fortdauernde Vernachlässigung erkennen.
theological_decisions:
- issue: Bezug von „dieses Haus“
  choice: Die Formulierung „dieses Haus“ wird beibehalten; im Kontext bezeichnet sie den Tempel des HERRN.
  alternative: Das Wort „Tempel“ ausdrücklich in den Haupttext einsetzen.
  rationale: Haggai 1,2.8–9 identifiziert das Haus eindeutig als den Tempel. Dennoch bewahrt „dieses Haus“ die konkrete Ausdrucksweise und die Wiederholung des Hebräischen, statt die kontextuelle Identifikation in den Wortlaut einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit deutlich rhetorischem Ton. Die Wiederholung von „Haus/Häusern“ und die emphatische Wendung „für euch selbst“ bewahren den Vorwurf des hebräischen Textes. Die Fußnote hält die lexikalische Spannweite von סְפוּנִים offen.
