source:
  edition: WLC
  text: בִּ/שְׁנַ֤ת שְׁתַּ֨יִם֙ לְ/דָרְיָ֣וֶשׁ הַ/מֶּ֔לֶךְ בַּ/חֹ֨דֶשׁ֙ הַ/שִּׁשִּׁ֔י בְּ/י֥וֹם אֶחָ֖ד לַ/חֹ֑דֶשׁ הָיָ֨ה דְבַר יְהוָ֜ה בְּ/יַד חַגַּ֣י הַ/נָּבִ֗יא אֶל זְרֻבָּבֶ֤ל בֶּן שְׁאַלְתִּיאֵל֙ פַּחַ֣ת יְהוּדָ֔ה וְ/אֶל יְהוֹשֻׁ֧עַ בֶּן יְהוֹצָדָ֛ק הַ/כֹּהֵ֥ן הַ/גָּד֖וֹל לֵ/אמֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/001.yaml
  text: 'In the second year of King Darius[a], in the sixth month, on the first day of the month, the word of Yahweh came by the hand of Haggai the prophet to Zerubbabel son of Shealtiel, governor of Judah, and to Joshua son of Jehozadak, the high priest, saying:'
translation:
  language: de
  text: 'Im zweiten Jahr des Königs Darius, im sechsten Monat, am ersten Tag des Monats, erging das Wort Jahwes durch den Propheten Haggai[a] an Serubbabel, den Sohn Schealtiëls, den Statthalter von Juda, und an Jeschua, den Sohn Jozadaks, den Hohepriester. Es lautete:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »durch die Hand Haggais, des Propheten«.'
    reason: Die Fußnote bewahrt die konkrete hebräische Ausdrucksweise בְּיַד, während der Haupttext deren Funktion idiomatisch wiedergibt.
lexical_decisions:
- source_word: בִּשְׁנַת שְׁתַּיִם לְדָרְיָוֶשׁ הַמֶּלֶךְ
  choice: Im zweiten Jahr des Königs Darius
  rationale: Die Zahl »zwei« hat in dieser Regierungsdatierung ordinale Bedeutung; die Formulierung entspricht natürlichem, gehobenem Deutsch.
- source_word: בַּחֹדֶשׁ הַשִּׁשִּׁי
  choice: im sechsten Monat
  rationale: Die Monatsangabe bleibt wie im Hebräischen numerisch; ein später gebräuchlicher Monatsname wird nicht ergänzt.
- source_word: בְּיוֹם אֶחָד לַחֹדֶשׁ
  choice: am ersten Tag des Monats
  rationale: Das hebräische Zahlwort »eins« wird in Datumsangaben ordinal gebraucht.
- source_word: הָיָה דְבַר יְהוָה
  choice: erging das Wort Jahwes
  rationale: »Erging« gibt die feste prophetische Offenbarungsformel im Deutschen präzise und idiomatisch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Ausgangstext stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּיַד חַגַּי הַנָּבִיא
  choice: durch den Propheten Haggai
  rationale: Die Wendung bezeichnet Haggai als Vermittler der Botschaft. Die wörtliche Bildsprache »durch die Hand« wird in einer Fußnote dokumentiert.
- source_word: פַּחַת יְהוּדָה
  choice: Statthalter von Juda
  rationale: פֶּחָה bezeichnet hier den perserzeitlichen Provinzstatthalter; »Statthalter« ist im Deutschen historisch passend und allgemein verständlich.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: den Hohepriester
  rationale: Die feste deutsche Amtsbezeichnung gibt den wörtlichen Sinn »der große/oberste Priester« angemessen wieder.
- source_word: לֵאמֹר
  choice: 'Es lautete:'
  rationale: Die Einleitungsformel zur folgenden direkten Rede wird als eigener, natürlicher deutscher Satz wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. »Jahwe« bewahrt den Charakter als Gottes Eigenname, ohne ihn durch einen Titel zu ersetzen.
- issue: Vermittlungsformel בְּיַד
  choice: durch den Propheten Haggai
  alternative: durch die Hand Haggais, des Propheten
  rationale: Die Hauptfassung vermittelt die im Hebräischen bezeichnete prophetische Mittlerschaft in natürlichem Deutsch; die Fußnote bewahrt die konkrete hebräische Bildform, ohne daraus eine zusätzliche theologische Aussage abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholten Datumsangaben und Amtstitel bleiben erhalten. Die Namensformen Serubbabel, Schealtiël, Jeschua und Jozadak orientieren sich an etablierten deutschen Bibelformen; der Gottesname erscheint als »Jahwe«.
