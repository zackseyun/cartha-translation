  yaml_path: translation/ot/haggai/001/005.yaml
  text: 'Now therefore[a], thus says Yahweh of hosts: Set your heart on your ways.'
translation:
  language: de
  text: 'Nun denn, so spricht Jahwe der Heerscharen: Nehmt euch eure Wege zu Herzen![a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Richtet euer Herz auf eure Wege.“ Die Wendung fordert dazu auf, die eigene Lebensführung ernstlich zu prüfen.'
    reason: Erläuterung der hebräischen Wendung שִׂימוּ לְבַבְכֶם עַל דַּרְכֵיכֶם bei Bewahrung ihrer wörtlichen Bildsprache.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Nun also
  rationale: Die Verbindung aus Konjunktion und Zeitadverb leitet aus dem vorangehenden Tadel eine Folgerung und Mahnung ab. „Nun also“ gibt sowohl den Übergang als auch die folgernde Kraft wieder.
- source_word: כֹּה אָמַר
  choice: so spricht
  rationale: Dies ist die geläufige deutsche Wiedergabe der prophetischen Botenformel; das Präsens vermittelt die gegenwärtige Geltung der autoritativen Verkündigung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Transkription gibt den im hebräischen Text stehenden Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: צְבָאוֹת
  choice: der Heerscharen
  rationale: Im Gottesnamen-Titel bewahrt „der Heerscharen“ die umfassende Vorstellung von Jahwe als Herrscher über himmlische und irdische Mächte, ohne den Bezug auf nur einen Bereich einzuengen.
- source_word: שִׂימוּ לְבַבְכֶם
  choice: Richtet euer Herz
  rationale: Die Wendung wird bildnah wiedergegeben und erhält das ausdrücklich genannte „Herz“ als Zentrum bewusster Aufmerksamkeit und ernster Selbstprüfung.
- source_word: עַל דַּרְכֵיכֶם
  choice: auf eure Wege
  rationale: „Wege“ bewahrt das hebräische Bild für Lebensführung und Verhalten; die Präposition „auf“ entspricht der räumlichen Bildlichkeit des Originals.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Vers nennt ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen, während „der HERR“ ihn durch einen Titel ersetzt.
- issue: Bedeutung der Herz-Wege-Wendung
  choice: Richtet euer Herz auf eure Wege
  alternative: Denkt gründlich über eure Lebensführung nach
  rationale: Die gewählte Fassung bewahrt sowohl „Herz“ als auch „Wege“ und damit die Bildspannung des Hebräischen; die Fußnote erläutert den gemeinten Aufruf zur ernsten Selbstprüfung, ohne ihn im Haupttext vollständig auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusster Nähe zur prophetischen Formelsprache. Die ungewöhnliche, aber verständliche Herz-Wege-Bildlichkeit bleibt im Haupttext erhalten und wird in der Fußnote alltagssprachlich erläutert.
