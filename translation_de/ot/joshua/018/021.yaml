base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/021.yaml
  text: And the cities belonging to the tribe of the sons of Benjamin[a], according to their clans, were Jericho, Beth-hoglah, and Emek-keziz.
translation:
  language: de
  text: 'Und die Städte des Stammes der Benjaminiter nach ihren Sippen waren: Jericho, Bet-Hogla und Emek-Keziz.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Tal von Keziz“, falls der Name als beschreibende Ortsbezeichnung verstanden wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ הֶעָרִים
  choice: Und die Städte ... waren
  rationale: Die Konjunktion mit dem Qal-Perfekt von היה leitet die Ortsliste ein; die kopulative Wiedergabe bewahrt den fortlaufenden Listencharakter.
- source_word: לְמַטֵּה בְּנֵי בִנְיָמִן
  choice: des Stammes der Benjaminiter
  rationale: Die Formulierung gibt die Zugehörigkeit der Städte zur Stammeszuteilung idiomatisch wieder. „Benjaminiter“ macht den hebräischen genealogischen Ausdruck בְּנֵי בִנְיָמִן im modernen Deutsch natürlich verständlich.
- source_word: לְמִשְׁפְּחֹתֵיהֶם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחָה bezeichnet hier die Untergliederungen des Stammes; „Sippen“ wahrt diesen administrativ-genealogischen Sinn besser als das engere „Familien“.
- source_word: יְרִיחוֹ
  choice: Jericho
  rationale: Etablierte deutsche Form des Ortsnamens.
- source_word: בֵית חָגְלָה
  choice: Bet-Hogla
  rationale: Transliteration des Ortsnamens nach geläufiger deutscher bibelsprachlicher Schreibweise.
- source_word: עֵמֶק קְצִיץ
  choice: Emek-Keziz
  rationale: Die Verbindung wird im Kontext der Städteliste als zusammengesetzter Ortsname transliteriert; עֵמֶק kann jedoch auch als „Tal“ verstanden und übersetzt werden.
