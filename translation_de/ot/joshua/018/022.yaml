- source_word: צְמָרַיִם
  choice: Zemarajim
  rationale: Der Ortsname wird so transkribiert, dass die hebräische Endung -ajim erkennbar bleibt; diese Form ist im Deutschen verständlich und quellennah.
- source_word: בֵית אֵל
  choice: Bet-El
  rationale: Der bekannte Ortsname wird in einer transparenten, dem Hebräischen nahen deutschen Form wiedergegeben und nicht als »Haus Gottes« übersetzt.
- source_word: וּ
  choice: und
  rationale: Die vorangestellte Konjunktion verbindet die Ortsnamen; in natürlichem Deutsch steht »und« nur vor dem letzten Glied der Aufzählung.
