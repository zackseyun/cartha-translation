    rationale: Das Hebräische bezeichnet das Lager als in/bei Schilo gelegen. Im modernen Deutschen ist „ins Lager in Schilo“ klarer und natürlicher, ohne die Bedeutung zu verändern.
  - severity: low
    issue: Fußnotenformulierung kann den hebräischen Ausdruck unnötig ungenau darstellen
    rationale: Die Erklärung sollte zwischen der Bedeutung von סֵפֶר als schriftlichem Dokument und dem wahrscheinlichen materiellen Träger, einer Schriftrolle, unterscheiden.
