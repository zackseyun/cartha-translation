  source_fidelity: 'Die Übersetzung gibt die Handlungsfolge und die wesentlichen Sachangaben des Hebräischen zuverlässig wieder: die Männer gehen, durchziehen das Land, halten dessen Beschreibung stadtweise in sieben Teilen schriftlich fest und kommen zu Josua. „Stadt für Stadt“ ist eine gute idiomatische Wiedergabe von לֶעָרִים. „In sieben Teilen“ wahrt die Bedeutung von לְשִׁבְעָה חֲלָקִים ohne eine weitergehende Deutung als Stammeslose. „Schriftstück“ ist für סֵפֶר im antiken Kontext angemessen.'
  naturalness: Die Formulierung „zu Josua ins Lager nach Schilo“ verbindet zwei Zielangaben im Deutschen nicht ganz idiomatisch. „Ins Lager in Schilo“ gibt den Ortsbezug des Lagers natürlich und präzise wieder. Die übrige Formulierung ist modernes, verständliches Standarddeutsch.
  terminology: „Josua“ und „Schilo“ sind die üblichen deutschen Namensformen. „Männer“, „Land“, „Teilen“ und „Schriftstück“ sind registergerecht und quellentreu. Die Fußnote erläutert die antike schriftliche Form sinnvoll, sollte aber nicht zugleich „Schriftstück/Buch“ als vermeintlichen hebräischen Wortlaut präsentieren; סֵפֶר bezeichnet ein Schriftstück bzw. Buch und konnte materiell eine Schriftrolle sein.
