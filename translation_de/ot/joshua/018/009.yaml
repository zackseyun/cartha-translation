base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/009.yaml
  text: So the men went and passed through the land[a], and they wrote it down by cities in seven portions in a book[b], and they came to Joshua at the camp in Shiloh.
translation:
  language: de
  text: Da zogen die Männer los und durchquerten das Land. Sie hielten es Stadt für Stadt in sieben Teilen in einem Schriftstück[a] fest und kamen zu Josua ins Lager in Schilo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „auf einem Schriftstück“; סֵפֶר kann ein schriftliches Dokument bezeichnen, das vermutlich die Form einer Schriftrolle hatte.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּלְכוּ הָאֲנָשִׁים
  choice: Da zogen die Männer los
  rationale: Die erzählende Verbfolge wird natürlich mit „Da“ aufgenommen; „zogen … los“ gibt הלך wieder, ohne eine im Hebräischen nicht genannte Richtung hinzuzufügen. „Die Männer“ wahrt den bestimmten Bezug auf die zuvor beauftragten Männer.
- source_word: וַיַּעַבְרוּ בָאָרֶץ
  choice: und durchquerten das Land
  rationale: עבר mit ב bezeichnet hier das Durchziehen bzw. Bereisen des Gebiets; „durchquerten“ ist prägnant und entspricht dem Vermessungszusammenhang.
- source_word: וַיִּכְתְּבוּהָ
  choice: Sie hielten es … fest
  rationale: Das feminine Suffix bezieht sich auf „das Land“ im Hebräischen. Im Deutschen verweist „es“ auf das Land; „schriftlich festhalten“ ist der Handlung angemessen, wobei das Schriftstück anschließend ausdrücklich genannt wird.
- source_word: לֶעָרִים
  choice: Stadt für Stadt
  rationale: Das ל kennzeichnet wahrscheinlich das Ordnungsprinzip der Aufzeichnung. „Stadt für Stadt“ gibt diese distributive Einteilung im heutigen Deutsch klar wieder.
- source_word: לְשִׁבְעָה חֲלָקִים
  choice: in sieben Teilen
  rationale: חֲלָקִים bezeichnet Teile oder Abschnitte. Die Formulierung bewahrt die sachliche Gliederung, ohne bereits ausdrücklich „Lose“ oder „Stammesgebiete“ einzutragen.
- source_word: עַל סֵפֶר
  choice: in einem Schriftstück
  rationale: סֵפֶר bezeichnet hier ein schriftliches Dokument, möglicherweise eine Schriftrolle. „Schriftstück“ vermeidet den modernen Eindruck eines gebundenen Buches.
- source_word: וַיָּבֹאוּ אֶל יְהוֹשֻׁעַ אֶל הַמַּחֲנֶה שִׁלֹה
  choice: und kamen zu Josua ins Lager nach Schilo
  rationale: „Kamen“ bleibt beim ausdrücklich verwendeten Verb und ergänzt nicht „kehrten zurück“. Die doppelte Richtungsangabe wird in natürlichem Deutsch als „zu Josua ins Lager nach Schilo“ wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählbewegung. „Stadt für Stadt“ macht die wahrscheinliche Organisationsweise der Landesbeschreibung verständlich; die sachliche Wendung „in sieben Teilen“ lässt die genaue Funktion der Einteilung offen.
