language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוֹשֻׁ֖עַ אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל עַד אָ֨נָה֙ אַתֶּ֣ם מִתְרַפִּ֔ים לָ/בוֹא֙ לָ/רֶ֣שֶׁת אֶת הָ/אָ֔רֶץ אֲשֶׁר֙ נָתַ֣ן לָ/כֶ֔ם יְהוָ֖ה אֱלֹהֵ֥י אֲבֽוֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/003.yaml
  text: And Joshua said to the sons of Israel[a], “How long will you be slack about going in to take possession of the land that Yahweh, the God of your fathers, has given you?”
translation:
  language: de
  text: 'Da sagte Josua zu den Israeliten[a]: »Wie lange wollt ihr noch zögern, in das Land zu ziehen und es in Besitz zu nehmen, das Jahwe, der Gott eurer Väter, euch gegeben hat?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »zu den Söhnen Israels«.'
    reason: Die Fußnote macht die hebräische familiäre und grammatisch maskuline Ausdrucksweise hinter der natürlichen deutschen Sammelbezeichnung »Israeliten« sichtbar.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Gibt den erzählerischen Fortgang des Wayyiqtol in natürlichem Deutsch wieder, ohne einen stärkeren logischen Zusammenhang festzulegen.
- source_word: יְהוֹשֻׁעַ
  choice: Josua
  rationale: Etablierte deutsche Form des hebräischen Personennamens.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Im heutigen Deutsch ist dies die natürliche kollektive Bezeichnung; die wörtliche familiäre Wendung »Söhne Israels« wird in einer Fußnote ausgewiesen.
- source_word: עַד־אָנָה
  choice: Wie lange ... noch
  rationale: Idiomatiche deutsche Wiedergabe der zeitlichen, vorwurfsvollen Frage.
- source_word: מִתְרַפִּים
  choice: wollt ihr noch zögern
  rationale: Das reflexive רפה bezeichnet hier mangelnde Entschlossenheit beziehungsweise ein Sich-gehen-Lassen. »Zögern« bewahrt den Tadel, ohne vorschnell »faul« oder »nachlässig« zu unterstellen.
- source_word: לָבוֹא
  choice: in das Land zu ziehen
  rationale: Bringt die gerichtete Bewegung in das Land im Deutschen natürlich zum Ausdruck.
- source_word: לָרֶשֶׁת
  choice: es in Besitz zu nehmen
  rationale: ירשׁ bezeichnet hier die tatsächliche Besitzergreifung; die Formulierung vermeidet eine Verengung auf bloßes rechtliches Erben.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Bezeichnet das bereits im Kontext bestimmte verheißene Land.
- source_word: אֲשֶׁר נָתַן לָכֶם
  choice: das ... euch gegeben hat
  rationale: Das Perfekt stellt Gottes Gabe als bereits erfolgt und weiterhin gültig dar, obwohl die Besitznahme noch aussteht.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt das Tetragramm als Gottes Eigennamen wieder, statt es durch einen Titel zu ersetzen.
- source_word: אֱלֹהֵי אֲבוֹתֵיכֶם
  choice: der Gott eurer Väter
  rationale: Bewahrt die konkrete, generationenbezogene Bundesformel des Hebräischen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen ausdrücklich. »Jahwe« macht diesen sichtbar, während »der HERR« ihn durch einen traditionellen Ersatztitel wiedergibt.
- issue: Spannung zwischen göttlicher Gabe und menschlicher Besitznahme
  choice: »euch gegeben hat« und zugleich »es in Besitz zu nehmen«
  alternative: Eine Formulierung, die entweder die Gabe oder die noch ausstehende Besitznahme abschwächt
  rationale: 'Der Vers hält beides zusammen: Gott hat das Land bereits gegeben, doch Israel muss noch hineingehen und es in Besitz nehmen. Diese theologische Spannung wird nicht aufgelöst.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Frage behält ihren tadelnden Ton, ohne durch stark wertende Wörter wie »faul« verschärft zu werden. Der Satzbau bleibt gut vorlesbar und bildet zugleich die Abfolge von Hineingehen und Besitzergreifen ab.
