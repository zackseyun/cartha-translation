base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/019.yaml
  text: Then the border passed to the northern shoulder of Beth-hoglah[a], and the border ended at the northern tongue of the Salt Sea, at the southern end of the Jordan[b]. This is the southern border.
translation:
  language: de
  text: Dann verlief die Grenze zur Nordseite von Bet-Hogla und endete an der nördlichen Zunge des Salzmeeres[a][b], am südlichen Ende des Jordan. Das ist die Südgrenze.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eine geografische Bezeichnung für eine zungenförmige Bucht oder Einbuchtung.
    reason: lexical_alternative
  - marker: b
    text: Auch „Totes Meer“; im Hebräischen steht „Salzmeer“.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבַר הַגְּבוּל
  choice: Dann verlief die Grenze
  rationale: עָבַר bezeichnet in Grenzbeschreibungen den weiteren Verlauf einer Grenzlinie. „Verlief“ ist im modernen Deutschen natürlich und topografisch präzise.
- source_word: כֶּתֶף
  choice: Seite
  rationale: Das Wort bedeutet wörtlich „Schulter“, bezeichnet geografisch aber die Seite, Flanke oder den Hang eines Ortes. „Seite“ gibt die räumliche Bedeutung klar wieder.
- source_word: בֵּית חָגְלָה
  choice: Bet-Hogla
  rationale: Der Ortsname wird in einer im Deutschen gut lesbaren, quellennahen Form transkribiert.
- source_word: צָפוֹנָה
  choice: Nordseite / nördlichen
  rationale: 'Die Richtungsangabe wird je nach syntaktischem Bezug idiomatisch wiedergegeben: zunächst als nördliche Seite Bet-Hoglas, danach als nördliche Lage der Zunge des Salzmeeres.'
- source_word: תצאותיו הַגְּבוּל
  choice: endete
  rationale: Die Wendung bezeichnet in Grenzformeln den Ausgangs- beziehungsweise Endpunkt der Grenze. „Endete“ ist knapp und verständlich.
- source_word: לְשׁוֹן
  choice: Zunge
  rationale: Die wörtliche geografische Metapher „Zunge“ bleibt erhalten; gemeint ist eine zungenförmige Bucht, Einbuchtung oder Land-/Wasserform.
- source_word: יָם הַמֶּלַח
  choice: Salzmeer
  rationale: Die hebräische Bezeichnung wird direkt übersetzt und nicht stillschweigend durch den heutigen Namen „Totes Meer“ ersetzt.
- source_word: קְצֵה הַיַּרְדֵּן נֶגְבָּה
  choice: am südlichen Ende des Jordan
  rationale: קְצֵה bezeichnet das Ende oder äußerste Ende; נֶגְבָּה bestimmt es als südlich.
- source_word: זֶה גְּבוּל נֶגֶב
  choice: Das ist die Südgrenze
  rationale: נֶגֶב wird hier im Zusammenhang der Grenzaufzählung directional verstanden, nicht als Eigenname der Landschaft Negev.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Grenzformel wird flüssig wiedergegeben, während die konkrete hebräische Metapher „Zunge“ und der Quellenname „Salzmeer“ im Haupttext erhalten bleiben. Die Fußnotenmarker stehen unmittelbar bei dem Ausdruck, den beide Anmerkungen erläutern.
