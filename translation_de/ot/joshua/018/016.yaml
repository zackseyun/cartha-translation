  text: וְ/יָרַ֨ד הַ/גְּב֜וּל אֶל קְצֵ֣ה הָ/הָ֗ר אֲשֶׁר֙ עַל פְּנֵי֙ גֵּ֣י בֶן הִנֹּ֔ם אֲשֶׁ֛ר בְּ/עֵ֥מֶק רְפָאִ֖ים צָפ֑וֹנָ/ה וְ/יָרַד֩ גֵּ֨י הִנֹּ֜ם אֶל כֶּ֤תֶף הַ/יְבוּסִי֙ נֶ֔גְבָּ/ה וְ/יָרַ֖ד עֵ֥ין רֹגֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/016.yaml
  text: Then the border went down to the end of the mountain that faces the Valley of Ben-hinnom[a], which is at the northern end of the Valley of Rephaim. Then it went down the Valley of Hinnom to the southern slope of the Jebusite[c][b], and went down to En-rogel.
translation:
  language: de
  text: Dann verlief die Grenze hinab bis zum Ende des Berges, der dem Tal Ben-Hinnom[a] gegenüberliegt, nördlich der Refaïmebene. Danach verlief sie durch das Hinnomtal hinab zur Südseite des Jebusiters[b] und weiter hinab nach En-Rogel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Tal des Sohnes Hinnoms“; hier als Ortsname „Tal Ben-Hinnom“ wiedergegeben.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zum Südhang des Jebusiters“. Mit „der Jebusiter“ kann hier die jebusitische Siedlung, also Jerusalem, gemeint sein; das Wort „Stadt“ steht jedoch nicht im hebräischen Text.'
    reason: lexical_alternative
  - marker: c
    text: 'En-Rogel ist ein Ortsname; wörtlich: „Quelle Rogels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַד הַגְּבוּל
  choice: Dann verlief die Grenze hinab
  rationale: ירד bezeichnet ein Hinabgehen; „verlief … hinab“ verbindet die topografische Richtung mit einer im Deutschen natürlichen Grenzbeschreibung.
- source_word: קְצֵה הָהָר
  choice: bis zum Ende des Berges
  rationale: קָצֶה bezeichnet das Ende oder äußerste Ende; הָר wird quellentreu mit „Berg“ wiedergegeben.
- source_word: אֲשֶׁר עַל־פְּנֵי גֵּי בֶן־הִנֹּם
  choice: der dem Tal Ben-Hinnom gegenüberliegt
  rationale: עַל־פְּנֵי drückt hier eine räumliche Gegenüberlage aus. Ben-Hinnom wird als Bestandteil des Ortsnamens transkribiert.
- source_word: אֲשֶׁר בְּעֵמֶק רְפָאִים צָפוֹנָה
  choice: am nördlichen Rand der Refaïmebene
  rationale: Die Wendung lokalisiert den Berg nördlich beziehungsweise am Nordrand der Refaïmebene. „Refaïmebene“ gibt den etablierten geografischen Namen prägnant wieder, ohne eine genaue Geländebeziehung vorzutäuschen.
- source_word: וְיָרַד גֵּי הִנֹּם
  choice: Danach verlief sie durch das Hinnomtal hinab
  rationale: Das Hebräische lässt die Grenze in beziehungsweise durch das Tal hinabführen; die deutsche Formulierung bewahrt Bewegung und Topografie.
- source_word: אֶל־כֶּתֶף הַיְבוּסִי נֶגְבָּה
  choice: zur Südseite des Jebusiters
  rationale: כֶּתֶף bedeutet wörtlich „Schulter“ und topografisch „Seite“ oder „Hang“. הַיְבוּסִי lautet ausdrücklich „der Jebusiter“; „Stadt“ wird daher nicht stillschweigend ergänzt. נֶגְבָּה bezeichnet die südliche Richtung.
- source_word: עֵין רֹגֵל
  choice: En-Rogel
  rationale: Die Wortgruppe fungiert als Ortsname und wird daher transkribiert; die wörtliche Bedeutung wird in einer Fußnote genannt.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die wiederholte Abwärtsbewegung der Grenze bleibt hörbar. Ortsnamen werden in gut erkennbarer deutscher Transkription wiedergegeben; eine im Ausgangstext nicht ausdrücklich genannte „Stadt“ wird nicht in den Haupttext aufgenommen.
