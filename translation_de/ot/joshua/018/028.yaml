  text: וְ/צֵלַ֡ע הָאֶ֜לֶף וְ/הַ/יְבוּסִ֨י הִ֤יא יְרֽוּשָׁלִַ֨ם֙ גִּבְעַ֣ת קִרְיַ֔ת עָרִ֥ים אַרְבַּֽע עֶשְׂרֵ֖ה וְ/חַצְרֵי/הֶ֑ן זֹ֛את נַֽחֲלַ֥ת בְּנֵֽי בִנְיָמִ֖ן לְ/מִשְׁפְּחֹתָֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/028.yaml
  text: Zela[a], Haeleph, the Jebusite (that is, Jerusalem), Gibeath, Kiriath—fourteen cities with their villages[c][b]. This was the inheritance of the sons of Benjamin according to their clans.
translation:
  language: de
  text: 'Zela, Ha-Elef[a], der Jebusiter[b] – das ist Jerusalem –, Gibeat[c] und Kirjat[d]: vierzehn Städte mit ihren Dörfern. Das war der Erbbesitz der Nachkommen Benjamins nach ihren Sippen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Text hat Ha-Elef; manche Übersetzungen geben den Namen ohne den vorangestellten Artikel als Elef wieder.
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „der Jebusiter, sie ist Jerusalem“. Die Volksbezeichnung „Jebusiter“ dient hier offenbar als Ortsbezeichnung für Jerusalem.'
    reason: lexical_alternative
  - marker: c
    text: Die Namensform lautet hier Gibeat; manche Übersetzungen verwenden die geläufigere Form Gibea.
    reason: alternative_reading
  - marker: d
    text: Im hebräischen Text dieses Verses steht nur Kirjat, nicht Kirjat-Jearim.
    reason: textual_variant
lexical_decisions:
- source_word: וְצֵלַע
  choice: Zela
  rationale: Der Ortsname wird nach deutscher Schreibkonvention transliteriert; das Schluss-ה wird dabei nicht als eigener Konsonant wiedergegeben.
- source_word: הָאֶלֶף
  choice: Ha-Elef
  rationale: Die Form bewahrt den im Hebräischen vorhandenen Artikel הָ־ und gibt den Ortsnamen in einer für deutsche Leser transparenten Umschrift wieder.
- source_word: וְהַיְבוּסִי הִיא יְרוּשָׁלִַם
  choice: der Jebusiter – das ist Jerusalem –
  rationale: Die ungewöhnliche hebräische Formulierung wird nicht stillschweigend zu „Jebus“ geändert. Der Volksname „Jebusiter“ fungiert hier in der Ortsliste als Bezeichnung der Stadt; הִיא leitet die Identifizierung mit Jerusalem ein.
- source_word: גִּבְעַת
  choice: Gibeat
  rationale: Der Ortsname wird entsprechend der hier bezeugten Konsonantenform wiedergegeben, ohne ihn an die geläufigere Form „Gibea“ anzugleichen.
- source_word: קִרְיַת
  choice: Kirjat
  rationale: Übersetzt wird nur der im masoretischen Text tatsächlich stehende Ortsname. „Jearim“ wird nicht aus anderen Stellen ergänzt.
- source_word: עָרִים אַרְבַּע עֶשְׂרֵה וְחַצְרֵיהֶן
  choice: vierzehn Städte mit ihren Dörfern
  rationale: עָרִים bezeichnet hier die Hauptorte, חֲצֵרִים die zugehörigen kleineren beziehungsweise unbefestigten Siedlungen; „mit“ gibt die deutsche Zuordnungsbeziehung natürlich wieder.
- source_word: זֹאת נַחֲלַת
  choice: Das war der Erbbesitz
  rationale: Die verblos formulierte hebräische Abschlussformel wird im deutschen Erzählzusammenhang mit „war“ wiedergegeben; „Erbbesitz“ erfasst den zugeteilten, dauerhaft zustehenden Landbesitz.
- source_word: בְּנֵי בִנְיָמִן
  choice: die Nachkommen Benjamins
  rationale: Die Wendung bedeutet im Stammeszusammenhang die von Benjamin abstammende Gemeinschaft. „Nachkommen“ bewahrt die genealogische Aussage und klingt im heutigen Deutsch natürlicher als „Söhne“.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחוֹת bezeichnet die Untergliederungen des Stammes; „Sippen“ ist in diesem Landverteilungskontext präziser als das allgemeinere „Familien“.
