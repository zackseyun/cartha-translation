base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/004.yaml
  text: Provide for yourselves three men from each tribe[a], and I will send them out; they shall arise and walk through the land and write it down according to their inheritance[b], and they shall come to me.
translation:
  language: de
  text: Stellt aus jedem Stamm je drei Männer bereit[a], und ich werde sie aussenden. Sie sollen sich aufmachen, das Land durchziehen und es nach Maßgabe ihrer Erbteile[b] aufzeichnen; dann sollen sie zu mir kommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bestimmt aus jedem Stamm je drei Männer.“'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: Sie sollten das Land entsprechend den vorgesehenen Erbanteilen erfassen.'
    reason: cultural_note
lexical_decisions:
- source_word: הָבוּ לָכֶם
  choice: Bestimmt
  rationale: Der Imperativ kann in diesem Zusammenhang das Bereitstellen bzw. Bestimmen von Vertretern bezeichnen. „Bestimmt“ ist im Deutschen natürlich und gibt den pragmatischen Sinn von לָכֶם mit wieder, ohne das hölzerne „Gebt euch“ zu verwenden.
- source_word: שְׁלֹשָׁה אֲנָשִׁים לַשָּׁבֶט
  choice: aus jedem Stamm drei Männer
  rationale: „Männer“ entspricht der ausdrücklich maskulinen Form. Der singularische Ausdruck „für den Stamm“ hat hier distributiven Sinn, der im Deutschen mit „aus jedem Stamm“ klar wiedergegeben wird.
- source_word: וְאֶשְׁלָחֵם
  choice: Ich werde sie aussenden
  rationale: „Aussenden“ bezeichnet passend die Beauftragung zu dieser Erkundungsreise.
- source_word: וְיָקֻמוּ
  choice: Sie sollen sich aufmachen
  rationale: Das wörtliche „aufstehen“ leitet hier die folgenden Handlungen ein. „Sich aufmachen“ bewahrt diesen Bewegungsimpuls und ist im Deutschen idiomatisch.
- source_word: וְיִתְהַלְּכוּ בָאָרֶץ
  choice: das Land durchziehen
  rationale: Der Hitpael von הלך bezeichnet ein Umhergehen bzw. Durchqueren. „Durchziehen“ gibt die Erkundung des Landes knapp und natürlich wieder.
- source_word: וְיִכְתְּבוּ אוֹתָהּ
  choice: es aufzeichnen
  rationale: Das feminine Objektpronomen bezieht sich auf das Land. „Aufzeichnen“ wahrt den Schreib- und Erfassungsvorgang, ohne eine bestimmte Form der Beschreibung oder Vermessung festzulegen.
- source_word: לְפִי נַחֲלָתָם
  choice: im Hinblick auf ihr Erbteil
  rationale: Die idiomatische Wendung bedeutet, dass die Erfassung auf die vorgesehenen Erbanteile bezogen ist. „Im Hinblick auf“ erhält den Bezug, ohne die genaue Art der Einteilung stärker als der hebräische Text festzulegen.
- source_word: וְיָבֹאוּ אֵלָי
  choice: dann sollen sie zu mir kommen
  rationale: „Zu mir kommen“ entspricht dem einfachen בוא und vermeidet das kontextuell mögliche, aber nicht ausdrücklich ausgedrückte „zurückkehren“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze Hauptsätze erleichtern das Verständnis; „sich aufmachen“ und „durchziehen“ bewahren zugleich den erzählerischen Ton. Die Übersetzung lässt offen, ob das Aufzeichnen vor allem eine Beschreibung, Bestandsaufnahme oder Einteilung des Landes meint.
