  text: וְ/עָבַ֛ר אֶל כֶּ֥תֶף מוּל הָֽ/עֲרָבָ֖ה צָפ֑וֹנָ/ה וְ/יָרַ֖ד הָ/עֲרָבָֽתָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/018.yaml
  text: Then it passed on to the shoulder opposite the Arabah on the north[b][a], and went down to the Arabah.
translation:
  language: de
  text: Dann verlief die Grenze weiter zur Schulter gegenüber der Araba im Norden[a] und stieg zur Araba hinab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »zur Schulter gegenüber der Araba, nordwärts«. »Schulter« ist ein topografisches Bild und kann eine Seite, einen Hang oder einen Geländerücken bezeichnen. Die genaue räumliche Zuordnung der Richtungsangabe ist im Hebräischen knapp formuliert.'
    reason: lexical_and_geographic_note
lexical_decisions:
- source_word: וְעָבַר
  choice: Dann verlief die Grenze weiter
  rationale: In Grenzbeschreibungen bezeichnet עבר den weiteren Verlauf der Grenzlinie. Das im Hebräischen nur implizite Subjekt wird im Deutschen zur Klarheit als »die Grenze« ausgedrückt.
- source_word: כֶּתֶף
  choice: Schulter
  rationale: Die wörtliche topografische Metapher kann eine Seite, einen Hang oder einen Geländerücken bezeichnen; »Schulter« bewahrt das konkrete hebräische Bild.
- source_word: מוּל הָעֲרָבָה
  choice: gegenüber der Araba
  rationale: מוּל bezeichnet hier eine räumliche Gegenüberlage; Araba bleibt als geografische Bezeichnung erhalten.
- source_word: צָפוֹנָה
  choice: auf deren Nordseite
  rationale: Die Richtungsangabe beschreibt am ehesten die Lage der genannten Schulter nördlich der Araba, nicht eine Bewegung nach Norden.
- source_word: וְיָרַד הָעֲרָבָתָה
  choice: und stieg zur Araba hinab
  rationale: ירד bezeichnet das Hinabgehen im Gelände; die Richtungsendung an עֲרָבָה gibt die Bewegung zur Araba hin an.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Grenzbeschreibung. »Araba« wird als geografische Bezeichnung transliteriert. Die ungewöhnliche topografische Metapher »Schulter« bleibt erhalten und wird in der Fußnote erläutert.
