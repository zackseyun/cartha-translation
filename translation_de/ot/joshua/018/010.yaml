base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/010.yaml
  text: Then Joshua cast lots for them at Shiloh before Yahweh[a], and there Joshua divided the land to the sons of Israel according to their divisions.
translation:
  language: de
  text: Dann warf Josua in Schilo vor Jahwe das Los für sie. Dort teilte Josua das Land unter den Israeliten[a] auf, nach ihren Abteilungen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „den Söhnen Israels“. Die Wendung bezeichnet hier gemeinsam das Volk Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁלֵךְ ... גּוֹרָל
  choice: warf ... das Los
  rationale: Die Verbindung bezeichnet das Loswerfen als Verfahren der Landzuteilung. Der Singular des hebräischen גּוֹרָל bleibt im Deutschen natürlich erhalten.
- source_word: בְּשִׁלֹה
  choice: in Schilo
  rationale: Die Präposition bezeichnet den Ort der öffentlichen Handlung; bei einer Siedlung ist „in Schilo“ im Deutschen idiomatisch.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: Die knappe Formulierung bewahrt den Gedanken, dass die Handlung in Jahwes Gegenwart, wahrscheinlich am Heiligtum, vollzogen wurde.
- source_word: וַיְחַלֶּק
  choice: teilte ... auf
  rationale: Das trennbare Verb „aufteilen“ gibt die Verteilung des Landes unter mehreren Empfängern natürlich und präzise wieder.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Gemeint ist das zur Verteilung stehende Land, nicht Erde oder Boden im allgemeinen Sinn.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: unter den Israeliten
  rationale: Die hebräische Wendung lautet wörtlich „den Söhnen Israels“, bezeichnet hier aber kollektiv das Volk Israel. „Israeliten“ ist im modernen Deutsch klar und schließt die Gemeinschaft als Ganze ein.
- source_word: כְּמַחְלְקֹתָם
  choice: nach ihren Abteilungen
  rationale: Die Formulierung hält die administrative Bedeutung von Einteilungen beziehungsweise Verteilungsgruppen fest, ohne die im Hebräischen nicht näher bestimmte Gliederung zu präzisieren.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen JHWH. „Jahwe“ gibt ihn als Gottes persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung erhöht die Lesbarkeit und bewahrt zugleich das betonte „dort“. Die nicht näher bestimmte Bedeutung von „Abteilungen“ bleibt erhalten.
