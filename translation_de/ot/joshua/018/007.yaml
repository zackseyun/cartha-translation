  text: כִּ֠י אֵֽין חֵ֤לֶק לַ/לְוִיִּם֙ בְּ/קִרְבְּ/כֶ֔ם כִּֽי כְהֻנַּ֥ת יְהוָ֖ה נַחֲלָת֑/וֹ וְ/גָ֡ד וּ/רְאוּבֵ֡ן וַ/חֲצִי֩ שֵׁ֨בֶט הַֽ/מְנַשֶּׁ֜ה לָקְח֣וּ נַחֲלָתָ֗/ם מֵ/עֵ֤בֶר לַ/יַּרְדֵּן֙ מִזְרָ֔חָ/ה אֲשֶׁר֙ נָתַ֣ן לָ/הֶ֔ם מֹשֶׁ֖ה עֶ֥בֶד יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/007.yaml
  text: For there is no portion for the Levites among you[a], because the priesthood of Yahweh is their inheritance. And Gad, Reuben, and the half-tribe of Manasseh have received their inheritance beyond the Jordan eastward, which Moses the servant of Yahweh gave them.
translation:
  language: de
  text: Denn die Leviten haben keinen Anteil unter euch, denn das Priestertum Jahwes ist ihr Erbbesitz.[a] Gad, Ruben und der halbe Stamm Manasses aber haben ihren Erbbesitz jenseits des Jordan, im Osten, erhalten, den Mose, der Diener Jahwes, ihnen gegeben hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „sein Erbbesitz“. Der hebräische Singular bezieht sich wahrscheinlich kollektiv auf Levi beziehungsweise die Leviten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵלֶק
  choice: Anteil
  rationale: Bezeichnet hier den Anteil an der Landverteilung und bleibt sprachlich von נַחֲלָה („Erbbesitz“) unterschieden.
- source_word: בְּקִרְבְּכֶם
  choice: in eurer Mitte
  rationale: Gibt die räumlich-gemeinschaftliche Wendung im Zusammenhang der Stammesgebiete natürlich und quellennah wieder.
- source_word: כְהֻנַּת יְהוָה
  choice: das Priestertum Jahwes
  rationale: Bewahrt den institutionellen Sinn von כְהֻנָּה und die unmittelbare Verbindung mit dem Gottesnamen.
- source_word: נַחֲלָה
  choice: Erbbesitz
  rationale: Passt zum erblich zugewiesenen Besitz und unterscheidet sich klar von חֵלֶק („Anteil“).
- source_word: לָקְחוּ
  choice: haben ... erhalten
  rationale: Im Kontext einer rechtmäßigen Landzuteilung gibt „erhalten“ den Sinn natürlicher wieder als das mögliche wörtliche „genommen“.
- source_word: מֵעֵבֶר לַיַּרְדֵּן מִזְרָחָה
  choice: jenseits des Jordan, im Osten
  rationale: Macht eindeutig, dass das Ostjordanland gemeint ist, ohne die geographische Perspektive des hebräischen Ausdrucks zu glätten.
- source_word: עֶבֶד יְהוָה
  choice: der Diener Jahwes
  rationale: „Diener“ ist für den ehrenden Titel des Mose im Deutschen angemessen; „Sklave“ würde hier eine nicht im Vordergrund stehende Bedeutung betonen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes; „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Kollektiver Singular in נַחֲלָתוֹ
  choice: ihr Erbbesitz
  alternative: sein Erbbesitz
  rationale: Das hebräische Suffix steht im Singular und kann sich kollektiv auf Levi beziehungsweise die Leviten beziehen. Der deutsche Plural macht den Gruppenbezug verständlich; die formale Singularlesart wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt eng am Hebräischen, verwendet aber bei der rechtmäßigen Landzuteilung idiomatisches „erhalten“. Der Gottesname wird als „Jahwe“ wiedergegeben.
