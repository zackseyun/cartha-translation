  text: וּ/כְפַ֧ר העמני וְ/הָֽ/עָפְנִ֖י וָ/גָ֑בַע עָרִ֥ים שְׁתֵּים עֶשְׂרֵ֖ה וְ/חַצְרֵי/הֶֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/024.yaml
  text: 'And Chephar-ammoni[a], Ophni, and Geba: twelve cities with their villages.'
translation:
  language: de
  text: 'Und Kefar-Haammoni[a], Ofni und Geba: zwölf Städte samt ihren Dörfern.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Ortsname kann auch Kefar-Ammoni oder ähnlich transliteriert werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְפַר העמני
  choice: Kefar-Ammoni
  rationale: Der Ortsname wird in einer für das Deutsche geeigneten Form transliteriert und nicht als »Dorf des Ammoniters« übersetzt, da er hier als fester Ortsname in einer Liste steht. Der hebräische Artikel vor dem zweiten Namensbestandteil wird in der Hauptform nicht eigens wiedergegeben.
- source_word: הָעָפְנִי
  choice: Ofni
  rationale: Der Ortsname wird deutsch transliteriert; der Artikel ist als Bestandteil der überlieferten Ortsbezeichnung aufgefasst und nicht gesondert übersetzt.
- source_word: גָבַע
  choice: Geba
  rationale: Im Zusammenhang der Ortsliste ist das Wort eindeutig ein Eigenname und wird daher nicht mit »Hügel« übersetzt.
- source_word: עָרִים
  choice: Städte
  rationale: Die formelle Bezeichnung »Städte« entspricht dem hebräischen Ausdruck in den Listen der Landverteilung; »Ortschaften« wäre möglich, aber weniger nah an der üblichen Terminologie.
- source_word: שְׁתֵּים עֶשְׂרֵה
  choice: zwölf
  rationale: Direkte Wiedergabe der Kardinalzahl, die sich auf die Städte bezieht.
- source_word: חַצְרֵיהֶן
  choice: ihren Dörfern
  rationale: Gemeint sind die zu den Städten gehörenden kleineren, wohl meist unbefestigten Siedlungen. »Dörfer« ist dafür eine natürliche und traditionsnahe deutsche Wiedergabe.
theological_decisions: []
translation_notes:
  register: Knapper, würdiger Listenstil in modernem Standarddeutsch. Das einleitende »Und« bewahrt die Verknüpfung durch die hebräische Konjunktion; der Doppelpunkt bildet die abschließende Summenformel klar ab.
