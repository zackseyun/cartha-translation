lexical_decisions:
- source_word: הָעַוִּים
  choice: Awwim
  rationale: In der Gebietsliste ist die Form am ehesten als Ortsname zu verstehen. Die Umschrift „Awwim“ gibt den hebräischen Namen in einer für deutsche Leser üblichen Form wieder.
- source_word: הַפָּרָה
