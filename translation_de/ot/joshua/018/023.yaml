  rationale: Der hebräische Artikel wird bei der Wiedergabe des Ortsnamens nicht eigens abgebildet; „Para“ ist eine natürliche deutsche Umschrift.
- source_word: עָפְרָה
  choice: Ofra
  rationale: Der Ortsname wird nach deutscher Umschriftkonvention mit „Ofra“ wiedergegeben.
- source_word: וְ
  choice: und
  rationale: Die wiederholte Konjunktion verbindet die Ortsnamen; im Deutschen stehen Kommas und vor dem letzten Namen „und“.
