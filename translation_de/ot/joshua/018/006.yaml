  text: וְ/אַתֶּ֞ם תִּכְתְּב֤וּ אֶת הָ/אָ֨רֶץ֙ שִׁבְעָ֣ה חֲלָקִ֔ים וַֽ/הֲבֵאתֶ֥ם אֵלַ֖/י הֵ֑נָּה וְ/יָרִ֨יתִי לָ/כֶ֤ם גּוֹרָל֙ פֹּ֔ה לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/006.yaml
  text: And you shall write down the land in seven portions and bring it here to me, and I will cast the lot for you here before the LORD our God.
translation:
  language: de
  text: Ihr aber sollt das Land in sieben Teile aufzeichnen und sie mir hierher bringen. Dann werde ich hier vor dem HERRN, unserem Gott, für euch das Los werfen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּכְתְּבוּ אֶת־הָאָרֶץ
  choice: das Land … aufzeichnen
  rationale: Das Verb כָּתַב bedeutet grundsätzlich „schreiben“; mit „das Land“ als Objekt bezeichnet es hier die schriftliche Erfassung bzw. kartografische Beschreibung des Gebiets. „Aufzeichnen“ gibt dies im Deutschen natürlich wieder, ohne über den Ausgangstext hinaus eine bestimmte Form der Dokumentation festzulegen.
- source_word: שִׁבְעָה חֲלָקִים
  choice: in sieben Teile
  rationale: חֵלֶק bezeichnet einen Teil oder Anteil. Im Zusammenhang der Landverteilung ist „Teile“ klar und idiomatisch.
- source_word: וְיָרִיתִי לָכֶם גּוֹרָל
  choice: werde ich … für euch das Los werfen
  rationale: Die Einzahl גּוֹרָל wird als „das Los“ bewahrt. „Das Los werfen“ entspricht dem antiken Verfahren und hält die konkrete Bildsprache des Hebräischen fest.
- source_word: יְהוָה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens in Kapitälchen wird verwendet; sie unterscheidet den Eigennamen von der gewöhnlichen Anrede „Herr“.
theological_decisions:
- issue: Losentscheidung vor JHWH
  choice: „vor dem HERRN, unserem Gott“ eng am Wortlaut wiedergeben
  alternative: 'deutend formulieren: „damit der HERR, unser Gott, entscheidet“'
  rationale: Der Ausgangstext beschreibt Ort und religiösen Rahmen der Loshandlung, erklärt aber nicht ausdrücklich den Mechanismus göttlicher Entscheidung. Die Übersetzung bewahrt diese Zurückhaltung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der einleitende Kontrast וְאַתֶּם wird mit „Ihr aber“ wiedergegeben. Der zweite Satz erhöht die Lesbarkeit, ohne den logischen Ablauf zu verändern. Keine Fußnoten erforderlich.
