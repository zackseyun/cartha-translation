  text: and Hamizpeh[a], Hakkephirah, and Hammozah.
translation:
  language: de
  text: und Ha-Mizpe, Ha-Kefira und Ha-Moza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „die Mizpe, die Kefira und die Moza“, falls das vorangestellte הַ als gewöhnlicher bestimmter Artikel verstanden und nicht als Bestandteil der Ortsnamen wiedergegeben wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ
  choice: und
  rationale: Die vorangestellte Konjunktion verbindet die Ortsnamen mit der vorausgehenden Aufzählung; im Deutschen wird sie schlicht mit „und“ wiedergegeben.
- source_word: הַמִּצְפֶּה
  choice: Ha-Mizpe
  rationale: Der Ortsname wird nicht nach seiner möglichen Bedeutung („Wacht“, „Aussichtspunkt“) übersetzt. Das präfigierte הַ wird als „Ha-“ im Namen bewahrt.
- source_word: הַכְּפִירָה
  choice: Ha-Kefira
  rationale: Der Ortsname wird in einer für deutsche Leser natürlichen Umschrift wiedergegeben; das präfigierte הַ bleibt als „Ha-“ erhalten. Die Verdopplung des hebräischen Konsonanten wird nicht eigens abgebildet.
- source_word: הַמֹּצָה
  choice: Ha-Moza
  rationale: Der Ortsname wird transliteriert; das präfigierte הַ bleibt als „Ha-“ erhalten. Die Umschrift „z“ entspricht hier dem hebräischen צ.
