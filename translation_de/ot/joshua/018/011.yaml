  text: וַ/יַּ֗עַל גּוֹרַ֛ל מַטֵּ֥ה בְנֵֽי בִנְיָמִ֖ן לְ/מִשְׁפְּחֹתָ֑/ם וַ/יֵּצֵא֙ גְּב֣וּל גּֽוֹרָלָ֔/ם בֵּ֚ין בְּנֵ֣י יְהוּדָ֔ה וּ/בֵ֖ין בְּנֵ֥י יוֹסֵֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/011.yaml
  text: And the lot for the tribe of the sons of Benjamin[a], by their clans, came up[b], and the territory of their lot came out between the sons of Judah and the sons of Joseph.
translation:
  language: de
  text: Und das Los fiel für den Stamm der Benjaminiter nach ihren Sippen, und die Grenze ihres Losanteils verlief zwischen den Nachkommen Judas und den Nachkommen Josefs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit den »Nachkommen Josefs« sind die von Josef abstammenden Stämme gemeint, insbesondere Efraim und Manasse.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל
  choice: fiel
  rationale: Beim Losverfahren ist »das Los fiel« die natürliche deutsche Wiedergabe. Sie gibt den Vorgang idiomatisch wieder, ohne den Ausgang als bloße Verwaltungsentscheidung darzustellen.
- source_word: גּוֹרָל
  choice: Los
  rationale: Das Wort bezeichnet hier das zur Landverteilung eingesetzte Los, nicht lediglich das Ergebnis der Zuteilung.
- source_word: מַטֵּה בְנֵי בִנְיָמִן
  choice: Stamm der Benjaminiter
  rationale: מַטֵּה bezeichnet in diesem Zusammenhang den Stamm. »Benjaminiter« gibt die Zugehörigkeit zu Benjamin in natürlichem modernem Deutsch wieder.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחוֹת sind die Untergliederungen des Stammes; »Sippen« ist hier genauer als das allgemeinere »Familien«.
- source_word: וַיֵּצֵא גְּבוּל גּוֹרָלָם
  choice: Das ihnen durch das Los zugeteilte Gebiet lag
  rationale: גְּבוּל kann Grenze oder das von ihr umschlossene Gebiet bezeichnen. Im Zusammenhang der Landzuteilung und mit »zwischen« ist »Gebiet« im Deutschen verständlich und natürlich; וַיֵּצֵא beschreibt hier das Ergebnis des Losentscheids.
- source_word: בֵּין ... וּבֵין
  choice: zwischen ... und ...
  rationale: Die Doppelpräposition lokalisiert Benjamins Anteil zwischen den beiden benachbarten Stammesgebieten.
- source_word: בְנֵי יְהוּדָה
  choice: Nachkommen Judas
  rationale: Die hebräische Abstammungsformel wird verständlich wiedergegeben und bezeichnet hier den Stamm Juda.
- source_word: בְנֵי יוֹסֵף
  choice: Nachkommen Josefs
  rationale: Die Formulierung bewahrt den Abstammungsbezug und bezeichnet kollektiv die von Josef abstammenden Stämme.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die idiomatische Wendung »das Los fiel« ersetzt eine unnatürlich wörtliche Wiedergabe von »stieg herauf«. »Gebiet« bewahrt die im Kontext mögliche metonymische Bedeutung von גְּבוּל; die genealogischen Ausdrücke werden verständlich als »Benjaminiter« beziehungsweise »Nachkommen« wiedergegeben.
