source:
  edition: WLC
  text: וְ/תָאַ֣ר הַ/גְּבוּל֩ וְ/נָסַ֨ב לִ/פְאַת יָ֜ם נֶ֗גְבָּ/ה מִן הָ/הָר֙ אֲשֶׁ֨ר עַל פְּנֵ֥י בֵית חֹרוֹן֮ נֶגְבָּ/ה֒ ו/היה תֹֽצְאֹתָ֗י/ו אֶל קִרְיַת בַּ֨עַל֙ הִ֚יא קִרְיַ֣ת יְעָרִ֔ים עִ֖יר בְּנֵ֣י יְהוּדָ֑ה זֹ֖את פְּאַת יָֽם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/014.yaml
  text: Then the border curved and turned on the west side southward from the mountain that faces Beth-horon on the south[a], and its end was at Kiriath-baal (that is, Kiriath-jearim), a city of the sons of Judah. This was the western side.
translation:
  language: de
  text: Dann zog sich die Grenze weiter und wandte sich zur Westseite hin nach Süden, von dem Berg aus, der südlich gegenüber von Bet-Horon liegt. Sie endete bei Kirjat-Baal – das ist Kirjat-Jearim –, einer Stadt der Nachkommen Judas[a]. Das war die Westseite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Söhne Judas“; gemeint sind die Angehörigen beziehungsweise Nachkommen des Stammes Juda.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָאַר הַגְּבוּל
  choice: Dann zog sich die Grenze weiter
  rationale: Das Verb beschreibt in Grenzangaben den weiteren Verlauf beziehungsweise das Nachzeichnen einer Grenzlinie. „Zog sich … weiter“ gibt den geografischen Sinn natürlich wieder, ohne eine Vermessungstechnik vorauszusetzen.
- source_word: וְנָסַב
  choice: und wandte sich
  rationale: Das Verb bezeichnet hier eine Richtungsänderung der Grenzlinie; „wandte sich“ entspricht dem knappen topografischen Stil.
- source_word: לִפְאַת יָם
  choice: an der Westseite
  rationale: יָם bedeutet wörtlich „Meer“, bezeichnet in geografischen Formeln aber den Westen; פֵּאָה meint die Seite oder Flanke.
- source_word: נֶגְבָּה
  choice: nach Süden / südlich
  rationale: Das erste Vorkommen bezeichnet die Richtung des Grenzverlaufs, das zweite die südliche Lage des Berges gegenüber Bet-Horon.
- source_word: מִן הָהָר
  choice: von dem Berg aus
  rationale: Der bestimmte Singular verweist auf einen konkreten Berg beziehungsweise eine markante Anhöhe. „Berg“ ist die direkte Wiedergabe.
- source_word: אֲשֶׁר עַל־פְּנֵי בֵית חוֹרוֹן נֶגְבָּה
  choice: der Bet-Horon südlich gegenüberliegt
  rationale: עַל־פְּנֵי bezeichnet in geografischem Zusammenhang eine gegenüberliegende Lage. Die Formulierung bewahrt sowohl den Bezug zu Bet-Horon als auch die südliche Positionsangabe.
- source_word: וְהָיָה תֹצְאֹתָיו
  choice: Sie endete
  rationale: Die feste Wendung bezeichnet den Endpunkt einer Grenzlinie. Die verbale deutsche Fassung ist klarer als eine wörtliche Wiedergabe im Plural.
- source_word: אֶל קִרְיַת בַּעַל
  choice: bei Kirjat-Baal
  rationale: Die Präposition führt hier den Endpunkt der Grenze ein; „bei“ klingt für eine endende Grenzlinie im Deutschen natürlich.
- source_word: הִיא קִרְיַת יְעָרִים
  choice: das ist Kirjat-Jearim
  rationale: Das Pronomen führt den alternativen Namen derselben Stadt ein.
- source_word: עִיר בְּנֵי יְהוּדָה
  choice: einer Stadt der Nachkommen Judas
  rationale: בְּנֵי bedeutet wörtlich „Söhne“, bezeichnet hier jedoch die Stammesgemeinschaft beziehungsweise die von Juda abstammende Bevölkerung. „Nachkommen Judas“ bewahrt den genealogischen Bezug und ist im Deutschen nicht unnötig auf Männer beschränkt.
- source_word: זֹאת פְּאַת יָם
  choice: Das war die Westseite
  rationale: Die abschließende Formel bezeichnet diesen Abschnitt als westliche Seite des Stammesgebiets.
