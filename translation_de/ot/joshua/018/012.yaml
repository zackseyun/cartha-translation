  rationale: Die Revision präzisiert die geografische Bestimmung bei Jericho und ersetzt die nicht zum Anker passende Namensdeutung durch eine Anmerkung zum pluralischen hebräischen Grenzterminus. Der übrige Grenzverlauf und die gewählte moderne Standardsprache bleiben erhalten.
