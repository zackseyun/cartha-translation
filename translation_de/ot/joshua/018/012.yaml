  naturalness: Die Sprache ist weitgehend modernes, verständliches Standarddeutsch. „Zum nördlichen Abhang bei Jericho“ ist gegenüber „zur Nordseite des Abhangs bei Jericho“ natürlicher und genauer. Die Verben „stieg ... hinauf“ und „führte ... hinauf“ lassen die wiederholte Bewegungsbeschreibung der Grenzlinie angemessen erkennen.
  terminology: „Grenze“, „Jordan“, „Bergland“, „Wüste“ und „Bet-Awen“ sind passend. Die Fußnote zu Bet-Awen sollte nicht eine spekulativ bzw. nur begrenzt relevante Namensdeutung liefern, sondern den im Hebräischen pluralischen technischen Ausdruck für die Endpunkte/Grenzausgänge erläutern.
