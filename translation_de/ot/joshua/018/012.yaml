base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/012.yaml
  text: Their border on the north side was from the Jordan[a], and the border went up to the northern slope of Jericho, then went up into the hill country westward[b], and its end was at the wilderness of Beth-aven.
translation:
  language: de
  text: Ihre Grenze auf der Nordseite begann am Jordan. Von dort stieg die Grenze zum nördlichen Abhang bei Jericho[a] hinauf, führte dann westwärts hinauf ins Bergland und endete in der Wüste von Bet-Awen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zur Schulter Jerichos von Norden her“. „Schulter“ ist hier eine geografische Bezeichnung für eine Seite oder einen Abhang.'
    reason: lexical_alternative
  - marker: b
    text: Das Hebräische verwendet einen pluralischen topografischen Ausdruck, der „Endpunkte“, „äußerste Grenzen“ oder „Ausgänge“ bedeuten kann.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְאַת צָפוֹנָה מִן הַיַּרְדֵּן
  choice: auf der Nordseite begann am Jordan
  rationale: פֵּאָה bezeichnet hier die Nordseite des Stammesgebiets; מִן markiert den Ausgangspunkt der Grenzlinie. „Begann“ macht die in der hebräischen Grenzformel vorausgesetzte Funktion natürlich verständlich.
- source_word: הַגְּבוּל
  choice: Grenze
  rationale: גְּבוּל bezeichnet in Landverteilungsberichten die Grenzlinie beziehungsweise Gebietsgrenze.
- source_word: וְעָלָה
  choice: stieg … hinauf / führte … hinauf
  rationale: עלה beschreibt den topografischen Anstieg der Grenzlinie. Die leichte Variation vermeidet schwerfällige Wiederholung, ohne die räumliche Bewegung aufzugeben.
- source_word: אֶל כֶּתֶף יְרִיחוֹ מִצָּפוֹן
  choice: zur Nordseite des Abhangs bei Jericho
  rationale: כֶּתֶף bedeutet wörtlich „Schulter“, wird geografisch aber für eine Seite oder einen Hang gebraucht. מִצָּפוֹן bestimmt diese als nördliche Seite; „bei Jericho“ vermeidet die missverständliche Vorstellung, die Stadt selbst habe einen Hang.
- source_word: בָהָר יָמָּה
  choice: westwärts … ins Bergland
  rationale: הָר kann kollektiv das Bergland bezeichnen; יָמָּה ist der Richtungsadverb „westwärts“. „Ins Bergland“ gibt den topografischen Verlauf idiomatisch wieder.
- source_word: תֹּצְאֹתָיו
  choice: endete
  rationale: Der formal plurale topografische Ausdruck bezeichnet in Grenzformeln den Endpunkt beziehungsweise Ausgang der Grenzlinie. Das deutsche Verb „endete“ gibt die Funktion knapp und natürlich wieder.
- source_word: מִדְבָּרָה בֵּית אָוֶן
  choice: in der Wüste von Bet-Awen
  rationale: Das direktive -ה zeigt die Richtung auf den Endpunkt zu. Im Zusammenhang mit dem Ende der Grenze ist „in der Wüste von Bet-Awen“ natürlich; der Ortsname wird deutsch als Bet-Awen wiedergegeben.
