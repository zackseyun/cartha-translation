    rationale: מִצָּפוֹן bestimmt die „Schulter“ beziehungsweise den Hang als nördlich. „Zum nördlichen Abhang bei Jericho“ gibt dies idiomatisch wieder, ohne „Jericho“ fälschlich als einen selbst mit einem Abhang ausgestatteten Gegenstand zu behandeln.
  - severity: medium
