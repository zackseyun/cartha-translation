  text: וְ/עָבַר֩ מִ/שָּׁ֨ם הַ/גְּב֜וּל ל֗וּזָ/ה אֶל כֶּ֤תֶף ל֨וּזָ/ה֙ נֶ֔גְבָּ/ה הִ֖יא בֵּֽית אֵ֑ל וְ/יָרַ֤ד הַ/גְּבוּל֙ עַטְר֣וֹת אַדָּ֔ר עַל הָ/הָ֕ר אֲשֶׁ֛ר מִ/נֶּ֥גֶב לְ/בֵית חֹר֖וֹן תַּחְתּֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/013.yaml
  text: From there the border passed to Luz[a], to the southern slope of Luz (that is, Bethel), and the border went down to Atroth-addar[c][b], on the mountain that is south of Lower Beth-horon.
translation:
  language: de
  text: Von dort verlief die Grenze nach Lus, zum Südhang von Lus – das ist Bethel. Dann verlief die Grenze hinab nach Atrot-Addar, auf dem Berg, der südlich von Unter-Bet-Horon liegt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָבַר
  choice: verlief
  rationale: Bei einer Grenzbeschreibung bezeichnet das Verb den Verlauf der Grenzlinie; »verlief« ist im Deutschen natürlich und sachgerecht.
- source_word: הַגְּבוּל
  choice: die Grenze
  rationale: Übliche deutsche Bezeichnung für eine territoriale Grenzlinie.
- source_word: לוּזָה
  choice: nach Lus
  rationale: Die Ortsbezeichnung wird transliteriert; die hebräische Richtungsendung wird durch »nach« wiedergegeben.
- source_word: אֶל כֶּתֶף לוּזָה נֶגְבָּה
  choice: zum Südhang von Lus
  rationale: כֶּתֶף bedeutet wörtlich »Schulter«, bezeichnet topografisch aber die Seite oder den Hang; נֶגְבָּה gibt die südliche Lage an.
- source_word: הִיא בֵּית אֵל
  choice: das ist Bethel
  rationale: Die knappe identifizierende Aussage des Hebräischen bleibt ausdrücklich erhalten.
- source_word: וְיָרַד
  choice: dann führte ... hinab
  rationale: Bewahrt die topografische Abwärtsbewegung und bezieht sie idiomatisch auf den Verlauf der Grenze.
- source_word: עַטְרוֹת אַדָּר
  choice: Atrot-Addar
  rationale: Nahe Transliteration des zusammengesetzten hebräischen Ortsnamens.
- source_word: עַל הָהָר
  choice: auf den Berg
  rationale: Der bestimmte Singular verweist am ehesten auf einen konkreten Berg beziehungsweise eine konkrete Anhöhe.
- source_word: אֲשֶׁר מִנֶּגֶב לְבֵית חֹרוֹן תַּחְתּוֹן
  choice: südlich von Unter-Bet-Horon
  rationale: מִנֶּגֶב bezeichnet die Lage südlich eines Ortes; תַּחְתּוֹן wird als unterscheidender Bestandteil des Ortsnamens wiedergegeben.
