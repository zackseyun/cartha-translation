revisions:
- from: Von dort verlief die Grenze nach Lus, zum Südhang von Lus – das ist Bethel –; dann führte die Grenze hinab nach Atrot-Addar[a], auf den Berg südlich von Unter-Bet-Horon.
  to: Von dort verlief die Grenze nach Lus, zum Südhang von Lus – das ist Bethel. Dann verlief die Grenze hinab nach Atrot-Addar, auf dem Berg, der südlich von Unter-Bet-Horon liegt.
  rationale: Die Revision korrigiert die lokale Wiedergabe von עַל הָהָר zu „auf dem Berg“, glättet die deutsche Zeichensetzung und formuliert die Bewegung der Grenze idiomatisch. Die Ortsnamen, die ausdrückliche Identifikation von Lus mit Bethel und die topografische Aussage bleiben erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T09:42:14Z'
review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt den Verlauf der Grenze, die Südseite von Lus/Bethel, das Hinabführen zu Atrot-Addar und die Lage des Berges südlich von Unter-Bet-Horon insgesamt quellentreu wieder. Die Präposition עַל bei dem Berg ist jedoch lokal („auf dem Berg“), nicht richtungsweisend („auf den Berg“).
  naturalness: Die Kombination eines Gedankenstrich-Einschubs mit anschließendem Semikolon („–;“) ist im Deutschen nicht angemessen. Auch „die Grenze führte hinab“ ist weniger idiomatisch als die Grenze selbst als verlaufend bzw. hinabgehend zu beschreiben.
  terminology: „Lus“, „Bethel“, „Atrot-Addar“ und „Unter-Bet-Horon“ sind als konsistente deutsche Wiedergaben der Ortsnamen möglich. „Südhang“ gibt die topografische Bedeutung von כֶּתֶף sachgerecht wieder. Die Fußnote zur alternativen Schreibung ist zutreffend.
  issues:
  - severity: medium
    issue: „auf den Berg“
    rationale: Das hebräische עַל הָהָר bezeichnet hier die Lage von Atrot-Addar auf dem Berg. Die deutsche Akkusativform legt eine Bewegung auf den Berg nahe und verändert daher die räumliche Beziehung.
  - severity: low
    issue: „–;“ nach dem Einschub
    rationale: Die Zeichensetzung ist im modernen Standarddeutsch unnatürlich. Ein Satzabschluss nach dem Einschub stellt die Grenzabschnitte klar und flüssig dar.
  - severity: low
    issue: „dann führte die Grenze hinab“
    rationale: Eine Grenze kann im Deutschen idiomatischer „hinab verlaufen“ als etwas „hinabführen“. Die Revision bewahrt zugleich die Abwärtsbewegung von וְיָרַד.
  revised_text: Von dort verlief die Grenze nach Lus, zum Südhang von Lus – das ist Bethel. Dann verlief die Grenze hinab nach Atrot-Addar, auf dem Berg, der südlich von Unter-Bet-Horon liegt.
  revised_footnotes:
  - marker: a
    text: Der Ortsname wird auch Atarot-Addar geschrieben.
    reason: lexical_alternative
  revision_rationale: Die Revision korrigiert die lokale Wiedergabe von עַל הָהָר zu „auf dem Berg“, glättet die deutsche Zeichensetzung und formuliert die Bewegung der Grenze idiomatisch. Die Ortsnamen, die ausdrückliche Identifikation von Lus mit Bethel und die topografische Aussage bleiben erhalten.
