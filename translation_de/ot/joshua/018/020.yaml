  naturalness: „Das war das Erbteil der Benjaminiter … nach ihren Sippen“ ist natürliches, würdiges modernes Standarddeutsch. „Nach seinen Grenzen ringsum“ ist in diesem geografisch-administrativen Resümee etwas formeller, aber klarer und quellennäher als „mit seinen Grenzen ringsum“.
  terminology: „Erbteil“, „Benjaminiter“ und „Sippen“ sind angemessene Wiedergaben von נַחֲלָה, בְּנֵי בִנְיָמִן und מִשְׁפָּחוֹת. Die Stammesbezeichnung „Benjaminiter“ ist hier gegenüber einer rein biologisch klingenden Wiedergabe von „Söhne Benjamins“ vorzuziehen.
