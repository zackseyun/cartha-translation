revisions:
- from: Der Jordan bildete die Grenze auf der Ostseite.[a] Das war das Erbteil der Benjaminiter mit seinen Grenzen ringsum, nach ihren Sippen.
  to: Und der Jordan war seine Grenze im Osten.[a] Das war das Erbteil der Benjaminiter nach seinen Grenzen ringsum, nach ihren Sippen.
  rationale: Die Überarbeitung stellt den Satzanschluss wieder her, verdeutlicht die im hebräischen Suffix enthaltene Beziehung des Jordans zum Gebiet Benjamins und gibt die resümierende Wendung über die umlaufenden Grenzen genauer wieder. Bedeutung, Register und die traditionelle allotmentbezogene Terminologie bleiben erhalten.
