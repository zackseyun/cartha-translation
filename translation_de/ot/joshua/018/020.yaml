base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/020.yaml
  text: And the Jordan formed its border on the east side[a]. This was the inheritance of the sons of Benjamin, according to its borders all around[b], by their clans.
translation:
  language: de
  text: Und der Jordan war seine Grenze im Osten.[a] Das war das Erbteil der Benjaminiter nach seinen Grenzen ringsum, nach ihren Sippen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Der Jordan begrenzte es im Osten“ beziehungsweise „Der Jordan bildete im Osten seine Grenze“. Das hebräische Verb besagt hier, dass der Jordan als territoriale Grenze diente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיַּרְדֵּן
  choice: Der Jordan
  rationale: Der Eigenname des Flusses wird im Deutschen gewöhnlich mit Artikel und ohne den Zusatz „Fluss“ gebraucht; das einleitende וְ wird hier im natürlichen deutschen Zusammenhang nicht eigens wiedergegeben.
- source_word: יִגְבֹּל אֹתוֹ
  choice: bildete die Grenze
  rationale: גבל bezeichnet hier die Funktion des Jordans als territoriale Begrenzung. Die deutsche Formulierung ist natürlich und lässt das im Hebräischen durch das Objektsuffix bezeichnete Gebiet aus dem Zusammenhang hervorgehen.
- source_word: לִפְאַת קֵדְמָה
  choice: auf der Ostseite
  rationale: פאה bezeichnet die Seite bzw. Randseite, קֵדְמָה die östliche Richtung; die Formulierung gibt die geografische Orientierung klar wieder.
- source_word: זֹאת
  choice: Das war
  rationale: Der hebräische Nominalsatz enthält keine ausdrückliche Kopula. Im deutschen Erzählzusammenhang ist die Vergangenheitsform idiomatisch.
- source_word: נַחֲלַת
  choice: das Erbteil
  rationale: „Erbteil“ bewahrt den rechtlichen und heilsgeschichtlichen Klang der Stammeszuteilung und ist in gehobenem, zugleich verständlichem Bibeldeutsch geläufig.
- source_word: בְּנֵי בִנְיָמִן
  choice: der Benjaminiter
  rationale: Wörtlich steht „der Söhne Benjamins“; im Kontext ist dies die Stammesbezeichnung. „Benjaminiter“ ist im modernen Deutschen präzise und vermeidet ein mögliches Missverständnis als ausschließlich unmittelbare Söhne.
- source_word: לִגְבוּלֹתֶיהָ סָבִיב
  choice: mit seinen Grenzen ringsum
  rationale: Die Wendung fasst die zuvor beschriebenen Grenzlinien des Erbteils zusammen. Das deutsche Possessivpronomen bezieht sich grammatisch auf „Erbteil“.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחוֹת bezeichnet die größeren Familien- bzw. Sippenverbände innerhalb des Stammes; „Sippen“ passt zur Verteilung des Landes nach Stammesgliederungen.
