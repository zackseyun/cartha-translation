  - severity: medium
    issue: „mit seinen Grenzen ringsum“ gibt לִגְבוּלֹתֶיהָ סָבִיב nur ungenau wieder.
    rationale: Die Präposition לְ fasst das Erbteil anhand seiner umlaufenden Grenzlinien zusammen; „nach seinen Grenzen ringsum“ bewahrt diese Zuordnung besser als ein bloß additives „mit“.
  - severity: low
