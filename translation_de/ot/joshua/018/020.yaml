    rationale: Das hebräische Objektsuffix bezieht sich auf Benjamins Gebiet. „War seine Grenze im Osten“ macht diese Relation im Deutschen deutlich und bleibt eine zulässige Wiedergabe der Bedeutung von גבל.
  revised_text: Und der Jordan war seine Grenze im Osten.[a] Das war das Erbteil der Benjaminiter nach seinen Grenzen ringsum, nach ihren Sippen.
