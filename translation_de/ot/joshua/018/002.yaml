source:
  edition: WLC
  text: וַ/יִּוָּֽתְרוּ֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר לֹֽא חָלְק֖וּ אֶת נַֽחֲלָתָ֑/ם שִׁבְעָ֖ה שְׁבָטִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/002.yaml
  text: But among the sons of Israel there remained seven tribes that had not apportioned their inheritance[a][b].
translation:
  language: de
  text: Doch unter den Israeliten waren noch sieben Stämme übrig, denen ihr Erbteil noch nicht zugeteilt worden war.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »die ihr Erbteil noch nicht aufgeteilt hatten«. Das hebräische Verb kann hier sowohl die Beteiligung der Stämme an der Aufteilung als auch die noch ausstehende Zuteilung ihres Erbteils in den Blick nehmen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּוָּתְרוּ
  choice: waren noch … übrig
  rationale: Das Nifal von יתר bezeichnet die noch verbleibenden Gruppen; die deutsche Wendung gibt diesen Sinn natürlich wieder.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: unter den Israeliten
  rationale: Die hebräische Wendung bedeutet wörtlich »unter den Söhnen Israels«; »unter den Israeliten« ist im heutigen Deutsch natürlich und bezeichnet hier das Volk einschließlich seiner Stammesverbände.
- source_word: אֲשֶׁר לֹא חָלְקוּ
  choice: denen … noch nicht zugeteilt worden war
  rationale: חלק bezeichnet im Zusammenhang die Aufteilung beziehungsweise Zuteilung des Landes. Obwohl das hebräische Verb aktiv formuliert ist, legt der Kontext nahe, dass diese Stämme ihr Erbteil noch nicht durch die Landverteilung erhalten hatten; die Fußnote bewahrt die formnähere Alternative.
- source_word: אֶת נַחֲלָתָם
  choice: ihr Erbteil
  rationale: נחלה bezeichnet hier den erblich zugesprochenen Landanteil; »Erbteil« ist präzise, traditionsnah und verständlich.
- source_word: שִׁבְעָה שְׁבָטִים
  choice: sieben Stämme
  rationale: Direkte und im Zusammenhang der Stammesgliederung Israels natürliche Wiedergabe.
theological_decisions:
- issue: Handlungsträger bei der Landverteilung
  choice: 'Passive Formulierung: »denen ihr Erbteil noch nicht zugeteilt worden war«'
  alternative: »die ihr Erbteil noch nicht aufgeteilt hatten«
  rationale: Die aktive hebräische Form lässt grammatisch die Stämme als Subjekt erscheinen, doch im Kontext steht die noch ausstehende Zuteilung ihres Landes im Vordergrund. Die Übersetzung vermeidet den missverständlichen Eindruck, jeder Stamm hätte sein eigenes Erbteil intern teilen müssen, ohne die formnähere Lesart zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Israeliten« wird gegenüber dem im Deutschen unnatürlicheren »Söhne Israels« bevorzugt. Die idiomatische Passivkonstruktion macht den Landzuteilungskontext klar; die Fußnote erhält die grammatische Spannung des hebräischen Aktivs.
