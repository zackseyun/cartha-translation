source:
  edition: WLC
  text: וַ/יִּקָּ֨הֲל֜וּ כָּל עֲדַ֤ת בְּנֵֽי יִשְׂרָאֵל֙ שִׁלֹ֔ה וַ/יַּשְׁכִּ֥ינוּ שָׁ֖ם אֶת אֹ֣הֶל מוֹעֵ֑ד וְ/הָ/אָ֥רֶץ נִכְבְּשָׁ֖ה לִ/פְנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/001.yaml
  text: Then the whole congregation of the sons of Israel assembled at Shiloh and set up the tent of meeting there[b][a], and the land was subdued before them.
translation:
  language: de
  text: Dann versammelte sich die ganze Gemeinde der Söhne Israels in Schilo; dort stellten sie das Zelt der Begegnung auf, und das Land war ihnen unterworfen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Land war vor ihnen erobert“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקָּהֲלוּ
  choice: versammelte sich
  rationale: Das Nifal von קהל bezeichnet das Zusammenkommen als Gemeinschaft oder Versammlung. „Sich versammeln“ ist im modernen Deutschen natürlich und bewahrt den gemeinschaftlichen Charakter.
- source_word: כָּל עֲדַת
  choice: die ganze Gemeinde
  rationale: עֵדָה bezeichnet die Gemeinschaft beziehungsweise versammelte Gemeinde; כָּל wird mit „die ganze“ wiedergegeben.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: der Söhne Israels
  rationale: Die Wiedergabe bleibt nah an der wörtlichen, grammatisch maskulinen hebräischen Bezeichnung und bewahrt deren identitätsstiftende Form.
- source_word: שִׁלֹה
  choice: Schilo
  rationale: Gebräuchliche deutsche Schreibweise des Ortsnamens.
- source_word: וַיַּשְׁכִּינוּ
  choice: stellten … auf
  rationale: Der Hifil von שכן bedeutet wörtlich „wohnen lassen“. In Verbindung mit einem Zelt ist „aufstellen“ die natürliche deutsche Wiedergabe und bezeichnet dessen Einrichtung an diesem Ort.
- source_word: אֹהֶל מוֹעֵד
  choice: das Zelt der Begegnung
  rationale: Die transparente Wiedergabe erhält die Bestandteile des hebräischen Ausdrucks und vermeidet den stärker traditionsgeprägten Begriff „Stiftshütte“.
- source_word: נִכְבְּשָׁה
  choice: war … unterworfen
  rationale: Das passive Verb von כבשׁ bezeichnet einen Zustand der Unterwerfung beziehungsweise Beherrschung, ohne zwingend eine restlos abgeschlossene Eroberung jedes Gebietes auszudrücken.
- source_word: לִפְנֵיהֶם
  choice: vor ihnen
  rationale: Die wörtliche hebräische Raum- und Herrschaftsmetapher wird bewahrt, ohne sie durch eine stärker deutende Formulierung zu ersetzen.
theological_decisions:
- issue: Gemeinschaftsbezeichnung Israels
  choice: Söhne Israels
  alternative: Israeliten; Kinder Israels
  rationale: Die quellensprachliche, grammatisch maskuline Bezeichnung wird formal bewahrt. Sie bezeichnet hier kollektiv das Volk und wird nicht stillschweigend neutralisiert.
- issue: Ausmaß der mit נִכְבְּשָׁה bezeichneten Unterwerfung
  choice: das Land war vor ihnen unterworfen
  alternative: das Land war vor ihnen erobert
  rationale: „Unterworfen“ gibt den passiven Ergebniszustand wieder, ohne angesichts der noch folgenden uneroberten Gebiete eine vollständige Eroberung stärker zu behaupten, als der Ausdruck selbst verlangt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge wurde zur besseren Lesbarkeit in zwei Hauptsätze gegliedert. „Zelt der Begegnung“ ist transparent und gegenwärtig verständlich; „Söhne Israels“ wahrt bewusst die Form des hebräischen Kollektivausdrucks.
