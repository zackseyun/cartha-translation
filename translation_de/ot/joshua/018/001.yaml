  source_fidelity: 'Die Grundbedeutung wird weitgehend zutreffend wiedergegeben: die gesamte Gemeinde der Söhne Israels versammelt sich in Schilo, richtet dort das Zelt der Begegnung ein, und das Land befindet sich in einem Zustand der Unterwerfung. „Vor ihnen unterworfen“ ist jedoch keine idiomatische deutsche Wiedergabe von לִפְנֵיהֶם und verdeckt die intendierte Herrschaftsbeziehung.'
  naturalness: „Das Land war vor ihnen unterworfen“ klingt im modernen Standarddeutsch unnatürlich. „Das Land war ihnen unterworfen“ ist idiomatisch und gibt die im Kontext naheliegende Bedeutung der hebräischen Wendung wieder. Die Satzteilung ist möglich, eine Verbindung mit Semikolon bewahrt aber den Zusammenhang des hebräischen Satzes klarer.
  terminology: „Gemeinde“, „Söhne Israels“, „Schilo“ und „Zelt der Begegnung“ sind sachgerecht. „Söhne Israels“ bewahrt die formale Bezeichnung, ohne eine theologische Zusatzdeutung einzutragen. Die Fußnote kann die mögliche Wiedergabe „erobert“ als Alternative zu „unterworfen“ nennen.
