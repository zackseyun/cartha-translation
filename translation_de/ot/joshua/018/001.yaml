    rationale: „Vor ihnen unterworfen“ ist im Deutschen syntaktisch und semantisch holprig. In diesem Kontext bezeichnet die Wendung die Unterordnung des Landes unter Israel; „ihnen unterworfen“ gibt dies natürlich und quellentreu wieder.
