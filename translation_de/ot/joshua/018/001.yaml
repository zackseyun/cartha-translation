  rationale: Die Revision ersetzt allein die unidiomatische Wortfolge „vor ihnen unterworfen“ durch die im Deutschen natürliche und kontextgerecht äquivalente Wendung „ihnen unterworfen“. Die alternative, stärker auf den Vorgang der Einnahme bezogene Wiedergabe „erobert“ bleibt als Fußnote erhalten. Die übrigen Schlüsselbegriffe und die formale kollektive Benennung „Söhne Israels“ werden beibehalten.
