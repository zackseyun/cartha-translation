  variant: modern standard German
source:
  edition: WLC
  text: וּ/פְאַת נֶ֕גְבָּ/ה מִ/קְצֵ֖ה קִרְיַ֣ת יְעָרִ֑ים וְ/יָצָ֤א הַ/גְּבוּל֙ יָ֔מָּ/ה וְ/יָצָ֕א אֶל מַעְיַ֖ן מֵ֥י נֶפְתּֽוֹחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/015.yaml
  text: And the southern side was from the edge of Kiriath-jearim[b][a], and the border went out westward and went out to the spring of the waters of Nephtoah.
translation:
  language: de
  text: Die Südseite begann am Rand von Kirjat-Jearim. Die Grenze verlief nach Westen[a] und führte zur Quelle der Wasser von Neftoach[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zum Meer hin“; hier ist damit die westliche Richtung gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder vereinfacht: „zur Quelle von Neftoach“. Der hebräische Ausdruck lautet wörtlich „zur Quelle der Wasser von Neftoach“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְאַת נֶגְבָּה
  choice: Die Südseite
  rationale: פֵאָה bezeichnet hier die Seite beziehungsweise Begrenzungsseite eines Gebietes; נֶגְבָּה bestimmt sie als südlich. „Südseite“ ist knapp und im Deutschen natürlich.
- source_word: מִקְצֵה
  choice: begann am Rand von
  rationale: קָצֶה meint Rand, Ende oder äußersten Punkt. Da der hebräische Nominalsatz im Deutschen ein Verb benötigt, gibt „begann am Rand von“ die Funktion als Ausgangspunkt der Grenzbeschreibung idiomatisch wieder.
- source_word: קִרְיַת יְעָרִים
  choice: Kirjat-Jearim
  rationale: Der Ortsname wird in einer im Deutschen gut lesbaren, am Hebräischen orientierten Form transliteriert.
- source_word: וְיָצָא הַגְּבוּל
  choice: Die Grenze verlief
  rationale: יָצָא bedeutet wörtlich „hinausgehen“, wird in Grenzbeschreibungen jedoch für den Verlauf einer Grenzlinie gebraucht. „verlief“ vermittelt diesen räumlichen Sinn natürlich.
- source_word: יָמָּה
  choice: nach Westen
  rationale: Die Form bedeutet wörtlich „zum Meer hin“, bezeichnet im geografischen Kontext Israels aber die westliche Richtung. Die Fußnote bewahrt das zugrunde liegende Bild.
- source_word: וְיָצָא אֶל
  choice: und führte zu
  rationale: Die erneute Form von יָצָא beschreibt das Weiterführen der Grenzlinie zu einem Zielpunkt. „führte zu“ wahrt die Wiederaufnahme, ohne im Deutschen hölzern zu klingen.
- source_word: מַעְיַן מֵי נֶפְתּוֹחַ
  choice: zur Quelle der Wasser von Neftoach
  rationale: Die Wiedergabe erhält die gestufte hebräische Genitivverbindung und damit die formale Bezeichnung der Quelle; eine geglättete Alternative wird in der Fußnote genannt.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die hebräische Grenzformel wird idiomatisch wiedergegeben, während geografische Präzision und die auffällige Formulierung „Quelle der Wasser“ erhalten bleiben.
