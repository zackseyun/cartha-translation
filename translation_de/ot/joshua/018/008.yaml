  text: וַ/יָּקֻ֥מוּ הָ/אֲנָשִׁ֖ים וַ/יֵּלֵ֑כוּ וַ/יְצַ֣ו יְהוֹשֻׁ֡עַ אֶת הַ/הֹלְכִים֩ לִ/כְתֹּ֨ב אֶת הָ/אָ֜רֶץ לֵ/אמֹ֗ר לְ֠כוּ וְ/הִתְהַלְּכ֨וּ בָ/אָ֜רֶץ וְ/כִתְב֤וּ אוֹתָ/הּ֙ וְ/שׁ֣וּבוּ אֵלַ֔/י וּ֠/פֹה אַשְׁלִ֨יךְ לָ/כֶ֥ם גּוֹרָ֛ל לִ/פְנֵ֥י יְהוָ֖ה בְּ/שִׁלֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/008.yaml
  text: So the men arose and went[a], and Joshua commanded those who were going to write down the land, saying, “Go and walk through the land, and write it down, and return to me; and here I will cast lots for you before Yahweh in Shiloh.”
translation:
  language: de
  text: 'Da machten sich die Männer auf und gingen. Josua wies die Männer, die das Land schriftlich erfassen sollten,[a] an: »Geht, durchzieht das Land und haltet es schriftlich fest. Kehrt dann zu mir zurück. Hier in Schilo werde ich vor Jahwe für euch das Los werfen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die das Land schreiben sollten“; gemeint ist, das Land für die spätere Zuteilung schriftlich zu erfassen beziehungsweise zu beschreiben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ הָאֲנָשִׁים וַיֵּלֵכוּ
  choice: Da machten sich die Männer auf und gingen
  rationale: Die beiden Erzählverben eröffnen die nächste Handlung. „Machten sich … auf“ gibt קום natürlich wieder, während „gingen“ die anschließende Bewegung ausdrücklich bewahrt.
- source_word: וַיְצַו
  choice: wies … an
  rationale: צוה bezeichnet eine autoritative Anweisung. „Wies … an“ bewahrt deren Verbindlichkeit und klingt im modernen Deutschen natürlicher als die mögliche härtere Wiedergabe „befahl“.
- source_word: לִכְתֹּב אֶת הָאָרֶץ
  choice: das Land schriftlich erfassen sollten
  rationale: Wörtlich steht „das Land schreiben“. Im Zusammenhang ist eine schriftliche Bestandsaufnahme für die Verteilung gemeint; „schriftlich erfassen“ wahrt sowohl den Schreibvorgang als auch den sachlichen Sinn.
- source_word: וְהִתְהַלְּכוּ בָאָרֶץ
  choice: durchzieht das Land
  rationale: Der Hitpael von הלך bezeichnet hier das Umhergehen beziehungsweise Durchqueren des Gebiets. „Durchzieht“ ist knapp, würdig und kontextgerecht.
- source_word: וְכִתְבוּ אוֹתָהּ
  choice: haltet es schriftlich fest
  rationale: Die Formulierung nimmt das vorausgehende „das Land schreiben“ auf und bezeichnet seine schriftliche Erfassung, ohne eine technisch genauere Kartierung in den Text hineinzulesen.
- source_word: וְשׁוּבוּ אֵלַי
  choice: Kehrt dann zu mir zurück
  rationale: שוב bedeutet zurückkehren; „dann“ macht die natürliche Handlungsfolge im Deutschen deutlich, ohne den Inhalt zu verändern.
- source_word: וּפֹה אַשְׁלִיךְ לָכֶם גּוֹרָל
  choice: Hier … werde ich … für euch das Los werfen
  rationale: גורל steht im Hebräischen im Singular. Die feste deutsche Wendung „das Los werfen“ bewahrt diese Form und bezeichnet die Zuteilung durch Los.
- source_word: בְּשִׁלֹה
  choice: in Schilo
  rationale: Die etablierte deutsche Namensform ist „Schilo“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. „Jahwe“ gibt den Eigennamen im modernen Deutschen erkennbar wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Geschlechtsspezifische Wiedergabe von הָאֲנָשִׁים
  choice: die Männer
  alternative: die Leute
  rationale: Der Ausdruck bezeichnet hier die zuvor ausgewählten männlichen Vertreter. „Die Männer“ entspricht dem konkreten Referenten und der grammatischen Form.
- issue: Das Los vor Jahwe
  choice: vor Jahwe für euch das Los werfen
  alternative: euch vor Jahwe das Land durch das Los zuteilen
  rationale: Die gewählte Fassung bewahrt die konkrete und theologisch offene Bildsprache des hebräischen Textes, ohne das Verfahren erklärend auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählfolge. Die ungewöhnliche hebräische Wendung „das Land schreiben“ wird im Text verständlich wiedergegeben und in der Fußnote transparent gemacht. Direkte Rede mit deutschen Anführungszeichen; keine konfessionell geprägte Terminologie.
