source:
  edition: WLC
  text: וְ/תָאַ֣ר מִ/צָּפ֗וֹן וְ/יָצָא֙ עֵ֣ין שֶׁ֔מֶשׁ וְ/יָצָא֙ אֶל גְּלִיל֔וֹת אֲשֶׁר נֹ֖כַח מַעֲלֵ֣ה אֲדֻמִּ֑ים וְ/יָרַ֕ד אֶ֥בֶן בֹּ֖הַן בֶּן רְאוּבֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/017.yaml
  text: Then it curved northward and went out to En-shemesh[a], and went out to Geliloth, which is opposite the Ascent of Adummim[c][b], and it went down to the stone of Bohan son of Reuben.
translation:
  language: de
  text: Dann bog die Grenze nach Norden ab und verlief weiter nach En-Schemesch[a]. Von dort verlief sie weiter nach Gelilot[b], das gegenüber dem Aufstieg von Adummim[c] liegt, und führte hinab zum Stein Bohans, des Sohnes Rubens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En-Schemesch bedeutet „Quelle der Sonne“; im Haupttext steht der Ortsname in Umschrift.
    reason: lexical_alternative
  - marker: b
    text: Gelilot kann wörtlich etwa „Kreise“ oder „Bezirke“ bedeuten; hier wird das Wort als Ortsname verstanden.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Pass von Adummim“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָאַר מִצָּפוֹן
  choice: Dann bog die Grenze nach Norden ab
  rationale: In Grenzbeschreibungen bezeichnet תאר den Verlauf beziehungsweise eine Richtungsänderung der Grenzlinie. Das im Hebräischen unausgesprochene Subjekt wird zur Verständlichkeit als „die Grenze“ ergänzt; מִצָּפוֹן wird im bewegungsorientierten Zusammenhang direktional verstanden.
- source_word: וְיָצָא
  choice: verlief weiter
  rationale: יצא ist eine wiederkehrende Formel in Grenzbeschreibungen. „Verlief weiter“ gibt die Bewegung einer Grenzlinie im natürlichen Deutschen wieder, ohne ein tatsächlich gehendes Subjekt nahezulegen.
- source_word: עֵין שֶׁמֶשׁ
  choice: En-Schemesch
  rationale: Der Ausdruck fungiert als Ortsname und wird daher in einer dem Deutschen angepassten Form transliteriert statt übersetzt.
- source_word: גְּלִילוֹת
  choice: Gelilot
  rationale: Die Form wird hier als Ortsname verstanden und transliteriert; ihre mögliche lexikalische Bedeutung wird in einer Fußnote bewahrt.
- source_word: נֹכַח
  choice: gegenüber
  rationale: „Gegenüber“ gibt die räumliche Beziehung klar und ohne zusätzliche Festlegung wieder.
- source_word: מַעֲלֵה אֲדֻמִּים
  choice: der Aufstieg von Adummim
  rationale: מַעֲלֵה bezeichnet einen Anstieg beziehungsweise einen bergauf führenden Weg. „Aufstieg“ bewahrt die topografische Bedeutung, während Adummim als Ortsname transliteriert bleibt.
- source_word: וְיָרַד
  choice: führte hinab
  rationale: Die Form bezeichnet die abwärts gerichtete Fortsetzung des Grenzverlaufs. „Führte hinab“ ist im Deutschen für eine Grenzlinie idiomatisch.
- source_word: אֶבֶן בֹּהַן בֶּן רְאוּבֵן
  choice: zum Stein Bohans, des Sohnes Rubens
  rationale: Die Konstruktverbindung bezeichnet einen nach Bohan benannten Grenzstein; die Apposition identifiziert Bohan als Sohn beziehungsweise Nachkommen Rubens. Die formale Wendung wahrt den Wortlaut, ohne „Nachkomme“ ausdrücklich einzutragen.
