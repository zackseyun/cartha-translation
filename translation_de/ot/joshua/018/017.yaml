  register: Modernes, würdevolles Standarddeutsch. Die bildhafte Folge hebräischer Bewegungsverben wird als Verlauf der Grenze verständlich gemacht. Ortsnamen werden deutschsprachig transliteriert; echte lexikalische Alternativen bleiben in Fußnoten erhalten.
