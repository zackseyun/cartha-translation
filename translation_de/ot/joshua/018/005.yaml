base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/005.yaml
  text: And they shall divide it into seven portions. Judah shall remain at its border on the south[a], and the house of Joseph shall remain at their border on the north.
translation:
  language: de
  text: Und sie sollen es in sieben Anteile aufteilen. Juda soll an seiner Grenze im Süden bleiben[a], und das Haus Josefs soll an ihrer Grenze im Norden bleiben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „soll an seiner Grenze stehen“ / „soll an ihrer Grenze stehen“. Das hebräische Verb bedeutet wörtlich „stehen“, bezeichnet hier aber wahrscheinlich das Verbleiben bei den bestehenden Gebietsgrenzen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְחַלְּקוּ אֹתָהּ
  choice: Und sie sollen es … aufteilen
  rationale: Der Hitpael von חלק bezeichnet hier die Aufteilung des Landes unter die Stämme. „Aufteilen“ ist im Deutschen natürlich und gibt den Verteilungsvorgang klar wieder.
- source_word: לְשִׁבְעָה חֲלָקִים
  choice: in sieben Teile
  rationale: חֲלָקִים meint die bei der Landverteilung entstehenden Teile beziehungsweise Anteile; „Teile“ ist verständlich und wahrt die konkrete Aussage.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Eingebürgerte deutsche Namensform des Stammesnamens.
- source_word: יַעֲמֹד עַל גְּבוּלוֹ
  choice: soll an seiner Grenze … bleiben
  rationale: עמד bedeutet wörtlich „stehen“, bezeichnet hier im Zusammenhang bestehender Stammesgebiete jedoch wahrscheinlich das Verbleiben in der festgelegten territorialen Lage. Das Singularpronomen entspricht dem kollektiv verstandenen Juda.
- source_word: מִנֶּגֶב
  choice: im Süden
  rationale: נֶגֶב wird hier parallel zu צָפוֹן als Richtungsangabe gebraucht, nicht notwendig als Eigenname der Wüstenregion Negev.
- source_word: וּבֵית יוֹסֵף
  choice: und das Haus Josef
  rationale: „Haus Josef“ bewahrt die hebräische Kollektivbezeichnung für die von Josef abstammenden Stämme.
- source_word: יַעַמְדוּ עַל גְּבוּלָם
  choice: soll an ihrer Grenze … bleiben
  rationale: Das Subjekt „Haus Josef“ ist grammatisch singular, bezeichnet aber mehrere Stammesgruppen; daher wahrt „ihrer“ den pluralischen Bezug des hebräischen Suffixes und „soll“ natürliches deutsches Kongruenzverhalten.
- source_word: מִצָּפוֹן
  choice: im Norden
  rationale: Die Richtungsangabe bildet den Gegensatz zu „im Süden“ und bezeichnet die nördliche Seite.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kollektive Konstruktion „das Haus Josef … ihrer Grenze“ bewahrt die Numerusspannung des Hebräischen; die verbale Kongruenz bleibt im Deutschen singularisch.
