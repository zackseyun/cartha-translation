  source_fidelity: Der Text gibt die Aufteilung in sieben Anteile sowie die Gegenüberstellung Judas im Süden und des Hauses Josef im Norden zutreffend wieder. „Bleiben“ ist für עמד in diesem territorialen Zusammenhang eine vertretbare idiomatische Wiedergabe. Die Fußnote sollte jedoch nicht mit „innerhalb“ eine räumlich engere Aussage als das hebräische „an/auf seiner Grenze“ nahelegen.
  naturalness: „Haus Josef“ wirkt im modernen Standarddeutsch unnötig archaisch und ist als Genitivverbindung weniger natürlich als „Haus Josefs“. Auch in der Alternative der Fußnote muss das finite Verb wegen des deutschen Singularsubjekts „das Haus Josefs“ im Singular stehen.
  terminology: „Juda“ und „Josef“ sind etablierte deutsche Namensformen. „Teile“ ist möglich; „Anteile“ macht im Kontext der Landzuteilung den Sinn von חֲלָקִים etwas präziser, ohne den Text zu interpretieren.
