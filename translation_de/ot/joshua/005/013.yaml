source:
  edition: WLC
  text: וַ/יְהִ֗י בִּֽ/הְי֣וֹת יְהוֹשֻׁעַ֮ בִּ/ירִיחוֹ֒ וַ/יִּשָּׂ֤א עֵינָי/ו֙ וַ/יַּ֔רְא וְ/הִנֵּה אִישׁ֙ עֹמֵ֣ד לְ/נֶגְדּ֔/וֹ וְ/חַרְבּ֥/וֹ שְׁלוּפָ֖ה בְּ/יָד֑/וֹ וַ/יֵּ֨לֶךְ יְהוֹשֻׁ֤עַ אֵלָי/ו֙ וַ/יֹּ֣אמֶר ל֔/וֹ הֲ/לָ֥/נוּ אַתָּ֖ה אִם לְ/צָרֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/013.yaml
  text: And it happened[a], when Joshua was by Jericho, that he lifted up his eyes and looked, and behold, a man was standing opposite him with his sword drawn in his hand. Joshua went to him and said to him, “Are you for us, or for our enemies?”
translation:
  language: de
  text: 'Als Josua bei Jericho war[a], blickte er auf und sah: Da stand ihm ein Mann gegenüber und hielt sein gezogenes Schwert in der Hand. Josua ging auf ihn zu und fragte ihn: »Gehörst du zu uns oder zu unseren Feinden?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in Jericho« beziehungsweise »nahe bei Jericho«. Die hebräische Präposition kann den Ort weiter gefasst bezeichnen und legt nicht eindeutig fest, ob Josua sich innerhalb der Stadt befand.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בִּהְיוֹת
  choice: Als ... war
  rationale: Die Verbindung eröffnet eine neue Szene und bezeichnet zugleich den zeitlichen Umstand. Im Deutschen gibt der temporale Nebensatz dies natürlich wieder; ein zusätzliches »Und es geschah« wäre schwerfällig.
- source_word: בִּירִיחוֹ
  choice: bei Jericho
  rationale: Die Präposition ב kann den Ort weiter gefasst bezeichnen. »Bei Jericho« passt zum militärischen Kontext, ohne einen Aufenthalt innerhalb der noch nicht eingenommenen Stadt festzulegen.
- source_word: וַיִּשָּׂא עֵינָיו וַיַּרְא
  choice: blickte er auf und sah
  rationale: »Aufblicken« gibt die hebräische Wendung idiomatisch und anschaulich wieder; »und sah« bildet das folgende Verb eigenständig ab.
- source_word: וְהִנֵּה
  choice: Da
  rationale: Das präsentierende Signalwort lenkt den Blick unvermittelt auf die Erscheinung. »Da« erfüllt diese Funktion in einer natürlichen, würdigen deutschen Erzählweise.
- source_word: אִישׁ
  choice: ein Mann
  rationale: Der Vers bezeichnet die Gestalt zunächst nur als Mann. Eine nähere übernatürliche oder christologische Bestimmung würde dem Vers vorgreifen.
- source_word: עֹמֵד לְנֶגְדּוֹ
  choice: stand ihm ... gegenüber
  rationale: Die Formulierung bewahrt sowohl die räumliche Gegenüberstellung als auch den konfrontativen Eindruck.
- source_word: וְחַרְבּוֹ שְׁלוּפָה בְּיָדוֹ
  choice: das Schwert in der Hand gezogen
  rationale: Die Wiedergabe hält fest, dass das Schwert bereits aus der Scheide gezogen ist, und bewahrt die bedrohliche Haltung.
- source_word: וַיֵּלֶךְ ... אֵלָיו
  choice: ging auf ihn zu
  rationale: Dies gibt die zielgerichtete Bewegung Josuas in natürlichem Deutsch wieder.
- source_word: הֲלָנוּ אַתָּה אִם לְצָרֵינוּ
  choice: Gehörst du zu uns oder zu unseren Feinden?
  rationale: Die Konstruktion mit ל fragt im Kontext nach der Zugehörigkeit beziehungsweise Parteinahme. Diese Fassung ist klar und lässt die Frage nach Loyalität offen, ohne zusätzliche Deutung.
theological_decisions:
- issue: Identität des Josua gegenüberstehenden Mannes
  choice: Neutral als »ein Mann« wiedergegeben
  alternative: Engel, Engel des HERRN oder theophanische beziehungsweise christophanische Erscheinung
  rationale: Der vorliegende Vers selbst nennt die Gestalt lediglich אִישׁ, »Mann«. Die Übersetzung soll eine mögliche Deutung aus dem Folgekontext nicht vorwegnehmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Hebräische Erzählformeln werden nicht mechanisch nachgebildet, sondern in einen flüssigen deutschen Satz überführt; die anschaulichen Einzelzüge und die offene Identität der Gestalt bleiben erhalten.
