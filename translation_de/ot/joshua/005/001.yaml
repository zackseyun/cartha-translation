revisions:
- from: Und als alle Könige der Amoriter westlich des Jordan und alle Könige der Kanaaniter, die am Meer lebten[a], hörten, dass Jahwe das Wasser des Jordan vor den Israeliten hatte austrocknen lassen, bis wir hinübergezogen waren[b], da schmolz ihnen das Herz, und es war kein Geist mehr in ihnen[c] aus Angst vor den Israeliten.
  to: Und als alle Könige der Amoriter westlich des Jordan und alle Könige der Kanaaniter, die am Meer wohnten[a], hörten, dass Jahwe das Wasser des Jordan vor den Israeliten hatte austrocknen lassen, bis wir hinübergezogen waren[b], da schmolz ihnen das Herz, und es war kein Geist mehr in ihnen[c] aus Angst vor den Israeliten.
  rationale: Eine geringe stilistische Präzisierung ersetzt „lebten“ durch „wohnten“ und passt die parallele Fußnotenformulierung an. Damit wird die geografische Aussage des Hebräischen klarer wiedergegeben, ohne eine weitergehende historische Deutung einzutragen. Alle Fußnotenanker bleiben korrekt an den jeweils erläuterten Textstellen verankert.
