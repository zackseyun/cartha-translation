  terminology: „Jahwe“ ist als Wiedergabe des Tetragramms konsistent. „Israeliten“ ist im modernen Deutschen natürlich. „Da schmolz ihnen das Herz“ bewahrt den hebräischen kollektiven Singular treffend. „Geist“ erhält die bewusst offene Bildlichkeit von רוּחַ; die Fußnote erklärt die im Kontext gemeinte Entmutigung, ohne die Hauptfassung zu verengen.
