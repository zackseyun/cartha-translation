source:
  edition: WLC
  text: וַ/יְהִ֣י כִ/שְׁמֹ֣עַ כָּל מַלְכֵ֣י הָ/אֱמֹרִ֡י אֲשֶׁר֩ בְּ/עֵ֨בֶר הַ/יַּרְדֵּ֜ן יָ֗מָּ/ה וְ/כָל מַלְכֵ֤י הַֽ/כְּנַעֲנִי֙ אֲשֶׁ֣ר עַל הַ/יָּ֔ם אֵ֠ת אֲשֶׁר הוֹבִ֨ישׁ יְהוָ֜ה אֶת מֵ֧י הַ/יַּרְדֵּ֛ן מִ/פְּנֵ֥י בְנֵֽי יִשְׂרָאֵ֖ל עַד עבר/נו וַ/יִּמַּ֣ס לְבָבָ֗/ם וְ/לֹא הָ֨יָה בָ֥/ם עוֹד֙ ר֔וּחַ מִ/פְּנֵ֖י בְּנֵֽי יִשְׂרָאֵֽל־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/001.yaml
  text: And it happened[a], when all the kings of the Amorites who were beyond the Jordan to the west, and all the kings of the Canaanites who were by the sea, heard that Yahweh had dried up the waters of the Jordan before the sons of Israel until we had crossed over, their heart melted[c][b], and there was no longer spirit in them because of the sons of Israel.
translation:
  language: de
  text: Und als alle Könige der Amoriter westlich des Jordan und alle Könige der Kanaaniter, die am Meer wohnten[a], hörten, dass Jahwe das Wasser des Jordan vor den Israeliten hatte austrocknen lassen, bis wir hinübergezogen waren[b], da schmolz ihnen das Herz, und es war kein Geist mehr in ihnen[c] aus Angst vor den Israeliten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die an der Küste wohnten“. „Am Meer“ bezeichnet hier das Küstengebiet.'
    reason: lexical_alternative
  - marker: b
    text: 'Einige Handschriften und alte Übersetzungen lesen: „bis sie hinübergezogen waren“.'
    reason: textual_variant
  - marker: c
    text: Die hebräische Wendung bedeutet, dass sie allen Mut und jede innere Kraft verloren hatten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִשְׁמֹעַ
  choice: Und als … hörten
  rationale: Die Verbindung eröffnet den neuen Erzählabschnitt und bezeichnet zugleich den zeitlichen Umstand. Im Deutschen gibt „Und als … hörten“ dies natürlich wieder, ohne die schwerfällige Formel „Und es geschah“ voranzustellen.
- source_word: בְּעֵבֶר הַיַּרְדֵּן יָמָּה
  choice: westlich des Jordan
  rationale: יָמָּה bezeichnet die Richtung nach Westen beziehungsweise zum Meer; im gegebenen geografischen Zusammenhang ist „westlich des Jordan“ klar und knapp.
- source_word: אֲשֶׁר עַל הַיָּם
  choice: die am Meer lebten
  rationale: Die Wendung bezeichnet die kanaanitischen Herrscher im Küstengebiet. „Am Meer“ bewahrt die Bildsprache des Hebräischen; die räumliche Bedeutung wird in einer Fußnote erläutert.
- source_word: הוֹבִישׁ
  choice: hatte … austrocknen lassen
  rationale: Der Hifil von יבש bedeutet, etwas trocken werden zu lassen beziehungsweise auszutrocknen. Das Plusquamperfekt ordnet das Austrocknen zeitlich vor dem Hören ein.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen stehende Gottesname wird in der im Deutschen üblichen Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Israeliten
  rationale: Die feste hebräische Volksbezeichnung wird im modernen Deutschen natürlich und eindeutig mit „Israeliten“ wiedergegeben.
- source_word: עַד עברנו
  choice: bis wir hinübergezogen waren
  rationale: Die masoretische Konsonantenform weist auf die erste Person Plural. Die in Handschriften und alten Übersetzungen bezeugte dritte Person wird wegen ihrer inhaltlichen Bedeutung in einer Fußnote genannt.
- source_word: וַיִּמַּס לְבָבָם
  choice: da schmolz ihnen das Herz
  rationale: Die deutsche Formulierung bewahrt sowohl das hebräische Bild des Schmelzens als auch den kollektiven Singular „Herz“ und drückt den Verlust des Mutes verständlich aus.
- source_word: וְלֹא הָיָה בָם עוֹד רוּחַ
  choice: es war kein Geist mehr in ihnen
  rationale: רוּחַ kann Geist, Atem oder innere Kraft und Mut bezeichnen. Die relativ formnahe Wiedergabe bewahrt diese Bedeutungsbreite; eine Fußnote erklärt die idiomatische Aussage.
- source_word: מִפְּנֵי בְנֵי יִשְׂרָאֵל
  choice: aus Angst vor den Israeliten
  rationale: מִפְּנֵי bezeichnet hier den Grund ihrer Entmutigung. „Aus Angst vor“ macht den im Zusammenhang gemeinten Kausalzusammenhang in natürlichem Deutsch deutlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn, statt ihn durch den Titel „der HERR“ zu ersetzen.
- issue: Person in עַד עברנו
  choice: bis wir hinübergezogen waren
  alternative: bis sie hinübergezogen waren
  rationale: Die erste Person folgt der masoretischen Konsonantenform und lässt eine Identifikation der Erzählerstimme mit Israel zu. Da die dritte Person textlich gut bezeugt ist und besser zum unmittelbaren Erzählkontext passt, wird sie ausdrücklich in der Fußnote dokumentiert.
- issue: Bedeutungsweite von רוּחַ
  choice: kein Geist mehr in ihnen
  alternative: sie hatten keinen Mut mehr
  rationale: Die Hauptfassung bewahrt die mögliche Bedeutungsspanne von Geist, Atem, Lebenskraft und Mut, ohne die Aussage ausschließlich psychologisch festzulegen. Die idiomatische Bedeutung wird in der Fußnote erläutert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit flüssigem Erzählrhythmus. Das hebräische Bild vom schmelzenden Herzen und die Mehrdeutigkeit von רוּחַ bleiben erhalten; geografische und textkritische Einzelheiten werden knapp in Fußnoten erläutert.
