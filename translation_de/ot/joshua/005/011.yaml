  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֨אכְל֜וּ מֵ/עֲב֥וּר הָ/אָ֛רֶץ מִ/מָּֽחֳרַ֥ת הַ/פֶּ֖סַח מַצּ֣וֹת וְ/קָל֑וּי בְּ/עֶ֖צֶם הַ/יּ֥וֹם הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/011.yaml
  text: 'And they ate some of the produce of the land on the day after the Passover: unleavened bread and roasted grain[b][a], on this very day.'
translation:
  language: de
  text: 'Und sie aßen am Tag nach dem Passafest vom Ertrag des Landes[b]: ungesäuertes Brot und geröstetes Getreide[a] – genau an diesem Tag.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „geröstete Körner“. Gemeint ist durch Rösten zubereitetes Getreide.'
    reason: lexical_alternative
  - marker: b
    text: „Ertrag des Landes“ kann hier auch als gelagerter Ertrag der vorigen Ernte verstanden werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאכְלוּ
  choice: Und sie aßen
  rationale: Die Wayyiqtol-Form führt die Erzählung fort; „Und sie aßen“ bewahrt den schlichten hebräischen Erzählfluss.
- source_word: מֵעֲבוּר הָאָרֶץ
  choice: vom Ertrag des Landes
  rationale: עֲבוּר bezeichnet hier den Ertrag beziehungsweise die Erzeugnisse des Landes. „Ertrag“ ist im Deutschen natürlich und vermeidet die nicht ausdrücklich im Wort enthaltene Festlegung auf Vorräte der vorigen Ernte.
- source_word: מִמָּחֳרַת הַפֶּסַח
  choice: am Tag nach dem Passafest
  rationale: Die Präpositionalfügung bezeichnet den folgenden Tag. „Passafest“ macht im Deutschen deutlich, dass hier nicht das Passalamm gemeint sein muss.
- source_word: מַצּוֹת
  choice: ungesäuertes Brot
  rationale: Dies ist die geläufige und verständliche Wiedergabe im Passakontext.
- source_word: וְקָלוּי
  choice: und geröstetes Getreide
  rationale: קָלוּי bezeichnet durch Rösten zubereitetes Getreide; die Wiedergabe ist präzise und allgemein verständlich.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: genau an diesem Tag
  rationale: Die Wendung betont die zeitliche Genauigkeit; „diesem“ erhält zugleich die deiktische Form des Hebräischen.
theological_decisions:
- issue: Ob עֲבוּר ausdrücklich alten Erntevorrat bezeichnet
  choice: Ertrag des Landes
  alternative: alter Ertrag des Landes / Vorräte des Landes
  rationale: Das Adjektiv „alt“ steht nicht ausdrücklich im hebräischen Text. Die im Kontext mögliche Deutung als gelagerter Ertrag wird deshalb in einer Fußnote bewahrt, nicht in den Haupttext eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit schlichtem Erzählfluss. „Passafest“ ist für heutige Leser klar; die Wiederholung „Tag … Tag“ folgt der ausdrücklichen zeitlichen Betonung des Hebräischen. Alle Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
