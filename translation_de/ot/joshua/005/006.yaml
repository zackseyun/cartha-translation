  terminology: »Jahwe«, »Israeliten«, »Wüste«, »Land« sowie die traditionelle Metapher »ein Land, in dem Milch und Honig fließen« sind passend. Die Fußnote ist korrekt am unerwarteten Pronomen »uns« verankert und gibt die abweichende Lesart ohne Wertung wieder.
