revisions:
- from: Denn vierzig Jahre lang zogen die Israeliten durch die Wüste, bis das ganze Volk – die Kriegsmänner, die aus Ägypten ausgezogen waren – nicht mehr da war, weil sie nicht auf die Stimme Jahwes gehört hatten. Jahwe hatte ihnen geschworen, er werde sie das Land nicht sehen lassen, das Jahwe ihren Vorfahren geschworen hatte, uns[a] zu geben – ein Land, in dem Milch und Honig fließen.
  to: Denn vierzig Jahre lang zogen die Israeliten durch die Wüste, bis das ganze Volk – die Krieger, die aus Ägypten ausgezogen waren – nicht mehr bestand, weil sie nicht auf die Stimme Jahwes gehört hatten. Jahwe hatte ihnen geschworen, er werde sie das Land nicht sehen lassen, das Jahwe ihren Vorfahren geschworen hatte, uns[a] zu geben – ein Land, in dem Milch und Honig fließen.
  rationale: Die Revision beschränkt sich auf zwei stilistische Verbesserungen. Sie ersetzt das im modernen Deutsch unübliche »Kriegsmänner« durch »Krieger« und die umgangssprachliche Wendung »nicht mehr da war« durch »nicht mehr bestand«. Die unklare bzw. textkritisch bemerkenswerte erste Person Plural in לָנוּ bleibt im Haupttext erhalten und ist weiterhin präzise mit einer Fußnote versehen.
