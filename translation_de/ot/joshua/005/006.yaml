source:
  edition: WLC
  text: כִּ֣י אַרְבָּעִ֣ים שָׁנָ֗ה הָלְכ֣וּ בְנֵֽי יִשְׂרָאֵל֮ בַּ/מִּדְבָּר֒ עַד תֹּ֨ם כָּל הַ/גּ֜וֹי אַנְשֵׁ֤י הַ/מִּלְחָמָה֙ הַ/יֹּצְאִ֣ים מִ/מִּצְרַ֔יִם אֲשֶׁ֥ר לֹֽא שָׁמְע֖וּ בְּ/ק֣וֹל יְהוָ֑ה אֲשֶׁ֨ר נִשְׁבַּ֤ע יְהוָה֙ לָ/הֶ֔ם לְ/בִלְתִּ֞י הַרְאוֹתָ֣/ם אֶת הָ/אָ֗רֶץ אֲשֶׁר֩ נִשְׁבַּ֨ע יְהוָ֤ה לַֽ/אֲבוֹתָ/ם֙ לָ֣/תֶת לָ֔/נוּ אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/006.yaml
  text: For the sons of Israel had walked in the wilderness forty years[a], until all the nation—the men of war who came out of Egypt—had come to an end, because they had not listened to the voice of Yahweh. Yahweh had sworn to them that he would not let them see the land that Yahweh had sworn to their fathers to give to us, a land flowing with milk and honey.
translation:
  language: de
  text: Denn vierzig Jahre lang zogen die Israeliten durch die Wüste, bis das ganze Volk – die Krieger, die aus Ägypten ausgezogen waren – nicht mehr bestand, weil sie nicht auf die Stimme Jahwes gehört hatten. Jahwe hatte ihnen geschworen, er werde sie das Land nicht sehen lassen, das Jahwe ihren Vorfahren geschworen hatte, uns[a] zu geben – ein Land, in dem Milch und Honig fließen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »uns«; einige alte Textzeugen und Übersetzungen lesen: »ihnen«.'
    reason: textual_variant
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für den vorausgehenden Zusammenhang ein und bewahrt die erklärende Funktion der Konjunktion.
- source_word: הָלְכוּ בְנֵי יִשְׂרָאֵל בַּמִּדְבָּר
  choice: zogen die Israeliten durch die Wüste
  rationale: „Zogen“ gibt die Bewegung von הלך im erzählenden Zusammenhang natürlich wieder; „die Israeliten“ ist im modernen Deutschen die geläufige Bezeichnung für בני ישראל. Die Präposition wird kontextgerecht mit „durch“ wiedergegeben, da es um die vierzigjährige Wanderung geht.
- source_word: עַד תֹּם כָּל הַגּוֹי
  choice: bis das ganze Volk … nicht mehr da war
  rationale: תֹּם bezeichnet das vollständige Zu-Ende-Kommen der betreffenden Gruppe. Die Formulierung wahrt diese Aussage, ohne die Todesart näher zu bestimmen.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: die Kriegsmänner
  rationale: Gibt die ausdrücklich männliche und militärische Bezeichnung eng am Hebräischen wieder; die Apposition erläutert, wer mit „dem ganzen Volk“ in diesem Satz gemeint ist.
- source_word: לֹא שָׁמְעוּ בְּקוֹל יְהוָה
  choice: nicht auf die Stimme Jahwes gehört hatten
  rationale: Bewahrt das hebräische Bild des Hörens auf eine Stimme und zugleich dessen Bedeutung des Gehorchens.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen im Deutschen in seiner geläufigen wissenschaftlichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: נִשְׁבַּע ... לְבִלְתִּי הַרְאוֹתָם
  choice: hatte ihnen geschworen, er werde sie … nicht sehen lassen
  rationale: Die indirekte Rede ist im Deutschen natürlich und gibt sowohl den Eid als auch den kausativen Sinn von הראם wieder.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: ein Land, in dem Milch und Honig fließen
  rationale: Bewahrt das traditionelle und bildhafte Hebräisch in verständlichem, natürlichem Deutsch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen ausdrücklich. „Jahwe“ erhält diesen Charakter und vermeidet die Ersetzung durch einen Titel.
- issue: Pronomen in לָנוּ
  choice: uns
  alternative: ihnen
  rationale: Der masoretische Text bietet eindeutig die erste Person Plural. Diese unerwartete Lesart wird im Haupttext beibehalten; die in einigen alten Überlieferungen und Übersetzungen bezeugte dritte Person wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt dem hebräischen Gedankengang nahe, wird aber durch Gedankenstriche und natürliche deutsche Tempusfolge lesbar gestaltet. Die genuine textkritische Spannung bei לָנוּ wird nicht geglättet.
