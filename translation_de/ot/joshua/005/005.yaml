  yaml_path: translation/ot/joshua/005/005.yaml
  text: For all the people who came out had been circumcised[a], but all the people born in the wilderness on the way as they came out from Egypt had not been circumcised.
translation:
  language: de
  text: Denn das ganze Volk, das ausgezogen war, war beschnitten. Aber das ganze Volk, das in der Wüste auf dem Weg geboren worden war, als sie aus Ägypten auszogen, hatte man nicht beschnitten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „… das ganze Volk, das in der Wüste auf dem Weg bei ihrem Auszug aus Ägypten geboren worden war, beschnitten sie nicht.“ Das Hebräische verbindet die Geburt mit dem Weg beim Auszug aus Ägypten und nennt nicht ausdrücklich, wer die Beschneidung unterließ.'
    reason: Bewahrt die zeitlich-syntaktische Verknüpfung von בְּצֵאתָם מִמִּצְרַיִם sowie das ungenannte Subjekt von לֹא מָלוּ.
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion leitet die Begründung für die vorausgehende Aussage ein; „denn“ gibt diesen Zusammenhang im Deutschen natürlich wieder.
- source_word: מֻלִים הָיוּ
  choice: war beschnitten
  rationale: Das passive Partizip mit היה bezeichnet einen bestehenden, bereits erreichten Zustand. Im Deutschen drückt „war beschnitten“ dies natürlich aus.
- source_word: כָּל הָעָם הַיֹּצְאִים
  choice: das ganze Volk, das aus Ägypten ausgezogen war
  rationale: עם bezeichnet kollektiv das Volk; das substantivierte Partizip bezieht sich auf die Generation des Auszugs. „Aus Ägypten“ wird aus dem später ausdrücklich genannten Zusammenhang aufgenommen, um den Bezug im Deutschen klarzumachen.
- source_word: וְכָל הָעָם הַיִּלֹּדִים
  choice: Aber das ganze Volk, das … geboren worden war
  rationale: Das וְ verbindet hier zwei gegensätzliche Gruppen; „aber“ macht den im Hebräischen erkennbaren Kontrast idiomatisch deutlich. Die Passivform wird mit „geboren worden war“ wiedergegeben.
- source_word: בַּמִּדְבָּר בַּדֶּרֶךְ
  choice: unterwegs in der Wüste
  rationale: Die beiden Präpositionalangaben bezeichnen Ort und Reisesituation. „Unterwegs in der Wüste“ ist natürliches Deutsch und bewahrt beide Elemente.
- source_word: בְּצֵאתָם מִמִּצְרַיִם
  choice: nach dem Auszug aus Ägypten
  rationale: Die Wendung bezeichnet den zeitlich und sachlich mit dem Auszug verbundenen Weg durch die Wüste. „Nach dem Auszug“ vermeidet im Deutschen die missverständliche Vorstellung, alle Betreffenden seien noch während des eigentlichen Verlassens Ägyptens geboren worden; die engere hebräische Form wird in der Fußnote ausgewiesen.
- source_word: לֹא מָלוּ
  choice: hatte man nicht beschnitten
  rationale: Das hebräische aktive Verb nennt kein ausdrückliches Subjekt. Das unpersönliche deutsche „man“ bewahrt dies besser als eine vollständig passive Wiedergabe und richtet den Fokus weiterhin auf die unbeschnittene Wüstengeneration.
