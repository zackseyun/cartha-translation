source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל יְהוֹשֻׁ֔עַ הַ/יּ֗וֹם גַּלּ֛וֹתִי אֶת חֶרְפַּ֥ת מִצְרַ֖יִם מֵ/עֲלֵי/כֶ֑ם וַ/יִּקְרָ֞א שֵׁ֣ם הַ/מָּק֤וֹם הַ/הוּא֙ גִּלְגָּ֔ל עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/009.yaml
  text: And Yahweh said to Joshua[b][a], “Today I have rolled away the reproach of Egypt from upon you.” So the name of that place was called Gilgal to this day.
translation:
  language: de
  text: 'Da sagte Jahwe zu Josua: „Heute habe ich die Schmach Ägyptens von euch abgewälzt.“ Deshalb nannte man diesen Ort Gilgal[a], und so heißt er bis heute.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Gilgal“ klingt im Hebräischen an das Verb für „abwälzen“ an; dadurch entsteht ein Wortspiel mit „habe ich … abgewälzt“.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen geläufige Wiedergabe des Gottesnamens bewahrt ihn als Eigennamen.
- source_word: גַּלּוֹתִי
  choice: habe ich … abgewälzt
  rationale: Bewahrt das Bild des Wegwälzens und macht das hebräische Wortspiel mit Gilgal im Deutschen soweit möglich sichtbar.
- source_word: חֶרְפַּת מִצְרַיִם
  choice: die Schmach Ägyptens
  rationale: „Schmach“ gibt die soziale Bedeutung von חֶרְפָּה wieder; die Genitivverbindung bleibt wie im Hebräischen bewusst mehrdeutig.
- source_word: מֵעֲלֵיכֶם
  choice: von euch
  rationale: Natürliches modernes Deutsch; „abgewälzt“ trägt bereits das Bild einer auf ihnen liegenden Last.
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם הַהוּא גִּלְגָּל
  choice: Deshalb nannte man diesen Ort Gilgal
  rationale: Das unbestimmte „man“ gibt die nicht ausdrücklich genannte Subjektzuweisung zurückhaltend wieder und klingt natürlicher als eine wörtliche Namensformel.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: und so heißt er bis heute
  rationale: Idiommatische deutsche Wiedergabe der zeitlichen Erzählerformel im Zusammenhang mit der Namensgebung.
theological_decisions:
- issue: Bedeutung von „die Schmach Ägyptens“
  choice: Die mehrdeutige Genitivverbindung bleibt im Haupttext erhalten.
  alternative: Israels Schmach in Ägypten; von Ägypten ausgehende Verhöhnung; mit fehlender Beschneidung verbundene Bundesschmach
  rationale: Der hebräische Wortlaut legt keine dieser Deutungen ausdrücklich fest; die Übersetzung soll diese theologische und historische Offenheit nicht voreilig auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur ist erzählerisch natürlich; „Schmach“ und „abgewälzt“ bewahren zugleich die Bildhaftigkeit und Mehrdeutigkeit des Hebräischen.
