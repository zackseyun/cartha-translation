base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/003.yaml
  text: So Joshua made for himself flint knives and circumcised the sons of Israel at Gibeath-haaraloth[a][b][c].
translation:
  language: de
  text: Da fertigte Josua sich Messer aus Feuerstein an[a] und beschnitt die Söhne Israels[b] am Hügel der Vorhäute[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Klingen aus Feuerstein“. Das hebräische Wort für das Werkzeug bedeutet häufig „Schwert“, bezeichnet hier aber Schneidewerkzeuge für die Beschneidung.
    reason: lexical_alternative
  - marker: b
    text: Viele Übersetzungen geben den hebräischen Ausdruck „Söhne Israels“ mit „Israeliten“ wieder.
    reason: lexical_alternative
  - marker: c
    text: Als Ortsname auch „Gib'at Ha-Aralot“. Der hebräische Name bedeutet „Hügel der Vorhäute“.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ לּוֹ
  choice: fertigte … sich … an
  rationale: Das Verb עשה bedeutet hier „machen/anfertigen“; לּוֹ wird im Zusammenhang sinnvoll reflexiv verstanden. „Fertigte sich … an“ ist natürliches Deutsch und bewahrt den Gedanken der Herstellung für den eigenen Gebrauch.
- source_word: חַרְבוֹת צֻרִים
  choice: Messer aus Feuerstein
  rationale: חֶרֶב bezeichnet häufig ein Schwert oder eine Klinge, meint hier aufgrund der Beschneidung jedoch ein Schneidewerkzeug. צֻרִים bezeichnet das steinerne Material, präzise Feuerstein.
- source_word: וַיָּמָל
  choice: beschnitt
  rationale: Das Verb מול bezeichnet eindeutig die Beschneidung.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die Wiedergabe bildet die ausdrücklich maskuline hebräische Wendung formal ab und bleibt im biblischen Erzählzusammenhang verständlich.
- source_word: אֶל גִּבְעַת הָעֲרָלוֹת
  choice: am Hügel der Vorhäute
  rationale: אֶל bezeichnet hier idiomatisch den Ort des Geschehens. Der transparente Ortsname besteht aus „Hügel“ und „Vorhäute“; seine Übersetzung macht den hebräischen Sinn unmittelbar zugänglich.
