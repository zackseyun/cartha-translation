base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/004.yaml
  text: 'And this is the reason why Joshua circumcised them: all the people who came out of Egypt[a], the males, all the men of war[b], had died in the wilderness on the way after they came out of Egypt.'
translation:
  language: de
  text: Und dies ist der Grund, warum Josua sie beschnitt:[a] Alle Männer des Volkes, die aus Ägypten ausgezogen waren – alle kampffähigen Männer[b] –, waren in der Wüste auf dem Weg gestorben, nachdem sie aus Ägypten ausgezogen waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Und dies ist die Sache, die Josua beschnitt.“ Die hebräische Wendung leitet hier die Begründung für Josuas Handeln ein.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „alle Männer des Krieges“; auch möglich: „alle Krieger“ oder „alle kriegstüchtigen Männer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה הַדָּבָר אֲשֶׁר מָל יְהוֹשֻׁעַ
  choice: Und aus folgendem Grund nahm Josua die Beschneidung vor
  rationale: Die wörtliche Konstruktion „Dies ist die Sache, die Josua beschnitt“ ist im Deutschen missverständlich. Im Zusammenhang leitet die hebräische Wendung die Erklärung für Josuas Handlung ein; die gewählte Fassung gibt diese Funktion natürlich wieder.
- source_word: כָּל הָעָם הַיֹּצֵא מִמִּצְרַיִם הַזְּכָרִים
  choice: Alle männlichen Angehörigen des Volkes, die aus Ägypten ausgezogen waren
  rationale: „Männliche Angehörige“ bewahrt die ausdrückliche Geschlechtsbezeichnung הַזְּכָרִים, während der Relativsatz das Partizip הַיֹּצֵא im zeitlichen Verhältnis zur Haupthandlung wiedergibt.
- source_word: כֹּל אַנְשֵׁי הַמִּלְחָמָה
  choice: alle kriegstüchtigen Männer
  rationale: Die Wendung bezeichnet die für den Krieg bestimmten beziehungsweise kampffähigen Männer. „Kriegstüchtige Männer“ ist verständlich und bewahrt die militärische Bezeichnung, ohne sie zu bloßen Berufssoldaten oder aktiv kämpfenden Kriegern zu verengen.
- source_word: מֵתוּ בַמִּדְבָּר בַּדֶּרֶךְ
  choice: waren unterwegs in der Wüste gestorben
  rationale: Das Plusquamperfekt markiert den Tod dieser Generation als der Beschneidung vorausgehend. „Unterwegs in der Wüste“ gibt sowohl den Ort als auch den Verlauf der Reise wieder.
- source_word: בְּצֵאתָם מִמִּצְרָיִם
  choice: nach ihrem Auszug aus Ägypten
  rationale: Die temporale Infinitivkonstruktion wird als Rückbezug auf den Auszug und die anschließende Reise verstanden; die Formulierung ist im Deutschen knapp und natürlich.
theological_decisions:
- issue: Bezug von „alle kriegstüchtigen Männer“
  choice: Als erläuternde Apposition zu den männlichen Angehörigen des ausgezogenen Volkes wiedergegeben
  alternative: Als zweite, eigenständige Personengruppe wiedergeben
  rationale: Die hebräische Folge steht ohne verbindende Konjunktion und beschreibt näher, welche männlichen Angehörigen hier im Blick sind. Gedankenstriche machen die Apposition sichtbar, ohne mehr Identität zu behaupten, als die Satzstruktur nahelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Nahm die Beschneidung vor“ vermeidet ein im Deutschen fehlendes oder unnatürlich wirkendes Objekt bei „beschnitt“. Die Gedankenstriche kennzeichnen die militärische Bezeichnung als Apposition; das Plusquamperfekt wahrt die zeitliche Perspektive des erklärenden Rückblicks.
