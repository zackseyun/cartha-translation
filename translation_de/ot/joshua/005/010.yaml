  text: וַ/יַּחֲנ֥וּ בְנֵֽי יִשְׂרָאֵ֖ל בַּ/גִּלְגָּ֑ל וַ/יַּעֲשׂ֣וּ אֶת הַ/פֶּ֡סַח בְּ/אַרְבָּעָה֩ עָשָׂ֨ר י֥וֹם לַ/חֹ֛דֶשׁ בָּ/עֶ֖רֶב בְּ/עַֽרְב֥וֹת יְרִיחֽוֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/010.yaml
  text: And the sons of Israel camped at Gilgal[a], and they kept the Passover on the fourteenth day of the month, in the evening, on the plains of Jericho.
translation:
  language: de
  text: Die Söhne Israels[a] lagerten in Gilgal und feierten am vierzehnten Tag des Monats, am Abend, in den Ebenen von Jericho das Passafest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Israeliten« oder »die Kinder Israels«. Wörtlich steht im Hebräischen: »die Söhne Israels«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲנוּ
  choice: lagerten
  rationale: חנה bezeichnet das Aufschlagen eines Lagers. „lagerten“ ist im Deutschen natürlich und präzise.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die Wiedergabe bewahrt die ausdrücklich männliche und familiäre Formulierung des Hebräischen; das idiomatischere „die Israeliten“ wird in der Fußnote genannt.
- source_word: בַּגִּלְגָּל
  choice: in Gilgal
  rationale: Bei einem Ortsnamen ist „in Gilgal“ im Deutschen die natürliche Angabe des Lagerortes.
- source_word: וַיַּעֲשׂוּ אֶת הַפֶּסַח
  choice: feierten ... das Passafest
  rationale: עשה mit פסח ist idiomatisch als Begehen oder Feiern des Passas zu verstehen; „feierten das Passafest“ ist gegenwärtiges, verständliches Deutsch.
- source_word: הַפֶּסַח
  choice: das Passafest
  rationale: Die Formulierung bezeichnet hier die kultische Passafeier; „Passafest“ ist eindeutig und geläufig.
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: am vierzehnten Tag des Monats
  rationale: Dies gibt die hebräische Kalenderangabe präzise und idiomatisch wieder.
- source_word: בָּעֶרֶב
  choice: am Abend
  rationale: Die Zeitangabe wird knapp und natürlich wiedergegeben, ohne eine genauere Tageszeit festzulegen.
- source_word: בְּעַרְבוֹת יְרִיחוֹ
  choice: in den Ebenen von Jericho
  rationale: עֲרָבוֹת bezeichnet die offenen Ebenen beziehungsweise Steppen der betreffenden Gegend; „Ebenen“ ist verständlich und geografisch passend.
theological_decisions:
- issue: Wiedergabe von בְנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Israeliten; die Kinder Israels
  rationale: Obwohl keine unmittelbare Lehrfrage betroffen ist, bewahrt „Söhne Israels“ die ausdrücklich männliche, familiäre Form des Ausgangstextes. Die idiomatischen Alternativen werden transparent in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nah an der hebräischen Abfolge, ist aber für heutige Leser flüssig; die eingeschobene Zeitangabe verhindert eine missverständliche Zuordnung des Abends zum Monatsdatum.
