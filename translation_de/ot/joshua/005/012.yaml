source:
  edition: WLC
  text: וַ/יִּשְׁבֹּ֨ת הַ/מָּ֜ן מִֽ/מָּחֳרָ֗ת בְּ/אָכְלָ/ם֙ מֵ/עֲב֣וּר הָ/אָ֔רֶץ וְ/לֹא הָ֥יָה ע֛וֹד לִ/בְנֵ֥י יִשְׂרָאֵ֖ל מָ֑ן וַ/יֹּאכְל֗וּ מִ/תְּבוּאַת֙ אֶ֣רֶץ כְּנַ֔עַן בַּ/שָּׁנָ֖ה הַ/הִֽיא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/012.yaml
  text: And the manna ceased on the next day[a], after they had eaten from the produce of the land. There was no longer manna for the sons of Israel[b], and they ate from the yield of the land of Canaan that year.
translation:
  language: de
  text: Da hörte das Manna am folgenden Tag auf, nachdem sie von den Erzeugnissen des Landes[a] gegessen hatten. Für die Israeliten[b] gab es kein Manna mehr, und in jenem Jahr aßen sie vom Ertrag des Landes Kanaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von den Vorräten des Landes“. Das hebräische Wort kann sich genauer auf eingelagerte Erzeugnisse der vorjährigen Ernte beziehen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „für die Söhne Israels“. Gemeint ist das Volk Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבֹּת
  choice: hörte ... auf
  rationale: Das Verb שׁבת bezeichnet hier das Aufhören des Mannas, nicht eine Sabbatfeier. Die deutsche Wendung ist natürlich und präzise.
- source_word: הַמָּן / מָן
  choice: das Manna / Manna
  rationale: „Manna“ ist die etablierte deutsche Bezeichnung für die Speise während der Wüstenwanderung; der Artikel des ersten Vorkommens wird wiedergegeben.
- source_word: מִמָּחֳרָת
  choice: am folgenden Tag
  rationale: Die Zeitangabe bezeichnet im Erzählzusammenhang den Tag nach der zuvor erwähnten Mahlzeit und wird im Deutschen idiomatisch wiedergegeben.
- source_word: בְּאָכְלָם
  choice: nachdem sie ... gegessen hatten
  rationale: Der Infinitiv mit ב kann temporal verstanden werden. Die Vorzeitigkeit verdeutlicht hier den im Zusammenhang naheliegenden Ablauf.
- source_word: מֵעֲבוּר הָאָרֶץ
  choice: von den Erzeugnissen des Landes
  rationale: עֲבוּר bezeichnet hier die landwirtschaftlichen Erzeugnisse des Landes. Ob damit genauer eingelagerte Erzeugnisse der Vorjahresernte gemeint sind, bleibt im Haupttext offen und wird in einer Fußnote genannt.
- source_word: וְלֹא הָיָה עוֹד
  choice: gab es ... kein ... mehr
  rationale: Diese im Deutschen natürliche Existenzformulierung gibt die hebräische Wendung mit עוֹד genau wieder.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: für die Israeliten
  rationale: Die gebräuchliche Volksbezeichnung ist im modernen Deutsch natürlicher als die formale Wiedergabe „Söhne Israels“; die wörtliche Form wird in einer Fußnote dokumentiert.
- source_word: וַיֹּאכְלוּ
  choice: und ... aßen sie
  rationale: Das narrative wayyiqtol wird durch das einfache deutsche Präteritum wiedergegeben.
- source_word: מִתְּבוּאַת
  choice: vom Ertrag
  rationale: תְּבוּאָה bezeichnet den landwirtschaftlichen Ertrag oder die Ernte. „Ertrag“ wahrt zugleich die lexikalische Unterscheidung vom vorherigen עֲבוּר.
- source_word: אֶרֶץ כְּנַעַן
  choice: das Land Kanaan
  rationale: Die Formulierung bewahrt den ausdrücklich genannten Begriff „Land“ und entspricht natürlichem deutschen Bibelstil.
- source_word: בַּשָּׁנָה הַהִיא
  choice: in jenem Jahr
  rationale: Die Wendung gibt die rückverweisende Zeitangabe knapp und idiomatisch wieder.
