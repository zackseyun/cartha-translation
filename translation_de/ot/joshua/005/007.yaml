  text: וְ/אֶת בְּנֵי/הֶם֙ הֵקִ֣ים תַּחְתָּ֔/ם אֹתָ֖/ם מָ֣ל יְהוֹשֻׁ֑עַ כִּי עֲרֵלִ֣ים הָי֔וּ כִּ֛י לֹא מָ֥לוּ אוֹתָ֖/ם בַּ/דָּֽרֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/007.yaml
  text: And Joshua circumcised their sons[a], whom he had raised up in their place, because they were uncircumcised, for they had not circumcised them on the way.
translation:
  language: de
  text: Und ihre Söhne, die er an ihrer Stelle erstehen ließ[a], beschnitt Josua; denn sie waren unbeschnitten, weil man sie unterwegs nicht beschnitten hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „statt ihrer“; die hebräische Wendung besagt, dass diese Söhne an die Stelle der vorherigen Generation traten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת בְּנֵיהֶם
  choice: Und ihre Söhne
  rationale: בְּנֵיהֶם bezeichnet im Zusammenhang der Beschneidung präzise die männlichen Nachkommen; וְ führt die Erzählung fort.
- source_word: הֵקִים תַּחְתָּם
  choice: die er an ihrer Stelle hatte aufwachsen lassen
  rationale: Der Hifil von קום bezeichnet hier das Heranwachsen beziehungsweise Hervortreten der Söhne als Nachfolgegeneration; תַּחְתָּם drückt Stellvertretung oder Nachfolge aus. Das Plusquamperfekt macht den zeitlichen Bezug vor der Beschneidung deutlich.
- source_word: אֹתָם מָל יְהוֹשֻׁעַ
  choice: beschnitt Josua
  rationale: מול ist das übliche Verb für die Beschneidung. Die deutsche Satzstellung bewahrt die Hervorhebung der zuvor genannten Söhne.
- source_word: כִּי עֲרֵלִים הָיוּ
  choice: denn sie waren unbeschnitten
  rationale: כִּי begründet Josuas Handlung; עֲרֵלִים bezeichnet hier den konkreten körperlichen und zugleich bundesbezogenen Zustand.
- source_word: כִּי לֹא מָלוּ אֹתָם
  choice: weil man sie nicht beschnitten hatte
  rationale: Das Hebräische hat ein nicht näher bezeichnetes Subjekt in der 3. Person Plural. Das unpersönliche deutsche „man“ erhält diese Unbestimmtheit natürlicher als ein missverständliches „sie“.
- source_word: בַּדָּרֶךְ
  choice: unterwegs
  rationale: Die Wendung bezieht sich auf die Reise beziehungsweise Wüstenwanderung und wird im modernen Deutsch knapp und natürlich mit „unterwegs“ wiedergegeben.
theological_decisions:
- issue: Bundesbezogene Bezeichnung des körperlichen Zustands
  choice: unbeschnitten
  alternative: mit Vorhaut
  rationale: Der Vers spricht von der tatsächlichen Beschneidung. „Unbeschnitten“ ist die geläufige, sachlich genaue Formulierung und bewahrt den bundesgeschichtlichen Bezug, ohne eine metaphorische Deutung einzutragen.
- issue: Handelnde bei der unterlassenen Beschneidung
  choice: unpersönliches „man“
  alternative: „sie hatten sie nicht beschnitten“
  rationale: Das Subjekt von מָלוּ bleibt im Hebräischen unausgesprochen. „Man“ bewahrt diese Unbestimmtheit und verhindert, dass die beiden Vorkommen von „sie“ im Deutschen auf dieselbe Gruppe bezogen werden müssen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge lehnt sich an die hebräische Hervorhebung der Söhne an, bleibt aber gut verständlich. Die Fußnote bewahrt die Bedeutungsbreite von הֵקִים תַּחְתָּם.
