  source_fidelity: 'Die Grundstruktur und die kausalen Beziehungen werden zutreffend wiedergegeben: Josua beschnitt die Söhne, weil sie unbeschnitten waren, da sie unterwegs nicht beschnitten worden waren. „man“ gibt das im Hebräischen nicht ausgedrückte Subjekt von מָלוּ angemessen unbestimmt wieder. „hatte aufwachsen lassen“ ist jedoch für הֵקִים zu eng und verschiebt den Sinn von Hervorbringen/als Nachfolgegeneration erstehen lassen hin zu Erziehung beziehungsweise Heranwachsenlassen.'
