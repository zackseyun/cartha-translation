  yaml_path: translation/ot/joshua/005/008.yaml
  text: And when all the nation had finished being circumcised[a], they remained in their places in the camp until they recovered.
translation:
  language: de
  text: Als das ganze Volk beschnitten worden war, blieben sie an ihrem jeweiligen Platz im Lager, bis sie sich erholt hatten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bis sie geheilt waren“ oder „bis sie wieder zu Kräften gekommen waren“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Als
  rationale: Die hebräische Erzählungsformel leitet hier einen temporalen Nebensatz ein; „Als“ gibt die zeitliche Abfolge im Deutschen natürlich wieder.
- source_word: תַּמּוּ ... לְהִמּוֹל
  choice: beschnitten worden war
  rationale: Die Verbindung bezeichnet den abgeschlossenen Vorgang der Beschneidung. Das deutsche Passiv bewahrt den Sinn der hebräischen Form und vermeidet eine schwerfällige wörtliche Wiedergabe.
- source_word: כָל הַגּוֹי
  choice: das ganze Volk
  rationale: גּוֹי bezeichnet hier Israel als geschlossene Gemeinschaft. „Das ganze Volk“ ist im Deutschen natürlicher als „die ganze Nation“ und bewahrt den kollektiven Singular.
- source_word: וַיֵּשְׁבוּ תַחְתָּם
  choice: blieben sie an ihrem Platz
  rationale: ישׁב bedeutet kontextuell „bleiben“, während תחתם idiomatisch das Verbleiben am jeweiligen Ort bezeichnet, nicht „unter ihnen“.
- source_word: בַּמַּחֲנֶה
  choice: im Lager
  rationale: Dies ist die übliche und klare lokale Wiedergabe.
- source_word: עַד חֲיוֹתָם
  choice: bis sie sich erholt hatten
  rationale: חיה bezeichnet hier nach der Beschneidung die Wiederherstellung von Gesundheit oder Kraft. „Sich erholen“ ist idiomatisch, ohne die mögliche Nuance von Heilung oder Wiedererstarken auszuschließen.
theological_decisions: []
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Erzählton. Die kollektive Bezeichnung „Volk“ und die idiomatische Ortsangabe werden natürlich wiedergegeben; die Bedeutungsbreite von חיה bleibt in der Fußnote sichtbar.
