  text: וַ/יֹּאמֶר֩ שַׂר צְבָ֨א יְהוָ֜ה אֶל יְהוֹשֻׁ֗עַ שַׁל נַֽעַלְ/ךָ֙ מֵ/עַ֣ל רַגְלֶ֔/ךָ כִּ֣י הַ/מָּק֗וֹם אֲשֶׁ֥ר אַתָּ֛ה עֹמֵ֥ד עָלָ֖י/ו קֹ֣דֶשׁ ה֑וּא וַ/יַּ֥עַשׂ יְהוֹשֻׁ֖עַ כֵּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/015.yaml
  text: Then the commander of Yahweh’s army said to Joshua[a], “Take your sandal off your foot[b], because the place where you are standing is holy.” And Joshua did so.
translation:
  language: de
  text: 'Da sagte der Befehlshaber von Jahwes Heer[a] zu Josua: »Streif deine Sandale von deinem Fuß[b], denn der Ort, auf dem du stehst, ist heilig.« Und Josua tat es.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »der Befehlshaber des Heeres Jahwes« oder »der Befehlshaber von Jahwes Heerschar«.'
    reason: lexical_alternative
  - marker: b
    text: 'Im Hebräischen steht die Einzahl: »deine Sandale … dein Fuß«. Vergleiche die geläufigere Formulierung in der Mehrzahl in 2. Mose 3,5.'
    reason: cross_reference
lexical_decisions:
- source_word: שַׂר
  choice: Befehlshaber
  rationale: Im militärischen Zusammenhang mit צְבָא bezeichnet das Wort den Anführer beziehungsweise Oberbefehlshaber; »Befehlshaber« ist im modernen Deutsch klar und vermeidet die Mehrdeutigkeit von »Fürst«.
- source_word: צְבָא יְהוָה
  choice: Jahwes Heer
  rationale: צָבָא bezeichnet hier ein Heer oder eine Heerschar. »Heer« bewahrt den militärischen Sinn und verbindet sich im Deutschen natürlich mit dem Gottesnamen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel »der HERR« ersetzt.
- source_word: שַׁל
  choice: Zieh ... von ...
  rationale: Der Imperativ fordert dazu auf, die Fußbekleidung abzulegen; zusammen mit מֵעַל רַגְלְךָ ist diese Formulierung natürlich und nah am hebräischen Ausdruck.
- source_word: נַעַלְךָ
  choice: deine Sandale
  rationale: Der Singular des hebräischen Textes bleibt erhalten; »Sandale« entspricht der antiken Fußbekleidung besser als das allgemeinere »Schuh«.
- source_word: מֵעַל רַגְלְךָ
  choice: von deinem Fuß
  rationale: Auch רֶגֶל steht im Singular. Die ungewöhnliche Einzahl wird bewusst nicht an die bekanntere Mehrzahl aus 2. Mose 3,5 angeglichen.
- source_word: הַמָּקוֹם אֲשֶׁר אַתָּה עֹמֵד עָלָיו
  choice: der Ort, auf dem du stehst
  rationale: Die Wiedergabe nimmt das ausdrückliche עָלָיו auf und klingt zugleich idiomatisch deutsch.
- source_word: קֹדֶשׁ הוּא
  choice: ist heilig
  rationale: »Heilig« ist die sachlich und theologisch angemessene Standardwiedergabe von קֹדֶשׁ.
- source_word: וַיַּעַשׂ יְהוֹשֻׁעַ כֵּן
  choice: Und Josua tat es
  rationale: Die knappe Gehorsamsformel wird in natürlichem Deutsch wiedergegeben.
theological_decisions:
- issue: Identität und Stellung des שַׂר צְבָא יְהוָה
  choice: Die Gestalt wird beschreibend als »Befehlshaber von Jahwes Heer« bezeichnet.
  alternative: Deutung als Engel, Erscheinung Jahwes oder vorinkarnierte Erscheinung Christi.
  rationale: Der Vers nennt nur den Titel und legt die genaue Identität der Gestalt nicht ausdrücklich fest. Die Übersetzung bewahrt diese theologische Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der knappe Erzählstil und der Singular bei Sandale und Fuß bleiben erhalten; die Identität des Sprechers wird nicht über den Wortlaut hinaus bestimmt.
