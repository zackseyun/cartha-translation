  to: 'Er sagte: »Nein[a], vielmehr bin ich jetzt als der Befehlshaber des Heeres Jahwes gekommen.« Da fiel Josua mit dem Gesicht zur Erde nieder, verneigte sich[b] und sagte zu ihm: »Was sagt mein Herr seinem Diener?«'
