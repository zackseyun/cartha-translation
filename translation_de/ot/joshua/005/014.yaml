  terminology: »Befehlshaber des Heeres Jahwes«, »mein Herr« und »Diener« sind treffend. »Verneigte sich« wahrt die Ambiguität von שׁחה, ohne eine kultische Anbetung oder eine bestimmte Identität der Gestalt festzulegen.
