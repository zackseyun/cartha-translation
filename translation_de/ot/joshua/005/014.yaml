source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לֹ֗א כִּ֛י אֲנִ֥י שַׂר צְבָֽא יְהוָ֖ה עַתָּ֣ה בָ֑אתִי וַ/יִּפֹּל֩ יְהוֹשֻׁ֨עַ אֶל פָּנָ֥י/ו אַ֨רְצָ/ה֙ וַ/יִּשְׁתָּ֔חוּ וַ/יֹּ֣אמֶר ל֔/וֹ מָ֥ה אֲדֹנִ֖/י מְדַבֵּ֥ר אֶל עַבְדּֽ/וֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/014.yaml
  text: He said[a], “No; rather, I have now come as the commander of the army of Yahweh.” Then Joshua fell with his face to the ground and bowed down, and said to him[b], “What is my lord saying to his servant?”
translation:
  language: de
  text: 'Er sagte: »Nein[a], vielmehr bin ich jetzt als der Befehlshaber des Heeres Jahwes gekommen.« Da fiel Josua mit dem Gesicht zur Erde nieder, verneigte sich[b] und sagte zu ihm: »Was sagt mein Herr seinem Diener?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Keines von beidem; denn ich bin jetzt als der Befehlshaber des Heeres Jahwes gekommen.«'
    reason: Die knappe Antwort לֹא kann im Zusammenhang mit Josuas Entweder-oder-Frage als bloßes »Nein« oder sinngemäß als »Keines von beidem« verstanden werden; כִּי kann hier auch erklärend mit »denn« aufgefasst werden.
  - marker: b
    text: Das hebräische Verb kann auch mit »betete an« wiedergegeben werden. Hier steht »verneigte sich«, damit die Handlung ausgedrückt wird, ohne allein aufgrund dieses Verses die Identität der Gestalt festzulegen.
    reason: Das Verb שׁחה umfasst sowohl ehrerbietiges Niederbeugen als auch Anbetung.
lexical_decisions:
- source_word: לֹא
  choice: Nein
  rationale: Die direkte Verneinung antwortet auf Josuas vorausgehende Entweder-oder-Frage. Die mögliche Bedeutung »Keines von beidem« wird in einer Fußnote bewahrt.
- source_word: כִּי
  choice: sondern
  rationale: Nach der Verneinung leitet כִּי hier eine korrigierende Aussage ein; deutsches »sondern« gibt diesen Gegensatz natürlich wieder.
- source_word: שַׂר צְבָא יְהוָה
  choice: der Befehlshaber des Heeres Jahwes
  rationale: שַׂר bezeichnet im militärischen Zusammenhang einen Befehlshaber; צָבָא wird verständlich und sachgerecht mit »Heer« wiedergegeben, während der Gottesname als »Jahwe« erscheint.
- source_word: עַתָּה בָאתִי
  choice: ich bin jetzt … gekommen
  rationale: Das deutsche Perfekt bezeichnet die vollzogene Ankunft mit Gegenwartsbezug und bewahrt עַתָּה als »jetzt«.
- source_word: אֶל פָּנָיו אַרְצָה
  choice: mit dem Gesicht zur Erde nieder
  rationale: Die Formulierung bildet die körperliche Niederwerfung eng und zugleich idiomatisch ab.
- source_word: וַיִּשְׁתָּחוּ
  choice: verneigte sich
  rationale: Das Verb kann ehrerbietiges Niederbeugen oder Anbetung bezeichnen. »Verneigte sich« wahrt die sichtbare Handlung, ohne die Identität des Gegenübers vorwegzunehmen.
- source_word: אֲדֹנִי
  choice: mein Herr
  rationale: Die respektvolle Anrede mit Suffix wird direkt wiedergegeben; die Schreibung legt keine weitergehende Identifikation der Gestalt fest.
- source_word: מָה אֲדֹנִי מְדַבֵּר אֶל עַבְדּוֹ
  choice: Was sagt mein Herr seinem Diener?
  rationale: Die partizipiale Form wird im unmittelbaren Dialog idiomatisch mit dem deutschen Präsens wiedergegeben; »seinem Diener« bewahrt Josuas demütige Selbstbezeichnung.
theological_decisions:
- issue: Ob Josuas Handlung ausdrücklich als Anbetung zu übersetzen ist
  choice: Im Haupttext steht »verneigte sich«.
  alternative: »betete an« oder »warf sich nieder«
  rationale: שׁחה kann sowohl eine ehrerbietige Verneigung als auch kultische Anbetung bezeichnen. Der Vers allein legt die genaue theologische Qualität der Handlung nicht eindeutig fest.
- issue: Ob die Gestalt als Engel oder göttliche Erscheinung zu identifizieren ist
  choice: Die Gestalt wird nur mit ihrem hebräischen Titel als »Befehlshaber des Heeres Jahwes« bezeichnet.
  alternative: Eine Übersetzung, die ausdrücklich einen Engel, eine Theophanie oder eine Christophanie bezeichnet
  rationale: Der hebräische Text dieses Verses nennt einen Titel, entscheidet aber nicht ausdrücklich über die ontologische Identität der Gestalt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die militärische Bezeichnung bleibt klar und gegenwärtig; »Jahwe« bewahrt den Eigennamen. Satzbau und direkte Rede sind flüssig, ohne die knappe hebräische Erzählweise unnötig auszuschmücken.
