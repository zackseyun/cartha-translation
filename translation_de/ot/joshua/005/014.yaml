  source_fidelity: 'Die Übersetzung gibt die wesentlichen hebräischen Elemente zuverlässig wieder: die verneinende Antwort, die Selbstbezeichnung als Befehlshaber des Heeres Jahwes, Josuas Niederfallen, seine ehrerbietige Handlung und die demütige Anrede. »Er fragte ihn« engt וַיֹּאמֶר („und er sagte“) jedoch unnötig auf einen Redeakt ein; die direkte Frage selbst macht den Fragecharakter hinreichend deutlich. Die Markierung der Fußnote zur Bedeutung von וַיִּשְׁתַּחוּ sollte außerdem am betreffenden Verb stehen.'
