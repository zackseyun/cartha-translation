  text: בָּ/עֵ֣ת הַ/הִ֗יא אָמַ֤ר יְהוָה֙ אֶל יְהוֹשֻׁ֔עַ עֲשֵׂ֥ה לְ/ךָ֖ חַֽרְב֣וֹת צֻרִ֑ים וְ/שׁ֛וּב מֹ֥ל אֶת בְּנֵֽי יִשְׂרָאֵ֖ל שֵׁנִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/002.yaml
  text: At that time Yahweh said to Joshua[a], “Make for yourself flint knives, and circumcise the sons of Israel again[c][b], a second time.”
translation:
  language: de
  text: 'Zu jener Zeit sagte Jahwe zu Josua: „Fertige dir Messer aus Feuerstein[a] an und beschneide die Söhne Israels[b] zum zweiten Mal.[c]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Feuersteinmesser“. Gemeint sind aus Feuerstein gefertigte Schneidwerkzeuge, die hier zur Beschneidung dienen.'
    reason: lexical_alternative
  - marker: b
    text: Hebräisch „die Söhne Israels“; allgemeiner wird die Wendung häufig mit „die Israeliten“ wiedergegeben. Hier sind wegen der Beschneidung die männlichen Angehörigen gemeint.
    reason: lexical_alternative
  - marker: c
    text: „Zum zweiten Mal“ bedeutet, dass die Beschneidung an Israel als Volk erneut durchgeführt werden soll, nicht unbedingt, dass dieselben Personen zweimal beschnitten werden.
    reason: cultural_note
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: Zu jener Zeit
  rationale: Die geläufige Zeitangabe führt den Erzählabschnitt ein und klingt in modernem, würdigem Deutsch natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen gebräuchliche Wiedergabe des göttlichen Eigennamens bewahrt den Charakter des Tetragramms als Name statt es durch einen Titel zu ersetzen.
- source_word: עֲשֵׂה לְךָ
  choice: Fertige dir … an
  rationale: Die Formulierung gibt den Imperativ mit dem ethischen Dativ לְךָ idiomatisch und zugleich genau wieder.
- source_word: חַרְבוֹת צֻרִים
  choice: Messer aus Feuerstein
  rationale: חַרְבוֹת bezeichnet hier Schneidwerkzeuge, während צֻרִים ihr Material angibt; im Zusammenhang der Beschneidung ist „Messer“ klarer als „Schwerter“.
- source_word: וְשׁוּב
  choice: und … erneut
  rationale: שׁוּב wirkt zusammen mit dem folgenden Imperativ adverbial und bezeichnet die Wiederholung der Handlung.
- source_word: מֹל
  choice: beschneide
  rationale: Dies ist die direkte und übliche Wiedergabe des Verbs מול in diesem Bundeszusammenhang.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die wörtliche Wendung passt hier auch sachlich, da die Beschneidung an den männlichen Angehörigen Israels vorgenommen wird.
- source_word: שֵׁנִית
  choice: ein zweites Mal
  rationale: Die ausdrückliche Wiederholungsangabe bleibt neben „erneut“ erhalten, sodass beide hebräischen Signale der Wiederholung wiedergegeben werden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen; „Jahwe“ bewahrt ihn, statt ihn durch einen traditionellen Ersatztitel wiederzugeben.
- issue: Bezug von „erneut, ein zweites Mal“
  choice: Erneute Durchführung der Beschneidung an Israel als Volk
  alternative: Dieselben Personen werden ein zweites Mal beschnitten
  rationale: Der weitere Erzählzusammenhang erklärt, dass die während der Wüstenwanderung geborene Generation noch nicht beschnitten worden war. Die Formulierung bezeichnet daher die erneute Durchführung am Volk, ohne eine zweite Beschneidung derselben Männer zu behaupten.
- issue: Geschlechtsspezifische Wendung בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Israeliten
  rationale: Der grammatisch maskuline Ausdruck ist in diesem Kontext sachlich spezifisch, weil die Angesprochenen die männlichen Personen sind, an denen die Beschneidung vorgenommen werden soll.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die leichte Wiederholung in „erneut, ein zweites Mal“ ist bewusst beibehalten, weil auch der hebräische Text die Wiederholung doppelt ausdrückt.
