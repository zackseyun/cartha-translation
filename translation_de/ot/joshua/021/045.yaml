  text: לֹֽא נָפַ֣ל דָּבָ֔ר מִ/כֹּל֙ הַ/דָּבָ֣ר הַ/טּ֔וֹב אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה אֶל בֵּ֣ית יִשְׂרָאֵ֑ל הַ/כֹּ֖ל בָּֽא־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/045.yaml
  text: Not one word failed from all the good word that Yahweh had spoken to the house of Israel[a]; all of it came to pass.
translation:
  language: de
  text: Nicht ein einziges Wort von all den guten Worten, die Jahwe zum Haus Israel gesprochen hatte, blieb unerfüllt[a]; alles traf ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Keines von all den guten Versprechen, die Jahwe dem Haus Israel gegeben hatte, blieb unerfüllt.«'
    reason: 'Lexikalische Alternative: דָּבָר kann in diesem Zusammenhang sinngemäß als »Versprechen« verstanden werden.'
lexical_decisions:
- source_word: לֹא נָפַל דָּבָר
  choice: Kein einziges Wort ... blieb unerfüllt
  rationale: Die Wendung bedeutet wörtlich, dass kein Wort »fiel«, im Zusammenhang aber, dass nichts vom Gesagten ausblieb oder fehlschlug. »Blieb unerfüllt« gibt den Erfüllungssinn in natürlichem Deutsch wieder, ohne דָּבָר bereits als »Versprechen« festzulegen.
- source_word: מִכֹּל הַדָּבָר הַטּוֹב
  choice: von all dem Guten
  rationale: Der hebräische Singular bezeichnet kollektiv die Gesamtheit der guten Zusage. Die deutsche Formulierung vermeidet das schwerfällige »von dem ganzen guten Wort«, während »Wort« im Subjekt der Aussage erhalten bleibt.
- source_word: אֲשֶׁר דִּבֶּר
  choice: das ... geredet hatte
  rationale: Der Relativsatz blickt auf Jahwes vorausgehendes Reden zurück. Das Plusquamperfekt macht dieses zeitliche Verhältnis im Deutschen deutlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. »Jahwe« ist die im modernen Deutschen übliche Form.
- source_word: אֶל בֵּית יִשְׂרָאֵל
  choice: zum Haus Israel
  rationale: Die formelle korporative Bezeichnung des Hebräischen bleibt erhalten; »zum« ist im Deutschen bei »reden« natürlich.
- source_word: הַכֹּל בָּא
  choice: alles traf ein
  rationale: Das wörtliche »alles kam« bezeichnet hier das tatsächliche Eintreten des zuvor Gesagten. »Traf ein« ist prägnantes, heutiges Deutsch und bewahrt den idiomatischen Charakter.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. Die Transliteration bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: דָּבָר als »Wort« oder »Versprechen«
  choice: Wort
  alternative: Versprechen/Zusage
  rationale: »Wort« wahrt die Verbindung zum Verb »reden« und legt den Sprechakt nicht enger fest, als es der hebräische Ausdruck tut. Dass es sich sinngemäß um eine Zusage handelt, wird als legitime Alternative in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die formelle Wendung »Haus Israel« und der Gottesname »Jahwe« bewahren den Quelltextcharakter; »blieb unerfüllt« und »traf ein« geben die hebräischen Idiome verständlich wieder.
