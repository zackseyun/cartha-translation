  text: 'Anathoth with its pasturelands[a], and Almon with its pasturelands: four cities.'
translation:
  language: de
  text: Anatot mit seinem Weideland[a] und Almon mit seinem Weideland – vier Städte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gemeindeland“ bzw. „Umland“. Das hebräische Wort bezeichnet das offene Land, das zu einer Stadt gehörte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנָתוֹת
  choice: Anatot
  rationale: Der Ortsname wird nach gängiger deutscher Bibeltradition aus dem Hebräischen transliteriert.
- source_word: מִגְרָשֶׁהָ
  choice: mit seinem Weideland
  rationale: מִגְרָשׁ bezeichnet das zu einer Stadt gehörende offene Umland, das unter anderem als Weide diente. Der Singular „Weideland“ ist im Deutschen natürlich; das Suffix der 3. Person Singular feminin bezieht sich jeweils auf die Stadt und wird idiomatisch mit „seinem“ wiedergegeben.
- source_word: עַלְמוֹן
  choice: Almon
  rationale: Der Ortsname wird transliteriert.
- source_word: עָרִים אַרְבַּע
  choice: vier Städte
  rationale: Die Wendung fasst die in diesem Abschnitt aufgezählten Orte zusammen; „Städte“ entspricht dem üblichen Sinn von עָרִים in den Landzuteilungslisten.
- source_word: אֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: durch Aufzählung und „und“ wiedergegeben
  rationale: Der wiederholte direkte Objektmarker אֶת hat im Deutschen keine eigene Entsprechung; seine syntaktische Funktion wird durch die koordinierte Aufzählung ausgedrückt.
