source:
  edition: WLC
  text: וַ/יָּ֨נַח יְהוָ֤ה לָ/הֶם֙ מִ/סָּבִ֔יב כְּ/כֹ֥ל אֲשֶׁר נִשְׁבַּ֖ע לַ/אֲבוֹתָ֑/ם וְ/לֹא עָ֨מַד אִ֤ישׁ בִּ/פְנֵי/הֶם֙ מִ/כָּל אֹ֣יְבֵי/הֶ֔ם אֵ֚ת כָּל אֹ֣יְבֵי/הֶ֔ם נָתַ֥ן יְהוָ֖ה בְּ/יָדָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/044.yaml
  text: And Yahweh gave them rest on every side[a], according to all that he had sworn to their fathers. Not one man from all their enemies stood before them[b]; Yahweh gave all their enemies into their hand.
translation:
  language: de
  text: Und Jahwe verschaffte ihnen ringsum Ruhe, ganz so, wie er es ihren Vätern geschworen hatte. Keiner von all ihren Feinden konnte ihnen standhalten[a]; Jahwe gab alle ihre Feinde in ihre Hand[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „stand vor ihnen“. Die hebräische Wendung bedeutet hier, erfolgreich Widerstand zu leisten.'
    reason: lexical_alternative
  - marker: b
    text: „In ihre Hand geben“ ist eine hebräische Wendung für die Übergabe in ihre Gewalt.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנַח
  choice: verschaffte ihnen … Ruhe
  rationale: Der Hifil von נוח bezeichnet hier das Gewähren oder Herbeiführen von Ruhe. Die Formulierung bewahrt das Motiv der von Gott geschenkten Ruhe und klingt im heutigen Deutsch natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im Deutschen gebräuchliche Umschrift des Tetragramms.
- source_word: מִסָּבִיב
  choice: ringsum
  rationale: Das Adverb drückt umfassende Sicherheit gegenüber den Bedrohungen aus der Umgebung aus. „Ringsum“ bewahrt den räumlichen Gesamtsinn knapp und idiomatisch.
- source_word: כְּכֹל אֲשֶׁר נִשְׁבַּע
  choice: ganz so, wie er es … geschworen hatte
  rationale: Die Wendung betont die vollständige und genaue Erfüllung des zuvor geleisteten Schwurs.
- source_word: לַאֲבוֹתָם
  choice: ihren Vätern
  rationale: Das hebräische אָבוֹת bezeichnet hier die Väter beziehungsweise die vorausgehenden patriarchalen Generationen. „Vätern“ erhält die konkrete Ausdrucksweise des Ausgangstextes.
- source_word: וְלֹא עָמַד אִישׁ בִּפְנֵיהֶם מִכָּל אֹיְבֵיהֶם
  choice: Keiner von all ihren Feinden konnte ihnen standhalten
  rationale: 'Die wörtliche Vorstellung des Stehens vor jemandem ist hier idiomatisch: Kein einzelner Gegner vermochte erfolgreich Widerstand zu leisten. „Keiner“ gibt אִישׁ im negierten, distributiven Zusammenhang natürlich wieder.'
- source_word: נָתַן ... בְּיָדָם
  choice: gab … in ihre Hand
  rationale: Die hebräische Wendung bezeichnet die Übergabe in die Gewalt oder Verfügungsgewalt eines anderen. Die bildhafte Rede von der Hand bleibt erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht der Eigenname Gottes und nicht der Titel אֲדֹנָי. Die Umschrift bewahrt diese Unterscheidung.
- issue: Aussage über die Niederlage der Feinde
  choice: Keiner … konnte ihnen standhalten
  alternative: Keiner … stand vor ihnen
  rationale: 'Die Formulierung gibt die idiomatische Bedeutung wieder, ohne die Aussage zu verstärken oder abzuschwächen: Kein Feind konnte erfolgreich Widerstand leisten.'
- issue: „In ihre Hand geben“ als Aussage göttlichen Handelns
  choice: gab alle ihre Feinde in ihre Hand
  alternative: lieferte alle ihre Feinde ihrer Gewalt aus
  rationale: Die bildhafte Formulierung hält sich eng an den hebräischen Text und lässt dessen knappe Aussage über Jahwes Gewährung des Sieges bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Ringsum Ruhe“ bewahrt das Leitmotiv der Ruhe, „standhalten“ erschließt die hebräische Redewendung, und „in ihre Hand“ erhält bewusst das biblische Bild. Alle Fußnotenmarker stehen unmittelbar bei der jeweils erläuterten Wendung.
