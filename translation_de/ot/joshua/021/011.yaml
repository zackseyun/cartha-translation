  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּתְּנ֨וּ לָ/הֶ֜ם אֶת קִרְיַת֩ אַרְבַּ֨ע אֲבִ֧י הָֽ/עֲנ֛וֹק הִ֥יא חֶבְר֖וֹן בְּ/הַ֣ר יְהוּדָ֑ה וְ/אֶת מִגְרָשֶׁ֖/הָ סְבִיבֹתֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/011.yaml
  text: So they gave them Kiriath-arba (Arba was the father of Anak)[a], that is, Hebron, in the hill country of Judah, along with its pasturelands around it.
translation:
  language: de
  text: So gaben sie ihnen Kirjat-Arba – Arba war der Vater Anaks[a] –, das heißt Hebron, im Bergland von Juda, samt den Weideflächen rings um die Stadt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Arba war ein Vorfahr Anaks.“ Der hebräische Ausdruck kann den unmittelbaren Vater oder einen weiter zurückliegenden Vorfahren bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: So gaben sie
  rationale: Das Wayyiqtol von נתן führt die Erzählung folgerichtig weiter; „So gaben sie“ gibt diesen Zusammenhang in natürlichem Deutsch wieder.
- source_word: לָהֶם
  choice: ihnen
  rationale: Das Pronomen der 3. Person maskulin Plural bleibt entsprechend dem Hebräischen erhalten; die Empfänger werden nicht erklärend als Leviten ausgeschrieben.
- source_word: קִרְיַת אַרְבַּע
  choice: Kirjat-Arba
  rationale: Der etablierte Ortsname wird transliteriert; die wörtliche Bedeutung „Stadt Arbas“ wird nicht an die Stelle des Eigennamens gesetzt.
- source_word: אֲבִי הָעֲנֹוק
  choice: Arba war der Vater Anaks
  rationale: Die Apposition wird zu einem vollständigen deutschen Einschub entfaltet. „Vater“ wahrt die Grundbedeutung, während die mögliche Bedeutung „Vorfahr“ in der Fußnote genannt wird.
- source_word: הִיא חֶבְרוֹן
  choice: das heißt Hebron
  rationale: Die Wendung identifiziert Kirjat-Arba erläuternd mit Hebron; „das heißt“ ist im Deutschen klar und idiomatisch.
- source_word: בְּהַר יְהוּדָה
  choice: im Bergland von Juda
  rationale: הַר bezeichnet in dieser geografischen Verbindung die judäische Bergregion, nicht einen einzelnen Berg.
- source_word: מִגְרָשֶׁיהָ
  choice: die Weideflächen
  rationale: מִגְרָשׁ bezeichnet das offene Nutzland um eine Stadt, besonders für das Vieh; „Weideflächen“ ist verständlich und kontextgerecht.
- source_word: סְבִיבֹתֶיהָ
  choice: rings um die Stadt
  rationale: Die Form bezeichnet das umliegende Gebiet. Die ausdrückliche Wiederaufnahme als „Stadt“ vermeidet im Deutschen einen unklaren Pronomenbezug.
theological_decisions:
- issue: Verwandtschaftsbezeichnung אֲבִי
  choice: Vater
  alternative: Vorfahr
  rationale: Die Übersetzung behält die unmittelbare lexikalische Bedeutung bei, legt die Beziehung aber nicht ausschließlich auf direkte Vaterschaft fest; die weitere mögliche Bedeutung wird in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Ortsnamen folgen geläufiger deutscher Bibelschreibung. Der Gedankenstrich markiert die hebräische Apposition als erklärenden Einschub; „samt“ hält den Satz flüssig und knapp.
