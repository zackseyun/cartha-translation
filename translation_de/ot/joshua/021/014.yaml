  text: Jattir mit seinem Weideland[a] und Eschtemoa mit seinem Weideland.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gemeindeland“; gemeint ist das Land im Umfeld der jeweiligen Stadt.'
