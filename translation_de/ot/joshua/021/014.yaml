lexical_decisions:
- source_word: יַתִּר
  choice: Jattir
  rationale: Ortsname; die Form „Jattir“ entspricht der im Deutschen gebräuchlichen Wiedergabe des hebräischen Namens.
- source_word: מִגְרָשֶׁהָ
  choice: mit seinem Weideland
  rationale: מִגְרָשׁ bezeichnet das offene, gemeinschaftlich genutzte Land im Umfeld einer Stadt, besonders in den Listen der Levitenstädte. „Weideland“ ist im Deutschen klar und gibt die kollektive Bedeutung angemessen wieder; das Suffix bezieht sich jeweils auf die Stadt.
- source_word: אֶשְׁתְּמֹעַ
  choice: Eschtemoa
  rationale: Ortsname; „Eschtemoa“ gibt die hebräische Namensform in deutscher Schreibkonvention wieder.
- source_word: וְאֶת
  choice: und
  rationale: Der wiederholte Akkusativmarker אֶת wird im Deutschen nicht eigens wiedergegeben; die vorangestellte Konjunktion וְ verbindet die Einträge der Aufzählung.
