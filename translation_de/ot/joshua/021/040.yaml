source:
  edition: WLC
  text: כָּל הֶ֨/עָרִ֜ים לִ/בְנֵ֤י מְרָרִי֙ לְ/מִשְׁפְּחֹתָ֔/ם הַ/נּוֹתָרִ֖ים מִ/מִּשְׁפְּח֣וֹת הַ/לְוִיִּ֑ם וַ/יְהִי֙ גּוֹרָלָ֔/ם עָרִ֖ים שְׁתֵּ֥ים עֶשְׂרֵֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/040.yaml
  text: All the cities for the sons of Merari[b][a], by their families—the remaining ones from the families of the Levites—were twelve cities by lot.
translation:
  language: de
  text: 'Alle Städte für die Nachkommen Meraris[a], nach ihren Sippen – die Übrigen aus den Sippen der Leviten[b] –: Ihr Los umfasste zwölf Städte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „für die Söhne Meraris“; auch „für die Merariter“.
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „die übrigen levitischen Sippen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הֶעָרִים
  choice: Alle Städte
  rationale: עִיר kann Stadt oder Ortschaft bezeichnen; „Städte“ entspricht dem Sprachgebrauch der Zuteilungslisten und bezeichnet die namentlich aufgeführten Siedlungseinheiten.
- source_word: לִבְנֵי מְרָרִי
  choice: für die Nachkommen Meraris
  rationale: בְּנֵי bedeutet wörtlich „Söhne“, bezeichnet in diesem genealogischen Zusammenhang aber die Nachkommen beziehungsweise die meraritische Linie. „Nachkommen“ ist im modernen Deutschen klar und sachgerecht.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחָה bezeichnet hier die Untergliederung eines Stammesverbandes; „Sippen“ gibt diesen korporativen Sinn genauer wieder als das enger verstandene moderne „Familien“.
- source_word: הַנּוֹתָרִים מִמִּשְׁפְּחוֹת הַלְוִיִּם
  choice: die Übrigen aus den Sippen der Leviten
  rationale: Der substantivierte Partizipialausdruck bezeichnet die noch verbleibende Gruppe innerhalb der levitischen Sippen. „Die Übrigen“ vermeidet die mögliche Fehlvorstellung, es handle sich um Überlebende.
- source_word: וַיְהִי גּוֹרָלָם
  choice: Ihr Los umfasste
  rationale: Wörtlich lautet die Wendung „und ihr Los war“. „Ihr Los umfasste“ verbindet die Zuteilung durch das Los idiomatisch mit der folgenden Anzahl, ohne den Loscharakter abzuschwächen.
- source_word: עָרִים שְׁתֵּים עֶשְׂרֵה
  choice: zwölf Städte
  rationale: Die im Hebräischen nachgestellte Zahl wird entsprechend natürlichem deutschen Satzbau vor das Substantiv gesetzt.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Der Gedankenstrich erhält die hebräische Apposition, während der Doppelpunkt den vorangestellten Themenausdruck von der abschließenden Aussage über das Los abhebt.
