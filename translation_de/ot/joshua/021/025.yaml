base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/025.yaml
  text: 'And from the half-tribe of Manasseh: Taanach with its pasturelands[a], and Gath-rimmon with its pasturelands—two cities.'
translation:
  language: de
  text: 'Und von der Hälfte des Stammes Manasse: Taanach mit seinem Weideland[a] und Gat-Rimmon mit seinem Weideland – zwei Städte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige hebräische Handschriften und die Parallelstelle in 1. Chronik 6,55 nennen bei den aus Manasse zugeteilten Städten abweichende Namen.
    reason: textual_variant
lexical_decisions:
- source_word: וּמִמַּחֲצִית מַטֵּה מְנַשֶּׁה
  choice: Und vom halben Stamm Manasse
  rationale: Die Präposition מִן bezeichnet hier die Herkunft der Zuteilung. מַטֶּה meint im Zusammenhang der Landverteilung den Stamm; die knappe deutsche Formulierung gibt die hebräische Konstruktion natürlich wieder.
- source_word: תַּעְנַךְ
  choice: Taanach
  rationale: Der Ortsname wird in der im Deutschen gebräuchlichen biblischen Form wiedergegeben.
- source_word: מִגְרָשֶׁהָ
  choice: mit seinem Weideland
  rationale: מִגְרָשׁ bezeichnet das zu einer Stadt gehörende offene Umland, das unter anderem als Weideland diente. Der Singular wahrt die Form des hebräischen Textes; das Pronomen bezieht sich jeweils auf die Stadt.
- source_word: גַּת רִמּוֹן
  choice: Gat-Rimmon
  rationale: Der zusammengesetzte Ortsname wird nach gängiger deutscher Transliterationsweise mit Bindestrich geschrieben.
- source_word: עָרִים שְׁתָּיִם
  choice: zwei Städte
  rationale: Die abschließende Zählformel fasst die beiden genannten Ortschaften zusammen; „Städte“ entspricht dem üblichen Sinn von עָרִים in den Landzuteilungslisten.
