source:
  edition: WLC
  text: וְ/לִ/בְנֵ֣י גֵרְשׁ֗וֹן מִ/מִּשְׁפְּח֣וֹת מַטֵּֽה יִשָּׂשכָ֣ר וּ/מִ/מַּטֵּֽה אָ֠שֵׁר וּ/מִ/מַּטֵּ֨ה נַפְתָּלִ֜י וּ֠/מֵ/חֲצִי מַטֵּ֨ה מְנַשֶּׁ֤ה בַ/בָּשָׁן֙ בַּ/גּוֹרָ֔ל עָרִ֖ים שְׁלֹ֥שׁ עֶשְׂרֵֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/006.yaml
  text: And to the sons of Gershon[a], from the families of the tribe of Issachar, and from the tribe of Asher, and from the tribe of Naphtali, and from the half-tribe of Manasseh in Bashan, by lot, thirteen cities.
translation:
  language: de
  text: Und auf die Nachkommen Gerschons entfielen durch das Los dreizehn Städte aus den Sippen[a] des Stammes Issachar, aus dem Stamm Asser, aus dem Stamm Naftali und aus dem halben Stamm Manasse in Baschan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus den Familienverbänden des Stammes Issachar“. Das hebräische Wort kann größere Familiengruppen oder Sippen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנֵי גֵרְשׁוֹן
  choice: Und auf die Nachkommen Gerschons entfielen
  rationale: בְּנֵי bezeichnet hier die Nachkommen beziehungsweise die levitische Sippengruppe Gerschons. Das im Hebräischen aus dem vorherigen Zusammenhang ergänzte Zuteilungsverb wird im Deutschen mit „entfielen“ ausdrücklich gemacht.
- source_word: מִמִּשְׁפְּחוֹת
  choice: aus den Sippen
  rationale: מִשְׁפָּחוֹת bezeichnet größere verwandtschaftlich organisierte Gruppen. „Sippen“ ist im Stammeskontext präzise; die ebenfalls mögliche Wiedergabe „Familienverbände“ wird in der Fußnote genannt.
- source_word: מַטֵּה
  choice: Stamm
  rationale: מַטֶּה bezeichnet in diesem Landverteilungskontext einen israelitischen Stamm, nicht einen Stab.
- source_word: וּמֵחֲצִי מַטֵּה מְנַשֶּׁה
  choice: und aus dem halben Stamm Manasse
  rationale: Die Formulierung gibt die territoriale Teilung des Stammes Manasse knapp und sachlich wieder.
- source_word: בַבָּשָׁן
  choice: in Baschan
  rationale: Baschan ist der traditionelle und verständliche deutsche Name der Region; der hebräische Artikel wird bei einem Eigennamen im Deutschen nicht wiedergegeben.
- source_word: בַּגּוֹרָל
  choice: durch das Los
  rationale: Die Wendung bezeichnet das Losverfahren als Mittel der Zuteilung.
- source_word: עָרִים שְׁלֹשׁ עֶשְׂרֵה
  choice: dreizehn Städte
  rationale: עָרִים bezeichnet hier die in der Landverteilung genannten Städte beziehungsweise Ortschaften; „Städte“ entspricht dem Listencharakter des Abschnitts.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die elliptische Listenform des Hebräischen wird durch das aus dem Zusammenhang ergänzte Verb „entfielen“ zu einem natürlichen deutschen Satz, ohne die Zuteilungsstruktur zu verändern. Die wiederholte Stammesbezeichnung bleibt erhalten.
