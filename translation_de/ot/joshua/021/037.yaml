  yaml_path: translation/ot/joshua/021/037.yaml
  text: 'Kedemoth with its pasturelands[a], and Mephaath with its pasturelands: four cities.'
translation:
  language: de
  text: 'Kedemot mit ihrem Weideland[a] und Mefaat mit ihrem Weideland: vier Städte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gemeindeland“ beziehungsweise „das umliegende Weideland“; gemeint ist das jeder Stadt zugehörige Land (hebräisch מִגְרָשׁ).'
    reason: lexical_alternative
lexical_decisions:
- source_word: קְדֵמוֹת
  choice: Kedemot
  rationale: Der Ortsname wird nach einer im Deutschen gut lesbaren, hebräisch nahen Umschrift wiedergegeben und nicht übersetzt.
- source_word: מִגְרָשֶׁהָ
  choice: mit seinem Weideland
  rationale: מִגְרָשׁ bezeichnet das einer Stadt zugehörige offene Land, besonders als Weidefläche. Der Singular „Weideland“ ist im Deutschen natürlich; das Suffix bezieht sich jeweils auf die Stadt.
- source_word: מֵיפָעַת
  choice: Mefaat
  rationale: Der Ortsname wird in einer für das Deutsche natürlichen, quellenahen Umschrift wiedergegeben.
- source_word: עָרִים אַרְבַּע
  choice: vier Städte
  rationale: Wörtliche und im Zusammenhang der Levitenstädte passende Wiedergabe der abschließenden Summenangabe.
- source_word: אֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: Kedemot mit ... und Mefaat mit ...
  rationale: Die wiederholten Objektmarker strukturieren die Aufzählung. Im Deutschen bringt „mit“ die Zuordnung des Weidelands zur jeweiligen Stadt klar und natürlich zum Ausdruck.
theological_decisions: []
translation_notes:
  register: Moderne, sachliche und würdige Listensprache. Die Ortsnamen bleiben als Eigennamen erhalten; der Doppelpunkt leitet die abschließende Gesamtzahl ein.
