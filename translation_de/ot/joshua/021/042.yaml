base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/042.yaml
  text: Each of these cities had its surrounding pasturelands[a]; so it was for all these cities.
translation:
  language: de
  text: Jede dieser Städte hatte ihr Weideland rings um sie[a]; so war es bei allen diesen Städten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Stadt für Stadt und ihr Weideland rings um sie.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּהְיֶינָה
  choice: hatte
  rationale: Das Qal-Imperfekt in der rückblickenden Zusammenfassung beschreibt einen vergangenen Zustand. Zusammen mit dem Weideland wird dies im Deutschen natürlich durch „hatte“ ausgedrückt.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: diese Städte
  rationale: עִיר bezeichnet eine Stadt oder Ortschaft; „Städte“ entspricht dem formellen Kontext der Landzuteilung.
- source_word: עִיר עִיר
  choice: jede
  rationale: 'Die Wiederholung hat distributive Bedeutung: Gemeint ist jede einzelne Stadt.'
- source_word: וּמִגְרָשֶׁיהָ
  choice: ihr Weideland
  rationale: מִגְרָשׁ bezeichnet das offene, einer Stadt zugeordnete Land, besonders als Weidefläche. Der deutsche Kollektivsingular „Weideland“ ist hier klar und idiomatisch.
- source_word: סְבִיבֹתֶיהָ
  choice: rings um sich
  rationale: Die Form bezeichnet die Umgebung der jeweiligen Stadt und wird so räumlich und distributiv eindeutig wiedergegeben.
- source_word: כֵּן
  choice: so war es
  rationale: כֵּן fasst den beschriebenen Sachverhalt vergleichend und rückblickend zusammen.
- source_word: לְכָל הֶעָרִים הָאֵלֶּה
  choice: bei allen diesen Städten
  rationale: Die Wendung überträgt das beschriebene Muster auf die Gesamtheit der genannten Städte; „bei“ klingt im Deutschen natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die distributive hebräische Wiederholung wird im Haupttext idiomatisch mit „jede“ wiedergegeben und in der Fußnote formal sichtbar gemacht.
