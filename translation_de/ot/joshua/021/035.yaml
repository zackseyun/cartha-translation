  text: Dimnah with its pasturelands[b][a], and Nahalal with its pasturelands—four cities.
translation:
  language: de
  text: Dimna mit seinem Weideland[b][a] und Nahalal mit seinem Weideland – vier Städte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräische Handschriften und alte Übersetzungen unterscheiden sich in diesem Abschnitt darin, welche Städtenamen enthalten sind und wie sie angeordnet werden; vergleiche die parallele Liste in 1. Chronik 6,62.
    reason: textual_variant
  - marker: b
