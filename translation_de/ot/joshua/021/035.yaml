    reason: lexical_alternative
lexical_decisions:
- source_word: דִּמְנָה
  choice: Dimna
  rationale: Der Ortsname wird nach gängiger deutscher Bibeltradition transliteriert.
- source_word: מִגְרָשֶׁהָ
  choice: mit seinem Weideland
  rationale: מִגְרָשׁ bezeichnet das zu einer Stadt gehörende freie Umland, das unter anderem als Weideland diente. Der Singular entspricht dem Hebräischen und ist im Deutschen natürlich; das Possessivpronomen bezieht sich jeweils auf den Ortsnamen.
- source_word: נַהֲלָל
  choice: Nahalal
  rationale: Der Ortsname wird transliteriert; „Nahalal“ gibt die hebräische Form im Deutschen verständlich wieder.
- source_word: עָרִים אַרְבַּע
  choice: vier Städte
  rationale: Die abschließende Zählformel wird direkt wiedergegeben; „Städte“ entspricht dem Sprachgebrauch der Zuteilungslisten in Josua.
