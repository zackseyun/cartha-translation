  text: וַ/יִּתְּנ֨וּ לָ/הֶ֜ם אֶת עִ֨יר מִקְלַ֧ט הָ/רֹצֵ֛חַ אֶת שְׁכֶ֥ם וְ/אֶת מִגְרָשֶׁ֖/הָ בְּ/הַ֣ר אֶפְרָ֑יִם וְ/אֶת גֶּ֖זֶר וְ/אֶת מִגְרָשֶֽׁ/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/021.yaml
  text: They gave them Shechem with its pasturelands in the hill country of Ephraim[a], the city of refuge for the manslayer[b], and Gezer with its pasturelands.
translation:
  language: de
  text: Sie gaben ihnen Sichem mit seinem Weideland im Bergland Ephraims, die Zufluchtsstadt für den, der einen Menschen getötet hat[a], und Geser mit seinem Weideland.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „für den, der getötet hat“. Der hebräische Rechtsbegriff bezeichnet hier jemanden, der den Tod eines Menschen verursacht hat und bis zur gerichtlichen Klärung in eine Zufluchtsstadt fliehen konnte; er meint nicht zwingend einen verurteilten Mörder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ לָהֶם
  choice: Sie gaben ihnen
  rationale: Das Wayyiqtol von נתן wird als fortlaufende Erzählungsvergangenheit wiedergegeben; לָהֶם bezeichnet die Leviten im Kontext.
- source_word: עִיר מִקְלַט הָרֹצֵחַ
  choice: die Zufluchtsstadt für den Totschläger
  rationale: Die Wendung bezeichnet im israelitischen Asylrecht eine Stadt, in die jemand fliehen konnte, der einen Menschen getötet hatte. „Totschläger“ bewahrt den rechtlichen Bezug besser als „Mörder“, ohne vorsätzliches Morden vorauszusetzen.
- source_word: שְׁכֶם
  choice: Sichem
  rationale: Etablierte deutsche Namensform des Ortes.
- source_word: מִגְרָשֶׁיהָ
  choice: sein Weideland
  rationale: Bezeichnet das einer Stadt zugehörige offene Land, insbesondere für Viehhaltung; der deutsche Singular ist in diesem Zusammenhang natürlich.
- source_word: בְּהַר אֶפְרָיִם
  choice: im Bergland Ephraims
  rationale: הַר bezeichnet hier die gebirgige Region des Stammesgebiets und nicht einen einzelnen Berg.
- source_word: גֶּזֶר
  choice: Geser
  rationale: Etablierte deutsche Namensform des Ortes.
theological_decisions:
- issue: Rechtlicher Status von הָרֹצֵחַ
  choice: Totschläger
  alternative: Mörder; derjenige, der getötet hat
  rationale: Der Kontext der Zufluchtsstädte unterscheidet zwischen unbeabsichtigter Tötung und Mord. Die Übersetzung darf daher keine bereits festgestellte Mordschuld unterstellen, muss aber den Täterbezug des hebräischen Ausdrucks erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die appositionelle Stellung der Zufluchtsstadt bleibt wie im Hebräischen erhalten. „Bergland Ephraims“ gibt die geografische Bedeutung idiomatisch wieder.
