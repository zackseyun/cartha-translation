  text: But the fields of the city and its villages they gave to Caleb son of Jephunneh as his possession[a].
translation:
  language: de
  text: Aber das Ackerland der Stadt und ihre Dörfer gaben sie Kaleb, dem Sohn Jefunnes, als seinen Besitz.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Siedlungen“. Das hebräische Wort kann von einer Stadt abhängige kleinere Siedlungen oder zu ihr gehörende Außenbereiche bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂדֵה הָעִיר
  choice: das Ackerland der Stadt
  rationale: שְׂדֵה ist formal ein singularischer Status constructus, bezeichnet hier jedoch kollektiv die landwirtschaftlich genutzte Fläche der Stadt. „Ackerland“ gibt diesen Sinn im Deutschen natürlich wieder.
- source_word: חֲצֵרֶיהָ
  choice: ihre Dörfer
  rationale: חֲצֵרֶיהָ bezeichnet in Orts- und Landzuteilungslisten häufig abhängige kleinere Siedlungen einer Stadt. „Dörfer“ ist hier gegenüber „Weideland“ lexikalisch näherliegend; die verbleibende Bedeutungsbreite wird in der Fußnote angegeben.
- source_word: נָתְנוּ
  choice: gaben sie
  rationale: Die Grundbedeutung von נתן ist „geben“. Die Verbendstellung nach den vorangestellten Objekten bewahrt die hebräische Hervorhebung in noch natürlichem Deutsch.
- source_word: לְכָלֵב בֶּן יְפֻנֶּה
  choice: Kaleb, dem Sohn Jefunnes
  rationale: Der Dativ gibt das indirekte Objekt wieder; die Apposition wird nach üblichem deutschen Bibelstil mit bestimmtem Artikel formuliert.
- source_word: בַּאֲחֻזָּתוֹ
  choice: als seinen Besitz
  rationale: אֲחֻזָּה bezeichnet einen rechtlich zugewiesenen Landbesitz. „Besitz“ wahrt diesen Sinn, ohne ihn vorschnell als „Erbteil“ zu deuten.
- source_word: וְאֶת
  choice: Aber
  rationale: 'Das anknüpfende וְ steht im inhaltlichen Gegensatz zum vorherigen Vers: Die Stadt wurde den Leviten gegeben, das zugehörige Land und die Dörfer dagegen Kaleb. „Aber“ macht diesen Diskursbezug im Deutschen deutlich.'
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche, aber verständliche Objektvoranstellung („das Ackerland … und ihre Dörfer gaben sie“) erhält die Hervorhebung des hebräischen Satzes. Der Name יְפֻנֶּה wird in der im Deutschen etablierten Form „Jefunne“ wiedergegeben.
