  text: Helkat mit ihrem Weideland und Rehob mit ihrem Weideland – vier Städte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶלְקָת
  choice: Helkat
  rationale: Der Ortsname wird nach einer im Deutschen gut lesbaren, quellenahen Umschrift wiedergegeben und nicht übersetzt.
- source_word: מִגְרָשֶׁהָ
  choice: mit seinem Weideland
  rationale: מִגְרָשׁ bezeichnet das einer Stadt zugeordnete offene Nutz- und Weideland. Der deutsche Singular „Weideland“ gibt den kollektiven Sinn natürlich wieder; das Suffix bezieht sich jeweils auf die grammatisch feminine Stadt.
- source_word: רְחֹב
  choice: Rehob
  rationale: Der Ortsname wird in der im Deutschen geläufigen biblischen Form wiedergegeben.
- source_word: עָרִים אַרְבַּע
  choice: vier Städte
  rationale: Die Wendung fasst die in diesem und im vorangehenden Vers genannten Orte zusammen; „Städte“ entspricht dem üblichen Sinn von עִיר in den Landzuteilungslisten.
- source_word: אֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: mit ... und ... mit ...
  rationale: Die wiederholten Objektmarker werden im Deutschen nicht eigens wiedergegeben. „mit“ drückt die Zuordnung des Weidelands zur jeweiligen Stadt klar aus.
