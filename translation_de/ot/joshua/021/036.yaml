  text: וּ/מִ/מַּטֵּ֣ה רְאוּבֵ֔ן אֶת בֶּ֖צֶר וְ/אֶת מִגְרָשֶׁ֑/הָ וְ/אֶת יַ֖הְצָ/ה וְ/אֶת מִגְרָשֶֽׁ/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/036.yaml
  text: 'And from the tribe of Reuben: Bezer with its pasturelands[b][a], and Jahaz with its pasturelands.'
translation:
  language: de
  text: 'Und vom Stamm Ruben: Bezer mit seinen Weideflächen[b] und Jahaz[a] mit seinen Weideflächen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jahaz wird in Übersetzungen auch Jahza oder Jahazah genannt.
    reason: lexical_alternative
  - marker: b
    text: Einige hebräische Handschriften und alte Textzeugen lassen Josua 21,36–37 aus; die hier genannten Städte entsprechen der Liste in 1. Chronik 6,63–64.
    reason: textual_variant
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה
  choice: Und vom Stamm
  rationale: מִן + מַטֶּה bezeichnet in diesem Zuteilungsverzeichnis die Herkunft aus einem Stamm; „vom Stamm“ ist im Deutschen natürlich und sachlich genau.
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Die in deutschen Bibeln und im modernen Standarddeutsch übliche Form des Stammesnamens.
- source_word: אֶת בֶּצֶר
  choice: Bezer
  rationale: אֶת ist der nicht eigens wiederzugebende Akkusativmarker; der Ortsname wird in seiner gebräuchlichen deutschen Form wiedergegeben.
- source_word: מִגְרָשֶׁהָ
  choice: mit seinen Weideflächen
  rationale: מִגְרָשׁ bezeichnet bei den Levitenstädten das offene, gemeinschaftlich nutzbare Land um die Stadt. Das maskuline Pronomen „seinen“ bezieht sich im Deutschen idiomatisch auf den jeweiligen Ort.
- source_word: יַהְצָה
  choice: Jahaz
  rationale: Gebräuchliche deutsche Wiedergabe des Ortsnamens; abweichende traditionelle Namensformen werden in einer Fußnote genannt.
theological_decisions: []
translation_notes:
  register: Knapper, würdevoller Listenstil in modernem Standarddeutsch. „Weideflächen“ macht die Funktion des offenen Umlands verständlich, ohne den Begriff auf ausschließlich private Weiden zu verengen. Die Fußnotenmarker stehen unmittelbar bei den jeweils betroffenen Angaben.
