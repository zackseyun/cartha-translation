  text: 'Aijalon with its pasturelands[a], and Gath-rimmon with its pasturelands: four cities.'
translation:
  language: de
  text: 'Ajalon mit seinem Weideland[a] und Gat-Rimmon mit seinem Weideland: vier Städte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seinem Gemeindeland“ oder „seinem umliegenden Land“; das hebräische Wort bezeichnet das zu einer Stadt gehörende Land, das häufig als Weidefläche genutzt wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיָּלוֹן
  choice: Ajalon
  rationale: Der Ortsname wird nach der im Deutschen gebräuchlichen biblischen Form wiedergegeben, nicht übersetzt.
- source_word: מִגְרָשֶׁהָ
  choice: seinem Weideland
  rationale: מִגְרָשׁ bezeichnet das einer Stadt zugehörige Land außerhalb bzw. rings um sie, das besonders als Weidefläche diente. Der Singular entspricht dem Hebräischen und klingt im Deutschen natürlich.
- source_word: גַּת רִמּוֹן
  choice: Gat-Rimmon
  rationale: Der zusammengesetzte Ortsname wird transliteriert; der Bindestrich macht kenntlich, dass es sich um einen einzigen Ortsnamen handelt.
- source_word: עָרִים אַרְבַּע
  choice: vier Städte
  rationale: Dies gibt die abschließende hebräische Summenformel direkt und idiomatisch wieder.
- source_word: אֶת ... וְאֶת ... אֶת ... וְאֶת
  choice: durch Aufzählung und „mit“ wiedergegeben
  rationale: Der wiederholte hebräische Akkusativmarker hat keine direkte deutsche Entsprechung; die syntaktische Gliederung wird in einer natürlichen Aufzählung bewahrt.
