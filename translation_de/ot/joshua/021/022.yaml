  yaml_path: translation/ot/joshua/021/022.yaml
  text: and Kibzaim with its pasturelands[a], and Beth-horon with its pasturelands—four cities.
translation:
  language: de
  text: und Kibzajim mit seinem Weideland[a] und Bet-Horon mit seinem Weideland – vier Städte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit seinem Gemeindeland« beziehungsweise »mit seinen Weideflächen«. Das hebräische Wort bezeichnet das offene Land, das zu einer Stadt gehörte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קִבְצַיִם
  choice: Kibzajim
  rationale: Der Ortsname wird in einer dem Hebräischen entsprechenden, im Deutschen gut lesbaren Form transkribiert.
- source_word: מִגְרָשֶׁהָ
  choice: mit seinem Weideland
  rationale: מִגְרָשׁ bezeichnet das offene, zur Stadt gehörende Land, das insbesondere als Weidefläche diente. Der Singular »Weideland« ist im Deutschen natürlich; das Suffix wird passend zum grammatisch sächlichen »Kibzajim/Bet-Horon« mit »seinem« wiedergegeben.
- source_word: בֵּית חוֹרֹן
  choice: Bet-Horon
  rationale: Der etablierte Ortsname wird transkribiert und nicht wörtlich als »Haus Horons« übersetzt.
- source_word: עָרִים אַרְבַּע
  choice: vier Städte
  rationale: Die abschließende Summenformel wird unmittelbar und idiomatisch wiedergegeben.
- source_word: וְאֶת ... וְאֶת
  choice: und ... und
  rationale: Die wiederholte Verknüpfung der Listenelemente wird bewahrt; die Akkusativpartikel אֶת bleibt entsprechend ihrer grammatischen Funktion unübersetzt.
