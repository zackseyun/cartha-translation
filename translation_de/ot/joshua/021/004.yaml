source:
  edition: WLC
  text: וַ/יֵּצֵ֥א הַ/גּוֹרָ֖ל לְ/מִשְׁפְּחֹ֣ת הַ/קְּהָתִ֑י וַ/יְהִ֡י לִ/בְנֵי֩ אַהֲרֹ֨ן הַ/כֹּהֵ֜ן מִן הַ/לְוִיִּ֗ם מִ/מַּטֵּ֣ה יְ֠הוּדָה וּ/מִ/מַּטֵּ֨ה הַ/שִּׁמְעֹנִ֜י וּ/מִ/מַּטֵּ֤ה בִנְיָמִן֙ בַּ/גּוֹרָ֔ל עָרִ֖ים שְׁלֹ֥שׁ עֶשְׂרֵֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/004.yaml
  text: Then the lot came out for the families of the Kohathites[a], and for the sons of Aaron the priest, from among the Levites, there fell by lot thirteen cities from the tribe of Judah, from the tribe of Simeon, and from the tribe of Benjamin.
translation:
  language: de
  text: Dann fiel das Los auf die Sippen der Kehatiter[a]. Den Söhnen des Priesters Aaron, die zu den Leviten gehörten, wurden durch das Los dreizehn Städte aus dem Stamm Juda, dem Stamm Simeon und dem Stamm Benjamin zugeteilt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Dann kam das Los für die Sippen der Kehatiter heraus.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא הַגּוֹרָל
  choice: Dann fiel das Los
  rationale: Die hebräische Wendung lautet wörtlich, dass das Los »herauskam«. Im Deutschen ist »das Los fiel auf« die natürliche Entsprechung und bewahrt das Bild eines Losentscheids.
- source_word: לְמִשְׁפְּחֹת הַקְּהָתִי
  choice: auf die Sippen der Kehatiter
  rationale: מִשְׁפָּחָה bezeichnet hier größere Familienverbände beziehungsweise Sippen. »Kehatiter« gibt die kollektive Nachkommenschaft Kehats wieder.
- source_word: וַיְהִי לִבְנֵי אַהֲרֹן הַכֹּהֵן
  choice: Den Söhnen des Priesters Aaron ... wurden ... zugeteilt
  rationale: Die hebräische Konstruktion ist knapp und wird im Deutschen durch das Verb »zuteilen« idiomatisch ergänzt; »Söhne« bewahrt den Verwandtschaftsausdruck des Ausgangstextes.
- source_word: מִן הַלְוִיִּם
  choice: die zu den Leviten gehörten
  rationale: Die Formulierung macht verständlich, dass Aarons Söhne eine Gruppe innerhalb der Leviten bilden.
- source_word: מִמַּטֵּה יְהוּדָה וּמִמַּטֵּה הַשִּׁמְעֹנִי וּמִמַּטֵּה בִנְיָמִן
  choice: aus dem Stamm Juda, dem Stamm Simeon und dem Stamm Benjamin
  rationale: מַטֶּה bezeichnet in diesem Zusammenhang einen israelitischen Stamm. Die Wiederholung von »Stamm« folgt der hebräischen Struktur, ohne die deutschen Präpositionen unnötig zu häufen.
- source_word: בַּגּוֹרָל
  choice: durch das Los
  rationale: Die Präposition bezeichnet hier das Mittel der Zuteilung. »Durch das Los« ist in diesem Satz natürlich und verdeutlicht das Verfahren.
- source_word: עָרִים שְׁלֹשׁ עֶשְׂרֵה
  choice: dreizehn Städte
  rationale: עָרִים bezeichnet Städte beziehungsweise Ortschaften; »Städte« entspricht dem üblichen Sprachgebrauch in den Landzuteilungen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zwei hebräischen Teilsätze werden klar gegliedert; die Zugehörigkeit der Aaroniden zu den Leviten bleibt ausdrücklich erhalten.
