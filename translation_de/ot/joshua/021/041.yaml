base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/041.yaml
  text: All the cities of the Levites within the possession of the sons of Israel were forty-eight cities[b][a], with their pasturelands.
translation:
  language: de
  text: Alle Städte der Leviten innerhalb des Landbesitzes der Israeliten[a] waren insgesamt achtundvierzig Städte samt ihren Weideflächen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlich: „der Söhne Israels“; gemeint sind die Israeliten.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet das zu einer Stadt gehörende offene Umland, auch Gemeinschafts- oder Weideland.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: Alle
  rationale: Bezeichnet zusammenfassend die Gesamtheit der den Leviten zugewiesenen Städte.
- source_word: עָרֵי הַלְוִיִּם
  choice: Städte der Leviten
  rationale: Gibt die hebräische Genitivverbindung direkt und in natürlichem Deutsch wieder.
- source_word: בְּתוֹךְ אֲחֻזַּת
  choice: im Landbesitz
  rationale: בְּתוֹךְ bezeichnet die Lage innerhalb eines größeren Bereichs; אֲחֻזָּה meint hier den dauerhaft zugewiesenen territorialen Besitz. „Im Landbesitz“ bündelt beides knapp und verständlich.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: der Söhne Israels
  rationale: Bewahrt die formale Gestalt der hebräischen Volksbezeichnung und bleibt im Deutschen verständlich.
- source_word: עָרִים אַרְבָּעִים וּשְׁמֹנֶה
  choice: waren achtundvierzig Städte
  rationale: Das Hebräische nennt die Zahl in einer zusammenfassenden Apposition; das ergänzte Verb ergibt einen vollständigen deutschen Satz.
- source_word: וּמִגְרְשֵׁיהֶן
  choice: samt ihren Weideflächen
  rationale: מִגְרָשׁ bezeichnet das offene, zu den Städten gehörende Umland, das insbesondere als Weideland diente; „Weideflächen“ ist im Kontext klar und „samt“ gibt die angefügte Mitnennung knapp wieder.
theological_decisions:
- issue: Geschlechtlich markierte Bundes- und Volksbezeichnung בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  alternative: Israeliten / Kinder Israels
  rationale: Die grammatisch maskuline hebräische Wendung wird formal bewahrt, ohne ihre kollektive Bezugnahme auf das ganze Volk einzuschränken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am hebräischen Summarsatz; „Landbesitz“ vermeidet eine unnötige Festlegung auf „Erbteil“, und „Weideflächen“ macht die Funktion des städtischen Umlands verständlich.
