  text: כָּל עָרֵ֥י בְנֵֽי אַהֲרֹ֖ן הַ/כֹּֽהֲנִ֑ים שְׁלֹשׁ עֶשְׂרֵ֥ה עָרִ֖ים וּ/מִגְרְשֵׁי/הֶֽן־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/019.yaml
  text: All the cities of the sons of Aaron[a], the priests, were thirteen cities with their pasturelands.
translation:
  language: de
  text: Alle Städte der Söhne Aarons, der Priester, waren insgesamt dreizehn Städte samt ihren Weideflächen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „und ihre Weideflächen“. Das Hebräische verbindet die Wendung lediglich mit „und“; die Zusammenfassung kann daher auch lauten: „dreizehn Städte und ihre Weideflächen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל עָרֵי
  choice: Alle Städte
  rationale: Gibt die Gesamtheit der in der Liste genannten Städte knapp und quellennah wieder.
- source_word: בְנֵי אַהֲרֹן
  choice: der Söhne Aarons
  rationale: Bewahrt die formale hebräische Verwandtschaftsbezeichnung und den Bezug auf die priesterliche Linie; „Nachkommen Aarons“ wäre deutender.
- source_word: הַכֹּהֲנִים
  choice: der Priester
  rationale: Gibt die appositionelle Bestimmung der Söhne Aarons natürlich und präzise wieder.
- source_word: שְׁלֹשׁ עֶשְׂרֵה עָרִים
  choice: dreizehn Städte
  rationale: Entspricht der Zahl und dem wiederholten Substantiv des hebräischen Textes.
- source_word: וּמִגְרְשֵׁיהֶן
  choice: samt ihren Weideflächen
  rationale: מִגְרָשׁ bezeichnet im Zusammenhang der Levitenstädte die zugehörigen offenen Flächen, besonders Weideland. „Samt“ fügt die Flächen im Deutschen natürlich in die zusammenfassende Zählung ein, während eine Fußnote die einfache hebräische Verbindung mit ו bewahrt.
theological_decisions: []
