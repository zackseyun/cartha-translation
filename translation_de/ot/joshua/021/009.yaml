source:
  edition: WLC
  text: וַֽ/יִּתְּנ֗וּ מִ/מַּטֵּה֙ בְּנֵ֣י יְהוּדָ֔ה וּ/מִ/מַּטֵּ֖ה בְּנֵ֣י שִׁמְע֑וֹן אֵ֚ת הֶֽ/עָרִ֣ים הָ/אֵ֔לֶּה אֲשֶׁר יִקְרָ֥א אֶתְ/הֶ֖ן בְּ/שֵֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/009.yaml
  text: 'From the tribe of the sons of Judah and from the tribe of the sons of Simeon they gave these cities[a], which are called by name:'
translation:
  language: de
  text: 'Vom Stamm der Söhne Judas und vom Stamm der Söhne Simeons gaben sie folgende Städte[a], die namentlich genannt werden:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „diese Städte, die mit Namen bezeichnet werden“ oder „diese Städte, deren Namen angegeben werden“. Der hebräische Ausdruck weist darauf hin, dass die einzelnen Städte in der folgenden Liste namentlich aufgeführt sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: gaben sie
  rationale: Gibt נתן direkt wieder; im Zusammenhang bezeichnet das Verb die Zuweisung beziehungsweise Überlassung der Levitenstädte.
- source_word: מִמַּטֵּה
  choice: vom Stamm
  rationale: מַטֶּה bedeutet hier im Kontext der Land- und Städteverteilung idiomatisch „Stamm“, nicht wörtlich „Stab“.
- source_word: בְּנֵי יְהוּדָה
  choice: der Söhne Judas
  rationale: Bewahrt die hebräische Verwandtschaftsbezeichnung und ist zugleich als traditionelle Stammesbezeichnung verständlich.
- source_word: וּמִמַּטֵּה בְּנֵי שִׁמְעוֹן
  choice: und vom Stamm der Söhne Simeons
  rationale: Erhält die Parallelität zum vorangehenden Ausdruck und gibt beide Stammesbezeichnungen gleichartig wieder.
- source_word: אֵת הֶעָרִים הָאֵלֶּה
  choice: folgende Städte
  rationale: Im Deutschen verweist „folgende“ natürlich auf die unmittelbar anschließende Liste; sachlich entspricht dies „diese Städte“.
- source_word: אֲשֶׁר יִקְרָא אֶתְהֶן בְּשֵׁם
  choice: die namentlich genannt werden
  rationale: Gibt die idiomatische Wendung verständlich wieder, ohne festzulegen, ob der Schwerpunkt auf Benennung, Bezeichnung oder Auflistung liegt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung wahrt den erzählenden Anschluss des hebräischen וַיִּתְּנוּ; „folgende Städte“ macht den Listencharakter im Deutschen klar. Die traditionellen Formulierungen „Söhne Judas“ und „Söhne Simeons“ erhalten die familiäre Stammesbezeichnung des Ausgangstextes.
