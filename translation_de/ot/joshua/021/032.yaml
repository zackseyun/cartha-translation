base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/032.yaml
  text: 'And from the tribe of Naphtali: Kedesh in Galilee[a], the city of refuge for the manslayer, with its pasturelands; Hammoth-dor with its pasturelands[b]; and Kartan with its pasturelands—three cities.'
translation:
  language: de
  text: 'Und vom Stamm Naftali: Kedesch in Galiläa, die Zufluchtsstadt für den, der einen Menschen getötet hat[a], mit zugehörigem Weideland; Hammot-Dor mit zugehörigem Weideland[b] und Kartan mit zugehörigem Weideland – drei Städte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für den, der getötet hat“. Das hebräische Wort bezeichnet jemanden, der getötet hat, besonders im Rechtszusammenhang der Zufluchtsstädte, und meint nicht notwendig einen vorsätzlichen Mörder.'
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen steht Hammot-Dor; manche Überlieferungen bringen den Ort mit Hammat in Verbindung.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִמַּטֵּה נַפְתָּלִי
  choice: Und vom Stamm Naftali
  rationale: מַטֶּה bezeichnet im Zusammenhang der Landzuteilung einen Stamm; Konjunktion und Präposition werden zusammen natürlich mit „Und vom“ wiedergegeben.
- source_word: עִיר מִקְלַט הָרֹצֵחַ
  choice: die Zufluchtsstadt für den Totschläger
  rationale: עִיר מִקְלָט ist der feststehende Rechtsbegriff für eine Zufluchtsstadt. הָרֹצֵחַ bezeichnet hier denjenigen, der einen Menschen getötet hat, ohne für sich allein Vorsatz oder Mord festzulegen; „Totschläger“ bewahrt diese rechtliche Offenheit besser als „Mörder“.
- source_word: קֶדֶשׁ בַּגָּלִיל
  choice: Kedesch in Galiläa
  rationale: Der Ortsname wird gemäß gebräuchlicher deutscher Bibeltransliteration wiedergegeben; בַּגָּלִיל nennt die Region.
- source_word: מִגְרָשֶׁיהָ
  choice: mit ihrem/seinem Weideland
  rationale: מִגְרָשׁ bezeichnet das einer Stadt zugehörige offene Umland, besonders als Weidefläche. Der deutsche Singular „Weideland“ entspricht dem hebräischen Kollektiv und lässt sich in der Listenform flüssig wiederholen.
- source_word: חַמֹּת דֹּאר
  choice: Hammot-Dor
  rationale: Der masoretische Text bietet einen zusammengesetzten Ortsnamen; die Bindestrichschreibung bildet diese Form lesbar ab.
- source_word: קַרְתָּן
  choice: Kartan
  rationale: Der Ortsname wird unmittelbar aus der hebräischen Form transliteriert.
- source_word: עָרִים שָׁלֹשׁ
  choice: drei Städte
  rationale: Die abschließende hebräische Zusammenfassung wird in natürlicher deutscher Wortstellung wiedergegeben.
theological_decisions:
- issue: Rechtliche Einordnung von הָרֹצֵחַ
  choice: Totschläger
  alternative: Mörder; derjenige, der getötet hat
  rationale: Im Zusammenhang der Zufluchtsstädte darf der Ausdruck nicht vorschnell als vorsätzlicher Mord gedeutet werden. Die Übersetzung erhält die rechtliche Spannung; die Fußnote erläutert den weiteren Bedeutungsumfang.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper Listenstruktur. Die traditionellen deutschen Namensformen „Naftali“, „Kedesch“ und „Galiläa“ werden verwendet; seltene Ortsnamen bleiben eng an der masoretischen Form. Der juristisch geprägte Ausdruck „Totschläger“ wird durch eine Fußnote gegen ein zu enges modernes Verständnis abgesichert.
