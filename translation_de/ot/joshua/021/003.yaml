base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/003.yaml
  text: So the sons of Israel gave to the Levites[a], from their inheritance, at the command of Yahweh[c][b], these cities and their pasturelands.
translation:
  language: de
  text: Da gaben die Söhne Israels[a] den Leviten aus ihrem Erbbesitz nach dem Befehl Jahwes[b] diese Städte samt ihren Weideflächen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Israeliten“. Hebräisch: „die Söhne Israels“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „nach dem Mund Jahwes“; gemeint ist: nach seinem Befehl oder auf sein Geheiß.'
    reason: lexical_alternative
  - marker: c
    text: 'Das heißt: die offenen Land- und Weideflächen, die zu den Städten gehörten.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: Da gaben
  rationale: נתן bedeutet hier im erzählenden Zusammenhang schlicht „geben“. „Da“ gibt die fortführende Funktion des Waw-Konsekutivs natürlich wieder.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die wörtliche familiäre Bezeichnung bleibt erhalten; „die Israeliten“ ist als natürliche kollektive Alternative in der Fußnote genannt.
- source_word: לַלְוִיִּם
  choice: den Leviten
  rationale: Der Dativ bezeichnet eindeutig die Empfänger der Städte.
- source_word: מִנַּחֲלָתָם
  choice: aus ihrem Erbbesitz
  rationale: נַחֲלָה bezeichnet hier den den Stämmen als Erbe zugeteilten Landbesitz. „Erbbesitz“ vermittelt diesen konkreten Sinn im Deutschen knapp und natürlich.
- source_word: אֶל־פִּי יְהוָה
  choice: nach dem Befehl Jahwes
  rationale: Die Wendung bedeutet idiomatisch „nach dem Befehl“ beziehungsweise „auf Geheiß“. Die Fußnote bewahrt das wörtliche Bild „nach dem Mund“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen stehende Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im Deutschen übliche Form.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: diese Städte
  rationale: Direkte und natürliche Wiedergabe der Nominalgruppe mit Demonstrativpronomen.
- source_word: מִגְרְשֵׁיהֶן
  choice: ihre Weideflächen
  rationale: מִגְרָשׁ bezeichnet die offenen, zu den Städten gehörenden Flächen, die besonders als Weideland dienten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich den Gottesnamen. Die Umschrift bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von בְנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Israeliten
  rationale: Die Hauptübersetzung bewahrt die konkrete familiäre Ausdrucksweise des Hebräischen, während die Fußnote die idiomatische kollektive Bedeutung nennt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt dem hebräischen Ablauf, bleibt aber idiomatisch. „Erbbesitz“ verdeutlicht den Landzuteilungskontext; „Weideflächen“ ist für heutige Leser verständlicher als ein technischer Ausdruck wie „Freiflächen“.
