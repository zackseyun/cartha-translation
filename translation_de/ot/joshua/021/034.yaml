base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/034.yaml
  text: 'And to the families of the sons of Merari[a], the remaining Levites, from the tribe of Zebulun: Jokneam with its pasturelands, and Kartah with its pasturelands.'
translation:
  language: de
  text: Und den Sippen der Söhne Meraris, den übrigen Leviten, wurden vom Stamm Sebulon Jokneam mit seinem Weideland und Karta[a] mit seinem Weideland zugeteilt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Ortsname wird auch „Kartah“ geschrieben.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מִשְׁפְּחֹות
  choice: Und den Sippen
  rationale: Die Konjunktion und Präposition führen die Zuteilungsliste fort. „Sippen“ bezeichnet hier natürlich die genealogischen Untergruppen innerhalb des Stammes.
- source_word: בְּנֵי מְרָרִי
  choice: der Söhne Meraris
  rationale: Bewahrt die genealogische Ausdrucksweise des Hebräischen und ist im Deutschen verständlich.
- source_word: הַלְוִיִּם הַנּוֹתָרִים
  choice: den übrigen Leviten
  rationale: Bezeichnet die Gruppe der Leviten, deren Zuteilung an dieser Stelle noch aussteht.
- source_word: מֵאֵת מַטֵּה זְבוּלֻן
  choice: vom Stamm Sebulon
  rationale: מַטֶּה bedeutet im Kontext der Landverteilung „Stamm“; die Präposition kennzeichnet die Herkunft der zugeteilten Städte.
- source_word: יָקְנְעָם
  choice: Jokneam
  rationale: Gängige deutsche Umschrift des Ortsnamens.
- source_word: מִגְרָשֶׁהָ
  choice: mit seinem Weideland
  rationale: מִגְרָשׁ bezeichnet das offene Nutz- und Weideland im Umfeld einer Stadt; der Singular des Ausgangstextes wird bewahrt.
- source_word: קַרְתָּה
  choice: Karta
  rationale: Die Umschrift gibt den hebräischen Ortsnamen in einer für deutsche Leser natürlichen Form wieder.
