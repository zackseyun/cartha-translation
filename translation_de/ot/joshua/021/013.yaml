base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/013.yaml
  text: And to the sons of Aaron the priest they gave Hebron[a], the city of refuge for the manslayer, with its pasturelands, and Libnah with its pasturelands.
translation:
  language: de
  text: Und den Söhnen Aarons, des Priesters, gaben sie Hebron, die Zufluchtsstadt für den, der einen Menschen getötet hatte, samt ihren Weideflächen, und Libna samt ihren Weideflächen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלִבְנֵי אַהֲרֹן הַכֹּהֵן
  choice: Und den Söhnen Aarons, des Priesters
  rationale: לְ kennzeichnet den indirekten Empfänger; die hebräische Wortfolge und die Bezeichnung Aarons als Priester bleiben in natürlichem, würdigem Deutsch erkennbar.
- source_word: נָתְנוּ
  choice: gaben sie
  rationale: Die Grundbedeutung von נתן ist „geben“. Sie passt auch im Zusammenhang der Zuteilung von Städten und bleibt näher am Ausgangstext als „wiesen sie zu“.
- source_word: עִיר מִקְלַט הָרֹצֵחַ
  choice: die Zufluchtsstadt für den Totschläger
  rationale: „Zufluchtsstadt“ gibt den festen rechtlichen Ausdruck עִיר מִקְלָט prägnant wieder. „Totschläger“ bewahrt, anders als „Mörder“, die Offenheit hinsichtlich Vorsatz und Schuld.
- source_word: חֶבְרוֹן
  choice: Hebron
  rationale: Eingebürgerte deutsche Form des Ortsnamens.
- source_word: מִגְרָשֶׁיהָ
  choice: ihren Weideflächen
  rationale: מִגְרָשׁ bezeichnet das zu einer Stadt gehörende offene Land, besonders Weide- und Nutzflächen. Der Plural ist im Deutschen idiomatisch.
- source_word: לִבְנָה
  choice: Libna
  rationale: Eingebürgerte deutsche Form des Ortsnamens.
theological_decisions:
- issue: Schuldgrad des mit הָרֹצֵחַ bezeichneten Tötenden
  choice: Totschläger
  alternative: Mörder
  rationale: Der rechtliche Zusammenhang der Zufluchtsstädte betrifft einen Menschen, der einen anderen getötet hat und Zuflucht suchen darf; der Ausdruck sollte deshalb nicht vorschnell vorsätzlichen Mord festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Reihung mit „samt“ hält die knappe Aufzählungsform des Hebräischen fest; „Weideflächen“ ist für heutige Leser verständlicher als „Weidetriften“ oder „Gemeindeland“.
