source:
  edition: WLC
  text: וַֽ/יִּגְּשׁ֗וּ רָאשֵׁי֙ אֲב֣וֹת הַ/לְוִיִּ֔ם אֶל אֶלְעָזָר֙ הַ/כֹּהֵ֔ן וְ/אֶל יְהוֹשֻׁ֖עַ בִּן נ֑וּן וְ/אֶל רָאשֵׁ֛י אֲב֥וֹת הַ/מַּטּ֖וֹת לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/001.yaml
  text: Then the heads of the fathers’ houses of the Levites came near to Eleazar the priest[a], to Joshua son of Nun[b], and to the heads of the fathers’ houses of the tribes of the sons of Israel.
translation:
  language: de
  text: Da traten die Oberhäupter der Vaterhäuser[a] der Leviten zu dem Priester Eleasar, zu Josua, dem Sohn Nuns, und zu den Oberhäuptern der Vaterhäuser der Stämme der Söhne Israels[b] heran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Familienoberhäupter“ beziehungsweise „Oberhäupter der Sippen“. Die hebräische Wendung bezeichnet väterlich gegliederte Familien- oder Sippenverbände.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der Israeliten“. Wörtlich: „der Söhne Israels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: Da traten … heran
  rationale: נגשׁ bezeichnet das Herantreten oder Sichnähern. Die deutsche Wendung bewahrt sowohl die erzählerische Bewegung als auch den förmlichen Charakter der Zusammenkunft.
- source_word: רָאשֵׁי אֲבוֹת
  choice: die Oberhäupter der Vaterhäuser
  rationale: Die hebräische Wendung bezeichnet führende Vertreter väterlich gegliederter Großfamilien beziehungsweise Sippen. „Oberhäupter der Vaterhäuser“ hält diese soziale Struktur sichtbar und bleibt in würdigem Deutsch verständlich.
- source_word: הַלְוִיִּם
  choice: der Leviten
  rationale: Dies ist die geläufige und genaue deutsche Bezeichnung für die Angehörigen des Stammes Levi.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: der Priester Eleasar
  rationale: כֹּהֵן bedeutet hier eindeutig „Priester“; die im Deutschen natürliche Apposition stellt die Amtsbezeichnung vor den Namen.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Josua, der Sohn Nuns
  rationale: Die hebräische Vatersnamenformel wird im Deutschen natürlich und vollständig wiedergegeben.
- source_word: רָאשֵׁי אֲבוֹת הַמַּטּוֹת
  choice: die Oberhäupter der Vaterhäuser der Stämme
  rationale: Die Formulierung bewahrt die im Hebräischen erkennbare Gliederung von leitenden Familienverbänden innerhalb der Stämme.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: der Söhne Israels
  rationale: Die wörtlich familienbezogene Bezeichnung bleibt erhalten, statt sie im Haupttext zu „Israeliten“ zu verallgemeinern; in diesem Zusammenhang bezeichnet sie das Volk Israel als Abstammungsgemeinschaft.
theological_decisions:
- issue: Geschlechtsspezifische Verwandtschaftssprache in Israels Stammesordnung
  choice: „Vaterhäuser“ und „Söhne Israels“ im Haupttext beibehalten
  alternative: „Sippen/Familienverbände“ und „Israeliten/Volk Israel“
  rationale: Die männlichen Verwandtschaftsbegriffe gehören zur Darstellung der damaligen repräsentativen Familien- und Stammesstruktur. Ihre Beibehaltung wahrt die quellensprachliche Aussage, ohne daraus eine weitergehende lehrmäßige Folgerung abzuleiten.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit leicht förmlichem Ton, passend zu einer offiziellen Zusammenkunft. Die wiederholte Wendung „Oberhäupter der Vaterhäuser“ bildet die soziale Gliederung des Ausgangstextes bewusst ab; die Fußnoten bieten geläufigere Alternativen.
