base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/007.yaml
  text: 'For the sons of Merari[a], according to their families, from the tribe of Reuben and from the tribe of Gad and from the tribe of Zebulun: twelve cities.'
translation:
  language: de
  text: Die Nachkommen Meraris erhielten nach ihren Sippen vom Stamm Ruben, vom Stamm Gad und vom Stamm Sebulon zwölf Städte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְנֵי מְרָרִי
  choice: Die Nachkommen Meraris erhielten
  rationale: בני bezeichnet hier die zu Merari gehörenden Nachkommen. Das präfigierte ל markiert in diesem Zuteilungskontext die Empfänger; „erhielten“ macht die im hebräischen Nominalsatz vorausgesetzte Zuteilung im Deutschen natürlich verständlich.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: משפחה bezeichnet die Untergliederung eines Stammes beziehungsweise Geschlechts. „Sippen“ ist in diesem genealogischen Zuteilungskontext präziser als das modern leicht missverständliche „Familien“.
- source_word: מִמַּטֵּה
  choice: vom Stamm
  rationale: מטה bedeutet im Kontext der Land- und Städtezuteilung „Stamm“; die Herkunft der zugeteilten Städte wird mit „vom“ knapp und idiomatisch wiedergegeben.
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Im modernen deutschen Bibelgebrauch etablierte Namensform.
- source_word: גָד
  choice: Gad
  rationale: Etablierte deutsche Namensform.
- source_word: זְבוּלֻן
  choice: Sebulon
  rationale: Etablierte deutsche Bibelnamensform für den hebräischen Stammesnamen.
- source_word: עָרִים שְׁתֵּים עֶשְׂרֵה
  choice: zwölf Städte
  rationale: Direkte und im Deutschen natürliche Wiedergabe des Zahlworts und des üblichen Begriffs in den Zuteilungslisten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die elliptische hebräische Listenform wird durch „erhielten“ zu einem vollständigen deutschen Satz ergänzt, ohne den Zuteilungssinn zu verändern.
