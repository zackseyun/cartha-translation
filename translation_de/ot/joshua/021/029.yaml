lexical_decisions:
- source_word: יַרְמוּת
  choice: Jarmut
  rationale: Der Ortsname wird nach geläufiger deutscher Bibeltradition transliteriert und nicht übersetzt.
- source_word: מִגְרָשֶׁהָ
  choice: mit seinem Weideland
  rationale: מִגְרָשׁ bezeichnet in den Städtelisten das offene beziehungsweise als Weide nutzbare Land rings um eine Stadt. Der feminine Singularsuffix bezieht sich jeweils auf die betreffende Stadt; im Deutschen steht wegen des sächlichen Wortes „Land“ „seinem“.
- source_word: עֵין גַּנִּים
  choice: En-Gannim
  rationale: Der Ortsname wird transliteriert statt als „Quelle der Gärten“ übersetzt; die Schreibung entspricht einer geläufigen deutschen Wiedergabe.
- source_word: עָרִים אַרְבַּע
  choice: vier Städte
  rationale: Dies ist die natürliche deutsche Wiedergabe der zusammenfassenden Formel in der Städteliste.
