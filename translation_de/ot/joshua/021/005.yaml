base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/005.yaml
  text: And for the remaining sons of Kohath[a], from the clans of the tribe of Ephraim, from the tribe of Dan, and from the half-tribe of Manasseh, there were by lot ten cities.
translation:
  language: de
  text: Und die übrigen Nachkommen Kehats[a] erhielten durch das Los zehn Städte aus den Sippen des Stammes Ephraim, aus dem Stamm Dan und aus dem halben Stamm Manasse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die übrigen Kehatiter“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/בְנֵי קְהָת הַנּוֹתָרִים
  choice: Und die übrigen Nachkommen Kehats
  rationale: בְּנֵי bezeichnet hier die genealogische bzw. levitische Gruppe und wird im modernen Deutsch natürlich mit „Nachkommen“ wiedergegeben. הַנּוֹתָרִים grenzt sie von den bereits genannten Kehatitern ab.
- source_word: מִ/מִּשְׁפְּחֹת מַטֵּה אֶפְרַיִם
  choice: aus den Sippen des Stammes Ephraim
  rationale: מִשְׁפָּחוֹת meint in diesem Stammeskontext Untergliederungen im Sinn von Sippen; מַטֶּה bezeichnet eindeutig den Stamm.
- source_word: וּֽ/מִ/מַּטֵּה דָן
  choice: aus dem Stamm Dan
  rationale: Die wiederholte Präposition מִן wird zur Wahrung der parallelen Herkunftsangaben ausdrücklich wiedergegeben.
- source_word: וּ/מֵ/חֲצִי מַטֵּה מְנַשֶּׁה
  choice: aus dem halben Stamm Manasse
  rationale: „Der halbe Stamm Manasse“ ist die klare und im Deutschen geläufige Bezeichnung der territorialen Hälfte dieses Stammes.
- source_word: בַּ/גּוֹרָל
  choice: durch das Los
  rationale: Die Wendung bezeichnet das Los als Mittel der Zuteilung; „durch das Los“ ist natürlich und bewahrt den Verfahrenscharakter.
- source_word: עָרִים עָשֶׂר
  choice: zehn Städte
  rationale: עִיר wird in den Zuteilungslisten sachgerecht mit „Stadt“ wiedergegeben; die nachgestellte Zahl ergibt im Deutschen „zehn Städte“.
- source_word: implicit verbless clause
  choice: erhielten
  rationale: Die hebräische Listenform enthält kein ausdrückliches Verb. „Erhielten“ macht den aus dem Zuteilungskontext hervorgehenden Dativ לִבְנֵי im Deutschen verständlich, ohne zusätzliche Sachinformation einzuführen.
