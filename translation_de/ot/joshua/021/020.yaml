base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/020.yaml
  text: And for the families of the sons of Kohath[a], the Levites who remained from the sons of Kohath, the cities of their lot were from the tribe of Ephraim.
translation:
  language: de
  text: Für die Familien der Söhne Kehats, der Leviten, die unter den Söhnen Kehats übrig geblieben waren, stammten die Städte ihres Losanteils aus dem Stamm Ephraim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמִשְׁפְּחוֹת
  choice: den … Familien
  rationale: Das präfigierte ל bezeichnet im Zusammenhang der Verteilung die Empfänger; der deutsche Dativ gibt dies natürlich wieder.
- source_word: בְּנֵי קְהָת
  choice: der Söhne Kehats
  rationale: Die formale genealogische Ausdrucksweise des Hebräischen bleibt erhalten; zugleich wird Kehat gemäß der im Deutschen üblichen biblischen Namensform wiedergegeben.
- source_word: הַלְוִיִּם הַנּוֹתָרִים
  choice: den übrigen …, den Leviten
  rationale: הנותרים bezeichnet die nach den vorherigen Zuteilungen noch verbleibende Gruppe. „Übrigen“ ist in diesem Zusammenhang natürlicher als „übrig gebliebenen“.
- source_word: מִבְּנֵי קְהָת
  choice: aus den Nachkommen Kehats
  rationale: מן hat partitive Bedeutung. An dieser Stelle vermeidet „Nachkommen“ die schwerfällige unmittelbare Wiederholung von „Söhne Kehats“, ohne die Abstammungsangabe zu verändern.
- source_word: עָרֵי גוֹרָלָם
  choice: wurden durch das Los Städte … zugeteilt
  rationale: Die hebräische Wendung bezeichnet die Städte, die ihnen als Losanteil zufielen. Die verbale deutsche Fassung macht den allotmentbezogenen Sinn klar und klingt natürlich.
- source_word: מִמַּטֵּה אֶפְרָיִם
  choice: aus dem Stamm Ephraim
  rationale: מַטֶּה bezeichnet in dieser Stammesliste eindeutig einen israelitischen Stamm.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Satzstruktur wurde gegenüber der hebräischen Nominalform leicht geglättet, während Empfänger, genealogische Zuordnung, Losverfahren und Herkunftsstamm vollständig erhalten bleiben.
