  text: וְ/אֶת עַ֣יִן וְ/אֶת מִגְרָשֶׁ֗/הָ וְ/אֶת יֻטָּה֙ וְ/אֶת מִגְרָשֶׁ֔/הָ אֶת בֵּ֥ית שֶׁ֖מֶשׁ וְ/אֶת מִגְרָשֶׁ֑/הָ עָרִ֣ים תֵּ֔שַׁע מֵ/אֵ֕ת שְׁנֵ֥י הַ/שְּׁבָטִ֖ים הָ/אֵֽלֶּה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/016.yaml
  text: Ain with its pasturelands[a], Juttah with its pasturelands, Beth-shemesh with its pasturelands—nine cities from these two tribes.
translation:
  language: de
  text: Ajin mit seinem Weideland[a], Jutta mit seinem Weideland und Bet-Schemesch mit seinem Weideland – neun Städte von diesen beiden Stämmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Gemeindeland« oder »Umland«; gemeint ist das zu jeder Stadt gehörende offene Land.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַיִן
  choice: Ajin
  rationale: Der Ortsname wird nach einer im Deutschen verständlichen und dem Hebräischen nahen Form transliteriert, nicht als »Quelle« übersetzt.
- source_word: מִגְרָשֶׁיהָ
  choice: seinem Weideland
  rationale: Das Wort bezeichnet das zu einer Stadt gehörende offene Umland, das unter anderem als Weidefläche diente. »Weideland« ist konkret und in diesem Zusammenhang natürlich.
- source_word: יֻטָּה
  choice: Jutta
  rationale: Der hebräische Ortsname wird in einer natürlichen deutschen Transliterationsform wiedergegeben.
- source_word: בֵּית שֶׁמֶשׁ
  choice: Bet-Schemesch
  rationale: Der etablierte Ortsname wird transliteriert statt wörtlich als »Haus der Sonne« übersetzt.
- source_word: עָרִים תֵּשַׁע
  choice: neun Städte
  rationale: »Städte« entspricht der üblichen Wiedergabe des administrativen Begriffs in den Landzuteilungslisten.
- source_word: מֵאֵת שְׁנֵי הַשְּׁבָטִים הָאֵלֶּה
  choice: von diesen beiden Stämmen
  rationale: Die Formulierung bezeichnet die Herkunft beziehungsweise Zuteilung der Städte aus den beiden zuvor genannten Stammesgebieten.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die listenartige Struktur und die dreifache Zuordnung des Landes zu den jeweiligen Städten bleiben erhalten; Eigennamen werden deutsch transliteriert.
