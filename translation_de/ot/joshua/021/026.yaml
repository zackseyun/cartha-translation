  text: כָּל עָרִ֥ים עֶ֖שֶׂר וּ/מִגְרְשֵׁי/הֶ֑ן לְ/מִשְׁפְּח֥וֹת בְּנֵֽי קְהָ֖ת הַ/נּוֹתָרִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/026.yaml
  text: All the cities were ten[a], with their pasturelands[c][b], for the clans of the remaining sons of Kohath.
translation:
  language: de
  text: Insgesamt waren es zehn Städte mit ihren Weideflächen[a] für die Sippen der übrigen Nachkommen Kehats.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Weideflächen“ bezeichnet das zu den Städten gehörende offene Land, das besonders als Weideland und für ähnliche Zwecke genutzt wurde.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: „der übrigen Söhne Kehats“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל עָרִים עֶשֶׂר
  choice: Insgesamt waren es zehn Städte
  rationale: Die hebräische Schlussformel fasst die zuvor genannten Städte zusammen. Diese Wiedergabe bildet ihren summierenden Charakter in natürlichem Deutsch ab.
- source_word: וּמִגְרְשֵׁיהֶן
  choice: mit ihren Weideflächen
  rationale: מִגְרָשׁ bezeichnet das zu einer Stadt gehörende offene Umland, besonders für Weide- und verwandte Zwecke; „Weideflächen“ ist im Kontext präzise und verständlich.
- source_word: לְמִשְׁפְּחֹת
  choice: für die Sippen
  rationale: מִשְׁפָּחָה bezeichnet hier eine verwandtschaftliche Untergliederung; „Sippen“ unterscheidet diese von einzelnen Kernfamilien.
- source_word: בְּנֵי קְהָת
  choice: Nachkommen Kehats
  rationale: Wörtlich steht „Söhne Kehats“; im genealogischen Zusammenhang schließt der Ausdruck spätere Nachkommen ein, was „Nachkommen Kehats“ klar wiedergibt.
- source_word: הַנּוֹתָרִים
  choice: der übrigen
  rationale: Das Wort grenzt diese kehatischen Sippen von dem zuvor bereits berücksichtigten Zweig ab.
