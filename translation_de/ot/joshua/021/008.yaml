base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/008.yaml
  text: So the sons of Israel gave to the Levites these cities with their pasturelands[a], as Yahweh had commanded by the hand of Moses, by lot.
translation:
  language: de
  text: So gaben die Israeliten den Leviten diese Städte samt ihren Weideflächen durch das Los, wie Jahwe es durch Mose[a] befohlen hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „durch die Hand Moses“; eine hebräische Wendung für die Vermittlung durch Mose.'
    reason: Die Fußnote macht die zugrunde liegende hebräische Ausdrucksweise sichtbar, während der Haupttext natürliches modernes Deutsch verwendet.
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: So gaben
  rationale: Das narrative וַ־ wird im Zusammenhang folgernd mit „So“ wiedergegeben; נתן bezeichnet hier die Zuweisung beziehungsweise Übergabe der Städte.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die wörtliche Form lautet „Söhne Israels“, bezeichnet hier aber idiomatisch das Volk Israel. „Die Israeliten“ ist im modernen Deutschen natürlich und sachlich genau.
- source_word: לַלְוִיִּם
  choice: den Leviten
  rationale: Der Dativ gibt die Empfänger der Städte an.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: diese Städte
  rationale: Bewahrt den demonstrativen Bezug auf die zuvor genannten Städte.
- source_word: מִגְרְשֵׁיהֶן
  choice: ihren Weideflächen
  rationale: מִגְרָשׁ bezeichnet das offene, gemeinschaftlich nutzbare Land im Umfeld einer Stadt, besonders für Viehhaltung; „Weideflächen“ gibt den konkreten Sinn verständlich wieder.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: wie … befohlen hatte
  rationale: Die Wendung bezeichnet die Übereinstimmung mit einem bereits ergangenen Gebot; das Plusquamperfekt macht die zeitliche Abfolge im Deutschen deutlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: בְּיַד מֹשֶׁה
  choice: durch Mose
  rationale: Die hebräische Wendung „durch die Hand Moses“ bezeichnet vermittelte Urheberschaft. „Durch Mose“ gibt dieses Verhältnis im heutigen Deutsch idiomatisch wieder.
- source_word: בַּגּוֹרָל
  choice: durch das Los
  rationale: Gemeint ist die Zuteilung mittels Losentscheid. Die Stellung im deutschen Satz verdeutlicht, dass die Städte auf diese Weise vergeben wurden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn als Namen, statt ihn durch den traditionellen Titel „der HERR“ zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Samt“ hält die enge Verbindung zwischen den Städten und den zugehörigen Weideflächen knapp fest. Die Loszuteilung steht früh im Satz, damit ihr Bezug auf das Geben der Städte eindeutig bleibt.
