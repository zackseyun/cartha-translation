  text: וּ/מִ/מַּטֵּ֣ה בִנְיָמִ֔ן אֶת גִּבְע֖וֹן וְ/אֶת מִגְרָשֶׁ֑/הָ אֶת גֶּ֖בַע וְ/אֶת מִגְרָשֶֽׁ/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/017.yaml
  text: 'and from the tribe of Benjamin: Gibeon with its pasturelands[a], and Geba with its pasturelands;'
translation:
  language: de
  text: 'und vom Stamm Benjamin: Gibeon mit seinem Weideland[a] und Geba mit seinem Weideland;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gemeindeland“ oder „Freiland“; gemeint ist das Land im Umkreis der jeweiligen Stadt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה
  choice: und vom Stamm
  rationale: מַטֶּה bezeichnet im Zusammenhang der Landzuteilung einen Stamm; Konjunktion und Präposition werden als „und vom“ wiedergegeben und knüpfen an die vorhergehende Aufzählung an.
- source_word: בִנְיָמִן
  choice: Benjamin
  rationale: Der Stammesname wird in seiner üblichen deutschen Form wiedergegeben.
- source_word: אֶת גִּבְעוֹן
  choice: Gibeon
  rationale: Die direkte Objektmarkierung אֶת bleibt im Deutschen unausgedrückt; der Ortsname folgt der gebräuchlichen deutschen Schreibweise.
- source_word: מִגְרָשֶׁהָ
  choice: mit seinem Weideland
  rationale: מִגְרָשׁ bezeichnet das offene, gemeinschaftlich nutzbare Land im Umkreis einer Levitenstadt. „Weideland“ ist hier verständlich und idiomatisch; das feminine Suffix bezieht sich im Hebräischen auf die Stadt, wird im Deutschen jedoch entsprechend dem Genus von „Gibeon/Geba“ mit „seinem“ wiedergegeben.
- source_word: גֶּבַע
  choice: Geba
  rationale: Der Ortsname wird in der gebräuchlichen deutschen Schreibweise wiedergegeben.
- source_word: וְ/אֶת
  choice: und
  rationale: Die Konjunktion verbindet die beiden aufgeführten Städte; אֶת wird als direkte Objektmarkierung nicht eigens übersetzt.
