  language: en
  yaml_path: translation/ot/joshua/021/033.yaml
  text: All the cities of the Gershonites by their families were thirteen cities[a], with their pasturelands.
translation:
  language: de
  text: 'Alle Städte der Gerschoniter nach ihren Sippen: dreizehn Städte mit ihren Weideflächen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל עָרֵי
  choice: Alle Städte
  rationale: Die knappe deutsche Wiedergabe bewahrt den einleitenden Gesamtbegriff und die Zählformel.
- source_word: הַגֵּרְשֻׁנִּי
  choice: der Gerschoniter
  rationale: Das substantivierte Gentiliz steht kollektiv für die von Gerschon abstammende Gruppe; der deutsche Plural ist hier natürlich.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: Die Präposition bezeichnet hier die Gliederung nach Verwandtschaftsgruppen. „Sippen“ entspricht im Landverteilungskontext besser als das modern oft engere „Familien“.
- source_word: שְׁלֹשׁ עֶשְׂרֵה עִיר
  choice: dreizehn Städte
  rationale: Die hebräische Zahl-Nomen-Verbindung wird in natürliche deutsche Wortfolge übertragen; „Städte“ hält die Bezeichnung im Vers einheitlich.
- source_word: וּמִגְרְשֵׁיהֶן
  choice: mit ihren Weideflächen
  rationale: מִגְרָשׁ bezeichnet die zu den Städten gehörenden offenen Flächen, besonders für Viehhaltung. „Mit“ gibt die koordinierende Ergänzung im Deutschen idiomatisch wieder.
