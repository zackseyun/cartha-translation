  text: וַ/יְדַבְּר֨וּ אֲלֵי/הֶ֜ם בְּ/שִׁלֹ֗ה בְּ/אֶ֤רֶץ כְּנַ֨עַן֙ לֵ/אמֹ֔ר יְהוָה֙ צִוָּ֣ה בְ/יַד מֹשֶׁ֔ה לָֽ/תֶת לָ֥/נוּ עָרִ֖ים לָ/שָׁ֑בֶת וּ/מִגְרְשֵׁי/הֶ֖ן לִ/בְהֶמְתֵּֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/002.yaml
  text: And they spoke to them at Shiloh in the land of Canaan[a], saying, “Yahweh commanded through Moses to give us cities to dwell in[b], along with their pasturelands for our livestock.”
translation:
  language: de
  text: 'In Schilo im Land Kanaan sagten sie zu ihnen: „Jahwe hat durch Mose[a] befohlen, uns Städte zum Wohnen zu geben und ihre Weideflächen[b] für unser Vieh.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „durch die Hand Moses“; die hebräische Wendung bedeutet hier „durch Mose“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Freiflächen“ beziehungsweise „Gemeindeland“. Gemeint ist das Land rings um die Städte, das hier für das Vieh bestimmt ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ אֲלֵיהֶם
  choice: sie redeten … zu ihnen
  rationale: דבר im Piel bezeichnet hier das Reden; אֶל markiert die Richtung der Rede. Die Formulierung bewahrt beides, ohne das folgende לֵאמֹר vorwegzunehmen.
- source_word: בְּשִׁלֹה בְּאֶרֶץ כְּנַעַן
  choice: in Schilo im Land Kanaan
  rationale: Die beiden Ortsangaben werden vollständig und in natürlichem modernem Deutsch wiedergegeben.
- source_word: לֵאמֹר
  choice: und sagten
  rationale: Das hebräische Rede-Einleitungswort wird im Deutschen idiomatisch als finite Fortsetzung wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die Wiedergabe als Eigenname entspricht dem im Ausgangstext ausdrücklich stehenden Tetragramm und vermeidet die Ersetzung durch einen Titel.
- source_word: בְיַד מֹשֶׁה
  choice: durch Mose
  rationale: Wörtlich steht „durch die Hand Moses“; die Wendung bezeichnet hier Moses vermittelnde Funktion und wird im Haupttext idiomatisch wiedergegeben.
- source_word: עָרִים לָשָׁבֶת
  choice: Städte zum Wohnen
  rationale: עִיר wird als „Stadt“ wiedergegeben; der Infinitiv לָשָׁבֶת drückt den Zweck aus. „Zum Wohnen“ ist gegenwärtig, klar und zugleich würdig.
- source_word: וּמִגְרְשֵׁיהֶן
  choice: samt den zugehörigen Weideflächen
  rationale: מִגְרָשׁ bezeichnet das offene Land im Umfeld einer Stadt, das unter anderem dem Vieh diente. „Weideflächen“ macht die hier durch לִבְהֶמְתֵּנוּ ausdrücklich genannte Nutzung verständlich; eine Fußnote erhält die größere Bedeutungsbreite.
- source_word: לִבְהֶמְתֵּנוּ
  choice: für unser Vieh
  rationale: בְּהֵמָה bezeichnet hier den Viehbestand; „Vieh“ ist die natürliche deutsche Entsprechung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. „Jahwe“ gibt diesen Namen wieder, während „der HERR“ ihn durch einen Titel ersetzt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die hebräische Satzfolge bleibt weitgehend erkennbar; feste Wendungen werden idiomatisch übersetzt. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
