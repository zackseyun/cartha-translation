  naturalness: „Sie redeten … zu ihnen und sagten“ wirkt im modernen Standarddeutsch unnötig doppelt und etwas steif. „sagten sie zu ihnen“ ist eine natürliche Wiedergabe der hebräischen Redeformel und bewahrt ihren Sinn.
