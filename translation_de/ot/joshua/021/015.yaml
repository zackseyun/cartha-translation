  language: en
  yaml_path: translation/ot/joshua/021/015.yaml
  text: Holon with its pasturelands[a], and Debir with its pasturelands.
translation:
  language: de
  text: Holon mit seinem Weideland[a] und Debir mit seinem Weideland.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In der parallelen Liste in 1. Chronik 6,43 heißt diese Stadt »Hilen«; hier in Josua steht »Holon«.
    reason: Querverweis und Hinweis auf eine unterschiedliche Namensform
lexical_decisions:
- source_word: חֹלֹן
  choice: Holon
  rationale: Der Ortsname wird entsprechend der masoretischen Lesart in Josua transliteriert. Die abweichende Namensform in der Parallelliste wird in einer Fußnote genannt.
- source_word: מִגְרָשֶׁהָ
  choice: mit seinem Weideland
  rationale: מִגְרָשׁ bezeichnet das einer Stadt zugehörige offene Land, besonders als Weidefläche. Der deutsche Singular »Weideland« ist hier natürlich und gibt das jeweilige Umland als zusammenhängenden Bereich wieder; das Suffix bezieht sich jeweils auf die Stadt.
- source_word: דְּבִר
  choice: Debir
  rationale: Der als Ortsname verwendete Ausdruck wird transliteriert und nicht übersetzt.
- source_word: וְאֶת
  choice: und / mit
  rationale: Die Objektpartikel אֵת bleibt unübersetzt. Das vorangestellte וְ verbindet die Listenelemente; die Zuordnung der Weideflächen zu den Städten wird im Deutschen idiomatisch mit »mit« ausgedrückt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Listenstruktur des Hebräischen bleibt erhalten; »Weideland« ist allgemein verständlich und passt zum Zusammenhang der Levitenstädte.
