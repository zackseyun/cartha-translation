  text: וּ/מִ/מַּ֨טֵּה דָ֔ן אֶֽת אֶלְתְּקֵ֖א וְ/אֶת מִגְרָשֶׁ֑/הָ אֶֽת גִּבְּת֖וֹן וְ/אֶת מִגְרָשֶֽׁ/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/023.yaml
  text: 'And from the tribe of Dan: Eltekeh with its pasturelands[a], and Gibbethon with its pasturelands.'
translation:
  language: de
  text: 'Und vom Stamm Dan: Elteke mit seinem Weideland[a] und Gibbeton mit seinem Weideland.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit seinem umliegenden Weideland“ bzw. „mit seinem Gemeindeland“; das hebräische Wort מִגְרָשׁ bezeichnet das offene Nutzland rings um eine Stadt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה דָן
  choice: Und vom Stamm Dan
  rationale: מַטֶּה bezeichnet im Zusammenhang der Land- und Städteverteilung einen Stamm; Präposition und Konjunktion werden natürlich mit „Und vom“ wiedergegeben.
- source_word: אֶת
  choice: '[im Deutschen nicht wiedergegeben]'
  rationale: Der hebräische Akkusativmarker hat im Deutschen keine eigenständige Entsprechung.
- source_word: אֶלְתְּקֵא
  choice: Elteke
  rationale: Der Ortsname wird nach geläufiger deutscher Transliterationsform wiedergegeben.
- source_word: מִגְרָשֶׁהָ
  choice: mit seinem Weideland
  rationale: מִגְרָשׁ bezeichnet das offene, gemeinschaftlich nutzbare Land im Umkreis einer Stadt, besonders als Weidefläche. Das feminine Suffix bezieht sich auf die jeweilige Stadt; im Deutschen richtet sich „seinem“ grammatisch nach „Elteke/Gibbeton“ als Ortsname.
- source_word: גִּבְּתוֹן
  choice: Gibbeton
  rationale: Der Ortsname wird in einer geläufigen deutschen Transliterationsform wiedergegeben.
- source_word: וְ/אֶת
  choice: und
  rationale: Die Konjunktion wird mit „und“ wiedergegeben; der Akkusativmarker bleibt unübersetzt.
