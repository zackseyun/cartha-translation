base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/027.yaml
  text: And to the sons of Gershon[a], from the clans of the Levites, from the half-tribe of Manasseh, they gave Golan in Bashan, the city of refuge for the manslayer, with its pasturelands, and Beeshterah with its pasturelands—two cities.
translation:
  language: de
  text: Und den Söhnen Gerschons aus den Sippen der Leviten gaben sie vom halben Stamm Manasse Golan in Baschan, die Zufluchtsstadt für den, der einen Menschen getötet hat, jeweils mit ihrem Weideland, und Beeschtera[a], ebenfalls mit ihrem Weideland – zwei Städte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Text hat Beeschtera; vgl. 1. Chronik 6,56 (in anderer Verszählung 6,71), wo Aschtarot steht.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/לִ/בְנֵי גֵרְשׁוֹן
  choice: Und den Söhnen Gerschons
  rationale: Die wörtliche genealogische Ausdrucksweise „Söhne Gerschons“ bleibt erhalten und ist im Deutschen verständlich.
- source_word: מִ/מִּשְׁפְּחֹת הַ/לְוִיִּם
  choice: aus den Sippen der Leviten
  rationale: „Sippen“ bezeichnet hier passend die größeren verwandtschaftlichen Untergruppen innerhalb des Stammes Levi.
- source_word: מֵ/חֲצִי מַטֵּה מְנַשֶּׁה
  choice: vom halben Stamm Manasse
  rationale: מַטֶּה bezeichnet im Landverteilungskontext einen Stamm; die Formulierung gibt die Zugehörigkeit der abgetretenen Städte natürlich wieder.
- source_word: עִיר מִקְלַט הָרֹצֵחַ
  choice: die Zufluchtsstadt für den, der einen Menschen getötet hatte
  rationale: „Zufluchtsstadt“ gibt den festen Rechtsbegriff wieder. Die Umschreibung vermeidet, הָרֹצֵחַ vorschnell als vorsätzlichen „Mörder“ zu deuten, und entspricht dem rechtlichen Kontext einer möglicherweise unbeabsichtigten Tötung.
- source_word: גלון בַּ/בָּשָׁן
  choice: Golan in Baschan
  rationale: Die Ortsnamen werden in ihren im Deutschen gebräuchlichen biblischen Formen wiedergegeben.
- source_word: מִגְרָשֶׁהָ
  choice: samt ihrem Weideland
  rationale: מִגְרָשׁ bezeichnet das offene Nutz- und Weideland um eine Levitenstadt; „samt“ gibt die mit וְאֶת ausgedrückte Mitzuweisung knapp wieder.
- source_word: בְּעֶשְׁתְּרָה
  choice: Be-Eschtera
  rationale: Der Haupttext folgt dem masoretischen Text und harmonisiert den Ortsnamen nicht mit dem abweichenden „Aschtarot“ der Parallelstelle.
- source_word: עָרִים שְׁתָּיִם
  choice: zwei Städte
  rationale: Die abschließende Zählformel wird direkt und idiomatisch wiedergegeben.
- source_word: implicit verbal sense in allotment list
  choice: gaben sie
  rationale: Im hebräischen Vers fehlt ein finites Verb; aus der fortlaufenden Zuweisungsformel des Zusammenhangs ist „gaben sie“ zu ergänzen.
theological_decisions:
- issue: Rechtlicher Sinn von הָרֹצֵחַ
  choice: für den, der einen Menschen getötet hatte
  alternative: für den Totschläger
  rationale: Die gewählte Formulierung bewahrt die rechtliche Offenheit hinsichtlich Vorsatz oder Versehen und vermeidet eine im heutigen Deutsch leicht missverständliche Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe an der hebräischen Aufzählung, wird aber durch das aus dem Kontext ergänzte Verb verständlich gemacht. Der Fußnotenmarker wurde sachgerecht beim Ortsnamen Be-Eschtera gesetzt.
