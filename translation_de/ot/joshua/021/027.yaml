  naturalness: Der Satz ist insgesamt verständlich und dem gehobenen Bibelregister angemessen. „Beeschtera“ ist jedoch die im Deutschen natürlichere und übliche Umschrift; „Be-Eschtera“ legt eine morphologische Trennung nahe, die für den Ortsnamen im deutschen Fließtext nicht erforderlich ist. Die Wiederholung von Possessivpronomen bei zwei Ortsnamen lässt sich zudem klarer mit „jeweils mit ihrem Weideland“ formulieren.
