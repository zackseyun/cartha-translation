  text: וּ/מִ/מַּטֵּ֣ה אָשֵׁ֔ר אֶת מִשְׁאָ֖ל וְ/אֶת מִגְרָשֶׁ֑/הָ אֶת עַבְדּ֖וֹן וְ/אֶת מִגְרָשֶֽׁ/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/030.yaml
  text: 'and from the tribe of Asher: Mishal with its pasturelands[b][a], and Abdon with its pasturelands.'
translation:
  language: de
  text: 'und vom Stamm Ascher: Mischal mit seinem Weideland[a] und Abdon mit seinem Weideland.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Weideland“ ist das zu einer Stadt gehörende offene Umland gemeint, besonders für die Viehhaltung und andere gemeinschaftliche Zwecke.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה
  choice: und vom Stamm
  rationale: מַטֶּה bezeichnet im Zusammenhang der Stammesgebiete einen Stamm; Präposition und Konjunktion werden mit „und vom“ wiedergegeben.
- source_word: אָשֵׁר
  choice: Ascher
  rationale: Der Stammesname wird in seiner im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: אֶת
  choice: —
  rationale: Der hebräische Akkusativmarker hat keine eigenständige deutsche Entsprechung.
- source_word: מִשְׁאָל
  choice: Mischal
  rationale: Der Ortsname wird nahe an der masoretischen Konsonanten- und Vokalgestalt ins Deutsche übertragen.
- source_word: מִגְרָשֶׁהָ
  choice: mit seinem Weideland
  rationale: מִגְרָשׁ bezeichnet das einer Stadt zugehörige offene Umland, insbesondere für Viehhaltung und gemeinschaftliche Nutzung; der Singular „Weideland“ entspricht der hebräischen Form und klingt im Deutschen natürlich.
- source_word: עַבְדּוֹן
  choice: Abdon
  rationale: Der Ortsname wird in der geläufigen deutschen Form wiedergegeben.
- source_word: וְ/אֶת
  choice: und
  rationale: Die Konjunktion wird übersetzt, während der Akkusativmarker unübersetzt bleibt.
