  language: en
  yaml_path: translation/ot/joshua/021/039.yaml
  text: Heshbon with its pasturelands[a], and Jazer with its pasturelands—four cities in all.
translation:
  language: de
  text: Heschbon mit seinem Weideland[a] und Jaser mit seinem Weideland – insgesamt vier Städte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »Gemeindeland« beziehungsweise »das umliegende offene Land«; das hebräische Wort bezeichnet das einer Stadt zugehörige unbebaute Umland.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶשְׁבּוֹן
  choice: Heschbon
  rationale: Der Ortsname wird nach gängiger deutscher Bibeltradition transliteriert.
- source_word: מִגְרָשֶׁהָ
  choice: seinem Weideland
  rationale: מִגְרָשׁ bezeichnet das zu einer Stadt gehörende offene Umland, das besonders als Weidefläche diente; der deutsche Singular entspricht der hebräischen Form und ist in diesem Listenstil natürlich.
- source_word: יַעְזֵר
  choice: Jaser
  rationale: Der Ortsname wird in einer im Deutschen üblichen Form wiedergegeben.
- source_word: כָּל עָרִים אַרְבַּע
  choice: insgesamt vier Städte
  rationale: 'Die knappe hebräische Zusammenfassungsformel, wörtlich etwa »alle Städte: vier«, wird idiomatisch und präzise wiedergegeben.'
- source_word: אֶת ... וְאֶת ... אֶת ... וְאֶת
  choice: durch Aufzählung und Koordination wiedergegeben
  rationale: Die wiederholte Akkusativpartikel kennzeichnet die Glieder der fortlaufenden Objektliste und benötigt im Deutschen keine eigene lexikalische Entsprechung.
