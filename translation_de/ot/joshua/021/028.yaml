lexical_decisions:
- source_word: מִגְרָשֶׁהָ
  choice: mit seinen Weideflächen
  rationale: מִגְרָשׁ bezeichnet das offene Umland einer Stadt, das insbesondere als Weidefläche diente. Die deutsche Formulierung gibt die Funktion natürlich wieder; das feminine Suffix bezieht sich jeweils auf die Stadt.
- source_word: קִשְׁיוֹן
  choice: Kischjon
  rationale: Der hebräische Ortsname wird nach gängiger deutscher Umschrift wiedergegeben.
- source_word: דָּבְרַת
  choice: Daberat
  rationale: Die Umschrift folgt der masoretischen Konsonanten- und Vokalgestalt des Ortsnamens.
- source_word: מַטֵּה יִשָּׂשכָר
  choice: Stamm Issachar
  rationale: מַטֶּה bezeichnet hier den israelitischen Stamm; die knappe Listenform des Hebräischen bleibt erhalten.
