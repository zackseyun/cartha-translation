  text: וּ/מִ/מַּטֵּה גָ֗ד אֶת עִיר֙ מִקְלַ֣ט הָ/רֹצֵ֔חַ אֶת רָמֹ֥ת בַּ/גִּלְעָ֖ד וְ/אֶת מִגְרָשֶׁ֑/הָ וְ/אֶֽת מַחֲנַ֖יִם וְ/אֶת מִגְרָשֶֽׁ/הָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/038.yaml
  text: 'And from the tribe of Gad: Ramoth in Gilead[a], the city of refuge for the manslayer, with its pasturelands[c][b], and Mahanaim with its pasturelands.'
translation:
  language: de
  text: 'Und vom Stamm Gad: Ramot in Gilead, die Zufluchtsstadt für jemanden, der einen Menschen getötet hat[a], mit ihrem Weideland[c], und Mahanajim mit seinem Weideland.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „für den Tötenden“. Das hebräische Wort legt hier noch nicht fest, ob die Tötung vorsätzlich oder unbeabsichtigt geschah.'
    reason: lexical_alternative
  - marker: c
    text: Das „Weideland“ war das der Stadt zugewiesene Umland, das mit ihr zusammen genutzt wurde.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִמַּטֵּה גָד
  choice: Und vom Stamm Gad
  rationale: מַטֶּה bezeichnet in diesem Zuteilungskontext einen Stamm; Konjunktion und Präposition werden natürlich mit „Und vom“ wiedergegeben.
- source_word: עִיר מִקְלַט
  choice: Zufluchtsstadt
  rationale: Der feste Rechtsbegriff bezeichnet eine Stadt, in der ein Tötender vorläufigen Schutz finden konnte.
- source_word: הָרֹצֵחַ
  choice: einen, der jemanden getötet hatte
  rationale: רֹצֵחַ bezeichnet hier die Person, die einen Menschen getötet hat, ohne an dieser Stelle bereits zwischen vorsätzlichem Mord und unbeabsichtigter Tötung zu entscheiden. Die Umschreibung bewahrt diese rechtlich wichtige Offenheit.
- source_word: רָמֹת בַּגִּלְעָד
  choice: Ramot in Gilead
  rationale: Der Ortsname wird in einer im Deutschen üblichen Form transliteriert; die regionale Bestimmung wird natürlich mit „in Gilead“ wiedergegeben.
- source_word: מִגְרָשֶׁהָ
  choice: mit ihrem Weideland
  rationale: מִגְרָשׁ bezeichnet das der Stadt zugewiesene Umland, das insbesondere als Weidefläche diente; der deutsche Kollektivsingular entspricht dem Hebräischen und liest sich natürlich.
- source_word: מַחֲנַיִם
  choice: Mahanajim
  rationale: Der Eigenname wird nach geläufiger deutscher Transliteration wiedergegeben.
theological_decisions:
- issue: Schuldgrad der als הָרֹצֵחַ bezeichneten Person
  choice: Neutrale Umschreibung „einen, der jemanden getötet hatte“
  alternative: „Totschläger“ oder „Mörder“
  rationale: Der Zufluchtsstadt-Kontext verlangt, den Schuldgrad nicht vorwegzunehmen. „Mörder“ wäre zu eng und „Totschläger“ kann im modernen deutschen Strafrechtsverständnis vorsätzliche Schuld nahelegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem knappen Listenstil des hebräischen Textes. Die rechtlich offene Umschreibung bei הָרֹצֵחַ vermeidet eine vorschnelle Festlegung auf Mord oder Totschlag.
