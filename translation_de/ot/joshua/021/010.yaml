  text: וַֽ/יְהִי֙ לִ/בְנֵ֣י אַהֲרֹ֔ן מִ/מִּשְׁפְּח֥וֹת הַ/קְּהָתִ֖י מִ/בְּנֵ֣י לֵוִ֑י כִּ֥י לָ/הֶ֛ם הָיָ֥ה הַ/גּוֹרָ֖ל רִיאשֹׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/010.yaml
  text: It was for the sons of Aaron[a], from the families of the Kohathites, from the sons of Levi, because the first lot was for them.
translation:
  language: de
  text: Es fiel den Söhnen Aarons zu, die zu den Sippen der Kehatiter unter den Söhnen Levis gehörten; denn auf sie fiel das erste Los.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי לִבְנֵי אַהֲרֹן
  choice: Es fiel den Söhnen Aarons zu
  rationale: Die Konstruktion mit היה und ל bezeichnet hier im Zusammenhang der Städteverteilung eine Zuweisung. Die deutsche Formulierung gibt diesen Sinn natürlich wieder und bereitet zugleich die Aussage über das Los vor.
- source_word: מִמִּשְׁפְּחוֹת הַקְּהָתִי
  choice: die zu den Sippen der Kehatiter gehörten
  rationale: מִשְׁפָּחוֹת bezeichnet größere Familienverbände beziehungsweise Sippen. Der Relativsatz macht die genealogische Einordnung im Deutschen eindeutig und flüssig.
- source_word: מִבְּנֵי לֵוִי
  choice: unter den Söhnen Levis
  rationale: Die formale genealogische Bezeichnung ‚Söhne Levis‘ bleibt erhalten; ‚unter‘ kennzeichnet die Kehatiter als Teil dieser umfassenderen Gruppe.
- source_word: כִּי
  choice: denn
  rationale: כִּי führt die Begründung für die vorherige Zuweisung ein. ‚Denn‘ wahrt die kausale Verknüpfung in einem würdigen, natürlichen Erzählstil.
- source_word: לָהֶם הָיָה הַגּוֹרָל רִאשֹׁנָה
  choice: auf sie fiel das erste Los
  rationale: Die idiomatische deutsche Wendung bezeichnet klar die durch Los bestimmte Reihenfolge der Zuteilung. רִאשֹׁנָה wird als ‚erste‘ wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die genealogische Struktur des Hebräischen bleibt sichtbar, während die Zuweisung durch das Los idiomatisch formuliert wird.
