  text: וַ/יִּתֵּ֤ן יְהוָה֙ לְ/יִשְׂרָאֵ֔ל אֶת כָּל הָ/אָ֔רֶץ אֲשֶׁ֥ר נִשְׁבַּ֖ע לָ/תֵ֣ת לַ/אֲבוֹתָ֑/ם וַ/יִּרָשׁ֖וּ/הָ וַ/יֵּ֥שְׁבוּ בָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/043.yaml
  text: So Yahweh gave Israel all the land that he had sworn to give to their fathers[a], and they took possession of it and lived in it.
translation:
  language: de
  text: Der HERR gab Israel das ganze Land, das er ihren Vätern zu geben geschworen hatte. Sie nahmen es in Besitz und wohnten darin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: der HERR
  rationale: Die im modernen deutschen Bibelgebrauch etablierte Wiedergabe des Gottesnamens mit HERR bewahrt seine besondere Kennzeichnung und liest sich natürlich und würdig.
- source_word: וַיִּתֵּן
  choice: So gab
  rationale: נתן bedeutet hier schlicht „geben“; „So“ gibt die zusammenfassende beziehungsweise folgernde Funktion des einleitenden Waw im Kontext wieder.
- source_word: כָּל הָאָרֶץ
  choice: das ganze Land
  rationale: אֶרֶץ bezeichnet hier das Israel verheißene Land, nicht die gesamte Erde; כָּל wird mit „das ganze“ vollständig wiedergegeben.
- source_word: אֲשֶׁר נִשְׁבַּע לָתֵת
  choice: das er … zu geben geschworen hatte
  rationale: Der Niphal von שׁבע bezeichnet einen Eid. Das Plusquamperfekt macht im Deutschen deutlich, dass der Schwur der hier berichteten Gabe vorausging.
- source_word: לַאֲבוֹתָם
  choice: ihren Vätern
  rationale: Die konkrete maskuline Verwandtschaftsbezeichnung des Hebräischen bleibt erhalten und verweist in diesem Zusammenhang auf Israels Väter.
- source_word: וַיִּרָשׁוּהָ
  choice: Sie nahmen es in Besitz
  rationale: ירשׁ bezeichnet hier das Erlangen beziehungsweise Inbesitznehmen des verheißenen Landes. Die Formulierung bewahrt den konkreten Vorgang, ohne die mögliche Bundesdimension auf „erben“ festzulegen.
- source_word: וַיֵּשְׁבוּ בָהּ
  choice: und wohnten darin
  rationale: ישׁב mit ב bedeutet hier im Land wohnen. „Wohnten darin“ ist direkt, natürlich und weniger interpretierend als „ließen sich darin nieder“.
theological_decisions:
- issue: Umfang und Aussagekraft der Erfüllung der Landverheißung
  choice: Die Aussage wird ohne Abschwächung als vollständige Gabe des verheißenen Landes sowie dessen Inbesitznahme und Bewohnung wiedergegeben.
  alternative: Die Aussage als bloß teilweise Erfüllung abschwächen oder sie so absolut deuten, dass Spannungen zu anderen Eroberungstexten bereits in der Übersetzung aufgelöst werden.
  rationale: Der hebräische Text formuliert mit כָּל הָאָרֶץ eine starke Erfüllungszusammenfassung. Die Übersetzung bewahrt diese Aussage, ohne eine über den Vers hinausgehende dogmatische Harmonisierung vorzunehmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzstruktur. Der Gottesname wird nach verbreiteter deutscher Bibelkonvention als „HERR“ gesetzt. Keine Fußnote ist erforderlich, da „nahmen es in Besitz“ die kontextuell naheliegende Bedeutung von ירשׁ angemessen wiedergibt.
