  source_fidelity: 'Der Entwurf gibt die wesentlichen Elemente des Hebräischen zutreffend wieder: die bestimmten Städte, Israeliten und den bei ihnen wohnenden Ger, die unbeabsichtigte Tötung, den Bluträcher sowie das Erscheinen vor der Gemeinde. Die mit „bevor er ... gestanden hatte“ gewählte Zeitrelation ist jedoch gegenüber עַד („bis“) weniger unmittelbar und durch das Plusquamperfekt unnötig schwerfällig.'
