revisions:
- from: Dies waren die festgelegten Städte für alle Israeliten[a] und für den ansässigen Fremden, der unter ihnen lebte[b]. Dorthin konnte jeder fliehen, der unabsichtlich einen Menschen erschlagen hatte, und sollte nicht durch die Hand des Bluträchers sterben, bevor er vor der Gemeinde[c] gestanden hatte.
  to: Dies waren die bestimmten Städte für alle Israeliten[a] und für den ansässigen Fremden, der unter ihnen lebte[b], damit jeder, der unabsichtlich einen Menschen erschlagen hatte, dorthin fliehen konnte und nicht durch die Hand des Bluträchers starb, bis er vor der Gemeinde[c] stand.
  rationale: Die Revision ersetzt die weniger idiomatische Bezeichnung „festgelegten“ durch „bestimmten“ und gestaltet den Zweckzusammenhang einheitlich. „Bis er vor der Gemeinde stand“ gibt עַד unmittelbar wieder, ohne eine über die Vorlage hinausgehende Aussage über Ablauf oder Ergebnis des Verfahrens zu machen. Die vorhandenen Fußnotenanker und ihre Inhalte bleiben erhalten.
