  terminology: „Bluträcher“ ist als historische Rechtsbezeichnung treffend. „Ansässiger Fremder“ wahrt den besonderen sozialen und rechtlichen Status des גֵּר, ohne moderne Kategorien einzutragen. „Gemeinde“ ist für עֵדָה vertretbar; die Alternative „Versammlung“ bleibt angemessen in der Fußnote.
