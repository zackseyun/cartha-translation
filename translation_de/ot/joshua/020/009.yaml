source:
  edition: WLC
  text: אֵ֣לֶּה הָיוּ֩ עָרֵ֨י הַ/מּֽוּעָדָ֜ה לְ/כֹ֣ל בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/לַ/גֵּר֙ הַ/גָּ֣ר בְּ/תוֹכָ֔/ם לָ/נ֣וּס שָׁ֔מָּ/ה כָּל מַכֵּה נֶ֖פֶשׁ בִּ/שְׁגָגָ֑ה וְ/לֹ֣א יָמ֗וּת בְּ/יַד֙ גֹּאֵ֣ל הַ/דָּ֔ם עַד עָמְד֖/וֹ לִ/פְנֵ֥י הָ/עֵדָֽה׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/009.yaml
  text: These were the appointed cities for all the sons of Israel and for the sojourner residing among them[c][b][a], so that anyone who struck down a person unintentionally might flee there and not die by the hand of the avenger of blood until he stood before the congregation.
translation:
  language: de
  text: Dies waren die bestimmten Städte für alle Israeliten[a] und für den ansässigen Fremden, der unter ihnen lebte[b], damit jeder, der unabsichtlich einen Menschen erschlagen hatte, dorthin fliehen konnte und nicht durch die Hand des Bluträchers starb, bis er vor der Gemeinde[c] stand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „für alle Söhne Israels“; gemeint sind die Israeliten als Volk.'
    reason: lexical_alternative
  - marker: b
    text: Der „ansässige Fremde“ war ein Nichtisraelit, der innerhalb der israelitischen Gemeinschaft lebte und ihrer Rechtsordnung unterstand.
    reason: cultural_note
  - marker: c
    text: 'Oder: „Versammlung“. Gemeint ist die Gemeinschaft in ihrer öffentlichen, rechtsprechenden Funktion.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵי הַמּוּעָדָה
  choice: die festgelegten Städte
  rationale: Die Wendung bezeichnet die amtlich bestimmten bzw. ausgewiesenen Städte. „Festgelegt“ bewahrt diesen formalen Sinn, ohne das im unmittelbaren Ausdruck nicht genannte Wort „Zuflucht“ einzufügen.
- source_word: לְכֹל בְּנֵי יִשְׂרָאֵל
  choice: für alle Israeliten
  rationale: בְּנֵי יִשְׂרָאֵל lautet wörtlich „Söhne Israels“, ist hier jedoch die geläufige nationale Sammelbezeichnung. „Israeliten“ gibt den gemeinten Personenkreis in heutigem Deutsch eindeutig wieder; die formale Ausdrucksweise steht in der Fußnote.
- source_word: וְלַגֵּר הַגָּר בְּתוֹכָם
  choice: und für den ansässigen Fremden, der unter ihnen lebte
  rationale: גֵּר bezeichnet einen Nichtisraeliten, der dauerhaft innerhalb der israelitischen Gemeinschaft wohnte. „Ansässiger Fremder“ erhält diese rechtlich-soziale Kategorie besser als das allgemeinere „Fremder“ allein.
- source_word: לָנוּס שָׁמָּה
  choice: Dorthin konnte ... fliehen
  rationale: נוּס bedeutet „fliehen“. Die deutsche Satzgestaltung bringt die durch לְ ausgedrückte Zweckbestimmung natürlich zum Ausdruck.
- source_word: כָּל מַכֵּה נֶפֶשׁ בִּשְׁגָגָה
  choice: jeder, der unabsichtlich einen Menschen erschlagen hatte
  rationale: מַכֵּה נֶפֶשׁ bezeichnet jemanden, der einen Menschen tödlich geschlagen hat; בִּשְׁגָגָה schließt die Tötungsabsicht aus. „Unabsichtlich ... erschlagen“ bewahrt sowohl das konkrete Bild als auch die rechtliche Nuance.
- source_word: גֹּאֵל הַדָּם
  choice: Bluträcher
  rationale: Der Ausdruck bezeichnet den nahen Angehörigen, dem im damaligen Recht die Blutrache oblag. „Bluträcher“ ist die knappe, etablierte deutsche Bezeichnung für diese Rechtsfigur.
- source_word: עַד עָמְדוֹ לִפְנֵי הָעֵדָה
  choice: bevor er vor der Gemeinde gestanden hatte
  rationale: 'עַד markiert hier die Grenze des gewährten Schutzes: Der Betroffene sollte bis zu seinem Erscheinen vor der zuständigen Gemeinschaft nicht getötet werden. „Bevor“ formuliert dieses Verhältnis im Deutschen natürlich, ohne den Ausgang der Verhandlung vorwegzunehmen.'
- source_word: הָעֵדָה
  choice: die Gemeinde
  rationale: עֵדָה meint hier die Gemeinschaft in ihrer versammelten, rechtsprechenden Funktion. „Gemeinde“ bewahrt den gemeinschaftlichen Charakter; „Versammlung“ bleibt als mögliche Wiedergabe in der Fußnote.
theological_decisions:
- issue: Umfang der nationalen Bezeichnung בְּנֵי יִשְׂרָאֵל
  choice: alle Israeliten
  alternative: alle Söhne Israels
  rationale: Die grammatisch maskuline Wendung ist eine nationale Sammelbezeichnung und beschränkt den gewährten Rechtsschutz nicht auf männliche Israeliten. Die idiomatische Hauptübersetzung verhindert dieses moderne Missverständnis, während die Fußnote die wörtliche Form offenlegt.
- issue: Rechtsstellung des גֵּר
  choice: ansässiger Fremder
  alternative: Fremdling; Zugezogener
  rationale: Der Vers erstreckt den Schutz ausdrücklich auf einen nichtisraelitischen Bewohner innerhalb der Gemeinschaft. Die Übersetzung wahrt diese rechtlich relevante Zwischenstellung, ohne heutige staatsrechtliche Kategorien einzutragen.
- issue: Funktion der עֵדָה
  choice: Gemeinde
  alternative: Versammlung
  rationale: Der Text benennt die Gemeinschaft als Instanz, vor der der Totschläger stehen muss, ohne hier die genaue Zusammensetzung oder das Verfahrensresultat zu erklären. Die Übersetzung lässt diese Unbestimmtheit bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Rechtssprache. Historisierende Wörter werden vermieden, soweit ein präziser heutiger Ausdruck verfügbar ist; „Bluträcher“ bleibt wegen seiner fachlichen Genauigkeit erhalten. Die Satzfolge wurde für natürliches Deutsch leicht gegliedert, ohne die Zweck- und Zeitbeziehungen des Hebräischen aufzulösen.
