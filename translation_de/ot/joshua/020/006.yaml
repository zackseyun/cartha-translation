base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/006.yaml
  text: And he shall live in that city until he stands before the congregation for judgment[a], until the death of the high priest who is in office in those days. Then the manslayer may return and come to his city and to his house[b], to the city from which he fled.
translation:
  language: de
  text: Er soll in jener Stadt bleiben, bis er vor der Gemeinde zum Gericht steht, bis zum Tod des Hohen Priesters, der in jenen Tagen im Amt ist. Dann darf derjenige, der getötet hat[b], zurückkehren und in seine Stadt und in sein Haus kommen – in die Stadt, aus der er geflohen ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Auch: „der Tötende“ oder traditionell „der Totschläger“. Das hebräische Wort bezeichnet hier den Menschen, der getötet hat, ohne ihn in diesem Vers bereits als Mörder zu verurteilen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשַׁב
  choice: Er soll … bleiben
  rationale: ישׁב bezeichnet hier den fortdauernden Aufenthalt in der Zufluchtsstadt. „Bleiben“ gibt die rechtliche Verpflichtung in natürlichem Deutsch wieder.
- source_word: עַד עָמְדוֹ לִפְנֵי הָעֵדָה לַמִּשְׁפָּט
  choice: bis er vor die Gemeinde tritt, damit sie über ihn Recht spricht
  rationale: עמד לפני bezeichnet das Erscheinen vor einer zuständigen Körperschaft; למשפט nennt den Zweck der rechtlichen Entscheidung. Die Formulierung macht den gerichtlichen Vorgang verständlich, ohne das Ergebnis vorwegzunehmen.
- source_word: הָעֵדָה
  choice: die Gemeinde
  rationale: עדה meint hier die versammelte Gemeinschaft, die rechtlich entscheidet. „Gemeinde“ wahrt den gemeinschaftlichen Charakter; „Versammlung“ ist ebenfalls möglich.
- source_word: עַד מוֹת הַכֹּהֵן הַגָּדוֹל
  choice: bis zum Tod des Hohen Priesters
  rationale: Die hebräische Nominalfügung wird eng und würdig wiedergegeben; „Hoher Priester“ ist die etablierte deutsche Amtsbezeichnung.
- source_word: אֲשֶׁר יִהְיֶה בַּיָּמִים הָהֵם
  choice: der in jenen Tagen im Amt ist
  rationale: Die Wendung bezeichnet den zur betreffenden Zeit amtierenden Hohen Priester. „Im Amt ist“ gibt diese Funktion idiomatisch wieder.
- source_word: אָז יָשׁוּב
  choice: Dann darf … zurückkehren
  rationale: Im rechtlichen Zusammenhang bezeichnet die Rückkehr eine nach Erfüllung der Bedingungen bestehende Erlaubnis, nicht notwendig eine Vorhersage tatsächlicher Rückkehr.
- source_word: הָרֹצֵחַ
  choice: derjenige, der getötet hat
  rationale: רצח bezeichnet hier die Person, die einen Menschen getötet hat, bevor beziehungsweise ohne dass sie als Mörder verurteilt ist. Die neutrale Umschreibung vermeidet die im heutigen deutschen Strafrecht mit „Totschläger“ verbundene Festlegung auf vorsätzliche Tötung.
- source_word: אֶל עִירוֹ וְאֶל בֵּיתוֹ
  choice: in seine Stadt und in sein Haus
  rationale: Die doppelte Rückkehr an den kommunalen und häuslichen Ort wird beibehalten. Bei Bewegungsverben ist „in“ im Deutschen natürlicher als ein wiederholtes „zu“.
- source_word: אֶל הָעִיר אֲשֶׁר נָס מִשָּׁם
  choice: in die Stadt, aus der er geflohen ist
  rationale: Die abschließende Wiederaufnahme des Zielortes bleibt erhalten und wird in idiomatischem Deutsch formuliert.
theological_decisions:
- issue: Rechtlicher Status von הָרֹצֵחַ im Zufluchtsstadtgesetz
  choice: Neutral als „derjenige, der getötet hat“ wiedergegeben
  alternative: „der Totschläger“, „der Mörder“ oder „der Täter“
  rationale: Der Zusammenhang unterscheidet unbeabsichtigte Tötung von Mord. „Mörder“ würde Schuld vorwegnehmen; „Totschläger“ bezeichnet im modernen deutschen Recht regelmäßig einen vorsätzlich Tötenden. Die Umschreibung wahrt die im Text noch offene rechtliche Einordnung.
- issue: Aussagekraft von אָז יָשׁוּב nach dem Tod des Hohen Priesters
  choice: Als rechtliche Erlaubnis („darf zurückkehren“) wiedergegeben
  alternative: Als Zukunftsaussage („wird zurückkehren“) oder Verpflichtung („soll zurückkehren“)
  rationale: Der gesetzliche Zusammenhang regelt, wann die beschränkte Person wieder heimkehren darf. Die Übersetzung wahrt diesen permissiven Sinn, ohne eine tatsächliche Rückkehr zwingend vorauszusagen.
- issue: Verhältnis der beiden mit עַד eingeleiteten Zeitangaben
  choice: Beide Grenzen ausdrücklich nebeneinandergestellt
  alternative: Die erste Angabe der zweiten unterordnen oder eine chronologische Harmonisierung einfügen
  rationale: Der hebräische Text nennt sowohl das Erscheinen vor der Gemeinde zum Rechtsentscheid als auch den Tod des Hohen Priesters. Die Übersetzung bewahrt diese Spannung, ohne ihr Verhältnis über den Wortlaut hinaus zu erklären.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer rechtlicher Sprache. Die Wiederholung von „Stadt“ und „bis“ folgt der Struktur des Hebräischen; die neutrale Umschreibung für den Tötenden vermeidet missverständliche Kategorien des heutigen deutschen Strafrechts.
