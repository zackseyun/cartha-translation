  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל יְהוֹשֻׁ֖עַ לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/001.yaml
  text: Then Yahweh spoke to Joshua[a], saying,
translation:
  language: de
  text: 'Dann redete Jahwe zu Josua[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und Jahwe redete zu Josua und sagte:“'
    reason: Der hebräische Erzählungsanschluss kann im Deutschen sowohl mit „dann“ als auch mit „und“ wiedergegeben werden; לֵאמֹר lässt sich zudem ausdrücklich mit „und sagte“ übersetzen.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Dann redete
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; „Dann“ gibt die zeitlich-fortschreitende Funktion im Deutschen natürlich wieder. דִּבֵּר wird mit „redete“ wiedergegeben und so von dem einfacheren „sagte“ unterschieden.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als Eigenname „Jahwe“ wiedergegeben, nicht durch einen Titel ersetzt.
- source_word: אֶל
  choice: zu
  rationale: In der Verbindung „zu jemandem reden“ ist „zu“ die natürliche deutsche Entsprechung.
- source_word: יְהוֹשֻׁעַ
  choice: Josua
  rationale: Der Personenname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der formelhafte Infinitiv leitet die unmittelbar folgende wörtliche Rede ein. Im natürlichen modernen Deutsch erfüllt ein Doppelpunkt diese Funktion präzise, ohne das schwerfällige „indem er sprach“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. Die Wiedergabe „Jahwe“ bewahrt den persönlichen Gottesnamen, während „der HERR“ ihn durch einen Titel ersetzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt gibt die hebräische Redeeinleitungsformel idiomatisch wieder; die Fußnote bewahrt die formalere Alternative.
