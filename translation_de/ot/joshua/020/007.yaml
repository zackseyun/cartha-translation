base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/007.yaml
  text: So they set apart Kedesh in Galilee in the hill country of Naphtali[a], and Shechem in the hill country of Ephraim, and Kiriath-arba (that is, Hebron) in the hill country of Judah.
translation:
  language: de
  text: So sonderten sie Kedesch in Galiläa im Bergland von Naftali aus, Sichem im Bergland von Efraim und Kirjat-Arba, das ist Hebron, im Bergland von Juda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּקְדִּשׁוּ
  choice: sonderten sie … aus
  rationale: קדשׁ bezeichnet hier im rechtlich-öffentlichen Zusammenhang die Bestimmung der Städte zu Zufluchtsstädten. „aussondern“ gibt die besondere Zweckbestimmung wieder, ohne vorrangig eine kultische Weihe anzudeuten.
- source_word: קֶדֶשׁ
  choice: Kedesch
  rationale: Eingebürgerte deutsche Umschrift des Ortsnamens.
- source_word: בַּגָּלִיל
  choice: in Galiläa
  rationale: Übliche deutsche Bezeichnung der geografischen Region.
- source_word: בְּהַר נַפְתָּלִי
  choice: im Bergland von Naftali
  rationale: הַר bezeichnet in dieser territorialen Beschreibung eine gebirgige Region, nicht notwendig einen einzelnen Berg.
- source_word: שְׁכֶם
  choice: Sichem
  rationale: Im Deutschen etablierte biblische Namensform.
- source_word: בְּהַר אֶפְרָיִם
  choice: im Bergland von Efraim
  rationale: Die Wendung bezeichnet das Efraim zugeordnete Bergland.
- source_word: קִרְיַת אַרְבַּע
  choice: Kirjat-Arba
  rationale: Der feste Ortsname wird in einer im Deutschen verständlichen Umschrift wiedergegeben, statt als „Stadt Arbas“ übersetzt zu werden.
- source_word: הִיא חֶבְרוֹן
  choice: das ist Hebron
  rationale: Die hebräische Identifikationsformel wird knapp und unmittelbar wiedergegeben.
- source_word: בְּהַר יְהוּדָה
  choice: im Bergland von Juda
  rationale: Gemeint ist die judäische Bergregion, nicht ein einzelner Berg namens Juda.
