revisions:
- from: Und wenn der Bluträcher ihn verfolgt, dürfen sie den, der getötet hat, nicht in seine Hand ausliefern; denn er hat seinen Nächsten ohne Absicht erschlagen und ihn zuvor nicht gehasst.[a]
  to: Und wenn der Bluträcher ihn verfolgt, sollen sie den, der getötet hat, nicht seiner Gewalt ausliefern; denn er hatte seinen Mitmenschen ohne Absicht geschlagen und ihn zuvor nicht gehasst.[a]
  rationale: Die Revision verbessert die idiomatische Wiedergabe der rechtlichen Übergabe und die Verbindlichkeit der Anweisung. Sie ersetzt außerdem „erschlagen“ durch „geschlagen“, um die Wortwahl des hebräischen Verbs zu wahren; dass es sich um einen tödlichen Vorfall handelt, ergibt sich aus dem Kontext und der neutralen Bezeichnung der betreffenden Person. Die zeitliche Formel wird weiterhin idiomatisch mit „zuvor“ wiedergegeben und in einer präzisierten Fußnote erläutert.
