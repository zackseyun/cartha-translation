  naturalness: Der Satz ist gut verständlich. „In seine Hand ausliefern“ ist im modernen Deutsch jedoch unnötig wörtlich und weniger idiomatisch als „seiner Gewalt ausliefern“. „Sollen ... nicht“ gibt eine Rechtsanweisung präziser wieder als „dürfen ... nicht“.
