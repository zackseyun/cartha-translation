base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/005.yaml
  text: And if the avenger of blood pursues him[a], they shall not hand the manslayer over into his hand, because he struck his neighbor without intent and had not hated him before, from yesterday or the day before.
translation:
  language: de
  text: Und wenn der Bluträcher ihn verfolgt, sollen sie den, der getötet hat, nicht seiner Gewalt ausliefern; denn er hatte seinen Mitmenschen ohne Absicht geschlagen und ihn zuvor nicht gehasst.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von gestern und vorgestern her“; eine hebräische Wendung im Sinn von „schon früher“ oder „zuvor“.'
    reason: Die Fußnote bewahrt die konkrete hebräische Zeitformel, ohne mit „seit“ einen im Deutschen unpassenden fortdauernden Zeitraum anzudeuten.
lexical_decisions:
- source_word: וְכִי
  choice: Und wenn
  rationale: Die Verbindung leitet innerhalb der Rechtsbestimmung einen möglichen Fall ein und wahrt zugleich den Anschluss an den vorherigen Vers.
- source_word: גֹּאֵל הַדָּם
  choice: der Bluträcher
  rationale: Der im Deutschen verständliche rechtliche Fachausdruck bezeichnet den Familienangehörigen, der vergossenes Blut rächt.
- source_word: וְלֹא יַסְגִּרוּ ... בְּיָדוֹ
  choice: dürfen sie ... nicht in seine Hand ausliefern
  rationale: Die Formulierung bewahrt das Bild der Übergabe in die Gewalt des Bluträchers; „dürfen nicht“ gibt die verbindliche Rechtsanweisung natürlich wieder.
- source_word: הָרֹצֵחַ
  choice: den, der getötet hat
  rationale: Die neutrale Umschreibung bezeichnet den Verursacher des Todes, ohne ihn vor der rechtlichen Klärung als Mörder oder als im modernen deutschen Sinn vorsätzlichen Totschläger einzustufen.
- source_word: בִּבְלִי דַעַת
  choice: ohne Absicht
  rationale: Im rechtlichen Zusammenhang bezeichnet die Wendung fehlendes Wissen beziehungsweise fehlende Absicht beim tödlichen Geschehen; „ohne Absicht“ ist klares heutiges Deutsch.
- source_word: הִכָּה אֶת רֵעֵהוּ
  choice: hat seinen Nächsten ... erschlagen
  rationale: נכה bedeutet grundsätzlich „schlagen“; „erschlagen“ macht in diesem Zusammenhang den aus den Zufluchtsstadtbestimmungen vorausgesetzten tödlichen Ausgang verständlich.
- source_word: מִתְּמוֹל שִׁלְשׁוֹם
  choice: zuvor
  rationale: Die wörtliche Zeitangabe „seit gestern, vorgestern“ ist eine hebräische Wendung für die vorhergehende Zeit; die idiomatische Bedeutung steht im Text, die Bildform in der Fußnote.
theological_decisions:
- issue: Rechtlicher Status von הָרֹצֵחַ im Zusammenhang der Zufluchtsstädte
  choice: den, der getötet hat
  alternative: der Mörder; der Totschläger
  rationale: Der Vers verneint Absicht und vorausgehenden Hass. Eine neutrale Bezeichnung verhindert, dass die Übersetzung bereits eine Schuld feststellt, die der Text hier gerade nicht voraussetzt.
- issue: Rechtlicher Sinn von בִּבְלִי דַעַת
  choice: ohne Absicht
  alternative: ohne Wissen; unwissentlich
  rationale: Die Formulierung hebt im Zusammenhang die fehlende Vorsätzlichkeit hervor, ohne die grundsätzliche Bedeutungsnähe zu fehlendem Wissen in einer konfessionell geprägten Weise weiter auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der rechtliche Ton bleibt erhalten. Die neutrale Umschreibung „den, der getötet hat“ vermeidet die im heutigen deutschen Strafrecht irreführenden Begriffe „Mörder“ und „Totschläger“.
