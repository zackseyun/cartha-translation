source:
  edition: WLC
  text: וְ/נָ֞ס אֶל אַחַ֣ת מֵ/הֶ/עָרִ֣ים הָ/אֵ֗לֶּה וְ/עָמַד֙ פֶּ֚תַח שַׁ֣עַר הָ/עִ֔יר וְ/דִבֶּ֛ר בְּ/אָזְנֵ֛י זִקְנֵ֥י הָ/עִֽיר הַ/הִ֖יא אֶת דְּבָרָ֑י/ו וְ/אָסְפ֨וּ אֹת֤/וֹ הָ/עִ֨ירָ/ה֙ אֲלֵי/הֶ֔ם וְ/נָתְנוּ ל֥/וֹ מָק֖וֹם וְ/יָשַׁ֥ב עִמָּֽ/ם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/004.yaml
  text: He shall flee to one of these cities and stand at the entrance of the city gate[a], and he shall speak his case in the hearing of the elders of that city. Then they shall take him into the city to themselves, and they shall give him a place[b], and he shall live with them.
translation:
  language: de
  text: Er soll in eine dieser Städte fliehen, am Eingang des Stadttors stehen und den Ältesten jener Stadt seine Sache[a] vortragen. Dann sollen sie ihn zu sich in die Stadt aufnehmen[b], ihm einen Platz geben, und er soll bei ihnen wohnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „seine Worte“ oder „seine Angelegenheit“; das Hebräische kann sowohl die gesprochenen Worte als auch die vorgetragene Sache bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „ihn zu sich in die Stadt hereinbringen“; das hebräische Verb kann „sammeln“, „hereinbringen“ oder „aufnehmen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָס
  choice: Er soll … fliehen
  rationale: Die Verbform steht in einer rechtlich-anweisenden Abfolge; im Deutschen gibt „soll“ den verfahrensrechtlichen Sinn natürlich wieder.
- source_word: אַחַת מֵהֶעָרִים הָאֵלֶּה
  choice: in eine dieser Städte
  rationale: Die partitive Konstruktion wird idiomatisch und genau wiedergegeben.
- source_word: וְעָמַד פֶּתַח שַׁעַר הָעִיר
  choice: am Eingang des Stadttores stehen
  rationale: פֶּתַח bezeichnet den Eingang beziehungsweise die Öffnung; die Formulierung bewahrt den öffentlichen Ort am Stadttor, an dem Recht gesprochen wurde.
- source_word: וְדִבֶּר בְּאָזְנֵי זִקְנֵי הָעִיר הַהִיא
  choice: den Ältesten jener Stadt … vortragen
  rationale: Die Wendung בְּאָזְנֵי bedeutet „vor den Ohren/in Gegenwart von“. „Vortragen“ gibt die förmliche Darlegung vor den Ältesten in natürlichem Deutsch wieder; „jener Stadt“ bewahrt הַהִיא.
- source_word: אֶת דְּבָרָיו
  choice: seine Sache
  rationale: דָּבָר kann „Wort“, „Angelegenheit“ oder im rechtlichen Zusammenhang „Sache/Fall“ bedeuten. „Seine Sache“ passt zum Verfahren, ohne die lexikalische Mehrdeutigkeit unnötig einzuengen.
- source_word: וְאָסְפוּ אֹתוֹ הָעִירָה אֲלֵיהֶם
  choice: Dann sollen sie ihn zu sich in die Stadt aufnehmen
  rationale: אָסַף kann „sammeln“, „hereinbringen“ oder „aufnehmen“ bedeuten. Hier bezeichnet es die offizielle Aufnahme in die Stadt; „zu sich“ gibt אֲלֵיהֶם wieder.
- source_word: וְנָתְנוּ לוֹ מָקוֹם
  choice: ihm einen Platz geben
  rationale: מָקוֹם ist allgemein „Ort/Platz“. Die offene Formulierung legt nicht fest, ob Unterkunft, Wohnraum oder ein zugewiesener Aufenthaltsort gemeint ist.
- source_word: וְיָשַׁב עִמָּם
  choice: bei ihnen wohnen
  rationale: יָשַׁב bedeutet in einem Niederlassungs- und Aufenthaltskontext „wohnen/leben“; „bei ihnen wohnen“ ist natürlich und wahrt die gemeinschaftliche Aussage von עִמָּם.
