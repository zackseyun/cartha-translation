source:
  edition: WLC
  text: לָ/נ֥וּס שָׁ֨מָּ/ה֙ רוֹצֵ֔חַ מַכֵּה נֶ֥פֶשׁ בִּ/שְׁגָגָ֖ה בִּ/בְלִי דָ֑עַת וְ/הָי֤וּ לָ/כֶם֙ לְ/מִקְלָ֔ט מִ/גֹּאֵ֖ל הַ/דָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/003.yaml
  text: so that a manslayer who strikes down a person unintentionally[a], without knowledge, may flee there[b], and they shall be for you a refuge from the avenger of blood.
translation:
  language: de
  text: damit dorthin fliehen kann, wer einen Menschen unabsichtlich und ohne es zu wissen getötet hat. Sie sollen euch als Zuflucht vor dem Bluträcher[a] dienen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der »Bluträcher« war im damaligen israelitischen Sippenrecht ein naher Angehöriger, der die Tötung eines Verwandten zu ahnden hatte.
    reason: cultural_note
lexical_decisions:
- source_word: לָנוּס שָׁמָּה
  choice: dorthin fliehen kann
  rationale: Der Infinitiv mit לְ bezeichnet im Zusammenhang den Zweck der zuvor angeordneten Bestimmung der Städte. „Dorthin“ gibt die Richtungsbedeutung von שָׁמָּה natürlich wieder.
- source_word: רוֹצֵחַ
  choice: Totschläger
  rationale: Im rechtlichen Zusammenhang bezeichnet das Wort hier jemanden, der einen Menschen getötet hat; die anschließenden Bestimmungen schließen vorsätzliches Morden aus. „Totschläger“ vermeidet daher das irreführende „Mörder“.
- source_word: מַכֵּה נֶפֶשׁ
  choice: der einen Menschen … getötet hat
  rationale: Die Wendung bedeutet wörtlich etwa „der eine Person schlägt“, bezeichnet hier aber eindeutig die Verursachung eines Todes. Die deutsche Wiedergabe macht den tödlichen Ausgang klar.
- source_word: בִּשְׁגָגָה בִּבְלִי דָעַת
  choice: unabsichtlich, ohne es zu wissen
  rationale: Die beiden Ausdrücke kennzeichnen die Tötung als nicht vorsätzlich und ohne Wissen beziehungsweise Bewusstsein der tödlichen Umstände. Die getrennte Wiedergabe bewahrt ihre gegenseitige Verstärkung.
- source_word: וְהָיוּ לָכֶם לְמִקְלָט
  choice: Sie sollen euch als Zuflucht … dienen
  rationale: Das pluralische Verb bezieht sich auf die zuvor genannten Städte. Diese Formulierung ist natürliches modernes Deutsch und bewahrt die Zweckbestimmung.
- source_word: מִגֹּאֵל הַדָּם
  choice: vor dem Bluträcher
  rationale: Der Ausdruck bezeichnet im israelitischen Sippenrecht denjenigen, der für die Ahndung einer Tötung eintrat. „Bluträcher“ ist die knappe, etablierte deutsche Entsprechung.
theological_decisions:
- issue: Rechtliche Einordnung des Tötenden
  choice: Der Vers beschreibt jemanden, der unabsichtlich einen Menschen getötet hat, nicht einen vorsätzlichen Mörder.
  alternative: Das allgemeinere „Töter“ könnte die rechtliche Einordnung offener lassen.
  rationale: Die ausdrücklichen Bestimmungen בִּשְׁגָגָה und בִּבְלִי דָעַת schließen Vorsatz in dem hier beschriebenen Fall aus. Deshalb wird „Mörder“ vermieden, ohne die Tatsache der Tötung abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der rechtliche Charakter bleibt erkennbar, ohne altertümliche Syntax. „Totschläger“ ist hier nicht im engen Sinn heutiger deutscher Straftatbestände zu verstehen, sondern wird durch „unabsichtlich, ohne es zu wissen“ näher bestimmt.
