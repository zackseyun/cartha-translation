source:
  edition: WLC
  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר תְּנ֤וּ לָ/כֶם֙ אֶת עָרֵ֣י הַ/מִּקְלָ֔ט אֲשֶׁר דִּבַּ֥רְתִּי אֲלֵי/כֶ֖ם בְּ/יַד מֹשֶֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/002.yaml
  text: Speak to the sons of Israel[a], saying, ‘Appoint for yourselves the cities of refuge, about which I spoke to you through Moses,’
translation:
  language: de
  text: 'Rede zu den Israeliten und sag: »Bestimmt für euch die Zufluchtsstädte, über die ich durch Mose[a] zu euch gesprochen habe.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »durch die Hand Moses«; eine hebräische Wendung für die Vermittlung durch Mose.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Rede
  rationale: Der Piel-Imperativ richtet einen unmittelbaren Sprechbefehl an Josua; „Rede“ gibt ihn knapp und würdig wieder.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die hebräische Wendung bedeutet wörtlich „die Söhne Israels“, bezeichnet hier aber konventionell das ganze Volk. „Die Israeliten“ ist im modernen Deutschen natürlich und schließt die angesprochene Gemeinschaft ein.
- source_word: לֵאמֹר
  choice: und sag
  rationale: Der quotative Infinitiv leitet die folgende direkte Rede ein. „Und sag“ entspricht natürlichem modernem Deutsch besser als das substantivische „indem du sprichst“.
- source_word: תְּנוּ לָכֶם
  choice: Bestimmt für euch
  rationale: נתן heißt grundsätzlich „geben“, hat hier im administrativen Zusammenhang jedoch den Sinn, Städte für einen bestimmten Zweck festzulegen beziehungsweise zu bestimmen.
- source_word: עָרֵי הַמִּקְלָט
  choice: die Zufluchtsstädte
  rationale: „Zufluchtsstädte“ ist die etablierte und präzise deutsche Bezeichnung für die rechtlich vorgesehenen Schutzorte.
- source_word: אֲשֶׁר דִּבַּרְתִּי אֲלֵיכֶם
  choice: von denen ich zu euch … gesprochen habe
  rationale: Die Wiedergabe erhält das Verb „sprechen“ und macht den Bezug auf die Städte im Deutschen mit „von denen“ ausdrücklich und idiomatisch.
- source_word: בְּיַד מֹשֶׁה
  choice: durch Mose
  rationale: Die hebräische Wendung „durch die Hand Moses“ bezeichnet vermittelte Urheberschaft. „Durch Mose“ gibt ihren Sinn in natürlichem Deutsch wieder; die wörtliche Form steht in der Fußnote.
theological_decisions:
- issue: Korporative Bezeichnung בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: Die maskuline familiäre Form ist eine konventionelle hebräische Volksbezeichnung und meint in diesem Zusammenhang die gesamte Bundesgemeinschaft. Die moderne ethnische Bezeichnung vermeidet den irreführenden Eindruck, nur männliche Personen seien angesprochen.
- issue: Vermittelte Rede Gottes in בְּיַד מֹשֶׁה
  choice: durch Mose
  alternative: durch die Hand Moses
  rationale: Die idiomatische Wiedergabe bewahrt Mose als Vermittler der zuvor ergangenen göttlichen Weisung, ohne die hebräische Körpermetapher unnatürlich ins Deutsche zu übertragen.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Ton. Die direkte Rede bleibt knapp; „Zufluchtsstädte“ wahrt den etablierten rechtlich-theologischen Begriff. Der Fußnotenmarker steht unmittelbar bei der Wendung, die erläutert wird.
