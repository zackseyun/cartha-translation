  text: וּ/מֵ/עֵ֜בֶר לְ/יַרְדֵּ֤ן יְרִיחוֹ֙ מִזְרָ֔חָ/ה נָתְנ֞וּ אֶת בֶּ֧צֶר בַּ/מִּדְבָּ֛ר בַּ/מִּישֹׁ֖ר מִ/מַּטֵּ֣ה רְאוּבֵ֑ן וְ/אֶת רָאמֹ֤ת בַּ/גִּלְעָד֙ מִ/מַּטֵּה גָ֔ד וְ/אֶת גלון בַּ/בָּשָׁ֖ן מִ/מַּטֵּ֥ה מְנַשֶּֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/008.yaml
  text: And beyond the Jordan east of Jericho[a], they designated Bezer in the wilderness on the plateau from the tribe of Reuben, and Ramoth in Gilead from the tribe of Gad, and Golan in Bashan from the tribe of Manasseh.
translation:
  language: de
  text: Und jenseits des Jordan, östlich von Jericho, bestimmten sie Bezer in der Steppe auf der Hochebene im Stammesgebiet Rubens, Ramot in Gilead[a] im Stammesgebiet Gads und Golan im Baschan im Stammesgebiet Manasses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionell auch als zusammengesetzter Ortsname „Ramot-Gilead“ wiedergegeben. Im Hebräischen steht wörtlich „Ramot in Gilead“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵעֵבֶר לְיַרְדֵּן יְרִיחוֹ מִזְרָחָה
  choice: Und jenseits des Jordan, östlich von Jericho
  rationale: Die räumliche Angabe bezeichnet das Gebiet auf der Ostseite des Jordan gegenüber dem westlichen Kernland; die Richtungsform מִזְרָחָה wird natürlich als „östlich von Jericho“ wiedergegeben.
- source_word: נָתְנוּ
  choice: bestimmten sie
  rationale: Im Zusammenhang der Zufluchtsstädte bezeichnet das Verb die offizielle Festlegung dieser Orte, nicht lediglich ein Geben.
- source_word: בֶּצֶר
  choice: Bezer
  rationale: Der Ortsname wird in gebräuchlicher deutscher Form transliteriert.
- source_word: בַּמִּדְבָּר
  choice: in der Steppe
  rationale: מִדְבָּר bezeichnet hier das trockene, dünn besiedelte Weideland östlich des Jordan; „Steppe“ vermittelt diese Landschaft im modernen Deutschen genauer als „Wüste“.
- source_word: בַּמִּישֹׁר
  choice: auf der Hochebene
  rationale: מִישׁוֹר bezeichnet die ebene Tafellandschaft östlich des Jordan; „Hochebene“ ist topografisch klar und allgemein verständlich.
- source_word: מִמַּטֵּה רְאוּבֵן
  choice: aus dem Stamm Ruben
  rationale: Die Formulierung kennzeichnet die Stammeszugehörigkeit beziehungsweise das Stammesgebiet und bewahrt die knappe hebräische Konstruktion.
- source_word: רָאמֹת בַּגִּלְעָד
  choice: Ramot in Gilead
  rationale: Die Wiedergabe folgt unmittelbar der hebräischen Form aus Ortsname und Gebietsangabe, ohne sie stillschweigend zu einem zusammengesetzten Namen zu machen.
- source_word: מִמַּטֵּה גָד
  choice: aus dem Stamm Gad
  rationale: Die Stammesformel wird parallel zu Ruben wiedergegeben.
- source_word: גלון
  choice: Golan
  rationale: Die Konsonantenform entspricht dem bekannten Ortsnamen Golan; verwendet wird die etablierte deutsche Schreibung.
- source_word: בַּבָּשָׁן
  choice: im Baschan
  rationale: Der Regionsname wird in der im Deutschen üblichen Form mit verschmolzenem Artikel wiedergegeben.
- source_word: מִמַּטֵּה מְנַשֶּׁה
  choice: aus dem Stamm Manasse
  rationale: Die Stammesformel wird konsistent mit Ruben und Gad übersetzt.
