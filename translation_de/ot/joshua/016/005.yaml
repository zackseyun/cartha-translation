base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/005.yaml
  text: 'And the territory of the sons of Ephraim by their clans was as follows: the border of their inheritance on the east was Ataroth-addar[a], as far as Upper Beth-horon.'
translation:
  language: de
  text: 'Das Gebiet der Söhne Ephraims nach ihren Sippen war folgendermaßen: Die Ostgrenze ihres Erbbesitzes verlief von Atarot-Addar bis zum oberen Bet-Horon.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Grenze ihres Erbbesitzes ostwärts war Atarot-Addar bis zum oberen Bet-Horon.“ Die hebräische Wortstellung lässt eine leicht abweichende Gliederung zu, ohne den geografischen Sinn zu verändern.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּבוּל
  choice: Gebiet / Grenze
  rationale: Das Wort bezeichnet beim ersten Vorkommen das Stammesgebiet insgesamt, beim zweiten die konkrete Grenzlinie; die kontextgerechte Variation bildet beide Bedeutungsnuancen natürlich ab.
- source_word: בְּנֵי אֶפְרַיִם
  choice: die Söhne Ephraims
  rationale: Die Wiedergabe bewahrt die hebräische Abstammungsformel und den genealogischen Rahmen der Stammeszuweisung.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחָה bezeichnet hier die Untergliederungen des Stammes; »Sippen« ist im historischen Kontext präzise und verständlich.
- source_word: נַחֲלָתָם
  choice: ihres Erbbesitzes
  rationale: »Erbbesitz« bewahrt sowohl den Gedanken des zugeteilten Landes als auch den Erbcharakter von נַחֲלָה.
- source_word: מִזְרָחָה
  choice: im Osten
  rationale: Die Richtungsform kennzeichnet hier die Ostseite beziehungsweise den östlichen Ausgangspunkt der Grenzbeschreibung.
- source_word: עַטְרוֹת אַדָּר
  choice: Atarot-Addar
  rationale: Der Ortsname wird nach gängiger deutscher Transkription wiedergegeben; der Bindestrich macht den zusammengesetzten Namen erkennbar.
- source_word: עַד
  choice: bis
  rationale: In der Grenzbeschreibung bezeichnet עַד den Endpunkt der genannten Strecke.
- source_word: בֵּית חוֹרֹן עֶלְיוֹן
  choice: das obere Bet-Horon
  rationale: עֶלְיוֹן unterscheidet den Ort vom unteren Bet-Horon; die deutsche Wortstellung ist natürlich und eindeutig.
