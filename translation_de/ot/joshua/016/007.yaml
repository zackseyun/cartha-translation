  register: Moderne, würdige Standardsprache. Die Ergänzung »die Grenze« macht das im Abschnitt vorausgesetzte Subjekt verständlich. Ortsnamen bleiben transliteriert; echte lexikalische Spielräume werden in den Fußnoten bewahrt.
