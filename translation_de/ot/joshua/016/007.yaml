  text: וְ/יָרַ֥ד מִ/יָּנ֖וֹחָ/ה עֲטָר֣וֹת וְ/נַעֲרָ֑תָ/ה וּ/פָגַע֙ בִּֽ/ירִיח֔וֹ וְ/יָצָ֖א הַ/יַּרְדֵּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/007.yaml
  text: Then it went down from Janoah to Ataroth and Naarah[a], and reached Jericho[c][b], and ended at the Jordan.
translation:
  language: de
  text: Dann verlief die Grenze von Janoach hinab nach Atarot und Naarah[a], berührte Jericho[b] und verlief weiter zum Jordan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch Naarah; möglicherweise ist derselbe Ort gemeint, dessen Name auch Naarat geschrieben wird.
    reason: alternative_reading
  - marker: b
    text: 'Oder: erreichte Jericho. Das hebräische Verb kann bezeichnen, dass eine Grenzlinie einen Ort erreicht oder berührt.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: endete am Jordan. Die hebräische Grenzformel kann den Verlauf oder den Endpunkt der Grenze beschreiben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַד מִיָּנוֹחָה
  choice: Dann verlief die Grenze von Janoach hinab
  rationale: In der Grenzbeschreibung bezeichnet ירד den abwärts führenden Verlauf. Das im Kontext vorausgesetzte Subjekt »Grenze« wird zur Klarheit ergänzt; »verlief … hinab« klingt im Deutschen natürlich und bewahrt die geografische Bewegung.
- source_word: עֲטָרוֹת
  choice: Atarot
  rationale: Der Ortsname wird nach einer im Deutschen gut nachvollziehbaren Transliteration wiedergegeben und nicht übersetzt.
- source_word: וְנַעֲרָתָה
  choice: und Naarah
  rationale: Der masoretisch punktierten Form entsprechend steht Naarah im Haupttext; die mögliche Beziehung zur Namensform Naarat wird in einer Fußnote offengehalten.
- source_word: וּפָגַע בִּירִיחוֹ
  choice: berührte Jericho
  rationale: פגע kann in Grenzbeschreibungen das Zusammentreffen oder Berühren einer Örtlichkeit bezeichnen. »berührte« wahrt den räumlichen Sinn, ohne genauer festzulegen, ob Stadt oder Gebiet gemeint ist.
- source_word: וְיָצָא הַיַּרְדֵּן
  choice: und führte hinaus zum Jordan
  rationale: יצא beschreibt in Grenzformeln den weiteren Verlauf bis zu einem Ausgangs- oder Endpunkt. »führte hinaus zum Jordan« hält die bildhafte Grenzbewegung fest, statt sie eindeutig als bloßes Enden auszulegen.
- source_word: הַיַּרְדֵּן
  choice: der Jordan
  rationale: Übliche deutsche Bezeichnung des Flusses; ein Zusatz wie »Fluss« ist im Zusammenhang nicht erforderlich.
theological_decisions: []
