source:
  edition: WLC
  text: וְ/לֹ֣א הוֹרִ֔ישׁוּ אֶת הַֽ/כְּנַעֲנִ֖י הַ/יּוֹשֵׁ֣ב בְּ/גָ֑זֶר וַ/יֵּ֨שֶׁב הַֽ/כְּנַעֲנִ֜י בְּ/קֶ֤רֶב אֶפְרַ֨יִם֙ עַד הַ/יּ֣וֹם הַ/זֶּ֔ה וַ/יְהִ֖י לְ/מַס עֹבֵֽד־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/010.yaml
  text: But they did not drive out the Canaanites who lived in Gezer, so the Canaanites have lived in the midst of Ephraim to this day and became forced laborers.
translation:
  language: de
  text: Doch sie vertrieben die Kanaaniter nicht, die in Geser wohnten, und die Kanaaniter wohnen bis zum heutigen Tag mitten unter Ephraim und wurden zu Fronarbeitern.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹרִישׁוּ
  choice: vertrieben
  rationale: Das Hifil von ירש bezeichnet hier das Vertreiben beziehungsweise Verdrängen der bisherigen Bewohner aus ihrem Besitzgebiet.
- source_word: בְּקֶרֶב אֶפְרַיִם
  choice: mitten unter Ephraim
  rationale: Gibt die räumlich-soziale Bedeutung von בְּקֶרֶב wieder; »Ephraim« bezeichnet hier das Stammesgebiet beziehungsweise die Stammesgemeinschaft.
- source_word: לְמַס עֹבֵד
  choice: zu Fronarbeitern
  rationale: מַס bezeichnet auferlegte Fron- oder Zwangsarbeit; עֹבֵד verdeutlicht, dass tatsächlich Arbeitsdienst geleistet wurde.
theological_decisions:
- issue: Verknüpfung der beiden Hauptaussagen
  choice: Zwei Sätze mit »So«
  alternative: Koordination mit »und« oder »aber«
  rationale: Das narrative וַיֵּשֶׁב beschreibt die Folge des Nichtvertreibens. »So« macht diesen Zusammenhang natürlich verständlich, ohne eine weitergehende theologische Begründung einzutragen.
- issue: Zeitwert von וַיְהִי
  choice: wurden
  alternative: sind geworden / waren
  rationale: Die Wayyiqtol-Form wird als vergangenes Eintreten eines Zustands wiedergegeben. Der vorausgehende Ausdruck »bis zum heutigen Tag« bezieht sich unmittelbar auf das Wohnen und zwingt nicht dazu, auch die Fronarbeit ausdrücklich als bis in die Gegenwart fortdauernd zu markieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt klar und nah am hebräischen Erzählfluss; »Fronarbeiter« ist präzise und allgemein verständlich.
