  register: Modernes, würdevolles Standarddeutsch. »Nachkommen« gibt die tribal verwendete Wendung »Söhne von« verständlich wieder; der Gedankenstrich bildet den zusammenfassenden Nachtrag des hebräischen Satzes ab.
