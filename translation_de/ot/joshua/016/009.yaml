base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/009.yaml
  text: And the cities set apart for the sons of Ephraim within the inheritance of the sons of Manasseh—all the cities and their villages[a].
translation:
  language: de
  text: Dazu kamen die Städte, die für die Nachkommen Ephraims innerhalb des Erbbesitzes der Nachkommen Manasses ausgesondert waren – alle Städte und ihre Dörfer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die für die Nachkommen Ephraims abgetrennten Städte«. Das hebräische Partizip hebt hervor, dass diese Städte innerhalb des Gebiets Manasses für Ephraim ausgesondert waren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָרִים
  choice: die Städte
  rationale: עִיר bezeichnet eine Stadt oder Ortschaft; »Städte« entspricht dem Sprachgebrauch der Gebietslisten in Josua.
- source_word: הַמִּבְדָּלוֹת
  choice: die … ausgesondert waren
  rationale: Das Partizip von בדל bezeichnet Absonderung beziehungsweise Abgrenzung. Die Formulierung bewahrt den Gedanken, dass diese Städte innerhalb Manasses Gebiet eigens Ephraim zugeordnet waren.
- source_word: לִבְנֵי אֶפְרַיִם
  choice: für die Nachkommen Ephraims
  rationale: בני ist wörtlich »Söhne von«, dient hier aber als Stammesbezeichnung. »Nachkommen« ist im modernen Deutschen natürlich und schließt den gesamten Stamm ein.
- source_word: בְּתוֹךְ
  choice: innerhalb
  rationale: »Innerhalb« gibt die räumliche Lage im Erbbesitz eines anderen Stammes präzise und idiomatisch wieder.
- source_word: נַחֲלַת
  choice: des Erbbesitzes
  rationale: נחלה bezeichnet in Josua das durch Zuteilung empfangene Land. »Erbbesitz« bewahrt sowohl den territorialen als auch den erbrechtlichen Sinn.
- source_word: בְּנֵי מְנַשֶּׁה
  choice: der Nachkommen Manasses
  rationale: Wie bei Ephraim bezeichnet בני hier den gesamten Stamm; »Nachkommen« ist eine sachgerechte moderne Wiedergabe.
- source_word: כָּל הֶעָרִים
  choice: alle diese Städte
  rationale: Die Wendung fasst die zuvor genannten beziehungsweise ausgesonderten Städte zusammen; »diese« macht den Rückbezug im Deutschen klar.
- source_word: וְחַצְרֵיהֶן
  choice: mit ihren Dörfern
  rationale: חצר bezeichnet in Gebietslisten meist zugehörige, häufig unbefestigte kleinere Siedlungen. Das koordinierende ו wird idiomatisch als »mit« wiedergegeben, um die Zugehörigkeit auszudrücken.
theological_decisions: []
