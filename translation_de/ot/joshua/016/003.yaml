- from: Dann verlief die Grenze abwärts nach Westen zum Gebiet der Jafletiter, weiter bis zur Grenze von Unter-Bet-Horon und bis nach Geser; ihre Endpunkte lagen am Meer.
  to: Dann verlief sie westwärts hinab zur Grenze der Jafletiter, weiter bis zur Grenze von Unter-Bet-Horon und bis Geser; ihre Endpunkte lagen am Meer.
  rationale: Die Ergänzung „sie“ nimmt eindeutig auf die zuvor beschriebene Grenze Bezug. Die Änderung von „Gebiet“ zu „Grenze“ stellt die Parallelität der Grenzformeln wieder her und folgt dem hebräischen גְּבוּל genauer. „Endpunkte“ bleibt als verständliche Wiedergabe der technischen Formel תֹצְאֹתָיו erhalten.
