  text: וְ/יָֽרַד יָ֜מָּ/ה אֶל גְּב֣וּל הַ/יַּפְלֵטִ֗י עַ֣ד גְּב֧וּל בֵּית חוֹרֹ֛ן תַּחְתּ֖וֹן וְ/עַד גָּ֑זֶר וְ/הָי֥וּ תצאת/ו יָֽמָּ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/003.yaml
  text: Then it went down westward to the border of the Japhletites[a], as far as the border of Lower Beth-horon, and as far as Gezer; and its goings out were at the sea.
translation:
  language: de
  text: Dann verlief sie westwärts hinab zur Grenze der Jafletiter, weiter bis zur Grenze von Unter-Bet-Horon und bis Geser; ihre Endpunkte lagen am Meer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָרַד
  choice: Dann verlief die Grenze abwärts
  rationale: Das Verb ירד bezeichnet in Grenzbeschreibungen eine abwärts gerichtete Bewegung. Das im Hebräischen nicht ausdrücklich genannte Subjekt wird im Deutschen als »die Grenze« ergänzt, um den Bezug natürlich und eindeutig auszudrücken.
- source_word: יָמָּה
  choice: nach Westen
  rationale: Die Richtungsform von יָם bedeutet in geografischen Beschreibungen häufig »westwärts«, da das Mittelmeer westlich liegt.
- source_word: אֶל גְּבוּל הַיַּפְלֵטִי
  choice: zum Gebiet der Jafletiter
  rationale: גְּבוּל kann sowohl die Grenzlinie als auch das abgegrenzte Gebiet bezeichnen. Bei der gentilizischen Bezeichnung הַיַּפְלֵטִי ist »Gebiet der Jafletiter« im Deutschen natürlicher als »Grenze der Jafletiter«.
- source_word: עַד גְּבוּל בֵּית חוֹרֹן תַּחְתּוֹן
  choice: weiter bis zur Grenze von Unter-Bet-Horon
  rationale: עַד bezeichnet die räumliche Ausdehnung bis zu einem Punkt. תַּחְתּוֹן unterscheidet den unteren Ort vom oberen Bet-Horon.
- source_word: וְעַד גָּזֶר
  choice: und bis nach Geser
  rationale: Die wiederholte Präposition עַד führt die Grenzbeschreibung bis Geser fort.
- source_word: וְהָיוּ תצאתו
  choice: ihre Endpunkte lagen
  rationale: Die masoretische Lesung תֹצְאֹתָיו ist eine technische Grenzformel für die Ausläufer oder Endpunkte einer Grenze. »Endpunkte« vermittelt diesen Sinn verständlich, ohne das im Deutschen missverständliche wörtliche »Ausgänge« zu verwenden.
- source_word: יָמָּה
  choice: am Meer
  rationale: In der Schlussformel bezeichnet יָמָּה hier am besten den konkreten Endpunkt am Meer und nicht nur die Richtung Westen.
theological_decisions: []
