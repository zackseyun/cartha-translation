base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/004.yaml
  text: And the sons of Joseph[a], Manasseh and Ephraim, received their inheritance.
translation:
  language: de
  text: Und die Söhne Josefs, Manasse und Ephraim, erhielten ihr Erbteil.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nahmen ihr Erbteil in Besitz“ oder „erbten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנְחֲלוּ
  choice: erhielten ihr Erbteil
  rationale: Das Qal-Verb נחל bezeichnet hier im Zusammenhang der Landzuteilung, dass Manasse und Ephraim das ihnen als Erbbesitz zugewiesene Land erhielten. Die Ergänzung des im Hebräischen nicht ausdrücklich genannten Objekts ergibt im Deutschen einen vollständigen, natürlichen Satz.
- source_word: בְנֵי יוֹסֵף
  choice: die Söhne Josefs
  rationale: Die wörtliche genealogische Wendung bleibt erhalten; im Kontext bezeichnet sie die aus Josef hervorgegangenen Stämme Manasse und Ephraim.
- source_word: מְנַשֶּׁה
  choice: Manasse
  rationale: Gebräuchliche deutsche Form des Personen- und Stammesnamens.
- source_word: וְאֶפְרָיִם
  choice: und Ephraim
  rationale: Gebräuchliche deutsche Namensform; die hebräische Konjunktion wird unmittelbar wiedergegeben.
- source_word: וַ
  choice: Und
  rationale: Das Waw führt die Erzählung fort und wird in einem würdigen deutschen Erzählregister mit „Und“ wiedergegeben.
