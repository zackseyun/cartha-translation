  text: מִ/תַּפּ֜וּחַ יֵלֵ֨ךְ הַ/גְּב֥וּל יָ֨מָּ/ה֙ נַ֣חַל קָנָ֔ה וְ/הָי֥וּ תֹצְאֹתָ֖י/ו הַ/יָּ֑מָּ/ה זֹ֗את נַחֲלַ֛ת מַטֵּ֥ה בְנֵי אֶפְרַ֖יִם לְ/מִשְׁפְּחֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/008.yaml
  text: From Tappuah the border goes westward to the Brook of Kanah[a], and its end was at the sea[c][b]. This is the inheritance of the tribe of the sons of Ephraim according to their families.
translation:
  language: de
  text: Von Tappuach verläuft die Grenze westwärts[a] zum Bach Kana[b], und ihre Endpunkte liegen am Meer. Das ist der Erbbesitz des Stammes der Söhne Ephraims[c] nach ihren Sippen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „meerwärts“; in Grenzbeschreibungen bezeichnet das hebräische Wort gewöhnlich die Richtung nach Westen.
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann auch ein Bachtal oder ein nur zeitweise wasserführendes Wadi bezeichnen.
    reason: lexical_alternative
  - marker: c
    text: „Söhne Ephraims“ ist eine übliche hebräische Bezeichnung für den Stamm beziehungsweise die Nachkommen Ephraims.
    reason: lexical_clarification
lexical_decisions:
- source_word: מִתַּפּוּחַ
  choice: Von Tappuach
  rationale: Die Präposition מִן kennzeichnet den Ausgangspunkt der Grenzbeschreibung; der Ortsname wird in einer im Deutschen üblichen, hebräisch nahen Form wiedergegeben.
- source_word: יֵלֵךְ הַגְּבוּל
  choice: verläuft die Grenze
  rationale: הלך bezeichnet zusammen mit גְּבוּל den Verlauf einer Grenzlinie. „Verläuft“ ist im modernen Deutschen natürlich und sachlich präzise.
- source_word: יָמָּה
  choice: westwärts
  rationale: Die Richtungsform zu יָם bedeutet wörtlich „meerwärts“, bezeichnet in solchen Grenzbeschreibungen aber gewöhnlich die Richtung nach Westen.
- source_word: נַחַל קָנָה
  choice: zum Bach Kana
  rationale: נַחַל kann einen Bach, ein Bachtal oder ein zeitweise trockenes Wadi bezeichnen. „Bach“ ist allgemein verständlich; die geografische Bedeutungsbreite wird in einer Fußnote bewahrt.
- source_word: וְהָיוּ תֹצְאֹתָיו הַיָּמָּה
  choice: und ihr Endpunkt liegt am Meer
  rationale: תֹצְאוֹת bezeichnet in Grenzformeln den Ausgang beziehungsweise Endpunkt einer Grenzlinie. Die im Hebräischen pluralische Form wird idiomatisch als ein am Meer liegender Endpunkt wiedergegeben.
- source_word: זֹאת נַחֲלַת
  choice: Das ist der Erbbesitz
  rationale: Die Formulierung fasst das zugeteilte Stammesgebiet zusammen. „Erbbesitz“ gibt נַחֲלָה im Landverteilungskontext prägnant wieder.
- source_word: מַטֵּה בְנֵי אֶפְרַיִם
  choice: des Stammes der Söhne Ephraims
  rationale: מַטֶּה bezeichnet hier den Stamm; בְנֵי אֶפְרַיִם lautet ausdrücklich „Söhne Ephraims“ und dient als feste Bezeichnung seiner Stammesnachkommen.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחוֹת bezeichnet im Stammeszusammenhang die einzelnen Sippen oder Familienverbände. „Sippen“ macht diese gesellschaftliche Gliederung klar.
theological_decisions:
- issue: Geschlechtsspezifische Stammesbezeichnung בְנֵי אֶפְרַיִם
  choice: Söhne Ephraims
  alternative: Nachkommen Ephraims
  rationale: Die ausdrücklich maskuline, zugleich kollektiv verwendete hebräische Stammesbezeichnung wird bewahrt. Die Fußnote erklärt ihre Funktion, ohne sie im Haupttext zu neutralisieren.
- issue: Bedeutung von נַחֲלָה im Landverteilungskontext
  choice: Erbbesitz
  alternative: Erbteil
  rationale: „Erbbesitz“ bezeichnet das dauerhaft zugeteilte Stammesgebiet, ohne weitergehende konfessionelle oder systematisch-theologische Deutungen einzutragen.
translation_notes:
  register: Moderne, sachliche und würdige Sprache einer territorialen Grenzbeschreibung. „Verläuft“ und „Endpunkt“ sorgen für natürliches Deutsch; „Erbbesitz“, „Stamm“ und „Sippen“ bewahren den historischen Stammeskontext. Sämtliche Fußnotenmarker stehen unmittelbar bei der erläuterten Formulierung.
