  yaml_path: translation/ot/joshua/016/002.yaml
  text: Then it went out from Bethel to Luz[a], and passed on to the border of the Arkites at Ataroth.
translation:
  language: de
  text: Dann verlief sie von Bethel nach Lus und weiter zur Grenze der Arkiter, nach Atarot[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Architer«; eine andere Umschrift von הָאַרְכִּי.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: Dann verlief sie
  rationale: Das unausgesprochene Subjekt ist die im Zusammenhang beschriebene Grenze. Das feminine Pronomen nimmt im Deutschen »Grenze« auf; »verlief« entspricht einer Grenzbeschreibung natürlich.
- source_word: מִבֵּית אֵל
  choice: von Bethel
  rationale: Bethel ist die im Deutschen übliche Wiedergabe des Ortsnamens בֵּית אֵל.
- source_word: לוּזָה
  choice: nach Lus
  rationale: Das direktionale He bezeichnet die Bewegung auf Lus zu; »nach Lus« gibt dies knapp und idiomatisch wieder.
- source_word: וְעָבַר
  choice: und führte weiter
  rationale: In einer Grenzbeschreibung bezeichnet עבר den weiteren Verlauf; diese Wiedergabe vermeidet die möglicherweise irreführende Vorstellung eines ausdrücklich genannten Überschreitens.
- source_word: אֶל גְּבוּל
  choice: bis zur Grenze
  rationale: גְּבוּל bezeichnet hier die Grenze beziehungsweise das Grenzgebiet. »Bis zur Grenze« passt zum Verlauf der beschriebenen Grenzlinie.
- source_word: הָאַרְכִּי
  choice: der Arkiter
  rationale: Das Gentiliz bezeichnet die Arkiter als Bevölkerungsgruppe. Die Form mit k gibt den hebräischen Konsonanten כּ in moderner deutscher Umschrift verständlich wieder.
- source_word: עֲטָרוֹת
  choice: Atarot
  rationale: Nahe Umschrift des hebräischen Ortsnamens; die Endung wird nicht unnötig anglisiert.
theological_decisions: []
translation_notes:
  register: Moderne, sachliche und würdige Standardsprache. Das feminine »sie« knüpft an die Grenze aus dem vorausgehenden Zusammenhang an. Die knappe Reiseroutenstruktur des Hebräischen bleibt erhalten.
