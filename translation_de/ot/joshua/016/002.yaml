revisions:
- from: Dann verlief sie von Bethel nach Lus und führte weiter bis zur Grenze der Arkiter[a] bei Atarot.
  to: Dann verlief sie von Bethel nach Lus und weiter zur Grenze der Arkiter, nach Atarot[a].
  rationale: Die Revision behält das feminine, aus dem Kontext erschlossene Subjekt („die Grenze“) sowie die Ortsnamen bei. „Und weiter“ gibt den Fortschritt von וְעָבַר in einer Grenzbeschreibung idiomatisch wieder, ohne der Grenze eine aktiv leitende Funktion zuzuschreiben. Die Schlussstellung „nach Atarot“ bildet die knappe hebräische Ortsreihung und die Zugehörigkeit von עֲטָרוֹת zum Grenzverlauf klar ab.
