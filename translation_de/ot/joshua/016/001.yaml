  text: וַ/יֵּצֵ֨א הַ/גּוֹרָ֜ל לִ/בְנֵ֤י יוֹסֵף֙ מִ/יַּרְדֵּ֣ן יְרִיח֔וֹ לְ/מֵ֥י יְרִיח֖וֹ מִזְרָ֑חָ/ה הַ/מִּדְבָּ֗ר עֹלֶ֧ה מִ/ירִיח֛וֹ בָּ/הָ֖ר בֵּֽית אֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/001.yaml
  text: And the lot came out for the sons of Joseph from the Jordan at Jericho[a], to the waters of Jericho on the east, through the wilderness[b], going up from Jericho into the hill country of Bethel.
translation:
  language: de
  text: Das Los für die Nachkommen Josefs[a] fiel vom Jordan bei Jericho bis zu den Wassern Jerichos im Osten und verlief durch die Wüste, die von Jericho zum Bergland von Bethel hinaufsteigt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Das Los kam für die Söhne Josefs heraus.« In Beschreibungen der Landverteilung kann »das Los fiel« den durch das Los bestimmten Anteil bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא הַגּוֹרָל
  choice: Das durch Los zugeteilte Gebiet … begann
  rationale: Wörtlich heißt die Wendung etwa »das Los kam heraus«. Im Zusammenhang der Landverteilung bezeichnet גּוֹרָל zugleich das durch Los bestimmte Gebiet. Die Wiedergabe macht den geografischen Verlauf im Deutschen verständlich, ohne das Losverfahren auszulassen.
- source_word: לִבְנֵי יוֹסֵף
  choice: der Nachkommen Josefs
  rationale: בְּנֵי bedeutet wörtlich »Söhne«, bezeichnet hier jedoch die aus Josef hervorgegangenen Stämme. »Nachkommen« gibt den korporativen Sinn in heutigem Deutsch natürlich wieder.
- source_word: מִיַּרְדֵּן יְרִיחוֹ
  choice: am Jordan bei Jericho
  rationale: Die Wortgruppe bezeichnet den Ausgangspunkt am Jordan in der Nähe beziehungsweise auf der Höhe von Jericho.
- source_word: לְמֵי יְרִיחוֹ
  choice: zu den Wassern Jerichos
  rationale: מֵי ist eine pluralische beziehungsweise kollektive Bezeichnung für Wasser oder Wasserstellen. Die formnahe Wiedergabe bewahrt die Möglichkeit, dass Jerichos Quelle oder Wasserversorgung gemeint ist.
- source_word: מִזְרָחָה
  choice: im Osten
  rationale: Das Richtungswort bezeichnet die östliche Lage beziehungsweise Ausrichtung, ohne genauer festzulegen, worauf sich die Angabe syntaktisch bezieht.
- source_word: הַמִּדְבָּר
  choice: durch die Wüste
  rationale: מִדְבָּר bezeichnet unbesiedeltes, trockenes Wildnis- oder Steppengebiet. »Wüste« ist in diesem geografischen Zusammenhang knapp und allgemein verständlich; »durch« verdeutlicht den Verlauf, der im Hebräischen elliptisch ausgedrückt ist.
- source_word: עֹלֶה מִירִיחוֹ
  choice: von Jericho stieg es … hinauf
  rationale: Das Partizip beschreibt die topografische Steigung vom tief gelegenen Jericho in das Bergland.
- source_word: בָּהָר בֵּית אֵל
  choice: ins Bergland von Bethel
  rationale: הָר kann hier eine Bergregion und nicht nur einen einzelnen Berg bezeichnen. Die Bewegungsrichtung ergibt sich aus »hinaufsteigen«.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die elliptische Grenzbeschreibung des Hebräischen wird durch »Gebiet«, »begann« und die wiederaufgenommene Verlaufsangabe verständlich gemacht. Die etwas ungewohnte Formulierung »Wasser Jerichos« bleibt erhalten, damit die genaue geografische Referenz nicht vorschnell auf eine einzelne Quelle eingeengt wird.
