  text: וְ/יָצָ֨א הַ/גְּב֜וּל הַ/יָּ֗מָּ/ה הַֽ/מִּכְמְתָת֙ מִ/צָּפ֔וֹן וְ/נָסַ֧ב הַ/גְּב֛וּל מִזְרָ֖חָ/ה תַּאֲנַ֣ת שִׁלֹ֑ה וְ/עָבַ֣ר אוֹת֔/וֹ מִ/מִּזְרַ֖ח יָנֽוֹחָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/006.yaml
  text: Then the border went out westward to Michmethath on the north[a], and the border turned eastward to Taanath-shiloh, and passed it on the east to Janoah.
translation:
  language: de
  text: Dann verlief die Grenze westwärts[a] bis Michmetat im Norden, und die Grenze wandte sich ostwärts nach Taanat-Schilo und führte östlich daran vorbei nach Janoach.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zum Meer hin“; im Hebräischen eine übliche Richtungsangabe für Westen.'
    reason: Die Fußnote bewahrt die konkrete hebräische Ausdrucksweise hinter der geografischen Übersetzung.
lexical_decisions:
- source_word: וְיָצָא
  choice: Dann verlief
  rationale: In Grenzbeschreibungen bezeichnet יָצָא den weiteren Verlauf einer Grenzlinie. „Verlief“ ist im Deutschen natürlicher als das wörtliche „ging hinaus“, während „Dann“ das fortführende וְ wiedergibt.
- source_word: הַגְּבוּל
  choice: die Grenze
  rationale: Gemeint ist hier die Grenzlinie des Stammesgebiets; „Grenze“ ist die klare und übliche deutsche Entsprechung.
- source_word: הַיָּמָּה
  choice: nach Westen
  rationale: Wörtlich bedeutet die hebräische Richtungsangabe „zum Meer hin“; in diesem geografischen Zusammenhang ist dies die übliche Bezeichnung für Westen. Die wörtliche Bildsprache wird in Fußnote [a] bewahrt.
- source_word: הַמִּכְמְתָת מִצָּפוֹן
  choice: nördlich davon lag Michmetat
  rationale: Die knappe topografische Formulierung setzt Michmetat zur Grenze beziehungsweise ihrem westlichen Verlauf in Beziehung. Diese Wiedergabe folgt der naheliegenden Lesart, dass Michmetat nördlich der Grenze lag, und weist in Fußnote [b] auf die mögliche alternative Zuordnung hin.
- source_word: וְנָסַב
  choice: Danach wandte sich
  rationale: נָסַב beschreibt bei Grenzlinien einen Richtungswechsel. „Wandte sich“ gibt dies in natürlichem, gehobenem Deutsch wieder.
- source_word: מִזְרָחָה
  choice: nach Osten
  rationale: Das Richtungs-he bezeichnet eine Bewegung nach Osten.
- source_word: תַּאֲנַת שִׁלֹה
  choice: Taanat-Schilo
  rationale: Der Ortsname wird in einer für deutsche Leser gut lesbaren, am Hebräischen orientierten Form wiedergegeben.
- source_word: וְעָבַר אוֹתוֹ מִמִּזְרַח
  choice: führte östlich daran vorbei
  rationale: עָבַר bezeichnet hier das Weiterführen der Grenzlinie an einem Ort vorbei; מִמִּזְרַח bestimmt ihre Lage östlich von Taanat-Schilo. „Daran“ bezieht sich eindeutig auf den Ort.
- source_word: יָנוֹחָה
  choice: weiter nach Janoach
  rationale: Die Richtungsform des Ortsnamens bezeichnet die Bewegung auf Janoach zu. „Weiter nach“ macht den fortlaufenden Grenzverlauf im Deutschen deutlich.
theological_decisions: []
