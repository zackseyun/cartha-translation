revisions:
- from: Als der König von Ai das sah, beeilten sich die Männer der Stadt, brachen früh auf und zogen aus, um Israel zum Kampf entgegenzutreten. Der König und sein ganzes Volk kamen an den festgesetzten Ort[a] vor der Araba[b]. Doch er wusste nicht, dass hinter der Stadt ein Hinterhalt gegen ihn lag.
  to: Als der König von Ai das sah, beeilten sie sich, standen früh auf, und die Männer der Stadt zogen aus, um Israel zum Kampf entgegenzutreten, er selbst und sein ganzes Volk, zu dem festgesetzten Ort[a] vor der Araba[b]. Doch er wusste nicht, dass hinter der Stadt ein Hinterhalt gegen ihn lag.
  rationale: Die Revision verbindet „er selbst und sein ganzes Volk“ wieder unmittelbar mit dem Auszug zum festgesetzten Ort und vermeidet dadurch die zusätzliche, im Ausgangstext nicht ausdrücklich behauptete Ankunftshandlung. Zugleich wird die Abfolge „beeilten sich – standen früh auf – zogen aus“ deutlicher abgebildet. Die Fußnoten bleiben unverändert, weil sie die vorhandenen lexikalischen Spielräume angemessen dokumentieren.
