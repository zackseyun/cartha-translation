  text: וַ/יְהִ֞י כִּ/רְא֣וֹת מֶֽלֶךְ הָ/עַ֗י וַֽ/יְמַהֲר֡וּ וַ/יַּשְׁכִּ֡ימוּ וַ/יֵּצְא֣וּ אַנְשֵֽׁי הָ/עִ֣יר לִ/קְרַֽאת יִ֠שְׂרָאֵל לַֽ/מִּלְחָמָ֞ה ה֧וּא וְ/כָל עַמּ֛/וֹ לַ/מּוֹעֵ֖ד לִ/פְנֵ֣י הָֽ/עֲרָבָ֑ה וְ/הוּא֙ לֹ֣א יָדַ֔ע כִּֽי אֹרֵ֥ב ל֖/וֹ מֵ/אַחֲרֵ֥י הָ/עִֽיר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/014.yaml
  text: And it happened[a], when the king of Ai saw it, that they hurried and rose early, and the men of the city went out to meet Israel for battle, he and all his people, at the appointed place before the Arabah. But he did not know that an ambush was against him behind the city.
translation:
  language: de
  text: Als der König von Ai das sah, beeilten sie sich, standen früh auf, und die Männer der Stadt zogen aus, um Israel zum Kampf entgegenzutreten, er selbst und sein ganzes Volk, zu dem festgesetzten Ort[a] vor der Araba[b]. Doch er wusste nicht, dass hinter der Stadt ein Hinterhalt gegen ihn lag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum festgesetzten Zeitpunkt“. Das hebräische Wort kann einen bestimmten Ort oder eine bestimmte Zeit bezeichnen.'
    reason: lexical_ambiguity
  - marker: b
    text: 'Oder: „vor der Ebene“. Der hebräische Ausdruck kann die Araba als Landschaftsregion oder allgemeiner eine trockene Ebene beziehungsweise Steppe bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: Als … das sah
  rationale: Die Konstruktion leitet den zeitlichen Umstand des folgenden Geschehens ein. Das im Hebräischen unausgesprochene Objekt wird im Deutschen kontextgemäß mit „das“ wiedergegeben; וַיְהִי muss in dieser flüssigen Erzählkonstruktion nicht eigens übersetzt werden.
- source_word: וַיְמַהֲרוּ וַיַּשְׁכִּימוּ
  choice: beeilten sich …, brachen früh auf
  rationale: Beide Pluralformen werden auf die nachfolgend genannten Männer der Stadt bezogen. „Brachen früh auf“ gibt die in שׁכם enthaltene Vorstellung frühen Aufstehens in diesem militärischen Aufbruch natürlich wieder.
- source_word: אַנְשֵׁי הָעִיר
  choice: die Männer der Stadt
  rationale: Die maskuline Bezeichnung wird angesichts des militärischen Zusammenhangs konkret als „Männer“ wiedergegeben.
- source_word: לִקְרַאת יִשְׂרָאֵל לַמִּלְחָמָה
  choice: um Israel zum Kampf entgegenzutreten
  rationale: לקראת bezeichnet das Entgegengehen beziehungsweise Begegnen; der feindliche Zweck wird durch לַמִּלְחָמָה ausdrücklich gemacht.
- source_word: הוּא וְכָל עַמּוֹ
  choice: Der König und sein ganzes Volk
  rationale: Das Pronomen wird zur Klarheit mit seinem Bezug „der König“ wiedergegeben. עַם bleibt als „Volk“ erhalten und wird nicht interpretierend auf „Heer“ verengt.
- source_word: לַמּוֹעֵד
  choice: an den festgesetzten Ort
  rationale: מוֹעֵד kann eine festgesetzte Zeit oder einen festgesetzten Ort bezeichnen. Der folgende Geländehinweis spricht hier eher für die örtliche Bedeutung; die echte Mehrdeutigkeit wird in einer Fußnote bewahrt.
- source_word: לִפְנֵי הָעֲרָבָה
  choice: vor der Araba
  rationale: לפני wird räumlich mit „vor“ wiedergegeben. Araba bleibt als geografische beziehungsweise landschaftliche Bezeichnung erhalten.
- source_word: אֹרֵב לוֹ מֵאַחֲרֵי הָעִיר
  choice: dass hinter der Stadt ein Hinterhalt gegen ihn lag
  rationale: Die Wortstellung ist für natürliches Deutsch angepasst; „gegen ihn“ bewahrt den persönlichen Bezug von לוֹ.
theological_decisions: []
translation_notes:
  register: Moderne, gut verständliche und zugleich würdige Erzählsprache. Der verzögerte hebräische Satzgegenstand wurde im Deutschen vorgezogen; der König wird im Folgesatz ausdrücklich genannt, um den Bezug klarzuhalten. Die Mehrdeutigkeiten bei מוֹעֵד und עֲרָבָה werden nicht stillschweigend beseitigt, sondern durch Fußnoten kenntlich gemacht.
