  terminology: „Ai“, „Araba“, „Volk“, „Kampf“ und „Hinterhalt“ sind angemessen. Die Fußnoten bewahren die sachlich begründeten Mehrdeutigkeiten von מוֹעֵד und עֲרָבָה, ohne eine Auslegung festzuschreiben.
