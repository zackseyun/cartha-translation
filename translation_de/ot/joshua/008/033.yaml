    rationale: Die Nominalgruppe nach dem Gedankenstrich ist verständlich, kann aber kurzzeitig wie ein Zusatz zu den Priestern wirken. Eine koordinierte Formulierung stellt klarer dar, dass beide Gruppen Teil von „ganz Israel“ sind.
