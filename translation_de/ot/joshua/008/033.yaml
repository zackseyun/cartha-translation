revisions:
- from: Ganz Israel stand mit seinen Ältesten, Amtsträgern und Richtern zu beiden Seiten der Lade, gegenüber den levitischen Priestern, die die Lade des Bundes Jahwes trugen – der ansässige Fremde ebenso wie der Einheimische[a]. Die eine Hälfte stand dem Berg Garizim gegenüber und die andere Hälfte dem Berg Ebal, wie Mose, der Diener Jahwes, zu Anfang[b] geboten hatte, das Volk Israel zu segnen.
  to: Ganz Israel stand mit seinen Ältesten, Amtsträgern und Richtern zu beiden Seiten der Lade, gegenüber den levitischen Priestern, die die Bundeslade Jahwes trugen; sowohl der ansässige Fremde als auch der Einheimische waren dabei. Die eine Hälfte stand dem Berg Garizim gegenüber und die andere Hälfte dem Berg Ebal, wie Mose, der Diener Jahwes, geboten hatte, das Volk Israel zuerst zu segnen[b].
  rationale: Die Revision korrigiert den unmittelbaren syntaktischen Bezug von בָּרִאשֹׁנָה, verbessert die eindeutige Zuordnung von Fremdem und Einheimischem zur Gesamtversammlung und verwendet mit „Bundeslade“ die natürliche etablierte deutsche Terminologie. Da die Personenfußnote keine für den deutschen Haupttext notwendige alternative Lesart mehr dokumentiert, wird ihr Anker entfernt; der verbleibende Anker [b] steht unmittelbar bei der mehrdeutigen Formulierung.
