source:
  edition: WLC
  text: וְ/כָל יִשְׂרָאֵ֡ל וּ/זְקֵנָ֡י/ו וְ/שֹׁטְרִ֣ים וְ/שֹׁפְטָ֡י/ו עֹמְדִ֣ים מִ/זֶּ֣ה וּ/מִ/זֶּ֣ה לָ/אָר֡וֹן נֶגֶד֩ הַ/כֹּהֲנִ֨ים הַ/לְוִיִּ֜ם נֹשְׂאֵ֣י אֲר֣וֹן בְּרִית יְהוָ֗ה כַּ/גֵּר֙ כָּֽ/אֶזְרָ֔ח חֶצְי/וֹ֙ אֶל מ֣וּל הַר גְּרִזִ֔ים וְ/הַֽ/חֶצְי֖/וֹ אֶל מ֣וּל הַר עֵיבָ֑ל כַּ/אֲשֶׁ֨ר צִוָּ֜ה מֹשֶׁ֣ה עֶֽבֶד יְהוָ֗ה לְ/בָרֵ֛ךְ אֶת הָ/עָ֥ם יִשְׂרָאֵ֖ל בָּ/רִאשֹׁנָֽה־׀׀׀׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/033.yaml
  text: And all Israel[a], with its elders, officers, and judges, was standing on this side and on that side of the ark, opposite the Levitical priests carrying the ark of the covenant of Yahweh, both the sojourner and the native-born alike. Half of them were in front of Mount Gerizim and half of them in front of Mount Ebal, just as Moses the servant of Yahweh had commanded at the first[b], to bless the people of Israel.
translation:
  language: de
  text: Ganz Israel stand mit seinen Ältesten, Amtsträgern und Richtern zu beiden Seiten der Lade, gegenüber den levitischen Priestern, die die Bundeslade Jahwes trugen; sowohl der ansässige Fremde als auch der Einheimische waren dabei. Die eine Hälfte stand dem Berg Garizim gegenüber und die andere Hälfte dem Berg Ebal, wie Mose, der Diener Jahwes, geboten hatte, das Volk Israel zuerst zu segnen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Hebräisch: »zuerst« bzw. »zu Anfang«. Der Ausdruck kann die Segnung als erste Handlung bezeichnen oder auf ein früheres Gebot Moses über die Segnung zurückverweisen.'
    reason: Der Bezug des hebräischen Ausdrucks בָּרִאשֹׁנָה wird als mehrdeutig erläutert, während seine Stellung beim Verb »segnen« im Haupttext gewahrt bleibt.
lexical_decisions:
- source_word: וְכָל יִשְׂרָאֵל
  choice: Ganz Israel
  rationale: Gibt die Gesamtheit der versammelten Bundesgemeinschaft natürlich und mit ihrem kollektiven Charakter wieder.
- source_word: וּזְקֵנָיו וְשֹׁטְרִים וְשֹׁפְטָיו
  choice: mit seinen Ältesten, Amtsträgern und Richtern
  rationale: Das Possessivpronomen bezieht sich auf Israel als Gemeinschaft. »Amtsträger« bezeichnet שֹׁטְרִים hier neutral als Verwaltungs- oder Ordnungsbeamte, ohne sie auf Polizei oder Militär festzulegen.
- source_word: מִזֶּה וּמִזֶּה לָאָרוֹן
  choice: zu beiden Seiten der Lade
  rationale: Eine natürliche deutsche Wiedergabe der räumlich verteilten Aufstellung auf der einen und der anderen Seite.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: die levitischen Priester
  rationale: Gibt die hebräische Verbindung idiomatisch wieder; die formal mögliche Apposition »die Priester, die Leviten« bleibt sachlich eingeschlossen.
- source_word: נֹשְׂאֵי אֲרוֹן בְּרִית יְהוָה
  choice: die die Lade des Bundes Jahwes trugen
  rationale: Der Relativsatz gibt das hebräische Partizip klar wieder und bewahrt die Zuordnung des Bundes zu Jahwe.
- source_word: כַּגֵּר כָּאֶזְרָח
  choice: der ansässige Fremde ebenso wie der Einheimische
  rationale: Die parallele Konstruktion betont die gleichberechtigte Anwesenheit beider sozialen Gruppen. »Ansässiger Fremder« verdeutlicht, dass גֵּר keinen bloß Durchreisenden meint.
- source_word: חֶצְיוֹ ... וְהַחֶצְיוֹ
  choice: die eine Hälfte ... und die andere Hälfte
  rationale: Macht im Deutschen deutlich, dass die versammelte Gemeinschaft in zwei Gruppen geteilt war.
- source_word: בָּרִאשֹׁנָה
  choice: zu Anfang
  rationale: Bewahrt die zeitliche Formulierung und ihre mögliche Beziehung entweder zur ersten Handlung der Zeremonie oder zu einem früheren Gebot Moses.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Eigennamen JHWH. »Jahwe« gibt ihn im modernen deutschen Bibelstil als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Soziale Kategorien גֵּר und אֶזְרָח
  choice: der ansässige Fremde ebenso wie der Einheimische
  alternative: der Fremde ebenso wie der im Land Geborene
  rationale: Die Formulierung wahrt die Einbeziehung des nicht einheimischen, aber in Israel lebenden Fremden und des einheimischen Israeliten, ohne spätere staatsrechtliche oder theologische Kategorien einzutragen.
- issue: Bezug von בָּרִאשֹׁנָה
  choice: zu Anfang, mit erklärender Fußnote
  alternative: als erste Handlung; wie Mose zuvor geboten hatte
  rationale: Der knappe hebräische Ausdruck lässt offen, ob die Segnung als erste Handlung gemeint ist oder ob auf ein früheres Gebot Moses zurückverwiesen wird. Die Übersetzung entscheidet diese Spannung nicht stillschweigend.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. »Lade« und »Bund« bewahren den vertrauten biblischen Wortschatz; »Amtsträger« und »ansässiger Fremder« vermeiden veraltete oder missverständliche Amts- und Sozialbegriffe. Die Gedankenstrichkonstruktion macht deutlich, dass Fremde und Einheimische zu der zuvor genannten Versammlung gehören.
