base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/013.yaml
  text: So the people positioned the whole camp that was north of the city[a], with its rear west of the city[b], and Joshua went that night into the midst of the valley.
translation:
  language: de
  text: Da stellte das Volk das ganze Lager nördlich der Stadt auf und dessen rückwärtigen Teil[a] westlich der Stadt[b]. Josua ging in jener Nacht mitten ins Tal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Nachhut“. Das hebräische Wort bedeutet wörtlich „seine Ferse“ und kann den hinteren Teil eines Lagers oder Heeres bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „von der Meerseite der Stadt“. „Meer“ dient hier als Richtungsangabe und bedeutet „Westen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: stellte … auf
  rationale: שׂים bezeichnet allgemein das Setzen oder Platzieren; „aufstellen“ gibt hier die gezielte militärische Positionierung natürlich wieder, ohne eine bestimmte Formation vorauszusetzen.
- source_word: הָעָם
  choice: das Volk
  rationale: Die Übersetzung bewahrt den allgemeinen Ausdruck des Hebräischen, auch wenn im Zusammenhang die kampffähigen Truppen gemeint sind.
- source_word: כָּל הַמַּחֲנֶה
  choice: das ganze Lager
  rationale: מַחֲנֶה bedeutet hier „Lager“ beziehungsweise „Heerlager“; „das ganze Lager“ bildet כָּל knapp und idiomatisch ab.
- source_word: אֲשֶׁר מִצְּפוֹן לָעִיר
  choice: nördlich der Stadt
  rationale: Die räumliche Angabe wird im Deutschen klar und ohne unnötig schwere Relativkonstruktion wiedergegeben.
- source_word: עֲקֵבוֹ
  choice: seinen rückwärtigen Teil
  rationale: עָקֵב bedeutet wörtlich „Ferse“ und bezeichnet übertragen den hinteren Teil. Die Wiedergabe vermeidet die weitergehende Festlegung auf eine organisierte Nachhut.
- source_word: מִיָּם לָעִיר
  choice: westlich der Stadt
  rationale: יָם („Meer“) dient im biblischen Hebräisch häufig als Richtungsbezeichnung für den Westen.
- source_word: וַיֵּלֶךְ
  choice: ging
  rationale: Die schlichte Wiedergabe entspricht dem üblichen Sinn von הלך und lässt die genaue Art der Bewegung offen.
- source_word: בַּלַּיְלָה הַהוּא
  choice: in jener Nacht
  rationale: Dies ist eine natürliche, erzählerisch würdige Wiedergabe der hebräischen Zeitangabe.
- source_word: בְּתוֹךְ הָעֵמֶק
  choice: mitten ins Tal
  rationale: Nach dem Bewegungsverb gibt „ins“ die Zielrichtung wieder; „mitten“ entspricht dem Sinn von בְּתוֹךְ.
