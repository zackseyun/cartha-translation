  terminology: „Lager“, „rückwärtiger Teil“ und „Nachhut“ in der Alternativfußnote sind für den militärischen Kontext passend. Die Fußnote zu „Meerseite“ erklärt die westliche Richtungsbedeutung von יָם korrekt und ohne unnötige Auslegung.
