source:
  edition: WLC
  text: וְ/הָיָ֞ה כְּ/תָפְשְׂ/כֶ֣ם אֶת הָ/עִ֗יר תַּצִּ֤יתוּ אֶת הָ/עִיר֙ בָּ/אֵ֔שׁ כִּ/דְבַ֥ר יְהוָ֖ה תַּעֲשׂ֑וּ רְא֖וּ צִוִּ֥יתִי אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/008.yaml
  text: And when you have taken the city[a], you shall set the city on fire. According to the word of Yahweh, you shall do. See, I have commanded you.
translation:
  language: de
  text: Wenn ihr die Stadt eingenommen habt, sollt ihr sie in Brand setzen. Nach dem Wort Jahwes[a] sollt ihr handeln. Seht, ich habe es euch befohlen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Nach dem Befehl Jahwes sollt ihr so handeln.“ Wörtlich steht im Hebräischen: „Nach dem Wort Jahwes sollt ihr handeln.“'
    reason: 'Lexikalische Alternative: דָּבָר kann hier sowohl formal als „Wort“ als auch kontextbezogen als „Befehl“ verstanden werden.'
lexical_decisions:
- source_word: וְהָיָה כְּתָפְשְׂכֶם
  choice: Wenn ihr … eingenommen habt
  rationale: Die Konstruktion leitet einen zukünftigen zeitlichen Umstand ein. Das deutsche Perfekt macht deutlich, dass die Einnahme der Stadt der anschließenden Brandlegung vorausgeht.
- source_word: אֶת הָעִיר
  choice: die Stadt
  rationale: עִיר bezeichnet hier im militärischen Erzählzusammenhang die befestigte Stadt Ai.
- source_word: תַּצִּיתוּ אֶת הָעִיר בָּאֵשׁ
  choice: sollt ihr sie in Brand setzen
  rationale: Die Hifil-Form von יצת bezeichnet das Entzünden. „In Brand setzen“ gibt den kausativen Sinn idiomatisch wieder; das Pronomen vermeidet im Deutschen eine schwerfällige Wiederholung von „die Stadt“.
- source_word: כִּדְבַר יְהוָה
  choice: Nach dem Wort Jahwes
  rationale: דָּבָר bedeutet wörtlich „Wort“ oder „Sache“, kann im Kontext aber auch einen Befehl bezeichnen. Die Hauptfassung bewahrt die formale Wendung und lässt diese Bedeutungsbreite stehen.
- source_word: תַּעֲשׂוּ
  choice: sollt ihr handeln
  rationale: Das Imperfekt hat hier auffordernde Kraft. Zusammen mit „nach dem Wort“ ist „handeln“ im Deutschen natürlicher als das isolierte „tun“.
- source_word: רְאוּ
  choice: Seht
  rationale: Der Imperativ dient als knapper Aufmerksamkeitsruf und bleibt in seiner direkten Form erhalten.
- source_word: צִוִּיתִי אֶתְכֶם
  choice: ich habe es euch befohlen
  rationale: Das Perfekt verweist auf den bereits erteilten Befehl. Das ergänzte „es“ stellt im Deutschen den Rückbezug auf die vorangehende Anweisung klar.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im Deutschen geläufige Transkription.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst und nicht den Titel אֲדֹנָי. Die Wiedergabe als „Jahwe“ bewahrt diesen Unterschied, ohne einen bloßen Titel einzusetzen.
- issue: Bedeutungsumfang von כִּדְבַר יְהוָה
  choice: Nach dem Wort Jahwes
  alternative: Nach dem Befehl Jahwes
  rationale: „Wort“ wahrt die unmittelbare lexikalische Form, während der Zusammenhang eine befehlende Weisung erkennen lässt. Die Alternative wird deshalb in der Fußnote genannt, ohne die Spannung im Haupttext aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter militärischer Anweisung. Die Satzfolge bleibt knapp und nah am hebräischen Aufbau; unnötig altertümliche Formen werden vermieden.
