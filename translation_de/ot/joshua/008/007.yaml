  naturalness: Der überarbeitete Wortlaut ist modernes, würdiges Standarddeutsch. „Aus dem Hinterhalt hervorkommen“ ist im militärischen Kontext klar und natürlich; die Wendung „in eure Hand geben“ bewahrt das im Deutschen verständliche biblische Bild.
  terminology: „Jahwe“ gibt den Gottesnamen יהוה sachgerecht als Eigennamen wieder. „In Besitz nehmen“ erhält bei ירשׁ die relevante Besitzkomponente; die Fußnote nennt „einnehmen“ als im Kontext mögliche militärische Alternative.
