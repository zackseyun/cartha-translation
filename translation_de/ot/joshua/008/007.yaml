  to: Dann sollt ihr aus dem Hinterhalt hervorkommen und die Stadt in Besitz nehmen[a]; denn Jahwe, euer Gott, wird sie in eure Hand geben.
  rationale: Die Revision folgt der besitzbezogenen Bedeutung von ירשׁ im Haupttext und passt die Fußnote folgerichtig als militärische Alternative an. Zugleich ersetzt sie „aufbrechen“ durch eine Formulierung, die das Aufstehen bzw. Hervorkommen aus dem Hinterhalt genauer trifft.
