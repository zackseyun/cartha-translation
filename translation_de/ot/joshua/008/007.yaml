  text: וְ/אַתֶּ֗ם תָּקֻ֨מוּ֙ מֵ/הָ֣/אוֹרֵ֔ב וְ/הוֹרַשְׁתֶּ֖ם אֶת הָ/עִ֑יר וּ/נְתָנָ֛/הּ יְהוָ֥ה אֱלֹֽהֵי/כֶ֖ם בְּ/יֶדְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/007.yaml
  text: Then you shall rise up from the ambush and take the city[a], for Yahweh your God will give it into your hand.
translation:
  language: de
  text: Dann sollt ihr aus dem Hinterhalt hervorkommen und die Stadt in Besitz nehmen[a]; denn Jahwe, euer Gott, wird sie in eure Hand geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Stadt einnehmen«. Das hebräische Verb kann die Besitzergreifung bezeichnen, nicht nur die militärische Eroberung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּקֻמוּ
  choice: sollt ihr … aufbrechen
  rationale: Das Qal Imperfekt 2. Person Plural von קום dient hier als Anweisung innerhalb eines militärischen Ablaufs. „Aufbrechen“ gibt das Hervorkommen aus der verborgenen Stellung natürlich wieder.
- source_word: מֵהָאוֹרֵב
  choice: aus dem Hinterhalt
  rationale: אֹרֵב bezeichnet hier den Hinterhalt beziehungsweise die Stellung der im Hinterhalt liegenden Truppe. Die knappe Formulierung ist im Deutschen verständlich und militärisch passend.
- source_word: וְהוֹרַשְׁתֶּם
  choice: die Stadt einnehmen
  rationale: Das Hifil von ירשׁ kann Besitzergreifung, Inbesitznahme oder Verdrängung ausdrücken. Im unmittelbaren Eroberungskontext ist „einnehmen“ idiomatisch, während die Fußnote auf die besitzbezogene Bedeutungsnuance hinweist.
- source_word: הָעִיר
  choice: die Stadt
  rationale: Direkte Wiedergabe von עִיר mit bestimmtem Artikel.
- source_word: וּנְתָנָהּ
  choice: wird sie … geben
  rationale: Das Qal Perfekt mit ו innerhalb der Anweisungsfolge bezeichnet hier das zugesicherte künftige Ergebnis.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵיכֶם
  choice: euer Gott
  rationale: Direkte Wiedergabe der Konstruktverbindung mit Suffix der 2. Person Plural.
- source_word: בְּיֶדְכֶם
  choice: in eure Hand
  rationale: Die hebräische Wendung bezeichnet die Übergabe in die Macht oder Verfügungsgewalt der Angesprochenen; die bildhafte Form bleibt im Deutschen verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn als Namen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von ירשׁ im Eroberungskontext
  choice: einnehmen
  alternative: in Besitz nehmen; erobern
  rationale: „Einnehmen“ passt zum militärischen Ablauf, ohne die Besitzkomponente grundsätzlich auszuschließen; die echte lexikalische Spannweite wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Aus dem Hinterhalt aufbrechen“ ist natürlich und bewahrt die konkrete Bewegung; „in eure Hand geben“ erhält die verständliche biblische Bildsprache.
