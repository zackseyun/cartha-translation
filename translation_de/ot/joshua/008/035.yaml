source:
  edition: WLC
  text: לֹֽא הָיָ֣ה דָבָ֔ר מִ/כֹּ֖ל אֲשֶׁר צִוָּ֣ה מֹשֶׁ֑ה אֲשֶׁ֨ר לֹֽא קָרָ֜א יְהוֹשֻׁ֗עַ נֶ֣גֶד כָּל קְהַ֤ל יִשְׂרָאֵל֙ וְ/הַ/נָּשִׁ֣ים וְ/הַ/טַּ֔ף וְ/הַ/גֵּ֖ר הַ/הֹלֵ֥ךְ בְּ/קִרְבָּֽ/ם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/035.yaml
  text: There was not a word of all that Moses commanded that Joshua did not read before all the assembly of Israel[a], and the women, the little children[e][d][c][b], and the sojourner who walked among them.
translation:
  language: de
  text: Von allem, was Mose geboten hatte, gab es kein Wort, das Josua nicht vor der ganzen Versammlung Israels, den Frauen, den kleinen Kindern und dem Fremden[a], der unter ihnen lebte[b], vorlas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist ein Nichtisraelit, der dauerhaft unter den Israeliten wohnte.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: „der in ihrer Mitte ging“; gemeint ist hier: „der sich unter ihnen aufhielt“ oder „der unter ihnen lebte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דָבָר
  choice: Wort
  rationale: Im Zusammenhang mit dem öffentlichen Vorlesen der Gebote ist „Wort“ die passende konkrete Wiedergabe; „Sache“ wäre ebenfalls möglich, aber weniger eng mit קרא verbunden.
- source_word: צִוָּה
  choice: geboten hatte
  rationale: „Gebieten“ gibt den verbindlichen, bundesrechtlichen Charakter der Weisungen des Mose treffend und würdig wieder.
- source_word: קָרָא
  choice: vorlas
  rationale: Der Kontext handelt vom öffentlichen Verlesen des Gesetzes; „vorlesen“ verbindet den Akt des Lesens mit seiner hörbaren Ausrichtung an die Versammlung.
- source_word: נֶגֶד
  choice: vor
  rationale: „Vor“ bezeichnet hier knapp und idiomatisch das Lesen in Gegenwart der versammelten Gemeinschaft.
- source_word: קְהַל
  choice: Versammlung
  rationale: „Versammlung“ bezeichnet die förmlich zusammengekommene Gesamtheit Israels, ohne einen späteren kirchlichen Sinn einzutragen.
- source_word: הַנָּשִׁים
  choice: die Frauen
  rationale: Die ausdrücklich genannte Gruppe wird in der Aufzählung unverändert sichtbar gehalten.
- source_word: הַטַּף
  choice: die kleinen Kinder
  rationale: טַף bezeichnet besonders die Kleinen beziehungsweise die abhängigen Kinder; „kleine Kinder“ wahrt diese Nuance.
- source_word: הַגֵּר
  choice: der Fremde
  rationale: „Fremder“ ist im Deutschen die geläufige biblische Bezeichnung; eine Fußnote klärt, dass ein ansässiger Nichtisraelit und nicht bloß eine unbekannte Person gemeint ist.
- source_word: הַהֹלֵךְ בְּקִרְבָּם
  choice: der unter ihnen lebte
  rationale: Das wörtliche Bild des Gehens bezeichnet hier idiomatisch den dauernden Aufenthalt innerhalb der Gemeinschaft; „lebte“ ist im modernen Deutsch natürlich und sachlich präzise.
- source_word: לֹא הָיָה ... אֲשֶׁר לֹא
  choice: gab es kein Wort, das ... nicht
  rationale: Die deutsche Doppelverneinung bewahrt die emphatische hebräische Aussage, dass Josua ausnahmslos alles vorlas, und bleibt dennoch verständlich.
theological_decisions:
- issue: Öffentlicher Umfang der Bundesunterweisung
  choice: Frauen, kleine Kinder und der ansässige Fremde werden ausdrücklich als Zuhörende genannt.
  alternative: Die Gruppen könnten unausgesprochen unter der „ganzen Versammlung Israels“ zusammengefasst werden.
  rationale: Der hebräische Text zählt diese Gruppen ausdrücklich auf. Die Übersetzung bewahrt daher ihre sichtbare Einbeziehung in die öffentliche Lesung.
- issue: Bezug der Aufzählung zu „der ganzen Versammlung Israels“
  choice: Ein Doppelpunkt führt die ausdrücklich genannten Gruppen als nähere Entfaltung der anwesenden Gesamtheit ein.
  alternative: Die Glieder könnten lediglich mit „und“ an „die ganze Versammlung Israels“ angeschlossen werden.
  rationale: Der masoretische Text verbindet die Gruppen koordinierend, doch im Deutschen würde „die ganze Versammlung Israels und die Frauen“ leicht so klingen, als gehörten die Frauen nicht zur Versammlung. Der Doppelpunkt wahrt die ausdrückliche Aufzählung, ohne eine solche Ausgrenzung nahezulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische emphatische Doppelverneinung bleibt erhalten. Der Doppelpunkt macht die aufgezählten Gruppen als ausdrücklich einbezogene Teile der anwesenden Gemeinschaft verständlich und vermeidet eine im Deutschen mögliche Ausgrenzungslesart.
