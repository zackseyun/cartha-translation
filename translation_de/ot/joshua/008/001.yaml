source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל יְהוֹשֻׁ֨עַ֙ אַל תִּירָ֣א וְ/אַל תֵּחָ֔ת קַ֣ח עִמְּ/ךָ֗ אֵ֚ת כָּל עַ֣ם הַ/מִּלְחָמָ֔ה וְ/ק֖וּם עֲלֵ֣ה הָ/עָ֑י רְאֵ֣ה נָתַ֣תִּי בְ/יָדְ/ךָ֗ אֶת מֶ֤לֶךְ הָ/עַי֙ וְ/אֶת עַמּ֔/וֹ וְ/אֶת עִיר֖/וֹ וְ/אֶת אַרְצֽ/וֹ־־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/001.yaml
  text: Then Yahweh said to Joshua[a], “Do not fear and do not be dismayed. Take with you all the fighting men, and arise, go up to Ai. See, I have given into your hand the king of Ai, his people, his city, and his land.”
translation:
  language: de
  text: 'Da sagte Jahwe zu Josua: „Hab keine Angst und lass dich nicht entmutigen. Nimm alle Krieger[a] mit dir, mach dich auf und zieh nach Ai hinauf. Sieh, ich habe den König von Ai, sein Volk, seine Stadt und sein Land in deine Hand gegeben.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „das ganze Volk des Krieges“; gemeint ist die gesamte zum Kampf aufgebotene Streitmacht. Auch möglich: „das gesamte Kriegsvolk“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen in seiner geläufigen wissenschaftlichen Form wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אַל תִּירָא וְאַל תֵּחָת
  choice: Hab keine Angst und lass dich nicht entmutigen
  rationale: Die beiden Verbote bleiben getrennt erhalten. Die Formulierung ist modern und natürlich; חתת bezeichnet hier das innere Zusammenbrechen beziehungsweise den Verlust des Mutes.
- source_word: קַח עִמְּךָ
  choice: Nimm … mit dir
  rationale: Die ausdrücklich genannte Begleitung עִמְּךָ wird vollständig wiedergegeben.
- source_word: כָּל עַם הַמִּלְחָמָה
  choice: das gesamte Kriegsvolk
  rationale: Die kollektive hebräische Wendung bedeutet wörtlich etwa „das ganze Volk des Krieges“ und bezeichnet hier die zum Kampf aufgebotene Streitmacht.
- source_word: וְקוּם עֲלֵה
  choice: mach dich auf und zieh … hinauf
  rationale: Beide Imperative werden bewahrt; „mach dich auf“ gibt den Aufbruchsbefehl idiomatisch und würdig wieder.
- source_word: רְאֵה
  choice: Sieh
  rationale: Der Imperativ lenkt Josuas Aufmerksamkeit auf die nachfolgende göttliche Zusicherung, ohne die altertümliche Wirkung von „siehe“ zu erzwingen.
- source_word: נָתַתִּי בְיָדְךָ
  choice: ich habe … in deine Hand gegeben
  rationale: Das Perfekt unterstreicht in der göttlichen Rede die Gewissheit der Zusage; das Bild der Übergabe in Josuas Hand bleibt erhalten.
- source_word: עַמּוֹ וְאֶת עִירוֹ וְאֶת אַרְצוֹ
  choice: sein Volk, seine Stadt und sein Land
  rationale: Die maskulinen Suffixe werden auf den unmittelbar zuvor genannten König bezogen und die hebräische Aufzählung bleibt bestehen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den persönlichen Gottesnamen. Die Transliteration bewahrt diesen, statt ihn durch einen Hoheitstitel zu ersetzen.
- issue: Gewissheit der göttlichen Übergabe in נָתַתִּי
  choice: ich habe … gegeben
  alternative: ich gebe …
  rationale: Die Perfektform wird als feste, bereits zugesicherte Wirklichkeit wiedergegeben, ohne die zeitliche und rhetorische Spannung der göttlichen Rede aufzulösen.
- issue: Kollektive militärische Bezeichnung
  choice: das gesamte Kriegsvolk
  alternative: alle Krieger
  rationale: Die gewählte Fassung bewahrt den Kollektivcharakter von עַם und bezeichnet im Kontext die Kampftruppe, nicht unterschiedslos die gesamte Bevölkerung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und befehlend; geläufige biblische Bilder wie „in deine Hand gegeben“ werden beibehalten, während unnötig altertümliche Formen vermieden werden.
