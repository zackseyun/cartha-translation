base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/012.yaml
  text: And he took about five thousand men and set them in ambush between Bethel and Ai[b][a], west of the city.
translation:
  language: de
  text: Er nahm etwa fünftausend Mann[a] und stellte sie westlich der Stadt[b], zwischen Bethel und Ai, als Hinterhalt auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht „etwa fünftausend Mann“; das der Zahl vorangestellte כ bezeichnet wahrscheinlich eine ungefähre Angabe.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht „vom Meer her bei der Stadt“; „Meer“ bezeichnet in hebräischen Ortsangaben häufig den Westen.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Er nahm
  rationale: לקח bedeutet hier im fortlaufenden Erzählstil am natürlichsten „nehmen“; im militärischen Zusammenhang kann das Auswählen aus einer größeren Truppe mitschwingen, ohne ausdrücklich gemacht zu werden.
- source_word: כַּחֲמֵשֶׁת אֲלָפִים אִישׁ
  choice: etwa fünftausend Mann
  rationale: Das Präfix כ vor der Zahl bezeichnet wahrscheinlich eine ungefähre Angabe. אִישׁ steht nach der Zahl kollektiv; „Mann“ ist im Deutschen die übliche militärische Zählbezeichnung.
- source_word: וַיָּשֶׂם אוֹתָם אֹרֵב
  choice: stellte sie … als Hinterhalt auf
  rationale: שׂים bezeichnet das Setzen oder Aufstellen; אֹרֵב beschreibt hier die Funktion der Gruppe als Hinterhalt. Die deutsche Wendung ist natürlich und bewahrt diese Rollenangabe.
- source_word: בֵּין בֵּית אֵל וּבֵין הָעַי
  choice: zwischen Bethel und Ai
  rationale: Die Ortsangabe wird unmittelbar wiedergegeben; die Eigennamen folgen den im Deutschen geläufigen Formen.
- source_word: מִיָּם לָעִיר
  choice: westlich der Stadt
  rationale: יָם („Meer“) wird in hebräischen Richtungsangaben idiomatisch für „Westen“ gebraucht. Gemeint ist die Lage des Hinterhalts auf der Westseite der Stadt.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. „Als Hinterhalt aufstellen“ gibt die militärische Situation klar wieder, ohne das knappe Hebräisch unnötig auszudeuten.
