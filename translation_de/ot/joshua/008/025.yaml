source:
  edition: WLC
  text: וַ/יְהִי֩ כָל הַ/נֹּ֨פְלִ֜ים בַּ/יּ֤וֹם הַ/הוּא֙ מֵ/אִ֣ישׁ וְ/עַד אִשָּׁ֔ה שְׁנֵ֥ים עָשָׂ֖ר אָ֑לֶף כֹּ֖ל אַנְשֵׁ֥י הָ/עָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/025.yaml
  text: And all who fell that day[a], from man to woman, were twelve thousand—all the people of Ai.
translation:
  language: de
  text: Alle, die an jenem Tag fielen, vom Mann bis zur Frau, waren insgesamt zwölftausend – die gesamte Bevölkerung von Ai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »alle Männer (oder: Leute) von Ai«. Die hebräische Wendung kann hier die Bevölkerung der Stadt insgesamt bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: waren insgesamt
  rationale: Die Wayyiqtol-Form von היה leitet hier eine zusammenfassende Feststellung ein. Die deutsche Kopulakonstruktion gibt dies natürlich wieder, ohne die altertümliche Formel »und es geschah« einzuführen.
- source_word: כָל הַנֹּפְלִים
  choice: alle, die … fielen
  rationale: Das substantivierte Partizip von נפל bezeichnet im Kampfzusammenhang die Gefallenen. »Die … fielen« bewahrt das hebräische Bild und ist im Deutschen eindeutig genug.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Dies ist eine natürliche und genaue Wiedergabe der temporalen Wendung.
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: vom Mann bis zur Frau
  rationale: Die singularische Bereichsformel wird formal bewahrt und bringt ihren umfassenden Sinn zum Ausdruck.
- source_word: שְׁנֵים עָשָׂר אָלֶף
  choice: zwölftausend
  rationale: Direkte Wiedergabe der Kardinalzahl; »insgesamt« verdeutlicht im Deutschen die zusammenfassende Zählung.
- source_word: כֹּל אַנְשֵׁי הָעָי
  choice: die gesamte Bevölkerung von Ai
  rationale: אַנְשֵׁי bedeutet wörtlich »Männer/Leute von«. Da der Vers unmittelbar zuvor Männer und Frauen einschließt, bezeichnet die Wendung hier die Bevölkerung der Stadt als Ganzes. Die Fußnote dokumentiert die wörtlichere Form.
theological_decisions:
- issue: Geschlechtsspezifische Sprache in der Zusammenfassung der Getöteten
  choice: »vom Mann bis zur Frau« beibehalten und כֹּל אַנְשֵׁי הָעָי korporativ als »die gesamte Bevölkerung von Ai« wiedergeben
  alternative: »alle Männer von Ai«
  rationale: Die erste Wendung nennt ausdrücklich beide Geschlechter. Deshalb würde die isoliert wörtliche Wiedergabe »alle Männer von Ai« im abschließenden Beisatz auf Deutsch fälschlich eine nur männliche Gruppe nahelegen. Die korporative Bedeutung bleibt erhalten, während die lexikalische Spannung in der Fußnote sichtbar gemacht wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche, aber verständliche Formel »vom Mann bis zur Frau« bewahrt die Ausdrucksweise des Hebräischen; der abschließende Gedankenstrich kennzeichnet den zusammenfassenden Beisatz.
