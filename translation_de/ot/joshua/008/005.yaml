base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/005.yaml
  text: And I and all the people who are with me will approach the city[a]. And when they come out to meet us, as before[b], we will flee before them.
translation:
  language: de
  text: Das ganze Volk und ich, die bei mir sind, werden uns der Stadt nähern[a]. Wenn sie herauskommen, um uns entgegenzutreten, wie beim ersten Mal[b], werden wir vor ihnen fliehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werden nahe an die Stadt heranrücken“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „wie beim ersten Mal“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי וְכָל הָעָם אֲשֶׁר אִתִּי
  choice: Ich aber und das ganze Volk, das bei mir ist
  rationale: Das ו setzt die Anweisung fort und markiert zugleich den Gegensatz zur zuvor genannten Hinterhaltstruppe; „Volk“ bewahrt die Breite von עָם, und der Singular im Relativsatz entspricht natürlichem deutschem Bezug auf das Kollektivnomen.
- source_word: נִקְרַב אֶל הָעִיר
  choice: werden uns der Stadt nähern
  rationale: Das Qal Imperfekt 1. Person Plural beschreibt die geplante künftige Bewegung zur Stadt hin. „Sich nähern“ gibt קרב natürlich wieder, ohne eine Angriffsabsicht hinzuzufügen.
- source_word: וְהָיָה כִּי
  choice: Und wenn
  rationale: Die hebräische Konstruktion leitet den erwarteten nächsten Vorgang ein; „und wenn“ ist im modernen Deutsch klarer als eine formale Wiedergabe mit „es wird geschehen“.
- source_word: יֵצְאוּ לִקְרָאתֵנוּ
  choice: sie uns entgegenziehen
  rationale: יצא mit לקראת bezeichnet das Herauskommen beziehungsweise Entgegengehen. Im militärischen Zusammenhang ist „entgegenziehen“ natürlich, ohne das Ziel des Treffens näher festzulegen.
- source_word: כַּאֲשֶׁר בָּרִאשֹׁנָה
  choice: wie beim ersten Mal
  rationale: Die Wendung verweist auf die erste Begegnung mit Ai. Diese Wiedergabe ist idiomatisch und erhält den ausdrücklichen Bezug auf das erste Mal.
- source_word: וְנַסְנוּ לִפְנֵיהֶם
  choice: werden wir vor ihnen fliehen
  rationale: נוס bezeichnet deutlich Flucht und sollte nicht zum neutraleren „sich zurückziehen“ abgeschwächt werden. „Vor ihnen“ bewahrt die hebräische Raum- und Beziehungsformel.
