base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/002.yaml
  text: And you shall do to Ai and its king as you did to Jericho and its king[a]. Only its spoil and its livestock you may plunder for yourselves[b]. Set an ambush for yourself behind the city.
translation:
  language: de
  text: Mit Ai und ihrem König sollst du ebenso verfahren, wie du mit Jericho und seinem König verfahren bist. Nur ihre Beute und ihr Vieh dürft ihr euch als Beute nehmen.[a] Lege hinter der Stadt einen Hinterhalt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sollt ihr euch als Beute nehmen“. Die hebräische Form kann als Anweisung beziehungsweise Zukunftsaussage oder im Zusammenhang als Erlaubnis verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Stelle hinter der Stadt eine Truppe in den Hinterhalt.“ Das hebräische Wort kann den Hinterhalt oder kollektiv die dort lauernde Truppe bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: sollst du … verfahren
  rationale: Das Qal-Perfekt 2. Person maskulin Singular mit וְ hat im Anweisungskontext direktiven Sinn. „Sollst du … verfahren“ klingt im Deutschen natürlich und bewahrt den verpflichtenden Charakter.
- source_word: לָעַי וּלְמַלְכָּהּ
  choice: mit Ai und seinem König
  rationale: Deutsch verwendet bei „verfahren“ idiomatisch „mit“. Das Suffix wird auf die Stadt Ai bezogen und daher mit „seinem“ wiedergegeben.
- source_word: כַּאֲשֶׁר עָשִׂיתָ
  choice: ebenso … wie du … verfahren bist
  rationale: Gibt den vergleichenden Rückbezug auf das Vorgehen gegen Jericho klar und würdig wieder.
- source_word: רַק
  choice: Nur
  rationale: Kennzeichnet die entscheidende Ausnahme gegenüber Jericho und bewahrt die restriktive Kraft.
- source_word: שְׁלָלָהּ
  choice: seine Beute
  rationale: „Beute“ ist die natürliche moderne deutsche Bezeichnung für im Krieg erbeutete Güter; das Pronomen bezieht sich grammatisch auf Ai.
- source_word: וּבְהֶמְתָּהּ
  choice: und sein Vieh
  rationale: בְּהֵמָה bezeichnet hier die zur Stadt gehörenden Nutz- beziehungsweise Haustiere. „Vieh“ ist knapp und kontextgerecht.
- source_word: תָּבֹזּוּ לָכֶם
  choice: dürft ihr für euch plündern
  rationale: Die 2. Person maskulin Plural richtet sich an Josuas Truppen. Im Kontrast zum Bann über Jericho drückt die Form hier eine Erlaubnis aus; „für euch“ bewahrt לָכֶם.
- source_word: שִׂים לְךָ
  choice: Lege
  rationale: Der Imperativ richtet sich an Josua. Bei „einen Hinterhalt legen“ ist die deutsche Wendung bereits zielbezogen, sodass לְךָ nicht hölzern als „für dich“ wiederholt werden muss.
- source_word: אֹרֵב
  choice: einen Hinterhalt
  rationale: Das substantivisch gebrauchte Partizip kann den Hinterhalt als solchen oder die lauernde Truppe kollektiv bezeichnen. Der Haupttext verwendet die idiomatische deutsche Wendung.
- source_word: מֵאַחֲרֶיהָ
  choice: hinter der Stadt
  rationale: Die räumliche Angabe wird unmittelbar und eindeutig wiedergegeben; das feminine Suffix nimmt die Stadt auf.
theological_decisions:
- issue: Erlaubnis zur Plünderung im Unterschied zu Jericho
  choice: „dürft ihr … plündern“
  alternative: „werdet/sollt ihr … plündern“
  rationale: Der Kontext stellt eine ausdrückliche Ausnahme gegenüber Jericho heraus. Die Übersetzung als Erlaubnis macht diese Funktion sichtbar, ohne eine darüber hinausgehende theologische Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die militärischen Aussagen bleiben direkt, ohne altertümliche Begriffe. Der Wechsel vom Singular in der Anweisung an Josua zum Plural bei der Plünderung durch Israel beziehungsweise seine Truppen wird bewahrt.
