  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל יְהוֹשֻׁ֗עַ נְ֠טֵה בַּ/כִּיד֤וֹן אֲשֶׁר בְּ/יָֽדְ/ךָ֙ אֶל הָ/עַ֔י כִּ֥י בְ/יָדְ/ךָ֖ אֶתְּנֶ֑/נָּה וַ/יֵּ֧ט יְהוֹשֻׁ֛עַ בַּ/כִּיד֥וֹן אֲשֶׁר בְּ/יָד֖/וֹ אֶל הָ/עִֽיר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/018.yaml
  text: Then Yahweh said to Joshua[a], “Stretch out the javelin that is in your hand toward Ai, for I will give it into your hand.” So Joshua stretched out the javelin that was in his hand toward the city.
translation:
  language: de
  text: 'Da sagte Jahwe zu Josua: »Strecke den Speer[a], den du in der Hand hältst, in Richtung Ai aus, denn ich werde es in deine Hand geben.« Da streckte Josua den Speer, den er in der Hand hielt, in Richtung der Stadt aus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wurfspieß« oder »Lanze«. Das hebräische Wort bezeichnet eine Stich- oder Wurfwaffe; ihre genaue Form ist hier nicht sicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben, sodass der Eigenname des Bundesgottes im Deutschen erkennbar bleibt.
- source_word: נְטֵה / וַיֵּט (נטה)
  choice: strecke … aus / streckte … aus
  rationale: Die Wiedergabe bildet sowohl den Imperativ als auch seine erzählerische Ausführung ab und bewahrt die körperliche Geste, ohne sie auf ein bloßes Zeigen zu reduzieren.
- source_word: כִּידוֹן
  choice: Speer
  rationale: »Speer« ist im heutigen Deutsch natürlich und lässt die im Hebräischen nicht völlig eindeutige Waffenart offen; die engeren Möglichkeiten werden in der Fußnote genannt.
- source_word: אֲשֶׁר בְּיָדְךָ / אֲשֶׁר בְּיָדוֹ
  choice: in deiner Hand / in seiner Hand
  rationale: Die knappe deutsche Form gibt die hebräischen Relativwendungen vollständig und idiomatisch wieder.
- source_word: אֶל הָעַי / אֶל הָעִיר
  choice: in Richtung Ai / in Richtung der Stadt
  rationale: Die Richtungsangabe wird ohne die zusätzliche Bedeutung eines Angriffs wiedergegeben; zugleich bleibt der Wechsel vom Ortsnamen zu »der Stadt« erhalten.
- source_word: כִּי בְיָדְךָ אֶתְּנֶנָּה
  choice: denn ich werde es in deine Hand geben
  rationale: Die traditionelle Hand-Formel bleibt als Bild für die Übergabe in Josuas Gewalt erhalten. Das Futur entspricht dem noch ausstehenden Geschehen.
- source_word: אֶתְּנֶנָּה
  choice: es
  rationale: Das feminine hebräische Suffix bezieht sich sinngemäß auf die Stadt. Das neutrale deutsche Pronomen passt zum unmittelbar genannten Ai und bewahrt die knappe Ausdrucksweise.
theological_decisions:
- issue: Wiedergabe des Gottesnamens JHWH
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. Die Transliteration »Jahwe« bewahrt diesen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Wiederholung von »in seiner Hand« und der Wechsel von »Ai« zu »der Stadt« wurden entsprechend dem Hebräischen beibehalten.
