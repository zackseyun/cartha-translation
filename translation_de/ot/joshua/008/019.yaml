  text: וְ/הָ/אוֹרֵ֡ב קָם֩ מְהֵרָ֨ה מִ/מְּקוֹמ֤/וֹ וַ/יָּר֨וּצוּ֙ כִּ/נְט֣וֹת יָד֔/וֹ וַ/יָּבֹ֥אוּ הָ/עִ֖יר וַֽ/יִּלְכְּד֑וּ/הָ וַֽ/יְמַהֲר֔וּ וַ/יַּצִּ֥יתוּ אֶת הָ/עִ֖יר בָּ/אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/019.yaml
  text: Then the ambush rose quickly from its place and ran as soon as he stretched out his hand; they entered the city[a], captured it, and quickly set the city on fire.
translation:
  language: de
  text: Da erhoben sich die Männer im Hinterhalt schnell von ihrem Platz und liefen los, sobald er seine Hand ausstreckte.[a] Sie drangen in die Stadt ein, nahmen sie ein und setzten sie unverzüglich in Brand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »als er seine Hand ausstreckte«. Die hebräische Konstruktion bezeichnet den Zeitpunkt von Josuas Signal und lässt sowohl eine allgemein zeitliche als auch eine die Unmittelbarkeit betonende Wiedergabe zu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאוֹרֵב
  choice: die Männer im Hinterhalt
  rationale: Das substantivierte Partizip bezeichnet kollektiv die Truppe, die im Hinterhalt liegt. Die personale Wiedergabe ist im Deutschen natürlicher als »der Hinterhalt« und passt zu den folgenden pluralischen Verben.
- source_word: קָם מְהֵרָה מִמְּקוֹמוֹ
  choice: erhoben sich … schnell von ihrem Platz
  rationale: קום beschreibt hier das Aufstehen beziehungsweise Losschlagen der verborgenen Truppe; מְהֵרָה hebt die Schnelligkeit hervor. Der grammatisch singularische Rückbezug des Hebräischen wird im Deutschen sinngemäß an die personale Mehrzahl angepasst.
- source_word: וַיָּרֻצוּ
  choice: liefen los
  rationale: רוץ bedeutet grundlegend »laufen«. »Liefen los« bringt im Deutschen zugleich den Beginn der durch das Signal ausgelösten Bewegung zum Ausdruck, ohne die Handlung stärker als nötig auszudeuten.
- source_word: כִּנְטוֹת יָדוֹ
  choice: sobald er seine Hand ausstreckte
  rationale: Die Präposition כ mit dem Infinitiv constructus kennzeichnet den Zeitpunkt des Signals und kann in diesem Zusammenhang unmittelbare zeitliche Folge ausdrücken. Das Pronomen bleibt wie im Hebräischen unausgesprochen referenziert; aus dem Kontext ist Josua gemeint.
- source_word: וַיָּבֹאוּ הָעִיר
  choice: Sie drangen in die Stadt ein
  rationale: בוא mit der Stadt als Bewegungsziel bedeutet hier das Hineingehen. »Drangen … ein« ist im militärischen Zusammenhang natürlich und verdeutlicht den Eintritt, ohne zusätzliche Einzelheiten einzuführen.
- source_word: וַיִּלְכְּדוּהָ
  choice: nahmen sie ein
  rationale: לכד bezeichnet bei einer Stadt ihre Eroberung beziehungsweise Einnahme. »Nahmen sie ein« ist die übliche moderne deutsche Formulierung.
- source_word: וַיְמַהֲרוּ וַיַּצִּיתוּ אֶת־הָעִיר בָּאֵשׁ
  choice: setzten sie unverzüglich in Brand
  rationale: מהר betont die Eile, während der Hifil von יצת das Entzünden bezeichnet. Die adverbiale Wiedergabe »unverzüglich« erhält den raschen Erzählfluss; »in Brand setzen« gibt die kausative Bedeutung idiomatisch wieder.
theological_decisions: []
