base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/009.yaml
  text: So Joshua sent them[a], and they went to the ambush and stayed between Bethel and Ai, west of Ai. And Joshua spent that night among the people.
translation:
  language: de
  text: Da schickte Josua sie los. Sie gingen zum Hinterhalt[a] und hielten sich zwischen Bethel und Ai auf, westlich von Ai. Und Josua verbrachte jene Nacht mitten unter dem Volk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu der Truppe im Hinterhalt“. Das hebräische Wort kann sowohl die lauernde Truppe als auch den Hinterhalt beziehungsweise dessen Ort bezeichnen; der Zusammenhang legt hier besonders den Ort nahe, den die Männer einnahmen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלָחֵם
  choice: Da schickte Josua sie los
  rationale: שלח bedeutet hier schlicht „senden“. „Losschicken“ ist im modernen Deutschen natürlich und bringt den Beginn ihres Auftrags zum Ausdruck, ohne zusätzliche militärische Einzelheiten einzutragen.
- source_word: הַמַּאְרָב
  choice: zum Hinterhalt
  rationale: Das Substantiv kann sowohl den Hinterhalt als Stellung beziehungsweise Ort als auch die dort lauernde Truppe bezeichnen. Die knappe Wiedergabe bewahrt diese im Hebräischen vorhandene Bedeutungsbreite; eine Fußnote erläutert sie.
- source_word: וַיֵּשְׁבוּ
  choice: hielten sich … auf
  rationale: ישב kann „sitzen“, „bleiben“ oder „sich aufhalten“ bedeuten. Im militärischen Zusammenhang bezeichnet es hier das Einnehmen und Halten eines Ortes, ohne dass die stärker deutende Formulierung „bezogen Stellung“ nötig ist.
- source_word: בֵּין בֵּית אֵל וּבֵין הָעַי
  choice: zwischen Bethel und Ai
  rationale: Direkte geografische Angabe mit den im Deutschen üblichen Formen der Ortsnamen.
- source_word: מִיָּם לָעָי
  choice: westlich von Ai
  rationale: יָם bedeutet wörtlich „Meer“, bezeichnet in geografischen Richtungsangaben aber den Westen. „Westlich von Ai“ gibt den gemeinten Ort klar und idiomatisch wieder.
- source_word: וַיָּלֶן
  choice: verbrachte … die Nacht
  rationale: לון bezeichnet das Übernachten beziehungsweise Verbringen der Nacht. Diese Wiedergabe ist natürlich und legt nicht unnötig fest, ob Josua schlief.
- source_word: בַּלַּיְלָה הַהוּא
  choice: jene Nacht
  rationale: Die Formulierung gibt die rückverweisende Zeitangabe prägnant und in einem würdigen Erzählstil wieder.
- source_word: בְּתוֹךְ הָעָם
  choice: mitten unter dem Volk
  rationale: Die Wendung bezeichnet Josuas Aufenthalt inmitten der versammelten Menschen. „Volk“ bewahrt die allgemeine Bezeichnung des hebräischen Textes, statt sie auf „Soldaten“ einzuengen.
