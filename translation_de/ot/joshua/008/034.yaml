base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/034.yaml
  text: And afterward he read all the words of the law[a], the blessing and the curse[b], according to all that is written in the Book of the Law.
translation:
  language: de
  text: Danach las er alle Worte des Gesetzes[a] vor, den Segen und den Fluch, entsprechend allem, was im Buch des Gesetzes geschrieben steht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort Tora kann auch „Weisung“ bedeuten. Im Zusammenhang mit dem „Buch des Gesetzes“ passt hier die Wiedergabe „Gesetz“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַֽחֲרֵי כֵן
  choice: Danach
  rationale: Die Wendung bezeichnet die zeitliche Folge nach den zuvor erzählten Handlungen; „Danach“ gibt dies im modernen Deutschen knapp und natürlich wieder.
- source_word: קָרָא
  choice: las ... vor
  rationale: Mit „alle Worte des Gesetzes“ als direktem Objekt bezeichnet das Verb hier das öffentliche Vorlesen beziehungsweise Verkünden. „las ... vor“ macht den im Kontext liegenden öffentlichen Charakter deutlicher als das bloße „las“.
- source_word: אֶת כָּל דִּבְרֵי הַ/תּוֹרָה
  choice: alle Worte des Gesetzes
  rationale: „Worte“ bewahrt die konkrete Ausdrucksweise des Hebräischen. Tora kann auch „Weisung“ bedeuten; im Zusammenhang mit einer schriftlichen Bundesurkunde ist „Gesetz“ jedoch die passendste deutsche Wiedergabe.
- source_word: הַ/בְּרָכָה וְ/הַ/קְּלָלָה
  choice: den Segen und den Fluch
  rationale: Die Singularformen bezeichnen zusammenfassend die im Bund enthaltenen Segens- und Fluchbestimmungen. Die wörtliche Wiedergabe ist zugleich natürliches Deutsch.
- source_word: כְּ/כָל הַ/כָּתוּב
  choice: ganz so, wie es ... geschrieben steht
  rationale: Die Formulierung drückt aus, dass das Vorlesen vollständig dem geschriebenen Wort entsprach. „geschrieben steht“ ist die übliche deutsche Wendung für einen weiterhin maßgeblichen Text.
- source_word: בְּ/סֵפֶר הַ/תּוֹרָה
  choice: im Buch des Gesetzes
  rationale: Sefer bezeichnet hier die schriftliche Urkunde beziehungsweise Schriftrolle. „Buch des Gesetzes“ ist klar und bewahrt die Verbindung zur ersten Nennung der Tora.
