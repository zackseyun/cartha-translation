  text: רַ֣ק הַ/בְּהֵמָ֗ה וּ/שְׁלַל֙ הָ/עִ֣יר הַ/הִ֔יא בָּזְז֥וּ לָ/הֶ֖ם יִשְׂרָאֵ֑ל כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֥ר צִוָּ֖ה אֶת יְהוֹשֻֽׁעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/027.yaml
  text: Only the livestock and the spoil of that city Israel took as plunder for themselves[b][a], according to the word of Yahweh that he had commanded Joshua.
translation:
  language: de
  text: Nur das Vieh und die Beute jener Stadt eignete Israel sich als Beute an, nach dem Wort Jahwes, das er Josua geboten hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: Nur
  rationale: Kennzeichnet die Ausnahme von der zuvor geschilderten Vernichtung und bewahrt die vorangestellte Einschränkung des Hebräischen.
- source_word: הַבְּהֵמָה
  choice: das Vieh
  rationale: Bezeichnet hier die als Kriegsbeute genommenen Nutz- und Haustiere; „Vieh“ ist ein natürlicher deutscher Sammelbegriff.
- source_word: וּשְׁלַל הָעִיר הַהִיא
  choice: und die Beute jener Stadt
  rationale: שָׁלָל bezeichnet im Krieg erbeutete Güter; „jener Stadt“ gibt die demonstrative Bestimmtheit knapp wieder.
- source_word: בָּזְזוּ לָהֶם
  choice: nahm ... für sich als Beute
  rationale: Das Verb bezeichnet das Erbeuten oder Plündern; לָהֶם zeigt an, dass Israel das Genommene für sich behielt. Die Formulierung erhält den militärischen Sinn, ohne die Stadt selbst als direktes Objekt des Plünderns erscheinen zu lassen.
- source_word: כִּדְבַר יְהוָה אֲשֶׁר צִוָּה אֶת יְהוֹשֻׁעַ
  choice: wie Jahwe es Josua geboten hatte
  rationale: Gibt die Übereinstimmung mit dem zuvor ergangenen Wort beziehungsweise Gebot idiomatisch wieder; das Plusquamperfekt markiert dessen zeitliche Vorordnung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text bietet den Eigennamen JHWH. „Jahwe“ gibt ihn im modernen Standarddeutsch als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug von אֲשֶׁר im Ausdruck כִּדְבַר יְהוָה אֲשֶׁר צִוָּה
  choice: wie Jahwe es Josua geboten hatte
  alternative: nach dem Wort Jahwes, das er Josua geboten hatte
  rationale: Die deutsche Formulierung fasst den Sinn natürlich als Übereinstimmung mit Jahwes Gebot. Sie vermeidet die im Deutschen schwerfällige Vorstellung, ein „Wort“ sei Josua „geboten“ worden, ohne den Inhalt theologisch auszuweiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Voranstellung mit „Nur“ bewahrt den Kontrast zum vorausgehenden Vernichtungsbericht. Die Wiederholung von „Beute“ spiegelt die hebräische Verbindung von שָׁלָל und בזז und bleibt im Deutschen verständlich.
