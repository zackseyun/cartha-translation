  terminology: „Hinterhalt“ und „bereit“ sind treffend. „Seht“ ist als knapper Aufmerksamkeitsruf angemessen. „legt euch ... in einen Hinterhalt“ ist die im Deutschen übliche militärische Ausdrucksweise und vermeidet eine unnatürliche Konstruktion mit Dativobjekt („der Stadt ... einen Hinterhalt legen“).
