  source_fidelity: 'Der Entwurf gibt den hebräischen Satz insgesamt zuverlässig wieder: Josua befiehlt einer Gruppe, sich hinter der Stadt als Hinterhalt zu positionieren, nicht weit wegzugehen und bereit zu sein. „von der Rückseite her“ trifft מֵאַחֲרֵי zwar grundsätzlich, ist jedoch im Deutschen weniger idiomatisch als „hinter der Stadt“ und schwächt die direkte räumliche Entsprechung. Das englische Audit bestätigt ebenfalls „behind the city“ und enthält keine abweichenden lexikalischen Entscheidungen.'
