  text: וְ/אֶת מֶ֧לֶךְ הָ/עַ֛י תָּלָ֥ה עַל הָ/עֵ֖ץ עַד עֵ֣ת הָ/עָ֑רֶב וּ/כְ/ב֣וֹא הַ/שֶּׁמֶשׁ֩ צִוָּ֨ה יְהוֹשֻׁ֜עַ וַ/יֹּרִ֧ידוּ אֶת נִבְלָת֣/וֹ מִן הָ/עֵ֗ץ וַ/יַּשְׁלִ֤יכוּ אוֹתָ/הּ֙ אֶל פֶּ֨תַח֙ שַׁ֣עַר הָ/עִ֔יר וַ/יָּקִ֤ימוּ עָלָי/ו֙ גַּל אֲבָנִ֣ים גָּד֔וֹל עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/029.yaml
  text: And he hanged the king of Ai on a tree until evening[a]. And at sunset Joshua commanded, and they took his corpse down from the tree and threw it at the entrance of the city gate[b], and they raised over him a large heap of stones that remains to this day.
translation:
  language: de
  text: Josua hängte den König von Ai bis zum Abend an den Baum.[a] Als die Sonne unterging,[b] gab Josua den Befehl, und sie nahmen seinen Leichnam vom Baum herunter, warfen ihn am Eingang des Stadttores hin und errichteten über ihm einen großen Steinhaufen, der bis zum heutigen Tag besteht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb bedeutet „aufhängen“ oder „hängen lassen“; ob der König dadurch getötet oder nach seinem Tod öffentlich aufgehängt wurde, wird hier nicht ausdrücklich gesagt.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „als die Sonne kam“; gemeint ist ihr Untergang.'
    reason: idiom
lexical_decisions:
- source_word: תָּלָה
  choice: hängte … an
  rationale: Das Verb bezeichnet das Aufhängen beziehungsweise Aufhängenlassen. Die deutsche Formulierung wahrt, anders als „pfählte“, die fehlende Spezifizierung der genauen Hinrichtungs- oder Zurschaustellungsart.
- source_word: הָעֵץ
  choice: einen Baum
  rationale: עֵץ bedeutet gewöhnlich „Baum“ oder „Holz“. „Baum“ gibt den schlichten hebräischen Ausdruck natürlich wieder, ohne eine bestimmte Holzkonstruktion vorauszusetzen.
- source_word: עַד עֵת הָעָרֶב
  choice: bis zum Abend
  rationale: Dies gibt die Zeitangabe vollständig und in natürlichem modernem Deutsch wieder.
- source_word: וּכְבֹא הַשֶּׁמֶשׁ
  choice: als die Sonne unterging
  rationale: Die hebräische Wendung bezeichnet idiomatisch den Sonnenuntergang; die Satzform wahrt zugleich die zeitliche Nebensatzstruktur.
- source_word: נִבְלָתוֹ
  choice: seinen Leichnam
  rationale: נְבֵלָה bezeichnet den toten Körper. „Leichnam“ bewahrt die Deutlichkeit des Ausgangstextes, klingt aber im Deutschen würdevoller und natürlicher als „Kadaver“.
- source_word: וַיַּשְׁלִיכוּ אוֹתָהּ
  choice: warfen ihn
  rationale: Das feminine hebräische Suffix bezieht sich grammatisch auf נְבֵלָה. Im Deutschen richtet sich das Pronomen nach dem maskulinen „Leichnam“.
- source_word: פֶּתַח שַׁעַר הָעִיר
  choice: an den Eingang des Stadttores
  rationale: Die Wiedergabe erhält sowohl „Eingang/Öffnung“ als auch „Stadttor“ und bezeichnet den Bereich unmittelbar am Torzugang.
- source_word: גַּל אֲבָנִים גָּדוֹל
  choice: einen großen Steinhaufen
  rationale: Die Formulierung ist genau, anschaulich und allgemein verständlich.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: bis zum heutigen Tag
  rationale: Die übliche deutsche Wendung gibt die Fortdauer bis in die Erzählgegenwart wieder; „dort liegt“ ergänzt natürlich das im Hebräischen unausgesprochene Fortbestehen.
theological_decisions:
- issue: Subjekt des ersten Satzes
  choice: Josua als ausdrücklich genanntes Subjekt
  alternative: Ein unbestimmtes „er“ oder ein kollektives „sie“
  rationale: Das hebräische Verb steht in der 3. Person Singular maskulin, ohne dass das Subjekt im ersten Teilsatz ausdrücklich genannt wird. Im Zusammenhang ist Josua der naheliegende Bezug; seine ausdrückliche Nennung im Deutschen verhindert ein unklar einsetzendes „er“, ohne eine lehrmäßige Aussage hinzuzufügen.
- issue: Art des Aufhängens
  choice: Neutral als „hängte … an einen Baum“ wiedergegeben
  alternative: „hinrichten“ oder „pfählen“
  rationale: Der hebräische Ausdruck legt nicht eindeutig fest, ob das Aufhängen selbst die Todesart war oder ob der bereits getötete König öffentlich aufgehängt wurde. Die Übersetzung hält diese Spannung offen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzfolge bleibt nah am hebräischen Bericht, während schwerfällige Wiederholungen vermieden werden. Die Formulierung macht weder die genaue Hinrichtungsart noch eine Pfählung ausdrücklich, da der Ausgangstext dies offenlässt.
