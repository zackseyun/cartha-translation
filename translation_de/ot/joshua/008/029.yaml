  to: Josua hängte den König von Ai bis zum Abend an den Baum.[a] Als die Sonne unterging,[b] gab Josua den Befehl, und sie nahmen seinen Leichnam vom Baum herunter, warfen ihn am Eingang des Stadttores hin und errichteten über ihm einen großen Steinhaufen, der bis zum heutigen Tag besteht.
