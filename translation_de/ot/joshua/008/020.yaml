base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/020.yaml
  text: Then the men of Ai turned behind them and looked[a], and behold, the smoke of the city was going up to the sky, and there was no power in them to flee this way or that[c][b]. And the people who had fled to the wilderness turned back against the pursuer.
translation:
  language: de
  text: Da wandten sich die Männer von Ai um und blickten hinter sich. Und siehe, der Rauch der Stadt stieg zum Himmel empor[a]. Sie hatten keine Kraft, hierhin oder dorthin zu fliehen[b]. Das Volk aber, das in Richtung Wüste geflohen war, wandte sich gegen den Verfolger[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „himmelwärts“. Gemeint ist hier der sichtbare Himmel.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Hebräische sagt wörtlich: „Es waren keine Hände in ihnen.“ Dieses Idiom bedeutet, dass ihnen jede Kraft oder Möglichkeit zur Flucht fehlte.'
    reason: cultural_note
  - marker: c
    text: Im Hebräischen steht „der Verfolger“ im Singular; der Ausdruck kann hier kollektiv die verfolgende Streitmacht bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ אַנְשֵׁי הָעַי אַחֲרֵיהֶם וַיִּרְאוּ
  choice: Da wandten sich die Männer von Ai um und blickten hinter sich
  rationale: Die beiden aufeinanderfolgenden Handlungen – sich umwenden und schauen – bleiben unterschieden. „Männer von Ai“ gibt den militärischen Kontext und die Formulierung des Hebräischen direkt wieder.
- source_word: וְהִנֵּה
  choice: Und siehe
  rationale: Die traditionelle, weiterhin verständliche Erzählformel bewahrt die aufmerksamkeitslenkende und überraschende Wirkung des hebräischen Ausdrucks.
- source_word: עָלָה עֲשַׁן הָעִיר הַשָּׁמַיְמָה
  choice: der Rauch der Stadt stieg zum Himmel empor
  rationale: Die Formulierung gibt die Aufwärtsbewegung natürlich und würdig wieder. „Himmel“ bezeichnet hier zunächst den sichtbaren Himmel; die Richtungsform des Hebräischen wird in einer Fußnote erläutert.
- source_word: וְלֹא הָיָה בָהֶם יָדַיִם
  choice: Sie hatten keine Kraft
  rationale: Die wörtliche Wendung „es waren keine Hände in ihnen“ ist ein Idiom für fehlende Macht oder Handlungsfähigkeit. „Keine Kraft“ ist im Deutschen verständlich und bewahrt den Gedanken völliger Unfähigkeit.
- source_word: לָנוּס הֵנָּה וָהֵנָּה
  choice: hierhin oder dorthin zu fliehen
  rationale: Die gepaarten Richtungsadverbien werden nah am Hebräischen und zugleich idiomatisch wiedergegeben.
- source_word: וְהָעָם הַנָּס הַמִּדְבָּר
  choice: Das Volk aber, das in Richtung Wüste geflohen war
  rationale: Das Plusquamperfekt verdeutlicht, dass die zuvor fliehende Gruppe nun ihre Richtung ändert. „In Richtung Wüste“ wahrt die Zielrichtung des hebräischen Ausdrucks.
- source_word: נֶהְפַּךְ אֶל הָרֹדֵף
  choice: wandte sich gegen den Verfolger
  rationale: „Gegen“ macht im Kampfzusammenhang die feindliche Umkehr deutlich. Der grammatische Singular „Verfolger“ bleibt im Haupttext erhalten, ohne seine wahrscheinlich kollektive Bedeutung festzuschreiben.
