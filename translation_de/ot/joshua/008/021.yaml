source:
  edition: WLC
  text: וִ/יהוֹשֻׁ֨עַ וְ/כָֽל יִשְׂרָאֵ֜ל רָא֗וּ כִּֽי לָכַ֤ד הָֽ/אֹרֵב֙ אֶת הָ/עִ֔יר וְ/כִ֥י עָלָ֖ה עֲשַׁ֣ן הָ/עִ֑יר וַ/יָּשֻׁ֕בוּ וַ/יַּכּ֖וּ אֶת אַנְשֵׁ֥י הָ/עָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/021.yaml
  text: When Joshua and all Israel saw that the ambush had captured the city and that the smoke of the city had gone up[a], they turned back and struck down the men of Ai.
translation:
  language: de
  text: Als Josua und ganz Israel sahen, dass die Truppe im Hinterhalt[a] die Stadt eingenommen hatte und dass der Rauch der Stadt aufstieg, wandten sie sich um und schlugen die Männer von Ai nieder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »der im Hinterhalt Liegende«; die Form bezeichnet hier kollektiv die im Hinterhalt liegende Streitmacht. Auch möglich: »die Männer im Hinterhalt«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאוּ
  choice: sahen
  rationale: Das gewöhnliche Verb für Sehen und Wahrnehmen wird konkret wiedergegeben; die folgenden mit כִּי eingeleiteten Sätze nennen den Inhalt dessen, was sie sahen.
- source_word: כִּי ... וְכִי
  choice: dass ... und dass
  rationale: Die Konjunktionen führen hier den Inhalt des Sehens ein. Die Wiederholung bleibt im Deutschen erhalten.
- source_word: לָכַד
  choice: eingenommen hatte
  rationale: לכד bezeichnet das Erobern oder Einnehmen. Das Plusquamperfekt macht deutlich, dass die Einnahme der Stadt dem Wahrnehmen durch Josua und Israel vorausging.
- source_word: הָאֹרֵב
  choice: die Truppe im Hinterhalt
  rationale: Das substantivierte Partizip bezeichnet kollektiv die im Hinterhalt liegende Streitmacht. Diese Wiedergabe ist im modernen Deutschen klarer als die metonymische Formulierung „der Hinterhalt“.
- source_word: הָעִיר
  choice: die Stadt
  rationale: Direkte und natürliche Wiedergabe des bestimmten Substantivs; die Wiederholung der hebräischen Vorlage bleibt erhalten.
- source_word: עָלָה עֲשַׁן הָעִיר
  choice: der Rauch der Stadt aufstieg
  rationale: Die Formulierung bewahrt das Bild der nach oben steigenden Rauchsäule und folgt der hebräischen Wortverbindung eng.
- source_word: וַיָּשֻׁבוּ
  choice: wandten sie sich um
  rationale: Im Kampfzusammenhang bezeichnet שוב hier eine Richtungsumkehr, um den Gegner erneut anzugreifen.
- source_word: וַיַּכּוּ
  choice: schlugen ... nieder
  rationale: נכה bezeichnet im Krieg das Schlagen, häufig mit tödlichem Ausgang. „Niederschlagen“ bewahrt die kriegerische Stärke, ohne das Ergebnis stärker festzulegen als der unmittelbare Wortlaut.
- source_word: אַנְשֵׁי הָעָי
  choice: die Männer von Ai
  rationale: אַנְשֵׁי bedeutet wörtlich „Männer von“. Der militärische Zusammenhang erlaubt die Wiedergabe „Krieger“, verlangt sie aber nicht.
