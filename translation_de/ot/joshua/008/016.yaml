  text: And all the people who were in the city were called out to pursue them[b][a], and they pursued Joshua and were drawn away from the city.
translation:
  language: de
  text: Da wurden alle Leute, die in der Stadt waren, dazu aufgerufen, ihnen nachzusetzen.[a] Sie verfolgten Josua und wurden von der Stadt weggezogen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Alle Leute, die in der Stadt waren, schrien auf, um ihnen nachzusetzen.“ Das hebräische Verb kann ein Schreien bezeichnen, hier aber auch das Aufrufen zum Verfolgen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „wurden von der Stadt getrennt“ oder „losgerissen“. Das hebräische Wort beschreibt, dass sie von der Stadt weggeführt und so von ihr getrennt wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזָּעֲקוּ
  choice: Da wurde … zusammengerufen
  rationale: Der Nifal von זעק kann hier im militärischen Zusammenhang das Zusammenrufen beziehungsweise Mobilisieren bezeichnen. Die passive Form des Hebräischen bleibt erhalten; die mögliche Bedeutung „aufschreien“ wird in einer Fußnote genannt.
- source_word: כָּל הָעָם אֲשֶׁר בָּעִיר
  choice: das ganze Volk in der Stadt
  rationale: עָם wird breit als „Volk“ wiedergegeben, ohne es über den hebräischen Wortlaut hinaus auf Männer oder Soldaten einzuschränken.
- source_word: לִרְדֹּף אַחֲרֵיהֶם
  choice: um ihnen nachzujagen
  rationale: רדף mit אחרי bezeichnet das Verfolgen oder Nachjagen. „Nachjagen“ passt natürlich zur erzählenden Kriegsszene.
- source_word: וַיִּרְדְּפוּ אַחֲרֵי יְהוֹשֻׁעַ
  choice: Sie jagten Josua nach
  rationale: Die Wiederholung desselben hebräischen Verbs wird im Deutschen durch die erneute Verwendung von „nachjagen“ sichtbar gemacht. Der Wechsel vom pluralischen Objekt „ihnen“ zu Josua bleibt bestehen.
- source_word: וַיִּנָּתְקוּ מִן הָעִיר
  choice: wurden von der Stadt weggezogen
  rationale: Der Nifal von נתק bezeichnet ein Losreißen, Trennen oder Wegziehen. „Weggezogen“ bewahrt das passive Bild und die taktische Folge, ohne eindeutig festzulegen, ob ein Locken oder ein gewaltsames Trennen gemeint ist.
- source_word: יְהוֹשֻׁעַ
  choice: Josua
  rationale: Der Personenname wird nach der etablierten deutschen Bibeltradition wiedergegeben.
