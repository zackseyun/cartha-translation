base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/031.yaml
  text: just as Moses the servant of Yahweh had commanded the sons of Israel[a], as it is written in the Book of the Law of Moses, an altar of whole stones, on which no iron tool had been wielded[b]; and they offered up burnt offerings on it to Yahweh and sacrificed peace offerings.
translation:
  language: de
  text: 'so, wie Mose, der Diener Jahwes, es den Söhnen Israels geboten hatte, wie es im Buch der Weisung des Mose geschrieben steht: einen Altar aus unversehrten Steinen[a], auf die kein Eisenwerkzeug angesetzt worden war. Darauf brachten sie Jahwe Brandopfer dar und schlachteten Friedensopfer[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „unbehauenen Steinen“. Wörtlich steht im Hebräischen „unversehrten“ oder „ganzen Steinen“; gemeint sind Steine, die nicht mit Eisen bearbeitet wurden.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „Gemeinschaftsopfer“ oder „Heilsopfer“. Der hebräische Ausdruck kann Frieden, Wohlergehen und Gemeinschaft anklingen lassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר צִוָּה
  choice: so, wie … geboten hatte
  rationale: Gibt die Übereinstimmung mit dem früher erteilten Gebot und dessen Vorzeitigkeit im Erzählzusammenhang natürlich wieder.
- source_word: עֶבֶד יְהוָה
  choice: der Diener Jahwes
  rationale: „Diener“ entspricht dem ehrenden Titel des Mose; „Jahwe“ gibt den göttlichen Eigennamen wieder.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: den Söhnen Israels
  rationale: Bewahrt die familiär-korporative Ausdrucksweise des Hebräischen.
- source_word: בְּסֵפֶר תּוֹרַת מֹשֶׁה
  choice: im Buch der Weisung des Mose
  rationale: „Weisung“ bildet das Bedeutungsspektrum von תּוֹרָה hier genauer ab als eine ausschließlich rechtliche Verengung auf „Gesetz“.
- source_word: מִזְבַּח אֲבָנִים שְׁלֵמוֹת
  choice: einen Altar aus unversehrten Steinen
  rationale: שְׁלֵמוֹת bezeichnet vollständige, intakt belassene Steine; „unversehrt“ erhält dieses Bild, während „unbehauen“ die Folgeklausel bereits auslegt.
- source_word: לֹא הֵנִיף עֲלֵיהֶן בַּרְזֶל
  choice: über die kein Eisen geschwungen worden war
  rationale: Bewahrt das konkrete hebräische Bild des über den Steinen geführten Eisens und bleibt im Deutschen verständlich.
- source_word: וַיַּעֲלוּ עָלָיו עֹלוֹת
  choice: Darauf brachten sie … Brandopfer dar
  rationale: „Brandopfer darbringen“ ist eine natürliche deutsche Opferformel und bezeichnet die Opferart eindeutig.
- source_word: וַיִּזְבְּחוּ שְׁלָמִים
  choice: und schlachteten Friedensopfer
  rationale: Das Verb „schlachten“ gibt זבח konkret wieder; „Friedensopfer“ ist ein etablierter Ausdruck, ohne das breitere Bedeutungsspektrum des Opfernamens zu verschweigen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH; „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Korporative Bezeichnung בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  alternative: Israeliten / Volk Israel
  rationale: Die gewählte Form bewahrt die ausdrücklich familiäre Gestalt des hebräischen Ausdrucks, ohne über die Zusammensetzung der angesprochenen Gemeinschaft hinausgehende Aussagen zu machen.
- issue: Bedeutung von שְׁלָמִים
  choice: Friedensopfer
  alternative: Gemeinschaftsopfer / Heilsopfer
  rationale: „Friedensopfer“ wahrt den traditionellen Opferbegriff; eine Fußnote hält die Bedeutungsweite zwischen Frieden, Wohlergehen und Gemeinschaft offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers setzt syntaktisch den vorangehenden Vers fort; der kleingeschriebene Beginn und der Doppelpunkt bewahren diesen Anschluss. Opferterminologie bleibt präzise, während Fußnoten echte lexikalische Alternativen offenhalten.
