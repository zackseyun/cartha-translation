id: JOS.8.28
reference: Joshua 8:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּשְׂרֹ֥ף יְהוֹשֻׁ֖עַ אֶת הָ/עָ֑י וַ/יְשִׂימֶ֤/הָ תֵּל עוֹלָם֙ שְׁמָמָ֔ה עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/028.yaml
  text: So Joshua burned Ai and made it a permanent mound[a], a desolation to this day.
translation:
  language: de
  text: Josua verbrannte Ai und machte es zu einem Trümmerhügel für alle Zeiten[a], zu einer Einöde bis auf den heutigen Tag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu einem Trümmerhügel auf unabsehbare Zeit“. Das hebräische Wort עוֹלָם kann eine sehr lange oder zeitlich nicht näher begrenzte Dauer bezeichnen und wird häufig mit „ewig“ oder „für immer“ wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂרֹף
  choice: verbrannte
  rationale: Das Verb שׂרף bezeichnet das Verbrennen durch Feuer; „verbrannte“ ist hier natürlich und wahrt die Erzählfolge.
- source_word: הָעָי
  choice: Ai
  rationale: Der Ortsname wird in seiner im Deutschen üblichen transliterierten Form wiedergegeben.
- source_word: וַיְשִׂימֶהָ
  choice: machte es zu
  rationale: שׂים mit femininem Objektsuffix hat hier resultative Bedeutung; „machte es zu“ verbindet die beiden folgenden Prädikatsangaben idiomatisch.
- source_word: תֵּל
  choice: Trümmerhügel
  rationale: תֵּל bezeichnet einen Hügel beziehungsweise Schutthügel aus den Überresten einer zerstörten Siedlung. „Trümmerhügel“ macht diesen Zusammenhang klar, ohne zusätzliche Deutung einzutragen.
- source_word: עוֹלָם
  choice: für alle Zeiten
  rationale: עוֹלָם bezeichnet hier eine unbegrenzt lange beziehungsweise dauerhafte Zeitspanne. Die Formulierung bewahrt die starke zeitliche Aussage, ohne zwingend metaphysische Ewigkeit zu behaupten.
- source_word: שְׁמָמָה
  choice: Einöde
  rationale: Das Substantiv bezeichnet einen verwüsteten, öden Zustand; „Einöde“ ist knapp, würdig und als zweite Prädikatsangabe verständlich.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: bis auf den heutigen Tag
  rationale: Die feste Wendung besagt, dass der Zustand bis in die Gegenwart des Erzählers fortbestand; die deutsche Formulierung entspricht diesem zeitlichen Sinn.
theological_decisions: []
