  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstruktur hält die zwei hebräischen Prädikatsangaben zusammen; die Fußnote bewahrt die Bedeutungsbreite von עוֹלָם.
