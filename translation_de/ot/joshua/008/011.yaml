base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/011.yaml
  text: And all the fighting people who were with him went up and approached[a], and they came before the city and camped north of Ai, with the valley between him and Ai.
translation:
  language: de
  text: Das ganze Kriegsvolk, das bei ihm war, zog hinauf und rückte heran. Sie kamen vor die Stadt und lagerten nördlich von Ai, wobei das Tal zwischen ihm[a] und Ai lag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zwischen ihm und Ai“. Das singularische Pronomen bezieht sich wahrscheinlich auf Josua; möglich ist auch ein kollektiver Sinn: „zwischen ihnen und Ai“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָל הָעָם הַמִּלְחָמָה
  choice: das ganze Kriegsvolk
  rationale: Die Wendung bezeichnet die Gesamtheit der Kämpfenden, nicht die gesamte Zivilbevölkerung. „Kriegsvolk“ bewahrt den kollektiven Sinn von עָם, ohne eine im Hebräischen nicht ausdrücklich vorhandene Beschränkung auf Männer einzutragen.
- source_word: אֲשֶׁר אִתּוֹ
  choice: das bei ihm war
  rationale: Der Relativsatz bezeichnet die Truppen, die Josua begleiteten.
- source_word: עָלוּ
  choice: zog hinauf
  rationale: עלה bezeichnet zunächst eine Aufwärtsbewegung; „hinaufziehen“ ist im militärischen Zusammenhang natürlich, ohne die Richtung auszublenden.
- source_word: וַיִּגְּשׁוּ
  choice: rückte heran
  rationale: נגשׁ bedeutet, sich zu nähern. „Heranrücken“ gibt im militärischen Zusammenhang die Bewegung zur Stadt treffend wieder.
- source_word: וַיָּבֹאוּ נֶגֶד הָעִיר
  choice: Sie kamen vor die Stadt
  rationale: נֶגֶד bezeichnet eine Lage gegenüber oder vor etwas. Die Wiedergabe bewahrt, dass das Heer die Stadt nicht betrat, sondern ihr gegenüber Stellung bezog.
- source_word: וַיַּחֲנוּ
  choice: lagerten
  rationale: חנה ist das übliche Verb für das Aufschlagen eines Lagers.
- source_word: מִצְּפוֹן לָעַי
  choice: nördlich von Ai
  rationale: Die Präpositionalwendung bezeichnet die Lage des Lagers relativ zu Ai.
- source_word: הַגַּי
  choice: das Tal
  rationale: גַּי kann ein Tal oder eine Schlucht bezeichnen. „Tal“ ist die breite, hier nicht unnötig spezifizierende Wiedergabe.
- source_word: בֵּינוֹ וּבֵין הָעָי
  choice: zwischen ihm und Ai
  rationale: Der masoretische Text enthält ein maskulines Singularsuffix. Die schwierige Einzahl wird im Haupttext bewahrt und nicht stillschweigend kollektiv gedeutet.
