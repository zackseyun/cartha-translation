revisions:
- from: Als Israel alle Einwohner von Ai getötet hatte, die sich auf dem freien Feld, in der Wildnis, befanden, wohin sie sie verfolgt hatten, und als sie alle durch die Schärfe des Schwertes gefallen waren, bis keiner mehr übrig war[a], kehrte ganz Israel nach Ai zurück und schlug die Stadt mit der Schärfe des Schwertes.
  to: Als Israel alle Einwohner von Ai auf dem Feld in der Wildnis getötet hatte, auf dem Israel ihnen nachgesetzt hatte, und sie alle durch die Schneide des Schwertes gefallen waren, bis sie vollständig aufgerieben waren[a], kehrte ganz Israel nach Ai zurück und schlug die Stadt mit der Schneide des Schwertes.
  rationale: Die Revision korrigiert die lokale, nicht direktionale Bedeutung der Relativkonstruktion, glättet die deutsche Syntax und ersetzt die weniger natürliche „Schärfe“ durch „Schneide“. Die Abfolge, die Totalität der Tötung und der Bezug des abschließenden Pronomens auf die Stadt Ai bleiben erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T09:40:27Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Grundstruktur und die ausdrückliche Gewalt des hebräischen Textes werden zutreffend wiedergegeben. Korrekturbedarf besteht bei אֲשֶׁר רְדָפוּם בּוֹ: Das lokale בּוֹ bezeichnet den Ort der Verfolgung; „wohin“ macht daraus unzutreffend eine Zielrichtung. Die Formulierung „die sich ... befanden“ ist zudem eine unnötige Umformung des Bezugs von „Einwohner von Ai“ auf den Ort der Tötung.'
  naturalness: Der Satz ist grundsätzlich verständlich, doch „die sich auf dem freien Feld, in der Wildnis, befanden, wohin ...“ ist syntaktisch schwerfällig und missverständlich. „auf dem Feld in der Wildnis, auf dem Israel ihnen nachgesetzt hatte“ ist idiomatischer und gibt die lokale Relation präziser wieder. „Schneide des Schwertes“ ist im modernen Deutschen die natürlichere Entsprechung des Waffenidioms als „Schärfe des Schwertes“.
  terminology: „Ai“, „Israel“, „Einwohner“, „Wildnis“ und die unverhüllten Verben des Tötens sind angemessen. „Vollständig aufgerieben“ gibt den totalisierenden Abschluss in עַד תֻּמָּם klar wieder, ohne eine weitergehende Deutung einzutragen.
  issues:
  - severity: medium
    issue: „wohin sie sie verfolgt hatten“ übersetzt die lokale hebräische Konstruktion als Zielbewegung.
    rationale: אֲשֶׁר רְדָפוּם בּוֹ bedeutet wörtlich sinngemäß „in dem/in ihr sie ihnen nachgesetzt hatten“. Der Relativbezug ist örtlich, nicht direktional.
  - severity: low
    issue: „die sich ... befanden“ verschiebt die Satzstruktur und belastet die Lesbarkeit.
    rationale: Der hebräische Text lokalisiert das Töten der Einwohner; er formuliert keinen eigenständigen Relativsatz über ihren Aufenthaltsstatus. Eine direkte Ortsangabe beim Verb „getötet“ ist genauer und natürlicher.
  - severity: low
    issue: „Schärfe des Schwertes“ ist weniger idiomatisch als „Schneide des Schwertes“.
    rationale: Die „Schneide“ bezeichnet im Deutschen konkret die schneidende Kante einer Klinge und bewahrt das hebräische Bild von לְפִי חֶרֶב besser.
  revised_text: Als Israel alle Einwohner von Ai auf dem Feld in der Wildnis getötet hatte, auf dem Israel ihnen nachgesetzt hatte, und sie alle durch die Schneide des Schwertes gefallen waren, bis sie vollständig aufgerieben waren[a], kehrte ganz Israel nach Ai zurück und schlug die Stadt mit der Schneide des Schwertes.
  revised_footnotes:
  - marker: a
    text: 'Oder: „bis sie völlig vernichtet waren“; wörtlich etwa: „bis zu ihrem vollständigen Ende“.'
    reason: Die knappe Wendung עַד תֻּמָּם betont das vollständige Ende der verfolgten Gruppe. Die genaue deutsche Ausgestaltung kann zwischen dem Bild des Aufreibens und einer expliziteren Vernichtungsformulierung variieren.
  revision_rationale: Die Revision korrigiert die lokale, nicht direktionale Bedeutung der Relativkonstruktion, glättet die deutsche Syntax und ersetzt die weniger natürliche „Schärfe“ durch „Schneide“. Die Abfolge, die Totalität der Tötung und der Bezug des abschließenden Pronomens auf die Stadt Ai bleiben erhalten.
