source:
  edition: WLC
  text: וַ/יְהִ֣י כְּ/כַלּ֣וֹת יִשְׂרָאֵ֡ל לַ/הֲרֹג֩ אֶת כָּל יֹשְׁבֵ֨י הָ/עַ֜י בַּ/שָּׂדֶ֗ה בַּ/מִּדְבָּר֙ אֲשֶׁ֣ר רְדָפ֣וּ/ם בּ֔/וֹ וַֽ/יִּפְּל֥וּ כֻלָּ֛/ם לְ/פִי חֶ֖רֶב עַד תֻּמָּ֑/ם וַ/יָּשֻׁ֤בוּ כָל יִשְׂרָאֵל֙ הָ/עַ֔י וַ/יַּכּ֥וּ אֹתָ֖/הּ לְ/פִי חָֽרֶב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/024.yaml
  text: And it happened that when Israel had finished killing all the inhabitants of Ai in the field[a], in the wilderness where they had pursued them, and all of them had fallen by the edge of the sword until they were finished off, then all Israel returned to Ai and struck it with the edge of the sword.
translation:
  language: de
  text: Als Israel alle Einwohner von Ai auf dem Feld in der Wildnis getötet hatte, auf dem Israel ihnen nachgesetzt hatte, und sie alle durch die Schneide des Schwertes gefallen waren, bis sie vollständig aufgerieben waren[a], kehrte ganz Israel nach Ai zurück und schlug die Stadt mit der Schneide des Schwertes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bis sie völlig vernichtet waren“; wörtlich etwa: „bis zu ihrem vollständigen Ende“.'
    reason: Die knappe Wendung עַד תֻּמָּם betont das vollständige Ende der verfolgten Gruppe. Die genaue deutsche Ausgestaltung kann zwischen dem Bild des Aufreibens und einer expliziteren Vernichtungsformulierung variieren.
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת
  choice: Als ... getötet hatte
  rationale: Die Verbindung aus וַיְהִי und dem Infinitiv mit כ eröffnet eine zeitliche Nebensatzkonstruktion. Im Deutschen gibt das Plusquamperfekt die abgeschlossene Handlung vor der Rückkehr nach Ai natürlich wieder; ein gesondertes „Und es geschah“ wäre schwerfällig.
- source_word: לַהֲרֹג
  choice: getötet hatte
  rationale: הרג bezeichnet ausdrücklich das Töten. Die Wiedergabe bewahrt die Härte des Berichts und schwächt sie nicht zu „besiegt“ ab.
- source_word: יֹשְׁבֵי הָעַי
  choice: Einwohner von Ai
  rationale: Das substantivierte Partizip von ישב bezeichnet die Bewohner der Stadt. „Einwohner“ ist präzises und gegenwärtiges Standarddeutsch.
- source_word: בַּשָּׂדֶה
  choice: auf dem freien Feld
  rationale: שדה bezeichnet hier das Gelände außerhalb der Stadt. „Auf dem freien Feld“ macht den räumlichen Gegensatz zu Ai natürlich deutlich, ohne einen technischeren Sinn einzutragen.
- source_word: בַּמִּדְבָּר
  choice: in der Wildnis
  rationale: מִדְבָּר meint häufig unbebautes, wenig besiedeltes Land und nicht notwendig eine Sandwüste. „Wildnis“ wahrt diese Bedeutungsbreite.
- source_word: אֲשֶׁר רְדָפוּם בּוֹ
  choice: wohin sie sie verfolgt hatten
  rationale: Die Relativkonstruktion bezieht sich auf das Gelände der Verfolgung. „Wohin“ passt im Deutschen zur gerichteten Verfolgungsbewegung; das Plusquamperfekt erhält die Abfolge.
- source_word: וַיִּפְּלוּ כֻלָּם
  choice: als sie alle ... gefallen waren
  rationale: נפל ist im Kampfkontext eine übliche Bezeichnung für den Tod. „Gefallen“ erhält dieses Bild und bezeichnet nicht bloß eine Niederlage.
- source_word: לְפִי חֶרֶב
  choice: durch die Schärfe des Schwertes / mit der Schärfe des Schwertes
  rationale: Die hebräische Wendung lautet wörtlich „nach dem Mund des Schwertes“. „Schärfe des Schwertes“ bewahrt das konkrete Waffenbild in verständlichem Deutsch; die Präposition wird der jeweiligen Syntax angepasst.
- source_word: עַד תֻּמָּם
  choice: bis keiner mehr übrig war
  rationale: Die Wendung betont die vollständige Beendigung beziehungsweise Vernichtung der verfolgten Gruppe. Die deutsche Formulierung ist natürlich, deutlich und bewahrt den Vollständigkeitsaspekt, ohne eine unklare Passivform zu erzwingen.
- source_word: וַיָּשֻׁבוּ כָל יִשְׂרָאֵל הָעַי
  choice: kehrte ganz Israel nach Ai zurück
  rationale: שוב mit Zielangabe bezeichnet die Rückkehr. Der kollektive Ausdruck „ganz Israel“ wird im Deutschen idiomatisch mit dem Singular verbunden.
- source_word: וַיַּכּוּ אֹתָהּ
  choice: schlug die Stadt
  rationale: Das feminine Pronomen bezieht sich auf Ai als Stadt. Die explizite Wiederaufnahme mit „die Stadt“ verhindert im Deutschen ein missverständliches „es/sie“, ohne ein neues Objekt einzuführen.
theological_decisions:
- issue: Darstellung der vollständigen Tötung in einem Kriegstext
  choice: Die ausdrücklichen Begriffe des Tötens, Fallens und vollständigen Endes werden unverhüllt wiedergegeben.
  alternative: Die Handlung mit Ausdrücken wie „besiegen“ oder „überwinden“ abzuschwächen oder sie ausdrücklich als göttliches Gericht auszulegen.
  rationale: Der Vers berichtet die Gewalttat in drastischer Sprache, liefert hier aber keine eigene theologische Deutung. Die Übersetzung soll weder beschönigen noch eine über den Vers hinausgehende Rechtfertigung ergänzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange hebräische Satzperiode bleibt in gegliederter Form erhalten. Militärische Gewalt wird weder archaisierend überhöht noch euphemistisch abgeschwächt; „Wildnis“ vermeidet die zu enge Vorstellung einer Sandwüste.
