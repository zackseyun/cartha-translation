base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/006.yaml
  text: And they will come out after us until we have drawn them away from the city[a], for they will say[b], ‘They are fleeing before us as at the first,’ and we will flee before them.
translation:
  language: de
  text: 'Dann werden sie hinter uns herkommen, bis wir sie von der Stadt weggezogen haben[a]. Denn sie werden sagen[b]: »Sie fliehen vor uns wie beim ersten Mal.« Und wir werden vor ihnen fliehen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder stärker deutend: »bis wir sie von der Stadt weggelockt haben«. Das hebräische Verb bedeutet »wegziehen« oder »entfernen«; »weglocken« macht die Taktik ausdrücklich.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »sagen«. »Beim ersten Mal« bezieht sich auf Israels früheren Rückzug vor Ai (siehe Josua 7,4–5).'
    reason: translation_and_cross_reference
lexical_decisions:
- source_word: וְיָצְאוּ אַחֲרֵינוּ
  choice: Dann werden sie hinter uns her aus der Stadt herauskommen
  rationale: Die Verbform bezeichnet im Plan Josuas eine zukünftige Handlung. »Hinter uns her« gibt im militärischen Zusammenhang die Verfolgung natürlich wieder; »aus der Stadt« wird aus dem unmittelbaren Kontext und dem folgenden מִן הָעִיר aufgenommen.
- source_word: עַד הַתִּיקֵנוּ אֹתָם מִן הָעִיר
  choice: bis wir sie von der Stadt weggezogen haben
  rationale: Das Hifil von נתק bedeutet hier »wegziehen, entfernen«. Die Formulierung bewahrt das konkrete Bild, ohne die taktische Absicht stärker auszudeuten als der hebräische Ausdruck selbst.
- source_word: כִּי יֹאמְרוּ
  choice: Denn sie werden denken
  rationale: אמר kann hier die innere Schlussfolgerung der Männer von Ai bezeichnen. Im Deutschen klingt »denken« vor dem folgenden direkten Zitat natürlich; die wörtlichere Alternative »sagen« bleibt möglich.
- source_word: נָסִים לְפָנֵינוּ
  choice: Sie fliehen vor uns
  rationale: Das Partizip beschreibt die als gegenwärtig wahrgenommene Flucht. »Vor uns fliehen« ist die natürliche deutsche Wendung für den Rückzug angesichts eines Gegners.
- source_word: כַּאֲשֶׁר בָּרִאשֹׁנָה
  choice: wie beim ersten Mal
  rationale: Die Wendung verweist auf Israels vorherigen Rückzug vor Ai und wird im modernen Deutsch präzise und verständlich wiedergegeben.
- source_word: וְנַסְנוּ לִפְנֵיהֶם
  choice: Und wir werden vor ihnen fliehen
  rationale: In Josuas Planung hat die Form Zukunftsbedeutung. Die Wiederholung von »fliehen vor« erhält die sprachliche Entsprechung zum vermuteten Gedanken der Gegner.
theological_decisions: []
