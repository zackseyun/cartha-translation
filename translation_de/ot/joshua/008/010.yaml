translation:
  language: de
  text: Josua stand früh am Morgen auf und musterte das Volk[a]. Dann zogen er und die Ältesten Israels dem Volk voraus nach Ai hinauf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zählte das Volk“ oder „überprüfte das Volk“. Das hebräische Verb kann zählen, überprüfen, einsetzen oder mustern bedeuten; der militärische Zusammenhang spricht für „musterte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: stand früh am Morgen auf
  rationale: Die Hifil-Form von שׁכם bezeichnet gewöhnlich das frühe Aufstehen; die Wiedergabe ist im modernen Deutschen natürlich und bewahrt die ausdrückliche Zeitangabe.
- source_word: וַיִּפְקֹד אֶת־הָעָם
  choice: musterte das Volk
  rationale: פקד kann unter anderem zählen, überprüfen oder mustern bedeuten. Der militärische Zusammenhang spricht hier für das Sammeln und Überprüfen der Männer, ohne den Ausdruck auf bloßes Zählen einzuengen.
- source_word: הָעָם
  choice: das Volk
  rationale: Die Übersetzung bewahrt den allgemeinen hebräischen Ausdruck. Obwohl im Kontext die kampffähigen Männer im Blick sind, wäre „Truppen“ enger als der Ausgangstext.
- source_word: וַיַּעַל
  choice: zogen ... hinauf
  rationale: עלה bezeichnet das Hinaufgehen oder Hinaufziehen. Der Plural entspricht dem zusammengesetzten Subjekt Josua und die Ältesten; „hinauf“ bewahrt den möglichen topografischen Bezug.
- source_word: הוּא וְזִקְנֵי יִשְׂרָאֵל
  choice: er und die Ältesten Israels
  rationale: Die ausdrückliche Nennung des Pronomens hebt Josua zusammen mit den Ältesten als handelndes Subjekt hervor.
- source_word: לִפְנֵי הָעָם
  choice: an der Spitze des Volkes
  rationale: לפני bedeutet wörtlich „vor“ beziehungsweise „vorne vor“. Im Bewegungszusammenhang drückt „an der Spitze“ natürlich aus, dass Josua und die Ältesten dem Volk vorauszogen.
- source_word: הָעָי
  choice: Ai
  rationale: Der Ortsname wird entsprechend dem etablierten deutschen biblischen Gebrauch ohne Artikel wiedergegeben.
