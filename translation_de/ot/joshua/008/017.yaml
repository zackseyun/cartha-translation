  source_fidelity: Der Entwurf gibt die Verneinung mit generischem אִישׁ, die Nennung von Ai und Bethel, den Relativsatz über das Ausziehen hinter Israel her sowie die beiden anschließenden Erzählhandlungen zuverlässig wieder. „Oder“ ist nach „kein Mann“ im Deutschen idiomatisch und besagt zutreffend, dass in keinem der beiden Orte jemand zurückblieb. „Die Stadt offen“ bewahrt die konkrete, im Hebräischen prädikative Formulierung פְּתוּחָה, ohne deren taktische Implikation in den Haupttext zu verlagern.
