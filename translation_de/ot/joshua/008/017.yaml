  text: וְ/לֹֽא נִשְׁאַ֣ר אִ֗ישׁ בָּ/עַי֙ וּ/בֵ֣ית אֵ֔ל אֲשֶׁ֥ר לֹֽא יָצְא֖וּ אַחֲרֵ֣י יִשְׂרָאֵ֑ל וַ/יַּעַזְב֤וּ אֶת הָ/עִיר֙ פְּתוּחָ֔ה וַֽ/יִּרְדְּפ֖וּ אַחֲרֵ֥י יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/017.yaml
  text: And not a man was left in Ai or Bethel who did not go out after Israel[b][a], and they left the city open and pursued Israel.
translation:
  language: de
  text: Kein Mann blieb in Ai oder Bethel zurück, der nicht hinter Israel her auszog.[a] Sie ließen die Stadt offen[b] und verfolgten Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Kein Mann“ gibt das hebräische אִישׁ wieder, eine maskuline Singularform, die hier allgemein für jeden Zurückbleibenden gebraucht wird.
    reason: lexical_alternative
  - marker: b
    text: 'Oder sinngemäßer: „Sie ließen die Stadt unbewacht.“ Wörtlich steht im Hebräischen: „die Stadt offen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁאַר אִישׁ
  choice: Kein Mann blieb … zurück
  rationale: Gibt die Verbindung aus dem passiven נִשְׁאַר und dem generisch gebrauchten maskulinen Singular אִישׁ quellennah und zugleich idiomatisch wieder.
- source_word: בָּעַי וּבֵית אֵל
  choice: in Ai oder Bethel
  rationale: Nach der Verneinung bringt deutsches „oder“ natürlich zum Ausdruck, dass an keinem der beiden Orte jemand zurückblieb.
- source_word: אֲשֶׁר לֹא יָצְאוּ אַחֲרֵי יִשְׂרָאֵל
  choice: der nicht hinter Israel her auszog
  rationale: Bewahrt die Relativsatzstruktur und die Richtungswendung אַחֲרֵי; „hinter … her ausziehen“ ist verständlich und passt zur militärischen Bewegung.
- source_word: וַיַּעַזְבוּ
  choice: Sie ließen
  rationale: „Ließen“ ist im Erzählzusammenhang eine schlichte und natürliche Wiedergabe von עזב.
- source_word: הָעִיר פְּתוּחָה
  choice: die Stadt offen
  rationale: Bewahrt das konkrete Bild des hebräischen פְּתוּחָה, statt die taktische Bedeutung bereits im Haupttext als „unbewacht“ auszulegen.
- source_word: וַיִּרְדְּפוּ אַחֲרֵי יִשְׂרָאֵל
  choice: und verfolgten Israel
  rationale: „Verfolgen“ gibt רדף im militärischen Erzählzusammenhang prägnant wieder; die Bedeutung von אַחֲרֵי ist darin im Deutschen enthalten.
theological_decisions: []
