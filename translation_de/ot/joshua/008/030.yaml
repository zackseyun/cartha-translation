  text: אָ֣ז יִבְנֶ֤ה יְהוֹשֻׁ֨עַ֙ מִזְבֵּ֔חַ לַֽ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל בְּ/הַ֖ר עֵיבָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/030.yaml
  text: Then Joshua built an altar to Yahweh[a], the God of Israel, on Mount Ebal.
translation:
  language: de
  text: Dann baute Josua auf dem Berg Ebal einen Altar für Jahwe, den Gott Israels.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH (יהוה), hier mit „Jahwe“ wiedergegeben; traditionell wird der Gottesname mit „der HERR“ wiedergegeben.'
    reason: Erläuterung des Gottesnamens und der traditionellen Alternativwiedergabe.
lexical_decisions:
- source_word: אָז
  choice: Dann
  rationale: Das temporale Adverb führt das nächste Ereignis der Erzählung ein; „Dann“ gibt den Ablauf natürlich und knapp wieder.
- source_word: יִבְנֶה
  choice: baute
  rationale: Obwohl die Form morphologisch ein Imperfekt ist, bezeichnet sie nach אָז hier ein abgeschlossenes Ereignis in der Vergangenheit.
- source_word: יְהוֹשֻׁעַ
  choice: Josua
  rationale: Gebräuchliche deutsche Form des hebräischen Personennamens.
- source_word: מִזְבֵּחַ
  choice: einen Altar
  rationale: Bezeichnet einen Opferaltar; der unbestimmte Artikel entspricht der erstmaligen Erwähnung in diesem Zusammenhang.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Die Präposition ל kennzeichnet den Empfänger beziehungsweise den, dem der Altar geweiht ist. Im Deutschen drückt der Dativ bei „jemandem einen Altar bauen“ dieses Verhältnis natürlich aus; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: dem Gott Israels
  rationale: Die Apposition identifiziert Jahwe als Israels Gott und bleibt in dieser Form eng an der hebräischen Konstruktion.
- source_word: בְּהַר עֵיבָל
  choice: auf dem Berg Ebal
  rationale: Die Präposition bezeichnet hier den Ort des Geschehens; „auf dem Berg Ebal“ ist im Deutschen eindeutig und idiomatisch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen ausdrücklich. „Jahwe“ macht diesen Eigennamen im Haupttext sichtbar; die verbreitete Ersatzlesung „der HERR“ wird in der Fußnote genannt, ohne sie stillschweigend in den Text einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung ist natürlich, bewahrt aber die sachliche Kürze und die Apposition des hebräischen Textes.
