  text: וְ/אֶת מֶ֥לֶךְ הָ/עַ֖י תָּ֣פְשׂוּ חָ֑י וַ/יַּקְרִ֥בוּ אֹת֖/וֹ אֶל יְהוֹשֻֽׁעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/023.yaml
  text: But they captured the king of Ai alive and brought him to Joshua[a].
translation:
  language: de
  text: Doch den König von Ai nahmen sie lebend gefangen und brachten ihn zu Josua.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und den König von Ai nahmen sie lebend gefangen und brachten ihn zu Josua.“'
    reason: 'Lexikalische Alternative für וְ: Das Bindewort kann schlicht fortsetzend mit „Und“ statt kontrastierend mit „Doch“ wiedergegeben werden.'
lexical_decisions:
- source_word: וְ/אֶת
  choice: Doch
  rationale: Das וְ eröffnet eine weitere Handlung, die gegenüber der Tötung der übrigen Einwohner einen leichten Kontrast bildet. „Doch“ gibt diesen Zusammenhang im Deutschen natürlich wieder; „Und“ bleibt möglich.
- source_word: מֶלֶךְ הָעַי
  choice: den König von Ai
  rationale: Die hebräische Status-constructus-Verbindung bezeichnet den König des Ortes Ai; „den König von Ai“ ist die natürliche deutsche Wiedergabe.
- source_word: תָּפְשׂוּ
  choice: nahmen sie … gefangen
  rationale: תפש bezeichnet hier im militärischen Zusammenhang das Ergreifen beziehungsweise Gefangennehmen einer Person.
- source_word: חָי
  choice: lebend
  rationale: Das prädikative Adjektiv zeigt an, dass der König nicht getötet, sondern lebend gefangen genommen wurde.
- source_word: וַיַּקְרִבוּ אֹתוֹ אֶל יְהוֹשֻׁעַ
  choice: und brachten ihn zu Josua
  rationale: Der Hifil von קרב bezeichnet das Heranbringen; zusammen mit אֶל ist Josua das Ziel. „Brachte ihn zu Josua“ ist im modernen Deutschen natürlich und bewahrt den Richtungssinn, ohne eine nicht ausdrücklich genannte gerichtliche Vorführung einzutragen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Verbklammer „nahmen … gefangen“ ist idiomatisch und verständlich; der leichte Gegensatz zum vorausgehenden Tötungsgeschehen wird durch „Doch“ ausgedrückt, während die Fußnote die formalere Fortsetzung mit „Und“ festhält.
