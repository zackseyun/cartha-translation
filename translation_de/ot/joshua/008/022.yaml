base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/022.yaml
  text: And these came out from the city to meet them[a], so that they were in the midst of Israel, these on one side and those on the other[b]; and they struck them down until he left for him not a survivor or a fugitive.
translation:
  language: de
  text: Diese zogen aus der Stadt, ihnen entgegen. So gerieten die Männer von Ai mitten unter die Israeliten, die einen auf dieser und die anderen auf jener Seite[a]. Die Israeliten schlugen sie nieder, bis ihnen weder ein Überlebender noch ein Entkommener blieb[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „diese von dieser Seite und diese von jener Seite“. Gemeint ist, dass die Männer von Ai von zwei Seiten eingeschlossen waren.'
    reason: lexical_alternative
  - marker: b
    text: 'Im Hebräischen stehen im letzten Satzteil unerwartet ein Verb im Singular und ein Singularsuffix: „bis er ihm keinen Überlebenden und Entkommenen übrig ließ“. Gemeint ist, dass niemand überlebte oder entkam.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Auch diese
  rationale: Der Demonstrativausdruck verweist auf die zuvor erwähnte israelitische Truppe, die aus der eroberten Stadt herauskommt. „Auch diese“ bewahrt den ausdrücklichen Rückverweis und verbindet ihr Vorgehen mit dem der anderen Israeliten.
- source_word: יָצְאוּ מִן הָעִיר
  choice: zogen aus der Stadt
  rationale: יצא bezeichnet das Herausgehen oder Herausziehen. Im militärischen Erzählzusammenhang ist „zogen aus der Stadt“ natürlich und wahrt die Bewegungsrichtung.
- source_word: לִקְרָאתָם
  choice: ihnen entgegen
  rationale: לקראת kann ein Entgegengehen zur Begegnung oder Konfrontation ausdrücken. „Ihnen entgegen“ erhält diese Bedeutung, ohne den feindlichen Zweck unnötig zusätzlich auszudeuten.
- source_word: וַיִּהְיוּ לְיִשְׂרָאֵל בַּתָּוֶךְ
  choice: So gerieten die Männer von Ai mitten zwischen die Israeliten
  rationale: Die hebräische Konstruktion beschreibt das taktische Ergebnis. Das im Hebräischen nur pronominal bezeichnete Objekt wird aus dem unmittelbaren Zusammenhang als „die Männer von Ai“ kenntlich gemacht; „gerieten“ gibt die unerwünschte Lage natürlich wieder.
- source_word: אֵלֶּה מִזֶּה וְאֵלֶּה מִזֶּה
  choice: die von beiden Seiten kamen
  rationale: Wörtlich steht „diese von dieser Seite und jene von jener Seite“. Die deutsche Fassung gibt die beidseitige Einschließung knapp und idiomatisch wieder; eine Fußnote dokumentiert die konkrete hebräische Formulierung.
- source_word: וַיַּכּוּ אוֹתָם
  choice: Die Israeliten schlugen sie nieder
  rationale: נכה bezeichnet im Kampf das Schlagen und häufig die tödliche Niederlage. „schlugen ... nieder“ bewahrt den militärischen Nachdruck. Das ausdrückliche Subjekt „Die Israeliten“ klärt die im Deutschen sonst mehrdeutigen Pronomen.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ
  choice: bis ihnen ... blieb
  rationale: Die Wendung bezeichnet das vollständige Ausmaß der Niederlage. Das Hebräische wechselt überraschend zu einem singularischen Verb und einem singularischen Pronomen; die Hauptfassung gibt den gemeinten Sachverhalt verständlich wieder, während die Fußnote den Formwechsel festhält.
- source_word: שָׂרִיד וּפָלִיט
  choice: weder ein Überlebender noch ein Entkommener
  rationale: Das Wortpaar umfasst sowohl jemanden, der am Leben bleibt, als auch jemanden, der fliehen kann. „Entkommener“ gibt פָלִיט im Kontext präziser und natürlicher wieder als „Flüchtling“.
