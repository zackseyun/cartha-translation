source:
  edition: WLC
  text: וַ/יִּכְתָּב שָׁ֖ם עַל הָ/אֲבָנִ֑ים אֵ֗ת מִשְׁנֵה֙ תּוֹרַ֣ת מֹשֶׁ֔ה אֲשֶׁ֣ר כָּתַ֔ב לִ/פְנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/032.yaml
  text: And there[a], on the stones, he wrote a copy of the law of Moses[b], which he had written before the sons of Israel.
translation:
  language: de
  text: Dort schrieb er auf die Steine eine Abschrift[a] des Gesetzes des Mose, das Mose vor den Israeliten geschrieben hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Wiederholung“ oder „eine Zweitschrift“. Das hebräische Wort kann eine Abschrift, Doppelung oder wiederholte Fassung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתָּב
  choice: schrieb er … nieder
  rationale: Das Qal-Wayyiqtol von כתב bezeichnet schlicht das Schreiben. Die geteilte Wiedergabe „schrieb … nieder“ klingt im Deutschen bei einer Beschriftung von Steinen natürlich, ohne ein besonderes Verfahren des Einmeißelns vorauszusetzen.
- source_word: שָׁם
  choice: Dort
  rationale: Das Ortsadverb wird im deutschen Erzählstil knapp und natürlich mit „dort“ wiedergegeben.
- source_word: עַל הָאֲבָנִים
  choice: auf die Steine
  rationale: עַל bezeichnet hier die Oberfläche, auf der geschrieben wird. Der bestimmte Plural wird direkt wiedergegeben.
- source_word: מִשְׁנֵה תּוֹרַת מֹשֶׁה
  choice: eine Abschrift des Gesetzes des Mose
  rationale: מִשְׁנֵה kann eine Abschrift, Doppelung oder Wiederholung bezeichnen. Im Zusammenhang des Schreibens auf Steine ist „Abschrift“ die klarste deutsche Wiedergabe, ohne den Umfang des Geschriebenen festzulegen.
- source_word: תּוֹרַת מֹשֶׁה
  choice: des Gesetzes des Mose
  rationale: תּוֹרָה kann „Weisung“ bedeuten; in dieser festen, rechtlich-bundestheologischen Verbindung ist „Gesetz des Mose“ im Deutschen verständlich und traditionsübergreifend erkennbar.
- source_word: אֲשֶׁר כָּתַב
  choice: die er … niederschrieb
  rationale: Der Relativsatz wird als nähere Bestimmung der Abschrift wiedergegeben. Das hebräische Subjekt bleibt unausgesprochen; auch das deutsche „er“ bewahrt eine gewisse Mehrdeutigkeit zwischen Josua und Mose.
- source_word: לִפְנֵי
  choice: in Gegenwart
  rationale: לִפְנֵי bezeichnet hier ein Handeln vor beziehungsweise in Anwesenheit der versammelten Israeliten. „In Gegenwart“ gibt diese öffentliche Dimension idiomatisch wieder.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: der Söhne Israels
  rationale: Die formale Wendung gibt den maskulinen hebräischen Konstruktplural transparent wieder; die geläufigere kollektive Wiedergabe „Israeliten“ wird als Alternative vermerkt.
theological_decisions:
- issue: Umfang von מִשְׁנֵה תּוֹרַת מֹשֶׁה
  choice: „eine Abschrift des Gesetzes des Mose“, ohne ihren Umfang näher zu bestimmen
  alternative: Das ganze mosaische Gesetz oder nur ein bestimmter Bundes- beziehungsweise Gesetzesabschnitt
  rationale: Der Vers selbst sagt nicht, welcher Umfang auf die Steine geschrieben wurde. Die Übersetzung lässt diese Frage offen.
- issue: Subjekt und Bezug des Relativsatzes אֲשֶׁר כָּתַב
  choice: Die Formulierung mit „er“ lässt den im Hebräischen unausgesprochenen Handelnden unbenannt; im unmittelbaren Erzählfluss liegt Josua nahe.
  alternative: Der Relativsatz kann auf Mose und auf das von ihm geschriebene Gesetz bezogen werden.
  rationale: Hebräisch kennzeichnet das Subjekt des Verbs nicht ausdrücklich, und die syntaktische Anbindung des Relativsatzes lässt mehr als eine Deutung zu. Diese Spannung wird nicht dogmatisch aufgelöst.
translation_notes:
  register: Moderner, würdiger Standarddeutsch-Stil. „Abschrift“ und „in Gegenwart“ sind allgemein verständlich; „Gesetz des Mose“ bewahrt die geläufige biblische Ausdrucksweise. Die Wiederholung von „schrieb/niederschrieb“ folgt der Struktur des hebräischen Satzes und hält dessen Relativsatz sichtbar.
