source:
  edition: WLC
  text: וַ/יִּנָּֽגְע֛וּ יְהוֹשֻׁ֥עַ וְ/כָל יִשְׂרָאֵ֖ל לִ/פְנֵי/הֶ֑ם וַ/יָּנֻ֖סוּ דֶּ֥רֶךְ הַ/מִּדְבָּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/015.yaml
  text: And Joshua and all Israel let themselves be beaten before them and fled by the way of the wilderness[a][b].
translation:
  language: de
  text: Josua und ganz Israel ließen sich vor ihnen schlagen und flohen auf dem Weg zur Wüste.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wurden vor ihnen geschlagen«. Im Zusammenhang handelt es sich wahrscheinlich um eine vorgetäuschte Niederlage, durch die die Männer von Ai aus der Stadt gelockt werden sollten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »in Richtung Wüste«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּגְעוּ
  choice: ließen sich schlagen
  rationale: Der Nifal-Ausdruck bezeichnet im militärischen Zusammenhang, dass Israel vor dem Gegner geschlagen erscheint. Die reflexiv-kausative deutsche Formulierung passt zur im Kontext geschilderten Finte, ohne das Verb ausdrücklich mit „täuschten eine Niederlage vor“ auszudeuten; die mögliche rein passive Lesart bleibt in der Fußnote erhalten.
- source_word: לִפְנֵיהֶם
  choice: vor ihnen
  rationale: Gibt die gewöhnliche räumliche und relationale Bedeutung von לִפְנֵי mit Suffix knapp und natürlich wieder.
- source_word: וַיָּנֻסוּ
  choice: flohen
  rationale: Entspricht der üblichen Bedeutung von נוּס und bewahrt die Darstellung der sichtbaren Flucht, ohne sie bereits ausdrücklich als geordneten Rückzug zu interpretieren.
- source_word: דֶּרֶךְ הַמִּדְבָּר
  choice: auf dem Weg zur Wüste
  rationale: דֶּרֶךְ kann Weg, Straße oder Route bedeuten. Die Formulierung ist im modernen Deutschen natürlich und versteht die Wüste als Zielrichtung; die alternative Richtungsangabe wird in der Fußnote vermerkt.
- source_word: יְהוֹשֻׁעַ וְכָל יִשְׂרָאֵל
  choice: Josua und ganz Israel
  rationale: Bewahrt die kollektive Bezeichnung Israels und folgt der Ausdrucksweise des hebräischen Textes.
