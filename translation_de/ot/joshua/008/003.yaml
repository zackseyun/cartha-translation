base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/003.yaml
  text: So Joshua and all the fighting people rose to go up against Ai[a], and Joshua chose thirty thousand men, mighty men of valor[c][b], and sent them out by night.
translation:
  language: de
  text: Da machte sich Josua mit dem ganzen Kriegsvolk auf, um gegen Ai hinaufzuziehen.[a] Josua wählte dreißigtausend Mann aus, tapfere Krieger,[b] und sandte sie bei Nacht aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um nach Ai hinaufzuziehen“. Im militärischen Zusammenhang ist die Bewegung gegen die Stadt gerichtet.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „starke“ oder „tüchtige Krieger“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: machte sich … auf
  rationale: Das Qal-Wayyiqtol von קום leitet hier die Handlung ein. Die deutsche Wendung ist natürlich und bewahrt den Beginn der Bewegung, ohne bereits die Ankunft auszudrücken.
- source_word: כָל עַם הַמִּלְחָמָה
  choice: das ganze Kriegsvolk
  rationale: Die Formulierung hält am kollektiven עַם und an der militärischen Bestimmung durch הַמִּלְחָמָה fest. Sie ist im Deutschen würdevoll und weniger institutionell als „das ganze Heer“.
- source_word: לַעֲלוֹת הָעָי
  choice: um gegen Ai hinaufzuziehen
  rationale: „Hinaufziehen“ gibt עלה wieder; „gegen“ macht im militärischen Zusammenhang die feindliche Zielrichtung deutlich, ohne das Verb auf „angreifen“ zu verengen.
- source_word: וַיִּבְחַר
  choice: wählte … aus
  rationale: בחר bezeichnet ein gezieltes Auswählen; die trennbare deutsche Form ist in diesem Erzählzusammenhang idiomatisch.
- source_word: שְׁלֹשִׁים אֶלֶף אִישׁ
  choice: dreißigtausend Mann
  rationale: Die Wiedergabe folgt der ausdrücklichen Mengenangabe und dem hebräischen אִישׁ, ohne das kontextuell naheliegende „Soldaten“ einzutragen.
- source_word: גִּבּוֹרֵי הַחַיִל
  choice: kampferprobte Krieger
  rationale: Die Wendung bezeichnet leistungsfähige, tüchtige und tapfere Kriegsmänner. „Kampferprobte Krieger“ ist modernes, klares Deutsch und vermeidet die altertümliche Formel „tapfere Helden“.
- source_word: וַיִּשְׁלָחֵם לָיְלָה
  choice: sandte sie bei Nacht aus
  rationale: Die Übersetzung gibt שלח mit Objektsuffix und die adverbiale Zeitangabe לָיְלָה knapp und erzählerisch passend wieder.
