translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit klarer Erzählbewegung. „Kriegsvolk“ bewahrt den kollektiven Charakter des Hebräischen; „kampferprobte Krieger“ vermittelt die militärische Qualität der festen Wendung גִּבּוֹרֵי הַחַיִל ohne Archaismus.
