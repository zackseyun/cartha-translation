  text: וִ/יהוֹשֻׁ֨עַ֙ לֹֽא הֵשִׁ֣יב יָד֔/וֹ אֲשֶׁ֥ר נָטָ֖ה בַּ/כִּיד֑וֹן עַ֚ד אֲשֶׁ֣ר הֶחֱרִ֔ים אֵ֖ת כָּל יֹשְׁבֵ֥י הָ/עָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/026.yaml
  text: And Joshua did not draw back his hand[a], which he had stretched out with the javelin, until he had devoted all the inhabitants of Ai to destruction.
translation:
  language: de
  text: Und Josua zog seine Hand, die er mit dem Wurfspieß ausgestreckt hatte, nicht zurück, bis er alle Einwohner von Ai dem Untergang geweiht hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bis er alle Einwohner von Ai vollständig vernichtet hatte“. Das hebräische Verb bezeichnet hier die Vollstreckung des Banns, also die Weihe zum Untergang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵשִׁיב
  choice: zog … nicht zurück
  rationale: Der Hifil von שוב bedeutet hier, etwas zurückzubringen. Mit „seine Hand“ als Objekt bezeichnet „zurückziehen“ im Kampfzusammenhang natürlich, dass Josua die ausgestreckte Hand nicht senkte oder zurücknahm.
- source_word: יָדוֹ
  choice: seine Hand
  rationale: Die wörtliche Körperteilbezeichnung ist im Deutschen klar und bewahrt das Bild des hebräischen Textes.
- source_word: נָטָה
  choice: ausgestreckt hatte
  rationale: נטה bedeutet hier „ausstrecken“ oder „ausdehnen“; das Plusquamperfekt kennzeichnet die bereits vollzogene Handlung im Relativsatz.
- source_word: בַּכִּידוֹן
  choice: mit dem Wurfspieß
  rationale: כידון bezeichnet eine speerartige Waffe, wahrscheinlich einen Wurfspieß. Diese Wiedergabe ist spezifisch und passt zum unmittelbaren Erzählzusammenhang.
- source_word: הֶחֱרִים
  choice: dem Untergang geweiht hatte
  rationale: Der Hifil von חרם bezeichnet das Vollstrecken des Banns, bei dem Menschen oder Dinge der Vernichtung preisgegeben werden. „Dem Untergang weihen“ bewahrt sowohl den Weihe- als auch den Vernichtungsaspekt.
- source_word: כָּל יֹשְׁבֵי הָעָי
  choice: alle Einwohner von Ai
  rationale: יֹשְׁבֵי bezeichnet die Bewohner eines Ortes; „Einwohner“ ist im modernen Standarddeutsch natürlich und angemessen würdevoll.
- source_word: וִיהוֹשֻׁעַ
  choice: Josua aber
  rationale: Der Name wird in seiner üblichen deutschen Form wiedergegeben. Das ו wird hier mit „aber“ übersetzt, weil der Satz Josuas anhaltende Haltung gegenüber dem vorangehenden Kampfgeschehen hervorhebt.
theological_decisions:
- issue: Wiedergabe von חרם im Zusammenhang des Kriegsgerichts
  choice: alle Einwohner von Ai dem Untergang geweiht hatte
  alternative: alle Einwohner von Ai vollständig vernichtet hatte; an allen Einwohnern von Ai den Bann vollstreckt hatte
  rationale: Die gewählte Formulierung bewahrt die rechtlich-kultische Bedeutung des hebräischen Bannbegriffs und macht zugleich deutlich, dass er hier die Vernichtung einschließt. Sie schwächt das Geschehen nicht zu gewöhnlicher militärischer Zerstörung ab und legt keine konfessionelle Sonderdeutung fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe am hebräischen Bild, wird jedoch idiomatisch gestaltet. „Wurfspieß“ wahrt die mögliche Waffenspezifik; die Fußnote erläutert die Bedeutungsbreite des Bannbegriffs.
