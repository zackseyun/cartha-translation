lexical_decisions:
- source_word: מֶלֶךְ
  choice: der König von
  rationale: In der Liste besiegter Könige bezeichnet מֶלֶךְ jeweils den Herrscher des folgenden Ortes. Die Wiedergabe mit »der König von« ist im Deutschen idiomatisch und bewahrt die knappe Listenform.
- source_word: דְּבִר
  choice: Debir
  rationale: Ortsname; nach der im Deutschen üblichen biblischen Namensform wiedergegeben.
- source_word: אֶחָד
  choice: einer
  rationale: אֶחָד dient hier als Zählangabe für jeden aufgeführten König. »Einer« bezieht sich grammatisch auf »König« und erhält den knappen, aufzählenden Stil.
- source_word: גֶּדֶר
  choice: Geder
  rationale: Ortsname; in üblicher deutscher Transliteration wiedergegeben.
