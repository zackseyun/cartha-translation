  text: 'der König von Jarmut: einer; der König von Lachisch: einer.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֶלֶךְ יַרְמוּת
  choice: der König von Jarmut
  rationale: מֶלֶךְ steht in einer auf den Ortsnamen bezogenen Verbindung. Die Wiedergabe mit Artikel und „von“ ist im Deutschen natürlich und erhält den Sinn eines Stadtkönigs.
- source_word: אֶחָד
  choice: einer
  rationale: In der knappen Zählformel dieses Verzeichnisses bezeichnet אֶחָד jeweils einen einzelnen besiegten König. „Einer“ wahrt die elliptische Form und bezieht sich grammatisch auf „König“.
- source_word: מֶלֶךְ לָכִישׁ
  choice: der König von Lachisch
  rationale: Die wiederholte Verbindung wird parallel zum ersten Glied wiedergegeben; der Ortsname folgt der etablierten deutschen Namensform.
- source_word: אֶחָד
  choice: einer
  rationale: Die wiederholte Zählangabe wird zur Wahrung des formelhaften Aufbaus einheitlich übersetzt.
