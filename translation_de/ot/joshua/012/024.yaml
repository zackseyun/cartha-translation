lexical_decisions:
- source_word: מֶלֶךְ תִּרְצָה
  choice: der König von Tirza
  rationale: Die Status-constructus-Verbindung bezeichnet den König der Stadt Tirza. Der bestimmte Artikel entspricht im Deutschen dem natürlichen Stil dieser Aufzählung.
- source_word: אֶחָד
  choice: einer
  rationale: Die Kardinalzahl zählt einen König für die genannte Stadt; „einer“ stimmt grammatisch mit „König“ überein.
- source_word: כָּל מְלָכִים
  choice: Insgesamt waren es … Könige
  rationale: כָּל leitet hier die abschließende Gesamtsumme der zuvor aufgezählten Könige ein. Die idiomatische deutsche Formulierung gibt diese summierende Funktion klar wieder.
- source_word: שְׁלֹשִׁים וְאֶחָד
  choice: einunddreißig
  rationale: Standarddeutsche Wiedergabe der zusammengesetzten hebräischen Zahl.
