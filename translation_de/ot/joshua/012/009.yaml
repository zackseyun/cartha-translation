  text: the king of Jericho[a], one; the king of Ai, which is beside Bethel, one.
translation:
  language: de
  text: 'Der König von Jericho: einer; der König von Ai, das neben Bethel liegt: einer.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֶלֶךְ
  choice: der König
  rationale: Die übliche deutsche Wiedergabe für einen Herrscher; der bestimmte Artikel entspricht dem aufzählenden Katalogstil.
- source_word: יְרִיחוֹ
  choice: Jericho
  rationale: Eingebürgerte deutsche Form des Ortsnamens.
- source_word: אֶחָד
  choice: einer
  rationale: In der wiederkehrenden Zählformel bezeichnet das Wort jeweils einen König. „Einer“ bewahrt die knappe Aufzählungsweise und stimmt grammatisch mit „König“ überein.
- source_word: הָעַי
  choice: Ai
  rationale: Eingebürgerte Wiedergabe des Ortsnamens; der hebräische Artikel wird bei diesem Eigennamen im Deutschen nicht wiedergegeben.
- source_word: אֲשֶׁר
  choice: das … liegt
  rationale: Leitet einen Relativsatz ein, der den Ort Ai näher bestimmt; das Verb „liegt“ wird im Deutschen für eine natürliche Ortsangabe ergänzt.
- source_word: מִצַּד
  choice: neben
  rationale: Gibt die räumliche Nähe zu Bethel knapp und idiomatisch wieder; möglich wäre auch „an der Seite von“.
- source_word: בֵּית אֵל
  choice: Bethel
  rationale: Eingebürgerte deutsche Form des Ortsnamens.
