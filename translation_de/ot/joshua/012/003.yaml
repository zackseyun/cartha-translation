  register: Moderne, würdevolle Standardsprache mit der knappen Reihung einer geografischen Gebietsbeschreibung. Hebräische Ortsnamen und die alte Gewässerbezeichnung bleiben erhalten; erläuternde moderne Bezeichnungen stehen nur in den Fußnoten.
