id: JOS.12.3
reference: Joshua 12:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הָ/עֲרָבָה֩ עַד יָ֨ם כִּנְר֜וֹת מִזְרָ֗חָ/ה וְ֠/עַד יָ֣ם הָ/עֲרָבָ֤ה יָם הַ/מֶּ֨לַח֙ מִזְרָ֔חָ/ה דֶּ֖רֶךְ בֵּ֣ית הַיְשִׁמ֑וֹת וּ/מִ֨/תֵּימָ֔ן תַּ֖חַת אַשְׁדּ֥וֹת הַ/פִּסְגָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/003.yaml
  text: and the Arabah as far as the Sea of Kinnereth eastward[a], and as far as the Sea of the Arabah, the Salt Sea, eastward, by way of Beth-jeshimoth, and southward[b], below the slopes of Pisgah.
translation:
  language: de
  text: und die Araba[a] bis zum See Kinneret im Osten und bis zum Meer der Araba, dem Salzmeer[b], im Osten in Richtung Bet-Jeschimot und im Süden unterhalb der Abhänge des Pisga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Ebene“. Hier ist wahrscheinlich die Araba als Name der Jordansenke gemeint, nicht einfach eine beliebige Ebene.'
    reason: lexical_alternative
  - marker: b
    text: Das „Meer der Araba“, das „Salzmeer“, wird heute gewöhnlich Totes Meer genannt.
    reason: cultural_note
lexical_decisions:
- source_word: הָעֲרָבָה
  choice: die Araba
  rationale: Der geografische Eigenname bezeichnet hier die Jordansenke; die Transliteration vermeidet die Verengung auf eine beliebige Ebene.
- source_word: יָם כִּנְרוֹת
  choice: See Kinneret
  rationale: Gibt die Gewässerbezeichnung natürlich auf Deutsch wieder und bewahrt den hebräischen Ortsnamen.
- source_word: מִזְרָחָה
  choice: im Osten
  rationale: Der adverbiale Richtungsausdruck kann in dieser Gebietsbeschreibung sowohl Lage als auch Ausdehnung nach Osten bezeichnen; „im Osten“ bewahrt diese knappe geografische Aussage.
- source_word: יָם הָעֲרָבָה יָם הַמֶּלַח
  choice: das Meer der Araba, das Salzmeer
  rationale: Bewahrt die appositionelle Struktur des Hebräischen und ersetzt die biblische Bezeichnung nicht im Haupttext durch den später geläufigen Namen „Totes Meer“.
- source_word: דֶּרֶךְ
  choice: in Richtung
  rationale: Passt idiomatisch zu einer Grenz- und Gebietsbeschreibung und gibt die räumliche Ausrichtung wieder, ohne zwingend einen tatsächlich benutzten Weg vorauszusetzen.
- source_word: בֵּית הַיְשִׁמוֹת
  choice: Bet-Jeschimot
  rationale: Der Ortsname wird nach seiner hebräischen Form ins Deutsche übertragen.
- source_word: וּמִתֵּימָן
  choice: und im Süden
  rationale: Gibt die südliche Lage beziehungsweise Begrenzung knapp und natürlich wieder; das hebräische מִן lässt hier mehrere räumliche Nuancen zu.
- source_word: תַּחַת אַשְׁדּוֹת
  choice: unterhalb der Abhänge
  rationale: 'Entspricht der topografischen Bedeutung: Das bezeichnete Gebiet liegt unterhalb der abfallenden Berghänge.'
- source_word: הַפִּסְגָּה
  choice: Pisga
  rationale: Wird als geografischer Eigenname behandelt; der hebräische Artikel wird wie bei deutschen Ortsnamen üblich nicht wiedergegeben.
theological_decisions: []
