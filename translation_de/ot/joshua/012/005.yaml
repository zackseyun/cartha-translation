base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/005.yaml
  text: and ruling over Mount Hermon[a], and Salecah, and all Bashan, as far as the border of the Geshurites and the Maacathites, and half of Gilead, to the border of Sihon king of Heshbon.
translation:
  language: de
  text: und der über den Berg Hermon, über Salcha und über ganz Baschan bis an die Grenze der Geschuriter und Maachatiter und über die Hälfte Gileads bis an die Grenze Sihons, des Königs von Heschbon, herrschte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „und herrschend über …“. Das Hebräische verwendet ein Partizip, das die Beschreibung aus dem vorhergehenden Vers fortsetzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֹשֵׁל
  choice: und der … herrschte
  rationale: Das hebräische Partizip setzt die Beschreibung Ogs aus dem vorigen Vers fort. Ein deutscher Relativsatz bewahrt diese syntaktische Anbindung natürlicher als ein isoliertes Partizip.
- source_word: בְּהַר חֶרְמוֹן
  choice: über den Berg Hermon
  rationale: Die Präposition ב bezeichnet bei משל den Herrschaftsbereich; „über“ ist dafür im Deutschen idiomatisch.
- source_word: וּבְסַלְכָה
  choice: über Salcha
  rationale: Salcha ist ein Ortsname im Herrschaftsgebiet Ogs; die Form entspricht einer gebräuchlichen deutschen Umschrift.
- source_word: וּבְכָל הַבָּשָׁן
  choice: über ganz Baschan
  rationale: Die Wendung bezeichnet die gesamte Region Baschan als Herrschaftsgebiet.
- source_word: עַד גְּבוּל
  choice: bis an die Grenze
  rationale: עַד mit גְּבוּל bezeichnet die räumliche Ausdehnung bis zu einer Grenze.
- source_word: הַגְּשׁוּרִי וְהַמַּעֲכָתִי
  choice: der Geschuriter und Maachatiter
  rationale: Die singularischen hebräischen Volksbezeichnungen werden im Deutschen idiomatisch als Bezeichnungen der jeweiligen Volksgruppen wiedergegeben.
- source_word: וַחֲצִי הַגִּלְעָד
  choice: sowie über die Hälfte Gileads
  rationale: Die Formulierung bezeichnet den Teil der Landschaft Gilead, der zu Ogs Herrschaftsgebiet gehörte; „sowie“ gliedert die lange Aufzählung übersichtlich.
- source_word: גְּבוּל סִיחוֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: bis an die Grenze Sihons, des Königs von Heschbon
  rationale: Die Phrase bestimmt die Ausdehnung der genannten Hälfte Gileads; der Königstitel wird als Apposition zu Sihon wiedergegeben.
