  to: Sihon, der König der Amoriter, der in Heschbon wohnte und von Aroër an herrschte, das am Rand des Arnon-Tals liegt, über die Mitte des Arnon-Tals und über die Hälfte Gileads bis zum Jabbok-Tal[a], der Grenze der Ammoniter[b].
  rationale: Die Revision bindet „wohnte“ und „herrschte“ als parallele Partizipialaussagen an Sihon zurück. Sie fasst die Mitte des Arnon-Tals und die Hälfte Gileads als Gegenstände seiner Herrschaft auf, statt für beide einen elliptischen Ausgangspunkt „von“ zu ergänzen. Die Fußnoten bleiben in Inhalt, Markierung und Bezug erhalten.
