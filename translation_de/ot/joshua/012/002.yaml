  naturalness: Der Satzbruch nach „wohnte“ ist zwar verständlich, doch die anschließende Präpositionalfolge ist im Deutschen schwer lesbar. Eine durchgehende Relativkonstruktion bildet die beiden hebräischen Partizipien und die Gebietsliste natürlich und präzise ab.
  terminology: „König der Amoriter“, „Heschbon“, „Aroër“, „Gilead“ und „Ammoniter“ sind angemessen. „Rand des Arnon-Tals“ gibt die topographisch offene Bedeutung von שׂפת נחל wieder; die Fußnote wahrt die Mehrdeutigkeit von נחל.
