source:
  edition: WLC
  text: סִיחוֹן֙ מֶ֣לֶךְ הָ/אֱמֹרִ֔י הַ/יּוֹשֵׁ֖ב בְּ/חֶשְׁבּ֑וֹן מֹשֵׁ֡ל מֵ/עֲרוֹעֵ֡ר אֲשֶׁר֩ עַל שְׂפַת נַ֨חַל אַרְנ֜וֹן וְ/ת֤וֹךְ הַ/נַּ֨חַל֙ וַ/חֲצִ֣י הַ/גִּלְעָ֔ד וְ/עַד֙ יַבֹּ֣ק הַ/נַּ֔חַל גְּב֖וּל בְּנֵ֥י עַמּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/002.yaml
  text: Sihon king of the Amorites[a], who lived in Heshbon, ruling from Aroer, which is on the bank of the Arnon Valley, and from the middle of the valley, and half of Gilead, as far as the Jabbok Valley[b], the border of the sons of Ammon.
translation:
  language: de
  text: Sihon, der König der Amoriter, der in Heschbon wohnte und von Aroër an herrschte, das am Rand des Arnon-Tals liegt, über die Mitte des Arnon-Tals und über die Hälfte Gileads bis zum Jabbok-Tal[a], der Grenze der Ammoniter[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort נַחַל kann ein Tal, ein Wadi oder ein Flussbett bezeichnen. Hier dienen Arnon und Jabbok als Gebietsgrenzen.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: „der Söhne Ammons“, das heißt: der Ammoniter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיּוֹשֵׁב
  choice: der … wohnte
  rationale: Das Partizip von ישׁב bezeichnet hier den Wohn- oder Regierungssitz; „wohnte“ ist natürliches modernes Deutsch.
- source_word: מֹשֵׁל
  choice: Er herrschte
  rationale: Das Partizip beschreibt Sihons politische Herrschaft über das anschließend abgegrenzte Gebiet.
- source_word: מֵעֲרוֹעֵר
  choice: von Aroër
  rationale: Die Präposition מִן kennzeichnet den Ausgangspunkt der Gebietsbeschreibung.
- source_word: שְׂפַת נַחַל אַרְנוֹן
  choice: am Rand des Arnontals
  rationale: שׂפה bezeichnet Rand, Ufer oder Kante; נחל kann ein Tal, Wadi oder Flussbett meinen. „Rand des Arnontals“ bewahrt die topografische Aussage, ohne einen ständig wasserführenden Fluss vorauszusetzen.
- source_word: וְתוֹךְ הַנַּחַל
  choice: und von der Mitte des Tals
  rationale: תוך bezeichnet die Mitte beziehungsweise das Innere. Das erneut gesetzte „von“ macht die elliptische hebräische Gebietsangabe im Deutschen verständlich.
- source_word: וַחֲצִי הַגִּלְעָד
  choice: über die Hälfte Gileads
  rationale: חצי bezeichnet die Hälfte eines Gebiets. „über“ bindet diese Gebietsangabe idiomatisch an „herrschte“, ohne die Ausdehnung umzudeuten.
- source_word: וְעַד יַבֹּק הַנַּחַל
  choice: bis zum Jabboktal
  rationale: עַד markiert den Endpunkt; נחל wird parallel zur Arnnon-Angabe als Tal beziehungsweise Wadi verstanden.
- source_word: גְּבוּל בְּנֵי עַמּוֹן
  choice: der Grenze der Ammoniter
  rationale: בני עמון ist wörtlich „Söhne Ammons“, dient hier aber als Volksbezeichnung. „Ammoniter“ ist im Deutschen klar und idiomatisch.
- source_word: הָאֱמֹרִי
  choice: der König der Amoriter
  rationale: Die morphologisch singularische Volksbezeichnung steht bei „König“; deutsches Idiom gibt sie als „König der Amoriter“ wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die abgebrochene beziehungsweise listenartige Syntax des hebräischen Kontextes wird durch zwei Sätze lesbar gemacht. Ortsnamen folgen geläufigen deutschen Bibelformen; die topografische Mehrdeutigkeit von נחל bleibt in der Fußnote sichtbar.
