  text: the king of Kedesh[a], one; the king of Jokneam by Carmel, one.
translation:
  language: de
  text: 'der König von Kedesch: einer; der König von Jokneam am Karmel[a]: einer.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jokneam im Karmelgebiet“. Die hebräische Wendung kann eine Lage oder eine regionale Zuordnung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ
  choice: der König von
  rationale: In der Liste der besiegten Stadtkönige leitet מֶלֶךְ jeden Eintrag ein. Der bestimmte Artikel und „von“ entsprechen natürlichem deutschem Listenstil.
- source_word: קֶדֶשׁ
  choice: Kedesch
  rationale: Der Ortsname wird in der im Deutschen geläufigen biblischen Form wiedergegeben.
- source_word: אֶחָד
  choice: einer
  rationale: „Einer“ bewahrt den wiederholten Zählcharakter des hebräischen Verzeichnisses, ohne das bereits genannte Wort „König“ zu wiederholen.
- source_word: יָקְנֳעָם
  choice: Jokneam
  rationale: Der Ortsname wird in seiner üblichen deutschen biblischen Form wiedergegeben.
- source_word: לַכַּרְמֶל
  choice: am Karmel
  rationale: Die Präposition ל kann hier eine räumliche Lage oder regionale Zuordnung ausdrücken. „Am Karmel“ ist knapp und lässt offen, ob der Berg oder das zugehörige Gebiet gemeint ist.
theological_decisions: []
translation_notes:
