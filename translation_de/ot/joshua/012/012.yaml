lexical_decisions:
- source_word: מֶלֶךְ
  choice: der König
  rationale: Die übliche Wiedergabe von מֶלֶךְ ist »König«. In der deutschen Listenform ist der bestimmte Artikel vor der Ortsangabe natürlich.
- source_word: עֶגְלוֹן
  choice: Eglon
  rationale: Der Ortsname wird gemäß der etablierten deutschen biblischen Namensform transliteriert.
- source_word: אֶחָד
  choice: einer
  rationale: אֶחָד dient hier als knappe Zählangabe. »Einer« bewahrt die elliptische Listenform und bezieht sich grammatisch auf »König«, ohne das Substantiv zu wiederholen.
- source_word: גֶּזֶר
  choice: Geser
  rationale: Der Ortsname wird in der etablierten deutschen biblischen Schreibweise »Geser« wiedergegeben.
theological_decisions: []
translation_notes:
  register: Knappe, würdige Listenprosa. Die Ellipse des Hebräischen bleibt erhalten; »einer« klingt im Deutschen natürlicher als das isolierte »eins« und verweist eindeutig auf den jeweils genannten König.
