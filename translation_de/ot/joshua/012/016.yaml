  footnotes:
  - marker: a
    text: 'Das Hebräische hat den knappen Stil einer Aufzählung: „der König von Makkeda, einer; der König von Bethel, einer“. Mit „einer“ wird jeweils ein besiegter König gezählt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ
  choice: der König von
  rationale: Die Konstruktverbindung bezeichnet jeweils den Herrscher des genannten Stadtstaates. Der bestimmte Artikel entspricht in diesem deutschen Listenkontext natürlichem Sprachgebrauch.
- source_word: מַקֵּדָה
  choice: Makkeda
  rationale: Der Ortsname wird nach gängiger deutscher Bibeltradition transliteriert und nicht übersetzt.
- source_word: אֶחָד
  choice: einer
  rationale: Das Zahlwort zählt jeden zuvor genannten König einzeln. „Einer“ nimmt im Deutschen „der König“ auf und bewahrt den knappen, wiederholenden Listenstil.
- source_word: בֵּית אֵל
  choice: Bethel
  rationale: Die Verbindung ist hier eindeutig ein Ortsname; sie wird daher als „Bethel“ wiedergegeben und nicht etymologisch als „Haus Gottes“ übersetzt.
theological_decisions: []
