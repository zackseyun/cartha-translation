  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Ortsnamen werden transliteriert; „Seïr“ trägt ein Trema zur eindeutigen Aussprache. Der Doppelpunkt gliedert die lange geografische Angabe, ohne die Aussagebeziehungen des hebräischen Satzes zu verändern.
