  text: וְ/אֵ֣לֶּה מַלְכֵ֣י הָ/אָ֡רֶץ אֲשֶׁר֩ הִכָּ֨ה יְהוֹשֻׁ֜עַ וּ/בְנֵ֣י יִשְׂרָאֵ֗ל בְּ/עֵ֤בֶר הַ/יַּרְדֵּן֙ יָ֔מָּ/ה מִ/בַּ֤עַל גָּד֙ בְּ/בִקְעַ֣ת הַ/לְּבָנ֔וֹן וְ/עַד הָ/הָ֥ר הֶ/חָלָ֖ק הָ/עֹלֶ֣ה שֵׂעִ֑ירָ/ה וַ/יִּתְּנָ֨/הּ יְהוֹשֻׁ֜עַ לְ/שִׁבְטֵ֧י יִשְׂרָאֵ֛ל יְרֻשָּׁ֖ה כְּ/מַחְלְקֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/007.yaml
  text: And these are the kings of the land whom Joshua and the sons of Israel struck down beyond the Jordan westward[a], from Baal-gad in the Valley of Lebanon as far as Mount Halak, which rises toward Seir[b]; and Joshua gave it to the tribes of Israel as an inheritance according to their divisions.
translation:
  language: de
  text: 'Und dies sind die Könige des Landes, die Josua und die Israeliten[a] westlich des Jordan[b] niederschlugen: von Baal-Gad in der Ebene des Libanon bis zum Berg Halak, der nach Seïr hin ansteigt[c]. Josua gab das Land den Stämmen Israels als Erbbesitz, entsprechend ihren Abteilungen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Söhne Israels«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »jenseits des Jordan, meerwärts«, das heißt nach Westen.'
    reason: source_idiom
  - marker: c
    text: 'Oder: »der sich nach Seïr hinaufzieht«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Und dies sind
  rationale: Bewahrt die verbindende Konjunktion und leitet die folgende Liste in würdigem, natürlichem Deutsch ein.
- source_word: אֲשֶׁר הִכָּה
  choice: die … niederschlugen
  rationale: Gibt die kräftige Bedeutung von נכה im Eroberungskontext wieder, ohne auf altertümliches Deutsch zurückzugreifen.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: und die Israeliten
  rationale: Die idiomatische deutsche Volksbezeichnung verhindert das Missverständnis, nur die leiblichen Söhne des Stammvaters Israel seien gemeint; die wörtliche Form wird in einer Fußnote genannt.
- source_word: בְּעֵבֶר הַיַּרְדֵּן יָמָּה
  choice: westlich des Jordan
  rationale: Gibt die geografische Perspektive und die Richtung יָמָּה in natürlichem Deutsch wieder; die formnähere Ausdrucksweise wird in einer Fußnote dokumentiert.
- source_word: בְּבִקְעַת הַלְּבָנוֹן
  choice: in der Libanonsenke
  rationale: בִּקְעָה bezeichnet ein breites Tal oder eine Senke; „Libanonsenke“ ist eine prägnante geografische Wiedergabe.
- source_word: הָהָר הֶחָלָק
  choice: Berg Halak
  rationale: Die Wendung wird im Zusammenhang als Ortsname verstanden und daher transliteriert, statt als „glatter Berg“ übersetzt zu werden.
- source_word: הָעֹלֶה שֵׂעִירָה
  choice: der nach Seïr hin ansteigt
  rationale: Bewahrt den topografischen und richtungsbezogenen Sinn des Partizips, ohne zu behaupten, der Berg reiche sicher bis Seïr.
- source_word: יְרֻשָּׁה
  choice: als Erbbesitz
  rationale: Erfasst sowohl den Besitz- als auch den Zuteilungs- und Erbcharakter des Landes im Kontext des Josuabuches.
- source_word: כְּמַחְלְקֹתָם
  choice: entsprechend ihren Abteilungen
  rationale: Bleibt nahe an der Verteilungssprache des hebräischen Textes und legt die genaue organisatorische Art der Abteilungen nicht unnötig fest.
theological_decisions: []
