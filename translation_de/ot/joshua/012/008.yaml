base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/008.yaml
  text: in the hill country[a], and in the lowland, and in the Arabah, and on the slopes, and in the wilderness, and in the Negev—the Hittites, the Amorites, and the Canaanites, the Perizzites, the Hivites[c][b], and the Jebusites.
translation:
  language: de
  text: im Bergland, in der Schefela[a], in der Araba[b], an den Berghängen, in der Wüste und im Negev[c] – die Hethiter, Amoriter, Kanaaniter, Perisiter, Hiwiter und Jebusiter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Schefela ist das westliche Hügelland zwischen dem Bergland und der Küstenebene; auch: „in der Niederung“ oder „im Hügelland“.'
    reason: lexical_alternative
  - marker: b
    text: '„Araba“ ist der Name der Senke beziehungsweise trockenen Ebene des Jordangrabens; auch: „in der Wüstenebene“.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch: „im Südland“. Das hebräische Wort Negev kann sowohl die südliche Region als auch den Süden bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּהָר
  choice: im Bergland
  rationale: הַר bezeichnet hier innerhalb einer Aufzählung von Landschaftsräumen nicht einen einzelnen Berg, sondern das Bergland.
- source_word: וּבַשְּׁפֵלָה
  choice: in der Schefela
  rationale: שְׁפֵלָה ist hier die etablierte geografische Bezeichnung für das westliche Hügelland beziehungsweise die Niederung; die Umschrift bewahrt den Regionsnamen.
- source_word: וּבָעֲרָבָה
  choice: in der Araba
  rationale: עֲרָבָה bezeichnet hier als geografischer Name die Senke beziehungsweise trockene Ebene des Jordangrabens.
- source_word: וּבָאֲשֵׁדוֹת
  choice: an den Berghängen
  rationale: אֲשֵׁדוֹת bezeichnet Abhänge oder Gefälle; „Berghänge“ ist im geografischen Zusammenhang präzise und natürlich.
- source_word: וּבַמִּדְבָּר
  choice: in der Wüste
  rationale: מִדְבָּר bezeichnet unbesiedeltes, trockenes Weide- oder Steppenland; „Wüste“ ist die geläufige deutsche Wiedergabe, ohne zwingend eine Sandwüste zu meinen.
- source_word: וּבַנֶּגֶב
  choice: im Negev
  rationale: נֶגֶב kann „Süden“ bedeuten, bezeichnet in dieser geografischen Reihe aber wahrscheinlich die südliche Region Negev.
- source_word: הַחִתִּי
  choice: die Hetiter
  rationale: Der morphologische Singular ist kollektiv gebraucht und wird im Deutschen idiomatisch als Volksname im Plural wiedergegeben.
- source_word: הָאֱמֹרִי
  choice: die Amoriter
  rationale: Kollektiver Volksname, im Deutschen natürlich im Plural.
- source_word: וְהַכְּנַעֲנִי
  choice: die Kanaaniter
  rationale: Kollektiver Volksname, im Deutschen natürlich im Plural.
- source_word: הַפְּרִזִּי
  choice: die Perisiter
  rationale: Kollektiver Volksname; „Perisiter“ ist eine geläufige deutsche Form.
- source_word: הַחִוִּי
  choice: die Hiwiter
  rationale: Kollektiver Volksname; „Hiwiter“ ist eine geläufige deutsche Form.
- source_word: וְהַיְבוּסִי
  choice: die Jebusiter
  rationale: Kollektiver Volksname, im Deutschen natürlich im Plural.
