  text: der König von Schimron-Meron[a], einer; der König von Achschaf, einer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Möglicherweise sind auch zwei getrennte Ortsnamen gemeint: »Schimron« und »Meron«. Meist wird der hebräische Ausdruck hier jedoch als zusammengesetzter Name »Schimron-Meron« verstanden; dazu passt, dass der Vers zwei Könige zählt.'
    reason: alternative_reading
lexical_decisions:
- source_word: מֶלֶךְ
  choice: der König von
  rationale: In der wiederkehrenden Listenformel bezeichnet מֶלֶךְ den jeweiligen Herrscher eines Stadtstaates. Der bestimmte Artikel entspricht natürlichem deutschen Sprachgebrauch.
- source_word: שִׁמְרוֹן מְראוֹן
  choice: Schimron-Meron
  rationale: Die masoretische Überlieferung wird hier gewöhnlich als zusammengesetzter Ortsname verstanden; dies passt auch zur Zählstruktur des Verses mit insgesamt zwei Königen. Der Ortsname wird nach deutscher Bibeltradition transliteriert.
- source_word: אֶחָד
  choice: einer
  rationale: אֶחָד ist in der Zählformel elliptisch gebraucht. Das substantivische „einer“ nimmt „König“ auf und bewahrt die knappe Listenform des Hebräischen.
- source_word: אַכְשָׁף
  choice: Achschaf
  rationale: Der Ortsname wird in einer im Deutschen geläufigen biblichen Transliterationsform wiedergegeben.
