id: JOS.12.1
reference: Joshua 12:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אֵ֣לֶּה מַלְכֵ֣י הָ/אָ֗רֶץ אֲשֶׁ֨ר הִכּ֤וּ בְנֵֽי יִשְׂרָאֵל֙ וַ/יִּֽרְשׁ֣וּ אֶת אַרְצָ֔/ם בְּ/עֵ֥בֶר הַ/יַּרְדֵּ֖ן מִזְרְחָ֣/ה הַ/שָּׁ֑מֶשׁ מִ/נַּ֤חַל אַרְנוֹן֙ עַד הַ֣ר חֶרְמ֔וֹן וְ/כָל הָ/עֲרָבָ֖ה מִזְרָֽחָ/ה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/001.yaml
  text: These are the kings of the land whom the sons of Israel struck down and whose land they took possession of beyond the Jordan[a], toward the sunrise, from the Wadi Arnon as far as Mount Hermon[d][c][b], and all the Arabah eastward.
translation:
  language: de
  text: 'Und dies sind die Könige des Landes, die die Israeliten[a] besiegten und deren Land sie in Besitz nahmen: jenseits des Jordan, im Osten[b], vom Arnontal[c] bis zum Berg Hermon sowie die ganze Araba[d] im Osten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Söhne Israels“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „zum Aufgang der Sonne hin“, das heißt: im Osten.'
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Wort kann einen Bachlauf oder ein Wadi, also ein zeitweise trockenes Flusstal, bezeichnen.
    reason: cultural_note
  - marker: d
    text: 'Oder: „die ganze Ebene“. „Araba“ ist eine geografische Bezeichnung für die Senke des Jordangrabens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Und dies sind
  rationale: Das einleitende Waw wahrt den Zusammenhang mit dem vorausgehenden Text; „dies sind“ eröffnet zugleich natürlich die folgende Übersicht.
- source_word: מַלְכֵי הָאָרֶץ
  choice: die Könige des Landes
  rationale: Gibt die hebräische Status-constructus-Verbindung formal und im territorialen Zusammenhang angemessen wieder.
- source_word: אֲשֶׁר הִכּוּ
  choice: die ... besiegten
  rationale: נכה bezeichnet im militärischen Zusammenhang das Schlagen beziehungsweise Besiegen. „Besiegten“ ist im Deutschen natürlich und behauptet nicht ausdrücklich, dass jeder König eigenhändig getötet wurde.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die geläufige moderne deutsche Bezeichnung gibt die kollektive Bedeutung von „Söhne Israels“ klar wieder; die wörtliche Form wird in einer Fußnote genannt.
- source_word: וַיִּרְשׁוּ אֶת־אַרְצָם
  choice: und deren Land sie in Besitz nahmen
  rationale: ירשׁ bedeutet im Eroberungskontext, Land in Besitz zu nehmen. Die Relativkonstruktion vermeidet im Deutschen eine missverständliche Zuordnung des Pronomens.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: jenseits des Jordan
  rationale: Traditionelle, knappe Wiedergabe; die nachfolgende Ostangabe bestimmt eindeutig, welche Seite gemeint ist.
- source_word: מִזְרְחָה הַשָּׁמֶשׁ
  choice: im Osten
  rationale: Die hebräische Wendung lautet bildhaft „zum Aufgang der Sonne hin“ und bezeichnet hier die Himmelsrichtung Osten; die Bildlichkeit bleibt in der Fußnote sichtbar.
- source_word: מִנַּחַל אַרְנוֹן
  choice: vom Arnontal
  rationale: נחל kann den Wasserlauf samt Einschnitt beziehungsweise ein Wadi bezeichnen. „Arnontal“ ist im modernen Deutsch verständlich, ohne ein dauerhaft wasserführendes Gewässer vorauszusetzen.
- source_word: עַד הַר חֶרְמוֹן
  choice: bis zum Berg Hermon
  rationale: Gibt die räumliche Ausdehnung präzise und natürlich wieder.
- source_word: וְכָל הָעֲרָבָה
  choice: sowie die ganze Araba
  rationale: „Araba“ bewahrt die spezifische geografische Bezeichnung, statt sie zum unspezifischen „Ebene“ zu verallgemeinern.
- source_word: מִזְרָחָה
  choice: im Osten
  rationale: Natürliche adverbiale Wiedergabe der abschließenden geografischen Bestimmung.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, sachlichem Ton. Geografische Fachbezeichnungen werden dort bewahrt, wo eine generische Übersetzung Präzision verlieren ließe. Die Satzgliederung mit Doppelpunkt macht deutlich, dass die folgenden Ortsangaben das in Besitz genommene Gebiet bestimmen.
