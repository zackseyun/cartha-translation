  text: 'der König von Dor in Nafat-Dor[a]: einer; der König von Gojim[b] in Gilgal: einer;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »auf den Höhen von Dor« oder »im Bezirk Dor«; der hebräische Ausdruck kann eine Region bezeichnen und zugleich auf ihre Höhenlage hinweisen.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bedeutet gewöhnlich »Völker« oder »Nationen«, kann hier aber als Orts- oder Gebietsname verstanden werden. Daher wird es im Haupttext als »Gojim« wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: מֶלֶךְ
  choice: der König von
  rationale: In der Liste leitet מֶלֶךְ jeweils einen Eintrag im Status constructus ein. Die bestimmte Form entspricht dem deutschen Listenstil.
- source_word: דּוֹר
  choice: Dor
  rationale: Der Ortsname wird in geläufiger deutscher Form wiedergegeben.
- source_word: לְנָפַת דּוֹר
  choice: im Gebiet von Dor
  rationale: נָפָה bezeichnet hier eine geografische Region beziehungsweise einen Bezirk. Die Wiedergabe bleibt verständlich und legt die mögliche topografische Bedeutung nicht zu eng fest.
- source_word: אֶחָד
  choice: einer
  rationale: Das wiederholte אֶחָד dient in Josua 12 als knappe Zählangabe für jeden besiegten König; „einer“ bewahrt diesen Listencharakter.
- source_word: גּוֹיִם
  choice: Gojim
  rationale: Obwohl das Wort gewöhnlich „Völker“ bedeutet, kann es hier als Orts- oder Gebietsbezeichnung fungieren. Die Transliteration bewahrt diese Unsicherheit.
- source_word: לְגִלְגָּל
  choice: in Gilgal
  rationale: Die Präposition לְ kennzeichnet hier die Zuordnung zu einem Ort; „in Gilgal“ ist eine natürliche deutsche Wiedergabe.
