lexical_decisions:
- source_word: מֶלֶךְ
  choice: der König von
  rationale: In der Liste bezeichnet מֶלֶךְ jeweils den Herrscher eines Ortes oder Gebiets. Der bestimmte Artikel und „von“ ergeben im Deutschen eine natürliche, knappe Listenform.
- source_word: אֲפֵק
  choice: Afek
  rationale: Der Ortsname wird in einer im Deutschen gut lesbaren Transliteration wiedergegeben.
- source_word: אֶחָד
  choice: einer
  rationale: אֶחָד dient hier als Zählangabe für jeden besiegten König. „Einer“ bewahrt den knappen, aufzählenden Stil und bezieht sich grammatisch auf „König“.
- source_word: לַשָּׁרוֹן
  choice: von Scharon
  rationale: Die Form bezeichnet die Zugehörigkeit zum Gebiet Scharon. „Von Scharon“ ist im modernen Deutschen idiomatisch; der im Hebräischen enthaltene Artikel wird in einer Fußnote kenntlich gemacht.
theological_decisions: []
translation_notes:
  register: Knappe, würdige Listenprosa. Die Wiederholung von „der König“ und „einer“ bildet die formelhafte Struktur des Hebräischen nach; die Ortsnamen werden nicht erläuternd erweitert.
