  text: מֹשֶׁ֧ה עֶֽבֶד יְהוָ֛ה וּ/בְנֵ֥י יִשְׂרָאֵ֖ל הִכּ֑וּ/ם וַֽ֠/יִּתְּנָ/הּ מֹשֶׁ֨ה עֶֽבֶד יְהוָ֜ה יְרֻשָּׁ֗ה לָ/רֻֽאוּבֵנִי֙ וְ/לַ/גָּדִ֔י וְ/לַ/חֲצִ֖י שֵׁ֥בֶט הַֽ/מְנַשֶּֽׁה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/006.yaml
  text: Moses the servant of Yahweh[a], and the sons of Israel, struck them down, and Moses the servant of Yahweh gave it as an inheritance to the Reubenites, the Gadites, and the half-tribe of Manasseh.
translation:
  language: de
  text: Mose, der Diener Jahwes, und die Israeliten besiegten sie. Mose, der Diener Jahwes, gab das Land den Rubenitern, den Gaditern und dem halben Stamm Manasse als Erbbesitz.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֶבֶד
  choice: Diener
  rationale: Im Ehrentitel für Mose bezeichnet עֶבֶד seinen ergebenen Dienst und seine Beauftragung durch Gott; „Diener“ ist im Deutschen angemessener als „Sklave“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im modernen Deutschen geläufige Form.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die wörtliche Wendung „Söhne Israels“ bezeichnet hier kollektiv das Volk Israel. „Die Israeliten“ gibt diesen Sinn natürlich und eindeutig wieder.
- source_word: הִכּוּם
  choice: besiegten sie
  rationale: נכה kann im militärischen Zusammenhang das Niederschlagen oder Besiegen bezeichnen. In dieser zusammenfassenden Königsliste ist „besiegten“ idiomatisch und lässt offen, ob der Akzent auf Niederlage oder Tötung liegt.
- source_word: וַיִּתְּנָהּ
  choice: gab ihr Land
  rationale: Das feminine Suffix verweist auf das im Zusammenhang vorausgesetzte Land beziehungsweise Gebiet. Die ausdrückliche Wiedergabe mit „ihr Land“ verhindert im Deutschen einen unklaren Bezug von „es“.
- source_word: יְרֻשָּׁה
  choice: als Erbbesitz
  rationale: יְרֻשָּׁה bezeichnet einen vererbbaren beziehungsweise zugeteilten Besitz. „Erbbesitz“ bewahrt den Land- und Besitzaspekt prägnanter als das abstraktere „Erbe“.
- source_word: לָרֻאוּבֵנִי וְלַגָּדִי
  choice: den Rubenitern, den Gaditern
  rationale: Die gentilischen Singularformen werden kollektiv gebraucht und bezeichnen die Angehörigen der beiden Stämme.
- source_word: חֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: dem halben Stamm Manasse
  rationale: Die Formulierung bezeichnet die östlich des Jordan angesiedelte Hälfte des Stammes Manasse und wird im Deutschen klar und konventionell wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. Die Transkription „Jahwe“ bewahrt diesen, statt ihn durch den Titel „der HERR“ zu ersetzen.
- issue: Korporative Wendung בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: Die Wendung ist eine feste kollektive Bezeichnung des Volkes und nicht auf männliche Israeliten beschränkt. Die natürliche deutsche Wiedergabe verhindert ein sachlich irreführendes Geschlechtsverständnis.
- issue: Reichweite des Verbs נכה im Kriegsbericht
  choice: besiegten sie
  alternative: schlugen sie nieder
  rationale: Das Verb kann sowohl den konkreten Schlag als auch militärisches Besiegen beziehungsweise Töten ausdrücken. „Besiegten“ wahrt im knappen Rückblick die mögliche Bedeutungsbreite, ohne eine ausdrücklichere Tötungsaussage einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzgliederung. Die Wiederholung „Mose, der Diener Jahwes“ bleibt entsprechend dem hebräischen Text erhalten. Keine Fußnoten erforderlich.
