  edition: WLC
  text: וּ/גְב֗וּל ע֚וֹג מֶ֣לֶךְ הַ/בָּשָׁ֔ן מִ/יֶּ֖תֶר הָ/רְפָאִ֑ים הַ/יּוֹשֵׁ֥ב בְּ/עַשְׁתָּר֖וֹת וּ/בְ/אֶדְרֶֽעִי׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/004.yaml
  text: and the territory of Og king of Bashan[a], from the remnant of the Rephaim, who lived in Ashtaroth and in Edrei.
translation:
  language: de
  text: und das Gebiet Ogs, des Königs von Baschan, der einer der letzten Refaïter war und in Aschtarot und Edreï wohnte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/גְב֗וּל
  choice: und das Gebiet
  rationale: גְּבוּל kann Grenze oder Gebiet bezeichnen. In dieser Zusammenfassung der eroberten Herrschaftsbereiche ist „Gebiet“ sachlich und im Deutschen natürlich; ו führt die Aufzählung weiter.
- source_word: ע֚וֹג מֶ֣לֶךְ הַ/בָּשָׁ֔ן
  choice: Ogs, des Königs von Baschan
  rationale: Der Eigenname wird in der im Deutschen üblichen Form „Og“ wiedergegeben; die Apposition bezeichnet ihn als König von Baschan.
- source_word: מִ/יֶּ֖תֶר הָ/רְפָאִ֑ים
  choice: der zu den Übriggebliebenen der Refaïter gehörte
  rationale: Wörtlich steht „vom Rest der Refaïm“. Die Formulierung macht im Deutschen natürlich und ohne Bedeutungsverlust deutlich, dass Og zu den noch verbliebenen Angehörigen dieser Volksgruppe zählte.
- source_word: הָ/רְפָאִ֑ים
  choice: der Refaïter
  rationale: Der hebräische Gruppenname wird als Ethnonym wiedergegeben und nicht im Haupttext deutend mit „Riesen“ übersetzt. Der Trema dient der klaren Aussprache als Re-fa-i-ter.
- source_word: הַ/יּוֹשֵׁ֥ב
  choice: und … wohnte
  rationale: Das singularische Partizip bezieht sich grammatisch auf Og. ישב bezeichnet hier seinen Wohn- beziehungsweise Herrschaftssitz.
- source_word: בְּ/עַשְׁתָּר֖וֹת וּ/בְ/אֶדְרֶֽעִי
  choice: in Aschtarot und Edreï
  rationale: Die Ortsnamen werden deutsch transliteriert; beide Präpositionen bezeichnen den Ort, an dem Og wohnte.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt als Fortsetzung der Aufzählung aus dem vorherigen Vers mit „und“ eröffnet. Das Ethnonym bleibt im Haupttext erhalten; die traditionelle Deutung als „Riesen“ wird in der Fußnote kenntlich gemacht.
