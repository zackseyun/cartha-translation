  terminology: „Jahwe“, „Mose“, „Josua“ und „Diener Jahwes“ sind konsistent und angemessen. „Moses Diener“ ist als Wiedergabe von מְשָׁרֵת möglich; die genannten Alternativen in der Fußnote markieren die engere Bedeutung des persönlichen Dienstes.
