id: JOS.1.1
reference: Joshua 1:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְהִ֗י אַחֲרֵ֛י מ֥וֹת מֹשֶׁ֖ה עֶ֣בֶד יְהוָ֑ה וַ/יֹּ֤אמֶר יְהוָה֙ אֶל יְהוֹשֻׁ֣עַ בִּן נ֔וּן מְשָׁרֵ֥ת מֹשֶׁ֖ה לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/001.yaml
  text: 'After the death of Moses[a], the servant of Yahweh, Yahweh said to Joshua son of Nun, the attendant of Moses, saying:'
translation:
  language: de
  text: 'Nach dem Tod von Mose, dem Diener Jahwes, sagte Jahwe zu Josua, dem Sohn Nuns und Moses Diener[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch »Moses Diener«; auch »Moses Helfer« oder »Moses Assistent«.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי מוֹת
  choice: Nach dem Tod
  rationale: Die hebräische Eröffnungsformel leitet die Erzählung ein und bezeichnet hier vor allem den zeitlichen Anschluss. Die knappe deutsche Fügung gibt dies natürlich wieder, ohne ein im Ausgangstext nicht ausdrücklich vorhandenes »nun« einzuführen.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Verwendet die im Deutschen etablierte Form des Namens.
- source_word: עֶבֶד יְהוָה
  choice: Diener Jahwes
  rationale: עֶבֶד kann auch einen Sklaven bezeichnen; als Ehrentitel für Mose steht hier jedoch sein Dienst für Gott im Vordergrund. »Diener« bewahrt diesen Sinn und bleibt idiomatisch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt das Tetragramm als den persönlichen Gottesnamen wieder, statt es durch den Titel »der HERR« zu ersetzen.
- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: Die übliche und kontextgerechte Wiedergabe von אמר zur Einleitung direkter Rede.
- source_word: יְהוֹשֻׁעַ
  choice: Josua
  rationale: Verwendet die im Deutschen etablierte Form des Namens.
- source_word: בִּן נוּן
  choice: dem Sohn Nuns
  rationale: Gibt die patronymische Bezeichnung in natürlicher deutscher Apposition wieder.
- source_word: מְשָׁרֵת מֹשֶׁה
  choice: Moses Diener
  rationale: Das Partizip bezeichnet jemanden, der Mose persönlich zur Seite stand und ihm diente. »Diener« ist würdig und verständlich; eine Fußnote hält die möglichen Nuancen »Helfer« und »Assistent« offen.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Doppelpunkt erfüllt im heutigen Deutsch natürlich die Funktion des hebräischen Infinitivs zur Einleitung der unmittelbar folgenden Rede.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Eigennamen Gottes. »Jahwe« bewahrt diese Funktion und ist die im Deutschen übliche wissenschaftlich begründete Umschrift.
- issue: Wiedergabe von עֶבֶד in Moses Ehrentitel
  choice: Diener
  alternative: Sklave
  rationale: Obwohl das Wort beide Bedeutungsbereiche umfassen kann, bezeichnet »Diener Jahwes« hier Moses ehrenvolle, beauftragte Stellung und nicht vorrangig seinen rechtlichen Status.
- issue: Unterscheidung zwischen עֶבֶד und מְשָׁרֵת
  choice: beide im Haupttext mit »Diener«, die Nuance von מְשָׁרֵת in der Fußnote erläutert
  alternative: »Diener Jahwes« und »Moses Helfer«
  rationale: Im Deutschen ist »Moses Diener« eine natürliche und würdevolle Rollenbezeichnung. Da מְשָׁרֵת stärker auf persönlichen Beistand und Dienst zielt, werden engere Alternativen ausdrücklich in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz wahrt die feierliche Eröffnung, vermeidet aber die altertümliche Formel »Und es geschah«. Der Doppelpunkt kündigt die in Vers 2 folgende direkte Rede an.
