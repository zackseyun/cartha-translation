  text: לֹֽא יָמ֡וּשׁ סֵפֶר֩ הַ/תּוֹרָ֨ה הַ/זֶּ֜ה מִ/פִּ֗י/ךָ וְ/הָגִ֤יתָ בּ/וֹ֙ יוֹמָ֣ם וָ/לַ֔יְלָה לְמַ֨עַן֙ תִּשְׁמֹ֣ר לַ/עֲשׂ֔וֹת כְּ/כָל הַ/כָּת֖וּב בּ֑/וֹ כִּי אָ֛ז תַּצְלִ֥יחַ אֶת דְּרָכֶ֖/ךָ וְ/אָ֥ז תַּשְׂכִּֽיל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/008.yaml
  text: This book of the law shall not depart from your mouth[a], but you shall meditate on it day and night, so that you may be careful to do according to all that is written in it. For then you will make your way prosper, and then you will act wisely.
translation:
  language: de
  text: Dieses Buch des Gesetzes soll nicht von deinem Mund weichen. Denke Tag und Nacht darüber nach[a], damit du darauf achtest, nach allem zu handeln, was darin geschrieben steht. Denn dann wirst du auf deinem Weg Erfolg haben und weise handeln.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sprich es immer wieder leise vor dich hin“ beziehungsweise „sage es leise auf“. Das hebräische Verb kann sowohl nachdenkliches Betrachten als auch leises mündliches Wiederholen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמוּשׁ
  choice: soll nicht … weichen
  rationale: Das Verb bezeichnet ein Weichen oder Sichentfernen. Zusammen mit „von deinem Mund“ bewahrt diese Wiedergabe das konkrete Bild fortwährenden Sprechens und Wiederholens.
- source_word: סֵפֶר הַתּוֹרָה הַזֶּה
  choice: dieses Buch des Gesetzes
  rationale: סֵפֶר kann Buch, Schriftrolle oder Schriftstück bedeuten; „Buch“ ist hier natürlich und traditionsnah. תּוֹרָה bezeichnet in diesem Bundeszusammenhang die schriftlich vorliegende Weisung mit verbindlichem Charakter, daher „Gesetz“.
- source_word: מִפִּיךָ
  choice: von deinem Mund
  rationale: Die konkrete hebräische Ausdrucksweise bleibt erhalten und verweist auf Sprechen, Aufsagen und beständige Verfügbarkeit auf den Lippen.
- source_word: וְהָגִיתָ בּוֹ
  choice: Denke … darüber nach
  rationale: הגה umfasst nachsinnendes Betrachten, kann aber auch leises Murmeln oder Aufsagen bezeichnen. „darüber nachdenken“ ist im modernen Deutschen verständlich; die mögliche mündliche Nuance wird in der Fußnote bewahrt.
- source_word: יוֹמָם וָלַיְלָה
  choice: Tag und Nacht
  rationale: Die wörtliche und idiomatische Wortverbindung bezeichnet eine fortwährende Beschäftigung.
- source_word: לְמַעַן תִּשְׁמֹר לַעֲשׂוֹת
  choice: damit du darauf achtest, … zu handeln
  rationale: Die Konstruktion drückt einen Zweck aus und verbindet sorgfältige Beachtung mit tätigem Gehorsam.
- source_word: כְּכָל הַכָּתוּב בּוֹ
  choice: nach allem …, was darin geschrieben steht
  rationale: Die Formulierung erhält sowohl den umfassenden Sinn von כְּכָל als auch die schriftliche Norm.
- source_word: תַּצְלִיחַ אֶת דְּרָכֶךָ
  choice: wirst du deinen Weg zum Erfolg führen
  rationale: Die kausative Verbform stellt Josua als denjenigen dar, der seinen Weg gelingen lässt; die Wiedergabe bewahrt diese Nuance in verständlichem Deutsch.
- source_word: תַּשְׂכִּיל
  choice: wirst du weise handeln
  rationale: Das Verb bezeichnet einsichtiges oder kluges Handeln, das Erfolg einschließen kann. „weise handeln“ unterscheidet es vom unmittelbar vorhergehenden Ausdruck für Gelingen.
theological_decisions:
- issue: Bedeutung von תּוֹרָה im Bundeszusammenhang
  choice: Gesetz
  alternative: Weisung; Tora
  rationale: Obwohl תּוֹרָה allgemein „Weisung“ bedeuten kann, bezeichnet es hier die schriftlich festgehaltene, für Josua verbindliche Bundesweisung. „Gesetz“ gibt diese Funktion transparent wieder, ohne den Begriff unnötig einzuengen.
- issue: הגה als mündliches Wiederholen oder inneres Nachdenken
  choice: darüber nachdenken
  alternative: es leise vor sich hin sprechen; es murmeln; es aufsagen
  rationale: 'Der Zusammenhang verbindet beide Dimensionen: Das Buch bleibt in Josuas Mund, und er soll sich beständig damit beschäftigen. Der Haupttext ist natürlich lesbar; die Fußnote erhält die echte lexikalische Mehrdeutigkeit.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Singular. Die konkreten Bilder „Buch“, „Mund“ und „Weg“ bleiben erhalten. Die Satzfolge folgt weitgehend dem Hebräischen, während die Zweck- und Folgesätze natürlich deutsch formuliert sind.
