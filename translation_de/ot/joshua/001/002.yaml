source:
  edition: WLC
  text: מֹשֶׁ֥ה עַבְדִּ֖/י מֵ֑ת וְ/עַתָּה֩ ק֨וּם עֲבֹ֜ר אֶת הַ/יַּרְדֵּ֣ן הַ/זֶּ֗ה אַתָּה֙ וְ/כָל הָ/עָ֣ם הַ/זֶּ֔ה אֶל הָ/אָ֕רֶץ אֲשֶׁ֧ר אָנֹכִ֛י נֹתֵ֥ן לָ/הֶ֖ם לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/002.yaml
  text: Moses my servant is dead. So now[a], arise, cross this Jordan—you and all this people—into the land that I am giving to them, to the sons of Israel.
translation:
  language: de
  text: Mose, mein Diener, ist tot. So mach dich nun auf und überquere diesen Jordan, du und dieses ganze Volk, in das Land, das ich ihnen gebe, den Söhnen Israels[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Israeliten« beziehungsweise »den Kindern Israels«. Wörtlich steht im Hebräischen: »den Söhnen Israels«.'
    reason: Lexikalische Alternative und Erläuterung der kollektiven Bezeichnung.
lexical_decisions:
- source_word: עַבְדִּי
  choice: mein Diener
  rationale: עֶבֶד kann »Diener« oder »Sklave« bedeuten. Hier bezeichnet das Wort Moses ehrenvolle Stellung gegenüber Gott; »mein Diener« gibt dies im Deutschen angemessen wieder.
- source_word: מֵת
  choice: ist tot
  rationale: Die Qatal-Form stellt Moses Tod als gegenwärtige Tatsache fest. »Ist tot« bewahrt die knappe, eindringliche Aussage des Hebräischen.
- source_word: וְעַתָּה
  choice: So … nun
  rationale: Die Verbindung leitet von Moses Tod zu Josuas Auftrag über und trägt im Zusammenhang folgernde Kraft. Die getrennte Wiedergabe »So … nun« klingt natürlich und erhält beide Nuancen.
- source_word: קוּם
  choice: mach dich … auf
  rationale: Der Imperativ fordert zum entschlossenen Handeln auf. »Mach dich auf« ist gegenwärtiges, würdevolles Deutsch und passt besser zu einem Aufbruch als das rein körperliche »steh auf«.
- source_word: עֲבֹר אֶת־הַיַּרְדֵּן הַזֶּה
  choice: überquere diesen Jordan
  rationale: Mit dem Jordan als direktem Objekt bedeutet עָבַר hier »überqueren«. Der ausdrückliche Demonstrativ הַזֶּה wird durch »diesen« bewahrt.
- source_word: אַתָּה וְכָל־הָעָם הַזֶּה
  choice: du und dieses ganze Volk
  rationale: Die Formulierung erhält das ausdrücklich gesetzte »du«, den kollektiven Singular »Volk« und den Demonstrativ.
- source_word: אֶל־הָאָרֶץ
  choice: in das Land
  rationale: Bei der Bewegung über den Jordan bezeichnet אֶל den Eintritt in das Zielgebiet; »in das Land« bringt diese Richtung im Deutschen klar zum Ausdruck.
- source_word: אֲשֶׁר אָנֹכִי נֹתֵן לָהֶם
  choice: das ich ihnen gebe
  rationale: Das Partizip נֹתֵן stellt Gottes Geben als gegenwärtig beziehungsweise unmittelbar bevorstehend dar. Das deutsche Präsens lässt diese aspektuelle Offenheit bestehen.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: den Söhnen Israels
  rationale: Die formnahe Wiedergabe bewahrt den maskulinen Plural בְּנֵי und die alttestamentliche Stammesbezeichnung; eine Fußnote weist auf die idiomatischen deutschen Alternativen hin.
theological_decisions:
- issue: Geschlechtlich markierte kollektive Bezeichnung לִבְנֵי יִשְׂרָאֵל
  choice: den Söhnen Israels
  alternative: den Israeliten; den Kindern Israels
  rationale: Der hebräische Ausdruck lautet formal »Söhne Israels«, bezeichnet im Kontext jedoch das Bundesvolk als Ganzes. Der Haupttext bewahrt die sprachliche Form, während die Fußnote die umfassende kollektive Bedeutung erkennen lässt, ohne den Ausdruck auf männliche Personen zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt der knappen göttlichen Beauftragung, vermeidet jedoch unnötige Hebraismen; »mach dich auf« erhält den feierlichen Handlungsimpuls.
