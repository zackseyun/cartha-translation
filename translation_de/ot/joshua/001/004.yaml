  to: Von der Wüste und diesem Libanon bis zum großen Strom, dem Euphrat, über das ganze Land der Hetiter hinweg und bis zum Großen Meer[a] in Richtung Sonnenuntergangs[b] soll sich euer Gebiet erstrecken.
  rationale: Die Revision berichtigt die unzutreffende wörtliche Erklärung in Fußnote b und integriert „das ganze Land der Hetiter“ in die Grenzaufzählung. „Über … hinweg“ verdeutlicht die Ausdehnung, ohne die historisch und geografisch diskutierte Reichweite von „Land der Hetiter“ näher festzulegen. Die Formulierung „soll sich euer Gebiet erstrecken“ bewahrt den promissorischen Charakter und die räumliche Aussage von יִהְיֶה גְּבוּלְכֶם.
