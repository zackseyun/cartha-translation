  text: מֵ/הַ/מִּדְבָּר֩ וְ/הַ/לְּבָנ֨וֹן הַ/זֶּ֜ה וְֽ/עַד הַ/נָּהָ֧ר הַ/גָּד֣וֹל נְהַר פְּרָ֗ת כֹּ֚ל אֶ֣רֶץ הַֽ/חִתִּ֔ים וְ/עַד הַ/יָּ֥ם הַ/גָּד֖וֹל מְב֣וֹא הַ/שָּׁ֑מֶשׁ יִֽהְיֶ֖ה גְּבוּלְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/004.yaml
  text: From the wilderness and this Lebanon as far as the great river[a], the Euphrates River—all the land of the Hittites—and as far as the Great Sea, toward the going down of the sun[b], shall be your border.
translation:
  language: de
  text: Von der Wüste und diesem Libanon bis zum großen Strom, dem Euphrat, über das ganze Land der Hetiter hinweg und bis zum Großen Meer[a] in Richtung Sonnenuntergangs[b] soll sich euer Gebiet erstrecken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Damit ist das Mittelmeer gemeint.
    reason: cross_reference
  - marker: b
    text: 'Oder: „nach Westen“; wörtlich: „in Richtung des Untergangs der Sonne“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵהַמִּדְבָּר
  choice: Von der Wüste
  rationale: מִדְבָּר bezeichnet unbewohntes, trockenes Land. „Wüste“ ist im Deutschen die natürliche geografische Wiedergabe, ohne eine bestimmte Wüstenregion ausdrücklich festzulegen.
- source_word: וְהַלְּבָנוֹן הַזֶּה
  choice: und diesem Libanon
  rationale: Der ausdrücklich gesetzte Demonstrativ הַזֶּה wird mit „diesem“ bewahrt; „Libanon“ bleibt als geografischer Eigenname stehen.
- source_word: וְעַד הַנָּהָר הַגָּדוֹל נְהַר פְּרָת
  choice: bis an den großen Strom, den Euprat
  rationale: 'Die Apposition des Hebräischen bleibt erkennbar: Zunächst wird „der große Strom“ genannt, anschließend als Euphrat bestimmt. „Bis an“ entspricht עַד in einer Grenzbeschreibung.'
- source_word: כֹּל אֶרֶץ הַחִתִּים
  choice: das ganze Land der Hetiter
  rationale: Die umfassende Bedeutung von כֹּל und die ethnisch-geografische Genitivverbindung werden transparent wiedergegeben.
- source_word: וְעַד הַיָּם הַגָּדוֹל
  choice: und bis an das Große Meer[a]
  rationale: Die wörtliche geografische Bezeichnung „Großes Meer“ bleibt im Haupttext erhalten; ihre Identifizierung als Mittelmeer steht in der Fußnote.
- source_word: מְבוֹא הַשָּׁמֶשׁ
  choice: gegen Sonnenuntergang[b]
  rationale: Die Wendung bewahrt das hebräische Bild vom Untergehen der Sonne und ist zugleich als Richtungsangabe verständlich. Die idiomatische Bedeutung „nach Westen“ wird in der Fußnote genannt.
- source_word: יִהְיֶה גְּבוּלְכֶם
  choice: soll euer Gebiet reichen
  rationale: גְּבוּל kann sowohl Grenze als auch abgegrenztes Gebiet bezeichnen. In der deutschen Satzführung bringt „euer Gebiet reichen“ die Ausdehnung bis zu den zuvor genannten Grenzpunkten natürlich zum Ausdruck; der imperfektische Verbalcharakter erscheint als Zusage mit „soll“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Grenzbeschreibung bleibt nahe an der hebräischen Abfolge, wird aber durch die abschließende Formulierung „soll euer Gebiet reichen“ idiomatisch ins Deutsche gefasst. Die Gedankenstriche markieren den eingeschobenen geografischen Ausdruck.
