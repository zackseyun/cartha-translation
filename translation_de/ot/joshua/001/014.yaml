  text: נְשֵׁי/כֶ֣ם טַפְּ/כֶם֮ וּ/מִקְנֵי/כֶם֒ יֵשְׁב֕וּ בָּ/אָ֕רֶץ אֲשֶׁ֨ר נָתַ֥ן לָ/כֶ֛ם מֹשֶׁ֖ה בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֑ן וְ/אַתֶּם֩ תַּעַבְר֨וּ חֲמֻשִׁ֜ים לִ/פְנֵ֣י אֲחֵי/כֶ֗ם כֹּ֚ל גִּבּוֹרֵ֣י הַ/חַ֔יִל וַ/עֲזַרְתֶּ֖ם אוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/014.yaml
  text: Your wives[a], your little ones, and your livestock shall remain in the land that Moses gave you beyond the Jordan. But you shall cross over before your brothers, armed, all the mighty men of valor[b], and you shall help them.
translation:
  language: de
  text: Eure Frauen, eure Kinder und euer Vieh sollen in dem Land bleiben, das Mose euch jenseits des Jordan gegeben hat. Ihr aber sollt gerüstet[a] vor euren Brüdern[b] hinüberziehen, alle tapferen Krieger, und ihnen helfen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in Schlachtordnung« beziehungsweise »zum Kampf aufgestellt«.'
    reason: alternative_reading
  - marker: b
    text: Mit »euren Brüdern« sind hier die übrigen Israeliten gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְשֵׁיכֶם
  choice: eure Frauen
  rationale: Im familiären und militärischen Zusammenhang bezeichnet der Ausdruck die Ehefrauen der angesprochenen Männer; „Frauen“ ist im Deutschen die natürliche kontextuelle Wiedergabe.
- source_word: טַפְּכֶם
  choice: eure Kinder
  rationale: טַף bezeichnet kleine Kinder beziehungsweise die nicht kämpfenden Angehörigen. „Kinder“ ist verständlich und vermeidet die heute leicht verniedlichende Wirkung von „die Kleinen“.
- source_word: וּמִקְנֵיכֶם
  choice: und euer Vieh
  rationale: מִקְנֶה meint hier die gehaltenen Tiere beziehungsweise Herden; „Vieh“ ist präzise und idiomatisch.
- source_word: יֵשְׁבוּ
  choice: sollen … bleiben
  rationale: ישב kann sitzen, wohnen oder bleiben bedeuten. Hier steht das Zurückbleiben der Familien und Herden im Gegensatz zum Hinüberziehen der Kämpfer.
- source_word: בָּאָרֶץ
  choice: in dem Land
  rationale: אֶרֶץ bezeichnet das den Stämmen bereits zugeteilte Gebiet östlich des Jordan; „Land“ bewahrt den üblichen biblischen Sprachgebrauch.
- source_word: אֲשֶׁר נָתַן לָכֶם מֹשֶׁה
  choice: das Mose euch … gegeben hat
  rationale: Das hebräische Perfekt bezeichnet eine abgeschlossene Gabe; das deutsche Perfekt fügt sich natürlich in den Relativsatz.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: jenseits des Jordan
  rationale: Die Wendung bezeichnet die andere Seite beziehungsweise das Gebiet auf der anderen Seite, ohne die Perspektive näher festzulegen.
- source_word: וְאַתֶּם תַּעַבְרוּ
  choice: Ihr aber sollt … hinüberziehen
  rationale: „Aber“ macht den im Kontext vorhandenen Gegensatz zum Bleiben der Angehörigen deutlich; „hinüberziehen“ gibt die gemeinschaftliche Bewegung über den Jordan wieder.
- source_word: חֲמֻשִׁים
  choice: gerüstet
  rationale: Im militärischen Zusammenhang ist wahrscheinlich „zum Kampf ausgerüstet/bewaffnet“ gemeint. „Gerüstet“ wahrt die knappe Form und lässt die genaue Art der militärischen Ordnung offen.
- source_word: לִפְנֵי אֲחֵיכֶם
  choice: vor euren Brüdern
  rationale: לִפְנֵי bezeichnet hier das Ziehen an der Spitze beziehungsweise voraus vor den übrigen Israeliten.
- source_word: אֲחֵיכֶם
  choice: euren Brüdern
  rationale: Das maskuline Verwandtschaftswort wird formal bewahrt; im Zusammenhang sind damit die übrigen Israeliten gemeint.
- source_word: כֹּל גִּבּוֹרֵי הַחַיִל
  choice: alle wehrfähigen Männer
  rationale: Die feste militärische Wendung bezeichnet kampftüchtige beziehungsweise leistungsfähige Krieger. „Wehrfähige Männer“ ist gegenwärtig verständlich und gibt die konkrete Auswahl der Kämpfer wieder.
- source_word: וַעֲזַרְתֶּם אוֹתָם
  choice: und ihnen helfen
  rationale: Die koordinierte Verbform setzt den Auftrag fort; „ihnen helfen“ gibt den einfachen Sinn unmittelbar wieder.
theological_decisions:
- issue: Geschlechtsspezifische Verwandtschaftsbezeichnung אֲחֵיכֶם
  choice: euren Brüdern
  alternative: euren israelitischen Stammesgenossen / den übrigen Israeliten
  rationale: Der hebräische Text verwendet ausdrücklich die maskuline Verwandtschaftsbezeichnung, die hier gemeinschaftlich für die übrigen Israeliten steht. Der Haupttext bewahrt die Bildsprache; eine Fußnote erläutert den weiteren Bezug.
- issue: Militärische Bedeutung von חֲמֻשִׁים
  choice: gerüstet
  alternative: in Schlachtordnung / zum Kampf aufgestellt
  rationale: Die genaue Nuance ist umstritten, doch eine militärische Ausrüstung oder Formation ist im Kontext am wahrscheinlichsten. Der Haupttext entscheidet sich für die knappe, offene Wiedergabe „gerüstet“; die Alternativen werden angemerkt.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Satzstruktur folgt dem Kontrast des Hebräischen zwischen den Zurückbleibenden und den hinüberziehenden Kämpfern. Traditionell verständliche Wendungen wie „jenseits des Jordan“ und „vor euren Brüdern“ bleiben erhalten; erklärungsbedürftige Mehrdeutigkeiten werden in Fußnoten offengelegt.
