  text: הֲ/ל֤וֹא צִוִּיתִ֨י/ךָ֙ חֲזַ֣ק וֶ/אֱמָ֔ץ אַֽל תַּעֲרֹ֖ץ וְ/אַל תֵּחָ֑ת כִּ֤י עִמְּ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כֹ֖ל אֲשֶׁ֥ר תֵּלֵֽךְ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/009.yaml
  text: Have I not commanded you? Be strong and courageous. Do not be terrified[a], and do not be dismayed, for Yahweh your God is with you wherever you go.
translation:
  language: de
  text: Habe ich dir nicht geboten? Sei stark und mutig! Fürchte dich nicht und lass dich nicht entmutigen. Denn Jahwe[a], dein Gott, ist mit dir, wohin du auch gehst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch JHWH; traditionell mit „der HERR“ wiedergegeben.
    reason: Der Gottesname wird im Text als Eigenname „Jahwe“ wiedergegeben; die Fußnote nennt die traditionelle jüdisch-christliche Ersatzwiedergabe.
lexical_decisions:
- source_word: הֲלוֹא צִוִּיתִיךָ
  choice: Habe ich dir nicht geboten?
  rationale: Die verneinte rhetorische Frage wird direkt und mit ihrem nachdrücklichen Erinnerungscharakter wiedergegeben; צוה bedeutet hier „gebieten/befehlen“.
- source_word: חֲזַק וֶאֱמָץ
  choice: Sei stark und mutig!
  rationale: Das feste hebräische Begriffspaar verbindet Stärke beziehungsweise Standfestigkeit mit Mut und lässt sich so knapp und natürlich ins Deutsche übertragen.
- source_word: אַל תַּעֲרֹץ
  choice: Lass dich nicht in Angst versetzen
  rationale: ערץ bezeichnet starke Angst oder Schrecken. Die Formulierung bewahrt diese Intensität, ohne im Deutschen altertümlich zu klingen.
- source_word: וְאַל תֵּחָת
  choice: und verliere nicht den Mut
  rationale: חתת kann im Nifal „bestürzt, niedergeschlagen oder entmutigt sein“ bedeuten. Die gewählte Formulierung passt zum Parallelismus und ist modernes, verständliches Deutsch.
- source_word: כִּי עִמְּךָ
  choice: Denn … ist mit dir
  rationale: כִּי begründet die vorangehenden Aufforderungen; עִמְּךָ bezeichnet Gottes begleitende Gegenwart.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Jahwe, dein Gott
  rationale: Der Gottesname wird als Eigenname „Jahwe“ wiedergegeben; אֱלֹהֶיךָ bedeutet unmittelbar „dein Gott“.
- source_word: בְּכֹל אֲשֶׁר תֵּלֵךְ
  choice: wohin du auch gehst
  rationale: Die deutsche Wendung gibt den umfassenden, distributiven Sinn idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Gottesnamen wieder; die traditionelle Ersatzlesung „der HERR“ wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede. Kurze Aufforderungssätze bewahren die eindringliche Form des hebräischen Textes; die Formulierungen vermeiden sowohl unnötige Altertümlichkeit als auch umgangssprachliche Lockerheit.
