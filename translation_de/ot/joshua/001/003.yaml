  text: כָּל מָק֗וֹם אֲשֶׁ֨ר תִּדְרֹ֧ךְ כַּֽף רַגְלְ/כֶ֛ם בּ֖/וֹ לָ/כֶ֣ם נְתַתִּ֑י/ו כַּ/אֲשֶׁ֥ר דִּבַּ֖רְתִּי אֶל מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/003.yaml
  text: Every place on which the sole of your foot treads[a], I have given to you, just as I spoke to Moses.
translation:
  language: de
  text: Jeden Ort, auf den eure Fußsohlen treten[a], habe ich euch gegeben, wie ich es Mose gesagt habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jeden Ort, wo eure Fußsohlen auftreten.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מָקוֹם
  choice: Jeden Ort
  rationale: כָּל mit dem singularischen מָקוֹם hat distributiven Sinn. „Jeden Ort“ gibt die Reichweite der Zusage natürlich und genau wieder.
- source_word: אֲשֶׁר ... בּוֹ
  choice: auf den
  rationale: Das Relativwort und das rückbezügliche בּוֹ bilden zusammen die Ortsangabe. Beim Betreten von Land ist „auf den“ im Deutschen idiomatisch.
- source_word: תִּדְרֹךְ
  choice: tritt
  rationale: דרך bezeichnet das Treten oder Auftreten. „tritt“ bewahrt das konkrete Bild der Inbesitznahme durch das Setzen des Fußes.
- source_word: כַּף רַגְלְכֶם
  choice: eure Fußsohle
  rationale: כַּף רֶגֶל bezeichnet die Fußsohle. Der Pluralsuffix wird durch „eure“ bewahrt; der Singular folgt dem hebräischen Kollektivbild.
- source_word: לָכֶם נְתַתִּיו
  choice: habe ich euch gegeben
  rationale: Der hebräische Perfekt stellt die Gabe als bereits fest beschlossen und gewährt dar. Im Deutschen ist das Perfekt natürlich und erhält diese Aussagekraft; das Objekt ist durch „Jeden Ort“ bereits ausgedrückt.
- source_word: כַּאֲשֶׁר דִּבַּרְתִּי אֶל מֹשֶׁה
  choice: wie ich es Mose zugesagt habe
  rationale: דבר אל bedeutet wörtlich „zu jemandem reden“. Im Zusammenhang verweist es jedoch auf die vorausgehende Landzusage; „zugesagt“ gibt diese kontextuelle Funktion idiomatisch wieder, ohne über „versprochen“ hinaus theologisch zu präzisieren.
theological_decisions:
- issue: Aspekt der göttlichen Landgabe
  choice: „habe ich euch gegeben“
  alternative: „gebe ich euch“ oder „werde ich euch geben“
  rationale: Der Perfekt נְתַתִּיו stellt die Gabe als bereits vollzogen beziehungsweise fest gewährt dar, obwohl die tatsächliche Besitznahme noch bevorsteht. Die Übersetzung wahrt diese Spannung.
- issue: Charakter der Rede an Mose
  choice: „zugesagt“
  alternative: „zu Mose geredet“
  rationale: Der Kontext macht deutlich, dass Gottes frühere Rede die Landgabe betraf. „zugesagt“ ist im Deutschen natürlich und bewahrt den Bezug auf die Verheißung, ohne eine konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkrete Bildsprache der Fußsohle und die Spannung zwischen bereits gewährter Gabe und noch ausstehender Besitznahme bleiben erhalten.
