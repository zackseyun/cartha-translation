base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/016.yaml
  text: And they answered Joshua[a], saying, “All that you have commanded us we will do, and wherever you send us we will go.”
translation:
  language: de
  text: 'Da antworteten sie Josua: „Alles, was du uns befohlen hast, werden wir tun, und wohin du uns auch sendest, werden wir gehen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲנוּ אֶת־יְהוֹשֻׁעַ לֵאמֹר
  choice: Da antworteten sie Josua
  rationale: Die Qal-Wayyiqtolform von ענה bezeichnet im Erzählzusammenhang eine Antwort. Das deutsche „Da“ gibt die narrative Folge natürlich wieder; לֵאמֹר muss vor der direkten Rede nicht eigens mit „und sagten“ wiederholt werden.
- source_word: כֹּל אֲשֶׁר צִוִּיתָנוּ
  choice: Alles, was du uns befohlen hast
  rationale: כֹּל אֲשֶׁר bezeichnet die Gesamtheit der erteilten Weisungen. „Befohlen“ bewahrt den verbindlichen Charakter von צוה; das Perfekt entspricht natürlichem modernem Deutsch.
- source_word: נַעֲשֶׂה
  choice: werden wir tun
  rationale: עשה bedeutet hier, die erhaltenen Befehle auszuführen. „Tun“ ist direkt, würdig und lässt den Umfang der Ausführung offen.
- source_word: וְאֶל כָּל אֲשֶׁר תִּשְׁלָחֵנוּ
  choice: und wohin du uns auch sendest
  rationale: Die Verbindung aus אֶל, כָּל אֲשֶׁר und den Verben „senden/gehen“ ist lokativ. „Wohin ... auch“ gibt die umfassende Bedeutung idiomatisch wieder, ohne ein Ziel hinzuzufügen.
- source_word: נֵלֵךְ
  choice: werden wir gehen
  rationale: הלך ist das gewöhnliche Verb für „gehen“. Die Wiedergabe bleibt knapp und ergänzt kein im Hebräischen nur impliziertes „dorthin“.
theological_decisions: []
