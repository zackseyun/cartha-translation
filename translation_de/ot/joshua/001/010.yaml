  yaml_path: translation/ot/joshua/001/010.yaml
  text: Then Joshua commanded the officers of the people, saying,
translation:
  language: de
  text: 'Darauf befahl Josua den Amtsträgern des Volkes:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: Darauf befahl
  rationale: Das Wayyiqtol führt die Erzählung zeitlich weiter. »Darauf« gibt diese Abfolge in natürlichem Deutsch wieder; »befahl« bewahrt die verbindliche Stärke von צוה.
- source_word: יְהוֹשֻׁעַ
  choice: Josua
  rationale: Die im Deutschen eingebürgerte biblische Namensform.
- source_word: אֶת
  choice: '[nicht gesondert wiedergegeben]'
  rationale: Der hebräische Akkusativmarker hat kein eigenständiges deutsches Gegenstück; seine Funktion zeigt sich im Akkusativobjekt »den Amtsträgern«.
- source_word: שֹׁטְרֵי
  choice: Amtsträgern
  rationale: שֹׁטֵר bezeichnet hier mit Verwaltungs- und Aufsichtsfunktionen betraute Personen, nicht militärische Befehlshaber. »Amtsträger« ist präziser als das zu allgemeine »Leiter« und vermeidet die moderne polizeiliche Bedeutung von »Beamte«.
- source_word: הָעָם
  choice: des Volkes
  rationale: עָם bezeichnet hier das versammelte Volk Israel; »Volk« ist die direkte und kontextgerechte Wiedergabe.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Die Formel leitet die unmittelbar folgende direkte Rede ein. Im natürlichen modernen Deutsch erfüllt der Doppelpunkt diese Funktion klarer als das schwerfällige »indem er sagte«.
