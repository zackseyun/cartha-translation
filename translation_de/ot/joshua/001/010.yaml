  source_fidelity: 'Die Übersetzung gibt die hebräische Satzstruktur und Aussage zuverlässig wieder: Das erzählfortschreitende וַיְצַו ist mit „Darauf befahl“ angemessen erfasst; Josua ist die übliche deutsche Namensform. „den Amtsträgern des Volkes“ bildet das Objekt samt Genitivverbindung korrekt ab. Der Doppelpunkt übernimmt die Funktion von לֵאמֹר als Einleitung der folgenden direkten Rede idiomatisch und ohne Bedeutungsverlust.'
