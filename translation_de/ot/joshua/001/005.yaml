reference: Joshua 1:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לֹֽא יִתְיַצֵּ֥ב אִישׁ֙ לְ/פָנֶ֔י/ךָ כֹּ֖ל יְמֵ֣י חַיֶּ֑י/ךָ כַּֽ/אֲשֶׁ֨ר הָיִ֤יתִי עִם מֹשֶׁה֙ אֶהְיֶ֣ה עִמָּ֔/ךְ לֹ֥א אַרְפְּ/ךָ֖ וְ/לֹ֥א אֶעֶזְבֶֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/005.yaml
  text: No man will stand before you all the days of your life[a]. Just as I was with Moses, I will be with you[c][b]. I will not fail you or forsake you.
translation:
  language: de
  text: Kein Mensch[a] wird dir standhalten können[b], solange du lebst. Wie ich mit Mose gewesen bin, so werde ich mit dir sein. Ich werde dich nicht fallen lassen[c] und dich nicht verlassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Wort אִישׁ bedeutet gewöhnlich „Mann“, hat hier aber generische Bedeutung: Kein menschlicher Gegner ist ausgenommen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „wird vor dir bestehen“. Die hebräische Wendung bezeichnet hier, dass niemand Josua erfolgreich Widerstand leisten kann.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Ich werde dich nicht loslassen“. Das Verb kann bedeuten, den Halt zu lockern, nachzulassen oder jemanden ohne Unterstützung fallen zu lassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְיַצֵּב
  choice: wird … standhalten können
  rationale: Das Hitpael von יצב bezeichnet hier das standhafte Auftreten gegenüber Josua. Im Zusammenhang der Landnahme ist erfolgreiche Gegenwehr gemeint; „standhalten können“ gibt diesen Sinn im heutigen Deutsch natürlich wieder.
- source_word: אִישׁ
  choice: kein Mensch
  rationale: אִישׁ steht im maskulinen Singular, wird hier aber generisch für jeden menschlichen Gegner gebraucht. „Kein Mensch“ bewahrt den Personenbezug, ohne im Deutschen fälschlich nur erwachsene Männer anzusprechen.
- source_word: לְפָנֶיךָ
  choice: dir
  rationale: Wörtlich bedeutet die Wendung „vor dir“. Zusammen mit יִתְיַצֵּב bildet sie jedoch eine gegnerische Redewendung, die im Deutschen idiomatisch mit „dir standhalten“ wiedergegeben wird.
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: solange du lebst
  rationale: Die hebräische Wendung bezeichnet Josuas gesamte Lebenszeit. Die gewählte Form ist gegenwärtiges, natürliches Deutsch und erhält den zeitlichen Umfang vollständig.
- source_word: כַּאֲשֶׁר הָיִיתִי עִם מֹשֶׁה
  choice: Wie ich mit Mose gewesen bin
  rationale: כַּאֲשֶׁר führt den Vergleich zwischen Gottes bisheriger Gegenwart bei Mose und seiner zugesagten Gegenwart bei Josua ein. Die Formulierung bleibt eng an der hebräischen Struktur.
- source_word: אֶהְיֶה עִמָּךְ
  choice: so werde ich mit dir sein
  rationale: Die Form von היה mit עִם verheißt Gottes Gegenwart. „Mit dir sein“ bewahrt die schlichte und theologisch gewichtige Aussage, ohne sie näher auszudeuten.
- source_word: אַרְפְּךָ
  choice: dich nicht fallen lassen
  rationale: Das Hifil von רפה kann das Nachlassen des Halts oder der Unterstützung ausdrücken. „Nicht fallen lassen“ gibt dieses Bild verständlich wieder und unterscheidet sich noch erkennbar vom folgenden „nicht verlassen“.
- source_word: אֶעֶזְבֶךָּ
  choice: dich nicht verlassen
  rationale: עזב bedeutet verlassen oder aufgeben. „Nicht verlassen“ ist im modernen Deutsch würdig und klar und bewahrt die zweite, eigenständige Verneinung.
theological_decisions:
- issue: Generischer Gebrauch von אִישׁ
  choice: Kein Mensch
  alternative: Kein Mann
  rationale: Der grammatisch maskuline Singular bezeichnet in diesem Zusammenhang jeden menschlichen Gegner. „Kein Mensch“ gibt diese generische Reichweite im Deutschen unmittelbar wieder; die formnähere Alternative wird in der Fußnote bewahrt.
- issue: Sinn der Widerstandsformel יִתְיַצֵּב אִישׁ לְפָנֶיךָ
  choice: wird dir standhalten können
  alternative: wird vor dir bestehen
  rationale: Die hebräische Wendung kann formal das Sich-Hinstellen vor jemandem bezeichnen, meint hier im militärischen Zusammenhang jedoch wirksamen Widerstand. Die Übersetzung macht den kontextuellen Sinn deutlich, während die wörtlichere Lesart in der Fußnote erhalten bleibt.
- issue: Nuance der doppelten Zusage לֹא אַרְפְּךָ וְלֹא אֶעֶזְבֶךָּ
  choice: Ich werde dich nicht fallen lassen und dich nicht verlassen
  alternative: Ich werde dich nicht loslassen und dich nicht verlassen
  rationale: Die beiden Verben verheißen, dass Gott weder in seinem Halt und Beistand nachlässt noch Josua aufgibt. „Nicht fallen lassen“ bewahrt die Bildhaftigkeit, ohne beide Verben zu einem einzigen Begriff einzuebnen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Zusagestil. Die Satzstruktur folgt dem hebräischen Dreischritt aus Siegesverheißung, Vergleich mit Mose und doppelter Beistandszusage. Lexikalische Mehrdeutigkeiten werden nicht dogmatisch aufgelöst, sondern in den Fußnoten sichtbar gehalten.
