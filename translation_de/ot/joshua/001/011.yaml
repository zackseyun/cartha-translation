  naturalness: „Wegzehrung“ ist verständlich, wirkt im modernen Standarddeutsch aber literarisch/altertümlich; „Proviant“ ist idiomatischer. Die revidierte Fassung behält einen würdigen, aber heutigen Erzählton bei.
