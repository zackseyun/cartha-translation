base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/011.yaml
  text: Go through the midst of the camp and command the people[a], saying, ‘Prepare provisions for yourselves, because within three days you are crossing this Jordan to go in to take possession of the land that Yahweh your God is giving you to possess it.’
translation:
  language: de
  text: '„Geht durch das Lager und gebietet dem Volk: ›Bereitet euch Proviant vor, denn innerhalb von drei Tagen[a] werdet ihr diesen Jordan überqueren, um in das Land hineinzuziehen und das Land in Besitz zu nehmen, das Jahwe, euer Gott, euch gibt, um es in Besitz zu nehmen.‹“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „in drei weiteren Tagen“ oder „nach drei Tagen“. Die hebräische Wendung bezeichnet eine kurze noch verbleibende Zeit bis zum Übergang; „innerhalb von drei Tagen“ gibt den Sinn hier am besten wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְרוּ בְּקֶרֶב הַמַּחֲנֶה
  choice: Geht mitten durch das Lager
  rationale: Gibt den räumlichen Sinn des Imperativs und von קֶרֶב ausdrücklich, zugleich aber in natürlichem modernem Deutsch wieder.
- source_word: וְצַוּוּ אֶת הָעָם
  choice: und gebietet dem Volk
  rationale: Bewahrt die verbindliche, autoritative Kraft von צוה; „gebietet“ entspricht dem würdevollen Erzählregister.
- source_word: הָכִינוּ לָכֶם צֵידָה
  choice: Bereitet euch Wegzehrung vor
  rationale: צֵידָה bezeichnet Reiseproviant. „Wegzehrung“ bildet den Reisebezug genauer ab als das allgemeinere „Vorräte“ und bewahrt לָכֶם mit „euch“.
- source_word: כִּי בְּעוֹד שְׁלֹשֶׁת יָמִים
  choice: denn innerhalb von drei Tagen
  rationale: Die Wendung bezeichnet eine kurze noch verbleibende Frist. Die Übersetzung wahrt die zeitliche Nähe, ohne den Übergang zwingend erst nach drei vollständig abgelaufenen Tagen anzusetzen.
- source_word: אַתֶּם עֹבְרִים אֶת הַיַּרְדֵּן הַזֶּה
  choice: werdet ihr diesen Jordan überqueren
  rationale: Das deutsche Futur gibt den unmittelbar bevorstehenden Vorgang natürlich wieder; „diesen“ erhält den deiktischen Nachdruck von הַזֶּה.
- source_word: לָבוֹא לָרֶשֶׁת אֶת הָאָרֶץ
  choice: um in das Land hineinzuziehen und es in Besitz zu nehmen
  rationale: Bildet beide Infinitive ab und gibt ירשׁ im Zusammenhang von Landnahme und Erbe mit „in Besitz nehmen“ wieder.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Jahwe, euer Gott
  rationale: „Jahwe“ ist die im Deutschen geläufige Wiedergabe des ausdrücklich genannten Gottesnamens; die Apposition wahrt die Bundesformel.
- source_word: נֹתֵן לָכֶם לְרִשְׁתָּהּ
  choice: euch gibt, damit ihr es in Besitz nehmt
  rationale: „Gibt“ bewahrt die präsentische Form und die Gewissheit der göttlichen Gabe. Der Zwecksatz erhält die abschließende Wiederholung des Besitzmotivs.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Bundesnamen im modernen Standarddeutsch wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Verhältnis von göttlicher Gabe und menschlicher Landnahme
  choice: „das Jahwe … euch gibt, damit ihr es in Besitz nehmt“
  alternative: die Schlusswendung glätten oder auslassen
  rationale: 'Die Übersetzung bewahrt die Spannung und die bewusste Wiederholung des hebräischen Textes: Das Land ist zugleich Gottes Gabe und muss von Israel in Besitz genommen werden.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede wird flüssig gestaltet, ohne die Doppelung von ירשׁ oder die Verbindung von göttlicher Gabe und menschlicher Besitznahme zu beseitigen. Der Fußnotenmarker steht bei der tatsächlich erläuterten Zeitangabe.
