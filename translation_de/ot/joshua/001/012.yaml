base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/012.yaml
  text: And to the Reubenites[a], and to the Gadites, and to the half-tribe of Manasseh, Joshua said,
translation:
  language: de
  text: Und zu den Rubenitern, den Gaditern und dem halben Stamm Manasse sagte Josua:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „sagend“. Das hebräische Wort leitet Josuas Rede ein, die im folgenden Vers beginnt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לָ/רֽאוּבֵנִי
  choice: Zu den Rubenitern
  rationale: Die Einzahl der hebräischen Volksbezeichnung ist kollektiv gebraucht. Der deutsche Plural bezeichnet die angesprochene Gruppe natürlich und genau; das einleitende וְ wird in der deutschen Aufzählung nicht eigens mit „und“ wiedergegeben.
- source_word: וְ/לַ/גָּדִי
  choice: den Gaditern
  rationale: Auch diese Volksbezeichnung steht im Hebräischen kollektiv. Im Deutschen ist der Plural idiomatisch; die gemeinsame Präposition „zu“ gilt für alle Glieder der Aufzählung.
- source_word: וְ/לַ/חֲצִי שֵׁבֶט הַֽ/מְנַשֶּׁה
  choice: und dem halben Stamm Manasse
  rationale: Die Wendung bezeichnet die Hälfte des Stammes Manasse. „Der halbe Stamm Manasse“ ist im Deutschen klarer und natürlicher als „der Halbstamm Manasse“.
- source_word: אָמַר
  choice: sagte
  rationale: Das häufige Verb אמר wird hier direkt und idiomatisch mit „sagte“ wiedergegeben.
- source_word: יְהוֹשֻׁעַ
  choice: Josua
  rationale: Der Personenname folgt der etablierten deutschen Bibelnamenform.
- source_word: לֵ/אמֹר
  choice: ':'
  rationale: Der Infinitiv „sagend“ leitet die im folgenden Vers beginnende direkte Rede ein. Im heutigen Deutsch übernimmt der Doppelpunkt diese Funktion natürlicher.
theological_decisions: []
translation_notes:
