id: JOS.1.6
reference: Joshua 1:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: חֲזַ֖ק וֶ/אֱמָ֑ץ כִּ֣י אַתָּ֗ה תַּנְחִיל֙ אֶת הָ/עָ֣ם הַ/זֶּ֔ה אֶת הָ/אָ֕רֶץ אֲשֶׁר נִשְׁבַּ֥עְתִּי לַ/אֲבוֹתָ֖/ם לָ/תֵ֥ת לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/006.yaml
  text: Be strong and courageous[b][a], for you shall cause this people to inherit the land that I swore to their fathers to give to them.
translation:
  language: de
  text: Sei stark und mutig! Denn du wirst diesem Volk das Land als Erbe zuteilen[a], das ich ihren Vätern[b] zu geben geschworen habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »du wirst dieses Volk das Land erben lassen«. Die hebräische Verbform ist kausativ und kann auch bedeuten, jemandem etwas als Erbe zu geben oder zuzuteilen.'
    reason: lexical_alternative
  - marker: b
    text: 'Mit »ihren Vätern« sind Israels Vorväter gemeint, besonders die Patriarchen; auch: »ihren Vorfahren«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲזַק וֶאֱמָץ
  choice: Sei stark und mutig!
  rationale: Die beiden Imperative bilden eine feste Aufforderung zu Stärke und Entschlossenheit. Die gewählte Formulierung ist im modernen Deutschen natürlich und bewahrt den eindringlichen Charakter.
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende Aufforderung und wahrt den logischen Zusammenhang.
- source_word: תַּנְחִיל
  choice: du wirst ... als Erbe zuteilen
  rationale: 'Der Hifil von נחל ist kausativ: Josua soll bewirken, dass das Volk das Land als Erbe erhält. »Als Erbe zuteilen« gibt diesen Sinn idiomatisch und zugleich präzise wieder.'
- source_word: הָעָם הַזֶּה
  choice: diesem Volk
  rationale: Bewahrt den kollektiven Singular und den Demonstrativbezug des Hebräischen.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Im Bundeszusammenhang bezeichnet der Ausdruck das Israel verheißene Land; »das Land« ist die sachgerechte Standardwiedergabe.
- source_word: נִשְׁבַּעְתִּי
  choice: ich ... geschworen habe
  rationale: Das deutsche Perfekt fügt sich natürlich in den Relativsatz ein und bezeichnet Gottes bereits geleisteten Eid.
- source_word: לַאֲבוֹתָם
  choice: ihren Vätern
  rationale: Die wörtliche Wiedergabe erhält den ausdrücklich maskulinen Bezug auf Israels Vorväter, besonders die Patriarchen.
- source_word: לָתֵת לָהֶם
  choice: zu geben
  rationale: Der Infinitiv bezeichnet den Inhalt des Eides. Das indirekte Objekt »ihnen« kann im Deutschen entfallen, weil die Begünstigten bereits durch »ihren Vätern« eindeutig bezeichnet sind.
theological_decisions:
- issue: Bezug von אֲבוֹתָם
  choice: ihren Vätern
  alternative: ihren Vorfahren
  rationale: Der hebräische Ausdruck ist maskuliner Plural und verweist im Bundeskontext insbesondere auf die Patriarchen. Die Hauptfassung bewahrt diese Form; die weitere Bedeutung wird in einer Fußnote kenntlich gemacht.
- issue: Rolle Josuas bei der Landgabe
  choice: als Erbe zuteilen
  alternative: dieses Volk das Land erben lassen
  rationale: Die kausative Verbform weist Josua eine vermittelnde Aufgabe bei der Inbesitznahme beziehungsweise Zuteilung zu, ohne Gottes Rolle als eigentlichen Geber des Landes zu verdrängen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Ausruf bewahrt die Kraft der doppelten Aufforderung; die Satzstruktur bleibt klar und gut verständlich. Alle Fußnotenmarker stehen unmittelbar bei den erklärten Ausdrücken.
