reference: Joshua 1:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כָּל אִ֞ישׁ אֲשֶׁר יַמְרֶ֣ה אֶת פִּ֗י/ךָ וְ/לֹֽא יִשְׁמַ֧ע אֶת דְּבָרֶ֛י/ךָ לְ/כֹ֥ל אֲשֶׁר תְּצַוֶּ֖/נּוּ יוּמָ֑ת רַ֖ק חֲזַ֥ק וֶ/אֱמָֽץ־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/018.yaml
  text: Every man who rebels against your command and does not listen to your words in all that you command him shall be put to death[a]. Only be strong and courageous.
translation:
  language: de
  text: Jeder Mann, der sich deinem Befehl[a] widersetzt und nicht in allem, was du ihm befiehlst, auf deine Worte hört, soll getötet werden. Sei nur stark und mutig!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „deinem Mund“. Der hebräische Ausdruck bezeichnet hier Josuas Befehl oder autoritatives Wort.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: כָּל אִישׁ
  choice: Jeder Mann
  rationale: Die distributive Wendung wird entsprechend ihrer maskulinen Singularform wiedergegeben; zugleich klingt sie im Deutschen als allgemeine Rechtsformel verständlich.
- source_word: יַמְרֶה
  choice: sich … widersetzt
  rationale: Das Verb bezeichnet Auflehnung beziehungsweise Trotz gegenüber einer Autorität. „Sich widersetzen“ bewahrt diesen stärkeren Sinn besser als das bloße „nicht gehorchen“.
- source_word: אֶת פִּיךָ
  choice: deinem Befehl
  rationale: Wörtlich steht „deinem Mund“; gemeint ist hier Josuas autoritatives Wort. „Befehl“ gibt diese hebräische Redeweise im Deutschen klar wieder.
- source_word: וְלֹא יִשְׁמַע אֶת דְּבָרֶיךָ
  choice: und nicht … auf deine Worte hört
  rationale: שׁמע umfasst Hören, Beachten und Gehorchen. „Auf deine Worte hört“ wahrt die Bild- und Wortwahl des Hebräischen und lässt den Gehorsamsaspekt im Zusammenhang erkennen.
- source_word: לְכֹל אֲשֶׁר תְּצַוֶּנּוּ
  choice: in allem, was du ihm befiehlst
  rationale: Die Formulierung gibt den umfassenden Geltungsbereich der geforderten Folgsamkeit eng und verständlich wieder.
- source_word: יוּמָת
  choice: soll getötet werden
  rationale: Die passive Verbform bezeichnet eine verhängte Tötung beziehungsweise Todesstrafe, nicht lediglich, dass der Betreffende sterben wird.
- source_word: רַק
  choice: nur
  rationale: Die Partikel setzt einen knappen, nachdrücklichen Übergang zur abschließenden Aufforderung.
- source_word: חֲזַק וֶאֱמָץ
  choice: sei stark und mutig
  rationale: Diese natürliche und würdevolle Wiedergabe entspricht der wiederkehrenden Aufforderung im Kapitel und umfasst sowohl Stärke als auch entschlossene Tapferkeit.
theological_decisions:
- issue: Geschlechtsspezifische repräsentative Sprache
  choice: Jeder Mann
  alternative: Jeder; Wer auch immer
  rationale: אִישׁ steht ausdrücklich im maskulinen Singular innerhalb einer distributiven Rechtsformel. Die Übersetzung bewahrt diese Form, ohne einen engeren Personenkreis hinzuzufügen.
- issue: Formulierung der gerichtlichen Strafe
  choice: soll getötet werden
  alternative: soll sterben; muss hingerichtet werden
  rationale: Die hebräische Passivform drückt eine auferlegte Todesstrafe aus. „Soll getötet werden“ bewahrt die rechtliche Kraft, ohne zusätzliche Einzelheiten über das Verfahren einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt quellennah, ist aber für heutige Leser verständlich; die abschließende Aufforderung ist knapp und nachdrücklich formuliert.
