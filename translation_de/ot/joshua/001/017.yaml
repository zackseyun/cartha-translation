source:
  edition: WLC
  text: כְּ/כֹ֤ל אֲשֶׁר שָׁמַ֨עְנוּ֙ אֶל מֹשֶׁ֔ה כֵּ֖ן נִשְׁמַ֣ע אֵלֶ֑י/ךָ רַ֠ק יִֽהְיֶ֞ה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ עִמָּ֔/ךְ כַּ/אֲשֶׁ֥ר הָיָ֖ה עִם מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/017.yaml
  text: Just as we listened to Moses in everything[a], so we will listen to you. Only may Yahweh your God be with you, just as he was with Moses.
translation:
  language: de
  text: So wie wir in allem auf Mose gehört haben, werden wir auch auf dich hören.[a] Nur möge Jahwe, dein Gott, mit dir sein, wie er mit Mose gewesen ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „So wie wir Mose in allem gehorcht haben, werden wir auch dir gehorchen.“ Das hebräische Verb שׁמע kann je nach Zusammenhang sowohl „hören“ als auch „gehorchen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְנוּ / נִשְׁמַע
  choice: auf Mose gehört haben / auf dich hören
  rationale: שׁמע mit אֶל bezeichnet das Hören auf eine Person und schließt in diesem Zusammenhang Gehorsam ein. „Auf jemanden hören“ bewahrt im Deutschen beide Nuancen natürlich.
- source_word: כְּכֹל אֲשֶׁר
  choice: So wie ... in allem
  rationale: Die Wiedergabe erhält sowohl den Vergleich als auch den umfassenden Geltungsbereich der Zusage.
- source_word: רַק
  choice: Nur
  rationale: Das Wort leitet eine einschränkende Ergänzung beziehungsweise einen Wunsch ein.
- source_word: יִהְיֶה
  choice: möge ... sein
  rationale: Nach רַק ist die Imperfektform hier am besten als Wunsch und nicht als bloße Zukunftsaussage zu verstehen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben, nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Wörtliche und natürliche Wiedergabe der Verbindung mit dem Suffix der zweiten Person Singular.
- source_word: עִמָּךְ / עִם
  choice: mit dir / mit Mose
  rationale: עִם bezeichnet Gegenwart und Gemeinschaft; „mit“ ist hier die natürliche deutsche Entsprechung.
- source_word: כַּאֲשֶׁר
  choice: wie
  rationale: Leitet den Vergleich zwischen Jahwes Gegenwart bei Josua und seiner Gegenwart bei Mose klar und idiomatisch ein.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR / Jehova
  rationale: Der Ausgangstext gebraucht das Tetragramm als persönlichen Gottesnamen. „Jahwe“ gibt diesen Namen in geläufiger deutscher Form wieder.
- issue: Bedeutungsumfang von שׁמע
  choice: auf jemanden hören
  alternative: jemandem gehorchen
  rationale: Die Formulierung bewahrt die im Hebräischen vorhandene Verbindung von Hören und Gehorchen, ohne die Aussage auf nur eine Nuance festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Auf jemanden hören“ ist allgemein verständlich und erhält die semantische Spannung zwischen Zuhören und Gehorsam. Die Stellung des Fußnotenzeichens nach der vollständigen Zusage macht deutlich, dass die Alternative beide Verbformen betrifft.
