  text: עַ֠ד אֲשֶׁר יָנִ֨יחַ יְהוָ֥ה לַֽ/אֲחֵי/כֶם֮ כָּ/כֶם֒ וְ/יָרְשׁ֣וּ גַם הֵ֔מָּה אֶת הָ/אָ֕רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹֽהֵי/כֶ֖ם נֹתֵ֣ן לָ/הֶ֑ם וְ/שַׁבְתֶּ֞ם לְ/אֶ֤רֶץ יְרֻשַּׁתְ/כֶם֙ וִֽ/ירִשְׁתֶּ֣ם אוֹתָ֔/הּ אֲשֶׁ֣ר נָתַ֣ן לָ/כֶ֗ם מֹשֶׁה֙ עֶ֣בֶד יְהוָ֔ה בְּ/עֵ֥בֶר הַ/יַּרְדֵּ֖ן מִזְרַ֥ח הַ/שָּֽׁמֶשׁ־׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/015.yaml
  text: until Yahweh gives your brothers rest[a], as he has given you, and they also take possession of the land that Yahweh your God is giving them. Then you shall return to the land of your possession and take possession of it, which Moses the servant of Yahweh gave you beyond the Jordan[b], toward the sunrise.
translation:
  language: de
  text: bis Jahwe euren Brüdern[a] ebenso wie euch Ruhe verschafft und auch sie das Land in Besitz genommen haben, das Jahwe, euer Gott, ihnen gibt. Dann sollt ihr in das Land zurückkehren, das euer Erbbesitz ist, und es in Besitz nehmen, das Mose, der Diener Jahwes, euch jenseits des Jordan, im Osten[b], gegeben hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „euren israelitischen Stammesgenossen“. Wörtlich steht im Hebräischen „euren Brüdern“; gemeint sind hier die Angehörigen der übrigen Stämme Israels.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „gegen Sonnenaufgang“. Wörtlich: „zum Sonnenaufgang hin“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָנִיחַ
  choice: Ruhe verschafft
  rationale: Der Hifil von נוח bezeichnet hier das Gewähren von Ruhe und sicherer Ansiedlung nach kriegerischen Auseinandersetzungen. „Ruhe verschafft“ ist im Deutschen natürlich und bewahrt den ursächlichen Sinn.
- source_word: לַאֲחֵיכֶם
  choice: euren Brüdern
  rationale: Die hebräische Form ist ausdrücklich maskulin plural. Der Wortlaut bleibt erhalten; der Bezug auf die übrigen israelitischen Stämme wird in einer Fußnote erläutert.
- source_word: כָּכֶם
  choice: ebenso … wie euch
  rationale: Das Hebräische formuliert elliptisch „wie euch“. Die deutsche Fassung ergänzt den aus dem Zusammenhang erschließbaren Gedanken der gewährten Ruhe.
- source_word: וְיָרְשׁוּ / וִירִשְׁתֶּם אֹתָהּ
  choice: in Besitz genommen haben / in Besitz nehmen
  rationale: ירשׁ bezeichnet im Zusammenhang von Landnahme und Zuteilung das tatsächliche Antreten eines zugesprochenen Besitzes. Die wiederholte Wendung bildet die Wiederholung im Ausgangstext ab.
- source_word: נֹתֵן
  choice: ihnen gibt
  rationale: Das Partizip stellt Jahwes Gabe als gegenwärtig wirksames beziehungsweise unmittelbar bevorstehendes Handeln dar. Das deutsche Präsens wahrt diese Offenheit.
- source_word: אֶרֶץ יְרֻשַּׁתְכֶם
  choice: das Land, das euer Erbbesitz ist
  rationale: יְרֻשָּׁה bezeichnet einen rechtmäßig zugeteilten, bleibenden Besitz. „Erbbesitz“ verbindet Besitz- und Erbgedanken in verständlichem Deutsch.
- source_word: עֶבֶד יְהוָה
  choice: der Diener Jahwes
  rationale: עֶבֶד ist hier ein ehrender Amtstitel für Mose und bezeichnet seinen Dienst für Gott; „Diener“ passt daher besser als „Sklave“.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: jenseits des Jordan
  rationale: Die übliche geografische Wendung bleibt knapp und lässt den im Zusammenhang erkennbaren Bezugspunkt bestehen.
- source_word: מִזְרַח הַשָּׁמֶשׁ
  choice: gegen Sonnenaufgang
  rationale: Die bildhafte Richtungsangabe des Hebräischen wird bewahrt; gemeint ist die Ostseite.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Reichweite des maskulinen Verwandtschaftsbegriffs אֲחֵיכֶם
  choice: euren Brüdern
  alternative: euren israelitischen Stammesgenossen
  rationale: Die Übersetzung bewahrt die maskuline Form des Hebräischen, ohne die kontextuelle Bezugnahme auf die übrigen Stämme zu verschweigen; diese wird in der Fußnote erklärt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange hebräische Satz wurde zur besseren Verständlichkeit in zwei Sätze gegliedert, ohne die zeitliche Abfolge oder die Bezüge zu verändern. Die konkrete Bildsprache „gegen Sonnenaufgang“ bleibt im Haupttext erhalten.
