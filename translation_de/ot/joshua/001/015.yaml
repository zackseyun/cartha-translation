  terminology: „Jahwe“, „Brüdern“, „Ruhe“, „in Besitz nehmen“, „Erbbesitz“ und „Diener Jahwes“ sind sachgerecht. Die Fußnote zu „Brüdern“ wahrt den maskulinen Wortlaut und erläutert den kontextuellen Bezug, ohne ihn in den Haupttext einzutragen.
