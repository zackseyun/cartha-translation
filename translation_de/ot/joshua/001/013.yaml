  text: זָכוֹר֙ אֶת הַ/דָּבָ֔ר אֲשֶׁ֨ר צִוָּ֥ה אֶתְ/כֶ֛ם מֹשֶׁ֥ה עֶֽבֶד יְהוָ֖ה לֵ/אמֹ֑ר יְהוָ֤ה אֱלֹהֵי/כֶם֙ מֵנִ֣יחַ לָ/כֶ֔ם וְ/נָתַ֥ן לָ/כֶ֖ם אֶת הָ/אָ֥רֶץ הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/013.yaml
  text: Remember the word that Moses the servant of Yahweh commanded you[a], saying, ‘Yahweh your God is giving you rest and will give you this land.’
translation:
  language: de
  text: 'Denkt an das Wort, das Mose, der Diener Jahwes, euch geboten hat: »Jahwe, euer Gott, verschafft euch Ruhe und hat euch dieses Land gegeben.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und wird euch dieses Land geben.« Die hebräische Verbform kann eine bereits vollzogene Gabe oder eine sicher bevorstehende Gabe bezeichnen. Die angesprochenen Stämme hatten ihr Gebiet östlich des Jordan bereits erhalten.'
    reason: alternative_reading
lexical_decisions:
- source_word: זָכוֹר
  choice: Denkt an
  rationale: Der Qal-Imperativ Singular richtet sich grammatisch an das als Einheit verstandene Gegenüber, inhaltlich jedoch an mehrere Stämme. Im natürlichen Deutschen gibt »Denkt an« den Aufruf wieder, eine frühere Weisung gegenwärtig zu halten.
- source_word: הַדָּבָר
  choice: das, was
  rationale: דָּבָר kann »Wort«, »Sache« oder »Angelegenheit« bedeuten. Die idiomatische Wendung »das, was … geboten hat« bewahrt die Offenheit des Nomens, ohne die gebietende Kraft doppelt auszudrücken.
- source_word: צִוָּה
  choice: geboten hat
  rationale: Das Verb bezeichnet eine verbindliche Anweisung. »Geboten hat« ist würdig, klar und weniger hart als »befohlen hat«.
- source_word: עֶבֶד יְהוָה
  choice: der Diener Jahwes
  rationale: עֶבֶד bezeichnet hier Moses ehrenvolle Stellung im Dienst Gottes; »Diener« ist deshalb kontextgemäßer als »Sklave«.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. »Jahwe« ist die geläufige deutsche Form.
- source_word: לֵאמֹר
  choice: Doppelpunkt mit direkter Rede
  rationale: Der hebräische Redeintroduktor wird im natürlichen Deutschen durch einen Doppelpunkt und direkte Rede ausgedrückt.
- source_word: אֱלֹהֵיכֶם
  choice: euer Gott
  rationale: Die Konstruktion mit dem Suffix der zweiten Person Plural wird unmittelbar und bundestheologisch neutral wiedergegeben.
- source_word: מֵנִיחַ
  choice: verschafft euch Ruhe
  rationale: Das Hifil-Partizip bezeichnet das Gewähren von Ruhe beziehungsweise sicherer Ansiedlung. »Verschafft euch Ruhe« wahrt die kausative Bedeutung und den gegenwärtigen Vorgang.
- source_word: וְנָתַן
  choice: und hat euch … gegeben
  rationale: Die Qatalform kann hier als bereits vollzogene Gabe verstanden werden, da die angesprochenen ostjordanischen Stämme ihr Gebiet schon erhalten hatten. Die mögliche zukunftsbezogene Lesart bleibt in der Fußnote sichtbar.
- source_word: הָאָרֶץ הַזֹּאת
  choice: dieses Land
  rationale: Die einfache Demonstrativverbindung bezeichnet das den angesprochenen Stämmen zugewiesene Gebiet.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. Die Transliteration bewahrt diese Eigenname-Funktion, ohne einen Titel einzusetzen.
- issue: Zeitbezug von וְנָתַן
  choice: hat euch dieses Land gegeben
  alternative: wird euch dieses Land geben
  rationale: Die Form lässt im Zusammenhang sowohl eine vollzogene Gabe als auch eine gewiss bevorstehende Gabe zu. Wegen der bereits erfolgten Zuweisung des Ostjordanlandes wird im Haupttext die vollendete Lesart gewählt; die echte Aspektambiguität wird nicht verschwiegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Redeformel לֵאמֹר wird idiomatisch durch Doppelpunkt und direkte Rede wiedergegeben. Die Anrede steht im deutschen Plural, da mehrere Stämme angesprochen sind.
