  text: רַק֩ חֲזַ֨ק וֶֽ/אֱמַ֜ץ מְאֹ֗ד לִ/שְׁמֹ֤ר לַ/עֲשׂוֹת֙ כְּ/כָל הַ/תּוֹרָ֗ה אֲשֶׁ֤ר צִוְּ/ךָ֙ מֹשֶׁ֣ה עַבְדִּ֔/י אַל תָּס֥וּר מִמֶּ֖/נּוּ יָמִ֣ין וּ/שְׂמֹ֑אול לְמַ֣עַן תַּשְׂכִּ֔יל בְּ/כֹ֖ל אֲשֶׁ֥ר תֵּלֵֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/007.yaml
  text: Only be strong and very courageous[a], being careful to do according to all the law that Moses my servant commanded you. Do not turn from it to the right or to the left, so that you may act wisely wherever you go.
translation:
  language: de
  text: Sei nur stark und sehr mutig. Achte genau darauf, nach dem ganzen Gesetz zu handeln, das Mose, mein Diener, dir geboten hat. Weiche davon weder nach rechts noch nach links ab, damit du überall, wohin du gehst, verständig handelst.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit du überall, wohin du gehst, Erfolg hast“ beziehungsweise „damit dir alles gelingt“.'
    reason: 'Lexikalische Alternative: תַּשְׂכִּיל kann sowohl verständiges Handeln als auch den daraus folgenden Erfolg bezeichnen.'
lexical_decisions:
- source_word: רַק
  choice: nur
  rationale: Das Wort hebt die folgende Aufforderung einschränkend und nachdrücklich hervor. „Nur“ bewahrt diese Funktion knapp und natürlich.
- source_word: חֲזַק וֶאֱמַץ מְאֹד
  choice: sei nur stark und sehr mutig
  rationale: Die beiden Imperative verbinden Stärke mit entschlossener Tapferkeit; מְאֹד verstärkt die Aufforderung durch „sehr“.
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: achte genau darauf, … zu handeln
  rationale: Die Infinitivfolge verbindet sorgfältiges Beachten mit tatsächlichem Tun. Die deutsche Formulierung gibt beide Aspekte idiomatisch wieder.
- source_word: כְּכָל הַתּוֹרָה
  choice: nach dem ganzen Gesetz
  rationale: תּוֹרָה bezeichnet hier die durch Mose vermittelte verbindliche Weisung; „Gesetz“ passt zum unmittelbaren Bundes- und Gebotskontext, „das ganze“ wahrt den umfassenden Anspruch.
- source_word: אֲשֶׁר צִוְּךָ מֹשֶׁה עַבְדִּי
  choice: das Mose, mein Diener, dir geboten hat
  rationale: Die Übersetzung bewahrt den Relativsatz, den Gebotscharakter und Gottes Bezeichnung Moses als „mein Diener“.
- source_word: אַל תָּסוּר מִמֶּנּוּ יָמִין וּשְׂמֹאול
  choice: Weiche davon weder nach rechts noch nach links ab
  rationale: Die Formulierung erhält das Richtungsbild für jede Abweichung vom vorgeschriebenen Weg und klingt zugleich in modernem Deutsch natürlich.
- source_word: לְמַעַן
  choice: damit
  rationale: „Damit“ gibt die Zweck- beziehungsweise Ergebnisbeziehung knapp und verständlich wieder.
- source_word: תַּשְׂכִּיל
  choice: verständig handelst
  rationale: Der Hifil-Stamm von שׂכל bezeichnet einsichtiges oder umsichtiges Handeln und kann zugleich den daraus folgenden Erfolg einschließen. Der Haupttext stellt den semantischen Kern heraus; die Erfolgsnuance bleibt in der Fußnote erhalten.
- source_word: בְּכֹל אֲשֶׁר תֵּלֵךְ
  choice: überall, wohin du gehst
  rationale: Die Wiedergabe folgt dem Verb הלך („gehen“) und bringt den umfassenden räumlichen beziehungsweise lebenspraktischen Geltungsbereich natürlich zum Ausdruck.
theological_decisions:
- issue: Bedeutung von תּוֹרָה im Bundeskontext
  choice: Gesetz
  alternative: Weisung
  rationale: Da ausdrücklich auf das von Mose Gebotene verwiesen wird, steht hier der rechtlich verbindliche Aspekt der Tora im Vordergrund. „Weisung“ bleibt grundsätzlich möglich, ist im unmittelbaren Zusammenhang jedoch weniger bestimmt.
- issue: Bedeutung von תַּשְׂכִּיל
  choice: verständig handeln
  alternative: Erfolg haben / Gelingen haben
  rationale: Das hebräische Verb kann kluges, umsichtiges Handeln sowie den daraus erwachsenden Erfolg bezeichnen. Der Haupttext vermeidet eine einseitige Erfolgs- oder Wohlstandsdeutung; die alternative Nuance wird ausdrücklich in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede. Die Richtungsmetapher und die umfassende Bindung an das mosaische Gesetz bleiben erhalten; unnötig altertümliche Formulierungen werden vermieden.
