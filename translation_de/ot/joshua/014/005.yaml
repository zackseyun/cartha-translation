  text: כַּ/אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֶת מֹשֶׁ֔ה כֵּ֥ן עָשׂ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל וַֽ/יַּחְלְק֖וּ אֶת הָ/אָֽרֶץ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/005.yaml
  text: Just as Yahweh had commanded Moses[a], so the sons of Israel did, and they divided the land.
translation:
  language: de
  text: Wie Jahwe Mose geboten hatte, so taten die Israeliten[a], und sie teilten das Land auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die Söhne Israels. Im Hebräischen steht eine übliche korporative Bezeichnung für das Volk Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Genau wie
  rationale: Gibt die ausdrückliche Entsprechung zwischen Jahwes Gebot und Israels Handeln natürlich und präzise wieder.
- source_word: צִוָּה
  choice: geboten hatte
  rationale: Das Verb bezeichnet verbindliches Befehlen; das Plusquamperfekt verdeutlicht, dass das Gebot dem Handeln Israels vorausging.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֶת מֹשֶׁה
  choice: Mose
  rationale: Nach dem deutschen Verb „gebieten“ steht die Person idiomatisch im Dativ; die Form ist in „Mose geboten“ sichtbar.
- source_word: כֵּן
  choice: so
  rationale: Bewahrt knapp die im Hebräischen markierte Entsprechung.
- source_word: עָשׂוּ
  choice: taten es
  rationale: Gibt das allgemeine Verb „tun“ wieder; „es“ ist im Deutschen für einen natürlichen Satzanschluss erforderlich und verweist auf das Gebotene.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die wörtliche Wendung „Söhne Israels“ ist hier eine übliche korporative Bezeichnung für das Volk; „die Israeliten“ vermittelt ihre Funktion im modernen Deutsch ohne falsche Beschränkung auf männliche Nachkommen.
- source_word: וַיַּחְלְקוּ
  choice: und sie teilten … auf
  rationale: Das Verb bezeichnet hier das Teilen beziehungsweise Zuteilen des Landes; „aufteilen“ ist im Deutschen kontextgemäß und verständlich.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Bezeichnet im Kontext das zu verteilende Land, nicht die Erde im globalen Sinn.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen JHWH. „Jahwe“ bewahrt diesen als persönlichen Gottesnamen; ein Titel würde ihn ersetzen.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: Die hebräische maskuline Pluralform dient hier als feste korporative Volksbezeichnung. Die idiomatische Wiedergabe bezeichnet das ganze handelnde Volk und behauptet nicht, dass ausschließlich Männer gemeint seien.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die korrelative Struktur „Genau wie …, so …“ bleibt erhalten. Der Satz folgt der schlichten Erzählweise des Hebräischen, ohne die Landverteilung näher auszudeuten.
