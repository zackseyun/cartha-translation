  variant: modern standard German
source:
  edition: WLC
  text: כִּֽי נָתַ֨ן מֹשֶׁ֜ה נַחֲלַ֨ת שְׁנֵ֤י הַ/מַּטּוֹת֙ וַ/חֲצִ֣י הַ/מַּטֶּ֔ה מֵ/עֵ֖בֶר לַ/יַּרְדֵּ֑ן וְ/לַ֨/לְוִיִּ֔ם לֹֽא נָתַ֥ן נַחֲלָ֖ה בְּ/תוֹכָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/003.yaml
  text: For Moses had given the inheritance of the two tribes and the half-tribe beyond the Jordan[a], but to the Levites he gave no inheritance among them.
translation:
  language: de
  text: Denn Mose hatte den beiden Stämmen und dem halben Stamm ihren Erbbesitz jenseits des Jordan[a] gegeben; den Leviten aber hatte er keinen Erbbesitz unter ihnen gegeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: auf der anderen Seite des Jordan.'
    reason: Die hebräische Ortsangabe מֵעֵבֶר לַיַּרְדֵּן lässt sich je nach räumlichem Blickpunkt auch so wiedergeben.
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet im Zusammenhang eine Begründung beziehungsweise Erläuterung ein und gibt die Diskursfunktion natürlich wieder.
- source_word: נָתַן
  choice: hatte ... gegeben
  rationale: Das Plusquamperfekt kennzeichnet Moses Landvergabe als bereits vollzogene Handlung gegenüber der erzählten Situation.
- source_word: נַחֲלַת
  choice: ihren Erbbesitz
  rationale: Bezeichnet hier den als Erbe zugeteilten Landbesitz. Das Possessivpronomen ergibt im Deutschen eine natürliche Konstruktion mit dem Verb „geben“.
- source_word: שְׁנֵי הַמַּטּוֹת
  choice: den beiden Stämmen
  rationale: מַטֶּה bezeichnet im Kontext der Landverteilung eindeutig einen Stamm, nicht einen Stab.
- source_word: וַחֲצִי הַמַּטֶּה
  choice: und dem halben Stamm
  rationale: Gibt die übliche Bezeichnung für den halben Stamm Manasse im Zusammenhang der Landverteilung präzise wieder.
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: jenseits des Jordan
  rationale: Bewahrt die räumliche Ausdrucksweise des Hebräischen, ohne den geographischen Standpunkt ausdrücklich festzulegen.
- source_word: וְלַלְוִיִּם
  choice: den Leviten aber
  rationale: Das formal verbindende וְ steht hier in einem klaren Kontrast; „aber“ macht diese Funktion in natürlichem Deutsch sichtbar.
- source_word: לֹא נָתַן נַחֲלָה
  choice: hatte er keinen Erbbesitz ... gegeben
  rationale: Gibt die verneinte Aussage direkt wieder und hält die Begrifflichkeit des Erbbesitzes innerhalb des Verses einheitlich.
- source_word: בְּתוֹכָם
  choice: unter ihnen
  rationale: Bewahrt den Bezug darauf, dass Levi keinen entsprechenden Stammeslandbesitz inmitten der übrigen Stämme erhielt.
theological_decisions:
- issue: Art des den Leviten nicht gegebenen Erbbesitzes
  choice: Die Aussage verneint einen Erbbesitz unter den übrigen Stämmen und wird nicht als Verneinung jeder Versorgung Levis formuliert.
  alternative: Die Leviten erhielten überhaupt kein Erbe.
  rationale: Die ausdrückliche Wendung „unter ihnen“ bleibt erhalten. So wird der territoriale Zusammenhang erkennbar, ohne ergänzende Theologie in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Erbbesitz“ ist im Kontext der Landzuteilung präziser als das allgemeinere „Erbe“. Die Wiederholung von „gegeben“ bewahrt die parallele Struktur und den Gegensatz des hebräischen Satzes.
