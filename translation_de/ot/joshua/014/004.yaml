  text: כִּֽי הָי֧וּ בְנֵֽי יוֹסֵ֛ף שְׁנֵ֥י מַטּ֖וֹת מְנַשֶּׁ֣ה וְ/אֶפְרָ֑יִם וְ/לֹֽא נָתְנוּ֩ חֵ֨לֶק לַ/לְוִיִּ֜ם בָּ/אָ֗רֶץ כִּ֤י אִם עָרִים֙ לָ/שֶׁ֔בֶת וּ/מִ֨גְרְשֵׁי/הֶ֔ם לְ/מִקְנֵי/הֶ֖ם וּ/לְ/קִנְיָנָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/004.yaml
  text: For the sons of Joseph were two tribes[a], Manasseh and Ephraim; and they gave no portion to the Levites in the land, except cities to dwell in[c][b], with their pasturelands for their livestock and for their possessions.
translation:
  language: de
  text: Denn die Nachkommen Josefs bildeten zwei Stämme, Manasse und Ephraim. Den Leviten gab man keinen Anteil am Land, sondern nur Städte zum Wohnen samt den dazugehörigen Weideflächen[a] für ihr Vieh und ihren Besitz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit »Weideflächen« ist das offene Gelände rings um die Levitenstädte gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet eine Begründung beziehungsweise Erläuterung zum vorausgehenden Zusammenhang ein.
- source_word: בְנֵי יוֹסֵף
  choice: die Nachkommen Josefs
  rationale: Das hebräische Verwandtschaftswort bezeichnet hier nicht nur unmittelbare Söhne, sondern Josefs Stammesnachkommen.
- source_word: שְׁנֵי מַטּוֹת
  choice: zwei Stämme
  rationale: מַטּוֹת meint in diesem Zusammenhang Stammesverbände, nicht wörtliche Stäbe.
- source_word: וְלֹא נָתְנוּ חֵלֶק
  choice: Den Leviten gab man keinen Anteil
  rationale: Bewahrt die aktive, unbestimmt-plurale Aussage idiomatisch; חֵלֶק bezeichnet den Anteil bei der Landverteilung.
- source_word: כִּי אִם
  choice: sondern nur
  rationale: Kennzeichnet nach der Verneinung die begrenzte Ausnahme.
- source_word: עָרִים לָשֶׁבֶת
  choice: Städte zum Wohnen
  rationale: Gibt den Zweck der Städte natürlich und knapp wieder.
- source_word: מִגְרְשֵׁיהֶם
  choice: die dazugehörigen Weideflächen
  rationale: Bezeichnet das offene Umland der Levitenstädte, das unter anderem der Viehhaltung diente; 'dazugehörig' macht den Bezug zu den Städten deutlich.
- source_word: לְמִקְנֵיהֶם
  choice: für ihr Vieh
  rationale: מִקְנֶה ist eine breite Bezeichnung für gehaltene Nutztiere.
- source_word: וּלְקִנְיָנָם
  choice: und ihren Besitz
  rationale: קִנְיָן bezeichnet erworbenes beziehungsweise eigenes Gut; die allgemeine Wiedergabe bewahrt die semantische Breite.
theological_decisions:
- issue: Verhältnis der Josephsstämme zur Landzuteilung der Leviten
  choice: 'Die Aussage bleibt eine sachliche Erklärung: Joseph zählt durch Manasse und Ephraim als zwei Stämme, während Levi keinen eigenen Landanteil erhielt.'
  alternative: Die Formulierung ausdrücklich als theologische Regel zur Stammeszahl oder zum levitischen Erbrecht auslegen.
  rationale: Der Vers erklärt die Verteilung, ohne die weitergehende theologische Bedeutung ausdrücklich festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. 'Nachkommen' vermeidet das im Deutschen hier missverständliche wörtliche 'Söhne'. Der Haupttext folgt der hebräischen Satzstruktur, glättet sie jedoch zu natürlichem Deutsch.
