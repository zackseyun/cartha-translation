  text: עַל כֵּ֣ן הָיְתָֽה חֶ֠בְרוֹן לְ/כָלֵ֨ב בֶּן יְפֻנֶּ֤ה הַ/קְּנִזִּי֙ לְֽ/נַחֲלָ֔ה עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה יַ֚עַן אֲשֶׁ֣ר מִלֵּ֔א אַחֲרֵ֕י יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/014.yaml
  text: Therefore Hebron became the inheritance of Caleb son of Jephunneh the Kenizzite to this day[a], because he fully followed Yahweh, the God of Israel.
translation:
  language: de
  text: Darum fiel Hebron Kaleb, dem Sohn Jefunnes, dem Kenasiter, als Erbbesitz zu und gehört ihm bis zum heutigen Tag, weil er Jahwe, dem Gott Israels, uneingeschränkt gefolgt war.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Er füllte hinter Jahwe her aus.“ Die hebräische Wendung bezeichnet vollständige, ungeteilte Gefolgschaft; möglich ist auch: „Er folgte Jahwe von ganzem Herzen.“'
    reason: Erläuterung einer hebräischen Redewendung und ihrer möglichen Wiedergabe.
lexical_decisions:
- source_word: עַל כֵּן
  choice: Darum
  rationale: Leitet knapp und natürlich die Folge aus der vorausgehenden Landzuteilung ein.
- source_word: הָיְתָה ... לְכָלֵב ... לְנַחֲלָה
  choice: fiel ... Kaleb ... als Erbbesitz zu
  rationale: Die Konstruktion bezeichnet den Übergang Hebrons in Kalebs erblichen Besitz. „Als Erbbesitz zufallen“ ist im Deutschen für eine Landzuteilung idiomatisch und bewahrt diesen Vorgang.
- source_word: חֶבְרוֹן
  choice: Hebron
  rationale: Etablierte deutsche Form des Ortsnamens.
- source_word: כָלֵב בֶּן יְפֻנֶּה הַקְּנִזִּי
  choice: Kaleb, dem Sohn Jefunnes, dem Kenasiter
  rationale: Verwendet die geläufigen deutschen Namensformen und gibt Abstammung sowie Volkszugehörigkeit appositionell wieder.
- source_word: לְנַחֲלָה
  choice: als Erbbesitz
  rationale: נַחֲלָה bezeichnet im Kontext der Landverteilung den durch Zuteilung erhaltenen und vererbbaren Besitz.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: bis zum heutigen Tag
  rationale: Gibt die zeitliche Fortdauer bis zur Gegenwart des Erzählers in geläufigem Deutsch wieder.
- source_word: יַעַן אֲשֶׁר
  choice: weil
  rationale: Drückt den im Hebräischen ausdrücklich genannten Grund klar und natürlich aus.
- source_word: מִלֵּא אַחֲרֵי
  choice: uneingeschränkt gefolgt
  rationale: Die hebräische Wendung bezeichnet vollständige, ungeteilte Gefolgschaft. „Uneingeschränkt“ bewahrt die Intensität, ohne die Wendung wörtlich und unverständlich wiederzugeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt das Tetragramm als den persönlichen Gottesnamen wieder, statt es durch einen Titel zu ersetzen.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: dem Gott Israels
  rationale: Gibt die Constructusverbindung direkt und idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Bundesnamen und unterscheidet ihn von einem bloßen Titel.
- issue: Art von Kalebs Treue
  choice: uneingeschränkt gefolgt
  alternative: von ganzem Herzen gefolgt
  rationale: Die hebräische Redewendung מִלֵּא אַחֲרֵי betont vollständige Loyalität, nennt aber das Herz nicht ausdrücklich. Die gewählte Fassung wahrt diese Aussage, ohne eine zusätzliche Metapher in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung „fiel ... als Erbbesitz zu“ entspricht dem Kontext einer Landzuteilung; der Zusatz „und gehört ihm“ macht die im Hebräischen durch „bis zum heutigen Tag“ ausgedrückte fortdauernde Besitzlage im Deutschen klar.
