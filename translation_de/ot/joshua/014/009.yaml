  text: וַ/יִּשָּׁבַ֣ע מֹשֶׁ֗ה בַּ/יּ֣וֹם הַ/הוּא֮ לֵ/אמֹר֒ אִם לֹ֗א הָ/אָ֨רֶץ֙ אֲשֶׁ֨ר דָּרְכָ֤ה רַגְלְ/ךָ֙ בָּ֔/הּ לְ/ךָ֨ תִֽהְיֶ֧ה לְ/נַחֲלָ֛ה וּ/לְ/בָנֶ֖י/ךָ עַד עוֹלָ֑ם כִּ֣י מִלֵּ֔אתָ אַחֲרֵ֖י יְהוָ֥ה אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/009.yaml
  text: And Moses swore on that day[a], saying, ‘Surely the land on which your foot has trodden shall be an inheritance for you and for your sons forever[b], because you have fully followed Yahweh my God.’
translation:
  language: de
  text: 'Und Mose schwor an jenem Tag: »Das Land, auf das dein Fuß getreten ist, soll ganz gewiss dir und deinen Söhnen[a] für immer als Erbbesitz gehören, denn du bist Jahwe, meinem Gott, mit ganzem Herzen gefolgt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „deinen Söhnen“; gemeint sein können auch deine Nachkommen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: schwor
  rationale: Das Nifal von שׁבע bedeutet hier »schwören« bzw. »einen Eid leisten«; »schwor« ist knapp, natürlich und bewahrt den feierlichen Charakter.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Die direkte temporale Wendung wird in natürlichem Standarddeutsch wiedergegeben.
- source_word: לֵאמֹר
  choice: durch den Doppelpunkt ausgedrückt
  rationale: Das hebräische Redeeinleitungswort lässt sich im Deutschen vor direkter Rede idiomatisch durch einen Doppelpunkt wiedergeben; ein zusätzliches »und sprach« wäre unnötig schwerfällig.
- source_word: אִם לֹא
  choice: ganz gewiss
  rationale: In diesem Schwurzusammenhang ist אִם לֹא keine gewöhnliche Bedingung, sondern eine emphatische Schwurformel. »Ganz gewiss« vermittelt ihre bekräftigende Kraft.
- source_word: הָאָרֶץ אֲשֶׁר דָּרְכָה רַגְלְךָ בָּהּ
  choice: das Land, das dein Fuß betreten hat
  rationale: Bewahrt das konkrete Bild des singularischen »Fußes« und gibt דרך idiomatisch als »betreten« wieder.
- source_word: תִהְיֶה לְךָ לְנַחֲלָה
  choice: soll dir als Erbbesitz gehören
  rationale: »Erbbesitz« bringt נַחֲלָה als zugewiesenen, vererbbaren Landbesitz prägnant zum Ausdruck; »soll … gehören« bewahrt die Zukunfts- und Zusagekraft.
- source_word: וּלְבָנֶיךָ
  choice: und deinen Söhnen
  rationale: Der hebräische Text nennt ausdrücklich die »Söhne«; diese konkrete Form wird im Haupttext bewahrt, während die mögliche weiter gefasste Bedeutung in einer Fußnote genannt wird.
- source_word: עַד עוֹלָם
  choice: für immer
  rationale: Eine natürliche und gewichtige Wiedergabe der unbestimmt fortdauernden Zeitangabe.
- source_word: כִּי מִלֵּאתָ אַחֲרֵי
  choice: denn du bist … mit ganzem Herzen gefolgt
  rationale: Die Wendung מלא אחרי bezeichnet vollständige, ungeteilte Nachfolge. Die deutsche idiomatische Formulierung vermittelt dies klar, ohne die Aussage abzuschwächen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהָי
  choice: meinem Gott
  rationale: Der Suffix der ersten Person Singular wird ausdrücklich bewahrt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Tetragrammaton als persönlichen Gottesnamen. »Jahwe« bewahrt diesen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Reichweite von וּלְבָנֶיךָ
  choice: deinen Söhnen
  alternative: deinen Nachkommen
  rationale: Die Form ist wörtlich maskulin pluralisch (»deine Söhne«). Da sie im Zusammenhang auch die fortdauernde Erblinie bezeichnen kann, wird diese mögliche weitere Bedeutung in der Fußnote offengehalten.
- issue: Dauerangabe עַד עוֹלָם
  choice: für immer
  alternative: auf unabsehbare Zeit
  rationale: »Für immer« bewahrt die starke, unbefristete Form der Zusage. Der Text selbst legt hier keine engere systematisch-theologische Bestimmung der Dauer fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede wird ohne das im Deutschen schwerfällige »indem er sagte« eingeleitet. Die hebräische Schwurformel wird mit »ganz gewiss« explizit gemacht; der Fußmarker steht unmittelbar bei der erblichen Zusage.
