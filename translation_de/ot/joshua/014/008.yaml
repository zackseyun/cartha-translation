  verdict: approve
  source_fidelity: 'Die Übersetzung gibt die hebräischen Satzteile sachgerecht wieder: אַחַי bleibt offen als „meine Brüder“, „die mit mir hinaufgezogen waren“ entspricht dem Relativsatz, und „ließen den Mut des Volkes schwinden“ vermittelt natürlich das Bild des schmelzenden Herzens als Entmutigung. „Ich aber“ bildet den betonten Gegensatz von וְאָנֹכִי angemessen ab. „folgte dem HERRN, meinem Gott, ganz und gar“ trifft die idiomatische Aussage מִלֵּאתִי אַחֲרֵי mit ihrem Nachdruck, ohne mehr zu behaupten als vollständige Treue bzw. Nachfolge.'
