source:
  edition: WLC
  text: וְ/אַחַ/י֙ אֲשֶׁ֣ר עָל֣וּ עִמִּ֔/י הִמְסִ֖יו אֶת לֵ֣ב הָ/עָ֑ם וְ/אָנֹכִ֣י מִלֵּ֔אתִי אַחֲרֵ֖י יְהוָ֥ה אֱלֹהָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/008.yaml
  text: But my brothers who went up with me made the heart of the people melt, while I wholly followed the LORD my God.
translation:
  language: de
  text: Doch meine Brüder, die mit mir hinaufgezogen waren, ließen den Mut des Volkes schwinden; ich aber folgte dem HERRN, meinem Gott, ganz und gar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחַי
  choice: meine Brüder
  rationale: Bewahrt die Verwandtschafts- beziehungsweise Gemeinschaftsbezeichnung des Hebräischen, ohne sie erklärend auf „Gefährten“ oder „Kundschafter“ einzuengen.
- source_word: הִמְסִיו אֶת־לֵב הָעָם
  choice: ließen den Mut des Volkes schwinden
  rationale: 'Gibt das hebräische Bild vom „Schmelzenlassen des Herzens“ in einer natürlichen deutschen Wendung wieder und bewahrt dessen Sinn: Das Volk wurde entmutigt.'
- source_word: מִלֵּאתִי אַחֲרֵי
  choice: folgte … ganz und gar
  rationale: Die ungewöhnliche hebräische Wendung bezeichnet vollständige, uneingeschränkte Nachfolge; „ganz und gar“ erhält diesen Nachdruck.
- source_word: יהוה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Tetragramms in Kapitälchen wahrt die Unterscheidung zum gewöhnlichen Herrentitel.
theological_decisions:
- issue: Art und Ausmaß von Kalebs Treue
  choice: folgte dem HERRN … ganz und gar
  alternative: war dem HERRN vollkommen gehorsam
  rationale: Die gewählte Fassung bleibt beim biblischen Motiv der Nachfolge und behauptet keine darüber hinausgehende moralische Vollkommenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gegensatz wird entsprechend dem betonten אָנֹכִי mit „ich aber“ markiert; das Semikolon hält Entmutigung des Volkes und Kalebs uneingeschränkte Nachfolge eng zusammen.
