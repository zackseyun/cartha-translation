  terminology: „der HERR“ ist die etablierte deutsche Wiedergabe des Gottesnamens und wird hier mit der anschließenden Apposition „meinem Gott“ korrekt verbunden. „Brüder“ wahrt die im Hebräischen bestehende, nicht weiter spezifizierte Gruppenbezeichnung. Die Wahl „folgen“ bewahrt das biblische Motiv, statt es zu einer engeren dogmatischen oder moralischen Aussage umzudeuten.
