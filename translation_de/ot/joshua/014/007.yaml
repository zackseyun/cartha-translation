  text: בֶּן אַרְבָּעִ֨ים שָׁנָ֜ה אָנֹכִ֗י בִּ֠/שְׁלֹחַ מֹשֶׁ֨ה עֶֽבֶד יְהוָ֥ה אֹתִ֛/י מִ/קָּדֵ֥שׁ בַּרְנֵ֖עַ לְ/רַגֵּ֣ל אֶת הָ/אָ֑רֶץ וָ/אָשֵׁ֤ב אֹת/וֹ֙ דָּבָ֔ר כַּ/אֲשֶׁ֖ר עִם לְבָבִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/007.yaml
  text: I was forty years old when Moses the servant of Yahweh sent me from Kadesh-barnea to spy out the land[a], and I brought him back word according to my heart.
translation:
  language: de
  text: Ich war vierzig Jahre alt, als Mose, der Diener Jahwes, mich von Kadesch-Barnea aussandte, um das Land auszukundschaften. Und ich brachte ihm einen Bericht zurück, wie es in meinem Herzen war.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »entsprechend dem, was in meinem Herzen war«.'
    reason: Die hebräische Wendung bewahrt die bildhafte Bezugnahme auf das Herz und kann Kalebs innere Überzeugung oder Einschätzung bezeichnen, ohne diese näher festzulegen.
lexical_decisions:
- source_word: בֶּן אַרְבָּעִים שָׁנָה
  choice: Ich war vierzig Jahre alt
  rationale: Die wörtliche hebräische Altersangabe »ein Sohn von vierzig Jahren« wird mit der üblichen deutschen Altersformulierung wiedergegeben.
- source_word: בִּשְׁלֹחַ
  choice: als … aussandte
  rationale: Der Infinitiv mit ב bezeichnet hier den zeitlichen Umstand; »als … aussandte« ist natürliches Deutsch und gibt den Auftrag angemessen wieder.
- source_word: עֶבֶד יְהוָה
  choice: der Diener Jahwes
  rationale: »Diener« wahrt den ehrenvollen Amtstitel des Mose; der Gottesname wird als »Jahwe« wiedergegeben.
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: von Kadesch-Barnea
  rationale: Der Ortsname wird in geläufiger deutscher Transkription wiedergegeben.
- source_word: לְרַגֵּל
  choice: um … auszukundschaften
  rationale: Das Verb bezeichnet die gezielte Erkundung eines Gebietes; »auskundschaften« passt zum erzählerischen Zusammenhang, ohne unnötig moderne militärische Terminologie einzuführen.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Im Zusammenhang bezeichnet der Ausdruck das zu erkundende verheißene Gebiet; »das Land« ist präzise und traditionsgemäß.
- source_word: וָאָשֵׁב אֹתוֹ דָּבָר
  choice: ich brachte ihm einen Bericht zurück
  rationale: Die hebräische Wendung bedeutet idiomatisch, jemandem Nachricht beziehungsweise einen Bericht zurückzubringen. »Bericht« ist im Deutschen natürlicher als das hier schwer verständliche »Wort«.
- source_word: כַּאֲשֶׁר עִם לְבָבִי
  choice: wie es meinem Herzen entsprach
  rationale: Die Formulierung bewahrt das hebräische Herzbild und lässt offen, ob vor allem Kalebs innere Überzeugung, seine ehrliche Einschätzung oder beides gemeint ist.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. »Jahwe« gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von כַּאֲשֶׁר עִם לְבָבִי
  choice: wie es meinem Herzen entsprach
  alternative: gemäß dem, was in meinem Herzen war
  rationale: Die Hauptfassung erhält die Herzmetapher in verständlichem Deutsch, ohne die Aussage ausdrücklich auf Aufrichtigkeit, Mut oder uneingeschränkte Treue festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nahe am Hebräischen, wird aber für flüssige Lesbarkeit in zwei Sätze gegliedert. Die Herzmetapher bleibt erhalten; eine konfessionell oder psychologisch verengende Deutung wird vermieden.
