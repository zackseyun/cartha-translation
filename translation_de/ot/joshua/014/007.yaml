revisions:
- from: Ich war vierzig Jahre alt, als Mose, der Diener Jahwes, mich von Kadesch-Barnea aussandte, um das Land auszukundschaften. Und ich brachte ihm einen Bericht zurück, wie es meinem Herzen entsprach.[a]
  to: Ich war vierzig Jahre alt, als Mose, der Diener Jahwes, mich von Kadesch-Barnea aussandte, um das Land auszukundschaften. Und ich brachte ihm einen Bericht zurück, wie es in meinem Herzen war.[a]
  rationale: Die Änderung beschränkt sich auf die Herz-Wendung. Sie verhindert die im Deutschen mögliche Lesart von bloßer persönlicher Vorliebe und bildet genauer ab, dass der Bericht dem inneren Befund Kalebs entsprach. Die Fußnote bleibt am Ende der betreffenden Aussage verankert und bietet eine idiomatisch erläuterte Alternative.
