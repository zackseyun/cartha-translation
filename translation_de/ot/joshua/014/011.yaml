  text: עוֹדֶ֨/נִּי הַ/יּ֜וֹם חָזָ֗ק כַּֽ/אֲשֶׁר֙ בְּ/י֨וֹם שְׁלֹ֤חַ אוֹתִ/י֙ מֹשֶׁ֔ה כְּ/כֹ֥חִ/י אָ֖ז וּ/כְ/כֹ֣חִ/י עָ֑תָּה לַ/מִּלְחָמָ֖ה וְ/לָ/צֵ֥את וְ/לָ/בֽוֹא׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/011.yaml
  text: I am still as strong today as I was on the day Moses sent me; as my strength was then[a], so my strength is now, for battle and for going out and coming in.
translation:
  language: de
  text: Ich bin heute noch genauso stark wie an dem Tag, als Mose mich aussandte. Wie meine Kraft damals war, so ist meine Kraft auch jetzt – zum Kampf und um hinauszugehen und hereinzukommen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „hinauszugehen und hereinzukommen“. Diese hebräische Wendung kann volle Handlungsfähigkeit bezeichnen, besonders bei militärischen Unternehmungen oder in leitender Verantwortung.'
    reason: cultural_note
lexical_decisions:
- source_word: עוֹדֶנִּי הַיּוֹם חָזָק
  choice: Ich bin heute noch genauso stark
  rationale: Die Verbindung aus עוֹד mit Suffix, הַיּוֹם und חָזָק bezeichnet Kalebs bis heute fortbestehende Stärke; „heute noch“ und „genauso stark“ geben dies in natürlichem Deutsch wieder.
- source_word: כַּאֲשֶׁר בְּיוֹם שְׁלֹחַ אוֹתִי מֹשֶׁה
  choice: wie an dem Tag, als Mose mich aussandte
  rationale: Die Vergleichs- und Zeitkonstruktion wird klar wiedergegeben. „Aussandte“ entspricht dem Kontext des damaligen Erkundungsauftrags und bewahrt den Bezug auf שׁלח.
- source_word: כְּכֹחִי אָז וּכְכֹחִי עָתָּה
  choice: Wie meine Kraft damals war, so ist meine Kraft auch jetzt
  rationale: Die im Hebräischen verblosen, parallel gebauten Vergleichsglieder werden mit ergänzten Kopulaverben verständlich gemacht, ohne ihre ausgewogene Struktur aufzulösen.
- source_word: לַמִּלְחָמָה
  choice: zum Kampf
  rationale: מִלְחָמָה bezeichnet hier angesichts der bevorstehenden Landnahme den konkreten Kampf; „zum Kampf“ klingt im Deutschen natürlicher als „zum Krieg“.
- source_word: וְלָצֵאת וְלָבוֹא
  choice: um hinauszugehen und hereinzukommen
  rationale: Die beiden Infinitive werden eng und in derselben Reihenfolge wiedergegeben. Die konkrete hebräische Ausdrucksweise bleibt im Text erhalten; ihre idiomatische Reichweite wird in der Fußnote erläutert.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „meine Kraft“ bewahrt den markanten Parallelismus des hebräischen Textes. Der Gedankenstrich verbindet Kalebs fortbestehende Kraft mit ihrer konkreten Bewährung.
