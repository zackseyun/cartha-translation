  text: וַֽ/יְבָרְכֵ֖/הוּ יְהוֹשֻׁ֑עַ וַ/יִּתֵּ֧ן אֶת חֶבְר֛וֹן לְ/כָלֵ֥ב בֶּן יְפֻנֶּ֖ה לְ/נַחֲלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/013.yaml
  text: Then Joshua blessed him and gave Hebron to Caleb son of Jephunneh as an inheritance[a].
translation:
  language: de
  text: Da segnete Josua ihn und gab Hebron Kaleb, dem Sohn Jefunnes, als Erbbesitz.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְבָרְכֵהוּ
  choice: segnete ihn
  rationale: Das Verb ברך mit dem Suffix der 3. Person Singular maskulin bedeutet wörtlich „segnete ihn“. Der Bezug auf Kaleb ist aus dem Zusammenhang eindeutig, sodass das Pronomen im Haupttext bewahrt werden kann.
- source_word: יְהוֹשֻׁעַ
  choice: Josua
  rationale: Der Personenname wird in seiner etablierten deutschen Bibelform wiedergegeben.
- source_word: וַיִּתֵּן
  choice: gab
  rationale: נתן ist das gewöhnliche Verb für „geben“; „gab“ entspricht dem Hebräischen direkt und passt zur Zuteilung des Landes.
- source_word: אֶת חֶבְרוֹן
  choice: Hebron
  rationale: Die direkte Objektmarkierung אֶת bleibt unübersetzt; der Ortsname חֶבְרוֹן wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: לְכָלֵב בֶּן יְפֻנֶּה
  choice: Kaleb, dem Sohn Jefunnes
  rationale: Das לְ kennzeichnet den Empfänger. Die Apposition „dem Sohn Jefunnes“ gibt die Abstammungsangabe natürlich und vollständig wieder.
- source_word: לְנַחֲלָה
  choice: als Erbbesitz
  rationale: נַחֲלָה bezeichnet hier das zugeteilte, dauerhaft ererbte Land. „Erbbesitz“ ist im Deutschen prägnant und bewahrt sowohl den Erb- als auch den Besitzaspekt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die hebräische Satzstruktur. Das pronominale Objekt „ihn“ bleibt erhalten; der anschließende Name Kaleb macht den Bezug klar. „Da“ gibt die fortschreitende hebräische Erzählform natürlich wieder.
