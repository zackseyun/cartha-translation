  text: בְּ/גוֹרַ֖ל נַחֲלָתָ֑/ם כַּ/אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ בְּ/יַד מֹשֶׁ֔ה לְ/תִשְׁעַ֥ת הַ/מַּטּ֖וֹת וַ/חֲצִ֥י הַ/מַּטֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/002.yaml
  text: Their inheritance was by lot[a], as Yahweh had commanded through Moses, for the nine tribes and the half-tribe.
translation:
  language: de
  text: Ihr Erbbesitz wurde durch das Los zugeteilt, wie Jahwe es durch Mose[a] für die neun Stämme und den halben Stamm geboten hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „durch die Hand Moses“; eine hebräische Wendung für Vermittlung oder Beauftragung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּגוֹרָל
  choice: durch das Los
  rationale: Die Präposition בְּ bezeichnet hier Mittel oder Verfahren. „Durch das Los“ gibt die Zuteilung mittels Losentscheid natürlich und präzise wieder.
- source_word: נַחֲלָתָם
  choice: ihr Erbbesitz
  rationale: נַחֲלָה bezeichnet hier das als Erbe zugewiesene Land. „Erbbesitz“ bewahrt sowohl den Gedanken des Erbes als auch den konkreten Landbesitz.
- source_word: כַּאֲשֶׁר
  choice: wie
  rationale: Die Konjunktion stellt die Zuteilung in Übereinstimmung mit dem zuvor ergangenen Gebot dar.
- source_word: צִוָּה
  choice: geboten hatte
  rationale: Das Perfekt verweist im Zusammenhang auf ein früher erteiltes Gebot; das deutsche Plusquamperfekt macht diese zeitliche Beziehung deutlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. „Jahwe“ ist die geläufige deutsche Form.
- source_word: בְּיַד מֹשֶׁה
  choice: durch Mose
  rationale: Wörtlich steht „durch die Hand Moses“; die hebräische Wendung bezeichnet Vermittlung oder Beauftragung. „Durch Mose“ gibt den Sinn in heutigem Deutsch klar wieder.
- source_word: לְתִשְׁעַת הַמַּטּוֹת
  choice: für die neun Stämme
  rationale: Die Präposition לְ kennzeichnet hier die Empfänger beziehungsweise die Gruppe, für die die Zuteilung bestimmt war.
- source_word: וַחֲצִי הַמַּטֶּה
  choice: und den halben Stamm
  rationale: מַטֶּה bedeutet in diesem Zusammenhang „Stamm“. Die Formulierung bezeichnet die westlich des Jordan bedachte Hälfte des Stammes Manasse.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. Die Wiedergabe „Jahwe“ bewahrt ihn als persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Da der hebräische Vers in seinem Zusammenhang eine elliptische Nominalkonstruktion enthält, wird das im Deutschen erforderliche Prädikat „wurde … zugeteilt“ sinngemäß ergänzt. Der Fußnotenmarker steht bei „durch Mose“, da sich die erläuterte hebräische Wendung darauf bezieht.
