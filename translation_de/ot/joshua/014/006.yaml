source:
  edition: WLC
  text: וַ/יִּגְּשׁ֨וּ בְנֵֽי יְהוּדָ֤ה אֶל יְהוֹשֻׁ֨עַ֙ בַּ/גִּלְגָּ֔ל וַ/יֹּ֣אמֶר אֵלָ֔י/ו כָּלֵ֥ב בֶּן יְפֻנֶּ֖ה הַ/קְּנִזִּ֑י אַתָּ֣ה יָדַ֡עְתָּ אֶֽת הַ/דָּבָר֩ אֲשֶׁר דִּבֶּ֨ר יְהוָ֜ה אֶל מֹשֶׁ֣ה אִישׁ הָ/אֱלֹהִ֗ים עַ֧ל אֹדוֹתַ֛/י וְ/עַ֥ל אֹדוֹתֶ֖י/ךָ בְּ/קָדֵ֥שׁ בַּרְנֵֽעַ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/006.yaml
  text: Then the sons of Judah came near to Joshua at Gilgal[a], and Caleb son of Jephunneh the Kenizzite said to him, “You know the word that Yahweh spoke to Moses the man of God concerning me and concerning you at Kadesh-barnea.”
translation:
  language: de
  text: 'Da traten die Söhne Judas in Gilgal zu Josua, und Kaleb, der Sohn Jefunnes, der Kenasiter, sagte zu ihm: »Du kennst das Wort[a], das Jahwe in Kadesch-Barnea zu Mose, dem Mann Gottes, über mich und über dich gesprochen hat.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Sache« beziehungsweise »die Angelegenheit«.'
    reason: Lexikalische Alternative für הַדָּבָר, das sowohl eine Äußerung als auch deren Inhalt oder Gegenstand bezeichnen kann.
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: Da traten ... zu Josua
  rationale: נגשׁ bezeichnet das Herantreten oder Sichnähern; „zu jemandem treten“ ist im Deutschen natürlich und bewahrt die erzählerische Bewegung.
- source_word: בְנֵי יְהוּדָה
  choice: die Söhne Judas
  rationale: Die wörtliche Stammesbezeichnung bleibt erhalten, ohne sie zu „Volk“ oder „Männer“ zu verallgemeinern.
- source_word: בַּגִּלְגָּל
  choice: in Gilgal
  rationale: Die Ortsangabe wird im Deutschen idiomatisch mit „in“ wiedergegeben.
- source_word: כָּלֵב בֶּן יְפֻנֶּה הַקְּנִזִּי
  choice: Kaleb, der Sohn Jefunnes, der Kenasiter
  rationale: Die Eigennamen und die Herkunfts- beziehungsweise Sippenbezeichnung werden in geläufiger deutscher Bibelschreibung wiedergegeben.
- source_word: אַתָּה יָדַעְתָּ
  choice: Du kennst
  rationale: Die hebräische Perfektform bezeichnet hier den gegenwärtigen Wissensstand Josuas.
- source_word: הַדָּבָר
  choice: das Wort
  rationale: דבר kann „Wort“, „Sache“ oder „Angelegenheit“ bedeuten; wegen des folgenden Verbs „sprechen“ steht hier die göttliche Äußerung im Vordergrund, während die Mehrdeutigkeit in einer Fußnote erhalten bleibt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname transliteriert und nicht durch einen Titel ersetzt.
- source_word: מֹשֶׁה אִישׁ הָאֱלֹהִים
  choice: Mose, dem Mann Gottes
  rationale: Die feststehende biblische Bezeichnung אִישׁ הָאֱלֹהִים wird formal und verständlich bewahrt.
- source_word: עַל אֹדוֹתַי וְעַל אֹדוֹתֶיךָ
  choice: über mich und über dich
  rationale: Die zweimalige hebräische Wendung wird parallel und in natürlichem Deutsch wiedergegeben.
- source_word: בְּקָדֵשׁ בַּרְנֵעַ
  choice: in Kadesch-Barnea
  rationale: Der Ortsname erhält die geläufige deutsche Form; „in“ ist für die Ortsangabe idiomatisch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm; „Jahwe“ bewahrt dessen Funktion als persönlichen Gottesnamen.
- issue: Stammesbezeichnung בְנֵי יְהוּדָה
  choice: die Söhne Judas
  alternative: die Angehörigen des Stammes Juda
  rationale: Die gewählte Fassung wahrt die konkrete, männlich formulierte Verwandtschafts- und Stammesbezeichnung des Hebräischen.
- issue: Bedeutungsumfang von הַדָּבָר
  choice: das Wort
  alternative: die Sache
  rationale: Der Zusammenhang verweist auf eine Äußerung Jahwes, doch das hebräische Wort kann zugleich die betreffende Sache oder Angelegenheit bezeichnen; diese Spannung wird durch die Fußnote sichtbar gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht bibelsprachlicher Prägung. Die Satzstruktur bleibt nah am hebräischen Erzählfluss, ohne im Deutschen steif zu wirken; Eigennamen folgen geläufigen deutschen Formen.
