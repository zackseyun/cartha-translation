  variant: modern standard German
source:
  edition: WLC
  text: וְ/אֵ֛לֶּה אֲשֶׁר נָחֲל֥וּ בְנֵֽי יִשְׂרָאֵ֖ל בְּ/אֶ֣רֶץ כְּנָ֑עַן אֲשֶׁ֨ר נִֽחֲל֜וּ אוֹתָ֗/ם אֶלְעָזָ֤ר הַ/כֹּהֵן֙ וִ/יהוֹשֻׁ֣עַ בִּן נ֔וּן וְ/רָאשֵׁ֛י אֲב֥וֹת הַ/מַּטּ֖וֹת לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/001.yaml
  text: These are the inheritances that the sons of Israel received in the land of Canaan[a], which Eleazar the priest, Joshua son of Nun[c][b], and the heads of the fathers’ houses of the tribes of the sons of Israel apportioned to them.
translation:
  language: de
  text: Dies sind die Erbteile, die die Söhne Israels[a] im Land Kanaan erhielten und die ihnen der Priester Eleasar, Josua, der Sohn Nuns, und die Oberhäupter der Vaterhäuser[c] der Stämme der Söhne Israels als Erbe zuteilten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Israeliten«. Wörtlich steht im Hebräischen die familiäre Bezeichnung »die Söhne Israels«.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »die ihnen der Priester Eleasar, Josua, der Sohn Nuns, und die Oberhäupter der Vaterhäuser der Stämme der Söhne Israels als Erbbesitz zuwiesen«. Im Hebräischen wird in beiden Satzteilen derselbe Wortstamm für »erben/als Erbe zuteilen« verwendet.'
    reason: lexical_alternative
  - marker: c
    text: »Vaterhäuser« sind auf gemeinsamer Abstammung beruhende Großfamilien innerhalb der Stämme; auch »Sippen« ist als erklärende Wiedergabe möglich.
    reason: cultural_note
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Dies sind
  rationale: Die Wendung eröffnet einen neuen Abschnitt und knüpft zugleich an den Zusammenhang an. Im Deutschen ist kein zusätzliches zeitliches »nun« erforderlich.
- source_word: נָחֲלוּ
  choice: erhielten
  rationale: Die Qal-Form bezeichnet hier, dass Israel die zugewiesenen Landanteile in Besitz beziehungsweise als Erbe erhielt. »Erhielten« ist im modernen Deutschen natürlich und vermeidet die Verengung auf Erbfolge nach einem Todesfall.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die wörtliche familiäre Bezeichnung des Hebräischen bleibt sichtbar; die idiomatischere Wiedergabe »die Israeliten« wird in einer Fußnote genannt.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: im Land Kanaan
  rationale: Das ausdrücklich genannte »Land« wird beibehalten, weil der territoriale Gedanke im Zusammenhang der Erbverteilung bedeutsam ist.
- source_word: אֲשֶׁר נִחֲלוּ אוֹתָם
  choice: die ihnen … als Erbe zuteilten
  rationale: Die Form bezeichnet die förmliche Zuteilung durch die genannten Verantwortlichen. Zugleich lässt »als Erbe« die Wiederholung des hebräischen Stammes נחל erkennen.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: der Priester Eleasar
  rationale: Dies ist die natürliche deutsche Wiedergabe von Name und Amtsbezeichnung.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Josua, der Sohn Nuns
  rationale: Die Abstammungsangabe wird im Deutschen durch eine Apposition klar und würdig wiedergegeben.
- source_word: רָאשֵׁי אֲבוֹת הַמַּטּוֹת
  choice: die Oberhäupter der Sippen der israelitischen Stämme
  rationale: »Oberhäupter« gibt רָאשֵׁי wieder; »Sippen« bezeichnet verständlich die auf Abstammung beruhenden Großfamilien innerhalb der Stämme, ohne die soziale Gliederung auf bloße »Stammesführer« zu reduzieren.
- source_word: נָחֲלוּ / נִחֲלוּ
  choice: Erbteile / erhielten / als Erbe zuteilten
  rationale: Die deutsche Formulierung bewahrt den gemeinsamen Erbgedanken der beiden hebräischen Verbformen, ohne eine unnatürliche Wortwiederholung zu erzwingen.
theological_decisions:
- issue: Familiäre Bundesbezeichnung בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Israeliten
  rationale: Die grammatisch maskuline und familiäre Ausdrucksweise des Ausgangstextes bleibt im Haupttext erhalten; die geläufigere ethnische Bezeichnung steht als Übersetzungsalternative in der Fußnote.
- issue: Abstammungsbezogene Sozialstruktur in אֲבוֹת
  choice: Sippen
  alternative: Vaterhäuser
  rationale: »Sippen« vermittelt heutigen Lesern die gemeinte, durch gemeinsame Abstammung bestimmte Familiengruppe. Eine Fußnote erläutert den kulturellen Sachverhalt, während das archaisch und missverständlich wirkende »Vaterhäuser« vermieden wird.
- issue: Wiederholung des Stammes נחל
  choice: Erbteile … erhielten … als Erbe zuteilten
  alternative: Gebiete … erhielten … zuwiesen
  rationale: Die gewählte Fassung hält den theologischen und rechtlichen Erbgedanken in beiden Satzteilen präsent, ohne festzulegen, dass es sich um gewöhnliche Erbfolge nach dem Tod eines Besitzers handelt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt der hebräischen Abfolge, bleibt aber durch die deutsche Relativsatzkonstruktion gut verständlich. »Erbteile« und »als Erbe zuteilten« bewahren den Leitgedanken des Erbbesitzes; »Sippen« vermeidet unnötig altertümliche Verwaltungssprache.
