base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/015.yaml
  text: The former name of Hebron was Kiriath-arba[a]; Arba was the greatest man among the Anakim[c][b]. And the land had rest from war.
translation:
  language: de
  text: Der frühere Name Hebrons war Kirjat-Arba[a]. Arba war der bedeutendste Mann unter den Anakitern[b]. Und das Land hatte Ruhe vor dem Krieg[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kirjat-Arba bedeutet wahrscheinlich »Stadt Arbas«.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Arba war der große Mann unter den Anakitern.« Das Hebräische kann ihn als besonders herausragende Gestalt unter ihnen bezeichnen.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: »Und das Land war vom Krieg zur Ruhe gekommen.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם חֶבְרוֹן לְפָנִים
  choice: Der frühere Name Hebrons
  rationale: לְפָנִים bedeutet hier »früher« beziehungsweise »ehemals«. Die deutsche Nominalfügung ist natürlich und gibt den hebräischen Sinn knapp wieder; das einleitende וְ braucht in diesem Satz keinen eigens ausgedrückten Diskursmarker.
- source_word: קִרְיַת אַרְבַּע
  choice: Kirjat-Arba
  rationale: Der Ortsname wird in einer im Deutschen geläufigen, hebräisch nahen Form wiedergegeben. Seine wahrscheinliche Bedeutung wird in einer Fußnote erläutert.
- source_word: הָאָדָם הַגָּדוֹל בָּעֲנָקִים הוּא
  choice: Arba war der größte Mann unter den Anakitern
  rationale: Das Pronomen הוּא greift wahrscheinlich Arba auf. הַגָּדוֹל kann im Zusammenhang Vorrang oder besondere Bedeutung ausdrücken; »der größte Mann« gibt diese Lesart verständlich wieder, während die formal nähere Alternative in der Fußnote erhalten bleibt.
- source_word: עֲנָקִים
  choice: Anakiter
  rationale: Die im Deutschen natürliche Volksbezeichnung bezeichnet die mit Anak verbundene Volksgruppe.
- source_word: וְהָאָרֶץ שָׁקְטָה מִמִּלְחָמָה
  choice: Und das Land hatte Ruhe vom Krieg
  rationale: שׁקט bezeichnet einen Zustand der Ruhe oder Ungestörtheit. Die Formulierung bewahrt den erzählerischen Anschluss durch וְ und die im Kontext gemeinte Ruhe nach kriegerischen Auseinandersetzungen.
theological_decisions:
- issue: Stellung Arbas unter den Anakitern
  choice: Arba war der größte Mann unter den Anakitern
  alternative: Arba war der große Mann unter den Anakitern
  rationale: Der bestimmte Ausdruck הָאָדָם הַגָּדוֹל kann Arba als herausragende oder bedeutendste Gestalt kennzeichnen, ohne dass der hebräische Text einen morphologischen Superlativ verwendet. Die verbleibende Spannung wird durch die Fußnote offengehalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Eigennamen und Volksbezeichnungen folgen geläufigen deutschen Formen; echte lexikalische Mehrdeutigkeit wird in den Fußnoten bewahrt.
