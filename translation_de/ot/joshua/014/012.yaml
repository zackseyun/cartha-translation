id: JOS.14.12
reference: Joshua 14:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/עַתָּ֗ה תְּנָ/ה לִּ/י֙ אֶת הָ/הָ֣ר הַ/זֶּ֔ה אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא כִּ֣י אַתָּֽה שָׁמַעְתָּ֩ בַ/יּ֨וֹם הַ/ה֜וּא כִּֽי עֲנָקִ֣ים שָׁ֗ם וְ/עָרִים֙ גְּדֹל֣וֹת בְּצֻר֔וֹת אוּלַ֨י יְהוָ֤ה אוֹתִ/י֙ וְ/ה֣וֹרַשְׁתִּ֔י/ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/012.yaml
  text: Now give me this hill country that Yahweh spoke about on that day[a], because you yourself heard on that day that the Anakim are there, with great fortified cities. Perhaps Yahweh will be with me, and I will drive them out[b], just as Yahweh said.
translation:
  language: de
  text: Und nun gib mir dieses Bergland[a], von dem Jahwe an jenem Tag gesprochen hat. Denn du selbst hast an jenem Tag gehört, dass dort die Anakiter sind und große, befestigte Städte. Vielleicht wird Jahwe mit mir sein[b], und ich werde sie vertreiben, wie Jahwe gesagt hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „diesen Berg“. Das hebräische Wort הָהָר kann sowohl einen einzelnen Berg als auch ein Bergland bezeichnen; hier ist wahrscheinlich die größere gebirgige Region gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Im Hebräischen wörtlich: „Vielleicht Jahwe mit mir“; die verblose Wendung drückt die Hoffnung auf Jahwes Gegenwart und Beistand aus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Gibt sowohl die verbindende Funktion von וְ als auch den Übergang zur gegenwärtigen Bitte durch עַתָּה wieder.
- source_word: תְּנָה לִּי
  choice: gib mir
  rationale: Die direkte Aufforderung bewahrt die schlichte und entschlossene Ausdrucksweise Kalebs.
- source_word: אֶת־הָהָר הַזֶּה
  choice: dieses Bergland
  rationale: הַר kann einen einzelnen Berg oder eine gebirgige Region bezeichnen. Im Zusammenhang der Landzuteilung ist hier wahrscheinlich die Region gemeint; die mögliche engere Bedeutung wird in der Fußnote bewahrt.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה
  choice: von dem Jahwe … gesprochen hat
  rationale: Bewahrt die Grundbedeutung von דבר, ohne das im Zusammenhang naheliegende Verheißungsmotiv ausdrücklich in das Verb hineinzutragen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen als Eigennamen wieder.
- source_word: כִּי אַתָּה שָׁמַעְתָּ
  choice: Denn du selbst hast … gehört
  rationale: כִּי leitet hier die Begründung ein; „du selbst“ bildet die Hervorhebung durch das ausdrückliche Pronomen אַתָּה ab.
- source_word: כִּי עֲנָקִים שָׁם
  choice: dass dort die Anakiter sind
  rationale: „Anakiter“ ist die im Deutschen verständliche Bezeichnung der Volksgruppe; das Präsens entspricht Kalebs Darstellung der fortbestehenden Lage.
- source_word: וְעָרִים גְּדֹלוֹת בְּצֻרוֹת
  choice: und große, befestigte Städte
  rationale: Gibt beide Eigenschaften in natürlicher deutscher Wortstellung wieder.
- source_word: אוּלַי
  choice: Vielleicht
  rationale: Bewahrt die sprachlich ausgedrückte Möglichkeit und damit Kalebs zuversichtliche, aber nicht anmaßende Haltung.
- source_word: יְהוָה אוֹתִי
  choice: Jahwe wird mit mir sein
  rationale: Die elliptische, verblose Wendung wird für den deutschen Zukunftszusammenhang ergänzt, ohne sie stärker als ausdrückliche Hilfeleistung auszudeuten.
- source_word: וְהוֹרַשְׁתִּים
  choice: und ich werde sie vertreiben
  rationale: Das Hifil von ירשׁ bezeichnet hier das Entfernen beziehungsweise Verdrängen der Bewohner aus dem Land; „vertreiben“ ist klar und idiomatisch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet das Tetragramm als Gottesnamen; die Umschrift „Jahwe“ bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Aussagekraft von אוּלַי יְהוָה אוֹתִי
  choice: Vielleicht wird Jahwe mit mir sein
  alternative: Vielleicht wird Jahwe mir helfen
  rationale: Die gewählte Fassung wahrt sowohl das „Vielleicht“ als auch die offene Vorstellung göttlicher Gegenwart. Sie macht daraus nicht stillschweigend eine ausdrückliche Hilfszusage.
translation_notes:
  register: Moderne, würdige Standardsprache. Kalebs Bitte bleibt direkt und entschlossen; zugleich wird die durch אוּלַי ausgedrückte Zurückhaltung nicht abgeschwächt. Die Wiederholung „an jenem Tag“ und des Gottesnamens bleibt entsprechend der hebräischen Rhetorik erhalten.
