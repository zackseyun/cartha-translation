id: JOS.14.10
reference: Joshua 14:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִנֵּה֩ הֶחֱיָ֨ה יְהוָ֣ה אוֹתִ/י֮ כַּ/אֲשֶׁ֣ר דִּבֵּר֒ זֶה֩ אַרְבָּעִ֨ים וְ/חָמֵ֜שׁ שָׁנָ֗ה מֵ֠/אָז דִּבֶּ֨ר יְהוָ֜ה אֶת הַ/דָּבָ֤ר הַ/זֶּה֙ אֶל מֹשֶׁ֔ה אֲשֶׁר הָלַ֥ךְ יִשְׂרָאֵ֖ל בַּ/מִּדְבָּ֑ר וְ/עַתָּה֙ הִנֵּ֣ה אָנֹכִ֣י הַ/יּ֔וֹם בֶּן חָמֵ֥שׁ וּ/שְׁמוֹנִ֖ים שָׁנָֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/010.yaml
  text: And now[a], behold, Yahweh has kept me alive, just as he said, these forty-five years since Yahweh spoke this word to Moses while Israel walked in the wilderness. And now, behold[c][b], today I am eighty-five years old.
translation:
  language: de
  text: 'Und nun, sieh: Jahwe hat mich am Leben erhalten[a], wie er gesagt hat – nun schon fünfundvierzig Jahre, seit Jahwe dieses Wort[b] zu Mose sprach, als Israel durch die Wüste zog[c]. Und nun, sieh: Heute bin ich fünfundachtzig Jahre alt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mich bis heute leben lassen“.'
    reason: lexical_alternative
  - marker: b
    text: „Dieses Wort“ kann auch mit „diese Sache“ oder, stärker deutend, mit „diese Zusage“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „als Israel in der Wüste umherzog“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחֱיָה
  choice: hat mich am Leben erhalten
  rationale: Die Hifil-Form bezeichnet hier das Bewahren beziehungsweise Erhalten des Lebens über den genannten Zeitraum hinweg. Die deutsche Wendung ist natürlich und gibt den Rückbezug auf die gegenwärtige Lage Kalebs treffend wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: wie er gesagt hat
  rationale: Diese Wiedergabe bewahrt die allgemeine Bedeutung von דִּבֵּר, ohne sie ausdrücklich als formelle Verheißung auszulegen.
- source_word: זֶה אַרְבָּעִים וְחָמֵשׁ שָׁנָה
  choice: nun schon fünfundvierzig Jahre
  rationale: Die Formulierung gibt idiomatisch einen bis zur Gegenwart reichenden Zeitraum wieder und bewahrt durch „nun schon“ den deiktischen Nachdruck von זֶה.
- source_word: מֵאָז
  choice: seit
  rationale: „Seit“ bezeichnet knapp und genau den Ausgangspunkt des bis zur Gegenwart verstrichenen Zeitraums.
- source_word: הַדָּבָר הַזֶּה
  choice: dieses Wort
  rationale: דָּבָר kann „Wort“, „Sache“ oder kontextuell „Zusage“ bedeuten. „Dieses Wort“ bleibt nahe am Hebräischen und lässt die inhaltliche Einordnung offen.
- source_word: אֲשֶׁר הָלַךְ יִשְׂרָאֵל בַּמִּדְבָּר
  choice: als Israel durch die Wüste zog
  rationale: הלך bezeichnet Israels Unterwegssein. „Durch die Wüste zog“ ist im Deutschen natürlicher als eine wörtliche Wiedergabe mit „ging“, ohne den Ausdruck ausdrücklich als „Wüstenwanderung“ auszudeuten.
- source_word: הִנֵּה
  choice: sieh
  rationale: Die Aufforderung „sieh“ bewahrt die aufmerksamkeitslenkende und nachdrückliche Funktion der Partikel in gegenwärtigem, würdigem Deutsch.
- source_word: אָנֹכִי הַיּוֹם
  choice: Heute bin ich
  rationale: Diese Wortstellung ist natürliches Deutsch und erhält den Nachdruck auf Kalebs gegenwärtigem Alter.
- source_word: בֶּן חָמֵשׁ וּשְׁמוֹנִים שָׁנָה
  choice: fünfundachtzig Jahre alt
  rationale: Die hebräische Altersformel „Sohn von ... Jahren“ wird mit der üblichen deutschen Altersangabe wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Gottesnamen. „Jahwe“ bewahrt ihn als persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Deutung von הַדָּבָר הַזֶּה
  choice: dieses Wort
  alternative: diese Sache; diese Zusage
  rationale: Im Zusammenhang kann das Wort Gottes Zusage an Kaleb meinen; der Ausgangsausdruck benennt jedoch zunächst ein gesprochenes Wort beziehungsweise eine Angelegenheit. Die Übersetzung vermeidet es, die Verheißungsdeutung zwingend in den Haupttext einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. „Sieh“ erhält den rhetorischen Nachdruck von הִנֵּה, ohne auf das stärker altertümliche „siehe“ zurückzugreifen. Der Gedankenstrich gliedert den langen hebräischen Satz, ohne seine Zusammenhänge aufzulösen.
