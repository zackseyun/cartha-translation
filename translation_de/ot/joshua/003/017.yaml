  text: וַ/יַּעַמְד֣וּ הַ/כֹּהֲנִ֡ים נֹ֠שְׂאֵי הָ/אָר֨וֹן בְּרִית יְהוָ֜ה בֶּ/חָֽרָבָ֛ה בְּ/ת֥וֹךְ הַ/יַּרְדֵּ֖ן הָכֵ֑ן וְ/כָל יִשְׂרָאֵ֗ל עֹֽבְרִים֙ בֶּ/חָ֣רָבָ֔ה עַ֤ד אֲשֶׁר תַּ֨מּוּ֙ כָּל הַ/גּ֔וֹי לַ/עֲבֹ֖ר אֶת הַ/יַּרְדֵּֽן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/017.yaml
  text: And the priests carrying the ark of the covenant of Yahweh stood firmly on dry ground in the middle of the Jordan[c][b][a], while all Israel was crossing on dry ground until the whole nation had finished crossing the Jordan.
translation:
  language: de
  text: Und die Priester, die die Bundeslade Jahwes[a] trugen, standen fest[b] auf trockenem Boden mitten im Jordan, während ganz Israel auf trockenem Boden hinüberzog, bis das ganze Volk[c] den Jordan überquert hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „die Lade des Bundes Jahwes“.'
    reason: lexical_alternative
  - marker: b
    text: Das Hebräische betont, dass die Priester fest und unverrückt im Flussbett standen.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „die ganze Nation“; das Hebräische verwendet eine kollektive Einzahl für Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַמְדוּ ... הָכֵן
  choice: blieben ... fest ... stehen
  rationale: Das Verb עמד bezeichnet das Stehen beziehungsweise Verharren an einem Ort; הָכֵן hebt hier die feste, unverrückte Haltung hervor. Die Formulierung gibt sowohl den Eintritt in den Stand als auch das andauernde Verbleiben während des Durchzugs natürlich wieder.
- source_word: הַכֹּהֲנִים נֹשְׂאֵי
  choice: die Priester, die ... trugen
  rationale: Das Partizip נֹשְׂאֵי beschreibt die fortdauernde Tätigkeit der Priester. Der deutsche Relativsatz ist klar und idiomatisch.
- source_word: הָאָרוֹן בְּרִית יְהוָה
  choice: die Bundeslade Jahwes
  rationale: Die kompakte deutsche Zusammensetzung gibt die Lade als Lade des Bundes Jahwes wieder. Eine wörtlichere Auflösung steht in der Fußnote.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben. „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Umschrift, ohne den Namen durch einen Titel zu ersetzen.
- source_word: בֶּחָרָבָה
  choice: auf trockenem Boden
  rationale: Die Wendung bezeichnet den vom Wasser freien, trockenen Grund. Sie wird an beiden Stellen gleich wiedergegeben, um die Wiederholung des Hebräischen zu bewahren.
- source_word: בְּתוֹךְ הַיַּרְדֵּן
  choice: mitten im Jordan
  rationale: בְּתוֹךְ bezeichnet das Innere beziehungsweise die Mitte; „mitten im Jordan“ ist präzise und natürlich.
- source_word: וְכָל יִשְׂרָאֵל עֹבְרִים
  choice: während ganz Israel ... hinüberzog
  rationale: Das Partizip beschreibt einen gleichzeitig andauernden Vorgang. „Während“ macht diesen zeitlichen Zusammenhang im Deutschen deutlich; „ganz Israel“ wahrt die kollektive Bezeichnung.
- source_word: עַד אֲשֶׁר תַּמּוּ
  choice: bis ... überquert hatte
  rationale: Die Wendung bezeichnet den erreichten Abschluss des Vorgangs. Das deutsche Plusquamperfekt markiert diesen Endpunkt im Verhältnis zum Stehen der Priester.
- source_word: כָּל הַגּוֹי
  choice: das ganze Volk
  rationale: גּוֹי bezeichnet Israel hier kollektiv. „Volk“ ist im Kontext natürlicher als „Nation“, ohne die kollektive Einzahl aufzugeben.
- source_word: לַעֲבֹר אֶת הַיַּרְדֵּן
  choice: den Jordan überquert hatte
  rationale: Der Infinitiv bezeichnet die vollendete Überquerung. Die gewählte Formulierung ist idiomatisches modernes Deutsch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ bewahrt dessen Charakter als persönlichen Gottesnamen; die traditionelle Ersatzlesung „der HERR“ bleibt eine mögliche liturgische Konvention, wird hier aber nicht in den Text eingesetzt.
- issue: Beziehung zwischen Lade, Bund und Jahwe
  choice: Bundeslade Jahwes
  alternative: Lade des Bundes Jahwes
  rationale: Die hebräische Wortverbindung bezeichnet die Lade, die zu Jahwes Bund gehört. Die Zusammensetzung ist im Deutschen geläufig, während die Fußnote die formnähere Struktur sichtbar hält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur hält die Gleichzeitigkeit des festen Stehens der Priester und des Durchzugs Israels fest. Die Wiederholung von „auf trockenem Boden“ wurde bewusst beibehalten.
