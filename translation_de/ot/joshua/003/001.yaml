  text: וַ/יַּשְׁכֵּם֩ יְהוֹשֻׁ֨עַ בַּ/בֹּ֜קֶר וַ/יִּסְע֣וּ מֵֽ/הַ/שִּׁטִּ֗ים וַ/יָּבֹ֨אוּ֙ עַד הַ/יַּרְדֵּ֔ן ה֖וּא וְ/כָל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יָּלִ֥נוּ שָׁ֖ם טֶ֥רֶם יַעֲבֹֽרוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/001.yaml
  text: Joshua rose early in the morning[a], and they set out from Shittim and came to the Jordan, he and all the sons of Israel, and they spent the night there before they crossed over.
translation:
  language: de
  text: Josua stand früh am Morgen auf. Er und alle Söhne Israels brachen von Schittim auf, kamen an den Jordan und verbrachten dort die Nacht, bevor sie hinüberzogen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle Israeliten“. Hebräisch: „alle Söhne Israels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: stand früh am Morgen auf
  rationale: Die Hifil-Form von שׁכם bezeichnet gewöhnlich das frühe Aufstehen. Die deutsche Wendung bewahrt sowohl den zeitlichen Nachdruck als auch einen natürlichen Erzählstil.
- source_word: וַיִּסְעוּ
  choice: sie brachen … auf
  rationale: נסע bezeichnet in Reiseerzählungen häufig den Aufbruch eines Lagers. „Aufbrechen“ ist im Deutschen knapp und idiomatisch.
- source_word: מֵהַשִּׁטִּים
  choice: von Schittim
  rationale: Der Ortsname wird transliteriert, statt seine mögliche Bedeutung „Akazien“ zu übersetzen.
- source_word: וַיָּבֹאוּ עַד הַיַּרְדֵּן
  choice: kamen an den Jordan
  rationale: Die Verbindung beschreibt das Erreichen des Jordans; „an den Jordan kommen“ gibt dies natürlich wieder.
- source_word: הוּא וְכָל־בְּנֵי יִשְׂרָאֵל
  choice: er und alle Söhne Israels
  rationale: Das selbstständige Pronomen nimmt Josua ausdrücklich wieder auf. „Söhne Israels“ bildet die hebräische Verwandtschaftsbezeichnung formal ab; die idiomatischere kollektive Wiedergabe steht in der Fußnote.
- source_word: וַיָּלִנוּ
  choice: verbrachten sie die Nacht
  rationale: לון bezeichnet hier das Übernachten. Die gewählte Formulierung ist klar und gegenwärtig.
- source_word: טֶרֶם יַעֲבֹרוּ
  choice: bevor sie hinüberzogen
  rationale: טרם markiert die Vorzeitigkeit; עבר nimmt im Zusammenhang die bevorstehende Überquerung des Jordans auf. „Hinüberzogen“ bewahrt zusätzlich den Gedanken der gemeinschaftlichen Bewegung.
theological_decisions:
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  alternative: Israeliten
  rationale: Die formal transparente Wiedergabe bewahrt die maskuline nationale Verwandtschaftsbezeichnung des Hebräischen, ohne sie stillschweigend zu verallgemeinern. Die im Deutschen natürlichere Kollektivbezeichnung wird als Alternative angegeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit flüssigem Erzählrhythmus. Der Ortsname wird in der etablierten Form „Schittim“ wiedergegeben; die hebräische Satzfolge und die ausdrückliche Wiederaufnahme Josuas durch „er“ bleiben erkennbar.
