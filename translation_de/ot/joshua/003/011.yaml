    rationale: Im Deutschen ist dies keine tragfähige, natürlich verständliche Wiedergabe einer möglichen hebräischen asyndetischen Titelfügung. Sie verändert die Referenz des Titels und ist semantisch missverständlich. Der Genitiv „des Herrn der ganzen Erde“ stellt die im Kontext und in Josua 3,13 erkennbare Beziehung klar, ohne darüber hinauszugehen.
