  text: הִנֵּה֙ אֲר֣וֹן הַ/בְּרִ֔ית אֲד֖וֹן כָּל הָ/אָ֑רֶץ עֹבֵ֥ר לִ/פְנֵי/כֶ֖ם בַּ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/011.yaml
  text: Look[a], the ark of the covenant, the Lord of all the earth, is crossing ahead of you in the Jordan.
translation:
  language: de
  text: Seht, die Bundeslade des Herrn der ganzen Erde zieht vor euch her in den Jordan hinein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „im Jordan“. Das Hebräische lautet wörtlich „im Jordan“; im Zusammenhang der bevorstehenden Überquerung kann die Wendung die Bewegung in den Fluss hinein bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Seht
  rationale: Die Aufmerksamkeitspartikel leitet eine nachdrückliche Aufforderung zum Hinschauen ein. „Seht“ ist gegenwärtig, würdig und weniger altertümlich als „Siehe“.
- source_word: אֲרוֹן הַבְּרִית
  choice: die Bundeslade
  rationale: „Bundeslade“ ist die feste, transparente deutsche Wiedergabe der hebräischen Genitivverbindung „Lade des Bundes“.
- source_word: אֲדוֹן כָּל הָאָרֶץ
  choice: der Herr der ganzen Erde
  rationale: אָדוֹן bezeichnet hier souveräne Herrschaft. „Herr“ bewahrt das Gewicht des Titels und entspricht natürlichem deutschem Bibelstil, ohne zusätzliche Lehraussagen einzutragen.
- source_word: עֹבֵר
  choice: zieht … durch
  rationale: Das Partizip stellt den unmittelbar bevorstehenden beziehungsweise bereits einsetzenden Vorgang anschaulich dar. Im Deutschen gibt „zieht … durch“ die Bewegung der Lade in diesem Zusammenhang natürlich wieder.
- source_word: לִפְנֵיכֶם
  choice: vor euch her
  rationale: Die Wendung bezeichnet eine Bewegung an der Spitze beziehungsweise im Voraus und wird durch „vor euch her“ idiomatisch und eindeutig ausgedrückt.
- source_word: בַּיַּרְדֵּן
  choice: durch den Jordan
  rationale: Die Präposition ב bedeutet formal „in“, bezeichnet mit einem Bewegungsverb hier aber den Bereich, durch den die Überquerung erfolgt. „Durch den Jordan“ ist im Deutschen dynamisch und kontextgerecht; die formalere Alternative wird in der Fußnote genannt.
theological_decisions:
- issue: Bezug von אֲדוֹן כָּל הָאָרֶץ
  choice: 'appositionell: „die Bundeslade, der Herr der ganzen Erde“'
  alternative: „die Bundeslade des Bundes des Herrn der ganzen Erde“ beziehungsweise idiomatisch „die Bundeslade des Herrn der ganzen Erde“
  rationale: Die masoretische Akzentsetzung trennt אֲרוֹן הַבְּרִית von אֲדוֹן כָּל הָאָרֶץ und unterstützt eine markante Apposition. Die dadurch entstehende Spannung zwischen der Lade und der göttlichen Gegenwart wird nicht durch ein ergänztes „des“ stillschweigend aufgelöst.
- issue: Wiedergabe des Herrschertitels אָדוֹן
  choice: Herr
  alternative: Gebieter
  rationale: „Herr“ ist die natürliche deutsche Titelform und bringt die im Kontext betonte universale Souveränität zum Ausdruck, ohne konfessionelle Zusätze.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die ungewöhnliche appositionelle Formulierung wird bewusst bewahrt, da sie von der masoretischen Gliederung gestützt wird und die enge Verbindung zwischen Bundeslade und göttlicher Gegenwart nicht erklärend auflöst.
