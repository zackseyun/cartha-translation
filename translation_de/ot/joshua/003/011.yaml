  source_fidelity: Die appositionelle Fassung „die Bundeslade, der Herr der ganzen Erde“ gibt die hebräische Wortfolge zwar äußerlich wieder, erzeugt im Deutschen jedoch die sachlich irreführende Gleichsetzung von Bundeslade und Herrn. אֲדוֹן כָּל־הָאָרֶץ bestimmt die Bundeslade als deren Herr; die im Hebräischen mögliche asyndetische bzw. appositionelle Anbindung ist im Deutschen angemessen als Genitivbeziehung wiederzugeben. Für בַּיַּרְדֵּן ist „in den Jordan hinein“ im unmittelbaren Kontext der bevorstehenden Flussquerung eine natürliche dynamische Wiedergabe; „im Jordan“ bleibt als formnähere Alternative möglich.
  naturalness: „Seht“ und „vor euch her“ sind modernes, würdiges Standarddeutsch. Die Genitivverbindung „Bundeslade des Herrn der ganzen Erde“ ist klar und idiomatisch. „Zieht … in den Jordan hinein“ beschreibt die unmittelbar einsetzende Bewegung verständlich.
  terminology: „Bundeslade“ ist die etablierte deutsche Bezeichnung für אֲרוֹן הַבְּרִית. „Herr der ganzen Erde“ gibt den Hoheitstitel אֲדוֹן כָּל־הָאָרֶץ angemessen wieder, ohne zusätzliche dogmatische Aussagen. Der Gottesname wird im Ausgangstext hier nicht verwendet und daher nicht ergänzt.
  issues:
