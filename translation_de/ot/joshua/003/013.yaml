source:
  edition: WLC
  text: וְ/הָיָ֡ה כְּ/נ֣וֹחַ כַּפּ֣וֹת רַגְלֵ֣י הַ/כֹּהֲנִ֡ים נֹשְׂאֵי֩ אֲר֨וֹן יְהוָ֜ה אֲד֤וֹן כָּל הָ/אָ֨רֶץ֙ בְּ/מֵ֣י הַ/יַּרְדֵּ֔ן מֵ֤י הַ/יַּרְדֵּן֙ יִכָּ֣רֵת֔וּ/ן הַ/מַּ֥יִם הַ/יֹּרְדִ֖ים מִ/לְ/מָ֑עְלָ/ה וְ/יַעַמְד֖וּ נֵ֥ד אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/013.yaml
  text: And when the soles of the feet of the priests carrying the ark of Yahweh[a], the Lord of all the earth, come to rest in the waters of the Jordan, the waters flowing down from above will be cut off in the Jordan[b], and they will stand in one heap.
translation:
  language: de
  text: Und wenn die Fußsohlen der Priester, die die Lade Jahwes[a], des Herrn der ganzen Erde, tragen, im Wasser des Jordan zur Ruhe kommen, wird im Jordan das von oben herabfließende Wasser[b] abgeschnitten werden und als ein einziger Wall stehen bleiben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Lade Jahwes, des Herrn der ganzen Erde“; im Hebräischen kann der Titel „Herr der ganzen Erde“ enger mit „Lade“ verbunden gelesen werden.'
    reason: alternative_reading
  - marker: b
    text: 'Oder sinngemäß: „das Wasser, das von flussaufwärts herabkommt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כְּנוֹחַ
  choice: Und sobald … zur Ruhe kommen
  rationale: Die Konstruktion leitet den erwarteten Zeitpunkt ein; „sobald“ gibt die unmittelbare zeitliche Verknüpfung natürlich wieder, während „zur Ruhe kommen“ die konkrete Bedeutung von נוח bewahrt.
- source_word: כַּפּוֹת רַגְלֵי
  choice: die Fußsohlen
  rationale: כַּף bezeichnet hier die Unterseite des Fußes. „Fußsohlen“ ist präzise und im Deutschen idiomatisch.
- source_word: הַכֹּהֲנִים נֹשְׂאֵי אֲרוֹן
  choice: der Priester, die die Lade … tragen
  rationale: Das Partizip נֹשְׂאֵי kennzeichnet die Priester als Träger der Lade; ein Relativsatz klingt im modernen Deutschen natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֲדוֹן כָּל הָאָרֶץ
  choice: des Herrn der ganzen Erde
  rationale: Die Wendung ist als appositioneller Titel zu „Jahwe“ verstanden. „Herr“ wahrt den Titelcharakter von אֲדוֹן.
- source_word: בְּמֵי הַיַּרְדֵּן
  choice: im Wasser des Jordan
  rationale: בְּ bezeichnet hier den Kontakt beziehungsweise das Ruhen im Flusswasser. Der kollektive Singular „Wasser“ ist im Deutschen natürlicher als „Wasser des Jordan“ im Plural.
- source_word: מֵי הַיַּרְדֵּן יִכָּרֵתוּן
  choice: wird im Jordan … das Wasser abgeschnitten werden
  rationale: Die Ortsangabe „im Jordan“ bewahrt מֵי הַיַּרְדֵּן, ohne im Deutschen eine schwerfällige Wiederholung zu erzeugen. Das Passiv „abgeschnitten werden“ erhält das kräftige Bild des Niphal von כרת.
- source_word: הַמַּיִם הַיֹּרְדִים מִלְמָעְלָה
  choice: das von oben herabfließende Wasser
  rationale: Die Formulierung bleibt nahe am räumlichen Bild des Hebräischen; die kontextuelle Bedeutung „von flussaufwärts“ wird in einer Fußnote genannt.
- source_word: וְיַעַמְדוּ נֵד אֶחָד
  choice: und sich zu einem einzigen Wall auftürmen
  rationale: נֵד bezeichnet eine aufgestaute beziehungsweise aufgetürmte Wassermasse. „Wall“ passt zum Wasserbild besser als „Haufen“; „auftürmen“ gibt das übernatürliche Stehen der Wassermasse verständlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen. „Jahwe“ bewahrt ihn, statt ihn durch den Titel „HERR“ zu ersetzen.
- issue: Syntaktische Zuordnung von אֲדוֹן כָּל הָאָרֶץ
  choice: 'Apposition zu Jahwe: „Jahwes, des Herrn der ganzen Erde“'
  alternative: 'Genitivverbindung: „die Lade Jahwes, des Herrn der ganzen Erde“ beziehungsweise enger „die Lade des Herrn der ganzen Erde“'
  rationale: Die Wortfolge lässt eine enge Verbindung des Titels mit „Lade“ zu. Im Haupttext wird der Titel jedoch als Bezeichnung Jahwes aufgefasst; die echte syntaktische Mehrdeutigkeit bleibt durch Fußnote [a] sichtbar.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Satzbau folgt der hebräischen zeitlichen Abfolge, vermeidet aber unnötig starre Wiederholungen. „Wall“ macht das Bild einer aufrecht stehenden, aufgestauten Wassermasse verständlich; die alternative räumliche Deutung von „von oben“ wird ausdrücklich dokumentiert.
