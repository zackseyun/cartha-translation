    issue: „Sobald“ gegenüber כְּנוֹחַ
    rationale: Die hebräische Konstruktion ist temporal („wenn/bei dem Zur-Ruhe-Kommen“). Ein unmittelbarer Eintritt kann kontextuell naheliegen, wird aber durch „sobald“ stärker expliziert als im Ausgangstext.
  - severity: medium
    issue: „sich zu einem einzigen Wall auftürmen“ für וְיַעַמְדוּ נֵד אֶחָד
    rationale: Das hebräische Verb bezeichnet das Stehen bzw. Stehenbleiben der Wasser; die reflexiv-dynamische Formulierung verschiebt das Bild zur Bildung eines Walls. „Als ein einziger Wall stehen bleiben“ erhält das Verb und die Bildsprache.
  - severity: medium
    issue: Fußnote [a] ist syntaktisch missglückt und erklärt die Alternative unklar
    rationale: Der gegenwärtige Wortlaut setzt ein Zitat vor ein Prädikat und ersetzt in der angeblichen engeren Lesart zudem „Jahwe“ durch „Herr“. Die Anmerkung sollte lediglich die mögliche engere Verknüpfung des Titels mit „Lade“ benennen.
  revised_text: Und wenn die Fußsohlen der Priester, die die Lade Jahwes[a], des Herrn der ganzen Erde, tragen, im Wasser des Jordan zur Ruhe kommen, wird im Jordan das von oben herabfließende Wasser[b] abgeschnitten werden und als ein einziger Wall stehen bleiben.
