  terminology: „Bundeslade“, „Jahwe“ und „levitische Priester“ sind sachgerecht und konsistent. Die Fußnote bewahrt die formal nähere appositionelle Lesemöglichkeit von הַכֹּהֲנִים הַלְוִיִּם, ohne die deutsche Hauptfassung unnötig zu verhärten.
