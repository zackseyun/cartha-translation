  text: וַ/יְצַוּוּ֮ אֶת הָ/עָ֣ם לֵ/אמֹר֒ כִּ/רְאֽוֹתְ/כֶ֗ם אֵ֣ת אֲר֤וֹן בְּרִית יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם וְ/הַ/כֹּֽהֲנִים֙ הַ/לְוִיִּ֔ם נֹשְׂאִ֖ים אֹת֑/וֹ וְ/אַתֶּ֗ם תִּסְעוּ֙ מִ/מְּק֣וֹמְ/כֶ֔ם וַ/הֲלַכְתֶּ֖ם אַחֲרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/003.yaml
  text: And they commanded the people[a], saying, “When you see the ark of the covenant of Yahweh your God, and the Levitical priests carrying it, then you shall set out from your place and go after it.”
translation:
  language: de
  text: 'Sie befahlen dem Volk: „Wenn ihr die Bundeslade Jahwes, eures Gottes, seht und die levitischen Priester[a], die sie tragen, dann brecht von eurem Platz auf und folgt ihr.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Priester, die Leviten“.'
    reason: Lexikalisch-syntaktische Alternative für die appositionelle Wortgruppe הַכֹּהֲנִים הַלְוִיִּם.
lexical_decisions:
- source_word: וַיְצַוּוּ
  choice: Sie befahlen
  rationale: Das Piel von צוה bezeichnet hier einen verbindlichen Befehl; „befahlen“ bewahrt dessen autoritativen Charakter.
- source_word: כִּרְאוֹתְכֶם
  choice: Wenn ihr … seht
  rationale: כ mit Infinitivus constructus und Suffix ist temporal gebraucht; „wenn“ gibt dies natürlich wieder, ohne besondere Unmittelbarkeit hinzuzufügen.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: die Bundeslade Jahwes
  rationale: „Bundeslade“ ist die im Deutschen geläufige, prägnante Bezeichnung für אֲרוֹן בְּרִית; der folgende Gottesname wird als Genitivattribut angeschlossen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird in der üblichen deutschen Form „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: die levitischen Priester
  rationale: Die attributive Wiedergabe versteht die Leviten als nähere Bestimmung der Priester und ist in modernem Deutsch klar; die appositionelle Alternative bleibt in der Fußnote erhalten.
- source_word: נֹשְׂאִים אֹתוֹ
  choice: die sie tragen
  rationale: Das Partizip beschreibt die Priester beim Tragen der Lade; der Relativsatz ist im Deutschen natürlich und hält den Bezug eindeutig.
- source_word: תִּסְעוּ מִמְּקוֹמְכֶם
  choice: brecht von eurem Platz auf
  rationale: נסע bezeichnet hier das Aufbrechen zur Weiterreise; „von eurem Platz“ wahrt die Breite von מקום, ohne ausdrücklich ein Lager vorauszusetzen.
- source_word: וַהֲלַכְתֶּם אַחֲרָיו
  choice: und folgt ihr
  rationale: הלך אחרי bezeichnet räumlich das Hinterhergehen beziehungsweise Folgen; „folgt ihr“ ist die natürliche deutsche Entsprechung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm; „Jahwe“ bewahrt den persönlichen Bundesnamen, statt ihn durch den traditionellen Ersatztitel wiederzugeben.
- issue: Verhältnis von הַכֹּהֲנִים und הַלְוִיִּם
  choice: die levitischen Priester
  alternative: die Priester, die Leviten
  rationale: Die gewählte Fassung versteht „die Leviten“ als nähere Identifikation der Priester und vermeidet den Eindruck zweier Gruppen. Da die hebräische Apposition formal auch enger nachgebildet werden kann, wird diese Möglichkeit in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede wird ohne das im Deutschen entbehrliche formelhafte „indem sie sagten“ eingeleitet. „Bundeslade“, „aufbrechen“ und „folgen“ sind geläufig, ohne den kultischen und erzählerischen Ton zu verflachen.
