  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des hebräischen Textes wieder: den Befehl an das Volk, die zeitliche Bedingung, die Bundeslade Jahwes als „eures Gottes“, die levitischen Priester als Träger der Lade sowie das Aufbrechen und Folgen. „Folgt ihr“ wahrt den Bezug auf die feminine „Bundeslade“ und gibt הלך אחרי idiomatisch wieder.'
