  text: וְ/אַתָּ֗ה תְּצַוֶּה֙ אֶת הַ/כֹּ֣הֲנִ֔ים נֹשְׂאֵ֥י אֲרֽוֹן הַ/בְּרִ֖ית לֵ/אמֹ֑ר כְּ/בֹאֲ/כֶ֗ם עַד קְצֵה֙ מֵ֣י הַ/יַּרְדֵּ֔ן בַּ/יַּרְדֵּ֖ן תַּעֲמֹֽדוּ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/008.yaml
  text: And you shall command the priests who carry the ark of the covenant[a], saying, ‘When you come to the edge of the waters of the Jordan, you shall stand in the Jordan.’
translation:
  language: de
  text: 'Und du sollst den Priestern, die die Bundeslade tragen, befehlen: »Wenn ihr bis an den Rand des Jordanwassers kommt, sollt ihr im Jordan stehen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַתָּה
  choice: Und du
  rationale: Die Konjunktion führt die Rede fort, während das ausdrückliche Pronomen Josua als Adressaten hervorhebt.
- source_word: תְּצַוֶּה
  choice: sollst … befehlen
  rationale: Das Piel-Imperfekt bezeichnet hier den Auftrag, den Josua den Priestern erteilen soll; die deutsche Konstruktion gibt den direktiven Sinn natürlich wieder.
- source_word: הַכֹּהֲנִים נֹשְׂאֵי
  choice: den Priestern, die … tragen
  rationale: Das Partizip נֹשְׂאֵי bestimmt die Priester näher und wird im Deutschen idiomatisch durch einen Relativsatz wiedergegeben.
- source_word: אֲרוֹן הַבְּרִית
  choice: die Bundeslade
  rationale: „Bundeslade“ ist die geläufige und präzise deutsche Wiedergabe der hebräischen Genitivverbindung.
- source_word: לֵאמֹר
  choice: Doppelpunkt mit direkter Rede
  rationale: Die hebräische Einleitungsformel wird im Deutschen natürlicher durch einen Doppelpunkt und die unmittelbar folgende wörtliche Rede ausgedrückt.
- source_word: כְּבֹאֲכֶם עַד קְצֵה מֵי הַיַּרְדֵּן
  choice: Wenn ihr bis an den Rand des Jordanwassers kommt
  rationale: כְּ mit Infinitiv hat temporalen Sinn; עַד bezeichnet das Erreichen einer Grenze, und קְצֵה מֵי bewahrt das Bild vom Rand des Wassers.
- source_word: בַּיַּרְדֵּן
  choice: im Jordan
  rationale: Die Präposition ב bezeichnet hier den Ort; die knappe Form entspricht dem Hebräischen und ist im Kontext eindeutig.
- source_word: תַּעֲמֹדוּ
  choice: sollt ihr … stehen bleiben
  rationale: עמד kann sowohl das Stehen als auch das Anhalten beziehungsweise Einnehmen einer festen Position bezeichnen. „Stehen bleiben“ verbindet beide Aspekte passend zum Kontext.
