  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוֹשֻׁ֖עַ אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל גֹּ֣שׁוּ הֵ֔נָּה וְ/שִׁמְע֕וּ אֶת דִּבְרֵ֖י יְהוָ֥ה אֱלֹֽהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/009.yaml
  text: Joshua said to the sons of Israel[a], “Come here and hear the words of Yahweh your God.”
translation:
  language: de
  text: 'Josua sagte zu den Söhnen Israels[a]: »Kommt her und hört die Worte Jahwes, eures Gottes!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Kindern Israels« beziehungsweise »den Israeliten«. Wörtlich lautet die hebräische Wendung »den Söhnen Israels«; sie kann das Volk Israel insgesamt bezeichnen.'
    reason: lexikalische Alternative und Erläuterung einer konventionellen Volksbezeichnung
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: Das narrative Wayyiqtol von אמר leitet hier direkte Rede ein; »sagte« ist im modernen Deutschen die natürliche Entsprechung.
- source_word: יְהוֹשֻׁעַ
  choice: Josua
  rationale: Der Personenname wird in seiner im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: zu den Söhnen Israels
  rationale: אֶל bezeichnet die Angesprochenen. בְּנֵי יִשְׂרָאֵל lautet wörtlich »Söhne Israels« und ist zugleich eine herkömmliche Volksbezeichnung; die formale Wendung bleibt im Haupttext erhalten, während idiomatische Alternativen in der Fußnote stehen.
- source_word: גֹּשׁוּ הֵנָּה
  choice: Kommt her
  rationale: Der Pluralimperativ von נגשׁ fordert zum Näherkommen auf; הֵנָּה bezeichnet die Richtung zum Sprecher hin. »Kommt her« gibt beides knapp und idiomatisch wieder.
- source_word: וְשִׁמְעוּ
  choice: und hört
  rationale: Der Pluralimperativ von שׁמע kann sowohl das Hören als auch das aufmerksame Zuhören bezeichnen. »Hört« bewahrt die direkte Formulierung und lässt diese Bedeutungsbreite bestehen.
- source_word: אֵת דִּבְרֵי
  choice: die Worte
  rationale: דִּבְרֵי ist die Konstruktform im Plural und bedeutet hier »die Worte«. »Botschaft« wäre stärker deutend.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname in der im Deutschen üblichen Form »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵיכֶם
  choice: eures Gottes
  rationale: Das Suffix der zweiten Person maskulin Plural bedeutet »euer«. אֱלֹהִים bezeichnet in der Verbindung mit Jahwe den einen Gott Israels und wird daher im Singular wiedergegeben; der Genitiv fügt sich natürlich an »Jahwes« an.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. Die Wiedergabe als »Jahwe« wahrt den Charakter als persönlicher Gottesname, ohne ihn durch den Titel »der HERR« zu ersetzen.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Kinder Israels; die Israeliten
  rationale: Die wörtliche maskuline Form wird beibehalten, zugleich aber durch die Fußnote als konventionelle Bezeichnung des Volkes kenntlich gemacht. So wird weder die Form des Hebräischen verdeckt noch behauptet, dass ausschließlich männliche Personen gemeint seien.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist knapp und mündlich natürlich; »Worte Jahwes« bewahrt die konkrete Ausdrucksweise des Hebräischen. Das Ausrufezeichen gibt den Aufforderungscharakter der beiden Imperative wieder.
