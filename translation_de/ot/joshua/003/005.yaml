  text: וַ/יֹּ֧אמֶר יְהוֹשֻׁ֛עַ אֶל הָ/עָ֖ם הִתְקַדָּ֑שׁוּ כִּ֣י מָחָ֗ר יַעֲשֶׂ֧ה יְהוָ֛ה בְּ/קִרְבְּ/כֶ֖ם נִפְלָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/005.yaml
  text: Then Joshua said to the people, “Consecrate yourselves, because tomorrow the LORD will do wonders among you.”
translation:
  language: de
  text: 'Da sagte Josua zum Volk: „Heiligt euch, denn morgen wird der HERR in eurer Mitte Wunder tun.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִתְקַדָּשׁוּ
  choice: Heiligt euch
  rationale: Der reflexive Hitpael-Imperativ bezeichnet, dass sich das Volk für die bevorstehende Begegnung mit Gottes machtvollem Handeln bereit und heilig halten soll. „Heiligt euch“ bewahrt den kultisch-theologischen Gehalt knapp und würdig.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion begründet die Aufforderung mit dem angekündigten Handeln des HERRN; „denn“ gibt diesen Zusammenhang natürlich wieder.
- source_word: יְהוָה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens mit „HERR“ in Kapitälchen entspricht dem üblichen Bibelregister und kennzeichnet den Eigennamen.
- source_word: בְּקִרְבְּכֶם
  choice: in eurer Mitte
  rationale: Die Wendung bezeichnet Gottes Handeln innerhalb der versammelten Gemeinschaft. „In eurer Mitte“ bildet die räumliche und gemeinschaftliche Nuance genauer ab als das ebenfalls mögliche „unter euch“.
- source_word: נִפְלָאוֹת
  choice: Wunder
  rationale: Das Substantiv bezeichnet außergewöhnliche, staunenerregende Machttaten Gottes; „Wunder“ ist die klare und etablierte deutsche Entsprechung.
theological_decisions:
- issue: Bedeutung der Selbstheiligung
  choice: Heiligt euch
  alternative: Bereitet euch vor / Weiht euch
  rationale: Die Übersetzung erhält den ausdrücklichen Heiligkeitsbegriff des hebräischen Textes, ohne die konkrete Form der Vorbereitung näher festzulegen, die der Vers selbst nicht erläutert.
- issue: Darstellung des Gottesnamens
  choice: der HERR
  alternative: JHWH / Jahwe
  rationale: „Der HERR“ folgt der vertrauten deutschen Bibelkonvention, ohne eine unsichere Rekonstruktion der Aussprache als sicher auszugeben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Orientierung an Satzbau und Aussage des Hebräischen. Die direkte Rede bleibt knapp und feierlich; archaische oder erklärende Zusätze wurden vermieden.
