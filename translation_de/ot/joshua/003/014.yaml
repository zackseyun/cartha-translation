  text: וַ/יְהִ֗י בִּ/נְסֹ֤עַ הָ/עָם֙ מֵ/אָ֣הֳלֵי/הֶ֔ם לַ/עֲבֹ֖ר אֶת הַ/יַּרְדֵּ֑ן וְ/הַ/כֹּהֲנִ֗ים נֹֽשְׂאֵ֛י הָ/אָר֥וֹן הַ/בְּרִ֖ית לִ/פְנֵ֥י הָ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/014.yaml
  text: And it happened[a], when the people set out from their tents to cross the Jordan, and the priests carrying the ark of the covenant were before the people,
translation:
  language: de
  text: Und es geschah, als das Volk aus seinen Zelten aufbrach, um den Jordan zu überqueren, und die Priester, die die Bundeslade trugen, vor dem Volk hergingen[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem Volk vorausgingen“.'
    reason: לִפְנֵי kann sowohl wörtlich-räumlich „vor“ als auch idiomatisch „voraus“ wiedergegeben werden.
lexical_decisions:
- source_word: וַיְהִי
  choice: Und es geschah
  rationale: Die narrative Form von היה leitet das folgende Geschehen ein. Die Wendung wahrt die hebräische Erzählstruktur und den Anschluss an den nächsten Vers.
- source_word: בִּנְסֹעַ הָעָם
  choice: als das Volk ... aufbrach
  rationale: ב mit dem Infinitiv constructus bezeichnet den zeitlichen Begleitumstand; נסע meint hier das Aufbrechen vom Lager.
- source_word: מֵאָהֳלֵיהֶם
  choice: aus seinen Zelten
  rationale: אהל bezeichnet konkret ein Zelt. Das kollektive Singularpronomen bei „Volk“ entspricht natürlichem modernem Deutsch.
- source_word: לַעֲבֹר אֶת הַיַּרְדֵּן
  choice: um den Jordan zu überqueren
  rationale: Der Infinitiv drückt hier den Zweck aus; „überqueren“ ist im Zusammenhang mit einem Fluss klar und idiomatisch.
- source_word: וְהַכֹּהֲנִים נֹשְׂאֵי
  choice: und die Priester, die ... trugen
  rationale: Die hebräische Bezeichnung „die Priester, Träger von ...“ wird als natürlicher deutscher Relativsatz wiedergegeben, ohne die handelnden Personen oder ihre Funktion zu verändern.
- source_word: הָאָרוֹן הַבְּרִית
  choice: die Bundeslade
  rationale: „Bundeslade“ ist die geläufige und sachlich passende deutsche Bezeichnung für die Lade des Bundes.
- source_word: לִפְנֵי הָעָם
  choice: vor dem Volk hergingen
  rationale: לִפְנֵי bezeichnet die räumliche Stellung an der Spitze beziehungsweise vor dem Volk. Das Verb „hergingen“ macht die im Hebräischen nominal formulierte Begleitsituation im Deutschen verständlich.
