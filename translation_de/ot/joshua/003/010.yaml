  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und den Sinn des Hebräischen zuverlässig wieder: בְּזֹאת ist idiomatisch als „Daran“ erfasst, תֵּדְעוּן als zukunftsbezogenes „werdet ihr erkennen“, und אֵל חַי als „der lebendige Gott“. „Mitten unter euch“ trifft בְּקִרְבְּכֶם. Die verstärkende Verbindung הוֹרֵשׁ יוֹרִישׁ wird angemessen durch „ganz gewiss … vertreiben“ wiedergegeben. Die pluralischen deutschen Ethnonyme entsprechen dem kollektiv-singularischen hebräischen Völkerverzeichnis.'
