  text: וַ/יֹּ֣אמֶר יְהוֹשֻׁ֔עַ בְּ/זֹאת֙ תֵּֽדְע֔וּ/ן כִּ֛י אֵ֥ל חַ֖י בְּ/קִרְבְּ/כֶ֑ם וְ/הוֹרֵ֣שׁ יוֹרִ֣ישׁ מִ֠/פְּנֵי/כֶם אֶת הַ/כְּנַעֲנִ֨י וְ/אֶת הַ/חִתִּ֜י וְ/אֶת הַ/חִוִּ֗י וְ/אֶת הַ/פְּרִזִּי֙ וְ/אֶת הַ/גִּרְגָּשִׁ֔י וְ/הָ/אֱמֹרִ֖י וְ/הַ/יְבוּסִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/010.yaml
  text: And Joshua said[a], “By this you will know that the living God is among you, and that he will surely drive out from before you the Canaanites, the Hittites, the Hivites, the Perizzites, the Girgashites, the Amorites, and the Jebusites.”
translation:
  language: de
  text: 'Und Josua sagte: „Daran werdet ihr erkennen, dass der lebendige Gott mitten unter euch ist und dass er die Kanaaniter, Hetiter, Hiwiter, Perisiter, Girgaschiter, Amoriter und Jebusiter ganz gewiss vor euch vertreiben[a] wird.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus ihrem Besitz verdrängen“. Das hebräische Verb betont ihre gewisse Entfernung aus dem Land.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und Josua sagte
  rationale: Das narrative Wayyiqtol führt Josuas Rede ein. „Und“ bewahrt den hebräischen Erzählfluss; „sagte“ ist modernes, natürliches Standarddeutsch.
- source_word: בְּזֹאת
  choice: Daran
  rationale: Die Wendung bezeichnet das bevorstehende Geschehen als Erkennungszeichen. „Daran“ gibt den instrumentalen Sinn im Deutschen idiomatisch wieder.
- source_word: תֵּדְעוּן
  choice: werdet ihr erkennen
  rationale: Das Imperfekt der 2. Person Plural hat hier Zukunftsbedeutung. „Erkennen“ passt zu einem Zeichen, an dem sich Gottes Gegenwart erweist.
- source_word: אֵל חַי
  choice: der lebendige Gott
  rationale: Die feste, qualitativ bestimmte Wendung bezeichnet Gott als den Lebenden und steht unausgesprochen im Gegensatz zu machtlosen Göttern, ohne diesen Gegensatz auszuformulieren.
- source_word: בְּקִרְבְּכֶם
  choice: mitten unter euch
  rationale: Gemeint ist Gottes Gegenwart inmitten des Volkes, nicht ein innerliches Wohnen in Einzelnen.
- source_word: וְהוֹרֵשׁ יוֹרִישׁ
  choice: ganz gewiss … vertreiben
  rationale: Infinitivus absolutus und finite Verbform derselben Wurzel verstärken die Gewissheit der angekündigten Entfernung. „Vertreiben“ ist gegenwärtiges, verständliches Deutsch; „ganz gewiss“ bewahrt die Emphase.
- source_word: מִפְּנֵיכֶם
  choice: vor euch
  rationale: Die räumliche Wendung bedeutet, dass die genannten Völker aus Israels Weg beziehungsweise Gegenwart entfernt werden.
- source_word: הַכְּנַעֲנִי … הַיְבוּסִי
  choice: die Kanaaniter … und Jebusiter
  rationale: Die morphologisch singularischen Volksbezeichnungen werden im Deutschen idiomatisch als pluralische Ethnonyme wiedergegeben.
theological_decisions:
- issue: Bezeichnung Gottes in אֵל חַי
  choice: der lebendige Gott
  alternative: ein lebendiger Gott; der lebende Gott
  rationale: Der Vers verwendet אֵל und nicht den Gottesnamen יהוה. Die bestimmte deutsche Wendung gibt die im Kontext eindeutig auf Israels Gott bezogene, qualitative Aussage natürlich wieder, ohne den Gottesnamen in den Text einzutragen.
- issue: Wiedergabe der angekündigten Entfernung der Völker
  choice: ganz gewiss … vertreiben
  alternative: ganz gewiss enteignen; vollständig aus ihrem Besitz verdrängen
  rationale: Die Übersetzung bewahrt sowohl die nachdrückliche Gewissheit als auch die Härte der angekündigten Entfernung, ohne sie abzuschwächen oder theologisch zu rechtfertigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, wird jedoch durch „Daran“ und die Stellung von „ganz gewiss“ natürlich lesbar. Die traditionellen deutschen Schreibungen der Volksnamen werden verwendet.
