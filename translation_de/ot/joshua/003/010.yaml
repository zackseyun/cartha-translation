  terminology: „Josua“, „der lebendige Gott“ sowie die traditionellen Ethnonyme Kanaaniter, Hetiter, Hiwiter, Perisiter, Girgaschiter, Amoriter und Jebusiter sind konsistent und sachgerecht. Die Fußnote bietet eine tragfähige lexikalische Alternative, ohne die Härte der angekündigten Entfernung abzuschwächen.
