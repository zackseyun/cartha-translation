  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל יְהוֹשֻׁ֔עַ הַ/יּ֣וֹם הַ/זֶּ֗ה אָחֵל֙ גַּדֶּלְ/ךָ֔ בְּ/עֵינֵ֖י כָּל יִשְׂרָאֵ֑ל אֲשֶׁר֙ יֵֽדְע֔וּ/ן כִּ֗י כַּ/אֲשֶׁ֥ר הָיִ֛יתִי עִם מֹשֶׁ֖ה אֶהְיֶ֥ה עִמָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/007.yaml
  text: And Yahweh said to Joshua[a], “Today I will begin to make you great in the sight of all Israel, so that they may know that just as I was with Moses, I will be with you.”
translation:
  language: de
  text: 'Jahwe sagte zu Josua: »Heute werde ich beginnen, dich in den Augen ganz Israels groß zu machen[a], damit sie erkennen: So wie ich mit Mose war, werde ich mit dir sein.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dich vor ganz Israel zu erhöhen«.'
    reason: Lexikalische Alternative für גַּדֶּלְךָ; die Präpositionalformulierung gibt die öffentliche Dimension von בְּעֵינֵי כָּל־יִשְׂרָאֵל idiomatisch wieder.
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel »der HERR« ersetzt.
- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: Die gewöhnliche hebräische Erzählform von אמר wird im modernen deutschen Erzählstil natürlich mit »sagte« wiedergegeben.
- source_word: הַיּוֹם הַזֶּה
  choice: Heute
  rationale: Die wörtliche Wendung »an diesem Tag« bezeichnet hier den gegenwärtigen Tag; »Heute« ist prägnant und natürlich.
- source_word: אָחֵל
  choice: werde ich beginnen
  rationale: Die Hifil-Form bedeutet in dieser Verbindung »beginnen«; der Kontext legt eine unmittelbar einsetzende zukünftige Handlung nahe.
- source_word: גַּדֶּלְךָ
  choice: dich … groß zu machen
  rationale: Das Piel von גדל bezeichnet hier die öffentliche Erhöhung von Josuas Ansehen; die Formulierung bewahrt das Bild des hebräischen Ausdrucks.
- source_word: בְּעֵינֵי כָּל יִשְׂרָאֵל
  choice: vor den Augen ganz Israels
  rationale: Die hebräische Redewendung bezeichnet die sichtbare öffentliche Wahrnehmung durch das gesamte Volk.
- source_word: אֲשֶׁר יֵדְעוּן
  choice: damit sie erkennen
  rationale: Der Satz kann Folge oder Absicht ausdrücken; »damit« gibt diese offene Zweck-Folge-Beziehung im Deutschen angemessen wieder.
- source_word: כַּאֲשֶׁר הָיִיתִי עִם מֹשֶׁה
  choice: So wie ich mit Mose war
  rationale: כַּאֲשֶׁר stellt einen ausdrücklichen Vergleich zwischen Gottes Beistand für Mose und für Josua her.
- source_word: אֶהְיֶה עִמָּךְ
  choice: werde ich mit dir sein
  rationale: Die Form wird als klare Zusage der künftigen göttlichen Gegenwart wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. »Jahwe« bewahrt es als persönlichen Gottesnamen, ohne es durch einen Titel zu ersetzen.
- issue: Art der Erhöhung Josuas
  choice: dich vor den Augen ganz Israels groß zu machen
  alternative: dich vor ganz Israel zu erhöhen
  rationale: Die Übersetzung lässt den öffentlichen Charakter der göttlichen Bestätigung erkennen, ohne genauer festzulegen, worin Josuas Größe besteht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung folgt dem hebräischen Vergleich, bleibt aber flüssig; der Doppelpunkt vor der Zusage hebt den Erkenntnisinhalt klar hervor.
