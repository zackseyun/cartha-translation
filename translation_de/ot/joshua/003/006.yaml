  source_fidelity: 'Die Übersetzung gibt die Abfolge und den Inhalt des hebräischen Textes zuverlässig wieder: Josua spricht zu den Priestern, befiehlt das Aufnehmen der Bundeslade und das Hinübergehen vor dem Volk; anschließend wird der Gehorsam berichtet. Die Wiederholung von »hebt ... auf« / »hoben ... auf« bildet die Wiederholung von נשא angemessen ab. »Vor dem Volk« beziehungsweise »vor dem Volk her« entspricht לִפְנֵי הָעָם.'
