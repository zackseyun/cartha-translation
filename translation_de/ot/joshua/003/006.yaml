base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/006.yaml
  text: Then Joshua said to the priests, “Take up the ark of the covenant and cross over before the people.” So they took up the ark of the covenant and went before the people.
translation:
  language: de
  text: 'Dann sagte Josua zu den Priestern: »Hebt die Bundeslade auf und zieht vor dem Volk hinüber.« Da hoben sie die Bundeslade auf und gingen vor dem Volk her.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Dann sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter. »Dann sagte« gibt die zeitliche Abfolge in natürlichem deutschem Erzählstil wieder.
- source_word: יְהוֹשֻׁעַ
  choice: Josua
  rationale: Die im Deutschen etablierte Form des hebräischen Personennamens.
- source_word: הַכֹּהֲנִים
  choice: den Priestern
  rationale: Direkte Wiedergabe der bestimmten Pluralform für die kultischen Amtsträger Israels.
- source_word: שְׂאוּ
  choice: Hebt ... auf
  rationale: נשא bezeichnet hier das Aufheben und anschließende Tragen der Lade. »Hebt ... auf« bewahrt die konkrete Handlung und entspricht dem wiederholten Verb im folgenden Bericht.
- source_word: אֲרוֹן הַבְּרִית
  choice: die Bundeslade
  rationale: »Bundeslade« ist die geläufige, knappe und sachlich genaue deutsche Wiedergabe der Verbindung »Lade des Bundes«.
- source_word: וְעִבְרוּ
  choice: und zieht ... hinüber
  rationale: עבר bezeichnet im Kontext den Übergang über den Jordan. »Hinüberziehen« ist idiomatisch und passt zur Bewegung einer geordneten Gemeinschaft, ohne das Ziel ausdrücklich hinzuzufügen.
- source_word: לִפְנֵי הָעָם
  choice: vor dem Volk / vor dem Volk her
  rationale: Die Wendung bezeichnet die Position an der Spitze beziehungsweise vor dem Volk. Beim Bewegungsverb macht »vor dem Volk her« diese räumliche Beziehung im Deutschen natürlich deutlich.
- source_word: וַיִּשְׂאוּ
  choice: Da hoben sie ... auf
  rationale: Die Wiederholung von »aufheben« wahrt die Entsprechung zwischen Befehl und Gehorsam im hebräischen Text.
- source_word: וַיֵּלְכוּ
  choice: gingen
  rationale: הלך ist das gewöhnliche Verb für Gehen; »gingen« gibt es ohne zusätzliche Deutung wieder.
theological_decisions:
- issue: Wiedergabe der Bundesterminologie im kultischen Zusammenhang
  choice: die Bundeslade
  alternative: die Lade des Bundes
  rationale: Die etablierte Bezeichnung »Bundeslade« bezeichnet transparent die heilige Lade, die mit dem Bund verbunden ist, und fügt dem hebräischen Ausdruck keine besondere konfessionelle Deutung hinzu.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die parallelen Verben »hebt ... auf« und »hoben ... auf« bilden Befehl und Ausführung sichtbar ab; »zieht ... hinüber« berücksichtigt den Jordanübergang, während »vor dem Volk her« die räumliche Führungsposition idiomatisch ausdrückt.
