  yaml_path: translation/ot/joshua/003/012.yaml
  text: Now take for yourselves twelve men from the tribes of Israel[a], one man from each tribe.
translation:
  language: de
  text: Und nun nehmt euch zwölf Männer aus den Stämmen Israels, je einen Mann aus jedem Stamm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl den fortführenden Anschluss וְ als auch den Übergang zur nächsten Anweisung durch עַתָּה; im Deutschen klingt „Und nun“ natürlich und würdevoll.
- source_word: קְחוּ לָכֶם
  choice: nehmt euch
  rationale: Gibt den Imperativ von לקח und die durch לָכֶם ausgedrückte Beteiligungs- beziehungsweise Zwecknuance knapp und idiomatisch wieder. „Wählt euch“ wäre im Kontext möglich, legt die Auswahlbedeutung aber stärker fest.
- source_word: שְׁנֵי עָשָׂר אִישׁ
  choice: zwölf Männer
  rationale: אִישׁ bezeichnet hier männliche Vertreter; „Männer“ ist sachlich genau und im modernen Standarddeutsch selbstverständlich.
- source_word: מִשִּׁבְטֵי יִשְׂרָאֵל
  choice: aus den Stämmen Israels
  rationale: Gibt die Herkunft der Männer aus den israelitischen Stämmen unmittelbar und idiomatisch wieder.
- source_word: אִישׁ אֶחָד אִישׁ אֶחָד לַשָּׁבֶט
  choice: je einen Mann aus jedem Stamm
  rationale: 'Die wiederholte hebräische Wendung ist distributiv: Für jeden Stamm soll genau ein Mann genommen werden. „Je einen Mann aus jedem Stamm“ bewahrt diesen Sinn in natürlichem Deutsch.'
