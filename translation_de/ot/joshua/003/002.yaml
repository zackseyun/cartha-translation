lexical_decisions:
- source_word: וַיְהִי מִקְצֵה שְׁלֹשֶׁת יָמִים
  choice: Nach drei Tagen
  rationale: Die hebräische Erzählungsformel leitet den nächsten Vorgang ein; מִקְצֵה bezeichnet hier den Ablauf beziehungsweise das Ende des Zeitraums. Die knappe deutsche Zeitangabe gibt dies natürlich und präzise wieder.
- source_word: וַיַּעַבְרוּ
  choice: gingen ... durch
  rationale: עבר bezeichnet hier eine Bewegung durch das Innere des Lagers, nicht das Überschreiten des Jordans.
- source_word: הַשֹּׁטְרִים
  choice: die Amtsträger
  rationale: שֹׁטְרִים sind eingesetzte Funktionsträger, die Anweisungen weitergeben und deren Ausführung beaufsichtigen. „Amtsträger“ wahrt den administrativen Charakter, ohne einen modernen militärischen Rang festzulegen.
- source_word: בְּקֶרֶב הַמַּחֲנֶה
  choice: mitten durch das Lager
  rationale: Die Verbindung mit dem Bewegungsverb beschreibt den Weg durch das Innere des Lagers; die deutsche Wendung ist anschaulich und idiomatisch.
