  terminology: „Ellen“ bewahrt die antike Maßeinheit; die sachliche Fußnote ist angemessen. „Bundeslade“ muss im Vers nicht wiederholt werden, da das feminine „ihr“ im Kontext klar auf sie zurückverweist.
