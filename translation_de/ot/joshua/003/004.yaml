  source_fidelity: 'Die Grundstruktur und die Bezugnahme auf die Bundeslade mit femininem Pronomen sind zutreffend. Der negative Imperativ ist jedoch im Entwurf fehlerhaft formuliert: „Kommt ihr nicht näher“ ist kein angemessener Imperativ. Außerdem ist „diesen Weg ... gezogen“ hier weniger genau und natürlich als „auf diesem Weg ... gegangen“; עבר bezeichnet das Zurücklegen/Entlanggehen des Weges. Die Fußnotenmarker müssen bei den jeweils erläuterten Ausdrücken stehen.'
