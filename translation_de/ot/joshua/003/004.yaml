base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/004.yaml
  text: Yet there shall be a distance between you and it[a], about two thousand cubits by measure. Do not come near it, so that you may know the way by which you shall go[b], for you have not passed this way before.
translation:
  language: de
  text: Doch zwischen euch und ihr soll ein Abstand von etwa zweitausend Ellen[b] liegen. Kommt nicht näher, damit ihr den Weg erkennt, auf dem ihr gehen werdet; denn ihr seid auf diesem Weg bisher[a] noch nicht gegangen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »seit gestern und vorgestern«; eine hebräische Wendung für »früher« oder »bisher«.'
    reason: lexical_alternative
  - marker: b
    text: Eine Elle war ein antikes Längenmaß, ungefähr die Länge eines Unterarms. Zweitausend Ellen entsprechen grob 900 Metern.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: Doch
  rationale: Kennzeichnet die einschränkende beziehungsweise gegensätzliche Ergänzung zur vorangehenden Anweisung in natürlichem Deutsch.
- source_word: רָחוֹק יִהְיֶה בֵּינֵיכֶם וּבֵינוֹ
  choice: zwischen euch und ihr soll ein Abstand … bleiben
  rationale: Bewahrt die Aussageform des Hebräischen, statt sie in einen direkten Befehl umzuwandeln. Das feminine Pronomen bezieht sich im Deutschen auf die Bundeslade.
- source_word: כְּאַלְפַּיִם אַמָּה בַּמִּדָּה
  choice: von etwa zweitausend Ellen
  rationale: כְּ gibt die ungefähre Zahl an; die antike Maßeinheit bleibt im Haupttext erhalten. בַּמִּדָּה wird durch die konkrete Distanzangabe hinreichend ausgedrückt, ohne das schwerfällige „nach dem Maß“.
- source_word: אַל תִּקְרְבוּ אֵלָיו
  choice: Kommt ihr nicht näher
  rationale: Gibt das Verbot klar und räumlich wieder; „ihr“ nimmt den Bezug auf die Lade eindeutig auf.
- source_word: לְמַעַן אֲשֶׁר תֵּדְעוּ
  choice: damit ihr … erkennt
  rationale: Gibt den Zweck an. „Erkennt“ passt zur Orientierung an einem bislang unbekannten Weg.
- source_word: אֶת־הַדֶּרֶךְ אֲשֶׁר תֵּלְכוּ בָהּ
  choice: den Weg …, auf dem ihr gehen sollt
  rationale: Bewahrt die Wegmetaphorik und gibt die im Kontext erkennbare künftige Wegweisung wieder, ohne stärkere Zwangsmodalität.
- source_word: כִּי לֹא עֲבַרְתֶּם בַּדֶּרֶךְ
  choice: denn diesen Weg seid ihr … noch nicht gezogen
  rationale: „Ziehen“ ist in einer Erzählung über den Zug des Volkes idiomatisch und wahrt den Sinn von עבר als Durchziehen beziehungsweise Passieren.
- source_word: מִתְּמוֹל שִׁלְשׁוֹם
  choice: früher
  rationale: Gibt die hebräische Zeitformel idiomatisch als „zuvor/bisher“ wieder; die wörtliche Bildsprache wird in der Fußnote dokumentiert.
