    rationale: Die Formulierung ist für das Durchqueren eines Weges weniger idiomatisch und kann militärisch bzw. gruppenbezogen verengen. „auf diesem Weg ... gegangen“ gibt die räumliche Aussage von עבר natürlich wieder.
  - severity: medium
    issue: Fußnotenmarker gesammelt am Versende
    rationale: Die Marker sind an den Ausdrücken „Ellen“ und „bisher“ zu verankern, die sie erläutern. Im Entwurf stehen sie zudem in einer Reihenfolge, die nicht der Reihenfolge ihrer Bezugsausdrücke entspricht.
