  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge wurde für gute Verständlichkeit gegliedert, während die räumlichen Angaben, das Wasserbild und die eindringliche Doppelung von תַּמּוּ נִכְרָתוּ erhalten bleiben. Die Schreibweise „Zaretan“ folgt einer gut lesbaren deutschen Transliteration.
