  to: Die von oben herabfließenden Wassermassen blieben stehen[a]; sie türmten sich weit entfernt bei Adam, der Stadt neben Zaretan, zu einem einzigen Wall auf. Das Wasser aber, das zum Meer der Araba, dem Salzmeer, hinabfloss, versiegte vollständig und wurde abgeschnitten[b]. Das Volk überquerte den Fluss gegenüber von Jericho.
