source:
  edition: WLC
  text: וַ/יַּעַמְד֡וּ הַ/מַּיִם֩ הַ/יֹּרְדִ֨ים מִ/לְ/מַ֜עְלָ/ה קָ֣מוּ נֵד אֶחָ֗ד הַרְחֵ֨ק מְאֹ֜ד ב/אדם הָ/עִיר֙ אֲשֶׁר֙ מִ/צַּ֣ד צָֽרְתָ֔ן וְ/הַ/יֹּרְדִ֗ים עַ֣ל יָ֧ם הָ/עֲרָבָ֛ה יָם הַ/מֶּ֖לַח תַּ֣מּוּ נִכְרָ֑תוּ וְ/הָ/עָ֥ם עָבְר֖וּ נֶ֥גֶד יְרִיחֽוֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/016.yaml
  text: the waters flowing down from above stood still[a]; they rose up in one heap, very far away, at Adam, the city beside Zarethan. And those flowing down toward the Sea of the Arabah, the Salt Sea, were completely cut off[b], and the people crossed over opposite Jericho.
translation:
  language: de
  text: Die von oben herabfließenden Wassermassen blieben stehen[a]; sie türmten sich weit entfernt bei Adam, der Stadt neben Zaretan, zu einem einzigen Wall auf. Das Wasser aber, das zum Meer der Araba, dem Salzmeer, hinabfloss, versiegte vollständig und wurde abgeschnitten[b]. Das Volk überquerte den Fluss gegenüber von Jericho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie standen als ein einziger Wall.“ Das Hebräische zeichnet das Bild der Wassermassen, die sich zu einer einzigen aufgestauten Barriere erheben.'
    reason: lexical_alternative
  - marker: b
    text: Das „Salzmeer“ ist das Gewässer, das heute gewöhnlich das Tote Meer genannt wird.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַמְדוּ
  choice: blieben ... stehen
  rationale: Die Wiedergabe bewahrt das Bild des hebräischen עמד und bezeichnet im Zusammenhang zugleich das Anhalten der Strömung.
- source_word: הַמַּיִם הַיֹּרְדִים מִלְמַעְלָה
  choice: die von oben herabfließenden Wassermassen
  rationale: Die Formulierung gibt die aus höher gelegener Richtung kommenden, flussabwärts strömenden Wasser natürlich wieder; „Wassermassen“ passt zum pluralischen Bild und zur folgenden Auftürmung.
- source_word: קָמוּ נֵד אֶחָד
  choice: türmten sie sich zu einem einzigen Wall auf
  rationale: נֵד bezeichnet aufgehäuftes beziehungsweise aufgestautes Wasser. „Wall“ vermittelt die konkrete Vorstellung einer einzigen aufgerichteten Wassermasse, ohne eine technische Erklärung einzutragen.
- source_word: הַרְחֵק מְאֹד
  choice: weit entfernt
  rationale: Die adverbiale Verstärkung wird in natürlichem Deutsch knapp als große Entfernung ausgedrückt.
- source_word: בְאָדָם
  choice: bei Adam
  rationale: אָדָם ist hier ein Ortsname; „bei“ gibt die lokale Präposition idiomatisch wieder.
- source_word: הָעִיר אֲשֶׁר מִצַּד צָרְתָן
  choice: der Stadt neben Zaretan
  rationale: מִצַּד bezeichnet die Lage an der Seite beziehungsweise in unmittelbarer Nähe; „neben“ wahrt diese räumliche Aussage.
- source_word: וְהַיֹּרְדִים עַל יָם הָעֲרָבָה
  choice: Das Wasser aber, das zum Meer der Araba ... hinabfloss
  rationale: Das substantivierte Partizip bezieht sich auf das flussabwärts strömende Wasser; עַל hat hier im Zusammenhang eine auf das Meer gerichtete Bedeutung.
- source_word: יָם הַמֶּלַח
  choice: das Salzmeer
  rationale: Die direkte Übersetzung der hebräischen Bezeichnung bleibt im Haupttext erhalten.
- source_word: תַּמּוּ נִכְרָתוּ
  choice: versiegte vollständig; es war abgeschnitten
  rationale: 'Beide hebräischen Verben werden sichtbar wiedergegeben: תַּמּוּ bezeichnet das vollständige Aufhören, נִכְרָתוּ das Abgeschnittenwerden. So geht die eindringliche Doppelung nicht in einem einzigen deutschen Ausdruck verloren.'
- source_word: וְהָעָם עָבְרוּ
  choice: So zog das Volk ... hindurch
  rationale: עבר bezeichnet hier die Überquerung des Jordan; „hindurchziehen“ ist im unmittelbaren Kontext des trockengelegten Flussbetts natürlich.
- source_word: נֶגֶד יְרִיחוֹ
  choice: gegenüber von Jericho
  rationale: נֶגֶד bezeichnet eine Position auf der gegenüberliegenden Seite beziehungsweise in Sichtweite eines Ortes.
