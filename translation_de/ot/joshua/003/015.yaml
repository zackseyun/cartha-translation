  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der Hintergrundsatz zum Wasserstand ist durch Gedankenstriche als Einschub markiert. Der Vers endet entsprechend der hebräischen Satzstruktur mit einem Komma, da der Satz im folgenden Vers weitergeführt wird.
