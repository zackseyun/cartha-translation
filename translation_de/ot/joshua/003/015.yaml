  text: וּ/כְ/ב֞וֹא נֹשְׂאֵ֤י הָֽ/אָרוֹן֙ עַד הַ/יַּרְדֵּ֔ן וְ/רַגְלֵ֤י הַ/כֹּֽהֲנִים֙ נֹשְׂאֵ֣י הָֽ/אָר֔וֹן נִטְבְּל֖וּ בִּ/קְצֵ֣ה הַ/מָּ֑יִם וְ/הַ/יַּרְדֵּ֗ן מָלֵא֙ עַל כָּל גְּדוֹתָ֔י/ו כֹּ֖ל יְמֵ֥י קָצִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/015.yaml
  text: And when those carrying the ark came as far as the Jordan[a], and the feet of the priests carrying the ark were dipped in the edge of the water (now the Jordan was full over all its banks all the days of harvest)[b],
translation:
  language: de
  text: Und als die Träger der Lade an den Jordan kamen und die Priester, die die Lade trugen, mit ihren Füßen am Rand ins Wasser eintauchten – der Jordan aber trat während der ganzen Erntezeit über alle seine Ufer[a] –,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: Während der Erntezeit führte der Jordan Hochwasser.'
    reason: cultural_note
lexical_decisions:
- source_word: וּכְבוֹא
  choice: Und als … kamen
  rationale: Die Verbindung aus Konjunktion, כְּ und Infinitivus constructus leitet einen temporalen Nebensatz ein. „Und als“ gibt Abfolge und Satzanschluss natürlich wieder.
- source_word: נֹשְׂאֵי הָאָרוֹן
  choice: die Träger der Lade / die die Lade trugen
  rationale: Das Partizip bezeichnet diejenigen, welche die Lade tragen. Die Wiederholung des Hebräischen bleibt erhalten, im zweiten Vorkommen jedoch in natürlicher deutscher Syntax.
- source_word: עַד הַיַּרְדֵּן
  choice: an den Jordan
  rationale: עַד bezeichnet hier das Erreichen des Flusses beziehungsweise seines Randes. „An den Jordan kamen“ ist im Deutschen idiomatisch und lässt den folgenden Eintritt der Füße ins Wasser klar hervortreten.
- source_word: נִטְבְּלוּ בִּקְצֵה הַמָּיִם
  choice: am Rand ins Wasser tauchten
  rationale: Der Niphal von טבל bezeichnet das Eintauchen. בִּקְצֵה הַמָּיִם lokalisiert dies am äußersten Rand des Wassers; die Formulierung vermeidet sowohl das zu schwache „berührten“ als auch die Vorstellung vollständigen Untertauchens.
- source_word: וְהַיַּרְדֵּן מָלֵא עַל כָּל גְּדוֹתָיו
  choice: der Jordan aber trat … über alle seine Ufer
  rationale: Die Aussage beschreibt einen hohen, über die Ufer reichenden Wasserstand. Das idiomatische „über die Ufer treten“ vermittelt מָלֵא עַל klar, ohne die Hochwassersituation über den Text hinaus auszumalen.
- source_word: כֹּל יְמֵי קָצִיר
  choice: während der ganzen Erntezeit
  rationale: Die Wendung bezeichnet die gesamte Ernteperiode. „Erntezeit“ ist natürliches modernes Deutsch und bewahrt den zeitlichen Umfang.
