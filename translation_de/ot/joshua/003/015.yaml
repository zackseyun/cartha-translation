revisions:
- from: Und als die Träger der Lade an den Jordan kamen und die Füße der Priester, die die Lade trugen, am Rand ins Wasser tauchten – der Jordan aber trat während der ganzen Erntezeit über alle seine Ufer[a] –,
  to: Und als die Träger der Lade an den Jordan kamen und die Priester, die die Lade trugen, mit ihren Füßen am Rand ins Wasser eintauchten – der Jordan aber trat während der ganzen Erntezeit über alle seine Ufer[a] –,
  rationale: Die Revision glättet ausschließlich die deutsche Satzführung bei נִטְבְּלוּ בִּקְצֵה הַמָּיִם. Sie erhält die Aussage, dass die Füße der Priester am Wasserrand in das Wasser gelangten, sowie den offenen Satzanschluss an den folgenden Vers. Die vorhandene Hochwasser-Fußnote bleibt sachlich und korrekt verankert.
