  text: וְ/אִם לֹ֤א מִ/דְּאָגָה֙ מִ/דָּבָ֔ר עָשִׂ֥ינוּ אֶת זֹ֖את לֵ/אמֹ֑ר מָחָ֗ר יֹאמְר֨וּ בְנֵי/כֶ֤ם לְ/בָנֵ֨י/נוּ֙ לֵ/אמֹ֔ר מַה לָּ/כֶ֕ם וְ/לַֽ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/024.yaml
  text: No, rather, we did this out of anxious concern, saying, ‘In time to come your children may say to our children, “What have you to do with the LORD, the God of Israel?”’
translation:
  language: de
  text: 'Nein, vielmehr haben wir dies aus Sorge getan, weil wir dachten: Künftig könnten eure Söhne zu unseren Söhnen sagen: »Was habt ihr mit dem HERRN, dem Gott Israels, zu tun?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִדְּאָגָה מִדָּבָר
  choice: aus Sorge
  rationale: Die Wendung bezeichnet ein Handeln aus Besorgnis bzw. ängstlicher Vorsorge. Natürliches Deutsch gibt den Sinn knapp mit »aus Sorge« wieder; מִדָּבָר verstärkt bzw. konkretisiert den Beweggrund, ohne dass »wegen einer Sache« idiomatisch wäre.
- source_word: מָחָר
  choice: künftig
  rationale: Wörtlich »morgen«, hier idiomatisch auf eine spätere Generation bzw. zukünftige Zeit bezogen.
- source_word: בְנֵיכֶם / לְבָנֵינוּ
  choice: eure Söhne / unsere Söhne
  rationale: Bewahrt die konkrete generationale und männliche Formulierung des Hebräischen; im Kontext sind die Nachkommen als künftige Bundesgeneration gemeint.
- source_word: מַה לָּכֶם וְלַיהוָה
  choice: Was habt ihr mit dem HERRN … zu tun?
  rationale: Die idiomatische deutsche Frage erhält die abgrenzende, die Beziehung zum HERRN bestreitende Kraft der hebräischen Wendung.
- source_word: יהוה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Tetragramms in Kapitälchenform entspricht dem vorgesehenen Bibelregister und vermeidet eine unbelegte Aussprachefestlegung.
theological_decisions:
- issue: Art der befürchteten Abgrenzung
  choice: 'Die Frage wird offen und relational formuliert: »Was habt ihr mit dem HERRN … zu tun?«'
  alternative: »Welchen Anteil habt ihr am HERRN?«
  rationale: Der hebräische Wortlaut enthält hier kein ausdrückliches Wort für »Anteil«. Die gewählte Form bewahrt die umfassendere, spannungsvolle Zurückweisung, die der folgende Kontext näher erläutert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die einleitende hebräische Schwur- bzw. Beteuerungsformel וְאִם־לֹא wird idiomatisch als entschiedene Zurückweisung mit »Nein, vielmehr« wiedergegeben. Die verschachtelte Redeeinleitung לֵאמֹר … לֵאמֹר wird im Deutschen zur besseren Verständlichkeit mit »weil wir dachten« und anschließender direkter Rede entfaltet.
