id: JOS.22.26
reference: Joshua 22:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/נֹּ֕אמֶר נַעֲשֶׂה נָּ֣א לָ֔/נוּ לִ/בְנ֖וֹת אֶת הַ/מִּזְבֵּ֑חַ לֹ֥א לְ/עוֹלָ֖ה וְ/לֹ֥א לְ/זָֽבַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/026.yaml
  text: So we said[b][a], ‘Let us now build for ourselves the altar—not for burnt offering and not for sacrifice.’
translation:
  language: de
  text: 'Darum sagten wir[a]: »Lasst uns nun den Altar für uns bauen[b] – nicht für Brandopfer und nicht für Schlachtopfer.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Da sagten wir« oder »Und wir sagten«. Das hebräische Bindewort kann je nach dem Zusammenhang unterschiedlich wiedergegeben werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: »Lasst uns für uns machen, den Altar zu bauen.« Gemeint ist idiomatisch: »Lasst uns den Altar für uns bauen.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: Darum sagten wir
  rationale: Das Wayyiqtol führt die aus dem zuvor genannten Bedenken gezogene Folgerung ein. »Darum« gibt diesen Zusammenhang im Deutschen natürlich wieder; auch »Da« oder »Und« sind möglich.
- source_word: נַעֲשֶׂה נָּא לָנוּ לִבְנוֹת
  choice: Lasst uns nun den Altar für uns bauen
  rationale: Der Kohortativ mit נא drückt einen auffordernden Entschluss aus. Die wörtlich sperrige Verbindung »Lasst uns für uns machen, den Altar zu bauen« wird idiomatisch als Bauentschluss wiedergegeben; »nun« bewahrt den dringlich-beratenden Ton von נא.
- source_word: אֶת הַמִּזְבֵּחַ
  choice: den Altar
  rationale: Der bestimmte Artikel bezeichnet den konkreten, bereits zur Debatte stehenden Altar.
- source_word: לֹא לְעוֹלָה
  choice: nicht für Brandopfer
  rationale: עֹלָה bezeichnet das vollständig verbrannte Opfer; »Brandopfer« ist die geläufige und präzise deutsche Wiedergabe.
- source_word: וְלֹא לְזָבַח
  choice: und nicht für Schlachtopfer
  rationale: זֶבַח bezeichnet hier eine Opferart, bei der ein Tier geschlachtet wird, und steht neben dem Brandopfer. »Schlachtopfer« erhält diese kultische Unterscheidung besser als das allgemeinere »Opfer«.
theological_decisions:
- issue: Zweck des Altars
  choice: 'Die doppelte Verneinung wird ausdrücklich beibehalten: weder für Brandopfer noch für Schlachtopfer.'
  alternative: 'Zusammenfassend: »nicht zum Opfern«.'
  rationale: Der hebräische Text nennt zwei Opferkategorien ausdrücklich. Ihre Beibehaltung wahrt die Aussage, dass der Altar nicht als konkurrierende Opferstätte gedacht war, ohne den später erläuterten Zweck vorwegzunehmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt klar und mündlich; die kultischen Begriffe »Brandopfer« und »Schlachtopfer« bewahren die im Hebräischen unterschiedenen Opferarten.
