  variant: modern standard German
source:
  edition: WLC
  text: וּ/גְב֣וּל נָֽתַן יְ֠הוָה בֵּינֵ֨/נוּ וּ/בֵינֵי/כֶ֜ם בְּנֵי רְאוּבֵ֤ן וּ/בְנֵי גָד֙ אֶת הַ/יַּרְדֵּ֔ן אֵין לָ/כֶ֥ם חֵ֖לֶק בַּֽ/יהוָ֑ה וְ/הִשְׁבִּ֤יתוּ בְנֵי/כֶם֙ אֶת בָּנֵ֔י/נוּ לְ/בִלְתִּ֖י יְרֹ֥א אֶת יְהוָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/025.yaml
  text: For Yahweh has made the Jordan a boundary between us and you[a], sons of Reuben and sons of Gad. You have no portion in Yahweh. And so your sons might cause our sons to stop fearing Yahweh.
translation:
  language: de
  text: Denn Jahwe hat den Jordan als Grenze zwischen uns und euch gesetzt, ihr Söhne Rubens und Söhne Gads. Ihr habt keinen Anteil an Jahwe. So könnten eure Söhne unsere Söhne davon abbringen, Jahwe zu fürchten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּגְבוּל נָתַן
  choice: hat ... als Grenze ... gesetzt
  rationale: Die Verbindung aus גְּבוּל und נָתַן bezeichnet idiomatisch das Festlegen einer Grenze. „Als Grenze gesetzt“ ist im Deutschen natürlich und bleibt dem Bild des Hebräischen nahe.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶת הַיַּרְדֵּן
  choice: den Jordan
  rationale: Der Eigenname ist im Deutschen ohne den Zusatz „Fluss“ eindeutig und idiomatisch.
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד
  choice: Söhne Rubens und Söhne Gads
  rationale: Die Formulierung bewahrt die ausdrückliche Stammesbezeichnung mit בְּנֵי und ist in gehobenem, verständlichem Deutsch möglich.
- source_word: אֵין לָכֶם חֵלֶק בַּיהוָה
  choice: Ihr habt keinen Anteil an Jahwe
  rationale: חֵלֶק bedeutet „Anteil“ oder „Teil“. „Anteil an Jahwe“ wahrt die knappe, theologisch spannungsreiche Aussage, ohne sie als bloßen Land- oder Erbanteil festzulegen.
- source_word: וְהִשְׁבִּיתוּ
  choice: So könnten ... davon abbringen
  rationale: Der Hifil von שבת drückt das Veranlassen eines Aufhörens aus. Im Zusammenhang wird eine befürchtete mögliche Folge beschrieben; „könnten ... davon abbringen“ gibt dies natürlich wieder.
- source_word: לְבִלְתִּי יְרֹא אֶת יְהוָה
  choice: Jahwe zu fürchten
  rationale: Die traditionelle und sachlich passende Wendung „Jahwe fürchten“ bewahrt sowohl Ehrfurcht als auch Furcht, ohne die Bedeutung auf „verehren“ zu verengen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht der Eigenname יהוה. Die Transliteration „Jahwe“ bewahrt den persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von חֵלֶק בַּיהוָה
  choice: Anteil an Jahwe
  alternative: Erbteil an Jahwe
  rationale: „Anteil“ erhält die mögliche kultische und bundesbezogene Bedeutung, ohne die Aussage durch den spezifischeren Begriff „Erbteil“ einzuengen.
- issue: Modalität der befürchteten Folge
  choice: könnten ... davon abbringen
  alternative: werden ... davon abbringen
  rationale: Der Kontext formuliert die Sorge, was die Nachkommen künftig tun könnten. Die modale Wiedergabe vermeidet eine unnötige Festlegung als sichere Vorhersage.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Stammesbezeichnungen bleiben quellennah; „davon abbringen“ vermittelt die Kausativkonstruktion verständlich, ohne die Aussage abzuschwächen.
