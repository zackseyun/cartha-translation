  source_fidelity: 'Die Übersetzung gibt die zentrale Syntax und Semantik des Hebräischen zuverlässig wieder: Jahwe setzt den Jordan als Grenze; die angesprochenen Rubeniten und Gaditen hätten keinen Anteil an Jahwe; daraus könnte folgen, dass ihre Söhne die Söhne der Sprecher vom Fürchten Jahwes abbringen. Die modale Formulierung „könnten“ bildet den befürchteten zukünftigen Konsequenzzusammenhang angemessen ab.'
