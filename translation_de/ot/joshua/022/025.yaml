  terminology: „Jahwe“ gibt יהוה konsistent als Eigenname wieder. „Grenze“ für גְּבוּל, „Anteil“ für חֵלֶק und „Jahwe fürchten“ für ירא את יהוה sind treffend und vermeiden unnötige dogmatische Präzisierungen. Keine Fußnotenanker sind im deutschen Text erforderlich; die englische Alternativanmerkung betrifft keine notwendige deutsche Textvariante.
