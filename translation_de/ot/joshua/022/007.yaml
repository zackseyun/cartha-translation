  - severity: low
    issue: „dann“ ist nicht erforderlich
    rationale: Die hebräische Verbindung fügt die anschließende Handlung an; „Als Josua sie zu ihren Zelten entließ“ gibt dies flüssig wieder, ohne eine stärker hervorgehobene zeitliche Folge zu behaupten.
