  text: וְ/לַ/חֲצִ֣י שֵׁ֣בֶט הַֽ/מְנַשֶּׁ֗ה נָתַ֣ן מֹשֶׁה֮ בַּ/בָּשָׁן֒ וּ/לְ/חֶצְי֗/וֹ נָתַ֤ן יְהוֹשֻׁ֨עַ֙ עִם אֲחֵי/הֶ֔ם מ/עבר הַ/יַּרְדֵּ֖ן יָ֑מָּ/ה וְ֠/גַם כִּ֣י שִׁלְּחָ֧/ם יְהוֹשֻׁ֛עַ אֶל אָהֳלֵי/הֶ֖ם וַ/יְבָרֲכֵֽ/ם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/007.yaml
  text: To the one half-tribe of Manasseh Moses had given land in Bashan[a], but to the other half Joshua gave land with their brothers beyond the Jordan westward. And when Joshua sent them away to their tents, he blessed them.
translation:
  language: de
  text: Der einen Hälfte des Stammes Manasse hatte Mose im Baschan Land gegeben; der anderen Hälfte aber gab Josua westlich des Jordan bei ihren Brüdern[a] Land. Als Josua sie zu ihren Zelten entließ, segnete er sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „mit ihren Brüdern“. Gemeint sind ihre israelitischen Volksgenossen aus den anderen Stämmen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: der einen Hälfte des Stammes Manasse
  rationale: Die Formulierung bezeichnet eine der beiden Hälften des Stammes; „der einen Hälfte“ bereitet den ausdrücklichen Gegensatz zur „anderen Hälfte“ natürlich vor.
- source_word: נָתַן מֹשֶׁה בַּבָּשָׁן
  choice: hatte Mose im Baschan Land gegeben
  rationale: Das Plusquamperfekt macht deutlich, dass Moses Zuteilung der später genannten Zuteilung Josuas vorausging. „Land“ ist aus dem Zusammenhang als Gegenstand des Gebens erschlossen.
- source_word: וּלְחֶצְיוֹ
  choice: der anderen Hälfte aber
  rationale: Das Suffix verweist auf den Stamm Manasse; „andere Hälfte“ gibt den gemeinten Kontrast im Deutschen klar wieder.
- source_word: עִם אֲחֵיהֶם
  choice: zusammen mit ihren Brüdern
  rationale: „Brüder“ bewahrt den konkreten hebräischen Verwandtschaftsbegriff; gemeint sind hier die israelitischen Angehörigen der anderen Stämme.
- source_word: מֵעֵבֶר הַיַּרְדֵּן יָמָּה
  choice: westlich des Jordan
  rationale: יָמָּה bezeichnet die Richtung zum Meer, also nach Westen. Die knappe deutsche Wendung gibt die geografische Lage verständlich wieder, ohne ein wechselndes „diesseits/jenseits“ einzuführen.
- source_word: וְגַם כִּי שִׁלְּחָם
  choice: Als Josua sie dann … entließ
  rationale: Die Wendung führt eine weitere, zeitlich anschließende Handlung ein. „Entließ“ gibt den Piel-Sinn des Wegsendens passend wieder.
- source_word: אֶל אָהֳלֵיהֶם
  choice: zu ihren Zelten
  rationale: Die konkrete hebräische Ausdrucksweise wird beibehalten, statt sie verallgemeinernd mit „nach Hause“ wiederzugeben.
- source_word: וַיְבָרֲכֵם
  choice: segnete er sie
  rationale: Direkte und übliche Wiedergabe des Verbs ברך in diesem Zusammenhang.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau macht den Gegensatz zwischen den beiden Hälften Manasses deutlich; das Plusquamperfekt wahrt die zeitliche Abfolge. Der konkrete Ausdruck „Zelte“ und der Verwandtschaftsbegriff „Brüder“ bleiben erhalten.
