  to: Der einen Hälfte des Stammes Manasse hatte Mose im Baschan Land gegeben; der anderen Hälfte aber gab Josua westlich des Jordan bei ihren Brüdern[a] Land. Als Josua sie zu ihren Zelten entließ, segnete er sie.
