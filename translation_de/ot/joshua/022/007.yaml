  verdict: revise
  source_fidelity: 'Die wesentlichen Angaben sind korrekt wiedergegeben: die frühere Landgabe Moses im Baschan, die Zuteilung Josuas an die andere Hälfte Manasses, die westliche Lage jenseits des Jordan sowie die Entlassung und Segnung. Im deutschen Entwurf kann jedoch „gab Josua zusammen mit ihren Brüdern … Land“ missverständlich besagen, Josua habe das Land gemeinsam mit den Brüdern gegeben. Die Stellung der Präpositionalgruppe sollte daher so geändert werden, dass sie eindeutig die Lage bzw. Gemeinschaft der Empfänger bezeichnet.'
  naturalness: Modernes Standarddeutsch und der würdige Registerton sind insgesamt gelungen. Die Umstellung zu „bei ihren Brüdern“ beseitigt die syntaktische Fehlzuordnung. Das unmarkierte „Als“ ist idiomatischer und verlangt keine zusätzliche, im Hebräischen nicht ausdrücklich markierte zeitliche Nuance durch „dann“.
  terminology: „Mose“, „Josua“, „Manasse“ und „Baschan“ entsprechen dem üblichen deutschen Bibelgebrauch. „Brüder“ wahrt den hebräischen Ausdruck; die Anmerkung erläutert sachgerecht den gemeinten weiteren Kreis der israelitischen Stammesgenossen. „Zelte“ und „segnete“ sind treffend.
  issues:
