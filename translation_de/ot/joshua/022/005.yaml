source:
  edition: WLC
  text: רַ֣ק שִׁמְר֣וּ מְאֹ֗ד לַ/עֲשׂ֨וֹת אֶת הַ/מִּצְוָ֣ה וְ/אֶת הַ/תּוֹרָה֮ אֲשֶׁ֣ר צִוָּ֣ה אֶתְ/כֶם֮ מֹשֶׁ֣ה עֶֽבֶד יְהוָה֒ לְ֠/אַהֲבָה אֶת יְהוָ֨ה אֱלֹֽהֵי/כֶ֜ם וְ/לָ/לֶ֧כֶת בְּ/כָל דְּרָכָ֛י/ו וְ/לִ/שְׁמֹ֥ר מִצְוֺתָ֖י/ו וּ/לְ/דָבְקָה ב֑/וֹ וּ/לְ/עָבְד֕/וֹ בְּ/כָל לְבַבְ/כֶ֖ם וּ/בְ/כָל נַפְשְׁ/כֶֽם׀־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/005.yaml
  text: 'Only be very careful to do the commandment and the law that Moses the servant of Yahweh commanded you: to love Yahweh your God[a], to walk in all his ways, to keep his commandments, to cling to him, and to serve him with all your heart and with all your soul.'
translation:
  language: de
  text: 'Doch achtet sehr darauf, das Gebot und die Weisung[a] zu befolgen, die Mose, der Diener Jahwes, euch geboten hat: Jahwe, euren Gott, zu lieben, auf allen seinen Wegen zu gehen, seine Gebote zu halten, an ihm festzuhalten und ihm mit eurem ganzen Herzen und mit eurer ganzen Seele zu dienen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: das Gesetz (hebräisch: Tora).'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Doch
  rationale: Nach Entlassung und Segen leitet רַק eine nachdrückliche Einschränkung beziehungsweise Mahnung ein. „Doch“ stellt den passenden Anschluss her, ohne den Satz im Deutschen unnatürlich beginnen zu lassen.
- source_word: שִׁמְרוּ מְאֹד לַעֲשׂוֹת
  choice: achtet sehr darauf, ... zu befolgen
  rationale: Die Verbindung bezeichnet eindringliche Sorgfalt bei der tatsächlichen Ausführung. „Achtet sehr darauf“ gibt die idiomatische Kraft wieder; „befolgen“ ist bei Gebot und Weisung natürlich.
- source_word: הַמִּצְוָה וְאֶת הַתּוֹרָה
  choice: das Gebot und die Weisung
  rationale: Der Singular von מִצְוָה bleibt erhalten. תּוֹרָה hat den Grundsinn von Weisung oder Unterweisung; „Weisung“ vermeidet eine unnötige Verengung auf ein modernes Gesetzeskonzept.
- source_word: אֲשֶׁר צִוָּה אֶתְכֶם
  choice: die ... euch gegeben hat
  rationale: Wörtlich steht „die euch Mose geboten hat“. Im Deutschen vermeidet „das Gebot ... geboten“ eine schwerfällige Wiederholung; „gegeben“ bewahrt hier den Sinn der autoritativen Übermittlung.
- source_word: עֶבֶד יְהוָה
  choice: der Diener Jahwes
  rationale: עֶבֶד fungiert hier als ehrender Titel Moses. „Diener“ ist im modernen Deutschen würdig und kontextgemäß.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als persönlicher Gottesname wiedergegeben. Die deutsche Form „Jahwe“ ist geläufiger als die englische Schreibweise „Yahweh“.
- source_word: וְלָלֶכֶת בְּכָל דְּרָכָיו
  choice: auf allen seinen Wegen zu gehen
  rationale: Die hebräische Metapher des Gehens auf Gottes Wegen bleibt erhalten und ist auch im Deutschen verständlich.
- source_word: וְלִשְׁמֹר מִצְוֺתָיו
  choice: seine Gebote zu halten
  rationale: „Gebote halten“ ist eine natürliche und traditionsfähige Wiedergabe von שׁמר mit מִצְוֹת.
- source_word: וּלְדָבְקָה בוֹ
  choice: an ihm festzuhalten
  rationale: דבק bezeichnet enge, beständige Bindung. „An ihm festhalten“ bewahrt die relationale Intensität und klingt natürlicher als „ihm anhängen“.
- source_word: וּלְעָבְדוֹ
  choice: ihm ... zu dienen
  rationale: עבד umfasst den umfassenden Dienst an Gott und kann kultische Verehrung einschließen. „Dienen“ lässt diese Bedeutungsbreite offen.
- source_word: בְּכָל לְבַבְכֶם וּבְכָל נַפְשְׁכֶם
  choice: mit eurem ganzen Herzen und mit eurer ganzen Seele
  rationale: Die parallele Ganzheitsaussage wird formal und zugleich idiomatisch wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. „Jahwe“ bewahrt den Charakter als Eigenname, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von תּוֹרָה
  choice: Weisung
  alternative: Gesetz
  rationale: Im mosaischen Bundeskontext ist „Gesetz“ möglich, doch תּוֹרָה bezeichnet grundsätzlich autoritative Weisung. Die Hauptübersetzung wahrt diesen weiteren Sinn; die geläufige Alternative wird in der Fußnote genannt.
- issue: Bundesethische Bildsprache
  choice: auf allen seinen Wegen zu gehen ... an ihm festzuhalten
  alternative: nach allem zu leben, was er will ... ihm treu zu bleiben
  rationale: Die konkreten hebräischen Metaphern tragen relationale und ethische Spannung. Sie bleiben verständlich und werden daher nicht in abstrakte Aussagen aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bewahrt die eindringliche Reihe der Infinitive, bleibt aber durch idiomatische Wortwahl gut verständlich. Der Gottesname erscheint in der etablierten deutschen Form „Jahwe“.
