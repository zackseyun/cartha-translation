source:
  edition: WLC
  text: וַֽ/יִּשְׁמְע֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יִּקָּ֨הֲל֜וּ כָּל עֲדַ֤ת בְּנֵֽי יִשְׂרָאֵל֙ שִׁלֹ֔ה לַ/עֲל֥וֹת עֲלֵי/הֶ֖ם לַ/צָּבָֽא־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/012.yaml
  text: When the sons of Israel heard[b][a], the whole congregation of the sons of Israel assembled at Shiloh to go up against them for war.
translation:
  language: de
  text: Als die Söhne Israels davon hörten, versammelte sich die ganze Gemeinde der Söhne Israels in Schilo, um gegen sie zum Krieg hinaufzuziehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich: „um gegen sie zum Krieg hinaufzuziehen“; gemeint ist ein militärisches Vorgehen.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: Als ... davon hörten
  rationale: שׁמע bedeutet hier im erzählenden Zusammenhang „hören“. Das im Deutschen zur natürlichen Ergänzung nötige „davon“ verweist auf die zuvor berichtete Nachricht, ohne deren Inhalt näher festzulegen.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die wörtliche Wendung wird an beiden Stellen beibehalten. Sie ist im Deutschen verständlich und bewahrt den Bezug auf Israel als Stammvater beziehungsweise Namensgeber.
- source_word: וַיִּקָּהֲלוּ
  choice: versammelte sich
  rationale: Das Verb קהל bezeichnet das Zusammenkommen zu einer Versammlung. Der Singular entspricht im Deutschen dem kollektiven Subjekt „die ganze Gemeinde“.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: die ganze Gemeinde der Söhne Israels
  rationale: עֵדָה bezeichnet die Gemeinschaft beziehungsweise versammelte Gemeinde; „die ganze Gemeinde“ gibt כָּל idiomatisch und vollständig wieder.
- source_word: שִׁלֹה
  choice: Schilo
  rationale: Gebräuchliche deutsche Form des Ortsnamens.
- source_word: לַעֲלוֹת עֲלֵיהֶם
  choice: um gegen sie ... hinaufzuziehen
  rationale: Die Wiedergabe erhält das Bewegungsverb עלה („hinaufziehen“) und bringt durch „gegen sie“ die feindliche Zielrichtung von עֲלֵיהֶם zum Ausdruck.
- source_word: לַצָּבָא
  choice: zum Krieg
  rationale: צָבָא bezeichnet hier den militärischen Einsatz beziehungsweise Krieg. Zusammen mit „hinaufziehen“ bleibt die hebräische Militärformel erkennbar.
