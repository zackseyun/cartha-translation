base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/029.yaml
  text: Far be it from us that we should rebel against Yahweh and turn away today from following Yahweh by building an altar for burnt offering[a], grain offering, or sacrifice, besides the altar of Yahweh our God that is before his tabernacle.
translation:
  language: de
  text: Das sei uns fern! Wir wollen uns nicht gegen Jahwe auflehnen und uns heute von der Nachfolge Jahwes abwenden[a], indem wir einen Altar für Brandopfer, Speiseopfer oder Schlachtopfer bauen – zusätzlich zu dem Altar Jahwes, unseres Gottes, der vor seiner Wohnstätte steht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „heute umzukehren von hinter Jahwe her“. Die Wendung meint, davon abzukehren, Jahwe weiterhin nachzufolgen.'
    reason: Die Fußnote bewahrt die konkrete hebräische Bildsprache von מֵאַחֲרֵי und erklärt ihre idiomatische Bedeutung korrekt.
lexical_decisions:
- source_word: חָלִילָה לָּנוּ מִמֶּנּוּ
  choice: Das sei uns fern!
  rationale: Die feste hebräische Wendung drückt entschiedene Zurückweisung und Abscheu aus. Die deutsche Formulierung ist idiomatisch, würdig und bewahrt die starke Aussage.
- source_word: לִמְרֹד בַּיהוָה
  choice: uns gegen Jahwe auflehnen
  rationale: מרד bezeichnet Auflehnung beziehungsweise Rebellion; בְּ hat bei diesem Verb adversative Bedeutung. „Sich auflehnen“ ist im heutigen Deutsch natürlich und bewahrt den Gedanken des bewussten Widerstands.
- source_word: וְלָשׁוּב הַיּוֹם מֵאַחֲרֵי יְהוָה
  choice: uns heute von der Nachfolge Jahwes abwenden
  rationale: Die Verbindung von שׁוב mit מֵאַחֲרֵי bezeichnet das Abkehren davon, hinter Jahwe herzugehen. „Nachfolge“ gibt den relationalen und bundestreuen Sinn knapp wieder; die wörtliche Bildsprache wird in der Fußnote genannt.
- source_word: לִבְנוֹת מִזְבֵּחַ
  choice: indem wir einen Altar … bauen
  rationale: Der Infinitiv erläutert, wodurch die behauptete Auflehnung und Abkehr geschehen würde. „Indem“ macht diesen Zusammenhang im Deutschen deutlich.
- source_word: לְעֹלָה
  choice: für Brandopfer
  rationale: עֹלָה ist der übliche Fachausdruck für das vollständig verbrannte Opfer.
- source_word: לְמִנְחָה
  choice: Speiseopfer
  rationale: מִנְחָה bezeichnet im kultischen Zusammenhang gewöhnlich ein unblutiges, vor allem aus Getreide bestehendes Opfer. „Speiseopfer“ ist der etablierte deutsche Fachausdruck.
- source_word: וּלְזָבַח
  choice: oder Schlachtopfer
  rationale: זֶבַח bezeichnet ein geschlachtetes Opfer, ohne hier eine engere Opferart festzulegen. „Schlachtopfer“ wahrt diese Breite und unterscheidet den Begriff vom Brandopfer.
- source_word: מִלְּבַד
  choice: zusätzlich zu
  rationale: Die Wendung stellt einen weiteren Altar dem allein rechtmäßigen Altar gegenüber. „Zusätzlich zu“ vermeidet die mögliche räumliche Fehldeutung von „neben“.
- source_word: מִזְבַּח יְהוָה אֱלֹהֵינוּ
  choice: dem Altar Jahwes, unseres Gottes
  rationale: Die Konstruktion wird direkt wiedergegeben und bewahrt das Bekenntnis „unseres Gottes“.
- source_word: אֲשֶׁר לִפְנֵי מִשְׁכָּנוֹ
  choice: der vor seiner Wohnstätte steht
  rationale: מִשְׁכָּן bedeutet „Wohnstätte“ und bezeichnet hier das Heiligtum. Das Possessivpronomen und die räumliche Beziehung לִפְנֵי bleiben erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. „Jahwe“ gibt den offenbarten Bundesnamen als Eigennamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Beziehung zwischen Altarbau und Abkehr von Jahwe
  choice: Der Altarbau wird mit „indem“ als konkrete Gestalt der Auflehnung und Abkehr dargestellt.
  alternative: Die Infinitive lediglich als lose aufeinanderfolgende Handlungen wiederzugeben.
  rationale: Die hebräische Infinitivkonstruktion lässt den Altarbau als das befürchtete beziehungsweise zurückgewiesene Handeln erscheinen, durch das die Abkehr vollzogen würde, ohne über den Text hinaus ein eigenes theologisches Urteil einzuführen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Der einleitende Ausruf trägt die emphatische Zurückweisung; kultische Fachbegriffe werden präzise, aber allgemein verständlich wiedergegeben.
