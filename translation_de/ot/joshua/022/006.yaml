  text: Then Joshua blessed them and sent them away[a], and they went to their tents.
translation:
  language: de
  text: Dann segnete Josua sie, schickte sie fort[a], und sie gingen zu ihren Zelten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „entließ sie“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרְכֵם
  choice: segnete … sie
  rationale: Das Piel von ברך bezeichnet hier, dass Josua den Aufbrechenden seinen Segen erteilt. Die knappe Formulierung ist im Deutschen natürlich und bewahrt die feierliche Handlung.
- source_word: יְהוֹשֻׁעַ
  choice: Josua
  rationale: Der Personenname folgt der im Deutschen etablierten biblischen Namensform.
- source_word: וַיְשַׁלְּחֵם
  choice: entließ sie
  rationale: שלח bezeichnet in diesem Zusammenhang das Entlassen beziehungsweise Aussenden zum Aufbruch. „Entließ sie“ gibt die Handlung präzise und ohne den möglichen negativen Beiklang von „schickte sie weg“ wieder.
- source_word: וַיֵּלְכוּ
  choice: sie zogen
  rationale: הלך ist das gewöhnliche Verb für Gehen. Im Zusammenhang einer Gruppe, die zu ihrem Lager aufbricht, ist „zogen“ natürlich; „kehrten zurück“ würde eine im Verb selbst nicht ausdrücklich enthaltene Rückkehr ergänzen.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition kennzeichnet die Bewegungsrichtung auf ein Ziel hin; „zu“ ist hier die übliche deutsche Entsprechung.
- source_word: אָהֳלֵיהֶם
  choice: ihren Zelten
  rationale: Das Substantiv bedeutet wörtlich „ihre Zelte“. Es kann metonymisch auch das Zuhause oder den Wohnort bezeichnen, doch die wörtliche Wiedergabe ist im historischen Zusammenhang verständlich und bewahrt das konkrete Bild.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Folge der hebräischen Erzählformen wird flüssig mit „Da … und …“ wiedergegeben. Der konkrete Ausdruck „Zelte“ bleibt erhalten; unnötige historische oder theologische Präzisierungen werden vermieden.
