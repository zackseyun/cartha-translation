source:
  edition: WLC
  text: וַ/יִּיטַ֣ב הַ/דָּבָ֗ר בְּ/עֵינֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יְבָרֲכ֥וּ אֱלֹהִ֖ים בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/לֹ֣א אָמְר֗וּ לַ/עֲל֤וֹת עֲלֵי/הֶם֙ לַ/צָּבָ֔א לְ/שַׁחֵת֙ אֶת הָ/אָ֔רֶץ אֲשֶׁ֛ר בְּנֵי רְאוּבֵ֥ן וּ/בְנֵי גָ֖ד יֹשְׁבִ֥ים בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/033.yaml
  text: And the matter was good in the eyes of the sons of Israel[a], and the sons of Israel blessed God[c][b]. And they did not speak of going up against them in war to destroy the land where the sons of Reuben and the sons of Gad were living.
translation:
  language: de
  text: Die Sache fand die Zustimmung der Israeliten[a], und die Israeliten priesen Gott[b]. Sie sprachen nicht davon, gegen sie in den Krieg zu ziehen und das Land zu verwüsten, in dem die Rubeniter und die Gaditer wohnten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »war die Sache gut in den Augen der Söhne Israels«.'
    reason: Die Fußnote bewahrt sowohl das hebräische Bild als auch die wörtliche Volksbezeichnung.
  - marker: b
    text: 'Wörtlich: »segneten Gott«. Gemeint ist, dass sie Gott lobten.'
    reason: Die Fußnote macht die Grundbedeutung des Verbs sichtbar und erläutert dessen Sinn bei Gott als Objekt.
lexical_decisions:
- source_word: וַיִּיטַב הַדָּבָר בְּעֵינֵי
  choice: Die Sache fand die Zustimmung
  rationale: Die hebräische Wendung bedeutet wörtlich, dass die Sache »in ihren Augen gut war«. Die gewählte Formulierung gibt die positive Beurteilung in natürlichem modernem Deutsch wieder.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die wörtliche Form »Söhne Israels« bezeichnet hier das Volk als Gemeinschaft. »Israeliten« ist im Deutschen klarer und natürlich, ohne den Umfang der Aussage zu verändern.
- source_word: וַיְבָרֲכוּ אֱלֹהִים
  choice: priesen Gott
  rationale: ברך bedeutet wörtlich »segnen«; wenn Gott das Objekt ist, bezeichnet es das lobende Preisen Gottes. »Priesen Gott« vermittelt diesen Sinn im Deutschen eindeutig.
- source_word: וְלֹא אָמְרוּ לַעֲלוֹת עֲלֵיהֶם לַצָּבָא
  choice: Sie sprachen nicht mehr davon, gegen sie in den Krieg zu ziehen
  rationale: Wörtlich steht »sie sagten nicht, gegen sie zum Krieg hinaufzuziehen«. Im Zusammenhang ist gemeint, dass der zuvor erwogene Kriegszug nicht weiter zur Sprache kam. »Nicht mehr« wird aus dem Erzählzusammenhang erschlossen.
- source_word: לְשַׁחֵת
  choice: zu verwüsten
  rationale: שחת kann »zerstören«, »zugrunde richten« oder »verwüsten« bedeuten. Da das Land Ziel der Handlung ist, passt »verwüsten« im Deutschen besonders gut.
- source_word: יֹשְׁבִים בָּהּ
  choice: in dem ... wohnten
  rationale: Das Partizip von ישב beschreibt den fortdauernden Wohnsitz. Das Imperfekt »wohnten« ist im deutschen Erzählstil natürlich.
