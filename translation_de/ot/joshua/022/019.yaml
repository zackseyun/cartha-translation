source:
  edition: WLC
  text: וְ/אַ֨ךְ אִם טְמֵאָ֜ה אֶ֣רֶץ אֲחֻזַּתְ/כֶ֗ם עִבְר֨וּ לָ/כֶ֜ם אֶל אֶ֨רֶץ אֲחֻזַּ֤ת יְהוָה֙ אֲשֶׁ֤ר שָֽׁכַן שָׁם֙ מִשְׁכַּ֣ן יְהוָ֔ה וְ/הֵאָחֲז֖וּ בְּ/תוֹכֵ֑/נוּ וּ/בַֽ/יהוָ֣ה אַל תִּמְרֹ֗דוּ וְ/אֹתָ֨/נוּ֙ אֶל תִּמְרֹ֔דוּ בִּ/בְנֹֽתְ/כֶ֤ם לָ/כֶם֙ מִזְבֵּ֔חַ מִֽ/בַּלְעֲדֵ֔י מִזְבַּ֖ח יְהוָ֥ה אֱלֹהֵֽי/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/019.yaml
  text: But if the land of your possession is unclean[a], cross over for yourselves into the land of Yahweh’s possession, where Yahweh’s tabernacle dwells, and take possession among us. Only do not rebel against Yahweh, or against us[d][c][b], by building for yourselves an altar besides the altar of Yahweh our God.
translation:
  language: de
  text: Doch wenn das Land, das euch als Besitz gehört, unrein ist[a], dann zieht hinüber in das Land, das Jahwe als Besitz gehört, wo die Wohnstätte Jahwes ihren Platz hat[b], und nehmt mitten unter uns Land in Besitz[c]. Nur lehnt euch nicht gegen Jahwe auf und nicht gegen uns, indem ihr euch einen Altar baut außer dem Altar Jahwes, unseres Gottes[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „entweiht“ beziehungsweise „kultisch unrein“. Der Text erläutert nicht, worin diese Unreinheit bestünde.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „wo dort die Wohnstätte Jahwes wohnt“.'
    reason: source_idiom
  - marker: c
    text: 'Oder: „lasst euch mitten unter uns nieder“. Das hebräische Verb kann sowohl den Erwerb eines Besitzanteils als auch das Ansiedeln bezeichnen.'
    reason: lexical_alternative
  - marker: d
    text: „Außer“ kann hier auch „neben“ oder „zusätzlich zu“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַךְ
  choice: Doch
  rationale: Gibt die nachdrückliche adversative Einschränkung natürlich wieder.
- source_word: טְמֵאָה
  choice: unrein
  rationale: Bewahrt die kultische Konnotation, ohne die genaue Art der Unreinheit festzulegen.
- source_word: אֶרֶץ אֲחֻזַּתְכֶם
  choice: das Land, das euch als Besitz zugeteilt ist
  rationale: אֲחֻזָּה bezeichnet einen festen, häufig erblichen Landbesitz; die Formulierung ist im modernen Deutsch klar und wahrt den Besitzgedanken.
- source_word: עִבְרוּ לָכֶם
  choice: zieht hinüber
  rationale: Bezeichnet das Übersetzen, wahrscheinlich über den Jordan; der benefaktive Dativ wird im Deutschen idiomatisch nicht eigens ausgedrückt.
- source_word: אֶל אֶרֶץ אֲחֻזַּת יְהוָה
  choice: in das Land, das Jahwe gehört
  rationale: Gibt den Besitzbezug verständlich wieder und vermeidet die missverständliche Vorstellung, Jahwe habe das Land geerbt.
- source_word: אֲשֶׁר שָׁכַן שָׁם מִשְׁכַּן יְהוָה
  choice: wo die Wohnstätte Jahwes ihren Platz hat
  rationale: Bewahrt das Wortspiel zwischen שׁכן und מִשְׁכָּן annähernd und klingt natürlicher als eine personifizierende Aussage, die Wohnstätte selbst wohne.
- source_word: וְהֵאָחֲזוּ בְּתוֹכֵנוּ
  choice: und nehmt mitten unter uns Landbesitz
  rationale: Erhält den Sinn des Erwerbs beziehungsweise Empfangs eines Landanteils und den räumlichen Ausdruck 'mitten unter uns'.
- source_word: וּבַיהוָה אַל תִּמְרֹדוּ וְאֹתָנוּ אַל תִּמְרֹדוּ
  choice: Nur lehnt euch nicht gegen Jahwe und gegen uns auf
  rationale: Das wiederholte Verbot wird im Deutschen zu einer natürlichen koordinierten Wendung zusammengezogen; beide Objekte der Auflehnung bleiben erhalten.
- source_word: בִּבְנֹתְכֶם לָכֶם מִזְבֵּחַ
  choice: indem ihr euch einen Altar baut
  rationale: Gibt den infinitivischen Ausdruck als Mittel beziehungsweise konkrete Form der Auflehnung wieder.
- source_word: מִבַּלְעֲדֵי מִזְבַּח יְהוָה אֱלֹהֵינוּ
  choice: außer dem Altar Jahwes, unseres Gottes
  rationale: Bewahrt die mögliche Bedeutung eines zusätzlichen oder konkurrierenden Altars, ohne die genaue Reichweite des Verbots auszudeuten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den hebräischen Gottesnamen als Eigennamen wieder.
theological_decisions:
- issue: Art der Unreinheit des ostjordanischen Landes
  choice: Die Bedingung wird schlicht mit „wenn ... unrein ist“ wiedergegeben.
  alternative: Die Unreinheit ausdrücklich als kultisch, geografisch oder rhetorisch bestimmen.
  rationale: Der hebräische Text erklärt nicht, in welchem genauen Sinn das Land unrein sein könnte; diese Offenheit bleibt erhalten.
- issue: Charakter des weiteren Altars
  choice: Das Bauen eines Altars „außer dem Altar Jahwes“ wird untersagt.
  alternative: Das Verbot ausdrücklich auf jeden zweiten Altar oder ausschließlich auf einen konkurrierenden Opferaltar beziehen.
  rationale: Der Vers warnt vor einem Altar neben dem legitimen Altar, bestimmt aber hier nicht abschließend die genaue Reichweite des Verbots.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Besitzterminologie wird verständlich entfaltet, der kultische Ausdruck „unrein“ bleibt erhalten, und der Gottesname wird als „Jahwe“ wiedergegeben. Sämtliche Fußnotenmarker stehen unmittelbar bei der jeweils erläuterten Formulierung.
