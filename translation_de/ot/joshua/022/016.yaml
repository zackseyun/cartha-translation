  text: כֹּ֣ה אָמְר֞וּ כֹּ֣ל עֲדַ֣ת יְהוָ֗ה מָֽה הַ/מַּ֤עַל הַ/זֶּה֙ אֲשֶׁ֤ר מְעַלְתֶּם֙ בֵּ/אלֹהֵ֣י יִשְׂרָאֵ֔ל לָ/שׁ֣וּב הַ/יּ֔וֹם מֵ/אַחֲרֵ֖י יְהוָ֑ה בִּ/בְנֽוֹתְ/כֶ֤ם לָ/כֶם֙ מִזְבֵּ֔חַ לִ/מְרָדְ/כֶ֥ם הַ/יּ֖וֹם בַּ/יהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/016.yaml
  text: 'Thus says the whole congregation of Yahweh: ‘What is this breach of faith that you have committed against the God of Israel[a], turning away today from following Yahweh by building for yourselves an altar, rebelling today against Yahweh?’'
translation:
  language: de
  text: 'So spricht die ganze Gemeinde Jahwes: »Was ist das für ein Treuebruch, den ihr gegen den Gott Israels begangen habt[a], dass ihr euch heute von Jahwe abwendet, indem ihr euch einen Altar baut, um euch heute gegen Jahwe aufzulehnen?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Untreue« beziehungsweise »Verrat«. Das hebräische Wort bezeichnet einen Bruch der geschuldeten Treue, besonders gegenüber Gott und im kultischen Bereich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמְרוּ
  choice: So spricht
  rationale: Die deutsche Botenformel wird idiomatisch im Präsens wiedergegeben; das kollektive Subjekt erlaubt den Singular.
- source_word: כֹּל עֲדַת יְהוָה
  choice: die ganze Gemeinde Jahwes
  rationale: „Gemeinde“ bezeichnet hier die versammelte Bundesgemeinschaft und ist zugleich natürliches, würdiges Gegenwartsdeutsch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מָה הַמַּעַל הַזֶּה אֲשֶׁר מְעַלְתֶּם
  choice: Was ist das für ein Treuebruch, den ihr … begangen habt?
  rationale: „Treuebruch“ bewahrt den Gedanken kultischer und bundesbezogener Untreue; „begangen“ bildet die hebräische figura etymologica in natürlichem Deutsch ab.
- source_word: בֵּאלֹהֵי יִשְׂרָאֵל
  choice: gegen den Gott Israels
  rationale: Bei מעל bezeichnet ב den von der Untreue Betroffenen; „gegen“ gibt die feindliche beziehungsweise verletzende Ausrichtung wieder.
- source_word: לָשׁוּב הַיּוֹם מֵאַחֲרֵי יְהוָה
  choice: Heute wendet ihr euch davon ab, Jahwe zu folgen
  rationale: Die Wendung bewahrt sowohl das Abwenden als auch das hebräische Bild des Folgens; die präsentische Form unterstreicht die als gegenwärtig erhobene Anklage.
- source_word: בִּבְנוֹתְכֶם לָכֶם מִזְבֵּחַ
  choice: indem ihr euch einen Altar baut
  rationale: Der mit ב eingeleitete Infinitiv bezeichnet Mittel beziehungsweise Begleitumstand; „euch“ gibt לָכֶם knapp und natürlich wieder.
- source_word: לִמְרָדְכֶם הַיּוֹם בַּיהוָה
  choice: um euch heute gegen Jahwe aufzulehnen
  rationale: Der Infinitiv mit ל kann Zweck oder Ergebnis ausdrücken. „Um“ lässt die anklagende Deutung als Absicht erkennen, ohne den Begriff der Rebellion abzuschwächen.
theological_decisions:
- issue: Wiedergabe von מַעַל als bundesbezogene Verfehlung
  choice: Treuebruch
  alternative: Untreue; Verrat
  rationale: „Treuebruch“ bezeichnet prägnant die Verletzung geschuldeter Loyalität gegenüber dem Gott Israels und vermeidet eine Verflachung zu allgemeiner Sünde.
- issue: Wiedergabe des Tetragramms יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen; seine Wiedergabe als „Jahwe“ erhält diese Unterscheidung gegenüber dem Titel „Herr“.
- issue: Syntaktischer Wert von לִמְרָדְכֶם
  choice: 'Zweckbezogen: „um euch … aufzulehnen“'
  alternative: 'Resultativ/appositionell: „und lehnt euch damit … auf“'
  rationale: ל kann Zweck oder Ergebnis anzeigen. Die Hauptfassung folgt der naheliegenden Zwecknuance innerhalb der Anklage; die resultative Lesart bleibt grammatisch möglich und wird nicht zu einer abweichenden theologischen Aussage ausgebaut.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Ton. Die Wiederholung von „heute“ bleibt wegen ihrer rhetorischen Dringlichkeit erhalten. „Jahwe“ folgt der direkten Wiedergabe des Gottesnamens.
