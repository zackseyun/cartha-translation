source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֲלֵי/הֶ֜ם לֵ/אמֹ֗ר בִּ/נְכָסִ֨ים רַבִּ֜ים שׁ֤וּבוּ אֶל אָֽהֳלֵי/כֶם֙ וּ/בְ/מִקְנֶ֣ה רַב מְאֹ֔ד בְּ/כֶ֨סֶף וּ/בְ/זָהָ֜ב וּ/בִ/נְחֹ֧שֶׁת וּ/בְ/בַרְזֶ֛ל וּ/בִ/שְׂלָמ֖וֹת הַרְבֵּ֣ה מְאֹ֑ד חִלְק֥וּ שְׁלַל אֹיְבֵי/כֶ֖ם עִם אֲחֵי/כֶֽם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/008.yaml
  text: And he said to them[a], “Return to your tents with great wealth, with very much livestock, with silver and gold, with bronze and iron, and with very many garments[c][b]. Divide the plunder of your enemies with your brothers.”
translation:
  language: de
  text: 'Und er sagte zu ihnen: »Kehrt mit großem Reichtum zu euren Zelten zurück, mit sehr viel Vieh, mit Silber und Gold, mit Bronze[a] und Eisen und mit sehr vielen Kleidern. Teilt die Beute eurer Feinde mit euren Brüdern[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Kupfer.'
    reason: lexical_alternative
  - marker: b
    text: Mit den »Brüdern« sind hier ihre israelitischen Brüder aus den anderen Stämmen gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם לֵאמֹר
  choice: Und er sagte zu ihnen
  rationale: Die hebräische Redeformel wird natürlich wiedergegeben; das im Deutschen redundante »indem er sagte« wird nicht eigens ausgedrückt.
- source_word: בִּנְכָסִים רַבִּים
  choice: mit großem Reichtum
  rationale: נְכָסִים bezeichnet Besitz beziehungsweise Vermögen; »großer Reichtum« passt als Oberbegriff zur anschließenden Aufzählung.
- source_word: שׁוּבוּ אֶל אָהֳלֵיכֶם
  choice: Kehrt zu euren Zelten zurück
  rationale: »Zelte« bewahrt das konkrete Bild und den historischen Kontext, ohne es zu »Häusern« zu verallgemeinern.
- source_word: וּבְמִקְנֶה רַב מְאֹד
  choice: mit sehr viel Vieh
  rationale: מִקְנֶה ist eine Sammelbezeichnung für Viehbestand; die Verstärkung רַב מְאֹד wird mit »sehr viel« wiedergegeben.
- source_word: בְּכֶסֶף וּבְזָהָב
  choice: mit Silber und Gold
  rationale: Direkte und geläufige Wiedergabe der beiden Edelmetalle.
- source_word: וּבִנְחֹשֶׁת וּבְבַרְזֶל
  choice: mit Bronze und Eisen
  rationale: נְחֹשֶׁת kann Kupfer oder Bronze bezeichnen; »Bronze« ist in solchen alttestamentlichen Metallaufzählungen eine angemessene konventionelle Wiedergabe, während die Alternative in einer Fußnote erhalten bleibt.
- source_word: וּבִשְׂלָמוֹת הַרְבֵּה מְאֹד
  choice: und mit sehr vielen Kleidern
  rationale: שְׂלָמוֹת bezeichnet Kleidungsstücke; »Kleider« ist verständlich und würdevoll, »sehr vielen« erhält die starke Mengenangabe.
- source_word: חִלְקוּ שְׁלַל אֹיְבֵיכֶם
  choice: Teilt die Beute eurer Feinde
  rationale: Der pluralische Imperativ bleibt direkt; »Beute« gibt den militärischen Sinn von שָׁלָל im heutigen Deutsch natürlich wieder.
- source_word: עִם אֲחֵיכֶם
  choice: mit euren Brüdern
  rationale: Die männliche Verwandtschaftsbezeichnung wird formal bewahrt; im Zusammenhang sind die israelitischen Stammesgenossen gemeint.
theological_decisions:
- issue: Bedeutungsumfang von אֲחֵיכֶם
  choice: mit euren Brüdern
  alternative: mit euren Stammesgenossen / mit den anderen Israeliten
  rationale: Der Haupttext wahrt die geschlechtlich markierte hebräische Verwandtschaftssprache. Eine Fußnote erklärt, dass hier die israelitischen Brüder aus den anderen Stämmen gemeint sind, ohne den Ausdruck im Text zu neutralisieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die lange Aufzählung und ihre wiederholten Präpositionalgruppen bleiben erkennbar, werden aber idiomatisch geordnet. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Wörtern.
