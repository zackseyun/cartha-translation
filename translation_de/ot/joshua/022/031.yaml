  source_fidelity: 'Eine Korrektur ist erforderlich: Der hebräische Vers nennt בני מנשה, die Manassiten, ohne den Zusatz „halben Stamm“. Dieser Zusatz stammt zwar aus dem Kontext, ist aber im vorliegenden Vers nicht ausgedrückt. Die Wiedergabe des Treuebruch-Ausdrucks ist zudem im Entwurf unnötig schwer verständlich und bildet die syntaktische Aussage nicht idiomatisch ab.'
  naturalness: „Mit dieser Untreue keine Untreue ... begangen“ ist im modernen Standarddeutsch holprig und semantisch missverständlich. „... in dieser Sache nicht die Treue gebrochen habt“ ist natürlich, bewahrt den Gedanken des schweren Treuebruchs und lässt die Bezugnahme auf die konkrete Angelegenheit erkennen.
  terminology: „Jahwe“, „Pinhas“, „Eleasar“, „Rubeniten“, „Gaditen“ und „Manassiten“ sind angemessen. „Aus der Hand Jahwes“ kann als bewusst beibehaltenes hebräisches Bild stehen; die Fußnote erklärt es ausreichend.
  issues:
