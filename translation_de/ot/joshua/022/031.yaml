source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר פִּֽינְחָ֣ס בֶּן אֶלְעָזָ֣ר הַ/כֹּהֵ֡ן אֶל בְּנֵי רְאוּבֵ֨ן וְ/אֶל בְּנֵי גָ֜ד וְ/אֶל בְּנֵ֣י מְנַשֶּׁ֗ה הַ/יּ֤וֹם יָדַ֨עְנוּ֙ כִּֽי בְ/תוֹכֵ֣/נוּ יְהוָ֔ה אֲשֶׁ֛ר לֹֽא מְעַלְתֶּ֥ם בַּֽ/יהוָ֖ה הַ/מַּ֣עַל הַ/זֶּ֑ה אָ֗ז הִצַּלְתֶּ֛ם אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל מִ/יַּ֥ד יְהוָֽה־־־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/031.yaml
  text: And Phinehas son of Eleazar the priest said to the sons of Reuben[a], and to the sons of Gad, and to the sons of Manasseh, “Today we know that Yahweh is among us, because you have not acted unfaithfully against Yahweh in this matter[c][b]. Then you have delivered the sons of Israel from the hand of Yahweh.”
translation:
  language: de
  text: 'Und der Priester Pinhas, der Sohn Eleasars, sagte zu den Rubeniten, den Gaditen und den Manassiten: »Heute wissen wir, dass Jahwe in unserer Mitte ist, weil ihr in dieser Sache nicht die Treue gegen Jahwe gebrochen habt.[a] So habt ihr die Israeliten aus der Hand Jahwes gerettet.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »weil ihr gegen Jahwe diesen Treuebruch nicht begangen habt«. Das hebräische Wort bezeichnet einen schweren Treuebruch.'
    reason: lexical_alternative
  - marker: b
    text: '»Aus der Hand Jahwes« bedeutet hier: vor Jahwes Macht beziehungsweise seinem drohenden Gericht.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und … sagte
  rationale: Bewahrt den hebräischen Erzählanschluss, ohne eine stärkere zeitliche oder logische Beziehung einzutragen.
- source_word: פִּינְחָס בֶּן אֶלְעָזָר הַכֹּהֵן
  choice: der Priester Pinhas, der Sohn Eleasars
  rationale: Die deutsche Wortstellung macht eindeutig, dass Pinhas als Priester bezeichnet wird; zugleich bleibt die Abstammungsangabe erhalten.
- source_word: אֶל בְּנֵי רְאוּבֵן וְאֶל בְּנֵי גָד וְאֶל בְּנֵי מְנַשֶּׁה
  choice: zu den Rubenitern, den Gaditern und dem halben Stamm Manasse
  rationale: Deutsche Stammesbezeichnungen sind natürlicher als die wörtliche Wiedergabe »Söhne«. Aus dem unmittelbaren Erzählzusammenhang ist der halbe Stamm Manasse gemeint.
- source_word: הַיּוֹם יָדַעְנוּ
  choice: Heute wissen wir
  rationale: Gibt die gegenwärtig gewonnene Gewissheit knapp und unmittelbar wieder.
- source_word: בְּתוֹכֵנוּ
  choice: in unserer Mitte
  rationale: Bewahrt das räumlich-gemeinschaftliche Bild der göttlichen Gegenwart; »unter uns« wäre ebenfalls möglich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder.
- source_word: לֹא מְעַלְתֶּם בַּיהוָה הַמַּעַל הַזֶּה
  choice: ihr habt mit dieser Untreue keine Untreue gegen Jahwe begangen
  rationale: Die auffällige Verbindung von Verb und stammgleichem Substantiv wird bewusst sichtbar gehalten. »Untreue« vermittelt den Gedanken eines schwerwiegenden Treuebruchs.
- source_word: אָז
  choice: So
  rationale: Kennzeichnet hier die Folge beziehungsweise Schlussfolgerung natürlicher als ein rein zeitliches »Dann«, ohne die Beziehung auf eine einzige Nuance festzulegen.
- source_word: הִצַּלְתֶּם אֶת בְּנֵי יִשְׂרָאֵל
  choice: habt ihr die Israeliten … gerettet
  rationale: »Israeliten« ist die natürliche deutsche Wiedergabe von »Söhne Israels«; das Hifil von נצל bezeichnet Rettung oder Befreiung.
- source_word: מִיַּד יְהוָה
  choice: aus der Hand Jahwes
  rationale: Das hebräische Bild wird beibehalten; im Zusammenhang bezeichnet es die Abwendung von Jahwes drohendem Gericht.
theological_decisions:
- issue: Aussage über Gottes Gegenwart
  choice: Jahwe ist in unserer Mitte
  alternative: Jahwe ist unter uns
  rationale: Die Übersetzung bewahrt die Aussage von Jahwes Gegenwart in der Gemeinschaft, ohne sie durch spätere theologische Kategorien näher festzulegen.
- issue: Bedeutung der מעל-Wortgruppe
  choice: mit dieser Untreue keine Untreue gegen Jahwe begangen
  alternative: diesen Treuebruch an Jahwe nicht begangen
  rationale: Die stammgleiche Wiederholung und das Gewicht eines Treuebruchs bleiben erkennbar. Die Formulierung lässt zugleich die rhetorische Spannung stehen, dass der zunächst verdächtigte Altarbau als »diese Untreue« bezeichnet wird, die sich gerade nicht als Untreue erwiesen hat.
- issue: Rettung aus Jahwes Hand
  choice: bildhafte Wendung wörtlich beibehalten
  alternative: vor Jahwes Gericht bewahrt
  rationale: Der Text stellt Jahwe selbst als den Handelnden dar, dessen Macht oder Gericht Israel bedroht hätte. Die wörtliche Wendung bewahrt diese theologische Spannung, während die Fußnote das Bild erklärt.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Stammesbezeichnungen werden idiomatisch wiedergegeben; die auffällige hebräische Wiederholung bei »Untreue« sowie das Bild »aus der Hand Jahwes« bleiben aus Gründen der Textnähe erhalten.
