revisions:
- from: 'Und der Priester Pinhas, der Sohn Eleasars, sagte zu den Rubenitern, den Gaditern und dem halben Stamm Manasse: »Heute wissen wir, dass Jahwe in unserer Mitte ist, denn ihr habt mit dieser Untreue keine Untreue gegen Jahwe begangen.[a] So habt ihr die Israeliten aus der Hand Jahwes gerettet.«[b]'
  to: 'Und der Priester Pinhas, der Sohn Eleasars, sagte zu den Rubeniten, den Gaditen und den Manassiten: »Heute wissen wir, dass Jahwe in unserer Mitte ist, weil ihr in dieser Sache nicht die Treue gegen Jahwe gebrochen habt.[a] So habt ihr die Israeliten aus der Hand Jahwes gerettet.«[b]'
  rationale: Die Revision entfernt die nicht im Vers selbst enthaltene Angabe „halben Stamm“ und ersetzt die missverständliche Wiederholung „Untreue ... Untreue“ durch eine natürliche deutsche Formulierung. Sie bewahrt dabei die Aussage eines nicht begangenen Treuebruchs gegen Jahwe, die Gegenwart Jahwes „in unserer Mitte“ sowie das absichtlich wörtlich erhaltene Bild der Rettung „aus der Hand Jahwes“.
