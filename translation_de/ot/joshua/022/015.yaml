base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/015.yaml
  text: And they came to the sons of Reuben[a], and to the sons of Gad, and to the half-tribe of Manasseh, in the land of Gilead, and they spoke with them, saying[b],
translation:
  language: de
  text: 'Sie kamen zu den Rubenitern, zu den Gaditern und zum halben Stamm Manasse ins Land Gilead und redeten mit ihnen:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Sie kamen
  rationale: Das Qal-Wayyiqtol von בוא bezeichnet hier die erzählte Ankunft; „kamen“ gibt die schlichte Bewegungsangabe natürlich wieder.
- source_word: בְּנֵי רְאוּבֵן / בְּנֵי גָד
  choice: Rubeniter / Gaditer
  rationale: In Stammesbezeichnungen meint בְּנֵי die Angehörigen beziehungsweise Nachkommen; die deutschen Stammesnamen sind natürlicher als das wörtliche „Söhne Rubens/Gads“.
- source_word: חֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: der halbe Stamm Manasse
  rationale: Die feste deutsche Wendung entspricht der hebräischen Stammesbezeichnung klar und eng.
- source_word: אֶל אֶרֶץ הַגִּלְעָד
  choice: in das Land Gilead
  rationale: אֶל behält seine direktionale Bedeutung „in … hinein/zu“; die Formulierung bezeichnet das Ziel ihrer Ankunft und lässt zugleich erkennen, wo die angesprochenen Stämme waren.
- source_word: וַיְדַבְּרוּ אִתָּם
  choice: redeten mit ihnen
  rationale: דבר mit אֵת bezeichnet hier das Reden mit den Angesprochenen; „mit ihnen“ bildet die Präposition ab, ohne bloß einseitiges Anreden festzulegen.
- source_word: לֵאמֹר
  choice: 'Sie sagten:'
  rationale: Die deutsche Einleitung direkter Rede ist natürlicher als das hebraisierende „indem sie sagten“ und wahrt die Verbindung zum folgenden Wortlaut.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konventionellen Stammesbezeichnungen „Rubeniter“ und „Gaditer“ vermeiden eine missverständliche Beschränkung auf leibliche Söhne. Der Vers endet mit einem Doppelpunkt, da die direkte Rede im folgenden Vers beginnt.
