  text: וַֽ/יִּקְרְא֛וּ בְּנֵי רְאוּבֵ֥ן וּ/בְנֵי גָ֖ד לַ/מִּזְבֵּ֑חַ כִּ֣י עֵ֥ד הוּא֙ בֵּֽינֹתֵ֔י/נוּ כִּ֥י יְהוָ֖ה הָ/אֱלֹהִֽים־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/034.yaml
  text: And the sons of Reuben and the sons of Gad called the altar Witness[a], for it is a witness between us that Yahweh is God.
translation:
  language: de
  text: Und die Rubeniter und Gaditer nannten den Altar »Zeuge«[a], denn er ist ein Zeuge zwischen uns dafür, dass Jahwe Gott ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder ausführlicher: Sie nannten den Altar »Ein Zeuge zwischen uns dafür, dass Jahwe Gott ist«. Dabei wird der erklärende Satz als Teil des Namens verstanden und nicht als Begründung für ihn.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: nannten
  rationale: קרא mit ל und dem benannten Gegenstand bezeichnet hier das Geben eines Namens; »nannten« ist im Deutschen eindeutig und natürlich.
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד
  choice: die Söhne Rubens und die Söhne Gads
  rationale: Die Wiedergabe bewahrt die konkrete hebräische Abstammungsformulierung und den Bezug zu den Stammvätern.
- source_word: לַמִּזְבֵּחַ
  choice: den Altar
  rationale: מִזְבֵּחַ wird standardmäßig mit »Altar« wiedergegeben; der Akkusativ ergibt sich aus der deutschen Konstruktion mit »nennen«.
- source_word: עֵד
  choice: Zeuge
  rationale: Das Substantiv bedeutet »Zeuge« beziehungsweise »Zeugnis«. Als ausdrücklich genannter Name wird es durch Anführungszeichen kenntlich gemacht.
- source_word: כִּי עֵד הוּא
  choice: denn er ist ein Zeuge
  rationale: Das erste כִּי wird erklärend-kausal verstanden. Das maskuline Pronomen bezieht sich grammatisch und sachlich auf den Altar, daher »er«.
- source_word: בֵּינֹתֵינוּ
  choice: zwischen uns
  rationale: Die Wendung bezeichnet die Beziehung zwischen den beteiligten Gruppen; »zwischen uns« ist die direkte und idiomatische deutsche Entsprechung.
- source_word: כִּי יְהוָה הָאֱלֹהִים
  choice: dafür, dass Jahwe Gott ist
  rationale: Das zweite כִּי führt den Inhalt des Zeugnisses ein. »dafür, dass« bindet diesen Inhalt im Deutschen klar an »Zeuge«, ohne die Aussage theologisch auszudeuten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Ob die erklärende Aussage als Teil eines längeren Altarnamens zu verstehen ist
  choice: Im Haupttext nur »Zeuge« als Namen wiedergeben und den folgenden Satz als Begründung verstehen
  alternative: 'Den gesamten Ausdruck als Namen auffassen: »Ein Zeuge zwischen uns, dass Jahwe Gott ist«'
  rationale: Der masoretische Wortlaut lässt syntaktisch sowohl eine erklärende Begründung als auch ein expansives Verständnis des Namens zu. Der Haupttext folgt der naheliegenden kausalen Gliederung, während die echte Mehrdeutigkeit in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die formale Stammesbezeichnung »Söhne Rubens … Söhne Gads« bleibt erhalten. Der Name des Altars steht in deutschen Anführungszeichen; das Fußnotenzeichen folgt unmittelbar darauf.
