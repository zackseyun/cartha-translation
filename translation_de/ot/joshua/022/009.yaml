  text: וַ/יָּשֻׁ֣בוּ וַ/יֵּלְכ֡וּ בְּנֵי רְאוּבֵ֨ן וּ/בְנֵי גָ֜ד וַ/חֲצִ֣י שֵׁ֣בֶט הַֽ/מְנַשֶּׁ֗ה מֵ/אֵת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל מִ/שִּׁלֹ֖ה אֲשֶׁ֣ר בְּ/אֶֽרֶץ כְּנָ֑עַן לָ/לֶ֜כֶת אֶל אֶ֣רֶץ הַ/גִּלְעָ֗ד אֶל אֶ֤רֶץ אֲחֻזָּתָ/ם֙ אֲשֶׁ֣ר נֹֽאחֲזוּ בָ֔/הּ עַל פִּ֥י יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/009.yaml
  text: So the sons of Reuben and the sons of Gad and the half-tribe of Manasseh returned and departed from the sons of Israel[a], from Shiloh, which is in the land of Canaan, to go to the land of Gilead, to the land of their possession, which they had taken possession of by the command of Yahweh through Moses.
translation:
  language: de
  text: So kehrten die Rubeniter, die Gaditer und der halbe Stamm Manasse um und zogen von den Israeliten fort, von Schilo im Land Kanaan, um in das Land Gilead zu ziehen, in das Land ihres Besitzes, in dem sie nach dem Befehl Jahwes durch Mose Besitz erhalten hatten[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das sie in Besitz genommen hatten“. Das hebräische Verb kann hier sowohl das Erlangen beziehungsweise Innehaben des Landes als auch die Besitzergreifung betonen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ וַיֵּלְכוּ
  choice: kehrten ... um und zogen ... fort
  rationale: 'Die beiden hebräischen Verben bleiben erkennbar: שוב bezeichnet die Umkehr beziehungsweise Rückkehr, הלך die anschließende Bewegung. Die deutsche Formulierung vermeidet dennoch unnötige Schwerfälligkeit.'
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד וַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: die Rubeniter, die Gaditer und der halbe Stamm Manasse
  rationale: Die Volksbezeichnungen sind im heutigen Deutsch natürlicher als die wörtliche Form „Söhne Rubens/Gads“, während „der halbe Stamm Manasse“ die hebräische Struktur genau wiedergibt.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: von den übrigen Israeliten
  rationale: Das ergänzte „übrigen“ macht deutlich, dass die genannten Gruppen selbst zu Israel gehören, und gibt die Trennung von der versammelten Gemeinschaft sinngemäß wieder.
- source_word: מִשִּׁלֹה אֲשֶׁר בְּאֶרֶץ כְּנָעַן
  choice: von Schilo im Land Kanaan
  rationale: Die kompakte deutsche Ortsangabe gibt den Inhalt des hebräischen Relativsatzes vollständig und natürlich wieder.
- source_word: אֶל אֶרֶץ הַגִּלְעָד
  choice: in das Land Gilead
  rationale: „Land“ bewahrt den territorialen Akzent von אֶרֶץ.
- source_word: אֶל אֶרֶץ אֲחֻזָּתָם
  choice: in das Land ihres Erbbesitzes
  rationale: אֲחֻזָּה bezeichnet einen rechtmäßig zugewiesenen, bleibenden Landbesitz. „Erbbesitz“ bringt diesen rechtlich-territorialen Sinn idiomatisch zum Ausdruck.
- source_word: אֲשֶׁר נֹאחֲזוּ בָהּ
  choice: in dem sie Besitz erhalten hatten
  rationale: Die Form von אחז kann hier das Erlangen beziehungsweise Innehaben des Landes ausdrücken. Die gewählte Fassung wahrt den resultativen Sinn und vermeidet die Festlegung auf gewaltsame Aneignung.
- source_word: עַל פִּי יְהוָה
  choice: nach dem Befehl Jahwes
  rationale: Die Wendung עַל־פִּי bezeichnet hier die maßgebliche Anordnung. „Nach dem Befehl“ ist im Deutschen klar und idiomatisch.
- source_word: בְּיַד מֹשֶׁה
  choice: durch Mose
  rationale: Die hebräische Mittlerformel „durch die Hand Moses“ bezeichnet Vermittlung beziehungsweise Beauftragung; „durch Mose“ gibt dies in modernem Deutsch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. „Jahwe“ gibt den Eigennamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Art des Landerwerbs in נֹאחֲזוּ
  choice: sie hatten Besitz erhalten
  alternative: sie hatten es in Besitz genommen
  rationale: Der Kontext verbindet den Besitz mit Jahwes Befehl durch Mose. Die gewählte Form lässt sowohl Zuweisung als auch tatsächliche Besitzergreifung anklingen, ohne die grammatisch-lexikalische Spannung einseitig aufzulösen.
translation_notes:
  register: Moderne, würdige Standardsprache. Ethnonyme ersetzen die im Deutschen missverständliche wörtliche Wendung „Söhne Rubens/Gads“. Die Wiederholung von „Land“ und die Abfolge der Bewegungsverben bleiben wegen des territorialen und erzählerischen Nachdrucks des Hebräischen erhalten.
