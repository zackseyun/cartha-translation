source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֔ם אַתֶּ֣ם שְׁמַרְתֶּ֔ם אֵ֚ת כָּל אֲשֶׁ֣ר צִוָּ֣ה אֶתְ/כֶ֔ם מֹשֶׁ֖ה עֶ֣בֶד יְהוָ֑ה וַ/תִּשְׁמְע֣וּ בְ/קוֹלִ֔/י לְ/כֹ֥ל אֲשֶׁר צִוִּ֖יתִי אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/002.yaml
  text: And he said to them[a], “You have kept all that Moses the servant of Yahweh commanded you, and you have listened to my voice in all that I commanded you.”
translation:
  language: de
  text: 'Und er sagte zu ihnen: »Ihr habt alles befolgt, was Mose, der Diener Jahwes, euch geboten hat, und ihr habt in allem, was ich euch geboten habe, auf meine Stimme gehört.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und ihr habt mir in allem gehorcht, was ich euch geboten habe.« Die hebräische Wendung »auf meine Stimme hören« schließt häufig ein, dem Gehörten gehorsam zu folgen.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: Und er sagte zu ihnen
  rationale: Das narrative וַ führt die Handlung fort; die Präposition mit Suffix bezeichnet die Angesprochenen.
- source_word: שְׁמַרְתֶּם אֵת כָּל אֲשֶׁר צִוָּה אֶתְכֶם
  choice: Ihr habt alles befolgt, was … euch geboten hat
  rationale: שׁמר bezeichnet im Zusammenhang mit Geboten deren treue Beachtung. »Befolgt« gibt diesen Sinn im heutigen Deutsch klar wieder.
- source_word: מֹשֶׁה עֶבֶד יְהוָה
  choice: Mose, der Diener Jahwes
  rationale: עֶבֶד ist hier ein ehrender Amtstitel für Mose in seinem Dienst für Gott; »Diener« ist kontextgemäßer als »Sklave«. Der Gottesname wird als »Jahwe« wiedergegeben.
- source_word: וַתִּשְׁמְעוּ בְקוֹלִי
  choice: und ihr habt … auf meine Stimme gehört
  rationale: Die Wiedergabe bewahrt das hebräische Bild und lässt zugleich den im Kontext mitschwingenden Gehorsam erkennen.
- source_word: לְכֹל אֲשֶׁר צִוִּיתִי אֶתְכֶם
  choice: in allem, was ich euch geboten habe
  rationale: Die Formulierung gibt den umfassenden Geltungsbereich der Anweisungen natürlich und präzise wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen; »Jahwe« bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von עֶבֶד als Bezeichnung für Mose
  choice: Diener
  alternative: Sklave
  rationale: Bei Mose fungiert das Wort hier als ehrender Titel für seinen beauftragten Dienst an Jahwe; ein rechtlicher Sklavenstatus steht nicht im Vordergrund.
- issue: Idiom שׁמע בקול
  choice: auf meine Stimme gehört
  alternative: mir gehorcht
  rationale: Die gewählte Form bewahrt die Bildsprache des Hebräischen. Da das Idiom auch gehorsames Reagieren meint, wird die eindeutigere Sinnalternative in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Befolgt« vermeidet das im Deutschen missverständliche »bewahrt« bei Geboten; »auf meine Stimme gehört« erhält bewusst das hebräische Idiom. Der Fußnotenmarker steht unmittelbar nach dem betroffenen Satzteil am Versende.
