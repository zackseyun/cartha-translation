source:
  edition: WLC
  text: וַ/יִּשְׁלְח֨וּ בְנֵֽי יִשְׂרָאֵ֜ל אֶל בְּנֵי רְאוּבֵ֧ן וְ/אֶל בְּנֵי גָ֛ד וְ/אֶל חֲצִ֥י שֵֽׁבֶט מְנַשֶּׁ֖ה אֶל אֶ֣רֶץ הַ/גִּלְעָ֑ד אֶת פִּינְחָ֖ס בֶּן אֶלְעָזָ֥ר הַ/כֹּהֵֽן־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/013.yaml
  text: Then the sons of Israel sent Phinehas son of Eleazar the priest to the sons of Reuben[a], to the sons of Gad, and to the half-tribe of Manasseh, in the land of Gilead.
translation:
  language: de
  text: Da sandten die Israeliten Pinhas, den Sohn des Priesters Eleasar, in das Land Gilead zu den Rubenitern, den Gaditern und dem halben Stamm Manasse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: Da sandten
  rationale: Das konsekutive Waw führt die Erzählung weiter; „Da“ gibt die zeitlich-fortschreitende Erzählbewegung natürlich wieder.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Wörtlich „Söhne Israels“; als Bezeichnung des Volkes ist „Israeliten“ im heutigen Deutschen klarer und idiomatischer.
- source_word: בְּנֵי רְאוּבֵן וְאֶל בְּנֵי גָד
  choice: zu den Rubenitern, den Gaditern
  rationale: Die hebräischen Wendungen lauten wörtlich „Söhne Rubens“ und „Söhne Gads“; die Volksbezeichnungen sind im Deutschen natürlich und bezeichnen hier die Stammesangehörigen.
- source_word: חֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: dem halben Stamm Manasse
  rationale: Gibt die hebräische Genitivverbindung knapp und eindeutig wieder.
- source_word: אֶל אֶרֶץ הַגִּלְעָד
  choice: in das Land Gilead
  rationale: אֶל bezeichnet hier das Ziel der Sendung; „in das Land Gilead“ wahrt diese Richtungsangabe.
- source_word: אֶת פִּינְחָס בֶּן אֶלְעָזָר הַכֹּהֵן
  choice: Pinhas, den Sohn des Priesters Eleasar
  rationale: Die Stellung des Artikels bei „Priester“ lässt die Amtsbezeichnung am natürlichsten auf Eleasar beziehen; der Akkusativ wird im Deutschen durch die Apposition sichtbar.
theological_decisions:
- issue: Bezug der Bezeichnung הַכֹּהֵן („der Priester“)
  choice: 'Eleasar wird als Priester bezeichnet: „den Sohn des Priesters Eleasar“'
  alternative: 'Pinhas wird bezeichnet: „Pinhas, den Sohn Eleasars, den Priester“'
  rationale: Nach hebräischer Syntax und dem bekannten Titel Eleasars ist der Bezug auf Eleasar am wahrscheinlichsten. Die alternative Zeichensetzung wäre im Deutschen missverständlich und kontextuell weniger naheliegend.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Stammesbezeichnungen werden idiomatisch wiedergegeben; die Satzstellung rückt wie im Hebräischen zunächst die sendenden Israeliten und dann den Gesandten hervor.
