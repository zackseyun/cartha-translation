  naturalness: Nach Ersetzung von »wollt euch ... abwenden« durch »wendet euch ... ab« ist der Text natürliches modernes Standarddeutsch. Die rhetorische Frage und das würdige biblische Register sind passend.
  terminology: »Jahwe«, »sich gegen ... auflehnen« und »die ganze Gemeinde Israels« sind sachgerecht. Die Fußnote erklärt transparent, dass das Subjekt von יִקְצֹף im Hebräischen nicht ausdrücklich genannt wird.
