source:
  edition: WLC
  text: וְ/אַתֶּם֙ תָּשֻׁ֣בוּ הַ/יּ֔וֹם מֵ/אַחֲרֵ֖י יְהוָ֑ה וְ/הָיָ֗ה אַתֶּ֞ם תִּמְרְד֤וּ הַ/יּוֹם֙ בַּֽ/יהוָ֔ה וּ/מָחָ֕ר אֶֽל כָּל עֲדַ֥ת יִשְׂרָאֵ֖ל יִקְצֹֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/018.yaml
  text: And you are turning away today from following Yahweh[a]; and if you rebel today against Yahweh[c][b], tomorrow he will be angry with the whole congregation of Israel.
translation:
  language: de
  text: Und ihr wendet euch heute davon ab, Jahwe nachzufolgen? Wenn ihr euch heute gegen Jahwe auflehnt, wird er morgen über die ganze Gemeinde Israels zornig sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht kein ausdrückliches Subjekt bei »wird … zornig sein«; aus dem Zusammenhang ist Jahwe gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּשֻׁבוּ מֵאַחֲרֵי יְהוָה
  choice: ihr wollt euch ... davon abwenden, Jahwe nachzufolgen
  rationale: שוב mit מֵאַחֲרֵי bezeichnet hier im Kontext die Abkehr von der Nachfolge Jahwes. Die deutsche Frageform gibt den vorwurfsvollen rhetorischen Zusammenhang wieder, ohne die lexikalische Bedeutung abzuschwächen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: תִּמְרְדוּ בַּיהוָה
  choice: ihr euch ... gegen Jahwe auflehnt
  rationale: מרד mit ב bezeichnet offenen Widerstand gegen die rechtmäßige Autorität; »sich gegen ... auflehnen« ist natürliches, gegenwärtiges Deutsch und bewahrt die Stärke des Ausdrucks.
- source_word: וּמָחָר
  choice: morgen
  rationale: Die unmittelbare zeitliche Folge und Dringlichkeit der Warnung bleibt erhalten.
- source_word: יִקְצֹף
  choice: wird er ... zornig sein
  rationale: קצף bezeichnet heftigen Zorn. Das Pronomen bewahrt das im Hebräischen nur implizite Subjekt.
- source_word: כָּל עֲדַת יִשְׂרָאֵל
  choice: die ganze Gemeinde Israels
  rationale: עֵדָה meint die korporative Versammlung beziehungsweise Bundesgemeinschaft Israels; »Gemeinde Israels« ist würdig, verständlich und traditionsnah.
theological_decisions:
- issue: Implizites Subjekt von יִקְצֹף
  choice: Das Pronomen »er« bleibt im Haupttext stehen; gemeint ist aus dem Kontext Jahwe.
  alternative: Den Namen »Jahwe« als Subjekt ausdrücklich ergänzen oder unpersönlich »Zorn wird kommen« übersetzen.
  rationale: Das Hebräische nennt an dieser Stelle kein ausdrückliches Subjekt. »Er« wahrt diese Form, während der unmittelbare Kontext Jahwe eindeutig als den Zornigen nahelegt.
- issue: Korporative Folge der Rebellion
  choice: Der Zorn trifft »die ganze Gemeinde Israels«.
  alternative: Die Aussage individualisieren oder auf die rebellierenden Stämme beschränken.
  rationale: Der hebräische Text betont ausdrücklich die gemeinschaftliche Verantwortung und Folge für ganz Israel; diese theologische Spannung darf nicht eingeebnet werden.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem biblischem Register. Die rhetorische Frage bildet den vorwurfsvollen Zusammenhang ab. »Gemeinde Israels« bewahrt den korporativen Sinn; der Gottesname erscheint als »Jahwe«.
