  variant: modern standard German
source:
  edition: WLC
  text: הַ/מְעַט לָ֨/נוּ֙ אֶת עֲוֺ֣ן פְּע֔וֹר אֲשֶׁ֤ר לֹֽא הִטַּהַ֨רְנוּ֙ מִמֶּ֔/נּוּ עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וַ/יְהִ֥י הַ/נֶּ֖גֶף בַּ/עֲדַ֥ת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/017.yaml
  text: Was the iniquity of Peor too little for us[a], from which we have not cleansed ourselves to this day[b], and the plague came upon the congregation of Yahweh?
translation:
  language: de
  text: Ist uns die Schuld von Peor[a] nicht genug, von der wir uns bis zum heutigen Tag nicht gereinigt haben, und die Plage kam über die Gemeinde Jahwes?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann auch »Sünde« oder die aus der Schuld erwachsende Folge bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְעַט לָנוּ
  choice: Ist uns … nicht genug
  rationale: 'Die hebräische rhetorische Frage bedeutet wörtlich etwa: »Ist … zu wenig für uns?« Die gewählte deutsche Form gibt den vorwurfsvollen Sinn natürlich wieder, ohne die Aussage zu verstärken.'
- source_word: עֲוֹן
  choice: Schuld
  rationale: Das Wort kann die Verfehlung, die dadurch entstandene Schuld oder auch deren Folgen bezeichnen. »Schuld« bewahrt hier die moralische und gemeinschaftliche Dimension und lässt die Bedeutungsbreite teilweise offen.
- source_word: פְּעוֹר
  choice: Peor
  rationale: Der hebräische Text nennt hier nur »Peor«; die ausführlichere Bezeichnung »Baal-Peor« aus verwandten Texten wird nicht in den Vers hineingetragen.
- source_word: לֹא הִטַּהַרְנוּ מִמֶּנּוּ
  choice: von der wir uns … nicht gereinigt haben
  rationale: Die reflexive Verbform bezeichnet, dass sich die Gemeinschaft von dieser Verunreinigung nicht gereinigt hat.
- source_word: הַנֶּגֶף
  choice: die Plage
  rationale: Das Substantiv bezeichnet in diesem Gerichtszusammenhang die tödliche Heimsuchung, die Israel wegen des Geschehens bei Peor traf.
- source_word: בַּעֲדַת יְהוָה
  choice: über die Gemeinde Jahwes
  rationale: »Gemeinde« bezeichnet die versammelte Bundesgemeinschaft; mit »über … kam« wird der deutsche Ausdruck für das Eintreffen einer Plage verwendet.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der persönliche Gottesname wird als »Jahwe« wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von עֲוֹן
  choice: Schuld
  alternative: Sünde; Schuldfolge
  rationale: Der Zusammenhang verbindet die Verfehlung bei Peor mit fortdauernder Unreinheit und der Plage. »Schuld« hält diese Spannung offen, ohne das Wort ausschließlich als Tat oder ausschließlich als Strafe zu deuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage bleibt als zusammenhängender Satz erhalten; die einfache Verbindung mit »und« vermeidet zusätzliche Deutungen wie »obwohl«, »deshalb« oder »dennoch«.
