revisions:
- from: Und nun hat Jahwe, euer Gott, euren Brüdern[a] Ruhe verschafft, wie er zu ihnen gesagt hat[b]. So wendet euch nun um und geht zu euren Zelten[c], in das Land, das euer Besitz ist und das Mose, der Diener Jahwes, euch jenseits des Jordan[d] gegeben hat.
  to: Und nun hat Jahwe, euer Gott, euren Brüdern[a] Ruhe verschafft, wie er ihnen gesagt hat[b]. Wendet euch nun um und geht zu euren Zelten[c], in das Land eures Besitzes, das Mose, der Diener Jahwes, euch jenseits des Jordan[d] gegeben hat.
  rationale: Die Revision glättet zwei geringfügige sprachliche Punkte, ohne den Sinn oder Grad der Explizitheit zu verändern. Insbesondere bleibt die nicht näher spezifizierte Aussage Gottes im Haupttext als „gesagt“ erhalten; „versprochen“ bleibt eine ausdrücklich markierte Alternative in der Fußnote.
