  source_fidelity: 'Der Entwurf gibt die hebräische Satzfolge und die wesentlichen Ausdrücke zutreffend wieder: Jahwe gewährt den Brüdern Ruhe; die Angesprochenen sollen zu ihren Zelten und in ihr Land zurückkehren, das Mose ihnen jenseits des Jordan gegeben hatte. Die Konstruktion אֶרֶץ אֲחֻזַּתְכֶם ist jedoch genauer als „Land eures Besitzes“ wiederzugeben; „das euer Besitz ist“ löst die Konstruktion zwar verständlich auf, ist aber unnötig umständlich und weniger idiomatisch.'
