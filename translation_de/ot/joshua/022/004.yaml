  terminology: „Jahwe“, „Brüder“, „Ruhe verschafft“, „Zelte“, „Diener Jahwes“ und „jenseits des Jordan“ sind terminologisch angemessen. Die Fußnoten sind korrekt verankert und bieten sinnvolle, nicht doktrinär festlegende Alternativen.
