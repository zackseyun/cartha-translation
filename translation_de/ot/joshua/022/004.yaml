  text: וְ/עַתָּ֗ה הֵנִ֨יחַ יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ לַֽ/אֲחֵי/כֶ֔ם כַּ/אֲשֶׁ֖ר דִּבֶּ֣ר לָ/הֶ֑ם וְ/עַתָּ֡ה פְּנוּ֩ וּ/לְכ֨וּ לָ/כֶ֜ם לְ/אָהֳלֵי/כֶ֗ם אֶל אֶ֨רֶץ֙ אֲחֻזַּתְ/כֶ֔ם אֲשֶׁ֣ר נָתַ֣ן לָ/כֶ֗ם מֹשֶׁה֙ עֶ֣בֶד יְהוָ֔ה בְּ/עֵ֖בֶר הַ/יַּרְדֵּֽן־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/004.yaml
  text: And now Yahweh your God has given rest to your brothers[a], just as he spoke to them. So now turn and go to your tents, to the land of your possession[d][c][b], which Moses the servant of Yahweh gave you beyond the Jordan.
translation:
  language: de
  text: Und nun hat Jahwe, euer Gott, euren Brüdern[a] Ruhe verschafft, wie er ihnen gesagt hat[b]. Wendet euch nun um und geht zu euren Zelten[c], in das Land eures Besitzes, das Mose, der Diener Jahwes, euch jenseits des Jordan[d] gegeben hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit den „Brüdern“ sind ihre israelitischen Volksgenossen gemeint.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wie er es ihnen versprochen hatte“. Wörtlich: „wie er ihnen gesagt hat“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder sinngemäß: „zu euren Wohnstätten“ oder „nach Hause“. Wörtlich: „zu euren Zelten“.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „auf der anderen Seite des Jordan“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵנִיחַ
  choice: hat … Ruhe verschafft
  rationale: Der Hifil von נוח bezeichnet hier das Gewähren von Ruhe beziehungsweise Frieden nach den Kämpfen. „Ruhe verschafft“ ist im Deutschen natürlich und bewahrt den aktiven Kausativsinn.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im modernen Standarddeutschen übliche Form.
- source_word: לַאֲחֵיכֶם
  choice: euren Brüdern
  rationale: Die maskuline Pluralform bezeichnet in diesem Stammes- und Militärzusammenhang die übrigen Israeliten und bewahrt zugleich das Bild der brüderlichen Verbundenheit.
- source_word: כַּאֲשֶׁר דִּבֶּר לָהֶם
  choice: wie er zu ihnen gesagt hat
  rationale: דבר bedeutet wörtlich „reden/sagen“. Die Wiedergabe vermeidet es, den im Kontext möglichen Verheißungscharakter bereits im Haupttext festzulegen.
- source_word: פְּנוּ וּלְכוּ לָכֶם
  choice: wendet euch nun um und geht
  rationale: „Wendet euch um“ erhält das Bild des hebräischen Imperativs; der ethische Dativ לָכֶם benötigt im Deutschen keine eigene Wiedergabe.
- source_word: לְאָהֳלֵיכֶם
  choice: zu euren Zelten
  rationale: Die konkrete Bedeutung „Zelte“ wird trotz der möglichen idiomatischen Bedeutung „Wohnstätten/Heimat“ bewahrt.
- source_word: אֶל אֶרֶץ אֲחֻזַּתְכֶם
  choice: in das Land, das euer Besitz ist
  rationale: אֲחֻזָּה bezeichnet bleibenden Landbesitz. Diese Formulierung ist verständlicher als „Land eures Besitzes“ und vermeidet die stärker deutende Wiedergabe „Erbteil“.
- source_word: עֶבֶד יְהוָה
  choice: der Diener Jahwes
  rationale: In der ehrenvollen Bezeichnung für Mose passt „Diener“ besser als „Sklave“, ohne das Abhängigkeitsverhältnis zu verwischen.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: jenseits des Jordan
  rationale: Die Wendung bezeichnet das Gebiet auf der anderen Seite des Jordan aus der Perspektive des Sprechers; „jenseits“ ist knapp und idiomatisch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. Seine Wiedergabe als „Jahwe“ bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Charakter von Gottes vorausgehendem Wort
  choice: wie er zu ihnen gesagt hat
  alternative: wie er ihnen versprochen hatte
  rationale: Der Kontext lässt an eine Zusage denken, doch das Verb דבר sagt zunächst nur, dass Gott gesprochen hat. Der Haupttext bewahrt diese Offenheit; die alternative Deutung steht in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzführung. Die konkreten Bilder „Brüder“ und „Zelte“ sowie der Gottesname bleiben erhalten; mögliche idiomatische oder stärker deutende Wiedergaben werden in Fußnoten genannt.
