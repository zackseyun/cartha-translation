  text: וַ/יִּשְׁמְע֥וּ בְנֵֽי יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הִנֵּ֣ה בָנ֣וּ בְנֵֽי רְאוּבֵ֣ן וּ/בְנֵי גָ֡ד וַ/חֲצִי֩ שֵׁ֨בֶט הַֽ/מְנַשֶּׁ֜ה אֶת הַ/מִּזְבֵּ֗חַ אֶל מוּל֙ אֶ֣רֶץ כְּנַ֔עַן אֶל גְּלִילוֹת֙ הַ/יַּרְדֵּ֔ן אֶל עֵ֖בֶר בְּנֵ֥י יִשְׂרָאֵֽל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/011.yaml
  text: And the sons of Israel heard it said[a], “Look, the sons of Reuben and the sons of Gad and the half-tribe of Manasseh have built the altar opposite the land of Canaan, in the region of the Jordan[d][c][b], on the side of the sons of Israel.”
translation:
  language: de
  text: 'Und die Israeliten hörten folgende Meldung[a]: »Seht, die Rubeniter, die Gaditer und der halbe Stamm Manasse haben den Altar gegenüber dem Land Kanaan gebaut, im Gebiet des Jordan[b], auf der Seite der Israeliten[c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „Die Israeliten hörten, indem gesagt wurde“ oder „Die Israeliten hörten sagen“. Die hebräische Formel leitet den Inhalt einer Meldung ein.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „in den Bezirken/Gegenden des Jordan“. Die genaue geografische Bedeutung der Wendung ist unsicher.'
    reason: cultural_note
  - marker: c
    text: Die hebräische Schlussformulierung ist schwer zu deuten. Sie kann „auf der Seite der Israeliten“, also auf der ihnen zugehörigen Seite, bedeuten; möglich ist auch „jenseits, den Israeliten gegenüber“.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ בְנֵי יִשְׂרָאֵל לֵאמֹר
  choice: Und die Israeliten hörten folgende Meldung
  rationale: Die hebräische Berichtsformel wird in natürlichem modernem Deutsch wiedergegeben. „Israeliten“ bezeichnet idiomatisch die בְנֵי יִשְׂרָאֵל; die Wiederholung derselben Wendung am Versende wird dort eigens berücksichtigt.
- source_word: הִנֵּה
  choice: Seht
  rationale: Bewahrt den aufmerksamkeitslenkenden Charakter der Partikel in würdigem, verständlichem Deutsch.
- source_word: בְנֵי רְאוּבֵן וּבְנֵי גָד
  choice: die Rubeniter, die Gaditer
  rationale: Die deutschen Volksbezeichnungen sind natürlicher als „Söhne Rubens“ und „Söhne Gads“, ohne den korporativen Sinn zu verändern.
- source_word: בָנוּ ... אֶת הַמִּזְבֵּחַ
  choice: haben den Altar ... gebaut
  rationale: Das Perfekt bezeichnet die als vollendet gemeldete Handlung; der bestimmte Artikel des Hebräischen bleibt erhalten.
- source_word: אֶל מוּל אֶרֶץ כְּנַעַן
  choice: gegenüber dem Land Kanaan
  rationale: „Gegenüber“ wahrt die räumliche Relation, ohne sie als bloßes Ausgerichtetsein oder als genaue Himmelsrichtung festzulegen.
- source_word: גְּלִילוֹת הַיַּרְדֵּן
  choice: im Gebiet des Jordan
  rationale: גְּלִילוֹת bezeichnet hier Bezirke oder eine Gegend; der Singular „Gebiet“ ist im Deutschen idiomatisch, während eine Fußnote die unsichere geografische Nuance kenntlich macht.
- source_word: אֶל עֵבֶר בְּנֵי יִשְׂרָאֵל
  choice: auf der den Israeliten zugewandten Seite
  rationale: Die schwierige Schlussformulierung wird relational und ohne endgültige geografische Festlegung wiedergegeben. Sie kann die Israel zugehörige Seite oder eine Israel gegenüberliegende beziehungsweise zugewandte Lage meinen.
