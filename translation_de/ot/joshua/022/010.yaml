source:
  edition: WLC
  text: וַ/יָּבֹ֨אוּ֙ אֶל גְּלִיל֣וֹת הַ/יַּרְדֵּ֔ן אֲשֶׁ֖ר בְּ/אֶ֣רֶץ כְּנָ֑עַן וַ/יִּבְנ֣וּ בְנֵי רְאוּבֵ֣ן וּ/בְנֵי גָ֡ד וַ/חֲצִ֣י שֵׁבֶט֩ הַֽ/מְנַשֶּׁ֨ה שָׁ֤ם מִזְבֵּ֨חַ֙ עַל הַ/יַּרְדֵּ֔ן מִזְבֵּ֥חַ גָּד֖וֹל לְ/מַרְאֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/010.yaml
  text: When they came to the region of the Jordan that is in the land of Canaan[b][a], the sons of Reuben and the sons of Gad and the half-tribe of Manasseh built there an altar by the Jordan—an altar great in appearance.
translation:
  language: de
  text: Als sie in die Jordangegend kamen, die im Land Kanaan liegt,[a] bauten die Söhne Rubens, die Söhne Gads und der halbe Stamm Manasse dort am Jordan einen großen Altar, der weithin sichtbar war.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »in die Bezirke« oder »an die Grenzen des Jordan«; das hebräische Wort bezeichnet ein Gebiet beziehungsweise eine umliegende Region.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: »einen Altar, groß für den Anblick«; auch: »einen großen Altar, der ins Auge fiel«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּלִילוֹת
  choice: Jordangegend
  rationale: Das Substantiv bezeichnet ein umliegendes Gebiet beziehungsweise einen Bezirk. »Jordangegend« gibt den geografischen Sinn im modernen Deutsch natürlich wieder, ohne das wörtliche, hier unklare Bild von »Kreisen« zu übernehmen.
- source_word: וַיָּבֹאוּ אֶל
  choice: Als sie … kamen
  rationale: Die Erzählform führt die Handlung fort; im Zusammenhang bildet die Ankunft den zeitlichen Rahmen für den Bau des Altars.
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנָעַן
  choice: die im Land Kanaan liegt
  rationale: Der Relativsatz bleibt ausdrücklich erhalten und kennzeichnet die gemeinte Jordangegend geografisch näher.
- source_word: בְנֵי רְאוּבֵן וּבְנֵי גָד
  choice: die Söhne Rubens, die Söhne Gads
  rationale: Die Wiedergabe bewahrt die hebräische familiär-stammesbezogene Ausdrucksweise. Gemeint sind die Angehörigen beziehungsweise Nachkommen der beiden Stämme.
- source_word: חֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: der halbe Stamm Manasse
  rationale: Dies ist eine klare und im Deutschen geläufige Wiedergabe der hebräischen Konstruktverbindung.
- source_word: עַל הַיַּרְדֵּן
  choice: am Jordan
  rationale: Die Präposition bezeichnet hier in natürlichem Deutsch die Lage beim beziehungsweise nahe dem Jordan, nicht notwendig unmittelbar auf ihm.
- source_word: מִזְבֵּחַ גָּדוֹל לְמַרְאֶה
  choice: einen Altar, groß anzusehen
  rationale: Die Formulierung hält sowohl die Größe als auch die auffällige sichtbare Erscheinung fest, ohne den Zweck des Altars oder die Absicht seiner Erbauer vorwegzunehmen.
theological_decisions:
- issue: Möglicher Eindruck eines konkurrierenden Kultaltars
  choice: Der Bau und die auffällige Erscheinung des Altars werden rein beschreibend wiedergegeben.
  alternative: »einen gewaltigen/imposanten Altar« oder eine Formulierung, die bereits einen unrechtmäßigen Opferkult nahelegt
  rationale: Der Vers selbst beurteilt den Altar noch nicht und erklärt noch nicht, ob er für Opfer bestimmt war. Die Übersetzung wahrt deshalb die erzählerische und theologische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die stammesbezogene Wendung »Söhne Rubens/Gads« bewahrt bewusst das hebräische Familienbild; der Gedankenstrich hebt wie im Ausgangstext die nähere Beschreibung des Altars hervor.
