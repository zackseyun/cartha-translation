source:
  edition: WLC
  text: וַ/נֹּ֕אמֶר וְ/הָיָ֗ה כִּֽי יֹאמְר֥וּ אֵלֵ֛י/נוּ וְ/אֶל דֹּרֹתֵ֖י/נוּ מָחָ֑ר וְ/אָמַ֡רְנוּ רְא֣וּ אֶת תַּבְנִית֩ מִזְבַּ֨ח יְהוָ֜ה אֲשֶׁר עָשׂ֣וּ אֲבוֹתֵ֗י/נוּ לֹ֤א לְ/עוֹלָה֙ וְ/לֹ֣א לְ/זֶ֔בַח כִּי עֵ֣ד ה֔וּא בֵּינֵ֖י/נוּ וּ/בֵינֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/028.yaml
  text: 'So we said[a], ‘If they should say to us or to our generations in time to come, then we will say: “Look at the pattern of the altar of Yahweh, which our fathers made—not for burnt offering and not for sacrifice, but it is a witness between us and you.”’'
translation:
  language: de
  text: 'Darum sagten wir: »Wenn sie künftig zu uns oder zu unseren Nachkommen sagen sollten, dann werden wir antworten: ›Seht das Abbild[a] des Altars Jahwes, das unsere Väter gemacht haben – nicht für Brandopfer und nicht für Schlachtopfer, sondern es ist ein Zeuge zwischen uns und euch.‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Muster«, »Nachbildung« beziehungsweise »Darstellung« des Altars Jahwes. Das hebräische Wort bezeichnet dessen Form oder Gestalt; dieser Altar sollte als Zeugnis dienen und nicht als Opferaltar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: Darum sagten wir
  rationale: Das narrative וַ wird im erklärenden Zusammenhang folgernd wiedergegeben; „sagten wir“ bewahrt Person und Erzähltempus.
- source_word: וְהָיָה כִּי
  choice: Wenn … sagen sollten
  rationale: Die Wendung führt einen künftigen möglichen Fall ein; der deutsche Konditionalsatz gibt diese Kontingenz natürlich wieder.
- source_word: יֹאמְרוּ אֵלֵינוּ וְאֶל דֹּרֹתֵינוּ מָחָר
  choice: sie künftig zu uns oder zu unseren Nachkommen sagen sollten
  rationale: מָחָר bezeichnet hier idiomatisch eine spätere Zeit. דֹּרֹתֵינוּ meint die nachfolgenden Generationen und wird verständlich mit „unsere Nachkommen“ wiedergegeben. Das im Kontext distributiv verstandene וְ erscheint als „oder“.
- source_word: וְאָמַרְנוּ
  choice: dann werden wir antworten
  rationale: „Dann“ markiert den Hauptsatz der Bedingung; „antworten“ entspricht der Funktion des Sagens als Erwiderung.
- source_word: רְאוּ
  choice: Seht
  rationale: Der knappe Imperativ ist in modernem, würdigem Deutsch natürlich und bewahrt die Mehrzahl.
- source_word: תַּבְנִית
  choice: Abbild
  rationale: Das Wort bezeichnet Form, Gestalt, Muster oder Nachbildung. „Abbild“ macht hier verständlich, dass dieser Altar den Altar Jahwes darstellt, ohne selbst der Opferaltar zu sein.
- source_word: מִזְבַּח יְהוָה
  choice: des Altars Jahwes
  rationale: Die Status-constructus-Verbindung wird als deutscher Genitiv wiedergegeben; der Gottesname wird als „Jahwe“ transliteriert.
- source_word: אֲשֶׁר עָשׂוּ אֲבוֹתֵינוּ
  choice: das unsere Väter gemacht haben
  rationale: Das Relativpronomen bezieht sich sachgerecht auf „Abbild“. „Unsere Väter“ bewahrt die ausdrücklich maskuline Verwandtschaftsbezeichnung.
- source_word: לֹא לְעוֹלָה וְלֹא לְזֶבַח
  choice: nicht für Brandopfer und nicht für Schlachtopfer
  rationale: Die doppelte Verneinung wird zur Betonung erhalten. עֹלָה ist das Brandopfer; זֶבַח bezeichnet hier das geschlachtete Opfer und wird zur Unterscheidung als „Schlachtopfer“ wiedergegeben.
- source_word: כִּי עֵד הוּא
  choice: sondern es ist ein Zeuge
  rationale: כִּי führt nach den Verneinungen den eigentlichen Zweck kontrastierend ein. Das selbstständige Pronomen הוּא und der Nominalsatz bleiben in „es ist“ sichtbar.
- source_word: בֵּינֵינוּ וּבֵינֵיכֶם
  choice: zwischen uns und euch
  rationale: Die Beziehungsaussage und die Mehrzahl der Angeredeten werden direkt bewahrt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ gibt ihn im Deutschen als gebräuchliche wissenschaftliche Transliteration wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Funktion des errichteten Altars
  choice: Abbild und Zeuge, nicht Opferstätte
  alternative: Muster beziehungsweise Nachbildung des Altars
  rationale: Der Vers verneint ausdrücklich die Nutzung für Brand- und Schlachtopfer und nennt das Bauwerk einen Zeugen. Die Übersetzung bewahrt beides, ohne weiter festzulegen, in welchem technischen Sinn תַּבְנִית gebraucht ist.
- issue: Wiedergabe von אֲבוֹתֵינוּ
  choice: unsere Väter
  alternative: unsere Vorfahren
  rationale: Die konkrete maskuline Form des Ausgangstextes bleibt erhalten; die neutralere Alternative wäre möglich, aber weniger formnah.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die verschachtelte direkte Rede und die doppelte Verneinung des Hebräischen bleiben erkennbar; altertümliche Wendungen werden vermieden.
