lexical_decisions:
- source_word: אָז
  choice: Dann
  rationale: Zeitlicher Erzählmarker, der das nächste Geschehen in der Abfolge einleitet.
- source_word: יִקְרָא
  choice: rief
  rationale: Das Qal-Verb bezeichnet hier das Herbeirufen der genannten Gruppen; „rief“ ist direkt und natürlich, ohne die stärkere amtliche Nuance von „berief“ oder „ließ vorladen“.
- source_word: יְהוֹשֻׁעַ
  choice: Josua
  rationale: Eingebürgerte deutsche Form des hebräischen Personennamens.
- source_word: לָרֽאוּבֵנִי
  choice: die Rubeniter
  rationale: Das Gentiliz im Singular wird kollektiv für die Angehörigen des Stammes Ruben gebraucht.
- source_word: וְלַגָּדִי
  choice: die Gaditer
  rationale: Wie beim vorangehenden Gentiliz bezeichnet der Singular kollektiv die Angehörigen des Stammes Gad.
- source_word: וְלַחֲצִי מַטֵּה מְנַשֶּׁה
  choice: den halben Stamm Manasse
  rationale: מַטֶּה bezeichnet hier den Stamm als soziale Einheit; die deutsche Wendung gibt die Konstruktion klar und idiomatisch wieder.
