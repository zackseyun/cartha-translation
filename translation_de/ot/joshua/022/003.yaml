  rationale: Die Revision entfernt die nicht im Ausgangstext ausgedrückte Aussage, Jahwe habe den Auftrag gegeben, und macht das „Gebot“ wieder explizit. Die semantische Entfaltung der hebräischen Konstruktverbindung als „die Pflicht erfüllen, ... zu befolgen“ ist im Deutschen klar und bewahrt sowohl den Pflicht- als auch den Gehorsamsaspekt.
