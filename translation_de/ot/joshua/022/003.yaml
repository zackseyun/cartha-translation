  text: לֹֽא עֲזַבְתֶּ֣ם אֶת אֲחֵי/כֶ֗ם זֶ֚ה יָמִ֣ים רַבִּ֔ים עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וּ/שְׁמַרְתֶּ֕ם אֶת מִשְׁמֶ֕רֶת מִצְוַ֖ת יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/003.yaml
  text: You have not forsaken your brothers these many days[a], up to this day, and you have kept the charge of the commandment of Yahweh your God.
translation:
  language: de
  text: Ihr habt eure Brüder all diese vielen Tage bis zum heutigen Tag nicht verlassen und habt die Pflicht erfüllt, das Gebot Jahwes, eures Gottes, zu befolgen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Brüder“ sind hier die übrigen Israeliten gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲזַבְתֶּם
  choice: habt ... nicht verlassen
  rationale: עזב bedeutet „verlassen“, „aufgeben“ oder „im Stich lassen“. „Nicht verlassen“ bewahrt das Beziehungsgewicht des hebräischen Ausdrucks und klingt im Deutschen natürlich.
- source_word: אֲחֵיכֶם
  choice: eure Brüder
  rationale: Der hebräische Ausdruck ist ein maskuliner Plural und bezeichnet hier die israelitischen Stammesgenossen. Die wörtliche Verwandtschaftsbezeichnung bleibt im Haupttext erhalten; der weitere Bezug wird in einer Fußnote erläutert.
- source_word: זֶה יָמִים רַבִּים
  choice: während dieser langen Zeit
  rationale: Die hebräische Zeitangabe bezeichnet eine lange, bis in die Gegenwart reichende Dauer. Diese Wiedergabe ist modern und natürlich, ohne den deiktischen Bezug von זֶה ganz aufzugeben.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: bis zum heutigen Tag
  rationale: Die feste Wendung markiert die Fortdauer bis zum gegenwärtigen Zeitpunkt.
- source_word: וּשְׁמַרְתֶּם
  choice: habt ... befolgt
  rationale: שׁמר bezeichnet hier das treue Einhalten beziehungsweise Ausführen einer auferlegten Verpflichtung.
- source_word: מִשְׁמֶרֶת מִצְוַת
  choice: den euch anvertrauten Auftrag ... den ... euch gegeben hat
  rationale: Die Konstruktion bezeichnet eine aus einem Gebot erwachsende, zur treuen Wahrnehmung übertragene Pflicht. Die verbale deutsche Fassung gibt dieses Verhältnis verständlich wieder und vermeidet die schwerfällige Formulierung „die Verpflichtung des Gebots“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname Gottes wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵיכֶם
  choice: euer Gott
  rationale: Direkte Wiedergabe der Bundesbezeichnung im Anschluss an den Gottesnamen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst; „Jahwe“ bewahrt ihn als Eigennamen.
- issue: Referenzbereich von אֲחֵיכֶם
  choice: eure Brüder
  alternative: eure israelitischen Stammesgenossen
  rationale: Die grammatisch maskuline Verwandtschaftsbezeichnung wird im Haupttext bewahrt. Dass sie hier im weiteren Sinn die übrigen Israeliten bezeichnet, wird in der Fußnote kenntlich gemacht.
- issue: Verhältnis von מִשְׁמֶרֶת und מִצְוַת
  choice: den euch anvertrauten Auftrag ... den ... euch gegeben hat
  alternative: die Verpflichtung des Gebots Jahwes
  rationale: Die hebräische Genitivverbindung lässt sich formal schwerfällig oder semantisch entfaltet wiedergeben. Die gewählte Fassung erhält sowohl den Gedanken der anvertrauten Pflicht als auch ihren Ursprung im göttlichen Gebot.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Syntax wurde gegenüber der hebräischen Konstruktionskette behutsam entfaltet, um natürliche Verständlichkeit zu erreichen; der Gottesname und die verwandtschaftliche Bezeichnung bleiben ausdrücklich erhalten.
