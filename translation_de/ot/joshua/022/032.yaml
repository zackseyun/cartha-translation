  text: וַ/יָּ֣שָׁב פִּֽינְחָ֣ס בֶּן אֶלְעָזָ֣ר הַ/כֹּהֵ֣ן וְ/הַ/נְּשִׂיאִ֡ים מֵ/אֵ֣ת בְּנֵֽי רְאוּבֵן֩ וּ/מֵ/אֵ֨ת בְּנֵי גָ֜ד מֵ/אֶ֧רֶץ הַ/גִּלְעָ֛ד אֶל אֶ֥רֶץ כְּנַ֖עַן אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יָּשִׁ֥בוּ אוֹתָ֖/ם דָּבָֽר־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/032.yaml
  text: Then Phinehas son of Eleazar the priest[a], and the leaders, returned from the sons of Reuben and from the sons of Gad, from the land of Gilead to the land of Canaan, to the sons of Israel[b], and brought back word to them.
translation:
  language: de
  text: Da kehrten Pinhas, der Sohn des Priesters Eleasar, und die Stammesoberhäupter von den Rubenitern und den Gaditern aus dem Land Gilead in das Land Kanaan zu den Israeliten zurück und überbrachten ihnen Bericht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und berichteten ihnen von der Angelegenheit“. Das hebräische Wort kann je nach Zusammenhang „Wort“, „Angelegenheit“ oder „Bericht“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: Da kehrten … zurück
  rationale: Das singularische Verb steht vor einem zusammengesetzten Subjekt und wird im Deutschen sinngemäß im Plural wiedergegeben. „Da“ führt die nächste Handlung der Erzählung natürlich fort.
- source_word: פִּינְחָס בֶּן אֶלְעָזָר הַכֹּהֵן
  choice: Pinhas, der Sohn des Priesters Eleasar
  rationale: Die Stellung von הַכֹּהֵן lässt grammatisch am ehesten Eleasar als Priester erkennen; die deutsche Formulierung macht diese Zuordnung klar, ohne Pinhas’ aus dem Kontext bekannte priesterliche Stellung zusätzlich einzutragen.
- source_word: וְהַנְּשִׂיאִים
  choice: und die Stammesoberhäupter
  rationale: נְשִׂיאִים bezeichnet hier die mitgesandten führenden Vertreter der Stämme. „Stammesoberhäupter“ ist präziser als das allgemeinere „Anführer“ und vermeidet die monarchische Färbung von „Fürsten“.
- source_word: מֵאֵת בְּנֵי רְאוּבֵן וּמֵאֵת בְּנֵי גָד
  choice: von den Rubenitern und den Gaditern
  rationale: „Söhne Rubens/Gads“ ist hier eine hebräische Stammesbezeichnung. Die deutschen Volksbezeichnungen geben die Funktion natürlich und genau wieder; die wiederholte Präposition wird idiomatisch zusammengezogen.
- source_word: מֵאֶרֶץ הַגִּלְעָד אֶל אֶרֶץ כְּנַעַן
  choice: aus dem Land Gilead in das Land Kanaan
  rationale: Die Wiederholung von אֶרֶץ wird als „Land“ bewahrt und hebt den geografischen Wechsel hervor. „Aus … in“ entspricht der deutschen Bewegungsrichtung.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: zu den Israeliten
  rationale: Die wörtlichen „Söhne Israels“ bezeichnen idiomatisch das Volk Israel. „Israeliten“ ist im modernen Deutsch klar und verhindert eine missverständliche Beschränkung auf männliche Nachkommen.
- source_word: וַיָּשִׁבוּ אוֹתָם דָּבָר
  choice: und überbrachten ihnen Bericht
  rationale: Die Wendung bezeichnet das Zurückbringen einer Nachricht beziehungsweise eines Berichts. „Überbrachten ihnen Bericht“ ist würdig und natürlich; die Bedeutungsbreite von דָּבָר wird in der Fußnote sichtbar gehalten.
theological_decisions: []
