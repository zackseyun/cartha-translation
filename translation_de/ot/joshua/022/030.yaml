translation_notes:
  register: Modernes, würdiges Standarddeutsch mit moderat formaler Satzstruktur. Der institutionelle Ausdruck »Tausendschaften« bleibt im Haupttext erhalten und wird in der Fußnote erläutert; die Stammesbezeichnungen werden idiomatisch deutsch wiedergegeben.
