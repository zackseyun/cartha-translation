  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֞ע פִּֽינְחָ֣ס הַ/כֹּהֵ֗ן וּ/נְשִׂיאֵ֨י הָ/עֵדָ֜ה וְ/רָאשֵׁ֨י אַלְפֵ֤י יִשְׂרָאֵל֙ אֲשֶׁ֣ר אִתּ֔/וֹ אֶת הַ֨/דְּבָרִ֔ים אֲשֶׁ֧ר דִּבְּר֛וּ בְּנֵי רְאוּבֵ֥ן וּ/בְנֵי גָ֖ד וּ/בְנֵ֣י מְנַשֶּׁ֑ה וַ/יִּיטַ֖ב בְּ/עֵינֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/030.yaml
  text: When Phinehas the priest[a], the leaders of the congregation, and the heads of the thousands of Israel who were with him heard the words that the sons of Reuben, the sons of Gad, and the sons of Manasseh spoke[b], it was good in their eyes.
translation:
  language: de
  text: Als der Priester Pinhas, die führenden Männer der Gemeinde und die Oberhäupter der Tausendschaften Israels[a], die bei ihm waren, die Worte hörten, die die Rubeniter, die Gaditer und die Manassiter gesprochen hatten, fanden sie es gut.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich: »die Oberhäupter der Tausende Israels«. Gemeint sind wahrscheinlich Leiter von Sippen oder anderen Stammesuntereinheiten, nicht zwingend Einheiten von genau tausend Männern.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »es gefiel ihnen«; »es erschien ihnen richtig«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: hörten
  rationale: שׁמע bezeichnet hier im erzählenden Zusammenhang das Hören der vorgetragenen Worte. Wegen des zusammengesetzten Subjekts wird im Deutschen der Plural verwendet.
- source_word: פִּינְחָס הַכֹּהֵן
  choice: der Priester Pinhas
  rationale: Die im Deutschen natürliche Titel-Namen-Folge gibt die appositionale Bestimmung des hebräischen Ausdrucks klar wieder.
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: die führenden Männer der Gemeinde
  rationale: נְשִׂיאִים sind anerkannte Oberhäupter oder führende Vertreter; הָעֵדָה bezeichnet hier die Gemeinschaft Israels. Diese Wiedergabe ist modern und unterscheidet die Gruppe sprachlich von den folgenden רָאשֵׁי.
- source_word: רָאשֵׁי אַלְפֵי יִשְׂרָאֵל
  choice: die Oberhäupter der Tausendschaften Israels
  rationale: Die Wiedergabe bewahrt den institutionellen Ausdruck אַלְפֵי, ohne ihn vorschnell als exakte Zahl oder als Sippenbezeichnung festzulegen; eine Fußnote erläutert den möglichen Sinn.
- source_word: אֲשֶׁר אִתּוֹ
  choice: die bei ihm waren
  rationale: Der Relativsatz wird eng am Hebräischen wiedergegeben; das Pronomen verweist eindeutig auf Pinhas.
- source_word: הַדְּבָרִים אֲשֶׁר דִּבְּרוּ
  choice: die Worte, die … gesprochen hatten
  rationale: Die Verbindung von דְּבָרִים und דבר wird formal bewahrt. Das Plusquamperfekt macht im Deutschen deutlich, dass die Rede vor ihrer Reaktion erfolgt war.
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד וּבְנֵי מְנַשֶּׁה
  choice: die Rubeniter, die Gaditer und die Manassiter
  rationale: Die deutschen Stammesbezeichnungen geben das hebräische ‚Söhne von‘ natürlich und eindeutig wieder, ohne die Zugehörigkeit auf leibliche Söhne zu verengen.
- source_word: וַיִּיטַב בְּעֵינֵיהֶם
  choice: fanden sie es gut
  rationale: Die deutsche Formulierung bildet die hebräische Blick-/Urteilsidiomatik verständlich ab und wahrt deren Sinn, ohne die Reaktion stärker als bloßes Gefallen zu emotionalisieren.
