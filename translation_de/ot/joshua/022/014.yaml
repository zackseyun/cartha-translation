  text: וַ/עֲשָׂרָ֤ה נְשִׂאִים֙ עִמּ֔/וֹ נָשִׂ֨יא אֶחָ֜ד נָשִׂ֤יא אֶחָד֙ לְ/בֵ֣ית אָ֔ב לְ/כֹ֖ל מַטּ֣וֹת יִשְׂרָאֵ֑ל וְ/אִ֨ישׁ רֹ֧אשׁ בֵּית אֲבוֹתָ֛/ם הֵ֖מָּה לְ/אַלְפֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/014.yaml
  text: and with him ten leaders[a], one leader for each ancestral house from all the tribes of Israel; and each of them was the head of his ancestral house among the thousands of Israel.
translation:
  language: de
  text: Und mit ihm zehn führende Männer, je einen Anführer eines Vaterhauses aus jedem Stamm Israels; jeder von ihnen war das Oberhaupt seines Vaterhauses unter den Tausendschaften Israels.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann wörtlich „Tausende“ bedeuten, hier aber auch größere Sippen- oder Stammesgliederungen bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְשִׂאִים / נָשִׂיא
  choice: führende Männer
  rationale: נָשִׂיא bezeichnet einen herausgehobenen Führer oder Stammesobersten. „Führende Männer“ ist im heutigen Deutsch verständlich, wahrt den offiziellen Rang und vermeidet das missverständliche „Fürsten“.
- source_word: עִמּוֹ
  choice: mit ihm
  rationale: Die Präposition mit Pronominalsuffix verweist auf Pinhas im vorhergehenden Vers.
- source_word: נָשִׂיא אֶחָד נָשִׂיא אֶחָד
  choice: je einen
  rationale: Die Wiederholung hat distributive Funktion. „Je einen“ gibt diesen Sinn idiomatisch und knapp wieder.
- source_word: לְבֵית אָב
  choice: aus einem Vaterhaus
  rationale: בֵּית אָב ist eine feste Bezeichnung für eine patriarchalisch gegliederte Großfamilie beziehungsweise Abstammungsgruppe. „Vaterhaus“ bewahrt die konkrete Sozialstruktur des hebräischen Ausdrucks.
- source_word: לְכֹל מַטּוֹת יִשְׂרָאֵל
  choice: jedes Stammes Israels
  rationale: Die Formulierung bringt die verteilende Zuordnung der Vertreter zu den betreffenden Stämmen in natürlichem Deutsch zum Ausdruck.
- source_word: וְאִישׁ
  choice: Jeder von ihnen
  rationale: אִישׁ wird hier distributiv gebraucht und bezieht sich auf die zehn genannten Männer.
- source_word: רֹאשׁ בֵּית אֲבוֹתָם
  choice: das Oberhaupt seines Vaterhauses
  rationale: רֹאשׁ bezeichnet hier den Leiter beziehungsweise das Oberhaupt einer Abstammungsgruppe. Die Übersetzung erhält sowohl das Amt als auch die verwandtschaftliche Struktur.
- source_word: לְאַלְפֵי יִשְׂרָאֵל
  choice: unter den Tausendschaften Israels
  rationale: אֶלֶף kann neben der Zahl Tausend auch eine soziale oder militärische Gliederung bezeichnen. „Tausendschaften“ hält die Verbindung zum hebräischen Ausdruck fest, ohne eindeutig eine bloße Personenzahl zu behaupten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die sozialen Fachbegriffe „Vaterhaus“ und „Tausendschaften“ bewahren die altisraelitische Verwaltungs- und Verwandtschaftsstruktur; die Fußnote erhält die echte Bedeutungsbreite von אֶלֶף.
