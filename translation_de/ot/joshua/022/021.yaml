  text: 'Then the sons of Reuben[a], the sons of Gad, and the half-tribe of Manasseh answered and spoke to the heads of the clans of Israel:'
translation:
  language: de
  text: 'Da antworteten die Söhne Rubens, die Söhne Gads und der halbe Stamm Manasse und sprachen zu den Häuptern der Tausendschaften Israels[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zu den Häuptern der Tausendschaften Israels“. „Tausendschaften“ kann hier soziale, militärische oder administrative Untergliederungen bezeichnen; wahrscheinlich sind deren führende Personen gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: Da antworteten
  rationale: ענה im Qal mit konsekutivem ו führt hier die Erwiderung auf die vorausgehende Anklage ein. „Da“ bildet den erzählerischen Anschluss natürlich ab.
- source_word: בְּנֵי רְאוּבֵן
  choice: die Söhne Rubens
  rationale: Die genealogische Ausdrucksweise des Hebräischen wird bewahrt; im Zusammenhang bezeichnet sie die Stammesangehörigen.
- source_word: וּבְנֵי גָד
  choice: die Söhne Gads
  rationale: Die wörtliche familiäre Formulierung wird parallel zu „Söhne Rubens“ wiedergegeben.
- source_word: וַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: der halbe Stamm Manasse
  rationale: Dies ist eine natürliche und zugleich formnahe Wiedergabe der hebräischen Konstruktverbindung.
- source_word: וַיְדַבְּרוּ
  choice: und redeten
  rationale: Das zweite Redeverb wird nicht mit וַיַּעֲנוּ zusammengezogen; so bleibt die zweiteilige hebräische Erzählformel sichtbar.
- source_word: אֶת רָאשֵׁי אַלְפֵי יִשְׂרָאֵל
  choice: zu den Oberhäuptern der Sippen Israels
  rationale: רָאשֵׁי bezeichnet führende Personen. אַלְפֵי bedeutet wörtlich „Tausendschaften“, kann hier aber soziale, militärische oder verwandtschaftliche Untergliederungen Israels meinen. „Sippen“ vermittelt die wahrscheinliche Funktion verständlich, während die Fußnote die wörtliche Form offenlegt.
