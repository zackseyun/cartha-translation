  terminology: „Jahwe“, „Altar“, „Brandopfer“, „Speisopfer“ und „Heilsopfer“ sind sachgerecht. Bei זִבְחֵי שְׁלָמִים ist „Heilsopfer darzubringen“ dem engeren „zu schlachten“ vorzuziehen, weil עָשָׂה hier die Durchführung bzw. Darbringung des Opfers bezeichnet.
