revisions:
- from: Wenn wir uns einen Altar gebaut haben, um uns davon abzuwenden, Jahwe zu folgen, oder um darauf Brandopfer und Speisopfer darzubringen oder darauf Heilsopfer[a] zu schlachten, dann soll Jahwe selbst uns dafür zur Rechenschaft ziehen![b]
  to: Wenn wir uns einen Altar gebaut haben, um Jahwe nicht mehr nachzufolgen, oder um darauf Brandopfer und Speisopfer darzubringen oder um darauf Heilsopfer[a] darzubringen, dann soll Jahwe selbst es ahnden![b]
  rationale: Die Überarbeitung macht die Abkehr von Jahwes Nachfolge idiomatisch und eindeutig, erhält die drei bedingten Alternativen sowie das hebräische „und“ zwischen Brand- und Speisopfer und verwendet für die Opferhandlung bei זִבְחֵי שְׁלָמִים eine weitere, dem Verb עָשָׂה entsprechende Formulierung. Der Schluss behält den selbstverwünschenden Charakter, ohne ein im hebräischen Wortlaut nicht ausdrücklich genanntes „uns“ einzuführen.
