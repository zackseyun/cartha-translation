base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/023.yaml
  text: if we built for ourselves an altar to turn away from following Yahweh[a], or if to offer on it burnt offering or grain offering, or if to make on it sacrifices of peace offerings[b], may Yahweh himself require it.
translation:
  language: de
  text: Wenn wir uns einen Altar gebaut haben, um Jahwe nicht mehr nachzufolgen, oder um darauf Brandopfer und Speisopfer darzubringen oder um darauf Heilsopfer[a] darzubringen, dann soll Jahwe selbst es ahnden![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Heilsopfer“ kann auch mit „Gemeinschaftsopfer“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Jahwe selbst wird es fordern“, das heißt, er wird die Tat zur Rechenschaft ziehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: לִבְנוֹת לָנוּ מִזְבֵּחַ
  choice: wenn wir uns einen Altar gebaut haben
  rationale: Der Infinitiv mit ל wird im Zusammenhang des Schwurs aus dem vorigen Vers als Bedingung verstanden. „Uns“ bewahrt לָנוּ; das Perfekt klingt im Deutschen für die bereits vollzogene Handlung natürlich.
- source_word: לָשׁוּב מֵאַחֲרֵי יְהוָה
  choice: um uns davon abzuwenden, Jahwe zu folgen
  rationale: Die Formulierung bewahrt sowohl die Bedeutung des Abfalls in שׁוּב מֵאַחֲרֵי als auch das Bild, nicht länger hinter Jahwe herzugehen. Der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: לְהַעֲלוֹת עָלָיו עוֹלָה וּמִנְחָה
  choice: um darauf Brandopfer und Speisopfer darzubringen
  rationale: העלה bezeichnet hier das Darbringen von Opfern. Das verbindende וּ wird als „und“ bewahrt; מִנְחָה bezeichnet in diesem kultischen Zusammenhang das Speisopfer.
- source_word: לַעֲשׂוֹת עָלָיו זִבְחֵי שְׁלָמִים
  choice: darauf Heilsopfer zu schlachten
  rationale: Bei זֶבַח ist „schlachten“ eine natürliche und sachlich genaue deutsche Wiedergabe der Opferhandlung. שְׁלָמִים wird mit dem etablierten Ausdruck „Heilsopfer“ übersetzt; „Gemeinschaftsopfer“ bleibt als mögliche Alternative in der Fußnote erhalten.
- source_word: יְהוָה הוּא יְבַקֵּשׁ
  choice: dann soll Jahwe selbst uns dafür zur Rechenschaft ziehen
  rationale: Im selbstverfluchenden Schwur hat das Imperfekt auffordernd-imprekative Kraft. „Selbst“ gibt das hervorgehobene הוּא wieder; die im Hebräischen unausgesprochene Rechenschaftspflicht wird im Deutschen idiomatisch verdeutlicht.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Bundesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Aussagekraft des Schlusssatzes im Schwurzusammenhang
  choice: dann soll Jahwe selbst uns dafür zur Rechenschaft ziehen
  alternative: Jahwe selbst wird es von uns fordern
  rationale: Der Kontext ist ein Selbstverwünschungsschwur. Die gewählte Fassung erhält diese imprekative Kraft, während die Alternative das Verb als schlichte Zukunftsaussage verstehen lässt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt als Fortsetzung des Schwurs aus dem vorigen Vers erkennbar. Kultische Fachbegriffe werden verständlich und traditionsnah wiedergegeben; die wiederholten Alternativen des hebräischen Satzes bleiben erhalten.
