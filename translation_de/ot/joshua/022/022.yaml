  to: 'Der Mächtige[a], Gott, Jahwe! Der Mächtige, Gott, Jahwe! Er weiß, und Israel selbst wird es wissen: Wenn dies in Auflehnung oder in Untreue gegen Jahwe geschah, dann rette uns heute nicht!'
  rationale: Die Revision vereinheitlicht die Wiedergabe von ידע, glättet die deutsche Satzfügung, ohne die elliptische bedingte Selbstverwünschung inhaltlich auszuweiten, und ersetzt die unpassend spezifische Fußnotenalternative durch kontextgerechte Möglichkeiten. Da der Text nun „Untreue“ verwendet, ist Fußnote b nicht verankert und wird deshalb nicht im revidierten Text gesetzt; die Fußnote wird zur vollständigen Dokumentation des lexikalischen Befunds dennoch angegeben.
