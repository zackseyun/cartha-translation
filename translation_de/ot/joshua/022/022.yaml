  text: אֵל֩ אֱלֹהִ֨ים יְהוָ֜ה אֵ֣ל אֱלֹהִ֤ים יְהוָה֙ ה֣וּא יֹדֵ֔עַ וְ/יִשְׂרָאֵ֖ל ה֣וּא יֵדָ֑ע אִם בְּ/מֶ֤רֶד וְ/אִם בְּ/מַ֨עַל֙ בַּֽ/יהוָ֔ה אַל תּוֹשִׁיעֵ֖/נוּ הַ/יּ֥וֹם הַ/זֶּֽה׀׀׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/022.yaml
  text: 'The Mighty One[a], God, Yahweh! The Mighty One, God, Yahweh! He knows, and Israel itself will know: if it was in rebellion, or if in unfaithfulness against Yahweh[b], do not save us this day.'
translation:
  language: de
  text: 'Der Mächtige[a], Gott, Jahwe! Der Mächtige, Gott, Jahwe! Er weiß, und Israel selbst wird es wissen: Wenn dies in Auflehnung oder in Untreue gegen Jahwe geschah, dann rette uns heute nicht!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wiederholt die feierliche Anrufung zweimal: „El, Gott, Jahwe; El, Gott, Jahwe.“'
    reason: cultural_note
lexical_decisions:
- source_word: אֵל אֱלֹהִים יְהוָה
  choice: Der Mächtige, Gott, Jahwe
  rationale: Die drei Glieder der feierlichen Gottesbezeichnung bleiben unterscheidbar; אֵל wird als Titel „der Mächtige“ wiedergegeben, und die vollständige Anrufung wird wie im Hebräischen zweimal wiederholt.
- source_word: הוּא יֹדֵעַ
  choice: Er weiß es
  rationale: Das Partizip bezeichnet gegenwärtiges Wissen. Das im Deutschen ergänzte „es“ verweist auf die Wahrheit über den Bau des Altars.
- source_word: וְיִשְׂרָאֵל הוּא יֵדָע
  choice: und Israel selbst wird es erfahren
  rationale: „selbst“ gibt die Hervorhebung durch הוּא wieder; „wird es erfahren“ drückt aus, dass Israel die Wahrheit künftig erkennen wird.
- source_word: אִם בְּמֶרֶד
  choice: wenn es aus Auflehnung geschah
  rationale: מֶרֶד bezeichnet Rebellion oder Auflehnung. „Aus“ gibt den Beweggrund idiomatisch wieder; „es geschah“ wahrt die knappe, bedingte Aussage und bezieht sich im Kontext auf die Handlung.
- source_word: וְאִם בְּמַעַל
  choice: oder aus Untreue
  rationale: מַעַל meint einen Treuebruch, besonders gegenüber Gott. „Untreue“ ist natürlich und bewahrt den relationalen beziehungsweise bundestheologischen Sinn.
- source_word: בַּיהוָה
  choice: gegen Jahwe
  rationale: Die Präposition bezeichnet hier die gegen Jahwe gerichtete Auflehnung beziehungsweise Untreue.
- source_word: אַל תּוֹשִׁיעֵנוּ
  choice: dann rette uns … nicht
  rationale: Die verneinte Jussivform richtet sich unmittelbar an Gott und wird als feierliche Selbstverwünschung wiedergegeben.
- source_word: הַיּוֹם הַזֶּה
  choice: an diesem Tag
  rationale: Die Formulierung bewahrt den feierlichen Nachdruck des hebräischen Ausdrucks.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der persönliche Gottesname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung der zweimaligen Gottesbezeichnung
  choice: Die vollständige dreigliedrige Anrufung wird zweimal wiederholt.
  alternative: Zusammenziehung zu einer einmaligen Gottesbezeichnung
  rationale: Die Wiederholung trägt den feierlichen, schwurähnlichen Nachdruck des hebräischen Textes und darf nicht geglättet werden.
- issue: Sprecherwechsel von der dritten zur zweiten Person
  choice: „Er weiß es“ und danach „rette uns … nicht“
  alternative: 'Durchgehend dritte Person: „Er möge uns nicht retten“'
  rationale: Die hebräische Verbform in אַל תּוֹשִׁיעֵנוּ ist zweite Person Singular. Der unvermittelte Übergang zur direkten Anrede wird deshalb bewahrt.
translation_notes:
  register: Moderne, verständliche Standardsprache mit feierlichem Ton. Die emphatische Wiederholung, die knappe Bedingung und der Wechsel zur direkten Anrede Gottes bleiben erhalten.
