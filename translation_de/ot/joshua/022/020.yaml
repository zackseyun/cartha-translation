  text: הֲ/ל֣וֹא עָכָ֣ן בֶּן זֶ֗רַח מָ֤עַל מַ֨עַל֙ בַּ/חֵ֔רֶם וְ/עַֽל כָּל עֲדַ֥ת יִשְׂרָאֵ֖ל הָ֣יָה קָ֑צֶף וְ/הוּא֙ אִ֣ישׁ אֶחָ֔ד לֹ֥א גָוַ֖ע בַּ/עֲוֺנֽ/וֹ׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/020.yaml
  text: Was it not Achan son of Zerah who acted unfaithfully in the matter of what was devoted to destruction, and wrath came upon all the congregation of Israel? Yet he was not the only man who perished in his iniquity.
translation:
  language: de
  text: Hat nicht Achan, der Sohn Serachs, sich an dem dem Bann geweihten Gut vergangen, sodass Zorn über die ganze Gemeinde Israels kam? Und dieser eine Mann kam nicht allein wegen seiner Schuld um.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָעַל מַעַל בַּחֵרֶם
  choice: sich an dem gebannten Gut vergangen
  rationale: Die Verbindung bezeichnet einen schweren Treuebruch im Umgang mit dem dem Bann unterliegenden Gut. Die deutsche Formulierung ist natürlich und bewahrt sowohl den Gegenstand als auch die Schwere des Vergehens.
- source_word: קֶצֶף
  choice: Zorn
  rationale: Gibt die göttliche Zornreaktion prägnant wieder, ohne den im Kontext erkennbaren Urheber ausdrücklich in den Text einzufügen.
- source_word: עֲדַת יִשְׂרָאֵל
  choice: Gemeinde Israels
  rationale: „Gemeinde“ bezeichnet hier die versammelte beziehungsweise gemeinschaftlich verstandene Gesamtheit Israels und entspricht dem biblischen Register.
- source_word: לֹא גָוַע בַּעֲוֹנוֹ
  choice: nicht der Einzige, der wegen seiner Schuld umkam
  rationale: Gibt idiomatisch wieder, dass Achan nicht allein infolge seiner Schuld starb; „Schuld“ wahrt die moralische Dimension von עָוֹן.
theological_decisions:
- issue: Kollektive Folgen der Schuld Achans
  choice: „sodass Zorn über die ganze Gemeinde Israels kam“
  alternative: „und über die ganze Gemeinde Israels kam Zorn“
  rationale: Die kausale Verknüpfung entspricht dem argumentativen Sinn des hebräischen וְעַל im Zusammenhang und macht deutlich, dass der Treuebruch Folgen für die Gemeinschaft hatte, ohne eine weitergehende Lehre zu formulieren.
- issue: Wer außer Achan umkam
  choice: „er war nicht der Einzige“
  alternative: „er kam nicht allein um“
  rationale: Die Formulierung wahrt die Aussage, dass weitere Menschen betroffen waren, ohne festzulegen, ob damit seine Familie, die bei Ai Gefallenen oder beide Gruppen gemeint sind.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage und der warnende Ton der Rede bleiben erhalten; unnötige Fachsprache wird vermieden.
