base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/027.yaml
  text: Rather, it is a witness between us and you, and between our generations after us, that we may perform the service of the LORD before him with our burnt offerings, our sacrifices, and our peace offerings, so that your children may not say to our children in time to come, ‘You have no share in the LORD.’
translation:
  language: de
  text: 'Vielmehr ist er ein Zeuge zwischen uns und euch und zwischen unseren Generationen nach uns, damit wir den Dienst für den HERRN vor ihm mit unseren Brandopfern, Schlachtopfern und Friedensopfern verrichten können, sodass eure Kinder künftig nicht zu unseren Kindern sagen: »Ihr habt keinen Anteil am HERRN.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Vielmehr
  rationale: Im Zusammenhang weist die Partikel die zuvor zurückgewiesene Deutung des Altars ab und führt seinen eigentlichen Zweck ein; daher ist hier ein adversativ-erklärender Anschluss natürlich.
- source_word: עֵד
  choice: Zeuge
  rationale: Die konkrete, personifizierende Bezeichnung des Altars als Beweiszeichen wird bewahrt.
- source_word: לַעֲבֹד אֶת־עֲבֹדַת יְהוָה
  choice: den Dienst für den HERRN … tun
  rationale: Bewahrt die figura etymologica von Verb und Substantiv, ohne im Deutschen unverständlich zu werden.
- source_word: עֹלוֹתֵינוּ
  choice: unsere Brandopfer
  rationale: Übliche sachgerechte Wiedergabe des vollständig verbrannten Opfers.
- source_word: זְבָחֵינוּ
  choice: unsere Schlachtopfer
  rationale: Gibt den Opferterminus spezifischer wieder als das allgemeine Wort „Opfer“ und unterscheidet ihn von Brand- und Friedensopfern.
- source_word: שְׁלָמֵינוּ
  choice: unsere Friedensopfer
  rationale: Traditionelle und verständliche Wiedergabe; die mögliche Nuance von Gemeinschaft bzw. Wohlergehen bleibt im etablierten Opferbegriff erhalten.
- source_word: חֵלֶק בַּיהוָה
  choice: Anteil am HERRN
  rationale: Bewahrt die relationale und kultische Offenheit von חֵלֶק, ohne sie vorschnell als Besitz, Erbe oder Zugangsrecht einzuengen.
theological_decisions:
- issue: Bedeutung und Funktion des Altars
  choice: „Zeuge“ für das fortdauernde Recht, den Dienst für den HERRN zu tun
  alternative: Ein konkurrierender Opferaltar oder bloßes Denkmal
  rationale: Der Vers selbst bezeichnet den Altar als Zeugen und verbindet ihn mit der Abwehr eines künftigen Ausschlusses; er legitimiert keinen eigenständigen Kult.
- issue: Gottesname יהוה
  choice: der HERR
  alternative: JHWH / Jahwe
  rationale: Die deutsche Bibelkonvention wird verwendet, ohne eine unsichere Vokalisierung in den Haupttext einzutragen.
- issue: Modalität von לַעֲבֹד
  choice: „Wir dürfen … tun“
  alternative: „damit wir … tun“ / „dass wir … tun“
  rationale: Der Kontext betrifft das von künftigen Generationen möglicherweise bestrittene Recht auf den gemeinsamen Gottesdienst. „dürfen“ macht diese kontextuelle Zielrichtung deutlich, ohne einen konfessionellen Zusatz einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange hebräische Satzperiode wurde zur besseren Verständlichkeit in drei eng verbundene Sätze gegliedert. „Künftig“ gibt מָחָר idiomatisch als zukünftigen Zeitpunkt wieder; „vor ihm“ bleibt als kultische Orts- und Beziehungsangabe erhalten.
