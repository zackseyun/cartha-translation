    issue: „soll er Zeuge sein“
    rationale: הוּא („er/es ist“) stellt fest, was der Altar als Zeichen bedeutet; ein Sollenssatz ist im hebräischen Text nicht vorhanden.
  - severity: medium
    issue: „Wir dürfen den Dienst ... tun“
    rationale: לַעֲבֹד ist ein finaler Infinitiv („damit wir ... verrichten können/um ... zu verrichten“). „dürfen“ fügt eine deontische Modalität hinzu, die zwar kontextuell nachvollziehbar, aber nicht ausdrücklich formuliert ist.
