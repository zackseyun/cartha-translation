revisions:
- from: 'Vielmehr soll er Zeuge sein zwischen uns und euch und zwischen unseren Generationen nach uns: Wir dürfen den Dienst für den HERRN vor ihm tun mit unseren Brandopfern, Schlachtopfern und Friedensopfern. So sollen eure Kinder künftig nicht zu unseren Kindern sagen: »Ihr habt keinen Anteil am HERRN.«'
  to: 'Vielmehr ist er ein Zeuge zwischen uns und euch und zwischen unseren Generationen nach uns, damit wir den Dienst für den HERRN vor ihm mit unseren Brandopfern, Schlachtopfern und Friedensopfern verrichten können, sodass eure Kinder künftig nicht zu unseren Kindern sagen: »Ihr habt keinen Anteil am HERRN.«'
  rationale: Die Revision stellt den indikativischen Charakter von „er ist ein Zeuge“ wieder her und gibt den finalen Infinitiv mit „damit ... verrichten können“ wieder, ohne die im Kontext liegende Frage des kultischen Zugangs als explizite Erlaubnis zu formulieren. Die etablierten Opferbegriffe sowie die Wiedergabe des Gottesnamens und von חֵלֶק bleiben erhalten.
