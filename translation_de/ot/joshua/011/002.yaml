id: JOS.11.2
reference: Joshua 11:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְֽ/אֶל הַ/מְּלָכִ֞ים אֲשֶׁ֣ר מִ/צְּפ֗וֹן בָּ/הָ֧ר וּ/בָ/עֲרָבָ֛ה נֶ֥גֶב כִּֽנֲר֖וֹת וּ/בַ/שְּׁפֵלָ֑ה וּ/בְ/נָפ֥וֹת דּ֖וֹר מִ/יָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/002.yaml
  text: and to the kings who were in the north[a], in the hill country, in the Arabah south of Kinneroth, in the lowland[b], and in the heights of Dor toward the west.
translation:
  language: de
  text: und an die Könige im Norden, im Bergland, in der Araba südlich von Kinnerot, in der Niederung und in den Höhen von Dor[a] im Westen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „in den Bezirken von Dor“, „im Gebiet von Dor“ oder „an den Hängen von Dor“. Das hebräische Wort ist selten; seine genaue topografische Bedeutung ist umstritten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „vom Meer her“; in hebräischen geografischen Angaben bezeichnet dies gewöhnlich den Westen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶל
  choice: und an
  rationale: Konjunktion und Präposition setzen die Empfängerliste aus dem vorigen Vers fort.
- source_word: הַמְּלָכִים אֲשֶׁר מִצְּפוֹן
  choice: die Könige im Norden
  rationale: Die knappe Ortsangabe bezeichnet die nördlich ansässigen Könige; „im Norden“ ist im Deutschen natürlich und lässt sich gut mit den folgenden Gebieten verbinden.
- source_word: בָּהָר
  choice: im Bergland
  rationale: הַר bezeichnet hier eine topografische Region, nicht lediglich einzelne Berge.
- source_word: וּבָעֲרָבָה
  choice: in der Araba
  rationale: Araba wird als geografische Bezeichnung für die Senke beziehungsweise Jordangrabenregion beibehalten.
- source_word: נֶגֶב כִּנֲרוֹת
  choice: südlich von Kinnerot
  rationale: נֶגֶב wird hier richtungsbezogen verstanden, da Kinnerot eine nördliche Orts- oder Landschaftsbezeichnung ist.
- source_word: וּבַשְּׁפֵלָה
  choice: in der Niederung
  rationale: שְׁפֵלָה bezeichnet das tiefer gelegene Land; „Niederung“ ist verständlich und bewahrt den topografischen Gegensatz.
- source_word: וּבְנָפוֹת דּוֹר
  choice: in den Höhen von Dor
  rationale: Das seltene נָפוֹת ist topografisch unsicher. „Höhen“ gibt eine verbreitete Deutung wieder, ohne die Unsicherheit in der Fußnote zu verschweigen.
- source_word: מִיָּם
  choice: im Westen
  rationale: יָם bedeutet wörtlich „Meer“, wird in hebräischen geografischen Angaben jedoch häufig als Richtungsbezeichnung für den Westen gebraucht.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Reihung der Ortsangaben bleibt nah an der hebräischen Struktur; etablierte geografische Namen werden beibehalten, während verständliche deutsche Landschaftsbegriffe verwendet werden.
