base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/017.yaml
  text: from Mount Halak[a], which rises toward Seir, as far as Baal-gad in the Valley of Lebanon below Mount Hermon[b]. And he captured all their kings and struck them down and put them to death.
translation:
  language: de
  text: vom Berg Halak[a], der sich in Richtung Seïr erhebt, bis nach Baal-Gad im Tal des Libanon[b] unterhalb des Berges Hermon. Alle ihre Könige nahm er gefangen, schlug sie nieder und tötete sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dem glatten Berg«. Das Hebräische kann als Beschreibung verstanden werden; hier dient es wahrscheinlich als Ortsname »Berg Halak«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »in der Ebene des Libanon«. Das hebräische Wort kann ein breites Tal oder eine Ebene bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָהָר הֶחָלָק
  choice: Berg Halak
  rationale: Die Verbindung wird im geografischen Grenzüberblick als Ortsname verstanden; die mögliche beschreibende Bedeutung wird in einer Fußnote bewahrt.
- source_word: הָעֹלֶה שֵׂעִיר
  choice: der sich nach Seïr hinaufzieht
  rationale: Das Partizip von עלה bezeichnet hier die ansteigende beziehungsweise sich aufwärts erstreckende Topografie; die Formulierung gibt zugleich die Richtung nach Seïr wieder.
- source_word: וְעַד בַּעַל גָּד
  choice: bis nach Baal-Gad
  rationale: וְעַד markiert die räumliche Ausdehnung bis zu einem Grenzpunkt; Baal-Gad bleibt als Ortsname unübersetzt.
- source_word: בְּבִקְעַת הַלְּבָנוֹן
  choice: im Tal des Libanon
  rationale: בִּקְעָה kann ein breites Tal oder eine Ebene bezeichnen. »Tal« ist im Deutschen natürlich und bewahrt die topografische Aussage; »Ebene« wird als Alternative vermerkt.
- source_word: תַּחַת הַר חֶרְמוֹן
  choice: unterhalb des Berges Hermon
  rationale: תַּחַת bezeichnet in dieser geografischen Beschreibung die niedrigere Lage im Verhältnis zum Berg Hermon.
- source_word: לָכַד
  choice: nahm er gefangen
  rationale: Bei Königen als Objekt bezeichnet das Verb ihre Ergreifung beziehungsweise Gefangennahme.
- source_word: וַיַּכֵּם
  choice: schlug sie nieder
  rationale: Die gewaltsame Bedeutung von נכה bleibt erhalten und wird nicht mit dem folgenden ausdrücklichen Töten gleichgesetzt.
- source_word: וַיְמִיתֵם
  choice: tötete sie
  rationale: Die Hifil-Form von מות sagt ausdrücklich aus, dass er ihren Tod verursachte; die knappe deutsche Wiedergabe ist klar und würdig.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Ortsnamen werden transliteriert; »Seïr« erhält zur eindeutigen Aussprache ein Trema. Die Abfolge von Gefangennahme, Niederschlagen und Töten bleibt als dreifache Handlung erhalten.
