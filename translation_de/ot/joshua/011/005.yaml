source:
  edition: WLC
  text: וַ/יִּוָּ֣עֲד֔וּ כֹּ֖ל הַ/מְּלָכִ֣ים הָ/אֵ֑לֶּה וַ/יָּבֹ֜אוּ וַ/יַּחֲנ֤וּ יַחְדָּו֙ אֶל מֵ֣י מֵר֔וֹם לְ/הִלָּחֵ֖ם עִם יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/005.yaml
  text: All these kings met by agreement[a], and they came and encamped together at the waters of Merom to fight against Israel.
translation:
  language: de
  text: Alle diese Könige versammelten sich nach gemeinsamer Absprache[a]. Sie kamen und lagerten gemeinsam bei den Wassern von Merom, um gegen Israel zu kämpfen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »kamen verabredungsgemäß zusammen« oder »trafen sich«; das hebräische Verb bezeichnet hier ein koordiniertes Zusammenkommen, nicht eine zufällige Begegnung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעֲדוּ
  choice: versammelten sich nach gemeinsamer Absprache
  rationale: Das Niphal von יעד bezeichnet hier ein koordiniertes, verabredetes Zusammenkommen. Die Formulierung gibt sowohl die Versammlung als auch die vorherige Abstimmung natürlich wieder.
- source_word: כֹּל הַמְּלָכִים הָאֵלֶּה
  choice: alle diese Könige
  rationale: Die Wiedergabe bewahrt die Gesamtheit und die demonstrative Aussage des Hebräischen.
- source_word: וַיָּבֹאוּ
  choice: sie kamen
  rationale: Die schlichte deutsche Erzählform entspricht dem häufigen narrativen Gebrauch von בוא.
- source_word: וַיַּחֲנוּ יַחְדָּו
  choice: lagerten gemeinsam
  rationale: חנה bezeichnet das Aufschlagen eines Lagers; יַחְדָּו hebt das vereinte Handeln der Koalition hervor.
- source_word: אֶל מֵי מֵרוֹם
  choice: am Wasser von Merom
  rationale: אֶל markiert zunächst das Ziel, das im Deutschen beim Lagern idiomatisch als Ortsangabe erscheint. Der hebräische Ausdruck מֵי wird bewahrt, ohne ihn unbelegt als See zu bestimmen.
- source_word: לְהִלָּחֵם עִם יִשְׂרָאֵל
  choice: um gegen Israel zu kämpfen
  rationale: Der Infinitiv gibt den Zweck ihres Kommens und Lagerns an; עִם hat im militärischen Zusammenhang adversative Bedeutung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Lagerten« ist im Deutschen natürlicher als »schlugen ihr Lager auf« und bewahrt den militärischen Erzählzusammenhang. Der erste lange hebräische Satz wird zur besseren Verständlichkeit in zwei deutsche Sätze gegliedert.
