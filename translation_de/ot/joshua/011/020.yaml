base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/020.yaml
  text: For it was from Yahweh to harden their hearts to meet Israel in battle[a], so that he might devote them to destruction, so that there would be no mercy for them, but so that he might destroy them[c][b], just as Yahweh had commanded Moses.
translation:
  language: de
  text: Denn vom HERRN kam es, dass er ihre Herzen verhärtete, damit sie Israel im Kampf entgegentraten. Damit er sie der Vernichtung weihe, sollte ihnen kein Erbarmen zuteilwerden, sondern damit er sie vernichte, wie der HERR Mose geboten hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵאֵת יְהוָה
  choice: es kam vom HERRN
  rationale: Die Wendung bezeichnet Ursprung beziehungsweise Veranlassung. Der Gottesname wird in der deutschen Bibeltradition würdig mit „der HERR“ wiedergegeben.
- source_word: לְחַזֵּק אֶת לִבָּם
  choice: dass er ihr Herz verhärtete
  rationale: חזק bedeutet wörtlich „stärken/fest machen“; im Zusammenhang bezeichnet es von Gott bewirkte Entschlossenheit im feindlichen Widerstand. „Verhärten“ gibt diese idiomatische Wirkung wieder, ohne Gottes ausdrückliche Urheberschaft abzuschwächen.
- source_word: לִקְרַאת הַמִּלְחָמָה אֶת יִשְׂרָאֵל
  choice: sodass sie Israel im Kampf entgegentraten
  rationale: Die Konstruktion bezeichnet hier das feindliche Entgegentreten zum Kampf; die deutsche Formulierung ist natürlich und wahrt den militärischen Sinn.
- source_word: לְמַעַן הַחֲרִימָם
  choice: So sollte er sie dem Untergang weihen
  rationale: חרם ist ein technischer Ausdruck für die vollständige Übereignung an das Gericht, die hier die Vernichtung einschließt. „Dem Untergang weihen“ bewahrt sowohl den Weihe- als auch den Gerichtsgedanken.
- source_word: לְבִלְתִּי הֱיוֹת לָהֶם תְּחִנָּה
  choice: ohne dass ihnen Gnade zuteilwürde
  rationale: תְּחִנָּה kann flehentliche Bitte, Gunst oder Erbarmen bezeichnen. Die kompakte Wiedergabe wahrt die Unbestimmtheit darüber, ob der Nachdruck auf einer Bitte um Gnade oder auf der Gewährung von Gnade liegt.
- source_word: לְמַעַן הַשְׁמִידָם
  choice: sondern er sollte sie vernichten
  rationale: שמד bezeichnet vollständige Vernichtung. „Vernichten“ ist stark, klar und im modernen Standarddeutsch angemessen.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: wie der HERR Mose geboten hatte
  rationale: כַּאֲשֶׁר stellt die Übereinstimmung mit dem früher erteilten Gebot heraus; das Plusquamperfekt passt zum Erzählablauf.
theological_decisions:
- issue: Göttliche Urheberschaft bei der Verhärtung der Herzen
  choice: 'Gottes aktive Veranlassung wird ausdrücklich beibehalten: „es kam vom HERRN, dass er ihr Herz verhärtete“'
  alternative: „Der HERR ließ zu, dass ihr Herz verhärtet wurde“ oder „es war der Wille des HERRN, dass sie hartnäckig blieben“
  rationale: Der hebräische Text führt die Verhärtung unmittelbar auf den HERRN zurück. Eine bloße Zulassung würde die theologische Spannung des Ausgangstextes abschwächen.
- issue: Wiedergabe der Bannformel חרם
  choice: „dem Untergang weihen“ im Haupttext
  alternative: „vollständig vernichten“ oder „mit dem Bann belegen“
  rationale: Die gewählte Wendung erhält den besonderen religiös-gerichtlichen Sinn und bleibt zugleich für heutige Leser verständlich.
- issue: Bedeutung von תְּחִנָּה
  choice: „ohne dass ihnen Gnade zuteilwürde“
  alternative: „ohne dass es für sie ein Gnadengesuch gäbe“ oder „ohne dass sie Erbarmen fänden“
  rationale: Die hebräische Wendung lässt offen, ob eine flehentliche Bitte, gewährte Gunst oder Erbarmen im Vordergrund steht. Haupttext und Fußnote bewahren diese Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur wurde für gute Verständlichkeit leicht gegliedert, während die zweimalige Zweckangabe und die harte theologische Aussage des Hebräischen erhalten bleiben. Das kollektive Singular „ihr Herz“ folgt dem hebräischen Ausdruck.
