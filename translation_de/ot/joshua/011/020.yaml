review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die göttliche Veranlassung der Verhärtung, das kriegerische Entgegentreten gegen Israel, die Bann-/Vernichtungsformel und den Bezug auf das an Mose ergangene Gebot grundsätzlich zutreffend wieder. Die zweckbestimmenden Infinitivkonstruktionen לְמַעַן werden jedoch mit „So sollte er“ unnötig modal und weniger genau wiedergegeben. Bei תְּחִנָּה bleibt „Gnade zuteilwürde“ als mögliche kontextuelle Deutung vertretbar, doch die Fußnote muss klarer kenntlich machen, dass der Grundbegriff eine Bitte bzw. Flehen um Gunst ist.
  naturalness: Die Formulierung ist überwiegend modernes, würdiges Standarddeutsch. „Damit“ bildet die hebräischen Zweckangaben klarer und natürlicher als das wiederholte „So sollte er“. „Ihre Herzen“ ist im Deutschen idiomatischer als das kollektivische Singular „ihr Herz“, ohne den Sinn zu verändern.
  terminology: „der Vernichtung weihen“ erhält bei חרם sowohl den Weihe- als auch den gerichtlichen Vernichtungssinn und ist gegenüber „dem Untergang weihen“ semantisch unmittelbarer. „Der HERR“ ist konsistent. Die Fußnoten bewahren die lexikalische Alternative von חזק sowie die umstrittene Reichweite von תְּחִנָּה, ohne eine theologische Deutung vorzuschreiben.
  issues:
  - severity: medium
    issue: Die Zweckangaben werden als modales „So sollte er“ wiedergegeben.
    rationale: לְמַעַן bezeichnet hier Zweck/Absicht. „Damit er … weihe … sondern damit er … vernichte“ bildet diese Funktion unmittelbarer ab und vermeidet eine im Deutschen missverständliche Sollensnuance.
  - severity: low
    issue: „ihr Herz“ ist als kollektiver Singular zwar möglich, aber weniger natürlich.
    rationale: Die hebräische Singularform mit Pluralsuffix kann kollektiv verstanden werden; deutsches „ihre Herzen“ ist idiomatischer und erhält den Bezug auf die mehreren Gruppen/Könige.
  - severity: low
    issue: Die Fußnote zu תְּחִנָּה sollte den Primärsinn „Gnadenbitte/Flehen“ deutlicher als Alternative zur kontextuellen Wiedergabe „Erbarmen“ ausweisen.
    rationale: Die Haupttextformulierung kann die Aussage über nicht gewährtes Erbarmen ausdrücken, darf aber den lexikalischen Bezug auf eine Bitte nicht verdecken.
  revised_text: Denn vom HERRN kam es, dass er ihre Herzen verhärtete, damit sie Israel im Kampf entgegentraten. Damit er sie der Vernichtung weihe, sollte ihnen kein Erbarmen zuteilwerden, sondern damit er sie vernichte, wie der HERR Mose geboten hatte.
