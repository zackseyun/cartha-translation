revisions:
- from: Denn es kam vom HERRN, dass er ihr Herz verhärtete, sodass sie Israel im Kampf entgegentraten[a]. So sollte er sie dem Untergang weihen[b], ohne dass ihnen Gnade zuteilwürde[c], sondern er sollte sie vernichten, wie der HERR Mose geboten hatte.
  to: Denn vom HERRN kam es, dass er ihre Herzen verhärtete, damit sie Israel im Kampf entgegentraten. Damit er sie der Vernichtung weihe, sollte ihnen kein Erbarmen zuteilwerden, sondern damit er sie vernichte, wie der HERR Mose geboten hatte.
  rationale: Die Revision stellt die zweifache Zweckstruktur des Hebräischen mit „damit“ wieder her, ersetzt den im Deutschen weniger natürlichen kollektiven Singular durch „ihre Herzen“ und schärft die Bannterminologie zu „der Vernichtung weihe“. Die Aussage über fehlendes Erbarmen bleibt im Haupttext knapp und kontextgerecht; die Fußnote erhält ausdrücklich die mögliche Lesart einer nicht vorhandenen Gnadenbitte. Die Fußnotenmarker a, b und c bleiben an ihren jeweiligen Aussageeinheiten verankert.
  reviewer_model: gpt-5.6-terra
