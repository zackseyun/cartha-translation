source:
  edition: WLC
  text: הַֽ/כְּנַעֲנִי֙ מִ/מִּזְרָ֣ח וּ/מִ/יָּ֔ם וְ/הָ/אֱמֹרִ֧י וְ/הַ/חִתִּ֛י וְ/הַ/פְּרִזִּ֥י וְ/הַ/יְבוּסִ֖י בָּ/הָ֑ר וְ/הַֽ/חִוִּי֙ תַּ֣חַת חֶרְמ֔וֹן בְּ/אֶ֖רֶץ הַ/מִּצְפָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/003.yaml
  text: the Canaanite in the east and in the west[a], and the Amorite, the Hittite, the Perizzite, and the Jebusite in the hill country, and the Hivite below Hermon in the land of Mizpah.
translation:
  language: de
  text: die Kanaaniter im Osten und im Westen[a], die Amoriter, die Hethiter, die Perisiter und die Jebusiter im Bergland sowie die Hiwiter unterhalb des Hermon im Land Mizpa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und vom Meer“; „das Meer“ bezeichnet hier wahrscheinlich geografisch den Westen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכְּנַעֲנִי
  choice: die Kanaaniter
  rationale: Der bestimmte Singular bezeichnet kollektiv das Volk; im modernen Deutschen ist dafür der Plural natürlicher und eindeutig.
- source_word: מִמִּזְרָח וּמִיָּם
  choice: im Osten und im Westen
  rationale: Die Präposition bezeichnet in dieser geografischen Aufzählung den Aufenthaltsbereich. יָם, wörtlich „Meer“, dient hier wahrscheinlich als Richtungsangabe für den Westen.
- source_word: הָאֱמֹרִי וְהַחִתִּי וְהַפְּרִזִּי וְהַיְבוּסִי
  choice: die Amoriter, die Hetiter, die Perisiter und die Jebusiter
  rationale: Die hebräischen singularischen Volksbezeichnungen sind kollektiv gebraucht; deutsche Pluralformen geben diesen Sinn idiomatisch wieder.
- source_word: בָּהָר
  choice: im Bergland
  rationale: הָר bezeichnet hier das gebirgige Hochland als geografische Region, nicht notwendig einzelne Berge.
- source_word: הַחִוִּי
  choice: die Hiwiter
  rationale: Auch diese singularische Volksbezeichnung ist kollektiv und wird daher im Deutschen im Plural wiedergegeben.
- source_word: תַּחַת חֶרְמוֹן
  choice: unterhalb des Hermon
  rationale: תַּחַת ist räumlich gemeint und bezeichnet das Gebiet unterhalb beziehungsweise am Fuß des Hermon.
- source_word: בְּאֶרֶץ הַמִּצְפָּה
  choice: im Land Mizpa
  rationale: אֶרֶץ bezeichnet ein Gebiet; Mizpa wird als Orts- beziehungsweise Gebietsname wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kollektiven hebräischen Singularformen der Volksnamen werden im Deutschen idiomatisch als Plurale wiedergegeben. Der Vers ist ein von Vers 2 abhängiger Bestandteil einer längeren Aufzählung; deshalb beginnt der Entwurf entsprechend mit Kleinschreibung.
