  text: לֹֽא הָיְתָ֣ה עִ֗יר אֲשֶׁ֤ר הִשְׁלִ֨ימָה֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל בִּלְתִּ֥י הַ/חִוִּ֖י יֹשְׁבֵ֣י גִבְע֑וֹן אֶת הַ/כֹּ֖ל לָקְח֥וּ בַ/מִּלְחָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/019.yaml
  text: There was not a city that made peace with the sons of Israel[a], except the Hivites living in Gibeon[b]; they took all of them in battle.
translation:
  language: de
  text: Keine Stadt schloss Frieden mit den Israeliten[a], ausgenommen die Hiwiter, die in Gibeon lebten; alle anderen nahmen die Israeliten im Kampf ein.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »mit den Söhnen Israels«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »im Krieg«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁלִימָה אֶל
  choice: schloss Frieden mit
  rationale: Das Hifil von שׁלם bezeichnet hier das Eingehen friedlicher Beziehungen. Die deutsche Wendung gibt den diplomatischen Sinn wieder, ohne ihn als Unterwerfung oder Kapitulation zu präzisieren.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: den Israeliten
  rationale: Die idiomatische deutsche Volksbezeichnung gibt das hebräische »Söhne Israels« natürlich und verständlich wieder, ohne den Bezug auf das Volk zu verändern.
- source_word: בִּלְתִּי
  choice: außer
  rationale: Das Wort führt nach der Verneinung die einzige Ausnahme ein.
- source_word: הַחִוִּי יֹשְׁבֵי גִבְעוֹן
  choice: den Hiwitern, die in Gibeon lebten
  rationale: Der substantivierte Singular als Kollektiv wird im Deutschen passend im Plural wiedergegeben; das Partizip יֹשְׁבֵי bezeichnet die dort Wohnenden.
- source_word: אֶת הַכֹּל
  choice: alle
  rationale: Die Form bezeichnet die Gesamtheit der zuvor gemeinten Städte beziehungsweise ihrer Bewohner; »alle« bewahrt diese im Hebräischen vorhandene Bezugsoffenheit.
- source_word: לָקְחוּ בַמִּלְחָמָה
  choice: nahmen … im Kampf ein
  rationale: לקח bedeutet grundsätzlich »nehmen«; im Zusammenhang mit Städten ist »einnehmen« natürliches Deutsch. »Im Kampf« gibt den kriegerischen Umstand wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung erhöht die Verständlichkeit. »Israeliten« ist idiomatischer als die im Deutschen missverständliche wörtliche Form »Söhne Israels«. Die Bezugsoffenheit von »alle« wird im Haupttext bewahrt und in der Fußnote erläutert.
