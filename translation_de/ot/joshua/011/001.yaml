source:
  edition: WLC
  text: וַ/יְהִ֕י כִּ/שְׁמֹ֖עַ יָבִ֣ין מֶֽלֶךְ חָצ֑וֹר וַ/יִּשְׁלַ֗ח אֶל יוֹבָב֙ מֶ֣לֶךְ מָד֔וֹן וְ/אֶל מֶ֥לֶךְ שִׁמְר֖וֹן וְ/אֶל מֶ֥לֶךְ אַכְשָֽׁף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/001.yaml
  text: When Jabin king of Hazor heard of it[a], he sent to Jobab king of Madon, and to the king of Shimron[c][b], and to the king of Achshaph.
translation:
  language: de
  text: Als Jabin, der König von Hazor, davon hörte[a][b], sandte er zu Jobab, dem König von Madon, zum König von Schimron[c] und zum König von Achschaf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Und es geschah, als Jabin, der König von Hazor, hörte.“ Die hebräische Erzählformel wird hier im Deutschen sinngemäß mit „Als … hörte“ wiedergegeben.'
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen steht nur „hörte“; „davon“ ergibt sich aus dem vorausgehenden Zusammenhang.
    reason: cross_reference
  - marker: c
    text: Manche setzen Schimron hier mit „Schimron-Meron“ in Josua 12,20 gleich.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Als … davon hörte
  rationale: Die Konstruktion וַיְהִי mit כִּ und Infinitiv führt einen zeitlichen Erzählumstand ein. Das deutsche „Als … hörte“ gibt diese Funktion natürlich wieder; „davon“ ergänzt das im Zusammenhang vorausgesetzte Gehörte.
- source_word: יָבִין
  choice: Jabin
  rationale: Der Personenname wird nach geläufiger deutscher Bibeltradition transkribiert.
- source_word: מֶלֶךְ חָצוֹר
  choice: der König von Hazor
  rationale: Die hebräische Status-constructus-Verbindung wird als Titel mit Ortsangabe wiedergegeben; im Deutschen steht sie natürlich als Apposition zu „Jabin“.
- source_word: וַיִּשְׁלַח אֶל
  choice: schickte er Boten zu
  rationale: שׁלח mit אֶל bezeichnet hier das Senden zu den genannten Königen. Da im Deutschen ein ausdrückliches Objekt erforderlich ist, werden die sachlich vorausgesetzten „Boten“ genannt, ohne den Inhalt der Botschaft auszudeuten.
- source_word: יוֹבָב
  choice: Jobab
  rationale: Geläufige deutsche Transkription des Personennamens.
- source_word: מֶלֶךְ מָדוֹן
  choice: dem König von Madon
  rationale: Die Titel- und Ortsverbindung wird direkt wiedergegeben und wegen der Apposition an den deutschen Kasus angepasst.
- source_word: שִׁמְרוֹן
  choice: Schimron
  rationale: Der masoretische Text liest hier schlicht שִׁמְרוֹן. Die deutsche Schreibung gibt den anlautenden sch-Laut wieder.
- source_word: אַכְשָׁף
  choice: Achschaf
  rationale: Der Ortsname wird in einer im Deutschen gut lesbaren Form transkribiert, die den hebräischen Konsonanten entspricht.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählstil. Die Eigennamen folgen geläufigen deutschen Transkriptionsformen. Die hebräische Erzählformel wird idiomatisch wiedergegeben; nicht ausdrücklich genannte, im Deutschen jedoch für einen natürlichen Satz erforderliche Boten werden zurückhaltend ergänzt.
