  text: וַ/יִּקַּ֨ח יְהוֹשֻׁ֜עַ אֶת כָּל הָ/אָ֗רֶץ כְּ֠/כֹל אֲשֶׁ֨ר דִּבֶּ֣ר יְהוָה֮ אֶל מֹשֶׁה֒ וַ/יִּתְּנָ/הּ֩ יְהוֹשֻׁ֨עַ לְ/נַחֲלָ֧ה לְ/יִשְׂרָאֵ֛ל כְּ/מַחְלְקֹתָ֖/ם לְ/שִׁבְטֵי/הֶ֑ם וְ/הָ/אָ֥רֶץ שָׁקְטָ֖ה מִ/מִּלְחָמָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/023.yaml
  text: So Joshua took all the land[a], according to all that Yahweh had spoken to Moses, and Joshua gave it to Israel as an inheritance according to their divisions by their tribes[b]. And the land had rest from war.
translation:
  language: de
  text: So nahm Josua das ganze Land ein[a], entsprechend allem, was Jahwe zu Mose gesagt hatte. Josua gab es Israel zum Erbbesitz, entsprechend der Aufteilung auf ihre Stämme. Und das Land hatte Ruhe vom Krieg[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Das ganze Land“ bezeichnet das in diesem Zusammenhang behandelte Land. Die Formulierung fasst Josuas Einnahme des Landes zusammen.
    reason: Kontextuelle Klärung des Umfangs, ohne die Spannung zu anderen Eroberungsberichten aufzulösen.
  - marker: b
    text: 'Oder: „Das Land war frei von Krieg.“ Die hebräische Wendung bezeichnet Ruhe oder Ungestörtheit nach kriegerischen Auseinandersetzungen.'
    reason: Lexikalische Alternative und Erklärung des hebräischen Ausdrucks.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: nahm … ein
  rationale: Das Grundverb bedeutet »nehmen«. Im Zusammenhang der zusammenfassenden Eroberungsnotiz gibt »einnehmen« den Sinn natürlich wieder, ohne die Aussage zu »vollständig besetzen« auszuweiten.
- source_word: כָּל הָאָרֶץ
  choice: das ganze Land
  rationale: אֶרֶץ bezeichnet hier das in der Erzählung behandelte Land, nicht die gesamte Erde. Die deutsche Wendung bewahrt den umfassenden Wortlaut der Zusammenfassung.
- source_word: כְּכֹל אֲשֶׁר דִּבֶּר
  choice: entsprechend allem, was … gesagt hatte
  rationale: Die Formulierung drückt Übereinstimmung mit dem zuvor Gesagten aus. Das Plusquamperfekt macht den zeitlichen Bezug im Deutschen deutlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird in seiner geläufigen deutschen Form wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַיִּתְּנָהּ
  choice: gab es
  rationale: Das Suffix bezieht sich auf das Land. »Gab es« erhält die Grundbedeutung des Verbs; die Art der Gabe wird durch »zum Erbbesitz« bestimmt.
- source_word: לְנַחֲלָה
  choice: zum Erbbesitz
  rationale: נַחֲלָה bezeichnet einen als Erbe zugeteilten, bleibenden Besitz. »Erbbesitz« erhält sowohl den rechtlichen als auch den theologischen Klang.
- source_word: לְיִשְׂרָאֵל
  choice: Israel
  rationale: Israel ist der Empfänger der Landgabe; der deutsche Dativ nach »gab« gibt die Präposition natürlich wieder.
- source_word: כְּמַחְלְקֹתָם לְשִׁבְטֵיהֶם
  choice: entsprechend der Aufteilung auf ihre Stämme
  rationale: Die zusammengezogene deutsche Formulierung gibt die Gliederung beziehungsweise Zuteilung nach den Stämmen verständlich wieder, ohne eine zusätzliche Verteilungsweise einzutragen.
- source_word: שָׁקְטָה מִמִּלְחָמָה
  choice: hatte Ruhe vom Krieg
  rationale: שׁקט bezeichnet Ruhe und Ungestörtheit nach einem Konflikt. Die Formulierung wahrt das Bild, ohne einen absoluten oder dauerhaften Frieden zu behaupten.
theological_decisions:
- issue: Reichweite der Zusammenfassung »das ganze Land«
  choice: Die umfassende Formulierung bleibt als erzählerische Zusammenfassung von Josuas erfolgreicher Einnahme des behandelten Landes stehen.
  alternative: Die Aussage ausdrücklich als vollständige sofortige Besetzung jedes Gebietsteils oder als bloße Übertreibung deuten.
  rationale: Der hebräische Text formuliert umfassend, während andere Stellen noch nicht eingenommene Gebiete erwähnen. Die Übersetzung soll diese Spannung weder harmonisieren noch durch eine bestimmte Deutung auflösen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. »Erbbesitz« und »Ruhe vom Krieg« bewahren die prägnante biblische Begrifflichkeit, bleiben aber für heutige Leser verständlich.
