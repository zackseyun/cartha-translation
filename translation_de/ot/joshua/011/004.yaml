  text: וַ/יֵּצְא֣וּ הֵ֗ם וְ/כָל מַֽחֲנֵי/הֶם֙ עִמָּ֔/ם עַם רָ֕ב כַּ/ח֛וֹל אֲשֶׁ֥ר עַל שְׂפַת הַ/יָּ֖ם לָ/רֹ֑ב וְ/ס֥וּס וָ/רֶ֖כֶב רַב מְאֹֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/004.yaml
  text: They came out[a], they and all their camps with them, a great people, as numerous as the sand that is on the seashore[b], with very many horses and chariots.
translation:
  language: de
  text: 'Da zogen sie aus, sie und alle ihre Heerlager mit ihnen: eine große Schar, so zahlreich wie der Sand am Ufer des Meeres, mit sehr vielen Pferden und Streitwagen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: Da zogen sie aus
  rationale: יצא bezeichnet hier im fortlaufenden Erzählzusammenhang das Ausziehen der verbündeten Könige und ihrer Truppen. „zogen … aus“ ist natürliches Deutsch und wahrt den militärischen Kontext, ohne einen Angriff ausdrücklich vorwegzunehmen.
- source_word: מַחֲנֵיהֶם
  choice: alle ihre Heerlager
  rationale: מַחֲנֶה kann ein Lager, ein Heerlager oder die darin versammelte Streitmacht bezeichnen. „Heerlager“ bewahrt das konkrete Bild und macht zugleich den militärischen Zusammenhang deutlich.
- source_word: עַם רָב
  choice: ein großes Heer
  rationale: עַם bedeutet grundsätzlich „Volk“, bezeichnet hier aber die versammelte große Menschen- beziehungsweise Streitmacht. Im Kriegskontext gibt „Heer“ den gemeinten Bezug idiomatisch wieder; die folgende Sandmetapher verdeutlicht die Menge.
- source_word: כַּחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם לָרֹב
  choice: so zahlreich wie der Sand am Ufer des Meeres
  rationale: Die Wendung vergleicht die zahlenmäßige Größe mit dem Sand am Meeresufer. „so zahlreich wie“ nimmt die adverbiale Funktion von לָרֹב natürlich ins Deutsche auf.
- source_word: סוּס
  choice: Pferde
  rationale: Der hebräische Singular wird kollektiv gebraucht; im Deutschen ist hier der Plural erforderlich.
- source_word: רֶכֶב
  choice: Streitwagen
  rationale: רֶכֶב bezeichnet in diesem militärischen Zusammenhang Wagen beziehungsweise die Wagenstreitmacht. „Streitwagen“ ist eindeutig und idiomatisch.
- source_word: רַב מְאֹד
  choice: sehr viele
  rationale: Die Verbindung betont die außerordentlich große Zahl der Pferde und Streitwagen; „sehr viele“ gibt dies in modernem, klarem Deutsch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hält die wiederholte Hervorhebung der Beteiligten fest, während Doppelpunkt und „dazu“ die anschließende Beschreibung der gewaltigen Streitmacht flüssig anbinden.
