lexical_decisions:
- source_word: יָמִים רַבִּים
  choice: lange Zeit
  rationale: Die Wendung bedeutet wörtlich »viele Tage« und bezeichnet idiomatisch einen längeren Zeitraum. »Lange Zeit« ist im modernen Deutschen natürlich und präzise.
- source_word: עָשָׂה ... מִלְחָמָה
  choice: führte ... Krieg
  rationale: Die hebräische Verbindung lautet wörtlich »Krieg machen«. Das übliche und würdevolle deutsche Idiom ist »Krieg führen«.
- source_word: יְהוֹשֻׁעַ
  choice: Josua
  rationale: Verwendet wird die im Deutschen herkömmliche biblische Namensform.
- source_word: אֶת כָּל הַמְּלָכִים הָאֵלֶּה
  choice: gegen alle diese Könige
  rationale: Im Zusammenhang der Wendung »Krieg führen« gibt »gegen« die feindliche Ausrichtung klar und natürlich wieder.
