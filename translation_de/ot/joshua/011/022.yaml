  text: לֹֽא נוֹתַ֣ר עֲנָקִ֔ים בְּ/אֶ֖רֶץ בְּנֵ֣י יִשְׂרָאֵ֑ל רַ֗ק בְּ/עַזָּ֛ה בְּ/גַ֥ת וּ/בְ/אַשְׁדּ֖וֹד נִשְׁאָֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/022.yaml
  text: No Anakim were left in the land of the sons of Israel[a]; only in Gaza, Gath[b], and Ashdod did some remain.
translation:
  language: de
  text: Im Land der Israeliten blieben keine Anakiter zurück; nur in Gaza, Gat und Aschdod blieben einige von ihnen zurück.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא נוֹתַר עֲנָקִים
  choice: waren keine Anakiter übrig geblieben
  rationale: Das hebräische נותר bezeichnet hier das nach den Feldzügen verbliebene Ergebnis. Das deutsche Plusquamperfekt passt zum erzählerischen Rückblick; „Anakiter“ gibt die Volksbezeichnung verständlich und etabliert wieder.
- source_word: בְּאֶרֶץ בְּנֵי יִשְׂרָאֵל
  choice: im Land der Israeliten
  rationale: Wörtlich steht „im Land der Söhne Israels“. Im modernen Deutschen bezeichnet „Israeliten“ dieselbe Volksgemeinschaft natürlich und ohne sachlichen Verlust.
- source_word: רַק
  choice: nur
  rationale: „Nur“ gibt die einschränkende Gegenüberstellung knapp und genau wieder.
- source_word: בְּעַזָּה בְּגַת וּבְאַשְׁדּוֹד
  choice: in Gaza, Gat und Aschdod
  rationale: Die Ortsnamen folgen geläufigen deutschen Schreibweisen. Die im Hebräischen wiederholte Präposition wird im Deutschen nur einmal gesetzt.
- source_word: נִשְׁאָרוּ
  choice: blieben welche übrig
  rationale: Das Verb greift die Anakiter als mitgedachtes Subjekt wieder auf. „Welche“ macht im Deutschen natürlich deutlich, dass einzelne Angehörige dieser Gruppe gemeint sind, ohne eine neue Bezugsgröße einzuführen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Der Satz bewahrt den deutlichen Gegensatz zwischen dem Land der Israeliten und den drei Städten; das wiederholte „übrig“ spiegelt die beiden verwandten hebräischen Verben und hält die Aussage präzise.
