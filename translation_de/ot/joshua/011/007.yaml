  yaml_path: translation/ot/joshua/011/007.yaml
  text: So Joshua[a], and all the people of war with him, came against them suddenly at the waters of Merom and fell upon them.
translation:
  language: de
  text: Da rückten Josua und das gesamte Kriegsvolk mit ihm plötzlich bei den Wassern von Merom gegen sie vor und fielen über sie her.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: zog … heran
  rationale: Das Qal-Wayyiqtol von בוא bezeichnet hier die gerichtete Annäherung an den Feind; »zog … heran« ist im deutschen Erzählstil natürlich und militärisch passend.
- source_word: עַם הַמִּלְחָמָה
  choice: das gesamte Kriegsvolk
  rationale: Die Wendung bedeutet wörtlich etwa »Volk des Krieges/Kampfes«. »Kriegsvolk« bewahrt den kollektiven Charakter von עַם und vermeidet die nicht ausdrücklich ausgesagte männliche Eingrenzung von »Kriegsmänner«.
- source_word: עִמּוֹ
  choice: das bei ihm war
  rationale: Gibt die Begleitung durch Josuas Streitmacht idiomatisch wieder.
- source_word: עֲלֵיהֶם
  choice: gegen sie
  rationale: עַל bezeichnet bei einer feindlichen Bewegung das Vorgehen gegen ein Ziel.
- source_word: עַל מֵי מֵרוֹם
  choice: an den Wassern von Merom
  rationale: Die Präpositionalverbindung bezeichnet den Ort bei dem als Merom bezeichneten Gewässer; »an den Wassern« bleibt nahe an der hebräischen Mehrzahl.
- source_word: פִּתְאֹם
  choice: plötzlich
  rationale: Direkte und natürliche Wiedergabe der unvermittelten, überraschenden Annäherung.
- source_word: וַיִּפְּלוּ בָּהֶם
  choice: fiel über sie her
  rationale: נפל mit ב bezeichnet idiomatisch einen Angriff. »Über jemanden herfallen« erhält das anschauliche Bild und ist im Deutschen verständlich.
- source_word: וְ
  choice: Da
  rationale: Das einleitende Waw führt die fortlaufende Erzählung weiter; »Da« bildet diese narrative Abfolge in modernem Deutsch angemessen ab.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erzählerischem Fluss. Die militärische Bildsprache des Hebräischen bleibt erhalten, ohne durch »Armee« stärker zu interpretieren oder durch »Kriegsmänner« eine im Kollektivnomen nicht ausdrücklich markierte Geschlechtsspezifizierung einzuführen.
