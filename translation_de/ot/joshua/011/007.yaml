  verdict: revise
  source_fidelity: 'Die Wiedergabe trifft Ortsangabe, Plötzlichkeit und die militärische Bildsprache des Hebräischen im Wesentlichen. Im Entwurf wird jedoch durch die Konstruktion „Josua mit dem ... Kriegsvolk“ beim zweiten Verb ein singularischer Bezug nahegelegt („fiel“), während das hebräische וַיִּפְּלוּ eindeutig Plural ist: Josua und das Kriegsvolk fielen über sie her.'
  naturalness: „Kriegsvolk“ ist in einem würdigen biblischen Register verständlich; die Umstellung zu einem zusammengesetzten Subjekt macht den Plural im Deutschen klar und erhält einen natürlichen Erzählfluss.
  terminology: „Kriegsvolk“ gibt den kollektiven Charakter von עַם הַמִּלְחָמָה angemessen wieder. „Bei den Wassern von Merom“ und „fielen über sie her“ sind idiomatisch und quellennah. Kein Fußnotenanker ist erforderlich.
  issues:
  - severity: medium
    issue: Numeruskongruenz und Bezug von „fiel über sie her“
    rationale: Das hebräische Verb וַיִּפְּלוּ steht im Plural und bezieht sich auf Josua samt dem gesamten Kriegsvolk. Die deutsche Singularform „fiel“ kann nur Josua als Subjekt verstehen und unterschlägt dadurch den pluralischen Handlungsträger.
  revised_text: Da rückten Josua und das gesamte Kriegsvolk mit ihm plötzlich bei den Wassern von Merom gegen sie vor und fielen über sie her.
