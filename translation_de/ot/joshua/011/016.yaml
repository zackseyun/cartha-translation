source:
  edition: WLC
  text: וַ/יִּקַּ֨ח יְהוֹשֻׁ֜עַ אֶת כָּל הָ/אָ֣רֶץ הַ/זֹּ֗את הָ/הָ֤ר וְ/אֶת כָּל הַ/נֶּ֨גֶב֙ וְ/אֵת֙ כָּל אֶ֣רֶץ הַ/גֹּ֔שֶׁן וְ/אֶת הַ/שְּׁפֵלָ֖ה וְ/אֶת הָ/עֲרָבָ֑ה וְ/אֶת הַ֥ר יִשְׂרָאֵ֖ל וּ/שְׁפֵלָתֹֽ/ה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/016.yaml
  text: 'So Joshua took all this land: the hill country[a], all the Negev, all the land of Goshen, the lowland, the Arabah, the hill country of Israel[c][b], and its lowland.'
translation:
  language: de
  text: 'So nahm Josua dieses ganze Land ein: das Bergland, den ganzen Negev, das ganze Land Goschen[c], die Schefela[a], die Araba[b], das Bergland Israels und dessen Schefela[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Schefela ist das niedrige Hügelland zwischen dem zentralen Bergland und der Küstenebene. Man kann auch „die Niederung“ übersetzen.
    reason: lexical_alternative
  - marker: b
    text: Die Araba ist eine geografische Regionsbezeichnung. Je nach Zusammenhang wird sie auch als „Jordantal“, „Senke“ oder „Wüstenebene“ wiedergegeben.
    reason: lexical_alternative
  - marker: c
    text: Das Land Goschen bezeichnet hier eine Gegend in Kanaan, nicht unbedingt das Goschen in Ägypten.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: So nahm … ein
  rationale: לקח bedeutet grundsätzlich „nehmen“. Im zusammenfassenden Kontext der Eroberung gibt „nahm … ein“ den gemeinten Gebietserwerb im natürlichen Deutschen wieder; „so“ kennzeichnet den zusammenfassenden Fortgang der Erzählung.
- source_word: כָּל הָאָרֶץ הַזֹּאת
  choice: dieses ganze Land
  rationale: Die Wiedergabe bewahrt sowohl den umfassenden Ausdruck כָּל als auch die hinweisende Kraft von הַזֹּאת.
- source_word: הָהָר
  choice: das Bergland
  rationale: Der Ausdruck bezeichnet hier eine Hochlandregion, nicht lediglich einzelne Berge.
- source_word: הַנֶּגֶב
  choice: den ganzen Negev
  rationale: Negev wird als Bezeichnung der südlichen Landschaft beibehalten; כָּל wird ausdrücklich mit „ganzen“ wiedergegeben.
- source_word: אֶרֶץ הַגֹּשֶׁן
  choice: das ganze Land Goschen
  rationale: Die Konstruktion wird direkt wiedergegeben, ohne das kanaanäische Goschen im Haupttext näher zu identifizieren.
- source_word: הַשְּׁפֵלָה
  choice: die Schefela
  rationale: Der regionale Name wird transliteriert, weil er die besondere Hügellandschaft zwischen dem zentralen Bergland und der Küstenebene bezeichnet; eine Fußnote erklärt ihn.
- source_word: הָעֲרָבָה
  choice: die Araba
  rationale: Die geografische Regionalbezeichnung wird in ihrer im Deutschen üblichen Form beibehalten, statt sie enger als „Jordantal“ auszulegen.
- source_word: הַר יִשְׂרָאֵל
  choice: das Bergland Israels
  rationale: Wie הָהָר bezeichnet der Ausdruck eine Berglandregion; die Genitivverbindung entspricht dem hebräischen Konstruktus.
- source_word: וּשְׁפֵלָתוֹ
  choice: und dessen Schefela
  rationale: „Dessen“ bewahrt den maskulinen Singularsuffix und bezieht ihn am natürlichsten auf das unmittelbar vorausgehende „Bergland Israels“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Aufzählungsstruktur des Hebräischen bleibt erhalten. Bekannte regionale Bezeichnungen werden beibehalten und knapp erklärt; die Wiederholung von Schefela spiegelt die Wiederholung desselben hebräischen Begriffs.
