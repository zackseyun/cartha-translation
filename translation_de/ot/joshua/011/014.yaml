  text: וְ֠/כֹל שְׁלַ֞ל הֶ/עָרִ֤ים הָ/אֵ֨לֶּה֙ וְ/הַ/בְּהֵמָ֔ה בָּזְז֥וּ לָ/הֶ֖ם בְּנֵ֣י יִשְׂרָאֵ֑ל רַ֣ק אֶֽת כָּל הָ/אָדָ֞ם הִכּ֣וּ לְ/פִי חֶ֗רֶב עַד הִשְׁמִדָ/ם֙ אוֹתָ֔/ם לֹ֥א הִשְׁאִ֖ירוּ כָּל נְשָׁמָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/014.yaml
  text: And all the spoil of these cities[a], along with the livestock, the sons of Israel plundered for themselves; only all the people they struck with the edge of the sword until they had destroyed them[d][c][b]. They left no breathing thing.
translation:
  language: de
  text: Die Israeliten nahmen die gesamte Beute dieser Städte sowie das Vieh für sich. Nur alle Menschen erschlugen sie mit der Schneide des Schwertes, bis sie sie vernichtet hatten. Sie ließen niemanden zurück, der noch atmete.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Sie ließen keinen Atem übrig.“ Möglich ist auch: „Sie ließen nichts am Leben, was Atem hatte.“ Im Zusammenhang bezieht sich die Aussage auf die menschliche Bevölkerung, da das Vieh als Beute genommen wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלַל
  choice: Beute
  rationale: Bezeichnet im Krieg erbeutete Güter; „Beute“ ist im modernen Deutschen klar und trifft den militärischen Zusammenhang.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: diese Städte
  rationale: Der Demonstrativausdruck verweist auf die unmittelbar zuvor genannten Städte.
- source_word: הַבְּהֵמָה
  choice: das Vieh
  rationale: Gemeint sind domestizierte Tiere als erbeuteter Besitz; „Vieh“ ist präziser als das allgemeinere „Tiere“.
- source_word: בָּזְזוּ לָהֶם
  choice: nahmen ... für sich als Beute
  rationale: Gibt sowohl das Erbeuten als auch den durch לָהֶם bezeichneten eigenen Nutzen natürlich wieder.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die wörtliche Wendung „Söhne Israels“ dient hier als Volksbezeichnung; „Israeliten“ ist im Deutschen natürlich und umfasst die handelnde Gemeinschaft, ohne das Hebräische auf ausschließlich männliche Einzelpersonen zu verengen.
- source_word: רַק
  choice: doch
  rationale: Markiert den starken Gegensatz zwischen der Aneignung von Beute und der Tötung der menschlichen Bevölkerung.
- source_word: כָּל הָאָדָם
  choice: alle Menschen
  rationale: אָדָם bezeichnet hier kollektiv die menschliche Bevölkerung im Gegensatz zum Vieh; „alle Menschen“ bewahrt diesen Gegensatz, ohne Frauen und Kinder sprachlich auszuschließen.
- source_word: הִכּוּ לְפִי חֶרֶב
  choice: erschlugen sie mit der Schärfe des Schwertes
  rationale: Bewahrt das Bild der hebräischen Wendung („mit dem Mund des Schwertes“) in einer verständlichen deutschen Form und gibt die tödliche Wirkung des Verbs im Kontext wieder.
- source_word: עַד הִשְׁמִדָם אֹתָם
  choice: bis sie sie vernichtet hatten
  rationale: Der Hifil von שׁמד bedeutet hier vernichten beziehungsweise ausrotten; „vernichtet“ ist direkt und führt keine hier nicht ausdrücklich verwendete Bannterminologie ein.
- source_word: לֹא הִשְׁאִירוּ כָּל נְשָׁמָה
  choice: Sie ließen niemanden am Leben, der Atem hatte
  rationale: Gibt die Aussage als völliges Ausbleiben menschlicher Überlebender wieder und bewahrt zugleich das konkrete hebräische Atembild.
theological_decisions:
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: Obwohl die Form wörtlich „Söhne Israels“ lautet, fungiert sie hier idiomatisch als Bezeichnung des Volkes. Die natürliche deutsche Volksbezeichnung vermeidet eine unbeabsichtigte Beschränkung auf Männer.
- issue: Umfang von כָּל הָאָדָם
  choice: alle Menschen
  alternative: die gesamte Bevölkerung
  rationale: Der kollektive Singular אָדָם steht im Gegensatz zum Vieh und bezeichnet die menschlichen Bewohner insgesamt. Die Übersetzung hält den umfassenden und erschütternden Aussagegehalt fest, ohne ihn auf erwachsene Männer einzuengen.
- issue: Bezug von כָּל נְשָׁמָה
  choice: niemanden am Leben, der Atem hatte
  alternative: nichts, was Atem hatte
  rationale: Im unmittelbaren Gegensatz werden Vieh als Beute und Menschen als Getötete unterschieden. Daher bezieht sich die Schlussformel hier kontextuell auf menschliche Überlebende; eine Fußnote bewahrt die formal weitere Alternative.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Satzbau wurde gegenüber der hebräischen Voranstellung behutsam geglättet. Das harte Gewaltvokabular bleibt ungemildert; zugleich wird die konkrete Atemmetapher in verständlicher Form bewahrt.
