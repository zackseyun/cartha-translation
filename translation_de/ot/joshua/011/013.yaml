base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/013.yaml
  text: But Israel did not burn any of the cities that stood on their mounds[a], except Hazor alone; Joshua burned it.
translation:
  language: de
  text: Doch Israel verbrannte keine der Städte, die auf ihren Siedlungshügeln[a] standen, außer Hazor allein; Josua verbrannte es.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »auf ihren Tells« – also auf Siedlungshügeln, die durch aufeinanderfolgende Besiedlungsschichten entstanden sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Doch
  rationale: Leitet den Gegensatz beziehungsweise die Ausnahme gegenüber dem vorherigen Bericht natürlich ein.
- source_word: כָּל הֶעָרִים ... לֹא שְׂרָפָם
  choice: verbrannte keine der Städte
  rationale: Gibt die Gesamtheit im Geltungsbereich der Verneinung idiomatisch und eindeutig wieder.
- source_word: הָעֹמְדוֹת עַל תִּלָּם
  choice: die auf ihren Siedlungshügeln standen
  rationale: Bewahrt das Bild des Stehens und bezeichnet תֵּל verständlich als durch frühere Besiedlung entstandenen Hügel.
- source_word: זוּלָתִי אֶת חָצוֹר לְבַדָּהּ
  choice: außer Hazor allein
  rationale: Gibt sowohl die Ausnahmeformel als auch die ausdrückliche Hervorhebung Hazors als einzige Ausnahme wieder.
- source_word: שָׂרַף יְהוֹשֻׁעַ
  choice: Josua verbrannte es
  rationale: Erhält die Wiederholung des Verbs; das Pronomen verweist im Deutschen natürlich auf das grammatisch sächliche Hazor.
