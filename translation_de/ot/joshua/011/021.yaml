  text: וַ/יָּבֹ֨א יְהוֹשֻׁ֜עַ בָּ/עֵ֣ת הַ/הִ֗יא וַ/יַּכְרֵ֤ת אֶת הָֽ/עֲנָקִים֙ מִן הָ/הָ֤ר מִן חֶבְרוֹן֙ מִן דְּבִ֣ר מִן עֲנָ֔ב וּ/מִ/כֹּל֙ הַ֣ר יְהוּדָ֔ה וּ/מִ/כֹּ֖ל הַ֣ר יִשְׂרָאֵ֑ל עִם עָרֵי/הֶ֖ם הֶחֱרִימָ֥/ם יְהוֹשֻֽׁעַ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/021.yaml
  text: At that time Joshua came and cut off the Anakim from the hill country—from Hebron[a], from Debir, from Anab, and from all the hill country of Judah and from all the hill country of Israel. Joshua devoted them to destruction, together with their cities.
translation:
  language: de
  text: Zu jener Zeit kam Josua und rottete die Anakiter aus dem Bergland aus – aus Hebron, aus Debir und aus Anab sowie aus dem ganzen Bergland Judas und aus dem ganzen Bergland Israels. Josua weihte sie samt ihren Städten dem Bann.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Verb bezeichnet hier, Menschen oder Dinge dem Bann und damit der Vernichtung zu übergeben; wörtlicher: „sie dem Bann weihen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: kam
  rationale: Das gewöhnliche Bewegungsverb בוא wird ohne zusätzlich erschlossenes Ziel formal als „kam“ wiedergegeben; der Erzählfortgang bleibt erhalten.
- source_word: בָּעֵת הַהִיא
  choice: Zu jener Zeit
  rationale: Die geläufige deutsche Zeitangabe verbindet den Vers natürlich mit dem vorausgehenden Bericht.
- source_word: וַיַּכְרֵת
  choice: rottete ... aus
  rationale: כרת bedeutet wörtlich „abschneiden“, bezeichnet hier aber die gewaltsame Beseitigung einer Volksgruppe aus einem Gebiet. „Ausrotten“ gibt den Kontext klar wieder und bleibt vom nachfolgenden technischen חרם-Ausdruck unterschieden.
- source_word: הָעֲנָקִים
  choice: die Anakiter
  rationale: „Anakiter“ ist die im Deutschen gebräuchliche Bezeichnung für die von Anak hergeleitete Volksgruppe.
- source_word: מִן הָהָר
  choice: aus dem Bergland
  rationale: ההר bezeichnet in Josua häufig eine Hochlandregion, nicht einen einzelnen Berg.
- source_word: מִן חֶבְרוֹן מִן דְּבִר מִן עֲנָב
  choice: aus Hebron, Debir und Anab
  rationale: Die Ortsnamen werden in ihren etablierten deutschen Formen wiedergegeben; das erste „aus“ regiert die koordinierte Ortsliste natürlich.
- source_word: וּמִכֹּל הַר יְהוּדָה
  choice: aus dem ganzen Bergland Judas
  rationale: Die Genitivform „Judas“ ist im Deutschen eine natürliche geografische Bezeichnung für das Juda zugehörige Hochland.
- source_word: וּמִכֹּל הַר יִשְׂרָאֵל
  choice: aus dem ganzen Bergland Israels
  rationale: „Israel“ bleibt als geografisch-politische Bezeichnung stehen, ohne die gemeinte Region näher auszudeuten.
- source_word: עִם עָרֵיהֶם
  choice: samt ihren Städten
  rationale: „Samt“ drückt die Begleitung knapp und würdig aus; „Städte“ ist in diesem Erzählzusammenhang die übliche Wiedergabe von ערים.
- source_word: הֶחֱרִימָם
  choice: vollstreckte an ihnen ... den Bann
  rationale: Die Formulierung bewahrt den besonderen Sinn von חרם als Überantwortung an den Bann und damit an die Vernichtung, statt das Verb lediglich mit einem allgemeinen „vernichten“ wiederzugeben.
theological_decisions:
- issue: Wiedergabe der Bannterminologie חרם
  choice: Josua vollstreckte an ihnen samt ihren Städten den Bann.
  alternative: Josua weihte sie samt ihren Städten der Vernichtung.
  rationale: Der Text verwendet zunächst כרת und danach חרם. Die Übersetzung unterscheidet deshalb die allgemeine Aussage des Ausrottens von der besonderen religiös-kriegerischen Bannterminologie. Die Fußnote erklärt deren Vernichtungsdimension, ohne die Spannung des Ausdrucks im Haupttext aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Orts- und Regionsfolge des Hebräischen bleibt sichtbar; der technische Bannbegriff wird im Haupttext bewahrt und in der Fußnote knapp erläutert.
