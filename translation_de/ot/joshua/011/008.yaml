source:
  edition: WLC
  text: וַ/יִּתְּנֵ֨/ם יְהוָ֥ה בְּ/יַֽד יִשְׂרָאֵל֮ וַ/יַּכּוּ/ם֒ וַֽ/יִּרְדְּפ֞וּ/ם עַד צִיד֣וֹן רַבָּ֗ה וְ/עַד֙ מִשְׂרְפ֣וֹת מַ֔יִם וְ/עַד בִּקְעַ֥ת מִצְפֶּ֖ה מִזְרָ֑חָ/ה וַ/יַּכֻּ֕/ם עַד בִּלְתִּ֥י הִשְׁאִֽיר לָ/הֶ֖ם שָׂרִֽיד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/008.yaml
  text: And Yahweh gave them into the hand of Israel[a], and they struck them down and pursued them as far as Great Sidon and as far as Misrephoth-maim and as far as the Valley of Mizpeh to the east[b]; and they struck them down until they had left them no survivor.
translation:
  language: de
  text: Und Jahwe gab sie in die Hand Israels. Die Israeliten schlugen sie und verfolgten sie bis Groß-Sidon, bis Misrefot-Majim[a] und bis zur Talebene von Mizpa im Osten. Sie schlugen sie, bis sie niemanden von ihnen am Leben ließen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Misrefot-Majim ist ein Ortsname; der hebräische Name kann „Verbrennungen des Wassers“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „bis er niemanden von ihnen am Leben ließ“. Der hebräische Infinitiv bezeichnet hier weder Person noch Numerus ausdrücklich; als Subjekt kommen die Israeliten, Israel als Kollektiv oder Josua als ihr Anführer infrage.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְּנֵם ... בְּיַד יִשְׂרָאֵל
  choice: gab sie in die Hand Israels
  rationale: Die militärische Wendung bezeichnet die Auslieferung in Israels Gewalt. Die Beibehaltung von „Hand“ bewahrt das hebräische Bild und ist im Deutschen verständlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen übliche Wiedergabe des göttlichen Eigennamens bewahrt den Eigennamen statt ihn durch einen Titel zu ersetzen.
- source_word: וַיַּכּוּם / וַיַּכֻּם
  choice: schlugen sie
  rationale: נכה bezeichnet im Kriegskontext ein gewaltsames Schlagen beziehungsweise Niederschlagen. Die wiederholte Formulierung bildet die Wiederholung im Hebräischen ab, ohne die Tötung bei jedem einzelnen Vorkommen stärker festzulegen als der Ausgangstext.
- source_word: וַיִּרְדְּפוּם
  choice: verfolgten sie
  rationale: Direkte und natürliche Wiedergabe der Verfolgung eines fliehenden Feindes.
- source_word: צִידוֹן רַבָּה
  choice: Groß-Sidon
  rationale: Gibt den Stadtnamen mit dem qualifizierenden Adjektiv knapp und als Ortsbezeichnung wieder.
- source_word: מִשְׂרְפוֹת מַיִם
  choice: Misrefot-Majim
  rationale: Die Wortfolge fungiert als Ortsname und wird daher transliteriert; ihre mögliche wörtliche Bedeutung wird in einer Fußnote erhalten.
- source_word: בִּקְעַת מִצְפֶּה
  choice: Talebene von Mizpa
  rationale: בִּקְעָה bezeichnet eine breite Talebene. „Talebene“ bewahrt beide räumlichen Aspekte besser als nur „Tal“ oder „Ebene“.
- source_word: מִזְרָחָה
  choice: im Osten
  rationale: Die Richtungsform lokalisiert hier die Talebene östlich beziehungsweise ostwärts; „im Osten“ ist im Zusammenhang natürlich.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לָהֶם שָׂרִיד
  choice: bis sie keinen Überlebenden von ihnen übrig gelassen hatten
  rationale: Die Konstruktion bezeichnet das vollständige Ausbleiben eines Überlebenden. Der Infinitiv הִשְׁאִיר markiert selbst weder Numerus noch Person; der Plural wird aus den unmittelbar vorausgehenden pluralischen Verben erschlossen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. „Jahwe“ gibt ihn als Eigennamen wieder, während „der HERR“ ihn durch einen traditionellen Ersatztitel ersetzen würde.
- issue: Subjekt der abschließenden Infinitivkonstruktion
  choice: sie hatten keinen Überlebenden übrig gelassen
  alternative: er hatte keinen Überlebenden übrig gelassen
  rationale: Der Infinitiv legt Person und Numerus nicht morphologisch fest. Der Plural folgt am ehesten den unmittelbar vorausgehenden pluralischen Handlungen; ein singularisches Verständnis mit Israel als Kollektiv oder Josua als Repräsentant bleibt möglich und wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Sätze wurden gegenüber der langen hebräischen Satzkette maßvoll gegliedert. „Die Israeliten“ macht das in „Israel“ enthaltene Handlungssubjekt natürlich verständlich; Ortsnamen bleiben transliteriert. Sämtliche Fußnotenmarker stehen unmittelbar bei der jeweils erläuterten Stelle.
