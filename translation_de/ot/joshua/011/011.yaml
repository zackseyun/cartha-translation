  text: וַ֠/יַּכּוּ אֶת כָּל הַ/נֶּ֨פֶשׁ אֲשֶׁר בָּ֤/הּ לְ/פִי חֶ֨רֶב֙ הַֽחֲרֵ֔ם לֹ֥א נוֹתַ֖ר כָּל נְשָׁמָ֑ה וְ/אֶת חָצ֖וֹר שָׂרַ֥ף בָּ/אֵֽשׁ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/011.yaml
  text: They struck down every person who was in it with the edge of the sword[a], devoting them to destruction; not a single breathing thing was left[c][b], and he burned Hazor with fire.
translation:
  language: de
  text: Sie schlugen alle Menschen, die darin waren, mit der Schärfe des Schwertes nieder und weihten sie der Vernichtung[a]. Kein Lebewesen blieb übrig[b]. Er verbrannte Hazor mit Feuer[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und vollstreckten an ihnen den Bann“. Das hebräische Wort חרם bezeichnet hier die unwiderrufliche Aussonderung zur Vernichtung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Kein Atem blieb übrig“; die Wendung besagt, dass kein Überlebender zurückblieb.'
    reason: lexical_alternative
  - marker: c
    text: Im Hebräischen wechselt die Aussage vom Plural („sie schlugen nieder“) zum Singular („er verbrannte“). Mit „er“ ist wahrscheinlich Josua gemeint.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: sie schlugen … nieder
  rationale: Die Hifil-Form von נכה bezeichnet im Kriegskontext das Niederschlagen beziehungsweise Töten. „Niederschlagen“ bewahrt den militärischen Ausdruck, ohne ihn auf einen bloßen Schlag zu verengen.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: alle Menschen, die darin waren
  rationale: נֶפֶשׁ bezeichnet hier die in der Stadt befindlichen Personen, nicht eine vom Körper getrennte Seele. Der deutsche Plural gibt den kollektiven Sinn natürlich wieder.
- source_word: לְפִי חֶרֶב
  choice: mit der Schärfe des Schwertes
  rationale: Die wörtliche Wendung „mit dem Mund des Schwertes“ ist ein hebräisches Bild für die Schneide beziehungsweise Schärfe der Waffe. Die gewählte Formulierung wahrt das Bild in verständlichem Deutsch.
- source_word: הַחֲרֵם
  choice: weihten sie vollständig dem Untergang
  rationale: Der absolute Infinitiv von חרם kennzeichnet die Tötung als Vollzug des Banns beziehungsweise als Weihe zur Vernichtung und verstärkt die Aussage. Die Formulierung erhält diesen besonderen Bedeutungsgehalt, statt ihn zu bloßem „vernichten“ einzuebnen.
- source_word: לֹא נוֹתַר כָּל נְשָׁמָה
  choice: Kein Wesen, das Atem hatte, blieb übrig
  rationale: נְשָׁמָה ist mit Atem und Atmen verbunden. Die Wiedergabe erhält das konkrete Bild und drückt zugleich aus, dass kein Überlebender zurückblieb.
- source_word: חָצוֹר
  choice: Hazor
  rationale: Der Ortsname wird nach der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: שָׂרַף בָּאֵשׁ
  choice: verbrannte er mit Feuer
  rationale: Die Formulierung bewahrt sowohl das singularische Verb als auch die ausdrückliche Nennung des Feuers. Die leichte Wiederholung entspricht der betonten hebräischen Wendung.
theological_decisions:
- issue: Wiedergabe von חרם im Zusammenhang der Landnahme
  choice: weihten sie vollständig dem Untergang
  alternative: vernichteten sie vollständig; vollstreckten an ihnen den Bann
  rationale: חרם trägt hier über das militärische Töten hinaus die Vorstellung einer unwiderruflichen Aussonderung zur Vernichtung. Die gewählte Wiedergabe bewahrt dieses theologische Gewicht, ohne eine bestimmte spätere Lehrdeutung einzutragen.
- issue: Wechsel des Subjekts vom Plural zum Singular
  choice: Sie schlugen …; Hazor aber verbrannte er
  alternative: Sie schlugen …; und sie verbrannten Hazor
  rationale: Der hebräische Text wechselt von וַיַּכּוּ im Plural zu שָׂרַף im Singular. Dieser Wechsel bleibt sichtbar; das singularische Subjekt ist im Zusammenhang wahrscheinlich Josua, wird im Haupttext aber nicht ausdrücklich ergänzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wendungen „mit der Schärfe des Schwertes“ und „mit Feuer“ bewahren bewusst die Bildhaftigkeit und Betonung des Hebräischen; technische Bannsprache wird im Haupttext verständlich umschrieben und in der Fußnote erläutert.
