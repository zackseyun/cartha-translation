  text: וְֽ/אֶת כָּל עָרֵ֣י הַ/מְּלָכִֽים הָ֠/אֵלֶּה וְֽ/אֶת כָּל מַלְכֵי/הֶ֞ם לָכַ֧ד יְהוֹשֻׁ֛עַ וַ/יַּכֵּ֥/ם לְ/פִי חֶ֖רֶב הֶחֱרִ֣ים אוֹתָ֑/ם כַּ/אֲשֶׁ֣ר צִוָּ֔ה מֹשֶׁ֖ה עֶ֥בֶד יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/012.yaml
  text: Joshua captured all the cities of these kings[a], and all their kings, and he struck them down with the edge of the sword. He devoted them to destruction, just as Moses the servant of Yahweh had commanded.
translation:
  language: de
  text: Josua nahm alle Städte dieser Könige und alle ihre Könige ein. Er schlug sie mit der Schneide des Schwertes nieder und vollstreckte an ihnen den Bann[a], so wie Mose, der Diener Jahwes, es befohlen hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »vernichtete sie vollständig«. Das hebräische Verb ist der Fachausdruck dafür, Menschen oder Dinge unter den Bann zu stellen, das heißt, sie unwiderruflich der Vernichtung zu übergeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵי הַמְּלָכִים הָאֵלֶּה
  choice: alle Städte dieser Könige
  rationale: Die Konstrukstatusverbindung bezeichnet die Städte, die zu den zuvor genannten Königen gehörten; »Städte dieser Könige« wahrt diesen Bezug, ohne sie deutend als »Königsstädte« zu bezeichnen.
- source_word: לָכַד
  choice: nahm ... ein
  rationale: Im Zusammenhang eines Feldzugs ist »eine Stadt einnehmen« die natürliche moderne deutsche Wiedergabe für die militärische Eroberung.
- source_word: וַיַּכֵּם
  choice: schlug sie ... nieder
  rationale: נכה ist semantisch breit, bezeichnet hier zusammen mit »mit der Schärfe des Schwertes« aber tödliche Gewalt. »Niederschlagen« erhält den Handlungscharakter, ohne altertümlich zu klingen.
- source_word: לְפִי חֶרֶב
  choice: mit der Schärfe des Schwertes
  rationale: Die hebräische Wendung lautet wörtlich »mit dem Mund des Schwertes«. Die gewählte Form bewahrt das konkrete Bild der Schwertschneide in verständlichem Deutsch.
- source_word: הֶחֱרִים
  choice: vollstreckte an ihnen den Bann
  rationale: Das Hifil von חרם ist ein technischer Ausdruck dafür, Menschen oder Dinge unwiderruflich dem Bann und damit hier der Vernichtung zu übergeben. »Den Bann vollstrecken« bewahrt diesen besonderen Sinn besser als das allgemeinere »vernichten«.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: genauso wie ... es befohlen hatte
  rationale: Die Vergleichspartikel bezeichnet die Übereinstimmung mit einem früher ergangenen Befehl; das Plusquamperfekt bildet die zeitliche Abfolge im Deutschen natürlich ab.
- source_word: עֶבֶד יְהוָה
  choice: der Diener Jahwes
  rationale: עבד dient hier als ehrender Amts- und Bundesbegriff für Mose. »Diener« ist in diesem Zusammenhang angemessener als »Sklave«.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel »der HERR« ersetzt. »Jahwe« ist die im Deutschen geläufige Form.
theological_decisions:
- issue: Wiedergabe der Bannformel חרם im Kontext der Eroberung
  choice: vollstreckte an ihnen den Bann
  alternative: vernichtete sie vollständig; weihte sie der Vernichtung
  rationale: Der hebräische Text verwendet einen technischen Bannbegriff und nicht lediglich ein allgemeines Verb für Zerstörung. Die gewählte Fassung wahrt dessen kultisch-bundestheologische Dimension und macht im Zusammenhang zugleich deutlich, dass der Bann an Menschen vollzogen wurde.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Da der Text den Tetragrammaton als Gottes Eigennamen verwendet, wird er durch »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt nah am hebräischen Erzählstil, wird aber durch natürliche deutsche Verbverbindungen geglättet. Der technische Bannbegriff bleibt sichtbar und wird durch eine Fußnote erläutert.
