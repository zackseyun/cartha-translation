base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/009.yaml
  text: 'And Joshua did to them just as Yahweh had told him: he hamstrung their horses and burned their chariots with fire[a].'
translation:
  language: de
  text: 'Und Josua verfuhr mit ihnen genauso, wie Jahwe es ihm gesagt hatte: Er lähmte ihre Pferde[a] und verbrannte ihre Streitwagen mit Feuer.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet das Kampfunfähigmachen der Pferde, vermutlich durch Durchtrennen ihrer Beinsehnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ לָהֶם
  choice: verfuhr mit ihnen
  rationale: Die deutsche Wendung gibt עשה + ל als ein Handeln an ihnen beziehungsweise gegenüber ihrem militärischen Besitz natürlich wieder.
- source_word: כַּאֲשֶׁר אָמַר לוֹ
  choice: genauso, wie ... es ihm gesagt hatte
  rationale: „Genauso, wie“ bewahrt die vergleichende Aussage; das Plusquamperfekt entspricht der zeitlichen Abfolge der Erzählung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: סוּסֵיהֶם
  choice: ihre Pferde
  rationale: Direkte und idiomatische Wiedergabe des Plurals mit Possessivsuffix.
- source_word: עִקֵּר
  choice: ließ ... lähmen
  rationale: Das Verb bezeichnet hier das Durchtrennen der Beinsehnen und damit das dauerhafte Untauglichmachen der Pferde; „lähmen“ ist verständlich, während die Fußnote die konkrete Handlung nennt.
- source_word: מַרְכְּבֹתֵיהֶם
  choice: ihre Streitwagen
  rationale: „Streitwagen“ bezeichnet im militärischen Zusammenhang präziser als das allgemeine „Wagen“ die gemeinten Fahrzeuge.
- source_word: שָׂרַף בָּאֵשׁ
  choice: verbrannte
  rationale: Im Deutschen bezeichnet „verbrannte“ bereits ausdrücklich die Vernichtung durch Feuer; „mit Feuer verbrennen“ wäre unnötig schwerfällig.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen; seine Wiedergabe als „Jahwe“ bewahrt diesen gegenüber der traditionellen Ersetzung durch einen Titel.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die militärische Bedeutung wird durch „Streitwagen“ verdeutlicht; die drastische Einzelhandlung hinter עִקֵּר wird aus Lesbarkeitsgründen in der Fußnote präzisiert.
