  text: וַ/יָּ֨שָׁב יְהוֹשֻׁ֜עַ בָּ/עֵ֤ת הַ/הִיא֙ וַ/יִּלְכֹּ֣ד אֶת חָצ֔וֹר וְ/אֶת מַלְכָּ֖/הּ הִכָּ֣ה בֶ/חָ֑רֶב כִּֽי חָצ֣וֹר לְ/פָנִ֔ים הִ֕יא רֹ֖אשׁ כָּל הַ/מַּמְלָכ֥וֹת הָ/אֵֽלֶּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/010.yaml
  text: At that time Joshua turned back and captured Hazor[a], and he struck its king with the sword[c][b], for formerly Hazor was the head of all these kingdoms.
translation:
  language: de
  text: Zu jener Zeit wandte Josua sich zurück[a] und nahm Hazor ein. Den König Hazors schlug er mit dem Schwert[b]; denn Hazor war früher das Haupt[c] all dieser Königreiche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „kehrte zurück“. Das hebräische Verb kann beides ausdrücken; „wandte sich zurück“ hebt die Richtungsänderung im Verlauf des Feldzugs hervor.'
    reason: lexical_alternative
  - marker: b
    text: „Schlug … mit dem Schwert“ gibt das Hebräische zurückhaltend wieder. Im Zusammenhang ist wahrscheinlich gemeint, dass er den König tötete; das Verb selbst bedeutet jedoch wörtlich „schlagen“.
    reason: lexical_alternative
  - marker: c
    text: 'Das hebräische Bild lautet wörtlich „Haupt“ und bezeichnet hier den Vorrang Hazors; möglich ist auch: „die führende Stadt über all diese Königreiche“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: wandte … sich zurück
  rationale: Das Verb שוב bezeichnet hier eine Rück- oder Umkehrbewegung im Verlauf des Feldzugs. „Wandte sich zurück“ bewahrt diese räumliche Nuance; möglich ist auch „kehrte zurück“.
- source_word: בָּעֵת הַהִיא
  choice: Zu jener Zeit
  rationale: Die übliche deutsche Wiedergabe der temporalen Wendung, ohne sie auf einen einzelnen Augenblick einzuengen.
- source_word: וַיִּלְכֹּד
  choice: nahm … ein
  rationale: לכד bezeichnet im militärischen Zusammenhang die Einnahme einer Stadt. „Nahm … ein“ ist im Deutschen natürlich und präzise.
- source_word: חָצוֹר
  choice: Hazor
  rationale: Der Ortsname wird in seiner im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: מַלְכָּהּ
  choice: seinen König
  rationale: Das feminine Suffix bezieht sich im Hebräischen auf die Stadt Hazor. Im Deutschen wird Hazor als Ortsname mit dem passenden possessiven Bezug „seinen“ aufgenommen.
- source_word: הִכָּה בֶחָרֶב
  choice: schlug er mit dem Schwert
  rationale: נכה bedeutet wörtlich „schlagen“. Der Zusammenhang legt eine Tötung nahe, doch die zurückhaltende Formulierung bewahrt den Wortlaut, ohne ausdrücklich „töten“ einzutragen.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet eine Begründung beziehungsweise Erläuterung zur Bedeutung Hazors ein.
- source_word: לְפָנִים
  choice: früher
  rationale: Das Wort verweist knapp und idiomatisch auf einen früheren Zustand.
- source_word: רֹאשׁ
  choice: das Haupt
  rationale: Die wörtliche Metapher „Haupt“ bezeichnet den Vorrang Hazors unter den Königreichen und ist auch im Deutschen verständlich.
- source_word: כָּל הַמַּמְלָכוֹת הָאֵלֶּה
  choice: all dieser Königreiche
  rationale: Die Formulierung bewahrt sowohl die Gesamtheit als auch den demonstrativen Bezug des Hebräischen.
