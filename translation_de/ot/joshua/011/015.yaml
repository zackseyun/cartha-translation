  text: כַּ/אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֶת מֹשֶׁ֣ה עַבְדּ֔/וֹ כֵּן צִוָּ֥ה מֹשֶׁ֖ה אֶת יְהוֹשֻׁ֑עַ וְ/כֵן֙ עָשָׂ֣ה יְהוֹשֻׁ֔עַ לֹֽא הֵסִ֣יר דָּבָ֔ר מִ/כֹּ֛ל אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/015.yaml
  text: Just as Yahweh had commanded Moses his servant[a], so Moses commanded Joshua, and so Joshua did. He left nothing undone of all that Yahweh had commanded Moses.
translation:
  language: de
  text: Wie Jahwe seinem Diener Mose geboten hatte, so gebot Mose Josua, und so handelte Josua. Er ließ nichts von allem aus, was Jahwe Mose geboten hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Er entfernte keine Sache von allem, was Jahwe Mose geboten hatte.« Gemeint ist, dass Josua nichts davon ausließ.'
    reason: lexikalische Alternative und Erklärung des hebräischen Idioms
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Genauso wie
  rationale: Leitet den genauen Vergleich zwischen Jahwes Auftrag an Mose und Moses Auftrag an Josua ein und klingt im modernen Deutschen natürlich.
- source_word: צִוָּה
  choice: geboten hatte / gebot / geboten hatte
  rationale: Bewahrt den autoritativen Charakter des Verbs; das Plusquamperfekt kennzeichnet die jeweils vorausliegende Anordnung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: עַבְדּוֹ
  choice: seinem Diener
  rationale: Im ehrenden Kontext für Mose ist „Diener“ die natürliche deutsche Wiedergabe, ohne den möglichen sozialen Sinn „Sklave“ in den Vordergrund zu rücken.
- source_word: כֵּן
  choice: so
  rationale: Markiert knapp die Entsprechung; die Wiederholung bildet die Struktur des Hebräischen nach.
- source_word: עָשָׂה
  choice: führte … aus
  rationale: Im Kontext bezeichnet das allgemeine Verb die praktische Ausführung des Gebotenen. Die deutsche Formulierung macht den Bezug klar und bleibt knapp.
- source_word: לֹא הֵסִיר דָּבָר
  choice: Er ließ nichts … unausgeführt
  rationale: Gibt den Sinn vollständigen Gehorsams idiomatisch wieder; die wörtliche Wendung „er entfernte keine Sache“ wäre im Deutschen missverständlich.
- source_word: דָּבָר
  choice: nichts
  rationale: Bezeichnet hier keinen einzelnen gesprochenen Satz, sondern keinen Bestandteil dessen, was geboten worden war.
- source_word: מִכֹּל אֲשֶׁר
  choice: von allem, was
  rationale: Drückt die Gesamtheit der göttlichen Weisungen in natürlichem Deutsch aus.
- source_word: אֶת
  choice: nicht eigens wiedergegeben
  rationale: Der hebräische Akkusativmarker hat keine selbstständige deutsche Entsprechung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen ausdrücklich. „Jahwe“ bewahrt diesen, während „der HERR“ ihn durch einen traditionellen Titel ersetzt.
- issue: Aussage über Josuas vollständigen Gehorsam
  choice: Er ließ nichts von allem unausgeführt
  alternative: Er entfernte keine Sache von allem
  rationale: Die idiomatische Wiedergabe bewahrt die Aussage vollständiger Ausführung, ohne dem ungewöhnlichen hebräischen Ausdruck eine sachfremde Vorstellung des Entfernens aufzuzwingen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Folge „geboten … gebot … führte … aus“ erhält die Befehlskette und den Nachdruck auf Josuas Gehorsam; die Fußnote dokumentiert die wörtlichere, im Deutschen jedoch ungewohnte Formulierung.
