  text: וַ/יֹּ֨אמֶר יְהוָ֣ה אֶל יְהוֹשֻׁעַ֮ אַל תִּירָ֣א מִ/פְּנֵי/הֶם֒ כִּֽי מָחָ֞ר כָּ/עֵ֣ת הַ/זֹּ֗את אָנֹכִ֞י נֹתֵ֧ן אֶת כֻּלָּ֛/ם חֲלָלִ֖ים לִ/פְנֵ֣י יִשְׂרָאֵ֑ל אֶת סוּסֵי/הֶ֣ם תְּעַקֵּ֔ר וְ/אֶת מַרְכְּבֹתֵי/הֶ֖ם תִּשְׂרֹ֥ף בָּ/אֵֽשׁ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/006.yaml
  text: And Yahweh said to Joshua[a], “Do not fear them, for tomorrow at this time I am giving all of them over before Israel as slain men[b]. You shall hamstring their horses and burn their chariots with fire.”
translation:
  language: de
  text: 'Und Jahwe sagte zu Josua: „Fürchte dich nicht vor ihnen! Denn morgen um diese Zeit liefere ich sie alle als Erschlagene vor Israel aus.[a] Die Sehnen ihrer Pferde sollst du durchschneiden und ihre Streitwagen verbrennen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „gebe ich sie alle als Erschlagene vor Israel hin“; gemeint ist, dass Jahwe sie Israel zur Niederlage ausliefert.'
    reason: Die ungewöhnliche hebräische Konstruktion und die räumliche Wendung „vor Israel“ werden erläutert, während der Haupttext idiomatisches Deutsch verwendet.
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen in der im Deutschen geläufigen wissenschaftlichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אַל תִּירָא מִפְּנֵיהֶם
  choice: Fürchte dich nicht vor ihnen
  rationale: Natürliche und zugleich genaue deutsche Wiedergabe des Verbots mit der idiomatischen Verbindung von ירא und מִפְּנֵי.
- source_word: מָחָר כָּעֵת הַזֹּאת
  choice: morgen um diese Zeit
  rationale: Die Wendung bezeichnet denselben ungefähren Zeitpunkt am folgenden Tag; die deutsche Formulierung bewahrt die mögliche zeitliche Unschärfe.
- source_word: אָנֹכִי נֹתֵן
  choice: werde ich ... dahingeben
  rationale: Das Partizip bezeichnet hier im Rahmen der Verheißung ein unmittelbar bevorstehendes Handeln. Das betonte Subjekt wird durch „ich“ erhalten.
- source_word: אֶת כֻּלָּם חֲלָלִים לִפְנֵי יִשְׂרָאֵל
  choice: sie alle als Erschlagene vor Israel dahingeben
  rationale: „Erschlagene“ bewahrt den militärischen Sinn von חֲלָלִים; „vor Israel“ erhält die räumliche Bildsprache, während „dahingeben“ die Übergabe zum Unterliegen ausdrückt.
- source_word: אֶת סוּסֵיהֶם תְּעַקֵּר
  choice: Ihre Pferde sollst du lähmen
  rationale: Das Verb bezeichnet das Durchtrennen der Sehnen und damit das militärische Unbrauchbarmachen der Pferde. „Lähmen“ ist verständlich, ohne eine im Deutschen potenziell missverständliche anatomische Präzision vorzutäuschen.
- source_word: וְאֶת מַרְכְּבֹתֵיהֶם תִּשְׂרֹף בָּאֵשׁ
  choice: und ihre Streitwagen verbrennen
  rationale: „Streitwagen“ präzisiert den militärischen Kontext. Das im Deutschen redundante „mit Feuer“ wird idiomatisch im Verb „verbrennen“ ausgedrückt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Eigennamen ausdrücklich. „Jahwe“ bewahrt diesen Charakter, ohne ihn durch den Titel „der HERR“ zu ersetzen.
- issue: Art der angekündigten Übergabe der Feinde
  choice: als Erschlagene vor Israel dahingeben
  alternative: Israel wird sie alle erschlagen
  rationale: Die gewählte Fassung bewahrt die Spannung zwischen Jahwes Handeln und Israels anschließendem Kampf, statt die Aussage ausschließlich als direktes Handeln Israels auszulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Text bleibt nahe an der hebräischen Bildsprache, vermeidet jedoch unnötige deutsche Redundanz. Die direkte Rede ist klar und kraftvoll formuliert.
