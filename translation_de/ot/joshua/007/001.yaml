base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/001.yaml
  text: But the sons of Israel acted unfaithfully regarding the things devoted to destruction[a], for Achan son of Carmi, son of Zabdi, son of Zerah, of the tribe of Judah, took some of the things devoted to destruction; so the anger of Yahweh burned against the sons of Israel.
translation:
  language: de
  text: Doch die Israeliten brachen die Treue in Bezug auf das, was dem Bann verfallen war[a]. Denn Achan, der Sohn Karmis, des Sohnes Sabdis, des Sohnes Serachs, aus dem Stamm Juda, nahm etwas von dem, was dem Bann verfallen war. Da entbrannte der Zorn Jahwes gegen die Israeliten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Geweihte“. Das hebräische Wort חֵרֶם bezeichnet Menschen oder Dinge, die Gott geweiht und zur Vernichtung bestimmt oder dem gewöhnlichen menschlichen Gebrauch entzogen waren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְעֲלוּ ... מַעַל
  choice: handelten treulos
  rationale: Das Verb מעל mit dem gleichstämmigen Substantiv bezeichnet einen Vertrauens- oder Treuebruch. Die deutsche Wendung gibt diese bundesbezogene Bedeutung natürlich wieder, ohne den verstärkenden Ausdruck unverständlich wörtlich nachzubilden.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die geläufige deutsche Volksbezeichnung ist natürlich und bewahrt den korporativen Bezug, der anschließend mit Achans Einzeltat verbunden wird.
- source_word: בַּחֵרֶם / מִן הַחֵרֶם
  choice: was dem Bann verfallen war
  rationale: חֵרֶם bezeichnet hier Menschen oder Sachen, die Gott entzogenem gewöhnlichem Gebrauch vorbehalten und zur Vernichtung beziehungsweise vollständigen Aussonderung bestimmt sind. Die Formulierung erhält den technischen Begriff „Bann“, während die Fußnote ihn erklärt.
- source_word: וַיִּקַּח ... מִן
  choice: nahm etwas von
  rationale: „Etwas“ macht den partitiven Sinn der Präposition מִן im Deutschen idiomatisch deutlich, ohne eine Menge festzulegen.
- source_word: לְמַטֵּה יְהוּדָה
  choice: aus dem Stamm Juda
  rationale: מַטֶּה bezeichnet im genealogischen Zusammenhang den Stamm; „aus dem Stamm Juda“ ist klares, heutiges Standarddeutsch.
- source_word: וַיִּחַר אַף יְהוָה
  choice: Da entbrannte der Zorn Jahwes
  rationale: Die Wiedergabe bewahrt das anschauliche hebräische Bild vom brennenden Zorn und klingt zugleich würdig und natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben, statt ihn durch den Titel „HERR“ zu ersetzen.
theological_decisions:
- issue: Korporative Verantwortung Israels und individuelle Tat Achans
  choice: Der Plural „die Israeliten handelten treulos“ bleibt erhalten; danach wird Achan als konkreter Täter genannt.
  alternative: Die Schuld ausschließlich Achan zuschreiben oder den korporativen Satz zu „Israel sündigte“ verflachen.
  rationale: Der hebräische Text verbindet bewusst die Tat eines Einzelnen mit der Treulosigkeit und den Folgen für das ganze Volk. Diese Spannung wird nicht aufgelöst.
- issue: Bedeutungsumfang von חֵרֶם
  choice: Im Haupttext steht die traditionelle, knappe Wendung „dem Bann verfallen“, ergänzt durch eine erklärende Fußnote.
  alternative: „zur Vernichtung geweiht“ oder „Gott vorbehalten“ als alleinige, eindeutigere Wiedergabe.
  rationale: Der Begriff kann sowohl Vernichtung als auch unwiderrufliche Aussonderung aus gewöhnlichem menschlichem Gebrauch umfassen. Die Übersetzung vermeidet es, diesen Bedeutungsumfang vorschnell auf nur einen Aspekt zu beschränken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Israeliten“ ist natürlicher als „Söhne Israels“; „dem Bann verfallen“ erhält den biblischen Fachbegriff, dessen Bedeutungsumfang in der Fußnote erläutert wird. Die Genealogie bleibt vollständig erhalten.
