base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/003.yaml
  text: They returned to Joshua and said to him[a], “Do not have all the people go up. Let about two thousand men, or about three thousand men, go up and strike Ai. Do not weary all the people there[b], for they are few.”
translation:
  language: de
  text: 'Sie kehrten zu Josua zurück und sagten zu ihm: „Nicht das ganze Volk soll hinaufziehen. Etwa zweitausend oder etwa dreitausend Mann sollen hinaufziehen und Ai angreifen. Lass nicht das ganze Volk sich dort abmühen[a], denn sie sind nur wenige.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Belaste nicht das ganze Volk damit.“ Das hebräische Verb kann sowohl das Ermüden als auch das Belasten durch unnötige Anstrengung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ אֶל יְהוֹשֻׁעַ
  choice: Sie kehrten zu Josua zurück
  rationale: Das Qal-Wayyiqtol von שׁוב bezeichnet im Erzählzusammenhang die Rückkehr der Kundschafter zu Josua.
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: und sagten zu ihm
  rationale: Formale und zugleich natürliche Wiedergabe der gewöhnlichen Redeeinleitung mit אמר und indirektem Objekt.
- source_word: אַל יַעַל כָּל הָעָם
  choice: Nicht das ganze Volk soll hinaufziehen
  rationale: אַל mit Jussiv drückt hier eine eindringliche Empfehlung beziehungsweise ein Verbot aus. „Hinaufziehen“ wahrt sowohl die räumliche als auch die militärische Färbung von עלה; „Volk“ gibt הָעָם ohne unnötige Verengung auf das Heer wieder.
- source_word: כְּאַלְפַּיִם אִישׁ אוֹ כִּשְׁלֹשֶׁת אֲלָפִים אִישׁ
  choice: Etwa zweitausend oder etwa dreitausend Mann
  rationale: Das Präfix כ bezeichnet jeweils eine ungefähre Zahl. „Mann“ entspricht אִישׁ und passt zur hier gemeinten Kampfmannschaft.
- source_word: יַעֲלוּ וְיַכּוּ אֶת הָעָי
  choice: sollen hinaufziehen und Ai angreifen
  rationale: Die Wiederholung von „hinaufziehen“ bildet עלה ab. נכה bedeutet wörtlich „schlagen“; im militärischen Zusammenhang ist „angreifen“ im modernen Deutschen natürlicher und lässt den Ausgang offen, anders als „besiegen“.
- source_word: אַל תְּיַגַּע שָׁמָּה אֶת כָּל הָעָם
  choice: Bemühe nicht das ganze Volk dorthin
  rationale: Das Piel von יגע kann bedeuten, jemanden durch Anstrengung zu ermüden oder ihm Mühe zu bereiten. „Bemühe nicht“ bewahrt diese Spannweite, während „dorthin“ die Zielrichtung von שָׁמָּה natürlich wiedergibt.
- source_word: כִּי מְעַט הֵמָּה
  choice: denn sie sind nur wenige
  rationale: Die Wendung bezieht sich kontextuell auf die Bewohner beziehungsweise Verteidiger von Ai. „Nur“ macht die begründende Einschätzung im Deutschen idiomatisch deutlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Volk“ hält am breiten hebräischen Ausdruck fest, obwohl im Zusammenhang besonders die kampffähigen Männer gemeint sind. Die militärische Bewegung wird mit „hinaufziehen“ beibehalten; das etwas ungebräuchliche „schlagen“ wurde kontextgerecht als „angreifen“ wiedergegeben.
