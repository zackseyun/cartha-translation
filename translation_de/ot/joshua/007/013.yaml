source:
  edition: WLC
  text: קֻ֚ם קַדֵּ֣שׁ אֶת הָ/עָ֔ם וְ/אָמַרְתָּ֖ הִתְקַדְּשׁ֣וּ לְ/מָחָ֑ר כִּ֣י כֹה֩ אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל חֵ֤רֶם בְּ/קִרְבְּ/ךָ֙ יִשְׂרָאֵ֔ל לֹ֣א תוּכַ֗ל לָ/קוּם֙ לִ/פְנֵ֣י אֹיְבֶ֔י/ךָ עַד הֲסִירְ/כֶ֥ם הַ/חֵ֖רֶם מִֽ/קִּרְבְּ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/013.yaml
  text: 'Get up[a], consecrate the people, and say, ‘Consecrate yourselves for tomorrow, for thus says Yahweh, the God of Israel: There is something devoted to destruction in your midst, Israel. You cannot stand before your enemies until you remove the thing devoted to destruction from your midst.’'
translation:
  language: de
  text: 'Steh auf, weihe das Volk und sage: »Weiht euch für morgen; denn so spricht Jahwe, der Gott Israels: In deiner Mitte, Israel, ist etwas, das der Vernichtung geweiht ist.[a] Du kannst deinen Feinden nicht standhalten, bis ihr das der Vernichtung Geweihte aus eurer Mitte entfernt habt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort חֵרֶם (cherem) wird traditionell mit »Bann« oder »das Gebannte« wiedergegeben. Es bezeichnet etwas, das unwiderruflich geweiht oder bestimmt ist, hier zur Vernichtung.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֻם
  choice: Steh auf
  rationale: Der Imperativ fordert Josua zu sofortigem Handeln auf; die Wendung ist im modernen Deutschen natürlich und nachdrücklich.
- source_word: קַדֵּשׁ / הִתְקַדְּשׁוּ
  choice: heilige / Heiligt euch
  rationale: Die Wiedergabe bewahrt die lexikalische Verbindung zwischen Piel und reflexivem Hitpael sowie den Gedanken ritueller Vorbereitung.
- source_word: לְמָחָר
  choice: für morgen
  rationale: Die Präposition bezeichnet die Vorbereitung im Hinblick auf den folgenden Tag.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die gebräuchliche deutsche Umschrift gibt den im Hebräischen stehenden Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: חֵרֶם
  choice: etwas, das der Vernichtung geweiht ist / das der Vernichtung Geweihte
  rationale: Der Ausdruck bezeichnet hier etwas, das unwiderruflich bestimmt und im Kontext der Vernichtung übergeben ist. Die Formulierung macht dies verständlich, ohne den Begriff lediglich als abstrakten Fluch wiederzugeben.
- source_word: בְּקִרְבְּךָ יִשְׂרָאֵל
  choice: Mitten unter dir, Israel
  rationale: Die singularische Anrede personifiziert Israel als Gesamtheit und bewahrt zugleich die direkte Anrede.
- source_word: לֹא תוּכַל לָקוּם לִפְנֵי אֹיְבֶיךָ
  choice: Du kannst deinen Feinden nicht standhalten
  rationale: Die idiomatische deutsche Wendung gibt das Unvermögen wieder, vor den Feinden zu bestehen.
- source_word: עַד הֲסִירְכֶם
  choice: bis ihr ... entfernt habt
  rationale: Der Wechsel zum Plural im hebräischen Suffix wird bewahrt; Israel wird zunächst kollektiv im Singular und hier als Vielheit angesprochen.
theological_decisions:
- issue: Bedeutung von חֵרֶם im Kontext von Gericht und Bann
  choice: etwas, das der Vernichtung geweiht ist / das der Vernichtung Geweihte
  alternative: Bann; Gebanntes; dem Bann Geweihtes
  rationale: Die gewählte Fassung wahrt sowohl die unwiderrufliche Weihung beziehungsweise Bestimmung als auch die in diesem Zusammenhang vorgesehene Vernichtung. Sie vermeidet, חֵרֶם auf bloße Verfluchung zu verengen.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Jahwe macht den Eigennamen des Ausgangstextes transparent und ist die im Deutschen etablierte wissenschaftsnahe Umschrift.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Wiederholung des Wortfeldes »heiligen« und der Wechsel von der kollektiven singularischen Anrede Israels zum Plural wurden bewusst erhalten.
