source:
  edition: WLC
  text: וְ/לֹ֨א יֻכְל֜וּ בְּנֵ֣י יִשְׂרָאֵ֗ל לָ/קוּם֙ לִ/פְנֵ֣י אֹיְבֵי/הֶ֔ם עֹ֗רֶף יִפְנוּ֙ לִ/פְנֵ֣י אֹֽיְבֵי/הֶ֔ם כִּ֥י הָי֖וּ לְ/חֵ֑רֶם לֹ֤א אוֹסִיף֙ לִֽ/הְי֣וֹת עִמָּ/כֶ֔ם אִם לֹ֥א תַשְׁמִ֛ידוּ הַ/חֵ֖רֶם מִֽ/קִּרְבְּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/012.yaml
  text: Therefore the sons of Israel cannot stand before their enemies; they turn their backs before their enemies[a], because they have become devoted to destruction. I will no longer be with you unless you destroy the devoted thing from your midst.
translation:
  language: de
  text: Darum können die Israeliten ihren Feinden nicht standhalten. Sie kehren ihren Feinden den Rücken, denn sie sind selbst dem Bann verfallen.[a] Ich werde nicht länger mit euch sein, wenn ihr nicht das Gebannte aus eurer Mitte vernichtet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort חֵרֶם (cherem) bezeichnet etwas, das Gott unwiderruflich übereignet und unter Bann gestellt ist; in diesem Zusammenhang ist es zur Vernichtung bestimmt.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die natürliche deutsche Kollektivbezeichnung gibt den Sinn der hebräischen Wendung „Söhne Israels“ wieder, ohne im modernen Deutsch ausschließlich männliche Personen nahezulegen.
- source_word: לָקוּם לִפְנֵי אֹיְבֵיהֶם
  choice: ihren Feinden standhalten
  rationale: Die hebräische Wendung bezeichnet hier das Bestehen gegenüber den Gegnern; „standhalten“ gibt die militärische Bedeutung idiomatisch und präzise wieder.
- source_word: עֹרֶף יִפְנוּ
  choice: sie kehren ihren Feinden den Rücken
  rationale: Bewahrt das hebräische Bild vom Zuwenden des Nackens beziehungsweise Rückens und lässt zugleich die Niederlage oder Flucht erkennen.
- source_word: הָיוּ לְחֵרֶם
  choice: sie sind selbst dem Bann verfallen
  rationale: חֵרֶם bezeichnet etwas, das unwiderruflich Gott übereignet und in diesem Zusammenhang der Vernichtung bestimmt ist. Die Formulierung drückt aus, dass Israel infolge des Vergehens selbst in diesen Bannzustand geraten ist.
- source_word: לֹא אוֹסִיף לִהְיוֹת עִמָּכֶם
  choice: Ich werde nicht länger mit euch sein
  rationale: אוֹסִיף mit Infinitiv bezeichnet hier das Fortsetzen; „nicht länger“ gibt die angedrohte Beendigung der göttlichen Gegenwart klar wieder.
- source_word: אִם לֹא
  choice: wenn ihr nicht
  rationale: Die negative Bedingung wird im Deutschen hier natürlicher mit „wenn ... nicht“ als mit „es sei denn“ formuliert.
- source_word: תַשְׁמִידוּ הַחֵרֶם
  choice: das Gebannte ... vernichtet
  rationale: Das Hifil von שׁמד verlangt eine entschiedene Vernichtung; הַחֵרֶם bezeichnet konkret das dem Bann Unterliegende im Lager.
- source_word: מִקִּרְבְּכֶם
  choice: aus eurer Mitte
  rationale: Die geläufige biblische Wendung bewahrt den gemeinschaftlichen Bezug des hebräischen Ausdrucks.
theological_decisions:
- issue: Die abstrakte und konkrete Verwendung von חֵרֶם im selben Vers
  choice: „dem Bann verfallen“ für לְחֵרֶם und „das Gebannte“ für הַחֵרֶם
  alternative: „der Vernichtung geweiht“ / „das der Vernichtung Geweihte“ oder „verflucht“ / „das Verfluchte“
  rationale: Die gewählte Wortfamilie wahrt den Zusammenhang beider Vorkommen und lässt den kultisch-rechtlichen Begriff des Bannens erkennen. Sie vermeidet, חֵרֶם auf einen bloßen Fluch zu reduzieren; die Fußnote erklärt, dass der Bann hier die Bestimmung zur Vernichtung einschließt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Israeliten“ ist gegenüber dem wörtlichen „Söhne Israels“ natürlicher und inklusiver. „Dem Bann verfallen“ und „das Gebannte“ erhalten die bewusste Wiederholung des hebräischen Schlüsselbegriffs; die Fußnote erläutert dessen schwer in einem einzigen deutschen Ausdruck wiederzugebende Bedeutungsbreite.
