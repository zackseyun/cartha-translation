  text: ו/אראה בַ/שָּׁלָ֡ל אַדֶּ֣רֶת שִׁנְעָר֩ אַחַ֨ת טוֹבָ֜ה וּ/מָאתַ֧יִם שְׁקָלִ֣ים כֶּ֗סֶף וּ/לְשׁ֨וֹן זָהָ֤ב אֶחָד֙ חֲמִשִּׁ֤ים שְׁקָלִים֙ מִשְׁקָל֔/וֹ וָֽ/אֶחְמְדֵ֖/ם וָֽ/אֶקָּחֵ֑/ם וְ/הִנָּ֨/ם טְמוּנִ֥ים בָּ/אָ֛רֶץ בְּ/ת֥וֹךְ הָ/אָֽהֳלִ֖/י וְ/הַ/כֶּ֥סֶף תַּחְתֶּֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/021.yaml
  text: I saw among the spoil one beautiful cloak from Shinar[a], two hundred shekels of silver, and one bar of gold weighing fifty shekels. I coveted them and took them, and look, they are hidden in the ground inside my tent[c][b], with the silver underneath it.
translation:
  language: de
  text: Ich sah unter der Beute einen schönen Mantel aus Schinar[a], zweihundert Schekel Silber und ein Stück Gold[b], das fünfzig Schekel wog. Ich begehrte sie und nahm sie. Sieh, sie sind in der Erde in meinem Zelt verborgen, und das Silber liegt darunter[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein kostbares Obergewand aus Schinar“. Das hebräische Wort kann einen prächtigen Mantel oder ein vornehmes Obergewand bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „eine Zunge Gold“, wahrscheinlich ein zungenförmiges Stück Gold; traditionell auch mit „Goldbarren“ oder „Goldkeil“ wiedergegeben.'
    reason: lexical_alternative
  - marker: c
    text: 'Das hebräische Pronomen ist weiblich und steht in der Einzahl. Es bezieht sich wahrscheinlich auf den Mantel: Das Silber lag unter ihm.'
    reason: referent_ambiguity
lexical_decisions:
- source_word: בַשָּׁלָל
  choice: unter der Beute
  rationale: Die Wendung bezeichnet das Kriegsgut, unter dem Achan die Gegenstände sah; „unter der Beute“ ist im Deutschen natürlich und präzise.
- source_word: אַדֶּרֶת שִׁנְעָר אַחַת טוֹבָה
  choice: einen schönen Mantel aus Schinar
  rationale: אַדֶּרֶת bezeichnet hier ein prächtiges Obergewand oder einen Mantel; „aus Schinar“ gibt die Herkunft verständlich wieder.
- source_word: וּמָאתַיִם שְׁקָלִים כֶּסֶף
  choice: zweihundert Schekel Silber
  rationale: Die antike Gewichtseinheit bleibt erhalten, statt unsicher in ein modernes Gewicht umgerechnet zu werden.
- source_word: וּלְשׁוֹן זָהָב אֶחָד
  choice: ein Stück Gold
  rationale: Wörtlich steht „eine Zunge Gold“. Gemeint ist offenbar ein entsprechend geformtes Stück; „Stück Gold“ vermeidet eine unbelegte genauere Formbestimmung, während die Bildsprache in der Fußnote bewahrt wird.
- source_word: חֲמִשִּׁים שְׁקָלִים מִשְׁקָלוֹ
  choice: das fünfzig Schekel wog
  rationale: Die Relativkonstruktion gibt die ausdrückliche Gewichtsangabe in natürlichem Deutsch wieder.
- source_word: וָאֶחְמְדֵם
  choice: Ich begehrte sie
  rationale: חמד bezeichnet ein starkes, hier schuldhaftes Verlangen und bewahrt so die moralische Tragweite des Bekenntnisses.
- source_word: וָאֶקָּחֵם
  choice: und nahm sie an mich
  rationale: Die Formulierung gibt das tatsächliche, unrechtmäßige Nehmen idiomatisch wieder, ohne das Verb unnötig zu verstärken.
- source_word: וְהִנָּם
  choice: Sieh, sie sind
  rationale: Die deiktische Partikel lenkt unmittelbar auf die verborgenen Gegenstände; „Sieh“ erhält diesen erzählerischen Nachdruck.
- source_word: טְמוּנִים בָּאָרֶץ
  choice: in der Erde … verborgen
  rationale: טמן bezeichnet das Verbergen; אֶרֶץ meint im Zeltkontext den Erdboden.
- source_word: בְּתוֹךְ הָאֳהֳלִי
  choice: mitten in meinem Zelt
  rationale: Die Wiedergabe folgt der räumlichen Aussage von בְּתוֹךְ und bleibt natürlich verständlich.
- source_word: וְהַכֶּסֶף תַּחְתֶּיהָ
  choice: und das Silber liegt darunter
  rationale: Das feminine Singularsuffix verweist wahrscheinlich auf den Mantel. „Darunter“ bewahrt im Haupttext jedoch die grammatische Knappheit und vermeidet eine überdeutliche Auflösung.
