source:
  edition: WLC
  text: וַ/יַּעֲל֤וּ מִן הָ/עָם֙ שָׁ֔מָּ/ה כִּ/שְׁלֹ֥שֶׁת אֲלָפִ֖ים אִ֑ישׁ וַ/יָּנֻ֕סוּ לִ/פְנֵ֖י אַנְשֵׁ֥י הָ/עָֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/004.yaml
  text: So about three thousand men from the people went up there, but they fled before the men of Ai.
translation:
  language: de
  text: So zogen etwa dreitausend Mann aus dem Volk dorthin hinauf; doch sie flohen vor den Männern von Ai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: zogen … hinauf
  rationale: עלה bezeichnet ein Hinaufgehen bzw. Hinaufziehen. Im militärischen Erzählzusammenhang ist „hinaufziehen“ natürlich, ohne den Kampf bereits in das Verb hineinzulegen.
- source_word: מִן הָעָם
  choice: aus dem Volk
  rationale: עם bedeutet wörtlich „Volk“; gemeint ist hier eine aus Israel ausgewählte Gruppe. Die Wiedergabe bleibt nah am Hebräischen.
- source_word: שָׁמָּה
  choice: dorthin
  rationale: Das Richtungsadverb verweist auf das zuvor genannte Ziel Ai. „Dorthin“ gibt diese Bewegung präzise und idiomatisch wieder.
- source_word: כִּשְׁלֹשֶׁת אֲלָפִים אִישׁ
  choice: etwa dreitausend Mann
  rationale: כִּ vor der Zahl drückt eine ungefähre Angabe aus. „Mann“ ist nach Zahlwörtern im Deutschen die natürliche Zählform und vermeidet die stärkere Festlegung auf „Soldaten“.
- source_word: וַיָּנֻסוּ
  choice: sie flohen
  rationale: נוס bedeutet „fliehen“. Die Formulierung ist präzise und entspricht dem würdevollen Erzählregister.
- source_word: לִפְנֵי
  choice: vor
  rationale: In Verbindung mit „fliehen“ bezeichnet לִפְנֵי das Zurückweichen vor einem Gegner. „Vor“ ist im Deutschen knapp und idiomatisch.
- source_word: אַנְשֵׁי הָעָי
  choice: den Männern von Ai
  rationale: אַנְשֵׁי ist der Konstruktplural von אִישׁ und bezeichnet hier die Männer beziehungsweise Verteidiger der Stadt. „Männer von Ai“ wahrt die lexikalische Form, ohne ausdrücklich „Soldaten“ einzutragen.
theological_decisions: []
translation_notes:
  register: Moderne, klare und zugleich würdige deutsche Erzählsprache. Die Satzverbindung mit „doch“ macht den im hebräischen Handlungsablauf liegenden Kontrast natürlich sichtbar. Keine Fußnoten erforderlich.
