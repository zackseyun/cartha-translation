source:
  edition: WLC
  text: בִּ֖י אֲדֹנָ֑/י מָ֣ה אֹמַ֔ר אַ֠חֲרֵי אֲשֶׁ֨ר הָפַ֧ךְ יִשְׂרָאֵ֛ל עֹ֖רֶף לִ/פְנֵ֥י אֹיְבָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/008.yaml
  text: Please[a], Lord[b], what can I say after Israel has turned its back before its enemies?
translation:
  language: de
  text: Ach[a], Herr, was soll ich sagen, nachdem Israel seinen Feinden den Rücken zugewandt hat[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bitte“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Israel hat vor seinen Feinden den Nacken gewandt“; eine hebräische Wendung für Flucht oder Rückzug nach einer Niederlage.'
    reason: cultural_note
lexical_decisions:
- source_word: בִּי
  choice: Ach
  rationale: Die Anredepartikel leitet hier eine dringliche, ehrerbietige Bitte beziehungsweise Klage gegenüber Gott ein. „Ach“ gibt Josuas emotionale Not in natürlichem, würdigem Deutsch wieder; „Bitte“ ist ebenfalls möglich.
- source_word: אֲדֹנָי
  choice: Herr
  rationale: Das Wort dient hier in direkter Anrede als ehrfurchtsvoller Gottestitel. „Herr“ ist dafür die übliche deutsche Wiedergabe, ohne den in diesem Vers nicht stehenden Gottesnamen einzutragen.
- source_word: מָה אֹמַר
  choice: was soll ich sagen
  rationale: Die Frage entspricht eng dem hebräischen Wortlaut und drückt zugleich Josuas Ratlosigkeit aus.
- source_word: אַחֲרֵי אֲשֶׁר
  choice: nachdem
  rationale: Die Verbindung führt den bereits eingetretenen Umstand ein, der Josuas Frage auslöst.
- source_word: הָפַךְ ... עֹרֶף
  choice: den Rücken gekehrt hat
  rationale: Die hebräische Wendung bezeichnet im militärischen Zusammenhang die Flucht beziehungsweise den Rückzug vor dem Feind. Die deutsche Redewendung bewahrt das Körperbild und ist natürlich verständlich.
- source_word: לִפְנֵי
  choice: vor
  rationale: Im Kampfzusammenhang bezeichnet die Präposition Israels Verhältnis zu seinen Feinden und lässt sich knapp mit „vor“ wiedergeben.
- source_word: אֹיְבָיו
  choice: seinen Feinden
  rationale: Das maskuline Singularsuffix bezieht sich auf das kollektiv und als männlicher Eigenname aufgefasste Israel. Im Deutschen ist daher „seinen“ grammatisch und sachlich passend.
theological_decisions:
- issue: Wiedergabe des Gottestitels אֲדֹנָי
  choice: Herr
  alternative: mein Herr
  rationale: אֲדֹנָי ist hier der ehrerbietige Gottestitel in direkter Anrede. „Herr“ entspricht dem etablierten deutschen Sprachgebrauch und trägt weder eine unnötige Besitzbetonung noch den nicht vorhandenen Gottesnamen ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Ach“ bewahrt den klagenden Gebetston; „den Rücken kehren“ gibt das hebräische Bild idiomatisch wieder. Die Satzstellung bleibt klar und nah am hebräischen Gedankengang.
