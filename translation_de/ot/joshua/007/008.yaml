    issue: Die Haupttextformulierung „vor seinen Feinden den Rücken gekehrt hat“ ist syntaktisch und idiomatisch weniger klar.
    rationale: Die feste deutsche Verbindung lautet eher „jemandem den Rücken zuwenden/kehren“. Die Revision erhält das hebräische Körperbild und macht zugleich den Rückzug vor den Feinden verständlich.
  - severity: low
    issue: Die Fußnote verwendet „seinen Nacken ... umgewandt“.
    rationale: „Umgewandt“ ist hier kein natürliches modernes Deutsch. „Den Nacken/Rücken gewandt“ gibt die wörtliche Bildsprache präziser wieder.
