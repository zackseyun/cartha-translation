  text: וַ/יֹּ֧אמֶר יְהוָ֛ה אֶל יְהוֹשֻׁ֖עַ קֻ֣ם לָ֑/ךְ לָ֣/מָּה זֶּ֔ה אַתָּ֖ה נֹפֵ֥ל עַל פָּנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/010.yaml
  text: Yahweh said to Joshua[a], “Get up[b]. Why are you falling on your face?”
translation:
  language: de
  text: 'Da sagte Jahwe zu Josua: »Steh auf! Warum liegst du denn mit dem Gesicht zur Erde?«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Hebräische hat wörtlich etwa: »Warum dies: du liegst mit deinem Gesicht zur Erde?« Das demonstrative זֶּה verleiht der Frage Nachdruck; „denn“ gibt dies hier idiomatisch wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben, nicht durch den Titel »der HERR« ersetzt; »Jahwe« ist die im Deutschen übliche Form.
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Die narrative Wayyiqtol-Form führt die nächste Handlung ein; »Da sagte« ist im deutschen Erzählstil natürlich.
- source_word: יְהוֹשֻׁעַ
  choice: Josua
  rationale: Verwendet die etablierte deutsche Form des Personennamens.
- source_word: קֻם לָךְ
  choice: Steh auf!
  rationale: Der Imperativ fordert Josua auf, seine liegende Gebetshaltung zu beenden. Das ethische Dativpronomen לָךְ wird im Deutschen nicht eigens ausgedrückt.
- source_word: לָמָּה זֶּה
  choice: Warum ... hier
  rationale: »Warum« gibt die Frage idiomatisch wieder; »hier« nimmt die durch זֶּה bewirkte Hervorhebung auf, ohne die unnatürliche Wortfolge »Warum ist dies, dass ...« nachzubilden.
- source_word: אַתָּה נֹפֵל
  choice: liegst du
  rationale: Der Partizip beschreibt im Zusammenhang nicht den Vorgang des Hinfallens, sondern Josuas gegenwärtige, fortdauernde Haltung. Das deutsche »liegen« gibt diesen Zustand natürlich wieder.
- source_word: עַל פָּנֶיךָ
  choice: auf deinem Gesicht
  rationale: Die direkte Wiedergabe bewahrt das konkrete Bild der Niederwerfung; »mit dem Gesicht zur Erde« wäre idiomatischer, aber weniger formal entsprechend.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen; die Übersetzung bewahrt ihn als solchen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von Josuas Haltung
  choice: konkrete Beschreibung ohne ausdrückliche Deutung
  alternative: »Warum wirfst du dich nieder?«
  rationale: Der Vers beschreibt Josuas Lage auf dem Gesicht, benennt aber hier nicht ausdrücklich, ob sie als Gebet, Trauer oder Niederwerfung zu deuten ist.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der direkte Befehl ist knapp gehalten; die konkrete Körperhaltung bleibt sichtbar. Der Fußnotenmarker steht nach dem vollständigen Zitat, da er die Formulierung der gesamten Frage erläutert.
