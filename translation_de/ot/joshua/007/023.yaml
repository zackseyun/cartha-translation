  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּקָּחוּ/ם֙ מִ/תּ֣וֹךְ הָ/אֹ֔הֶל וַ/יְבִאוּ/ם֙ אֶל יְהוֹשֻׁ֔עַ וְ/אֶ֖ל כָּל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יַּצִּקֻ֖/ם לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/023.yaml
  text: They took them from inside the tent and brought them to Joshua and to all the sons of Israel[c][b][a], and they laid them out before Yahweh.
translation:
  language: de
  text: Sie nahmen sie aus dem Inneren des Zeltes und brachten sie zu Josua und zu allen Israeliten[a]. Dann breiteten sie sie vor Jahwe aus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zu allen Söhnen Israels“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Dann schütteten sie sie vor Jahwe aus.“ Das hebräische Verb bedeutet häufig „ausgießen“; hier sind wahrscheinlich die sichergestellten Gegenstände gemeint, die vor Jahwe hingelegt oder ausgebreitet wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּחוּם
  choice: Sie nahmen sie
  rationale: לקח bedeutet hier schlicht „nehmen“. Das angehängte Pronomen verweist auf die zuvor gefundenen Gegenstände; die knappe Wiedergabe bewahrt diesen Rückverweis.
- source_word: מִתּוֹךְ הָאֹהֶל
  choice: aus dem Inneren des Zeltes
  rationale: מִתּוֹךְ bezeichnet ausdrücklich den Innenraum beziehungsweise die Mitte; „aus dem Inneren“ erhält diese räumliche Nuance.
- source_word: וַיְבִאוּם
  choice: brachten sie
  rationale: Der Hifil von בוא bedeutet gewöhnlich „bringen“. Eine zeremonielle Bedeutung wie „präsentieren“ ist nicht zwingend.
- source_word: אֶל יְהוֹשֻׁעַ וְאֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: zu Josua und zu allen Israeliten
  rationale: Das wiederholte אֶל wird durch das wiederholte „zu“ abgebildet. „Israeliten“ gibt die feste Volksbezeichnung בְּנֵי יִשְׂרָאֵל im heutigen Deutsch natürlich wieder.
- source_word: וַיַּצִּקֻם
  choice: Dann breiteten sie sie … aus
  rationale: יצק bedeutet häufig „ausgießen“; bei den hier gemeinten Fundstücken bezeichnet es wahrscheinlich, dass man sie sichtbar hinlegte oder ausbreitete. „Ausbreiten“ ist in diesem Sachzusammenhang natürlich, ohne die Handlung stärker als nötig zu zeremoniell zu deuten.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי bedeutet „vor“ beziehungsweise „in der Gegenwart von“. Die kurze Form bewahrt sowohl den räumlichen als auch den repräsentativen Sinn.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im Deutschen geläufige Umschrift.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst und nicht den Titel אֲדֹנָי. „Jahwe“ bewahrt diese Unterscheidung, während „der HERR“ die traditionelle Ersatzlesung darstellt.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: Israeliten
  alternative: Söhne Israels
  rationale: Die Wendung ist hier eine feste Bezeichnung für das Volk. „Israeliten“ ist im modernen Deutsch eindeutig und schließt die Volksgemeinschaft ein; die wörtliche Form bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „sie“ folgt den pronominalen Rückverweisen des Hebräischen; „Dann“ gliedert die aufeinanderfolgenden Erzählhandlungen natürlich. Der Gottesname erscheint in der im Deutschen üblichen Form „Jahwe“.
