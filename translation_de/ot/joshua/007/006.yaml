  text: וַ/יִּקְרַ֨ע יְהוֹשֻׁ֜עַ שִׂמְלֹתָ֗י/ו וַ/יִּפֹּל֩ עַל פָּנָ֨י/ו אַ֜רְצָ/ה לִ/פְנֵ֨י אֲר֤וֹן יְהוָה֙ עַד הָ/עֶ֔רֶב ה֖וּא וְ/זִקְנֵ֣י יִשְׂרָאֵ֑ל וַ/יַּעֲל֥וּ עָפָ֖ר עַל רֹאשָֽׁ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/006.yaml
  text: Then Joshua tore his clothes and fell facedown to the ground before the ark of Yahweh until evening[a], he and the elders of Israel[b], and they put dust on their heads.
translation:
  language: de
  text: Da zerriss Josua seine Kleider und fiel vor der Lade Jahwes mit dem Gesicht zur Erde nieder. So blieb er zusammen mit den Ältesten Israels bis zum Abend liegen[a], und sie streuten Staub auf ihre Köpfe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich ist die Satzfolge knapp: „bis zum Abend, er und die Ältesten Israels“. Sie bringt zum Ausdruck, dass Josua und die Ältesten gemeinsam bis zum Abend vor der Lade blieben.'
    reason: syntax_note
  - marker: b
    text: Staub auf den Kopf zu streuen war ein übliches Zeichen von Trauer, Demütigung oder tiefer Bestürzung.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְרַע ... שִׂמְלֹתָיו
  choice: zerriss ... seine Kleider
  rationale: Das Zerreißen der Kleidung ist hier eine konkrete Trauer- und Erschütterungsgeste. „Kleider“ ist im heutigen Deutsch natürlich und entspricht dem breiten Bedeutungsumfang von שִׂמְלָה.
- source_word: וַיִּפֹּל עַל־פָּנָיו אַרְצָה
  choice: fiel ... mit dem Gesicht zur Erde nieder
  rationale: Die hebräische Wendung bezeichnet eine vollständige Niederwerfung. Die Formulierung bewahrt die körperliche Bildhaftigkeit und klingt zugleich natürlich.
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  choice: vor der Lade Jahwes
  rationale: לִפְנֵי bedeutet hier „vor“ beziehungsweise „in der Gegenwart von“; אֲרוֹן bezeichnet in diesem Zusammenhang die heilige Lade. Der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: עַד הָעֶרֶב
  choice: bis zum Abend
  rationale: Die einfache Zeitangabe wird direkt und idiomatisch wiedergegeben.
- source_word: הוּא וְזִקְנֵי יִשְׂרָאֵל
  choice: er zusammen mit den Ältesten Israels
  rationale: Die nachgestellte hebräische Wortgruppe bezieht die Ältesten in die anhaltende Niederwerfung ein. „Zusammen mit“ macht diese Zugehörigkeit im Deutschen klar, ohne die Aussage weiter auszudeuten.
- source_word: וַיַּעֲלוּ עָפָר עַל־רֹאשָׁם
  choice: sie streuten Staub auf ihre Köpfe
  rationale: Die wörtlich kausative Verbform beschreibt das Aufbringen von Staub auf den Kopf. „Streuten“ gibt die konkrete Handlung im Deutschen verständlich wieder; ihre kulturelle Bedeutung wird in der Fußnote erläutert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen יהוה. „Jahwe“ bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Wiederaufnahme mit „So blieb er … liegen“ löst die gedrängte hebräische Satzfügung natürlich auf, ohne die Dauer oder die gemeinsame Handlung von Josua und den Ältesten zu verändern.
