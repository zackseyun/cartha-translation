source:
  edition: WLC
  text: וַ/יַּ֧עַן עָכָ֛ן אֶת יְהוֹשֻׁ֖עַ וַ/יֹּאמַ֑ר אָמְנָ֗ה אָנֹכִ֤י חָטָ֨אתִי֙ לַֽ/יהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל וְ/כָ/זֹ֥את וְ/כָ/זֹ֖את עָשִֽׂיתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/020.yaml
  text: Achan answered Joshua and said[a], “Truly, I have sinned against Yahweh, the God of Israel, and this is what I did:”
translation:
  language: de
  text: 'Achan antwortete Josua: »Es ist wahr: Ich habe gegen Jahwe, den Gott Israels, gesündigt. Und Folgendes habe ich getan:[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher etwa: „Und so und so habe ich getan.“ Die hebräische Wendung kündigt die Einzelheiten dessen an, was Achan getan hat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: 'antwortete ...:'
  rationale: Die hebräische Doppelformel bedeutet wörtlich „antwortete … und sagte“. Im heutigen Deutsch führt „antwortete …:“ die direkte Rede natürlich ein, ohne den Sinn zu verkürzen.
- source_word: אָמְנָה
  choice: Es ist wahr
  rationale: Die bekräftigende Partikel leitet Achans feierliches Eingeständnis ein. „Es ist wahr“ ist klar und gegenwärtig, ohne das altertümlich klingende „Wahrlich“.
- source_word: אָנֹכִי חָטָאתִי
  choice: Ich habe ... gesündigt
  rationale: Das selbstständige Pronomen hebt den Sprecher hervor; die ausdrückliche Wiedergabe mit „Ich“ bewahrt das persönliche Schuldeingeständnis. Das Perfekt entspricht im Deutschen einer abgeschlossenen Tat mit gegenwärtiger Bedeutung.
- source_word: לַיהוָה
  choice: gegen Jahwe
  rationale: Bei חטא bezeichnet ל denjenigen, gegen den sich die Sünde richtet. „Jahwe“ gibt den Gottesnamen יהוה als Eigennamen wieder.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: den Gott Israels
  rationale: Die Konstruktverbindung wird direkt und idiomatisch wiedergegeben.
- source_word: וְכָזֹאת וְכָזֹאת עָשִׂיתִי
  choice: Und Folgendes habe ich getan
  rationale: Die formelhafte hebräische Wendung kündigt die unmittelbar anschließenden Einzelheiten an. „Folgendes“ gibt diese Funktion im modernen Deutsch natürlicher wieder als eine wörtliche Doppelung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm יהוה. „Jahwe“ bewahrt den offenbarten Eigennamen und ist die übliche deutsche Form.
- issue: Art von Achans Aussage
  choice: persönliches Schuldeingeständnis ohne zusätzliche Deutung
  alternative: eine ausdrücklich als Reue oder Buße bezeichnete Aussage
  rationale: Der Vers sagt, dass Achan seine Sünde eingesteht; er bewertet jedoch nicht ausdrücklich die innere Qualität seiner Reue. Die Übersetzung lässt diese theologische Spannung bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt feierlich, aber vermeidet Archaismen. Der Doppelpunkt am Versende zeigt an, dass die Einzelheiten im folgenden Vers genannt werden.
