  text: וַ/יַּשְׁכֵּ֤ם יְהוֹשֻׁ֨עַ֙ בַּ/בֹּ֔קֶר וַ/יַּקְרֵ֥ב אֶת יִשְׂרָאֵ֖ל לִ/שְׁבָטָ֑י/ו וַ/יִּלָּכֵ֖ד שֵׁ֥בֶט יְהוּדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/016.yaml
  text: Joshua rose early in the morning and brought Israel near by its tribes[b][a], and the tribe of Judah was taken.
translation:
  language: de
  text: Josua stand früh am Morgen auf und ließ Israel nach seinen Stämmen vortreten[a]. Da wurde der Stamm Juda herausgegriffen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ließ Israel Stamm für Stamm vortreten“.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht eine passive Form von „fangen, ergreifen“; hier bezeichnet sie, dass der Stamm im Auswahlverfahren herausgegriffen wurde. Das Verfahren wird in diesem Satz nicht ausdrücklich genannt.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  choice: stand früh am Morgen auf
  rationale: Die Verbindung gibt sowohl das frühe Aufstehen als auch die Tageszeit wieder und klingt im modernen Deutschen natürlich.
- source_word: וַיַּקְרֵב אֶת יִשְׂרָאֵל
  choice: ließ Israel ... antreten
  rationale: Der Hifil von קרב bezeichnet hier das Heranführen beziehungsweise Vortretenlassen Israels im Rahmen des Auswahlverfahrens. „Antreten lassen“ gibt den veranlassenden Sinn und den geordneten Vorgang verständlich wieder.
- source_word: לִשְׁבָטָיו
  choice: nach seinen Stämmen
  rationale: Die Präposition mit dem Substantiv im Plural beschreibt die Gliederung Israels nach seinen Stammesverbänden.
- source_word: וַיִּלָּכֵד
  choice: wurde getroffen
  rationale: Der passive Ausdruck bezeichnet in diesem Auswahlzusammenhang, dass eine Einheit herausgegriffen wird. „Getroffen“ bewahrt die knappe hebräische Wendung, ohne das im Vers nicht ausdrücklich genannte Verfahren festzulegen.
- source_word: שֵׁבֶט יְהוּדָה
  choice: der Stamm Juda
  rationale: Dies ist die klare und im Deutschen übliche Wiedergabe der hebräischen Genitivverbindung.
theological_decisions:
- issue: Art des durch וַיִּלָּכֵד bezeichneten Auswahlvorgangs
  choice: „wurde getroffen“ ohne ausdrückliche Nennung eines Loses oder des handelnden Gottes
  alternative: „wurde ausgewählt“, „wurde durch das Los getroffen“ oder „wurde als schuldig ermittelt“
  rationale: Der unmittelbare Wortlaut nennt weder das Los noch den Handelnden und sagt an dieser Stelle auch noch nicht ausdrücklich „schuldig“. Die gewählte Fassung erhält diese Zurückhaltung und die Spannung des fortschreitenden Ermittlungsverfahrens.
translation_notes:
  register: Moderne, würdevolle Erzählsprache. „Antreten lassen“ macht den geordneten Vorgang verständlich; „wurde getroffen“ hält die knappe und bewusst nicht näher erklärte Passivform des Hebräischen offen.
