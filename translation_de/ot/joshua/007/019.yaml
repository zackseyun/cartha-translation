  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֶל עָכָ֗ן בְּנִ/י֙ שִֽׂים נָ֣א כָב֗וֹד לַֽ/יהוָ֛ה אֱלֹהֵ֥י יִשְׂרָאֵ֖ל וְ/תֶן ל֣/וֹ תוֹדָ֑ה וְ/הַגֶּד נָ֥א לִ/י֙ מֶ֣ה עָשִׂ֔יתָ אַל תְּכַחֵ֖ד מִמֶּֽ/נִּי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/019.yaml
  text: Then Joshua said to Achan[a], “My son, please give glory to Yahweh, the God of Israel, and give thanks to him. Please tell me what you have done; do not hide it from me.”
translation:
  language: de
  text: 'Da sagte Josua zu Achan: »Mein Sohn, gib doch Jahwe, dem Gott Israels, die Ehre und danke ihm.[a] Sag mir doch, was du getan hast; verschweige es mir nicht!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und lobe ihn«; im Zusammenhang auch: »und bekenne es vor ihm«. Das hebräische Wort kann Dank, Lob oder ein Bekenntnis bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: Mein Sohn
  rationale: Die wörtliche Anrede bewahrt die männliche Singularform und Josuas persönlichen, väterlich-ernsten Ton.
- source_word: שִׂים נָא כָבוֹד
  choice: gib doch … die Ehre
  rationale: Die hebräische Wendung lautet wörtlich etwa »Ehre setzen«, bedeutet hier aber idiomatisch, Gottes Ehre anzuerkennen. »doch« gibt die eindringliche Bitte נָא natürlich wieder.
- source_word: לַיהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: Jahwe, dem Gott Israels
  rationale: Der Gottesname wird transparent als »Jahwe« wiedergegeben; die Apposition folgt dem hebräischen Text.
- source_word: וְתֶן לוֹ תוֹדָה
  choice: und lege vor ihm ein Bekenntnis ab
  rationale: תוֹדָה kann Dank, Lob oder Bekenntnis bezeichnen. Im gerichtlichen Zusammenhang, unmittelbar vor der Aufforderung, die Tat offenzulegen, liegt »Bekenntnis« nahe; die übrigen Möglichkeiten bleiben in der Fußnote erhalten.
- source_word: וְהַגֶּד נָא לִי מֶה עָשִׂיתָ
  choice: Sag mir doch, was du getan hast
  rationale: Die direkte, natürliche Form wahrt sowohl den Hifil-Imperativ von נגד als auch die bittende beziehungsweise eindringliche Nuance von נָא.
- source_word: אַל תְּכַחֵד מִמֶּנִּי
  choice: verschweige es mir nicht
  rationale: כחד bezeichnet hier das Verheimlichen oder Zurückhalten einer Information. »Verschweigen« passt im Deutschen präzise zur Aufforderung, die Tat mitzuteilen.
theological_decisions:
- issue: Bedeutung von תוֹדָה in der Aufforderung an Achan
  choice: Bekenntnis vor Gott
  alternative: Dank oder Lob für Gott
  rationale: Der unmittelbare Zusammenhang einer erzwungenen Offenlegung stützt die Bedeutung »Bekenntnis«, doch das hebräische Wort bleibt mehrdeutig. Deshalb wird die kontextuell wahrscheinliche Lesart im Haupttext verwendet und die lexikalische Spannung in einer Fußnote bewahrt.
translation_notes:
  register: Moderne, würdige Standardsprache. Die zweimalige Partikel נָא wird jeweils mit »doch« wiedergegeben und erhält so den eindringlichen, persönlichen Appell, ohne altertümlich zu wirken.
