base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/005.yaml
  text: And the men of Ai struck down about thirty-six men from among them[a], and pursued them from before the gate as far as Shebarim, and struck them down on the descent. So the heart of the people melted and became like water.
translation:
  language: de
  text: Die Männer von Ai erschlugen etwa sechsunddreißig von ihnen. Sie verfolgten sie vom Tor bis nach Schebarim[a] und schlugen sie am Abhang nieder. Da zerschmolz das Herz des Volkes und wurde wie Wasser.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bis zu den Steinbrüchen« beziehungsweise »bis zu den Bruchstellen«. Das hebräische Wort שברים kann als Ortsname oder als beschreibende Bezeichnung verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּכּוּ מֵהֶם
  choice: erschlugen ... von ihnen
  rationale: נכה bezeichnet im Kampf ein Schlagen, das hier wegen der ausdrücklich genannten Zahl von Opfern tödlich zu verstehen ist; מֵהֶם kennzeichnet sie als Angehörige der israelitischen Streitmacht.
- source_word: אַנְשֵׁי הָעַי
  choice: die Männer von Ai
  rationale: Die Status-constructus-Verbindung bezeichnet die zu Ai gehörenden Männer; der Ortsname wird in seiner geläufigen deutschen Form wiedergegeben.
- source_word: כִּשְׁלֹשִׁים וְשִׁשָּׁה אִישׁ
  choice: etwa sechsunddreißig
  rationale: Das Präfix כ־ gibt eine ungefähre Zahl an. Das deutsche Zahlwort im Zusammenhang mit »von ihnen« macht die Wiederholung von »Männer« entbehrlich.
- source_word: וַיִּרְדְּפוּם לִפְנֵי הַשַּׁעַר
  choice: Sie verfolgten sie vom Tor
  rationale: רדף wird im militärischen Zusammenhang mit »verfolgen« wiedergegeben. Das räumliche לִפְנֵי bezeichnet den Ausgangspunkt vor beziehungsweise beim Tor; »vom Tor« ist im Deutschen knapp und natürlich.
- source_word: עַד הַשְּׁבָרִים
  choice: bis nach Schebarim
  rationale: השברים kann als Ortsbezeichnung oder als beschreibendes Substantiv verstanden werden. Der Haupttext bewahrt die mögliche Ortsbezeichnung; die sachlichen Alternativen stehen in der Fußnote.
- source_word: וַיַּכּוּם בַּמּוֹרָד
  choice: schlugen sie am Abhang nieder
  rationale: Die erneute Form von נכה wird konsistent als gewaltsames Niederschlagen verstanden; מוֹרָד bezeichnet einen Abhang oder abwärts führenden Weg.
- source_word: וַיִּמַּס לְבַב הָעָם
  choice: Da zerschmolz das Herz des Volkes
  rationale: Die lebendige hebräische Metapher für den völligen Verlust von Mut bleibt erhalten, statt sie durch eine rein erklärende Formulierung zu ersetzen.
- source_word: וַיְהִי לְמָיִם
  choice: und wurde zu Wasser
  rationale: Die Fortsetzung der Metapher wird nahe am hebräischen Wortlaut wiedergegeben. Sie beschreibt den Zusammenbruch der inneren Festigkeit des Volkes.
