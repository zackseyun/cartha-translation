  source_fidelity: 'Der Entwurf gibt die hebräische Erzählfolge und die wesentlichen Bedeutungen zuverlässig wieder: Josua sendet Männer von Jericho nach Ai; Ai wird in einer relativen Ortsangabe bei Bet-Awen und östlich von Bet-El lokalisiert; der Auftrag und seine Ausführung bewahren sowohl „hinaufziehen“ als auch den Kundschafts-/Erkundungssinn von רגל. „Erkundet Ai“ bildet das abschließende direkte Objekt angemessen ab.'
  naturalness: Modernes, gut lesbares Standarddeutsch mit angemessen würdigem biblischem Register. „Zieht hinauf“ ist als knapper militärischer Auftrag idiomatisch; die Wiederholung in „zogen die Männer hinauf“ ist natürlich und spiegelt den hebräischen Erzählstil.
  terminology: „Josua“, „Jericho“, „Ai“, „Bet-Awen“ und „Bet-El“ sind konsistent und im deutschen Bibelgebrauch verständlich. „Männer“, „Land“ und „erkunden“ sind sachgerecht; „erkunden“ vermeidet die unnötig negativ gefärbte Konnotation von „ausspionieren“, ohne den Aufklärungsauftrag abzuschwächen.
