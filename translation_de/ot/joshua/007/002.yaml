source:
  edition: WLC
  text: וַ/יִּשְׁלַח֩ יְהוֹשֻׁ֨עַ אֲנָשִׁ֜ים מִֽ/ירִיח֗וֹ הָ/עַ֞י אֲשֶׁ֨ר עִם בֵּ֥ית אָ֨וֶן֙ מִ/קֶּ֣דֶם לְ/בֵֽית אֵ֔ל וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ לֵ/אמֹ֔ר עֲל֖וּ וְ/רַגְּל֣וּ אֶת הָ/אָ֑רֶץ וַֽ/יַּעֲלוּ֙ הָ/אֲנָשִׁ֔ים וַֽ/יְרַגְּל֖וּ אֶת הָ/עָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/002.yaml
  text: And Joshua sent men from Jericho to Ai[a], which is near Beth-aven, east of Bethel, and said to them, “Go up and spy out the land.” So the men went up and spied out Ai.
translation:
  language: de
  text: 'Josua schickte Männer von Jericho nach Ai, das bei Bet-Awen[a] östlich von Bet-El liegt, und sagte zu ihnen: »Zieht hinauf und erkundet das Land!« Da zogen die Männer hinauf und erkundeten Ai.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das neben Bet-Awen liegt«. Wörtlich steht im Hebräischen »das mit Bet-Awen ist«; die verwendete Präposition kann geografische Nähe bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: schickte
  rationale: Gibt das narrative וַיִּשְׁלַח natürlich und sachlich wieder.
- source_word: אֲנָשִׁים
  choice: Männer
  rationale: Entspricht dem ausdrücklich maskulinen Plural und passt zum militärischen Erkundungsauftrag.
- source_word: הָעַי
  choice: Ai
  rationale: Der Ortsname wird nach üblicher deutscher Form ohne Artikel wiedergegeben.
- source_word: אֲשֶׁר עִם בֵּית אָוֶן
  choice: das bei Bet-Awen liegt
  rationale: עִם bedeutet wörtlich „mit“, kann in geografischer Beschreibung jedoch räumliche Nähe ausdrücken; „bei“ bewahrt diese Nähe, ohne sie genauer festzulegen.
- source_word: מִקֶּדֶם לְבֵית אֵל
  choice: östlich von Bet-El
  rationale: Gibt die geografische Lagebeziehung knapp und idiomatisch wieder.
- source_word: עֲלוּ / וַיַּעֲלוּ
  choice: Zieht hinauf / zogen … hinauf
  rationale: Bewahrt sowohl die topografische Richtungsangabe als auch die Wiederaufnahme des Befehls im Erzählbericht.
- source_word: וְרַגְּלוּ / וַיְרַגְּלוּ
  choice: erkundet / erkundeten
  rationale: Gibt den militärischen Sinn des Piel von רגל in natürlichem modernem Deutsch wieder; „ausspionieren“ wäre stärker negativ gefärbt.
- source_word: אֶת הָאָרֶץ
  choice: das Land
  rationale: Die breite Bedeutung von אֶרֶץ bleibt erhalten und wird nicht vorschnell auf Stadtgebiet oder Gelände eingeengt.
