  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֲהָ֣הּ אֲדֹנָ֣/י יְהוִ֗ה לָ֠/מָה הֵעֲבַ֨רְתָּ הַעֲבִ֜יר אֶת הָ/עָ֤ם הַ/זֶּה֙ אֶת הַ/יַּרְדֵּ֔ן לָ/תֵ֥ת אֹתָ֛/נוּ בְּ/יַ֥ד הָ/אֱמֹרִ֖י לְ/הַאֲבִידֵ֑/נוּ וְ/לוּ֙ הוֹאַ֣לְנוּ וַ/נֵּ֔שֶׁב בְּ/עֵ֖בֶר הַ/יַּרְדֵּֽן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/007.yaml
  text: And Joshua said[a], “Ah, Lord GOD, why have you brought this people across the Jordan at all—to give us into the hand of the Amorites, to destroy us? If only we had been willing to dwell beyond the Jordan!”
translation:
  language: de
  text: 'Und Josua sagte: »Ach, Herr Jahwe[a], warum hast du dieses Volk überhaupt über den Jordan geführt, um uns in die Hand der Amoriter auszuliefern und uns zu vernichten? Hätten wir uns doch nur dazu bereit erklärt, jenseits des Jordans zu bleiben!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »Herr Jahwe«; die Anrede verbindet den Herrentitel mit dem Gottesnamen.'
    reason: Die ungewöhnliche Doppelanrede des Hebräischen und der ausdrücklich verwendete Gottesname sollen für Leserinnen und Leser erkennbar bleiben.
lexical_decisions:
- source_word: אֲהָהּ
  choice: Ach
  rationale: Die Interjektion drückt Klage und Bestürzung aus; »Ach« ist im modernen Deutschen natürlich und würdevoll.
- source_word: אֲדֹנָי יְהוִה
  choice: Herr, Jahwe
  rationale: Die Anrede verbindet den Herrentitel אֲדֹנָי mit dem Gottesnamen יהוה. Die Wiedergabe wahrt beide Bestandteile, ohne die missverständliche Verdoppelung »Herr HERR«.
- source_word: הֵעֲבַרְתָּ הַעֲבִיר
  choice: hast du ... überhaupt über ... geführt
  rationale: Das finite Verb mit Infinitivus absolutus verstärkt die vorwurfsvolle Frage; »überhaupt« gibt diesen Nachdruck idiomatisch wieder.
- source_word: לָתֵת אֹתָנוּ בְּיַד הָאֱמֹרִי
  choice: um uns in die Hand der Amoriter zu geben
  rationale: Die hebräische Hand-Metapher für Auslieferung an fremde Gewalt bleibt erhalten; der morphologische Singular bezeichnet hier kollektiv das Volk der Amoriter.
- source_word: לְהַאֲבִידֵנוּ
  choice: und uns zu vernichten
  rationale: Gibt den Zweck beziehungsweise die befürchtete Folge direkt und mit dem angemessenen Ernst wieder.
- source_word: וְלוּ הוֹאַלְנוּ
  choice: Hätten wir uns doch nur entschlossen
  rationale: Die Wunschpartikel und das Verb des Bereitseins beziehungsweise Einwilligens bilden einen irrealen Wunsch. »Uns entschlossen« bewahrt die Willenskomponente, ohne Zufriedenheit zu unterstellen.
- source_word: וַנֵּשֶׁב בְּעֵבֶר הַיַּרְדֵּן
  choice: jenseits des Jordans zu bleiben
  rationale: Im Wunschgefüge bezeichnet ישב das Bleiben beziehungsweise Wohnen auf der anderen Jordanseite; »bleiben« passt zum kontrafaktischen Verzicht auf den Übergang.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה in der Anrede אֲדֹנָי יְהוִה
  choice: Herr, Jahwe
  alternative: Herr, HERR; Herr, der HERR
  rationale: »Jahwe« macht den im Ausgangstext ausdrücklich stehenden Eigennamen sichtbar; »Herr« gibt אֲדֹנָי wieder. Ein Komma kennzeichnet die direkte Anrede und verhindert, dass beide Wörter wie ein zusammengesetzter Titel wirken.
- issue: Deutung von Josuas Frage nach Gottes Absicht
  choice: Als offene, von Verzweiflung geprägte Zweckfrage formuliert
  alternative: Als ausdrückliche Behauptung, Gott habe Israel mit Vernichtungsabsicht hinübergeführt
  rationale: Die Infinitivkonstruktionen können die von Josua beklagte Absicht beziehungsweise Folge ausdrücken. Die Frageform bewahrt die Spannung, ohne seine Worte zu einer dogmatischen Aussage über Gottes tatsächliche Absicht zu machen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Klagecharakter. Die rhetorische Schärfe wird durch »überhaupt« und die kurzen Fragen bewahrt; unnötig altertümliche Formen werden vermieden.
