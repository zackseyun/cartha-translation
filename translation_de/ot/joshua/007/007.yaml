revisions:
- from: 'Und Josua sagte: »Ach, Herr, Jahwe[a], warum hast du dieses Volk überhaupt über den Jordan geführt? Um uns in die Hand der Amoriter zu geben und uns zu vernichten? Hätten wir uns doch nur entschlossen, jenseits des Jordans zu bleiben!«'
  to: 'Und Josua sagte: »Ach, Herr Jahwe[a], warum hast du dieses Volk überhaupt über den Jordan geführt, um uns in die Hand der Amoriter auszuliefern und uns zu vernichten? Hätten wir uns doch nur dazu bereit erklärt, jenseits des Jordans zu bleiben!«'
  rationale: Die Überarbeitung korrigiert die deutsche Anrede zu einer zusammengehörigen Titel-Namen-Fügung, erhält die gesamte rhetorische Frage als Einheit und präzisiert den irrealen Wunsch als Bereitschaft bzw. Einwilligung. Die Aussage und ihre offene, verzweifelte Perspektive bleiben unverändert.
