  text: וַ/יַּקְרֵב֙ אֶת מִשְׁפַּ֣חַת יְהוּדָ֔ה וַ/יִּלְכֹּ֕ד אֵ֖ת מִשְׁפַּ֣חַת הַ/זַּרְחִ֑י וַ/יַּקְרֵ֞ב אֶת מִשְׁפַּ֤חַת הַ/זַּרְחִי֙ לַ/גְּבָרִ֔ים וַ/יִּלָּכֵ֖ד זַבְדִּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/017.yaml
  text: Then he brought near the clan of Judah[a], and the clan of the Zerahites was taken. Then he brought near the clan of the Zerahites man by man, and Zabdi was taken.
translation:
  language: de
  text: Dann ließ er die Sippe Juda vortreten, und die Sippe der Serachiter wurde ausgewählt. Darauf ließ er die Sippe der Serachiter Mann für Mann[a] vortreten, und Sabdi wurde ausgewählt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach den Männern“. Der hebräische Ausdruck ist nicht ganz eindeutig; wahrscheinlich bezeichnet er das Vortreten der Sippe nach einzelnen Männern.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: ließ … vortreten
  rationale: Das Hifil von קרב bezeichnet hier das Heranführen beziehungsweise Vorstellen im Rahmen des Ermittlungsverfahrens. „Vortreten lassen“ ist im Deutschen natürlich und bewahrt den prozeduralen Sinn.
- source_word: מִשְׁפַּחַת
  choice: Sippe
  rationale: מִשְׁפָּחָה bezeichnet hier eine verwandtschaftliche Untergliederung des Stammes. „Sippe“ unterscheidet diese Einheit sowohl vom ganzen Stamm als auch von der engeren Familie.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Eingebürgerte deutsche Namensform für den Stamm Juda.
- source_word: וַיִּלְכֹּד / וַיִּלָּכֵד
  choice: wurde ermittelt
  rationale: Das Verb bedeutet grundsätzlich „fangen/ergreifen“, bezeichnet in diesem Zusammenhang jedoch das durch das Auswahlverfahren identifizierte Los. „Wurde ermittelt“ gibt die kontextuelle Funktion wieder, ohne einen militärischen Sinn nahezulegen.
- source_word: הַזַּרְחִי
  choice: die Serachiter
  rationale: Das Gentiliz bezeichnet die Nachkommen beziehungsweise Sippe Serachs. „Serachiter“ ist die übliche und knappe deutsche Bildung.
- source_word: לַגְּבָרִים
  choice: Mann für Mann
  rationale: 'Wörtlich etwa „nach/zu den Männern“; im stufenweisen Verfahren ist ein distributiver Sinn wahrscheinlich: Die männlichen Angehörigen treten einzeln vor.'
- source_word: זַבְדִּי
  choice: Sabdi
  rationale: Eingebürgerte deutsche Namensform.
theological_decisions:
- issue: Art der Identifizierung
  choice: Das Ergebnis wird mit „wurde ermittelt“ ausgedrückt.
  alternative: „wurde durch das Los getroffen“ oder wörtlicher „wurde ergriffen“.
  rationale: Der Vers nennt das Los hier nicht ausdrücklich. Die Übersetzung macht das Identifizieren deutlich, ohne ein im unmittelbaren Wortlaut nicht genanntes Mittel einzufügen oder den missverständlichen Eindruck einer Gefangennahme zu erzeugen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur und das stufenweise Vorgehen des hebräischen Textes bleiben erhalten; „Sippe“ dient als klare Bezeichnung der verwandtschaftlichen Einheit unterhalb des Stammes.
