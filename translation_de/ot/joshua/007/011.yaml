  naturalness: Der Entwurf ist überwiegend modernes Standarddeutsch. Eine gereihte Wiederholung von „auch“ ist hier trotz leichter Eindringlichkeit natürlich, weil sie die bewusst kumulative Anklage des hebräischen Satzes trägt.
  terminology: '„Bund übertreten“ und „gesündigt“ sind angemessen. Für חֵרֶם ist „dem Bann geweiht“ präziser und im Deutschen idiomatischer als „dem Bann verfallen“: Es lässt die kultische Aussonderung stehen, ohne die Bedeutung auf die Vernichtung zu reduzieren. Für כִּחֲשׁוּ ist „gelogen“ als knappe Hauptlesart möglich; die weiteren Nuancen werden in der Fußnote bewahrt.'
