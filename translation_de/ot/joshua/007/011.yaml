    rationale: Das Hebräische setzt vor jedem folgenden Vorwurf וְגַם. Im Entwurf erscheinen „auch“ und „sogar“ nur in den ersten beiden Folgesätzen; bei „gestohlen, es verheimlicht und es ... gelegt“ entfällt die wiederholte Hervorhebung. „Sogar“ bedeutet zudem eher „even“ als „also“.
