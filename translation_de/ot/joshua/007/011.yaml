  text: חָטָא֙ יִשְׂרָאֵ֔ל וְ/גַם֙ עָבְר֣וּ אֶת בְּרִיתִ֔/י אֲשֶׁ֥ר צִוִּ֖יתִי אוֹתָ֑/ם וְ/גַ֤ם לָֽקְחוּ֙ מִן הַ/חֵ֔רֶם וְ/גַ֤ם גָּֽנְבוּ֙ וְ/גַ֣ם כִּֽחֲשׁ֔וּ וְ/גַ֖ם שָׂ֥מוּ בִ/כְלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/011.yaml
  text: Israel has sinned[a]. They have also transgressed my covenant that I commanded them, and they have also taken some of what was devoted to destruction, and they have also stolen, and they have also deceived[c][b], and they have also put it among their own belongings.
translation:
  language: de
  text: Israel hat gesündigt. Auch haben sie meinen Bund übertreten, den ich ihnen geboten habe. Auch haben sie von dem genommen, was dem Bann geweiht war[a]. Auch haben sie gestohlen, auch gelogen[b] und es auch unter ihre eigenen Sachen gelegt[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von dem genommen, was zur Vernichtung bestimmt war“; wörtlicher: „von dem Gebannten“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „es geleugnet“ beziehungsweise „getäuscht“ oder „betrügerisch gehandelt“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „es unter ihre Geräte/Gegenstände gelegt“; gemeint ist, dass die Gegenstände unter ihrem Besitz verborgen wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָא יִשְׂרָאֵל
  choice: Israel hat gesündigt
  rationale: Die kollektive Zuschreibung an Israel und das theologische Gewicht von חטא bleiben unmittelbar erhalten.
- source_word: עָבְרוּ אֶת־בְּרִיתִי
  choice: meinen Bund übertreten
  rationale: עבר bezeichnet hier die Verletzung der von Gott gesetzten Bundesgrenze; „übertreten“ bewahrt das Bild und den bundesbezogenen Ernst.
- source_word: אֲשֶׁר צִוִּיתִי אוֹתָם
  choice: den ich ihnen geboten habe
  rationale: Die knappe Formulierung folgt dem Hebräischen, ohne ein nicht ausdrücklich genanntes „zu halten“ hinzuzufügen.
- source_word: לָקְחוּ מִן־הַחֵרֶם
  choice: von dem genommen, was dem Bann verfallen war
  rationale: חֵרֶם bezeichnet hier ausgesondertes Gut, über das der Bann verhängt war. Die Formulierung ist verständlich, ohne den Begriff ausschließlich als Vernichtung zu deuten.
- source_word: גָּנְבוּ
  choice: sie haben gestohlen
  rationale: Die direkte Wiedergabe erhält die eigenständige Anklage.
- source_word: כִּחֲשׁוּ
  choice: es verheimlicht
  rationale: Im Kontext bezeichnet das Verb betrügerisches Leugnen bzw. Verschweigen. „Verheimlicht“ gibt den Sachbezug natürlich wieder; die weiter gefasste Alternative steht in der Fußnote.
- source_word: שָׂמוּ בִכְלֵיהֶם
  choice: es unter ihre eigenen Sachen gelegt
  rationale: כְּלִים ist ein weiter Begriff für Geräte, Gegenstände oder Besitz. „Sachen“ ist hier natürlich und lässt die genaue Art der Gegenstände offen.
- source_word: וְגַם ... וְגַם ... וְגַם
  choice: auch ... sogar ...; ... und ...
  rationale: Die Häufung der Vorwürfe wird im Deutschen durch „auch“, das steigernde „sogar“ und eine rhythmische Reihung bewahrt, ohne unnatürlich jedes גַם gleichförmig wiederzugeben.
theological_decisions:
- issue: Kollektive Schuldzuweisung an Israel trotz der Tat eines Einzelnen
  choice: Israel bleibt das kollektive Subjekt; die folgenden Verben stehen im Plural.
  alternative: Die Aussage auf Achan als alleinigen Täter einengen.
  rationale: Der hebräische Text schreibt die Sünde ausdrücklich Israel als Bundesvolk zu. Diese Spannung darf die Übersetzung nicht durch eine individualisierende Paraphrase auflösen.
- issue: Bedeutung von חֵרֶם
  choice: „dem Bann verfallen“
  alternative: „zur Vernichtung bestimmt“
  rationale: Der Bann schließt im Kontext die Aussonderung und vorgesehene Vernichtung ein, doch der lexikalische Ausdruck ist breiter. Die Hauptfassung wahrt diese Spannung; die konkretere Deutung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anklagen bleiben klar gereiht, während übermäßig starre Wiederholungen vermieden werden. Die kollektive Redeweise und die Bedeutungsbreite von חֵרֶם und כחש bleiben erhalten.
