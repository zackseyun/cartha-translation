    rationale: Das Verb kann lügen, verleugnen oder täuschen bedeuten. Eine Hauptfassung mit „gelogen“ wahrt die knappe, nicht näher spezifizierte Anschuldigung besser; Alternativen können in der Anmerkung stehen.
