revisions:
- from: Israel hat gesündigt. Sie haben auch meinen Bund übertreten, den ich ihnen geboten habe. Sie haben sogar von dem genommen, was dem Bann verfallen war[a]; sie haben gestohlen, es verheimlicht[b] und es unter ihre eigenen Sachen gelegt[c].
  to: Israel hat gesündigt. Auch haben sie meinen Bund übertreten, den ich ihnen geboten habe. Auch haben sie von dem genommen, was dem Bann geweiht war[a]. Auch haben sie gestohlen, auch gelogen[b] und es auch unter ihre eigenen Sachen gelegt[c].
  rationale: Die Überarbeitung gibt die rhetorisch nachdrückliche Wiederholung von וְגַם durch wiederholtes „auch“ wieder, ohne die kollektive Aussage zu verändern. „Dem Bann geweiht“ bildet חֵרֶם offen genug ab; die konkretisierende Möglichkeit der Vernichtung bleibt als Fußnotenalternative erhalten. „Gelogen“ ist eine natürliche knappe Wiedergabe von כִּחֲשׁוּ, während die semantisch möglichen Nuancen nicht dogmatisch oder kontextuell überbestimmt werden.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T09:40:13Z'
