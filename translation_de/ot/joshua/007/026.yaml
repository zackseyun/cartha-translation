source:
  edition: WLC
  text: וַ/יָּקִ֨ימוּ עָלָ֜י/ו גַּל אֲבָנִ֣ים גָּד֗וֹל עַ֚ד הַ/יּ֣וֹם הַ/זֶּ֔ה וַ/יָּ֥שָׁב יְהוָ֖ה מֵ/חֲר֣וֹן אַפּ֑/וֹ עַל כֵּ֠ן קָרָ֞א שֵׁ֣ם הַ/מָּק֤וֹם הַ/הוּא֙ עֵ֣מֶק עָכ֔וֹר עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/026.yaml
  text: And they raised over him a large heap of stones to this day[a], and Yahweh turned from the burning of his anger. Therefore the name of that place has been called the Valley of Achor to this day.
translation:
  language: de
  text: Sie türmten über ihm einen großen Steinhaufen auf, der bis zum heutigen Tag dort liegt. Da wandte sich Jahwe von der Glut seines Zorns ab. Darum heißt jener Ort bis zum heutigen Tag Tal Achor[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Achor ist mit dem hebräischen Wort für „Unglück“ oder „Bedrängnis“ verwandt; vergleiche Josua 7,25.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקִימוּ עָלָיו גַּל אֲבָנִים גָּדוֹל
  choice: Sie errichteten über ihm einen großen Steinhaufen
  rationale: Das Hifil von קום bezeichnet hier das Aufrichten beziehungsweise Auftürmen; „errichteten“ ist für einen großen Steinhaufen natürlich und bewahrt עָלָיו als „über ihm“.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: der bis zum heutigen Tag dort liegt / bis zum heutigen Tag
  rationale: Die deutsche Ergänzung „der … dort liegt“ macht beim ersten Vorkommen den zeitlichen Bezug des hebräischen Idioms verständlich; beim zweiten steht die geläufige Wendung direkt.
- source_word: וַיָּשָׁב יְהוָה מֵחֲרוֹן אַפּוֹ
  choice: Da wandte sich Jahwe von der Glut seines Zorns ab
  rationale: „wandte sich … ab“ bewahrt die Bewegungsmetapher von שׁוב, während „Glut seines Zorns“ die Bildsprache von חֲרוֹן אַף knapp und verständlich wiedergibt.
- source_word: עַל כֵּן קָרָא שֵׁם הַמָּקוֹם הַהוּא
  choice: Deshalb nennt man diesen Ort
  rationale: Der unbestimmte Singular in der hebräischen Namensformel wird im Deutschen idiomatisch mit unpersönlichem „man“ wiedergegeben; zusammen mit „bis zum heutigen Tag“ bezeichnet das Präsens den fortbestehenden Namen.
- source_word: עֵמֶק עָכוֹר
  choice: Tal Achor
  rationale: Der Eigenname wird transliteriert; das für die Erzählung wichtige Wortspiel mit עכר wird in einer Fußnote erklärt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der im Ausgangstext stehende Eigenname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- issue: Göttlicher Zorn in מֵחֲרוֹן אַפּוֹ
  choice: von der Glut seines Zorns
  alternative: von seinem heftigen Zorn
  rationale: Die konkrete hebräische Metapher bleibt erhalten, ohne sie abzuschwächen oder dogmatisch auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt nah am Hebräischen; eine knappe relative Ergänzung beim ersten „bis zum heutigen Tag“ verhindert im Deutschen den missverständlichen Eindruck, das Errichten habe bis heute angedauert.
