  text: וַ/יַּקְרֵ֥ב אֶת בֵּית֖/וֹ לַ/גְּבָרִ֑ים וַ/יִּלָּכֵ֗ד עָכָ֞ן בֶּן כַּרְמִ֧י בֶן זַבְדִּ֛י בֶּן זֶ֖רַח לְ/מַטֵּ֥ה יְהוּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/018.yaml
  text: Then he brought his household near man by man[a], and Achan son of Carmi, son of Zabdi, son of Zerah, of the tribe of Judah, was taken.
translation:
  language: de
  text: Dann ließ er sein Haus Mann für Mann[a] herantreten, und getroffen wurde Achan, der Sohn Karmis, des Sohnes Sabdis, des Sohnes Serachs, aus dem Stamm Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »nach den Männern«. Die hebräische Wendung ist knapp und kann bedeuten, dass das Haus für das Losverfahren nach seinen männlichen Angehörigen gegliedert vorgeführt wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: ließ … herantreten
  rationale: Der Hifil von קרב bedeutet »nahebringen« bzw. »vorführen«. Im Verfahren der Auslosung gibt »herantreten lassen« den Vorgang im Deutschen natürlich und zugleich quellennah wieder.
- source_word: בֵּיתוֹ
  choice: seine Hausgemeinschaft
  rationale: בַּיִת bezeichnet hier nicht das Gebäude, sondern den zugehörigen Familien- und Haushaltsverband. »Hausgemeinschaft« bewahrt diesen sozialen Sinn, ohne ihn vorschnell auf die Kernfamilie zu verengen.
- source_word: לַגְּבָרִים
  choice: Mann für Mann
  rationale: Die knappe hebräische Wendung kann eine Gliederung nach den männlichen Angehörigen oder ein einzelnes Vortreten bezeichnen. »Mann für Mann« gibt den wahrscheinlichen Verfahrenssinn idiomatisch wieder; die alternative Deutung wird in der Fußnote bewahrt.
- source_word: וַיִּלָּכֵד
  choice: getroffen wurde
  rationale: Der Nifal von לכד bedeutet wörtlich »gefangen/ergriffen werden«, wird hier aber im Zusammenhang der Ermittlung durch das Los gebraucht. »Getroffen wurde« bewahrt die knappe passive Formel und lässt den Loskontext erkennen, ohne ausdrücklich »ausgewählt« zu sagen.
- source_word: עָכָן
  choice: Achan
  rationale: Der Personenname wird nach der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: בֶּן כַּרְמִי בֶן זַבְדִּי בֶּן זֶרַח
  choice: der Sohn Karmis, des Sohnes Sabdis, des Sohnes Serachs
  rationale: Die vollständige Abstammungskette und die wiederholte Vater-Sohn-Beziehung des Hebräischen bleiben erhalten.
- source_word: לְמַטֵּה יְהוּדָה
  choice: aus dem Stamm Juda
  rationale: מַטֶּה bezeichnet in diesem Zusammenhang einen Stamm Israels. Die Formulierung ist im modernen Deutschen klar und geläufig.
theological_decisions:
- issue: Bedeutung der passiven Form וַיִּלָּכֵד im Auslosungsverfahren
  choice: getroffen wurde
  alternative: ausgewählt wurde / gefangen wurde
  rationale: »Ausgewählt« würde den Vorgang stärker deuten, während »gefangen« im Deutschen irreführend nach einer Festnahme klingt. »Getroffen« erhält die Spannung zwischen der wörtlichen Bedeutung »ergriffen« und der kontextuellen Identifizierung durch das Los.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Verfahrenssprache bleibt knapp; »Hausgemeinschaft« verdeutlicht den sozialen Sinn von »Haus«, und die ungewöhnliche, aber verständliche Wendung »getroffen wurde« bewahrt die formelhafte Sprache des hebräischen Losberichts.
