  to: Am Morgen sollt ihr nach euren Stämmen vortreten. Dann soll der Stamm, den Jahwe herausgreift[a], nach Sippen vortreten; die Sippe, die Jahwe herausgreift, nach Großfamilien; und aus der Großfamilie, die Jahwe herausgreift, soll Mann für Mann vortreten.[b]
