  text: וְ/נִקְרַבְתֶּ֥ם בַּ/בֹּ֖קֶר לְ/שִׁבְטֵי/כֶ֑ם וְ/הָיָ֡ה הַ/שֵּׁבֶט֩ אֲשֶׁר יִלְכְּדֶ֨/נּוּ יְהוָ֜ה יִקְרַ֣ב לַ/מִּשְׁפָּח֗וֹת וְ/הַ/מִּשְׁפָּחָ֞ה אֲשֶֽׁר יִלְכְּדֶ֤/נָּה יְהוָה֙ תִּקְרַ֣ב לַ/בָּתִּ֔ים וְ/הַ/בַּ֨יִת֙ אֲשֶׁ֣ר יִלְכְּדֶ֣/נּוּ יְהוָ֔ה יִקְרַ֖ב לַ/גְּבָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/014.yaml
  text: In the morning you shall come near by your tribes[a], and it shall be that the tribe that Yahweh selects shall come near by clans, and the clan that Yahweh selects shall come near by households[b], and the household that Yahweh selects shall come near man by man.
translation:
  language: de
  text: Am Morgen sollt ihr nach euren Stämmen vortreten. Dann soll der Stamm, den Jahwe herausgreift[a], nach Sippen vortreten; die Sippe, die Jahwe herausgreift, nach Großfamilien; und aus der Großfamilie, die Jahwe herausgreift, soll Mann für Mann vortreten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb bedeutet gewöhnlich „fangen“ oder „ergreifen“. Hier bezeichnet es den Stamm, die Sippe oder die Großfamilie, die Jahwe bestimmt; möglicherweise geschieht dies durch Los.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „zu den Männern“. Die Wendung bezeichnet die abschließende Feststellung der einzelnen Männer innerhalb der Großfamilie.'
    reason: lexical_clarification
lexical_decisions:
- source_word: וְנִקְרַבְתֶּם / יִקְרַב / תִּקְרַב
  choice: vortreten
  rationale: קרב bezeichnet hier das geordnete Herantreten zur Feststellung des Schuldigen. „Vortreten“ ist im Deutschen natürlich und bewahrt die Wiederholung des hebräischen Verbs.
- source_word: לְשִׁבְטֵיכֶם
  choice: nach euren Stämmen
  rationale: Die Präposition bezeichnet hier die geordnete Gliederung, in der Israel vortreten soll.
- source_word: יִלְכְּדֶנּוּ / יִלְכְּדֶנָּה
  choice: herausgreift
  rationale: לכד bedeutet gewöhnlich „fangen, ergreifen“. Im Kontext bezeichnet es die durch Jahwe erfolgende Bestimmung, wohl mittels Los. „Herausgreift“ wahrt sowohl den Auswahlvorgang als auch einen Teil der kräftigen Bildlichkeit.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לַמִּשְׁפָּחוֹת
  choice: nach seinen Sippen
  rationale: מִשְׁפָּחָה bezeichnet innerhalb des Stammes eine größere Verwandtschaftsgruppe; „Sippe“ bildet diese soziale Ebene angemessen ab.
- source_word: לַבָּתִּים / הַבַּיִת
  choice: nach ihren Großfamilien / die Großfamilie
  rationale: בַּיִת meint hier nicht ein Gebäude, sondern die unterhalb der Sippe stehende Einheit des Vaterhauses. „Großfamilie“ ist für heutige Leser verständlich und unterscheidet diese Ebene von der Sippe.
- source_word: לַגְּבָרִים
  choice: Mann für Mann
  rationale: Der maskuline Plural wird distributiv gebraucht und bezeichnet die abschließende Prüfung der einzelnen Männer.
- source_word: וְהָיָה
  choice: Dann soll
  rationale: Die Formel leitet den nächsten Verfahrensschritt ein. Die deutsche Fassung gibt ihren konsekutiven und anweisenden Sinn natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. „Jahwe“ bewahrt den Charakter als persönlichen Gottesnamen.
- issue: Art der göttlichen Bestimmung
  choice: herausgreift
  alternative: durch das Los bestimmt
  rationale: Der Vers nennt das konkrete Verfahren nicht ausdrücklich. Daher wird die wahrscheinliche Losentscheidung nicht in den Haupttext eingefügt, sondern nur in der Fußnote als Möglichkeit erläutert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Verfahrensstruktur des Hebräischen bleibt durch „vortreten“ erhalten. „Sippe“ und „Großfamilie“ unterscheiden die aufeinanderfolgenden sozialen Ebenen, ohne moderne Kleinfamilienstrukturen in den Text einzutragen.
