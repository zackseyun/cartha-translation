source:
  edition: WLC
  text: וַ/יִּקַּ֣ח יְהוֹשֻׁ֣עַ אֶת עָכָ֣ן בֶּן זֶ֡רַח וְ/אֶת הַ/כֶּ֣סֶף וְ/אֶת הָ/אַדֶּ֣רֶת וְֽ/אֶת לְשׁ֣וֹן הַ/זָּהָ֡ב וְֽ/אֶת בָּנָ֡י/ו וְֽ/אֶת בְּנֹתָ֡י/ו וְ/אֶת שׁוֹר/וֹ֩ וְ/אֶת חֲמֹר֨/וֹ וְ/אֶת צֹאנ֤/וֹ וְ/אֶֽת אָהֳל/וֹ֙ וְ/אֶת כָּל אֲשֶׁר ל֔/וֹ וְ/כָל יִשְׂרָאֵ֖ל עִמּ֑/וֹ וַ/יַּעֲל֥וּ אֹתָ֖/ם עֵ֥מֶק עָכֽוֹר־־־־־־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/024.yaml
  text: Then Joshua took Achan son of Zerah[a], and the silver, the cloak, the bar of gold, his sons, his daughters, his ox, his donkey, his flock, his tent[b], and all that belonged to him—and all Israel with him—and they brought them up to the Valley of Achor.
translation:
  language: de
  text: Dann nahm Josua Achan, den Sohn Serachs, dazu das Silber, den Mantel, das zungenförmige Goldstück[a], seine Söhne und Töchter, seinen Ochsen, seinen Esel, seine Herde, sein Zelt und alles, was ihm gehörte, und ganz Israel mit ihm; sie führten sie hinauf ins Tal Achor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Zunge aus Gold“; gemeint ist wahrscheinlich ein zungenförmiges Stück Gold; traditionell auch „Goldbarren“ oder „Goldkeil“.
    reason: lexical_alternative
  - marker: b
    text: Achor klingt im Hebräischen an ein Wort für „in Bedrängnis oder ins Unglück bringen“ an.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Dann nahm Josua
  rationale: Die Wayyiqtol-Form führt die Erzählung weiter. „Dann“ gibt die zeitliche Folge natürlich wieder; „nahm“ bewahrt die Grundbedeutung von לקח, ohne unnötig Gewalt anzudeuten.
- source_word: עָכָן בֶּן זֶרַח
  choice: Achan, den Sohn Serachs
  rationale: Die Namen werden in geläufiger deutscher Bibelschreibung wiedergegeben; der Genitiv formuliert das Patronymikon natürlich.
- source_word: הַכֶּסֶף
  choice: das Silber
  rationale: כֶּסֶף bezeichnet hier das zuvor erwähnte Silber. „Geld“ wäre stärker deutend.
- source_word: הָאַדֶּרֶת
  choice: den Mantel
  rationale: אַדֶּרֶת bezeichnet ein auffälliges Obergewand. „Mantel“ ist im Deutschen verständlich und würdevoll.
- source_word: לְשׁוֹן הַזָּהָב
  choice: das Goldstück
  rationale: Wörtlich steht „Goldzunge“, offenbar ein zungenförmiges Stück Gold. „Goldstück“ bezeichnet den Gegenstand klar; die konkrete Bildsprache bleibt in der Fußnote erhalten.
- source_word: בָּנָיו ... בְּנֹתָיו
  choice: seine Söhne und Töchter
  rationale: Der hebräische Text nennt Söhne und Töchter ausdrücklich getrennt; diese Unterscheidung wird bewahrt.
- source_word: שׁוֹרוֹ
  choice: seinen Ochsen
  rationale: Die Einzahl von שׁוֹר wird als einzelnes Rind, hier idiomatisch als „Ochse“, wiedergegeben.
- source_word: חֲמֹרוֹ
  choice: seinen Esel
  rationale: „Esel“ ist die übliche moderne Entsprechung.
- source_word: צֹאנוֹ
  choice: seine Herde
  rationale: צֹאן ist eine Kollektivbezeichnung für Kleinvieh, besonders Schafe und Ziegen. „Herde“ wahrt den kollektiven Sinn, ohne die Tierarten enger festzulegen.
- source_word: אָהֳלוֹ
  choice: sein Zelt
  rationale: Dies ist die direkte und natürliche Wiedergabe.
- source_word: כָּל אֲשֶׁר לוֹ
  choice: alles, was ihm gehörte
  rationale: Die Formulierung gibt die zusammenfassende Besitzangabe idiomatisch wieder.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: Ganz Israel zog mit ihm
  rationale: Das Pronomen bezieht sich am natürlichsten auf Josua. Das ergänzte Verb „zog“ macht die Begleitung im Deutschen klar, ohne den Sinn zu erweitern.
- source_word: וַיַּעֲלוּ אֹתָם
  choice: sie brachten sie hinauf
  rationale: Die Wiedergabe erhält den Plural des Objekts und das im Verb enthaltene Hinaufbringen. Sie legt nicht näher fest, wie Personen, Tiere und Sachen jeweils transportiert oder geführt wurden.
- source_word: עֵמֶק עָכוֹר
  choice: Tal Achor
  rationale: Der Ortsname wird transliteriert; sein Wortanklang an Unheil beziehungsweise Unglück wird in einer Fußnote erläutert.
theological_decisions:
- issue: Schuld oder Unschuld von Achans Familie
  choice: Die Söhne und Töchter werden ohne erklärenden Zusatz als Teil der mitgenommenen Gruppe genannt.
  alternative: Ihre Mitschuld behaupten oder ausdrücklich erklären, sie seien nur anwesend gewesen und nicht bestraft worden.
  rationale: Dieser Vers nennt Achans Söhne und Töchter, erklärt aber für sich genommen weder ihren Beteiligungsgrad noch ihr weiteres Schicksal. Die Übersetzung bewahrt diese Spannung.
- issue: Bezugsumfang des pluralischen Objektpronomens אֹתָם
  choice: „sie“ bleibt als pluralischer Rückverweis stehen.
  alternative: Den Bezug ausdrücklich auf Achan und seine Angehörigen beschränken oder pauschal mit „alles“ wiedergeben.
  rationale: Das hebräische Pronomen folgt auf eine gemischte Aufzählung von Personen, Tieren und Sachen. Eine präzisierende Auflösung würde mehr festlegen als der Wortlaut.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die lange hebräische Aufzählung bleibt erhalten, wird aber für natürliche deutsche Syntax in zwei Sätze gegliedert. Die mehrdeutigen Bezüge und die Frage nach der Beteiligung von Achans Familie werden nicht interpretierend aufgelöst.
