- from: Dann nahm Josua Achan, den Sohn Serachs, dazu das Silber, den Mantel, das Goldstück[a], seine Söhne und Töchter, seinen Ochsen, seinen Esel, seine Herde, sein Zelt und alles, was ihm gehörte. Ganz Israel zog mit ihm, und sie brachten sie hinauf ins Tal Achor[b].
  to: Dann nahm Josua Achan, den Sohn Serachs, dazu das Silber, den Mantel, das zungenförmige Goldstück[a], seine Söhne und Töchter, seinen Ochsen, seinen Esel, seine Herde, sein Zelt und alles, was ihm gehörte, und ganz Israel mit ihm; sie führten sie hinauf ins Tal Achor[b].
