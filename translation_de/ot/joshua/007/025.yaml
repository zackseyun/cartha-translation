  to: 'Josua sagte: „Warum hast du uns ins Unglück gestürzt? Jahwe wird dich heute ins Unglück stürzen.“ Dann steinigte ihn ganz Israel mit Steinen[a]. Danach verbrannten sie sie im Feuer und steinigten sie mit Steinen[b].'
