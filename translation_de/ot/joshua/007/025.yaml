base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/025.yaml
  text: And Joshua said[a], “Why have you troubled us? Yahweh will trouble you this day.” And all Israel stoned him with stones[c][b], and they burned them with fire and stoned them with stones.
translation:
  language: de
  text: 'Josua sagte: „Warum hast du uns ins Unglück gestürzt? Jahwe wird dich heute ins Unglück stürzen.“ Dann steinigte ihn ganz Israel mit Steinen[a]. Danach verbrannten sie sie im Feuer und steinigten sie mit Steinen[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Hebräische nennt die Steine beim ersten Steinigen ausdrücklich. Es verwendet hier das Verb רגם.
    reason: lexical_alternative
  - marker: b
    text: Nach dem singularischen „ihn“ wechselt der hebräische Text zu „sie“. Außerdem steht hier mit סקל ein anderes hebräisches Verb für das Steinigen als zuvor. Die Übersetzung bewahrt den Numeruswechsel; der Verbwechsel wird in dieser Anmerkung kenntlich gemacht, ohne einen sicheren Bedeutungsunterschied zu behaupten.
    reason: alternative_reading
lexical_decisions:
- source_word: עֲכַרְתָּנוּ / יַעְכֳּרְךָ
  choice: hast du uns ins Unglück gestürzt / wird dich ins Unglück stürzen
  rationale: עכר bezeichnet das Verursachen von Unheil, Not oder schwerer Bedrängnis. Die identische Formulierung an beiden Stellen bewahrt das Wortspiel und die Vergeltungsentsprechung; „ins Unglück stürzen“ klingt im modernen Deutschen natürlich und ernst.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בַּיּוֹם הַזֶּה
  choice: heute
  rationale: „Heute“ gibt die unmittelbare Zeitangabe idiomatisch und vollständig wieder.
- source_word: וַיִּרְגְּמוּ אֹתוֹ ... אֶבֶן
  choice: steinigte ihn
  rationale: רגם bezeichnet hier die Hinrichtung durch Steinigen. Die zusätzliche instrumentale Angabe „mit einem Stein/mit Steinen“ wäre im Deutschen redundant und wird durch das Verb bereits ausgedrückt.
- source_word: וַיִּשְׂרְפוּ אֹתָם בָּאֵשׁ
  choice: verbrannten sie sie im Feuer
  rationale: Der Wechsel vom singularischen Objekt „ihn“ zum pluralischen „sie“ bleibt erhalten. „Im Feuer“ bewahrt die ausdrückliche instrumentale Angabe.
- source_word: וַיִּסְקְלוּ אֹתָם בָּאֲבָנִים
  choice: bewarfen sie mit Steinen
  rationale: סקל ist ein zweites Verb für das Steinigen beziehungsweise Bewerfen mit Steinen. Die abweichende deutsche Formulierung macht den hebräischen Verbwechsel erkennbar, ohne einen sicheren Bedeutungsunterschied zu behaupten.
theological_decisions:
- issue: Wechsel vom Singular zum Plural bei den Objektpronomen
  choice: Der Wechsel von „ihn“ zu „sie“ wird im Haupttext beibehalten.
  alternative: Alle Bezüge auf Achan in den Singular angleichen oder den Plural ausdrücklich nur auf seinen Besitz beziehungsweise auf seinen Haushalt beziehen.
  rationale: Der masoretische Text wechselt ausdrücklich vom Singular zum Plural. Die Übersetzung bewahrt diese Spannung und legt nicht fest, welche Personen oder Gegenstände der Plural genau umfasst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Wortspiel mit עכר wird durch die identische Wendung „ins Unglück stürzen“ bewahrt. Der schwer deutbare Wechsel vom Singular zum Plural wird nicht geglättet. Alle Fußnotenmarker stehen im Haupttext.
