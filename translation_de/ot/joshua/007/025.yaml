  naturalness: Die Überarbeitung bleibt modernes, würdiges Standarddeutsch. „Ganz Israel steinigte ihn mit Steinen“ ist trotz der Wiederholung klar und bildet die hebräische Ausdrucksweise angemessen ab. Die Pluralformen bleiben verständlich, ohne ihren Bezug interpretativ festzulegen.
  terminology: „Jahwe“ gibt יהוה korrekt als Eigenname wieder. „Ins Unglück stürzen“ bewahrt die Wiederholung und Vergeltungsentsprechung von עכר. Beide hebräischen Steninigungsbegriffe werden im Deutschen mit „steinigen“ wiedergegeben; die Fußnote dokumentiert den lexikalischen Wechsel, ohne eine ungesicherte semantische Differenz zu behaupten.
