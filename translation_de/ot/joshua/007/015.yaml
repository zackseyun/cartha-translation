- from: Wer aber mit dem Geweihten[a] ermittelt wird, soll im Feuer verbrannt werden – er und alles, was ihm gehört –, denn er hat den Bund Jahwes übertreten und eine Schandtat in Israel begangen.
  to: Wer aber mit dem Banngegenstand ergriffen wird, soll im Feuer verbrannt werden – er und alles, was ihm gehört –, denn er hat den Bund Jahwes übertreten und eine Schandtat in Israel begangen.
  rationale: Die Revision ersetzt allein die unklare Verbindung „mit dem Geweihten ermittelt wird“ durch eine im Deutschen verständliche, dem gerichtlichen Kontext angemessene Formulierung. Der Ausdruck „Banngegenstand“ konkretisiert nicht über den hebräischen Sinn hinaus, während die Fußnote die Weihe- und Vernichtungsdimension von חֵרֶם absichert.
