source:
  edition: WLC
  text: וְ/הָיָה֙ הַ/נִּלְכָּ֣ד בַּ/חֵ֔רֶם יִשָּׂרֵ֣ף בָּ/אֵ֔שׁ אֹת֖/וֹ וְ/אֶת כָּל אֲשֶׁר ל֑/וֹ כִּ֤י עָבַר֙ אֶת בְּרִ֣ית יְהוָ֔ה וְ/כִֽי עָשָׂ֥ה נְבָלָ֖ה בְּ/יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/015.yaml
  text: And the one who is taken with the devoted thing shall be burned with fire[a], he and all that belongs to him, because he has transgressed the covenant of Yahweh and because he has done an outrageous thing in Israel.
translation:
  language: de
  text: Wer aber mit dem Banngegenstand ergriffen wird, soll im Feuer verbrannt werden – er und alles, was ihm gehört –, denn er hat den Bund Jahwes übertreten und eine Schandtat in Israel begangen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנִּלְכָּד
  choice: wer … ermittelt wird
  rationale: Das passive Partizip von לכד bezeichnet hier die Person, die durch das Losverfahren festgestellt wird. „Ermittelt wird“ gibt den gerichtlichen Zusammenhang natürlich wieder, ohne an eine militärische Gefangennahme denken zu lassen.
- source_word: בַּחֵרֶם
  choice: mit dem Geweihten
  rationale: חֵרֶם bezeichnet hier das unter Bann gestellte und zur Vernichtung bestimmte Gut. „Das Geweihte“ bewahrt den Gedanken seiner Aussonderung für Gott; die Fußnote erläutert den damit verbundenen Vernichtungsbann.
- source_word: יִשָּׂרֵף בָּאֵשׁ
  choice: soll im Feuer verbrannt werden
  rationale: Die passive Verbform und die Feuerangabe werden direkt und in natürlichem Deutsch wiedergegeben.
- source_word: אֹתוֹ וְאֶת כָּל אֲשֶׁר לוֹ
  choice: er und alles, was ihm gehört
  rationale: Die nachgestellte Erläuterung schließt den Täter und seinen gesamten Besitz ein, ohne ungenannte Einzelheiten festzulegen.
- source_word: עָבַר אֶת בְּרִית יְהוָה
  choice: hat den Bund Jahwes übertreten
  rationale: עבר mit בְּרִית beschreibt das Überschreiten beziehungsweise Verletzen der Bundesordnung. „Übertreten“ erhält die rechtlich-bundestheologische Bildlichkeit.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „HERR“ ersetzt.
- source_word: נְבָלָה
  choice: eine Schandtat
  rationale: נְבָלָה bezeichnet eine moralisch empörende und entehrende Tat, nicht bloß Unvernunft. „Schandtat“ ist prägnant, würdig und im Deutschen idiomatisch.
- source_word: בְּיִשְׂרָאֵל
  choice: in Israel
  rationale: 'Die Präposition wird lokal beziehungsweise gemeinschaftsbezogen verstanden: Die Tat geschah innerhalb Israels als Bundesgemeinschaft.'
theological_decisions:
- issue: Wiedergabe von חֵרֶם im Zusammenhang des Bundesgerichts
  choice: das Geweihte
  alternative: das Gebannte; das zur Vernichtung Geweihte; das Verfluchte
  rationale: Das Wort bezeichnet etwas, das Gott unwiderruflich zugeordnet und dem gewöhnlichen Gebrauch entzogen ist, hier zur Vernichtung. „Das Geweihte“ hält diesen Ausgangspunkt fest; die Fußnote wahrt die Spannung zum Bann- und Gerichtsgedanken.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Die Wiedergabe als „Jahwe“ bewahrt den persönlichen Gottesnamen im Haupttext.
- issue: Umfang von „alles, was ihm gehört“
  choice: breite, nicht näher bestimmte Formulierung
  alternative: ausdrückliche Beschränkung auf seinen Besitz oder ausdrücklicher Einschluss seiner Angehörigen
  rationale: Der hebräische Wortlaut ist umfassend, benennt hier aber nicht einzeln, wer oder was dazugehört. Die Übersetzung präzisiert den Umfang daher nicht über den Text hinaus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe an der feierlich-rechtlichen Struktur des Hebräischen, wird aber durch Gedankenstriche lesbar gegliedert. „Schandtat“ vermittelt die starke moralische Wertung ohne umgangssprachlich zu wirken.
