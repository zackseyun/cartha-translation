  source_fidelity: 'Der Entwurf gibt Satzbau, Gerichtsfolge, Bundesverstoß und die starke ethische Wertung von נְבָלָה insgesamt zuverlässig wieder. „Jahwe“, „den Bund Jahwes übertreten“ und „eine Schandtat in Israel begangen“ sind treffend. Bei הַנִּלְכָּד בַּחֵרֶם ist „mit dem Geweihten ermittelt wird“ jedoch semantisch und idiomatisch nicht hinreichend klar: Das substantivierte „Geweihte“ bezeichnet im Deutschen nicht eindeutig einen Banngegenstand, und die Verbindung mit „ermittelt“ ist unnatürlich.'
  naturalness: Die Formulierung ist ansonsten modernes, würdiges Standarddeutsch. „Mit dem Banngegenstand ergriffen wird“ ist im rechtlich-gerichtlichen Register klarer und bewahrt zugleich die knappe assoziative Formulierung des Hebräischen, ohne den Vorgang des Losentscheids auszudeuten.
  terminology: „Banngegenstand“ bezeichnet חֵרֶם hier präziser als „das Geweihte“, da es die Entziehung vom gewöhnlichen Gebrauch und die Bestimmung zur Vernichtung erkennen lässt. Die Fußnote wahrt die Dimension der Weihe für Gott und vermeidet die missverständliche Gleichsetzung mit bloßem Fluch. „Jahwe“ ist als Wiedergabe des Tetragramms konsistent.
