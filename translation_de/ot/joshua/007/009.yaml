source:
  edition: WLC
  text: וְ/יִשְׁמְע֣וּ הַֽ/כְּנַעֲנִ֗י וְ/כֹל֙ יֹשְׁבֵ֣י הָ/אָ֔רֶץ וְ/נָסַ֣בּוּ עָלֵ֔י/נוּ וְ/הִכְרִ֥יתוּ אֶת שְׁמֵ֖/נוּ מִן הָ/אָ֑רֶץ וּ/מַֽה תַּעֲשֵׂ֖ה לְ/שִׁמְ/ךָ֥ הַ/גָּדֽוֹל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/009.yaml
  text: For the Canaanites and all the inhabitants of the land will hear[a], and they will surround us and cut off our name from the earth[b]. And what will you do for your great name?
translation:
  language: de
  text: Denn die Kanaaniter und alle Bewohner des Landes werden davon hören. Sie werden uns umzingeln und unseren Namen von der Erde auslöschen[a]. Was wirst du für deinen großen Namen tun?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung „unseren Namen auslöschen“ bedeutet, ein Volk vollständig zu vernichten, sodass es nicht fortbesteht und nicht mehr in Erinnerung bleibt.
    reason: cultural_note
  - marker: b
    text: 'Oder: „Was wirst du um deines großen Namens willen tun?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִשְׁמְעוּ
  choice: werden davon hören
  rationale: Das Qal-Imperfekt bezeichnet hier die erwartete Folge der Niederlage; „davon“ macht im Deutschen den kontextuell vorausgesetzten Inhalt des Hörens natürlich deutlich.
- source_word: הַכְּנַעֲנִי
  choice: die Kanaaniter
  rationale: Die morphologisch singularische Volksbezeichnung ist kollektiv gebraucht und wird im Deutschen idiomatisch im Plural wiedergegeben.
- source_word: וְכֹל יֹשְׁבֵי הָאָרֶץ
  choice: und alle Bewohner des Landes
  rationale: יֹשְׁבֵי ist substantivisch gebraucht; הָאָרֶץ bezeichnet im Kontext das umliegende Land, nicht die gesamte Welt.
- source_word: וְנָסַבּוּ עָלֵינוּ
  choice: Sie werden uns umzingeln
  rationale: נסב mit עַל bezeichnet hier das militärische Umringen oder Einkreisen.
- source_word: וְהִכְרִיתוּ אֶת שְׁמֵנוּ מִן הָאָרֶץ
  choice: und unseren Namen von der Erde auslöschen
  rationale: Die Formulierung bewahrt das hebräische Bild vom „Namen“, während „auslöschen“ die gemeinte Vernichtung eines Volkes und seines Fortbestehens verständlich ausdrückt.
- source_word: וּמַה תַּעֲשֵׂה
  choice: Was wirst du dann tun?
  rationale: Das Imperfekt wird als direkte Frage nach Gottes künftigem Handeln wiedergegeben; „dann“ verdeutlicht den Folgezusammenhang, ohne die Aussage inhaltlich festzulegen.
- source_word: לְשִׁמְךָ הַגָּדוֹל
  choice: für deinen großen Namen
  rationale: Die Wiedergabe wahrt die knappe und mehrdeutige Konstruktion mit ל und lässt den Bezug auf Gottes Ehre und öffentliches Ansehen erkennen.
theological_decisions:
- issue: Bedeutung von „deinem großen Namen“ in Josuas Bitte
  choice: Appell an Gottes öffentliches Ansehen, das mit Israels Schicksal verbunden ist
  alternative: Eine ausschließlich persönliche Sorge um Gottes Namen ohne bundesgeschichtlichen Bezug
  rationale: Im Zusammenhang befürchtet Josua, Israels Vernichtung werde sich vor den umliegenden Völkern auf den HERRN auswirken. Die Übersetzung lässt diesen Zusammenhang erkennen, ohne ihn erläuternd in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung erhöht die Verständlichkeit, ohne den logischen Zusammenhang aufzulösen. Das hebräische Bild des Namens bleibt erhalten; seine idiomatische Bedeutung wird in einer Fußnote erklärt.
