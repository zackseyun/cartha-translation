base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/022.yaml
  text: So Joshua sent messengers[a], and they ran to the tent; and behold, it was hidden in his tent, with the silver underneath it.
translation:
  language: de
  text: 'Da sandte Josua Boten aus, und sie liefen zum Zelt. Und siehe: Der Mantel war in seinem Zelt versteckt, und das Silber lag darunter.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: schickte … los
  rationale: Gibt שׁלח im erzählenden Zusammenhang natürlich und zugleich präzise wieder.
- source_word: מַלְאָכִים
  choice: Boten
  rationale: Bezeichnet hier menschliche Abgesandte Josuas, nicht Engel.
- source_word: וַיָּרֻצוּ
  choice: Sie liefen
  rationale: Bewahrt die konkrete und lebhafte Bedeutung von רוץ, ohne sie zu dem bloßen Eilen abzuschwächen.
- source_word: הָאֹהֱלָה
  choice: zum Zelt
  rationale: Die Richtungsendung bezeichnet die Bewegung zum Zelt; der bestimmte Artikel wird beibehalten.
- source_word: וְהִנֵּה
  choice: und siehe
  rationale: Bewahrt das dramatische Entdeckungsmoment der hebräischen Erzählpartikel in würdigem Bibeldeutsch.
- source_word: טְמוּנָה
  choice: Es war … versteckt
  rationale: Die feminine Singularform verweist im Zusammenhang am ehesten auf den zuvor genannten Mantel; „versteckt“ vermeidet die speziellere Deutung „vergraben“.
- source_word: בְּאָהֳלוֹ
  choice: in seinem Zelt
  rationale: Direkte Wiedergabe der Ortsangabe mit männlichem Singularsuffix, das sich auf Achan bezieht.
- source_word: וְהַכֶּסֶף
  choice: das Silber
  rationale: Die knappe Koordination des Hebräischen bleibt erhalten, ohne das Verhältnis durch „zusammen mit“ stärker auszudeuten.
- source_word: תַּחְתֶּיהָ
  choice: darunter
  rationale: Gibt die Lage des Silbers unter dem feminin bezeichneten Gegenstand knapp wieder; im Kontext ist dies wohl der Mantel aus Vers 21.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Und siehe“ wurde wegen der markierten dramatischen Funktion von וְהִנֵּה beibehalten. Der knappe Schluss wahrt die syntaktische Offenheit des Hebräischen; die Fußnote nennt die mögliche explizite Satzfassung.
