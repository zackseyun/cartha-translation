- from: 'Da schickte Josua Boten los. Sie liefen zum Zelt, und siehe: Es war in seinem Zelt versteckt, das Silber darunter.[a]'
  to: 'Da sandte Josua Boten aus, und sie liefen zum Zelt. Und siehe: Der Mantel war in seinem Zelt versteckt, und das Silber lag darunter.'
  rationale: Die Revision verdeutlicht den vom hebräischen Femininum signalisierten Rückbezug auf den Mantel aus V. 21 und gibt die anschließende Koordination mit „und das Silber“ als vollständigen deutschen Satz wieder. Dadurch wird weder die Reihenfolge noch die inhaltliche Aussage verändert; eine Alternativfußnote ist für die deutsche Fassung nicht erforderlich.
