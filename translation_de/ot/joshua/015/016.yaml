base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/016.yaml
  text: And Caleb said[a], “Whoever strikes Kiriath-sepher and captures it, I will give him Achsah my daughter as a wife.”
translation:
  language: de
  text: 'Und Kaleb sagte[a]: »Wer Kirjat-Sefer angreift und einnimmt, dem gebe ich meine Tochter Achsa zur Frau.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Den, der Kirjat-Sefer angreift und einnimmt, gebe ich meine Tochter Achsa zur Frau.«'
    reason: Die hebräische Relativkonstruktion kann im Deutschen auch durch einen vorangestellten substantivierten Relativsatz wiedergegeben werden; die Aussage bleibt unverändert.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und … sagte
  rationale: Die Wayyiqtol-Form führt das nächste Ereignis im hebräischen Erzählfluss ein; „Und … sagte“ bewahrt diesen Anschluss, ohne eine stärkere zeitliche oder folgernde Nuance einzutragen.
- source_word: כָּלֵב
  choice: Kaleb
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: אֲשֶׁר
  choice: wer
  rationale: Das Relativwort leitet hier eine unbestimmte, offene Bedingung ein. „Wer“ ist im modernen Deutschen natürlich und entspricht dem Sinn von „derjenige, der“.
- source_word: יַכֶּה
  choice: angreift
  rationale: Das Hifil von נכה bezeichnet hier eine militärische Handlung gegen die Stadt. „Angreift“ gibt den kontextuellen Sinn natürlicher wieder als das im Deutschen missverständliche „schlägt“, ohne bereits den Erfolg auszudrücken, der erst mit וּלְכָדָהּ genannt wird.
- source_word: אֶת קִרְיַת סֵפֶר
  choice: Kirjat-Sefer
  rationale: Der Ortsname wird nach geläufiger deutscher biblischer Transliterationsweise wiedergegeben; קִרְיַת ist Bestandteil des Eigennamens.
- source_word: וּלְכָדָהּ
  choice: und einnimmt
  rationale: לכד bezeichnet im militärischen Zusammenhang die Einnahme einer Stadt. Das feminine Suffix verweist auf die Stadt und ist im Deutschen durch das transitive Verb mit dem Ortsnamen als Objekt abgedeckt.
- source_word: וְנָתַתִּי לוֹ
  choice: dem gebe ich
  rationale: Die deutsche Korrelativkonstruktion „Wer …, dem …“ gibt den ausdrücklich genannten Empfänger לוֹ klar und idiomatisch wieder; das Präsens kann in einer Zusage zukunftsbezogen gebraucht werden.
- source_word: עַכְסָה
  choice: Achsa
  rationale: Der Personenname wird in einer geläufigen deutschen biblischen Namensform wiedergegeben.
- source_word: בִתִּי
  choice: meine Tochter
  rationale: Die Verwandtschaftsbezeichnung und das Possessivsuffix werden ausdrücklich bewahrt.
- source_word: לְאִשָּׁה
  choice: zur Frau
  rationale: Die feste deutsche Wendung bezeichnet hier die Übergabe zur Eheschließung klar und würdig, ohne zusätzliche Besitzsprache einzutragen.
