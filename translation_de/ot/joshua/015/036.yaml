  yaml_path: translation/ot/joshua/015/036.yaml
  text: 'and Shaaraim[a], and Adithaim, and Gederah, and Gederothaim: fourteen cities with their villages.'
translation:
  language: de
  text: und Schaarajim[a], Aditajim, Gedera und Gederotajim – vierzehn Städte mit ihren Dörfern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die vier in diesem Vers genannten Ortsnamen ergeben für sich genommen nicht die angegebene Zahl von vierzehn Städten. Möglicherweise hängt die Abweichung mit der Textgeschichte des größeren Abschnitts zusammen; der vorliegende hebräische Text wird hier so übersetzt, wie er überliefert ist.
    reason: textual_variant
lexical_decisions:
- source_word: שַׁעֲרַיִם
  choice: Schaarajim
  rationale: Ortsname; in einer im Deutschen gut lesbaren, zugleich hebräisch orientierten Umschrift wiedergegeben.
- source_word: עֲדִיתַיִם
  choice: Aditajim
  rationale: Ortsname; transliteriert, wobei ת hier schlicht mit t wiedergegeben wird.
- source_word: הַגְּדֵרָה
  choice: Gedera
  rationale: Der hebräische Artikel ist Bestandteil der Namensform, wird im natürlichen deutschen Gebrauch eines Ortsnamens jedoch nicht eigens mit „das“ wiedergegeben.
- source_word: גְדֵרֹתָיִם
  choice: Gederotajim
  rationale: Ortsname; direkt und deutsch lesbar transliteriert.
- source_word: עָרִים
  choice: Städte
  rationale: Konventionelle Wiedergabe von עִיר in territorialen Ortslisten.
- source_word: אַרְבַּע עֶשְׂרֵה
  choice: vierzehn
  rationale: Die Kardinalzahl wird idiomatisch auf Deutsch wiedergegeben.
- source_word: חַצְרֵיהֶן
  choice: ihren Dörfern
  rationale: חָצֵר bezeichnet in solchen Gebietslisten gewöhnlich zugehörige kleinere, oft unbefestigte Siedlungen; „Dörfer“ ist hier klar und natürlich.
