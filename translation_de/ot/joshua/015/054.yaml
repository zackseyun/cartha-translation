base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/054.yaml
  text: 'Humtah[a], Kiriath-arba (that is, Hebron)[b], and Zior: nine cities with their settlements.'
translation:
  language: de
  text: 'Humta, Kirjat-Arba – das ist Hebron[a] – und Zior: neun Städte mit ihren Siedlungen[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Wortlaut „Kirjat-Arba, sie ist Hebron“ setzt den älteren Namen Kirjat-Arba mit Hebron gleich.
    reason: cross_reference
  - marker: b
    text: 'Oder: „ihren Dörfern“. Das hebräische Wort kann kleinere, den aufgeführten Städten zugeordnete Siedlungen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֻמְטָה
  choice: Humta
  rationale: Ortsname; in einer im Deutschen gut lesbaren Form transliteriert.
- source_word: קִרְיַת אַרְבַּע
  choice: Kirjat-Arba
  rationale: Der zusammengesetzte Ortsname wird als Eigenname wiedergegeben, nicht etymologisch als „Stadt Arbas“ übersetzt.
- source_word: הִיא חֶבְרוֹן
  choice: das ist Hebron
  rationale: Die hebräische Identifikationsformel setzt Kirjat-Arba ausdrücklich mit Hebron gleich.
- source_word: צִיעֹר
  choice: Zior
  rationale: Ortsname; transliteriert.
- source_word: עָרִים תֵּשַׁע
  choice: neun Städte
  rationale: עָרִים bezeichnet hier die gezählten Hauptorte der Gebietsliste; „Städte“ entspricht dem üblichen biblisch-geografischen Sprachgebrauch.
- source_word: חַצְרֵיהֶן
  choice: ihren Siedlungen
  rationale: Der Ausdruck bezeichnet kleinere, den genannten Städten zugeordnete Wohnplätze; „Siedlungen“ wahrt die begriffliche Breite.
