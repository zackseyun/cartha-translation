  text: וְ/אֶת הַ/יְבוּסִי֙ יוֹשְׁבֵ֣י יְרֽוּשָׁלִַ֔ם לֹֽא יוכלו בְנֵֽי יְהוּדָ֖ה לְ/הֽוֹרִישָׁ֑/ם וַ/יֵּ֨שֶׁב הַ/יְבוּסִ֜י אֶת בְּנֵ֤י יְהוּדָה֙ בִּ/יר֣וּשָׁלִַ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/063.yaml
  text: But the sons of Judah could not dispossess the Jebusites[a], the inhabitants of Jerusalem, so the Jebusites have lived with the sons of Judah in Jerusalem to this day.
translation:
  language: de
  text: Doch die Angehörigen des Stammes Juda konnten die Jebusiter[a], die Bewohner Jerusalems, nicht vertreiben. Die Jebusiter aber wohnen bis auf diesen Tag mit den Angehörigen des Stammes Juda in Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich: „der Jebusiter“; die Einzahl bezeichnet hier das Volk als Ganzes.'
    reason: Die kollektive Singularform des hebräischen Volksnamens wird im Deutschen idiomatisch im Plural wiedergegeben.
lexical_decisions:
- source_word: וְאֶת
  choice: Doch
  rationale: Die Verbindung leitet gegenüber den vorausgehenden Angaben über das Erbgebiet eine einschränkende Ausnahme ein; „Doch“ gibt diesen Kontrast im Deutschen natürlich wieder.
- source_word: הַיְבוּסִי
  choice: die Jebusiter
  rationale: Das morphologisch singularische Volkswort hat kollektive Bedeutung und wird im Deutschen idiomatisch als pluralische Volksbezeichnung wiedergegeben.
- source_word: יוֹשְׁבֵי יְרוּשָׁלַם
  choice: die Bewohner Jerusalems
  rationale: Die Partizipialfügung bezeichnet die Jebusiter appositionell als diejenigen, die Jerusalem bewohnten.
- source_word: לֹא יוכלו
  choice: konnten … nicht
  rationale: Die Form bezeichnet im Erzählzusammenhang die Unfähigkeit der Judäer.
- source_word: בְנֵי יְהוּדָה
  choice: die Judäer
  rationale: Die hebräische Stammesformel „Söhne Judas“ bezeichnet hier kollektiv die Angehörigen des Stammes Juda. „Judäer“ ist in modernem Deutsch natürlicher und vermeidet den irreführenden Eindruck, nur männliche Einzelpersonen seien gemeint.
- source_word: לְהוֹרִישָׁם
  choice: sie … vertreiben
  rationale: Der Hifil von ירשׁ bezeichnet hier, dass die bisherigen Bewohner ihren Besitz und Wohnort verlieren. „Vertreiben“ ist verständlich und passt zum Eroberungskontext, ohne eine erfolgreiche Besitznahme zusätzlich zu behaupten.
- source_word: וַיֵּשֶׁב
  choice: So leben
  rationale: In Verbindung mit „bis auf den heutigen Tag“ beschreibt das Verb einen vom damaligen Geschehen bis zur Erzählergegenwart fortdauernden Zustand.
- source_word: אֶת בְּנֵי יְהוּדָה
  choice: mit den Judäern
  rationale: Die ungewöhnliche Konstruktion mit אֶת wird hier entsprechend Kontext und Sprachgebrauch als Zusammenwohnen verstanden. „Mit“ bewahrt die Aussage der Koexistenz, ohne ihr Verhältnis näher festzulegen.
- source_word: בִּירוּשָׁלַם
  choice: in Jerusalem
  rationale: Direkte lokative Wiedergabe.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: bis auf den heutigen Tag
  rationale: Geläufige, würdige deutsche Wiedergabe der Formel für eine Fortdauer bis in die Zeit des Erzählers.
theological_decisions:
- issue: Wiedergabe von בְנֵי יְהוּדָה
  choice: die Judäer
  alternative: die Söhne Judas / die Angehörigen des Stammes Juda
  rationale: Gemeint ist die Stammesgemeinschaft insgesamt. Die natürliche deutsche Volksbezeichnung gibt den kollektiven Sinn wieder, ohne das Geschlecht einzelner Stammesangehöriger zum Thema zu machen.
- issue: Sinn der Schlussklausel וַיֵּשֶׁב ... אֶת בְּנֵי יְהוּדָה
  choice: die Jebusiter leben mit den Judäern
  alternative: die Jebusiter wohnen unter/neben den Judäern
  rationale: Die hebräische Syntax ist ungewöhnlich, doch der Zusammenhang spricht für gemeinsames beziehungsweise gleichzeitiges Wohnen in Jerusalem. „Mit“ lässt offen, wie das soziale oder politische Verhältnis genau beschaffen war.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Judäer“ gibt die Stammesbezeichnung knapp und natürlich wieder; „bis auf den heutigen Tag“ bewahrt den traditionellen, aber weiterhin verständlichen Klang der Zeitformel.
