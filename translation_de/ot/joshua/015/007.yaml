source:
  edition: WLC
  text: וְ/עָלָ֨ה הַ/גְּב֥וּל דְּבִרָ/ה֮ מֵ/עֵ֣מֶק עָכוֹר֒ וְ/צָפ֜וֹנָ/ה פֹּנֶ֣ה אֶל הַ/גִּלְגָּ֗ל אֲשֶׁר נֹ֨כַח֙ לְ/מַעֲלֵ֣ה אֲדֻמִּ֔ים אֲשֶׁ֥ר מִ/נֶּ֖גֶב לַ/נָּ֑חַל וְ/עָבַ֤ר הַ/גְּבוּל֙ אֶל מֵי עֵ֣ין שֶׁ֔מֶשׁ וְ/הָי֥וּ תֹצְאֹתָ֖י/ו אֶל עֵ֥ין רֹגֵֽל׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/007.yaml
  text: And the border went up to Debir from the Valley of Achor[a], and turned northward toward Gilgal, which is opposite the Ascent of Adummim, which is south of the wadi. Then the border passed on to the waters of En-shemesh[c][b], and its end was at En-rogel.
translation:
  language: de
  text: Die Grenze stieg vom Tal Achor nach Debir hinauf und wandte sich nach Norden in Richtung Gilgal[a], das dem Anstieg von Adummim gegenüberliegt, der südlich des Wadis[b] liegt. Dann verlief die Grenze weiter bis zu den Wassern von En-Schemesch, und ihr Endpunkt lag bei En-Rogel.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bis nach Gilgal“. Das Hebräische kann sowohl die Ausrichtung auf den Ort als auch eine Bewegung zu ihm hin bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Ein Wadi ist ein meist nur zeitweise wasserführendes Bachbett oder eine Schlucht. Das hebräische Wort נחל bezeichnet in solchen Landschaftsbeschreibungen häufig einen derartigen Wasserlauf.
    reason: cultural_note
  - marker: c
    text: 'Wörtlich steht im Hebräischen die Mehrzahl: „ihre Ausgänge“; in Grenzbeschreibungen bezeichnet sie den Endpunkt oder Abschluss der Grenzlinie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָלָה הַגְּבוּל
  choice: Die Grenze stieg … hinauf
  rationale: In Grenzbeschreibungen bezeichnet עלה das Ansteigen im Gelände oder den Verlauf in höher gelegenes Gebiet. Die Formulierung bewahrt den topografischen Sinn und klingt im Deutschen natürlich.
- source_word: דְּבִרָה מֵעֵמֶק עָכוֹר
  choice: vom Tal Achor nach Debir
  rationale: Das Richtungs-ה an Debir bezeichnet eine Bewegung zu diesem Ort hin; עֵמֶק wird transparent mit „Tal“ wiedergegeben.
- source_word: וְצָפוֹנָה פֹּנֶה
  choice: und wandte sich nach Norden
  rationale: פנה mit Richtungsangabe beschreibt hier die Wendung beziehungsweise Ausrichtung der Grenzlinie.
- source_word: אֶל הַגִּלְגָּל
  choice: in Richtung Gilgal
  rationale: אֶל kann sowohl die Ausrichtung auf einen Ort als auch das Gelangen zu ihm bezeichnen. Im Zusammenhang der Wendung der Grenzlinie ist „in Richtung“ passend; die Alternative wird in einer Fußnote erhalten.
- source_word: אֲשֶׁר נֹכַח לְמַעֲלֵה אֲדֻמִּים
  choice: das dem Anstieg von Adummim gegenüberliegt
  rationale: נֹכַח bezeichnet eine Lage gegenüber beziehungsweise vis-à-vis; מַעֲלֵה benennt hier einen topografischen Anstieg oder Aufstieg.
- source_word: אֲשֶׁר מִנֶּגֶב לַנָּחַל
  choice: dieser liegt südlich des Wadis
  rationale: נֶגֶב ist hier die Richtungsangabe „südlich“. Das Relativpronomen bezieht sich am natürlichsten auf den unmittelbar vorausgehenden Anstieg von Adummim. נַחַל bezeichnet in dieser Landschaft häufig ein zeitweise wasserführendes Bachbett oder eine Schlucht.
- source_word: וְעָבַר הַגְּבוּל
  choice: Dann verlief die Grenze weiter
  rationale: עבר beschreibt in Grenzformeln den weiteren Verlauf zum nächsten Grenzpunkt, ohne zwingend eine konkrete Überquerung auszudrücken.
- source_word: אֶל מֵי עֵין שֶׁמֶשׁ
  choice: bis zu den Wassern von En-Schemesch
  rationale: מֵי bedeutet wörtlich „Wasser von“ und bezeichnet hier die Wasserstelle bei En-Schemesch. Der Ortsname wird nach deutscher Lautkonvention transliteriert.
- source_word: וְהָיוּ תֹצְאֹתָיו אֶל עֵין רֹגֵל
  choice: und ihr Endpunkt lag bei En-Rogel
  rationale: תֹצְאוֹת bezeichnet in Grenzbeschreibungen den Ausgang oder Endpunkt einer Grenzlinie. Der idiomatische deutsche Singular gibt die Funktion klar wieder; die hebräische Pluralform wird in der Fußnote vermerkt.
