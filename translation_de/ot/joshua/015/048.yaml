lexical_decisions:
- source_word: וּ/בָ/הָר
  choice: Im Bergland
  rationale: Das hebräische הָר bezeichnet hier kollektiv die judäische Bergregion. Die einleitende Konjunktion וּ setzt die fortlaufende Ortsliste fort, muss im natürlichen Deutschen am Versanfang aber nicht eigens mit „und“ wiedergegeben werden.
- source_word: שָׁמִיר
  choice: Schamir
  rationale: Der Ortsname wird nach geläufiger deutscher Bibeltransliteration wiedergegeben.
- source_word: וְ/יַתִּיר
  choice: Jattir
  rationale: Der Ortsname wird transliteriert; die vorangestellte Konjunktion וְ wird durch die deutsche Aufzählungsstruktur ausgedrückt.
- source_word: וְ/שׂוֹכֹה
  choice: Socho
  rationale: Der Ortsname wird in einer im Deutschen geläufigen biblischen Form wiedergegeben; die vorangestellte Konjunktion וְ erscheint als „und“.
