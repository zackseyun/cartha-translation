  text: הַ/קַּ֖יִן גִּבְעָ֣ה וְ/תִמְנָ֑ה עָרִ֥ים עֶ֖שֶׂר וְ/חַצְרֵי/הֶֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/057.yaml
  text: 'Hak-kain[a], Gibeah, and Timnah: ten cities with their settlements.'
translation:
  language: de
  text: 'Ha-Kajin, Gibea und Timna: zehn Städte mit ihren Dörfern.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַקַּיִן
  choice: Ha-Kajin
  rationale: Der Ortsname wird in einer dem Hebräischen angenäherten deutschen Umschrift wiedergegeben; der vorangestellte Artikel bleibt als Bestandteil der Namensform erhalten.
- source_word: גִּבְעָה
  choice: Gibea
  rationale: In der Ortsliste ist das Wort als Eigenname zu verstehen und nicht mit seiner Grundbedeutung »Hügel« zu übersetzen; »Gibea« ist die im Deutschen geläufige Form.
- source_word: תִמְנָה
  choice: Timna
  rationale: Der Ortsname wird in der üblichen deutschen Form wiedergegeben.
- source_word: עָרִים עֶשֶׂר
  choice: zehn Städte
  rationale: Dies entspricht der üblichen Zählformel in den Gebietslisten und gibt עָרִים angemessen wieder.
- source_word: חַצְרֵיהֶן
  choice: ihren Dörfern
  rationale: חָצֵר bezeichnet hier kleinere, den genannten Städten zugeordnete Siedlungen; »Dörfer« ist eine natürliche und verständliche deutsche Wiedergabe.
