  text: וְ֠/יָצָא אֶל מִ/נֶּ֜גֶב לְ/מַעֲלֵ֤ה עַקְרַבִּים֙ וְ/עָ֣בַר צִ֔נָ/ה וְ/עָלָ֥ה מִ/נֶּ֖גֶב לְ/קָדֵ֣שׁ בַּרְנֵ֑עַ וְ/עָבַ֤ר חֶצְרוֹן֙ וְ/עָלָ֣ה אַדָּ֔רָ/ה וְ/נָסַ֖ב הַ/קַּרְקָֽעָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/003.yaml
  text: Then it went out southward to the ascent of Akrabbim[a], crossed over to Zin, went up from the south to Kadesh-barnea, crossed over Hezron, went up to Addar[b], and turned toward Karka.
translation:
  language: de
  text: Dann verlief die Grenze nach Süden zum Anstieg von Akrabbim[a], zog weiter nach Zin, stieg von Süden her nach Kadesch-Barnea hinauf, führte über Hezron hinweg, stieg nach Addar hinauf und bog nach Karka[b] ab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name Akrabbim bedeutet wahrscheinlich »Skorpione«; da er hier als Ortsname dient, wird er nicht übersetzt.
    reason: lexical_alternative
  - marker: b
    text: Die genaue Wiedergabe des Ortsnamens ist unsicher; auch »Karkaa« ist möglich.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָצָא
  choice: Dann verlief die Grenze
  rationale: In einer Grenzbeschreibung bezeichnet das Verb den weiteren Verlauf der Grenzlinie. Die ausdrückliche Nennung der Grenze macht den deutschen Satz ohne den vorausgehenden Kontext verständlich.
- source_word: אֶל מִנֶּגֶב
  choice: nach Süden
  rationale: Die Präposition אֶל und מִנֶּגֶב geben hier die Bewegungsrichtung nach Süden an.
- source_word: לְמַעֲלֵה עַקְרַבִּים
  choice: zum Anstieg von Akrabbim
  rationale: מַעֲלֶה bezeichnet einen Anstieg oder einen ansteigenden Weg. Akrabbim wird als Ortsname transliteriert; seine Bedeutung wird in einer Fußnote genannt.
- source_word: וְעָבַר צִנָה
  choice: zog weiter nach Zin
  rationale: עבר beschreibt in Grenzformeln das Weiterziehen der Linie; die Richtungsendung an צִנָה weist auf Zin als Zielrichtung.
- source_word: וְעָלָה מִנֶּגֶב לְקָדֵשׁ בַּרְנֵעַ
  choice: stieg von Süden her nach Kadesch-Barnea hinauf
  rationale: Die Wiedergabe bewahrt sowohl die Aufwärtsbewegung von עלה als auch den Ausgangspunkt beziehungsweise die Bewegungsrichtung מִנֶּגֶב, ohne die Formulierung zu einer bloßen Lageangabe südlich des Ortes umzudeuten.
- source_word: וְעָבַר חֶצְרוֹן
  choice: führte an Hezron vorbei
  rationale: Ohne Richtungsendung beim Ortsnamen liegt in der Grenzbeschreibung ein Vorbeiziehen an Hezron nahe.
- source_word: וְעָלָה אַדָּרָה
  choice: stieg nach Addar hinauf
  rationale: עלה bezeichnet die Aufwärtsbewegung; die Richtungsendung am Ortsnamen wird mit „nach“ wiedergegeben.
- source_word: וְנָסַב הַקַּרְקָעָה
  choice: bog nach Karka ab
  rationale: נסב bezeichnet die Richtungsänderung der Grenzlinie; die Richtungsendung am Ortsnamen wird mit „nach“ ausgedrückt.
