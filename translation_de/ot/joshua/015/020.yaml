  text: זֹ֗את נַחֲלַ֛ת מַטֵּ֥ה בְנֵי יְהוּדָ֖ה לְ/מִשְׁפְּחֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/020.yaml
  text: This was the inheritance of the tribe of the sons of Judah according to their clans[a].
translation:
  language: de
  text: Das ist der Erbbesitz des Stammes der Nachkommen Judas, nach ihren Sippen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Das war der Erbbesitz des Stammes der Nachkommen Judas, nach ihren Sippen.“'
    reason: Der hebräische Nominalsatz enthält keine ausdrückliche Zeitform; je nach Einordnung der zusammenfassenden Aussage sind im Deutschen Präsens oder Präteritum möglich.
lexical_decisions:
- source_word: זֹאת
  choice: Das ist
  rationale: Das feminine Demonstrativpronomen weist zusammenfassend auf das zuvor beschriebene Gebiet zurück. Da der hebräische Nominalsatz keine ausdrückliche Zeitform enthält, gibt das deutsche Präsens die Form am unmittelbarsten wieder.
- source_word: נַחֲלַת
  choice: der Erbbesitz
  rationale: נַחֲלָה bezeichnet hier das als bleibenden Besitz zugeteilte Land. „Erbbesitz“ bewahrt sowohl den Gedanken des Erbes als auch den konkreten Landbesitz.
- source_word: מַטֵּה
  choice: des Stammes
  rationale: מַטֶּה ist in diesem Zusammenhang die übliche Bezeichnung für einen Stamm, nicht für einen Stab.
- source_word: בְנֵי יְהוּדָה
  choice: der Nachkommen Judas
  rationale: Wörtlich steht „Söhne Judas“. „Nachkommen Judas“ gibt die genealogische Stammesbezeichnung im modernen Deutschen natürlich und inklusiv wieder, ohne den Sinn auf unmittelbare männliche Söhne zu verengen.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחָה bezeichnet innerhalb des Stammes größere Familien- bzw. Sippenverbände; „Sippen“ ist in diesem Landverteilungskontext präziser als „Familien“. Die Präposition לְ drückt hier die Gliederung beziehungsweise Verteilung nach diesen Gruppen aus.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Erbbesitz“ erhält die landbezogene und erbrechtliche Bedeutung; „Sippen“ bezeichnet die Untergliederungen des Stammes. Das Komma vor „nach ihren Sippen“ macht den Bezug auf die gegliederte Zuteilung deutlich.
