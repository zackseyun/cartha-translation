lexical_decisions:
- source_word: צְנָן
  choice: Zenan
  rationale: Ortsname in der Aufzählung judäischer Städte; als Eigenname transliteriert statt übersetzt.
- source_word: חֲדָשָׁה
  choice: Hadascha
  rationale: Obwohl das zugrunde liegende Wort „neu“ bedeuten kann, bezeichnet es hier eindeutig einen Ort; die eingedeutschte Transliteration bewahrt den Namenscharakter.
- source_word: מִגְדַּל גָּד
  choice: Migdal-Gad
  rationale: Zusammengesetzter Ortsname; die Transliteration bewahrt ihn als Toponym, während der Bindestrich seine beiden Bestandteile sichtbar macht.
- source_word: וַ / וּ
  choice: und
  rationale: Die Konjunktionen verbinden die letzten Ortsnamen der Aufzählung; im Deutschen genügt ein „und“ vor dem letzten Glied.
