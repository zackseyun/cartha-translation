  yaml_path: translation/ot/joshua/015/046.yaml
  text: from Ekron westward, all that is beside Ashdod, and their villages.
translation:
  language: de
  text: von Ekron westwärts, alles, was bei Aschdod liegt, samt ihren Dörfern.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָיָמָּה
  choice: westwärts
  rationale: Wörtlich „meerwärts“; im geografischen Zusammenhang bezeichnet die Richtung zum Mittelmeer den Westen.
- source_word: עַל יַד
  choice: bei
  rationale: Die feste Wendung bedeutet hier räumlich „bei/in der Nähe von“; eine wörtliche Wiedergabe mit „an der Hand/Seite“ wäre im Deutschen unnatürlich.
- source_word: וְחַצְרֵיהֶן
  choice: samt ihren Dörfern
  rationale: חֲצֵרִים bezeichnet in Ortslisten abhängige, meist nicht befestigte Siedlungen. „samt“ gibt die Zuordnung knapp und natürlich wieder; das feminine Pluralsuffix bleibt mit „ihren“ erhalten.
theological_decisions: []
translation_notes:
  register: Knappe, listenartige Fortsetzung des vorangehenden Gebietsverzeichnisses. Modernes, würdevolles Standarddeutsch; die grammatische Spannung zwischen dem singularischen כֹּל אֲשֶׁר und dem pluralischen femininen Suffix in חַצְרֵיהֶן wird nicht durch eine ausdrücklich benannte Bezugsgröße aufgelöst.
