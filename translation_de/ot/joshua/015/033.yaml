lexical_decisions:
- source_word: בַּשְּׁפֵלָה
  choice: Im Hügelland
  rationale: Das hebräische Wort bezeichnet hier die Schefela, das westlich des judäischen Berglands gelegene niedrige Hügelland. „Im Hügelland“ ist für heutige Leser verständlich und gibt die regionale Einordnung treffender wieder als das allgemeinere „im Tiefland“.
- source_word: אֶשְׁתָּאֹל
  choice: Eschtaol
  rationale: Der Ortsname wird in einer im Deutschen geläufigen, eng am Hebräischen orientierten Form wiedergegeben.
- source_word: וְצָרְעָה
  choice: Zora
  rationale: Der Ortsname wird nach gebräuchlicher deutscher Bibeltradition transliteriert; das Präfix וְ verbindet ihn mit der Aufzählung.
- source_word: וְאַשְׁנָה
  choice: und Aschna
  rationale: Der Ortsname wird lautnah ins Deutsche übertragen; die vorangestellte Konjunktion וְ wird als „und“ wiedergegeben.
