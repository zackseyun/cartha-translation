lexical_decisions:
- source_word: גֹשֶׁן
  choice: Goschen
  rationale: Der Ortsname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: חֹלֹן
  choice: Holon
  rationale: Transliteration des hebräischen Ortsnamens in einer für modernes Deutsch gut lesbaren Form.
- source_word: גִלֹה
  choice: Gilo
  rationale: Transliteration des hebräischen Ortsnamens; die Endung ה wird hier nicht durch ein zusätzliches h wiedergegeben.
- source_word: עָרִים
  choice: Städte
  rationale: Die übliche Wiedergabe für urbane Siedlungen in den Gebietslisten des Josuabuches.
- source_word: אַחַת עֶשְׂרֵה
  choice: elf
  rationale: Idiominatische deutsche Wiedergabe der Kardinalzahl.
- source_word: חַצְרֵיהֶן
  choice: Dörfer
  rationale: Bezeichnet die zugehörigen kleineren, wohl unbefestigten Siedlungen; „Dörfer“ ist hier natürlich und traditionsgemäß.
