source:
  edition: WLC
  text: קִרְיַת בַּ֗עַל הִ֛יא קִרְיַ֥ת יְעָרִ֖ים וְ/הָֽ/רַבָּ֑ה עָרִ֥ים שְׁתַּ֖יִם וְ/חַצְרֵי/הֶֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/060.yaml
  text: 'Kiriath-baal (that is[a], Kiriath-jearim), and Rabbah: two cities with their settlements.'
translation:
  language: de
  text: 'Kirjat-Baal, das ist Kirjat-Jearim, und Rabba: zwei Städte mit ihren Dörfern.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קִרְיַת בַּעַל
  choice: Kirjat-Baal
  rationale: Der Ortsname wird nach gebräuchlicher deutscher Bibeltradition transliteriert und nicht als »Stadt des Baal« übersetzt.
- source_word: הִיא
  choice: das ist
  rationale: Das Pronomen identifiziert den zuvor genannten Ort erklärend mit seinem anderen Namen.
- source_word: קִרְיַת יְעָרִים
  choice: Kirjat-Jearim
  rationale: Der alternative Ortsname wird transliteriert; die Bindestrichschreibung macht seine Einheit als Eigenname deutlich.
- source_word: הָרַבָּה
  choice: Rabba
  rationale: Der Ortsname wird in der im Deutschen üblichen Form ohne Wiedergabe des hebräischen Artikels übernommen.
- source_word: עָרִים שְׁתַּיִם
  choice: zwei Städte
  rationale: Die Wendung fasst die beiden genannten Hauptorte zusammen; »Städte« entspricht der üblichen Wiedergabe von עָרִים in Gebietslisten.
- source_word: חַצְרֵיהֶן
  choice: ihren Dörfern
  rationale: חָצֵר bezeichnet hier die zu den genannten Städten gehörenden, abhängigen kleineren Siedlungen; »Dörfer« ist dafür natürliches modernes Deutsch.
theological_decisions: []
