id: JOS.15.8
reference: Joshua 15:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/עָלָ֨ה הַ/גְּב֜וּל גֵּ֣י בֶן הִנֹּ֗ם אֶל כֶּ֤תֶף הַ/יְבוּסִי֙ מִ/נֶּ֔גֶב הִ֖יא יְרֽוּשָׁלִָ֑ם וְ/עָלָ֨ה הַ/גְּב֜וּל אֶל רֹ֣אשׁ הָ/הָ֗ר אֲ֠שֶׁר עַל פְּנֵ֤י גֵֽי הִנֹּם֙ יָ֔מָּ/ה אֲשֶׁ֛ר בִּ/קְצֵ֥ה עֵֽמֶק רְפָאִ֖ים צָפֹֽנָ/ה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/008.yaml
  text: Then the border went up by the Valley of Ben-hinnom to the slope of the Jebusite on the south (that is[a], Jerusalem), and the border went up to the top of the mountain that lies west of the Valley of Hinnom[c][b], at the northern end of the Valley of Rephaim.
translation:
  language: de
  text: Dann stieg die Grenze das Tal Ben-Hinnom hinauf zur Südseite der Jebusiterstadt – das ist Jerusalem – und weiter zum Gipfel des Berges, der westlich[a] des Tals Hinnom liegt, am Nordende des Tals Refaïm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »meerwärts«; gemeint ist »nach Westen« beziehungsweise »westlich«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָלָה
  choice: Dann stieg ... hinauf / und weiter
  rationale: Das Qal-Perfekt beschreibt in dieser Grenzbeschreibung die fortschreitende Bewegung der Grenzlinie; die deutsche Formulierung gibt Abfolge und Höhenbewegung natürlich wieder.
- source_word: הַגְּבוּל
  choice: die Grenze
  rationale: Im Zusammenhang der Gebietsverteilung bezeichnet גְּבוּל die Grenzlinie.
- source_word: גֵּי בֶן הִנֹּם
  choice: das Tal Ben-Hinnom
  rationale: Der Eigenname bleibt als Ortsbezeichnung erhalten, statt wörtlich als »Tal des Sohnes Hinnoms« aufgelöst zu werden.
- source_word: כֶּתֶף הַיְבוּסִי מִנֶּגֶב
  choice: zum Südhang der Jebusiterstadt
  rationale: כֶּתֶף bedeutet wörtlich »Schulter«, bezeichnet topografisch aber einen Hang oder eine Bergflanke. הַיְבוּסִי ist hier als jebusitischer Ort beziehungsweise jebusitische Stadt verstanden; מִנֶּגֶב kennzeichnet deren Südseite.
- source_word: הִיא יְרוּשָׁלִָם
  choice: das ist Jerusalem
  rationale: Die hebräische Identifikationsformel wird ausdrücklich und knapp wiedergegeben.
- source_word: רֹאשׁ הָהָר
  choice: Gipfel des Berges
  rationale: Die Wendung bezeichnet den höchsten Punkt eines Berges.
- source_word: יָמָּה
  choice: westlich
  rationale: Die Richtungsangabe bedeutet wörtlich »meerwärts«, ist in der geografischen Standardsprache aber die Bezeichnung für Westen.
- source_word: בִּקְצֵה עֵמֶק רְפָאִים צָפֹנָה
  choice: am Nordende der Refaïm-Ebene
  rationale: קָצֶה bezeichnet das Ende beziehungsweise den Rand; צָפֹנָה bestimmt ihn als nördlich. עֵמֶק kann ein breites Tal oder eine Talebene bezeichnen.
theological_decisions: []
