  register: Moderne, würdevolle Standardsprache. Die mehrfachen Orts- und Richtungsangaben bleiben nachvollziehbar, während die hebräischen topografischen Wendungen idiomatisch ins Deutsche übertragen werden. Der Eigenname Refaïm wird nicht gedeutet.
