  text: וּ/גְב֣וּל יָ֔ם הַ/יָּ֥מָּ/ה הַ/גָּד֖וֹל וּ/גְב֑וּל זֶ֠ה גְּב֧וּל בְּנֵֽי יְהוּדָ֛ה סָבִ֖יב לְ/מִשְׁפְּחֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/012.yaml
  text: And the western border was the Great Sea as a border[a]. This was the border of the sons of Judah all around[b], by their clans.
translation:
  language: de
  text: Die Westgrenze war das Große Meer mit seiner Küste[a]. Dies war die Grenze der Söhne Judas ringsum, nach ihren Sippen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »das Große Meer und Grenze«. Gemeint ist das Mittelmeer mit seiner Küstenlinie als Westgrenze Judas.'
    reason: cultural_note
  - marker: b
    text: 'Oder: »nach ihren Familien«. Das hebräische Wort bezeichnet hier die Sippenverbände innerhalb des Stammes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּגְבוּל יָם
  choice: Die Westgrenze
  rationale: In Grenzbeschreibungen bezeichnet יָם idiomatisch die dem Meer zugewandte, westliche Seite; „Westgrenze“ gibt diese Richtungsangabe natürlich und präzise wieder.
- source_word: הַיָּמָּה הַגָּדוֹל
  choice: das Große Meer
  rationale: Die hebräische Wendung bezeichnet das Mittelmeer. Die traditionelle geografische Bezeichnung „das Große Meer“ bewahrt die Ausdrucksweise des Ausgangstextes.
- source_word: וּגְבוּל
  choice: als Grenze
  rationale: Die Wiederholung von גְּבוּל nach „dem Großen Meer“ ist eine knappe appositionelle beziehungsweise prädikative Wendung; „als Grenze“ bildet sie verständlich ab, ohne sie auszulassen.
- source_word: זֶה גְּבוּל
  choice: Das war die Grenze
  rationale: Der hebräische Nominalsatz verlangt im Deutschen eine Kopula. Das Präteritum passt zur erzählenden Beschreibung der Landzuteilung.
- source_word: בְּנֵי יְהוּדָה
  choice: der Söhne Judas
  rationale: Die Übersetzung bewahrt die ausdrücklich familiale, maskuline Stammesbezeichnung des Hebräischen und meint kollektiv die Nachkommen beziehungsweise den Stamm Juda.
- source_word: סָבִיב
  choice: ringsum
  rationale: „Ringsum“ gibt die zusammenfassende Aussage wieder, dass die beschriebenen Grenzlinien das Stammesgebiet umschlossen.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחָה bezeichnet hier die verwandtschaftlichen Untergliederungen des Stammes; „Sippen“ ist in diesem Landzuteilungskontext präziser als das allgemeinere „Familien“.
theological_decisions:
- issue: Geschlechtsspezifische Stammesbezeichnung בְּנֵי יְהוּדָה
  choice: der Söhne Judas
  alternative: der Nachkommen Judas / des Stammes Juda
  rationale: Die wörtlich familiale und grammatisch maskuline Bezeichnung wird bewahrt, ohne eine besondere Lehrposition einzutragen; sie bezeichnet kollektiv die Stammesangehörigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Westgrenze“ erschließt die hebräische Richtungsidiomatik; „Großes Meer“ bewahrt die biblische geografische Benennung. Die Wiederholung „Grenze … als Grenze“ ist wegen der ausdrücklichen Wiederholung im Hebräischen bewusst beibehalten.
