  yaml_path: translation/ot/joshua/015/061.yaml
  text: 'In the wilderness: Beth-arabah[a], Middin[b], and Secacah.'
translation:
  language: de
  text: 'In der Wüste: Bet-Araba, Middin und Sechacha.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּמִּדְבָּר
  choice: In der Wüste
  rationale: Die Präposition ב mit Artikel bezeichnet hier die geografische Teilregion, in der die folgenden Orte liegen. »Wüste« ist im Deutschen für die judäische Wüstenlandschaft natürlich und treffend.
- source_word: בֵּית הָעֲרָבָה
  choice: Bet-Araba
  rationale: Der Ortsname wird nach geläufiger deutscher Bibeltradition transliteriert und nicht als »Haus der Araba« übersetzt.
- source_word: מִדִּין
  choice: Middin
  rationale: Der Ortsname wird möglichst lautnah transliteriert; der verdoppelte Konsonant gibt das Dagesch im hebräischen ד wieder.
- source_word: וּסְכָכָה
  choice: und Sechacha
  rationale: Die Konjunktion ו wird mit »und« wiedergegeben; der Ortsname folgt einer für deutschsprachige Leser gut aussprechbaren, hebräischnahen Umschrift.
theological_decisions: []
translation_notes:
  register: Knappes, würdiges Standarddeutsch entsprechend dem Charakter einer Ortsliste. Der einleitende Gebietsname wird durch einen Doppelpunkt von den Orten abgesetzt.
