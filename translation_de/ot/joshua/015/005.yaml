  yaml_path: translation/ot/joshua/015/005.yaml
  text: And the eastern border was the Salt Sea, as far as the mouth of the Jordan. And the border on the north side was from the tongue of the sea, from the mouth of the Jordan.
translation:
  language: de
  text: Die Ostgrenze war das Salzmeer bis zur Mündung des Jordan. Die Grenze an der Nordseite verlief von der Meereszunge[a], von der Mündung des Jordan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Zunge des Meeres“; eine Bezeichnung für eine zungenförmige geografische Formation am Meer, möglicherweise eine Ausbuchtung oder einen Wasserarm.'
    reason: Erläutert den wörtlichen hebräischen Ausdruck, ohne seine genaue geografische Referenz über die Quellenlage hinaus festzulegen.
lexical_decisions:
- source_word: יָם הַמֶּלַח
  choice: das Salzmeer
  rationale: Die traditionelle und sachlich klare Bezeichnung für das Tote Meer; sie entspricht der hebräischen Benennung wörtlich.
- source_word: קְצֵה הַיַּרְדֵּן
  choice: Mündung des Jordan
  rationale: Wörtlich bezeichnet קצה das Ende bzw. äußerste Ende. Im geografischen Zusammenhang ist das Ende des Jordan dort gemeint, wo er in das Salzmeer mündet; „Mündung“ gibt dies im Deutschen natürlich wieder.
- source_word: לְשׁוֹן הַיָּם
  choice: Bucht des Meeres
  rationale: לשון bedeutet wörtlich „Zunge“ und bezeichnet hier eine zungenförmige Ausbuchtung bzw. einen Wasserarm. „Bucht“ ist für moderne Leser geografisch verständlich, ohne die Lage übermäßig festzulegen.
- source_word: לִפְאַת צָפוֹנָה
  choice: an der Nordseite
  rationale: Gibt die räumliche Angabe idiomatisch und präzise wieder.
- source_word: מִלְּשׁוֹן הַיָּם מִקְצֵה הַיַּרְדֵּן
  choice: an der Bucht des Meeres bei der Mündung des Jordan
  rationale: Das zweimalige מִן markiert den Ausgangspunkt und dessen nähere geografische Bestimmung. „bei“ vermeidet im Deutschen eine schwerfällige Wiederholung von „von“.
