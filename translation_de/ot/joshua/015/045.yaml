lexical_decisions:
- source_word: עֶקְרוֹן
  choice: Ekron
  rationale: Der Eigenname wird in seiner im Deutschen gebräuchlichen biblischen Form wiedergegeben.
- source_word: וּבְנֹתֶיהָ
  choice: mit seinen Tochterstädten
  rationale: Wörtlich steht »und ihre Töchter«. In territorialen Listen bezeichnet בנות die von einer Hauptstadt abhängigen Ortschaften. »Tochterstädte« bewahrt das hebräische Bild und ist im Deutschen verständlich.
- source_word: וַחֲצֵרֶיהָ
  choice: und seinen Dörfern
  rationale: חצרים bezeichnet in Land- und Ortslisten kleinere Siedlungen beziehungsweise Dörfer; »Dörfer« ist hier die klare, natürliche Wiedergabe.
