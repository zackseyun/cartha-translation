base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/006.yaml
  text: Then the border went up to Beth-hoglah[a], and passed north of Beth-arabah; and the border went up to the stone of Bohan son of Reuben.
translation:
  language: de
  text: Dann stieg die Grenze nach Bet-Hogla hinauf, verlief nördlich an Bet-Araba vorbei und stieg zum Stein Bohans, des Sohnes Rubens, hinauf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָלָה
  choice: stieg … hinauf
  rationale: Das Verb bezeichnet in Grenzbeschreibungen den weiteren Verlauf der Grenzlinie, oft mit topografischem Anstieg. „stieg … hinauf“ bewahrt dieses räumliche Bild und klingt im Deutschen natürlich.
- source_word: הַגְּבוּל
  choice: die Grenze
  rationale: Gemeint ist hier die Grenzlinie. „Grenze“ ist im Deutschen präzise und für geografische Beschreibungen geläufig.
- source_word: בֵּית חָגְלָה
  choice: Bet-Hogla
  rationale: Der Ortsname wird nach üblicher deutscher Bibelnamensform transliteriert und nicht übersetzt.
- source_word: וְעָבַר מִצְּפוֹן לְבֵית הָעֲרָבָה
  choice: verlief nördlich an Bet-Araba vorbei
  rationale: Die Wendung beschreibt die Lage der Grenzlinie relativ zum Ort. Diese Formulierung gibt den Sinn idiomatisch wieder, ohne das hebräische מן übermäßig wörtlich abzubilden.
- source_word: אֶבֶן בֹּהַן
  choice: zum Stein Bohans
  rationale: Die Genitivverbindung gibt den hebräischen Status constructus prägnant und eindeutig wieder.
- source_word: בֶּן רְאוּבֵן
  choice: des Sohnes Rubens
  rationale: Die Übersetzung wahrt die ausdrückliche hebräische Abstammungsbezeichnung, statt sie deutend mit „dem Rubeniter“ wiederzugeben.
theological_decisions: []
