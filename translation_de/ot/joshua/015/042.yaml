lexical_decisions:
- source_word: לִבְנָה
  choice: Libna
  rationale: Ortsname in einer Städteliste; nach gängiger deutscher Bibelnamenkonvention transkribiert, nicht übersetzt.
- source_word: וָ/עֶתֶר
  choice: Eter
  rationale: Der Ortsname עֶתֶר wird nach deutscher Laut- und Schreibkonvention als „Eter“ wiedergegeben; das Präfix ו wird in der Aufzählung durch „und“ vor dem letzten Glied vertreten.
- source_word: וְ/עָשָׁן
  choice: und Aschan
  rationale: Das Präfix ו wird mit „und“ wiedergegeben. עָשָׁן ist hier aufgrund der Städteliste ein Ortsname und wird als „Aschan“ transkribiert, nicht als das gleichlautende Substantiv „Rauch“ übersetzt.
