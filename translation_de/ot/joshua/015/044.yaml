base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/044.yaml
  text: 'Keilah[a], Achzib, and Mareshah: nine cities with their villages.'
translation:
  language: de
  text: 'Keïla, Achsib und Marescha: neun Städte mit ihren Dörfern.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihren Siedlungen«. Das hebräische Wort kann ländliche Nebenorte bezeichnen, die zu einer Stadt gehörten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קְעִילָה
  choice: Keïla
  rationale: Ortsname; in einer im Deutschen etablierten bibelsprachlichen Umschrift wiedergegeben. Das Trema macht die getrennte Aussprache der Vokale deutlich.
- source_word: אַכְזִיב
  choice: Achsib
  rationale: Ortsname; nach gängiger deutscher Umschrift mit »ch« für den hebräischen Reibelaut wiedergegeben.
- source_word: מָרֵאשָׁה
  choice: Marescha
  rationale: Ortsname; in deutscher Umschrift mit »sch« für ש wiedergegeben.
- source_word: עָרִים
  choice: Städte
  rationale: Die gewöhnliche Bezeichnung für städtische Orte; in dieser territorialen Liste passt die traditionelle und administrative Wiedergabe »Städte«.
- source_word: תֵּשַׁע
  choice: neun
  rationale: Die Kardinalzahl bezieht sich auf die Städte und wird unmittelbar wiedergegeben.
- source_word: חַצְרֵיהֶן
  choice: ihren Dörfern
  rationale: Bezeichnet zugehörige ländliche bzw. unbefestigte Nebenorte; »Dörfer« ist im modernen Deutsch die natürliche Wiedergabe der Listenformel.
- source_word: וְ
  choice: und / mit
  rationale: Die Konjunktion verbindet die Ortsnamen; vor חַצְרֵיהֶן wird sie in der deutschen idiomatischen Formel »mit ihren Dörfern« wiedergegeben.
