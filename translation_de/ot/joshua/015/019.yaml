  text: וַ/תֹּ֜אמֶר תְּנָ/ה לִּ֣/י בְרָכָ֗ה כִּ֣י אֶ֤רֶץ הַ/נֶּ֨גֶב֙ נְתַתָּ֔/נִי וְ/נָתַתָּ֥ה לִ֖/י גֻּלֹּ֣ת מָ֑יִם וַ/יִּתֶּן לָ֗/הּ אֵ֚ת גֻּלֹּ֣ת עִלִּיּ֔וֹת וְ/אֵ֖ת גֻּלֹּ֥ת תַּחְתִּיּֽוֹת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/019.yaml
  text: She said[a], “Please give me a blessing, since you have given me the land of the Negev[c][b]; give me also springs of water.” So he gave her the upper springs and the lower springs.
translation:
  language: de
  text: 'Sie sagte: „Bitte gib mir einen Segen[a]! Weil du mir Land im Negev[b] gegeben hast, gib mir auch Wasserquellen[c].“ Da gab er ihr die oberen und die unteren Quellen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Gabe“. Das hebräische Wort bedeutet „Segen“, bezeichnet hier aber eine wohltuende Zuwendung.'
    reason: lexical_alternative
  - marker: b
    text: „Negev“ kann auch „Südland“ oder „südliche Region“ bedeuten.
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Wort kann Quellen, Wasserbecken oder Wasserstellen bezeichnen; hier passt „Quellen“ am besten.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְרָכָה
  choice: einen Segen
  rationale: Bewahrt die Grundbedeutung des hebräischen Substantivs und zugleich die Vorstellung einer wohltuenden Zuwendung; im Zusammenhang ist eine konkrete Gabe gemeint.
- source_word: אֶרֶץ הַנֶּגֶב
  choice: Land im Negev
  rationale: נֶגֶב bezeichnet hier am wahrscheinlichsten die geografische Südregion. „Land im Negev“ ist natürliches Deutsch und gibt אֶרֶץ ausdrücklich wieder.
- source_word: גֻּלֹּת מָיִם
  choice: Wasserquellen
  rationale: Die genaue Art der Wasserstellen ist umstritten; „Quellen“ passt zum Grundstückskontext und lässt sich konsequent mit den oberen und unteren Quellen fortführen.
- source_word: תְּנָה לִּי
  choice: Bitte gib mir
  rationale: Der Imperativ wird als höfliche, aber unmittelbare Bitte in natürlichem Deutsch wiedergegeben.
- source_word: כִּי
  choice: doch
  rationale: Im Zusammenhang begründet Achsa ihre Bitte mit dem bereits zugewiesenen trockenen Land. „doch“ bildet diese begründende Bezugnahme idiomatisch ab, ohne eine streng kausale Lesart auszuschließen.
- source_word: וְנָתַתָּה לִי
  choice: gib mir auch
  rationale: '„Auch“ verdeutlicht den additiven Sinn: Zu dem bereits gegebenen Land erbittet sie Wasserstellen.'
- source_word: גֻּלֹּת עִלִּיּוֹת
  choice: die oberen Quellen
  rationale: Gibt die höher gelegenen Wasserstellen wieder und bleibt terminologisch konsistent.
- source_word: גֻּלֹּת תַּחְתִּיּוֹת
  choice: die unteren Quellen
  rationale: Gibt parallel dazu die tiefer gelegenen Wasserstellen wieder.
- source_word: וַיִּתֶּן לָהּ
  choice: Da gab er ihr
  rationale: Gibt die Fortführung der Erzählung und die unmittelbare Reaktion auf ihre Bitte in flüssigem Deutsch wieder.
theological_decisions:
- issue: בְרָכָה als Segenssprache oder konkrete Gabe
  choice: „Segen“ im Haupttext
  alternative: „Geschenk“ oder „Gabe“
  rationale: Die wörtliche Segenssprache bleibt erhalten, während eine Fußnote erklärt, dass hier eine konkrete wohltuende Zuwendung gemeint sein kann. So wird die Bedeutung nicht vorschnell auf einen rein materiellen Begriff verengt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter und gut verständlicher Rede. Die geografische Bezeichnung „Negev“ bleibt erhalten. Die Wiederholung von „Quellen“ bildet die hebräische Parallelität ab; lexikalische Unsicherheiten werden in den Fußnoten offengelegt.
