source:
  edition: WLC
  text: וַֽ/יִּלְכְּדָ֛/הּ עָתְנִיאֵ֥ל בֶּן קְנַ֖ז אֲחִ֣י כָלֵ֑ב וַ/יִּתֶּן ל֛/וֹ אֶת עַכְסָ֥ה בִתּ֖/וֹ לְ/אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/017.yaml
  text: Othniel son of Kenaz[a], Caleb’s brother, captured it[b], and he gave him his daughter Achsah as a wife.
translation:
  language: de
  text: Otniel, der Sohn des Kenas und Bruder Kalebs,[a] nahm sie ein.[b] Darauf gab Kaleb ihm seine Tochter Achsa zur Frau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „Verwandter Kalebs“; das hebräische Wort für „Bruder“ kann mitunter auch einen nahen Verwandten bezeichnen. Der naheliegende Wortsinn ist „Bruder“.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist die im vorherigen Vers genannte Stadt Kirjat-Sefer, auch Debir genannt.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּלְכְּדָהּ
  choice: nahm sie ein
  rationale: לכד bezeichnet hier die militärische Einnahme einer Stadt. Das feminine Pronomen „sie“ nimmt die im vorherigen Vers genannte Stadt Kirjat-Sefer auf.
- source_word: עָתְנִיאֵל
  choice: Otniel
  rationale: Gebräuchliche deutsche Wiedergabe des hebräischen Personennamens.
- source_word: בֶּן קְנַז
  choice: der Sohn von Kenas
  rationale: Die Abstammungsangabe wird klar und in natürlichem modernem Deutsch wiedergegeben.
- source_word: אֲחִי כָלֵב
  choice: dem Bruder Kalebs
  rationale: Die unmittelbar auf Kenas folgende Apposition wird formal als Bezeichnung des Kenas wiedergegeben. אָח bedeutet im einfachen Wortsinn „Bruder“, kann jedoch auch einen weiteren Verwandtschaftsbegriff bezeichnen; diese Möglichkeit wird in einer Fußnote bewahrt.
- source_word: וַיִּתֶּן לוֹ
  choice: Da gab Kaleb ihm
  rationale: 'Die im Hebräischen nur durch Pronomen bezeichneten Beteiligten werden im Deutschen teilweise verdeutlicht: Aus dem Zusammenhang ist Kaleb der Gebende und Otniel der Empfänger.'
- source_word: אֶת עַכְסָה בִתּוֹ
  choice: seine Tochter Achsa
  rationale: Die deutsche Wortfolge gibt den Eigennamen samt Verwandtschaftsbezeichnung natürlich wieder.
- source_word: לְאִשָּׁה
  choice: zur Frau
  rationale: Die geläufige deutsche Wendung bewahrt den Sinn der Übergabe zur Eheschließung, ohne zusätzliche Einzelheiten einzutragen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe hebräische Erzählweise bleibt erhalten; nur der Geber Kaleb wird zur Vermeidung einer schwer verständlichen Pronomenfolge ausdrücklich genannt.
