  text: Maon[a], Karmel, Sif und Jutta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Text besteht ausschließlich aus Ortsnamen in einer Siedlungsliste: „Maon, Karmel, Sif und Jutta“.'
    reason: cultural_note
lexical_decisions:
- source_word: מָעוֹן
  choice: Maon
  rationale: In der Siedlungsliste ist das Wort eindeutig ein Ortsname und wird daher nach der im Deutschen üblichen biblischen Namensform wiedergegeben, nicht als das gleichlautende Gattungswort „Wohnung“ übersetzt.
- source_word: כַּרְמֶל
  choice: Karmel
  rationale: Der Ortsname wird in der etablierten deutschen Schreibweise wiedergegeben; gemeint ist hier die judäische Stadt, nicht eine Übersetzung des gleichlautenden Gattungswortes.
- source_word: וָזִיף
  choice: Sif
  rationale: Die Verbindung besteht aus der Konjunktion ו und dem Ortsnamen זִיף. Die deutsche biblische Namensform „Sif“ wahrt Wiedererkennbarkeit; die Konjunktion wird in der deutschen Aufzählung sinngemäß vertreten.
- source_word: וְיוּטָּה
  choice: und Jutta
  rationale: Die Konjunktion ו wird mit „und“ wiedergegeben; für יוּטָּה steht die im Deutschen gebräuchliche biblische Namensform „Jutta“.
theological_decisions: []
