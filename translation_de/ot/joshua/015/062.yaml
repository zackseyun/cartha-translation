  text: וְ/הַ/נִּבְשָׁ֥ן וְ/עִיר הַ/מֶּ֖לַח וְ/עֵ֣ין גֶּ֑דִי עָרִ֥ים שֵׁ֖שׁ וְ/חַצְרֵי/הֶֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/062.yaml
  text: 'and Nibshan[a], the City of Salt, and En-gedi: six cities with their settlements.'
translation:
  language: de
  text: 'und Nibschan, die Salzstadt und En-Gedi: sechs Städte mit ihren Siedlungen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihren Dörfern«. Das hebräische Wort kann kleinere, von den genannten Städten abhängige Orte bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּבְשָׁן
  choice: Nibschan
  rationale: Der Ortsname wird nach gängiger deutscher Umschrift wiedergegeben; der hebräische Artikel wird nicht eigens abgebildet.
- source_word: עִיר הַמֶּלַח
  choice: die Salzstadt
  rationale: Die transparente hebräische Fügung bedeutet wörtlich »Stadt des Salzes«. »Salzstadt« bewahrt die Bedeutung und klingt als deutscher Ortsname natürlich.
- source_word: עֵין גֶּדִי
  choice: En-Gedi
  rationale: Der etablierte biblische Ortsname wird transliteriert; eine Übersetzung wie »Quelle des Böckchens« wäre im Deutschen ungewohnt.
- source_word: עָרִים שֵׁשׁ
  choice: sechs Städte
  rationale: Die Wendung fasst die genannten Orte zahlenmäßig zusammen. »Städte« entspricht der üblichen Wiedergabe in Gebietslisten, ohne moderne Größenverhältnisse vorauszusetzen.
- source_word: חַצְרֵיהֶן
  choice: ihren Siedlungen
  rationale: Das Wort bezeichnet zugehörige kleinere, häufig unbefestigte Orte. »Siedlungen« ist weit genug, um die genaue Art dieser abhängigen Orte nicht vorschnell festzulegen.
- source_word: וְ
  choice: und
  rationale: Die wiederholte Konjunktion verbindet die Einträge der fortlaufenden Ortsliste; am Versanfang bleibt sie als Anschluss an den vorausgehenden Kontext erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Ortsnamen folgen vertrauter deutscher Bibelschreibung; der listenartige Anschluss des Verses bleibt erhalten.
