  text: וַ/יְהִ֣י בְּ/בוֹאָ֗/הּ וַ/תְּסִיתֵ֨/הוּ֙ לִ/שְׁא֤וֹל מֵֽ/אֵת אָבִ֨י/הָ֙ שָׂדֶ֔ה וַ/תִּצְנַ֖ח מֵ/עַ֣ל הַ/חֲמ֑וֹר וַ/יֹּֽאמֶר לָ֥/הּ כָּלֵ֖ב מַה לָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/018.yaml
  text: And when she came[a], she urged him to ask her father for a field. Then she got down from the donkey, and Caleb said to her[c][b], “What do you want?”
translation:
  language: de
  text: 'Als sie kam, drängte sie ihn[a], ihren Vater um ein Feld zu bitten. Dann stieg sie vom Esel ab[b], und Kaleb fragte sie: »Was möchtest du?«[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb kann auch mit „überredete“ oder, negativer, mit „stiftete ihn an“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Verb kann auf ein rasches oder unvermitteltes Absteigen hindeuten.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „Was ist mit dir?“ Gemeint sein kann: „Was möchtest du?“ oder „Was fehlt dir?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבוֹאָהּ
  choice: Als sie kam
  rationale: Die Konstruktion aus בְּ, Infinitiv und Suffix bildet einen temporalen Nebensatz. Die Übersetzung lässt das im Hebräischen nicht ausdrücklich genannte Ziel ihrer Ankunft offen.
- source_word: וַתְּסִיתֵהוּ
  choice: drängte sie ihn
  rationale: סות kann zum Antreiben, Überreden oder Anstiften bezeichnen. „drängte“ gibt hier die aktive Einflussnahme wieder, ohne dem häuslichen Zusammenhang zwingend eine negative Wertung aufzuerlegen.
- source_word: לִשְׁאוֹל מֵאֵת אָבִיהָ שָׂדֶה
  choice: ihren Vater um ein Feld zu bitten
  rationale: Die deutsche Konstruktion „jemanden um etwas bitten“ gibt die hebräische Verbindung von שאל, מֵאֵת und dem erbetenen Gegenstand natürlich und genau wieder.
- source_word: שָׂדֶה
  choice: ein Feld
  rationale: שׂדה bezeichnet hier unmittelbar ein Feld beziehungsweise ein Stück Land. „ein Feld“ ist die formal naheliegende und im Kontext verständliche Wiedergabe.
- source_word: וַתִּצְנַח מֵעַל הַחֲמוֹר
  choice: Dann stieg sie vom Esel ab
  rationale: צנח bezeichnet hier das Herabsteigen beziehungsweise Absitzen; „stieg ... ab“ ist klares modernes Deutsch. Eine Fußnote bewahrt die mögliche Nuance einer raschen oder unvermittelten Bewegung.
- source_word: מַה לָּךְ
  choice: Was möchtest du?
  rationale: Der hebräische Ausdruck lautet wörtlich „Was ist dir/mit dir?“ und fragt kontextuell nach ihrem Anliegen. „Was möchtest du?“ ist im Deutschen eine natürliche, nicht schroffe Einladung, ihr Begehren auszusprechen.
