- source_word: חֲצַר גַּדָּה
  choice: Hazar-Gadda
  rationale: Ortsname im Gebiet Judas; nach gängiger deutscher Bibelnamenkonvention transliteriert und als zusammengesetzter Name mit Bindestrich geschrieben.
- source_word: חֶשְׁמוֹן
  choice: Heschmon
  rationale: Der Ortsname wird nach deutscher Laut- und Schreibkonvention transliteriert.
- source_word: בֵּית פָּלֶט
  choice: Bet-Pelet
  rationale: Zusammengesetzter Ortsname; בֵּית wird in hebräischen Ortsnamen als „Bet-“ wiedergegeben, statt die Bedeutung „Haus“ in die Gebietsliste einzutragen.
- source_word: וְ / וּ
  choice: und
  rationale: Die Präfixkonjunktion verbindet die Ortsnamen; im Deutschen steht „und“ vor dem letzten Glied der Aufzählung.
