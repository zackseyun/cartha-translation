id: JOS.15.10
reference: Joshua 15:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/נָסַב֩ הַ/גְּב֨וּל מִ/בַּעֲלָ֥ה יָ֨מָּ/ה֙ אֶל הַ֣ר שֵׂעִ֔יר וְ/עָבַ֕ר אֶל כֶּ֧תֶף הַר יְעָרִ֛ים מִ/צָּפ֖וֹנָ/ה הִ֣יא כְסָל֑וֹן וְ/יָרַ֥ד בֵּֽית שֶׁ֖מֶשׁ וְ/עָבַ֥ר תִּמְנָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/010.yaml
  text: Then the border turned from Baalah westward to Mount Seir[a], passed along to the northern slope of Mount Jearim (that is, Chesalon), went down to Beth-shemesh, and passed on to Timnah.
translation:
  language: de
  text: Dann wandte sich die Grenze von Baala nach Westen[a] zum Berg Seïr, verlief weiter an der Nordseite des Berges Jearim – das ist Kesalon –, führte hinab nach Bet-Schemesch und weiter nach Timna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „meerwärts“; im Land Israel ist damit Westen gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַב הַגְּבוּל
  choice: Dann wandte sich die Grenze
  rationale: In einer Grenzbeschreibung bezeichnet das Verb eine Richtungsänderung. „Sich wenden“ ist im Deutschen natürlich und wahrt den kartografischen Sinn.
- source_word: מִבַּעֲלָה
  choice: von Baala
  rationale: Der Ortsname wird in einer dem Hebräischen nahen, im Deutschen gut lesbaren Form wiedergegeben.
- source_word: יָמָּה
  choice: nach Westen
  rationale: Die hebräische Richtungsform bedeutet wörtlich „meerwärts“ und bezeichnet in diesem geografischen Zusammenhang den Westen.
- source_word: אֶל הַר שֵׂעִיר
  choice: zum Berg Seïr
  rationale: הַר kann Berg oder Bergland bezeichnen; in der Abfolge einzelner Grenzpunkte ist „Berg Seïr“ die naheliegende Wiedergabe.
- source_word: וְעָבַר אֶל כֶּתֶף
  choice: verlief weiter an der ... Seite
  rationale: עָבַר beschreibt hier den Verlauf der Grenzlinie; כֶּתֶף bedeutet wörtlich „Schulter“ und bezeichnet topografisch die Seite oder Flanke.
- source_word: הַר יְעָרִים מִצָּפוֹנָה
  choice: an der Nordseite des Berges Jearim
  rationale: Die Verbindung bezeichnet die nördliche Seite beziehungsweise Flanke des Berges. „Nordseite“ ist präzise und idiomatisch.
- source_word: הִיא כְסָלוֹן
  choice: das ist Kesalon
  rationale: Das Pronomen führt eine erklärende Gleichsetzung des zuvor genannten Ortes ein.
- source_word: וְיָרַד בֵּית שֶׁמֶשׁ
  choice: führte hinab nach Bet-Schemesch
  rationale: Das Verb bewahrt die topografische Abwärtsbewegung; da das Subjekt weiterhin die Grenze ist, klingt „führte hinab“ im Deutschen natürlicher als „ging hinab“.
- source_word: וְעָבַר תִּמְנָה
  choice: und weiter nach Timna
  rationale: Die knappe Grenzformel bezeichnet die weitere Erstreckung der Grenze bis beziehungsweise nach Timna.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholten Grenzformeln werden flüssig, aber ohne Verlust der topografischen Angaben wiedergegeben. Ortsnamen sind einheitlich deutsch transliteriert; der erläuternde Einschub zu Kesalon bleibt ausdrücklich erhalten.
