  text: וּ/לְ/כָלֵ֣ב בֶּן יְפֻנֶּ֗ה נָ֤תַן חֵ֨לֶק֙ בְּ/ת֣וֹךְ בְּנֵֽי יְהוּדָ֔ה אֶל פִּ֥י יְהוָ֖ה לִֽ/יהוֹשֻׁ֑עַ אֶת קִרְיַ֥ת אַרְבַּ֛ע אֲבִ֥י הָ/עֲנָ֖ק הִ֥יא חֶבְרֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/013.yaml
  text: 'And to Caleb son of Jephunneh he gave a portion among the sons of Judah[a], according to the command of Yahweh to Joshua: Kiriath-arba (Arba was the father of Anak), that is[b], Hebron.'
translation:
  language: de
  text: 'Und Kaleb, dem Sohn Jefunnes, gab er einen Anteil unter den Söhnen Judas, nach dem Befehl[a] Jahwes an Josua: Kirjat-Arba (Arba war der Vater Anaks[b]), das ist Hebron.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „nach dem Mund Jahwes“; die hebräische Wendung bedeutet „nach dem Wort“ oder „nach dem Befehl Jahwes“.'
    reason: lexical_alternative
  - marker: b
    text: „Vater Anaks“ kann auch „Ahnherr Anaks“ oder „Begründer Anaks“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְכָלֵב בֶּן־יְפֻנֶּה
  choice: Und Kaleb, dem Sohn Jefunnes
  rationale: Die Verbindung aus Konjunktion und Präposition wird mit „Und … dem“ wiedergegeben; die Apposition bewahrt die hebräische Abstammungsangabe in natürlichem Deutsch.
- source_word: נָתַן חֵלֶק
  choice: gab er einen Anteil
  rationale: Die aktive Verbform und das im Hebräischen nicht ausdrücklich genannte Subjekt bleiben erhalten. „Anteil“ bezeichnet hier die Landzuteilung, ohne den Verwaltungsvorgang stärker auszudeuten.
- source_word: בְּתוֹךְ בְּנֵי יְהוּדָה
  choice: unter den Nachkommen Judas
  rationale: „Unter“ gibt die Bedeutung „inmitten von/unter“ natürlich wieder. „Nachkommen Judas“ macht die Stammesbezeichnung verständlich, ohne sie auf eine moderne Bevölkerungsbezeichnung zu reduzieren.
- source_word: אֶל־פִּי יְהוָה
  choice: nach dem Befehl Jahwes
  rationale: Die wörtliche Wendung „nach dem Mund Jahwes“ ist ein Idiom für eine Weisung oder einen Befehl. Im Zusammenhang der Landzuteilung ist „Befehl“ präzise und idiomatisch.
- source_word: לִיהוֹשֻׁעַ
  choice: an Josua
  rationale: Die Präposition bezeichnet Josua als Empfänger der göttlichen Weisung. „An Josua“ wahrt diese Beziehung, ohne ihn ausdrücklich zum Subjekt des Gebens zu machen.
- source_word: קִרְיַת אַרְבַּע
  choice: Kirjat-Arba
  rationale: Der Ortsname wird nach gebräuchlicher deutscher Form transliteriert und nicht als „Stadt Arbas“ übersetzt.
- source_word: אֲבִי הָעֲנָק
  choice: Arba war der Vater Anaks
  rationale: Die erläuternde Einfügung stellt klar, dass Arba – nicht die Stadt – als Vater Anaks bezeichnet wird. „Vater“ bewahrt die Grundbedeutung von אָב; weitere mögliche Nuancen werden in der Fußnote genannt.
- source_word: הִיא חֶבְרוֹן
  choice: das ist Hebron
  rationale: Die Formulierung identifiziert Kirjat-Arba mit Hebron in knapper, natürlicher deutscher Sprache.
theological_decisions:
- issue: Bezug des unausgedrückten Subjekts von נָתַן („gab“)
  choice: Das Subjekt bleibt mit „gab er“ unausdrücklich bestimmt.
  alternative: „Josua gab“ oder „Jahwe gab“
  rationale: Der hebräische Satz nennt das Subjekt an dieser Stelle nicht ausdrücklich. Eine explizite Zuordnung zu Josua oder Jahwe würde die echte syntaktische Mehrdeutigkeit auflösen und dem Text eine stärkere Festlegung auferlegen.
- issue: Bedeutungsumfang von אָב in der Bezeichnung Arbas
  choice: „Vater Anaks“ im Haupttext
  alternative: „Ahnherr Anaks“ oder „Begründer Anaks“
  rationale: „Vater“ ist die unmittelbarste Wiedergabe und bewahrt die genealogische Ausdrucksweise. Da אָב auch einen Ahnherrn oder Gründer bezeichnen kann, wird diese Offenheit in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit geläufigen deutschen Namensformen. Die Satzstellung erhält das unausgedrückte hebräische Subjekt als „er“, während Gedankenstriche die erklärende Apposition zu Arba verständlich abgrenzen.
