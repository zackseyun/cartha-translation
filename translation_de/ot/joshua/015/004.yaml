  text: וְ/עָבַ֣ר עַצְמ֗וֹנָ/ה וְ/יָצָא֙ נַ֣חַל מִצְרַ֔יִם ו/היה תֹּצְא֥וֹת הַ/גְּב֖וּל יָ֑מָּ/ה זֶה יִהְיֶ֥ה לָ/כֶ֖ם גְּב֥וּל נֶֽגֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/004.yaml
  text: Then it passed on to Azmon[a], and went out to the Brook of Egypt; and the boundary ended at the sea. This shall be your southern boundary.
translation:
  language: de
  text: Dann verlief sie weiter nach Azmon und führte bis zum Bach Ägyptens[a]. Am Meer endete die Grenze. Das soll eure Südgrenze sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Wadi Ägyptens“. Das hebräische Wort naḥal bezeichnet oft einen nur zeitweise wasserführenden Bachlauf oder ein Wadi. Die traditionelle Wiedergabe „Fluss Ägyptens“ könnte hier zu Unrecht an den Nil denken lassen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַר עַצְמוֹנָה
  choice: Dann verlief sie weiter nach Azmon
  rationale: עבר bezeichnet in Grenzbeschreibungen den weiteren Verlauf der Grenzlinie. „Verlief … weiter“ ist im Deutschen natürlich und vermeidet die unnötige Vorstellung einer konkreten Überquerung. Das direktionale He am Ortsnamen wird mit „nach Azmon“ wiedergegeben.
- source_word: וְיָצָא נַחַל מִצְרַיִם
  choice: und führte bis zum Bach Ägyptens
  rationale: יצא beschreibt hier, wie die Grenze einen Zielpunkt erreicht beziehungsweise dorthin ausläuft. „Führte bis zu“ gibt diese Funktion in einer deutschen Grenzbeschreibung idiomatisch wieder. נחל bezeichnet häufig einen zeitweise wasserführenden Bachlauf oder ein Wadi, nicht zwingend einen großen Fluss.
- source_word: וְהיה תֹּצְאוֹת הַגְּבוּל יָמָּה
  choice: Am Meer endete die Grenze
  rationale: תוצאות הגבול bezeichnet den Endpunkt beziehungsweise Ausgang der Grenze; ימה bedeutet „meerwärts“ und verweist hier auf das Mittelmeer. Die Formulierung gibt den hebräischen Sinn klar wieder, ohne dessen Idiom hölzern nachzubilden.
- source_word: זֶה יִהְיֶה לָכֶם גְּבוּל נֶגֶב
  choice: Das soll eure Südgrenze sein
  rationale: נגב wird hier als Richtungsangabe „Süden“ verstanden, nicht als Eigenname der Landschaft Negev. Der Satz fasst den zuvor beschriebenen südlichen Grenzverlauf zusammen.
theological_decisions: []
