  text: Hazar-Schual, Beerscheba[a] und Bizjotja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name Beerscheba kann im Hebräischen »Brunnen der Sieben« bedeuten und zugleich als Wortspiel auf »Brunnen des Schwurs« anspielen.
