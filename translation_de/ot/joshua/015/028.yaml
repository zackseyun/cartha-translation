lexical_decisions:
- source_word: חֲצַר שׁוּעָל
  choice: Hazar-Schual
  rationale: Der Ortsname wird entsprechend der hebräischen Form und der in deutschen Bibeln vertrauten Schreibweise transliteriert. Seine Bestandteile können auf eine »Siedlung« beziehungsweise »Einfriedung« und einen »Fuchs« oder »Schakal« hinweisen; in einer Ortsliste ist eine Bedeutungsübersetzung jedoch weniger angemessen.
- source_word: בְּאֵר שֶׁבַע
  choice: Beerscheba
  rationale: Für den bekannten Ortsnamen wird die im Deutschen etablierte Form verwendet. Das mögliche Wortspiel mit »sieben« und »Schwur« bleibt in der Fußnote erhalten.
- source_word: בִּזְיוֹתְיָה
  choice: Bisjotja
  rationale: Da Herkunft und Bedeutung des Ortsnamens unsicher sind, wird er möglichst lautnah transliteriert.
- source_word: וַ / וּ
  choice: und
  rationale: Die vorangestellte Konjunktion verbindet die Ortsnamen; im natürlichen Deutschen stehen Kommas und vor dem letzten Namen »und«.
