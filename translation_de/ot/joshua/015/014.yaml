base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/014.yaml
  text: 'And Caleb drove out from there the three sons of Anak: Sheshai[a], Ahiman, and Talmai[b], the children of Anak.'
translation:
  language: de
  text: 'Und Kaleb vertrieb[a] von dort die drei Söhne Anaks: Scheschai, Achiman und Talmai, die Nachkommen Anaks.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »setzte von dort aus ihrem Besitz«. Das hebräische Verb kann hervorheben, dass die bisherigen Bewohner durch ihre Vertreibung ihren Besitz verloren.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht zuerst »Söhne Anaks« und hier »die von Anak Geborenen«. Der Vers verwendet zwei verwandte genealogische Bezeichnungen für dieselben Männer.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּרֶשׁ
  choice: vertrieb
  rationale: Die Hifil-Form von ירשׁ bezeichnet hier bei Personen als Objekt, dass Kaleb sie aus ihrem bisherigen Besitz verdrängte. »Vertrieb« ist im Deutschen natürlich und bewahrt den Zusammenhang von Vertreibung und Besitznahme.
- source_word: מִשָּׁם
  choice: von dort
  rationale: Direkte und idiomatische Wiedergabe der Ortsangabe.
- source_word: שְׁלוֹשָׁה בְּנֵי הָעֲנָק
  choice: die drei Söhne Anaks
  rationale: Gibt die genealogische Wendung formal wieder, ohne sie vorschnell zum Volksnamen »Anakiter« zu verallgemeinern.
- source_word: שֵׁשַׁי
  choice: Scheschai
  rationale: Im Deutschen gut lesbare Umschrift des hebräischen Personennamens.
- source_word: אֲחִימַן
  choice: Ahiman
  rationale: Übliche und gut lesbare Umschrift des hebräischen Personennamens.
- source_word: תַּלְמַי
  choice: Talmai
  rationale: Übliche und gut lesbare Umschrift des hebräischen Personennamens.
- source_word: יְלִידֵי הָעֲנָק
  choice: die Nachkommen Anaks
  rationale: Die Wendung bezeichnet wörtlich die von Anak Geborenen. »Nachkommen Anaks« vermittelt die genealogische Zugehörigkeit natürlich und unterscheidet sich zugleich von der vorausgehenden Formulierung »Söhne Anaks«.
