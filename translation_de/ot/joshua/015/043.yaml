  - marker: b
    text: 'Oder: »Neziv«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִפְתָּח
  choice: Jiftach
  rationale: Ortsname in einer Städteliste; die Form gibt die hebräischen Konsonanten und Vokale in geläufiger deutscher Umschrift wieder, ohne den Ortsnamen mit dem bekannteren Personennamen zu harmonisieren.
- source_word: אַשְׁנָה
  choice: Aschna
  rationale: Der hebräische Ortsname wird in einer für deutschsprachige Leser natürlichen Umschrift wiedergegeben.
- source_word: נְצִיב
  choice: Nezib
  rationale: Der Ortsname wird lesbar transliteriert; »Neziv« ist eine mögliche Alternative, wenn der hebräische Schlusskonsonant stärker abgebildet wird.
- source_word: וְ
  choice: und
  rationale: Die vorangestellte Konjunktion führt die bestehende Aufzählung fort. Im Deutschen genügt vor dem ersten Namen »und«; weitere wiederholte Konjunktionen werden für einen natürlichen Listenstil nicht eigens wiedergegeben.
theological_decisions: []
translation_notes:
  register: Knappe, würdige Fortsetzung einer Ortsliste. Deutsche Namensumschrift mit »sch« für שׁ und »ch« für ח; keine unnötige Harmonisierung mit bekannten Personennamen.
