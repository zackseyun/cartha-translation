  language: en
  yaml_path: translation/ot/joshua/015/043.yaml
  text: And Iphtah[a], and Ashnah[b], and Nezib.
translation:
  language: de
  text: und Jiftach[a], Aschna und Nezib[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Jiphtach«; traditionell auch »Jefta«.'
