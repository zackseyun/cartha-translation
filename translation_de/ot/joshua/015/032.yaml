base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/032.yaml
  text: and Lebaoth[a], Shilhim, Ain, and Rimmon—twenty-nine cities in all, with their villages.
translation:
  language: de
  text: Und Lebaot, Schilhim, Ajin und Rimmon – insgesamt neunundzwanzig Städte samt ihren Dörfern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort für „Dörfer“ kann auch mit „Siedlungen“ oder „Weilern“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְבָאוֹת
  choice: und Lebaot
  rationale: Ortsname in einer Städteliste; nach einer im Deutschen gut lesbaren Umschrift wiedergegeben. Die einleitende Konjunktion bleibt erhalten.
- source_word: וְשִׁלְחִים
  choice: Schilhim
  rationale: Ortsname; die Umschrift mit „Sch“ und „h“ ist für deutschsprachige Leser verständlich und bildet die hebräischen Konsonanten angemessen ab.
- source_word: וְעַיִן
  choice: Ajin
  rationale: Im Kontext ist עַיִן ein Ortsname und nicht als das gewöhnliche Substantiv „Quelle“ oder „Auge“ zu übersetzen.
- source_word: וְרִמּוֹן
  choice: Rimmon
  rationale: Ortsname in der Aufzählung; daher nicht mit der möglichen Wortbedeutung „Granatapfel“ übersetzt.
- source_word: כָּל עָרִים עֶשְׂרִים וָתֵשַׁע
  choice: insgesamt neunundzwanzig Städte
  rationale: Die hebräische Zusammenfassung der Gesamtzahl wird in natürlicher deutscher Wortstellung wiedergegeben.
- source_word: וְחַצְרֵיהֶן
  choice: samt ihren Dörfern
  rationale: חָצֵר bezeichnet in Gebietslisten kleinere, den Städten zugeordnete Siedlungen. „Samt“ gibt die Zuordnung idiomatisch wieder; mögliche Alternativen werden in der Fußnote genannt.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die Ortsnamen werden deutsch lesbar transliteriert; die knappe Listenstruktur des Hebräischen bleibt gewahrt.
