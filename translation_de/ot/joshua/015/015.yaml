  text: וַ/יַּ֣עַל מִ/שָּׁ֔ם אֶל יֹשְׁבֵ֖י דְּבִ֑ר וְ/שֵׁם דְּבִ֥ר לְ/פָנִ֖ים קִרְיַת סֵֽפֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/015.yaml
  text: From there he went up against the inhabitants of Debir[a]. (Formerly the name of Debir was Kiriath-sepher.)
translation:
  language: de
  text: Von dort zog er gegen die Bewohner von Debir hinauf. (Debir hieß früher Kirjat-Sefer[a].)
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kirjat-Sefer kann »Stadt des Buches« oder »Stadt der Schrift« bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: zog er … hinauf
  rationale: Das Verb עלה bezeichnet wörtlich ein Hinaufgehen oder Hinaufziehen. Im militärischen Zusammenhang gibt „zog … hinauf“ sowohl die Bewegungsrichtung als auch den Feldzug wieder; „gegen“ macht durch den Kontext die feindliche Ausrichtung deutlich.
- source_word: מִשָּׁם
  choice: Von dort
  rationale: Natürliche und genaue Wiedergabe der Ortsangabe, die auf den zuvor genannten Ort zurückverweist.
- source_word: אֶל יֹשְׁבֵי דְּבִר
  choice: gegen die Bewohner von Debir
  rationale: יֹשְׁבֵי bezeichnet die Bewohner beziehungsweise Ansässigen. אֶל kann „zu“ oder „gegen“ bedeuten; im militärischen Erzählzusammenhang ist „gegen“ angemessen, ohne das Verb selbst als „angreifen“ zu überdeuten.
- source_word: דְּבִר
  choice: Debir
  rationale: Der Ortsname wird transliteriert und nicht übersetzt.
- source_word: וְשֵׁם דְּבִר לְפָנִים
  choice: Debir hieß früher
  rationale: לְפָנִים ist hier zeitlich als „früher“ zu verstehen. Die knappe deutsche Formulierung gibt die Namensnotiz natürlich wieder.
- source_word: קִרְיַת סֵפֶר
  choice: Kirjat-Sefer
  rationale: Der Ortsname bleibt im Haupttext transliteriert. Seine mögliche Bedeutung wird wegen der lexikalischen Mehrdeutigkeit in einer Fußnote genannt.
theological_decisions: []
