base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/047.yaml
  text: Ashdod[a], its daughter towns and its villages; Gaza, its daughter towns and its villages; as far as the Brook of Egypt, and the Great Sea[c][b], which is its boundary.
translation:
  language: de
  text: Aschdod mit seinen Tochterstädten[a] und Dörfern; Gaza mit seinen Tochterstädten und Dörfern; bis zum Bach Ägyptens[b] und zum Meer mit seinem Küstengebiet[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Töchter“; gemeint sind kleinere Orte, die zu einer größeren Stadt gehören.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Wadi Ägyptens“. Das hebräische Wort kann einen saisonalen Wasserlauf oder ein Trockental bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: Gemeint ist das Mittelmeer. Die knappe hebräische Schlussformel bezeichnet das Meer mitsamt seinem Grenz- oder Küstenbereich.
    reason: cross_reference
lexical_decisions:
- source_word: בְּנוֹתֶיהָ
  choice: seinen Tochterstädten
  rationale: Wörtlich „seinen Töchtern“. In Gebietslisten bezeichnet das Wort kleinere, von einer Hauptstadt abhängige Orte. „Tochterstädte“ bewahrt das hebräische Bild und macht den geografischen Sinn deutlich.
- source_word: חֲצֵרֶיהָ
  choice: Dörfern
  rationale: Das Wort bezeichnet hier kleinere, außerhalb der Hauptorte gelegene Siedlungen. „Dörfer“ ist im modernen Deutschen natürlich und unterscheidet sie von den Tochterstädten.
- source_word: נַחַל מִצְרָיִם
  choice: Bach Ägyptens
  rationale: נַחַל kann einen Bachlauf, ein Flusstal oder einen nur zeitweise wasserführenden Wadi bezeichnen. Die traditionelle geografische Bezeichnung „Bach Ägyptens“ bleibt verständlich; die mögliche Wiedergabe „Wadi Ägyptens“ wird in der Fußnote genannt.
- source_word: הַיָּם הַגָּדוֹל
  choice: das große Meer
  rationale: Die biblische geografische Bezeichnung meint das Mittelmeer. Die Übersetzung bewahrt die Ausdrucksweise des Hebräischen, während die Fußnote den heutigen Namen nennt.
- source_word: וּגְבוּל
  choice: samt seinem Küstengebiet
  rationale: Die knappe Schlussformel verbindet das Meer mit dem daran gelegenen Grenz- beziehungsweise Küstengebiet. Diese Wiedergabe ergibt im Deutschen einen natürlichen geografischen Sinn, ohne die Formulierung auf eine bloße Kopula zu reduzieren.
- source_word: עַד
  choice: bis zum
  rationale: Dies ist die natürliche deutsche Entsprechung für die Angabe der räumlichen Ausdehnung.
- source_word: אַשְׁדּוֹד / עַזָּה
  choice: Aschdod / Gaza
  rationale: Die Ortsnamen werden nach den im Deutschen üblichen biblischen Namensformen wiedergegeben.
