review_pass:
  verdict: revise
  source_fidelity: Die Ortsnamen, Tochterstädte, Dörfer und der „Bach Ägyptens“ sind grundsätzlich zutreffend wiedergegeben. Das hebräische Ende bezeichnet jedoch nicht das „große Meer“; גדוֹל („groß“) steht im WLC-Text dieses Verses nicht. Die Schlussformel וְהַיָּם הַגְּבוּל וּגְבוּל ist elliptisch und meint das Meer in seiner Funktion als Grenze bzw. dessen Grenz-/Küstenbereich. „Mit seinem Küstengebiet“ ist dafür eine vertretbare, verständliche Wiedergabe.
  naturalness: Die Reihung passt gut zu einer Gebietsliste. „Bis zum Bach Ägyptens und zum Meer mit seinem Küstengebiet“ ist im modernen Standarddeutschen klar und vermeidet die im Entwurf enthaltene nicht quellengestützte Ergänzung „großen“.
  terminology: „Tochterstädte“ bewahrt die bildhafte hebräische Bezeichnung und wird angemessen erklärt. Die Erklärung sollte nicht von einer „Hauptstadt“ sprechen, da der Text lediglich eine Zuordnung zu einer größeren bzw. zentralen Stadt ausdrückt. „Bach Ägyptens“ ist als traditionelle geographische Bezeichnung möglich; „Wadi Ägyptens“ kann als Alternative erläutert werden.
  issues:
  - severity: medium
    issue: „zum großen Meer“
    rationale: Im hebräischen Text von Josua 15,47 steht הַיָּם („das Meer“), nicht הַיָּם הַגָּדוֹל („das große Meer“). Die Ergänzung „groß“ ist daher in diesem Vers nicht sourcegetreu, auch wenn sie in verwandten Grenzformulierungen vorkommt.
  - severity: low
    issue: 'Fußnote a: „von der jeweiligen Hauptstadt abhängige Orte“'
    rationale: „Hauptstadt“ ist sachlich zu spezifisch und anachronistisch. Das hebräische Idiom bezeichnet zu einer Haupt- oder Mutterstadt gehörige, kleinere Orte, ohne diese Stadt als Hauptstadt im modernen Sinn zu qualifizieren.
  - severity: low
    issue: 'Fußnote b: „Flusstal“ als Erklärung von Wadi'
    rationale: Für die hier gemeinte mögliche Bedeutung ist „Trockental“ bzw. ein saisonaler Wasserlauf präziser und im Deutschen verständlicher als „Flusstal“.
  revised_text: Aschdod mit seinen Tochterstädten[a] und Dörfern; Gaza mit seinen Tochterstädten und Dörfern; bis zum Bach Ägyptens[b] und zum Meer mit seinem Küstengebiet[c].
