  text: וַ/יְהִ֤י לָ/הֶם֙ גְּב֣וּל נֶ֔גֶב מִ/קְצֵ֖ה יָ֣ם הַ/מֶּ֑לַח מִן הַ/לָּשֹׁ֖ן הַ/פֹּנֶ֥ה נֶֽגְבָּ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/002.yaml
  text: Their southern border was from the end of the Salt Sea[b][a], from the tongue that faces southward.
translation:
  language: de
  text: Ihre Südgrenze verlief vom Ende des Salzmeeres[b], von der Zunge[a], die nach Süden weist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich: „von der Zunge“; ein topografischer Ausdruck für eine zungenförmige Gelände- oder Wasserform, etwa eine Landzunge oder Bucht.'
    reason: lexical_alternative
  - marker: b
    text: Das ist das Tote Meer.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי לָהֶם
  choice: Ihre … verlief
  rationale: Die hebräische Konstruktion mit היה und לָהֶם führt die Grenzbeschreibung ein. Im Deutschen gibt eine possessive Formulierung mit dem für Grenzlinien natürlichen Verb „verlief“ den Sinn idiomatisch wieder.
- source_word: גְּבוּל נֶגֶב
  choice: Südgrenze
  rationale: נֶגֶב bezeichnet hier die südliche Grenzseite und nicht den Eigennamen der Landschaft Negev. „Südgrenze“ ist präzise und natürlich.
- source_word: מִקְצֵה יָם הַמֶּלַח
  choice: vom südlichen Ende des Salzmeeres aus
  rationale: קָצֶה bezeichnet den End- oder äußersten Punkt. Im Zusammenhang legt die anschließende südlich ausgerichtete Landzunge das Südende des Sees nahe; „aus“ markiert verständlich den Ausgangspunkt der Grenzlinie.
- source_word: יָם הַמֶּלַח
  choice: Salzmeer
  rationale: Die wörtliche biblische Bezeichnung wird im Haupttext bewahrt; der heute gebräuchliche Name „Totes Meer“ steht in einer Fußnote.
- source_word: מִן הַלָּשׁוֹן
  choice: von der Landzunge
  rationale: לָשׁוֹן bedeutet wörtlich „Zunge“ und wird topografisch von einer zungenförmigen Gelände- oder Wasserform gebraucht. „Landzunge“ bewahrt das Bild verständlicher als das isolierte „Zunge“, ohne die genaue Geografie übermäßig festzulegen.
- source_word: הַפֹּנֶה נֶגְבָּה
  choice: die nach Süden weist
  rationale: Das Partizip פנה bezeichnet hier die Ausrichtung des topografischen Merkmals. „Nach Süden weist“ ist im Deutschen idiomatisch und erhält den räumlichen Sinn.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe an der hebräischen Grenzbeschreibung, wird aber durch „verlief … aus“ natürlich deutsch formuliert. Die Fußnotenmarker stehen jeweils unmittelbar beim erklärten Ausdruck.
