  text: וּ/מַעֲרָ֥ת וּ/בֵית עֲנ֖וֹת וְ/אֶלְתְּקֹ֑ן עָרִ֥ים שֵׁ֖שׁ וְ/חַצְרֵי/הֶֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/059.yaml
  text: 'and Maarath[a], and Beth-anoth, and Eltekon: six cities with their villages.'
translation:
  language: de
  text: 'und Maarat, Bet-Anot und Eltekon: sechs Städte mit ihren Dörfern.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit ihren Siedlungen« beziehungsweise »mit ihren Weilern«. Das hebräische Wort bezeichnet kleinere ländliche Orte, die zu den genannten Städten gehörten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַעֲרָת
  choice: und Maarat
  rationale: Der Ortsname wird in einer für deutsche Leser gut lesbaren Form transliteriert; die vorangestellte Konjunktion wird als »und« wiedergegeben.
- source_word: וּבֵית עֲנוֹת
  choice: Bet-Anot
  rationale: Der zusammengesetzte Ortsname wird transliteriert und durch einen Bindestrich als Einheit kenntlich gemacht; בֵית wird als Bestandteil des Namens nicht mit »Haus« übersetzt.
- source_word: וְאֶלְתְּקֹן
  choice: und Eltekon
  rationale: Der Ortsname wird transliteriert; das letzte Glied der deutschen Aufzählung wird natürlich mit »und« angeschlossen.
- source_word: עָרִים
  choice: Städte
  rationale: עִיר bezeichnet hier die in der Gebietsliste aufgeführten bewohnten Hauptorte; »Städte« entspricht dem herkömmlichen geografisch-administrativen Sprachgebrauch.
- source_word: שֵׁשׁ
  choice: sechs
  rationale: Die Kardinalzahl wird direkt wiedergegeben. Dass im überlieferten hebräischen Vers nur drei Ortsnamen stehen, obwohl die Summe sechs lautet, wird nicht stillschweigend harmonisiert.
- source_word: וְחַצְרֵיהֶן
  choice: mit ihren Dörfern
  rationale: חָצֵר bezeichnet in diesen Gebietslisten zugehörige kleinere ländliche Siedlungen. »Mit ihren Dörfern« gibt die Zuordnung idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Knappes, würdevolles Standarddeutsch im Stil einer geografischen Aufzählung. Die auffällige Angabe »sechs Städte« bleibt entsprechend dem hebräischen Text erhalten, obwohl der Vers in der masoretischen Überlieferung nur drei Namen nennt.
