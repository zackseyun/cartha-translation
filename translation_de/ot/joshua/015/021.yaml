  text: וַ/יִּֽהְי֣וּ הֶ/עָרִ֗ים מִ/קְצֵה֙ לְ/מַטֵּ֣ה בְנֵֽי יְהוּדָ֔ה אֶל גְּב֥וּל אֱד֖וֹם בַּ/נֶּ֑גְבָּ/ה קַבְצְאֵ֥ל וְ/עֵ֖דֶר וְ/יָגֽוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/021.yaml
  text: And the cities at the extremity of the tribe of the sons of Judah[a], toward the border of Edom in the Negev, were Kabzeel, Eder[b], and Jagur.
translation:
  language: de
  text: Die Städte am äußersten Rand des Stammesgebiets der Nachkommen Judas[a], zur Grenze Edoms hin, im Negev[b], waren Kabzeel, Eder und Jagur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „vom äußersten Ende des Stammes der Nachkommen Judas“; die hebräische Wendung bezeichnet hier den äußeren Rand des judäischen Stammesgebiets.'
    reason: lexical_alternative
  - marker: b
    text: „Negev“ kann auch mit „Süden“ oder „Südland“ wiedergegeben werden. Hier ist wahrscheinlich die südliche Landschaft Judas gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ הֶעָרִים
  choice: Die Städte … waren
  rationale: Die hebräische Konstruktion leitet die nun folgende Städteliste ein; diese Satzstellung bewahrt ihre Form und klingt im Deutschen würdig und verständlich.
- source_word: מִקְצֵה לְמַטֵּה בְנֵי יְהוּדָה
  choice: am äußersten Rand des Stammesgebiets der Nachkommen Judas
  rationale: מִקְצֵה bezeichnet den äußersten Rand; die Ergänzung „Stammesgebiet“ macht den territorialen Zusammenhang deutlich, während „Nachkommen Judas“ die herkömmliche Stammesbezeichnung בְנֵי יְהוּדָה natürlich wiedergibt.
- source_word: אֶל גְּבוּל אֱדוֹם
  choice: zur Grenze Edoms hin
  rationale: אֶל drückt hier die räumliche Ausrichtung zur edomitischen Grenze aus, ohne zwingend unmittelbare Berührung zu behaupten.
- source_word: בַּנֶּגְבָּה
  choice: im Negev
  rationale: נֶגֶב kann „Süden“ bedeuten, bezeichnet hier im geographischen Zusammenhang aber wahrscheinlich die südliche Landschaft Negev.
- source_word: קַבְצְאֵל וְעֵדֶר וְיָגוּר
  choice: Kabzeel, Eder und Jagur
  rationale: Die Ortsnamen werden in ihren im Deutschen gut lesbaren, quellennahen Formen wiedergegeben.
