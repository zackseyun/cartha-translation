source:
  edition: WLC
  text: וְ/יָצָ֨א הַ/גְּב֜וּל אֶל כֶּ֣תֶף עֶקְרוֹן֮ צָפוֹנָ/ה֒ וְ/תָאַ֤ר הַ/גְּבוּל֙ שִׁכְּר֔וֹנָ/ה וְ/עָבַ֥ר הַר הַֽ/בַּעֲלָ֖ה וְ/יָצָ֣א יַבְנְאֵ֑ל וְ/הָי֛וּ תֹּצְא֥וֹת הַ/גְּב֖וּל יָֽמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/011.yaml
  text: Then the border went out to the shoulder of Ekron northward[a], and the border bent toward Shikkeron, and passed over Mount Baalah, and went out to Jabneel[c][b]; and the ends of the border were at the sea.
translation:
  language: de
  text: Dann verlief die Grenze zur Nordseite von Ekron[a], bog nach Schikkeron um, führte über den Berg Baala und weiter nach Jabneel. Die Grenze endete am Meer.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »zur Schulter Ekrons nach Norden«; gemeint sein kann die Nordseite Ekrons oder ein nördlich ausgerichteter Abschnitt bei Ekron.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Die Endpunkte der Grenze lagen meerwärts« beziehungsweise »im Westen«. Gemeint ist wahrscheinlich das Mittelmeer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָצָא
  choice: verlief / führte weiter
  rationale: In Grenzbeschreibungen bezeichnet das Verb den weiteren Verlauf der Grenzlinie. Die idiomatischen deutschen Wiedergaben vermeiden das unnatürliche wörtliche »ging hinaus«, während die Bewegungsfolge erhalten bleibt.
- source_word: גְּבוּל
  choice: Grenze
  rationale: »Grenze« ist in einer territorialen Grenzbeschreibung die klare und natürliche deutsche Entsprechung.
- source_word: כֶּתֶף עֶקְרוֹן צָפוֹנָה
  choice: zur Nordseite von Ekron
  rationale: כֶּתֶף bedeutet wörtlich »Schulter«, topografisch jedoch »Seite« oder »Flanke«; zusammen mit der Richtungsform צָפוֹנָה bezeichnet die Wendung wahrscheinlich die nördliche Seite Ekrons. Die Fußnote bewahrt die konkretere Bildsprache und die Richtungsnuance.
- source_word: תָּאַר
  choice: bog … um
  rationale: Das Verb beschreibt in Grenzformeln eine Richtungsänderung beziehungsweise den bogenförmigen Verlauf der Grenzlinie.
- source_word: שִׁכְּרוֹנָה
  choice: Schikkeron
  rationale: Der Ortsname wird nach deutscher Laut- und Schreibkonvention transliteriert; die Endung ה ist hier richtungsanzeigend und gehört nicht zum Ortsnamen.
- source_word: עָבַר
  choice: führte über
  rationale: Die Grenze verläuft über beziehungsweise an einem geografischen Punkt vorbei; »führte über« ist im Deutschen für eine gedachte Grenzlinie natürlich.
- source_word: הַר הַבַּעֲלָה
  choice: Berg Baala
  rationale: הַר wird hier als topografischer Namensbestandteil mit »Berg« wiedergegeben; Baala bleibt als Eigenname transliteriert.
- source_word: יַבְנְאֵל
  choice: Jabneel
  rationale: Der Ortsname wird in einer im Deutschen üblichen, an der hebräischen Form orientierten Schreibweise wiedergegeben.
- source_word: תֹּצְאוֹת הַגְּבוּל
  choice: Die Grenze endete
  rationale: Die hebräische Wendung bezeichnet die Endpunkte beziehungsweise den Ausgang der Grenzlinie. Die verbale deutsche Form ist klar und bewahrt den geografischen Sinn.
- source_word: יָמָּה
  choice: am Meer
  rationale: Die Richtungsform kann »meerwärts« oder »westwärts« bedeuten; im Zusammenhang mit dem Ende der Grenzlinie bezeichnet sie wahrscheinlich das Meer als westlichen Endpunkt.
