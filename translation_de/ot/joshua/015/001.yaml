revisions:
- from: Und das Los für den Stamm der Nachkommen Judas fiel, nach ihren Sippen, bis an die Grenze Edoms, bis zur Wüste Zin, südwärts, am äußersten Ende des Südens.[a]
  to: Und das Los für den Stamm der Nachkommen Judas nach ihren Sippen reichte bis an die Grenze Edoms, bis zur Wüste Zin im Süden, vom äußersten Ende des Südens her.[a]
  rationale: Die Revision stellt die in der hebräischen Grenzformel enthaltene Präposition מִן wieder her und glättet zugleich die deutsche Satzverbindung, ohne die geografische oder textliche Mehrdeutigkeit von תֵימָן aufzulösen.
