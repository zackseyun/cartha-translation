  text: וַ/יְהִ֣י הַ/גּוֹרָ֗ל לְ/מַטֵּ֛ה בְּנֵ֥י יְהוּדָ֖ה לְ/מִשְׁפְּחֹתָ֑/ם אֶל גְּב֨וּל אֱד֧וֹם מִדְבַּר צִ֛ן נֶ֖גְבָּ/ה מִ/קְצֵ֥ה תֵימָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/001.yaml
  text: And the lot for the tribe of the sons of Judah[a], according to their clans, was to the border of Edom, to the wilderness of Zin, southward[c][b], at the farthest south.
translation:
  language: de
  text: Und das Los für den Stamm der Nachkommen Judas nach ihren Sippen reichte bis an die Grenze Edoms, bis zur Wüste Zin im Süden, vom äußersten Ende des Südens her.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vom äußersten Ende Temans her“. Das hebräische Wort kann „Süden“ bezeichnen, aber auch als Ortsname „Teman“ verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי הַגּוֹרָל
  choice: Und das Los … fiel
  rationale: Die idiomatische deutsche Wendung „das Los fiel“ gibt das Ergebnis der Landverlosung natürlich wieder und bewahrt zugleich den konkreten Losentscheid.
- source_word: לְמַטֵּה בְּנֵי יְהוּדָה
  choice: für den Stamm der Nachkommen Judas
  rationale: מַטֶּה bezeichnet hier den Stamm; בְּנֵי יְהוּדָה meint im genealogisch-tribalen Zusammenhang die Nachkommen Judas. Diese Wiedergabe ist im modernen Deutsch klarer als „Söhne Judas“.
- source_word: לְמִשְׁפְּחֹתָם
  choice: nach ihren Sippen
  rationale: מִשְׁפָּחָה bezeichnet hier die Untergliederungen des Stammes und wird sachgerecht mit „Sippen“ wiedergegeben.
- source_word: אֶל גְּבוּל אֱדוֹם
  choice: bis an die Grenze Edoms
  rationale: In der Grenzbeschreibung bezeichnet אֶל das Erstrecken des zugelosten Gebiets bis zur Grenze Edoms.
- source_word: מִדְבַּר צִן
  choice: Wüste Zin
  rationale: מִדְבָּר bezeichnet in diesem geografischen Kontext eine Wüsten- beziehungsweise Wildnisregion; „Wüste Zin“ ist natürlich und etabliert.
- source_word: נֶגְבָּה
  choice: südwärts
  rationale: Die Richtungsendung wird adverbial wiedergegeben, ohne das Wort vorschnell als Eigennamen „Negev“ zu verstehen.
- source_word: מִקְצֵה תֵימָן
  choice: am äußersten Ende des Südens
  rationale: Die Formulierung bewahrt die ungewöhnliche räumliche Ausdrucksweise des Hebräischen. תֵימָן kann „Süden“ bedeuten, ist jedoch grundsätzlich auch als Ortsname Teman verständlich; diese Mehrdeutigkeit wird in der Fußnote angezeigt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung „bis … bis“ bildet die gestufte geografische Bestimmung ab. „Nachkommen Judas“ vermeidet das im Deutschen missverständliche „Söhne Judas“, ohne den genealogischen Bezug aufzulösen.
