base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/025.yaml
  text: and Hazor-hadattah[a], and Kerioth-hezron (that is, Hazor)[b],
translation:
  language: de
  text: und Hazor-Hadatta[a] und Kerijot-Hezron (das ist Hazor)[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Möglicherweise sind drei Orte gemeint: „Hazor, Hadatta und Kerijot-Hezron; das ist Hazor“. Dann wäre חֲדַתָּה als eigener Ortsname und nicht als Bestandteil von „Hazor-Hadatta“ zu verstehen.'
    reason: alternative_reading
  - marker: b
    text: Der Ortsname „Kerijot“ kann auch „Kirijot“ geschrieben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/חָצוֹר חֲדַתָּה
  choice: und Hazor-Hadatta
  rationale: Die beiden Formen werden entsprechend der masoretischen Akzentuierung und der üblichen Deutung als zusammengesetzter Ortsname wiedergegeben. Eigennamen werden transliteriert; das vorangestellte וְ wird mit „und“ übersetzt.
- source_word: וּ/קְרִיּוֹת חֶצְרוֹן
  choice: und Kerijot-Hezron
  rationale: In der Ortsliste ist קְרִיּוֹת am ehesten als Eigenname und zusammen mit חֶצְרוֹן als zusammengesetzter Ortsname zu verstehen. Die Schreibweise „Kerijot“ bildet die hebräische Lautung für deutschsprachige Leser nachvollziehbar ab.
- source_word: הִיא
  choice: das ist
  rationale: Das Pronomen führt hier eine erklärende Gleichsetzung beziehungsweise Identifizierung ein; „das ist“ ist im Deutschen natürlich und bewahrt diese Funktion.
- source_word: חָצוֹר
  choice: Hazor
  rationale: Der abschließende Ortsname wird in der im Deutschen etablierten Form „Hazor“ transliteriert.
theological_decisions: []
