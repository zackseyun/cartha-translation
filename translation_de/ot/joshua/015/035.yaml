lexical_decisions:
- source_word: יַרְמוּת
  choice: Jarmut
  rationale: Der Ortsname wird gemäß der im Deutschen gebräuchlichen biblischen Namensform wiedergegeben.
- source_word: וַ/עֲדֻלָּם
  choice: Adullam
  rationale: Die Konjunktion wird in der natürlichen deutschen Aufzählung durch Zeichensetzung beziehungsweise das abschließende »und« repräsentiert; der Ortsname bleibt als Eigenname erhalten.
- source_word: שׂוֹכֹה
  choice: Socho
  rationale: Der Ortsname wird in einer gebräuchlichen deutschen biblischen Schreibweise wiedergegeben; abweichende Umschriften sind in der Fußnote vermerkt.
- source_word: וַ/עֲזֵקָה
  choice: und Aseka
  rationale: Die hebräische Konjunktion wird vor dem letzten Glied der Aufzählung mit »und« wiedergegeben; für den Ortsnamen wird die geläufige deutsche Form verwendet.
