lexical_decisions:
- source_word: עֲנָב
  choice: Anab
  rationale: Ortsname in einer Städteliste; die Form wird entsprechend der hebräischen Aussprache ins Deutsche übertragen und nicht übersetzt.
- source_word: אֶשְׁתְּמֹה
  choice: Eschtemo
  rationale: Ortsname; „Eschtemo“ gibt die masoretisch vokalisierte Form אֶשְׁתְּמֹה in einer im Deutschen gut lesbaren Umschrift wieder.
- source_word: עָנִים
  choice: Anim
  rationale: Der formal pluralisch wirkende Name dient hier als Ortsbezeichnung und wird daher als Eigenname transkribiert, nicht inhaltlich übersetzt.
- source_word: וְ
  choice: und
  rationale: Die vorangestellte Konjunktion verbindet die Ortsnamen. Im natürlichen deutschen Listenstil steht „und“ nur vor dem letzten Glied.
