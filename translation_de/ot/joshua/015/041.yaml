lexical_decisions:
- source_word: וּ/גְדֵרוֹת
  choice: und Gederot
  rationale: Ortsname mit vorangestellter Konjunktion; die hebräische Namensform wird in einer für das Deutsche üblichen Umschrift wiedergegeben.
- source_word: בֵּית דָּגוֹן
  choice: Bet-Dagon
  rationale: Der aus בֵּית („Haus“) und dem Gottesnamen Dagon gebildete Ausdruck bezeichnet hier einen Ort und wird daher als zusammengesetzter Eigenname transkribiert.
- source_word: וְ/נַעֲמָה
  choice: Naama
  rationale: Der Ortsname wird in einer natürlichen deutschen Umschrift ohne Kennzeichnung der hebräischen Kehllaute wiedergegeben.
- source_word: וּ/מַקֵּדָה
  choice: und Makkeda
  rationale: Ortsname mit Konjunktion; die Verdopplung des k wird bewahrt, die Endung deutsch lesbar transkribiert.
- source_word: עָרִים שֵׁשׁ עֶשְׂרֵה
  choice: sechzehn Städte
  rationale: עִיר bezeichnet in dieser Gebietsliste bewohnte Ortszentren; „Städte“ entspricht der herkömmlichen und sachlich passenden Wiedergabe.
- source_word: וְ/חַצְרֵי/הֶן
  choice: mit ihren Dörfern
  rationale: חָצֵר meint in dieser Zuteilungsformel die zu den Städten gehörenden kleineren ländlichen Siedlungen; „mit“ gibt die Zuordnung im Deutschen natürlicher wieder als ein bloßes „und“.
