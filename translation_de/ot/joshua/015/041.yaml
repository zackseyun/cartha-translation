  text: 'and Gederoth[a], Beth-dagon, Naamah, and Makkedah: sixteen cities with their villages.'
translation:
  language: de
  text: 'und Gederot, Bet-Dagon[a], Naama und Makkeda: sechzehn Städte mit ihren Dörfern.'
  philosophy: optimal-equivalence
  footnotes:
