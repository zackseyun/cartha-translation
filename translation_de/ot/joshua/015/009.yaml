base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/009.yaml
  text: Then the border curved from the top of the mountain to the spring of the waters of Nephtoah[a], and went out to the cities of Mount Ephron; then the border curved to Baalah (that is, Kiriath-jearim).
translation:
  language: de
  text: Dann bog die Grenze vom Gipfel des Berges zur Quelle der Wasser von Neftoach ab[a] und führte weiter zu den Städten des Berges Efron. Danach bog die Grenze nach Baala ab, das ist Kirjat-Jearim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wurde die Grenze abgesteckt“; auch möglich: „wandte sich die Grenze“. Das hebräische Verb kann in Grenzbeschreibungen sowohl das Nachzeichnen als auch eine Richtungsänderung der Grenzlinie bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָאַר
  choice: bog … ab
  rationale: Das Verb bezeichnet in Grenzbeschreibungen das Nachzeichnen beziehungsweise die Richtungsänderung einer Grenzlinie. „Bog … ab“ ist im Deutschen natürlich und bewahrt den topografischen Sinn.
- source_word: הַגְּבוּל
  choice: die Grenze
  rationale: „Grenze“ ist die übliche und klare deutsche Bezeichnung für eine territoriale Grenzlinie.
- source_word: מֵרֹאשׁ הָהָר
  choice: vom Gipfel des Berges
  rationale: „Gipfel“ gibt רֹאשׁ in diesem geografischen Zusammenhang präzise und idiomatisch wieder.
- source_word: מַעְיַן מֵי נֶפְתּוֹחַ
  choice: zur Quelle des Wassers von Neftoach
  rationale: Die Wiedergabe folgt der hebräischen Konstruktverbindung eng und behandelt Neftoach als Ortsnamen.
- source_word: וְיָצָא
  choice: führte weiter
  rationale: In Grenzformeln beschreibt יצא den weiteren Verlauf der Grenzlinie. „Führte weiter“ ist natürlicher als das wörtliche „ging hinaus“, ohne zusätzliche Zielvorstellungen einzutragen.
- source_word: עָרֵי הַר עֶפְרוֹן
  choice: zu den Städten am Berg Efron
  rationale: Die knappe Konstruktverbindung wird geografisch verständlich wiedergegeben; „Berg Efron“ bleibt als naheliegende formale Deutung erhalten.
- source_word: בַּעֲלָה
  choice: Baala
  rationale: Der Ortsname wird in einer im Deutschen üblichen Transliteration wiedergegeben.
- source_word: הִיא קִרְיַת יְעָרִים
  choice: das ist Kirjat-Jearim
  rationale: Die Wendung identifiziert Baala ausdrücklich mit Kirjat-Jearim; „das ist“ bildet diese Apposition knapp und natürlich ab.
