  text: und Janim, Bet-Tappuach und Afeka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bet-Tappuach wird auch Bet-Tappuah geschrieben. Afeka wird auch Aphaka geschrieben; manche Übersetzungen verwenden die kürzere Form Afek.
    reason: lexical_alternative
lexical_decisions:
- source_word: ו/ינים
  choice: und Janim
  rationale: Das Präfix ו wird als „und“ wiedergegeben. Der Ortsname ינים wird nach der masoretischen Vokalisierung als „Janim“ transliteriert.
- source_word: וּ/בֵית תַּפּוּחַ
  choice: Bet-Tappuach
  rationale: Der zusammengesetzte Ortsname wird in einer im Deutschen geläufigen Transliteration wiedergegeben. Das anlautende וּ wird in der Aufzählung durch das deutsche Komma vertreten, um einen natürlichen Listenstil zu bewahren.
- source_word: וַ/אֲפֵקָה
  choice: und Afeka
  rationale: Das Präfix וַ wird als „und“ wiedergegeben. אֲפֵקָה wird entsprechend der hebräischen Konsonanten- und Vokalgestalt als „Afeka“ transliteriert; die Endung wird nicht zum kürzeren „Afek“ eingeebnet.
theological_decisions: []
translation_notes:
  register: Knappes, würdiges Standarddeutsch für eine Ortsnamenliste. Die hebräischen Ortsnamen werden deutsch transliteriert; die wiederholten Konjunktionen werden idiomatisch als Komma und abschließendes „und“ gestaltet.
