    text: Der Ortsname wird auch „Azem“ geschrieben; „Ezem“ gibt die hebräische Vokalisierung in diesem Vers unmittelbarer wieder.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלָה
  choice: Baala
  rationale: Der Ortsname wird nach geläufiger deutscher Bibelumschrift wiedergegeben. Die masoretische Form enthält die Endung -āh; im Deutschen wird sie bei diesem Namen natürlich als -a geschrieben.
- source_word: עִיִּים
  choice: Ijim
  rationale: In der Ortsliste ist das Wort als Eigenname zu verstehen und nicht mit seiner möglichen Wortbedeutung „Trümmer“ oder „Ruinen“ zu übersetzen. „Ijim“ gibt die hebräische Lautfolge in deutscher Umschrift wieder.
- source_word: עָצֶם
  choice: Ezem
  rationale: Der Ortsname wird in der im Deutschen etablierten Form „Ezem“ wiedergegeben; die hebräische Schreibung bleibt als Eigenname unübersetzt.
- source_word: וְ / וָ
  choice: und
  rationale: Die vorangestellten hebräischen Konjunktionen verbinden die letzten beiden Namen mit den übrigen Orten der Aufzählung; im Deutschen steht vor dem letzten Glied natürlich „und“.
