  text: Baala[a], Ijim[b] und Ezem[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der masoretische Text liest hier „Baala“. Die Form „Bala“ in manchen Übersetzungen dürfte durch parallele Ortslisten beeinflusst sein.
    reason: alternative_reading
  - marker: b
    text: Der Name „Ijim“ kann mit dem hebräischen Wort für „Trümmer“ oder „Ruinen“ zusammenhängen; hier bezeichnet er jedoch einen Ort.
    reason: lexical_alternative
