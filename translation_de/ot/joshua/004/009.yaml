  text: וּ/שְׁתֵּ֧ים עֶשְׂרֵ֣ה אֲבָנִ֗ים הֵקִ֣ים יְהוֹשֻׁעַ֮ בְּ/ת֣וֹךְ הַ/יַּרְדֵּן֒ תַּ֗חַת מַצַּב֙ רַגְלֵ֣י הַ/כֹּהֲנִ֔ים נֹשְׂאֵ֖י אֲר֣וֹן הַ/בְּרִ֑ית וַ/יִּ֣הְיוּ שָׁ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/009.yaml
  text: And Joshua set up twelve stones in the midst of the Jordan[a], under the place where the feet of the priests carrying the ark of the covenant stood, and they are there to this day.
translation:
  language: de
  text: Josua richtete zwölf Steine mitten im Jordan auf, unter der Stelle,[a] an der die Füße der Priester standen, die die Bundeslade trugen; sie sind bis auf den heutigen Tag dort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „unter dem Standort der Füße der Priester“. Gemeint ist die Stelle, an der die Priester standen, während sie die Bundeslade trugen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵקִים
  choice: richtete … auf
  rationale: Das Hifil von קום bezeichnet hier das Aufrichten bzw. Aufstellen der Steine. „richtete … auf“ ist natürlich, würdevoll und passt zum Gedenkstein-Kontext.
- source_word: בְּתוֹךְ הַיַּרְדֵּן
  choice: mitten im Jordan
  rationale: תּוֹךְ bezeichnet das Innere oder die Mitte. „mitten im Jordan“ gibt die räumliche Aussage im heutigen Deutsch klar wieder.
- source_word: תַּחַת מַצַּב רַגְלֵי
  choice: unter der Stelle, wo die Füße … standen
  rationale: מַצָּב bezeichnet hier den Standort beziehungsweise die Stelle des Stehens. Die Formulierung bewahrt sowohl תַּחַת („unter“) als auch den ausdrücklichen Bezug auf die Füße, ohne im Deutschen unnötig sperrig zu werden.
- source_word: נֹשְׂאֵי אֲרוֹן הַבְּרִית
  choice: die die Bundeslade trugen
  rationale: Das Partizip נֹשְׂאֵי beschreibt die Priester als Träger der Lade. „trugen“ ist klar und idiomatisch; אֲרוֹן הַבְּרִית wird mit dem etablierten Ausdruck „Bundeslade“ wiedergegeben.
- source_word: וַיִּהְיוּ שָׁם עַד הַיּוֹם הַזֶּה
  choice: Dort sind sie bis auf den heutigen Tag
  rationale: Die Wendung beschreibt aus Sicht des Erzählers einen fortdauernden Zustand. „bis auf den heutigen Tag“ bewahrt diese erzählerbezogene Gegenwart, ohne sie auf die Gegenwart heutiger Leser auszuweiten.
theological_decisions:
- issue: Spannung zwischen den hier im Jordan aufgerichteten zwölf Steinen und den zwölf Steinen in Gilgal im umliegenden Kontext
  choice: Der Vers wird entsprechend dem hebräischen Wortlaut als eigenes Aufrichten von zwölf Steinen mitten im Jordan übersetzt.
  alternative: Den Vers als Zusammenfassung der aus dem Jordan genommenen und andernorts aufgerichteten Steine verstehen oder den Text harmonisierend umdeuten.
  rationale: Der masoretische Text sagt ausdrücklich, dass Josua zwölf Steine „mitten im Jordan“ aufrichtete. Die Übersetzung bewahrt diese Aussage und löst die erzählerische Spannung nicht stillschweigend auf.
- issue: Zeitlicher Bezug der Formel עַד הַיּוֹם הַזֶּה
  choice: „Dort sind sie bis auf den heutigen Tag.“
  alternative: „Dort waren sie bis auf den heutigen Tag.“
  rationale: Die gewählte Form gibt den aus der Perspektive des Erzählers fortdauernden Zustand wieder, ohne eine Aussage über die Gegenwart der heutigen Leserschaft zu machen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Syntax wurde leicht gegliedert, damit die lange hebräische Satzstruktur natürlich lesbar bleibt; die räumliche Aussage und die erzählerische Spannung wurden beibehalten.
