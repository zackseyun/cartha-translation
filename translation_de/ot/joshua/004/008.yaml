id: JOS.4.8
reference: Joshua 4:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּעֲשׂוּ כֵ֣ן בְּנֵי יִשְׂרָאֵ֘ל כַּ/אֲשֶׁ֣ר צִוָּ֣ה יְהוֹשֻׁעַ֒ וַ/יִּשְׂא֡וּ שְׁתֵּֽי עֶשְׂרֵ֨ה אֲבָנִ֜ים מִ/תּ֣וֹךְ הַ/יַּרְדֵּ֗ן כַּ/אֲשֶׁ֨ר דִּבֶּ֤ר יְהוָה֙ אֶל יְהוֹשֻׁ֔עַ לְ/מִסְפַּ֖ר שִׁבְטֵ֣י בְנֵֽי יִשְׂרָאֵ֑ל וַ/יַּעֲבִר֤וּ/ם עִמָּ/ם֙ אֶל הַ/מָּל֔וֹן וַ/יַּנִּח֖וּ/ם שָֽׁם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/008.yaml
  text: And the sons of Israel did so[a], just as Joshua had commanded, and they carried twelve stones from the midst of the Jordan, just as Yahweh had spoken to Joshua, according to the number of the tribes of the sons of Israel[c][b]; and they brought them over with them to the lodging place and set them down there.
translation:
  language: de
  text: 'Und die Söhne Israels taten es so, wie Josua geboten hatte: Sie nahmen zwölf Steine aus der Mitte des Jordan, wie Jahwe zu Josua gesprochen hatte, entsprechend der Zahl der Stämme der Söhne Israels. Sie nahmen sie mit hinüber zum Nachtlager[a] und legten sie dort nieder.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum Lager“. Das hebräische Wort bezeichnet genauer einen Ort, an dem man übernachtet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Bewahrt den ausdrücklich familiären hebräischen Ausdruck; „Israeliten“ wäre im Deutschen flüssiger, aber weniger formnah.
- source_word: וַיַּעֲשׂוּ כֵן
  choice: taten es so
  rationale: Gibt die hebräische Wendung natürlich wieder und drückt aus, dass der Anordnung Folge geleistet wurde.
- source_word: כַּאֲשֶׁר צִוָּה יְהוֹשֻׁעַ
  choice: wie Josua geboten hatte
  rationale: „Gebieten“ wahrt den verbindlichen Charakter von צוה; das Plusquamperfekt ordnet das Gebot zeitlich vor der Ausführung ein.
- source_word: וַיִּשְׂאוּ
  choice: sie nahmen
  rationale: Im Zusammenhang mit dem Transport der Steine umfasst „nahmen“ sowohl das Aufheben als auch das Mitführen und vermeidet eine schwerfällige Wiederholung von „tragen“.
- source_word: שְׁתֵּי עֶשְׂרֵה אֲבָנִים
  choice: zwölf Steine
  rationale: Direkte und natürliche Wiedergabe der Zahlwortkonstruktion.
- source_word: מִתּוֹךְ הַיַּרְדֵּן
  choice: aus der Mitte des Jordan
  rationale: Bewahrt die konkrete räumliche Bedeutung von תּוֹךְ und bezeichnet wahrscheinlich den Bereich des Flussbetts, in dem die Priester standen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Eigennamen des Gottes Israels im Deutschen in einer geläufigen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: דִּבֶּר ... אֶל יְהוֹשֻׁעַ
  choice: zu Josua gesprochen hatte
  rationale: Entspricht dem Verb דבר und stellt durch das Plusquamperfekt den Rückbezug auf die vorausgehende göttliche Weisung klar.
- source_word: לְמִסְפַּר
  choice: entsprechend der Zahl
  rationale: Drückt die durch die Präposition bezeichnete zahlenmäßige Entsprechung idiomatisch aus.
- source_word: שִׁבְטֵי בְנֵי יִשְׂרָאֵל
  choice: der Stämme der Söhne Israels
  rationale: Erhält die volle hebräische Formulierung und ihre Verbindung mit dem ersten Vorkommen von „Söhne Israels“.
- source_word: וַיַּעֲבִרוּם עִמָּם
  choice: sie nahmen sie mit hinüber
  rationale: Gibt die kausative Form von עבר zusammen mit עִמָּם als Mitnahme über den Jordan natürlich und präzise wieder.
- source_word: הַמָּלוֹן
  choice: Nachtlager
  rationale: Bezeichnet den Ort des Übernachtens genauer als das allgemeinere „Lager“ und klingt im modernen Deutschen natürlich.
- source_word: וַיַּנִּיחוּם שָׁם
  choice: und legten sie dort nieder
  rationale: Gibt das gezielte Ablegen der Steine würdig und konkret wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. „Jahwe“ bewahrt diesen Eigennamecharakter, während „der HERR“ ihn durch einen Titel ersetzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit deutlicher Nähe zur hebräischen Satzführung. Der familiäre Ausdruck „Söhne Israels“ bleibt bewusst erhalten. Der lange hebräische Satz wird zur besseren Verständlichkeit in zwei Sätze gegliedert; der Doppelpunkt macht deutlich, dass das Folgende die Ausführung des Gebots beschreibt.
