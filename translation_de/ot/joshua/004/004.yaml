  text: So Joshua called the twelve men whom he had appointed from the sons of Israel[b][a], one man from each tribe.
translation:
  language: de
  text: Da rief Josua die zwölf Männer zu sich, die er unter den Israeliten ausgewählt hatte, je einen aus jedem Stamm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „aus den Söhnen Israels, einen Mann, einen Mann aus einem Stamm“.'
