lexical_decisions:
- source_word: וַיִּקְרָא ... אֶל
  choice: Da rief ... zu sich
  rationale: Die Verbindung von קרא mit אֶל bezeichnet hier Josuas Herbeirufen der bereits ausgewählten Männer. „zu sich rufen“ ist im Deutschen natürlich und gibt die Richtung der Handlung wieder.
- source_word: שְׁנֵים הֶעָשָׂר אִישׁ
  choice: die zwölf Männer
  rationale: Der bestimmte Ausdruck verweist auf die bereits im Zusammenhang genannte Gruppe von zwölf Vertretern.
- source_word: אֲשֶׁר הֵכִין
  choice: die er ... bestimmt hatte
  rationale: הכין kann „bereitmachen“, „vorbereiten“ oder in diesem Zusammenhang „bestimmen/einsetzen“ bedeuten. „bestimmt hatte“ passt zur vorherigen Auswahl und vermeidet die missverständliche Vorstellung einer körperlichen Vorbereitung.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: aus den Söhnen Israels
  rationale: Die Wiedergabe bewahrt die konkrete hebräische Formulierung בְּנֵי יִשְׂרָאֵל; eine idiomatischere ethnische Alternative wird in der Fußnote genannt.
- source_word: אִישׁ אֶחָד אִישׁ אֶחָד מִשָּׁבֶט
  choice: je einen Mann aus jedem Stamm
  rationale: „je einen“ bildet die distributive Wiederholung des Hebräischen natürlich ab; „aus jedem Stamm“ verdeutlicht die repräsentative Auswahl.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hält Josuas Handlung im Vordergrund; „Da“ führt die fortlaufende Erzählung natürlich weiter. Die konkrete Ausgangsformulierung „Söhne Israels“ bleibt im Haupttext erhalten, während die geläufigere deutsche Bezeichnung in der Fußnote steht.
