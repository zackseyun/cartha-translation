  terminology: »Lade Jahwes, eures Gottes«, »Söhne Israels« und »Stämme« sind sachgerecht. Die Fußnote erläutert die formelhafte Wendung korrekt; ihr Anker bleibt unmittelbar bei der betreffenden Wendung.
