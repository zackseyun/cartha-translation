source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הֶם֙ יְהוֹשֻׁ֔עַ עִ֠בְרוּ לִ/פְנֵ֨י אֲר֧וֹן יְהוָ֛ה אֱלֹֽהֵי/כֶ֖ם אֶל תּ֣וֹךְ הַ/יַּרְדֵּ֑ן וְ/הָרִ֨ימוּ לָ/כֶ֜ם אִ֣ישׁ אֶ֤בֶן אַחַת֙ עַל שִׁכְמ֔/וֹ לְ/מִסְפַּ֖ר שִׁבְטֵ֥י בְנֵי יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/005.yaml
  text: And Joshua said to them[a], “Cross over before the ark of Yahweh your God into the middle of the Jordan, and let each man lift up one stone on his shoulder, according to the number of the tribes of the sons of Israel.”
translation:
  language: de
  text: 'Und Josua sagte zu ihnen: »Geht vor der Lade Jahwes, eures Gottes, in die Mitte des Jordan, und jeder von euch soll einen Stein auf seine Schulter nehmen, entsprechend der Zahl der Stämme der Söhne Israels.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Söhne Israels«. Die formelhafte hebräische Bezeichnung wird häufig mit »Israeliten« oder »Volk Israel« wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und Josua sagte
  rationale: Der Anschluss mit »Und« bewahrt den fortlaufenden Erzählfluss des hebräischen Wayyiqtol, ohne eine ausdrücklich zeitliche Abstufung hinzuzufügen.
- source_word: עִבְרוּ
  choice: Geht … hinüber
  rationale: Der Imperativ von עבר bezeichnet hier eine Bewegung hinüber beziehungsweise weiter in den Flussbereich; die Wendung ist im modernen Deutsch natürlich.
- source_word: לִפְנֵי
  choice: vor
  rationale: Die räumliche Beziehung zur Lade wird direkt wiedergegeben. Ob die Männer vor die Lade treten oder vor ihr weitergehen, wird nicht unnötig präzisiert.
- source_word: אֲרוֹן יְהוָה אֱלֹהֵיכֶם
  choice: der Lade Jahwes, eures Gottes
  rationale: Die hebräische Genitivverbindung wird klar und knapp wiedergegeben; der Gottesname erscheint in seiner im Deutschen üblichen Form »Jahwe«.
- source_word: אֶל תּוֹךְ הַיַּרְדֵּן
  choice: bis in die Mitte des Jordan
  rationale: תּוֹךְ bezeichnet das Innere beziehungsweise die Mitte; »bis in die Mitte« verdeutlicht das Ziel der Bewegung, ohne es auf bloßes Betreten des Flusses zu reduzieren.
- source_word: וְהָרִימוּ לָכֶם אִישׁ
  choice: Dort soll jeder von euch … heben
  rationale: Die distributive Einzahl אִישׁ wird idiomatisch als »jeder von euch« wiedergegeben. Das ergänzte »Dort« macht im Deutschen den Ortsbezug deutlich, ohne den Sinn zu verändern.
- source_word: אֶבֶן אַחַת עַל שִׁכְמוֹ
  choice: einen Stein auf seine Schulter
  rationale: Numerus und distributive Einzahl des Hebräischen bleiben erhalten; »auf seine Schulter heben« gibt die konkrete Handlung unmittelbar wieder.
- source_word: לְמִסְפַּר
  choice: entsprechend der Zahl
  rationale: Die Präposition bezeichnet die zahlenmäßige Entsprechung zwischen den Steinen und den Stämmen.
- source_word: שִׁבְטֵי בְנֵי יִשְׂרָאֵל
  choice: der Stämme der Söhne Israels
  rationale: Beide Bestandteile der formelhaften hebräischen Bezeichnung bleiben erhalten, statt sie zu »Stämme Israels« oder »Israeliten« zu verkürzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als solcher kenntlich gemacht. »Jahwe« ist die im Deutschen herkömmliche Form der wissenschaftlich weithin angenommenen Aussprache; eine Ersetzung durch einen Titel würde den Namen verdecken.
- issue: Wiedergabe von אִישׁ und בְנֵי יִשְׂרָאֵל
  choice: jeder von euch … die Söhne Israels
  alternative: jeder … die Israeliten
  rationale: »Jeder von euch« wahrt die distributive Anweisung an die ausgewählten Männer, während »Söhne Israels« die formelhafte Bundes- und Abstammungsbezeichnung des Ausgangstextes erhält.
translation_notes:
  register: Moderne, verständliche Standardsprache mit würdigem Erzählton. Die Satzstruktur bleibt nahe am Hebräischen, wird aber durch »Dort soll jeder von euch« idiomatisch gegliedert. Der Fußnotenmarker steht unmittelbar bei der erläuterten Wendung.
