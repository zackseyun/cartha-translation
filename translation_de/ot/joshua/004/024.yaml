  variant: modern standard German
source:
  edition: WLC
  text: לְ֠מַעַן דַּ֜עַת כָּל עַמֵּ֤י הָ/אָ֨רֶץ֙ אֶת יַ֣ד יְהוָ֔ה כִּ֥י חֲזָקָ֖ה הִ֑יא לְמַ֧עַן יְרָאתֶ֛ם אֶת יְהוָ֥ה אֱלֹהֵי/כֶ֖ם כָּל הַ/יָּמִֽים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/024.yaml
  text: so that all the peoples of the earth may know that the hand of Yahweh is strong[b][a], and so that you may fear Yahweh your God all your days.
translation:
  language: de
  text: damit alle Völker der Erde[a] erkennen, dass die Hand Jahwes stark ist, und damit ihr Jahwe, euren Gott, allezeit fürchtet.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle Völker des Landes“, wenn הָאָרֶץ hier örtlich statt weltweit verstanden wird.'
    reason: lexical_alternative
  - marker: b
    text: „Fürchten“ schließt hier Ehrfurcht und heilige Scheu vor Jahwe ein, nicht nur Angst.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: damit
  rationale: Gibt in beiden Satzteilen die Zweckangabe knapp und natürlich wieder.
- source_word: כָּל עַמֵּי הָאָרֶץ
  choice: alle Völker der Erde
  rationale: עַמִּים bezeichnet Völker; הָאָרֶץ wird im Kontext der öffentlich bezeugten Machttat am ehesten global verstanden. Die lokale Lesart bleibt in einer Fußnote erhalten.
- source_word: יַד יְהוָה
  choice: die Hand Jahwes
  rationale: Bewahrt das anschauliche hebräische Bild für Jahwes wirksame Macht, statt es erklärend aufzulösen.
- source_word: כִּי חֲזָקָה הִיא
  choice: dass die Hand Jahwes stark ist
  rationale: Das feminine Pronomen bezieht sich auf יַד; „stark“ entspricht חֲזָקָה unmittelbar und bewahrt die hebräische Aussageform.
- source_word: יְרָאתֶם
  choice: ihr … fürchtet
  rationale: Bewahrt die theologische Spannung des Verbs ירא, das sowohl Furcht als auch ehrfürchtige Scheu einschließt.
- source_word: כָּל הַיָּמִים
  choice: allezeit
  rationale: Gibt die idiomatische Bedeutung einer dauerhaften, lebenslangen Haltung in natürlichem Deutsch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, wodurch der im Hebräischen ausdrücklich verwendete Bundesname sichtbar bleibt.
- issue: Bedeutung von ירא
  choice: fürchten
  alternative: verehren / Ehrfurcht haben vor
  rationale: „Fürchten“ ist die direkte Wiedergabe und erhält sowohl ehrfürchtige Verehrung als auch heilige Scheu, ohne die Spannung einseitig aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus der beiden mit לְמַעַן eingeleiteten Zweckangaben wird durch zweimaliges „damit“ erhalten; das Bild von Jahwes starker Hand bleibt bewusst stehen.
