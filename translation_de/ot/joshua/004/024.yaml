  source_fidelity: Die Übersetzung gibt die beiden mit לְמַעַן eingeleiteten Zweckangaben vollständig und parallel wieder. „alle Völker der Erde“ entspricht כָּל עַמֵּי הָאָרֶץ; die mögliche lokale Bedeutung von הָאָרֶץ ist sachgerecht in Fußnote a vermerkt. „die Hand Jahwes“ bewahrt das hebräische Bild, und „stark“ gibt חֲזָקָה direkt wieder. „allezeit“ vermittelt die dauerhafte Geltung von כָּל הַיָּמִים idiomatisch.
