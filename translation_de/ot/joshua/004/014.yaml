base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/014.yaml
  text: On that day Yahweh made Joshua great in the eyes of all Israel[a], and they feared him just as they had feared Moses all the days of his life.
translation:
  language: de
  text: An jenem Tag machte Jahwe Josua in den Augen von ganz Israel groß. Sie fürchteten ihn[a], wie sie Mose alle Tage seines Lebens gefürchtet hatten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hatten Ehrfurcht vor ihm“ beziehungsweise „begegneten ihm mit Scheu“. Das hebräische Verb kann je nach Zusammenhang Furcht, ehrfürchtige Scheu oder Verehrung ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Die zeitliche Wendung wird im erzählenden Kontext natürlich und zugleich gehoben wiedergegeben.
- source_word: גִּדַּל
  choice: machte … groß
  rationale: Der Piel drückt hier aus, dass Jahwe Josua groß machte beziehungsweise ihm öffentlich Größe und Ansehen verlieh. Die Formulierung bewahrt den kausativen Sinn und das Motiv der Größe.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Wiedergabe des Tetragramms als Eigenname bewahrt den persönlichen Gottesnamen statt ihn durch einen Titel zu ersetzen.
- source_word: בְּעֵינֵי כָּל יִשְׂרָאֵל
  choice: in den Augen ganz Israels
  rationale: Die hebräische Bildrede für öffentliche Wahrnehmung und Einschätzung bleibt erhalten und ist im Deutschen verständlich.
- source_word: וַיִּירְאוּ אֹתוֹ
  choice: Sie fürchteten ihn
  rationale: ירא kann Furcht, Ehrfurcht und Scheu bezeichnen. „fürchteten“ bewahrt die lexikalische Weite und die Parallele zu Mose, ohne die Bedeutung vorschnell auf bloße Achtung zu verengen.
- source_word: כַּאֲשֶׁר יָרְאוּ אֶת מֹשֶׁה
  choice: wie sie Mose … gefürchtet hatten
  rationale: „wie“ gibt den Vergleich natürlich wieder; das Plusquamperfekt verdeutlicht im Deutschen den Rückblick auf Israels Verhältnis zu Mose.
- source_word: כָּל יְמֵי חַיָּיו
  choice: alle Tage seines Lebens
  rationale: Die formnahe Wendung bewahrt Umfang und feierlichen Rhythmus des hebräischen Ausdrucks; das Pronomen bezieht sich im unmittelbaren Zusammenhang am natürlichsten auf Mose.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova
  rationale: Der Eigenname wird nicht durch „der HERR“ ersetzt. „Jahwe“ ist die geläufige deutsche Form der wissenschaftlich begründeten Aussprache.
- issue: Bedeutungsbreite von ירא gegenüber Josua
  choice: fürchteten ihn
  alternative: hatten Ehrfurcht vor ihm
  rationale: Der Wortlaut stellt Israels Haltung zu Josua ausdrücklich der Haltung zu Mose gleich. „fürchteten“ erhält die mögliche Spannung zwischen Furcht, Scheu und Ehrfurcht; die Fußnote macht die kontextuell mögliche Nuance transparent.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräischen Bilder „machte … groß“ und „in den Augen“ bleiben bewusst erhalten; kurze Hauptsätze sorgen dennoch für einen natürlichen Erzählfluss.
