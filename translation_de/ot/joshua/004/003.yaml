base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/003.yaml
  text: and command them[a], saying, ‘Take up for yourselves from here, from the midst of the Jordan, from the place where the priests’ feet stood firm, twelve stones[b], and carry them over with you and set them down at the lodging place where you will spend the night.’
translation:
  language: de
  text: 'und gebietet ihnen: »Nehmt euch von hier, mitten aus dem Jordan, von der Stelle, an der die Füße der Priester fest stehen,[a] zwölf Steine. Tragt sie mit euch hinüber und legt sie im Nachtlager[b] nieder, wo ihr diese Nacht übernachten werdet.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „vom Standplatz der Füße der Priester, fest [stehend/aufgestellt]“; die hebräische Fügung beschreibt den festen Stand ihrer Füße.'
    reason: lexical_alternative
  - marker: b
    text: „Nachtlager“ bezeichnet hier den Ort, an dem Israel nach der Überquerung übernachten sollte, nicht notwendig eine dauerhafte Niederlassung.
    reason: cultural_note
lexical_decisions:
- source_word: וְצַוּוּ
  choice: und gebietet ihnen
  rationale: Der Piel-Imperativ von צוה bezeichnet einen verbindlichen Befehl. „Gebietet“ bewahrt diese Stärke und fügt sich in den fortlaufenden Satz des Kontexts ein.
- source_word: שְׂאוּ לָכֶם
  choice: Nehmt euch
  rationale: נשׂא bezeichnet hier das Aufnehmen der Steine; לָכֶם wird als Beteiligungsdativ mit „euch“ wiedergegeben, ohne privaten Besitz anzudeuten.
- source_word: מִזֶּה מִתּוֹךְ הַיַּרְדֵּן
  choice: von hier, mitten aus dem Jordan
  rationale: 'Die doppelte Ortsangabe bleibt erhalten: Die Steine sollen genau von hier, nämlich aus dem Inneren des Jordan, genommen werden.'
- source_word: מִמַּצַּב רַגְלֵי הַכֹּהֲנִים הָכִין
  choice: von der Stelle, wo die Füße der Priester festen Stand haben
  rationale: מַצָּב bezeichnet einen Standplatz beziehungsweise eine Stelle des Stehens; הָכִין unterstreicht die Festigkeit. Die deutsche Fassung gibt beides natürlich wieder, ohne die schwierige hebräische Fügung stärker als nötig auszudeuten.
- source_word: שְׁתֵּים עֶשְׂרֵה אֲבָנִים
  choice: zwölf Steine
  rationale: Direkte und eindeutige Wiedergabe von Zahlwort und Substantiv.
- source_word: וְהַעֲבַרְתֶּם אוֹתָם עִמָּכֶם
  choice: Tragt sie mit euch hinüber
  rationale: Der Hiphil von עבר bezeichnet hier das Hinüberbringen über den Jordan; „tragt“ entspricht dem konkreten Transport der Steine, עִמָּכֶם der Begleitung.
- source_word: וְהִנַּחְתֶּם אוֹתָם
  choice: und legt sie … nieder
  rationale: Der Hiphil von נוח bedeutet hier, die Steine an einem Ort abzusetzen. „Niederlegen“ ist konkret und in gehobenem modernem Deutsch natürlich.
- source_word: בַּמָּלוֹן
  choice: an dem Nachtlager
  rationale: מָלוֹן bezeichnet einen Ort zum Übernachten beziehungsweise eine nächtliche Raststätte, nicht notwendig eine dauerhafte Siedlung oder ein militärisches Lager.
- source_word: אֲשֶׁר תָּלִינוּ בוֹ הַלָּיְלָה
  choice: an dem ihr diese Nacht bleiben werdet
  rationale: Die Relativkonstruktion und der kontextuelle Zukunftssinn des Imperfekts werden klar wiedergegeben; „diese Nacht“ entspricht הַלָּיְלָה.
