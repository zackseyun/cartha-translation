id: JOS.4.1
reference: Joshua 4:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְהִי֙ כַּ/אֲשֶׁר תַּ֣מּוּ כָל הַ/גּ֔וֹי לַ/עֲב֖וֹר אֶת הַ/יַּרְדֵּ֑ן וַ/יֹּ֣אמֶר יְהוָ֔ה אֶל יְהוֹשֻׁ֖עַ לֵ/אמֹֽר־־־פ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/001.yaml
  text: And it happened[a], when all the nation had finished crossing the Jordan, that Yahweh said to Joshua,
translation:
  language: de
  text: 'Und als das ganze Volk[a] den Jordan überquert hatte, sagte Jahwe zu Josua:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die ganze Nation“. Das Hebräische verwendet für Israel hier eine singularische Kollektivbezeichnung.'
    reason: Lexikalische Alternative und Erläuterung der kollektiven Einzahl.
lexical_decisions:
- source_word: וַיְהִי
  choice: Und als
  rationale: Die hebräische narrative Einleitungsformel führt hier den nächsten Erzählabschnitt ein. Im modernen Deutschen wird ihre Funktion natürlich durch den anschließenden temporalen Satz wiedergegeben; ein zusätzliches „es geschah“ wäre schwerfällig.
- source_word: כַּאֲשֶׁר
  choice: als
  rationale: Leitet einen einmaligen, abgeschlossenen Vorgang in der Vergangenheit ein.
- source_word: תַּמּוּ ... לַעֲבוֹר
  choice: überquert hatte
  rationale: תמם bezeichnet den Abschluss der durch den Infinitiv ausgedrückten Handlung. Das deutsche Plusquamperfekt stellt diesen Abschluss vor dem anschließenden Reden klar dar.
- source_word: כָל הַגּוֹי
  choice: das ganze Volk
  rationale: גּוֹי bezeichnet Israel hier kollektiv. „Das ganze Volk“ ist im Deutschen natürlicher als „die ganze Nation“, während die Fußnote die wörtlichere Möglichkeit festhält.
- source_word: אֶת הַיַּרְדֵּן
  choice: den Jordan
  rationale: Übliche und eindeutige deutsche Bezeichnung des Flusses.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen als gebräuchliche deutsche Umschrift wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: וַיֹּאמֶר ... לֵאמֹר
  choice: sagte ... zu
  rationale: Die feste hebräische Redeeinleitung wird idiomatisch deutsch wiedergegeben; der Doppelpunkt kündigt den in den folgenden Versen einsetzenden Redeinhalt an.
- source_word: יְהוֹשֻׁעַ
  choice: Josua
  rationale: Eingebürgerte deutsche Form des Personennamens.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. „Jahwe“ bewahrt den Charakter eines persönlichen Namens; „der HERR“ wäre eine traditionelle Ersatzlesung, die im Konsonantentext nicht als Titel steht.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Erzählregister. Die hebräische Eröffnungsformel wird im Deutschen nicht mechanisch mit „es geschah“ verdoppelt. Der Doppelpunkt wahrt den offenen Übergang zur folgenden direkten Rede.
