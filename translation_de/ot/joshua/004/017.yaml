base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/017.yaml
  text: So Joshua commanded the priests, saying, “Come up out of the Jordan.”
translation:
  language: de
  text: 'Da befahl Josua den Priestern: »Steigt aus dem Jordan herauf!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: Da befahl
  rationale: צוה bezeichnet einen verbindlichen Befehl. Das konsekutive ו führt die Erzählung fort; »Da« gibt diesen Anschluss im Deutschen natürlich wieder.
- source_word: יְהוֹשֻׁעַ
  choice: Josua
  rationale: Die im Deutschen eingebürgerte Form des Personennamens.
- source_word: אֶת הַכֹּהֲנִים
  choice: den Priestern
  rationale: Obwohl die hebräische Konstruktion die Priester als direktes Objekt von »befehlen« markiert, verlangt idiomatisches Deutsch bei »jemandem befehlen« den Dativ.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv leitet die direkte Rede ein. Ein Doppelpunkt ist im modernen Deutschen natürlicher als die wörtliche Wiedergabe »indem er sagte« oder »mit den Worten«.
- source_word: עֲלוּ
  choice: Steigt … herauf
  rationale: עלה bezeichnet eine Aufwärtsbewegung. »Herauf« bewahrt die Perspektive der Aufforderung und klingt im Zusammenhang mit dem Verlassen des Flussbetts natürlich.
- source_word: מִן הַיַּרְדֵּן
  choice: aus dem Jordan
  rationale: מן bezeichnet hier die Bewegung aus dem Fluss heraus, in dem die Priester standen. Der eingebürgerte Gewässername »Jordan« benötigt keinen Zusatz.
