  source_fidelity: Der Text gibt וַיְצַו als vergangene Erzählhandlung mit angemessener Befehlsstärke wieder. »Da« bildet den erzählerischen Anschluss des Waw-Konsekutivs natürlich ab. »den Priestern« ist die idiomatisch erforderliche deutsche Dativrektion zu »befehlen«. Die Aufforderung »Steigt aus dem Jordan herauf!« entspricht dem Pluralimperativ עֲלוּ und der Ausgangsangabe מִן הַיַּרְדֵּן.
  naturalness: Modernes, klares Standarddeutsch. Der Doppelpunkt ersetzt die hebräische Redeeinleitung לֵאמֹר idiomatisch; die knappe Imperativrede wahrt den erzählerischen und autoritativen Registerton.
  terminology: »Josua«, »Priester« und »Jordan« sind die üblichen deutschen biblischen Bezeichnungen. »befahl« bewahrt die Verbindlichkeit von צוה, ohne eine zusätzliche theologische oder interpretierende Nuance einzutragen.
