  text: לְמַ֗עַן תִּֽהְיֶ֛ה זֹ֥את א֖וֹת בְּ/קִרְבְּ/כֶ֑ם כִּֽי יִשְׁאָל֨וּ/ן בְּנֵי/כֶ֤ם מָחָר֙ לֵ/אמֹ֔ר מָ֛ה הָ/אֲבָנִ֥ים הָ/אֵ֖לֶּה לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/006.yaml
  text: so that this may be a sign among you[a]. When your children ask in time to come, saying[c][b], ‘What do these stones mean to you?’
translation:
  language: de
  text: 'damit dies ein Zeichen in eurer Mitte ist. Wenn eure Kinder künftig fragen: »Was bedeuten euch diese Steine?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַעַן
  choice: damit
  rationale: Leitet den Zweck ein und gibt die finale Bedeutung im Deutschen natürlich wieder.
- source_word: תִּהְיֶה זֹאת אוֹת
  choice: dies ein Zeichen ist
  rationale: Das Imperfekt steht nach der Zweckkonjunktion für das beabsichtigte Ergebnis; der deutsche Indikativ ist hier idiomatisch. זֹאת verweist auf die durch die Steine dargestellte Anordnung.
- source_word: בְּקִרְבְּכֶם
  choice: in eurer Mitte
  rationale: Bezeichnet die Gegenwart des Zeichens innerhalb der Gemeinschaft und wahrt den räumlich-gemeinschaftlichen Ausdruck.
- source_word: כִּי יִשְׁאָלוּן
  choice: Wenn ... fragen
  rationale: כִּי führt hier den erwarteten künftigen Fall ein; „wenn“ gibt diesen Sinn klar wieder.
- source_word: בְּנֵיכֶם
  choice: eure Kinder
  rationale: Wörtlich „eure Söhne“, hier jedoch repräsentativ für die nachfolgende Generation; „Kinder“ gibt den gemeinten Personenkreis natürlich wieder.
- source_word: מָחָר
  choice: künftig
  rationale: מָחָר bedeutet wörtlich „morgen“, bezeichnet in diesem Zusammenhang aber idiomatisch eine spätere Zeit.
- source_word: לֵאמֹר
  choice: nicht eigens wiedergegeben
  rationale: Der hebräische Redeintroduktor wird im Deutschen durch Doppelpunkt und direkte Rede natürlich ausgedrückt.
- source_word: מָה הָאֲבָנִים הָאֵלֶּה לָכֶם
  choice: Was bedeuten euch diese Steine?
  rationale: Die wörtliche Frage „Was sind euch diese Steine?“ zielt auf ihre Bedeutung; die gewählte Form ist idiomatisch und bewahrt durch „euch“ den Bezug לָכֶם.
theological_decisions:
- issue: Geschlechtsspezifische Formulierung bei בְּנֵיכֶם
  choice: eure Kinder
  alternative: eure Söhne
  rationale: Der maskuline Plural bezeichnet hier im Kontext der Erinnerung und Unterweisung repräsentativ die nachfolgende Generation, ohne eine Beschränkung auf männliche Nachkommen zu verlangen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Zweiteilung in zwei Sätze erleichtert den Lesefluss. Die direkte Rede wird mit deutschen Anführungszeichen gesetzt; לֵאמֹר wird nicht schwerfällig als „indem sie sagen“ wiederholt.
