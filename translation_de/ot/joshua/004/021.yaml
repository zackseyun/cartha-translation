source:
  edition: WLC
  text: וַ/יֹּ֛אמֶר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר אֲשֶׁר֩ יִשְׁאָל֨וּ/ן בְּנֵי/כֶ֤ם מָחָר֙ אֶת אֲבוֹתָ֣/ם לֵ/אמֹ֔ר מָ֖ה הָ/אֲבָנִ֥ים הָ/אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/021.yaml
  text: And he said to the sons of Israel[a], “When your children ask their fathers in time to come, saying[c][b], ‘What are these stones?’”
translation:
  language: de
  text: 'Und er sagte zu den Söhnen Israels: „Wenn eure Kinder[b] künftig[c] ihre Väter fragen: ‚Was sind diese Steine[a]?‘“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäßer: „Was bedeuten diese Steine?“ Wörtlich lautet das Hebräische: „Was sind diese Steine?“'
    reason: lexical_alternative
  - marker: b
    text: Hebräisch „eure Söhne“. Gemeint sind hier wahrscheinlich die Kinder oder Nachkommen allgemein.
    reason: lexical_alternative
  - marker: c
    text: Hebräisch „morgen“; hier idiomatisch für eine spätere Zeit oder eine kommende Generation.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und er sagte
  rationale: Die Wayyiqtol-Form führt die nächste Handlung im Erzählverlauf ein; „Und er sagte“ bewahrt den hebräischen Anschluss.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: zu den Söhnen Israels
  rationale: Die Wiedergabe erhält den familiären und bundesbezogenen Ausdruck des Hebräischen; „zu den Israeliten“ wäre glatter, aber weniger quellennah.
- source_word: לֵאמֹר
  choice: durch Doppelpunkt und direkte Rede wiedergegeben
  rationale: Der Infinitiv von אמר dient hier als Redeeinleitung und wird im Deutschen natürlich durch Interpunktion ausgedrückt.
- source_word: אֲשֶׁר יִשְׁאָלוּן
  choice: Wenn … fragen
  rationale: אֲשֶׁר leitet hier eine zukünftige Situation ein; שאל bedeutet gewöhnlich „fragen“.
- source_word: בְּנֵיכֶם
  choice: eure Kinder
  rationale: Wörtlich steht „eure Söhne“; im Zusammenhang bezeichnet der Ausdruck wahrscheinlich die Kinder beziehungsweise Nachkommen allgemein.
- source_word: מָחָר
  choice: künftig
  rationale: „Morgen“ wird hier idiomatisch für eine spätere Zeit beziehungsweise eine kommende Generation gebraucht.
- source_word: אֶת אֲבוֹתָם
  choice: ihre Väter
  rationale: Dies entspricht dem unmittelbaren familiären Bild des hebräischen Ausdrucks; „ihre Vorfahren“ würde den Bezug unnötig erweitern.
- source_word: לֵאמֹר
  choice: durch Doppelpunkt und eingebettete direkte Rede wiedergegeben
  rationale: Die zweite Redeeinleitung führt den Wortlaut der Frage ein; ein zusätzliches „und sagen“ wäre im modernen Deutschen schwerfällig.
- source_word: מָה הָאֲבָנִים הָאֵלֶּה
  choice: Was sind diese Steine?
  rationale: Die Formulierung bewahrt die wörtliche Identifikationsfrage. Die sinngemäße Deutung „Was bedeuten diese Steine?“ wird nicht stillschweigend in den Haupttext übernommen.
