  text: כְּ/אַרְבָּעִ֥ים אֶ֖לֶף חֲלוּצֵ֣י הַ/צָּבָ֑א עָבְר֞וּ לִ/פְנֵ֤י יְהוָה֙ לַ/מִּלְחָמָ֔ה אֶ֖ל עַֽרְב֥וֹת יְרִיחֽוֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/013.yaml
  text: About forty thousand armed for war crossed over before Yahweh for battle[a], to the plains of Jericho.
translation:
  language: de
  text: Etwa vierzigtausend bewaffnete Männer des Heeres zogen vor Jahwe zum Kampf hinüber in die Ebenen von Jericho.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּאַרְבָּעִים אֶלֶף
  choice: etwa vierzigtausend
  rationale: Das vorangestellte כְּ kennzeichnet die Zahl als Näherungsangabe; „etwa“ gibt dies im Deutschen knapp und natürlich wieder.
- source_word: חֲלוּצֵי הַצָּבָא
  choice: bewaffnete Männer des Heeres
  rationale: חֲלוּצִים bezeichnet für den militärischen Einsatz ausgerüstete beziehungsweise bewaffnete Männer. Die Wiedergabe wahrt den Bezug auf das Heer, ohne die Gruppe enger als Vorhut zu bestimmen.
- source_word: עָבְרוּ
  choice: zogen … hinüber
  rationale: עבר bezeichnet im Zusammenhang von Josua 3–4 die Überquerung des Jordan. „hinüberziehen“ erhält diesen erzählerischen Bezug und passt zu einer größeren Truppe.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי bedeutet hier „vor“ beziehungsweise „in der Gegenwart von“. Die knappe räumlich-theologische Formulierung des Hebräischen bleibt erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Text stehende Gottesname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: לַמִּלְחָמָה
  choice: zum Kampf
  rationale: Die Präposition לְ bezeichnet hier Ziel oder Zweck des Hinüberziehens; „zum Kampf“ ist idiomatisch und lässt offen, ob die konkrete Schlacht oder der militärische Einsatz insgesamt gemeint ist.
- source_word: אֶל עַרְבוֹת יְרִיחוֹ
  choice: in die Ebenen von Jericho
  rationale: עַרְבוֹת bezeichnet die flachen Steppen- beziehungsweise Jordantalgebiete. „Ebenen von Jericho“ ist verständlich und bewahrt die Konstruktverbindung ohne den Zusatz „bei“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. „Jahwe“ gibt ihn als Namen wieder, während „der HERR“ ihn traditionsgemäß durch einen Titel ersetzt.
- issue: Bedeutung von „vor Jahwe“
  choice: Die räumlich und theologisch offene Formulierung bleibt stehen.
  alternative: unter Jahwes Führung
  rationale: לִפְנֵי kann Gegenwart, Stellung oder Bewegung vor jemandem ausdrücken. Eine Deutung als ausdrückliche Führung würde den Sinn stärker festlegen, als es der Wortlaut verlangt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hält Zweck und Ziel der Bewegung klar zusammen; „Männer des Heeres“ ist bewusst sachlich und vermeidet sowohl das altertümliche „Heerleute“ als auch die mögliche Überdeutung als „Vorhut“.
