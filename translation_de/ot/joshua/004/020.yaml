  text: And Joshua set up these twelve stones at Gilgal, which they had taken from the Jordan.
translation:
  language: de
  text: Und diese zwölf Steine, die sie aus dem Jordan genommen hatten, richtete Josua in Gilgal auf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵת
  choice: Und
  rationale: וְ verbindet den Vers mit der vorausgehenden Erzählung; der Akkusativmarker אֵת wird im Deutschen nicht eigens wiedergegeben.
- source_word: שְׁתֵּים עֶשְׂרֵה הָאֲבָנִים הָאֵלֶּה
  choice: diese zwölf Steine
  rationale: Die Formulierung gibt Zahl, Substantiv und Demonstrativpronomen vollständig und in natürlicher deutscher Wortstellung wieder.
- source_word: אֲשֶׁר לָקְחוּ
  choice: die sie ... geholt hatten
  rationale: Der Relativsatz bestimmt die Steine näher. Das Plusquamperfekt verdeutlicht natürlich, dass das Holen vor dem Aufrichten geschah; „holen“ passt zum Herausnehmen und Fortbringen der Steine aus dem Jordan.
- source_word: מִן הַיַּרְדֵּן
  choice: aus dem Jordan
  rationale: Bei Gegenständen, die dem Fluss entnommen wurden, ist „aus“ im Deutschen idiomatischer als „von“ und entspricht der Ausgangsbedeutung von מִן.
- source_word: הֵקִים
  choice: richtete ... auf
  rationale: Das Verb bezeichnet hier das Aufstellen bzw. Errichten der Gedenksteine; „aufrichten“ ist präzise, würdig und gut verständlich.
- source_word: יְהוֹשֻׁעַ
  choice: Josua
  rationale: Verwendet die etablierte deutsche Namensform.
- source_word: בַּגִּלְגָּל
  choice: in Gilgal
  rationale: Die Präposition בְּ bezeichnet hier den Ort der Handlung; bei einer benannten Ortschaft ist „in Gilgal“ natürliches Standarddeutsch.
