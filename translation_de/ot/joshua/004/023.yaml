reference: Joshua 4:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֲשֶׁר הוֹבִישׁ֩ יְהוָ֨ה אֱלֹהֵי/כֶ֜ם אֶת מֵ֧י הַ/יַּרְדֵּ֛ן מִ/פְּנֵי/כֶ֖ם עַֽד עָבְרְ/כֶ֑ם כַּ/אֲשֶׁ֣ר עָשָׂה֩ יְהוָ֨ה אֱלֹהֵי/כֶ֧ם לְ/יַם ס֛וּף אֲשֶׁר הוֹבִ֥ישׁ מִ/פָּנֵ֖י/נוּ עַד עָבְרֵֽ/נוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/023.yaml
  text: For Yahweh your God dried up the waters of the Jordan before you until you crossed over[a], just as Yahweh your God did to the Sea of Reeds, which he dried up before us until we crossed over.
translation:
  language: de
  text: Denn Jahwe, euer Gott, trocknete das Wasser des Jordan vor euch aus, bis ihr hinübergezogen wart, genauso wie Jahwe, euer Gott, es mit dem Schilfmeer[a] tat, das er vor uns austrocknete, bis wir hinübergezogen waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: „Rotes Meer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹבִישׁ
  choice: trocknete … aus / austrocknete
  rationale: Der Hifil von יבש bezeichnet hier das Austrocknen beziehungsweise Trockenmachen des Wassers. Die deutschen Formulierungen geben die kausative Bedeutung natürlich wieder und bewahren die Wiederholung des Verbs.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵיכֶם
  choice: euer Gott
  rationale: In Verbindung mit Jahwe ist אֱלֹהִים eindeutig singularisch gemeint; das Suffix bezeichnet die angesprochenen Israeliten.
- source_word: מֵי הַיַּרְדֵּן
  choice: das Wasser des Jordan
  rationale: Im Deutschen ist der kollektive Singular „das Wasser“ idiomatischer als „die Wasser“, ohne das konkrete Bild des Flusswassers aufzugeben.
- source_word: מִפְּנֵיכֶם / מִפָּנֵינוּ
  choice: vor euch / vor uns
  rationale: Die räumliche Wendung wird knapp und natürlich wiedergegeben; der Wechsel von der zweiten zur ersten Person bleibt erhalten.
- source_word: עַד עָבְרְכֶם / עַד עָבְרֵנוּ
  choice: bis ihr hinübergezogen wart / bis wir hinübergezogen waren
  rationale: Die Formulierungen drücken die Dauer bis zum vollendeten Übergang aus und erhalten die bewusste Parallelität beider Satzteile.
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: genauso wie … es … tat
  rationale: Die Wendung stellt ausdrücklich die Entsprechung zwischen dem Jordanübergang und dem früheren Meerübergang heraus.
- source_word: יַם סוּף
  choice: Schilfmeer
  rationale: סוּף bezeichnet Schilf; „Schilfmeer“ folgt daher dem hebräischen Ausdruck genauer als die traditionelle Bezeichnung „Rotes Meer“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn als Namen, ohne ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von יַם סוּף
  choice: Schilfmeer
  alternative: Rotes Meer
  rationale: Der Haupttext folgt der lexikalischen Bedeutung des hebräischen Ausdrucks. Die vertraute traditionelle Bezeichnung wird zur Orientierung in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur und der Wechsel von „euch“ zu „uns“ bleiben erhalten; das Plusquamperfekt markiert jeweils den abgeschlossenen Übergang.
