  text: וְ/הָ/עָ֗ם עָלוּ֙ מִן הַ/יַּרְדֵּ֔ן בֶּ/עָשׂ֖וֹר לַ/חֹ֣דֶשׁ הָ/רִאשׁ֑וֹן וַֽ/יַּחֲנוּ֙ בַּ/גִּלְגָּ֔ל בִּ/קְצֵ֖ה מִזְרַ֥ח יְרִיחֽוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/019.yaml
  text: And the people came up from the Jordan on the tenth day of the first month[b][a], and they camped at Gilgal on the eastern border of Jericho.
translation:
  language: de
  text: Das Volk zog am zehnten Tag des ersten Monats vom Jordan herauf[a] und lagerte bei Gilgal, östlich von Jericho.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zog vom Jordan hinauf«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »am östlichen Ende/Rand von Jericho«; gemeint ist der östliche Bereich bei Jericho.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלוּ
  choice: zog … herauf
  rationale: עלה bezeichnet eine Aufwärtsbewegung und kann je nach Erzählperspektive mit »hinaufziehen« oder »heraufziehen« wiedergegeben werden. »zog … herauf« bewahrt hier die Bewegung vom Flussbett weg.
- source_word: מִן הַיַּרְדֵּן
  choice: vom Jordan
  rationale: Die Präposition מן kennzeichnet den Ausgangspunkt der Bewegung. »Jordan« bezeichnet im Zusammenhang eindeutig den Fluss; der Zusatz »Fluss« ist daher nicht nötig.
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ הָרִאשׁוֹן
  choice: am zehnten Tag des ersten Monats
  rationale: Die hebräische Datumsformel nennt den zehnten Tag im ersten Monat. Das im Hebräischen unausgesprochene »Tag« wird im Deutschen zur Klarheit ergänzt.
- source_word: וַיַּחֲנוּ
  choice: und lagerte
  rationale: חנה bedeutet hier, an einem Ort ein Lager aufzuschlagen. Der Singular entspricht im Deutschen dem Kollektivnomen »Volk«.
- source_word: בַּגִּלְגָּל
  choice: in Gilgal
  rationale: Der Ortsname wird transliteriert. »in Gilgal« ist im Deutschen eine natürliche Ortsangabe.
- source_word: בִּקְצֵה
  choice: am … Rand
  rationale: קָצֶה bezeichnet ein Ende, einen Rand oder eine Grenze. »Rand« gibt die räumliche Aussage verständlich wieder, ohne eine förmliche politische Grenze vorauszusetzen.
- source_word: מִזְרַח יְרִיחוֹ
  choice: östlichen … von Jericho
  rationale: מִזְרָח bezeichnet den Osten beziehungsweise die östliche Seite. Zusammen mit בִּקְצֵה ergibt sich die Ortsangabe »am östlichen Rand von Jericho«; möglich ist auch allgemeiner »östlich von Jericho«.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe hebräische Erzählweise bleibt erhalten; das kollektive »Volk« verlangt im Deutschen die Verbformen im Singular. Die geografische Mehrdeutigkeit der Schlussformulierung wird durch eine Fußnote kenntlich gemacht.
