source:
  edition: WLC
  text: וְ/הַ/כֹּהֲנִ֞ים נֹשְׂאֵ֣י הָ/אָר֗וֹן עֹמְדִים֮ בְּ/ת֣וֹךְ הַ/יַּרְדֵּן֒ עַ֣ד תֹּ֣ם כָּֽל הַ֠/דָּבָר אֲשֶׁר צִוָּ֨ה יְהוָ֤ה אֶת יְהוֹשֻׁ֨עַ֙ לְ/דַבֵּ֣ר אֶל הָ/עָ֔ם כְּ/כֹ֛ל אֲשֶׁר צִוָּ֥ה מֹשֶׁ֖ה אֶת יְהוֹשֻׁ֑עַ וַ/יְמַהֲר֥וּ הָ/עָ֖ם וַֽ/יַּעֲבֹֽרוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/010.yaml
  text: And the priests carrying the ark stood in the midst of the Jordan until everything was finished that Yahweh had commanded Joshua to speak to the people[a], according to all that Moses had commanded Joshua. And the people hurried and crossed over.
translation:
  language: de
  text: Die Priester, die die Bundeslade trugen, standen mitten im Jordan, bis alles vollendet war, was Jahwe Josua geboten hatte, dem Volk mitzuteilen[a] – ganz so, wie Mose es Josua geboten hatte. Das Volk beeilte sich und zog hinüber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „bis die ganze Sache / das ganze Wort vollendet war“. Die Wendung kann alles zusammenfassen, was Jahwe Josua dem Volk mitzuteilen geboten hatte.'
    reason: Die Bedeutungsbreite von דָּבָר („Wort, Sache, Angelegenheit“) und die knappe hebräische Form lassen sich im Haupttext nicht zugleich vollständig abbilden.
lexical_decisions:
- source_word: נֹשְׂאֵי הָאָרוֹן
  choice: die die Bundeslade trugen
  rationale: Die partizipiale Wendung beschreibt die fortdauernde Tätigkeit der Priester. „Bundeslade“ ist im Deutschen die natürliche, kontextuell eindeutige Bezeichnung der Lade.
- source_word: עֹמְדִים
  choice: blieben … stehen
  rationale: Das hebräische Partizip bezeichnet einen andauernden Zustand; „blieben stehen“ gibt diesen Verlauf im Erzählzusammenhang natürlich wieder.
- source_word: בְּתוֹךְ הַיַּרְדֵּן
  choice: mitten im Jordan
  rationale: Gibt die räumliche Bedeutung von בְּתוֹךְ knapp und idiomatisch wieder; der Jordan ist hier als Fluss vorausgesetzt.
- source_word: עַד תֹּם כָּל הַדָּבָר
  choice: bis alles ausgeführt war
  rationale: דָּבָר kann „Wort, Sache, Angelegenheit“ bedeuten. Im Zusammenhang geht es um den vollständigen Vollzug des von Jahwe Angeordneten; „ausgeführt“ bewahrt diesen Handlungsbezug.
- source_word: לְדַבֵּר אֶל הָעָם
  choice: dem Volk zu sagen
  rationale: Die Infinitivkonstruktion bezeichnet, was Josua dem Volk mündlich mitteilen sollte. „Zu sagen“ ist in modernem Deutsch natürlicher als das formalere „zu dem Volk zu reden“.
- source_word: כְּכֹל אֲשֶׁר צִוָּה מֹשֶׁה אֶת יְהוֹשֻׁעַ
  choice: ganz so, wie Mose es Josua geboten hatte
  rationale: כְּכֹל bezeichnet vollständige Übereinstimmung. „Ganz so, wie“ bildet diese Betonung idiomatisch ab.
- source_word: וַיְמַהֲרוּ הָעָם
  choice: Das Volk aber beeilte sich
  rationale: Das Verb bezeichnet Eile. „Aber“ markiert den erzählerischen Übergang und den Kontrast zum fortdauernden Stehen der Priester, ohne einen starken inhaltlichen Gegensatz zu behaupten.
- source_word: וַיַּעֲבֹרוּ
  choice: zog hinüber
  rationale: עבר bezeichnet hier das Überschreiten des Jordan. „Hinüberziehen“ passt zu einem Volk in Bewegung und wahrt den räumlichen Perspektivbezug.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den Eigennamen im Deutschen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Verhältnis zwischen Jahwes Auftrag und Moses Gebot
  choice: Beide Satzteile bleiben nebeneinander stehen
  alternative: Moses Gebot als bloße Wiederholung oder Erklärung von Jahwes Auftrag auslegen
  rationale: Der hebräische Text nennt sowohl Jahwes Auftrag an Josua als auch Moses früheres Gebot. Die Übersetzung wahrt diese Spannung, ohne ihr genaues Verhältnis über den Wortlaut hinaus festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit flüssigem Erzählrhythmus. Die Satzstruktur bleibt eng am Hebräischen, vermeidet jedoch unnatürliche Nominalformulierungen. Der Gedankenstrich verdeutlicht die nachgetragene Übereinstimmung mit Moses Gebot.
