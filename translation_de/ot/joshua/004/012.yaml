base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/012.yaml
  text: And the sons of Reuben[a], the sons of Gad, and the half-tribe of Manasseh crossed over armed before the sons of Israel[c][b], just as Moses had spoken to them.
translation:
  language: de
  text: Und die Söhne Rubens[a], die Söhne Gads und der halbe Stamm Manasse zogen bewaffnet[c] vor den Söhnen Israels[b] hinüber, genauso wie Mose zu ihnen geredet hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Rubeniter, die Gaditer und der halbe Stamm Manasse“. Wörtlicher steht im Hebräischen: „die Söhne Rubens … die Söhne Gads …“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „den Israeliten“. Wörtlicher steht im Hebräischen: „den Söhnen Israels“.'
    reason: lexical_alternative
  - marker: c
    text: Das mit „bewaffnet“ wiedergegebene hebräische Wort kann auch bedeuten, zum Kampf ausgerüstet oder in Schlachtordnung aufgestellt zu sein; vorgeschlagen wurde außerdem die wörtlichere Bedeutung „in Reihen aufgestellt“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: zogen … hinüber
  rationale: עבר bezeichnet hier im Erzählzusammenhang das Überqueren des Jordan. „hinüberziehen“ ist natürliches Deutsch und bewahrt sowohl die Bewegung als auch den Richtungsaspekt.
- source_word: בְּנֵי רְאוּבֵן
  choice: die Söhne Rubens
  rationale: Die hebräische Verwandtschaftsbezeichnung wird sichtbar bewahrt; „die Rubeniter“ wäre idiomatischer, aber weniger quellennah.
- source_word: וּבְנֵי גָד
  choice: die Söhne Gads
  rationale: Die wörtliche Verwandtschaftskonstruktion wird parallel zu „die Söhne Rubens“ wiedergegeben.
- source_word: וַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: der halbe Stamm Manasse
  rationale: Diese geläufige deutsche Form gibt die hebräische Konstruktverbindung klar und knapp wieder.
- source_word: חֲמֻשִׁים
  choice: bewaffnet
  rationale: Im Kontext bezeichnet das Wort die Ausrüstung beziehungsweise Aufstellung zum Kampf. „bewaffnet“ ist die klarste knappe Wiedergabe; die mögliche Nuance „zum Kampf gerüstet/geordnet“ wird in einer Fußnote offengehalten.
- source_word: לִפְנֵי
  choice: vor
  rationale: Die Präposition bezeichnet die Stellung an der Spitze beziehungsweise vor den übrigen Israeliten.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: den Söhnen Israels
  rationale: Die hebräische Wendung wird formal transparent wiedergegeben; „den Israeliten“ ist die natürliche deutsche Alternative.
- source_word: כַּאֲשֶׁר
  choice: genauso wie
  rationale: Die Konjunktion drückt hier die Übereinstimmung mit der früheren Anweisung Moses aus.
- source_word: דִּבֶּר אֲלֵיהֶם מֹשֶׁה
  choice: Mose zu ihnen geredet hatte
  rationale: Das Plusquamperfekt macht deutlich, dass Moses Reden dem Hinüberziehen vorausging. „geredet hatte“ bleibt nahe bei דבר, ohne das im Kontext naheliegende Gebot ausdrücklich in den Text einzutragen.
