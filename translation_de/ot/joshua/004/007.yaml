  source_fidelity: 'Der Entwurf gibt die Satzstruktur und die zentrale Wiederholung des Hebräischen zuverlässig wieder: Das Wasser des Jordan wurde vor der Bundeslade Jahwes abgeschnitten, als die Lade den Jordan durchquerte. Die Bezugnahme von בְּעָבְרוֹ auf die Lade ist korrekt; das deutsche feminine Pronomen folgt dabei richtigerweise dem deutschen Genus von »Lade«. »Das Wasser des Jordan« ist eine idiomatische deutsche Wiedergabe des hebräischen Plurals in dieser Flussbezeichnung.'
  naturalness: Modernes, gut verständliches und zugleich würdiges Standarddeutsch. »Dann sollt ihr ihnen sagen«, »Lade des Bundes Jahwes« und »als Erinnerungszeichen dienen« sind flüssig und dem Register angemessen. Die wiederholte Formulierung »wurde ... abgeschnitten« bewahrt die beabsichtigte rhetorische Wiederholung.
  terminology: »Jahwe« gibt den Gottesnamen als Eigennamen wieder. »Lade des Bundes« entspricht אֲרוֹן בְּרִית, und »Erinnerungszeichen« trifft die Funktion von לְזִכָּרוֹן als dauerhaftem Gedächtniszeichen. »Israeliten« ist im deutschen Haupttext eine natürliche Wiedergabe von לִבְנֵי יִשְׂרָאֵל; die Fußnote dokumentiert die wörtliche Form »Söhnen Israels« und ist korrekt an der betreffenden Bezeichnung verankert.
