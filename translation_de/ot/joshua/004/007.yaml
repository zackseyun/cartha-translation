source:
  edition: WLC
  text: וַ/אֲמַרְתֶּ֣ם לָ/הֶ֗ם אֲשֶׁ֨ר נִכְרְת֜וּ מֵימֵ֤י הַ/יַּרְדֵּן֙ מִ/פְּנֵי֙ אֲר֣וֹן בְּרִית יְהוָ֔ה בְּ/עָבְר/וֹ֙ בַּ/יַּרְדֵּ֔ן נִכְרְת֖וּ מֵ֣י הַ/יַּרְדֵּ֑ן וְ֠/הָיוּ הָ/אֲבָנִ֨ים הָ/אֵ֧לֶּה לְ/זִכָּר֛וֹן לִ/בְנֵ֥י יִשְׂרָאֵ֖ל עַד עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/007.yaml
  text: then you shall say to them[a], ‘The waters of the Jordan were cut off before the ark of the covenant of Yahweh. When it crossed over the Jordan, the waters of the Jordan were cut off.’ And these stones shall be a memorial to the sons of Israel forever.
translation:
  language: de
  text: 'Dann sollt ihr ihnen sagen: »Das Wasser des Jordan wurde vor der Lade des Bundes Jahwes abgeschnitten. Als sie durch den Jordan zog, wurde das Wasser des Jordan abgeschnitten.« Diese Steine sollen den Israeliten[a] für immer als Erinnerungszeichen dienen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »den Söhnen Israels«; gemeint sind die Israeliten.'
    reason: Die Fußnote macht die Form der hebräischen Volksbezeichnung sichtbar, während der Haupttext ihren gemeinten Umfang natürlich wiedergibt.
lexical_decisions:
- source_word: נִכְרְתוּ
  choice: wurde abgeschnitten
  rationale: Das Nifal von כרת bezeichnet hier das Abreißen beziehungsweise Aufhalten des Wasserflusses. Die wiederholte Formulierung bewahrt die auffällige Wiederholung des Hebräischen.
- source_word: מֵימֵי / מֵי הַיַּרְדֵּן
  choice: das Wasser des Jordan
  rationale: Im Deutschen ist der kollektive Singular bei einem Fluss idiomatischer als »die Wasser«, ohne den Sinn des hebräischen Plurals zu verändern.
- source_word: מִפְּנֵי
  choice: vor
  rationale: Die Präposition bezeichnet hier räumlich die Gegenwart beziehungsweise das Herannahen der Lade.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: die Lade des Bundes Jahwes
  rationale: Die Formulierung bildet die hebräische Genitivkette präzise und verständlich ab.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: בְּעָבְרוֹ
  choice: als sie durch den Jordan zog
  rationale: Das Suffix bezieht sich grammatisch auf die Lade. »Durch den Jordan zog« bezeichnet im Deutschen natürlich die Durchquerung des Flussbetts.
- source_word: לְזִכָּרוֹן
  choice: als Erinnerungszeichen
  rationale: Das Wort bezeichnet ein sichtbares, dauerhaftes Zeichen, das die Erinnerung wachhält; »Erinnerungszeichen« ist hier klarer als das mögliche, aber weniger alltägliche »Denkzeichen«.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: den Israeliten
  rationale: Die feste hebräische Volksbezeichnung »Söhne Israels« meint hier das Volk Israel insgesamt. »Israeliten« gibt die Referenz im modernen Deutschen natürlich und ohne unnötige Verengung wieder.
- source_word: עַד עוֹלָם
  choice: für immer
  rationale: Die Wendung bezeichnet unbegrenzte beziehungsweise dauerhafte Geltung und wird idiomatisch mit »für immer« wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. »Jahwe« bewahrt dessen Funktion als Eigenname; die traditionelle Ersetzung durch »der HERR« wird nicht stillschweigend übernommen.
- issue: Referenz von לִבְנֵי יִשְׂרָאֵל
  choice: den Israeliten
  alternative: den Söhnen Israels
  rationale: Die Wendung ist eine gebräuchliche Bezeichnung für die Angehörigen des Volkes Israel und nicht nur für männliche Personen. Die wörtlichere Form bleibt in der Fußnote sichtbar.
- issue: Bezugswort des Suffixes in בְּעָבְרוֹ
  choice: 'die Lade: »als sie ... zog«'
  alternative: als er hindurchzog
  rationale: Das maskuline Suffix stimmt im Hebräischen mit אֲרוֹן (Lade, grammatisch maskulin) überein. Im Deutschen verlangt das feminine Substantiv »Lade« das Pronomen »sie«.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweimalige Aussage, dass das Wasser abgeschnitten wurde, bleibt entsprechend der rhetorischen Wiederholung des Ausgangstextes erhalten. »Lade« folgt dem etablierten biblischen Sprachgebrauch; »Erinnerungszeichen« ist zugleich verständlich und sachlich präzise.
