  text: צַוֵּה֙ אֶת הַ/כֹּ֣הֲנִ֔ים נֹשְׂאֵ֖י אֲר֣וֹן הָ/עֵד֑וּת וְ/יַעֲל֖וּ מִן הַ/יַּרְדֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/016.yaml
  text: Command the priests who carry the ark of the testimony to come up from the Jordan[a].
translation:
  language: de
  text: Befiehl den Priestern, die die Lade des Zeugnisses[a] tragen, aus dem Jordan heraufzusteigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Lade des Zeugen“. Im Hebräischen steht „Zeugnis“, nicht „Bund“, wie in vielen anderen Bezeichnungen der Lade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צַוֵּה
  choice: Befiehl
  rationale: Der Imperativ 2. Person Maskulin Singular von צוה richtet einen unmittelbaren, nachdrücklichen Auftrag an Josua; „Befiehl“ bewahrt diese Aussagekraft knapp und natürlich.
- source_word: הַכֹּהֲנִים
  choice: den Priestern
  rationale: Standardwiedergabe von כהנים mit bestimmtem Artikel; der deutsche Dativ wird durch „befehlen“ verlangt.
- source_word: נֹשְׂאֵי
  choice: die … tragen
  rationale: Das pluralische Qal-Partizip im Status constructus beschreibt die Priester als Träger der Lade; ein Relativsatz ist im modernen Deutschen natürlich.
- source_word: אֲרוֹן הָעֵדוּת
  choice: die Lade des Zeugnisses
  rationale: Die Constructusverbindung wird formal und verständlich wiedergegeben. עֵדוּת bedeutet hier „Zeugnis“ und darf nicht zur vertrauteren „Bundeslade“ harmonisiert werden.
- source_word: וְיַעֲלוּ
  choice: heraufzusteigen
  rationale: עלה bezeichnet das Hinaufgehen beziehungsweise Heraufkommen; im Zusammenhang mit dem Verlassen des Flussbetts gibt „heraufsteigen“ sowohl die Bewegung als auch die Perspektive passend wieder.
- source_word: מִן הַיַּרְדֵּן
  choice: aus dem Jordan
  rationale: מן bezeichnet die Bewegung aus dem Fluss heraus. „Aus dem Jordan“ ist im Deutschen klarer und in diesem räumlichen Zusammenhang natürlicher als „vom Jordan“.
theological_decisions:
- issue: Bezeichnung der Lade
  choice: Lade des Zeugnisses
  alternative: Bundeslade
  rationale: Der masoretische Text hat ausdrücklich עֵדוּת („Zeugnis“), nicht בְּרִית („Bund“). Die Übersetzung bewahrt diese lexikalische und möglicherweise theologisch bedeutsame Abweichung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der direkte Imperativ bleibt erhalten; der Relativsatz sorgt für natürliche Lesbarkeit. Die ungewöhnliche Quellenbezeichnung „Lade des Zeugnisses“ wird bewusst nicht zur traditionellen „Bundeslade“ geglättet.
