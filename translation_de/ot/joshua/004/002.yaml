source:
  edition: WLC
  text: קְח֤וּ לָ/כֶם֙ מִן הָ/עָ֔ם שְׁנֵ֥ים עָשָׂ֖ר אֲנָשִׁ֑ים אִישׁ אֶחָ֥ד אִישׁ אֶחָ֖ד מִ/שָּֽׁבֶט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/002.yaml
  text: Take for yourselves from the people twelve men[a], one man from each tribe.
translation:
  language: de
  text: Nehmt euch aus dem Volk zwölf Männer[a], aus jedem Stamm einen Mann.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich wiederholt das Hebräische die verteilende Wendung: „ein Mann, ein Mann aus einem Stamm“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קְחוּ
  choice: Nehmt
  rationale: Der Qal-Imperativ im Plural von לקח hat die Grundbedeutung „nehmen“. „Nehmt“ bewahrt die direkte Befehlsform, ohne das im Zusammenhang mögliche Auswählen ausdrücklich in das Verb hineinzulegen.
- source_word: לָכֶם
  choice: euch
  rationale: Das ל mit Suffix der 2. Person maskulin Plural hat hier benefaktive beziehungsweise reflexive Kraft. Die Verbindung „Nehmt euch“ gibt diese Nuance im Deutschen knapp und natürlich wieder.
- source_word: מִן הָעָם
  choice: aus dem Volk
  rationale: עָם bezeichnet hier Israel als Volk. „Aus dem Volk“ entspricht der hebräischen Formulierung und ist im Deutschen idiomatisch.
- source_word: שְׁנֵים עָשָׂר אֲנָשִׁים
  choice: zwölf Männer
  rationale: Die Wendung bezeichnet zwölf männliche Personen; „Männer“ ist sachlich und sprachlich präzise.
- source_word: אִישׁ אֶחָד אִישׁ אֶחָד
  choice: aus jedem … einen Mann
  rationale: 'Die Wiederholung drückt eine Verteilung aus: je ein Mann pro Stamm. Die deutsche Formulierung gibt diese Funktion natürlich wieder; die wörtliche Wiederholung wird in der Fußnote dokumentiert.'
- source_word: מִשָּׁבֶט
  choice: aus jedem Stamm
  rationale: שֵׁבֶט bezeichnet in diesem Zusammenhang einen der Stämme Israels. Durch die distributive Konstruktion ist „aus jedem Stamm“ die idiomatische deutsche Wiedergabe.
theological_decisions: []
translation_notes:
  register: Modernes, standardsprachliches und würdiges Deutsch. Die direkte Befehlsform und der benefaktive Zug von לָכֶם bleiben erhalten; die hebräische distributive Wiederholung wird im Haupttext idiomatisch wiedergegeben und in der Fußnote offengelegt.
