  text: And Yahweh said to Joshua,[a]
translation:
  language: de
  text: Und Jahwe sagte zu Josua:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zu sagen“; damit wird die direkte Rede im folgenden Vers eingeleitet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und … sagte
  rationale: Das Waw consecutivum führt die Erzählung weiter. „Und … sagte“ bewahrt den hebräischen Erzählfluss und klingt im Deutschen natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als Gottes persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition bezeichnet hier den Adressaten des Sprechens; „zu“ ist die natürliche deutsche Entsprechung.
- source_word: יְהוֹשֻׁעַ
  choice: Josua
  rationale: Der Personenname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv leitet die im folgenden Vers stehende direkte Rede ein. Im Deutschen gibt ein Doppelpunkt diese Funktion natürlicher wieder als das wörtliche „indem er sprach“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Gottesnamen in der heute üblichen wissenschaftlichen Form wieder, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt lässt erkennen, dass der Satz erst mit der direkten Rede im nächsten Vers inhaltlich fortgesetzt wird.
