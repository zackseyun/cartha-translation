  text: then you shall let your children know[a], saying, ‘Israel crossed this Jordan on dry ground.’
translation:
  language: de
  text: 'Dann sollt ihr euren Kindern[a] mitteilen: »Israel hat diesen Jordan auf trockenem Boden überquert.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »euren Söhnen«. Das hebräische Wort kann speziell männliche Nachkommen oder allgemeiner die Kinder bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹדַעְתֶּם
  choice: Dann sollt ihr … erklären
  rationale: Der Hifil von ידע bedeutet »wissen lassen, bekannt machen, unterrichten«. »Erklären« gibt den verursachenden und unterweisenden Sinn im Zusammenhang natürlich wieder; וְ wird im Anweisungsablauf mit »Dann« wiedergegeben.
- source_word: בְּנֵיכֶם
  choice: euren Kindern
  rationale: בנים kann enger »Söhne« oder weiter »Kinder« bezeichnen. Im Zusammenhang der Weitergabe an die nächste Generation ist »Kinder« angemessen, ohne die mögliche engere Bedeutung zu verschweigen.
- source_word: לֵאמֹר
  choice: Doppelpunkt vor der direkten Rede
  rationale: Das übliche Einleitungselement für den Inhalt einer Äußerung wird im natürlichen modernen Deutsch durch einen Doppelpunkt ausgedrückt.
- source_word: בַּיַּבָּשָׁה
  choice: auf trockenem Boden
  rationale: Das Substantiv bezeichnet trockenes Land beziehungsweise trockenen Boden; die Formulierung betont, dass Israel nicht durch Wasser ging.
- source_word: עָבַר
  choice: hat … durchquert
  rationale: עבר bedeutet hier »hinübergehen, überschreiten«. Mit dem Jordan als direktem Objekt ist »durchqueren« klares, gegenwärtiges Deutsch.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Eigenname bezeichnet hier das Volk.
- source_word: הַיַּרְדֵּן הַזֶּה
  choice: diesen Jordan
  rationale: Der Demonstrativausdruck wird unmittelbar bewahrt. »Jordan« ist im Deutschen als Name des Flusses ohne den Zusatz »Fluss« verständlich.
