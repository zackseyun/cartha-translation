  text: וַ/יְהִ֛י כַּֽ/אֲשֶׁר תַּ֥ם כָּל הָ/עָ֖ם לַֽ/עֲב֑וֹר וַ/יַּעֲבֹ֧ר אֲרוֹן יְהוָ֛ה וְ/הַ/כֹּהֲנִ֖ים לִ/פְנֵ֥י הָ/עָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/011.yaml
  text: And when all the people had finished crossing over[a], the ark of Yahweh and the priests crossed over before the people.
translation:
  language: de
  text: Als das ganze Volk hinübergezogen war, zogen die Lade Jahwes und die Priester vor den Augen des Volkes[a] hinüber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor dem Volk“ oder „dem Volk voraus“. Die hebräische Wendung kann eine Stellung vor dem Volk oder ein Geschehen in seiner Gegenwart bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Als
  rationale: Die Verbindung leitet einen zeitlichen Nebensatz im fortlaufenden Erzählgang ein. Im Deutschen gibt „Als“ dies natürlich wieder, ohne die hebräische Übergangsformel unnötig wörtlich auszubauen.
- source_word: תַּם כָּל הָעָם לַעֲבוֹר
  choice: das ganze Volk vollständig hinübergezogen war
  rationale: תמם bezeichnet den Abschluss eines Vorgangs, während עבר die Bewegung auf die andere Seite ausdrückt. „vollständig … war“ wahrt den Abschlussaspekt; „hinübergezogen“ passt zum kollektiven Subjekt und vermeidet die Ergänzung eines im Vers nicht ausdrücklich genannten Objekts.
- source_word: וַיַּעֲבֹר
  choice: zogen … hinüber
  rationale: Die Wiederholung von עבר wird durch die Wiederholung von „hinüberziehen“ erkennbar gehalten. Das Präteritum führt die deutsche Erzählung natürlich fort.
- source_word: אֲרוֹן יְהוָה
  choice: die Lade Jahwes
  rationale: Die Status-constructus-Verbindung bedeutet „Lade Jahwes“. „Lade“ ist die etablierte, verständliche Bezeichnung für den heiligen Schrein; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: וְהַכֹּהֲנִים
  choice: und die Priester
  rationale: Das וְ koordiniert die Priester grammatisch mit der Lade als Beteiligte am Hinüberziehen. Die Übersetzung bewahrt diese auffällige Formulierung, ohne erklärend hinzuzufügen, dass die Priester die Lade trugen.
- source_word: לִפְנֵי הָעָם
  choice: vor dem Volk
  rationale: לִפְנֵי kann eine räumliche Stellung vor jemandem oder das Geschehen in dessen Gegenwart beziehungsweise vor dessen Augen bezeichnen. Die knappe deutsche Wendung bewahrt diese Mehrdeutigkeit.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Beziehung zwischen Lade, Priestern und Volk
  choice: die Lade Jahwes und die Priester … vor dem Volk
  alternative: die Priester zogen mit der Lade Jahwes vor den Augen des Volkes hinüber
  rationale: Die gewählte Fassung erhält sowohl die grammatische Koordination von Lade und Priestern als auch die Bedeutungsbreite von לִפְנֵי. Die Alternative wäre erklärender, würde aber Tragebeziehung und Anwesenheitssinn stärker festlegen als dieser Satz allein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweimalige Verwendung von „hinüberziehen“ bildet die Wiederholung des hebräischen Verbs עבר ab. Die ungewöhnliche Aussage, dass auch die Lade hinüberzog, bleibt als Ausdrucksweise des Ausgangstextes erhalten.
