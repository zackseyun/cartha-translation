source:
  edition: WLC
  text: וַ֠/יְהִי ב/עלות הַ/כֹּהֲנִ֜ים נֹשְׂאֵ֨י אֲר֤וֹן בְּרִית יְהוָה֙ מִ/תּ֣וֹךְ הַ/יַּרְדֵּ֔ן נִתְּק֗וּ כַּפּוֹת֙ רַגְלֵ֣י הַ/כֹּהֲנִ֔ים אֶ֖ל הֶ/חָרָבָ֑ה וַ/יָּשֻׁ֤בוּ מֵֽי הַ/יַּרְדֵּן֙ לִ/מְקוֹמָ֔/ם וַ/יֵּלְכ֥וּ כִ/תְמוֹל שִׁלְשׁ֖וֹם עַל כָּל גְּדוֹתָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/018.yaml
  text: And it happened[a], when the priests carrying the ark of the covenant of Yahweh came up from the midst of the Jordan, and the soles of the priests’ feet were lifted up to the dry ground[b], that the waters of the Jordan returned to their place and went as before over all its banks.
translation:
  language: de
  text: 'Und es geschah: Als die Priester, die die Lade des Bundes Jahwes trugen, aus der Mitte des Jordan heraufstiegen und ihre Fußsohlen auf das Trockene gehoben wurden, kehrte das Wasser des Jordan an seinen Ort zurück und floss wie zuvor[a] über alle seine Ufer hinweg.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wie gestern und vorgestern“; eine hebräische Wendung für „wie zuvor“ oder „wie früher“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Und es geschah
  rationale: Die hebräische Erzählungsformel leitet das nächste Ereignis ein. Die Wiedergabe ist würdevoll, verständlich und bewahrt die narrative Funktion.
- source_word: בַעֲלוֹת
  choice: Als … heraufstiegen
  rationale: Der Infinitiv mit בְּ bezeichnet den zeitlichen Umstand; „heraufstiegen“ gibt die Bewegung aus dem Flussbett heraus wieder.
- source_word: נֹשְׂאֵי אֲרוֹן בְּרִית יְהוָה
  choice: die die Lade des Bundes Jahwes trugen
  rationale: Die Partizipialkonstruktion wird als natürlicher deutscher Relativsatz wiedergegeben; die hebräische Genitivkette bleibt transparent.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מִתּוֹךְ הַיַּרְדֵּן
  choice: aus der Mitte des Jordan
  rationale: תּוֹךְ bezeichnet hier das Innere beziehungsweise die Mitte des Flusses, nicht lediglich das Ufer.
- source_word: נִתְּקוּ כַּפּוֹת רַגְלֵי הַכֹּהֲנִים אֶל הֶחָרָבָה
  choice: ihre Fußsohlen auf das Trockene gehoben wurden
  rationale: Die Formulierung bewahrt das Passiv und die körperliche Bewegung aus dem Flussbett auf trockenen Grund, ohne das Verb mechanisch als „abgetrennt“ wiederzugeben.
- source_word: וַיָּשֻׁבוּ מֵי הַיַּרְדֵּן לִמְקוֹמָם
  choice: kehrte das Wasser des Jordan an seinen Ort zurück
  rationale: Im Deutschen wird das kollektiv verstandene „Wasser“ im Singular natürlich wiedergegeben; die räumliche Aussage des Hebräischen bleibt erhalten.
- source_word: וַיֵּלְכוּ
  choice: floss
  rationale: Bei Wasser bezeichnet הלך hier dessen Bewegung; „floss“ ist im Deutschen idiomatisch und hält den konkreten Sinn fest.
- source_word: כִתְמוֹל שִׁלְשׁוֹם
  choice: wie zuvor
  rationale: Die wörtliche Wendung „wie gestern und vorgestern“ ist ein hebräisches Idiom für den früheren beziehungsweise gewöhnlichen Zustand.
- source_word: עַל כָּל גְּדוֹתָיו
  choice: über alle seine Ufer
  rationale: Die formal nahe Wiedergabe wahrt das Bild eines bis an beziehungsweise über die Ufer reichenden Jordan; die mögliche Nuance wird in einer Fußnote offengehalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. Die Wiedergabe als „Jahwe“ bewahrt den persönlichen Namen, ohne eine konfessionelle Deutung hinzuzufügen.
- issue: Zuordnung des Bundes in אֲרוֹן בְּרִית יְהוָה
  choice: die Lade des Bundes Jahwes
  alternative: Jahwes Bundeslade
  rationale: Die transparente Genitivkonstruktion lässt die Beziehung zwischen Lade, Bund und Jahwe sichtbar und vermeidet eine über die Syntax hinausgehende Präzisierung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erkennbarer hebräischer Erzählungsstruktur. Die Satzfolge bleibt nah am Ausgangstext, während „floss“ und der Relativsatz natürliches Deutsch sichern. Der Gottesname erscheint als „Jahwe“.
