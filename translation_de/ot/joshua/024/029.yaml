  text: וַ/יְהִ֗י אַֽחֲרֵי֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה וַ/יָּ֛מָת יְהוֹשֻׁ֥עַ בִּן נ֖וּן עֶ֣בֶד יְהוָ֑ה בֶּן מֵאָ֥ה וָ/עֶ֖שֶׂר שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/029.yaml
  text: And it happened after these things that Joshua son of Nun[a], the servant of Yahweh, died[b], being one hundred and ten years old.
translation:
  language: de
  text: Und es geschah nach diesen Dingen, dass Josua, der Sohn Nuns, der Diener Jahwes[b], im Alter von 110 Jahren starb.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Oder: „Knecht Jahwes“. Das hebräische Wort kann auch „Sklave“ bedeuten; hier dient es als Ehrentitel für Josuas Dienst an Jahwe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Und es geschah
  rationale: Die Erzählform von היה führt das nächste Geschehen in der Abfolge ein. „Und es geschah“ bildet diese Funktion würdig und verständlich ab.
- source_word: אַחֲרֵי הַדְּבָרִים הָאֵלֶּה
  choice: nach diesen Dingen
  rationale: Die Formulierung bleibt nahe am mehrdeutigen דְּבָרִים; im Kontext ist auch „nach diesen Ereignissen“ möglich.
- source_word: וַיָּמָת
  choice: starb
  rationale: מות bezeichnet ohne beschönigende Umschreibung das Sterben.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Josua, der Sohn Nuns
  rationale: Die eingebürgerte deutsche Namensform „Josua“ und die natürliche deutsche Wiedergabe der Abstammungsangabe werden verwendet.
- source_word: עֶבֶד יְהוָה
  choice: der Diener Jahwes
  rationale: עֶבֶד kann „Diener“, „Knecht“ oder „Sklave“ bedeuten. Hier ist es ein Ehrentitel für Josuas Dienst an Jahwe; „Diener“ gibt diese Funktion in heutigem Deutsch angemessen wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בֶּן מֵאָה וָעֶשֶׂר שָׁנִים
  choice: im Alter von 110 Jahren
  rationale: Dies gibt die hebräische Altersangabe idiomatisch und präzise auf Deutsch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. „Jahwe“ bewahrt ihn als Namen, statt ihn durch den traditionellen Titel „der HERR“ zu ersetzen.
- issue: Bedeutungsumfang von עֶבֶד als Bezeichnung Josuas
  choice: Diener
  alternative: Knecht; Sklave
  rationale: Der Ausdruck bezeichnet hier Josuas ehrenvollen Dienst für Jahwe. „Diener“ wahrt diesen Sinn, ohne die lexikalisch mögliche Bedeutung „Sklave“ zum Schwerpunkt zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die einleitende Erzählformel bleibt erhalten; die Altersangabe wird idiomatisch formuliert. Die Fußnoten bewahren die Bedeutungsbreite von דְּבָרִים und עֶבֶד.
