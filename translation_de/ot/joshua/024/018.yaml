  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְגָ֨רֶשׁ יְהוָ֜ה אֶת כָּל הָ/עַמִּ֗ים וְ/אֶת הָ/אֱמֹרִ֛י יֹשֵׁ֥ב הָ/אָ֖רֶץ מִ/פָּנֵ֑י/נוּ גַּם אֲנַ֨חְנוּ֙ נַעֲבֹ֣ד אֶת יְהוָ֔ה כִּי ה֖וּא אֱלֹהֵֽי/נוּ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/018.yaml
  text: And Yahweh drove out from before us all the peoples[a], including the Amorites who lived in the land. We also will serve Yahweh, for he is our God.
translation:
  language: de
  text: Und Jahwe vertrieb alle Völker vor uns, auch die Amoriter, die im Land lebten.[a] Auch wir wollen Jahwe dienen, denn er ist unser Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und die Amoriter, die das Land bewohnten“.'
    reason: Das hebräische וְ kann hier als einfache Verbindung statt als einschließendes oder hervorhebendes „auch“ verstanden werden.
lexical_decisions:
- source_word: וַיְגָרֶשׁ
  choice: vertrieb
  rationale: גרש bezeichnet das Vertreiben oder Fortschaffen. „Vertrieb“ gibt die gewaltsame Entfernung knapp und natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כָּל הָעַמִּים
  choice: alle Völker
  rationale: Der Plural עמים bezeichnet hier mehrere ethnisch-politische Gruppen; „Völker“ ist im Deutschen klar und idiomatisch.
- source_word: וְאֶת הָאֱמֹרִי
  choice: auch die Amoriter
  rationale: Das singularische Kollektiv הָאֱמֹרִי wird im Deutschen natürlich als „die Amoriter“ wiedergegeben. „Auch“ lässt offen, ob sie ergänzend oder hervorhebend genannt werden.
- source_word: יֹשֵׁב הָאָרֶץ
  choice: die im Land lebten
  rationale: Das Partizip bezeichnet die im Land ansässigen Amoriter; der Relativsatz ist modernes, natürliches Deutsch.
- source_word: מִפָּנֵינוּ
  choice: vor uns
  rationale: Die hebräische Wendung bedeutet wörtlich „von vor unserem Angesicht“ und beschreibt hier, dass Jahwe die Völker vor Israel entfernte.
- source_word: גַּם אֲנַחְנוּ
  choice: Auch wir
  rationale: Die Formulierung betont die entsprechende Verpflichtung der Sprecher und spiegelt die hebräische Wortstellung.
- source_word: נַעֲבֹד
  choice: wollen … dienen
  rationale: עבד umfasst hier Bundesloyalität und Gottesverehrung. „Dienen“ bewahrt diese Bedeutungsbreite; „wollen“ gibt den entschlossenen Kohortativwert der unvollendeten Verbform im Kontext wieder.
- source_word: כִּי הוּא אֱלֹהֵינוּ
  choice: denn er ist unser Gott
  rationale: כִּי leitet die Begründung der Selbstverpflichtung ein; „denn“ ist würdig und gut verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den persönlichen Gottesnamen ausdrücklich. Die Transliteration bewahrt diesen Unterschied gegenüber einem bloßen Titel.
- issue: Bedeutungsumfang von עבד im Bundeskontext
  choice: dienen
  alternative: verehren
  rationale: Das Verb schließt Verehrung ein, bezeichnet aber umfassender Dienst, Zugehörigkeit und Loyalität. „Dienen“ verengt es nicht auf kultische Handlungen.
- issue: Verhältnis der Amoriter zu „allen Völkern“
  choice: auch die Amoriter
  alternative: einschließlich der Amoriter
  rationale: Das hebräische וְ kann einfache Ergänzung oder eine hervorhebende nähere Bestimmung ausdrücken. Der Haupttext bewahrt diese Offenheit; die Fußnote nennt die alternative Struktur.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze Satzstruktur und geläufiger Wortschatz; der Gottesname bleibt als „Jahwe“ erhalten. Die Fußnote markiert die syntaktische Mehrdeutigkeit bei der Nennung der Amoriter.
