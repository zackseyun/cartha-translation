  text: וַ/יִּקְבְּר֤וּ אֹת/וֹ֙ בִּ/גְב֣וּל נַחֲלָת֔/וֹ בְּ/תִמְנַת סֶ֖רַח אֲשֶׁ֣ר בְּ/הַר אֶפְרָ֑יִם מִ/צְּפ֖וֹן לְ/הַר גָּֽעַשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/030.yaml
  text: And they buried him within the territory of his inheritance[a], at Timnath-serah, which is in the hill country of Ephraim, north of Mount Gaash.
translation:
  language: de
  text: Und sie begruben ihn im Gebiet seines Erbbesitzes[a], in Timnat-Serach, im Bergland Ephraims, nördlich des Berges Gaasch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an der Grenze seines Erbbesitzes“. Das hebräische Wort kann sowohl eine Grenze als auch das von ihr umschlossene Gebiet bezeichnen; hier ist wahrscheinlich das Gebiet von Josuas zugeteiltem Erbbesitz gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: Und sie begruben ihn
  rationale: Das Wayyiqtol führt das nächste Ereignis der Erzählung fort; אֹתוֹ bezeichnet Josua als direktes Objekt.
- source_word: בִּגְבוּל נַחֲלָתוֹ
  choice: im Gebiet seines Erbbesitzes
  rationale: גְּבוּל kann Grenze oder das von ihr umschlossene Gebiet bedeuten. Im Zusammenhang mit Josuas Bestattungsort ist das Gebiet seines zugeteilten Landbesitzes gemeint; „Erbbesitz“ bewahrt den landtheologischen Sinn von נַחֲלָה.
- source_word: בְּתִמְנַת סֶרַח
  choice: in Timnat-Serach
  rationale: Der Ortsname wird in einer im Deutschen üblichen, quellennahen Form wiedergegeben; die Präposition bezeichnet den Bestattungsort.
- source_word: בְּהַר אֶפְרָיִם
  choice: im Bergland Ephraim
  rationale: הַר bezeichnet hier die gebirgige Region Ephraims, nicht einen einzelnen Berg.
- source_word: מִצְּפוֹן לְהַר גָּעַשׁ
  choice: nördlich vom Berg Gaasch
  rationale: Die Präpositionsverbindung gibt die Lage relativ zum Berg Gaasch an.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. „Erbbesitz“ ist verständlich und erhält zugleich den für das Buch Josua wichtigen Gedanken des zugeteilten Landes. Die knappe geografische Satzstruktur des Hebräischen bleibt gewahrt.
