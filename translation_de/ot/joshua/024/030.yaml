  source_fidelity: Der Entwurf gibt die Handlung, den Bestattungsort, Josuas Erbbesitz und die Lage nördlich des Berges Gaasch zutreffend wieder. Die geographische Zuordnung zu Ephraim sollte jedoch expliziter und idiomatischer als „im Bergland Ephraims“ formuliert werden; dies entspricht der hebräischen Relativbestimmung אֲשֶׁר בְּהַר אֶפְרָיִם.
  naturalness: „Nördlich des Berges Gaasch“ ist im modernen Standarddeutsch stilistisch klarer als „nördlich vom Berg Gaasch“. Die appositionelle Ortsangabe mit Kommas ist natürlich und bewahrt die knappe Erzählweise.
  terminology: „Erbbesitz“ ist eine angemessene Wiedergabe von נַחֲלָה im Kontext der Landzuteilung. „Timnat-Serach“ und „Gaasch“ sind quellennahe, im Deutschen gebräuchliche Namensformen. „Bergland Ephraims“ gibt הַר אֶפְרָיִם als Region, nicht als einzelnen Berg, korrekt wieder.
