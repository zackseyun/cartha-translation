  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֶל הָ/עָ֗ם עֵדִ֤ים אַתֶּם֙ בָּ/כֶ֔ם כִּֽי אַתֶּ֞ם בְּחַרְתֶּ֥ם לָ/כֶ֛ם אֶת יְהוָ֖ה לַ/עֲבֹ֣ד אוֹת֑/וֹ וַ/יֹּאמְר֖וּ עֵדִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/022.yaml
  text: Then Joshua said to the people[a], “You are witnesses against yourselves that you have chosen Yahweh for yourselves, to serve him.” And they said, “We are witnesses.”
translation:
  language: de
  text: 'Da sagte Josua zum Volk: „Ihr seid Zeugen gegen euch selbst[a], dass ihr euch dafür entschieden habt, Jahwe zu dienen.“ Sie antworteten: „Wir sind Zeugen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ihr seid euch selbst Zeugen“; das heißt, eure eigenen Worte bezeugen eure Entscheidung.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Narrativ-Waw führt die Handlung weiter; „Da sagte“ gibt die zeitliche Folge im Deutschen natürlich wieder.
- source_word: הָעָם
  choice: das Volk
  rationale: עָם bezeichnet hier das versammelte Bundesvolk; „das Volk“ ist die geläufige und kontextgerechte Wiedergabe.
- source_word: עֵדִים אַתֶּם בָּכֶם
  choice: Ihr seid Zeugen gegen euch selbst
  rationale: Die Präposition ב kann in diesem rechtlich-bundestheologischen Zusammenhang ausdrücken, dass die eigene Aussage als Zeugnis auf die Sprechenden zurückfällt. Die Fußnote bewahrt die echte Übersetzungsalternative.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt ihres Zeugnisses ein.
- source_word: בְּחַרְתֶּם לָכֶם
  choice: ihr euch dafür entschieden habt
  rationale: Die reflexive Formulierung macht deutlich, dass es ihre eigene Wahl ist. „Sich dafür entscheiden“ ist natürliches modernes Deutsch und bewahrt diesen Nachdruck.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לַעֲבֹד אֹתוֹ
  choice: Jahwe zu dienen
  rationale: עבד umfasst im Bundeskontext treuen Dienst und Anbetung; „dienen“ bewahrt die größere Bedeutungsbreite.
- source_word: וַיֹּאמְרוּ עֵדִים
  choice: 'Sie antworteten: „Wir sind Zeugen.“'
  rationale: Die knappe hebräische Antwort ist elliptisch. „Wir sind“ wird für idiomatisches Deutsch ergänzt; „antworteten“ gibt die Gesprächsfunktion natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova
  rationale: Der hebräische Text gebraucht das Tetragramm als persönlichen Gottesnamen. „Jahwe“ ist die übliche wissenschaftlich begründete deutsche Umschrift und vermeidet die Ersetzung durch einen Titel.
- issue: Rechtliche Stoßrichtung von עֵדִים אַתֶּם בָּכֶם
  choice: Zeugen gegen euch selbst
  alternative: Zeugen für euch selbst / euch selbst gegenüber
  rationale: Im Bundesschluss erhält die eigene Erklärung bindende Beweiskraft und kann gegen die Sprechenden zeugen. Da die Präposition jedoch mehrdeutig ist, wird die alternative Auffassung in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die direkte Rede bleibt knapp; die hebräische Mehrdeutigkeit in בָּכֶם wird nicht im Haupttext überladen, sondern in der Fußnote bewahrt.
