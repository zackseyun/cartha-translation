  source_fidelity: 'Der Entwurf gibt die Abfolge und die zentralen Begriffe des Hebräischen zuverlässig wieder: Josua schließt einen Bund mit dem Volk, setzt ihm eine rechtliche Ordnung fest, und Sichem bleibt als Handlungsort erhalten. Die kollektive singularische Rückverweisung in »ihm« entspricht dem hebräischen לוֹ, ohne eine theologische Bundespartei hinzuzufügen.'
