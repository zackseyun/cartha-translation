id: JOS.24.25
reference: Joshua 24:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּכְרֹ֨ת יְהוֹשֻׁ֧עַ בְּרִ֛ית לָ/עָ֖ם בַּ/יּ֣וֹם הַ/ה֑וּא וַ/יָּ֥שֶׂם ל֛/וֹ חֹ֥ק וּ/מִשְׁפָּ֖ט בִּ/שְׁכֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/025.yaml
  text: So Joshua made a covenant with the people on that day[b][a], and there in Shechem he set for them a statute and an ordinance.
translation:
  language: de
  text: An diesem Tag schloss Josua einen Bund mit dem Volk[a] und setzte ihm in Sichem Satzung und Recht fest[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »schnitt einen Bund mit dem Volk«; dies ist die hebräische Ausdrucksweise für den Abschluss eines Bundes.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »gab ihm Satzung und Rechtsordnung« beziehungsweise »Satzung und Rechtsentscheid«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: schloss ... einen Bund
  rationale: Die hebräische Wendung bedeutet wörtlich »einen Bund schneiden«. Im Deutschen ist »einen Bund schließen« die natürliche und zugleich präzise Entsprechung.
- source_word: לָעָם
  choice: mit dem Volk
  rationale: Das ל bezeichnet in Verbindung mit der Bundesformel die beteiligte Partei. »Mit dem Volk« gibt diese Beziehung idiomatisch wieder.
- source_word: בַּיּוֹם הַהוּא
  choice: An diesem Tag
  rationale: Die Zeitangabe wird unmittelbar und in natürlichem Deutsch wiedergegeben.
- source_word: וַיָּשֶׂם
  choice: setzte ... fest
  rationale: שׂים bedeutet grundsätzlich »setzen, stellen, festlegen«; bei rechtlichen Bestimmungen ist »festsetzen« eine natürliche Entsprechung.
- source_word: לוֹ
  choice: ihm
  rationale: Das Pronomen steht im Hebräischen im Singular und bezieht sich auf das kollektiv verstandene »Volk«. Diese grammatische Form lässt sich im Deutschen mit »ihm« bewahren.
- source_word: חֹק וּמִשְׁפָּט
  choice: Satzung und Recht
  rationale: חֹק bezeichnet eine verbindliche Festsetzung oder Satzung; מִשְׁפָּט kann Recht, Rechtsordnung oder Rechtsentscheid bezeichnen. Das Paar »Satzung und Recht« erhält die knappe rechtliche Formel und ihre Bedeutungsbreite.
- source_word: בִּשְׁכֶם
  choice: in Sichem
  rationale: Die Ortsangabe wird ohne die im Hebräischen nicht ausdrücklich vorhandene Ergänzung »dort« wiedergegeben; »Sichem« ist die etablierte deutsche biblische Namensform.
theological_decisions:
- issue: Art von Josuas Bundesschluss
  choice: Josua schloss einen Bund mit dem Volk
  alternative: Josua erneuerte den Bund für das Volk beziehungsweise im Namen des Volkes
  rationale: Der Vers nennt Josua als handelndes Subjekt und das Volk als beteiligte Partei, ohne hier den HERRN ausdrücklich als Bundespartei zu wiederholen. Die Übersetzung bewahrt diesen Wortlaut und ergänzt keine aus dem weiteren Kontext erschlossene Deutung.
- issue: Bedeutung der rechtlichen Doppelformel
  choice: Satzung und Recht
  alternative: Gesetz und Rechtsordnung; Satzung und Rechtsentscheid
  rationale: Die beiden Begriffe überschneiden sich semantisch und können sowohl konkrete Bestimmungen als auch eine Rechtsordnung bezeichnen. Die knappe Paarformel bewahrt diese Spannung, während die Fußnote die mögliche Wiedergabe erläutert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle und verständliche Wendung »einen Bund schließen« gibt das hebräische Idiom natürlich wieder. »Satzung und Recht« hält die rechtliche Doppelformel knapp und lässt ihre genuine Bedeutungsbreite bestehen.
