id: JOS.24.14
reference: Joshua 24:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/עַתָּ֞ה יְר֧אוּ אֶת יְהוָ֛ה וְ/עִבְד֥וּ אֹת֖/וֹ בְּ/תָמִ֣ים וּ/בֶֽ/אֱמֶ֑ת וְ/הָסִ֣ירוּ אֶת אֱלֹהִ֗ים אֲשֶׁר֩ עָבְד֨וּ אֲבוֹתֵי/כֶ֜ם בְּ/עֵ֤בֶר הַ/נָּהָר֙ וּ/בְ/מִצְרַ֔יִם וְ/עִבְד֖וּ אֶת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/014.yaml
  text: Now fear Yahweh and serve him with integrity and faithfulness[a], and put away the gods that your fathers served beyond the River and in Egypt[b], and serve Yahweh.
translation:
  language: de
  text: Und nun fürchtet Jahwe und dient ihm aufrichtig und treu[a]. Schafft die Götter fort, denen eure Väter jenseits des Stroms[b] und in Ägypten gedient haben, und dient Jahwe!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: »in Lauterkeit und Wahrheit«; die hebräischen Wörter bezeichnen Ganzheit und Aufrichtigkeit sowie Wahrheit, Verlässlichkeit und Treue.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist der Euphrat.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt den folgernden Diskursanschluss des hebräischen Ausdrucks und leitet Josuas abschließende Aufforderung natürlich ein.
- source_word: יְרָאוּ אֶת־יְהוָה
  choice: fürchtet Jahwe
  rationale: „Fürchtet“ erhält die theologische Spannung zwischen Furcht, Ehrfurcht und gehorsamer Bundestreue; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: וְעִבְדוּ אֹתוֹ
  choice: und dient ihm
  rationale: „Dienen“ umfasst sowohl gottesdienstliche Verehrung als auch Gehorsam und Loyalität und bildet die Wiederholung am Versende ab.
- source_word: בְּתָמִים וּבֶאֱמֶת
  choice: aufrichtig und treu
  rationale: Die Kombination gibt ungeteilte Lauterkeit sowie Wahrheit, Verlässlichkeit und Treue in natürlichem Deutsch wieder, ohne sündlose Vollkommenheit zu behaupten.
- source_word: וְהָסִירוּ אֶת־אֱלֹהִים
  choice: Schafft die Götter fort
  rationale: Gibt die nachdrückliche Aufforderung wieder, rivalisierende Gottheiten zu beseitigen; ein Zusatz wie „fremden“ steht nicht im Hebräischen.
- source_word: אֲבוֹתֵיכֶם
  choice: eure Väter
  rationale: Entspricht der ausdrücklich maskulinen Bezeichnung im Ausgangstext und verweist hier auf die Vorväter.
- source_word: בְּעֵבֶר הַנָּהָר
  choice: jenseits des Stroms
  rationale: Bewahrt die konventionelle, aber im Haupttext nicht ausdrücklich aufgelöste geografische Bezeichnung; der Euphrat wird in der Fußnote identifiziert.
- source_word: וּבְמִצְרַיִם
  choice: und in Ägypten
  rationale: Direkte und natürliche Wiedergabe der Ortsangabe.
- source_word: וְעִבְדוּ אֶת־יְהוָה
  choice: und dient Jahwe
  rationale: Erhält die wiederholte Aufforderung und das verbindende hebräische Waw; der Kontrast zu den Göttern bleibt aus dem Zusammenhang deutlich.
theological_decisions:
- issue: Wiedergabe des Bundesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als solcher erkennbar wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von ירא
  choice: fürchtet
  alternative: verehrt
  rationale: „Fürchtet“ bewahrt die kräftige biblische Ausdrucksweise und lässt Ehrfurcht und Furcht nebeneinander bestehen, statt die Spannung abzuschwächen.
- issue: Wiedergabe von בְּתָמִים וּבֶאֱמֶת
  choice: aufrichtig und treu
  alternative: in Lauterkeit und Wahrheit
  rationale: Die gewählte Fassung ist gegenwärtiges, verständliches Deutsch und bringt Ganzheit beziehungsweise Aufrichtigkeit sowie Verlässlichkeit beziehungsweise Treue zum Ausdruck.
- issue: Wiedergabe von אֲבוֹתֵיכֶם
  choice: eure Väter
  alternative: eure Vorfahren
  rationale: Die Formulierung folgt der maskulinen Ausgangsbezeichnung, ohne den historischen Bezug auf die Vorväter zu neutralisieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Imperative sind klar und eindringlich; „Jahwe“, „fürchtet“ und „dient“ bewahren die biblisch-theologische Prägung. Alle Fußnotenmarker stehen unmittelbar bei der jeweils erläuterten Formulierung.
