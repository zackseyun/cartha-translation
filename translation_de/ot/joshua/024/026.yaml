  text: וַ/יִּכְתֹּ֤ב יְהוֹשֻׁ֨עַ֙ אֶת הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה בְּ/סֵ֖פֶר תּוֹרַ֣ת אֱלֹהִ֑ים וַ/יִּקַּח֙ אֶ֣בֶן גְּדוֹלָ֔ה וַ/יְקִימֶ֣/הָ שָּׁ֔ם תַּ֚חַת הָֽ/אַלָּ֔ה אֲשֶׁ֖ר בְּ/מִקְדַּ֥שׁ יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/026.yaml
  text: And Joshua wrote these words in the Book of the Law of God[b][a], and he took a large stone and set it up there under the oak that was in the sanctuary of Yahweh.
translation:
  language: de
  text: Und Josua schrieb diese Worte in das Buch der Weisung Gottes. Dann nahm er einen großen Stein und richtete ihn dort unter der Terebinthe[a] auf, die im Heiligtum Jahwes stand[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unter der Eiche“. Das hebräische Wort bezeichnet wahrscheinlich eine Terebinthe, wird aber auch als Eiche verstanden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die beim Heiligtum Jahwes stand“. Die hebräische Präposition kann hier auch eine Lage beim heiligen Bezirk bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: schrieb
  rationale: כתב bedeutet hier unmittelbar „schreiben“; die schlichte Wiedergabe bewahrt den dokumentarischen Vorgang.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: diese Worte
  rationale: דברים kann auch „Dinge“ oder „Angelegenheiten“ bedeuten, doch im Zusammenhang des schriftlich festgehaltenen Bundesinhalts ist „Worte“ am treffendsten.
- source_word: בְּסֵפֶר תּוֹרַת אֱלֹהִים
  choice: in das Buch der Weisung Gottes
  rationale: ספר wird allgemeinverständlich mit „Buch“ wiedergegeben; תורה bezeichnet hier Gottes maßgebende Weisung. „in das Buch“ ist im Deutschen für das Hineinschreiben idiomatisch, obwohl die hebräische Präposition formal auch „in dem Buch“ zulässt.
- source_word: וַיִּקַּח אֶבֶן גְּדוֹלָה
  choice: Dann nahm er einen großen Stein
  rationale: גדולה bezeichnet hier die physische Größe. „Dann“ gibt die fortschreitende Erzählfolge des Waw-Konsekutivs natürlich wieder.
- source_word: וַיְקִימֶהָ
  choice: richtete ihn … auf
  rationale: Der Hifil von קום bedeutet, den Stein zum Stehen zu bringen, also ihn als aufgerichteten Stein aufzustellen.
- source_word: תַּחַת הָאַלָּה
  choice: unter der Terebinthe
  rationale: אַלָּה bezeichnet wahrscheinlich eine Terebinthe; diese genauere Baumbezeichnung steht im Haupttext, während „Eiche“ als traditionelle, aber botanisch unsichere Alternative vermerkt wird.
- source_word: בְּמִקְדַּשׁ יְהוָה
  choice: im Heiligtum Jahwes
  rationale: מקדש bezeichnet einen heiligen Ort oder ein Heiligtum; ב wird zunächst mit seinem gewöhnlichen räumlichen Sinn „in“ wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Jahwe“ bewahrt diesen als Namen, ohne ihn durch den traditionellen Ersatztitel aufzulösen.
- issue: Räumliches Verhältnis von Baum und Heiligtum in בְּמִקְדַּשׁ יְהוָה
  choice: die im Heiligtum Jahwes stand
  alternative: die beim Heiligtum Jahwes stand
  rationale: Die Präposition ב bedeutet gewöhnlich „in“. Da sie räumlich auch lockerer verstanden werden kann und ein Baum innerhalb eines Heiligtums erklärungsbedürftig wirken mag, bleibt „beim Heiligtum“ als echte Alternative in der Fußnote erhalten.
- issue: Bedeutung von תּוֹרָה
  choice: Weisung
  alternative: Gesetz
  rationale: „Weisung“ bildet das Bedeutungsspektrum von תורה ab, ohne den Begriff auf Gesetzesbestimmungen im engeren modernen Sinn zu verengen; „Gesetz“ bleibt eine mögliche traditionelle Wiedergabe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählfolge. „Weisung Gottes“ vermeidet eine unnötige Verengung von תורה; „Terebinthe“ wahrt die wahrscheinlichere botanische Bedeutung. Die beiden echten lexikalisch-räumlichen Unsicherheiten werden durch markierte Fußnoten sichtbar gehalten.
