  text: וַ/יֶּאֶסֹ֧ף יְהוֹשֻׁ֛עַ אֶת כָּל שִׁבְטֵ֥י יִשְׂרָאֵ֖ל שְׁכֶ֑מָ/ה וַ/יִּקְרָא֩ לְ/זִקְנֵ֨י יִשְׂרָאֵ֜ל וּ/לְ/רָאשָׁ֗י/ו וּ/לְ/שֹֽׁפְטָי/ו֙ וּ/לְ/שֹׁ֣טְרָ֔י/ו וַ/יִּֽתְיַצְּב֖וּ לִ/פְנֵ֥י הָ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/001.yaml
  text: Then Joshua gathered all the tribes of Israel to Shechem[a], and he called for the elders of Israel, its heads, its judges, and its officers[c][b], and they presented themselves before God.
translation:
  language: de
  text: Dann versammelte Josua alle Stämme Israels nach Sichem[a]. Er rief die Ältesten Israels, seine Oberhäupter[b], seine Richter und seine Amtsträger zusammen, und sie traten vor Gott[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „in Sichem“. Die hebräische Form ist richtungsweisend und bedeutet wörtlich „nach Sichem“.'
    reason: lexical_alternative
  - marker: b
    text: Oder „seine führenden Männer“ beziehungsweise „seine Führer“. Wörtlich steht hier „seine Häupter“.
    reason: lexical_alternative
  - marker: c
    text: Der hebräische Text sagt „vor Gott“. Dies kann ein Erscheinen an einem Heiligtum oder an einem für den Bund bedeutsamen heiligen Ort implizieren.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֶּאֶסֹף
  choice: versammelte
  rationale: אָסַף bezeichnet hier das Zusammenbringen von Menschen zu einer Versammlung; „versammelte“ ist im Deutschen natürlich und präzise.
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: die Stämme Israels
  rationale: Dies ist die etablierte und sachlich passende Wiedergabe der gesellschaftlich-politischen Einheiten Israels.
- source_word: שְׁכֶמָה
  choice: in Sichem
  rationale: Das direktionale He bezeichnet formal eine Bewegung nach Sichem; im Deutschen fasst „in Sichem“ Ziel und Ort der vollzogenen Versammlung natürlich zusammen. Die Formnuance wird in Fußnote [a] bewahrt.
- source_word: וַיִּקְרָא לְ
  choice: rief … zusammen
  rationale: Die Konstruktion bezeichnet hier das Einberufen bestimmter Repräsentanten; die deutsche Wendung ist idiomatisch und passt zum Versammlungskontext.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: die Ältesten Israels
  rationale: Konventionelle und genaue Bezeichnung der anerkannten Führungsgruppe.
- source_word: רָאשָׁיו
  choice: seine Oberhäupter
  rationale: „Oberhäupter“ erhält das Bild von רֹאשׁ und unterscheidet diese Gruppe von den Ältesten; das maskuline Singularsuffix bezieht sich kollektiv auf Israel.
- source_word: שֹׁפְטָיו
  choice: seine Richter
  rationale: Direkte und verständliche Wiedergabe des richterlichen beziehungsweise bürgerlichen Amtes.
- source_word: שֹׁטְרָיו
  choice: seine Amtsträger
  rationale: שֹׁטֵר bezeichnet administrative Funktionsträger. „Amtsträger“ ist im modernen Deutsch genauer als das potenziell militärisch oder polizeilich verstandene „Offiziere“.
- source_word: וַיִּתְיַצְּבוּ
  choice: sie traten …
  rationale: Der Hitpael bezeichnet ein formelles Sich-Hinstellen beziehungsweise Erscheinen; „traten vor Gott“ gibt dies knapp und würdig wieder.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: vor Gott
  rationale: Der hebräische Text nennt ausdrücklich Gott und nicht JHWH oder das Heiligtum. Die mögliche kultisch-lokative Implikation wird in einer Fußnote erläutert.
theological_decisions:
- issue: Bedeutung von לִפְנֵי הָאֱלֹהִים bei der Bundesversammlung
  choice: vor Gott
  alternative: vor dem Heiligtum Gottes / vor dem HERRN
  rationale: „Vor Gott“ übersetzt den Wortlaut, ohne den Gottesnamen einzusetzen oder eine nur erschlossene Ortsangabe in den Haupttext aufzunehmen. Dass die Wendung ein Erscheinen an einem Heiligtum oder heiligen Bundesort einschließen kann, bleibt in Fußnote [c] offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau ist gegenüber dem langen hebräischen Satz leicht gegliedert. „Sichem“ folgt der etablierten deutschen biblischen Namensform; „Amtsträger“ vermeidet eine moderne militärische Engführung.
