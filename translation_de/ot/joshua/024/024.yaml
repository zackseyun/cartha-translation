  text: וַ/יֹּאמְר֥וּ הָ/עָ֖ם אֶל יְהוֹשֻׁ֑עַ אֶת יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ נַעֲבֹ֔ד וּ/בְ/קוֹל֖/וֹ נִשְׁמָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/024.yaml
  text: And the people said to Joshua[a], “We will serve Yahweh our God[b], and we will obey his voice.”
translation:
  language: de
  text: 'Und das Volk sagte zu Josua: „Jahwe, unserem Gott, werden wir dienen[a], und auf seine Stimme werden wir hören[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „anbeten“. Das hebräische Verb bezeichnet im Blick auf Gott einen verehrenden Dienst; „dienen“ umfasst hier jedoch auch die umfassendere Bundestreue.'
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Wendung bedeutet, auf das Gesagte zu hören und ihm gehorsam zu folgen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ הָעָם אֶל יְהוֹשֻׁעַ
  choice: Und das Volk sagte zu Josua
  rationale: Die schlichte Erzählform gibt אמר als „sagte“ wieder; הָעָם bezeichnet hier die versammelte Bundesgemeinschaft.
- source_word: אֶת יְהוָה אֱלֹהֵינוּ
  choice: Jahwe, unserem Gott
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; „unserem Gott“ steht als Apposition dazu. Der deutsche Dativ ergibt sich aus dem Verb „dienen“.
- source_word: נַעֲבֹד
  choice: wollen wir dienen
  rationale: עבד umfasst hier verehrende Hingabe und tätige Bundestreue. „Dienen“ bewahrt diese größere Bedeutungsbreite besser als das engere „anbeten“.
- source_word: וּבְקוֹלוֹ נִשְׁמָע
  choice: und auf seine Stimme wollen wir hören
  rationale: Die deutsche Wendung „auf seine Stimme hören“ bewahrt das hebräische Bild und drückt zugleich die beabsichtigte Bereitschaft zum Gehorsam aus.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Text nennt unmittelbar den Bundesnamen Gottes. „Jahwe“ gibt ihn als Eigennamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Religiöse Bedeutung von עבד im Bundeskontext
  choice: dienen
  alternative: anbeten
  rationale: Gemeint sind sowohl Gottesverehrung als auch loyale, tätige Bundestreue; „dienen“ hält beide Aspekte offen.
- issue: Bedeutung von שמע בקול
  choice: auf seine Stimme hören
  alternative: seiner Stimme gehorchen
  rationale: Die bildhafte Ausdrucksweise des Hebräischen bleibt erhalten, während die deutsche Redewendung zugleich eine gehorsame Reaktion bezeichnet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die vorangestellte Nennung „Jahwe, unserem Gott“ bewahrt die Hervorhebung des göttlichen Bundespartners; die parallele Formulierung „wollen wir … wollen wir“ gibt die feierliche Selbstverpflichtung des Volkes natürlich wieder.
