  yaml_path: translation/ot/joshua/024/028.yaml
  text: Then Joshua sent the people away[a], each man to his inheritance.
translation:
  language: de
  text: Dann entließ Josua das Volk, jeden zu seinem Erbteil.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „jeden in sein Erbteil“. Das hebräische אִישׁ steht im maskulinen Singular und wird hier verteilend gebraucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: entließ
  rationale: Der Piel von שׁלח bezeichnet hier, dass Josua die versammelten Israeliten fortgehen lässt. „Entließ“ gibt diesen Abschluss der Versammlung knapp und natürlich wieder.
- source_word: יְהוֹשֻׁעַ
  choice: Josua
  rationale: Der Personenname wird nach der etablierten deutschen Bibeltradition wiedergegeben.
- source_word: הָעָם
  choice: das Volk
  rationale: עָם bezeichnet hier kollektiv die versammelten Israeliten; „das Volk“ ist im Deutschen die natürliche und kontextgerechte Entsprechung.
- source_word: אִישׁ
  choice: jeden
  rationale: Das maskuline Singularwort אִישׁ wird distributiv gebraucht. „Jeden“ bewahrt diese Form und vermittelt, dass die Angehörigen des Volkes jeweils zu ihrem Erbteil gingen.
- source_word: לְנַחֲלָתוֹ
  choice: in sein Erbteil
  rationale: נַחֲלָה bezeichnet im Josuabuch regelmäßig den als Erbbesitz zugeteilten Landanteil. Die deutsche Wendung „in sein Erbteil“ erhält den Land- und Bundesbezug.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. „Entließ“ passt zum Ende der Versammlung; „Erbteil“ bewahrt den für Josua wichtigen Gedanken des von Gott zugeteilten Landbesitzes.
