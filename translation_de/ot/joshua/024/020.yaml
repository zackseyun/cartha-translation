  text: כִּ֤י תַֽעַזְבוּ֙ אֶת יְהוָ֔ה וַ/עֲבַדְתֶּ֖ם אֱלֹהֵ֣י נֵכָ֑ר וְ/שָׁ֨ב וְ/הֵרַ֤ע לָ/כֶם֙ וְ/כִלָּ֣ה אֶתְ/כֶ֔ם אַחֲרֵ֖י אֲשֶׁר הֵיטִ֥יב לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/020.yaml
  text: If you forsake Yahweh and serve foreign gods[a], then he will turn and do you harm and consume you[b], after he has done good to you.
translation:
  language: de
  text: Wenn ihr Jahwe verlasst und fremden Göttern dient, wird er sich gegen euch wenden, euch Unheil zufügen[a] und euch vernichten[b], nachdem er euch Gutes getan hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „euch Schaden zufügen“ beziehungsweise „Unheil über euch bringen“. Das hebräische Verb bezeichnet hier schädigendes oder unheilbringendes Handeln, nicht moralisch Böses.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „euch zugrunde richten“ oder „euch zu Ende bringen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Wenn
  rationale: Im Warnzusammenhang leitet כִּי die Bedingung ein; „wenn“ bildet das Verhältnis von Bedingung und Folge im Deutschen natürlich ab.
- source_word: תַעַזְבוּ
  choice: ihr verlasst
  rationale: עזב bezeichnet hier das Aufgeben der Bundesbindung an Jahwe. „Verlassen“ ist verständlich und bewahrt die relationale Aussage.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַעֲבַדְתֶּם
  choice: und … dient
  rationale: עבד bezeichnet im Zusammenhang mit Göttern religiösen Dienst und Loyalität; „dienen“ gibt dies direkt wieder.
- source_word: אֱלֹהֵי נֵכָר
  choice: fremden Göttern
  rationale: Die Wendung bezeichnet Götter, die Israel und der Verehrung Jahwes fremd sind.
- source_word: וְשָׁב
  choice: wird er sich gegen euch wenden
  rationale: שוב markiert eine Umkehr in Jahwes Handeln. Die Ergänzung „gegen euch“ macht die im Kontext gemeinte Richtungsänderung im Deutschen deutlich, ohne die göttliche Urheberschaft abzuschwächen.
- source_word: וְהֵרַע לָכֶם
  choice: euch Unheil zufügen
  rationale: Das Hifil von רעע bezeichnet hier das Herbeiführen von Schaden oder Unheil, nicht moralisch böses Handeln.
- source_word: וְכִלָּה אֶתְכֶם
  choice: und euch vernichten
  rationale: כלה bedeutet hier, jemanden zu einem Ende zu bringen. „Vernichten“ ist im modernen Deutschen klar und gibt die Schwere der Drohung wieder.
- source_word: אַחֲרֵי אֲשֶׁר הֵיטִיב לָכֶם
  choice: nachdem er euch Gutes getan hat
  rationale: Die Formulierung gibt היטיב ל־ unmittelbar und idiomatisch wieder und erhält den scharfen Gegensatz zwischen früherer Wohltat und folgendem Gericht.
theological_decisions:
- issue: Göttliches Gericht nach vorausgegangener Wohltat
  choice: Jahwe selbst wendet sich gegen Israel, fügt ihm Unheil zu und vernichtet es, falls es ihn verlässt.
  alternative: Die Aussage lediglich als natürliche Folge des Götzendienstes wiederzugeben.
  rationale: Die hebräischen Verben schreiben das strafende Handeln unmittelbar Jahwe zu. Die Übersetzung bewahrt diese Spannung und schwächt die göttliche Handlungsmacht nicht ab.
- issue: Bedeutung von וְשָׁב
  choice: „wird er sich gegen euch wenden“ als Umkehr seines bisherigen wohltätigen Handelns
  alternative: „wird er wieder“ im Sinn einer bloßen Wiederholung
  rationale: Der folgende Gegensatz zu „nachdem er euch Gutes getan hat“ spricht für einen Wechsel von Wohltat zu Gericht; die Übersetzung wahrt diesen Zusammenhang.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Konditionalsatz ist klar gegliedert; „Jahwe“ bewahrt den Gottesnamen. „Unheil zufügen“ vermeidet das missverständliche „Böses tun“, und „vernichten“ gibt die Gerichtsdrohung verständlich und nachdrücklich wieder. Alle Fußnotenmarker stehen an der jeweils erläuterten Stelle.
