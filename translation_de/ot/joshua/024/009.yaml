base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/009.yaml
  text: Then Balak son of Zippor[a], king of Moab, arose and fought against Israel[b]. He sent and called Balaam son of Beor to curse you.
translation:
  language: de
  text: Da erhob sich Balak, der Sohn Zippors, der König von Moab, und kämpfte gegen Israel.[a] Er schickte nach Bileam, dem Sohn Beors, und rief ihn, damit er euch verfluche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „führte Krieg gegen Israel“ bzw. „zog gegen Israel in den Krieg“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: Da erhob sich
  rationale: קום kennzeichnet hier im Erzählzusammenhang den Beginn entschlossenen Handelns. „Erhob sich“ bewahrt diese Bewegung, ohne den Ausdruck auf ein bloß körperliches Aufstehen zu verengen.
- source_word: וַיִּלָּחֶם בְּיִשְׂרָאֵל
  choice: kämpfte gegen Israel
  rationale: לחם mit ב bezeichnet hier feindliches Vorgehen. „Kämpfte gegen Israel“ gibt den klaren Wortlaut wieder, ohne ihn im Blick auf andere Überlieferungen abzuschwächen.
- source_word: וַיִּשְׁלַח וַיִּקְרָא
  choice: Er sandte hin und ließ … rufen
  rationale: Die Wiedergabe wahrt die beiden aufeinanderfolgenden Verben und klingt zugleich im modernen Deutschen natürlich. Das ergänzte „hin“ bringt den ungenannten Botengang knapp zum Ausdruck; „ließ … rufen“ entspricht dem durch שלח vermittelten Rufen.
- source_word: לְבִלְעָם בֶּן בְּעוֹר
  choice: Bileam, den Sohn Beors
  rationale: Die Personennamen folgen den im Deutschen etablierten biblischen Namensformen.
- source_word: לְקַלֵּל אֶתְכֶם
  choice: um euch zu verfluchen
  rationale: קלל bezeichnet in diesem Zusammenhang das Aussprechen beziehungsweise Herbeiführen eines Fluches. „Euch zu verfluchen“ ist direkt, verständlich und ohne erklärende Erweiterung.
theological_decisions:
- issue: Die Aussage, Balak habe gegen Israel gekämpft, während Numeri vor allem seinen Versuch schildert, Israel durch Bileam verfluchen zu lassen
  choice: Den ausdrücklichen Wortlaut „kämpfte gegen Israel“ beibehalten
  alternative: „trat Israel feindlich entgegen“, „wollte gegen Israel kämpfen“ oder eine Auslassung der direkten Kampfaussage
  rationale: Der hebräische Text sagt ausdrücklich וַיִּלָּחֶם בְּיִשְׂרָאֵל. Eine mögliche Spannung zu Numeri soll nicht durch harmonisierende Übersetzung beseitigt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählbewegung. Die etablierte Form „Bileam“ wird verwendet. Der Verswechsel im Gotteswort von der Rede über Israel zur direkten Anrede „euch“ bleibt erhalten.
