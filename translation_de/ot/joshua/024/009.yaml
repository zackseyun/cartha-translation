  verdict: revise
  source_fidelity: Der Entwurf gibt die Abfolge des hebräischen Textes, die Bezeichnung Balaks als König von Moab, das feindliche Handeln gegen Israel sowie den Zweck der Berufung Bileams zutreffend wieder. „Kämpfte gegen Israel“ bewahrt zu Recht die explizite Aussage des Textes, ohne sie an Numeri anzugleichen. Bei וַיִּשְׁלַח וַיִּקְרָא ist „sandte hin“ ohne ausgedrücktes Objekt im modernen Deutschen jedoch unidiomatisch; eine präzisere, natürliche Wiedergabe sollte beide Verben erkennbar halten.
  naturalness: Die Satzführung ist insgesamt würdig und gut verständlich. Die Häufung der Appositionen bei Balak ist noch akzeptabel. „Er sandte hin und ließ Bileam … rufen“ klingt dagegen elliptisch und fügt mit der kausativen Formulierung unnötig einen vermittelnden Rufer ein. „Er schickte nach Bileam … und rief ihn“ ist idiomatisches modernes Standarddeutsch.
  terminology: „Balak“, „Zippor“, „Moab“, „Israel“, „Bileam“ und „Beor“ entsprechen etablierten deutschen biblischen Namensformen. „Verfluchen“ gibt לקלל direkt und angemessen wieder. Die Fußnote ist korrekt verankert und bietet sinnvolle lexikalische Alternativen.
  issues:
  - severity: medium
    issue: „Er sandte hin und ließ Bileam, den Sohn Beors, rufen“ ist sprachlich unnötig elliptisch und leicht überbestimmt.
    rationale: Das Hebräische verbindet „senden“ und „rufen“ parataktisch. „Sandte hin“ benötigt im modernen Deutschen gewöhnlich ein Objekt oder eine Ortsangabe; „ließ … rufen“ formuliert zusätzlich eine kausative Vermittlung. „Schickte nach … und rief ihn“ gibt die gemeinte Sendung zu Bileam und die anschließende Berufung natürlich wieder, ohne den Sinn zu verändern.
