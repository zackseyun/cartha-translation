id: JOS.24.31
reference: Joshua 24:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּעֲבֹ֤ד יִשְׂרָאֵל֙ אֶת יְהוָ֔ה כֹּ֖ל יְמֵ֣י יְהוֹשֻׁ֑עַ וְ/כֹ֣ל יְמֵ֣י הַ/זְּקֵנִ֗ים אֲשֶׁ֨ר הֶאֱרִ֤יכוּ יָמִים֙ אַחֲרֵ֣י יְהוֹשֻׁ֔עַ וַ/אֲשֶׁ֣ר יָדְע֗וּ אֵ֚ת כָּל מַעֲשֵׂ֣ה יְהוָ֔ה אֲשֶׁ֥ר עָשָׂ֖ה לְ/יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/031.yaml
  text: Israel served Yahweh all the days of Joshua[a], and all the days of the elders who outlived Joshua and who had known all the work of Yahweh that he had done for Israel.
translation:
  language: de
  text: Israel diente Jahwe während der ganzen Lebenszeit Josuas und während der ganzen Lebenszeit der Ältesten, die Josua überlebten und das ganze Wirken Jahwes[a] kannten, das er für Israel vollbracht hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: alle Taten Jahwes.'
    reason: Lexikalische Alternative für כָּל מַעֲשֵׂה יְהוָה; der kollektive Singular kann als „das ganze Wirken“ oder sinngemäß als Mehrzahl einzelner Taten wiedergegeben werden.
lexical_decisions:
- source_word: וַיַּעֲבֹד
  choice: diente
  rationale: עבד bezeichnet mit Jahwe als Objekt den Dienst in umfassender Bundestreue; „diente“ schließt Anbetung ein, ohne die Bedeutung auf kultische Verehrung zu verengen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: „Jahwe“ gibt den im Hebräischen stehenden Gottesnamen in der im Deutschen geläufigen Form wieder, statt ihn durch einen Titel wie „der HERR“ zu ersetzen.
- source_word: כֹּל יְמֵי
  choice: während der ganzen Lebenszeit
  rationale: Die zeitliche Wendung wird idiomatisch und zugleich vollständig wiedergegeben; sie bezeichnet hier jeweils die gesamte Lebensspanne der genannten Personen.
- source_word: הַזְּקֵנִים
  choice: die Ältesten
  rationale: „Älteste“ ist im israelitischen Gemeinschaftskontext die natürliche Bezeichnung und lässt sowohl Lebensalter als auch anerkannte Stellung anklingen.
- source_word: הֶאֱרִיכוּ יָמִים אַחֲרֵי יְהוֹשֻׁעַ
  choice: die Josua überlebten
  rationale: Die hebräische Wendung spricht wörtlich davon, nach Josua noch lange Tage zu haben; gemeint ist, dass diese Ältesten über Josuas Tod hinaus lebten.
- source_word: יָדְעוּ
  choice: kannten
  rationale: Das Verb bezeichnet hier persönliche, aus eigenem Erleben gewonnene Kenntnis von Jahwes Handeln; „kannten“ bewahrt diese Aussage, ohne das Erleben ausdrücklich in den Text einzutragen.
- source_word: כָּל מַעֲשֵׂה יְהוָה
  choice: das ganze Wirken Jahwes
  rationale: מַעֲשֶׂה kann Werk, Wirken, Tat oder Taten bezeichnen. „Das ganze Wirken“ gibt den kollektiven Singular natürlich wieder; „alle Taten“ bleibt als plausible Alternative in der Fußnote erhalten.
- source_word: עָשָׂה לְיִשְׂרָאֵל
  choice: das er für Israel vollbracht hatte
  rationale: ל bezeichnet im Kontext das Handeln zugunsten Israels. „Vollbracht hatte“ vermeidet die unschöne Wiederholung von „Wirken“ und gibt den rückblickenden Aspekt wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen יהוה. „Jahwe“ bewahrt diesen persönlichen Bundesnamen; die deutsche Schreibweise mit J entspricht dem üblichen deutschen Laut- und Schriftgebrauch.
- issue: Art der Kenntnis der Ältesten
  choice: kannten
  alternative: selbst erlebt hatten
  rationale: Der Kontext legt persönliche Erfahrung nahe, doch ידע sagt zunächst „kennen/wissen“. Die Übersetzung bewahrt diese Bedeutungsbreite und macht die Erfahrungsdimension nicht ausdrücklicher als der hebräische Text.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Formulierung „während der ganzen Lebenszeit“ bewahrt die Parallelität von כֹּל יְמֵי, während „überlebten“ die hebräische Zeitidiomatik knapp und verständlich wiedergibt. Der Fußnotenmarker steht unmittelbar bei der tatsächlich erläuterten Wendung.
