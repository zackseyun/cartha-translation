  text: וָ/אֶתֵּ֣ן לְ/יִצְחָ֔ק אֶֽת יַעֲקֹ֖ב וְ/אֶת עֵשָׂ֑ו וָ/אֶתֵּ֨ן לְ/עֵשָׂ֜ו אֶת הַ֤ר שֵׂעִיר֙ לָ/רֶ֣שֶׁת אוֹת֔/וֹ וְ/יַעֲקֹ֥ב וּ/בָנָ֖י/ו יָרְד֥וּ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/004.yaml
  text: And I gave Isaac Jacob and Esau[a], and I gave Esau the hill country of Seir to possess[b]; but Jacob and his sons went down to Egypt.
translation:
  language: de
  text: Und ich gab Isaak Jakob und Esau, und ich gab Esau das Bergland Seïr, um es in Besitz zu nehmen; Jakob aber und seine Söhne zogen nach Ägypten hinab.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶתֵּן
  choice: ich gab
  rationale: נתן bezeichnet hier das Geben von Nachkommen und Land. Die Wiederholung von „gab“ bewahrt das wiederholte göttliche Handeln.
- source_word: לְיִצְחָק אֶת יַעֲקֹב וְאֶת עֵשָׂו
  choice: ich gab Isaak Jakob und Esau
  rationale: Die hebräische Konstruktion bezeichnet Jakob und Esau als die Isaak gegebenen Söhne; die direkte Wiedergabe ist im Deutschen klar und würdevoll.
- source_word: הַר שֵׂעִיר
  choice: das Bergland Seïr
  rationale: הַר kann einen Berg oder eine gebirgige Landschaft bezeichnen. Hier ist das Esau zugewiesene Gebiet gemeint, daher passt „Bergland“ besser als ein einzelner Berg.
- source_word: לָרֶשֶׁת אֹתוֹ
  choice: zum Besitz
  rationale: ירש bezeichnet hier das Inbesitznehmen beziehungsweise Besitzen des Landes. „Zum Besitz“ gibt den Zweck knapp und natürlich wieder; der Objektbezug auf das Bergland bleibt eindeutig.
- source_word: וְיַעֲקֹב וּבָנָיו
  choice: Jakob aber und seine Söhne
  rationale: Das Waw bedeutet grundsätzlich „und“, kann im Zusammenhang aber einen Gegensatz markieren. Die Nachstellung von „aber“ macht den sachlichen Kontrast im natürlichen Deutschen sichtbar.
- source_word: יָרְדוּ מִצְרָיִם
  choice: zogen nach Ägypten hinab
  rationale: Die Formulierung bewahrt die räumliche Richtungsangabe von ירד und entspricht zugleich gehobenem, verständlichem Erzähldeutsch.
theological_decisions:
- issue: Wiedergabe der letzten hebräischen Konjunktion
  choice: „Jakob aber“ als kontextuell adversative Wiedergabe
  alternative: „Und Jakob und seine Söhne“ als formal direkte Wiedergabe
  rationale: 'Das hebräische וְ legt den Gegensatz nicht ausdrücklich fest, doch die Gegenüberstellung ist im Kontext deutlich: Esau erhält Seïr als Besitz, während Jakob und seine Söhne nach Ägypten hinabziehen. „Aber“ verdeutlicht diesen Kontrast, ohne eine zusätzliche theologische Aussage einzuführen.'
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Die Namen folgen der üblichen deutschen Bibelschreibung; „Seïr“ trägt ein Trema, um die getrennte Aussprache der Vokale anzuzeigen. Keine Fußnote ist nötig, da „Bergland“ den territorialen Sinn von הַר angemessen wiedergibt und „aber“ als kontextuelle Wiedergabe des Waw vertretbar ist.
