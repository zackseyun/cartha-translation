  source_fidelity: 'Der Entwurf gibt die Abfolge und die wiederholte göttliche Gabe zutreffend wieder: Isaak erhält Jakob und Esau; Esau erhält das Bergland Seïr; Jakob und seine Söhne ziehen nach Ägypten hinab. „Bergland Seïr“ trifft den territorialen Sinn von הַר שֵׂעִיר gut. Die adversative Wiedergabe durch „aber“ ist im Kontext vertretbar, auch wenn das hebräische וְ formal lediglich „und“ lautet.'
  naturalness: „Zum Besitz“ ist in diesem Satz keine natürliche moderne deutsche Wiedergabe des hebräischen Infinitivs mit Objekt. „Um es in Besitz zu nehmen“ ist idiomatisch, macht den Bezug auf das Bergland deutlich und bewahrt die Zweckangabe. Die Wiederholung von „ich gab“ sollte entsprechend dem Hebräischen ausdrücklich stehen bleiben.
  terminology: Die Namen Isaak, Jakob, Esau und Seïr entsprechen der üblichen deutschen Bibelschreibung. „Bergland“ und „in Besitz nehmen“ sind für Landzuteilung angemessen und konfessionell neutral.
