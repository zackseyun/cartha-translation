base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/023.yaml
  text: So now[a], remove the foreign gods that are among you, and turn your heart to Yahweh[b], the God of Israel.
translation:
  language: de
  text: Und nun entfernt die fremden Götter, die unter euch sind, und wendet euer Herz Jahwe, dem Gott Israels, zu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Neigt euer Herz Jahwe, dem Gott Israels, zu.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Darum … jetzt
  rationale: Die Verbindung aus וְ und עַתָּה leitet aus dem Vorhergehenden die unmittelbar folgende Aufforderung ab; „Darum … jetzt“ gibt diesen folgernden und zeitlichen Übergang natürlich wieder.
- source_word: הָסִירוּ
  choice: entfernt
  rationale: Der Hifil-Imperativ bezeichnet das Wegschaffen oder Beseitigen; „entfernt“ ist klar, gegenwärtig und bewahrt den konkreten Charakter des Befehls.
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: die fremden Götter
  rationale: Die Wortverbindung bezeichnet Götter fremder Herkunft beziehungsweise fremden Kultes; „fremde Götter“ ist im Deutschen prägnant und idiomatisch.
- source_word: אֲשֶׁר בְּקִרְבְּכֶם
  choice: die unter euch sind
  rationale: בְּקֶרֶב bezeichnet hier die Anwesenheit inmitten der Gemeinschaft. „Unter euch“ vermeidet eine unnötige Festlegung darauf, ob Götterbilder, praktizierter Kult oder innere Bindungen gemeint sind.
- source_word: וְהַטּוּ
  choice: neigt … zu
  rationale: Das Verb נטה bedeutet wörtlich „neigen, ausrichten“. Mit „Herz“ und אֶל bewahrt „neigt … zu“ das hebräische Bild der bewussten inneren Ausrichtung.
- source_word: לְבַבְכֶם
  choice: euer Herz
  rationale: Der hebräische Text hat ein kollektiv gebrauchtes Substantiv im Singular mit Pluralsuffix. „Euer Herz“ erhält diese Vorstellung einer gemeinsamen inneren Ausrichtung.
- source_word: אֶל יְהוָה
  choice: Jahwe … zu
  rationale: אֶל bezeichnet die Richtung; der Gottesname יהוה wird als „Jahwe“ wiedergegeben, wodurch sein Charakter als Eigenname sichtbar bleibt.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: dem Gott Israels
  rationale: Die Apposition identifiziert Jahwe als Israels Gott; der Dativ ergibt sich natürlich aus der deutschen Konstruktion „jemandem das Herz zuneigen“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen ausdrücklich. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Art der fremden Götter „unter euch“
  choice: 'offen formuliert: „die unter euch sind“'
  alternative: „die ihr in euch tragt“ oder ausdrückliche Beschränkung auf Götzenbilder
  rationale: Der hebräische Ausdruck lässt offen, ob konkrete Kultbilder, praktizierte Verehrung oder fortbestehende Loyalitäten im Blick stehen. Die Übersetzung löst diese Spannung nicht einseitig auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bewahrt den kollektiven Singular „euer Herz“ und das Bild des Zuneigens. Der Fußnotenmarker steht unmittelbar nach dem davon betroffenen Satz.
