  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וָ֠/אֶקַּח אֶת אֲבִי/כֶ֤ם אֶת אַבְרָהָם֙ מֵ/עֵ֣בֶר הַ/נָּהָ֔ר וָ/אוֹלֵ֥ךְ אוֹת֖/וֹ בְּ/כָל אֶ֣רֶץ כְּנָ֑עַן ו/ארב אֶת זַרְע֔/וֹ וָֽ/אֶתֶּן ל֖/וֹ אֶת יִצְחָֽק־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/003.yaml
  text: Then I took your father Abraham from beyond the River[a], and I led him through all the land of Canaan[b], and I multiplied his offspring and gave him Isaac.
translation:
  language: de
  text: Da nahm ich euren Vater Abraham von jenseits des Stromes[a] und führte ihn durch das ganze Land Kanaan. Ich vermehrte seine Nachkommenschaft[b] und gab ihm Isaak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit »dem Strom« ist wahrscheinlich der Euphrat gemeint.
    reason: cultural_note
  - marker: b
    text: 'Oder: seine Nachkommen. Das hebräische Wort steht im Singular und kann kollektiv die gesamte Nachkommenschaft bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקַּח
  choice: Da nahm ich
  rationale: Das Qal-Wayyiqtol der 1. Person Singular erzählt Gottes anschließendes Handeln. „Da“ gibt die narrative Abfolge natürlich wieder.
- source_word: אֲבִיכֶם
  choice: euren Vater
  rationale: „Vater“ bewahrt die hebräische familiäre und bundesgeschichtliche Ausdrucksweise; „Vorfahr“ wäre erklärender, aber weniger formnah.
- source_word: מֵעֵבֶר הַנָּהָר
  choice: von jenseits des Stromes
  rationale: Die Wendung bezeichnet die andere Seite eines bekannten Flusses. „Der Strom“ bewahrt die bestimmte, aber nicht ausdrücklich benannte geografische Bezeichnung.
- source_word: וָאוֹלֵךְ אֹתוֹ
  choice: und führte ihn
  rationale: Die Hifil-Form von הלך ist kausativ; „führte ihn“ gibt dies idiomatisch und präzise wieder.
- source_word: בְּכָל אֶרֶץ כְּנָעַן
  choice: durch das ganze Land Kanaan
  rationale: Im Zusammenhang mit dem Führen drückt „durch“ die Bewegung innerhalb des gesamten Landes natürlich aus.
- source_word: וָאַרְבֶּה אֶת זַרְעוֹ
  choice: Ich vermehrte seine Nachkommenschaft
  rationale: Das Hifil von רבה bedeutet „zahlreich machen/vermehren“. „Nachkommenschaft“ bewahrt den kollektiven Singular von זֶרַע.
- source_word: וָאֶתֶּן לוֹ אֶת יִצְחָק
  choice: und gab ihm Isaak
  rationale: Die deutsche Wortfolge gibt sowohl Isaak als Gottes Gabe als auch Abraham als Empfänger klar und knapp wieder.
theological_decisions:
- issue: Bezeichnung Abrahams als Vater Israels
  choice: euren Vater Abraham
  alternative: euren Vorfahren Abraham
  rationale: Der Ausgangstext verwendet ausdrücklich „Vater“. Diese bundesgeschichtlich geprägte Familienbezeichnung sollte nicht zu „Vorfahr“ verallgemeinert werden.
- issue: Identifikation des Stromes
  choice: der Strom
  alternative: der Euphrat
  rationale: Im Hebräischen steht die bestimmte Gattungsbezeichnung und nicht der Eigenname. Die wahrscheinliche Identifikation mit dem Euphrat wird deshalb in einer Fußnote erläutert.
- issue: Kollektiver Singular זֶרַע
  choice: Nachkommenschaft
  alternative: Nachkommen
  rationale: „Nachkommenschaft“ erhält den kollektiven Singular und lässt die umfassende Bedeutung des hebräischen Ausdrucks bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Von jenseits des Stromes“ hält die geografische Perspektive und die traditionelle Bezeichnung fest, ohne den Eigennamen in den Haupttext einzutragen. Der lange hebräische Satz wird zur besseren deutschen Lesbarkeit nach „Kanaan“ geteilt.
