  text: וָ/אֶתֵּ֨ן לָ/כֶ֜ם אֶ֣רֶץ אֲשֶׁ֧ר לֹֽא יָגַ֣עְתָּ בָּ֗/הּ וְ/עָרִים֙ אֲשֶׁ֣ר לֹא בְנִיתֶ֔ם וַ/תֵּשְׁב֖וּ בָּ/הֶ֑ם כְּרָמִ֤ים וְ/זֵיתִים֙ אֲשֶׁ֣ר לֹֽא נְטַעְתֶּ֔ם אַתֶּ֖ם אֹכְלִֽים׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/013.yaml
  text: And I gave you a land on which you had not labored[a], and cities that you had not built, and you live in them. You are eating from vineyards and olive groves that you did not plant.
translation:
  language: de
  text: Und ich gab euch ein Land, in dem du dich nicht abgemüht hattest,[a] und Städte, die ihr nicht gebaut hattet; und ihr wohnt darin. Ihr esst von Weinbergen und Olivenbäumen, die ihr nicht gepflanzt habt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch wechselt hier zur Einzahl („du“); anschließend steht die Anrede wieder in der Mehrzahl („ihr“). Israel wird als gemeinschaftliche Einheit angesprochen.
    reason: Bewahrung des Wechsels zwischen singularischer und pluralischer Anrede
lexical_decisions:
- source_word: וָאֶתֵּן
  choice: Und ich gab
  rationale: Das Qal-Wajjiqtol der 1. Person Singular erzählt Gottes zurückliegende Gabe in der Abfolge der Rede; das deutsche Präteritum gibt dies knapp und würdig wieder.
- source_word: אֶרֶץ אֲשֶׁר לֹא יָגַעְתָּ בָּהּ
  choice: ein Land, in dem du dich nicht abgemüht hattest
  rationale: יגע bezeichnet Mühe und anstrengende Arbeit. „Sich abmühen“ bewahrt diesen Bedeutungsgehalt; das Plusquamperfekt macht deutlich, dass diese Arbeit vor der Gabe des Landes nicht geleistet worden war. Der Singular des hebräischen Verbs bleibt im Deutschen sichtbar.
- source_word: וְעָרִים אֲשֶׁר לֹא בְנִיתֶם
  choice: und Städte, die ihr nicht gebaut hattet
  rationale: עיר wird regulär mit „Stadt“ wiedergegeben. Der hebräische Plural der Anrede wird bewahrt; das Plusquamperfekt kennzeichnet den vorausliegenden, nicht von Israel vollzogenen Bau.
- source_word: וַתֵּשְׁבוּ בָּהֶם
  choice: und ihr wohnt darin
  rationale: ישב bedeutet hier „wohnen“. Das Präsens gibt den in Josuas Rede fortbestehenden Zustand wieder; „darin“ bezieht sich idiomatisch auf die Städte.
- source_word: כְּרָמִים וְזֵיתִים
  choice: Weinbergen und Ölbäumen
  rationale: כרמים bezeichnet Weinberge. זיתים kann Oliven beziehungsweise Ölbäume bezeichnen; da diese gepflanzt werden und als Gegenstück zu den Weinbergen erscheinen, ist „Ölbäume“ konkret und quellennah.
- source_word: אַתֶּם אֹכְלִים
  choice: Ihr esst
  rationale: Das ausdrückliche Personalpronomen mit Partizip hebt Israels gegenwärtiges Genießen der Erträge hervor. Im Deutschen vermittelt „Ihr esst“ den fortdauernden gegenwärtigen Sachverhalt natürlich.
theological_decisions:
- issue: Wechsel zwischen singularischer und pluralischer Anrede Israels
  choice: Den Wechsel als „du“ und „ihr“ bewahren
  alternative: Alle Formen einheitlich pluralisch mit „ihr“ wiedergeben
  rationale: Der hebräische Text redet Israel zunächst mit einer singularischen Verbform als kollektive Einheit und danach mit pluralischen Formen an. Da Deutsch diesen Wechsel verständlich abbilden kann, wird die echte grammatische Spannung nicht eingeebnet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Präteritum bezeichnet Gottes zurückliegende Gabe, während das Präsens das fortdauernde Wohnen und Essen Israels ausdrückt. „Ölbäume“ folgt dem hebräischen Ausdruck enger als das stärker interpretierende „Olivenhaine“.
