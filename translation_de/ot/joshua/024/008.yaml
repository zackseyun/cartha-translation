  text: ו/אבא/ה אֶתְ/כֶ֗ם אֶל אֶ֤רֶץ הָ/אֱמֹרִי֙ הַ/יּוֹשֵׁב֙ בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֔ן וַ/יִּֽלָּחֲמ֖וּ אִתְּ/כֶ֑ם וָ/אֶתֵּ֨ן אוֹתָ֤/ם בְּ/יֶדְ/כֶם֙ וַ/תִּֽירְשׁ֣וּ אֶת אַרְצָ֔/ם וָ/אַשְׁמִידֵ֖/ם מִ/פְּנֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/008.yaml
  text: Then I brought you into the land of the Amorites[a], who lived beyond the Jordan, and they fought with you. And I gave them into your hand, and you took possession of their land, and I destroyed them from before you.
translation:
  language: de
  text: Dann brachte ich euch in das Land der Amoriter, die jenseits des Jordan wohnten. Sie kämpften gegen euch, und ich gab sie in eure Hand. Ihr nahmt ihr Land in Besitz, und ich vernichtete sie vor euch.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֲבִיאָה אֶתְכֶם
  choice: Dann brachte ich euch
  rationale: Die Hifil-Form von בוא bezeichnet das Hineinbringen; „Dann“ gibt die erzählerische Abfolge des vorangestellten Waw im natürlichen Deutschen wieder.
- source_word: אֶל אֶרֶץ הָאֱמֹרִי
  choice: in das Land der Amoriter
  rationale: אֶל bezeichnet hier die Bewegung in das Gebiet hinein. Der hebräische Singular ist kollektiv und wird im Deutschen natürlich als Volksname im Plural wiedergegeben.
- source_word: הַיּוֹשֵׁב בְּעֵבֶר הַיַּרְדֵּן
  choice: die jenseits des Jordan wohnten
  rationale: Das Partizip beschreibt die Amoriter als Bewohner des Gebiets jenseits des Jordan. „Wohnten“ ist gegenwärtiges, würdiges Standarddeutsch, ohne die Perspektive durch „östlich“ ausdrücklich festzulegen.
- source_word: וַיִּלָּחֲמוּ אִתְּכֶם
  choice: Sie kämpften gegen euch
  rationale: לחם mit אֵת bezeichnet im Kontext eine feindliche Kampfhandlung. Das deutsche „mit euch kämpfen“ könnte fälschlich einen gemeinsamen Kampf nahelegen; „gegen euch“ macht die kontextuell eindeutige Gegnerschaft klar.
- source_word: וָאֶתֵּן אוֹתָם בְּיֶדְכֶם
  choice: doch ich gab sie in eure Hand
  rationale: נתן ביד ist ein festes Bild für die Übergabe in die Gewalt eines anderen. „In eure Hand“ bewahrt das verständliche hebräische Bild; „doch“ markiert natürlich den Umschwung, ohne zusätzliche Sachinformation einzuführen.
- source_word: וַתִּירְשׁוּ אֶת אַרְצָם
  choice: Ihr nahmt ihr Land in Besitz
  rationale: ירש bezeichnet hier das Erlangen und Besitzen des Landes nach dem Sieg. Diese Wiedergabe vermeidet eine unnötige Festlegung auf „erben“ oder den stärker prozesshaften Sinn „enteignen/vertreiben“.
- source_word: וָאַשְׁמִידֵם מִפְּנֵיכֶם
  choice: und ich vernichtete sie vor euch
  rationale: שׁמד hat die starke Bedeutung „vernichten“. מִפְּנֵיכֶם bezeichnet die Beseitigung aus ihrem Angesicht beziehungsweise vor ihnen; „vor euch“ ist im Deutschen knapp und wahrt das räumliche Bild.
theological_decisions:
- issue: Direkte göttliche Zuschreibung der Eroberung und Vernichtung
  choice: Die Abfolge „ich gab sie in eure Hand … ihr nahmt … ich vernichtete“ bleibt ausdrücklich erhalten.
  alternative: Die Aussagen durch Formulierungen wie „ich ließ euch sie besiegen“ oder „ich vertrieb sie“ abzumildern.
  rationale: Der hebräische Text schreibt Gott die Übergabe der Gegner und ihre Vernichtung direkt zu und Israel die Inbesitznahme des Landes. Diese Spannung wird weder abgeschwächt noch theologisch erweitert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge wurde für natürliche Lesbarkeit leicht gegliedert. Keine Fußnote ist nötig, da „gegen euch kämpfen“ die im Kontext gemeinte Funktion von אִתְּכֶם eindeutig und quellengerecht ausdrückt.
