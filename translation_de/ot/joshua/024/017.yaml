source:
  edition: WLC
  text: כִּ֚י יְהוָ֣ה אֱלֹהֵ֔י/נוּ הוּא֩ הַ/מַּעֲלֶ֨ה אֹתָ֧/נוּ וְ/אֶת אֲבוֹתֵ֛י/נוּ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֣ית עֲבָדִ֑ים וַ/אֲשֶׁ֧ר עָשָׂ֣ה לְ/עֵינֵ֗י/נוּ אֶת הָ/אֹת֤וֹת הַ/גְּדֹלוֹת֙ הָ/אֵ֔לֶּה וַֽ/יִּשְׁמְרֵ֗/נוּ בְּ/כָל הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר הָלַ֣כְנוּ בָ֔/הּ וּ/בְ/כֹל֙ הָֽ/עַמִּ֔ים אֲשֶׁ֥ר עָבַ֖רְנוּ בְּ/קִרְבָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/017.yaml
  text: For Yahweh our God is the one who brought us and our fathers up from the land of Egypt[a], from the house of servants, and who did these great signs before our eyes, and kept us in all the way in which we walked[b], and among all the peoples through whose midst we passed.
translation:
  language: de
  text: Denn Jahwe, unser Gott, ist es, der uns und unsere Vorfahren aus dem Land Ägypten heraufgeführt hat, aus dem Sklavenhaus,[a] und der vor unseren Augen diese großen Zeichen getan hat. Er hat uns auf dem ganzen Weg, den wir gegangen sind, beschützt und auch unter all den Völkern, durch deren Mitte wir gezogen sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „aus dem Haus der Sklaven“; gemeint ist ein Ort der Sklaverei.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die in Vers 16 erklärte Entscheidung des Volkes und wird im Deutschen natürlich mit „Denn“ wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im modernen Deutschen verbreitete Form.
- source_word: אֱלֹהֵינוּ הוּא
  choice: unser Gott, ist es
  rationale: Die Konstruktion bewahrt die Hervorhebung durch das selbstständige Pronomen הוּא, ohne im Deutschen schwerfällig zu wirken.
- source_word: הַמַּעֲלֶה
  choice: heraufgeführt hat
  rationale: Das Partizip von עלה bezeichnet wörtlich ein Hinaufführen. Die deutsche Wiedergabe erhält dieses Exodusbild und passt zur rückblickenden Erzählung.
- source_word: אֲבוֹתֵינוּ
  choice: unsere Vorfahren
  rationale: „Vorfahren“ bezeichnet die vorausgehenden Generationen im heutigen Deutsch natürlich und schließt den familien- und heilsgeschichtlichen Bezug ein.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: aus dem Land Ägypten
  rationale: Die ausdrückliche Nennung von אֶרֶץ („Land“) bleibt erhalten.
- source_word: מִבֵּית עֲבָדִים
  choice: aus dem Sklavenhaus
  rationale: Die feste Zusammensetzung gibt das konkrete hebräische Bild „Haus der Sklaven“ knapp und idiomatisch wieder; die abstraktere Bedeutung „Ort der Sklaverei“ wird in der Fußnote genannt.
- source_word: הָאֹתוֹת הַגְּדֹלוֹת הָאֵלֶּה
  choice: diese großen Zeichen
  rationale: „Zeichen“ bewahrt den semantischen Gehalt von אוֹת, einschließlich seines Hinweischarakters, ohne ihn auf „Wunder“ zu verengen.
- source_word: וַיִּשְׁמְרֵנוּ
  choice: Er hat uns … beschützt
  rationale: שׁמר bezeichnet hier Gottes schützendes Bewahren auf der Reise; „beschützt“ macht diesen Sinn im modernen Deutsch klar.
- source_word: בְּכָל הַדֶּרֶךְ אֲשֶׁר הָלַכְנוּ בָהּ
  choice: auf dem ganzen Weg, den wir gegangen sind
  rationale: Die Formulierung hält das Wegmotiv und die umfassende Angabe „den ganzen Weg“ fest, klingt aber natürlicher als eine streng formale Nachbildung.
- source_word: וּבְכֹל הָעַמִּים אֲשֶׁר עָבַרְנוּ בְּקִרְבָּם
  choice: und auch unter all den Völkern, durch deren Mitte wir gezogen sind
  rationale: „Unter all den Völkern“ gibt den Schutzbereich wieder; „durch deren Mitte“ bewahrt das konkrete בְּקִרְבָּם.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält ausdrücklich den Gottesnamen. Die Transliteration bewahrt dessen Eigennamecharakter, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von בֵּית עֲבָדִים in der Exodusformel
  choice: Sklavenhaus
  alternative: Haus der Sklaverei
  rationale: „Sklavenhaus“ bewahrt sowohl das konkrete Nomen עֲבָדִים als auch das Bild des Hauses. Die Fußnote erschließt die idiomatische Bedeutung, ohne den Haupttext zu abstrahieren.
- issue: Referenz von „uns“ in der Exoduserinnerung
  choice: uns
  alternative: unsere Vorfahren
  rationale: Der Text unterscheidet ausdrücklich „uns“ und „unsere Vorfahren“. Diese kollektive Identifikation Israels mit der Exodusgeneration bleibt stehen und wird nicht historisierend aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz wurde zur besseren Verständlichkeit nach „Zeichen getan hat“ geteilt, während die fortlaufende Reihe der Taten Jahwes erhalten bleibt. „Vorfahren“ ist im heutigen Deutsch natürlicher als „Väter“. Der Schutzsinn von שׁמר wird ausdrücklich wiedergegeben.
