source:
  edition: WLC
  text: וַ/יַּ֤עַן הָ/עָם֙ וַ/יֹּ֔אמֶר חָלִ֣ילָ/ה לָּ֔/נוּ מֵ/עֲזֹ֖ב אֶת יְהוָ֑ה לַ/עֲבֹ֖ד אֱלֹהִ֥ים אֲחֵרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/016.yaml
  text: Then the people answered and said[a], “Far be it from us to forsake Yahweh and serve other gods.”
translation:
  language: de
  text: 'Da antwortete das Volk: »Es sei fern von uns, Jahwe zu verlassen und anderen Göttern zu dienen!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן הָעָם וַיֹּאמֶר
  choice: Da antwortete das Volk
  rationale: Die hebräische Doppelformel »antwortete und sagte« leitet eine Rede ein. Im heutigen Deutschen gibt »antwortete« allein den natürlichen Sinn vollständig wieder, ohne die Erzählfunktion zu verändern.
- source_word: חָלִילָה לָּנוּ
  choice: Es sei fern von uns
  rationale: Die feste hebräische Wendung drückt eine entschiedene Zurückweisung aus. Diese Wiedergabe bewahrt ihre feierliche Kraft, ohne das im Ausgangstext nicht ausdrücklich genannte Wort »Gott« einzufügen.
- source_word: מֵעֲזֹב
  choice: zu verlassen
  rationale: עזב bezeichnet hier das Aufgeben der Bundestreue. »Verlassen« ist gegenwärtiges, verständliches Deutsch und trägt in diesem Zusammenhang den Sinn des Abwendens beziehungsweise Aufgebens.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. »Jahwe« ist die im Deutschen geläufige Form.
- source_word: לַעֲבֹד
  choice: zu dienen
  rationale: עבד bezeichnet gegenüber einer Gottheit religiösen Dienst und Loyalität. »Dienen« bewahrt diese Bedeutungsbreite besser als das engere »anbeten«.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: anderen Göttern
  rationale: Die Wendung bedeutet unmittelbar »andere Götter«; der deutsche Dativ ergibt sich aus dem Verb »dienen«.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. Die Umschrift bewahrt diesen, statt ihn durch den Titel »der HERR« zu ersetzen.
- issue: Kraft der Wendung חָלִילָה לָּנוּ
  choice: Es sei fern von uns
  alternative: Gott bewahre uns davor
  rationale: Die gewählte Formulierung bringt die nachdrückliche Zurückweisung zum Ausdruck, ohne eine ausdrückliche Erwähnung Gottes hinzuzufügen, die im Hebräischen an dieser Stelle fehlt.
- issue: Verhältnis von Jahwe verlassen und anderen Göttern dienen
  choice: Jahwe zu verlassen und anderen Göttern zu dienen
  alternative: Jahwe zu verlassen, um anderen Göttern zu dienen
  rationale: Die Formulierung bewahrt die syntaktische Möglichkeit, beide Handlungen eng verbunden zu verstehen, ohne die zweite ausdrücklich als Zweck der ersten festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die feierliche idiomatische Wendung »Es sei fern von uns« entspricht dem starken Ton des Hebräischen; ansonsten bleibt die Sprache schlicht und unmittelbar.
