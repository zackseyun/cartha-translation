  source_fidelity: 'Die Übersetzung gibt den hebräischen Satzinhalt vollständig und zutreffend wieder: Josuas Rede an das gesamte Volk, die Botenformel, Jahwe als Gott Israels, die Ortsangabe jenseits des Stroms, die Vorfahren einschließlich Terachs doppelter Vaterbezeichnung sowie deren Dienst an anderen Göttern. »Vorfahren« ist als kontextgerechte deutsche Wiedergabe von אֲבוֹתֵיכֶם vertretbar; die genealogische und im Hebräischen maskuline Referenz wird nicht sachlich verändert.'
