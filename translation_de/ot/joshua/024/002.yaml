  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֶל כָּל הָ/עָ֗ם כֹּֽה אָמַ֣ר יְהוָה֮ אֱלֹהֵ֣י יִשְׂרָאֵל֒ בְּ/עֵ֣בֶר הַ/נָּהָ֗ר יָשְׁב֤וּ אֲבֽוֹתֵי/כֶם֙ מֵֽ/עוֹלָ֔ם תֶּ֛רַח אֲבִ֥י אַבְרָהָ֖ם וַ/אֲבִ֣י נָח֑וֹר וַ/יַּעַבְד֖וּ אֱלֹהִ֥ים אֲחֵרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/002.yaml
  text: 'And Joshua said to all the people[a], “Thus says Yahweh, the God of Israel: Long ago your fathers lived beyond the River—Terah[b], the father of Abraham and the father of Nahor—and they served other gods.”'
translation:
  language: de
  text: 'Und Josua sagte zum ganzen Volk: »So spricht Jahwe, der Gott Israels: Jenseits des Stroms[a] lebten eure Vorfahren von alters her: Terach, der Vater Abrahams und der Vater Nahors. Sie dienten anderen Göttern.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit dem »Strom« ist wahrscheinlich der Euphrat gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und ... sagte
  rationale: Gibt das narrative Wayyiqtol in natürlichem Deutsch wieder und bewahrt den fortlaufenden Erzählzusammenhang.
- source_word: אֶל כָּל הָעָם
  choice: zum ganzen Volk
  rationale: עָם bezeichnet hier die versammelte Bundesgemeinschaft; »Volk« ist im Deutschen sachlich und idiomatisch.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Entspricht der festen Botenformel und klingt in gehobenem, modernem Bibeldeutsch natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Klare und formnahe Wiedergabe der Constructusverbindung.
- source_word: בְּעֵבֶר הַנָּהָר
  choice: Jenseits des Stroms
  rationale: Bewahrt die perspektivische Ortsangabe des Hebräischen; mit dem Strom ist wahrscheinlich der Euphrat gemeint.
- source_word: יָשְׁבוּ
  choice: lebten
  rationale: Gibt den hier gemeinten dauerhaften Wohnsitz in natürlichem Gegenwartsdeutsch wieder.
- source_word: אֲבוֹתֵיכֶם
  choice: eure Vorfahren
  rationale: Im Kontext bezeichnet das maskuline Pluralwort die früheren Generationen und wird anschließend durch Terach konkretisiert; »Vorfahren« ist im Deutschen präzise und natürlich.
- source_word: מֵעוֹלָם
  choice: von alters her
  rationale: Bezeichnet hier weit zurückliegende Zeit, nicht metaphysische Ewigkeit; die Wendung erhält den würdigen historischen Ton.
- source_word: תֶּרַח אֲבִי אַבְרָהָם וַאֲבִי נָחוֹר
  choice: Terach, der Vater Abrahams und der Vater Nahors
  rationale: Bewahrt die im Hebräischen wiederholte Bezeichnung »Vater«.
- source_word: וַיַּעַבְדוּ אֱלֹהִים אֲחֵרִים
  choice: Sie dienten anderen Göttern
  rationale: »Dienen« bildet עבד formnah ab und lässt zugleich dessen kultisch-religiöse Bedeutung erkennen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält ausdrücklich das Tetragramm; »Jahwe« bewahrt den Eigennamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bezeichnung der früheren Generationen אֲבוֹתֵיכֶם
  choice: eure Vorfahren
  alternative: eure Väter
  rationale: Gemeint sind die Ahnen Israels, insbesondere Terach; »Vorfahren« vermittelt diesen genealogischen Sinn im modernen Deutschen, ohne die historische Aussage zu erweitern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle Botenformel »So spricht« und die Wendung »von alters her« erhalten den feierlich-historischen Ton, während Satzbau und Wortwahl allgemein verständlich bleiben.
