source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר הָ/עָ֖ם אֶל יְהוֹשֻׁ֑עַ לֹ֕א כִּ֥י אֶת יְהוָ֖ה נַעֲבֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/021.yaml
  text: But the people said to Joshua[a], “No, but we will serve Yahweh.”
translation:
  language: de
  text: 'Aber das Volk sagte zu Josua: »Nein! Wir werden Jahwe dienen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: Das narrative Wayyiqtol von אמר leitet direkte Rede ein; »sagte« ist die natürliche deutsche Wiedergabe.
- source_word: הָעָם
  choice: das Volk
  rationale: עם bezeichnet hier die versammelte Bundesgemeinschaft Israels; »das Volk« ist im Deutschen sachgerecht und idiomatisch.
- source_word: יְהוֹשֻׁעַ
  choice: Josua
  rationale: Übliche deutsche Namensform.
- source_word: לֹא
  choice: Nein!
  rationale: Das alleinstehende לֹא weist Josuas vorherige Warnung entschieden zurück; der Ausruf gibt diese Nachdrücklichkeit natürlich wieder.
- source_word: כִּי
  choice: nicht eigens wiedergegeben
  rationale: Nach dem emphatischen לֹא leitet כִּי die berichtigende Gegenaussage ein. Im natürlichen Deutschen wird dieser Gegensatz durch die Satzfolge »Nein! Wir werden …« klar; ein zusätzliches »sondern« wäre möglich, aber nicht erforderlich.
- source_word: אֶת יְהוָה
  choice: Jahwe
  rationale: Die Akkusativpartikel אֶת wird im Deutschen nicht gesondert wiedergegeben; der Gottesname יהוה erscheint als »Jahwe«.
- source_word: נַעֲבֹד
  choice: wir werden dienen
  rationale: Der Qal-Imperfekt 1. Person Plural von עבד drückt hier die entschlossene künftige Bundesloyalität aus. »dienen« wahrt die weitere Bedeutung, die Verehrung und Gehorsam einschließt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. »Jahwe« gibt den persönlichen Bundesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von עבד im Bundeskontext
  choice: dienen
  alternative: verehren
  rationale: »Dienen« bewahrt sowohl den Gedanken der Verehrung als auch den der loyalen Unterordnung; »verehren« würde die Bedeutung unnötig auf den kultischen Aspekt verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe, nachdrückliche Antwort des Volkes bleibt erhalten; die Zeichensetzung macht die korrigierende Kraft von לֹא כִּי deutlich, ohne einen im Deutschen schwerfälligen Konnektor einzufügen.
