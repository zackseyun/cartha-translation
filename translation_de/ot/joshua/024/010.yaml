  source_fidelity: 'Die Wiedergabe von לֹא אָבִיתִי mit „wollte nicht“ und von לִשְׁמֹעַ לְ mit „auf ... hören“ ist treffend. Bileam ist auch im Deutschen klar das Subjekt von וַיְבָרֶךְ. Allerdings fügt „So musste er ... vielmehr segnen“ zwei nicht explizit ausgedrückte Elemente ein: eine kausale Folgerung („So“) und einen Zwang („musste“). Der Infinitivus absolutus verstärkt das Segnen, verlangt aber weder die Modalität des Müssens noch den Kontrastpartikel „vielmehr“.'
  naturalness: Der Ausgangstext ist gut verständlich und stilistisch würdig. Die Revision bewahrt diesen Registerton und verbindet die drei Aussagen enger entsprechend der hebräischen Reihung.
