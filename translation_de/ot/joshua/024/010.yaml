base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/010.yaml
  text: But I was not willing to listen to Balaam[a], and he indeed blessed you; so I delivered you from his hand.
translation:
  language: de
  text: Aber ich wollte nicht auf Bileam hören; er segnete euch tatsächlich, und ich rettete euch aus seiner Hand.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלֹא אָבִיתִי לִשְׁמֹעַ לְבִלְעָם
  choice: Aber ich wollte nicht auf Bileam hören
  rationale: אָבָה bezeichnet Willigkeit oder Einverständnis; die Verneinung wird daher volitional mit „wollte nicht“ wiedergegeben. שׁמע mit ל bedeutet hier „auf jemanden hören“.
- source_word: וַיְבָרֶךְ בָּרוֹךְ אֶתְכֶם
  choice: So musste er euch vielmehr segnen
  rationale: Der Infinitivus absolutus neben dem finiten Verb verstärkt die Aussage. „musste … vielmehr“ gibt im Kontext die nachdrückliche Umkehr von Bileams beabsichtigtem Fluch zum Segen idiomatisch wieder, ohne eine Wiederholung des Segnens grammatisch vorauszusetzen.
- source_word: וָאַצִּל אֶתְכֶם
  choice: und ich rettete euch
  rationale: נצל bezeichnet das Herausreißen oder Retten aus einer Bedrohung. „rettete“ ist im modernen Deutsch natürlich und bewahrt den konkreten Befreiungssinn.
- source_word: מִיָּדוֹ
  choice: aus seiner Hand
  rationale: Die hebräische Metapher für Macht oder Gewalt bleibt im Deutschen verständlich und wird daher bewahrt.
theological_decisions:
- issue: Subjekt und Nachdruck bei Bileams Segen
  choice: 'Bileam ist das Subjekt: „er … segnen“; der Kontext stellt dies als von Gott bewirkte Umkehr seiner Absicht dar.'
  alternative: 'Gott als unausgesprochenes Subjekt: „Ich segnete euch“; oder rein formal: „und er segnete euch nachdrücklich“.'
  rationale: Das Verb steht in der dritten Person Singular und folgt unmittelbar auf Bileam, der daher das natürliche grammatische Subjekt ist. „musste … vielmehr“ macht Gottes souveränes Überstimmen im Zusammenhang deutlich, ohne Gott zum grammatischen Subjekt des Verbs zu machen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung vermeidet eine schwerfällige Reihung; „aus seiner Hand“ erhält das anschauliche biblische Idiom.
