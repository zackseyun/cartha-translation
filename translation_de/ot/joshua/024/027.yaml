source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֶל כָּל הָ/עָ֗ם הִנֵּ֨ה הָ/אֶ֤בֶן הַ/זֹּאת֙ תִּֽהְיֶה בָּ֣/נוּ לְ/עֵדָ֔ה כִּֽי הִ֣יא שָׁמְעָ֗ה אֵ֚ת כָּל אִמְרֵ֣י יְהוָ֔ה אֲשֶׁ֥ר דִּבֶּ֖ר עִמָּ֑/נוּ וְ/הָיְתָ֤ה בָ/כֶם֙ לְ/עֵדָ֔ה פֶּֽן תְּכַחֲשׁ֖וּ/ן בֵּ/אלֹהֵי/כֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/027.yaml
  text: And Joshua said to all the people[a], “Look, this stone will be a witness against us, for it has heard all the words of Yahweh that he spoke with us. And it will be a witness against you[c][b], lest you deny your God.”
translation:
  language: de
  text: 'Und Josua sagte zum ganzen Volk: »Seht, dieser Stein soll Zeuge gegen uns sein[a]; denn er hat alle Worte Jahwes gehört, die er zu uns gesprochen hat[b]. Er soll Zeuge gegen euch sein, damit ihr euren Gott nicht verleugnet[c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Zeuge für uns« beziehungsweise »Zeuge unter uns«. Die hebräische Präposition ist mehrdeutig; im Zusammenhang warnt das Zeugnis vor Bundestreuebruch.'
    reason: lexical_alternative
  - marker: b
    text: 'Der Stein wird als Zeuge personifiziert: Er hat die Bundesworte »gehört«.'
    reason: cultural_note
  - marker: c
    text: 'Oder: »eurem Gott gegenüber treulos handelt« beziehungsweise »euch eurem Gott gegenüber als falsch erweist«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Seht
  rationale: Der Aufmerksamkeit weckende Ausdruck wird natürlich und ohne archaischen Klang wiedergegeben.
- source_word: הָאֶבֶן הַזֹּאת
  choice: dieser Stein
  rationale: אֶבֶן bezeichnet hier den als Bundeszeichen aufgestellten Stein.
- source_word: תִּהְיֶה ... לְעֵדָה
  choice: soll Zeuge ... sein
  rationale: Bewahrt den rechtlich-bundestheologischen Zeugnischarakter und klingt im Deutschen idiomatisch.
- source_word: בָּנוּ / בָכֶם
  choice: gegen uns / gegen euch
  rationale: Die Präposition kann neutraler verstanden werden; im warnenden Bundeskontext liegt jedoch die belastende Funktion des Zeugen nahe.
- source_word: שָׁמְעָה
  choice: hat ... gehört
  rationale: Gibt das Perfekt mit gegenwärtiger Relevanz wieder und erhält die ausdrückliche Personifizierung des Steins.
- source_word: כָּל אִמְרֵי יְהוָה
  choice: alle Worte Jahwes
  rationale: „Worte“ ist für die Bundesrede natürlich; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: אֲשֶׁר דִּבֶּר עִמָּנוּ
  choice: die er zu uns gesprochen hat
  rationale: Natürliches modernes Deutsch; עִם lässt zwar wörtlich „mit uns“ zu, doch „zu uns sprechen“ bezeichnet hier idiomatisch die göttliche Rede an das Volk.
- source_word: פֶּן תְּכַחֲשׁוּן בֵּאלֹהֵיכֶם
  choice: damit ihr euren Gott nicht verleugnet
  rationale: פֶּן leitet eine verhütende Warnung ein; כחש bezeichnet hier das Verleugnen beziehungsweise treulose Abstreiten der Bindung an Gott.
theological_decisions:
- issue: Personifizierung des Steins als hörender Zeuge
  choice: Die personifizierende Aussage wird ausdrücklich beibehalten.
  alternative: Den Stein lediglich als Erinnerungszeichen umschreiben.
  rationale: Der hebräische Text sagt ausdrücklich, der Stein habe gehört und werde Zeuge sein; eine entpersonifizierende Paraphrase würde die Bundeszeremonie rhetorisch verflachen.
- issue: Belastende oder neutrale Funktion des Zeugen
  choice: „Zeuge gegen uns/euch“ im Haupttext.
  alternative: „Zeuge für uns/euch“ oder „Zeuge unter uns/euch“.
  rationale: Die hebräische Präposition ב ist nicht völlig eindeutig. Der nachfolgende Warnsatz vor der Verleugnung Gottes spricht im Kontext für eine belastende Zeugenschaft, ohne die neutralere Möglichkeit auszuschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „Zeuge“ und die auffällige Personifizierung bleiben erhalten. „Seht“ wahrt den aufmerksamkeitslenkenden Charakter von הִנֵּה ohne das archaische „Siehe“. Die Fußnotenmarker stehen jeweils unmittelbar an der betroffenen Formulierung.
