  terminology: „Jahwe“, „Zeuge“, „Worte“ und „verleugnet“ sind konsistent und sachgerecht. Die Fußnoten erklären die Personifizierung und die lexikalischen Alternativen, ohne den Haupttext konfessionell oder interpretativ zu überformen.
