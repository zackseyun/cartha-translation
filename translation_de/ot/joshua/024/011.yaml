base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/011.yaml
  text: Then you crossed the Jordan and came to Jericho[a], and the men of Jericho fought against you—the Amorites, the Perizzites, the Canaanites, the Hittites, the Girgashites, the Hivites, and the Jebusites—and I gave them into your hand.
translation:
  language: de
  text: Dann überquertet ihr den Jordan und kamt nach Jericho. Gegen euch kämpften die Herren von Jericho[a], die Amoriter, die Perisiter, die Kanaaniter, die Hetiter, die Girgaschiter, die Hiwiter und die Jebusiter. Und ich gab sie in eure Hand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Herren/Besitzer von Jericho“. Gemeint sein können die Herrscher oder führenden Männer der Stadt, möglicherweise auch ihre maßgeblichen Einwohner.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַבְרוּ אֶת הַיַּרְדֵּן
  choice: Dann überquertet ihr den Jordan
  rationale: Das Qal von עבר bezeichnet hier konkret das Überqueren des Jordan; „überqueren“ ist im modernen Deutsch natürlich und präzise.
- source_word: וַתָּבֹאוּ אֶל יְרִיחוֹ
  choice: und kamt nach Jericho
  rationale: בוא mit אֶל bezeichnet die Ankunft bei beziehungsweise in Jericho. „Nach Jericho kommen“ bewahrt diese räumliche Offenheit und behauptet nicht ausdrücklich, dass die Stadt betreten wurde.
- source_word: וַיִּלָּחֲמוּ בָכֶם
  choice: kämpften gegen euch
  rationale: לחם mit ב bezeichnet hier eine feindliche Auseinandersetzung; „gegen euch kämpfen“ gibt dies idiomatisch wieder.
- source_word: בַּעֲלֵי יְרִיחוֹ
  choice: die Herren von Jericho
  rationale: בעלי bedeutet wörtlich „Herren/Besitzer“ und kann die Machthaber oder führenden Männer der Stadt bezeichnen. Die formnahe Wiedergabe bewahrt die genuine lexikalische Unbestimmtheit; eine Fußnote erläutert sie.
- source_word: הָאֱמֹרִי וְהַפְּרִזִּי וְהַכְּנַעֲנִי וְהַחִתִּי וְהַגִּרְגָּשִׁי הַחִוִּי וְהַיְבוּסִי
  choice: die Amoriter, die Perisiter, die Kanaaniter, die Hetiter, die Girgaschiter, die Hiwiter und die Jebusiter
  rationale: Die singularischen hebräischen Volksbezeichnungen sind kollektiv gebraucht und werden nach üblicher deutscher Bibelsprache im Plural wiedergegeben.
- source_word: וָאֶתֵּן אוֹתָם בְּיֶדְכֶם
  choice: Doch ich gab sie in eure Hand
  rationale: Die Wendung נתן ביד bezeichnet die Auslieferung in die Gewalt eines anderen. „In eure Hand“ erhält das verständliche biblische Bild; „doch“ hebt den Wechsel zum entscheidenden göttlichen Handeln hervor, ohne zusätzliche Kausalität einzutragen.
theological_decisions:
- issue: Gottes Urheberschaft am Sieg Israels
  choice: „Doch ich gab sie in eure Hand“
  alternative: „Doch ich lieferte sie euch aus“
  rationale: Die erste Person der göttlichen Rede und das aktive Verb bleiben erhalten. Der Sieg wird ausdrücklich Gottes Handeln zugeschrieben und weder zu bloßer Erlaubnis noch zu unbestimmter Vorsehung abgeschwächt.
- issue: Identität der בַּעֲלֵי יְרִיחוֹ
  choice: „die Herren von Jericho“ mit erläuternder Fußnote
  alternative: „die Männer/Bewohner/Führer von Jericho“
  rationale: Der hebräische Ausdruck lässt offen, ob Herrscher, führende Männer oder allgemeiner die maßgeblichen Einwohner gemeint sind. Die Übersetzung entscheidet diese historische Frage nicht stillschweigend.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit moderat formnaher Syntax. Die traditionellen deutschen Namen der Völker werden beibehalten. Der Doppelpunkt macht die nachfolgende Völkerliste als nähere Bestimmung der Gegner lesbar, ohne die syntaktische Spannung des Hebräischen unnötig zu glätten.
