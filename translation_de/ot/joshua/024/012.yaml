  text: וָ/אֶשְׁלַ֤ח לִ/פְנֵי/כֶם֙ אֶת הַ/צִּרְעָ֔ה וַ/תְּגָ֤רֶשׁ אוֹתָ/ם֙ מִ/פְּנֵי/כֶ֔ם שְׁנֵ֖י מַלְכֵ֣י הָ/אֱמֹרִ֑י לֹ֥א בְ/חַרְבְּ/ךָ֖ וְ/לֹ֥א בְ/קַשְׁתֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/012.yaml
  text: And I sent the hornet ahead of you[a], and it drove them out before you—the two kings of the Amorites—not by your sword and not by your bow.
translation:
  language: de
  text: Und ich sandte die Hornisse vor euch her[a] und vertrieb sie vor euch – die beiden Könige der Amoriter –, nicht durch dein Schwert und nicht durch deinen Bogen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Möglicherweise ist die Hornisse bildlich als von Gott gesandte Panik oder als Schrecken zu verstehen und nicht wörtlich.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלַח
  choice: Und ich sandte
  rationale: Das Qal-Wayyiqtol der 1. Person Singular erzählt Gottes vorausgehendes Handeln; „Und ich sandte“ bewahrt den fortlaufenden Erzählzusammenhang.
- source_word: לִפְנֵיכֶם
  choice: vor euch her
  rationale: Die Wendung bedeutet wörtlich „vor eurem Angesicht“ und bezeichnet hier natürlich das Vorausgehen.
- source_word: הַצִּרְעָה
  choice: die Hornisse
  rationale: Der konkrete lexikalische Sinn ist „Hornisse“. Der bestimmte Singular kann repräsentativ oder kollektiv verstanden werden; eine mögliche bildliche Deutung wird in der Fußnote offengehalten.
- source_word: וַתְּגָרֶשׁ
  choice: und sie vertrieb sie
  rationale: גרשׁ bedeutet „vertreiben“. Das feminine Verb stimmt mit „Hornisse“ überein; das erste „sie“ bezeichnet daher die Hornisse, das zweite die Vertriebenen.
- source_word: מִפְּנֵיכֶם
  choice: vor euch
  rationale: In Verbindung mit „vertreiben“ bezeichnet die Wendung die Entfernung der Feinde aus der Gegenwart Israels.
- source_word: שְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: die beiden Könige der Amoriter
  rationale: Die Wiedergabe folgt der hebräischen Genitivverbindung und bleibt im Deutschen natürlich.
- source_word: לֹא בְחַרְבְּךָ וְלֹא בְקַשְׁתֶּךָ
  choice: nicht durch dein Schwert und nicht durch deinen Bogen
  rationale: ב ist hier instrumental. Die singularischen Possessivformen werden bewahrt und unterstreichen, dass der Sieg nicht durch Israels eigene Waffen zustande kam.
theological_decisions:
- issue: Wörtliche oder bildliche Deutung von הַצִּרְעָה
  choice: Im Haupttext wörtlich „die Hornisse“
  alternative: Deutend „Schrecken“, „Panik“ oder „Angst“
  rationale: Der konkrete Wortsinn soll nicht stillschweigend durch eine Auslegung ersetzt werden. Zugleich bleibt durch die Fußnote erkennbar, dass die Hornisse möglicherweise bildlich für von Gott gesandten Schrecken steht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Wechsel von pluralischem „euch“ zu singularischem „dein/deinen“ folgt bewusst dem hebräischen Text. Die Gedankenstriche markieren die nachgestellte nähere Bestimmung, ohne die syntaktische Spannung aufzulösen.
