  - severity: low
    issue: Fußnotenformulierung „nicht für buchstäbliche Hornissen“
    rationale: Die Formulierung ist verständlich, aber weniger idiomatisch als eine direkte Gegenüberstellung von möglicher Bildlichkeit und wörtlichem Verständnis.
