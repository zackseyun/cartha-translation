source:
  edition: WLC
  text: וָֽ/אוֹצִ֤יא אֶת אֲבֽוֹתֵי/כֶם֙ מִ/מִּצְרַ֔יִם וַ/תָּבֹ֖אוּ הַ/יָּ֑מָּ/ה וַ/יִּרְדְּפ֨וּ מִצְרַ֜יִם אַחֲרֵ֧י אֲבוֹתֵי/כֶ֛ם בְּ/רֶ֥כֶב וּ/בְ/פָרָשִׁ֖ים יַם סֽוּף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/006.yaml
  text: Then I brought your fathers out from Egypt[a], and you came to the sea; and the Egyptians pursued your fathers with chariots and horsemen to the Red Sea.
translation:
  language: de
  text: Dann führte ich eure Väter aus Ägypten heraus, und ihr kamt ans Meer. Die Ägypter aber verfolgten eure Väter mit Streitwagen und Reitern bis ans Schilfmeer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: das Rote Meer. Wörtlich: Meer des Schilfs. Hebräisch: jam suf.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאוֹצִיא
  choice: Dann führte ich ... heraus
  rationale: Der Hifil von יצא bedeutet „herausführen“ bzw. „herausbringen“. „Dann“ gibt die durch das vorangestellte Waw fortgeführte Erzählfolge natürlich wieder.
- source_word: אֲבוֹתֵיכֶם
  choice: eure Väter
  rationale: Die wörtliche familiäre Bezeichnung „eure Väter“ bleibt erhalten und bezeichnet hier die Vorfahren der Angesprochenen.
- source_word: מִמִּצְרַיִם
  choice: aus Ägypten
  rationale: Die Präposition מן bezeichnet den Ausgangspunkt; zusammen mit „herausführen“ ist „aus Ägypten“ idiomatisch und genau.
- source_word: וַתָּבֹאוּ הַיָּמָּה
  choice: und ihr kamt ans Meer
  rationale: בוא mit dem direktionalen ה bezeichnet die Bewegung zum Meer hin. Die zweite Person Plural bleibt erhalten, weil die gegenwärtigen Zuhörer mit der Exodusgeneration angesprochen werden.
- source_word: וַיִּרְדְּפוּ מִצְרַיִם
  choice: Die Ägypter aber verfolgten
  rationale: מִצְרַיִם ist formal der Landesname „Ägypten“, steht hier jedoch metonymisch für die ägyptischen Verfolger; der Plural des Verbs unterstützt im Deutschen die natürliche Wiedergabe „die Ägypter“. „Aber“ markiert den im Kontext empfundenen Gegensatz, ohne den Inhalt aufzulösen.
- source_word: בְּרֶכֶב
  choice: mit Streitwagen
  rationale: רֶכֶב bezeichnet hier die militärischen Wagen bzw. Streitwagenverbände. „Streitwagen“ ist im Deutschen eindeutig und sachgerecht.
- source_word: וּבְפָרָשִׁים
  choice: und Reitern
  rationale: פָּרָשִׁים bezeichnet berittene Krieger oder Reitertruppen; „Reiter“ ist eine klare, gegenwärtige Wiedergabe.
- source_word: יַם סוּף
  choice: Schilfmeer
  rationale: Die hebräische Bezeichnung bedeutet am ehesten „Schilfmeer“. Diese quellennähere Form wird im Haupttext verwendet; die traditionelle Bezeichnung „Rotes Meer“ steht in der Fußnote.
theological_decisions:
- issue: Repräsentative Anrede des späteren Israel in der zweiten Person
  choice: „ihr kamt ans Meer“
  alternative: „sie kamen ans Meer“
  rationale: Der hebräische Text identifiziert die angesprochenen Israeliten rhetorisch mit ihren Vätern in der Bundesgeschichte. Der Wechsel in die dritte Person würde diese Spannung einebnen.
- issue: Wiedergabe von יַם סוּף
  choice: „Schilfmeer“ im Haupttext
  alternative: „Rotes Meer“
  rationale: „Schilfmeer“ bildet die hebräische Benennung transparenter ab, ohne eine präzisere geografische Identifikation zu behaupten, als der Ausdruck selbst erlaubt. Die traditionelle Wiedergabe bleibt als Fußnote zugänglich.
- issue: Metonymischer Gebrauch von „Ägypten“ bei pluralischem Verb
  choice: „die Ägypter“
  alternative: „Ägypten“
  rationale: Die Formulierung bezeichnet die ägyptischen Verfolger als handelnde Gruppe. Das pluralische Verb und natürliches modernes Deutsch sprechen für „die Ägypter“, ohne den historischen Bezug zu verändern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt eng am Hebräischen; ein Punkt statt eines Semikolons verbessert die Lesbarkeit. „Väter“ bewahrt die konkrete Ausdrucksweise des Ausgangstextes, während „Schilfmeer“ die hebräische Benennung transparent wiedergibt.
