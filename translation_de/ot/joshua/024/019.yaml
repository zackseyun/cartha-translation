  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֶל הָ/עָ֗ם לֹ֤א תֽוּכְלוּ֙ לַ/עֲבֹ֣ד אֶת יְהוָ֔ה כִּֽי אֱלֹהִ֥ים קְדֹשִׁ֖ים ה֑וּא אֵֽל קַנּ֣וֹא ה֔וּא לֹֽא יִשָּׂ֥א לְ/פִשְׁעֲ/כֶ֖ם וּ/לְ/חַטֹּאותֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/019.yaml
  text: And Joshua said to the people[a], “You are not able to serve Yahweh, for he is a holy God; he is a jealous God[b]. He will not forgive your transgressions and your sins.”
translation:
  language: de
  text: 'Und Josua sagte zum Volk: „Ihr könnt Jahwe nicht dienen, denn er ist ein heiliger Gott[a], ein eifersüchtiger Gott. Er wird eure Vergehen und eure Sünden nicht vergeben.[b]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräischen Wörter für „Gott“ und „heilig“ haben hier Pluralform, das Pronomen „er“ steht jedoch im Singular und verweist auf den einen Gott Israels.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Er wird eure Vergehen und eure Sünden nicht tragen (oder: wegtragen).“ Die hebräische Wendung wird häufig im Sinn von Vergebung gebraucht.'
    reason: alternative_reading
lexical_decisions:
- source_word: תֽוּכְלוּ
  choice: könnt
  rationale: Das Verb יכל bezeichnet Fähigkeit oder Vermögen. „Ihr könnt … nicht“ gibt die im Hebräischen ausgesagte Unfähigkeit natürlich und direkt wieder.
- source_word: לַעֲבֹד
  choice: dienen
  rationale: עבד umfasst im Bundeszusammenhang sowohl Dienst als auch Gottesverehrung. „Dienen“ bewahrt diese weitere Bedeutung, ohne sie auf kultische Anbetung zu verengen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, damit der im Ausgangstext stehende Eigenname erkennbar bleibt und nicht durch einen Titel ersetzt wird.
- source_word: אֱלֹהִים קְדֹשִׁים הוּא
  choice: er ist ein heiliger Gott
  rationale: אֱלֹהִים und קְדֹשִׁים sind formal Plural, doch das Pronomen הוּא steht im Singular und verweist auf Israels einen Gott. Die deutsche Singularform gibt den Sinn korrekt wieder; die auffällige Morphologie wird in einer Fußnote dokumentiert.
- source_word: אֵל קַנּוֹא
  choice: ein eifersüchtiger Gott
  rationale: קַנּוֹא bezeichnet hier Gottes ausschließlichen Anspruch auf die Treue seines Volkes und seine Unvereinbarkeit mit konkurrierender Verehrung. „Eifersüchtig“ bewahrt diese relationale und bundestheologische Spannung.
- source_word: לֹא יִשָּׂא
  choice: wird … nicht vergeben
  rationale: נשא wird in Verbindung mit Schuld- und Sündenbegriffen idiomatisch für das Tragen beziehungsweise Wegnehmen und damit für das Vergeben von Schuld gebraucht. „Nicht vergeben“ ist im Deutschen klar; die bildlichere Wiedergabe wird als Alternative vermerkt.
- source_word: פִשְׁעֲכֶם
  choice: eure Vergehen
  rationale: פשע bezeichnet Übertretung und kann den Beiklang von Auflehnung tragen. „Vergehen“ unterscheidet den Ausdruck von dem folgenden allgemeinen Wort für Sünden, ohne die Aussage unnötig zu verschärfen.
- source_word: חַטֹּאותֵיכֶם
  choice: eure Sünden
  rationale: חטאת ist der gewöhnliche Ausdruck für Sünde; „Sünden“ ist die direkte und verständliche deutsche Entsprechung.
theological_decisions:
- issue: Pluralformen in אֱלֹהִים קְדֹשִׁים bei singularischem Pronomen
  choice: 'Singularisch: „er ist ein heiliger Gott“'
  alternative: Eine formal plurale Wiedergabe wie „heilige Götter“
  rationale: Das singularische הוּא und der Kontext zeigen eindeutig, dass der eine Gott Israels gemeint ist. Eine deutsche Pluralform würde fälschlich mehrere Götter nahelegen; die formale Besonderheit bleibt durch die Fußnote sichtbar.
- issue: Bedeutung von נשא bei Vergehen und Sünden
  choice: „nicht vergeben“
  alternative: „nicht tragen“ oder „nicht wegtragen“
  rationale: Die Wendung kann idiomatisch Vergebung bezeichnen. Die verständliche Hauptübersetzung wahrt die scharfe Warnung Josuas, während die Fußnote das zugrunde liegende Bild und die genuine lexikalische Spannweite nennt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Der Satzbau bleibt nahe am Hebräischen, ohne unnatürlich zu wirken. Der Eigenname „Jahwe“ wird beibehalten; die beiden inhaltlich wichtigen Mehrdeutigkeiten werden in Fußnoten offengelegt.
