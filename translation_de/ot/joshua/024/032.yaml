source:
  edition: WLC
  text: וְ/אֶת עַצְמ֣וֹת י֠וֹסֵף אֲשֶׁר הֶעֱל֨וּ בְנֵי יִשְׂרָאֵ֥ל מִ/מִּצְרַיִם֮ קָבְר֣וּ בִ/שְׁכֶם֒ בְּ/חֶלְקַ֣ת הַ/שָּׂדֶ֗ה אֲשֶׁ֨ר קָנָ֧ה יַעֲקֹ֛ב מֵ/אֵ֛ת בְּנֵֽי חֲמ֥וֹר אֲבִֽי שְׁכֶ֖ם בְּ/מֵאָ֣ה קְשִׂיטָ֑ה וַ/יִּֽהְי֥וּ לִ/בְנֵֽי יוֹסֵ֖ף לְ/נַחֲלָֽה־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/032.yaml
  text: And the bones of Joseph[a], which the sons of Israel had brought up from Egypt, they buried at Shechem, in the portion of the field that Jacob had bought from the sons of Hamor, the father of Shechem, for a hundred qesitahs[c][b]; and it became an inheritance for the sons of Joseph.
translation:
  language: de
  text: Die Gebeine Josefs, die die Söhne Israels aus Ägypten heraufgebracht hatten, begruben die Söhne Israels bei Sichem auf dem Feldstück[a], das Jakob von den Söhnen Hamors, des Vaters von Sichem[b], für hundert Kesita[c] gekauft hatte. Sie wurden den Söhnen Josefs zum Erbbesitz[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »auf dem Grundstück«. Das hebräische Wort bezeichnet ein abgegrenztes Stück beziehungsweise einen Anteil Land.'
    reason: lexical_alternative
  - marker: b
    text: »Vater« kann im weiteren Sinn auch »Stammvater« bedeuten; falls »Sichem« hier als Ortsbezeichnung verstanden wird, kommt auch »Gründer« in Betracht.
    reason: lexical_alternative
  - marker: c
    text: Kesita ist eine alte Wert- oder Geldeinheit; ihr genauer Wert ist unbekannt.
    reason: cultural_note
  - marker: d
    text: Das hebräische Verb steht im Plural und kann sich grammatisch auf die Gebeine beziehen. Dem Zusammenhang nach kann jedoch auch der erworbene Landbesitz gemeint sein, der den Söhnen Josefs als Erbbesitz zufiel.
    reason: textual_ambiguity
lexical_decisions:
- source_word: עַצְמוֹת
  choice: Gebeine
  rationale: Das hebräische Wort bezeichnet wörtlich »Knochen«. »Gebeine« bewahrt diese konkrete Bedeutung und klingt bei den sterblichen Überresten eines Menschen im Deutschen natürlich und würdig.
- source_word: הֶעֱלוּ
  choice: heraufgebracht hatten
  rationale: Der Hifil von עלה bedeutet »heraufbringen«. Das Plusquamperfekt macht deutlich, dass der Transport aus Ägypten der Bestattung vorausging.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die Wiedergabe erhält den familiären Ausdruck des Hebräischen und bleibt im Deutschen verständlich; »Israeliten« wäre idiomatischer, aber weniger quellennah.
- source_word: בִּשְׁכֶם
  choice: bei Sichem
  rationale: »Bei Sichem« bezeichnet den Bestattungsort, ohne unnötig festzulegen, ob er innerhalb der Stadtgrenzen lag.
- source_word: בְּחֶלְקַת הַשָּׂדֶה
  choice: auf dem Feldstück
  rationale: חלקה bezeichnet ein abgegrenztes Stück beziehungsweise einen Anteil eines Feldes. »Feldstück« ist knapp, konkret und im modernen Deutschen verständlich.
- source_word: קָנָה
  choice: gekauft hatte
  rationale: Im Zusammenhang mit dem genannten Preis ist »kaufen« genauer als das allgemeinere »erwerben«; das Plusquamperfekt kennzeichnet die frühere Handlung.
- source_word: בְּנֵי חֲמוֹר
  choice: von den Söhnen Hamors
  rationale: Die Formulierung gibt die hebräische Verwandtschaftsbezeichnung direkt wieder, ohne sie deutend zu »Nachkommen« zu erweitern.
- source_word: אֲבִי שְׁכֶם
  choice: des Vaters von Sichem
  rationale: Dies ist die unmittelbarste Wiedergabe. Ob »Vater« hier biologisch oder im weiteren Sinn als Stammvater beziehungsweise Gründer gemeint ist, bleibt offen und wird angemerkt.
- source_word: בְּמֵאָה קְשִׂיטָה
  choice: für hundert Kesita
  rationale: Da Wert und genaue Art der antiken Einheit unbekannt sind, vermeidet die Transliteration eine irreführende moderne Umrechnung.
- source_word: וַיִּהְיוּ ... לְנַחֲלָה
  choice: Sie wurden ... zum Erbbesitz
  rationale: Die deutsche Pluralform bildet den hebräischen Plural nach und lässt dessen Bezug zunächst stehen. »Erbbesitz« bringt den dauerhaften, erblichen Besitzcharakter von נחלה präzise zum Ausdruck.
theological_decisions:
- issue: Familiäre Bundesbezeichnung בְנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Israeliten
  rationale: Die quellennähere Form bewahrt die familiäre Prägung der Bezeichnung, ohne eine zusätzliche konfessionelle Deutung einzutragen.
- issue: Bezug des pluralischen וַיִּהְיוּ am Versende
  choice: Sie wurden den Söhnen Josefs zum Erbbesitz
  alternative: Das Feldstück wurde zum Erbbesitz der Söhne Josefs
  rationale: Der hebräische Plural stimmt grammatisch mit »Gebeine« überein, während der Zusammenhang auch an das zuvor genannte Grundstück denken lässt, das zum Stammesbesitz der Nachkommen Josefs wurde. Der Haupttext bewahrt die Form des Hebräischen; eine Fußnote macht die Bezugsmöglichkeit transparent.
- issue: Unbestimmte antike Werteinheit קְשִׂיטָה
  choice: Kesita
  alternative: Geldstücke
  rationale: Die Transliteration vermeidet eine sachlich unbelegte Festlegung auf Münzen oder einen modernen Geldwert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit maßvoll quellennaher Satzführung. »Gebeine«, »Erbbesitz« und »Söhne Israels« erhalten den konkreten und familiären Charakter des Hebräischen, ohne altertümliche Verbformen zu verwenden. Die Ortsnamensform »Sichem« folgt dem etablierten deutschen Bibelgebrauch.
