  text: וָ/אֶשְׁלַ֞ח אֶת מֹשֶׁ֤ה וְ/אֶֽת אַהֲרֹן֙ וָ/אֶגֹּ֣ף אֶת מִצְרַ֔יִם כַּ/אֲשֶׁ֥ר עָשִׂ֖יתִי בְּ/קִרְבּ֑/וֹ וְ/אַחַ֖ר הוֹצֵ֥אתִי אֶתְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/005.yaml
  text: Then I sent Moses and Aaron[a], and I struck Egypt as I did in its midst[b], and afterward I brought you out.
translation:
  language: de
  text: Dann sandte ich Mose und Aaron, und ich schlug[a] Ägypten, wie ich in seiner Mitte gehandelt hatte.[b] Danach führte ich euch heraus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich suchte Ägypten mit Plagen heim.“ Das hebräische Verb kann „schlagen“, „treffen“ oder „plagen“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „wie/entsprechend dem, was ich in seiner Mitte getan hatte“. Die hebräische Formulierung ist stark gerafft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלַח
  choice: sandte ich
  rationale: שׁלח bedeutet im Qal gewöhnlich „senden“. „Sandte ich“ gibt Gottes Beauftragung von Mose und Aaron natürlich und würdig wieder.
- source_word: מֹשֶׁה וְאֶת־אַהֲרֹן
  choice: Mose und Aaron
  rationale: Die im Deutschen üblichen Namensformen werden verwendet.
- source_word: וָאֶגֹּף
  choice: ich schlug
  rationale: נגף kann „schlagen“, „treffen“ oder „plagen“ bedeuten. „Ich schlug“ bewahrt die Bildkraft und Bedeutungsbreite des hebräischen Verbs, ohne die Plagen bereits ausdrücklich in den Haupttext einzutragen.
- source_word: מִצְרַיִם
  choice: Ägypten
  rationale: Der Name kann das Land oder dessen Bevölkerung kollektiv bezeichnen; „Ägypten“ lässt diese mögliche Bedeutungsbreite bestehen.
- source_word: כַּאֲשֶׁר עָשִׂיתִי בְּקִרְבּוֹ
  choice: mit dem, was ich in seiner Mitte tat
  rationale: Die hebräische Wendung ist syntaktisch gedrängt. Diese Fassung ist im Deutschen verständlich und verbindet das Schlagen Ägyptens mit Gottes Handeln in dessen Mitte, ohne dieses Handeln ausdrücklich als die Plagen auszudeuten. Eine wörtlichere Wiedergabe wird in der Fußnote genannt.
- source_word: וְאַחַר
  choice: Danach
  rationale: אַחַר wird hier temporal gebraucht. „Danach“ stellt die zeitliche Abfolge klar und natürlich dar.
- source_word: הוֹצֵאתִי אֶתְכֶם
  choice: führte ich euch heraus
  rationale: Der Hifil von יצא bedeutet „herausbringen“ beziehungsweise „herausführen“. „Führte ich euch heraus“ ist idiomatisch und bewahrt den direkten Bezug auf die angesprochenen Israeliten.
theological_decisions:
- issue: Bezug des Pronomens der zweiten Person Plural in אֶתְכֶם
  choice: „euch“ bleibt als unmittelbare kollektive Anrede Israels erhalten.
  alternative: Erklärend „eure Vorfahren“ einsetzen.
  rationale: Der hebräische Text sagt ausdrücklich „euch“ und spricht die gegenwärtige Bundesgemeinschaft in Solidarität mit der Exodusgeneration an. Eine Umschreibung mit „eure Vorfahren“ würde diese rhetorische und theologische Spannung auflösen.
- issue: Deutung des Schlages gegen Ägypten
  choice: Das allgemeine Verb „schlagen“ bleibt im Haupttext erhalten.
  alternative: Ausdrücklich „mit Plagen heimsuchen“ übersetzen.
  rationale: Der Zusammenhang weist zwar auf die Plagen, doch נגף ist weiter gefasst. Die Übersetzung soll die kontextuelle Deutung ermöglichen, ohne sie lexikalisch zu erzwingen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Die Satzteilung vor „Danach“ vermeidet eine schwerfällige Kettenkonstruktion. Die ungewöhnlich gedrängte hebräische Wendung wird im Haupttext verständlich wiedergegeben und in der Fußnote formal näher abgebildet.
