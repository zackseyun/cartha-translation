  variant: modern standard German
source:
  edition: WLC
  text: וְ/אִם֩ רַ֨ע בְּֽ/עֵינֵי/כֶ֜ם לַ/עֲבֹ֣ד אֶת יְהוָ֗ה בַּחֲר֨וּ לָ/כֶ֣ם הַ/יּוֹם֮ אֶת מִ֣י תַעֲבֹדוּ/ן֒ אִ֣ם אֶת אֱלֹהִ֞ים אֲשֶׁר עָבְד֣וּ אֲבוֹתֵי/כֶ֗ם אֲשֶׁר֙ ב/עבר הַ/נָּהָ֔ר וְ/אִם֙ אֶת אֱלֹהֵ֣י הָ/אֱמֹרִ֔י אֲשֶׁ֥ר אַתֶּ֖ם יֹשְׁבִ֣ים בְּ/אַרְצָ֑/ם וְ/אָנֹכִ֣י וּ/בֵיתִ֔/י נַעֲבֹ֖ד אֶת יְהוָֽה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/015.yaml
  text: But if it is evil in your eyes to serve Yahweh[a], choose for yourselves today whom you will serve—whether the gods your fathers served beyond the River, or the gods of the Amorites in whose land you are dwelling. But as for me and my house[d][c][b], we will serve Yahweh.
translation:
  language: de
  text: 'Doch wenn es in euren Augen schlecht ist, Jahwe zu dienen,[a] dann entscheidet euch heute, wem ihr dienen wollt: den Göttern, denen eure Väter jenseits des Stromes[b] dienten, oder den Göttern der Amoriter, in deren Land ihr wohnt. Ich aber und mein Haus[c] werden Jahwe dienen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn es euch falsch erscheint“ beziehungsweise „wenn es euch missfällt“; wörtlich: „wenn es in euren Augen schlecht ist“.'
    reason: lexical_alternative
  - marker: b
    text: Mit „dem Strom“ ist der Euphrat gemeint.
    reason: cultural_note
  - marker: c
    text: 'Oder: „mein Haushalt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם רַע בְּעֵינֵיכֶם
  choice: Doch wenn es in euren Augen schlecht ist
  rationale: Bewahrt die hebräische Bildsprache und den scharfen Gegensatz, bleibt dabei aber in modernem Deutsch verständlich. „Schlecht“ gibt רַע offen wieder, ohne die Bewertung als sittliche Bosheit festzulegen.
- source_word: לַעֲבֹד / תַעֲבֹדוּן / עָבְדוּ / נַעֲבֹד
  choice: dienen
  rationale: Die einheitliche Wiedergabe erhält die auffällige Wiederholung der Wurzel עבד und umfasst sowohl Gottesdienst als auch loyale Zugehörigkeit.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen im Deutschen in seiner üblichen wissenschaftlich und kirchlich geläufigen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: בַּחֲרוּ לָכֶם הַיּוֹם
  choice: dann entscheidet euch heute
  rationale: „Sich entscheiden“ gibt das reflexive לָכֶם in natürlichem Deutsch wieder; „heute“ bewahrt die zeitliche Dringlichkeit.
- source_word: אֶת מִי תַעֲבֹדוּן
  choice: wem ihr dienen wollt
  rationale: Beim deutschen Verb „dienen“ steht die Person im Dativ. „Wollt“ bringt die in der geforderten Wahl liegende künftige Ausrichtung idiomatisch zum Ausdruck.
- source_word: אֱלֹהִים / אֱלֹהֵי
  choice: Götter
  rationale: Der Plural bezeichnet hier fremde Gottheiten; die direkte Bezeichnung bewahrt die religiöse Gegenüberstellung.
- source_word: אֲשֶׁר עָבְדוּ אֲבוֹתֵיכֶם
  choice: denen eure Väter dienten
  rationale: Gibt das ausdrücklich männliche אֲבוֹתֵיכֶם formal wieder; die mögliche weitere Bedeutung „Vorfahren“ wird nicht stillschweigend eingesetzt.
- source_word: בְּעֵבֶר הַנָּהָר
  choice: jenseits des Stromes
  rationale: Bewahrt die traditionelle geografische Bezeichnung; eine Fußnote identifiziert den gemeinten Strom als Euphrat.
- source_word: אֲשֶׁר אַתֶּם יֹשְׁבִים בְּאַרְצָם
  choice: in deren Land ihr wohnt
  rationale: Gibt die gegenwärtige Wohnsituation natürlich und genau wieder.
- source_word: וְאָנֹכִי וּבֵיתִי
  choice: Ich aber und mein Haus
  rationale: Das betonte אָנֹכִי und der Kontrast werden durch „Ich aber“ sichtbar. „Haus“ bewahrt das biblische Bild und kann den gesamten Haushalt bezeichnen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen. Seine Wiedergabe als „Jahwe“ bewahrt den persönlichen Bundesnamen und ersetzt ihn nicht durch einen Titel.
- issue: Bedeutungsumfang von עבד
  choice: dienen
  alternative: verehren
  rationale: „Dienen“ erhält die wiederholte Bundes- und Loyalitätssprache und schließt kultische Verehrung ein, ohne die Bedeutung darauf zu verengen.
- issue: Anrede der Vorfahren mit אֲבוֹתֵיכֶם
  choice: eure Väter
  alternative: eure Vorfahren
  rationale: Die formale Wiedergabe bewahrt die männliche Bezeichnung des Hebräischen; die allgemeinere Bedeutung bleibt als kontextuell mögliche Lesart bestehen.
- issue: Josuas Aussage über sein Haus
  choice: Ich aber und mein Haus werden Jahwe dienen
  alternative: Ich aber werde mit meinem Haushalt Jahwe dienen
  rationale: Die kollektive Formulierung des Hebräischen bleibt erhalten, ohne zusätzliche Aussagen über individuelle Entscheidungsfähigkeit oder Hausordnung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit erkennbarer hebräischer Bildsprache. Die Wiederholung von „dienen“ trägt die Rhetorik des Verses. „Strom“ und „Haus“ sind bewusst etwas bibelsprachlich, werden jedoch durch knappe Fußnoten erschlossen.
