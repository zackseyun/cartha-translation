source:
  edition: WLC
  text: וַ/יִּצְעֲק֣וּ אֶל יְהוָ֗ה וַ/יָּ֨שֶׂם מַֽאֲפֵ֜ל בֵּינֵי/כֶ֣ם וּ/בֵ֣ין הַ/מִּצְרִ֗ים וַ/יָּבֵ֨א עָלָ֤י/ו אֶת הַ/יָּם֙ וַ/יְכַסֵּ֔/הוּ וַ/תִּרְאֶ֨ינָה֙ עֵינֵי/כֶ֔ם אֵ֥ת אֲשֶׁר עָשִׂ֖יתִי בְּ/מִצְרָ֑יִם וַ/תֵּשְׁב֥וּ בַ/מִּדְבָּ֖ר יָמִ֥ים רַבִּֽים־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/007.yaml
  text: Then they cried out to Yahweh[a], and he put darkness between you and the Egyptians, and brought the sea upon him and covered him, and your eyes saw what I did in Egypt. Then you lived in the wilderness many days.
translation:
  language: de
  text: Da schrien sie zu Jahwe. Er legte Finsternis zwischen euch und den Ägyptern, ließ das Meer über ihn kommen und bedeckte ihn.[a] Ihr habt mit eigenen Augen gesehen, was ich in Ägypten tat. Dann lebtet ihr viele Tage in der Wüste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen stehen hier Singularpronomen: „über ihn“ und „bedeckte ihn“. Gemeint sein können kollektiv Ägypten oder das ägyptische Heer; viele Übersetzungen geben den Sinn im Plural wieder.'
    reason: Der auffällige grammatische Singular wird im Haupttext bewahrt und seine mögliche kollektive Bedeutung erläutert.
lexical_decisions:
- source_word: וַיִּצְעֲקוּ
  choice: Da schrien sie
  rationale: צעק bezeichnet hier einen dringlichen Hilferuf. „Schrien“ gibt die Notlage und die Ausrichtung des Rufes an Jahwe natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in seiner im Deutschen üblichen Form wiedergegeben und nicht durch einen Titel wie „der HERR“ ersetzt.
- source_word: מַאֲפֵל
  choice: Finsternis
  rationale: Das Substantiv bezeichnet Dunkelheit beziehungsweise tiefes Dunkel. „Finsternis“ ist im Deutschen klar, würdig und dem erzählerischen Zusammenhang angemessen.
- source_word: בֵּינֵיכֶם וּבֵין הַמִּצְרִים
  choice: zwischen euch und die Ägypter
  rationale: Die zweite Person Plural bleibt erhalten; Josua spricht Israel gemeinschaftlich als mit seinen Vorfahren verbunden an.
- source_word: וַיָּבֵא עָלָיו אֶת הַיָּם
  choice: ließ das Meer über ihn kommen
  rationale: Die deutsche Kausativkonstruktion gibt das Herbeiführen des Meeres natürlich wieder. Das maskuline Singularsuffix wird bewusst als „ihn“ erhalten.
- source_word: וַיְכַסֵּהוּ
  choice: bedeckte ihn
  rationale: כסה bedeutet „bedecken“. Auch hier bleibt das maskuline Singularsuffix sichtbar, ohne es deutend in einen Plural umzuwandeln.
- source_word: וַתִּרְאֶינָה עֵינֵיכֶם
  choice: Ihr habt mit eigenen Augen gesehen
  rationale: Diese natürliche deutsche Wendung bewahrt den im Hebräischen ausdrücklich betonten Augenzeugenaspekt.
- source_word: אֵת אֲשֶׁר עָשִׂיתִי בְּמִצְרָיִם
  choice: was ich in Ägypten tat
  rationale: „In Ägypten“ entspricht der naheliegenden Wiedergabe der Präposition ב und lässt offen, gegen wen oder worauf sich die Taten im Einzelnen richteten.
- source_word: וַתֵּשְׁבוּ
  choice: Dann lebtet ihr
  rationale: ישב kann „wohnen“, „bleiben“ oder „leben“ bedeuten. „Lebtet“ ist für einen längeren Aufenthalt in der Wüste natürliches modernes Deutsch.
- source_word: יָמִים רַבִּים
  choice: viele Tage
  rationale: Die wörtliche Zeitangabe bleibt erhalten und wird nicht zu „lange Zeit“ oder „viele Jahre“ erweitert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Eigennamen Gottes. „Jahwe“ bewahrt diesen Namen in der im Deutschen geläufigen Form, statt ihn durch einen Titel zu ersetzen.
- issue: Singularische Pronomen für Ägypten beziehungsweise die ägyptische Streitmacht
  choice: „über ihn“ und „bedeckte ihn“ im Haupttext beibehalten
  alternative: „über sie“ und „bedeckte sie“; ausdrückliche Nennung der Ägypter oder ihres Heeres
  rationale: Die Suffixe in עָלָיו und וַיְכַסֵּהוּ sind grammatisch maskulin Singular. Der ungewöhnliche Singular kann kollektiv auf Ägypten oder seine Streitmacht bezogen sein. Die Übersetzung erhält die Form und erklärt die mögliche kollektive Bedeutung in einer Fußnote, statt die Spannung stillschweigend aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt klar und erzählerisch. „Mit eigenen Augen“ überträgt die hebräische Betonung idiomatisch; „viele Tage“ und die ungewöhnlichen Singularpronomen bewahren die Quellennähe.
