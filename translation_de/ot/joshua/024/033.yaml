base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/033.yaml
  text: And Eleazar the son of Aaron died, and they buried him at Gibeath-phinehas, his son’s hill country, which had been given to him in the hill country of Ephraim.
translation:
  language: de
  text: Auch Eleasar, der Sohn Aarons, starb, und man begrub ihn in Gibea-Pinchas, dem Hügel seines Sohnes Pinchas, der ihm im Bergland Ephraim gegeben worden war.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „in Gibeat Pinchas, seinem Sohn, das/der ihm im Bergland Ephraim gegeben worden war“. Die Wendung kann einen Ortsnamen („Gibea-Pinchas“) oder „den Hügel des Pinchas, seines Sohnes“ bezeichnen. Auch der Bezug von „ihm“ bleibt offen: Gemeint kann Pinchas oder Eleasar sein.'
    reason: Bewahrt die Mehrdeutigkeit der Orts-/Hügelbezeichnung und des Pronomens לוֹ, die im Deutschen nicht ohne Weiteres zugleich im Haupttext ausdrückbar ist.
lexical_decisions:
- source_word: בְּגִבְעַת פִּינְחָס בְּנוֹ
  choice: in Gibea-Pinchas, das seinem Sohn Pinchas … gegeben worden war
  rationale: גִּבְעַת פִּינְחָס wird als Ortsname wiedergegeben. Das nachgestellte בְּנוֹ („sein Sohn“) wird natürlich als Apposition zu Pinchas verstanden; der Name wird zur Klarheit wiederholt.
- source_word: אֲשֶׁר נִתַּן לוֹ
  choice: das … gegeben worden war
  rationale: Das Passiv und der maskuline Singular von נִתַּן werden gewahrt. Das Pronomen לוֹ kann grammatisch auf Pinchas oder Eleasar bezogen werden; der Haupttext folgt der nächstliegenden Beziehung auf Pinchas, während die Mehrdeutigkeit in der Fußnote vermerkt wird.
- source_word: בְּהַר אֶפְרָיִם
  choice: im Bergland Ephraim
  rationale: הַר bezeichnet hier die gebirgige Region bzw. das Bergland des Stammesgebiets Ephraim, nicht lediglich einen einzelnen Berg.
theological_decisions:
- issue: Bezugswort von לוֹ („ihm“)
  choice: Bezug auf Pinchas
  alternative: Bezug auf Eleasar
  rationale: Die unmittelbare Nähe von „Pinchas, seinem Sohn“ legt Pinchas als Bezug nahe. Da das Hebräische den Bezug nicht eindeutig festlegt, wird die Alternative in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Auch“ gibt das einleitende וְ im Zusammenhang mit den vorausgehenden Todesnotizen natürlich wieder. Kurze Hauptsätze erhalten den erzählenden Abschlusscharakter des Verses.
