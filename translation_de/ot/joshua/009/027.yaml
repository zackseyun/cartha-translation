  naturalness: „So machte Josua sie …“ und die Tätigkeitsbezeichnungen sind modernes, verständliches Standarddeutsch. Die Stellung „bis heute an dem Ort“ ist ohne Komma bzw. klarere Gliederung schwer lesbar.
  terminology: „Jahwe“, „Gemeinde“, „Altar“, „Holzfäller“ und „Wasserschöpfer“ sind angemessen. Eine Fußnote ist nicht erforderlich; „Wasserschöpfer“ gibt die konkrete Bedeutung von שׁאב treffend wieder.
