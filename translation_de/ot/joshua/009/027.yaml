base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/027.yaml
  text: So Joshua made them woodcutters and water carriers on that day for the congregation and for the altar of Yahweh[a], to this day, in the place that he would choose.
translation:
  language: de
  text: So machte Josua sie an jenem Tag zu Holzfällern und Wasserschöpfern für die Gemeinde und für den Altar Jahwes, bis zum heutigen Tag, an dem Ort, den Jahwe erwählen würde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְּנֵם
  choice: machte sie zu
  rationale: נתן bedeutet wörtlich „geben/setzen“, bezeichnet hier mit den folgenden Tätigkeitsbezeichnungen aber die Zuweisung einer dauerhaften Dienstaufgabe. „Machte sie zu“ gibt diese Konstruktion knapp und natürlich wieder.
- source_word: חֹטְבֵי עֵצִים
  choice: Holzfällern
  rationale: Die partizipiale Wendung bezeichnet Menschen, die Holz schlagen. „Holzfäller“ ist eine klare und gegenwärtige deutsche Berufs- bzw. Tätigkeitsbezeichnung.
- source_word: וְשֹׁאֲבֵי מַיִם
  choice: Wasserschöpfern
  rationale: שאב bezeichnet ausdrücklich das Schöpfen von Wasser. „Wasserschöpfer“ bewahrt diesen konkreten Vorgang genauer als das allgemeinere „Wasserträger“.
- source_word: לָעֵדָה
  choice: für die Gemeinde
  rationale: עֵדָה bezeichnet hier die versammelte Gemeinschaft Israels. „Gemeinde“ bewahrt den gemeinschaftlichen und kultischen Bezug, ohne altertümlich zu wirken.
- source_word: וּלְמִזְבַּח יְהוָה
  choice: und für den Altar Jahwes
  rationale: Die Formulierung bezeichnet Dienst für den Opferaltar und gibt die Genitivbeziehung zum Gottesnamen unmittelbar wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen geschriebene Eigenname Gottes wird in der im Deutschen üblichen Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: bis heute
  rationale: Die hebräische Zeitformel bezeichnet das Fortbestehen des Zustands bis zur Gegenwart des Erzählers. „Bis heute“ ist die natürliche moderne Entsprechung.
- source_word: אֶל הַמָּקוֹם אֲשֶׁר יִבְחָר
  choice: an dem Ort, den er erwählen würde
  rationale: Im Zusammenhang bezeichnet die Wendung den Ort des künftigen Heiligtums. „An dem Ort“ gibt den örtlichen Bezug idiomatisch wieder; „erwählen würde“ wahrt die vom Erzählzeitpunkt aus vorausblickende Perspektive des Yiqtol.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. Seine Wiedergabe als „Jahwe“ bewahrt den Eigenname-Charakter, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug des Subjekts in אֲשֶׁר יִבְחָר
  choice: Das Pronomen „er“ bleibt stehen und bezieht sich im Kontext auf Jahwe.
  alternative: „der erwählt werden würde“ als unpersönliche Passivform
  rationale: Die in Deuteronomium und Josua wiederkehrende Wendung spricht von dem Ort, den Jahwe erwählt. Die aktive Form bewahrt zugleich den Wortlaut und die Aussage, dass Gott den Ort bestimmt, ohne den Pronomenbezug im Text ausdrücklich zu ergänzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkreten Tätigkeitsbezeichnungen und der aktive Satzbau bleiben erhalten. Der Gedankenstrich gliedert die Fortdauerformel, ohne sie vom Dienst für Gemeinde und Altar zu lösen.
