    rationale: „– bis heute an dem Ort“ bündelt zwei nachgestellte Angaben ohne ausreichende syntaktische Gliederung. „bis zum heutigen Tag, an dem Ort“ ist klarer und wahrt die Reihenfolge des Hebräischen.
