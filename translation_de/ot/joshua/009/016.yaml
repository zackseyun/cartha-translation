  source_fidelity: 'Die Grundstruktur und die Bezüge sind zutreffend: Der Bund ist bereits geschlossen, und die Israeliten erfahren anschließend, dass die betreffende Gruppe in ihrer Nähe bzw. in ihrer Mitte wohnt. „Ganz“ hat jedoch keine Entsprechung im hebräischen Text und verstärkt die räumliche Aussage unnötig.'
  naturalness: Der Entwurf ist gut verständlich und modern. „Nach Ablauf von drei Tagen“ bildet מִקְצֵה שְׁלֹשֶׁת יָמִים genauer ab als „Nach drei Tagen“. Die Stellung „jenen ihnen nahe waren“ ist idiomatisch und wahrt die Unterscheidung der beiden Gruppen.
  terminology: „Einen Bund ... schließen“ ist eine angemessene, etablierte Wiedergabe von כרת ברית. Die Wiedergabe von בְּקִרְבּוֹ mit „mitten unter ihnen“ ist sachgerecht; die kollektive Auffassung der singularischen hebräischen Suffixe wird im Deutschen natürlich pluralisch ausgedrückt.
