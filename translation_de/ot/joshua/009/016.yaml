  text: וַ/יְהִ֗י מִ/קְצֵה֙ שְׁלֹ֣שֶׁת יָמִ֔ים אַחֲרֵ֕י אֲשֶׁר כָּרְת֥וּ לָ/הֶ֖ם בְּרִ֑ית וַֽ/יִּשְׁמְע֗וּ כִּי קְרֹבִ֥ים הֵם֙ אֵלָ֔י/ו וּ/בְ/קִרְבּ֖/וֹ הֵ֥ם יֹשְׁבִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/016.yaml
  text: And it happened at the end of three days, after they had made a covenant with them, that they heard that they were near to them and were living among them.
translation:
  language: de
  text: Nach Ablauf von drei Tagen, nachdem sie einen Bund mit ihnen geschlossen hatten, hörten sie, dass jene ihnen nahe waren und mitten unter ihnen wohnten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי מִקְצֵה שְׁלֹשֶׁת יָמִים
  choice: Nach drei Tagen
  rationale: Gibt die hebräische Zeitangabe idiomatisch und präzise wieder; die formelhafte Einleitung וַיְהִי muss im modernen Deutschen nicht eigens mit „und es geschah“ abgebildet werden.
- source_word: כָּרְתוּ לָהֶם בְּרִית
  choice: sie einen Bund mit ihnen geschlossen hatten
  rationale: „Einen Bund schließen“ ist die natürliche deutsche Entsprechung des hebräischen Idioms „einen Bund schneiden“; das Plusquamperfekt verdeutlicht die Vorzeitigkeit.
- source_word: קְרֹבִים הֵם אֵלָיו
  choice: jene ganz in ihrer Nähe waren
  rationale: Das singularische Suffix in אֵלָיו bezieht sich kollektiv auf Israel. „In ihrer Nähe“ gibt die räumliche Aussage natürlich wieder; „jene“ unterscheidet die Gibeoniter klar von den Israeliten.
- source_word: וּבְקִרְבּוֹ הֵם יֹשְׁבִים
  choice: und mitten unter ihnen wohnten
  rationale: בְּקִרְבּוֹ bezeichnet das Wohnen innerhalb des israelitischen Bereichs beziehungsweise in ihrer Mitte, nicht lediglich allgemeine Nachbarschaft.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden pronominalen Gruppen werden durch „sie“ und „jene“ auseinandergehalten, ohne im Text erklärende Eigennamen einzufügen.
