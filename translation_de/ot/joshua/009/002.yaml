lexical_decisions:
- source_word: וַיִּתְקַבְּצוּ יַחְדָּו
  choice: Da schlossen sie sich zusammen
  rationale: Die Verbindung aus dem Nifal von קבץ und יַחְדָּו bezeichnet gemeinsames Zusammenkommen. „Sich zusammenschließen“ gibt die vereinte Handlung in natürlichem Deutsch wieder; „da“ führt die Erzählung fort.
- source_word: לְהִלָּחֵם
  choice: um … zu kämpfen
  rationale: Der Nifal-Infinitiv von לחם bezeichnet den Kampf gegen einen Gegner. Die deutsche Finalkonstruktion gibt die Funktion von לְ präzise und flüssig wieder.
- source_word: עִם יְהוֹשֻׁעַ וְעִם יִשְׂרָאֵל
  choice: gegen Josua und gegen Israel
  rationale: עִם hat nach einem Verb des Kämpfens adversative Bedeutung. Die Wiederholung von „gegen“ bewahrt die betonte hebräische Parallelstruktur.
- source_word: פֶּה אֶחָד
  choice: wie aus einem Mund
  rationale: Wörtlich steht „ein Mund“. Die geläufige deutsche Wendung bewahrt das Bild und vermittelt zugleich einmütiges, abgestimmtes Handeln.
