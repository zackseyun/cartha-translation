  text: וַ/יַּ֥עַשׂ לָ/הֶ֖ם כֵּ֑ן וַ/יַּצֵּ֥ל אוֹתָ֛/ם מִ/יַּ֥ד בְּנֵֽי יִשְׂרָאֵ֖ל וְ/לֹ֥א הֲרָגֽוּ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/026.yaml
  text: So he did this for them[a], and he delivered them from the hand of the sons of Israel, and they did not kill them.
translation:
  language: de
  text: So verfuhr er mit ihnen, und er rettete sie aus der Hand der Söhne Israels[a], und sie töteten sie nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Israeliten“. Wörtlich steht im Hebräischen: „der Söhne Israels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ לָהֶם כֵּן
  choice: So verfuhr er mit ihnen
  rationale: Die Wendung mit עשה und כן bedeutet, entsprechend dem zuvor Beschriebenen zu handeln. „So verfuhr er mit ihnen“ gibt den rückverweisenden Sinn idiomatisch und würdig wieder.
- source_word: וַיַּצֵּל
  choice: Er rettete
  rationale: Das Hifil von נצל bezeichnet das Retten oder Befreien aus einer Bedrohung. „rettete“ ist im modernen Deutschen klar und passt zur folgenden Wendung „aus der Hand“.
- source_word: אוֹתָם
  choice: sie
  rationale: Das Akkusativpronomen bezieht sich auf die Gibeoniter.
- source_word: מִיַּד
  choice: aus der Hand
  rationale: Die konkrete hebräische Metapher für Macht oder Gewalt bleibt erhalten und ist im Deutschen verständlich.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die ausdrückliche maskuline Konstruktion des Hebräischen bleibt erhalten; zugleich wird in einer Fußnote die geläufige Wiedergabe „Israeliten“ genannt.
- source_word: וְלֹא הֲרָגוּם
  choice: und sie töteten sie nicht
  rationale: Das erste „sie“ bezeichnet die Söhne Israels, das zweite die Gibeoniter. Die schlichte Wiedergabe bewahrt die hebräische Satzverknüpfung und den unmittelbaren Sinn von הרג.
theological_decisions:
- issue: Geschlechtsspezifische kollektive Bezeichnung בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Israeliten
  rationale: Die Form des Ausgangstextes wird bewahrt, ohne auszuschließen, dass die Wendung als nationale Sammelbezeichnung gebraucht ist. Die idiomatischere Alternative wird deshalb in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt macht deutlich, dass der folgende Satz erläutert, worin Josuas Vorgehen bestand; die anschließende Und-Verknüpfung bewahrt die hebräische Klauselfolge. Die zweimalige Form „sie“ folgt dem Ausgangstext trotz des möglichen kurzen Bezugswechsels.
