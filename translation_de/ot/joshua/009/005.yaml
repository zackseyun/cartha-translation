  text: וּ/נְעָל֨וֹת בָּל֤וֹת וּ/מְטֻלָּאוֹת֙ בְּ/רַגְלֵי/הֶ֔ם וּ/שְׂלָמ֥וֹת בָּל֖וֹת עֲלֵי/הֶ֑ם וְ/כֹל֙ לֶ֣חֶם צֵידָ֔/ם יָבֵ֖שׁ הָיָ֥ה נִקֻּדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/005.yaml
  text: They had worn-out and patched sandals on their feet[a], and worn-out clothes on themselves; and all the bread of their provision was dry and crumbly.
translation:
  language: de
  text: Sie hatten abgetragene, geflickte Sandalen an den Füßen und abgetragene Kleider am Leib. Alles Brot aus ihrem Reisevorrat war trocken und bröckelig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verschimmelt“. Das hier mit „bröckelig“ wiedergegebene hebräische Wort ist selten. Es kann Brot bezeichnen, das trocken geworden und in Stücke zerfallen ist; manche verstehen es jedoch als „verschimmelt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְעָלוֹת
  choice: Sandalen
  rationale: Bezeichnet hier die im Alten Orient übliche Fußbekleidung; „Sandalen“ ist konkreter als das allgemeinere „Schuhe“.
- source_word: בָּלוֹת
  choice: abgetragen
  rationale: Das Wort beschreibt etwas, das durch Alter und Gebrauch verschlissen ist. „Abgetragen“ passt sowohl zu den Sandalen als auch zu den Kleidern.
- source_word: מְטֻלָּאוֹת
  choice: geflickt
  rationale: Das passive Partizip bezeichnet durch Aufsetzen von Flicken ausgebesserte Gegenstände; „geflickt“ ist im Deutschen knapp und anschaulich.
- source_word: בְּרַגְלֵיהֶם
  choice: an den Füßen
  rationale: Gibt die konkrete Ortsangabe natürlich und vollständig wieder.
- source_word: שְׂלָמוֹת
  choice: Kleider
  rationale: Das allgemeine Wort für Kleidung wird mit dem heutigen, zugleich würdigen „Kleider“ wiedergegeben, ohne eine bestimmte Art von Obergewand vorauszusetzen.
- source_word: עֲלֵיהֶם
  choice: am Leib
  rationale: Bewahrt das Bild der von ihnen getragenen Kleidung und klingt im Deutschen natürlicher als eine wörtliche Wiedergabe mit „auf ihnen“.
- source_word: לֶחֶם צֵידָם
  choice: Brot aus ihrem Reisevorrat
  rationale: Bewahrt das konkrete „Brot“ und macht zugleich deutlich, dass es zu ihrem mitgeführten Proviant gehörte.
- source_word: יָבֵשׁ הָיָה
  choice: war trocken
  rationale: Die Zustandsaussage wird schlicht und direkt wiedergegeben.
- source_word: נִקֻּדִים
  choice: bröckelig
  rationale: Das seltene Wort bezeichnet in diesem Zusammenhang wahrscheinlich trockenes, in Stücke oder Krümel zerfallendes Brot. „Bröckelig“ bewahrt diese naheliegende Bedeutung, ohne die unsichere Alternative zu verschweigen.
