base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/010.yaml
  text: and all that he did to the two kings of the Amorites who were beyond the Jordan—to Sihon king of Heshbon and to Og king of Bashan[b][a], who was at Ashtaroth—
translation:
  language: de
  text: 'und alles, was er den beiden Königen der Amoriter, die jenseits des Jordan[a] waren, getan hatte: Sihon, dem König von Heschbon, und Og, dem König von Baschan, der in Aschtarot[b] war.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: auf der anderen Seite des Jordan.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: bei Aschtarot.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: und
  rationale: Die Konjunktion führt die Aufzählung aus dem vorhergehenden Vers fort; der hebräische Akkusativmarker wird im Deutschen nicht eigens wiedergegeben.
- source_word: כָּל אֲשֶׁר
  choice: alles, was
  rationale: Die idiomatische deutsche Verbindung gibt die Gesamtheit der berichteten Taten wieder.
- source_word: עָשָׂה
  choice: getan hatte
  rationale: עשה bezeichnet hier allgemein ein Handeln. Das Plusquamperfekt fügt sich natürlich in den rückblickenden Bericht ein, ohne die Art des Handelns näher festzulegen.
- source_word: לִשְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: den beiden Königen der Amoriter
  rationale: Der Dativ gibt die Verbindung von עשה mit ל angemessen wieder und vermeidet das stärker deutende „gegen“.
- source_word: אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן
  choice: jenseits des Jordan
  rationale: Die Wendung bezeichnet die gegenüberliegende Seite des Jordan aus der jeweiligen Sprecherperspektive; „jenseits“ ist knapp und im Deutschen geläufig.
- source_word: לְסִיחוֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: Sihon, dem König von Heschbon
  rationale: Der Name und der appositionelle Königstitel werden direkt wiedergegeben; der Dativ setzt die vorangehende Konstruktion fort.
- source_word: וּלְעוֹג מֶלֶךְ הַבָּשָׁן
  choice: und Og, dem König von Baschan
  rationale: Die Formulierung wahrt den Parallelismus zur Bezeichnung Sihons und transliteriert den Ortsnamen.
- source_word: אֲשֶׁר בְּעַשְׁתָּרוֹת
  choice: der in Aschtarot war
  rationale: Der Relativsatz wird am natürlichsten auf Og bezogen. „In“ gibt die lokale Bedeutung von ב wieder, ohne zusätzlich eine Residenz oder Herrschaftsausübung anzunehmen.
theological_decisions:
- issue: Unausgesprochenes Subjekt von עָשָׂה
  choice: Das Subjekt bleibt als „er“ unausgeführt.
  alternative: „was der HERR … getan hatte“
  rationale: Das hebräische Verb steht in der dritten Person Singular, nennt das Subjekt in diesem Vers aber nicht ausdrücklich. Der Kontext identifiziert es; die Übersetzung vermeidet daher eine ausdrückliche Ergänzung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt macht die Apposition der beiden Könige transparent. Die Orts- und Personennamen folgen geläufigen deutschen Transliterationen.
