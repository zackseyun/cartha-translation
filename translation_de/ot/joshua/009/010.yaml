  naturalness: Der Satz ist grundsätzlich verständlich und im würdigen modernen Standarddeutsch gehalten. Mit einem expliziten Relativsatz wird die Satzgliederung klarer und natürlicher. Die Formulierung „in Aschtarot“ ist als Ortsangabe idiomatisch.
  terminology: „Amoriter“, „Jordan“, „Sihon“, „Heschbon“, „Og“, „Baschan“ und „Aschtarot“ sind angemessene deutsche Bibeltransliterationen. Das implizite Subjekt „er“ bleibt zu Recht erhalten. Die Fußnote zu Aschtarot soll die gewählte Hauptbedeutung und die mögliche Alternative korrekt widerspiegeln.
