  text: וַ/יֹּאמְר֣וּ אֵלָ֗י/ו מֵ/אֶ֨רֶץ רְחוֹקָ֤ה מְאֹד֙ בָּ֣אוּ עֲבָדֶ֔י/ךָ לְ/שֵׁ֖ם יְהוָ֣ה אֱלֹהֶ֑י/ךָ כִּֽי שָׁמַ֣עְנוּ שָׁמְע֔/וֹ וְ/אֵ֛ת כָּל אֲשֶׁ֥ר עָשָׂ֖ה בְּ/מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/009.yaml
  text: And they said to him[a], “Your servants have come from a very distant land for the name of Yahweh your God, for we have heard of his fame and all that he did in Egypt.”
translation:
  language: de
  text: 'Und sie sagten zu ihm: »Deine Diener sind aus einem sehr fernen Land gekommen, um des Namens Jahwes, deines Gottes, willen; denn wir haben gehört, was man von ihm berichtet,[a] und alles, was er in Ägypten getan hat.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wir haben von seinem Ruf gehört« beziehungsweise »wir haben den Bericht über ihn gehört«. Im Hebräischen steht eine Wortverbindung aus zwei verwandten Wörtern für »hören« und »Gehörtes/Bericht«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: Und sie sagten zu ihm
  rationale: Gibt den hebräischen Erzählanschluss durch das Wayyiqtol schlicht wieder, ohne eine stärkere logische Beziehung einzutragen.
- source_word: מֵאֶרֶץ רְחוֹקָה מְאֹד
  choice: aus einem sehr fernen Land
  rationale: Bewahrt sowohl das Adjektiv רְחוֹקָה als auch die Verstärkung מְאֹד in natürlichem modernem Deutsch.
- source_word: עֲבָדֶיךָ
  choice: deine Diener
  rationale: Hier handelt es sich um eine ehrerbietige Selbstbezeichnung in diplomatischer Rede; „Sklaven“ wäre in diesem Zusammenhang zu eng und zu stark.
- source_word: לְשֵׁם יְהוָה אֱלֹהֶיךָ
  choice: um des Namens Jahwes, deines Gottes, willen
  rationale: Die Wendung wahrt den ausdrücklichen Bezug auf den Namen und gibt לְ als Beweggrund bzw. Zweck wieder, ohne ihn auf bloßen Ruhm zu reduzieren.
- source_word: שָׁמַעְנוּ שָׁמְעוֹ
  choice: wir haben gehört, was man von ihm berichtet
  rationale: Die hebräische figura etymologica bezeichnet das Gehörte, den Bericht oder Ruf über ihn. Die deutsche Formulierung ist verständlich und lässt die Bedeutungsbreite erkennen.
- source_word: וְאֵת כָּל אֲשֶׁר עָשָׂה בְּמִצְרָיִם
  choice: und alles, was er in Ägypten getan hat
  rationale: Direkte und idiomatische Wiedergabe des umfassenden Relativsatzes.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, sodass der im Ausgangstext ausdrücklich verwendete Gottesname sichtbar bleibt.
- issue: Bedeutung von לְשֵׁם
  choice: um des Namens ... willen
  alternative: wegen des Namens; aufgrund des Rufes
  rationale: Die gewählte Fassung erhält die theologisch offene Rede vom „Namen“ und deutet sie nicht ausschließlich als Bekanntheit oder Ruf.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die diplomatische Höflichkeitsform „deine Diener“ und die feierliche, aber verständliche Wendung „um des Namens ... willen“ entsprechen der Redesituation. Der Fußnotenmarker [a] steht unmittelbar bei der mehrdeutigen Wendung.
