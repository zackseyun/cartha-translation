  text: וַ/יֵּלְכ֧וּ אֶל יְהוֹשֻׁ֛עַ אֶל הַֽ/מַּחֲנֶ֖ה הַ/גִּלְגָּ֑ל וַ/יֹּאמְר֨וּ אֵלָ֜י/ו וְ/אֶל אִ֣ישׁ יִשְׂרָאֵ֗ל מֵ/אֶ֤רֶץ רְחוֹקָה֙ בָּ֔אנוּ וְ/עַתָּ֖ה כִּרְתוּ לָ֥/נוּ בְרִֽית־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/006.yaml
  text: They went to Joshua at the camp at Gilgal and said to him and to the men of Israel[a], “We have come from a distant land; so now make a covenant with us.”
translation:
  language: de
  text: 'Sie gingen zu Josua ins Lager bei Gilgal und sagten zu ihm und zu den Männern Israels: »Wir sind aus einem fernen Land gekommen. Schließt nun einen Bund mit uns!«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Schließt nun einen Vertrag mit uns!« Die hebräische Wendung lautet wörtlich: »Schneidet einen Bund mit uns!«'
    reason: Lexikalische Alternative und Erläuterung des hebräischen Idioms.
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: Sie gingen
  rationale: Das gewöhnliche Bewegungsverb הלך wird in der fortlaufenden Erzählung sachgerecht mit „gingen“ wiedergegeben.
- source_word: אֶל יְהוֹשֻׁעַ אֶל הַמַּחֲנֶה הַגִּלְגָּל
  choice: zu Josua ins Lager bei Gilgal
  rationale: Die beiden mit אֶל eingeleiteten Zielangaben bleiben erhalten; „ins Lager bei Gilgal“ ist im Deutschen natürlich und kennzeichnet Gilgal als Ort des Lagers.
- source_word: אֵלָיו וְאֶל אִישׁ יִשְׂרָאֵל
  choice: zu ihm und zu den Männern Israels
  rationale: Der kollektive Singular אִישׁ יִשְׂרָאֵל bezeichnet hier die israelitischen Männer beziehungsweise Vertreter; die maskuline und kollektive Form wird bewahrt.
- source_word: מֵאֶרֶץ רְחוֹקָה
  choice: aus einem fernen Land
  rationale: Die Wendung gibt sowohl אֶרֶץ als „Land“ als auch רְחוֹקָה als geografische Ferne klar und idiomatisch wieder.
- source_word: בָּאנוּ
  choice: Wir kommen
  rationale: Das hebräische Perfekt beschreibt eine vollzogene Ankunft mit gegenwärtigem Ergebnis. Im Deutschen ist das Präsens bei der Angabe der Herkunft natürlich; „wir sind gekommen“ wäre ebenfalls möglich.
- source_word: וְעַתָּה
  choice: nun
  rationale: „Nun“ markiert knapp und natürlich den Übergang von der Herkunftsbehauptung zur daraus abgeleiteten Aufforderung.
- source_word: כִּרְתוּ לָנוּ בְרִית
  choice: Schließt nun einen Bund mit uns
  rationale: Die feste hebräische Verbindung כרת ברית lautet wörtlich „einen Bund schneiden“, wird im modernen Deutschen jedoch idiomatisch mit „einen Bund schließen“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe von בְרִית im diplomatisch-politischen Zusammenhang
  choice: Bund
  alternative: Vertrag
  rationale: בְרִית ist der gewöhnliche biblische Begriff für eine bindende Bundesbeziehung. „Bund“ erhält diese terminologische Verbindung, während „Vertrag“ den politischen Sinn stärker hervorhebt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist klar und knapp formuliert; „Bund schließen“ bewahrt den biblischen Schlüsselbegriff, ohne das im Deutschen unverständliche hebräische Bild wörtlich zu übernehmen.
