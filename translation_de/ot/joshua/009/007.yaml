reference: Joshua 9:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: ו/יאמרו אִֽישׁ יִשְׂרָאֵ֖ל אֶל הַ/חִוִּ֑י אוּלַ֗י בְּ/קִרְבִּ/י֙ אַתָּ֣ה יוֹשֵׁ֔ב וְ/אֵ֖יךְ אכרות לְ/ךָ֥ בְרִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/007.yaml
  text: But the men of Israel said to the Hivite[a], “Perhaps you are living among us[b]; how then could I make a covenant with you?”
translation:
  language: de
  text: 'Doch die Männer Israels sagten zu dem Hiwiter: »Vielleicht wohnst du mitten unter uns[a]. Wie kann ich dann einen Bund mit dir schließen[b]?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich: „in meiner Mitte“; der Singular bezeichnet wahrscheinlich Israel als Gemeinschaft, vertreten durch den Sprecher.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch wörtlich: „einen Bund mit dir schneiden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ יִשְׂרָאֵל
  choice: die Männer Israels
  rationale: Das formal singularische אִישׁ wird hier kollektiv für die israelitischen Vertreter gebraucht. Die Wiedergabe bewahrt den kollektiven und männlichen Ausdruck, ohne im Deutschen einen einzelnen Mann nahezulegen.
- source_word: הַחִוִּי
  choice: dem Hiwiter
  rationale: Der Singular des hebräischen Textes bleibt erhalten; angesprochen wird offenbar ein Vertreter der Gruppe.
- source_word: אוּלַי
  choice: Vielleicht
  rationale: Das Wort drückt einen vorsichtigen Verdacht aus; „Vielleicht“ ist dafür im modernen Standarddeutsch natürlich und angemessen.
- source_word: בְּקִרְבִּי
  choice: mitten unter uns
  rationale: Wörtlich steht „in meiner Mitte“. Da der Sprecher Israel vertritt, gibt „unter uns“ den kollektiven Sinn natürlich wieder; „mitten“ bewahrt die räumliche Nähe des Ausdrucks.
- source_word: יוֹשֵׁב
  choice: wohnst
  rationale: Das Partizip von ישׁב bezeichnet hier dauerhaftes Wohnen oder Ansässigsein, nicht bloßes Sitzen.
- source_word: וְאֵיךְ
  choice: Wie kann ich dann
  rationale: Die Verbindung leitet die praktische Folge des Verdachts ein. „Dann“ macht den Folgerungszusammenhang deutlich, während „kann“ die hebräische Frage unmittelbar wiedergibt.
- source_word: אכרות ... בְרִית
  choice: einen Bund ... schließen
  rationale: Das Hebräische sagt idiomatisch „einen Bund schneiden“. Im Deutschen ist „einen Bund schließen“ die entsprechende natürliche und sachlich genaue Wendung.
- source_word: לְךָ
  choice: mit dir
  rationale: Beim Schließen eines Bundes bezeichnet die Präposition den Bundespartner und wird im Deutschen idiomatisch mit „mit“ wiedergegeben.
theological_decisions:
- issue: Kollektiver und repräsentativer Singular in Israels Rede
  choice: Im ersten Satz den kollektiven Sinn mit „unter uns“ ausdrücken, im zweiten den repräsentativen Singular „ich“ bewahren
  alternative: 'Die Singularformen durchgehend wörtlich wiedergeben: „in meiner Mitte … kann ich“; oder sie durchgehend pluralisieren: „unter uns … können wir“'
  rationale: Der hebräische Text verbindet kollektive Rede mit singularischen Formen. Die gewählte Fassung wahrt diesen auffälligen Wechsel, ohne „in meiner Mitte“ im Deutschen missverständlich auf einen einzelnen Privatbereich zu beziehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Hiwiter“ folgt der üblichen deutschen Namensform. Die direkte Rede bleibt knapp und bewahrt den Wechsel von kollektivem „uns“ zu repräsentativem „ich“.
