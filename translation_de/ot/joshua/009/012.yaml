  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Aufforderung „seht“ erhält die demonstrative Wirkung der direkten Rede; die seltene Sachbezeichnung am Versende wird im Text bewusst offen und in der Fußnote erläutert.
