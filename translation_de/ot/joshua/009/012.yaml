  text: זֶ֣ה לַחְמֵ֗/נוּ חָ֞ם הִצְטַיַּ֤דְנוּ אֹת/וֹ֙ מִ/בָּ֣תֵּ֔י/נוּ בְּ/י֥וֹם צֵאתֵ֖/נוּ לָ/לֶ֣כֶת אֲלֵי/כֶ֑ם וְ/עַתָּה֙ הִנֵּ֣ה יָבֵ֔שׁ וְ/הָיָ֖ה נִקֻּדִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/012.yaml
  text: This bread of ours was warm when we took it as our provisions from our houses on the day we set out to come to you[a], but now, look, it is dry and has become moldy.
translation:
  language: de
  text: 'Unser Brot hier war warm, als wir es an dem Tag, an dem wir aufbrachen, aus unseren Häusern als Wegzehrung mitnahmen, um zu euch zu kommen. Doch seht: Jetzt ist es trocken und fleckig geworden.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „schimmelig geworden“, „rissig geworden“ oder „bröckelig geworden“. Das hebräische Wort bezeichnet etwas, das Punkte oder Flecken aufweist. Bei altem Brot ist nicht sicher, ob damit Schimmelflecken, Risse oder eine bröckelige Beschaffenheit gemeint sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה לַחְמֵנוּ
  choice: Dieses Brot von uns
  rationale: Die demonstrative Zeigegeste und die possessive Hervorhebung bleiben erhalten; die Formulierung passt zu dem Brot, das die Sprecher als Beweis vorzeigen.
- source_word: חָם
  choice: war noch warm
  rationale: „Warm“ gibt die Grundbedeutung direkt wieder. „Noch“ verdeutlicht idiomatisch den Gegensatz zum inzwischen trockenen Brot, ohne „frisch“ ausdrücklich in den Text einzutragen.
- source_word: הִצְטַיַּדְנוּ אֹתוֹ
  choice: nahmen wir es als Wegzehrung mit
  rationale: Das reflexive Verb bezeichnet hier das Ausstatten mit Reiseproviant. „Als Wegzehrung mitnehmen“ ist im Deutschen natürlich und hält das Brot als Objekt fest.
- source_word: מִבָּתֵּינוּ
  choice: aus unseren Häusern
  rationale: Der Plural und die konkrete Grundbedeutung des hebräischen Ausdrucks werden bewahrt.
- source_word: בְּיוֹם צֵאתֵנוּ
  choice: an dem Tag, an dem wir aufbrachen
  rationale: Die Zeitangabe und der Beginn der Reise werden klar und in natürlichem modernem Deutsch ausgedrückt.
- source_word: לָלֶכֶת אֲלֵיכֶם
  choice: um zu euch zu kommen
  rationale: Das hebräische Verb bedeutet wörtlich „gehen“; aus der Perspektive der Angesprochenen ist „zu euch kommen“ im Deutschen die natürliche Richtungsangabe.
- source_word: וְעַתָּה הִנֵּה
  choice: Doch jetzt, seht
  rationale: „Doch“ markiert den Kontrast, während „seht“ die auffordernde, auf den vorgezeigten Beweis lenkende Funktion von הִנֵּה wiedergibt.
- source_word: יָבֵשׁ
  choice: Es ist trocken
  rationale: Die gegenwärtige Beschaffenheit des Brotes wird schlicht und unmittelbar wiedergegeben.
- source_word: וְהָיָה נִקֻּדִים
  choice: und fleckig geworden
  rationale: נִקֻּדִים bezeichnet grundsätzlich etwas Gepunktetes oder Geflecktes. „Fleckig“ wahrt diese Bildlichkeit und legt nicht vorschnell fest, ob Schimmel, Risse oder eine andere altersbedingte Veränderung gemeint ist.
