  text: וַ/יִּקְרָ֤א לָ/הֶם֙ יְהוֹשֻׁ֔עַ וַ/יְדַבֵּ֥ר אֲלֵי/הֶ֖ם לֵ/אמֹ֑ר לָ/מָּה֩ רִמִּיתֶ֨ם אֹתָ֜/נוּ לֵ/אמֹ֗ר רְחוֹקִ֨ים אֲנַ֤חְנוּ מִ/כֶּם֙ מְאֹ֔ד וְ/אַתֶּ֖ם בְּ/קִרְבֵּ֥/נוּ יֹשְׁבִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/022.yaml
  text: Then Joshua called for them and spoke to them[a], saying, “Why did you deceive us, saying, ‘We are very far from you,’ when you are living among us?”
translation:
  language: de
  text: 'Da ließ Josua sie rufen und sagte zu ihnen: »Warum habt ihr uns getäuscht und behauptet: ›Wir sind sehr weit von euch entfernt‹, obwohl ihr mitten unter uns wohnt?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא לָהֶם
  choice: Da ließ Josua sie rufen
  rationale: קרא mit ל bezeichnet hier, dass Josua die Gibeoniter zu sich bestellen lässt. Die deutsche Wendung gibt die beabsichtigte Vorladung natürlich wieder, ohne den Vorgang auszuschmücken.
- source_word: וַיְדַבֵּר אֲלֵיהֶם לֵאמֹר
  choice: und sagte zu ihnen
  rationale: Die formelhafte hebräische Redeeinleitung wird in natürlichem modernem Deutsch knapp wiedergegeben; der folgende Doppelpunkt übernimmt die Funktion von לֵאמֹר.
- source_word: רִמִּיתֶם אֹתָנוּ
  choice: habt ihr uns getäuscht
  rationale: Die Piel-Form von רמה bezeichnet eine bewusste Täuschung. „Getäuscht“ wahrt das Gewicht des Vorwurfs besser als das umgangssprachlichere „ausgetrickst“.
- source_word: לֵאמֹר
  choice: und behauptet
  rationale: Innerhalb der Frage führt לֵאמֹר den täuschenden Wortlaut an. „Behauptet“ macht im Deutschen deutlich, dass es sich um die unwahre Angabe handelt, ohne zusätzliche Inhalte einzutragen.
- source_word: רְחוֹקִים אֲנַחְנוּ מִכֶּם מְאֹד
  choice: Wir sind sehr weit von euch entfernt
  rationale: Die Stellung von מְאֹד verstärkt die räumliche Entfernung. Die gewählte Formulierung ist genau und idiomatisch.
- source_word: בְּקִרְבֵּנוּ יֹשְׁבִים
  choice: ihr mitten unter uns wohnt
  rationale: בקרבנו bedeutet „in unserer Mitte/mitten unter uns“, und das Partizip von ישב bezeichnet hier ihren gegenwärtigen Wohnsitz. „Wohnt“ gibt die dauerhafte Ansässigkeit treffend wieder.
theological_decisions:
- issue: Umfang von Josuas Anklage
  choice: Der Vers wird als unmittelbarer Vorwurf der Täuschung über die geografische Entfernung übersetzt.
  alternative: Die Formulierung um ausdrückliche Aussagen über Bundesbruch oder die Gültigkeit des geschlossenen Vertrags erweitern.
  rationale: Der hebräische Vers nennt ausdrücklich die falsche Entfernungsangabe und den tatsächlichen Wohnort. Weitergehende bundesbezogene Folgerungen ergeben sich aus dem Kontext, gehören aber nicht in den Wortlaut dieses Verses.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Da ließ Josua sie rufen“ bewahrt den erzählerischen Anschluss und den Sinn einer Vorladung. Die verschachtelte direkte Rede bleibt erhalten. Für בְּקִרְבֵּנוּ ist keine Fußnote nötig, da „mitten unter uns“ sowohl präzise als auch natürlich ist.
