base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/021.yaml
  text: The leaders said to them[a], “Let them live.” So they became woodcutters and water-drawers for all the congregation, just as the leaders had spoken to them.
translation:
  language: de
  text: 'Die führenden Männer sagten zu ihnen: »Sie sollen am Leben bleiben.« So wurden sie Holzfäller und Wasserschöpfer[a] für die ganze Gemeinde, wie die führenden Männer es ihnen gesagt hatten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Holzhauer und Wasserschöpfer«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּשִׂיאִים
  choice: die führenden Männer
  rationale: Der Ausdruck bezeichnet hier die anerkannten Oberhäupter Israels. »Die führenden Männer« ist im modernen Deutschen klar und vermeidet die heute missverständliche Wiedergabe »Fürsten«.
- source_word: יִחְיוּ
  choice: Sie sollen am Leben bleiben
  rationale: Der Imperfekt ist hier jussiv und gibt den Beschluss wieder, die Gibeoniter nicht zu töten.
- source_word: וַיִּהְיוּ
  choice: So wurden sie
  rationale: Die Form bezeichnet den Übergang in die ihnen auferlegte dauerhafte Dienststellung.
- source_word: חֹטְבֵי עֵצִים
  choice: Holzfäller
  rationale: Die Partizipialverbindung bezeichnet eine fortdauernde Tätigkeit. »Holzfäller« ist die natürliche moderne Berufs- bzw. Tätigkeitsbezeichnung.
- source_word: שֹׁאֲבֵי מַיִם
  choice: Wasserschöpfer
  rationale: Die Wiedergabe bewahrt das konkrete Schöpfen von Wasser und die parallele Formulierung zu »Holzfäller«.
- source_word: לְכָל הָעֵדָה
  choice: für die ganze Gemeinde
  rationale: עֵדָה bezeichnet die versammelte Gemeinschaft Israels; »Gemeinde« bewahrt diesen gemeinschaftlichen Sinn und ist allgemein verständlich.
- source_word: כַּאֲשֶׁר דִּבְּרוּ לָהֶם
  choice: wie die führenden Männer es ihnen gesagt hatten
  rationale: Die Formulierung verweist auf die zuvor ausgesprochene Anordnung, ohne über das hebräische »reden/sagen« hinaus eine ausdrückliche Zusage oder Verheißung einzutragen.
