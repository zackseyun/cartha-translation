source:
  edition: WLC
  text: זֹ֛את נַעֲשֶׂ֥ה לָ/הֶ֖ם וְ/הַחֲיֵ֣ה אוֹתָ֑/ם וְ/לֹֽא יִֽהְיֶ֤ה עָלֵ֨י/נוּ֙ קֶ֔צֶף עַל הַ/שְּׁבוּעָ֖ה אֲשֶׁר נִשְׁבַּ֥עְנוּ לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/020.yaml
  text: This is what we will do to them and let them live[b][a], so that wrath may not come upon us because of the oath that we swore to them.
translation:
  language: de
  text: Das wollen wir mit ihnen tun und sie am Leben lassen[a], damit kein Zorn[b] über uns kommt wegen des Eides, den wir ihnen geschworen haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: sie am Leben erhalten; oder: sie verschonen.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist im Zusammenhang wahrscheinlich Gottes Zorn; im Hebräischen wird der HERR hier jedoch nicht ausdrücklich genannt.
    reason: alternative_reading
lexical_decisions:
- source_word: זֹאת נַעֲשֶׂה לָהֶם
  choice: Das wollen wir mit ihnen tun
  rationale: Das Demonstrativpronomen leitet die beabsichtigte Vorgehensweise ein. Der Imperfekt bezeichnet hier eine geplante künftige Handlung; „mit ihnen tun“ ist im Deutschen natürlicher als das formal nähere „ihnen tun“.
- source_word: וְהַחֲיֵה אוֹתָם
  choice: und sie am Leben lassen
  rationale: Der Hifil von חיה bedeutet hier, jemanden leben zu lassen beziehungsweise am Leben zu erhalten. Die gewählte Formulierung ist natürlich und wahrt die Verbindung mit dem vorausgehenden Satzteil.
- source_word: וְלֹא יִהְיֶה עָלֵינוּ קֶצֶף
  choice: damit kein Zorn über uns kommt
  rationale: Die ziel- beziehungsweise folgebezogene Wiedergabe passt zum Zusammenhang. „Zorn“ bewahrt das Gewicht von קֶצֶף, und „über uns kommt“ bildet die hebräische Konstruktion mit היה und עַל idiomatisch ab.
- source_word: עַל הַשְּׁבוּעָה
  choice: wegen des Eides
  rationale: עַל bezeichnet hier den Grund des befürchteten Zorns; „wegen“ gibt diesen kausalen Sinn klar wieder.
- source_word: אֲשֶׁר נִשְׁבַּעְנוּ לָהֶם
  choice: den wir ihnen geschworen haben
  rationale: Der Nifal von שׁבע mit ל bezeichnet einen Eid, den man jemandem gegenüber schwört. Die Formulierung ist direkt und idiomatisch.
theological_decisions:
- issue: Bezug von קֶצֶף beim möglichen Eidbruch
  choice: Im Haupttext steht allgemein „Zorn“, ohne Gott ausdrücklich als Urheber zu nennen.
  alternative: „der Zorn des HERRN“
  rationale: Im Zusammenhang ist wahrscheinlich Gottes Zorn gemeint; der hebräische Vers nennt den HERRN jedoch nicht ausdrücklich. Die Übersetzung bewahrt diese implizite, aber nicht ausformulierte Aussage.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzverknüpfung folgt der hebräischen Abfolge, ohne durch einen Doppelpunkt ein ausdrücklich erläuterndes Verhältnis festzulegen.
