source:
  edition: WLC
  text: וַ/יִּקְח֥וּ הָֽ/אֲנָשִׁ֖ים מִ/צֵּידָ֑/ם וְ/אֶת פִּ֥י יְהוָ֖ה לֹ֥א שָׁאָֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/014.yaml
  text: So the men took some of their provisions[a], but did not ask for the counsel of Yahweh.
translation:
  language: de
  text: Da nahmen die Männer etwas von ihrem Proviant, doch Jahwes Ausspruch holten sie nicht ein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „den Mund Jahwes“. Die Wendung bezeichnet hier eine von Jahwe zu erfragende Weisung oder Entscheidung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Da nahmen
  rationale: לקח bedeutet grundlegend „nehmen“. Das einleitende „Da“ gibt die erzählerische Folge des וַ wieder, ohne einen stärkeren Kausalzusammenhang zu behaupten.
- source_word: הָאֲנָשִׁים
  choice: die Männer
  rationale: Der hebräische Ausdruck bezeichnet schlicht „die Männer“. Ihre genauere Identität ergibt sich aus dem Zusammenhang und wird hier nicht ergänzt.
- source_word: מִצֵּידָם
  choice: etwas von ihrem Reiseproviant
  rationale: 'צֵיד bezeichnet hier mitgeführten Proviant, besonders Nahrung für die Reise. Das Präfix מִן wird partitiv wiedergegeben: Die Männer nahmen etwas davon.'
- source_word: פִּי יְהוָה
  choice: den Ausspruch Jahwes
  rationale: Wörtlich steht „den Mund Jahwes“. In diesem Zusammenhang bezeichnet die Wendung eine von Jahwe einzuholende Weisung oder Entscheidung. „Ausspruch“ bewahrt den Bezug auf eine mündlich erteilte göttliche Antwort besser als das stärker abstrahierende „Rat“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לֹא שָׁאָלוּ
  choice: holten sie nicht ein
  rationale: שׁאל bedeutet „fragen, erfragen“. Zusammen mit „Ausspruch“ ergibt „einholen“ eine natürliche deutsche Formulierung für das unterlassene Erfragen einer göttlichen Weisung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. Die Transliteration bewahrt den Eigennamen, statt ihn durch einen Hoheitstitel zu ersetzen.
- issue: Deutung der Wendung פִּי יְהוָה
  choice: den Ausspruch Jahwes
  alternative: den Rat Jahwes / den Mund Jahwes
  rationale: Die wörtliche Wendung „Mund Jahwes“ kann hier die göttliche Weisung, Entscheidung oder Orakelantwort bezeichnen. „Ausspruch“ wahrt den sprachlichen Charakter der erwarteten Antwort, ohne ihren genauen Inhalt als Rat oder Befehl festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Reiseproviant“ verdeutlicht den kontextuellen Sinn von צֵיד, während „Ausspruch Jahwes einholen“ die hebräische Wendung verständlich macht und ihre Offenheit zwischen Weisung, Entscheidung und Orakelantwort wahrt.
