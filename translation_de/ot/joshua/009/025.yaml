  text: וְ/עַתָּ֖ה הִנְ/נ֣וּ בְ/יָדֶ֑/ךָ כַּ/טּ֨וֹב וְ/כַ/יָּשָׁ֧ר בְּ/עֵינֶ֛י/ךָ לַ/עֲשׂ֥וֹת לָ֖/נוּ עֲשֵֽׂה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/025.yaml
  text: And now[a], here we are in your hand. Do to us as it is good and right in your eyes to do.
translation:
  language: de
  text: Und nun sind wir in deiner Hand. Handle mit uns, wie es in deinen Augen gut und recht ist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl die verbindende Konjunktion וְ als auch den zeitlich-diskursiven Übergang עַתָּה.
- source_word: הִנְנוּ
  choice: Sieh, wir sind
  rationale: Gibt die präsentierende und aufmerksamkeitslenkende Funktion von הִנֵּה wieder; die Formulierung bleibt in modernem, würdigem Deutsch verständlich.
- source_word: בְיָדֶךָ
  choice: in deiner Hand
  rationale: Bewahrt das hebräische Bild für Josuas Macht und Verfügungsgewalt, ohne es auf die stärker deutende Wendung „dir ausgeliefert“ zu verengen.
- source_word: כַּטּוֹב וְכַיָּשָׁר
  choice: gut und recht
  rationale: Entspricht den Grundbedeutungen der beiden Adjektive und erhält ihre wertende Verbindung.
- source_word: בְּעֵינֶיךָ
  choice: in deinen Augen
  rationale: Bewahrt die geläufige hebräische Metapher für persönliche Beurteilung und Entscheidung.
- source_word: לַעֲשׂוֹת לָנוּ עֲשֵׂה
  choice: Tu mit uns, was … ist
  rationale: Überträgt die Verbindung von Infinitiv und Imperativ natürlich ins Deutsche. „Mit uns“ entspricht im Deutschen idiomatisch der hier gemeinten Behandlung, auch wenn לָנוּ formal „uns/an uns“ lautet.
