source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֵלֵ֡י/נוּ זְֽקֵינֵי/נוּ֩ וְ/כָל יֹשְׁבֵ֨י אַרְצֵ֜/נוּ לֵ/אמֹ֗ר קְח֨וּ בְ/יֶדְ/כֶ֤ם צֵידָה֙ לַ/דֶּ֔רֶךְ וּ/לְכ֖וּ לִ/קְרָאתָ֑/ם וַ/אֲמַרְתֶּ֤ם אֲלֵי/הֶם֙ עַבְדֵי/כֶ֣ם אֲנַ֔חְנוּ וְ/עַתָּ֖ה כִּרְתוּ לָ֥/נוּ בְרִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/011.yaml
  text: So our elders and all the inhabitants of our land said to us[a], ‘Take provisions in your hand for the journey, and go to meet them. Say to them, “We are your servants”[b]; and now make a covenant with us.’
translation:
  language: de
  text: 'Da sagten unsere Ältesten und alle Bewohner unseres Landes zu uns: »Nehmt Proviant für die Reise mit und zieht ihnen entgegen. Sagt zu ihnen: ›Wir sind eure Diener[a].‹ Schließt nun einen Bund mit uns[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Diener« ist hier eine ehrerbietige diplomatische Selbstbezeichnung; das hebräische Wort kann in anderen Zusammenhängen auch »Sklaven« bedeuten.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Schneidet einen Bund mit uns.« Das ist die hebräische Redewendung für das Schließen eines Bundes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְקֵינֵינוּ
  choice: unsere Ältesten
  rationale: Gemeint sind die führenden Vertreter der Gemeinschaft, nicht lediglich alte Männer.
- source_word: יֹשְׁבֵי אַרְצֵנוּ
  choice: alle Bewohner unseres Landes
  rationale: Die partizipiale Wendung bezeichnet kollektiv diejenigen, die im Land wohnen; diese Wiedergabe ist klar und idiomatisch.
- source_word: צֵידָה לַדֶּרֶךְ
  choice: Proviant für die Reise
  rationale: צֵידָה bezeichnet Reisevorrat, besonders Verpflegung. »Proviant« trifft den Zusammenhang prägnant, ohne den Ausdruck unnötig auszuweiten.
- source_word: בְיֶדְכֶם
  choice: mit
  rationale: Das wörtliche »in eure Hand« ist im Deutschen an dieser Stelle unnatürlich; »mitnehmen« gibt den Sinn der hebräischen Wendung idiomatisch wieder.
- source_word: לִקְרָאתָם
  choice: zieht ihnen entgegen
  rationale: Die Formulierung bezeichnet das Hingehen, um jemandem zu begegnen; »entgegenziehen« bewahrt sowohl Bewegung als auch Zielrichtung.
- source_word: עַבְדֵיכֶם
  choice: eure Diener
  rationale: עֶבֶד kann auch »Sklave« bedeuten, dient hier aber als diplomatische Unterwerfungs- und Höflichkeitsformel. »Diener« wahrt diesen Ton.
- source_word: וְעַתָּה
  choice: nun
  rationale: Das Wort leitet die abschließende Bitte ein. »Nun« ist im Deutschen natürlicher als ein zusätzliches »und nun«.
- source_word: כִּרְתוּ לָנוּ בְרִית
  choice: Schließt einen Bund mit uns
  rationale: כרת ברית lautet wörtlich »einen Bund schneiden«, ist aber eine feste hebräische Wendung für das Schließen eines Bundes. »Bund« erhält die biblische Kategorie und lässt zugleich den politischen Vertragscharakter offen.
theological_decisions:
- issue: Bedeutungsumfang von בְּרִית im diplomatischen Zusammenhang
  choice: Bund
  alternative: Vertrag / Bündnis
  rationale: Der Kontext erlaubt eine politische Vertragsbedeutung, doch »Bund« bewahrt die wiederkehrende biblische Terminologie, ohne den konkreten diplomatischen Sinn auszuschließen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Rede wird klar gegliedert; konkrete hebräische Bewegungsbilder werden bewahrt, wo sie im Deutschen natürlich sind. Die Fußnotenmarker wurden den tatsächlich erläuterten Ausdrücken zugeordnet.
