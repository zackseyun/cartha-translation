source:
  edition: WLC
  text: וַ/יְהִ֣י כִ/שְׁמֹ֣עַ כָּֽל הַ/מְּלָכִ֡ים אֲשֶׁר֩ בְּ/עֵ֨בֶר הַ/יַּרְדֵּ֜ן בָּ/הָ֣ר וּ/בַ/שְּׁפֵלָ֗ה וּ/בְ/כֹל֙ ח֚וֹף הַ/יָּ֣ם הַ/גָּד֔וֹל אֶל מ֖וּל הַ/לְּבָנ֑וֹן הַֽ/חִתִּי֙ וְ/הָ֣/אֱמֹרִ֔י הַֽ/כְּנַעֲנִי֙ הַ/פְּרִזִּ֔י הַ/חִוִּ֖י וְ/הַ/יְבוּסִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/001.yaml
  text: And it happened[a], when all the kings who were beyond the Jordan—in the hill country, in the lowland, and along the whole coast of the Great Sea toward Lebanon—the Hittite, the Amorite, the Canaanite, the Perizzite, the Hivite, and the Jebusite—heard of it[c][b],
translation:
  language: de
  text: Als nun alle Könige jenseits des Jordan[a] davon[c] hörten – im Bergland, in der Schefela[b] und an der ganzen Küste des Großen Meeres gegenüber dem Libanon –, die Hetiter, Amoriter, Kanaaniter, Perisiter, Hiwiter und Jebusiter,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf der anderen Seite des Jordan“. Der hebräische Ausdruck bezeichnet je nach geografischem Blickpunkt das Gebiet jenseits beziehungsweise auf der anderen Seite des Flusses.'
    reason: lexical_alternative
  - marker: b
    text: Die Schefela ist das westliche Hügelland zwischen dem judäischen Bergland und der Küstenebene.
    reason: cultural_note
  - marker: c
    text: 'Wörtlich: „als alle Könige … hörten“. Was sie hörten, wird im Hebräischen hier nicht ausdrücklich genannt, ergibt sich aber aus dem Zusammenhang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִשְׁמֹעַ
  choice: Als nun ... davon hörten
  rationale: Die hebräische Erzählungsform leitet eine neue Episode ein; die temporale Infinitivkonstruktion wird im Deutschen natürlich als Nebensatz wiedergegeben. „davon“ ergänzt das im Hebräischen unausgesprochene Objekt aus dem Zusammenhang.
- source_word: כָּל הַמְּלָכִים
  choice: alle Könige
  rationale: Direkte und natürliche Wiedergabe von Quantor und Substantiv.
- source_word: אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן
  choice: jenseits des Jordan
  rationale: Bewahrt die herkömmliche geografische Ausdrucksweise, ohne die vom Blickpunkt abhängige Seite ausdrücklich festzulegen.
- source_word: בָּהָר
  choice: im Bergland
  rationale: Bezeichnet hier die zentrale Höhenregion und nicht lediglich einzelne Berge.
- source_word: וּבַשְּׁפֵלָה
  choice: in der Schefela
  rationale: Der geografische Eigenname bezeichnet das westliche Hügelland; die Transliteration vermeidet die ungenaue Vorstellung eines völlig flachen Tieflands.
- source_word: וּבְכֹל חוֹף הַיָּם הַגָּדוֹל
  choice: und an der ganzen Küste des Großen Meeres
  rationale: Gibt חוֹף idiomatisch als „Küste“ wieder und bewahrt „Großes Meer“ als hebräische Bezeichnung des Mittelmeers.
- source_word: אֶל מוּל הַלְּבָנוֹן
  choice: bis zum Libanon
  rationale: Im geografischen Zusammenhang bezeichnet die Wendung die Ausdehnung beziehungsweise Ausrichtung der Küstenregion zum Libanon hin; „bis zum“ ist im Deutschen klar und natürlich.
- source_word: הַחִתִּי וְהָאֱמֹרִי הַכְּנַעֲנִי הַפְּרִזִּי הַחִוִּי וְהַיְבוּסִי
  choice: die Hetiter, Amoriter, Kanaaniter, Perisiter, Hiwiter und Jebusiter
  rationale: Die kollektiven Singularformen des Hebräischen werden als natürliche deutsche Volksbezeichnungen im Plural wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt wie im Hebräischen syntaktisch offen und wird in Vers 2 fortgeführt. Gedankenstriche gliedern die lange geografische und ethnische Aufzählung. Das implizite Objekt von „hören“ wird zur natürlichen deutschen Verständlichkeit als „davon“ ergänzt.
