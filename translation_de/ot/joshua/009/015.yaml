  text: וַ/יַּ֨עַשׂ לָ/הֶ֤ם יְהוֹשֻׁ֨עַ֙ שָׁל֔וֹם וַ/יִּכְרֹ֥ת לָ/הֶ֛ם בְּרִ֖ית לְ/חַיּוֹתָ֑/ם וַ/יִּשָּׁבְע֣וּ לָ/הֶ֔ם נְשִׂיאֵ֖י הָ/עֵדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/015.yaml
  text: So Joshua made peace with them and made a covenant with them to let them live[c][b][a], and the leaders of the congregation swore to them.
translation:
  language: de
  text: So schloss Josua Frieden mit ihnen und schloss einen Bund mit ihnen, sie am Leben zu lassen[a]; und die Obersten der Gemeinde schworen ihnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihr Leben zu verschonen“ bzw. „sie am Leben zu erhalten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... שָׁלוֹם
  choice: schloss Frieden mit ihnen
  rationale: Die hebräische Wendung bezeichnet die Herstellung friedlicher Beziehungen. „Frieden schließen“ ist im Deutschen natürlich und bewahrt den politisch-rechtlichen Sinn.
- source_word: יְהוֹשֻׁעַ
  choice: Josua
  rationale: Verwendet die etablierte deutsche Namensform.
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: schloss einen Bund
  rationale: Das wörtliche hebräische Bild lautet „einen Bund schneiden“, doch „einen Bund schließen“ ist die entsprechende feste deutsche Wendung und bewahrt den rechtlich-feierlichen Gehalt.
- source_word: לְחַיּוֹתָם
  choice: sie am Leben zu lassen
  rationale: 'Der Infinitiv mit Suffix gibt den Zweck beziehungsweise Inhalt der Bundesverpflichtung an: Ihr Leben sollte verschont bleiben.'
- source_word: וַיִּשָּׁבְעוּ לָהֶם
  choice: schworen es ihnen
  rationale: Das Verb bezeichnet das Ablegen eines Eides. Das ergänzte „es“ stellt im Deutschen natürlich den Bezug auf die unmittelbar zuvor genannte Verpflichtung her.
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: die Obersten der Gemeinde
  rationale: נְשִׂיאִים bezeichnet anerkannte führende Amtsträger, während עֵדָה die versammelte Gemeinschaft Israels meint. „Oberste der Gemeinde“ wahrt den gehobenen, rechtlichen Erzählton ohne die monarchische Nebenbedeutung von „Fürsten“.
theological_decisions:
- issue: Wiedergabe der Bundesformel כרת ברית
  choice: schloss einen Bund
  alternative: schnitt einen Bund
  rationale: Die deutsche Idiomatik „einen Bund schließen“ gibt die feststehende hebräische Wendung genau und würdig wieder; das fremde Bild „schneiden“ würde im Haupttext unnötig irritieren.
- issue: Wiedergabe von הָעֵדָה
  choice: Gemeinde
  alternative: Versammlung / Gemeinschaft
  rationale: „Gemeinde“ bezeichnet hier die korporative Gemeinschaft Israels, ohne eine spätere kirchliche Organisationsform ausdrücklich in den Text hineinzulesen.
- issue: Bezug des Schwurs
  choice: schworen es ihnen
  alternative: schworen ihnen
  rationale: Das Objekt des Schwurs bleibt im Hebräischen unausgesprochen und ergibt sich aus dem Zusammenhang. „Es“ macht diesen Rückbezug im Deutschen lesbar, ohne einen zusätzlichen Inhalt festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung „schloss … schloss“ entspricht der parallelen Abfolge der hebräischen Verben und ist trotz stilistischer Nähe klar. Der Semikolon trennt Josuas Bundesschluss vom bestätigenden Eid der Gemeindeobersten.
