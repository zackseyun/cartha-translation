  variant: modern standard German
source:
  edition: WLC
  text: וְ/יֹשְׁבֵ֨י גִבְע֜וֹן שָׁמְע֗וּ אֵת֩ אֲשֶׁ֨ר עָשָׂ֧ה יְהוֹשֻׁ֛עַ לִֽ/ירִיח֖וֹ וְ/לָ/עָֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/003.yaml
  text: But the inhabitants of Gibeon heard what Joshua had done to Jericho and to Ai[a].
translation:
  language: de
  text: Doch die Einwohner von Gibeon hörten, was Josua mit Jericho und Ai getan hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und die Einwohner von Gibeon hörten, was Josua mit Jericho und Ai getan hatte.“'
    reason: Lexikalisch-diskursive Alternative für das einleitende וְ.
lexical_decisions:
- source_word: וְ/יֹשְׁבֵי
  choice: Doch die Einwohner von
  rationale: 'יֹשְׁבֵי bezeichnet die Einwohner beziehungsweise die dort Wohnenden. Das einleitende וְ markiert im Zusammenhang einen Gegensatz: Anders als die Könige in 9,1–2 reagieren die Gibeoniter nicht mit einem Bündnis zum Krieg.'
- source_word: גִבְעוֹן
  choice: Gibeon
  rationale: Der Ortsname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: שָׁמְעוּ
  choice: hörten
  rationale: Das Qal Perfekt von שׁמע hat hier seine direkte Grundbedeutung „hören“; die stärker deutende Wiedergabe „erfuhren“ ist nicht erforderlich.
- source_word: אֵת אֲשֶׁר
  choice: was
  rationale: Die Verbindung aus Objektmarker und Relativpartikel leitet den Inhalt des Gehörten ein; „was“ ist im Deutschen natürlich und präzise.
- source_word: עָשָׂה
  choice: getan hatte
  rationale: עשה bedeutet hier „tun“. Das Plusquamperfekt macht natürlich deutlich, dass Josuas Handlungen dem Hören vorausgingen.
- source_word: יְהוֹשֻׁעַ
  choice: Josua
  rationale: Verwendet wird die im Deutschen etablierte biblische Namensform.
- source_word: לִֽ/ירִיחוֹ
  choice: mit Jericho
  rationale: Bei עשה bezeichnet ל das Ziel, an dem gehandelt wurde. Die deutsche Wendung „was jemand mit etwas getan hat“ gibt dies direkt und idiomatisch wieder, ohne das wertende „gegen“ einzutragen.
- source_word: וְ/לָ/עָי
  choice: und Ai
  rationale: Die zweite Präpositionalfügung steht parallel zu Jericho. Im Deutschen gilt „mit“ gemeinsam für beide verbundenen Ortsnamen.
theological_decisions:
- issue: Wiedergabe des einleitenden וְ
  choice: Doch
  alternative: Und
  rationale: Die Konjunktion kann schlicht koordinieren. Im Kontext hebt der Vers jedoch die andersartige Reaktion Gibeons gegenüber der Reaktion der Könige in 9,1–2 hervor; „Doch“ bildet diesen erzählerischen Gegensatz ab. Die formal mögliche Lesart „Und“ bleibt in der Fußnote erhalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Einwohner“ ist präzise und geläufig; die idiomatische Konstruktion „was … mit … getan hatte“ bewahrt die Zielrichtung der hebräischen Präposition, ohne sie unnötig als feindliches „gegen“ auszulegen.
