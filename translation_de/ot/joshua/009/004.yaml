  - severity: low
    issue: „mit sowie“ ist stilistisch unnötig schwer.
    rationale: Die einfache Reihung „Säcke ... und Weinschläuche“ entspricht der hebräischen Aufzählung und klingt im heutigen Deutsch flüssiger.
