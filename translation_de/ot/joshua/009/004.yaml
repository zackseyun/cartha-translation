- from: Auch sie gingen mit List vor. Sie machten sich auf und verstellten sich[a]. Sie nahmen abgenutzte Säcke für ihre Esel mit sowie abgenutzte Weinschläuche, die aufgerissen und wieder zugebunden waren[b].
  to: Auch sie gingen mit List vor. Sie machten sich auf und verstellten sich[a]. Sie nahmen abgenutzte Säcke für ihre Esel und abgenutzte Weinschläuche mit, die aufgerissen und zusammengebunden waren[b].
  rationale: Die Revision bewahrt die kontextuell plausible Hauptdeutung der schwierigen Verbform, ergänzt aber die wesentliche Alternative „sich als Boten/Gesandte ausgeben“ in der Fußnote. Außerdem wird die Reparatur der Weinschläuche quellennäher als „zusammengebunden“ formuliert und die Aufzählung stilistisch geglättet.
