  text: וַ/יַּעֲשׂ֤וּ גַם הֵ֨מָּה֙ בְּ/עָרְמָ֔ה וַ/יֵּלְכ֖וּ וַ/יִּצְטַיָּ֑רוּ וַ/יִּקְח֞וּ שַׂקִּ֤ים בָּלִים֙ לַ/חֲמ֣וֹרֵי/הֶ֔ם וְ/נֹאד֥וֹת יַ֨יִן֙ בָּלִ֔ים וּ/מְבֻקָּעִ֖ים וּ/מְצֹרָרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/004.yaml
  text: They too acted with cunning[a], and went and made provisions, and took worn-out sacks for their donkeys, and worn-out wineskins[b], split open and patched.
translation:
  language: de
  text: Auch sie gingen mit List vor. Sie machten sich auf und verstellten sich[a]. Sie nahmen abgenutzte Säcke für ihre Esel und abgenutzte Weinschläuche mit, die aufgerissen und zusammengebunden waren[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gaben sich als Boten/Gesandte aus“; auch „versorgten sich mit Reisebedarf“ oder „verproviantierten sich“ wird vertreten. Die Bedeutung des hebräischen Verbs וַיִּצְטַיָּרוּ ist unsicher; der Zusammenhang der vorgetäuschten weiten Reise unterstützt hier „verstellten sich“.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „geflickt“. Das hebräische Wort kann ein Zusammen- oder Zubinden bezeichnen, mit dem die aufgerissenen Weinschläuche notdürftig repariert wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעָרְמָה
  choice: mit List
  rationale: Die Wendung bezeichnet kluges, hier eindeutig auf Täuschung gerichtetes Vorgehen. „Mit List“ ist knapp, natürlich und wertet nicht stärker, als es der Zusammenhang verlangt.
- source_word: וַיִּצְטַיָּרוּ
  choice: verstellten sich
  rationale: Die schwierige Verbform wird im unmittelbaren Zusammenhang mit der vorgetäuschten Herkunft als Verstellung verstanden. Da auch Deutungen im Sinn von Reiseausrüstung oder Verproviantierung möglich sind, bleibt die Unsicherheit in einer Fußnote sichtbar.
- source_word: שַׂקִּים בָּלִים
  choice: abgenutzte Säcke
  rationale: שַׂקִּים sind grobe Transport- oder Packsäcke; בָּלִים bezeichnet ihren durch Gebrauch und Alter verschlissenen Zustand.
- source_word: לַחֲמוֹרֵיהֶם
  choice: für ihre Esel
  rationale: Die Präposition bezeichnet hier die Zuordnung der Säcke zu den Eseln als Lasttieren; die Formulierung folgt dem Hebräischen, ohne ein nicht ausdrücklich genanntes Aufladen zu ergänzen.
- source_word: נֹאדוֹת יַיִן
  choice: Weinschläuche
  rationale: Dies ist die geläufige deutsche Bezeichnung für Behälter aus Tierhaut, in denen Wein transportiert wurde.
- source_word: מְבֻקָּעִים
  choice: aufgerissen
  rationale: Das passive Partizip bezeichnet Weinschläuche, die gespalten beziehungsweise aufgeplatzt waren. „Aufgerissen“ gibt den sichtbaren Schaden verständlich wieder.
- source_word: מְצֹרָרִים
  choice: wieder zugebunden
  rationale: Das Partizip weist wahrscheinlich auf ein Zusammenbinden als Reparatur der beschädigten Weinschläuche hin. „Wieder zugebunden“ ist konkreter und näher am möglichen Reparaturvorgang als das allgemeinere „geflickt“.
- source_word: גַם הֵמָּה
  choice: Auch sie
  rationale: Die Formulierung stellt das Handeln der Gibeoniter dem zuvor geschilderten Handeln der anderen Bewohner beziehungsweise Könige gegenüber.
- source_word: וַיֵּלְכוּ
  choice: Sie machten sich auf
  rationale: Im erzählenden Zusammenhang bezeichnet das Verb den Beginn ihres Vorhabens. „Machten sich auf“ ist idiomatisches, würdiges Deutsch.
- source_word: וַיִּקְחוּ
  choice: Sie nahmen … mit
  rationale: Das häufige Erzählverb wird im Zusammenhang mit Reisegegenständen natürlich durch „mitnehmen“ wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Kurze Sätze entlasten die lange hebräische Verbfolge. Die schwierige Verbform וַיִּצְטַיָּרוּ und die konkrete Art der Reparatur der Weinschläuche werden nicht stillschweigend vereindeutigt, sondern durch Fußnoten offengehalten.
