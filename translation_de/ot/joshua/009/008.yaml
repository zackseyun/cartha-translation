  text: They said to Joshua[a], “We are your servants.” Then Joshua said to them, “Who are you, and where do you come from?”
translation:
  language: de
  text: 'Sie sagten zu Josua: „Wir sind deine Diener.[a]“ Da sagte Josua zu ihnen: „Wer seid ihr, und woher kommt ihr?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deine Sklaven“. Das hebräische Wort עֲבָדֶיךָ kann sowohl Diener als auch Sklaven bezeichnen. Hier ist „Diener“ gewählt, weil die Sprecher sich in einer diplomatischen Bitte unterwürfig ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדֶיךָ
  choice: deine Diener
  rationale: עֶבֶד kann je nach Zusammenhang einen Diener oder einen Sklaven bezeichnen. Hier sprechen die Gibeoniter in einer diplomatischen Bitte unterwürfig und stellen sich als Josua untergeordnet dar; „Diener“ gibt diese pragmatische Bedeutung im Deutschen natürlich wieder, ohne einen bereits bestehenden rechtlichen Sklavenstatus vorauszusetzen.
- source_word: אֲנָחְנוּ
  choice: wir sind
  rationale: Der hebräische Nominalsatz enthält keine ausdrückliche Kopula. Im natürlichen Deutschen wird „sind“ ergänzt.
- source_word: מִי אַתֶּם
  choice: Wer seid ihr
  rationale: Die Verbindung aus Fragewort und Pronomen wird direkt wiedergegeben; ein zusätzliches Substantiv ist im Hebräischen nicht vorhanden.
- source_word: וּמֵאַיִן תָּבֹאוּ
  choice: und woher kommt ihr
  rationale: מֵאַיִן fragt nach Herkunft oder Ausgangspunkt. Das Imperfekt von בוא bezeichnet hier idiomatisch die Herkunft der Sprecher; „woher kommt ihr?“ ist im modernen Deutschen die natürliche Entsprechung.
- source_word: וַיֹּאמְרוּ / וַיֹּאמֶר
  choice: Sie sagten ... Darauf fragte Josua
  rationale: Die narrativen Wayyiqtol-Formen werden mit deutschem Präteritum wiedergegeben. „Darauf“ kennzeichnet den Sprecherwechsel und den Fortgang der Handlung; „fragte“ entspricht der Funktion von אמר bei der anschließenden direkten Frage.
