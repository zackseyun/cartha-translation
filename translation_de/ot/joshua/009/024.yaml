source:
  edition: WLC
  text: וַ/יַּעֲנ֨וּ אֶת יְהוֹשֻׁ֜עַ וַ/יֹּאמְר֗וּ כִּי֩ הֻגֵּ֨ד הֻגַּ֤ד לַ/עֲבָדֶ֨י/ךָ֙ אֵת֩ אֲשֶׁ֨ר צִוָּ֜ה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֶת מֹשֶׁ֣ה עַבְדּ֔/וֹ לָ/תֵ֤ת לָ/כֶם֙ אֶת כָּל הָ/אָ֔רֶץ וּ/לְ/הַשְׁמִ֛יד אֶת כָּל יֹשְׁבֵ֥י הָ/אָ֖רֶץ מִ/פְּנֵי/כֶ֑ם וַ/נִּירָ֨א מְאֹ֤ד לְ/נַפְשֹׁתֵ֨י/נוּ֙ מִ/פְּנֵי/כֶ֔ם וַֽ/נַּעֲשֵׂ֖ה אֶת הַ/דָּבָ֥ר הַ/זֶּֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/024.yaml
  text: 'They answered Joshua and said[a], “Because it was clearly told to your servants what Yahweh your God commanded his servant Moses: to give you all the land and to destroy all the inhabitants of the land before you. So we feared greatly for our lives because of you, and we did this thing.”'
translation:
  language: de
  text: 'Sie antworteten Josua: „Denn es wurde deinen Knechten ganz gewiss mitgeteilt[a], was Jahwe, dein Gott, seinem Diener Mose befohlen hat: euch das ganze Land zu geben und alle Bewohner des Landes vor euch zu vernichten. Deshalb fürchteten wir uns euretwegen sehr um unser Leben und taten dies.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Es wurde deinen Knechten ausdrücklich mitgeteilt.“ Im Hebräischen verstärkt die Verbindung eines Infinitivus absolutus mit einem finiten Verb die Aussage nachdrücklich.'
    reason: Die Fußnote erläutert die Emphase der hebräischen Konstruktion und bietet eine mögliche idiomatische Alternative, ohne die Bedeutung einzuengen.
lexical_decisions:
- source_word: וַיַּעֲנוּ אֶת־יְהוֹשֻׁעַ וַיֹּאמְרוּ
  choice: Sie antworteten Josua und sagten
  rationale: Die zweigliedrige hebräische Redeeinleitung wird beibehalten; sie klingt im Deutschen gehoben, bleibt aber klar verständlich.
- source_word: כִּי
  choice: unübersetzt; die Begründung folgt unmittelbar
  rationale: Das einleitende כִּי begründet das zuvor geschilderte Handeln. Im Deutschen macht die direkte Antwort den kausalen Zusammenhang auch ohne ein schwerfälliges einleitendes „Denn“ deutlich.
- source_word: הֻגֵּד הֻגַּד
  choice: wurde mit Bestimmtheit berichtet
  rationale: Infinitivus absolutus und finite Passivform desselben Verbs verstärken die Aussage. „Mit Bestimmtheit“ gibt diese Emphase idiomatisch wieder, ohne die Art der Informationsübermittlung über den hebräischen Text hinaus festzulegen.
- source_word: לַעֲבָדֶיךָ
  choice: deinen Knechten
  rationale: Die Sprecher bezeichnen sich in unterwürfiger diplomatischer Rede selbst so. „Knechte“ bewahrt diesen sozialen und rhetorischen Ton besser als das neutralere „Diener“.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Jahwe, dein Gott
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „dein Gott“ wahrt die direkte Anrede Josuas.
- source_word: עַבְדּוֹ
  choice: seinem Diener
  rationale: Bei Mose bezeichnet עבד den ehrenvollen Dienst im Auftrag Gottes; „Diener“ ist hier im modernen Deutschen angemessener als „Knecht“.
- source_word: לָתֵת לָכֶם אֶת־כָּל־הָאָרֶץ
  choice: euch das ganze Land zu geben
  rationale: Die Infinitivkonstruktion und das Land als Gabe werden direkt bewahrt.
- source_word: וּלְהַשְׁמִיד אֶת־כָּל־יֹשְׁבֵי הָאָרֶץ מִפְּנֵיכֶם
  choice: und alle Bewohner des Landes vor euch zu vernichten
  rationale: „Vernichten“ gibt die Stärke von שׁמד wieder. „Vor euch“ bewahrt das räumlich-dynamische Bild der Beseitigung angesichts des Vorrückens Israels.
- source_word: וַנִּירָא מְאֹד לְנַפְשֹׁתֵינוּ מִפְּנֵיכֶם
  choice: Da fürchteten wir uns euretwegen sehr um unser Leben
  rationale: נפשׁ bezeichnet hier das bedrohte Leben. Das zweite מִפְּנֵיכֶם hat kausale Bedeutung und wird deshalb idiomatisch mit „euretwegen“ wiedergegeben.
- source_word: וַנַּעֲשֶׂה אֶת־הַדָּבָר הַזֶּה
  choice: und taten dies
  rationale: Die knappe hebräische Schlussformulierung wird in natürlichem Deutsch ebenso knapp wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den Eigennamen in geläufiger deutscher Form wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Reichweite des göttlichen Befehls
  choice: Die beiden Infinitive werden als Inhalt dessen wiedergegeben, was Jahwe Mose befahl
  alternative: Die Infinitive ausdrücklich als eigenständige göttliche Absicht oder Verheißung deuten
  rationale: Die syntaktische Verbindung mit „befohlen hat“ bleibt erhalten, ohne über den Wortlaut hinaus zu bestimmen, wie Mose die Landgabe und Vernichtung ausführen sollte.
translation_notes:
  register: Moderne, würdige Erzählsprache. Die formelhafte Redeeinleitung und die Selbstbezeichnung „Knechte“ bewahren den diplomatisch-unterwürfigen Ton; der übrige Satzbau ist für heutige Leser geglättet.
