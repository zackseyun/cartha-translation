- from: 'Sie antworteten Josua und sagten: „Deinen Knechten wurde mit Bestimmtheit berichtet[a], was Jahwe, dein Gott, seinem Diener Mose befohlen hat: euch das ganze Land zu geben und alle Bewohner des Landes vor euch zu vernichten. Da fürchteten wir uns euretwegen sehr um unser Leben und taten dies.“'
  to: 'Sie antworteten Josua: „Denn es wurde deinen Knechten ganz gewiss mitgeteilt[a], was Jahwe, dein Gott, seinem Diener Mose befohlen hat: euch das ganze Land zu geben und alle Bewohner des Landes vor euch zu vernichten. Deshalb fürchteten wir uns euretwegen sehr um unser Leben und taten dies.“'
  rationale: Die Revision stellt die im Hebräischen ausdrücklich markierte Begründung durch כִּי wieder her und verdeutlicht mit „Deshalb“ die Folgerung zum anschließenden Handeln. Die passive emphatische Mitteilung wird idiomatischer formuliert; die Fußnote wird grammatisch und fachsprachlich bereinigt. Bedeutung, Ton und die problematische historische Aussage werden nicht abgeschwächt oder erweitert.
