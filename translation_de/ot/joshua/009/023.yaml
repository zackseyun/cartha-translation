base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/023.yaml
  text: So now you are cursed[a], and there shall never cease to be from among you servants, cutters of wood and drawers of water for the house of my God.
translation:
  language: de
  text: Und nun seid ihr verflucht, und aus eurer Mitte wird es immer Sklaven[a] geben, die für das Haus meines Gottes Holz hauen und Wasser schöpfen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Aus eurer Mitte wird niemals ein Sklave abgeschnitten werden.“ Das Hebräische bezeichnet damit einen fortdauernden Zustand: Aus ihrem Volk sollten ständig Menschen diese Arbeiten verrichten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Darum ... nun
  rationale: Gibt den folgernden Übergang von Josuas Anklage zum Urteil in natürlichem Deutsch wieder.
- source_word: אֲרוּרִים
  choice: verflucht
  rationale: Entspricht direkt dem prädikativ gebrauchten hebräischen Adjektiv im Plural.
- source_word: וְלֹא יִכָּרֵת מִכֶּם עֶבֶד
  choice: unter euch wird es nie an Sklaven fehlen
  rationale: Gibt die fortdauernde kollektive Verpflichtung idiomatisch wieder, ohne fälschlich zu behaupten, nur ein Teil der Angesprochenen stehe unter dem Fluch.
- source_word: עֶבֶד
  choice: Sklaven
  rationale: Der Singular hat hier kollektiven Sinn; „Sklaven“ wahrt den aufgezwungenen, unfreien Status deutlicher als „Diener“.
- source_word: חֹטְבֵי עֵצִים
  choice: Holz hauen
  rationale: Moderne, konkrete Wiedergabe der zugewiesenen Arbeit; vermeidet das altertümliche „Holzhauer“.
- source_word: שֹׁאֲבֵי מַיִם
  choice: Wasser schöpfen
  rationale: Gibt die konkrete Tätigkeit des Wasserholens unmittelbar und idiomatisch wieder.
- source_word: לְבֵית אֱלֹהָי
  choice: für das Haus meines Gottes
  rationale: Bewahrt die kultische Bezeichnung des Heiligtums und folgt der Form des hebräischen Ausdrucks.
theological_decisions:
- issue: Wiedergabe des auferlegten unfreien Status
  choice: Sklaven
  alternative: Diener
  rationale: Der Zusammenhang beschreibt einen als Fluch auferlegten, bleibenden Status untergeordneter Arbeit. „Diener“ könnte dessen Härte abschwächen.
- issue: Reichweite des Fluches und Fortbestand der Arbeitspflicht
  choice: Der Fluch gilt den Angesprochenen insgesamt; aus ihrer Mitte werden fortwährend Sklaven für diese Arbeiten gestellt.
  alternative: Nur einige der Angesprochenen sind verflucht oder bleiben Sklaven.
  rationale: Der Plural „ihr seid verflucht“ bezieht das Urteil auf die Gruppe, während die folgende singularisch-kollektive Formulierung den dauernden Fortbestand dieser Arbeitskräfte aus ihrer Mitte bezeichnet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt nahe am hebräischen Urteil, löst dessen singularisch-kollektive Ausdrucksweise jedoch in verständliches Deutsch auf. Der Fußnotenmarker [a] steht unmittelbar bei der erklärungsbedürftigen Wendung.
