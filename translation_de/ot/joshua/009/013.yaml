base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/013.yaml
  text: And these wineskins[a], which we filled when they were new—look, they have burst[c][b]; and these our garments and our sandals have worn out from the journey being very long.
translation:
  language: de
  text: Und diese Weinschläuche, die wir füllten, als sie neu waren – seht, sie sind aufgerissen.[a] Auch unsere Kleider und unsere Sandalen sind durch die überaus lange Reise verschlissen.[b]
  philosophy: optimal-equivalence
  footnotes:
