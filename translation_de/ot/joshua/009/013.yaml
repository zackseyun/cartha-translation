  - marker: b
    text: 'Wörtlich etwa: »wegen der großen Länge des Weges, sehr«; gemeint ist die außergewöhnliche Länge der Reise.'
    reason: source_idiom
lexical_decisions:
- source_word: נֹאדוֹת הַיַּיִן
  choice: Weinschläuche
  rationale: נֹאד bezeichnet einen aus Tierhaut gefertigten Flüssigkeitsbehälter; „Weinschläuche“ ist im Deutschen sachlich präzise und geläufig.
- source_word: מִלֵּאנוּ חֲדָשִׁים
  choice: waren neu, als wir sie füllten
  rationale: חֲדָשִׁים beschreibt den damaligen Zustand der Weinschläuche. Die temporale Formulierung gibt diesen Bezug im Deutschen klar und natürlich wieder.
- source_word: וְהִנֵּה
  choice: und seht
  rationale: הִנֵּה lenkt die Aufmerksamkeit demonstrativ auf den sichtbaren Zustand; „seht“ bewahrt diese Funktion in würdigem, verständlichem Deutsch.
- source_word: הִתְבַּקָּעוּ
  choice: sind aufgerissen
  rationale: Das Verb bezeichnet das Aufplatzen oder Aufreißen der Schläuche; die Formulierung beschreibt zugleich den eingetretenen und nun sichtbaren Zustand.
- source_word: שַׂלְמוֹתֵינוּ
  choice: unsere Kleider
  rationale: Das Substantiv bezeichnet Kleidung beziehungsweise Gewänder; „Kleider“ ist hier allgemein, natürlich und nicht unnötig altertümlich.
- source_word: נְעָלֵינוּ
  choice: unsere Sandalen
  rationale: „Sandalen“ entspricht dem historischen Sachkontext und der üblichen Bedeutung des hebräischen Wortes.
- source_word: בָּלוּ
  choice: sind … verschlissen
  rationale: בָּלָה bezeichnet das Abnutzen und Altwerden durch Gebrauch; „verschlissen“ gibt den daraus entstandenen Zustand prägnant wieder.
- source_word: מֵרֹב הַדֶּרֶךְ מְאֹד
  choice: durch die überaus lange Reise
  rationale: Die Formulierung nennt das außergewöhnlich große Ausmaß des Weges als Ursache der Abnutzung. „Überaus lange Reise“ bewahrt die starke Intensivierung und klingt im Deutschen natürlich.
