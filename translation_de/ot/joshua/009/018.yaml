source:
  edition: WLC
  text: וְ/לֹ֤א הִכּוּ/ם֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כִּֽי נִשְׁבְּע֤וּ לָ/הֶם֙ נְשִׂיאֵ֣י הָֽ/עֵדָ֔ה בַּֽ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וַ/יִּלֹּ֥נוּ כָל הָ/עֵדָ֖ה עַל הַ/נְּשִׂיאִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/018.yaml
  text: But the sons of Israel did not strike them[a], because the leaders of the congregation had sworn to them by Yahweh, the God of Israel[c][b]. And all the congregation grumbled against the leaders.
translation:
  language: de
  text: Doch die Israeliten schlugen sie nicht nieder, denn die Anführer der Gemeinde hatten ihnen bei Jahwe, dem Gott Israels, einen Eid geschworen. Da murrte die ganze Gemeinde gegen die Anführer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלֹא הִכּוּם
  choice: Doch die Israeliten schlugen sie nicht nieder
  rationale: נכה bezeichnet konkret das Schlagen und kann im militärischen Zusammenhang tödliche Gewalt einschließen. „Nicht niederschlagen“ bewahrt diese Stärke, ohne ausdrücklich „töten“ festzulegen; וְ setzt hier den Gegensatz zur erwarteten Handlung fort.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die hebräische Wendung bedeutet idiomatisch die Angehörigen des Volkes Israel. „Israeliten“ ist im modernen Deutschen natürlicher als die formal mögliche Wiedergabe „Söhne Israels“ und umfasst hier das Volk als Kollektiv.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt den Grund dafür an, dass Israel keine Gewalt gegen die Gibeoniter ausübte.
- source_word: נִשְׁבְּעוּ לָהֶם
  choice: hatten ihnen … einen Eid geschworen
  rationale: Der vorzeitige Charakter des bereits geleisteten Eides wird im Deutschen mit dem Plusquamperfekt klar wiedergegeben. Die explizite Wendung „einen Eid schwören“ ist natürlich und bewahrt das Gewicht der Verpflichtung.
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: die Anführer der Gemeinde
  rationale: נְשִׂיאִים bezeichnet die anerkannten führenden Männer; „Anführer“ ist klar und gegenwärtig. עֵדָה meint Israel als versammelte Gemeinschaft, wofür „Gemeinde“ eine verständliche, nicht institutionell festgelegte Wiedergabe ist.
- source_word: בַּיהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: bei Jahwe, dem Gott Israels
  rationale: Bei שׁבע bezeichnet ב denjenigen, bei dem geschworen wird. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben; אֱלֹהֵי יִשְׂרָאֵל steht dazu als Apposition.
- source_word: וַיִּלֹּנוּ
  choice: Da murrte
  rationale: לון bezeichnet das gemeinschaftliche, missbilligende Murren gegen die Leitung. „Murren“ bewahrt die biblische Resonanz und ist präziser als das neutralere „sich beschweren“.
- source_word: כָל הָעֵדָה עַל הַנְּשִׂיאִים
  choice: die ganze Gemeinde gegen die Anführer
  rationale: כָל wird idiomatisch mit „die ganze“ wiedergegeben; עַל markiert die Anführer als Ziel des Murrens.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Tetragrammaton ausdrücklich. „Jahwe“ macht den persönlichen Bundesnamen sichtbar, ohne ihn durch einen Titel zu ersetzen.
- issue: Gemeinschaftsbezeichnung עֵדָה
  choice: Gemeinde
  alternative: Versammlung
  rationale: „Gemeinde“ bezeichnet hier die versammelte Gemeinschaft Israels, ohne eine spätere kirchliche Organisationsform vorauszusetzen. „Versammlung“ wäre ebenfalls möglich, betont aber stärker den Vorgang des Zusammenkommens.
- issue: Reichweite von נכה im militärischen Kontext
  choice: niederschlagen
  alternative: angreifen / töten
  rationale: Der Ausdruck kann einen gewaltsamen Angriff bis hin zur Tötung bezeichnen. „Niederschlagen“ lässt den genauen Ausgang offen und erhält damit die lexikalische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt der hebräischen Begründungs- und Folgestruktur, wird aber idiomatisch geglättet. Keine Fußnote ist nötig, da die wesentlichen Bedeutungsnuancen im Haupttext angemessen bewahrt werden.
