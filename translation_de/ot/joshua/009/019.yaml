source:
  edition: WLC
  text: וַ/יֹּאמְר֤וּ כָל הַ/נְּשִׂיאִים֙ אֶל כָּל הָ֣/עֵדָ֔ה אֲנַ֨חְנוּ֙ נִשְׁבַּ֣עְנוּ לָ/הֶ֔ם בַּֽ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וְ/עַתָּ֕ה לֹ֥א נוּכַ֖ל לִ/נְגֹּ֥עַ בָּ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/019.yaml
  text: But all the leaders said to all the congregation[a], “We have sworn to them by Yahweh, the God of Israel, and now we cannot touch them.”
translation:
  language: de
  text: 'Doch alle Obersten sagten zur ganzen Gemeinde: »Wir haben ihnen bei Jahwe, dem Gott Israels, geschworen, und nun können wir sie nicht antasten.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ihnen etwas antun oder sie schlagen; wörtlich: sie berühren.'
    reason: Das Verb נגע bedeutet wörtlich »berühren«, bezeichnet in diesem Zusammenhang aber wahrscheinlich ein feindliches Antasten oder Schädigen.
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Doch … sagten
  rationale: Die Verbform führt die Erzählung fort; im Zusammenhang antworten die Obersten jedoch auf den Unmut der Gemeinde. »Doch« gibt diesen Gegensatz im Deutschen natürlich wieder.
- source_word: כָל הַנְּשִׂיאִים
  choice: alle Obersten
  rationale: נָשִׂיא bezeichnet hier die maßgeblichen Führer Israels. »Obersten« ist im erzählerischen und politischen Zusammenhang prägnant und würdevoll.
- source_word: אֶל כָּל הָעֵדָה
  choice: zur ganzen Gemeinde
  rationale: עֵדָה bezeichnet die versammelte Gemeinschaft Israels. »Gemeinde« bewahrt den gemeinschaftlichen Sinn und ist im Deutschen gut verständlich.
- source_word: נִשְׁבַּעְנוּ לָהֶם
  choice: Wir haben ihnen … geschworen
  rationale: Der deutsche Perfektgebrauch bringt zum Ausdruck, dass der bereits geleistete Eid weiterhin bindet.
- source_word: בַּיהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: bei Jahwe, dem Gott Israels
  rationale: Bei שׁבע bezeichnet ב denjenigen, bei dem geschworen wird. Die Apposition gibt die hebräische Zuordnung unmittelbar wieder.
- source_word: וְעַתָּה לֹא נוּכַל
  choice: und nun können wir … nicht
  rationale: Die Formulierung bewahrt sowohl den Anschluss »und nun« als auch die aus dem Eid folgende Unmöglichkeit, ohne ausdrücklich zu entscheiden, ob sie vor allem moralisch oder praktisch verstanden wird.
- source_word: לִנְגֹּעַ בָּהֶם
  choice: sie … antasten
  rationale: נגע bedeutet grundsätzlich »berühren«, kann hier aber feindliches Anrühren oder Schädigen meinen. »Antasten« wahrt im Deutschen sowohl das Bild des Berührens als auch den idiomatischen Sinn des Angreifens.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm יהוה. »Jahwe« gibt den persönlichen Bundesnamen in geläufiger deutscher Form wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am hebräischen Gedankengang; »antasten« erhält bewusst die Spannung zwischen wörtlicher Berührung und feindlichem Vorgehen.
