source:
  edition: WLC
  text: וַ/יִּסְע֣וּ בְנֵֽי יִשְׂרָאֵ֗ל וַ/יָּבֹ֛אוּ אֶל עָרֵי/הֶ֖ם בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֑י וְ/עָרֵי/הֶם֙ גִּבְע֣וֹן וְ/הַ/כְּפִירָ֔ה וּ/בְאֵר֖וֹת וְ/קִרְיַ֥ת יְעָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/017.yaml
  text: So the sons of Israel set out and came to their cities on the third day[a]. Now their cities were Gibeon, Chephirah, Beeroth[b], and Kiriath-jearim.
translation:
  language: de
  text: Da brachen die Israeliten auf und kamen am dritten Tag zu deren Städten. Ihre Städte waren Gibeon, Kefira, Beerot und Kirjat-Jearim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: brachen … auf
  rationale: Das Verb נסע bezeichnet hier den Aufbruch zur Weiterreise; „aufbrechen“ gibt die Erzählbewegung natürlich wieder, ohne ausdrücklich ein Lager vorauszusetzen.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die wörtliche Form lautet „Söhne Israels“, dient hier aber als geläufige Volksbezeichnung. „Die Israeliten“ ist im modernen Deutschen natürlich und schließt das Volk als Ganzes ein.
- source_word: וַיָּבֹאוּ אֶל עָרֵיהֶם
  choice: kamen … zu deren Städten
  rationale: בוא mit אֶל bedeutet „zu etwas kommen/gelangen“. Das auf die Gibeoniter bezogene Suffix wird mit „deren“ eindeutig wiedergegeben.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: am dritten Tag
  rationale: Dies ist die naheliegende temporale Bedeutung der hebräischen Wendung.
- source_word: וְעָרֵיהֶם
  choice: Ihre Städte waren
  rationale: Die mit וְ eingeleitete Aussage erläutert, welche Städte gemeint sind. Ein neuer deutscher Satz bildet diese erklärende Funktion klar ab.
- source_word: גִּבְעוֹן
  choice: Gibeon
  rationale: Im Deutschen etablierte Wiedergabe des Ortsnamens.
- source_word: הַכְּפִירָה
  choice: Kefira
  rationale: Eine deutsch lesbare Transliteration des hebräischen Ortsnamens כְּפִירָה.
- source_word: בְּאֵרוֹת
  choice: Beerot
  rationale: Eine deutschsprachige Transliteration, die die hebräische Endung ת als t wiedergibt.
- source_word: קִרְיַת יְעָרִים
  choice: Kirjat-Jearim
  rationale: Etablierte deutschsprachige Form des zusammengesetzten Ortsnamens; der Bindestrich macht seine Einheit erkennbar.
theological_decisions: []
