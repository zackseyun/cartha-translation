lexical_decisions:
- source_word: הֶעֱלָתַם
  choice: hatte sie hinaufgebracht
  rationale: Das Plusquamperfekt gibt im deutschen Erzählzusammenhang die gegenüber Vers 5 zurückliegende Handlung natürlich wieder; das Suffix bezeichnet die beiden Männer.
- source_word: בְּפִשְׁתֵּי הָעֵץ
  choice: zwischen den Flachsstängeln
  rationale: Die Wendung bezeichnet den holzigen bzw. stängelartigen Flachs; „Flachsstängel“ ist konkret und idiomatisch.
- source_word: הָעֲרֻכוֹת לָהּ
  choice: die für sie … ausgebreitet waren
  rationale: Das feminine Partizip bezieht sich auf die Flachsstängel; לָהּ wird ausdrücklich mit „für sie“ wiedergegeben, ohne den möglichen Besitz- oder Interessenbezug enger festzulegen.
