base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/023.yaml
  text: Then the two men returned[a], came down from the hill country, crossed over, and came to Joshua son of Nun; and they told him all that had happened to them.
translation:
  language: de
  text: Dann kehrten die beiden Männer zurück, stiegen vom Bergland herab, setzten über und kamen zu Josua, dem Sohn Nuns. Sie erzählten ihm alles, was ihnen widerfahren war.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »alles, was ihnen begegnet war«; wörtlicher: »all die Dinge, die sie getroffen hatten«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: kehrten … zurück
  rationale: Das Verb שוב bezeichnet in der Erzählfolge die Rückkehr der beiden Männer von ihrem Auftrag; die deutsche Wendung ist natürlich und eng am Hebräischen.
- source_word: שְׁנֵי הָאֲנָשִׁים
  choice: die beiden Männer
  rationale: Die Übersetzung bewahrt die ausdrückliche Bezeichnung des Hebräischen und ergänzt nicht die aus dem Kontext bekannte Rolle als Kundschafter.
- source_word: וַיֵּרְדוּ מֵהָהָר
  choice: stiegen vom Bergland herab
  rationale: הָהָר kann hier eine gebirgige Landschaft statt eines einzelnen Berges bezeichnen. „Bergland“ passt zum geografischen Zusammenhang und „herabsteigen“ gibt die Bewegungsrichtung präzise wieder.
- source_word: וַיַּעַבְרוּ
  choice: setzten über
  rationale: עבר bezeichnet eine Überquerung. Da das Zielobjekt im Hebräischen unausgesprochen bleibt, wird es auch im Deutschen nicht ergänzt.
- source_word: וַיָּבֹאוּ אֶל יְהוֹשֻׁעַ בִּן נוּן
  choice: kamen zu Josua, dem Sohn Nuns
  rationale: Die Formulierung gibt sowohl die Bewegung zu Josua als auch die hebräische Herkunftsangabe in idiomatischem Standarddeutsch wieder.
- source_word: וַיְסַפְּרוּ לוֹ
  choice: Sie erzählten ihm
  rationale: ספר im Piel bedeutet hier erzählen oder berichten. „Erzählten“ ist verständlich und wahrt den narrativen Charakter, ohne einen amtlichen Bericht zu unterstellen.
- source_word: אֵת כָּל הַמֹּצְאוֹת אוֹתָם
  choice: alles, was ihnen widerfahren war
  rationale: Die wörtliche Vorstellung von Dingen, die sie „gefunden“ haben, ist ein Idiom für das, was ihnen begegnet beziehungsweise widerfahren ist. Die gewählte Formulierung bewahrt die Gesamtheit von כָּל und klingt würdig und natürlich.
