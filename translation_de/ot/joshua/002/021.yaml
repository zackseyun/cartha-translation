base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/021.yaml
  text: And she said[a], “According to your words, so be it.” Then she sent them away, and they went; and she tied the scarlet cord in the window.
translation:
  language: de
  text: 'Sie sagte: „Wie ihr gesagt habt, so ist es.“ Dann ließ sie die Männer gehen, und sie gingen fort. Sie band die scharlachrote Schnur[a] im Fenster fest.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die scharlachrote Leine“. Der hebräische Ausdruck kann eine Schnur, Leine oder ein Seil bezeichnen, das als sichtbares Zeichen diente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּדִבְרֵיכֶם
  choice: Wie ihr gesagt habt
  rationale: Gibt die Zustimmung zu den von den Kundschaftern ausgesprochenen Bedingungen natürlich und sinngenau wieder; der Plural des Hebräischen ist in der deutschen Wendung mit umfasst.
- source_word: כֵּן הוּא
  choice: so soll es sein
  rationale: Die idiomatische Formel drückt hier Zustimmung aus. Die gewählte Formulierung ist im modernen Deutschen natürlich und bewahrt den bekräftigenden Charakter.
- source_word: וַתְּשַׁלְּחֵם
  choice: Dann ließ sie die Männer gehen
  rationale: שלח kann „senden“ oder „gehen lassen“ bedeuten. Im Zusammenhang beschreibt es, dass Rahab die Kundschafter entließ; „die Männer“ macht den pronominalen Bezug im Deutschen klar.
- source_word: וַיֵּלֵכוּ
  choice: und sie gingen fort
  rationale: Gibt das einfache Bewegungsverb הלך in der erzählerischen Abfolge wieder und vermeidet die im Deutschen störende Wiederholung von „gehen“ ohne Zusatz.
- source_word: וַתִּקְשֹׁר
  choice: Darauf band sie
  rationale: קשר bedeutet „binden, festbinden“. „Darauf“ kennzeichnet die erzählerische Folge, ohne einen über den Kontext hinausgehenden Zeitabstand festzulegen.
- source_word: תִּקְוַת הַשָּׁנִי
  choice: die scharlachrote Schnur
  rationale: תִּקְוָה bezeichnet hier konkret eine Schnur oder Leine, nicht „Hoffnung“; שָׁנִי gibt die scharlachrote Farbe an. „Schnur“ ist anschaulich und im heutigen Deutsch natürlich.
- source_word: בַּחַלּוֹן
  choice: ans Fenster
  rationale: Die Präposition ב bezeichnet hier den Ort der Befestigung. Im Deutschen ist „ans Fenster binden“ idiomatisch; „im Fenster“ bleibt als mögliche räumliche Auffassung in der Fußnote berücksichtigt.
