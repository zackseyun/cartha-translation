  variant: modern standard German
source:
  edition: WLC
  text: וְ/אִם תַּגִּ֖ידִי אֶת דְּבָרֵ֣/נוּ זֶ֑ה וְ/הָיִ֣ינוּ נְקִיִּ֔ם מִ/שְּׁבֻעָתֵ֖/ךְ אֲשֶׁ֥ר הִשְׁבַּעְתָּֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/020.yaml
  text: But if you tell this matter of ours[b][a], then we will be free from your oath that you made us swear.
translation:
  language: de
  text: Wenn du aber diese unsere Sache bekannt machst[a], sind wir frei[b] von dem Eid, den du uns hast schwören lassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „diese unsere Angelegenheit weitererzählst“. Das hebräische Wort kann eine Sache, eine Angelegenheit oder ein gesprochenes Wort bezeichnen; hier bezieht es sich auf die geheime Mission und Abmachung der Kundschafter.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „sind wir schuldlos“ oder „sind wir ohne Schuld“. Die hebräische Wendung bedeutet hier, dass der Eid sie nicht länger bindet, falls Rahab das Geheimnis preisgibt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Wenn du aber
  rationale: Die Verbindung aus Konjunktion und Bedingungspartikel führt eine einschränkende Gegenbedingung ein. Die Nachstellung von „aber“ entspricht natürlichem deutschem Sprachgebrauch.
- source_word: תַּגִּידִי
  choice: bekannt machst
  rationale: Der Hifil von נגד bedeutet „mitteilen, kundtun, bekannt machen“. Im Zusammenhang geht es um das Offenlegen der geheimen Abmachung beziehungsweise Mission.
- source_word: אֶת דְּבָרֵנוּ זֶה
  choice: diese unsere Sache
  rationale: דבר kann „Wort“, „Sache“ oder „Angelegenheit“ bezeichnen. „Diese unsere Sache“ bewahrt sowohl das Demonstrativum als auch den Bezug auf die Kundschafter und lässt die genaue Reichweite des Ausdrucks offen.
- source_word: וְהָיִינוּ נְקִיִּם
  choice: sind wir frei
  rationale: Die Verbindung von היה mit נקי bezeichnet hier das Freisein von einer Verpflichtung oder Haftung. Das deutsche Präsens ist in der Bedingungsfolge idiomatisch und hat Zukunftsbezug.
- source_word: מִשְּׁבֻעָתֵךְ
  choice: von dem Eid
  rationale: Die Präposition מן bezeichnet die Befreiung von der bindenden Kraft des Eides. Im Deutschen wird der Bezug zu Rahab durch den folgenden Relativsatz eindeutig und natürlicher ausgedrückt als mit dem potenziell missverständlichen „deinem Eid“.
- source_word: אֲשֶׁר הִשְׁבַּעְתָּנוּ
  choice: den du uns hast schwören lassen
  rationale: 'Der Hifil von שׁבע hat kausative Bedeutung: Rahab veranlasste beziehungsweise verpflichtete die Männer zum Schwur. „Hast schwören lassen“ gibt dies idiomatisch wieder.'
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. „Diese unsere Sache“ ist bewusst leicht gehoben, aber verständlich und bewahrt die sachliche Mehrdeutigkeit des hebräischen דבר. Die Bedingungsfolge ist im Deutschen knapp und unmittelbar formuliert.
