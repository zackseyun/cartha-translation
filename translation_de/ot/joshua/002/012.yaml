  text: וְ/עַתָּ֗ה הִשָּֽׁבְעוּ נָ֥א לִ/י֙ בַּֽ/יהוָ֔ה כִּי עָשִׂ֥יתִי עִמָּ/כֶ֖ם חָ֑סֶד וַ/עֲשִׂיתֶ֨ם גַּם אַתֶּ֜ם עִם בֵּ֤ית אָבִ/י֙ חֶ֔סֶד וּ/נְתַתֶּ֥ם לִ֖/י א֥וֹת אֱמֶֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/012.yaml
  text: And now[a], please swear to me by Yahweh that, just as I have shown kindness to you, you also will show kindness to my father's house and give me a sure sign,
translation:
  language: de
  text: 'Und nun schwört mir bitte bei Jahwe: Wie ich euch Güte erwiesen habe, so sollt auch ihr dem Haus meines Vaters Güte erweisen und mir ein verlässliches Zeichen[a] geben,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „ein Zeichen der Wahrheit“; sinngemäß: „ein sicheres Zeichen“ oder „ein zuverlässiges Unterpfand“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl die Verknüpfung durch וְ als auch den zeitlich-diskursiven Übergang עַתָּה.
- source_word: הִשָּׁבְעוּ נָא לִי
  choice: schwört mir bitte
  rationale: Der Nifal-Imperativ Plural bezeichnet das Ablegen eines Eides; נָא bringt die dringliche, höfliche Bitte zum Ausdruck.
- source_word: בַּיהוָה
  choice: bei Jahwe
  rationale: Die Präposition bezeichnet den beim Eid angerufenen Namen; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: כִּי
  choice: Weil
  rationale: Leitet hier plausibel die Grundlage für Rahabs erbetene Gegenleistung ein. Die Zeichensetzung mit Doppelpunkt macht den Bezug des gesamten folgenden Satzes auf den Eid deutlich.
- source_word: עָשִׂיתִי עִמָּכֶם חָסֶד
  choice: ich euch Güte erwiesen habe
  rationale: חֶסֶד bezeichnet hier verlässliche, wohlwollende Zuwendung. „Güte erweisen“ ist würdig, verständlich und lässt die weiter reichende Bedeutung des Wortes offen.
- source_word: וַעֲשִׂיתֶם גַּם אַתֶּם
  choice: sollt auch ihr … erweisen
  rationale: Das Qatal mit Waw steht im Wirkungsbereich der Eidbitte und bezeichnet die erwartete künftige Gegenleistung; „sollt“ gibt diesen verpflichtenden Charakter wieder.
- source_word: בֵּית אָבִי
  choice: dem Haus meines Vaters
  rationale: Bewahrt das hebräische Verwandtschafts- und Haushaltsidiom, das im Deutschen verständlich bleibt und mehr als nur die Kernfamilie bezeichnen kann.
- source_word: אוֹת אֱמֶת
  choice: ein verlässliches Zeichen
  rationale: אוֹת ist ein Zeichen oder Unterpfand; אֱמֶת hebt hier dessen Echtheit und Zuverlässigkeit hervor. „Verlässlich“ ist natürliches Deutsch, ohne die Wendung auf nur eine Deutung festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm; „Jahwe“ gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von חֶסֶד
  choice: Güte
  alternative: Treue / loyale Güte
  rationale: Im unmittelbaren Zusammenhang geht es um wohlwollendes, verlässliches Handeln auf Gegenseitigkeit. „Güte“ bewahrt diese Bedeutung, ohne eine ausdrücklich formulierte Bundesbeziehung vorauszusetzen.
- issue: Sinn von כִּי im Eidsatz
  choice: Weil
  alternative: dass / da
  rationale: „Weil“ versteht Rahabs bisheriges Handeln als Grundlage ihrer Bitte. Die Alternative „dass“ könnte stärker den Inhalt des Eides einleiten; der hebräische Anschluss lässt eine gewisse syntaktische Spannung bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt bildet den Übergang von der Aufforderung zum Inhalt beziehungsweise zur Grundlage des verlangten Eides ab. Die Wiederholung von „Güte erweisen“ bewahrt die bewusste Wiederaufnahme von חֶסֶד im Hebräischen. Das abschließende Komma bleibt stehen, weil der Satz im folgenden Vers weitergeführt wird.
