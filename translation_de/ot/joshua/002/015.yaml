source:
  edition: WLC
  text: וַ/תּוֹרִדֵ֥/ם בַּ/חֶ֖בֶל בְּעַ֣ד הַֽ/חַלּ֑וֹן כִּ֤י בֵיתָ/הּ֙ בְּ/קִ֣יר הַֽ/חוֹמָ֔ה וּ/בַֽ/חוֹמָ֖ה הִ֥יא יוֹשָֽׁבֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/015.yaml
  text: Then she let them down by a rope through the window[a], because her house was in the wall of the city, and she was living in the wall.
translation:
  language: de
  text: Da ließ sie die beiden an einem Seil durch das Fenster hinunter, denn ihr Haus lag in der Stadtmauer, und sie wohnte in der Mauer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ihr Haus lag an der Stadtmauer, und sie wohnte auf der Mauer.“ Das Hebräische kann die Lage in, an oder auf der Maueranlage bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתּוֹרִדֵם
  choice: Da ließ sie die beiden … hinunter
  rationale: Der Hifil von ירד bezeichnet das Veranlassen einer Abwärtsbewegung. „hinunterlassen“ ist im Zusammenhang mit einem Seil natürlich; „die beiden“ gibt das pronominale Objekt im Kontext eindeutig wieder.
- source_word: בַּחֶבֶל
  choice: an einem Seil
  rationale: חֶבֶל bedeutet „Seil, Strick“. Die Präposition bezeichnet hier das Mittel; im Deutschen ist „jemanden an einem Seil hinunterlassen“ idiomatisch.
- source_word: בְּעַד הַחַלּוֹן
  choice: durch das Fenster
  rationale: בְּעַד bezeichnet hier die Bewegung durch eine Öffnung. Die schlichte Wiedergabe bewahrt das konkrete Bild.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet die Erklärung dafür ein, wie diese Flucht möglich war. „denn“ fügt sich natürlich in den deutschen Erzählstil.
- source_word: בֵיתָהּ בְּקִיר הַחוֹמָה
  choice: ihr Haus lag in der Stadtmauer
  rationale: Wörtlich steht das Haus „in der Wand/Mauer der Maueranlage“. „Stadtmauer“ vermeidet die im Deutschen unnatürliche Doppelung und lässt die genaue bauliche Einbindung offen.
- source_word: וּבַחוֹמָה הִיא יוֹשָׁבֶת
  choice: und sie wohnte in der Mauer
  rationale: יֹשֶׁבֶת bezeichnet hier ihren fortdauernden Wohnsitz. Die Wiederholung von „in der Mauer“ folgt der betonten hebräischen Aussage, ohne sie architektonisch näher festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt nahe am hebräischen Satzbau, vermeidet jedoch die unnatürliche wörtliche Doppelung „Mauer der Mauer“. Die Fußnote bewahrt die räumliche Mehrdeutigkeit der Präposition בְּ.
