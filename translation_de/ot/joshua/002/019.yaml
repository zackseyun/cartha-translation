  text: וְ/הָיָ֡ה כֹּ֣ל אֲשֶׁר יֵצֵא֩ מִ/דַּלְתֵ֨י בֵיתֵ֧/ךְ הַ/ח֛וּצָ/ה דָּמ֥/וֹ בְ/רֹאשׁ֖/וֹ וַ/אֲנַ֣חְנוּ נְקִיִּ֑ם וְ֠/כֹל אֲשֶׁ֨ר יִֽהְיֶ֤ה אִתָּ/ךְ֙ בַּ/בַּ֔יִת דָּמ֣/וֹ בְ/רֹאשֵׁ֔/נוּ אִם יָ֖ד תִּֽהְיֶה בּֽ/וֹ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/019.yaml
  text: Anyone who goes out through the doors of your house, his blood will be on his own head, and we will be guiltless; but anyone who is with you in the house, his blood will be on our heads[a] if a hand is laid on him.
translation:
  language: de
  text: Wer durch die Türen deines Hauses hinausgeht, dessen Blut soll auf seinem eigenen Haupt liegen, und wir sind frei von Schuld. Wer aber bei dir im Haus ist, dessen Blut soll auf unserem Haupt liegen[a], wenn Hand an ihn gelegt wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Sein Blut soll auf seinem eigenen Haupt liegen“ und „sein Blut soll auf unserem Haupt liegen“ sind Rechtsformeln. Sie weisen die Verantwortung für das vergossene Blut beziehungsweise den Tod zu.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: nicht gesondert wiedergegeben
  rationale: Die Form leitet die nächste Bedingung der Abmachung ein; im Deutschen kann diese ohne zusätzliche Einleitungsformel unmittelbar formuliert werden.
- source_word: כֹּל אֲשֶׁר
  choice: wer
  rationale: Die Verbindung bezeichnet hier distributiv jede einzelne Person; „wer“ ist im Deutschen natürlich und wahrt den allgemeinen Rechtscharakter.
- source_word: יֵצֵא מִדַּלְתֵי בֵיתֵךְ הַחוּצָה
  choice: durch die Türen deines Hauses hinausgeht
  rationale: „Hinausgeht“ gibt die nach außen gerichtete Bewegung wieder; „durch die Türen“ hält den ausdrücklich genannten Ausgang fest.
- source_word: דָּמוֹ בְרֹאשׁוֹ
  choice: dessen Blut komme über sein eigenes Haupt
  rationale: Die Rechtsformel weist dem Betreffenden die Verantwortung für seinen Tod zu. Das Quellbild und die feierliche Parallelstruktur bleiben erhalten.
- source_word: וַאֲנַחְנוּ נְקִיִּם
  choice: und wir sind frei von Schuld
  rationale: נְקִיִּם bezeichnet hier die Freiheit von Schuld beziehungsweise Haftung unter dem Eid; die deutsche Wendung ist klar und rechtlich passend.
- source_word: וְכֹל אֲשֶׁר יִהְיֶה אִתָּךְ בַּבַּיִת
  choice: Wer aber bei dir im Haus ist
  rationale: „Aber“ macht den Gegensatz zwischen dem Verlassen des Hauses und dem geschützten Aufenthalt darin deutlich.
- source_word: דָּמוֹ בְרֹאשֵׁנוּ
  choice: dessen Blut komme über unser Haupt
  rationale: Die parallele Rechtsformel überträgt den Kundschaftern die Verantwortung und bewahrt die rhetorische Entsprechung zum ersten Satz.
- source_word: אִם יָד תִּהְיֶה בּוֹ
  choice: wenn Hand an ihn gelegt wird
  rationale: Die unbestimmte hebräische Wendung bezeichnet einen tätlichen Angriff oder eine Schädigung, ohne den Handelnden zu benennen.
theological_decisions:
- issue: Beibehaltung der Blutverantwortungsformel
  choice: „dessen Blut komme über sein eigenes Haupt / über unser Haupt“ im Haupttext
  alternative: „der ist für seinen Tod selbst verantwortlich / für dessen Tod sind wir verantwortlich“
  rationale: Die bildhafte Rechtsformel trägt den feierlichen, eidähnlichen Charakter der Vereinbarung. Eine rein erklärende Wiedergabe wäre verständlich, würde aber Bild und Parallelismus des Hebräischen verlieren.
- issue: Generisches maskulines Singularpronomen
  choice: „an ihn“
  alternative: Pluralische oder paarige geschlechtsneutrale Formulierung
  rationale: Das Hebräische formuliert distributiv im Singular. Im Kontext umfasst die Regel alle im Haus Anwesenden; das deutsche Pronomen nimmt grammatisch auf das indefinite „wer“ Bezug und schränkt den Personenkreis nicht auf Männer ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrter rechtlicher Bildsprache. Der Konjunktiv „komme“ gibt die feierliche Verantwortungsformel natürlicher wieder als ein missverständliches räumliches Futur. Der Fußnotenmarker [a] steht im Haupttext bei der zweiten, parallelen Formel und erläutert beide Wendungen.
