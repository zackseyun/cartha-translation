base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/014.yaml
  text: The men said to her[a], “Our lives for yours, even to death, if you do not tell this matter of ours. And when Yahweh gives us the land, we will deal with you in covenant faithfulness and truth.”
translation:
  language: de
  text: 'Die Männer sagten zu ihr: »Wir bürgen mit unserem Leben für euer Leben, wenn ihr[a] diese unsere Angelegenheit nicht preisgebt. Wenn Jahwe uns das Land gibt, werden wir dir Güte und Treue[b] erweisen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb steht in der Mehrzahl, obwohl anschließend Rahab in der Einzahl angesprochen wird. Möglicherweise sind Rahab und ihr Hausstand gemeint.
    reason: grammatical_ambiguity
  - marker: b
    text: 'Oder: »loyale Güte und Verlässlichkeit«. Die hebräische Wortverbindung חֶסֶד וֶאֱמֶת bezeichnet zuverlässiges, verbindliches Handeln in einer Beziehung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲנָשִׁים
  choice: die Männer
  rationale: Gibt die schlichte Bezeichnung des Hebräischen wieder; dass es sich um die Kundschafter handelt, ergibt sich aus dem Zusammenhang.
- source_word: נַפְשֵׁנוּ תַחְתֵּיכֶם לָמוּת
  choice: Unser Leben für euer Leben, bis in den Tod
  rationale: נֶפֶשׁ bezeichnet hier das Leben; תַּחַת drückt Stellvertretung beziehungsweise Einsatz für andere aus, und לָמוּת unterstreicht die Todesbereitschaft des feierlichen Versprechens.
- source_word: אִם לֹא תַגִּידוּ אֶת דְּבָרֵנוּ זֶה
  choice: wenn ihr von dieser unserer Sache nichts weitererzählt
  rationale: נגד im Hifil bedeutet mitteilen oder erzählen; דָּבָר bezeichnet hier die Sache beziehungsweise Angelegenheit. „Weitererzählt“ bringt im Deutschen natürlich zum Ausdruck, dass die geheime Abmachung nicht bekannt gemacht werden darf.
- source_word: בְּתֵת יְהוָה לָנוּ אֶת הָאָרֶץ
  choice: Wenn Jahwe uns das Land gibt
  rationale: Die Konstruktion mit בְּ und Infinitiv bezeichnet den Zeitpunkt beziehungsweise Umstand. Das Tetragramm wird als persönlicher Gottesname „Jahwe“ wiedergegeben.
- source_word: וְעָשִׂינוּ עִמָּךְ
  choice: werden wir dir … erweisen
  rationale: Das idiomatische עשה עם wird zusammen mit den folgenden Substantiven natürlich als „jemandem etwas erweisen“ ausgedrückt.
- source_word: חֶסֶד וֶאֱמֶת
  choice: Güte und Treue
  rationale: 'Die beiden Begriffe bleiben unterscheidbar: חֶסֶד bezeichnet loyale, verlässliche Güte, אֱמֶת Wahrheit, Beständigkeit oder Treue. Die knappe deutsche Wortverbindung ist natürlich und bewahrt die relationale Verbindlichkeit.'
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ wahrt den Charakter als persönlichen Bundesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von חֶסֶד וֶאֱמֶת
  choice: Güte und Treue
  alternative: Bundestreue und Wahrheit
  rationale: „Güte und Treue“ ist im modernen Deutschen verständlich und lässt beide hebräischen Begriffe stehen. Die Fußnote weist auf den möglichen bundesbezogenen Sinn hin, ohne ihn im Haupttext als einzig mögliche Deutung festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede behält den feierlichen, eidähnlichen Charakter. Die ungewöhnliche Mehrzahl der Anrede wird im Text bewahrt und erläutert; die theologisch gewichtige Wortverbindung wird verständlich übersetzt, ohne ihren möglichen Bundesbezug zu verengen.
