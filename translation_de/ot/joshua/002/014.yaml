revisions:
- from: 'Die Männer sagten zu ihr: »Unser Leben für euer Leben, bis in den Tod – wenn ihr[a] von dieser unserer Sache nichts weitererzählt. Wenn Jahwe uns das Land gibt, werden wir dir Güte und Treue[b] erweisen.«'
  to: 'Die Männer sagten zu ihr: »Wir bürgen mit unserem Leben für euer Leben, wenn ihr[a] diese unsere Angelegenheit nicht preisgebt. Wenn Jahwe uns das Land gibt, werden wir dir Güte und Treue[b] erweisen.«'
  rationale: Die Lebenspfand-Formel wird als im Deutschen verständliche Bürgschaft wiedergegeben und behält sowohl die stellvertretende Aussage („für euer Leben“) als auch die Todesernsthaftigkeit („mit unserem Leben“) bei. „Preisgeben“ trifft die geforderte Geheimhaltung ohne die zusätzliche Nuance von „weitererzählen“. Die Anmerkung zu חֶסֶד וֶאֱמֶת erläutert die lexikalische Spannweite zurückhaltend und bewahrt die Offenheit des hebräischen Ausdrucks.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T09:39:35Z'
review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung trifft die Hauptaussage insgesamt, doch die Wiedergabe von נַפְשֵׁנוּ תַחְתֵּיכֶם לָמוּת als „Unser Leben für euer Leben, bis in den Tod“ ist im Deutschen semantisch und idiomatisch nicht hinreichend klar. Die hebräische Formel ist ein lebensverpfändendes Einstehen für Rahab und die Ihren. „Weitererzählt“ ist enger als das hebräische „mitteilen/preisgeben“ und legt unnötig ein Weitererzählen nahe.
  naturalness: Die direkte Rede ist überwiegend modernes Standarddeutsch. „Unser Leben für euer Leben, bis in den Tod“ klingt jedoch unnatürlich und lässt offen, wie die Bedingung grammatisch und inhaltlich zuzuordnen ist. „Diese unsere Sache“ ist verständlich, aber „diese unsere Angelegenheit“ ist im gegenwärtigen Deutsch flüssiger.
  terminology: „Jahwe“ gibt יהוה angemessen wieder. „Güte und Treue“ ist für חֶסֶד וֶאֱמֶת eine natürliche, nicht konfessionell verengende Wiedergabe. Die Fußnote kann die alternative Nuance „loyale Güte und Verlässlichkeit“ erläutern, ohne „Bundestreue“ als zwingende Bedeutung festzulegen.
  issues:
  - severity: medium
    issue: Unklare und unidiomatische Wiedergabe der Lebenspfand-Formel
    rationale: „Bis in den Tod“ bildet לָמוּת nicht natürlich ab und schwächt die Aussage ab, dass die Männer mit ihrem Leben für Rahabs Leben einstehen. Eine explizite deutsche Bürgschaftsformulierung gibt die Funktion der hebräischen Schwurformel klarer wieder.
  - severity: low
    issue: „Weitererzählt“ ist zu spezifisch
    rationale: תַּגִּידוּ bedeutet hier mitteilen, bekannt machen oder preisgeben. „Weitererzählen“ setzt stärker voraus, dass die Information bereits empfangen und anschließend weitererzählt wird; „preisgeben“ bewahrt den Sinn ohne diese Zusatznuance.
  - severity: low
    issue: Fußnote b überakzentuiert den Bundesbezug
    rationale: חֶסֶד וֶאֱמֶת kann in verbindlichen Beziehungen loyale und zuverlässige Güte bezeichnen, ist hier aber nicht ausdrücklich als terminus technicus eines Bundes zu erzwingen. Die Anmerkung sollte die mögliche Beziehungs- und Verlässlichkeitsnuance benennen, ohne sie dogmatisch festzulegen.
