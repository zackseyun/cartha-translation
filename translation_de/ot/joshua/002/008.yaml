  text: וְ/הֵ֖מָּה טֶ֣רֶם יִשְׁכָּב֑וּ/ן וְ/הִ֛יא עָלְתָ֥ה עֲלֵי/הֶ֖ם עַל הַ/גָּֽג־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/008.yaml
  text: Before they lay down[a], she went up to them on the roof.
translation:
  language: de
  text: Noch bevor sie sich hinlegten[a], stieg sie zu ihnen aufs Dach hinauf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Noch bevor sie schlafen gingen“. Das hebräische Verb bedeutet wörtlich „sich hinlegen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טֶרֶם
  choice: noch bevor
  rationale: Die temporale Konjunktion bezeichnet eine Handlung, die vor der folgenden eintritt. „Noch bevor“ gibt die zeitliche Unmittelbarkeit im Deutschen natürlich wieder.
- source_word: יִשְׁכָּבוּן
  choice: sie sich hinlegten
  rationale: Das Verb שׁכב bedeutet wörtlich „sich hinlegen“. Im Zusammenhang ist Schlafengehen wahrscheinlich mitgemeint, wird aber nicht ausdrücklich genannt.
- source_word: עָלְתָה
  choice: stieg ... hinauf
  rationale: Das Qal von עלה bezeichnet eine Aufwärtsbewegung. „hinaufsteigen“ ist für den Weg auf ein Flachdach natürlich und präzise.
- source_word: עֲלֵיהֶם
  choice: zu ihnen
  rationale: Die Präposition bezeichnet hier bei einem Bewegungsverb idiomatisch die Bewegung auf die Männer zu; „zu ihnen“ vermeidet das missverständliche wörtliche „auf sie“.
- source_word: עַל הַגָּג
  choice: aufs Dach
  rationale: Mit der Aufwärtsbewegung ist im Deutschen „aufs Dach“ idiomatisch; gemeint ist das begehbare Flachdach als Ziel und anschließender Ort der Begegnung.
- source_word: וְהֵמָּה ... וְהִיא
  choice: sie ... sie
  rationale: Die ausdrücklichen hebräischen Pronomen stellen die Männer und Rahab einander gegenüber. Im Deutschen bleibt dieser Kontrast durch die Abfolge von Nebensatz und Hauptsatz erkennbar.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Stellung „zu ihnen aufs Dach“ hält sowohl das Ziel ihrer Bewegung als auch den Ort der Begegnung klar fest.
