source:
  edition: WLC
  text: וְ/הָ/אֲנָשִׁ֗ים רָדְפ֤וּ אַֽחֲרֵי/הֶם֙ דֶּ֣רֶךְ הַ/יַּרְדֵּ֔ן עַ֖ל הַֽ/מַּעְבְּר֑וֹת וְ/הַ/שַּׁ֣עַר סָגָ֔רוּ אַחֲרֵ֕י כַּ/אֲשֶׁ֛ר יָצְא֥וּ הָ/רֹדְפִ֖ים אַחֲרֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/007.yaml
  text: And the men pursued after them on the way to the Jordan[a], as far as the fords, and they shut the gate behind them as soon as the pursuers had gone out after them.
translation:
  language: de
  text: Und die Männer verfolgten sie auf dem Weg zum Jordan bis zu den Furten[a]. Sobald die Verfolger hinausgegangen waren, um ihnen nachzujagen, schloss man hinter ihnen das Tor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bis zu den Übergangsstellen“; gemeint sind die flachen Stellen des Jordan, an denen man den Fluss überqueren konnte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: Und die Männer
  rationale: Der bestimmte Plural verweist im Zusammenhang auf die zuvor ausgesandten Männer des Königs; die hebräische Erzählungsverknüpfung wird mit „Und“ bewahrt.
- source_word: רָדְפוּ אַחֲרֵיהֶם
  choice: verfolgten sie
  rationale: Im Deutschen ist „jemanden verfolgen“ die natürliche Wiedergabe; ein zusätzliches „hinter ihnen her“ wäre möglich, aber unnötig.
- source_word: דֶּרֶךְ הַיַּרְדֵּן
  choice: auf dem Weg zum Jordan
  rationale: דֶּרֶךְ bezeichnet Weg oder Straße; der Kontext meint die zum Jordan führende Route.
- source_word: עַל הַמַּעְבְּרוֹת
  choice: bis zu den Furten
  rationale: מַעְבָּרוֹת bezeichnet Übergangsstellen, hier die flachen Stellen zur Überquerung des Jordan; עַל wird im Bewegungskontext idiomatisch als „bis zu“ verstanden.
- source_word: וְהַשַּׁעַר סָגָרוּ
  choice: schloss man … das Tor
  rationale: Das ungenannte Subjekt des pluralischen Verbs wird im Deutschen sachgerecht mit unpersönlichem „man“ wiedergegeben; „das Tor“ meint kontextuell das Stadttor, ohne „Stadt“ in den Text einzufügen.
- source_word: אַחֲרֵי
  choice: hinter ihnen
  rationale: Beim Schließen eines Tores bezeichnet אַחֲרֵי idiomatisch, dass das Tor nach dem Hinausgehen der Männer in ihrem Rücken geschlossen wurde.
- source_word: כַּאֲשֶׁר יָצְאוּ
  choice: Sobald … hinausgegangen waren
  rationale: Die temporale Verbindung kann „als/nachdem“ bedeuten; „sobald“ gibt hier die enge zeitliche Abfolge natürlich wieder.
- source_word: הָרֹדְפִים אַחֲרֵיהֶם
  choice: die Verfolger … um ihnen nachzujagen
  rationale: Das substantivierte Partizip wird als „die Verfolger“ wiedergegeben. Die zweite Verfolgungsangabe bleibt sichtbar, ohne im Deutschen schwerfällig zu wirken.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Die Wiederholung des Verfolgungsmotivs bleibt erhalten; das im Hebräischen nicht ausdrücklich genannte Subjekt beim Schließen des Tores wird nicht als bestimmte Personengruppe ergänzt.
