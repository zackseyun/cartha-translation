  source_fidelity: 'Der Text gibt die hebräische Satzfolge und die wesentlichen Bezüge zuverlässig wieder: Die Männer verfolgen die Kundschafter auf der Route zum Jordan bis zu den Furten; nach dem Hinausgehen der Verfolger wird das Tor geschlossen. Das ungenannte pluralische Subjekt bei „schlossen sie“ wird mit deutschem unpersönlichem „man“ angemessen wiedergegeben. „Sobald“ ist als kontextuell mögliche zeitliche Präzisierung von כַּאֲשֶׁר vertretbar und entspricht der englischen Auditentscheidung.'
  naturalness: Modernes, klares Standarddeutsch mit angemessen erzählerischem Register. „auf dem Weg zum Jordan“, „bis zu den Furten“ und „schloss man hinter ihnen das Tor“ sind idiomatisch. Die Wiederaufnahme durch „die Verfolger“ erhält die hebräische Verfolgungssemantik, ohne die deutsche Syntax zu überladen.
  terminology: „Jordan“, „Furten“, „Tor“ und „Verfolger“ sind treffend. Die Fußnote bietet die lexikalische Alternative „Übergangsstellen“ und erläutert „Furten“ sachlich. „um ihnen nachzujagen“ macht den im Hebräischen erneut ausgedrückten Verfolgungsbezug natürlich sichtbar, ohne einen unzulässigen inhaltlichen Zusatz einzuführen.
