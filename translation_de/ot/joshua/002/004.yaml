  yaml_path: translation/ot/joshua/002/004.yaml
  text: But the woman had taken the two men and hidden them[a], and she said, “Yes, the men came to me, but I did not know where they were from.”
translation:
  language: de
  text: 'Die Frau aber hatte die beiden Männer genommen und sie versteckt[a]. Sie sagte: »Ja, die Männer sind zu mir gekommen, aber ich wusste nicht, woher sie waren.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen steht ein singularisches Suffix: »und versteckte ihn«. Der Zusammenhang bezieht sich jedoch auf die beiden Männer als Gruppe; daher die Wiedergabe »sie versteckt«.'
    reason: textual_variant
lexical_decisions:
- source_word: וַתִּקַּח
  choice: hatte … genommen
  rationale: Das Plusquamperfekt gibt die Handlung als bereits vor ihrer Antwort erfolgt wieder und sorgt im Deutschen für eine klare zeitliche Abfolge.
- source_word: הָאִשָּׁה
  choice: die Frau
  rationale: Gemeint ist Rahab als weibliche Person, nicht als Ehefrau.
- source_word: שְׁנֵי הָאֲנָשִׁים
  choice: die beiden Männer
  rationale: Die Wendung bezeichnet die zwei männlichen israelitischen Kundschafter; »die beiden Männer« ist natürliches modernes Deutsch.
- source_word: וַתִּצְפְּנוֹ
  choice: versteckt
  rationale: Obwohl der masoretische Text ein singularisches Objektsuffix hat, bezieht sich der Zusammenhang auf beide Männer. Im Deutschen ist das Objekt durch »die beiden Männer« klar erkennbar.
- source_word: וַתֹּאמֶר
  choice: Sie sagte
  rationale: Dies ist die schlichte und natürliche Wiedergabe der üblichen hebräischen Redeeinleitung.
- source_word: כֵּן
  choice: Ja
  rationale: Das Wort bestätigt hier unmittelbar, dass die Männer zu ihr gekommen waren.
- source_word: בָּאוּ אֵלַי הָאֲנָשִׁים
  choice: die Männer sind zu mir gekommen
  rationale: Das Perfekt ist in moderner deutscher Rede idiomatisch und gibt den vollzogenen Besuch wieder.
- source_word: וְלֹא יָדַעְתִּי
  choice: aber ich wusste nicht
  rationale: »Aber« bringt den inhaltlichen Gegensatz zwischen dem Eingeständnis ihres Kommens und der behaupteten Unkenntnis ihrer Herkunft natürlich zum Ausdruck.
- source_word: מֵאַיִן הֵמָּה
  choice: woher sie waren
  rationale: Die Wendung fragt nach Herkunft oder Ursprung; diese Wiedergabe bleibt nahe am Hebräischen und ist im Deutschen verständlich.
