  text: הִנֵּ֛ה אֲנַ֥חְנוּ בָאִ֖ים בָּ/אָ֑רֶץ אֶת תִּקְוַ֡ת חוּט֩ הַ/שָּׁנִ֨י הַ/זֶּ֜ה תִּקְשְׁרִ֗י בַּֽ/חַלּוֹן֙ אֲשֶׁ֣ר הוֹרַדְתֵּ֣/נוּ ב֔/וֹ וְ/אֶת אָבִ֨י/ךְ וְ/אֶת אִמֵּ֜/ךְ וְ/אֶת אַחַ֗יִ/ךְ וְ/אֵת֙ כָּל בֵּ֣ית אָבִ֔י/ךְ תַּאַסְפִ֥י אֵלַ֖יִ/ךְ הַ/בָּֽיְתָ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/018.yaml
  text: Look[a], when we come into the land, you shall tie this scarlet cord in the window through which you let us down, and you shall gather into your house your father, your mother, your brothers, and all your father's household.
translation:
  language: de
  text: Sieh, wenn wir in das Land kommen, sollst du diese scharlachrote Schnur[a] an das Fenster binden, durch das du uns hinabgelassen hast. Deinen Vater, deine Mutter, deine Brüder und alle aus der Familie deines Vaters sollst du bei dir im Haus versammeln.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „diese Schnur aus scharlachrotem Faden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh
  rationale: Die Aufmerksamkeitspartikel wird knapp und unmittelbar wiedergegeben. „Sieh“ bewahrt ihre hinweisende Kraft, ohne das altertümlichere „Siehe“ zu verwenden.
- source_word: בָאִים בָּאָרֶץ
  choice: wenn wir in das Land kommen
  rationale: Das Partizip bezeichnet im Zusammenhang den bevorstehenden Eintritt ins Land; der deutsche Konditionalsatz gibt die zeitliche Bedingung natürlich wieder.
- source_word: תִּקְוַת חוּט הַשָּׁנִי הַזֶּה
  choice: diese scharlachrote Schnur
  rationale: Die Wendung bezeichnet die als Erkennungszeichen dienende Schnur. Die kürzere deutsche Form ist idiomatisch; die ungewöhnliche wörtlichere Struktur bleibt in der Fußnote erhalten.
- source_word: תִּקְשְׁרִי
  choice: sollst du … binden
  rationale: Das feminine Imperfekt hat hier anweisenden Charakter. „Sollst“ bewahrt den verbindlichen Ton der Abmachung.
- source_word: בַּחַלּוֹן אֲשֶׁר הוֹרַדְתֵּנוּ בוֹ
  choice: an das Fenster … durch das du uns hinabgelassen hast
  rationale: Das Hifil von ירד bedeutet, jemanden hinabzulassen. Im Deutschen bindet man eine Schnur natürlicherweise „an“ ein Fenster; „durch das“ bezeichnet den Weg des Hinablassens.
- source_word: תַּאַסְפִי אֵלַיִךְ הַבָּיְתָה
  choice: sollst du bei dir im Haus versammeln
  rationale: Die Formulierung bringt sowohl das Zusammenführen zu Rahab als auch den Schutzort im Haus zum Ausdruck.
- source_word: אָבִיךְ … אִמֵּךְ … אַחַיִךְ
  choice: deinen Vater, deine Mutter, deine Brüder
  rationale: Die konkreten Verwandtschaftsbezeichnungen werden direkt und geschlechtsgenau wiedergegeben.
- source_word: כָּל בֵּית אָבִיךְ
  choice: alle aus der Familie deines Vaters
  rationale: בֵּית אָב bezeichnet hier den familiären Verband und nicht das Gebäude. Die gewählte Formulierung macht diesen sozialen Sinn in heutigem Deutsch deutlich.
