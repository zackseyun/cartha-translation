source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח יְהוֹשֻׁ֣עַ בִּן נ֠וּן מִֽן הַ/שִּׁטִּ֞ים שְׁנַֽיִם אֲנָשִׁ֤ים מְרַגְּלִים֙ חֶ֣רֶשׁ לֵ/אמֹ֔ר לְכ֛וּ רְא֥וּ אֶת הָ/אָ֖רֶץ וְ/אֶת יְרִיח֑וֹ וַ/יֵּ֨לְכ֜וּ וַ֠/יָּבֹאוּ בֵּית אִשָּׁ֥ה זוֹנָ֛ה וּ/שְׁמָ֥/הּ רָחָ֖ב וַ/יִּשְׁכְּבוּ שָֽׁמָּ/ה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/001.yaml
  text: Then Joshua son of Nun sent two men secretly from Shittim as spies[a], saying, “Go, see the land and Jericho.” So they went and came to the house of a prostitute whose name was Rahab[c][b], and they lay down there.
translation:
  language: de
  text: 'Josua, der Sohn Nuns, sandte heimlich zwei Männer als Kundschafter von Schittim aus. Er sagte: »Geht und seht euch das Land und Jericho an!« Da gingen sie und kamen in das Haus einer Prostituierten[a] namens Rahab. Dort legten sie sich nieder.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Manche geben das hebräische Wort hier mit »Wirtin« wieder; gewöhnlich bedeutet es jedoch »Prostituierte«.
    reason: alternative_reading
  - marker: b
    text: 'Oder: »Dort übernachteten sie.« Wörtlich: »Dort legten sie sich nieder.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַשִּׁטִּים
  choice: von Schittim aus
  rationale: Der Ortsname wird entsprechend dem hebräischen Eigennamen transliteriert; die Wendung gibt den Ausgangspunkt natürlich wieder.
- source_word: מְרַגְּלִים חֶרֶשׁ
  choice: heimlich zwei Männer als Kundschafter
  rationale: מְרַגְּלִים bezeichnet ihre Erkundungsfunktion, חֶרֶשׁ die geheime Durchführung. »Kundschafter« ist im militärischen Erzählzusammenhang natürlich und enthält den Spionageaspekt.
- source_word: לְכוּ רְאוּ אֶת הָאָרֶץ וְאֶת יְרִיחוֹ
  choice: Geht und seht euch das Land und Jericho an
  rationale: Die koordinierende Formulierung mit »und« bleibt erhalten, ohne Jericho ausdrücklich als bloße Erläuterung oder besonderen Schwerpunkt des Landes auszulegen.
- source_word: בֵּית אִשָּׁה זוֹנָה
  choice: das Haus einer Prostituierten
  rationale: זוֹנָה bedeutet gewöhnlich »Prostituierte«; »Wirtin« wäre eine kontextuelle, lexikalisch schwächere Umdeutung.
- source_word: וּשְׁמָהּ רָחָב
  choice: namens Rahab
  rationale: Diese knappe deutsche Konstruktion gibt die Identifizierung »und ihr Name war Rahab« vollständig und natürlich wieder.
- source_word: וַיִּשְׁכְּבוּ שָׁמָּה
  choice: Dort legten sie sich nieder
  rationale: Die Formulierung bewahrt die Grundbedeutung von שׁכב und legt weder sexuelle Aktivität noch ausdrücklich eine förmliche Übernachtung fest.
theological_decisions:
- issue: Rahabs Tätigkeit (זוֹנָה)
  choice: Prostituierte
  alternative: Wirtin
  rationale: Die gewöhnliche lexikalische Bedeutung wird beibehalten; eine moralisch abschwächende Umdeutung wird nicht in den Haupttext übernommen.
- issue: Bedeutung von וַיִּשְׁכְּבוּ שָׁמָּה
  choice: Dort legten sie sich nieder
  alternative: Dort übernachteten sie
  rationale: Die wörtlichere Wiedergabe bewahrt die erzählerische Offenheit und vermeidet sowohl eine sexuelle Andeutung als auch eine unnötige Präzisierung als Beherbergung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Erzählfolge wird in natürlicher deutscher Syntax wiedergegeben; unnötig altertümliche Ausdrücke werden vermieden. Die doppelte Zielangabe »das Land und Jericho« bleibt wegen der möglichen rhetorischen Hervorhebung bewusst unaufgelöst.
