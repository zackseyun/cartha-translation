base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/022.yaml
  text: So they went and came to the hill country[a], and stayed there three days, until the pursuers returned. The pursuers searched all along the road, but did not find them.
translation:
  language: de
  text: So gingen sie fort und kamen ins Bergland[a]. Dort blieben sie drei Tage, bis die Verfolger zurückkehrten. Die Verfolger suchten den ganzen Weg ab, fanden sie aber nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf den Berg“ oder „in die Berge“. Gemeint ist wahrscheinlich das Bergland westlich von Jericho und nicht ein einzelner Gipfel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ וַיָּבֹאוּ
  choice: So gingen sie fort und kamen
  rationale: Die beiden aufeinanderfolgenden Erzählformen werden als Bewegungsfolge wiedergegeben. „Gingen fort“ klingt im Deutschen natürlicher als das wörtlichere „gingen“, ohne die Aussage zu erweitern.
- source_word: הָהָרָה
  choice: ins Bergland
  rationale: Das lokale He bezeichnet die Richtung. Der Singular הַר kann hier die westlich von Jericho gelegene Bergregion meinen; „Bergland“ passt zum Gelände und wahrt mit einer Fußnote die mögliche singularische Deutung.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: Dort blieben sie
  rationale: ישׁב bezeichnet hier einen vorübergehenden Aufenthalt, nicht dauerhaftes Wohnen oder Siedeln.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: drei Tage
  rationale: Direkte und natürliche Wiedergabe der Zeitangabe.
- source_word: עַד שָׁבוּ הָרֹדְפִים
  choice: bis die Verfolger zurückgekehrt waren
  rationale: שׁוב bedeutet „zurückkehren“, und das Partizip רֹדְפִים wird substantivisch als „Verfolger“ gebraucht. Das Plusquamperfekt verdeutlicht im Deutschen, dass ihre Rückkehr den Endpunkt des dreitägigen Wartens bildet und nach ihrer erfolglosen Suche erfolgte.
- source_word: וַיְבַקְשׁוּ הָרֹדְפִים בְּכָל הַדֶּרֶךְ
  choice: Die Verfolger hatten den ganzen Weg abgesucht
  rationale: בקשׁ bezeichnet im Zusammenhang einer Verfolgung das Suchen. „Den ganzen Weg absuchen“ gibt die umfassende Suche entlang der Route idiomatisch wieder; das Plusquamperfekt bildet die sachliche Vorzeitigkeit gegenüber ihrer Rückkehr ab.
- source_word: וְלֹא מָצָאוּ
  choice: sie aber nicht gefunden
  rationale: Das im Hebräischen unausgedrückte Objekt ergibt sich eindeutig aus dem Zusammenhang und wird im Deutschen ergänzt. „Aber“ macht den kontextuellen Gegensatz zwischen Suche und Ergebnis natürlich hörbar.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit flüssiger Erzählfolge. Die knappe Wiederholung von „die Verfolger“ bleibt erhalten. Die zeitliche Abfolge wird durch das Plusquamperfekt natürlich verdeutlicht, ohne zusätzliche Handlung einzuführen.
