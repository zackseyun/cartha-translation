base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/002.yaml
  text: And it was said to the king of Jericho[a], “Look, men have come here tonight from the Israelites to search out the land.”
translation:
  language: de
  text: 'Da wurde dem König von Jericho gemeldet: „Sieh, heute Nacht sind Männer von den Israeliten hierhergekommen, um das Land auszukundschaften[a].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Land zu erforschen“. Das hebräische Verb bezeichnet ein suchendes, eingehendes Untersuchen und meint hier eine Erkundung des Landes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָמַר
  choice: Da wurde … gemeldet
  rationale: Die unpersönliche Form bewahrt den nicht genannten Sprecher; „gemeldet“ gibt in diesem erzählerischen Zusammenhang die Übermittlung einer Nachricht natürlicher wieder als das wörtliche „gesagt“.
- source_word: לְמֶלֶךְ יְרִיחוֹ
  choice: dem König von Jericho
  rationale: Die Formulierung gibt Titel und Zugehörigkeit klar und idiomatisch wieder.
- source_word: לֵאמֹר
  choice: Doppelpunkt und direkte Rede
  rationale: Der Infinitiv leitet die folgende wörtliche Rede ein und wird im Deutschen am natürlichsten durch Zeichensetzung wiedergegeben.
- source_word: הִנֵּה
  choice: Sieh
  rationale: Das Wort lenkt nachdrücklich die Aufmerksamkeit auf die dringliche Nachricht, ohne archaisch zu klingen.
- source_word: אֲנָשִׁים
  choice: Männer
  rationale: Gemeint sind hier männliche Personen, nicht allgemein Menschen oder eine gemischte Gruppe.
- source_word: בָּאוּ הֵנָּה
  choice: sind … hierhergekommen
  rationale: Das Perfekt bezeichnet eine vollzogene Ankunft mit unmittelbarer Bedeutung für die gegenwärtige Lage; „hierher“ bewahrt die deiktische Perspektive.
- source_word: הַלַּיְלָה
  choice: heute Nacht
  rationale: Die Wendung bezeichnet die Nacht, in der die Meldung erfolgt, und wird so in modernem Deutsch idiomatisch ausgedrückt.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: von den Israeliten
  rationale: Die Wendung bezeichnet die Zugehörigkeit der Männer zum Volk Israel, ohne die hebräische Formulierung „Söhne Israels“ unnötig wörtlich nachzubilden.
- source_word: לַחְפֹּר
  choice: auszukundschaften
  rationale: Das Verb kann ein gründliches Erforschen oder Untersuchen bezeichnen und meint hier im Zusammenhang eine Erkundung des Landes.
- source_word: אֶת הָאָרֶץ
  choice: das Land
  rationale: Die schlichte Wiedergabe entspricht dem hebräischen Ausdruck und lässt die nähere territoriale Bestimmung aus dem Kontext hervorgehen.
