  text: וַ/יֹּאמְרוּ֙ אֶל יְהוֹשֻׁ֔עַ כִּֽי נָתַ֧ן יְהוָ֛ה בְּ/יָדֵ֖/נוּ אֶת כָּל הָ/אָ֑רֶץ וְ/גַם נָמֹ֛גוּ כָּל יֹשְׁבֵ֥י הָ/אָ֖רֶץ מִ/פָּנֵֽי/נוּ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/024.yaml
  text: And they said to Joshua, “Surely the LORD has given all the land into our hands, and indeed all the inhabitants of the land have melted away before us.”
translation:
  language: de
  text: 'Und sie sagten zu Josua: »Gewiss, der HERR hat uns das ganze Land in die Hand gegeben, und alle Bewohner des Landes sind vor uns verzagt.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: nicht eigens wiedergegeben
  rationale: Hier leitet die Partikel den Inhalt der Aussage ein und kann zugleich bekräftigend wirken. Die Gewissheit kommt im Deutschen bereits durch die bestimmte Aussage zum Ausdruck; »gewiss« wäre möglich, aber stärker explizierend.
- source_word: נָתַן ... בְּיָדֵנוּ
  choice: hat ... in unsere Hand gegeben
  rationale: Die hebräische Herrschafts- und Siegesmetapher bleibt in verständlichem Deutsch erhalten.
- source_word: נָמֹגוּ
  choice: sind ... verzagt
  rationale: Wörtlich bezeichnet das Verb ein Zerschmelzen; im Kontext beschreibt es den Verlust von Mut und Widerstandskraft. »Verzagt« gibt die idiomatische Bedeutung natürlich wieder.
- source_word: מִפָּנֵינוּ
  choice: vor uns
  rationale: Bewahrt die knappe räumlich-kausale Wendung des Hebräischen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: der HERR
  alternative: JHWH / Jahwe
  rationale: Die traditionelle deutsche Wiedergabe mit Kapitälchen kennzeichnet den Gottesnamen, ohne eine unsichere Aussprache festzulegen.
- issue: Aussage über die Übergabe des Landes
  choice: vollendetes »hat ... gegeben«
  alternative: »wird ... geben«
  rationale: Das hebräische Perfekt stellt die Übergabe aus Sicht der Kundschafter als bereits gewiss beziehungsweise vollzogen dar; die Spannung zur noch ausstehenden Einnahme bleibt bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und zuversichtlich; die hebräische Metapher »in unsere Hand« wird bewahrt, während נָמֹגוּ idiomatisch mit »verzagt« wiedergegeben wird.
