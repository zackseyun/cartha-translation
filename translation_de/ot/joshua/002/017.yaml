  text: And the men said to her[a], “We will be free from this oath of yours that you made us swear.”
translation:
  language: de
  text: 'Und die Männer sagten zu ihr: „Wir werden von diesem Eid, den du uns hast schwören lassen, frei sein.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Wir sind frei von diesem Eid, den du uns hast schwören lassen.“ Das hebräische Adjektiv kann in einem rechtlichen oder eidbezogenen Zusammenhang bedeuten, von Haftung oder Verpflichtung frei zu sein.'
    reason: lexikalische und zeitliche Alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Und … sagten
  rationale: Das Wayyiqtol führt die Erzählung weiter; „Und … sagten“ wahrt den hebräischen Erzählfluss in natürlichem Deutsch.
- source_word: אֵלֶיהָ
  choice: zu ihr
  rationale: Die Präposition אֶל mit Suffix der 3. Person Feminin Singular bezeichnet hier die Richtung der Rede auf Rahab hin.
- source_word: הָאֲנָשִׁים
  choice: die Männer
  rationale: Der hebräische Text nennt sie schlicht „die Männer“. Ihre aus dem Zusammenhang bekannte Rolle als Kundschafter wird nicht in den Vers hineingetragen.
- source_word: נְקִיִּם
  choice: frei sein
  rationale: נָקִי bezeichnet in einem rechtlichen oder eidbezogenen Zusammenhang das Freisein von Haftung beziehungsweise Verpflichtung. Die deutsche Wendung gibt diesen Sinn klar wieder, ohne vor allem moralische Unschuld anzudeuten.
- source_word: אֲנַחְנוּ
  choice: wir
  rationale: Das ausdrücklich gesetzte Personalpronomen wird beibehalten und trägt den Nachdruck der Aussage.
- source_word: מִשְּׁבֻעָתֵךְ הַזֶּה
  choice: von diesem Eid
  rationale: מִן bezeichnet die Befreiung von der durch den Eid begründeten Verpflichtung; הַזֶּה wird mit „diesem“ wiedergegeben. Der Bezug auf Rahab wird im anschließenden Relativsatz natürlich ausgedrückt.
- source_word: אֲשֶׁר הִשְׁבַּעְתָּנוּ
  choice: den du uns hast schwören lassen
  rationale: 'Der Hifil von שׁבע ist kausativ: Rahab hat die Männer zum Schwören veranlasst. Die Formulierung bewahrt sowohl diese Kausalität als auch das Objektsuffix „uns“.'
theological_decisions:
- issue: Zeitbezug der verblosen Nominalaussage נְקִיִּם אֲנַחְנוּ
  choice: „wir werden … frei sein“
  alternative: „wir sind … frei“
  rationale: Im Zusammenhang kündigen die Männer die Bedingungen an, unter denen sie künftig nicht mehr an den Eid gebunden wären. Das Futur macht diesen kontextuellen Zeitbezug im Deutschen verständlich, während die Fußnote die formal offenere hebräische Aussage bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wortwahl bleibt rechtlich klar, vermeidet unnötig altertümliche Ausdrücke und bezeichnet die Männer nicht genauer als der hebräische Vers.
