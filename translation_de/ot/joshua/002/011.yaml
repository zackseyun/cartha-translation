id: JOS.2.11
reference: Joshua 2:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/נִּשְׁמַע֙ וַ/יִּמַּ֣ס לְבָבֵ֔/נוּ וְ/לֹא קָ֨מָה ע֥וֹד ר֛וּחַ בְּ/אִ֖ישׁ מִ/פְּנֵי/כֶ֑ם כִּ֚י יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם ה֤וּא אֱלֹהִים֙ בַּ/שָּׁמַ֣יִם מִ/מַּ֔עַל וְ/עַל הָ/אָ֖רֶץ מִ/תָּֽחַת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/011.yaml
  text: When we heard it[a], our hearts melted, and no spirit remained in any man because of you, for Yahweh your God[b], he is God in the heavens above and on the earth below.
translation:
  language: de
  text: Als wir das hörten, schmolz uns das Herz, und euretwegen hatte niemand mehr Mut.[a] Denn Jahwe, euer Gott,[b] ist Gott oben im Himmel und unten auf der Erde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „In keinem Menschen erhob sich noch Geist.“ Gemeint ist, dass niemand mehr Mut hatte.'
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen steht hier der Gottesname JHWH.
    reason: cultural_note
lexical_decisions:
- source_word: וַנִּשְׁמַע
  choice: Als wir das hörten
  rationale: Die Form führt die Erzählung weiter und leitet zugleich die Reaktion auf den zuvor berichteten Vorgang ein. Das Objekt „das“ ergibt sich aus dem Kontext.
- source_word: וַיִּמַּס לְבָבֵנוּ
  choice: schmolz uns das Herz
  rationale: Die deutsche Formulierung bewahrt das hebräische Bild vom schmelzenden Herzen und bezeichnet Angst sowie den Verlust des Mutes.
- source_word: וְלֹא קָמָה עוֹד רוּחַ בְּאִישׁ
  choice: hatte niemand mehr Mut
  rationale: רוּחַ bezeichnet hier den inneren Mut oder Lebensgeist. Die idiomatische Wiedergabe vermittelt den Sinn klar; die wörtlichere Bildsprache wird in der Fußnote genannt.
- source_word: מִפְּנֵיכֶם
  choice: euretwegen
  rationale: Die Wendung bedeutet in diesem Zusammenhang, dass die Israeliten der Anlass für die Furcht der Bewohner des Landes waren.
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion führt den Grund für die zuvor geschilderte Furcht an.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen gebräuchliche Umschrift gibt den im hebräischen Text stehenden Gottesnamen JHWH als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: הוּא אֱלֹהִים
  choice: ist Gott
  rationale: Die knappe Aussage des Hebräischen wird ohne ergänzende Wörter wie „allein“ oder „der wahre“ wiedergegeben.
- source_word: בַּשָּׁמַיִם מִמַּעַל וְעַל הָאָרֶץ מִתָּחַת
  choice: oben im Himmel und unten auf der Erde
  rationale: Die natürliche deutsche Form bewahrt den umfassenden Gegensatz zwischen Himmel und Erde sowie zwischen oben und unten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich den Gottesnamen JHWH. „Jahwe“ wahrt dessen Namenscharakter; eine Fußnote erläutert die hebräische Form.
- issue: Tragweite von Rahabs Bekenntnis
  choice: ist Gott oben im Himmel und unten auf der Erde
  alternative: ist allein der wahre Gott oben im Himmel und unten auf der Erde
  rationale: Die Übersetzung bewahrt die starke Aussage über Gottes universale Gottheit und Herrschaft, fügt aber kein im Satz nicht ausdrücklich vorhandenes „allein“ oder „wahr“ hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Bild vom schmelzenden Herzen bleibt erhalten; die zweite hebräische Wendung wird im Haupttext verständlich idiomatisch und in der Fußnote wörtlicher wiedergegeben.
