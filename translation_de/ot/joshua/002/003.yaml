source:
  edition: WLC
  text: וַ/יִּשְׁלַח֙ מֶ֣לֶךְ יְרִיח֔וֹ אֶל רָחָ֖ב לֵ/אמֹ֑ר ה֠וֹצִיאִי הָ/אֲנָשִׁ֨ים הַ/בָּאִ֤ים אֵלַ֨יִ/ךְ֙ אֲשֶׁר בָּ֣אוּ לְ/בֵיתֵ֔/ךְ כִּ֛י לַ/חְפֹּ֥ר אֶת כָּל הָ/אָ֖רֶץ בָּֽאוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/003.yaml
  text: So the king of Jericho sent to Rahab[a], saying, “Bring out the men who came to you, who entered your house, for they have come to search out all the land.”
translation:
  language: de
  text: 'Da schickte der König von Jericho zu Rahab und ließ ihr sagen: „Bring die Männer heraus, die zu dir gekommen sind und zu deinem Haus gekommen sind! Denn sie sind gekommen, um das ganze Land auszuforschen[a].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „auszukundschaften“. Das hebräische Verb kann in diesem Zusammenhang das heimliche oder strategische Erkunden eines Landes bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Da schickte
  rationale: Das Verb שׁלח bezeichnet hier schlicht das Senden; „Da“ bindet die fortlaufende hebräische Erzählung natürlich an den Kontext an.
- source_word: מֶלֶךְ יְרִיחוֹ
  choice: der König von Jericho
  rationale: Die hebräische Status-constructus-Verbindung wird im Deutschen natürlich mit „von“ wiedergegeben; die Bestimmtheit ergibt sich aus dem Kontext.
- source_word: אֶל רָחָב לֵאמֹר
  choice: zu Rahab und ließ ihr sagen
  rationale: אֶל bezeichnet die Empfängerin, und לֵאמֹר führt die direkte Rede ein. Die gewählte Formulierung ist idiomatisches modernes Deutsch, ohne den Inhalt der Botschaft zu erweitern.
- source_word: הוֹצִיאִי
  choice: Bring ... heraus
  rationale: Der Hifil-Imperativ von יצא fordert Rahab auf, die Männer herauskommen zu lassen beziehungsweise herauszubringen; „Bring ... heraus“ bewahrt die direkte Befehlsform.
- source_word: הָאֲנָשִׁים
  choice: die Männer
  rationale: אֲנָשִׁים bezeichnet hier konkret die beiden männlichen Kundschafter.
- source_word: הַבָּאִים אֵלַיִךְ
  choice: die zu dir gekommen
  rationale: Das attributive Partizip wird angesichts der bereits erfolgten Ankunft als Relativsatz mit Vergangenheitsbezug wiedergegeben.
- source_word: אֲשֶׁר בָּאוּ לְבֵיתֵךְ
  choice: und in dein Haus gegangen sind
  rationale: בוא mit לְ bezeichnet das Hineingehen beziehungsweise Gelangen zum Haus. „In dein Haus gegangen“ vermeidet eine unbeabsichtigte Auflösung darüber, wie genau sie aufgenommen wurden.
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion leitet die Begründung für den königlichen Befehl ein.
- source_word: לַחְפֹּר
  choice: auszuforschen
  rationale: חפר bezeichnet hier ein gründliches Erkunden oder Untersuchen des Landes. „Ausforschen“ wahrt diesen Sinn, ohne die militärische Nuance im Haupttext stärker als nötig festzulegen.
- source_word: אֶת כָּל הָאָרֶץ
  choice: das ganze Land
  rationale: הָאָרֶץ meint im Zusammenhang das betreffende Land beziehungsweise Gebiet, nicht die gesamte Erde.
- source_word: בָּאוּ
  choice: sie sind gekommen
  rationale: Das deutsche Perfekt bringt die gegenwärtige Relevanz ihrer Ankunft für Anschuldigung und Befehl natürlich zum Ausdruck.
theological_decisions: []
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch mit direkter, klarer Rede. Die Wiederholung von בוא wird differenziert, aber nicht beseitigt: zuerst „zu dir gekommen“, dann „in dein Haus gegangen“. Die echte Bedeutungsbreite von חפר zwischen gründlichem Ausforschen und strategischem Auskundschaften bleibt durch die Fußnote sichtbar.'
