  text: וַ/תֹּ֤אמֶר לָ/הֶם֙ הָ/הָ֣רָ/ה לֵּ֔כוּ פֶּֽן יִפְגְּע֥וּ בָ/כֶ֖ם הָ/רֹדְפִ֑ים וְ/נַחְבֵּתֶ֨ם שָׁ֜מָּ/ה שְׁלֹ֣שֶׁת יָמִ֗ים עַ֚ד שׁ֣וֹב הָ/רֹֽדְפִ֔ים וְ/אַחַ֖ר תֵּלְכ֥וּ לְ/דַרְכְּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/016.yaml
  text: And she said to them[a], "Go to the hill country, lest the pursuers encounter you, and hide yourselves there three days, until the pursuers return[b]. Afterward you may go on your way."
translation:
  language: de
  text: 'Und sie sagte zu ihnen: »Geht ins Bergland[a], damit die Verfolger nicht auf euch stoßen[b], und haltet euch dort drei Tage lang verborgen, bis die Verfolger zurückgekehrt sind. Danach könnt ihr eures Weges ziehen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »auf den Berg«. Das hebräische Wort kann einen bestimmten Berg oder das umliegende Bergland bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »euch begegnen« beziehungsweise »auf euch treffen«. Das Verb bezeichnet ein Zusammentreffen; im Zusammenhang der Verfolgung ist dabei eine feindliche Begegnung gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָהָרָה
  choice: ins Bergland
  rationale: הַר kann sowohl einen einzelnen Berg als auch eine bergige Gegend bezeichnen. Im Zusammenhang mit dem Versteck der Kundschafter gibt »Bergland« den regionalen Sinn natürlich wieder, ohne die mögliche Einzahlbedeutung zu verschweigen.
- source_word: לֵּכוּ
  choice: Geht
  rationale: Der Imperativ von הלך bedeutet hier schlicht und dringlich »geht«.
- source_word: פֶּן
  choice: damit ... nicht
  rationale: פֶּן leitet eine negative Absichts- oder Vorsichtsklausel ein. »Damit ... nicht« ist im modernen Deutschen natürlich und bewahrt den warnenden Sinn.
- source_word: יִפְגְּעוּ בָכֶם
  choice: auf euch stoßen
  rationale: פגע mit ב bezeichnet ein Treffen oder Zusammentreffen. »Auf euch stoßen« passt zur unbeabsichtigten Begegnung aus Sicht der Verfolger und lässt den durch den Verfolgungskontext gegebenen feindlichen Ausgang offen.
- source_word: הָרֹדְפִים
  choice: die Verfolger
  rationale: Das substantivisch gebrauchte Partizip von רדף bezeichnet diejenigen, die den Kundschaftern nachsetzen.
- source_word: וְנַחְבֵּתֶם
  choice: haltet euch ... verborgen
  rationale: Die Nifalform fordert die Männer dazu auf, sich selbst zu verbergen. Die Formulierung ist idiomatisch und gibt zugleich den anhaltenden Zustand während der drei Tage wieder.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: drei Tage lang
  rationale: Der Akkusativ bezeichnet die Dauer; »drei Tage lang« macht diese im Deutschen ausdrücklich und natürlich.
- source_word: עַד שׁוֹב הָרֹדְפִים
  choice: bis die Verfolger zurückgekehrt sind
  rationale: עַד mit dem Infinitiv von שוב bezeichnet den Endpunkt des Verbergens. Das Perfekt nach »bis« stellt klar, dass ihre Rückkehr abgeschlossen sein soll.
- source_word: וְאַחַר
  choice: Danach
  rationale: Das Wort kennzeichnet die zeitliche Folge nach der Rückkehr der Verfolger.
- source_word: תֵּלְכוּ לְדַרְכְּכֶם
  choice: könnt ihr eures Weges ziehen
  rationale: Der Imperfekt bezeichnet hier die anschließend mögliche beziehungsweise erlaubte Handlung. »Eures Weges ziehen« ist würdig, verständlich und entspricht der hebräischen Wendung.
