  text: וַ/תֹּ֨אמֶר֙ אֶל הָ֣/אֲנָשִׁ֔ים יָדַ֕עְתִּי כִּֽי נָתַ֧ן יְהוָ֛ה לָ/כֶ֖ם אֶת הָ/אָ֑רֶץ וְ/כִֽי נָפְלָ֤ה אֵֽימַתְ/כֶם֙ עָלֵ֔י/נוּ וְ/כִ֥י נָמֹ֛גוּ כָּל יֹשְׁבֵ֥י הָ/אָ֖רֶץ מִ/פְּנֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/009.yaml
  text: And she said to the men[a], “I know that Yahweh has given you the land, and that the fear of you has fallen upon us[b], and that all the inhabitants of the land have melted away before you.”
translation:
  language: de
  text: 'Und sie sagte zu den Männern: »Ich weiß, dass Jahwe euch das Land gegeben hat, dass uns der Schrecken vor euch erfasst hat[a] und dass alle Bewohner des Landes vor euch den Mut verloren haben[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »dass der Schrecken vor euch auf uns gefallen ist«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »dass alle Bewohner des Landes vor euch dahingeschmolzen sind«; gemeint ist, dass sie allen Mut verloren haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר אֶל־הָאֲנָשִׁים
  choice: Und sie sagte zu den Männern
  rationale: Das Waw mit Imperfekt führt die Erzählung weiter. „Und sie sagte“ bewahrt diesen Anschluss; der bestimmte Artikel bezeichnet die bereits genannten Männer.
- source_word: יָדַעְתִּי
  choice: Ich weiß
  rationale: Das stative Perfekt bezeichnet hier eine feststehende Erkenntnis mit gegenwärtiger Geltung.
- source_word: נָתַן יְהוָה לָכֶם אֶת־הָאָרֶץ
  choice: dass Jahwe euch das Land gegeben hat
  rationale: Das Perfekt stellt die Gabe aus Rahabs Sicht als bereits feststehend dar, obwohl die Einnahme noch andauert. Der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: נָפְלָה אֵימַתְכֶם עָלֵינוּ
  choice: dass uns der Schrecken vor euch erfasst hat
  rationale: אֵימָה bezeichnet Schrecken oder Grauen. Die natürliche deutsche Formulierung gibt die Wirkung auf Rahab und ihr Volk klar wieder; eine formnähere Alternative steht in der Fußnote.
- source_word: נָמֹגוּ כָּל יֹשְׁבֵי הָאָרֶץ
  choice: dass alle Bewohner des Landes den Mut verloren haben
  rationale: נמג bedeutet wörtlich „schmelzen“ und beschreibt bildhaft das Schwinden des Mutes. Im Haupttext wird die gemeinte Wirkung idiomatisch ausgedrückt, während die Metapher in der Fußnote erhalten bleibt.
- source_word: מִפְּנֵיכֶם
  choice: vor euch
  rationale: Die Wendung kann räumlich-präsentisch oder kausal verstanden werden. „Vor euch“ bewahrt diese Offenheit und passt zum Herannahen Israels.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Rahabs Aussage, Jahwe habe das Land bereits gegeben
  choice: gegeben hat
  alternative: geben wird; gibt
  rationale: Das hebräische Perfekt stellt die Übergabe als gewiss beziehungsweise wirksam vollzogen dar. Die Übersetzung erhält diese Spannung zur noch nicht abgeschlossenen Landnahme.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Erzählton. Die Bildsprache des Hebräischen wird dort, wo sie im Deutschen ungewohnt wirkt, im Haupttext idiomatisch und in den Fußnoten wörtlicher wiedergegeben.
