  text: וְ/הַחֲיִתֶ֞ם אֶת אָבִ֣/י וְ/אֶת אִמִּ֗/י וְ/אֶת אַחַ/י֙ וְ/אֶת אחות/י וְ/אֵ֖ת כָּל אֲשֶׁ֣ר לָ/הֶ֑ם וְ/הִצַּלְתֶּ֥ם אֶת נַפְשֹׁתֵ֖י/נוּ מִ/מָּֽוֶת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/013.yaml
  text: and keep alive my father and my mother[a], and my brothers and my sisters, and all who belong to them[b]; and deliver our lives from death.
translation:
  language: de
  text: und meinen Vater und meine Mutter, meine Brüder und meine Schwestern sowie alle, die zu ihnen gehören,[a] am Leben lasst und unser Leben vor dem Tod rettet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „alles, was ihnen gehört“. Die hebräische Wendung kann sowohl Menschen aus ihrem Haushalt als auch ihren Besitz bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחֲיִתֶם
  choice: am Leben lasst
  rationale: Der Hifil von חיה bezeichnet hier das Bewahren beziehungsweise Erhalten am Leben. „Am Leben lasst“ gibt den kausativen Sinn natürlich wieder, ohne ihn auf bloßes Verschonen zu verengen.
- source_word: אָבִי ... אִמִּי ... אַחַי ... אחותי
  choice: meinen Vater und meine Mutter, meine Brüder und meine Schwestern
  rationale: Die einzelnen Verwandtschaftsbezeichnungen und ihre wiederholte Verknüpfung werden in klarem, natürlichem Deutsch wiedergegeben.
- source_word: כָּל אֲשֶׁר לָהֶם
  choice: alle, die zu ihnen gehören
  rationale: Im Zusammenhang der Rettung vor dem Tod liegt der Bezug auf weitere Angehörige oder Hausgenossen nahe. Da die hebräische Wendung auch Besitz einschließen kann, wird die weitere Möglichkeit in einer Fußnote erhalten.
- source_word: וְהִצַּלְתֶּם
  choice: rettet
  rationale: Der Hifil von נצל bedeutet hier aus tödlicher Gefahr retten oder befreien. „Rettet“ ist im modernen Deutschen unmittelbar verständlich und dem konkreten Zusammenhang angemessen.
- source_word: נַפְשֹׁתֵינוּ
  choice: unser Leben
  rationale: נפש bezeichnet hier nicht eine vom Körper getrennte Seele, sondern das konkrete Leben der Betroffenen. Der deutsche Singular „unser Leben“ ist idiomatisch und umfasst die ganze Gruppe.
- source_word: מִמָּוֶת
  choice: vor dem Tod
  rationale: Mit „retten“ ist im Deutschen die Verbindung „vor dem Tod retten“ natürlicher als „vom Tod retten“ und entspricht sachlich dem hebräischen מִן.
theological_decisions: []
