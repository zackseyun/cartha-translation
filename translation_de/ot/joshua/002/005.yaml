  text: וַ/יְהִ֨י הַ/שַּׁ֜עַר לִ/סְגּ֗וֹר בַּ/חֹ֨שֶׁךְ֙ וְ/הָ/אֲנָשִׁ֣ים יָצָ֔אוּ לֹ֣א יָדַ֔עְתִּי אָ֥נָה הָלְכ֖וּ הָֽ/אֲנָשִׁ֑ים רִדְפ֥וּ מַהֵ֛ר אַחֲרֵי/הֶ֖ם כִּ֥י תַשִּׂיגֽוּ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/005.yaml
  text: And when the gate was about to be shut at dark[a], the men went out. I do not know where the men went. Pursue them quickly, for you will overtake them.
translation:
  language: de
  text: Und als das Tor bei Einbruch der Dunkelheit[a] geschlossen werden sollte, gingen die Männer hinaus. Ich weiß nicht, wohin die Männer gegangen sind. Verfolgt sie schnell, denn ihr werdet sie einholen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als es dunkel war“. Die hebräische Wendung kennzeichnet den Zeitpunkt, zu dem das Tor beim Einsetzen der Dunkelheit geschlossen werden sollte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Und als
  rationale: Die Erzählungsform leitet den nächsten Vorgang ein; „Und als“ gibt die zeitliche Verknüpfung im modernen Deutschen natürlich wieder.
- source_word: הַשַּׁעַר
  choice: das Tor
  rationale: Gemeint ist im Zusammenhang das Stadttor Jerichos; die schlichte Wiedergabe „das Tor“ bleibt nah am hebräischen Wortlaut.
- source_word: לִסְגֹּר
  choice: geschlossen werden sollte
  rationale: Der Infinitiv mit ל bezeichnet hier das unmittelbar bevorstehende Schließen. Die passive deutsche Form ist erforderlich, weil das Tor geschlossen wird.
- source_word: בַּחֹשֶׁךְ
  choice: bei Einbruch der Dunkelheit
  rationale: Die Wendung bezeichnet den Zeitpunkt des Torschlusses beim Dunkelwerden. Die Übersetzung ist idiomatisch und vermeidet die rein räumliche Lesart „im Dunkeln“.
- source_word: וְהָאֲנָשִׁים יָצָאוּ
  choice: gingen die Männer hinaus
  rationale: יצא bezeichnet die konkrete Bewegung nach draußen; „hinausgehen“ bewahrt dieses Bild.
- source_word: לֹא יָדַעְתִּי
  choice: Ich weiß nicht
  rationale: Obwohl das hebräische Verb formal im Perfekt steht, bezeichnet es in der direkten Rede Rahabs gegenwärtig behauptetes Nichtwissen.
- source_word: אָנָה הָלְכוּ
  choice: wohin die Männer gegangen sind
  rationale: אָנָה fragt nach dem Ziel einer Bewegung; „wohin“ gibt diese Richtungsbedeutung präzise wieder.
- source_word: רִדְפוּ מַהֵר אַחֲרֵיהֶם
  choice: Verfolgt sie schnell
  rationale: Der Imperativ fordert zur unverzüglichen Verfolgung auf. „Verfolgen“ enthält im Deutschen bereits die durch אַחֲרֵיהֶם ausgedrückte Bewegung hinter ihnen her.
- source_word: כִּי תַשִּׂיגוּם
  choice: denn ihr werdet sie einholen
  rationale: כִּי begründet die Aufforderung, und das Hifil von נשׂג bedeutet im Zusammenhang „einholen“ bzw. „erreichen“.
