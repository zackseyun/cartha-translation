  verdict: revise
  source_fidelity: Die Übersetzung gibt den begründenden Anschluss von כִּי, das präsentisch relevante „wir haben gehört“, den Gottesnamen, die Ortsangabe und die Bannterminologie grundsätzlich treffend wieder. Die Wiedergabe von עשה mit „was ihr mit … getan habt“ ist jedoch weniger präzise als die im Deutschen idiomatische, auf Personen zielende Formulierung „was ihr … angetan habt“.
  naturalness: „Mit den beiden Königen … mit Sihon und Og“ ist als doppelte Präpositionskonstruktion schwerfällig. Eine durch Gedankenstriche abgegrenzte Apposition macht die Identifikation der Könige klar. „Die Wasser“ und „austrocknen ließ“ geben den Plural und den kausativen Hifil natürlich und genauer wieder.
  terminology: „Jahwe“, „Schilfmeer“ und „dem Untergang geweiht“ sind sachgerecht. Die Fußnote sollte die wörtliche Angabe grammatisch korrekt mit „wörtlich:“ einführen und die traditionelle Bezeichnung als solche ausweisen.
