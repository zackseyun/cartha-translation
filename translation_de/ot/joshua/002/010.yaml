revisions:
- from: Denn wir haben gehört, wie Jahwe das Wasser des Schilfmeeres[a] vor euch austrocknete, als ihr aus Ägypten zogt, und was ihr mit den beiden Königen der Amoriter jenseits des Jordan getan habt, mit Sihon und Og, die ihr dem Untergang geweiht habt.
  to: Denn wir haben gehört, wie Jahwe die Wasser des Schilfmeeres[a] vor euch austrocknen ließ, als ihr aus Ägypten zogt, und was ihr den beiden Königen der Amoriter jenseits des Jordan angetan habt – Sihon und Og –, die ihr dem Untergang geweiht habt.
  rationale: Die Revision klärt die Satzbezüge und die appositionelle Identifikation Sihons und Ogs, bildet den Plural von מֵי sowie die kausative Verbform הוֹבִישׁ genauer ab und korrigiert die Formulierung der lexikalischen Fußnote. Die umstrittene geografische Zuordnung von Jam Suf wird nicht im Haupttext entschieden; die traditionelle Benennung bleibt in der Fußnote dokumentiert.
