source:
  edition: WLC
  text: כִּ֣י שָׁמַ֗עְנוּ אֵ֠ת אֲשֶׁר הוֹבִ֨ישׁ יְהוָ֜ה אֶת מֵ֤י יַם סוּף֙ מִ/פְּנֵי/כֶ֔ם בְּ/צֵאתְ/כֶ֖ם מִ/מִּצְרָ֑יִם וַ/אֲשֶׁ֣ר עֲשִׂיתֶ֡ם לִ/שְׁנֵי֩ מַלְכֵ֨י הָ/אֱמֹרִ֜י אֲשֶׁ֨ר בְּ/עֵ֤בֶר הַ/יַּרְדֵּן֙ לְ/סִיחֹ֣ן וּ/לְ/ע֔וֹג אֲשֶׁ֥ר הֶחֱרַמְתֶּ֖ם אוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/010.yaml
  text: For we have heard how Yahweh dried up the water of the Red Sea before you when you came out of Egypt[a], and what you did to the two kings of the Amorites who were beyond the Jordan—to Sihon and Og—whom you devoted to destruction.
translation:
  language: de
  text: Denn wir haben gehört, wie Jahwe die Wasser des Schilfmeeres[a] vor euch austrocknen ließ, als ihr aus Ägypten zogt, und was ihr den beiden Königen der Amoriter jenseits des Jordan angetan habt – Sihon und Og –, die ihr dem Untergang geweiht habt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch Jam Suf, traditionell „Rotes Meer“; wörtlich: „Schilfmeer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion leitet Rahabs Begründung für die zuvor geschilderte Furcht ein; „Denn“ gibt diesen Zusammenhang im Deutschen natürlich wieder.
- source_word: שָׁמַעְנוּ
  choice: wir haben gehört
  rationale: Das Perfekt bezeichnet das Gehörte als gegenwärtig wirksame Erkenntnis; das deutsche Perfekt passt zu natürlicher berichtender Rede.
- source_word: הוֹבִישׁ
  choice: austrocknete
  rationale: Der Hifil von יבש bedeutet „trocken machen, austrocknen“ und beschreibt hier, dass das Wasser beseitigt beziehungsweise trocken gemacht wurde.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: מֵי יַם סוּף
  choice: das Wasser des Schilfmeeres
  rationale: יַם־סוּף wird quellennah als „Schilfmeer“ wiedergegeben. Die traditionelle Bezeichnung „Rotes Meer“ bleibt in einer Fußnote erhalten.
- source_word: מִפְּנֵיכֶם
  choice: vor euch
  rationale: Die Wendung bezeichnet das Wasser, das Israel auf seinem Weg vor sich hatte und das vor ihm entfernt wurde.
- source_word: בְּצֵאתְכֶם מִמִּצְרַיִם
  choice: als ihr aus Ägypten zogt
  rationale: Der Infinitiv mit בְּ hat temporale Bedeutung. „Aus Ägypten ziehen“ ist idiomatisch und wahrt den Exodus-Anklang.
- source_word: עֲשִׂיתֶם
  choice: was ihr … getan habt
  rationale: Das allgemeine Verb wird bewusst nicht vorzeitig als „vernichten“ spezifiziert; der folgende Relativsatz benennt die konkrete Handlung.
- source_word: לִשְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: mit den beiden Königen der Amoriter
  rationale: Bei „tun“ ist „was ihr mit … getan habt“ im Deutschen natürlicher als eine wörtliche Konstruktion mit „an“ oder „zu“.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: jenseits des Jordan
  rationale: Die traditionelle und knappe Ortsangabe bewahrt die perspektivische Bedeutung der hebräischen Wendung.
- source_word: לְסִיחֹן וּלְעוֹג
  choice: mit Sihon und Og
  rationale: Die beiden Namen identifizieren appositionell die zuvor genannten Könige; die wiederholte Präposition ergibt im Deutschen einen klaren Satzbau.
- source_word: הֶחֱרַמְתֶּם
  choice: die ihr dem Untergang geweiht habt
  rationale: Die Form von חרם bezeichnet das Vollstrecken des Banns beziehungsweise die Weihe zur Vernichtung. Die Formulierung bewahrt sowohl den Weihe- als auch den Vernichtungsaspekt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt das Tetragramm ausdrücklich. Die Wiedergabe als Eigenname bewahrt diesen Unterschied gegenüber dem Titel אֲדֹנָי.
- issue: Wiedergabe der Bannterminologie חרם
  choice: dem Untergang geweiht
  alternative: vollständig vernichtet
  rationale: Die gewählte Formulierung lässt den besonderen religiös-rechtlichen Sinn von חרם erkennen und reduziert das Wort nicht auf eine rein militärische Vernichtung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Rede bleibt unmittelbar und verständlich; „Schilfmeer“ folgt dem hebräischen Ausdruck, während die traditionelle geografische Benennung in der Fußnote dokumentiert wird.
