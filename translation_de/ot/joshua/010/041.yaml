  text: וַ/יַּכֵּ֧/ם יְהוֹשֻׁ֛עַ מִ/קָּדֵ֥שׁ בַּרְנֵ֖עַ וְ/עַד עַזָּ֑ה וְ/אֵ֛ת כָּל אֶ֥רֶץ גֹּ֖שֶׁן וְ/עַד גִּבְעֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/041.yaml
  text: And Joshua struck them from Kadesh-barnea as far as Gaza[a], and all the land of Goshen, as far as Gibeon.
translation:
  language: de
  text: Josua schlug sie von Kadesch-Barnea bis Gaza[a], im ganzen Land Goschen bis Gibeon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „besiegte sie“; auch: „schlug sie nieder“. Das hebräische Verb kann einen militärischen Schlag oder Sieg bezeichnen, ohne immer die genaue Art näher zu bestimmen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּם
  choice: schlug sie
  rationale: Das Verb נכה mit Objektsuffix bezeichnet hier einen militärischen Schlag beziehungsweise Sieg, ohne für sich allein zwingend die genaue Art oder den Tod jedes Betroffenen festzulegen.
- source_word: מִקָּדֵשׁ בַּרְנֵעַ וְעַד עַזָּה
  choice: von Kadesch-Barnea bis nach Gaza
  rationale: Die Konstruktion מִן ... עַד bezeichnet die geografische Ausdehnung des Feldzugs; die deutschen Ortsnamen folgen gebräuchlicher moderner Schreibweise.
- source_word: וְאֵת כָּל אֶרֶץ גֹּשֶׁן
  choice: und eroberte das ganze Land Goschen
  rationale: אֵת kennzeichnet ein weiteres direktes Objekt von וַיַּכֵּם. Im Deutschen macht die Wiederaufnahme durch „eroberte“ den territorialen Sinn natürlich verständlich, ohne ein zusätzliches Ereignis einzuführen.
- source_word: וְעַד גִּבְעוֹן
  choice: bis nach Gibeon
  rationale: עַד gibt erneut die räumliche Grenze an; „bis nach“ ist in dieser Aufzählung idiomatisches Deutsch.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe geografische Reihung des Hebräischen bleibt erhalten; „eroberte“ vermeidet beim Landobjekt die unnatürliche Formulierung „schlug das Land“.
