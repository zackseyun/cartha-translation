  text: וַ/יָּשֻׁבוּ֩ כָל הָ/עָ֨ם אֶל הַ/מַּחֲנֶ֧ה אֶל יְהוֹשֻׁ֛עַ מַקֵּדָ֖ה בְּ/שָׁל֑וֹם לֹֽא חָרַ֞ץ לִ/בְנֵ֧י יִשְׂרָאֵ֛ל לְ/אִ֖ישׁ אֶת לְשֹׁנֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/021.yaml
  text: And all the people returned to the camp[a], to Joshua at Makkedah, in peace. No one moved his tongue against any of the sons of Israel.
translation:
  language: de
  text: Und das ganze Volk kehrte wohlbehalten ins Lager zu Josua bei Makkeda zurück. Niemand sagte gegen irgendeinen der Israeliten auch nur ein Wort.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Niemand schärfte (oder: bewegte) gegen irgendeinen der Israeliten seine Zunge.“ Die bildhafte hebräische Wendung meint, dass niemand sich gegen sie feindselig oder herausfordernd äußerte.'
    reason: Die Fußnote bewahrt die hebräische Bildsprache und weist auf die umstrittene Nuance des Verbs hin.
lexical_decisions:
- source_word: וַיָּשֻׁבוּ כָל הָעָם
  choice: Und das ganze Volk kehrte zurück
  rationale: שׁוּב bezeichnet hier die Rückkehr nach der Verfolgung. עָם bleibt als „Volk“ wiedergegeben, obwohl im Zusammenhang die kämpfende Truppe gemeint ist.
- source_word: אֶל הַמַּחֲנֶה אֶל יְהוֹשֻׁעַ מַקֵּדָה
  choice: ins Lager zu Josua bei Makkeda
  rationale: 'Die knappe hebräische Folge wird im Deutschen natürlich gefasst: Das Volk kehrt in das Lager zu Josua zurück, der sich bei Makkeda befindet.'
- source_word: בְּשָׁלוֹם
  choice: wohlbehalten
  rationale: Im militärischen Erzählzusammenhang bezeichnet die Wendung eine sichere, unversehrte Rückkehr. „Wohlbehalten“ gibt diesen Sinn natürlicher wieder als das missverständliche „in Frieden“.
- source_word: לֹא חָרַץ ... אֶת לְשֹׁנוֹ
  choice: Niemand wagte es ... auch nur ein Wort zu sagen
  rationale: Die feste Wendung, wörtlich etwa „die Zunge schärfen/bewegen“, bezeichnet hier feindseliges oder herausforderndes Reden. Die deutsche Formulierung wahrt den Nachdruck der vollständigen Einschüchterung; die Bildsprache wird in der Fußnote kenntlich gemacht.
- source_word: לִבְנֵי יִשְׂרָאֵל לְאִישׁ
  choice: gegen irgendeinen von den Israeliten
  rationale: Negiertes אִישׁ ergibt „irgendeinen/auch nur einen“. בְּנֵי יִשְׂרָאֵל ist hier die übliche nationale Bezeichnung und wird im modernen Deutschen natürlich mit „Israeliten“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe der nationalen Bezeichnung בְּנֵי יִשְׂרָאֵל
  choice: Israeliten
  alternative: Söhne Israels / Kinder Israels
  rationale: Die Wendung fungiert hier als nationale Sammelbezeichnung. „Israeliten“ gibt ihren Referenten präzise und in modernem Deutsch ohne eine sachlich nicht beabsichtigte Beschränkung auf leibliche Söhne wieder.
translation_notes:
  register: Moderne, verständliche und zugleich würdige Erzählsprache. „Wohlbehalten“ vermeidet die mögliche Fehlauffassung, es habe während des Feldzugs Frieden geherrscht. Die idiomatische Haupttextfassung wird durch eine quellennähere Fußnote abgesichert.
