  text: וַ/יְהֻמֵּ֤/ם יְהוָה֙ לִ/פְנֵ֣י יִשְׂרָאֵ֔ל וַ/יַּכֵּ֥/ם מַכָּֽה גְדוֹלָ֖ה בְּ/גִבְע֑וֹן וַֽ/יִּרְדְּפֵ֗/ם דֶּ֚רֶךְ מַעֲלֵ֣ה בֵית חוֹרֹ֔ן וַ/יַּכֵּ֥/ם עַד עֲזֵקָ֖ה וְ/עַד מַקֵּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/010.yaml
  text: And Yahweh threw them into confusion before Israel[a], and struck them down with a great slaughter at Gibeon, and pursued them by the way of the ascent of Beth-horon, and struck them down as far as Azekah and Makkedah.
translation:
  language: de
  text: Und Jahwe versetzte sie vor Israel in Verwirrung[a]. Er fügte ihnen bei Gibeon eine schwere Niederlage zu, verfolgte sie auf dem Weg über die Steige von Bet-Horon und schlug sie nieder bis nach Aseka und Makkeda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „jagte sie in die Flucht“ oder „versetzte sie in Panik“; das hebräische Verb bezeichnet, dass im Kampf Verwirrung oder Panik ausgelöst wird.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: וַיְהֻמֵּם
  choice: versetzte sie … in Verwirrung
  rationale: Das Verb המם bezeichnet im Kampf das Verursachen von Verwirrung oder Panik. Die Formulierung bewahrt Jahwes unmittelbare Verursachung, ohne sie lediglich als Ergebnis wie „schlug sie in die Flucht“ wiederzugeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als Gottes Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לִפְנֵי יִשְׂרָאֵל
  choice: vor Israel
  rationale: Die knappe Wiedergabe erhält die räumlich beziehungsweise relational offene hebräische Wendung.
- source_word: וַיַּכֵּם מַכָּה גְדוֹלָה
  choice: brachte ihnen … eine schwere Niederlage bei
  rationale: נכה mit מַכָּה גְדוֹלָה bezeichnet hier im militärischen Zusammenhang einen vernichtenden Schlag beziehungsweise eine schwere Niederlage. Die deutsche Wendung ist natürlich und vermeidet die unidiomatische Doppelung „schlug sie mit einem großen Schlag“.
- source_word: בְּגִבְעוֹן
  choice: bei Gibeon
  rationale: „Bei“ bezeichnet den Ort des Kampfgeschehens im Deutschen natürlich, ohne zwingend ein Geschehen innerhalb der Stadt zu behaupten.
- source_word: וַיִּרְדְּפֵם
  choice: verfolgte sie
  rationale: רדף ist das übliche Verb für das Verfolgen fliehender Feinde.
- source_word: דֶּרֶךְ מַעֲלֵה בֵית חוֹרֹן
  choice: auf dem Weg zum Anstieg von Bet-Horon
  rationale: Die Wiedergabe erhält sowohl den Weg als auch den topografischen Anstieg; „von Bet-Horon“ lässt die Zugehörigkeit des Anstiegs zum Ortsgebiet offen.
- source_word: וַיַּכֵּם עַד עֲזֵקָה וְעַד מַקֵּדָה
  choice: schlug sie bis nach Aseka und Makkeda
  rationale: Das wiederholte נכה wird als „schlug“ wiedergegeben; עַד bezeichnet die geografische Ausdehnung des Angriffs bis zu den genannten Orten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens JHWH
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen יהוה. „Jahwe“ bewahrt diesen als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Handelndes Subjekt bei Verwirrung, Niederlage und Verfolgung
  choice: Jahwe bleibt grammatisches Subjekt aller Handlungen
  alternative: Israel als unausgesprochenes Subjekt der Verfolgung und des Schlagens verstehen
  rationale: Die aufeinanderfolgenden hebräischen Verbformen haben ausdrücklich beziehungsweise fortgeführt Jahwe als Subjekt. Die Übersetzung bewahrt diese auffällige Darstellung, ohne die menschliche Beteiligung Israels erklärend einzutragen.
translation_notes:
  register: Moderne, würdevolle Erzählprosa. Die Satzfolge wurde für natürliches Deutsch nach dem ersten Satz getrennt; das durchgehende göttliche Subjekt und die topografischen Angaben bleiben erhalten.
