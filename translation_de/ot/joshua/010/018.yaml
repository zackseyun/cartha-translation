source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוֹשֻׁ֔עַ גֹּ֛לּוּ אֲבָנִ֥ים גְּדֹל֖וֹת אֶל פִּ֣י הַ/מְּעָרָ֑ה וְ/הַפְקִ֧ידוּ עָלֶ֛י/הָ אֲנָשִׁ֖ים לְ/שָׁמְרָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/018.yaml
  text: And Joshua said[a], “Roll large stones to the mouth of the cave[b], and appoint men over it to guard it.”
translation:
  language: de
  text: 'Und Josua sagte: „Wälzt große Steine vor den Eingang der Höhle[a] und stellt dort Männer auf, die sie bewachen sollen.[b]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „an den Mund der Höhle“.'
    reason: lexical_alternative
  - marker: b
    text: 'Im Hebräischen steht ein männliches Objekt im Plural: „sie bewachen“. Gemeint sind wahrscheinlich die Könige, die in der Höhle eingeschlossen waren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und … sagte
  rationale: Das Wayyiqtol führt die Erzählung weiter; „Und … sagte“ gibt den hebräischen Erzählfluss schlicht wieder.
- source_word: יְהוֹשֻׁעַ
  choice: Josua
  rationale: Die im Deutschen gebräuchliche biblische Namensform.
- source_word: גֹּלּוּ
  choice: Wälzt
  rationale: Der Imperativ Plural von גלל bezeichnet hier das Rollen beziehungsweise Wälzen schwerer Steine.
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: große Steine
  rationale: Die Wendung bezeichnet unmittelbar die Größe der Steine und klingt im heutigen Deutsch natürlich.
- source_word: אֶל פִּי הַמְּעָרָה
  choice: vor den Eingang der Höhle
  rationale: פִּי („Mund“) ist hier eine bildhafte Bezeichnung für die Öffnung; „Eingang der Höhle“ vermittelt den gemeinten Ort natürlich, während die Fußnote das hebräische Bild bewahrt.
- source_word: וְהַפְקִידוּ
  choice: und stellt … auf
  rationale: Die Hifil-Form von פקד bedeutet, Personen mit einer Aufgabe zu betrauen beziehungsweise an einem Ort einzusetzen; „aufstellen“ passt zum Wachauftrag.
- source_word: עָלֶיהָ
  choice: dort
  rationale: Das Suffix bezieht sich auf die Höhle; zusammen mit „aufstellen“ gibt „dort“ die räumliche und auftragsbezogene Funktion idiomatisch wieder.
- source_word: אֲנָשִׁים
  choice: Männer
  rationale: Das hebräische Wort bezeichnet hier ausdrücklich Männer; „Wachen“ wäre spezifischer als der Ausgangstext.
- source_word: לְשָׁמְרָם
  choice: die sie bewachen sollen
  rationale: Das Objektsuffix ist maskulin und plural. Das Pronomen „sie“ bewahrt diese Form und lässt den im Zusammenhang wahrscheinlichen Bezug auf die eingeschlossenen Könige bestehen, ohne ihn in den Haupttext einzutragen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkrete Bewegung der Steine wird mit „wälzen“ wiedergegeben; die ungewöhnliche hebräische Metapher vom „Mund“ der Höhle steht in der Fußnote. Der plurale Bezug des Schlusspronomens bleibt im Haupttext erhalten und wird in der Fußnote erläutert.
