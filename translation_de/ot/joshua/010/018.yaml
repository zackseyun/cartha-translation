  terminology: „Josua“ entspricht der etablierten deutschen Namensform. Die Fußnote zu „Mund der Höhle“ dokumentiert die hebräische Bildsprache. Die zweite Fußnote erklärt zutreffend, dass das hebräische Suffix maskulin plural ist und im Kontext wahrscheinlich die eingeschlossenen Könige bezeichnet; der deutsche Haupttext legt dies nicht übermäßig fest.
