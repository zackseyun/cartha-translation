  text: וַ/יְהִ֞י לְ/עֵ֣ת בּ֣וֹא הַ/שֶּׁ֗מֶשׁ צִוָּ֤ה יְהוֹשֻׁ֨עַ֙ וַ/יֹּֽרִידוּ/ם֙ מֵ/עַ֣ל הָ/עֵצִ֔ים וַ/יַּ֨שְׁלִכֻ֔/ם אֶל הַ/מְּעָרָ֖ה אֲשֶׁ֣ר נֶחְבְּאוּ שָׁ֑ם וַ/יָּשִׂ֜מוּ אֲבָנִ֤ים גְּדֹלוֹת֙ עַל פִּ֣י הַ/מְּעָרָ֔ה עַד עֶ֖צֶם הַ/יּ֥וֹם הַ/זֶּֽה׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/027.yaml
  text: And at the time of the sun’s going down[a], Joshua commanded, and they took them down from the trees and threw them into the cave where they had hidden there[b], and they placed large stones over the mouth of the cave to this very day.
translation:
  language: de
  text: Als die Sonne unterging[a], befahl Josua, und sie nahmen sie von den Bäumen herab und warfen sie in die Höhle, in der sie sich versteckt hatten[b]. Dann legten sie große Steine vor den Eingang der Höhle, bis auf den heutigen Tag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zur Zeit des Untergehens der Sonne“; gemeint ist der Sonnenuntergang.'
    reason: lexical_alternative
  - marker: b
    text: 'Im Hebräischen steht ausdrücklich „dort“: „in der sie sich dort versteckt hatten“. Im Deutschen wäre „dort“ neben „in der“ eine unnötige Doppelung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֵת בּוֹא הַשֶּׁמֶשׁ
  choice: Als die Sonne unterging
  rationale: Die Wendung bezeichnet die Zeit des Sonnenuntergangs. Die verbale Wiedergabe bewahrt das hebräische Bild und klingt im modernen Deutschen natürlich.
- source_word: צִוָּה יְהוֹשֻׁעַ
  choice: befahl Josua
  rationale: Das Verb bedeutet „befehlen“. Der anschließende Infinitiv macht im Deutschen deutlich, was auf Josuas Befehl hin ausgeführt wurde.
- source_word: וַיּוֹרִידוּם מֵעַל הָעֵצִים
  choice: sie von den Bäumen herunterzunehmen
  rationale: Die Form bezeichnet das Herunternehmen der zuvor aufgehängten Könige; „von den Bäumen herunternehmen“ ist präzise und idiomatisch.
- source_word: וַיַּשְׁלִכֻם
  choice: Man warf sie
  rationale: „Werfen“ gibt die direkte und drastische Handlung des hebräischen Verbs wieder. Das unpersönliche „man“ bezeichnet dieselben ausführenden Personen, ohne ein im Kontext nicht genanntes Subjekt einzuführen.
- source_word: אֶל הַמְּעָרָה
  choice: in die Höhle
  rationale: Die Präposition bezeichnet die Bewegung ins Innere der Höhle; „in“ ist hier die natürliche deutsche Entsprechung.
- source_word: אֲשֶׁר נֶחְבְּאוּ שָׁם
  choice: in der sie sich versteckt hatten
  rationale: Der Relativsatz bezieht sich auf die Höhle. Das deutsche „in der“ gibt zugleich den örtlichen Gehalt von שָׁם wieder, ohne die unnatürliche Doppelung „in der … dort“.
- source_word: וַיָּשִׂמוּ אֲבָנִים גְּדֹלוֹת עַל פִּי הַמְּעָרָה
  choice: und legte große Steine vor den Eingang der Höhle
  rationale: „Große Steine“ gibt die Größenangabe direkt wieder. פִּי, wörtlich „Mund“, bezeichnet idiomatisch den Höhleneingang; „vor“ macht die Sperrfunktion der Steine natürlich verständlich.
- source_word: עַד עֶצֶם הַיּוֹם הַזֶּה
  choice: bis auf den heutigen Tag
  rationale: Dies ist eine geläufige, würdige deutsche Wiedergabe der emphatischen Zeitformel und bezeichnet den vom Erzähler aus gesehen fortdauernden Zustand.
theological_decisions:
- issue: Bezugsgröße der Schlussformel עַד עֶצֶם הַיּוֹם הַזֶּה
  choice: Dort liegen sie bis auf den heutigen Tag
  alternative: bis auf den heutigen Tag
  rationale: Im Hebräischen steht die Zeitformel unmittelbar nach dem Niederlegen der großen Steine; grammatisch ist kein ausdrückliches Subjekt für den fortdauernden Zustand genannt. Die deutsche Formulierung bezieht „sie“ am natürlichsten auf die Steine, lässt dies aber in einer Fußnote transparent erkennen und vermeidet eine theologische Erweiterung.
translation_notes:
  register: Moderne, klare und zugleich würdige Erzählsprache. Die Satzfolge wurde für natürliches Deutsch leicht gegliedert, während die Abfolge der Handlungen und die Härte des Berichts erhalten bleiben. Beide Fußnotenmarker stehen unmittelbar bei den betreffenden Wendungen.
