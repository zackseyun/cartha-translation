  to: Als die Sonne unterging[a], befahl Josua, und sie nahmen sie von den Bäumen herab und warfen sie in die Höhle, in der sie sich versteckt hatten[b]. Dann legten sie große Steine vor den Eingang der Höhle, bis auf den heutigen Tag.
