source:
  edition: WLC
  text: וַ/יַּעֲבֹ֣ר יְ֠הוֹשֻׁעַ וְ/כָֽל יִשְׂרָאֵ֥ל עִמּ֛/וֹ מִ/מַּקֵּדָ֖ה לִבְנָ֑ה וַ/יִּלָּ֖חֶם עִם לִבְנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/029.yaml
  text: Then Joshua[a], and all Israel with him, passed on from Makkedah to Libnah and fought against Libnah.
translation:
  language: de
  text: Dann zog Josua mit ganz Israel von Makkeda nach Libna weiter und kämpfte gegen Libna.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „kämpfte mit Libna“; die hebräische Wendung bedeutet hier, dass er gegen die Stadt kämpfte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: zog … weiter
  rationale: עבר bezeichnet hier im militärischen Reisebericht die Weiterbewegung von einem Ort zum nächsten. „zog … weiter“ klingt im Deutschen natürlich und unterstellt keinen Flussübergang.
- source_word: וְכָל־יִשְׂרָאֵל עִמּוֹ
  choice: mit ganz Israel
  rationale: Die Wendung bezeichnet die Begleitung Josuas durch ganz Israel. Die deutsche Fügung wahrt diese Zuordnung knapp und idiomatisch.
- source_word: מִמַּקֵּדָה
  choice: von Makkeda
  rationale: Die Präposition מִן kennzeichnet den Ausgangspunkt; der Ortsname wird transliteriert.
- source_word: לִבְנָה
  choice: nach Libna
  rationale: Die Präposition לְ kennzeichnet hier das Ziel der Bewegung; der Ortsname wird transliteriert.
- source_word: וַיִּלָּחֶם
  choice: und kämpfte
  rationale: לחם im Nifal bedeutet gewöhnlich „kämpfen“ oder „Krieg führen“. „kämpfte“ ist prägnant und passt zum Erzählzusammenhang.
- source_word: עִם־לִבְנָה
  choice: gegen Libna
  rationale: Obwohl עִם für sich genommen meist „mit“ bedeutet, bezeichnet es nach לחם idiomatisch den Gegner. Im Deutschen gibt „gegen Libna“ den Sinn eindeutig wieder.
theological_decisions: []
