  variant: modern standard German
source:
  edition: WLC
  text: עֲלֽוּ אֵלַ֣/י וְ/עִזְרֻ֔/נִי וְ/נַכֶּ֖ה אֶת גִּבְע֑וֹן כִּֽי הִשְׁלִ֥ימָה אֶת יְהוֹשֻׁ֖עַ וְ/אֶת בְּנֵ֥י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/004.yaml
  text: Come up to me and help me[a], and let us strike Gibeon[b], because it has made peace with Joshua and with the sons of Israel.
translation:
  language: de
  text: Kommt zu mir herauf und helft mir! Lasst uns Gibeon angreifen, denn es hat mit Josua und den Israeliten[a] Frieden geschlossen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »den Söhnen Israels«; auch: »dem Volk Israel«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »ein Bündnis geschlossen«. Das hebräische Verb kann das Eingehen friedlicher Beziehungen oder eines vertraglichen Friedens bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלוּ אֵלַי
  choice: Kommt zu mir herauf
  rationale: Der pluralische Imperativ von עלה bezeichnet ein Hinaufziehen; אֵלַי gibt die auf den Sprecher gerichtete Bewegung an. Die Formulierung bewahrt diese räumliche und perspektivische Nuance in natürlichem Deutsch.
- source_word: וְעִזְרֻנִי
  choice: und helft mir
  rationale: Der pluralische Imperativ mit Objekt der ersten Person Singular wird direkt und idiomatisch wiedergegeben.
- source_word: וְנַכֶּה
  choice: Lasst uns … angreifen
  rationale: Die Kohortativform drückt einen gemeinsamen Handlungsaufruf aus. Im militärischen Zusammenhang gibt „angreifen“ den Sinn von נכה natürlich wieder; das allgemeinere „schlagen“ wäre formnäher, im Deutschen hier aber weniger idiomatisch.
- source_word: אֶת גִּבְעוֹן
  choice: Gibeon
  rationale: Der direkte Gegenstand ist die Stadt Gibeon; der hebräische Objektmarker wird im Deutschen nicht eigens wiedergegeben.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt die Begründung des Aufrufs ein. „Denn“ verbindet die beiden Hauptaussagen in gehobenem, aber allgemein verständlichem Deutsch.
- source_word: הִשְׁלִימָה
  choice: Frieden geschlossen
  rationale: Das Hifil Perfekt feminin Singular von שלם bezeichnet hier das Eingehen friedlicher beziehungsweise vertraglicher Beziehungen. „Frieden geschlossen“ bewahrt den Grundsinn, ohne die politische Beziehung vorschnell als förmliches Bündnis festzulegen.
- source_word: אֶת יְהוֹשֻׁעַ וְאֶת בְּנֵי יִשְׂרָאֵל
  choice: mit Josua und den Israeliten
  rationale: Beim idiomatischen Gebrauch von השלים bezeichnet אֶת die Parteien, mit denen Frieden geschlossen wurde. „Israeliten“ ist die natürliche deutsche Bezeichnung für בני ישראל; die wörtliche Form wird in der Fußnote genannt.
theological_decisions:
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels / das Volk Israel
  rationale: Der Ausdruck bezeichnet in diesem geschichtlich-nationalen Zusammenhang die Angehörigen Israels insgesamt. „Israeliten“ ist präzise, natürlich und schließt den korporativen Bezug ein, während „Söhne Israels“ im heutigen Deutsch leicht nur männliche Nachkommen vermuten lässt.
- issue: Diplomatische Bedeutung von הִשְׁלִימָה
  choice: Frieden geschlossen
  alternative: ein Bündnis geschlossen / sich unterworfen
  rationale: Der hebräische Ausdruck lässt friedliche oder vertragliche Beziehungen erkennen, legt aber deren genaue politische Form nicht eindeutig fest. Die Übersetzung bewahrt diese Offenheit; eine Fußnote nennt die engere Bündnisdeutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direktem militärischem Aufruf. Die Satzfolge bleibt nahe am Hebräischen, während „angreifen“ und „Israeliten“ für heutige Leser idiomatisch formuliert sind. Alle Fußnotenmarker stehen unmittelbar bei den erläuterten Ausdrücken.
