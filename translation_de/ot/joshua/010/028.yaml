  text: וְ/אֶת מַקֵּדָה֩ לָכַ֨ד יְהוֹשֻׁ֜עַ בַּ/יּ֣וֹם הַ/ה֗וּא וַ/יַּכֶּ֣/הָ לְ/פִי חֶרֶב֮ וְ/אֶת מַלְכָּ/הּ֒ הֶחֱרִ֣ם אוֹתָ֗/ם וְ/אֶת כָּל הַ/נֶּ֨פֶשׁ֙ אֲשֶׁר בָּ֔/הּ לֹ֥א הִשְׁאִ֖יר שָׂרִ֑יד וַ/יַּ֨עַשׂ֙ לְ/מֶ֣לֶךְ מַקֵּדָ֔ה כַּ/אֲשֶׁ֥ר עָשָׂ֖ה לְ/מֶ֥לֶךְ יְרִיחֽוֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/028.yaml
  text: And Joshua captured Makkedah on that day and struck it with the edge of the sword[a], and he devoted to destruction its king and every person in it; he left no survivor. And he did to the king of Makkedah just as he had done to the king of Jericho.
translation:
  language: de
  text: An jenem Tag nahm Josua Makkeda ein und schlug die Stadt mit der Schneide des Schwertes. Ihren König und alle Menschen darin weihte er dem Bann zur Vernichtung; er ließ keinen Überlebenden übrig. Mit dem König von Makkeda verfuhr er so, wie er mit dem König von Jericho verfahren war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכַד
  choice: nahm … ein
  rationale: Die übliche militärische Bedeutung des Verbs im Blick auf die Einnahme einer Stadt; im modernen Deutschen klar und idiomatisch.
- source_word: וַיַּכֶּהָ לְפִי חֶרֶב
  choice: schlug es mit der Schärfe des Schwertes
  rationale: Bewahrt sowohl die konkrete Kraft von נכה als auch das hebräische Bild vom »Mund« beziehungsweise der Schneide des Schwertes, ohne es auf das allgemeinere »besiegte« zu reduzieren.
- source_word: הֶחֱרִם
  choice: weihte … dem Untergang
  rationale: Gibt den Hifil von חרם als kultisch-theologisch geprägte Übergabe an den Bann beziehungsweise die Vernichtung wieder und vermeidet die Verflachung zu bloßem »vernichtete«.
- source_word: אוֹתָם וְאֶת כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: seinen König und alle Menschen darin
  rationale: Macht die Bezugsgrößen im Deutschen verständlich; נֶפֶשׁ bezeichnet hier Menschen beziehungsweise Personen, nicht eigens die immaterielle Seele.
- source_word: לֹא הִשְׁאִיר שָׂרִיד
  choice: er ließ keinen Überlebenden übrig
  rationale: Natürliche deutsche Wiedergabe, die שָׂרִיד in seinem konkreten Sinn als Überlebenden erfasst.
- source_word: וַיַּעַשׂ לְמֶלֶךְ מַקֵּדָה כַּאֲשֶׁר עָשָׂה לְמֶלֶךְ יְרִיחוֹ
  choice: Mit dem König von Makkeda verfuhr er so, wie er mit dem König von Jericho verfahren war
  rationale: Bewahrt die knappe Vergleichsaussage von עשה + ל, klingt aber im Deutschen natürlicher als das wörtliche »tat dem König«.
- source_word: מַקֵּדָה / יְרִיחוֹ / יְהוֹשֻׁעַ
  choice: Makkeda / Jericho / Josua
  rationale: Verwendet die im Deutschen etablierten biblischen Namensformen.
theological_decisions:
- issue: Wiedergabe von חרם im Zusammenhang der Landnahme
  choice: weihte … dem Untergang
  alternative: vernichtete vollständig; vollstreckte den Bann an
  rationale: 'Die Formulierung bewahrt, dass חרם mehr als bloßes Töten bezeichnet: Menschen oder Dinge werden unwiderruflich dem Bann und damit der Vernichtung übergeben. Zugleich wird keine weitergehende konfessionelle Deutung in den Haupttext eingeführt.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Bildsprache »mit der Schärfe des Schwertes« und die theologisch gewichtige Wendung »dem Untergang weihen« bleiben erhalten; der Satzbau wurde für gute heutige Lesbarkeit leicht gegliedert.
