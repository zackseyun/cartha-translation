    rationale: Die Formulierung vermittelt Hingabe zum Untergang, lässt aber die im hebräischen Verb liegende Bann-Kategorie zu sehr im Hintergrund. Eine explizite Nennung des Banns verbessert die semantische Präzision, ohne eine konfessionelle Deutung hinzuzufügen.
  - severity: low
    issue: „mit der Schärfe des Schwertes“ wirkt in modernem Standarddeutsch leicht künstlich.
    rationale: „Mit der Schneide des Schwertes“ erhält das Bild von פי חרב und ist zugleich geläufiger.
