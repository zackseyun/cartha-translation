  to: An jenem Tag nahm Josua Makkeda ein und schlug die Stadt mit der Schneide des Schwertes. Ihren König und alle Menschen darin weihte er dem Bann zur Vernichtung; er ließ keinen Überlebenden übrig. Mit dem König von Makkeda verfuhr er so, wie er mit dem König von Jericho verfahren war.
