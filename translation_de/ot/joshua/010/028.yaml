review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Abfolge und die zentralen Aussagen des Hebräischen zutreffend wieder: Einnahme der Stadt, Schlag „mit der Schneide des Schwertes“, Bannvollzug an König und Einwohnern, kein Überlebender sowie der Vergleich mit dem König von Jericho. „Dem Untergang weihen“ deutet חרם zwar an, macht den im Kontext wesentlichen Bann jedoch nicht ausdrücklich genug kenntlich.'
  naturalness: „Mit der Schärfe des Schwertes“ ist verständlich, aber im heutigen Standarddeutsch weniger natürlich als „mit der Schneide des Schwertes“. Die Satzgliederung und die Wiedergabe von עשה + ל durch „verfuhr ... so“ sind idiomatisch.
  terminology: „Dem Bann zur Vernichtung weihen“ bewahrt sowohl die kultisch-rechtliche Kategorie חרם als auch deren im Kontext ausgedrückte Folge. Die etablierten deutschen Namensformen Josua, Makkeda und Jericho sind passend.
