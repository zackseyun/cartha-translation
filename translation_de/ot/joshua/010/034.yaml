source:
  edition: WLC
  text: וַ/יַּעֲבֹ֣ר יְ֠הוֹשֻׁעַ וְ/כָל יִשְׂרָאֵ֥ל עִמּ֛/וֹ מִ/לָּכִ֖ישׁ עֶגְלֹ֑נָ/ה וַ/יַּחֲנ֣וּ עָלֶ֔י/הָ וַ/יִּֽלָּחֲמ֖וּ עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/034.yaml
  text: Then Joshua, and all Israel with him, passed on from Lachish to Eglon; and they camped against it and fought against it.
translation:
  language: de
  text: Dann zog Josua mit ganz Israel von Lachisch nach Eglon weiter. Sie schlugen vor der Stadt ihr Lager auf und kämpften gegen sie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: zog … weiter
  rationale: Das Verb עבר bezeichnet hier im fortlaufenden Feldzugsbericht die Bewegung von einer Stadt zur nächsten; „weiterziehen“ gibt dies natürlich wieder, ohne einen nicht genannten Übergang über ein Hindernis anzunehmen.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: mit ganz Israel
  rationale: Die komitative Wendung wird in natürlichem Deutsch zusammengezogen; „ganz Israel“ bewahrt die kollektive Bezeichnung des hebräischen Textes.
- source_word: מִלָּכִישׁ עֶגְלֹנָה
  choice: von Lachisch nach Eglon
  rationale: מִן markiert den Ausgangspunkt, und das Richtungs-ה an עֶגְלוֹן das Ziel der Bewegung.
- source_word: וַיַּחֲנוּ עָלֶיהָ
  choice: Sie schlugen vor der Stadt ihr Lager auf
  rationale: חנה bezeichnet das Lagern; עַל hat im Belagerungszusammenhang feindliche Ausrichtung. „Vor der Stadt“ ist idiomatisches Deutsch und macht den Ortsbezug des femininen Pronomens eindeutig.
- source_word: וַיִּלָּחֲמוּ עָלֶיהָ
  choice: und kämpften gegen sie
  rationale: Die Niphalform von לחם ist die übliche Bezeichnung für kämpfen; עַל bezeichnet das Ziel der feindlichen Handlung. Das Pronomen bezieht sich auf die Stadt Eglon.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zwei hebräischen Hauptsatzfolgen werden in zwei deutsche Sätze gegliedert. „Ganz Israel“ bleibt als kollektive Aussage erhalten; der militärische Zusammenhang wird klar wiedergegeben, ohne zusätzliche Einzelheiten einzutragen.
