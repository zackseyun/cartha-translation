source:
  edition: WLC
  text: וַ/יִּתֵּן֩ יְהוָ֨ה אֶת לָכִ֜ישׁ בְּ/יַ֣ד יִשְׂרָאֵ֗ל וַֽ/יִּלְכְּדָ/הּ֙ בַּ/יּ֣וֹם הַ/שֵּׁנִ֔י וַ/יַּכֶּ֣/הָ לְ/פִי חֶ֔רֶב וְ/אֶת כָּל הַ/נֶּ֖פֶשׁ אֲשֶׁר בָּ֑/הּ כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה לְ/לִבְנָֽה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/032.yaml
  text: And Yahweh gave Lachish into the hand of Israel[a], and he captured it on the second day and struck it with the edge of the sword, along with every person who was in it, just as he had done to Libnah.
translation:
  language: de
  text: Und der HERR gab Lachisch in die Hand Israels. Am zweiten Tag nahm Josua die Stadt ein und schlug sie mit der Schärfe des Schwertes, samt allen Menschen, die darin waren,[a] ganz so, wie er es mit Libna getan hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »jede Seele, die darin war«; gemeint sind alle Menschen in der Stadt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: der HERR
  rationale: Die in deutschen Bibeln geläufige Wiedergabe des Gottesnamens wahrt dessen besondere Funktion im Text und ist für heutige Leser verständlich.
- source_word: וַיִּתֵּן ... בְּיַד
  choice: gab ... in die Hand
  rationale: Bewahrt das hebräische Macht- und Übergabebild und ist im biblisch-gehobenen Deutsch verständlich.
- source_word: לָכִישׁ
  choice: Lachisch
  rationale: Entspricht der etablierten deutschen Form des Ortsnamens.
- source_word: וַיִּלְכְּדָהּ
  choice: nahm ... die Stadt ein
  rationale: Gibt den militärischen Sinn des Verbs natürlich wieder; das feminine Pronomen bezieht sich auf die Stadt Lachisch.
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: am zweiten Tag
  rationale: Direkte und natürliche Wiedergabe der zeitlichen Angabe, ohne sie als bloß »am nächsten Tag« zu interpretieren.
- source_word: וַיַּכֶּהָ לְפִי חֶרֶב
  choice: schlug sie mit der Schärfe des Schwertes
  rationale: Bewahrt sowohl die Kraft von נכה als auch das hebräische Bild der Schwertschneide, ohne die Gewalt des Berichts abzuschwächen.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: alle Menschen, die darin waren
  rationale: נֶפֶשׁ bezeichnet hier Menschen beziehungsweise Personen, nicht eine vom Körper getrennte Seele.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה לְלִבְנָה
  choice: ganz so, wie er es mit Libna getan hatte
  rationale: Erhält den singularischen Handelnden des Hebräischen und stellt die rückblickende Vergleichsbeziehung idiomatisch dar.
theological_decisions:
- issue: Gottesname יְהוָה
  choice: der HERR
  alternative: Jahwe
  rationale: Die traditionelle deutsche Wiedergabe macht den besonderen Gottesnamen erkennbar, ohne eine unsichere Vokalisierung in den Haupttext einzutragen.
- issue: Eroberungsformel über die Tötung der Stadtbevölkerung
  choice: samt allen Menschen, die darin waren
  alternative: und jede Seele, die darin war
  rationale: Die Wiedergabe wahrt die uneingeschränkte Aussage und vermeidet zugleich, נֶפֶשׁ als Aussage über eine Leib-Seele-Trennung misszuverstehen.
- issue: Subjekt im abschließenden Vergleich
  choice: wie er es mit Libna getan hatte
  alternative: wie sie es mit Libna getan hatten
  rationale: Das hebräische Verb steht im Singular. Im Erzählzusammenhang ist Josua als handelnder Anführer zu verstehen; die Form wird nicht kollektiv in den Plural aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit maßvoll bewahrter hebräischer Bildsprache. »Josua« wird als Subjekt des zweiten Satzes ausdrücklich genannt, weil das deutsche Pronomen »er« unmittelbar nach »Israel« missverständlich wäre; das Hebräische setzt den singularischen Handlungsträger aus dem Kontext voraus.
