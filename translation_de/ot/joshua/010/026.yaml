  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּכֵּ֨/ם יְהוֹשֻׁ֤עַ אַֽחֲרֵי כֵן֙ וַ/יְמִיתֵ֔/ם וַ/יִּתְלֵ֕/ם עַ֖ל חֲמִשָּׁ֣ה עֵצִ֑ים וַ/יִּֽהְי֛וּ תְּלוּיִ֥ם עַל הָ/עֵצִ֖ים עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/026.yaml
  text: After this Joshua struck them down and put them to death[a], and he hanged them on five trees; and they remained hanging on the trees until the evening.
translation:
  language: de
  text: Danach schlug Josua sie nieder und tötete sie. Er hängte sie an fünf Bäume[a], und sie blieben bis zum Abend an den Bäumen hängen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an fünf Holzpfähle“. Das hebräische Wort kann „Baum“ oder „Holz“ bedeuten; die genaue Art der Vorrichtung wird nicht genannt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּם
  choice: schlug Josua sie nieder
  rationale: Das Hifil von נכה mit Objektsuffix bezeichnet hier einen gewaltsamen Schlag. „Niederschlagen“ wahrt die Abfolge zum folgenden ausdrücklichen „tötete sie“, ohne beide Verben zusammenzuziehen.
- source_word: אַחֲרֵי כֵן
  choice: Danach
  rationale: Natürliche, knappe Wiedergabe der zeitlichen Abfolge im modernen Deutschen.
- source_word: וַיְמִיתֵם
  choice: tötete sie
  rationale: Das Hifil von מות bedeutet, den Tod herbeizuführen. „Tötete sie“ ist im Deutschen klar und würdig; der Hinrichtungscharakter ergibt sich aus dem Zusammenhang.
- source_word: וַיִּתְלֵם
  choice: hängte sie
  rationale: תלה bezeichnet das Aufhängen beziehungsweise öffentliche Ausstellen eines Körpers an Holz oder einem Baum. Die Wiedergabe legt nicht unnötig fest, ob es sich um Hängen oder Pfählen als konkrete Methode handelte.
- source_word: עַל חֲמִשָּׁה עֵצִים
  choice: an fünf Bäume
  rationale: עֵץ bezeichnet gewöhnlich Baum oder Holz. „Bäume“ gibt den unmittelbaren Sinn wieder, ohne spezifische Vorrichtungen wie Pfähle oder Galgen einzutragen.
- source_word: וַיִּהְיוּ תְּלוּיִם
  choice: sie blieben … hängen
  rationale: Die Verbindung von היה mit dem passiven Partizip beschreibt einen fortdauernden Zustand.
- source_word: עַד הָעָרֶב
  choice: bis zum Abend
  rationale: Nahe und idiomatische Wiedergabe des zeitlichen Endpunkts; „Sonnenuntergang“ wäre präzisierender als der hebräische Ausdruck.
theological_decisions:
- issue: Bedeutung von עֵץ im Zusammenhang einer Hinrichtung und öffentlichen Zurschaustellung
  choice: Bäume
  alternative: Holzpfähle; Galgen
  rationale: Der Text bestimmt die Art der Vorrichtung nicht genauer. „Bäume“ bewahrt die konkrete Grundbedeutung und vermeidet spätere oder technisch präzisere Vorstellungen.
- issue: Konkrete Art des Aufhängens bei תלה
  choice: hängte sie
  alternative: pfählte sie
  rationale: Das Hebräische bezeichnet sicher das Befestigen beziehungsweise Ausstellen der Körper an Holz, lässt die genaue Methode hier jedoch offen. Die Übersetzung erhält diese Unbestimmtheit.
translation_notes:
  register: Modernes, klares und würdiges Erzähldeutsch. Die kurzen Hauptsätze bewahren die markante Handlungsfolge des Hebräischen. Die Formulierung vermeidet sowohl archaisches „erschlug“ als auch eine übergenaue Festlegung auf Pfählung oder Galgen.
