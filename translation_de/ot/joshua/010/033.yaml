base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/033.yaml
  text: Then Horam king of Gezer went up to help Lachish[a], and Joshua struck him and his people until he left him no survivor.
translation:
  language: de
  text: Da zog Horam, der König von Geser, hinauf, um Lachisch zu helfen. Josua schlug ihn und sein Volk, bis ihm kein Überlebender[a] mehr blieb.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »kein Übriggebliebener«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Da
  rationale: Leitet in natürlichem deutschem Erzählstil das nächste Ereignis in der zeitlichen Abfolge ein.
- source_word: עָלָה
  choice: zog ... hinauf
  rationale: Bewahrt die Aufwärtsbewegung des hebräischen Verbs und passt zugleich zum militärischen Kontext, ohne ausdrücklich »marschieren« einzutragen.
- source_word: הֹרָם
  choice: Horam
  rationale: Der Personenname wird nach seiner üblichen deutschen Form wiedergegeben.
- source_word: מֶלֶךְ גֶּזֶר
  choice: der König von Geser
  rationale: Gibt die hebräische Genitivverbindung klar und idiomatisch wieder.
- source_word: לַעְזֹר אֶת לָכִישׁ
  choice: um Lachisch zu helfen
  rationale: Der Infinitiv bezeichnet den Zweck des Hinaufziehens; »helfen« ist eine klare und nicht überdeutende Wiedergabe von עזר.
- source_word: וַיַּכֵּהוּ
  choice: Doch Josua schlug ihn
  rationale: »schlug« bewahrt die Bildhaftigkeit von נכה; »doch« macht den im Zusammenhang erkennbaren Gegensatz natürlich kenntlich, ohne das Ergebnis bereits als »besiegen« auszulegen.
- source_word: וְאֶת עַמּוֹ
  choice: und sein Volk
  rationale: עַם bedeutet allgemein »Volk«; »Heer« wäre im militärischen Zusammenhang möglich, würde den Ausdruck jedoch verengen.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ
  choice: bis ihm kein ... mehr blieb
  rationale: Gibt die erreichte Grenze beziehungsweise das Ergebnis idiomatisch wieder. Der deutsche Satz vermeidet eine mögliche Unklarheit darüber, wer jemanden zurückließ.
- source_word: שָׂרִיד
  choice: Überlebender
  rationale: Bezeichnet hier einen Menschen, der den Schlag überlebt beziehungsweise übrig bleibt; die Alternative »Übriggebliebener« wird in der Fußnote erhalten.
theological_decisions: []
