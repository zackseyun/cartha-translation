  text: וַ/יָּ֧שָׁב יְהוֹשֻׁ֛עַ וְ/כָל יִשְׂרָאֵ֥ל עִמּ֖/וֹ דְּבִ֑רָ/ה וַ/יִּלָּ֖חֶם עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/038.yaml
  text: Then Joshua[a], and all Israel with him, returned to Debir and fought against it.
translation:
  language: de
  text: Dann kehrte Josua mit ganz Israel nach Debir zurück und kämpfte gegen die Stadt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: kehrte … zurück
  rationale: Das Verb שׁוב bezeichnet hier im erzählenden Zusammenhang die Rückkehr beziehungsweise Umkehr zu einem Ort; „kehrte … zurück“ gibt die Bewegung natürlich und präzise wieder.
- source_word: יְהוֹשֻׁעַ
  choice: Josua
  rationale: Der Personenname wird gemäß der etablierten deutschen Bibeltradition wiedergegeben.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: mit ganz Israel
  rationale: Die Formulierung gibt sowohl das kollektive כָל יִשְׂרָאֵל als auch עִמּוֹ idiomatisch wieder. Die Begleitung Josuas bleibt eindeutig.
- source_word: דְּבִרָה
  choice: nach Debir
  rationale: Das Richtungs-He bezeichnet eine Bewegung auf Debir zu; nach einem Verb der Rückkehr ist „nach Debir“ im Deutschen idiomatisch.
- source_word: וַיִּלָּחֶם
  choice: kämpfte
  rationale: לחם im Niphal bezeichnet hier das Kämpfen beziehungsweise den Kampf gegen einen Gegner; „kämpfte“ ist direkt und vermeidet die stärkere Deutung „griff an“.
- source_word: עָלֶיהָ
  choice: gegen die Stadt
  rationale: Das feminine Suffix bezieht sich auf Debir als Stadt. Da „gegen sie“ im Deutschen missverständlich wirken könnte und „gegen es“ grammatisch an den Namen Debir anschlösse, macht „gegen die Stadt“ den Bezug klar.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper erzählerischer Syntax. „Ganz Israel“ bewahrt die kollektive Ausdrucksweise, ohne ausdrücklich festzulegen, ob ausnahmslos die gesamte Bevölkerung oder die begleitende Streitmacht gemeint ist.
