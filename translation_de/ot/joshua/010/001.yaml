revisions:
- from: Als Adoni-Zedek, der König von Jerusalem, hörte, dass Josua Ai eingenommen und dem Untergang geweiht hatte[a] – dass er also mit Ai und seinem König genauso verfahren war wie mit Jericho und dessen König – und dass die Einwohner von Gibeon mit Israel Frieden geschlossen hatten[b] und nun mitten unter ihnen lebten,
  to: Als Adoni-Zedek, der König von Jerusalem, hörte, dass Josua Ai eingenommen und der Vernichtung geweiht hatte[a], dass er, wie er mit Jericho und dessen König verfahren war, ebenso mit Ai und dessen König verfahren war und dass die Einwohner von Gibeon mit Israel Frieden geschlossen hatten[b] und in Israels Mitte waren,
  rationale: Die Revision entfernt nicht belegte Zusätze, macht den Bezug von „in Israels Mitte“ eindeutig und bildet die hebräische Vergleichskonstruktion präziser nach. Der Vers bleibt, entsprechend dem Original und dem Satzanschluss in Josua 10,2, als einleitender Nebensatz offen.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T09:40:41Z'
review_pass:
  verdict: revise
  source_fidelity: Die Grundstruktur des offenen Temporalsatzes, die Orts- und Personennamen sowie die Wiedergabe von לכד und השלימוּ sind zutreffend. Allerdings fügt „nun“ eine nicht ausgedrückte Zeitnuance hinzu, und „lebten“ ist stärker und spezifischer als וַיִּהְיוּ בְּקִרְבָּם („waren in ihrer/Israels Mitte“). Das Pronomen „ihnen“ kann zudem missverständlich auf die unmittelbar zuvor genannten Einwohner von Gibeon bezogen werden. Die Vergleichsstruktur sollte ohne das interpretierende „also“ klarer am Hebräischen orientiert wiedergegeben werden.
  naturalness: Der Satz bleibt angemessen offen für den in Vers 2 folgenden Hauptsatz. Die revidierte Fassung ist modernes, würdiges Standarddeutsch und entflechtet den langen Vergleich ohne Gedankenstriche. „In Israels Mitte waren“ ist zwar leicht formeller, aber idiomatisch und für den erzählerischen Registerton passend.
  terminology: „Der Vernichtung geweiht“ gibt חרם verständlich wieder und bewahrt gegenüber bloßem „vernichtet“ die besondere Bestimmung zur Vernichtung. Die Fußnote erläutert den Bann-Bezug. „Frieden geschlossen“ ist für הִשְׁלִימוּ sachgerecht; „Friedensvertrag“ wäre als Alternative unnötig rechtstechnisch und enger als der hebräische Ausdruck.
  issues:
  - severity: medium
    issue: „nun mitten unter ihnen lebten“ erweitert und verunklart die Aussage.
    rationale: וַיִּהְיוּ בְּקִרְבָּם besagt, dass die Gibeoniter „in ihrer Mitte/unter ihnen waren“. Weder „nun“ noch „lebten“ steht im Hebräischen. Das Pronomen kann im Deutschen zudem fälschlich auf die Einwohner von Gibeon statt auf Israel bezogen werden.
  - severity: low
    issue: Die Vergleichsformulierung mit „dass er also“ ist weniger quellennah.
    rationale: Das hebräische כַּאֲשֶׁר … כֵּן stellt ausdrücklich Jericho samt König und Ai samt König parallel. Eine direkte korrelative Wiedergabe ist klarer und vermeidet die zusätzliche Schlussfolgerungsnuance von „also“.
  - severity: low
    issue: Die alternative Fußnote „Friedensvertrag“ ist zu spezifisch.
    rationale: הִשְׁלִימוּ bezeichnet Friedensschluss beziehungsweise friedliche Beziehungen, ohne ausdrücklich eine bestimmte Vertragsform zu benennen.
