source:
  edition: WLC
  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ אֲדֹֽנִי צֶ֜דֶק מֶ֣לֶךְ יְרוּשָׁלִַ֗ם כִּֽי לָכַ֨ד יְהוֹשֻׁ֣עַ אֶת הָ/עַי֮ וַ/יַּחֲרִימָ/הּ֒ כַּ/אֲשֶׁ֨ר עָשָׂ֤ה לִֽ/ירִיחוֹ֙ וּ/לְ/מַלְכָּ֔/הּ כֵּן עָשָׂ֥ה לָ/עַ֖י וּ/לְ/מַלְכָּ֑/הּ וְ/כִ֨י הִשְׁלִ֜ימוּ יֹשְׁבֵ֤י גִבְעוֹן֙ אֶת יִשְׂרָאֵ֔ל וַ/יִּֽהְי֖וּ בְּ/קִרְבָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/001.yaml
  text: It happened[a], when Adoni-zedek king of Jerusalem heard that Joshua had captured Ai and had devoted it to destruction, just as he had done to Jericho and its king, so he had done to Ai and its king, and that the inhabitants of Gibeon had made peace with Israel and were among them[b],
translation:
  language: de
  text: Als Adoni-Zedek, der König von Jerusalem, hörte, dass Josua Ai eingenommen und der Vernichtung geweiht hatte[a], dass er, wie er mit Jericho und dessen König verfahren war, ebenso mit Ai und dessen König verfahren war und dass die Einwohner von Gibeon mit Israel Frieden geschlossen hatten[b] und in Israels Mitte waren,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vollständig vernichtet“; das hebräische Verb bezeichnet hier, dass etwas dem Bann und damit der Vernichtung übergeben wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mit Israel Frieden vereinbart hatten“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי כִשְׁמֹעַ
  choice: Als ... hörte
  rationale: Die deutsche temporale Nebensatzkonstruktion gibt die hebräische Episodeneröffnung mit Infinitivkonstruktion natürlich wieder. Da der Satz in Vers 2 weitergeführt wird, bleibt Vers 1 syntaktisch offen.
- source_word: אֲדֹנִי צֶדֶק
  choice: Adoni-Zedek
  rationale: Der Personenname wird transliteriert; der Bindestrich macht die zusammengesetzte Namensform lesbar.
- source_word: לָכַד
  choice: eingenommen
  rationale: Im Zusammenhang mit einer Stadt bezeichnet das Verb deren militärische Einnahme; „eingenommen“ ist im Deutschen präzise und idiomatisch.
- source_word: וַיַּחֲרִימָהּ
  choice: dem Untergang geweiht hatte
  rationale: Die Form von חרם bezeichnet nicht nur Zerstörung, sondern die unter Bann beziehungsweise der Vernichtung übergebene Sache. Die Formulierung bewahrt den sakralen und gerichtlichen Beiklang, ohne Fachjargon zu verwenden.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: genauso ... wie
  rationale: Die korrelative Vergleichskonstruktion wird in natürlicher deutscher Wortstellung wiedergegeben.
- source_word: עָשָׂה לְ
  choice: mit ... verfahren war
  rationale: „Mit jemandem oder etwas verfahren“ gibt עשה mit ל idiomatisch wieder und ermöglicht es, die Wiederholung des Vergleichs klar zu erhalten.
- source_word: הִשְׁלִימוּ ... אֶת
  choice: mit ... Frieden geschlossen hatten
  rationale: Der Hifil von שלם bezeichnet hier das Herstellen friedlicher Beziehungen beziehungsweise einen Friedensschluss.
- source_word: יֹשְׁבֵי גִבְעוֹן
  choice: die Einwohner von Gibeon
  rationale: Das substantivierte Partizip bezeichnet die Bewohner der Stadt; „Einwohner“ ist modernes Standarddeutsch.
- source_word: וַיִּהְיוּ בְּקִרְבָּם
  choice: nun mitten unter ihnen lebten
  rationale: בקרבם bedeutet „in ihrer Mitte/mitten unter ihnen“. „Lebten“ verdeutlicht im Deutschen den aus dem Kontext hervorgehenden Zustand der Einwohner; „nun“ markiert die resultative Fortsetzung, ohne ein ausdrücklich hebräisches Zeitadverb zu behaupten.
theological_decisions:
- issue: Wiedergabe der חרם-Terminologie im Eroberungskontext
  choice: dem Untergang geweiht
  alternative: vollständig vernichtet; dem Bann übergeben
  rationale: חרם enthält neben der tatsächlichen Vernichtung den Gedanken einer unwiderruflichen Bestimmung unter göttlichem Gericht. „Dem Untergang geweiht“ bewahrt diese Spannung, ohne sie auf bloße militärische Zerstörung zu reduzieren oder mit dem erklärungsbedürftigen Fachwort „Bann“ zu belasten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers bleibt als einleitender Temporalsatz offen, weil der Hauptsatz erst in Vers 2 folgt. Gedankenstriche ordnen den langen hebräischen Satz und erhalten zugleich den Vergleich zwischen Jericho und Ai.
