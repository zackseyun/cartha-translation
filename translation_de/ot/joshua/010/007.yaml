  text: וַ/יַּ֨עַל יְהוֹשֻׁ֜עַ מִן הַ/גִּלְגָּ֗ל ה֚וּא וְ/כָל עַ֤ם הַ/מִּלְחָמָה֙ עִמּ֔/וֹ וְ/כֹ֖ל גִּבּוֹרֵ֥י הֶ/חָֽיִל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/007.yaml
  text: So Joshua went up from Gilgal[a], he and all the fighting men with him[b], and all the mighty men of valor.
translation:
  language: de
  text: Da zog Josua von Gilgal hinauf, er und das ganze Kriegsvolk mit ihm und alle tapferen Krieger.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: zog … hinauf
  rationale: עלה bezeichnet eine Aufwärtsbewegung. „Zog hinauf“ bewahrt die Richtungsangabe und passt zugleich natürlich zum gemeinsamen militärischen Aufbruch, ohne das Verb mit „marschierte“ zu stark festzulegen.
- source_word: מִן הַגִּלְגָּל
  choice: von Gilgal
  rationale: Direkte und idiomatische Wiedergabe der Präposition מן mit dem Ortsnamen.
- source_word: הוּא
  choice: er
  rationale: Das ausdrücklich gesetzte Pronomen wird in der Beifügung „er und …“ erhalten und hebt hervor, dass Josua selbst mitzieht.
- source_word: כָל עַם הַמִּלְחָמָה
  choice: das ganze Kriegsvolk
  rationale: Die Wendung bedeutet wörtlich „das ganze Volk des Krieges/Kampfes“ und bezeichnet hier die gesamte mitziehende Kampftruppe. „Kriegsvolk“ ist knapp, verständlich und erhält das kollektive עַם.
- source_word: עִמּוֹ
  choice: mit ihm
  rationale: Schlichte, genaue Wiedergabe der Präposition עם mit dem pronominalen Suffix.
- source_word: כֹל גִּבּוֹרֵי הֶחָיִל
  choice: alle kampfstarken Männer
  rationale: Die feste Wendung bezeichnet starke, tüchtige und bewährte Männer, hier eindeutig im militärischen Zusammenhang. „Kampfstark“ gibt Stärke und Kriegstüchtigkeit wieder und unterscheidet die Gruppe sprachlich vom zuvor genannten gesamten Kriegsvolk.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die koordinierte Satzstruktur des Hebräischen bleibt erhalten. „Kriegsvolk“ und „kampfstarke Männer“ bilden die zwei unterschiedlichen militärischen Bezeichnungen des Ausgangstextes ab, ohne altertümliches „Helden der Tapferkeit“ oder eine unnötig präzisierende Rangbezeichnung.
