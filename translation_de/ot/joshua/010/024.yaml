source:
  edition: WLC
  text: וַ֠/יְהִי כְּֽ/הוֹצִיאָ֞/ם אֶת הַ/מְּלָכִ֣ים הָ/אֵלֶּה֮ אֶל יְהוֹשֻׁעַ֒ וַ/יִּקְרָ֨א יְהוֹשֻׁ֜עַ אֶל כָּל אִ֣ישׁ יִשְׂרָאֵ֗ל וַ֠/יֹּאמֶר אֶל קְצִינֵ֞י אַנְשֵׁ֤י הַ/מִּלְחָמָה֙ הֶ/הָלְכ֣וּא אִתּ֔/וֹ קִרְב֗וּ שִׂ֚ימוּ אֶת רַגְלֵי/כֶ֔ם עַֽל צַוְּארֵ֖י הַ/מְּלָכִ֣ים הָ/אֵ֑לֶּה וַֽ/יִּקְרְב֔וּ וַ/יָּשִׂ֥ימוּ אֶת רַגְלֵי/הֶ֖ם עַל צַוְּארֵי/הֶֽם־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/024.yaml
  text: And when they brought these kings out to Joshua[a], Joshua called all the men of Israel and said to the commanders of the men of war who had gone with him, “Come near[b]; put your feet on the necks of these kings.” So they came near and put their feet on their necks.
translation:
  language: de
  text: 'Als sie diese Könige zu Josua herausgebracht hatten, rief Josua alle Männer Israels[a] zusammen. Zu den Befehlshabern der Krieger[b], die mit ihm gezogen waren, sagte er: »Tretet her und setzt eure Füße auf die Nacken dieser Könige!« Da traten sie her und setzten ihre Füße auf die Nacken der Könige.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »jeden Mann Israels«; im militärischen Zusammenhang sind die beim Heer versammelten Männer gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »die Anführer der Kriegsleute«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּהוֹצִיאָם
  choice: Als sie ... herausgebracht hatten
  rationale: Die hebräische Erzählungsformel mit כְּ und Infinitiv wird als natürlicher deutscher Temporalsatz wiedergegeben; das Plusquamperfekt bezeichnet die der Rede vorausgehende Handlung.
- source_word: וַיִּקְרָא ... אֶל כָּל אִישׁ יִשְׂרָאֵל
  choice: rief Josua alle Männer Israels zusammen
  rationale: Die Formulierung bewahrt den ausdrücklich männlichen Bezug im militärischen Zusammenhang; »zusammenrufen« gibt die hier gemeinte Aufforderung zum Herantreten idiomatisch wieder.
- source_word: קְצִינֵי אַנְשֵׁי הַמִּלְחָמָה
  choice: die Befehlshaber der Krieger
  rationale: קְצִינִים bezeichnet militärische Führer, während אַנְשֵׁי הַמִּלְחָמָה die kämpfenden Männer meint. Die Wiedergabe ist präzise und in modernem Deutsch verständlich.
- source_word: הֶהָלְכוּא אִתּוֹ
  choice: die mit ihm gezogen waren
  rationale: Das attributiv gebrauchte Verb kennzeichnet die Befehlshaber als Josuas Begleiter im Feldzug; »gezogen waren« erhält den militärisch-erzählerischen Ton.
- source_word: קִרְבוּ
  choice: Tretet her
  rationale: Der Imperativ fordert zu einer unmittelbaren räumlichen Annäherung auf. »Tretet her« ist knapp, natürlich und würdevoll.
- source_word: שִׂימוּ אֶת רַגְלֵיכֶם עַל צַוְּארֵי
  choice: setzt eure Füße auf die Nacken
  rationale: Die konkrete Geste der Unterwerfung wird ohne Abschwächung oder erklärende Umdeutung wiedergegeben.
- source_word: וַיִּקְרְבוּ וַיָּשִׂימוּ
  choice: Da traten sie her und setzten
  rationale: »Da« führt die unmittelbare Ausführung des Befehls flüssig fort und bewahrt die Abfolge der hebräischen Erzählungsverben.
theological_decisions:
- issue: Geschlechtsspezifische Sprache in כָּל אִישׁ יִשְׂרָאֵל und אַנְשֵׁי הַמִּלְחָמָה
  choice: alle Männer Israels / Krieger
  alternative: ganz Israel / alle Israeliten / Kämpfende
  rationale: Der militärische Kontext und die männlichen hebräischen Ausdrücke sprechen hier konkret von den zum Heer gehörenden Männern; eine geschlechtsneutrale Verallgemeinerung würde diese Aussage einebnen.
- issue: Darstellung der Unterwerfungsgeste
  choice: setzt eure Füße auf die Nacken dieser Könige
  alternative: besiegt oder unterwerft diese Könige
  rationale: Der Text schildert eine konkrete, symbolträchtige Handlung. Die Übersetzung bewahrt deren Härte und Bildlichkeit, ohne sie moralisch oder theologisch zu glätten.
- issue: Bezug des abschließenden Pronomens עַל צַוְּארֵיהֶם
  choice: auf ihre Nacken
  alternative: auf die Nacken der Könige
  rationale: Das Pronomen bezieht sich grammatisch und kontextuell auf die Könige. Die deutsche Form erhält die knappe Wiederaufnahme des Hebräischen, auch wenn »ihre« formal mehrdeutig erscheinen kann.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die militärischen Bezeichnungen bleiben konkret; die drastische Unterwerfungsgeste wird nicht abgeschwächt. Die Fußnotenmarker wurden an den Ausdrücken angebracht, auf die sich die jeweiligen Hinweise tatsächlich beziehen.
