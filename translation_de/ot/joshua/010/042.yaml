source:
  edition: WLC
  text: וְ/אֵ֨ת כָּל הַ/מְּלָכִ֤ים הָ/אֵ֨לֶּה֙ וְ/אֶת אַרְצָ֔/ם לָכַ֥ד יְהוֹשֻׁ֖עַ פַּ֣עַם אֶחָ֑ת כִּ֗י יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל נִלְחָ֖ם לְ/יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/042.yaml
  text: Joshua captured all these kings and their land at one time[a], because Yahweh, the God of Israel, fought for Israel.
translation:
  language: de
  text: Josua nahm alle diese Könige gefangen und ihr Land in einem Zug ein[a], denn Jahwe, der Gott Israels, kämpfte für Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »einmal«; auch: »in einem einzigen Feldzug«.'
    reason: Die hebräische Wendung פַּעַם אֶחָת lautet wörtlich „einmal“ und kann im Kontext eine einheitliche militärische Unternehmung bezeichnen.
lexical_decisions:
- source_word: לָכַד
  choice: nahm … ein
  rationale: Das Verb bezeichnet im militärischen Zusammenhang das Einnehmen oder Erobern. „nahm … ein“ ist im Deutschen natürlich und wahrt den militärischen Sinn, ohne stärker auszudeuten als nötig.
- source_word: וְאֵת כָּל הַמְּלָכִים הָאֵלֶּה
  choice: alle diese Könige
  rationale: Direkte und idiomatische Wiedergabe der markierten Objektphrase einschließlich des Demonstrativpronomens.
- source_word: וְאֶת אַרְצָם
  choice: und ihr Land
  rationale: אֶרֶץ bezeichnet hier den Herrschaftsbereich der Könige; „Land“ ist die weiteste und natürlichste deutsche Entsprechung.
- source_word: פַּעַם אֶחָת
  choice: in einem Zug
  rationale: Wörtlich „zu einer Zeit/einmal“. Im zusammenfassenden militärischen Kontext ist eine einzige zusammenhängende Unternehmung gemeint. „in einem Zug“ bewahrt die zeitliche Einheit und klingt natürlicher als „zu einer Zeit“; die engere Alternative wird in der Fußnote genannt.
- source_word: כִּי
  choice: denn
  rationale: Leitet die Begründung für Josuas Erfolg ein und verbindet sich im Deutschen flüssig mit dem vorangehenden Hauptsatz.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. „Jahwe“ ist die im modernen Deutschen übliche Form.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Direkte, idiomatische Wiedergabe der hebräischen Genitivverbindung.
- source_word: נִלְחָם לְיִשְׂרָאֵל
  choice: kämpfte für Israel
  rationale: Der Niphal von לחם mit ל bezeichnet den Kampf zugunsten Israels. Das Präteritum entspricht der erzählenden Zusammenfassung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. Die Wiedergabe „Jahwe“ erhält den Charakter als Eigenname, während „der HERR“ ihn durch einen Titel ersetzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „nahm … ein“ entspricht natürlichem militärischem Sprachgebrauch; „in einem Zug“ ist verständlich und knapp. Die Fußnote bewahrt sowohl die wörtliche Form als auch die kontextuelle Deutung.
