source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ יְהוֹשֻׁ֔עַ אַל תִּֽירְא֖וּ וְ/אַל תֵּחָ֑תּוּ חִזְק֣וּ וְ/אִמְצ֔וּ כִּ֣י כָ֗כָה יַעֲשֶׂ֤ה יְהוָה֙ לְ/כָל אֹ֣יְבֵי/כֶ֔ם אֲשֶׁ֥ר אַתֶּ֖ם נִלְחָמִ֥ים אוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/025.yaml
  text: And Joshua said to them[a], “Do not fear and do not be dismayed. Be strong and courageous, for thus Yahweh will do to all your enemies against whom you are fighting.”
translation:
  language: de
  text: 'Und Josua sagte zu ihnen: „Fürchtet euch nicht und lasst euch nicht entmutigen. Seid stark und mutig! Denn so wird Yahweh mit all euren Feinden verfahren, gegen die ihr kämpft.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם יְהוֹשֻׁעַ
  choice: Und Josua sagte zu ihnen
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; die Wortfolge wird für natürliches modernes Deutsch angepasst.
- source_word: אַל תִּירְאוּ
  choice: Fürchtet euch nicht
  rationale: Die negative Aufforderung gibt ירא direkt und zugleich idiomatisch wieder.
- source_word: וְאַל תֵּחָתּוּ
  choice: und lasst euch nicht entmutigen
  rationale: חתת im Nifal bezeichnet hier das innere Gebrochensein oder Verzagen. „Lasst euch nicht entmutigen“ ist gegenwärtiges, verständliches Deutsch und unterscheidet die Aussage von der vorausgehenden Furcht.
- source_word: חִזְקוּ וְאִמְצוּ
  choice: Seid stark und mutig
  rationale: Die wiederkehrende Ermutigungsformel in Josua wird knapp, würdig und geläufig wiedergegeben; die beiden Aspekte Stärke und entschlossener Mut bleiben erhalten.
- source_word: כִּי כָכָה
  choice: Denn so
  rationale: כִּי begründet die Aufforderung, während כָכָה auf das soeben vor Augen geführte Geschick der feindlichen Könige verweist.
- source_word: יַעֲשֶׂה יְהוָה לְכָל אֹיְבֵיכֶם
  choice: wird Yahweh mit all euren Feinden verfahren
  rationale: Der Jiqtol wird kontextgemäß zukünftig verstanden. „Mit ... verfahren“ gibt עשה לְ im Deutschen natürlicher wieder als das wörtliche „euren Feinden tun“.
- source_word: אֲשֶׁר אַתֶּם נִלְחָמִים אוֹתָם
  choice: gegen die ihr kämpft
  rationale: Die hebräische Relativkonstruktion mit vorangestelltem אֲשֶׁר und wiederaufnehmendem Pronomen wird in idiomatischer deutscher Syntax wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR
  rationale: Der im Ausgangstext ausdrücklich stehende Eigenname wird als „Yahweh“ wiedergegeben, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Die knappen Aufforderungen bewahren den nachdrücklichen Ton des Hebräischen. Eine Fußnote ist nicht nötig, da die Bedeutungsbreite von חתת mit „entmutigen“ im Kontext angemessen ausgedrückt wird.
