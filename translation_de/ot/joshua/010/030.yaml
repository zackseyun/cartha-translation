  to: Und Jahwe gab auch diese Stadt und ihren König in die Hand Israels. Josua schlug die Stadt und alle Menschen[a], die darin waren, mit der Schärfe des Schwertes. Er ließ darin keinen Überlebenden übrig und verfuhr mit ihrem König so, wie er mit dem König von Jericho verfahren war.
  rationale: Die Revision glättet die Objektverknüpfung des zweiten Satzes und vermeidet die nicht im Hebräischen ausgedrückte Verstärkung „genau“. Sie bewahrt den Kontextbezug auf Josua, die Bildsprache der Übergabe und des Schwertes sowie die sachliche Erklärung von נֶפֶשׁ.
