source:
  edition: WLC
  text: וַ/יִּתֵּן֩ יְהוָ֨ה גַּם אוֹתָ֜/הּ בְּ/יַ֣ד יִשְׂרָאֵ֘ל וְ/אֶת מַלְכָּ/הּ֒ וַ/יַּכֶּ֣/הָ לְ/פִי חֶ֗רֶב וְ/אֶת כָּל הַ/נֶּ֨פֶשׁ֙ אֲשֶׁר בָּ֔/הּ לֹֽא הִשְׁאִ֥יר בָּ֖/הּ שָׂרִ֑יד וַ/יַּ֣עַשׂ לְ/מַלְכָּ֔/הּ כַּ/אֲשֶׁ֥ר עָשָׂ֖ה לְ/מֶ֥לֶךְ יְרִיחֽוֹ־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/030.yaml
  text: And Yahweh also gave it and its king into the hand of Israel[a], and he struck it with the edge of the sword, and every person who was in it. He left no survivor in it, and he did to its king just as he had done to the king of Jericho.
translation:
  language: de
  text: Und Jahwe gab auch diese Stadt und ihren König in die Hand Israels. Josua schlug die Stadt und alle Menschen[a], die darin waren, mit der Schärfe des Schwertes. Er ließ darin keinen Überlebenden übrig und verfuhr mit ihrem König so, wie er mit dem König von Jericho verfahren war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „jede Seele, die darin war“; hier bezeichnet das hebräische Wort alle Personen in der Stadt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die geläufige deutsche Form des Gottesnamens gibt das Tetragramm als Eigennamen wieder, statt es durch einen Titel zu ersetzen.
- source_word: וַיִּתֵּן ... בְּיַד יִשְׂרָאֵל
  choice: gab ... in die Hand Israels
  rationale: Die deutsche Wendung bewahrt das hebräische Bild der Übergabe in Israels Gewalt und bleibt verständlich.
- source_word: גַּם
  choice: auch
  rationale: Das Wort kennzeichnet die Fortsetzung der zuvor erzählten Eroberungen.
- source_word: אוֹתָהּ ... וְאֶת מַלְכָּהּ
  choice: diese Stadt und ihren König
  rationale: Das feminine Pronomen verweist im Zusammenhang auf Libna; die ausdrückliche Wiedergabe als Stadt verhindert im Deutschen einen unklaren Bezug.
- source_word: וַיַּכֶּהָ
  choice: Josua schlug sie
  rationale: Das Verb נכה wird mit „schlagen“ wiedergegeben. Der im Hebräischen unausgesprochene Handlungsträger wird aus dem unmittelbaren Erzählzusammenhang als Josua benannt, damit „er“ nicht fälschlich auf Jahwe bezogen wird.
- source_word: לְפִי חֶרֶב
  choice: mit der Schneide des Schwertes
  rationale: Die Formulierung bewahrt das hebräische Bild vom Mund beziehungsweise von der Schneide des Schwertes in verständlichem Deutsch.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: alle Menschen, die darin waren
  rationale: נפש bezeichnet hier die in der Stadt befindlichen Personen und nicht ausdrücklich eine vom Körper getrennte Seele.
- source_word: לֹא הִשְׁאִיר ... שָׂרִיד
  choice: Er ließ in ihr keinen Überlebenden übrig
  rationale: שׂריד bezeichnet hier einen Überlebenden; die Formulierung gibt auch die Verneinung und das Verb „übrig lassen“ wieder.
- source_word: וַיַּעַשׂ לְמַלְכָּהּ כַּאֲשֶׁר עָשָׂה לְמֶלֶךְ יְרִיחוֹ
  choice: tat mit ihrem König genau das, was er mit dem König von Jericho getan hatte
  rationale: Die Wiederholung von עשה wird durch „tat/getan hatte“ bewahrt; das Plusquamperfekt verdeutlicht den zeitlichen Rückbezug.
theological_decisions:
- issue: Wiedergabe von נֶפֶשׁ im Zusammenhang eines Kriegsberichts
  choice: Menschen
  alternative: Seelen
  rationale: Das Wort bezeichnet an dieser Stelle die Personen in der Stadt. „Seelen“ könnte unbeabsichtigt eine spätere anthropologische Aussage über einen immateriellen Seelenteil nahelegen.
- issue: Unausgesprochenes Subjekt von וַיַּכֶּהָ und den folgenden Verben
  choice: Josua
  alternative: Israel oder ein mehrdeutiges „er“
  rationale: Der Erzählzusammenhang nennt Josua als Leiter des Feldzugs; die ausdrückliche Nennung verhindert, dass das deutsche Pronomen unmittelbar auf Jahwe bezogen wird. Zugleich wird keine zusätzliche theologische Aussage über Gottes unmittelbares Handeln beim Töten eingeführt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Bildsprache „in die Hand“ und „Schneide des Schwertes“ bleibt erhalten; unklare deutsche Pronomenbezüge werden durch „diese Stadt“ und „Josua“ aufgelöst.
