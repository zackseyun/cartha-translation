  text: וַ/יִּֽירְא֣וּ מְאֹ֔ד כִּ֣י עִ֤יר גְּדוֹלָה֙ גִּבְע֔וֹן כְּ/אַחַ֖ת עָרֵ֣י הַ/מַּמְלָכָ֑ה וְ/כִ֨י הִ֤יא גְדוֹלָה֙ מִן הָ/עַ֔י וְ/כָל אֲנָשֶׁ֖י/הָ גִּבֹּרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/002.yaml
  text: And they feared greatly[a], because Gibeon was a great city, like one of the royal cities, and because it was greater than Ai, and all its men were mighty.
translation:
  language: de
  text: Sie fürchteten sich sehr, weil Gibeon eine große Stadt war, wie eine der Königsstädte, und weil sie größer als Ai war und alle ihre Männer starke Krieger waren[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: mächtige Männer.'
    reason: גִּבֹּרִים kann starke, tüchtige oder heldenhafte Männer bezeichnen; im Kontext ist eine kriegerische Nuance naheliegend, aber nicht zwingend ausdrücklich zu machen.
lexical_decisions:
- source_word: וַיִּירְאוּ מְאֹד
  choice: Da fürchteten sie sich sehr
  rationale: Die Form führt die Erzählung fort; ירא bezeichnet Furcht, und מְאֹד verstärkt sie. Die deutsche Wendung ist natürlich und bewahrt die ausdrückliche Intensität.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier den Grund ihrer Furcht ein. „Denn“ gibt den kausalen Zusammenhang in einem flüssigen deutschen Erzählsatz wieder.
- source_word: עִיר גְּדוֹלָה
  choice: eine große Stadt
  rationale: גָּדוֹל kann sowohl räumliche Größe als auch Bedeutung bezeichnen. „Groß“ hält diese Bedeutungsbreite offen.
- source_word: גִּבְעוֹן
  choice: Gibeon
  rationale: Gebräuchliche deutsche Schreibung des Ortsnamens.
- source_word: כְּאַחַת עָרֵי הַמַּמְלָכָה
  choice: wie eine der Königsstädte
  rationale: Die Wendung bezeichnet eine Stadt königlichen Ranges beziehungsweise eine zum Königtum gehörende Stadt. „Königsstädte“ ist prägnant und idiomatisch.
- source_word: הִיא גְדוֹלָה מִן הָעַי
  choice: Sie war größer als Ai
  rationale: Das feminine Pronomen bezieht sich auf die Stadt. „Größer“ bewahrt wie im Hebräischen die mögliche Spannung zwischen Ausdehnung und Bedeutung.
- source_word: וְכָל אֲנָשֶׁיהָ
  choice: und alle ihre Männer
  rationale: Im militärischen Zusammenhang sind die männlichen Einwohner beziehungsweise die kampffähigen Männer gemeint; „Männer“ gibt dies genauer wieder als „Einwohner“.
- source_word: גִּבֹּרִים
  choice: starke Krieger
  rationale: גִּבּוֹרִים bezeichnet hier kampfstarke oder besonders tüchtige Männer. „Starke Krieger“ macht den militärischen Sinn deutlich, ohne eine spezielle Rangbezeichnung einzuführen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Die Wiederholung von „groß/größer“ spiegelt die hebräische Wortwahl und lässt offen, ob vor allem Größe, Rang oder beides gemeint ist.
