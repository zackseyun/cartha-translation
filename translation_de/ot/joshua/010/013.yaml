source:
  edition: WLC
  text: וַ/יִּדֹּ֨ם הַ/שֶּׁ֜מֶשׁ וְ/יָרֵ֣חַ עָמָ֗ד עַד יִקֹּ֥ם גּוֹי֙ אֹֽיְבָ֔י/ו הֲ/לֹא הִ֥יא כְתוּבָ֖ה עַל סֵ֣פֶר הַ/יָּשָׁ֑ר וַ/יַּעֲמֹ֤ד הַ/שֶּׁ֨מֶשׁ֙ בַּ/חֲצִ֣י הַ/שָּׁמַ֔יִם וְ/לֹא אָ֥ץ לָ/ב֖וֹא כְּ/י֥וֹם תָּמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/013.yaml
  text: So the sun stood still[a], and the moon stopped, until the nation took vengeance on its enemies[d][c][b]. Is this not written in the Book of Jashar? The sun stood still in the middle of the sky and did not hurry to set for about a full day.
translation:
  language: de
  text: Da stand die Sonne still, und der Mond blieb stehen, bis das Volk an seinen Feinden Rache genommen hatte.[a] Ist das nicht im Buch Jaschar geschrieben?[b] Die Sonne blieb mitten am Himmel stehen und eilte etwa einen ganzen Tag lang nicht ihrem Untergang entgegen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bis das Volk sich an seinen Feinden gerächt hatte“; die hebräische Wendung kann auch den Gedanken enthalten, dass es sich ihnen gegenüber Recht verschaffte.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „Buch Jaschar“; möglicherweise: „Buch des Aufrichtigen“.'
    reason: alternative_reading
  - marker: c
    text: 'Wörtlicher: „und beeilte sich etwa einen ganzen Tag lang nicht unterzugehen“. Die Wendung kann auch „wie einen ganzen Tag“ oder „nahezu einen ganzen Tag“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּדֹּם הַשֶּׁמֶשׁ
  choice: Da stand die Sonne still
  rationale: דמם kann Schweigen oder Stillstehen bezeichnen; zusammen mit dem parallel genannten Mond und im astronomischen Zusammenhang gibt „stand … still“ den Sinn natürlich wieder.
- source_word: וְיָרֵחַ עָמָד
  choice: und der Mond blieb stehen
  rationale: עמד bedeutet wörtlich „stehen“; „blieb stehen“ bezeichnet hier verständlich das Aufhören der Bewegung und wahrt die Parallelität.
- source_word: עַד יִקֹּם גּוֹי אֹיְבָיו
  choice: bis das Volk an seinen Feinden Rache genommen hatte
  rationale: Die Wendung beschreibt, wie das Volk gegen seine Feinde Vergeltung übt. „Volk“ ist im Deutschen für Israel als Kollektiv natürlicher als „Nation“.
- source_word: סֵפֶר הַיָּשָׁר
  choice: Buch Jaschar
  rationale: Jaschar wird als Titel beziehungsweise Eigenname transliteriert; die mögliche Bedeutungsübersetzung wird in einer Fußnote bewahrt.
- source_word: בַּחֲצִי הַשָּׁמַיִם
  choice: mitten am Himmel
  rationale: Dies gibt die räumliche Aussage idiomatisch und ohne altertümliche Ausdrucksweise wieder.
- source_word: וְלֹא אָץ לָבוֹא
  choice: eilte … nicht ihrem Untergang entgegen
  rationale: בוא bezeichnet bei der Sonne ihr Eingehen beziehungsweise Untergehen; die Formulierung macht dieses Ziel im Deutschen ausdrücklich, ohne die Aussage zu naturalisieren.
- source_word: כְּיוֹם תָּמִים
  choice: etwa einen ganzen Tag lang
  rationale: תמים bezeichnet Vollständigkeit; „etwa“ wahrt die ungefähre Vergleichsbedeutung der Präposition כ.
theological_decisions:
- issue: Art des astronomischen Wunders
  choice: Der Text wird unmittelbar als Stillstand von Sonne und Mond wiedergegeben.
  alternative: Die Aussage nur als beobachtungsbezogene oder ausschließlich poetische Beschreibung zu formulieren.
  rationale: Die Erzählung stellt das Geschehen als außergewöhnliches Ereignis dar. Die Übersetzung soll weder eine naturwissenschaftliche Harmonisierung hinzufügen noch die Aussage metaphorisch abschwächen.
- issue: Bedeutung der Vergeltungsformel
  choice: „an seinen Feinden Rache genommen hatte“
  alternative: „sich an seinen Feinden Recht verschafft hatte“
  rationale: Die Wendung lässt Vergeltung und Rechtsschaffung anklingen. Der Haupttext gibt den naheliegenden Vergeltungssinn wieder, während die mögliche Nuance der Rechtsschaffung in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche kosmische Aussage bleibt direkt stehen; idiomatische deutsche Formulierungen dienen nur der Verständlichkeit. Alle Fußnotenmarker stehen an der jeweils einschlägigen Stelle im Haupttext.
