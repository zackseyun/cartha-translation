revisions:
- from: Er nahm sie samt ihrem König und allen ihren Ortschaften ein. Sie schlugen sie mit der Schärfe des Schwertes und vollstreckten an allen Menschen darin den Bann[a]; er ließ keinen Überlebenden übrig. Wie er es mit Hebron gemacht hatte, so machte er es auch mit Debir und seinem König, ebenso wie er es mit Libna und seinem König gemacht hatte.
  to: Er nahm sie samt ihrem König und allen ihren Städten ein. Sie schlugen sie mit der Schneide des Schwertes und weihten jeden Menschen in ihr dem Bann zur Vernichtung[a]; er ließ keinen Überlebenden übrig. Wie er es mit Hebron gemacht hatte, so machte er es auch mit Debir und seinem König, ebenso wie er es mit Libna und seinem König gemacht hatte.
  rationale: Die Revision ersetzt die zu enge Ortsbezeichnung durch »Städte«, wählt mit »Schneide des Schwertes« eine natürliche, bildtreue deutsche Entsprechung und formuliert die חרם-Handlung als »dem Bann zur Vernichtung weihen«. Dadurch bleiben der technische Charakter und die im Kontext bezeichnete Folge erkennbar. Der vom Hebräischen gebotene Wechsel zwischen singularischem und pluralischem Handlungsträger bleibt erhalten; die Fußnotenmarke bleibt direkt an der Bannterminologie verankert.
