  text: וַֽ/יִּלְכְּדָ֞/הּ וְ/אֶת מַלְכָּ֤/הּ וְ/אֶת כָּל עָרֶ֨י/הָ֙ וַ/יַּכּ֣וּ/ם לְ/פִי חֶ֔רֶב וַֽ/יַּחֲרִ֨ימוּ֙ אֶת כָּל נֶ֣פֶשׁ אֲשֶׁר בָּ֔/הּ לֹ֥א הִשְׁאִ֖יר שָׂרִ֑יד כַּ/אֲשֶׁ֨ר עָשָׂ֜ה לְ/חֶבְר֗וֹן כֵּן עָשָׂ֤ה לִ/דְבִ֨רָ/ה֙ וּ/לְ/מַלְכָּ֔/הּ וְ/כַ/אֲשֶׁ֥ר עָשָׂ֛ה לְ/לִבְנָ֖ה וּ/לְ/מַלְכָּֽ/הּ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/039.yaml
  text: And they captured it[a], along with its king and all its towns, and struck them with the edge of the sword, and they devoted to destruction every person who was in it; they left no survivor. Just as he had done to Hebron, so he did to Debir and its king, and just as he had done to Libnah and its king.
translation:
  language: de
  text: Er nahm sie samt ihrem König und allen ihren Städten ein. Sie schlugen sie mit der Schneide des Schwertes und weihten jeden Menschen in ihr dem Bann zur Vernichtung[a]; er ließ keinen Überlebenden übrig. Wie er es mit Hebron gemacht hatte, so machte er es auch mit Debir und seinem König, ebenso wie er es mit Libna und seinem König gemacht hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »vernichteten vollständig«. Das hebräische Wort bezeichnet die Weihung an den Bann (ḥerem), hier zur vollständigen Vernichtung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכְּדָהּ
  choice: Er nahm sie … ein
  rationale: Das Verb לכד bezeichnet im militärischen Zusammenhang das Einnehmen oder Erobern. Die hebräische Verbform ist Singular; das feminine Suffix bezieht sich auf die Stadt Debir. Der Subjektwechsel wird nicht geglättet.
- source_word: כָּל עָרֶיהָ
  choice: alle ihre Ortschaften
  rationale: עיר kann Stadt oder Ortschaft bezeichnen. Hier sind die zu Debir gehörenden Siedlungen gemeint; „Ortschaften“ vermeidet, sie alle als gleichrangige Städte darzustellen.
- source_word: וַיַּכּוּם לְפִי חֶרֶב
  choice: Sie schlugen sie mit der Schärfe des Schwertes
  rationale: Die Wendung bewahrt das hebräische Bild vom „Mund“ beziehungsweise der Schneide des Schwertes. Das pluralische Verb und sein pluralisches Objekt bleiben erkennbar.
- source_word: וַיַּחֲרִימוּ
  choice: vollstreckten … den Bann
  rationale: חרם bezeichnet hier nicht bloß gewöhnliches Zerstören, sondern die Übergabe an den Bann mit der Folge vollständiger Vernichtung. Die traditionelle, im Deutschen verständliche Fachformulierung wahrt diesen Bedeutungsgehalt.
- source_word: כָּל נֶפֶשׁ אֲשֶׁר בָּהּ
  choice: alle Menschen darin
  rationale: נפש meint in diesem Zusammenhang Personen beziehungsweise Einwohner, nicht eine vom Körper getrennte Seele.
- source_word: לֹא הִשְׁאִיר שָׂרִיד
  choice: er ließ keinen Überlebenden übrig
  rationale: שָׂרִיד ist hier ein Überlebender. Der hebräische Text wechselt zum Singular, wahrscheinlich mit Josua als handelndem Anführer; dieser Wechsel bleibt erhalten.
- source_word: כַּאֲשֶׁר עָשָׂה לְחֶבְרוֹן כֵּן עָשָׂה
  choice: Wie er es mit Hebron gemacht hatte, so machte er es auch
  rationale: Die Vergleichsformel stellt Debirs Schicksal in das Muster der vorherigen Eroberungen. Das Plusquamperfekt kennzeichnet die vorausgegangene Handlung.
theological_decisions:
- issue: Wiedergabe der חרם-Terminologie
  choice: vollstreckten … den Bann
  alternative: vernichteten vollständig
  rationale: Die gewählte Formulierung erhält den besonderen religiös-rechtlichen Gehalt des hebräischen Begriffs, ohne ihn im Haupttext dogmatisch auszudeuten. Eine Fußnote nennt die verständlichere resultative Wiedergabe.
- issue: Wechsel zwischen singularischem und pluralischem Handlungsträger
  choice: Singular und Plural entsprechend dem Hebräischen beibehalten
  alternative: alle Verbformen auf Singular oder Plural vereinheitlichen
  rationale: Der Text wechselt zwischen Josua als repräsentativem Anführer und den kollektiv Handelnden. Eine Vereinheitlichung würde eine echte Spannung des Ausgangstextes beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bewusst wechselnden Subjekte folgen dem hebräischen Text. „Mit der Schärfe des Schwertes“ bewahrt das konkrete Ausgangsbild; „den Bann vollstrecken“ hält den technischen Charakter von חרם fest und wird durch die Fußnote erläutert.
