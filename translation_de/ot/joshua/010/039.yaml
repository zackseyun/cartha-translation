  - severity: medium
    issue: Unklare bzw. unidiomatische Bannformulierung
    rationale: »den Bann an allen Menschen darin vollstrecken« ist zwar verständlich, aber keine natürliche moderne Formulierung und lässt die Vernichtungsdimension im Haupttext zu indirekt. Eine Formulierung mit »dem Bann zur Vernichtung weihen« bildet חרם präziser ab.
  - severity: low
