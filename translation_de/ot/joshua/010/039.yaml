review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Abfolge sowie den Wechsel von Singular (»Er nahm … ein«; »er ließ«; Vergleichssätze) und Plural (»Sie schlugen«; »vollstreckten«) grundsätzlich quellentreu wieder. »Ortschaften« schränkt jedoch עיר unnötig gegenüber dem neutraleren »Städte« ein. Die Formulierung »den Bann an allen Menschen darin vollstrecken« ist zudem im heutigen Deutsch semantisch und idiomatisch weniger klar als eine Wiedergabe, die die im חרם-Begriff eingeschlossene Vernichtung ausdrücklich benennt.
  naturalness: »Mit der Schärfe des Schwertes« klingt im modernen Standarddeutsch unnötig ungewohnt; »mit der Schneide des Schwertes« bewahrt das Bild und ist geläufiger. »Sie schlugen sie« bleibt wegen der mehrfachen möglichen Bezüge schwer verständlich; die Satzfolge kann dennoch ohne inhaltliche Glättung beibehalten werden, wenn der folgende חרם-Satz klar formuliert wird.
  terminology: »Bann« kann als Fachbegriff beibehalten werden, sollte aber nicht allein stehen, da er im Deutschen leicht an kirchliche Exkommunikation denken lässt. »dem Bann zur Vernichtung weihen« gibt die technische חרם-Terminologie und ihre hier bezeichnete Folge wieder, ohne eine konfessionelle Deutung einzutragen. Die Fußnote erläutert die Alternative und den Fachausdruck.
