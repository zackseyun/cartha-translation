base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/035.yaml
  text: And they captured it that day and struck it with the edge of the sword[a], and every person who was in it he devoted to destruction that day[b], according to all that he had done to Lachish.
translation:
  language: de
  text: Und sie nahmen sie an jenem Tag ein und schlugen sie mit der Schneide des Schwertes[a]. Jeden Menschen, der sich darin befand[b], weihte er an jenem Tag der Vernichtung[c], ganz so, wie er es mit Lachisch gemacht hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mit dem Mund des Schwertes“; gemeint ist die Schneide des Schwertes.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „jede Seele, die in ihr war“; „Seele“ bezeichnet hier die einzelnen Menschen in der Stadt.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „belegte er mit dem Bann“ beziehungsweise „vernichtete er vollständig“. Das hebräische Verb bezeichnet hier die Übergabe an den Bann und damit an die Vernichtung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכְּדוּהָ
  choice: sie nahmen sie ein
  rationale: לכד bezeichnet im militärischen Zusammenhang die Einnahme einer Stadt. „Einnehmen“ ist im modernen Deutschen natürlich und bewahrt den Eroberungssinn.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Die geläufige deutsche Zeitangabe gibt den Nachdruck auf denselben Tag präzise wieder.
- source_word: וַיַּכּוּהָ לְפִי חֶרֶב
  choice: sie schlugen sie mit der Schärfe des Schwertes
  rationale: Die Wendung bewahrt das hebräische Bild von der „Mündung/Schneide des Schwertes“, ohne die Aussage durch eine freie Umschreibung abzuschwächen.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: jeden Menschen, der sich darin befand
  rationale: נֶפֶשׁ bezeichnet hier einen lebenden Menschen, nicht eigens eine vom Körper unterschiedene Seele. Die Wiedergabe vermeidet daher unbeabsichtigte anthropologische Festlegungen.
- source_word: הֶחֱרִים
  choice: weihte er der Vernichtung
  rationale: Das Hifil von חרם bezeichnet im Eroberungskontext die Übergabe an den Bann beziehungsweise an die Vernichtung. Die Formulierung hält sowohl die sakrale als auch die zerstörerische Dimension fest.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה לְלָכִישׁ
  choice: ganz so, wie er es mit Lachisch gemacht hatte
  rationale: Die Formulierung gibt den vollständigen Vergleich mit dem zuvor berichteten Vorgehen gegen Lachisch natürlich wieder.
theological_decisions:
- issue: Wiedergabe von חרם im Eroberungskontext
  choice: der Vernichtung weihen
  alternative: den Bann vollstrecken; vollständig vernichten
  rationale: „Der Vernichtung weihen“ bewahrt die besondere Bannbedeutung des Verbs und reduziert sie weder auf gewöhnliches Töten noch auf einen unverständlichen Fachausdruck.
- issue: Wiedergabe von נֶפֶשׁ als Bezeichnung der Stadtbevölkerung
  choice: Mensch
  alternative: Seele; Lebewesen
  rationale: Im Zusammenhang sind die in der Stadt befindlichen Personen gemeint. „Seele“ könnte eine metaphysische Aussage nahelegen, die der hebräische Ausdruck hier nicht eigens macht.
- issue: Wechsel vom pluralischen zum singularischen Handlungsträger
  choice: „sie“ bei Einnahme und Schlagen, danach „er“ bei der Bannweihe und beim Vergleich mit Lachisch
  alternative: durchgehend „sie“
  rationale: הֶחֱרִים und עָשָׂה stehen im Hebräischen ausdrücklich in der 3. Person maskulin Singular. Die Übersetzung erhält diesen grammatischen Wechsel und lässt dessen Bezug im Erzählzusammenhang offen, statt ihn zu nivellieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die militärische Bildsprache und der auffällige Wechsel vom pluralischen zum singularischen Subjekt bleiben erhalten. Das feminine Pronomen „sie“ nimmt die im Kontext genannte Stadt auf.
