  text: וַ/יַּ֣עַל יְ֠הוֹשֻׁעַ וְ/כָֽל יִשְׂרָאֵ֥ל עִמּ֛/וֹ מֵ/עֶגְל֖וֹנָ/ה חֶבְר֑וֹנָ/ה וַ/יִּֽלָּחֲמ֖וּ עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/036.yaml
  text: Then Joshua[a], and all Israel with him, went up from Eglon to Hebron, and they fought against it.
translation:
  language: de
  text: Dann zog Josua mit ganz Israel von Eglon nach Hebron hinauf, und sie kämpften gegen die Stadt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „gegen sie“; das feminine Pronomen bezieht sich auf die Stadt Hebron.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: zog … hinauf
  rationale: עלה bezeichnet hier die gerichtete Bewegung hinauf; „zog … hinauf“ klingt in einer militärischen Erzählung natürlich und bewahrt die Richtungsangabe.
- source_word: וְכָל־יִשְׂרָאֵל עִמּוֹ
  choice: mit ganz Israel
  rationale: Die Wendung bezeichnet kollektiv die Israeliten, die Josua begleiteten. Die deutsche Wortstellung verbindet die Begleitung idiomatisch mit dem Subjekt.
- source_word: מֵעֶגְלוֹנָה
  choice: von Eglon
  rationale: Die Präposition מִן kennzeichnet den Ausgangspunkt.
- source_word: חֶבְרוֹנָה
  choice: nach Hebron
  rationale: Das lokale He bezeichnet die Bewegung auf Hebron zu; bei Ortsnamen ist „nach“ die natürliche deutsche Entsprechung.
- source_word: וַיִּלָּחֲמוּ
  choice: und sie kämpften
  rationale: לחם im Nifal bezeichnet das Kämpfen beziehungsweise das Aufnehmen des Kampfes.
- source_word: עָלֶיהָ
  choice: gegen die Stadt
  rationale: Die Präposition עַל hat hier adversative Bedeutung. Das feminine Suffix verweist auf Hebron als Stadt; die explizite Wiedergabe vermeidet im Deutschen ein unklares Pronomen.
