source:
  edition: WLC
  text: וַ/יֵּאָסְפ֨וּ וַֽ/יַּעֲל֜וּ חֲמֵ֣שֶׁת מַלְכֵ֣י הָ/אֱמֹרִ֗י מֶ֣לֶךְ יְרוּשָׁלִַ֜ם מֶֽלֶךְ חֶבְר֤וֹן מֶֽלֶךְ יַרְמוּת֙ מֶֽלֶךְ לָכִ֣ישׁ מֶֽלֶךְ עֶגְל֔וֹן הֵ֖ם וְ/כָל מַֽחֲנֵי/הֶ֑ם וַֽ/יַּחֲנוּ֙ עַל גִּבְע֔וֹן וַ/יִּֽלָּחֲמ֖וּ עָלֶֽי/הָ׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/005.yaml
  text: So the five kings of the Amorites—the king of Jerusalem[a], the king of Hebron, the king of Jarmuth, the king of Lachish, and the king of Eglon—gathered together and went up, they and all their armies; and they encamped against Gibeon and fought against it.
translation:
  language: de
  text: Da versammelten sich die fünf Könige der Amoriter – der König von Jerusalem, der König von Hebron, der König von Jarmut, der König von Lachisch und der König von Eglon – und zogen mit allen ihren Heeren[a] hinauf. Sie schlugen ihr Lager gegen Gibeon auf und kämpften gegen die Stadt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »mit allen ihren Lagern«; gemeint sein können die in den Lagern versammelten Truppen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסְפוּ
  choice: versammelten sich
  rationale: Der Nifal bezeichnet hier das Zusammenkommen der Könige; die reflexive Form gibt den gemeinschaftlichen Sinn natürlich wieder, ohne bereits ein förmliches Bündnis vorauszusetzen.
- source_word: וַיַּעֲלוּ
  choice: zogen ... hinauf
  rationale: Die Wiedergabe bewahrt die Grundbedeutung von עלה und lässt offen, ob vor allem die Topografie oder eine übliche Richtungsangabe im Blick ist.
- source_word: חֲמֵשֶׁת מַלְכֵי הָאֱמֹרִי
  choice: die fünf Könige der Amoriter
  rationale: Die Genitivverbindung und die ethnische Bezeichnung des Hebräischen bleiben ausdrücklich erhalten.
- source_word: מֶלֶךְ יְרוּשָׁלִַם ... מֶלֶךְ עֶגְלוֹן
  choice: der König von Jerusalem ... der König von Eglon
  rationale: Das wiederholte מֶלֶךְ wird beibehalten, da der hebräische Text jeden Herrscher einzeln aufzählt.
- source_word: הֵם וְכָל מַחֲנֵיהֶם
  choice: mit allen ihren Heeren
  rationale: מַחֲנֶה bedeutet wörtlich »Lager«, bezeichnet im militärischen Zusammenhang aber auch das im Lager stehende Heer. »Heere« vermittelt hier den gemeinten militärischen Verband verständlich; die konkrete Grundbedeutung wird in der Fußnote bewahrt.
- source_word: וַיַּחֲנוּ עַל גִּבְעוֹן
  choice: sie schlugen ihr Lager gegen Gibeon auf
  rationale: Die Formulierung erhält das konkrete Bild des Lagerns. Wegen des unmittelbar folgenden Kampfes wird עַל adversativ mit »gegen« wiedergegeben, nicht nur örtlich mit »bei«.
- source_word: וַיִּלָּחֲמוּ עָלֶיהָ
  choice: kämpften gegen die Stadt
  rationale: Die Wiedergabe entspricht dem üblichen Sinn des Verbs für kriegerisches Kämpfen. »Die Stadt« macht den Bezug des femininen Suffixes auf Gibeon im Deutschen eindeutig.
