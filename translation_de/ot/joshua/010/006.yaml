  text: וַ/יִּשְׁלְח֣וּ אַנְשֵׁי֩ גִבְע֨וֹן אֶל יְהוֹשֻׁ֤עַ אֶל הַֽ/מַּחֲנֶה֙ הַ/גִּלְגָּ֣לָ/ה לֵ/אמֹ֔ר אַל תֶּ֥רֶף יָדֶ֖י/ךָ מֵֽ/עֲבָדֶ֑י/ךָ עֲלֵ֧ה אֵלֵ֣י/נוּ מְהֵרָ֗ה וְ/הוֹשִׁ֤יעָ/ה לָּ֨/נוּ֙ וְ/עָזְרֵ֔/נוּ כִּ֚י נִקְבְּצ֣וּ אֵלֵ֔י/נוּ כָּל מַלְכֵ֥י הָ/אֱמֹרִ֖י יֹשְׁבֵ֥י הָ/הָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/006.yaml
  text: Then the men of Gibeon sent to Joshua[a], to the camp at Gilgal, saying, “Do not withdraw your hand from your servants. Come up to us quickly, and save us and help us, for all the kings of the Amorites who live in the hill country have gathered against us.”
translation:
  language: de
  text: 'Da sandten die Männer von Gibeon eine Botschaft an Josua ins Lager bei Gilgal: „Zieh deine Hand nicht von deinen Dienern zurück.[a] Komm schnell zu uns herauf, rette uns und hilf uns! Denn alle Könige der Amoriter, die im Bergland wohnen, haben sich gegen uns versammelt.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Lass deine Hand gegenüber deinen Dienern nicht erschlaffen.“ Gemeint ist: „Hör nicht auf, uns zu unterstützen“, oder: „Lass uns nicht im Stich.“'
    reason: Das hebräische Hand-Bild ist im Deutschen erklärungsbedürftig und kann sowohl das Nachlassen aktiver Unterstützung als auch das Verlassen der Verbündeten bezeichnen.
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ אַנְשֵׁי גִבְעוֹן
  choice: Da sandten die Männer von Gibeon eine Botschaft
  rationale: Die Konstruktion führt das nächste Ereignis der Erzählung ein. „Männer von Gibeon“ gibt die maskuline hebräische Bezeichnung genau wieder; „eine Botschaft“ ergänzt idiomatisch das im Deutschen nötige Objekt.
- source_word: אֶל יְהוֹשֻׁעַ אֶל הַמַּחֲנֶה הַגִּלְגָּלָה
  choice: an Josua ins Lager bei Gilgal
  rationale: Das wiederholte אֶל bezeichnet Empfänger und Ziel. Die Richtungsendung bei Gilgal wird durch „ins Lager“ berücksichtigt; „bei Gilgal“ ist natürliches modernes Deutsch.
- source_word: אַל תֶּרֶף יָדֶיךָ מֵעֲבָדֶיךָ
  choice: Zieh deine Hand nicht von deinen Dienern zurück
  rationale: Die Wendung bewahrt das hebräische Bild der Hand, die Unterstützung und tätige Hilfe bezeichnet. Eine Fußnote erklärt die idiomatische Bedeutung.
- source_word: עֲלֵה אֵלֵינוּ מְהֵרָה
  choice: Komm schnell zu uns herauf
  rationale: „Herauf“ bewahrt den topografischen Aufstieg von Gilgal ins Bergland und übernimmt zugleich die Perspektive der Sprecher.
- source_word: וְהוֹשִׁיעָה לָּנוּ וְעָזְרֵנוּ
  choice: rette uns und hilf uns
  rationale: Die beiden parallelen Bitten werden direkt und ohne unnötige theologische Zuspitzung wiedergegeben; in diesem Zusammenhang meint ישע konkrete Rettung aus militärischer Gefahr.
- source_word: כִּי נִקְבְּצוּ אֵלֵינוּ
  choice: Denn ... haben sich gegen uns versammelt
  rationale: Im feindlichen Zusammenhang drückt אֶל die gegen Gibeon gerichtete Sammlung aus; „gegen uns“ macht dies im Deutschen eindeutig.
- source_word: כָּל מַלְכֵי הָאֱמֹרִי יֹשְׁבֵי הָהָר
  choice: alle Könige der Amoriter, die im Bergland wohnen
  rationale: Die partizipiale Bestimmung wird als natürlicher deutscher Relativsatz wiedergegeben; הָהָר bezeichnet hier das Bergland.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählführung. Das Hand-Bild und der topografische Ausdruck „herauf“ bleiben erhalten; schwer verständliche hebräische Syntax wird behutsam idiomatisiert.
