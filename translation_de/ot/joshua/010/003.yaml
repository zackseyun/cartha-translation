base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/003.yaml
  text: So Adoni-zedek king of Jerusalem sent to Hoham king of Hebron, to Piram king of Jarmuth, to Japhia king of Lachish, and to Debir king of Eglon, saying,
translation:
  language: de
  text: 'Da sandte Adoni-Zedek, der König von Jerusalem, eine Botschaft an Hoham, den König von Hebron, an Piram, den König von Jarmut, an Jafia, den König von Lachisch, und an Debir, den König von Eglon. Er ließ ihnen sagen:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Da sandte ... eine Botschaft
  rationale: Das Wayyiqtol führt die Erzählung weiter und knüpft folgernd an den vorherigen Vers an. Da die Empfänger mit אֶל eingeführt werden und לֵאמֹר eine Mitteilung ankündigt, gibt „eine Botschaft senden“ den Sinn im Deutschen natürlich wieder.
- source_word: אֲדֹנִי צֶדֶק
  choice: Adoni-Zedek
  rationale: Der Personenname wird transliteriert; der Bindestrich macht seine zusammengesetzte Form sichtbar.
- source_word: מֶלֶךְ יְרוּשָׁלִַם
  choice: der König von Jerusalem
  rationale: Die hebräische Status- und Ortsangabe wird als natürliche deutsche Apposition wiedergegeben.
- source_word: אֶל
  choice: an
  rationale: Die Präposition bezeichnet hier die Adressaten der gesandten Mitteilung; im Deutschen ist „an“ in dieser Konstruktion idiomatisch.
- source_word: הוֹהָם
  choice: Hoham
  rationale: Der Personenname wird nach üblicher deutscher Bibelnamenform transliteriert.
- source_word: חֶבְרוֹן
  choice: Hebron
  rationale: Die etablierte deutsche Form des Ortsnamens wird verwendet.
- source_word: פִּרְאָם
  choice: Piram
  rationale: Der Personenname wird transliteriert.
- source_word: יַרְמוּת
  choice: Jarmut
  rationale: Die im Deutschen geläufige Umschrift des Ortsnamens wird verwendet.
- source_word: יָפִיעַ
  choice: Jafia
  rationale: Der Personenname wird in einer für modernes Deutsch geeigneten Umschrift wiedergegeben.
- source_word: לָכִישׁ
  choice: Lachisch
  rationale: Die etablierte deutsche Form des Ortsnamens wird verwendet.
- source_word: דְּבִיר
  choice: Debir
  rationale: Der Kontext bezeichnet eindeutig einen König mit diesem Namen, nicht das gleichlautende hebräische Substantiv.
- source_word: עֶגְלוֹן
  choice: Eglon
  rationale: Die etablierte deutsche Form des Ortsnamens wird verwendet.
- source_word: לֵאמֹר
  choice: 'Er ließ ihnen sagen:'
  rationale: Die formelhafte Einleitung direkter Rede wird in natürlichem Deutsch wiedergegeben. Der Doppelpunkt hält den Satz für den folgenden Inhalt offen.
