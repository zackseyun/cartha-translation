base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/014.yaml
  text: And there was no day like that before it or after it[a], when Yahweh listened to the voice of a man, for Yahweh fought for Israel.
translation:
  language: de
  text: Und weder vor jenem Tag noch nach ihm gab es einen Tag wie diesen[a], an dem Jahwe auf die Stimme eines Mannes hörte; denn Jahwe kämpfte für Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an dem Jahwe die Bitte eines Mannes erhörte“. Wörtlich: „an dem Jahwe auf die Stimme eines Mannes hörte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא הָיָה כַּיּוֹם הַהוּא
  choice: Und ... hat es je einen Tag wie diesen gegeben
  rationale: Die verneinte Existenzformulierung wird idiomatisch und zugleich nachdrücklich wiedergegeben; כַּ bezeichnet den Vergleich mit jenem Tag.
- source_word: לְפָנָיו וְאַחֲרָיו
  choice: weder vor diesem Tag noch nach ihm
  rationale: Die Suffixe beziehen sich am natürlichsten auf den unmittelbar zuvor genannten Tag. Die Formulierung macht diesen Bezug im Deutschen klar.
- source_word: לִשְׁמֹעַ יְהוָה בְּקוֹל אִישׁ
  choice: an dem Jahwe auf die Stimme eines Mannes hörte
  rationale: Die Wendung שׁמע בקול wird relativ formnah wiedergegeben. „Auf die Stimme ... hören“ bezeichnet hier das Erhören beziehungsweise Beachten des gesprochenen Anliegens, ohne die stärkere Lesart „gehorchen“ in den Haupttext einzutragen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im deutschen Haupttext als „Jahwe“ wiedergegeben.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die erklärende Begründung für das außergewöhnliche Geschehen ein.
- source_word: נִלְחָם לְיִשְׂרָאֵל
  choice: kämpfte für Israel
  rationale: Das Verb bezeichnet Jahwes Kampf zugunsten Israels; das Präteritum entspricht dem erzählenden Rückblick.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: HERR; Jehova
  rationale: „Jahwe“ gibt den Eigennamen sichtbar wieder und vermeidet, ihn durch einen Titel zu ersetzen.
- issue: Sinn von לִשְׁמֹעַ ... בְּקוֹל אִישׁ
  choice: Jahwe hörte auf die Stimme eines Mannes
  alternative: Jahwe erhörte die Bitte eines Mannes; Jahwe gehorchte einem Mann
  rationale: Die gewählte Fassung bewahrt das hebräische Bild und die auffällige theologische Spannung. Die Fußnote erklärt die kontextuelle Bedeutung, ohne die mögliche formale Schärfe des Ausdrucks im Haupttext vorschnell aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Konstruktion mit „weder ... noch“ betont die Einzigartigkeit des Tages; der Semikolonanschluss hält die begründende Schlussaussage eng beim Vorhergehenden.
