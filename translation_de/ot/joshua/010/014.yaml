  rationale: Die Revision stellt den erzählenden Vergangenheitsbezug des Hebräischen mit „gab es“ wieder her und vereinheitlicht die Rückverweise auf den außergewöhnlichen Tag. Die formnahe Wiedergabe von שׁמע בקול bleibt im Haupttext erhalten; die Fußnote bietet die kontextuelle Deutung „erhörte“ an, ohne die Ambiguität durch „gehorchte“ dogmatisch oder semantisch zu verengen.
