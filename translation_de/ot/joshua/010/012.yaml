  text: אָ֣ז יְדַבֵּ֤ר יְהוֹשֻׁעַ֙ לַֽ/יהוָ֔ה בְּ/י֗וֹם תֵּ֤ת יְהוָה֙ אֶת הָ֣/אֱמֹרִ֔י לִ/פְנֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יֹּ֣אמֶר לְ/עֵינֵ֣י יִשְׂרָאֵ֗ל שֶׁ֚מֶשׁ בְּ/גִבְע֣וֹן דּ֔וֹם וְ/יָרֵ֖חַ בְּ/עֵ֥מֶק אַיָּלֽוֹן־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/012.yaml
  text: Then Joshua spoke to Yahweh on the day when Yahweh gave the Amorites over before the sons of Israel[a], and he said in the sight of Israel, “Sun, stand still at Gibeon, and moon[c][b], in the Valley of Aijalon.”
translation:
  language: de
  text: 'Damals, an dem Tag, als Jahwe die Amoriter den Söhnen Israels preisgab[a], sprach Josua zu Jahwe. Vor den Augen Israels sagte er:


    »Sonne, steh still bei Gibeon,

    und Mond, im Tal von Ajalon!«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »vor den Söhnen Israels«. Gemeint sein kann, dass Jahwe die Amoriter vor ihnen beziehungsweise in ihre Gewalt gab.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Verb kann auch »sei still«, »halte ein« oder »schweige« bedeuten. Im zweiten Halbvers fehlt das Verb; bei »Mond« ist sinngemäß »steh still« zu ergänzen.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדַבֵּר
  choice: sprach
  rationale: Das Piel von דבר bedeutet gewöhnlich »sprechen«. »Sprach« wahrt zudem die Unterscheidung zum folgenden וַיֹּאמֶר (»sagte«).
- source_word: לַיהוָה
  choice: zu Jahwe
  rationale: Die Präposition ל kennzeichnet Jahwe als den Adressaten; der Gottesname יהוה wird als »Jahwe« wiedergegeben.
- source_word: בְּיוֹם תֵּת יְהוָה
  choice: an dem Tag, als Jahwe … preisgab
  rationale: Die Verbindung mit dem Infinitivus constructus ist temporal; diese Formulierung ist im Deutschen natürlich und bewahrt den ausdrücklich genannten Tag.
- source_word: הָאֱמֹרִי
  choice: die Amoriter
  rationale: Der morphologische Singular bezeichnet hier kollektiv das im Kampf stehende Volk.
- source_word: לִפְנֵי בְּנֵי יִשְׂרָאֵל
  choice: den Söhnen Israels preisgab
  rationale: »Söhne Israels« bewahrt den familiären hebräischen Ausdruck. »Preisgab« gibt in diesem militärischen Zusammenhang das Überlassen in ihre Gewalt idiomatisch wieder.
- source_word: וַיֹּאמֶר לְעֵינֵי יִשְׂרָאֵל
  choice: Vor den Augen Israels sagte er
  rationale: לְעֵינֵי bezeichnet die öffentliche Sichtbarkeit; »vor den Augen« bildet das Bild eng und verständlich ab.
- source_word: שֶׁמֶשׁ ... דּוֹם
  choice: Sonne, steh still
  rationale: דום kann Stillsein, Schweigen oder Aufhören bezeichnen. Im kosmischen Befehl und im unmittelbaren Erzählzusammenhang ist »steh still« treffend, ohne die Art des Geschehens weiter zu erklären.
- source_word: בְּגִבְעוֹן
  choice: über Gibeon
  rationale: Die Präposition ב ist räumlich mehrdeutig. Bei der Sonne ist »über Gibeon« im Deutschen natürlich; die genaue räumliche Beziehung bleibt allgemein.
- source_word: וְיָרֵחַ בְּעֵמֶק אַיָּלוֹן
  choice: und Mond, über dem Tal von Ajalon
  rationale: Der zweite poetische Halbvers besitzt kein eigenes Verb; der Imperativ aus dem ersten Halbvers ist mitzudenken. Die knappe Ellipse des Hebräischen bleibt erhalten.
- source_word: אַיָּלוֹן
  choice: Ajalon
  rationale: »Ajalon« ist eine etablierte deutsche Wiedergabe des Ortsnamens.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. »Jahwe« gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Art des Sonnenbefehls
  choice: steh still
  alternative: sei still / halte ein / schweige
  rationale: Der Bedeutungsumfang von דום wird nicht naturwissenschaftlich ausgedeutet. »Steh still« passt zum Fortgang der Erzählung, während eine Fußnote auf die lexikalische Breite hinweist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Prosa bleibt gut verständlich; der Ausspruch Josuas wird als knapper poetischer Parallelismus gesetzt. Die Ellipse im zweiten Halbvers und die mögliche Bedeutungsbreite von דום werden bewahrt beziehungsweise in einer Fußnote offengelegt.
