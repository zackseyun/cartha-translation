base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/023.yaml
  text: 'And they did so, and brought out to him from the cave these five kings: the king of Jerusalem, the king of Hebron, the king of Jarmuth, the king of Lachish, and the king of Eglon.'
translation:
  language: de
  text: 'Und sie taten es und brachten diese fünf Könige aus der Höhle zu ihm heraus: den König von Jerusalem, den König von Hebron, den König von Jarmut, den König von Lachisch und den König von Eglon.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: Und sie taten es
  rationale: Die hebräische Erzählformel bezeichnet die Ausführung des zuvor erteilten Befehls. Die gewählte Formulierung ist präzise und in modernem Deutsch natürlich.
- source_word: וַיֹּצִיאוּ
  choice: sie holten … heraus
  rationale: Die Hifil-Form von יצא bedeutet hier, jemanden aus einem Ort herauszubringen. „Herausholen“ passt zur Bergung der Könige aus der Höhle.
- source_word: אֵלָיו
  choice: zu ihm
  rationale: אל mit Suffix bedeutet unmittelbar „zu ihm“. Der Bezug auf Josua ergibt sich aus dem Kontext, wird aber nicht erklärend in den Text eingesetzt.
- source_word: חֲמֵשֶׁת הַמְּלָכִים הָאֵלֶּה
  choice: diese fünf Könige
  rationale: Direkte und idiomatische Wiedergabe der Zahlwortverbindung mit Demonstrativpronomen.
- source_word: מִן הַמְּעָרָה
  choice: aus der Höhle
  rationale: מִן bezeichnet hier die Bewegung aus dem Inneren der Höhle heraus.
- source_word: מֶלֶךְ
  choice: König
  rationale: Die konkrete Amtsbezeichnung wird gegenüber dem allgemeineren „Herrscher“ bewahrt.
- source_word: יְרוּשָׁלִַם
  choice: Jerusalem
  rationale: Eingebürgerte deutsche Namensform.
- source_word: חֶבְרוֹן
  choice: Hebron
  rationale: Eingebürgerte deutsche Namensform.
- source_word: יַרְמוּת
  choice: Jarmut
  rationale: Gängige deutsche biblische Namensform.
- source_word: לָכִישׁ
  choice: Lachisch
  rationale: Gängige deutsche biblische Namensform.
- source_word: עֶגְלוֹן
  choice: Eglon
  rationale: Gängige deutsche biblische Namensform; hier bezeichnet der Name die Stadt.
