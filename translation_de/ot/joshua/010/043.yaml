  text: Then Joshua returned[a], and all Israel with him, to the camp at Gilgal.
translation:
  language: de
  text: Dann kehrte Josua mit ganz Israel zum Lager in Gilgal zurück.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »zum Lager, nach Gilgal«. Im Hebräischen trägt »Gilgal« eine Endung, die eine Bewegung auf den Ort zu bezeichnet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: kehrte … zurück
  rationale: Das Verb שׁוב bezeichnet in dieser erzählenden Bewegungsfolge die Rückkehr; das deutsche Perfekt wäre weniger passend, daher steht das Präteritum.
- source_word: יְהוֹשֻׁעַ
  choice: Josua
  rationale: Der Personenname wird nach der etablierten deutschen Bibeltradition wiedergegeben.
- source_word: וְכָל יִשְׂרָאֵל
  choice: mit ganz Israel
  rationale: Die Formulierung bewahrt den kollektiven Ausdruck »ganz Israel«; zusammen mit עִמּוֹ wird sie im Deutschen natürlich als Begleitung in den Satz eingebunden.
- source_word: עִמּוֹ
  choice: mit …
  rationale: Die Präposition mit Suffix bezeichnet die Begleitung Josuas.
- source_word: אֶל הַמַּחֲנֶה
  choice: zum Lager
  rationale: אֶל bezeichnet die Bewegung auf ein Ziel hin; מַחֲנֶה meint hier das militärische Lager.
- source_word: הַגִּלְגָּלָה
  choice: in Gilgal
  rationale: Das direktionale He kennzeichnet Gilgal als Ziel. Nach »zum Lager« gibt »in Gilgal« die Lage des Zielortes in natürlichem Deutsch wieder; die wörtlichere Doppelung wird in der Fußnote genannt.
