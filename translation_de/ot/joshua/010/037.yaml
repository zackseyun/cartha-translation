  terminology: '„dem Untergang weihen“ ist eine angemessene Wiedergabe von החרים: Sie bewahrt den technischen Charakter der Hingabe zur Vernichtung, ohne den Terminus „Bann“ im Lauftext vorauszusetzen. Die Fußnote erläutert die Alternative und den Begriff hinreichend.'
