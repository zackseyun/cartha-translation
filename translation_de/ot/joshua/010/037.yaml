base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/037.yaml
  text: And they captured it and struck it with the edge of the sword[a], along with its king, all its cities, and every person who was in it. He left no survivor, just as he had done to Eglon. He devoted it to destruction, along with every person who was in it.
translation:
  language: de
  text: Sie nahmen die Stadt ein und schlugen sie mit der Schärfe des Schwertes, ebenso ihren König, alle ihre Städte und jeden Menschen, der sich darin befand. Er ließ keinen Überlebenden übrig, ganz wie er es mit Eglon gemacht hatte. Er weihte sie dem Untergang[a], samt jedem Menschen, der sich darin befand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er vollstreckte an ihr den Bann.“ Das hebräische Verb bezeichnet die Aussonderung zum Untergang beziehungsweise zur Vernichtung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכְּדוּהָ
  choice: Sie nahmen die Stadt ein
  rationale: לכד bezeichnet hier die militärische Einnahme einer Stadt. Das ausdrücklich eingesetzte „die Stadt“ macht den weiblichen Rückbezug im Deutschen verständlich.
- source_word: וַיַּכּוּהָ לְפִי חֶרֶב
  choice: schlugen sie mit der Schärfe des Schwertes nieder
  rationale: נכה bleibt als konkrete Gewalthandlung erkennbar; „mit der Schärfe des Schwertes“ gibt das hebräische Idiom לְפִי חֶרֶב eng und verständlich wieder.
- source_word: וְאֶת מַלְכָּהּ
  choice: ebenso ihren König
  rationale: Die possessive Beziehung des Königs zur eroberten Stadt wird unmittelbar wiedergegeben.
- source_word: וְאֶת כָּל עָרֶיהָ
  choice: alle ihre Städte
  rationale: עיר kann Stadt oder Ortschaft bezeichnen. „Städte“ wahrt hier die enge lexikalische Entsprechung und lässt die Zugehörigkeit zur eroberten Königsstadt offen.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: jeden Menschen, der sich darin befand
  rationale: נפש bezeichnet in diesem Zusammenhang Personen beziehungsweise menschliches Leben, nicht eine vom Körper getrennte Seele.
- source_word: לֹא הִשְׁאִיר שָׂרִיד
  choice: Er ließ keinen Überlebenden übrig
  rationale: Der singularische Satz fasst Josuas Handeln zusammen; שָׂרִיד bezeichnet hier einen Überlebenden.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה לְעֶגְלוֹן
  choice: ganz wie er es mit Eglon gemacht hatte
  rationale: Die Formulierung stellt einen Rückvergleich mit der zuvor geschilderten Behandlung Eglons her.
- source_word: וַיַּחֲרֵם אוֹתָהּ
  choice: Er weihte sie dem Untergang
  rationale: Die Wiedergabe bewahrt sowohl den technischen Gedanken des חרם als auch dessen Ergebnis der Vernichtung, ohne ihn auf ein bloßes „vernichtete“ zu verkürzen.
- source_word: וְאֶת כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: samt jedem Menschen, der sich darin befand
  rationale: Die wiederholte Wendung wird inhaltlich gleich wiedergegeben; „samt“ bindet alle Bewohner ausdrücklich in die Bannhandlung ein.
theological_decisions:
- issue: Wiedergabe von חרם im Zusammenhang des Kriegsgerichts
  choice: Er weihte sie dem Untergang
  alternative: Er vollstreckte an ihr den Bann; er vernichtete sie vollständig
  rationale: Das hebräische Verb bezeichnet nicht nur Vernichtung, sondern die Aussonderung zum Untergang. Die gewählte Formulierung erhält diese kultisch-theologische Spannung, ohne eine konfessionelle Deutung hinzuzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkrete Gewalt des hebräischen Textes und der Wechsel vom pluralischen Handeln zum singularischen zusammenfassenden Subjekt bleiben erhalten; beschönigende oder archaische Wendungen werden vermieden.
