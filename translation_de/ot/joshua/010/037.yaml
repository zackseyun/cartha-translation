  source_fidelity: 'Der Entwurf gibt die Abfolge und die Bezüge des hebräischen Textes zuverlässig wieder: Einnahme der Stadt, Schlag „mit der Schärfe des Schwertes“, Einbeziehung von König, Städten und allen darin befindlichen Menschen, kein Überlebender, Vergleich mit Eglon und die abschließende Bannhandlung. Der Wechsel zum singularischen zusammenfassenden Subjekt in den letzten beiden Sätzen bleibt sachgerecht erhalten.'
