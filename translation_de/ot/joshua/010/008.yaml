  source_fidelity: 'Der Entwurf gibt die hebräische Syntax und Aussage insgesamt treffend wieder: Jahwe spricht zu Josua, verbietet Furcht vor den Gegnern, begründet dies mit ihrer bereits zugesagten Auslieferung in Josuas Hand und verheißt, dass keiner von ihnen vor ihm bestehen kann. Das Perfekt „ich habe ... gegeben“ gibt die als gewiss dargestellte göttliche Zusage angemessen wieder. „standhalten“ erschließt die militärische Bedeutung von עמד לפני im Deutschen gut.'
