  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל יְהוֹשֻׁ֨עַ֙ אַל תִּירָ֣א מֵ/הֶ֔ם כִּ֥י בְ/יָדְ/ךָ֖ נְתַתִּ֑י/ם לֹֽא יַעֲמֹ֥ד אִ֛ישׁ מֵ/הֶ֖ם בְּ/פָנֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/008.yaml
  text: And Yahweh said to Joshua, “Do not fear them, for I have given them into your hand. Not a man among them will stand before you.”
translation:
  language: de
  text: 'Und Jahwe sagte zu Josua: „Fürchte dich nicht vor ihnen, denn ich habe sie in deine Hand gegeben. Kein Mann unter ihnen wird vor dir standhalten.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen, das Tetragramm, als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen; „Jahwe“ ist die im Deutschen übliche Form.
- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: Natürliche deutsche Wiedergabe der narrativen Redeeinleitung mit אמר.
- source_word: אַל תִּירָא מֵהֶם
  choice: Fürchte dich nicht vor ihnen
  rationale: Bewahrt die knappe Aufforderung und gibt מן nach ירא idiomatisch mit „vor“ wieder.
- source_word: כִּי
  choice: denn
  rationale: Leitet die Begründung für die vorausgehende Aufforderung ein.
- source_word: בְיָדְךָ
  choice: in deine Hand
  rationale: Bewahrt das hebräische Bild für die Übergabe in Josuas Gewalt; die Wendung ist im Deutschen verständlich.
- source_word: נְתַתִּים
  choice: ich habe sie … gegeben
  rationale: Das Perfekt stellt die göttliche Übergabe als bereits feststehende Wirklichkeit dar; das deutsche Perfekt erhält diesen Aspekt.
- source_word: לֹא יַעֲמֹד אִישׁ מֵהֶם
  choice: Kein Mann von ihnen wird … standhalten
  rationale: אִישׁ bezeichnet hier im militärischen Zusammenhang einen Mann aus dem feindlichen Heer; „standhalten“ macht den Widerstandssinn von עמד im Kontext natürlich deutlich.
- source_word: בְפָנֶיךָ
  choice: vor dir
  rationale: Bewahrt die räumliche Bildsprache der hebräischen Wendung, während „standhalten“ ihren militärischen Sinn vermittelt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn als Namen und verwendet die im modernen Standarddeutsch geläufige Transkription.
- issue: Geschlechtsspezifische Wiedergabe von אִישׁ
  choice: Kein Mann von ihnen
  alternative: Keiner von ihnen
  rationale: Der Kontext betrifft männliche feindliche Kämpfer. Die ausdrückliche maskuline Bezeichnung wird daher beibehalten, ohne sie zu verallgemeinern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt nah an der hebräischen Bildsprache, verwendet aber mit „standhalten“ eine im militärischen Zusammenhang natürliche deutsche Wendung.
