  source_fidelity: 'Der Entwurf gibt die Abfolge und die wesentlichen Ausdrücke des Hebräischen zuverlässig wieder: Flucht vor Israel, Abstieg bei Bet-Horon, Jahwes große Steine vom Himmel bis Aseka sowie die nachfolgende Identifikation als Hagelsteine. „Jahwe“, „große Steine“ und später „Hagelsteine“ bewahren die relevanten terminologischen und narrativen Unterscheidungen. Die Vergleichsaussage am Schluss ist inhaltlich zutreffend.'
