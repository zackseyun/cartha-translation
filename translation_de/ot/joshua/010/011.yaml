- from: Und als sie vor Israel flohen[a] und sich am Abhang von Bet-Horon befanden, warf Jahwe große Steine vom Himmel auf sie, bis nach Aseka, sodass sie starben. Durch die Hagelsteine starben mehr, als die Israeliten mit dem Schwert töteten.
  to: Und als sie vor Israel flohen[a] und sich am Abhang von Bet-Horon befanden, warf Jahwe große Steine vom Himmel auf sie, bis nach Aseka, und sie starben. Mehr kamen durch die Hagelsteine ums Leben, als die Israeliten mit dem Schwert töteten.
