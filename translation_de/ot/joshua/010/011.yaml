source:
  edition: WLC
  text: וַ/יְהִ֞י בְּ/נֻסָ֣/ם מִ/פְּנֵ֣י יִשְׂרָאֵ֗ל הֵ֞ם בְּ/מוֹרַ֤ד בֵּית חוֹרֹן֙ וַֽ/יהוָ֡ה הִשְׁלִ֣יךְ עֲלֵי/הֶם֩ אֲבָנִ֨ים גְּדֹל֧וֹת מִן הַ/שָּׁמַ֛יִם עַד עֲזֵקָ֖ה וַ/יָּמֻ֑תוּ רַבִּ֗ים אֲשֶׁר מֵ֨תוּ֙ בְּ/אַבְנֵ֣י הַ/בָּרָ֔ד מֵ/אֲשֶׁ֥ר הָרְג֛וּ בְּנֵ֥י יִשְׂרָאֵ֖ל בֶּ/חָֽרֶב׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/011.yaml
  text: And as they fled before Israel[a], while they were on the descent of Beth-horon, Yahweh threw large stones from heaven on them as far as Azekah, and they died. More died from the hailstones than the sons of Israel killed with the sword.
translation:
  language: de
  text: Und als sie vor Israel flohen[a] und sich am Abhang von Bet-Horon befanden, warf Jahwe große Steine vom Himmel auf sie, bis nach Aseka, und sie starben. Mehr kamen durch die Hagelsteine ums Leben, als die Israeliten mit dem Schwert töteten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gemeint ist: Sie flohen vor den Israeliten.'
    reason: Die wörtlichere Form „vor Israel“ bezeichnet hier Israel als Volk beziehungsweise Heer.
lexical_decisions:
- source_word: בְּנֻסָם מִפְּנֵי יִשְׂרָאֵל
  choice: als sie vor Israel flohen
  rationale: Die Infinitivkonstruktion bezeichnet eine gleichzeitige Handlung; „vor Israel fliehen“ gibt die Flucht angesichts des israelitischen Heeres knapp und quellennah wieder.
- source_word: בְּמוֹרַד בֵּית חוֹרֹן
  choice: am Abhang von Bet-Horon
  rationale: מוֹרָד bezeichnet einen abwärts führenden Hang beziehungsweise Abstieg. „Abhang“ bewahrt die topografische Aussage und klingt im Deutschen natürlich.
- source_word: וַיהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als Eigenname wiedergegeben.
- source_word: הִשְׁלִיךְ
  choice: warf
  rationale: Das Verb bedeutet „werfen/schleudern“. „Warf“ bleibt eng am Ausgangstext, ohne eine dort nicht ausdrücklich bezeichnete Richtung in das Verb einzutragen.
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: große Steine
  rationale: Die erste Bezeichnung bleibt allgemein; erst später werden die Steine ausdrücklich als Hagelsteine bezeichnet.
- source_word: מִן הַשָּׁמַיִם
  choice: vom Himmel
  rationale: „Vom Himmel“ bewahrt sowohl die räumliche als auch die theologische Resonanz des hebräischen Ausdrucks.
- source_word: עַד עֲזֵקָה
  choice: bis nach Aseka
  rationale: עַד bezeichnet hier die räumliche Ausdehnung entlang des Fluchtwegs.
- source_word: בְּאַבְנֵי הַבָּרָד
  choice: durch die Hagelsteine
  rationale: Die Wendung identifiziert die zuvor genannten großen Steine nun ausdrücklich als Hagelsteine.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Der deutsche Volksname gibt den hebräischen ethnonymischen Ausdruck natürlich und ohne Bedeutungsverlust wieder.
- source_word: בֶּחָרֶב
  choice: mit dem Schwert
  rationale: Der instrumentale Gebrauch der Präposition wird idiomatisch mit „mit“ wiedergegeben; der Singular bezeichnet kollektiv die Kriegswaffe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet das Tetragramm als Gottesnamen. „Jahwe“ macht diesen Eigennamen sichtbar, statt ihn durch einen Titel zu ersetzen.
- issue: Art der Geschosse vom Himmel
  choice: zunächst „große Steine“, danach „Hagelsteine“
  alternative: bereits bei der ersten Erwähnung „große Hagelsteine“
  rationale: Die zweistufige Beschreibung des Hebräischen bleibt erhalten und wird nicht vorzeitig vereinheitlicht.
- issue: Vergleich der Todeszahlen
  choice: „Durch die Hagelsteine starben mehr, als die Israeliten mit dem Schwert töteten“
  alternative: „Zahlreicher waren die, die durch die Hagelsteine starben, als die, welche die Israeliten mit dem Schwert töteten“
  rationale: Die natürliche deutsche Form wahrt die vergleichende Aussage, dass Gottes Eingreifen mehr Feinde tötete als Israels Schwert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur wurde für gute Verständlichkeit leicht gegliedert, während die Wiederholung „Steine/Hagelsteine“, die Ortsangaben und die vergleichende Schlussaussage erhalten bleiben.
