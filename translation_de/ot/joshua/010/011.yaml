  terminology: Die Namensformen Bet-Horon und Aseka sind gebräuchlich. „Jahwe“ entspricht der vorliegenden Wiedergabepraxis für יהוה. „Israeliten“ ist im Deutschen eine natürliche und bedeutungsgleiche Wiedergabe von בני ישראל. Der Fußnotenanker zu „Israel“ ist korrekt gesetzt und erklärt die idiomatische Lesart angemessen.
