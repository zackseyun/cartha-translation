  text: וַ/יָּ֤שָׁב יְהוֹשֻׁ֨עַ֙ וְ/כָל יִשְׂרָאֵ֣ל עִמּ֔/וֹ אֶל הַֽ/מַּחֲנֶ֖ה הַ/גִּלְגָּֽלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/015.yaml
  text: Then Joshua returned[a], and all Israel with him, to the camp at Gilgal.
translation:
  language: de
  text: Dann kehrten Josua und ganz Israel mit ihm ins Lager bei Gilgal zurück.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eine ähnliche Mitteilung über die Rückkehr nach Gilgal steht in Josua 10,43. Manche verstehen diesen Vers als vorausgreifend oder als an eine andere Stelle versetzt; hier wird der hebräische Text so übersetzt, wie er überliefert ist.
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: Dann kehrte … zurück
  rationale: Das Wayyiqtol von שׁוב führt die Erzählung weiter und bezeichnet hier die Rückkehr an einen früheren Ort. „Dann“ gibt die Abfolge im natürlichen modernen Deutsch wieder.
- source_word: יְהוֹשֻׁעַ
  choice: Josua
  rationale: Die im Deutschen übliche biblische Namensform.
- source_word: וְכָל יִשְׂרָאֵל
  choice: mit ganz Israel
  rationale: Bewahrt die kollektive Bezeichnung „Israel“, ohne sie enger als „alle Israeliten“ oder ausdrücklich als Heer zu bestimmen. Zusammen mit עִמּוֹ ergibt sich im Deutschen die natürliche Wortfolge „mit ganz Israel“.
- source_word: עִמּוֹ
  choice: mit ihm
  rationale: Entspricht der Präposition עִם mit Suffix der 3. Person Singular; die deutsche Konstruktion lautet idiomatisch „mit ganz Israel zu ihm“.
- source_word: אֶל הַמַּחֲנֶה
  choice: ins Lager
  rationale: מַחֲנֶה bezeichnet hier das Lager, wahrscheinlich im militärischen Zusammenhang. „Ins Lager“ gibt die Zielrichtung knapp und natürlich wieder.
- source_word: הַגִּלְגָּלָה
  choice: nach Gilgal
  rationale: Die Richtungsendung -ה bezeichnet eine Bewegung nach Gilgal. „Ins Lager nach Gilgal“ bewahrt diese Zielrichtung und ist im Deutschen verständlich.
theological_decisions:
- issue: Erzählposition und mögliche Doppelung mit Josua 10,43
  choice: Der masoretische Text wird an dieser Stelle unverändert übersetzt.
  alternative: Wegen der ähnlichen Rückkehrnotiz in Josua 10,43 wird der Vers teils als vorausgreifend oder textlich versetzt verstanden.
  rationale: Die Übersetzung soll den überlieferten hebräischen Text wiedergeben und die literar- beziehungsweise textkritische Frage nicht stillschweigend durch Auslassung oder Harmonisierung entscheiden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kollektive Formulierung „ganz Israel“ bleibt erhalten; die Satzstellung ist für flüssiges Deutsch leicht umgeordnet.
