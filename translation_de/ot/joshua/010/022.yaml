  source_fidelity: 'Der Entwurf gibt die hebräische Satzfolge und sämtliche wesentlichen Elemente angemessen wieder: Josua spricht, erteilt zwei Pluralimperative, nennt den Höhleneingang, die fünf bestimmten Könige, deren Herausführung aus der Höhle und die Bewegung zu sich hin. »Eingang der Höhle« ist eine sachgerechte idiomatische Wiedergabe von פִּי הַמְּעָרָה (wörtlich: »Mund der Höhle«).'
