  text: וַ/יֹּ֣אמֶר יְהוֹשֻׁ֔עַ פִּתְח֖וּ אֶת פִּ֣י הַ/מְּעָרָ֑ה וְ/הוֹצִ֣יאוּ אֵלַ֗/י אֶת חֲמֵ֛שֶׁת הַ/מְּלָכִ֥ים הָ/אֵ֖לֶּה מִן הַ/מְּעָרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/022.yaml
  text: Then Joshua said[a], “Open the mouth of the cave[b], and bring those five kings out of the cave to me.”
translation:
  language: de
  text: 'Da sagte Josua: »Öffnet den Eingang der Höhle und bringt diese fünf Könige aus der Höhle zu mir heraus.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das narrative וַ führt die Handlung fort; »Da sagte« gibt die zeitliche Abfolge im modernen deutschen Erzählstil natürlich wieder.
- source_word: יְהוֹשֻׁעַ
  choice: Josua
  rationale: Eingebürgerte deutsche Namensform.
- source_word: פִּתְחוּ
  choice: Öffnet
  rationale: Der Pluralimperativ von פתח bezeichnet hier das Öffnen des zuvor verschlossenen Höhleneingangs.
- source_word: פִּי הַמְּעָרָה
  choice: den Eingang der Höhle
  rationale: Wörtlich »den Mund der Höhle«; »Eingang« vermittelt die Bedeutung der hebräischen Körpermetapher in natürlichem Deutsch.
- source_word: וְהוֹצִיאוּ
  choice: bringt ... heraus
  rationale: Der Hifil-Imperativ von יצא verlangt, dass die Könige aus dem Inneren nach draußen gebracht werden.
- source_word: אֵלַי
  choice: zu mir
  rationale: Die Präposition mit Suffix bezeichnet die Bewegung auf Josua zu.
- source_word: חֲמֵשֶׁת הַמְּלָכִים הָאֵלֶּה
  choice: diese fünf Könige
  rationale: הָאֵלֶּה weist auf die fünf bereits bekannten Könige hin; »diese« bewahrt den Demonstrativwert unmittelbar.
- source_word: מִן הַמְּעָרָה
  choice: aus der Höhle
  rationale: Bei einem Verb der Herausbewegung gibt מן den Ausgangspunkt im Inneren der Höhle an.
theological_decisions: []
translation_notes:
  register: Moderne, klare und zugleich würdige Standardsprache. Die hebräische Wendung »Mund der Höhle« wird idiomatisch als »Eingang der Höhle« wiedergegeben; die räumliche Bewegung bleibt durch »aus ... heraus« deutlich.
