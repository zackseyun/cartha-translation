  text: But these five kings fled and hid in the cave at Makkedah[a].
translation:
  language: de
  text: Diese fünf Könige flohen und versteckten sich in der Höhle bei Makkeda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּנֻסוּ
  choice: flohen
  rationale: Das Verb נוּס bezeichnet die Flucht vor einer Gefahr oder einem Gegner; »flohen« gibt die Bewegung unter Bedrängnis knapp und natürlich wieder.
- source_word: חֲמֵשֶׁת הַמְּלָכִים הָאֵלֶּה
  choice: diese fünf Könige
  rationale: Die deutsche Wortstellung bewahrt sowohl die Zahl als auch die durch הָאֵלֶּה ausgedrückte konkrete Bezugnahme.
- source_word: וַיֵּחָבְאוּ
  choice: versteckten sich
  rationale: Die Form bezeichnet ein Sichverbergen; die reflexive deutsche Wendung ist natürlich und präzise.
- source_word: בַמְּעָרָה
  choice: in der Höhle
  rationale: Der bestimmte Artikel im Hebräischen wird beibehalten und verweist auf eine bestimmte beziehungsweise im Zusammenhang identifizierbare Höhle.
- source_word: בְּמַקֵּדָה
  choice: bei Makkeda
  rationale: Die Präposition בְּ bezeichnet hier die örtliche Zuordnung. »Bei Makkeda« ist idiomatisch und lässt offen, ob die Höhle innerhalb des Ortes oder in dessen unmittelbarer Umgebung lag.
- source_word: וַ
  choice: Doch
  rationale: Das Waw führt die Erzählung fort; »Doch« macht zugleich den inhaltlichen Wechsel zur Flucht der Könige verständlich, ohne einen stärkeren Gegensatz einzutragen.
