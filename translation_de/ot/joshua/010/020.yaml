  text: וַ/יְהִי֩ כְּ/כַלּ֨וֹת יְהוֹשֻׁ֜עַ וּ/בְנֵ֣י יִשְׂרָאֵ֗ל לְ/הַכּוֹתָ֛/ם מַכָּ֥ה גְדוֹלָֽה מְאֹ֖ד עַד תֻּמָּ֑/ם וְ/הַ/שְּׂרִידִים֙ שָׂרְד֣וּ מֵ/הֶ֔ם וַ/יָּבֹ֖אוּ אֶל עָרֵ֥י הַ/מִּבְצָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/020.yaml
  text: And it happened that when Joshua and the sons of Israel had finished striking them with a very great slaughter[a], until they were wiped out, and the survivors from them survived and entered the fortified cities[b],
translation:
  language: de
  text: Und es geschah, als Josua und die Israeliten[a] damit fertig waren, ihnen einen überaus schweren Schlag zu versetzen, bis sie vollständig aufgerieben waren, und die von ihnen Übriggebliebenen[b] in die befestigten Städte gelangten,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Söhne Israels“.'
    reason: lexical_alternative
  - marker: b
    text: 'Im Hebräischen stehen hier ein Substantiv und ein Verb derselben Wortfamilie: wörtlich etwa „die Übriggebliebenen blieben von ihnen übrig“.'
    reason: source_wordplay
lexical_decisions:
- source_word: וַיְהִי
  choice: Und es geschah
  rationale: Die geläufige biblische Erzählformel bildet die narrative Funktion des hebräischen Wayyiqtol ab, ohne altertümliches „es begab sich“ zu verwenden.
- source_word: כְּכַלּוֹת
  choice: als … damit fertig waren
  rationale: Der Infinitiv mit כְּ hat hier zeitliche Bedeutung; die deutsche Formulierung gibt den Abschluss der Handlung wieder.
- source_word: יְהוֹשֻׁעַ וּבְנֵי יִשְׂרָאֵל
  choice: Josua und die Israeliten
  rationale: „Israeliten“ gibt die kollektive Bedeutung des hebräischen Idioms בְּנֵי יִשְׂרָאֵל in natürlichem modernem Deutsch wieder; die wörtlichere Form steht in der Fußnote.
- source_word: לְהַכּוֹתָם מַכָּה גְדוֹלָה מְאֹד
  choice: ihnen eine überaus schwere Niederlage beizubringen
  rationale: מַכָּה bezeichnet im militärischen Zusammenhang einen schweren Schlag beziehungsweise eine Niederlage. Die Wiedergabe ist idiomatisch und bewahrt die Stärke von גְּדוֹלָה מְאֹד.
- source_word: עַד תֻּמָּם
  choice: bis sie vollständig aufgerieben waren
  rationale: Die Form bezeichnet das Zu-Ende-Bringen beziehungsweise Vernichten. „Aufgerieben“ passt zum militärischen Zusammenhang und lässt die Spannung zu den anschließend genannten Überlebenden bestehen.
- source_word: וְהַשְּׂרִידִים שָׂרְדוּ מֵהֶם
  choice: und die von ihnen Übriggebliebenen … entkommen waren
  rationale: Die Formulierung bewahrt mit „Übriggebliebenen“ den Gedanken des hebräischen Nomens und Verbs aus derselben Wortfamilie, ohne im Deutschen eine unnatürliche Wiederholung zu erzwingen. Das einfache „und“ gibt וְ wieder, ohne die Beziehung ausdrücklich als gegensätzlich auszulegen.
- source_word: עָרֵי הַמִּבְצָר
  choice: die befestigten Städte
  rationale: Die Wendung bezeichnet durch Befestigungsanlagen geschützte Städte und wird so im modernen Deutschen klar und idiomatisch wiedergegeben.
theological_decisions:
- issue: Spannung zwischen vollständiger Vernichtung und Überlebenden
  choice: „bis sie vollständig aufgerieben waren“ und anschließend „die … Übriggebliebenen“
  alternative: „bis sie beinahe vernichtet waren“
  rationale: Der hebräische Text setzt עַד תֻּמָּם unmittelbar neben die Aussage über Überlebende. Die Übersetzung mildert diese Spannung nicht durch ein ergänztes „beinahe“ ab.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers bleibt mit einem Komma syntaktisch offen, weil der hebräische Satz im folgenden Vers weitergeführt wird. Alle Fußnotenmarker stehen unmittelbar bei den betreffenden Ausdrücken.
