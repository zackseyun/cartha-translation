  source_fidelity: Die Wendung וַיָּבֹא אֲלֵיהֶם bedeutet primär „kam zu ihnen/auf sie zu“. Das Adverb פִּתְאֹם trägt die Überraschung. „Über sie kommen“ kann im Deutschen bereits einen feindlichen Überfall oder ein Hereinbrechen bezeichnen und ist daher stärker als der hebräische Wortlaut. Die nächtliche Aufwärtsbewegung von Gilgal wird mit „heraufgezogen“ angemessen wiedergegeben.
  naturalness: „Da kam Josua plötzlich zu ihnen“ ist modernes, natürliches Deutsch und bewahrt die knappe Erzählweise. Der mit „nachdem“ gebildete Satzteil gibt die der Ankunft vorausgehende, die ganze Nacht dauernde Bewegung verständlich wieder.
  terminology: „Josua“ und „Gilgal“ entsprechen dem üblichen deutschen Bibelgebrauch. „Heraufziehen“ erhält die durch עָלָה ausgedrückte Aufwärtsrichtung und passt zum militärischen Kontext, ohne ein Kampfgeschehen in das Verb hineinzutragen.
