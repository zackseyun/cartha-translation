  text: So Joshua came upon them suddenly[b][a], having marched up from Gilgal all night.
translation:
  language: de
  text: Da kam Josua plötzlich zu ihnen, nachdem er die ganze Nacht von Gilgal heraufgezogen war[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Wörtlich: „die ganze Nacht war er von Gilgal heraufgestiegen“.'
