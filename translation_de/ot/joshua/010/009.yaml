lexical_decisions:
- source_word: וַיָּבֹא אֲלֵיהֶם
  choice: Da kam Josua … über sie
  rationale: בוא mit אֶל bedeutet wörtlich „zu/auf jemanden zukommen“. Im militärischen Zusammenhang gibt „über sie kommen“ den überraschenden Zugriff natürlich wieder, ohne den Beginn des Kampfes ausdrücklich in das Verb hineinzulesen.
- source_word: פִּתְאֹם
  choice: plötzlich
  rationale: Direkte und idiomatische Wiedergabe der unvermittelten beziehungsweise unerwarteten Ankunft.
- source_word: כָּל הַלַּיְלָה
  choice: die ganze Nacht
  rationale: Die Wendung bezeichnet die gesamte Dauer der Nacht.
- source_word: עָלָה
  choice: heraufgezogen war
  rationale: עלה bezeichnet eine Aufwärtsbewegung. „Heraufziehen“ bewahrt die topografische Richtung und passt zu einer militärischen Truppenbewegung, ohne das spezifischere „marschieren“ in den Text einzutragen.
- source_word: מִן הַגִּלְגָּל
  choice: von Gilgal
  rationale: Direkte Wiedergabe der Herkunftsangabe; der Ortsname wird in seiner gebräuchlichen deutschen Form übernommen.
- source_word: יְהוֹשֻׁעַ
  choice: Josua
  rationale: Gebräuchliche deutsche Form des Personennamens.
