id: JOS.10.40
reference: Joshua 10:40
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּכֶּ֣ה יְהוֹשֻׁ֣עַ אֶת כָּל הָ/אָ֡רֶץ הָ/הָר֩ וְ/הַ/נֶּ֨גֶב וְ/הַ/שְּׁפֵלָ֜ה וְ/הָ/אֲשֵׁד֗וֹת וְ/אֵת֙ כָּל מַלְכֵי/הֶ֔ם לֹ֥א הִשְׁאִ֖יר שָׂרִ֑יד וְ/אֵ֤ת כָּל הַ/נְּשָׁמָה֙ הֶחֱרִ֔ים כַּ/אֲשֶׁ֣ר צִוָּ֔ה יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/040.yaml
  text: So Joshua struck all the land—the hill country[a], the Negev, the lowland, and the slopes—and all their kings. He left no survivor, but devoted to destruction every breathing thing, just as Yahweh, the God of Israel[b], had commanded.
translation:
  language: de
  text: So schlug Josua das ganze Land – das Bergland, den Negev, die Niederung und die Abhänge – samt allen ihren Königen. Er ließ keinen Überlebenden übrig, sondern weihte alles, was Atem hatte,[a] der Vernichtung,[b] ganz wie Jahwe, der Gott Israels, geboten hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „jeden Atem“ beziehungsweise „alles Atemhabende“; gemeint ist alles, was atmete.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „vollständig vernichtete“ beziehungsweise „dem Bann übergab“. Das hebräische Verb bezeichnet ein unwiderrufliches Weihen zur Vernichtung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֶּה
  choice: schlug
  rationale: נכה bezeichnet hier das Schlagen im Krieg; „schlug“ bewahrt die militärische Kraft, ohne das Verb unnötig auszudeuten.
- source_word: כָּל הָאָרֶץ
  choice: das ganze Land
  rationale: אֶרֶץ meint in diesem Zusammenhang das Gebiet des beschriebenen Feldzugs, nicht die gesamte Erde.
- source_word: הָהָר
  choice: das Bergland
  rationale: Der Ausdruck dient im Josuabuch als topografische Regionalbezeichnung und wird im Deutschen treffend mit „Bergland“ wiedergegeben.
- source_word: הַנֶּגֶב
  choice: den Negev
  rationale: Hier ist die südliche Trockenzone als geografische Region gemeint; der Eigenname wahrt diese Funktion.
- source_word: הַשְּׁפֵלָה
  choice: die Niederung
  rationale: שְׁפֵלָה bezeichnet die tiefer gelegene Hügellandschaft zwischen Bergland und Küstenebene; „Niederung“ ist verständlich und als Regionalbezeichnung geeignet.
- source_word: הָאֲשֵׁדוֹת
  choice: die Abhänge
  rationale: אֲשֵׁדוֹת bezeichnet Abhänge oder Gefälle und fügt sich so in die Aufzählung der Landschaftsräume ein.
- source_word: כָּל מַלְכֵיהֶם
  choice: samt allen ihren Königen
  rationale: „Samt“ bindet die Könige natürlich an den zusammenfassenden Gegenstand des Schlagens an und bewahrt den umfassenden Sinn von כָּל.
- source_word: לֹא הִשְׁאִיר שָׂרִיד
  choice: Er ließ keinen Überlebenden übrig
  rationale: שָׂרִיד meint im militärischen Zusammenhang einen Überlebenden oder Entronnenen; die Formulierung ist im modernen Deutsch klar.
- source_word: כָּל הַנְּשָׁמָה
  choice: alles, was Atem hatte
  rationale: Die Wiedergabe bleibt nahe an der hebräischen Wendung „alles/ jedes Atemhabende“, ohne ihren Umfang interpretierend auf Menschen oder bestimmte Lebewesen zu verengen.
- source_word: הֶחֱרִים
  choice: weihte ... der Vernichtung
  rationale: Die Hifil-Form von חרם bezeichnet das unwiderrufliche Bestimmen zum Bann beziehungsweise zur Vernichtung; „der Vernichtung weihen“ erhält sowohl die kultische als auch die zerstörerische Dimension.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: ganz wie ... geboten hatte
  rationale: Die Formulierung bringt die genaue Übereinstimmung mit einem vorausgegangenen göttlichen Gebot zum Ausdruck.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe der Bannterminologie חרם
  choice: weihte ... der Vernichtung
  alternative: vernichtete vollständig; vollstreckte den Bann an
  rationale: Die gewählte Formulierung erhält die kultisch-theologische Spannung des Verbs und benennt zugleich unmissverständlich dessen tödliche Konsequenz.
- issue: Umfang von כָּל הַנְּשָׁמָה
  choice: alles, was Atem hatte
  alternative: jeden Menschen; alles Lebendige
  rationale: Die hebräische Ausdrucksweise wird nicht vorschnell auf eine bestimmte Gruppe eingegrenzt; ihre umfassende und drastische Aussage bleibt stehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die geografischen Bezeichnungen bleiben verständlich und knapp; „Negev“ wird als etablierter Regionsname beibehalten. Die drastische Bannsprache des Ausgangstextes wird weder abgeschwächt noch konfessionell ausgedeutet.
