revisions:
- from: Dann zog Josua mit ganz Israel von Libna nach Lachisch. Sie schlugen dort gegenüber der Stadt ihr Lager auf und kämpften gegen sie.
  to: Dann zog Josua mit ganz Israel von Libna nach Lachisch. Er schlug gegen die Stadt sein Lager auf und kämpfte gegen sie.
  rationale: Die Revision ersetzt die räumlich missverständliche Wendung „gegenüber der Stadt“ durch die im militärischen Kontext klare Formulierung „gegen die Stadt sein Lager aufschlagen“. Zugleich wird die singularische Erzählführung des Hebräischen mit Josua als grammatischem Subjekt bewahrt. Eine Fußnote ist nicht erforderlich, da die deutsche Formulierung die Aussage ohne zusätzliche Deutungsentscheidung wiedergibt.
