  text: וַ/יַּעֲבֹ֣ר יְ֠הוֹשֻׁעַ וְ/כָל יִשְׂרָאֵ֥ל עִמּ֛/וֹ מִ/לִּבְנָ֖ה לָכִ֑ישָׁ/ה וַ/יִּ֣חַן עָלֶ֔י/הָ וַ/יִּלָּ֖חֶם בָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/031.yaml
  text: Then Joshua[a], and all Israel with him, passed on from Libnah to Lachish[b], and camped against it and fought against it.
translation:
  language: de
  text: Dann zog Josua mit ganz Israel von Libna nach Lachisch. Er schlug gegen die Stadt sein Lager auf und kämpfte gegen sie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: zog
  rationale: עבר bezeichnet hier im Zusammenhang eines militärischen Ortswechsels das Weiterziehen von einer Stadt zur anderen; „zog“ ist im Deutschen natürlich und vermeidet die unbelegte Vorstellung einer Gewässerüberquerung.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: mit ganz Israel
  rationale: Die Präpositionalfügung gibt knapp und idiomatisch wieder, dass ganz Israel Josua begleitete; im Kontext ist damit das mitziehende Volk beziehungsweise Heer gemeint.
- source_word: מִלִּבְנָה לָכִישָׁה
  choice: von Libna nach Lachisch
  rationale: Das direktionale He an לָכִישָׁה bezeichnet die Bewegung auf Lachisch zu; „nach Lachisch“ ist die übliche deutsche Wiedergabe eines Ortsziels.
- source_word: וַיִּחַן עָלֶיהָ
  choice: Sie schlugen dort gegenüber der Stadt ihr Lager auf
  rationale: חנה bedeutet „lagern“, während עַל im Belagerungszusammenhang eine gegen die Stadt gerichtete Stellung bezeichnet. Die Formulierung macht die feindliche Position deutlich, ohne „auf ihr“ missverständlich wörtlich wiederzugeben.
- source_word: וַיִּלָּחֶם בָּהּ
  choice: und kämpften gegen sie
  rationale: Das Niphal von לחם bedeutet „kämpfen/Krieg führen“; בָּהּ bezeichnet hier die Stadt als Gegnerin. Der Plural nimmt im natürlichen Deutschen Josua und ganz Israel gemeinsam als handelnde Gruppe auf.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Erzählsprache. Der hebräische Satz reiht singularische Verben mit Josua als grammatischem Subjekt aneinander; die deutsche Fassung nennt zunächst Josua mit ganz Israel und führt die gemeinsamen militärischen Handlungen anschließend idiomatisch im Plural fort.
