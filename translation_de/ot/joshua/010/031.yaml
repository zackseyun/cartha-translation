review_pass:
  verdict: revise
  source_fidelity: Die Ortsbewegung von Libna nach Lachisch und die gegen Lachisch gerichteten militärischen Handlungen sind richtig erfasst. „Gegenüber der Stadt“ bezeichnet jedoch im Deutschen vor allem eine Lage auf der anderen Seite und gibt עָלֶיהָ im Belagerungskontext nicht angemessen wieder.
  naturalness: „Dann zog Josua mit ganz Israel von Libna nach Lachisch“ ist natürlich und angemessen erzählsprachlich. Die Formulierung „Sie schlugen dort gegenüber der Stadt ihr Lager auf“ ist zwar verständlich, aber idiomatisch und semantisch weniger treffend als „gegen die Stadt sein Lager aufschlagen“.
  terminology: Die Namensformen Josua, Libna und Lachisch sind etabliert. „Ganz Israel“ gibt die kollektive hebräische Bezeichnung angemessen wieder; „kämpfte gegen sie“ bewahrt den Bezug auf die Stadt.
  issues:
  - severity: medium
    issue: „gegenüber der Stadt“ für וַיִּחַן עָלֶיהָ
    rationale: Das hebräische עַל bezeichnet hier angesichts des folgenden Kampfes eine gegen die Stadt gerichtete Belagerungsstellung. „Gegenüber“ kann bloß räumlich ‚auf der anderen Seite‘ bedeuten und schwächt die feindliche Ausrichtung ab.
  - severity: low
    issue: Pluralisches „Sie schlugen ... und kämpften“
    rationale: Der Plural ist als idiomatische Aufnahme von Josua und Israel möglich, während die hebräischen Erzählverben Josua als grammatisches Subjekt im Singular führen. Die Revision bewahrt diese Struktur ohne den Sinn zu ändern.
  revised_text: Dann zog Josua mit ganz Israel von Libna nach Lachisch. Er schlug gegen die Stadt sein Lager auf und kämpfte gegen sie.
