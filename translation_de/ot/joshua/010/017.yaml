  - severity: medium
    issue: Fußnotenalternative „beim Verstecken“ verändert die Bedeutung
    rationale: „Beim Verstecken“ kann bedeuten, dass die Könige beim Verstecken von etwas gefunden wurden. Die verbale Lesart des Partizips ist stattdessen mit „als sie sich versteckten“ wiederzugeben.
