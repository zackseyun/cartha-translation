  text: And it was reported to Joshua[a], saying, “The five kings have been found hidden in the cave at Makkedah.”
translation:
  language: de
  text: 'Josua wurde berichtet: „Die fünf Könige sind in der Höhle bei Makkeda versteckt gefunden worden.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die fünf Könige sind in der Höhle bei Makkeda gefunden worden, als sie sich versteckten.“ Das hebräische Partizip kann stärker verbal („sich versteckend“) oder als Zustand („versteckt“) verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: Da wurde … gemeldet
  rationale: Die passive Erzählform von נגד bezeichnet das Übermitteln einer Nachricht. Die Formulierung bewahrt das Passiv und klingt in modernem Deutsch natürlich.
- source_word: לִיהוֹשֻׁעַ
  choice: Josua
  rationale: Der Empfänger der Meldung wird im Deutschen ohne Präposition als Dativ ausgedrückt; der Name folgt der etablierten deutschen Form.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Die hebräische Einleitungsformel für direkte Rede wird idiomatisch durch einen Doppelpunkt wiedergegeben, statt mit dem im Deutschen schwerfälligen „indem man sagte“.
- source_word: נִמְצְאוּ
  choice: sind … gefunden worden
  rationale: Das passive Perfekt von מצא bezeichnet, dass die Könige aufgefunden wurden. Das deutsche Perfekt passt zur unmittelbar gemeldeten Entdeckung.
- source_word: חֲמֵשֶׁת הַמְּלָכִים
  choice: die fünf Könige
  rationale: Die Zahl mit dem bestimmten Substantiv verweist auf die bereits erwähnten fünf Könige.
- source_word: נֶחְבְּאִים
  choice: versteckt
  rationale: Das Partizip von חבא beschreibt entweder ihren Zustand als Versteckte oder, stärker verbal verstanden, ihr Sichverbergen. „Versteckt“ wahrt hier die Zustandsbedeutung.
- source_word: בַּמְּעָרָה
  choice: in der Höhle
  rationale: Präposition und bestimmtes Substantiv werden direkt und natürlich wiedergegeben.
- source_word: בְּמַקֵּדָה
  choice: bei Makkeda
  rationale: „Bei“ ordnet die Höhle dem Ort Makkeda zu, ohne zwingend zu behaupten, sie habe innerhalb einer klar abgegrenzten Siedlung gelegen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Der Doppelpunkt gibt die hebräische Redeeinleitung idiomatisch wieder; die etwas markierte Stellung von „versteckt“ erhält den möglichen Zustandsbezug des Partizips.
