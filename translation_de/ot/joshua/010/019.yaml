base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/019.yaml
  text: But as for you[a], do not stand still; pursue your enemies and strike their rear guard. Do not let them enter their cities, for Yahweh your God has given them into your hand.
translation:
  language: de
  text: Ihr aber bleibt nicht stehen! Verfolgt eure Feinde und greift die hintersten von ihnen an.[a] Lasst sie nicht in ihre Städte gelangen; denn Jahwe, euer Gott, hat sie in eure Hand gegeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Verb ist von „Schwanz“ abgeleitet und bezeichnet hier einen Angriff auf das hintere Ende einer fliehenden Streitmacht; möglich ist auch: „greift die Nachzügler an“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  choice: Ihr aber
  rationale: Die Konjunktion mit dem selbstständigen Pronomen hebt die Angesprochenen kontrastierend hervor; „Ihr aber“ gibt diesen Wechsel knapp und natürlich wieder.
- source_word: אַל תַּעֲמֹדוּ
  choice: bleibt nicht stehen
  rationale: עמד bedeutet wörtlich „stehen“; im militärischen Zusammenhang ist gemeint, dass die Verfolgung nicht unterbrochen werden soll.
- source_word: רִדְפוּ אַחֲרֵי אֹיְבֵיכֶם
  choice: Verfolgt eure Feinde
  rationale: רדף אחרי ist die übliche Wendung für das Verfolgen eines Gegners.
- source_word: וְזִנַּבְתֶּם אוֹתָם
  choice: greift ihre Nachhut an
  rationale: Das von „Schwanz“ abgeleitete Verb bezeichnet den Angriff auf den hintersten Teil eines fliehenden Heeres. „Nachhut“ vermittelt den militärischen Sinn, ohne ein planmäßiges Abschneiden zwingend vorauszusetzen.
- source_word: אַל תִּתְּנוּם לָבוֹא
  choice: Lasst sie nicht … gelangen
  rationale: נתן mit Infinitiv bezeichnet hier das Zulassen oder Ermöglichen; die deutsche Fügung gibt dies idiomatisch wieder.
- source_word: אֶל עָרֵיהֶם
  choice: in ihre Städte
  rationale: עיר kann Stadt oder Ortschaft bezeichnen; im Kontext der befestigten kanaanäischen Städte ist „Städte“ angemessen.
- source_word: כִּי נְתָנָם
  choice: denn … hat sie … gegeben
  rationale: Das Perfekt stellt die Übergabe der Feinde durch Gott als bereits vollzogen und damit den Sieg als gewiss dar.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵיכֶם
  choice: euer Gott
  rationale: Direkte Wiedergabe der Status-constructus-Verbindung mit Suffix der zweiten Person Plural.
- source_word: בְּיֶדְכֶם
  choice: in eure Hand
  rationale: Die singulische „Hand“ ist ein hebräisches Bild für Macht und Verfügungsgewalt; es bleibt auch im Deutschen verständlich und bewahrt die Bildsprache.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen, während „der HERR“ ihn durch einen Titel ersetzt.
translation_notes:
  register: Moderne, klare Standardsprache mit würdigem militärischem Ton. Die kurzen Imperative bilden die Dringlichkeit des hebräischen Textes ab; das traditionelle Bild „in eure Hand gegeben“ bleibt erhalten.
