source:
  edition: WLC
  text: וַ/יְהִ֗י כֶּ/אֱמֹ֣ר יְהוֹשֻׁעַ֮ אֶל הָ/עָם֒ וְ/שִׁבְעָ֣ה הַ/כֹּהֲנִ֡ים נֹשְׂאִים֩ שִׁבְעָ֨ה שׁוֹפְר֤וֹת הַ/יּֽוֹבְלִים֙ לִ/פְנֵ֣י יְהוָ֔ה עָבְר֕וּ וְ/תָקְע֖וּ בַּ/שּֽׁוֹפָר֑וֹת וַֽ/אֲרוֹן֙ בְּרִ֣ית יְהוָ֔ה הֹלֵ֖ךְ אַחֲרֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/008.yaml
  text: And it happened[a], when Joshua spoke to the people, that the seven priests carrying the seven ram's-horn trumpets before Yahweh passed on and blew the trumpets[b], and the ark of the covenant of Yahweh went behind them.
translation:
  language: de
  text: Und es geschah, als Josua zum Volk gesprochen hatte, zogen die sieben Priester, die die sieben Trompeten aus Widderhörnern[a] vor Jahwe[b] trugen, weiter und bliesen die Trompeten, und die Lade des Bundes Jahwes ging hinter ihnen her.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »die sieben Schofare des Jōbel«. Gemeint sind hier wahrscheinlich Hörner beziehungsweise Trompeten aus Widderhörnern; als weniger wahrscheinliche lexikalische Möglichkeit kommt eine Verbindung mit dem Jubeljahr in Betracht.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »in Jahwes Gegenwart«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Und es geschah
  rationale: Die hebräische Erzählungsform leitet das nächste Geschehen ein. Die Wendung bewahrt den biblisch-erzählenden Ton, ohne unnötig altertümlich zu wirken.
- source_word: כֶּאֱמֹר יְהוֹשֻׁעַ אֶל הָעָם
  choice: als Josua zum Volk gesprochen hatte
  rationale: כ mit dem Infinitiv constructus hat hier temporale Bedeutung. Das Plusquamperfekt macht im Deutschen klar, dass die folgende Handlung auf Josuas Rede einsetzt.
- source_word: שִׁבְעָה הַכֹּהֲנִים נֹשְׂאִים
  choice: die sieben Priester, die ... trugen
  rationale: Das Partizip beschreibt die Priester als Träger der Instrumente; ein Relativsatz ist im Deutschen natürlich und eindeutig.
- source_word: שִׁבְעָה שׁוֹפְרוֹת הַיּוֹבְלִים
  choice: die sieben Widderhorn-Trompeten
  rationale: שׁוֹפָר bezeichnet ein Horn beziehungsweise Blasinstrument; יוֹבֵל meint hier wahrscheinlich den Widder oder das Widderhorn. Die zusammengesetzte Wiedergabe vermittelt Herkunft und Funktion.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי bezeichnet die Stellung vor jemandem oder in dessen Gegenwart. Im Prozessionszusammenhang ist die räumliche Wiedergabe „vor“ am naheliegendsten.
- source_word: עָבְרוּ
  choice: zogen weiter
  rationale: עבר beschreibt hier die Vorwärtsbewegung in der Prozession, nicht das Überschreiten einer Grenze.
- source_word: וְתָקְעוּ בַּשּׁוֹפָרוֹת
  choice: und bliesen die Trompeten
  rationale: תקע mit שׁוֹפָר bedeutet, ein Horn beziehungsweise eine Trompete zu blasen; die Formulierung ist im modernen Deutschen idiomatisch.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: die Lade des Bundes Jahwes
  rationale: Die Wiedergabe bildet die hebräische Constructus-Verbindung transparent ab und bewahrt den Bundesbezug.
- source_word: הֹלֵךְ אַחֲרֵיהֶם
  choice: folgte ihnen
  rationale: Das Partizip mit אַחֲרֵי bezeichnet die fortlaufende Bewegung hinter den Priestern. „folgte ihnen“ ist natürlich und enthält die räumliche Abfolge.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von לִפְנֵי יְהוָה in der Prozession
  choice: vor Jahwe
  alternative: in der Gegenwart Jahwes
  rationale: Die Wendung kann sowohl räumlich als auch gegenwartsbezogen verstanden werden. Der Kontext der Prozessionsordnung legt „vor Jahwe“ nahe, ohne die Vorstellung seiner Gegenwart auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht biblischem Erzählton. Der lange hebräische Satz wird durch einen Doppelpunkt übersichtlich gegliedert; die Prozessionsfolge bleibt klar erkennbar.
