  source_fidelity: 'Der Satz gibt die hebräische Prozessionsfolge insgesamt zutreffend wieder: Josuas Ansprache, die sieben Priester mit den sieben Hörnern vor Jahwe, ihr Weiterziehen und Blasen sowie die Bundeslade hinter ihnen. „Folgte ihnen“ ist sachlich möglich, lässt aber die ausdrücklich räumliche Angabe אַחֲרֵיהֶם („hinter ihnen“) weniger klar hervortreten.'
  naturalness: Der Doppelpunkt nach „als Josua zum Volk gesprochen hatte“ wirkt im Deutschen etwas abgehackt. Eine Satzstellung mit dem Hauptsatz nach dem temporalen Nebensatz ist flüssiger. „Trompeten aus Widderhörnern“ ist zudem idiomatischer und verständlicher als die stark verdichtete Komposition „Widderhorn-Trompeten“.
  terminology: „Jahwe“ gibt den Gottesnamen konsistent wieder. „Lade des Bundes Jahwes“ ist eine angemessene Wiedergabe von אֲרוֹן בְּרִית יְהוָה. Die Fußnote muss beim hebräischen Ausdruck יוֹבֵל dessen unsichere lexikalische Deutung erläutern, ohne „Jubeltrompeten“ als gleichwertig nahezulegen.
