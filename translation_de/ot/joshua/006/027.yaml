  text: וַ/יְהִ֥י יְהוָ֖ה אֶת יְהוֹשֻׁ֑עַ וַ/יְהִ֥י שָׁמְע֖/וֹ בְּ/כָל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/027.yaml
  text: And Yahweh was with Joshua[a], and his fame was in all the land.
translation:
  language: de
  text: Und Jahwe war mit Josua, und sein Ruf[a] verbreitete sich im ganzen Land.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Nachricht über ihn“; auch: „sein Ansehen“. Das hebräische Wort kann einen Bericht, eine Nachricht oder den Ruf einer Person bezeichnen.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַיְהִי יְהוָה אֶת יְהוֹשֻׁעַ
  choice: Und Jahwe war mit Josua
  rationale: היה mit אֶת bezeichnet hier Gottes begleitende Gegenwart; die schlichte Vergangenheitsform entspricht dem hebräischen Erzählstil.
- source_word: שָׁמְעוֹ
  choice: sein Ruf
  rationale: Das Substantiv kann Bericht, Nachricht oder Ansehen bezeichnen. „Ruf“ bewahrt diese Spannweite im Deutschen besser als das stärker wertende „Ruhm“.
- source_word: בְּכָל הָאָרֶץ
  choice: im ganzen Land
  rationale: הָאָרֶץ bezeichnet im Erzählzusammenhang am ehesten das betreffende Land, nicht die gesamte Erde.
- source_word: וַיְהִי שָׁמְעוֹ בְּכָל הָאָרֶץ
  choice: sein Ruf verbreitete sich im ganzen Land
  rationale: Die idiomatische deutsche Formulierung gibt wieder, dass der Ruf beziehungsweise die Nachricht über Josua im ganzen Land bekannt wurde; ein wörtliches „sein Ruf war“ wäre unnatürlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova; der HERR
  rationale: „Jahwe“ bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen, und entspricht der üblichen deutschen Form.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Verbreitete sich“ ist eine natürliche deutsche Wiedergabe der hebräischen Zustandsaussage, während die Fußnote deren lexikalische Mehrdeutigkeit offenhält.
