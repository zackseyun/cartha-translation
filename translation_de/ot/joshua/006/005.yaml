revisions:
- from: Und wenn das Widderhorn lang gezogen wird[a] und ihr den Klang des Signalhorns hört, soll das ganze Volk ein gewaltiges Geschrei erheben. Dann wird die Mauer der Stadt in sich zusammenstürzen[b], und das Volk soll hinaufziehen, jeder gerade vor sich hin[c].
  to: Und wenn das Widderhorn lang geblasen wird[a], wenn ihr den Klang des Horns hört, soll das ganze Volk einen lauten Ruf ausstoßen. Dann wird die Mauer der Stadt in sich zusammenfallen[b], und das Volk soll hinaufziehen, jeder an der Stelle vor ihm[c].
  rationale: Die Revision ersetzt unnötig spezifizierendes „Signalhorn“ durch das quellennähere „Horn“, glättet die Hornblas-Metapher in idiomatisches Deutsch und stellt die distributive räumliche Aussage am Schluss eindeutig dar. Die schwierige Wendung zur einstürzenden Stadtmauer bleibt im Haupttext zurückhaltend; die Fußnote kennzeichnet ihre wahrscheinliche Bedeutung ausdrücklich als wahrscheinlich.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T09:40:02Z'
review_pass:
  verdict: revise
  source_fidelity: Die Grundstruktur und die wesentlichen hebräischen Begriffe sind zutreffend wiedergegeben. „Signalhorn“ ist jedoch für שׁוֹפָר unnötig spezifizierend und kann modern-militärische Assoziationen hervorrufen; „Horn“ wahrt den allgemeinen Instrumentbegriff. „Jeder gerade vor sich hin“ gibt נֶגְדּוֹ nicht präzise wieder, da „vor sich hin“ im Deutschen auch ziellos bedeuten kann. Die räumliche Nuance von תַּחְתֶּיהָ sollte mit einer vorsichtigen Fußnote erläutert werden, ohne die wahrscheinliche Deutung als sicheren Haupttext auszugeben.
  naturalness: „Lang gezogen wird“ ist bei einem Horn im Deutschen verständlich, aber deutlich weniger idiomatisch als „lang geblasen wird“. „Einen lauten Ruf ausstoßen“ ist für יָרִיעוּ תְּרוּעָה גְדוֹלָה natürlich und lässt offen, ob der Ruf als Jubel- oder Kriegsruf verstanden wird. „Jeder an der Stelle vor ihm“ ist klar und idiomatisch.
  terminology: „Widderhorn“ für קֶרֶן הַיּוֹבֵל ist passend. Für שׁוֹפָר ist „Horn“ gegenüber „Signalhorn“ vorzuziehen. Die Wiedergabe von עלה durch „hinaufziehen“ bleibt angemessen, ohne ein ausdrücklich nicht vorhandenes „stürmen“ einzutragen.
