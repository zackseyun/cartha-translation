base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/005.yaml
  text: And when the ram's horn is drawn out[a], when you hear the sound of the trumpet, all the people shall raise a great shout, and the wall of the city will fall beneath itself, and the people shall go up[c][b], each man straight before him.
translation:
  language: de
  text: Und wenn das Widderhorn lang geblasen wird[a], wenn ihr den Klang des Horns hört, soll das ganze Volk einen lauten Ruf ausstoßen. Dann wird die Mauer der Stadt in sich zusammenfallen[b], und das Volk soll hinaufziehen, jeder an der Stelle vor ihm[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn auf dem Widderhorn ein lang anhaltender Ton geblasen wird“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „wird die Mauer der Stadt unter sich fallen“; die Wendung bedeutet wahrscheinlich, dass sie senkrecht an Ort und Stelle zusammenfällt.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „jeder geradeaus vor sich“; das heißt, jeder soll an der Stelle vorgehen, die unmittelbar vor ihm liegt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּמְשֹׁךְ
  choice: lang gezogen wird
  rationale: Die Wendung bezeichnet das Verlängern des Hornstoßes. Die Formulierung bewahrt das Bild des hebräischen Verbs משׁך und bleibt im Deutschen verständlich; die Fußnote nennt eine natürlichere Deutung.
- source_word: קֶרֶן הַיּוֹבֵל
  choice: Widderhorn
  rationale: יוֹבֵל bezeichnet hier im Zusammenhang ein Widderhorn als Blasinstrument, nicht das Jubeljahr.
- source_word: קוֹל הַשּׁוֹפָר
  choice: Klang des Signalhorns
  rationale: שׁוֹפָר ist ein Horninstrument. „Signalhorn“ unterscheidet den Instrumentenklang vom anschließenden Geschrei des Volkes und ist allgemein verständlich.
- source_word: יָרִיעוּ ... תְּרוּעָה גְדוֹלָה
  choice: ein gewaltiges Geschrei erheben
  rationale: Verb und verwandtes Substantiv bilden eine verstärkende Verbindung. „Geschrei erheben“ gibt sie in natürlichem Deutsch wieder, ohne sie enger als Kriegsgeschrei festzulegen.
- source_word: וְנָפְלָה ... תַּחְתֶּיהָ
  choice: in sich zusammenstürzen
  rationale: Die wörtliche räumliche Wendung „unter sich“ beschreibt wahrscheinlich ein senkrechtes Zusammenbrechen. „In sich zusammenstürzen“ bewahrt das reflexive Bild in verständlichem Deutsch.
- source_word: וְעָלוּ
  choice: hinaufziehen
  rationale: עלה bedeutet grundsätzlich „hinaufgehen/-ziehen“. Im Belagerungszusammenhang bezeichnet es das Vorrücken in die Stadt, ohne dass „stürmen“ ausdrücklich im Verb liegt.
- source_word: אִישׁ נֶגְדּוֹ
  choice: jeder gerade vor sich hin
  rationale: Die distributive Wendung meint, dass jeder unmittelbar an der vor ihm liegenden Stelle vorgeht. „Jeder“ ist hier natürlich und umfasst die einzelnen Männer des genannten Volkes, ohne die räumliche Aussage zu verändern.
