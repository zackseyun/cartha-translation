    rationale: „In sich“ kann ein nach innen gerichtetes Einstürzen nahelegen, während die hebräische Wendung wahrscheinlich ein senkrechtes Zusammenfallen an Ort und Stelle meint. Die Erklärung sollte dies vorsichtig und klarer formulieren.
