    issue: „Signalhorn“ für שׁוֹפָר
    rationale: Das hebräische Wort bezeichnet ein Horn bzw. Schofar, nicht speziell ein Signalhorn. Die Spezifizierung ist nicht nötig und verändert den Registereindruck.
  - severity: medium
    issue: „jeder gerade vor sich hin“ für אִישׁ נֶגְדּוֹ
    rationale: Die deutsche Wendung kann ein zielloses Vorgehen nahelegen. Gemeint ist, dass jeder an dem unmittelbar vor ihm liegenden Abschnitt vorgeht.
  - severity: low
    issue: „lang gezogen wird“
    rationale: Die Formulierung ahmt zwar das hebräische Bild nach, ist bei einem Horn aber weniger natürlich. „Lang geblasen wird“ gibt die prolongierte Blasfolge idiomatisch wieder.
  - severity: low
