  text: וַ/יָּבֹ֜אוּ הַ/נְּעָרִ֣ים הַֽ/מְרַגְּלִ֗ים וַ/יֹּצִ֡יאוּ אֶת רָ֠חָב וְ/אֶת אָבִ֨י/הָ וְ/אֶת אִמָּ֤/הּ וְ/אֶת אַחֶ֨י/הָ֙ וְ/אֶת כָּל אֲשֶׁר לָ֔/הּ וְ/אֵ֥ת כָּל מִשְׁפְּחוֹתֶ֖י/הָ הוֹצִ֑יאוּ וַ/יַּ֨נִּיח֔וּ/ם מִ/ח֖וּץ לְ/מַחֲנֵ֥ה יִשְׂרָאֵֽל־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/023.yaml
  text: So the young men[a], the spies, went in and brought out Rahab, her father, her mother, her brothers, and all who belonged to her[b]. They brought out all her families and placed them outside the camp of Israel.
translation:
  language: de
  text: Da gingen die jungen Männer, die Kundschafter, hinein und führten Rahab, ihren Vater, ihre Mutter, ihre Brüder und alles, was zu ihr gehörte,[a] heraus. Auch alle ihre Verwandten[b] führten sie heraus und ließen sie außerhalb des Lagers Israels zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »alles, was ihr gehörte«. Der hebräische Ausdruck kann sowohl Personen als auch Besitz einschließen; in diesem Zusammenhang sind wahrscheinlich vor allem die Menschen ihres Haushalts gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »alle ihre Familien« beziehungsweise »alle ihre Sippen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּעָרִים
  choice: die jungen Männer
  rationale: נַעַר bezeichnet häufig einen jungen Mann. Hier sind damit die beiden Kundschafter gemeint; die Wiedergabe wahrt sowohl die Altersangabe als auch die natürliche deutsche Ausdrucksweise.
- source_word: הַמְרַגְּלִים
  choice: die Kundschafter
  rationale: Das substantivierte Partizip identifiziert die jungen Männer unmittelbar als Kundschafter. Diese knappe Apposition entspricht dem Hebräischen, ohne ein nicht ausdrücklich genanntes Objekt wie »das Land« zu ergänzen.
- source_word: וַיֹּצִיאוּ / הוֹצִיאוּ
  choice: führten ... heraus
  rationale: Der Hifil von יצא bedeutet »hinausführen/herausbringen«. »Herausführen« passt bei den genannten Personen natürlich und gibt die Wiederholung des hebräischen Verbs in beiden Sätzen wieder.
- source_word: כָּל אֲשֶׁר לָהּ
  choice: alles, was zu ihr gehörte
  rationale: Die Formulierung ist bewusst weit und kann Personen wie auch Besitz umfassen. Die neutrale Wiedergabe bewahrt diese im Hebräischen vorhandene Offenheit, statt den Bezug ausschließlich auf Personen festzulegen.
- source_word: מִשְׁפְּחוֹתֶיהָ
  choice: ihre Verwandten
  rationale: מִשְׁפָּחָה kann Familie, Großfamilie oder Sippe bezeichnen. Da die engsten Angehörigen bereits einzeln genannt wurden, vermittelt »Verwandte« verständlich den wahrscheinlich weiteren Familienkreis; die genaueren Möglichkeiten werden in einer Fußnote genannt.
- source_word: וַיַּנִּיחוּם
  choice: brachten sie ... unter
  rationale: Der Hifil von נוח bezeichnet hier das Absetzen beziehungsweise Unterbringen an einem Ort. »Unterbringen« klingt im Deutschen natürlich, ohne den im Text nicht genannten Grund dieses Aufenthalts festzulegen.
- source_word: מִחוּץ לְמַחֲנֵה יִשְׂרָאֵל
  choice: außerhalb des Lagers Israels
  rationale: Die räumliche Aussage wird eng am Hebräischen wiedergegeben. Warum Rahab und die Ihren dort untergebracht wurden, bleibt wie im Ausgangstext offen.
theological_decisions:
- issue: Grund für die Unterbringung Rahabs und ihres Haushalts außerhalb des Lagers
  choice: Nur die räumliche Angabe wiedergeben, ohne eine Begründung einzufügen.
  alternative: Den Ort als rituelle Absonderung, Schutzmaßnahme oder Übergang vor der Aufnahme in Israel erklären.
  rationale: Der hebräische Text nennt lediglich den Ort und lässt den Grund unausgesprochen. Die Übersetzung bewahrt diese narrative und theologische Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge und die Wiederholung von »herausführen« orientieren sich am Hebräischen. »Kundschafter« ist im Josuabuch verständlich und weniger modern-militärisch als »Spione«. Sämtliche Fußnotenmarker erscheinen im Haupttext.
