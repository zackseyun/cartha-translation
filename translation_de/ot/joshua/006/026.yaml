source:
  edition: WLC
  text: וַ/יַּשְׁבַּ֣ע יְהוֹשֻׁ֔עַ בָּ/עֵ֥ת הַ/הִ֖יא לֵ/אמֹ֑ר אָר֨וּר הָ/אִ֜ישׁ לִ/פְנֵ֣י יְהוָ֗ה אֲשֶׁ֤ר יָקוּם֙ וּ/בָנָ֞ה אֶת הָ/עִ֤יר הַ/זֹּאת֙ אֶת יְרִיח֔וֹ בִּ/בְכֹר֣/וֹ יְיַסְּדֶ֔/נָּה וּ/בִ/צְעִיר֖/וֹ יַצִּ֥יב דְּלָתֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/026.yaml
  text: At that time Joshua made them swear[a], saying, “Cursed before Yahweh is the man who rises up and rebuilds this city, Jericho. At the cost of his firstborn he will lay its foundation[c][b], and at the cost of his youngest he will set up its gates.”
translation:
  language: de
  text: 'Damals ließ Josua sie schwören[a]: »Verflucht vor Jahwe ist, wer sich daranmacht und diese Stadt, Jericho, wieder aufbaut! Um den Preis seines Erstgeborenen wird er ihr Fundament legen, und um den Preis seines Jüngsten wird er ihre Tore einsetzen.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »verpflichtete sie durch einen Schwur«. Das hebräische Verb steht in einer kausativen Form: Josua veranlasste die Anwesenden zu schwören.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »mit seinem Erstgeborenen ... und mit seinem Jüngsten«. Gemeint ist wahrscheinlich, dass er sie dabei verlieren wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁבַּע
  choice: ließ Josua sie schwören
  rationale: 'Der Hifil von שׁבע ist kausativ: Josua veranlasste die Anwesenden zu einem Schwur. Das im Hebräischen nicht ausdrücklich genannte Objekt wird im Deutschen aus dem Zusammenhang ergänzt.'
- source_word: בָּעֵת הַהִיא
  choice: Damals
  rationale: Natürliche und prägnante Wiedergabe der üblichen Zeitangabe.
- source_word: אָרוּר הָאִישׁ
  choice: Verflucht ... ist, wer
  rationale: Bewahrt die vorangestellte Fluchformel; das generische הָאִישׁ wird im heutigen Deutsch idiomatisch mit »wer« wiedergegeben.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: Gibt die Vorstellung der Gegenwart beziehungsweise des Angesichts JHWHs knapp wieder und folgt der vorgegebenen Projektschreibung des Gottesnamens.
- source_word: יָקוּם וּבָנָה
  choice: sich daranmacht und ... wieder aufbaut
  rationale: קום bezeichnet hier das entschlossene Tätigwerden; »wieder aufbaut« verdeutlicht im Kontext der zerstörten Stadt die Wiederherstellung.
- source_word: בִּבְכֹרוֹ ... וּבִצְעִירוֹ
  choice: um den Preis seines Erstgeborenen ... um den Preis seines Jüngsten
  rationale: Das ב wird im Fluchkontext wahrscheinlich als Preis beziehungsweise Verlust verstanden. Die Formulierung macht diese Bedeutung verständlich, ohne die genaue Todesursache oder ein Opfergeschehen festzulegen.
- source_word: יְיַסְּדֶנָּה
  choice: wird er ihr Fundament legen
  rationale: Gibt יסד im konkreten Bauzusammenhang wieder; das feminine Suffix bezieht sich auf die Stadt.
- source_word: יַצִּיב דְּלָתֶיהָ
  choice: wird er ihre Tore einsetzen
  rationale: Im Zusammenhang einer Stadt bezeichnet דלתיה die Torflügel beziehungsweise Tore; »einsetzen« passt zum abschließenden Bauvorgang.
theological_decisions:
- issue: Charakter von Josuas Ausspruch
  choice: feierliche Fluchformel vor Jahwe
  alternative: bloßer persönlicher Wunsch oder rein ziviles Verbot
  rationale: Die Wendung »verflucht vor Jahwe« verankert den Ausspruch ausdrücklich in Gottes Gegenwart, ohne seine Wirkungsweise weiter zu erklären.
- issue: Verlust des Erstgeborenen und des Jüngsten
  choice: Der Wiederaufbau geschieht um den Preis beider
  alternative: ausdrückliche Aussage über Kinderopfer oder eine näher bestimmte Todesart
  rationale: Der Vers verbindet die beiden Verluste mit Beginn und Abschluss des Wiederaufbaus, nennt aber weder Opferhandlung noch Todesmechanismus. Diese Unbestimmtheit bleibt erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Fluchformel bleibt markant vorangestellt. »Wer« vermeidet ein missverständliches ausschließlich männliches Verständnis des generisch gebrauchten hebräischen Singulars. Die Verlustformel wird verständlich wiedergegeben, während die genaue Art des Geschehens offenbleibt.
