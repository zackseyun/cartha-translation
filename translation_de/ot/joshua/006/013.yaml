source:
  edition: WLC
  text: וְ/שִׁבְעָ֣ה הַ/כֹּהֲנִ֡ים נֹשְׂאִים֩ שִׁבְעָ֨ה שׁוֹפְר֜וֹת הַ/יֹּבְלִ֗ים לִ/פְנֵי֙ אֲר֣וֹן יְהוָ֔ה הֹלְכִ֣ים הָל֔וֹךְ וְ/תָקְע֖וּ בַּ/שּׁוֹפָר֑וֹת וְ/הֶ/חָלוּץ֙ הֹלֵ֣ךְ לִ/פְנֵי/הֶ֔ם וְ/הַֽ/מְאַסֵּ֗ף הֹלֵךְ֙ אַֽחֲרֵי֙ אֲר֣וֹן יְהוָ֔ה הולך וְ/תָק֥וֹעַ בַּ/שּׁוֹפָרֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/013.yaml
  text: And the seven priests[a], carrying seven ram’s-horn trumpets before the ark of Yahweh, were walking on and blowing the trumpets, and the armed men were going before them, and the rear guard was going behind the ark of Yahweh, while they went on blowing the trumpets.
translation:
  language: de
  text: Und die sieben Priester trugen sieben Widderhornposaunen[a] vor der Lade Jahwes her. Sie schritten immer weiter und bliesen die Posaunen. Die bewaffneten Männer zogen vor ihnen her, und die Nachhut folgte hinter der Lade Jahwes, während fortwährend die Posaunen geblasen wurden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sieben Jubiläumshörner“ beziehungsweise „sieben Widderhörner“. Der hebräische Ausdruck bezeichnet Schofarhörner, die aus Widderhörnern gefertigt oder mit ihnen verbunden sind.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: שׁוֹפְרוֹת הַיֹּבְלִים
  choice: Widderhornposaunen
  rationale: שׁוֹפָר bezeichnet ein Blas- beziehungsweise Horninstrument; הַיֹּבְלִים stellt den Bezug zum Widderhorn her. „Widderhornposaunen“ gibt Material beziehungsweise Herkunft und Instrumentfunktion verständlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen in seiner geläufigen wissenschaftlichen Form „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: הֹלְכִים הָלוֹךְ
  choice: sie schritten immer weiter
  rationale: Die Verbindung aus finitem Verb und Infinitivus absolutus hebt den fortdauernden Verlauf der Prozession hervor.
- source_word: וְתָקְעוּ בַּשּׁוֹפָרוֹת
  choice: und bliesen die Posaunen
  rationale: תקע mit שׁוֹפָר bezeichnet idiomatisch das Blasen der Instrumente; im Zusammenhang ist die Handlung fortlaufend.
- source_word: הֶחָלוּץ
  choice: die bewaffneten Männer
  rationale: Der Ausdruck bezeichnet die zum Kampf gerüstete Abteilung an der Spitze des Zuges.
- source_word: לִפְנֵיהֶם
  choice: vor ihnen her
  rationale: Die räumliche Wendung bezieht sich am natürlichsten auf die zuvor genannten Priester.
- source_word: הַמְאַסֵּף
  choice: die Nachhut
  rationale: Im militärischen und prozessionalen Zusammenhang ist damit die Abteilung gemeint, die den Zug nach hinten abschirmt.
- source_word: אַחֲרֵי אֲרוֹן יְהוָה
  choice: hinter der Lade Jahwes
  rationale: אַחֲרֵי hat hier eindeutig räumlichen Sinn innerhalb der Prozessionsordnung.
- source_word: הוֹלֵךְ וְתָקוֹעַ בַּשּׁוֹפָרוֹת
  choice: während fortwährend die Posaunen geblasen wurden
  rationale: Die Konstruktion beschreibt die anhaltende Begleithandlung. Die unpersönliche Wiedergabe bewahrt die im Hebräischen nicht ausdrücklich bezeichnete Identität der Bläser, ohne sie stillschweigend mit der Nachhut gleichzusetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Tetragrammaton unmittelbar. „Jahwe“ bewahrt den persönlichen Gottesnamen; „der HERR“ wäre die traditionelle Ersetzung durch einen Titel.
- issue: Subjekt der abschließenden Blashandlung
  choice: 'unpersönliche Formulierung: „während fortwährend die Posaunen geblasen wurden“'
  alternative: „während sie weiterzogen und die Posaunen bliesen“
  rationale: Die hebräische Formulierung ist syntaktisch knapp, und die konkrete Zuordnung des Blasens soll nicht unnötig auf die unmittelbar zuvor genannte Nachhut festgelegt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Lade Jahwes“ folgt der knappen hebräischen Genitivverbindung. Die Wiederholung des Blasens bleibt erhalten, da sie den fortdauernden Ablauf betont; die Satzgliederung vermeidet jedoch einen schwerfälligen deutschen Kettensatz.
