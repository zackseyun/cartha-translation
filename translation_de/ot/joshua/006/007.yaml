source:
  edition: WLC
  text: ו/יאמרו אֶל הָ/עָ֔ם עִבְר֖וּ וְ/סֹ֣בּוּ אֶת הָ/עִ֑יר וְ/הֶ֣/חָל֔וּץ יַעֲבֹ֕ר לִ/פְנֵ֖י אֲר֥וֹן יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/007.yaml
  text: And they said to the people[a], “Pass on and go around the city, and let the armed men pass before the ark of Yahweh.”
translation:
  language: de
  text: 'Da sagten sie zum Volk: »Zieht weiter und umkreist die Stadt! Die Gerüsteten[a] sollen vor der Lade Jahwes herziehen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Vorhut“, das heißt die bewaffneten Männer, die vor der Lade herziehen.'
    reason: 'Lexikalische Alternative: חָלוּץ kann sowohl die zum Kampf Gerüsteten als auch ihre Funktion als vorausziehender Verband bezeichnen.'
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Da sagten sie
  rationale: Die pluralische Wayyiqtol-Form führt die nächste Handlung der Erzählung fort. „Da sagten sie“ gibt sowohl die Abfolge als auch den Numerus wieder.
- source_word: אֶל־הָעָם
  choice: zum Volk
  rationale: עָם bedeutet gewöhnlich „Volk“. Obwohl hier die zum Zug versammelte Gemeinschaft gemeint ist, wäre „Heer“ eine unnötige Einengung.
- source_word: עִבְרוּ
  choice: Zieht weiter
  rationale: עבר bezeichnet hier das Vorwärtsziehen in der Prozession, nicht das Überschreiten eines Flusses oder einer Grenze. „Zieht weiter“ ist im Marschkontext natürlich.
- source_word: וְסֹבּוּ אֶת־הָעִיר
  choice: und umkreist die Stadt
  rationale: סבב fordert dazu auf, rings um die Stadt zu ziehen. „Umkreist“ ist knapp, verständlich und fügt keine zusätzliche militärische Deutung hinzu.
- source_word: וְהֶחָלוּץ
  choice: Die Gerüsteten
  rationale: חָלוּץ bezeichnet die zum Kampf ausgerüsteten Männer beziehungsweise den vorausziehenden bewaffneten Verband. „Die Gerüsteten“ bewahrt die militärische Bedeutung und lässt die genaue Funktion offen; die mögliche Wiedergabe „Vorhut“ steht in der Fußnote.
- source_word: יַעֲבֹר
  choice: sollen … herziehen
  rationale: Der Imperfekt hat hier auffordernden beziehungsweise anweisenden Sinn. Der Plural im Deutschen richtet sich sinngemäß nach der als Mehrzahl verstandenen Kollektivbezeichnung „die Gerüsteten“.
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  choice: vor der Lade Jahwes
  rationale: לִפְנֵי gibt die Position vor der Lade an. Der Gottesname wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt diesen im Deutschen als Namen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Imperative sind direkt und klar; „Lade“ folgt dem etablierten biblischen Sprachgebrauch. Die Mehrdeutigkeit von חָלוּץ wird im Haupttext nicht auf die Funktion als Vorhut verengt, sondern durch eine Fußnote offengehalten.
