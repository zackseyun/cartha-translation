  source_fidelity: 'Der Text gibt die pluralische Erzählform וַיֹּאמְרוּ angemessen wieder und bewahrt die Abfolge der Anweisungen: vorwärtsziehen, die Stadt umrunden und den bewaffneten/vorausgehenden Verband vor der Lade Jahwes ziehen lassen. „Volk“ entspricht עָם, ohne den Bezug unnötig auf ein Heer zu verengen. Die auffordernde Funktion von יַעֲבֹר ist mit „sollen … herziehen“ in diesem Anweisungskontext hinreichend wiedergegeben.'
