  text: וְ/אֶת הָ/עָם֩ צִוָּ֨ה יְהוֹשֻׁ֜עַ לֵ/אמֹ֗ר לֹ֤א תָרִ֨יעוּ֙ וְ/לֹֽא תַשְׁמִ֣יעוּ אֶת קוֹלְ/כֶ֔ם וְ/לֹא יֵצֵ֥א מִ/פִּי/כֶ֖ם דָּבָ֑ר עַ֠ד י֣וֹם אָמְרִ֧/י אֲלֵי/כֶ֛ם הָרִ֖יעוּ וַ/הֲרִיעֹתֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/010.yaml
  text: And Joshua commanded the people[a], saying, “Do not shout, and do not let your voice be heard, and do not let a word go out from your mouth until the day I say to you[b], ‘Shout!’ Then you shall shout.”
translation:
  language: de
  text: 'Josua befahl dem Volk: »Erhebt kein Geschrei[a] und lasst eure Stimme nicht vernehmen. Kein Wort soll aus eurem Mund kommen[b], bis zu dem Tag, an dem ich zu euch sage: ›Erhebt Geschrei!‹ Dann sollt ihr Geschrei erheben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Schreit nicht«. Im militärischen Zusammenhang kann es auch »Erhebt kein Kriegsgeschrei« heißen.'
    reason: Das hebräische Verb bezeichnet einen lauten Ruf oder ein Geschrei; der Kontext kann eine militärische Nuance nahelegen, legt sie aber nicht zwingend fest.
  - marker: b
    text: 'Wörtlich: »Kein Wort soll aus eurem Mund hinausgehen.«'
    reason: Die Fußnote macht die konkrete räumliche Bildsprache des Hebräischen sichtbar.
lexical_decisions:
- source_word: צִוָּה
  choice: hatte ... befohlen
  rationale: Das Verb bezeichnet eine verbindliche, autoritative Anweisung. Das Plusquamperfekt gibt im Deutschen natürlich wieder, dass der Befehl für den beschriebenen Umzug galt.
- source_word: הָעָם
  choice: dem Volk
  rationale: Der allgemeine hebräische Ausdruck bedeutet »Volk«; eine Einengung auf »Truppen« oder »Heer« wird vermieden.
- source_word: לֹא תָרִיעוּ / הָרִיעוּ / וַהֲרִיעֹתֶם
  choice: Stoßt kein Kriegsgeschrei aus / Stoßt das Kriegsgeschrei aus / Dann sollt ihr das Kriegsgeschrei ausstoßen
  rationale: Die Hifil-Form von רוע bezeichnet hier im militärischen Zusammenhang einen lauten Ruf, wahrscheinlich einen Kampf- oder Siegesruf. Die wiederholte Formulierung bewahrt die dreifache Verwendung derselben hebräischen Wurzel.
- source_word: וְלֹא תַשְׁמִיעוּ אֶת קוֹלְכֶם
  choice: lasst eure Stimme nicht hören
  rationale: Die kausative Form bedeutet wörtlich, die eigene Stimme nicht hörbar werden zu lassen; die deutsche Wendung bleibt nah am Bild und ist verständlich.
- source_word: וְלֹא יֵצֵא מִפִּיכֶם דָּבָר
  choice: Kein Wort soll aus eurem Mund kommen
  rationale: Die Übersetzung bewahrt das konkrete hebräische Bild sowie den Singular »Wort« und klingt zugleich natürlich.
- source_word: עַד יוֹם אָמְרִי אֲלֵיכֶם
  choice: bis zu dem Tag, an dem ich zu euch sage
  rationale: Die zeitliche Infinitivkonstruktion wird idiomatisch wiedergegeben, während das konkrete »Tag« erhalten bleibt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und befehlend. »Kriegsgeschrei« bildet den militärischen Kontext ab; die Fußnote hält die breitere lexikalische Bedeutung offen.
