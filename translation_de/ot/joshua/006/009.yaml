base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/009.yaml
  text: And the armed men were going before the priests who were blowing the trumpets[a], and the rear guard was going behind the ark, while they kept blowing the trumpets.
translation:
  language: de
  text: Die Bewaffneten zogen vor den Priestern her, die in die Hörner[a] stießen, und die Nachhut zog hinter der Lade her und stieß fortwährend in die Hörner.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch schofarot: Hörner, oft als »Widderhörner« wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחָלוּץ
  choice: die Bewaffneten
  rationale: Der Ausdruck bezeichnet hier die bewaffnete Abteilung, die in der Prozessionsordnung vorauszieht. »Die Bewaffneten« ist konkret und verständlich, ohne die Gruppe stärker als bloße »Vorhut« zu bestimmen.
- source_word: הֹלֵךְ
  choice: zogen … her
  rationale: Das Partizip beschreibt den fortdauernden Zug der Abteilungen. Das Präteritum mit »herziehen« gibt Bewegung und räumliche Anordnung natürlich wieder.
- source_word: לִפְנֵי
  choice: vor … her
  rationale: Die Wendung bezeichnet die räumliche Position an der Spitze der Prozession.
- source_word: הַכֹּהֲנִים
  choice: die Priester
  rationale: Dies ist die übliche und sachlich genaue Wiedergabe des kultischen Amtsbegriffs.
- source_word: תקעו הַשּׁוֹפָרוֹת
  choice: die in die Hörner stießen
  rationale: Die Formulierung beschreibt die fortlaufende Tätigkeit der Priester. Im Deutschen ist »in ein Horn stoßen« die natürliche Verbindung; »Hörner« bewahrt den konkreten Instrumentenbezug.
- source_word: הַמְאַסֵּף
  choice: die Nachhut
  rationale: Das substantivierte Partizip bezeichnet die am Ende des Zuges gehende, sammelnde Abteilung. »Nachhut« gibt ihre Stellung und militärische Funktion knapp wieder.
- source_word: אַחֲרֵי
  choice: hinter … her
  rationale: Hier liegt die räumliche Bedeutung innerhalb der Prozessionsordnung vor.
- source_word: הָאָרוֹן
  choice: die Lade
  rationale: Der unmittelbare Zusammenhang identifiziert sie als die Bundeslade; der hebräische Vers selbst verwendet hier nur die Kurzbezeichnung.
- source_word: הָלוֹךְ וְתָקוֹעַ
  choice: während fortwährend … gestoßen wurde
  rationale: Die Konstruktion drückt anhaltende beziehungsweise wiederholte Handlung während des Zuges aus. Die unpersönliche Passivform bewahrt die im Hebräischen nicht nochmals ausdrücklich genannte handelnde Person.
- source_word: בַּשּׁוֹפָרוֹת
  choice: in die Hörner
  rationale: Die Wiederholung entspricht dem hebräischen Text und hält das fortgesetzte Blasen der Schofarhörner präsent.
theological_decisions:
- issue: Wer im letzten Satzteil fortwährend in die Hörner stößt
  choice: Unpersönliche Passivform ohne erneut genannten Handelnden
  alternative: »während die Priester fortwährend in die Hörner stießen«
  rationale: Aus dem ersten Satzteil sind die Priester als Bläser naheliegend, doch im abschließenden hebräischen Ausdruck wird das Subjekt nicht ausdrücklich wiederholt. Die Übersetzung lässt diese syntaktische Offenheit bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Prozessionsbeschreibung. Die wiederholte Wendung »in die Hörner stoßen« bildet die Wiederholung des hebräischen Textes ab; die Fußnote erläutert die konkrete Instrumentenbezeichnung.
