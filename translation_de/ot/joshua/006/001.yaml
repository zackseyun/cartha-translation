  text: Jericho was tightly shut up because of the sons of Israel[a]; no one went out[b], and no one came in.
translation:
  language: de
  text: Jericho war wegen der Israeliten[a] fest verschlossen[b]; niemand ging hinaus, und niemand kam hinein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Söhne Israels“; eine feste hebräische Bezeichnung für das Volk Israel.'
