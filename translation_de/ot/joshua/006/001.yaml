lexical_decisions:
- source_word: וִירִיחוֹ
  choice: Jericho aber
  rationale: Das vorangestellte ו führt die Erzählung weiter und setzt zugleich den Zustand Jerichos gegenüber dem vorausgehenden Geschehen ab. „Aber“ gibt diese diskursive Funktion im Deutschen natürlich wieder, ohne ein ausdrückliches Zeitwort hinzuzufügen.
- source_word: סֹגֶרֶת וּמְסֻגֶּרֶת
  choice: war fest verschlossen
  rationale: Die Verbindung zweier Formen von סגר verstärkt die Aussage vollständiger Abriegelung. „Fest verschlossen“ bildet diese emphatische Wirkung idiomatisch ab.
- source_word: מִפְּנֵי
  choice: wegen
  rationale: Die Präposition bezeichnet hier den Anlass für die Abriegelung Jerichos. „Wegen“ bleibt näher am ausdrücklich Gesagten als das interpretierende „aus Angst vor“.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Wörtlich steht „die Söhne Israels“, doch die feste hebräische Bezeichnung meint das Volk Israel als Gemeinschaft. „Die Israeliten“ gibt diese Bedeutung im modernen Deutschen klar und natürlich wieder.
- source_word: אֵין יוֹצֵא וְאֵין בָּא
  choice: niemand ging hinaus, und niemand kam hinein
  rationale: Die parallele Wendung beschreibt die vollständige Unterbindung jedes Verkehrs. Das Präteritum entspricht der erzählenden Zustandsbeschreibung.
