source:
  edition: WLC
  text: וְ/כֹ֣ל כֶּ֣סֶף וְ/זָהָ֗ב וּ/כְלֵ֤י נְחֹ֨שֶׁת֙ וּ/בַרְזֶ֔ל קֹ֥דֶשׁ ה֖וּא לַֽ/יהוָ֑ה אוֹצַ֥ר יְהוָ֖ה יָבֽוֹא׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/019.yaml
  text: But all the silver and gold[a], and the vessels of bronze and iron, are holy to Yahweh[b]; they shall go into the treasury of Yahweh.
translation:
  language: de
  text: Doch alles Silber und Gold sowie die Gegenstände aus Bronze und Eisen sind Jahwe heilig; sie sollen in die Schatzkammer Jahwes kommen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כֹל
  choice: Doch alles
  rationale: Das וְ führt den Satz weiter, hat im Zusammenhang mit dem Verbot des vorigen Verses aber eine abgrenzende Wirkung. „Doch“ gibt diesen Kontrast im Deutschen natürlich wieder; כֹל bedeutet „alles“.
- source_word: כֶּסֶף וְ/זָהָב
  choice: Silber und Gold
  rationale: כֶּסֶף bezeichnet hier wegen der Aufzählung von Metallen Silber, nicht Geld; זָהָב ist Gold.
- source_word: וּ/כְלֵי נְחֹשֶׁת וּ/בַרְזֶל
  choice: sowie die Gegenstände aus Bronze und Eisen
  rationale: כְּלִי ist ein weiter Begriff für Gegenstände, Geräte oder Gefäße. „Gegenstände“ vermeidet eine unnötige Beschränkung auf Gefäße. נְחֹשֶׁת wird im materiellen Kontext sachgerecht mit „Bronze“ wiedergegeben.
- source_word: קֹדֶשׁ הוּא לַ/יהוָה
  choice: sind Jahwe heilig
  rationale: Die hebräische Singularform fasst die gesamte Aufzählung als kollektive Einheit auf. Im Deutschen ist der Plural nach der mehrteiligen Aufzählung natürlich. „Jahwe heilig“ bewahrt den Gedanken der Aussonderung und Zugehörigkeit.
- source_word: אוֹצַר יְהוָה
  choice: den Schatz Jahwes
  rationale: אוֹצָר kann Schatz, Schatzkammer oder Vorratshaus bezeichnen. Hier geht es um die gesammelten wertvollen Metalle und Gegenstände; „Schatz Jahwes“ lässt sowohl den Bestand als auch den dafür bestimmten Aufbewahrungsbereich anklingen.
- source_word: יָבֽוֹא
  choice: sie sollen … kommen
  rationale: Der hebräische Singular behandelt die aufgezählten Dinge kollektiv. Der deutsche Plural entspricht der Satzstruktur, während „kommen“ die aktive Form wahrt und kein ungesagtes menschliches Subjekt durch „gebracht werden“ einführt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen יהוה. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von קֹדֶשׁ לַיהוָה
  choice: Jahwe heilig
  alternative: für Jahwe ausgesondert / gehört Jahwe als Heiliges
  rationale: Die knappe Formulierung bewahrt sowohl den Status der Heiligkeit als auch die Ausrichtung auf Jahwe, ohne die Beziehung ausschließlich als Eigentum oder kultische Weihe auszulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kollektiven hebräischen Singularformen werden wegen der mehrteiligen deutschen Aufzählung idiomatisch im Plural wiedergegeben. Die Formulierung bleibt knapp und folgt der Struktur des Hebräischen.
