base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/015.yaml
  text: And it happened on the seventh day that they rose early, at the going up of the dawn, and marched around the city in this manner seven times. Only on that day did they march around the city seven times.
translation:
  language: de
  text: Am siebten Tag geschah es, dass sie früh aufstanden, bei Anbruch der Morgenröte, und auf diese Weise siebenmal um die Stadt zogen. Nur an diesem Tag zogen sie siebenmal um die Stadt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּעֲלוֹת הַשַּׁחַר
  choice: als die Morgenröte aufstieg
  rationale: Gibt das Bild des aufsteigenden Tagesanbruchs natürlich und zugleich quellennah wieder.
- source_word: וַיָּסֹבּוּ / סָבְבוּ
  choice: zogen … um die Stadt
  rationale: Das Verb bezeichnet das Umkreisen beziehungsweise Umziehen der Stadt; „zogen“ passt zum erzählten geordneten Zug, ohne eine ausdrücklich militärische Bedeutung hinzuzufügen.
- source_word: כַּמִּשְׁפָּט הַזֶּה
  choice: auf diese Weise
  rationale: Im Kontext meint die Wendung die zuvor festgelegte Vorgehensweise; die Übersetzung ist idiomatisch und bewahrt den rückverweisenden Sinn.
- source_word: רַק
  choice: nur
  rationale: Hebt wie im Hebräischen hervor, dass allein an diesem Tag sieben Umzüge stattfanden.
