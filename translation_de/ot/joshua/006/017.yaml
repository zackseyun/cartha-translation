  text: וְ/הָיְתָ֨ה הָ/עִ֥יר חֵ֛רֶם הִ֥יא וְ/כָל אֲשֶׁר בָּ֖/הּ לַֽ/יהוָ֑ה רַק֩ רָחָ֨ב הַ/זּוֹנָ֜ה תִּֽחְיֶ֗ה הִ֚יא וְ/כָל אֲשֶׁ֣ר אִתָּ֣/הּ בַּ/בַּ֔יִת כִּ֣י הֶחְבְּאַ֔תָה אֶת הַ/מַּלְאָכִ֖ים אֲשֶׁ֥ר שָׁלָֽחְנוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/017.yaml
  text: And the city and all that is in it shall be devoted to destruction for Yahweh[a]. Only Rahab the prostitute shall live, she and all who are with her in the house[b], because she hid the messengers whom we sent.
translation:
  language: de
  text: Und die Stadt soll mit allem, was in ihr ist, Jahwe zur Vernichtung geweiht sein[a]. Nur die Prostituierte Rahab soll am Leben bleiben, sie und alle, die mit ihr im Haus sind, denn sie hat die Boten versteckt, die wir ausgesandt hatten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem Bann verfallen“. Das hebräische Wort bezeichnet etwas, das Jahwe unwiderruflich übereignet ist, hier indem es vernichtet wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵרֶם
  choice: dem Bann verfallen
  rationale: Der Ausdruck bezeichnet hier eine unwiderrufliche Übereignung an Gott, die im Zusammenhang der Eroberung durch Vernichtung vollzogen wird. „Dem Bann verfallen“ bewahrt diese kultisch-rechtliche und zugleich zerstörerische Bedeutung; die Fußnote erläutert sie.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition bezeichnet die Zuordnung beziehungsweise Übereignung an JHWH. „Für Jahwe“ gibt dies im Deutschen knapp wieder; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: רַק
  choice: Nur
  rationale: Das Wort führt die einzige Ausnahme vom Bann über die Stadt ein.
- source_word: הַזּוֹנָה
  choice: die Prostituierte
  rationale: Dies ist die klare, gegenwärtige Bezeichnung; „Hure“ wäre unnötig abwertend und „Dirne“ veraltet.
- source_word: תִּחְיֶה
  choice: soll am Leben bleiben
  rationale: Die Wendung gibt den Gegensatz zur Vernichtung im Deutschen natürlich wieder, ohne mehr als das Fortleben auszudrücken.
- source_word: אִתָּהּ בַּבַּיִת
  choice: bei ihr im Haus
  rationale: Die Formulierung bezeichnet diejenigen, die sich zusammen mit Rahab im Haus befinden, nicht abstrakt ihren Haushalt.
- source_word: הֶחְבְּאַתָה
  choice: sie hat ... versteckt
  rationale: Der Hifil von חבא bedeutet „verstecken“ oder „verbergen“; „versteckt“ ist unmittelbar und fügt keinen zusätzlichen Schutzgedanken hinzu.
- source_word: הַמַּלְאָכִים
  choice: die Boten
  rationale: מַלְאָךְ bedeutet grundsätzlich „Bote“. Im Kontext sind die von Josua zur Erkundung ausgesandten Männer gemeint; „Boten“ wahrt die lexikalische Formulierung des Verses.
- source_word: שָׁלָחְנוּ
  choice: die wir ausgesandt hatten
  rationale: Das Plusquamperfekt macht im Deutschen natürlich deutlich, dass die Aussendung vor Rahabs Verstecken lag.
- source_word: וְהָיְתָה הָעִיר ... הִיא וְכָל אֲשֶׁר בָּהּ
  choice: Und die Stadt mit allem, was in ihr ist, soll ... verfallen sein
  rationale: Die deutsche Fassung gibt den gesamten Umfang des Urteils klar wieder, ohne das im Deutschen schwerfällige resumptive Pronomen des Hebräischen nachzuahmen.
theological_decisions:
- issue: Bedeutung des Eroberungsbegriffs חֵרֶם
  choice: dem Bann verfallen
  alternative: zur Vernichtung geweiht
  rationale: „Dem Bann verfallen“ wahrt die Vorstellung unwiderruflicher Übereignung an Jahwe und verschweigt dank der Fußnote nicht, dass diese hier durch Vernichtung vollzogen wird. „Zur Vernichtung geweiht“ wäre expliziter, könnte aber die breitere Bedeutung des Begriffs zu stark auf den Vollzug reduzieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur ist flüssig, bewahrt aber den umfassenden Charakter des Banns und den scharfen Kontrast zur Ausnahme Rahabs. Der Gottesname wird gemäß der vorgelegten englischen Konsultationsfassung als „Jahwe“ wiedergegeben.
