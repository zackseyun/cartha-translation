  source_fidelity: 'Der deutsche Text gibt die hebräische Aussage vollständig wieder: Die Stadt und alles in ihr werden verbrannt; Silber, Gold sowie Geräte/Gegenstände aus Bronze und Eisen sind ausdrücklich ausgenommen und werden in die Schatzkammer des Hauses Jahwes gebracht. „Mit Feuer“ entspricht dem instrumentalen בָּאֵשׁ; die Ausnahmefunktion von רַק bleibt mit „Nur“ klar erhalten.'
