  terminology: „Jahwe“ ist eine sachgerechte deutsche Wiedergabe von יְהוָה. „Gegenstände aus Bronze und Eisen“ bewahrt die semantische Weite von כְּלֵי; die Fußnote nennt legitime engere Alternativen. „Haus Jahwes“ vermeidet die übermäßig spezifische, in diesem Kontext potenziell anachronistische Bezeichnung „Tempel“.
