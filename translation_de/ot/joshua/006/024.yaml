  variant: modern standard German
source:
  edition: WLC
  text: וְ/הָ/עִ֛יר שָׂרְפ֥וּ בָ/אֵ֖שׁ וְ/כָל אֲשֶׁר בָּ֑/הּ רַ֣ק הַ/כֶּ֣סֶף וְ/הַ/זָּהָ֗ב וּ/כְלֵ֤י הַ/נְּחֹ֨שֶׁת֙ וְ/הַ/בַּרְזֶ֔ל נָתְנ֖וּ אוֹצַ֥ר בֵּית יְהוָֽה־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/024.yaml
  text: And they burned the city with fire[a], and everything that was in it. Only the silver and the gold, and the articles of bronze and iron, they put into the treasury of the house of Yahweh.
translation:
  language: de
  text: Und die Stadt verbrannten sie mit Feuer samt allem, was darin war. Nur das Silber und das Gold sowie die Gegenstände[a] aus Bronze und Eisen legten sie in die Schatzkammer des Hauses Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Geräte“ beziehungsweise „Gefäße“. Das hebräische Wort kann allgemein Gegenstände, Geräte, Gebrauchsgegenstände oder Gefäße bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרְפוּ בָאֵשׁ
  choice: verbrannten sie mit Feuer
  rationale: Das Qal-Perfekt שָׂרְפוּ bezeichnet das Verbrennen; בָאֵשׁ gibt idiomatisch das Mittel an. Die Wortstellung bewahrt die Hervorhebung der Stadt, bleibt aber im Deutschen natürlich.
- source_word: וְכָל אֲשֶׁר בָּהּ
  choice: samt allem, was darin war
  rationale: Die Formulierung erfasst umfassend den gesamten Inhalt der Stadt und verbindet ihn im Deutschen klar mit ihrer Verbrennung.
- source_word: רַק
  choice: Nur
  rationale: רַק kennzeichnet hier die Metalle als Ausnahme von der unmittelbar zuvor beschriebenen Vernichtung.
- source_word: הַכֶּסֶף וְהַזָּהָב
  choice: das Silber und das Gold
  rationale: Die bestimmten Artikel des Hebräischen werden beibehalten und unterstützen den aufzählenden Charakter.
- source_word: וּכְלֵי הַנְּחֹשֶׁת וְהַבַּרְזֶל
  choice: sowie die Gegenstände aus Bronze und Eisen
  rationale: כְּלֵי ist ein weiter Begriff für Gegenstände, Geräte oder Gefäße. „Gegenstände“ vermeidet eine unbegründete Einengung; „Bronze“ gibt נְחֹשֶׁת in diesem sachlichen Zusammenhang angemessen wieder.
- source_word: נָתְנוּ
  choice: legten sie
  rationale: נתן bedeutet hier, die Metalle an ihrem vorgesehenen Aufbewahrungsort zu deponieren. „legten“ ist präzise und idiomatisch.
- source_word: אוֹצַר בֵּית יְהוָה
  choice: in die Schatzkammer des Hauses Jahwes
  rationale: אוֹצַר bezeichnet hier den Aufbewahrungsort für die dem Heiligtum bestimmten Wertgegenstände. „Haus“ bewahrt die Quellformulierung und vermeidet das in Josuas Zeit möglicherweise zu spezifische „Tempel“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den offenbarten Eigennamen in der geläufigen deutschen Form wieder.
- issue: Bestimmung der Metalle für das Heiligtum
  choice: in die Schatzkammer des Hauses Jahwes
  alternative: in die Schatzkammer, die zum Haus Jahwes gehörte
  rationale: Die hebräische Status-constructus-Verbindung bezeichnet die Schatzkammer des Hauses Jahwes. Die knappe Wiedergabe bewahrt die kultische Zuordnung, ohne zusätzliche Einzelheiten einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht markierte Satzstellung „die Stadt verbrannten sie“ spiegelt die Hervorhebung des hebräischen Objekts, ohne altertümlich zu wirken. Der Fußnotenmarker steht unmittelbar bei dem mehrdeutigen Ausdruck, auf den sich die Anmerkung bezieht.
