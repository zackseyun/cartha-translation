source:
  edition: WLC
  text: וְ/סַבֹּתֶ֣ם אֶת הָ/עִ֗יר כֹּ֚ל אַנְשֵׁ֣י הַ/מִּלְחָמָ֔ה הַקֵּ֥יף אֶת הָ/עִ֖יר פַּ֣עַם אֶחָ֑ת כֹּ֥ה תַעֲשֶׂ֖ה שֵׁ֥שֶׁת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/003.yaml
  text: You shall march around the city[a], all the men of war, circling the city once. Thus you shall do for six days.
translation:
  language: de
  text: Und ihr alle, die Krieger, sollt um die Stadt ziehen und die Stadt einmal umrunden. So sollst du es sechs Tage lang tun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְסַבֹּתֶם
  choice: Und ihr sollt um … ziehen
  rationale: Die Form richtet sich in der zweiten Person Plural an die an der Umrundung Beteiligten. „Um … ziehen“ gibt die Bewegung um die Stadt natürlich und im militärischen Zusammenhang passend wieder.
- source_word: הָעִיר
  choice: die Stadt
  rationale: Der hebräische Text nennt Jericho hier nicht beim Namen, sondern verwendet das bestimmte allgemeine Substantiv; daher bleibt „die Stadt“ erhalten.
- source_word: כֹּל אַנְשֵׁי הַמִּלְחָמָה
  choice: alle Krieger
  rationale: Die Wendung bedeutet wörtlich „alle Männer des Krieges/Kampfes“. „Alle Krieger“ ist im heutigen Deutsch natürlich, prägnant und bewahrt den männlichen Bezug auf die bewaffneten Männer.
- source_word: הַקֵּיף
  choice: und … umrunden
  rationale: Die Form nimmt die bereits genannte Bewegung um die Stadt verstärkend beziehungsweise erläuternd wieder auf. Die Wiederholung wird im Deutschen bewusst beibehalten, ohne die Formulierung unnötig schwerfällig zu machen.
- source_word: פַּעַם אֶחָת
  choice: einmal
  rationale: Dies ist die natürliche deutsche Wiedergabe der hebräischen Angabe für einen einzigen Umlauf.
- source_word: כֹּה
  choice: So
  rationale: Das Adverb verweist auf die gerade vorgeschriebene Vorgehensweise; „so“ ist klarer und gegenwärtiger als das gehobenere „also“ oder „dergestalt“.
- source_word: תַעֲשֶׂה
  choice: sollst du es … tun
  rationale: Die zweite Person Singular richtet sich an Josua. Das Pronomen „es“ macht den Rückbezug im Deutschen natürlich, ohne den Wechsel vom Plural zum Singular einzuebnen.
- source_word: שֵׁשֶׁת יָמִים
  choice: sechs Tage lang
  rationale: Die Formulierung bezeichnet die Dauer der wiederholten Handlung. „Sechs Tage lang“ drückt dies im Deutschen idiomatisch aus.
theological_decisions:
- issue: Geschlechtsspezifische Wiedergabe von אַנְשֵׁי הַמִּלְחָמָה
  choice: alle Krieger
  alternative: 'alle Kämpfenden; alle kampffähigen Männer; wörtlich: alle Männer des Krieges'
  rationale: Der Ausdruck bezeichnet männliche Kriegsteilnehmer. „Krieger“ bewahrt diesen Bezug in natürlichem modernem Deutsch, ohne eine geschlechtsneutrale Bedeutung einzutragen.
- issue: Wechsel der angesprochenen Personenzahl
  choice: zunächst Plural „ihr sollt“, danach Singular „sollst du“
  alternative: beide Aussagen einheitlich im Plural oder beide im Singular wiedergeben
  rationale: 'Der hebräische Text wechselt von der zweiten Person Plural zur zweiten Person Singular. Die Übersetzung erhält diese Spannung: Die Krieger führen den Zug aus, während Josua anschließend als verantwortlicher Adressat angesprochen wird.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Aussage über das Umziehen beziehungsweise Umrunden der Stadt und der auffällige Wechsel vom pluralischen „ihr“ zum singularischen „du“ bleiben erhalten. „Krieger“ ist natürlicher als das heute altertümlich wirkende „Kriegsmänner“.
