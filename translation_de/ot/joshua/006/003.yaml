revisions:
- from: Und ihr sollt um die Stadt ziehen, alle Krieger[a], und die Stadt einmal umrunden. So sollst du es sechs Tage lang tun.
  to: Und ihr alle, die Krieger, sollt um die Stadt ziehen und die Stadt einmal umrunden. So sollst du es sechs Tage lang tun.
  rationale: Die Apposition wird in eine natürliche deutsche Stellung gebracht, ohne den Wechsel von pluralischem „ihr“ zu singularischem „du“ oder die wiederholte Aussage über die Stadt aufzugeben. Die Fußnote behält die wörtliche Formulierung bei und ersetzt eine zu weite Alternative durch eine näher am Ausgangstext liegende.
