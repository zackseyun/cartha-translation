base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/004.yaml
  text: And seven priests shall carry seven ram’s-horn trumpets before the ark. On the seventh day you shall march around the city seven times[a], and the priests shall blow the trumpets.
translation:
  language: de
  text: Und sieben Priester sollen sieben Widderhornposaunen[a] vor der Lade hertragen. Am siebten Tag sollt ihr siebenmal um die Stadt ziehen, und die Priester sollen die Posaunen blasen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sieben Widderhörner«. Der hebräische Ausdruck bezeichnet Horninstrumente, die wahrscheinlich aus Widderhörnern gefertigt waren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂאוּ
  choice: sollen … hertragen
  rationale: נשא bedeutet hier konkret »tragen«. »Vor der Lade hertragen« gibt zusammen mit לִפְנֵי die Position der Priester in der Prozession natürlich wieder.
- source_word: שׁוֹפְרוֹת הַיּוֹבְלִים
  choice: Widderhornposaunen
  rationale: שׁוֹפָר bezeichnet ein Horninstrument; die ergänzende Bezeichnung הַיּוֹבְלִים weist hier wahrscheinlich auf Widderhörner. »Widderhornposaunen« macht sowohl Herkunft als auch Instrumentenfunktion verständlich, ohne den Ausdruck irreführend mit dem Erlassjahr zu verbinden.
- source_word: לִפְנֵי הָאָרוֹן
  choice: vor der Lade
  rationale: לִפְנֵי bezeichnet die räumliche Position »vor«. »Bundeslade« wäre zwar kontextuell zutreffend, würde aber ein in diesem Vers nicht ausdrücklich vorhandenes Bestimmungswort ergänzen.
- source_word: תָּסֹבּוּ אֶת הָעִיר
  choice: sollt ihr … um die Stadt ziehen
  rationale: סבב bezeichnet das Umkreisen oder Herumgehen. »Um die Stadt ziehen« passt zur angeordneten Prozession und bleibt näher am Hebräischen als eine ausdrücklich militärische Formulierung.
- source_word: שֶׁבַע פְּעָמִים
  choice: siebenmal
  rationale: פְּעָמִים bezeichnet bei einer wiederholten Handlung die Anzahl der Male; die zusammengeschriebene deutsche Form ist idiomatisch.
- source_word: יִתְקְעוּ בַּשּׁוֹפָרוֹת
  choice: sollen die Posaunen blasen
  rationale: תקע mit ב und שׁוֹפָר ist die übliche Wendung für das Blasen eines Horninstruments. Nach der genaueren Erstbezeichnung genügt bei der Wiederholung »die Posaunen«.
