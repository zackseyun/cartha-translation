revisions:
- from: Da erhob das Volk ein lautes Geschrei, und die Hörner[a] wurden geblasen. Als das Volk den Schall des Horns hörte, erhob es ein gewaltiges Geschrei. Da stürzte die Mauer an Ort und Stelle ein[b]. Das Volk zog hinauf in die Stadt, jeder Mann geradewegs vor sich hin, und sie nahmen die Stadt ein.
  to: Da schrie das Volk auf, und sie bliesen die Hörner[a]. Als das Volk den Klang des Horns hörte, erhob es ein gewaltiges Geschrei. Da stürzte die Mauer an Ort und Stelle ein[b]. Das Volk zog hinauf in die Stadt, jeder Mann geradeaus vor sich hin, und sie nahmen die Stadt ein.
  rationale: 'Die Revision entfernt die nicht ausdrücklich im ersten Ruf vorhandene Verstärkung, stellt das Aktiv des Hornblasens wieder her und präzisiert die kulturelle Fußnote. Die schwierige Wendung über den Fall der Mauer wird nicht dogmatisch aufgelöst: Der verständliche Haupttext wird durch eine Fußnote mit der ungewöhnlichen hebräischen Formulierung und ihren möglichen Sinnrichtungen abgesichert.'
