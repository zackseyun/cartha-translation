source:
  edition: WLC
  text: וַ/יָּ֣רַע הָ/עָ֔ם וַֽ/יִּתְקְע֖וּ בַּ/שֹּֽׁפָר֑וֹת וַ/יְהִי֩ כִ/שְׁמֹ֨עַ הָ/עָ֜ם אֶת ק֣וֹל הַ/שּׁוֹפָ֗ר וַ/יָּרִ֤יעוּ הָ/עָם֙ תְּרוּעָ֣ה גְדוֹלָ֔ה וַ/תִּפֹּ֨ל הַֽ/חוֹמָ֜ה תַּחְתֶּ֗י/הָ וַ/יַּ֨עַל הָ/עָ֤ם הָ/עִ֨ירָ/ה֙ אִ֣ישׁ נֶגְדּ֔/וֹ וַֽ/יִּלְכְּד֖וּ אֶת הָ/עִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/020.yaml
  text: So the people shouted[a], and they blew the trumpets. And when the people heard the sound of the trumpet, the people shouted a great shout, and the wall fell down beneath it, and the people went up into the city, each man straight before him[b], and they captured the city.
translation:
  language: de
  text: Da schrie das Volk auf, und sie bliesen die Hörner[a]. Als das Volk den Klang des Horns hörte, erhob es ein gewaltiges Geschrei. Da stürzte die Mauer an Ort und Stelle ein[b]. Das Volk zog hinauf in die Stadt, jeder Mann geradeaus vor sich hin, und sie nahmen die Stadt ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch schofar (Plural schofarot): ein als Signalhorn verwendetes Horn. Häufig wird es spezifischer als „Widderhorn“ bezeichnet; die Tierart wird im Vers selbst jedoch nicht genannt.'
    reason: cultural_note
  - marker: b
    text: 'Wörtlich etwa: „Die Mauer fiel unter sich selbst.“ Die ungewöhnliche hebräische Wendung kann beschreiben, dass die Mauer geradewegs nach unten oder in sich zusammenstürzte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרַע / וַיָּרִיעוּ / תְּרוּעָה
  choice: erhob ein lautes beziehungsweise gewaltiges Geschrei
  rationale: Die Wortfamilie רוע/תְּרוּעָה bezeichnet einen lauten Ruf, oft als Kampf- oder Jubelruf. „Geschrei“ bewahrt die Grundbedeutung, ohne den Ruf enger als Kriegsruf festzulegen; „gewaltig“ gibt die Verstärkung durch גְדוֹלָה wieder.
- source_word: שׁוֹפָרוֹת / שׁוֹפָר
  choice: Hörner / Horn
  rationale: Der Schofar ist ein als Signal- und Kultinstrument verwendetes Horn. „Horn“ ist im Deutschen verständlich und lässt die im Vers nicht ausdrücklich genannte genauere Tierart offen; die kulturspezifische Bezeichnung wird in einer Fußnote erläutert.
- source_word: קוֹל הַשּׁוֹפָר
  choice: der Schall des Horns
  rationale: קוֹל bedeutet „Stimme, Laut, Schall“. Bei einem Instrument ist „Schall“ natürlich und bleibt näher am allgemeinen Ausdruck als das deutendere „Hornsignal“.
- source_word: וַתִּפֹּל הַחוֹמָה תַּחְתֶּיהָ
  choice: die Mauer stürzte an Ort und Stelle ein
  rationale: Die ungewöhnliche Wendung bedeutet wörtlich etwa, dass die Mauer „unter sich/an ihrer Stelle“ fiel, und kann ein senkrechtes Zusammenstürzen bezeichnen. Die Haupttextfassung ist verständlich, während die formale Schwierigkeit in der Fußnote offengelegt wird.
- source_word: וַיַּעַל ... הָעִירָה
  choice: zog hinauf in die Stadt
  rationale: עלה bezeichnet die Bewegung nach oben; die Richtungsendung an עִירָה zeigt die Bewegung zur Stadt beziehungsweise in sie hinein an. „Zog“ passt zum kollektiven Vorrücken, ohne die zusätzliche Intensität von „stürmte“ einzutragen.
- source_word: אִישׁ נֶגְדּוֹ
  choice: jeder Mann geradewegs vor sich hin
  rationale: אִישׁ ist distributiv und ausdrücklich maskulin; נֶגְדּוֹ bezeichnet den Bereich unmittelbar vor dem jeweiligen Mann. Die Fassung bewahrt beides in natürlichem Deutsch.
- source_word: וַיִּלְכְּדוּ
  choice: sie nahmen die Stadt ein
  rationale: לכד bezeichnet in militärischen Erzählungen das Erobern oder Einnehmen einer Stadt. „Einnehmen“ ist die übliche und klare deutsche Formulierung.
theological_decisions:
- issue: Maskuliner distributiver Ausdruck אִישׁ נֶגְדּוֹ
  choice: jeder Mann geradewegs vor sich hin
  alternative: jeder geradewegs vor sich hin
  rationale: Die maskuline Einzelform wird bewahrt, weil der hebräische Text die Vorrückenden distributiv als אִישׁ bezeichnet. Eine geschlechtsneutrale Wiedergabe wäre zwar idiomatisch, würde diese Form jedoch einebnen.
- issue: Art des lauten Rufs
  choice: Geschrei
  alternative: Kampfgeschrei
  rationale: Der Zusammenhang ist militärisch, doch רוע/תְּרוּעָה kann auch andere laute Rufe bezeichnen. Die Übersetzung vermeidet daher eine unnötige Festlegung auf eine ausschließlich militärische Bedeutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählbewegung. Die Wiederholung von „Volk“ und „Geschrei“ nimmt die hebräische Wiederholung auf. Das Passiv „die Hörner wurden geblasen“ gibt den hebräischen Plural wieder, ohne die im unmittelbaren Satz nicht ausdrücklich genannten Bläser zu identifizieren.
