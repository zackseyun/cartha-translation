source:
  edition: WLC
  text: וַ/יְהִי֙ בַּ/פַּ֣עַם הַ/שְּׁבִיעִ֔ית תָּקְע֥וּ הַ/כֹּהֲנִ֖ים בַּ/שּׁוֹפָר֑וֹת וַ/יֹּ֨אמֶר יְהוֹשֻׁ֤עַ אֶל הָ/עָם֙ הָרִ֔יעוּ כִּֽי נָתַ֧ן יְהוָ֛ה לָ/כֶ֖ם אֶת הָ/עִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/016.yaml
  text: And it happened at the seventh time[a], when the priests blew the trumpets, that Joshua said to the people, “Shout, for Yahweh has given you the city.”
translation:
  language: de
  text: 'Beim siebten Mal, als die Priester die Schofarhörner[a] bliesen, sagte Josua zum Volk: »Schreit laut! Denn Jahwe hat euch die Stadt gegeben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Schofar ist ein aus einem Tierhorn gefertigtes Blasinstrument, traditionell meist ein Widderhorn.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּפַּעַם הַשְּׁבִיעִית
  choice: Beim siebten Mal
  rationale: Die hebräische Ereignisformel leitet den nächsten Handlungsschritt ein. Im Deutschen wird ihre Erzählfunktion natürlich durch den temporalen Satzanfang wiedergegeben, ohne das schwerfällige »Und es geschah«.
- source_word: תָּקְעוּ
  choice: bliesen
  rationale: תקע bezeichnet zusammen mit שופר das Blasen beziehungsweise Ertönenlassen eines Horninstruments.
- source_word: שׁוֹפָרוֹת
  choice: Schofarhörner
  rationale: Die Wiedergabe bewahrt die konkrete Bezeichnung des hebräischen Horninstruments und bleibt für heutige Leser verständlich; eine Fußnote nennt die traditionelle genauere Einordnung.
- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: Natürliche deutsche Wiedergabe der üblichen hebräischen Redeeinleitung.
- source_word: הָרִיעוּ
  choice: Schreit laut!
  rationale: Der Imperativ fordert zu einem lauten gemeinschaftlichen Ruf auf. Die Formulierung bleibt offen dafür, ob der Ruf als Kampf-, Sieges- oder Jubelruf verstanden wird.
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion führt die Begründung für den vorausgehenden Befehl ein.
- source_word: נָתַן
  choice: hat ... gegeben
  rationale: Das hebräische Perfekt stellt die Übergabe der Stadt als vollendete und gewisse Tatsache dar, obwohl ihre Einnahme in der Erzählung unmittelbar bevorsteht.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הָעִיר
  choice: die Stadt
  rationale: Die bestimmte Form verweist im Zusammenhang auf Jericho, während die Übersetzung die ausdrückliche hebräische Bezeichnung »die Stadt« bewahrt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. »Jahwe« wahrt dessen Charakter als Eigenname; »der HERR« wäre die traditionelle ersetzende Lesung, steht aber nicht als Titel im hebräischen Konsonantentext.
- issue: Zeitwert von נָתַן
  choice: hat euch die Stadt gegeben
  alternative: wird euch die Stadt geben
  rationale: Die vollendete Verbform wird nicht zu einem Futur umgedeutet. Sie stellt die göttliche Zusage aus Josuas Perspektive als bereits feststehende Wirklichkeit dar und bewahrt so die Spannung zwischen Zusage und noch bevorstehender Einnahme.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der temporale Satzanfang bildet die hebräische Erzählfolge idiomatisch ab. »Schreit laut« vermeidet die interpretierende Festlegung auf einen Kriegs-, Sieges- oder Jubelruf.
