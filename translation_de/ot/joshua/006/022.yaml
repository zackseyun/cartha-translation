base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/022.yaml
  text: And to the two men who had spied out the land[a], Joshua said, “Go into the house of the prostitute and bring out from there the woman and all that belongs to her, just as you swore to her.”
translation:
  language: de
  text: 'Zu den beiden Männern, die das Land ausgekundschaftet hatten, sagte Josua: »Geht in das Haus der Prostituierten und bringt die Frau und alles, was ihr gehört, von dort heraus, wie ihr es ihr geschworen habt.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלִשְׁנַיִם הָאֲנָשִׁים
  choice: Zu den beiden Männern
  rationale: Die Verbindung aus ו und ל kennzeichnet den Übergang und die Angesprochenen. Im Deutschen ist die Voranstellung ohne ein zusätzliches »Und« natürlich und bewahrt den indirekten Objektbezug.
- source_word: הַמְרַגְּלִים אֶת הָאָרֶץ
  choice: die das Land ausgekundschaftet hatten
  rationale: Das Partizip von רגל bezeichnet hier die zuvor durchgeführte Erkundung; das Plusquamperfekt macht den zeitlichen Bezug im Deutschen klar.
- source_word: בֹּאוּ בֵּית
  choice: Geht in das Haus
  rationale: בוא bedeutet grundsätzlich hineingehen beziehungsweise kommen. Aus Josuas Sprecherperspektive ist der deutsche Imperativ »Geht« idiomatisch.
- source_word: הָאִשָּׁה הַזּוֹנָה
  choice: der Prostituierten
  rationale: זוֹנָה bezeichnet klar eine Prostituierte. Die deutsche Substantivierung gibt die appositionale hebräische Wendung natürlich wieder, ohne das altertümliche »Hure« zu verwenden.
- source_word: וְהוֹצִיאוּ מִשָּׁם
  choice: und führt … von dort heraus
  rationale: Der Hifil von יצא bedeutet »herausführen/herausbringen«; »von dort« gibt מִשָּׁם ausdrücklich wieder.
- source_word: אֶת הָאִשָּׁה
  choice: die Frau
  rationale: Der hebräische Text wiederholt »die Frau« statt eines Pronomens; diese Wiederholung bleibt erhalten.
- source_word: וְאֶת כָּל אֲשֶׁר לָהּ
  choice: und alle, die zu ihr gehören
  rationale: כָּל אֲשֶׁר לָהּ ist weit gefasst. Im unmittelbaren Kontext (vgl. die zugesagte Rettung ihrer Angehörigen) sind vor allem die bei ihr befindlichen Menschen gemeint; »alle« bewahrt zugleich die umfassende Formulierung.
- source_word: כַּאֲשֶׁר נִשְׁבַּעְתֶּם לָהּ
  choice: wie ihr es ihr geschworen habt
  rationale: Die Vergleichskonstruktion begründet den Befehl mit dem Eid der Kundschafter; »es« macht den Bezug im Deutschen idiomatisch.
theological_decisions:
- issue: Bezeichnung Rahabs als זוֹנָה
  choice: Prostituierte
  alternative: Hure
  rationale: »Prostituierte« gibt die Bedeutung des hebräischen Wortes in heutigem, sachlichem Deutsch wieder und vermeidet sowohl Euphemisierung als auch unnötig abwertende oder altertümliche Sprache.
- issue: Umfang von כָּל אֲשֶׁר לָהּ
  choice: alle, die zu ihr gehören
  alternative: alles, was ihr gehört
  rationale: Der Erzählzusammenhang bezieht den Ausdruck auf Rahabs Familie und weitere unter ihrem Schutz versammelte Personen, nicht bloß auf Besitz. Die personale Wiedergabe vermeidet eine sachliche Lesart, ohne den Kreis enger zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Direkte Rede mit deutschen Anführungszeichen; klare narrative Syntax ohne Archaismen.
