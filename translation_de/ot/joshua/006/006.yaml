source:
  edition: WLC
  text: וַ/יִּקְרָ֞א יְהוֹשֻׁ֤עַ בִּן נוּן֙ אֶל הַ/כֹּ֣הֲנִ֔ים וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם שְׂא֖וּ אֶת אֲר֣וֹן הַ/בְּרִ֑ית וְ/שִׁבְעָ֣ה כֹֽהֲנִ֗ים יִשְׂאוּ֙ שִׁבְעָ֤ה שֽׁוֹפְרוֹת֙ יוֹבְלִ֔ים לִ/פְנֵ֖י אֲר֥וֹן יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/006.yaml
  text: So Joshua son of Nun called the priests and said to them[a], “Carry the ark of the covenant[b], and let seven priests carry seven ram’s-horn trumpets before the ark of Yahweh.”
translation:
  language: de
  text: 'Da rief Josua, der Sohn Nuns, die Priester und sagte zu ihnen: »Tragt die Bundeslade! Sieben Priester sollen sieben Widderhorn-Trompeten[a] vor der Lade Jahwes[b] hertragen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann auch als „sieben Trompeten aus Widderhörnern“ wiedergegeben werden. Es ist sprachlich mit der Bezeichnung des Jubeljahrs verbunden.
    reason: lexikalische Alternative
  - marker: b
    text: 'Hebräisch: JHWH. Traditionell wird der Gottesname mit „der HERR“ wiedergegeben.'
    reason: Wiedergabe des Gottesnamens
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: rief
  rationale: Das Qal wayyiqtol von קרא leitet hier Josuas Anrede an die Priester ein. „Rief“ ist natürlich und gibt weder eine förmliche Vorladung noch bloßes lautes Rufen zwingend vor.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Josua, der Sohn Nuns
  rationale: Die herkömmliche deutsche Namensform „Josua“ und die natürliche Wiedergabe der Abstammungsangabe bewahren den Sinn des Hebräischen.
- source_word: הַכֹּהֲנִים
  choice: die Priester
  rationale: Dies ist die übliche und sachlich genaue Wiedergabe von כֹּהֵן im kultischen Zusammenhang.
- source_word: שְׂאוּ אֶת אֲרוֹן הַבְּרִית
  choice: Tragt die Bundeslade
  rationale: נשׂא bezeichnet hier das Tragen der Lade. „Bundeslade“ ist die geläufige, knappe Wiedergabe der Konstruktion אֲרוֹן הַבְּרִית.
- source_word: וְשִׁבְעָה כֹהֲנִים יִשְׂאוּ
  choice: Sieben Priester sollen … hertragen
  rationale: Das Imperfekt setzt die Anweisung nach dem Imperativ fort. „Sollen“ bringt diesen direktiven Sinn im Deutschen klar zum Ausdruck; „hertragen“ verdeutlicht die Stellung an der Spitze der Prozession.
- source_word: שִׁבְעָה שׁוֹפְרוֹת יוֹבְלִים
  choice: sieben Widderhorn-Trompeten
  rationale: שׁוֹפָר bezeichnet ein Blas- beziehungsweise Signalhorn; יוֹבְלִים bestimmt hier wahrscheinlich das Material oder die Art als Widderhörner. Die Zusammensetzung ist verständlich und vermeidet die missverständliche Deutung als „Jubiläumstrompeten“.
- source_word: לִפְנֵי
  choice: vor
  rationale: Die Präposition bezeichnet hier die räumliche Position der Priester in der Prozession.
- source_word: אֲרוֹן יְהוָה
  choice: Lade Jahwes
  rationale: Die Konstruktion verbindet die Lade unmittelbar mit dem Gottesnamen יהוה. „Jahwe“ gibt den Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Tetragrammaton als Gottes Eigennamen. „Jahwe“ bewahrt diese Namensfunktion; die traditionelle Ersatzlesung „der HERR“ bleibt in der Fußnote genannt.
- issue: Bedeutung von יוֹבְלִים in der Bezeichnung der Hörner
  choice: Widderhorn-Trompeten
  alternative: Jubelhörner beziehungsweise Jubiläumstrompeten
  rationale: Im Zusammenhang mit שׁוֹפָר bezeichnet יוֹבֵל hier wahrscheinlich das Widderhorn und nicht das später so bezeichnete Erlass- oder Jubeljahr. Die Fußnote hält die sprachliche Verbindung zum „Jubeljahr“ offen, ohne sie in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Hauptsatz bleibt knapp und erzählerisch; die direkte Rede wahrt den befehlenden Charakter. „Bundeslade“ und „Priester“ sind allgemein verständliche, etablierte biblische Begriffe.
