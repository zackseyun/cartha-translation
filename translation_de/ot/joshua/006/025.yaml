  text: וְֽ/אֶת רָחָ֣ב הַ֠/זּוֹנָה וְ/אֶת בֵּ֨ית אָבִ֤י/הָ וְ/אֶת כָּל אֲשֶׁר לָ/הּ֙ הֶחֱיָ֣ה יְהוֹשֻׁ֔עַ וַ/תֵּ֨שֶׁב֙ בְּ/קֶ֣רֶב יִשְׂרָאֵ֔ל עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֤י הֶחְבִּ֨יאָה֙ אֶת הַ/מַּלְאָכִ֔ים אֲשֶׁר שָׁלַ֥ח יְהוֹשֻׁ֖עַ לְ/רַגֵּ֥ל אֶת יְרִיחֽוֹ־־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/025.yaml
  text: But Joshua kept Rahab the prostitute alive[a], along with her father's household and all that belonged to her, and she has lived in the midst of Israel to this day[b], because she hid the messengers whom Joshua sent to spy out Jericho.
translation:
  language: de
  text: Doch Josua ließ die Prostituierte Rahab[a] am Leben, ebenso den Haushalt ihres Vaters und alles, was ihr gehörte. Sie lebt bis zum heutigen Tag mitten in Israel, weil sie die Boten versteckt hatte, die Josua ausgesandt hatte, um Jericho auszukundschaften.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die Hure.'
    reason: Lexikalische Alternative; die traditionelle Wiedergabe ist möglich, klingt im heutigen Deutsch jedoch oft abwertender.
lexical_decisions:
- source_word: הַזּוֹנָה
  choice: die Prostituierte
  rationale: זוֹנָה bezeichnet hier eine Frau, die der Prostitution nachgeht. „Prostituierte“ ist im heutigen Deutsch klar und sachlich; „Hure“ ist traditionell, wirkt jedoch häufig abwertend.
- source_word: בֵּית אָבִיהָ
  choice: die Familie ihres Vaters
  rationale: Wörtlich steht „das Haus ihres Vaters“. Gemeint ist im Zusammenhang die zum Vater gehörende Familien- und Hausgemeinschaft, nicht nur ein Gebäude.
- source_word: כָּל אֲשֶׁר לָהּ
  choice: alles, was ihr gehörte
  rationale: Die umfassende Formulierung lässt offen, ob Besitz, abhängige Personen oder beides eingeschlossen sind, und legt sich nicht unnötig fest.
- source_word: הֶחֱיָה
  choice: ließ … am Leben
  rationale: Der Hifil von חיה bedeutet, jemanden am Leben zu lassen beziehungsweise sein Leben zu erhalten. Die gewählte Formulierung gibt den kausativen Sinn natürlich wieder.
- source_word: וַתֵּשֶׁב
  choice: sie lebt
  rationale: In Verbindung mit „bis zum heutigen Tag“ bezeichnet das Verb einen vom damaligen Geschehen bis in die Erzählgegenwart fortdauernden Zustand.
- source_word: בְּקֶרֶב יִשְׂרָאֵל
  choice: mitten in Israel
  rationale: Die Formulierung bildet die hebräische Wendung eng ab und hält fest, dass Rahab innerhalb Israels lebt, ohne weitergehende theologische Folgerungen einzutragen.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: bis zum heutigen Tag
  rationale: Dies ist eine natürliche deutsche Wiedergabe der festen hebräischen Zeitangabe, die bis zur Gegenwart des Erzählers reicht.
- source_word: הֶחְבִּיאָה
  choice: versteckt hatte
  rationale: Der Hifil von חבא bedeutet hier „verstecken“ oder „verbergen“. Das Plusquamperfekt verdeutlicht im Deutschen, dass dies vor Josuas Verschonung geschehen war.
- source_word: הַמַּלְאָכִים
  choice: die Boten
  rationale: מַלְאָכִים bedeutet lexikalisch „Boten“. Ihre besondere Aufgabe als Kundschafter wird durch den folgenden Zwecksatz erklärt.
- source_word: לְרַגֵּל
  choice: um … auszukundschaften
  rationale: רגל bezeichnet hier das heimliche Erkunden zu militärischen Zwecken. „Auszukundschaften“ ist klar und idiomatisch.
theological_decisions:
- issue: Rahabs fortdauernder Aufenthalt innerhalb Israels
  choice: Sie lebt bis zum heutigen Tag mitten in Israel
  alternative: Sie ließ sich unter den Israeliten nieder
  rationale: Die gewählte Fassung bewahrt sowohl die zeitliche Fortdauer als auch die Aussage über Rahabs Leben innerhalb Israels, ohne den Vers durch spätere Aussagen über ihren Status oder ihre Nachkommenschaft zu ergänzen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Doch“ macht den Gegensatz zur Vernichtung Jerichos im unmittelbaren Zusammenhang sichtbar. Die Satzteilung vermeidet einen überladenen deutschen Satz, ohne die inhaltlichen Beziehungen zu verändern.
