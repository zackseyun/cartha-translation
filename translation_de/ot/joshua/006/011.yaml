  - severity: medium
    issue: Fußnote beschreibt die kausative Deutung als unmittelbarste Lesart
    rationale: Die Fußnote verstärkt die unbelegte Umdeutung zu „Er ließ …“. Zwar kann die Hifil-Form semantisch einen Umlauf ausdrücken, doch die syntaktische Subjektstellung der Lade ist im deutschen Haupttext zu bewahren. Ein Hinweis darf allenfalls die erzählerische Personifizierung erläutern.
