  text: וַ/יַּסֵּ֤ב אֲרוֹן יְהוָה֙ אֶת הָ/עִ֔יר הַקֵּ֖ף פַּ֣עַם אֶחָ֑ת וַ/יָּבֹ֨אוּ֙ הַֽ/מַּחֲנֶ֔ה וַ/יָּלִ֖ינוּ בַּֽ/מַּחֲנֶֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/011.yaml
  text: So the ark of Yahweh went around the city[a], circling it once. Then they came into the camp and spent the night in the camp.
translation:
  language: de
  text: So zog die Lade Jahwes einmal um die Stadt herum.[a] Dann kamen sie ins Lager und verbrachten die Nacht im Lager.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich ist die Lade Jahwes das Subjekt des Satzes und wird erzählerisch so dargestellt, als ziehe sie selbst um die Stadt. Nach dem Zusammenhang wurde sie von Priestern getragen.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: וַיַּסֵּב
  choice: ließ er … umrunden
  rationale: Die Hifil-Form von סבב wird kausativ wiedergegeben. Das im Verb enthaltene männliche Subjekt bleibt wie im Hebräischen unausgesprochen; aus dem Zusammenhang liegt Josua nahe.
- source_word: אֲרוֹן יְהוָה
  choice: die Lade Jahwes
  rationale: Die Status-constructus-Verbindung bezeichnet die Bundeslade als Jahwes Lade. „Jahwe“ gibt den Gottesnamen יְהוָה wieder.
- source_word: אֶת הָעִיר הַקֵּף פַּעַם אֶחָת
  choice: einmal die Stadt umrunden
  rationale: Die ergänzende Kreislaufwendung präzisiert die Bewegung als einen vollständigen Umlauf; פַּעַם אֶחָת wird idiomatisch mit „einmal“ wiedergegeben.
- source_word: וַיָּבֹאוּ הַמַּחֲנֶה
  choice: Dann kamen sie ins Lager
  rationale: בוא bezeichnet hier das Hineinkommen in das Lager. „Kamen“ vermeidet die interpretativ stärkere Wiedergabe „kehrten zurück“.
- source_word: וַיָּלִינוּ בַּמַּחֲנֶה
  choice: und verbrachten die Nacht im Lager
  rationale: לון bedeutet, an einem Ort zu übernachten. Die Wiederholung von „Lager“ folgt der hebräischen Erzählweise.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als Eigenname wiedergegeben, ohne ihn durch einen Titel zu ersetzen.
- issue: Handelndes Subjekt beim Umzug um die Stadt
  choice: Das im Verb enthaltene „er“ veranlasst den Umlauf der Lade
  alternative: Die Lade selbst wird als grammatisches Subjekt dargestellt
  rationale: Die masoretische Hifil-Form וַיַּסֵּב ist am unmittelbarsten kausativ zu verstehen. Da die knappe Formulierung und alte Auslegungstraditionen auch eine Darstellung der Lade als handelndes Subjekt begünstigen, wird diese Möglichkeit in einer Fußnote offengehalten.
translation_notes:
  register: Moderne, klare und zugleich würdevolle Erzählsprache. Die Wiederholung von „Lager“ bleibt erhalten; die ungewöhnliche Kürze und mögliche Personifizierung der Lade werden nicht stillschweigend eingeebnet.
