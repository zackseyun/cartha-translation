source:
  edition: WLC
  text: וַ/יַּשְׁכֵּ֥ם יְהוֹשֻׁ֖עַ בַּ/בֹּ֑קֶר וַ/יִּשְׂא֥וּ הַ/כֹּהֲנִ֖ים אֶת אֲר֥וֹן יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/012.yaml
  text: Joshua rose early in the morning[a], and the priests carried the ark of Yahweh.
translation:
  language: de
  text: Josua stand früh am Morgen auf, und die Priester trugen die Lade Jahwes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: stand früh … auf
  rationale: Das Hifil von שׁכם bezeichnet hier das frühe Aufstehen. Die deutsche Wendung ist natürlich und bewahrt die zeitliche Betonung.
- source_word: יְהוֹשֻׁעַ
  choice: Josua
  rationale: Der Personenname wird nach der etablierten deutschen biblischen Namensform wiedergegeben.
- source_word: בַּבֹּקֶר
  choice: am Morgen
  rationale: Die Präpositionalfügung bedeutet wörtlich „am Morgen“; zusammen mit „früh aufstehen“ gibt sie die hebräische Hervorhebung des frühen Handelns wieder.
- source_word: וַיִּשְׂאוּ
  choice: trugen
  rationale: נשא kann „heben“, „tragen“ oder „forttragen“ bedeuten. Beim Transport der Lade ist „trugen“ die klare und kontextgerechte Wiedergabe.
- source_word: הַכֹּהֲנִים
  choice: die Priester
  rationale: Direkte Wiedergabe des bestimmten maskulinen Plurals.
- source_word: אֲרוֹן יְהוָה
  choice: die Lade Jahwes
  rationale: Die Status-constructus-Verbindung wird im Deutschen natürlich mit Genitiv wiedergegeben; „Lade“ ist die etablierte Bezeichnung für אֲרוֹן in diesem kultischen Zusammenhang.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als persönlicher Gottesname „Jahwe“ wiedergegeben, statt es durch den Titel „der HERR“ zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen; „der HERR“ wäre die traditionelle Ersatzlesung, würde aber einen Namen durch einen Titel wiedergeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt nahe am knappen hebräischen Erzählstil; „stand früh am Morgen auf“ ist verständlich und bildet die doppelte zeitliche Akzentuierung ab.
