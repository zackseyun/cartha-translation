review_pass:
  verdict: approve
  source_fidelity: 'Der deutsche Text gibt alle Elemente des Hebräischen zuverlässig wieder: Josua als Subjekt, das frühe Aufstehen am Morgen (יַשְׁכֵּם ... בַּבֹּקֶר), die Priester als Subjekt des zweiten Satzteils, das Tragen und die Lade Jahwes. Die im Hebräischen vorhandene doppelte morgendliche Akzentuierung wird angemessen bewahrt.'
  naturalness: „Josua stand früh am Morgen auf“ ist modernes, natürliches Standarddeutsch. Die Verbindung von „früh“ und „am Morgen“ ist hier keine störende Wiederholung, sondern bildet die hebräische zeitliche Hervorhebung ab. Satzbau und würdiger erzählerischer Registerton sind gelungen.
  terminology: „Josua“, „Priester“ und „Lade“ entsprechen etabliertem deutschsprachigem Bibelgebrauch. „Jahwe“ gibt das Tetragramm als Namen wieder und stimmt mit der angegebenen Projektentscheidung überein. Der Genitiv „Jahwes“ ist idiomatisch und präzise.
  issues:
  - severity: medium
    issue: 'Inkonsistenz im englischen Audit-Trail: Der englische Vers lautet „ark of Yahweh“, während die beigefügte Fußnote eine Standardwiedergabe „the LORD“ behauptet und zudem am Ausdruck „morning“ verankert ist.'
    rationale: Dies betrifft nicht den deutschen Zieltext und erfordert daher keine Änderung daran. Der englische Prüfpfad beziehungsweise die Fußnotenmetadaten sollten jedoch separat korrigiert werden, damit Text, Fußnotenanker und Namenspolitik übereinstimmen.
