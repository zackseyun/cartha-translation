  yaml_path: translation/ot/joshua/006/014.yaml
  text: On the second day they went around the city once and returned to the camp[b][a]. Thus they did for six days.
translation:
  language: de
  text: Am zweiten Tag zogen sie einmal um die Stadt und kehrten ins Lager zurück. So machten sie es sechs Tage lang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּסֹבּוּ
  choice: zogen sie … um
  rationale: סבב bezeichnet hier die Bewegung um die Stadt herum. „um die Stadt ziehen“ ist natürliches, würdiges Deutsch und fügt keinen ausdrücklich militärischen Aspekt hinzu.
- source_word: הָעִיר
  choice: die Stadt
  rationale: עִיר bedeutet gewöhnlich „Stadt“ und bezeichnet im Zusammenhang Jericho.
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: Am zweiten Tag
  rationale: Die Formulierung gibt die Zeitangabe direkt und idiomatisch wieder.
- source_word: פַּעַם אַחַת
  choice: einmal
  rationale: Die hebräische Wendung bedeutet wörtlich „ein Mal“ und wird im Deutschen am natürlichsten mit „einmal“ wiedergegeben.
- source_word: וַיָּשֻׁבוּ
  choice: und kehrten … zurück
  rationale: שוב bedeutet „zurückkehren“; die gewählte Form passt zur fortlaufenden Erzählung.
- source_word: הַמַּחֲנֶה
  choice: ins Lager
  rationale: מַחֲנֶה bedeutet „Lager“. Die deutsche Richtungsangabe „ins Lager“ gibt das im Hebräischen direkt markierte Ziel idiomatisch wieder.
- source_word: כֹּה עָשׂוּ
  choice: So machten sie es
  rationale: כֹּה bezeichnet die zuvor beschriebene Art und Weise, während עשה das allgemeine Verb „tun/machen“ ist. „So machten sie es“ ist klar und bewahrt den zusammenfassenden Charakter.
- source_word: שֵׁשֶׁת יָמִים
  choice: sechs Tage lang
  rationale: Die unmarkierte Zeitangabe bezeichnet hier die Dauer beziehungsweise Wiederholung dieses Ablaufs; „sechs Tage lang“ ist dafür die natürliche deutsche Form.
