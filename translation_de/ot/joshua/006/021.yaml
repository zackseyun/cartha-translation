base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/021.yaml
  text: And they devoted to destruction everything that was in the city[a], from man to woman, from young to old, and even ox and sheep and donkey, by the edge of the sword.
translation:
  language: de
  text: Sie weihten alles, was in der Stadt war, dem Untergang[a] – Mann und Frau, Jung und Alt, sogar Rind, Schaf und Esel – und töteten sie mit der Schärfe des Schwertes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „völlig vernichteten“ oder „dem Bann übergaben“. Das hebräische Verb bezeichnet, dass etwas unwiderruflich dem Bann und damit der Vernichtung übergeben wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲרִימוּ
  choice: sie weihten … dem Untergang
  rationale: Das Hiphil von חרם bezeichnet hier, dass Menschen und Sachen unwiderruflich dem Bann und damit der Vernichtung übergeben werden. Die Formulierung bewahrt diesen technischen Gehalt besser als das allgemeinere „sie vernichteten“.
- source_word: כָּל אֲשֶׁר בָּעִיר
  choice: alles, was in der Stadt war
  rationale: Gibt die umfassende Aussage natürlich wieder und schließt die anschließend genannten Menschen und Tiere ein.
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: Mann und Frau
  rationale: Die paarige Wendung umfasst beide Geschlechter. Im Deutschen ist „Mann und Frau“ natürlicher als eine wörtliche Wiedergabe mit „von … bis …“.
- source_word: מִנַּעַר וְעַד זָקֵן
  choice: Jung und Alt
  rationale: Die feste deutsche Paarformel gibt die hebräische Merismusformel für die gesamte Altersspanne idiomatisch wieder.
- source_word: וְעַד שׁוֹר וָשֶׂה וַחֲמוֹר
  choice: sogar Rind, Schaf und Esel
  rationale: „Sogar“ macht deutlich, dass sich die umfassende Vernichtung bis auf das Vieh erstreckte; die singularischen Gattungsbezeichnungen entsprechen dem Hebräischen und sind im Deutschen verständlich.
- source_word: לְפִי חָרֶב
  choice: mit der Schärfe des Schwertes
  rationale: Bewahrt das hebräische Bild vom „Mund“ beziehungsweise der Schneide des Schwertes, ohne die im Deutschen unübliche wörtliche Form „mit dem Mund des Schwertes“ zu verwenden.
theological_decisions:
- issue: Wiedergabe der Bannterminologie חרם im Kontext des Krieges
  choice: dem Untergang weihen
  alternative: völlig vernichten; dem Bann übergeben
  rationale: Die gewählte Formulierung erhält sowohl den kultisch-rechtlichen Gedanken der unwiderruflichen Aussonderung als auch deren tödliche Folge. Sie mildert die Gewalt nicht ab, legt aber auch keine über den hebräischen Ausdruck hinausgehende konfessionelle Deutung fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die technische Bannsprache bleibt im Haupttext erkennbar; die Fußnote nennt geläufigere Alternativen. Der Doppelpunkt strukturiert die anschließende Aufzählung, und „töteten sie“ macht die Funktion der instrumentalen Schlusswendung im Deutschen eindeutig.
